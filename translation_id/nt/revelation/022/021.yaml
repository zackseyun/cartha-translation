  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: id
  text: Kiranya anugerah Tuhan Yesus menyertai semua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Kiranya anugerah Tuhan Yesus menyertai semua orang kudus,” sedangkan naskah-naskah lain berbunyi, “menyertai kalian semua.”
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam berkat penutup Perjanjian Baru, χάρις menunjuk pada kemurahan Allah yang diberikan dengan cuma-cuma. “Anugerah” merupakan istilah Indonesia yang alami dan mempertahankan bobot relasional serta keselamatannya.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος di sini adalah gelar kristologis bagi Yesus; “Tuhan” merupakan padanan baku dan sesuai konteks.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Nama pribadi ini ditransliterasikan dalam bentuk Indonesia yang sudah baku.
- source_word: μετὰ
  choice: menyertai
  rationale: Bahasa Yunani secara harfiah hanya menyatakan “bersama semua,” tanpa verba. Dalam rumusan berkat bahasa Indonesia, “menyertai” secara alami mengungkapkan makna kehadiran bersama yang tersirat.
- source_word: πάντων
  choice: semua orang
  rationale: Bentuk maskulin jamak ini berarti “semua” tanpa pembatas dalam teks SBLGNT. “Semua orang” terdengar lengkap dalam bahasa Indonesia sambil tetap mempertahankan cakupan yang luas dan tidak menambahkan “kalian” atau “orang kudus” ke dalam teks utama.
theological_decisions:
- issue: Apakah penerima berkat perlu diperinci
  choice: 'Mempertahankan cakupan luas: “semua orang”'
  alternative: “kalian semua” atau “semua orang kudus”
  rationale: Teks SBLGNT berakhir dengan πάντων, “semua,” tanpa keterangan tambahan. Terjemahan tidak membatasi penerimanya berdasarkan bacaan varian atau tradisi terjemahan tertentu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. “Kiranya” menandai bahwa kalimat ini merupakan berkat atau doa penutup, sedangkan “menyertai” melengkapi konstruksi Yunani yang tidak memakai verba tanpa mengubah maksudnya.
