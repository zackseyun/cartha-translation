  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: id
  text: “Lihatlah, Aku segera datang[a]. Berbahagialah orang yang memegang teguh perkataan nubuat dalam kitab ini[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “datang dengan cepat”; kata Yunani ini dapat menekankan kedekatan waktu (“segera”) maupun cara kedatangan yang cepat atau tiba-tiba.
    reason: lexical_alternative
  - marker: b
    text: Atau “gulungan ini.”
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penunjuk sekaligus seruan untuk memberi perhatian, dengan ragam yang wajar dan khidmat dalam bahasa Indonesia modern.
- source_word: ἔρχομαι
  choice: Aku ... datang
  rationale: Bentuk kini Yunani yang mengarah pada kedatangan mendatang dinyatakan secara alami dalam bahasa Indonesia; pronomina Aku mempertahankan ujaran orang pertama tanpa menambahkan identitas pembicara.
- source_word: ταχύ
  choice: segera
  rationale: Dalam konteks ini terutama menyampaikan kedekatan waktu, sementara kemungkinan makna cepat atau tiba-tiba dicatat dalam catatan kaki.
- source_word: μακάριος
  choice: Berbahagialah
  rationale: Ungkapan baku dan bermartabat untuk ucapan bahagia, tanpa membatasinya pada perasaan senang semata.
- source_word: ὁ τηρῶν
  choice: orang yang berpegang pada
  rationale: Menyampaikan tindakan terus menjaga, mengindahkan, dan menaati isi nubuat tanpa mempersempit maknanya hanya menjadi ketaatan.
- source_word: τοὺς λόγους
  choice: perkataan-perkataan
  rationale: Mempertahankan bentuk jamak dan sifat konkret λόγους, alih-alih merangkumnya sebagai satu pesan.
- source_word: τῆς προφητείας
  choice: nubuat
  rationale: Mempertahankan kategori profetis teks dan hubungan genitifnya secara alami dalam frasa Indonesia.
- source_word: τοῦ βιβλίου τούτου
  choice: dalam kitab ini
  rationale: Genitif ini dipahami sebagai perkataan nubuat yang termuat dalam kitab tersebut. 'Kitab' sesuai dengan konteks tulisan suci, sedangkan bentuk material kunonya sebagai gulungan dicatat dalam catatan kaki.
theological_decisions:
- issue: Identitas pembicara dalam “Aku segera datang”
  choice: Tidak menambahkan nama pembicara; teks tetap memakai orang pertama “Aku”.
  alternative: Menambahkan “Yesus” sebagai pembicara.
  rationale: Teks Yunani hanya memberikan ujaran orang pertama. Identitas pembicara sebaiknya ditentukan oleh konteks sastra, bukan dimasukkan sebagai penjelasan ke dalam ayat.
- issue: Cakupan makna τηρέω
  choice: “berpegang pada” untuk menjaga keluasan makna menjaga, mengindahkan, dan menaati.
  alternative: “menaati” atau “memelihara”.
  rationale: “Menaati” dapat mempersempit makna menjadi kepatuhan saja, sedangkan “memelihara” berpotensi terdengar kurang langsung dalam bahasa Indonesia masa kini.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ujaran ilahi tanpa menambahkan identitas pembicara. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
