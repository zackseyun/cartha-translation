id: REV.22.9
reference: Revelation 22:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: id
  text: Lalu ia berkata kepadaku, “Jangan lakukan itu![a] Aku adalah sesama hamba[b] denganmu, dengan saudara-saudaramu para nabi, dan dengan mereka yang menaati perkataan-perkataan dalam kitab ini. Sembahlah Allah![c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Yunani ini berbunyi kira-kira, “Awas, jangan!” Maksudnya adalah bahwa Yohanes tidak boleh melakukan tindakan itu, yaitu menyembah malaikat.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “sesama hamba” menyatakan bahwa malaikat, seperti Yohanes, berada dalam kedudukan sebagai hamba di bawah tuan yang sama.
    reason: lexical_alternative
  - marker: c
    text: 'Bandingkan Wahyu 19:10, ketika malaikat memberikan teguran yang sama: “Sembahlah Allah!”'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Jangan lakukan itu!
  rationale: Ungkapan ini merupakan larangan singkat dan tegas. Konteks sebelumnya menunjukkan bahwa tindakan yang dilarang ialah upaya Yohanes menyembah malaikat.
- source_word: σύνδουλός
  choice: sesama hamba
  rationale: Kata ini menyatakan bahwa malaikat dan Yohanes sama-sama berada di bawah Tuan yang sama. Dalam bahasa Indonesia modern, 'sesama hamba' mempertahankan gagasan ketundukan bersama dengan lebih alami daripada 'sesama budak' dalam sapaan ini.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: saudara-saudaramu para nabi
  rationale: Frasa 'para nabi' menerangkan siapa saudara-saudara yang dimaksud. Bentuk ini mempertahankan susunan dan keterkaitan frasa Yunani tanpa mengubahnya menjadi istilah yang lebih umum.
- source_word: τηρούντων
  choice: menaati
  rationale: Dalam hubungan dengan perkataan-perkataan kitab ini, τηρέω menunjuk pada memegang dan menjalankannya dengan setia. 'Menaati' menyampaikan maksud itu secara wajar dalam bahasa Indonesia.
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: perkataan-perkataan dalam kitab ini
  rationale: '''Perkataan-perkataan'' mempertahankan bentuk jamak λόγους dan menunjuk pada isi verbal kitab; ''dalam kitab ini'' terdengar alami dalam bahasa Indonesia.'
- source_word: τῷ θεῷ προσκύνησον
  choice: Sembahlah Allah!
  rationale: Dalam konteks penolakan terhadap penghormatan kepada malaikat, προσκυνέω jelas mengacu pada penyembahan yang hanya patut diarahkan kepada Allah.
theological_decisions:
- issue: Status bersama yang dinyatakan oleh σύνδουλος
  choice: sesama hamba
  alternative: sesama budak
  rationale: Pokok teologisnya ialah malaikat bukan sasaran penyembahan, melainkan sama-sama tunduk kepada Allah. 'Sesama hamba' menyatakan ketundukan itu secara jelas dan bermartabat, sementara catatan kaki menerangkan nuansa status di bawah satu tuan.
- issue: Objek tersirat dalam larangan Ὅρα μή
  choice: Jangan lakukan itu!
  alternative: Awas, jangan!
  rationale: Bahasa Yunani memakai larangan eliptis. Menambahkan 'lakukan itu' secara eksplisit merujuk pada tindakan Yohanes dalam konteks dan tidak menambahkan klaim teologis baru.
- issue: Cakupan kelompok sesudah σύνδουλος
  choice: Mempertahankan Yohanes, saudara-saudaranya para nabi, dan mereka yang menaati perkataan kitab ini sebagai rangkaian kelompok yang disebutkan
  alternative: Menyatukan semuanya sebagai satu kelompok yang identik
  rationale: Struktur καί berulang dapat menimbulkan pertanyaan tentang hubungan persis antarkelompok. Terjemahan tidak memaksakan bahwa semua sebutan itu sepenuhnya identik, sehingga ambiguitas sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan khidmat. 'Ia' mempertahankan rujukan naratif kepada malaikat, sedangkan bentuk imperatif 'Sembahlah' menyampaikan perintah dengan jelas. Pengulangan 'perkataan-perkataan' dipertahankan demi kedekatan dengan bentuk jamak sumber.
