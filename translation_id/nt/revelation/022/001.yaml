id: REV.22.1
reference: Revelation 22:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: id
  text: Lalu ia menunjukkan kepadaku sungai air kehidupan, yang cemerlang seperti kristal dan mengalir keluar dari takhta Allah dan Anak Domba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: ia menunjukkan kepadaku
  rationale: Menerjemahkan verba aoris aktif dan objek tak langsung secara langsung, serta mempertahankan adegan penglihatan tanpa menambahkan penafsiran.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: sebuah sungai yang airnya adalah air kehidupan
  rationale: Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan citra 'air kehidupan'; 'sebuah' mencerminkan nomina Yunani yang tidak berartikel tanpa menjadikannya terlalu spesifik.
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: berkilau seperti kristal
  rationale: λαμπρός terutama menyatakan kecemerlangan atau sinar, bukan semata-mata kejernihan; 'seperti' menerjemahkan perbandingan ὡς secara alami.
- source_word: ἐκπορευόμενον
  choice: yang mengalir keluar
  rationale: Partisipel ini menerangkan sungai; 'mengalir keluar' menyampaikan gerak yang sesuai dengan sungai dan makna asal/sumber.
- source_word: ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: dari takhta Allah dan Anak Domba
  rationale: Mempertahankan bentuk tunggal 'takhta' dan kedua genitif terkoordinasi, serta gelar apokaliptik 'Anak Domba'.
theological_decisions:
- issue: Gambaran satu takhta bagi Allah dan Anak Domba
  choice: dari takhta Allah dan Anak Domba
  alternative: dari takhta yang dimiliki bersama oleh Allah dan Anak Domba; dari takhta-takhta Allah dan Anak Domba
  rationale: Teks Yunani memakai 'takhta' dalam bentuk tunggal dengan dua unsur pemilik yang dikoordinasikan. Terjemahan mempertahankan daya teologis dan kemungkinan relasionalnya tanpa menjelaskannya lebih jauh; bentuk jamak akan bertentangan dengan teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pronomina 'ia' dibiarkan tanpa penjelasan karena rujukannya berasal dari konteks. Tidak ditambahkan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu ditampilkan pada ayat ini; catatan kaki pada lapisan konsultasi bahasa Inggris tampaknya tidak selaras dengan penempatan penandanya.
