id: REV.22.13
reference: Revelation 22:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: id
  text: Akulah Alfa dan Omega, Yang Pertama dan Yang Terakhir, Yang Awal dan Yang Akhir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Asal dan Tujuan.”
    reason: Alternatif leksikal bagi ἡ ἀρχὴ καὶ τὸ τέλος yang dapat menekankan sumber dan sasaran, bukan hanya awal dan akhir.
lexical_decisions:
- source_word: ἐγὼ
  choice: Akulah
  rationale: Pronomina Yunani yang dinyatakan secara eksplisit memberi penekanan. Bentuk Indonesia “Akulah” mempertahankan penegasan itu secara alami dalam pernyataan diri yang khidmat.
- source_word: τὸ Ἄλφα
  choice: Alfa
  rationale: Nama huruf pertama alfabet Yunani dipertahankan sebagai gelar simbolis yang sudah dikenal; tidak dialihaksarakan menjadi nama huruf alfabet Indonesia.
- source_word: τὸ Ὦ
  choice: Omega
  rationale: Nama huruf terakhir alfabet Yunani dipertahankan agar pasangan gelar simbolis “Alfa dan Omega” tetap utuh.
- source_word: ὁ πρῶτος
  choice: Yang Pertama
  rationale: Padanan langsung bagi adjektiva yang dipakai secara substantival; kapitalisasi menandai fungsinya sebagai sebutan dalam rangkaian gelar.
- source_word: ὁ ἔσχατος
  choice: Yang Terakhir
  rationale: Padanan alami dan langsung yang menjaga kesejajaran dengan “Yang Pertama.”
- source_word: ἡ ἀρχὴ
  choice: Yang Awal
  rationale: Menjaga bentuk gelar dan kesejajaran ringkas dengan “Yang Akhir.” Maknanya dapat mencakup awal atau asal, sehingga nuansa alternatif dicatat dalam catatan kaki.
- source_word: τὸ τέλος
  choice: Yang Akhir
  rationale: Menjaga pasangan yang alami dengan “Yang Awal” dan bentuk triadik ayat. Kata Yunani juga dapat menunjuk tujuan atau kesudahan, sehingga kemungkinan itu dicatat.
theological_decisions:
- issue: Rangkaian tiga pasang sebutan diri yang menyatakan cakupan menyeluruh tanpa merinci nuansa metafisisnya
  choice: Akulah Alfa dan Omega, Yang Pertama dan Yang Terakhir, Yang Awal dan Yang Akhir.
  alternative: Akulah Alfa dan Omega, Yang Pertama dan Yang Terakhir, Asal dan Tujuan.
  rationale: Terjemahan utama mempertahankan simetri dan daya retoris tiga pasangan gelar dalam bahasa Yunani. Alternatif “Asal dan Tujuan” menyatakan kemungkinan semantis ἀρχή dan τέλος, tetapi jika dimasukkan ke teks utama akan mempersempit ambiguitas yang memang ada.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Akulah” mempertahankan penekanan ἐγώ; pengulangan “Yang” membuat ketiga pasangan terdengar sebagai gelar sejajar. Penanda catatan kaki [a] ditempatkan sesudah pasangan yang diterangkannya.
