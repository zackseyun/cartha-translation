  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: id
  text: Mereka akan melihat wajah-Nya,[a][b] dan nama-Nya akan ada pada dahi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan memandang wajah-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Kata ganti tunggal “-Nya” dapat mengacu kepada Allah, atau mencerminkan pemerintahan bersama Allah dan Anak Domba dalam konteks langsung.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: akan melihat
  rationale: Bentuk future dari ὁράω menyatakan tindakan melihat pada masa mendatang. “Akan melihat” alami dalam bahasa Indonesia modern dan mempertahankan daya visual ungkapan Yunani.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: wajah-Nya
  rationale: πρόσωπον terutama berarti “wajah”; bersama verba “melihat,” makna konkret ini lebih kuat daripada kemungkinan perluasan makna “hadirat.” Pronomina tetap dipertahankan agar acuannya tidak dipersempit.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: nama-Nya
  rationale: ὄνομα diterjemahkan secara langsung sebagai “nama.” Implikasi identitas, kepemilikan, atau karakter tidak dimasukkan ke dalam teks utama.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: pada dahi mereka
  rationale: ἐπί dengan genitif di sini menunjukkan posisi. Bahasa Indonesia lazim memakai bentuk kolektif tunggal “dahi mereka,” tanpa menyiratkan bahwa mereka berbagi satu dahi.
- source_word: καὶ
  choice: dan
  rationale: Kedua kemunculannya berfungsi sebagai penghubung aditif. Yang pertama tidak perlu diterjemahkan secara tersendiri pada awal ayat karena alur Indonesia tetap alami, sedangkan yang kedua diterjemahkan “dan.”
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina tunggal maskulin diterjemahkan secara langsung dengan akhiran hormat “-Nya,” tanpa menggantinya dengan “Allah” atau “Anak Domba,” sehingga ambiguitas konteks tetap terpelihara.
theological_decisions:
- issue: Acuan αὐτοῦ dalam “wajah-Nya” dan “nama-Nya”
  choice: Mempertahankan pronomina “-Nya” tanpa menyebut acuannya dalam teks utama.
  alternative: Menyebut “Allah,” atau memahami bentuk tunggal itu dalam konteks pemerintahan bersama Allah dan Anak Domba.
  rationale: Konteks langsung menyandingkan Allah dan Anak Domba (Why. 22:3), sedangkan teks Yunani memakai pronomina tunggal. Terjemahan tidak seharusnya mempersempit acuan yang dibiarkan ditentukan oleh konteks.
- issue: Keadaan nama pada dahi
  choice: “akan tertulis pada dahi mereka”
  alternative: 'Terjemahan yang lebih formal dan eliptis: “akan ada pada dahi mereka.”'
  rationale: Teks Yunani secara harfiah menyatakan bahwa nama itu “akan [ada] pada” dahi mereka. “Akan tertulis” merupakan pengungkapan alami dan sesuai dengan gambaran nama yang dituliskan pada dahi dalam konteks Wahyu, tanpa mengubah fungsi tanda tersebut menjadi tafsiran eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Bentuk “wajah-Nya” dipilih daripada “muka-Nya”; “pada dahi mereka” lebih idiomatis daripada “di atas dahi mereka.” Penanda catatan kaki [a] dan [b] ditempatkan tepat setelah frasa yang dijelaskan.
