id: REV.22.20
reference: Revelation 22:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: id
  text: Dia yang memberi kesaksian tentang hal-hal ini berkata, “Ya, Aku segera datang[a].” Amin. Datanglah, Tuhan Yesus!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku datang dengan cepat.” Kata keterangan Yunani ini dapat menekankan kedekatan waktunya atau kecepatan kedatangan atau tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: berkata
  rationale: Bentuk kini indikatif berfungsi sebagai pengantar ujaran dan secara alami diterjemahkan dengan bentuk sederhana “berkata” dalam bahasa Indonesia.
- source_word: ὁ μαρτυρῶν
  choice: Dia yang memberi kesaksian
  rationale: Partisip substantival ini menunjuk kepada Yesus sebagai pribadi yang memberi kesaksian tentang isi wahyu; “memberi kesaksian” mempertahankan nuansa kesaksian dari μαρτυρέω.
- source_word: ταῦτα
  choice: semuanya ini
  rationale: Demonstrativa jamak menunjuk kepada hal-hal yang disampaikan dalam wahyu. “Semuanya ini” alami dalam bahasa Indonesia dan menegaskan cakupan tanpa mengubah acuannya.
- source_word: Ναί
  choice: Ya
  rationale: Merupakan jawaban afirmatif langsung; “Ya” mempertahankan bentuk yang lugas tanpa menambahkan penekanan interpretatif.
- source_word: ἔρχομαι
  choice: Aku ... datang
  rationale: Bentuk kini deponen memiliki daya futuristis dalam konteks ini. Susunan “Aku segera datang” merupakan ungkapan Indonesia yang alami untuk janji kedatangan mendatang.
- source_word: ταχύ
  choice: segera
  rationale: Kata keterangan ini dapat menyatakan kedekatan waktu atau kecepatan tindakan. “Segera” paling alami untuk arti kedekatan waktu di sini, sedangkan arti alternatif dicatat dalam catatan kaki.
- source_word: Ἀμήν
  choice: Amin
  rationale: Mempertahankan seruan liturgis yang mapan dan menyatakan persetujuan penuh doa.
- source_word: ἔρχου
  choice: Datanglah
  rationale: Imperatif orang kedua tunggal diterjemahkan sebagai permohonan langsung. Partikel “-lah” menyampaikan seruan yang sungguh-sungguh secara alami.
- source_word: κύριε
  choice: Tuhan
  rationale: Gelar κύριος dalam sapaan langsung kepada Yesus secara tepat dan lazim diterjemahkan “Tuhan”.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Makna ταχύ dalam janji kedatangan Kristus
  choice: segera
  alternative: dengan cepat
  rationale: ταχύ dapat menunjuk pada kedekatan waktu maupun kecepatan kedatangan atau tindakan. Teks utama memakai “segera” karena paling sesuai dengan pertukaran penutup dan doa yang menyusul, tetapi ketegangan eskatologisnya dipertahankan melalui catatan alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Huruf kapital pada “Aku” mengikuti konvensi penghormatan yang lazim dalam teks Alkitab bahasa Indonesia ketika pembicaranya adalah Yesus. Tanda seru pada doa penutup menyampaikan urgensi imperatif tanpa menambah isi leksikal.
