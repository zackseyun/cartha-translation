id: REV.22.18
reference: Revelation 22:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: id
  text: 'Aku bersaksi kepada setiap orang yang mendengar kata-kata nubuat dalam kitab ini[a]: jika seseorang menambahkan sesuatu pada kata-kata itu, Allah akan menambahkan kepada orang itu malapetaka yang tertulis dalam kitab ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan”; kata Yunani βιβλίον dapat menunjuk pada gulungan sebagai bentuk fisik tulisan pada zaman itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Aku bersaksi
  rationale: Mempertahankan makna kesaksian yang khidmat dan bernuansa yuridis; daya peringatannya muncul dari isi kalimat berikutnya, bukan dengan mengganti verba ini menjadi 'memperingatkan'.
- source_word: παντὶ τῷ ἀκούοντι
  choice: kepada setiap orang yang mendengar
  rationale: Menyampaikan konstruksi datif-partisipial secara alami dalam bahasa Indonesia tanpa menghilangkan cakupan universalnya.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: perkataan-perkataan nubuat
  rationale: Bentuk jamak 'perkataan-perkataan' mempertahankan rujukan pada isi verbal nubuat, sedangkan 'nubuat' menjaga kategori profetisnya.
- source_word: τοῦ βιβλίου τούτου
  choice: dalam kitab ini
  rationale: Genitif dipahami sebagai perkataan nubuat yang termuat dalam kitab ini. 'Kitab' alami untuk tulisan suci dan tetap memungkinkan alternatif bentuk fisik 'gulungan' dalam catatan kaki.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: Jika seseorang menambahkan sesuatu kepadanya
  rationale: Mengungkapkan makna idiomatis 'menambahkan'; 'sesuatu' dibuat eksplisit secara wajar dalam bahasa Indonesia, dan pronomina tunggal merujuk pada keseluruhan perkataan nubuat.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: Allah akan menambahkan kepadanya
  rationale: Mengulang verba 'menambahkan' untuk mempertahankan kesejajaran retoris yang disengaja antara tindakan manusia dan balasan Allah.
- source_word: τὰς πληγὰς
  choice: malapetaka-malapetaka
  rationale: Dalam Wahyu, πληγή menunjuk pada bencana hukuman ilahi. 'Malapetaka' mempertahankan hubungan dengan rangkaian penghakiman dalam kitab tanpa terbatas pada pengertian penyakit menular modern.
- source_word: τὰς γεγραμμένας
  choice: yang tertulis
  rationale: 'Menyampaikan keadaan tetap dari bentuk perfek pasif: malapetaka itu tercatat dan tetap tertulis.'
theological_decisions:
- issue: Pernyataan sebagai kesaksian atau peringatan
  choice: Aku bersaksi
  alternative: Aku memperingatkan
  rationale: Verba Yunani merupakan bahasa kesaksian. Terjemahan tidak mereduksinya menjadi sekadar peringatan, meskipun ancaman penghakiman dalam klausa berikut jelas memberi daya peringatan.
- issue: Cakupan larangan penambahan
  choice: kepada perkataan-perkataan nubuat dalam kitab ini
  alternative: kepada seluruh kanon Kitab Suci
  rationale: Ayat ini secara langsung menunjuk pada perkataan nubuat kitab yang sedang dibacakan. Terjemahan tidak memperluas rujukannya secara eksplisit melampaui yang dinyatakan teks.
- issue: Kesejajaran tindakan dan hukuman
  choice: menambahkan ... Allah akan menambahkan
  alternative: menambahkan ... Allah akan menimpakan
  rationale: Pemakaian verba yang sama mempertahankan permainan kata dan asas balasan dalam bahasa sumber, sekalipun frasa Indonesia terdengar lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, khidmat, dan dapat dipahami pembaca umum. 'Aku' mengikuti suara orang pertama yang langsung dan lazim dalam wacana kitab ini. 'Kitab' dipilih daripada 'buku' karena konteks tulisan suci, sementara alternatif historis 'gulungan' dicatat. Penanda catatan kaki [a] ditempatkan tepat setelah kemunculan pertama 'kitab ini'.
