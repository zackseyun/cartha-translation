- from: Aku, Yesus, telah mengutus malaikat-Ku untuk memberi kesaksian kepadamu tentang hal-hal ini bagi jemaat-jemaat.[a] Akulah akar dan keturunan Daud,[b] bintang timur yang cemerlang.
  to: Aku, Yesus, telah mengutus malaikat-Ku untuk memberi kesaksian kepadamu tentang hal-hal ini bagi jemaat-jemaat.[a] Akulah akar dan keturunan Daud, bintang pagi yang cemerlang.
  rationale: Mengganti “bintang timur” dengan “bintang pagi” agar unsur πρωϊνός diterjemahkan langsung dalam bahasa Indonesia modern. Catatan b dan penandanya dihapus karena “tunas Daud” bukan alternatif terjemahan yang aman bagi γένος Δαυίδ. Ambiguitas ἐπὶ ταῖς ἐκκλησίαις tetap dipertahankan dalam catatan a.
