    text: Atau “di tengah jemaat-jemaat” atau “mengenai jemaat-jemaat.” Frasa Yunani ἐπὶ ταῖς ἐκκλησίαις memungkinkan lebih dari satu nuansa.
    reason: lexical_alternative
  revision_rationale: Mengganti “bintang timur” dengan “bintang pagi” agar unsur πρωϊνός diterjemahkan langsung dalam bahasa Indonesia modern. Catatan b dan penandanya dihapus karena “tunas Daud” bukan alternatif terjemahan yang aman bagi γένος Δαυίδ. Ambiguitas ἐπὶ ταῖς ἐκκλησίαις tetap dipertahankan dalam catatan a.
