id: REV.22.16
reference: Revelation 22:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: id
  text: Aku, Yesus, telah mengutus malaikat-Ku untuk memberi kesaksian kepadamu tentang hal-hal ini bagi jemaat-jemaat.[a] Akulah akar dan keturunan Daud, bintang pagi yang cemerlang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah jemaat-jemaat” atau “mengenai jemaat-jemaat.” Frasa Yunani ἐπὶ ταῖς ἐκκλησίαις memungkinkan lebih dari satu nuansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Aku, Yesus,
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan pada identitas pembicara; aposisi ini alami dalam bahasa Indonesia dan tidak menambahkan kopula yang tidak ada.
- source_word: ἔπεμψα
  choice: telah mengutus
  rationale: Aoristus menyatakan tindakan pengutusan yang sudah terlaksana dan tetap relevan dalam konteks pewahyuan ini.
- source_word: τὸν ἄγγελόν μου
  choice: malaikat-Ku
  rationale: Dalam konteks apokaliptik kitab Wahyu, ἄγγελος paling wajar menunjuk kepada makhluk surgawi; bentuk posesif dipertahankan.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: untuk memberi kesaksian kepadamu tentang hal-hal ini
  rationale: Infinitif menyatakan tujuan pengutusan. Bahasa Indonesia memerlukan 'tentang' agar hubungan antara kesaksian dan isinya terdengar alami, sementara bentuk jamak ταῦτα dipertahankan.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: bagi jemaat-jemaat
  rationale: ἐπί dengan datif di sini dapat menyatakan lingkup, sasaran, atau acuan. 'Bagi jemaat-jemaat' menyampaikan tujuan kesaksian tanpa memaksakan arti lokatif.
- source_word: ἡ ῥίζα
  choice: akar
  rationale: Metafora sumber atau asal dipertahankan secara harfiah sebagai bagian dari gelar mesianik.
- source_word: τὸ γένος Δαυίδ
  choice: keturunan Daud
  rationale: γένος dapat menunjuk pada garis keluarga atau keturunan; 'keturunan Daud' jelas dan alami dalam bahasa Indonesia.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: bintang timur yang cemerlang
  rationale: Ungkapan ini menunjuk pada bintang yang tampak pada pagi hari. 'Bintang timur' merupakan ungkapan Indonesia yang mapan, sedangkan 'yang cemerlang' mempertahankan λαμπρός.
theological_decisions:
- issue: Identifikasi diri Mesianik-Daudik
  choice: akar dan keturunan Daud
  alternative: sumber dan keturunan Daud
  rationale: Terjemahan mempertahankan metafora dan ketegangan teks bahwa Yesus sekaligus disebut akar Daud dan berasal dari garis keturunannya, tanpa menjelaskannya secara doktrinal.
- issue: Gelar Kristologis bintang pagi
  choice: bintang timur yang cemerlang
  alternative: bintang pagi yang cemerlang
  rationale: Gelar tersebut dipertahankan sebagai pernyataan langsung Yesus, tanpa menambahkan penafsiran teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Aku' dipakai karena merupakan pernyataan diri langsung Yesus dan selaras dengan penekanan ἐγώ. Kapital pada enklitik posesif dalam 'malaikat-Ku' mengikuti konvensi penulisan keagamaan Indonesia.
