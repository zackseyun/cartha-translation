id: REV.17.11
reference: Revelation 17:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: id
  text: Dan binatang yang dahulu ada dan sekarang tidak ada itu sendiri adalah yang kedelapan[a] dan berasal dari ketujuh itu[b], dan ia menuju kebinasaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “adalah raja kedelapan”; kata “raja” tersirat dari konteks, tetapi tidak dinyatakan dalam teks Yunani.
    reason: alternative_reading
  - marker: b
    text: Atau “merupakan salah satu dari ketujuh itu.” Secara lebih harfiah, teks Yunani berbunyi “dari ketujuh itu,” yang dapat menunjukkan asal, keanggotaan, atau hubungan erat.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: binatang
  rationale: Dalam konteks apokaliptik kitab Wahyu, “binatang” merupakan istilah simbolis yang wajar dan mapan dalam bahasa Indonesia; konteks mempertahankan sifatnya yang mengerikan tanpa perlu menambahkan “buas” yang tidak dinyatakan secara leksikal.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: yang dahulu ada dan sekarang tidak ada
  rationale: Ungkapan ini mempertahankan pertentangan tajam antara ἦν dan οὐκ ἔστιν, sementara “dahulu” dan “sekarang” membuat hubungan waktunya jelas dan alami dalam bahasa Indonesia tanpa mengubahnya menjadi “sudah tidak ada lagi.”
- source_word: αὐτὸς
  choice: itu sendiri
  rationale: Bentuk ini mempertahankan penekanan αὐτός dan merujuk kembali kepada “binatang” tanpa memaksakan rujukan personal laki-laki.
- source_word: ὄγδοός
  choice: yang kedelapan
  rationale: Bahasa Indonesia memerlukan nominalisasi yang alami. “Yang kedelapan” tidak menambahkan kata benda “raja,” yang hanya tersirat dari konteks dan tidak tertulis dalam ayat ini.
- source_word: ἐκ τῶν ἑπτά
  choice: berasal dari ketujuh itu
  rationale: “Berasal dari” mempertahankan makna dasar ἐκ dan membiarkan terbuka apakah frasa ini menyatakan asal, keanggotaan, atau hubungan erat, tanpa langsung menafsirkannya sebagai “salah satu dari ketujuh itu.”
- source_word: εἰς ἀπώλειαν
  choice: menuju kebinasaan
  rationale: “Kebinasaan” menyampaikan kehancuran atau hukuman akhir dengan bobot eskatologis yang sesuai dan tetap mudah dipahami.
- source_word: ὑπάγει
  choice: menuju
  rationale: Dalam konstruksi dengan εἰς ἀπώλειαν, “menuju” mengungkapkan gerak ke tujuan secara alami dan mempertahankan bentuk kini yang hidup.
theological_decisions:
- issue: Apakah kata benda “raja” yang tersirat perlu dinyatakan
  choice: Tidak menambahkan “raja” dalam teks utama; memakai “yang kedelapan.”
  alternative: “raja kedelapan” atau “yang kedelapan, yaitu seorang raja”
  rationale: Konteks ayat sebelumnya memang membicarakan raja-raja, tetapi βασιλεύς tidak terdapat dalam klausa ini. Tidak menambahkannya menjaga kepadatan dan ambiguitas simbolis teks Yunani; kemungkinan tersebut dicatat dalam catatan kaki.
- issue: Makna tepat ἐκ τῶν ἑπτά
  choice: “berasal dari ketujuh itu”
  alternative: “salah satu dari ketujuh itu”
  rationale: Frasa Yunani dapat menunjukkan asal, keanggotaan, atau hubungan erat. Terjemahan utama tidak memutuskan identifikasi yang lebih khusus daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Susunan klausa sedapat mungkin mengikuti kesejajaran teks Yunani, tetapi penanda waktu “dahulu” dan “sekarang” dipakai agar kontras verbal alami bagi pembaca Indonesia. Semua ketidakpastian penting mengenai “yang kedelapan” dan hubungannya dengan ketujuh dipertahankan melalui teks utama dan catatan kaki.
