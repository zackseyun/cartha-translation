id: REV.17.1
reference: Revelation 17:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: id
  text: Lalu datanglah salah satu dari ketujuh malaikat yang memegang ketujuh cawan itu. Ia berbicara denganku dan berkata, “Kemarilah, aku akan menunjukkan kepadamu penghakiman[a] atas pelacur besar itu yang duduk di atas banyak air.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penghukuman” atau “hukuman” atas pelacur besar itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Menandai kelanjutan alur secara alami dalam bahasa Indonesia sambil mempertahankan daya penghubung naratif.
- source_word: ἦλθεν
  choice: datanglah
  rationale: Menyampaikan tindakan naratif aoristus ἔρχομαι; partikel -lah memberi corak naratif yang wajar dan bermartabat.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: salah satu dari ketujuh malaikat
  rationale: Menyatakan konstruksi partitif Yunani dengan jelas dan alami.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: yang memegang ketujuh cawan itu
  rationale: Partisipel mengidentifikasi kelompok malaikat yang dimaksud. 'Memegang' sesuai dengan gambaran mereka sebagai pembawa cawan, sedangkan 'cawan' merupakan padanan lazim dan tepat bagi φιάλη dalam Wahyu.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: Ia berbicara kepadaku
  rationale: Dalam konteks pengantar ujaran satu arah, 'berbicara kepadaku' lebih alami daripada 'berbicara denganku', tanpa mengubah maksud konstruksi μετά dengan genitif.
- source_word: λέγων
  choice: katanya
  rationale: Menghindari pengulangan kaku 'berbicara ... dengan berkata' sambil tetap menyatakan fungsi partisipel sebagai pengantar kutipan.
- source_word: Δεῦρο
  choice: Kemarilah
  rationale: Merupakan panggilan langsung yang alami dan mempertahankan nuansa deiktis Δεῦρο.
- source_word: δείξω σοι
  choice: aku akan menunjukkan kepadamu
  rationale: Menerjemahkan bentuk futurum secara langsung dan mempertahankan objek tak langsung.
- source_word: τὸ κρίμα
  choice: penghakiman
  rationale: Padanan ini cukup luas untuk mencakup putusan maupun pelaksanaan hukuman dan tidak mempersempit arti secara prematur.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: atas pelacur besar
  rationale: '''Pelacur'' adalah padanan modern dan langsung bagi πόρνη, mempertahankan daya metaforis dan polemisnya. ''Atas'' memperjelas bahwa penghakiman dijatuhkan terhadap tokoh tersebut.'
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: yang duduk di atas banyak air
  rationale: Mempertahankan citra simbolis secara dekat tanpa menafsirkannya lebih dahulu; bentuk 'banyak air' juga selaras dengan ungkapan apokaliptik ini.
theological_decisions:
- issue: Sebutan metaforis πόρνη bagi Babel
  choice: pelacur besar
  alternative: perempuan sundal besar
  rationale: '''Pelacur'' akurat, kontemporer, dan mempertahankan metafora seksual kenabian tanpa menentukan secara sempit identitas teologis Babel.'
- issue: Cakupan κρίμα dalam konteks apokaliptik
  choice: penghakiman
  alternative: penghukuman
  rationale: '''Penghakiman'' mempertahankan keluasan makna yang dapat meliputi keputusan hukum serta akibat hukumannya, sedangkan ''penghukuman'' cenderung menonjolkan akibat saja.'
- issue: Hubungan penghakiman dengan perempuan itu dalam frasa genitif
  choice: penghakiman atas pelacur besar
  alternative: penghakiman terhadap pelacur besar
  rationale: '''Atas'' secara alami menunjukkan bahwa perempuan itu menjadi sasaran penghakiman tanpa mengubah κρίμα menjadi hanya hukuman.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, sementara hubungan naratif dan semua unsur makna dipertahankan. Istilah 'pelacur' dipilih karena jelas serta tidak arkais; citra 'duduk di atas banyak air' dibiarkan tanpa penafsiran karena penjelasan simbolisnya muncul kemudian dalam pasal ini.
