  to: Lalu datanglah salah satu dari ketujuh malaikat yang memegang ketujuh cawan itu. Ia berbicara denganku dan berkata, “Kemarilah, aku akan menunjukkan kepadamu penghakiman[a] atas pelacur besar itu yang duduk di atas banyak air.”
