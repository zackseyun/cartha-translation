  to: Lalu malaikat itu membawa aku dalam Roh ke sebuah padang belantara.[a] Aku melihat seorang perempuan duduk di atas seekor binatang merah kirmizi yang penuh dengan nama-nama hujatan. Binatang itu berkepala tujuh dan bertanduk sepuluh.
  rationale: Revisi terbatas pada penggantian “merah tua” dengan “merah kirmizi” agar warna κόκκινον diterjemahkan lebih tepat, serta pada perapian catatan kaki untuk menyajikan alternatif ἐν πνεύματι secara idiomatis tanpa memperluas atau menentukan maknanya secara berlebihan. Selebihnya, terjemahan draft dipertahankan.
