id: REV.17.3
reference: Revelation 17:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: id
  text: Lalu malaikat itu membawa aku dalam Roh ke sebuah padang belantara.[a] Aku melihat seorang perempuan duduk di atas seekor binatang merah kirmizi yang penuh dengan nama-nama hujatan. Binatang itu berkepala tujuh dan bertanduk sepuluh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam keadaan rohani.” Frasa Yunani ini dapat menunjuk pada keadaan rohani atau pada tindakan Roh membawa seseorang; dalam kitab Wahyu, frasa ini biasanya memperkenalkan pengalaman penglihatan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: membawa ... ke
  rationale: Kata kerja ini menyatakan pemindahan dari satu tempat ke tempat lain; dalam konteks ini, pemindahan itu terjadi dalam pengalaman penglihatan.
- source_word: εἰς ἔρημον
  choice: ke sebuah padang belantara
  rationale: ἔρημος dapat berarti daerah liar, tandus, atau sunyi. Bentuk tanpa artikel mendukung pengertian tidak tentu; 'padang belantara' tidak membatasi gambaran pada gurun berpasir.
- source_word: ἐν πνεύματι
  choice: dalam Roh
  rationale: Dalam kitab Wahyu, frasa ini lazim menandai pengalaman penglihatan kenabian dan kemungkinan besar menunjuk pada karya Roh, tetapi kemungkinan 'dalam keadaan rohani' dipertahankan dalam catatan kaki.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον
  choice: seorang perempuan duduk di atas seekor binatang
  rationale: Terjemahan langsung dan alami yang mempertahankan gambaran posisi perempuan di atas binatang apokaliptik itu.
- source_word: κόκκινον
  choice: merah tua
  rationale: κόκκινος menunjuk pada warna merah menyala atau merah kirmizi. 'Merah tua' mudah dipahami dalam bahasa Indonesia modern tanpa menghilangkan kekuatan citra warnanya.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: penuh dengan nama-nama hujatan
  rationale: Mempertahankan ungkapan 'penuh dengan' dan konstruksi nominal Yunani, tanpa mengubahnya menjadi 'tertutup' atau menjelaskan identitas nama-nama tersebut.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: Binatang itu berkepala tujuh dan bertanduk sepuluh
  rationale: Pengulangan 'binatang itu' memperjelas bahwa partisipel maskulin ἔχων menerangkan θηρίον, bukan perempuan, sementara bentuk 'berkepala' dan 'bertanduk' alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἐν πνεύματι
  choice: dalam Roh
  alternative: dalam keadaan rohani
  rationale: Penggunaan frasa ini dalam Wahyu mendukung pengalaman penglihatan yang terjadi melalui karya Roh. Karena naskah Yunani tidak memakai pembedaan huruf kapital dan frasa tersebut juga dapat menggambarkan keadaan rohani, alternatifnya dicantumkan dalam catatan kaki.
- issue: Subjek tersirat ἀπήνεγκέν
  choice: malaikat itu
  alternative: ia
  rationale: Subjek berasal dari malaikat yang berbicara kepada Yohanes dalam ayat 1. Penyebutan nomina dalam bahasa Indonesia memperjelas rujukan tanpa menambahkan tokoh baru.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat dipecah agar rujukan partisipel Yunani kepada binatang tetap jelas. Istilah apokaliptik 'binatang', 'kepala', dan 'tanduk' dipertahankan tanpa penafsiran simbolis.
