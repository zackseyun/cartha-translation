id: REV.17.4
reference: Revelation 17:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: id
  text: Perempuan itu mengenakan pakaian ungu dan kirmizi, berhias dengan emas, batu permata, dan mutiara, sambil memegang sebuah cawan emas yang penuh dengan berbagai kekejian dan hal-hal najis dari percabulannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pelacurannya" atau "perbuatan seksualnya yang tidak bermoral"; kata Yunani yang dipakai dapat bermakna harfiah maupun kiasan dalam kitab Wahyu.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: mengenakan pakaian
  rationale: Bentuk perfektum perifrastis menggambarkan keadaan perempuan itu sebagai orang yang berpakaian; ungkapan ini alami dan tetap mempertahankan gagasan hasil.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: ungu dan merah tua
  rationale: Kedua kata menunjuk warna pakaian mewah; 'merah tua' menyampaikan warna kirmizi dengan bahasa Indonesia modern tanpa sekadar memakai kata umum 'merah'.
- source_word: κεχρυσωμένη
  choice: berhias
  rationale: Partisip ini menunjuk pada keadaan dihiasi secara mewah. 'Berhias dengan' alami dalam bahasa Indonesia dan tidak menentukan bentuk perhiasannya.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: dengan emas, batu permata, dan mutiara
  rationale: Daftar bahan perhiasan dipertahankan. Bentuk tunggal kolektif λίθῳ τιμίῳ diterjemahkan secara idiomatis sebagai 'batu permata'.
- source_word: ποτήριον χρυσοῦν
  choice: sebuah cawan emas
  rationale: Terjemahan langsung dan wajar untuk wadah minum dari emas dalam register Kitab Suci.
- source_word: βδελυγμάτων
  choice: berbagai kekejian
  rationale: '''Kekejian'' mempertahankan daya moral dan kultis yang kuat; ''berbagai'' menyampaikan bentuk jamak tanpa membuat frasa terasa kaku.'
- source_word: τὰ ἀκάθαρτα
  choice: segala kenajisan
  rationale: Nomina netral jamak ini menunjuk hal-hal yang najis. 'Segala kenajisan' alami sekaligus mempertahankan nuansa moral dan ritual.
- source_word: πορνείας
  choice: percabulannya
  rationale: '''Percabulan'' dapat membawa daya seksual harfiah maupun metaforis dalam gambaran apokaliptik, tanpa membatasi maknanya hanya pada pelacuran komersial.'
theological_decisions:
- issue: Daya harfiah dan metaforis πορνεία dalam gambaran apokaliptik
  choice: percabulannya
  alternative: pelacurannya; perbuatan seksualnya yang tidak bermoral
  rationale: '''Percabulan'' cukup luas untuk mempertahankan gambaran ketidaksetiaan seksual sekaligus kemungkinan makna simbolis berupa ketidaksetiaan rohani dan penyembahan berhala; terjemahan tidak memutuskan hanya salah satu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami tanpa mengubah hubungan deskriptifnya. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
