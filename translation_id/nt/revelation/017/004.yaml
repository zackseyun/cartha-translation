  to: Perempuan itu mengenakan pakaian ungu dan kirmizi, berhias dengan emas, batu permata, dan mutiara, sambil memegang sebuah cawan emas yang penuh dengan berbagai kekejian dan hal-hal najis dari percabulannya.[a]
