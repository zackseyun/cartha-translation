  naturalness: ‘Air yang kaulihat, yang di atasnya pelacur itu duduk’ alami dan jelas dalam bahasa Indonesia modern. ‘Kaum-kaum’ membedakan λαοί dari ἔθνη tanpa menambahkan kategori etnis secara berlebihan.
  terminology: '‘Pelacur itu’ merupakan padanan langsung yang tepat bagi ἡ πόρνη. ‘Kaum-kaum, kumpulan orang banyak, bangsa-bangsa, dan bahasa-bahasa’ mempertahankan empat kategori: λαοί, ὄχλοι, ἔθνη, γλῶσσαι.'
