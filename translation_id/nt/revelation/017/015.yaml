    rationale: οὗ adalah penanda tempat yang menerangkan ‘air’; dalam konteks penglihatan ini, ‘yang di atasnya pelacur itu duduk’ menyampaikan relasi tersebut dengan jelas tanpa menambahkan gagasan penguasaan.
  - severity: low
    issue: ‘Berbagai suku bangsa’ menambahkan nuansa ‘berbagai’ dan mempersempit λαοί ke kategori etnis.
    rationale: λαοί secara umum berarti kelompok-kelompok rakyat/kaum. ‘Kaum-kaum’ lebih netral dan membantu membedakannya dari ἔθνη (‘bangsa-bangsa’).
  - severity: low
    issue: Jamak dalam daftar akhir tidak tampak konsisten dalam teks Indonesia.
    rationale: Walaupun bentuk tunggal kolektif dapat dipahami dalam bahasa Indonesia, pengulangan jamak (‘kaum-kaum’, ‘bangsa-bangsa’, ‘bahasa-bahasa’) lebih jelas mencerminkan daftar jamak Yunani.
