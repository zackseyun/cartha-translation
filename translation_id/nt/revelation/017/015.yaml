id: REV.17.15
reference: Revelation 17:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: id
  text: Lalu ia berkata kepadaku, “Air yang kaulihat, yang di atasnya pelacur itu duduk, adalah kaum-kaum, kumpulan orang banyak, bangsa-bangsa, dan bahasa-bahasa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ ὕδατα
  choice: Air
  rationale: Bentuk Yunani secara harfiah jamak, tetapi dalam bahasa Indonesia ‘air’ lazim sebagai nomina massa dan paling alami untuk kumpulan perairan yang dilihat Yohanes.
- source_word: ἡ πόρνη
  choice: pelacur itu
  rationale: Padanan langsung dan modern bagi istilah Yunani, dengan penunjuk ‘itu’ untuk mempertahankan artikel yang merujuk kepada tokoh yang sudah dikenal.
- source_word: λαοὶ
  choice: berbagai suku bangsa
  rationale: Membedakannya dari ἔθνη dan menyampaikan kelompok-kelompok masyarakat/etnis dalam bentuk jamak.
- source_word: ὄχλοι
  choice: orang banyak
  rationale: Padanan idiomatis untuk kumpulan atau kerumunan manusia, tanpa mempersempitnya menjadi kelompok sosial tertentu.
- source_word: ἔθνη
  choice: bangsa
  rationale: Padanan umum bagi kelompok-kelompok bangsa; bentuk jamak dipahami melalui rangkaian dan konteks.
- source_word: γλῶσσαι
  choice: bahasa
  rationale: Dalam daftar kelompok manusia, istilah ini menunjuk komunitas menurut bahasa atau bahasa-bahasa mereka; ‘bahasa’ mempertahankan metonimia sumber.
theological_decisions:
- issue: Identifikasi simbol air
  choice: Mempertahankan pernyataan eksplisit bahwa air itu adalah kelompok-kelompok manusia.
  alternative: Mengembangkan artinya sebagai kekuasaan politik atau kerajaan dunia.
  rationale: Ayat ini sendiri menafsirkan simbol dengan empat kategori manusia; tidak perlu menambahkan identifikasi teologis yang tidak dinyatakan.
- issue: Relasi pelacur dengan air
  choice: “tempat pelacur itu duduk”
  alternative: “yang diduduki pelacur itu” atau “yang dikuasai pelacur itu”
  rationale: Pilihan ini mempertahankan konstruksi lokatif dan tidak mengubah tindakan duduk menjadi klaim tentang dominasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan daftar dipertahankan. Bentuk kini historis λέγει diterjemahkan secara naratif sebagai ‘berkata’, sedangkan aoristus εἶδες dinyatakan ‘telah kaulihat’.
