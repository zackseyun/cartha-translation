id: REV.17.2
reference: Revelation 17:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: id
  text: Dengan perempuan itulah raja-raja di bumi berbuat cabul,[a] dan orang-orang yang tinggal di bumi menjadi mabuk oleh anggur percabulannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa “berbuat cabul” di sini kemungkinan berfungsi secara simbolis untuk menggambarkan persekutuan yang rusak, penyembahan berhala, atau ketidaksetiaan, sambil tetap mempertahankan daya metafora seksual.
    reason: cultural_note
  - marker: b
    text: Atau “anggur pelacurannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: dengan perempuan itulah
  rationale: Konstruksi ini mempertahankan acuan pronomina relatif kepada perempuan dalam ayat sebelumnya sambil terdengar alami dalam bahasa Indonesia.
- source_word: ἐπόρνευσαν
  choice: berbuat cabul
  rationale: Ungkapan ini mempertahankan gambaran seksual yang kuat dan memungkinkan makna simbolis tentang persekutuan yang menyimpang, penyembahan berhala, atau ketidaksetiaan tetap terbuka.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: raja-raja di bumi
  rationale: Dalam Wahyu, frasa ini merupakan sebutan berulang bagi para penguasa dunia; 'di bumi' lebih alami daripada 'dari bumi' tanpa mengubah cakupannya.
- source_word: ἐμεθύσθησαν
  choice: menjadi mabuk
  rationale: Menyatakan keadaan yang dihasilkan oleh anggur tersebut dan secara wajar mencerminkan bentuk pasif aoristus Yunani.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: orang-orang yang tinggal di bumi
  rationale: Mempertahankan bentuk verbal dari ungkapan khas yang berulang dalam Wahyu.
- source_word: ἐκ τοῦ οἴνου
  choice: oleh anggur
  rationale: ἐκ menunjukkan sumber atau sebab; 'oleh' menyampaikan daya penyebab anggur itu secara alami dalam bahasa Indonesia.
- source_word: τῆς πορνείας αὐτῆς
  choice: percabulannya
  rationale: Kata ini menjaga hubungan leksikal dengan 'berbuat cabul' dan mempertahankan metafora seksual tanpa membatasinya hanya pada pelacuran harfiah.
theological_decisions:
- issue: Apakah πορνεύω/πορνεία harus dijelaskan secara eksplisit sebagai penyembahan berhala atau ketidaksetiaan politik-religius dalam teks utama
  choice: Mempertahankan gambaran percabulan dalam teks utama
  alternative: Memparafrasakannya sebagai persekutuan penuh penyembahan berhala atau ketidaksetiaan rohani
  rationale: Bahasa Wahyu sengaja mempertahankan metafora seksual yang dapat menunjuk pada kerusakan religius dan politis. Terjemahan tidak semestinya menutup keluasan simbolis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan metafora seksual, hubungan antarkata serumpun, atau ungkapan khas Wahyu.
