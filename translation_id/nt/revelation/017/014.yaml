id: REV.17.14
reference: Revelation 17:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: id
  text: Mereka ini akan berperang melawan Anak Domba[a], dan Anak Domba akan mengalahkan mereka, karena Dia adalah Tuhan di atas segala tuhan dan Raja di atas segala raja. Mereka yang bersama-Nya adalah orang-orang yang dipanggil, dipilih, dan setia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi “akan berperang dengan Anak Domba”; dalam konteks ini maksudnya ialah berperang melawan Dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Mereka ini
  rationale: Mempertahankan daya tunjuk demonstratif kepada para raja yang disebut dalam konteks sebelumnya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: μετὰ τοῦ ἀρνίου
  choice: melawan Anak Domba
  rationale: Secara harfiah μετά dengan genitif berarti 'dengan', tetapi bersama πολεμέω dalam konteks ini menyatakan pihak yang diperangi; 'melawan' mencegah kesan bahwa mereka bersekutu dengan Anak Domba.
- source_word: ἀρνίον
  choice: Anak Domba
  rationale: Gelar kristologis khas dalam kitab Wahyu; bentuk ini mapan, jelas, dan mempertahankan citra apokaliptiknya.
- source_word: πολεμήσουσιν
  choice: akan berperang
  rationale: Mengungkapkan tindakan perang secara alami dan tetap sesuai dengan ragam apokaliptik yang luhur.
- source_word: νικήσει
  choice: akan mengalahkan
  rationale: Dalam konteks perang, pilihan ini menyatakan kemenangan Anak Domba atas lawan-lawannya dan mempertahankan tema νικάω dalam Wahyu.
- source_word: ὅτι
  choice: karena
  rationale: 'Mempertahankan hubungan sebab: kemenangan Anak Domba didasarkan pada kedudukan-Nya yang tertinggi.'
- source_word: κύριος κυρίων
  choice: Tuhan atas segala tuhan
  rationale: Ungkapan superlatif Semitis ini menyatakan supremasi Anak Domba; 'atas segala' terdengar alami dan jelas dalam bahasa Indonesia modern.
- source_word: βασιλεὺς βασιλέων
  choice: Raja atas segala raja
  rationale: Mempertahankan gelar yang menyatakan kewibawaan kerajaan tertinggi dengan bentuk Indonesia yang wajar.
- source_word: οἱ μετ’ αὐτοῦ
  choice: Mereka yang bersama-Nya
  rationale: Menerjemahkan frasa substantival secara langsung tanpa menentukan lebih jauh identitas atau peran kelompok tersebut.
- source_word: κλητοὶ
  choice: dipanggil
  rationale: Mempertahankan resonansi leksikal dan teologis κλητός tanpa menentukan apakah panggilan itu terutama undangan atau panggilan yang efektif.
- source_word: ἐκλεκτοὶ
  choice: dipilih
  rationale: Bahasa Indonesia modern yang mudah dipahami dan tidak memasukkan sistem teologis tertentu melalui istilah teknis.
- source_word: πιστοί
  choice: setia
  rationale: Dalam rangkaian tiga sifat ini, 'setia' paling baik menyatakan keteguhan dan kesetiaan kepada Anak Domba, sambil tidak menutup sepenuhnya nuansa dapat dipercaya.
theological_decisions:
- issue: Gelar dan bahasa kemenangan Anak Domba
  choice: Memakai 'Anak Domba' dan 'akan mengalahkan' untuk mempertahankan kosakata kristologis dan motif kemenangan dalam Wahyu.
  alternative: '''anak domba ... akan menang atas mereka'' atau ''Anak Domba ... akan menaklukkan mereka'''
  rationale: Teks menampilkan Yesus yang ditinggikan dengan gelar khas ἀρνίον dan memakai νικάω, kata tematis yang berulang dalam Wahyu. Terjemahan ini menjaga koherensi kitab tanpa menambahkan doktrin di luar teks.
- issue: Rangkaian κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: Menerjemahkan ketiga sebutan sebagai 'dipanggil, dipilih, dan setia' tanpa menjelaskan hubungan sistematis di antara ketiganya.
  alternative: '''terpanggil, terpilih, dan dapat dipercaya'' atau ''dipanggil, umat pilihan, dan setia'''
  rationale: Teks hanya memberikan tiga sebutan bagi mereka yang bersama Anak Domba. Bentuk terjemahan mempertahankan rangkaian tersebut dan tidak menyelesaikan perdebatan tentang panggilan, pemilihan, atau ketekunan.
- issue: Hubungan οἱ μετ’ αὐτοῦ dengan kemenangan
  choice: 'Membuatnya sebagai kalimat kedua: ''Mereka yang bersama-Nya adalah ...'''
  alternative: 'Menggabungkannya: ''dan mereka yang bersama-Nya, yaitu yang dipanggil, dipilih, dan setia, juga akan menang.'''
  rationale: Bahasa Yunani tidak memiliki verba eksplisit bagi klausa terakhir dan membiarkan hubungan sintaksisnya agak padat. Kalimat nominal Indonesia mempertahankan identifikasi tiga sifat itu tanpa menambahkan secara eksplisit bahwa para pengikut tersebut 'juga akan menang', meskipun hal itu mungkin tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada Anak Domba, Dia, Tuhan, Raja, dan -Nya menandai rujukan kristologis secara konvensional. Pengulangan 'segala' membuat kedua gelar supremasi jelas bagi pembaca umum. Klausa terakhir dipisahkan menjadi kalimat nominal agar alami tanpa menambahkan verba kemenangan yang tidak dinyatakan secara eksplisit dalam teks Yunani.
