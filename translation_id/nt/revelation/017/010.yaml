review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “Lima orang” menggeser rujukan eliptis kepada para raja menjadi lima orang secara umum dan dalam bahasa Indonesia mudah dipahami sebagai jatuh secara fisik. “Masih ada” juga menambahkan nuansa keberlanjutan yang tidak dinyatakan oleh ἔστιν. Teks revisi mempertahankan rangkaian eliptis Yunani dan keharusan dalam δεῖ tanpa mengidentifikasi para raja.
  naturalness: “Lima sudah jatuh, yang satu ada, yang lain belum datang” adalah bentuk ringkas dan wajar dalam register Alkitabiah Indonesia ketika rujukannya telah diberikan dalam konteks sebelumnya. “Ketika ia datang” lebih langsung untuk ὅταν ἔλθῃ, sedangkan “tinggal sebentar” idiomatis untuk durasi singkat.
  terminology: Istilah “raja” dipertahankan dalam catatan kaki sebagai penjelasan kontekstual, bukan dimasukkan secara interpretatif ke dalam teks utama. “Jatuh,” “ada,” “datang,” “harus,” dan “tinggal” secara dekat mencerminkan πίπτω, εἰμί, ἔρχομαι, δεῖ, dan μένω.
  issues:
  - severity: medium
    issue: “Lima orang” menambahkan nomina umum yang tidak ada dalam teks dan mengaburkan rujukan kontekstual kepada raja-raja.
    rationale: Yunani memakai bilangan eliptis yang merujuk kepada “raja-raja” pada klausa sebelumnya. Dalam bahasa Indonesia, “lima orang telah jatuh” sangat mudah dibaca secara harfiah sebagai orang-orang yang jatuh, bukan sebagai kejatuhan/penggantian penguasa.
  - severity: low
    issue: “Masih ada” menambahkan aspek ‘masih’ pada ὁ εἷς ἔστιν.
    rationale: ἔστιν hanya menyatakan “ada/is”; walaupun “masih” dapat terasa cocok dalam urutan, tambahan itu sebaiknya dihindari agar elipsis sumber tetap terjaga.
  - severity: low
    issue: “Apabila” dapat memberi warna kondisional lebih kuat daripada temporal future contingency dalam ὅταν.
    rationale: “Ketika ia datang” menyampaikan kejadian mendatang yang diantisipasi tanpa menyiratkan keraguan mengenai apakah ia akan datang.
  revised_text: Lima sudah jatuh[a], yang satu ada, yang lain belum datang; dan ketika ia datang, ia harus tinggal sebentar.
