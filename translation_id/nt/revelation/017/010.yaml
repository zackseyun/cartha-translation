- from: Lima orang telah jatuh[a], yang satu masih ada, dan yang lain belum datang. Apabila ia datang, ia harus tinggal untuk waktu yang singkat.
  to: Lima sudah jatuh[a], yang satu ada, yang lain belum datang; dan ketika ia datang, ia harus tinggal sebentar.
  rationale: Revisi menghapus “orang” untuk mencegah pembacaan yang tidak dimaksudkan, mengganti “masih ada” dengan “ada” demi kesetiaan pada bentuk eliptis ἔστιν, dan memakai “ketika” serta “sebentar” untuk padanan Indonesia yang alami dan langsung. Catatan kaki tetap menjelaskan rujukan kepada raja-raja tanpa memaksakan identifikasi historis apa pun.
