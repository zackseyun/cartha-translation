  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: id
  text: Lima sudah jatuh[a], yang satu ada, yang lain belum datang; dan ketika ia datang, ia harus tinggal sebentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih jelas sesuai konteks: “Lima raja sudah jatuh, satu raja ada, dan raja yang lain belum datang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Lima orang
  rationale: Artikel dan bilangan menunjuk kembali kepada tujuh raja pada ayat sebelumnya. Penambahan 'orang' membuat rujukan personalnya alami dalam bahasa Indonesia tanpa menyebut 'raja' secara eksplisit dalam teks utama.
- source_word: ἔπεσαν
  choice: telah jatuh
  rationale: Mempertahankan metafora apokaliptik πίπτω serta menyatakan tindakan lampau yang hasilnya tetap berlaku.
- source_word: ὁ εἷς ἔστιν
  choice: yang satu masih ada
  rationale: Ungkapan Yunani sangat ringkas, harfiah 'yang satu ada'. 'Masih ada' terdengar alami dalam rangkaian waktu ini tanpa mempersempit maknanya menjadi 'memerintah'.
- source_word: ὁ ἄλλος οὔπω ἦλθεν
  choice: yang lain belum datang
  rationale: Menjaga kontras berurutan antara lima, satu, dan sosok berikutnya; bentuk 'belum datang' merupakan padanan Indonesia yang alami.
- source_word: ὅταν ἔλθῃ
  choice: Apabila ia datang
  rationale: ὅταν dengan subjungtif menyatakan kejadian mendatang. 'Apabila' mempertahankan nuansa temporal-kondisionalnya.
- source_word: ὀλίγον αὐτὸν δεῖ μεῖναι
  choice: ia harus tinggal untuk waktu yang singkat
  rationale: δεῖ menyatakan keharusan, sedangkan ὀλίγον membatasi lamanya. 'Tinggal' merupakan padanan alami bagi μεῖναι dalam konteks keberadaan untuk suatu jangka waktu.
theological_decisions:
- issue: Kekhususan identitas tujuh raja
  choice: Mempertahankan ungkapan eliptis dalam teks utama dan menjelaskan bahwa rujukannya adalah raja-raja hanya dalam catatan kaki.
  alternative: Menyebut 'lima raja ... satu raja ... raja yang lain' secara langsung atau mengidentifikasi mereka dengan penguasa historis tertentu.
  rationale: Konteks langsung menyebut tujuh raja, tetapi ungkapan ayat ini sendiri ringkas. Pilihan ini mempertahankan ambiguitas apokaliptik dan tidak memasukkan skema identifikasi historis yang diperdebatkan.
- issue: Makna keharusan dalam δεῖ
  choice: Menerjemahkan 'harus' tanpa menjelaskan sumber atau sifat keharusan tersebut.
  alternative: Menafsirkannya secara eksplisit sebagai ketetapan ilahi.
  rationale: δεῖ memang menyatakan keharusan, tetapi ayat ini tidak menyebut pelakunya atau memberi penjelasan teologis eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara metafora 'jatuh', keelliptisan urutan para raja, dan keharusan yang tidak dijelaskan tetap dipertahankan.
