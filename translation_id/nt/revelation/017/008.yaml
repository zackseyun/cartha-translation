id: REV.17.8
reference: Revelation 17:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: id
  text: Binatang yang kaulihat itu dahulu ada, tetapi sekarang tidak ada. Ia akan segera naik dari jurang tak berdasar lalu menuju kebinasaan. Para penghuni bumi—orang-orang yang namanya tidak tertulis dalam kitab kehidupan sejak dunia dijadikan—akan takjub ketika melihat binatang itu, sebab ia dahulu ada, sekarang tidak ada, dan kelak akan hadir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “akan takjub ketika melihat bahwa binatang itu dahulu ada, sekarang tidak ada, dan kelak akan datang (atau: tampak).” Kata Yunani yang diterjemahkan “sebab” dapat menyatakan alasan atau memperkenalkan isi, sedangkan “akan hadir” juga dapat dipahami sebagai “akan datang” atau “akan tampak.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ θηρίον
  choice: binatang
  rationale: Dalam konteks apokaliptik Wahyu, “binatang” merupakan padanan Indonesia yang lazim bagi sosok simbolis ini; konteks mempertahankan daya mengerikannya tanpa perlu menambahkan sifat yang tidak dinyatakan.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: dahulu ada, tetapi sekarang tidak ada
  rationale: Mempertahankan pertentangan temporal yang tajam dalam bahasa Indonesia yang alami, tanpa menjelaskannya sebagai kematian atau kebangkitan.
- source_word: μέλλει ἀναβαίνειν
  choice: akan segera naik
  rationale: “Akan segera” menyampaikan nuansa tindakan yang akan berlangsung atau sudah di ambang terjadi dalam μέλλει, sedangkan “naik” mempertahankan arah gerak ἀναβαίνειν.
- source_word: ἐκ τῆς ἀβύσσου
  choice: dari jurang tak berdasar
  rationale: Mengungkapkan gambaran ἄβυσσος secara jelas tanpa memasukkan unsur “maut” yang tidak terdapat dalam istilah Yunani.
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: menuju kebinasaan
  rationale: Menyampaikan gerak menuju kehancuran akhir dengan ungkapan Indonesia yang ringkas dan bermartabat.
- source_word: θαυμασθήσονται
  choice: akan takjub
  rationale: Mengungkapkan rasa heran yang kuat dalam bentuk masa depan secara wajar dalam bahasa Indonesia.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: para penghuni bumi
  rationale: Menjaga ungkapan berulang dalam Wahyu dan gagasan orang-orang yang menetap atau beridentitas dengan bumi.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: orang-orang yang namanya tidak tertulis
  rationale: “Namanya” mempertahankan bentuk tunggal distributif τὸ ὄνομα dan tetap alami dengan anteseden jamak dalam bahasa Indonesia.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: dalam kitab kehidupan
  rationale: Bahasa Indonesia secara idiomatis mengatakan nama tertulis “dalam” sebuah kitab, walaupun preposisi Yunani secara harfiah dapat berarti “di atas/pada”.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: sejak dunia dijadikan
  rationale: Padanan alami bagi ungkapan temporal “sejak peletakan dasar dunia” yang mempertahankan cakupan waktunya tanpa memperluas implikasi teologisnya.
- source_word: βλεπόντων
  choice: ketika melihat
  rationale: Partisip genitif diterjemahkan sebagai keterangan waktu yang menghubungkan ketakjuban mereka dengan tindakan melihat.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: sebab ia dahulu ada, sekarang tidak ada, dan kelak akan hadir
  rationale: “Sebab” mengambil ὅτι secara kausal, sedangkan “akan hadir” mempertahankan arti dasar bentuk futur πάρειμι dan kontras dengan “tidak ada”; ambiguitasnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan frasa “sejak dunia dijadikan”
  choice: Dihubungkan dengan tidak tertulisnya nama dalam kitab kehidupan.
  alternative: Membaca frasa tersebut melalui konsep dari ayat lain atau menjadikannya pernyataan teologis yang lebih luas.
  rationale: Urutan sintaksis Yunani paling alami mengaitkannya dengan frasa “tidak tertulis dalam kitab kehidupan”; terjemahan tidak mengembangkan sistem predestinasi di luar yang dinyatakan ayat.
- issue: Makna παρέσται
  choice: akan hadir
  alternative: akan datang; akan tampak
  rationale: Bentuk futur πάρειμι menunjuk pada kehadiran atau kedatangan. “Akan hadir” menjaga permainan kontras dengan “sekarang tidak ada” tanpa secara eksplisit menyatakannya sebagai kebangkitan.
- issue: Fungsi ὅτι sebelum rangkaian temporal terakhir
  choice: Diterjemahkan secara kausal sebagai “sebab”.
  alternative: 'Diterjemahkan sebagai penanda isi: “bahwa”.'
  rationale: Bacaan kausal menjelaskan alasan para penghuni bumi takjub, tetapi bahasa Yunani memungkinkan bacaan isi; alternatif ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kaulihat” mempertahankan sapaan orang kedua tunggal secara ringkas. Tanda pisah membantu pembaca mengikuti klausa relatif yang panjang, sedangkan pengulangan “dahulu ada, sekarang tidak ada” menjaga gaya retoris sumber.
