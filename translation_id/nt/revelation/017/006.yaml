id: REV.17.6
reference: Revelation 17:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: id
  text: Lalu aku melihat perempuan itu mabuk oleh darah orang-orang kudus dan oleh darah para saksi Yesus.[a] Ketika melihatnya, aku sangat heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para martir Yesus.” Kata Yunani yang dipakai dapat berarti “saksi” atau “martir”; penyebutan darah mereka membuat arti “martir” sangat sesuai dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: mabuk oleh darah
  rationale: Ungkapan ini mempertahankan gambaran mengejutkan tentang kemabukan akibat pertumpahan darah. Kata depan ἐκ secara harfiah menyatakan sumber, tetapi dalam bahasa Indonesia hubungan tersebut paling alami diungkapkan dengan 'mabuk oleh darah'.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Dalam Kitab Wahyu, bentuk jamak substantival ini lazim menunjuk kepada umat Allah yang dikuduskan. Pilihan ini jelas dan tidak menyiratkan golongan gerejawi tertentu.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: para saksi Yesus
  rationale: μάρτυς pada dasarnya berarti 'saksi' dan dalam konteks penganiayaan dapat berkembang menjadi 'martir'. Penyebutan darah mereka membuat nuansa kemartiran kuat, tetapi 'saksi' mempertahankan keluasan makna leksikal dan kaitannya dengan kesaksian dalam Kitab Wahyu.
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: aku sangat heran
  rationale: Akusatif serumpun θαῦμα μέγα memperkuat verba ἐθαύμασα. Ungkapan adverbial 'sangat heran' menyampaikan penekanan itu secara alami dalam bahasa Indonesia tanpa menambah penilaian moral.
- source_word: ἰδὼν αὐτήν
  choice: ketika melihatnya
  rationale: Partisip aoris ini secara alami menyatakan keadaan temporal yang menyertai rasa heran Yohanes. Bentuk ini tetap dekat dengan struktur sumber dan mudah dipahami.
theological_decisions:
- issue: Makna μάρτυρες dalam konteks penganiayaan apokaliptik
  choice: para saksi Yesus
  alternative: para martir Yesus
  rationale: Teks menekankan darah mereka sehingga kemartiran jelas tersirat, tetapi μάρτυρες juga membawa gagasan kesaksian. Teks utama mempertahankan 'saksi', sedangkan catatan kaki menyajikan 'martir' sebagai kemungkinan yang sangat sesuai dengan konteks.
- issue: Sifat keheranan Yohanes
  choice: sangat heran
  alternative: sangat kagum
  rationale: θαυμάζω dapat menunjuk pada rasa heran atau takjub tanpa dengan sendirinya menyatakan persetujuan. 'Heran' menjaga kenetralan tersebut dan tidak membuat Yohanes seolah-olah mengagumi kejahatan perempuan itu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina narator 'aku' selaras dengan gaya kesaksian pribadi dalam Kitab Wahyu. Pengulangan 'darah ... dan ... darah' dipertahankan untuk menjaga penekanan retoris teks Yunani.
