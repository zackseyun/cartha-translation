id: REV.17.17
reference: Revelation 17:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: id
  text: Sebab Allah telah menaruh dalam hati mereka untuk melaksanakan maksud-Nya, untuk bertindak dengan satu tujuan, dan untuk menyerahkan kerajaan mereka kepada binatang itu, sampai perkataan Allah digenapi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: menaruh dalam hati mereka
  rationale: Ungkapan ini menyatakan bahwa Allah menanamkan dorongan atau maksud dalam batin mereka. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan metafora hati.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: melaksanakan maksud-Nya
  rationale: γνώμη di sini menunjuk pada maksud atau kehendak yang disengaja, sedangkan ποιῆσαι menyatakan pelaksanaannya.
- source_word: ποιῆσαι μίαν γνώμην
  choice: bertindak dengan satu tujuan
  rationale: Ungkapan Yunani ini padat, secara harfiah mendekati 'membuat satu maksud'. Pilihan ini menyampaikan kesatuan tekad yang terwujud dalam tindakan tanpa membatasinya pada kesepakatan pikiran saja.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: menyerahkan kerajaan mereka
  rationale: Dalam konteks para raja yang mengalihkan kekuasaan kepada binatang itu, 'menyerahkan' lebih alami daripada 'memberikan' dan tetap mempertahankan bentuk tunggal βασιλεία dengan pemilik jamak.
- source_word: τῷ θηρίῳ
  choice: kepada binatang itu
  rationale: Istilah 'binatang' mempertahankan citra apokaliptik θηρίον dan kesinambungan istilah dalam kitab Wahyu.
- source_word: ἄχρι τελεσθήσονται
  choice: sampai ... digenapi
  rationale: Bentuk pasif mendatang τελεσθήσονται menunjukkan bahwa perkataan Allah akan mencapai penggenapan atau penyelesaiannya; 'digenapi' sesuai dengan ragam nubuat.
- source_word: οἱ λόγοι τοῦ θεοῦ
  choice: firman-firman Allah
  rationale: Bentuk jamak λόγοι dipertahankan. 'Firman-firman' memberikan ragam yang luhur dan menunjukkan berbagai pernyataan ilahi yang harus digenapi.
theological_decisions:
- issue: Kedaulatan Allah dan tindakan nyata para penguasa
  choice: Menyatakan bahwa Allah menaruh maksud dalam hati mereka, sementara mereka sendiri bertindak dan menyerahkan kerajaan mereka.
  alternative: Melemahkan peran Allah menjadi sekadar 'mengizinkan', atau memperkuatnya dengan parafrasa deterministis yang melampaui teks.
  rationale: Ayat ini secara bersamaan menegaskan tindakan Allah dan tindakan para penguasa. Terjemahan mempertahankan ketegangan tersebut tanpa menyelesaikannya ke salah satu arah.
- issue: Rujukan pronomina αὐτοῦ
  choice: maksud-Nya, yakni maksud Allah
  alternative: Mengaitkannya dengan subjek lain dalam konteks yang lebih luas.
  rationale: Anteseden gramatikal yang paling langsung adalah ὁ θεός, sehingga huruf kapital pada '-Nya' memperjelas rujukan yang telah dinyatakan oleh struktur Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga infinitif dipertahankan melalui pengulangan 'untuk' agar kesejajaran tindakan terlihat jelas. Tidak diperlukan catatan kaki karena pilihan utama menyampaikan makna teks dengan wajar tanpa menutup ambiguitas penting.
