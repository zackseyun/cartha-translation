  to: Lalu malaikat itu berkata kepadaku, “Mengapa kamu heran? Aku akan memberitahukan kepadamu rahasia tentang perempuan itu dan tentang binatang buas yang membawanya[a], yang memiliki tujuh kepala dan sepuluh tanduk.”
