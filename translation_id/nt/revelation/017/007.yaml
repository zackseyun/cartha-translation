    issue: Frasa “yaitu binatang yang memiliki” mengulang nomina “binatang” setelah “binatang buas yang membawanya.”
    rationale: Teks Yunani memakai dua partisipel yang sama-sama menerangkan θηρίου. Dalam bahasa Indonesia, dua klausa relatif berurutan dapat mempertahankan hubungan ini tanpa pengulangan yang tidak ada dalam sumber.
  - severity: low
    issue: 'Catatan kaki “Atau: menopangnya” kurang tepat sebagai alternatif langsung bagi “membawanya.”'
    rationale: “Menanggungnya” lebih langsung mencerminkan rentang βαστάζω (‘membawa/menanggung’) dan lebih idiomatis sebagai alternatif yang tetap mempertahankan objek perempuan itu.
