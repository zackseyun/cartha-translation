  source_fidelity: Secara umum setia pada teks Yunani. Namun, pengulangan “yaitu binatang” tidak diperlukan dan membuat struktur kalimat kurang langsung; dua klausa relatif dapat langsung menerangkan “binatang buas,” sebagaimana partisipel Yunani menerangkan θηρίου.
  naturalness: Pilihan “Mengapa kamu heran?”, “rahasia,” “perempuan,” dan “binatang buas” alami dalam bahasa Indonesia modern serta sesuai dengan ragam apokaliptik yang khidmat. Menghapus pengulangan nomina menghasilkan kalimat yang lebih lancar.
  terminology: “Rahasia” mempertahankan pengertian μυστήριον sebagai realitas yang disingkapkan; “binatang buas,” “kepala,” dan “tanduk” mempertahankan citra Wahyu. Catatan alternatif untuk βαστάζοντος sebaiknya memakai “menanggungnya,” yang merupakan alternatif leksikal langsung untuk “membawanya.”
  issues:
