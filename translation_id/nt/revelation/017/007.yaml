id: REV.17.7
reference: Revelation 17:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: id
  text: Lalu malaikat itu berkata kepadaku, “Mengapa kamu heran? Aku akan memberitahukan kepadamu rahasia tentang perempuan itu dan tentang binatang buas yang membawanya[a], yang memiliki tujuh kepala dan sepuluh tanduk.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menanggungnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασας
  choice: kamu heran
  rationale: Kata θαυμάζω menyatakan rasa takjub atau keheranan. 'Heran' alami dalam bahasa Indonesia modern dan, dalam konteks ini, lebih kuat daripada sekadar rasa ingin tahu.
- source_word: μυστήριον
  choice: rahasia
  rationale: Dalam konteks apokaliptik, μυστήριον menunjuk pada kenyataan yang sebelumnya tersembunyi dan kini disingkapkan. 'Rahasia' menyampaikan gagasan itu dengan jelas tanpa menjadikannya sekadar teka-teki.
- source_word: γυναικός
  choice: perempuan
  rationale: γυνή dapat berarti perempuan atau istri, tetapi di sini tidak dinyatakan hubungan perkawinan; sosok simbolis itu paling tepat disebut 'perempuan'.
- source_word: θηρίου
  choice: binatang buas
  rationale: θηρίον merupakan istilah apokaliptik penting dalam Wahyu dan membawa kesan liar, mengancam, serta mengerikan. 'Binatang buas' mempertahankan konotasi tersebut.
- source_word: βαστάζοντος
  choice: yang membawanya
  rationale: βαστάζω dapat berarti membawa, menanggung, atau menopang. 'Membawanya' paling alami untuk menggambarkan perempuan yang berada di atas binatang itu, sementara alternatif maknanya dicatat dalam catatan kaki.
- source_word: ἔχοντος
  choice: yang memiliki
  rationale: Partisipel ini menerangkan binatang. Klausa relatif 'yang memiliki' alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksis tersebut.
- source_word: κεφαλάς
  choice: kepala
  rationale: Gambaran anatomis harfiah perlu dipertahankan karena merupakan unsur pokok penglihatan simbolis.
- source_word: κέρατα
  choice: tanduk
  rationale: Terjemahan harfiah mempertahankan citra simbolis yang konsisten dalam sastra apokaliptik.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang ringkas dan alami dalam bahasa Indonesia.
- source_word: ἐρῶ σοι
  choice: Aku akan memberitahukan kepadamu
  rationale: Bentuk mendatang dari λέγω memperkenalkan penyingkapan yang akan disampaikan malaikat. Ungkapan ini jelas, alami, dan tetap bernada khidmat.
theological_decisions:
- issue: Acuan frasa relatif tentang tujuh kepala dan sepuluh tanduk
  choice: Frasa tersebut secara jelas diterapkan pada binatang buas.
  alternative: Membiarkan frasa itu dapat dipahami sebagai keterangan tentang perempuan atau keseluruhan rahasia.
  rationale: Partisipel genitif τοῦ βαστάζοντος dan τοῦ ἔχοντος sesuai secara gramatikal dengan θηρίου, bukan dengan γυναικός. Pengulangan 'yaitu binatang' memperjelas hubungan yang sudah jelas dalam bahasa Yunani tanpa menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. 'Binatang buas' mempertahankan nuansa apokaliptik θηρίον, sedangkan 'rahasia' menyampaikan sesuatu yang tersembunyi lalu disingkapkan. Penanda catatan kaki ditempatkan langsung sesudah kata yang diterangkannya.
