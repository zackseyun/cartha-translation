id: REV.17.12
reference: Revelation 17:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: id
  text: Dan kesepuluh tanduk yang kaulihat itu adalah sepuluh raja yang belum menerima kerajaan, tetapi mereka menerima wewenang sebagai raja selama satu jam[a] bersama binatang buas itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selama waktu yang singkat.” Dalam gambaran apokaliptik, ungkapan “satu jam” kemungkinan menunjuk pada masa yang singkat dan terbatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: tanduk
  rationale: Diterjemahkan secara harfiah untuk mempertahankan gambaran apokaliptik; makna simbolisnya dijelaskan oleh penyamaan tanduk-tanduk itu dengan para raja.
- source_word: βασιλεῖς
  choice: raja
  rationale: Ini adalah padanan leksikal langsung yang tetap membiarkan terbuka apakah para raja tersebut dipahami secara harfiah atau simbolis.
- source_word: βασιλείαν
  choice: kerajaan
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan pembedaan dengan ἐξουσίαν, yaitu wewenang yang disebut sesudahnya.
- source_word: οὔπω ἔλαβον
  choice: belum menerima
  rationale: 'Mengungkapkan penyangkalan temporal dengan jelas dan alami: penerimaan kerajaan itu belum terjadi pada tahap yang digambarkan.'
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menunjukkan hak atau kuasa untuk memerintah tanpa mencampurkannya dengan 'kerajaan' dalam klausa sebelumnya.
- source_word: ὡς βασιλεῖς
  choice: sebagai raja
  rationale: Menyampaikan status atau kapasitas mereka ketika menerima wewenang, bukan sekadar kemiripan lahiriah.
- source_word: μίαν ὥραν
  choice: selama satu jam
  rationale: Bentuk harfiah dipertahankan agar gambaran waktu dalam teks apokaliptik tidak ditafsirkan langsung di dalam teks utama; kemungkinan makna figuratif dicatat dalam catatan kaki.
- source_word: λαμβάνουσιν
  choice: mereka menerima
  rationale: Bentuk kini Yunani dipertahankan secara langsung, selaras dengan gaya penglihatan apokaliptik yang hidup, tanpa menutup kemungkinan nuansa masa depan dari konteks.
- source_word: μετὰ τοῦ θηρίου
  choice: bersama binatang buas itu
  rationale: Menyatakan hubungan atau persekutuan mereka dengan sosok tersebut; 'binatang buas' mempertahankan daya citra θηρίον dan bentuk definitnya dinyatakan dengan 'itu'.
theological_decisions:
- issue: Apakah kesepuluh raja harus dijelaskan sebagai raja harfiah atau sebagai penguasa maupun kekuatan simbolis
  choice: Mempertahankan ungkapan leksikal 'sepuluh raja' tanpa penjelasan interpretatif dalam teks utama.
  alternative: Sepuluh penguasa simbolis; sepuluh kerajaan atau kekuatan politik.
  rationale: Teks Yunani secara eksplisit menyebut mereka 'sepuluh raja', sedangkan konteks apokaliptik membuka kemungkinan makna simbolis. Terjemahan mempertahankan ketegangan itu.
- issue: Apakah μίαν ὥραν menunjuk satu jam harfiah atau masa singkat secara figuratif
  choice: Menerjemahkan 'selama satu jam' dalam teks utama.
  alternative: Selama waktu yang singkat; untuk sesaat.
  rationale: Ungkapan sumber secara formal berarti 'satu jam', tetapi dalam gambaran apokaliptik kemungkinan besar menandakan masa yang singkat dan terbatas. Kemungkinan itu dijelaskan dalam catatan kaki, bukan dipastikan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Istilah konkret seperti 'tanduk', 'raja', dan 'binatang buas' dipertahankan untuk menjaga citra apokaliptik. Penanda catatan kaki ditempatkan sesudah 'satu jam', yaitu ungkapan yang dijelaskannya.
