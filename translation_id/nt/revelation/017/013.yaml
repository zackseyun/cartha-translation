  source_fidelity: Teks dengan setia menerjemahkan οὗτοι μίαν γνώμην ἔχουσιν sebagai “Mereka ini sehati,” sambil mempertahankan keluasan makna kesatuan pandangan, tekad, atau maksud. Kedua nomina δύναμιν dan ἐξουσίαν tetap dibedakan sebagai “kuasa dan wewenang.” “Menyerahkan” merupakan padanan kontekstual yang wajar bagi διδόασιν dalam tindakan pengalihan kuasa kepada binatang itu, tanpa mengubah makna pokok.
  naturalness: Kalimatnya baku, jelas, dan alami dalam bahasa Indonesia modern. “Mereka ini” mempertahankan fungsi penunjukan dari οὗτοι, sedangkan “binatang itu” tepat untuk figur tertentu yang telah disebut dalam konteks.
