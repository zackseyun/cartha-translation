id: REV.17.13
reference: Revelation 17:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: id
  text: Mereka ini sehati[a], dan mereka menyerahkan kuasa dan wewenang mereka kepada binatang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memiliki satu tujuan.” Ungkapan Yunani secara harfiah berarti “memiliki satu pikiran” dan dapat menyatakan kesamaan tekad atau tujuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Mereka ini
  rationale: Kata ganti penunjuk ini merujuk kembali kepada kesepuluh raja; “mereka ini” mempertahankan daya tunjuknya secara wajar dalam bahasa Indonesia.
- source_word: μίαν γνώμην ἔχουσιν
  choice: sehati
  rationale: Ungkapan ini secara harfiah menyatakan bahwa mereka memiliki satu pikiran atau pendirian. “Sehati” mempertahankan gagasan kesatuan sikap tanpa membatasi maknanya hanya pada pendapat atau tujuan.
- source_word: δύναμιν
  choice: kuasa
  rationale: Dalam konteks politik-apokaliptik, kata ini menunjuk pada daya atau kemampuan efektif; “kuasa” merupakan padanan Indonesia yang alami.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Kata ini menunjuk pada otoritas atau hak untuk memerintah. “Wewenang” membedakannya dari kuasa sebagai kemampuan efektif.
- source_word: τῷ θηρίῳ
  choice: kepada binatang itu
  rationale: Dalam kitab Wahyu, θηρίον adalah tokoh apokaliptik tertentu; “binatang itu” mempertahankan artikelnya dan sesuai dengan bahasa Indonesia modern.
- source_word: διδόασιν
  choice: mereka menyerahkan
  rationale: Walaupun arti dasarnya adalah “memberikan”, dalam konteks pemberian kuasa dan wewenang kepada binatang itu, “menyerahkan” mengungkapkan tindakan pengalihan dengan alami tanpa menambahkan gagasan yang tidak tersurat.
theological_decisions:
- issue: Makna ungkapan μίαν γνώμην ἔχουσιν dalam konteks politik-apokaliptik
  choice: sehati
  alternative: memiliki satu tujuan; sependirian
  rationale: Ungkapan Yunani dapat menyatakan kesamaan pikiran, tekad, atau tujuan. “Sehati” menjaga keluasan makna itu, sedangkan catatan kaki memberi alternatif kontekstual.
- issue: Pembedaan δύναμις dan ἐξουσία
  choice: kuasa dan wewenang
  alternative: kekuatan dan otoritas; kuasa dan hak memerintah
  rationale: Dua istilah dipertahankan agar kemampuan efektif tidak dilebur dengan kewenangan untuk memerintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan idiom kesatuan pikiran serta pembedaan antara kuasa dan wewenang.
