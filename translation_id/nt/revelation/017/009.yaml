  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: id
  text: 'Di sinilah diperlukan pikiran yang memiliki hikmat: ketujuh kepala itu adalah tujuh gunung[a] yang di atasnya perempuan itu duduk, dan ketujuhnya adalah tujuh raja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuh bukit.” Kata Yunani yang digunakan dapat merujuk pada gunung atau bukit; “gunung” adalah terjemahan yang lebih langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: Di sinilah
  rationale: Menandai diperkenalkannya penjelasan dan secara alami mempertahankan daya tunjuk ungkapan Yunani.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: diperlukan pikiran yang memiliki hikmat
  rationale: Mempertahankan unsur 'pikiran' dan 'memiliki hikmat', sementara 'diperlukan' membuat fungsi idiomatis ungkapan itu jelas dan wajar dalam bahasa Indonesia.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: ketujuh kepala itu
  rationale: Mempertahankan istilah simbolis tanpa menafsirkannya lebih lanjut.
- source_word: ἑπτὰ ὄρη
  choice: tujuh gunung
  rationale: Gunung merupakan padanan langsung dan umum bagi ὄρη; kemungkinan arti 'bukit' dicatat dalam catatan kaki.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: tempat perempuan itu duduk
  rationale: Mengungkapkan hubungan tempat secara alami dalam bahasa Indonesia tanpa mengulang secara janggal 'tempat ... duduk di atasnya'; gagasan bahwa gunung-gunung itu menjadi tempat duduk tetap terpelihara.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: dan ketujuhnya adalah tujuh raja
  rationale: Menyediakan subjek tersirat yang merujuk kepada ketujuh kepala, sehingga identifikasi simbolis dengan tujuh raja tetap jelas tanpa mengubahnya menjadi pernyataan lepas 'ada tujuh raja'.
theological_decisions:
- issue: Identifikasi simbolis ketujuh kepala
  choice: Mempertahankan identifikasi sebagai tujuh gunung dan tujuh raja tanpa menentukan rujukan sejarahnya.
  alternative: Menafsirkannya secara eksplisit sebagai tujuh bukit Roma, kaisar-kaisar, kerajaan-kerajaan, atau skema apokaliptik tertentu.
  rationale: Ayat ini memberikan hubungan simbolis, tetapi tidak mengharuskan terjemahan menetapkan satu rujukan sejarah tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur simbolis dipertahankan, sedangkan susunan klausa dibuat alami bagi pembaca umum.
