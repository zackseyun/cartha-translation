id: REV.17.18
reference: Revelation 17:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: id
  text: Perempuan yang kaulihat itu adalah kota besar yang berkuasa atas raja-raja di bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang memiliki kekuasaan kerajaan atas raja-raja di bumi.” Ungkapan Yunani secara harfiah berbunyi “memiliki kerajaan” dan juga dapat dipahami sebagai memiliki pemerintahan atau kedaulatan kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: perempuan
  rationale: Dalam konteks penglihatan ini, kata tersebut menunjuk kepada sosok perempuan simbolis, bukan kepada seorang istri.
- source_word: ἣν εἶδες
  choice: yang kaulihat
  rationale: Klausa relatif ini secara langsung menunjuk kembali kepada sosok yang telah dilihat Yohanes; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: πόλις ἡ μεγάλη
  choice: kota besar
  rationale: Ini adalah padanan langsung dan wajar yang mempertahankan identifikasi apokaliptis dalam teks.
- source_word: ἔχουσα βασιλείαν
  choice: yang berkuasa
  rationale: Secara harfiah ungkapan ini berarti 'memiliki kerajaan/kekuasaan kerajaan'. Dalam konteks kekuasaan atas para raja, 'berkuasa' menyampaikan fungsi pemerintahan dengan alami tanpa menganggap kota itu sebagai wilayah kerajaan.
- source_word: βασιλεία
  choice: kekuasaan
  rationale: Di sini kata tersebut terutama menunjuk pada pemerintahan, kedaulatan, atau kuasa kerajaan, bukan semata-mata suatu wilayah.
- source_word: ἐπὶ τῶν βασιλέων
  choice: atas raja-raja
  rationale: Dengan bentuk genitif, ἐπί di sini menyatakan kewenangan atau kekuasaan atas para raja.
- source_word: τῆς γῆς
  choice: di bumi
  rationale: Dalam konteks apokaliptis kitab Wahyu, γῆ paling wajar dipahami dengan cakupan luas sebagai bumi, bukan suatu negeri tertentu.
theological_decisions:
- issue: Sifat identifikasi antara perempuan dan kota
  choice: 'Mempertahankan identifikasi langsung: ''perempuan ... itu adalah kota besar''.'
  alternative: 'Menerjemahkan secara tafsiran: ''melambangkan kota besar''.'
  rationale: Teks Yunani memakai kopula sederhana ἔστιν ('adalah'). Bentuk langsung mempertahankan simbolisme dan ketegangan teologis teks tanpa menjelaskannya secara berlebihan.
- issue: Makna ἔχουσα βασιλείαν
  choice: Menerjemahkan secara fungsional sebagai 'yang berkuasa'.
  alternative: Menerjemahkan lebih harfiah sebagai 'yang memiliki kerajaan/kekuasaan kerajaan'.
  rationale: Konstruksi dengan 'atas raja-raja di bumi' menekankan kekuasaan pemerintahan. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kaulihat' mempertahankan sapaan orang kedua tunggal secara ringkas; 'raja-raja di bumi' terdengar alami dan mempertahankan cakupan apokaliptis. Penanda catatan kaki ditempatkan sesudah tanda titik sesuai teks utama.
