- from: 'Pada dahinya tertulis suatu nama: “Rahasia[a], Babel Besar, ibu para pelacur dan segala kekejian di bumi.”'
  to: 'Pada dahinya tertulis suatu nama: “Rahasia[a], Babel yang Besar, ibu para pelacur dan kekejian di bumi.”'
  rationale: Revisi menghapus “segala,” yang menambahkan totalitas pada bentuk jamak Yunani, dan memakai “Babel yang Besar” agar gelar ἡ μεγάλη tersampaikan dengan lebih alami. Catatan kaki tetap mempertahankan ambiguitas tanda baca mengenai apakah μυστήριον termasuk dalam tulisan atau memperkenalkan makna simbolisnya.
