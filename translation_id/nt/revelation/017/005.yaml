  source_fidelity: Struktur pokok dan pembacaan μυστήριον sebagai bagian dari tulisan telah diterjemahkan dengan setia. Namun, “segala kekejian” menambahkan cakupan universal (“all”) yang tidak dinyatakan oleh bentuk jamak τῶν βδελυγμάτων. Bentuk tanpa “segala” lebih dekat pada teks Yunani.
  naturalness: “Pada dahinya tertulis suatu nama” alami dan jelas dalam bahasa Indonesia modern. “Babel yang Besar” lebih wajar sebagai gelar aposisional daripada “Babel Besar,” sambil tetap mempertahankan gaya apokaliptik.
  terminology: “Rahasia,” “pelacur,” dan “kekejian” merupakan padanan yang baik untuk μυστήριον, πορνῶν, dan βδελυγμάτων. “Babel yang Besar” mempertahankan nama tradisional dan gelar Yunani tanpa menambah penafsiran.
  issues:
