id: REV.17.5
reference: Revelation 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: id
  text: 'Pada dahinya tertulis suatu nama: “Rahasia[a], Babel yang Besar, ibu para pelacur dan kekejian di bumi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “tertulis suatu nama, suatu rahasia: ‘Babel yang Besar, ibu para pelacur dan kekejian di bumi,’” jika “rahasia” dipahami sebagai pengantar kepada makna simbolis nama itu, bukan sebagai bagian dari tulisan tersebut.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: pada dahinya
  rationale: Ungkapan lokatif yang alami dalam bahasa Indonesia dan tetap mempertahankan gambaran tulisan yang tertera pada dahi perempuan itu.
- source_word: ὄνομα γεγραμμένον
  choice: tertulis suatu nama
  rationale: Bentuk ini menyampaikan keadaan hasil dari partisip pasif γεγραμμένον secara ringkas dan alami; “suatu nama” mempertahankan ketakrifan yang tidak ditentukan dalam bahasa Yunani.
- source_word: μυστήριον
  choice: Rahasia
  rationale: Dalam konteks ini diperlakukan sebagai bagian dari nama atau tulisan pada dahinya. “Rahasia” menyampaikan sesuatu yang tersembunyi dan kemudian disingkapkan dalam konteks apokaliptik, tanpa memakai kata serapan yang berpotensi lebih kabur bagi pembaca umum.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babel Besar
  rationale: “Babel” mempertahankan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia serta kaitannya dengan Babel dalam Perjanjian Lama; ἡ μεγάλη diterjemahkan sebagai gelar “Besar” secara alami.
- source_word: ἡ μήτηρ
  choice: ibu
  rationale: Berfungsi sebagai aposisi atau gelar lanjutan. Bahasa Indonesia tidak memerlukan artikel tersendiri untuk menyampaikan fungsi ini.
- source_word: τῶν πορνῶν
  choice: para pelacur
  rationale: πόρνη secara langsung menunjuk kepada pelacur. “Para pelacur” jelas, modern, dan mempertahankan citra seksual serta moral teks tanpa memperluas maknanya menjadi semua orang yang melakukan percabulan.
- source_word: τῶν βδελυγμάτων
  choice: segala kekejian
  rationale: “Kekejian” mempertahankan register alkitabiah dan daya moral-religius βδέλυγμα; “segala” menghasilkan ungkapan Indonesia yang wajar bagi bentuk jamak generik tersebut.
- source_word: τῆς γῆς
  choice: di bumi
  rationale: Dalam cakrawala global-apokaliptik kitab Wahyu, γῆ paling tepat dipahami sebagai “bumi”. Ungkapan “di bumi” lebih alami daripada rangkaian genitif “bumi” dan dapat menerangkan baik para pelacur maupun segala kekejian.
theological_decisions:
- issue: Apakah μυστήριον merupakan bagian dari tulisan nama atau label narator yang memperkenalkan makna simbolis nama itu
  choice: 'Dimasukkan sebagai bagian dari tulisan: “Rahasia, Babel Besar ...”'
  alternative: 'Dipahami sebagai keterangan bahwa nama berikut merupakan suatu rahasia: “tertulis suatu nama, suatu rahasia: Babel Besar ...”'
  rationale: Teks Yunani tanpa tanda baca memungkinkan kedua susunan. Urutannya secara wajar mendukung μυστήριον sebagai bagian dari tulisan, tetapi alternatif yang memperkenalkan arti simbolis nama itu tetap sungguh mungkin dan karena itu dicatat dalam catatan kaki.
- issue: Cakupan τῆς γῆς terhadap dua kelompok genitif
  choice: Diterjemahkan dengan susunan yang memungkinkan “di bumi” berkaitan dengan para pelacur dan segala kekejian
  alternative: Membatasi “di bumi” hanya pada “segala kekejian”
  rationale: Struktur gelar dalam bahasa Yunani memungkinkan frasa penutup memberi cakupan pada keseluruhan pasangan, dan terjemahan tidak seharusnya mempersempit cakupannya tanpa kepastian.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan register apokaliptik-al-kitabiah dipertahankan melalui “Rahasia” dan “kekejian”. Tanda kutip menandai keseluruhan isi tulisan pada dahi; kapitalisasi menunjukkan unsur-unsur gelar atau nama. Penanda catatan kaki [a] dicantumkan tepat setelah kata yang dipersoalkan.
