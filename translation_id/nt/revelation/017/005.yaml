    issue: “Segala kekejian” menambahkan makna universal.
    rationale: τῶν βδελυγμάτων adalah bentuk jamak bergenetif, “kekejian-kekejian/hal-hal keji,” bukan “semua kekejian.” Kata “segala” dapat menyatakan totalitas yang tidak eksplisit dalam sumber.
  - severity: low
