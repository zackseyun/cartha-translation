  naturalness: Susunan kalimat, penggunaan “kaulihat,” dan kata ganti pelanjut “mereka” baku serta alami dalam bahasa Indonesia modern. “Menjadikannya menjadi tandus” adalah ungkapan yang lebih tepat dalam register Alkitab untuk citra penghakiman ini dan tetap dapat diterapkan pada figur perempuan simbolis.
  terminology: “Tanduk,” “binatang,” “pelacur,” “telanjang,” dan “daging” konsisten dengan lambang apokaliptik tanpa memasukkan identifikasi penafsiran. Catatan kaki mempertahankan perbedaan antara arti leksikal “telanjang” dan implikasi penelanjangan di muka umum.
