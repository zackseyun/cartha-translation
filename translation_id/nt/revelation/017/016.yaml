id: REV.17.16
reference: Revelation 17:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: id
  text: Dan kesepuluh tanduk yang kaulihat serta binatang itu—mereka akan membenci pelacur itu. Mereka akan menjadikannya menjadi tandus dan telanjang[a], memakan dagingnya[b], dan membakarnya habis dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditelanjangi.” Kata Yunani secara harfiah berarti “telanjang” dan dalam konteks ini menyiratkan penyingkapan serta penghinaan di depan umum.
    reason: lexical_alternative
  - marker: b
    text: “Daging” diterjemahkan secara harfiah; dalam gambaran apokaliptik kitab Wahyu, ungkapan ini melukiskan penghancuran total dengan kekerasan.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: tanduk
  rationale: Mempertahankan lambang apokaliptik yang dipakai teks, bukan langsung menggantinya dengan tafsirnya, yaitu raja atau kuasa.
- source_word: θηρίον
  choice: binatang
  rationale: Padanan baku dan wajar dalam bahasa Indonesia untuk sosok simbolis θηρίον dalam kitab Wahyu; konteks mempertahankan daya ancamnya.
- source_word: πόρνην
  choice: pelacur
  rationale: Padanan modern yang jelas dan tidak arkais, sambil mempertahankan metafora yang digunakan teks.
- source_word: μισήσουσι
  choice: akan membenci
  rationale: Menerjemahkan bentuk futurum dan arti langsung μισέω tanpa memperlunak urutan tindakan kekerasan berikutnya.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: akan menjadikannya telantar
  rationale: Menjaga daya resultatif konstruksi, yakni membuat dia berada dalam keadaan ditinggalkan dan hancur, dengan ungkapan Indonesia yang dapat diterapkan pada sosok perempuan simbolis.
- source_word: γυμνήν
  choice: telanjang
  rationale: Padanan langsung bagi γυμνός; nuansa ditelanjangi, dipermalukan, dan disingkapkan dijelaskan dalam catatan kaki tanpa dimasukkan secara pasti ke teks utama.
- source_word: σάρκας
  choice: daging
  rationale: Menerjemahkan bentuk jamak idiomatis Yunani dengan nomina massal Indonesia, sambil mempertahankan gambaran jasmani yang keras.
- source_word: φάγονται
  choice: memakan
  rationale: Padanan langsung bagi ἐσθίω dan mempertahankan gambaran mengerikan dalam penglihatan apokaliptik.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: membakarnya habis dengan api
  rationale: Kata 'habis' menyampaikan daya intensif κατακαίω, sedangkan 'dengan api' merupakan ungkapan Indonesia yang alami untuk ἐν πυρί.
- source_word: οὗτοι
  choice: mereka
  rationale: Kata ganti jamak sesudah tanda pisah melanjutkan subjek gabungan 'kesepuluh tanduk ... serta binatang itu' secara jelas dan alami.
theological_decisions:
- issue: Acuan dan kesesuaian jumlah pada 'kesepuluh tanduk ... serta binatang itu' dengan verba jamak
  choice: 'Mempertahankan subjek gabungan yang dilanjutkan oleh kata ganti jamak sesudah tanda pisah: ''kesepuluh tanduk ... serta binatang itu—mereka akan ...'''
  alternative: Melancarkan susunan tanpa kata ganti pelanjut, atau menganggap binatang itu sebagai aposisi bagi tanduk-tanduk tersebut.
  rationale: Bahasa Yunani memakai οὗτοι maskulin jamak untuk melanjutkan gabungan citra tanduk-tanduk dan binatang dengan verba jamak. Susunan terjemahan mempertahankan para pelaku sebagai sekutu yang bertindak bersama tanpa memaksakan hubungan penafsiran lain.
- issue: Sifat gambaran penghancuran pelacur
  choice: Mempertahankan metafora apokaliptik dalam teks utama tanpa langsung menafsirkannya sebagai kota, kerajaan, atau sistem tertentu.
  alternative: Mengganti pelacur dengan referen simbolis yang diperkirakan atau memperhalus gambaran kekerasannya.
  rationale: Ayat itu sendiri menyajikan penghakiman melalui lambang pelacur, penelanjangan, pemakanan daging, dan pembakaran. Terjemahan perlu menjaga ketegangan serta gambaran tersebut dan tidak menyelesaikan simbolnya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Struktur tanda pisah mempertahankan kata ganti pelanjut Yunani tanpa membuat kalimat kaku. 'Telantar' dipilih agar keadaan kehancuran dapat secara alami dikenakan pada sosok perempuan simbolis, sedangkan 'membakarnya habis' mempertahankan intensitas verba Yunani.
