id: REV.8.12
reference: Revelation 8:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: id
  text: Lalu malaikat keempat meniup sangkakala. Sepertiga dari matahari, sepertiga dari bulan, dan sepertiga dari bintang-bintang terpukul, sehingga sepertiga bagian dari benda-benda itu menjadi gelap, dan siang tidak bercahaya selama sepertiga bagiannya, demikian juga malam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya siang tidak bercahaya selama sepertiga bagiannya, demikian juga malam.” Konstruksi Yunani dapat mengandung nuansa tujuan yang lebih kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: meniup sangkakalanya
  rationale: Verba ini berarti membunyikan sangkakala. Dalam bahasa Indonesia, 'meniup sangkakala' merupakan ungkapan alami; akhiran '-nya' mengacu pada sangkakala yang terkait dengan malaikat tersebut dalam rangkaian penglihatan.
- source_word: ἐπλήγη
  choice: terpukul
  rationale: Bentuk pasif πλήσσω dipertahankan dan menyampaikan gambaran bahwa benda-benda langit terkena pukulan penghukuman, tanpa menjelaskan hakikat peristiwanya.
- source_word: τὸ τρίτον
  choice: sepertiga
  rationale: Padanan kuantitatif yang tepat dan alami, dengan pengulangan yang mempertahankan penekanan teks Yunani.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: matahari ... bulan ... bintang-bintang
  rationale: Padanan langsung bagi istilah benda-benda langit tersebut.
- source_word: ἵνα
  choice: sehingga ... Akibatnya
  rationale: Konstruksi ini dalam konteks menyatakan akibat, tetapi dapat pula mengandung nuansa tujuan; teks utama memakai bahasa akibat yang alami, sementara catatan kaki mempertahankan kemungkinan nuansa tujuan.
- source_word: σκοτισθῇ
  choice: menjadi gelap
  rationale: Menyampaikan bahwa sepertiga benda-benda langit itu mengalami penggelapan; ungkapan ini lebih alami daripada bentuk pasif harfiah 'digelapkan' dalam bahasa Indonesia.
- source_word: αὐτῶν
  choice: dari semuanya
  rationale: Pronomina jamak mengacu secara kolektif kepada matahari, bulan, dan bintang-bintang.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: siang tidak bercahaya
  rationale: Dalam konteks penggelapan kosmis, φαίνω paling wajar dipahami sebagai bercahaya atau memancarkan terang, bukan sekadar tampak.
- source_word: τὸ τρίτον αὐτῆς
  choice: selama sepertiga waktu
  rationale: Menunjukkan bagian durasi siang yang terkena dampak sambil menghindari ungkapan Indonesia yang kaku seperti 'sepertiga darinya'.
- source_word: ἡ νὺξ ὁμοίως
  choice: demikian juga malam
  rationale: Mempertahankan pernyataan ringkas bahwa pembatasan yang sama berlaku pada malam.
theological_decisions:
- issue: Hakikat gambaran penghukuman kosmis
  choice: Menggambarkan penggelapan benda-benda langit secara langsung sebagai bahasa penghukuman apokaliptis tanpa menentukan apakah peristiwa itu harfiah, simbolis, atau keduanya.
  alternative: Menafsirkannya secara khusus sebagai peristiwa astronomis harfiah saja atau sebagai simbol politik-kosmis semata.
  rationale: Ayat ini sendiri tidak menyelesaikan pertanyaan penafsiran tersebut; terjemahan harus mempertahankan gambaran dan ketegangan yang ada.
- issue: Nuansa ἵνα dengan verba subjunktif
  choice: Teks utama mengungkapkannya sebagai akibat; catatan kaki mempertahankan kemungkinan nuansa tujuan.
  alternative: 'Menerjemahkan hanya dengan nuansa tujuan: ''supaya ... tidak bercahaya.'''
  rationale: ἵνα dapat mengandung tujuan atau akibat dalam konteks ini, sehingga ambiguitas yang bermakna tidak boleh dihapuskan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah 'sangkakala' dipertahankan sebagai kosakata Alkitab yang umum dan mudah dikenali. Struktur kalimat dibagi agar rangkaian akibat mudah dipahami, tanpa menafsirkan sifat penglihatan apokaliptis.
