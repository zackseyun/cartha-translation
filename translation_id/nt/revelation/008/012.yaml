revisions:
- from: Lalu malaikat yang keempat meniup sangkakalanya. Sepertiga matahari, sepertiga bulan, dan sepertiga bintang-bintang terpukul, sehingga sepertiga dari semuanya menjadi gelap. Akibatnya, selama sepertiga waktu, siang tidak bercahaya, demikian juga malam.[a]
  to: Lalu malaikat keempat meniup sangkakala. Sepertiga dari matahari, sepertiga dari bulan, dan sepertiga dari bintang-bintang terpukul, sehingga sepertiga bagian dari benda-benda itu menjadi gelap, dan siang tidak bercahaya selama sepertiga bagiannya, demikian juga malam.[a]
  rationale: Revisi memperjelas bahwa ukuran “sepertiga” pada klausa terakhir berkaitan dengan siang, sambil mempertahankan pernyataan ringkas bahwa malam mengalami hal yang sama. Hubungan ἵνα tetap diterjemahkan sebagai akibat melalui “sehingga,” dan catatan kaki mempertahankan kemungkinan nuansa tujuan. Tidak ada penafsiran tambahan mengenai apakah penggelapan itu harfiah atau simbolis.
