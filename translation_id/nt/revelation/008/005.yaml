id: REV.8.5
reference: Revelation 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: id
  text: Lalu malaikat itu mengambil pedupaan, mengisinya dengan api dari mazbah, dan melemparkannya ke bumi. Maka terjadilah bunyi-bunyi guruh, suara-suara[a], kilat-kilat, dan gempa bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi-bunyi.” Kata Yunani yang digunakan dapat berarti suara yang diucapkan ataupun bunyi dalam suasana penampakan ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: mengambil
  rationale: Bentuk perfek berfungsi dalam rangkaian naratif; bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia.
- source_word: λιβανωτόν
  choice: pedupaan
  rationale: Dalam konteks ibadah ini, kata tersebut menunjuk pada wadah untuk membakar dupa dan membawa bara; 'pedupaan' ringkas, baku, dan sesuai dengan tindakan mengisinya dengan api.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: mengisinya dengan api dari mazbah
  rationale: Ungkapan ini menyampaikan secara alami bahwa pedupaan diisi dengan api yang berasal dari mazbah, sekaligus mempertahankan pentingnya asal api itu.
- source_word: θυσιαστηρίου
  choice: mazbah
  rationale: '''Mazbah'' merupakan istilah Indonesia yang mapan untuk altar dalam konteks persembahan dan gambaran ruang ibadah alkitabiah.'
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: melemparkannya ke bumi
  rationale: '''Melemparkan'' mempertahankan daya tindakan βάλλω, sedangkan ''bumi'' sesuai dengan cakupan kosmis adegan penghakiman dalam Wahyu.'
- source_word: ἐγένοντο
  choice: terjadilah
  rationale: Bentuk ini alami dalam narasi Indonesia dan menyampaikan munculnya rangkaian gejala secara mendadak.
- source_word: βρονταὶ
  choice: bunyi-bunyi guruh
  rationale: Bentuk jamak Yunani menunjuk pada kejadian guruh yang berulang; reduplikasi mempertahankan kemajemukannya.
- source_word: φωναὶ
  choice: suara-suara
  rationale: φωνή dapat berarti suara atau bunyi. 'Suara-suara' mempertahankan kemungkinan adanya suara yang bermakna tanpa menyatakan secara pasti bahwa ada penutur.
- source_word: ἀστραπαὶ
  choice: kilat
  rationale: '''Kilat'' adalah padanan Indonesia yang alami; sebagai nomina massal dalam rangkaian ini, bentuk tersebut dapat mencakup kilatan-kilatan tanpa ungkapan yang kaku.'
- source_word: σεισμός
  choice: gempa bumi
  rationale: Padanan Indonesia baku untuk gempa dalam konteks fenomena alam.
theological_decisions:
- issue: Makna γῆ dalam konteks penghakiman apokaliptik
  choice: bumi
  alternative: tanah; daratan
  rationale: Gambaran penghakiman dalam Wahyu berskala kosmis; 'bumi' mempertahankan cakupan itu, sedangkan 'tanah' dapat mempersempitnya menjadi permukaan setempat.
- issue: Makna φωναί dalam rumusan teofanik
  choice: suara-suara
  alternative: bunyi-bunyi
  rationale: Tidak ada penutur yang disebutkan, tetapi φωναί dapat menunjuk pada suara maupun bunyi. Teks utama mempertahankan nuansa 'suara', sedangkan catatan kaki menyajikan kemungkinan nonverbal agar ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tindakan dibuat mengalir secara naratif, sementara urutan gejala dipertahankan. Istilah 'pedupaan' dan 'mazbah' dipakai karena ringkas serta mapan dalam konteks ibadah alkitabiah.
