id: REV.8.8
reference: Revelation 8:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: id
  text: Lalu malaikat kedua meniup sangkakala. Sesuatu seperti gunung besar yang terbakar dengan api dilemparkan ke dalam laut, lalu sepertiga laut itu menjadi darah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: meniup sangkakalanya
  rationale: Verba ini berarti membunyikan atau meniup sangkakala. Dalam rangkaian penglihatan ini, bentuk dengan objek tersirat dibuat wajar dalam bahasa Indonesia; akhiran -nya menunjuk pada sangkakala malaikat tersebut.
- source_word: ὡς
  choice: sesuatu seperti
  rationale: ὡς menandai kemiripan, bukan memastikan identitas. Ungkapan ini mempertahankan sifat penglihatan tanpa menentukan apakah benda itu gunung harfiah atau lambang.
- source_word: ὄρος μέγα
  choice: gunung besar
  rationale: Padanan langsung dan alami yang mempertahankan kebesaran citra apokaliptik.
- source_word: πυρὶ καιόμενον
  choice: yang terbakar dengan api
  rationale: Mempertahankan penyebutan api secara eksplisit dan tidak menafsirkan benda itu sebagai gunung berapi, meteor, atau hal tertentu lainnya.
- source_word: ἐβλήθη
  choice: dilemparkan
  rationale: Bentuk pasif aoris menyatakan bahwa benda tersebut dilemparkan; padanan ini alami dan tidak menambahkan intensitas yang tidak dinyatakan.
- source_word: εἰς τὴν θάλασσαν
  choice: ke dalam laut
  rationale: θάλασσα secara langsung berarti laut, sedangkan 'ke dalam' menyampaikan arah gerak εἰς.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: sepertiga laut itu
  rationale: Ungkapan partitif ini paling alami disampaikan sebagai 'sepertiga laut'; 'itu' mengacu kembali kepada laut yang baru disebut.
- source_word: αἷμα
  choice: darah
  rationale: Padanan langsung tanpa perluasan tafsiran; teks menyatakan bahwa bagian laut tersebut menjadi darah.
theological_decisions:
- issue: Hakikat benda yang menyerupai gunung
  choice: Perbandingan dinyatakan sebagai 'sesuatu seperti gunung besar' tanpa mengidentifikasi bendanya.
  alternative: Menyebutnya gunung harfiah, benda seperti meteor, atau lambang penghakiman tertentu.
  rationale: Pemakaian ὡς menyatakan kemiripan. Terjemahan mempertahankan ketegangan antara gambaran harfiah dan simbolis tanpa menyelesaikannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dan citra penglihatan Yunani. Tidak diperlukan catatan kaki karena nuansa kemiripan pada ὡς sudah dinyatakan jelas dalam teks utama dengan 'sesuatu seperti'.
