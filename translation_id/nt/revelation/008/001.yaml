id: REV.8.1
reference: Revelation 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: id
  text: Dan ketika ia membuka meterai ketujuh, terjadilah keheningan di surga selama kira-kira setengah jam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Dalam konteks naratif ini, kata tersebut menunjuk pada satu peristiwa tertentu, bukan kejadian yang berulang; karena itu “ketika” paling alami.
- source_word: ἤνοιξεν
  choice: membuka
  rationale: ἀνοίγω secara langsung berarti “membuka.” Pilihan ini tidak menambahkan gagasan “memecahkan” yang tidak dinyatakan secara eksplisit.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: meterai ketujuh
  rationale: “Meterai” merupakan padanan yang tepat dan lazim dalam konteks gulungan kitab di Wahyu, sedangkan urutan katanya alami dalam bahasa Indonesia.
- source_word: ἐγένετο
  choice: terjadilah
  rationale: Bentuk ini menyampaikan munculnya suatu keadaan sekaligus mempertahankan daya dramatik narasi.
- source_word: σιγὴ
  choice: keheningan
  rationale: “Keheningan” mempertahankan nuansa suasana yang sunyi dan khidmat, lebih kuat daripada sekadar “ketenangan.”
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Dalam konteks ini οὐρανός menunjuk pada ranah surgawi, bukan langit fisik.
- source_word: ὡς ἡμιώριον
  choice: selama kira-kira setengah jam
  rationale: “Kira-kira” menyampaikan sifat perkiraan dari ὡς, sedangkan “selama” membuat fungsi frasa sebagai durasi menjadi alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan subjek tersirat dalam ἤνοιξεν
  choice: ia membuka
  alternative: Anak Domba membuka
  rationale: Teks Yunani hanya memuat verba orang ketiga tunggal dengan subjek tersirat. Kata “ia” memenuhi kebutuhan tata bahasa Indonesia sambil membiarkan konteks sebelumnya menunjukkan bahwa yang dimaksud ialah Anak Domba, tanpa memperjelasnya secara berlebihan di ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kecil pada “ia” dipakai untuk tidak memasukkan konvensi teologis tentang kapitalisasi kata ganti yang tidak ditandai dalam teks Yunani. Konjungsi “Dan” dipertahankan untuk mencerminkan Καὶ dan kesinambungan narasi.
