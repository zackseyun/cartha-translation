  source_fidelity: 'Teks Indonesia secara akurat mengikuti Yunani SBLGNT: Καὶ diterjemahkan “Dan”; ὅταν ἤνοιξεν menjadi “ketika ia membuka”; τὴν σφραγῖδα τὴν ἑβδόμην menjadi “meterai ketujuh”; dan ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον disampaikan dengan tepat sebagai terjadinya keheningan di surga dengan durasi perkiraan setengah jam. Subjek tersirat dipertahankan dengan “ia,” tanpa penambahan identifikasi teologis.'
