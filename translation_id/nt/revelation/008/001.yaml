  terminology: “Meterai,” “surga,” dan “keheningan” merupakan padanan yang tepat, lazim, dan konsisten bagi konteks Wahyu. Penggunaan “ia” dengan huruf kecil tepat karena teks sumber tidak menandai kapitalisasi teologis.
