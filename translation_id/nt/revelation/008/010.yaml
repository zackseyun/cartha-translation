id: REV.8.10
reference: Revelation 8:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: id
  text: Lalu malaikat yang ketiga meniup sangkakalanya, dan sebuah bintang besar jatuh dari langit[a], menyala seperti obor[b]. Bintang itu jatuh menimpa sepertiga dari sungai-sungai dan mata air.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari surga.” Kata Yunani yang digunakan dapat berarti langit atau surga.
    reason: lexical_alternative
  - marker: b
    text: Atau “terbakar seperti pelita.” Kata Yunani λαμπάς dapat merujuk pada obor atau pelita, tetapi “obor” lebih sesuai dengan gambaran benda besar yang menyala dan jatuh.
    reason: lexical_alternative
  - marker: c
    text: “Bintang” dibiarkan sebagai gambaran dalam penglihatan ini. Ayat tersebut tidak menjelaskan apakah bintang itu melambangkan makhluk malaikat, benda menyerupai meteor, atau suatu kuasa simbolis.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: meniup sangkakalanya
  rationale: Kata kerja σαλπίζω berarti membunyikan atau meniup sangkakala. Ungkapan ini alami dalam bahasa Indonesia dan pronomina -nya sesuai dengan subjek tunggal, yaitu malaikat ketiga.
- source_word: ἀστὴρ μέγας
  choice: sebuah bintang besar
  rationale: Terjemahan langsung yang mempertahankan citra sumber tanpa menentukan apakah bintang itu benda langit, makhluk, atau lambang.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari langit
  rationale: Dalam bahasa Indonesia, 'langit' mencakup ruang di atas dan dapat digunakan dalam konteks surgawi; di sini ungkapan itu juga paling alami untuk gerak jatuh sebuah bintang. Kemungkinan nuansa 'surga' dicatat dalam catatan kaki.
- source_word: καιόμενος ὡς λαμπάς
  choice: menyala seperti obor
  rationale: Partisip καιόμενος menggambarkan sesuatu yang terbakar atau menyala, sedangkan λαμπάς lazimnya adalah obor. 'Menyala seperti obor' menghasilkan citra yang jelas dan wajar.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: jatuh ... Bintang itu jatuh
  rationale: Pengulangan verba sumber dipertahankan untuk mencerminkan ritme dan penekanannya; nomina 'Bintang itu' dipakai agar rujukannya jelas dan kalimat Indonesia tidak terasa janggal.
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: menimpa sepertiga dari sungai-sungai
  rationale: τὸ τρίτον menyatakan bagian sebesar satu pertiga. 'Menimpa' secara alami menyampaikan gerak jatuh ke atas sasaran, sedangkan bentuk jamak 'sungai-sungai' mempertahankan cakupan sumber.
- source_word: πηγὰς τῶν ὑδάτων
  choice: mata-mata air
  rationale: πηγή berarti mata air atau sumber air. 'Mata-mata air' adalah bentuk jamak Indonesia yang alami; unsur air sudah terkandung dalam istilah tersebut.
theological_decisions:
- issue: Rujukan bintang yang jatuh
  choice: Tetap diterjemahkan sebagai 'sebuah bintang besar' tanpa penafsiran tambahan.
  alternative: Makhluk malaikat, benda menyerupai meteor, atau penguasa/kekuatan simbolis.
  rationale: Ayat ini sendiri menyebutnya bintang dan tidak menetapkan rujukan simbolisnya. Terjemahan mempertahankan citra serta ketegangan penafsirannya.
- issue: Makna οὐρανός
  choice: Diterjemahkan 'langit' dalam teks utama.
  alternative: '''Surga''.'
  rationale: Konteks gerak sebuah bintang yang jatuh membuat 'langit' paling alami dalam bahasa Indonesia, tetapi istilah Yunani dapat pula menunjuk pada surga; kemungkinan itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Struktur berulang dari bahasa Yunani dipertahankan sejauh tetap alami. 'Sangkakala' dipilih untuk register apokaliptik yang sudah dikenal, sedangkan 'mata-mata air' lebih alami daripada konstruksi harfiah 'sumber-sumber air'.
