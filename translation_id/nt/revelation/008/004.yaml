id: REV.8.4
reference: Revelation 8:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: id
  text: Lalu asap dupa itu naik bersama doa-doa orang-orang kudus dari tangan malaikat itu ke hadapan Allah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membubung” atau “terangkat” untuk “naik”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama doa-doa orang-orang kudus”; susunan Yunani mengaitkan asap dupa dengan doa-doa tanpa secara tegas menyamakan keduanya dalam ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: naik
  rationale: Bentuk aoris dari ἀναβαίνω menggambarkan gerak ke atas. 'Naik' alami dalam bahasa Indonesia dan mempertahankan gambaran konkretnya.
- source_word: ὁ καπνὸς
  choice: asap
  rationale: Makna biasa kata ini adalah asap; gambaran apokaliptisnya tidak menuntut terjemahan yang lebih interpretatif.
- source_word: τῶν θυμιαμάτων
  choice: dupa
  rationale: θυμίαμα lazim menunjuk pada dupa. Nomina massa 'dupa' secara idiomatis mewakili bentuk jamak Yunani dan mempertahankan latar peribadatan.
- source_word: ταῖς προσευχαῖς
  choice: bersama doa-doa
  rationale: Datif ini mengaitkan asap dupa dengan doa-doa. 'Bersama' mempertahankan hubungan tersebut tanpa menentukan bahwa dupa adalah, membawa, atau dipersembahkan demi doa-doa itu.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: ἅγιοι merupakan sebutan bagi umat yang dikuduskan bagi Allah. 'Orang-orang kudus' adalah istilah alkitabiah yang tidak membatasinya pada golongan yang kemudian dikanonisasi.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: dari tangan malaikat itu
  rationale: Terjemahan ini mempertahankan citra konkret dan struktur Yunani dengan bahasa Indonesia yang wajar.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ke hadapan Allah
  rationale: Dalam konstruksi gerak naik, 'ke hadapan Allah' menyampaikan bahwa asap itu sampai atau tampil dalam hadirat Allah, sambil tetap ringkas dan bernuansa peribadatan.
theological_decisions:
- issue: Hubungan antara dupa dan doa-doa
  choice: Asap dupa naik 'bersama doa-doa orang-orang kudus', tanpa menyamakan dupa dengan doa-doa itu.
  alternative: Asap dupa, yaitu doa-doa orang-orang kudus, naik; atau asap itu naik demi doa-doa orang-orang kudus.
  rationale: Susunan Yunani menghubungkan asap dupa dengan doa-doa, tetapi dalam ayat ini tidak secara eksplisit mengidentikkan keduanya. Terjemahan mempertahankan ambiguitas dan ketegangan gambaran itu.
- issue: Rujukan 'orang-orang kudus'
  choice: Memakai 'orang-orang kudus' sebagai sebutan luas bagi umat Allah.
  alternative: umat Allah yang kudus
  rationale: Dalam konteks Wahyu, ἅγιοι menunjuk kepada umat Allah dan tidak semestinya dipersempit menjadi kelompok yang dikanonisasi dalam tradisi tertentu.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. 'Lalu' mengalirkan narasi; 'dupa', 'malaikat', dan 'ke hadapan Allah' mempertahankan suasana penglihatan serta peribadatan. Semua penanda catatan kaki dicantumkan dalam teks utama.
