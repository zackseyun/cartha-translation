  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: id
  text: Dan sepertiga makhluk yang ada di laut—yaitu yang memiliki nyawa—mati[a], dan sepertiga kapal dihancurkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “yang bernyawa” atau “makhluk hidup.” Secara harfiah, bahasa Yunani berbunyi: “yang memiliki nyawa/kehidupan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: mati
  rationale: Bentuk aoris ἀποθνῄσκω secara langsung menyatakan kematian; “mati” merupakan padanan Indonesia yang paling lugas dan alami.
- source_word: τὸ τρίτον
  choice: sepertiga
  rationale: Ungkapan ini menyatakan bagian kuantitatif, dan “sepertiga” adalah bentuk Indonesia yang tepat serta idiomatis.
- source_word: κτισμάτων
  choice: makhluk-makhluk
  rationale: κτίσμα dapat berarti sesuatu yang diciptakan atau makhluk. Dalam konteks ini, keterangan “yang memiliki nyawa” menunjukkan makhluk laut yang hidup, bukan semua benda ciptaan di laut.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: yang ada di laut
  rationale: Frasa ini menunjukkan lokasi makhluk-makhluk tersebut secara jelas dan alami dalam bahasa Indonesia.
- source_word: τὰ ἔχοντα ψυχάς
  choice: yaitu yang memiliki nyawa
  rationale: Ungkapan ini mempertahankan unsur leksikal ψυχή melalui “nyawa” tanpa menyiratkan rumusan teknis tentang hakikat jiwa hewan. “Yaitu” menandai bahwa frasa tersebut menjelaskan makhluk mana yang dimaksud.
- source_word: ψυχάς
  choice: nyawa
  rationale: Dalam konteks makhluk laut, ψυχή menunjuk pada kehidupan bernyawa. “Nyawa” mempertahankan istilah yang konkret dan signifikan, sementara catatan kaki mencatat padanan kontekstual lain.
- source_word: πλοίων
  choice: kapal-kapal
  rationale: πλοῖον berarti kapal atau perahu; “kapal-kapal” paling jelas dalam gambaran bencana laut ini.
- source_word: διεφθάρησαν
  choice: dihancurkan
  rationale: Bentuk pasif διαφθείρω di sini menunjuk pada kebinasaan atau kerusakan akibat bencana, bukan kerusakan moral; “dihancurkan” sesuai dengan konteks.
theological_decisions:
- issue: Penerjemahan ψυχάς untuk makhluk-makhluk laut
  choice: Memakai “memiliki nyawa” dalam teks utama untuk mempertahankan jejak leksikal ψυχή.
  alternative: “bernyawa,” “memiliki hidup,” atau “makhluk hidup”
  rationale: Ayat ini tidak harus dibaca sebagai pernyataan antropologis teknis tentang jiwa hewan. Namun, menerjemahkan ψυχάς dengan “nyawa” menjaga ketegangan dan keberadaan istilah sumber tanpa memaksakan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Struktur aposisi bertanda pisah mempertahankan penjelasan khusus pada frasa Yunani τὰ ἔχοντα ψυχάς. Semua penanda catatan kaki dicantumkan dalam teks utama.
