id: REV.8.2
reference: Revelation 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: id
  text: Lalu aku melihat ketujuh malaikat yang berdiri di hadapan Allah[a], dan kepada mereka diberikan tujuh sangkakala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang sedang berdiri di hadapan Allah” atau “yang telah berdiri di hadapan Allah”; bentuk perfek dalam bahasa Yunani menekankan keadaan mereka yang tetap berdiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: aku melihat
  rationale: Dalam laporan penglihatan naratif, bentuk aoristus dari ὁράω paling wajar diterjemahkan sebagai “aku melihat”; ungkapan ini alami dan tetap mempertahankan daya penglihatan profetis.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: ketujuh malaikat
  rationale: Artikel dan bilangan menunjuk kepada satu kelompok tertentu; “ketujuh malaikat” menyatakan ketakrifan itu secara alami dalam bahasa Indonesia.
- source_word: ἀγγέλους
  choice: malaikat
  rationale: Konteks ruang takhta surgawi dalam Wahyu jelas menunjuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan ini alami, ringkas, dan mempertahankan nuansa ruang sekaligus relasi dari ἐνώπιον.
- source_word: ἑστήκασιν
  choice: berdiri
  rationale: Bentuk perfek ἵστημι menyatakan keadaan berdiri yang berlangsung sebagai hasil dari tindakan sebelumnya. Bentuk “berdiri” paling idiomatis dalam klausa relatif Indonesia, sementara nuansa aspek dijelaskan dalam catatan kaki.
- source_word: ἐδόθησαν αὐτοῖς
  choice: kepada mereka diberikan
  rationale: Susunan pasif mempertahankan pemberi yang tidak disebutkan dan tidak menggeser sudut pandang menjadi aktif seperti “mereka menerima”.
- source_word: σάλπιγγες
  choice: sangkakala
  rationale: “Sangkakala” merupakan istilah Alkitabiah Indonesia yang lazim dan sesuai dengan alat tiup seremonial dalam gambaran apokaliptik serta penghakiman.
theological_decisions:
- issue: Identitas dan kedudukan ketujuh malaikat
  choice: ketujuh malaikat yang berdiri di hadapan Allah
  alternative: ketujuh penghulu malaikat; ketujuh malaikat yang melayani di hadirat Allah
  rationale: Teks Yunani menyebut kelompok malaikat tertentu yang berdiri di hadapan Allah, tetapi tidak memakai ἀρχάγγελοι dan tidak secara eksplisit menentukan pangkat atau fungsi mereka. Terjemahan tidak memasukkan tradisi tentang tujuh penghulu malaikat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Lalu” mengalir alami dalam rangkaian penglihatan; “ketujuh” menandai kelompok tertentu; dan “sangkakala” dipertahankan karena dikenal luas dalam ragam Alkitabiah tanpa terasa usang.
