  source_fidelity: 'Terjemahan secara tepat mencerminkan unsur-unsur utama Yunani: malaikat lain datang dan mengambil posisi di dekat mazbah; ia memegang pedupaan emas; banyak dupa diberikan kepadanya; dan dupa itu dipersembahkan bersama doa semua orang kudus di atas mazbah emas di hadapan takhta. Bentuk pasif “kepadanya diberikan” dipertahankan. “Di dekat mazbah” merupakan padanan idiomatis yang memadai untuk ἐπὶ τοῦ θυσιαστηρίου dalam konteks ini, tanpa menyiratkan bahwa malaikat berdiri di atas mazbah.'
