id: REV.8.3
reference: Revelation 8:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: id
  text: Lalu datanglah seorang malaikat lain dan berdiri di dekat mazbah. Ia memegang sebuah pedupaan emas[a], dan kepadanya diberikan banyak dupa supaya ia mempersembahkannya bersama doa semua orang kudus[b] di atas mazbah emas yang ada di hadapan takhta itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wadah pembakaran dupa dari emas.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “supaya ia memberikannya kepada doa semua orang kudus.” Dalam konteks ini, dupa itu dipersembahkan bersama atau ditambahkan pada doa mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: seorang malaikat lain
  rationale: ἄλλος menunjukkan satu malaikat tambahan dalam rangkaian penglihatan, bukan jenis makhluk yang berbeda.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: berdiri di dekat mazbah
  rationale: Dengan ἐπί + genitif dalam konteks ini, frasa tersebut menunjukkan posisi di sisi atau dekat mazbah, bukan berdiri di atas permukaannya.
- source_word: λιβανωτὸν χρυσοῦν
  choice: sebuah pedupaan emas
  rationale: λιβανωτός menunjuk pada wadah untuk membakar dupa; 'pedupaan' merupakan istilah Indonesia yang ringkas dan sesuai dengan konteks ibadah, sedangkan χρυσοῦν diterjemahkan 'emas'.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: kepadanya diberikan banyak dupa
  rationale: Terjemahan ini mempertahankan bentuk pasif ilahi yang tidak menyebutkan pemberi dan memakai 'dupa' sebagai nomina massa yang alami dalam bahasa Indonesia.
- source_word: ἵνα δώσει
  choice: supaya ia mempersembahkannya
  rationale: Klausa ἵνα menyatakan tujuan. Dalam konteks dupa dan mazbah, δίδωμι secara kontekstual berarti memberikan sebagai persembahan; akhiran '-nya' merujuk pada dupa.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: bersama doa semua orang kudus
  rationale: Datifnya sulit dan secara harfiah dapat berarti 'kepada doa'. Dalam gambaran peribadatan ini, 'bersama' menyampaikan bahwa dupa menyertai doa tanpa menetapkan lebih jauh bagaimana hubungan keduanya.
- source_word: ἅγιοι
  choice: orang kudus
  rationale: Dalam Wahyu, istilah ini menunjuk pada umat Allah yang dikuduskan; 'orang kudus' adalah padanan Indonesia yang mapan dan tidak membatasi kelompok tersebut pada tokoh tertentu.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: di atas mazbah emas
  rationale: ἐπί + akusatif sesudah tindakan mempersembahkan menunjukkan arah atau penempatan ke atas mazbah.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: yang ada di hadapan takhta itu
  rationale: Frasa ini menyatakan letak mazbah emas di depan atau dalam hadirat takhta; 'di hadapan' mempertahankan kedua nuansa tersebut secara wajar.
theological_decisions:
- issue: Hubungan dupa dengan doa semua orang kudus
  choice: Dupa dipersembahkan bersama doa semua orang kudus.
  alternative: Dupa diberikan kepada doa semua orang kudus.
  rationale: Susunan Yunani memakai datif dan secara harfiah berbunyi 'memberikannya kepada doa', tetapi gambaran mazbah dan dupa mendukung pengertian bahwa dupa menyertai atau ditambahkan pada doa. Catatan kaki mempertahankan bentuk harfiahnya agar ketegangan sintaksis tidak disembunyikan dan tidak mengembangkan doktrin perantaraan malaikat melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang khidmat tetapi mudah dipahami. 'Mazbah', 'pedupaan', dan 'orang kudus' dipertahankan sebagai istilah Alkitab yang mapan; struktur kalimat dipecah menjadi dua agar jelas tanpa mengubah urutan adegan.
