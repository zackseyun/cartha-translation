id: REV.8.7
reference: Revelation 8:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: id
  text: Lalu yang pertama meniup sangkakala. Terjadilah hujan es dan api yang bercampur dengan darah[b], lalu semuanya itu dilemparkan ke bumi[a]. Sepertiga bumi hangus terbakar, sepertiga pepohonan hangus terbakar, dan seluruh rumput hijau hangus terbakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daratan”; kata Yunani γῆ dapat berarti “bumi” atau “daratan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “berbaur dengan darah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: yang pertama
  rationale: Mempertahankan bentuk eliptis teks Yunani tanpa menambahkan kata 'malaikat', meskipun rujukannya jelas dari konteks.
- source_word: ἐσάλπισεν
  choice: meniup sangkakala
  rationale: Ungkapan Indonesia yang alami untuk tindakan membunyikan sangkakala; objeknya tersirat dalam verba Yunani dan dinyatakan oleh konteks.
- source_word: ἐγένετο
  choice: terjadilah
  rationale: Menangkap daya peristiwa dari verba tersebut dan sesuai dengan gaya narasi penglihatan apokaliptik.
- source_word: χάλαζα καὶ πῦρ
  choice: hujan es dan api
  rationale: Menerjemahkan kedua unsur penghukuman secara langsung dan mempertahankan gambaran konkretnya.
- source_word: μεμιγμένα ἐν αἵματι
  choice: yang bercampur dengan darah
  rationale: Menyampaikan keadaan hujan es dan api yang bercampur atau berbaur dengan darah tanpa menafsirkan sifat gambaran itu.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: semuanya itu dilemparkan ke bumi
  rationale: Bahasa Indonesia memerlukan rujukan yang jelas; 'semuanya itu' menunjuk secara kolektif kepada fenomena hujan es dan api, sejalan dengan verba pasif tunggal Yunani.
- source_word: τὸ τρίτον τῆς γῆς
  choice: sepertiga bumi
  rationale: Padanan Indonesia yang ringkas dan alami bagi ungkapan partitif Yunani.
- source_word: κατεκάη
  choice: hangus terbakar
  rationale: Mengungkapkan daya intensif κατακαίω, yakni terbakar sampai rusak atau habis, lebih kuat daripada sekadar 'terbakar'.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: sepertiga pepohonan
  rationale: Padanan partitif yang alami; 'pepohonan' menyatakan kumpulan pohon dalam cakupan yang dimaksud.
- source_word: πᾶς χόρτος χλωρός
  choice: seluruh rumput hijau
  rationale: Mempertahankan citra konkret rumput atau tumbuhan rendah yang masih hijau, tanpa memperluasnya menjadi semua vegetasi.
theological_decisions:
- issue: Cakupan γῆ dalam gambaran penghukuman apokaliptik
  choice: bumi
  alternative: daratan atau negeri
  rationale: Konteks rangkaian sangkakala menggambarkan dampak berskala kosmis, sehingga 'bumi' paling sesuai, sementara kemungkinan leksikal 'daratan' tetap dicatat.
- issue: Identitas ὁ πρῶτος
  choice: yang pertama
  alternative: malaikat yang pertama
  rationale: Konteks menunjukkan bahwa yang dimaksud ialah malaikat pertama, tetapi nomina 'malaikat' tidak dinyatakan dalam ayat ini; bentuk eliptis dipertahankan agar tidak menambahkan unsur ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'hangus terbakar' dipertahankan untuk mencerminkan repetisi retoris κατεκάη dalam teks Yunani. Penanda catatan kaki ditempatkan langsung pada frasa yang diterangkannya.
