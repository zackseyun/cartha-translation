  to: Lalu aku melihat dan mendengar seekor rajawali[a] yang terbang di tengah langit[b] dan berseru dengan suara nyaring, “Celaka, celaka, celaka bagi mereka yang tinggal di bumi karena bunyi-bunyi sangkakala yang masih tersisa, yang akan ditiup oleh ketiga malaikat!”
  rationale: Revisi hanya memperbaiki ketepatan makna dan bentuk retoris. Frasa “yang masih tersisa” menerjemahkan λοιπῶν tanpa menggeser acuannya, sedangkan “yang akan ditiup oleh ketiga malaikat” menyampaikan μέλλοντες σαλπίζειν secara eksplisit dan alami. Tiga seruan “Celaka” kini mempertahankan pengulangan formal bahasa Yunani.
