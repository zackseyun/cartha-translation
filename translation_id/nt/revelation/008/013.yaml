id: REV.8.13
reference: Revelation 8:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: id
  text: Lalu aku melihat dan mendengar seekor rajawali[a] yang terbang di tengah langit[b] dan berseru dengan suara nyaring, “Celaka, celaka, celaka bagi mereka yang tinggal di bumi karena bunyi-bunyi sangkakala yang masih tersisa, yang akan ditiup oleh ketiga malaikat!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah memuat “seorang malaikat” sebagai ganti “seekor rajawali.”
    reason: textual_variant
  - marker: b
    text: Atau “di langit tinggi”; istilah Yunani ini menunjuk pada bagian langit yang paling tinggi atau ruang langit terbuka di atas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: rajawali
  rationale: Kata ini biasanya berarti burung rajawali. Konteks penglihatan ini tidak secara khusus menunjuk pada burung pemakan bangkai, sehingga 'rajawali' paling sesuai.
- source_word: μεσουρανήματι
  choice: di tengah langit
  rationale: Istilah ini menunjuk pada bagian langit yang tinggi atau ruang langit terbuka di atas; 'di tengah langit' mempertahankan nuansa kosmis sekaligus tetap mudah dipahami.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Ungkapan idiomatis yang menyampaikan keras dan terbukanya seruan tersebut.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Celaka, celaka, celakalah
  rationale: Pengulangan tiga kali dipertahankan untuk menjaga tekanan retoris dan kenabian. Bentuk terakhir 'celakalah' menghubungkan seruan itu secara alami dengan orang-orang yang menjadi sasarannya.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: mereka yang tinggal di bumi
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan ungkapan berulang dalam kitab Wahyu tentang manusia yang berdiam di bumi.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: karena bunyi-bunyi sangkakala lainnya
  rationale: Dalam konteks ini ἐκ menyatakan sebab. Bentuk jamak φωνῶν diterjemahkan sebagai 'bunyi-bunyi', sedangkan λοιπῶν menunjukkan bunyi sangkakala yang masih tersisa setelah empat sangkakala sebelumnya.
- source_word: τῶν τριῶν ἀγγέλων
  choice: dari ketiga malaikat
  rationale: Dalam konteks apokaliptik ini ἄγγελος secara tepat diterjemahkan 'malaikat'.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: yang akan segera meniup sangkakala mereka
  rationale: Konstruksi μέλλω dengan infinitif menyatakan tindakan yang akan segera terjadi. Objek yang tersirat dibuat eksplisit agar alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Varian teks tentang makhluk yang terbang dan menyampaikan seruan
  choice: seekor rajawali
  alternative: seorang malaikat
  rationale: Teks utama mengikuti SBLGNT, yang memuat ἀετοῦ ('rajawali'). Bacaan 'malaikat' dalam sebagian naskah dicatat dalam catatan kaki tanpa menggantikan bacaan sumber yang dipakai.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat digunakan dengan mempertahankan nada penglihatan apokaliptik. Pengulangan tiga seruan celaka dan ungkapan 'mereka yang tinggal di bumi' dipertahankan karena penting bagi gaya dan pola leksikal kitab Wahyu.
