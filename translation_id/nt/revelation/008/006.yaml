id: REV.8.6
reference: Revelation 8:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: id
  text: Lalu ketujuh malaikat yang memegang ketujuh sangkakala itu bersiap untuk meniupnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “membunyikan sangkakala-sangkakala itu.” Kata kerja Yunani yang digunakan berarti membunyikan sangkakala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: malaikat
  rationale: Dalam konteks penglihatan apokaliptis ini, istilah tersebut menunjuk pada makhluk surgawi, bukan utusan manusia.
- source_word: ἔχοντες
  choice: yang memegang
  rationale: Partisipel ini dibuat menjadi klausa relatif yang alami dalam bahasa Indonesia; 'memegang' sesuai dengan gambaran para malaikat yang masing-masing telah diberi sangkakala.
- source_word: σάλπιγγας
  choice: sangkakala
  rationale: '''Sangkakala'' adalah istilah Indonesia yang mapan untuk terompet dalam konteks biblis dan mempertahankan nuansa apokaliptisnya.'
- source_word: ἡτοίμασαν αὑτοὺς
  choice: bersiap
  rationale: Bentuk refleksif menyatakan bahwa mereka menyiapkan diri. 'Bersiap' menyampaikan makna itu secara ringkas dan alami.
- source_word: ἵνα σαλπίσωσιν
  choice: untuk meniupnya
  rationale: ἵνα menyatakan tujuan, sedangkan verba σαλπίζω berarti membunyikan atau meniup sangkakala. Akhiran '-nya' merujuk pada ketujuh sangkakala.
theological_decisions:
- issue: Rujukan ἄγγελοι dalam konteks apokaliptis
  choice: malaikat surgawi
  alternative: utusan manusia
  rationale: Latar penglihatan surgawi dan tugas memegang ketujuh sangkakala sangat mendukung rujukan kepada malaikat, tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lalu' meneruskan urutan narasi; 'bersiap' lebih alami daripada 'mempersiapkan diri' tanpa menghilangkan unsur refleksif. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskannya.
