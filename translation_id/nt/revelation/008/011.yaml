id: REV.8.11
reference: Revelation 8:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: id
  text: Nama bintang itu disebut Apsintus[a]. Sepertiga dari air itu menjadi apsintus, dan banyak orang mati karena air itu[b], sebab air itu telah dibuat pahit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Apsintus adalah tanaman yang pahit. Istilah Yunani yang sama dipakai untuk nama bintang dan untuk air yang menjadi apsintus; terjemahan lain: “Absintus.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mati dari air itu”; maksudnya, air itu menjadi sumber atau penyebab kematian. Teks tidak secara eksplisit menyebut bahwa mereka meminumnya.
    reason: translation_clarification
lexical_decisions:
- source_word: ὄνομα
  choice: nama
  rationale: Padanan langsung dan alami untuk sebutan bintang itu.
- source_word: ἀστέρος
  choice: bintang
  rationale: Padanan baku yang mempertahankan gambaran apokaliptik.
- source_word: λέγεται
  choice: disebut
  rationale: Mencerminkan bentuk pasif kini dengan ungkapan Indonesia yang wajar.
- source_word: Ἄψινθος / ἄψινθον
  choice: Apsintus / pahit seperti apsintus
  rationale: Nama bintang ditransliterasikan sebagai Apsintus. Pada penyebutan kedua, frasa ini mempertahankan kaitan dengan tanaman apsintus sekaligus menyampaikan akibat kepahitannya secara jelas dan alami.
- source_word: ἐγένετο ... εἰς
  choice: menjadi
  rationale: Menyatakan perubahan atau hasil sebagaimana konstruksi Yunani.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: sepertiga dari segala air
  rationale: Mempertahankan nilai kuantitatif dan cakupan partitif ungkapan Yunani.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: banyak orang
  rationale: Ungkapan Indonesia yang alami dan mencakup manusia secara umum tanpa membatasi jenis kelamin.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: mati karena air itu
  rationale: ἐκ menyatakan sumber atau sebab; terjemahan ini tidak menambahkan tindakan meminum yang tidak dinyatakan secara eksplisit.
- source_word: ὅτι ἐπικράνθησαν
  choice: sebab air itu telah dibuat pahit
  rationale: Subjek tersirat diperjelas sebagai air, anteseden jamak yang paling dekat dan paling sesuai dengan konteks; bentuk pasif tetap dipertahankan.
theological_decisions:
- issue: Rujukan bentuk pasif ἐπικράνθησαν
  choice: Merujuk kepada air yang telah dibuat pahit.
  alternative: Merujuk kepada orang-orang yang menjadi getir atau jatuh sakit.
  rationale: Secara tata bahasa dan konteks, τῶν ὑδάτων merupakan anteseden terdekat dan paling koheren; kematian terjadi karena air menjadi pahit atau beracun.
- issue: Sifat perubahan air menjadi ἄψινθος
  choice: Diterjemahkan sebagai menjadi pahit seperti apsintus, sambil mempertahankan citra tanaman.
  alternative: Menjadi apsintus secara harfiah.
  rationale: Ungkapan ini mengomunikasikan hasil berupa kepahitan yang mematikan tanpa menentukan secara berlebihan mekanisme perubahan dalam penglihatan apokaliptik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tanaman yang kurang dikenal dipertahankan melalui transliterasi dan diterangkan dalam catatan kaki. Pengulangan kata 'air itu' pada klausa terakhir dipakai untuk memperjelas rujukan bentuk pasif Yunani.
