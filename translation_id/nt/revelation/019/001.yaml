id: REV.19.1
reference: Revelation 19:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: id
  text: Sesudah semuanya itu, aku mendengar seperti suara nyaring dari kumpulan besar orang di surga yang berseru, “Haleluya![a] Keselamatan, kemuliaan, dan kuasa adalah milik Allah kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pujilah Yah” atau “Pujilah TUHAN.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah semuanya itu
  rationale: Mempertahankan bentuk jamak penunjuk dan urutan penglihatan, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Bentuk lampau naratif Yunani disampaikan secara alami dengan verba Indonesia tanpa penandaan kala khusus.
- source_word: ὡς
  choice: sesuatu seperti
  rationale: Menjaga nuansa kemiripan atau persepsi, bukan menyamakan bunyi itu secara mutlak dengan suara kumpulan tersebut.
- source_word: φωνὴν μεγάλην
  choice: suara nyaring
  rationale: Dalam konteks bunyi, μεγάλην menyatakan keras atau kuatnya suara; 'nyaring' alami dan jelas.
- source_word: ὄχλου πολλοῦ
  choice: dari kumpulan besar orang
  rationale: Mengungkapkan banyaknya orang yang berhimpun tanpa memakai istilah yang terlalu teknis atau arkais.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Konteksnya menunjuk pada ranah surgawi, bukan langit sebagai ruang atmosfer.
- source_word: λεγόντων
  choice: yang berkata
  rationale: Partisipel jamak merujuk kepada orang-orang dalam kumpulan itu dan memperkenalkan isi seruan mereka.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Bentuk serapan liturgis ini telah dikenal luas dalam bahasa Indonesia dan mempertahankan karakter seruan Ibraninya; artinya dijelaskan dalam catatan kaki.
- source_word: ἡ σωτηρία
  choice: Keselamatan
  rationale: Menyampaikan tindakan dan hasil penyelamatan ilahi dalam bentuk abstrak yang wajar bagi seruan pujian.
- source_word: ἡ δόξα
  choice: kemuliaan
  rationale: Padanan baku dan tepat dalam konteks penghormatan dan pujian kepada Allah.
- source_word: ἡ δύναμις
  choice: kuasa
  rationale: Padanan alami bagi daya atau kekuatan ilahi dalam konteks doksologi.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: adalah milik Allah kita
  rationale: Membuat hubungan genitif berupa kepemilikan atau pengakuan secara eksplisit dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan seruan surgawi Ἁλληλουϊά
  choice: Haleluya
  alternative: Pujilah Yah; Pujilah TUHAN
  rationale: Transliterasi mempertahankan bentuk seruan ibadah yang diwarisi teks Yunani dari bahasa Ibrani tanpa mempersempitnya menjadi satu pengungkapan nama ilahi; maknanya tetap tersedia dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur penglihatan serta nuansa perbandingan pada ὡς dipertahankan, sementara ungkapan kepemilikan dibuat eksplisit agar alami.
