- from: Sesudah semuanya itu, aku mendengar sesuatu seperti suara nyaring dari kumpulan besar orang di surga yang berkata, “Haleluya![a] Keselamatan, kemuliaan, dan kuasa adalah milik Allah kita.”
  to: Sesudah semuanya itu, aku mendengar seperti suara nyaring dari kumpulan besar orang di surga yang berseru, “Haleluya![a] Keselamatan, kemuliaan, dan kuasa adalah milik Allah kita.”
  rationale: Revisi hanya menghapus 'sesuatu' agar bentuk perbandingan ὡς φωνὴν μεγάλην diterjemahkan lebih langsung, dan mengganti 'berkata' dengan 'berseru' demi keluwesan konteks aklamasi. Tidak ada perubahan pada isi teologis, hubungan kepemilikan kepada Allah, atau penanda catatan kaki.
