id: REV.19.8
reference: Revelation 19:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: id
  text: Kepadanya diberikan kain linen halus[a] yang berkilau dan bersih untuk dikenakannya, sebab kain linen halus itu adalah perbuatan-perbuatan benar orang-orang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tindakan-tindakan benar.” Kata Yunani ini dalam konteks lain juga dapat berarti “ketetapan-ketetapan yang benar,” tetapi di sini paling alami menunjuk pada perbuatan benar orang-orang kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: Kepadanya dianugerahkan
  rationale: Mempertahankan bentuk pasif dan tidak menyebutkan pemberi yang tidak dinyatakan dalam bahasa Yunani. 'Dianugerahkan' secara alami menyampaikan bahwa hal itu diberikan sebagai izin atau karunia.
- source_word: ἵνα περιβάληται
  choice: untuk mengenakan
  rationale: Menyampaikan fungsi tujuan ἵνα serta nuansa medial/refleksif περιβάληται secara alami dalam bahasa Indonesia; subjek yang tersirat ialah perempuan itu sendiri.
- source_word: βύσσινον
  choice: kain linen halus
  rationale: βύσσινον menunjuk pada linen bermutu halus; pilihan ini mempertahankan citra bahan pakaian dan pengulangannya dalam ayat.
- source_word: λαμπρὸν
  choice: berkilau
  rationale: Mengungkapkan sifat terang dan bercahaya dari λαμπρός dengan kata Indonesia yang alami bagi kain.
- source_word: καθαρόν
  choice: bersih
  rationale: Mempertahankan gambaran konkret tentang pakaian tanpa terlebih dahulu mengubahnya menjadi pengertian moral abstrak 'murni'.
- source_word: τὰ δικαιώματα
  choice: perbuatan-perbuatan benar
  rationale: Dalam konteks penjelasan simbolis ini, bentuk jamak paling wajar menunjuk pada tindakan benar, walaupun secara leksikal dapat pula berarti ketetapan atau tuntutan yang benar.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Istilah baku Perjanjian Baru dalam bahasa Indonesia bagi umat yang dikhususkan bagi Allah, tanpa menyiratkan kelompok khusus yang dikanonisasi.
theological_decisions:
- issue: Makna δικαιώματα dalam kaitannya dengan pakaian pengantin perempuan
  choice: Kain linen melambangkan perbuatan-perbuatan benar orang-orang kudus.
  alternative: Kain linen melambangkan tuntutan-tuntutan benar bagi orang-orang kudus atau pembenaran mereka.
  rationale: Bentuk jamak dalam konteks ini paling alami mengacu pada tindakan nyata. Terjemahan tetap mempertahankan ketegangan bahwa kain itu dianugerahkan, namun sekaligus diidentikkan dengan perbuatan benar umat kudus.
- issue: Pelaku dalam bentuk pasif ἐδόθη
  choice: 'Pemberi tetap tidak disebutkan: ''Kepadanya dianugerahkan.'''
  alternative: Allah menganugerahkannya kepadanya.
  rationale: Allah sangat mungkin merupakan pelaku yang tersirat, tetapi teks Yunani tidak menyebut-Nya secara eksplisit; terjemahan tidak menambahkan pelaku.
translation_notes:
  register: Bahasa Indonesia standar modern, khidmat tetapi mudah dipahami. Susunan pasif dipertahankan untuk menjaga pelaku yang tidak disebutkan, dan pengulangan 'kain linen halus' mengikuti penjelasan simbolis teks Yunani.
