source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: id
  text: Dan pasukan yang ada di surga sedang mengikuti Dia dengan menunggang kuda-kuda putih. Mereka mengenakan kain linen halus, putih dan bersih.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατεύματα
  choice: pasukan-pasukan
  rationale: Kata benda jamak ini menunjuk pada kesatuan-kesatuan militer yang terorganisasi. “Pasukan-pasukan” alami dalam bahasa Indonesia dan tidak menambahkan identitas yang tidak disebutkan teks.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: yang ada di surga
  rationale: Frasa ini bersifat lokatif dan menerangkan pasukan-pasukan tersebut sebagai berada di surga; terjemahan ini mempertahankan struktur dan tidak mengubahnya menjadi hubungan kepunyaan.
- source_word: ἠκολούθει αὐτῷ
  choice: mengikuti Dia
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam penglihatan. Dalam narasi Indonesia, “mengikuti” menyampaikan tindakan berkelanjutan dengan alami.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: dengan menunggang kuda-kuda putih
  rationale: Frasa ini menggambarkan pasukan sebagai rombongan berkuda. “Dengan menunggang” lebih jelas dan alami daripada terjemahan harfiah “di atas,” sementara warna putih tetap dipertahankan.
- source_word: ἐνδεδυμένοι
  choice: mengenakan
  rationale: Partisip ini menerangkan keadaan mereka yang berpakaian. “Mengenakan” merupakan ungkapan Indonesia modern yang wajar dan bermartabat.
- source_word: βύσσινον
  choice: kain linen halus
  rationale: Kata ini menunjuk pada kain linen bermutu tinggi. “Kain linen halus” mempertahankan jenis bahan sekaligus mutunya dan selaras dengan citra berulang dalam Wahyu.
- source_word: λευκὸν καθαρόν
  choice: putih dan bersih
  rationale: Kedua kata sifat menerangkan kain linen. Terjemahan langsung ini mempertahankan unsur visual dan kebersihan tanpa menafsirkan καθαρόν secara lebih abstrak sebagai “murni.”
theological_decisions:
- issue: Identitas pasukan-pasukan di surga
  choice: Digambarkan sebagai “pasukan-pasukan yang ada di surga” tanpa menentukan apakah mereka malaikat, orang-orang kudus, atau keduanya.
  alternative: “Bala tentara surgawi,” yang dapat lebih mudah dipahami sebagai sebutan identitas tertentu.
  rationale: Teks Yunani menyatakan lokasi dan penampilan mereka, tetapi dalam ayat ini tidak menjelaskan identitas mereka. Terjemahan mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang luhur tetapi tetap mudah dipahami. Pronomina “Dia” dikapitalisasi sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Kalimat Yunani dibagi menjadi dua kalimat agar hubungan partisipnya jelas dan alami tanpa mengubah makna.
