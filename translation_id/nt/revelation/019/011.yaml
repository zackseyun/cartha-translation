  source_fidelity: Revisi diperlukan untuk menerjemahkan ἰδού secara lebih langsung sebagai penanda perhatian penglihatan. “Tampaklah” dapat dibaca sebagai bentuk dari ‘tampak’ dan kurang jelas menyampaikan daya deiktis ‘lihatlah/perhatikan’ dalam teks Yunani. Selebihnya, urutan pokok dan makna—surga dalam keadaan terbuka, kuda putih, sosok yang disebut dengan dua gelar, serta menghakimi dan berperang dalam δικαιοσύνη—terjaga.
  naturalness: “Dan lihatlah, seekor kuda putih” adalah ungkapan yang baku, jelas, dan cukup hidup untuk narasi penglihatan apokaliptik. Susunan kalimat lainnya tetap modern dan wajar.
