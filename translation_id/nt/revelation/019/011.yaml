id: REV.19.11
reference: Revelation 19:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: id
  text: Lalu aku melihat surga terbuka, dan lihatlah, seekor kuda putih. Dia yang duduk di atasnya disebut “Yang Setia dan Yang Benar.” Dengan adil[a] ia menghakimi dan berperang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kebenaran ia menghakimi dan berperang.”
    reason: δικαιοσύνη dapat menunjuk pada keadilan maupun kebenaran; terjemahan alternatif mempertahankan bentuk nominal dan rentang maknanya.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: terbuka
  rationale: Partisipel perfek pasif menggambarkan surga dalam keadaan telah dibuka; “terbuka” menyampaikan keadaan hasil itu secara alami dalam bahasa Indonesia.
- source_word: ἰδοὺ
  choice: tampaklah
  rationale: Mempertahankan daya penarik perhatian dan corak penglihatan apokaliptik tanpa memakai bentuk yang terasa kaku.
- source_word: ἵππος λευκός
  choice: seekor kuda putih
  rationale: Penggolong “seekor” alami untuk hewan dan frasa ini tetap langsung serta jelas.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Dia yang duduk di atasnya
  rationale: Mengikuti konstruksi partisipel Yunani dan tidak menggantinya dengan nomina yang lebih interpretatif seperti “penunggang”.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: disebut “Yang Setia dan Yang Benar”
  rationale: καλούμενος menyatakan penamaan; kedua adjektiva diperlakukan sebagai sebutan bagi sosok tersebut. “Yang” membuat bentuk gelar ini alami dalam bahasa Indonesia.
- source_word: πιστός
  choice: Yang Setia
  rationale: “Setia” mempertahankan makna kesetiaan dan keterandalan serta berpasangan secara alami dengan gelar berikutnya.
- source_word: ἀληθινός
  choice: Yang Benar
  rationale: “Benar” mencakup sifat sejati dan dapat dipercaya dalam pasangan gelar ini tanpa mempersempitnya menjadi sekadar “asli”.
- source_word: ἐν δικαιοσύνῃ
  choice: dengan adil
  rationale: Dalam konteks menghakimi dan berperang, frasa ini menyatakan cara yang sesuai dengan keadilan atau kebenaran. “Dengan adil” adalah ungkapan Indonesia yang alami; alternatif formal “dalam kebenaran” dipertahankan dalam catatan kaki.
- source_word: κρίνει
  choice: ia menghakimi
  rationale: Menerjemahkan verba kini aktif secara langsung tanpa menambahkan keterangan yang tidak terdapat dalam verba itu sendiri.
- source_word: πολεμεῖ
  choice: berperang
  rationale: Padanan verbal yang alami dan mempertahankan daya militer πολεμέω.
theological_decisions:
- issue: Penyajian sebutan bagi sosok di atas kuda
  choice: “Yang Setia dan Yang Benar” diperlakukan sebagai sebutan atau gelar.
  alternative: “yang setia dan benar” sebagai deskripsi biasa.
  rationale: Dalam konteks sastra Wahyu, kata-kata ini berfungsi sebagai penamaan sosok tersebut; tanda petik dan huruf kapital menandai fungsi gelar tanpa menambahkan identifikasi yang tidak dinyatakan dalam ayat.
- issue: Makna δικαιοσύνη dalam penghakiman dan peperangan
  choice: “dengan adil” dalam teks utama.
  alternative: “dalam kebenaran”.
  rationale: Konteks penghakiman dan peperangan menonjolkan keadilan, sedangkan rentang makna yang berkaitan dengan kebenaran tetap dicatat agar ketegangan semantis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur penglihatan apokaliptik dipertahankan melalui “tampaklah”, sementara kalimat dibagi agar mudah dipahami. Pronomina “ia” ditulis dengan huruf kecil karena bahasa sumber tidak memiliki pembedaan grafis untuk pronomina ilahi.
