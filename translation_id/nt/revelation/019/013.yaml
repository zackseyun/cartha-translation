  terminology: “Firman Allah” adalah padanan yang mapan dan tepat bagi ὁ Λόγος τοῦ Θεοῦ sebagai gelar pribadi dalam konteks ini. Kapitalisasi pada “Nama-Nya” dan “Firman Allah” konsisten dengan register Alkitab Indonesia dan fungsi gelar dalam ayat. Catatan kaki secara tepat menyediakan alternatif yang lebih lemah, tanpa menggantikan arti dasar βάπτω.
