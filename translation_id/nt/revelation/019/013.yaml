  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan makna utama Yunani: περιβεβλημένος diterjemahkan secara idiomatis sebagai “Ia mengenakan”; ἱμάτιον sebagai “jubah”; βεβαμμένον αἵματι mempertahankan citra kuat “telah dicelupkan ke dalam darah”; dan κέκληται diterjemahkan tepat sebagai “disebut.” Tidak ada penambahan tentang asal atau pemilik darah.'
