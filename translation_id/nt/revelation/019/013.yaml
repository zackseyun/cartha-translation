reference: Revelation 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: id
  text: Ia mengenakan jubah yang telah dicelupkan ke dalam darah[a], dan nama-Nya disebut “Firman Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berlumuran darah.” Kata kerja Yunani secara lebih harfiah berarti “dicelupkan” atau “diwarnai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: mengenakan
  rationale: Partisipel perfektum menggambarkan keadaan yang sedang berlangsung sebagai hasil dari tindakan sebelumnya. Dalam bahasa Indonesia, “mengenakan” menyampaikan keadaan berpakaian secara alami; daya perfektumnya juga tampak melalui frasa “yang telah dicelupkan” pada jubah itu.
- source_word: ἱμάτιον
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian luar. “Jubah” sesuai dengan suasana penglihatan yang agung tanpa menentukan bentuk pakaian secara berlebihan.
- source_word: βεβαμμένον αἵματι
  choice: yang telah dicelupkan ke dalam darah
  rationale: Bentuk perfektum pasif dari βάπτω pada dasarnya berarti mencelupkan atau membenamkan. Terjemahan ini mempertahankan citra Yunani yang kuat serta keadaan jubah sebagai hasil pencelupan.
- source_word: κέκληται
  choice: disebut
  rationale: Perfektum pasif καλέω di sini menyatakan nama atau gelar yang melekat. “Disebut” merupakan ungkapan Indonesia yang wajar dan tetap mencerminkan bentuk pasif.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: nama-Nya
  rationale: Padanan idiomatis bagi konstruksi posesif Yunani. Huruf kapital pada enklitik -Nya mengikuti konvensi bahasa Indonesia ketika rujukannya adalah tokoh ilahi dalam konteks ini.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: Firman Allah
  rationale: λόγος berfungsi sebagai gelar pribadi bagi sang penunggang, bukan sekadar pesan atau perkataan. “Firman Allah” adalah padanan Indonesia yang alami dan mempertahankan bobot gelarnya.
theological_decisions:
- issue: Gelar kristologis λόγος
  choice: Firman Allah
  alternative: pesan Allah
  rationale: Dalam konteks apokaliptik ini, ὁ Λόγος τοῦ Θεοῦ tampil sebagai nama atau gelar pribadi sang penunggang. “Firman Allah” mempertahankan fungsi gelar itu dan gaung pemakaian Yohanes tanpa menambahkan identifikasi yang tidak dinyatakan langsung dalam ayat.
- issue: Rujukan darah pada jubah
  choice: Tidak menentukan darah siapa
  alternative: Menjelaskannya sebagai darah musuh atau darah Kristus sendiri
  rationale: Teks hanya mengatakan αἵματι, “darah,” tanpa menyebut pemilik atau sumbernya. Terjemahan mempertahankan ketegangan dan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara citra pencelupan dalam darah, bentuk pasif penamaan, dan fungsi “Firman Allah” sebagai gelar tetap dipertahankan.
