  terminology: “Allah Yang Mahakuasa,” “tongkat besi,” dan “menggembalakan” tepat serta sesuai register Alkitab bahasa Indonesia. “Kegeraman” untuk θυμός dan “murka” untuk ὀργή membedakan dua istilah yang bertumpang tindih tanpa meniadakan intensitasnya.
