id: REV.19.15
reference: Revelation 19:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: id
  text: Dari mulut-Nya keluar sebilah pedang tajam supaya dengan pedang itu Ia memukul bangsa-bangsa. Ia sendiri akan menggembalakan mereka dengan tongkat besi[a]. Ia sendiri menginjak kilangan anggur dari anggur kegeraman murka Allah Yang Mahakuasa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memerintah mereka dengan tongkat besi.” Kata Yunani secara harfiah berarti “menggembalakan” dan menggemakan Mazmur 2, sambil tetap mempertahankan metafora penggembalaan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “kilangan dari anggur kegeraman murka Allah Yang Mahakuasa.” Susunan kata bertingkat ini mempertahankan dua istilah Yunani yang saling menguatkan bagi murka ilahi.
    reason: literal_rendering
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: keluar
  rationale: Menyampaikan gambaran kini yang hidup tentang pedang yang keluar dari mulut-Nya; alami dalam bahasa Indonesia.
- source_word: ῥομφαία ὀξεῖα
  choice: sebilah pedang tajam
  rationale: ῥομφαία menunjuk pada pedang besar, tetapi 'pedang' paling jelas dan tidak mempersempit jenis senjatanya; penggolong 'sebilah' alami dalam bahasa Indonesia.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: supaya dengan pedang itu Ia memukul
  rationale: Mempertahankan tujuan ἵνα dan fungsi instrumental ἐν αὐτῇ. 'Memukul' tidak menambahkan gagasan 'merobohkan' yang tidak dinyatakan secara eksplisit oleh πατάσσω.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa
  rationale: Merujuk secara kolektif pada bangsa-bangsa dan tidak membatasinya menjadi orang bukan Yahudi.
- source_word: ποιμανεῖ
  choice: akan menggembalakan
  rationale: Mempertahankan metafora harfiah penggembalaan sekaligus membiarkan konteks kerajaan dan penghakiman memberi nuansa pemerintahan.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: dengan tongkat besi
  rationale: Menerjemahkan ἐν secara instrumental dan mempertahankan citra tongkat yang terbuat dari besi.
- source_word: πατεῖ
  choice: menginjak
  rationale: Mempertahankan kala kini yang hidup serta tindakan menginjak dalam gambaran pemerasan anggur.
- source_word: τὴν ληνὸν
  choice: tempat pemerasan anggur
  rationale: Ungkapan Indonesia yang jelas bagi ληνός dan mempertahankan gambaran pengolahan anggur.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: yang berisi anggur kemurkaan dari murka
  rationale: Mempertahankan dua istilah intensif θυμός dan ὀργή sebagai 'kemurkaan' dan 'murka', sambil memperjelas hubungan genitif bertingkat secara alami tanpa melebur keduanya.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: Allah Yang Mahakuasa
  rationale: Mempertahankan παντοκράτωρ sebagai gelar ilahi yang lazim dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: ποιμανεῖ dalam gema Mazmur 2 dan konteks penghakiman
  choice: akan menggembalakan mereka dengan tongkat besi
  alternative: akan memerintah mereka dengan tongkat besi
  rationale: Kata Yunani itu secara harfiah berarti 'menggembalakan'. Pilihan utama mempertahankan ketegangan antara citra pastoral, kuasa kerajaan, dan penghakiman; arti kontekstual 'memerintah' dicatat sebagai alternatif.
- issue: Ungkapan bertumpuk θυμοῦ τῆς ὀργῆς
  choice: kemurkaan dari murka
  alternative: murka yang menyala-nyala
  rationale: Teks memakai dua kata yang bertumpang tindih untuk mengintensifkan penghakiman. Terjemahan utama mempertahankan keduanya alih-alih meratakannya menjadi satu istilah.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Pengulangan 'Ia sendiri' mempertahankan penekanan αὐτός. Tanda baca membagi rangkaian Yunani yang panjang agar tetap jelas tanpa menghilangkan hubungan antargambar.
