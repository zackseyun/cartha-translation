  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: id
  text: Matanya bagaikan nyala api, dan di atas kepalanya terdapat banyak mahkota kerajaan. Ia mempunyai nama yang tertulis, yang tidak seorang pun ketahui selain dirinya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ φλὸξ πυρός
  choice: Matanya bagaikan nyala api
  rationale: Klausa Yunani berbentuk nominal tanpa verba dan melukiskan mata sang penunggang dengan citra nyala api. “Bagaikan” menghasilkan ungkapan Indonesia yang alami tanpa mengurangi daya gambarnya; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: di atas kepalanya
  rationale: Menyampaikan makna ruang dari ἐπί secara jelas dan alami dalam bahasa Indonesia.
- source_word: διαδήματα πολλά
  choice: banyak mahkota kerajaan
  rationale: διάδημα secara khusus menunjuk pada mahkota atau ikat kepala lambang kedaulatan raja. “Mahkota kerajaan” lebih mudah dipahami daripada istilah teknis “diadem” sekaligus mempertahankan nuansa rajawinya.
- source_word: ἔχων ὄνομα γεγραμμένον
  choice: Ia memiliki nama tertulis
  rationale: Partisip ἔχων diterjemahkan sebagai klausa finit agar alurnya alami, sedangkan “nama tertulis” mempertahankan hasil tindakan yang dinyatakan oleh partisip perfek γεγραμμένον tanpa menambahkan tempat nama itu tertulis.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός
  choice: yang tidak diketahui seorang pun selain dirinya sendiri
  rationale: Menyampaikan pengecualian yang tegas dalam teks Yunani. Bentuk οἶδεν bermakna keadaan mengetahui pada masa kini, dan “dirinya sendiri” mempertahankan penekanan αὐτός.
theological_decisions:
- issue: Siapa yang secara khusus mengetahui nama itu
  choice: Nama itu tidak diketahui siapa pun selain sang penunggang sendiri.
  alternative: Klausa ini dapat dipahami terutama sebagai penekanan pada kemisteriusan atau ketakterpahaman nama tersebut.
  rationale: Teks secara eksplisit mengecualikan sang penunggang dari “seorang pun” yang tidak mengetahuinya. Terjemahan mempertahankan pernyataan itu tanpa menjelaskan lebih jauh hakikat nama atau implikasi kristologisnya.
- issue: Kapitalisasi kata ganti untuk sang penunggang
  choice: 'Menggunakan kata ganti huruf kecil: “matanya,” “kepalanya,” dan “dirinya.”'
  alternative: 'Menggunakan kapitalisasi penghormatan: “mata-Nya,” “kepala-Nya,” dan “diri-Nya.”'
  rationale: Bahasa Yunani sumber tidak menandai keilahian melalui kapitalisasi. Huruf kecil menghindari penambahan penafsiran melalui tipografi, sementara konteks tetap menentukan identitas sang penunggang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum; “mahkota kerajaan” dipilih untuk menjelaskan makna khusus διάδημα tanpa istilah teknis atau catatan kaki.
