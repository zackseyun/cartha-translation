id: REV.19.6
reference: Revelation 19:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: id
  text: Lalu aku mendengar sesuatu seperti suara kumpulan orang yang sangat besar, seperti suara air yang banyak, dan seperti gemuruh guntur yang dahsyat. Mereka berkata, “Haleluya! Sebab Tuhan, Allah Yang Mahakuasa[a], memerintah sebagai Raja[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Tuhan, Allah kita, Yang Mahakuasa.” Teks Yunani yang dipakai di sini berbunyi lebih harfiah, “Tuhan, Allah, Yang Mahakuasa.”
    reason: textual_variant
  - marker: b
    text: Atau “telah memerintah” atau “mulai memerintah.” Bentuk kata kerja Yunani dapat merayakan pernyataan pemerintahan Allah secara menentukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Bentuk aoris indikatif ἀκούω secara langsung menyatakan peristiwa mendengar dalam rangkaian penglihatan Yohanes.
- source_word: ὡς φωνὴν
  choice: sesuatu seperti suara
  rationale: ὡς menandai perbandingan, bukan identitas; ungkapan ini mempertahankan sifat penglihatan dan rangkaian simile dalam teks.
- source_word: ὄχλου πολλοῦ
  choice: kumpulan orang yang sangat besar
  rationale: Mengungkapkan kelompok manusia yang amat banyak dengan bahasa Indonesia modern tanpa kehilangan skala apokaliptiknya.
- source_word: ὑδάτων πολλῶν
  choice: deru air bah
  rationale: φωνή dapat berarti bunyi atau suara; dalam perbandingan dengan banyak air, 'deru' terdengar alami, sedangkan 'air bah' menyampaikan massa air yang besar tanpa menambahkan gagasan khusus seperti air terjun.
- source_word: βροντῶν ἰσχυρῶν
  choice: gemuruh guntur yang dahsyat
  rationale: ἰσχυρός menekankan kekuatan; frasa ini alami, hidup, dan tetap bernada luhur.
- source_word: λεγόντων
  choice: Mereka berkata
  rationale: Partisipel maskulin jamak merujuk paling wajar kepada kumpulan orang yang suaranya disamakan dengan deru air dan guntur.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Memakai bentuk serapan liturgis yang telah mapan dalam bahasa Indonesia.
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan alasan bagi seruan Haleluya dan sesuai dengan nada pujian yang luhur.
- source_word: ἐβασίλευσεν
  choice: memerintah sebagai Raja
  rationale: Menyampaikan makna βασιλεύω secara jelas tanpa memaksakan apakah aorisnya harus dipahami sebagai mulai memerintah, telah memerintah, atau penegasan kemenangan pemerintahan-Nya; alternatif waktunya dijelaskan dalam catatan.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Tuhan, Allah Yang Mahakuasa
  rationale: Mengikuti teks cetak SBLGNT yang tidak memuat ἡμῶν ('kita') dan menyajikan rangkaian gelar ilahi secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa aoris ἐβασίλευσεν dan pemerintahan Allah
  choice: memerintah sebagai Raja
  alternative: telah memerintah sebagai Raja / mulai memerintah sebagai Raja
  rationale: Bentuk utama dibiarkan cukup terbuka agar tidak menyiratkan bahwa kedaulatan Allah baru ada pada saat ini. Catatan mempertahankan kemungkinan bahwa konteks merayakan penampakan pemerintahan-Nya secara menentukan.
- issue: Varian tekstual pada gelar Allah
  choice: Tuhan, Allah Yang Mahakuasa
  alternative: Tuhan, Allah kita, Yang Mahakuasa
  rationale: Teks utama mengikuti SBLGNT yang diberikan, yaitu tanpa ἡμῶν. Varian yang menambahkan 'kita' dicatat demi transparansi tanpa mengutamakannya dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan perbandingan dipertahankan untuk menjaga irama apokaliptik. 'Aku' sesuai dengan narasi orang pertama Wahyu; 'Yang Mahakuasa' dipertahankan sebagai gelar ilahi yang mapan.
