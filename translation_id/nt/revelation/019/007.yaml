  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: id
  text: Marilah kita bersukacita dan bersorak gembira, dan marilah kita memberikan kemuliaan kepada-Nya[b], sebab pernikahan Anak Domba telah tiba, dan pengantin perempuan-Nya[a] telah mempersiapkan dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “istri-Nya.” Kata Yunani γυνή dapat berarti “perempuan,” “istri,” atau, dalam konteks pernikahan, “pengantin perempuan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan kita akan memberikan kemuliaan kepada-Nya.” Bentuk Yunaninya adalah futur, meskipun di sini kemungkinan besar berfungsi sebagai ajakan, sejajar dengan “marilah kita bersukacita” dan “bersorak gembira.”
    reason: alternative_reading
lexical_decisions:
- source_word: χαίρωμεν
  choice: Marilah kita bersukacita
  rationale: Bentuk subjungtif orang pertama jamak berfungsi sebagai ajakan; ungkapan ini menyampaikan daya hortatifnya secara alami dalam bahasa Indonesia.
- source_word: ἀγαλλιῶμεν
  choice: bersorak gembira
  rationale: Pilihan ini mempertahankan nuansa sukacita yang meluap dan membedakannya dari χαίρωμεν tanpa terdengar kaku.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: marilah kita memberikan kemuliaan kepada-Nya
  rationale: Walaupun bentuk Yunaninya adalah indikatif futur, dalam rangkaian liturgis ini kemungkinan besar bermakna ajakan, sejajar dengan dua verba sebelumnya. Bentuk frasa dengan kata benda juga mempertahankan struktur 'memberikan kemuliaan'.
- source_word: ἦλθεν
  choice: telah tiba
  rationale: Aoris ini menyatakan tibanya peristiwa sebagai kenyataan yang sudah terjadi dan kini relevan dalam proklamasi penglihatan.
- source_word: γάμος
  choice: pernikahan
  rationale: γάμος dapat berarti pernikahan, pesta pernikahan, atau perjamuan nikah. 'Pernikahan' cocok dengan konteks persatuan tanpa memasukkan unsur pesta yang belum dinyatakan secara eksplisit dalam ayat ini.
- source_word: ἀρνίου
  choice: Anak Domba
  rationale: Ini adalah gelar kristologis khas Kitab Wahyu dan diterjemahkan dengan padanan Indonesia yang mapan.
- source_word: γυνὴ αὐτοῦ
  choice: pengantin perempuan-Nya
  rationale: Dalam konteks pernikahan yang akan berlangsung, 'pengantin perempuan' merupakan padanan kontekstual yang alami, sementara kemungkinan arti 'istri' tetap dicatat.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: telah mempersiapkan dirinya
  rationale: Terjemahan ini mempertahankan makna refleksif dan aspek persiapan sang pengantin dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Makna γυνὴ αὐτοῦ dalam gambaran pernikahan
  choice: pengantin perempuan-Nya
  alternative: istri-Nya
  rationale: Gambaran eskatologis menekankan kesiapan untuk pernikahan, sehingga 'pengantin perempuan' paling sesuai dengan adegan tersebut. Namun, γυνή juga dapat berarti 'istri', dan ketegangan leksikal itu dipertahankan dalam catatan kaki.
- issue: Daya δώσομεν dalam rangkaian ajakan
  choice: marilah kita memberikan kemuliaan kepada-Nya
  alternative: kita akan memberikan kemuliaan kepada-Nya
  rationale: Meskipun secara morfologis berbentuk futur, verba ini paling mungkin melanjutkan rangkaian ajakan untuk bersukacita dan memuji. Terjemahan utama menjaga kesatuan retoris, sedangkan nilai futur literal dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'marilah kita' memperjelas nada ajakan, sedangkan 'bersukacita dan bersorak gembira' mempertahankan dua tingkat ungkapan sukacita dalam teks Yunani. Kapitalisasi pronomina ilahi mengikuti kebiasaan Alkitab Indonesia.
