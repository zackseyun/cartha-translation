base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: id
  text: Lalu dua puluh empat tua-tua dan empat makhluk hidup itu tersungkur dan menyembah Allah yang duduk di atas takhta itu. Mereka berkata, “Amin! Haleluya![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pujilah TUHAN!” Seruan ibadah dalam bahasa Ibrani; secara lebih harfiah, “Pujilah Yah!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: tersungkur
  rationale: Dalam konteks penyembahan, bentuk aoristus πίπτω menggambarkan gerakan merendahkan diri hingga ke tanah; “tersungkur” menyampaikan tindakan itu secara alami dan khidmat.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: kedua puluh empat tua-tua
  rationale: “Tua-tua” merupakan istilah Alkitab Indonesia yang dikenal luas bagi πρεσβύτεροι dan cocok dengan gambaran ruang takhta dalam Wahyu.
- source_word: τὰ τέσσαρα ζῷα
  choice: keempat makhluk hidup
  rationale: Ungkapan ini mempertahankan arti ζῷα sebagai makhluk bernyawa sekaligus membedakan tokoh-tokoh ruang takhta ini dari binatang biasa.
- source_word: προσεκύνησαν
  choice: menyembah
  rationale: Karena objeknya adalah Allah dan konteksnya liturgis, verba ini jelas menyatakan penyembahan, bukan sekadar penghormatan.
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Allah yang duduk di atas takhta itu
  rationale: Konstruksi ini secara alami menyatakan bahwa Allah adalah Dia yang bertakhta; “takhta itu” mempertahankan artikel Yunani dan merujuk kepada takhta yang sudah dikenal dalam penglihatan.
- source_word: λέγοντες
  choice: Mereka berkata
  rationale: Kalimat baru menghasilkan bahasa Indonesia yang lebih alami sambil tetap menghubungkan seruan berikut dengan tindakan penyembahan mereka.
- source_word: Ἀμήν
  choice: Amin
  rationale: Seruan liturgis ini sudah diserap dan dikenal dalam bahasa Indonesia, sehingga transliterasinya dipertahankan.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Bentuk liturgis yang berasal dari bahasa Ibrani ini sudah lazim dalam bahasa Indonesia; makna harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan Ἁλληλουϊά, seruan liturgis Ibrani yang ditransliterasikan dalam teks Yunani
  choice: Haleluya
  alternative: Pujilah TUHAN!; Pujilah Yah!
  rationale: Transliterasi mempertahankan sifatnya sebagai seruan ibadah yang tetap dan sudah dikenal pembaca Indonesia. Catatan kaki menyajikan makna Ibraninya tanpa memaksakan satu cara merepresentasikan unsur nama ilahi yang terkandung di dalam seruan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dipecah agar alami dalam bahasa Indonesia, sedangkan istilah ruang takhta dan seruan liturgis dipertahankan dalam bentuk yang dikenal luas.
