source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: id
  text: Dan orang-orang lainnya dibunuh[a] dengan pedang milik Dia yang duduk di atas kuda itu, yaitu pedang yang keluar dari mulut-Nya[b]. Dan semua burung makan daging mereka sampai kenyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tewas.”'
    reason: lexical_alternative
  - marker: b
    text: Pedang yang keluar dari mulut-Nya merupakan gambaran apokaliptik; bandingkan Wahyu 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: orang-orang lainnya
  rationale: Menunjuk secara kolektif kepada mereka yang masih tersisa setelah binatang dan nabi palsu ditangani dalam konteks sebelumnya; ungkapan ini alami dalam bahasa Indonesia.
- source_word: ἀπεκτάνθησαν
  choice: dibunuh
  rationale: Mempertahankan bentuk pasif aoristus ἀποκτείνω dengan padanan modern dan langsung.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: dengan pedang
  rationale: ἐν dengan datif menyatakan sarana; 'dengan pedang' merupakan ungkapan instrumental yang alami dalam bahasa Indonesia dan mempertahankan citra konkret.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: milik Dia yang duduk di atas kuda itu
  rationale: Menerjemahkan konstruksi partisipial secara transparan; 'Dia' dipakai untuk tokoh yang telah dikenal dalam konteks, sedangkan 'itu' membuat rujukan kepada kuda tertentu terasa alami.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: yaitu pedang yang keluar dari mulut-Nya
  rationale: Partisip atributif yang menerangkan pedang dibuat eksplisit demi kejernihan sambil mempertahankan gambaran apokaliptiknya.
- source_word: πάντα τὰ ὄρνεα
  choice: semua burung
  rationale: ὄρνεα berarti burung; konteks mengisyaratkan burung pemakan bangkai, tetapi unsur itu tidak ditambahkan ke teks utama.
- source_word: ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν
  choice: makan daging mereka sampai kenyang
  rationale: χορτάζω menyatakan dikenyangkan atau dipuaskan sepenuhnya, dan ἐκ menunjukkan sumber makanan. Ungkapan verbal ini menyampaikan makna secara alami dalam bahasa Indonesia tanpa frasa kaku 'dipenuhi dari daging mereka'.
theological_decisions:
- issue: Hakikat pedang yang keluar dari mulut sang penunggang
  choice: Mempertahankan citra konkret 'pedang yang keluar dari mulut-Nya' tanpa menafsirkannya dalam teks utama.
  alternative: Menjelaskannya sebagai firman atau penghukuman-Nya.
  rationale: Teks menyajikan citra apokaliptik dan tidak secara eksplisit menguraikan lambangnya dalam ayat ini; terjemahan tidak boleh menyelesaikan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Struktur kalimat dipecah menjadi dua agar tidak berat. Kapitalisasi 'Dia' dan '-Nya' menandai rujukan kepada tokoh ilahi dalam konteks tanpa menambahkan gelar yang tidak terdapat dalam ayat.
