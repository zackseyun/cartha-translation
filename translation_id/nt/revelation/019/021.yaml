  - severity: low
    issue: Catatan a memakai “dibinasakan dengan pedang” sebagai alternatif bagi “dibunuh”.
    rationale: “Dibinasakan” lebih luas dan kurang langsung sebagai alternatif leksikal bagi ἀπεκτάνθησαν; catatan Inggris mengarahkan pada alternatif “were slain”. “Tewas” merupakan alternatif Indonesia yang lebih dekat dan idiomatis.
  - severity: low
