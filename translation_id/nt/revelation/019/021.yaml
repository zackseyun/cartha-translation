  source_fidelity: 'Teks utama pada dasarnya setia: bentuk pasif ἀπεκτάνθησαν tercermin dalam “dibunuh”, ἐν menyatakan sarana melalui “dengan pedang”, dan citra pedang yang keluar dari mulut tetap dipertahankan. “Makan daging mereka sampai kenyang” menyampaikan hasil χορτάζω serta sumber makanan ἐκ τῶν σαρκῶν αὐτῶν dengan bahasa Indonesia yang alami, meskipun mengubah konstruksi pasif Yunani menjadi aktif idiomatis.'
  naturalness: Bahasa Indonesia modern dan registernya sesuai. “Lalu” tidak diperlukan untuk καί dan dapat memberi nuansa urutan yang lebih kuat; “Dan” menjaga hubungan aditif sumber dengan lebih netral. Pemecahan menjadi dua kalimat tetap wajar.
  terminology: “Pedang,” “mulut-Nya,” dan “daging” tepat dalam konteks citra apokaliptik. Kapitalisasi “Dia/-Nya” mengikuti konvensi Indonesia dan tidak menafsirkan lambang pedang. Catatan a saat ini tidak memberikan alternatif leksikal yang cukup dekat dengan ἀπεκτάνθησαν; “tewas” lebih sesuai sebagai alternatif bagi “dibunuh”.
