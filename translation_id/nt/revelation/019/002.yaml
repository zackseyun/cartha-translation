id: REV.19.2
reference: Revelation 19:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: id
  text: sebab penghakiman-Nya benar dan adil; sebab Ia telah menghakimi pelacur besar itu, yang merusak bumi dengan percabulannya, dan Ia telah menuntut balas atas darah hamba-hamba-Nya dari tangan perempuan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “darah budak-budak-Nya dari tangannya.” Kata Yunani doulos dapat berarti “hamba” atau “budak” dan menekankan bahwa mereka adalah milik tuannya. Ungkapan “dari tangannya” menunjuk pada tanggung jawab atau perbuatannya.'
    reason: Menjaga kekuatan sosial-semantis δοῦλος serta menjelaskan idiom ἐκ χειρὸς αὐτῆς tanpa menambahkan bahwa darah itu “tertumpah”.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: benar dan adil
  rationale: 'Mempertahankan dua sifat penghakiman Allah: sesuai dengan kebenaran dan lurus secara moral-yudisial.'
- source_word: αἱ κρίσεις αὐτοῦ
  choice: penghakiman-Nya
  rationale: Nomina kolektif bahasa Indonesia terdengar alami dan tetap mencakup keputusan maupun tindakan penghakiman Allah.
- source_word: ἔκρινεν
  choice: telah menghakimi
  rationale: Perfektif bahasa Indonesia menandai tindakan yang sudah terlaksana dalam konteks pujian ini tanpa mempersempit maknanya menjadi hanya 'menghukum'.
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: pelacur besar itu
  rationale: Terjemahan modern dan langsung untuk πόρνη, dengan artikel demonstratif yang alami dalam bahasa Indonesia.
- source_word: ἔφθειρεν
  choice: merusak
  rationale: φθείρω dapat berarti merusak, membinasakan, atau mencemarkan; 'merusak' mempertahankan keluasan itu dan cocok dengan sarana yang disebut sesudahnya.
- source_word: τὴν γῆν
  choice: bumi
  rationale: Sesuai dengan cakupan kosmis kitab Wahyu dan tidak mempersempitnya menjadi suatu negeri tertentu.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: dengan percabulannya
  rationale: '''Percabulan'' mempertahankan ranah seksual sekaligus memungkinkan daya metaforis tentang ketidaksetiaan tanpa menjelaskannya secara berlebihan.'
- source_word: ἐξεδίκησεν
  choice: telah membalaskan
  rationale: Menyatakan pelaksanaan keadilan terhadap pelaku atas darah para korban, bukan sekadar vindikasi abstrak.
- source_word: τὸ αἷμα τῶν δούλων αὐτοῦ
  choice: darah hamba-hamba-Nya
  rationale: '''Hamba'' adalah padanan Indonesia yang wajar bagi δοῦλος dalam hubungan dengan Allah dan tetap menyatakan kepemilikan serta pengabdian, tanpa konotasi rasial-historis khusus yang dibawa kata ''budak'' dalam pemakaian modern.'
- source_word: ἐκ χειρὸς αὐτῆς
  choice: yang tertumpah oleh tangannya
  rationale: Menjelaskan hubungan idiomatis antara darah dan tangan pelaku dalam bahasa Indonesia yang dapat dipahami, sambil mempertahankan citra 'tangan' dan agensi pelacur itu.
theological_decisions:
- issue: Makna πορνεία dalam gambaran tentang pelacur besar
  choice: percabulannya
  alternative: perzinaan rohaninya / penyembahan berhalanya
  rationale: Teks utama mempertahankan citra seksual sumber dan tidak secara sepihak menyelesaikan makna simbolisnya sebagai penyembahan berhala atau ketidaksetiaan rohani.
- issue: Penerjemahan δοῦλοι bagi umat milik Allah
  choice: hamba-hamba-Nya
  alternative: budak-budak-Nya
  rationale: Dalam bahasa Indonesia Alkitabiah-modern, 'hamba' dapat menyatakan orang yang sepenuhnya berada dalam kepunyaan dan pelayanan tuannya dengan register bermartabat. Catatan kaki menjaga arti sosial yang lebih kuat dari δοῦλος.
- issue: Hubungan ἐκ χειρὸς αὐτῆς dengan pembalasan darah
  choice: darah ... yang tertumpah oleh tangannya
  alternative: membalaskan darah ... dari tangannya
  rationale: Ungkapan sumber bersifat idiomatis dan menandai tanggung jawab pelaku. Susunan pilihan membuat maknanya jelas tanpa mengubah pelaku atau objek pembalasan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Pengulangan 'sebab' mengikuti struktur ὅτι ... ὅτι sumber. Kapitalisasi pronomina ilahi mengikuti kebiasaan ejaan religius Indonesia. Metafora pelacur, percabulan, darah, dan tangan dipertahankan.
