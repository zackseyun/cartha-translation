source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: id
  text: Dan untuk kedua kalinya mereka berkata, “Haleluya!” Asapnya naik selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Yunani: “sampai zaman-zaman segala zaman,” suatu ungkapan yang berarti durasi tanpa akhir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: untuk kedua kalinya
  rationale: Akusatif adverbial ini menunjukkan pengulangan sekaligus urutan. Ungkapan ini alami dalam bahasa Indonesia dan lebih jelas mempertahankan makna urutan daripada sekadar “lagi”.
- source_word: εἴρηκαν
  choice: mereka berkata
  rationale: Bentuk perfek dari λέγω diterjemahkan dengan bentuk naratif Indonesia yang wajar. “Berseru” tidak dipilih karena akan menambahkan intensitas yang tidak dinyatakan oleh verba itu sendiri.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Seruan liturgis ini dipertahankan dalam bentuk transliterasi yang sudah dikenal luas dalam bahasa Indonesia, alih-alih dijabarkan menjadi “Pujilah Yah” atau “Pujilah TUHAN”.
- source_word: ὁ καπνὸς αὐτῆς
  choice: asapnya
  rationale: Klitik “-nya” secara alami merujuk kembali kepada Babel yang dalam konteks digambarkan sebagai kota sekaligus perempuan. Bahasa Indonesia tidak menandai gender pada pronomina; pilihan ini tidak memaksakan salah satu sisi gambaran tersebut.
- source_word: ἀναβαίνει
  choice: naik
  rationale: Bentuk kini ini menghadirkan gambaran yang hidup dan berkelanjutan. “Naik” merupakan padanan langsung dan alami tanpa meninggikan ragam bahasa secara berlebihan.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Idiom Yunani ini menyatakan durasi tanpa akhir. “Selama-lamanya” adalah ungkapan Indonesia yang alami dan mapan, sedangkan bentuk harfiahnya dicatat dalam catatan kaki demi transparansi.
theological_decisions:
- issue: Durasi yang dinyatakan oleh εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  alternative: sampai zaman-zaman segala zaman
  rationale: Dalam konteks penghakiman terakhir, idiom Yunani ini secara paling alami menyatakan durasi tanpa akhir. Terjemahan utama mempertahankan daya ungkap itu tanpa melunakkannya, sementara bentuk yang lebih harfiah disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan khidmat. “Haleluya” mempertahankan formula ibadah yang dikenal luas. Tanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
