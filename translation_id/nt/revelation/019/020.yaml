id: REV.19.20
reference: Revelation 19:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: id
  text: Binatang itu ditangkap, dan bersama dengannya ditangkap juga nabi palsu yang telah mengadakan tanda-tanda di hadapannya. Dengan tanda-tanda itu ia menyesatkan orang-orang yang telah menerima tanda binatang itu dan yang menyembah patungnya. Keduanya dilemparkan hidup-hidup ke dalam danau api yang menyala dengan belerang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: ditangkap
  rationale: Bentuk pasif aoris dari πιάζω menyatakan bahwa binatang itu ditangkap atau diringkus; “ditangkap” alami dan tepat dalam bahasa Indonesia modern.
- source_word: τὸ θηρίον
  choice: binatang itu
  rationale: “Binatang” mempertahankan citra apokaliptik θηρίον dan merupakan padanan baku yang mudah dipahami dalam konteks Wahyu.
- source_word: μετ’ αὐτοῦ
  choice: bersama dengannya
  rationale: Frasa ini menyatakan penyertaan. Pronomina “-nya” dalam bahasa Indonesia tidak menandai gender sehingga mempertahankan ketidakspesifikan bentuk Yunani tanpa memaksakan personalisasi.
- source_word: ὁ ψευδοπροφήτης
  choice: nabi palsu
  rationale: Padanan langsung dan lazim bagi kata majemuk ψευδοπροφήτης.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: yang telah mengadakan tanda-tanda
  rationale: Partisip aoris menyebut tindakan yang mendahului penangkapan; “telah” memperjelas hubungan waktunya, sedangkan “tanda-tanda” mempertahankan nilai semantis σημεῖα.
- source_word: ἐνώπιον αὐτοῦ
  choice: di hadapannya
  rationale: Padanan alami bagi makna “di depan” atau “di hadapan” pihak yang menjadi rujukan, yaitu binatang itu.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: Dengan tanda-tanda itu ia menyesatkan
  rationale: ἐν οἷς berfungsi instrumental, dan πλανάω mencakup tindakan memperdaya hingga membawa orang menyimpang; “menyesatkan” mempertahankan kedua nuansa itu.
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: orang-orang yang telah menerima tanda
  rationale: Partisip aoris menunjukkan bahwa mereka sudah menerima χάραγμα; “tanda” adalah padanan mapan bagi cap atau tanda pengenal binatang.
- source_word: τοὺς προσκυνοῦντας
  choice: yang menyembah
  rationale: Dalam konteks kultis kitab Wahyu, προσκυνέω berarti menyembah, bukan sekadar membungkuk.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Keduanya dilemparkan hidup-hidup
  rationale: Susunan ini mempertahankan penekanan bahwa kedua tokoh tersebut masih hidup ketika dilemparkan.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: lautan api yang menyala dengan belerang
  rationale: Terjemahan konkret ini mempertahankan gambaran penghakiman apokaliptik. “Belerang” adalah padanan modern bagi θεῖον.
theological_decisions:
- issue: Rujukan pronomina kepada binatang
  choice: Gunakan bentuk pronominal netral gender “-nya”
  alternative: Memakai bentuk yang secara eksplisit mempersonalisasi binatang
  rationale: Bahasa Indonesia tidak mengharuskan pembedaan it/him. Bentuk “-nya” mengikuti rujukan Yunani tanpa menentukan lebih jauh apakah figur itu harus dipahami impersonal atau personal.
- issue: Gambaran penghakiman terakhir
  choice: Pertahankan secara harfiah gambaran “lautan api yang menyala dengan belerang”
  alternative: Memparafrasekannya sebagai neraka atau siksaan kekal
  rationale: Ayat ini menyajikan citra apokaliptik konkret; terjemahan tidak seharusnya menggantikannya dengan rumusan doktrinal yang tidak dinyatakan secara eksplisit di sini.
- issue: Cakupan verba pasif pada penangkapan
  choice: Ulangi “ditangkap juga” untuk nabi palsu
  alternative: Membiarkan “bersama dengannya nabi palsu” tanpa pengulangan verba
  rationale: Pengulangan membuat koordinasi Yunani jelas dan alami dalam bahasa Indonesia tanpa mengubah bahwa satu peristiwa penangkapan mencakup keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dipecah menjadi tiga kalimat agar mudah dipahami, sementara hubungan logis dan urutan tindakan dalam teks Yunani tetap dipertahankan. Tidak diperlukan catatan kaki karena pronomina Indonesia tidak menimbulkan persoalan gender seperti bahasa Inggris, dan “belerang” merupakan padanan langsung yang umum.
