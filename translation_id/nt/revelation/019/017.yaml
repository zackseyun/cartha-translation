id: REV.19.17
reference: Revelation 19:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: id
  text: Lalu aku melihat satu malaikat berdiri di dalam matahari. Ia berseru dengan suara lantang kepada semua burung yang terbang di tengah langit[a], katanya, “Mari, berkumpullah untuk perjamuan besar Allah,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di angkasa tinggi” atau “di tengah angkasa.” Kata Yunani μεσουράνημα adalah ungkapan apokaliptik khas yang dipakai dalam kitab Wahyu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: satu malaikat
  rationale: Mempertahankan angka ἕνα yang dinyatakan secara eksplisit serta kekhususan penglihatan, meskipun 'seorang malaikat' lebih lazim dalam bahasa Indonesia.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: berdiri di dalam matahari
  rationale: Mempertahankan citra apokaliptik yang mencolok dan arti langsung ἐν, tanpa melunakkannya menjadi 'di depan matahari'.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: berseru dengan suara lantang
  rationale: Mengungkapkan kekuatan κράζω dan frasa φωνῇ μεγάλῃ secara alami, tegas, dan bermartabat dalam bahasa Indonesia.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: kepada semua burung
  rationale: ὄρνεον berarti burung secara umum; gagasan burung pemakan bangkai berasal dari konteks berikutnya dan tidak dimasukkan ke dalam nomina ini.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: yang terbang di tengah langit
  rationale: Menyampaikan μεσουράνημα sebagai bagian tengah atau puncak bentangan langit dengan ungkapan Indonesia yang alami, sambil mencatat alternatif leksikal dalam catatan kaki.
- source_word: Δεῦτε
  choice: Mari
  rationale: Menghadirkan seruan langsung yang mengundang sekaligus memanggil burung-burung untuk datang.
- source_word: συνάχθητε
  choice: berkumpullah
  rationale: Bentuk imperatif diterjemahkan secara idiomatis dan tetap mempertahankan kekuatan perintah.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: untuk perjamuan besar Allah
  rationale: δεῖπνον diterjemahkan 'perjamuan' agar cocok dengan konteks perjamuan besar dan mempertahankan kaitan leksikal dengan gambaran perjamuan dalam konteks dekat; susunan genitif τοῦ θεοῦ tetap eksplisit sebagai 'Allah'.
theological_decisions:
- issue: Penggambaran ruang dalam bahasa apokaliptik
  choice: berdiri di dalam matahari
  alternative: berdiri di depan matahari
  rationale: Teks menyajikan citra apokaliptik yang sengaja mencolok. Terjemahan mempertahankan ungkapan Yunani tanpa menyelesaikan atau melunakkan gambaran itu secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan angka 'satu', citra 'di dalam matahari', kekuatan seruan, atau istilah apokaliptik μεσουράνημα. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
source_grounding:
  english_pob_role: consult_only
