  to: 'Lalu ia berkata kepadaku, “Tuliskanlah: Berbahagialah mereka yang telah diundang ke perjamuan pernikahan Anak Domba.[a]” Lalu ia berkata kepadaku, “Perkataan-perkataan ini benar; semuanya adalah perkataan Allah.[b]”'
