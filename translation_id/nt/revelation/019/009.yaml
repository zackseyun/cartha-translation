id: REV.19.9
reference: Revelation 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: id
  text: 'Lalu ia berkata kepadaku, “Tuliskanlah: Berbahagialah mereka yang telah diundang ke perjamuan pernikahan Anak Domba.[a]” Lalu ia berkata kepadaku, “Perkataan-perkataan ini benar; semuanya adalah perkataan Allah.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka yang telah dipanggil ke perjamuan pernikahan Anak Domba.”
    reason: lexical_alternative
  - marker: b
    text: Kata “benar” juga dapat berarti “dapat dipercaya”; ungkapan ini menegaskan bahwa perkataan-perkataan tersebut benar dan dapat diandalkan sebagai perkataan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: Tuliskanlah
  rationale: Imperatif aoristus tunggal ini diterjemahkan sebagai perintah langsung dan wajar dalam bahasa Indonesia; bentuk -lah mempertahankan nada khidmat tanpa menambah objek yang tidak tersurat.
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku untuk ucapan bahagia dalam Perjanjian Baru; menyatakan keadaan yang diperkenan dan diberkati, bukan sekadar perasaan senang.
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: mereka yang telah diundang ke perjamuan
  rationale: Partisipel perfekt pasif menyatakan orang-orang yang telah menerima undangan dan tetap berada dalam kedudukan itu. Dalam konteks perjamuan, 'diundang' menyampaikan makna idiomatis καλέω tanpa memasukkan pengertian doktrinal tertentu tentang panggilan.
- source_word: δεῖπνον
  choice: perjamuan
  rationale: Kata ini menunjuk pada jamuan utama dan dalam konteks pernikahan paling alami diterjemahkan 'perjamuan', yang juga mempertahankan suasana perayaan.
- source_word: γάμου
  choice: pernikahan
  rationale: Karena γάμος menerangkan perjamuan, 'pernikahan' secara alami menyampaikan konteks pesta perkawinan tanpa mengubahnya menjadi sekadar status perkawinan.
- source_word: τοῦ ἀρνίου
  choice: Anak Domba
  rationale: Gelar kristologis utama dalam Wahyu dipertahankan dengan kapitalisasi yang lazim untuk menunjuk kepada Kristus.
- source_word: Οὗτοι οἱ λόγοι
  choice: Inilah firman-firman
  rationale: Demonstratif jamak menunjuk pada perkataan yang baru disampaikan. 'Inilah' alami dalam bahasa Indonesia, sedangkan 'firman-firman' mempertahankan bentuk jamak λόγοι dan kaitannya dengan Allah.
- source_word: ἀληθινοὶ
  choice: benar
  rationale: Terjemahan langsung yang mencakup kebenaran dan keandalan perkataan tersebut; nuansa 'dapat dipercaya' dicatat dalam catatan kaki.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif diterjemahkan secara alami sebagai konstruksi kepunyaan 'firman-firman Allah', tanpa mempersempitnya hanya menjadi penunjuk sumber.
theological_decisions:
- issue: Makna κεκλημένοι dalam konteks perjamuan keselamatan akhir zaman
  choice: telah diundang
  alternative: telah dipanggil
  rationale: Dalam konteks menghadiri perjamuan, 'diundang' adalah padanan idiomatis yang jelas. Alternatif yang lebih harfiah, 'dipanggil', dipertahankan dalam catatan agar kemungkinan gema teologis καλέω tidak dihapus.
- issue: Hubungan λόγοι ἀληθινοὶ τοῦ θεοῦ
  choice: firman-firman Allah yang benar
  alternative: firman-firman Allah yang dapat dipercaya
  rationale: Konstruksi ini dibiarkan menyatakan bahwa firman itu benar dan merupakan milik atau firman Allah, tanpa secara diam-diam mengubah genitif menjadi 'berasal dari Allah'. Nuansa keandalannya dicatat sebagai alternatif.
- issue: Citra δεῖπνον τοῦ γάμου
  choice: perjamuan pernikahan
  alternative: perjamuan kawin
  rationale: '''Perjamuan pernikahan'' merupakan ungkapan Indonesia modern yang bermartabat dan jelas, sekaligus mempertahankan citra perayaan perkawinan Anak Domba.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'ia berkata ... kepadaku' dipertahankan karena terdapat dua kali dalam teks Yunani. Istilah 'Anak Domba' dipertahankan sebagai gelar simbolis utama dalam kitab Wahyu.
