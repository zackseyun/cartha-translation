id: REV.19.10
reference: Revelation 19:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: id
  text: Lalu aku tersungkur di depan kakinya untuk menyembah dia. Namun, ia berkata kepadaku, “Jangan lakukan itu! Aku adalah sesama hamba denganmu dan dengan saudara-saudaramu[b] yang memiliki kesaksian Yesus.[a] Sembahlah Allah! Sebab, kesaksian Yesus adalah roh nubuat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “kesaksian Yesus” dapat berarti “kesaksian tentang Yesus” atau “kesaksian yang berasal dari Yesus”. Ambiguitas yang sama berlaku pada ungkapan terakhir dalam ayat ini.
    reason: alternative_reading
  - marker: b
    text: Kata “saudara-saudara” di sini dapat mencakup saudara seiman laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: aku tersungkur di depan kakinya
  rationale: Ungkapan ini mempertahankan postur fisik dan arti ἔμπροσθεν, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: untuk menyembah dia / Sembahlah Allah
  rationale: Dalam konteks ini tindakan tersebut ditolak oleh malaikat dan diarahkan kepada Allah, sehingga 'menyembah' paling tepat menyampaikan daya religius προσκυνέω.
- source_word: Ὅρα μή
  choice: Jangan lakukan itu!
  rationale: Ungkapan Yunani merupakan larangan singkat dan mendadak; terjemahan ini mempertahankan ketegasan itu secara alami dalam bahasa Indonesia.
- source_word: σύνδουλός
  choice: sesama hamba
  rationale: '''Sesama hamba'' menyampaikan status bersama di bawah satu tuan dan lebih alami serta bermartabat dalam bahasa Indonesia daripada ''sesama budak'', tanpa mengaburkan penekanan pada ketundukan kepada Allah.'
- source_word: ἀδελφῶν σου
  choice: saudara-saudaramu
  rationale: Bentuk ini mempertahankan istilah kekerabatan dalam teks dan dalam pemakaian Indonesia dapat mencakup sesama orang percaya; cakupan representatifnya dijelaskan dalam catatan kaki.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: yang memiliki kesaksian Yesus
  rationale: '''Memiliki'' menerjemahkan ἔχω secara langsung, sedangkan konstruksi ''kesaksian Yesus'' mempertahankan ambiguitas genitif.'
- source_word: μαρτυρία Ἰησοῦ
  choice: kesaksian Yesus
  rationale: Ungkapan ini tidak memutuskan apakah yang dimaksud ialah kesaksian tentang Yesus atau kesaksian yang berasal dari Yesus.
- source_word: πνεῦμα τῆς προφητείας
  choice: roh nubuat
  rationale: Terjemahan formal ini mempertahankan istilah πνεῦμα yang sarat makna dan tidak menyempitkannya menjadi 'hakikat' atau 'inti'.
theological_decisions:
- issue: Makna genitif dalam μαρτυρία Ἰησοῦ
  choice: Mempertahankan ungkapan ambigu 'kesaksian Yesus' pada kedua kemunculannya
  alternative: '''kesaksian tentang Yesus'' atau ''kesaksian yang berasal dari Yesus'''
  rationale: Genitif Ἰησοῦ dapat bersifat objektif ataupun subjektif. Teks utama tidak seharusnya menentukan salah satunya ketika bahasa sumber tetap terbuka.
- issue: Makna σύνδουλος
  choice: sesama hamba
  alternative: sesama budak
  rationale: Malaikat menegaskan bahwa ia bersama Yohanes dan orang percaya lain sama-sama berada di bawah Allah dan bukan objek penyembahan. 'Sesama hamba' menyampaikan relasi ketundukan itu secara alami dalam register Kitab Suci Indonesia.
- issue: Cakupan ἀδελφῶν
  choice: saudara-saudaramu
  alternative: saudara-saudaramu seiman, baik laki-laki maupun perempuan
  rationale: Kata Yunani berbentuk maskulin jamak, tetapi dalam konteks komunitas orang percaya dapat berfungsi secara representatif. Teks utama mempertahankan bentuk ringkas, sedangkan catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Larangan dibuat lugas dan mendadak sesuai bentuk Yunani. Semua penanda catatan kaki ditempatkan dalam teks utama; [a] mengikuti frasa ambigu pertama dan [b] mengikuti istilah kekerabatan yang dijelaskannya.
