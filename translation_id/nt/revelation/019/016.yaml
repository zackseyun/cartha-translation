  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: id
  text: 'Ia memiliki sebuah nama yang tertulis pada jubah-Nya dan pada paha-Nya: “Raja segala raja dan Tuhan segala tuan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebuah nama yang tertulis.” Atau: “sebuah nama yang terukir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: tertulis
  rationale: Bahasa Indonesia paling alami mengungkapkan konstruksi ἔχει ... ὄνομα γεγραμμένον sebagai keadaan kini, yakni 'tertulis suatu nama', tanpa menafsirkan ἔχει sebagai 'memakai'.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: pada jubah-Nya
  rationale: ἱμάτιον berarti pakaian atau jubah; 'jubah' sesuai dengan gambaran tokoh kerajaan dalam konteks ini. Akhiran hormat -Nya merujuk kepada tokoh tersebut.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: pada paha-Nya
  rationale: μηρός secara langsung berarti 'paha'. Lokasi kedua dipertahankan tanpa menjelaskan hubungan spasialnya dengan jubah.
- source_word: ὄνομα γεγραμμένον
  choice: tertulis suatu nama
  rationale: 'Pilihan ini mempertahankan makna keadaan hasil dari bentuk perfect passive participle: nama itu telah ditulis dan berada dalam keadaan tertulis.'
- source_word: Βασιλεὺς βασιλέων
  choice: Raja segala raja
  rationale: Ungkapan idiomatis Indonesia ini mempertahankan konstruksi gelar superlatif dan daya agungnya.
- source_word: κύριος κυρίων
  choice: Tuhan segala tuan
  rationale: '''Tuhan'' mempertahankan bobot kristologis κύριος sebagai gelar bagi tokoh utama, sedangkan ''segala tuan'' menjaga pembedaan antara gelar utama dan bentuk genitif jamak.'
theological_decisions:
- issue: Cara menerjemahkan gelar Βασιλεὺς βασιλέων καὶ κύριος κυρίων
  choice: “Raja segala raja dan Tuhan segala tuan” sebagai nama atau gelar yang tertulis
  alternative: “Raja Yang Mahatinggi dan Tuhan Yang Mahatinggi”
  rationale: Bentuk harfiah mempertahankan paralelisme, citra kerajaan, dan daya kristologis teks tanpa mengubahnya menjadi parafrasa.
- issue: Hubungan lokasi antara jubah dan paha
  choice: 'Mempertahankan kedua lokasi secara langsung: “pada jubah-Nya dan pada paha-Nya”'
  alternative: “pada jubah-Nya, yaitu pada bagian yang menutupi paha-Nya”
  rationale: Teks Yunani menyebut dua frasa ἐπί dan tidak menerangkan apakah tulisan itu berada pada dua tempat atau pada jubah di bagian paha. Terjemahan tidak menyelesaikan ketaksaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan kedua lokasi dalam teks Yunani. Huruf kapital pada gelar menandai bahwa frasa itu berfungsi sebagai nama atau gelar resmi.
