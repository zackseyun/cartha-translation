id: REV.19.18
reference: Revelation 19:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: id
  text: supaya kalian makan daging raja-raja, daging para panglima, daging orang-orang perkasa, daging kuda-kuda dan orang-orang yang menungganginya[a], serta daging semua orang—baik orang merdeka maupun budak, baik orang kecil maupun orang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang yang duduk di atasnya”; secara lebih ringkas: “para penunggangnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: supaya kalian makan
  rationale: ἵνα dengan verba subjungtif menyatakan tujuan dari panggilan malaikat pada ayat sebelumnya. “Kalian” memperjelas bentuk orang kedua jamak, sedangkan “supaya ... makan” mempertahankan hubungan tujuan secara alami tanpa menambahkan gagasan kemampuan.
- source_word: σάρκας
  choice: daging
  rationale: Dalam gambaran penghakiman ini, σάρξ menunjuk pada daging tubuh secara harfiah. Pengulangan “daging” dipertahankan untuk membawa tekanan retoris daftar Yunani.
- source_word: βασιλέων
  choice: raja-raja
  rationale: βασιλεύς secara langsung menunjuk kepada raja; terjemahan yang lebih umum seperti “penguasa” akan mengaburkan acuan kerajaan yang khusus.
- source_word: χιλιάρχων
  choice: para panglima
  rationale: χιλίαρχος adalah perwira atau komandan militer, secara historis pemimpin seribu pasukan. “Para panglima” jelas, alami, dan mempertahankan nuansa militernya.
- source_word: ἰσχυρῶν
  choice: orang-orang perkasa
  rationale: Adjektiva ini dipakai secara substantival bagi mereka yang kuat atau berkuasa. “Orang-orang perkasa” mempertahankan keluasan makna dan sesuai dengan konteks pertempuran.
- source_word: ἵππων
  choice: kuda-kuda
  rationale: Kata ini secara harfiah menunjuk pada kuda-kuda dalam gambaran pertempuran.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: orang-orang yang menungganginya
  rationale: Frasa partisipial ini secara harfiah menggambarkan orang-orang yang duduk di atas kuda-kuda itu. “Menungganginya” menyampaikan gambaran tersebut secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: πάντων
  choice: semua orang
  rationale: πάντων merangkum seluruh kelompok manusia yang kemudian dirinci. Penambahan “orang” diperlukan agar maksudnya jelas dan alami dalam bahasa Indonesia.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: baik orang merdeka maupun budak
  rationale: Pasangan ini menyatakan dua kutub status sosial. “Budak” mempertahankan keadaan terikat yang tersirat jelas dalam pertentangannya dengan orang merdeka.
- source_word: μικρῶν καὶ μεγάλων
  choice: baik orang kecil maupun orang besar
  rationale: Ungkapan ini merupakan merisme yang mencakup semua tingkat kedudukan. Bentuk harfiahnya dipertahankan agar keluasan dan gema retoris sumber tidak dipersempit.
theological_decisions:
- issue: Terjemahan δοῦλος dalam pasangan status sosial
  choice: budak
  alternative: hamba
  rationale: Pertentangan langsung dengan “orang merdeka” menonjolkan status keterikatan, sehingga “budak” paling tepat menyampaikan makna sosial kata sumber tanpa memperhalusnya.
- issue: Cakupan “orang kecil” dan “orang besar”
  choice: mempertahankan ungkapan “orang kecil ... orang besar”
  alternative: orang berkedudukan rendah ... orang berkedudukan tinggi
  rationale: Ungkapan Yunani dapat mencakup tingkat kedudukan, kepentingan, atau kekuasaan. Terjemahan yang lebih harfiah menjaga keluasan dan ketegangan maknanya tanpa membatasinya hanya pada satu jenis hierarki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan gambaran penghakiman yang lugas. Pengulangan “daging” sengaja dipertahankan sebagai unsur retoris. “Kalian” dipakai untuk menandai sapaan jamak kepada burung-burung dari ayat sebelumnya.
