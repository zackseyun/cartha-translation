source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: id
  text: Lalu aku melihat binatang itu, raja-raja di bumi, dan pasukan-pasukan mereka yang telah dikumpulkan untuk berperang melawan Dia yang duduk di atas kuda itu dan melawan pasukan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berperang dengan”; dalam konteks ini artinya bermusuhan, yaitu “berperang melawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: binatang itu
  rationale: Dalam Wahyu, istilah ini menunjuk kepada sosok apokaliptis tertentu. 'Binatang itu' alami dalam bahasa Indonesia dan mempertahankan daya simbolis serta ancamannya.
- source_word: βασιλεῖς τῆς γῆς
  choice: raja-raja di bumi
  rationale: Dalam cakupan apokaliptis Wahyu, γῆ paling tepat dipahami sebagai bumi, bukan sekadar suatu negeri; ungkapan ini menunjuk kepada para penguasa dunia.
- source_word: τὰ στρατεύματα αὐτῶν
  choice: pasukan-pasukan mereka
  rationale: Bentuk jamak dan konteks peperangan mendukung 'pasukan-pasukan'; pilihan ini lebih alami daripada mengulang 'tentara' dan tetap menyatakan kekuatan militer setiap raja.
- source_word: συνηγμένα
  choice: telah berkumpul
  rationale: Partisip perfek pasif menggambarkan keadaan sebagai hasil pengumpulan sebelumnya. Bahasa Indonesia idiomatis dapat menyatakannya dengan 'telah berkumpul' tanpa memaksakan pelaku pasif yang tidak disebutkan.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: untuk berperang
  rationale: Ini idiom Yunani untuk melakukan peperangan. 'Untuk berperang' merupakan padanan Indonesia yang alami dan tetap mempertahankan tujuan pengumpulan mereka.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: melawan Dia yang duduk di atas kuda itu
  rationale: Walaupun μετά dengan genitif biasanya berarti 'dengan', dalam idiom peperangan konteksnya bersifat bermusuhan, sehingga 'melawan' menyampaikan maksudnya. Frasa deskriptif tetap dipertahankan dan tidak diganti dengan gelar kristologis.
- source_word: τοῦ καθημένου
  choice: Dia yang duduk
  rationale: Padanan ini mempertahankan bentuk deskriptif partisip Yunani dan lebih dekat dengan teks daripada kata interpretatif seperti 'penunggang'.
- source_word: ἐπὶ τοῦ ἵππου
  choice: di atas kuda itu
  rationale: Padanan lokatif yang jelas dan alami; artikel tertentu diteruskan sebagai 'itu' karena kuda tersebut sudah tampil dalam konteks langsung.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: melawan pasukan-Nya
  rationale: Konteks perang memberi μετά daya adversatif. Bentuk tunggal kolektif στρατεύματος diterjemahkan 'pasukan', sedangkan kapitalisasi pronomina mengikuti kebiasaan Indonesia untuk rujukan ilahi tanpa menambahkan gelar.
theological_decisions:
- issue: Rujukan 'Dia yang duduk di atas kuda itu'
  choice: Mempertahankan ungkapan deskriptif, bukan menggantinya dengan 'Kristus' atau 'Mesias'.
  alternative: melawan Kristus; melawan Mesias; melawan Penunggang kuda itu
  rationale: Konteks terdekat mengidentifikasi tokoh tersebut, tetapi ayat ini sendiri memakai frasa partisipial deskriptif. Mempertahankannya menghindari penambahan gelar yang tidak tertulis dan menjaga hubungan sastra dengan konteks.
- issue: Arti μετά dalam konteks peperangan
  choice: melawan
  alternative: dengan
  rationale: Secara leksikal μετά dengan genitif lazim berarti 'dengan', tetapi konstruksi ποιεῖν πόλεμον μετά τινος dalam konteks ini menyatakan pihak yang diperangi. 'Melawan' mencegah salah pengertian seolah-olah mereka berperang sebagai sekutu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar dipertahankan dengan jelas; 'Lalu' dipilih untuk καί pembuka sebagai penghubung naratif yang alami. Kapitalisasi 'Dia' dan '-Nya' menandai rujukan ilahi sesuai kebiasaan penerbitan Alkitab Indonesia, tanpa menyisipkan identitas atau gelar yang tidak dinyatakan dalam ayat.
