id: REV.19.5
reference: Revelation 19:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: id
  text: Lalu terdengarlah suatu suara dari takhta itu yang berkata, “Pujilah Allah kita, semua hamba-Nya[a] dan semua orang yang takut akan Dia[b], baik yang kecil maupun yang besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-Nya.” Kata Yunani δοῦλοι dapat berarti hamba atau budak, bergantung pada konteks; istilah ini menunjuk kepada orang-orang yang mengabdi kepada Allah dan menjadi milik-Nya.
    reason: lexical_alternative
  - marker: b
    text: “Takut akan Dia” adalah ungkapan Alkitab yang mencakup rasa gentar dan hormat yang mendalam kepada Allah, disertai kesetiaan kepada-Nya.
    reason: lexical_clarification
lexical_decisions:
- source_word: φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: terdengarlah suara dari takhta itu
  rationale: Ungkapan ini menyatakan bahwa suara berasal dari takhta. Bentuk 'terdengarlah' alami dalam narasi penglihatan bahasa Indonesia, sedangkan 'dari takhta itu' mempertahankan sumber suara tanpa menyatakan siapa pembicaranya.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Pujilah Allah kita
  rationale: Imperatif jamak diterjemahkan sebagai perintah langsung kepada sekelompok orang; datif menandai Allah sebagai sasaran pujian.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: hai semua hamba-Nya
  rationale: '''Hamba'' merupakan padanan Indonesia yang alami dan bermartabat bagi δοῦλοι dalam hubungan manusia dengan Allah, serta tetap menyiratkan pengabdian dan kepunyaan. Catatan kaki mempertahankan unsur status terikat yang dapat diungkapkan dengan ''budak''.'
- source_word: οἱ φοβούμενοι αὐτόν
  choice: kamu yang takut akan Dia
  rationale: '''Takut akan'' mempertahankan idiom alkitabiah dan cakupan makna yang mencakup rasa gentar, hormat, serta kesetiaan kepada Allah.'
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: baik yang kecil maupun yang besar
  rationale: Pasangan ini mempertahankan gambaran Yunani tentang seluruh rentang kedudukan atau status, sementara konstruksi 'baik ... maupun ...' terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna δοῦλοι dalam konteks ibadah dan kepunyaan Allah
  choice: hamba-Nya
  alternative: budak-Nya
  rationale: '''Hamba'' lebih alami dalam ragam Alkitab Indonesia modern dan tidak mengaburkan pengabdian kepada Allah; alternatif ''budak'' dicatat karena δοῦλος juga dapat menekankan bahwa seseorang sepenuhnya berada di bawah kuasa dan menjadi milik tuannya.'
- issue: Arti takut kepada Allah
  choice: takut akan Dia
  alternative: hormat kepada-Nya
  rationale: Teks utama mempertahankan ketegangan idiom alkitabiah dan tidak mempersempitnya menjadi rasa hormat saja; catatan menjelaskan nuansa takut yang penuh hormat.
- issue: Hubungan kelompok dalam seruan
  choice: semua hamba-Nya, kamu yang takut akan Dia, baik yang kecil maupun yang besar
  alternative: semua hamba-Nya dan semua orang yang takut akan Dia, baik yang kecil maupun yang besar
  rationale: Susunan Yunani memungkinkan ungkapan 'yang takut akan Dia' menjelaskan siapa para hamba itu, bukan harus memperkenalkan kelompok kedua yang terpisah. Sapaan 'kamu' menjaga alur apposisional tersebut tanpa menutup kemungkinan cakupan luasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Partikel '-lah' menguatkan alur naratif dan perintah tanpa memberi kesan kuno berlebihan. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
