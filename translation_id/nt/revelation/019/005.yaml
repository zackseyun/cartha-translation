  terminology: '"Hamba-Nya" adalah padanan yang wajar dan lazim untuk δοῦλοι dalam seruan ibadah, sedangkan catatan kaki dengan tepat memberi alternatif "budak-Nya." "Takut akan Dia" mempertahankan idiom biblis tanpa mereduksinya menjadi sekadar hormat.'
