  to: Lalu terdengarlah suatu suara dari takhta itu yang berkata, “Pujilah Allah kita, semua hamba-Nya[a] dan semua orang yang takut akan Dia[b], baik yang kecil maupun yang besar.”
  rationale: Revisi mempertahankan makna utama dan register khidmat draf, sambil menerjemahkan καὶ secara eksplisit sebagai "dan". "Semua orang yang takut akan Dia" menyampaikan bentuk substantival οἱ φοβούμενοι tanpa memaksakan bahwa kelompok ini hanya penjelasan bagi "hamba-Nya." Frasa "baik yang kecil maupun yang besar" tetap mencakup seluruh rentang status sebagaimana dalam teks Yunani.
