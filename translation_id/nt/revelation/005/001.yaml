source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: id
  text: Lalu aku melihat di tangan kanan Dia yang duduk di atas takhta itu sebuah gulungan[a] yang bertuliskan pada sisi dalam dan sisi belakangnya[b], serta dimeteraikan dengan tujuh meterai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buku”. Kata Yunani βιβλίον dalam konteks ini kemungkinan besar menunjuk pada gulungan, bukan buku berbentuk kodeks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bertuliskan di dalam dan di belakang”. Sisi belakang dapat dipahami sebagai sisi luar gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoristus ὁράω berfungsi sebagai verba naratif sederhana; 'aku melihat' alami dan tetap mempertahankan sudut pandang Yohanes.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: di tangan kanan
  rationale: Walaupun ἐπί dengan akusatif secara harfiah dapat berarti 'di atas', dalam konteks ini frasa tersebut paling wajar menyatakan letak gulungan pada atau dalam tangan kanan. Bahasa Indonesia idiomatis memakai 'di tangan kanan' tanpa menentukan lebih jauh apakah benda itu digenggam atau terletak di telapak.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Dia yang duduk di atas takhta itu
  rationale: Partisip substantival diterjemahkan secara deskriptif tanpa menyebut identitas tokoh secara eksplisit. Huruf kapital pada 'Dia' sesuai register penghormatan dalam konteks, sedangkan 'itu' menandai takhta yang sudah hadir dalam penglihatan.
- source_word: βιβλίον
  choice: gulungan
  rationale: Dalam konteks dunia abad pertama dan gambaran tulisan pada dua sisi serta meterai, kata ini kemungkinan besar menunjuk pada gulungan, bukan buku berbentuk kodeks.
- source_word: γεγραμμένον
  choice: yang bertuliskan
  rationale: Partisip perfek pasif menunjukkan gulungan berada dalam keadaan telah ditulisi. 'Yang bertuliskan' menyampaikan keadaan tersebut secara alami.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: pada sisi dalam dan sisi belakangnya
  rationale: ἔσωθεν menunjuk sisi dalam gulungan, sedangkan ὄπισθεν paling mungkin menunjuk sisi belakang atau kebalikannya. Rumusan ini mempertahankan gambaran fisik kedua sisi tanpa menggeneralisasikannya menjadi sekadar 'bagian luar'.
- source_word: κατεσφραγισμένον
  choice: dimeteraikan
  rationale: Partisip perfek pasif menyatakan keadaan yang sudah dimeteraikan. 'Dimeteraikan' adalah padanan Indonesia yang tepat dan bernuansa resmi.
- source_word: σφραγῖσιν ἑπτά
  choice: dengan tujuh meterai
  rationale: Datif instrumental secara alami diterjemahkan dengan 'dengan'; 'meterai' mempertahankan hubungan leksikal dengan tindakan memeteraikan.
theological_decisions:
- issue: Identitas tokoh yang duduk di atas takhta
  choice: Dia yang duduk di atas takhta itu
  alternative: Allah yang duduk di atas takhta itu
  rationale: Teks Yunani menggambarkan tokoh tersebut tanpa menyebut nama ilahi secara eksplisit. Terjemahan mempertahankan cara penyajian sastra itu dan tidak memasukkan identifikasi teologis ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lalu' mengalirkan narasi lebih alami daripada memulai dengan 'Dan'. Istilah 'gulungan', 'takhta', dan 'meterai' mempertahankan latar kuno serta citra apokaliptik tanpa menjadi sukar dipahami.
