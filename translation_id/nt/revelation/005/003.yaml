id: REV.5.3
reference: Revelation 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: id
  text: Dan tidak seorang pun di surga, di atas bumi, atau di bawah bumi sanggup membuka gulungan itu ataupun melihatnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kitab itu.” Kata Yunani yang dipakai dapat menunjuk pada dokumen tertulis secara umum, tetapi dalam konteks ini “gulungan” paling sesuai dengan gambaran dunia kuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan baku dan bermartabat untuk pronomina negatif yang menyatakan ketiadaan siapa pun.
- source_word: ἐδύνατο
  choice: sanggup
  rationale: Bentuk imperfek δύναμαι dalam konteks naratif menyatakan bahwa tidak ada yang memiliki kemampuan; 'sanggup' alami dan mempertahankan daya verbalnya.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Padanan Indonesia yang wajar bagi lokasi surgawi dalam gambaran apokaliptik.
- source_word: ἐπὶ τῆς γῆς
  choice: di atas bumi
  rationale: Mempertahankan hubungan ruang yang dinyatakan ἐπί dengan genitif sekaligus kesejajaran kosmis dengan surga dan bawah bumi.
- source_word: ὑποκάτω τῆς γῆς
  choice: di bawah bumi
  rationale: Padanan spasial langsung yang mempertahankan tiga ranah kosmis dalam teks.
- source_word: ἀνοῖξαι
  choice: membuka
  rationale: Infinitif ini bergantung pada 'sanggup'; padanan langsung tidak memerlukan perluasan.
- source_word: τὸ βιβλίον
  choice: gulungan itu
  rationale: Dalam adegan penglihatan ini, βιβλίον paling mungkin menunjuk pada dokumen berbentuk gulungan; demonstratif 'itu' menandai referen tertentu secara alami dalam bahasa Indonesia.
- source_word: οὔτε βλέπειν αὐτό
  choice: ataupun melihatnya
  rationale: οὔτε mengoordinasikan infinitif kedua dalam lingkup negatif. 'Melihatnya' mempertahankan makna dasar βλέπειν tanpa menambahkan penegasan seperti 'bahkan' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Cakupan kosmis pihak-pihak yang tidak sanggup membuka gulungan
  choice: 'Mempertahankan tiga ranah secara eksplisit: ''di surga, di atas bumi, atau di bawah bumi.'''
  alternative: Merangkum sebagai 'di mana pun dalam ciptaan.'
  rationale: Rangkaian tiga ranah menekankan ketidakmampuan universal melalui gambaran kosmis khas apokaliptik; merangkumnya akan menghilangkan citra dan struktur sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur tiga ranah dipertahankan, sedangkan susunan negatif dibuat alami dengan 'tidak seorang pun' dan 'ataupun'. Penanda catatan kaki [a] ditempatkan langsung setelah unsur yang diberi penjelasan pada akhir ayat.
