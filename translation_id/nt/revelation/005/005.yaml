  verdict: revise
  source_fidelity: 'Perlu revisi pada ῥίζα Δαυίδ: artinya adalah “Akar Daud,” bukan “Tunas Daud.” Kedua metafora ini berkaitan dalam tradisi mesianik, tetapi tidak sama dan tidak boleh dipertukarkan dalam terjemahan ayat ini. Selebihnya, “telah menang untuk membuka” secara dekat mempertahankan infinitif ἀνοῖξαι tanpa memaksakan satu hubungan sintaktis tertentu.'
  naturalness: Teks pada umumnya jelas dan bernada khidmat dalam bahasa Indonesia standar. “Salah seorang dari antara tua-tua” sedikit lebih lancar daripada “salah seorang dari tua-tua itu” serta tidak menambahkan penunjuk “itu” yang tidak dinyatakan dalam teks Yunani. “Gulungan kitab” dan “meterai” sesuai konteks apokaliptik.
  terminology: “Tua-tua,” “Singa dari suku Yehuda,” “gulungan kitab,” dan “meterai” tepat dan konsisten dengan register Alkitab Indonesia. Gelar kedua harus “Akar Daud.” Catatan kaki yang ada sebaiknya tidak menambahkan gagasan bahwa kemenangan itu diperoleh “melalui perjuangan,” sebab cara kemenangan tidak dinyatakan oleh kata ἐνίκησεν itu sendiri.
