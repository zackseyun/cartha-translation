- from: Lalu salah seorang dari tua-tua itu berkata kepadaku, “Jangan menangis. Lihatlah! Singa dari suku Yehuda, yaitu Tunas Daud, telah menang[a] untuk membuka gulungan kitab itu dan ketujuh meterainya.”
  to: Lalu salah seorang dari antara tua-tua berkata kepadaku, “Jangan menangis. Lihatlah! Singa dari suku Yehuda, yaitu Akar Daud, telah menang[a] untuk membuka gulungan kitab itu dan ketujuh meterainya.”
  rationale: Revisi mengganti “Tunas Daud” dengan “Akar Daud” untuk menerjemahkan ῥίζα secara setia. Catatan kaki diperbaiki agar hanya menjelaskan rentang makna νικάω tanpa menambahkan cara kemenangan. Penyesuaian kecil pada frasa “dari antara tua-tua” meningkatkan kelancaran dan kedekatan dengan sumber tanpa mengubah makna.
