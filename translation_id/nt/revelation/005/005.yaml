id: REV.5.5
reference: Revelation 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: id
  text: Lalu salah seorang dari antara tua-tua berkata kepadaku, “Jangan menangis. Lihatlah! Singa dari suku Yehuda, yaitu Akar Daud, telah menang[a] untuk membuka gulungan kitab itu dan ketujuh meterainya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mengalahkan.” Kata Yunani ini merupakan istilah penting dalam kitab Wahyu untuk kemenangan atau penaklukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: tua-tua
  rationale: Dalam Wahyu, istilah ini menunjuk pada kelompok surgawi yang dikenal, bukan sekadar orang yang berusia tua; 'tua-tua' mempertahankan sebutan tersebut dalam bahasa Alkitab Indonesia.
- source_word: λέγει
  choice: berkata
  rationale: Present historis Yunani menghidupkan narasi, tetapi bentuk lampau 'berkata' lebih alami dalam narasi bahasa Indonesia dan tidak mengubah urutan peristiwa.
- source_word: Μὴ κλαῖε
  choice: Jangan menangis
  rationale: Ungkapan ini alami, jelas, dan mempertahankan nada khidmat tanpa memaksakan nuansa 'berhentilah' yang mungkin tetapi tidak wajib.
- source_word: ἰδοὺ
  choice: Lihatlah!
  rationale: Penanda wacana ini menarik perhatian secara langsung; 'Lihatlah!' modern, tegas, dan lebih alami daripada bentuk arkais.
- source_word: ἐνίκησεν
  choice: telah menang
  rationale: νικάω adalah istilah kunci dalam Wahyu bagi kemenangan atau tindakan mengalahkan. 'Telah menang' mempertahankan motif kemenangan serta aspek hasil yang kini berlaku.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: Singa dari suku Yehuda
  rationale: '''Dari'' mencerminkan ἐκ dan menyatakan asal atau keterkaitan dengan suku Yehuda secara alami.'
- source_word: ἡ ῥίζα Δαυίδ
  choice: Tunas Daud
  rationale: Secara harfiah ῥίζα berarti 'akar', tetapi dalam ungkapan mesianik ini bahasa Indonesia Alkitabiah lazim memakai 'Tunas Daud'. Pilihan ini menyampaikan citra tokoh yang berasal dari garis Daud, meski 'Akar Daud' tetap mungkin.
- source_word: ἀνοῖξαι
  choice: untuk membuka
  rationale: Infinitif Yunani dipertahankan secara dekat dan alami tanpa menentukan secara berlebihan apakah relasinya menyatakan tujuan, hasil, atau kelayakan efektif.
- source_word: τὸ βιβλίον
  choice: gulungan kitab
  rationale: Dalam latar kuno ini βιβλίον berupa gulungan bertulis; 'gulungan kitab' jelas bagi pembaca Indonesia dan membedakannya dari buku berjilid modern.
- source_word: σφραγῖδας
  choice: meterai
  rationale: '''Meterai'' adalah padanan baku untuk segel yang menutup dan mengamankan gulungan dalam konteks ini.'
- source_word: αὐτοῦ
  choice: -nya pada 'meterainya'
  rationale: Pronomina ini merujuk kepada gulungan kitab; bentuk enklitik Indonesia menyatakan kepemilikan secara alami.
theological_decisions:
- issue: Dua gelar mesianik dan rajawi
  choice: Mempertahankan keduanya sebagai 'Singa dari suku Yehuda, yaitu Tunas Daud'.
  alternative: '''Singa dari suku Yehuda, Akar Daud'' atau parafrasa penjelas.'
  rationale: Teks sengaja menumpuk dua citra Kitab Suci Israel bagi tokoh yang menang. 'Yaitu' menunjukkan bahwa keduanya merujuk pada tokoh yang sama tanpa menambahkan identifikasi doktrinal di luar ayat.
- issue: Hubungan ἀνοῖξαι dengan ἐνίκησεν
  choice: telah menang untuk membuka
  alternative: telah menang sehingga ia dapat membuka
  rationale: Bentuk 'untuk membuka' mempertahankan ketegangan sintaksis infinitif Yunani dan tidak secara sepihak menetapkannya sebagai hasil, kemampuan, atau tujuan.
- issue: Makna kemenangan Kristus
  choice: telah menang
  alternative: telah mengalahkan atau telah berjaya
  rationale: Pilihan ini mempertahankan motif νικάω dalam Wahyu tanpa menyebut objek kemenangan yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat dan mudah dipahami. Susunan gelar dipertahankan padat. 'Tua-tua', 'gulungan kitab', dan 'meterai' dipakai karena sesuai dengan latar apokaliptik serta pemakaian Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
