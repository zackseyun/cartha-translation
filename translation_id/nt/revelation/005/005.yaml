    rationale: ῥίζα berarti “akar,” sedangkan “tunas” merupakan citra berbeda. Mengganti metafora ini mengurangi kesetiaan pada gelar yang dipakai teks dan pada gaung kitab-kitab sebelumnya.
  - severity: low
    issue: Catatan kaki [a] menambahkan “kemenangan yang diperoleh melalui perjuangan.”
    rationale: νικάω menyatakan menang atau mengalahkan, tetapi kata itu sendiri tidak menentukan sarana atau corak perjuangan kemenangan tersebut.
  - severity: low
    issue: Kata “itu” dalam “tua-tua itu” tidak mempunyai padanan eksplisit dalam teks sumber.
    rationale: Konteks memang mengenal kelompok tua-tua, tetapi penghapusannya menghasilkan terjemahan yang sedikit lebih dekat dan tetap alami.
  revised_text: Lalu salah seorang dari antara tua-tua berkata kepadaku, “Jangan menangis. Lihatlah! Singa dari suku Yehuda, yaitu Akar Daud, telah menang[a] untuk membuka gulungan kitab itu dan ketujuh meterainya.”
