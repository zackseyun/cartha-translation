id: REV.5.8
reference: Revelation 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: id
  text: Ketika Ia mengambil gulungan kitab itu, keempat makhluk hidup dan kedua puluh empat tua-tua tersungkur di hadapan Anak Domba. Masing-masing memegang sebuah kecapi[a] dan cawan-cawan emas yang penuh dengan dupa, yang adalah doa-doa orang-orang kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alat musik petik sejenis lira.”
    reason: κιθάρα adalah alat musik berdawai kuno; tidak ada alat musik Indonesia modern yang benar-benar sepadan bentuknya.
  - marker: b
    text: Dalam bahasa Yunani, kata “yang” secara gramatikal merujuk pada “cawan-cawan emas.”
    reason: Menjelaskan rujukan gramatikal pronomina relatif tanpa menambahkan penafsiran terhadap lambang dupa dan doa.
lexical_decisions:
- source_word: βιβλίον
  choice: gulungan kitab
  rationale: Dalam adegan Wahyu ini, istilah tersebut menunjuk pada dokumen tertulis berbentuk gulungan; pilihan ini mempertahankan bentuk bendanya sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ζῷα
  choice: makhluk hidup
  rationale: Istilah ini menunjuk pada makhluk surgawi di sekitar takhta, bukan binatang dalam arti yang merendahkan.
- source_word: πρεσβύτεροι
  choice: tua-tua
  rationale: Pilihan ini lazim dalam bahasa Alkitab Indonesia untuk para tokoh surgawi tersebut dan tidak memasukkan jabatan gerejawi tertentu.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini menyampaikan kedekatan ruang sekaligus sikap hormat dalam adegan penyembahan.
- source_word: ἀρνίου
  choice: Anak Domba
  rationale: Kapitalisasi menandai gelar kristologis yang sudah terbentuk dalam konteks Wahyu, sementara makna metaforis dan nuansa kurbannya tetap terpelihara.
- source_word: ἔχοντες ἕκαστος
  choice: masing-masing memegang
  rationale: Pilihan ini mempertahankan daya distributif ἕκαστος dan mengungkapkan konstruksi partisipial secara wajar dalam bahasa Indonesia.
- source_word: κιθάραν
  choice: kecapi
  rationale: κιθάρα adalah alat musik berdawai; 'kecapi' merupakan padanan Indonesia yang umum, meskipun bentuk alat kunonya tidak persis sama dengan kecapi tradisional Indonesia.
- source_word: φιάλας χρυσᾶς
  choice: cawan-cawan emas
  rationale: φιάλη menunjuk pada wadah lebar atau dangkal; 'cawan' lebih tepat dan mudah dipahami daripada istilah untuk botol kecil.
- source_word: γεμούσας θυμιαμάτων
  choice: yang penuh dengan dupa
  rationale: Bentuk jamak Yunani dapat diterjemahkan secara alami sebagai nomina massa 'dupa' dalam bahasa Indonesia.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: yaitu doa-doa orang-orang kudus
  rationale: Rumusan ini mempertahankan identifikasi langsung dalam bahasa simbolis kitab Wahyu dan menerjemahkan ἅγιοι sebagai umat yang dikuduskan bagi Allah.
theological_decisions:
- issue: Identifikasi simbolis antara dupa/cawan dan doa
  choice: 'Memakai identifikasi langsung: ''yaitu doa-doa orang-orang kudus'''
  alternative: yang melambangkan doa-doa orang-orang kudus
  rationale: Klausa Yunani memakai bentuk ekuatif αἵ εἰσιν ('yang adalah'), sehingga terjemahan tidak melemahkannya menjadi penjelasan interpretatif. Karena pronomina relatif Yunani secara gramatikal selaras dengan 'cawan-cawan', sedangkan gambaran simbolis lazim dipahami berpusat pada dupa, ketegangan ini dijelaskan dalam catatan.
- issue: Cakupan ἅγιοι
  choice: orang-orang kudus
  alternative: umat Allah; orang-orang yang disucikan
  rationale: Pilihan ini mempertahankan istilah teologis bagi umat milik Allah tanpa membatasinya pada tokoh yang kemudian secara resmi dinyatakan kudus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat panjang Yunani dibagi menjadi dua agar mudah dibaca tanpa mengubah urutan adegan. 'Ia' dipertahankan dengan huruf kapital karena acuannya adalah Anak Domba dari konteks sebelumnya. Istilah 'tua-tua', 'Anak Domba', dan 'orang-orang kudus' menjaga kesinambungan kosakata kitab Wahyu.
