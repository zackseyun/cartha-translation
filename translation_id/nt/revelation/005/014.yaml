id: REV.5.14
reference: Revelation 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: id
  text: Keempat makhluk hidup itu terus berkata, “Amin.” Lalu para tua-tua tersungkur dan menyembah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah menambahkan objek yang eksplisit sesudah “menyembah”, misalnya “Dia yang hidup selama-lamanya” atau “Dia”. Teks utama mengikuti bacaan SBLGNT yang lebih pendek dan membiarkan objeknya tersirat dari konteks.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: makhluk hidup
  rationale: Dalam Wahyu, istilah ini menunjuk pada makhluk surgawi di sekitar takhta dan mempertahankan kaitan dengan penglihatan takhta dalam Yehezkiel; 'makhluk hidup' tepat dan lazim dalam bahasa Indonesia.
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Bentuk imperfek memberi nuansa tindakan yang sedang berlangsung atau berulang; 'terus berkata' menyampaikan aspek itu secara alami.
- source_word: Ἀμήν
  choice: Amin
  rationale: Sebagai seruan liturgis, bentuk serapan 'Amin' sudah dikenal luas dan mempertahankan fungsi ungkapan aslinya.
- source_word: πρεσβύτεροι
  choice: para tua-tua
  rationale: Dalam Wahyu, istilah ini adalah sebutan bagi kelompok surgawi tertentu, bukan sekadar orang yang lebih tua; 'para tua-tua' mempertahankan sebutan tradisional yang dipahami dalam konteks Alkitab.
- source_word: ἔπεσαν
  choice: tersungkur
  rationale: Dalam konteks penyembahan, 'tersungkur' secara alami mengungkapkan tindakan menjatuhkan diri dengan sikap takzim.
- source_word: προσεκύνησαν
  choice: menyembah
  rationale: Dalam adegan ruang takhta surgawi ini, kata tersebut menyatakan penghormatan religius dalam penyembahan, bukan hanya gerakan membungkuk.
theological_decisions:
- issue: Objek penyembahan tidak disebutkan secara eksplisit
  choice: Mempertahankan bentuk absolut 'menyembah' tanpa menambahkan objek
  alternative: menyembah Dia; menyembah Allah; menyembah Dia yang hidup selama-lamanya
  rationale: Teks SBLGNT berakhir dengan καὶ προσεκύνησαν tanpa objek yang dinyatakan. Bahasa Indonesia dapat mempertahankan objek yang tersirat dari konteks tanpa memasukkan kata-kata dari varian naskah atau menafsirkan identitas objek secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan aspek imperfek ἔλεγον atau menambahkan objek bagi προσεκύνησαν.
