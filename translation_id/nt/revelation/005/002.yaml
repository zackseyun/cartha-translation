  terminology: Istilah “malaikat,” “layak,” “gulungan kitab,” dan “meterai” konsisten dengan pemakaian Alkitab bahasa Indonesia serta tidak menambahkan penafsiran teologis. Pilihan “gulungan kitab” dengan tepat mengomunikasikan βιβλίον sebagai dokumen berbentuk gulungan, sambil tetap mengenali sifatnya sebagai teks tertulis.
