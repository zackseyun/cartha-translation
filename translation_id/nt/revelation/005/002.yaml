  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur Yunani: καὶ εἶδον (“Lalu aku melihat”), ἄγγελον ἰσχυρόν (“seorang malaikat yang kuat”), κηρύσσοντα ἐν φωνῇ μεγάλῃ (“berseru dengan suara nyaring”), pertanyaan tentang kelayakan, pembukaan βιβλίον, dan tindakan λῦσαι terhadap meterai-meterainya. “Melepaskan” secara baik mempertahankan keluasan λύω tanpa secara tidak perlu membatasi tindakan itu pada pemecahan fisik.'
