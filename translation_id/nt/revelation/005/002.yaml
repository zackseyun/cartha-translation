  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: id
  text: Lalu aku melihat seorang malaikat yang kuat berseru dengan suara nyaring, “Siapakah yang layak membuka gulungan kitab itu dan melepaskan meterai-meterainya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: seorang malaikat yang kuat
  rationale: ἰσχυρός menyatakan kekuatan atau kuasa. “Yang kuat” alami dalam bahasa Indonesia dan mempertahankan makna sumber tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: κηρύσσοντα
  choice: berseru
  rationale: κηρύσσω berarti menyampaikan pengumuman secara terbuka sebagai bentara. Dalam adegan ini, “berseru” secara alami menyampaikan tindakan mengumumkan dengan lantang dan khidmat.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Ungkapan ini menandakan suara yang keras dan terdengar jelas. “Dengan suara nyaring” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: Τίς ἄξιος
  choice: Siapakah yang layak
  rationale: ἄξιος menunjukkan kelayakan atau kepantasan untuk melakukan tugas yang agung. “Layak” mempertahankan bobot etis dan teologisnya.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: membuka gulungan kitab itu
  rationale: βιβλίον dapat berarti tulisan, kitab, atau gulungan. Dalam konteks benda bertulis yang memiliki beberapa meterai, “gulungan kitab” paling jelas menggambarkan bentuk bendanya sekaligus sifatnya sebagai dokumen tertulis.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: dan melepaskan meterai-meterainya
  rationale: λύω secara dasar berarti melepaskan, menguraikan, atau membuka ikatan. “Melepaskan meterai-meterainya” mempertahankan citra konkret tanpa memaksakan bahwa meterainya harus dipecahkan secara fisik.
theological_decisions:
- issue: Bentuk βιβλίον dalam penglihatan ruang takhta
  choice: gulungan kitab
  alternative: kitab
  rationale: Konteks meterai yang jamak lebih cocok dengan sebuah gulungan kuno. Pilihan ini bersifat leksikal-historis dan tidak menetapkan identitas atau isi gulungan tersebut.
- issue: Tindakan λύω terhadap meterai
  choice: melepaskan meterai-meterainya
  alternative: memecahkan meterai-meterainya
  rationale: Makna dasar λύω lebih luas daripada “memecahkan.” Terjemahan “melepaskan” menjaga ketegangan citra sumber dan tetap menyatakan bahwa meterai harus disingkirkan agar gulungan dapat dibuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Lalu aku melihat” mempertahankan kesinambungan naratif καὶ εἶδον; “Siapakah” dipilih untuk register yang bermartabat.
