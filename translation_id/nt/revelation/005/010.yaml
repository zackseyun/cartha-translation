  source_fidelity: 'Teks utama secara tepat mengikuti sumber Yunani yang diberikan: ἐποίησας diterjemahkan sebagai tindakan yang telah dilakukan; αὐτούς sebagai “mereka”; βασιλείαν sebagai “suatu kerajaan”; ἱερεῖς sebagai “imam-imam”; dan βασιλεύουσιν sebagai bentuk kini, “mereka memerintah.” Terjemahan “di bumi” merupakan padanan langsung yang tidak menambahkan arti dominasi. Walaupun audit bahasa Inggris memuat ketidakselarasan mengenai bentuk futur, sumber Yunani yang disediakan berbunyi βασιλεύουσιν, bukan βασιλεύσουσιν; karena itu teks Indonesia dan catatan varian futur sudah tepat.'
