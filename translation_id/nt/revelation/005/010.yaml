id: REV.5.10
reference: Revelation 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: id
  text: dan Engkau telah menjadikan mereka suatu kerajaan[a] dan imam-imam bagi Allah kita, dan mereka memerintah di bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “raja-raja dan imam-imam”, bukan “suatu kerajaan dan imam-imam”.
    reason: textual_variant
  - marker: b
    text: Beberapa naskah berbunyi “mereka akan memerintah di bumi”, bukan “mereka memerintah di bumi”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: Engkau telah menjadikan
  rationale: Aoristus aktif indikatif menyatakan tindakan yang telah dilakukan; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hasil tindakan tersebut dalam konteks nyanyian.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina akusatif jamak yang merujuk kepada orang-orang yang ditebus pada ayat sebelumnya.
- source_word: τῷ θεῷ ἡμῶν
  choice: bagi Allah kita
  rationale: Datif menyatakan peruntukan atau hubungan; “bagi” terdengar alami dalam bahasa Indonesia tanpa mempersempit maknanya.
- source_word: βασιλείαν
  choice: suatu kerajaan
  rationale: Nomina tunggal ini menggambarkan umat tebusan secara kolektif sebagai kerajaan, sesuai teks SBLGNT.
- source_word: ἱερεῖς
  choice: imam-imam
  rationale: Padanan baku untuk nomina jamak yang menunjuk kepada fungsi keimaman umat tebusan.
- source_word: βασιλεύουσιν
  choice: mereka memerintah
  rationale: Bentuk dalam teks Yunani yang diberikan adalah indikatif aktif kini orang ketiga jamak, sehingga diterjemahkan dengan kala kini tanpa mengubahnya menjadi futur.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: ἐπί dengan genitif di sini paling langsung menyatakan tempat; “di bumi” alami dan tidak menambahkan gagasan kekuasaan atas bumi yang tidak harus terkandung dalam preposisi itu.
theological_decisions:
- issue: Identitas umat tebusan sebagai βασιλείαν
  choice: suatu kerajaan
  alternative: raja-raja
  rationale: Teks SBLGNT berbunyi βασιλείαν (“kerajaan”), bukan βασιλεῖς (“raja-raja”). Varian yang berpengaruh tetap dicatat dalam catatan kaki.
- issue: Waktu pemerintahan umat tebusan
  choice: mereka memerintah
  alternative: mereka akan memerintah
  rationale: Bentuk βασιλεύουσιν dalam sumber Yunani yang disediakan adalah kala kini. Terjemahan tidak mengubahnya menjadi futur atau menyelesaikan ketegangan eskatologis; varian futur dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” memakai huruf kapital karena ditujukan kepada Anak Domba. Susunan kalimat mempertahankan kesejajaran “suatu kerajaan dan imam-imam” serta kala kini pada verba penutup.
