  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: id
  text: Ia datang dan mengambil gulungan itu[a] dari tangan kanan Dia yang duduk di atas takhta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Yunani tidak menyebutkan objek setelah “mengambil”; “gulungan itu” dipahami dari konteks sebelumnya.
    reason: Menandai bahwa objek eksplisit dalam terjemahan disediakan berdasarkan konteks wacana.
lexical_decisions:
- source_word: ἦλθεν
  choice: datang
  rationale: Bentuk aoristus dari ἔρχομαι menyatakan gerakan Anak Domba menuju Dia yang duduk di atas takhta. “Datang” mempertahankan arti dasar verba tanpa menambahkan nuansa penafsiran seperti “menghampiri”.
- source_word: εἴληφεν
  choice: mengambil gulungan itu
  rationale: Bentuk perfek dari λαμβάνω muncul dalam rangkaian narasi penglihatan dan secara wajar diterjemahkan sebagai tindakan lampau dalam bahasa Indonesia. “Mengambil” lebih tepat daripada “menerima” karena menggambarkan tindakan langsung; objeknya, yaitu gulungan, dipahami dari konteks terdekat.
- source_word: ἐκ
  choice: dari
  rationale: Preposisi ini menyatakan sumber atau tempat asal. “Dari” merupakan padanan spasial yang alami dalam bahasa Indonesia.
- source_word: τῆς δεξιᾶς
  choice: tangan kanan
  rationale: Dalam konstruksi ini δεξιά menunjuk pada tangan kanan, bukan sekadar sisi kanan, sehingga gambaran konkret dalam penglihatan tetap terpelihara.
- source_word: τοῦ καθημένου
  choice: Dia yang duduk
  rationale: Partisipel kini κάθημαι dipakai secara substantival. “Dia yang duduk” alami dalam bahasa Indonesia dan mempertahankan keadaan yang sedang berlangsung tanpa menambahkan identitas yang tidak dinyatakan dalam ayat ini.
- source_word: ἐπὶ τοῦ θρόνου
  choice: di atas takhta
  rationale: ἐπί di sini bersifat lokatif. “Di atas takhta” adalah ungkapan baku dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Objek langsung εἴληφεν yang tersirat
  choice: Objek dinyatakan sebagai “gulungan itu”, merujuk pada gulungan dalam konteks sebelumnya.
  alternative: 'Membiarkan objek tidak disebutkan: “mengambil dari tangan kanan...”'
  rationale: Teks Yunani membiarkan objek tersirat karena sudah jelas dari konteks. Dalam bahasa Indonesia, menyatakannya menghasilkan kalimat yang lebih alami dan jelas tanpa menambahkan rujukan baru.
- issue: Penyebutan sosok yang bertakhta
  choice: “Dia yang duduk di atas takhta”
  alternative: “Pribadi yang duduk di atas takhta” atau menyebut identitas-Nya secara eksplisit
  rationale: Pilihan ini mempertahankan pembedaan antara subjek yang datang dan sosok yang duduk di atas takhta, sekaligus tidak memasukkan penjelasan teologis yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan tindakan dipertahankan secara ringkas. Huruf kapital pada “Dia” mengikuti penggunaan hormat bagi sosok ilahi yang duduk di atas takhta tanpa menambahkan nama atau gelar yang tidak terdapat dalam teks.
