  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: id
  text: Aku pun menangis dengan sangat karena tidak seorang pun ditemukan layak untuk membuka gulungan itu ataupun melihatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melihat isinya.” Ungkapan Yunani ini dapat berarti sekadar melihat gulungan itu, tetapi dalam konteks ini mungkin merujuk pada melihat isinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: Lalu aku
  rationale: καί melanjutkan alur penglihatan, sedangkan ἐγώ menyebut Yohanes sebagai orang yang mengalami tindakan itu. Dalam narasi Indonesia, “Lalu aku” lebih alami daripada “Dan aku” tanpa menambahkan penekanan berlebihan.
- source_word: ἔκλαιον πολὺ
  choice: menangis tersedu-sedu
  rationale: Bentuk imperfek ἔκλαιον menggambarkan tangisan yang sedang berlangsung, dan πολύ memperkuat intensitasnya. Ungkapan ini menyampaikan tangisan hebat secara alami dalam bahasa Indonesia tanpa mengartikannya sebagai tangisan keras.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan baku dan jelas bagi kata negatif tak tentu yang meniadakan adanya siapa pun yang memenuhi syarat.
- source_word: ἄξιος
  choice: layak
  rationale: “Layak” mempertahankan bobot moral dan status di hadapan Allah, bukan sekadar kemampuan teknis.
- source_word: εὑρέθη
  choice: ditemukan
  rationale: Mempertahankan bentuk pasif aoris Yunani dan tidak menetapkan pelaku pencarian.
- source_word: ἀνοῖξαι
  choice: untuk membuka
  rationale: Infinitif ini menyatakan tindakan yang memerlukan kelayakan; padanannya langsung dan alami.
- source_word: τὸ βιβλίον
  choice: gulungan itu
  rationale: Dalam adegan Wahyu 5, objek yang dapat dibuka dan bermeterai adalah gulungan naskah. Kata penunjuk “itu” sesuai dengan artikel Yunani dan merujuk pada gulungan yang sudah disebut dalam konteks.
- source_word: οὔτε βλέπειν αὐτό
  choice: ataupun melihat isinya
  rationale: οὔτε mengoordinasikan tindakan kedua dengan penyangkalan sebelumnya. Dalam konteks gulungan yang tertutup, βλέπειν αὐτό kemungkinan menunjuk pada melihat apa yang ada di dalamnya; terjemahan ini alami tetapi alternatif harfiahnya tetap dicatat.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan Yohanes menangis.
theological_decisions:
- issue: Makna ἄξιος dalam ruang takhta surgawi
  choice: layak
  alternative: cakap; memenuhi syarat
  rationale: Konteksnya menyangkut kelayakan untuk menjalankan maksud ilahi, bukan hanya kecakapan prosedural. “Layak” mempertahankan bobot tersebut tanpa memperluas teks.
- issue: Bentuk βιβλίον dalam Wahyu 5
  choice: gulungan
  alternative: kitab; buku
  rationale: Gambaran benda bermeterai yang dibuka dalam konteks dunia kuno paling sesuai dengan gulungan naskah, tetapi istilah Yunani sendiri dapat dipakai lebih luas.
- issue: Cakupan βλέπειν αὐτό
  choice: melihat isinya
  alternative: melihatnya
  rationale: Konteks mendukung pengertian melihat isi gulungan, tetapi verba Yunani secara leksikal juga dapat berarti sekadar melihat objek itu; karena itu ambiguitas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Menangis tersedu-sedu” dipilih untuk menyampaikan tindakan yang berlangsung dan intensitas πολύ secara idiomatis. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
