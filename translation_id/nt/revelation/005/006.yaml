id: REV.5.6
reference: Revelation 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: id
  text: Lalu aku melihat, di tengah-tengah takhta dan keempat makhluk hidup, dan di tengah-tengah para penatua, seekor Anak Domba berdiri seperti telah disembelih[a]. Anak Domba itu memiliki tujuh tanduk dan tujuh mata, yaitu ketujuh Roh Allah[b] yang telah diutus ke seluruh bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “seperti disembelih”; atau “seolah-olah telah dibantai.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “ketujuh Roh Allah” dipertahankan sebagaimana tertulis; sebagian orang memahaminya sebagai cara simbolis untuk menyebut Roh Kudus dalam kepenuhan tujuh rangkap.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: di tengah-tengah ... dan di tengah-tengah
  rationale: Mempertahankan pengulangan ungkapan ruang dalam bahasa Yunani dan susunan berlapis dalam penglihatan itu, tanpa meratakannya menjadi satu lokasi.
- source_word: ζῴων
  choice: makhluk hidup
  rationale: Dalam konteks ruang takhta di Wahyu, istilah ini menunjuk kepada makhluk surgawi, bukan binatang biasa.
- source_word: πρεσβυτέρων
  choice: para tua-tua
  rationale: Istilah ini berfungsi sebagai sebutan bagi kelompok surgawi yang dikenal dalam penglihatan Wahyu. Bentuk ini lazim, jelas, dan membedakannya dari sekadar orang yang lanjut usia.
- source_word: ἀρνίον
  choice: Anak Domba
  rationale: Mempertahankan gambaran kurban dan mesianik yang sentral. Huruf kapital menandai pemakaiannya sebagai sebutan tokoh dalam penglihatan, tanpa menjelaskan simbol itu di dalam terjemahan.
- source_word: ἑστηκὸς
  choice: berdiri
  rationale: Partisip perfek menggambarkan Anak Domba dalam keadaan berdiri; bentuk sederhana ini alami dalam bahasa Indonesia dan mempertahankan hidupnya adegan.
- source_word: ὡς ἐσφαγμένον
  choice: seperti telah disembelih
  rationale: Kata ὡς menyatakan kemiripan atau penampakan, sedangkan partisip perfek pasif menunjukkan tindakan penyembelihan yang sudah terjadi dengan hasil yang masih tampak. Pilihan ini mempertahankan paradoks Anak Domba yang berdiri tetapi tampak telah disembelih.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: memiliki tujuh tanduk dan tujuh mata
  rationale: Mempertahankan kedua gambaran apokaliptik secara harfiah tanpa mengganti tanduk atau mata dengan penafsiran simbolis.
- source_word: οἵ εἰσιν
  choice: yaitu
  rationale: Dalam susunan bahasa Indonesia, 'yaitu' secara alami menyatakan bahwa tujuh mata itu diidentifikasikan dengan ketujuh Roh Allah. Anteseden dibuat eksplisit agar kaitan gramatikal tidak kabur.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ketujuh Roh Allah
  rationale: Mempertahankan bentuk ungkapan Yunani yang diperdebatkan dan tidak memparafrasakannya sebagai satu Roh dalam kepenuhan tujuh rangkap. Huruf kapital mengikuti fungsi ungkapan sebagai sebutan ilahi dalam konteks ini.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: yang telah diutus ke seluruh bumi
  rationale: Bentuk pasif dan jamak tetap terkait dengan 'ketujuh Roh Allah'; 'telah diutus' menyampaikan tindakan pengutusan yang sudah terjadi.
theological_decisions:
- issue: Rujukan klausa 'yang adalah ketujuh Roh Allah'
  choice: Mengidentifikasikan tujuh mata Anak Domba dengan ketujuh Roh Allah.
  alternative: Klausa dapat dipahami secara lebih longgar sebagai merujuk bersama-sama kepada tanduk dan mata, meskipun secara gramatikal hal itu kurang mungkin.
  rationale: Anteseden terdekat dan paling koheren adalah 'tujuh mata', selaras dengan gambaran mata dalam Zakharia. Terjemahan memperjelas kaitan ini tanpa menambahkan tafsiran simbolis.
- issue: Makna 'ketujuh Roh Allah'
  choice: Mempertahankan ungkapan 'ketujuh Roh Allah' sebagaimana bentuk teks sumber.
  alternative: Roh Allah yang berlipat tujuh; Roh Kudus dalam kepenuhan tujuh rangkap.
  rationale: Ungkapan ini sarat makna teologis dan diperdebatkan. Terjemahan tidak menyelesaikan ketegangan itu dengan mengubah bentuk jamaknya menjadi parafrasa doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'di tengah-tengah' sengaja dipertahankan demi struktur penglihatan. Kalimat kedua dimulai dengan 'Anak Domba itu' agar uraian panjang tetap mudah dipahami, sementara hubungan antargagasan Yunani tetap terjaga.
