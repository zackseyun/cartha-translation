id: REV.5.12
reference: Revelation 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: id
  text: Mereka berkata dengan suara nyaring, “Anak Domba yang telah disembelih[a] layak menerima kuasa, kekayaan[b], hikmat, kekuatan[c], hormat, kemuliaan, dan berkat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah dibunuh.” Kata Yunani yang dipakai menggambarkan pembunuhan dengan kekerasan dan juga cocok dengan gambaran penyembelihan seekor anak domba.
    reason: lexical_alternative
  - marker: b
    text: Atau “harta kekayaan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “keperkasaan.” “Kekuatan” di sini menerjemahkan kata Yunani yang berbeda dari kata yang diterjemahkan “kuasa” sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Mereka berkata
  rationale: Partisipel kini ini meneruskan tindakan kelompok surgawi pada ayat sebelumnya. Bentuk verbal lengkap lebih alami dalam bahasa Indonesia sambil mempertahankan kaitan naratifnya.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Ungkapan datif ini dipertahankan secara konkret dan idiomatis; “nyaring” cocok untuk seruan bersama dalam suasana penyembahan.
- source_word: Ἄξιόν ἐστιν
  choice: layak
  rationale: Predikat ini menyatakan kelayakan Anak Domba untuk menerima tujuh hal yang disebutkan. Susunan Indonesia yang alami menempatkannya sesudah subjek.
- source_word: τὸ ἀρνίον
  choice: Anak Domba
  rationale: Istilah ini merupakan gelar kristologis khas kitab Wahyu; huruf kapital menandai pemakaiannya sebagai gelar dalam konteks.
- source_word: τὸ ἐσφαγμένον
  choice: yang telah disembelih
  rationale: Partisipel perfek pasif σφάζω menunjuk pada tindakan pembunuhan yang akibatnya tetap relevan. “Disembelih” mempertahankan gambaran konkret dan kurban dari kata Yunani.
- source_word: λαβεῖν
  choice: menerima
  rationale: Dalam nyanyian pujian ini, infinitif tersebut menyatakan apa yang patut dianugerahkan atau diakui sebagai milik Anak Domba; “menerima” lebih sesuai daripada “mengambil”.
- source_word: δύναμιν
  choice: kuasa
  rationale: Padanan baku yang mencakup kemampuan dan kekuasaan, serta dapat dibedakan dari ἰσχύς.
- source_word: πλοῦτον
  choice: kekayaan
  rationale: Padanan Indonesia modern dan langsung untuk kelimpahan harta atau sumber daya.
- source_word: σοφίαν
  choice: hikmat
  rationale: Padanan biblis yang tetap umum dipahami dan tepat dalam daftar pujian ini.
- source_word: ἰσχὺν
  choice: kekuatan
  rationale: Menyatakan daya atau kekuatan dan tetap membedakannya secara wajar dari δύναμις, yang diterjemahkan “kuasa”.
- source_word: τιμὴν
  choice: hormat
  rationale: Dalam rangkaian pemberian pujian, nomina “hormat” secara alami menyatakan penghargaan yang diberikan kepada Anak Domba.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Padanan baku untuk δόξα dalam konteks penyembahan.
- source_word: εὐλογίαν
  choice: puji-pujian
  rationale: Dalam rangkaian doksologis ini, εὐλογία menunjuk pada ucapan berkat atau pujian yang ditujukan kepada Anak Domba. “Puji-pujian” menyampaikan fungsi tutur tersebut secara alami.
theological_decisions:
- issue: Gelar kristologis dan kapitalisasi
  choice: Anak Domba
  alternative: anak domba
  rationale: Dalam konteks Wahyu, ἀρνίον berfungsi sebagai gelar bagi Yesus yang ditinggikan namun telah dibunuh. Kapitalisasi menandai fungsi gelar tanpa menambahkan penafsiran doktrinal.
- issue: Bahasa kematian kurban
  choice: yang telah disembelih
  alternative: yang telah dibunuh
  rationale: “Disembelih” mempertahankan kekuatan gambar σφάζω serta hubungan metaforis dengan Anak Domba, tanpa merinci mekanisme teologis kematian-Nya.
- issue: Makna εὐλογία dalam doksologi
  choice: puji-pujian
  alternative: berkat
  rationale: Karena daftar ini menyebut hal-hal yang diterima Anak Domba dari para penyembah, “puji-pujian” lebih jelas mengungkapkan berkat yang diucapkan kepada-Nya. “Berkat” tetap mungkin, tetapi dalam bahasa Indonesia dapat disalahpahami sebagai berkat yang Anak Domba terima untuk dinikmati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk doksologis dan rangkaian tujuh unsur dalam teks Yunani. Tanda koma sebelum “dan” dipakai untuk memperjelas unsur terakhir dalam daftar panjang.
