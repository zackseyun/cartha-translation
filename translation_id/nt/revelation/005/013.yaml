    rationale: ἐπὶ τῆς γῆς dalam konteks ini paling wajar diterjemahkan “di bumi”; bentuk itu juga sejajar secara alami dengan “di bawah bumi.”
  - severity: low
    issue: Frasa “segala sesuatu yang ada di dalam semuanya itu” terdengar janggal dan dapat memberi kesan bahwa sesuatu harus berada dalam setiap ranah secara bersamaan.
    rationale: αὐτοῖς adalah rujukan kolektif kepada langit, bumi, bawah bumi, dan laut. “Segala sesuatu yang ada di dalamnya” menyampaikan rujukan kolektif tersebut secara lebih alami.
