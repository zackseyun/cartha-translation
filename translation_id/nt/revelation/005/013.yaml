id: REV.5.13
reference: Revelation 5:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: id
  text: Lalu aku mendengar setiap makhluk[a] yang ada di surga, di bumi, di bawah bumi, dan di laut, serta segala sesuatu yang ada di dalamnya, berkata, “Bagi Dia yang duduk di atas takhta dan bagi Anak Domba, pujian, hormat, kemuliaan, dan kekuasaan sampai selama-lamanya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap yang diciptakan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai zaman segala zaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: setiap makhluk
  rationale: κτίσμα berarti sesuatu atau makhluk yang diciptakan. Dalam adegan ini mereka menyuarakan pujian, sehingga “setiap makhluk” paling alami sekaligus mempertahankan daya distributif πᾶν.
- source_word: ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς θαλάσσης, καὶ τὰ ἐν αὐτοῖς πάντα
  choice: yang ada di surga, di atas bumi, di bawah bumi, dan di laut, serta segala sesuatu yang ada di dalam semuanya itu
  rationale: Rangkaian wilayah ini menyatakan keseluruhan kosmos. “Di laut” merupakan ungkapan Indonesia yang alami untuk ἐπὶ τῆς θαλάσσης, sedangkan “semuanya itu” mempertahankan rujukan kolektif αὐτοῖς.
- source_word: ἤκουσα λέγοντας
  choice: aku mendengar ... berkata
  rationale: Partisipel jamak λέγοντας secara makna merujuk kepada kumpulan makhluk. Susunan ini alami dalam bahasa Indonesia dan tidak perlu menambahkan objek yang tidak dinyatakan secara terpisah dalam bahasa Yunani.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Bagi Dia yang duduk di atas takhta
  rationale: Partisipel berartikel diterjemahkan sebagai frasa substantival. “Dia yang duduk” mempertahankan aspek kini dan bernada hormat tanpa menjadi arkais.
- source_word: τῷ ἀρνίῳ
  choice: Anak Domba
  rationale: ἀρνίον merupakan gelar kristologis khas kitab Wahyu; “Anak Domba” mempertahankan citra korban dan kemuliaan-Nya.
- source_word: ἡ εὐλογία
  choice: pujian
  rationale: Dalam aklamasi doksologis ini εὐλογία menunjuk pada berkat atau pujian yang diucapkan. “Pujian” lebih alami sebagai sesuatu yang dipersembahkan kepada Allah dalam bahasa Indonesia, sementara nuansa alternatif dicatat.
- source_word: ἡ τιμή
  choice: hormat
  rationale: “Hormat” menyampaikan penghargaan yang diberikan dalam konteks doksologis dengan bahasa Indonesia yang ringkas dan lazim.
- source_word: ἡ δόξα
  choice: kemuliaan
  rationale: “Kemuliaan” adalah padanan yang mapan dan tepat bagi δόξα dalam konteks penyembahan.
- source_word: τὸ κράτος
  choice: kekuasaan
  rationale: κράτος menekankan kekuatan yang nyata atau kuasa memerintah. “Kekuasaan” cocok dengan latar kerajaan dan takhta serta lebih spesifik daripada “kekuatan”.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: sampai selama-lamanya
  rationale: Ungkapan Yunani ini menyatakan jangka waktu tanpa akhir. “Sampai selama-lamanya” adalah padanan Indonesia yang jelas dan alami; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Doksologi bersama yang ditujukan kepada Allah dan Anak Domba
  choice: 'Mempertahankan satu aklamasi yang ditujukan bersama-sama: “Bagi Dia yang duduk di atas takhta dan bagi Anak Domba ...”'
  alternative: Mengulangi verba atau rumusan pemberian bagi masing-masing pihak
  rationale: Teks Yunani menyajikan satu rangkaian pujian kepada kedua pihak tanpa penjelasan tambahan. Terjemahan mempertahankan kesejajaran dan ketegangan kristologis teks tanpa menambahkan rumusan doktrinal.
- issue: Rujukan κτίσμα dalam adegan pujian kosmis
  choice: setiap makhluk
  alternative: seluruh ciptaan; setiap yang diciptakan
  rationale: Adegan menggambarkan penghuni semua wilayah yang terdengar mengucapkan pujian. “Setiap makhluk” mempertahankan sifat personal dan bersuara sekaligus cakupan universalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung dan liturgis, tetapi tetap mudah dipahami. Kapitalisasi “Dia” dan “Anak Domba” menandai rujukan personal yang jelas tanpa menambahkan penafsiran. Semua penanda catatan kaki ditempatkan langsung pada frasa yang diterangkannya.
