  source_fidelity: Terjemahan secara umum mengikuti struktur dan cakupan kosmis teks Yunani dengan baik. Namun, frasa “di dalam semuanya itu” kurang tepat mengungkapkan αὐτοῖς, yang merujuk secara kolektif kepada ranah-ranah yang disebutkan; “di dalamnya” lebih langsung dan alami. “Di bumi” juga merupakan padanan idiomatis yang lebih tepat untuk ἐπὶ τῆς γῆς dalam rangkaian kosmis ini.
  naturalness: Nada doksologisnya baik dan mudah dipahami. Penggantian “di atas bumi” menjadi “di bumi” serta “di dalam semuanya itu” menjadi “di dalamnya” membuat kalimat lebih baku dan lancar tanpa mengurangi cakupan maknanya.
  terminology: “Anak Domba,” “takhta,” “hormat,” “kemuliaan,” dan “kekuasaan” sudah tepat. “Pujian” dapat diterima untuk εὐλογία dalam aklamasi ibadah ini. Catatan alternatif untuk πᾶν κτίσμα dan idiom duratif tetap relevan.
  issues:
