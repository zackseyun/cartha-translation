id: REV.5.9
reference: Revelation 5:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: id
  text: "Dan mereka menyanyikan suatu nyanyian baru sambil berkata,\n\n“Engkau layak mengambil gulungan kitab itu\n dan membuka meterai-meterainya,\nsebab Engkau telah disembelih,\ndan dengan darah-Mu Engkau telah membeli orang-orang bagi Allah[a]\ndari setiap suku, bahasa, kaum, dan bangsa.[b]”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “orang-orang” tidak tertulis secara tersurat dalam teks Yunani, tetapi dipahami sebagai objek kata “membeli” dari konteks.
    reason: textual_clarity
  - marker: b
    text: Ungkapan empat unsur—“setiap suku, bahasa, kaum, dan bangsa”—menekankan cakupan seluruh dunia dari orang-orang yang dibeli.
    reason: cultural_note
lexical_decisions:
- source_word: ᾄδουσιν
  choice: mereka menyanyikan
  rationale: Bentuk kini dalam narasi dipertahankan sebagai kini yang hidup; verba ini tidak dengan sendirinya menambahkan gagasan ‘memuji’.
- source_word: ᾠδὴν καινὴν
  choice: suatu nyanyian baru
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan motif alkitabiah tentang nyanyian baru.
- source_word: Ἄξιος εἶ
  choice: Engkau layak
  rationale: Sapaan langsung yang wajar dan bermartabat; huruf kapital menandai sapaan kepada Anak Domba tanpa mengubah makna leksikal.
- source_word: τὸ βιβλίον
  choice: gulungan kitab itu
  rationale: Dalam adegan ini benda tersebut adalah dokumen tertulis kuno yang digulung dan dimeteraikan; ‘gulungan kitab’ lebih konkret daripada sekadar ‘kitab’.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: membuka meterai-meterainya
  rationale: Mengikuti ungkapan Yunani secara dekat tanpa menggantinya dengan tafsiran ‘mematahkan meterai’.
- source_word: ἐσφάγης
  choice: Engkau telah disembelih
  rationale: ‘Disembelih’ mempertahankan kekerasan tindakan sekaligus nuansa korban yang terkait dengan sosok Anak Domba; ‘dibunuh’ akan lebih datar.
- source_word: ἠγόρασας
  choice: telah membeli
  rationale: Mempertahankan arti dasar komersial verba tersebut; ‘menebus’ mungkin sesuai secara teologis, tetapi lebih interpretatif.
- source_word: τῷ θεῷ
  choice: bagi Allah
  rationale: Dativus ini paling alami menyatakan pihak yang bagi-Nya orang-orang itu dibeli; pilihan ini juga mempertahankan gagasan bahwa mereka menjadi milik Allah.
- source_word: ἐν τῷ αἵματί σου
  choice: dengan darah-Mu
  rationale: ‘Dengan’ menyatakan sarana secara alami dalam bahasa Indonesia dan tetap mempertahankan gambaran konkret tentang darah.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: dari setiap suku, bahasa, kaum, dan bangsa
  rationale: Susunan empat unsur dipertahankan. ‘Bahasa’ menerjemahkan γλῶσσα secara kontekstual, sedangkan ‘kaum’ membedakan λαός dari ‘bangsa’ untuk ἔθνος.
theological_decisions:
- issue: Objek verba ‘membeli’ tidak dinyatakan secara eksplisit dalam teks Yunani edisi SBLGNT
  choice: menambahkan ‘orang-orang’ secara tersurat dalam terjemahan, disertai catatan kaki
  alternative: 'membiarkan objek tersirat: ‘Engkau telah membeli bagi Allah dari setiap suku ...’'
  rationale: Bahasa Indonesia membutuhkan objek yang lebih jelas agar kalimat mudah dipahami. Konteks menunjukkan bahwa yang dibeli adalah manusia, tetapi catatan kaki menjaga keterbukaan pembaca terhadap bentuk Yunani yang eliptis.
- issue: Bahasa pendamaian dalam frasa ‘dengan darah-Mu’
  choice: mempertahankan gambaran darah sebagai sarana pembelian tanpa mengembangkannya menjadi rumusan doktrinal
  alternative: memarafrasakan sebagai ‘melalui kematian-Mu’
  rationale: Teks secara eksplisit menyebut darah Anak Domba. Terjemahan tidak meratakan gambaran korban itu menjadi pernyataan umum tentang kematian.
- issue: Hubungan dativus τῷ θεῷ dengan tindakan membeli
  choice: ‘membeli orang-orang bagi Allah’
  alternative: ‘membeli orang-orang untuk Allah’ atau ‘membeli orang-orang kepada Allah’
  rationale: ‘Bagi Allah’ alami dalam bahasa Indonesia dan menjaga bahwa Allah adalah pihak yang menerima atau memperoleh mereka, tanpa menetapkan penjelasan teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk puitis ditata dalam baris-baris untuk mencerminkan nyanyian. Pilihan ‘gulungan kitab’, ‘meterai’, dan ‘disembelih’ mempertahankan citra dunia kuno dan korban tanpa menjadi usang atau denominatif.
