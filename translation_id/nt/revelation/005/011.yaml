  to: Lalu aku melihat[a] dan mendengar suara banyak malaikat di sekeliling takhta serta makhluk-makhluk hidup dan para tua-tua. Jumlah malaikat-malaikat itu adalah puluhan ribu kali puluhan ribu dan ribuan kali ribuan[b].
