id: REV.5.11
reference: Revelation 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: id
  text: Lalu aku melihat[a] dan mendengar suara banyak malaikat di sekeliling takhta serta makhluk-makhluk hidup dan para tua-tua. Jumlah malaikat-malaikat itu adalah puluhan ribu kali puluhan ribu dan ribuan kali ribuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku memandang.”
    reason: lexical_alternative
  - marker: b
    text: Yunani, “berlaksa-laksa dan beribu-ribu”; secara harfiah, “puluhan ribu kali puluhan ribu dan ribuan kali ribuan.” Ungkapan ini menyatakan jumlah yang amat besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: aku melihat
  rationale: Padanan langsung dan alami untuk verba penglihatan dalam rangkaian penglihatan Yohanes; konteks menunjukkan bahwa ia mengarahkan perhatian lalu mendengar. Alternatif 'aku memandang' dicatat karena dapat lebih menonjolkan peralihan perhatian.
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Padanan naratif baku bagi bentuk aoris ἀκούω.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: suara banyak malaikat
  rationale: Genitif menerangkan sumber suara. Bentuk tunggal kolektif 'suara' dipertahankan tanpa memaksakan apakah yang terdengar merupakan satu suara terpadu atau bunyi bersama.
- source_word: κύκλῳ
  choice: di sekeliling
  rationale: Menyatakan posisi mengitari takhta secara jelas dan alami dalam bahasa Indonesia.
- source_word: θρόνου
  choice: takhta
  rationale: Padanan baku dalam konteks ruang takhta surgawi kitab Wahyu.
- source_word: ζῴων
  choice: makhluk-makhluk hidup
  rationale: Mempertahankan identitas khas empat sosok dalam penglihatan Wahyu dan tidak mereduksinya menjadi hewan biasa.
- source_word: πρεσβυτέρων
  choice: para tua-tua
  rationale: Padanan Alkitabiah yang tetap mudah dipahami bagi kelompok πρεσβύτεροι dalam adegan takhta; bentuk 'para' menandai jamak.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: Jumlah mereka
  rationale: Susunan Indonesia yang alami sambil mempertahankan pernyataan eksplisit mengenai jumlah.
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: berlaksa-laksa dan beribu-ribu
  rationale: Menghasilkan ungkapan Indonesia yang wajar untuk jumlah sangat besar, sambil mempertahankan pola berulang dan tidak mengubahnya menjadi 'tak terhitung', yang lebih interpretatif.
theological_decisions:
- issue: Penyebutan makhluk ruang takhta (ζῷα)
  choice: makhluk-makhluk hidup
  alternative: makhluk-makhluk; makhluk-makhluk bernyawa
  rationale: Pilihan ini menjaga istilah khas bagi keempat sosok dalam Wahyu tanpa menyamakan mereka dengan hewan biasa atau menentukan hakikat mereka lebih jauh.
- issue: Besarnya rombongan malaikat
  choice: berlaksa-laksa dan beribu-ribu
  alternative: puluhan ribu kali puluhan ribu dan ribuan kali ribuan
  rationale: Ungkapan sumber dapat dibaca sebagai angka berlipat yang sangat besar atau ungkapan idiomatis bagi himpunan yang amat besar. Teks utama mempertahankan gaya numerik puitis tanpa menyatakannya sebagai jumlah yang secara mutlak tidak terhitung; bentuk lebih harfiah diberikan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Lalu' menghubungkan urutan penglihatan secara alami. 'Berlaksa-laksa' dipilih untuk menjaga citra numerik dan repetisi sumber; maknanya dijelaskan dalam catatan. Tanda baca memecah kalimat Yunani yang panjang menjadi dua kalimat Indonesia demi keterbacaan tanpa mengubah hubungan makna.
