  register: Bahasa Indonesia baku, modern, dan hangat, sesuai dengan nada surat pribadi. Bentuk terikat “kutuliskan” mempertahankan orang pertama tunggal dengan ringkas; “pena buluh” dipilih untuk menjaga ketepatan historis-leksikal.
