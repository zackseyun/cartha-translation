base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: id
  text: Aku mempunyai banyak hal untuk kutuliskan kepadamu, tetapi aku tidak mau menulis kepadamu dengan tinta dan pena buluh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ
  choice: banyak hal
  rationale: Adjektiva netral jamak yang digunakan secara substantival; “banyak hal” alami dalam bahasa Indonesia dan mempertahankan makna jamaknya.
- source_word: εἶχον γράψαι σοι
  choice: yang ingin kutuliskan kepadamu
  rationale: Ungkapan Yunani secara harfiah berarti “aku mempunyai banyak hal untuk ditulis kepadamu.” Dalam konteks surat, bentuk Indonesia ini menyampaikan maksud menulis yang belum terlaksana secara alami tanpa mengubah isi pokoknya.
- source_word: ἀλλ’ οὐ θέλω
  choice: tetapi aku tidak mau
  rationale: θέλω menyatakan kehendak atau keinginan; “tidak mau” jelas, modern, dan sesuai dengan nada pribadi surat ini.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: dengan tinta dan pena buluh
  rationale: διά dengan genitif menyatakan sarana; μέλαν berarti tinta dan κάλαμος secara harfiah adalah buluh yang digunakan sebagai pena. “Pena buluh” mempertahankan gambaran konkret sumber tanpa menjadi sulit dipahami.
- source_word: σοι γράφειν
  choice: menulis kepadamu
  rationale: Dativa σοι menunjukkan penerima, sedangkan infinitif kini γράφειν menyatakan kegiatan menulis; terjemahan ini alami dan tidak menafsirkan aspek secara berlebihan.
