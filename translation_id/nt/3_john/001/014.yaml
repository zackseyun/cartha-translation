  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: id
  text: Namun, saya berharap segera melihatmu, dan kita akan berbicara tatap muka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut dengan mulut.” Ungkapan ini berarti berbicara secara pribadi, yaitu tatap muka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: saya berharap
  rationale: Bentuk kini menyatakan harapan pribadi penulis; ungkapan ini alami dalam penutup surat dan tidak mengubahnya menjadi kepastian.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan kontras ringan terhadap pernyataan sebelumnya tentang menulis.
- source_word: εὐθέως
  choice: segera
  rationale: Dalam konteks rencana pertemuan, kata ini menunjukkan waktu yang dekat, bukan tindakan seketika.
- source_word: σε ἰδεῖν
  choice: bertemu denganmu
  rationale: Secara harfiah berarti 'melihatmu', tetapi dalam konteks kehadiran pribadi, 'bertemu denganmu' lebih alami dalam bahasa Indonesia tanpa menambahkan gagasan kunjungan secara eksplisit.
- source_word: στόμα πρὸς στόμα
  choice: secara langsung
  rationale: Ungkapan harfiah 'mulut dengan mulut' menunjuk pada percakapan pribadi secara langsung. Pilihan ini alami dan menghindari kemungkinan salah paham dalam bahasa Indonesia.
- source_word: λαλήσομεν
  choice: kita akan berbicara
  rationale: Bentuk mendatang menyatakan percakapan yang diharapkan akan terjadi; 'berbicara' sesuai dengan ragam surat yang bermartabat dan tetap mudah dipahami.
