id: 3JN.1.10
reference: 3 John 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: id
  text: 'Karena itu, jika aku datang, aku akan mengemukakan perbuatan-perbuatan yang dilakukannya: ia mengoceh tentang kami dengan kata-kata jahat. Belum puas dengan semua itu, ia sendiri tidak menyambut saudara-saudara seiman[a], bahkan menghalangi orang-orang yang ingin menyambut mereka dan mengusir orang-orang itu dari jemaat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud kemungkinan adalah saudara-saudara seiman yang bepergian sebagai utusan atau pelayan Kristus. Kata Yunaninya juga dapat diterjemahkan “menerima,” khususnya dalam arti menerima dengan keramahtamahan atau memberi tumpangan.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, objek kata “mengusir” tidak disebutkan secara eksplisit. Kemungkinan besar yang dimaksud adalah orang-orang yang ingin menyambut saudara-saudara seiman itu.
    reason: ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Mempertahankan hubungan sebab-akibat dengan konteks sebelumnya dalam ungkapan Indonesia yang alami.
- source_word: ἐὰν ἔλθω
  choice: jika aku datang
  rationale: Mencerminkan syarat yang terbuka dan sudut pandang penulis surat.
- source_word: ὑπομνήσω
  choice: aku akan mengungkapkan
  rationale: Dalam konteks pertanggungjawaban, verba ini berarti membawa perbuatannya ke perhatian orang lain, bukan sekadar mengingatkan secara pribadi.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: perbuatan-perbuatan yang dilakukannya
  rationale: Mempertahankan bentuk jamak konkret dan aspek tindakan yang sedang berlangsung.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: ia mengoceh tentang kami dengan kata-kata jahat
  rationale: “Mengoceh” menyampaikan tuturan kosong atau tidak masuk akal; “kata-kata jahat” mempertahankan penilaian moral πονηροῖς tanpa menggandakan unsur kebencian.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: Belum puas dengan semua itu
  rationale: Ungkapan Indonesia yang wajar untuk menunjukkan bahwa pelanggarannya tidak berhenti pada fitnah verbal.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: ia sendiri tidak menyambut saudara-saudara seiman
  rationale: ἐπιδέχομαι dalam konteks ini menunjuk penerimaan yang ramah, kemungkinan termasuk pemberian tumpangan; “saudara-saudara seiman” memperjelas relasi Kristen.
- source_word: τοὺς βουλομένους κωλύει
  choice: menghalangi orang-orang yang ingin menyambut mereka
  rationale: Objek tindakan yang diinginkan tersirat dari klausa sebelumnya dan dinyatakan agar jelas dalam bahasa Indonesia.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: mengusir orang-orang itu dari jemaat
  rationale: Menyampaikan tindakan pengucilan yang keras; “jemaat” menunjuk persekutuan Kristen setempat, bukan gedung.
theological_decisions:
- issue: Cakupan τοὺς ἀδελφούς dalam konteks keramahtamahan gerejawi
  choice: saudara-saudara seiman
  alternative: saudara-saudari seiman; orang-orang percaya
  rationale: Bentuk Yunani maskulin dan konteks utusan Kristen keliling mendukung rujukan kepada para saudara laki-laki, tetapi bahasa Indonesia tidak menandai gender pada “saudara”; catatan kaki menjaga kemungkinan kontekstual tersebut tanpa memperluasnya secara diam-diam.
- issue: Makna ἐκκλησία
  choice: jemaat
  alternative: gereja
  rationale: Konteksnya adalah pengusiran dari komunitas Kristen setempat. “Jemaat” menghindari kesan bahwa yang dimaksud terutama gedung atau lembaga denominasi.
- issue: Objek tersirat dalam ἐκβάλλει
  choice: orang-orang itu
  alternative: mereka
  rationale: Anteseden yang paling dekat dan masuk akal ialah orang-orang yang ingin menyambut para saudara, tetapi bentuk Yunani tidak menyatakan objek secara eksplisit; terjemahan memperjelasnya sambil memberi catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. “Mengoceh” dipilih untuk daya cela φλυαρέω tanpa memakai istilah kuno; “jemaat” dipakai untuk komunitas lokal. Tanda titik dua dan pemisahan kalimat menjaga rangkaian tuduhan tetap mudah dipahami.
