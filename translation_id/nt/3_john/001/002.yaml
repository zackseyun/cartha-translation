  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: id
  text: Yang terkasih, aku berdoa agar dalam segala hal engkau sejahtera dan sehat, sebagaimana jiwamu sejahtera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Saudaraku yang terkasih
  rationale: Sapaan tunggal ini menyatakan kasih yang erat. Bentuk ini alami dan bermartabat dalam bahasa Indonesia serta tidak menambahkan nama atau jabatan penerima.
- source_word: περὶ πάντων
  choice: dalam segala hal
  rationale: Frasa ini paling wajar menyatakan cakupan doa, bukan urutan prioritas seperti 'terutama' atau 'di atas segala-galanya'.
- source_word: εὔχομαί
  choice: aku berdoa semoga
  rationale: εὔχομαι dalam konteks surat mengandung nuansa doa sekaligus harapan; ungkapan ini mempertahankan keduanya secara alami.
- source_word: σε εὐοδοῦσθαι
  choice: keadaanmu baik
  rationale: Bentuk εὐοδόομαι secara kiasan berarti mengalami keadaan yang baik atau berjalan baik. Pilihan ini lebih natural dalam bahasa Indonesia dan menghindari kesan sempit bahwa yang dimaksud hanya kemakmuran materi.
- source_word: ὑγιαίνειν
  choice: tubuhmu sehat
  rationale: Kata kerja ini menunjuk pada kesehatan. Penambahan 'tubuhmu' memperjelas kontras kontekstual dengan jiwa tanpa mengubah isi pokok.
- source_word: καθὼς
  choice: sebagaimana
  rationale: Kata ini memperkenalkan perbandingan antara keadaan lahiriah penerima dan keadaan jiwanya.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: keadaan jiwamu baik
  rationale: Pilihan ini mempertahankan pengulangan makna εὐοδόομαι pada kedua bagian ayat dan menyampaikan bahwa jiwa penerima sedang berada dalam keadaan baik.
- source_word: ψυχή
  choice: jiwa
  rationale: '''Jiwa'' adalah padanan baku yang mempertahankan dimensi batin dalam konteks ini tanpa menetapkan antropologi teknis tertentu.'
theological_decisions:
- issue: Makna περὶ πάντων dalam doa pembuka
  choice: dalam segala hal
  alternative: terutama; di atas segala-galanya
  rationale: Bahasa Yunani lebih alami menyatakan cakupan keadaan baik yang didoakan daripada menyatakan bahwa doa ini memiliki prioritas tertinggi.
- issue: Cakupan εὐοδοῦσθαι
  choice: keadaanmu baik
  alternative: engkau makmur; engkau berhasil
  rationale: Padanan ini mempertahankan pengertian umum bahwa segala sesuatu berjalan baik bagi penerima dan tidak membatasi ungkapan itu pada kekayaan atau keberhasilan material.
- issue: Makna ψυχή
  choice: jiwa
  alternative: diri batin; hidup
  rationale: Konteks membandingkan kesehatan dan keadaan umum penerima dengan keadaan ψυχή-nya. 'Jiwa' menjaga perbedaan tersebut tanpa memaksakan definisi doktrinal yang lebih rinci.
translation_notes:
  register: Bahasa Indonesia modern, hangat, dan bermartabat. Sapaan 'Saudaraku yang terkasih' cocok untuk hubungan pastoral yang akrab. Susunan kalimat dibuat alami, sementara kesejajaran antara keadaan penerima dan keadaan jiwanya dipertahankan.
