  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: id
  text: 'Tidak ada sukacita yang lebih besar bagiku daripada ini: mendengar bahwa anak-anakku hidup dalam kebenaran.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Aku tidak mempunyai sukacita yang lebih besar daripada hal-hal ini.”
    reason: lexical_alternative
  - marker: b
    text: “Anak-anakku” kemungkinan besar berarti anak-anak rohani Yohanes, yaitu orang-orang percaya yang berada dalam asuhan rohaninya.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν ... χαράν
  choice: sukacita yang lebih besar
  rationale: Mempertahankan bentuk komparatif dan memakai ungkapan Indonesia yang alami untuk menyatakan tingkat sukacita.
- source_word: τούτων
  choice: daripada ini
  rationale: Genitif perbandingan ini secara harfiah berbentuk jamak, tetapi menunjuk pada hal yang dijelaskan oleh klausa berikutnya; bentuk tunggal idiomatis dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἵνα ἀκούω
  choice: mendengar bahwa
  rationale: ἵνα di sini memperkenalkan isi atau keadaan yang merupakan sukacita itu, bukan tujuan dalam arti sempit.
- source_word: τὰ ἐμὰ τέκνα
  choice: anak-anakku
  rationale: Mempertahankan metafora kekeluargaan tanpa menetapkan dalam teks utama apakah yang dimaksud anak kandung atau anak rohani.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Mempertahankan keluasan makna khas Yohanes, yang dapat mencakup kebenaran yang dipercayai sekaligus kehidupan yang dibentuk olehnya.
- source_word: περιπατοῦντα
  choice: hidup
  rationale: Metafora Yunani 'berjalan' menunjuk pada cara menjalani kehidupan. 'Hidup' menyampaikan makna idiomatis dengan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah τέκνα berarti anak kandung atau anak rohani
  choice: Memakai ungkapan harfiah 'anak-anakku' dalam teks utama.
  alternative: anak-anak rohaniku; orang-orang yang kubimbing dalam iman
  rationale: Konteks sangat mungkin menunjuk kepada orang percaya yang berada dalam asuhan rohani Yohanes, tetapi kata Yunani tetap mempertahankan metafora anak; penjelasan ditempatkan dalam catatan kaki.
- issue: Cakupan makna ἐν τῇ ἀληθείᾳ
  choice: dalam kebenaran
  alternative: dengan jujur; menurut ajaran yang benar
  rationale: Ungkapan Yohanes tidak perlu dibatasi hanya pada ketulusan etis atau ketepatan ajaran; terjemahan ini mempertahankan kedua dimensinya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat dibuat idiomatis, sementara ambiguitas mengenai 'anak-anak' dan keluasan makna 'kebenaran' dipertahankan.
