  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: id
  text: Karena itu, kita wajib menyambut orang-orang seperti itu[a], supaya kita menjadi rekan sekerja bagi kebenaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “menyambut” juga dapat mencakup menerima dengan ramah serta memberi dukungan material kepada para pekerja keliling tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersama kebenaran” atau “dalam kebenaran.” Bentuk dativus dalam bahasa Yunani dapat dipahami dengan beberapa cara; teks utama memahaminya sebagai bekerja demi perkara kebenaran.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: kita
  rationale: Pronomina eksplisit dipertahankan untuk menandai penekanan; bentuk inklusif cocok karena penulis mengikutsertakan dirinya bersama para pembaca dalam kewajiban ini.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari ayat sebelumnya dengan penghubung yang alami dan jelas dalam bahasa Indonesia modern.
- source_word: ὀφείλομεν
  choice: wajib
  rationale: Mengungkapkan kewajiban moral dengan kuat tanpa mengubah bentuknya menjadi perintah langsung.
- source_word: ὑπολαμβάνειν
  choice: menyambut
  rationale: Dalam konteks para pekerja keliling, kata ini menunjuk pada menerima mereka dengan keramahtamahan dan memberi dukungan; 'menyambut' alami dalam bahasa Indonesia, sedangkan cakupan dukungannya dijelaskan dalam catatan kaki.
- source_word: τοὺς τοιούτους
  choice: orang-orang seperti mereka
  rationale: Merujuk pada orang-orang sejenis dengan para pekerja yang disebut sebelumnya dan tidak menambahkan pembatasan gender yang tidak dinyatakan oleh frasa ini sendiri.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil yang dimaksud dengan lugas dalam bahasa Indonesia.
- source_word: συνεργοὶ
  choice: rekan sekerja
  rationale: Mempertahankan gagasan partisipasi bersama dalam suatu pekerjaan dan sesuai dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: γινώμεθα
  choice: kita menjadi
  rationale: Mempertahankan nuansa γίνομαι, yaitu bahwa melalui dukungan tersebut kita menjadi atau tampil sebagai rekan dalam pekerjaan itu.
- source_word: τῇ ἀληθείᾳ
  choice: bagi kebenaran
  rationale: 'Dativus dipahami sebagai kepentingan atau tujuan: bekerja demi perkara kebenaran. Ambiguitas gramatikalnya tetap dicatat karena frasa ini juga dapat dipahami sebagai ''bersama kebenaran'' atau ''dalam kebenaran''.'
theological_decisions:
- issue: Hubungan τῇ ἀληθείᾳ dengan συνεργοὶ
  choice: '''rekan sekerja bagi kebenaran,'' yakni ikut mendukung pekerjaan yang memajukan kebenaran'
  alternative: '''rekan sekerja bersama kebenaran'' atau ''rekan sekerja dalam kebenaran'''
  rationale: Konteks langsung membahas dukungan kepada orang-orang yang pergi demi Nama itu, sehingga arti tujuan atau kepentingan paling sesuai. Namun, dativus Yunani memungkinkan hubungan lain; karena itu alternatif tersebut tidak disingkirkan dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat nasihat yang hangat dan bermartabat. 'Kita' mempertahankan sifat inklusif subjek; 'wajib' menyampaikan kewajiban moral; penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
