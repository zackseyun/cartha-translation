  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: id
  text: Damai menyertaimu.[a] Para sahabat menyampaikan salam kepadamu. Sampaikan salam kepada para sahabat satu per satu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Damai bagimu.” Ini merupakan berkat singkat dalam penutup surat.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “menurut nama.” Ungkapan ini berarti memberi salam kepada masing-masing orang secara pribadi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Damai menyertaimu
  rationale: Ungkapan Yunani yang harfiah berarti ‘damai bagimu’ berfungsi sebagai berkat penutup surat. ‘Damai menyertaimu’ terdengar alami dan bermartabat dalam bahasa Indonesia sambil mempertahankan daya berkatnya.
- source_word: ἀσπάζονταί σε
  choice: menyampaikan salam kepadamu
  rationale: Dalam konteks surat, verba ini menyatakan penyampaian salam. Bentuk ini lebih wajar dalam bahasa Indonesia daripada ‘menyalamimu’ ketika para pemberi salam tidak hadir di hadapan penerima.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: sahabat-sahabat / setiap sahabat
  rationale: φίλοι berarti sahabat atau teman; ‘sahabat’ mempertahankan nuansa hubungan pribadi dan dibedakan dari istilah ‘saudara-saudara’ yang tidak terdapat dalam teks.
- source_word: κατ’ ὄνομα
  choice: dengan menyebut namanya
  rationale: Secara harfiah ‘menurut nama’; ungkapan ini menekankan salam pribadi kepada masing-masing orang. Rumusan Indonesia ini menjaga citra ‘nama’ sekaligus menjelaskan daya distributifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Bentuk tunggal ‘-mu’ dipertahankan karena semua pronomina Yunani dalam ayat ini berbentuk tunggal. Pengulangan ‘sahabat’ sengaja dipertahankan untuk mencerminkan φίλοι pada kedua klausa.
