  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: id
  text: Sebab aku sangat bersukacita ketika saudara-saudara datang dan memberi kesaksian tentang kebenaranmu[a], sebagaimana engkau hidup dalam kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tentang kesetiaanmu kepada kebenaran.”'
    reason: Mempertahankan kemungkinan bahwa frasa σου τῇ ἀληθείᾳ menunjuk pada kesetiaan Gayus kepada kebenaran, tanpa menggantikan terjemahan yang lebih dekat dengan ungkapan Yunani “kebenaranmu.”
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Sebab aku sangat bersukacita
  rationale: Menyampaikan hubungan penjelas γάρ, makna aktif bentuk deponen ἐχάρην, dan penegasan kuat λίαν dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἐρχομένων ἀδελφῶν
  choice: ketika saudara-saudara datang
  rationale: Konstruksi partisip genitif dipahami secara temporal. 'Saudara-saudara' mempertahankan bahasa kekeluargaan Kristen dan bentuk jamak maskulin teks Yunani.
- source_word: μαρτυρούντων σου τῇ ἀληθείᾳ
  choice: dan memberi kesaksian tentang kebenaranmu
  rationale: μαρτυρέω mempertahankan nuansa kesaksian. Frasa datif yang disertai σου secara harfiah menunjuk pada 'kebenaranmu'; bahasa utama mempertahankan ungkapan ringkas dan ambigu ini tanpa mengartikannya sebagai kebenaran pribadi yang terpisah.
- source_word: καθὼς
  choice: yaitu bahwa
  rationale: Dalam konteks ini klausa berikut menjelaskan isi atau dasar kesaksian mengenai 'kebenaranmu'. Pilihan ini lebih alami dalam bahasa Indonesia daripada perbandingan kaku, sambil tetap menghubungkan kesaksian dengan perilaku Gayus.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: engkau hidup dalam kebenaran
  rationale: Ungkapan Indonesia 'hidup dalam' menyampaikan metafora etis περιπατέω secara alami. Bentuk kini menunjukkan pola hidup yang sedang berlangsung.
theological_decisions:
- issue: Makna 'kebenaran' dalam konteks etis Yohanes
  choice: 'Memakai ''kebenaran'' pada kedua unsur gagasan: ''kebenaranmu'' dan ''hidup dalam kebenaran''.'
  alternative: kesetiaanmu kepada kebenaran; kebenaran yang ada di dalam dirimu
  rationale: Terjemahan ini mempertahankan keluasan makna ἀλήθεια—baik pengakuan iman maupun perilaku—tanpa membatasinya hanya pada ketulusan, ajaran, atau kesetiaan moral.
- issue: Hubungan καθὼς dengan kesaksian sebelumnya
  choice: 'Dipahami sebagai penjelasan yang menegaskan bagaimana ''kebenaranmu'' nyata: ''yaitu bahwa engkau hidup dalam kebenaran''.'
  alternative: sebagaimana engkau hidup dalam kebenaran
  rationale: καθὼς dapat menyatakan kesesuaian ('sebagaimana'), tetapi dalam alur kalimat ini dapat pula memperkenalkan fakta yang meneguhkan kesaksian. Catatan kaki mempertahankan pembacaan komparatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. Kata ganti 'engkau' dipakai sesuai sapaan tunggal dalam surat. Metafora 'berjalan' dialihkan menjadi ungkapan etis Indonesia yang alami, 'hidup dalam kebenaran'.
