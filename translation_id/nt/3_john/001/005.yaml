    rationale: Dalam konteks hospitalitas surat ini, ξένους menunjuk kepada orang yang asing atau belum dikenal oleh Gayus. Kemungkinan 'pendatang' dapat menggeser pembaca ke status geografis atau migrasi yang tidak dinyatakan teks.
