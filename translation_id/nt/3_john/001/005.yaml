  to: Yang terkasih, engkau bertindak dengan setia dalam segala sesuatu yang kaulakukan bagi saudara-saudara seiman, bahkan bagi mereka yang tidak kaukenal.[a]
  rationale: Revisi menghilangkan tambahan sapaan «Saudaraku» agar lebih dekat dengan Ἀγαπητέ dan memperjelas dalam catatan bahwa ξένους menerangkan saudara-saudara seiman yang menerima bantuan. Kalimat utama tetap mempertahankan pilihan idiomatis Indonesia «mereka yang tidak kaukenal», penegasan «bahkan», serta cakupan tak tentu «dalam segala sesuatu yang kaulakukan».
