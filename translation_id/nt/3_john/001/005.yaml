  terminology: «Saudara-saudara seiman» dapat dipakai untuk ἀδελφούς dalam konteks ini. «Orang-orang yang tidak kaukenal» dengan tepat menghindari arti kebangsaan untuk ξένοι. Catatan kaki perlu diselaraskan dengan teks revisi dan tidak perlu mengajukan «pendatang» sebagai kemungkinan utama, karena ξένος di sini berarti orang asing bagi tuan rumah, bukan terutama migran.
