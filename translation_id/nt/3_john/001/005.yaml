  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: id
  text: Yang terkasih, engkau bertindak dengan setia dalam segala sesuatu yang kaulakukan bagi saudara-saudara seiman, bahkan bagi mereka yang tidak kaukenal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan ini bagi orang-orang asing.” Kata Yunani yang diterjemahkan “mereka yang tidak kaukenal” menunjuk kepada orang-orang yang asing atau belum dikenal oleh Gayus; dalam konteks ini mereka adalah saudara-saudara seiman yang bepergian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Saudaraku yang terkasih
  rationale: Sapaan vokatif tunggal ini menyatakan kasih dan kedekatan. Bentuk ini alami dalam surat berbahasa Indonesia serta tidak menentukan jenis hubungan secara lebih sempit daripada konteks.
- source_word: πιστὸν ποιεῖς
  choice: engkau bertindak dengan setia
  rationale: Ungkapan harfiahnya, 'engkau melakukan sesuatu yang setia', secara idiomatis memuji kesetiaan atau sikap dapat dipercaya Gayus. 'Bertindak dengan setia' mempertahankan makna itu dalam bahasa Indonesia yang wajar.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: dalam segala sesuatu yang kaulakukan
  rationale: Pronomina relatif dengan ἐάν dan bentuk subjungtif memberi arti tak tentu, yaitu apa pun atau segala sesuatu yang dilakukan. Terjemahan ini juga mempertahankan cakupan luas ἐργάζομαι dalam konteks bantuan praktis.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: bagi saudara-saudara seiman
  rationale: εἰς di sini bersifat benefaktif. ἀδελφούς secara gramatikal berbentuk maskulin jamak, tetapi dalam konteks menunjuk kepada sesama orang percaya; 'seiman' menjernihkan arti kiasannya tanpa menyatakan bahwa kelompok itu hanya terdiri atas laki-laki.
- source_word: καὶ τοῦτο ξένους
  choice: bahkan bagi mereka yang tidak kaukenal
  rationale: Frasa eliptis ini menonjolkan bahwa penerima pertolongan itu adalah orang-orang asing bagi Gayus. 'Bahkan' menyampaikan daya penegasan καὶ τοῦτο, sedangkan 'yang tidak kaukenal' menghindari kesan bahwa ξένους pasti berarti warga asing.
- source_word: ξένους
  choice: mereka yang tidak kaukenal
  rationale: Dalam konteks keramahtamahan, ξένος menunjuk kepada orang yang sebelumnya tidak dikenal oleh tuan rumah, bukan terutama orang berkebangsaan asing.
theological_decisions:
- issue: Cakupan ἀδελφούς
  choice: saudara-saudara seiman
  alternative: saudara-saudara
  rationale: Konteks menunjuk kepada sesama orang percaya yang bepergian. Tambahan 'seiman' mencegah pembaca memahami hubungan biologis, tanpa menetapkan komposisi gender kelompok tersebut.
- issue: Hubungan ξένους dengan ἀδελφούς
  choice: mereka yang tidak kaukenal
  alternative: orang-orang asing
  rationale: Terjemahan ini memahami ξένους sebagai saudara-saudara seiman yang asing bagi Gayus, sesuai konteks ayat 7–8, tetapi catatan mempertahankan kemungkinan ungkapan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, hangat, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan tunggal dan nada surat pribadi; bentuk 'kaulakukan' dan 'kaukenal' mengikuti ejaan baku. Struktur kalimat dibuat alami tanpa menghilangkan penegasan pada pelayanan kepada orang-orang yang tidak dikenal.
