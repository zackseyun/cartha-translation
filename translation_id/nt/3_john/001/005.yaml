    rationale: Ἀγαπητέ berarti 'yang terkasih' sebagai sapaan. Walaupun penerima memang sesama orang percaya, unsur «Saudaraku» tidak tersurat dan tidak diperlukan untuk bahasa Indonesia yang alami.
  - severity: low
