id: 3JN.1.9
reference: 3 John 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: id
  text: Aku sudah menulis sesuatu kepada jemaat[a], tetapi Diotrefes, yang suka menjadi orang terkemuka di antara mereka, tidak menerima kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku sudah menulis suatu catatan singkat kepada jemaat.” Teks Yunani memakai ungkapan tak tentu (“menulis sesuatu”), dan beberapa naskah memperluas susunan katanya.
    reason: textual_variant
  - marker: b
    text: Atau “tidak menyambut kami” atau “tidak mengakui kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: Aku sudah menulis
  rationale: Aoristus menunjukkan tindakan menulis yang telah terjadi; bentuk ini alami dalam bahasa Indonesia dan tetap sesuai dengan konteks surat.
- source_word: τι
  choice: sesuatu
  rationale: Pronomina tak tentu netral ini paling langsung berarti 'sesuatu' dan tidak memasukkan objek yang tidak dinyatakan dalam teks SBLGNT.
- source_word: τῇ ἐκκλησίᾳ
  choice: kepada jemaat
  rationale: Dalam konteks ini ἐκκλησία menunjuk pada persekutuan orang percaya setempat; 'jemaat' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: ἀλλ’
  choice: tetapi
  rationale: Kata ini menyatakan pertentangan yang kuat antara tindakan penulis dan sikap Diotrefes.
- source_word: ὁ φιλοπρωτεύων
  choice: yang suka menjadi orang terkemuka
  rationale: Partisipel ini menggambarkan orang yang gemar menduduki tempat pertama atau paling utama. Ungkapan tersebut menyampaikan dorongan mencari keutamaan tanpa menyimpulkan jabatan resmi tertentu.
- source_word: αὐτῶν
  choice: di antara mereka
  rationale: Genitif ini menunjukkan kelompok tempat Diotrefes ingin menjadi terkemuka, tanpa menafsirkan secara berlebihan bahwa ia memiliki wewenang resmi atas mereka.
- source_word: Διοτρέφης
  choice: Diotrefes
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: tidak menerima kami
  rationale: ἐπιδέχομαι dapat mencakup menerima, menyambut, atau mengakui. 'Menerima' mempertahankan keluasan makna itu.
theological_decisions:
- issue: Cakupan penolakan Diotrefes
  choice: tidak menerima kami
  alternative: tidak menyambut kami; tidak mengakui kami
  rationale: Terjemahan tidak menentukan apakah masalah utamanya adalah keramahtamahan, penerimaan pribadi, atau pengakuan terhadap para utusan dan kewibawaan mereka. Keluasan dan ketegangan makna Yunani dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang pertama tunggal 'Aku' mengikuti gaya surat pribadi dan membedakannya dari bentuk jamak 'kami'. Susunan kalimat mempertahankan kontras teks Yunani serta menghindari penetapan jabatan gerejawi atau jenis penolakan yang tidak dinyatakan secara pasti.
