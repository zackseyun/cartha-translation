  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: id
  text: Mereka telah bersaksi di hadapan jemaat tentang kasihmu. Engkau akan berbuat baik jika menolong mereka melanjutkan perjalanan[a] dengan cara yang layak bagi Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberangkatkan mereka untuk melanjutkan perjalanan”; kata Yunani ini dapat mencakup pembekalan atau bantuan praktis bagi perjalanan selanjutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: telah bersaksi
  rationale: Aoristus menyatakan tindakan kesaksian yang telah terjadi; bentuk 'telah bersaksi' wajar dalam bahasa Indonesia dan mempertahankan relevansinya bagi nasihat dalam surat ini.
- source_word: σου τῇ ἀγάπῃ
  choice: tentang kasihmu
  rationale: Dativus menyatakan isi atau pokok kesaksian. 'Tentang kasihmu' jelas dan alami serta menunjuk pada kasih yang telah ditunjukkan Gayus.
- source_word: ἐνώπιον ἐκκλησίας
  choice: di hadapan jemaat
  rationale: Ungkapan ini menunjukkan kesaksian yang disampaikan dalam kehadiran komunitas Kristen yang berkumpul; 'jemaat' lebih tepat daripada istilah yang terutama menunjuk gedung atau lembaga.
- source_word: καλῶς ποιήσεις
  choice: Engkau akan berbuat baik jika
  rationale: Bentuk futurum memiliki daya nasihat yang halus. Susunan ini mempertahankan bentuk pernyataan sekaligus menyampaikan dorongan secara alami.
- source_word: προπέμψας
  choice: menolong mereka melanjutkan perjalanan
  rationale: Kata ini bukan sekadar menyuruh orang berangkat, tetapi dalam konteks keramahtamahan dapat mencakup pembekalan atau bantuan praktis bagi perjalanan selanjutnya.
- source_word: ἀξίως τοῦ θεοῦ
  choice: dengan cara yang layak bagi Allah
  rationale: ἀξίως menyatakan cara atau standar tindakan; terjemahan ini mempertahankan bobot teologis bahwa bantuan itu harus sesuai dengan kehormatan Allah.
theological_decisions:
- issue: Nuansa προπέμπω dalam keramahtamahan Kristen
  choice: menolong mereka melanjutkan perjalanan
  alternative: mengantar mereka dalam perjalanan; membekali mereka untuk perjalanan
  rationale: Kata Yunani ini sering menyiratkan pemberian bantuan yang diperlukan kepada para pelayan keliling, tanpa memastikan bentuk bantuan tertentu. Terjemahan utama menyampaikan unsur dukungan sambil membiarkan rinciannya terbuka.
- issue: Hubungan frasa ἀξίως τοῦ θεοῦ
  choice: bantuan diberikan dengan cara yang layak bagi Allah
  alternative: mereka diberangkatkan sebagai orang-orang yang layak bagi Allah
  rationale: Adverbia ἀξίως paling alami menerangkan tindakan menolong atau memberangkatkan mereka, sehingga standar tindakan Gayus adalah apa yang pantas bagi Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Pronomina 'Engkau' dipakai untuk sapaan tunggal sesuai konteks surat pribadi. 'Jemaat' dipilih bagi ἐκκλησία untuk menunjuk komunitas orang percaya yang berkumpul.
