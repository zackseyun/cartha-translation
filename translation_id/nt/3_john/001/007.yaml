base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: id
  text: Sebab demi Nama itu mereka telah berangkat tanpa menerima apa pun dari orang-orang bukan Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang tidak percaya” atau “orang-orang kafir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: demi
  rationale: Dengan objek genitif “Nama itu”, ὑπέρ menyatakan alasan atau tujuan. “Demi” menyampaikan motif pelayanan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: τοῦ ὀνόματος
  choice: Nama itu
  rationale: Ungkapan Yunani secara harfiah berarti “Nama itu” dan dipakai sebagai sebutan penuh hormat yang secara tersirat merujuk kepada Yesus/Tuhan. Bentuk ini mempertahankan ketidaktersuratan referennya tanpa menambahkan kata yang tidak terdapat dalam teks.
- source_word: ἐξῆλθον
  choice: mereka telah berangkat
  rationale: Kata kerja aoris ini menunjuk pada tindakan berangkat, kemungkinan untuk perjalanan pelayanan. “Berangkat” lebih alami daripada terjemahan harfiah “keluar” dalam konteks perjalanan tersebut.
- source_word: μηδὲν λαμβάνοντες
  choice: tanpa menerima apa pun
  rationale: Frasa partisipial ini menjelaskan cara mereka berangkat. Dalam konteks dukungan materi, “menerima” lebih jelas dan alami daripada “mengambil”, tanpa menentukan jenis bantuan yang tidak disebutkan teks.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: dari orang-orang bukan Yahudi
  rationale: ἐθνικοί menunjuk kepada orang dari bangsa-bangsa lain, dan dalam konteks ini kemungkinan juga menyiratkan mereka yang berada di luar komunitas iman Kristen. “Orang-orang bukan Yahudi” mempertahankan warna etnis-historis istilah itu; kemungkinan makna religiusnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Referen “Nama itu”
  choice: Sebutan penuh hormat yang secara tersirat merujuk kepada Yesus/Tuhan tetap dibiarkan implisit sebagai “Nama itu”.
  alternative: “nama Yesus”, “nama Kristus”, atau “nama-Nya”
  rationale: Teks sumber tidak menyebutkan referennya secara eksplisit. Mempertahankan “Nama itu” menjaga daya teologis ungkapan tersebut dan tidak menambahkan kekhususan yang tidak dinyatakan dalam ayat.
- issue: Makna ἐθνικῶν
  choice: “orang-orang bukan Yahudi” dalam teks utama
  alternative: “orang-orang yang tidak percaya” atau “orang-orang kafir”
  rationale: Pilihan utama mempertahankan kerangka etnis-historis Yunani, sedangkan konteks memungkinkan istilah itu berfungsi sebagai sebutan bagi pihak di luar iman Kristen. Ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. “Nama itu” mempertahankan ungkapan penghormatan dari sumber, sedangkan “berangkat” dan “tanpa menerima apa pun” memberikan kejelasan idiomatis bagi pembaca umum.
