  naturalness: Bahasa Indonesia baku, lugas, dan bernada pastoral. ‘Saudaraku yang terkasih’ adalah sapaan surat yang lazim dan hangat. Penempatan catatan kaki sebaiknya langsung pada pasangan partisipel yang dijelaskannya, bukan setelah ‘Allah’.
  terminology: ‘Allah’, ‘berasal dari Allah’, ‘berbuat baik’, dan ‘berbuat jahat’ tepat serta tidak memaksakan penafsiran doktrinal. Istilah ‘melihat Allah’ dipertahankan, bukan ditafsirkan menjadi ‘mengenal Allah’.
