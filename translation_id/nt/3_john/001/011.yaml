  rationale: Revisi mengganti ‘belum pernah melihat Allah’ dengan ‘tidak pernah melihat Allah’ agar perfek negatif Yunani tidak terdengar sebagai keadaan sementara yang masih dapat berubah. Penanda catatan kaki dipindahkan ke frasa yang menjadi pokok catatan. Selebihnya dipertahankan karena setia pada teks sumber dan wajar dalam bahasa Indonesia modern.
