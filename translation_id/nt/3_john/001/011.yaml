  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: id
  text: Saudaraku yang terkasih, janganlah meniru yang jahat, melainkan yang baik. Orang yang berbuat baik[a] berasal dari Allah; orang yang berbuat jahat tidak pernah melihat Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “orang yang berbuat baik” dan “orang yang berbuat jahat” juga dapat diterjemahkan “orang yang terus berbuat baik” dan “orang yang terus berbuat jahat”; bentuk partisipel Yunani dapat menekankan tindakan yang berkelanjutan atau perilaku yang menjadi ciri seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Saudaraku yang terkasih
  rationale: Sapaan tunggal yang hangat dan penuh kasih. Bentuk ini wajar dalam bahasa Indonesia serta mempertahankan nuansa relasional khas surat-surat Yohanes tanpa membatasi penerima berdasarkan gender.
- source_word: μὴ μιμοῦ
  choice: janganlah meniru
  rationale: Mempertahankan arti langsung verba μιμέομαι dan tekanan pada peneladanan perilaku.
- source_word: τὸ κακὸν ... τὸ ἀγαθόν
  choice: yang jahat ... yang baik
  rationale: Kedua adjektiva netral berartikel dipakai secara substantival dan menyatakan kategori moral umum; pasangan ini ringkas, alami, dan sejajar dalam bahasa Indonesia.
- source_word: ὁ ἀγαθοποιῶν
  choice: Orang yang berbuat baik
  rationale: Partisipel kini substantival menunjuk kepada orang yang dicirikan oleh perbuatan baik, sambil tetap mempertahankan bentuk verbalnya.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: berasal dari Allah
  rationale: Mempertahankan daya sumber atau asal dari ἐκ dalam ungkapan khas Yohanes, tanpa menjabarkannya menjadi rumusan doktrinal tertentu.
- source_word: ὁ κακοποιῶν
  choice: orang yang berbuat jahat
  rationale: Mencerminkan partisipel kini yang sejajar dengan ὁ ἀγαθοποιῶν dan dapat menyiratkan perilaku yang berlangsung atau menjadi ciri.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: belum pernah melihat Allah
  rationale: Perfek ἑώρακεν menyatakan keadaan kini sebagai hasil dari tidak adanya pengalaman melihat; 'belum pernah melihat' alami dalam bahasa Indonesia dan mempertahankan metafora teologis 'melihat', bukan menggantinya dengan 'mengenal'.
theological_decisions:
- issue: Hubungan perilaku moral dengan relasi kepada Allah dalam ungkapan khas Yohanes
  choice: 'Mempertahankan kategori teks sendiri: orang yang berbuat baik ''berasal dari Allah'', sedangkan orang yang berbuat jahat ''belum pernah melihat Allah''.'
  alternative: Menjelaskannya secara eksplisit sebagai kelahiran kembali, kesempurnaan moral, atau ketiadaan mutlak semua relasi sebelumnya dengan Allah.
  rationale: Teks memberikan diagnosis moral-rohani dengan bahasa khas Yohanes, tetapi tidak merumuskannya dalam kategori teologi sistematika yang lebih kemudian. Terjemahan mempertahankan ketegangan dan kerasnya peringatan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat, lugas, dan bermartabat. 'Saudaraku yang terkasih' dipilih sebagai sapaan pribadi yang alami; paralelisme moral dan istilah khas Yohanes dipertahankan.
