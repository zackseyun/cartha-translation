  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: id
  text: Dari penatua kepada Gayus yang terkasih, yang kukasihi dalam kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan sungguh-sungguh”; dapat juga berarti “di dalam kebenaran.” Frasa Yunani ini dapat menyatakan kasih yang tulus, kasih yang berlandaskan kebenaran Injil, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: penatua
  rationale: Sebagai sebutan diri pengirim dalam pembukaan surat, istilah ini paling wajar dipahami sebagai penanda kedudukan atau peran, bukan sekadar usia. 'Penatua' mempertahankan nuansa itu tanpa memakai istilah teknis yang kurang umum.
- source_word: Γαΐῳ
  choice: Gayus
  rationale: Bentuk ini mengikuti transliterasi nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: τῷ ἀγαπητῷ
  choice: yang terkasih
  rationale: Ungkapan ini menyampaikan sapaan penuh kasih dan tetap mempertahankan hubungan leksikal dengan kata kerja ἀγαπῶ yang muncul sesudahnya.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: yang kukasihi
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyampaikan bahwa Gayus adalah objek kasih pengirim. Unsur ἐγὼ tidak diberi penekanan tambahan karena bentuk 'ku-' sudah menyatakan subjek orang pertama, sementara konteks tidak menuntut penegasan eksplisit 'aku sendiri'.
- source_word: ἐν ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Terjemahan ini mempertahankan bentuk dan keluasan makna frasa Yunani, yang dapat menunjuk pada kasih yang sungguh-sungguh, kasih yang berlandaskan kebenaran Injil, atau keduanya.
theological_decisions:
- issue: Nuansa ἀλήθεια dalam frasa penutup
  choice: dalam kebenaran
  alternative: dengan sungguh-sungguh; di dalam Kebenaran
  rationale: Tulisan-tulisan Yohanes kerap memakai 'kebenaran' dengan kedalaman teologis, tetapi ayat ini tidak memastikan apakah yang terutama dimaksud adalah ketulusan, lingkungan atau dasar kebenaran Injil, atau keduanya. Terjemahan utama menjaga ketegangan itu dan catatan kaki menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam surat yang ringkas, hangat, dan bermartabat. Bentuk 'kukasihi' dipilih agar alami sekaligus mempertahankan pengulangan akar kata kasih. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskan.
