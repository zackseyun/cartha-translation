id: 3JN.1.12
reference: 3 John 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: id
  text: Demetrius telah mendapat kesaksian dari semua orang[a], dan dari kebenaran itu sendiri[b]. Kami juga memberikan kesaksian, dan engkau tahu bahwa kesaksian kami benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah diberi kesaksian oleh semua orang.” Bentuk perfektum pasif Yunani menunjukkan kesaksian atau pengakuan yang telah diberikan dan tetap berlaku.
    reason: lexical_alternative
  - marker: b
    text: “Kebenaran itu sendiri” dapat berarti bahwa kehidupan Demetrius selaras dengan kebenaran, atau secara lebih luas bahwa Injil atau kebenaran memberikan kesaksian yang mendukungnya.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Demetrius
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: μεμαρτύρηται
  choice: telah mendapat kesaksian
  rationale: Bentuk perfektum pasif menunjukkan kesaksian yang telah diberikan dan tetap berlaku sebagai pengakuan yang mapan. Konteks menunjukkan bahwa kesaksian itu baik, tetapi kata 'baik' tidak ditambahkan karena tidak dinyatakan secara leksikal.
- source_word: ὑπὸ πάντων
  choice: dari semua orang
  rationale: ὑπό dengan genitif menandai pelaku atau sumber dalam konstruksi pasif; frasa ini alami dalam bahasa Indonesia dan mempertahankan cakupan universalnya.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: dari kebenaran itu sendiri
  rationale: Ungkapan 'itu sendiri' mempertahankan daya penegasan αὐτῆς, sedangkan 'kebenaran' dibiarkan tidak dipersempit menjadi 'Injil' atau perilaku Demetrius.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Kami juga memberikan kesaksian
  rationale: Terjemahan ini mempertahankan unsur tambahan dari καὶ ... δέ dan hubungan leksikal antara kata kerja 'memberikan kesaksian' dengan kata benda 'kesaksian' pada klausa berikutnya.
- source_word: οἶδας
  choice: engkau tahu
  rationale: Walaupun bentuknya secara historis perfektum, οἶδα berfungsi sebagai verba keadaan kini. Kata ganti tunggal dipertahankan dengan 'engkau' dalam register kitab suci yang tetap mudah dipahami.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: kesaksian kami
  rationale: Bentuk posesif Indonesia ini alami dan mempertahankan kaitan dengan verba μαρτυροῦμεν.
- source_word: ἀληθής ἐστιν
  choice: benar
  rationale: Terjemahan langsung ini menjaga hubungan leksikal dan tematis dengan ἀληθείας, 'kebenaran', sebelumnya.
theological_decisions:
- issue: Makna ungkapan 'kebenaran itu sendiri' dalam bahasa Yohanes
  choice: Mempertahankan ungkapan 'kebenaran itu sendiri' tanpa mempersempit maknanya
  alternative: Injil itu sendiri; kehidupan Demetrius yang sesuai dengan kebenaran menjadi kesaksian
  rationale: Bahasa sumber memungkinkan personifikasi kebenaran atau gagasan bahwa kehidupan Demetrius selaras dengan kebenaran. Terjemahan utama mempertahankan keluasan dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai untuk lawan bicara tunggal sesuai konteks surat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan istilah kesaksian dan kebenaran dalam teks Yunani.
