  naturalness: Bahasa Indonesia baku dan mudah dipahami. “Telah mendapat kesaksian,” “memberikan kesaksian,” dan “engkau tahu” sesuai register surat yang bermartabat. Penggantian “bahkan” dengan “dan” juga membuat struktur kalimat lebih netral dan alami.
  terminology: “Kesaksian” secara konsisten mencerminkan keluarga μαρτυρέω/μαρτυρία, dan “kebenaran itu sendiri” mempertahankan penegasan αὐτῆς χωρίς mempersempit makna Yohanes. Nama Demetrius lazim dan tepat.
