base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: id
  text: supaya pada zaman-zaman yang akan datang[a] Ia menunjukkan kekayaan kasih karunia-Nya yang melampaui batas[b] dalam kebaikan-Nya kepada kita di dalam Mesias Yesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada masa-masa yang akan datang.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kekayaan kasih karunia-Nya yang tak terhingga.”
    reason: lexical_alternative
  - marker: c
    text: 'Yunani: “di dalam Kristus Yesus”; di sini Χριστός diterjemahkan “Mesias” karena berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang mengalir dari konteks sebelumnya dan mempertahankan daya telik klausa Yunani secara alami dalam bahasa Indonesia.
- source_word: ἐνδείξηται
  choice: Ia menunjukkan
  rationale: Mengungkapkan tindakan memperlihatkan atau menyatakan secara nyata; bentuk subjungtifnya ditampung oleh klausa tujuan dengan 'supaya'.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: pada zaman-zaman yang akan datang
  rationale: Mempertahankan bentuk jamak αἰῶσιν dan orientasi masa depan dari τοῖς ἐπερχομένοις.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: kekayaan ... yang tak terhingga
  rationale: ὑπερβάλλον menyatakan sesuatu yang melampaui ukuran biasa. 'Tak terhingga' alami dalam bahasa Indonesia dan mempertahankan gagasan keluasan yang melampaui batas.
- source_word: τῆς χάριτος αὐτοῦ
  choice: kasih karunia-Nya
  rationale: Istilah 'kasih karunia' mempertahankan makna kemurahan ilahi dalam pemakaian Paulus dan dikenal luas oleh pembaca Indonesia.
- source_word: ἐν χρηστότητι
  choice: dalam kebaikan-Nya
  rationale: χρηστότης menunjuk pada kebaikan hati atau kemurahan yang nyata. 'Dalam' mempertahankan bentuk preposisional dan membiarkan hubungan ini dipahami sebagai lingkup atau cara kasih karunia ditunjukkan.
- source_word: ἐφ’ ἡμᾶς
  choice: kepada kita
  rationale: Menyampaikan arah tindakan kemurahan itu kepada penerimanya secara idiomatis.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: Mempertahankan ungkapan persatuan atau lingkup relasional khas Paulus melalui 'di dalam', sedangkan Χριστός diterjemahkan sebagai gelar 'Mesias'.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός masih membawa makna gelar, yaitu Yang Diurapi. 'Mesias' mengungkapkan gelar tersebut, sementara catatan kaki mencatat bentuk tradisional yang lebih harfiah terhadap istilah Yunani.
- issue: Hubungan ἐν χρηστότητι dengan kasih karunia Allah
  choice: dalam kebaikan-Nya
  alternative: dengan kebaikan-Nya
  rationale: Terjemahan utama mempertahankan ambiguitas preposisi ἐν antara lingkup dan cara, tanpa membatasinya hanya sebagai alat atau sarana.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Bentuk 'zaman-zaman' dipertahankan untuk mencerminkan bentuk jamak Yunani, dan 'di dalam Mesias Yesus' mempertahankan ungkapan relasional Paulus.
