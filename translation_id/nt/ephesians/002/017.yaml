  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: id
  text: Ia datang dan memberitakan damai kepada kamu yang jauh[a][b], dan damai kepada mereka yang dekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “yang jauh” menunjuk kepada orang-orang bukan Yahudi, sedangkan “mereka yang dekat” menunjuk kepada orang Yahudi (lihat Ef. 2:11–13).
    reason: cross_reference
  - marker: b
    text: Dapat juga diterjemahkan “menyampaikan kabar baik tentang damai.” Kata Yunani yang dipakai biasanya berarti menyampaikan kabar baik, tetapi di sini objeknya adalah “damai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ia datang
  rationale: Partisip aoristis ini menyatakan tindakan pendahuluan atau penyerta. Bentuk klausa ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran kedatangan.
- source_word: εὐηγγελίσατο
  choice: memberitakan
  rationale: Kata kerja ini berarti menyampaikan kabar baik. Karena objek langsungnya di sini adalah 'damai', 'memberitakan' mempertahankan makna pengumuman tanpa menambahkan kata 'Injil' yang tidak tertulis secara eksplisit.
- source_word: εἰρήνην
  choice: damai
  rationale: Padanan langsung yang tetap memuat nuansa perdamaian dan keutuhan dalam konteks.
- source_word: ὑμῖν
  choice: kepada kamu
  rationale: Dativus ini menyatakan penerima pemberitaan dan secara langsung menyapa pembaca yang dalam konteks adalah bangsa-bangsa bukan Yahudi.
- source_word: τοῖς μακρὰν
  choice: yang jauh
  rationale: Mempertahankan metafora sumber secara ringkas dan alami tanpa memasukkan identitas kelompok ke dalam teks utama.
- source_word: τοῖς ἐγγύς
  choice: mereka yang dekat
  rationale: Mempertahankan kesejajaran dan pertentangan dengan 'yang jauh' dalam bahasa Indonesia yang jelas.
- source_word: καὶ ... καὶ
  choice: dan ... dan
  rationale: Pengulangan konjungsi mencerminkan dua kelompok yang menerima pemberitaan damai yang sama.
theological_decisions:
- issue: Identitas 'yang jauh' dan 'mereka yang dekat'
  choice: Mempertahankan sebutan metaforis dalam teks utama.
  alternative: Menuliskan secara eksplisit 'kamu yang bukan Yahudi' dan 'orang Yahudi'.
  rationale: Konteks Efesus 2:11–13 menunjukkan bahwa yang dimaksud masing-masing adalah bangsa-bangsa bukan Yahudi dan orang Yahudi, tetapi ayat ini sendiri memakai kategori 'jauh' dan 'dekat'. Terjemahan mempertahankan retorika dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pronomina 'Ia' menjaga kelancaran rujukan kepada Kristus; metafora 'jauh' dan 'dekat' dipertahankan. Penanda catatan ditempatkan setelah frasa 'yang jauh' dan semuanya hadir dalam teks utama.
