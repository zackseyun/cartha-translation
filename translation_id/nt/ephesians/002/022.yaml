  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: id
  text: Di dalam Dia, kamu juga sedang dibangun bersama-sama menjadi tempat kediaman Allah di dalam Roh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Di dalamnya,” jika kata ganti ini dipahami merujuk kepada seluruh bangunan, bukan langsung kepada Kristus.
    reason: alternative_reading
  - marker: b
    text: Atau “di dalam roh” atau “oleh Roh.” Frasa ini dapat menunjuk pada lingkup tempat Allah berdiam atau pada karya Roh Kudus sebagai sarananya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Kata ganti relatif paling wajar merujuk kepada Kristus dalam alur ayat 20–21. Huruf kapital memperjelas rujukan personal tanpa menghilangkan alternatif gramatikal yang dicatat dalam catatan kaki.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: καί bersifat aditif, sedangkan ὑμεῖς adalah kata ganti orang kedua jamak yang diberi penekanan. Dalam bahasa Indonesia, 'kamu juga' menyampaikan sapaan jamak melalui konteks dan menambahkan para pembaca kepada gambaran bangunan umat Allah.
- source_word: συνοικοδομεῖσθε
  choice: sedang dibangun bersama-sama
  rationale: Bentuk kini pasif menunjukkan proses yang berlangsung; 'dibangun' mempertahankan bentuk pasif dan 'bersama-sama' menyatakan unsur σύν.
- source_word: εἰς
  choice: menjadi
  rationale: Dalam konteks ini εἰς menyatakan tujuan atau hasil. 'Menjadi' lebih alami dalam bahasa Indonesia daripada terjemahan spasial harfiah 'ke dalam', sambil mempertahankan gagasan hasil pembangunan.
- source_word: κατοικητήριον
  choice: tempat kediaman
  rationale: Ungkapan ini jelas, bermartabat, dan mempertahankan citra konkret suatu tempat yang didiami.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Konstruksi 'tempat kediaman Allah' alami dalam bahasa Indonesia dan tetap dapat dipahami sebagai tempat yang didiami atau menjadi milik Allah.
- source_word: ἐν πνεύματι
  choice: di dalam Roh
  rationale: Dalam konteks Paulus dan gambaran bait Allah, πνεῦμα paling mungkin merujuk kepada Roh Kudus. Preposisi 'di dalam' mempertahankan nuansa lingkup tanpa menutup kemungkinan nuansa sarana.
theological_decisions:
- issue: Rujukan ἐν ᾧ
  choice: 'Merujuk kepada Kristus: ''Di dalam Dia.'''
  alternative: 'Merujuk kepada seluruh bangunan: ''Di dalamnya.'''
  rationale: Konteks terdekat berpusat pada Kristus sebagai batu penjuru dan memakai ungkapan yang sama pada ayat sebelumnya. Namun, bentuk Yunani juga dapat dipahami sebagai rujukan kepada bangunan, sehingga alternatif tersebut dicatat.
- issue: Makna ἐν πνεύματι
  choice: 'Merujuk kepada Roh Kudus: ''di dalam Roh.'''
  alternative: '''secara rohani'' atau ''oleh Roh.'''
  rationale: Bahasa bait dan kediaman Allah dalam Efesus mendukung rujukan kepada Roh Kudus. Terjemahan 'di dalam' sengaja tidak membatasi frasa itu hanya kepada sarana atau cara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang jelas dan bermartabat. Bentuk progresif 'sedang dibangun' menjaga aspek proses, sedangkan 'bersama-sama' mempertahankan citra umat yang disatukan sebagai satu bangunan. Semua penanda catatan kaki ditempatkan langsung dalam teks.
