base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: id
  text: Sebab, karena anugerah, kamu telah diselamatkan melalui iman. Hal ini[a] bukan berasal dari kamu sendiri, melainkan pemberian Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih luas, “seluruh kenyataan bahwa kamu diselamatkan karena anugerah melalui iman ini bukan berasal dari kamu sendiri.” Kata Yunani yang diterjemahkan “hal ini” kemungkinan menunjuk pada seluruh gagasan sebelumnya, bukan hanya pada “iman”.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: anugerah
  rationale: Dalam pemakaian Paulus, χάρις menunjuk pada kemurahan Allah yang diberikan secara cuma-cuma. “Anugerah” alami dalam bahasa Indonesia modern dan mempertahankan bobot teologis istilah itu.
- source_word: ἐστε σεσῳσμένοι
  choice: kamu telah diselamatkan
  rationale: Konstruksi perfektum perifrastik menyatakan tindakan penyelamatan yang telah terjadi dengan hasil yang tetap berlaku. “Telah diselamatkan” mempertahankan kedua unsur tersebut.
- source_word: διὰ πίστεως
  choice: melalui iman
  rationale: διά dengan genetif menyatakan sarana atau perantaraan. “Iman” adalah padanan baku dan sesuai konteks Paulus, sedangkan makna dasar kepercayaan tetap terkandung di dalamnya.
- source_word: τοῦτο
  choice: hal ini
  rationale: Demonstrativa netral ini kemungkinan menunjuk pada seluruh gagasan sebelumnya—diselamatkan karena anugerah melalui iman—bukan hanya pada salah satu nomina feminin. “Hal ini” mempertahankan keluasan rujukannya tanpa memperjelas secara berlebihan.
- source_word: οὐκ ἐξ ὑμῶν
  choice: bukan berasal dari dirimu sendiri
  rationale: ἐκ menyatakan sumber atau asal. Ungkapan ini secara wajar menyangkal bahwa kenyataan penyelamatan tersebut bersumber dari para pembaca.
- source_word: θεοῦ τὸ δῶρον
  choice: ini adalah pemberian Allah
  rationale: Frasa ini mengidentifikasi kenyataan sebelumnya sebagai pemberian yang berasal dari Allah. Penambahan “ini adalah” diperlukan agar kalimat Indonesia jelas dan alami.
theological_decisions:
- issue: Rujukan τοῦτο (“hal ini”) terhadap anugerah, iman, dan keselamatan
  choice: “Hal ini” dibiarkan menunjuk secara luas pada seluruh kenyataan bahwa orang diselamatkan karena anugerah melalui iman.
  alternative: Τοῦτο dapat dipahami secara lebih sempit sebagai menunjuk khusus pada iman, atau khusus pada anugerah.
  rationale: Bentuk netral τοῦτο tidak bersesuaian secara gramatikal dengan χάρις maupun πίστις, yang keduanya feminin. Karena itu, rujukan kepada seluruh klausa sebelumnya paling mungkin, tetapi terjemahan tidak dibuat sedemikian eksplisit sehingga meniadakan ambiguitas yang masih mungkin diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal kolektif “kamu” dipakai untuk menyapa para pembaca sebagai satu komunitas; frasa refleksif “dirimu sendiri” mempertahankan penekanan sumber dalam ἐξ ὑμῶν. Istilah “anugerah”, “diselamatkan”, dan “iman” dipertahankan karena dikenal luas dan tepat dalam konteks Paulus.
