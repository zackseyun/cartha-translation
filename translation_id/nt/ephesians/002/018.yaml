  terminology: Kapitalisasi “Dia,” “Roh,” dan “Bapa” konsisten dengan rujukan kontekstual dan tidak menambahkan isi. “Akses” mempertahankan cakupan ‘access/approach’ tanpa memaksakan gambaran fisik dari “jalan masuk.”
