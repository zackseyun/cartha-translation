  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: id
  text: Sebab melalui Dia kita semua, dari kedua pihak, mempunyai akses kepada Bapa dalam satu Roh.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Karena melalui Dia kita semua, dari kedua pihak, mempunyai akses ...”'
    reason: lexical_alternative
  - marker: b
    text: “Akses” dapat juga diterjemahkan “jalan masuk”, “kesempatan menghadap”, atau “pendekatan”.
    reason: lexical_alternative
  - marker: c
    text: Atau “oleh satu Roh”. “Dalam satu Roh” mempertahankan susunan bahasa Yunani dan dapat menyatakan sarana ataupun lingkup.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks, konjungsi ini memberikan dasar atau penjelasan bagi pernyataan sebelumnya. “Sebab” alami dan tepat untuk hubungan penjelas ini.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; ungkapan ini mempertahankan peran Kristus sebagai pengantara.
- source_word: ἔχομεν
  choice: kita ... mendapat
  rationale: Dalam gabungan dengan “jalan masuk”, “mendapat jalan masuk” lebih alami dalam bahasa Indonesia daripada “memiliki jalan masuk”, sambil tetap menyatakan kenyataan yang dinikmati bersama sekarang.
- source_word: τὴν προσαγωγὴν
  choice: jalan masuk
  rationale: προσαγωγή menunjuk pada akses atau kesempatan menghadap seseorang yang berkedudukan tinggi. “Jalan masuk” jelas dalam bahasa Indonesia dan tidak membatasi maknanya pada satu kali perkenalan.
- source_word: οἱ ἀμφότεροι
  choice: kita berdua
  rationale: Ungkapan ini mempertahankan solidaritas orang pertama dan menunjuk kembali kepada dua pihak yang sebelumnya terpisah, yaitu orang Yahudi dan bukan Yahudi.
- source_word: ἐν ἑνὶ πνεύματι
  choice: dalam satu Roh
  rationale: Terjemahan ini mempertahankan preposisi Yunani dan ambiguitas yang mungkin mencakup sarana maupun lingkup. Huruf kapital menunjukkan rujukan yang paling mungkin kepada Roh Kudus.
- source_word: πρὸς τὸν πατέρα
  choice: kepada Bapa
  rationale: πρός dengan akusatif menyatakan arah atau orientasi menuju hadirat pribadi; “kepada Bapa” setia dan alami.
theological_decisions:
- issue: Rujukan “satu Roh”
  choice: Roh Kudus
  alternative: roh bersama atau sikap batin yang satu
  rationale: 'Konteks ayat membentuk pola yang kuat: melalui Dia (Anak), dalam satu Roh, kepada Bapa. Kapitalisasi menyatakan rujukan yang paling mungkin tanpa menambahkan kata penjelas ke teks.'
- issue: Daya makna προσαγωγή
  choice: akses bersama kepada Bapa
  alternative: perkenalan resmi atau kesempatan menghadap ke hadirat Bapa
  rationale: “Jalan masuk” menyampaikan hak atau kesempatan yang terus tersedia bagi kedua pihak tanpa menentukan secara berlebihan apakah gambarnya terutama bersifat istana, relasional, atau ibadah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Dia” dikapitalisasi karena merujuk kepada Kristus, dan “Roh” dikapitalisasi karena konteks paling mungkin menunjuk kepada Roh Kudus. Penempatan “dalam satu Roh” di akhir mempertahankan hubungan langsung dengan keseluruhan tindakan mendapat jalan masuk kepada Bapa.
