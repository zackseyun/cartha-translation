  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: id
  text: Kalian telah dibangun di atas dasar para rasul dan nabi[a], dengan Mesias Yesus[b] sendiri sebagai batu penjuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dasar para rasul dan nabi” dapat berarti dasar yang berkaitan dengan kesaksian mereka, dasar yang mereka letakkan, atau dasar yang terdiri atas mereka; bentuk genitif dalam bahasa Yunani tidak menentukannya secara lebih khusus.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus Yesus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini untuk mempertahankan maknanya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: Kalian telah dibangun
  rationale: Bentuk partisip aoris pasif ini mengacu kepada para pembaca. Bentuk ini dialihkan menjadi klausa pasif yang wajar dalam bahasa Indonesia sambil mempertahankan gagasan bahwa mereka menerima tindakan pembangunan.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: di atas dasar
  rationale: Ungkapan ini mempertahankan gambaran arsitektural tentang bangunan yang berdiri di atas fondasi.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: para rasul dan nabi
  rationale: Frasa 'dasar para rasul dan nabi' mempertahankan hubungan genitif Yunani tanpa mempersempitnya menjadi dasar yang diletakkan oleh mereka atau dasar yang terdiri atas mereka.
- source_word: ὄντος ἀκρογωνιαίου
  choice: sebagai batu penjuru
  rationale: Ungkapan ini menyampaikan fungsi Kristus dalam metafora bangunan secara alami; ἀκρογωνιαῖος paling tepat dipahami sebagai batu penjuru, bukan batu puncak.
- source_word: αὐτοῦ Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus sendiri
  rationale: Kata αὐτοῦ memberi penekanan pada pribadi Mesias Yesus. Χριστός diterjemahkan 'Mesias' untuk mempertahankan maknanya sebagai gelar.
theological_decisions:
- issue: Makna 'dasar para rasul dan nabi'
  choice: Hubungan genitif dibiarkan tetap luas melalui frasa 'dasar para rasul dan nabi'.
  alternative: Dasar yang diletakkan oleh para rasul dan nabi; atau dasar yang terdiri atas para rasul dan nabi.
  rationale: Bahasa Yunani tidak menentukan secara tegas apakah para rasul dan nabi meletakkan dasar, merupakan dasar, atau berhubungan dengan dasar melalui kesaksian mereka. Terjemahan tidak boleh menyelesaikan ketegangan ini secara sepihak.
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam konteks ini Χριστός tetap bermakna gelar, sehingga 'Mesias' menyampaikan arti leksikalnya; bentuk tradisional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kalian' menjadikan rujukan jamak partisip Yunani jelas bagi pembaca masa kini, sedangkan 'batu penjuru' mempertahankan metafora arsitektural yang lazim. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
