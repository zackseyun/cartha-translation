  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: id
  text: Di dalam Dia, seluruh bangunan[a] yang sedang dirangkai menjadi satu bertumbuh menjadi sebuah bait yang kudus di dalam Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap bangunan”. Frasa Yunani ini dapat dipahami secara distributif atau korporat; teks utama mengikuti gambaran tentang satu bait yang utuh dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Kata ganti relatif paling wajar merujuk kepada Kristus dalam ayat sebelumnya; bentuk personal dipertahankan tanpa mempersempit cakupan ungkapan Paulus.
- source_word: πᾶσα οἰκοδομὴ
  choice: seluruh bangunan
  rationale: Frasa Yunani dapat dibaca secara korporat atau distributif. Konteks tentang satu umat yang dibangun menjadi satu bait mendukung pengertian korporat; kemungkinan distributif dicatat dalam catatan kaki.
- source_word: συναρμολογουμένη
  choice: tersusun rapat
  rationale: Partisipel pasif kini menggambarkan proses berkelanjutan ketika bagian-bagian bangunan dipadukan menjadi satu kesatuan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran arsitektural.
- source_word: αὔξει
  choice: bertumbuh
  rationale: Kata kerja kini menyatakan perkembangan yang berlangsung. 'Bertumbuh' mempertahankan perpaduan metafora bangunan dan pertumbuhan.
- source_word: εἰς
  choice: menjadi
  rationale: Dalam konteks ini εἰς menyatakan arah sekaligus hasil akhir. 'Menjadi' mengungkapkan tujuan pertumbuhan bangunan secara alami dalam bahasa Indonesia.
- source_word: ναὸν ἅγιον
  choice: bait suci
  rationale: ναός menunjuk pada tempat kudus atau bangunan bait, bukan seluruh kompleks. 'Bait suci' merupakan padanan Indonesia yang jelas dan lazim serta mempertahankan unsur kekudusan.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Terjemahan ini mempertahankan keluasan makna ungkapan Paulus, yang dapat mencakup lingkup dan persatuan dengan Tuhan, tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Apakah ᾧ merujuk secara personal kepada Kristus atau secara impersonal kepada gambaran bangunan/batu penjuru
  choice: 'Rujukan personal kepada Kristus: ''Di dalam Dia'''
  alternative: 'Rujukan impersonal: ''Di dalamnya'''
  rationale: Anteseden terdekat dalam konteks adalah Kristus Yesus sendiri sebagai batu penjuru, dan pengulangan ungkapan 'di dalam Dia' pada bagian ini mendukung rujukan Kristologis personal.
- issue: Apakah πᾶσα οἰκοδομὴ bermakna korporat atau distributif
  choice: 'Makna korporat: ''seluruh bangunan'''
  alternative: 'Makna distributif: ''setiap bangunan'''
  rationale: Konteks menekankan kesatuan orang Yahudi dan bukan Yahudi sebagai satu umat dan satu bait. Namun, karena bentuk Yunani juga memungkinkan pembacaan distributif, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tersusun rapat' menjaga metafora bangunan dengan ungkapan yang mudah dipahami, sedangkan 'di dalam Tuhan' mempertahankan ketegangan dan keluasan teologis teks sumber.
