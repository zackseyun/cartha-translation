  source_fidelity: Terjemahan mempertahankan kontras δέ, kelimpahan belas kasihan, dan hubungan sebab yang dinyatakan διά. Namun, “yang dengannya Ia mengasihi kita” mudah dipahami secara instrumental dalam bahasa Indonesia (“melalui/berkat kasih itu”), sedangkan klausa relatif Yunani secara idiomatis menegaskan kasih Allah kepada kita melalui pengulangan kata serumpun.
  naturalness: “Karena kasih-Nya yang besar kepada kita” adalah bahasa Indonesia baku yang lebih alami dan jelas. Koma akhir tetap diperlukan karena kalimat Yunani berlanjut ke ayat 5.
