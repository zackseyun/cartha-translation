    issue: Klausa relatif “yang dengannya Ia mengasihi kita” terdengar instrumental dan kurang alami.
    rationale: Dalam bahasa Indonesia, “dengannya” biasanya menyatakan sarana. Dalam konstruksi Yunani ἣν ἠγάπησεν ἡμᾶς, klausa tersebut mengulang akar kata “kasih/mengasihi” untuk menegaskan bahwa kasih besar itu diarahkan kepada “kita”, bukan terutama untuk menyatakan sarana.
