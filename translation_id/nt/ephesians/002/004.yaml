  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: id
  text: Tetapi Allah, yang kaya akan belas kasihan, karena kasih-Nya yang besar kepada kita,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Tetapi
  rationale: Menandai pertentangan kuat dengan keadaan manusia yang digambarkan sebelumnya dan meneruskannya secara alami dalam bahasa Indonesia.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: yang kaya akan belas kasihan
  rationale: Ungkapan ini mempertahankan gambaran kelimpahan dalam idiom Indonesia yang alami; bentuk partisipelnya dihubungkan secara deskriptif dengan Allah.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: karena kasih-Nya yang besar
  rationale: διά dengan akusatif menyatakan sebab, sedangkan πολλή menegaskan besarnya kasih Allah.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: yang dengannya Ia mengasihi kita
  rationale: Mempertahankan klausa relatif dan pengulangan serumpun antara kata benda ἀγάπη dan kata kerja ἀγαπάω, sekalipun susunannya sedikit lebih formal.
theological_decisions:
- issue: Pengulangan serumpun ‘kasih ... mengasihi’
  choice: Mempertahankan ‘kasih-Nya yang besar yang dengannya Ia mengasihi kita’
  alternative: kasih-Nya yang besar kepada kita
  rationale: Teks Yunani sengaja memakai kata benda dan kata kerja yang serumpun. Mempertahankan keduanya menjaga penekanan retoris tanpa menambahkan tafsiran.
- issue: Hubungan antara belas kasihan dan kasih
  choice: Mempertahankan keduanya sebagai gagasan yang berbeda tetapi berkaitan
  alternative: Meleburkannya menjadi ‘kasih-Nya yang penuh belas kasihan’
  rationale: Teks menyebut belas kasihan sebagai kelimpahan yang menjadi ciri Allah dan kasih yang besar sebagai sebab; melebur keduanya akan mengurangi tekstur teologis kalimat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kaya akan belas kasihan’ merupakan idiom yang jelas bagi pembaca umum, sedangkan susunan ‘yang dengannya Ia mengasihi kita’ dipertahankan agar gema retoris teks Yunani tetap terdengar. Tanda koma terakhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
