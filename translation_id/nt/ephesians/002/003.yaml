id: EPH.2.3
reference: Ephesians 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: id
  text: Di antara mereka[a], kita semua juga dahulu hidup dalam berbagai keinginan daging[b] kita, menuruti kehendak daging dan pikiran[c]. Secara kodrati[d] kita pun dahulu adalah anak-anak kemurkaan[e], sama seperti orang-orang lainnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di dalam hal-hal itu.” Bentuk Yunani dapat menunjuk kepada orang-orang yang dicirikan oleh ketidaktaatan atau kepada ranah kehidupan dalam pelanggaran dan dosa yang disebutkan sebelumnya.
    reason: alternative_reading
  - marker: b
    text: “Daging” di sini mempunyai daya etis dan dapat juga ditafsirkan sebagai “natur berdosa,” tetapi terjemahan utama mempertahankan istilah Paulus tanpa mempersempit maknanya.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “melakukan kehendak-kehendak daging dan pikiran-pikiran.” Bentuk jamak dapat mencakup berbagai kemauan, niat, dan pola pikir.
    reason: literal_rendering
  - marker: d
    text: Atau, “menurut kodrat.” Ungkapan ini tidak harus dipersempit menjadi “secara biologis” atau “sejak lahir.”
    reason: theological_ambiguity
  - marker: e
    text: Atau, “orang-orang yang menjadi sasaran murka.” “Anak-anak kemurkaan” menerjemahkan idiom Yunani secara dekat dan membiarkan terbuka apakah tekanannya pada keadaan, ciri, atau kedudukan di bawah murka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Di antara mereka
  rationale: Kata ganti relatif berbentuk jamak dan dalam konteks paling wajar menunjuk kepada orang-orang yang baru disebutkan, yaitu “anak-anak ketidaktaatan” dalam ayat 2. Catatan kaki mempertahankan kemungkinan bahwa ungkapan ini menunjuk kepada lingkungan atau ranah kehidupan tersebut.
- source_word: ἀνεστράφημέν ποτε
  choice: dahulu hidup
  rationale: Kata kerja ini menggambarkan cara menjalani atau menata kehidupan, sedangkan ποτε menunjukkan keadaan pada masa lampau. “Dahulu hidup” alami dalam bahasa Indonesia dan tetap menyampaikan pola hidup.
- source_word: ἐπιθυμίαις
  choice: berbagai keinginan
  rationale: Istilah ini mencakup hasrat atau dorongan yang tidak teratur dan tidak terbatas pada nafsu seksual. Kata “berbagai” membantu mencerminkan bentuk jamaknya.
- source_word: σάρξ
  choice: daging
  rationale: “Daging” mempertahankan istilah khas Paulus beserta keluasan makna antropologis dan etisnya tanpa langsung menafsirkannya sebagai “natur berdosa”.
- source_word: ποιοῦντες τὰ θελήματα
  choice: menuruti kehendak
  rationale: Secara harfiah ungkapan ini berarti “melakukan kehendak-kehendak.” Dalam bahasa Indonesia, “menuruti kehendak” menyampaikan tindakan melaksanakan dorongan atau kemauan secara alami tanpa menyamakannya dengan ἐπιθυμίαις sebelumnya.
- source_word: τῶν διανοιῶν
  choice: pikiran
  rationale: Bentuk jamak Yunani dapat menunjuk kepada pemikiran, niat, atau pola pikir. “Pikiran” cukup luas dan wajar dalam bahasa Indonesia.
- source_word: φύσει
  choice: secara kodrati
  rationale: Pilihan ini mempertahankan gagasan keadaan menurut kodrat tanpa mempersempitnya menjadi semata-mata “sejak lahir” atau biologis.
- source_word: τέκνα ὀργῆς
  choice: anak-anak kemurkaan
  rationale: Terjemahan ini mempertahankan ungkapan Semitis Yunani dan tidak memutuskan secara sepihak apakah tekanannya terletak pada ciri, keadaan, atau kedudukan sebagai sasaran murka.
- source_word: οἱ λοιποί
  choice: orang-orang lainnya
  rationale: Ungkapan ini secara alami menunjuk kepada manusia lainnya di luar kelompok “kita” yang sedang dibicarakan.
theological_decisions:
- issue: Makna σάρξ dalam konteks etis Paulus
  choice: daging
  alternative: natur berdosa
  rationale: Konteksnya jelas berkaitan dengan dosa, tetapi “natur berdosa” akan mempersempit antropologi Paulus. “Daging” menjaga istilah sumber dan ketegangan teologisnya.
- issue: Arti τέκνα φύσει ὀργῆς
  choice: Secara kodrati kita adalah anak-anak kemurkaan
  alternative: Sejak lahir kita adalah orang-orang yang menjadi sasaran murka
  rationale: Teks utama mempertahankan φύσει dan idiom τέκνα ὀργῆς tanpa mengubahnya menjadi rumusan sistematis tentang kelahiran, hakikat manusia, atau mekanisme penghukuman.
- issue: Rujukan ἐν οἷς
  choice: Di antara mereka
  alternative: Di dalam semuanya itu
  rationale: Rujukan personal kepada orang-orang durhaka pada ayat sebelumnya paling sesuai dengan konteks, tetapi bentuk Yunani masih memungkinkan pembacaan yang menunjuk kepada ranah kehidupan dalam pelanggaran dan dosa; kemungkinan itu dicatat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur ayat dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan gagasannya. Istilah “daging,” “secara kodrati,” dan “anak-anak kemurkaan” sengaja dipertahankan karena membawa ketegangan teologis dari teks sumber; catatan kaki menjelaskan alternatif tanpa memasukkan rumusan denominasi tertentu.
