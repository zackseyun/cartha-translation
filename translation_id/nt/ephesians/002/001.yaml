  text: Dan kamu, yang mati karena pelanggaran-pelanggaran dan dosa-dosamu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: mati
  rationale: Mempertahankan metafora kuat dari teks Yunani tanpa menafsirkannya lebih lanjut.
- source_word: παραπτώμασιν
  choice: pelanggaran-pelanggaran
  rationale: Menyampaikan tindakan menyimpang atau melanggar; bentuk jamak dipertahankan.
- source_word: ἁμαρτίαις
  choice: dosa-dosa
  rationale: Padanan Indonesia yang lazim dan tepat untuk tindakan atau keadaan berdosa; bentuk jamak dipertahankan.
- source_word: τοῖς ... καὶ ταῖς ... ὑμῶν
  choice: karena pelanggaran-pelanggaran dan dosa-dosamu
  rationale: Datif dipahami secara kausal, sesuai konteks; satu akhiran posesif alami dalam bahasa Indonesia mencakup kedua nomina.
- source_word: ὄντας
  choice: dahulu
  rationale: Partisip ini bergantung pada verba utama yang baru muncul dalam ayat 5. Dalam cuplikan ayat ini, 'dahulu' menghasilkan klausa Indonesia yang wajar dan menyampaikan keadaan lampau yang dimaksud konteks.
- source_word: ὑμᾶς
  choice: kamu
  rationale: Pronomina orang kedua jamak diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak dan sesuai register modern.
theological_decisions:
- issue: Makna 'mati'
  choice: Mempertahankan ungkapan 'mati' tanpa tambahan seperti 'secara rohani'.
  alternative: mati secara rohani
  rationale: Teks Yunani hanya mengatakan 'mati'; penjelasan tambahan akan mempersempit metafora teologis yang sengaja dibiarkan kuat.
- issue: Hubungan datif dengan keadaan mati
  choice: karena
  alternative: dalam
  rationale: Datif τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις dapat dipahami sebagai lingkup atau sebab. 'Karena' menyatakan kaitan kausal secara alami, tetapi tidak menambahkan mekanisme teologis tertentu.
- issue: Ketergantungan sintaksis pada ayat 5
  choice: 'Membentuk klausa ayat yang dapat dibaca sendiri: ''Kamu dahulu mati ...'''
  alternative: Dan kamu, yang dahulu mati ...
  rationale: Dalam bahasa Yunani, ὑμᾶς ὄντας menunggu verba συνεζωοποίησεν pada ayat 5. Namun pembagian ayat modern dan lapisan konsultasi Inggris mendukung klausa yang dapat dibaca sendiri, tanpa mengubah pokok pernyataannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kamu' dipilih sebagai sapaan umum; reduplikasi mempertahankan kemajemukan kedua nomina. Tanda koma akhir menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
