  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: id
  text: Sebab Dialah damai sejahtera kita. Dia telah menjadikan keduanya satu dan merobohkan tembok pemisah yang menjadi penghalang itu—yaitu permusuhan—di dalam daging-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Keduanya” mengacu kepada orang Yahudi dan orang bukan Yahudi dalam konteks langsung.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di dalam daging-Nya” menunjuk pada tindakan Kristus dalam keberadaan jasmani-Nya, khususnya melalui kematian-Nya; ungkapan ini tidak berarti bahwa kemanusiaan-Nya dihapuskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Dialah
  rationale: Bentuk dengan partikel -lah mempertahankan penekanan pada Kristus sendiri secara alami dalam bahasa Indonesia.
- source_word: γάρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan dasar bagi pernyataan sebelumnya.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: damai sejahtera kita
  rationale: Ungkapan baku dan wajar yang menyampaikan perdamaian serta keutuhan hubungan yang diwujudkan Kristus.
- source_word: ὁ ποιήσας τὰ ἀμφότερα ἓν
  choice: Dia telah menjadikan keduanya satu
  rationale: Mempertahankan bentuk umum 'keduanya' dari bahasa Yunani; konteks langsung menunjukkan orang Yahudi dan bukan Yahudi.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: tembok pemisah yang menjadi penghalang itu
  rationale: Menyampaikan citra tembok yang memisahkan sekaligus fungsi penghalangnya tanpa konstruksi genitif yang kaku.
- source_word: λύσας
  choice: merobohkan
  rationale: Kata yang alami untuk tindakan membongkar atau meruntuhkan sebuah tembok.
- source_word: τὴν ἔχθραν
  choice: permusuhan
  rationale: Padanan modern yang jelas bagi sikap dan keadaan saling bermusuhan.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: di dalam tubuh jasmani-Nya
  rationale: Dalam konteks ini σάρξ menunjuk pada keberadaan jasmani Kristus; pilihan ini menghindari kesan bahwa permusuhan berada dalam diri-Nya, sambil mempertahankan makna konkret ungkapan tersebut.
theological_decisions:
- issue: Acuan τὰ ἀμφότερα ('keduanya')
  choice: Dibiarkan sebagai 'keduanya', dengan penjelasan dalam catatan bahwa yang dimaksud ialah orang Yahudi dan bukan Yahudi.
  alternative: Memperjelas langsung sebagai 'kedua kelompok itu'.
  rationale: Bentuk ini lebih dekat dengan bahasa Yunani dan mempertahankan kesinambungan konteks tanpa kehilangan kejelasan karena catatan tersedia.
- issue: Hubungan τὴν ἔχθραν dengan tembok penghalang
  choice: '''Permusuhan'' diperlakukan sebagai penjelasan aposisional atas tembok penghalang dan diapit tanda pisah.'
  alternative: Mengaitkannya dengan klausa berikut atau menjadikannya objek tindakan tersendiri.
  rationale: Susunan ini mempertahankan kemungkinan sintaksis utama ayat dan mencegah 'di dalam tubuh jasmani-Nya' dibaca sebagai lokasi permusuhan.
- issue: Makna ἐν τῇ σαρκὶ αὐτοῦ
  choice: Diterjemahkan 'di dalam tubuh jasmani-Nya' dan dipahami sebagai sarana atau ranah tindakan Kristus melalui keberadaan jasmani dan kematian-Nya.
  alternative: '''Dalam daging-Nya'' atau ''melalui tubuh-Nya''.'
  rationale: Terjemahan ini konkret dan dapat dipahami pembaca Indonesia, tanpa menyiratkan 'kodrat berdosa' ataupun bahwa kemanusiaan Kristus disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah setelah pernyataan pertama agar mudah dibaca, sedangkan tanda pisah mempertahankan hubungan aposisional 'permusuhan' dengan tembok penghalang.
