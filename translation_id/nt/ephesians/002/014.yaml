  to: Sebab Dialah damai sejahtera kita. Dia telah menjadikan keduanya satu dan merobohkan tembok pemisah yang menjadi penghalang itu—yaitu permusuhan—di dalam daging-Nya.[a][b]
  rationale: Hanya istilah untuk σάρξ dan catatan yang terkait direvisi. “Daging-Nya” merupakan padanan leksikal langsung; aposisi bertanda pisah dipertahankan agar “di dalam daging-Nya” dipahami bersama tindakan Kristus merobohkan penghalang.
