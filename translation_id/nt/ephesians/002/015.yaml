  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: id
  text: dengan membatalkan hukum tentang perintah-perintah yang dinyatakan dalam ketetapan-ketetapan[a], supaya di dalam diri-Nya Ia menciptakan keduanya menjadi satu manusia baru[b], seraya mengadakan perdamaian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hukum perintah-perintah dalam ketetapan-ketetapan”; dapat juga dipahami “hukum tentang perintah-perintah yang terdiri atas ketetapan-ketetapan.”
    reason: lexical_alternative
  - marker: b
    text: “Satu manusia baru” merupakan gambaran tunggal yang bersifat korporat; dapat juga diterjemahkan “satu umat manusia baru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν
  choice: hukum yang terdiri atas perintah-perintah dalam berbagai ketetapan
  rationale: Susunan ini mempertahankan hubungan genitif dan frasa ἐν δόγμασιν tanpa membatasi δόγμα hanya pada ketentuan ritual. 'Terdiri atas' dipilih sebagai hubungan yang wajar dalam bahasa Indonesia, sementara kemungkinan hubungan lain dicatat dalam catatan kaki.
- source_word: καταργήσας
  choice: dengan membatalkan
  rationale: Kata ini menyampaikan tindakan tegas yang meniadakan daya berlaku atau fungsi objek yang disebut. Bentuk 'dengan' menghubungkannya secara alami dengan konteks kalimat induk pada ayat sebelumnya.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan dari tindakan tersebut secara jelas dan alami.
- source_word: τοὺς δύο
  choice: keduanya
  rationale: Merujuk secara eksplisit kepada dua kelompok dalam konteks dekat, yaitu orang Yahudi dan bukan Yahudi.
- source_word: κτίσῃ
  choice: menciptakan
  rationale: Mempertahankan nuansa penciptaan baru yang kuat dalam κτίζω, bukan sekadar membentuk atau menyatukan.
- source_word: ἐν αὑτῷ
  choice: di dalam diri-Nya
  rationale: Menyatakan daya refleksif αὑτῷ dan mempertahankan letaknya yang erat dengan tindakan menciptakan.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: menjadi satu manusia baru
  rationale: '''Manusia'' merupakan padanan alami bagi ἄνθρωπος dalam bahasa Indonesia dan tetap mempertahankan gambaran tunggal yang bersifat korporat tanpa harus mengubahnya menjadi konsep abstrak ''umat manusia baru''.'
- source_word: ποιῶν εἰρήνην
  choice: dan dengan demikian mengadakan damai sejahtera
  rationale: Mengungkapkan tindakan atau hasil yang menyertai penciptaan satu manusia baru. 'Damai sejahtera' adalah ungkapan Indonesia yang lazim dan bermartabat untuk εἰρήνη.
theological_decisions:
- issue: Makna korporat εἰς ἕνα καινὸν ἄνθρωπον
  choice: satu manusia baru
  alternative: satu umat manusia baru
  rationale: Bentuk tunggal konkret dipertahankan agar gambaran Paulus tidak diubah menjadi abstraksi. Konteks menunjukkan bahwa satu 'manusia' ini merupakan gambaran korporat bagi kedua kelompok.
- issue: Daya καταργήσας terhadap hukum
  choice: membatalkan
  alternative: meniadakan daya berlakunya
  rationale: Terjemahan mempertahankan kekuatan kata Yunani, tetapi objeknya tetap dibatasi oleh frasa lengkap 'hukum yang terdiri atas perintah-perintah dalam berbagai ketetapan'; ayat ini tidak diperluas menjadi pernyataan sistematis mengenai setiap aspek kehendak Allah.
- issue: Hubungan ἐν αὑτῷ dalam klausa tujuan
  choice: di dalam diri-Nya Ia menciptakan keduanya menjadi satu manusia baru
  alternative: Ia menciptakan keduanya menjadi satu manusia baru di dalam diri-Nya
  rationale: Urutan yang dipilih dekat dengan Yunani dan menekankan bahwa tindakan penciptaan berlangsung di dalam Kristus. Alternatifnya juga mungkin secara sintaksis dan dicatat sebagai kemungkinan susunan, tetapi tidak mengubah pokok makna.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Diksi mempertahankan metafora penciptaan dan ketegangan teologis teks tanpa penjelasan doktrinal tambahan.
