id: EPH.2.19
reference: Ephesians 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: id
  text: Jadi, kalian bukan lagi orang asing dan pendatang, melainkan sesama warga dengan orang-orang kudus[a] dan anggota keluarga Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang-orang kudus” berarti umat yang dikhususkan bagi Allah, bukan hanya golongan tertentu yang kemudian secara resmi dinyatakan kudus.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menarik kesimpulan dari uraian sebelumnya; “Jadi” menyampaikan daya simpulnya secara alami dalam bahasa Indonesia modern.
- source_word: οὐκέτι
  choice: bukan lagi
  rationale: Ungkapan ini dengan jelas menandai perubahan status yang kini tidak berlaku lagi.
- source_word: ξένοι
  choice: orang asing
  rationale: Istilah ini menunjuk kepada orang yang berasal dari luar atau tidak termasuk dalam suatu kelompok; pilihan ini juga membentuk kontras yang jelas dengan keanggotaan dalam keluarga.
- source_word: πάροικοι
  choice: pendatang
  rationale: Kata Yunani ini menunjuk kepada orang yang tinggal di suatu tempat tanpa hak kewargaan penuh. “Pendatang” alami dalam bahasa Indonesia, sementara nuansa status kewargaannya dijelaskan oleh konteks perbandingan dengan “sesama warga”.
- source_word: συμπολῖται
  choice: sesama warga
  rationale: Kata majemuk ini menekankan kewargaan yang dimiliki bersama; “sesama warga” ringkas, alami, dan mempertahankan metafora kewargaan.
- source_word: τῶν ἁγίων
  choice: dengan orang-orang kudus
  rationale: Genitif sesudah συμπολῖται secara wajar menyatakan persekutuan atau kebersamaan. “Orang-orang kudus” mempertahankan istilah teologis yang luas tanpa mempersempit rujukannya.
- source_word: οἰκεῖοι
  choice: anggota keluarga
  rationale: Istilah ini berarti mereka yang termasuk dalam sebuah rumah tangga atau keluarga. “Anggota keluarga” mengungkapkan metafora relasionalnya secara jelas dan idiomatis.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif ini menyatakan bahwa keluarga tersebut adalah milik Allah; susunan “keluarga Allah” alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan τῶν ἁγίων
  choice: orang-orang kudus, tanpa membatasi rujukannya lebih lanjut
  alternative: malaikat; orang percaya Yahudi secara khusus; semua orang percaya
  rationale: Konteks membahas masuknya orang-orang bukan Yahudi ke dalam umat dan keluarga Allah. Teks utama mempertahankan sebutan luas Paulus dan tidak memutuskan apakah rujukannya harus dibatasi pada kelompok tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” dipakai untuk menyatakan bentuk jamak ἐστέ secara jelas. Metafora kewargaan dan keluarga dipertahankan, dengan struktur kalimat yang mudah dipahami pembaca umum.
