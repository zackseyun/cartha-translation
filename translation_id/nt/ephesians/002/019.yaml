  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan rangkaian simpulan ἄρα οὖν, perubahan status οὐκέτι, serta dua kontras metaforis: orang asing/pendatang berhadapan dengan sesama warga, dan keterasingan berhadapan dengan keanggotaan keluarga Allah. “Pendatang” merupakan padanan Indonesia yang wajar bagi πάροικοι dalam pasangan ini; walaupun tidak secara tersendiri menjelaskan nuansa status penduduk tanpa kewargaan penuh, kontras dengan “sesama warga” mempertahankan inti maknanya.'
  naturalness: Kalimatnya baku, modern, dan mudah dibaca. “Jadi” berfungsi alami sebagai penghubung simpulan. Pemakaian “kalian” secara tepat mencerminkan bentuk jamak ἐστέ tanpa mengganggu register.
  terminology: “Orang-orang kudus” mempertahankan keluasan ἅγιοι dan catatan kaki dengan baik mencegah pembacaan yang dibatasi pada kelas yang dikanonisasi. “Sesama warga” dan “anggota keluarga Allah” setia pada metafora kewargaan dan rumah tangga dalam teks Yunani.
