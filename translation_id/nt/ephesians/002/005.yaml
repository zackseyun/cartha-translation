  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: id
  text: bahkan ketika kita mati dalam pelanggaran-pelanggaran kita, Ia menghidupkan kita bersama-sama dengan Mesias—oleh anugerah kamu telah diselamatkan—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: ketika kita mati
  rationale: Konstruksi partisipial ini dapat bernuansa waktu sekaligus konsesif. “Ketika kita mati” alami dalam bahasa Indonesia dan mempertahankan keadaan yang dinyatakan tanpa mempertegas salah satu nuansa secara berlebihan.
- source_word: τοῖς παραπτώμασιν
  choice: dalam pelanggaran-pelanggaran kita
  rationale: Datif ini paling wajar dipahami sebagai ranah atau acuan. “Dalam” mempertahankan gambaran keadaan berada dalam pelanggaran; “kita” disediakan oleh konteks orang pertama jamak dan kesejajaran dengan ayat 1.
- source_word: συνεζωοποίησεν
  choice: menghidupkan kita bersama-sama
  rationale: Kata kerja majemuk ini menyatakan pemberian hidup serta kebersamaan. Susunan ini mempertahankan kedua unsur itu dan membiarkan frasa berikutnya menunjukkan dengan siapa kebersamaan tersebut berlangsung.
- source_word: τῷ Χριστῷ
  choice: dengan Mesias
  rationale: 'Χριστός masih berfungsi sebagai gelar yang berarti Yang Diurapi. “Mesias” mempertahankan makna gelar tersebut, sedangkan datifnya menyatakan persekutuan: dihidupkan bersama-sama dengan Mesias.'
- source_word: χάριτί
  choice: karena anugerah
  rationale: Datif ini menunjuk dasar atau sarana keselamatan. Dalam bahasa Indonesia, “karena anugerah” alami dan tepat, serta mempertahankan penekanan bahwa keselamatan berasal dari pemberian Allah yang tidak layak diterima.
- source_word: ἐστε σεσῳσμένοι
  choice: kamu telah diselamatkan
  rationale: Bentuk perfektum perifrastik menekankan keadaan kini sebagai hasil tindakan yang telah terjadi. “Telah diselamatkan” mempertahankan aspek hasil dan bentuk pasif; “kamu” membedakan orang kedua jamak dari “kita” sebelumnya.
theological_decisions:
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap dapat didengar sebagai gelar, sehingga “Mesias” mempertahankan arti ‘Yang Diurapi’ tanpa menjadikannya sekadar nama diri.
- issue: Daya retoris klausa χάριτί ἐστε σεσῳσμένοι
  choice: dipertahankan sebagai sisipan yang diapit tanda pisah
  alternative: digabungkan lancar ke dalam kalimat tanpa penandaan khusus
  rationale: Sisipan Paulus yang mendadak menonjolkan anugerah dan mengantisipasi penjelasan dalam ayat 8–9. Tanda pisah mempertahankan bentuk retoris itu tanpa menambahkan tafsiran.
- issue: Nuansa partisip ὄντας
  choice: ketika
  alternative: meskipun
  rationale: Konteks memungkinkan nuansa temporal dan konsesif. “Ketika” mempertahankan hubungan keadaan dengan tindakan utama tanpa menutup kemungkinan adanya daya konsesif dari keseluruhan kalimat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Pelanggaran-pelanggaran” mempertahankan bentuk jamak sumber; “anugerah” dipilih sebagai istilah teologis yang lazim. Kapitalisasi “Ia” mengikuti gaya hormat Indonesia untuk rujukan kepada Allah. Tanda pisah mempertahankan sisipan retoris teks Yunani.
