reference: Ephesians 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: id
  text: Sebab kita adalah hasil karya-Nya, diciptakan dalam Mesias Yesus[a] untuk melakukan perbuatan-perbuatan baik yang telah Allah persiapkan sebelumnya supaya kita menjalaninya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: Kristus Yesus. “Kristus” adalah gelar yang berarti “Yang Diurapi,” sepadan dengan “Mesias.”'
    reason: translation_of_title
  - marker: b
    text: Secara harfiah, “supaya kita berjalan di dalamnya.” Bahasa “berjalan” menunjuk pada cara hidup atau perilaku seseorang.
    reason: lexical_metaphor
lexical_decisions:
- source_word: αὐτοῦ γάρ ἐσμεν ποίημα
  choice: Sebab kita adalah hasil karya-Nya
  rationale: “Sebab” mempertahankan hubungan penjelas γάρ dengan ayat sebelumnya. “Hasil karya-Nya” menyampaikan ποίημα sebagai sesuatu yang dibuat Allah dengan bahasa Indonesia yang alami dan tidak mekanis.
- source_word: κτισθέντες
  choice: diciptakan
  rationale: Bentuk partisip pasif aoris ini menerangkan umat sebagai ciptaan Allah; bentuk ringkas “diciptakan” tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: “Dalam” mempertahankan bahasa kesatuan atau lingkup dari ἐν, sedangkan Χριστός diterjemahkan sebagai gelar “Mesias,” bukan diperlakukan semata-mata sebagai nama diri.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: untuk melakukan perbuatan-perbuatan baik
  rationale: ἐπί dengan datif di sini menyatakan tujuan atau hasil yang dimaksud. Penambahan “melakukan” membuat hubungan itu alami dalam bahasa Indonesia tanpa mengubah isi etis ἔργα ἀγαθά.
- source_word: οἷς προητοίμασεν ὁ θεὸς
  choice: yang telah Allah persiapkan sebelumnya
  rationale: Kata ganti relatif tetap merujuk kepada perbuatan-perbuatan baik. “Sebelumnya” menyatakan unsur temporal dari awalan προ- tanpa memperluasnya menjadi sistem teologis tertentu.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: supaya kita menjalaninya
  rationale: “Supaya” menyatakan tujuan ἵνα. “Menjalaninya” mengungkapkan idiom περιπατέω tentang cara hidup, sekaligus mempertahankan gema metafora berjalan melalui catatan kaki.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam frasa ini Χριστός masih membawa makna gelar Sang Terurapi. “Mesias” menerjemahkan makna gelar tersebut, sedangkan catatan kaki mencantumkan bentuk Yunani dan padanan tradisionalnya.
- issue: Hubungan persiapan ilahi dengan ketaatan manusia
  choice: perbuatan-perbuatan baik yang telah Allah persiapkan sebelumnya supaya kita menjalaninya
  alternative: perbuatan-perbuatan baik yang sebelumnya telah Allah persiapkan untuk kita lakukan
  rationale: Rumusan ini mempertahankan baik prakarsa Allah maupun tujuan agar umat sungguh menjalani perbuatan-perbuatan itu, tanpa menyelesaikan perdebatan teologis yang melampaui pernyataan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. “Hasil karya-Nya” dipilih daripada bentuk yang lebih kaku, sedangkan “menjalaninya” menghindari ungkapan harfiah “berjalan di dalamnya” yang kurang alami; metafora sumber tetap dijelaskan dalam catatan kaki.
