  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: id
  text: Di dalam pelanggaran-pelanggaran dan dosa-dosa itu dahulu kamu hidup, mengikuti zaman dunia ini,[a] mengikuti penguasa atas kuasa udara, [b]roh yang sekarang bekerja di dalam anak-anak ketidaktaatan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengikuti arus dunia ini.” Kata Yunani yang diterjemahkan “zaman” menekankan masa atau pola dunia sekarang.
    reason: lexical_alternative
  - marker: b
    text: “Udara” mencerminkan cara dunia kuno berbicara tentang ranah yang dikaitkan dengan kuasa-kuasa rohani yang memusuhi Allah.
    reason: cultural_note
  - marker: c
    text: “Anak-anak ketidaktaatan” berarti orang-orang yang dicirikan oleh ketidaktaatan.
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐν αἷς
  choice: Di dalam dosa-dosa itu
  rationale: Pronomina relatif feminin jamak merujuk kembali kepada pelanggaran-pelanggaran dan dosa-dosa pada ayat 1. Penyebutan 'dosa-dosa' menghasilkan rujukan yang jelas dan alami dalam bahasa Indonesia.
- source_word: ποτε περιεπατήσατε
  choice: dahulu kamu hidup
  rationale: ποτε menandai cara hidup pada masa lampau, sedangkan περιπατέω dipakai secara metaforis untuk perilaku atau cara hidup. 'Hidup' menyampaikan metafora itu secara wajar tanpa memberi kesan berjalan secara harfiah.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: mengikuti zaman dunia ini
  rationale: κατά menyatakan kesesuaian atau pengarahan menurut suatu pola, dan αἰών dibedakan dari κόσμος dengan diterjemahkan 'zaman', bukan dilebur menjadi 'dunia'.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: penguasa yang berkuasa di udara
  rationale: Ungkapan ini mempertahankan ἄρχων sebagai 'penguasa', memahami genitif ἐξουσίας sebagai lingkup kekuasaan, dan tetap menerjemahkan ἀήρ secara harfiah sebagai 'udara'. Rumusan ini lebih alami daripada 'penguasa dari wewenang udara'.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: yaitu roh yang sekarang bekerja
  rationale: Kata 'yaitu' menandai hubungan penjelas atau aposisional yang dimungkinkan oleh rangkaian genitif Yunani, tanpa menetapkan lebih jauh apakah roh itu identik sepenuhnya dengan penguasa atau merupakan kuasa di bawahnya. Huruf kecil dipakai karena konteksnya bukan Roh Kudus.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: di dalam anak-anak ketidaktaatan
  rationale: Ungkapan Semitis dipertahankan sedekat mungkin. 'Anak-anak' mencakup orang-orang yang dicirikan oleh ketidaktaatan, sedangkan 'di dalam' mempertahankan ἐν dan cocok dengan tindakan roh yang bekerja dalam diri mereka.
theological_decisions:
- issue: Hubungan 'roh yang sekarang bekerja' dengan 'penguasa yang berkuasa di udara'
  choice: Menggunakan 'yaitu' untuk menunjukkan bahwa frasa tentang roh menjelaskan penguasa atau kuasa yang baru disebut.
  alternative: Memahaminya sebagai makhluk kedua yang sama sekali terpisah, sebagai nama lain yang secara tegas identik dengan Iblis, atau sebagai kekuatan impersonal di bawah penguasa tersebut.
  rationale: Susunan artikel dan genitif Yunani mendukung hubungan penjelas, tetapi tidak menentukan ontologi hubungan itu secara tuntas. Terjemahan menjaga keterkaitan sekaligus tidak menyelesaikan ketegangan tersebut secara dogmatis.
- issue: Makna idiom υἱοῖς τῆς ἀπειθείας
  choice: Menerjemahkannya sebagai 'anak-anak ketidaktaatan' dan menjelaskan idiom itu dalam catatan kaki.
  alternative: orang-orang yang tidak taat
  rationale: Bentuk idiomatis sumber dipertahankan agar citra dan tekanannya tidak diratakan menjadi sekadar kata sifat, sementara catatan menjamin kejelasan bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur paralel 'mengikuti ... mengikuti ...' mempertahankan dua frasa κατά. Istilah 'udara' dan 'anak-anak ketidaktaatan' sengaja dipertahankan karena penting bagi citra sumber, lalu diterangkan melalui catatan kaki.
