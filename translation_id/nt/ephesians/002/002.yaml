revisions:
- from: Di dalam dosa-dosa itu dahulu kamu hidup, mengikuti zaman dunia ini,[a] mengikuti penguasa yang berkuasa di udara,[b] yaitu roh yang sekarang bekerja di dalam anak-anak ketidaktaatan.[c]
  to: Di dalam pelanggaran-pelanggaran dan dosa-dosa itu dahulu kamu hidup, mengikuti zaman dunia ini,[a] mengikuti penguasa atas kuasa udara, [b]roh yang sekarang bekerja di dalam anak-anak ketidaktaatan.[c]
  rationale: Rujukan relatif diperjelas dengan menyebut kedua nomina pendahuluan, “pelanggaran-pelanggaran dan dosa-dosa,” sebagaimana rujukan ἐν αἷς. “Penguasa atas kuasa udara” mempertahankan ἄρχοντα dan ἐξουσίας sebagai unsur yang berbeda, sekaligus tetap dapat dibaca dengan wajar. Penanda “yaitu” dihapus agar hubungan roh dengan penguasa/kuasa tidak ditentukan melampaui teks.
