  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: id
  text: Karena itu, ingatlah bahwa dahulu kamu adalah orang-orang bukan Yahudi secara jasmani[a], yang disebut “tidak bersunat” oleh golongan yang disebut “sunat”[b], yaitu sunat yang dikerjakan oleh tangan manusia pada daging[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kamu yang dahulu adalah bangsa-bangsa lain menurut daging.” Ungkapan ini menunjuk kepada orang-orang non-Yahudi berdasarkan identitas lahiriah mereka.
    reason: lexical_alternative
  - marker: b
    text: “Tidak bersunat” dan “sunat” di sini merupakan sebutan kolektif yang berkaitan dengan identitas etnis dan perjanjian, bukan sekadar keterangan anatomi.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “yang dibuat oleh tangan pada daging.” Ungkapan ini dapat mengandung kritik terhadap sunat yang hanya bersifat lahiriah.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan atau peralihan yang ditarik dari uraian sebelumnya dengan ungkapan Indonesia yang wajar.
- source_word: μνημονεύετε
  choice: ingatlah
  rationale: Menerjemahkan imperatif kini jamak secara alami sebagai perintah kepada para pembaca.
- source_word: ποτὲ ὑμεῖς
  choice: dahulu kamu
  rationale: Mempertahankan kontras waktu serta penekanan pada para pembaca non-Yahudi.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa lain
  rationale: Dalam pertentangan Yahudi dan non-Yahudi di sini, istilah tersebut menunjuk kepada bangsa-bangsa non-Yahudi; pilihan ini tetap dekat dengan bentuk Yunani tanpa menjadikannya istilah geopolitik semata.
- source_word: ἐν σαρκί
  choice: menurut daging
  rationale: Mempertahankan istilah konkret Paulus dan menunjuk pada keadaan jasmani serta identitas lahiriah, bukan pada tabiat berdosa.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: disebut “tidak bersunat”
  rationale: Mempertahankan pelabelan pasif dan bentuk sebutan kolektif, bukan hanya uraian anatomi.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: oleh apa yang disebut “sunat”
  rationale: Menggemakan pengulangan λεγόμενοι/λεγομένης dan menjaga jarak retoris Paulus terhadap kedua label tersebut tanpa memperkerasnya menjadi sindiran.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: yang dilakukan pada daging oleh tangan manusia
  rationale: Menghubungkan χειροποιήτου erat dengan sunat dan menyampaikan bahwa tindakan itu bersifat jasmani serta dikerjakan manusia.
theological_decisions:
- issue: Makna σάρξ dalam konteks ini
  choice: menurut daging / pada daging
  alternative: secara jasmani / pada tubuh
  rationale: Konteks membahas status lahiriah-etnis dan tindakan sunat secara fisik, bukan kerusakan moral. Terjemahan mempertahankan istilah 'daging' serta ketegangan ungkapan Paulus.
- issue: Daya retoris λεγομένης pada περιτομή
  choice: apa yang disebut “sunat”
  alternative: yang dinamakan “golongan bersunat” / yang disebut-sebut sebagai “sunat”
  rationale: Pilihan ini mempertahankan kesejajaran dengan 'disebut tidak bersunat' dan kemungkinan nada kritis terhadap penanda lahiriah, tanpa memberi kesan anti-Yahudi yang lebih kuat daripada teks.
- issue: Acuan χειροποιήτου
  choice: menerangkan sunat yang dilakukan oleh tangan manusia
  alternative: menerangkan kelompok yang disebut bersunat
  rationale: Bentuk gramatikalnya berkaitan dengan περιτομῆς dan menekankan sifat sunat lahiriah yang dikerjakan manusia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat dibiarkan terbuka dengan tanda pisah karena gagasan berlanjut ke ayat 12. Istilah 'daging' dipertahankan untuk menjaga hubungan verbal dalam teks Yunani, sementara catatan kaki menjelaskan makna jasmani dan sosialnya.
