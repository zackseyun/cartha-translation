  to: Karena itu, ingatlah bahwa dahulu kamu adalah orang-orang bukan Yahudi secara jasmani[a], yang disebut “tidak bersunat” oleh golongan yang disebut “sunat”[b], yaitu sunat yang dikerjakan oleh tangan manusia pada daging[c]—
  rationale: 'Revisi ini memperbaiki kelancaran dan kejelasan sintaksis Indonesia, terutama dengan menerjemahkan τὰ ἔθνη sebagai orang-orang non-Yahudi dalam konteksnya. Istilah dan ketegangan retoris sumber tetap dipertahankan: kedua pihak diberi label “disebut,” sedangkan sunat digambarkan sebagai tindakan lahiriah yang dikerjakan tangan manusia. Tanda pisah akhir dipertahankan karena konstruksi Yunani berlanjut ke ayat berikutnya.'
