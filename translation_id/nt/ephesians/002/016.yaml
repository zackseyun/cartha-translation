  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: id
  text: dan supaya Ia mendamaikan keduanya dengan Allah dalam satu tubuh melalui salib, dengan membunuh permusuhan itu di dalamnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “di dalamnya” dapat merujuk kepada salib, kepada Kristus (“di dalam Dia”), atau, secara gramatikal, kepada satu tubuh. Rujukannya diperdebatkan.
    reason: Mempertahankan ambiguitas rujukan ἐν αὐτῷ dan makna dasar preposisi ἐν, tanpa memaksakan penafsiran tertentu.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: mendamaikan
  rationale: Menyampaikan tindakan memulihkan hubungan yang telah rusak; bentuk “supaya Ia mendamaikan” mempertahankan fungsi tujuan dari bentuk subjungtif dalam rangkaian kalimat.
- source_word: τοὺς ἀμφοτέρους
  choice: keduanya
  rationale: Menjaga rujukan kepada kedua kelompok yang telah disebutkan dalam konteks tanpa menambahkan penafsiran ke dalam teks ayat.
- source_word: ἐν ἑνὶ σώματι
  choice: dalam satu tubuh
  rationale: Terjemahan langsung yang mempertahankan metafora dan tidak menentukan secara berlebihan apakah penekanannya pada tubuh Kristus atau komunitas yang dipersatukan.
- source_word: διὰ τοῦ σταυροῦ
  choice: melalui salib
  rationale: Menunjukkan salib sebagai sarana pendamaian dengan ungkapan Indonesia yang alami dan setia pada διά dengan genitif.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: setelah mematikan permusuhan itu
  rationale: Mempertahankan gambaran kuat bahwa permusuhan dibunuh, bukan sekadar dikurangi atau dihapuskan.
- source_word: ἐν αὐτῷ
  choice: melaluinya
  rationale: Kata ganti tersebut paling wajar menunjuk kembali kepada salib dan menyatakan sarana; bentuk pronominal dipertahankan agar tidak mengulang kata “salib” secara berat.
theological_decisions:
- issue: Identitas “keduanya”
  choice: keduanya
  alternative: kedua pihak, yaitu orang Yahudi dan bukan Yahudi
  rationale: Konteks menunjuk kepada orang Yahudi dan bukan Yahudi, tetapi ayat ini sendiri memakai ungkapan pronominal; terjemahan tidak memasukkan penjelasan kontekstual ke dalam teks.
- issue: Rujukan ἐν αὐτῷ
  choice: 'dipahami sebagai salib: “melaluinya”'
  alternative: “di dalam diri-Nya,” dengan rujukan kepada Kristus
  rationale: Anteceden gramatikal terdekat yang sesuai ialah σταυρός (“salib”), dan pengertian instrumental cocok dengan konteks. Namun, bentuk Yunani memungkinkan pembaca mempertimbangkan rujukan lain, sehingga ambiguitas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan “supaya Ia” mempertahankan hubungan tujuan dengan konteks sebelumnya; kapitalisasi “Ia” mengikuti kebiasaan umum dalam teks Alkitab bahasa Indonesia untuk rujukan kepada Kristus.
