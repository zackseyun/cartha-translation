id: EPH.2.12
reference: Ephesians 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: id
  text: bahwa pada waktu itu kamu hidup tanpa Mesias[a], terasing dari kewargaan Israel dan menjadi orang asing bagi perjanjian-perjanjian yang berkaitan dengan janji[b], tanpa pengharapan dan tanpa Allah[c] di dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”. Kata Yunani Χριστός adalah gelar yang berarti “Yang Diurapi”; dalam konteks Israel dan perjanjian, gelar itu dapat diterjemahkan “Mesias”.
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “perjanjian-perjanjian dari janji”; dapat juga diterjemahkan “perjanjian-perjanjian yang mengandung janji”.'
    reason: lexical_alternative
  - marker: c
    text: “Tanpa Allah” dapat juga dipahami sebagai “tidak mengenal Allah” atau “tidak berhubungan dengan Allah”; ungkapan ini tidak harus berarti ateis dalam pengertian filsafati modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: tanpa Mesias
  rationale: Χριστός digunakan sebagai gelar dalam konteks Israel dan perjanjian; “Mesias” mempertahankan makna gelar itu, bukan memperlakukannya sekadar sebagai nama diri.
- source_word: ἀπηλλοτριωμένοι
  choice: terasing
  rationale: Partisip perfekt pasif ini menyatakan keadaan terpisah atau tersisih yang telah berlangsung; “terasing” mempertahankan nuansa relasional dan sosialnya.
- source_word: πολιτείας τοῦ Ἰσραήλ
  choice: persekutuan Israel
  rationale: πολιτεία menunjuk pada tatanan atau komunitas kewargaan Israel secara kolektif. “Persekutuan Israel” alami dalam bahasa Indonesia dan lebih luas daripada status hukum “kewarganegaraan” semata.
- source_word: ξένοι
  choice: orang asing bagi
  rationale: Ungkapan ini menggambarkan orang yang berada di luar lingkup sosial-perjanjian; konstruksi “orang asing bagi” mempertahankan hubungan dengan frasa genitif berikutnya.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: perjanjian-perjanjian yang berkaitan dengan janji
  rationale: Bentuk jamak διαθηκῶν dan bentuk tunggal ἐπαγγελίας dipertahankan. Frasa relatif membuat hubungan genitif yang padat itu jelas tanpa menyamakannya menjadi sekadar “janji-janji perjanjian.”
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: tanpa pengharapan
  rationale: Terjemahan ini ringkas, alami, dan menyampaikan keadaan tidak memiliki pengharapan.
- source_word: ἄθεοι
  choice: tanpa Allah
  rationale: Dalam konteks ini kata tersebut terutama menunjukkan keadaan tanpa Allah yang benar, bukan ateisme sebagai posisi filsafati modern.
- source_word: ἐν τῷ κόσμῳ
  choice: di dunia
  rationale: Padanan langsung dan alami untuk dunia sebagai ruang kehidupan manusia.
- source_word: ὅτι ... ἦτε τῷ καιρῷ ἐκείνῳ
  choice: bahwa pada waktu itu kamu hidup
  rationale: “Bahwa” mempertahankan ketergantungan ayat ini pada perintah untuk mengingat dalam ayat sebelumnya; penambahan “hidup” menghasilkan kalimat Indonesia yang alami tanpa mengubah keadaan lampau yang dimaksud.
theological_decisions:
- issue: Penerjemahan Χριστός dalam konteks Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Konteks Israel, perjanjian, dan janji menonjolkan fungsi Χριστός sebagai gelar bagi Yang Diurapi; “Mesias” mempertahankan kaitan Yahudi-perjanjian itu.
- issue: Makna ἄθεοι
  choice: tanpa Allah
  alternative: tidak mengenal Allah; fasik; ateis
  rationale: “Tanpa Allah” mempertahankan rumusan yang kuat sekaligus tidak menyempitkannya menjadi ateisme filosofis atau sekadar perilaku fasik.
- issue: Hubungan genitif dalam διαθηκῶν τῆς ἐπαγγελίας
  choice: perjanjian-perjanjian yang berkaitan dengan janji
  alternative: perjanjian-perjanjian janji; perjanjian-perjanjian yang mengandung janji
  rationale: Bahasa Yunani tidak menjelaskan secara mutlak jenis hubungan genitif tersebut. Rumusan yang dipilih mempertahankan keterkaitan tanpa menetapkan bahwa janji itu isi, sumber, atau sifat perjanjian secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur ayat tetap terhubung dengan konteks sebelumnya melalui “bahwa”. Bentuk jamak “perjanjian-perjanjian” dipertahankan, dan ambiguitas hubungan antara perjanjian dan janji dijelaskan dalam catatan kaki.
