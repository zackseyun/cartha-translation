id: EPH.2.13
reference: Ephesians 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: id
  text: Namun sekarang, di dalam Mesias Yesus[a], kalian yang dahulu jauh[b] telah menjadi dekat[c] oleh darah Mesias[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam Kristus Yesus.” Kata Yunani Christos merupakan gelar yang berarti “Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Atau “berada jauh.”
    reason: lexical_alternative
  - marker: c
    text: Atau “telah didekatkan.”
    reason: lexical_alternative
  - marker: d
    text: Atau “melalui darah Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: Menjaga peralihan yang berlawanan melalui δέ sekaligus penekanan waktu pada νυνί, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: “Di dalam” mempertahankan bahasa Paulus tentang persatuan atau lingkup keberadaan, sedangkan Χριστός diterjemahkan sebagai gelar “Mesias,” bukan sekadar dialihaksarakan.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: kalian yang dahulu
  rationale: “Kalian” menyatakan bahwa ὑμεῖς berbentuk jamak; “yang dahulu” menyampaikan keadaan sebelumnya yang ditandai oleh ποτε dan ὄντες tanpa menghasilkan ungkapan yang kaku.
- source_word: μακρὰν
  choice: jauh
  rationale: Padanan adverbial yang ringkas dan alami, serta tetap memungkinkan makna jarak yang bersifat relasional dan perjanjian dalam konteks.
- source_word: ἐγενήθητε ἐγγὺς
  choice: telah menjadi dekat
  rationale: Mencerminkan secara langsung gagasan perubahan keadaan pada ἐγενήθητε tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: ἐν τῷ αἵματι
  choice: oleh darah
  rationale: Menafsirkan ἐν secara instrumental sebagai sarana, tetapi catatan kaki mempertahankan kemungkinan padanan “melalui.”
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός diperlakukan sebagai gelar dan diterjemahkan menurut maknanya. Hubungan genetif dengan αἵματι dinyatakan secara alami sebagai “darah Mesias.”
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar yang bermakna “Mesias.” Pilihan ini menyampaikan maknanya tanpa memasukkan kekhasan denominasi; bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Daya ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: 'instrumental: “oleh darah Mesias”'
  alternative: “melalui darah Mesias” atau secara lebih harfiah “di dalam darah Mesias”
  rationale: Dalam konteks ini frasa tersebut paling wajar menunjukkan sarana yang dengannya mereka menjadi dekat. Rumusan ini tidak menjabarkan teori pendamaian tertentu melampaui pernyataan teks.
- issue: Daya ἐγενήθητε
  choice: “telah menjadi dekat”
  alternative: “telah didekatkan”
  rationale: Bentuk tersebut menyatakan peralihan ke keadaan baru dan dapat diterjemahkan tanpa menyebut pelaku. Alternatif pasif dapat mengisyaratkan tindakan Allah, tetapi teks tidak menyebut pelakunya dalam klausa ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. “Kalian” dipilih untuk memperjelas bahwa sapaan Yunani berbentuk jamak. Ungkapan “di dalam” sengaja dipertahankan karena merupakan bahasa teologis khas Paulus, sedangkan “telah menjadi dekat” mempertahankan perubahan keadaan tanpa menyelesaikan secara diam-diam persoalan pelaku.
