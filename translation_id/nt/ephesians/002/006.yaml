  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan kedua verba berawalan συν- sebagai tindakan Allah yang melibatkan “kita” bersama Kristus: “membangkitkan kita bersama Dia” dan “mendudukkan kita bersama Dia.” “Di tempat-tempat surgawi” mempertahankan bentuk lokatif jamak dari ἐν τοῖς ἐπουρανίοις, dan “dalam Mesias Yesus” mempertahankan frasa ἐν Χριστῷ Ἰησοῦ tanpa mempersempit cakupannya.'
