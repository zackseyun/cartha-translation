reference: Ephesians 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: id
  text: dan membangkitkan kita bersama Dia serta mendudukkan kita bersama Dia di tempat-tempat surgawi dalam Mesias Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγειρεν
  choice: membangkitkan kita bersama Dia
  rationale: Kata kerja majemuk dengan awalan συν- menyatakan bahwa kita ikut serta bersama Kristus dalam tindakan membangkitkan; objek “kita” diperoleh dari konteks kalimat sebelumnya.
- source_word: συνεκάθισεν
  choice: mendudukkan kita bersama Dia
  rationale: Kata ini berarti membuat duduk bersama. Pilihan ini mempertahankan tindakan Allah dan unsur kebersamaan tanpa mempersempit maknanya menjadi penobatan.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: di tempat-tempat surgawi
  rationale: Ungkapan khas Efesus ini menunjuk pada ranah atau tempat surgawi. Bentuk ini cukup harfiah sekaligus dapat dipahami dalam bahasa Indonesia modern.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Χριστός tetap membawa makna gelar ‘Mesias’; preposisi ἐν dipertahankan sebagai “dalam” untuk menjaga bahasa persatuan dengan Mesias.
- source_word: καὶ
  choice: dan … serta
  rationale: Konjungsi yang berulang menghubungkan dua tindakan Allah secara kumulatif; variasi “dan … serta” menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan gramatikalnya.
theological_decisions:
- issue: Bahasa persatuan dengan Kristus dalam kedua kata kerja berawalan συν-
  choice: Menyatakan unsur kebersamaan secara eksplisit dengan “bersama Dia” pada kedua kata kerja.
  alternative: “membangkitkan kita dan mendudukkan kita” tanpa menyebutkan “bersama Dia”.
  rationale: Awalan συν- pada kedua kata kerja menekankan keikutsertaan umat bersama Kristus dalam kebangkitan dan kedudukan-Nya; penyebutan eksplisit mempertahankan tekanan teks Yunani.
- issue: Χριστῷ sebagai gelar atau bentuk nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Terjemahan “Mesias” mengungkapkan arti gelar Χριστός dan tidak menjadikannya sekadar unsur nama, sementara kemungkinan tradisional “Kristus Yesus” tetap diakui.
- issue: Cakupan ἐν Χριστῷ Ἰησοῦ
  choice: Mempertahankan frasa pada akhir ayat tanpa menentukan secara eksplisit apakah frasa itu terutama menerangkan tindakan mendudukkan atau keseluruhan tindakan.
  alternative: Mengatur ulang kalimat sehingga “dalam Mesias Yesus” jelas hanya menerangkan salah satu tindakan atau secara tegas menerangkan keduanya.
  rationale: Susunan Yunani memungkinkan frasa akhir itu memiliki cakupan yang luas; terjemahan tidak boleh menyelesaikan ambiguitas tersebut secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Dia” memakai huruf kapital sebagai rujukan pronominal kepada Kristus. Tidak ada catatan kaki karena alternatif leksikal dapat dicatat dalam data keputusan tanpa diperlukan untuk memahami teks utama.
