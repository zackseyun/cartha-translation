  text: οὐκ ἐξ ἔργων, ἵνα μή τις καυχήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: id
  text: bukan berasal dari perbuatan[a], supaya tidak seorang pun dapat membanggakan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari perbuatan.” Ungkapan ini menunjukkan sumber atau asal; sebagian penafsir memahaminya dengan nuansa sarana (“oleh perbuatan”), tetapi susunan Yunaninya secara lebih harfiah berarti “dari perbuatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: bukan berasal dari
  rationale: Gabungan ini menyangkal sumber atau asal. “Bukan berasal dari” menyampaikan daya dasar ἐξ secara alami dalam bahasa Indonesia dan tetap terkait dengan pernyataan sebelumnya.
- source_word: ἔργων
  choice: perbuatan
  rationale: “Perbuatan” merupakan padanan umum dan luas bagi ἔργων. Terjemahan ini tidak mempersempitnya menjadi “perbuatan hukum Taurat” atau memperluasnya menjadi “usaha manusia,” yang tidak dinyatakan secara eksplisit dalam teks.
- source_word: ἵνα μή τις
  choice: supaya tidak seorang pun
  rationale: Ungkapan ini menyampaikan tujuan atau hasil negatif secara jelas dan wajar, tanpa memberi batasan gender pada τις.
- source_word: καυχήσηται
  choice: dapat membanggakan diri
  rationale: “Membanggakan diri” mempertahankan gagasan bermegah mengenai diri sendiri. “Dapat” menghasilkan konstruksi Indonesia yang alami setelah “supaya tidak seorang pun” dan mencerminkan bentuk subjungtif dalam klausa tujuan.
theological_decisions:
- issue: Cakupan makna ἔργων
  choice: Mempertahankan istilah luas “perbuatan.”
  alternative: “perbuatan hukum Taurat,” “usaha manusia,” atau “perbuatan baik”
  rationale: Teks Yunani hanya menyebut ἔργων. Menambahkan pembatas atau penjelasan tersebut akan menyelesaikan pertanyaan tafsir yang sengaja tidak ditentukan oleh ungkapan ini.
- issue: Nuansa ἐξ
  choice: Menyatakan sumber atau asal dengan “berasal dari.”
  alternative: “oleh” atau “karena”
  rationale: ἐξ terutama menandai sumber atau asal dalam susunan ini. Padanan instrumental mungkin dipahami oleh sebagian penafsir, tetapi tidak perlu dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Frasa “bukan berasal dari” dipilih agar nuansa sumber pada ἐξ terdengar jelas; “membanggakan diri” alami bagi pembaca umum dan mempertahankan ketajaman istilah Paulus.
