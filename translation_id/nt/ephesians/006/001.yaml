base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: id
  text: Anak-anak, taatilah orang tuamu dalam Tuhan[a], sebab itulah yang benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai orang yang menjadi milik Tuhan” atau “dalam persatuan dengan Tuhan.” Ungkapan “dalam Tuhan” dapat menerangkan lingkup atau cara ketaatan dan mungkin juga menyiratkan bahwa ketaatan itu dibatasi oleh kesetiaan kepada Tuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Anak-anak
  rationale: Bentuk sapaan jamak ini menyapa langsung anggota rumah tangga yang berstatus sebagai anak. “Anak-anak” merupakan padanan Indonesia yang alami dan mempertahankan hubungan kekeluargaan tanpa perlu memperluasnya menjadi “anak laki-laki dan perempuan”.
- source_word: ὑπακούετε
  choice: taatilah
  rationale: Imperatif kini aktif ini menuntut ketaatan yang nyata dan berkelanjutan, bukan sekadar mendengar. “Taatilah” menyampaikan daya perintahnya secara wajar dalam bahasa Indonesia.
- source_word: τοῖς γονεῦσιν ὑμῶν
  choice: orang tuamu
  rationale: Kata benda jamak γονεῦσιν menunjuk secara kolektif kepada ayah dan ibu. “Orang tuamu” adalah ungkapan Indonesia yang tepat dan idiomatis.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: 'Ungkapan ringkas Paulus ini dipertahankan agar nuansanya tetap terbuka: dapat menunjuk pada lingkup, cara, atau dasar ketaatan dalam hubungan dengan Tuhan, serta mungkin menyiratkan bahwa kesetiaan kepada Tuhan menjadi batasnya.'
- source_word: δίκαιον
  choice: benar
  rationale: Dalam konteks etis ini, kata tersebut menyatakan apa yang tepat atau patut secara moral. “Benar” jelas, alami, dan tidak mempersempit maknanya hanya pada keadilan hukum.
theological_decisions:
- issue: Cakupan ungkapan “dalam Tuhan”
  choice: 'Ungkapan itu dilekatkan pada perintah: “taatilah orang tuamu dalam Tuhan,” dengan keterbukaan maknanya tetap dipertahankan.'
  alternative: Ungkapan itu dapat menerangkan identitas anak-anak sebagai orang yang berada dalam Tuhan, atau menyatakan bahwa mereka harus taat dengan cara yang sesuai dengan hubungan mereka dengan Tuhan.
  rationale: Susunan Yunani paling alami mengaitkan ἐν κυρίῳ dengan kata perintah ὑπακούετε, tetapi nuansa tepatnya tidak dinyatakan secara tegas. Terjemahan yang ringkas tidak menentukan secara sepihak apakah yang dimaksud ialah identitas anak-anak, lingkup atau cara ketaatan, atau batas tersirat berdasarkan kesetiaan kepada Tuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Bentuk “taatilah” mempertahankan daya imperatif, sedangkan “dalam Tuhan” mempertahankan ungkapan Paulus tanpa menjelaskan ambiguitasnya secara berlebihan.
