id: EPH.6.16
reference: Ephesians 6:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: id
  text: Dalam segala keadaan, angkatlah perisai iman. Dengan perisai itu kalian akan sanggup memadamkan semua anak panah[a] berapi[b] dari si Jahat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “senjata-senjata lontar”; kata Yunani yang dipakai merupakan istilah umum bagi benda yang dilontarkan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “yang telah dibuat menyala” atau “yang telah dibakar.”
    reason: literal_rendering
  - marker: c
    text: Atau “kejahatan”; bentuk Yunani dapat dipahami secara abstrak, meskipun konteks peperangan rohani mendukung makna personal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Dalam segala keadaan
  rationale: Ungkapan ini dipahami secara adverbial sebagai ‘dalam setiap keadaan/situasi’, sesuai konteks rangkaian perlengkapan senjata, bukan secara kaku ‘dalam segala sesuatu’.
- source_word: ἀναλαβόντες
  choice: angkatlah
  rationale: Partisip aoris ini menyertai rangkaian nasihat dalam konteks dan paling wajar diungkapkan sebagai perintah lanjutan dalam bahasa Indonesia.
- source_word: θυρεὸν τῆς πίστεως
  choice: perisai iman
  rationale: θυρεός menunjuk pada perisai, khususnya perisai besar; bentuk ringkas ‘perisai iman’ mempertahankan metafora dan hubungan genitif tanpa menambahkan tafsiran.
- source_word: ἐν ᾧ
  choice: Dengan perisai itu
  rationale: Preposisi memiliki makna instrumental dan pronomina relatif merujuk kembali kepada perisai. Pengulangan nomina membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: δυνήσεσθε
  choice: kalian akan sanggup
  rationale: Bentuk futurum menyatakan kesanggupan yang akan dimiliki para pembaca; ‘kalian’ mempertahankan bentuk orang kedua jamak.
- source_word: βέλη
  choice: anak panah
  rationale: βέλη adalah istilah umum bagi benda atau senjata yang dilontarkan. ‘Anak panah’ paling mudah dipahami dan sesuai dengan gambaran peperangan, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: πεπυρωμένα
  choice: berapi
  rationale: Partisip perfek pasif berarti telah dinyalakan atau dibuat terbakar. ‘Berapi’ menyampaikan hasil keadaan itu secara ringkas dan alami.
- source_word: τοῦ πονηροῦ
  choice: si Jahat
  rationale: Bentuk berartikel dalam konteks peperangan rohani paling mungkin merujuk secara personal kepada pihak yang jahat. Kemungkinan makna abstrak tetap dicatat.
- source_word: σβέσαι
  choice: memadamkan
  rationale: Kata ini berarti memadamkan atau membuat api berhenti menyala; pilihan ini jelas dan mempertahankan hubungan dengan anak panah berapi.
theological_decisions:
- issue: Makna τοῦ πονηροῦ
  choice: si Jahat
  alternative: kejahatan
  rationale: Konteks serangan dalam peperangan rohani mendukung pembacaan personal, tetapi bentuk Yunani juga dapat dipahami secara abstrak; ambiguitas itu dipertahankan dalam catatan kaki.
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam metafora ini, ‘iman’ paling wajar menunjuk pada sikap percaya dan bersandar kepada Allah. ‘Kepercayaan’ dapat mengungkapkan nuansanya, sedangkan ‘kesetiaan’ secara leksikal mungkin tetapi kurang sesuai dengan konteks ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. ‘Kalian’ dipakai untuk menunjukkan bahwa sapaan Yunani berbentuk jamak. Ayat dibagi menjadi dua kalimat agar hubungan alat (‘dengan perisai itu’) jelas tanpa mengubah alur metaforanya.
