  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: id
  text: supaya segala sesuatu berjalan baik bagimu dan engkau berumur panjang di bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tanah itu,” yang menggemakan rumusan perintah kelima dalam Keluaran 20:12 dan Ulangan 5:16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan maksud atau hasil yang terkait dengan janji pada perintah dalam ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya penghubungnya.
- source_word: εὖ σοι γένηται
  choice: keadaanmu baik
  rationale: Ungkapan Yunani ini berarti bahwa segala sesuatu berjalan atau berlangsung baik bagi orang yang disapa. 'Keadaanmu baik' menyampaikan maknanya secara ringkas dan wajar.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung yang mengaitkan kedua hasil yang dijanjikan.
- source_word: ἔσῃ μακροχρόνιος
  choice: umurmu panjang
  rationale: Secara harfiah mengandung gagasan 'engkau akan menjadi panjang umur'; ungkapan Indonesia 'umurmu panjang' menyampaikan arti 'berumur panjang' secara alami.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Mengikuti keluasan ungkapan Yunani sebagaimana tertulis dalam Efesus, tanpa memasukkan unsur kepemilikan atau pembatasan pada tanah perjanjian yang tidak dinyatakan di sini.
theological_decisions:
- issue: Cakupan ἐπὶ τῆς γῆς dalam hubungannya dengan janji pada perintah kelima
  choice: di bumi
  alternative: di negeri itu
  rationale: Teks Yunani Efesus memakai γῆ tanpa unsur yang secara khusus menunjuk pada negeri perjanjian. Terjemahan utama mempertahankan cakupan yang lebih luas, sementara gema rumusan Keluaran 20:12 dan Ulangan 5:16 dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan hubungan janji dengan ayat sebelumnya serta tidak mempersempit γῆ secara diam-diam.
