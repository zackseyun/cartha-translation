source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: id
  text: Sebab perjuangan kita bukanlah melawan darah dan daging[a], melainkan melawan para penguasa, melawan kuasa-kuasa, melawan para penguasa dunia dari kegelapan ini[b], dan melawan kekuatan-kekuatan rohani yang jahat di alam surgawi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertarungan kita bukanlah melawan darah dan daging.”
    reason: lexical_alternative
  - marker: b
    text: Atau “para penguasa dunia dari kegelapan masa kini.”
    reason: lexical_alternative
  - marker: c
    text: Atau “di tempat-tempat surgawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: perjuangan
  rationale: Kata ini menggambarkan pergumulan atau pertarungan jarak dekat. “Perjuangan” mempertahankan gagasan konflik dan terdengar wajar dalam bahasa Indonesia modern; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: melawan darah dan daging
  rationale: Urutan unsur mengikuti teks Yunani dan mempertahankan ungkapan konkret yang menunjuk kepada manusia fana, tanpa menggantinya dengan penafsiran eksplisit seperti “manusia”.
- source_word: ἀρχάς
  choice: para penguasa
  rationale: Dalam konteks ini istilah tersebut menunjuk pada kuasa-kuasa yang memerintah. “Para penguasa” jelas dan tidak memakai istilah tradisional yang kurang transparan.
- source_word: ἐξουσίας
  choice: para pemegang kuasa
  rationale: Pilihan ini mempertahankan unsur kewenangan atau kuasa serta membedakannya secara wajar dari ἀρχάς.
- source_word: κοσμοκράτορας
  choice: para penguasa dunia
  rationale: Terjemahan ini mempertahankan unsur majemuk κόσμος dan κρατέω secara transparan tanpa memperluasnya menjadi “kuasa kosmis”.
- source_word: τοῦ σκότους τούτου
  choice: dari kegelapan ini
  rationale: Frasa genitif ini menyatakan hubungan para penguasa dunia tersebut dengan “kegelapan ini”. “Dari” menjaga keluwesan hubungan itu tanpa menambahkan kata “sekarang” yang tidak eksplisit.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: kekuatan-kekuatan rohani yang jahat
  rationale: Adjektiva netral jamak digunakan secara substantival dan dalam konteks menunjuk pada kuasa atau kekuatan rohani. Bentuk “yang jahat” menyampaikan genitif kualitas secara alami.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: di alam surgawi
  rationale: Ungkapan ini berulang dalam Efesus dan menunjuk pada lingkup surgawi. “Alam surgawi” alami dalam bahasa Indonesia dan tidak membatasinya pada tempat-tempat tertentu.
theological_decisions:
- issue: Hakikat lawan yang disebutkan
  choice: Istilah-istilah itu diterjemahkan sebagai penguasa, pemegang kuasa, dan kekuatan rohani yang melampaui lawan manusia biasa.
  alternative: Istilah-istilah itu terutama menunjuk pada penguasa serta lembaga manusia, atau mencakup sekaligus kuasa rohani dan perwujudannya di dunia.
  rationale: Rangkaian istilah, terutama κοσμοκράτορας dan τὰ πνευματικὰ τῆς πονηρίας, secara langsung mengarah kepada lawan rohani. Namun terjemahan tidak menambahkan penjelasan yang menutup kemungkinan adanya manifestasi duniawi.
- issue: Makna σάρξ dalam ungkapan αἷμα καὶ σάρκα
  choice: Diterjemahkan secara konkret sebagai “daging”, bukan “natur berdosa”.
  alternative: “Natur berdosa” atau para lawan manusia.
  rationale: Di sini σάρξ merupakan bagian dari ungkapan tentang manusia fana dan bukan penggunaan teologis Paulus bagi kecenderungan berdosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “melawan” dipertahankan untuk mencerminkan anafora πρὸς dalam teks Yunani. Ungkapan “darah dan daging” mengikuti urutan sumber meskipun “darah dan daging” kurang idiomatis daripada “darah dan daging/manusia”; catatan kaki membantu menjelaskan nuansa πάλη tanpa menghilangkan metafora konflik.
