id: EPH.6.13
reference: Ephesians 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: id
  text: Karena itu, ambillah seluruh perlengkapan senjata Allah[a], supaya kamu sanggup bertahan[b] pada hari yang jahat[c] dan, setelah melakukan segala sesuatu[d], tetap berdiri teguh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh perlengkapan perang Allah.” Istilah Yunani menunjuk pada perlengkapan lengkap seorang prajurit.
    reason: lexical_alternative
  - marker: b
    text: Atau “melawan” atau “berdiri menghadapi.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “hari yang jahat” dapat menunjuk secara umum pada masa kejahatan atau pencobaan yang hebat, dan tidak harus hanya pada satu peristiwa akhir zaman tertentu.
    reason: alternative_reading
  - marker: d
    text: Atau “setelah menuntaskan semuanya” atau “setelah melaksanakan semuanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan inferensial ini secara alami menghubungkan perintah tersebut dengan uraian sebelumnya.
- source_word: ἀναλάβετε
  choice: ambillah
  rationale: Imperatif aoris ini berarti mengambil atau mengangkat untuk digunakan; pilihan ini mempertahankan gambaran seorang prajurit yang mengambil perlengkapannya.
- source_word: τὴν πανοπλίαν
  choice: seluruh perlengkapan senjata
  rationale: πανοπλία menunjuk pada keseluruhan perlengkapan seorang prajurit, bukan hanya baju zirah. Frasa ini jelas dan wajar dalam bahasa Indonesia.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Konstruksi 'perlengkapan senjata Allah' mempertahankan keluasan makna genitif Yunani tanpa menentukan apakah perlengkapan itu milik Allah, dikenakan Allah, atau disediakan oleh-Nya.
- source_word: ἵνα δυνηθῆτε
  choice: supaya kamu sanggup
  rationale: Menyampaikan tujuan sekaligus kemampuan tanpa menambahkan gagasan yang tidak dinyatakan oleh teks.
- source_word: ἀντιστῆναι
  choice: bertahan
  rationale: Dalam konteks militer, verba ini menggambarkan perlawanan terhadap serangan sambil tetap mempertahankan posisi.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: pada hari yang jahat
  rationale: Terjemahan ini mempertahankan ungkapan yang khidmat dan terbuka, tanpa membatasinya pada satu peristiwa akhir zaman tertentu.
- source_word: ἅπαντα κατεργασάμενοι
  choice: setelah melakukan segala sesuatu
  rationale: 'Pilihan ini mempertahankan cakupan luas partisipel tersebut: melakukan, melaksanakan, atau menuntaskan semua yang dituntut keadaan, tanpa menyiratkan kemenangan secara berlebihan.'
- source_word: στῆναι
  choice: tetap berdiri teguh
  rationale: Dalam rangkaian gambaran militer, frasa ini secara alami menyatakan bahwa seseorang masih bertahan pada posisinya setelah melakukan segala sesuatu.
theological_decisions:
- issue: Makna 'hari yang jahat'
  choice: Dibiarkan sebagai waktu kejahatan, pencobaan, atau konflik rohani yang tidak ditentukan secara sempit
  alternative: Satu hari akhir zaman tertentu
  rationale: Bahasa Yunani tidak mengharuskan satu acuan eskatologis khusus; terjemahan mempertahankan keluasan ungkapan itu.
- issue: Arti genitif dalam 'perlengkapan senjata Allah'
  choice: Hubungannya dengan Allah dibiarkan terbuka
  alternative: Perlengkapan yang secara khusus dimiliki Allah atau secara khusus disediakan oleh Allah
  rationale: Genitif Yunani dapat memuat beberapa nuansa terkait, sehingga terjemahan tidak mempersempitnya tanpa dasar yang cukup.
- issue: Hasil akhir dari στῆναι
  choice: tetap berdiri teguh
  alternative: berdiri; tetap berdiri
  rationale: Dalam konteks perlawanan militer, ungkapan ini menyampaikan keteguhan mempertahankan posisi, tanpa mengubahnya menjadi klaim kemenangan total.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Struktur kalimat mempertahankan alur nasihat, tujuan, perlawanan, dan hasil akhirnya. Istilah militer dibuat mudah dipahami tanpa menghilangkan pengulangan gagasan berdiri dan bertahan.
