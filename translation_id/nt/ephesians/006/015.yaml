  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: id
  text: dan kenakanlah pada kakimu kesiapan Injil damai sejahtera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesiagaan”; mungkin juga “kesiapan untuk memberitakan Injil damai sejahtera” atau “pijakan kokoh yang diberikan oleh Injil damai sejahtera.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: kenakanlah pada kakimu
  rationale: Partisip aoristus medium ini secara harfiah menggambarkan tindakan mengenakan alas kaki. Dalam rangkaian perintah tentang perlengkapan senjata, bentuk imperatif Indonesia membuat hubungan sintaksisnya alami, sementara frasa 'pada kakimu' mempertahankan gambaran alas kaki.
- source_word: τοὺς πόδας
  choice: kakimu
  rationale: Objek Yunani secara harfiah adalah 'kaki'. Bentuk posesif orang kedua jamak tersirat oleh sapaan dalam konteks dan wajar dalam bahasa Indonesia.
- source_word: ἐν
  choice: dengan
  rationale: Preposisi ini di sini menyatakan perlengkapan atau sarana dalam metafora perlengkapan perang; 'dengan' merupakan padanan Indonesia yang alami.
- source_word: ἑτοιμασίᾳ
  choice: kesiapan
  rationale: Kata benda ini berarti kesiapan atau keadaan siap. 'Kesiapan' mempertahankan ketidakjelasan sumber tanpa menambahkan secara eksplisit tindakan memberitakan ataupun gagasan pijakan yang kokoh.
- source_word: εὐαγγελίου
  choice: Injil
  rationale: '''Injil'' adalah istilah Paulus yang mapan, ringkas, dan tetap mudah dipahami dalam bahasa Indonesia modern.'
- source_word: εἰρήνης
  choice: damai sejahtera
  rationale: Ungkapan baku Indonesia ini menyampaikan cakupan εἰρήνη secara lebih utuh daripada sekadar ketiadaan konflik dan secara alami menerangkan Injil.
theological_decisions:
- issue: Makna frasa ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: kaki diperlengkapi dengan kesiapan yang berasal dari atau berkaitan dengan Injil damai sejahtera
  alternative: kesiapan untuk memberitakan Injil damai sejahtera; atau pijakan kokoh yang diberikan oleh Injil damai sejahtera
  rationale: Rangkaian genitif Yunani padat dan memungkinkan beberapa hubungan makna. Teks utama memakai 'kesiapan' tanpa menentukan bahwa yang dimaksud pasti kesiapan memberitakan atau kestabilan, sedangkan 'yang berasal dari' membuat hubungan genitif dapat dibaca secara wajar dalam bahasa Indonesia tanpa menutup seluruh nuansanya; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kenakanlah pada kakimu' mempertahankan citra mengenakan alas kaki tanpa memakai kata arkais seperti 'berkasut'. Istilah 'Injil damai sejahtera' mempertahankan kepadatan teologis ungkapan Paulus.
