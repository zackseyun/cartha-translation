  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: id
  text: Berdoalah juga untukku[a], supaya ketika aku membuka mulut[b], kepadaku diberikan kata-kata[c] untuk memberitahukan rahasia Injil dengan penuh keberanian[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan juga untukku”; kata “berdoalah” dipahami dari ayat sebelumnya.
    reason: contextual_ellipsis
  - marker: b
    text: Atau “pada saat aku mulai berbicara.”
    reason: idiomatic_alternative
  - marker: c
    text: Atau “sebuah pesan” atau “perkataan.”
    reason: lexical_alternative
  - marker: d
    text: Atau “dengan terus terang” atau “dengan penuh keyakinan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: Berdoalah juga untukku
  rationale: Kata kerja ‘berdoalah’ dipahami dari permintaan doa dalam ayat sebelumnya. Menyatakannya kembali menghasilkan bahasa Indonesia yang utuh dan alami, sedangkan ‘untukku juga’ saja akan terasa sebagai penggalan kalimat.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: supaya ... kepadaku diberikan kata-kata
  rationale: ἵνα menyatakan isi sekaligus tujuan permintaan doa. Bentuk pasif ‘diberikan’ dipertahankan, dan λόγος di sini menunjuk pada perkataan atau isi yang dikaruniakan untuk disampaikan, bukan gelar ‘Firman’.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: ketika aku membuka mulut
  rationale: Ungkapan sumber mempertahankan gambaran membuka mulut, tetapi fungsi ἐν dengan nomina tindakan disampaikan secara alami sebagai waktu ketika Paulus mulai berbicara.
- source_word: γνωρίσαι
  choice: untuk memberitahukan
  rationale: Infinitif ini menyatakan tujuan dari diberikannya perkataan. ‘Memberitahukan’ merupakan padanan langsung yang tidak mempersempit tindakan itu menjadi suatu bentuk pewartaan tertentu.
- source_word: ἐν παρρησίᾳ
  choice: dengan penuh keberanian
  rationale: παρρησία mencakup keterbukaan, kebebasan, dan keberanian dalam berbicara. Pilihan ini menonjolkan keberanian berbicara di hadapan umum tanpa mereduksinya menjadi perasaan percaya diri semata.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: rahasia Injil
  rationale: Dalam pemakaian Paulus, μυστήριον adalah rencana Allah yang dahulu tersembunyi lalu dinyatakan, bukan teka-teki yang belum terpecahkan. ‘Injil’ mempertahankan istilah baku bagi εὐαγγέλιον, sementara hubungan genitifnya tetap dibiarkan terbuka.
theological_decisions:
- issue: Makna λόγος dalam permintaan doa Paulus
  choice: kata-kata
  alternative: pesan; perkataan
  rationale: ‘Kata-kata’ secara wajar menyampaikan ucapan yang dikaruniakan kepada Paulus tanpa menambahkan gagasan bahwa yang dimaksud harus berupa satu pesan teknis atau suatu doktrin inspirasi tertentu.
- issue: Daya makna παρρησία
  choice: dengan penuh keberanian
  alternative: dengan terus terang; dengan penuh keyakinan
  rationale: Pilihan utama memelihara unsur keberanian dan kebebasan berbicara. Catatan kaki mempertahankan kemungkinan penekanan pada keterusterangan atau keyakinan.
- issue: Hubungan genitif pada τὸ μυστήριον τοῦ εὐαγγελίου
  choice: rahasia Injil
  alternative: rahasia yang terkandung dalam kabar baik; rahasia tentang Injil
  rationale: Konstruksi ringkas ini mempertahankan keluwesan hubungan antara ‘rahasia’ dan ‘Injil’, tanpa menetapkan secara berlebihan apakah genitif itu terutama menjelaskan isi, sumber, atau keterkaitannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan klausa diatur agar alami dalam bahasa Indonesia, sambil mempertahankan bentuk pasif ilahi, gambaran ‘membuka mulut’, tujuan pemberitaan, dan ketegangan makna pada λόγος serta παρρησία.
