id: EPH.6.11
reference: Ephesians 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: id
  text: Kenakanlah seluruh perlengkapan senjata Allah[a], supaya kalian sanggup berdiri menghadapi siasat Iblis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh perlengkapan senjata dari Allah.” Istilah Yunaninya menunjuk pada kelengkapan persenjataan seorang prajurit.
    reason: lexical_alternative
  - marker: b
    text: Atau “tipu muslihat Iblis” atau “cara-cara licik Iblis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Kenakanlah
  rationale: Imperatif aoris medium orang kedua jamak memerintahkan para pembaca untuk mengenakan perlengkapan itu. “Kenakanlah” alami dalam bahasa Indonesia dan sesuai untuk pakaian maupun perlengkapan perang.
- source_word: πανοπλίαν
  choice: seluruh perlengkapan perang
  rationale: Kata ini menunjuk pada kelengkapan persenjataan seorang prajurit, bukan hanya baju pelindung. Pilihan ini menyampaikan cakupan lengkapnya dengan jelas.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: Genitif ini dapat menyatakan kepunyaan atau sumber. Dalam bahasa Indonesia, “dari Allah” terdengar alami dan menonjolkan bahwa Allah menyediakan perlengkapan itu, tanpa meniadakan kaitan kepunyaannya.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: supaya kalian sanggup berdiri
  rationale: Konstruksi πρὸς τό dengan infinitif menyatakan tujuan. “Supaya” menyampaikan tujuan tersebut secara alami, sedangkan “sanggup berdiri” mempertahankan unsur kemampuan yang eksplisit.
- source_word: στῆναι
  choice: berdiri
  rationale: Terjemahan ini mempertahankan metafora berdiri atau bertahan di tempat tanpa menambahkan kata “teguh,” yang meskipun tersirat oleh konteks militer tidak dinyatakan secara leksikal.
- source_word: μεθοδείας
  choice: siasat-siasat
  rationale: Bentuk jamak ini menunjuk pada berbagai cara atau taktik yang licik dan terencana. “Siasat-siasat” jelas, mutakhir, dan mempertahankan nuansa kelicikan.
- source_word: τοῦ διαβόλου
  choice: Iblis
  rationale: Dalam konteks peperangan rohani, διάβολος berfungsi sebagai sebutan bagi lawan jahat pribadi. “Iblis” adalah padanan baku dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan genitif τοῦ θεοῦ dengan perlengkapan perang
  choice: dari Allah
  alternative: milik Allah
  rationale: Teks Yunani memungkinkan nuansa kepunyaan dan sumber. “Dari Allah” cocok dengan tindakan pembaca mengenakannya dan tidak menambahkan penjelasan doktrinal di luar ayat; alternatif dicatat karena genitifnya tetap luas.
- issue: Referen διάβολος
  choice: Iblis sebagai lawan jahat pribadi
  alternative: pemfitnah
  rationale: Konteks langsung tentang perjuangan rohani mendukung penggunaan διάβολος sebagai sebutan pribadi, bukan sekadar kata benda umum bagi seorang pemfitnah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai bahwa perintah Yunani ditujukan kepada orang kedua jamak. Pengulangan “siasat-siasat” mempertahankan bentuk jamak sumber.
