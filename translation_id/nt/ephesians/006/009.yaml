source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: id
  text: Dan kamu, para tuan, perlakukanlah mereka dengan cara yang sama[a]. Hentikanlah ancamanmu terhadap mereka[b], karena kamu tahu bahwa Tuhan mereka dan Tuhanmu ada di surga[c], dan pada-Nya tidak ada sikap pilih kasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lakukanlah hal-hal yang sama terhadap mereka.” Ungkapan Yunani menggemakan perintah sebelumnya dan menekankan perlakuan timbal balik.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jangan lagi mengancam mereka.” Kata Yunani dapat berarti melepaskan atau menghentikan kebiasaan mengancam.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di surga-surga”; “di surga” adalah ungkapan yang alami dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: para tuan
  rationale: Dalam konteks aturan rumah tangga kuno, kata ini menunjuk kepada para tuan dalam hubungan dengan hamba pada ayat sebelumnya. 'Para tuan' mempertahankan latar sosial tersebut tanpa menggantinya secara anakronistis dengan 'majikan'.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: perlakukanlah mereka dengan cara yang sama
  rationale: Ungkapan alami ini mempertahankan tuntutan timbal balik dan kaitan dengan perintah sebelumnya, tanpa memberi kesan bahwa setiap tindakan hamba harus ditiru secara harfiah.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: Hentikanlah ancamanmu terhadap mereka
  rationale: Partisipel ἀνιέντες menyatakan tindakan melepaskan atau menghentikan kebiasaan mengancam; bentuk imperatif kedua dalam bahasa Indonesia membuat hubungannya dengan perintah utama jelas dan wajar.
- source_word: εἰδότες
  choice: karena kamu tahu
  rationale: Partisipel ini memberi dasar bagi perintah. Bentuk kausal eksplisit terdengar alami dalam bahasa Indonesia dan menyampaikan hubungan logisnya.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: Tuhan mereka dan Tuhanmu
  rationale: Pengulangan 'Tuhan' memperjelas bahwa para hamba dan para tuan sama-sama berada di bawah otoritas ilahi yang sama. 'Tuhan' membedakan referen ilahi ini dari para 'tuan' manusia sekaligus mempertahankan permainan retoris kata κύριος.
- source_word: ἐν οὐρανοῖς
  choice: di surga
  rationale: Walaupun bentuk Yunaninya jamak, 'di surga' merupakan padanan idiomatis yang alami dalam bahasa Indonesia.
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: Ia tidak memandang muka
  rationale: Ungkapan Indonesia ini secara ringkas menyatakan bahwa Allah tidak memperlakukan orang secara berat sebelah berdasarkan kedudukan; referen pronomina dibuat eksplisit melalui 'Ia'.
theological_decisions:
- issue: Dua pemakaian κύριος bagi manusia dan bagi Tuhan dalam ayat yang sama
  choice: Menerjemahkan κύριοι manusia sebagai 'para tuan' dan κύριος ilahi sebagai 'Tuhan'
  alternative: Menerjemahkan keduanya dengan 'tuan/Tuan'
  rationale: Pembedaan huruf besar dan pilihan istilah mempertahankan kontras antara para tuan di bumi dan Tuhan di surga, serta menghindari ketidakjelasan referen ilahi.
- issue: Hubungan Tuhan dengan kedua kelompok
  choice: Tuhan mereka dan Tuhanmu
  alternative: Tuan dari mereka maupun kamu
  rationale: Bacaan ini mempertahankan struktur posesif yang menekankan bahwa kedua kelompok memiliki Tuhan yang sama dan karena itu sama-sama berada di bawah otoritas-Nya.
- issue: Makna προσωπολημψία
  choice: Ia tidak memandang muka
  alternative: Pada-Nya tidak ada sikap berat sebelah
  rationale: Ungkapan terpilih mempertahankan gagasan teologis tentang ketidakberpihakan Allah terhadap status sosial tanpa mempersempitnya menjadi sekadar kesukaan pribadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai karena sapaan Yunani berbentuk jamak tetapi bahasa Indonesia tidak perlu menandai jumlah; frasa 'para tuan' sudah menunjukkan kelompok yang disapa. Teks dibuat langsung dan mudah dipahami sambil mempertahankan latar rumah tangga kuno dan kontras antara tuan manusia dengan Tuhan ilahi.
