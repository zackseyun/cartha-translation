id: EPH.6.2
reference: Ephesians 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: id
  text: “Hormatilah ayahmu dan ibumu”—inilah perintah pertama yang disertai suatu janji—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “perintah pertama dalam janji”; maksudnya tampaknya ialah perintah pertama yang disertai suatu janji.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: Hormatilah
  rationale: Bentuk imperatif ini menuntut tindakan aktif untuk memberi hormat, bukan sekadar rasa hormat dalam batin. Pilihan ini juga mempertahankan bobot etis kutipan dari Sepuluh Perintah.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ayahmu dan ibumu
  rationale: Padanan kekeluargaan yang langsung, alami, dan tepat dalam bahasa Indonesia modern; unsur kepunyaan σου secara wajar berlaku pada keduanya.
- source_word: ἥτις ἐστὶν
  choice: inilah
  rationale: Merujuk kembali kepada perintah yang baru dikutip dan memperkenalkan komentar penjelas Paulus secara alami tanpa mengubah acuannya.
- source_word: ἐντολὴ πρώτη
  choice: perintah pertama
  rationale: Mempertahankan urutan πρώτη dan kaitannya dengan Sepuluh Perintah tanpa menafsirkannya sebagai 'terutama' atau memasukkan sistem penomoran tertentu.
- source_word: ἐν ἐπαγγελίᾳ
  choice: yang disertai suatu janji
  rationale: Mengungkapkan secara idiomatis pengertian bahwa perintah ini hadir bersama janji, sambil mencatat bentuk harfiahnya dalam catatan kaki.
theological_decisions:
- issue: Hubungan 'perintah pertama' dengan urutan Sepuluh Perintah
  choice: perintah pertama yang disertai suatu janji
  alternative: perintah pertama dalam janji; perintah pertama pada bagian kedua Sepuluh Perintah
  rationale: Konteks menyoroti janji yang menyertai perintah ini dan diteruskan dalam ayat 3. Terjemahan ini tidak menjadikan 'pertama' berarti 'terutama' dan tidak memasukkan skema penomoran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Tanda pisah mempertahankan sifat komentar penjelas dalam klausa kedua; 'suatu janji' menjaga ketakrifan yang tidak dinyatakan dalam bahasa Yunani.
