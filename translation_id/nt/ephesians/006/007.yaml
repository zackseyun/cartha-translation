translation:
  language: id
  text: Layanilah dengan niat baik sebagai pelayanan kepada Tuhan, bukan kepada manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: dengan kerelaan hati
  rationale: 'Ungkapan ini menyatakan sikap yang menyertai pelayanan: niat baik dan kesediaan batin. “Dengan kerelaan hati” alami dalam bahasa Indonesia dan cocok dengan konteks bekerja tanpa terpaksa.'
- source_word: δουλεύοντες
  choice: layanilah
  rationale: Partisipel ini berasal dari δουλεύω, yang dalam konteks dapat berarti melayani sebagai budak. Karena status para penerima perintah sudah dinyatakan dalam konteks sebelumnya, “layanilah” menyampaikan tindakan yang diperintahkan tanpa membuat kalimat menjadi kaku.
- source_word: ὡς
  choice: seperti
  rationale: 'Kata ini memperkenalkan cara atau perbandingan: pelayanan mereka harus dilakukan sebagaimana pelayanan kepada Tuhan, tanpa menambahkan nuansa hipotetis yang tidak diperlukan.'
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: κύριος di sini menunjuk kepada Tuhan ilahi dalam kontras dengan manusia dan mempertahankan gelar kristologis yang digunakan dalam konteks surat.
- source_word: ἀνθρώποις
  choice: kepada manusia
  rationale: Bentuk jamak ini bersifat umum dan mengontraskan manusia dengan Tuhan. Dalam bahasa Indonesia, “manusia” secara alami mencakup umat manusia tanpa menghilangkan kontras sumber.
theological_decisions:
- issue: Penerjemahan κύριος dalam kontras dengan tuan-tuan manusia
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan gelar ilahi dan membuat kontras dengan manusia tetap jelas; “Tuan” dapat membingungkan pembaca karena konteks sekitar juga berbicara tentang tuan di bumi.
- issue: Kekuatan nuansa perbudakan dalam δουλεύοντες
  choice: layanilah
  alternative: layanilah sebagai budak
  rationale: Konteks sebelumnya telah menyebut status mereka sebagai budak. Di ayat ini fokusnya ialah sikap dalam pelayanan, sehingga bentuk yang idiomatis tidak perlu mengulang status tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk imperatif “layanilah” mengalihkan partisipel Yunani menjadi konstruksi yang alami saat ayat dibaca sebagai kelanjutan nasihat sebelumnya. “Kerelaan hati” dipilih untuk menyatakan disposisi batin yang baik dan sukarela.
