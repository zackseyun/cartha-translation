id: EPH.6.4
reference: Ephesians 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: id
  text: Dan kamu, para ayah, janganlah membuat anak-anakmu marah,[a] tetapi besarkanlah mereka dalam didikan dan nasihat Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah membuat anak-anakmu jengkel.” Kata kerja Yunani ini berarti menyebabkan kemarahan atau memancing kejengkelan.
    reason: lexical_alternative
  - marker: b
    text: Atau “didikan dan teguran Tuhan.” Frasa “didikan dan nasihat Tuhan” dapat berarti didikan dan nasihat yang berasal dari Tuhan, menjadi milik-Nya, bercirikan Dia, atau diarahkan oleh-Nya.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: para ayah
  rationale: Kata benda Yunani ini berbentuk jamak maskulin dan secara khusus menyapa para ayah; terjemahan tidak diperluas menjadi 'orang tua'.
- source_word: παροργίζετε
  choice: membangkitkan amarah dalam diri
  rationale: Ungkapan ini menyatakan makna kausatif verba tersebut, yaitu menyebabkan orang lain menjadi marah atau menyimpan kejengkelan.
- source_word: τέκνα
  choice: anak-anak
  rationale: Padanan keluarga yang biasa dan inklusif bagi anak laki-laki maupun perempuan.
- source_word: ἐκτρέφετε
  choice: besarkanlah
  rationale: Dalam konteks pengasuhan anak, verba ini berarti memelihara dan membesarkan, bukan sekadar memberi makan.
- source_word: παιδείᾳ
  choice: disiplin
  rationale: Mencakup pembentukan, pelatihan, dan koreksi dalam pengasuhan.
- source_word: νουθεσίᾳ
  choice: nasihat
  rationale: Menunjukkan bimbingan verbal yang dapat mencakup teguran atau peringatan; 'nasihat' alami dan bermartabat dalam bahasa Indonesia.
- source_word: κυρίου
  choice: Tuhan
  rationale: Genitif ringkas ini dibiarkan memodifikasi 'disiplin dan nasihat' tanpa mempersempitnya menjadi sumber, isi, atau tolok ukur saja.
theological_decisions:
- issue: Cakupan sapaan πατέρες
  choice: para ayah
  alternative: orang tua
  rationale: Teks Yunani secara khusus menyebut para ayah. Penerapannya mungkin lebih luas, tetapi terjemahan tidak memperluas referen sumber.
- issue: Makna genitif κυρίου dalam παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: disiplin dan nasihat Tuhan
  alternative: disiplin dan nasihat yang berasal dari Tuhan; tentang Tuhan; menurut Tuhan
  rationale: Bentuk genitif dapat menyatakan sumber, kepunyaan, sifat, atau orientasi. Susunan ringkas ini mempertahankan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan langsung yang jelas dan nada nasihat yang bermartabat. 'Besarkanlah' dipilih sebagai ungkapan alami untuk pengasuhan; 'disiplin dan nasihat Tuhan' mempertahankan kekompakan serta ambiguitas genitif Yunani.
