  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: id
  text: bukan dengan pelayanan yang hanya dilakukan ketika diawasi[a], seperti orang-orang yang berusaha menyenangkan manusia, melainkan sebagai budak-budak Mesias[b], yang melakukan kehendak Allah dengan segenap jiwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pelayanan mata”, yaitu pelayanan yang dilakukan hanya ketika dilihat atau diawasi.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kristus”; Yunani Christos berarti “Yang Diurapi”.
    reason: alternative_reading
  - marker: c
    text: Atau “dengan sepenuh hati” atau “dengan sungguh-sungguh”; secara harfiah, “dari jiwa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: pelayanan yang hanya dilakukan ketika diawasi
  rationale: Kata majemuk ini secara harfiah berarti ‘pelayanan mata’ dan menunjuk pada pelayanan yang dilakukan demi penampilan saat ada yang mengawasi. Ungkapan deskriptif ini menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: ἀνθρωπάρεσκοι
  choice: orang-orang yang mencari kesenangan manusia
  rationale: Istilah ini menggambarkan orang yang berusaha menyenangkan sesama manusia demi memperoleh penerimaan. Pilihan ini jelas dan mempertahankan nuansa negatifnya.
- source_word: δοῦλοι
  choice: budak-budak
  rationale: Konteks langsung membicarakan budak secara harfiah, lalu menegaskan kepemilikan dan pengabdian mereka kepada Mesias. ‘Budak-budak’ mempertahankan daya retoris itu lebih kuat daripada ‘hamba-hamba’ atau ‘pelayan-pelayan’.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός adalah gelar yang berarti ‘Yang Diurapi’. ‘Mesias’ mempertahankan arti gelar tersebut dalam bahasa Indonesia.
- source_word: ποιοῦντες
  choice: yang melakukan
  rationale: Partisipel ini menyatakan tindakan yang menyertai pengabdian mereka; bentuk relatif menghasilkan susunan Indonesia yang alami tanpa menambahkan tafsiran.
- source_word: θέλημα
  choice: kehendak
  rationale: Dalam nasihat etis ini, θέλημα menunjuk pada apa yang Allah inginkan untuk dilakukan. ‘Kehendak’ merupakan padanan baku dan tepat.
- source_word: ἐκ ψυχῆς
  choice: dengan segenap jiwa
  rationale: Pilihan ini mempertahankan kata ψυχή, ‘jiwa’, sekaligus menyampaikan ketulusan dan keterlibatan batin sepenuhnya.
theological_decisions:
- issue: Penerjemahan δοῦλοι dalam konteks aturan rumah tangga
  choice: budak-budak Mesias
  alternative: hamba-hamba Mesias; pelayan-pelayan Kristus
  rationale: Ayat ini ditujukan kepada budak secara harfiah dan mengalihkan pusat kesetiaan mereka kepada Mesias. Karena status keterikatan dan kepemilikan penting bagi kontras ayat ini, ‘budak-budak’ dipertahankan.
- issue: Χριστοῦ sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: ‘Mesias’ menyatakan arti gelar Χριστός sebagai Yang Diurapi dan mempertahankan dimensi pemerintahan serta kesetiaan yang relevan dalam frasa ‘budak-budak Mesias’.
- issue: Ungkapan antropologis ἐκ ψυχῆς
  choice: dengan segenap jiwa
  alternative: dengan sepenuh hati; dengan sungguh-sungguh
  rationale: Teks menyebut ψυχή, bukan καρδία. Karena itu, ‘jiwa’ dipertahankan tanpa menetapkan suatu antropologi teknis; catatan kaki memberi padanan idiomatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Parafrasa terbatas dipakai untuk ὀφθαλμοδουλίαν agar metafora yang tidak lazim tetap mudah dipahami, sedangkan istilah penting seperti ‘budak’, ‘Mesias’, dan ‘jiwa’ dipertahankan demi kekuatan dan tekstur teks Yunani.
