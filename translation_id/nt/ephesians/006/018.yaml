  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: id
  text: Dengan segala doa dan permohonan, berdoalah setiap waktu dalam Roh[a]. Untuk tujuan itu, tetaplah berjaga-jaga dengan segala ketekunan dan permohonan bagi semua orang kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam roh.” Teks Yunani dapat dipahami secara lebih umum, tetapi dalam konteks ini kemungkinan besar merujuk kepada Roh Kudus.'
    reason: alternative_reading
  - marker: b
    text: “Orang kudus” di sini berarti seluruh umat Allah, yaitu semua orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: dengan segala doa dan permohonan
  rationale: διά dengan genitif menyatakan sarana; 'dengan' alami dalam bahasa Indonesia. 'Doa' mempertahankan istilah umum, sedangkan 'permohonan' menyatakan permintaan khusus.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: Berdoalah setiap waktu
  rationale: Partisipel meneruskan rangkaian nasihat dari konteks sebelumnya. Bentuk imperatif menghasilkan bahasa Indonesia yang alami tanpa mengubah daya nasihatnya; 'setiap waktu' mempertahankan cakupan menyeluruh.
- source_word: ἐν πνεύματι
  choice: dalam Roh
  rationale: Dalam konteks Efesus, khususnya sesudah 'pedang Roh' pada ayat 17, rujukan paling mungkin ialah Roh Kudus. Ambiguitas gramatikal dicatat dalam catatan kaki.
- source_word: εἰς αὐτό
  choice: untuk tujuan itu
  rationale: Ungkapan ini menyatakan sasaran atau tujuan dari kewaspadaan dan terdengar alami dalam bahasa Indonesia.
- source_word: ἀγρυπνοῦντες
  choice: tetaplah berjaga-jaga
  rationale: Kata ini menyatakan kewaspadaan yang terus dipelihara; pilihan ini juga sesuai dengan gambaran kesiagaan dalam konteks perlengkapan senjata.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: dengan segala ketekunan dan permohonan
  rationale: Terjemahan ini mempertahankan καί secara langsung dan membiarkan hubungan antara ketekunan dan permohonan tetap terbuka, alih-alih memastikan bahwa frasa itu merupakan hendiadis.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: bagi semua orang kudus
  rationale: '''Orang kudus'' adalah padanan baku bagi ἅγιοι dan dalam pemakaian Paulus menunjuk kepada seluruh umat Allah, bukan hanya kelompok yang kemudian diberi status khusus.'
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh Kudus ('dalam Roh')
  alternative: roh manusia atau sikap rohani ('dalam roh')
  rationale: Konteks dekat dan pemakaian Paulus mendukung rujukan kepada Roh Kudus, tetapi bentuk Yunani tanpa artikel memungkinkan pembacaan yang lebih umum; alternatif itu dipertahankan dalam catatan kaki.
- issue: Makna ἅγιοι
  choice: semua umat Allah ('semua orang kudus')
  alternative: orang-orang kudus dalam arti kelompok khusus yang diakui secara gerejawi pada masa kemudian
  rationale: Dalam surat-surat Paulus, istilah ini lazim menunjuk kepada seluruh komunitas orang percaya yang dikuduskan Allah.
- issue: Hubungan προσκαρτερήσει καὶ δεήσει
  choice: dua unsur yang dikoordinasikan ('ketekunan dan permohonan')
  alternative: '''ketekunan dalam permohonan'' sebagai hendiadis'
  rationale: καί secara eksplisit menghubungkan kedua nomina. Walaupun pembacaan hendiadis masuk akal, teks utama tidak perlu menutup kemungkinan bahwa keduanya merupakan unsur sejajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa partisipial Yunani dialihkan menjadi serangkaian nasihat langsung agar jelas dan alami, sambil mempertahankan hubungannya dengan perintah dalam konteks sebelumnya. Tanda baca membagi kalimat Yunani yang panjang demi keterbacaan.
