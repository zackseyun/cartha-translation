id: EPH.6.23
reference: Ephesians 6:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: id
  text: Damai bagi saudara-saudara[a], dan kasih yang disertai iman[b], dari Allah Bapa dan Tuhan Yesus Sang Mesias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari.” Bahasa Yunani memakai bentuk jamak maskulin “saudara-saudara,” yang dapat digunakan untuk menyapa seluruh komunitas orang percaya.
    reason: alternative_reading
  - marker: b
    text: Atau “kasih yang disertai kesetiaan” atau “kasih yang disertai kepercayaan.” Kata Yunani yang diterjemahkan “iman” juga dapat memiliki arti-arti tersebut.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Yunani: “Yesus Kristus.” Di sini gelar Χριστός diterjemahkan “Sang Mesias” untuk menyatakan maknanya.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Damai
  rationale: Nomina ini berdiri secara eliptis sebagai ucapan berkat. Bentuk ringkas dipertahankan tanpa menambahkan verba yang tidak ada dalam teks Yunani.
- source_word: τοῖς ἀδελφοῖς
  choice: bagi saudara-saudara
  rationale: ἀδελφοῖς berbentuk jamak maskulin dan dapat dipakai untuk menyapa seluruh komunitas orang percaya. Terjemahan utama mempertahankan bentuk sumber, sedangkan cakupan inklusifnya dicatat dalam catatan kaki.
- source_word: ἀγάπη
  choice: kasih
  rationale: Ini padanan lazim bagi ἀγάπη dan mempertahankan kaitan leksikal dengan pemakaian istilah ini dalam surat Paulus.
- source_word: μετὰ πίστεως
  choice: yang disertai iman
  rationale: μετά dengan genitif menyatakan penyertaan. Ungkapan ini dibuat alami dalam bahasa Indonesia tanpa menentukan hubungan yang lebih khusus daripada yang dinyatakan teks; πίστις diterjemahkan menurut arti utamanya, 'iman'.
- source_word: ἀπὸ
  choice: dari
  rationale: Menandai sumber atau asal damai dan kasih yang disertai iman.
- source_word: θεοῦ πατρὸς
  choice: Allah Bapa
  rationale: Bahasa Yunani tidak memuat kata 'kita', sehingga tidak ditambahkan. 'Allah Bapa' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku bagi κύριος dalam konteks sebutan bagi Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός memiliki daya sebagai gelar, yakni Mesias. 'Sang' menandai gelar itu secara idiomatis dalam bahasa Indonesia tanpa menganggap adanya artikel Yunani.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam ucapan berkat penutup
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός diterjemahkan menurut makna gelarnya agar identitas mesianik Yesus tetap nyata. Bentuk konvensional 'Kristus' dicatat sebagai alternatif.
- issue: Cakupan sapaan ἀδελφοῖς
  choice: saudara-saudara
  alternative: saudara-saudari
  rationale: Bentuk Yunani secara gramatikal adalah jamak maskulin, tetapi dalam pemakaian Paulus dapat mencakup seluruh jemaat. Teks utama mempertahankan bentuk tersebut dan catatan kaki menjelaskan cakupan yang mungkin inklusif.
- issue: Arti πίστις
  choice: iman
  alternative: kesetiaan atau kepercayaan
  rationale: '''Iman'' adalah arti utama yang paling wajar di sini. Karena πίστις juga dapat berarti kesetiaan atau kepercayaan, kemungkinan leksikal itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan ucapan berkat Yunani dipertahankan, sementara frasa 'yang disertai iman' dipilih agar hubungan ἀγάπη μετὰ πίστεως terdengar alami tanpa menghilangkan ambiguitas leksikal πίστις.
