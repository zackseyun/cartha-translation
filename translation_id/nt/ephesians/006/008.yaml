  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: id
  text: Sebab kalian tahu bahwa setiap orang, kebaikan apa pun yang dilakukannya, akan menerima kembali hal itu dari Tuhan[a], entah ia budak[b] atau orang merdeka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan menerima balasan dari Tuhan atas kebaikan itu.” Kata kerja Yunani dapat berarti menerima kembali sesuatu yang sepadan dengan tindakan seseorang.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hamba”; kata Yunaninya di sini menunjuk kepada orang yang berstatus budak, berbeda dengan orang merdeka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sebab kalian tahu
  rationale: Partisipel ini menjadi dasar bagi nasihat sebelumnya. Bentuk kausal menghasilkan bahasa Indonesia yang wajar, sementara subjek jamak tersirat dinyatakan sebagai “kalian” sesuai konteks surat.
- source_word: ἕκαστος
  choice: setiap orang
  rationale: 'Mempertahankan penekanan distributif: balasan Tuhan berlaku kepada masing-masing orang tanpa membatasi jenis kelamin.'
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: atas setiap kebaikan yang dilakukannya
  rationale: Klausa relatif dengan ἄν menyatakan ketidaktentuan. Susunan ini alami dalam bahasa Indonesia dan tetap mengacu kepada perbuatan baik apa pun.
- source_word: τοῦτο κομίσεται
  choice: akan menerima balasan ... atas
  rationale: κομίσεται dapat menyatakan menerima kembali apa yang sepadan dengan tindakan seseorang. “Menerima balasan ... atas” menyampaikan hubungan timbal balik secara alami tanpa menjadikannya transaksi komersial.
- source_word: παρὰ κυρίου
  choice: dari Tuhan
  rationale: παρά dengan bentuk genitif menyatakan sumber. “Tuhan” mempertahankan bobot sebutan κύριος dan kemungkinan rujukan kristologisnya.
- source_word: δοῦλος
  choice: budak
  rationale: Konteks langsung membahas orang yang terikat dalam perbudakan dan mempertentangkannya dengan orang merdeka; “budak” tidak melunakkan kenyataan sosial tersebut.
- source_word: ἐλεύθερος
  choice: orang merdeka
  rationale: Menunjuk kepada orang yang berstatus bebas dan membentuk kontras sosial yang jelas dengan “budak”.
theological_decisions:
- issue: Makna balasan dalam τοῦτο κομίσεται
  choice: menerima balasan dari Tuhan atas setiap kebaikan
  alternative: menerima kembali hal itu dari Tuhan
  rationale: Pilihan utama mengungkapkan secara alami bahwa Tuhan memberikan sesuatu yang sepadan dengan perbuatan baik, tanpa menentukan bentuk balasan atau merumuskan sistem jasa tertentu. Catatan kaki mempertahankan bentuk yang lebih harfiah.
- issue: Penerjemahan δοῦλος dalam aturan rumah tangga
  choice: budak
  alternative: hamba
  rationale: Kontras eksplisit dengan ἐλεύθερος membuat status diperbudak dan status merdeka menjadi pokok pernyataan. “Budak” paling jelas mempertahankan kenyataan historis itu.
- issue: Rujukan κύριος
  choice: Tuhan
  alternative: tuan
  rationale: Walaupun konteks menyebut tuan manusia, sumber balasan di sini adalah κύριος ilahi. “Tuhan” mempertahankan rujukan teologis tersebut tanpa meleburkannya ke dalam hubungan rumah tangga.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Kalian” dipakai untuk menyatakan subjek jamak yang tersirat dan menjaga agar sapaan mudah dipahami; susunan kalimat diatur secara alami tanpa menghilangkan penekanan pada setiap orang serta kontras budak–orang merdeka.
