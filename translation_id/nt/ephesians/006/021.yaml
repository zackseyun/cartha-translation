  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: id
  text: Supaya kalian juga mengetahui hal-hal tentang diriku[a] dan apa yang kulakukan, Tikhikus, saudara yang terkasih dan pelayan yang setia dalam Tuhan[b], akan memberitahukan semuanya kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keadaanku.” Secara harfiah: “hal-hal mengenai aku.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “pelayan” juga dapat berarti “orang yang melayani” atau, dalam konteks tertentu, “diaken.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Namun, supaya
  rationale: ἵνα menyatakan tujuan, sedangkan δέ memberi hubungan peralihan ringan; gabungan ini mempertahankan keduanya secara wajar dalam bahasa Indonesia.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: kamu juga mengetahui
  rationale: καί bersama ὑμεῖς menekankan bahwa para penerima surat juga akan mengetahui keadaan Paulus.
- source_word: τὰ κατ’ ἐμέ
  choice: keadaanku
  rationale: Ungkapan idiomatis ini menunjuk pada hal-hal yang menyangkut Paulus atau situasinya. 'Keadaanku' alami dalam bahasa Indonesia, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: τί πράσσω
  choice: apa yang sedang kulakukan
  rationale: πράσσω di sini menunjuk pada apa yang Paulus lakukan atau kerjakan; aspek berlangsung disampaikan secara alami dengan 'sedang'.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: akan memberitahukan semuanya kepadamu
  rationale: γνωρίζω berarti membuat sesuatu diketahui atau memberitahukannya; susunan ini jelas dan alami.
- source_word: Τυχικὸς
  choice: Tikhikus
  rationale: Nama Yunani ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: saudara yang terkasih
  rationale: Mempertahankan kasih sayang dalam ἀγαπητός dan sebutan kekeluargaan Kristen ἀδελφός bagi seorang rekan laki-laki.
- source_word: πιστὸς διάκονος
  choice: pelayan yang setia
  rationale: διάκονος dapat berarti pelayan, orang yang melayani, atau di konteks tertentu diaken. Di sini jabatan gerejawi formal tidak dinyatakan dengan pasti, sehingga 'pelayan' menjaga keluasan maknanya.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus yang menyatakan ranah atau hubungan dengan Tuhan.
theological_decisions:
- issue: Makna διάκονος bagi Tikhikus
  choice: pelayan
  alternative: pelayan rohani; diaken
  rationale: Konteks menggambarkan Tikhikus sebagai rekan tepercaya yang menyampaikan kabar tentang Paulus, tetapi tidak memastikan bahwa διάκονος merupakan nama jabatan formal. 'Pelayan' tidak mengimpor struktur gerejawi tertentu.
- issue: Makna ἀδελφός
  choice: saudara
  alternative: saudara seiman
  rationale: Yang dimaksud adalah seorang rekan laki-laki. 'Saudara' tepat secara kontekstual tanpa menambahkan keterangan yang tidak eksplisit.
- issue: Makna ἐν κυρίῳ
  choice: dalam Tuhan
  alternative: dalam persekutuan dengan Tuhan
  rationale: Bentuk ringkas ini mempertahankan keluwesan teologis ungkapan Paulus tanpa membatasi maknanya hanya pada satu jenis hubungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'kamu' dan '-mu' mengikuti rujukan jamak Yunani secara idiomatis dalam bahasa Indonesia; susunan kalimat dipertahankan dekat dengan sumber sambil tetap mudah dipahami.
