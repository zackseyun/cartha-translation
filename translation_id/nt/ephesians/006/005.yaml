id: EPH.6.5
reference: Ephesians 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: id
  text: Hai para budak, taatilah tuan-tuanmu di dunia ini[a] dengan takut dan gentar, dengan tulus hati, seperti kamu menaati Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tuan-tuanmu menurut daging,” yaitu tuan dalam hubungan manusiawi atau duniawi.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus”; istilah itu diterjemahkan “Mesias” karena di sini berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: para budak
  rationale: Dalam aturan rumah tangga ini, kata tersebut menunjuk kepada orang-orang yang berada dalam perbudakan dan di bawah kuasa tuan; “budak” tidak mengaburkan kenyataan sosial itu seperti “pelayan”.
- source_word: ὑπακούετε
  choice: taatilah
  rationale: Bentuk imperatif ini memerintahkan ketaatan; “taatilah” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: tuan-tuanmu di dunia ini
  rationale: Frasa κατὰ σάρκα membatasi ketuanan itu pada ranah manusiawi dan sementara. Ungkapan “di dunia ini” menyampaikan maksud tersebut secara alami tanpa memberi kesan bahwa para tuan harus ditaati dengan cara yang bersifat jasmani.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: dengan takut dan gentar
  rationale: Padanan ini mempertahankan pasangan ungkapan Paulus serta daya retorisnya tanpa melunakkan φόβος menjadi sekadar rasa hormat.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: dengan tulus hati
  rationale: ἁπλότης di sini menyatakan ketulusan dan hati yang tidak mendua; “dengan tulus hati” alami dan jelas bagi pembaca Indonesia.
- source_word: ὡς τῷ Χριστῷ
  choice: seperti kamu menaati Mesias
  rationale: ὡς menyatakan perbandingan, bukan penyamaan tuan manusia dengan Mesias. Penambahan tersirat “kamu menaati” menghasilkan kalimat Indonesia yang utuh, sedangkan Χριστός diterjemahkan sebagai gelar “Mesias”.
theological_decisions:
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus; “Mesias” menerjemahkan makna gelar Yunani tersebut, sementara catatan kaki mencantumkan bentuk tradisional “Kristus”.
- issue: Penerjemahan δοῦλοι dalam konteks perbudakan
  choice: para budak
  alternative: para pelayan; para hamba
  rationale: Konteks hubungan dengan κύριοι menunjukkan orang-orang yang secara sosial berada di bawah kepemilikan atau kuasa tuan. “Budak” mempertahankan kenyataan keras yang terdapat dalam teks dan tidak menafsirkannya sebagai pekerjaan sukarela.
- issue: Cakupan ketaatan kepada tuan manusia
  choice: tuan-tuanmu di dunia ini
  alternative: tuan-tuanmu menurut daging
  rationale: κατὰ σάρκα membatasi hubungan ketuanan pada tataran manusiawi, bukan memberi kewenangan rohani atau mutlak kepada para tuan. Terjemahan utama menyampaikan batas itu secara idiomatis, dan bentuk harfiahnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Hai” mempertahankan seruan langsung Οἱ δοῦλοι. Bentuk jamak “tuan-tuanmu” mengikuti kelompok penerima yang jamak, sedangkan susunan kalimat dibuat alami dalam bahasa Indonesia. Istilah “budak” dipilih dengan sengaja agar realitas perbudakan dalam teks tidak diperhalus.
