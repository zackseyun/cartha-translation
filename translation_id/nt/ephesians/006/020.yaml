  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: id
  text: Untuk itulah[a] aku menjadi duta dalam belenggu[b], agar aku dapat berbicara dengan berani tentang itu[c], sebagaimana seharusnya aku berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti Yunani berbentuk netral dan kemungkinan besar menunjuk kepada “rahasia Injil” dalam ayat sebelumnya. Atau, “demi Dia,” jika rujukannya dipahami secara personal.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “dalam sebuah rantai”; maksudnya, sebagai seorang tahanan.'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di dalamnya” atau “dalam hal itu.” Kata ganti Yunani berbentuk netral dan kemungkinan besar menunjuk kepada Injil atau rahasianya. Sebagian penafsiran menerjemahkannya “di dalam Dia.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: demi hal itulah
  rationale: Ὑπέρ menyatakan kepentingan atau tujuan yang diperjuangkan, sedangkan οὗ berbentuk netral dan paling wajar menunjuk kembali kepada “rahasia Injil” dalam ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan rujukan nonpersonal tersebut.
- source_word: πρεσβεύω
  choice: aku menjadi utusan
  rationale: Kata kerja ini berarti bertindak sebagai duta atau utusan resmi. “Menjadi utusan” mempertahankan gagasan bahwa Paulus mewakili dan menyampaikan amanat pihak lain tanpa memakai istilah politis modern yang terlalu sempit.
- source_word: ἐν ἁλύσει
  choice: dalam belenggu
  rationale: Bahasa Yunani memakai bentuk tunggal, secara harfiah “dalam sebuah rantai”. “Dalam belenggu” merupakan ungkapan Indonesia yang wajar bagi keadaan dipenjarakan dan tetap mempertahankan citra pengekangan.
- source_word: ἵνα
  choice: agar
  rationale: Konjungsi ini memperkenalkan maksud atau tujuan. “Agar” ringkas, alami, dan jelas dalam bahasa Indonesia modern.
- source_word: ἐν αὐτῷ
  choice: dalam hal itu
  rationale: Kata ganti Yunani berbentuk netral dan kemungkinan besar kembali menunjuk kepada Injil atau rahasianya. “Dalam hal itu” mempertahankan bentuk relasional yang cukup terbuka tanpa mengubahnya menjadi rujukan personal.
- source_word: παρρησιάσωμαι
  choice: aku berbicara dengan berani
  rationale: Kata kerja ini menyatakan keberanian, keterusterangan, dan kebebasan dalam berbicara. Terjemahan ini menyampaikan unsur tindakan berbicara yang ditegaskan lagi oleh λαλῆσαι.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: sebagaimana seharusnya aku berbicara
  rationale: Δεῖ menyatakan keharusan atau kewajiban. Susunan ini mempertahankan nuansa kewajiban tersebut dalam bahasa Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Rujukan οὗ dan αὐτῷ
  choice: Keduanya diterjemahkan sebagai rujukan netral kepada “rahasia Injil” atau perkara pemberitaan Injil dalam ayat 19.
  alternative: Keduanya dapat ditafsirkan secara lebih personal sebagai “demi Dia” dan “di dalam Dia”, atau secara lebih luas sebagai rujukan kepada pemberitaan Injil.
  rationale: Bentuk morfologis οὗ dan αὐτῷ dalam teks yang diberikan adalah tunggal netral, sehingga rujukan kepada “rahasia Injil” paling kuat secara gramatikal. Terjemahan tidak memasukkan rujukan kristologis personal yang tidak ditandai oleh bentuk tersebut, tetapi mencatat kemungkinan tafsir itu.
- issue: Hubungan ἐν αὐτῷ dengan keberanian berbicara
  choice: Diterjemahkan secara cukup formal sebagai “dalam hal itu”, yakni dalam perkara atau kegiatan yang berkaitan dengan Injil.
  alternative: Dapat diperjelas menjadi “ketika memberitakannya” atau “tentang hal itu”.
  rationale: Ungkapan Yunani sendiri ringkas dan hubungan semantisnya tidak dijabarkan. “Dalam hal itu” menjaga keterbukaan teks, sedangkan pilihan yang lebih eksplisit akan menetapkan bahwa maksudnya khusus tindakan memberitakan atau pokok pembicaraan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Utusan” dipilih daripada “duta besar” agar citra perwakilan tetap kuat tanpa kesan jabatan diplomatik modern. Pengulangan “berbicara” dipertahankan karena mencerminkan hubungan παρρησιάσωμαι dan λαλῆσαι dalam sumber serta menekankan keberanian dan kewajiban Paulus.
