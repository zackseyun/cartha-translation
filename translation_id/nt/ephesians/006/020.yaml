  naturalness: “Demi hal itulah” dan terutama “agar dalam hal itu aku berbicara” terasa kaku. Revisi memakai “Untuk itulah” dan “agar aku dapat berbicara dengan berani tentang itu,” yang lebih alami sambil tetap membiarkan anteseden “itu” merujuk kepada rahasia Injil/pemberitaannya.
  terminology: “Duta” mempertahankan daya πρεσβεύω lebih baik daripada “utusan” yang lebih umum. “Dalam belenggu” tepat dan bercitra kuat. “Berbicara dengan berani” menyampaikan παρρησιάσωμαι, sementara pengulangan dengan “berbicara” pada klausa terakhir tetap mencerminkan λαλῆσαι.
