  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: id
  text: 'Aku telah mengutus dia kepada kalian untuk tujuan inilah: supaya kalian mengetahui keadaan kami[a] dan supaya dia menguatkan hati kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal mengenai kami” atau “situasi kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: dia
  rationale: Pronomina relatif akusatif maskulin tunggal ini merujuk kepada Tikhikus pada ayat sebelumnya. Dalam bahasa Indonesia, hubungan itu paling alami dinyatakan dengan pronomina persona “dia” sebagai objek “mengutus”.
- source_word: ἔπεμψα
  choice: Aku mengutus
  rationale: Bentuk aoristus indikatif menyatakan tindakan pengutusan sebagai peristiwa utuh; bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Dengan verba pengutusan, πρός + akusatif menunjukkan arah kepada orang. “Kepada kalian” jelas dan wajar; “kalian” mempertahankan bentuk jamak ὑμᾶς.
- source_word: εἰς αὐτὸ τοῦτο
  choice: untuk tujuan ini juga
  rationale: Ungkapan ini menegaskan tujuan khusus pengutusan. “Ini juga” mempertahankan daya penegas αὐτό tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini memperkenalkan klausa tujuan; “supaya” menyampaikan fungsi tersebut secara alami.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: kalian mengetahui keadaan kami
  rationale: τὰ περὶ ἡμῶν mencakup hal-hal mengenai Paulus dan rekan-rekannya, termasuk kondisi atau situasi mereka. “Keadaan kami” ringkas dan alami, sementara catatan kaki mempertahankan keluasan ungkapan Yunani.
- source_word: καὶ
  choice: dan supaya
  rationale: Pengulangan “supaya” memperjelas bahwa unsur kedua sejajar sebagai tujuan pengutusan.
- source_word: παρακαλέσῃ
  choice: dia menguatkan
  rationale: παρακαλέω dapat berarti menghibur, mendorong, menasihati, atau menguatkan. Dengan objek “hati kalian,” “menguatkan” menyampaikan dukungan pastoral tanpa mempersempitnya hanya pada penghiburan atau nasihat.
- source_word: τὰς καρδίας ὑμῶν
  choice: hati kalian
  rationale: Terjemahan langsung ini tetap alami dalam bahasa Indonesia dan mempertahankan ungkapan antropologis Alkitab tentang pusat batin manusia.
theological_decisions:
- issue: Makna τὰ περὶ ἡμῶν
  choice: keadaan kami
  alternative: hal-hal mengenai kami; bagaimana keadaan kami
  rationale: Frasa Yunani dapat menunjuk baik kepada kondisi pribadi maupun situasi yang menyertai Paulus dan rekan-rekannya. “Keadaan kami” cukup luas dan alami, sedangkan alternatif dicantumkan agar ambiguitas aslinya tidak hilang.
- issue: Nuansa παρακαλέσῃ
  choice: menguatkan
  alternative: menghibur; mendorong; menasihati
  rationale: Konteks “hati kalian” mendukung tindakan pastoral yang memberi keteguhan batin. Pilihan ini tidak mengunci makna pada satu tindakan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hangat dan bermartabat. “Aku” dan “kalian” mengikuti relasi persona tunggal-jamak dalam teks dan menghasilkan sapaan yang langsung; ungkapan “hati kalian” dipertahankan sebagai idiom Alkitab yang masih mudah dipahami.
