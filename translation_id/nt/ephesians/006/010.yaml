id: EPH.6.10
reference: Ephesians 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: id
  text: Akhirnya[a], hendaklah kalian dikuatkan di dalam Tuhan dan di dalam kekuatan kuasa-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Selanjutnya” atau “Mulai sekarang.” Ungkapan Yunani ini dapat menandai bagian penutup atau menunjuk pada waktu selanjutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Akhirnya
  rationale: Ungkapan ini berfungsi sebagai penanda peralihan menuju bagian penutup surat. “Akhirnya” merupakan padanan Indonesia yang alami tanpa memaksakan arti temporal “mulai sekarang” yang juga mungkin secara leksikal.
- source_word: ἐνδυναμοῦσθε
  choice: hendaklah kalian dikuatkan
  rationale: 'Bentuk imperatif kini pasif/medio orang kedua jamak dipertahankan sebagai nasihat yang bersifat reseptif: para pembaca menerima kekuatan, bukan sekadar membangkitkan keteguhan dari diri sendiri. “Kalian” memperjelas bahwa perintah ini ditujukan kepada komunitas.'
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Preposisi ἐν dipertahankan untuk menjaga bahasa relasional atau ranah khas Paulus. “Oleh Tuhan” akan mempersempitnya menjadi sarana, sedangkan teks Yunani tidak mengharuskan penafsiran itu.
- source_word: κράτει
  choice: kekuatan
  rationale: κράτος menunjuk pada kekuatan yang nyata atau efektif. “Kekuatan” alami dalam bahasa Indonesia dan tetap dapat dibedakan dari ἰσχύς.
- source_word: ἰσχύος
  choice: kuasa
  rationale: “Kuasa” membedakannya dari κράτος dan menjaga tumpukan istilah kekuatan dalam frasa Yunani, sambil menghasilkan ungkapan Indonesia yang tetap bermartabat dan mudah dipahami.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini secara alami merujuk kepada Tuhan. Bentuk “-Nya” ringkas dan jelas; huruf kapital mengikuti kebiasaan bahasa Indonesia ketika merujuk kepada Tuhan.
theological_decisions:
- issue: Bentuk dan sumber penguatan dalam ἐνδυναμοῦσθε
  choice: 'Nasihat reseptif: “hendaklah kalian dikuatkan.”'
  alternative: “Jadilah kuat” atau “kuatlah.”
  rationale: Bentuk Yunani mendukung pemertahanan nuansa pasif/medio dan menekankan ketergantungan pada kekuatan yang terdapat di dalam Tuhan, tanpa menentukan secara berlebihan mekanisme teologis penguatan itu.
- issue: Makna ἐν dalam ἐν κυρίῳ
  choice: “di dalam Tuhan,” dengan ambiguitas relasional/ranah dipertahankan.
  alternative: “oleh Tuhan” atau “dalam persatuan dengan Tuhan.”
  rationale: Padanan literal yang tetap alami ini tidak membatasi ἐν hanya sebagai sarana dan tidak menambahkan penjelasan tentang persatuan yang tidak dinyatakan secara eksplisit.
- issue: Rujukan κύριος
  choice: Tuhan
  alternative: Tuan atau Penguasa
  rationale: Dalam konteks Paulus, sebutan ini secara alami merujuk kepada Yesus yang ditinggikan. “Tuhan” mempertahankan pemakaian kristologis yang lazim tanpa menambahkan nama dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak “kalian” dipakai agar sasaran komunal imperatif Yunani tampak jelas. Susunan “kekuatan kuasa-Nya” sengaja mempertahankan penumpukan dua istilah daya dalam sumber, tetapi tetap dapat dipahami dalam bahasa Indonesia.
