  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: id
  text: Terimalah helm keselamatan[a] dan pedang Roh, yaitu firman Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ambillah helm keselamatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “perkataan Allah”; kata Yunani rhēma dapat menekankan perkataan yang diucapkan atau pesan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: terimalah
  rationale: Imperatif aoris orang kedua jamak ini menyatakan tindakan menerima atau mengambil sesuatu yang disediakan. “Terimalah” mempertahankan nuansa penerimaan, sedangkan kemungkinan “ambillah” dicatat dalam catatan kaki karena sesuai juga dengan gambaran perlengkapan perang.
- source_word: περικεφαλαίαν
  choice: ketopong
  rationale: Istilah ini menunjuk pada pelindung kepala dalam perlengkapan militer. “Ketopong” merupakan padanan Indonesia yang ringkas dan tepat dalam metafora perlengkapan perang.
- source_word: τοῦ σωτηρίου
  choice: keselamatan
  rationale: Bentuk genitif ini secara alami diterjemahkan “keselamatan” dan mempertahankan keluasan makna penyelamatan atau pembebasan tanpa menentukan secara berlebihan hubungan tepat antara ketopong dan keselamatan.
- source_word: μάχαιραν
  choice: pedang
  rationale: Kata ini menunjuk pada senjata tajam, sering kali berupa pedang yang relatif pendek. “Pedang” adalah padanan umum yang jelas dan tidak mempersempit ukuran atau jenis senjatanya.
- source_word: τοῦ πνεύματος
  choice: Roh
  rationale: Dalam konteks Paulus, ungkapan ini paling alami merujuk kepada Roh Kudus. Huruf kapital menandai referen pribadi tersebut tanpa menjelaskan secara berlebihan apakah genitifnya terutama menyatakan kepunyaan, sumber, atau sarana.
- source_word: ὅ ἐστιν
  choice: yaitu
  rationale: Ungkapan penjelas ini mengidentifikasi pedang dalam metafora dengan firman Allah. “Yaitu” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “yang adalah”.
- source_word: ῥῆμα θεοῦ
  choice: firman Allah
  rationale: ῥῆμα dapat menekankan perkataan yang diucapkan atau pesan. “Firman Allah” alami, dikenal luas, dan tetap cukup luas, sementara nuansa alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Referen τοῦ πνεύματος
  choice: Roh Kudus
  alternative: roh manusia atau roh dalam arti umum
  rationale: Konteks perlengkapan senjata Allah dan identifikasi berikutnya dengan firman Allah paling kuat mendukung rujukan kepada Roh Kudus. Teks utama memakai “Roh” tanpa menambahkan kata “Kudus”, sehingga tidak melampaui bentuk sumber.
- issue: Hubungan genitif dalam “pedang Roh”
  choice: dipertahankan tanpa diperinci
  alternative: pedang yang diberikan oleh Roh atau pedang milik Roh
  rationale: Bahasa Yunani tidak secara eksplisit menetapkan satu jenis hubungan genitif. Terjemahan “pedang Roh” mempertahankan ketegangan antara kepunyaan, sumber, dan pemberian.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Ketopong” dipertahankan sebagai istilah militer yang tepat dalam rangkaian metafora perlengkapan perang; “Roh” memakai huruf kapital untuk menunjuk kepada Roh Kudus.
