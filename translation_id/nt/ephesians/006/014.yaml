  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: id
  text: Karena itu, berdirilah dengan mengikat pinggang kalian dalam kebenaran dan mengenakan baju zirah kebenaran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “baju zirah keadilan.” Kata Yunani δικαιοσύνη, yang diterjemahkan “kebenaran” di sini, berbeda dari ἀλήθεια (“kebenaran”) sebelumnya dan juga dapat berarti “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: berdirilah
  rationale: Bentuk perintah ini menyerukan sikap berdiri yang tegas. Terjemahan ini mempertahankan arti dasar tanpa menambahkan kata 'teguh', yang tidak dinyatakan dalam kata Yunani tersebut.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan atau dorongan yang bertolak dari uraian sebelumnya.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: setelah mengikat pinggang kalian
  rationale: Mengungkapkan tindakan mengikat atau melilit di sekitar pinggang. Kata 'kalian' mempertahankan bentuk jamak dari ὑμῶν, sedangkan 'setelah' mencerminkan hubungan partisip aoris dengan perintah utama.
- source_word: ἐν ἀληθείᾳ
  choice: dengan kebenaran
  rationale: Mempertahankan bentuk ungkapan Yunani tanpa menambahkan kata 'ikat pinggang', yang tidak disebutkan secara eksplisit, serta membiarkan nuansa kebenaran dan ketulusan tetap terbuka.
- source_word: ἐνδυσάμενοι
  choice: mengenakan
  rationale: Padanan Indonesia yang alami untuk tindakan memakai pakaian atau perlengkapan perang; berada dalam rangkaian yang sama dengan 'setelah mengikat'.
- source_word: θώρακα
  choice: baju zirah
  rationale: Istilah yang wajar dan mudah dipahami untuk pelindung dada dalam gambaran perlengkapan perang.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam konteks Paulus, δικαιοσύνη dapat mencakup keadaan benar, perilaku benar, dan keadilan. 'Kebenaran' mempertahankan keluasan teologisnya, sementara kemungkinan 'keadilan' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna δικαιοσύνη dalam gambaran baju zirah
  choice: kebenaran
  alternative: keadilan
  rationale: Kata Yunani ini memiliki rentang makna yang mencakup kebenaran dan keadilan. Teks utama memakai istilah yang luas dan lazim dalam bahasa teologis Indonesia, tanpa menentukan apakah yang terutama dimaksud ialah status benar, perilaku benar, atau tatanan yang adil; alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan bahwa sapaan Yunani berbentuk jamak. Susunan kalimat mempertahankan tindakan persiapan yang menyertai perintah utama tanpa memasukkan kata 'ikat pinggang' yang tidak eksplisit dalam teks sumber.
