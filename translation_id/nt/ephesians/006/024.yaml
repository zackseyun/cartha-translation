id: EPH.6.24
reference: Ephesians 6:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: id
  text: Anugerah menyertai semua orang yang mengasihi Tuhan kita Yesus, Sang Mesias, dalam ketidakbinasaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kasih yang tidak binasa”; kemungkinan lain, “dengan tulus” atau “dengan kasih yang tak kunjung padam.” Ungkapan Yunani yang harfiah berarti “dalam ketidakbinasaan” bersifat ringkas dan ambigu.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Anugerah
  rationale: Dalam berkat penutup surat Paulus, χάρις menunjuk pada anugerah atau kemurahan Allah; bentuk tanpa verba dipadankan secara wajar dengan menyisipkan 'menyertai'.
- source_word: μετὰ πάντων
  choice: menyertai semua orang
  rationale: μετά dengan genitif berarti 'bersama'; dalam rumusan berkat bahasa Indonesia, 'menyertai semua orang' alami dan mempertahankan fungsi optatif dari klausa tanpa verba.
- source_word: τῶν ἀγαπώντων
  choice: yang mengasihi
  rationale: Partisipel kini substantival diterjemahkan sebagai klausa relatif yang menyatakan ciri yang berlangsung.
- source_word: τὸν κύριον ἡμῶν
  choice: Tuhan kita
  rationale: κύριος di sini merupakan gelar kristologis dan secara baku dipadankan dengan 'Tuhan'.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesus, Sang Mesias
  rationale: Χριστός dipahami sebagai gelar 'Mesias'; koma dan 'Sang' membuat hubungan nama-gelar itu jelas serta idiomatis dalam bahasa Indonesia.
- source_word: ἐν ἀφθαρσίᾳ
  choice: dalam ketidakbinasaan
  rationale: Padanan yang relatif formal ini mempertahankan keringkasan dan ambiguitas frasa Yunani, tanpa memastikan apakah frasa tersebut menerangkan kasih, cara mengasihi, atau lingkup berkat.
theological_decisions:
- issue: Makna dan kaitan sintaksis ἐν ἀφθαρσίᾳ
  choice: Mempertahankan ungkapan ambigu 'dalam ketidakbinasaan' dalam teks utama
  alternative: dengan kasih yang tidak binasa; dengan tulus; dengan kasih yang tak kunjung padam
  rationale: Bahasa Yunani tidak secara tegas menentukan apakah ἀφθαρσία merupakan sifat kasih mereka, cara mereka mengasihi, atau lingkup/kualitas berkat. Terjemahan utama tidak menutup ketegangan itu, sedangkan kemungkinan penafsirannya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan berkat dibuat alami bagi pembaca umum, sedangkan ungkapan penutup yang tidak lazim dipertahankan secara formal agar ambiguitas sumber tidak hilang.
