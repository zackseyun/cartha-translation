base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: id
  text: Karena itu, saya meminta kalian[a] untuk tidak tawar hati karena kesengsaraan saya demi kalian; itulah kemuliaan kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Yunani, pihak yang diminta tidak disebutkan secara tersurat. Berdasarkan konteks, yang dimaksud adalah para pembaca.
    reason: syntactic_ambiguity
  - marker: b
    text: «Kemuliaan» juga dapat berarti «kehormatan». Frasa ini terutama merujuk kepada kesengsaraan Paulus bagi mereka, tetapi dapat mencakup pelayanannya melalui penderitaan itu.
    reason: referent_and_lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari uraian sebelumnya dengan penghubung yang alami dalam bahasa Indonesia.
- source_word: αἰτοῦμαι
  choice: saya meminta kalian
  rationale: Verba ini menyatakan permohonan atau desakan. Kata ganti objek tidak dinyatakan dalam bahasa Yunani, tetapi 'kalian' wajar dipahami sebagai pihak yang diminta berdasarkan konteks; ambiguitasnya dicatat dalam catatan kaki.
- source_word: μὴ ἐγκακεῖν
  choice: agar tidak tawar hati
  rationale: ἐγκακέω berarti kehilangan keberanian atau menjadi kecil hati. 'Tawar hati' singkat, alami, dan mempertahankan daya ungkap idiomatisnya.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: karena kesengsaraan yang saya alami
  rationale: Dalam kaitannya dengan tindakan menjadi tawar hati, ἐν menyatakan keadaan yang menjadi sebab atau pemicunya. Penambahan 'yang saya alami' mengungkapkan arti posesif 'kesengsaraan saya' secara alami.
- source_word: θλίψεσίν
  choice: kesengsaraan
  rationale: θλῖψις menunjuk pada tekanan, penderitaan, atau kesusahan berat. 'Kesengsaraan' mempertahankan bobot pengalaman Paulus tanpa menjadi teknis atau usang.
- source_word: ὑπὲρ ὑμῶν
  choice: demi kalian
  rationale: ὑπέρ di sini menyatakan kepentingan atau manfaat bagi orang-orang yang disapa.
- source_word: ἥτις
  choice: semua itu
  rationale: Pronomina relatif feminin tunggal merujuk pada gagasan kesengsaraan Paulus sebagai satu keseluruhan. 'Semua itu' membuat rujukan tersebut jelas dalam bahasa Indonesia tanpa mempersempitnya pada satu kejadian.
- source_word: δόξα ὑμῶν
  choice: kemuliaan kalian
  rationale: δόξα dapat berarti kemuliaan atau kehormatan. 'Kemuliaan' mempertahankan bobot teologis dan retoris ungkapan asli.
theological_decisions:
- issue: Pihak yang diminta untuk tidak tawar hati
  choice: Paulus meminta para pembaca agar tidak tawar hati.
  alternative: Paulus memohon, mungkin kepada Allah, agar ia sendiri tidak tawar hati.
  rationale: Konteks sapaan dan konstruksi infinitif paling wajar menunjuk kepada para pembaca, tetapi teks Yunani tidak menyatakan objek αἰτοῦμαι ataupun subjek infinitif secara eksplisit. Catatan kaki mempertahankan kemungkinan sintaksis lainnya.
- issue: Rujukan ἥτις ἐστὶν δόξα ὑμῶν
  choice: Kesengsaraan Paulus demi mereka merupakan kemuliaan mereka.
  alternative: Seluruh pelayanan dan penderitaan Paulus demi mereka merupakan kemuliaan mereka.
  rationale: Anteseden terdekat adalah 'kesengsaraan saya', yang dapat dipandang sebagai satu gagasan. Ungkapan 'semua itu' tetap cukup luas untuk tidak menutup kemungkinan bahwa yang dimaksud mencakup pelayanan Paulus melalui penderitaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan 'saya/kalian', bernada hangat dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ambiguitas sintaksis dan keluasan rujukan dalam teks Yunani dipertahankan melalui catatan kaki.
