id: EPH.3.8
reference: Ephesians 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: id
  text: 'Kepadaku, yang paling kecil di antara semua orang kudus,[a] anugerah ini diberikan: untuk memberitakan kepada bangsa-bangsa bukan Yahudi[b] kekayaan Mesias[c] yang tak terselami.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang lebih kecil daripada yang paling kecil di antara semua orang kudus.” Bentuk Yunani yang tidak lazim ini sangat menekankan kerendahan diri Paulus.
    reason: lexical_alternative
  - marker: b
    text: Atau “bangsa-bangsa.” Dalam konteks ini, yang dimaksud terutama ialah bangsa-bangsa bukan Yahudi.
    reason: lexical_alternative
  - marker: c
    text: Atau “Kristus.” Kata Yunani Χριστός berarti “Yang Diurapi” dan dapat diterjemahkan sebagai “Mesias” atau “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: yang paling kecil
  rationale: Bentuk yang sangat menekankan kerendahan diri Paulus. Ungkapan ini mempertahankan citra ukuran atau kedudukan dalam bahasa Yunani, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: ἁγίων
  choice: orang kudus
  rationale: Dalam pemakaian Paulus, istilah ini menunjuk kepada orang-orang percaya sebagai umat yang dikhususkan bagi Allah. Padanan ini ringkas dan mempertahankan hubungan leksikal dengan kekudusan.
- source_word: χάρις
  choice: anugerah
  rationale: Kata ini mencakup kemurahan Allah sekaligus tugas pelayanan yang dikaruniakan kepada Paulus. 'Anugerah' mempertahankan bobot teologis dan kesinambungan istilah Paulus.
- source_word: ἔθνεσιν
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada orang-orang dari bangsa lain dalam pembedaan Yahudi dan bukan Yahudi, bukan semata-mata negara atau bangsa secara geopolitik.
- source_word: εὐαγγελίσασθαι
  choice: memberitakan
  rationale: Infinitif ini menyatakan tugas untuk menyampaikan kabar baik. Karena objek pemberitaan langsung menyusul, 'memberitakan' menghasilkan kalimat Indonesia yang alami tanpa kehilangan gagasan proklamasi.
- source_word: ἀνεξιχνίαστον
  choice: tak terselami
  rationale: Istilah ini menggambarkan sesuatu yang tidak dapat ditelusuri atau dipahami sepenuhnya. 'Tak terselami' alami dalam bahasa Indonesia dan mempertahankan unsur ketakterhinggaan maknanya.
- source_word: πλοῦτος
  choice: kekayaan
  rationale: Paulus memakai kata ini secara metaforis untuk kelimpahan yang terdapat dalam karya penyelamatan Allah. Bentuk tunggal kolektif 'kekayaan' paling alami dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός pada bagian ini berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' menerjemahkan makna gelar tersebut dan tidak memperlakukannya semata-mata sebagai nama diri.
theological_decisions:
- issue: Pemaknaan Χριστοῦ sebagai gelar atau sebutan yang menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: Konteks memungkinkan pembaca mengenal sebutan ini secara konvensional sebagai 'Kristus', tetapi bentuk Yunani berasal dari gelar 'Yang Diurapi'. Teks utama menyampaikan arti gelar itu, sementara catatan kaki mempertahankan padanan tradisional.
- issue: Rujukan ἔθνεσιν
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Dalam pembahasan Efesus tentang penyertaan orang bukan Yahudi ke dalam umat Allah, rujukan kontekstualnya lebih khusus daripada bangsa-bangsa secara umum. Alternatif yang lebih harfiah tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mempertahankan penekanan awal pada Paulus sebagai penerima anugerah, sedangkan tanda titik dua memperjelas bahwa tugas memberitakan merupakan isi atau tujuan anugerah tersebut. Istilah tradisional 'orang kudus' dan 'anugerah' dipertahankan karena masih luas dipahami dan penting bagi kesinambungan kosakata Paulus.
