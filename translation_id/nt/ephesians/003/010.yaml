id: EPH.3.10
reference: Ephesians 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: id
  text: supaya sekarang, melalui jemaat, hikmat Allah yang beraneka ragam[a] diberitahukan kepada para penguasa dan para pemegang kuasa di alam surgawi[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hikmat Allah yang beraneka segi." Istilah Yunani menggambarkan hikmat yang memiliki banyak segi atau kaya dalam keragamannya.
    reason: lexical_alternative
  - marker: b
    text: Atau "di tempat-tempat surgawi."
    reason: lexical_alternative
  - marker: c
    text: Ungkapan "para penguasa dan para pemegang kuasa di alam surgawi" kemungkinan besar mengacu kepada kuasa-kuasa kosmis atau rohani, bukan hanya penguasa manusia.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan secara alami dalam bahasa Indonesia dan mempertahankan daya telik konstruksi Yunani.
- source_word: γνωρισθῇ
  choice: diberitahukan
  rationale: Bentuk pasif mempertahankan aoristus pasif subjungtif tanpa menentukan pelaku yang tidak dinyatakan.
- source_word: νῦν
  choice: sekarang
  rationale: Padanan temporal langsung yang mempertahankan penekanan pada masa kini.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: kepada para penguasa dan para pemegang kuasa
  rationale: Membedakan kedua istilah yang berpasangan sambil menghindari istilah kuno; konteks alam surgawi mengarahkan pembaca kepada kuasa kosmis atau rohani.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: di alam surgawi
  rationale: Mengungkapkan lingkup lokatif ungkapan khas Efesus secara wajar tanpa membuatnya terlalu konkret sebagai tempat-tempat tertentu.
- source_word: διὰ τῆς ἐκκλησίας
  choice: melalui jemaat
  rationale: διά dengan genitif menyatakan sarana; 'melalui' mempertahankan fungsi instrumental. 'Jemaat' menyampaikan ἐκκλησία secara alami dan tidak membatasinya pada bangunan.
- source_word: ἡ πολυποίκιλος σοφία
  choice: hikmat Allah yang beraneka ragam
  rationale: '''Beraneka ragam'' menyampaikan banyak segi dan keragaman yang kaya dari πολυποίκιλος dalam bahasa Indonesia modern.'
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif dipadukan secara alami dalam frasa Indonesia 'hikmat Allah' dan tetap menunjukkan bahwa hikmat itu milik atau berasal dari Allah.
theological_decisions:
- issue: Identitas 'para penguasa dan para pemegang kuasa'
  choice: Teks utama mempertahankan sebutan luas, sedangkan catatan menjelaskan bahwa konteks paling kuat menunjuk kepada kuasa kosmis atau rohani.
  alternative: Penguasa manusia saja, atau cakupan luas yang mencakup kuasa duniawi dan surgawi.
  rationale: Tambahan 'di alam surgawi' dan penggunaan pasangan istilah ini dalam surat-surat Paulus sangat mendukung rujukan supra-manusia, tetapi terjemahan tidak menyisipkan kata 'malaikat' atau identifikasi yang lebih sempit daripada teks.
- issue: Nuansa πολυποίκιλος
  choice: beraneka ragam
  alternative: beraneka segi; kaya ragam
  rationale: Pilihan ini mempertahankan gagasan keragaman atau banyaknya segi hikmat Allah tanpa menjelaskan secara dogmatis bentuk keragaman tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan unsur dibuat alami dalam bahasa Indonesia sambil mempertahankan tujuan, bentuk pasif, sarana melalui jemaat, serta lingkup surgawi. Koma penutup dipertahankan karena ayat ini merupakan bagian dari kalimat yang berlanjut dalam konteks Yunani.
