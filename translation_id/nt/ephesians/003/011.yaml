translation:
  language: id
  text: sesuai dengan maksud kekal[a] yang telah dilaksanakan-Nya dalam[b] Mesias[c] Yesus, Tuhan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “maksud zaman-zaman”; dapat juga dipahami sebagai “maksud yang ada sejak segala zaman.”
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui Mesias Yesus.” Preposisi Yunaninya secara harfiah berarti “dalam”, tetapi dalam konteks ini dapat pula bernuansa instrumental.
    reason: alternative_reading
  - marker: c
    text: 'Yunani: Χριστός (christos), yaitu “Kristus” atau “Mesias”; di sini diterjemahkan “Mesias” karena berfungsi sebagai gelar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: sesuai dengan
  rationale: Dengan πρόθεσιν dalam kasus akusatif, κατά menyatakan kesesuaian; frasa ini alami dan tepat dalam bahasa Indonesia.
- source_word: πρόθεσιν τῶν αἰώνων
  choice: maksud kekal
  rationale: Secara harfiah ungkapan ini berarti 'maksud zaman-zaman', tetapi dalam konteksnya menyatakan maksud Allah yang kekal. Pilihan ini menghasilkan bahasa Indonesia yang wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἣν ἐποίησεν
  choice: yang telah dilaksanakan-Nya
  rationale: Dengan objek 'maksud', ποιέω menyatakan bahwa Allah menjalankan atau mewujudkan maksud tersebut. 'Dilaksanakan' menghindari ungkapan tidak alami 'membuat maksud'.
- source_word: ἐν
  choice: dalam
  rationale: Mempertahankan arti langsung preposisi ἐν dan tidak menutup kemungkinan nuansa instrumental, yang dicatat sebagai alternatif.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan menurut maknanya, 'Mesias', bukan sekadar ditransliterasikan.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Tuhan kita
  rationale: Padanan baku dan bermartabat bagi gelar κύριος dengan pronomina posesif ἡμῶν.
theological_decisions:
- issue: Arti πρόθεσιν τῶν αἰώνων
  choice: maksud kekal
  alternative: maksud zaman-zaman
  rationale: Bentuk genitif jamak secara harfiah ialah 'zaman-zaman', tetapi konstruksi ini secara idiomatis menunjuk pada sifat kekal. Catatan kaki mempertahankan keterlihatan bentuk Yunani dan alternatifnya.
- issue: Daya ἐν dalam ἐν τῷ Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  alternative: melalui Mesias Yesus
  rationale: Terjemahan utama mempertahankan preposisi 'dalam' dan membiarkan ketegangan teologis serta sintaktis teks tetap terbuka; kemungkinan instrumental dijelaskan dalam catatan kaki.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός berfungsi sebagai gelar. 'Mesias' menyampaikan arti gelar dan latar Yahudinya.
- issue: Nuansa ἐποίησεν
  choice: telah dilaksanakan-Nya
  alternative: telah ditetapkan-Nya
  rationale: '''Dilaksanakan'' memahami ποιέω sebagai mewujudkan maksud, tetapi verba ini juga dapat dipahami sebagai menetapkan atau membentuk maksud. Catatan kaki mengakui kemungkinan tersebut tanpa mengubah teks utama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mengikuti hubungan sintaktis Yunani, tetapi memakai ungkapan Indonesia yang alami. Bentuk hormat pronominal pada 'dilaksanakan-Nya' membuat subjek ilahi tersirat tetap jelas dari konteks ayat sebelumnya.
