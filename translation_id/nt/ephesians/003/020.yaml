  source_fidelity: 'Terjemahan setia pada sintaks dan makna Yunani: datif doksologis dipertahankan dalam “Bagi Dia”, δυναμένῳ diterjemahkan tepat dengan “yang sanggup”, dan intensitas ὑπὲρ πάντα ... ὑπερεκπερισσοῦ tersampaikan secara wajar melalui “jauh melampaui segala sesuatu”. “Sesuai dengan kuasa yang bekerja di dalam kita” menangkap κατά sebagai ukuran dan partisip kini ἐνεργουμένην sebagai kuasa yang aktif. Koma penutup tepat karena konstruksinya berlanjut ke ayat 21.'
