id: EPH.3.20
reference: Ephesians 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: id
  text: Bagi Dia yang sanggup melakukan jauh melampaui[a] segala sesuatu yang kita minta atau pikirkan[b], sesuai dengan kuasa yang bekerja di dalam kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berlimpah-limpah melampaui” atau “melampaui tanpa batas”; kata Yunani sangat menegaskan bahwa tindakan itu melebihi apa yang diminta atau dipikirkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bayangkan”; kata Yunani mencakup apa yang dapat dipahami atau dibayangkan oleh pikiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Bagi Dia yang sanggup
  rationale: Bentuk partisip substantival datif ini menunjuk kepada penerima pujian yang berlanjut ke ayat 21. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan kata “Allah” yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: δὲ
  choice: tidak dinyatakan dengan kata tersendiri
  rationale: Di sini δέ menandai peralihan menuju doksologi, bukan pertentangan kuat. Dalam bahasa Indonesia, peralihan itu sudah cukup nyata melalui pembukaan “Bagi Dia”; penambahan “adapun” akan terasa kaku.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: jauh melampaui segala sesuatu
  rationale: Gabungan ini menekankan tindakan yang melampaui segala batas dari apa yang diminta atau dipikirkan. “Jauh melampaui” menyampaikan daya intensifnya secara wajar tanpa mengurangi penekanannya.
- source_word: ποιῆσαι
  choice: melakukan
  rationale: Kata ini luas artinya; “melakukan” mempertahankan kesederhanaan sumber tanpa mempersempitnya menjadi “menyelesaikan” atau “menggenapi”.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: segala sesuatu yang kita minta atau pikirkan
  rationale: Sesudah ungkapan perbandingan, pronomina relatif genitif ini secara alami diterjemahkan “segala sesuatu yang”. νοοῦμεν mencakup kegiatan mental berupa memikirkan atau membayangkan.
- source_word: κατὰ τὴν δύναμιν
  choice: sesuai dengan kuasa
  rationale: κατά dengan akusatif menunjukkan ukuran atau patokan. “Sesuai dengan” mempertahankan nuansa ini lebih baik daripada “oleh”, yang terutama menyatakan sarana.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: yang bekerja di dalam kita
  rationale: Partisip kini menggambarkan kuasa yang sedang aktif dan efektif. “Di dalam kita” mempertahankan pengertian utama ἐν ἡμῖν tanpa menentukan mekanisme teologisnya.
theological_decisions:
- issue: Rujukan penerima doksologi yang tersirat
  choice: Bagi Dia yang sanggup
  alternative: Bagi Allah yang sanggup
  rationale: Konteks menunjuk kepada Allah, tetapi ayat ini tidak mengulangi nomina “Allah”. Terjemahan mempertahankan bentuk rujukan tersirat dari teks Yunani dan kesinambungannya dengan ayat 21.
- issue: Kuasa ilahi yang aktif pada orang percaya
  choice: kuasa yang bekerja di dalam kita
  alternative: kuasa yang bekerja di antara kita
  rationale: Ungkapan ini menegaskan kuasa yang efektif dalam diri atau lingkungan umat percaya, tanpa memasukkan penjelasan denominasi tertentu tentang cara kuasa itu bekerja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doksologis yang khidmat tetapi tetap mudah dipahami. Koma penutup dipertahankan karena ayat ini secara sintaksis berlanjut ke Efesus 3:21.
