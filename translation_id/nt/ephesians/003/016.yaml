  terminology: “Kekayaan kemuliaan-Nya,” “kuasa,” dan “Roh-Nya” tepat. “Diri batiniah” secara alami menyampaikan ὁ ἔσω ἄνθρωπος tanpa membatasi rujukannya pada laki-laki. Kapitalisasi “Roh-Nya” sesuai dengan rujukan kontekstual kepada Roh Allah.
