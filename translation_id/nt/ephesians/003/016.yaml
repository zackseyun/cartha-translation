  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: id
  text: supaya Ia, sesuai dengan kekayaan kemuliaan-Nya, mengaruniakan kepada kamu untuk dikuatkan dengan kuasa melalui Roh-Nya dalam diri batiniah kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam manusia batiniah.” Ungkapan tunggal ini menunjuk pada diri batiniah setiap orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai isi sekaligus tujuan permohonan doa Paulus dan secara alami melanjutkan kalimat dari ayat sebelumnya.
- source_word: δῷ ὑμῖν
  choice: Ia ... mengaruniakan kepada kalian
  rationale: Bentuk subjungtif dalam konteks doa menyatakan permohonan agar Allah menganugerahkan sesuatu; 'kalian' mempertahankan bentuk jamak ὑμῖν.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: sesuai dengan kekayaan kemuliaan-Nya
  rationale: κατά dengan akusatif menyatakan ukuran atau patokan; 'sesuai dengan' tidak menyiratkan bahwa pemberian itu hanya sebagian dari kekayaan tersebut.
- source_word: δυνάμει κραταιωθῆναι
  choice: untuk dikuatkan dengan kuasa
  rationale: Mempertahankan bentuk pasif κραταιωθῆναι dan fungsi instrumental δυνάμει dengan ungkapan Indonesia yang jelas.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: melalui Roh-Nya
  rationale: διά dengan genitif menunjukkan sarana atau perantaraan; konteks Paulus menunjuk kepada Roh Allah.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: di dalam batin kalian
  rationale: Ungkapan Yunani harfiah 'manusia batiniah' menunjuk pada diri terdalam. 'Batin kalian' alami dalam bahasa Indonesia, mempertahankan sasaran penguatan, dan membuat bentuk tunggal representatif itu jelas bagi para penerima jamak.
theological_decisions:
- issue: Referen πνεῦμα
  choice: Roh Allah secara personal ('Roh-Nya')
  alternative: roh-Nya sebagai pengaruh atau daya ilahi yang tidak personal
  rationale: Konteks doa tentang karya ilahi dalam orang percaya dan pemakaian Paulus mendukung rujukan kepada Roh Allah; kapitalisasi menandai referen itu tanpa menambahkan sebutan yang tidak terdapat dalam teks.
- issue: Makna ἔσω ἄνθρωπον
  choice: diri batiniah setiap penerima, diterjemahkan 'batin kalian'
  alternative: terjemahan lebih harfiah 'manusia batiniah' atau arah 'ke dalam manusia batiniah'
  rationale: ἄνθρωπος di sini merupakan bentuk tunggal representatif, bukan rujukan khusus kepada laki-laki. Terjemahan utama menyampaikan maknanya secara wajar, sedangkan catatan mempertahankan bentuk ungkapan Yunani dan kemungkinan nuansa arah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk membedakan ὑμῖν dari bentuk tunggal. Kapitalisasi 'Ia', '-Nya', dan 'Roh' mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan tetap menunjukkan bahwa ayat ini merupakan anak kalimat yang melanjutkan doa pada konteks sebelumnya.
