id: EPH.3.6
reference: Ephesians 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: id
  text: yaitu bahwa bangsa-bangsa bukan Yahudi[a] turut menjadi ahli waris, turut menjadi anggota satu tubuh[b], dan turut mengambil bagian dalam janji di dalam Mesias Yesus[c] melalui Injil,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bangsa-bangsa.” Di sini istilah itu secara khusus menunjuk kepada bangsa-bangsa bukan Yahudi yang diikutsertakan dalam janji keselamatan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “turut menjadi satu tubuh.”
    reason: literal_alternative
  - marker: c
    text: 'Terjemahan tradisional: “Kristus Yesus.” Gelar Yunani Χριστός diterjemahkan di sini sebagai “Mesias” untuk mempertahankan maknanya sebagai gelar.'
    reason: alternative_rendering
lexical_decisions:
- source_word: εἶναι
  choice: yaitu bahwa ... turut menjadi
  rationale: Infinitif ini menjelaskan isi rahasia yang disebut pada ayat sebelumnya. Ungkapan “yaitu bahwa” menghubungkan penggalan ini secara alami dengan konteksnya.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada orang-orang non-Yahudi, bukan negara atau bangsa dalam pengertian geopolitik. Bentuk ini jelas bagi pembaca Indonesia dan tetap mempertahankan unsur “bangsa-bangsa” dari bahasa sumber.
- source_word: συγκληρονόμα
  choice: turut menjadi ahli waris
  rationale: Unsur awalan συν- menyatakan kebersamaan dalam menerima warisan. Pengulangan “turut” juga mempertahankan kesejajaran retoris ketiga kata majemuk Yunani.
- source_word: σύσσωμα
  choice: turut menjadi anggota satu tubuh
  rationale: Kata langka ini menyatakan bahwa orang bukan Yahudi dimasukkan bersama ke dalam tubuh yang sama. “Anggota satu tubuh” mempertahankan metafora tubuh sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: συμμέτοχα
  choice: turut mengambil bagian
  rationale: Ungkapan ini menyatakan partisipasi bersama dan mempertahankan pola sejajar dengan dua unsur sebelumnya.
- source_word: τῆς ἐπαγγελίας
  choice: dalam janji
  rationale: Genitif ini melengkapi συμμέτοχα dan menyatakan apa yang mereka ikuti atau nikmati bersama. Bentuk tunggal “janji” dipertahankan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: Preposisi ἐν dipertahankan sebagai “di dalam” karena ungkapan ini menyatakan hubungan atau persatuan dengan Mesias, bukan sekadar alat. Χριστός masih memiliki daya sebagai gelar dalam argumen keselamatan-historis ini.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: melalui Injil
  rationale: 'διά dengan genitif menyatakan sarana: melalui pemberitaan kabar baik itulah bangsa-bangsa bukan Yahudi ikut menerima janji.'
theological_decisions:
- issue: Daya gelar Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Dalam konteks penjelasan tentang penggenapan janji Allah dan masuknya bangsa-bangsa bukan Yahudi, Χριστός tetap jelas berfungsi sebagai gelar. Catatan kaki mempertahankan bentuk tradisional sebagai alternatif.
- issue: Identitas τὰ ἔθνη
  choice: bangsa-bangsa bukan Yahudi
  alternative: bangsa-bangsa
  rationale: Konteks menegaskan bahwa kelompok ini ikut bersama umat Yahudi dalam warisan, tubuh, dan janji. Terjemahan ini membuat referennya jelas tanpa menambahkan identitas denominasi tertentu.
- issue: Metafora σύσσωμα
  choice: turut menjadi anggota satu tubuh
  alternative: turut menjadi satu tubuh
  rationale: Pilihan utama menjelaskan metafora tubuh secara wajar tanpa menghilangkannya, sedangkan catatan kaki menyediakan bentuk yang lebih dekat dengan kepadatan kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “turut” sengaja dipakai untuk mencerminkan tiga kata majemuk berawalan συν- dan irama tiga serangkai dalam bahasa Yunani. Ayat dipertahankan sebagai lanjutan sintaksis dari ayat sebelumnya, sehingga dimulai dengan huruf kecil dan diakhiri koma.
