  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: id
  text: dan untuk menerangi semua orang tentang apa pengelolaan[a] rahasia itu—rahasia yang sejak zaman-zaman dahulu tersembunyi di dalam Allah, Sang Pencipta segala sesuatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penatalayanan,” “pengaturan,” atau “rencana.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah menambahkan “melalui Yesus Kristus” setelah “segala sesuatu.”
    reason: textual_variant
lexical_decisions:
- source_word: φωτίσαι
  choice: menerangi
  rationale: Mempertahankan metafora terang dalam bahasa Yunani. Dengan pelengkap “mengenai,” ungkapan ini secara alami menyatakan tindakan membuat sesuatu menjadi jelas atau diketahui.
- source_word: πάντας
  choice: semua orang
  rationale: Bentuk maskulin jamak dalam konteks ini paling wajar merujuk kepada manusia; “semua orang” menyampaikan cakupan universal dengan jelas.
- source_word: τίς ἡ οἰκονομία
  choice: bagaimana ... dilaksanakan
  rationale: οἰκονομία dapat menunjuk pada pengelolaan, pengaturan, atau pelaksanaan suatu rencana. Bentuk verbal ini alami dalam bahasa Indonesia dan tetap menyoroti pelaksanaan rahasia tersebut, bukan hanya isinya.
- source_word: μυστηρίου
  choice: rahasia
  rationale: Dalam konteks Paulus, istilah ini menunjuk pada maksud ilahi yang dahulu tersembunyi lalu dinyatakan. “Rahasia” lebih mudah dipahami pembaca Indonesia modern daripada “misteri” dan tidak menyiratkan sesuatu yang mustahil dipahami.
- source_word: ἀποκεκρυμμένου
  choice: tersembunyi
  rationale: Menyampaikan keadaan yang dihasilkan oleh tindakan penyembunyian sebelumnya, sesuai daya aspek bentuk perfect pasif.
- source_word: ἀπὸ τῶν αἰώνων
  choice: selama segala zaman
  rationale: Mengungkapkan lamanya keadaan tersembunyi itu tanpa memperluas frasa Yunani menjadi pernyataan eksplisit tentang kekekalan.
- source_word: ἐν τῷ θεῷ
  choice: di dalam Allah
  rationale: Mempertahankan ἐν secara langsung dan menyatakan bahwa rahasia itu tersembunyi di dalam Allah, bukan sekadar berada bersama-Nya.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: Allah yang menciptakan segala sesuatu
  rationale: Mengubah partisip berartikel menjadi klausa relatif yang alami, sambil mempertahankan Allah sebagai rujukannya dan τὰ πάντα sebagai “segala sesuatu.”
theological_decisions:
- issue: Makna οἰκονομία dalam hubungannya dengan rahasia
  choice: bagaimana rahasia itu dilaksanakan
  alternative: apa pengelolaan/pengaturan rahasia itu
  rationale: Pilihan utama mempertahankan gagasan pengelolaan atau pelaksanaan maksud ilahi dengan bahasa Indonesia yang alami, tanpa memasukkan kerangka dispensasional teknis. Catatan kaki mempertahankan rentang leksikalnya.
- issue: Daya waktu ἀπὸ τῶν αἰώνων
  choice: selama segala zaman
  alternative: sejak zaman-zaman dahulu; sejak kekekalan
  rationale: Bahasa Yunani menyebut “zaman-zaman,” bukan secara eksplisit “kekekalan.” Pilihan ini menjaga kedalaman waktu sekaligus menghindari penegasan teologis yang melebihi bentuk sumber.
- issue: Lokasi rahasia menurut ἐν τῷ θεῷ
  choice: di dalam Allah
  alternative: pada Allah; bersama Allah
  rationale: Terjemahan langsung “di dalam Allah” mempertahankan gambaran dan ketegangan teologis teks tanpa menjelaskannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan hubungan ayat ini dengan pernyataan tujuan pada ayat sebelumnya. Tanda pisah memperjelas bahwa “Allah yang menciptakan segala sesuatu” menjelaskan “Allah,” bukan “rahasia.”
