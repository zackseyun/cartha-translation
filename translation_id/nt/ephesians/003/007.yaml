base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: id
  text: Aku menjadi pelayan Injil itu sesuai dengan karunia anugerah Allah yang diberikan kepadaku, sesuai dengan kerja kuasa-Nya—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku dijadikan pelayan Injil itu.”
    reason: Alternatif ini mempertahankan kemungkinan nuansa pasif pada ἐγενήθην.
lexical_decisions:
- source_word: οὗ
  choice: yang untuknya
  rationale: Kata ganti relatif genitif ini merujuk kepada εὐαγγέλιον (‘Injil’) dalam ayat sebelumnya. Ungkapan ini menyatakan bahwa Paulus menjadi pelayan Injil, sekaligus menghindari kesan bahwa acuannya adalah seorang pribadi.
- source_word: ἐγενήθην
  choice: aku menjadi
  rationale: Bentuk aoris dari γίνομαι secara wajar berarti ‘menjadi’. Pilihan ini mempertahankan kemungkinan nuansa pasif tanpa menyatakannya secara berlebihan; konteks tetap menunjukkan bahwa Allah adalah sumber panggilan tersebut.
- source_word: διάκονος
  choice: pelayan
  rationale: Kata ini menunjuk kepada orang yang melayani. ‘Pelayan’ alami dalam bahasa Indonesia dan tidak memasukkan pengertian jabatan gerejawi khusus seperti ‘diaken’.
- source_word: κατὰ τὴν δωρεὰν
  choice: sesuai dengan karunia
  rationale: κατά dengan akusatif menyatakan kesesuaian, dasar, atau ukuran. ‘Sesuai dengan’ mempertahankan hubungan tersebut lebih tepat daripada sekadar ‘oleh’.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: anugerah Allah
  rationale: Rangkaian genitif diterjemahkan secara alami dan bermartabat. ‘Anugerah’ mempertahankan gagasan pemberian ilahi yang tidak diperoleh karena jasa.
- source_word: τῆς δοθείσης μοι
  choice: yang diberikan kepadaku
  rationale: Partisip pasif atributif diterjemahkan sebagai klausa relatif agar kaitannya dengan anugerah tetap jelas dan unsur penerimaan pasif tetap terpelihara.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: sesuai dengan bekerjanya
  rationale: ἐνέργεια menunjuk pada tindakan atau daya yang bekerja secara efektif. Bentuk ‘bekerjanya’ mempertahankan sifat aktif dari kuasa Allah dan paralelisme kedua frasa κατὰ.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: kuasa-Nya
  rationale: δύναμις secara tepat diterjemahkan ‘kuasa’ dalam konteks Paulus. Akhiran ‘-Nya’ secara kontekstual mengacu kepada Allah.
theological_decisions:
- issue: Hakikat peran Paulus sebagai διάκονος
  choice: pelayan
  alternative: pelayan rohani; diaken
  rationale: Konteks membicarakan pelayanan Paulus bagi Injil, bukan secara eksplisit jabatan gerejawi formal. ‘Pelayan’ menjaga arti fungsional tanpa membawa struktur gerejawi yang lebih kemudian.
- issue: Agensi dalam ἐγενήθην
  choice: aku menjadi
  alternative: aku dijadikan
  rationale: Bahasa Yunani memungkinkan nuansa pasif, tetapi bentuk yang dipilih mempertahankan ambiguitas gramatikal secara alami. Frasa berikutnya sudah menegaskan bahwa anugerah dan kuasa Allah mendasari pelayanan Paulus.
- issue: Hubungan karunia dan anugerah
  choice: karunia anugerah Allah
  alternative: karunia berupa anugerah Allah; karunia dari anugerah Allah
  rationale: Rangkaian genitif Yunani dapat dipahami sebagai karunia yang berasal dari atau terdiri atas anugerah Allah. Terjemahan yang ringkas ini mempertahankan ketegangan tersebut tanpa menentukan relasinya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina orang pertama ‘aku’ mengikuti suara pribadi Paulus; ‘pelayan’ dipilih daripada istilah jabatan. Tanda pisah akhir dipertahankan karena ayat ini berlanjut secara sintaktis ke ayat berikutnya.
