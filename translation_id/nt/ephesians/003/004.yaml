  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: id
  text: Dengan membaca ini, kalian dapat memahami wawasanku tentang rahasia Mesias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau, dalam bentuk tradisional, “Kristus.”
    reason: Mencatat padanan tradisional bagi gelar Yunani tanpa mengganti arti gelarnya dalam teks utama.
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: Dengan membaca apa yang telah kutulis itu
  rationale: Ungkapan ini merujuk kembali pada tulisan Paulus yang baru disebutkan dan menyatakan sarana bagi para pembaca untuk memahami pengertiannya. Bentuk ini alami dalam bahasa Indonesia serta mempertahankan hubungan wacana dan nuansa instrumental partisipel.
- source_word: δύνασθε
  choice: kalian dapat
  rationale: Kata kerja ini menyatakan kemampuan. Kata ganti jamak 'kalian' memperjelas bahwa sapaan ditujukan kepada para pembaca secara kolektif.
- source_word: νοῆσαι
  choice: memahami
  rationale: Kata ini menunjuk pada tindakan menangkap atau mengerti sesuatu secara mental; 'memahami' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: τὴν σύνεσίν μου
  choice: pengertianku
  rationale: σύνεσις berarti pengertian, pemahaman, atau wawasan. 'Pengertianku' mempertahankan makna dasarnya dan posesif orang pertama secara ringkas.
- source_word: ἐν τῷ μυστηρίῳ
  choice: tentang rahasia
  rationale: Dalam hubungan dengan 'pengertian', preposisi ἐν menunjukkan ranah atau pokok pengertian tersebut. 'Tentang' merupakan padanan idiomatis tanpa menghilangkan hubungan semantisnya.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός pada konteks ini berfungsi sebagai gelar. 'Mesias' menyampaikan arti gelar itu, sedangkan bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
theological_decisions:
- issue: Terjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Istilah tersebut berfungsi sebagai gelar dalam frasa 'rahasia Mesias'. Terjemahan 'Mesias' mempertahankan arti gelarnya tanpa menentukan secara berlebihan bagaimana genitif itu harus dipahami.
- issue: Hubungan genitif dalam τοῦ Χριστοῦ
  choice: rahasia Mesias
  alternative: rahasia tentang Mesias
  rationale: Bentuk genitif Yunani dapat mencakup beberapa hubungan makna. Terjemahan genitif langsung mempertahankan kepadatan dan ambiguitas asli, alih-alih membatasinya hanya sebagai rahasia yang pokoknya adalah Mesias.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk orang kedua jamak secara jelas; 'apa yang telah kutulis itu' membuat rujukan balik πρὸς ὃ eksplisit dan alami. Tanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
