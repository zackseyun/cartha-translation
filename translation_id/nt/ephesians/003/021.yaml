  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: id
  text: Bagi Dialah kemuliaan di dalam jemaat dan di dalam Mesias Yesus turun-temurun sampai selama-lamanya. Amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Bagi Dialah kemuliaan
  rationale: Klausa Yunani tidak memiliki verba. Rumusan ini mempertahankan bentuk pengagungan dan secara alami menyatakan bahwa kemuliaan diperuntukkan bagi Dia tanpa menambahkan verba eksplisit.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: di dalam jemaat
  rationale: ἐκκλησία di sini menunjuk kepada komunitas umat, bukan gedung; 'jemaat' merupakan padanan Indonesia yang jelas dan mapan. 'Di dalam' mempertahankan ἐν serta kesejajarannya dengan frasa berikut.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: dan di dalam Mesias Yesus
  rationale: Χριστός dipertahankan sebagai gelar bermakna, 'Mesias', sedangkan Ἰησοῦ ditransliterasikan sebagai nama. Pengulangan 'di dalam' menjaga struktur paralel Yunani.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: sepanjang segala generasi
  rationale: Dalam ungkapan waktu, εἰς menyatakan rentang yang terus berlangsung; 'sepanjang' alami dalam bahasa Indonesia dan mempertahankan cakupan πάσας.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ungkapan idiomatis Yunani ini menyatakan durasi tanpa akhir. 'Selama-lamanya' menyampaikan maknanya dengan wajar dalam ragam doksologis Indonesia.
- source_word: ἀμήν
  choice: Amin
  rationale: Transliterasi liturgis yang baku dan luas dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Χριστός sebagai gelar atau unsur nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός secara leksikal adalah gelar 'Yang Diurapi/Mesias'. Terjemahan utama mempertahankan kandungan gelarnya, sementara bentuk tradisional dicatat sebagai alternatif.
- issue: Hubungan kemuliaan dengan jemaat dan Mesias Yesus
  choice: di dalam jemaat dan di dalam Mesias Yesus
  alternative: melalui jemaat dan melalui Mesias Yesus
  rationale: Terjemahan mempertahankan preposisi ἐν dan kesejajaran kedua frasa tanpa menentukan secara lebih sempit apakah nuansanya lokatif, lingkup, atau perantaraan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk doksologi dibuat alami tanpa menghilangkan struktur paralel teks Yunani; kapitalisasi pronomina ilahi mengikuti kebiasaan hormat yang umum.
