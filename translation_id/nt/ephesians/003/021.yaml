revisions:
- from: Bagi Dialah kemuliaan di dalam jemaat dan di dalam Mesias Yesus, sepanjang segala generasi, selama-lamanya.[a] Amin.
  to: Bagi Dialah kemuliaan di dalam jemaat dan di dalam Mesias Yesus turun-temurun sampai selama-lamanya. Amin.
  rationale: Only the final temporal expression has been revised for natural modern Indonesian and to reflect its syntactic unity in Greek. The translation retains the source’s ambiguity concerning the precise nuance of ἐν and preserves “Mesias” as the meaningful rendering of Χριστός.
