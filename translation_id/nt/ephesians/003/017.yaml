  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: id
  text: supaya Sang Mesias[a] tinggal di dalam hati kalian melalui iman[b], sementara kalian berakar dan berlandaskan dalam kasih[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός merupakan gelar yang berarti “Mesias.”
    reason: alternative_reading
  - marker: b
    text: Atau “kepercayaan.” Kata Yunani πίστις juga dapat mengandung arti kepercayaan atau kesetiaan, tetapi “iman” paling sesuai dalam konteks ini.
    reason: lexical_alternative
  - marker: c
    text: Frasa “dalam kasih” paling wajar dihubungkan dengan “berakar dan berlandaskan,” meskipun ada yang menghubungkannya dengan “tinggal di dalam hati kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: tinggal
  rationale: Kata ini menyatakan berdiam atau menetap, bukan sekadar hadir sesaat. “Tinggal di dalam hati” alami dalam bahasa Indonesia dan tetap mempertahankan gambaran kediaman yang menetap dalam konteks doa ini.
- source_word: τὸν Χριστόν
  choice: Sang Mesias
  rationale: Χριστός di sini diperlakukan sebagai gelar. “Sang Mesias” menerjemahkan makna gelar itu dan, dengan “Sang,” terdengar wajar serta hormat dalam bahasa Indonesia.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: διά dengan genitif menyatakan sarana. Dalam konteks ini πίστις paling wajar menunjuk pada iman, meskipun nuansa kepercayaan juga mungkin.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: di dalam hati kalian
  rationale: Ungkapan ini menunjuk pada batin manusia secara menyeluruh, bukan hanya perasaan. “Kalian” memperjelas bahwa ὑμῶν berbentuk jamak.
- source_word: ἐν ἀγάπῃ
  choice: kasih
  rationale: Frasa ini paling wajar dihubungkan dengan kedua partisipel berikutnya. Dalam bahasa Indonesia, “berakar dan berlandaskan kasih” mengungkapkan lingkup atau dasar tersebut tanpa konstruksi yang kaku.
- source_word: ἐρριζωμένοι
  choice: berakar
  rationale: Bentuk partisip sempurna pasif menyatakan keadaan berkelanjutan sebagai hasil tindakan sebelumnya. “Berakar” mempertahankan metafora tumbuhan secara alami.
- source_word: τεθεμελιωμένοι
  choice: berlandaskan
  rationale: Pilihan ini mempertahankan metafora bangunan dan gagasan tentang dasar yang kokoh, sekaligus berpasangan secara alami dengan “berakar.”
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Bentuk Yunani ini berfungsi sebagai gelar dalam konstruksi tersebut. Menerjemahkannya sebagai “Mesias” mempertahankan arti gelarnya tanpa menambahkan tafsiran denominasi tertentu.
- issue: Makna πίστις dalam διὰ τῆς πίστεως
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks paling alami menunjuk pada iman sebagai sarana Sang Mesias tinggal di hati orang percaya. Kemungkinan leksikal lain dicatat tanpa menjadikannya bacaan utama.
- issue: Keterkaitan ἐν ἀγάπῃ
  choice: dihubungkan dengan “berakar dan berlandaskan”
  alternative: dihubungkan dengan “tinggal di dalam hati kalian”
  rationale: Urutan kata dan alur sintaksis lebih mendukung bahwa kasih adalah ranah tempat para pembaca berakar dan berlandaskan, tetapi keterkaitan alternatif tetap mungkin.
- issue: Hubungan kedua partisipel dengan klausa doa
  choice: ditampilkan sebagai keadaan yang mendasari dengan “karena kalian”
  alternative: '“dengan kalian”; atau dijadikan kelanjutan permohonan: “supaya kalian”'
  rationale: Bentuk nominatif jamak ἐρριζωμένοι dan τεθεμελιωμένοι merujuk kepada para pembaca dan dapat menyatakan keadaan yang sudah berlangsung. “Karena kalian” membuat hubungan itu jelas dalam bahasa Indonesia tanpa mengubahnya menjadi dua verba utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan mudah dipahami. “Kalian” dipakai untuk memperjelas bentuk jamak Yunani; “Sang” menjaga kealamian dan kehormatan gelar “Mesias.” Tanda koma akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
