  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: id
  text: Karena itulah aku, Paulus, tahanan Mesias Yesus[a] demi kamu, orang-orang bukan Yahudi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus Yesus.”'
    reason: Padanan tradisional untuk gelar Yunani Χριστός.
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Karena itulah
  rationale: Ungkapan ini menunjuk kembali kepada uraian sebelumnya dan menyatakan alasan atau dasar bagi kalimat yang menyusul. “Karena itulah” alami dalam bahasa Indonesia dan mempertahankan fungsi penghubung wacananya.
- source_word: ἐγὼ Παῦλος
  choice: aku, Paulus,
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan pada Paulus. Bentuk aposisi dengan koma mempertahankan penonjolan diri tersebut tanpa menambah makna.
- source_word: ὁ δέσμιος
  choice: tahanan
  rationale: Kata ini menunjuk kepada orang yang ditahan atau dipenjarakan. “Tahanan” langsung, ringkas, dan tetap memungkinkan hubungan genitif berikutnya dipahami sebagai kepunyaan atau pengabdian.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός di sini adalah gelar bagi Yesus. “Mesias” menerjemahkan gelar itu, sedangkan urutan nama dan gelar mengikuti teks Yunani.
- source_word: ὑπὲρ ὑμῶν
  choice: demi kamu
  rationale: ὑπέρ menyatakan manfaat atau kepentingan pihak lain. “Demi kamu” alami dalam bahasa Indonesia dan menghubungkan pemenjaraan Paulus dengan kepentingan para pembacanya.
- source_word: τῶν ἐθνῶν
  choice: orang-orang bukan Yahudi
  rationale: Dalam konteks ini ἔθνη bukan bangsa-bangsa secara geopolitik, melainkan orang-orang non-Yahudi. Frasa ini juga berfungsi sebagai aposisi yang menjelaskan “kamu”.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk nama yang sudah membeku
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Teks mempertahankan Χριστός sebagai gelar yang bermakna ‘Yang Diurapi’. “Mesias” menyampaikan fungsi gelar itu secara jelas; bentuk tradisional “Kristus Yesus” dicatat sebagai alternatif.
- issue: Hubungan genitif dalam ‘tahanan Mesias Yesus’
  choice: tahanan Mesias Yesus
  alternative: tahanan karena Mesias Yesus
  rationale: Genitif Yunani sengaja dipertahankan secara padat agar tidak dipersempit menjadi satu hubungan saja. Ungkapan itu dapat menyiratkan bahwa Paulus adalah tahanan yang menjadi milik atau melayani Mesias, sekaligus dipenjarakan karena pelayanannya kepada-Nya.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat Yunani terputus dan baru dilanjutkan setelah sisipan pada ayat-ayat berikutnya.
