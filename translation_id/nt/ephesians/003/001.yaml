  source_fidelity: 'Teks Indonesia secara setia mencerminkan seluruh unsur Yunani: Τούτου χάριν sebagai “Karena itulah,” penekanan ἐγὼ Παῦλος sebagai “aku, Paulus,” ὁ δέσμιος sebagai “tahanan,” gelar Χριστοῦ Ἰησοῦ sebagai “Mesias Yesus,” serta ὑπὲρ ὑμῶν τῶν ἐθνῶν sebagai “demi kamu, orang-orang bukan Yahudi.” Tanda pisah penutup tepat mempertahankan sintaks kalimat yang sengaja tertunda dalam teks sumber.'
