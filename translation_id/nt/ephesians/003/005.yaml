  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: id
  text: yang pada generasi-generasi lain tidak diberitahukan kepada anak-anak manusia[a], sebagaimana sekarang telah dinyatakan di dalam Roh[b] kepada para rasul-Nya yang kudus dan nabi-Nya yang kudus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak manusia”; maksudnya dapat juga diungkapkan sebagai “manusia” atau “umat manusia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “oleh Roh”; frasa Yunani ini dapat menyatakan lingkup atau sarana.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: yang
  rationale: Pronomina relatif ini mengacu kembali kepada rahasia dalam ayat sebelumnya. “Yang” mempertahankan hubungan sintaksis itu tanpa mengulangi antesedennya.
- source_word: ἑτέραις γενεαῖς
  choice: pada generasi-generasi lain
  rationale: Datif dipahami secara temporal. “Generasi-generasi lain” mencerminkan ἑτέραις secara lebih langsung daripada “generasi-generasi dahulu,” sementara “pada” terdengar alami dalam bahasa Indonesia.
- source_word: οὐκ ἐγνωρίσθη
  choice: tidak diberitahukan
  rationale: Bentuk pasif γνωρίζω menyatakan tindakan membuat sesuatu diketahui. “Tidak diberitahukan” mempertahankan makna kausatif dan bentuk pasifnya.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: kepada anak-anak manusia
  rationale: Ungkapan harfiah bercorak Semitis ini dipertahankan dalam teks; catatan kaki menjelaskan bahwa maksudnya ialah manusia atau umat manusia pada umumnya.
- source_word: ὡς νῦν
  choice: sebagaimana sekarang
  rationale: Terjemahan ini mempertahankan daya banding ὡς, yang dapat menunjuk pada cara atau taraf penyataan sekarang dibandingkan dengan generasi-generasi lain.
- source_word: ἀπεκαλύφθη
  choice: telah dinyatakan
  rationale: “Dinyatakan” merupakan padanan Indonesia yang alami bagi bentuk pasif ἀποκαλύπτω dalam konteks penyingkapan ilahi; “telah” menyampaikan keadaan kini sebagai hasil tindakan tersebut.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: kepada para rasul dan nabi-Nya yang kudus
  rationale: Susunan ini memperlakukan “rasul dan nabi” sebagai satu kelompok yang diterangkan oleh “kudus,” sesuai koordinasi dalam bahasa Yunani, dan mempertahankan αὐτοῦ sebagai “-Nya.”
- source_word: ἐν πνεύματι
  choice: di dalam Roh
  rationale: Dalam konteks penyataan ilahi, πνεῦμα sangat mungkin merujuk kepada Roh Kudus. “Di dalam” mempertahankan preposisi ἐν dan tidak memutuskan apakah nuansa utamanya lingkup atau sarana.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh Kudus
  alternative: roh manusia atau keadaan/cara rohani
  rationale: Konteks penyataan ilahi kepada para rasul dan nabi sangat mendukung rujukan kepada Roh Kudus. Huruf kapital menandai rujukan yang paling mungkin itu tanpa memperjelasnya secara berlebihan dalam teks.
- issue: Nuansa ἐν pada ἐν πνεύματι
  choice: di dalam Roh
  alternative: oleh Roh
  rationale: “Di dalam Roh” menjaga kemungkinan bahwa frasa itu menyatakan lingkup atau keadaan penyataan, sedangkan catatan kaki mencatat kemungkinan instrumental, yakni Roh sebagai pelaku atau sarana.
- issue: Cakupan ὡς dalam perbandingan
  choice: sebagaimana sekarang
  alternative: tidak pernah diberitahukan sebelumnya, tetapi sekarang dinyatakan
  rationale: Bentuk perbandingan Yunani tidak harus berarti sama sekali tidak ada pengetahuan pada masa lampau; terjemahan dipertahankan agar tidak menghapus ketegangan antara penyangkalan awal dan perbandingan tentang cara atau taraf penyataan sekarang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “anak-anak manusia” sengaja mempertahankan citra sumber meskipun agak bercorak Alkitabiah; maknanya dijelaskan dalam catatan kaki. Tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari kalimat yang berlanjut.
