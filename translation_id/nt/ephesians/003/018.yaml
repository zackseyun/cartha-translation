  text: supaya kamu, bersama semua orang kudus, sanggup memahami betapa lebarnya, panjangnya, tingginya, dan dalamnya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani tidak menyatakan apa yang dirujuk oleh lebar, panjang, tinggi, dan dalam ini. Banyak orang memahami bahwa gagasan tersebut dilanjutkan pada ayat berikutnya dengan kasih Kristus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan klausa tujuan atau hasil dari doa sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: ἐξισχύσητε
  choice: sanggup
  rationale: Menyampaikan kecukupan kekuatan atau kemampuan untuk melakukan tindakan yang dinyatakan oleh infinitif berikutnya.
- source_word: καταλαβέσθαι
  choice: memahami
  rationale: Dalam konteks ini menunjuk pada menangkap atau memahami suatu kenyataan secara mendalam; 'memahami' jelas dan alami dalam bahasa Indonesia modern.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: bersama semua orang kudus
  rationale: Mempertahankan gagasan partisipasi bersama serta istilah Paulus yang lazim bagi umat yang dikuduskan.
- source_word: τί τὸ πλάτος καὶ μῆκος καὶ ὕψος καὶ βάθος
  choice: betapa lebarnya dan panjangnya dan tingginya dan dalamnya
  rationale: Ungkapan 'betapa' membuat deretan dimensi mengalir alami dalam bahasa Indonesia tanpa menyebutkan objek yang tidak dinyatakan dalam teks Yunani; pengulangan 'dan' mempertahankan corak kumulatif sumber.
theological_decisions:
- issue: Acuan keempat dimensi
  choice: Objek dari lebar, panjang, tinggi, dan dalam dibiarkan tersirat.
  alternative: Menambahkan 'kasih Kristus' atau 'rencana keselamatan Allah' sebagai objek dimensi-dimensi itu.
  rationale: Teks Yunani ayat ini tidak menyatakan apa yang diukur. Menambah objek akan menyelesaikan ketegangan yang mungkin baru dilanjutkan oleh ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Orang kudus' dipertahankan sebagai istilah Paulus yang mapan. Struktur dimensi dibuat idiomatis dengan 'betapa', sementara acuan yang ambigu tetap tidak dinyatakan.
