id: EPH.3.14
reference: Ephesians 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: id
  text: Karena itu, aku berlutut kepada Bapa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Karena itu
  rationale: Ungkapan ini menyatakan alasan atau dasar bagi tindakan yang menyusul dan secara alami menghubungkannya dengan konteks sebelumnya.
- source_word: κάμπτω τὰ γόνατά μου
  choice: aku berlutut
  rationale: Secara harfiah berarti 'aku menekukkan lututku'. Dalam bahasa Indonesia modern, 'aku berlutut' menyampaikan tindakan dan sikap tubuh yang sama secara alami tanpa menghilangkan gambaran doanya.
- source_word: πρὸς
  choice: di hadapan
  rationale: Dalam konteks doa kepada pribadi, kata depan ini menunjukkan arah atau orientasi kepada Bapa. 'Di hadapan' merupakan ungkapan Indonesia yang wajar untuk sikap berlutut dalam doa, meski nuansa dasarnya juga dapat diterjemahkan 'kepada'.
- source_word: πατέρα
  choice: Bapa
  rationale: Konteks menunjukkan bahwa yang dimaksud adalah Allah yang disapa dalam doa; 'Bapa' mempertahankan pemakaian sebagai sebutan ilahi.
theological_decisions:
- issue: Apakah πατέρα diterjemahkan sebagai sebutan ilahi
  choice: Bapa
  alternative: bapa
  rationale: Paulus sedang menggambarkan doa yang diarahkan kepada Allah, dan ayat berikutnya melanjutkan gambaran kebapaan ini. Huruf kapital menandai referen ilahi tanpa menambahkan gelar yang tidak ada dalam teks.
- issue: Apakah πρὸς perlu diterjemahkan secara harfiah sebagai 'kepada'
  choice: di hadapan
  alternative: kepada
  rationale: '''Di hadapan Bapa'' paling alami setelah kata ''berlutut'' dalam bahasa Indonesia dan sesuai dengan orientasi doa, tetapi tidak dimaksudkan untuk menambahkan gagasan perantaraan atau jarak teologis.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk 'aku' mengikuti suara orang pertama tunggal Paulus. Koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
