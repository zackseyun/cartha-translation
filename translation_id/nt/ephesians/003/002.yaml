  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: id
  text: jika memang kalian telah mendengar tentang tugas pengelolaan anugerah Allah yang diberikan kepadaku bagi kalian[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini berbentuk syarat, “jika memang,” meskipun dalam konteks ini Paulus tampaknya menganggap hal tersebut benar. Atau, “tentu kalian sudah mendengar.”
    reason: alternative_reading
  - marker: b
    text: Atau, “pengelolaan” atau “tugas yang dipercayakan,” untuk “tugas pengelolaan.” Istilah Yunani dapat menunjuk pada pengurusan atau tanggung jawab administratif yang dipercayakan kepada seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: tentu kalian sudah
  rationale: Ungkapan ini tetap mencerminkan anggapan retoris yang diharapkan benar dalam konteks, sedangkan bentuk kondisional harfiahnya dicatat dalam catatan kaki.
- source_word: ἠκούσατε
  choice: mendengar
  rationale: Aoristus memandang tindakan mendengar sebagai satu peristiwa; bersama 'sudah', terjemahan ini alami dalam bahasa Indonesia dan menunjukkan relevansinya kini.
- source_word: οἰκονομίαν
  choice: tugas mengelola
  rationale: Pilihan ini menyampaikan tanggung jawab pengelolaan yang dipercayakan kepada Paulus, tanpa membatasinya pada jabatan atau sistem tertentu.
- source_word: χάριτος τοῦ θεοῦ
  choice: anugerah Allah
  rationale: '''Anugerah'' merupakan padanan baku dan alami bagi χάρις dalam konteks Paulus serta mempertahankan hubungan dengan Allah sebagai sumber atau pemiliknya.'
- source_word: τῆς δοθείσης μοι
  choice: yang diberikan kepadaku
  rationale: Mempertahankan bentuk pasif dan penerima tunggal; secara gramatikal frasa ini paling dekat menerangkan anugerah, sambil tetap berkaitan dengan tugas pengelolaannya.
- source_word: εἰς ὑμᾶς
  choice: untuk kepentingan kalian
  rationale: Menyatakan arah sekaligus manfaat pelayanan Paulus bagi para pembaca dengan jelas dan alami.
theological_decisions:
- issue: Rujukan οἰκονομία τῆς χάριτος τοῦ θεοῦ
  choice: Tanggung jawab mengelola anugerah Allah yang dipercayakan kepada Paulus demi para pembaca.
  alternative: Rencana atau tata penyelenggaraan keselamatan Allah secara lebih abstrak.
  rationale: Konteks langsung menyoroti pelayanan Paulus kepada bangsa-bangsa bukan Yahudi. 'Tugas mengelola' mempertahankan unsur kepercayaan dan tanggung jawab tanpa meniadakan rencana Allah yang lebih luas.
- issue: Daya εἴ γε
  choice: 'Anggapan retoris yang dianggap benar: ''tentu kalian sudah mendengar''.'
  alternative: 'Syarat terbuka: ''jika memang kalian sudah mendengar''.'
  rationale: Konteks menunjukkan bahwa Paulus mengharapkan pembacanya mengetahui tugas yang dipercayakan kepadanya, tetapi bentuk kondisional Yunani tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada wajar dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas. Susunan ayat sengaja dibiarkan sebagai lanjutan kalimat dari ayat sebelumnya, sesuai struktur sumber.
