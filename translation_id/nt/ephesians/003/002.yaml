  naturalness: “Tugas mengelola” dapat dipahami, tetapi “tugas pengelolaan” lebih alami dan lebih ringkas dalam bahasa Indonesia standar. “Telah mendengar” sesuai untuk tindakan mendengar yang dipandang secara utuh dan tetap wajar dalam konteks ini.
  terminology: “Anugerah Allah” merupakan padanan yang baik untuk χάρις τοῦ θεοῦ. “Tugas pengelolaan” menyampaikan nuansa οἰκονομία sebagai tanggung jawab/penatalayanan yang dipercayakan tanpa memaksakan pengertian teologis yang lebih sempit. “Bagi kalian” secara alami menyatakan arah pelayanan kepada para pembaca.
