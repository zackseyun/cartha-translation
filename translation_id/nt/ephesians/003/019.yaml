  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: id
  text: dan mengenal kasih Mesias[a] yang melampaui pengetahuan, supaya kamu dipenuhi sampai kepada seluruh kepenuhan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut penyebutan tradisional, “Kristus”.
    reason: alternative_reading
  - marker: b
    text: Atau, “dipenuhi dengan seluruh kepenuhan Allah”. Secara harfiah, bahasa Yunani berbunyi “dipenuhi menuju seluruh kepenuhan Allah”, suatu ungkapan padat yang dapat menekankan arah menuju ukuran penuh dari kepenuhan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: mengenal
  rationale: Bentuk infinitif dari γινώσκω ini menyatakan permohonan yang dikoordinasikan dengan bagian doa sebelumnya. “Mengenal” mempertahankan kaitan leksikal dengan “pengetahuan” sekaligus dapat mencakup pengenalan yang dialami, bukan hanya diketahui secara intelektual.
- source_word: τε
  choice: dan
  rationale: Partikel τε menghubungkan infinitif ini secara ringan dengan permohonan sebelumnya; “dan” merupakan penghubung Indonesia yang paling wajar.
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην
  choice: kasih ... yang melampaui pengetahuan
  rationale: Klausa relatif menghasilkan bahasa Indonesia yang alami, mempertahankan gagasan bahwa kasih itu melampaui pengetahuan, serta menjaga paradoks antara “mengenal” dan sesuatu yang melampaui “pengetahuan”.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός tetap berfungsi sebagai gelar. “Mesias” menyampaikan arti gelar tersebut, sedangkan konstruksi “kasih Mesias” mempertahankan bentuk genitif tanpa secara eksplisit menentukan arah kasih.
- source_word: ἵνα πληρωθῆτε
  choice: supaya kamu dipenuhi
  rationale: ἵνα memperkenalkan tujuan atau hasil, sedangkan πληρωθῆτε adalah bentuk pasif subjungtif. Ungkapan ini mempertahankan keduanya dengan jelas dan alami.
- source_word: εἰς πᾶν τὸ πλήρωμα
  choice: sampai mencapai seluruh kepenuhan
  rationale: “Sampai mencapai” mengungkapkan daya arah atau tujuan dari εἰς dalam bahasa Indonesia yang wajar. “Seluruh kepenuhan” mempertahankan sifat menyeluruh dan penekanan frasa Yunani.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif diterjemahkan secara langsung dalam susunan “kepenuhan Allah”, tanpa memperluasnya menjadi penafsiran seperti “yang berasal dari Allah”.
theological_decisions:
- issue: Makna genitif dalam τοῦ Χριστοῦ
  choice: kasih Mesias
  alternative: kasih yang berasal dari Mesias; kasih kepada Mesias
  rationale: Konteks kuat mendukung kasih Mesias kepada umat, tetapi bentuk ringkas “kasih Mesias” tidak menyatakan arah genitif secara eksplisit dan dengan demikian mempertahankan ambiguitas gramatikal teks.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: “Mesias” menerjemahkan makna gelar Χριστός dan menjaga daya mesianiknya; bentuk tradisional “Kristus” dicatat sebagai alternatif.
- issue: Makna εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: dipenuhi sampai mencapai seluruh kepenuhan Allah
  alternative: dipenuhi dengan seluruh kepenuhan Allah
  rationale: Pilihan utama mempertahankan unsur arah atau sasaran pada εἰς dan ungkapan Paulus yang padat, tanpa mengubahnya menjadi pernyataan instrumental atau secara diam-diam menetapkan implikasi metafisik tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Paradoks “mengenal ... yang melampaui pengetahuan” dipertahankan. Ungkapan tujuan pada bagian akhir dibuat alami tanpa menghilangkan daya arah εἰς.
