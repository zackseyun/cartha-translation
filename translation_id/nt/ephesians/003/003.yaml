  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: id
  text: bahwa rahasia itu diberitahukan kepada saya melalui wahyu[a], seperti yang telah saya tuliskan secara singkat sebelumnya[c][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut wahyu” atau “dengan wahyu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dinyatakan kepada saya”; secara harfiah, “dibuat diketahui kepada saya.”
