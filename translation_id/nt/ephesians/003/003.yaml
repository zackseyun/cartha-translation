lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: melalui penyataan
  rationale: Frasa κατά dengan akusatif dapat menyatakan cara atau sarana. “Melalui penyataan” alami dalam bahasa Indonesia dan menunjukkan bahwa pengetahuan itu datang melalui penyingkapan ilahi tanpa menentukan pelakunya secara eksplisit.
- source_word: ἐγνωρίσθη μοι
  choice: diberitahukan kepada saya
  rationale: Bentuk pasif aoristus γνωρίζω berarti “dibuat menjadi diketahui” atau “diberitahukan.” Pilihan ini mempertahankan bentuk pasif dan tidak mengulang kosakata “penyataan” secara berlebihan.
- source_word: τὸ μυστήριον
  choice: rahasia itu
  rationale: Dalam pemakaian Paulus, μυστήριον menunjuk pada maksud ilahi yang dahulu tersembunyi lalu disingkapkan. “Rahasia” lebih langsung dipahami pembaca Indonesia modern, sedangkan penunjuk “itu” mewakili artikelnya dan menghubungkannya dengan konteks.
- source_word: καθὼς
  choice: seperti
  rationale: Kata penghubung perbandingan ini secara alami mengaitkan pernyataan tersebut dengan apa yang sudah Paulus tulis.
- source_word: προέγραψα
  choice: telah saya tuliskan sebelumnya
  rationale: Dalam konteks ini, προγράφω merujuk pada tulisan Paulus yang lebih awal, kemungkinan dalam surat yang sama. Pilihan ini mempertahankan unsur temporal tanpa menentukan lokasi rujukannya.
- source_word: ἐν ὀλίγῳ
  choice: secara singkat
  rationale: Ungkapan idiomatis ini menyatakan keringkasan. “Secara singkat” merupakan padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Makna μυστήριον dalam pemakaian Paulus
  choice: rahasia itu
  alternative: misteri itu; rencana Allah yang tersembunyi
  rationale: Ayat ini menyebut konsep tersebut tanpa menguraikan isinya. “Rahasia itu” mempertahankan gagasan tentang sesuatu yang dahulu tersembunyi dan kini disingkapkan, tanpa memasukkan penjelasan dari ayat-ayat sekitar.
- issue: Pelaku yang memberitahukan rahasia
  choice: Mempertahankan bentuk pasif tanpa menyebut pelaku
  alternative: Allah memberitahukan kepada saya
  rationale: Bahasa Yunani tidak menyebut pelaku secara eksplisit. Meskipun konteks menyiratkan tindakan ilahi, terjemahan tidak menambahkannya ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur anak kalimat awal dipertahankan karena ayat ini melanjutkan kalimat dari konteks sebelumnya. Istilah dan catatan kaki menghindari penambahan pelaku ilahi atau uraian isi rahasia yang tidak dinyatakan dalam ayat.
