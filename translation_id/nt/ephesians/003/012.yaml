  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: id
  text: Di dalam Dia kita memiliki keberanian dan jalan masuk dengan keyakinan melalui iman kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui kesetiaan-Nya.” Frasa Yunani ini dapat berarti iman kepada-Nya atau kesetiaan-Nya sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Kata ganti relatif maskulin tunggal paling wajar merujuk kepada Kristus dalam konteks sebelumnya. Ungkapan ini juga mempertahankan nuansa berada di dalam Kristus.
- source_word: παρρησίαν
  choice: keberanian
  rationale: Kata ini menyatakan keterbukaan atau keberanian untuk berbicara dan bertindak tanpa takut; pilihan ini membedakannya dari πεποίθησις yang menyusul.
- source_word: προσαγωγὴν
  choice: jalan masuk
  rationale: Dalam pemakaian Paulus, istilah ini menunjuk pada akses untuk datang ke hadirat Allah. 'Jalan masuk' alami dalam bahasa Indonesia dan mempertahankan gambaran akses tersebut.
- source_word: ἐν πεποιθήσει
  choice: dengan penuh keyakinan
  rationale: Ungkapan ini menyatakan cara atau sikap ketika memperoleh jalan masuk, yakni dengan keyakinan yang teguh.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: melalui iman kepada-Nya
  rationale: Genitif αὐτοῦ dapat dipahami secara objektif sebagai iman yang diarahkan kepada Kristus. Ambiguitas dengan pembacaan subjektif tetap dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna διὰ τῆς πίστεως αὐτοῦ
  choice: melalui iman kepada-Nya
  alternative: melalui kesetiaan-Nya
  rationale: Bentuk Yunani dapat menunjuk pada iman kepada Kristus atau kesetiaan Kristus sendiri. Teks utama memakai pembacaan objektif yang sesuai dengan fokus pada jalan masuk orang percaya, sedangkan pembacaan subjektif dicantumkan tanpa meniadakan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi 'Dia' dan '-Nya' menandai rujukan kepada Kristus menurut kebiasaan penerbitan Alkitab bahasa Indonesia.
