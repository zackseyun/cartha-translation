  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: id
  text: yang dari-Nya setiap keluarga di surga dan di bumi menerima namanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dari-Nya seluruh keluarga di surga dan di bumi menerima namanya”; atau, secara lebih interpretatif, “yang dari-Nya segala kebapaan di surga dan di bumi memperoleh sebutannya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ οὗ
  choice: yang dari-Nya
  rationale: Frasa ini secara langsung menyatakan sumber. Bentuk relatif “yang dari-Nya” mempertahankan kesinambungan dengan “Bapa” pada ayat sebelumnya dan berhubungan alami dengan verba penamaan.
- source_word: πᾶσα
  choice: setiap
  rationale: Dengan nomina tunggal tanpa artikel, πᾶσα paling wajar dipahami secara distributif sebagai “setiap”, sambil tetap mengakui kemungkinan arti kolektif “seluruh” dalam catatan kaki.
- source_word: πατριὰ
  choice: keluarga
  rationale: πατριά biasanya menunjuk kelompok keluarga, kaum, atau garis keturunan. “Keluarga” paling jelas bagi pembaca modern dan tetap mempertahankan permainan kata dengan “Bapa” sejauh mungkin dalam bahasa Indonesia.
- source_word: ἐν οὐρανοῖς
  choice: di surga
  rationale: Walaupun bentuk Yunani jamak, “di surga” merupakan ungkapan Indonesia yang alami untuk ranah surgawi.
- source_word: ἐπὶ γῆς
  choice: di bumi
  rationale: Padanan lokatif yang alami dan tepat dalam bahasa Indonesia.
- source_word: ὀνομάζεται
  choice: menerima namanya
  rationale: Bentuk pasif ὀνομάζεται berarti “dinamai” atau “disebut”. “Menerima namanya” menyampaikan tindakan pasif penamaan sekaligus kaitan sumbernya dengan “dari-Nya”, tanpa mempertegasnya menjadi pernyataan abstrak tentang asal-usul kebapaan.
theological_decisions:
- issue: Makna πᾶσα πατριὰ dalam kaitannya dengan “Bapa” pada ayat sebelumnya
  choice: setiap keluarga
  alternative: seluruh keluarga; segala kebapaan
  rationale: Terjemahan utama mempertahankan arti biasa πατριά sebagai kelompok keluarga dan daya distributif πᾶσα, tanpa memutuskan bahwa yang dimaksud pasti satu keluarga universal atau konsep abstrak segala kebapaan. Kemungkinan kolektif dan interpretatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “yang dari-Nya” sengaja mempertahankan sifat ayat ini sebagai anak kalimat yang melanjutkan ayat sebelumnya. Huruf kapital pada “-Nya” mengikuti kebiasaan penghormatan dalam penerbitan Alkitab Indonesia.
