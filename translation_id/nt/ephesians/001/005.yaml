id: EPH.1.5
reference: Ephesians 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: id
  text: Dengan menetapkan kita sebelumnya untuk diangkat menjadi anak-anak-Nya melalui Yesus Sang Mesias, bagi diri-Nya sendiri[a], sesuai dengan perkenanan kehendak-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada diri-Nya sendiri.” Frasa Yunani ini dapat menunjukkan arah kepada-Nya atau tujuan bagi diri-Nya. Istilah yang diterjemahkan “diangkat menjadi anak-anak-Nya” menunjuk pada pengangkatan ke dalam status anak laki-laki, dengan penekanan pada kedudukan hukum dan hak waris.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: Dengan menetapkan ... sebelumnya
  rationale: Menyatakan tindakan menentukan terlebih dahulu yang terkandung dalam προορίζω, sambil mempertahankan hubungan partisipialnya dengan kalimat berkat yang lebih panjang dalam ayat 3–14.
- source_word: ἡμᾶς εἰς υἱοθεσίαν
  choice: kita ... untuk diangkat menjadi anak-anak-Nya
  rationale: υἱοθεσία menunjuk pada pengangkatan ke dalam kedudukan anak, termasuk nuansa status keluarga dan hak waris. Bentuk jamak 'anak-anak-Nya' alami dalam bahasa Indonesia dan mencakup seluruh umat percaya.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. Χριστός diterjemahkan sebagai gelar 'Mesias', bukan diperlakukan sekadar sebagai bagian nama.
- source_word: εἰς αὐτόν
  choice: bagi diri-Nya sendiri
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada Allah sebagai tujuan atau pihak yang bagi-Nya pengangkatan itu dilakukan; terjemahan ini mempertahankan nuansa refleksif sekaligus telik.
- source_word: κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ
  choice: sesuai dengan kerelaan kehendak-Nya
  rationale: κατά menyatakan kesesuaian, εὐδοκία menyatakan kerelaan atau perkenanan, dan θέλημα secara langsung berarti kehendak.
theological_decisions:
- issue: Makna προορίσας dalam konteks yang diperdebatkan
  choice: menetapkan ... sebelumnya
  alternative: menakdirkan sebelumnya
  rationale: Pilihan ini mempertahankan unsur penentuan lebih dahulu tanpa memasukkan suatu sistem teologis tertentu atau memakai istilah Indonesia yang mudah dipahami sebagai fatalisme.
- issue: Nuansa υἱοθεσία
  choice: diangkat menjadi anak-anak-Nya
  alternative: menerima status sebagai anak laki-laki
  rationale: Terjemahan utama menyampaikan tindakan adopsi dan relasi dengan Allah secara alami. Nuansa hukum Romawi berupa penempatan dalam status anak dan ahli waris diterangkan dalam catatan kaki agar tidak memberi kesan bahwa penerapannya terbatas pada laki-laki.
- issue: Arah atau tujuan εἰς αὐτόν
  choice: bagi diri-Nya sendiri
  alternative: kepada diri-Nya sendiri
  rationale: Bahasa Yunani memungkinkan nuansa tujuan bagi Allah maupun arah menuju kepada-Nya. Teks utama memakai ungkapan tujuan yang alami, sedangkan alternatif dipertahankan dalam catatan kaki.
- issue: Gelar Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan maknanya sebagai 'Mesias'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan partisipial Yunani dihubungkan dengan 'Dengan' karena ayat ini merupakan bagian dari satu kalimat panjang. Kapitalisasi pronomina ilahi mengikuti kebiasaan religius Indonesia, sedangkan 'Sang Mesias' menandai Χριστός sebagai gelar.
