  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: id
  text: Dialah jaminan atas warisan kita, menuju penebusan milik-Nya, demi pujian bagi kemuliaan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang adalah jaminan warisan kita, menuju penebusan milik itu, demi pujian bagi kemuliaan-Nya.” Istilah Yunani yang diterjemahkan “milik-Nya” dapat menunjuk pada milik yang diperoleh atau dimiliki, dan dalam konteks dapat dipahami sebagai umat Allah.'
    reason: Mempertahankan ambiguitas τῆς περιποιήσεως dan menjelaskan bahwa "-Nya" dalam terjemahan utama merupakan penjelasan kontekstual, sambil mencatat daya arah εἰς.
lexical_decisions:
- source_word: ὅ
  choice: Dialah
  rationale: Kata ganti relatif ini merujuk kepada Roh Kudus dalam ayat sebelumnya; bentuk personal dipertahankan dan disesuaikan secara alami dengan awal kutipan ayat mandiri.
- source_word: ἀρραβών
  choice: jaminan
  rationale: Istilah ini menunjuk pada pembayaran pertama atau tanda jadi yang menjamin pelunasan dan penerimaan penuh kelak; 'jaminan' paling alami dalam bahasa Indonesia dan tetap memuat fungsi kepastian tersebut.
- source_word: κληρονομία
  choice: warisan
  rationale: Padanan langsung yang mempertahankan citra penerimaan bagian yang dijanjikan Allah.
- source_word: εἰς ἀπολύτρωσιν
  choice: sampai ... ditebus
  rationale: εἰς menyatakan arah atau tujuan menuju penebusan yang akan digenapi; 'sampai' mengungkapkan orientasi eskatologis tanpa mereduksinya menjadi sebab.
- source_word: περιποίησις
  choice: umat milik Allah
  rationale: Dalam konteks ini istilah tersebut dapat menunjuk pada milik yang diperoleh atau dipelihara Allah, yakni umat-Nya. Kata 'Allah' ditambahkan secara implisit agar hubungan kepemilikan jelas dan alami dalam bahasa Indonesia.
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: demi pujian bagi kemuliaan-Nya
  rationale: Mempertahankan tujuan akhir berupa pujian yang diarahkan kepada kemuliaan Allah, dengan susunan Indonesia yang wajar.
theological_decisions:
- issue: Identitas 'milik' dalam τῆς περιποιήσεως
  choice: umat milik Allah
  alternative: milik yang diperoleh
  rationale: Genitif dengan περιποίησις secara harfiah ambigu, tetapi penggunaan biblis terkait mendukung pengertian umat sebagai milik khusus Allah. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- issue: Hubungan εἰς dengan penebusan
  choice: sampai umat milik Allah ditebus
  alternative: untuk penebusan milik itu
  rationale: Pilihan ini menjaga arah menuju penggenapan penebusan, sejalan dengan 'toward' pada lapisan konsultasi, tanpa menyatakan bahwa Roh adalah harga atau pelaku penebusan.
- issue: Rujukan kata ganti relatif
  choice: Roh Kudus diperlakukan sebagai pribadi melalui 'Dialah'
  alternative: yang merupakan
  rationale: Antesedennya adalah Roh Kudus pada ayat 13. Bentuk ini mempertahankan rujukan personal tanpa mengembangkan doktrin melampaui tata bahasa dan konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kapitalisasi '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah. Penambahan 'Allah' bersifat klarifikatif dan dicatat karena tidak hadir secara eksplisit dalam frasa Yunani.
