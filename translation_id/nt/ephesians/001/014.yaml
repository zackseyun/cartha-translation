    reason: Mempertahankan ambiguitas τῆς περιποιήσεως dan menjelaskan bahwa "-Nya" dalam terjemahan utama merupakan penjelasan kontekstual, sambil mencatat daya arah εἰς.
  revision_rationale: Revisi menghapus penetapan interpretatif "umat" dari teks utama dan mengganti "sampai" dengan "menuju" agar hubungan εἰς ἀπολύτρωσιν tetap bersifat arah/tujuan. Rujukan kepemilikan yang secara konteks berkaitan dengan Allah tetap dinyatakan secara alami melalui "milik-Nya," sementara catatan kaki menjaga rentang makna istilah Yunani.
