- from: Dialah jaminan atas warisan kita sampai umat milik Allah ditebus, demi pujian bagi kemuliaan-Nya.[a]
  to: Dialah jaminan atas warisan kita, menuju penebusan milik-Nya, demi pujian bagi kemuliaan-Nya.[a]
  rationale: Revisi menghapus penetapan interpretatif "umat" dari teks utama dan mengganti "sampai" dengan "menuju" agar hubungan εἰς ἀπολύτρωσιν tetap bersifat arah/tujuan. Rujukan kepemilikan yang secara konteks berkaitan dengan Allah tetap dinyatakan secara alami melalui "milik-Nya," sementara catatan kaki menjaga rentang makna istilah Yunani.
