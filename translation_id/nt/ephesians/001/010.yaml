  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: id
  text: untuk pengaturan pada kepenuhan zaman-zaman, yaitu merangkum segala sesuatu di dalam Mesias[a]—yang di surga dan yang di bumi—di dalam Dia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “merangkum” juga dapat berarti “mempersatukan segala sesuatu” atau “menghimpun segala sesuatu di bawah satu kepala dalam Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: pelaksanaan
  rationale: Kata ini dapat menunjuk pada pengelolaan, penataan, atau pelaksanaan suatu rencana. “Pelaksanaan” terdengar alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa maksud ilahi diwujudkan secara teratur tanpa menambahkan kata “rencana” yang tidak dinyatakan langsung di sini.
- source_word: πληρώματος τῶν καιρῶν
  choice: ketika waktu-waktu mencapai kepenuhannya
  rationale: Ungkapan ini mempertahankan bentuk jamak καιρῶν serta gagasan πληρώματος sebagai kepenuhan atau tercapainya ukuran penuh, sambil menghasilkan susunan Indonesia yang lebih wajar daripada “kepenuhan waktu-waktu”.
- source_word: ἀνακεφαλαιώσασθαι
  choice: merangkum
  rationale: “Merangkum” mewakili arti dasar menyimpulkan atau menyatukan ke dalam satu kesatuan tanpa membatasi kata tersebut hanya pada gagasan pemerintahan atau kepemimpinan. Nuansa menghimpun di bawah satu kepala dipertahankan dalam catatan kaki.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini bersifat menyeluruh; “segala sesuatu” alami dan tepat bagi cakupan kosmis ayat ini.
- source_word: ἐν τῷ Χριστῷ
  choice: di dalam Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konteks ini, sehingga diterjemahkan “Mesias”; “di dalam” mempertahankan relasi yang dinyatakan oleh ἐν.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς
  choice: baik yang di surga maupun yang di bumi
  rationale: Pasangan “baik ... maupun ...” mengungkapkan kedua kelompok secara jelas dan alami. “Di surga” dan “di bumi” menyampaikan kontras lokasi kosmis tanpa membuat bahasa Indonesia terasa kaku.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Kata ganti ini paling wajar merujuk kembali kepada Mesias. Pengulangan “di dalam Dia” dipertahankan untuk menjaga penekanan teks Yunani tanpa menambahkan gagasan eksklusivitas.
theological_decisions:
- issue: Makna ἀνακεφαλαιώσασθαι
  choice: merangkum segala sesuatu
  alternative: mempersatukan atau menghimpun segala sesuatu di bawah satu kepala
  rationale: Kata kerja Yunani ini dapat memuat nuansa penyimpulan, penyatuan, dan penghimpunan di bawah satu kepala. Teks utama memakai padanan yang paling langsung dan ringkas, sedangkan kemungkinan nuansa kepala dipertahankan dalam catatan kaki agar ketegangan maknanya tidak diselesaikan secara sepihak.
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap berfungsi secara teologis sebagai gelar bagi Dia yang di dalam-Nya segala sesuatu dirangkum; “Mesias” membuat fungsi gelar itu jelas tanpa memasukkan kekhasan denominasi.
- issue: Rujukan ἐν αὐτῷ
  choice: Dia, yaitu Mesias
  alternative: Allah
  rationale: Anteseden gramatikal terdekat dan alur kalimat paling alami menunjuk kepada Mesias. Terjemahan mempertahankan rujukan tersebut tanpa menambahkan kata penjelas ke dalam teks utama.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dibaca. Karena ayat ini meneruskan kalimat dari ayat sebelumnya, bentuknya tetap berupa klausa lanjutan dan diakhiri koma. Pengulangan “di dalam Mesias ... di dalam Dia” dipertahankan demi penekanan sumber Yunani.
