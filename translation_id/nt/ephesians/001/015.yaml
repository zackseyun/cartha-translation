id: EPH.1.15
reference: Ephesians 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: id
  text: Karena itu, aku pun, setelah mendengar tentang imanmu dalam Tuhan Yesus[a] dan kasihmu kepada semua orang kudus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaanmu kepada Tuhan Yesus.” Kata Yunani yang diterjemahkan “iman” juga dapat berarti “kesetiaan” dalam konteks tertentu; “kepada” menjelaskan hubungan yang dalam teks utama diterjemahkan secara lebih harfiah sebagai “dalam.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kasihmu yang tertuju kepada semua orang kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini menunjuk kembali pada berkat dan karya Allah yang diuraikan sebelumnya serta menyatakan dasar bagi tanggapan Paulus. “Karena itu” alami dalam bahasa Indonesia dan mempertahankan hubungan sebab-akibatnya.
- source_word: κἀγώ
  choice: aku pun
  rationale: Bentuk gabungan καί + ἐγώ bersifat aditif, dengan memasukkan Paulus sendiri ke dalam tanggapan tersebut. “Aku pun” mempertahankan penekanan itu tanpa membuatnya berlebihan.
- source_word: ἀκούσας
  choice: setelah mendengar
  rationale: Partisip aoris ini terutama menyatakan tindakan yang mendahului tindakan utama dalam kalimat lanjutan. “Setelah mendengar” menyampaikan hubungan waktunya secara alami sambil tetap mempertahankan bentuk klausa yang belum selesai dalam ayat ini.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: imanmu
  rationale: Ungkapan κατά + ὑμᾶς merujuk pada iman yang terdapat pada atau menjadi ciri para penerima surat. Bentuk “imanmu” paling wajar dalam bahasa Indonesia tanpa meniadakan pengertian iman yang ada di antara mereka.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini πίστις terutama menunjuk pada sikap percaya para pembaca dalam hubungan dengan Tuhan Yesus. “Iman” merupakan padanan Indonesia yang lazim dan tetap membuka cakupan makna kepercayaan; kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  rationale: Terjemahan ini mempertahankan preposisi ἐν dan ungkapan khas Paulus, alih-alih langsung menafsirkannya sebagai sekadar arah “kepada” Tuhan Yesus.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Di sini κύριος merupakan gelar kristologis bagi Yesus. “Tuhan” adalah padanan Indonesia yang baku, berbobot, dan sesuai konteks.
- source_word: ἀγάπην
  choice: kasih
  rationale: “Kasih” adalah padanan yang alami dan bermartabat bagi ἀγάπη dalam konteks hubungan umat percaya.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: kepada semua orang kudus
  rationale: εἰς menyatakan arah kasih kepada orang-orang yang menjadi sasarannya. “Kepada” mempertahankan arah tersebut secara jelas.
- source_word: ἁγίους
  choice: orang kudus
  rationale: Dalam surat-surat Paulus, istilah ini menunjuk secara kolektif kepada umat Allah, bukan hanya kepada tokoh tertentu yang kemudian diberi status khusus. “Orang kudus” mempertahankan kaitan langsungnya dengan kekudusan.
theological_decisions:
- issue: Makna πίστις dalam hubungan para pembaca dengan Tuhan Yesus
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konstruksi dengan Tuhan Yesus paling langsung menunjuk pada percaya atau iman kepada-Nya. Namun, karena πίστις dapat membawa nuansa kepercayaan dan dalam konteks tertentu kesetiaan, kemungkinan leksikal tersebut tidak dihapus dan dicatat tanpa menjadikan “kesetiaan” arti utama di sini.
- issue: Hubungan yang dinyatakan oleh ἐν τῷ κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  alternative: kepada Tuhan Yesus
  rationale: “Dalam” mempertahankan bentuk Yunani dan ketegangan ungkapan relasional khas Paulus. “Kepada” dapat menjelaskan arah iman, tetapi lebih interpretatif.
- issue: Cakupan sebutan τοὺς ἁγίους
  choice: semua orang kudus
  alternative: seluruh umat yang kudus
  rationale: “Orang kudus” mempertahankan sebutan khas Paulus bagi komunitas umat percaya dan tidak membatasinya pada kelompok elite rohani atau orang yang dikanonisasi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “aku” mengikuti suara pribadi Paulus, sedangkan susunan ayat dipertahankan sebagai klausa yang berlanjut ke ayat berikutnya. Istilah “Tuhan,” “iman,” “kasih,” dan “orang kudus” mempertahankan kosakata teologis utama tanpa menambahkan ciri denominasi tertentu.
