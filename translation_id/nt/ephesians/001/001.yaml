id: EPH.1.1
reference: Ephesians 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: id
  text: 'Paulus, rasul Mesias Yesus[c] oleh kehendak Allah, kepada orang-orang kudus yang berada [di Efesus][a] dan yang setia[b] dalam Mesias Yesus:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah awal tidak memuat “di Efesus”. Karena itu, sebagian orang memahami surat ini sebagai surat yang dimaksudkan untuk diedarkan lebih luas, bukan hanya untuk jemaat di Efesus.
    reason: textual_variant
  - marker: b
    text: Atau “orang-orang percaya dalam Mesias Yesus”.
    reason: lexical_alternative
  - marker: c
    text: Yunani Christos Iēsous, yang juga dapat diterjemahkan “Kristus Yesus”; di sini “Mesias Yesus” dipakai karena Χριστός berfungsi sebagai gelar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: rasul
  rationale: Dalam konteks ini istilah tersebut menunjuk pada perutusan dan kewenangan khusus Paulus; “rasul” merupakan istilah teknis yang baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός masih berfungsi sebagai gelar bagi Yesus. “Mesias” mempertahankan arti gelar itu, bukan memperlakukannya semata-mata sebagai bagian dari nama diri.
- source_word: διὰ θελήματος θεοῦ
  choice: oleh kehendak Allah
  rationale: διά dengan genitif menyatakan dasar atau perantaraan ilahi dalam pengutusan Paulus. “Oleh kehendak Allah” alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa kerasulannya berasal dari kehendak Allah.
- source_word: ἁγίοις
  choice: orang-orang kudus
  rationale: Istilah ini menunjuk secara komunal kepada umat yang dikhususkan bagi Allah. “Orang-orang kudus” mempertahankan makna tersebut tanpa membatasinya pada kelompok elite tertentu.
- source_word: τοῖς οὖσιν
  choice: yang berada
  rationale: Partisipel εἰμί mengidentifikasi keberadaan para penerima di suatu tempat. “Yang berada” sesuai dengan frasa lokasi yang mengikutinya.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[di Efesus]'
  rationale: Frasa ini dipertahankan dalam kurung siku karena keberadaannya tidak pasti secara tekstual dalam sejumlah saksi awal.
- source_word: πιστοῖς
  choice: yang setia
  rationale: πιστός dapat berarti “setia” maupun “percaya.” Pilihan “yang setia” mempertahankan bentuk sifat dan nuansa kesetiaan, sedangkan kemungkinan “orang-orang percaya” dicatat dalam catatan kaki.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Ungkapan ini menyatakan hubungan atau persatuan dengan Yesus sebagai Mesias; preposisi “dalam” dipertahankan karena penting dalam pemakaian Paulus.
theological_decisions:
- issue: Penerjemahan Χριστός dalam salam Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini Χριστός dapat dipahami sebagai gelar. “Mesias” membuat fungsi gelar itu tetap terlihat, sementara “Kristus” merupakan padanan tradisional yang lebih menyerupai nama diri dalam pemakaian modern.
- issue: Status tekstual ἐν Ἐφέσῳ
  choice: Mempertahankan “di Efesus” dalam kurung siku
  alternative: Menghilangkan “di Efesus”
  rationale: Sejumlah naskah awal tidak memuat frasa ini. Kurung siku mempertahankan bacaan yang terdapat dalam banyak naskah sekaligus menampilkan ketidakpastian tekstual secara terbuka.
- issue: Makna πιστοῖς
  choice: yang setia
  alternative: orang-orang percaya
  rationale: Kata ini dapat menekankan kesetiaan atau identitas sebagai orang yang percaya. Teks utama mempertahankan nuansa kesetiaan, sedangkan alternatif yang sah dicatat tanpa menghapus ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan salam surat dipertahankan sebagai satu kalimat, sementara ungkapan “orang-orang kudus” dan “dalam Mesias Yesus” dijaga karena merupakan istilah bermakna khusus dalam wacana Paulus.
