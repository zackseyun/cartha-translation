id: EPH.1.17
reference: Ephesians 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: id
  text: supaya Allah Tuhan kita, Yesus Sang Mesias,[a] Bapa kemuliaan,[b] mengaruniakan kepada kalian roh[c] hikmat dan penyataan dalam pengenalan akan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk tradisional: “Yesus Kristus.” Gelar Yunani Χριστός berarti “Mesias.”'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Bapa yang mulia.” Secara harfiah, “Bapa kemuliaan.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Roh hikmat dan penyataan.” Kata Yunani πνεῦμα dapat menunjuk kepada roh atau sikap batin yang Allah karuniakan, ataupun kepada Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai isi sekaligus tujuan doa Paulus yang berlanjut dari ayat sebelumnya.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: Allah dari Tuhan kita
  rationale: Mempertahankan hubungan genitif Yunani secara dekat dan tetap wajar dalam bahasa Indonesia.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός masih berfungsi sebagai gelar; 'Sang Mesias' menyampaikan arti gelar itu secara alami dan bermartabat.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: Bapa yang mulia
  rationale: Ungkapan genitif harfiahnya 'Bapa kemuliaan'; terjemahan utama ini lebih alami dalam bahasa Indonesia, sementara bentuk harfiah dicatat.
- source_word: δώῃ
  choice: memberikan
  rationale: Dalam konstruksi dengan ἵνα, 'supaya ... memberikan' menyampaikan maksud bentuk subjunktif secara alami.
- source_word: πνεῦμα
  choice: roh
  rationale: Huruf kecil mempertahankan kemungkinan bahwa yang dimaksud ialah roh atau sikap batin pemberian Allah tanpa menutup kemungkinan rujukan kepada Roh Kudus.
- source_word: σοφίας καὶ ἀποκαλύψεως
  choice: hikmat dan penyataan
  rationale: Menyampaikan dua nomina genitif yang menerangkan roh; 'penyataan' mengacu pada penyingkapan ilahi.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: untuk mengenal Dia dengan sungguh-sungguh
  rationale: Mengungkapkan pengetahuan yang penuh atau sejati tentang Allah dengan bahasa Indonesia yang alami, tanpa menjadikannya sekadar pengetahuan informasi.
theological_decisions:
- issue: Apakah πνεῦμα menunjuk kepada Roh Kudus atau roh/sikap batin pemberian Allah
  choice: roh hikmat dan penyataan
  alternative: Roh hikmat dan penyataan
  rationale: Bahasa Yunani tidak memakai artikel dan memungkinkan kedua pengertian. Teks utama tidak mengunci identifikasi, sedangkan catatan kaki mempertahankan alternatif eksplisit.
- issue: Cara menerjemahkan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός dapat dipahami sebagai gelar. 'Sang Mesias' menerjemahkan maknanya, sementara bentuk tradisional dicatat sebagai alternatif.
- issue: Makna ὁ πατὴρ τῆς δόξης
  choice: Bapa yang mulia
  alternative: Bapa kemuliaan
  rationale: Genitif dapat dipahami secara kualitatif, tetapi bentuk harfiahnya memiliki bobot teologis dan karena itu dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai untuk memperjelas bahwa ὑμῖν berbentuk jamak. Kapitalisasi 'Dia' mengikuti kebiasaan Indonesia untuk pronomina yang merujuk kepada Allah.
