  rationale: Revisi memulihkan relasi genitif "Allah Tuhan kita" dalam bentuk Indonesia yang baku, mempertahankan genitif "Bapa kemuliaan," dan menerjemahkan ἐν ἐπιγνώσει αὐτοῦ tanpa mengubahnya menjadi tujuan. Ambiguitas mengenai πνεῦμα tetap dipelihara melalui huruf kecil di teks utama dan catatan kaki. Catatan untuk "Sang Mesias" ditambahkan agar alternatif tradisional yang disebut dalam keputusan terminologis benar-benar tersedia bagi pembaca.
