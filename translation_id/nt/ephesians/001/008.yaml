  text: ἧς ἐπερίσσευσεν εἰς ἡμᾶς ἐν πάσῃ σοφίᾳ καὶ φρονήσει
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/008.yaml
  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: id
  text: yang dilimpahkan-Nya kepada kita dalam segala hikmat dan pengertian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “dalam segala hikmat dan pengertian” dapat menerangkan cara Allah melimpahkan kasih karunia-Nya, atau hikmat dan pengertian yang berkaitan dengan apa yang diberikan-Nya kepada orang percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: yang
  rationale: Pronomina relatif feminin genitif ini merujuk kepada kasih karunia pada ayat 7. Dalam bahasa Indonesia, hubungan itu paling alami diteruskan dengan “yang” tanpa menampilkan kasus Yunani secara kaku.
- source_word: ἐπερίσσευσεν
  choice: dilimpahkan-Nya
  rationale: 'Bentuk ini menyampaikan pemakaian transitif-kausatif περισσεύω: Allah membuat kasih karunia berlimpah kepada kita. “Melimpahkan” alami dalam bahasa Indonesia dan mempertahankan gagasan kelimpahan yang berlimpah-limpah.'
- source_word: εἰς ἡμᾶς
  choice: kepada kita
  rationale: Ungkapan ini menunjukkan arah kepada para penerima. “Kepada kita” merupakan padanan Indonesia yang wajar dengan verba “melimpahkan”.
- source_word: ἐν
  choice: dalam
  rationale: “Dalam” mempertahankan bentuk ungkapan Yunani dan tidak memutuskan apakah hikmat dan pengertian menerangkan cara Allah melimpahkan kasih karunia atau berkaitan dengan pemberian yang diterima orang percaya.
- source_word: πάσῃ
  choice: segala
  rationale: Dengan nomina abstrak tunggal, πάσῃ menyatakan cakupan penuh; “segala” menyampaikan keluasan itu secara alami.
- source_word: σοφίᾳ
  choice: hikmat
  rationale: “Hikmat” adalah padanan baku dan jelas bagi σοφία dalam register Alkitab Indonesia modern.
- source_word: φρονήσει
  choice: pengertian
  rationale: φρόνησις menunjuk pada pemahaman, pertimbangan, atau wawasan praktis. “Pengertian” membedakannya dari “hikmat” dan mudah dipahami pembaca modern.
theological_decisions:
- issue: Hubungan frasa “dalam segala hikmat dan pengertian”
  choice: Frasa dibiarkan terbuka secara sintaksis sehingga dapat menerangkan cara Allah melimpahkan kasih karunia atau hikmat dan pengertian yang berkaitan dengan pemberian kepada orang percaya.
  alternative: Menetapkannya secara eksplisit sebagai hikmat Allah dalam bertindak, atau sebagai hikmat dan pengertian yang diberikan kepada orang percaya.
  rationale: Susunan Yunani memungkinkan kedua hubungan tersebut. Terjemahan utama mempertahankan ambiguitas yang nyata dan catatan kaki menjelaskannya tanpa menetapkan satu tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat. Bentuk “-Nya” memperjelas bahwa pelaku yang tersirat adalah Allah dari konteks sebelumnya, sedangkan susunan frasa penutup sengaja mempertahankan ketaksaan teks Yunani.
