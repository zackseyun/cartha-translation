  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: id
  text: dan betapa luar biasanya besarnya kuasa-Nya terhadap kita yang percaya[a], sesuai dengan bekerjanya keperkasaan kekuatan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam diri kita yang percaya.” Bahasa Yunani secara harfiah menyatakan arah “terhadap kita”; sebagian terjemahan menafsirkannya sebagai kuasa Allah yang bekerja di dalam diri orang-orang percaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον μέγεθος
  choice: luar biasanya kebesaran
  rationale: Ungkapan ini mempertahankan gagasan kebesaran yang melampaui ukuran biasa tanpa memperkuatnya menjadi ‘tak terukur’; bentuknya juga tetap menampilkan μέγεθος sebagai nomina.
- source_word: δύναμις
  choice: kuasa
  rationale: ‘Kuasa’ merupakan padanan alami dalam konteks Paulus dan dapat dibedakan dari istilah-istilah kekuatan lain yang ditumpuk pada akhir ayat.
- source_word: εἰς ἡμᾶς
  choice: terhadap kita
  rationale: Pilihan ini mempertahankan arah atau sasaran yang dinyatakan oleh εἰς tanpa secara khusus menafsirkannya sebagai kuasa yang berada ‘di dalam’ orang percaya atau hanya bekerja ‘bagi’ mereka.
- source_word: τοὺς πιστεύοντας
  choice: yang percaya
  rationale: Bentuk verbal partisip kini dipertahankan secara alami, bukan diubah menjadi sebutan nominal ‘orang-orang percaya’.
- source_word: κατά
  choice: sesuai dengan
  rationale: κατά menyatakan kesesuaian atau tolok ukur antara kuasa yang tertuju kepada orang percaya dan bekerjanya kekuatan Allah.
- source_word: ἐνέργεια
  choice: bekerjanya
  rationale: Padanan ini menyatakan kegiatan yang efektif dan menghindari konotasi modern yang dapat timbul dari kata ‘energi’.
- source_word: κράτος
  choice: daya perkasa
  rationale: Ungkapan ini menyampaikan kekuatan yang tampil secara efektif sekaligus tetap dibedakan dari ἰσχύς, ‘kekuatan’.
- source_word: ἰσχύς
  choice: kekuatan
  rationale: ‘Kekuatan’ menyampaikan kemampuan atau daya yang dimiliki dan mempertahankan penumpukan istilah kuasa dalam bahasa sumber.
theological_decisions:
- issue: Penumpukan istilah δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: 'Mempertahankan empat unsur yang berkaitan tetapi berbeda: ‘kuasa ... bekerjanya ... daya perkasa ... kekuatan’.'
  alternative: Meringkasnya menjadi ungkapan yang lebih lancar seperti ‘kekuatan kuasa-Nya’ atau ‘seluruh daya kuasa-Nya’.
  rationale: Paulus sengaja menumpuk istilah-istilah yang berdekatan maknanya untuk menekankan kebesaran dan keefektifan kuasa Allah. Terjemahan tidak menjadikan setiap istilah kategori teologis teknis, tetapi juga tidak meleburkan daya retorisnya.
- issue: Arah kuasa Allah dalam εἰς ἡμᾶς
  choice: ‘terhadap kita yang percaya’
  alternative: ‘di dalam diri kita yang percaya’ atau ‘bagi kita yang percaya’
  rationale: Bahasa Yunani memakai εἰς, bukan ἐν. ‘Terhadap kita’ menjaga relasi arah atau sasaran serta tidak memutuskan apakah penekanannya terutama pada pekerjaan batiniah atau manfaat bagi orang percaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan akhir sengaja agak padat untuk mempertahankan penumpukan istilah kekuatan dalam teks Yunani, tetapi ‘daya perkasa dari kekuatan-Nya’ dipilih agar tetap dapat dipahami pembaca umum.
