id: EPH.1.3
reference: Ephesians 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: id
  text: Terpujilah Allah dan Bapa Tuhan kita, Yesus Sang Mesias, yang telah memberkati kita dengan setiap berkat rohani[a] di alam surgawi[b] dalam Sang Mesias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap berkat yang berasal dari Roh.” Kata Yunani ini dapat berarti “rohani” secara lebih luas atau “yang berkaitan dengan Roh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat-tempat surgawi.”
    reason: lexical_alternative
  - marker: c
    text: 'Terjemahan tradisional: “Yesus Kristus” dan “dalam Kristus.” Gelar Yunani Χριστός diterjemahkan di sini sebagai “Mesias” untuk mempertahankan maknanya.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Terpujilah
  rationale: Bentuk seruan berkat atau pujian kepada Allah. “Terpujilah” alami dalam bahasa Indonesia dan menyampaikan pujian asertif, bukan sekadar keadaan pasif “diberkati”.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Allah dan Bapa
  rationale: Satu artikel Yunani menaungi kedua nomina yang terkoordinasi. Terjemahan ini mempertahankan kedua sebutan dan bentuk Paulus yang lazim.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: “Tuhan” mempertahankan daya gelar kristologis κύριος dan merupakan padanan baku serta bermartabat.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Ἰησοῦ adalah nama, sedangkan Χριστοῦ mempertahankan makna gelarnya. “Sang” membuat konstruksi gelar tersebut idiomatis dalam bahasa Indonesia.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: yang telah memberkati kita
  rationale: Partisip aoris menunjuk kepada tindakan Allah yang telah terlaksana dan tetap relevan; “telah memberkati” menyampaikan hal itu secara alami.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: dengan setiap berkat rohani
  rationale: Sesudah “memberkati”, “dengan” merupakan bentuk Indonesia yang alami untuk isi atau sarana berkat. “Setiap” mempertahankan πάσῃ, sedangkan “rohani” menjaga keluasan πνευματικῇ.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: di alam surgawi
  rationale: Frasa adjektival substantival ini menunjuk kepada lingkup surgawi. “Alam surgawi” jelas dan alami tanpa membuatnya terlalu konkret sebagai lokasi fisik.
- source_word: ἐν Χριστῷ
  choice: dalam Sang Mesias
  rationale: “Dalam” mempertahankan rumusan Paulus yang padat dan penting secara teologis; “Sang Mesias” menerjemahkan gelar Χριστός.
theological_decisions:
- issue: Makna πνευματικῇ
  choice: rohani
  alternative: yang berasal dari Roh
  rationale: Adjektiva ini dapat berarti rohani secara luas atau berkaitan dengan Roh. Teks utama mempertahankan keluasan itu, sementara kemungkinan rujukan khusus kepada Roh dicatat tanpa dipaksakan.
- issue: Penerjemahan Χριστός dalam rumusan Paulus
  choice: Sang Mesias
  alternative: Kristus
  rationale: Χριστός tetap bermakna gelar dalam ayat ini. “Mesias” menyatakan arti gelar tersebut, sedangkan catatan kaki mempertahankan bentuk tradisional yang sangat dikenal.
- issue: Daya ungkapan ἐν Χριστῷ
  choice: dalam Sang Mesias
  alternative: melalui Sang Mesias
  rationale: “Dalam” menjaga bentuk dan ketegangan teologis ungkapan Paulus mengenai hubungan orang percaya dengan Mesias; “melalui” akan mempersempitnya menjadi sarana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada liturgis tanpa menjadi arkais. “Terpujilah” mempertahankan bentuk pujian pembuka; susunan kalimat mengikuti kepadatan teologis sumber Yunani tetapi tetap mudah dibaca. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
