base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: id
  text: Aku tidak berhenti mengucap syukur atas kamu dan menyebut kamu dalam doa-doaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengingat kamu dalam doa-doaku.” Idiom Yunaninya secara harfiah berarti “membuat penyebutan [tentang] kamu dalam doa-doaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: Aku tidak berhenti
  rationale: Bentuk kini menyatakan tindakan yang terus berlangsung; ungkapan ini wajar dalam bahasa Indonesia sekaligus mempertahankan gagasan tidak berhenti.
- source_word: εὐχαριστῶν
  choice: mengucap syukur
  rationale: Partisip kini berlangsung bersamaan dengan verba utama dan secara alami mengungkapkan tindakan bersyukur kepada Allah.
- source_word: ὑπὲρ ὑμῶν
  choice: atas kamu
  rationale: Dalam konteks ucapan syukur, ὑπέρ dengan genitif menunjuk kepada orang-orang yang menjadi alasan atau pokok ucapan syukur; 'atas kamu' mempertahankan nuansa ini.
- source_word: μνείαν ποιούμενος
  choice: menyebut kamu
  rationale: Idiom ini secara harfiah berarti 'membuat penyebutan'; 'menyebut kamu' alami dalam bahasa Indonesia dan mempertahankan tindakan menyebut, sementara objeknya dipahami dari konteks.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: dalam doa-doaku
  rationale: Frasa ini menunjukkan kesempatan atau lingkup ketika penyebutan itu dilakukan; 'dalam doa-doaku' akurat dan idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Aku' dan 'kamu' mengikuti tuturan pribadi Paulus kepada para pembaca. Penanda catatan kaki ditempatkan setelah keseluruhan frasa yang memiliki alternatif terjemahan.
