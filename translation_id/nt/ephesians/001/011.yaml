review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada dasarnya mencerminkan unsur-unsur utama Yunani, termasuk pasif ἐκληρώθημεν dan alternatifnya dalam catatan kaki. Namun, «setelah ditentukan sebelumnya» mudah dibaca sebagai urutan waktu—seolah-olah penentuan itu terjadi setelah dijadikan milik pusaka—padahal partisip προορισθέντες menerangkan subjek dan mendasari keadaan tersebut. Selain itu, dalam konteks dekat 1:12–13, «kami» lebih tepat daripada «kita», karena Paulus membedakan «kami» dari «kamu juga».
  naturalness: Kalimat revisi tetap baku dan jelas. «Karena telah ditentukan sebelumnya» menyampaikan kaitan partisipial tanpa kesan urutan temporal yang tidak diperlukan. «Milik pusaka Allah» dapat dipahami dalam ragam Alkitabiah modern, dan catatan kaki diperbaiki agar tidak memakai frasa yang janggal, «bagian milik pusaka Allah».
  terminology: «Ditentukan sebelumnya» mempertahankan arti προορίζω tanpa memaksakan sistem teologis. «Tujuan», «mengerjakan segala sesuatu», dan «keputusan kehendak-Nya» merupakan padanan yang dapat dipertahankan untuk πρόθεσις, ἐνεργέω, dan βουλὴ τοῦ θελήματος. Penambahan «Allah» pada makna utama ἐκληρώθημεν merupakan penjelasan kontekstual yang sah; alternatif «memperoleh warisan» tetap dipertahankan.
  issues:
  - severity: medium
    issue: «Setelah ditentukan sebelumnya» berpotensi menyatakan urutan waktu yang tidak dituntut oleh partisip προορισθέντες.
    rationale: Partisip aoris pasif ini terutama menerangkan «kami» dan dalam konteks menyatakan dasar/keadaan yang menyertai dijadikannya mereka milik pusaka. «Karena telah ditentukan sebelumnya» menghindari implikasi kronologis yang tidak perlu.
  - severity: medium
    issue: Penggunaan «kita» mengaburkan pembedaan wacana antara «kami» dalam ayat 11–12 dan «kamu juga» dalam ayat 13.
    rationale: Walaupun orang pertama jamak Yunani sendiri tidak menandai inklusif/eksklusif, konteks dekat secara nyata beralih kepada «kamu juga» pada ayat 13. Bahasa Indonesia perlu memilih, dan «kami» paling setia pada alur tersebut.
  - severity: low
    issue: Catatan kaki memakai ungkapan «dijadikan bagian milik pusaka Allah».
    rationale: Kata «bagian» tidak diperlukan dan membuat alternatif pasif kurang alami. Bentuk yang lebih langsung ialah «dijadikan milik pusaka Allah».
  revised_text: Di dalam Dia, kami juga telah dijadikan milik pusaka Allah[a], karena telah ditentukan sebelumnya sesuai dengan tujuan Dia yang mengerjakan segala sesuatu menurut keputusan kehendak-Nya.
  revised_footnotes:
  - marker: a
    text: Atau, “kami juga telah memperoleh warisan.” Kata kerja Yunani ini dapat dipahami sebagai menerima warisan atau dijadikan milik pusaka Allah.
    reason: alternative_reading
  revision_rationale: Revisi mengganti «kita» dengan «kami» sesuai perkembangan argumen Paulus menuju kontras «kamu juga» pada ayat berikutnya. Frasa partisipial diterjemahkan secara kausal agar tidak menciptakan urutan waktu yang tidak ada dalam teks Yunani. Makna ganda ἐκληρώθημεν tetap dijaga melalui catatan kaki.
