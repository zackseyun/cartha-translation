revisions:
- from: Di dalam Dia, kita juga telah dijadikan milik pusaka Allah[a], setelah ditentukan sebelumnya sesuai dengan tujuan Dia yang mengerjakan segala sesuatu menurut keputusan kehendak-Nya.
  to: Di dalam Dia, kami juga telah dijadikan milik pusaka Allah[a], karena telah ditentukan sebelumnya sesuai dengan tujuan Dia yang mengerjakan segala sesuatu menurut keputusan kehendak-Nya.
  rationale: Revisi mengganti «kita» dengan «kami» sesuai perkembangan argumen Paulus menuju kontras «kamu juga» pada ayat berikutnya. Frasa partisipial diterjemahkan secara kausal agar tidak menciptakan urutan waktu yang tidak ada dalam teks Yunani. Makna ganda ἐκληρώθημεν tetap dijaga melalui catatan kaki.
  reviewer_model: gpt-5.6-terra
