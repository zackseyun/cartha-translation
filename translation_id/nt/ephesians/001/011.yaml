  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: id
  text: Di dalam Dia, kami juga telah dijadikan milik pusaka Allah[a], karena telah ditentukan sebelumnya sesuai dengan tujuan Dia yang mengerjakan segala sesuatu menurut keputusan kehendak-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami juga telah memperoleh warisan.” Kata kerja Yunani ini dapat dipahami sebagai menerima warisan atau dijadikan milik pusaka Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Kata ganti relatif ini merujuk kepada Mesias dalam konteks sebelumnya. Ungkapan ini mempertahankan gagasan kesatuan dengan Kristus dan tetap wajar dalam bahasa Indonesia.
- source_word: ἐκληρώθημεν
  choice: kita juga telah dijadikan milik pusaka Allah
  rationale: Bentuk pasif κληρόω dapat menunjuk pada dijadikannya umat sebagai bagian atau milik pusaka Allah. Penambahan 'Allah' menjelaskan pemilik yang tersirat dalam konteks, sedangkan makna alternatif bahwa umat menerima warisan dipertahankan dalam catatan kaki.
- source_word: προορισθέντες
  choice: setelah ditentukan sebelumnya
  rationale: Partisip ini menyatakan penentuan yang terjadi terlebih dahulu. Pilihan ini menerjemahkan daya leksikalnya tanpa memaksakan suatu sistem teologis tertentu.
- source_word: κατὰ πρόθεσιν
  choice: sesuai dengan tujuan
  rationale: πρόθεσις di sini menyatakan maksud atau tujuan yang disengaja; frasa ini dekat dengan bentuk Yunani dan alami dalam bahasa Indonesia.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: Dia yang mengerjakan segala sesuatu
  rationale: Partisip substantival menunjuk kepada Allah sebagai pelaku. 'Mengerjakan' mempertahankan makna aktif ἐνεργέω tanpa mempersempit cara tindakan-Nya.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari ungkapan Yunani.
- source_word: κατὰ τὴν βουλὴν
  choice: menurut keputusan
  rationale: βουλή menyatakan pertimbangan atau ketetapan yang disengaja. 'Keputusan' terdengar alami dan bermartabat dalam bahasa Indonesia serta mempertahankan unsur ketetapan yang matang.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: kehendak-Nya
  rationale: Terjemahan ini secara langsung menyampaikan θέλημα dan mempertahankan hubungan genitifnya dengan βουλή.
theological_decisions:
- issue: Makna ἐκληρώθημεν
  choice: Orang percaya dijadikan milik pusaka Allah, yaitu umat yang menjadi bagian milik-Nya.
  alternative: Orang percaya memperoleh warisan.
  rationale: Bentuk pasif κληρόω memungkinkan kedua pengertian tersebut. Latar Perjanjian Lama tentang umat Allah sebagai milik pusaka-Nya dan bentuk pasif mendukung pilihan utama, tetapi makna menerima warisan tetap cukup kuat sehingga dicantumkan dalam catatan kaki.
- issue: Cakupan προορισθέντες
  choice: Diterjemahkan secara leksikal sebagai 'ditentukan sebelumnya' tanpa menjelaskan mekanisme atau cakupan teologisnya lebih jauh.
  alternative: Menggunakan istilah teknis 'dipredestinasikan'.
  rationale: Ungkapan Indonesia yang dipilih mempertahankan unsur penentuan terdahulu tetapi menghindari asosiasi sistem teologis yang mungkin melekat pada istilah teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur argumentasi Paulus, tetapi menghindari kekakuan yang tidak perlu. Huruf kapital pada 'Dia' dan '-Nya' mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
