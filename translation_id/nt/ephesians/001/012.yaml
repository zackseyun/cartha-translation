  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: id
  text: supaya kami yang lebih dahulu menaruh harapan kepada Mesias menjadi puji-pujian bagi kemuliaan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami yang pertama kali menaruh harapan kepada Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: supaya ... hidup untuk mendatangkan
  rationale: Konstruksi εἰς dengan infinitif berartikel menyatakan tujuan atau hasil. Dalam bahasa Indonesia, ungkapan ini menyampaikan daya telis klausa secara alami; kata “hidup” membuat pengertian keberadaan yang dimaksud dapat dipahami tanpa terjemahan harfiah yang kaku.
- source_word: ἡμᾶς
  choice: kita
  rationale: Kata ganti orang pertama jamak dipilih sebagai “kita” karena Paulus berbicara tentang kelompoknya sambil melibatkan pembaca dalam wacana; ayat berikutnya beralih kepada “kamu”. Namun batas kelompok yang dimaksud tetap ditentukan oleh klausa partisipial berikutnya.
- source_word: εἰς ἔπαινον
  choice: untuk mendatangkan pujian bagi
  rationale: Ungkapan ini menyatakan tujuan atau hasil. “Mendatangkan pujian bagi” alami dalam bahasa Indonesia dan menjelaskan bahwa kemuliaan Allah menjadi sasaran pujian, bukan bahwa manusia menambah kemuliaan-Nya.
- source_word: δόξης αὐτοῦ
  choice: kemuliaan-Nya
  rationale: Konstruksi genitif dipertahankan secara ringkas. “Kemuliaan” menjaga bobot teologis δόξα tanpa parafrasa yang mempersempit artinya.
- source_word: τοὺς προηλπικότας
  choice: yang sudah lebih dahulu berharap
  rationale: Partisipel perfek προελπίζω menunjukkan pengharapan yang mendahului suatu titik atau kelompok lain dan tetap relevan. Pilihan ini mempertahankan unsur temporal tanpa menetapkan secara pasti bahwa kelompok tersebut adalah orang-orang pertama secara mutlak.
- source_word: ἐν τῷ Χριστῷ
  choice: kepada Mesias
  rationale: Dengan verba “berharap”, ἐν dapat dinyatakan secara idiomatis sebagai arah atau tumpuan pengharapan, “kepada”. Χριστός dipahami sebagai gelar dan diterjemahkan “Mesias”.
theological_decisions:
- issue: Apakah προηλπικότας menunjuk pada kelompok pertama yang berharap—sering dipahami sebagai orang percaya Yahudi—atau hanya pada mereka yang telah berharap sebelumnya
  choice: yang sudah lebih dahulu berharap
  alternative: yang pertama-tama berharap
  rationale: Awalan προ- menyatakan keberdahuluan, tetapi tidak dengan sendirinya memastikan bahwa mereka adalah kelompok pertama secara mutlak. Teks utama mempertahankan nuansa temporal yang hati-hati, sedangkan kemungkinan yang lebih kuat dicatat dalam catatan kaki.
- issue: Makna ἐν τῷ Χριστῷ setelah verba berharap
  choice: berharap kepada Mesias
  alternative: berharap di dalam Mesias
  rationale: “Kepada Mesias” merupakan kolokasi Indonesia yang alami untuk tumpuan pengharapan. Alternatif yang lebih formal, “di dalam Mesias”, dapat menonjolkan gagasan kesatuan dengan Mesias, tetapi terdengar kurang alami dengan verba “berharap” dan tidak perlu dipaksakan di sini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang khidmat tetapi mudah dipahami. Klausa pewatas dibiarkan tanpa koma karena menentukan kelompok “kita” yang dimaksud. Bentuk “-Nya” memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
