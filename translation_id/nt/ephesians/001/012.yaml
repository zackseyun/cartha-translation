  to: supaya kami yang lebih dahulu menaruh harapan kepada Mesias menjadi puji-pujian bagi kemuliaan-Nya.[a]
  rationale: Revisi menghilangkan tambahan "hidup" dan "mendatangkan", lalu memakai ungkapan mapan "menjadi puji-pujian bagi kemuliaan-Nya" untuk menyampaikan εἰς τὸ εἶναι ... εἰς ἔπαινον δόξης αὐτοῦ. "Kami" menjaga kemungkinan kelompok yang dibedakan dari para penerima tanpa menetapkan identitas etnis atau teologisnya. Unsur keberdahuluan προηλπικότας dipertahankan dalam teks utama dan pembacaan yang lebih kuat dicatat di catatan kaki.
