  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: id
  text: Di dalam Dia kita memiliki penebusan melalui darah-Nya, pengampunan atas pelanggaran-pelanggaran, sesuai dengan kekayaan anugerah-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Pronomina relatif ini merujuk kepada Sang Terkasih pada ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan relasi di dalam Kristus.
- source_word: ἔχομεν
  choice: kita memiliki
  rationale: Bentuk kini menunjukkan kenyataan yang dimiliki sekarang; 'memiliki' menyampaikan makna itu secara langsung dan bermartabat.
- source_word: ἀπολύτρωσιν
  choice: penebusan
  rationale: Istilah ini menunjuk pada pembebasan yang diperoleh dengan harga atau sarana yang mahal; 'penebusan' mempertahankan bobot leksikal dan teologis Paulus.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: melalui darah-Nya
  rationale: διά dengan genetif menyatakan sarana. Terjemahan konkret ini mempertahankan gambaran darah, pengurbanan, dan kematian tanpa menggantinya dengan tafsiran.
- source_word: ἄφεσιν
  choice: pengampunan
  rationale: Dalam konteks ini istilah tersebut menyatakan pelepasan atau penghapusan kesalahan; 'pengampunan' paling jelas dan alami.
- source_word: παραπτωμάτων
  choice: pelanggaran-pelanggaran kita
  rationale: Kata ini menunjuk pada perbuatan salah atau pelanggaran. Pronomina 'kita' dibuat eksplisit secara wajar dalam bahasa Indonesia karena verba 'kita memiliki' dan makna pengampunan menunjukkan bahwa pelanggaran itu adalah milik pihak yang diampuni.
- source_word: κατὰ τὸ πλοῦτος
  choice: sesuai dengan kekayaan
  rationale: κατά dengan akusatif menunjukkan ukuran atau standar; frasa ini menyampaikan bahwa pengampunan sepadan dengan kelimpahan anugerah Allah, bukan sekadar berasal darinya.
- source_word: χάριτος
  choice: anugerah
  rationale: '''Anugerah'' adalah padanan Indonesia yang lazim bagi χάρις dalam Paulus dan menyampaikan kemurahan Allah yang diberikan tanpa jasa penerima.'
theological_decisions:
- issue: Hubungan antara 'penebusan' dan 'pengampunan atas pelanggaran-pelanggaran'
  choice: Diterjemahkan secara aposisional dengan 'yaitu' agar hubungan penjelasnya jelas dalam bahasa Indonesia.
  alternative: 'Mempertahankan penjajaran tanpa penghubung: ''penebusan ..., pengampunan atas pelanggaran-pelanggaran kita''.'
  rationale: Kedua frasa akusatif paling wajar dipahami dalam aposisi. 'Yaitu' memperjelas hubungan gramatikal tanpa menyatakan bahwa seluruh makna penebusan habis tercakup oleh pengampunan.
- issue: Bahasa pendamaian dalam 'melalui darah-Nya'
  choice: Mempertahankan ungkapan konkret 'melalui darah-Nya'.
  alternative: Melalui kematian-Nya; melalui kematian-Nya sebagai kurban.
  rationale: Teks Yunani secara eksplisit menyebut darah. Menggantinya dengan 'kematian' akan menafsirkan dan mengurangi gambaran kurban serta perjanjian yang terdapat dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Tidak ada catatan kaki karena alternatif Inggris 'in whom' tidak menghasilkan perbedaan makna yang perlu dicatat dalam bahasa Indonesia, sedangkan 'pelanggaran' sudah merupakan padanan alami bagi παραπτώματα.
