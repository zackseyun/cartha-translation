  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: id
  text: yang telah Ia kerjakan dalam Mesias[a] ketika Ia membangkitkan Dia dari antara orang mati dan mendudukkan-Nya di sebelah kanan-Nya, di alam surgawi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “di tempat-tempat surgawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: yang
  rationale: Kata ganti relatif feminin ini mengacu kembali pada kuasa dalam konteks sebelumnya; “yang” mempertahankan hubungan antarklausa secara alami dalam bahasa Indonesia.
- source_word: ἐνήργηκεν
  choice: dikerjakan-Nya
  rationale: Bentuk ini menyatakan tindakan Allah yang membuat kuasa tersebut bekerja secara efektif, sekaligus mempertahankan kaitannya dengan anteseden pada ayat sebelumnya.
- source_word: ἐν τῷ Χριστῷ
  choice: di dalam Mesias
  rationale: Preposisi ἐν dipertahankan dan Χριστός diterjemahkan sebagai gelar “Mesias” karena penggunaannya di sini bersifat titular.
- source_word: ἐγείρας αὐτὸν
  choice: ketika Ia membangkitkan Dia
  rationale: Partisip aoris dipahami sebagai tindakan yang menyertai atau mewujudkan pekerjaan kuasa Allah; “ketika” menyampaikan kaitan waktunya tanpa menutup kemungkinan nuansa sarana.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mencerminkan bentuk jamak Yunani dan menyampaikan bahwa Dia dibangkitkan keluar dari kalangan orang-orang mati.
- source_word: καθίσας
  choice: dan mendudukkan-Nya
  rationale: Partisip aoris ini sejajar dengan ἐγείρας dan menyatakan bahwa Allah membuat Mesias duduk.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: di sebelah kanan-Nya
  rationale: Ini adalah ungkapan Indonesia yang alami untuk tempat kehormatan dan kewenangan di sisi kanan Allah.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: di alam surgawi
  rationale: Adjektiva substantival jamak ini menunjuk pada ranah atau lingkungan surgawi; “alam surgawi” alami dalam bahasa Indonesia dan tidak memaksakan gagasan beberapa lokasi terpisah.
theological_decisions:
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks pengagungan ini, Χριστός tetap jelas berfungsi sebagai gelar. Alternatif tradisional “Kristus” dipertahankan dalam catatan.
- issue: Makna ἐν τοῖς ἐπουρανίοις
  choice: di alam surgawi
  alternative: di tempat-tempat surgawi
  rationale: Pilihan utama menyampaikan ranah surgawi secara wajar, sedangkan alternatif yang lebih harfiah mempertahankan bentuk jamak dan nuansa lokatif konstruksi Yunani.
- issue: Hubungan partisip ἐγείρας dan καθίσας dengan ἐνήργηκεν
  choice: ketika Ia membangkitkan ... dan mendudukkan
  alternative: dengan membangkitkan ... dan mendudukkan
  rationale: Partisip dapat memuat nuansa waktu maupun sarana. Teks utama memakai hubungan temporal yang alami, tanpa menyatakan bahwa nuansa sarana mustahil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina ilahi dipakai untuk memperjelas rujukan dalam rangkaian pronomina yang padat. Susunan tetap bergantung pada ayat sebelumnya, sebagaimana klausa relatif Yunani.
