  naturalness: Bahasa baku, jelas, dan bernada Alkitabiah. “Untuk menjadi kudus dan tak bercela” lebih alami sebagai pelengkap dari “memilih kita” dan lebih dekat pada susunan sumber.
  terminology: “Memilih,” “di dalam Dia,” “kudus,” “tak bercela,” dan “dalam kasih” tepat. Catatan kaki secara tepat menjaga ambiguitas keterkaitan “dalam kasih” dengan ayat 4 atau ayat 5.
