  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: id
  text: Sebagaimana Ia telah memilih kita di dalam Dia sebelum dunia dijadikan, untuk menjadi kudus dan tak bercela[b] di hadapan-Nya dalam kasih[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa “dalam kasih” juga dapat dihubungkan dengan ayat berikutnya: “Dalam kasih Ia telah menentukan kita sebelumnya ...”'
    reason: alternative_reading
  - marker: b
    text: Atau “tanpa cacat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Sebagaimana
  rationale: Mempertahankan hubungan dengan pernyataan berkat pada ayat sebelumnya secara alami dan bermartabat.
- source_word: ἐξελέξατο
  choice: telah memilih
  rationale: Menyatakan tindakan pemilihan Allah tanpa memasukkan muatan sistem teologis yang mungkin lebih kuat pada istilah teknis lain.
- source_word: ἡμᾶς
  choice: kita
  rationale: Padanan langsung bagi objek orang pertama jamak; dalam bahasa Indonesia juga tetap dipahami sebagai pelaku dalam klausa tujuan berikutnya.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan ungkapan Paulus yang padat mengenai relasi atau kesatuan dengan Dia serta mempertahankan pronomina sumber.
- source_word: πρὸ καταβολῆς κόσμου
  choice: sebelum dunia dijadikan
  rationale: Ungkapan Indonesia yang alami untuk waktu sebelum penciptaan dunia, tanpa mengubah daya temporal frasa Yunani.
- source_word: εἶναι ἡμᾶς
  choice: supaya kita
  rationale: Menyampaikan fungsi infinitif sebagai tujuan atau hasil dengan jelas dalam bahasa Indonesia; nuansa tepatnya tidak dipersempit lebih jauh.
- source_word: ἁγίους
  choice: kudus
  rationale: Padanan utama yang mempertahankan gema moral sekaligus pengkhususan bagi Allah.
- source_word: ἀμώμους
  choice: tak bercela
  rationale: Padanan alami yang mencakup keadaan tanpa kesalahan yang dapat dituduhkan; alternatif bernuansa korban dicatat dalam catatan kaki.
- source_word: κατενώπιον αὐτοῦ
  choice: di hadapan-Nya
  rationale: Menyatakan kehadiran dan pertanggungjawaban di hadapan Allah secara ringkas dan idiomatis.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Diletakkan pada posisi akhir sebagaimana dalam teks Yunani agar dapat dikaitkan dengan klausa sebelumnya atau dengan gagasan pada ayat berikutnya.
theological_decisions:
- issue: Kemungkinan pembacaan doktrinal berlebihan atas ἐξελέξατο
  choice: memilih kita
  alternative: menetapkan kita sebagai umat pilihan
  rationale: Teks menyatakan pemilihan ilahi, tetapi padanan utama tidak menambahkan rumusan denominasi atau sistem teologis tertentu.
- issue: Keterkaitan sintaksis ἐν ἀγάπῃ
  choice: mempertahankan “dalam kasih” pada akhir ayat 4
  alternative: 'menghubungkannya dengan ayat 5: “Dalam kasih Ia telah menentukan kita sebelumnya ...”'
  rationale: Bahasa Yunani sungguh memungkinkan kedua keterkaitan tersebut. Posisi frasa dipertahankan dan alternatifnya dijelaskan tanpa menyelesaikan ambiguitas secara dogmatis.
- issue: Fungsi εἶναι ἡμᾶς sebagai tujuan atau hasil
  choice: supaya kita kudus
  alternative: sehingga kita menjadi kudus
  rationale: “Supaya” secara wajar menyampaikan arah atau maksud pemilihan, sambil mengakui bahwa konstruksi infinitif juga dapat dipahami bernuansa hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Urutan “di hadapan-Nya dalam kasih” sengaja dipertahankan untuk menjaga ambiguitas sintaksis sumber.
