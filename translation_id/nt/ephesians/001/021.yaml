id: EPH.1.21
reference: Ephesians 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: id
  text: jauh di atas setiap pemerintahan, kewenangan, kekuatan, dan kekuasaan[a], serta setiap nama yang disebut[b], bukan hanya pada zaman ini, melainkan juga pada zaman yang akan datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap kepangeranan, kewenangan, kekuatan, dan kekuasaan.” Istilah-istilah Yunani ini dapat menunjuk pada tingkatan atau ranah otoritas, termasuk kuasa kosmis atau rohani.
    reason: lexical_alternative
  - marker: b
    text: Atau “setiap gelar yang diberikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: jauh di atas
  rationale: Menyatakan kedudukan yang sangat lebih tinggi; frasa ini alami dalam bahasa Indonesia dan mempertahankan daya intensif bentuk Yunani.
- source_word: πάσης ἀρχῆς
  choice: segala pemerintahan
  rationale: Dalam konteks ini ἀρχή menunjuk pada pemerintahan atau kuasa yang memerintah, mungkin termasuk kuasa kosmis atau rohani, tanpa harus menentukan hakikatnya.
- source_word: ἐξουσίας
  choice: kewenangan
  rationale: Menyampaikan hak atau otoritas untuk bertindak dan tetap membedakannya dari δύναμις.
- source_word: δυνάμεως
  choice: kuasa
  rationale: Padanan umum yang menyatakan kemampuan atau kekuatan dan mempertahankan perbedaannya dari kewenangan.
- source_word: κυριότητος
  choice: kekuasaan
  rationale: Menyatakan kedudukan atau ranah berkuasa; pilihan ini lebih mudah dipahami daripada istilah teknis dan tidak mengacaukannya dengan gelar ilahi 'Tuhan'.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: setiap nama yang disebut
  rationale: Mempertahankan pengulangan retoris antara 'nama' dan 'disebut' serta keluasan makna yang dapat mencakup nama, gelar, atau kedudukan.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: bukan hanya ... melainkan juga
  rationale: Bentuk korelatif Indonesia yang alami dan sepadan dengan konstruksi Yunani.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: pada zaman ini
  rationale: αἰών di sini bersifat temporal; 'zaman' mempertahankan kontras dengan zaman mendatang dan tidak menggesernya menjadi dunia sebagai tempat.
- source_word: ἐν τῷ μέλλοντι
  choice: pada zaman yang akan datang
  rationale: Mengungkapkan nomina αἰών yang tersirat agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat pemerintahan, kewenangan, kuasa, dan kekuasaan yang disebutkan
  choice: Menerjemahkannya sebagai kategori-kategori otoritas yang luas tanpa menetapkan bahwa semuanya manusiawi atau rohani.
  alternative: Menafsirkannya secara eksplisit sebagai tingkatan malaikat atau kuasa-kuasa kosmis.
  rationale: Konteks mungkin mencakup kuasa kosmis atau rohani, tetapi teks Yunani sendiri tidak secara eksplisit menentukan hakikat setiap kategori. Terjemahan utama mempertahankan keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Deretan istilah otoritas dipertahankan tanpa menjadikannya istilah denominasi tertentu. Frasa temporal diterjemahkan secara eksplisit agar alami dalam bahasa Indonesia.
