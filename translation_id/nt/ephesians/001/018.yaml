  naturalness: Teks revisi tetap baku, modern, dan wajar sebagai kelanjutan doa Paulus. “Betapa kayanya kemuliaan warisan-Nya” merupakan ungkapan Indonesia yang idiomatis sekaligus lebih dekat dengan struktur dan makna Yunani.
  terminology: “Pengharapan,” “panggilan-Nya,” “kemuliaan,” “warisan-Nya,” dan “orang-orang kudus” tepat serta mempertahankan kosakata dan keterbukaan teologis sumber. Catatan kaki untuk ἐν τοῖς ἁγίοις dipertahankan untuk tidak menutup kemungkinan “di dalam.”
