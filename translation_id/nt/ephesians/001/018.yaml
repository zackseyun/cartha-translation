id: EPH.1.18
reference: Ephesians 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: id
  text: mata hatimu telah diterangi, supaya kamu mengetahui apa pengharapan dari panggilan-Nya, betapa kayanya[a] kemuliaan warisan-Nya di antara orang-orang kudus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “apa kekayaan kemuliaan warisan-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “di dalam orang-orang kudus” atau “di antara umat-Nya yang kudus.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: telah diterangi
  rationale: Bentuk partisipel perfekt pasif menyatakan tindakan yang telah terjadi dengan hasil yang tetap berlangsung; bentuk pasif dipertahankan.
- source_word: ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: mata hatimu
  rationale: Metafora Yunani dipertahankan karena alami dalam bahasa Indonesia dan penting bagi gambaran retoris Paulus.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: supaya kamu mengetahui
  rationale: Mengungkapkan daya tujuan konstruksi infinitif secara wajar dalam bahasa Indonesia.
- source_word: ἐλπὶς
  choice: pengharapan
  rationale: Istilah ini menyampaikan penantian yang penuh keyakinan dan sesuai dengan kosakata Paulus.
- source_word: κλήσεως αὐτοῦ
  choice: panggilan-Nya
  rationale: Mempertahankan ungkapan teologis Paulus tanpa memperluasnya menjadi penafsiran tertentu tentang cara atau isi panggilan.
- source_word: πλοῦτος τῆς δόξης
  choice: betapa berlimpah kemuliaan
  rationale: Menyampaikan gagasan kelimpahan secara alami dalam bahasa Indonesia; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: κληρονομίας αὐτοῦ
  choice: warisan-Nya
  rationale: 'Mempertahankan keterbukaan genitif Yunani: warisan itu dapat dipahami sebagai milik-Nya atau sebagai warisan yang berasal dari-Nya.'
- source_word: ἐν τοῖς ἁγίοις
  choice: di antara orang-orang kudus
  rationale: Menyampaikan arti korporat yang wajar, sementara kemungkinan arti 'di dalam' tetap dicatat karena signifikan secara penafsiran.
theological_decisions:
- issue: Apakah 'warisan-Nya di dalam/di antara orang-orang kudus' menunjuk pada umat sebagai milik pusaka Allah atau pada warisan yang Allah berikan kepada umat-Nya
  choice: warisan-Nya di antara orang-orang kudus
  alternative: warisan-Nya di dalam orang-orang kudus; warisan yang diberikan-Nya di antara orang-orang kudus
  rationale: Susunan genitif dan frasa preposisional Yunani memungkinkan lebih dari satu nuansa. Teks utama tidak memutuskan apakah warisan itu milik Allah atau pemberian Allah, dan catatan kaki mempertahankan kemungkinan 'di dalam'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal akrab “-mu” dipertahankan untuk sapaan kepada jemaat secara kolektif, sedangkan “-Nya” merujuk kepada Allah. Kalimat dibiarkan sebagai kelanjutan sintaksis dari konteks doa pada ayat sebelumnya.
