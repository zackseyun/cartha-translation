  rationale: Revisi terbatas pada pengungkapan πλοῦτος τῆς δόξης. “Betapa kayanya” menyampaikan kekayaan/kelimpahan yang menjadi isi frasa Yunani, sementara catatan kaki mencatat susunan yang lebih harfiah. Posisi jangkar catatan kaki a dipindahkan ke kata yang menerjemahkan πλοῦτος. Tidak ada perubahan yang menafsirkan secara sempit hubungan “warisan-Nya” dengan orang-orang kudus.
