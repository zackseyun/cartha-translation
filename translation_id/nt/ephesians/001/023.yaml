  text: ἥτις ἐστὶν τὸ σῶμα αὐτοῦ, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/023.yaml
  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: id
  text: yang adalah tubuh-Nya, yaitu kepenuhan Dia yang memenuhi segala sesuatu dalam segala hal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “kepenuhan Dia yang memenuhi semua dalam semua.”
    reason: lexical_alternative
  - marker: b
    text: Partisipel Yunani ini juga dapat dipahami sebagai “Dia yang sedang dipenuhi”, walaupun kebanyakan penafsir memahaminya di sini sebagai “Dia yang memenuhi”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: yang adalah
  rationale: Merujuk kembali kepada jemaat pada ayat 22; bentuk ini alami dalam bahasa Indonesia dan tetap menyatakan hubungan relatif tersebut.
- source_word: σῶμα αὐτοῦ
  choice: tubuh-Nya
  rationale: Mempertahankan metafora Paulus yang langsung dan lazim tentang hubungan jemaat dengan Kristus.
- source_word: πλήρωμα
  choice: kepenuhan
  rationale: Istilah ini mempertahankan bentuk serta keterbukaan makna kata Yunani, tanpa menetapkan apakah jemaat dipenuhi oleh Kristus atau dalam suatu arti menjadi pelengkap-Nya.
- source_word: τοῦ ... πληρουμένου
  choice: Dia yang memenuhi
  rationale: Walaupun bentuk partisipelnya secara morfologis dapat bernilai medial atau pasif, konteks paling wajar mendukung pengertian aktif; kemungkinan pasif dicatat dalam catatan kaki.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Menyampaikan cakupan menyeluruh dari bentuk jamak netral Yunani dengan ungkapan Indonesia yang alami.
- source_word: ἐν πᾶσιν
  choice: dalam segala hal
  rationale: Cukup dekat dengan ungkapan Yunani yang padat dan mempertahankan keluasan maknanya tanpa membatasinya menjadi 'dalam setiap orang'.
theological_decisions:
- issue: Makna πλήρωμα dalam hubungan antara jemaat dan Kristus
  choice: Jemaat disebut tubuh Kristus dan 'kepenuhan' yang berkaitan dengan-Nya, tanpa menjelaskan lebih jauh sifat hubungan tersebut.
  alternative: Jemaat sebagai sesuatu yang dipenuhi oleh Kristus, atau sebagai pelengkap Kristus dalam metafora tubuh.
  rationale: Kata Yunani memungkinkan beberapa pemahaman yang berdekatan. 'Kepenuhan' mempertahankan ketegangan teologis itu dan tidak menyelesaikannya secara sepihak.
- issue: Diatesis dan nuansa πληρουμένου
  choice: Diterjemahkan dengan pengertian aktif, 'Dia yang memenuhi'.
  alternative: Dia yang sedang dipenuhi.
  rationale: Bentuknya secara morfologis medial/pasif, tetapi pemakaian Koine dan konteks mendukung pengertian aktif atau deponen. Karena pembacaan pasif tetap mungkin secara tata bahasa, pembacaan itu disertakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Kepenuhan' dipertahankan sebagai istilah yang padat secara teologis; 'dalam segala hal' dipilih agar alami sekaligus tetap dekat dengan ambiguitas ἐν πᾶσιν.
