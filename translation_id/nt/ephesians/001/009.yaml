id: EPH.1.9
reference: Ephesians 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: id
  text: dengan memberitahukan kepada kita rahasia kehendak-Nya, sesuai dengan maksud baik-Nya yang telah Dia tetapkan di dalam Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam Kristus”; sebagian memahami “di dalam Dia” secara refleksif sebagai “di dalam diri-Nya sendiri.”
    reason: Rujukan kata ganti Yunani dapat dipahami sebagai Kristus atau secara refleksif sebagai Allah sendiri.
lexical_decisions:
- source_word: γνωρίσας
  choice: dengan memberitahukan
  rationale: Partisip aoristus ini bergantung pada kalimat yang lebih luas. Ungkapan “dengan memberitahukan” mempertahankan hubungan partisipial sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: 'Bentuk datif berfungsi sebagai objek tak langsung: Allah memberitahukan rahasia itu kepada kita.'
- source_word: τὸ μυστήριον
  choice: rahasia
  rationale: Dalam pemakaian Paulus, kata ini menunjuk pada maksud ilahi yang sebelumnya tersembunyi tetapi kini dinyatakan. “Rahasia” menyampaikan makna tersebut dengan jelas bagi pembaca Indonesia modern tanpa menyiratkan sesuatu yang selamanya tak terpahami.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: kehendak-Nya
  rationale: Ini merupakan padanan langsung yang mempertahankan konstruksi “rahasia kehendak-Nya” dan tidak mencampurkannya dengan tindakan menetapkan pada bagian berikut.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: sesuai dengan maksud baik-Nya
  rationale: κατά menyatakan kesesuaian, sedangkan εὐδοκία mencakup gagasan kerelaan, perkenanan, dan maksud yang baik. “Maksud baik-Nya” alami dalam bahasa Indonesia serta mempertahankan unsur kehendak yang positif.
- source_word: ἣν προέθετο
  choice: yang telah Dia tetapkan
  rationale: Kata ganti relatif merujuk pada εὐδοκία, dan bentuk verba tengah menyatakan bahwa Allah menetapkan atau merencanakan maksud itu. “Telah Dia tetapkan” ringkas dan sesuai dengan konteks maksud ilahi.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Teks Yunani memakai kata ganti yang secara harfiah berarti “di dalam dia.” Padanan ini mempertahankan ketidakjelasan rujukannya, yang dapat dipahami sebagai Kristus atau secara refleksif sebagai Allah sendiri.
theological_decisions:
- issue: Rujukan ἐν αὐτῷ
  choice: Teks utama mempertahankan kata ganti “di dalam Dia” tanpa menentukan rujukannya.
  alternative: “di dalam Kristus” atau “di dalam diri-Nya sendiri”
  rationale: Konteks dekat memungkinkan rujukan kepada Kristus, sedangkan sebagian penafsir memahami kata ganti itu secara refleksif, yaitu Allah menetapkannya dalam diri-Nya sendiri. Ketegangan ini dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pada “Dia” dan akhiran “-Nya” mengikuti kebiasaan penghormatan kepada Allah. Struktur partisipial dipertahankan agar ayat ini tetap terhubung dengan kalimat panjang dalam konteksnya.
