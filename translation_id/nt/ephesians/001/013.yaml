  to: Di dalam Dia[a], kamu juga, setelah mendengar firman kebenaran, yaitu kabar baik tentang keselamatanmu[b], di dalam Dia pula, setelah percaya, dimeteraikan dengan Roh Kudus yang dijanjikan[c].
