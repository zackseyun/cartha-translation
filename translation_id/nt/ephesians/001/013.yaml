  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: id
  text: Di dalam Dia[a], kamu juga, setelah mendengar firman kebenaran, yaitu kabar baik tentang keselamatanmu[b], di dalam Dia pula, setelah percaya, dimeteraikan dengan Roh Kudus yang dijanjikan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang di dalam-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Injil keselamatanmu.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Roh Kudus dari janji.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Mengacu kepada Kristus dalam konteks sebelumnya dan mempertahankan gagasan Paulus tentang keberadaan dalam persatuan dengan Kristus.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: Mempertahankan penekanan tambahan yang menyertakan para pembaca bersama kelompok 'kami' pada ayat-ayat sebelumnya.
- source_word: ἀκούσαντες
  choice: setelah mendengar
  rationale: Partisip aoris paling wajar menunjukkan tindakan yang mendahului verba utama, tanpa menetapkan skema teologis yang lebih rinci.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: firman kebenaran
  rationale: Dekat dengan bentuk Yunani dan tetap merupakan ungkapan yang jelas serta bermartabat dalam bahasa Indonesia.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: kabar baik tentang keselamatanmu
  rationale: Menyampaikan arti εὐαγγέλιον secara mudah dipahami; frasa ini menjelaskan 'firman kebenaran' sebagai berita yang berkaitan dengan keselamatan para pembaca.
- source_word: ἐν ᾧ καὶ πιστεύσαντες
  choice: dan setelah percaya kepada-Nya
  rationale: Bahasa Indonesia secara alami mengaitkan ἐν ᾧ dengan tindakan percaya. Terjemahan ini mempertahankan rujukan kepada Kristus dan urutan partisip, tanpa pengulangan kaku 'di dalam Dia'.
- source_word: ἐσφραγίσθητε
  choice: dimeteraikan
  rationale: Mempertahankan metafora meterai sebagai tanda kepemilikan, pengesahan, atau perlindungan, dengan bentuk pasif seperti sumber.
- source_word: τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: dengan Roh Kudus yang dijanjikan
  rationale: Mengungkapkan genitif Yunani secara alami sebagai Roh Kudus yang telah dijanjikan, sementara datif diterjemahkan 'dengan' agar metafora pemeteraian tetap terbuka terhadap nuansa sarana dan meterai.
theological_decisions:
- issue: Hubungan antara mendengar, percaya, dan dimeteraikan
  choice: 'Partisip diterjemahkan secara berurutan: ''setelah mendengar ... setelah percaya ... dimeteraikan''.'
  alternative: Partisip dapat diterjemahkan lebih longgar sebagai 'ketika mendengar ... ketika percaya'.
  rationale: Partisip aoris yang mendahului verba utama secara alami dapat menyatakan tindakan terdahulu, tetapi terjemahan ini tidak merinci jeda waktu ataupun tata urutan keselamatan secara denominatif.
- issue: Hubungan ἐν ᾧ dengan πιστεύσαντες
  choice: Diterjemahkan 'percaya kepada-Nya'.
  alternative: Bentuk yang lebih formal ialah 'di dalam Dia, setelah percaya'.
  rationale: Konstruksi Yunani dapat mempertahankan lingkup 'di dalam Dia', tetapi dalam bahasa Indonesia 'percaya kepada-Nya' paling alami dan tetap menunjuk kepada Kristus tanpa menghapus rujukan tersebut.
- issue: Arti 'Roh dari janji'
  choice: Diterjemahkan 'Roh Kudus yang dijanjikan'.
  alternative: Dapat diterjemahkan lebih harfiah sebagai 'Roh Kudus dari janji'.
  rationale: Genitif τῆς ἐπαγγελίας bersifat padat dan paling wajar dipahami sebagai Roh yang dijanjikan Allah. Catatan kaki mempertahankan bentuk formal yang lebih ambigu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina 'Dia/-Nya' dikapitalisasi menurut kebiasaan penulisan religius Indonesia. Bentuk tunggal 'kamu' mengikuti ὑμεῖς secara kolektif dalam konteks jemaat; 'dimeteraikan' dipertahankan karena metafora sumber penting dan masih dapat dipahami.
