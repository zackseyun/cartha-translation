  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: id
  text: demi pujian atas kemuliaan anugerah-Nya, yang telah Ia anugerahkan[a] kepada kita di dalam Sang Terkasih[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang dengannya Ia mengaruniai kita.” Kata Yunani yang diterjemahkan “anugerahkan” berkerabat dengan kata “anugerah” dan menekankan bahwa Allah bertindak dengan murah hati kepada kita.
    reason: lexical_alternative
  - marker: b
    text: “Sang Terkasih” merujuk kepada Sang Anak, yaitu Mesias.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: demi pujian
  rationale: Dalam ungkapan ini, εἰς menyatakan tujuan atau hasil. “Demi pujian” alami dalam bahasa Indonesia dan tetap mempertahankan bentuk nominal Yunani.
- source_word: δόξης
  choice: kemuliaan
  rationale: Dalam konteks doksologis Paulus, δόξα paling tepat diterjemahkan “kemuliaan”; kata ini menunjuk pada keagungan yang layak dipuji.
- source_word: χάριτος
  choice: anugerah
  rationale: χάρις di sini menunjuk pada kemurahan Allah yang diberikan secara cuma-cuma dalam karya keselamatan. “Anugerah” merupakan istilah Indonesia yang jelas dan lazim.
- source_word: ἐχαρίτωσεν
  choice: telah dianugerahkan-Nya
  rationale: Bentuk ini mengungkapkan tindakan Allah yang sudah terlaksana dan mempertahankan hubungan kata antara χάρις (“anugerah”) dan verba serumpunnya χαριτόω. Susunan pasif berpelaku ini juga alami dalam ragam Alkitab Indonesia.
- source_word: ἐν
  choice: di dalam
  rationale: Terjemahan dasar ini mempertahankan keluasan makna ἐν, termasuk kemungkinan nuansa lingkup, persekutuan, atau kesatuan, tanpa membatasinya menjadi sekadar alat.
- source_word: τῷ ἠγαπημένῳ
  choice: Dia yang Terkasih
  rationale: Partisipel pasif perfektum ini dipakai secara substantival sebagai gelar yang merujuk kepada Kristus. Terjemahan ini mempertahankan bentuk gelarnya tanpa menambahkan kata “Anak”, yang tidak dinyatakan secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Hubungan leksikal antara χάρις dan χαριτόω
  choice: anugerah-Nya, yang telah dianugerahkan-Nya kepada kita
  alternative: anugerah-Nya, yang dengannya Ia telah menunjukkan kemurahan kepada kita
  rationale: Pengulangan “anugerah/dianugerahkan” mempertahankan permainan kata Yunani dan menegaskan bahwa tindakan Allah bersumber pada anugerah-Nya. Alternatifnya lebih idiomatis tetapi mengaburkan hubungan kata tersebut.
- issue: Daya kristologis τῷ ἠγαπημένῳ
  choice: Dia yang Terkasih
  alternative: Anak-Nya yang terkasih
  rationale: Ungkapan itu jelas merujuk kepada Kristus, tetapi teks ayat ini tidak secara eksplisit memakai kata “Anak”. Pilihan ini mempertahankan gelar sekaligus menghindari penambahan penjelasan ke dalam teks utama.
- issue: Nuansa ἐν sebelum gelar Kristus
  choice: di dalam Dia yang Terkasih
  alternative: melalui Dia yang Terkasih
  rationale: “Di dalam” mempertahankan ambiguitas dan kepadatan teologis preposisi Yunani, termasuk gagasan lingkup atau kesatuan dengan Kristus; “melalui” akan mempersempitnya menjadi sarana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Susunan kalimat mempertahankan bentuk ayat sebagai bagian dari satu kalimat panjang dalam Efesus 1:3–14. Kapitalisasi “Dia yang Terkasih” menandai pemakaiannya sebagai gelar, bukan menambahkan unsur yang tidak terdapat dalam teks Yunani.
