  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: id
  text: Ia menundukkan segala sesuatu di bawah kaki-Nya[a] dan memberikan-Nya kepada jemaat sebagai kepala atas segala sesuatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini menggemakan Mazmur 8:6, yaitu gambaran Kitab Suci tentang segala sesuatu yang ditempatkan di bawah kaki sang penguasa.
    reason: cross_reference
  - marker: b
    text: Atau, “dan memberikan Dia sebagai kepala atas segala sesuatu demi kepentingan jemaat.” Bentuk dativus τῇ ἐκκλησίᾳ dapat menyatakan pihak yang menerima ataupun pihak yang memperoleh manfaat.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral menunjuk pada keseluruhan segala sesuatu dan mempertahankan cakupan kosmis pernyataan ini.
- source_word: ὑπέταξεν
  choice: menundukkan
  rationale: Kata ini menyatakan tindakan menempatkan sesuatu di bawah kekuasaan atau dalam kedudukan yang takluk; pilihan ini dekat dengan bahasa sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: di bawah kaki-Nya
  rationale: Ungkapan konkret tentang kekuasaan dan penaklukan ini dipertahankan karena menggemakan gambaran Kitab Suci dalam Mazmur 8:6.
- source_word: αὐτὸν ἔδωκεν
  choice: memberikan Dia
  rationale: Terjemahan ini mempertahankan arti dasar δίδωμι dan tidak mempersempitnya menjadi sekadar 'mengangkat' atau 'menjadikan'.
- source_word: κεφαλὴν
  choice: sebagai kepala
  rationale: Kata 'kepala' mempertahankan metafora Yunani, sedangkan 'sebagai' menjelaskan fungsi unsur pelengkap dalam kalimat Indonesia.
- source_word: ὑπὲρ πάντα
  choice: atas segala sesuatu
  rationale: Dalam konteks ini ὑπέρ menyatakan kedudukan atau kewenangan yang melampaui seluruh ciptaan.
- source_word: τῇ ἐκκλησίᾳ
  choice: kepada jemaat
  rationale: Dativus ini paling langsung dapat dibaca sebagai penerima pemberian, tetapi kemungkinan makna manfaat tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara Kristus sebagai kepala, segala sesuatu, dan jemaat
  choice: Kristus diberikan kepada jemaat sebagai Dia yang menjadi kepala atas segala sesuatu.
  alternative: Kristus dijadikan kepala atas segala sesuatu demi kepentingan jemaat.
  rationale: Susunan ini menghubungkan 'kepala' dengan 'atas segala sesuatu' dan membaca dativus τῇ ἐκκλησίᾳ sebagai penerima, sambil mempertahankan kemungkinan bahwa dativus itu menyatakan manfaat melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora 'di bawah kaki' dan 'kepala' dipertahankan karena penting bagi gambaran serta hubungan antarteks. Huruf kapital pada pronomina ilahi mengikuti kebiasaan luas dalam ragam keagamaan Indonesia, sedangkan 'kepala' dipertahankan sebagai metafora, bukan diubah menjadi gelar tafsiran.
