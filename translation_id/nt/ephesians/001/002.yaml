  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: id
  text: Anugerah dan damai sejahtera bagi kalian dari Allah, Bapa kita, dan Tuhan Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Kristus.” Kata Yunani Χριστός dapat berfungsi sebagai gelar (“Mesias”) atau, dalam konteks tertentu, sebagai bentuk yang menyerupai nama (“Kristus”).'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam salam Paulus, χάρις sekaligus mengadaptasi bentuk salam dan menyampaikan berkat ilahi. “Anugerah” mempertahankan bobot teologisnya secara wajar dalam bahasa Indonesia.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Dativus penerima dalam formula berkat ini paling alami dinyatakan dengan “bagi kalian”; bentuk jamak dibuat eksplisit.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan cakupan εἰρήνη dan gaung konsep syalom.
- source_word: ἀπὸ
  choice: dari
  rationale: Preposisi ini menandai sumber berkat.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Allah, Bapa kita
  rationale: 'Rangkaian genitif dipahami secara aposisional: Allah adalah Bapa kita. Tanda koma memperjelas hubungan itu tanpa menambahkan kata penghubung ke dalam frasa Yunani.'
- source_word: κυρίου
  choice: Tuhan
  rationale: “Tuhan” mempertahankan daya gelar Kristologis κύριος dan merupakan padanan baku yang alami.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός diterjemahkan sebagai gelar, bukan sekadar ditransliterasikan. “Sang” menandai fungsi gelar secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Fungsi Χριστοῦ dalam rangkaian Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός secara leksikal berarti Yang Diurapi/Mesias dan di sini tetap dapat didengar sebagai gelar, meskipun dalam pemakaian Paulus bentuk itu juga dapat berfungsi menyerupai nama. Teks utama mempertahankan makna gelarnya, sedangkan catatan menjaga alternatif yang sudah lazim.
- issue: Relasi sumber berkat antara Allah Bapa dan Tuhan Yesus
  choice: mengulang “dari” sebelum “Tuhan Yesus” demi kejelasan bahasa Indonesia
  alternative: satu “dari” yang menaungi kedua unsur, sebagaimana bentuk Yunani secara harfiah
  rationale: Bahasa Yunani memakai satu ἀπό bagi dua unsur yang dihubungkan καί. Pengulangan “dari” tidak memisahkan sumber secara teologis, tetapi membuat koordinasinya jelas dan alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipilih untuk memperjelas bahwa ὑμῖν berbentuk jamak. “Damai sejahtera” mempertahankan nuansa salam dan keutuhan hidup yang lebih luas daripada sekadar ketiadaan konflik.
