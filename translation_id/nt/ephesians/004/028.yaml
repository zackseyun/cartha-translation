source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: id
  text: Orang yang mencuri janganlah mencuri lagi, tetapi hendaklah ia bekerja keras dengan tangannya sendiri, mengerjakan apa yang baik,[a] supaya ia mempunyai sesuatu untuk dibagikan kepada orang yang membutuhkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melakukan pekerjaan yang baik.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepada orang yang mempunyai kebutuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Orang yang mencuri
  rationale: Partisipel kini berartikel dipakai sebagai nomina. Ungkapan ini mempertahankan gambaran orang yang melakukan pencurian tanpa menjadikannya label tetap seperti 'pencuri'.
- source_word: μηκέτι κλεπτέτω
  choice: janganlah mencuri lagi
  rationale: Bentuk imperatif kini negatif menuntut dihentikannya kebiasaan terdahulu; 'janganlah ... lagi' wajar dan tegas dalam bahasa Indonesia.
- source_word: μᾶλλον δὲ κοπιάτω
  choice: tetapi hendaklah ia bekerja keras
  rationale: Kontras korektif dipertahankan dengan 'tetapi', sedangkan κοπιάω menyiratkan kerja yang sungguh-sungguh dan melelahkan, bukan sekadar melakukan pekerjaan.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: dengan tangannya sendiri, mengerjakan apa yang baik
  rationale: Susunan ini mempertahankan penekanan pada kerja pribadi dan menjaga keluasan τὸ ἀγαθόν sebagai 'apa yang baik', yang dalam konteks mencakup pekerjaan yang jujur dan bermanfaat.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: supaya ia mempunyai sesuatu untuk dibagikan
  rationale: Klausa tujuan diterjemahkan secara alami. 'Sesuatu' disuplai secara implisit dari konstruksi Yunani, dan μεταδίδωμι menekankan berbagi dari apa yang dimiliki.
- source_word: τῷ χρείαν ἔχοντι
  choice: kepada orang yang berkekurangan
  rationale: Frasa datif menunjuk penerima yang mempunyai kebutuhan. 'Berkekurangan' menyampaikan kebutuhan material dalam konteks hasil kerja dan pemberian tanpa melabeli orang itu secara merendahkan.
theological_decisions:
- issue: Tujuan etis bekerja
  choice: Kerja jujur menggantikan pencurian dan bertujuan memungkinkan seseorang berbagi dengan orang yang berkekurangan.
  alternative: Ayat ini terutama menekankan kemandirian ekonomi atau ganti rugi.
  rationale: Klausa tujuan secara eksplisit mengarahkan hasil kerja kepada tindakan berbagi. Kemandirian mungkin tersirat, tetapi kemurahan hati kepada orang yang membutuhkan merupakan tujuan yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Pengulangan 'mencuri' mempertahankan daya retoris teks Yunani. 'Hendaklah' menyampaikan imperatif tanpa terdengar kasar, sedangkan 'bekerja keras' mempertahankan nuansa usaha berat dalam κοπιάω.
