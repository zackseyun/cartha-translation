base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: id
  text: jika memang kamu telah mendengar Dia dan diajar di dalam Dia[a], sebagaimana kebenaran ada di dalam Yesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mendengar tentang Dia.” Secara lebih harfiah, bahasa Yunani berbunyi “telah mendengar Dia,” yang mungkin menyiratkan bahwa melalui pemberitaan para rasul mereka sungguh mendengar Kristus sendiri.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “di dalam Dia” dan “di dalam Yesus” dapat menyatakan ranah, kesatuan, atau hubungan erat; bahasa Yunani membiarkan nuansanya lebih luas daripada sekadar “oleh Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: jika memang
  rationale: Mempertahankan bentuk bersyarat serta penegasan ringan dari γε tanpa mengubahnya menjadi pernyataan sebab seperti 'karena memang'.
- source_word: αὐτὸν ἠκούσατε
  choice: kamu telah mendengar Dia
  rationale: Objek langsung αὐτόν paling wajar diterjemahkan secara langsung sebagai 'mendengar Dia'; ungkapan yang mencolok ini dibiarkan tetap terbuka dan tidak diperhalus menjadi sekadar mendengar tentang Kristus.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan ἐν dan keluasan nuansanya, yang dapat menunjuk pada ranah, kesatuan, atau hubungan erat, bukan hanya pelaku pengajaran.
- source_word: ἐδιδάχθητε
  choice: diajar
  rationale: Bentuk pasif aoristus diterjemahkan secara langsung dan alami sebagai 'diajar'.
- source_word: καθώς
  choice: sebagaimana
  rationale: Menjaga daya pembanding yang menghubungkan pengajaran para pembaca dengan kebenaran yang ada di dalam Yesus.
- source_word: ἀλήθεια
  choice: kebenaran
  rationale: Nomina tanpa artikel diterjemahkan tanpa penentu tambahan; 'kebenaran' alami dalam bahasa Indonesia dan tidak mereduksinya menjadi sekadar gagasan abstrak.
- source_word: ἐν τῷ Ἰησοῦ
  choice: di dalam Yesus
  rationale: Mempertahankan nama pribadi Yesus dan konstruksi ἐν, sehingga nuansa ranah, kesatuan, atau keberadaan kebenaran dalam diri-Nya tidak dipersempit.
theological_decisions:
- issue: Apakah αὐτὸν ἠκούσατε berarti mendengar Dia secara langsung atau mendengar tentang Dia.
  choice: mendengar Dia
  alternative: mendengar tentang Dia
  rationale: Konstruksi Yunani memakai αὐτόν sebagai objek langsung tanpa preposisi 'tentang'. Terjemahan langsung juga mempertahankan kemungkinan bahwa melalui pemberitaan rasuli mereka sungguh mendengar Kristus sendiri, tanpa memaksakan penafsiran itu.
- issue: Cara menerjemahkan pengulangan ἐν αὐτῷ dan ἐν τῷ Ἰησοῦ.
  choice: di dalam Dia / di dalam Yesus
  alternative: oleh Dia / dalam kesatuan dengan Yesus
  rationale: Pengulangan 'di dalam' menjaga hubungan verbal kedua frasa serta ketegangan teologis bahasa Paulus, yang dapat mencakup ranah, kesatuan, atau hubungan erat dan tidak harus hanya berarti pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Dia' memakai huruf kapital untuk kejelasan rujukan kepada Kristus. Urutan klausa dan pengulangan 'di dalam' dipertahankan sedekat mungkin dengan sumber Yunani, sementara 'telah' membantu menyatakan aspek lampau secara alami.
