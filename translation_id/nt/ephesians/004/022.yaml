    rationale: φθειρόμενον adalah partisipel kini pasif tentang proses kerusakan/kehancuran yang sedang berlangsung. Κατά lebih baik tidak diratakan menjadi sebab sederhana ‘karena’; hubungan dengan keinginan-keinginan tipu daya perlu tetap tampak.
  - severity: low
    issue: Catatan a menyatakan penafsiran sebagai ‘maksudnya’.
    rationale: Catatan alternatif sebaiknya menjelaskan bentuk harfiah dan padanan alternatif tanpa menetapkan uraian antropologis tertentu sebagai satu-satunya maksud.
