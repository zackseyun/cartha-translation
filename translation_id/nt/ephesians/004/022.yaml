  source_fidelity: 'Draf secara umum menangkap metafora ‘menanggalkan’ dan istilah ‘manusia lama’. Namun, ‘kamu harus’ menambahkan daya kewajiban yang tidak dinyatakan oleh infinitif Yunani dalam konstruksi pengajaran yang bergantung pada ayat sebelumnya. Selain itu, ‘menuju kebinasaan karena’ menggeser φθειρόμενον dan κατά: teks menyatakan proses kerusakan yang berlangsung, yang selaras dengan/ditandai oleh keinginan-keinginan dari tipu daya, bukan sekadar arah menuju kebinasaan yang disebabkan oleh keinginan.'
  naturalness: ‘Menanggalkan manusia lama’ alami dan sesuai ragam baku. ‘Yaitu menanggalkan’ mempertahankan fungsi infinitif secara lebih netral daripada ‘yaitu bahwa ... kamu harus menanggalkan’. ‘Yang terus dirusak oleh keinginan-keinginan yang berasal dari tipu daya’ juga merupakan bahasa Indonesia modern yang jelas, sambil mempertahankan bentuk pasif dan proses yang berlanjut.
  terminology: ‘Manusia lama’ adalah padanan yang baik untuk τὸν παλαιὸν ἄνθρωπον dan mempertahankan gambaran antropologisnya. ‘Keinginan-keinginan yang berasal dari tipu daya’ lebih dekat dengan genitif τῆς ἀπάτης daripada ‘keinginan yang menipu’, yang dapat menyiratkan bahwa keinginan itu sendiri secara aktif menipu.
