  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: id
  text: yaitu menanggalkan, sehubungan dengan cara hidupmu yang dahulu, manusia lama[a], yang terus dirusak oleh keinginan-keinginan yang berasal dari tipu daya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diri lama”. Secara harfiah, “manusia lama”. Ungkapan Yunani ini memakai bentuk maskulin yang dapat berfungsi secara representatif.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “keinginan-keinginan dari tipu daya”; yaitu keinginan-keinginan yang dibentuk atau dicirikan oleh tipu daya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: kamu harus menanggalkan
  rationale: Kata kerja ini berarti melepaskan atau membuang, dengan kiasan pakaian yang berlanjut dalam ayat 24. Bentuk ini juga wajar sebagai isi pengajaran yang dimulai pada ayat 21, tanpa mengubahnya menjadi perintah langsung.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: sehubungan dengan cara hidupmu yang dahulu
  rationale: ἀναστροφή menunjuk pada perilaku atau pola hidup, sedangkan κατά di sini paling wajar menyatakan hubungan atau lingkup.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: manusia lama
  rationale: Terjemahan ini mempertahankan gambaran antropologis ἄνθρωπος dan lebih alami dalam bahasa Indonesia daripada 'orang lama'; frasa tersebut menunjuk pada keberadaan manusia dalam pola hidup terdahulu, bukan hanya laki-laki.
- source_word: τὸν φθειρόμενον
  choice: yang sedang menuju kebinasaan
  rationale: Partisipel kini pasif menggambarkan proses kerusakan atau kehancuran yang terus berlangsung. Ungkapan ini menyampaikan arah proses tersebut secara alami tanpa membatasinya pada kerusakan moral saja.
- source_word: κατὰ τὰς ἐπιθυμίας
  choice: karena berbagai keinginan
  rationale: Dalam konteks ini κατά dapat menunjukkan pengaruh atau faktor yang mengendalikan proses kebinasaan. 'Karena' menghasilkan hubungan yang jelas dan alami dalam bahasa Indonesia.
- source_word: τῆς ἀπάτης
  choice: yang menipu
  rationale: Genitif harfiah 'dari penipuan' secara idiomatis menerangkan keinginan-keinginan itu sebagai keinginan yang dibentuk oleh tipu daya dan menyesatkan manusia.
theological_decisions:
- issue: Makna τὸν παλαιὸν ἄνθρωπον
  choice: manusia lama
  alternative: diri yang lama
  rationale: '''Manusia lama'' mempertahankan istilah antropologis dan kemungkinan nuansa representatif atau korporat dalam pemikiran Paulus, sedangkan ''diri yang lama'' dapat mempersempitnya menjadi aspek psikologis individual.'
- issue: Daya infinitif ἀποθέσθαι dalam konteks
  choice: yaitu bahwa ... kamu harus menanggalkan
  alternative: untuk menanggalkan; bahwa kamu telah menanggalkan
  rationale: Infinitif ini meneruskan isi pengajaran pada ayat 21. Rumusan ini menyampaikan kewajiban yang terkandung di dalamnya, tetapi tidak menjadikannya perintah langsung atau menyelesaikannya sebagai peristiwa pertobatan yang telah selesai.
- issue: Daya φθειρόμενον
  choice: sedang menuju kebinasaan
  alternative: sedang dirusak; sedang menjadi rusak
  rationale: Pilihan ini mempertahankan proses yang sedang berlangsung serta kemungkinan cakupan moral dan eskatologis, tanpa menentukan satu pelaku eksplisit yang tidak disebutkan dalam bentuk pasif Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menanggalkan' mempertahankan kiasan pakaian yang berpasangan dengan 'mengenakan' dalam ayat 24. Bentuk tunggal 'cara hidupmu' mengikuti sapaan kolektif ὑμᾶς secara alami, sedangkan 'berbagai keinginan' mencerminkan bentuk jamak Yunani.
