    rationale: ἀποθέσθαι adalah infinitif yang meneruskan isi pengajaran dari konteks sebelumnya. Terjemahan sebaiknya tidak memutuskan apakah daya utamanya kewajiban, perintah, atau peristiwa yang telah terjadi.
