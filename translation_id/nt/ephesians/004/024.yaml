  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: id
  text: dan mengenakan manusia baru[a], yang diciptakan menurut Allah[b] dalam kebenaran[c] dan kekudusan yang sejati[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diri yang baru” atau “pribadi baru”. Ungkapan Yunani “manusia baru” selaras dengan ungkapan “manusia lama” dalam konteks sekitarnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga dipahami “menyerupai Allah”, “sesuai dengan Allah”, atau “menurut pola Allah”.
    reason: lexical_alternative
  - marker: c
    text: Atau “keadilan”.
    reason: alternative_reading
  - marker: d
    text: Atau, lebih harfiah, “dalam kebenaran dan kekudusan dari kebenaran”. Frasa “dari kebenaran” dapat menerangkan kedua nomina; “yang sejati” memahami frasa itu secara kualitatif.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: mengenakan
  rationale: Mempertahankan metafora pakaian yang berpasangan dengan tindakan menanggalkan dalam konteks sebelumnya; bentuk aktif-refleksifnya wajar dalam bahasa Indonesia.
- source_word: καινὸν ἄνθρωπον
  choice: manusia baru
  rationale: Mempertahankan padanan leksikal dan kaitannya dengan ungkapan 'manusia lama' dalam konteks, tanpa mempersempitnya menjadi hanya 'diri'.
- source_word: κατὰ θεὸν
  choice: menurut Allah
  rationale: Menjaga bentuk dan keluasan makna κατά dengan akusatif; frasa ini dapat menyatakan kesesuaian dengan Allah, pola-Nya, atau keserupaan dengan-Nya tanpa menentukan salah satunya di dalam teks utama.
- source_word: κτισθέντα
  choice: yang diciptakan
  rationale: Mempertahankan bentuk pasif serta gema bahasa penciptaan; klausa relatif menghasilkan susunan Indonesia yang alami.
- source_word: δικαιοσύνῃ
  choice: kebenaran
  rationale: Padanan Indonesia yang lazim dalam konteks teologis Paulus, meskipun 'keadilan' termasuk dalam rentang maknanya.
- source_word: ὁσιότητι
  choice: kekudusan
  rationale: Menyatakan sifat saleh atau kudus dalam hubungan dengan Allah dan merupakan padanan Indonesia yang paling alami di sini.
- source_word: τῆς ἀληθείας
  choice: sejati
  rationale: Genitif ini dipahami secara kualitatif dan diterapkan pada pasangan 'kebenaran dan kekudusan'. Bentuk adjektival menghindari ungkapan Indonesia yang janggal dan berulang, sambil mempertahankan kemungkinan bentuk harfiahnya dalam catatan kaki.
theological_decisions:
- issue: Ungkapan antropologis καινὸν ἄνθρωπον
  choice: manusia baru
  alternative: diri yang baru; pribadi baru
  rationale: Ungkapan Yunani memakai ἄνθρωπος dan berpasangan dengan motif 'manusia lama'. Pilihan ini mempertahankan gambaran antropologis Paulus dan dapat memiliki daya representatif, bukan sekadar menunjuk keadaan batin individu.
- issue: Makna κατὰ θεὸν
  choice: menurut Allah
  alternative: menyerupai Allah; sesuai dengan Allah; menurut pola Allah
  rationale: Teks dapat menunjuk pada kesesuaian atau keserupaan dengan Allah. Terjemahan utama tidak menetapkan secara eksplisit aspek mana yang dimaksud.
- issue: Hubungan genitif τῆς ἀληθείας
  choice: sejati
  alternative: dari kebenaran; yang berasal dari kebenaran
  rationale: Genitif kemungkinan bersifat kualitatif dan menerangkan kedua nomina, tetapi hubungan sumber atau kepunyaan tetap mungkin secara gramatikal. Alternatif yang lebih formal dicatat agar ketegangan itu tetap terlihat.
- issue: Cakupan δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Kebenaran adalah istilah teologis Indonesia yang mapan, sedangkan keadilan tetap merupakan kemungkinan semantis dan dicantumkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari ayat sebelumnya dengan pembuka “dan”. “Mengenakan” mempertahankan metafora pakaian. Ungkapan “menurut Allah” sengaja agak formal untuk menjaga ambiguitas sumber, sedangkan “sejati” dipilih agar hubungan genitif dapat dibaca dengan wajar tanpa pengulangan kata “kebenaran” yang membingungkan.
