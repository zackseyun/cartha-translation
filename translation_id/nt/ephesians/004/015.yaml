base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: id
  text: Sebaliknya, dengan berkata benar dalam kasih[a], marilah kita bertumbuh dalam segala hal[b] ke arah Dia yang adalah kepala, yaitu Mesias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hidup dalam kebenaran” atau “dengan berlaku benar”; kata kerja Yunani ini dapat mencakup perkataan yang benar maupun perilaku yang sesuai dengan kebenaran.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam setiap segi”; secara lebih harfiah, “segala sesuatu.”
    reason: lexical_alternative
  - marker: c
    text: 'Yunani: “Kristus”; di sini diterjemahkan “Mesias” karena kata tersebut berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: dengan mengatakan kebenaran
  rationale: Partisipel ini dapat mencakup perkataan dan perilaku yang benar. Dalam konteks ajaran sesat dan tipu daya pada ayat sebelumnya, 'mengatakan kebenaran' merupakan ungkapan Indonesia yang paling alami; cakupan yang lebih luas dipertahankan dalam catatan kaki.
- source_word: δὲ
  choice: Sebaliknya
  rationale: δέ menandai kontras ringan dengan keadaan mudah diombang-ambingkan dan diperdaya pada ayat sebelumnya.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Mempertahankan gambaran lingkup sekaligus cara bertindak, serta mengikuti ungkapan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: αὐξήσωμεν
  choice: marilah kita bertumbuh
  rationale: Subjungtif orang pertama jamak bersifat hortatoris, sehingga diterjemahkan sebagai ajakan bersama.
- source_word: εἰς αὐτὸν
  choice: ke arah Dia
  rationale: Mempertahankan daya arah εἰς dalam gambaran pertumbuhan, tanpa memberi kesan janggal bahwa orang secara harfiah tumbuh masuk ke dalam seseorang.
- source_word: τὰ πάντα
  choice: dalam segala hal
  rationale: 'Dalam konstruksi ini frasa tersebut berfungsi secara menyeluruh: pertumbuhan mencakup setiap segi. Terjemahan ini tetap dekat dengan bentuk Yunani dan alami dalam bahasa Indonesia.'
- source_word: κεφαλή
  choice: kepala
  rationale: Terjemahan langsung ini mempertahankan metafora tubuh tanpa menetapkan tafsiran khusus seperti 'sumber' atau 'penguasa'.
- source_word: Χριστός
  choice: Mesias
  rationale: Χριστός tampil secara aposisional sebagai gelar bagi Dia yang adalah kepala; 'Mesias' menyampaikan fungsi gelarnya dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna ἀληθεύοντες
  choice: Diterjemahkan 'dengan mengatakan kebenaran' dalam teks utama.
  alternative: '''dengan hidup dalam kebenaran'' atau ''dengan berlaku benar'''
  rationale: Konteks dekat menyoroti ajaran palsu dan tipu daya, sehingga unsur berkata benar paling menonjol, tetapi verba Yunani dapat pula meliputi perilaku yang sesuai dengan kebenaran; kemungkinan itu dicatat agar ketegangan semantis tidak dihapus.
- issue: Daya tafsir κεφαλή
  choice: Diterjemahkan hanya sebagai 'kepala'.
  alternative: '''sumber'' atau ''penguasa'''
  rationale: Metafora Paulus dipertahankan tanpa memasukkan kesimpulan teologis yang diperdebatkan ke dalam teks terjemahan.
- issue: Status Χριστός sebagai gelar
  choice: Diterjemahkan 'Mesias'.
  alternative: '''Kristus'''
  rationale: Posisi aposisionalnya menunjukkan fungsi gelar; 'Mesias' membuat fungsi itu jelas tanpa menambahkan artikel yang tidak diperlukan dalam susunan Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan metafora pertumbuhan dan tubuh. Semua penanda catatan kaki ditempatkan pada unsur terkait dalam teks utama.
