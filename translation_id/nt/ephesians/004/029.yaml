id: EPH.4.29
reference: Ephesians 4:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: id
  text: Jangan sampai ada perkataan busuk yang keluar dari mulut kalian,[a] melainkan hanya perkataan yang baik untuk membangun sesuai dengan kebutuhan,[b] supaya perkataan itu memberikan anugerah kepada mereka yang mendengarnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perkataan yang busuk”; dapat juga berarti “ucapan yang merusak” atau “perkataan yang tidak sehat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “untuk membangun sebagaimana diperlukan” atau “untuk membangun sesuai dengan keadaan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “memberikan manfaat kepada mereka yang mendengarnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: jangan sampai ada perkataan busuk
  rationale: Dalam larangan, πᾶς dengan nomina tunggal berarti tidak satu pun. 'Perkataan busuk' mempertahankan metafora σαπρός, yaitu sesuatu yang busuk atau rusak, sekaligus dapat dipahami sebagai ucapan yang buruk dan merusak.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: yang keluar dari mulut kalian
  rationale: Ungkapan ini mempertahankan gambaran ucapan yang keluar dari mulut. 'Kalian' menyatakan bentuk jamak ὑμῶν secara jelas dalam bahasa Indonesia modern.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: melainkan hanya perkataan yang baik
  rationale: Konstruksi Yunani bersifat eliptis dan kembali kepada λόγος. Penambahan 'perkataan' membuat rujukannya jelas, sedangkan 'hanya' menyampaikan kontras pembatas dalam konteks larangan.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: untuk membangun sesuai dengan kebutuhan
  rationale: '''Membangun'' mempertahankan metafora οἰκοδομή. Genitif τῆς χρείας padat dan dapat dipahami sebagai pembangunan yang sesuai dengan kebutuhan yang ada; terjemahan ini mempertahankan kepadatan serta ambiguitas relasinya.'
- source_word: ἵνα δῷ χάριν
  choice: supaya perkataan itu memberikan anugerah
  rationale: '''Anugerah'' mempertahankan cakupan χάρις dan resonansi khas Paulus tanpa membatasinya hanya pada manfaat praktis. Subjek ''perkataan itu'' dinyatakan agar alur kalimat jelas dalam bahasa Indonesia.'
- source_word: τοῖς ἀκούουσιν
  choice: kepada mereka yang mendengarnya
  rationale: Terjemahan ini menyatakan partisipel kini secara alami dan memperjelas bahwa yang didengar ialah perkataan tersebut.
theological_decisions:
- issue: Makna χάριν dalam nasihat etis tentang ucapan
  choice: anugerah
  alternative: manfaat; kebaikan
  rationale: '''Anugerah'' menjaga hubungan leksikal dengan kosakata χάρις dalam surat Paulus dan tetap memungkinkan makna bahwa ucapan membawa kebaikan bagi pendengar. Catatan kaki mempertahankan kemungkinan makna kontekstual ''manfaat''.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk memperjelas ὑμῶν. Diksi dibuat lugas dan bermartabat; metafora 'busuk' dan 'membangun' dipertahankan, sementara kemungkinan makna χάρις dan hubungan τῆς χρείας dicatat tanpa menyelesaikan ambiguitas secara berlebihan.
