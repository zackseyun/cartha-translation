id: EPH.4.32
reference: Ephesians 4:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: id
  text: Hendaklah kamu baik hati dan penuh belas kasih terhadap satu sama lain, serta saling mengampuni, sama seperti Allah di dalam Mesias juga telah mengampuni kamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνεσθε
  choice: Hendaklah kamu
  rationale: Bentuk imperatif kini menyampaikan ajakan yang berkelanjutan. Ungkapan ini alami dalam bahasa Indonesia dan membiarkan sifat-sifat berikut menjadi isi perintah.
- source_word: εἰς ἀλλήλους
  choice: seorang terhadap yang lain
  rationale: Mempertahankan arah relasional dan makna timbal balik ungkapan Yunani.
- source_word: χρηστοί
  choice: ramah
  rationale: Dalam konteks hubungan antarsesama, kata ini menunjuk pada sikap baik dan murah hati; 'ramah' jelas serta tidak bertumpang tindih sepenuhnya dengan sifat berikutnya.
- source_word: εὔσπλαγχνοι
  choice: penuh belas kasih
  rationale: Menyampaikan kasih sayang dan kemurahan hati yang mendalam secara alami dalam bahasa Indonesia modern.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: saling mengampuni
  rationale: Dalam konteks ini χαρίζομαι berarti mengampuni kesalahan, sebagaimana ditegaskan oleh tindakan Allah dalam klausa pembanding. Bentuk refleksif jamak ἑαυτοῖς berfungsi secara timbal balik.
- source_word: καθὼς καὶ
  choice: sama seperti ... juga
  rationale: Mempertahankan hubungan pembandingan serta unsur καί tanpa menghasilkan susunan yang terlalu kaku.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: Mempertahankan preposisi ἐν dan menerjemahkan Χριστός sebagai gelar, bukan sekadar mentransliterasikannya sebagai nama.
- source_word: ἐχαρίσατο ὑμῖν
  choice: telah mengampuni kamu
  rationale: Aoristus menunjuk pada tindakan pengampunan Allah; susunan Indonesia ini langsung dan idiomatis.
theological_decisions:
- issue: Makna ἐν Χριστῷ
  choice: di dalam Mesias
  alternative: melalui Mesias
  rationale: Terjemahan 'di dalam' mempertahankan keluasan relasi yang dinyatakan oleh ἐν dan tidak mempersempitnya hanya menjadi sarana tindakan.
- issue: Penerjemahan Χριστῷ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus; 'Mesias' menyatakan arti gelar tersebut secara transparan bagi pembaca Indonesia.
- issue: Hubungan pengampunan manusia dan pengampunan Allah
  choice: sama seperti Allah juga telah mengampuni kamu
  alternative: karena Allah telah mengampuni kamu
  rationale: καθώς menyatakan pola atau pembandingan. Terjemahan tidak mengubahnya secara eksplisit menjadi hubungan sebab-akibat, sehingga ketegangan teologis sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hendaklah' mempertahankan nada nasihat apostolik; 'saling mengampuni' alami bagi pembaca umum. Tidak digunakan catatan kaki karena tidak ada varian atau ambiguitas yang memerlukan penjelasan pada ayat ini.
