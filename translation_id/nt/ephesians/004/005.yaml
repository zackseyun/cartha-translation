  text: one Lord[a], one faith, one baptism;
translation:
  language: id
  text: satu Tuhan, satu iman[a], satu baptisan;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan” atau “kepercayaan”; namun “iman” paling sesuai dengan kesatuan bersama yang ditekankan di sini.
    reason: Alternatif leksikal bagi πίστις.
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: satu
  rationale: Ketiga bentuk adalah bentuk gender yang berbeda dari bilangan yang sama dan masing-masing menyesuaikan diri dengan nomina terkait. Pengulangan “satu” mempertahankan kesejajaran dan penekanan pada kesatuan.
- source_word: κύριος
  choice: Tuhan
  rationale: Dalam rangkaian Efesus 4:4–6, istilah ini paling wajar berfungsi sebagai gelar kristologis. “Tuhan” adalah padanan baku dan bermartabat dalam bahasa Indonesia.
- source_word: πίστις
  choice: iman
  rationale: Di sini istilah tersebut paling mungkin menunjuk pada iman bersama atau respons percaya yang mempersatukan jemaat. “Iman” mempertahankan keluasan makna istilah tanpa mempersempitnya menjadi sekadar kepercayaan subjektif.
- source_word: βάπτισμα
  choice: baptisan
  rationale: “Baptisan” adalah istilah Indonesia yang baku dan tepat bagi ritus yang dimaksud, tanpa menentukan cara pelaksanaan atau pandangan mengenai dayanya.
theological_decisions:
- issue: Rujukan “Tuhan”
  choice: Mempertahankan “Tuhan” sebagai gelar yang dalam konteks ini paling wajar merujuk kepada Yesus Kristus.
  alternative: Rujukan yang lebih umum kepada Allah.
  rationale: Susunan satu Roh (ayat 4), satu Tuhan (ayat 5), serta satu Allah dan Bapa (ayat 6) mendukung rujukan kristologis, tetapi terjemahan tidak menambahkan nama “Yesus” yang tidak tertulis dalam ayat ini.
- issue: Makna “satu baptisan”
  choice: Menerjemahkan secara netral sebagai “satu baptisan”.
  alternative: Penekanan sakramental tertentu atau pengertian yang terutama metaforis/rohani.
  rationale: Ayat ini menegaskan kesatuan, tetapi tidak menentukan cara, daya, atau kerangka teologis baptisan; karena itu ketegangan penafsirannya dipertahankan.
- issue: Makna πίστις
  choice: “Iman” dalam teks utama.
  alternative: “Kesetiaan” atau “kepercayaan”.
  rationale: Dalam konteks daftar unsur pemersatu jemaat, “iman” paling sesuai, sementara kemungkinan leksikal lainnya dicatat tanpa dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur tiga frasa nominal yang sejajar dipertahankan. Tanda koma ditempatkan sebelum penanda catatan kaki agar penanda langsung mengikuti kata yang dijelaskan.
