id: EPH.4.13
reference: Ephesians 4:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: id
  text: sampai kita semua mencapai kesatuan iman[a] dan pengenalan akan Anak Allah[b], menjadi seorang laki-laki dewasa[c], serta mencapai tingkat pertumbuhan yang sesuai dengan kepenuhan Mesias[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kesatuan dalam iman" atau "kesatuan ajaran iman". Ungkapan ini dapat menunjuk iman yang dipegang bersama oleh umat percaya atau tindakan percaya mereka.
    reason: alternative_reading
  - marker: b
    text: Atau "pengetahuan yang mendalam tentang Anak Allah".
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, "menjadi seorang laki-laki dewasa". Bentuk tunggal maskulin ini menggambarkan seluruh jemaat yang bersama-sama mencapai kedewasaan.
    reason: lexical_alternative
  - marker: d
    text: Atau "ukuran perawakan kepenuhan Mesias" atau "tingkat kedewasaan yang sesuai dengan kepenuhan Mesias". Kata Yunaninya dapat berarti usia, kedewasaan, atau perawakan; Χριστός juga lazim diterjemahkan "Kristus".
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: sampai
  rationale: Menandai tujuan akhir dari proses memperlengkapi dan membangun pada ayat sebelumnya; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: καταντήσωμεν οἱ πάντες
  choice: kita semua mencapai
  rationale: Mempertahankan subjek inklusif seluruh komunitas dan gagasan tiba pada sasaran yang dituju.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: mencapai kesatuan iman
  rationale: Mengungkapkan arah menuju kesatuan sambil mempertahankan ambiguitas πίστις antara iman yang dipegang bersama dan tindakan percaya.
- source_word: ἐπιγνώσεως
  choice: pengenalan
  rationale: Dalam konteks relasi dengan Anak Allah, 'pengenalan' lebih alami daripada 'pengetahuan' dan tetap dapat memuat nuansa pengetahuan yang mendalam.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: akan Anak Allah
  rationale: Konstruksi 'pengenalan akan' secara alami menyatakan Anak Allah sebagai objek pengenalan.
- source_word: εἰς ἄνδρα τέλειον
  choice: menjadi manusia dewasa
  rationale: τέλειος di sini menunjuk kematangan, bukan kesempurnaan tanpa cacat. 'Manusia dewasa' mempertahankan citra tunggal korporat, meski ἀνήρ secara lebih harfiah berarti laki-laki dewasa.
- source_word: εἰς μέτρον ἡλικίας
  choice: mencapai ukuran tingkat pertumbuhan
  rationale: ἡλικία dapat berarti usia, kedewasaan, atau perawakan. Pilihan ini mempertahankan metafora pertumbuhan dan terdengar lebih alami daripada 'ukuran perawakan'.
- source_word: τοῦ πληρώματος
  choice: yang sesuai dengan kepenuhan
  rationale: Mempertahankan istilah teologis 'kepenuhan'; 'yang sesuai dengan' menjelaskan hubungan ukuran dengan kepenuhan tanpa menetapkan secara berlebihan jenis genitifnya.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός diperlakukan sebagai gelar bagi Yang Diurapi dalam konteks teologis ini.
theological_decisions:
- issue: Makna τῆς πίστεως
  choice: iman
  alternative: ajaran iman yang dipegang bersama
  rationale: Konteks kesatuan jemaat mendukung pengertian iman bersama, tetapi teks utama memakai 'iman' agar kemungkinan iman atau kepercayaan para orang percaya tidak ditutup.
- issue: Citra εἰς ἄνδρα τέλειον
  choice: menjadi manusia dewasa
  alternative: menjadi seorang laki-laki dewasa
  rationale: Bentuk Yunani memakai citra maskulin tunggal untuk kematangan gereja secara korporat. Bahasa Indonesia 'manusia dewasa' mempertahankan citra pribadi tunggal tanpa memberi kesan bahwa sasaran ini hanya berlaku bagi laki-laki; arti harfiahnya dicatat.
- issue: Hubungan μέτρον, ἡλικία, dan πλήρωμα
  choice: ukuran tingkat pertumbuhan yang sesuai dengan kepenuhan
  alternative: ukuran perawakan kepenuhan
  rationale: Ungkapan Yunani padat dan dapat menunjuk perawakan, usia dewasa, atau kematangan. Terjemahan utama mempertahankan metafora pertumbuhan sambil menghindari frasa Indonesia yang tidak wajar.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Gelar 'Mesias' menampilkan arti titular Χριστός; 'Kristus' tetap merupakan padanan tradisional yang sah dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga sasaran dengan pengulangan gagasan 'mencapai' dibuat cukup jelas tanpa meniru konstruksi Yunani secara kaku. Ambiguitas utama mengenai πίστις, ἡλικία, hubungan genitif πλήρωμα, citra maskulin korporat, dan gelar Χριστός dipertahankan atau dijelaskan dalam catatan kaki.
