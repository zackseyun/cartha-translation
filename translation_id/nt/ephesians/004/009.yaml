base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: id
  text: Apakah arti “Ia telah naik” kalau bukan bahwa Ia juga telah turun ke bagian-bagian bumi yang lebih rendah?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke kawasan-kawasan yang lebih rendah, yaitu bumi.” Frasa ini mungkin hanya merujuk pada peristiwa Ia turun ke bumi, atau secara lebih khusus pada alam orang mati.
    reason: Mempertahankan ambiguitas sintaksis dan teologis frasa Yunani.
lexical_decisions:
- source_word: Ἀνέβη
  choice: Ia telah naik
  rationale: Bentuk aoris ἀναβαίνω menggemakan kutipan sebelumnya dan mempertahankan gambaran gerak vertikal; bentuk perfektif Indonesia terdengar wajar dalam pertanyaan tentang makna peristiwa itu.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: Apakah arti … kalau bukan bahwa
  rationale: Ungkapan ini menarik kesimpulan dari kata yang dikutip. Rumusan Indonesia ini alami sekaligus mempertahankan daya argumentatifnya.
- source_word: καὶ κατέβη
  choice: Ia juga telah turun
  rationale: Kata καί bersifat aditif dan diterjemahkan dengan “juga”; “turun” mempertahankan kesejajaran dengan “naik”.
- source_word: εἰς
  choice: ke
  rationale: Dalam bahasa Indonesia, “turun ke” secara alami menyatakan gerak menuju atau memasuki suatu tempat tanpa memaksakan tafsiran lokatif yang lebih khusus.
- source_word: τὰ κατώτερα μέρη
  choice: bagian-bagian … yang lebih rendah
  rationale: κατώτερα bersifat komparatif dan μέρη berarti bagian atau kawasan. Terjemahan ini mempertahankan bentuk komparatif dan tidak langsung menafsirkannya sebagai alam orang mati.
- source_word: τῆς γῆς
  choice: bumi
  rationale: γῆ di sini paling sesuai diterjemahkan “bumi” dalam kontras kosmis naik-turun. Susunan frasa tetap membuka kemungkinan genitif partitif maupun penjelas.
theological_decisions:
- issue: Penafsiran εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: ke bagian-bagian bumi yang lebih rendah
  alternative: ke kawasan-kawasan yang lebih rendah, yaitu bumi; atau secara lebih khusus, ke alam orang mati
  rationale: Bahasa Yunani memungkinkan frasa itu dipahami sebagai bagian-bagian bumi yang lebih rendah atau sebagai kawasan lebih rendah yang dijelaskan sebagai bumi. Teks utama tidak menetapkan penafsiran doktrinal tertentu, sedangkan catatan kaki menyampaikan kemungkinan-kemungkinan utamanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Ia” mengikuti kebiasaan umum teks Alkitab Indonesia untuk rujukan kepada Kristus. Tanda kutip menandai kata dari kutipan sebelumnya; tanpa penambahan penanda wacana yang tidak terdapat dalam sumber.
