  text: and do not give place to the devil[a].
translation:
  language: id
  text: dan janganlah memberi kesempatan kepada Iblis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah memberi tempat kepada Iblis.” Kata Yunani yang diterjemahkan “kesempatan” juga dapat berarti “tempat” atau “ruang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: dan janganlah
  rationale: Dalam konteksnya, kata penghubung ini meneruskan rangkaian nasihat sebelumnya. “Dan janganlah” mempertahankan hubungan itu sekaligus menyampaikan larangan secara wajar dalam bahasa Indonesia.
- source_word: δίδοτε
  choice: memberi
  rationale: Bentuk imperatif dari δίδωμι secara langsung berarti “memberi”; pilihan ini juga mempertahankan ungkapan sumber tanpa menggantinya dengan verba yang lebih interpretatif seperti “membiarkan”.
- source_word: τόπον
  choice: kesempatan
  rationale: Arti dasarnya ialah “tempat”, tetapi dalam ungkapan ini kata tersebut menunjuk pada ruang atau peluang untuk bertindak. “Kesempatan” menyampaikan maksud itu dengan jelas dalam bahasa Indonesia modern, sedangkan arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: τῷ διαβόλῳ
  choice: kepada Iblis
  rationale: Dengan artikel dan dalam konteks ini, διάβολος merupakan sebutan bagi pribadi jahat, bukan sekadar kata umum “pemfitnah”. “Iblis” adalah padanan baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah διάβολος harus diterjemahkan sebagai kata benda umum “pemfitnah” atau sebagai sebutan bagi pribadi jahat, “Iblis”
  choice: Iblis
  alternative: pemfitnah
  rationale: Dalam nasihat Paulus, ungkapan ini paling mungkin merujuk kepada sang lawan pribadi. “Iblis” menyatakan rujukan itu tanpa menambahkan penjelasan teologis yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada nasihat. Partikel “-lah” mempertahankan nada larangan yang tegas namun wajar. Huruf kapital pada “Iblis” menandai pemakaiannya sebagai sebutan pribadi.
