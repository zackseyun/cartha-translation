id: EPH.4.2
reference: Ephesians 4:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: id
  text: dengan segala kerendahan hati dan kelemahlembutan, dengan kesabaran, saling menanggung dalam kasih,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: dengan segala
  rationale: μετά dengan genitif menyatakan penyertaan atau cara, sedangkan πάσης memberi penekanan menyeluruh. “Dengan segala” mempertahankan bentuk dan daya ungkap sumber secara wajar dalam bahasa Indonesia.
- source_word: ταπεινοφροσύνης
  choice: kerendahan hati
  rationale: Nomina ini menunjuk pada sikap rendah hati atau kerendahan pikiran. “Kerendahan hati” adalah padanan baku, alami, dan jelas dalam bahasa Indonesia modern.
- source_word: πραΰτητος
  choice: kelemahlembutan
  rationale: Istilah ini menyatakan kelembutan yang terkendali, bukan kelemahan. “Kelemahlembutan” merupakan padanan etis yang bermartabat dan lazim dalam konteks ini.
- source_word: μακροθυμίας
  choice: kesabaran
  rationale: Kata ini menunjuk pada ketahanan dalam menghadapi orang lain dan kelambanan untuk marah. “Kesabaran” menyampaikan makna tersebut secara alami tanpa ungkapan arkais.
- source_word: ἀνεχόμενοι
  choice: saling menanggung
  rationale: Partisipel kini ini menggambarkan tindakan terus-menerus untuk bertahan menghadapi atau menerima kekurangan sesama. Bersama ἀλλήλων, “saling menanggung” mempertahankan sifat timbal balik dan bobot relasionalnya.
- source_word: ἀλλήλων
  choice: saling
  rationale: Pronomina timbal balik ini secara alami menyatu dengan verba dalam konstruksi bahasa Indonesia “saling menanggung”.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: ἐν dengan datif dapat menunjukkan lingkup atau cara tindakan. “Dalam kasih” mempertahankan ungkapan sumber dan membiarkan kedua nuansa itu tetap terbuka.
theological_decisions:
- issue: Padanan ἀγάπη
  choice: kasih
  alternative: cinta
  rationale: “Kasih” merupakan padanan yang alami dan bermartabat dalam wacana etis-relasional Alkitab, sedangkan “cinta” dalam pemakaian modern dapat lebih mudah diasosiasikan dengan cinta romantis. Pilihan ini tidak mempersempit kasih kepada suatu pengertian denominatif.
- issue: Hubungan ἐν ἀγάπῃ dengan tindakan saling menanggung
  choice: dalam kasih
  alternative: dengan kasih
  rationale: “Dalam kasih” mempertahankan kemungkinan bahwa kasih adalah lingkup sekaligus cara saling menanggung, alih-alih membatasi frasa itu hanya sebagai keterangan cara.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur paralel “dengan ... dengan ...” dipertahankan untuk mencerminkan susunan Yunani. Koma akhir dipertahankan karena ayat ini merupakan bagian dari kalimat yang berlanjut.
