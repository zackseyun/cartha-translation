id: EPH.4.25
reference: Ephesians 4:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: id
  text: Karena itu, setelah membuang kepalsuan[a], hendaklah masing-masing berkata benar kepada sesamanya, sebab kita adalah anggota satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dusta.”
    reason: Alternatif leksikal untuk τὸ ψεῦδος. Bentuk tunggal berartikel dapat dipahami sebagai dusta secara umum atau sebagai kategori etis; bahasa Indonesia tidak perlu menyatakan artikelnya dengan “itu”.
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari nasihat sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya inferensialnya.
- source_word: ἀποθέμενοι
  choice: setelah membuang
  rationale: Partisip aoris ini menyatakan penanggalan atau penolakan yang mendahului dan menyertai perintah utama; 'setelah membuang' mempertahankan nuansa tindakan yang telah diambil.
- source_word: τὸ ψεῦδος
  choice: kepalsuan
  rationale: Bentuk tunggal berartikel dapat menunjuk pada kepalsuan atau dusta sebagai kategori etis, bukan hanya satu kebohongan tertentu. Kemungkinan formal 'dusta itu' dipertahankan dalam catatan kaki.
- source_word: λαλεῖτε ἀλήθειαν
  choice: hendaklah ... berkata benar
  rationale: Imperatif kini menyampaikan perintah yang berlaku terus; 'berkata benar' alami dalam bahasa Indonesia dan mempertahankan kontras dengan kepalsuan.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Menyampaikan daya distributif bagi setiap orang dalam jemaat tanpa menambahkan pembatasan gender yang tidak diperlukan dalam bahasa Indonesia.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: kepada sesamanya
  rationale: Walau μετά dengan genitif secara harfiah berarti 'dengan', dalam konteks tindakan berbicara bahasa Indonesia secara alami memakai 'kepada'. 'Sesamanya' menyampaikan makna sosial-etis πλησίον dan tetap bersifat inklusif.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah dengan konjungsi kausal yang jelas dan bermartabat.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: kita adalah anggota yang seorang dari yang lain
  rationale: Mempertahankan metafora tubuh dan ungkapan timbal balik Yunani, termasuk ketegangan semantis bahwa orang percaya bukan sekadar anggota satu tubuh, melainkan dalam suatu arti merupakan anggota satu sama lain.
theological_decisions:
- issue: Cakupan τὸ ψεῦδος
  choice: kepalsuan
  alternative: dusta itu
  rationale: Konteks nasihat etis mendukung pengertian umum tentang kepalsuan atau kebiasaan berdusta. Namun, artikel Yunani memungkinkan terjemahan lebih formal 'dusta itu', sehingga alternatif itu dicatat.
- issue: Metafora timbal balik ἀλλήλων μέλη
  choice: anggota yang seorang dari yang lain
  alternative: anggota satu sama lain; bagian dari satu sama lain
  rationale: Terjemahan ini menjaga metafora tubuh sekaligus relasi timbal balik yang dinyatakan teks, tanpa menafsirkannya hanya sebagai keanggotaan dalam gereja atau sekadar rasa memiliki.
- issue: Bahasa distributif dan gender
  choice: masing-masing ... sesamanya
  alternative: setiap orang ... sesamanya
  rationale: Bahasa Indonesia tidak mengharuskan pronomina maskulin untuk menyampaikan bentuk generik Yunani. Pilihan ini mencakup seluruh jemaat tanpa mengubah daya distributif ἕκαστος.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan hubungan logis, perintah distributif, dan metafora tubuh dalam teks Yunani.
