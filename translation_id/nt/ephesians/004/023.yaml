  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh Roh dalam pikiran kalian.” Frasa ini lebih mungkin menunjuk pada disposisi atau orientasi batin dari pikiran kalian daripada langsung kepada Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: supaya kalian diperbarui
  rationale: Infinitif kini pasif dipertahankan sebagai tindakan yang dialami, bukan tindakan refleksif aktif. Dalam bahasa Indonesia, 'diperbarui' alami dan dapat menyiratkan proses yang berkelanjutan tanpa menambahkannya secara eksplisit.
- source_word: δὲ
  choice: dan
  rationale: δέ di sini merupakan penghubung ringan dalam rangkaian infinitif, bukan pertentangan yang kuat.
- source_word: τῷ πνεύματι
  choice: dalam roh
  rationale: Datif paling wajar dipahami sebagai lingkup atau segi tempat pembaruan berlangsung. Huruf kecil mempertahankan pembacaan utama sebagai disposisi batin, tanpa menutup kemungkinan alternatif.
- source_word: νοὸς
  choice: pikiran
  rationale: νοῦς menunjuk pada pikiran atau daya memahami; 'pikiran' merupakan padanan langsung dan wajar.
- source_word: ὑμῶν
  choice: kalian
  rationale: Bentuk orang kedua jamak dibuat eksplisit dengan 'kalian', sesuai bahasa Indonesia modern.
theological_decisions:
- issue: Apakah πνεύματι menunjuk kepada Roh Kudus atau roh/disposisi batin manusia
  choice: roh atau disposisi batin dari pikiran kalian
  alternative: oleh Roh yang memperbarui pikiran kalian
  rationale: Genitif τοῦ νοὸς ὑμῶν paling alami menerangkan πνεύματι dan menghasilkan ungkapan antropologis. Catatan kaki mempertahankan kemungkinan rujukan kepada Roh Kudus tanpa memasukkannya secara pasti ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμῶν secara jelas. Susunan 'roh pikiran kalian' sengaja mempertahankan ungkapan sumber yang padat dan agak ambigu.
