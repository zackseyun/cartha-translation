  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: id
  text: dengan sungguh-sungguh berusaha memelihara kesatuan Roh[a] dalam ikatan damai sejahtera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Roh” kemungkinan besar menunjuk kepada Roh Kudus, meskipun ada yang memahaminya secara lebih umum sebagai roh atau sikap bersama di antara orang percaya.
    reason: alternative_reading
  - marker: b
    text: Frasa “ikatan damai sejahtera” dapat dipahami sebagai ikatan yang berupa atau dihasilkan oleh damai sejahtera; ungkapan Yunaninya tidak menjelaskan hubungan itu secara lebih khusus.
    reason: genuine_ambiguity
lexical_decisions:
- source_word: σπουδάζοντες
  choice: dengan sungguh-sungguh berusaha
  rationale: Partisipel kini ini meneruskan alur nasihat ayat 1–2 dan menyatakan ketekunan serta upaya aktif, bukan sekadar keinginan.
- source_word: τηρεῖν
  choice: memelihara
  rationale: Kata ini berarti menjaga atau mempertahankan sesuatu yang sudah ada; 'memelihara' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa kesatuan itu harus diciptakan.
- source_word: τὴν ἑνότητα
  choice: kesatuan
  rationale: Padanan baku dan jelas untuk ἑνότης dalam konteks kehidupan bersama umat.
- source_word: τοῦ πνεύματος
  choice: yang berasal dari Roh
  rationale: Genitif ini paling wajar menunjuk kepada Roh Kudus dan dapat menyatakan sumber kesatuan. Bentuk ini lebih alami daripada 'kesatuan Roh' sekaligus menghindari kesan bahwa Roh sendiri dibagi atau disatukan.
- source_word: ἐν τῷ συνδέσμῳ
  choice: dalam ikatan
  rationale: Mempertahankan metafora sesuatu yang mengikat bersama; ἐν diterjemahkan secara langsung sebagai 'dalam' tanpa menutup kemungkinan nuansa sarana atau lingkungan.
- source_word: τῆς εἰρήνης
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang lazim dan bermartabat untuk εἰρήνη, mencakup perdamaian relasional dan keadaan utuh, bukan hanya ketiadaan konflik.
theological_decisions:
- issue: Rujukan πνεύματος
  choice: Roh Kudus
  alternative: roh atau sikap bersama di antara orang percaya
  rationale: Pemakaian πνεῦμα dalam konteks dekat Efesus, khususnya 4:4 dan 4:30, kuat menunjuk kepada Roh Kudus. Huruf kapital menandai pilihan kontekstual ini, sementara catatan kaki mempertahankan kemungkinan alternatif.
- issue: Sifat kesatuan
  choice: kesatuan yang sudah ada dan harus dipelihara
  alternative: kesatuan yang harus diciptakan orang percaya
  rationale: τηρεῖν menyatakan menjaga atau mempertahankan, sehingga nas ini tidak memerintahkan penciptaan kesatuan dari awal.
- issue: Hubungan genitif τοῦ πνεύματος
  choice: Roh sebagai sumber kesatuan
  alternative: kesatuan yang menjadi ciri Roh atau dimiliki Roh
  rationale: Ungkapan 'yang berasal dari Roh' menyampaikan kemungkinan paling wajar dalam konteks, tetapi tidak memperluasnya menjadi uraian doktrinal yang tidak dinyatakan ayat ini.
- issue: Hubungan 'ikatan' dan 'damai sejahtera'
  choice: damai sejahtera sebagai ikatan yang menyatukan
  alternative: ikatan yang menghasilkan damai sejahtera
  rationale: Genitif Yunani ringkas dan dapat dipahami lebih dari satu cara. Teks utama mempertahankan bentuk metaforis, sedangkan catatan kaki menunjukkan kemungkinan hubungan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Dengan sungguh-sungguh berusaha' mempertahankan daya nasihat tanpa terasa kaku; 'memelihara' menegaskan keberlanjutan; metafora 'ikatan' dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
