  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: id
  text: Karena itu, aku, seorang tahanan dalam Tuhan,[a] mendesak kalian untuk hidup secara layak bagi panggilan yang telah kalian terima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tahanan Tuhan” atau “seorang tahanan karena Tuhan.”
    reason: alternative_reading
  - marker: b
    text: Atau, “menjalani hidup dengan cara yang layak bagi panggilan yang telah kalian terima”; secara harfiah, “berjalan” dipakai sebagai gambaran cara hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: mendesak
  rationale: Kata ini menyampaikan seruan pastoral yang kuat. “Mendesak” lebih tegas daripada “meminta” dan tetap alami dalam bahasa Indonesia modern.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari uraian sebelumnya dan mempertahankan hubungan logis dengan bagian terdahulu.
- source_word: δέσμιος
  choice: orang yang dipenjarakan
  rationale: Mengungkapkan keadaan Paulus sebagai tahanan secara jelas dan alami; bentuk ini juga memungkinkan frasa berikutnya tetap melekat tanpa menjadikannya gelar kepunyaan.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus dan tidak mempersempit relasinya menjadi semata-mata sebab (“karena Tuhan”) atau tujuan (“demi Tuhan”).
- source_word: ἀξίως
  choice: yang sepadan dengan
  rationale: Mengungkapkan gagasan tentang cara hidup yang sesuai atau layak bagi panggilan, dengan susunan yang wajar bagi pembaca Indonesia.
- source_word: περιπατῆσαι
  choice: menjalani hidup
  rationale: Dalam konteks ini, metafora berjalan menunjuk pada perilaku atau cara hidup. “Menjalani hidup” terdengar alami sambil masih menyisakan citra perjalanan hidup; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: κλήσεως
  choice: panggilan
  rationale: Merupakan padanan baku dan tepat bagi panggilan ilahi dalam pemakaian Paulus, tanpa mempersempitnya menjadi sekadar undangan.
- source_word: ἧς ἐκλήθητε
  choice: yang telah kalian terima
  rationale: Menghindari pengulangan Indonesia yang kaku seperti “panggilan yang dengannya kalian dipanggil,” tetapi tetap menyatakan bahwa mereka adalah penerima panggilan tersebut. Bentuk pasif yang lebih dekat dengan Yunani dicatat sebagai alternatif.
theological_decisions:
- issue: Makna ὁ δέσμιος ἐν κυρίῳ dalam penyebutan diri Paulus
  choice: orang yang dipenjarakan dalam Tuhan
  alternative: tahanan Tuhan; orang yang dipenjarakan karena Tuhan
  rationale: Terjemahan utama mempertahankan frasa preposisional Yunani dan keluasan relasi antara pemenjaraan Paulus dan Tuhan, tanpa menetapkannya secara khusus sebagai kepunyaan atau sebab.
- issue: Metafora περιπατέω bagi kehidupan orang percaya
  choice: menjalani hidup
  alternative: berjalan; hidup
  rationale: Pilihan utama menyampaikan makna etis idiom tersebut secara alami. Catatan kaki mempertahankan akses pembaca kepada metafora berjalan yang terdapat dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Susunan kalimat dibuat alami tanpa menghapus hubungan logis, kekuatan seruan, atau ambiguitas teologis frasa “dalam Tuhan.”
