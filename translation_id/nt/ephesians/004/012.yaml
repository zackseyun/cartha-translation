translation:
  language: id
  text: untuk memperlengkapi orang-orang kudus bagi pekerjaan pelayanan,[a] bagi pembangunan tubuh Mesias.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pekerjaan pengabdian.” Kata Yunani διακονία dapat berarti “pelayanan” atau tindakan mengabdi dan melayani.
    reason: lexical_alternative
  - marker: b
    text: Atau “tubuh Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” dalam teks utama untuk mempertahankan maknanya sebagai gelar.
    reason: alternative_reading
  - marker: c
    text: 'Susunan Yunaninya juga dapat dipahami secara progresif: “untuk memperlengkapi orang-orang kudus bagi pekerjaan pelayanan, untuk pembangunan tubuh Mesias.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: untuk memperlengkapi
  rationale: Frasa ini menyatakan tujuan, sedangkan καταρτισμός menunjuk pada tindakan mempersiapkan atau membuat orang sanggup menjalankan tugas. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada nomina abstrak seperti “perlengkapan”.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Ungkapan ini mempertahankan istilah Paulus bagi orang-orang yang dikhususkan bagi Allah dan tidak membatasinya pada tokoh yang kemudian secara resmi dinyatakan kudus.
- source_word: εἰς ἔργον διακονίας
  choice: bagi pekerjaan pelayanan
  rationale: “Pelayanan” mencakup tindakan melayani dalam komunitas dan tidak dengan sendirinya membatasi pekerjaan itu pada pejabat gerejawi. Bentuk tunggal “pekerjaan” mencerminkan ἔργον.
- source_word: εἰς οἰκοδομὴν
  choice: bagi pembangunan
  rationale: οἰκοδομή memakai gambaran pembangunan secara metaforis bagi pertumbuhan dan penguatan komunitas. “Pembangunan” mempertahankan metafora itu dengan bahasa Indonesia yang wajar.
- source_word: τοῦ σώματος τοῦ Χριστοῦ
  choice: tubuh Mesias
  rationale: “Tubuh” mempertahankan metafora korporat Paulus, sedangkan Χριστός diterjemahkan “Mesias” untuk menampilkan fungsi gelarnya dalam frasa ini.
theological_decisions:
- issue: Hubungan sintaksis ketiga frasa tujuan
  choice: 'Ketiga frasa dipertahankan sebagai rangkaian tujuan: untuk memperlengkapi orang-orang kudus, bagi pekerjaan pelayanan, dan bagi pembangunan tubuh Mesias.'
  alternative: 'Ayat ini dapat dipahami sebagai urutan: orang-orang kudus diperlengkapi untuk pekerjaan pelayanan, dan pelayanan itu membangun tubuh Mesias.'
  rationale: Rangkaian Yunani πρός … εἰς … εἰς memungkinkan pembacaan sejajar maupun progresif. Teks utama mengikuti bentuk rangkaiannya tanpa menetapkan secara mutlak siapa yang melakukan seluruh pelayanan; catatan kaki mempertahankan pembacaan progresif.
- issue: Pemadanan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yesus. “Mesias” menyatakan makna gelar tersebut, sementara bentuk tradisional “Kristus” dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Memperlengkapi” serta “pembangunan” mempertahankan gagasan persiapan dan metafora konstruksi tanpa memakai istilah teknis yang sukar. Tanda koma menjaga kesinambungan ayat dengan konteks sebelumnya.
