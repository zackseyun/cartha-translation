  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: id
  text: Segala kepahitan, kemurkaan, kemarahan, teriakan, dan ucapan yang menghina hendaklah disingkirkan dari kalian, bersama dengan segala niat jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "fitnah"; secara tradisional "hujatan". Dalam konteks ini, kata Yunaninya kemungkinan besar mengacu pada ucapan yang merusak atau menyakiti orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: segala kepahitan
  rationale: Menjaga cakupan menyeluruh πᾶσα dan memakai padanan lazim bagi sikap batin berupa kepahitan atau kebencian yang mengendap.
- source_word: θυμός
  choice: kemurkaan
  rationale: Menggambarkan gejolak amarah yang kuat dan membedakannya dari ὀργή, tanpa harus menambahkan gagasan 'ledakan' yang tidak dinyatakan secara eksplisit.
- source_word: ὀργή
  choice: kemarahan
  rationale: Padanan Indonesia yang alami untuk amarah, sekaligus membedakannya secara leksikal dari θυμός.
- source_word: κραυγή
  choice: pertengkaran yang gaduh
  rationale: Dalam daftar sifat buruk antarmanusia ini, kata tersebut menunjuk pada teriakan atau kegaduhan verbal yang bermusuhan; ungkapan ini lebih jelas daripada sekadar 'teriakan', yang dapat bersifat netral.
- source_word: βλασφημία
  choice: fitnah
  rationale: Dalam konteks etika hubungan antarmanusia, kata ini paling mungkin berarti ucapan yang merusak nama atau menyakiti orang lain, bukan penghujatan yang secara khusus ditujukan kepada Allah.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: buanglah dari antara kalian
  rationale: Imperatif aktif yang alami dalam bahasa Indonesia menyampaikan tuntutan tegas agar semua sifat dan perilaku itu disingkirkan dari kehidupan pribadi maupun persekutuan; 'dari antara kalian' mempertahankan kemungkinan nuansa komunal.
- source_word: σὺν πάσῃ κακίᾳ
  choice: bersama dengan segala niat jahat
  rationale: κακία di sini paling wajar menunjuk pada kebusukan hati atau maksud mencelakakan, sedangkan σύν mempertahankan gagasan bahwa semuanya harus disingkirkan bersama-sama.
theological_decisions:
- issue: Makna βλασφημία dalam daftar sifat buruk etis
  choice: fitnah sebagai ucapan merusak terhadap sesama
  alternative: ucapan kasar; hujatan
  rationale: Konteks langsung membicarakan sikap dan tuturan yang merusak hubungan dalam komunitas. Namun, rentang makna yang lebih luas dicatat agar kemungkinan 'ucapan kasar' dan terjemahan tradisional 'hujatan' tidak dihapus.
- issue: Daya imperatif pasif ἀρθήτω
  choice: imperatif langsung 'buanglah'
  alternative: '''hendaklah ... disingkirkan'''
  rationale: Bahasa Indonesia lebih alami memakai perintah aktif dengan pelaku yang tersirat, sedangkan tuntutan penghapusan total tetap dipertahankan tanpa menentukan secara teologis siapa agen di balik penyingkiran itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Sapaan jamak 'kalian' dipakai untuk menyatakan ὑμῶν secara jelas. Rangkaian nomina dipertahankan, tetapi imperatif pasif Yunani dialihkan menjadi perintah aktif yang lebih alami dalam bahasa Indonesia.
