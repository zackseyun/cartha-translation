  naturalness: Kalimat draf umumnya wajar, tetapi “sesuai dengan daya kerja dalam ukuran masing-masing bagiannya” terasa tidak idiomatis dan cakupan “masing-masing” kurang jelas. “Sesuai dengan kerja setiap bagian menurut ukurannya” lebih alami sambil mempertahankan kedua unsur Yunani, ἐνέργεια dan μέτρον.
  terminology: “Tubuh,” “kasih,” dan penyebutan Kristus secara personal sudah tepat. “Sendi yang menyalurkan dukungan” mempertahankan metafora tubuh dan unsur pasokan/dukungan dalam τῆς ἐπιχορηγίας tanpa secara berlebihan menetapkan bahwa ἁφή berarti urat atau ligamen.
