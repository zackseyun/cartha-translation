  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: id
  text: Dari Dialah seluruh tubuh, yang tersusun dan dipersatukan melalui setiap sendi yang menyalurkan dukungan,[a] menghasilkan pertumbuhan tubuh sesuai dengan kerja setiap bagian menurut ukurannya, untuk membangun dirinya sendiri dalam kasih.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunaninya juga dapat diterjemahkan “melalui setiap sendi penyedia,” “melalui setiap urat penopang,” atau “melalui setiap hubungan yang memberi pasokan.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah, bagian tengah ayat ini berbunyi: “menghasilkan pertumbuhan tubuh sesuai dengan kerja dalam ukuran setiap bagian.”'
    reason: preserve_syntax_and_agency
lexical_decisions:
- source_word: ἐξ οὗ
  choice: Dari Dialah
  rationale: Antesedennya dalam ayat 15 adalah Kristus; bentuk personal dipertahankan dan partikel penegas -lah menandai Dia sebagai sumber.
- source_word: πᾶν τὸ σῶμα
  choice: seluruh tubuh
  rationale: Ungkapan kolektif tunggal ini paling alami diterjemahkan 'seluruh tubuh'.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: yang tersusun dan terikat menjadi satu
  rationale: Terjemahan ini mempertahankan dua unsur, yaitu bagian-bagian yang dipasang secara terpadu dan dipersatukan secara erat, serta nuansa pasif kedua participle.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: melalui setiap sendi yang memberi dukungan
  rationale: ἁφή mempertahankan gambaran tubuh berupa sendi atau titik penghubung, sedangkan ἐπιχορηγία menyatakan dukungan atau pasokan yang diberikan.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: sesuai dengan daya kerja dalam ukuran masing-masing bagiannya
  rationale: Rumusan ini mempertahankan gagasan aktivitas atau daya kerja yang berlangsung menurut ukuran tiap-tiap bagian tanpa menambahkan penilaian 'tepat' yang tidak dinyatakan secara eksplisit.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: bertumbuh
  rationale: Secara idiomatis frasa ini berarti tubuh menghasilkan atau menyebabkan pertumbuhannya sendiri. Bahasa Indonesia alami dapat menyatakannya dengan 'bertumbuh', sementara agensi refleksif tubuh tetap tampak dari subjek kalimat dan klausa berikutnya.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: sehingga membangun dirinya
  rationale: Menyampaikan tujuan atau hasil pertumbuhan dan mempertahankan daya refleksif ἑαυτοῦ.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Padanan baku dan kontekstual bagi ἀγάπη, tanpa mempersempit jenis kasih secara denominatif.
theological_decisions:
- issue: Sumber dan pelaku pertumbuhan tubuh
  choice: Kristus dinyatakan sebagai sumber, sedangkan seluruh tubuh bertumbuh melalui kerja setiap bagiannya.
  alternative: Menerjemahkan ἐξ οὗ secara impersonal sebagai 'dari mana/darinya', atau menjadikan Kristus secara langsung satu-satunya subjek gramatikal tindakan pertumbuhan.
  rationale: Konteks ayat 15 menunjuk kepada Kristus sebagai anteseden personal, sementara subjek ποιεῖται adalah seluruh tubuh. Terjemahan mempertahankan kedua sisi tersebut.
- issue: Gambaran ἁφῆς τῆς ἐπιχορηγίας
  choice: Gambaran tubuh dipertahankan sebagai 'sendi yang memberi dukungan'.
  alternative: Menggunakan 'urat penopang', 'hubungan yang memasok', atau ungkapan abstrak 'setiap hubungan'.
  rationale: Kata-katanya memungkinkan nuansa sendi, ikatan, atau titik hubungan yang menyalurkan dukungan. Teks utama mempertahankan metafora tubuh, sedangkan catatan menjaga keluasan maknanya.
- issue: Hubungan sintaksis frasa ukuran dan daya kerja
  choice: Frasa itu dihubungkan dengan pertumbuhan seluruh tubuh yang terjadi sesuai daya kerja terukur dari tiap bagian.
  alternative: Menghubungkannya terutama dengan sendi-sendi pendukung atau menerjemahkan 'dengan kerja yang tepat dari setiap bagian'.
  rationale: Susunan Yunani cukup padat dan dapat dipetakan dengan cara berbeda. Terjemahan tidak menambahkan kata evaluatif 'tepat', tetapi mempertahankan gagasan ukuran yang dimiliki masing-masing bagian.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat dibuat terbaca tanpa menghilangkan metafora tubuh, sumber pertumbuhan dalam Kristus, peran setiap bagian, atau kepadatan sintaksis frasa Yunani mengenai daya kerja dan ukuran.
