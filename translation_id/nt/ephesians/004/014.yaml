id: EPH.4.14
reference: Ephesians 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: id
  text: supaya kita tidak lagi menjadi anak-anak, diombang-ambingkan oleh gelombang dan dibawa ke sana kemari oleh setiap angin pengajaran, oleh tipu daya manusia[a] dan oleh kelicikan yang mengarah pada siasat penyesatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam permainan dadu manusia”; permainan dadu menjadi gambaran kecurangan atau tipu daya.
    reason: cultural_note
  - marker: b
    text: Atau, “oleh kelicikan dalam siasat kesesatan.” Frasa Yunani dapat menekankan arah menuju rancangan penyesatan atau kelicikan yang bekerja di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν νήπιοι
  choice: supaya kita tidak lagi menjadi anak-anak
  rationale: “Supaya” mempertahankan daya tujuan/hasil ἵνα dengan bentuk subjungtif, sedangkan “tidak lagi” menyampaikan μηκέτι. “Anak-anak” mengungkapkan metafora ketidakdewasaan secara wajar tanpa mempersempitnya menjadi bayi.
- source_word: κλυδωνιζόμενοι
  choice: diombang-ambingkan oleh gelombang
  rationale: Mempertahankan bentuk pasif dan citra bahari tentang orang yang dipermainkan gelombang.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: dibawa ke sana kemari oleh setiap angin pengajaran
  rationale: Ungkapan ini mempertahankan gerak pasif dari satu arah ke arah lain serta metafora angin; διδασκαλία diterjemahkan secara umum sebagai “pengajaran”, bukan istilah teknis yang lebih sempit.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: oleh tipu daya manusia
  rationale: κυβεία secara harfiah berkaitan dengan permainan dadu dan secara kiasan menunjuk pada kecurangan atau tipu muslihat. Terjemahan ini menyampaikan makna idiomatisnya dalam bahasa Indonesia alami.
- source_word: ἐν πανουργίᾳ
  choice: oleh kelicikan
  rationale: πανουργία menyatakan kecerdikan yang tidak bermoral atau licik; “kelicikan” mempertahankan penilaian negatif tersebut.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: yang mengarah pada siasat penyesatan
  rationale: “Mengarah pada” mempertahankan arah/tujuan yang dapat dinyatakan oleh πρός. “Siasat” menyampaikan metode atau rancangan terencana, sementara “penyesatan” mempertahankan kemungkinan makna πλάνη sebagai kesalahan sekaligus tindakan atau daya yang menyesatkan.
theological_decisions:
- issue: Makna διδασκαλία
  choice: pengajaran
  alternative: ajaran; doktrin
  rationale: “Pengajaran” cukup luas untuk mencakup isi maupun tindakan mengajar dan tidak membatasi peringatan ini hanya pada rumusan doktrin formal.
- issue: Hubungan πανουργία dengan μεθοδεία dan makna πλάνη
  choice: kelicikan yang mengarah pada siasat penyesatan
  alternative: kelicikan dalam siasat kesesatan
  rationale: Teks Yunani padat dan dapat dipahami sebagai kelicikan yang diarahkan kepada suatu rancangan penyesatan, atau kelicikan yang bekerja di dalam rancangan itu. Pilihan utama mempertahankan daya arah πρός tanpa memastikan apakah πλάνη terutama berarti keadaan salah atau tindakan menipu; catatan kaki mencatat ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Metafora gelombang dan angin dipertahankan, sedangkan idiom permainan dadu dialihkan ke makna alaminya dalam teks utama dan dijelaskan di catatan kaki. Semua penanda catatan kaki muncul pada teks utama.
