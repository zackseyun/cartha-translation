  source_fidelity: Terjemahan mempertahankan rangkaian tujuan ἵνα μηκέτι ὦμεν, metafora ketidakdewasaan νήπιοι, serta dua citra pasif—diombang-ambingkan gelombang dan dibawa oleh angin pengajaran. “Tipu daya manusia” menyampaikan makna kiasan κυβεία dengan tepat, dan “kelicikan yang mengarah pada siasat penyesatan” merupakan representasi yang dapat dipertanggungjawabkan bagi konstruksi sulit ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης tanpa memaksakan satu pembacaan semantis atas πλάνη.
