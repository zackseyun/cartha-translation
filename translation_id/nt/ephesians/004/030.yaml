  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: id
  text: Dan janganlah kamu mendukakan Roh Kudus Allah, yang di dalam Dia kamu telah dimeteraikan untuk hari penebusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai hari penebusan.” Bahasa Yunani memakai “untuk hari penebusan” (εἰς ἡμέραν ἀπολυτρώσεως), yang juga dapat dipahami dalam arti berorientasi ke masa depan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: mendukakan
  rationale: Bentuk imperatif kini dengan μή menyatakan larangan. “Mendukakan” alami dalam bahasa Indonesia dan mempertahankan daya personal-relasional dari kata kerja λυπέω.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: Roh Kudus Allah
  rationale: Ungkapan ini mempertahankan sebutan “Roh Kudus” sekaligus genitif eksplisit “Allah” tanpa menambah kata yang tidak diperlukan.
- source_word: ἐν ᾧ
  choice: di dalam Dia
  rationale: Terjemahan ini mempertahankan preposisi ἐν dan rujukan personal kepada Roh Kudus. Huruf kapital pada “Dia” mengikuti kaidah Indonesia untuk pronomina yang merujuk kepada Allah.
- source_word: ἐσφραγίσθητε
  choice: kamu telah dimeteraikan
  rationale: Bentuk pasif aoristus orang kedua jamak diterjemahkan secara ringkas sambil mempertahankan metafora meterai; “telah” menandai tindakan yang sudah terjadi tanpa menguraikan mekanismenya.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: untuk hari penebusan
  rationale: “Untuk” mempertahankan arah atau tujuan yang lazim dinyatakan oleh εἰς. “Hari penebusan” dipahami definitif dari konteks meskipun tanpa artikel dalam bahasa Yunani.
theological_decisions:
- issue: Rujukan personal kepada Roh Kudus dalam klausa relatif
  choice: di dalam Dia
  alternative: di dalamnya; oleh-Nya
  rationale: Walaupun pronomina Yunani berjenis netral karena menyesuaikan diri dengan πνεῦμα, acuannya adalah Roh Kudus yang dapat didukakan. “Di dalam Dia” menjaga rujukan personal dan tidak mengubah ἐν menjadi pernyataan agen yang lebih interpretatif.
- issue: Hubungan pemeteraian dengan hari penebusan
  choice: untuk hari penebusan
  alternative: sampai hari penebusan
  rationale: Pilihan ini menjaga nuansa tujuan atau orientasi ke depan dari εἰς tanpa menetapkan kesimpulan doktrinal yang lebih khusus mengenai ketekunan atau sarana pemeteraian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dipecah menjadi dua agar hubungan antarklausa jelas dan alami. “Dimeteraikan” dipilih sebagai istilah Alkitabiah yang masih mudah dipahami serta mempertahankan metafora sumber.
