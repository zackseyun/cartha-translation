  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: id
  text: pengertian mereka digelapkan[a], dan mereka terasing dari kehidupan Allah[b][c] karena ketidaktahuan yang ada dalam diri mereka, karena kekerasan hati mereka[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pikiran mereka digelapkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “terputus dari kehidupan Allah.”'
    reason: lexical_alternative
  - marker: c
    text: “Kehidupan Allah” dapat berarti kehidupan yang menjadi milik Allah atau kehidupan yang berasal dari Allah.
    reason: alternative_reading
  - marker: d
    text: 'Atau: “ketidakpekaan hati mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: pengertian mereka digelapkan
  rationale: Bentuk perfektif pasif menggambarkan keadaan yang telah terbentuk dan masih berlangsung. Susunan ini menyampaikan makna pasif serta ranah kognitif secara wajar dalam bahasa Indonesia.
- source_word: διανοίᾳ
  choice: pengertian
  rationale: Kata ini dapat menunjuk pada pikiran, pemahaman, atau daya berpikir. 'Pengertian' cocok dengan datif yang menyatakan segi dalam hal apa mereka digelapkan.
- source_word: ἀπηλλοτριωμένοι
  choice: terasing
  rationale: Partisipel perfektif pasif menyatakan keadaan terpisah atau terputus. 'Terasing' mempertahankan nuansa relasional tanpa mempersempitnya menjadi pengecualian secara hukum.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: dari kehidupan Allah
  rationale: Ungkapan genitif dipertahankan agar tidak menutup kemungkinan bahwa yang dimaksud ialah kehidupan yang menjadi milik Allah atau kehidupan yang berasal dari Allah.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: karena ketidaktahuan yang ada dalam diri mereka
  rationale: διά dengan akusatif menyatakan sebab, sedangkan frasa partisipial menegaskan bahwa ketidaktahuan itu berada dalam diri mereka.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: karena kekerasan hati mereka
  rationale: πώρωσις menggambarkan kekerasan atau ketidakpekaan. 'Kekerasan hati' mempertahankan metafora yang dikenal dalam bahasa Alkitab dan bentuk Indonesia ini alami bagi rujukan jamak.
theological_decisions:
- issue: Makna 'kehidupan Allah'
  choice: Mempertahankan frasa 'kehidupan Allah' tanpa menentukan jenis relasi genitifnya.
  alternative: kehidupan yang berasal dari Allah; kehidupan milik Allah
  rationale: Bahasa Yunani memungkinkan nuansa kehidupan yang dimiliki Allah maupun kehidupan yang bersumber dari Allah. Terjemahan tidak seharusnya meniadakan ambiguitas yang nyata itu.
- issue: Bentuk tunggal 'hati' dengan pemilik jamak
  choice: hati mereka
  alternative: hati tiap-tiap orang; hati-hati mereka
  rationale: Bahasa Yunani memakai καρδίας dalam bentuk tunggal dengan kata ganti pemilik jamak. 'Hati mereka' alami dalam bahasa Indonesia dan tetap mencerminkan bentuk kolektif tunggal tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang lugas dan bermartabat. Struktur partisipial Yunani disesuaikan menjadi rangkaian klausa yang alami, sementara hubungan sebab ganda dan ambiguitas teologis utama tetap dipertahankan.
