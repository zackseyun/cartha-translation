id: EPH.4.10
reference: Ephesians 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: id
  text: Dia yang telah turun itu jugalah yang telah naik jauh melampaui segala langit[a], supaya Dia memenuhi segala sesuatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di atas segala langit.” Ungkapan ini dapat menekankan bahwa Dia ditinggikan mengatasi setiap ranah surgawi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “supaya Dia menggenapi segala sesuatu.” Kata kerja Yunani ini dalam konteks tertentu dapat berarti “menggenapi”, tetapi “memenuhi” lebih sesuai dengan konteks langsung di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Dia yang telah turun
  rationale: Partisip aoris dengan artikel berfungsi sebagai nomina. Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan rujukan kepada pribadi yang turun.
- source_word: αὐτός ἐστιν καὶ
  choice: itu jugalah
  rationale: Bentuk ini mempertahankan penekanan αὐτός pada identitas pribadi yang sama sekaligus menyatakan hubungan dengan tindakan naik.
- source_word: ὁ ἀναβὰς
  choice: yang telah naik
  rationale: Diterjemahkan sejajar dengan ὁ καταβὰς sebagai klausa relatif, sehingga kesejajaran turun-naik tetap jelas.
- source_word: ὑπεράνω
  choice: jauh melampaui
  rationale: Ungkapan ini menyampaikan makna berada jauh di atas sekaligus keunggulan, dengan bahasa Indonesia yang wajar dalam konteks pemuliaan.
- source_word: πάντων τῶν οὐρανῶν
  choice: segala langit
  rationale: Bentuk jamak Yunani dipertahankan dan πάντων diterjemahkan secara menyeluruh tanpa mempersempit ungkapan kosmologisnya.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini secara alami menyatakan tujuan dalam bahasa Indonesia.
- source_word: πληρώσῃ
  choice: Dia memenuhi
  rationale: Makna dasar 'memenuhi' paling sesuai dengan konteks dekat, sambil tetap memberi catatan tentang kemungkinan leksikal 'menggenapi'.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Terjemahan ini mempertahankan cakupan luas frasa netral jamak tanpa membatasinya pada manusia atau menafsirkannya secara eksplisit sebagai alam semesta.
theological_decisions:
- issue: Identitas pribadi yang turun dan naik
  choice: Menegaskan bahwa pribadi yang turun itu jugalah pribadi yang naik.
  alternative: Menyatakan kedua tindakan tanpa penekanan kuat pada identitas pelakunya.
  rationale: αὐτός yang emfatis dan pengulangan partisip berartikel menekankan bahwa pelaku kedua tindakan itu sama; terjemahan mempertahankan penekanan ini tanpa menambahkan penjelasan kristologis di luar ayat.
- issue: Cakupan τὰ πάντα
  choice: segala sesuatu
  alternative: semua orang; seluruh alam semesta
  rationale: Frasa Yunani sengaja luas. Terjemahan ini mempertahankan keluasan dan ketegangan teologisnya tanpa mempersempit atau memperluasnya secara tafsiran.
- issue: Makna tujuan πληρώσῃ
  choice: supaya Dia memenuhi
  alternative: supaya Dia menggenapi
  rationale: Dalam konteks ini, 'memenuhi' lebih mungkin menunjuk pada tindakan memenuhi segala sesuatu, tetapi kemungkinan leksikal 'menggenapi' tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Struktur paralel turun-naik serta penekanan pada identitas pribadi yang sama dipertahankan. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang relevan.
