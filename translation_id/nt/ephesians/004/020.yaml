  text: Namun, kalian tidak belajar mengenal Mesias dengan cara demikian,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, kalian tidak belajar mengenal Kristus dengan cara demikian.”
    reason: Mencatat padanan tradisional bagi Χριστός sebagai alternatif terhadap terjemahan gelar “Mesias”.
lexical_decisions:
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina orang kedua jamak ini menunjuk para pembaca dan dinyatakan secara eksplisit untuk mempertahankan penekanan serta kontras.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan dengan cara hidup bangsa-bangsa lain yang dijelaskan sebelumnya; 'Namun' menyampaikan daya adversatif itu secara alami.
- source_word: οὐχ οὕτως
  choice: bukan demikian
  rationale: Gabungan negasi dan οὕτως menunjuk pada cara atau pola yang baru saja diuraikan. 'Bukan demikian' ringkas, wajar, dan mempertahankan hubungan kontekstualnya.
- source_word: ἐμάθετε
  choice: belajar mengenal
  rationale: μανθάνω berarti 'belajar'. Karena objeknya adalah seorang pribadi, 'belajar mengenal' terdengar alami dalam bahasa Indonesia tanpa mengubahnya menjadi bentuk pasif 'diajari' atau sekadar 'mengenal'.
- source_word: τὸν Χριστόν
  choice: Mesias
  rationale: Χριστός mempertahankan makna gelarnya di sini. Bahasa Indonesia lazim memakai 'Mesias' tanpa artikel, dan ungkapan tersebut tidak ditambah dengan nama 'Yesus' yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Χριστόν sebagai gelar atau bentuk yang menyerupai nama
  choice: Mesias
  alternative: Kristus
  rationale: Konteks memungkinkan nuansa gelar yang merujuk kepada pribadi yang dipelajari dalam pemberitaan Injil. 'Mesias' mempertahankan makna gelar Χριστός, sementara catatan kaki mencatat padanan tradisional 'Kristus' tanpa menambahkan 'Yesus'.
- issue: Ungkapan tidak lazim ἐμάθετε τὸν Χριστόν
  choice: belajar mengenal Mesias
  alternative: belajar tentang Mesias
  rationale: Objek langsungnya adalah Mesias sendiri, bukan frasa 'tentang Mesias'. Terjemahan ini mempertahankan fokus pada pribadi sambil menghasilkan bahasa Indonesia yang dapat dipahami dan tidak menjelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμεῖς secara jelas. Susunan kalimat mempertahankan kontras dengan konteks sebelumnya dan ketegangan ungkapan bahwa seseorang 'belajar mengenal' Mesias.
