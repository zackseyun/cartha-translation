  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: id
  text: satu Allah dan Bapa bagi semua[a], yang di atas semua, melalui semua, dan di dalam semua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bapa semua orang” atau “Bapa segala sesuatu.” Kata “semua” yang berulang dalam ayat ini tidak disertai nomina yang membatasi cakupannya dalam bahasa Yunani.
    reason: lexical_alternative
  - marker: b
    text: Atau “di dalam setiap orang.” Sejumlah naskah berbunyi “di dalam kamu semua.”
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: satu
  rationale: 'Mempertahankan penekanan pada bilangan yang meneruskan rangkaian tema kesatuan dalam konteks: satu tubuh, satu Roh, satu Tuhan.'
- source_word: θεὸς
  choice: Allah
  rationale: Padanan baku dalam bahasa Indonesia untuk θεός ketika merujuk kepada Allah dalam konteks pengakuan iman.
- source_word: πατὴρ
  choice: Bapa
  rationale: Mempertahankan gelar ilahi yang bersifat pribadi dan relasional dalam ungkapan 'Allah dan Bapa'.
- source_word: πάντων
  choice: semua
  rationale: Bentuk Yunani tidak menyebutkan nomina yang diterangkan; 'semua' mempertahankan keluasan dan ketidakpastian apakah yang dimaksud terutama semua orang atau segala sesuatu.
- source_word: ὁ
  choice: yang
  rationale: Artikel ini memperkenalkan uraian mengenai Allah dan secara alami dinyatakan sebagai klausa relatif dalam bahasa Indonesia.
- source_word: ἐπὶ πάντων
  choice: di atas semua
  rationale: ἐπί dengan genitif menyatakan kedudukan atau kedaulatan di atas; padanan ini juga mempertahankan bentuk ringkas dan kesejajaran retoris.
- source_word: διὰ πάντων
  choice: melalui semua
  rationale: διά dengan genitif lazim menyatakan perantaraan atau sarana. Terjemahan ini tidak menambahkan kata kerja tafsiran seperti 'bekerja'.
- source_word: ἐν πᾶσιν
  choice: di dalam semua
  rationale: Padanan langsung yang mempertahankan cakupan terbuka dari bentuk jamak tanpa nomina serta paralelisme dengan dua frasa sebelumnya.
theological_decisions:
- issue: Cakupan πάντων / πᾶσιν yang berulang
  choice: Menerjemahkannya secara luas sebagai 'semua' tanpa menambahkan 'orang', 'orang percaya', atau 'segala sesuatu' dalam teks utama.
  alternative: semua orang; semua orang percaya; segala sesuatu
  rationale: Konteks langsung membahas kesatuan jemaat, tetapi bahasa Yunani tidak menyatakan nomina yang membatasi cakupannya. Pilihan ini mempertahankan keluasan serta ketegangan penafsiran yang terdapat dalam teks.
- issue: Varian tekstual pada frasa terakhir
  choice: Mengikuti teks SBLGNT ἐν πᾶσιν, 'di dalam semua'.
  alternative: ἐν ὑμῖν πᾶσιν, 'di dalam kamu semua'
  rationale: Teks utama mengikuti edisi sumber yang ditentukan, sedangkan bacaan yang mempersempit cakupan kepada para penerima surat dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'semua' sengaja dipertahankan untuk mencerminkan anafora Yunani dan menonjolkan tema kesatuan. Frasa 'dari semua' dipakai untuk mempertahankan bentuk relasional yang ringkas, dengan pilihan penafsiran dijelaskan dalam catatan kaki.
