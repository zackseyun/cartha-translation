id: EPH.4.17
reference: Ephesians 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: id
  text: 'Karena itu, aku berkata dan menegaskan ini dalam Tuhan: Jangan lagi hidup seperti orang-orang bukan Yahudi hidup[a], dalam kesia-siaan pikiran mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa-bangsa”; beberapa terjemahan menerjemahkan kata Yunani ini sebagai “orang-orang kafir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν λέγω
  choice: Karena itu, aku mengatakan ... hal ini
  rationale: οὖν menyatakan kesimpulan dari nasihat sebelumnya, sedangkan Τοῦτο berfungsi sebagai objek λέγω; susunan Indonesia dibuat alami tanpa menghilangkan hubungan logisnya.
- source_word: μαρτύρομαι
  choice: menegaskan
  rationale: Dalam konteks nasihat ini, bentuk tersebut menyampaikan penegasan pribadi yang sungguh-sungguh. 'Menegaskan' lebih alami daripada 'bersaksi' ketika diikuti perintah, namun tetap mempertahankan bobot pernyataannya.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan langsung ini mempertahankan kemungkinan makna lingkup, hubungan, atau kewibawaan Tuhan tanpa mempersempitnya menjadi 'demi' atau 'atas nama Tuhan'.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: Jangan lagi hidup
  rationale: Infinitif bergantung pada λέγω καὶ μαρτύρομαι dan berdaya nasihat atau perintah. 'Jangan lagi' menyampaikan penghentian pola lama; 'hidup' mengungkapkan idiom etis περιπατέω secara wajar dalam bahasa Indonesia.
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: seperti bangsa-bangsa lain hidup
  rationale: ἔθνη dalam pemakaian Paulus lazim menunjuk bangsa-bangsa bukan Yahudi. 'Bangsa-bangsa lain' mempertahankan kategori itu tanpa tambahan nada peyoratif dari 'orang kafir'; pengulangan 'hidup' mempertahankan pengulangan περιπατέω.
- source_word: ἐν ματαιότητι
  choice: dalam kesia-siaan
  rationale: ματαιότης mencakup kehampaan, ketidakbermaknaan, dan kesia-siaan. 'Kesia-siaan' merupakan padanan baku yang tetap cukup luas.
- source_word: τοῦ νοὸς αὐτῶν
  choice: pikiran mereka
  rationale: νοῦς menunjuk daya pikir atau batin intelektual. 'Pikiran' adalah padanan langsung dan tidak mencampurkannya dengan διάνοια pada ayat berikutnya.
theological_decisions:
- issue: Makna ἔθνη dalam kontras etis kepada jemaat yang sebagian besar bukan Yahudi
  choice: bangsa-bangsa lain
  alternative: orang bukan Yahudi; orang kafir
  rationale: '''Bangsa-bangsa lain'' mempertahankan dimensi etnis-perjanjian dalam istilah Paulus tanpa memasukkan penilaian religius yang lebih keras dari kata ''orang kafir''. Kontrasnya menyangkut cara hidup lama, bukan pernyataan mutlak tentang setiap orang non-Yahudi.'
- issue: Daya infinitif περιπατεῖν sesudah λέγω καὶ μαρτύρομαι
  choice: Jangan lagi hidup
  alternative: bahwa kalian tidak lagi hidup; kalian tidak boleh lagi hidup
  rationale: Konstruksi tersebut berfungsi sebagai nasihat tegas. Bentuk imperatif Indonesia menyampaikan daya itu secara alami tanpa menambahkan kategori teologis yang tidak dinyatakan teks.
- issue: Makna ἐν κυρίῳ
  choice: dalam Tuhan
  alternative: demi Tuhan; dengan kewibawaan Tuhan
  rationale: Frasa sumber dapat menunjuk lingkup relasi dengan Tuhan sekaligus kewibawaan yang terkait dengannya. Terjemahan formal mempertahankan ketegangan itu dan tidak memilih satu tafsiran secara sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti suara tunggal penulis; perintah tanpa subjek eksplisit berlaku kepada para pembaca jamak. Metafora harfiah 'berjalan' dialihkan menjadi idiom etis 'hidup' agar alami, sementara pengulangannya dipertahankan.
