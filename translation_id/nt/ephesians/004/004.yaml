base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: id
  text: Ada satu tubuh dan satu Roh[a], sebagaimana kamu juga telah dipanggil dalam satu pengharapan yang berkaitan dengan panggilanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh”. Kata Yunani ini dapat berarti “roh” atau “Roh”; dalam konteks rumusan kesatuan pada bagian ini, kemungkinan besar yang dimaksud adalah Roh Kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: satu
  rationale: Mempertahankan pengulangan yang menekankan kesatuan.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan langsung yang mempertahankan metafora tubuh bagi umat percaya tanpa menjelaskannya secara berlebihan.
- source_word: πνεῦμα
  choice: Roh
  rationale: Dalam rangkaian kesatuan di Efesus 4:4–6, kata ini kemungkinan besar merujuk kepada Roh Kudus; huruf kapital menandai pembacaan itu, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: καθὼς καὶ
  choice: sebagaimana ... juga
  rationale: Menyampaikan hubungan perbandingan serta mempertahankan unsur καί secara alami dalam bahasa Indonesia.
- source_word: ἐκλήθητε
  choice: telah dipanggil
  rationale: Mempertahankan bentuk pasif dan tidak menyebutkan pelaku yang tidak dinyatakan dalam teks Yunani.
- source_word: ἐν
  choice: dalam
  rationale: Mempertahankan konstruksi Yunani ἐν μιᾷ ἐλπίδι, bukan mengalihkannya menjadi tujuan dengan 'kepada'.
- source_word: μιᾷ ἐλπίδι
  choice: satu pengharapan
  rationale: Padanan lugas yang melanjutkan pola pengulangan 'satu'.
- source_word: τῆς κλήσεως ὑμῶν
  choice: yang terkandung dalam panggilanmu
  rationale: Mengungkapkan hubungan genitif secara wajar dalam bahasa Indonesia sambil mempertahankan kaitan leksikal antara 'dipanggil' dan 'panggilan'.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: Roh Kudus, ditandai dengan 'Roh'
  alternative: roh atau kenyataan/sikap rohani bersama di antara orang percaya
  rationale: Urutan 'satu tubuh ... satu Roh ... satu Tuhan ... satu Allah dan Bapa' paling kuat mendukung rujukan kepada Roh Kudus. Namun, karena naskah Yunani kuno tidak membedakan huruf kapital dan kecil, alternatif leksikal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Bentuk 'kamu' dipakai sebagai sapaan jamak berdasarkan konteks, meskipun bahasa Indonesia tidak menandai jumlahnya. Pengulangan 'satu' dan kaitan 'dipanggil/panggilan' dipertahankan.
