id: EPH.4.11
reference: Ephesians 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: id
  text: Dan Dia sendirilah yang memberikan sebagian orang sebagai rasul, sebagian sebagai nabi, sebagian sebagai pemberita Injil, dan sebagian sebagai gembala[a] dan pengajar[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pastor.” Kata Yunani ini secara harfiah berarti “gembala.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, hanya ada satu artikel sebelum frasa “gembala dan pengajar.” Hal ini dapat menunjukkan hubungan yang sangat erat antara kedua peran tersebut, tetapi tidak harus berarti bahwa keduanya merupakan satu jabatan.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini dipertahankan untuk menunjukkan kesinambungan dengan ayat sebelumnya.
- source_word: αὐτὸς
  choice: Dia sendirilah
  rationale: Bentuk dan posisi pronomina ini bersifat menegaskan; partikel -lah mempertahankan penekanan bahwa Kristus sendiri yang bertindak.
- source_word: ἔδωκεν
  choice: memberikan
  rationale: Arti dasar δίδωμι adalah 'memberikan'; pilihan ini tidak mempersempit makna menjadi sekadar 'mengangkat' atau 'menetapkan'.
- source_word: τοὺς μὲν ἀποστόλους
  choice: sebagian orang sebagai rasul
  rationale: Pola artikel yang berulang bersama μέν/δέ menyatakan pembagian 'sebagian ... sebagian ...'; kata 'sebagai' memperjelas kapasitas atau peran orang-orang yang diberikan.
- source_word: προφήτας
  choice: nabi
  rationale: Padanan langsung dan lazim bagi προφήτης dalam konteks daftar peran pelayanan.
- source_word: εὐαγγελιστάς
  choice: pemberita Injil
  rationale: Padanan Indonesia yang alami dan mudah dipahami bagi εὐαγγελιστής, yakni orang yang memberitakan kabar baik.
- source_word: ποιμένας
  choice: gembala
  rationale: Mempertahankan metafora harfiah ποιμήν dan sekaligus merupakan istilah yang wajar dalam bahasa gerejawi Indonesia; alternatif 'pastor' dicatat dalam catatan kaki.
- source_word: καὶ διδασκάλους
  choice: dan pengajar
  rationale: Padanan langsung yang mempertahankan koordinasi kedua nomina tanpa memutuskan apakah keduanya satu jabatan atau dua fungsi yang berbeda.
theological_decisions:
- issue: Apakah ποιμένας diterjemahkan dengan metafora 'gembala' atau istilah jabatan 'pastor'
  choice: gembala
  alternative: pastor
  rationale: ‘Gembala’ mempertahankan citra leksikal bahasa Yunani dan tidak memasukkan bentuk jabatan gerejawi tertentu; ‘pastor’ tetap merupakan alternatif kontekstual yang sah.
- issue: Apakah 'gembala dan pengajar' merupakan satu kelompok gabungan atau dua kelompok/fungsi
  choice: Mempertahankan kedua nomina dalam frasa koordinatif tanpa menyelesaikan perdebatan sintaksis
  alternative: gembala-pengajar sebagai satu jabatan gabungan, atau dua kelompok yang sepenuhnya terpisah
  rationale: Satu artikel yang menaungi kedua nomina menunjukkan hubungan yang sangat erat, tetapi tidak dengan sendirinya mengharuskan keduanya dipahami sebagai satu jabatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan dipertahankan agar pembagian peran tampak jelas. 'Dia sendirilah' memberi penekanan alami, sedangkan 'pemberita Injil' lebih transparan bagi pembaca umum daripada bentuk serapan 'evangelis'.
