lexical_decisions:
- source_word: οἵτινες
  choice: Mereka
  rationale: Kata ganti relatif ini merujuk kembali kepada orang-orang bukan Yahudi dalam ayat sebelumnya. Dalam bahasa Indonesia, pembukaan dengan “Mereka” menjaga kaitan tersebut secara alami tanpa menambahkan penekanan yang tidak pasti.
- source_word: ἀπηλγηκότες
  choice: telah menjadi tidak peka
  rationale: Partisip perfek menyatakan keadaan tidak peka yang telah terbentuk. Ungkapan ini menyampaikan ketumpulan moral dalam konteks tanpa membatasinya pada mati rasa emosional.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: menyerahkan diri
  rationale: Bentuk refleksif menunjukkan bahwa mereka sendiri membiarkan atau memberikan diri dikuasai oleh keburukan itu; “menyerahkan diri” alami dan mempertahankan unsur kesengajaan.
- source_word: τῇ ἀσελγείᾳ
  choice: kepada hawa nafsu yang tak terkendali
  rationale: ἀσέλγεια menunjuk pada pemuasan diri yang tidak tahu malu dan tanpa kendali, sering kali dalam ranah seksual. Pilihan ini cukup luas, mudah dipahami, dan sesuai dengan konteks kenajisan.
- source_word: εἰς ἐργασίαν
  choice: sehingga melakukan
  rationale: Frasa ini dapat menyatakan arah, tujuan, atau hasil berupa kegiatan. “Sehingga melakukan” menghasilkan kalimat Indonesia yang alami sambil mempertahankan hubungan erat antara penyerahan diri dan praktik kenajisan.
- source_word: ἀκαθαρσίας πάσης
  choice: segala macam kenajisan
  rationale: Ungkapan ini menyampaikan cakupan menyeluruh atau beragam jenis kenajisan secara alami dalam bahasa Indonesia.
- source_word: ἐν πλεονεξίᾳ
  choice: dengan rakus
  rationale: πλεονεξία menggambarkan hasrat serakah yang terus menginginkan lebih. Dalam konteks ini, “dengan rakus” secara alami menerangkan cara mereka melakukan kenajisan dan mempertahankan gagasan ketidakpuasan yang tak pernah kenyang.
theological_decisions:
- issue: Daya moral-psikologis ἀπηλγηκότες
  choice: Dipahami sebagai ketumpulan atau hilangnya kepekaan moral.
  alternative: telah kehilangan segala perasaan; sudah tidak dapat merasakan apa-apa
  rationale: Konteksnya membahas keterasingan etis dan penyerahan diri kepada kenajisan. Terjemahan utama menghindari kesan bahwa yang dimaksud hanya mati rasa emosional atau keadaan klinis.
- issue: Cakupan ἀσέλγεια
  choice: Diterjemahkan secara luas sebagai hawa nafsu yang tak terkendali.
  alternative: perbuatan cabul; kehidupan tanpa kendali
  rationale: Istilah Yunani ini sering mencakup perilaku seksual yang tidak tahu malu, tetapi dapat menunjuk lebih luas pada pemuasan diri tanpa kendali. Terjemahan tidak mempersempitnya hanya pada satu jenis dosa.
- issue: Fungsi ἐν πλεονεξίᾳ
  choice: 'Dipahami sebagai keterangan cara: “dengan rakus.”'
  alternative: dalam keserakahan; demi keuntungan serakah
  rationale: Bentuk Yunani memungkinkan hubungan dengan cara atau suasana praktik kenajisan. Pilihan utama mempertahankan gagasan dorongan yang tidak pernah puas tanpa memastikan bahwa keuntungan materi adalah maksud khususnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang mengalir dan bermartabat. “Kenajisan” dipertahankan sebagai istilah etis yang umum dalam konteks Alkitab, sedangkan “hawa nafsu yang tak terkendali” dan “dengan rakus” dipilih agar dapat dipahami pembaca masa kini. Semua penanda catatan kaki ditempatkan tepat pada ungkapan yang diterangkannya.
