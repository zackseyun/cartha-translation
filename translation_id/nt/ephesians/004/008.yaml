base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: id
  text: Karena itu dikatakan, “Setelah naik ke tempat tinggi, Ia menawan para tawanan[a] dan memberikan karunia-karunia kepada manusia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, ungkapan Yunani memakai kata-kata serumpun: “menawan penawanan.” Ungkapan ini juga dapat dipahami sebagai “menggiring para tawanan” atau “menangkap serombongan tawanan” dan menggemakan Mazmur 68:18.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Mempertahankan hubungan kesimpulan dengan uraian sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: λέγει
  choice: dikatakan
  rationale: Bentuk pasif tanpa subjek mempertahankan ketidakjelasan subjek dalam bahasa Yunani dan berfungsi secara alami sebagai rumus pengutipan Kitab Suci.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Setelah naik ke tempat tinggi
  rationale: Menyatakan tindakan partisip aoris yang mendahului verba utama serta mempertahankan gambaran kenaikan menuju tempat yang tinggi.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: Ia menawan para tawanan
  rationale: Mempertahankan permainan kata serumpun antara verba dan objek sambil tetap dapat dipahami dalam bahasa Indonesia; bentuk jamak konkret merupakan cara idiomatis untuk mengungkapkan kelompok tawanan.
- source_word: ἔδωκεν δόματα
  choice: memberikan pemberian-pemberian
  rationale: Mencerminkan verba 'memberikan' dan nomina jamak 'pemberian' tanpa langsung menafsirkan jenis atau fungsi pemberian itu.
- source_word: τοῖς ἀνθρώποις
  choice: kepada manusia
  rationale: ἄνθρωποι di sini bersifat generik; 'manusia' mencakup orang-orang secara umum tanpa membatasi pada laki-laki.
theological_decisions:
- issue: Identitas subjek tindakan dalam kutipan
  choice: Memakai “Ia” tanpa menambahkan nama Kristus atau Allah
  alternative: Kristus / Allah
  rationale: Konteks mengarahkan pembaca kepada Kristus, tetapi teks ayat ini sendiri tidak menyebutkan nama subjek; terjemahan tidak membuat rujukan itu lebih eksplisit daripada sumber.
- issue: Makna ungkapan ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: Ia menawan para tawanan
  alternative: Ia membawa penawanan sebagai tawanan / Ia menangkap serombongan tawanan
  rationale: Pilihan utama mempertahankan kekuatan retoris ungkapan serumpun dan gema Mazmur 68:18 tanpa menentukan siapa para tawanan atau makna teologis penawanan tersebut.
- issue: Sasaran pemberian dalam τοῖς ἀνθρώποις
  choice: kepada manusia
  alternative: kepada laki-laki / kepada orang-orang
  rationale: Dalam konteks ini bentuk maskulin jamak Yunani paling wajar dipahami secara generik, sehingga 'manusia' akurat dan inklusif tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur kutipan dan urutan tindakan dipertahankan, sedangkan ungkapan Yunani yang padat dibuat cukup alami tanpa menghilangkan permainan katanya.
