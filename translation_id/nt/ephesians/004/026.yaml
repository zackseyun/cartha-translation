  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: id
  text: Marahlah[a] dan jangan berbuat dosa. Jangan biarkan matahari terbenam sementara kamu masih marah[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika kamu marah, jangan berbuat dosa.” Dalam bahasa Yunani, bentuknya secara tata bahasa adalah perintah (“Marahlah”), tetapi dalam konteks ini sebagian orang memahaminya sebagai ungkapan konsesif.
    reason: alternative_reading
  - marker: b
    text: Paulus tampaknya menggemakan Mazmur 4:5 dalam Septuaginta (LXX 4:5), yang menghubungkan kemarahan dengan perintah agar tidak berbuat dosa.
    reason: cross_reference
  - marker: c
    text: Atau, “atas kejengkelanmu” atau “atas hal yang membuatmu marah.” Istilah Yunani dapat menunjuk pada kemarahan maupun keadaan atau penyebab yang memancingnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Marahlah
  rationale: Bentuk imperatif Yunani dipertahankan secara langsung. Pilihan ini juga menjaga gema Mazmur 4:5 LXX serta ketegangan antara perintah ini dan larangan berbuat dosa yang segera menyusul.
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: tetapi jangan berbuat dosa
  rationale: Larangan diterjemahkan langsung. Kata penghubung 'tetapi' mengungkapkan pertentangan yang wajar dalam bahasa Indonesia tanpa mengubah daya imperatif kedua klausa.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Jangan biarkan matahari terbenam
  rationale: Ungkapan ini merupakan cara alami dalam bahasa Indonesia untuk menyampaikan imperatif orang ketiga yang bersifat larangan.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: sementara kamu masih marah
  rationale: Dalam konteks ini, παροργισμός paling alami dipahami sebagai keadaan marah atau kejengkelan yang berlanjut. Susunan ini menyampaikan bahwa kemarahan tidak boleh dipelihara sampai matahari terbenam, sambil mencatat kemungkinan leksikal lain dalam catatan kaki.
theological_decisions:
- issue: Apakah klausa pembuka merupakan perintah untuk marah atau pengandaian yang mengakui kemungkinan marah
  choice: 'Diterjemahkan sebagai imperatif: ''Marahlah, tetapi jangan berbuat dosa.'''
  alternative: 'Diterjemahkan secara konsesif: ''Jika kamu marah, jangan berbuat dosa.'''
  rationale: Bentuk Yunani adalah imperatif. Mempertahankannya menjaga ketegangan teks tanpa menjadikannya persetujuan umum terhadap segala kemarahan, sebab larangan berbuat dosa dan batas waktu yang menyusul langsung membatasi kemarahan itu.
- issue: Apakah παροργισμός menunjuk pada kemarahan, kejengkelan, atau hal yang membangkitkan amarah
  choice: Dipahami dalam teks utama sebagai keadaan marah yang masih berlangsung.
  alternative: Dapat diterjemahkan 'kejengkelanmu' atau 'hal yang membangkitkan amarahmu'.
  rationale: Konteks ὀργίζεσθε mendukung pengertian keadaan emosi, tetapi rentang makna istilah Yunani tetap dicatat agar ambiguitas yang sungguh ada tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Imperatif 'Marahlah' sengaja dipertahankan, sedangkan 'sementara kamu masih marah' dipilih agar idiom penutup terdengar alami dan jelas bagi pembaca umum.
