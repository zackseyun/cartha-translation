  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: id
  text: Namun, kepada kita masing-masing diberikan anugerah sesuai dengan ukuran pemberian Mesias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pemberian Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Kristus” ketika berfungsi lebih menyerupai nama, tetapi di sini “Mesias” mempertahankan makna gelarnya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: kepada kita masing-masing
  rationale: Konstruksi datif yang distributif dan menegaskan tiap orang dalam seluruh komunitas diterjemahkan secara alami dengan “kepada kita masing-masing”.
- source_word: δὲ
  choice: Namun
  rationale: Kata ini menandai peralihan dengan kontras ringan dari kesatuan umat pada ayat-ayat sebelumnya menuju keragaman anugerah yang dibagikan kepada tiap orang.
- source_word: ἐδόθη
  choice: diberikan
  rationale: Bentuk pasif dipertahankan. Bahasa Indonesia tidak menandai kala pada verba, dan konteks sudah cukup menyampaikan tindakan pemberian tanpa tambahan yang tidak terdapat dalam teks.
- source_word: ἡ χάρις
  choice: anugerah
  rationale: “Anugerah” mempertahankan bobot teologis χάρις dan, dalam konteks ini, dapat mencakup pemberdayaan penuh kemurahan untuk pelayanan tanpa mempersempitnya secara eksplisit.
- source_word: κατὰ τὸ μέτρον
  choice: sesuai dengan ukuran
  rationale: Frasa ini menyatakan standar atau proporsi. “Sesuai dengan ukuran” mempertahankan gambaran pengalokasian menurut suatu ukuran tertentu.
- source_word: τῆς δωρεᾶς
  choice: pemberian
  rationale: “Pemberian” membedakannya dari χάρις yang diterjemahkan “anugerah”, sekaligus tetap menyampaikan sesuatu yang dianugerahkan secara cuma-cuma.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini tetap memiliki daya sebagai gelar. “Mesias” mempertahankan makna gelar Yunani tersebut; alternatif tradisional dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna χάρις dalam konteks
  choice: Anugerah yang dibagikan kepada setiap orang, dalam konteks karunia dan pelayanan jemaat
  alternative: Kemurahan ilahi secara umum atau anugerah keselamatan dalam arti sempit
  rationale: Konteks langsung bergerak dari kesatuan umat menuju keragaman karunia pelayanan. Terjemahan “anugerah” mempertahankan istilah Paulus dan tidak mengunci maknanya hanya pada satu rumusan teologis.
- issue: Hubungan genitif dalam τῆς δωρεᾶς τοῦ Χριστοῦ
  choice: pemberian Mesias
  alternative: pemberian kepada Mesias
  rationale: Konteks paling wajar memahami Mesias sebagai pemilik atau pemberi karunia, tetapi frasa Indonesia dibiarkan cukup dekat dengan bentuk Yunani dan tidak menambahkan kata “dari” yang akan mempertegas satu jenis hubungan genitif.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός dapat dipahami sebagai gelar; “Mesias” mempertahankan isi semantis gelar itu, sementara bentuk “Kristus” dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan “kepada kita masing-masing” mempertahankan penekanan distributif, sedangkan “anugerah” dan “pemberian” dipakai untuk membedakan χάρις dari δωρεά tanpa terdengar teknis.
