id: EPH.5.6
reference: Ephesians 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: id
  text: Janganlah seorang pun menipu kalian dengan kata-kata kosong, sebab, oleh karena hal-hal itulah murka Allah datang menimpa anak-anak ketidaktaatan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara idiomatis, “anak-anak ketidaktaatan” berarti orang-orang yang dicirikan oleh ketidaktaatan.
    reason: Penjelasan idiom sumber yang jika dipahami secara harfiah dapat terdengar seperti hubungan keturunan.
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: Janganlah seorang pun menipu
  rationale: Bentuk larangan dengan imperatif orang ketiga paling alami dan tepat disampaikan sebagai “Janganlah seorang pun menipu,” sambil mempertahankan daya peringatannya.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina Yunani ini berbentuk jamak; “kalian” menyatakan jumlah tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: κενοῖς λόγοις
  choice: dengan kata-kata kosong
  rationale: Ungkapan ini mempertahankan metafora sumber tentang perkataan yang hampa, sia-sia, atau tidak berdasar tanpa mempersempitnya menjadi sekadar “argumen.”
- source_word: διὰ ταῦτα
  choice: karena hal-hal itulah
  rationale: διά dengan akusatif menyatakan sebab, sedangkan bentuk penunjuk merujuk kembali secara tegas kepada perbuatan-perbuatan yang disebut dalam konteks sebelumnya.
- source_word: ἔρχεται … ἐπὶ
  choice: datang menimpa
  rationale: “Datang” mempertahankan bentuk kini ἔρχεται tanpa menentukan apakah nuansanya umum atau segera, dan “menimpa” menyampaikan arah ἐπί secara alami.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: murka Allah
  rationale: Terjemahan ini mempertahankan istilah khusus ὀργή dan tidak melunakkannya menjadi istilah umum seperti “hukuman” atau “penghakiman.”
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: anak-anak ketidaktaatan
  rationale: Bentuk utama mempertahankan citra idiomatis sumber, yaitu “anak-anak/putra-putra” yang dicirikan oleh ketidaktaatan; catatan kaki menjelaskan maknanya agar tidak disalahpahami sebagai hubungan keturunan harfiah.
theological_decisions:
- issue: Bahasa tentang murka ilahi
  choice: murka Allah
  alternative: hukuman Allah
  rationale: Teks memakai ὀργή secara eksplisit. “Murka” mempertahankan bobot teologisnya tanpa menggantinya dengan akibat atau konsep penghakiman yang lebih luas.
- issue: Idiom υἱοὺς τῆς ἀπειθείας
  choice: anak-anak ketidaktaatan
  alternative: orang-orang yang dicirikan oleh ketidaktaatan
  rationale: Terjemahan utama mempertahankan idiom Semitis-Yunani dan ketegangannya, sedangkan catatan kaki menerangkan bahwa ungkapan itu menunjuk kepada orang-orang yang ditandai oleh ketidaktaatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. “Kalian” dipakai untuk memperjelas bahwa ὑμᾶς berbentuk jamak. Partikel “-lah” mempertahankan nada nasihat-larangan yang tegas tanpa terdengar kaku.
