  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: id
  text: Demikian juga, para suami wajib mengasihi istri mereka sendiri seperti tubuh mereka sendiri. Suami yang mengasihi istrinya sendiri mengasihi dirinya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menghubungkan nasihat ini dengan pola yang telah dijelaskan sebelumnya serta mempertahankan daya simpulan dan unsur tambahan dari οὕτως ... καί secara alami dalam bahasa Indonesia.
- source_word: ὀφείλουσιν
  choice: wajib
  rationale: Menyatakan kewajiban moral yang kuat dalam bentuk indikatif tanpa mengubahnya menjadi perintah langsung.
- source_word: οἱ ἄνδρες
  choice: suami-suami
  rationale: Dalam konteks nasihat rumah tangga dan pasangannya γυναῖκας, kata ini secara khusus menunjuk kepada para suami.
- source_word: ἀγαπᾶν / ἀγαπῶν / ἀγαπᾷ
  choice: mengasihi / yang mengasihi / mengasihi
  rationale: Mempertahankan pengulangan akar kata ἀγαπάω yang penting bagi alur pemikiran ayat ini; 'mengasihi' sesuai dengan ragam Alkitab Indonesia yang tetap alami dan bermartabat.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: istri mereka masing-masing
  rationale: 'Menyampaikan arti jamak distributif dan penekanan refleksif ἑαυτῶν: setiap suami mengasihi istrinya sendiri, bukan istri orang lain.'
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: seperti tubuh mereka sendiri
  rationale: Mempertahankan perbandingan eksplisit dan arti harfiah σώματα tanpa menambahkan penafsiran tentang hakikat hubungan tersebut.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: Suami yang mengasihi istrinya sendiri
  rationale: Mengungkapkan partisip substantival secara alami sambil mempertahankan rujukan maskulin dan konteks perkawinan yang jelas.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: mengasihi dirinya sendiri
  rationale: Mencerminkan langsung kata ganti refleksif dan pengulangan verba sehingga logika Paulus tetap utuh.
theological_decisions:
- issue: Bahasa bergender dalam nasihat rumah tangga
  choice: Menggunakan 'suami-suami' dan 'Suami yang mengasihi'
  alternative: Laki-laki; orang yang mengasihi
  rationale: Konteksnya secara khusus membicarakan laki-laki yang menikah, bukan manusia pada umumnya; pilihan ini mempertahankan ketepatan rujukan sumber.
- issue: Sifat perbandingan antara istri dan tubuh
  choice: Mempertahankan analogi secara eksplisit tanpa penjelasan doktrinal tambahan
  alternative: Merumuskan pernyataan sebagai identitas metafisis antara istri dan tubuh suami
  rationale: Teks membandingkan kasih kepada istri dengan kasih kepada tubuh sendiri lalu menyimpulkan bahwa mengasihi istri berarti mengasihi diri sendiri. Terjemahan tidak mempersempit atau memperluas klaim itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. 'Suami-suami' dipakai untuk mempertahankan bentuk jamak eksplisit, sedangkan 'istri mereka masing-masing' memperjelas daya distributif refleksif Yunani tanpa mengubah makna. Tidak diperlukan catatan kaki.
