  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan semua unsur utama Yunani: διὰ τοῦτο sebagai “Karena itu,” larangan prosesual μὴ γίνεσθε sebagai “janganlah menjadi,” ἄφρονες sebagai “bodoh,” kontras ἀλλά sebagai “tetapi,” dan perintah συνίετε τί τὸ θέλημα τοῦ κυρίου sebagai “pahamilah apa kehendak Tuhan.” Terjemahan ini tidak menambahkan identitas bagi “Tuhan” dan mempertahankan ketidakspesifikan rujukan κυρίου.'
