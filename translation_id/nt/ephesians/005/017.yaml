id: EPH.5.17
reference: Ephesians 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: id
  text: Karena itu[a], janganlah menjadi bodoh, tetapi pahamilah apa kehendak Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Oleh sebab itu.” Ungkapan Yunani ini dapat menyatakan alasan maupun kesimpulan yang ditarik dari nasihat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini merujuk kembali pada nasihat sebelumnya dan menyatakan hubungan sebab atau kesimpulan. “Karena itu” alami dalam bahasa Indonesia serta mempertahankan daya penghubungnya.
- source_word: μὴ γίνεσθε
  choice: janganlah menjadi
  rationale: γίνομαι pada dasarnya berarti “menjadi” atau “masuk ke dalam suatu keadaan.” Bentuk larangan ini dipertahankan tanpa mengubahnya menjadi pernyataan statis “jangan bodoh.”
- source_word: ἄφρονες
  choice: bodoh
  rationale: Kata ini menunjuk pada ketiadaan pengertian atau pertimbangan yang sehat. “Bodoh” jelas, wajar, dan membentuk kontras langsung dengan perintah untuk memahami.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Konjungsi ini menandai pertentangan kuat antara larangan dan perintah positif.
- source_word: συνίετε
  choice: pahamilah
  rationale: συνίημι berarti memahami, menangkap, atau mengerti. “Pahamilah” menyampaikan perintah tersebut secara alami dan tetap membuka nuansa pertimbangan yang saksama.
- source_word: τί
  choice: apa
  rationale: Kata tanya ini memperkenalkan isi yang harus dipahami; “apa” merupakan padanan Indonesia yang paling langsung.
- source_word: τὸ θέλημα
  choice: kehendak
  rationale: θέλημα menunjuk pada kehendak, maksud, atau hal yang dikehendaki. “Kehendak” merupakan padanan baku dan tepat dalam konteks Paulus.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: κύριος diterjemahkan “Tuhan,” sedangkan hubungan genitifnya dinyatakan secara alami melalui susunan “kehendak Tuhan.” Terjemahan tidak menambahkan identitas rujukan yang tidak disebutkan secara eksplisit dalam ayat.
theological_decisions:
- issue: Rujukan τοῦ κυρίου
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Dalam alur Surat Efesus, “Tuhan” sering merujuk kepada Yesus, tetapi ayat ini sendiri hanya memakai κυρίου. Terjemahan mempertahankan ketidakspesifikan teks Yunani.
- issue: Daya larangan μὴ γίνεσθε
  choice: janganlah menjadi
  alternative: janganlah bodoh; berhentilah menjadi bodoh
  rationale: Pilihan ini mempertahankan gagasan memasuki atau berkembang menuju suatu keadaan dan tidak mengandaikan secara tegas bahwa para pembaca sudah berada sepenuhnya dalam keadaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “janganlah” dan “pahamilah” mempertahankan nada nasihat yang tegas tanpa terdengar kuno; susunan “apa kehendak Tuhan” alami dan dekat dengan struktur sumber.
