  source_fidelity: 'Teks dengan tepat mencerminkan Yunani: ἄνδρες dan γυναῖκας diterjemahkan secara relasional sebagai “para suami” dan “istri kalian”; perintah ἀγαπᾶτε dipertahankan; καθώς καί tersampaikan melalui “sebagaimana ... juga”; dan ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς diterjemahkan tanpa menambahkan penafsiran pendamaian yang tidak tersurat. “Telah mengasihi” wajar untuk aoris dan tetap mempertahankan kaitan leksikal dengan “kasihilah.”'
