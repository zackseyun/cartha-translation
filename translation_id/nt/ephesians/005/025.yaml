id: EPH.5.25
reference: Ephesians 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: id
  text: Para suami, kasihilah istri kalian, sebagaimana Mesias[a] juga telah mengasihi jemaat dan menyerahkan diri-Nya bagi jemaat itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini untuk mempertahankan maknanya sebagai gelar.
    reason: alternative_reading
  - marker: b
    text: Atau, “menyerahkan diri-Nya demi jemaat itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: para suami
  rationale: Dalam konteks aturan rumah tangga dan ketika dipasangkan dengan γυναῖκας, kata ini menunjuk kepada laki-laki dalam hubungan pernikahan, yaitu para suami.
- source_word: ἀγαπᾶτε … ἠγάπησεν
  choice: kasihilah … telah mengasihi
  rationale: Akar kata yang sama dipertahankan untuk menampilkan hubungan langsung antara perintah kepada para suami dan teladan Mesias.
- source_word: γυναῖκας
  choice: istri kalian
  rationale: Konteks pernikahan menuntut arti ‘istri’; ‘kalian’ menyatakan secara wajar bahwa yang dimaksud ialah istri dari para suami yang disapa.
- source_word: καθὼς καὶ
  choice: sebagaimana … juga
  rationale: Ungkapan ini mempertahankan daya perbandingan καθώς dan unsur tambahan atau penegasan καί dalam bahasa Indonesia yang alami.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Dengan artikel, Χριστός jelas berfungsi sebagai gelar; ‘Mesias’ mempertahankan makna gelar Yunani tersebut.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Di sini kata tersebut menunjuk kepada umat Allah secara kolektif. ‘Jemaat’ merupakan padanan Indonesia yang mapan tanpa membatasinya pada gedung atau organisasi.
- source_word: ἑαυτὸν παρέδωκεν
  choice: menyerahkan diri-Nya
  rationale: Ungkapan ini menyatakan penyerahan diri secara sukarela dan mempertahankan bobot pengorbanannya tanpa menambahkan penjelasan teologis yang tidak tersurat.
- source_word: ὑπὲρ αὐτῆς
  choice: bagi jemaat itu
  rationale: ‘Bagi’ menyampaikan arti bertindak demi atau untuk kepentingan pihak lain. Karena bahasa Indonesia tidak memakai pronomina feminin untuk jemaat, acuannya diulangi agar jelas.
theological_decisions:
- issue: Penerjemahan Χριστός dalam analogi pernikahan dan jemaat
  choice: Mesias
  alternative: Kristus
  rationale: ‘Mesias’ mempertahankan makna Χριστός sebagai gelar dalam konstruksi berartikel, sedangkan ‘Kristus’ dicatat sebagai padanan tradisional yang sah.
- issue: Cakupan makna pengorbanan dalam παρέδωκεν ὑπὲρ αὐτῆς
  choice: menyerahkan diri-Nya bagi jemaat itu
  alternative: menyerahkan diri-Nya demi jemaat itu
  rationale: Pilihan utama menyatakan penyerahan diri untuk kepentingan jemaat tanpa menambahkan rumusan khusus mengenai mekanisme pendamaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kasihilah’ mempertahankan nada perintah, sedangkan ‘istri kalian’ lebih jelas daripada ‘istri-istrimu’ dalam sapaan jamak. Pengulangan ‘jemaat’ menghindari pronomina yang dapat kabur acuannya dalam bahasa Indonesia.
