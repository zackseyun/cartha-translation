  text: making the most of the time[a], because the days are evil.
translation:
  language: id
  text: Manfaatkanlah waktu sebaik-baiknya[a], karena hari-hari ini jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tebuslah waktu”; ungkapan Yunani ini secara harfiah dapat menggambarkan tindakan “membeli habis” kesempatan yang ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: gunakanlah ... sebaik-baiknya
  rationale: Partisipel ini secara harfiah menggambarkan tindakan membeli habis atau memperoleh kembali, tetapi dalam konteks nasihat ini bermakna memanfaatkan sepenuhnya. Bentuk imperatif Indonesia mengikuti daya nasihat dari konteks kalimat yang berlanjut dari ayat sebelumnya.
- source_word: τὸν καιρόν
  choice: setiap kesempatan
  rationale: καιρός menunjuk pada waktu yang tepat atau peluang, bukan semata-mata waktu secara abstrak. 'Setiap kesempatan' menyampaikan makna idiomatis itu dengan wajar dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi nasihat tersebut.
- source_word: αἱ ἡμέραι
  choice: hari-hari ini
  rationale: Bentuk jamak dipertahankan, sedangkan 'ini' menyatakan bahwa yang dimaksud ialah keadaan zaman yang sedang dijalani tanpa memperluas tafsir secara berlebihan.
- source_word: πονηραί
  choice: jahat
  rationale: '''Jahat'' mempertahankan dimensi moral dan sifat bermusuhan dari πονηραί; ''sukar'' atau ''buruk'' akan melemahkan maknanya.'
theological_decisions:
- issue: Kemungkinan memahami ἐξαγοραζόμενοι sebagai istilah penebusan yang bersifat keselamatan
  choice: Nasihat praktis untuk memanfaatkan setiap kesempatan sebaik-baiknya
  alternative: tebuslah waktu
  rationale: Dalam konteks nasihat etis ini, ungkapan tersebut mengarahkan pembaca untuk menggunakan kesempatan dengan bijaksana, bukan secara eksplisit membicarakan penebusan keselamatan. Terjemahan alternatif yang lebih harfiah tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan dibuat alami sebagai lanjutan nasihat pada ayat sebelumnya, sambil mempertahankan metafora Yunani dalam catatan kaki.
