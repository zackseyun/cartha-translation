lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: sambil tunduk
  rationale: Partisipel kini ini melanjutkan rangkaian partisipel yang terkait dengan konteks perintah sebelumnya. “Sambil tunduk” mempertahankan bentuk partisipial dan tidak menambahkan unsur refleksif yang tidak dinyatakan secara eksplisit.
- source_word: ἀλλήλοις
  choice: seorang kepada yang lain
  rationale: Pronomina timbal balik datif jamak ini menyatakan hubungan timbal balik dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐν
  choice: dalam
  rationale: Preposisi ini paling langsung menyatakan lingkup atau cara. “Dalam” menjaga kedekatan dengan bentuk Yunani tanpa mengubahnya menjadi hubungan sebab-akibat yang lebih tegas.
- source_word: φόβῳ
  choice: rasa takut
  rationale: Pilihan ini mempertahankan inti leksikal φόβος dan ketegangan teologisnya. Dalam konteks ini rasa takut dapat mencakup hormat dan gentar, tetapi tidak diperlunak menjadi sekadar rasa hormat dalam teks utama.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Bentuk genitif Χριστός dipahami masih berfungsi sebagai gelar. “Mesias” menerjemahkan gelar tersebut, sedangkan bentuk tradisional “Kristus” dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna “takut akan Mesias”
  choice: rasa takut penuh hormat yang diarahkan kepada Mesias
  alternative: rasa takut yang ditimbulkan oleh Mesias; rasa hormat kepada Kristus
  rationale: Genitif objektif merupakan pembacaan paling langsung. Teks utama tetap memakai “rasa takut” agar bobot dan ketegangan ungkapan Yunani tidak diratakan menjadi kesopanan atau penghormatan biasa.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός cukup jelas mempertahankan fungsi gelarnya, sehingga diterjemahkan “Mesias”. Padanan tradisional “Kristus” tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa pembuka “sambil tunduk” sengaja mempertahankan hubungan partisipial ayat ini dengan konteks sebelumnya. Ungkapan “dalam rasa takut akan” agak formal, tetapi jelas dan menjaga bentuk serta ketegangan semantis sumber Yunani.
