translation:
  language: id
  text: sambil tunduk satu sama lain dalam rasa takut akan Mesias[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam rasa hormat kepada Mesias” atau “dalam rasa gentar kepada Mesias.”
    reason: lexical_alternative
