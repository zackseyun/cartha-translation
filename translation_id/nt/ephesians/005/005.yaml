id: EPH.5.5
reference: Ephesians 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: id
  text: 'Sebab kamu mengetahui dan memahami hal ini: setiap orang cabul, najis, atau serakah—yang merupakan penyembah berhala[a]—tidak memiliki warisan dalam Kerajaan Mesias dan Allah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang merupakan penyembahan berhala”; bentuk netral dalam bahasa Yunani dapat merujuk terutama kepada keserakahan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: kamu mengetahui hal ini dan memahaminya
  rationale: Gabungan verba mengetahui dengan partisip memahami menegaskan kepastian pengetahuan. Kedua unsur dipertahankan dengan ungkapan Indonesia yang wajar.
- source_word: πόρνος
  choice: orang cabul
  rationale: Menunjuk kepada orang yang dicirikan oleh ketidakberesan seksual. Pilihan ini ringkas, lazim, dan tidak membatasi maknanya pada satu tindakan seksual tertentu.
- source_word: ἀκάθαρτος
  choice: orang najis
  rationale: Mempertahankan gambaran kenajisan yang dalam daftar keburukan Paulus mencakup ketidakmurnian moral.
- source_word: πλεονέκτης
  choice: orang serakah
  rationale: Menunjuk kepada orang yang dikuasai hasrat untuk memperoleh lebih banyak; 'serakah' merupakan padanan Indonesia modern yang langsung.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: yang adalah penyembah berhala
  rationale: Dalam konteks, klausa ini paling wajar menggambarkan orang serakah sebagai penyembah berhala. Karena pronomina relatif Yunani berbentuk netral dan dapat menunjuk kepada keserakahan secara abstrak, kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: κληρονομίαν
  choice: warisan
  rationale: Mempertahankan citra perjanjian dan pengharapan akhir zaman yang terkandung dalam istilah Paulus.
- source_word: βασιλείᾳ
  choice: Kerajaan
  rationale: Mencakup pemerintahan sekaligus ranah kekuasaan kerajaan dan merupakan istilah Indonesia yang mapan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam frasa ini, sehingga diterjemahkan 'Mesias'.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: Mesias dan Allah
  rationale: Koordinasi kedua genitif dipertahankan secara langsung tanpa memaksakan kesimpulan sintaktis-kristologis yang lebih khusus daripada bunyi teks.
theological_decisions:
- issue: Acuan ὅ ἐστιν εἰδωλολάτρης
  choice: 'Diterapkan kepada orang serakah: ''yang adalah penyembah berhala''.'
  alternative: '''yang merupakan penyembahan berhala'', dengan acuan terutama kepada keserakahan.'
  rationale: Konteks dan paralel Kolose 3:5 mendukung hubungan erat antara keserakahan dan penyembahan berhala, tetapi bentuk netral pronomina relatif mempertahankan kemungkinan acuan abstrak. Bacaan alternatif dicatat agar ambiguitas sumber tidak hilang.
- issue: Makna tidak memperoleh warisan
  choice: 'Pernyataan status kini: ''tidak memiliki warisan''.'
  alternative: '''tidak akan mewarisi Kerajaan''.'
  rationale: Teks Yunani memakai kala kini οὐκ ἔχει, bukan verba masa depan. Terjemahan mempertahankan aspek kini dan kekuatan peringatannya.
- issue: Hubungan 'Mesias dan Allah'
  choice: Genitif koordinatif diterjemahkan langsung sebagai 'Kerajaan Mesias dan Allah'.
  alternative: Terjemahan yang secara eksplisit menyamakan atau membedakan kedua sebutan berdasarkan kaidah sintaktis tertentu.
  rationale: Susunan Yunani menyatakan hubungan yang sangat erat, tetapi terjemahan tidak seharusnya memaksakan kesimpulan teologis yang lebih terperinci daripada yang dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat ringkas, sedangkan tanda pisah menandai klausa penjelas. Istilah 'warisan', 'Kerajaan', dan 'Mesias' mempertahankan gema teologis teks sumber tanpa menambahkan tafsiran denominasi.
