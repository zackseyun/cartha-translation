lexical_decisions:
- source_word: γὰρ
  choice: sebab
  rationale: Menghubungkan ayat ini sebagai alasan atau penjelasan bagi nasihat pada ayat sebelumnya.
- source_word: καρπὸς
  choice: buah
  rationale: Mempertahankan metafora hasil yang muncul dalam kehidupan, yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: τοῦ φωτός
  choice: dari terang
  rationale: Menyatakan asal atau sumber buah itu dan merujuk kembali pada identitas sebagai terang dalam ayat 8.
- source_word: ἐν
  choice: tampak dalam
  rationale: Dalam konteks ini preposisi tersebut menunjukkan ranah atau wujud nyata tempat buah itu terlihat; terjemahan ini lebih alami daripada ungkapan lokatif harfiah 'ada dalam'.
- source_word: πάσῃ
  choice: segala
  rationale: Dengan kata benda abstrak tunggal, kata ini menyatakan cakupan menyeluruh.
- source_word: ἀγαθωσύνῃ
  choice: kebaikan
  rationale: Mencakup mutu moral yang baik serta tindakan yang membawa kebaikan tanpa mempersempitnya menjadi sekadar keramahan.
- source_word: δικαιοσύνῃ
  choice: kebenaran
  rationale: Padanan Indonesia yang lazim dalam konteks Alkitab bagi kelurusan moral, sambil mempertahankan kemungkinan makna 'keadilan' dalam catatan kaki.
- source_word: ἀληθείᾳ
  choice: kesejatian
  rationale: Membedakannya dari δικαιοσύνη yang diterjemahkan 'kebenaran' dan mencakup ketulusan serta kesesuaian dengan apa yang benar.
theological_decisions:
- issue: Varian teks pada frasa genetif
  choice: buah dari terang
  alternative: buah dari Roh
  rationale: SBLGNT membaca φωτός ('terang'), sesuai dengan konteks langsung tentang hidup sebagai anak-anak terang; varian 'Roh' dicatat tanpa menggantikan teks sumber yang dipakai.
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks ini kata tersebut menunjuk pada kelurusan moral, tetapi cakupan Yunaninya juga dapat menonjolkan keadilan; alternatif itu dipertahankan dalam catatan kaki.
- issue: Hubungan ἐν dengan daftar sifat
  choice: tampak dalam
  alternative: terdapat dalam
  rationale: Pilihan utama menyampaikan bahwa buah terang terwujud melalui sifat-sifat tersebut tanpa menetapkan secara sempit bahwa daftar itu merupakan definisi lengkap.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'tampak dalam' dipilih agar relasi ἐν jelas dan alami. 'Kesejatian' menghindari pengulangan 'kebenaran' untuk dua kata Yunani yang berbeda serta tetap menyampaikan gagasan kebenaran yang nyata dan tulus.
