  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: id
  text: Sebab[a] suami adalah kepala[b] istri, sebagaimana Mesias[c] juga adalah kepala jemaat—Dia sendiri adalah Penyelamat tubuh itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Karena”.
    reason: lexical_alternative
  - marker: b
    text: “Kepala” mempertahankan metafora Yunani. Istilah ini dipahami secara beragam sebagai menyiratkan kewenangan, kedudukan utama, atau sumber.
    reason: lexical_alternative
  - marker: c
    text: 'Yunani: “Kristus”; diterjemahkan “Mesias” karena di sini kata itu berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memberikan dasar atau penjelasan bagi nasihat sebelumnya. “Sebab” mempertahankan hubungan penjelas tersebut secara alami dalam bahasa Indonesia.
- source_word: ἀνήρ
  choice: suami
  rationale: Dalam konteks aturan rumah tangga yang membahas istri dan suami, makna relasional “suami” dituntut oleh konteks.
- source_word: κεφαλή
  choice: kepala
  rationale: Mempertahankan metafora Yunani tanpa mempersempitnya menjadi tafsiran seperti “pemimpin”, “penguasa”, atau “sumber”.
- source_word: γυνή
  choice: istri
  rationale: Karena dipasangkan dengan ἀνήρ dalam konteks perkawinan, kata ini bermakna “istri”.
- source_word: ὡς καὶ
  choice: sebagaimana ... juga
  rationale: Mempertahankan struktur perbandingan antara hubungan suami-istri dan hubungan Mesias-jemaat tanpa menyatakan bahwa keduanya identik dalam segala hal.
- source_word: Χριστός
  choice: Mesias
  rationale: Di sini kata tersebut berfungsi sebagai gelar, sehingga “Mesias” menyampaikan makna gelarnya secara langsung.
- source_word: ἐκκλησία
  choice: jemaat
  rationale: Dalam konteks Paulus, kata ini menunjuk kepada komunitas umat yang ditebus; “jemaat” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: αὐτός
  choice: Dia sendiri
  rationale: Bentuk pronomina ini bersifat menegaskan dan secara khusus mengaitkan peran sebagai Penyelamat dengan Mesias.
- source_word: σωτήρ
  choice: Penyelamat
  rationale: Padanan ini mempertahankan makna penyelamatan atau pembebasan dalam konteks kristologis.
- source_word: σῶμα
  choice: tubuh
  rationale: Mempertahankan metafora tubuh yang digunakan Paulus bagi jemaat. Unsur posesif tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam teks Yunani.
theological_decisions:
- issue: Makna κεφαλή dalam perbandingan suami-istri dan Mesias-jemaat
  choice: Metafora “kepala” dipertahankan tanpa ditafsirkan secara sempit dalam teks utama.
  alternative: “sumber”, “pemimpin”, atau “yang berkuasa atas”
  rationale: Makna khusus metafora ini diperdebatkan. Mempertahankan “kepala” menjaga ambiguitas leksikal dan ketegangan teologis teks sumber.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Kata itu berfungsi sebagai gelar di sini; “Mesias” menyatakan makna gelar tersebut dan mempertahankan latar belakang mesianiknya.
- issue: Hubungan αὐτὸς σωτὴρ τοῦ σώματος dengan klausa sebelumnya
  choice: 'Ditampilkan sebagai penegasan aposisional: “Dia sendiri adalah Penyelamat tubuh itu.”'
  alternative: “dengan menjadi Penyelamat tubuh itu” atau “Dialah Penyelamat tubuh itu”
  rationale: Teks Yunani tidak memakai partisipel yang berarti “menjadi”. Susunan penegasan mempertahankan αὐτός dan hubungan aposisional dengan Mesias.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, jelas, dan bermartabat. “Jemaat” dipilih sebagai istilah yang mudah dipahami dalam konteks Paulus. Tanda pisah menandai penegasan aposisional pada bagian akhir tanpa menambahkan hubungan logis yang tidak dinyatakan dalam bahasa Yunani.
