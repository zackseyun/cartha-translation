  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: id
  text: 'Karena itu, perhatikanlah dengan saksama bagaimana kamu hidup: janganlah hidup sebagai orang yang tidak bijaksana, melainkan sebagai orang yang bijaksana.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: perhatikanlah
  rationale: Bentuk imperatif kini orang kedua jamak menyampaikan seruan agar seluruh jemaat memberi perhatian terus-menerus. 'Perhatikanlah' alami dalam bahasa Indonesia dan mempertahankan daya perintah.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari uraian sebelumnya; 'Karena itu' mempertahankan hubungan logis tersebut secara jelas.
- source_word: ἀκριβῶς πῶς
  choice: dengan saksama bagaimana
  rationale: ἀκριβῶς menekankan ketelitian perhatian terhadap cara hidup, sedangkan πῶς memperkenalkan pertanyaan tentang caranya. Susunan ini mempertahankan kedua unsur tanpa memberi kesan ketepatan teknis semata.
- source_word: περιπατεῖτε
  choice: kamu hidup
  rationale: Secara harfiah berarti 'kamu berjalan', tetapi di sini merupakan metafora umum bagi perilaku atau cara menjalani hidup. 'Kamu hidup' menyampaikan maknanya secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: jangan sebagai orang yang tidak bijaksana, melainkan sebagai orang yang bijaksana
  rationale: Mempertahankan konstruksi perbandingan ὡς dan pertentangan simetris antara ἄσοφοι dan σοφοί. 'Orang' menunjukkan bahwa bentuk jamak maskulin Yunani merujuk secara representatif kepada seluruh jemaat.
theological_decisions:
- issue: Cakupan gender bentuk jamak maskulin ἄσοφοι / σοφοί
  choice: orang yang tidak bijaksana ... orang yang bijaksana
  alternative: laki-laki yang tidak bijaksana ... laki-laki yang bijaksana
  rationale: Bentuk maskulin jamak Yunani berfungsi secara generik dalam sapaan kepada seluruh komunitas beriman. Bahasa Indonesia tidak menuntut penandaan gender gramatikal, sehingga 'orang' secara akurat mempertahankan cakupan referennya tanpa membatasi nasihat kepada laki-laki.
- issue: Metafora περιπατεῖτε ('berjalan')
  choice: kamu hidup
  alternative: kamu berjalan
  rationale: Dalam konteks nasihat etis Paulus, 'berjalan' berarti menjalani hidup atau berperilaku. Terjemahan 'hidup' membuat maksudnya jelas bagi pembaca umum tanpa menambahkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kamu' dipahami sebagai jamak karena nasihat ditujukan kepada jemaat; pertentangan paralel dipertahankan dengan 'jangan ... melainkan ...'.
