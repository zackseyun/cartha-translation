base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: id
  text: Dan hiduplah dalam kasih, sebagaimana Mesias[a] juga telah mengasihi kita dan menyerahkan diri-Nya bagi kita[b] sebagai persembahan dan kurban yang harum bagi Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός merupakan gelar yang berarti “Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “bagi kita” juga dapat dipahami “demi kita” atau “untuk kepentingan kita”; dalam konteks ini ὑπέρ dapat memiliki daya benefaktif atau representatif.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “yang harum” menggemakan bahasa pengurbanan dalam Perjanjian Lama untuk persembahan yang berkenan kepada Allah.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: hiduplah
  rationale: Secara harfiah berarti ‘berjalanlah’, tetapi di sini merupakan metafora Paulus untuk cara hidup. ‘Hiduplah’ menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Mempertahankan gambaran kasih sebagai lingkup dan cara hidup, sekaligus memakai padanan baku untuk ἀγάπη.
- source_word: ὁ Χριστός
  choice: Mesias
  rationale: Dengan artikelnya, Χριστός berfungsi sebagai gelar di sini. ‘Mesias’ menyampaikan arti gelar itu secara langsung.
- source_word: ἠγάπησεν ἡμᾶς
  choice: telah mengasihi kita
  rationale: Mempertahankan hubungan leksikal dengan ἀγάπη dan menyatakan tindakan kasih yang menjadi teladan bagi perintah tersebut.
- source_word: παρέδωκεν ἑαυτὸν
  choice: menyerahkan diri-Nya
  rationale: Mengungkapkan penyerahan diri secara sukarela dan sesuai dengan konteks pengurbanan tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: ὑπὲρ ἡμῶν
  choice: bagi kita
  rationale: Padanan alami yang mempertahankan daya benefaktif atau representatif ὑπέρ tanpa mempersempitnya menjadi rumusan substitusi yang eksplisit.
- source_word: προσφορὰν καὶ θυσίαν
  choice: persembahan dan kurban
  rationale: Kedua istilah kultis dipertahankan dan tidak dilebur menjadi satu. ‘Kurban’ membedakannya dengan jelas dari ‘persembahan’.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Menunjukkan Allah sebagai penerima atau arah persembahan dalam konteks pengurbanan.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: menjadi bau yang harum
  rationale: Mempertahankan citra indrawi dan gema bahasa persembahan Perjanjian Lama. ‘Menjadi’ secara alami menyatakan hasil atau fungsi yang dapat dikandung oleh εἰς.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Bentuk berartikel di sini mendukung fungsi sebagai gelar. ‘Mesias’ menerjemahkan makna gelar tersebut, sementara alternatif yang lazim dicatat dalam catatan kaki.
- issue: Daya ὑπὲρ ἡμῶν dalam konteks pengurbanan
  choice: bagi kita
  alternative: demi kita; untuk kepentingan kita
  rationale: Konteksnya jelas bersifat pengurbanan dan menguntungkan manusia, tetapi preposisi ὑπέρ sendiri tidak perlu diperjelas menjadi ‘menggantikan kita’. Pilihan ini mempertahankan keluasan makna dan ketegangan teologis teks.
- issue: Hubungan εἰς ὀσμὴν εὐωδίας dengan persembahan
  choice: menjadi bau yang harum
  alternative: sebagai bau yang harum
  rationale: Ungkapan ini mempertahankan citra persembahan yang diterima dengan berkenan tanpa mengganti metaforanya dengan penjelasan teologis langsung.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. ‘Hiduplah’ dipilih alih-alih terjemahan harfiah ‘berjalanlah’ agar metafora cara hidup dipahami pembaca umum. Huruf kapital pada ‘diri-Nya’ mengikuti kebiasaan penghormatan yang luas dalam penerbitan Alkitab bahasa Indonesia.
