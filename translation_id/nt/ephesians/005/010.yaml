  text: δοκιμάζοντες τί ἐστιν εὐάρεστον τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/010.yaml
  text: testing what is pleasing to the Lord;[a]
translation:
  language: id
  text: ujilah apa yang berkenan kepada Tuhan;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nilailah” atau “carilah tahu” apa yang berkenan kepada Tuhan.
    reason: Alternatif leksikal untuk δοκιμάζοντες, yang dapat menekankan pengujian, penilaian, atau upaya mengetahui melalui pemeriksaan.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: ujilah
  rationale: Partisipel kini aktif ini meneruskan alur nasihat dalam konteks. Bentuk imperatif alami dalam bahasa Indonesia menyampaikan tindakan terus-menerus untuk menguji dan menilai, tanpa menghilangkan daya evaluatif δοκιμάζω.
- source_word: τί
  choice: apa yang
  rationale: Memperkenalkan pertanyaan tidak langsung; “apa yang” merupakan ungkapan Indonesia yang alami.
- source_word: ἐστιν
  choice: tersirat dalam konstruksi “apa yang berkenan”
  rationale: Kopula Yunani tidak perlu diterjemahkan secara terpisah karena konstruksi Indonesia ini sudah menyampaikan makna “apa yang adalah/merupakan berkenan” secara alami.
- source_word: εὐάρεστον
  choice: berkenan
  rationale: “Berkenan” secara wajar menyatakan sesuatu yang menyenangkan atau dapat diterima dalam pandangan seseorang, serta cocok dengan ragam Alkitab Indonesia yang tetap modern dan bermartabat.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Datif bersama εὐάρεστον secara alami diterjemahkan “berkenan kepada.” Sebutan κύριος dipertahankan sebagai “Tuhan” tanpa memperjelas rujukannya melebihi teks Yunani.
theological_decisions:
- issue: Rujukan κύριος
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Teks Yunani hanya memakai gelar κύριος. Walaupun konteks Paulus dapat dipahami secara kristologis, terjemahan mempertahankan ketegangan dan tidak menambahkan identitas yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Imperatif “ujilah” dipakai agar fungsi nasihat partisipel Yunani terdengar alami dalam hubungan dengan konteks, sedangkan tanda titik koma mengikuti kesinambungan sintaksis ayat.
