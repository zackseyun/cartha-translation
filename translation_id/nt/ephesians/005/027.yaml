id: EPH.5.27
reference: Ephesians 5:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: id
  text: supaya Ia sendiri menghadapkan jemaat kepada diri-Nya dalam kemuliaan[a], tanpa noda atau kerut atau sesuatu yang semacam itu[b], melainkan supaya jemaat itu kudus dan tidak bercela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai jemaat yang mulia”. Kata Yunani ini dapat menggambarkan sifat jemaat (“mulia”) atau keadaannya ketika dihadapkan (“dalam kemuliaan”).
    reason: lexical_alternative
  - marker: b
    text: Atau “atau apa pun yang seperti itu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: menghadapkan
  rationale: Dalam konteks ini, kata kerja ini menyatakan tindakan membawa atau menampilkan seseorang ke hadapan pihak tertentu. “Menghadapkan” alami dalam bahasa Indonesia dan mempertahankan gambaran penyerahan atau penyajian resmi.
- source_word: αὐτὸς
  choice: Ia sendiri
  rationale: Pronomina eksplisit ini bersifat emfatis; “Ia sendiri” mempertahankan penekanan bahwa Kristus secara pribadi melakukan tindakan tersebut.
- source_word: ἑαυτῷ
  choice: kepada diri-Nya
  rationale: Bentuk datif refleksif dipertahankan secara langsung tanpa menafsirkan apakah nuansanya terutama ‘kepada’, ‘bagi’, atau ‘di hadapan’ diri-Nya.
- source_word: ἔνδοξον
  choice: dalam kemuliaan
  rationale: Adjektiva ini menggambarkan keadaan jemaat ketika dihadapkan. “Dalam kemuliaan” menyampaikan keadaan mulia tersebut secara wajar dan tetap membuka alternatif adjektival “mulia”.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Di sini istilah tersebut menunjuk kepada umat Allah secara kolektif. “Jemaat” merupakan padanan baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: μὴ ἔχουσαν
  choice: tanpa
  rationale: Walaupun bentuk Yunani secara harfiah berarti ‘tidak mempunyai’, “tanpa” lebih alami dalam bahasa Indonesia dan tetap menyatakan kondisi jemaat.
- source_word: σπίλον
  choice: noda
  rationale: “Noda” mempertahankan gambaran konkret tentang cacat atau kotoran dan berpasangan alami dengan “kerut”.
- source_word: ῥυτίδα
  choice: kerut
  rationale: “Kerut” adalah padanan langsung dan sesuai dengan citra tubuh atau pengantin dalam konteks ini.
- source_word: ἤ τι τῶν τοιούτων
  choice: atau sesuatu yang semacam itu
  rationale: Ungkapan ini mempertahankan sifat kategori yang terbuka dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: melainkan supaya jemaat itu
  rationale: “Melainkan” menandai kontras dengan keadaan negatif sebelumnya, sedangkan pengulangan “jemaat itu” memperjelas subjek tanpa memakai pronomina bergender yang tidak alami dalam bahasa Indonesia.
- source_word: ἁγία
  choice: kudus
  rationale: “Kudus” adalah padanan baku yang mempertahankan bobot religius dan etis kata sumber.
- source_word: ἄμωμος
  choice: tidak bercela
  rationale: Padanan ini dapat menyatakan bebas dari cacat maupun dari kesalahan, sehingga mempertahankan jangkauan citra kemurnian tanpa mengulang kata “noda” secara kaku.
theological_decisions:
- issue: Gambaran refleksif Kristus menghadapkan jemaat kepada diri-Nya
  choice: 'Mempertahankan bentuk emfatis dan refleksif: “Ia sendiri ... kepada diri-Nya”.'
  alternative: Menyederhanakannya menjadi “menghadapkan jemaat” atau menafsirkannya secara eksplisit sebagai penghadapan di hadapan Allah.
  rationale: Teks Yunani memuat αὐτός yang emfatis dan ἑαυτῷ yang refleksif. Terjemahan tidak menghapus ketegangan sastra dan teologis ini.
- issue: Citra kemurnian jemaat
  choice: Menggunakan “noda atau kerut ... kudus dan tidak bercela”.
  alternative: Menggunakan “cacat atau kerut ... kudus dan tanpa cela”.
  rationale: Pilihan ini mempertahankan baik gambaran konkret tentang keindahan atau kemurnian maupun bahasa kekudusan, tanpa membatasi ayat pada satu kerangka doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tujuan ganda dipertahankan dengan “supaya ... melainkan supaya”, sementara pengulangan “jemaat itu” menghindari pronomina bergender dan memperjelas rujukan.
