id: EPH.5.31
reference: Ephesians 5:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: id
  text: Karena itu, seorang laki-laki akan meninggalkan ayah dan ibunya dan bersatu dengan istrinya, dan keduanya akan menjadi satu daging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Karena itu
  rationale: Dalam kutipan Kejadian 2:24 ini, frasa tersebut berfungsi sebagai penghubung sebab/hasil. “Karena itu” alami dalam bahasa Indonesia dan tidak memberi kesan penggantian seperti terjemahan harfiah “sebagai ganti hal ini”.
- source_word: καταλείψει
  choice: akan meninggalkan
  rationale: Kata ini menyatakan tindakan meninggalkan rumah tangga orang tua untuk membentuk kesatuan perkawinan baru, tanpa harus menyiratkan penelantaran emosional.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Walaupun dapat berarti manusia secara umum, konteks perkawinan dan pasangan “istrinya” menunjukkan pihak laki-laki.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ayah dan ibunya
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa keduanya adalah orang tua laki-laki tersebut.
- source_word: προσκολληθήσεται
  choice: bersatu dengan
  rationale: Bentuk pasif mendatang ini menyampaikan keterikatan erat dalam kesatuan perkawinan. “Bersatu dengan” lebih alami daripada bentuk pasif yang kaku, sambil mempertahankan gagasan penyatuan.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: istrinya
  rationale: Dalam konteks perkawinan, γυνή berarti “istri”, bukan sekadar “perempuan”.
- source_word: ἔσονται οἱ δύο
  choice: keduanya akan menjadi
  rationale: Secara harfiah verba berarti “akan ada/menjadi”; dalam ungkapan hasil ini, “akan menjadi” merupakan bahasa Indonesia yang alami dan mempertahankan οἱ δύο sebagai “keduanya”.
- source_word: εἰς σάρκα μίαν
  choice: satu daging
  rationale: “Satu daging” mempertahankan citra jasmani-relasional dari kutipan Kejadian dan tidak meratakannya menjadi “satu tubuh”.
theological_decisions:
- issue: Bahasa bergender dalam kutipan tentang perkawinan
  choice: seorang laki-laki ... istrinya
  alternative: seseorang ... pasangannya
  rationale: Teks sumber menggambarkan pasangan laki-laki dan perempuan dalam kutipan Kejadian 2:24; terjemahan mempertahankan penandaan gender tersebut tanpa menetralkannya.
- issue: Makna σάρξ dalam εἰς σάρκα μίαν
  choice: satu daging
  alternative: satu tubuh
  rationale: Di sini σάρξ adalah bahasa jasmani dan relasional dari Kejadian, bukan metafora bagi tabiat berdosa. Ungkapan sumber dipertahankan tanpa memasukkan kategori teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mengikuti irama kutipan Kitab Suci, tetapi menghindari susunan yang kaku. Tidak diperlukan catatan kaki karena alternatif “Oleh sebab itu” tidak mengubah makna dan ambiguitas leksikal ἀντὶ τούτου dalam konteks ini tidak cukup penting untuk ditandai.
