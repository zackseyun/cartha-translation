    issue: “Sebab hal itu menimbulkan kehidupan yang tidak terkendali” tidak mempertahankan konstruksi ἐν ᾧ ἐστιν ἀσωτία.
    rationale: Teks Yunani menyatakan bahwa ἀσωτία ada “di dalamnya,” dengan ᾧ yang merujuk pada οἴνῳ. Draf mengubahnya menjadi akibat kausal eksplisit dan memakai “hal itu,” yang mengaburkan anteseden.
  - severity: medium
    issue: “Dipenuhi oleh Roh” mempersempit fungsi ἐν πνεύματι menjadi agen pasif.
    rationale: ἐν dapat menyatakan isi, lingkungan, atau sarana. “Dipenuhi dengan Roh” lebih idiomatis dalam kontras dengan “anggur” dan tidak memaksakan Roh semata-mata sebagai pelaku.
