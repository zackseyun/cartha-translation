  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: id
  text: Janganlah mabuk karena anggur, sebab di dalam anggur itu terdapat perilaku hidup tanpa kendali. Sebaliknya, hendaklah kalian dipenuhi dengan Roh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipenuhi di dalam Roh”; sebagian orang memahaminya secara lebih umum sebagai “dipenuhi dalam roh.”
    reason: alternative_reading
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: mabuk
  rationale: Imperatif kini pasif/deponen dengan μή menyatakan larangan. Bentuk alami dalam bahasa Indonesia ialah “janganlah mabuk,” yang dapat mencakup keadaan maupun proses menjadi mabuk.
- source_word: οἴνῳ
  choice: oleh anggur
  rationale: Datif menandai sarana atau zat yang menyebabkan kemabukan; “oleh anggur” alami dan mempertahankan hubungan sebab.
- source_word: ἐν ᾧ
  choice: sebab hal itu
  rationale: Konstruksi relatif merujuk pada anggur atau kemabukan oleh anggur. Dalam bahasa Indonesia, “sebab hal itu” menyampaikan hubungan tersebut tanpa memaksakan apakah antesedennya anggur secara sempit atau kemabukan yang baru disebut.
- source_word: ἀσωτία
  choice: kehidupan yang tidak terkendali
  rationale: Kata ini menunjuk pada perilaku boros, liar, dan tanpa kendali moral. Ungkapan ini jelas bagi pembaca modern serta cukup luas untuk mempertahankan cakupan maknanya.
- source_word: πληροῦσθε
  choice: hendaklah kalian dipenuhi
  rationale: Imperatif kini pasif menyatakan perintah yang berlaku terus-menerus atau berulang. “Hendaklah ... dipenuhi” mempertahankan bentuk pasif dan nuansa perintah tanpa membuat aspek duratif terlalu eksplisit.
- source_word: ἐν πνεύματι
  choice: oleh Roh
  rationale: ἐν dengan datif dapat menyatakan sarana, lingkungan, atau hubungan yang erat. “Oleh Roh” alami dalam konstruksi pasif Indonesia, sementara kemungkinan “di dalam Roh” dan rujukan kepada roh manusia dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan πνεύματι
  choice: Roh, yakni Roh Kudus
  alternative: roh atau roh kalian
  rationale: Dalam konteks nasihat Paulus, πνεύματι paling mungkin merujuk kepada Roh Kudus, meskipun tanpa artikel sehingga kemungkinan rujukan kepada roh manusia tidak boleh dihapus.
- issue: Fungsi ἐν dalam ἐν πνεύματι
  choice: oleh Roh
  alternative: di dalam Roh
  rationale: Pada verba pasif πληροῦσθε, frasa itu dapat dipahami sebagai sarana atau lingkungan. Teks utama memakai bentuk Indonesia yang alami, sedangkan alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “kalian” memperjelas bahwa perintah berbentuk jamak. Ungkapan “kehidupan yang tidak terkendali” dipilih agar makna etis ἀσωτία mudah dipahami tanpa mempersempitnya hanya pada pesta pora atau pemborosan.
