id: EPH.5.32
reference: Ephesians 5:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: id
  text: Rahasia ini besar[a], tetapi saya berbicara mengenai Mesias[b] dan jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Rahasia ini sangat penting” atau “Rahasia ini mendalam.” Secara harfiah, bahasa Yunani berbunyi “besar,” yang dapat menyatakan kebesaran atau pentingnya sesuatu, bukan hanya kedalamannya.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus”; di sini diterjemahkan “Mesias” karena Χριστός berfungsi sebagai gelar.'
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: rahasia
  rationale: Dalam pemakaian Paulus, kata ini menunjuk pada kebenaran ilahi yang sebelumnya tersembunyi lalu dinyatakan, bukan sekadar sesuatu yang membingungkan. “Rahasia” menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: μέγα
  choice: besar
  rationale: Ini adalah padanan langsung yang tetap membuka nuansa kebesaran, kepentingan, atau makna yang mendalam tanpa mempersempitnya hanya menjadi “mendalam”.
- source_word: δὲ
  choice: tetapi
  rationale: Kata ini menandai peralihan dengan kontras ringan menuju penjelasan Paulus tentang pokok pembicaraannya.
- source_word: λέγω
  choice: saya berbicara
  rationale: Padanan ini mempertahankan makna verbal dan kala kini, serta tidak seinterpretatif “yang saya maksud”.
- source_word: εἰς
  choice: mengenai
  rationale: Sesudah λέγω, preposisi ini menyatakan acuan atau pokok pembicaraan, bukan gerak menuju sesuatu.
- source_word: Χριστόν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam pernyataan teologis ini; “Mesias” mempertahankan arti gelar tersebut.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Di sini kata tersebut menunjuk pada umat sebagai persekutuan bersama. “Jemaat” menghindari kesan bahwa yang dimaksud terutama adalah gedung atau lembaga.
theological_decisions:
- issue: Acuan frasa “rahasia ini” dalam hubungan pernikahan, Mesias, dan jemaat
  choice: Tidak menentukan secara lebih sempit apa tepatnya yang disebut “rahasia ini”; teks utama mempertahankan urutan pernyataan dan penjelasan Paulus.
  alternative: Rahasia itu dapat dipahami secara khusus sebagai kesatuan satu daging dalam pernikahan, kutipan Kejadian 2:24, atau makna tipologis pernikahan yang menunjuk kepada Mesias dan jemaat.
  rationale: Teks Yunani sendiri tidak secara eksplisit memilih salah satu rumusan sempit tersebut. Terjemahan perlu mempertahankan ambiguitas dan ketegangan penafsirannya.
- issue: Χριστός sebagai gelar atau bentuk nama
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini, Χριστός menonjolkan pribadi yang bergelar Mesias dalam hubungannya dengan jemaat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat lugas serta dekat dengan susunan Yunani, tetapi “mengenai” dipakai secara idiomatis untuk εἰς setelah λέγω. Istilah “jemaat” dipilih agar acuan kepada umat sebagai persekutuan tetap jelas.
