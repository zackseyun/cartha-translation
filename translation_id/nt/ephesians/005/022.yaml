  footnotes:
  - marker: a
    text: 'Banyak terjemahan bahasa Inggris menambahkan kata “tunduklah” dari ayat 21: “Para istri, tunduklah kepada suami masing-masing seperti kepada Tuhan.” Teks Yunani ayat 22 sendiri bersifat eliptis dan bergantung pada klausa sebelumnya.'
