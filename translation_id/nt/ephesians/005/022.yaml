lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Hai istri
  rationale: Dalam konteks pengajaran rumah tangga dan dengan pasangan τοῖς ἰδίοις ἀνδράσιν, kata γυνή menunjuk kepada istri, bukan perempuan secara umum. Partikel seruan “Hai” membuat sapaan eliptis ini alami dalam bahasa Indonesia.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: kepada suamimu sendiri
  rationale: ἀνήρ bermakna “suami” dalam konteks perkawinan. ἰδίοις dipertahankan sebagai “sendiri” untuk menandai hubungan perkawinan masing-masing; bentuk “-mu” dipahami secara kolektif sesuai sapaan jamak Yunani.
- source_word: ὡς
  choice: seperti
  rationale: “Seperti” mempertahankan perbandingan sederhana dalam bahasa Yunani tanpa menentukan lebih jauh cakupan atau sifat analoginya.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: κύριος di sini merujuk kepada Tuhan dalam pemakaian Paulus. Preposisi “kepada” mengungkapkan hubungan datif yang sejajar dengan “kepada suamimu”.
- source_word: implicit verb from context
  choice: tidak dinyatakan dalam teks utama
  rationale: Ayat 22 dalam SBLGNT tidak memiliki verba tersurat dan secara sintaksis bergantung pada ὑποτασσόμενοι dalam ayat 21. Elipsis dipertahankan, sedangkan makna yang tersirat dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah kata “tunduklah” perlu ditambahkan dalam teks utama meskipun tidak terdapat dalam teks Yunani ayat 22
  choice: Tidak menambahkannya dalam teks utama; mempertahankan susunan eliptis dan menjelaskan kaitannya dengan ayat 21 dalam catatan kaki.
  alternative: Hai istri, tunduklah kepada suamimu sendiri seperti kepada Tuhan.
  rationale: Makna “tunduk” memang diteruskan secara sintaksis dari ayat 21, tetapi bukan kata yang tersurat dalam ayat 22. Mempertahankan elipsis menghormati bentuk sumber dan tidak menyamarkan ketergantungan ayat ini pada kalimat sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “Hai istri” dipilih agar fragmen eliptis tetap dapat dibaca secara alami tanpa memasukkan verba yang tidak tersurat. Koma penutup mempertahankan kesan bahwa kalimat berlanjut ke konteks berikutnya.
