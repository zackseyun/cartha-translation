  to: dengan senantiasa mengucap syukur atas segala sesuatu kepada Allah Bapa dalam nama Tuhan kita Yesus sang Mesias.[a][b]
  rationale: Revisi terbatas pada pemaduan τῷ θεῷ καὶ πατρί sebagai “Allah Bapa,” penghilangan koma yang tidak diperlukan dalam gelar Yesus, dan perbaikan kecil pada padanan alternatif di catatan kaki. Makna partisipial, cakupan “selalu,” ambiguitas terbatas πάντων, dan terjemahan gelar Mesias tetap dipertahankan.
