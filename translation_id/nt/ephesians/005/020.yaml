  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: id
  text: dengan senantiasa mengucap syukur atas segala sesuatu kepada Allah Bapa dalam nama Tuhan kita Yesus sang Mesias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih tradisional, “Yesus Kristus.”
    reason: alternative_reading
  - marker: b
    text: “Atas segala sesuatu” dapat juga diterjemahkan lebih harfiah “atas segala hal.” Bentuk Yunaninya juga mungkin dipahami sebagai “bagi semua orang,” meskipun konteks lebih mendukung arti yang mencakup segala keadaan atau perkara.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: mengucap syukur
  rationale: Partisipel kini aktif ini melanjutkan rangkaian nasihat dari konteks sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tindakan yang berlangsung.
- source_word: πάντοτε
  choice: senantiasa
  rationale: Menyampaikan cakupan waktu yang terus-menerus dengan ragam bahasa modern yang tetap bermartabat.
- source_word: ὑπὲρ πάντων
  choice: atas segala sesuatu
  rationale: Bentuk πάντων dapat dipahami sebagai netral ('segala sesuatu') atau maskulin ('semua orang'). Konteks lebih mendukung rasa menyeluruh mengenai segala hal, tetapi kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: ἐν ὀνόματι
  choice: dalam nama
  rationale: Mempertahankan ungkapan biblis yang lazim tanpa mempersempit daya representatif atau perantaraannya menjadi satu penafsiran saja.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan Indonesia yang baku bagi gelar kristologis κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus sang Mesias
  rationale: Χριστός masih berfungsi sebagai gelar. 'Sang Mesias' menyatakannya secara idiomatis dalam bahasa Indonesia, sementara bentuk tradisional dicatat sebagai alternatif.
- source_word: τῷ θεῷ καὶ πατρί
  choice: kepada Allah dan Bapa
  rationale: Datif menandai penerima ucapan syukur. Terjemahan ini mempertahankan kedua nomina yang dihubungkan καί dan tidak diam-diam menentukan apakah frasa tersebut sebaiknya dipadatkan menjadi 'Allah Bapa'.
theological_decisions:
- issue: Makna Χριστοῦ dalam gelar lengkap τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός secara leksikal berarti 'Yang Diurapi/Mesias' dan di sini tetap memiliki daya sebagai gelar. Bentuk gerejawi tradisional 'Kristus' dipertahankan dalam catatan kaki.
- issue: Hubungan sintaksis θεῷ καὶ πατρί
  choice: Allah dan Bapa
  alternative: Allah Bapa
  rationale: Terjemahan utama mempertahankan koordinasi Yunani secara lebih transparan. Alternatif Indonesia yang lebih konvensional dapat memberi kesan bahwa καί hanya bersifat eksplikatif, sehingga tidak dipilih untuk teks utama.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang wajar dan bermartabat. Kata 'dengan' membantu menandai hubungan partisipel ayat ini dengan konteks sebelumnya. Tanda baca mempertahankan kelancaran frasa panjang tanpa mengubah hubungan sintaksis pokok.
