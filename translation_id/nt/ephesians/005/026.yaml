lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan dan secara alami mempertahankan daya purposif dalam bahasa Indonesia.
- source_word: αὐτὴν
  choice: -nya
  rationale: Pronomina feminin tunggal ini merujuk kepada jemaat dalam konteks; bahasa Indonesia tidak menandai gender, sehingga bentuk enklitik -nya adalah padanan yang alami.
- source_word: ἁγιάσῃ
  choice: Ia menguduskannya
  rationale: Bentuk subjungtif aoris di bawah ἵνα menyatakan tujuan. 'Menguduskan' mempertahankan kaitan leksikal dengan kekudusan tanpa menjelaskan prosesnya secara berlebihan.
- source_word: καθαρίσας
  choice: setelah menyucikannya
  rationale: Partisip aoris paling wajar dipahami sebagai tindakan yang mendahului atau menyertai tindakan utama. 'Setelah' membuat hubungannya jelas dalam bahasa Indonesia tanpa mengubah pelaku maupun objek yang tersirat.
- source_word: τῷ λουτρῷ
  choice: dengan pembasuhan
  rationale: Datif ini paling mungkin menyatakan sarana. 'Pembasuhan' mempertahankan gambaran tindakan membasuh dan cocok dengan frasa genitif berikutnya.
- source_word: τοῦ ὕδατος
  choice: air
  rationale: Dalam frasa Indonesia 'pembasuhan air', hubungan genitif Yunani dapat dipertahankan secara ringkas dan alami tanpa menentukan lebih jauh fungsi air tersebut.
- source_word: ἐν ῥήματι
  choice: melalui firman
  rationale: ἐν dengan datif kemungkinan menyatakan sarana atau keadaan penyerta. 'Melalui' membedakannya secara alami dari sarana pembasuhan, tetapi tetap tidak menentukan secara sempit hubungan firman dengan air.
- source_word: ῥήματι
  choice: firman
  rationale: ῥῆμα dapat berarti perkataan, ucapan, atau pesan. 'Firman' sesuai dengan register Alkitab Indonesia dan konteks ucapan ilahi, sementara catatan kaki mempertahankan kemungkinan 'perkataan' atau 'pesan'.
theological_decisions:
- issue: Hubungan antara penyucian, pembasuhan air, dan firman dalam konteks yang mungkin bersifat baptisan atau sakramental
  choice: Mempertahankan gambaran pembasuhan air dan kaitannya dengan firman tanpa menentukan mekanisme sakramental tertentu.
  alternative: Menafsirkannya secara tegas sebagai baptisan sakramental, atau sebaliknya sebagai metafora yang sama sekali non-sakramental.
  rationale: Bahasa Yunani sangat mungkin membangkitkan gambaran baptisan, tetapi tidak dengan sendirinya menetapkan seberapa khusus atau sakramental rujukan itu.
- issue: Cakupan makna ῥήματι
  choice: Menggunakan 'firman' dalam teks utama.
  alternative: perkataan; ucapan; pesan; berita Injil
  rationale: Konteks dapat menunjuk kepada pesan yang diberitakan atau ucapan yang menyertai pembasuhan, tetapi istilah Yunani sendiri tidak menetapkan salah satu pengertian yang lebih sempit itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan khidmat. Kapitalisasi 'Ia' mengikuti kebiasaan penghormatan dalam teks Alkitab Indonesia. Susunan kalimat mempertahankan hubungan tujuan dan urutan tindakan, sedangkan catatan kaki menjaga ambiguitas leksikal serta teologis.
