id: EPH.5.3
reference: Ephesians 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: id
  text: Namun, percabulan, segala kenajisan, atau keserakahan bahkan jangan disebut di antara kalian[a], sebagaimana sepatutnya bagi orang-orang kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bahkan jangan dibicarakan di antara kalian.” Ungkapan ini juga dapat menyiratkan bahwa hal-hal tersebut jangan sampai dikenal ada di tengah jemaat.'
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang kudus” berarti umat yang dikhususkan bagi Allah, yaitu orang-orang percaya, bukan hanya suatu kelompok yang kemudian diberi gelar khusus.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: percabulan
  rationale: Dalam konteks etika seksual, πορνεία mencakup perilaku seksual yang tidak patut secara luas. “Percabulan” merupakan istilah Indonesia yang ringkas dan lazim dalam register Alkitab, tanpa membatasinya hanya pada hubungan pranikah.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan yang bernuansa kontras dari teladan kasih dan pengorbanan pada ayat sebelumnya; “Namun” menyampaikan hubungan itu secara wajar.
- source_word: ἀκαθαρσία πᾶσα
  choice: segala kenajisan
  rationale: πᾶσα memberi cakupan menyeluruh pada ἀκαθαρσία. “Segala kenajisan” mempertahankan keluasan dan bobot moral ungkapan Yunani.
- source_word: ἢ
  choice: atau
  rationale: ἤ bersifat disjungtif dan menghubungkan keserakahan sebagai kategori larangan berikutnya.
- source_word: πλεονεξία
  choice: keserakahan
  rationale: πλεονεξία menunjuk pada hasrat untuk memperoleh lebih banyak secara tamak dan tidak perlu dipersempit menjadi nafsu seksual, sekalipun muncul dalam konteks dosa seksual.
- source_word: μηδὲ ὀνομαζέσθω
  choice: bahkan jangan disebut
  rationale: Larangan imperatif pasif dengan μηδέ bersifat tegas, sedangkan “bahkan” mempertahankan penekanannya. Ungkapan ini sengaja mempertahankan kemungkinan makna ‘jangan sampai menjadi hal yang dikenal ada’ maupun ‘jangan disebut-sebut’.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Dalam konteks etika jemaat, frasa ini merujuk secara komunal kepada apa yang terdapat atau dikenal dalam lingkungan para pembaca.
- source_word: καθὼς πρέπει
  choice: sebagaimana sepatutnya
  rationale: Ungkapan ini menyatakan kesesuaian etis dengan identitas komunitas; padanan tersebut alami dan mempertahankan daya normatifnya.
- source_word: ἁγίοις
  choice: orang-orang kudus
  rationale: ἅγιοι adalah sebutan Paulus bagi umat yang dikhususkan bagi Allah. “Orang-orang kudus” lebih transparan dalam bahasa Indonesia daripada “santo” dan tidak menyiratkan kelas yang baru ditetapkan kudus sesudah zaman para rasul.
theological_decisions:
- issue: Makna πλεονεξία dalam daftar keburukan yang mencakup dosa seksual
  choice: keserakahan dalam arti luas
  alternative: ketamakan seksual atau hawa nafsu
  rationale: Walaupun konteks dekatnya menyangkut etika seksual, pemakaian Paulus tidak mengharuskan πλεονεξία dibatasi pada hasrat seksual. Terjemahan mempertahankan cakupan moral yang lebih luas.
- issue: Rujukan ἁγίοις
  choice: semua orang percaya sebagai umat yang dikhususkan bagi Allah
  alternative: kelompok khusus yang kemudian dikanonisasi sebagai santo atau santa
  rationale: Dalam surat-surat Paulus, istilah ini merupakan identitas komunal umat Allah, bukan gelar bagi suatu kelas orang percaya yang ditetapkan pada masa kemudian.
- issue: Cakupan larangan μηδὲ ὀνομαζέσθω
  choice: mempertahankan ungkapan ‘bahkan jangan disebut’ beserta ambiguitasnya
  alternative: menafsirkan secara eksklusif sebagai larangan membicarakan dosa-dosa tersebut
  rationale: Larangan itu dapat menunjuk pada dosa yang tidak boleh sampai dikenal ada di tengah jemaat, atau pada hal yang tidak pantas disebut-sebut. Teks utama tidak menutup salah satu nuansa secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak diterjemahkan “kalian” agar ἐν ὑμῖν terbaca jelas sebagai bentuk jamak; istilah “orang-orang kudus” mempertahankan identitas teologis Paulus sekaligus menghindari asosiasi sempit dengan gelar kanonisasi.
