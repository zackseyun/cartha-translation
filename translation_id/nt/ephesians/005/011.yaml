  to: Janganlah turut mengambil bagian dalam perbuatan-perbuatan kegelapan yang tidak menghasilkan buah[a]. Sebaliknya, justru singkapkanlah perbuatan-perbuatan itu[b].
  rationale: Revisi mengganti idiom yang kurang tegas dengan "singkapkanlah", yang lebih langsung menyampaikan penyingkapan yang tersirat oleh ἐλέγχετε dan sesuai dengan konteks terang-kegelapan. "Justru" secara alami mempertahankan penguatan dalam kontras Yunani. Metafora buah, istilah utama, dan alternatif makna yang sah tetap dipertahankan.
