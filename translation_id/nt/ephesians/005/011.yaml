id: EPH.5.11
reference: Ephesians 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: id
  text: Janganlah turut mengambil bagian dalam perbuatan-perbuatan kegelapan yang tidak menghasilkan buah[a]. Sebaliknya, justru singkapkanlah perbuatan-perbuatan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ikut serta dalam" atau "bersekutu dengan".
    reason: lexical_alternative
  - marker: b
    text: Atau "tegurlah" atau "tunjukkanlah kesalahannya". Kata Yunani ini dapat mencakup teguran lisan, tetapi dalam konteks ini juga menyiratkan tindakan membawa perbuatan-perbuatan tersebut ke dalam terang.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: turut mengambil bagian dalam
  rationale: Ungkapan ini menyampaikan keterlibatan bersama atau keikutsertaan aktif. Kata "turut" mempertahankan unsur kebersamaan yang terdapat dalam prefiks συν-.
- source_word: ἔργοις
  choice: perbuatan-perbuatan
  rationale: Dalam konteks etis ini, "perbuatan-perbuatan" terdengar alami dalam bahasa Indonesia dan menunjuk pada tindakan nyata.
- source_word: ἀκάρποις
  choice: yang tidak menghasilkan buah
  rationale: Terjemahan ini mempertahankan metafora buah dalam bahasa Yunani sekaligus jelas bagi pembaca modern; frasa ini juga berhubungan dengan gambaran "buah terang" dalam ayat 9.
- source_word: τοῦ σκότους
  choice: kegelapan
  rationale: Bentuk "perbuatan-perbuatan kegelapan" mempertahankan hubungan genitif yang ringkas dan metafora moral terang-kegelapan tanpa menentukan hubungan itu secara lebih sempit.
- source_word: μᾶλλον δὲ καὶ
  choice: Sebaliknya
  rationale: Kata ini menyampaikan kontras kuat antara tidak ikut serta dan tindakan positif yang diperintahkan. Unsur καί dipahami sebagai penegasan langkah lebih jauh dan dijelaskan melalui catatan kaki agar kalimat utama tetap alami.
- source_word: ἐλέγχετε
  choice: nyatakanlah ... apa adanya
  rationale: Dalam konteks terang yang membuat sesuatu tampak (ayat 13), ungkapan ini menyampaikan tindakan menyingkapkan watak sebenarnya dari perbuatan tersebut, sambil tidak sepenuhnya meniadakan unsur teguran atau kecaman moral.
theological_decisions:
- issue: Makna ἐλέγχετε terhadap perbuatan jahat
  choice: nyatakanlah perbuatan-perbuatan itu apa adanya
  alternative: singkapkanlah / tegurlah perbuatan-perbuatan itu
  rationale: Konteks ayat 8-13 menekankan terang dan penampakan, sehingga makna penyingkapan perlu terdengar. Namun, karena verba Yunani juga dapat berarti menegur atau menunjukkan kesalahan, keragaman maknanya dipertahankan dalam catatan kaki.
- issue: Kekuatan kontras dalam perintah
  choice: Janganlah turut mengambil bagian ... Sebaliknya, nyatakanlah
  alternative: Janganlah bersekutu ... tetapi bahkan tegurlah
  rationale: 'Terjemahan mempertahankan dua sisi perintah: menjauhi keterlibatan dan secara aktif menghadapi perbuatan kegelapan, tanpa menetapkan satu metode khusus yang tidak dinyatakan oleh teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat memperjelas kontras imperatif. Metafora kegelapan dan buah dipertahankan, sedangkan ungkapan "nyatakanlah ... apa adanya" dipilih agar citra penyingkapan dalam konteks terang tetap alami bagi pembaca umum.
