source:
  edition: SBLGNT
  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: id
  text: Namun, hendaklah kamu juga, masing-masing, mengasihi istrinya sendiri sama seperti dirinya sendiri, dan hendaklah istri menghormati[a] suaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “takut kepada” atau “menaruh rasa segan terhadap”; di sini kata itu menyatakan penghormatan, bukan rasa gentar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai peralihan penutup dari uraian sebelumnya menuju rangkuman praktis, sambil mempertahankan nuansa pembatas atau pertentangan ringan.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: Mempertahankan penekanan bahwa para pembaca pun termasuk secara langsung dalam nasihat ini.
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: masing-masing
  rationale: Ungkapan distributif ini menekankan bahwa perintah tersebut berlaku kepada setiap suami secara pribadi; 'masing-masing' menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: istrinya sendiri
  rationale: Dalam konteks rumah tangga, γυνή berarti 'istri', sedangkan ἑαυτοῦ memberi penekanan refleksif 'sendiri'.
- source_word: οὕτως
  choice: seperti itu
  rationale: οὕτως menunjuk kembali kepada cara mengasihi yang telah dijelaskan sebelumnya. Dalam susunan Indonesia, rujukan tersebut tetap hadir melalui perbandingan 'seperti dirinya sendiri' dan konteks langsung.
- source_word: ἀγαπάτω
  choice: hendaklah ... mengasihi
  rationale: Imperatif kini orang ketiga tunggal diterjemahkan dengan bentuk nasihat-perintah yang jelas, wajar, dan bermartabat.
- source_word: ὡς ἑαυτόν
  choice: seperti dirinya sendiri
  rationale: Mempertahankan perbandingan refleksif yang menjadi ukuran kasih kepada istri.
- source_word: ἡ δὲ γυνὴ
  choice: dan hendaklah istri
  rationale: δέ memperkenalkan bagian kedua dari rangkuman berpasangan; 'dan' terdengar alami tanpa menghilangkan peralihannya.
- source_word: ἵνα φοβῆται
  choice: hendaklah ... menghormati
  rationale: φοβέομαι secara leksikal dapat berarti takut, segan, atau menaruh hormat. Dalam nasihat perkawinan ini, 'menghormati' menyampaikan sikap hormat yang dimaksud tanpa menyiratkan rasa gentar; makna harfiahnya dicatat dalam catatan kaki.
- source_word: τὸν ἄνδρα
  choice: suaminya
  rationale: Dalam konteks perkawinan, ἀνήρ berarti 'suami'; akhiran posesif menghasilkan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Makna φοβῆται dalam nasihat kepada istri
  choice: menghormati
  alternative: takut kepada; menaruh rasa segan terhadap
  rationale: Kata Yunani ini memiliki rentang makna takut, segan, dan hormat. Konteks relasi perkawinan mendukung penghormatan atau rasa segan, bukan ketakutan karena ancaman. Catatan kaki mempertahankan transparansi terhadap bentuk leksikalnya.
- issue: Bentuk nasihat yang khusus menyebut suami dan istri
  choice: istrinya sendiri ... istri ... suaminya
  alternative: pasangan masing-masing
  rationale: Teks Yunani memakai bentuk tunggal bergender dalam konteks suami-istri. Terjemahan mempertahankan kekhususan tersebut dan tidak menetralkannya.
- issue: Kekuatan imperatif pada kedua klausa
  choice: hendaklah ... mengasihi ... dan hendaklah ... menghormati
  alternative: harus mengasihi ... dan harus menghormati
  rationale: Imperatif ἀγαπάτω dan konstruksi ἵνα dengan subjungtif φοβῆται sama-sama menyampaikan dorongan normatif. Pengulangan 'hendaklah' membuat hubungan kedua nasihat jelas tanpa memperkerasnya melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. Susunan dibuat alami bagi pembaca umum, sementara daya distributif 'masing-masing', bentuk gendered suami-istri, dan keluasan makna φοβῆται tetap dipertahankan.
