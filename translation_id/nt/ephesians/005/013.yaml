  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: id
  text: Namun, segala sesuatu yang disingkapkan oleh terang menjadi kelihatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, segala sesuatu, ketika disingkapkan oleh terang, menjadi nyata.” Bentuk partisip dan kata kerja Yunaninya dapat dipahami dengan cara yang sangat berdekatan, dengan penekanan pada tindakan penyingkapan atau pada hasilnya, yaitu menjadi kelihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral berartikel ini bersifat luas dan menyeluruh; 'segala sesuatu' adalah ungkapan Indonesia yang alami tanpa mempersempit cakupannya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai pertentangan atau perkembangan ringan dari pernyataan sebelumnya; 'Namun' menyampaikan peralihan adversatif itu secara wajar.
- source_word: ἐλεγχόμενα
  choice: yang disingkapkan
  rationale: Dalam konteks terang dan kata φανεροῦται, ἐλέγχω menunjuk pada tindakan membongkar atau menampakkan apa yang tersembunyi, bukan hanya menegur atau menyatakan bersalah. Bentuk ini juga mempertahankan makna pasif partisipnya.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: oleh terang
  rationale: ὑπό dengan genitif menandai pelaku atau sarana yang menyebabkan penyingkapan. 'Terang' dipakai tanpa penjelasan tambahan agar metafora dan acuannya tetap terbuka sesuai teks.
- source_word: φανεροῦται
  choice: menjadi kelihatan
  rationale: Bentuk pasif φανερόω dapat berarti menjadi nyata atau kelihatan. 'Menjadi kelihatan' cocok dengan citra terang dan mengungkapkan hasil penyingkapan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan 'terang' dalam konteks
  choice: Menerjemahkan sebagai 'terang' tanpa menentukan acuannya di dalam ayat ini.
  alternative: Kristus; Injil; kebenaran moral; atau kesaksian komunitas orang percaya.
  rationale: Konteks menyebut orang percaya sebagai terang di dalam Tuhan dan berbicara tentang menyingkapkan perbuatan kegelapan, tetapi ayat ini sendiri tidak secara eksplisit membatasi acuan 'terang'. Terjemahan mempertahankan keluasan metafora itu.
- issue: Hubungan sintaksis antara ἐλεγχόμενα dan φανεροῦται
  choice: Segala sesuatu yang disingkapkan oleh terang menjadi kelihatan.
  alternative: Segala sesuatu, ketika disingkapkan oleh terang, dibuat nyata.
  rationale: 'Partisip dan verba utamanya memungkinkan nuansa yang sangat berdekatan: penekanan dapat jatuh pada tindakan penyingkapan atau pada hasil berupa keterlihatan. Teks utama memakai susunan relatif yang alami, sedangkan catatan kaki mempertahankan kemungkinan nuansa alternatif.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Disingkapkan' dipilih untuk mempertahankan citra terbukanya hal yang tersembunyi oleh terang, sedangkan 'menjadi kelihatan' menyampaikan hasilnya dengan jelas bagi pembaca umum.
