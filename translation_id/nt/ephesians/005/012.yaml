  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: id
  text: Sebab, bahkan membicarakan apa yang mereka lakukan secara tersembunyi pun memalukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal-hal yang dilakukan oleh mereka secara tersembunyi.”
    reason: Alternatif yang lebih formal untuk konstruksi substantival τὰ ... γινόμενα, dengan mempertahankan bentuk pasif dan pelaku yang dinyatakan oleh ὑπ’ αὐτῶν.
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: apa yang ... lakukan
  rationale: Artikel dengan participel berfungsi substantival dan menunjuk pada tindakan. Bentuk aktif dengan pelaku yang dinyatakan menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah hubungan pelaku-tindakan dalam teks Yunani.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memberikan alasan atau penjelasan bagi nasihat sebelumnya; 'Sebab' mempertahankan kaitan argumentatif tersebut.
- source_word: κρυφῇ
  choice: secara tersembunyi
  rationale: Bentuk datif adverbial ini menyatakan bahwa tindakan dilakukan secara rahasia atau tersembunyi. Pilihan ini mempertahankan gagasan penyembunyian dengan bahasa Indonesia yang wajar.
- source_word: γινόμενα
  choice: lakukan
  rationale: Dalam konstruksi bersama ὑπ’ αὐτῶν, participel ini merujuk pada hal-hal yang dilakukan oleh mereka. Ungkapan 'apa yang mereka lakukan' lebih alami daripada bentuk pasif kaku, sementara aspek kini tidak perlu ditonjolkan.
- source_word: ὑπ’ αὐτῶν
  choice: mereka
  rationale: Ὑπό dengan genitif menandai pelaku. Susunan aktif bahasa Indonesia tetap mempertahankan pelaku pronominal tanpa menentukan rujukannya lebih jauh.
- source_word: αἰσχρόν
  choice: memalukan
  rationale: Kata ini menyatakan sesuatu yang tercela atau mendatangkan malu secara moral. 'Memalukan' jelas, modern, dan tidak melebih-lebihkan daya etikanya.
- source_word: καὶ λέγειν
  choice: bahkan ... untuk dibicarakan
  rationale: καί bersifat askensif, yaitu 'bahkan'. 'Dibicarakan' secara alami menyampaikan maksud menyebut atau berbicara mengenai tindakan-tindakan itu.
theological_decisions:
- issue: Cakupan αὐτῶν
  choice: Mempertahankan kata ganti sebagai 'mereka' tanpa menentukan antesedennya dalam ayat.
  alternative: Menjabarkannya sebagai 'orang-orang yang tidak taat' atau 'anak-anak durhaka'.
  rationale: Rujukan kata ganti tersedia dari konteks sekitar. Menentukan kelompok itu secara eksplisit dalam ayat akan menambahkan penafsiran yang tidak dinyatakan dalam klausa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan aktif dipilih demi kealamian, sedangkan 'bahkan' mempertahankan penekanan retoris teks Yunani.
