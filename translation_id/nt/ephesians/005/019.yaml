  text: hendaklah kalian berkata-kata satu sama lain dengan mazmur, puji-pujian, dan nyanyian rohani[a], sambil bernyanyi dan melantunkan pujian dengan hati kalian kepada Tuhan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “di antara kalian” atau “kepada diri kalian sendiri”; dalam bentuk jamak, kata Yunani yang secara harfiah bersifat refleksif ini lazim dipahami secara timbal balik: “satu sama lain.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “bermazmur”; kata Yunani ini dapat berarti menyanyikan pujian atau melantunkan musik, tanpa dengan sendirinya menentukan adanya iringan alat musik.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: berkata-kata
  rationale: Mempertahankan arti luas verba partisipial ‘berbicara’ tanpa mempersempitnya menjadi sapaan atau pengajaran formal; dalam bahasa Indonesia ungkapan ini juga dapat mencakup tuturan yang dinyanyikan.
- source_word: ἑαυτοῖς
  choice: satu sama lain
  rationale: Dalam konteks jamak, bentuk refleksif ini paling wajar dipahami secara timbal balik dan menunjuk pada persekutuan jemaat.
- source_word: ψαλμοῖς
  choice: mazmur
  rationale: Padanan baku yang mempertahankan kategori pertama dalam rangkaian tiga jenis nyanyian, tanpa membatasinya secara tegas hanya pada kitab Mazmur kanonis.
- source_word: ὕμνοις
  choice: puji-pujian
  rationale: Padanan Indonesia yang alami untuk nyanyian pujian dan tetap membedakannya dari ‘mazmur’ serta ‘nyanyian rohani’.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: nyanyian rohani
  rationale: Menerjemahkan adjektiva πνευματικαῖς secara langsung tanpa menambahkan klaim yang lebih kuat bahwa setiap nyanyian tersebut diilhamkan secara khusus oleh Roh.
- source_word: ᾄδοντες
  choice: sambil bernyanyi
  rationale: Padanan langsung yang menjaga hubungan partisipialnya dengan perintah utama dalam konteks.
- source_word: ψάλλοντες
  choice: melantunkan pujian
  rationale: Mengungkapkan tindakan musikal dan pujian secara alami dalam bahasa Indonesia tanpa menetapkan ada atau tidaknya alat musik.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: dengan segenap hati
  rationale: Menyampaikan fungsi datif sebagai cara atau ranah batin secara idiomatis; ‘segenap’ menegaskan keterlibatan batin, bukan menambahkan organ atau tindakan lahiriah.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Menerjemahkan datif sebagai arah atau penerima nyanyian dan pujian, serta mempertahankan sebutan κύριος tanpa memperjelas referennya melampaui bunyi ayat.
theological_decisions:
- issue: Makna ψάλλοντες dalam kaitannya dengan praktik musik
  choice: Diterjemahkan ‘melantunkan pujian’ tanpa menentukan penggunaan alat musik.
  alternative: ‘bermazmur’, ‘membuat melodi’, atau ‘memetik/memainkan alat musik’
  rationale: Dalam konteks Yunani Koine, verba ini dapat menunjuk pada nyanyian atau pujian musikal, tetapi ayat ini tidak mewajibkan maupun melarang iringan alat musik.
- issue: Referen κύριος
  choice: Dipertahankan sebagai ‘Tuhan’.
  alternative: Diperjelas menjadi ‘Tuhan Yesus’ atau ‘Kristus’
  rationale: Konteks Efesus mungkin mengarah kepada Kristus, tetapi ayat ini sendiri hanya memakai κύριος; terjemahan tidak menambahkan identifikasi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. ‘Kalian’ dipakai untuk memperjelas bahwa sapaan Yunani berbentuk jamak. Susunan partisipial diterjemahkan sebagai rangkaian ajakan yang mengalir dan tetap terkait dengan konteks ayat sebelumnya.
