translation:
  language: id
  text: karena kita adalah anggota tubuh-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah menambahkan, “dari daging-Nya dan dari tulang-tulang-Nya.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “karena” mempertahankan daya kausalnya secara alami dalam bahasa Indonesia modern.
- source_word: μέλη
  choice: anggota-anggota
  rationale: Bentuk jamak ini menunjuk pada bagian-bagian penyusun tubuh. “Anggota-anggota” mempertahankan gambaran tubuh sekaligus makna kebersamaan dalam pemakaian Paulus.
- source_word: ἐσμὲν
  choice: kita adalah
  rationale: Bentuk kini indikatif diterjemahkan secara langsung; “adalah” memperjelas hubungan predikatif dalam kalimat pendek ini.
- source_word: τοῦ σώματος
  choice: tubuh
  rationale: “Tubuh” merupakan padanan langsung dan wajar, serta mempertahankan metafora Paulus tentang umat sebagai tubuh Kristus.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini merujuk kepada Kristus dalam konteks sekitar. Bentuk hormat “-Nya” adalah konvensi bahasa Indonesia yang lazim untuk rujukan kepada Kristus.
theological_decisions:
- issue: Apakah frasa tambahan “dari daging-Nya dan dari tulang-tulang-Nya” dimasukkan ke dalam teks utama
  choice: 'Menerjemahkan hanya teks SBLGNT yang lebih pendek: “karena kita adalah anggota-anggota tubuh-Nya.”'
  alternative: “karena kita adalah anggota-anggota tubuh-Nya, dari daging-Nya dan dari tulang-tulang-Nya”
  rationale: Teks sumber yang diberikan memuat bacaan pendek. Bacaan panjang kemungkinan merupakan perluasan yang dipengaruhi bahasa Kejadian 2:23; demi transparansi, varian itu dicatat dalam catatan kaki dan tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “anggota-anggota” dipakai untuk menyatakan jamak secara eksplisit dan mempertahankan citra bagian-bagian tubuh.
