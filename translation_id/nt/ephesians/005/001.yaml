  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: id
  text: Karena itu[a], jadilah peniru Allah sebagai anak-anak yang dikasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Teruslah menjadi peniru Allah”; bentuk perintah Yunani dapat menekankan proses menjadi ataupun keadaan yang berlangsung terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: jadilah
  rationale: Bentuk imperatif kini dari γίνομαι dapat menyatakan proses menjadi atau keadaan yang terus dijalani. “Jadilah” mempertahankan dorongan untuk menjadi tanpa menghilangkan kemungkinan nuansa berkelanjutan, yang dicatat dalam catatan kaki.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: μιμηταὶ
  choice: peniru-peniru
  rationale: Nomina ini secara langsung menunjuk kepada orang-orang yang meniru atau meneladani. “Peniru-peniru” mempertahankan citra eksplisit tentang imitasi; “pengikut” terlalu umum.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif menyatakan objek yang ditiru; konstruksi Indonesia yang wajar ialah “peniru-peniru Allah”.
- source_word: ὡς
  choice: sebagai
  rationale: Mempertahankan hubungan ringkas antara perintah dan identitas mereka sebagai anak-anak yang dikasihi, tanpa mempertegasnya menjadi hubungan sebab yang tidak dinyatakan secara eksplisit.
- source_word: τέκνα
  choice: anak-anak
  rationale: Istilah ini mencakup semua gender dan menekankan hubungan sebagai anak, bukan khusus anak laki-laki.
- source_word: ἀγαπητά
  choice: yang dikasihi
  rationale: Menyampaikan keadaan sebagai pihak yang dikasihi dengan bahasa Indonesia yang alami, jelas, dan bermartabat.
theological_decisions:
- issue: Kekuatan nasihat dalam hubungannya dengan status sebagai anak
  choice: Perintah untuk meniru Allah disampaikan kepada mereka dalam kapasitas mereka sebagai anak-anak yang dikasihi, tanpa menyiratkan bahwa peniruan membuat mereka menjadi anak-anak Allah.
  alternative: 'Frasa itu dapat dibaca lebih longgar sebagai perbandingan: tirulah Allah seperti yang dilakukan anak-anak yang dikasihi.'
  rationale: ὡς τέκνα ἀγαπητά mengaitkan nasihat dengan identitas atau cara hidup sebagai anak-anak yang dikasihi. Terjemahan “sebagai” mempertahankan kepadatan dan ketegangan sintaksis itu tanpa menambahkan doktrin adopsi yang tidak disebutkan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. “Peniru-peniru” dipilih meskipun sedikit lebih tajam daripada “teladanilah,” karena mempertahankan bentuk nomina dan motif imitasi dalam teks Yunani. Tanda koma akhir dari kutipan sumber tidak dipertahankan karena ayat ini disajikan sebagai satu kalimat mandiri.
