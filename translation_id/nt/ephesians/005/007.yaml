  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: id
  text: Karena itu, janganlah menjadi orang yang turut serta dengan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah menjadi rekan mereka” atau “janganlah mengambil bagian bersama mereka.” Dalam konteks ini, ungkapan tersebut dapat merujuk pada keterlibatan dalam perilaku berdosa mereka atau dalam akibatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: janganlah
  rationale: Negasi yang menyertai bentuk imperatif; “janganlah” menyampaikan larangan secara jelas dan wajar dalam bahasa Indonesia yang bermartabat.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari peringatan pada ayat-ayat sebelumnya dan mempertahankan hubungan logisnya.
- source_word: γίνεσθε
  choice: menjadi
  rationale: Mempertahankan nuansa γίνομαι sebagai memasuki atau mengambil suatu keadaan, bukan sekadar berada dalam keadaan itu.
- source_word: συμμέτοχοι
  choice: orang-orang yang turut mengambil bagian
  rationale: Mengungkapkan gagasan berbagi atau berpartisipasi bersama pihak lain dalam bahasa Indonesia modern tanpa membatasi secara eksplisit apa yang dibagikan.
- source_word: αὐτῶν
  choice: bersama mereka
  rationale: Pronomina tersebut merujuk kepada orang-orang dalam konteks sebelumnya. Bentuk ini menjaga rujukan kepada pribadi-pribadi tanpa menambahkan “perbuatan mereka” ke dalam teks utama.
theological_decisions:
- issue: Cakupan partisipasi yang tersirat dalam συμμέτοχοι αὐτῶν
  choice: Larangan umum untuk turut mengambil bagian bersama mereka, dengan objek partisipasi dibiarkan tersirat.
  alternative: Jangan turut mengambil bagian dalam perbuatan mereka.
  rationale: Teks Yunani secara eksplisit merujuk kepada “mereka,” sedangkan konteks menyiratkan keikutsertaan dalam perilaku berdosa mereka dan kemungkinan akibatnya. Terjemahan utama mempertahankan ketegangan ini tanpa mempersempit makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Turut mengambil bagian bersama mereka” dipilih untuk mempertahankan makna partisipatif sekaligus rujukan eksplisit kepada orang-orang, meskipun susunannya sedikit lebih panjang demi ketepatan.
