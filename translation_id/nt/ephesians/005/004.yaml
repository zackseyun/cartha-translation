  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: id
  text: Jangan ada kecabulan, perkataan bodoh, atau lelucon kasar[a]—semua itu tidak pantas[b]—melainkan ucapan syukur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gurauan tidak senonoh”. Kata Yunani ini dalam konteks lain dapat berarti kelucuan atau kecerdikan, tetapi di sini digunakan secara negatif karena digolongkan bersama hal-hal yang tidak pantas.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak patut” atau “tidak sesuai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: kecabulan
  rationale: Dalam rangkaian yang berpusat pada tutur kata dan dikontraskan dengan ucapan syukur, kata ini menunjuk pada ungkapan yang memalukan atau tidak senonoh. 'Kecabulan' ringkas dan alami, tanpa membatasi maknanya hanya pada satu bentuk ujaran tertentu.
- source_word: μωρολογία
  choice: perkataan bodoh
  rationale: Pilihan ini menyampaikan arti harfiah gabungan kata tersebut, yakni tutur kata yang bodoh atau tidak bernalar, dalam bahasa Indonesia yang jelas.
- source_word: ἢ
  choice: atau
  rationale: Kata penghubung ini secara langsung menghubungkan unsur terakhir dalam daftar; konteks tetap menunjukkan bahwa seluruh daftar ditolak.
- source_word: εὐτραπελία
  choice: lelucon kasar
  rationale: Walaupun kata Yunani ini dalam konteks lain dapat berarti kelucuan atau kecerdikan, pengelompokannya bersama keburukan dan penilaian bahwa hal-hal itu tidak pantas menuntut nuansa negatif di sini.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: semua itu tidak pantas
  rationale: Frasa ini merujuk secara kolektif kepada unsur-unsur sebelumnya. 'Tidak pantas' mempertahankan penilaian tentang apa yang tidak patut atau tidak sesuai.
- source_word: ἀλλὰ μᾶλλον
  choice: melainkan
  rationale: Dalam susunan larangan ini, 'melainkan' secara alami menandai penggantian yang tegas antara tutur kata yang ditolak dan ucapan syukur.
- source_word: εὐχαριστία
  choice: ucapan syukur
  rationale: Nomina ini menunjuk pada ungkapan rasa terima kasih. 'Ucapan syukur' mempertahankan kontras dengan bentuk-bentuk perkataan sebelumnya dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan daftar keburukan dalam kaitannya dengan tutur kata
  choice: Memahami ketiga nomina terutama sebagai keburukan yang terungkap dalam perkataan, lalu mengontraskannya dengan ucapan syukur.
  alternative: Memahami αἰσχρότης secara lebih luas sebagai segala bentuk ketidaksenonohan moral, bukan terutama ujaran tidak senonoh.
  rationale: Konteks langsung memuat dua istilah yang jelas berkaitan dengan perkataan dan mengontraskannya dengan εὐχαριστία, yang juga dapat berupa ungkapan lisan. Terjemahan tetap cukup luas agar tidak menutup cakupan perilaku yang mungkin tersirat.
- issue: Penilaian moral terhadap εὐτραπελία
  choice: Menerjemahkannya secara negatif sebagai 'lelucon kasar'.
  alternative: Menerjemahkannya secara netral sebagai 'kelucuan' atau 'kecerdikan'.
  rationale: Kedudukannya dalam daftar keburukan dan klausa 'semua itu tidak pantas' memberi kata ini makna peyoratif dalam konteks ini, walaupun pemakaian Yunani di luar konteks tersebut dapat bersifat positif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk 'Jangan ada' melanjutkan daya larangan dari konteks kalimat Yunani, sedangkan tanda pisah menjaga rujukan kolektif klausa relatif tanpa menghasilkan kalimat yang kaku. Semua penanda catatan kaki dicantumkan dalam teks utama.
