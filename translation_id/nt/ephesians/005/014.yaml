id: EPH.5.14
reference: Ephesians 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: id
  text: Sebab segala sesuatu yang dibuat tampak adalah terang.[a] Karena itu dikatakan, “Bangunlah, hai orang yang tidur, dan bangkitlah dari antara orang mati,[b] dan Mesias akan menyinarimu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala sesuatu yang disingkapkan adalah terang.” Kata Yunani φανερούμενον dapat berarti “dibuat tampak,” “disingkapkan,” atau “menjadi nyata.”
    reason: lexical_alternative
  - marker: b
    text: Sumber kutipan ini tidak pasti. Kutipan ini mungkin menggemakan tema-tema Kitab Suci, khususnya Yesaya 60:1, atau berasal dari sebuah nyanyian Kristen mula-mula.
    reason: cross_reference
  - marker: c
    text: 'Yunani: “sang Kristus.” Di sini Χριστός diterjemahkan “Mesias” karena berfungsi sebagai gelar. Terjemahan tradisional: “Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν
  choice: segala sesuatu
  rationale: Bentuk netral tunggal bersama partisip berartikel dipahami secara umum. Pilihan ini mempertahankan cakupan luas tanpa memaksakan bahwa acuannya hanya manusia.
- source_word: φανερούμενον
  choice: yang dibuat tampak
  rationale: Partisip pasif ini dapat berarti dibuat terlihat, disingkapkan, atau menjadi nyata. Pilihan utama mempertahankan bentuk pasif dan kaitannya dengan gambaran terang, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: φῶς
  choice: terang
  rationale: Padanan langsung yang mempertahankan daya metaforis ungkapan Yunani tanpa menjelaskannya secara berlebihan.
- source_word: διὸ λέγει
  choice: Karena itu dikatakan
  rationale: Bentuk pasif impersonal alami dalam bahasa Indonesia dan tidak menetapkan siapa yang berbicara atau apa sumber kutipan tersebut, sesuai dengan ketidakjelasan teks Yunani.
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: Bangunlah, hai orang yang tidur
  rationale: Menyampaikan perintah dan sapaan secara jelas serta mempertahankan metafora tidur.
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: bangkitlah dari antara orang mati
  rationale: Kata 'bangkitlah' mempertahankan gema kebangkitan, sedangkan 'dari antara orang mati' menyatakan konstruksi Yunani secara alami dan cukup dekat.
- source_word: ἐπιφαύσει σοι
  choice: akan menyinarimu
  rationale: Mempertahankan citra terang dan menyampaikan tindakan menyinari seseorang secara ringkas dalam bahasa Indonesia modern.
- source_word: ὁ Χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konteks ini. 'Mesias' menyampaikan makna gelarnya, bukan memperlakukannya semata-mata sebagai nama diri.
theological_decisions:
- issue: Sumber kutipan pengantar
  choice: dikatakan
  alternative: Kitab Suci berkata / Ia berkata / sebuah nyanyian berkata
  rationale: Subjek λέγει tidak disebutkan, dan asal kutipannya tidak pasti. Terjemahan impersonal mempertahankan keterbukaan teks.
- issue: Makna πᾶν τὸ φανερούμενον φῶς ἐστιν
  choice: segala sesuatu yang dibuat tampak adalah terang
  alternative: segala sesuatu yang disingkapkan adalah terang
  rationale: Kalimat Yunani mengandung ketegangan metaforis dan dapat dipahami dengan lebih dari satu nuansa. Terjemahan utama tidak menambahkan penjelasan yang akan menyelesaikan ketegangan itu secara sepihak.
- issue: Penerjemahan ὁ Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini istilah tersebut berfungsi sebagai gelar. 'Mesias' mengungkapkan arti gelar itu, sementara bentuk tradisional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Bentuk 'dikatakan' dipakai untuk menjaga ketidakjelasan sumber kutipan; pengulangan kata sambung 'dan' mempertahankan irama tiga bagian dalam teks Yunani.
