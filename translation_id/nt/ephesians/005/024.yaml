  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: id
  text: Namun, sebagaimana jemaat tunduk kepada Mesias[a], demikian juga para istri tunduk kepada suami mereka dalam segala hal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.”
    reason: Mencatat padanan tradisional bagi gelar Yunani Χριστός, sementara teks utama menerjemahkan maknanya sebagai “Mesias”.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai kontras sekaligus melanjutkan uraian sebelumnya dengan penghubung yang wajar dalam bahasa Indonesia.
- source_word: ὡς ... οὕτως καὶ
  choice: sebagaimana ... demikian juga
  rationale: Mempertahankan struktur perbandingan korelatif dalam teks Yunani.
- source_word: ἡ ἐκκλησία
  choice: jemaat
  rationale: Dalam konteks Paulus, istilah ini menunjuk kepada persekutuan umat percaya; 'jemaat' alami dan tidak terutama mengesankan gedung atau lembaga.
- source_word: ὑποτάσσεται
  choice: tunduk
  rationale: Menyampaikan sikap menempatkan diri di bawah suatu tatanan tanpa menambahkan gagasan pemaksaan yang tidak dinyatakan oleh verba tersebut.
- source_word: τῷ Χριστῷ
  choice: kepada Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Mesias' menerjemahkan gelar itu secara langsung dalam bahasa Indonesia.
- source_word: αἱ γυναῖκες
  choice: para istri
  rationale: Konteks hubungan rumah tangga dan pasangannya, ἀνδράσιν, menuntut arti relasional 'istri', bukan arti umum 'perempuan'.
- source_word: τοῖς ἀνδράσιν
  choice: kepada suami mereka
  rationale: Konteks perkawinan menuntut arti 'suami'; 'mereka' menyatakan pasangan relasional yang tersirat oleh konstruksi Yunani.
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Mempertahankan keluasan ungkapan Yunani tanpa menambah pembatas penafsiran.
- source_word: ellipsis of ὑποτάσσεται in the second clause
  choice: verba 'tunduk' tidak diulangi
  rationale: Teks Yunani menghilangkan verba pada klausa kedua karena dipahami dari klausa pertama; elipsis yang sama tetap jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini berfungsi sebagai gelar dalam perbandingan tersebut, sehingga diterjemahkan sebagai 'Mesias'; bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Cakupan frasa ketundukan dalam perkawinan
  choice: Mempertahankan 'dalam segala hal' tanpa pembatas tambahan
  alternative: Penjelasan interpretatif seperti 'dalam segala hal yang patut'
  rationale: Teks sumber hanya berbunyi ἐν παντί. Menambahkan pembatas akan menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh ayat ini.
- issue: Verba yang tidak diulangi pada klausa tentang para istri
  choice: Mempertahankan elipsis
  alternative: Mengulang 'tunduk' pada klausa kedua
  rationale: Teks Yunani tidak mengulang verba, dan struktur bahasa Indonesia masih dapat dipahami dengan jelas tanpa penambahan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perbandingan serta elipsis teks Yunani dipertahankan sejauh tetap alami dan jelas bagi pembaca umum.
