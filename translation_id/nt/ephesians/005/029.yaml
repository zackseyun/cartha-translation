id: EPH.5.29
reference: Ephesians 5:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: id
  text: Sebab tidak pernah ada orang yang membenci tubuhnya sendiri[a]. Sebaliknya, ia memberi makan dan merawatnya dengan penuh kasih, sama seperti Kristus juga memberi makan dan merawat jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dagingnya sendiri.”'
    reason: Menunjukkan bentuk leksikal σάρξ sambil menjelaskan bahwa teks utama memakai ungkapan Indonesia yang lebih alami untuk diri jasmani.
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Sebab tidak pernah ada orang
  rationale: Mengungkapkan alasan yang diperkenalkan oleh γάρ serta penyangkalan universal οὐδεὶς ... ποτε secara alami dalam bahasa Indonesia.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: tubuhnya sendiri
  rationale: Dalam konteks ini σάρξ menunjuk pada diri jasmani seseorang, bukan pada kecenderungan berdosa. 'Tubuhnya sendiri' paling jelas dan alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἐμίσησεν
  choice: membenci
  rationale: Padanan langsung dan lazim bagi μισέω, dengan kekuatan makna yang sesuai.
- source_word: ἐκτρέφει
  choice: memberi makan
  rationale: Mempertahankan unsur konkret memberi asupan atau memelihara yang terkandung dalam ἐκτρέφω dan sesuai dengan gambaran tubuh.
- source_word: θάλπει
  choice: merawatnya dengan penuh kasih
  rationale: Dalam konteks ini θάλπω menyatakan perhatian yang hangat dan lembut, bukan sekadar tindakan harfiah menghangatkan.
- source_word: καθὼς καὶ
  choice: sama seperti ... juga
  rationale: Mempertahankan baik hubungan perbandingan maupun daya tambah καί.
- source_word: ὁ Χριστός
  choice: Kristus
  rationale: Sebutan yang baku, bermartabat, dan dipahami luas dalam bahasa Indonesia untuk gelar Yunani Χριστός.
- source_word: τὴν ἐκκλησίαν
  choice: jemaat
  rationale: Di sini ἐκκλησία menunjuk pada umat percaya sebagai satu kesatuan; 'jemaat' merupakan padanan Indonesia yang alami dalam konteks Paulus.
theological_decisions:
- issue: Makna σάρξ dalam perbandingan tubuh dan jemaat
  choice: tubuhnya sendiri
  alternative: dagingnya sendiri
  rationale: Konteks menunjuk pada diri jasmani, bukan 'natur berdosa'. Terjemahan utama dibuat alami dalam bahasa Indonesia, sedangkan bentuk leksikal harfiah dipertahankan dalam catatan kaki.
- issue: Elipsis verba dalam klausa tentang Kristus dan jemaat
  choice: mengulangi 'memberi makan dan merawat'
  alternative: memperlakukan jemaat demikian juga
  rationale: Teks Yunani menghilangkan verba pada klausa terakhir karena verba sebelumnya dipahami. Pengulangan dalam bahasa Indonesia memperjelas objek dan tindakan tanpa mengubah isi perbandingan.
- issue: Penerjemahan Χριστός
  choice: Kristus
  alternative: Mesias
  rationale: '''Kristus'' adalah bentuk gelar yang telah mapan dalam bahasa Indonesia dan tetap mempertahankan rujukan kristologis tanpa memasukkan tafsiran denominasi tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum; kontras ἀλλά ditampilkan sebagai kalimat baru dengan 'Sebaliknya', dan elipsis Yunani dijelaskan dengan pengulangan verba.
