base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: id
  text: Sebab dahulu kamu adalah kegelapan, tetapi sekarang kamu adalah terang dalam Tuhan. Hiduplah[a] sebagai anak-anak terang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Berjalanlah.” Dalam tulisan Paulus, “berjalan” sering menjadi kiasan untuk cara seseorang menjalani hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: kamu adalah
  rationale: Bentuk imperfek εἰμί menyatakan keadaan pada masa lampau; bersama dahulu, frasa ini mempertahankan pernyataan identitas yang tegas.
- source_word: γάρ
  choice: Sebab
  rationale: γάρ memberi dasar penjelasan bagi nasihat sebelumnya; Sebab mempertahankan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: ποτε
  choice: dahulu
  rationale: Dalam kontras dengan sekarang, dahulu secara ringkas dan alami menyatakan keadaan mereka sebelumnya.
- source_word: σκότος
  choice: kegelapan
  rationale: Nomina predikatif ini tidak mengatakan bahwa mereka sekadar berada dalam kegelapan, melainkan bahwa mereka adalah kegelapan; bentuk metaforis yang kuat dipertahankan.
- source_word: νῦν δὲ
  choice: tetapi sekarang
  rationale: Ungkapan ini menandai kontras tegas antara keadaan dahulu dan keadaan sekarang.
- source_word: φῶς
  choice: terang
  rationale: Nomina predikatif dipertahankan agar bahasa identitas dan perubahan tidak dilemahkan menjadi berada dalam terang atau telah diterangi.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: ἐν dengan datif paling wajar menyatakan lingkup atau kesatuan relasional; di dalam Tuhan mempertahankan corak khas Paulus.
- source_word: ὡς
  choice: sebagai
  rationale: Kata ini memperkenalkan cara hidup yang sesuai dengan identitas mereka, bukan sekadar perbandingan.
- source_word: τέκνα φωτός
  choice: anak-anak terang
  rationale: τέκνα bersifat inklusif gender, dan konstruksi dari terang dipertahankan secara alami sebagai anak-anak terang.
- source_word: περιπατεῖτε
  choice: Hiduplah
  rationale: Imperatif kini ini memakai metafora umum Paulus tentang cara menjalani kehidupan. Hiduplah menyampaikan maksud etisnya dengan jelas dalam bahasa Indonesia modern, sementara metafora harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa identitas metaforis dalam dahulu kamu adalah kegelapan, tetapi sekarang kamu adalah terang
  choice: Mempertahankan kegelapan dan terang sebagai nomina predikatif yang tegas.
  alternative: dahulu kamu berada dalam kegelapan, tetapi sekarang kamu berada dalam terang; dahulu kamu gelap, tetapi sekarang kamu diterangi
  rationale: Teks Yunani memakai nomina predikatif tanpa preposisi dan menekankan perubahan identitas serta keadaan moral-rohani, bukan hanya perubahan lingkungan atau pengalaman.
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks kristologis Paulus, Tuhan mempertahankan bobot teologis dan merupakan padanan baku yang alami dalam bahasa Indonesia tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur identitas metaforis dipertahankan secara formal, sedangkan περιπατεῖτε diterjemahkan secara idiomatis dan metafora asalnya dijelaskan dalam catatan kaki.
