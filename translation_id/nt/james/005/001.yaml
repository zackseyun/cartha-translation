  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: id
  text: Nah, kalian yang kaya, menangislah sambil meratap keras atas malapetaka yang akan menimpa kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Nah
  rationale: Ungkapan wacana ini membuka seruan atau teguran yang tajam. “Nah” alami dalam bahasa Indonesia modern dan mempertahankan daya panggilnya tanpa diterjemahkan secara harfiah sebagai ajakan bergerak.
- source_word: οἱ πλούσιοι
  choice: kalian yang kaya
  rationale: Bentuk nominatif ini berfungsi sebagai sapaan langsung. “Kalian yang kaya” jelas, alami, dan mempertahankan sasaran jamak tanpa menentukan apakah mereka orang percaya atau bukan.
- source_word: κλαύσατε
  choice: menangislah
  rationale: Imperatif aoris menyerukan tindakan berkabung yang nyata; “menangislah” merupakan padanan langsung dan berbobot.
- source_word: ὀλολύζοντες
  choice: sambil meratap keras
  rationale: Partisipel ini menggambarkan ratapan nyaring yang menyertai tangisan. “Meratap keras” mempertahankan unsur suara dan intensitas tanpa konotasi kebinatangan yang dapat timbul dari “meraung”.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: atas malapetaka
  rationale: ἐπί dengan datif menyatakan dasar atau sebab ratapan, sedangkan ταλαιπωρίαις menunjuk pada kesengsaraan atau bencana berat. “Atas malapetaka” sesuai dengan nada penghakiman dan alami dalam konteks ini.
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: yang akan menimpa kalian
  rationale: Partisipel ἐπερχομέναις menerangkan malapetaka yang sedang mendekat. Dalam bahasa Indonesia, “akan menimpa kalian” secara alami menyampaikan bahwa kesusahan itu datang atas mereka tanpa mengubahnya menjadi kepunyaan mereka.
theological_decisions:
- issue: Nada dan identitas orang kaya yang disapa
  choice: Sapaan kenabian kepada orang-orang kaya yang akan menghadapi malapetaka atau penghakiman, tanpa menetapkan status iman mereka.
  alternative: Sapaan khusus kepada tuan tanah penindas yang tidak percaya, atau peringatan khusus kepada anggota jemaat yang kaya.
  rationale: Ayat ini menyapa “yang kaya” dan mengumumkan malapetaka yang mendatang, tetapi tidak dengan sendirinya menjelaskan status mereka. Terjemahan mempertahankan keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan nada teguran kenabian yang tajam. Kata “kalian” menandai sapaan jamak secara jelas; “meratap keras” menjaga intensitas ὀλολύζοντες tanpa terdengar arkais.
