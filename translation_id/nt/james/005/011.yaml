    rationale: “Penuh rahmat” dapat diterima, tetapi “penyayang” secara lebih langsung menyampaikan sifat belas kasihan/kemurahan yang dimaksud οἰκτίρμων dan membedakannya dari istilah teologis “rahmat” yang dapat memiliki rentang asosiasi lebih luas.
