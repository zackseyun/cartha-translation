id: JAS.5.11
reference: James 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: id
  text: Sesungguhnya, kita menyebut berbahagia orang-orang yang telah bertahan. Kalian telah mendengar tentang ketekunan Ayub dan telah melihat hasil akhir yang Tuhan datangkan,[a] bahwa Tuhan sangat berbelas kasih dan penyayang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “akhir Tuhan.” Ungkapan ini dapat dipahami sebagai hasil akhir yang Tuhan datangkan, “hasil dari Tuhan,” atau “tujuan Tuhan.”'
    reason: Menandai τὸ τέλος κυρίου dan mempertahankan ambiguitas genitifnya, sambil menjelaskan padanan utama dalam konteks kisah Ayub.
lexical_decisions:
- source_word: ἰδού
  choice: Ketahuilah
  rationale: Partikel penarik perhatian ini diterjemahkan secara alami dan bermartabat dalam bahasa Indonesia, tanpa memakai bentuk harfiah yang kaku seperti “lihatlah”.
- source_word: μακαρίζομεν
  choice: kita menyebut berbahagia
  rationale: Mempertahankan tindakan menilai atau menyatakan seseorang berbahagia, bukan sekadar mengatakan bahwa mereka merasa bahagia.
- source_word: τοὺς ὑπομείναντας
  choice: orang-orang yang telah bertahan
  rationale: Aoristus partisip menyoroti mereka yang tetap teguh dalam penderitaan atau pencobaan; “telah bertahan” menjaga aspek tersebut.
- source_word: τὴν ὑπομονὴν Ἰὼβ
  choice: ketekunan Ayub
  rationale: ὑπομονή menunjuk pada daya tahan yang teguh; “ketekunan” merupakan ungkapan Indonesia yang lazim dalam konteks Ayub.
- source_word: τὸ τέλος κυρίου
  choice: kesudahan yang Tuhan berikan
  rationale: τέλος dapat berarti akhir, hasil, atau tujuan. Dalam kaitannya dengan kisah Ayub, frasa ini menyatakan hasil akhir yang didatangkan Tuhan, sambil tidak mengartikannya semata-mata sebagai “tujuan” abstrak.
- source_word: πολύσπλαγχνος
  choice: sangat berbelaskasihan
  rationale: Kata ini menyatakan belas kasih yang sangat mendalam; bentuk ini menjaga intensitas πολύ-.
- source_word: οἰκτίρμων
  choice: penuh rahmat
  rationale: Mengungkapkan sifat Tuhan yang murah hati dan berbelas kasih, sekaligus menghindari pengulangan langsung dengan πολύσπλαγχνος.
theological_decisions:
- issue: Makna τὸ τέλος κυρίου
  choice: kesudahan yang Tuhan berikan
  alternative: tujuan Tuhan; kesudahan Tuhan; hasil dari Tuhan
  rationale: Genitif κυρίου secara gramatikal ringkas dan dapat dipahami dengan beberapa cara. Konteks Ayub paling wajar menunjuk kepada kesudahan atau hasil yang Tuhan datangkan. Terjemahan utama dibuat alami, sedangkan ambiguitas bentuk sumber dicatat dalam catatan kaki.
- issue: Dasar pernyataan tentang sifat Tuhan
  choice: bahwa Tuhan sangat berbelaskasihan dan penuh rahmat
  alternative: sebab Tuhan sangat berbelaskasihan dan penuh rahmat
  rationale: ὅτι dapat memperkenalkan isi yang terlihat maupun alasannya. “Bahwa” mempertahankan hubungan yang lebih terbuka dan mengikuti susunan Yunani tanpa memaksakan hubungan sebab-akibat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kamu” dipakai sebagai sapaan jamak kontekstual kepada para pembaca; struktur kalimat dijaga alami tanpa menghilangkan penekanan retoris teks Yunani.
