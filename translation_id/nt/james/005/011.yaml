  naturalness: “Sesungguhnya” lebih alami dan tepat daripada “Ketahuilah” untuk pembuka retoris. “Sangat berbelas kasih dan penyayang” adalah bahasa Indonesia modern yang jelas dan menghindari bentuk “berbelaskasihan” yang kurang lazim.
  terminology: Ayub, Tuhan, ketekunan, dan berbahagia tepat. “Penyayang” menerjemahkan οἰκτίρμων secara idiomatis, sedangkan “sangat berbelas kasih” mempertahankan intensitas πολύσπλαγχνος.
