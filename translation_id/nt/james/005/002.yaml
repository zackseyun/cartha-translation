  text: Kekayaan kalian telah membusuk, dan pakaian kalian telah dimakan ngengat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πλοῦτος ὑμῶν
  choice: Kekayaan kalian
  rationale: “Kekayaan” merupakan padanan Indonesia modern yang alami untuk harta benda yang terkumpul. “Kalian” menyatakan orang kedua jamak secara jelas dan sesuai dengan teguran langsung kepada kelompok orang kaya.
- source_word: σέσηπεν
  choice: telah membusuk
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil proses pembusukan. “Telah membusuk” mempertahankan gambaran konkret sekaligus daya hasil dari tindakan tersebut.
- source_word: τὰ ἱμάτια ὑμῶν
  choice: pakaian kalian
  rationale: “Pakaian” adalah istilah luas, wajar, dan bermartabat dalam bahasa Indonesia modern untuk berbagai benda sandang.
- source_word: σητόβρωτα
  choice: dimakan ngengat
  rationale: Ungkapan ini menyampaikan secara konkret arti kata majemuk yang menunjuk pada sesuatu yang habis atau rusak akibat ngengat; bentuk ini lebih alami daripada padanan adjektival yang kaku.
- source_word: γέγονεν
  choice: telah dimakan
  rationale: Dalam gabungan “telah dimakan ngengat,” aspek perfek menyampaikan keadaan pakaian sekarang sebagai hasil kerusakan yang sudah terjadi. Susunan ini lebih idiomatis daripada terjemahan harfiah “telah menjadi termakan ngengat.”
