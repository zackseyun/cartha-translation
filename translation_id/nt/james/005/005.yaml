id: JAS.5.5
reference: James 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: id
  text: Kalian telah hidup dalam kemewahan di bumi[a] dan memanjakan diri[b]. Kalian telah menggemukkan hati kalian pada hari penyembelihan[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah hidup bersenang-senang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah hidup dengan berfoya-foya.”
    reason: lexical_alternative
  - marker: c
    text: Gambaran ini menyerupai hewan yang digemukkan sebelum disembelih dan kemungkinan menyiratkan penghakiman yang segera datang.
    reason: cultural_note
  - marker: d
    text: Atau “untuk hari penyembelihan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: telah hidup dalam kemewahan
  rationale: Ungkapan ini menyampaikan kehidupan mewah yang mengejar kesenangan, bukan sekadar menikmati hidup. Bentuk lampau Yunani memberi gambaran menyeluruh tentang cara hidup orang kaya yang sedang ditegur.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: γῆ dapat berarti 'bumi' atau 'tanah'. Dalam kecaman luas terhadap kemewahan duniawi ini, 'di bumi' paling sesuai dan alami dalam bahasa Indonesia.
- source_word: ἐσπαταλήσατε
  choice: telah memanjakan diri
  rationale: σπαταλάω menunjuk pada kehidupan yang berlebihan dan menuruti kesenangan diri. 'Memanjakan diri' mempertahankan unsur pemuasan diri dan tegurannya tanpa memakai istilah yang kuno.
- source_word: ἐθρέψατε
  choice: telah menggemukkan
  rationale: Walaupun τρέφω pada dasarnya dapat berarti 'memberi makan' atau 'memelihara', konteks penyembelihan membentuk gambaran ironis tentang hewan yang digemukkan sebelum disembelih.
- source_word: τὰς καρδίας ὑμῶν
  choice: hati kalian
  rationale: Terjemahan langsung mempertahankan metafora dan pandangan antropologis teks. 'Kalian' memperjelas bahwa bentuk Yunani ini jamak.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: pada hari penyembelihan
  rationale: '''Pada'' menerjemahkan ἐν secara dekat dan wajar. ''Penyembelihan'' mempertahankan gambaran hewan yang digemukkan tanpa secara eksplisit menentukan siapa yang menyembelih atau bentuk penghakimannya.'
theological_decisions:
- issue: Daya metaforis 'hari penyembelihan'
  choice: Metafora penyembelihan dipertahankan tanpa menjelaskan penghakiman secara eksplisit dalam teks utama.
  alternative: Menuliskan secara langsung bahwa frasa itu merujuk pada hari penghakiman Allah.
  rationale: Konteks sangat menyiratkan penghakiman yang akan datang, tetapi teks Yunani menyajikannya melalui gambaran yang tajam dan tidak menguraikan rujukannya. Mempertahankan metafora menjaga ketegangan teologis teks.
- issue: Hubungan waktu atau tujuan dalam ἐν ἡμέρᾳ σφαγῆς
  choice: pada hari penyembelihan
  alternative: untuk hari penyembelihan
  rationale: ἐν paling langsung menyatakan waktu atau keadaan, tetapi konteks penggemukan sebelum penyembelihan memungkinkan nuansa tujuan. Terjemahan utama mengikuti bentuk Yunani, sedangkan kemungkinan tujuan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar jumlah gramatikal sumber tampak jelas. Diksi dibuat lugas dan khidmat; metafora hati yang digemukkan serta hari penyembelihan dipertahankan karena menjadi pusat daya retoris ayat.
