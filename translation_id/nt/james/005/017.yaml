  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: id
  text: Elia adalah manusia biasa seperti kita[a]. Ia berdoa dengan sungguh-sungguh agar hujan tidak turun, dan hujan pun tidak turun di negeri itu selama tiga tahun enam bulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Elia adalah manusia seperti kita,” atau, “Elia memiliki perasaan yang sama seperti kita.”
    reason: Alternatif leksikal untuk ὁμοιοπαθὴς ἡμῖν. Istilah ini dapat menyatakan kesamaan kondisi manusiawi secara umum atau, lebih sempit, kesamaan perasaan/pengalaman batin.
lexical_decisions:
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk nama nabi yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἄνθρωπος
  choice: seorang manusia
  rationale: Menegaskan bahwa Elia adalah manusia biasa; pilihan ini wajar dalam konteks dan tidak menghilangkan fakta bahwa Elia laki-laki.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: yang memiliki keadaan seperti kita
  rationale: Menyampaikan kesamaan kondisi dan pengalaman manusiawi secara luas tanpa membatasinya hanya pada perasaan atau hawa nafsu.
- source_word: προσευχῇ προσηύξατο
  choice: berdoa dengan sungguh-sungguh
  rationale: Konstruksi serumpun ini memberi penekanan pada tindakan berdoa; ungkapan Indonesia ini alami dan mempertahankan daya penegasnya.
- source_word: τοῦ μὴ βρέξαι
  choice: agar hujan tidak turun
  rationale: Mengungkapkan isi sekaligus hasil yang dimohonkan dengan susunan Indonesia yang alami.
- source_word: οὐκ ἔβρεξεν
  choice: hujan pun tidak turun
  rationale: Partikel 'pun' mencerminkan hubungan hasil dengan doa sebelumnya, sedangkan ungkapan ini merupakan bentuk impersonal yang alami dalam bahasa Indonesia.
- source_word: ἐπὶ τῆς γῆς
  choice: di negeri itu
  rationale: Dalam latar kisah Elia, γῆ paling wajar merujuk pada wilayah yang mengalami kekeringan, bukan seluruh bumi; 'itu' membuat rujukan naratifnya alami tanpa memperluas cakupan.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: selama tiga tahun enam bulan
  rationale: '''Selama'' menandai durasi secara jelas dan alami dalam bahasa Indonesia.'
theological_decisions:
- issue: Makna ὁμοιοπαθὴς dalam kaitannya dengan kemanusiaan Elia
  choice: Elia memiliki keadaan manusiawi seperti kita
  alternative: Elia mempunyai perasaan atau hawa nafsu yang sama seperti kita
  rationale: Konteks mendorong pembaca untuk berdoa dengan menunjukkan bahwa Elia berbagi kondisi manusiawi yang sama. Terjemahan utama mempertahankan cakupan luas istilah itu dan tidak mempersempitnya hanya menjadi emosi atau nafsu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, dengan pengulangan 'hujan tidak turun' dipertahankan untuk mencerminkan penekanan teks Yunani. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang diterangkannya.
