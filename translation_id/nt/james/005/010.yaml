base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: id
  text: Saudara-saudara[a], jadikanlah para nabi yang berbicara atas nama Tuhan sebagai teladan dalam penderitaan dan kesabaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Saudara-saudara" menerjemahkan bentuk jamak maskulin ἀδελφοί. Dalam konteks ini, Yakobus kemungkinan besar menyapa seluruh komunitas orang percaya, termasuk perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: jadikanlah ... sebagai teladan
  rationale: Ungkapan ini menyuruh pembaca mengambil seseorang sebagai contoh untuk ditiru. Bentuk 'jadikanlah ... sebagai teladan' alami dalam bahasa Indonesia dan mempertahankan daya imperatifnya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini berbentuk jamak maskulin dalam bahasa Yunani, tetapi dalam konteks surat kemungkinan besar ditujukan kepada seluruh komunitas orang percaya. 'Saudara-saudara' merupakan sapaan jemaat yang wajar dalam bahasa Indonesia; cakupan kontekstualnya dijelaskan dalam catatan kaki.
- source_word: κακοπαθίας
  choice: menanggung penderitaan
  rationale: Nomina ini menunjuk pada pengalaman menderita atau mengalami kesukaran. Bentuk verbal 'menanggung penderitaan' memperjelas segi ketabahan yang tersirat dan berpadu alami dengan 'bersabar'.
- source_word: μακροθυμίας
  choice: bersabar
  rationale: Kata ini menyatakan kesabaran yang panjang dalam menghadapi kesukaran atau perlakuan orang lain. 'Bersabar' adalah ungkapan modern dan mudah dipahami.
- source_word: τοὺς προφήτας
  choice: para nabi
  rationale: Padanan langsung dan alami bagi bentuk jamak yang menunjuk kepada para nabi sebagai teladan.
- source_word: ἐλάλησαν
  choice: berbicara
  rationale: λαλέω adalah verba umum untuk berbicara; pilihan ini tidak menambahkan nuansa khusus seperti 'memberitakan' yang tidak dinyatakan secara eksplisit.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Padanan ini mempertahankan ungkapan alkitabiah yang menyiratkan bahwa para nabi berbicara sebagai wakil dan dengan wewenang Tuhan, tanpa menguraikan implikasinya di dalam teks utama.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί yang secara gramatikal maskulin
  choice: '''Saudara-saudara'' dalam teks utama, dengan cakupan seluruh komunitas dijelaskan dalam catatan kaki'
  alternative: '''Saudara-saudari'' atau ''saudara sekalian'''
  rationale: Teks utama mempertahankan bentuk sapaan yang paling dekat dengan bentuk maskulin sumber, sedangkan catatan menjelaskan bahwa dalam konteksnya sapaan itu kemungkinan mencakup laki-laki dan perempuan.
- issue: Hubungan para nabi dengan ὑπόδειγμα serta kedua bentuk genitif
  choice: Para nabi dijadikan teladan dalam menanggung penderitaan dan bersabar
  alternative: Para nabi dijadikan teladan penderitaan dan kesabaran
  rationale: Para nabi adalah objek yang dijadikan teladan, sedangkan penderitaan dan kesabaran menyatakan bidang atau segi keteladanan mereka. Rumusan verbal menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah hubungan tersebut.
- issue: Makna ungkapan 'dalam nama Tuhan'
  choice: Mempertahankan idiom sumber
  alternative: '''atas nama Tuhan'' atau ''dengan wewenang Tuhan'''
  rationale: '''Dalam nama Tuhan'' mempertahankan ungkapan teologis sumber beserta cakupan maknanya, termasuk perwakilan dan wewenang, tanpa membatasinya pada satu penjelasan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan imperatif, para nabi sebagai teladan, serta idiom 'dalam nama Tuhan'.
