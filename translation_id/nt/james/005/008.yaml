base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: id
  text: Kamu juga, bersabarlah. Teguhkanlah hatimu, sebab kedatangan Tuhan sudah dekat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehadiran Tuhan”. Kata Yunani ini dapat berarti “kehadiran” atau “kedatangan”; dalam konteks ini, kata tersebut merujuk pada kedatangan Tuhan pada akhir zaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: harus bersabar
  rationale: Imperatif aoris orang kedua jamak ini menyerukan kesabaran yang bertahan menghadapi kesukaran. Bentuk 'harus bersabar' menyampaikan daya perintah secara wajar dalam bahasa Indonesia modern.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: Mempertahankan hubungan dengan teladan sebelumnya serta penekanan pada para pembaca.
- source_word: στηρίξατε
  choice: teguhkanlah
  rationale: Kata ini berarti menguatkan atau membuat kokoh. 'Teguhkanlah' alami dengan objek 'hatimu' dan menekankan ketetapan batin.
- source_word: τὰς καρδίας ὑμῶν
  choice: hatimu
  rationale: Mempertahankan metafora alkitabiah tentang hati sebagai pusat kemauan, keberanian, dan kehidupan batin. Bentuk tunggal distributif alami untuk sapaan 'kamu' yang merujuk kepada kelompok.
- source_word: ὅτι
  choice: sebab
  rationale: Menyatakan alasan bagi kedua perintah dengan penghubung kausal yang jelas dan bermartabat.
- source_word: ἡ παρουσία
  choice: kedatangan
  rationale: Dalam konteks Yakobus 5:7–8, παρουσία menunjuk pada kedatangan eskatologis Tuhan. 'Kedatangan' paling jelas secara kontekstual, sementara kemungkinan leksikal 'kehadiran' dicatat dalam catatan kaki.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Padanan baku dan sesuai konteks bagi gelar κύριος yang di sini merujuk kepada Tuhan dalam pengharapan eskatologis.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Perfek Yunani menyatakan keadaan dekat yang telah tercapai. 'Sudah dekat' alami dalam bahasa Indonesia dan tetap mencerminkan keadaan hasil tersebut.
theological_decisions:
- issue: Makna παρουσία dalam pernyataan eskatologis tentang Tuhan
  choice: kedatangan Tuhan
  alternative: kehadiran Tuhan
  rationale: Konteks seruan untuk menanti dalam Yakobus 5:7–8 menunjuk pada kedatangan Tuhan yang akan datang. Namun, karena παρουσία juga dapat berarti 'kehadiran', alternatif leksikal itu dipertahankan dalam catatan kaki tanpa menjadikannya pembacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'kamu' dipakai sebagai bentuk jamak kontekstual yang mudah dipahami; metafora 'hati' dipertahankan. Penanda catatan kaki ditempatkan setelah klausa yang menerjemahkan παρουσία agar rujukannya jelas.
