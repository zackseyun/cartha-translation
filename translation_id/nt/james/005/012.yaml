id: JAS.5.12
reference: James 5:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: id
  text: Namun, terutama sekali, saudara-saudaraku,[a] janganlah bersumpah demi langit, demi bumi, atau dengan sumpah apa pun yang lain. Sebaliknya, hendaklah “ya” kalian adalah “ya” dan “tidak” kalian adalah “tidak”, supaya kalian tidak jatuh di bawah penghakiman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani secara harfiah berbentuk “saudara-saudaraku” dan kemungkinan ditujukan kepada seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “supaya kalian tidak jatuh di bawah penghukuman.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: yang terutama
  rationale: Ungkapan ini menandai hal yang sangat penting dalam rangkaian nasihat. “Yang terutama” alami dalam bahasa Indonesia dan tidak harus menyatakan urutan waktu.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: “Saudara-saudara” merupakan sapaan baku dan wajar bagi komunitas, sekaligus dapat mencakup seluruh jemaat tanpa menghapus bentuk kekerabatan dalam bahasa sumber.
- source_word: μὴ ὀμνύετε
  choice: janganlah bersumpah
  rationale: Larangan ini menyangkut pengucapan sumpah, sebagaimana diperjelas oleh rujukan kepada langit, bumi, dan sumpah lain; bukan penggunaan kata-kata kasar.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: baik demi langit, demi bumi, maupun dengan sumpah lain apa pun
  rationale: “Demi” merupakan bentuk Indonesia yang alami untuk bersumpah dengan menjadikan sesuatu sebagai penjamin. Frasa terakhir mempertahankan cakupan menyeluruh ἄλλον τινὰ ὅρκον.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Sebaliknya, hendaklah “ya” kalian berarti ya dan “tidak” kalian berarti tidak
  rationale: Rumusan ini mempertahankan pengulangan ringkas bahasa Yunani sambil menjelaskan secara alami bahwa ucapan ya dan tidak harus lugas serta dapat dipercaya.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: supaya kalian tidak jatuh ke bawah penghakiman
  rationale: Terjemahan ini mempertahankan metafora πέσητε dan konstruksi ὑπὸ κρίσιν. “Penghakiman” tetap lebih luas daripada “penghukuman” dan tidak mempersempit maksud teologis teks.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: saudara-saudaraku
  alternative: saudara-saudaraku laki-laki dan perempuan
  rationale: Dalam konteks surat kepada komunitas orang percaya, bentuk jamak maskulin Yunani kemungkinan menyapa seluruh jemaat. Bahasa Indonesia “saudara-saudara” lazim berfungsi inklusif, dan catatan kaki membuat cakupannya eksplisit.
- issue: Makna κρίσις
  choice: penghakiman
  alternative: penghukuman
  rationale: κρίσις dapat menunjuk pada tindakan atau keadaan berada di bawah penghakiman dan tidak dengan sendirinya menuntut arti lebih sempit berupa vonis penghukuman. Alternatif yang lebih kuat dicatat tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “janganlah” dan “hendaklah” mempertahankan nada nasihat kitab suci tanpa menjadi arkais. Kata ganti “kalian” memperjelas bahwa bentuk Yunani berjamak, sedangkan tanda petik pada “ya” dan “tidak” menandai keduanya sebagai ucapan yang dibicarakan.
