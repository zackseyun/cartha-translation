id: JAS.5.14
reference: James 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: id
  text: Apakah ada di antara kalian yang sakit?[a] Hendaklah ia memanggil para penatua jemaat, dan hendaklah mereka berdoa baginya sambil mengolesinya dengan minyak dalam nama Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lemah”. Kata Yunani ini dapat menunjuk pada kelemahan secara lebih luas, tetapi dalam konteks ini kemungkinan besar berarti sakit, mengingat adanya doa, pengolesan minyak, dan pemulihan pada ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Pengolesan minyak dapat dipahami sebagai tindakan pengobatan, simbolis, atau keduanya; teks ini sendiri tidak menjelaskan fungsinya secara khusus.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: sakit
  rationale: Dalam konteks doa, pengolesan minyak, dan pemulihan pada ayat berikutnya, kata ini terutama menunjuk pada sakit jasmani, meskipun secara lebih luas dapat berarti lemah.
- source_word: τις ἐν ὑμῖν
  choice: ada di antara kalian
  rationale: Mempertahankan sifat tak tentu dan cakupan komunal ungkapan Yunani dalam bahasa Indonesia yang alami.
- source_word: προσκαλεσάσθω
  choice: hendaklah ia memanggil
  rationale: Menyampaikan imperatif orang ketiga tunggal serta tindakan meminta para penatua datang.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: para penatua jemaat
  rationale: Dalam konstruksi ini πρεσβύτεροι menunjuk kepada para pemimpin yang diakui dalam komunitas Kristen; 'jemaat' menyampaikan komunitas yang dimaksud oleh ἐκκλησία secara alami.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: hendaklah mereka berdoa baginya
  rationale: Imperatif jamak dipertahankan. 'Baginya' menyatakan doa yang ditujukan demi orang sakit tanpa memaksakan gambaran posisi fisik yang tidak pasti dari ἐπί.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: sambil mengolesinya dengan minyak
  rationale: ἀλείφω secara konkret berarti mengoleskan minyak. Pilihan ini alami dan netral, tanpa menetapkan apakah tindakan tersebut bersifat pengobatan, simbolis, sakramental, atau gabungan.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: dalam nama Tuhan
  rationale: Mempertahankan idiom biblis serta kaitannya dengan pribadi dan kewenangan Tuhan tanpa memperluas teks.
theological_decisions:
- issue: Makna ἀσθενεῖ dalam konteks
  choice: Sakit jasmani sebagai makna utama
  alternative: Lemah secara umum atau rohani
  rationale: Doa, pengolesan minyak, dan konteks pemulihan pada ayat berikutnya mendukung sakit jasmani, tetapi rentang makna yang lebih luas dicatat dalam catatan kaki.
- issue: Fungsi pengolesan minyak
  choice: Dibiarkan netral
  alternative: Pengobatan, tindakan simbolis, ritus sakramental, atau gabungan
  rationale: Teks menyebut tindakannya, tetapi tidak menjelaskan mekanisme atau status teologisnya.
- issue: Rujukan gender pada bentuk tunggal
  choice: Memakai 'ia' yang netral gender
  alternative: Menentukan laki-laki secara eksplisit
  rationale: τις bersifat tak tentu, sedangkan bahasa Indonesia memungkinkan alur tunggal dipertahankan tanpa menambahkan gender yang tidak perlu.
- issue: Arti ἐπ’ αὐτόν bersama προσεύχομαι
  choice: berdoa baginya
  alternative: berdoa di atasnya atau atasnya
  rationale: Ungkapan ini menyatakan doa yang diarahkan kepada atau demi orang sakit. 'Baginya' lebih alami dalam bahasa Indonesia dan tidak mengunci penafsiran pada postur ritual tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν secara jelas; 'hendaklah' mempertahankan daya imperatif. 'Para penatua jemaat' memakai istilah gerejawi yang luas dan tidak khas denominasi tertentu.
