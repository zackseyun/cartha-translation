  terminology: Istilah “berdoa,” “bersukacita,” dan “menyanyikan pujian” tepat bagi konteks dan register. Catatan kaki secara memadai menjaga alternatif leksikal “menyanyikan mazmur” tanpa menjadikannya makna utama.
