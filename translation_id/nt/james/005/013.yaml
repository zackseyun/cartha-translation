id: JAS.5.13
reference: James 5:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: id
  text: Apakah ada di antara kalian yang sedang menderita? Hendaklah ia berdoa. Apakah ada yang sedang bersukacita? Hendaklah ia menyanyikan pujian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menyanyikan mazmur"; kata Yunani ini dapat secara khusus berarti menyanyikan mazmur atau, secara lebih luas, menyanyikan pujian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: sedang menderita
  rationale: Kata kerja κακοπαθέω menunjuk pada mengalami penderitaan atau kesukaran. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada penganiayaan atau penyakit.
- source_word: τις
  choice: ada ... yang
  rationale: Pronomina tak tentu tunggal ini menyatakan siapa pun secara umum. Susunan 'apakah ada ... yang' menyampaikan makna tersebut dengan wajar tanpa membatasi pada jenis kelamin tertentu.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Frasa ini menempatkan orang yang dimaksud di dalam komunitas para penerima surat. 'Di antara kalian' langsung dan alami.
- source_word: προσευχέσθω
  choice: hendaklah ia berdoa
  rationale: Imperatif kini orang ketiga tunggal ini merupakan nasihat kepada orang yang berada dalam keadaan tersebut. 'Hendaklah' mempertahankan daya perintah, sedangkan 'ia' mempertahankan bentuk tunggal representatif.
- source_word: εὐθυμεῖ
  choice: sedang bersukacita
  rationale: εὐθυμέω berarti berada dalam keadaan hati yang baik atau bersemangat. 'Bersukacita' merupakan ungkapan Indonesia yang alami dan sesuai dengan kontras terhadap penderitaan.
- source_word: ψαλλέτω
  choice: hendaklah ia menyanyikan pujian
  rationale: Dalam konteks ini ψάλλω menunjuk pada pujian yang dinyanyikan kepada Allah. Pilihan ini jelas bagi pembaca modern tanpa membatasi maknanya hanya pada mazmur, sementara kemungkinan makna yang lebih khusus dicatat dalam catatan kaki.
theological_decisions:
- issue: Imperatif tunggal dengan acuan umum
  choice: Mempertahankan nasihat tunggal dengan 'hendaklah ia'
  alternative: Menggunakan bentuk jamak atau mengulang 'orang itu'
  rationale: Bahasa Yunani memakai τις dan imperatif orang ketiga tunggal untuk menyatakan setiap orang secara representatif. 'Ia' mempertahankan ketunggalan gramatikal tanpa menjadikan nasihat ini khusus bagi laki-laki.
- issue: Makna ψαλλέτω
  choice: menyanyikan pujian
  alternative: menyanyikan mazmur; bermazmur
  rationale: Kata ini dapat secara khusus merujuk pada menyanyikan mazmur, tetapi dalam konteks nasihat ini makna umum berupa pujian yang dinyanyikan paling mudah dipahami dan tidak memasukkan ketentuan liturgis yang lebih sempit. Kemungkinan makna khusus tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kalian' dipilih untuk menandai sapaan jamak secara jelas; 'hendaklah ia' mempertahankan imperatif tunggal representatif. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
