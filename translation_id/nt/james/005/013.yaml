  source_fidelity: Teks Indonesia dengan setia mencerminkan dua pertanyaan retoris dan dua imperatif orang ketiga tunggal dalam Yunani. “Sedang menderita” mencakup κακοπαθεῖ tanpa membatasinya pada sakit atau penganiayaan; “sedang bersukacita” cukup baik untuk εὐθυμεῖ; dan “menyanyikan pujian” menyampaikan ψαλλέτω tanpa mengharuskan arti yang lebih sempit, “menyanyikan mazmur.”
