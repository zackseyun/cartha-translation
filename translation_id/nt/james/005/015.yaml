id: JAS.5.15
reference: James 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: id
  text: Dan doa yang dipanjatkan dengan iman[b] akan menyelamatkan orang yang sakit[a], dan Tuhan akan membangkitkannya. Jika ia telah berbuat dosa[c], ia akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menyembuhkan” atau “akan memulihkan”; secara harfiah, “akan menyelamatkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “doa iman”; ungkapan ini dapat dipahami sebagai doa yang ditandai oleh kepercayaan, atau—meski kurang mungkin dalam konteks ini—oleh kesetiaan.
    reason: lexical_alternative
  - marker: c
    text: Atau “Sekalipun ia telah berbuat dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: doa
  rationale: Dalam konteks para penatua yang mendoakan orang sakit (ayat 14), kata ini menunjuk pada doa, bukan nazar.
- source_word: πίστεως
  choice: dengan iman
  rationale: Genitif ini paling wajar dipahami sebagai doa yang ditandai oleh iman atau kepercayaan kepada Allah. Ungkapan ini dibuat alami dalam bahasa Indonesia tanpa menutup sepenuhnya kemungkinan nuansa lain.
- source_word: σώσει
  choice: akan menyelamatkan
  rationale: Kata σῴζω memiliki arti dasar menyelamatkan, tetapi dalam konteks penyakit juga dapat berarti menyembuhkan atau memulihkan. Pilihan ini mempertahankan keluasan makna Yunani, sedangkan konteks menunjukkan bahwa kesembuhan jasmani termasuk di dalamnya.
- source_word: τὸν κάμνοντα
  choice: orang yang sakit
  rationale: Walaupun κάμνω dapat berarti menjadi letih atau lemah, konteks penyakit, pengurapan, dan pemulihan mendukung arti orang yang sakit.
- source_word: ἐγερεῖ
  choice: akan membangkitkannya
  rationale: Pilihan ini mempertahankan gambaran 'mengangkat atau membangkitkan' dalam ἐγείρω. Dalam konteks ini, ungkapan tersebut terutama menunjuk pada pemulihan dari tempat sakit, tetapi tetap mempertahankan gema makna yang lebih luas.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Ini adalah padanan baku dan alami bagi κύριος ketika menunjuk pada pelaku ilahi.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: Jika ia telah berbuat dosa
  rationale: Klausa ini menyatakan kemungkinan bersyarat dan tidak mengatakan bahwa penyakit selalu disebabkan oleh dosa pribadi. Nuansa konsesif 'sekalipun' dicatat dalam catatan kaki.
- source_word: ἀφεθήσεται αὐτῷ
  choice: ia akan diampuni
  rationale: Bentuk pasif ini menunjuk pada pengampunan dosa oleh Allah. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan ilahi yang tidak disebutkan pelakunya secara langsung.
theological_decisions:
- issue: Apakah σώσει harus dipersempit menjadi kesembuhan jasmani
  choice: Diterjemahkan 'akan menyelamatkan', dengan konteks penyakit menunjukkan bahwa kesembuhan atau pemulihan jasmani tercakup.
  alternative: '''akan menyembuhkan'' atau ''akan memulihkan'''
  rationale: Yakobus memakai σῴζω, bukan kata yang semata-mata bersifat medis. Terjemahan ini mempertahankan keluasan leksikal dan teologisnya tanpa mengabaikan konteks jasmani.
- issue: Apakah ayat ini menjanjikan kesembuhan otomatis melalui doa
  choice: Pernyataan masa depan diterjemahkan secara langsung sebagaimana dalam teks Yunani, tanpa penambahan syarat atau penegasan mutlak.
  alternative: Parafrasa seperti 'dapat memulihkan' atau 'pasti menyembuhkan setiap orang dalam setiap keadaan'
  rationale: Terjemahan tidak boleh melemahkan bentuk futurum Yunani ataupun memasukkan doktrin tertentu tentang jaminan kesembuhan dalam setiap kasus.
- issue: Apakah segala penyakit disebabkan oleh dosa pribadi
  choice: 'Dosa disebut dalam klausa bersyarat: ''Jika ia telah berbuat dosa.'''
  alternative: Menyiratkan bahwa orang tersebut pasti berdosa atau bahwa semua penyakit disebabkan oleh dosa pribadi
  rationale: Teks menyebut dosa sebagai kemungkinan, bukan sebagai penyebab universal penyakit. Bentuk bersyarat mempertahankan batas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum. 'Membangkitkannya' mempertahankan citra verba Yunani dan lebih luas daripada sekadar 'membuatnya sembuh', sedangkan catatan kaki menjaga alternatif leksikal dan nuansa konsesif.
