  to: Karena itu, bersabarlah, Saudara-saudara,[a] sampai kedatangan Tuhan. Perhatikanlah, petani menantikan hasil bumi yang berharga dan bersabar menunggunya sampai ia menerima hujan awal dan hujan akhir.[b]
