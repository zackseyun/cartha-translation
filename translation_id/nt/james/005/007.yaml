id: JAS.5.7
reference: James 5:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: id
  text: Karena itu, bersabarlah, Saudara-saudara,[a] sampai kedatangan Tuhan. Perhatikanlah, petani menantikan hasil bumi yang berharga dan bersabar menunggunya sampai ia menerima hujan awal dan hujan akhir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara laki-laki”; dalam pemakaian seperti ini, kata Yunani tersebut sering menyapa seluruh komunitas orang percaya, termasuk perempuan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “sampai ia menerima yang awal dan yang akhir.” Dalam konteks pertanian, ungkapan itu mengacu kepada hujan awal dan hujan akhir.
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: Μακροθυμήσατε
  choice: bersabarlah
  rationale: Imperatif aoris ini menyerukan ketekunan yang sabar; bentuk ini alami dalam bahasa Indonesia dan memungkinkan pengulangan akar yang sama pada μακροθυμῶν.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari konteks sebelumnya dan mempertahankan hubungan logis ayat ini.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini wajar, bermartabat, dan dapat digunakan bagi seluruh komunitas orang percaya tanpa menghapus bentuk maskulin gramatikal sumber; cakupannya dijelaskan dalam catatan kaki.
- source_word: παρουσίας
  choice: kedatangan
  rationale: Dalam konteks eskatologis ini, kata tersebut menunjuk pada kedatangan Tuhan yang dinantikan; kemungkinan makna leksikal 'kehadiran' dipertahankan dalam catatan kaki.
- source_word: ἰδοὺ
  choice: Perhatikanlah
  rationale: Mempertahankan fungsi penarik perhatian saat memperkenalkan gambaran tentang petani, dengan ragam Indonesia modern yang bermartabat.
- source_word: γεωργὸς
  choice: petani
  rationale: Padanan umum dan alami bagi pekerja yang mengolah tanah dalam konteks ini.
- source_word: ἐκδέχεται
  choice: menantikan
  rationale: Menyatakan penantian yang disertai pengharapan dan selaras dengan tema kesabaran.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: hasil bumi yang berharga
  rationale: Mengungkapkan nilai hasil panen secara alami tanpa mempersempitnya pada tanaman tertentu.
- source_word: μακροθυμῶν ἐπ’ αὐτῷ
  choice: bersabar menunggunya
  rationale: Mempertahankan pengulangan leksikal dengan perintah pembuka sekaligus menghasilkan ungkapan Indonesia yang alami; pronomina merujuk pada hasil bumi.
- source_word: ἕως λάβῃ πρόϊμον καὶ ὄψιμον
  choice: sampai tanah itu menerima hujan awal dan hujan akhir
  rationale: Subjek tersirat dipahami sebagai tanah, sesuai gambaran pertanian; penyebutan 'hujan' dibuat eksplisit karena kedua adjektiva Yunani digunakan secara substantival dan merujuk pada musim hujan.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Bentuk sumber secara gramatikal maskulin, tetapi dalam pemakaian surat ini dapat menyapa seluruh komunitas beriman. Teks utama mempertahankan sapaan konvensional, sementara cakupan inklusifnya dijelaskan dalam catatan.
- issue: παρουσία τοῦ κυρίου
  choice: kedatangan Tuhan
  alternative: kehadiran Tuhan
  rationale: Konteks nasihat eskatologis mendukung arti kedatangan Tuhan pada masa mendatang, tanpa menetapkan skema akhir zaman yang lebih khusus.
- issue: Subjek λάβῃ
  choice: tanah itu menerima
  alternative: hasil bumi itu menerima
  rationale: Bentuk verba tunggal memungkinkan rujukan gramatikal yang diperdebatkan. Secara semantis hujan diterima oleh tanah, tetapi ambiguitas tekstual perlu diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan μακροθυμ- dipertahankan dengan 'bersabarlah' dan 'bersabar'. Istilah pertanian dibuat alami bagi pembaca umum, sedangkan ambiguitas subjek verba terakhir tidak disembunyikan.
