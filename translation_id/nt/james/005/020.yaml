source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: id
  text: Hendaklah ia tahu bahwa siapa pun yang membawa kembali orang berdosa dari jalan sesatnya akan menyelamatkan jiwanya dari kematian[a][b] dan akan menutupi banyak dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menyelamatkan nyawanya dari kematian.” Kata Yunani yang digunakan dapat berarti “jiwa” atau “nyawa.”
    reason: lexical_alternative
  - marker: b
    text: Kata “-nya” dalam “jiwanya” mungkin merujuk kepada orang berdosa yang dibawa kembali; sebagian orang memahaminya sebagai rujukan kepada orang yang membawanya kembali.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: hendaklah ia tahu
  rationale: Imperatif orang ketiga tunggal dipertahankan sebagai ajakan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ὁ ἐπιστρέψας
  choice: siapa pun yang membawa kembali
  rationale: Partisip berartikel ini berfungsi secara substantival dan bersifat umum. 'Membawa kembali' menyatakan pemulihan orang yang telah menyimpang tanpa memasukkan nuansa teknis denominatif.
- source_word: ἁμαρτωλὸν
  choice: orang berdosa
  rationale: Bentuk tanpa artikel dipakai secara umum; padanan ini alami dalam bahasa Indonesia.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: dari jalan sesatnya
  rationale: Ungkapan ini mempertahankan gambaran jalan sebagai cara hidup sekaligus menyampaikan unsur kekeliruan atau penyimpangan dalam πλάνη.
- source_word: σώσει
  choice: akan menyelamatkan
  rationale: Mempertahankan bentuk futur dan bobot soteriologis σῴζω tanpa mempersempit jenis keselamatan yang dimaksud.
- source_word: ψυχὴν αὐτοῦ
  choice: jiwanya
  rationale: ψυχή dapat berarti 'jiwa' atau 'nyawa/hidup'. 'Jiwanya' mempertahankan bentuk leksikal dan keseriusan rohani, sedangkan kemungkinan lain dicatat dalam catatan kaki. Bentuk pronominal Indonesia tetap memungkinkan rujukan yang ambigu.
- source_word: ἐκ θανάτου
  choice: dari kematian
  rationale: Padanan langsung yang tidak menentukan apakah kematian fisik, rohani, atau keduanya dimaksudkan.
- source_word: καλύψει
  choice: akan menutupi
  rationale: Mempertahankan idiom alkitabiah tentang dosa yang ditutupi dan tidak menggantinya dengan penjelasan interpretatif seperti 'mengampuni'.
- source_word: πλῆθος ἁμαρτιῶν
  choice: banyak dosa
  rationale: Padanan Indonesia yang alami dan jelas bagi ungkapan tentang sejumlah besar dosa, tanpa kehilangan makna kuantitatifnya.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam ψυχὴν αὐτοῦ
  choice: Pronomina diterjemahkan 'jiwanya' tanpa menentukan rujukannya dalam teks utama.
  alternative: Jiwa orang berdosa yang dibawa kembali; atau jiwa orang yang membawanya kembali.
  rationale: Tata bahasa Yunani memungkinkan kedua pemahaman, meskipun rujukan kepada orang berdosa lebih dekat dan lebih lazim. Ambiguitas dipertahankan dan dijelaskan dalam catatan kaki.
- issue: Makna ψυχή dan θάνατος
  choice: Menggunakan 'jiwa' dan 'kematian' sebagai istilah yang luas.
  alternative: '''Nyawa ... dari kematian'', atau secara khusus ''jiwa ... dari kematian rohani''.'
  rationale: Ayat ini dapat dipahami mengenai terpeliharanya hidup, keselamatan rohani, atau keduanya. Terjemahan tidak mempersempitnya kepada satu kerangka doktrinal.
- issue: Makna 'menutupi banyak dosa'
  choice: Idiom sumber dipertahankan tanpa menyebut secara eksplisit dosa siapa yang ditutupi.
  alternative: Menafsirkan sebagai pengampunan atas dosa orang berdosa atau dosa orang yang memulihkannya.
  rationale: Teks tidak menyatakan pemilik dosa secara eksplisit. Mempertahankan idiom menghindari penyelesaian ketegangan teologis yang tidak diselesaikan oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Susunan kalimat mengikuti alur Yunani sejauh tetap alami. Istilah 'jalan sesatnya' mempertahankan metafora perilaku hidup, sedangkan kedua catatan kaki menjaga ambiguitas leksikal dan pronominal.
