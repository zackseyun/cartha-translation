  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: id
  text: Ia berdoa lagi, lalu langit menurunkan hujan[a], dan bumi menghasilkan buahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memberikan hujan”.'
    reason: lexical_alternative
  - marker: b
    text: Atau “hasilnya”; dapat pula dipahami sebagai “tanah menghasilkan panennya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Adverbia ini menandai pengulangan. “Lagi” merupakan padanan Indonesia yang paling ringkas dan alami, serta merujuk pada doa Elia berikutnya.
- source_word: προσηύξατο
  choice: ia berdoa
  rationale: Bentuk aoris dari προσεύχομαι berarti “berdoa”. Unsur “dengan sungguh-sungguh” tidak ditambahkan karena terdapat pada ayat 17, bukan dalam ungkapan ayat ini.
- source_word: ὁ οὐρανὸς
  choice: langit
  rationale: Dalam konteks cuaca, οὐρανός menunjuk pada langit yang mendatangkan hujan. Bahasa Indonesia “langit” juga mempertahankan keluasan makna kata sumber tanpa memaksakan pengertian teologis “surga”.
- source_word: ὑετὸν ἔδωκεν
  choice: menurunkan hujan
  rationale: Secara harfiah ungkapan ini berarti “memberikan hujan”. “Menurunkan hujan” adalah ungkapan Indonesia yang lebih alami ketika subjeknya “langit”, sambil mempertahankan gambaran bahwa hujan berasal dari langit.
- source_word: ἡ γῆ
  choice: bumi
  rationale: γῆ dapat berarti bumi, tanah, atau negeri. “Bumi” mempertahankan kesejajaran luas dengan “langit”, sementara konteksnya tetap jelas bersifat pertanian.
- source_word: ἐβλάστησεν
  choice: menghasilkan
  rationale: βλαστάνω menggambarkan tumbuh atau munculnya hasil tanaman. Dengan καρπός sebagai objek, “menghasilkan” terdengar alami dan menyampaikan hasil pertanian.
- source_word: τὸν καρπὸν αὐτῆς
  choice: buahnya
  rationale: καρπός secara harfiah berarti “buah”, tetapi dalam konteks ini mencakup hasil bumi. “Buahnya” mempertahankan citra teks sumber, sedangkan kemungkinan makna pertaniannya dicatat dalam catatan kaki.
theological_decisions:
- issue: Doa Elia dan tanggapan ilahi
  choice: Menggambarkan hasil yang tampak dari doa Elia tanpa menyebut Allah secara eksplisit sebagai pelaku yang menurunkan hujan.
  alternative: “Allah menurunkan hujan” atau ungkapan lain yang menyebut tindakan Allah secara langsung.
  rationale: Konteks menyiratkan tanggapan Allah, tetapi susunan ayat ini sendiri menyatakan bahwa langit menurunkan hujan dan bumi menghasilkan buahnya. Terjemahan mempertahankan cara pengungkapan teks tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Kata ganti “ia” mempertahankan rujukan kepada Elia dari konteks sebelumnya. “Lalu” mengalirkan urutan peristiwa secara alami tanpa menambahkan hubungan sebab-akibat yang lebih tegas daripada konteks.
