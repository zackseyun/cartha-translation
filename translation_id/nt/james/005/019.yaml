    rationale: πλανηθῇ adalah aoris pasif subjungtif. Walaupun dalam konteks ini dapat dipahami secara idiomatis sebagai ‘pergi/tersesat,’ terjemahan tidak sebaiknya mengunci pembacaan pada penyimpangan yang aktif atau disengaja. “Tersesat” lebih netral dan alami.
  - severity: low
