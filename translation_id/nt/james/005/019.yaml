lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Saudara-saudaraku
  rationale: Sapaan maskulin jamak ini secara alami diterjemahkan sebagai 'Saudara-saudaraku' dalam bahasa Indonesia; dalam konteks surat, sapaan itu dapat mencakup seluruh komunitas, termasuk perempuan.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: jika seseorang di antara kamu
  rationale: Mempertahankan sifat bersyarat dan tak tentu dari ἐάν τις serta bentuk tunggalnya.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: menyimpang dari kebenaran
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan beralih atau tersesat dari kebenaran. Bentuk Yunani dapat dipahami dengan nuansa intransitif ataupun pasif, sehingga alternatif dicatat.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: lalu seseorang membuat dia berbalik
  rationale: Konstruksi kausatif 'membuat dia berbalik' mempertahankan bahwa orang kedua menyebabkan orang yang menyimpang itu berbalik kembali, tanpa menambahkan tujuan yang belum dinyatakan sampai ayat berikutnya.
theological_decisions:
- issue: Cakupan sapaan maskulin Ἀδελφοί
  choice: Saudara-saudaraku
  alternative: Saudara-saudari yang kukasihi
  rationale: Bentuk utama mempertahankan bentuk gramatikal sumber, sedangkan catatan kaki menjelaskan bahwa sapaan tersebut dapat mencakup seluruh jemaat.
- issue: Nuansa πλανηθῇ
  choice: menyimpang
  alternative: disesatkan; tersesat
  rationale: Bentuk pasif Yunani dapat membawa nuansa disesatkan atau, secara idiomatis, tersesat/menyimpang. Terjemahan utama tidak menetapkan pelaku penyesatan yang tidak disebutkan dalam teks.
- issue: Arah tindakan ἐπιστρέψῃ
  choice: membuat dia berbalik
  alternative: membawa dia kembali
  rationale: Pilihan utama mempertahankan citra berbalik dan unsur kausatif, sambil membiarkan ayat 20 menjelaskan lebih lanjut arti tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai bentuk jamak sesuai konteks komunitas. Susunan ayat dibiarkan menggantung dengan koma karena kalimat berlanjut ke ayat 20.
