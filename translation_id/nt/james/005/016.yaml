id: JAS.5.16
reference: James 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: id
  text: Karena itu, akuilah dosa-dosamu seorang kepada yang lain dan doakanlah seorang akan yang lain, supaya kalian disembuhkan. Doa orang benar yang bekerja dengan efektif sangat berkuasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Doa permohonan seorang benar sangat besar kuasanya ketika bekerja.”
    reason: Menampilkan δέησις sebagai doa permohonan dan suatu susunan alternatif untuk frasa penutup yang sintaksisnya padat.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: hendaklah ... mengakui
  rationale: Bentuk imperatif ini menyerukan pengakuan terbuka. Dalam hubungan dengan dosa dan dengan ἀλλήλοις, ungkapan 'saling mengakui dosa-dosa kalian' menyampaikan pengakuan timbal balik tanpa menyiratkan tata cara sakramental tertentu.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari pembahasan sebelumnya mengenai doa, dosa, dan pemulihan.
- source_word: ἀλλήλοις
  choice: saling
  rationale: Menyatakan hubungan timbal balik secara alami dan ringkas dalam bahasa Indonesia.
- source_word: τὰς ἁμαρτίας
  choice: dosa-dosa kalian
  rationale: Kata benda jamak berarti 'dosa-dosa'; pronomina 'kalian' diperjelas dari konteks perintah timbal balik kepada komunitas.
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: saling mendoakan
  rationale: Merupakan ungkapan Indonesia yang alami untuk doa syafaat timbal balik, dengan tetap mempertahankan makna 'berdoa bagi satu sama lain'.
- source_word: ὅπως
  choice: supaya
  rationale: Menyampaikan hubungan tujuan atau hasil secara jelas dan alami.
- source_word: ἰαθῆτε
  choice: kalian disembuhkan
  rationale: Mempertahankan bentuk pasif dan cakupan luas 'disembuhkan', tanpa membatasi penyembuhan hanya pada ranah jasmani atau rohani.
- source_word: πολὺ ἰσχύει
  choice: sangat besar kuasanya
  rationale: Menyampaikan daya atau kemampuan yang besar secara wajar, tanpa mengubahnya menjadi pernyataan yang lebih spesifik tentang hasil tertentu.
- source_word: δέησις
  choice: Doa
  rationale: Padanan luas dan mudah dipahami; nuansa yang lebih khusus sebagai permohonan dipertahankan dalam catatan kaki.
- source_word: δικαίου
  choice: orang benar
  rationale: Adjektiva tunggal yang dipakai sebagai nomina diterjemahkan secara generik dan tidak dibatasi pada laki-laki.
- source_word: ἐνεργουμένη
  choice: ketika bekerja
  rationale: Mempertahankan gambaran doa yang sedang berdaya atau bekerja, tanpa menetapkan secara berlebihan apakah bentuk partisip ini harus dipahami secara medial atau pasif.
theological_decisions:
- issue: Apakah ayat ini memerintahkan pengakuan sakramental kepada rohaniwan atau pengakuan timbal balik di antara orang percaya
  choice: pengakuan timbal balik satu sama lain
  alternative: pengakuan yang diperantarai rohaniwan tertahbis
  rationale: Pronomina timbal balik ἀλλήλοις secara langsung menunjukkan tindakan antaranggota komunitas. Terjemahan tidak memasukkan tata gerejawi yang tidak dinyatakan oleh ayat ini.
- issue: Cakupan penyembuhan dalam ἰαθῆτε
  choice: disembuhkan, dengan cakupan tetap terbuka
  alternative: hanya disembuhkan secara jasmani atau hanya dipulihkan secara rohani
  rationale: Konteks dekat membahas penyakit jasmani, tetapi penyebutan dosa juga menghadirkan dimensi rohani. Padanan umum mempertahankan ketegangan tersebut.
- issue: Rujukan gender dalam δικαίου
  choice: orang benar
  alternative: laki-laki yang benar
  rationale: Bentuk maskulin tunggal dipakai secara substantival dan generik; 'orang benar' mewakili maksud umum sumber tanpa membatasi gender.
- issue: Nuansa ἐνεργουμένη
  choice: ketika bekerja
  alternative: ketika dibuat efektif atau ketika dijalankan dengan sungguh-sungguh
  rationale: Bentuk medial/pasifnya memungkinkan lebih dari satu nuansa. Terjemahan utama mempertahankan ketaksaan itu dan menghindari penambahan gagasan tentang intensitas atau pelaku yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa perintah ditujukan kepada komunitas. Bentuk 'saling' menjaga sifat timbal balik kedua perintah.
