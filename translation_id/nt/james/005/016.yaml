revisions:
- from: Karena itu, hendaklah kalian saling mengakui dosa-dosa kalian dan saling mendoakan, supaya kalian disembuhkan. Doa orang benar sangat besar kuasanya ketika bekerja.[a]
  to: Karena itu, akuilah dosa-dosamu seorang kepada yang lain dan doakanlah seorang akan yang lain, supaya kalian disembuhkan. Doa orang benar yang bekerja dengan efektif sangat berkuasa.[a]
  rationale: Revisi memperjelas bahwa setiap orang mengakui dosa sendiri kepada sesama, mempertahankan kedua relasi timbal balik, dan mengganti ungkapan akhir yang kaku dengan bahasa Indonesia baku yang lebih alami. “Disembuhkan” tetap dibiarkan luas. Catatan kaki mempertahankan alternatif leksikal untuk δέησις dan susunan yang lebih dekat dengan bentuk sumber.
