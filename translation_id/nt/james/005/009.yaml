  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: id
  text: Janganlah bersungut-sungut terhadap satu sama lain, Saudara-saudara[a], supaya kalian tidak dihakimi. Lihatlah, Sang Hakim telah berdiri di depan pintu-pintu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani adelphoi secara harfiah berbentuk maskulin, tetapi dapat ditujukan kepada seluruh komunitas orang percaya, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: bersungut-sungut
  rationale: Dalam konteks κατ’ ἀλλήλων, kata kerja ini menunjuk pada keluhan penuh kejengkelan yang diarahkan kepada sesama, bukan sekadar mengerang dalam batin.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan jamak ini secara gramatikal maskulin, tetapi dalam konteks jemaat dapat mencakup orang percaya laki-laki dan perempuan. 'Saudara-saudara' merupakan sapaan jemaat yang alami dan tetap dekat dengan bentuk sumber.
- source_word: κατ’ ἀλλήλων
  choice: terhadap satu sama lain
  rationale: κατά dengan genitif menyatakan arah permusuhan atau keluhan kepada sesama; frasa ini menyampaikan daya relasionalnya secara alami dalam bahasa Indonesia.
- source_word: κριθῆτε
  choice: kalian tidak dihakimi
  rationale: Bentuk pasif κρίνω berarti dikenai penghakiman tanpa menetapkan hasilnya; 'dihukum' akan mempersempit makna menjadi putusan bersalah.
- source_word: κριτὴς
  choice: Sang Hakim
  rationale: Sebutan ini mengacu kepada hakim ilahi dalam penghakiman akhir. 'Sang Hakim' mempertahankan bentuk gelar tanpa menentukan lebih jauh apakah referennya disebut Tuhan atau Kristus.
- source_word: πρὸ τῶν θυρῶν
  choice: di ambang pintu
  rationale: Ungkapan ini menyatakan kedekatan dan kesegeraan. Bahasa Indonesia lazim memakai bentuk idiomatis tunggal 'di ambang pintu', meskipun Yunani memakai bentuk jamak.
- source_word: ἕστηκεν
  choice: sudah berdiri
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil tindakan sebelumnya; 'sudah berdiri' menyampaikan kehadiran yang dekat dan kesiapan Sang Hakim.
theological_decisions:
- issue: Referen 'Sang Hakim'
  choice: Hakim ilahi pada penghakiman akhir, tanpa diperinci lebih lanjut dalam terjemahan
  alternative: Secara khusus Tuhan/Kristus, atau Allah secara umum sebagai Hakim
  rationale: Konteks Yakobus menunjuk pada penghakiman yang segera berkaitan dengan kedatangan Tuhan, tetapi teks hanya mengatakan 'Sang Hakim'. Terjemahan mempertahankan ketegangan referensial itu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Kalian' dipakai untuk memperjelas orang kedua jamak. Sapaan 'Saudara-saudara' sesuai dengan register surat kepada jemaat. Ungkapan idiomatis 'di ambang pintu' dipilih demi kealamian bahasa Indonesia sambil mempertahankan makna kedekatan.
