review_pass:
  verdict: revise
  source_fidelity: 'Perlu revisi kecil. Draf mempertahankan unsur-unsur utama teks Yunani: upah yang ditahan, pekerja yang menuai ladang milik pihak yang ditegur, personifikasi upah yang berseru, jeritan para penuai, perfektum ''telah masuk'', dan gelar ilahi. Namun, klausa relatif ''yang kamu tahan'' setelah ''ladang-ladangmu'' secara sintaksis mudah terbaca sebagai menerangkan ladang, bukan upah. Selain itu, ''sedang berteriak'' menambahkan nuansa progresif yang tidak perlu pada bentuk kini κράζει.'
  naturalness: Bahasanya umumnya modern dan lugas. Penataan ulang dengan aposisi membuat acuan 'yang kamu tahan' tegas tanpa mengubah isi. 'Berteriak' dan 'jeritan' menjaga intensitas leksikal tanpa menjadi tidak alami.
  terminology: '''Tuhan Semesta Alam'' merupakan padanan Indonesia yang mapan dan sesuai untuk Κυρίου Σαβαώθ. Catatan alternatif ''Tuhan Sabaot'' tepat; penjelasannya sedikit diperjelas agar menyatakan bahwa bentuk Yunani mempertahankan/transliterasikan gelar Ibrani.'
  issues:
  - severity: medium
    issue: Acuan klausa relatif 'yang kamu tahan' ambigu
    rationale: Karena langsung mengikuti 'ladang-ladangmu', pembaca dapat mengaitkan klausa itu dengan ladang-ladang, padahal ἀφυστερημένος menerangkan μισθός ('upah'). Aposisi 'upah yang kamu tahan itu' menghilangkan ambiguitas ini.
  - severity: low
    issue: '''Sedang berteriak'' memberi aspek progresif tambahan'
    rationale: κράζει adalah bentuk kini yang menyatakan seruan yang hidup, tetapi tidak secara khusus menuntut penanda progresif Indonesia 'sedang'. Bentuk sederhana 'berteriak' lebih langsung dan tetap mempertahankan personifikasi.
  revised_text: Lihatlah, upah para pekerja yang telah menuai ladang-ladangmu—upah yang kamu tahan itu—berteriak, dan jeritan orang-orang yang telah menuai telah masuk ke telinga Tuhan Semesta Alam.[a]
