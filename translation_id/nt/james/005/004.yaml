revisions:
- from: Lihatlah, upah para pekerja yang menuai ladang-ladangmu, yang kamu tahan, sedang berteriak, dan jeritan orang-orang yang menuai telah masuk ke telinga Tuhan Semesta Alam.[a]
  to: Lihatlah, upah para pekerja yang telah menuai ladang-ladangmu—upah yang kamu tahan itu—berteriak, dan jeritan orang-orang yang telah menuai telah masuk ke telinga Tuhan Semesta Alam.[a]
  rationale: Revisi hanya memperjelas bahwa upah, bukan ladang, yang ditahan, dan menghilangkan aspek progresif yang tidak diperlukan. Pengulangan 'yang telah menuai' mencerminkan kedua partisipel aoris dalam teks sumber, sedangkan metafora 'masuk ke telinga' dan bentuk perfektum tetap dipertahankan.
  reviewer_model: gpt-5.6-terra
