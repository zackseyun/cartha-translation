id: JAS.5.4
reference: James 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: id
  text: Lihatlah, upah para pekerja yang telah menuai ladang-ladangmu—upah yang kamu tahan itu—berteriak, dan jeritan orang-orang yang telah menuai telah masuk ke telinga Tuhan Semesta Alam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuhan Sabaot.” Teks Yunani mempertahankan bentuk gelar Ibrani ini, yang secara tradisional juga ditransliterasikan sebagai “Sabaot.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian dengan tegas; “Lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya retorisnya.
- source_word: μισθὸς
  choice: upah
  rationale: Menunjuk pada bayaran yang menjadi hak para pekerja; bentuk tunggal bahasa Yunani dapat berfungsi secara kolektif.
- source_word: ἐργατῶν
  choice: para pekerja
  rationale: Istilah umum bagi orang-orang yang bekerja dan sesuai dengan konteks pertanian.
- source_word: ἀμησάντων
  choice: yang menuai
  rationale: Verba ini menunjuk pada pekerjaan menuai atau memanen; “menuai” mempertahankan gambaran agraris secara ringkas.
- source_word: χώρας
  choice: ladang-ladang
  rationale: Dalam konteks ini berarti tanah pertanian milik para penerima teguran; bentuk jamak sumber dipertahankan.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: yang kamu tahan
  rationale: Mempertahankan gagasan upah yang tidak dibayarkan oleh para pemilik tanah tanpa menambahkan istilah yang lebih interpretatif seperti “kamu rampas” atau “kamu gelapkan”.
- source_word: κράζει
  choice: sedang berteriak
  rationale: 'Mempertahankan personifikasi yang hidup: upah yang ditahan digambarkan terus berseru menuntut keadilan.'
- source_word: βοαὶ
  choice: jeritan
  rationale: Mengungkapkan seruan mendesak dari para penuai untuk memperoleh pertolongan atau keadilan.
- source_word: θερισάντων
  choice: orang-orang yang menuai
  rationale: Partisipel ini menunjuk kepada mereka yang melakukan pekerjaan menuai; ungkapan ini jelas dan alami.
- source_word: εἰς τὰ ὦτα
  choice: ke telinga
  rationale: Mempertahankan citra konkret dari ungkapan Semitik dalam teks Yunani tanpa membuat bahasa Indonesia terasa janggal.
- source_word: Κυρίου Σαβαὼθ
  choice: Tuhan Semesta Alam
  rationale: Menerjemahkan gelar ilahi yang berlatar ungkapan Ibrani tentang Tuhan atas bala tentara atau segala pasukan, dengan bentuk Indonesia yang bermakna dan telah dikenal.
- source_word: εἰσεληλύθασιν
  choice: telah masuk
  rationale: Bentuk perfektum menyatakan bahwa jeritan itu sudah masuk dan hasilnya tetap berlaku; “telah masuk” mempertahankan metafora serta aspek tersebut.
theological_decisions:
- issue: Penerjemahan gelar ilahi Κυρίου Σαβαὼθ
  choice: Tuhan Semesta Alam
  alternative: Tuhan Sabaot
  rationale: Σαβαώθ mempertahankan gelar Ibrani yang berkaitan dengan bala tentara atau pasukan. Teks utama menerjemahkan maknanya dalam bentuk Indonesia yang dikenal, sedangkan transliterasi tradisional dicantumkan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “menuai” dipertahankan untuk mencerminkan hubungan leksikal dalam ayat, sedangkan personifikasi upah yang berteriak dan gambaran jeritan yang masuk ke telinga Tuhan tetap dijaga.
