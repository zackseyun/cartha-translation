id: JAS.5.3
reference: James 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: id
  text: Emas dan perakmu telah berkarat[a], dan karatnya akan menjadi bukti yang memberatkan kamu serta akan memakan dagingmu seperti api.[b] Kamu telah menimbun harta pada hari-hari terakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah berkarat.” Kata Yunani ini juga dapat berarti mengalami korosi atau menjadi kusam; emas dan perak tidak berkarat dalam pengertian ilmiah yang sempit.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Karatnya akan menjadi bukti yang memberatkan kamu dan akan memakan dagingmu. Seperti api, kamu telah menimbun harta pada hari-hari terakhir.” Frasa “seperti api” mungkin dihubungkan dengan klausa terakhir, bukan dengan “akan memakan dagingmu.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: telah berkarat
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil proses sebelumnya. Walaupun emas dan perak tidak berkarat dalam pengertian ilmiah yang sempit, kata Yunani ini dapat menunjuk pada korosi atau noda pada logam; pilihan ini mempertahankan gambaran kenabian yang tajam.
- source_word: ὁ ἰὸς αὐτῶν
  choice: karatnya
  rationale: Dalam konteks logam, ἰός menunjuk pada hasil atau efek korosi, bukan racun. 'Karat' mempertahankan pengulangan leksikal dan gambaran konkret, meski 'korosi' lebih luas secara teknis.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: akan menjadi bukti yang memberatkan kamu
  rationale: Ungkapan ini bersifat forensik. Pilihan tersebut menyampaikan bahwa karat harta itu menjadi bukti dalam perkara yang menentang para penimbun kekayaan.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: akan memakan dagingmu
  rationale: Terjemahan konkret ini mempertahankan gambaran Yunani yang keras mengenai kehancuran dan penghakiman.
- source_word: ὡς πῦρ
  choice: seperti api
  rationale: Frasa ini paling wajar dihubungkan dengan klausa sebelumnya sehingga melukiskan karat yang memakan daging seperti api, sambil mencatat kemungkinan hubungan sintaksis lain dalam catatan kaki.
- source_word: ἐθησαυρίσατε
  choice: telah menimbun harta
  rationale: Kata kerja ini berarti menyimpan atau mengumpulkan sebagai harta. 'Menimbun harta' menyampaikan isi leksikal serta nuansa negatif konteks tanpa menghilangkan unsur 'harta'.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: pada hari-hari terakhir
  rationale: Ini adalah ungkapan eskatologis yang lazim. 'Pada hari-hari terakhir' langsung, alami, dan tidak menambahkan kata penunjuk yang tidak eksplisit.
theological_decisions:
- issue: Hubungan sintaksis ὡς πῦρ
  choice: 'Dihubungkan dengan klausa sebelumnya: karat itu akan memakan daging mereka ''seperti api''.'
  alternative: 'Dihubungkan dengan klausa berikutnya: ''Kamu telah menimbun harta seperti api pada hari-hari terakhir.'''
  rationale: Urutan kata dan alur gambaran lebih mendukung hubungan dengan φάγεται, tetapi tanda baca tidak terdapat dalam naskah awal dan hubungan alternatif memiliki sejarah penafsiran; karena itu ambiguitas asli didokumentasikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan gambaran konkret. Bentuk persona kedua jamak dalam bahasa sumber diterjemahkan dengan 'kamu', yang netral jumlah dalam bahasa Indonesia; bentuk kepunyaan '-mu' dipakai secara konsisten. Tanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
