  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: id
  text: Kalian telah menjatuhkan hukuman atas orang benar itu[a] dan membunuhnya. Tidakkah ia melawan kamu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “orang benar itu” dapat menunjuk secara representatif kepada orang benar yang ditindas oleh orang kaya. Sebagian penafsir juga melihat kemungkinan gema kepada Yesus sebagai “Yang Benar”.
    reason: alternative_reading
  - marker: b
    text: 'Teks Yunani diberi tanda tanya: “Tidakkah ia melawan kamu?” Pertanyaan dengan οὐκ ini dapat dipahami secara retoris; daya retoris dan rujukannya dalam konteks ditafsirkan secara berbeda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: kamu telah menjatuhkan hukuman atas
  rationale: Bentuk aoristus aktif orang kedua jamak menyatakan tuduhan langsung kepada para penindas. “Menjatuhkan hukuman atas” mempertahankan nuansa yudisial καταδικάζω dengan lebih tepat daripada sekadar “menghukum”.
- source_word: ἐφονεύσατε
  choice: dan membunuhnya
  rationale: φονεύω menunjuk pada pembunuhan yang salah secara moral, sehingga “membunuh” mempertahankan kerasnya tuduhan. Akhiran “-nya” merujuk kembali kepada orang benar itu dan menghasilkan bahasa Indonesia yang alami.
- source_word: τὸν δίκαιον
  choice: orang benar itu
  rationale: Adjektiva maskulin tunggal dengan artikel dipakai secara substantival. “Orang benar itu” alami dalam bahasa Indonesia, tetap tunggal dan definit, serta tidak menentukan apakah ungkapan ini bersifat representatif atau merupakan gema gelar bagi Yesus.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Ia tidak melawan kamu
  rationale: ἀντιτάσσομαι berarti menentang atau melawan. “Melawan” ringkas dan alami; “ia” mempertahankan subjek tunggal yang merujuk kepada orang benar itu. Bentuk pernyataan mengikuti pemahaman bahwa pertanyaan Yunani tersebut menyampaikan ketidakadaan perlawanan, sedangkan bentuk interogatif dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan ungkapan “orang benar itu”
  choice: Dibiarkan terbuka sebagai seorang benar yang mewakili korban penindasan dalam konteks langsung
  alternative: Gema atau rujukan terselubung kepada Yesus sebagai “Yang Benar”
  rationale: Konteks mengecam orang kaya yang menindas orang benar, dan bentuk tunggal dapat bersifat representatif. Namun, kemungkinan gema kristologis tidak disingkirkan dan dicatat agar ketegangan penafsiran tetap terpelihara.
- issue: Daya kalimat terakhir
  choice: 'Pernyataan: “Ia tidak melawan kamu.”'
  alternative: 'Pertanyaan sesuai tanda baca SBLGNT: “Bukankah ia melawan kamu?” atau secara lebih harfiah, “Tidakkah ia melawan kamu?”'
  rationale: Teks Yunani diberi tanda tanya dalam SBLGNT, tetapi kalimat itu juga dipahami sebagai pertanyaan retoris yang dalam konteks menyatakan bahwa korban tidak memberikan perlawanan. Bentuk pernyataan dipilih demi kejelasan bahasa Indonesia, sementara bentuk formal Yunani dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Susunan kalimat dibuat alami tanpa mengurangi bobot yudisial dan moral kedua verba Yunani. Pronomina “kamu” dapat merujuk kepada kelompok karena bahasa Indonesia tidak membedakan bentuk tunggal dan jamak.
