  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: id
  text: Janganlah kalian saling mencela[a], Saudara-saudara[b]. Orang yang mencela seorang saudara atau menghakimi saudaranya mencela hukum dan menghakimi hukum. Jika kamu menghakimi hukum, kamu bukanlah pelaku hukum, melainkan hakim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling memfitnah” atau “saling berbicara buruk tentang satu sama lain”; kata Yunani ini berarti berbicara menentang seseorang dengan cara yang dapat merusak nama baiknya.
    reason: lexical_alternative
  - marker: b
    text: Sapaan “Saudara-saudara” di sini kemungkinan mencakup seluruh jemaat, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: menjelekkan
  rationale: Kata ini menunjuk pada tindakan berbicara menentang seseorang dengan nada buruk atau merusak nama baiknya. “Menjelekkan” alami dalam bahasa Indonesia dan memungkinkan pengulangan verbal yang menopang alur argumentasi ayat ini, tanpa membatasi maknanya pada fitnah dalam arti hukum.
- source_word: ἀλλήλων
  choice: saling
  rationale: Padanan timbal balik yang alami dan ringkas dalam larangan bahasa Indonesia.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Bentuk sapaan jamak ini mempertahankan bahasa kekeluargaan dalam surat Yakobus. Dalam pemakaian konteks jemaat, sapaan itu kemungkinan mencakup laki-laki dan perempuan, yang dijelaskan dalam catatan kaki.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: Mempertahankan metafora kekeluargaan dan konsistensi leksikal, sambil memakai bentuk Indonesia yang tidak perlu menandai gender gramatikal.
- source_word: ἢ
  choice: atau
  rationale: Menyajikan kedua tindakan sebagai tindakan sejajar sesuai bacaan Yunani yang diberikan.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: menghakimi
  rationale: Mempertahankan pengulangan akar kata dan cakupan makna yang luas. “Menghukum” akan terlalu menyempitkan makna.
- source_word: νόμου / νόμον
  choice: hukum
  rationale: Bahasa Indonesia lazim tidak memerlukan artikel tertentu. Ayat ini tidak secara eksplisit mempersempit acuannya menjadi hukum Musa, hukum kerajaan, atau sebutan khusus lain.
- source_word: ποιητὴς
  choice: pelaku
  rationale: Padanan ringkas yang mempertahankan kontras khas Yakobus antara melakukan hukum dan menempatkan diri sebagai hakimnya.
- source_word: κριτής
  choice: hakim
  rationale: Padanan langsung bagi nomina Yunani dan membentuk kontras tajam dengan “pelaku”.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat
  choice: Saudara-saudara dalam teks utama, dengan cakupan inklusif dijelaskan dalam catatan kaki.
  alternative: saudara-saudari; sesama orang percaya
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam konteks sapaan kepada jemaat kemungkinan mencakup seluruh komunitas. “Saudara-saudara” mempertahankan bentuk sapaan tradisional dan metafora kekeluargaan tanpa menutup cakupan kontekstualnya.
- issue: Acuan νόμος, “hukum”
  choice: Menerjemahkannya sebagai “hukum” tanpa penjelasan tambahan dalam teks utama.
  alternative: hukum Musa; hukum kerajaan; hukum Allah
  rationale: Konteks surat mengarah pada hukum ilahi yang telah dibahas Yakobus, khususnya tuntutan etis mengenai kasih kepada sesama, tetapi ayat ini sendiri tidak menentukan sebutan yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “kalian” dipakai untuk jamak pada larangan pembuka, sedangkan “kamu” mengikuti peralihan retoris Yunani ke orang kedua tunggal. Pengulangan “menjelekkan,” “menghakimi,” dan “hukum” sengaja dipertahankan untuk menjaga rangkaian logika teks.
