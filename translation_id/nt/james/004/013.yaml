base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: id
  text: Sekarang, dengarkanlah, kalian yang berkata, “Hari ini atau besok kami akan pergi ke kota ini[a], menghabiskan setahun di sana, berdagang, dan mendapat keuntungan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “ke kota anu.” Teks Yunani berbunyi “kota ini,” dengan kata penunjuk yang mengacu pada kota tertentu dalam rencana para pembicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Sekarang, dengarlah
  rationale: Ungkapan ini berfungsi sebagai seruan untuk menarik perhatian sekaligus mengawali teguran. Pilihan ini mempertahankan nada langsungnya dalam bahasa Indonesia modern.
- source_word: οἱ λέγοντες
  choice: kalian yang berkata
  rationale: Partisip berartikel ini berfungsi sebagai sapaan langsung kepada sekelompok orang. “Kalian” menyatakan bentuk jamak secara wajar dan mempertahankan daya konfrontatif kalimat.
- source_word: Σήμερον ἢ αὔριον
  choice: Hari ini atau besok
  rationale: ἤ bersifat disjungtif, sehingga “atau” mempertahankan pilihan waktu yang dinyatakan dalam rencana mereka.
- source_word: πορευσόμεθα
  choice: kami akan pergi
  rationale: Bentuk futurum πορεύομαι di sini menyatakan gerak secara lugas. “Akan pergi” merupakan padanan Indonesia yang alami; “kami” cocok sebagai ucapan para perencana kepada pihak lain, meskipun bahasa Yunani sendiri tidak membedakan “kami” dan “kita”.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: ke kota ini
  rationale: εἰς menyatakan tujuan dan τήνδε menunjuk kota tertentu dalam rencana para pembicara. “Ke kota ini” alami dalam bahasa Indonesia serta mempertahankan unsur demonstratif Yunani.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: tinggal di sana selama setahun
  rationale: ποιέω dengan akusatif waktu merupakan idiom untuk melewatkan suatu jangka waktu. Dalam konteks perjalanan dagang, “tinggal ... selama setahun” menyampaikan maksudnya secara alami.
- source_word: ἐμπορευσόμεθα
  choice: berdagang
  rationale: Kata kerja ini menunjuk kegiatan niaga atau perdagangan. “Berdagang” ringkas, alami, dan mempertahankan konteks komersial.
- source_word: κερδήσομεν
  choice: mendapat keuntungan
  rationale: Dalam konteks perdagangan, kata ini berarti memperoleh laba. “Mendapat keuntungan” menyatakan hasil finansial yang dimaksud tanpa memperluas maknanya.
theological_decisions:
- issue: Nada teguran apostrofis
  choice: Sapaan langsung “kalian yang berkata”
  alternative: Deskripsi tidak langsung “orang-orang yang berkata”
  rationale: Yakobus sedang menghadapkan tegurannya langsung kepada para pembuat rencana, bukan sekadar menggambarkan mereka dari kejauhan. Pilihan ini mempertahankan daya retoris teks tanpa menambahkan penafsiran doktrinal.
- issue: Ketercakupan kata ganti orang pertama jamak
  choice: “kami” dalam kutipan
  alternative: “kita”
  rationale: Bahasa Yunani tidak membedakan bentuk inklusif dan eksklusif. Dalam bingkai sapaan “kalian yang berkata,” “kami” terdengar paling alami sebagai pernyataan para perencana kepada pihak lain, tetapi pilihan ini tidak dimaksudkan untuk menetapkan siapa saja yang tercakup dalam kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nada teguran dipertahankan melalui “Sekarang, dengarlah,” sedangkan rangkaian rencana bisnis disusun dengan verba yang alami dan sejajar.
