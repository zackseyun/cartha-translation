id: JAS.4.8
reference: James 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: id
  text: Mendekatlah kepada Allah, dan Dia akan mendekat kepada kalian. Bersihkanlah tangan kalian, hai orang-orang berdosa, dan murnikanlah hati kalian, hai orang-orang yang mendua hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berjiwa dua.” Istilah ini menggambarkan orang yang kesetiaan atau komitmen batinnya terbagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Mendekatlah
  rationale: Imperatif aoris aktif orang kedua jamak. Pilihan ini alami dalam bahasa Indonesia, mempertahankan makna relasional mendekati Allah, dan memungkinkan kesejajaran dengan klausa berikutnya.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Objek datif sesudah ἐγγίζω diterjemahkan secara langsung dan wajar.
- source_word: ἐγγιεῖ
  choice: Dia akan mendekat
  rationale: Indikatif futur aktif orang ketiga tunggal; Allah merupakan subjek yang tersirat. Pengulangan kata 'mendekat' mempertahankan kesejajaran verbal bahasa Yunani.
- source_word: καθαρίσατε
  choice: Bersihkanlah
  rationale: Imperatif aoris aktif yang mempertahankan daya perintah dan dapat memuat nuansa ritual maupun moral.
- source_word: χεῖρας
  choice: tangan kalian
  rationale: Kata ganti kepunyaan ditambahkan secara idiomatis untuk sapaan langsung. Gambaran tangan dipertahankan tanpa menjabarkannya sebagai perilaku lahiriah.
- source_word: ἁμαρτωλοί
  choice: hai orang-orang berdosa
  rationale: Vokatif jamak diterjemahkan sebagai teguran langsung; 'hai' menandai sapaan dengan jelas dan tetap bermartabat.
- source_word: ἁγνίσατε
  choice: murnikanlah
  rationale: Pilihan ini membedakan ἁγνίσατε dari καθαρίσατε dan mempertahankan peralihan dari pembersihan tangan menuju pemurnian hati.
- source_word: καρδίας
  choice: hati kalian
  rationale: Gambaran hati sebagai pusat batin, motif, dan kesetiaan dipertahankan tanpa parafrasa interpretatif.
- source_word: δίψυχοι
  choice: hai orang-orang yang mendua hati
  rationale: Vokatif jamak ini menunjuk pada kesetiaan atau komitmen batin yang terbagi. 'Mendua hati' alami dan mudah dipahami dalam bahasa Indonesia; gambaran harfiah Yunani dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Gambaran jasmani dalam seruan moral
  choice: Mempertahankan gambaran 'tangan' dan 'hati' tanpa menjelaskannya sebagai tindakan lahiriah dan motif batin.
  alternative: Memparafrasakan kedua gambaran itu secara langsung sebagai perilaku dan motif.
  rationale: Bahasa Yakobus dapat memuat gema pemurnian ritual sekaligus daya moral. Mempertahankan gambarnya menghindari penyempitan makna.
- issue: Makna δίψυχοι
  choice: Menerjemahkannya sebagai 'orang-orang yang mendua hati' dalam teks utama.
  alternative: Berjiwa dua.
  rationale: Ungkapan Yunani menggambarkan batin atau kesetiaan yang terbagi. Terjemahan utama dibuat jelas bagi pembaca modern, sementara citra harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Bentuk 'kalian' menyatakan orang kedua jamak secara jelas. Kesejajaran 'mendekatlah—akan mendekat' serta pasangan 'tangan—hati' dipertahankan.
