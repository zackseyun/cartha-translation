  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: id
  text: Jadi, bagi orang yang tahu apa yang baik untuk dilakukan tetapi tidak melakukannya, hal itu adalah dosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότι
  choice: orang yang tahu
  rationale: Partisip datif tunggal ini dipakai secara substantival dan menunjuk secara umum kepada seseorang yang memiliki pengetahuan; bentuk tunggal generiknya dipertahankan secara alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari pembahasan sebelumnya. “Jadi” alami dalam bahasa Indonesia modern dan tetap memperlihatkan hubungan logisnya.
- source_word: καλὸν ποιεῖν
  choice: berbuat baik
  rationale: Ungkapan ini menyatakan tindakan yang secara moral baik atau benar. “Berbuat baik” ringkas, luas, dan idiomatis tanpa mempersempitnya pada tindakan tertentu.
- source_word: καὶ μὴ ποιοῦντι
  choice: tetapi tidak melakukannya
  rationale: 'καί menghubungkan dua keadaan yang berlawanan secara nyata: mengetahui yang baik dan tidak mengerjakannya. “Tetapi” mengungkapkan kontras tersebut secara alami, sedangkan “melakukannya” memasok objek yang tersirat dari klausa sebelumnya.'
- source_word: ἁμαρτία
  choice: dosa
  rationale: Nomina predikatif tanpa artikel ini menyatakan sifat tindakan tersebut sebagai dosa. Bentuk “adalah dosa” mempertahankan daya pernyataannya tanpa harus menambahkan pengertian denominasi tertentu.
- source_word: αὐτῷ
  choice: baginya
  rationale: 'Datif ini menyatakan acuan pribadi: sehubungan dengan orang itu, kelalaiannya merupakan dosa. “Baginya” mempertahankan penerapan personal dan bentuk tunggal generik.'
- source_word: ἐστιν
  choice: itu adalah
  rationale: Kopula menghubungkan tindakan yang tidak dilakukan dengan predikat “dosa”; “itu” secara alami merujuk kembali kepada kelalaian yang baru disebutkan.
theological_decisions:
- issue: Cakupan pernyataan tentang kelalaian melakukan yang baik
  choice: Ayat ini menyatakan bahwa orang yang mengetahui apa yang baik tetapi tidak melakukannya berdosa, dengan ungkapan yang tetap luas.
  alternative: Membatasi pernyataan ini hanya pada rencana congkak dalam konteks langsung, atau merumuskannya sebagai doktrin teknis tentang dosa karena kelalaian.
  rationale: Konteks langsung membahas perencanaan hidup yang congkak, tetapi susunan kalimatnya bersifat umum. Terjemahan mempertahankan hubungan dengan konteks melalui “Jadi” sekaligus tidak mempersempit prinsip etisnya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Orang yang” mempertahankan bentuk tunggal generik tanpa penggunaan kata ganti bergender. Tidak diperlukan catatan kaki karena pilihan utama menyampaikan struktur dan ambiguitas relevan secara memadai.
