  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: id
  text: Atau apakah kamu mengira bahwa Kitab Suci berkata tanpa maksud? Roh yang dibuat-Nya tinggal di dalam kita memiliki kerinduan yang penuh kecemburuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh yang dibuat-Nya tinggal di dalam kita memiliki kerinduan yang penuh iri hati.” Bahasa Yunani dapat menunjuk kepada Roh Kudus ataupun roh manusia, dan ungkapan yang diterjemahkan “penuh kecemburuan” juga dapat diterjemahkan “penuh iri hati.”
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: tanpa maksud
  rationale: Dalam konteks ini, adverbia tersebut menyatakan bahwa Kitab Suci tidak berbicara secara kosong, sia-sia, atau tanpa tujuan. 'Tanpa maksud' alami dalam bahasa Indonesia dan mempertahankan daya retoris pertanyaannya.
- source_word: ἡ γραφὴ
  choice: Kitab Suci
  rationale: Bentuk tunggal dengan artikel merupakan sebutan lazim bagi tulisan suci yang berwibawa; 'Kitab Suci' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: Πρὸς φθόνον
  choice: dengan cemburu
  rationale: Frasa ini diterjemahkan secara adverbial untuk menerangkan kerinduan yang kuat. 'Dengan cemburu' memungkinkan pengertian kecemburuan yang menuntut kesetiaan, sementara arti negatif 'dengan iri hati' dicatat dalam catatan kaki.
- source_word: ἐπιποθεῖ
  choice: merindukan kita
  rationale: Verba ini menyatakan hasrat atau kerinduan yang kuat. Objek 'kita' dibuat eksplisit dalam bahasa Indonesia agar konstruksi ini wajar, meskipun objeknya tersirat dalam ungkapan Yunani yang sulit.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Huruf kapital mencerminkan pembacaan utama bahwa yang dimaksud ialah Roh Kudus. Karena tata bahasa juga memungkinkan roh manusia, alternatif itu dipertahankan dalam catatan kaki.
- source_word: κατῴκισεν
  choice: dibuat-Nya tinggal
  rationale: 'Padanan ini mempertahankan daya kausatif verba: Allah menyebabkan Roh itu tinggal, bukan sekadar menyatakan bahwa Roh tinggal. Akhiran ''-Nya'' menyatakan pelaku ilahi yang tersirat.'
- source_word: ἐν ἡμῖν
  choice: di dalam kita
  rationale: Frasa ini paling alami menyatakan keberdiaman di dalam umat percaya, bukan sekadar kehadiran di antara mereka.
theological_decisions:
- issue: Acuan τὸ πνεῦμα
  choice: Roh dipahami sebagai Roh Kudus yang dibuat Allah tinggal di dalam kita.
  alternative: roh manusia yang dibuat Allah tinggal di dalam kita
  rationale: Tata bahasa Yunani memungkinkan kedua pembacaan. Teks utama memilih Roh Kudus karena bahasa tentang Allah membuat Roh tinggal di dalam umat percaya selaras dengan gagasan keberdiaman ilahi, tetapi ketaksaan yang nyata dipertahankan dalam catatan kaki.
- issue: Nilai moral ungkapan Πρὸς φθόνον
  choice: dengan cemburu
  alternative: dengan iri hati
  rationale: Jika subjeknya Roh Kudus, 'dengan cemburu' dapat menyatakan tuntutan Allah yang benar atas kesetiaan umat-Nya tanpa mengaitkan sifat berdosa kepada Allah. Namun, φθόνος dapat bernuansa iri hati, sehingga alternatif tersebut dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kata ganti orang kedua tunggal 'kamu' mengikuti bentuk jamak yang dipakai secara kolektif dalam konteks surat, sedangkan 'kita' bersifat inklusif. Terjemahan mempertahankan susunan pertanyaan retoris dan ketaksaan teologis ayat yang terkenal sulit ini.
