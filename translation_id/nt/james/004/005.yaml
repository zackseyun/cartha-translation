  naturalness: “Kitab Suci berkata tanpa maksud” adalah bahasa Indonesia baku dan dapat dipahami, meski “berkata sia-sia” lebih idiomatis. Frasa “merindukan kita dengan cemburu” lancar, tetapi kelancarannya diperoleh dengan menambahkan objek yang tidak dinyatakan sumber. Revisi memakai ungkapan nomina yang wajar tanpa menambahkan objek tersebut.
  terminology: “Kitab Suci,” “Roh,” dan “di dalam kita” sesuai dengan register Kristen Indonesia modern dan dengan pembacaan utama yang dipilih audit bahasa Inggris. “Dengan penuh kecemburuan” menyampaikan pembacaan yang tidak secara langsung membebankan iri hati yang berdosa kepada Roh, sementara alternatif “iri hati” tetap tersedia dalam catatan kaki.
