- from: Atau apakah kamu mengira bahwa Kitab Suci berkata tanpa maksud? Roh yang dibuat-Nya tinggal di dalam kita merindukan kita dengan cemburu.[a]
  to: Atau apakah kamu mengira bahwa Kitab Suci berkata tanpa maksud? Roh yang dibuat-Nya tinggal di dalam kita memiliki kerinduan yang penuh kecemburuan.[a]
  rationale: 'Revisi menghapus objek “kita” yang tidak dinyatakan dalam teks Yunani. Karena verba Yunani sulit dialihkan secara idiomatis ke bahasa Indonesia tanpa objek, “memiliki kerinduan yang penuh kecemburuan” mempertahankan gagasan hasrat yang kuat serta nuansa kecemburuan tanpa mengklaim siapa objek kerinduan itu. Catatan kaki tetap memelihara dua ketaksaan penting: acuan πνεῦμα dan kemungkinan “iri hati” bagi Πρὸς φθόνον.'
