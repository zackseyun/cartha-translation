  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: id
  text: Padahal, kamu tidak tahu apa yang akan terjadi besok. Apa sebenarnya hidupmu? Sebab kamu adalah kabut[a] yang tampak sebentar, lalu lenyap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “uap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες οὐκ ἐπίστασθε
  choice: Padahal, kamu tidak tahu
  rationale: οἵτινες mengaitkan pernyataan ini dengan orang-orang yang baru saja berbicara tentang rencana hari esok, sedangkan ἐπίστασθε menyatakan pengetahuan. “Padahal” menyampaikan kontras kontekstual itu secara alami dalam bahasa Indonesia.
- source_word: τὸ τῆς αὔριον
  choice: apa yang akan terjadi besok
  rationale: Ungkapan Yunani ini eliptis dan menunjuk pada hal atau keadaan yang berkaitan dengan hari esok. Pilihan ini jelas dan alami tanpa menentukan secara berlebihan apa yang akan terjadi.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Apa sebenarnya hidupmu?
  rationale: ποία menanyakan sifat atau hakikat kehidupan. Bentuk ini mempertahankan pertanyaan retoris yang ringkas sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἀτμὶς
  choice: kabut
  rationale: Kata ini menggambarkan uap atau kabut yang tampak sesaat dan segera hilang. “Kabut” menghasilkan gambaran yang alami dalam bahasa Indonesia, sedangkan “uap” dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: πρὸς ὀλίγον φαινομένη
  choice: yang tampak sebentar
  rationale: Frasa ini menyatakan bahwa kabut itu terlihat hanya dalam waktu singkat. “Tampak sebentar” ringkas, alami, dan mempertahankan unsur penglihatan dalam φαινομένη.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: lalu lenyap
  rationale: ἔπειτα menandai urutan berikutnya, dan ἀφανιζομένη menyatakan hilangnya sesuatu dari pandangan. “Lalu lenyap” mempertahankan urutan dan daya gambar metafora tersebut.
theological_decisions:
- issue: Gambaran metaforis tentang kefanaan hidup manusia
  choice: Mempertahankan gambaran manusia sebagai kabut yang tampak sebentar lalu lenyap.
  alternative: Menguraikannya secara interpretatif sebagai “hidupmu singkat dan tidak pasti.”
  rationale: Konteks menyoroti keterbatasan manusia ketika membuat rencana tentang masa depan. Metafora asli menyampaikan singkatnya dan rapuhnya hidup tanpa menambahkan klaim khusus tentang kematian, penghakiman, atau doktrin lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti “kamu” mengikuti sapaan jamak dalam konteks; bahasa Indonesia tidak membedakan jumlah pada bentuk ini. Pertanyaan retoris dibuat alami tanpa menghilangkan ketegangan teks.
