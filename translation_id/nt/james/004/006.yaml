id: JAS.4.6
reference: James 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: id
  text: Namun, Ia memberikan anugerah yang lebih besar. Karena itu, dikatakan[a], “Allah menentang orang yang sombong, tetapi memberikan anugerah kepada orang yang rendah hati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, Ia berkata,” atau “Karena itu, Kitab Suci berkata.” Bahasa Yunani membiarkan subjek kata “berkata” tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: yang lebih besar
  rationale: Mempertahankan bentuk komparatif dan terdengar alami ketika menerangkan ‘anugerah’.
- source_word: δίδωσιν χάριν
  choice: memberikan anugerah
  rationale: Menerjemahkan pasangan verba-objek secara langsung dan mempertahankan pengulangan yang sama pada kedua bagian ayat.
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari pernyataan sebelumnya secara ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: λέγει
  choice: dikatakan
  rationale: Bentuk impersonal ini tidak menetapkan subjek yang dibiarkan tersirat dalam bahasa Yunani, tetapi tetap memperkenalkan kutipan Kitab Suci.
- source_word: ὑπερηφάνοις
  choice: orang yang sombong
  rationale: Mengungkapkan adjektiva substantival secara alami serta mempertahankan kontras etis dengan orang yang rendah hati.
- source_word: ἀντιτάσσεται
  choice: menentang
  rationale: Menyampaikan perlawanan aktif Allah dengan jelas dalam bahasa Indonesia masa kini.
- source_word: ταπεινοῖς
  choice: orang yang rendah hati
  rationale: Mengungkapkan adjektiva substantival secara alami dan sesuai dengan pengertian etis dalam konteks.
- source_word: δὲ
  choice: Namun / tetapi
  rationale: Kedua pilihan mempertahankan daya kontras konjungsi pada awal ayat dan di dalam kutipan.
theological_decisions:
- issue: Subjek tersirat dalam rumusan kutipan λέγει
  choice: Karena itu, dikatakan
  alternative: Karena itu, Ia berkata; Karena itu, Kitab Suci berkata
  rationale: Bahasa Yunani tidak menyebutkan subjek secara eksplisit. Bentuk impersonal mempertahankan ketidakjelasan itu dan tidak menentukan apakah subjeknya Allah atau Kitab Suci.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. ‘Anugerah’ dipilih untuk χάρις dan diulang demi mempertahankan pola retoris teks sumber. Kata ganti ‘Ia’ tidak dengan sendirinya menyelesaikan identitas subjek dari konteks sebelumnya.
source_grounding:
  english_pob_role: consult_only
