source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: id
  text: Dari manakah datangnya peperangan dan dari manakah datangnya perkelahian[a] di antara kalian?[b] Bukankah itu berasal dari sini—dari kenikmatan kalian yang berperang di dalam anggota tubuh kalian?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “konflik-konflik ... pertengkaran-pertengkaran.” Bahasa Yunani memakai istilah militer, secara harfiah “peperangan” dan “perkelahian,” untuk perselisihan dalam komunitas.
    reason: lexical_alternative
  - marker: b
    text: Atau “di dalam kalian.” Ungkapan Yunani dapat menunjuk pada konflik di antara para pembaca atau konflik di dalam diri mereka. Ayat ini secara keseluruhan menghubungkan pertikaian lahiriah dengan dorongan batiniah.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “anggota-anggota.” Istilah ini dapat menunjuk pada bagian-bagian tubuh atau, secara lebih luas, pada berbagai daya yang bekerja dalam diri seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Dari manakah datangnya
  rationale: Mempertahankan pertanyaan tentang asal atau sumber serta pengulangan retorisnya dalam kedua klausa.
- source_word: πόλεμοι
  choice: peperangan
  rationale: Mempertahankan gambaran militer yang kuat dalam bahasa Yunani, meskipun dalam konteks ini kata tersebut digunakan secara kiasan untuk konflik serius dalam jemaat.
- source_word: μάχαι
  choice: perkelahian
  rationale: Membedakannya dari πόλεμοι sekaligus memakai istilah Indonesia yang wajar untuk bentrokan atau pertikaian nyata.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Konteks langsung menunjuk pada konflik antarpembaca sebagai komunitas, sementara kemungkinan arti batiniah tetap dicatat dalam catatan kaki.
- source_word: οὐκ ἐντεῦθεν
  choice: Bukankah semuanya berasal dari sini
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan jawaban ya dan menunjuk ke sumber yang segera disebutkan sesudahnya.
- source_word: ἡδονῶν
  choice: kenikmatan
  rationale: Merupakan padanan langsung bagi kenikmatan atau kesenangan, tanpa mengubahnya menjadi istilah yang lebih interpretatif seperti hawa nafsu.
- source_word: στρατευομένων
  choice: yang berperang
  rationale: Mempertahankan metafora militer yang sedang berlangsung dan menggemakan kata peperangan pada awal ayat.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: di dalam anggota-anggota tubuh kalian
  rationale: Mempertahankan metafora tubuh dan tidak langsung mempersempit maksudnya menjadi semata-mata gejolak batin.
theological_decisions:
- issue: Apakah konflik pada awal ayat semata-mata bersifat batiniah atau merupakan perselisihan dalam komunitas
  choice: Frasa pertama diterjemahkan “di antara kalian,” sedangkan frasa terakhir mempertahankan gambaran “di dalam anggota-anggota tubuh kalian.”
  alternative: Menerjemahkan kedua frasa secara batiniah, misalnya “di dalam diri kalian,” atau mengubah frasa terakhir menjadi “dalam batin kalian.”
  rationale: Retorika Yakobus menghubungkan pertikaian lahiriah dalam komunitas dengan kenikmatan yang berperang dalam diri manusia. Terjemahan ini mempertahankan kedua dimensi tersebut tanpa meleburkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” retorika pertanyaan dipertahankan, dan metafora militer serta tubuh dijaga tanpa terdengar kuno. Tanda pisah menandai penjelasan sumber konflik yang langsung mengikuti “dari sini.”
