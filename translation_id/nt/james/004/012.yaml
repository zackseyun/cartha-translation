id: JAS.4.12
reference: James 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: id
  text: Hanya ada satu Pemberi Hukum dan Hakim, yaitu Dia yang berkuasa menyelamatkan dan membinasakan. Namun, siapakah kamu, yang menghakimi sesamamu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Pemberi Hukum
  rationale: Menyampaikan pribadi yang menetapkan atau memberikan hukum, bukan sekadar orang yang membuat undang-undang manusia.
- source_word: κριτής / κρίνων
  choice: Hakim / menghakimi
  rationale: Mempertahankan kaitan leksikal antara Allah sebagai Hakim dan tindakan manusia yang menghakimi sesamanya.
- source_word: ὁ δυνάμενος
  choice: Dia yang berkuasa
  rationale: Mengungkapkan kemampuan sekaligus kuasa yang tersirat dalam konteks tindakan ilahi.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: menyelamatkan dan membinasakan
  rationale: Mempertahankan pasangan kontras yang kuat dalam bahasa Yunani tanpa mempersempit maknanya pada keselamatan jasmani atau rohani saja.
- source_word: πλησίον
  choice: sesamamu
  rationale: Padanan Indonesia yang alami untuk orang lain yang diperlakukan sebagai sesama atau tetangga dalam relasi etis.
theological_decisions:
- issue: Identitas satu-satunya Pemberi Hukum dan Hakim
  choice: Kata gelar ditulis dengan huruf kapital dan dirujuk sebagai “Dia”
  alternative: 'Menggunakan huruf kecil: “pemberi hukum dan hakim”'
  rationale: Konteks menunjuk kepada Allah, tetapi terjemahan tidak menambahkan nama atau uraian teologis yang tidak dinyatakan dalam ayat.
- issue: Nuansa frasa ὁ κρίνων
  choice: “yang menghakimi sesamamu”
  alternative: “sehingga kamu menghakimi sesamamu” atau “untuk menghakimi sesamamu”
  rationale: Bentuk partisipel Yunani dipertahankan secara langsung agar teguran retoris dan kemungkinan nuansanya tidak diubah menjadi klaim eksplisit tentang hak atau kelayakan.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan khidmat. Struktur retoris Yunani dipertahankan: pernyataan tentang satu Pemberi Hukum dan Hakim diikuti pertanyaan tajam kepada pembaca.'
