  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: id
  text: Hendaklah kalian merasa sengsara, berdukacita, dan menangis. Biarlah tawa kalian berubah menjadi perkabungan dan sukacita kalian menjadi kemuraman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesedihan yang muram.” Kata Yunani ini menunjuk pada keadaan sedih, murung, dan tertunduk.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Rasakanlah kesengsaraan
  rationale: Imperatif aoris ini menyerukan agar para pembaca sungguh mengalami dan mengakui keadaan mereka yang menyedihkan. Ungkapan ini mempertahankan ketajaman perintah tanpa memakai bentuk Indonesia yang janggal seperti 'jadilah sengsara' dan tanpa melebur maknanya dengan dua verba berikutnya.
- source_word: πενθήσατε
  choice: berdukacitalah
  rationale: Menyampaikan kesedihan mendalam yang dalam konteks ini berkaitan dengan pertobatan, serta tetap berbeda dari tindakan menangis yang disebut sesudahnya.
- source_word: κλαύσατε
  choice: menangislah
  rationale: Padanan Indonesia yang alami dan berbobot bagi tindakan mencucurkan tangis.
- source_word: ὁ γέλως ὑμῶν
  choice: tawa kalian
  rationale: Mempertahankan nomina konkret 'tawa' dan bentuk jamak orang kedua dalam ragam Indonesia modern.
- source_word: εἰς πένθος
  choice: menjadi perkabungan
  rationale: Menjaga hubungan semantis dengan πενθήσατε sekaligus menyatakan perubahan menuju keadaan berkabung.
- source_word: μετατραπήτω
  choice: Biarlah ... berubah
  rationale: Mencerminkan imperatif pasif orang ketiga secara alami dalam bahasa Indonesia dan mempertahankan gagasan perubahan keadaan.
- source_word: ἡ χαρὰ
  choice: sukacita kalian
  rationale: Kata milik yang eksplisit pada klausa pertama secara wajar diteruskan ke klausa paralel kedua, sesuai struktur retoris Yunani.
- source_word: εἰς κατήφειαν
  choice: menjadi kemuraman
  rationale: κατήφεια menunjuk pada keadaan murung, tertunduk, dan sedih; 'kemuraman' ringkas, bermartabat, serta tidak terlalu klinis.
theological_decisions:
- issue: Bahasa pertobatan dan kekuatan emosional
  choice: Ayat ini diterjemahkan sebagai seruan keras untuk mengalami dukacita pertobatan, tanpa melunakkan rangkaian imperatifnya.
  alternative: Menafsirkannya hanya sebagai ajakan yang lebih ringan untuk bersikap serius atau tenang.
  rationale: Dalam konteks Yakobus 4:6–10, rangkaian perintah ini memanggil para pembaca untuk merendahkan diri di hadapan Allah. Terjemahan mempertahankan ketegangan dan kerasnya seruan tersebut tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan tegas. 'Kalian' dipakai untuk menyatakan orang kedua jamak secara jelas; rangkaian perintah dipertahankan, dan tanda baca dibuat alami bagi pembaca Indonesia.
