  naturalness: Teks revisi memakai bahasa Indonesia baku modern dan mempertahankan nada tegas serta khidmat. “Hendaklah kalian merasa sengsara” terdengar lebih idiomatis daripada “Rasakanlah kesengsaraan,” sementara “Biarlah” merupakan bentuk yang wajar untuk imperatif pasif orang ketiga.
  terminology: “Berdukacitalah,” “menangislah,” “perkabungan,” dan “kemuraman” secara memadai mencerminkan medan makna Yunani. Catatan kaki ditempatkan pada “kemuraman” dan menjelaskan alternatif bagi κατήφεια tanpa menambahkan penafsiran doktrinal.
