  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: id
  text: Tetapi sekarang, kamu bermegah dalam keangkuhanmu[a]. Setiap kebanggaan semacam itu adalah jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermegah dalam pretensi-pretensimu” atau “bermegah dalam bualanmu.” Kata Yunani ini dapat menunjuk pada keangkuhan atau pretensi yang membual; dalam konteks ini, kemungkinan besar kata ini mengacu pada rencana penuh keyakinan diri yang dibicarakan dalam ayat-ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Ungkapan ini mempertahankan arti temporal νῦν dan daya pertentangan δέ terhadap sikap rendah hati yang semestinya dinyatakan pada ayat sebelumnya.
- source_word: καυχᾶσθε
  choice: kamu membanggakan
  rationale: Bentuk verbal ini menyatakan bermegah atau membanggakan sesuatu; pilihan ini juga menjaga kaitannya dengan nomina καύχησις dalam klausa berikut.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: keangkuhanmu
  rationale: ἀλαζονεία menunjuk pada keangkuhan, pretensi, atau keyakinan diri yang membual. Bentuk tunggal kolektif dalam bahasa Indonesia terdengar alami tanpa membatasi ungkapan ini hanya pada rencana dagang.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Setiap kebanggaan semacam itu
  rationale: “Setiap” mencerminkan daya distributif πᾶσα, sedangkan “semacam itu” mempertahankan rujukan kualitatif τοιαύτη kepada jenis kebanggaan yang baru disebutkan.
- source_word: πονηρά
  choice: jahat
  rationale: Kata ini menyampaikan penilaian moral, bukan sekadar bahwa tindakan tersebut buruk atau tidak bijaksana.
theological_decisions:
- issue: Sifat kebanggaan yang dikecam
  choice: Kebanggaan yang lahir dari keangkuhan dan keyakinan diri dalam membuat rencana tanpa tunduk kepada Tuhan
  alternative: Larangan mutlak terhadap segala bentuk rasa percaya diri, atau kecaman yang terbatas hanya pada perencanaan dagang
  rationale: Konteks Yakobus 4:13–15 mengarah pada rencana manusia yang dibuat dengan kepastian angkuh, tetapi bunyi ayat ini menggeneralisasikan penilaian moralnya. Terjemahan tidak mempersempitnya menjadi “rencana” dan tidak pula memperluasnya menjadi kecaman terhadap semua rasa percaya diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Namun sekarang” menjaga kontras dan unsur waktu teks Yunani. “Keangkuhanmu” dipilih untuk mempertahankan keluasan leksikal serta menghindari penambahan tafsiran “rencana-rencana angkuh” ke dalam teks utama.
