  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: id
  text: Sebaliknya, seharusnya kalian berkata[a], “Jika Tuhan menghendaki, kita akan hidup dan juga melakukan ini atau itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “alih-alih kalian berkata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Sebaliknya, seharusnya kalian berkata
  rationale: Konstruksi ἀντὶ τοῦ dengan infinitif secara harfiah berarti ‘alih-alih kalian berkata’. Bentuk korektif ‘seharusnya kalian berkata’ menyatakan kontras yang tersirat dengan jelas dan wajar dalam bahasa Indonesia; ‘kalian’ mempertahankan bentuk jamak ὑμᾶς.
- source_word: Ἐὰν
  choice: Jika
  rationale: Kata ini memperkenalkan syarat dengan verba subjungtif; ‘jika’ merupakan padanan Indonesia yang paling langsung dan alami.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Sebutan ini dipertahankan tanpa mempersempit rujukannya kepada Bapa atau Yesus secara khusus.
- source_word: θελήσῃ
  choice: menghendaki
  rationale: Dalam konteks ini θέλω menyatakan kehendak atau kemauan. ‘Menghendaki’ sesuai dengan ragam yang bermartabat dan menegaskan bahwa hidup serta rencana manusia bergantung pada kehendak Tuhan.
- source_word: καὶ ζήσομεν
  choice: kita akan hidup
  rationale: Bentuk futurum menyatakan bahwa kelangsungan hidup pun bergantung pada kehendak Tuhan. ‘Kita’ sesuai dengan orang pertama jamak dalam ucapan yang dicontohkan.
- source_word: καὶ ποιήσομεν
  choice: dan juga melakukan
  rationale: ποιέω berarti luas, yakni ‘melakukan’ atau ‘mengerjakan’. ‘Juga’ mencerminkan καί kedua dan mempertahankan urutan bahwa baik hidup maupun bertindak berada di bawah kehendak Tuhan.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: ini atau itu
  rationale: Ungkapan ini menunjuk secara umum kepada berbagai kegiatan yang direncanakan; ‘ini atau itu’ alami dan tetap mempertahankan cakupannya yang tidak tertentu.
theological_decisions:
- issue: Rujukan dan daya ungkap ὁ κύριος dalam pernyataan bersyarat
  choice: Tuhan
  alternative: Allah; Tuhan Yesus
  rationale: Teks Yunani hanya menyebut ὁ κύριος. Terjemahan ‘Tuhan’ mempertahankan ketidakjelasan rujukan yang asli sekaligus menyampaikan kedaulatan ilahi atas hidup dan rencana manusia tanpa menetapkan secara khusus apakah yang dimaksud ialah Bapa atau Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, wajar, dan bermartabat. ‘Kalian’ dipakai untuk menyatakan orang kedua jamak secara jelas, sedangkan ‘menghendaki’ menjaga bobot pernyataan tanpa terdengar kuno.
