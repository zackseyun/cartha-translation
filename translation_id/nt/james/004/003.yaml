  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: id
  text: Kalian meminta dan tidak menerima, karena kalian meminta dengan cara yang salah,[a] supaya kalian membelanjakannya untuk kesenangan kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara salah” atau “dengan motif yang salah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di dalam kesenangan kalian”; “kesenangan” juga dapat berarti hasrat atau keinginan untuk memuaskan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: kamu meminta
  rationale: Bentuk kini aktif orang kedua jamak. Dalam bahasa Indonesia, “meminta” merupakan padanan alami dalam konteks permohonan yang secara tersirat ditujukan kepada Allah.
- source_word: οὐ λαμβάνετε
  choice: tidak menerima
  rationale: Mempertahankan hubungan langsung antara tindakan meminta dan menerima dengan ragam bahasa yang wajar dan bermartabat.
- source_word: διότι
  choice: karena
  rationale: Menandai alasan mengapa permintaan mereka tidak menghasilkan penerimaan.
- source_word: κακῶς
  choice: dengan cara yang salah
  rationale: Mengungkapkan makna adverbial “secara salah/buruk” tanpa membatasinya hanya pada motif; klausa tujuan berikutnya menjelaskan letak kesalahannya.
- source_word: αἰτεῖσθε
  choice: kamu meminta
  rationale: Bentuk medial tidak perlu dibuat refleksif secara eksplisit dalam bahasa Indonesia; pengulangan ini mempertahankan kesejajaran teks Yunani.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan daya tujuan, dan mungkin juga nuansa hasil, secara alami dalam bahasa Indonesia modern.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: untuk kesenanganmu
  rationale: ἡδονή dapat menunjuk pada kesenangan atau hasrat pemuasan diri. Dengan verba “menghabiskan”, preposisi “untuk” menghasilkan ungkapan Indonesia yang alami.
- source_word: δαπανήσητε
  choice: kamu menghabiskannya
  rationale: Verba ini berarti membelanjakan, mengeluarkan, atau menghabiskan. “Menghabiskannya” sesuai dengan objek tersirat berupa apa yang diminta, tanpa menambahkan penilaian kuat seperti “menghambur-hamburkan”.
theological_decisions:
- issue: Apakah Allah perlu disebut secara eksplisit sebagai pihak yang dimintai
  choice: 'Objek tetap tersirat: “Kamu meminta, tetapi tidak menerima”'
  alternative: Kamu meminta kepada Allah, tetapi tidak menerima
  rationale: Konteks menunjukkan doa kepada Allah, tetapi teks Yunani ayat ini tidak menyebut Allah secara eksplisit.
- issue: Apakah κακῶς harus diterjemahkan khusus sebagai motif yang salah
  choice: “dengan cara yang salah” dalam teks utama
  alternative: “dengan motif yang salah”
  rationale: Adverbia κακῶς lebih luas daripada motif saja. Klausa berikutnya menerangkan tujuan mementingkan kesenangan diri, sehingga terjemahan utama tidak perlu mempersempit maknanya.
- issue: Nuansa tujuan ἵνα dalam hubungan dengan permintaan yang salah
  choice: “supaya”
  alternative: “agar” atau pembacaan bernuansa hasil
  rationale: Bentuk ini paling langsung mempertahankan tujuan mereka dalam meminta, tanpa meniadakan kemungkinan bahwa konstruksi tersebut juga bersinggungan dengan hasil yang dikehendaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan sapaan orang kedua jamak yang dinyatakan melalui “kamu”, sebagaimana lazim karena bahasa Indonesia tidak membedakan jumlah pada bentuk ini. Susunan kalimat mempertahankan pengulangan “meminta” dan hubungan sebab-tujuan dari teks Yunani, dengan gaya jelas, alami, dan bermartabat.
