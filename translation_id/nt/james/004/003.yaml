revisions:
- from: Kamu meminta, tetapi tidak menerima, karena kamu meminta dengan cara yang salah,[a] supaya kamu menghabiskannya untuk kesenanganmu.[b]
  to: Kalian meminta dan tidak menerima, karena kalian meminta dengan cara yang salah,[a] supaya kalian membelanjakannya untuk kesenangan kalian.[b]
  rationale: Revisi secara konsisten menandai orang kedua jamak, menerjemahkan καί secara langsung, dan memilih “membelanjakannya” untuk menyampaikan δαπανήσητε secara netral. “Dengan cara yang salah” tetap mempertahankan cakupan κακῶς, sedangkan klausa “supaya” menyatakan tujuan tanpa mengubahnya menjadi penjelasan motif yang lebih sempit. Penanda catatan ditempatkan pada unsur yang dijelaskannya dan catatan tidak mengganggu ambiguitas leksikal sumber.
