review_pass:
  verdict: revise
  source_fidelity: Teks Yunani menyatakan orang kedua jamak dua kali. Draf mempertahankan hubungan sebab dan tujuan serta tidak menambahkan objek “Allah”, tetapi penggunaan “kamu/-mu” lazimnya dibaca tunggal dalam bahasa Indonesia modern dan dengan demikian mengaburkan bentuk jamak sumber. Konjungsi καί lebih langsung diterjemahkan “dan”, bukan “tetapi”. Untuk δαπανήσητε, “membelanjakannya” lebih tepat daripada “menghabiskannya”, yang dapat menyiratkan konsumsi sampai habis.
  naturalness: “Kalian meminta dan tidak menerima” serta “membelanjakannya untuk kesenangan kalian” adalah bahasa Indonesia standar modern yang jelas dan alami. Susunan sebab–tujuan tetap ringkas dan berwibawa.
  terminology: “Meminta,” “menerima,” “dengan cara yang salah,” dan “kesenangan” mencerminkan αἰτεῖτε, λαμβάνετε, κακῶς, dan ἡδοναῖς tanpa mempersempit κακῶς menjadi soal motif saja atau menafsirkan ἡδοναῖς secara denominational. Catatan alternatif mempertahankan kemungkinan makna hasrat pemuasan diri.
  issues:
  - severity: medium
    issue: Orang kedua jamak diterjemahkan dengan “kamu/-mu”.
    rationale: Kedua verba sumber berbentuk orang kedua jamak (αἰτεῖτε, αἰτεῖσθε), dan ὑμῶν juga jamak. Dalam pemakaian Indonesia modern, “kamu” terutama bernilai tunggal; “kalian” secara aman mempertahankan jumlah sumber.
  - severity: low
    issue: “Tetapi” menerjemahkan καί.
    rationale: καί di sini hanya menghubungkan “meminta” dan “tidak menerima”; “dan” lebih dekat dengan sumber dan tidak menambahkan kontras retoris.
  - severity: low
    issue: “Menghabiskannya” berpotensi lebih kuat daripada δαπανήσητε.
    rationale: δαπανάω berarti membelanjakan atau mengeluarkan. “Menghabiskan” dapat mengesankan bahwa seluruh benda itu dikonsumsi sampai habis, sedangkan “membelanjakan” menyatakan tindakan yang dimaksud tanpa tambahan nuansa.
  revised_text: Kalian meminta dan tidak menerima, karena kalian meminta dengan cara yang salah,[a] supaya kalian membelanjakannya untuk kesenangan kalian.[b]
