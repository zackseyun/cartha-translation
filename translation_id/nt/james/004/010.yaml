  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: id
  text: Rendahkanlah diri kalian di hadapan Tuhan[a], dan Dia akan meninggikan kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadirat Tuhan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengangkat kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Rendahkanlah diri kalian
  rationale: Bentuk imperatif pasif aoris ini dapat berdaya refleksif dalam konteks nasihat. Ungkapan ini menyampaikan tindakan merendahkan diri secara sukarela dan sekaligus mempertahankan sapaan jamak dari teks Yunani.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini secara alami menyampaikan arti ‘di depan’ atau ‘di hadirat’ seseorang, dengan nuansa relasional yang sesuai dengan konteks.
- source_word: κυρίου
  choice: Tuhan
  rationale: Pilihan ini mempertahankan sebutan κύριος tanpa mempersempit acuannya secara tidak perlu menjadi Allah atau Yesus.
- source_word: ὑψώσει
  choice: akan meninggikan
  rationale: Kata ini digunakan secara metaforis untuk peninggian atau pemberian kehormatan sesudah perendahan diri; ‘meninggikan’ mempertahankan bobot moral dan teologisnya.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Kata ganti orang kedua jamak dinyatakan secara eksplisit dengan ‘kalian’, sehingga jumlah gramatikal sumber tetap jelas.
theological_decisions:
- issue: Acuan ‘Tuhan’
  choice: Mempertahankan ‘Tuhan’ tanpa menentukan apakah yang dimaksud adalah Allah atau Tuhan Yesus.
  alternative: Allah; Tuhan Yesus
  rationale: Surat Yakobus dapat memakai κύριος untuk Allah maupun Yesus. Frasa ini sendiri tidak mengharuskan penentuan yang lebih sempit, sehingga ambiguitas asli dipertahankan.
- issue: Makna peninggian
  choice: Memakai ‘meninggikan’ tanpa menjelaskan bentuk atau waktunya.
  alternative: mengangkat; memberi kehormatan
  rationale: Kata ὑψόω dapat menunjuk pada pengangkatan atau pemberian kehormatan secara metaforis. Teks tidak merinci bagaimana atau kapan Tuhan melakukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. ‘Kalian’ dipakai untuk mempertahankan bentuk jamak Yunani, sedangkan ‘di hadapan Tuhan’ dan ‘meninggikan’ menjaga nada yang bermartabat tanpa menjadi kuno.
