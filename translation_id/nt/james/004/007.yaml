  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: id
  text: Karena itu, tunduklah[a] kepada Allah. Tetapi lawanlah Iblis, dan ia akan lari dari kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Takluklah kepada Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: tunduklah
  rationale: Imperatif aoris pasif ini dapat berdaya refleksif dalam nasihat. “Tunduklah” merupakan ungkapan Indonesia yang alami dan tetap menyatakan penempatan diri di bawah otoritas Allah.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan mempertahankan hubungan logis antarkalimat.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Datif menjadi pelengkap ὑποτάγητε; “kepada Allah” adalah padanan Indonesia yang wajar.
- source_word: ἀντίστητε
  choice: lawanlah
  rationale: Imperatif aoris aktif yang berarti mengambil sikap menentang atau melawan. “Lawanlah” jelas, tegas, dan alami dalam nasihat ini.
- source_word: δὲ
  choice: Namun
  rationale: Menandai perkembangan yang bersifat kontras antara ketundukan kepada Allah dan perlawanan terhadap Iblis.
- source_word: τῷ διαβόλῳ
  choice: Iblis
  rationale: διάβολος dengan artikel di sini berfungsi sebagai sebutan bagi lawan pribadi; dalam bahasa Indonesia, “Iblis” lazim diperlakukan sebagai nama atau gelar diri sehingga tidak memerlukan artikel.
- source_word: καὶ
  choice: maka
  rationale: Dalam hubungan antara perintah dan hasil yang dijanjikan, “maka” secara alami menyatakan konsekuensi tanpa mengubah kepastian bentuk futurum.
- source_word: φεύξεται
  choice: ia akan lari
  rationale: Futurum φεύγω menyatakan hasil dari perlawanan tersebut. Pronomina “ia” secara alami merujuk kembali kepada Iblis.
- source_word: ἀφ’ ὑμῶν
  choice: darimu
  rationale: ἀπό dengan genitif menunjukkan gerak menjauh. Bentuk tunggal kolektif “-mu” mengikuti sapaan umum yang lazim dalam bahasa Indonesia, meskipun pronomina Yunani berbentuk jamak.
theological_decisions:
- issue: Makna διάβολος
  choice: Iblis sebagai lawan pribadi
  alternative: pemfitnah sebagai sebutan umum atau kekuatan jahat impersonal
  rationale: Pemakaian berartikel dan gambaran bahwa ia akan lari mendukung rujukan kepada lawan pribadi. Terjemahan tidak mengembangkan uraian tentang hakikatnya melampaui yang dinyatakan teks.
- issue: Hubungan antara melawan dan hasilnya
  choice: “maka ia akan lari” sebagai hasil yang dijanjikan
  alternative: “dan ia akan lari” sebagai koordinasi yang lebih formal
  rationale: καί menghubungkan perintah dengan futurum. “Maka” mengungkapkan hubungan konsekuensial yang tersirat secara alami, tanpa menjadikannya rumusan mekanis yang terlepas dari konteks ketundukan kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua imperatif dipertahankan secara tegas. “Darimu” memakai sapaan tunggal kolektif yang alami untuk pembaca, sedangkan sumber Yunani memakai bentuk jamak.
