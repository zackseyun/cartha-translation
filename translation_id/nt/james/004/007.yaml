  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia pada rangkaian imperatif dan janji futurum dalam teks Yunani. Namun, ὑμῶν adalah bentuk jamak dan tidak sebaiknya dialihkan menjadi sapaan tunggal kolektif tanpa penanda, karena bahasa Indonesia modern menyediakan bentuk jamak yang alami.
  naturalness: Susunan kalimat lugas dan wajar. “Dari kalian” mempertahankan penerima jamak secara jelas dan tetap alami dalam ragam Indonesia modern.
  terminology: “Allah” dan “Iblis” tepat untuk θεός dan διάβολος dalam konteks ini. “Tunduklah” dan “lawanlah” menyampaikan daya imperatif dengan baik. Catatan kaki direvisi agar memberi alternatif leksikal yang lebih langsung, tanpa menambahkan unsur “kuasa” yang tidak dieksplisitkan oleh kata Yunani.
  issues:
  - severity: medium
    issue: Pronomina “darimu” berbentuk tunggal, sedangkan ὑμῶν berbentuk jamak.
    rationale: Walaupun sapaan tunggal kolektif kadang dipakai dalam bahasa Indonesia, teks sumber secara eksplisit menyapa komunitas dengan bentuk jamak. “Dari kalian” mempertahankan jumlah sumber tanpa mengubah makna.
  - severity: low
    issue: Catatan kaki “tempatkanlah dirimu di bawah kuasa Allah” bersifat lebih parafrastis daripada alternatif leksikal langsung.
    rationale: ὑποτάγητε dapat diberi alternatif “Takluklah kepada Allah” atau “Tundukkanlah dirimu kepada Allah”; tambahan “kuasa” menafsirkan otoritas yang tersirat, bukan menerjemahkan unsur yang dinyatakan.
  revised_text: Karena itu, tunduklah[a] kepada Allah. Tetapi lawanlah Iblis, dan ia akan lari dari kalian.
