  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: id
  text: Kamu menginginkan[a], tetapi tidak memiliki; kamu membunuh[b] dan iri hati[c], tetapi tidak mampu memperoleh; kamu bertengkar dan berperang. Kamu tidak memiliki karena kamu tidak meminta[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kamu berhasrat” atau “Kamu mengingini.” Kata Yunani ini menyatakan keinginan yang kuat, yang dalam konteks ini bersifat salah.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini secara khusus sering berarti membunuh manusia atau melakukan pembunuhan. Sebagian penafsir memahami ungkapan ini secara retoris, tetapi terjemahan mempertahankan kekuatan katanya.
    reason: lexical_alternative
  - marker: c
    text: Atau “cemburu.”
    reason: lexical_alternative
  - marker: d
    text: Dari konteks, pihak yang dimintai adalah Allah, meskipun teks Yunani tidak menyebutkan-Nya secara eksplisit di sini.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: menginginkan sesuatu
  rationale: Kata ini menyatakan keinginan yang kuat dan dalam konteks ini bernilai negatif. Pilihan ini mempertahankan keluasan maknanya tanpa mempersempitnya menjadi hasrat seksual atau keinginan atas milik orang lain.
- source_word: οὐκ ἔχετε
  choice: tidak mendapatkannya
  rationale: Secara harfiah berarti 'tidak mempunyai', tetapi dalam rangkaian keinginan yang gagal dipenuhi, ungkapan ini secara alami menyatakan bahwa yang diinginkan tidak diperoleh. Akhiran -nya mewakili objek yang tersirat.
- source_word: φονεύετε
  choice: membunuh
  rationale: Kata Yunani ini lazimnya menunjuk pada pembunuhan manusia dan memiliki bobot moral yang kuat. Bahasa Indonesia tidak mempunyai pembedaan verba sehari-hari yang tepat antara 'kill' dan 'murder'; 'membunuh' adalah padanan langsung dan tidak melunakkan ungkapan sumber.
- source_word: ζηλοῦτε
  choice: iri hati
  rationale: Dalam konteks permusuhan dan keinginan yang tidak terpenuhi, makna negatif 'iri hati' lebih tepat daripada makna positif 'bersemangat'.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: tidak mampu memperolehnya
  rationale: Gabungan ini menyatakan ketidakmampuan mencapai atau memperoleh objek yang diinginkan. Bentuk ini dekat dengan sumber dan tetap alami.
- source_word: μάχεσθε
  choice: bertengkar
  rationale: Kata ini dapat berarti berkelahi atau bertengkar. 'Bertengkar' membedakannya dengan verba berikut yang lebih kuat, sambil tetap sesuai dengan konteks perselisihan antarmanusia.
- source_word: πολεμεῖτε
  choice: berperang
  rationale: Kata ini memakai citra peperangan dan lebih kuat daripada μάχεσθε. 'Berperang' mempertahankan peningkatan intensitas dalam pasangan verba tersebut.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: karena kamu tidak meminta
  rationale: Konstruksi infinitif berartikel dengan διά menyatakan sebab. Pihak yang dimintai, yakni Allah, tersirat dari konteks tetapi tidak disebutkan dalam ayat ini.
theological_decisions:
- issue: Apakah φονεύετε perlu dilunakkan sebagai bahasa kiasan atau retoris
  choice: Mempertahankan kata 'membunuh' dalam teks utama
  alternative: menyakiti; membunuh dalam hati
  rationale: Sumber memakai verba yang kuat. Penafsiran bahwa ungkapan itu retoris, hiperbolis, atau kiasan tidak boleh dimasukkan diam-diam ke dalam terjemahan.
- issue: Apakah objek αἰτεῖσθαι perlu dinyatakan sebagai Allah
  choice: 'Membiarkan objek tetap tersirat: ''tidak meminta'''
  alternative: tidak meminta kepada Allah
  rationale: Konteks menunjukkan bahwa Allah adalah pihak yang dimintai, tetapi teks Yunani ayat ini tidak menyebut-Nya secara eksplisit.
- issue: Hubungan antara keinginan, pembunuhan, iri hati, dan konflik
  choice: Mempertahankan rangkaian klausa yang tajam tanpa menjelaskan hubungan sebab-akibat tambahan
  alternative: Menambahkan penghubung penjelas seperti 'maka' atau 'karena itu'
  rationale: Teks menyandingkan klausa-klausa tersebut secara retoris dan tidak secara eksplisit menetapkan setiap hubungan logisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kamu', kalimat yang lugas, dan nada teguran yang kuat. Tanda titik koma mempertahankan rangkaian klausa Yunani tanpa menghasilkan kalimat Indonesia yang tersendat. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
