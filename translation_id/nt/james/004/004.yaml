reference: James 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: id
  text: Hai, para perempuan pezina[a], tidakkah kalian tahu bahwa persahabatan dengan dunia adalah permusuhan terhadap Allah? Karena itu, siapa pun yang ingin menjadi sahabat dunia menjadi musuh Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan ini secara harfiah berarti “para perempuan pezina.” Kemungkinan besar ungkapan ini dipakai secara metaforis untuk ketidaksetiaan rohani kepada Allah, dengan menggemakan bahasa para nabi tentang ketidaksetiaan umat dalam hubungan perjanjian.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “permusuhan dengan Allah.” “Dunia” di sini menunjuk pada tatanan manusia yang menentang Allah, bukan pada ciptaan itu sendiri.'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: para perempuan yang berzina
  rationale: Bentuk vokatif feminin jamak dipertahankan secara konkret dan tajam. Dalam konteks, ungkapan ini kemungkinan besar merupakan metafora ketidaksetiaan rohani atau perjanjian; catatan kaki menjelaskan gaung tersebut tanpa menggantikan bentuk sumber dengan parafrasa.
- source_word: οὐκ οἴδατε
  choice: tidakkah kalian tahu
  rationale: Menyampaikan pertanyaan retoris negatif secara wajar dalam bahasa Indonesia dan memakai sapaan jamak yang sesuai dengan bentuk Yunani.
- source_word: φιλία
  choice: persahabatan
  rationale: Padanan langsung yang mempertahankan hubungan leksikal dengan φίλος, 'sahabat', pada klausa berikutnya.
- source_word: κόσμου
  choice: dunia
  rationale: Mempertahankan keluasan istilah Yunani. Dalam konteks ini yang dimaksud ialah tatanan manusia yang menentang Allah, bukan ciptaan fisik; penjelasan itu tidak dimasukkan ke teks utama agar tidak terlalu menafsirkan.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: permusuhan terhadap Allah
  rationale: 'Genitif dipahami secara objektif dalam konteks: persahabatan dengan dunia merupakan sikap bermusuhan yang diarahkan kepada Allah. Bentuk ini juga mempertahankan ketegangan dengan kemungkinan terjemahan ''permusuhan dengan Allah''.'
- source_word: ὃς ἐὰν οὖν
  choice: Karena itu, siapa pun
  rationale: Menyampaikan fungsi inferensial οὖν dan sifat umum klausa relatif tak tentu.
- source_word: βουληθῇ
  choice: ingin
  rationale: Mengungkapkan kehendak atau kemauan secara alami tanpa menambahkan gagasan pilihan formal yang tidak dinyatakan secara eksplisit.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: menjadi sahabat dunia
  rationale: Mempertahankan ungkapan nominal dan kaitan dengan 'persahabatan', sambil menggunakan susunan Indonesia yang ringkas dan alami.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: musuh Allah
  rationale: Padanan langsung dan kuat yang mempertahankan kontras relasional antara sahabat dunia dan musuh Allah.
- source_word: καθίσταται
  choice: menjadikan dirinya
  rationale: Mengungkapkan hasil dari keberpihakan yang disengaja serta tanggung jawab subjek. Catatan kaki mempertahankan kemungkinan nuansa yang lebih netral, 'menjadi'.
theological_decisions:
- issue: Daya metaforis μοιχαλίδες
  choice: Mempertahankan sapaan konkret dan feminin 'para perempuan yang berzina' dalam teks utama.
  alternative: orang-orang yang tidak setia; para pezina
  rationale: Kata ini kemungkinan menggemakan bahasa kenabian tentang ketidaksetiaan umat kepada Allah. Namun, menggantinya dengan 'orang-orang yang tidak setia' akan menyelesaikan metafora dan menghapus bentuk feminin yang nyata dalam sumber.
- issue: Makna κόσμος
  choice: Menerjemahkan dengan 'dunia' tanpa perluasan dalam teks utama.
  alternative: tatanan dunia yang menentang Allah; tata nilai dunia
  rationale: Konteks menunjuk pada tatanan nilai manusia yang melawan Allah, bukan ciptaan itu sendiri. Kata yang lebih eksplisit akan menjadi tafsiran yang melampaui bentuk teks.
- issue: Relasi genitif dalam ἔχθρα τοῦ θεοῦ
  choice: permusuhan terhadap Allah
  alternative: permusuhan dengan Allah
  rationale: Bacaan objektif sesuai dengan gagasan bahwa keberpihakan kepada dunia merupakan sikap melawan Allah, tetapi alternatif relasional tetap mungkin dan dicatat.
- issue: Nuansa καθίσταται
  choice: menjadikan dirinya musuh Allah
  alternative: menjadi musuh Allah
  rationale: Pilihan utama menonjolkan tanggung jawab yang tersirat dari kehendak untuk menjadi sahabat dunia, sedangkan alternatif mempertahankan arti perubahan status yang lebih netral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan tajam sesuai teguran teks. 'Kalian' dipakai untuk menandai orang kedua jamak secara alami. Istilah 'Allah', 'persahabatan', 'sahabat', dan 'musuh' menjaga martabat serta hubungan leksikal dan retoris dalam ayat.
