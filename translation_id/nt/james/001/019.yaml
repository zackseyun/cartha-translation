  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: id
  text: 'Ketahuilah hal ini[a], saudara-saudaraku yang terkasih[b]: hendaklah setiap orang cepat mendengar, lambat berbicara, dan lambat marah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kamu sekalian mengetahui hal ini.” Verba Yunani tersebut dapat dipahami sebagai pernyataan, bukan perintah.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “saudara-saudaraku” berbentuk maskulin jamak, tetapi dalam konteks ini kemungkinan menyapa seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴστε
  choice: Ketahuilah hal ini
  rationale: Bentuk ini dapat dipahami sebagai imperatif atau indikatif. Imperatif sesuai dengan rangkaian nasihat yang menyusul; “hal ini” ditambahkan agar ungkapannya wajar dalam bahasa Indonesia. Kemungkinan indikatif dipertahankan dalam catatan kaki.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: saudara-saudaraku yang terkasih
  rationale: Ungkapan ini mempertahankan sapaan kekeluargaan dan kasih dalam teks Yunani. Dalam bahasa Indonesia, “saudara-saudara” dapat secara wajar menyapa seluruh komunitas tanpa harus menyisipkan pembedaan jenis kelamin ke dalam teks utama.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: Hendaklah setiap orang
  rationale: “Hendaklah” menyampaikan daya imperatif orang ketiga, sedangkan “setiap orang” secara tepat dan alami menyatakan penggunaan ἄνθρωπος yang generik. Partikel δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan dengan pertentangan yang kuat.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: cepat untuk mendengar
  rationale: Terjemahan ini dekat dengan susunan Yunani dan tetap alami, serta mempertahankan fokus pada kesediaan segera untuk mendengar.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: lambat untuk berbicara
  rationale: Padanan langsung dan wajar bagi konstruksi Yunani; “berbicara” sesuai dengan ragam nasihat yang bermartabat.
- source_word: βραδὺς εἰς ὀργήν
  choice: lambat untuk marah
  rationale: Ungkapan idiomatis ini menyampaikan sikap tidak lekas dikuasai kemarahan tanpa mempersempit ὀργή menjadi jenis murka tertentu.
theological_decisions:
- issue: Daya verba pembuka Ἴστε
  choice: 'Dipahami sebagai imperatif: “Ketahuilah hal ini”'
  alternative: 'Dipahami sebagai indikatif: “Kamu sekalian mengetahui hal ini”'
  rationale: Keduanya dimungkinkan oleh bentuk Yunani. Imperatif lebih selaras dengan alur nasihat, tetapi ambiguitas asli dicatat dan tidak dihapus.
- issue: Cakupan sapaan ἀδελφοί dan ungkapan generik πᾶς ἄνθρωπος
  choice: “saudara-saudaraku” dan “setiap orang”
  alternative: “saudara-saudaraku, laki-laki dan perempuan” atau bentuk eksplisit serupa
  rationale: Bahasa Indonesia memungkinkan “saudara-saudara” dipakai sebagai sapaan komunal dan “setiap orang” sebagai ungkapan generik tanpa mengubah cakupan teks. Catatan menjelaskan bentuk gramatikal Yunani dan kemungkinan audiens campuran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pola sejajar “cepat ... lambat ... lambat” dipertahankan agar irama nasihat Yunani tetap terasa. Tanda titik dua menghubungkan seruan pembuka dengan isi nasihat secara alami.
