  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: id
  text: 'Yakobus[a], hamba[b] Allah dan Tuhan Yesus, Sang Mesias, kepada kedua belas suku yang tersebar di perantauan[c]: Salam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yunani Ἰάκωβος secara historis berpadanan dengan nama Yakub; Yakobus adalah bentuk yang lazim dipakai untuk tokoh ini dalam Perjanjian Baru bahasa Indonesia.
    reason: name_alternative
  - marker: b
    text: Kata Yunani δοῦλος menunjuk kepada orang yang menjadi milik dan berada di bawah kuasa seorang tuan; dapat juga diterjemahkan “budak”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dalam diaspora”. Istilah ini biasanya menunjuk pada orang Yahudi yang tersebar dan tinggal di luar tanah Israel.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Yakobus
  rationale: Yakobus adalah bentuk nama yang mapan dalam tradisi Alkitab bahasa Indonesia untuk penulis surat ini; bentuk Yunaninya secara historis juga berpadanan dengan Yakub.
- source_word: θεοῦ
  choice: Allah
  rationale: 'Genitif ini menyatakan kepunyaan atau pengabdian: Yakobus adalah hamba Allah.'
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam gelar kristologis ini, Tuhan mempertahankan makna kewibawaan κύριος sekaligus sesuai dengan pemakaian Perjanjian Baru yang mapan dalam bahasa Indonesia.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός berasal dari gelar yang berarti Mesias. Tanda koma dan Sang membuat fungsi gelarnya jelas dan alami dalam bahasa Indonesia, tanpa memperlakukannya sekadar sebagai unsur nama.
- source_word: δοῦλος
  choice: hamba
  rationale: Hamba merupakan padanan Indonesia yang alami dan bermartabat dalam pengenalan diri surat, serta menyatakan pengabdian dan kepemilikan oleh tuan; catatan kaki mempertahankan nuansa kuat berupa ketundukan penuh.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: kepada kedua belas suku
  rationale: Terjemahan ini mempertahankan bahasa perjanjian yang merujuk kepada suku-suku Israel dan tidak menggeneralisasikannya menjadi kelompok atau umat.
- source_word: διασπορᾷ
  choice: yang hidup di perantauan
  rationale: Ungkapan ini menyampaikan makna kolektif komunitas Yahudi yang tinggal tersebar di luar tanah Israel dengan bahasa Indonesia yang wajar.
- source_word: χαίρειν
  choice: Salam
  rationale: Dalam pembukaan surat, infinitif ini merupakan rumus sapaan; Salam menyampaikan fungsi idiomatisnya, bukan arti leksikal harfiahnya, bersukacitalah.
theological_decisions:
- issue: Fungsi Χριστοῦ dalam sebutan bagi Yesus
  choice: Sang Mesias
  alternative: Kristus
  rationale: Bentuk Yunani ini masih dapat didengar sebagai gelar, bukan semata-mata bagian nama. Sang Mesias mempertahankan isi gelarnya, sedangkan Kristus tetap merupakan padanan tradisional yang sah.
- issue: Kekuatan makna δοῦλος dalam pengenalan diri Yakobus
  choice: hamba
  alternative: budak
  rationale: Hamba paling alami dan layak bagi register surat dalam bahasa Indonesia, tetapi dapat terdengar lebih lunak daripada δοῦλος. Karena kata Yunani menyiratkan bahwa seseorang berada di bawah kepemilikan dan kuasa tuannya, nuansa kuat tersebut dijelaskan dalam catatan kaki.
- issue: Rujukan kedua belas suku di perantauan
  choice: mempertahankan ungkapan Israel tanpa menentukan apakah sepenuhnya harfiah atau juga mencakup penerapan simbolis
  alternative: menjelaskannya langsung sebagai orang Yahudi di luar Israel atau sebagai seluruh umat Allah
  rationale: Ayat itu sendiri memakai bahasa kedua belas suku dan diaspora. Terjemahan tidak seharusnya menutup kemungkinan penafsiran identitas para penerima dengan parafrasa teologis yang lebih khusus.
translation_notes:
  register: Bahasa dibuat modern, ringkas, dan bermartabat sesuai pembukaan surat. “Salam” dipisahkan sebagai kalimat pendek agar rumus sapaan Yunani terdengar alami. “Di perantauan” lebih mudah dipahami pembaca umum daripada transliterasi teknis “diaspora”, sementara catatan kaki menyediakan latar budayanya.
