id: JAS.1.12
reference: James 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: id
  text: Berbahagialah orang yang bertahan dalam pencobaan[a], sebab setelah terbukti tahan uji, ia akan menerima mahkota kehidupan[b] yang dijanjikan-Nya kepada mereka yang mengasihi-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang sama dapat berarti “ujian”, “godaan”, atau “pengujian”; di sini konteks menekankan ketekunan ketika seseorang diuji.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani untuk “mahkota” dapat menunjuk kepada karangan yang diberikan kepada seorang pemenang, bukan hanya mahkota seorang raja.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Berbahagialah
  rationale: Bentuk ini alami dalam ucapan bahagia dan mempertahankan makna keadaan yang diperkenan atau diberkati, bukan sekadar perasaan senang.
- source_word: ἀνὴρ
  choice: orang
  rationale: Walaupun bentuk Yunaninya maskulin tunggal, pemakaiannya bersifat representatif dan umum; 'orang' menyampaikan cakupan itu secara wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: ὑπομένει
  choice: bertahan dalam
  rationale: Mengungkapkan ketekunan di bawah tekanan secara ringkas dan alami.
- source_word: πειρασμόν
  choice: pencobaan
  rationale: Dalam bahasa Indonesia, 'pencobaan' dapat mencakup ujian berat maupun godaan. Konteks menekankan ketahanan dalam pengujian, sementara catatan kaki mempertahankan rentang maknanya.
- source_word: δόκιμος γενόμενος
  choice: setelah terbukti tahan uji
  rationale: Menangkap unsur temporal partisip sekaligus keadaan seseorang yang melalui pengujian dan terbukti layak atau murni.
- source_word: λήμψεται
  choice: akan menerima
  rationale: Padanan langsung dan alami bagi bentuk futurum.
- source_word: στέφανον τῆς ζωῆς
  choice: mahkota kehidupan
  rationale: Mempertahankan konstruksi genitif sumber tanpa menentukan apakah kehidupan adalah isi, hasil, atau sifat mahkota tersebut.
- source_word: ἐπηγγείλατο
  choice: dijanjikan-Nya
  rationale: Bentuk pasif relatif ini alami dalam bahasa Indonesia dan menyatakan bahwa Allah adalah subjek yang tersirat dari janji tersebut.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: kepada mereka yang mengasihi-Nya
  rationale: Menyampaikan datif penerima dan kasih yang menjadi ciri berkelanjutan para penerima janji.
theological_decisions:
- issue: Rentang makna πειρασμός
  choice: pencobaan, dengan penekanan kontekstual pada ujian
  alternative: godaan; pengujian
  rationale: Ketekunan, keadaan tahan uji, dan pahala mengarahkan pembacaan utama kepada kesukaran yang menguji. Namun, istilah Yunani juga dapat berarti godaan, sehingga ketegangan leksikal dipertahankan dalam catatan.
- issue: Arti genitif dalam 'mahkota kehidupan'
  choice: mempertahankan bentuk 'mahkota kehidupan'
  alternative: mahkota yang berupa kehidupan; mahkota yang memberikan kehidupan
  rationale: Bahasa Yunani tidak secara eksplisit menentukan hubungan genitifnya; terjemahan utama tidak seharusnya menyelesaikan ambiguitas itu secara diam-diam.
- issue: Subjek ἐπηγγείλατο
  choice: Allah, dinyatakan melalui akhiran hormat '-Nya'
  alternative: Tuhan
  rationale: Subjek maskulin tunggal tidak disebutkan dalam ayat ini, tetapi secara kontekstual paling wajar merujuk kepada Allah. Terjemahan tidak menambahkan gelar yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berbahagialah' mempertahankan nada ucapan bahagia; 'terbukti tahan uji' dipilih agar jelas bagi pembaca umum. Kapitalisasi '-Nya' mengikuti kebiasaan hormat bahasa Indonesia untuk rujukan kepada Allah.
