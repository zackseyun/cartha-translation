  edition: SBLGNT
  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: id
  text: orang yang mendua hati[a], goyah dalam segala jalannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang laki-laki yang berjiwa dua.” Bentuk Yunaninya maskulin tunggal, tetapi kemungkinan besar dipakai secara representatif untuk siapa pun yang demikian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: orang
  rationale: Dalam konteks ini nomina maskulin tunggal tersebut menunjuk secara representatif kepada orang yang meminta pada ayat sebelumnya. “Orang” menyampaikan cakupan generiknya secara alami dalam bahasa Indonesia; bentuk maskulin Yunaninya dicatat dalam catatan kaki.
- source_word: δίψυχος
  choice: yang mendua hati
  rationale: Secara harfiah kata langka ini menyiratkan ‘berjiwa dua’. Ungkapan Indonesia “mendua hati” secara alami menyampaikan batin atau kesetiaan yang terbagi tanpa kekakuan terjemahan harfiah.
- source_word: ἀκατάστατος
  choice: goyah
  rationale: “Goyah” menyampaikan ketidakstabilan dan ketiadaan keteguhan yang dimaksud dalam konteks, tanpa menambahkan gagasan tentang kekacauan sosial atau kegelisahan fisik.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: dalam segala jalannya
  rationale: “Jalan” mempertahankan metafora sumber bagi seluruh pola hidup dan tindakan seseorang, serta tetap wajar dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa maskulin yang berdaya representatif
  choice: Memakai “orang” dalam teks utama dan mencatat bentuk maskulin Yunani dalam catatan kaki
  alternative: “seorang laki-laki yang mendua hati”
  rationale: ἀνήρ berbentuk maskulin tunggal, tetapi dalam konteks ini merujuk kembali kepada siapa pun yang meminta dan karena itu kemungkinan besar berdaya generik. Terjemahan “laki-laki” dapat keliru dipahami sebagai pembatasan hanya kepada pria; catatan kaki mempertahankan informasi bentuk sumber tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas yang mempertahankan bentuk frasa pada teks Yunani. “Mendua hati” dipilih sebagai ungkapan alami untuk keterbelahan batin, sedangkan “goyah” menjaga gambaran ketidakstabilan dalam seluruh jalan hidup.
