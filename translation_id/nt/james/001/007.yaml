  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: id
  text: Sebab janganlah orang itu[a] mengira bahwa ia akan menerima apa pun dari Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang itu” menunjuk kepada siapa pun yang bimbang seperti orang yang digambarkan dalam ayat sebelumnya.
    reason: Menjelaskan bahwa bentuk tunggal tersebut dipakai secara representatif.
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Sebab, janganlah
  rationale: γάρ menghubungkan larangan ini sebagai alasan atau penjelasan bagi gambaran pada ayat sebelumnya; μή bersama bentuk perintah οἰέσθω dinyatakan secara alami dengan “janganlah”.
- source_word: οἰέσθω
  choice: mengira
  rationale: Kata ini menyatakan tindakan berpikir atau menyangka. “Mengira” alami dalam konteks peringatan dan tidak mengubahnya menjadi sekadar harapan.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: orang itu
  rationale: Ungkapan ini menunjuk kembali kepada individu yang bimbang dalam ayat sebelumnya. “Orang itu” mempertahankan bentuk tunggal dan penunjukan yang tegas, sekaligus merupakan padanan Indonesia yang wajar bagi ἄνθρωπος.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang tidak boleh dikira oleh orang tersebut.
- source_word: λήμψεταί
  choice: ia akan menerima
  rationale: Bentuk future dari λαμβάνω menyatakan penerimaan yang akan terjadi; “menerima” sesuai dengan frasa sumber yang menyusul.
- source_word: τι
  choice: apa pun
  rationale: Dalam lingkup larangan, τι memiliki cakupan tak tentu yang paling alami dinyatakan dengan “apa pun”.
- source_word: παρὰ τοῦ κυρίου
  choice: dari Tuhan
  rationale: παρά dengan genitif menandai sumber. “Tuhan” mempertahankan gelar κύριος tanpa memperjelas referennya melebihi teks Yunani.
theological_decisions:
- issue: Referen τοῦ κυρίου
  choice: Tuhan
  alternative: Allah; Tuhan Allah
  rationale: Teks memakai κύριος tanpa identifikasi tambahan. “Tuhan” mempertahankan gelar tersebut dan tidak menetapkan referennya secara lebih khusus daripada sumber.
- issue: Cakupan ὁ ἄνθρωπος ἐκεῖνος
  choice: orang itu
  alternative: laki-laki itu; orang tersebut
  rationale: Walaupun frasa Yunani berbentuk maskulin tunggal secara gramatikal, ἄνθρωπος di sini menunjuk secara representatif kepada individu yang bimbang. Bahasa Indonesia secara alami memakai “orang itu” tanpa menambahkan jenis kelamin yang tidak menjadi pokok pernyataan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “Sebab, janganlah ... mengira bahwa ...” mempertahankan hubungan penjelas dan daya larangan dalam teks Yunani.
