id: JAS.1.22
reference: James 1:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: id
  text: Namun, jadilah pelaku firman, bukan orang yang hanya mendengarnya dan menipu diri sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memperdaya diri sendiri”; atau: “menyesatkan diri sendiri dengan penalaran yang keliru.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: jadilah
  rationale: Imperatif kini ini menyerukan pola hidup yang terus berlangsung. “Jadilah” mempertahankan daya perintah dan tetap alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang mengandung kontras ringan dengan nasihat sebelumnya tanpa memberi pertentangan yang terlalu tajam.
- source_word: ποιηταὶ λόγου
  choice: pelaku firman
  rationale: Mempertahankan pasangan retoris “pelaku–pendengar” serta kesinambungan λόγος dengan “firman yang tertanam” dalam ayat sebelumnya.
- source_word: ἀκροαταὶ μόνον
  choice: orang yang hanya mendengarnya
  rationale: Mengungkapkan batasan μόνον secara alami dan menjadikan objek yang didengar jelas melalui pronomina “-nya”, yang merujuk kepada firman.
- source_word: παραλογιζόμενοι ἑαυτούς
  choice: menipu diri sendiri
  rationale: Menyampaikan gagasan penipuan diri secara ringkas dan wajar; nuansa penalaran keliru dari παραλογίζομαι dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna λόγος dalam Yakobus 1:22
  choice: firman
  alternative: pesan; ajaran
  rationale: Konteks langsung menyebut “firman yang tertanam” (1:21). “Firman” mempertahankan kesinambungan dan bobot teologisnya tanpa mempersempit rujukannya secara doktrinal.
- issue: Daya imperatif Γίνεσθε
  choice: seruan untuk terus hidup sebagai pelaku firman
  alternative: mulailah menjadi pelaku firman
  rationale: Imperatif kini paling wajar dipahami sebagai panggilan kepada sikap atau kebiasaan yang berkelanjutan, sementara kemungkinan nuansa “menjadi” tetap tercermin dalam “jadilah”.
- issue: Hubungan παραλογιζόμενοι dengan nasihat utama
  choice: mendengar saja berarti menipu diri sendiri
  alternative: partisip yang menyatakan tindakan yang menyertai
  rationale: Terjemahan mempertahankan hubungan erat antara menjadi pendengar saja dan penipuan diri tanpa menambahkan alasan atau akibat yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “kamu” dibiarkan tanpa penanda jamak karena dalam bahasa Indonesia dapat merujuk kepada satu orang atau sekelompok orang menurut konteks. Susunan kalimat dibuat alami sambil mempertahankan kontras pelaku dan pendengar.
