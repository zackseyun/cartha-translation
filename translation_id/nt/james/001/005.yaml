id: JAS.1.5
reference: James 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: id
  text: Namun, jika ada di antara kamu yang kekurangan hikmat, hendaklah ia memintanya kepada Allah, yang memberi kepada semua orang dengan murah hati dan tanpa mencela[a], dan hikmat itu akan diberikan kepadanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanpa mencari-cari kesalahan” atau “tanpa mempermalukan.”'
    reason: lexical_alternative
  - marker: b
    text: Bentuk tunggal “ia” dan “kepadanya” mewakili siapa pun di antara para pembaca, baik laki-laki maupun perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Namun, jika
  rationale: δέ menandai perkembangan atau kontras ringan dengan ayat sebelumnya; “Namun, jika” mempertahankan hubungan itu secara wajar.
- source_word: τις ὑμῶν
  choice: ada di antara kamu yang
  rationale: Ungkapan ini mempertahankan sapaan pastoral langsung dan makna partitif, yaitu seseorang dari antara para pembaca.
- source_word: λείπεται σοφίας
  choice: kekurangan hikmat
  rationale: λείπεται secara idiomatis menyatakan keadaan tidak memiliki cukup sesuatu; “kekurangan hikmat” alami dan tidak mempersempit cakupan σοφία.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: hendaklah ia memintanya kepada Allah
  rationale: Bentuk imperatif orang ketiga diterjemahkan dengan “hendaklah”; objek tersirat “hikmat” dinyatakan melalui “-nya” agar kalimat Indonesia jelas, sementara παρά menunjukkan sumber permintaan.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Allah, yang memberi kepada semua orang
  rationale: Partisipel menggambarkan Allah sebagai Dia yang memberi, sedangkan πᾶσιν dipertahankan dalam cakupan luas sebagai “semua orang”.
- source_word: ἁπλῶς
  choice: dengan murah hati
  rationale: Dalam konteks pemberian Allah, kata ini paling wajar menyatakan kemurahan atau pemberian tanpa menahan-nahan, bukan sekadar kesederhanaan.
- source_word: μὴ ὀνειδίζοντος
  choice: tanpa mencela
  rationale: Pilihan ini mempertahankan gagasan bahwa Allah tidak mencela, mempermalukan, atau mengungkit kekurangan orang yang meminta.
- source_word: δοθήσεται αὐτῷ
  choice: hal itu akan diberikan kepadanya
  rationale: Bentuk pasif futurum menyatakan janji bahwa hikmat yang diminta akan diberikan; “hal itu” merujuk kembali kepada hikmat tanpa mengubahnya menjadi pelaku.
theological_decisions:
- issue: Bentuk tunggal maskulin yang bersifat representatif
  choice: hendaklah ia ... kepadanya
  alternative: hendaklah orang itu ... kepadanya; hendaklah mereka ... kepada mereka
  rationale: Bahasa Indonesia tidak menandai gender pada “ia” dan “-nya”, sehingga dapat mempertahankan bentuk tunggal generik sumber tanpa mengalihkannya menjadi bentuk jamak.
- issue: Makna pemberian Allah dalam ἁπλῶς
  choice: dengan murah hati
  alternative: dengan tulus; dengan sederhana; tanpa ragu-ragu
  rationale: Dalam konteks meminta hikmat, frasa ini paling mungkin menekankan pemberian Allah yang lapang dan tidak menahan-nahan, tanpa memasukkan gagasan kemakmuran material.
- issue: Hubungan janji dengan permintaan
  choice: maka hal itu akan diberikan kepadanya
  alternative: dan itu akan diberikan kepadanya
  rationale: “Maka” menyatakan hasil dari tindakan meminta secara alami dalam bahasa Indonesia, tanpa menambahkan syarat teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku-modern, lugas, dan bermartabat. “Hendaklah” dipakai untuk mempertahankan daya imperatif tanpa terdengar kasar; pronomina “ia” menjaga bentuk tunggal sumber dan tetap netral gender dalam bahasa Indonesia.
