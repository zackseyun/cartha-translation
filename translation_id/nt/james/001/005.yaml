  terminology: “Allah,” “hikmat,” “murah hati,” dan “mencela” sesuai register Alkitab Indonesia modern dan makna leksikal. Catatan alternatif untuk μὴ ὀνειδίζοντος relevan, dan catatan mengenai bentuk tunggal tepat karena “ia/-nya” tidak menandai gender dalam bahasa Indonesia.
