source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: id
  text: Jangan seorang pun yang sedang dicobai berkata, “Aku dicobai oleh Allah,” sebab Allah tidak dapat dicobai oleh kejahatan,[a] dan Ia sendiri tidak mencobai siapa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Allah tidak dapat dicobai oleh hal-hal jahat.” Frasa Yunani ini langka dan dapat juga dipahami, “Allah tidak mengenal kejahatan melalui pengalaman.”
    reason: Menandai bentuk jamak κακῶν serta ambiguitas ungkapan ἀπείραστός ἐστιν κακῶν tanpa membebani teks utama.
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: Jangan seorang pun ... berkata
  rationale: Bentuk imperatif orang ketiga dengan subjek negatif paling alami dinyatakan sebagai larangan dalam bahasa Indonesia.
- source_word: πειραζόμενος
  choice: yang sedang dicobai
  rationale: Partisipel kini pasif dipertahankan sebagai tindakan yang sedang dialami; konteks ayat 14–15 menunjuk pada godaan menuju dosa, bukan sekadar ujian.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Aku dicobai oleh Allah
  rationale: ἀπό menyatakan sumber atau pelaku dalam konstruksi ini; bentuk pasif kini diterjemahkan secara langsung dan wajar.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: Allah tidak dapat dicobai oleh yang jahat
  rationale: Ungkapan Yunani yang langka ini menyatakan bahwa Allah tidak rentan terhadap godaan yang berkaitan dengan hal-hal jahat. 'Yang jahat' cukup alami sekaligus membiarkan κακῶν mencakup kejahatan atau hal-hal jahat.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: dan Ia sendiri tidak mencobai siapa pun
  rationale: Kata ganti αὐτός bersifat menegaskan, sehingga diterjemahkan 'Ia sendiri'; οὐδένα menjadi 'siapa pun' dalam konstruksi negatif yang alami.
theological_decisions:
- issue: Makna kelompok kata πειράζω dalam ayat ini
  choice: Menerjemahkan semua kemunculannya dengan 'mencobai/dicobai'.
  alternative: Menggunakan 'menguji/diuji' pada satu atau beberapa kemunculan.
  rationale: Konteks langsung berbicara tentang tarikan ke arah dosa oleh keinginan sendiri. Pilihan ini menyangkal bahwa Allah menjadi sumber godaan moral tanpa menyangkal tema Alkitab lain bahwa Allah dapat menguji manusia dalam arti berbeda.
- issue: Makna ἀπείραστός ἐστιν κακῶν
  choice: Allah tidak dapat dicobai oleh yang jahat.
  alternative: Allah tidak mengenal kejahatan melalui pengalaman; atau Allah tidak boleh dicobai dengan hal-hal jahat.
  rationale: Adjektiva ἀπείραστος langka dan frasa ini memiliki ambiguitas leksikal. Dalam alur argumen, ketidakrentanan Allah terhadap godaan jahat paling tepat menjelaskan klausa berikutnya bahwa Ia sendiri tidak mencobai siapa pun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Jangan seorang pun' mempertahankan daya larangan; 'sedang dicobai' mempertahankan aspek berlangsung. Huruf kapital pada 'Ia' mengikuti register Alkitab Indonesia yang umum dan memperjelas rujukan kepada Allah.
