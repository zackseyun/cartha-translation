  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: id
  text: Anggaplah itu sebagai sukacita yang penuh, saudara-saudaraku[a], setiap kali kalian menghadapi berbagai macam ujian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani yang secara harfiah berbentuk “saudara-saudaraku” kemungkinan besar ditujukan kepada seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani ini dapat berarti “ujian”, “pengujian”, atau, dalam konteks tertentu, “godaan”. Di sini konteks menunjuk pada berbagai kesukaran yang menguji iman.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: sukacita sepenuhnya
  rationale: Frasa akusatif ini menjadi pelengkap predikatif bagi ἡγήσασθε. Pilihan ini mempertahankan penekanan pada sukacita yang utuh tanpa memakai ungkapan Indonesia yang kaku seperti 'seluruh sukacita'.
- source_word: ἡγήσασθε
  choice: Anggaplah itu sebagai
  rationale: Imperatif ini menuntut penilaian atau cara memandang secara sadar. 'Anggaplah ... sebagai' alami dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: '''Saudara-saudara'' merupakan sapaan Indonesia yang wajar bagi suatu komunitas dan dapat mencakup laki-laki maupun perempuan, sekaligus tetap dekat dengan bentuk sapaan Yunani.'
- source_word: ὅταν
  choice: setiap kali
  rationale: Bersama bentuk subjungtif περιπέσητε, kata ini menyatakan waktu yang tidak tertentu atau berulang; 'setiap kali' menangkap nuansa 'kapan pun' dengan alami.
- source_word: πειρασμοῖς
  choice: ujian
  rationale: Dalam konteks ayat 2–4, yang dimaksud terutama ialah kesukaran yang menguji iman, bukan bujukan batin untuk berbuat dosa. Catatan kaki mempertahankan rentang makna kata Yunani tersebut.
- source_word: περιπέσητε
  choice: menghadapi
  rationale: Secara harfiah verba ini dapat berarti 'jatuh ke dalam' atau 'berjumpa dengan'. 'Menghadapi' menyampaikan pengalaman yang tidak dihindari dengan bahasa Indonesia yang lebih alami, meski mengurangi sedikit gambaran harfiahnya.
- source_word: ποικίλοις
  choice: berbagai macam
  rationale: Ungkapan ini menyatakan keragaman jenis ujian dan merupakan padanan Indonesia yang jelas serta lazim.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Gunakan 'saudara-saudaraku' dalam teks utama dan jelaskan cakupan komunitasnya dalam catatan kaki.
  alternative: saudara-saudaraku, baik laki-laki maupun perempuan
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi dalam sapaan surat kemungkinan besar mencakup seluruh komunitas orang percaya. Bahasa Indonesia memungkinkan 'saudara-saudaraku' mempertahankan bentuk sapaan yang ringkas sekaligus memiliki cakupan inklusif.
- issue: Makna πειρασμοῖς dalam konteks ini
  choice: ujian
  alternative: pencobaan
  rationale: Konteks langsung berbicara tentang pengujian iman yang menghasilkan ketekunan. Namun, karena kata yang sama dapat menunjuk pada godaan atau pencobaan dalam konteks lain, kemungkinan leksikal itu tidak dihapus dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan komunal yang hangat dan bermartabat. Bentuk 'kalian' dipakai untuk menandai orang kedua jamak secara jelas, sedangkan 'menghadapi' dipilih daripada terjemahan harfiah 'jatuh ke dalam' agar kalimat tetap alami bagi pembaca umum.
