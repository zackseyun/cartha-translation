id: JAS.1.15
reference: James 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: id
  text: Kemudian keinginan itu, setelah mengandung, melahirkan dosa; dan dosa, setelah mencapai kematangan[a], melahirkan maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah menjadi sempurna” atau “setelah berkembang sepenuhnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Kemudian
  rationale: Menandai urutan perkembangan dari keinginan menuju dosa dan maut secara alami dalam bahasa Indonesia.
- source_word: ἐπιθυμία
  choice: keinginan
  rationale: Padanan yang luas dan sesuai konteks untuk hasrat yang menggoda; 'nafsu' berpotensi terlalu menyempitkan atau memberi nuansa khusus.
- source_word: συλλαβοῦσα
  choice: setelah mengandung
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama dan mempertahankan gambaran pembuahan atau kehamilan.
- source_word: τίκτει
  choice: melahirkan
  rationale: Mempertahankan metafora persalinan dengan ungkapan Indonesia yang jelas dan wajar.
- source_word: ἁμαρτίαν
  choice: dosa
  rationale: Padanan baku dan tepat bagi kejahatan moral yang dihasilkan oleh keinginan.
- source_word: δὲ
  choice: dan
  rationale: Dalam konteks ini menghubungkan tahap berikutnya dalam rangkaian, bukan menyatakan pertentangan tajam.
- source_word: ἀποτελεσθεῖσα
  choice: setelah mencapai kematangan
  rationale: Mengungkapkan tercapainya keadaan lengkap atau matang sambil mempertahankan perkembangan organik dalam metafora.
- source_word: ἀποκύει
  choice: melahirkan
  rationale: Verba ini juga membawa citra kelahiran; pengulangan 'melahirkan' terdengar alami dalam bahasa Indonesia dan memperjelas kesejajaran retoris.
- source_word: θάνατον
  choice: maut
  rationale: Padanan langsung, ringkas, dan bermartabat; cakupannya dibiarkan tanpa penjelasan tambahan sebagaimana teks Yunani.
theological_decisions:
- issue: Sifat metafora yang menghubungkan keinginan, dosa, dan maut
  choice: Mempertahankan gambaran personifikasi, kehamilan, dan kelahiran.
  alternative: Keinginan menyebabkan dosa, dan dosa menyebabkan kematian.
  rationale: Parafrasa sebab-akibat akan meratakan metafora reproduktif dan mengurangi daya retoris teks.
- issue: Makna θάνατος
  choice: Menerjemahkannya hanya sebagai 'maut'.
  alternative: kematian rohani; kematian kekal; kematian jasmani
  rationale: Teks Yunani tidak membatasi jenis kematian yang dimaksud, sehingga terjemahan tidak boleh menyisipkan penentuan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Metafora kehamilan dan kelahiran dipertahankan, sedangkan istilah 'maut' menjaga bobot ungkapan tanpa mempersempit maknanya.
