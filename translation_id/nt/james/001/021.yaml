  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: id
  text: Karena itu, buanglah segala kecemaran dan kelimpahan kejahatan, dan terimalah dengan lemah lembut firman yang tertanam[a], yang sanggup menyelamatkan jiwa kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “firman bawaan”; secara tradisional: “firman yang dicangkokkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hidup kalian” atau “diri kalian sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari nasihat sebelumnya dan mempertahankan hubungan logis antarkalimat secara alami.
- source_word: ἀποθέμενοι
  choice: buanglah
  rationale: Partisip aoris ini menyertai imperatif utama. Bentuk imperatif koordinatif menghasilkan bahasa Indonesia yang alami sambil mempertahankan tindakan menanggalkan sebagai prasyarat atau tindakan yang menyertai penerimaan firman.
- source_word: πᾶσαν ῥυπαρίαν
  choice: segala kecemaran
  rationale: Mempertahankan arti kenajisan moral dari metafora tentang kotoran tanpa memakai ungkapan yang terasa kasar atau usang.
- source_word: περισσείαν κακίας
  choice: kejahatan yang begitu melimpah
  rationale: περισσεία menyatakan kelimpahan atau kelebihan, sedangkan κακία berarti kejahatan atau keburukan. Ungkapan ini mempertahankan gambaran kelimpahan tanpa mempersempit κακία menjadi kedengkian.
- source_word: ἐν πραΰτητι
  choice: dengan kelemahlembutan
  rationale: Mencakup sikap lembut, rendah hati, dan bersedia diajar; 'kelemahlembutan' merupakan padanan Indonesia yang bermartabat dan dikenal luas.
- source_word: δέξασθε
  choice: terimalah
  rationale: Mempertahankan daya imperatif dan gagasan menyambut atau menerima secara aktif.
- source_word: τὸν ἔμφυτον λόγον
  choice: firman yang tertanam
  rationale: ἔμφυτος dapat berarti tertanam atau bawaan. 'Yang tertanam' mempertahankan gambaran sesuatu yang ditempatkan dan berakar di dalam tanpa menentukan secara berlebihan mekanismenya.
- source_word: τὸν δυνάμενον σῶσαι
  choice: yang sanggup menyelamatkan
  rationale: Mempertahankan pernyataan tentang kemampuan firman untuk menyelamatkan dan hubungan frasa partisipial dengan 'firman'.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: jiwa kalian
  rationale: ψυχή dapat menunjuk pada jiwa, hidup, atau diri. 'Jiwa kalian' mempertahankan bobot istilah dalam konteks keselamatan, sedangkan alternatifnya dicatat agar keluasan makna tetap terlihat.
theological_decisions:
- issue: Makna τὰς ψυχὰς ὑμῶν dalam konteks keselamatan
  choice: jiwa kalian
  alternative: hidup kalian; diri kalian sendiri
  rationale: Pilihan ini mempertahankan istilah tradisional dan bobot teologis ψυχή tanpa menyatakan bahwa kata tersebut selalu merujuk pada bagian manusia yang terpisah dari tubuh. Catatan kaki menjaga keluasan semantisnya.
- issue: Makna τὸν ἔμφυτον λόγον
  choice: firman yang tertanam
  alternative: firman yang ada sejak lahir; firman yang dicangkokkan
  rationale: Terjemahan ini membiarkan terbuka apakah tekanannya terletak pada firman yang ditanamkan oleh Allah atau firman yang kini telah berakar dalam diri para pendengar, tanpa menetapkan mekanisme teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk membedakan ὑμῶν dari bentuk tunggal. Diksi dibuat bermartabat tetapi tetap mudah dipahami. Struktur partisip Yunani dialihkan menjadi dua imperatif berurutan karena lebih alami dalam bahasa Indonesia; 'lalu' menyatakan hubungan tindakan tanpa memaksakan jeda waktu yang kaku.
