    issue: Ungkapan “kejahatan yang begitu melimpah”
    rationale: Kata “begitu” bersifat intensif dan agak percakapan; περισσεία adalah nomina yang berarti kelimpahan/kelebihan. “Kelimpahan kejahatan” lebih dekat pada bentuk dan arti sumber.
  - severity: low
    issue: Ungkapan “dengan kelemahlembutan”
    rationale: Meskipun dapat dipahami, bentuk nomina ini terasa kurang lazim. Idiom baku yang lebih alami untuk ἐν πραΰτητι ialah “dengan lemah lembut.”
  - severity: low
    issue: Alternatif “firman yang ada sejak lahir”
    rationale: Alternatif ini kurang idiomatis dalam bahasa Indonesia dan dapat terdengar seolah-olah firman itu sendiri sudah ada sejak kelahiran. “Firman bawaan” lebih ringkas sambil mempertahankan kemungkinan makna inborn.
