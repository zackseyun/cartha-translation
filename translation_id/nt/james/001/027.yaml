source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: id
  text: 'Ibadah yang murni dan tidak tercemar di hadapan Allah, Sang Bapa, ialah ini: memperhatikan anak-anak yatim dan para janda dalam kesusahan mereka,[a] serta menjaga diri agar tidak ternoda oleh dunia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengunjungi anak-anak yatim dan para janda dalam kesusahan mereka”; kata Yunani yang dipakai dapat mencakup kunjungan sekaligus perhatian dan pertolongan nyata.
    reason: lexical_alternative
  - marker: b
    text: “Dunia” di sini menunjuk pada tatanan moral yang rusak dan menentang Allah, bukan pada ciptaan itu sendiri.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: ibadah
  rationale: Dalam konteks ini, kata tersebut menunjuk pada praktik pengabdian keagamaan yang tampak dalam tindakan. “Ibadah” alami dalam bahasa Indonesia dan sesuai dengan penekanan Yakobus pada kesalehan yang dijalankan.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: murni dan tidak tercemar
  rationale: 'Pasangan ini mempertahankan dua gambaran yang berdekatan tetapi tidak identik: kemurnian dan ketiadaan pencemaran moral atau keagamaan.'
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: di hadapan Allah dan Bapa
  rationale: παρά dengan datif menyatakan penilaian di hadapan atau dalam pandangan seseorang. Terjemahan ini juga mempertahankan konstruksi Yunani “Allah dan Bapa” tanpa secara tidak perlu mengubahnya menjadi “Allah Bapa” atau menambahkan kata ganti “kita” yang tidak terdapat dalam teks.
- source_word: ἐπισκέπτεσθαι
  choice: memperhatikan
  rationale: Verba ini dapat mencakup mengunjungi sekaligus memberi perhatian dan pertolongan nyata. “Memperhatikan” cukup luas untuk menyampaikan kepedulian aktif, sedangkan nuansa “mengunjungi” dicatat dalam catatan kaki.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: anak-anak yatim dan para janda
  rationale: Padanan langsung dan wajar bagi dua kelompok rentan yang disebut dalam teks.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: dalam kesusahan mereka
  rationale: θλῖψις menyatakan tekanan, penderitaan, atau keadaan sulit. “Kesusahan” alami dan cukup kuat dalam bahasa Indonesia modern.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: menjaga diri agar tidak ternoda
  rationale: Ungkapan ini mempertahankan gambaran noda moral dan menyampaikan tindakan kewaspadaan yang berkelanjutan. “Diri” membawa daya generik ἑαυτόν tanpa membatasi rujukan pada laki-laki.
- source_word: ἀπὸ τοῦ κόσμου
  choice: oleh dunia
  rationale: Dengan ungkapan “ternoda oleh dunia”, bahasa Indonesia secara alami menyatakan sumber pencemaran yang dalam Yunani ditandai dengan ἀπό. Istilah “dunia” dipertahankan agar cakupan etisnya tidak dipersempit secara berlebihan.
theological_decisions:
- issue: Makna κόσμος dalam konteks etis
  choice: Mempertahankan “dunia” dalam teks utama dan menjelaskan nuansa etisnya dalam catatan kaki.
  alternative: “tatanan dunia yang rusak” atau “kejahatan dunia”
  rationale: Dalam konteks ini κόσμος berfungsi sebagai ranah pengaruh moral yang menentang Allah, tetapi perluasan eksplisit dalam teks utama akan menafsirkan lebih jauh daripada bentuk sumber dan dapat keliru dipahami sebagai penolakan terhadap ciptaan itu sendiri.
- issue: Hubungan θεῷ καὶ πατρὶ
  choice: “Allah dan Bapa”
  alternative: “Allah Bapa” atau “Allah dan Bapa kita”
  rationale: Bentuk Yunani dapat dipahami secara aposisional, tetapi terjemahan “Allah dan Bapa” paling dekat mempertahankan susunan sumber dan ambiguitas terbatasnya. Kata “kita” tidak ditambahkan karena tidak terdapat dalam teks.
- issue: Daya generik ἑαυτόν
  choice: “diri”
  alternative: “dirinya sendiri” dengan rujukan maskulin tersirat
  rationale: Maksim ini berlaku umum. Bahasa Indonesia tidak memerlukan penandaan gender, sehingga “diri” menyampaikan maksud sumber secara tepat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan bentuk definisional ayat, sedangkan pilihan “memperhatikan” dan “kesusahan” membuat tindakan praktis serta keadaan kelompok rentan mudah dipahami oleh pembaca umum.
