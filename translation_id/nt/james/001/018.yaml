  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: id
  text: Atas kehendak-Nya sendiri, Ia melahirkan kita melalui firman kebenaran, supaya kita menjadi semacam buah sulung di antara segala sesuatu yang diciptakan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Buah sulung» adalah bagian pertama dari hasil panen yang dipersembahkan dan dikhususkan bagi Allah; di sini istilah itu menggambarkan orang-orang percaya sebagai bagian awal yang dikhususkan di antara segala sesuatu yang Allah ciptakan.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Karena Ia menghendakinya
  rationale: Partisip aoris ini menyatakan kehendak yang mendahului tindakan utama dan dalam konteks dapat dipahami secara kausal. Terjemahan ini menegaskan prakarsa Allah tanpa memasukkan sistem teologis tertentu.
- source_word: ἀπεκύησεν
  choice: Ia melahirkan kita
  rationale: Kata ini mempertahankan gambaran kelahiran dan menggemakan Yakobus 1:15, tempat keinginan 'melahirkan' dosa. Ungkapan ini lebih langsung daripada parafrasa seperti 'menjadikan kita anak-anak-Nya'.
- source_word: λόγῳ ἀληθείας
  choice: melalui firman kebenaran
  rationale: Datif λόγῳ menunjukkan sarana. 'Firman kebenaran' mempertahankan ungkapan alkitabiah dan tidak mempersempit rujukannya secara eksplisit, meskipun kemungkinan besar menunjuk pada berita Injil yang benar.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: supaya kita menjadi
  rationale: Konstruksi εἰς dengan infinitif berartikel menyatakan tujuan atau hasil; 'supaya' mengungkapkan daya teliknya secara alami dalam bahasa Indonesia.
- source_word: ἀπαρχήν
  choice: buah sulung
  rationale: Istilah ini mempertahankan metafora hasil panen pertama yang dipersembahkan atau dikhususkan bagi Allah serta gema konseptualnya dalam Kitab Suci.
- source_word: τινα
  choice: semacam
  rationale: 'τινα memberi nuansa kualifikasi pada predikat: orang percaya adalah buah sulung dalam suatu pengertian, bukan buah sulung secara harfiah.'
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: dari segala ciptaan-Nya
  rationale: κτίσματα berbentuk jamak dan menunjuk pada makhluk atau segala sesuatu yang diciptakan. Ungkapan ini alami dalam bahasa Indonesia dan tetap membiarkan cakupannya luas, tanpa membatasinya pada manusia.
theological_decisions:
- issue: Prakarsa ilahi dalam kelahiran baru
  choice: Kehendak Allah disajikan sebagai dasar bagi tindakan-Nya melahirkan kita.
  alternative: Atas kehendak-Nya sendiri, Ia melahirkan kita.
  rationale: Bahasa Yunani menempatkan kehendak Allah sebelum tindakan utama, tetapi tidak menguraikan sistem predestinasi atau regenerasi tertentu. Terjemahan mempertahankan penekanan itu tanpa melampaui teks.
- issue: Cakupan κτισμάτων
  choice: segala ciptaan-Nya
  alternative: makhluk-makhluk ciptaan-Nya
  rationale: Cakupan dibiarkan luas sehingga dapat menunjuk kepada tatanan ciptaan secara umum; teks tidak membenarkan pembatasan hanya kepada umat manusia.
- issue: Hubungan tujuan dan hasil dalam εἰς τὸ εἶναι
  choice: supaya kita menjadi
  alternative: sehingga kita menjadi
  rationale: Konstruksi Yunani dapat memuat nuansa tujuan dan hasil. 'Supaya' mengedepankan tujuan tanpa meniadakan hasil yang dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Ia' dan '-Nya' dipakai untuk rujukan kepada Allah. Gambaran kelahiran dan buah sulung dipertahankan; catatan kaki menjelaskan metafora budaya tanpa menggantikannya dengan parafrasa.
