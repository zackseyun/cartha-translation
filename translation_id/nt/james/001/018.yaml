- from: Karena Ia menghendakinya, Ia melahirkan kita melalui firman kebenaran, supaya kita menjadi semacam buah sulung dari segala ciptaan-Nya.[a]
  to: Atas kehendak-Nya sendiri, Ia melahirkan kita melalui firman kebenaran, supaya kita menjadi semacam buah sulung di antara segala sesuatu yang diciptakan-Nya.[a]
  rationale: Revisi menghilangkan ambiguitas pronomina pada pembukaan dengan memakai padanan idiomatis yang tetap menyatakan prakarsa kehendak Allah. Frasa penutup disesuaikan agar cakupan luas κτισμάτων dan hubungan ‘di antara’ pada metafora ἀπαρχή lebih jelas. Tidak ada perubahan makna teologis atau penambahan penafsiran.
