id: JAS.1.25
reference: James 1:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: id
  text: Namun, orang yang mengamati dengan saksama hukum yang sempurna, yaitu hukum kemerdekaan[a], dan terus berpegang padanya—bukan menjadi pendengar yang lupa[b], melainkan pelaku perbuatan[c]—orang itulah yang akan diberkati dalam apa yang dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hukum kemerdekaan yang sempurna.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “pendengar kelupaan”; maksudnya, pendengar yang melupakan apa yang didengarnya.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “pelaku perbuatan”; dapat juga diungkapkan lebih idiomatis sebagai “orang yang bertindak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: mengamati dengan saksama
  rationale: Kata ini menggambarkan tindakan membungkuk atau menengok untuk melihat dengan teliti, bukan sekadar melihat sepintas. Ungkapan ini mempertahankan ketekunan pengamatan dengan bahasa Indonesia yang wajar.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: hukum yang sempurna, yaitu hukum kemerdekaan
  rationale: Pengulangan 'hukum' mempertahankan hubungan aposisional dalam bahasa Yunani. 'Kemerdekaan' menjaga keluasan makna ἐλευθερία tanpa menjelaskan secara berlebihan bagaimana hukum itu berkaitan dengan kemerdekaan.
- source_word: παραμείνας
  choice: terus berpegang padanya
  rationale: Partisip ini menyatakan bahwa orang tersebut tetap atau bertekun sehubungan dengan hukum yang baru disebut. 'Terus berpegang padanya' menyampaikan keberlanjutan itu secara alami.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: bukan menjadi pendengar yang lupa
  rationale: Genitif ἐπιλησμονῆς diungkapkan sebagai klausa pewatas yang alami dalam bahasa Indonesia, tanpa menghilangkan kontras antara mendengar dan melakukan.
- source_word: ποιητὴς ἔργου
  choice: pelaku perbuatan
  rationale: Terjemahan ini mempertahankan kata ἔργον, 'perbuatan/tindakan', dan tidak menggantinya dengan 'firman' dari konteks ayat sebelumnya. Kejanggalan ringan frasa sumber dipertahankan, dengan alternatif idiomatis dijelaskan dalam catatan.
- source_word: μακάριος
  choice: diberkati
  rationale: Pilihan ini mempertahankan bobot teologis μακάριος dan lebih tepat daripada sekadar keadaan emosional 'bahagia'.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: dalam apa yang dilakukannya
  rationale: Ungkapan ini menyampaikan tindakan atau praktik nyata secara wajar dan tetap menghubungkannya dengan sebutan 'pelaku' sebelumnya.
- source_word: ὁ ... οὗτος
  choice: orang yang ... orang itulah
  rationale: Konstruksi ini mempertahankan bentuk tunggal representatif dan penegasan οὗτος tanpa membatasi acuannya hanya kepada laki-laki.
theological_decisions:
- issue: Makna 'hukum kemerdekaan'
  choice: Mempertahankan ungkapan 'hukum kemerdekaan' tanpa mempersempit maknanya.
  alternative: hukum yang memberi kemerdekaan
  rationale: Bahasa Yunani tidak dengan sendirinya menetapkan apakah yang dimaksud ialah Injil, hukum moral yang dipahami dalam penggenapannya, atau pengajaran Allah secara lebih luas. Bentuk yang dipilih mempertahankan ketegangan teologis itu.
- issue: Acuan bentuk maskulin tunggal
  choice: Menggunakan 'orang yang ... orang itulah' sebagai bentuk tunggal generik.
  alternative: laki-laki yang ... dialah
  rationale: Bentuk maskulin Yunani di sini bersifat generik, bukan membatasi janji berkat kepada laki-laki.
- issue: Hubungan berkat dengan perbuatan
  choice: Menerjemahkan secara langsung bahwa orang itu 'akan diberkati dalam apa yang dilakukannya'.
  alternative: akan memperoleh keselamatan karena perbuatannya
  rationale: Teks menyatakan berkat dalam pelaksanaan atau perbuatannya, tetapi tidak secara eksplisit mendefinisikan berkat itu sebagai keselamatan atau menetapkan dasar kausal keselamatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur kalimat yang tetap mudah diikuti. Pengulangan 'orang' mempertahankan penegasan konstruksi Yunani, sedangkan tanda pisah menonjolkan kontras antara pendengar yang lupa dan pelaku perbuatan.
