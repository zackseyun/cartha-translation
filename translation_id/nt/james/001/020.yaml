  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: id
  text: Sebab kemarahan manusia tidak menghasilkan kebenaran Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: kemarahan manusia
  rationale: Ungkapan ini menunjuk pada kemarahan manusia secara umum; “manusia” lebih wajar dan inklusif dalam bahasa Indonesia daripada “seorang laki-laki”.
- source_word: ἐργάζεται
  choice: menghasilkan
  rationale: Kata kerja ini menyatakan bahwa kemarahan manusia tidak mengerjakan atau mendatangkan hasil yang dimaksud.
- source_word: δικαιοσύνην θεοῦ
  choice: kebenaran yang dikehendaki Allah
  rationale: Genitif θεοῦ dapat dipahami sebagai kebenaran milik/berasal dari Allah atau sebagai perilaku benar yang Allah kehendaki. Dalam konteks nasihat etis ini, pilihan tersebut menyampaikan makna secara alami tanpa menyamakannya dengan tindakan manusia membenarkan diri.
theological_decisions:
- issue: Makna δικαιοσύνη θεοῦ
  choice: kebenaran yang dikehendaki Allah
  alternative: kebenaran Allah
  rationale: Konteks Yakobus 1:19–21 berfokus pada perilaku yang sesuai dengan kehendak Allah. Namun, karena frasa Yunani tetap dapat berarti “kebenaran Allah,” alternatif harfiahnya dicatat dalam catatan kaki agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan sebab-akibat dipertahankan, sedangkan ungkapan genitif dijelaskan secara alami dengan alternatif harfiah dalam catatan kaki.
