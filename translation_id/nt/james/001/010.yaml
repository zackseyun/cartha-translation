  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: id
  text: sedangkan orang kaya dalam keadaannya yang direndahkan[a], sebab ia akan berlalu seperti bunga rerumputan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dengan melengkapi kata-kata yang tersirat dari ayat sebelumnya, bagian ini dapat dibaca: “sedangkan orang kaya hendaklah bermegah dalam keadaannya yang direndahkan.”'
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “bunga rumput”; gambaran ini menekankan betapa cepat orang kaya berlalu, seperti tumbuh-tumbuhan yang sedang berbunga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: sedangkan orang kaya
  rationale: δέ menghubungkan ayat ini dengan ayat sebelumnya sekaligus menandai kesejajaran yang berkontras antara saudara yang berkedudukan rendah dan orang kaya. Dalam bahasa Indonesia, “orang kaya” wajar untuk bentuk substantival πλούσιος tanpa perlu menambahkan penandaan gender yang tidak alami.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: dalam keadaannya yang direndahkan
  rationale: ταπείνωσις dapat menunjuk pada keadaan rendah, penghinaan, atau tindakan direndahkan. Ungkapan ini mempertahankan gagasan bahwa orang kaya dibawa turun dari kedudukannya, tanpa membatasinya pada kerendahan hati sebagai kebajikan sukarela.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan bagi pernyataan sebelumnya. “Sebab” menyampaikan hubungan kausal itu dalam ragam bahasa yang ringkas dan bermartabat.
- source_word: ὡς ἄνθος χόρτου
  choice: seperti bunga rerumputan
  rationale: Terjemahan ini mempertahankan citra Yunani yang mengaitkan bunga dengan rumput atau tumbuh-tumbuhan yang cepat layu. “Rerumputan” terdengar lebih alami daripada “rumput” tunggal dalam bahasa Indonesia sambil tetap dekat dengan bentuk sumber.
- source_word: παρελεύσεται
  choice: ia akan berlalu
  rationale: Dalam konteks ini παρέρχομαι menyatakan kefanaan dan lenyapnya hidup serta kedudukan orang kaya. “Akan berlalu” mempertahankan metafora sumber tanpa mempersempitnya hanya menjadi kematian atau hilangnya kekayaan.
theological_decisions:
- issue: Elipsis yang bergantung pada ayat sebelumnya
  choice: Teks utama tidak mengulang kata kerja perintah dari ayat 9, tetapi mempertahankan susunan eliptis teks Yunani.
  alternative: “sedangkan orang kaya hendaklah bermegah dalam keadaannya yang direndahkan”
  rationale: Secara sintaksis, ayat 10 meneruskan “hendaklah bermegah” dari ayat 9, tetapi kata-kata itu tidak diulangi dalam teks Yunani ayat ini. Mempertahankan elipsis menjaga keterlacakan pada sumber; catatan kaki memberi pembaca bentuk lengkap yang tersirat.
- issue: Makna keadaan orang kaya yang direndahkan
  choice: Ungkapan tersebut menyatakan keadaan orang kaya ketika ia dibawa turun atau direndahkan, terutama mengingat kefanaan hidup dan kedudukannya.
  alternative: Kerendahan hati sukarela atau sekadar kedudukan sosial yang rendah
  rationale: Alasan yang langsung menyusul—ia akan berlalu seperti bunga rerumputan—menekankan pembalikan dan kefanaan, bukan terutama sifat rendah hati. Terjemahan ini menjaga cakupan makna tanpa menetapkan suatu sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur eliptis sumber dipertahankan, sedangkan catatan kaki membantu pembacaan ayat secara mandiri. “Bunga rerumputan” menjaga citra alkitabiah sekaligus lebih alami daripada ungkapan harfiah yang kaku.
