  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: id
  text: Sebab ia mengamati dirinya sendiri, lalu pergi, dan segera lupa seperti apa dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang macam apa dia.” Ungkapan Yunani menunjuk pada sifat, rupa, atau keadaan orang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: mengamati
  rationale: Kata ini dapat berarti memperhatikan, mengamati, atau mempertimbangkan dengan saksama. Dalam gambaran tentang cermin, “mengamati” menyatakan tindakan melihat dengan perhatian tanpa menyiratkan bahwa pengamatan itu menghasilkan kesadaran diri yang bertahan lama.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memperkenalkan penjelasan bagi perbandingan pada ayat sebelumnya. “Sebab” mempertahankan hubungan penjelas tersebut secara alami dalam bahasa Indonesia.
- source_word: ἑαυτὸν
  choice: dirinya sendiri
  rationale: Kata ganti refleksif ini secara langsung menunjuk kepada diri orang tersebut. Ayat ini tidak mengulangi kata “wajah” dari konteks sebelumnya, sehingga “dirinya sendiri” paling setia pada bentuk dan cakupan teks.
- source_word: ἀπελήλυθεν
  choice: pergi
  rationale: Bentuk perfektum verba ini dapat menonjolkan keadaan sesudah pergi, tetapi dalam rangkaian tindakan naratif bahasa Indonesia, “pergi” menyampaikan maknanya dengan jelas dan wajar.
- source_word: εὐθέως
  choice: segera
  rationale: Kata keterangan ini menyatakan bahwa kelupaan terjadi tanpa jeda; “segera” mempertahankan penekanan tersebut dalam ragam baku.
- source_word: ἐπελάθετο
  choice: lupa
  rationale: Verba ini berarti tidak lagi mengingat atau melupakan. “Lupa” merupakan padanan langsung dan idiomatis.
- source_word: ὁποῖος ἦν
  choice: seperti apa dirinya
  rationale: Ungkapan ini menanyakan kualitas, rupa, atau keadaan seseorang, bukan sekadar identitasnya. “Seperti apa dirinya” mempertahankan keluasan makna itu serta tetap alami dan tidak membatasi contoh umum ini kepada laki-laki.
theological_decisions:
- issue: Makna maskulin generik dalam gambaran tentang cermin
  choice: seperti apa dirinya
  alternative: orang macam apa dia
  rationale: Bentuk Yunani berkonteks maskulin tunggal, tetapi orang tersebut berfungsi sebagai contoh umum. Kata ganti “ia” dan “dirinya” mempertahankan rujukan tunggal tanpa menjadikan penerapannya khusus bagi laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. “Lalu” memperjelas urutan tindakan, sedangkan pengulangan konjungsi dijaga secara alami tanpa membuat kalimat terasa kaku.
