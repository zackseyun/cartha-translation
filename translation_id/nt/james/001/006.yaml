id: JAS.1.6
reference: James 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: id
  text: Namun, hendaklah ia meminta dengan iman[a], tanpa ragu sedikit pun, sebab orang yang ragu-ragu sama seperti gelombang laut yang ditiup angin dan diombang-ambingkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kepercayaan.” Kata Yunani yang diterjemahkan “iman” juga dapat menyatakan sikap percaya dan bersandar kepada Allah dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: hendaklah ia meminta
  rationale: Imperatif kini orang ketiga menyampaikan ajakan atau perintah. Bentuk ini alami dalam bahasa Indonesia dan mengacu pada permintaan akan hikmat kepada Allah dalam ayat sebelumnya.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari kemurahan Allah pada ayat sebelumnya kepada cara orang itu harus meminta.
- source_word: ἐν πίστει
  choice: dengan iman
  rationale: Ungkapan ini mempertahankan istilah teologis πίστις sekaligus terdengar alami dalam bahasa Indonesia; dalam konteksnya, iman mencakup sikap percaya dan bersandar kepada Allah.
- source_word: μηδὲν διακρινόμενος
  choice: tanpa ragu sedikit pun
  rationale: διακρινόμενος di sini menunjuk pada keraguan atau kebimbangan batin, sedangkan μηδέν menegaskan ketiadaan keraguan itu. Rumusan ini jelas dan idiomatis.
- source_word: ὁ γὰρ διακρινόμενος
  choice: sebab orang yang ragu-ragu
  rationale: Partisipel bersubstansi diterjemahkan secara generik tanpa membatasi rujukannya pada laki-laki; pengulangan 'ragu-ragu' mempertahankan kaitan leksikal dengan frasa sebelumnya.
- source_word: ἔοικεν
  choice: sama seperti
  rationale: Mengungkapkan perbandingan secara wajar dan jelas dalam bahasa Indonesia.
- source_word: κλύδωνι θαλάσσης
  choice: gelombang laut
  rationale: κλύδων menunjuk pada gelombang atau deburan laut. 'Gelombang laut' merupakan padanan modern yang jelas dan tetap mempertahankan citra teks.
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: yang diombang-ambingkan dan dihempaskan oleh angin
  rationale: 'Kedua partisipel pasif dipertahankan untuk menggambarkan ketidakstabilan: yang pertama menekankan gerakan akibat angin, dan yang kedua dorongan atau hempasan kuat. Penempatan ''oleh angin'' pada akhir frasa berlaku alami bagi keduanya.'
theological_decisions:
- issue: Makna πίστις dalam nasihat mengenai doa
  choice: iman
  alternative: kepercayaan; sikap percaya
  rationale: '''Iman'' mempertahankan kesinambungan istilah teologis, sedangkan catatan kaki menjelaskan bahwa dalam konteks ini kata tersebut juga menonjolkan kepercayaan dan sikap bersandar kepada Allah.'
- issue: Makna διακρινόμενος
  choice: ragu-ragu
  alternative: bimbang; terpecah batin
  rationale: Dalam konteks permohonan kepada Allah, kata ini terutama menyatakan keraguan atau kebimbangan. Terjemahan tidak memperluasnya menjadi penilaian intelektual maupun menetapkannya sebagai doktrin khusus tentang jenis keraguan tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Hendaklah' mempertahankan daya nasihat imperatif; 'diombang-ambingkan dan dihempaskan' menjaga citra puitis serta ketidakstabilan gelombang tanpa memakai ungkapan arkais.
