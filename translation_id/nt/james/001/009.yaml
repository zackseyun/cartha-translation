  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: id
  text: Namun, hendaklah saudara[a] yang rendah kedudukannya bermegah dalam kedudukannya yang tinggi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara atau saudari yang rendah kedudukannya.” Kata Yunani yang diterjemahkan “saudara” berbentuk maskulin tunggal, tetapi dapat digunakan secara representatif untuk sesama orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam peninggiannya.” Ungkapan ini dapat menunjuk pada kedudukan terhormat orang percaya yang rendah di hadapan Allah, dengan kemungkinan pembalikan keadaan pada masa kini maupun pada masa depan.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: hendaklah ... bermegah
  rationale: Bentuk imperatif kini ini menyampaikan ajakan atau perintah. 'Bermegah' mempertahankan daya leksikal καυχάομαι, sementara objek kemegahan dalam konteks menyingkirkan gagasan menyombongkan diri.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan nuansa kontras menuju pasangan antara orang yang rendah kedudukannya dan orang kaya dalam ayat 9–10. 'Namun' menyampaikan kontras ringan secara alami.
- source_word: ὁ ἀδελφὸς
  choice: saudara
  rationale: ἀδελφός berbentuk maskulin tunggal dan dalam Surat Yakobus lazim menunjuk kepada sesama orang percaya. 'Saudara' mempertahankan bentuk sumber; kemungkinan fungsi representatifnya dijelaskan dalam catatan kaki.
- source_word: ὁ ταπεινὸς
  choice: yang rendah kedudukannya
  rationale: ταπεινός di sini kemungkinan menunjuk pada kedudukan sosial atau ekonomi yang rendah, khususnya karena dipasangkan dengan orang kaya pada ayat 10. Ungkapan ini tetap memungkinkan resonansi kerendahan tanpa membatasinya pada kemiskinan saja.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: dalam keluhurannya
  rationale: ὕψος berarti ketinggian, keluhuran, atau keadaan ditinggikan. 'Keluhurannya' mempertahankan citra pembalikan dan kehormatan yang diterima orang percaya di hadapan Allah tanpa menetapkan apakah penggenapannya hanya sekarang atau pada masa depan.
theological_decisions:
- issue: Makna 'keluhuran' saudara yang rendah kedudukannya
  choice: Dibiarkan mencakup kedudukan atau kehormatan luhur di hadapan Allah, dengan nuansa pembalikan keadaan pada masa kini dan/atau masa depan.
  alternative: Kenaikan kedudukan sosial sekarang saja; status rohani di hadapan Allah saja; atau peninggian eskatologis saja.
  rationale: Konteks ayat 9–10 memakai pertentangan antara yang rendah dan yang kaya. Terjemahan tidak mempersempit ungkapan itu menjadi satu kerangka waktu atau satu jenis peninggian.
- issue: Cakupan gender ἀδελφός
  choice: Memakai 'saudara' dalam teks utama untuk mempertahankan bentuk maskulin tunggal sumber.
  alternative: '''Saudara atau saudari'' atau ''sesama orang percaya''.'
  rationale: Bentuk Yunani adalah maskulin tunggal, tetapi dapat berfungsi secara representatif bagi seorang anggota komunitas orang percaya; kemungkinan itu dicatat tanpa mengubah bentuk utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk nasihat, kontras, bentuk tunggal maskulin, atau ambiguitas mengenai sifat dan waktu peninggian.
