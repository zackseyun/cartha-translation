base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: id
  text: Setiap pemberian yang baik[a] dan setiap karunia yang sempurna berasal dari atas, turun dari Bapa segala terang. Pada-Nya tidak ada perubahan ataupun bayang-bayang akibat peralihan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap tindakan memberi yang baik.” Kata pertama dapat menekankan tindakan memberi, sedangkan “karunia” menekankan sesuatu yang diberikan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “bayang-bayang karena perputaran” atau “bayang-bayang yang bergeser.” Ungkapan ini mungkin mengacu pada bayang-bayang yang berubah seiring pergerakan benda-benda langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Setiap pemberian yang baik
  rationale: “Pemberian” dapat menunjuk baik pada tindakan memberi maupun pada sesuatu yang diberikan, sehingga mempertahankan keluasan makna δόσις. “Setiap” mempertahankan daya distributif Πᾶσα.
- source_word: πᾶν δώρημα τέλειον
  choice: setiap karunia yang sempurna
  rationale: “Karunia” menunjuk pada pemberian yang diterima dan membedakannya dari “pemberian” pada frasa pertama. “Sempurna” mempertahankan makna τέλειον sebagai utuh, lengkap, atau sepenuhnya baik.
- source_word: ἄνωθέν ἐστιν
  choice: berasal dari atas
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penegasan sumber yang dinyatakan oleh ἄνωθεν dan kopula ἐστιν.
- source_word: καταβαῖνον
  choice: turun
  rationale: Bentuk partisip kini menggambarkan gerak dari sumber di atas; “turun” ringkas dan alami tanpa menambahkan penjelasan.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: dari Bapa segala terang
  rationale: Metafora genitif dipertahankan tanpa menafsirkan “terang” secara eksplisit sebagai benda-benda langit dalam teks utama.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: Pada-Nya tidak ada perubahan
  rationale: “Pada-Nya” menyatakan relasi atau keberadaan yang terkandung dalam παρ’ ᾧ, sedangkan “tidak ada perubahan” menerjemahkan bentuk eksistensial dan παραλλαγή secara jelas.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: ataupun bayang-bayang akibat peralihan
  rationale: “Ataupun” alami setelah negasi. Frasa “bayang-bayang akibat peralihan” mempertahankan citra bayang-bayang dan hubungan genitif yang sulit tanpa sepenuhnya menetapkannya sebagai istilah astronomis.
theological_decisions:
- issue: Citra “Bapa segala terang” dan ketidakberubahan Allah
  choice: Mempertahankan metafora terang serta pernyataan bahwa pada Allah tidak ada perubahan atau bayang-bayang akibat peralihan.
  alternative: Menjelaskan “terang” sebagai benda-benda langit dan merangkum klausa akhir sebagai “Allah tidak pernah berubah.”
  rationale: Teks Yunani mengontraskan Sang Bapa dengan perubahan atau peralihan yang terkait dengan citra terang dan bayang-bayang. Terjemahan mempertahankan citra serta ketegangannya tanpa mengubahnya menjadi uraian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel sumber dipertahankan, sementara “pemberian” dan “karunia” membedakan kedua nomina Yunani secara alami. Metafora dan ambiguitas klausa terakhir tidak dijabarkan secara doktrinal dalam teks utama.
