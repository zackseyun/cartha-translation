  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: id
  text: Jika seseorang menganggap dirinya seorang yang taat beragama[a], tetapi tidak mengekang lidahnya[b], melainkan menipu hatinya sendiri, ibadahnya sia-sia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tampaknya seorang yang taat beragama.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “mengekang” mempertahankan gambaran tentang kekang yang dipakai untuk mengendalikan binatang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “kosong” atau “tidak berguna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: menganggap dirinya
  rationale: Ungkapan ini menyampaikan penilaian orang tersebut tentang dirinya sendiri. Makna alternatif ‘tampaknya’ tetap dicatat karena verba Yunani ini dapat memuat nuansa tersebut.
- source_word: θρησκὸς
  choice: seorang yang tekun beribadah
  rationale: Pilihan ini alami dalam bahasa Indonesia dan menunjukkan orang yang menjalankan praktik keagamaan, bukan sekadar orang yang menganut suatu agama.
- source_word: χαλιναγωγῶν
  choice: mengekang
  rationale: ‘Mengekang’ mempertahankan gambaran konkret tentang kekang yang dipakai untuk mengendalikan binatang dan selaras dengan pemakaian gambaran itu kembali dalam Yakobus 3:2.
- source_word: γλῶσσαν αὐτοῦ
  choice: lidahnya
  rationale: Terjemahan konkret ini mempertahankan metafora sumber dan hubungan tematis dengan pembahasan tentang lidah dalam pasal 3.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: menipu hatinya sendiri
  rationale: Pilihan ini mempertahankan kata ‘hati’ sebagai pusat batin manusia sekaligus menjelaskan secara alami bahwa penipuan itu tertuju kepada batinnya sendiri.
- source_word: τούτου
  choice: orang itu
  rationale: Demonstratif ini menunjuk kembali dengan tegas kepada orang yang baru saja digambarkan.
- source_word: μάταιος
  choice: sia-sia
  rationale: ‘Sia-sia’ menyampaikan gagasan bahwa ibadah tersebut kosong, tidak berguna, atau tidak menghasilkan nilai yang semestinya.
- source_word: ἡ θρησκεία
  choice: ibadah
  rationale: Dalam konteks ini kata tersebut menunjuk pada praktik atau pengamalan agama. ‘Ibadah’ menjaga hubungan makna dengan ‘tekun beribadah’ dan lebih wajar daripada istilah abstrak seperti ‘keberagamaan’.
theological_decisions:
- issue: Cakupan θρησκός dan θρησκεία
  choice: tekun beribadah / ibadah
  alternative: taat beragama / praktik keagamaan
  rationale: Pilihan utama mempertahankan hubungan leksikal kedua kata Yunani dan menyoroti pelaksanaan agama yang diakui seseorang. Ayat ini menilai ibadah yang tidak disertai pengendalian lidah, bukan menolak agama atau ibadah pada dirinya sendiri.
- issue: Rujukan tunggal generik
  choice: seseorang ... -nya ... orang itu
  alternative: seorang laki-laki ... miliknya
  rationale: Bentuk maskulin tunggal Yunani berfungsi secara generik. Bahasa Indonesia secara alami memakai ‘seseorang’ dan akhiran ‘-nya’ tanpa menambahkan jenis kelamin yang tidak menjadi pokok pernyataan.
- issue: 'Objek penipuan: hati atau diri'
  choice: menipu hatinya sendiri
  alternative: menipu dirinya sendiri
  rationale: Terjemahan utama mempertahankan ‘hati’ dari teks Yunani sebagai sebutan bagi batin manusia dan tidak meratakan ungkapan itu menjadi sekadar ‘diri’.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kontras dipertahankan dengan ‘tetapi ... dan malah’. Istilah ‘mengekang lidah’ sengaja dipertahankan sebagai metafora yang hidup dan mudah dipahami, sedangkan ‘tekun beribadah/ibadah’ menghindari kesan bahwa teks hanya membicarakan kepemilikan identitas agama.
