  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: id
  text: Namun, setiap orang dicobai oleh keinginannya sendiri[a], ketika ia ditarik keluar dan dipikat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hasratnya sendiri” atau “nafsunya sendiri”. Kata Yunani ini dapat berarti keinginan yang kuat secara umum, bukan hanya keinginan seksual.
    reason: lexical_alternative
  - marker: b
    text: 'Kedua kata ini membangkitkan gambaran berburu atau memancing: mangsa ditarik keluar dan dipikat dengan umpan.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: setiap orang
  rationale: Mempertahankan tekanan distributif bentuk tunggal Yunani dengan ungkapan Indonesia yang alami.
- source_word: δὲ
  choice: Namun
  rationale: 'Menandai pertentangan ringan dengan ayat sebelumnya: bukan Allah yang mencobai, melainkan keinginan orang itu sendiri.'
- source_word: πειράζεται
  choice: dicobai
  rationale: Dalam konteks ayat 13–15, kata ini menunjuk pada godaan menuju dosa, bukan sekadar pengujian.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: oleh keinginannya sendiri
  rationale: Menunjukkan sumber efektif pencobaan sekaligus menegaskan bahwa keinginan itu berasal dari dalam diri orang tersebut.
- source_word: ἐπιθυμίας
  choice: keinginan
  rationale: Cukup luas untuk mencakup hasrat kuat yang salah tanpa membatasinya pada nafsu seksual.
- source_word: ἐξελκόμενος
  choice: ketika ia diseret keluar
  rationale: Mempertahankan citra ditarik keluar dari tempat aman atau jalur yang benar serta nuansa pasif partisipel Yunani.
- source_word: καὶ δελεαζόμενος
  choice: dan dipikat
  rationale: Menyampaikan gambaran umpan yang memikat mangsa ke dalam perangkap secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sumber pencobaan dalam hubungannya dengan Allah
  choice: Pencobaan dikaitkan dengan keinginan orang itu sendiri, bukan dengan Allah.
  alternative: Memahami πειράζεται hanya sebagai mengalami ujian dari keadaan luar.
  rationale: Konteks langsung pada ayat 13 menyangkal bahwa Allah mencobai siapa pun, sedangkan ayat 14 menyebut keinginan pribadi sebagai sumber dekat pencobaan.
- issue: Bentuk tunggal representatif
  choice: Memakai “setiap orang” dan melanjutkannya dengan pronomina tunggal “-nya/ia”.
  alternative: Mengubahnya menjadi bentuk jamak demi bahasa yang lebih netral.
  rationale: Bentuk ini mempertahankan daya individualisasi konstruksi tunggal Yunani dan tetap alami serta inklusif dalam bahasa Indonesia.
- issue: Hubungan kedua partisipel dengan pencobaan
  choice: Memakai “ketika” tanpa menentukan secara ketat apakah tindakan itu sebab, cara, atau keadaan penyerta.
  alternative: Menerjemahkan secara eksplisit sebagai “karena” atau “dengan cara”.
  rationale: Partisipel Yunani memungkinkan hubungan yang tidak dinyatakan secara tegas; “ketika” menjaga keluwesan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Dicobai” dipilih sesuai konteks moral, sementara metafora penarikan dan pemikatan dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
