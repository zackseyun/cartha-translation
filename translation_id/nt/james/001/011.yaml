id: JAS.1.11
reference: James 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: id
  text: Sebab matahari terbit disertai panas yang menyengat[a], lalu mengeringkan rumput; bunganya gugur dan keelokan rupanya lenyap. Demikian juga orang kaya akan layu di tengah kegiatan-kegiatannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disertai angin panas yang menyengat.” Kata Yunani καύσων dapat menunjuk pada panas yang membakar dan, dalam konteks tertentu, pada angin panas yang menyertainya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam perjalanan-perjalanannya.” Kata Yunani πορεία dapat berarti perjalanan atau, secara lebih luas, rangkaian kegiatan dan usaha seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: terbit
  rationale: Bentuk aoristus menggambarkan peristiwa dalam ilustrasi secara ringkas; “terbit” merupakan ungkapan Indonesia yang wajar untuk matahari.
- source_word: σὺν τῷ καύσωνι
  choice: disertai panas yang menyengat
  rationale: καύσων dapat menunjuk pada panas yang membakar atau angin panas. Pilihan ini sesuai dengan matahari sebagai subjek sambil mempertahankan alternatif leksikal dalam catatan kaki.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: mengeringkan rumput
  rationale: ξηραίνω menggambarkan dampak konkret panas terhadap tumbuh-tumbuhan; “mengeringkan” tepat dan alami dalam bahasa Indonesia.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: bunganya gugur
  rationale: ἐκπίπτω berarti jatuh atau terlepas. Untuk bunga, “gugur” menyampaikan gambaran fisiknya secara alami.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: keelokan rupanya
  rationale: εὐπρέπεια menunjuk pada keelokan atau keindahan, sedangkan πρόσωπον di sini berarti tampilan luar. Ungkapan ini mempertahankan citra bunga tanpa personifikasi yang janggal.
- source_word: ἀπώλετο
  choice: lenyap
  rationale: Bentuk ini menyatakan hilang atau musnahnya keelokan; “lenyap” jelas dan sesuai dengan gambaran keindahan yang berlalu.
- source_word: ὁ πλούσιος
  choice: orang kaya
  rationale: Bahasa Indonesia tidak menandai gender pada frasa ini. “Orang kaya” secara alami menunjuk pada sosok tunggal yang mewakili golongannya tanpa mempersempit cakupan peringatan.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: di tengah segala kegiatannya
  rationale: πορεία secara harfiah dapat berarti perjalanan dan secara lebih luas rangkaian aktivitas atau usaha. Dalam konteks ini, “segala kegiatannya” menyampaikan arti luas tanpa membatasinya pada perjalanan harfiah.
- source_word: μαρανθήσεται
  choice: akan layu
  rationale: Bentuk futur ini meneruskan metafora tumbuh-tumbuhan dan menyatakan hasil yang akan terjadi; “akan layu” mempertahankan citra tersebut dengan ringkas.
theological_decisions:
- issue: Cakupan rujukan ὁ πλούσιος
  choice: orang kaya
  alternative: laki-laki kaya; si kaya
  rationale: Walaupun bentuk Yunani berjenis maskulin tunggal, bahasa Indonesia tidak memiliki pembedaan gender pada “orang”. Pilihan ini mempertahankan sosok tunggal yang representatif tanpa menambahkan penegasan gender yang tidak alami atau menyiratkan bahwa peringatan hanya berlaku bagi laki-laki.
- issue: Cakupan πορείαις dalam peringatan kepada orang kaya
  choice: segala kegiatannya
  alternative: perjalanan-perjalanannya; usaha-usahanya
  rationale: Istilah ini dapat menunjuk pada perjalanan harfiah ataupun haluan aktivitas seseorang. Terjemahan utama mempertahankan cakupan luas peringatan, sedangkan arti harfiahnya dicatat agar ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat namun mudah dipahami. Struktur sebab-akibat dan metafora rumput, bunga, serta kelayuan dipertahankan. Tanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
