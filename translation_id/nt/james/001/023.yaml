  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: id
  text: Sebab, jika seseorang adalah pendengar firman, tetapi bukan pelaku, ia seperti seorang laki-laki yang mengamati wajah alaminya[a] di dalam cermin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “wajah kelahirannya”; maksudnya dapat juga diungkapkan sebagai “wajah yang dibawanya sejak lahir.”'
    reason: Menjelaskan bentuk genitif Yunani yang tidak wajar jika diterjemahkan mentah-mentah, sambil mempertahankan kemungkinan nuansa ungkapan aslinya.
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: pendengar firman
  rationale: Mempertahankan bentuk nomina dan kaitan langsung dengan pasangan etisnya, ποιητής, sekaligus menerjemahkan λόγος secara konsisten sebagai “firman” dalam konteks ini.
- source_word: ποιητής
  choice: pelakunya
  rationale: Bentuk nomina “pelaku” mempertahankan kesejajaran pendengar–pelaku; akhiran -nya menjelaskan bahwa yang dilakukan adalah firman tersebut.
- source_word: ἔοικεν
  choice: ia seperti
  rationale: Mengungkapkan makna kini dari bentuk perfektum Yunani secara wajar dalam bahasa Indonesia.
- source_word: ἀνδρὶ
  choice: seorang laki-laki
  rationale: Mempertahankan unsur maskulin khusus pada ἀνήρ tanpa menghalangi fungsi perbandingan yang berlaku umum.
- source_word: κατανοοῦντι
  choice: yang memperhatikan
  rationale: “Memperhatikan” menyatakan pengamatan yang disengaja dan penuh perhatian, lebih kuat daripada sekadar “melihat”.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: wajah alaminya
  rationale: Ungkapan ini menyampaikan maksud idiomatis frasa Yunani—wajah asli yang dimiliki sejak lahir—dengan bahasa Indonesia yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἐν ἐσόπτρῳ
  choice: di dalam cermin
  rationale: Padanan baku dan jelas bagi gambaran melihat wajah pada sebuah cermin.
theological_decisions:
- issue: Bahasa representatif bergender dalam ἀνδρὶ
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Teks Yunani memakai nomina maskulin khusus ἀνήρ. Terjemahan mempertahankan bentuk tersebut tanpa menambahkan batasan teologis pada penerapan perbandingan.
- issue: Rujukan λόγος
  choice: firman
  alternative: perkataan atau pesan
  rationale: “Firman” mempertahankan hubungan dengan konteks dekat Yakobus 1 dan memungkinkan rujukan kepada firman Allah tanpa mempersempitnya lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kesejajaran nomina “pendengar” dan “pelaku” dipertahankan. Koma penutup mencerminkan bahwa perbandingan ini berlanjut pada ayat berikutnya.
