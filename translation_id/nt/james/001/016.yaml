id: JAS.1.16
reference: James 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: id
  text: Janganlah tertipu, saudara-saudaraku[a] yang terkasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara laki-laki”; kata Yunani ini dapat dipakai untuk menyapa sesama orang percaya secara kolektif, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Janganlah tertipu
  rationale: μή dengan imperatif kini menyatakan larangan, sedangkan bentuk pasif πλανᾶσθε dalam konteks ini memperingatkan pembaca agar tidak menerima pemahaman yang keliru. “Janganlah tertipu” alami dalam bahasa Indonesia dan mempertahankan daya pasifnya tanpa menambahkan nuansa aspek yang tidak pasti.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: ἀδελφοί secara bentuk adalah jamak maskulin dan dapat dipakai sebagai sapaan kolektif kepada sesama orang percaya. “Saudara-saudara” merupakan sapaan Indonesia yang wajar dan bermartabat; cakupan kolektifnya dijelaskan dalam catatan kaki.
- source_word: μου
  choice: -ku
  rationale: Pronomina posesif μου diungkapkan secara alami melalui enklitik “-ku”, yang mempertahankan kedekatan relasional dalam sapaan Yakobus.
- source_word: ἀγαπητοί
  choice: yang terkasih
  rationale: ἀγαπητοί adalah sapaan penuh kasih. “Yang terkasih” mempertahankan kehangatan dan bobot ungkapan itu dengan ragam bahasa Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Sapaan bergender kepada komunitas orang percaya
  choice: Memakai “saudara-saudara” dalam teks utama dan menjelaskan cakupan kolektifnya dalam catatan kaki.
  alternative: “saudara-saudara laki-laki dan perempuan” atau “saudara sekalian”
  rationale: Bentuk Yunani ἀδελφοί secara gramatikal maskulin jamak, tetapi dalam konteks ini kemungkinan besar menyapa seluruh komunitas orang percaya, termasuk perempuan. Pilihan utama tetap dekat dengan bentuk sumber tanpa mempersempit cakupannya, dan catatan kaki mempertahankan informasi gender serta fungsi representatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat pastoral yang hangat dan bermartabat. Partikel “-lah” menandai larangan secara wajar tanpa membuatnya terdengar kasar.
