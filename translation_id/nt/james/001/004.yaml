base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: id
  text: Biarlah ketekunan menjalankan pekerjaannya sampai tuntas[a], supaya kamu menjadi dewasa dan utuh, tanpa kekurangan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Biarlah ketekunan menyelesaikan pekerjaannya dengan sempurna.” Kata-kata Yunani yang dipakai berkaitan dengan tercapainya tujuan dan keadaan yang utuh dalam setiap bagian; karena itu “dewasa” juga dapat diterjemahkan “sempurna.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: ketekunan
  rationale: Kata ini menunjuk pada keteguhan untuk terus bertahan di tengah pencobaan atau ujian; “ketekunan” alami dalam bahasa Indonesia dan lebih aktif daripada sekadar “kesabaran”.
- source_word: ἔργον τέλειον
  choice: pekerjaannya sampai tuntas
  rationale: Ungkapan ini menggambarkan pekerjaan ketekunan yang mencapai maksud atau hasil akhirnya. Pilihan ini mempertahankan unsur “pekerjaan” dan makna penyelesaian tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: ἐχέτω
  choice: Biarlah ... menjalankan
  rationale: Bentuk imperatif orang ketiga dipertahankan dengan “Biarlah”; verba “menjalankan” membuat hubungan dengan “pekerjaannya” wajar dalam bahasa Indonesia.
- source_word: ἵνα ἦτε
  choice: supaya kamu menjadi
  rationale: Menyatakan tujuan atau hasil yang dimaksudkan, dengan bentuk Indonesia yang jelas dan alami.
- source_word: τέλειοι
  choice: dewasa
  rationale: Ketika dikenakan pada manusia dalam konteks ini, kata tersebut dapat menunjuk pada tercapainya kedewasaan atau maksud yang dituju, bukan harus berarti kesempurnaan tanpa dosa.
- source_word: ὁλόκληροι
  choice: utuh
  rationale: Menekankan keutuhan dalam seluruh bagian dan membedakannya dari gagasan kedewasaan pada τέλειοι.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: tanpa kekurangan apa pun
  rationale: Menyampaikan cakupan menyeluruh dari frasa Yunani secara idiomatis.
- source_word: δὲ
  choice: Biarlah
  rationale: Partikel δέ melanjutkan pemikiran ayat sebelumnya dan tidak memerlukan konjungsi pertentangan yang tegas dalam susunan Indonesia ini.
theological_decisions:
- issue: Makna τέλειος dalam konteks pertumbuhan rohani
  choice: dewasa
  alternative: sempurna
  rationale: “Dewasa” menyampaikan keadaan yang telah mencapai tujuan atau kematangan, tanpa memaksakan doktrin kesempurnaan tanpa dosa. Catatan kaki tetap membuka kemungkinan nuansa “sempurna” yang memang ada dalam kata Yunani.
- issue: Hubungan antara ketekunan dan hasil akhirnya
  choice: ketekunan menjalankan pekerjaannya sampai tuntas
  alternative: ketekunan menghasilkan pekerjaan yang sempurna
  rationale: Pilihan utama mempertahankan seruan agar proses ketekunan tidak dihentikan sebelum mencapai hasil yang dimaksudkan, sambil tidak menentukan secara berlebihan mekanisme teologis proses tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Biarlah” mempertahankan daya imperatif, sedangkan “sampai tuntas,” “dewasa,” dan “utuh” menyampaikan rangkaian gagasan Yunani secara alami tanpa meniadakan ambiguitas leksikalnya.
