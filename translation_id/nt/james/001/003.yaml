  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: id
  text: sebab kamu tahu bahwa pengujian imanmu[a] menghasilkan ketekunan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesejatian imanmu yang telah terbukti.” Istilah Yunani ini dapat menunjuk pada proses pengujian atau pada mutu yang terbukti melalui pengujian.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketabahan” atau “ketekunan yang teguh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: sebab kamu tahu
  rationale: 'Partisipel kini aktif ini berkaitan dengan perintah pada ayat 2 dan secara alami menyatakan alasan: mereka dapat menganggap berbagai pencobaan sebagai sukacita sebab mereka mengetahui hasil pengujian iman.'
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari apa yang diketahui; nuansa sebab sudah dinyatakan oleh “sebab kamu tahu”.
- source_word: τὸ δοκίμιον
  choice: ujian
  rationale: Istilah ini dapat menunjuk pada proses pengujian atau mutu yang terbukti melalui pengujian. “Ujian” alami dalam bahasa Indonesia dan sesuai dengan konteks berbagai pencobaan, sementara kemungkinan makna hasil tetap dicatat dalam catatan kaki.
- source_word: ὑμῶν τῆς πίστεως
  choice: terhadap imanmu
  rationale: Frasa genitif ini menyatakan bahwa iman para pembaca menjadi sasaran pengujian. Bentuk “imanmu” mempertahankan orang kedua jamak secara kolektif dalam bahasa Indonesia.
- source_word: κατεργάζεται
  choice: menghasilkan
  rationale: Verba ini menyatakan bahwa pengujian mendatangkan atau mengerjakan suatu hasil; “menghasilkan” jelas dan wajar.
- source_word: ὑπομονήν
  choice: ketekunan
  rationale: Istilah ini menunjuk pada daya bertahan yang teguh di tengah kesukaran. “Ketekunan” merupakan padanan Indonesia yang ringkas dan lazim, dengan alternatif semantis dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna πίστις
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam konteks ini, πίστις adalah iman para pembaca yang sedang diuji. “Iman” adalah padanan paling langsung dan tidak memaksakan arti “kesetiaan” yang tidak dituntut konteks.
- issue: Makna τὸ δοκίμιον
  choice: proses pengujian (“ujian”)
  alternative: kesejatian iman yang terbukti
  rationale: Konteks langsung tentang berbagai pencobaan mendukung proses pengujian, tetapi bentuk Yunani juga dapat menunjuk pada mutu yang terbukti. Ambiguitas yang nyata ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Kamu” dipakai sebagai bentuk orang kedua jamak kolektif yang alami; konteks surat menunjukkan bahwa sapaan ditujukan kepada komunitas. Struktur kausal dipertahankan agar hubungan dengan ayat 2 tetap jelas.
