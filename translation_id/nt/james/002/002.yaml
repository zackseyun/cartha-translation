  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: id
  text: Sebab, jika seorang laki-laki yang memakai cincin-cincin emas dan pakaian berkilau masuk ke dalam pertemuan kalian[a], lalu seorang laki-laki miskin dengan pakaian kotor juga masuk,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sinagoge kalian”; kata Yunani synagōgē dapat berarti “sinagoge” atau “pertemuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: pertemuan
  rationale: Dalam konteks ini kata tersebut menunjuk pada perhimpunan atau pertemuan para pembaca. “Pertemuan” alami dalam bahasa Indonesia dan tidak dengan sendirinya menyiratkan suatu lembaga Yahudi formal; arti harfiah alternatif dipertahankan dalam catatan kaki.
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Nomina Yunani ini secara eksplisit maskulin tunggal, sehingga jenis kelamin tokoh dalam ilustrasi dipertahankan.
- source_word: χρυσοδακτύλιος
  choice: yang memakai cincin-cincin emas
  rationale: Adjektiva ini secara harfiah menggambarkan jari yang dihiasi emas. Ungkapan Indonesia ini alami dan mempertahankan gambaran kekayaan yang mencolok; bentuk jamak tidak membatasi gambaran itu pada satu cincin.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: pakaian berkilau
  rationale: λαμπρός dapat menyatakan sesuatu yang terang, gemerlap, atau indah. “Berkilau” mempertahankan daya visual ungkapan Yunani sekaligus mengisyaratkan pakaian yang mengesankan.
- source_word: πτωχὸς
  choice: seorang laki-laki miskin
  rationale: Adjektiva maskulin tunggal ini dipakai sebagai nomina dan sejajar dengan ἀνήρ pada bagian pertama. Penambahan “laki-laki” membuat kesejajaran tersebut jelas dalam bahasa Indonesia.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: berpakaian kotor
  rationale: ῥυπαρός menyatakan pakaian yang kotor atau cemar. “Kotor” mempertahankan penilaian sosial yang kuat tanpa menggeser makna menjadi sekadar usang atau lusuh.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: masuk ... juga masuk
  rationale: Pengulangan “masuk” mempertahankan verba Yunani yang diulang dan struktur paralel skenario ini.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ilustrasi tersebut dengan larangan bersikap pilih kasih pada ayat sebelumnya dan menandai penjelasan.
theological_decisions:
- issue: Penerjemahan συναγωγή dalam konteks surat kepada komunitas pengikut Kristus
  choice: pertemuan
  alternative: sinagoge
  rationale: Ayat ini tidak menetapkan bentuk kelembagaan jemaat. “Pertemuan” menyampaikan fungsi kumpulan yang dimaksud tanpa memastikan bahwa tempat atau lembaganya adalah sinagoge formal, sedangkan padanan harfiahnya dicatat demi transparansi dan untuk mempertahankan kemungkinan latar Yahudi-Kristen awal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada bermartabat. Bentuk tunggal posesif pada ὑμῶν secara idiomatis diterjemahkan “pertemuanmu” sebagai sapaan kolektif. Koma akhir dipertahankan karena ayat ini merupakan anak kalimat bersyarat yang berlanjut ke ayat berikutnya.
