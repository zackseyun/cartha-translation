  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: id
  text: Bukankah mereka sendiri yang menghujat nama yang mulia, yang diserukan atas kamu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “nama yang terhormat” atau “nama yang luhur.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang disebut atas kamu” atau “yang dengannya kamu disebut.” Ungkapan ini menunjuk pada nama yang menjadi identitas orang percaya dan mungkin menggemakan bahasa perjanjian atau baptisan.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Bukankah mereka sendiri
  rationale: Pertanyaan retoris dengan οὐκ mengharapkan jawaban positif, sedangkan αὐτοὶ menegaskan bahwa justru orang-orang yang baru disebut itulah pelakunya.
- source_word: βλασφημοῦσιν
  choice: menghujat
  rationale: Kata ini dapat berarti memfitnah atau mencaci, tetapi karena objeknya adalah nama yang terkait dengan identitas umat percaya dan kemungkinan besar dengan Tuhan Yesus, 'menghujat' mempertahankan bobot religius serta unsur penghinaan.
- source_word: τὸ καλὸν ὄνομα
  choice: nama yang mulia
  rationale: καλός di sini menyatakan sesuatu yang terhormat, luhur, atau patut dihormati. 'Nama yang mulia' alami dalam bahasa Indonesia dan tidak membatasi rujukannya secara berlebihan.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: yang diserukan atas kamu
  rationale: Ungkapan ini secara harfiah menggambarkan suatu nama yang disebut atau diserukan atas seseorang. Terjemahan ini mempertahankan bentuk pasif dan citra idiom Yunani tanpa mengubahnya menjadi sekadar nama sebutan.
theological_decisions:
- issue: Rujukan 'nama yang mulia'
  choice: Dibiarkan sebagai rujukan luas kepada nama terhormat yang disandang umat percaya, kemungkinan besar nama Yesus/Tuhan.
  alternative: Menyebut secara eksplisit 'nama Kristus', 'nama Tuhan', atau menafsirkannya hanya sebagai identitas Kristen.
  rationale: Bahasa Yunani tidak menyebut Yesus secara eksplisit dalam ayat ini, meskipun Yakobus 2:1 memberi konteks kristologis yang kuat. Terjemahan utama mempertahankan ketidaktersuratan itu.
- issue: Makna nama yang 'diserukan atas' umat percaya
  choice: Mempertahankan ungkapan 'diserukan atas kamu'.
  alternative: Menguraikannya sebagai 'yang olehnya kamu disebut', atau secara khusus mengaitkannya dengan baptisan atau perjanjian.
  rationale: Ungkapan tersebut mungkin menggemakan bahasa kepemilikan perjanjian, penamaan, atau baptisan, tetapi ayat ini sendiri tidak menetapkan satu latar tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Bukankah' mempertahankan daya pertanyaan retoris; 'mereka sendiri' menjaga penekanan Yunani. Ungkapan yang agak tidak biasa 'diserukan atas kamu' sengaja dipertahankan untuk menjaga citra dan kemungkinan gema teologis teks sumber.
