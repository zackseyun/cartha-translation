  verdict: approve
  source_fidelity: Terjemahan mempertahankan pertanyaan retoris positif dari οὐκ, penegasan αὐτοὶ melalui “mereka sendiri,” dan makna kuat βλασφημοῦσιν melalui “menghujat.” “Nama yang mulia” secara tepat menyampaikan καλὸν ὄνομα tanpa menentukan secara berlebihan bahwa nama itu adalah Kristus. “Yang diserukan atas kamu” mempertahankan bentuk pasif dan citra idiomatis ἐπικληθὲν ἐφ’ ὑμᾶς, meskipun ungkapannya sengaja agak harfiah.
  naturalness: Bahasa ini baku, jelas, dan sesuai dengan register naskah suci modern. “Bukankah mereka sendiri” menyampaikan daya retoris dengan alami. Frasa “diserukan atas kamu” tidak sepenuhnya lazim dalam percakapan modern, tetapi dapat diterima dalam register Alkitab dan secara tepat mempertahankan ketakterbiasaan serta kemungkinan gema penamaan/perjanjian dalam bahasa sumber.
  terminology: “Menghujat” tepat bagi βλασφημοῦσιν dalam konteks nama yang terhormat dan kemungkinan terkait Tuhan/Yesus. “Nama yang mulia” adalah pilihan yang wajar bagi καλός; alternatif “terhormat” dan “luhur” telah disediakan. Catatan b dengan tepat tidak mengunci referensi pada baptisan atau perjanjian.
