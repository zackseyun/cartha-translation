  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: id
  text: Sebab, siapa pun yang menaati seluruh hukum tetapi tersandung dalam satu hal, ia bersalah terhadap seluruh hukum itu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gagal dalam satu hal” atau “melanggar satu bagiannya.” Bahasa Yunani memakai metafora “tersandung dalam satu hal” untuk kegagalan moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “bertanggung jawab terhadap seluruh hukum itu.” Maksud frasa ini ialah bahwa pelanggaran terhadap satu bagian membuat seseorang bertanggung jawab terhadap hukum sebagai suatu keseluruhan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: siapa pun yang
  rationale: Pronomina relatif tak tentu ini menyatakan prinsip umum dan mempertahankan cakupan universal teks.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: ὅλον τὸν νόμον
  choice: seluruh hukum
  rationale: Mengungkapkan totalitas hukum secara alami dan langsung dalam bahasa Indonesia.
- source_word: τηρήσῃ
  choice: menaati
  rationale: Dalam konteks perintah atau hukum, τηρέω berarti memelihara atau menjalankan; 'menaati' paling jelas bagi pembaca modern.
- source_word: πταίσῃ
  choice: tersandung
  rationale: Mempertahankan metafora Yunani tentang kegagalan moral tanpa langsung menggantinya dengan penafsiran yang lebih eksplisit.
- source_word: ἐν ἑνί
  choice: dalam satu hal
  rationale: Menunjukkan satu perkara atau satu bagian dari hukum tanpa menentukan perintah tertentu.
- source_word: γέγονεν
  choice: telah menjadi
  rationale: 'Mempertahankan nuansa perfektum Yunani: tindakan tersebut menghasilkan keadaan yang kini berlaku.'
- source_word: πάντων
  choice: terhadap seluruh hukum itu
  rationale: Acuannya dibuat jelas sebagai keseluruhan hukum yang telah disebut, bukan setiap pelanggaran secara terpisah.
- source_word: ἔνοχος
  choice: bersalah
  rationale: Menyampaikan pertanggungjawaban moral-legal secara alami; kemungkinan nuansa 'terkena tuntutan' dijelaskan dalam catatan.
theological_decisions:
- issue: Cakupan kesalahan dalam hubungannya dengan hukum
  choice: Melanggar satu bagian membuat seseorang bersalah terhadap hukum sebagai suatu keseluruhan.
  alternative: Setiap pelanggaran satu perintah sama persis dengan melakukan semua pelanggaran satu per satu.
  rationale: Frasa πάντων ἔνοχος menyatakan pertanggungjawaban terhadap keseluruhan, tetapi tidak dengan sendirinya mengatakan bahwa setiap dosa sama berat atau bahwa orang itu secara harfiah telah melakukan tiap pelanggaran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bernada bermartabat. Metafora 'tersandung' dipertahankan, sedangkan 'menaati' dipilih agar tindakan terhadap hukum mudah dipahami. Penanda catatan kaki [a] dan [b] ditempatkan dalam teks utama.
