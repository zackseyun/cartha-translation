source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: id
  text: Namun, kamu telah mempermalukan orang miskin itu.[a] Bukankah orang-orang kayalah yang menindas kamu, dan merekalah yang menyeret kamu ke pengadilan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang miskin itu”; secara lebih umum dapat dipahami sebagai “orang miskin.” Bentuk Yunaninya tunggal dan kemungkinan menunjuk kembali kepada orang miskin dalam contoh pada ayat-ayat sebelumnya, sambil mewakili orang miskin secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke lembaga-lembaga peradilan.” Kata Yunani ini merujuk kepada pengadilan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: telah mempermalukan
  rationale: Kata ini menyatakan perlakuan yang merendahkan kehormatan atau mendatangkan aib. 'Mempermalukan' mempertahankan dimensi hormat-malu dan terdengar alami dalam bahasa Indonesia.
- source_word: τὸν πτωχόν
  choice: orang miskin itu
  rationale: Bentuk tunggal dengan artikel menunjuk kembali kepada orang miskin dalam gambaran pada ayat-ayat sebelumnya, sekaligus dapat mewakili kaum miskin secara lebih luas.
- source_word: οἱ πλούσιοι
  choice: orang-orang kaya
  rationale: Adjektiva substantival ini merujuk kepada golongan orang kaya; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: καταδυναστεύουσιν
  choice: menindas
  rationale: Kata kerja ini menggambarkan penggunaan kuasa secara keras dan merugikan terhadap orang lain; 'menindas' mempertahankan kekuatan maknanya tanpa mempersempit cara penindasan.
- source_word: ἕλκουσιν
  choice: menyeret
  rationale: Kata ini menggambarkan tarikan yang kuat atau bersifat memaksa. 'Menyeret' mempertahankan gambaran hidup tentang tindakan paksa dalam perkara hukum.
- source_word: κριτήρια
  choice: pengadilan
  rationale: Dalam konteks ini kata tersebut merujuk kepada lembaga atau tempat peradilan. 'Pengadilan' merupakan padanan Indonesia modern yang jelas.
- source_word: καὶ αὐτοὶ
  choice: dan mereka sendiri yang
  rationale: Susunan ini mempertahankan penekanan bahwa orang-orang kaya itu sendirilah yang melakukan tindakan tersebut.
- source_word: οὐχ ... ;
  choice: Bukankah ...?
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif; 'Bukankah' menyampaikan daya retoris itu secara alami.
theological_decisions:
- issue: Rujukan bentuk tunggal τὸν πτωχόν
  choice: Orang miskin tertentu dalam gambaran pertemuan jemaat, yang juga mewakili orang miskin secara umum
  alternative: Kaum miskin secara kolektif
  rationale: Konteks Yakobus 2:2–3 baru saja menggambarkan seorang miskin tertentu. Bentuk tunggal dipertahankan agar alur wacana tetap jelas tanpa meniadakan penerapan yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk 'kamu' mempertahankan sapaan jamak Yunani secara wajar dalam bahasa Indonesia; konteks menunjukkan bahwa seluruh komunitas sedang disapa. Pertanyaan retoris dan penekanan pada 'mereka sendiri' dipertahankan.
