id: JAS.2.23
reference: James 2:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: id
  text: Dan digenapilah firman Kitab Suci yang mengatakan, “Abraham percaya kepada Allah, dan hal itu diperhitungkan kepadanya sebagai kebenaran,” dan ia disebut sahabat Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikreditkan” atau “diperhitungkan”; kata Yunani ini juga dapat diterjemahkan “dianggap.”
    reason: alternatif leksikal untuk ἐλογίσθη
lexical_decisions:
- source_word: ἐπληρώθη
  choice: genaplah
  rationale: Bentuk pasif πληρόω dalam rumusan pengutipan Kitab Suci menyatakan bahwa nas itu mencapai penggenapannya; ungkapan Indonesia ini alami dan tetap mempertahankan hubungan dengan tindakan Abraham dalam konteks.
- source_word: ἡ γραφή ἡ λέγουσα
  choice: nas yang mengatakan
  rationale: γραφή menunjuk pada Kitab Suci, tetapi dalam bentuk tunggal dan diikuti kutipan tertentu, “nas” secara alami menunjuk pada bagian Kitab Suci yang dikutip.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Abraham percaya kepada Allah
  rationale: Konstruksi πιστεύω dengan datif menyatakan bahwa Abraham memercayai Allah atau menerima firman-Nya sebagai benar. “Percaya kepada Allah” merupakan ungkapan Indonesia yang wajar tanpa menambahkan penafsiran lebih jauh.
- source_word: ἐλογίσθη αὐτῷ
  choice: hal itu diperhitungkan kepadanya
  rationale: Bentuk pasif λογίζομαι mempertahankan nuansa penilaian atau pembukuan; “hal itu” menjelaskan bahwa yang diperhitungkan ialah kepercayaan Abraham.
- source_word: εἰς δικαιοσύνην
  choice: sebagai kebenaran
  rationale: Dalam kutipan Kejadian ini, “sebagai kebenaran” mempertahankan fungsi predikatif εἰς dan istilah teologis δικαιοσύνη tanpa menggesernya menjadi keadilan sosial.
- source_word: φίλος θεοῦ
  choice: sahabat Allah
  rationale: Ungkapan ini menyampaikan hubungan yang dekat secara alami dalam bahasa Indonesia dan tidak mempersempit sifat konstruksi genitifnya.
- source_word: ἐκλήθη
  choice: disebut
  rationale: Padanan pasif yang langsung dan membiarkan terbuka apakah ini merupakan gelar, pengakuan, atau penamaan dalam tradisi Kitab Suci.
theological_decisions:
- issue: Hubungan iman dan perbuatan Abraham dalam alur argumentasi Yakobus
  choice: Memakai “genaplah” dan mempertahankan kutipan tentang iman yang diperhitungkan sebagai kebenaran.
  alternative: Menjelaskan secara eksplisit bahwa perbuatan menjadi dasar kebenaran, atau sebaliknya memisahkan iman sepenuhnya dari perbuatan.
  rationale: Ayat ini menghubungkan Kejadian 15:6 dengan ketaatan Abraham yang dibahas dalam konteks, tetapi tidak sendiri menyelesaikan seluruh perdebatan teologis tentang pembenaran.
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks Abraham dan pengutipan Kejadian 15:6, “kebenaran” adalah padanan Indonesia yang lazim dan sesuai; “keadilan” akan mengarahkan pembaca pada ranah makna yang kurang tepat di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dengan demikian” menghubungkan penggenapan nas dengan uraian sebelumnya tanpa memasukkan kata sambung ke dalam kutipan. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili secara memadai dalam teks.
