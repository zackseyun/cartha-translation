id: JAS.2.24
reference: James 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: id
  text: Kalian melihat bahwa seseorang dibenarkan berdasarkan perbuatan, dan bukan berdasarkan iman saja.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditunjukkan sebagai orang benar” atau “terbukti benar.” Rumusan Yakobus dipertahankan tanpa memutuskan perdebatan tafsir tentang hubungannya dengan penggunaan kata “membenarkan” oleh Paulus.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “iman” juga dapat berarti “kepercayaan” atau, dalam konteks tertentu, “kesetiaan”; “iman” adalah padanan utama di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Kalian melihat
  rationale: Bentuk kini aktif indikatif orang kedua jamak menyapa para pembaca berdasarkan contoh sebelumnya. “Kalian melihat” mempertahankan daya indikatif dan jelas menunjukkan bahwa subjeknya jamak.
- source_word: ἐξ ἔργων
  choice: berdasarkan perbuatan
  rationale: ἐξ dengan genitif menyatakan dasar atau sumber. “Berdasarkan perbuatan” alami dalam bahasa Indonesia dan tidak mempersempit ungkapan ini menjadi sekadar sarana.
- source_word: δικαιοῦται
  choice: dibenarkan
  rationale: δικαιόω dapat berarti membenarkan, menyatakan benar, atau menunjukkan bahwa seseorang benar. “Dibenarkan” mempertahankan bobot dan kesinambungan leksikal istilah Yunani tanpa menyelesaikan perdebatan tafsir dalam teks utama.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: Dalam konteks ini ἄνθρωπος dipakai secara umum bagi manusia, bukan khusus bagi laki-laki. “Seseorang” menyampaikan fungsi representatif tersebut secara wajar dalam bahasa Indonesia.
- source_word: πίστεως
  choice: iman
  rationale: “Iman” merupakan padanan baku πίστις dan paling tepat dalam pertentangan dengan perbuatan pada ayat ini.
- source_word: μόνον
  choice: saja
  rationale: “Iman saja” merupakan susunan Indonesia yang alami untuk menyampaikan pembatasan yang dinyatakan μόνον.
theological_decisions:
- issue: Makna δικαιοῦται dan hubungannya dengan teologi pembenaran
  choice: Memakai “dibenarkan” dalam teks utama
  alternative: “ditunjukkan sebagai orang benar” atau “terbukti benar”
  rationale: Pilihan ini membiarkan rumusan Yakobus tetap berdiri dan mempertahankan ketegangan dengan pemakaian istilah yang dapat dijumpai dalam tulisan Paulus, tanpa menyelaraskannya secara diam-diam. Kemungkinan nuansa demonstratif atau vindikatif dicatat dalam catatan kaki.
- issue: Cakupan ἄνθρωπος yang berbentuk tunggal maskulin
  choice: Menerjemahkan “seseorang”
  alternative: “seorang manusia” atau “seorang laki-laki”
  rationale: Di sini nomina itu bersifat generik dan mencakup manusia pada umumnya. Bahasa Indonesia tidak memerlukan bentuk maskulin untuk mempertahankan makna representatif tersebut.
- issue: Hubungan iman dan perbuatan
  choice: Mempertahankan pernyataan langsung “bukan berdasarkan iman saja”
  alternative: Menambahkan penjelasan seperti “iman yang hanya berupa pengakuan”
  rationale: Teks Yunani tidak memuat pembatas tambahan semacam itu. Terjemahan tidak boleh memasukkan penyelesaian teologis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kalian” dipakai untuk menyatakan orang kedua jamak secara jelas; “berdasarkan” menjaga hubungan argumentatif ἐκ tanpa bunyi yang terlalu teknis. Tidak diperlukan catatan tentang gender karena “seseorang” secara alami menyampaikan pemakaian generik ἄνθρωπος.
