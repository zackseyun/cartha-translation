  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: id
  text: Jika seorang saudara atau saudari tidak memiliki pakaian yang layak[a] dan kekurangan makanan sehari-hari,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telanjang”; istilah Yunani ini dapat berarti sama sekali tidak berpakaian, tetapi dalam konteks ini kemungkinan berarti tidak memiliki pakaian yang memadai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat atau pengandaian secara alami dalam bahasa Indonesia.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: seorang saudara atau saudari
  rationale: Mempertahankan pasangan maskulin-feminin yang dinyatakan secara eksplisit dalam teks Yunani serta bahasa kekeluargaan dalam komunitas orang percaya.
- source_word: γυμνοὶ ὑπάρχωσιν
  choice: tidak memiliki pakaian yang layak
  rationale: Dalam konteks kemelaratan yang juga mencakup kekurangan makanan, γυμνός kemungkinan menunjuk pada ketiadaan pakaian yang memadai, meskipun arti harfiahnya dapat berupa telanjang.
- source_word: λειπόμενοι
  choice: kekurangan
  rationale: Menyampaikan keadaan tidak mempunyai sesuatu yang dibutuhkan secara berkelanjutan dengan ungkapan Indonesia yang ringkas dan wajar.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: makanan sehari-hari
  rationale: Menyatakan makanan atau kebutuhan pangan untuk tiap hari secara alami tanpa menambahkan gagasan yang tidak tersurat.
theological_decisions:
- issue: Cakupan ἀδελφὸς ἢ ἀδελφή dalam komunitas Kristen
  choice: saudara atau saudari
  alternative: sesama manusia yang membutuhkan secara umum
  rationale: Bahasa kekeluargaan Yakobus kemungkinan merujuk kepada sesama orang percaya dalam konteks ini. Terjemahan mempertahankan bentuk teks tanpa mempersempit atau memperluas acuannya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya wajar dan bermartabat. Klausa dibiarkan terbuka dengan tanda koma karena ayat ini merupakan bagian awal dari kalimat bersyarat yang berlanjut pada ayat berikutnya.
