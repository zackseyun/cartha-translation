  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: id
  text: Sebab penghakiman akan berlangsung tanpa belas kasihan terhadap orang yang tidak menunjukkan belas kasihan; belas kasihan menang atas penghakiman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “belas kasihan bermegah atas penghakiman.” Kata kerja Yunaninya dapat berarti bermegah atau bersukacita karena unggul atas sesuatu; di sini diterjemahkan secara idiomatis sebagai “menang atas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: penghakiman
  rationale: Kata ini menunjuk pada tindakan atau proses penilaian ilahi/yudisial. “Penghakiman” mempertahankan daya forensiknya tanpa mempersempit makna menjadi “penghukuman”.
- source_word: ἀνέλεος
  choice: tanpa belas kasihan
  rationale: Ungkapan predikatif ini alami dalam bahasa Indonesia dan mempertahankan kaitan leksikal dengan ἔλεος, “belas kasihan”.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: atas orang yang tidak menunjukkan belas kasihan
  rationale: Frasa ποιέω dengan ἔλεος merupakan ungkapan yang berarti menunjukkan atau melakukan belas kasihan. “Berlaku atas orang” menyampaikan sasaran penghakiman secara wajar.
- source_word: κατακαυχᾶται
  choice: menang atas
  rationale: Verba ini secara harfiah dapat berarti bermegah atau berbangga terhadap/atas, tetapi dalam konteks ini menyatakan keunggulan atau kemenangan. “Menang atas” menyampaikan daya retorisnya dengan bahasa Indonesia yang jelas sambil mencatat citra harfiahnya dalam catatan kaki.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Padanan baku dan sesuai konteks, sekaligus mempertahankan pengulangan istilah yang membentuk kontras internal ayat.
theological_decisions:
- issue: Sifat klausa penutup κατακαυχᾶται ἔλεος κρίσεως
  choice: 'Pernyataan umum: “belas kasihan menang atas penghakiman.”'
  alternative: “Belas kasihan bermegah atas penghakiman,” atau belas kasihan yang ditunjukkan orang berbelas kasihan terbukti unggul dalam penghakiman.
  rationale: Klausa Yunani ringkas dan bersifat aforistis. Terjemahan ini mempertahankan ketegangan antara peringatan tentang penghakiman dan harapan dalam belas kasihan, tanpa menentukan apakah belas kasihan itu terutama belas kasihan Allah, belas kasihan yang bekerja dalam penghakiman, atau belas kasihan yang ditunjukkan manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “belas kasihan” serta “penghakiman” dipertahankan untuk mencerminkan struktur dan kontras teks Yunani.
