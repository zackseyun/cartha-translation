source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: id
  text: Bukankah Abraham, bapa kita, dibenarkan berdasarkan perbuatan ketika ia mempersembahkan Ishak, anaknya, di atas mezbah?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinyatakan benar” atau “terbukti benar.” Kata kerja Yunani yang dipakai dapat mengandung daya deklaratif ataupun demonstratif, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: bapak kita
  rationale: Mempertahankan metafora kekeluargaan dan identitas perjanjian dalam ungkapan Yunani, tanpa meratakannya menjadi sekadar 'leluhur kita'.
- source_word: ἐξ ἔργων
  choice: berdasarkan perbuatan
  rationale: ἐξ dengan genitif menyatakan dasar atau sumber; 'berdasarkan perbuatan' alami dalam bahasa Indonesia dan lebih jelas daripada terjemahan harfiah 'dari perbuatan'.
- source_word: ἐδικαιώθη
  choice: dibenarkan
  rationale: Mempertahankan kaitan leksikal dengan pembahasan tentang pembenaran serta ketegangan teologis teks, tanpa menetapkan apakah nuansanya terutama deklaratif atau demonstratif.
- source_word: ἀνενέγκας
  choice: ketika ia mempersembahkan
  rationale: Partisip aoris ini wajar dipahami secara temporal di sini, sedangkan 'mempersembahkan' menyampaikan konteks tindakan kurban.
- source_word: Ἰσαὰκ τὸν υἱὸν αὐτοῦ
  choice: Ishak, anaknya
  rationale: Mengikuti hubungan aposisional teks Yunani dalam susunan Indonesia yang alami.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: di atas mazbah
  rationale: '''Mazbah'' merupakan istilah baku dan ringkas untuk altar kurban dalam konteks Alkitab.'
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Bukankah ... dibenarkan ...?
  rationale: Mempertahankan pertanyaan retoris Yunani yang mengharapkan jawaban afirmatif dalam bentuk Indonesia yang alami.
theological_decisions:
- issue: Makna δικαιόω dalam Yakobus 2:21 sehubungan dengan perbuatan
  choice: dibenarkan
  alternative: dinyatakan benar; terbukti benar; dibuktikan benar
  rationale: Pilihan utama mempertahankan hubungan istilah dengan tema pembenaran dan tidak diam-diam menyelesaikan ketegangan antara daya deklaratif dan demonstratif verba Yunani. Kemungkinan nuansa lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bapak kita' mempertahankan bahasa kekerabatan; 'mazbah' dipilih sebagai istilah Alkitab yang masih jelas dan lazim. Struktur pertanyaan retoris dibuat alami tanpa mengurangi daya argumentatif ayat.
