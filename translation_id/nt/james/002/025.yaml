  terminology: “Dibenarkan” mempertahankan istilah kunci δικαιόω dan tidak memaksakan salah satu penafsiran teologis. “Pelacur” adalah padanan modern yang langsung untuk πόρνη. Penanda catatan kaki ditempatkan pada istilah yang relevan dan kedua catatan kaki sesuai dengan fungsi yang dinyatakan.
