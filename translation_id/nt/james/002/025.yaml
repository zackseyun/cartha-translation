source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: id
  text: Demikian juga, bukankah Rahab, pelacur itu, dibenarkan[a] oleh perbuatan-perbuatannya ketika ia menyambut para utusan[b] dan menyuruh mereka pergi melalui jalan lain?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinyatakan benar” atau “terbukti benar”. Teks Yunani memakai kata yang berarti “dibenarkan”; terjemahan ini mempertahankan istilah tersebut tanpa menentukan salah satu nuansa teologisnya di sini.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “utusan-utusan”. Dalam konteks ini yang dimaksud ialah orang-orang yang diterima Rahab (Yos. 2), bukan malaikat.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Demikian juga
  rationale: Ungkapan ini menghubungkan Rahab dengan Abraham sebagai contoh kedua yang sebanding. “Demikian juga” menyampaikan daya perbandingan dan tambahan secara alami dalam bahasa Indonesia.
- source_word: Ῥαὰβ ἡ πόρνη
  choice: Rahab, pelacur itu
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim. πόρνη secara langsung berarti perempuan yang menjadi pelacur; pilihan modern ini mempertahankan daya sosial dan moral istilah Yunani tanpa memakai kata “sundal” yang kini terasa arkais.
- source_word: οὐκ ἐξ ἔργων ἐδικαιώθη
  choice: bukankah ... dibenarkan oleh perbuatan-perbuatannya
  rationale: Bentuk pertanyaan Yunani mengharapkan jawaban positif dan diterjemahkan dengan “bukankah”. Bentuk pasif δικαιόω dipertahankan sebagai “dibenarkan” agar hubungan leksikal dan ketegangan dalam argumen Yakobus tidak dipersempit. Frasa ἐξ ἔργων menyatakan sarana atau dasar dan diterjemahkan secara ringkas sebagai “oleh perbuatan-perbuatannya”.
- source_word: ὑποδεξαμένη
  choice: ketika ia menyambut
  rationale: Partisip ini menunjuk pada penerimaan yang ramah. “Menyambut” lebih alami dan lebih tepat daripada sekadar “menerima”, sedangkan “ketika” mengungkapkan hubungan partisipialnya dengan lancar.
- source_word: τοὺς ἀγγέλους
  choice: para utusan
  rationale: ἄγγελος dapat berarti malaikat atau utusan. Dalam konteks kisah Rahab, yang dimaksud adalah manusia yang diutus, sehingga “para utusan” mempertahankan arti leksikal tanpa menggantinya dengan sebutan kontekstual yang lebih khusus, yaitu “mata-mata”.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: dan menyuruh mereka pergi melalui jalan lain
  rationale: Dalam konteks ini ἐκβάλλω berarti menyuruh atau mengantar keluar, bukan mengusir dengan paksa. ἑτέρᾳ ὁδῷ secara wajar diterjemahkan “melalui jalan lain”.
theological_decisions:
- issue: Makna δικαιόω dalam Yakobus 2:25 sehubungan dengan iman dan perbuatan
  choice: Mempertahankan “dibenarkan” dalam teks utama tanpa membatasinya pada pembenaran forensik awal ataupun pembuktian kebenaran seseorang di kemudian hari.
  alternative: “dinyatakan benar” atau “terbukti benar”
  rationale: Pernyataan Yakobus sengaja mempertahankan ketegangan antara pembenaran dan perbuatan. Terjemahan tidak sepatutnya menyelesaikan perdebatan teologis dengan memilih salah satu tafsiran melalui parafrasa. “Dibenarkan” menjaga hubungan langsung dengan istilah Yunani dan dengan argumen di sekitarnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan bernada luhur, tetapi tetap mudah dipahami. “Pelacur” dipilih daripada “sundal” karena lebih mutakhir dan langsung. Bentuk pertanyaan retoris serta ketegangan teologis istilah “dibenarkan” dipertahankan.
