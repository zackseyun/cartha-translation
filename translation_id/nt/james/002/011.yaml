  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: id
  text: Sebab Dia yang berkata, “Jangan berzina,” juga berkata, “Jangan membunuh.” Tetapi, jika kamu tidak berzina, tetapi membunuh, kamu telah menjadi pelanggar hukum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: Dia yang berkata
  rationale: Partisip berartikel ini berfungsi sebagai nomina dan menunjuk kepada pemberi perintah. Kapitalisasi “Dia” secara wajar menunjukkan Allah dalam konteks ini tanpa menambahkan nama “Allah” yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: Μὴ μοιχεύσῃς
  choice: Jangan berzina
  rationale: Larangan dengan μή dan subjungtif aoris menggemakan bunyi perintah. “Jangan berzina” merupakan ungkapan Indonesia yang alami, jelas, dan sepadan.
- source_word: καί
  choice: juga
  rationale: Kata ini menghubungkan perintah kedua dengan perintah pertama dari pembicara yang sama dan menegaskan pokok argumentasi Yakobus.
- source_word: Μὴ φονεύσῃς
  choice: Jangan membunuh
  rationale: φονεύω menunjuk pada tindakan membunuh manusia secara melawan hukum atau pembunuhan. Dalam kutipan Sepuluh Perintah, “Jangan membunuh” adalah bentuk Indonesia yang mapan dan tidak harus dipahami sebagai larangan atas segala tindakan menyebabkan kematian.
- source_word: εἰ δὲ
  choice: Jadi, jika
  rationale: δέ mengalihkan pembahasan kepada penerapan hipotesis. “Jadi, jika” menghasilkan alur argumentasi yang alami dalam bahasa Indonesia; nuansa kontras berikutnya dinyatakan oleh “tetapi”.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: kamu tidak berzina, tetapi membunuh
  rationale: Bentuk kini indikatif menyatakan contoh umum. Susunan ini mempertahankan kontras antara menaati satu perintah dan melanggar perintah lainnya.
- source_word: γέγονας
  choice: kamu telah menjadi
  rationale: 'Bentuk perfek γίνομαι menunjukkan perubahan yang menghasilkan keadaan yang tetap berlaku: orang itu telah menjadi dan kini berstatus sebagai pelanggar.'
- source_word: παραβάτης νόμου
  choice: pelanggar hukum
  rationale: παραβάτης adalah orang yang melampaui atau melanggar ketentuan. “Pelanggar hukum” alami dalam bahasa Indonesia dan mempertahankan lingkup hukum sebagai satu kesatuan, bukan hanya perintah tertentu.
- source_word: νόμου
  choice: hukum
  rationale: Bahasa Yunani tidak memakai artikel di sini. Dalam bahasa Indonesia, “hukum” secara alami dapat menunjuk kepada hukum Allah yang baru saja dicontohkan melalui kedua perintah tersebut tanpa memerlukan kata sandang.
theological_decisions:
- issue: Identitas pembicara yang memberikan perintah
  choice: “Dia yang berkata,” tanpa memperluasnya menjadi “Allah yang berkata”
  alternative: “Allah yang berkata” atau “Pribadi yang berkata”
  rationale: Konteks jelas menunjuk kepada Allah, tetapi teks Yunani hanya memakai partisip substantival, “yang berkata.” Pilihan ini mempertahankan rujukan personal dan tidak menambahkan subjek eksplisit yang tidak terdapat dalam teks.
- issue: Cakupan pelanggaran hukum dalam argumentasi Yakobus
  choice: “pelanggar hukum”
  alternative: “pelanggar perintah itu” atau “pelanggar bagian hukum tersebut”
  rationale: Yakobus menyatakan bahwa pelanggaran terhadap satu perintah membuat seseorang menjadi pelanggar hukum, bukan sekadar pelanggar satu bagian tertentu. Terjemahan ini mempertahankan kesatuan hukum dalam argumentasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan perintah dibuat ringkas dan familiar. “Dia” dikapitalisasi menurut kebiasaan bahasa Indonesia untuk rujukan kepada Allah, sementara struktur teks sumber tetap dipertahankan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas atau varian yang perlu dijelaskan bagi pembaca.
