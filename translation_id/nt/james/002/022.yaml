base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: id
  text: Kamu lihat bahwa iman[a] bekerja bersama dengan perbuatan-perbuatannya, dan melalui perbuatan-perbuatan itu iman disempurnakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaan” atau “kesetiaan” untuk kata Yunani πίστις.
    reason: lexical_alternative
  - marker: b
    text: Atau “dibuat sempurna” atau “dijadikan lengkap”; kata kerja Yunani ini dapat berarti mencapai tujuan atau kematangan yang dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Kamu melihat
  rationale: Mempertahankan bentuk orang kedua tunggal dan gaya sapaan langsung dalam argumen Yakobus.
- source_word: ἡ πίστις
  choice: iman
  rationale: Merupakan padanan baku yang paling sesuai dalam konteks pembahasan tentang iman Abraham, tanpa menutup kemungkinan nuansa kepercayaan atau kesetiaan.
- source_word: συνήργει
  choice: turut bekerja bersama
  rationale: Mempertahankan gagasan kerja bersama dalam συνεργέω serta nuansa tindakan yang sedang berlangsung dari bentuk imperfek.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: bersama perbuatan-perbuatannya
  rationale: Dativus sesudah συνεργέω secara alami menyatakan pihak yang bekerja bersama; 'perbuatan-perbuatan' jelas bagi pembaca modern dan tetap selaras dengan argumen Yakobus.
- source_word: ἐκ τῶν ἔργων
  choice: melalui perbuatan-perbuatan itu
  rationale: ἐκ di sini dapat menyatakan sarana atau sumber; 'melalui' menyampaikan peranan perbuatan tanpa menambahkan penjelasan teologis.
- source_word: ἐτελειώθη
  choice: disempurnakan
  rationale: Mempertahankan bentuk pasif dan gagasan bahwa iman mencapai kepenuhan atau tujuan yang dimaksudkan.
theological_decisions:
- issue: Hubungan iman dan perbuatan dalam argumen Yakobus
  choice: Iman turut bekerja bersama perbuatan, dan melalui perbuatan iman disempurnakan.
  alternative: Perbuatan hanya memperlihatkan iman kepada manusia; atau perbuatan membawa iman kepada kedewasaan sebagai ungkapannya yang perlu.
  rationale: Teks Yunani menyatakan kerja bersama dan penyempurnaan, tetapi tidak memberikan uraian teologi sistematis lengkap. Terjemahan membiarkan ketegangan itu tetap terbuka.
- issue: Makna πίστις dalam konteks teologis yang diperdebatkan
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: '''Iman'' paling sesuai dengan alur Yakobus 2 dan kosakata teologis Indonesia yang lazim, sedangkan kemungkinan nuansa lain dicatat tanpa dimasukkan secara sepihak ke dalam teks utama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' mempertahankan sapaan orang kedua tunggal. Pengulangan 'perbuatan-perbuatan' sengaja dipertahankan agar hubungan antarklausa dan penekanan teks Yunani tetap jelas.
