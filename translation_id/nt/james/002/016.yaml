  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: id
  text: dan seorang dari antara kalian berkata kepada mereka, “Pergilah dengan damai; hendaklah kalian tetap hangat dan kenyang,”[a] tetapi kalian tidak memberi mereka keperluan tubuh, apa gunanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “dihangatkan dan dikenyangkan.” Bentuk-bentuk Yunani ini dapat dipahami dalam arti pasif atau tengah.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: dan seorang dari antara kalian berkata
  rationale: Ungkapan ini memperkenalkan contoh hipotetis. “Seorang dari antara kalian” menyampaikan makna partitif secara alami, sedangkan δέ diterjemahkan “dan” agar kontras utama tetap jatuh pada klausa berikutnya.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Pergilah dengan damai
  rationale: Ini merupakan rumusan pelepasan atau berkat yang lazim; bentuk tersebut tetap alami dalam bahasa Indonesia dan mempertahankan daya ironisnya dalam konteks.
- source_word: θερμαίνεσθε
  choice: hangatkanlah diri
  rationale: Bentuk Yunani dapat dipahami dalam arti tengah atau pasif. Pilihan ini alami sebagai nasihat yang tidak disertai bantuan nyata, sementara kemungkinan pasif dicatat dalam catatan kaki.
- source_word: χορτάζεσθε
  choice: makanlah sampai kenyang
  rationale: Kata ini berarti menjadi kenyang atau dipuaskan, khususnya oleh makanan. Ungkapan Indonesia ini konkret dan sesuai dengan konteks kekurangan makanan, tanpa mengubah maksud retoris.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: tetapi kalian tidak memberi mereka
  rationale: δέ bersifat adversatif di sini, mempertentangkan ucapan saleh dengan kegagalan memberikan pertolongan jasmani.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: apa yang diperlukan tubuh
  rationale: ἐπιτήδεια menunjuk pada keperluan atau bekal yang dibutuhkan. Terjemahan ini jelas, alami, dan mempertahankan penekanan konkret pada kebutuhan tubuh.
- source_word: τί ὄφελος;
  choice: apa gunanya?
  rationale: Pertanyaan retoris ini menanyakan manfaat praktis; “apa gunanya?” adalah padanan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Nuansa diatesis θερμαίνεσθε dan χορτάζεσθε
  choice: Teks utama memakai nasihat idiomatis, “hangatkanlah diri dan makanlah sampai kenyang,” tanpa menjadikannya ajaran tentang kewajiban menolong diri sendiri.
  alternative: “Semoga kalian dihangatkan dan dikenyangkan” atau “jadilah hangat dan kenyang.”
  rationale: Bentuk-bentuk Yunani dapat dipahami secara tengah atau pasif. Pokok argumen Yakobus ialah sia-sianya ucapan tanpa bantuan material, bukan cara orang yang berkekurangan memperoleh kehangatan dan makanan. Catatan kaki mempertahankan ambiguitas bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina jamak “kalian” dipakai untuk membedakan pihak yang disapa dari orang-orang berkekurangan yang disebut “mereka”; kalimat dipertahankan sebagai satu rangkaian hipotetis sesuai struktur Yunani.
