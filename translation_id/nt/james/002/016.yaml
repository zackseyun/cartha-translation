  source_fidelity: Teks dengan tepat menyampaikan contoh hipotetis, ucapan pelepasan “Pergilah dengan damai,” kontras dengan tidak diberikannya kebutuhan jasmani, dan pertanyaan retoris penutup. Namun, “hangatkanlah diri dan makanlah sampai kenyang” memilih secara tegas pengertian refleksif/aktif bagi dua imperatif Yunani yang bentuknya dapat juga dipahami secara pasif atau tengah. Karena ketaksaan itu penting bagi daya retoris ayat dan diakui dalam audit Inggris, teks utama sebaiknya tidak menetapkan pelaku yang menghangatkan atau mengenyangkan mereka.
  naturalness: “Seorang dari antara kalian,” “Pergilah dengan damai,” dan “apa gunanya?” lazim dalam bahasa Indonesia modern. “Hendaklah kalian tetap hangat dan kenyang” mempertahankan nada ucapan/harapan dalam konteks tanpa terdengar seolah-olah orang miskin diperintah untuk mengusahakan sendiri pakaian dan makanan mereka. “Keperluan tubuh” juga lebih ringkas dan idiomatis daripada “apa yang diperlukan tubuh.”
  terminology: “Damai,” “keperluan tubuh,” dan “gunanya” sesuai dengan register modern yang bermartabat dan tidak menambahkan tafsiran teologis. Catatan kaki mempertahankan alternatif pasif dan tengah tanpa memaksakan salah satunya.
