id: JAS.2.5
reference: James 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: id
  text: Dengarkanlah, saudara-saudaraku yang terkasih.[a] Bukankah Allah telah memilih orang-orang yang miskin menurut ukuran dunia[b] untuk menjadi kaya dalam iman[c] dan menjadi ahli waris Kerajaan yang telah Dia janjikan kepada mereka yang mengasihi-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Saudara-saudara'' di sini dapat mencakup saudara laki-laki dan perempuan; bahasa Yunani memakai bentuk jamak yang secara harfiah berarti ''saudara-saudara laki-laki''.'
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan 'miskin dalam pandangan dunia' atau 'miskin dalam hal-hal duniawi'.
    reason: lexical_alternative
  - marker: c
    text: '''Iman'' dapat juga diterjemahkan ''kepercayaan'', atau—meski kurang mungkin di sini—''kesetiaan''.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Dengarkanlah
  rationale: Imperatif aoristus jamak ini menyerukan perhatian secara langsung; bentuk dengan -lah alami dan tegas dalam bahasa Indonesia.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: saudara-saudaraku yang terkasih
  rationale: Kata 'saudara-saudara' dapat mempertahankan bentuk sapaan komunal tanpa membatasi secara tegas pada laki-laki, sedangkan 'yang terkasih' mencerminkan ἀγαπητοί.
- source_word: ἐξελέξατο
  choice: telah memilih
  rationale: Padanan langsung dan lazim untuk tindakan pemilihan Allah, tanpa memasukkan sistem doktrinal yang lebih luas daripada maksud ayat ini.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: orang-orang yang miskin menurut ukuran dunia
  rationale: Dativus τῷ κόσμῳ menyatakan segi atau ukuran; ungkapan ini menyampaikan kemiskinan berdasarkan penilaian atau tatanan dunia dan menghindari kesan bahwa mereka sekadar berada di dunia.
- source_word: πλουσίους ἐν πίστει
  choice: kaya dalam iman
  rationale: Mempertahankan kontras antara kemiskinan duniawi dan kekayaan dalam iman; 'iman' adalah padanan paling wajar bagi πίστις dalam konteks ini.
- source_word: κληρονόμους τῆς βασιλείας
  choice: ahli waris Kerajaan
  rationale: '''Ahli waris'' mempertahankan gambaran hukum-kekeluargaan, sedangkan ''Kerajaan'' merujuk pada kerajaan Allah yang disebut secara definit dalam konteks teologis ayat.'
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: yang telah Dia janjikan kepada mereka yang mengasihi-Nya
  rationale: Menyampaikan klausa relatif dan penerima janji secara alami; partisipel kini menggambarkan mereka berdasarkan ciri yang berkelanjutan, yaitu mengasihi Allah.
theological_decisions:
- issue: Pemilihan oleh Allah
  choice: Menerjemahkan ἐξελέξατο secara sederhana sebagai 'telah memilih'.
  alternative: Memakai rumusan yang menonjolkan predestinasi atau suatu sistem doktrin pemilihan tertentu.
  rationale: Ayat ini menegaskan penilaian Allah atas orang miskin dalam argumen tentang sikap pilih kasih, tanpa menguraikan sistem soteriologis.
- issue: Cakupan ἀδελφοί
  choice: Menggunakan 'saudara-saudaraku' dan menjelaskan cakupan inklusifnya dalam catatan kaki.
  alternative: Membatasi sapaan kepada laki-laki saja atau memperluas teks utama secara eksplisit menjadi 'saudara-saudara laki-laki dan perempuan'.
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, tetapi dalam sapaan jemaat sangat mungkin mencakup seluruh komunitas percaya.
- issue: Makna πίστις
  choice: Menggunakan 'iman'.
  alternative: Kepercayaan atau kesetiaan.
  rationale: Dalam frasa 'kaya dalam iman', makna iman atau kepercayaan paling alami; kemungkinan leksikal lain dipertahankan dalam catatan tanpa menjadikannya bacaan utama.
- issue: Hubungan kemiskinan dan kekayaan rohani
  choice: Mempertahankan kontras bahwa orang yang miskin menurut ukuran dunia dipilih untuk menjadi kaya dalam iman.
  alternative: Menyatakan bahwa semua orang miskin dengan sendirinya kaya secara rohani.
  rationale: Teks berbicara tentang tindakan pemilihan Allah dan tidak mengajarkan bahwa kemiskinan material sendiri otomatis menghasilkan iman atau warisan Kerajaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Pertanyaan retoris dipertahankan melalui 'Bukankah'. Kapitalisasi 'Kerajaan' menandai rujukan pada kerajaan Allah, dan pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
