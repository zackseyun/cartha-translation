id: JAS.2.14
reference: James 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: id
  text: Apa gunanya, saudara-saudaraku[a], jika seseorang mengatakan bahwa ia memiliki iman[b], tetapi tidak memiliki perbuatan? Dapatkah iman itu[c] menyelamatkannya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara-saudari.” Bahasa Yunani memakai bentuk jamak maskulin “saudara-saudara” sebagai sapaan representatif kepada komunitas orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani πίστις juga dapat berarti “kepercayaan” atau, dalam konteks tertentu, “kesetiaan”; di sini “iman” paling sesuai karena yang dimaksud ialah iman yang dikatakan dimiliki seseorang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “iman seperti itu.” Secara harfiah bahasa Yunani berbunyi “iman itu”, yang menunjuk kembali kepada jenis iman yang baru disebutkan—iman yang dikatakan dimiliki tetapi tidak disertai perbuatan.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: Apa gunanya
  rationale: Ungkapan alami dalam bahasa Indonesia untuk pertanyaan retoris tentang manfaat atau hasil praktis.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Mempertahankan bentuk sapaan jamak maskulin dalam bahasa sumber; dalam konteks ini sapaan tersebut mencakup komunitas orang percaya.
- source_word: πίστιν
  choice: iman
  rationale: Padanan baku dan paling sesuai bagi πίστις dalam konteks pengakuan bahwa seseorang memiliki iman; kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: λέγῃ τις ἔχειν
  choice: jika seseorang mengatakan bahwa ia memiliki
  rationale: Mengikuti susunan dan sifat pernyataan dalam bahasa Yunani tanpa memperkuatnya secara interpretatif menjadi 'mengaku memiliki'.
- source_word: ἔργα
  choice: perbuatan
  rationale: Padanan lazim yang mempertahankan kaitan leksikal dan kontras teologis antara iman dan perbuatan dalam Yakobus 2.
- source_word: μὴ ἔχῃ
  choice: tidak memiliki
  rationale: Menyampaikan negasi kepemilikan secara langsung dan wajar.
- source_word: μὴ δύναται
  choice: Dapatkah ...?
  rationale: Mempertahankan bentuk pertanyaan retoris; μή menunjukkan bahwa jawaban negatif diharapkan, tanpa perlu menambah kata penyangkalan ke dalam teks.
- source_word: ἡ πίστις
  choice: iman itu
  rationale: Kata penunjuk 'itu' menyampaikan fungsi anaforis artikel Yunani, yaitu menunjuk kembali kepada iman yang dikatakan dimiliki tetapi tidak disertai perbuatan.
- source_word: σῶσαι αὐτόν
  choice: menyelamatkan dia
  rationale: '''Menyelamatkan'' mempertahankan bobot makna soteriologis σῴζω, sedangkan ''dia'' mencerminkan pronomina tunggal maskulin sumber.'
theological_decisions:
- issue: Hubungan iman dan perbuatan dalam pertanyaan retoris
  choice: Menerjemahkan ἡ πίστις sebagai 'iman itu', yang menunjuk kembali kepada iman yang dikatakan dimiliki tetapi tidak disertai perbuatan.
  alternative: '''iman tersebut'', ''iman seperti itu'', atau secara harfiah ''iman itu''; penerjemahan umum ''iman'' dapat terdengar seolah-olah menyangkal kemampuan iman dalam arti apa pun untuk menyelamatkan.'
  rationale: Pilihan ini mempertahankan ketegangan argumen Yakobus tanpa memasukkan penyelesaian doktrinal dari luar teks.
- issue: Cakupan sapaan maskulin dan pronomina tunggal
  choice: Memakai 'saudara-saudaraku' dan 'dia' dalam teks utama, sambil menjelaskan cakupan komunitas dalam catatan kaki.
  alternative: '''saudara-saudari yang kukasihi'' dan bentuk netral atau jamak.'
  rationale: Ini mengikuti bentuk gramatikal sumber sekaligus mengakui bahwa sapaan tersebut digunakan secara representatif bagi komunitas orang percaya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur pertanyaan retoris dipertahankan, sementara ungkapan dibuat alami bagi pembaca umum. Istilah teologis utama 'iman', 'perbuatan', dan 'menyelamatkan' dipertahankan secara konsisten.
