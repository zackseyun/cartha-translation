id: JAS.2.18
reference: James 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: id
  text: Namun, seseorang akan berkata[a], “Kamu mempunyai iman, sedangkan aku mempunyai perbuatan.” Tunjukkanlah kepadaku imanmu[b] tanpa perbuatan[c] dan aku akan menunjukkan kepadamu imanku melalui perbuatan-perbuatanku.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naskah Yunani kuno tidak memakai tanda petik modern. Karena itu, batas perkataan orang yang mengajukan keberatan tidak sepenuhnya pasti; sebagian orang memahami bagian sesudahnya juga sebagai perkataannya.
    reason: punctuation_ambiguity
  - marker: b
    text: Yunani pistis; dapat juga berarti “kepercayaan” atau, dalam konteks tertentu, “kesetiaan.”
    reason: alternative_reading
  - marker: c
    text: Atau “terpisah dari perbuatan.” Kata Yunani yang dipakai dapat menyatakan “tanpa” atau “terpisah dari.”
    reason: lexical_alternative
  - marker: d
    text: Secara lebih harfiah, “dari perbuatan-perbuatanku.” Kata depan Yunani dapat menunjukkan sumber, dasar, atau sarana; “melalui” menyatakan bahwa perbuatan membuat iman terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: Namun
  rationale: Menandai peralihan yang bersifat kontras atau sanggahan dalam alur argumentasi Yakobus dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἐρεῖ τις
  choice: seseorang akan berkata
  rationale: Mempertahankan bentuk futurum dan gaya dialog dengan lawan bicara hipotetis.
- source_word: πίστιν
  choice: iman
  rationale: Padanan baku yang mempertahankan ketegangan antara pengakuan iman dan perbuatan yang memperlihatkannya, tanpa menafsirkannya terlebih dahulu sebagai kesetiaan.
- source_word: ἔργα
  choice: perbuatan
  rationale: Menyampaikan tindakan nyata serta menjaga hubungan istilah ini dengan pembahasan iman dan perbuatan di seluruh perikop.
- source_word: δεῖξόν μοι
  choice: Tunjukkanlah kepadaku
  rationale: Imperatif langsung ini meminta pembuktian yang dapat dilihat; 'tunjukkanlah' alami sekaligus dekat dengan bentuk sumber.
- source_word: χωρὶς τῶν ἔργων
  choice: tanpa perbuatan
  rationale: χωρίς menyatakan keterpisahan atau ketiadaan; ungkapan ini ringkas dan alami dalam bahasa Indonesia.
- source_word: κἀγώ σοι δείξω
  choice: dan aku akan menunjukkan kepadamu
  rationale: Menjaga kesejajaran retoris dengan perintah sebelumnya dan mempertahankan bentuk futurum.
- source_word: ἐκ τῶν ἔργων μου
  choice: melalui perbuatan-perbuatanku
  rationale: ἐκ dapat menyatakan sumber atau dasar pembuktian; 'melalui' secara alami menyampaikan bahwa perbuatan menjadi sarana iman terlihat, sedangkan bentuk ulang menandai berbagai tindakan milik pembicara.
theological_decisions:
- issue: Makna πίστις dalam perdebatan tentang iman dan perbuatan
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: ‘Iman’ mempertahankan istilah utama dalam argumen Yakobus dan tidak menyelesaikan lebih dahulu apakah yang ditekankan ialah kepercayaan, pengakuan iman, atau kesetiaan.
- issue: Batas perkataan lawan bicara hipotetis
  choice: Kutipan langsung dibatasi pada ‘Kamu mempunyai iman, sedangkan aku mempunyai perbuatan.’
  alternative: Seluruh sisa ayat dapat dipahami sebagai perkataan lawan bicara
  rationale: Naskah Yunani kuno tidak memakai tanda petik modern, sehingga batas kutipan harus ditentukan dari alur argumentasi. Pembatasan setelah klausa pertama menghasilkan dialog yang masuk akal, tetapi alternatifnya tetap dicatat karena memengaruhi cara argumen dibaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang langsung. ‘Kamu’ dan ‘aku’ dipakai karena percakapan ini bersifat hipotetis dan kontras, sementara ‘tunjukkanlah’ menjaga wibawa tanpa terdengar kuno. Istilah ‘iman’ dan ‘perbuatan’ dipertahankan secara konsisten untuk menjaga hubungan konseptual dalam perikop.
