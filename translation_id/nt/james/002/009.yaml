base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: id
  text: Tetapi jika kamu memperlakukan orang dengan pilih kasih[a], kamu berbuat dosa dan dinyatakan bersalah oleh hukum sebagai pelanggar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menunjukkan sikap memihak” atau “bersikap pilih kasih.” Kata Yunani ini menunjuk pada tindakan menilai atau memperlakukan orang berdasarkan kedudukan atau penampilan lahiriah.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai orang yang melanggar hukum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Tetapi jika
  rationale: εἰ menyatakan syarat, sedangkan δέ menghubungkan kalimat ini dengan argumen sebelumnya melalui pertentangan ringan. “Tetapi jika” mempertahankan kedua unsur itu secara alami.
- source_word: προσωπολημπτεῖτε
  choice: kamu membeda-bedakan orang
  rationale: Kata kerja ini berarti memperlakukan orang secara tidak setara berdasarkan kedudukan atau penampilan lahiriah. Ungkapan ini alami dalam bahasa Indonesia dan tetap menampilkan tindakan yang dikecam.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: kamu berbuat dosa
  rationale: Secara harfiah berarti melakukan atau mengerjakan dosa. “Berbuat dosa” merupakan padanan idiomatis, langsung, dan sesuai dengan aspek tindakan yang sedang menjadi kebiasaan atau kenyataan.
- source_word: ἐλεγχόμενοι
  choice: dinyatakan bersalah
  rationale: Partisip pasif ini menggambarkan kesalahan yang disingkapkan, dibuktikan, atau ditegur. Dalam konteks hukum dan pelanggar, “dinyatakan bersalah” mempertahankan nuansa yuridis tanpa harus mengandaikan proses pengadilan formal.
- source_word: ὑπὸ τοῦ νόμου
  choice: oleh hukum
  rationale: Frasa ini menyatakan hukum sebagai pelaku yang membuktikan kesalahan. Huruf kecil dipakai karena teks Yunani tidak mengharuskan pembatasan kepada suatu pengertian teologis tertentu.
- source_word: ὡς παραβάται
  choice: sebagai pelanggar
  rationale: παραβάται menunjuk kepada orang yang melampaui batas atau melanggar ketentuan. “Pelanggar” mempertahankan ragam yuridis dan tidak mengulang kata “hukum” yang tidak terdapat dalam nomina Yunani tersebut.
theological_decisions:
- issue: Cakupan νόμος dalam argumen etis Yakobus
  choice: hukum
  alternative: Hukum Taurat; hukum Allah
  rationale: Ayat ini menampilkan hukum sebagai patokan yang menyatakan sikap membeda-bedakan orang sebagai dosa. Terjemahan tidak mempersempitnya secara eksplisit menjadi Hukum Musa ataupun memperluasnya dengan menambahkan “Allah”, sehingga ketegangan dan cakupan teks tetap terpelihara.
- issue: Daya kerja ἐλεγχόμενοι
  choice: dinyatakan bersalah oleh hukum
  alternative: ditegur oleh hukum; disingkapkan kesalahannya oleh hukum
  rationale: Pilihan utama cocok dengan konteks pelanggaran, tetapi tidak dimaksudkan untuk menetapkan suatu doktrin khusus mengenai penghakiman atau pembenaran; fokusnya ialah hukum membuktikan kesalahan pelaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kamu” sesuai dengan bentuk jamak orang kedua dalam konteks surat dan mudah dipahami pembaca umum. Susunan klausa dibuat alami tanpa menghilangkan hubungan syarat, kesalahan, hukum, dan status sebagai pelanggar.
