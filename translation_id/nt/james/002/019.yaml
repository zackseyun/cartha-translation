id: JAS.2.19
reference: James 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: id
  text: Engkau percaya bahwa Allah itu esa[a]; engkau berbuat baik. Bahkan roh-roh jahat pun percaya dan gemetar ketakutan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ada satu Allah.” Bahasa Yunani dapat diterjemahkan dengan kedua cara tersebut. “Allah itu esa” lebih dekat dengan susunan bahasa Yunani dan mungkin menggemakan pengakuan monoteistis Yahudi.
    reason: alternative_reading
  - marker: b
    text: Atau, “gemetar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Engkau
  rationale: Pronomina eksplisit Yunani memberi penekanan pada orang kedua tunggal. “Engkau” mempertahankan sapaan langsung dan bernada bermartabat tanpa menambahkan unsur refleksif.
- source_word: πιστεύεις
  choice: percaya
  rationale: Kata ini diikuti klausa isi dengan ὅτι, sehingga “percaya” paling alami dan mempertahankan fokus pada pengakuan yang dianggap benar, bukan memperluasnya menjadi kepercayaan pribadi.
- source_word: ὅτι
  choice: bahwa
  rationale: Menandai isi kepercayaan secara wajar dalam bahasa Indonesia.
- source_word: εἷς ἐστιν ὁ θεός
  choice: Allah itu esa
  rationale: Mengikuti bentuk predikatif Yunani dan mempertahankan kemungkinan gema pengakuan monoteistis Yahudi. “Itu” berfungsi sebagai penanda topik/predikasi, bukan penunjuk jarak.
- source_word: καλῶς ποιεῖς
  choice: Itu baik
  rationale: Ungkapan ringkas ini menyampaikan pengakuan terbatas Yakobus tanpa bahasa yang terlalu harfiah atau terlalu percakapan. Konteks berikutnya menjaga nada retoris yang tajam.
- source_word: καὶ
  choice: Bahkan … pun
  rationale: 'Pasangan “bahkan … pun” menyampaikan daya ascensif καί: roh-roh jahat juga memiliki tingkat kepercayaan tersebut.'
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: Padanan Indonesia yang alami dan mudah dipahami untuk makhluk roh jahat yang dimaksud δαιμόνια; tidak dimaksudkan sebagai uraian tambahan tentang sifatnya.
- source_word: πιστεύουσιν
  choice: percaya
  rationale: 'Pengulangan “percaya” dipertahankan karena penting bagi argumen: pengakuan yang benar secara doktrinal juga terdapat pada roh-roh jahat.'
- source_word: φρίσσουσιν
  choice: gemetar ketakutan
  rationale: Menangkap reaksi fisik penuh rasa takut yang kuat dalam φρίσσω dengan bahasa Indonesia masa kini; “gemetar” saja dapat terdengar kurang jelas sebabnya.
theological_decisions:
- issue: Bentuk pengakuan monoteistis εἷς ἐστιν ὁ θεός
  choice: Allah itu esa
  alternative: hanya ada satu Allah
  rationale: Pilihan utama mempertahankan predikasi “Allah ... esa” dan kemungkinan gema pengakuan iman Israel, sedangkan alternatif mengubah titik berat menjadi pernyataan eksistensial. Catatan kaki menjaga ambiguitas sintaksis yang sah.
- issue: Kontras antara kepercayaan manusia dan kepercayaan roh-roh jahat
  choice: Bahkan roh-roh jahat pun percaya—dan mereka gemetar ketakutan
  alternative: Roh-roh jahat juga percaya dan gemetar
  rationale: “Bahkan … pun” menampilkan daya retoris καί, sedangkan tanda pisah menajamkan akibatnya tanpa menambah isi. Terjemahan mempertahankan ketegangan bahwa persetujuan terhadap pengakuan yang benar, jika berdiri sendiri, juga dimiliki roh-roh jahat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “Engkau” mempertahankan kelangsungan retoris. Pengulangan “percaya” sengaja dipertahankan. Hanya satu catatan kaki digunakan karena alternatif leksikal untuk φρίσσουσιν sudah diungkapkan secara jelas dalam teks utama.
