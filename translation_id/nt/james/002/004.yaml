translation:
  language: id
  text: Bukankah kamu telah membeda-bedakan orang di antara kamu[a] dan telah menjadi hakim dengan pertimbangan jahat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat pembedaan di antara kamu.” Kata kerja ini juga dapat berarti “terpecah” atau, dalam konteks lain, “bimbang”; tetapi di sini konteks mendukung arti membeda-bedakan orang secara diskriminatif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para hakim dari pertimbangan-pertimbangan jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: telah membeda-bedakan orang
  rationale: Dalam konteks perlakuan istimewa terhadap orang kaya dan perlakuan rendah terhadap orang miskin (2:1–3), kata ini paling wajar dipahami sebagai tindakan membuat pembedaan yang diskriminatif. Kata “orang” dibuat tersurat dalam bahasa Indonesia agar verba “membeda-bedakan” alami dan objek sosialnya jelas.
- source_word: ἐν ἑαυτοῖς
  choice: di antara kamu
  rationale: Frasa ini dapat menunjuk pada keadaan batin atau hubungan dalam komunitas. Konteks pertemuan jemaat mendukung arti komunal, yaitu pembedaan yang dilakukan di tengah-tengah mereka.
- source_word: ἐγένεσθε
  choice: menjadi
  rationale: 'Kata ini menyatakan hasil tindakan sebelumnya: dengan membeda-bedakan orang, mereka menjadi hakim dengan pertimbangan jahat.'
- source_word: κριταὶ
  choice: hakim
  rationale: Padanan langsung yang mempertahankan daya teguran moral dan yudisial dalam teks.
- source_word: διαλογισμῶν πονηρῶν
  choice: dengan pertimbangan-pertimbangan jahat
  rationale: διαλογισμός dapat berarti pikiran, pertimbangan, atau penalaran. “Pertimbangan-pertimbangan” sesuai dengan gambaran orang yang bertindak sebagai hakim, sementara kata depan “dengan” menyampaikan secara alami bahwa penghakiman mereka dicirikan oleh pertimbangan jahat.
- source_word: οὐ
  choice: Bukankah
  rationale: Bentuk pertanyaan retoris Yunani mengharapkan jawaban mengiyakan. “Bukankah” mempertahankan nada teguran tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti διακρίνω dalam kaitannya dengan sikap memihak
  choice: Ayat ini menegur tindakan membeda-bedakan orang secara diskriminatif dalam komunitas orang percaya.
  alternative: Ayat ini berbicara tentang kebimbangan atau keterpecahan batin.
  rationale: Konteks langsung Yakobus 2:1–3 membahas perlakuan berbeda terhadap orang kaya dan orang miskin. Karena itu, arti sosial “membeda-bedakan” lebih sesuai daripada arti “bimbang” yang muncul dalam konteks lain, tanpa menghapus kemungkinan nuansa keterpecahan yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang lugas dan bermartabat. Bentuk “kamu” dipakai sebagai sapaan jamak yang ditentukan oleh konteks komunitas. Pengulangan “pertimbangan-pertimbangan” mempertahankan bentuk jamak sumber dan hubungan semantis dengan tindakan menghakimi.
