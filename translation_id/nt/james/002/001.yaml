  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: id
  text: Saudara-saudaraku[a], janganlah kalian berpegang pada iman kepada Tuhan kita, Yesus Sang Mesias yang mulia[b], sambil berlaku pilih kasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani secara harfiah berbentuk maskulin, “saudara-saudaraku,” tetapi dalam konteks ini kemungkinan ditujukan kepada seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Tuhan kita, Yesus Sang Mesias, Tuhan kemuliaan.” Frasa Yunani dapat dipahami dengan lebih dari satu cara. Selain itu, “iman kepada Tuhan kita” dapat diterjemahkan lebih formal sebagai “iman Tuhan kita,” tetapi dalam bahasa Indonesia ungkapan itu mudah dipahami sebagai iman yang dimiliki oleh Tuhan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Saudara-saudaraku
  rationale: Sapaan maskulin jamak dipertahankan secara wajar dalam bahasa Indonesia; dalam konteksnya sapaan ini ditujukan kepada komunitas orang percaya secara luas, yang dijelaskan dalam catatan kaki.
- source_word: μὴ ... ἔχετε
  choice: janganlah kalian memegang
  rationale: Larangan dengan μή dan imperatif kini diterjemahkan sebagai larangan langsung. 'Memegang iman' mempertahankan hubungan dengan πίστιν dan menyatakan pengakuan atau penghayatan iman.
- source_word: ἐν προσωπολημψίαις
  choice: dengan sikap pilih kasih
  rationale: Ungkapan ini menyampaikan keberpihakan berdasarkan kedudukan atau penampilan orang. Bentuk jamak Yunani diungkapkan secara idiomatis sebagai suatu sikap atau praktik.
- source_word: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: iman kepada Tuhan kita Yesus, Sang Mesias
  rationale: Dalam bahasa Indonesia, 'iman kepada' adalah padanan alami bagi relasi objektif yang paling mungkin antara πίστις dan genitif berikutnya. Χριστός dipertahankan sebagai gelar melalui 'Sang Mesias'.
- source_word: τῆς δόξης
  choice: yang mulia
  rationale: Genitif kualitas δόξης diterjemahkan secara alami sebagai sifat 'yang mulia' dan dihubungkan dengan Tuhan Yesus Sang Mesias, tanpa menambahkan kata 'Tuhan' kedua yang tidak eksplisit dalam teks.
theological_decisions:
- issue: Relasi genitif dalam τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: iman kepada Tuhan kita Yesus, Sang Mesias
  alternative: iman Tuhan kita Yesus, Sang Mesias
  rationale: Konstruksi Yunani dapat dibaca dengan lebih dari satu relasi genitif. Terjemahan utama memakai relasi objektif yang alami dan sesuai dengan larangan mempraktikkan iman sambil pilih kasih; alternatif harfiah dalam bahasa Indonesia terlalu mudah disalahpahami sebagai iman yang dimiliki atau dijalankan oleh Yesus.
- issue: Hubungan τῆς δόξης
  choice: Sang Mesias yang mulia
  alternative: Tuhan kemuliaan
  rationale: Genitif kualitas dapat menerangkan Tuhan Yesus sebagai yang mulia. 'Tuhan kemuliaan' merupakan ungkapan alkitabiah yang mungkin, tetapi secara sintaksis lebih interpretatif karena mengandaikan atau mengulangi sebutan 'Tuhan'.
- issue: Cakupan sapaan Ἀδελφοί
  choice: Saudara-saudaraku
  alternative: Saudara-saudaraku, laki-laki dan perempuan
  rationale: Bentuk maskulin Yunani dipertahankan dalam teks utama, sedangkan cakupannya yang kemungkinan meliputi seluruh jemaat dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan mudah dipahami. 'Janganlah kalian' mempertahankan sapaan langsung jamak; 'pilih kasih' dipilih karena lebih alami bagi pembaca umum daripada 'memandang muka' atau 'keberpihakan'.
