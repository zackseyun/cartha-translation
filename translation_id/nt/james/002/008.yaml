source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: id
  text: Namun, jika kamu melaksanakan hukum rajawi[a] sesuai dengan Kitab Suci, “Kasihilah sesamamu seperti dirimu sendiri,” kamu berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani ini berarti “rajawi” dan dapat menunjuk pada hukum yang berkaitan dengan Raja, dengan kerajaan-Nya, atau yang memiliki kedudukan utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Namun, jika ... sungguh-sungguh
  rationale: εἰ mempertahankan bentuk bersyarat, sedangkan μέντοι memberi nuansa penegasan sekaligus peralihan atau kontras ringan. Susunan ini alami dalam bahasa Indonesia dan tidak mengubah syarat menjadi pernyataan pasti.
- source_word: νόμον ... βασιλικὸν
  choice: hukum kerajaan
  rationale: βασιλικός berarti berkaitan dengan raja atau bersifat rajawi. 'Hukum kerajaan' cukup alami dalam bahasa Indonesia serta tetap membuka kemungkinan bahwa hukum itu berasal dari Raja, terkait dengan kerajaan-Nya, atau berkedudukan utama.
- source_word: τελεῖτε
  choice: melaksanakan
  rationale: τελέω di sini menyatakan menjalankan atau memenuhi tuntutan hukum. 'Melaksanakan' menyampaikan tindakan nyata tanpa menyiratkan kesempurnaan yang tidak dinyatakan secara eksplisit.
- source_word: κατὰ τὴν γραφήν
  choice: sesuai dengan Kitab Suci
  rationale: Frasa ini berarti selaras dengan apa yang tertulis dalam Kitab Suci. Bentuk tunggal dengan artikel merujuk pada nas Kitab Suci yang kemudian dikutip.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk futurum Yunani dalam kutipan Imamat 19:18 berfungsi sebagai perintah. Imperatif Indonesia menyampaikan daya perintah secara alami dan jelas.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: '''Sesamamu'' adalah padanan etis-biblis yang alami untuk πλησίον dan lebih luas daripada sekadar orang yang tinggal berdekatan.'
- source_word: ὡς σεαυτόν
  choice: seperti dirimu sendiri
  rationale: Padanan ini mempertahankan ungkapan perbandingan Yunani secara ringkas tanpa menambahkan kata kerja yang tidak tersurat.
- source_word: καλῶς ποιεῖτε
  choice: kamu berbuat baik
  rationale: Ungkapan ini menegaskan bahwa tindakan tersebut benar atau patut. 'Berbuat baik' alami dan mempertahankan permainan makna ποιεῖτε sebagai tindakan.
theological_decisions:
- issue: Makna 'hukum kerajaan'
  choice: Mempertahankan sebutan yang bercorak rajawi tanpa menentukan satu penjelasan teologis
  alternative: Hukum dari Sang Raja; hukum yang terutama; hukum Kerajaan Allah
  rationale: βασιλικός dapat menunjuk pada sumber rajawi, kaitan dengan kerajaan, atau kedudukan utama. Terjemahan utama dan catatan kaki mempertahankan keluasan makna ini.
- issue: Daya bersyarat Εἰ
  choice: Mempertahankan 'jika'
  alternative: Menerjemahkannya sebagai penegasan pasti, misalnya 'karena kamu memang'
  rationale: Bentuk Yunani secara eksplisit bersyarat. Meskipun konteks dapat memberi nada afirmatif, terjemahan tidak seharusnya menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan perintah dibuat langsung dan mudah dipahami. Penanda [a] ditempatkan tepat setelah frasa yang dijelaskan.
