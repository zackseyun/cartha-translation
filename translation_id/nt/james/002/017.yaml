base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: id
  text: Demikian juga, iman[a], jika tidak mempunyai perbuatan, iman itu sendiri mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaan”; kemungkinan lain yang kurang sesuai di sini, “kesetiaan”. Kata Yunani pistis dapat memiliki arti-arti ini, tetapi “iman” paling cocok dengan argumen Yakobus dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Demikian juga
  rationale: Menjaga hubungan perbandingan dan kesimpulan dengan gambaran sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἡ πίστις
  choice: iman
  rationale: Dalam argumen Yakobus, kata ini paling tepat menunjuk pada iman atau kepercayaan yang diakui; kemungkinan makna leksikal lain dicatat dalam catatan kaki.
- source_word: ἐὰν μὴ ἔχῃ ἔργα
  choice: jika tidak disertai perbuatan
  rationale: Ungkapan ini menyampaikan bahwa iman tersebut tidak memiliki perbuatan yang menyertainya. Bentuk ini lebih alami daripada terjemahan harfiah 'tidak mempunyai perbuatan', tanpa mengubah hubungan kondisionalnya.
- source_word: νεκρά ἐστιν
  choice: adalah mati
  rationale: Mempertahankan metafora yang tegas dan bentuk predikatif teks Yunani.
- source_word: καθ’ ἑαυτήν
  choice: pada dirinya sendiri
  rationale: Menunjukkan iman yang dipandang tersendiri, terpisah dari perbuatan, tanpa menambahkan penyelesaian teologis.
theological_decisions:
- issue: Pemaknaan πίστις dalam perdebatan mengenai iman dan perbuatan
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: '''Iman'' paling sesuai dengan alur argumen Yakobus dan mempertahankan ketegangan antara iman dan perbuatan. Terjemahan ini tidak memasukkan rumusan denominasi tertentu mengenai pembenaran.'
- issue: Hubungan iman dengan perbuatan
  choice: jika tidak disertai perbuatan
  alternative: jika tidak mempunyai perbuatan
  rationale: Pilihan ini menyatakan ketiadaan perbuatan yang menyertai iman tanpa mengatakan bahwa perbuatan menghasilkan iman atau tanpa menentukan secara dogmatis hubungan keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat cukup dekat dengan teks Yunani, sementara 'disertai perbuatan' dipilih agar alami dan jelas bagi pembaca umum.
