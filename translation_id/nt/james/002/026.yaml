  verdict: approve
  source_fidelity: Teks Indonesia dengan tepat mempertahankan struktur perbandingan ὥσπερ ... οὕτως καί, penghubung penjelas γάρ melalui “Sebab”, serta pengulangan “mati” untuk νεκρόν/νεκρά. “Tubuh tanpa roh” dan “iman tanpa perbuatan” merupakan padanan yang setia bagi σώμα χωρὶς πνεύματος dan πίστις χωρὶς ἔργων.
  naturalness: “Sebab, sebagaimana tubuh tanpa roh itu mati, demikian juga iman tanpa perbuatan itu mati” adalah bahasa Indonesia baku, jelas, dan cukup khidmat untuk register surat Perjanjian Baru. Penggunaan “itu” pada kedua sisi perbandingan terdengar wajar dan turut menegaskan paralelisme.
  terminology: “Roh,” “iman,” dan “perbuatan” konsisten dengan penggunaan Alkitab Indonesia yang lazim dan tidak memaksakan penafsiran doktrinal. Catatan untuk πνεῦμα dengan alternatif “napas” dan untuk πίστις dengan alternatif “kesetiaan” atau “kepercayaan” secara memadai menjaga kemungkinan leksikal tanpa mengganggu teks utama.
