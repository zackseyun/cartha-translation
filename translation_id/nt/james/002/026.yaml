id: JAS.2.26
reference: James 2:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: id
  text: Sebab, sebagaimana tubuh tanpa roh[a] itu mati, demikian juga iman[b] tanpa perbuatan itu mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “napas”. Kata Yunani ini dapat berarti “roh” atau “napas”.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesetiaan” atau “kepercayaan”. Kata Yunani ini juga dapat menunjuk pada sikap percaya atau kesetiaan; teks utama memakai padanan yang lazim, yaitu “iman”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ
  choice: sebagaimana
  rationale: Memperkenalkan bagian pertama dari perbandingan dengan ungkapan Indonesia yang alami dan jelas.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan kata penghubung yang menjelaskan dan mengaitkan ayat ini dengan argumen sebelumnya.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan baku bagi tubuh jasmani dan sesuai dengan gambaran dalam perbandingan ini.
- source_word: χωρὶς πνεύματος
  choice: tanpa roh
  rationale: χωρίς berarti ‘tanpa’ atau ‘terpisah dari’, sedangkan πνεῦμα dapat berarti ‘roh’ atau ‘napas’. ‘Roh’ mempertahankan cakupan antropologis istilah Yunani; kemungkinan ‘napas’ dicatat dalam catatan kaki.
- source_word: νεκρόν / νεκρά
  choice: mati
  rationale: Mempertahankan pengulangan kata sifat Yunani dan daya retoris perbandingan antara tubuh dan iman.
- source_word: οὕτως καὶ
  choice: demikian juga
  rationale: Menandai bagian kedua yang bersesuaian dalam perbandingan dan mempertahankan unsur ‘juga’.
- source_word: πίστις
  choice: iman
  rationale: ‘Iman’ adalah padanan utama yang paling lazim dalam konteks ini, sementara kemungkinan makna ‘kesetiaan’ atau ‘kepercayaan’ dipertahankan dalam catatan kaki.
- source_word: χωρὶς ἔργων
  choice: tanpa perbuatan
  rationale: ‘Perbuatan’ merupakan padanan alami bagi ἔργα dalam bahasa Indonesia dan menjaga kaitannya dengan argumen Yakobus tentang iman dan tindakan nyata.
theological_decisions:
- issue: Makna πνεύματος dalam perbandingan
  choice: roh
  alternative: napas
  rationale: ‘Roh’ mempertahankan keluasan makna istilah Yunani dan gambaran tentang unsur yang menghidupkan tubuh tanpa membatasinya pada fungsi pernapasan. ‘Napas’ tetap merupakan kemungkinan leksikal yang wajar dan dicatat.
- issue: Makna πίστις dalam Yakobus 2:26
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: ‘Iman’ mempertahankan istilah utama dalam pembahasan Yakobus dan tidak menyelesaikan ketegangan teologis melalui parafrasa. Kemungkinan makna lain dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan perbandingan yang jelas dan bernada khidmat. Partikel “itu” dipakai secara seimbang untuk menghasilkan alur alami serta menegaskan keadaan ‘mati’ pada kedua sisi analogi.
