  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: id
  text: Berbicaralah demikian dan bertindaklah demikian sebagai orang-orang yang akan dihakimi melalui hukum kebebasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Berbicaralah dan bertindaklah
  rationale: Dua imperatif kini dipertahankan secara langsung dan alami; pengulangan οὕτως tercermin dalam kesepadanan cara melalui konstruksi paralel Indonesia tanpa pengulangan yang kaku.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: sebagai orang-orang yang akan dihakimi
  rationale: ὡς menyatakan sikap atau kapasitas yang harus menjadi dasar berbicara dan bertindak, sedangkan μέλλοντες dengan infinitif pasif menunjukkan penghakiman yang akan datang.
- source_word: διὰ νόμου ἐλευθερίας
  choice: melalui hukum yang memerdekakan
  rationale: ‘Melalui’ mempertahankan nilai instrumental/perantara διά dan menghindari penyempitan menjadi sekadar pelaku penghakiman. Genitif ἐλευθερίας diungkapkan secara idiomatis sebagai sifat hukum yang menghasilkan atau memberikan kemerdekaan.
theological_decisions:
- issue: Hubungan hukum yang memerdekakan dengan penghakiman
  choice: dihakimi melalui hukum yang memerdekakan
  alternative: dihakimi oleh hukum kemerdekaan
  rationale: Terjemahan ini mempertahankan ketegangan teks antara penghakiman dan kemerdekaan serta mencerminkan διά tanpa menentukan lebih jauh apakah hukum itu standar, sarana, atau ranah penghakiman.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak tersirat dalam imperatif Yunani dibuat eksplisit melalui ‘orang-orang’, tanpa menambahkan sapaan yang tidak terdapat dalam ayat.
