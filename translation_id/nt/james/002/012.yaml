    issue: Pengulangan οὕτως tidak diterjemahkan.
    rationale: 'Teks Yunani menegaskan baik cara berbicara maupun cara bertindak: ''demikian berbicaralah dan demikian bertindaklah.'' Konstruksi paralel tanpa ''demikian'' tidak merepresentasikan unsur ini.'
  - severity: low
    issue: '''Hukum yang memerdekakan'' bersifat lebih interpretatif daripada genitif sumber.'
    rationale: ἐλευθερίας secara harfiah adalah 'kebebasan'; bentuk 'yang memerdekakan' menyatakan secara eksplisit bahwa hukum menghasilkan kebebasan, suatu nuansa yang mungkin tetapi tidak dinyatakan secara langsung.
  revised_text: Berbicaralah demikian dan bertindaklah demikian sebagai orang-orang yang akan dihakimi melalui hukum kebebasan.
