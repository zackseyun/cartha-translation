- from: Berbicaralah dan bertindaklah sebagai orang-orang yang akan dihakimi melalui hukum yang memerdekakan.
  to: Berbicaralah demikian dan bertindaklah demikian sebagai orang-orang yang akan dihakimi melalui hukum kebebasan.
