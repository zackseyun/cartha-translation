base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: id
  text: Tetapi, maukah engkau tahu, hai manusia yang hampa[a], bahwa iman tanpa perbuatan tidak berguna[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hai orang bodoh.” Kata Yunani yang dipakai secara harfiah berarti “kosong” atau “hampa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak aktif” atau “tidak efektif.” Istilah Yunaninya berarti tidak bekerja atau tidak produktif.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Namun, maukah engkau mengetahui
  rationale: θέλω dengan infinitif menyatakan kemauan, γνῶναι berarti mengetahui, dan δέ membawa peralihan yang bernuansa pertentangan. Bentuk pertanyaan dipertahankan secara alami.
- source_word: ὦ ἄνθρωπε κενέ
  choice: hai manusia yang hampa
  rationale: Sapaan vokatif tunggal dipertahankan. κενός secara harfiah berarti kosong atau hampa dan di sini menunjuk pada orang yang tidak memiliki isi atau pengertian yang semestinya, tanpa langsung menggantinya dengan tafsiran 'bodoh'.
- source_word: ἡ πίστις
  choice: iman
  rationale: Dalam argumen ini πίστις paling tepat diterjemahkan dengan istilah baku 'iman', tanpa menggesernya menjadi kesetiaan atau sekadar kepercayaan.
- source_word: χωρὶς τῶν ἔργων
  choice: tanpa perbuatan
  rationale: χωρίς dengan genitif berarti tanpa atau terpisah dari. 'Tanpa perbuatan' alami dalam bahasa Indonesia dan mempertahankan hubungan konseptual yang dibahas Yakobus.
- source_word: ἀργή ἐστιν
  choice: tidak menghasilkan apa-apa
  rationale: ἀργός berarti tidak bekerja, tidak aktif, atau tidak produktif. Ungkapan ini menyampaikan daya praktis istilah tersebut secara jelas tanpa menyamakannya dengan νεκρά, 'mati', pada ayat-ayat sekitar.
theological_decisions:
- issue: Hubungan iman dan perbuatan dalam argumen Yakobus
  choice: Menyatakan bahwa iman tanpa perbuatan tidak menghasilkan apa-apa, tanpa menambahkan penjelasan sistem teologis tertentu.
  alternative: Menerjemahkan ἀργή sebagai 'mati' atau, secara lebih harfiah, 'tidak aktif'.
  rationale: Naskah memakai ἀργή, bukan νεκρά. Terjemahan harus mempertahankan pilihan kata dan ketegangan teologis ayat ini, bukan meleburkannya dengan bahasa ayat-ayat di sekitarnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan langsung tunggal; 'hai' mempertahankan kekuatan bentuk vokatif. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
