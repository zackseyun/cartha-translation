source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: id
  text: dan kalian memberi perhatian kepada orang yang mengenakan pakaian cemerlang[a] itu serta berkata, “Duduklah di sini, di tempat yang baik,” dan kepada laki-laki miskin itu kalian berkata, “Berdirilah di sana, atau duduklah di sana[b] di bawah tumpuan kakiku,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian indah” atau “pakaian mewah.”
    reason: lexical_alternative
  - marker: b
    text: Sebagian naskah tidak memuat kata-kata “atau duduklah di sana.” Teks utama mengikuti SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: memberi perhatian kepada
  rationale: Dalam konteks ini, kata kerja tersebut bukan sekadar berarti melihat, melainkan memberikan perhatian khusus atau sambutan yang baik. Pilihan ini mempertahankan tindakan konkret tanpa langsung menerjemahkannya sebagai ‘berpihak’ atau ‘pilih kasih’.
- source_word: φοροῦντα
  choice: mengenakan
  rationale: Partisipel ini secara wajar merujuk pada orang yang sedang memakai pakaian; ‘mengenakan’ merupakan padanan Indonesia yang langsung dan alami.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: pakaian cemerlang
  rationale: ἐσθής berarti pakaian atau jubah, sedangkan λαμπρός dapat berarti terang, cemerlang, indah, atau mewah. ‘Pakaian cemerlang’ mempertahankan gambaran pakaian yang mencolok dan mengesankan tanpa mempersempitnya hanya pada harga atau mutu.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Duduklah di sini, di tempat yang baik
  rationale: Imperatif κάθου diterjemahkan langsung, sedangkan καλῶς dipahami sebagai tempat atau keadaan duduk yang baik dan terhormat dalam kontras dengan perlakuan terhadap orang miskin.
- source_word: τῷ πτωχῷ
  choice: kepada laki-laki miskin itu
  rationale: Bentuk Yunani berartikel, tunggal, dan maskulin menunjuk kepada seorang pengunjung laki-laki tertentu dalam adegan ini. Terjemahan mempertahankan rujukan gender dan ketertentuannya.
- source_word: στῆθι
  choice: Berdirilah
  rationale: Ini adalah imperatif langsung dari ἵστημι. Bentuk Indonesia mempertahankan nada perintah dalam ucapan tersebut.
- source_word: ἢ κάθου ἐκεῖ
  choice: atau duduklah di sana
  rationale: Frasa ini menyajikan pilihan kedua yang merendahkan bagi orang miskin; ἐκεῖ memiliki daya menjauhkan dan diterjemahkan ‘di sana’.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: di bawah tumpuan kakiku
  rationale: ὑπό dengan akusatif secara alami berarti ‘di bawah’. Walaupun gambaran ini terasa keras, terjemahan literal mempertahankan penghinaan dan kedudukan sosial rendah yang dimaksudkan oleh ungkapan tersebut.
theological_decisions:
- issue: Bahasa mengenai keberpihakan sosial
  choice: Menggambarkan perhatian dan perintah yang berbeda kepada orang berpakaian cemerlang dan laki-laki miskin tanpa memasukkan istilah doktrinal tambahan.
  alternative: Menerjemahkan ἐπιβλέψητε secara lebih interpretatif sebagai ‘memberi perlakuan istimewa’ atau ‘bersikap pilih kasih’.
  rationale: Konteks Yakobus mengecam sikap pilih kasih, tetapi ayat ini sendiri memperlihatkan sikap itu melalui tindakan dan perkataan konkret. Terjemahan membiarkan kesimpulan teologis muncul dari adegan dan konteksnya.
- issue: Gender πτωχῷ
  choice: laki-laki miskin itu
  alternative: orang miskin itu
  rationale: Bentuk Yunani maskulin tunggal menggambarkan seorang pengunjung tertentu. Mempertahankan rujukan laki-laki sesuai dengan bentuk sumber tanpa mengubah penerapan umum bagian ini.
- issue: Gambaran duduk di bawah tumpuan kaki
  choice: Mempertahankan ‘di bawah tumpuan kakiku’.
  alternative: Menghaluskannya menjadi ‘di dekat kakiku’ atau ‘di lantai’.
  rationale: Ungkapan sumber secara sengaja menyampaikan penghinaan dan ketimpangan status. Menghaluskannya akan mengurangi ketegangan moral dalam adegan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Sapaan ‘kalian’ mempertahankan bentuk jamak kata kerja Yunani bagi komunitas yang disapa, sedangkan perintah dalam kutipan berbentuk tunggal kepada masing-masing pengunjung. Konjungsi pembuka ‘dan’ dipertahankan karena ayat ini melanjutkan struktur bersyarat dari ayat sebelumnya.
