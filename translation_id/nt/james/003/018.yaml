  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: id
  text: Dan buah kebenaran ditaburkan dalam damai oleh mereka yang mengusahakan perdamaian[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buah keadilan”. Kata Yunani yang dipakai dapat mencakup nuansa moral maupun hubungan yang adil atau hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagi mereka yang mengusahakan perdamaian”. Bentuk datif Yunani dapat dipahami dengan cara ini, meskipun “oleh mereka” paling sesuai dengan verba pasif dalam kalimat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: buah
  rationale: Kata benda tunggal ini secara alami diterjemahkan sebagai “buah”, sehingga metafora Yunani tetap terpelihara; “hasil” atau “panen” mungkin sesuai konteks, tetapi kurang mempertahankan bentuk metaforanya.
- source_word: δὲ
  choice: Dan
  rationale: Di sini δέ berfungsi sebagai penghubung ringan, bukan penanda pertentangan yang kuat. “Dan” menghubungkan ayat ini dengan uraian sebelumnya tentang hikmat dari atas.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: “Kebenaran” merupakan padanan utama yang luas bagi δικαιοσύνη dan dapat menunjuk pada perilaku yang benar maupun hasil yang bercirikan kebenaran. Nuansa “keadilan” tetap dicatat dalam catatan kaki.
- source_word: ἐν εἰρήνῃ
  choice: dalam damai
  rationale: Terjemahan ini mempertahankan ungkapan sumber dan tidak menentukan secara berlebihan apakah damai terutama merupakan cara, keadaan, atau ranah penaburan.
- source_word: σπείρεται
  choice: ditaburkan
  rationale: Bentuk pasif kini Yunani dipertahankan dengan bentuk pasif Indonesia yang wajar dan tetap menjaga gambaran tentang penaburan.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: oleh mereka yang mengusahakan perdamaian
  rationale: Datif paling wajar dipahami sebagai pelaku bersama verba pasif. “Mengusahakan perdamaian” menyampaikan tindakan aktif ποιέω + εἰρήνην dengan bahasa Indonesia yang alami, tanpa menyederhanakannya menjadi sekadar sebutan “pembawa damai”.
theological_decisions:
- issue: Makna “buah kebenaran”
  choice: Ungkapan dipertahankan sebagai hasil atau buah yang bercirikan kebenaran, berkaitan dengan hikmat dari atas dan tindakan yang mendatangkan damai.
  alternative: Panen yang terdiri atas kebenaran; atau buah yang menghasilkan kebenaran.
  rationale: Genitif δικαιοσύνης dapat dipahami secara deskriptif atau sebagai penjelasan isi. Terjemahan utama tidak menetapkan salah satu hubungan tersebut secara sempit, sehingga ketegangan maknanya tetap terpelihara.
- issue: Fungsi datif τοῖς ποιοῦσιν εἰρήνην
  choice: 'Dipahami sebagai pelaku: “oleh mereka yang mengusahakan perdamaian”.'
  alternative: 'Dipahami sebagai penerima atau pihak yang mendapat manfaat: “bagi mereka yang mengusahakan perdamaian”.'
  rationale: Dengan verba pasif σπείρεται, fungsi pelaku paling sesuai dengan susunan kalimat, tetapi fungsi datif yang lain tetap mungkin dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “buah kebenaran” dan “dalam damai” sengaja dipertahankan untuk menjaga metafora serta ambiguitas sumber, sedangkan “mengusahakan perdamaian” dipilih agar tindakan aktifnya jelas dan alami bagi pembaca masa kini.
