id: JAS.3.13
reference: James 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: id
  text: Siapakah yang bijaksana dan berpengertian di antara kalian? Hendaklah orang itu menunjukkan perbuatan-perbuatannya melalui perilakunya yang baik, dengan kelemahlembutan yang lahir dari hikmat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dengan kelemahlembutan hikmat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Siapakah yang bijaksana dan berpengertian di antara kalian?
  rationale: Mempertahankan pertanyaan retoris dan pasangan kualitas σοφός–ἐπιστήμων. 'Berpengertian' menyampaikan pemahaman yang tampak dalam penilaian dan kehidupan, bukan sekadar banyak pengetahuan.
- source_word: δειξάτω
  choice: Hendaklah orang itu menunjukkan
  rationale: Menyampaikan daya imperatif orang ketiga tunggal secara alami. 'Orang itu' mempertahankan bentuk tunggal sekaligus menyatakan daya representatifnya tanpa membatasi rujukan pada laki-laki.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: melalui perilakunya yang baik
  rationale: ἐκ menunjukkan sarana atau sumber yang membuat perbuatan itu nyata, sedangkan ἀναστροφή merujuk pada perilaku atau cara hidup. Bentuk posesif memperjelas bahwa perilaku itu milik orang yang sama.
- source_word: τὰ ἔργα αὐτοῦ
  choice: perbuatan-perbuatannya
  rationale: Menerjemahkan ἔργα sebagai tindakan nyata dan mempertahankan bentuk jamak. Dalam bahasa Indonesia, 'perbuatan' lebih alami daripada 'pekerjaan' dalam konteks moral ini.
- source_word: ἐν πραΰτητι σοφίας
  choice: dengan kelemahlembutan yang lahir dari hikmat
  rationale: πραΰτης menyatakan kelemahlembutan atau sikap tidak kasar, bukan kelemahan. Genitif σοφίας dapat menyatakan sumber atau ciri; terjemahan utama mengambilnya sebagai kelemahlembutan yang dihasilkan oleh hikmat sambil mencatat alternatif yang lebih formal.
theological_decisions:
- issue: Hubungan antara kelemahlembutan dan hikmat dalam πραΰτητι σοφίας
  choice: kelemahlembutan yang lahir dari hikmat
  alternative: kelemahlembutan hikmat
  rationale: Genitif Yunani memungkinkan hubungan sumber maupun sifat. Pilihan utama alami dalam bahasa Indonesia dan tidak menjadikan hikmat sekadar pengetahuan; alternatif formal dicatat agar ambiguitas struktur tetap terlihat.
- issue: Bentuk tunggal pada perintah δειξάτω
  choice: Hendaklah orang itu menunjukkan
  alternative: Hendaklah ia menunjukkan
  rationale: Teks Yunani memakai bentuk tunggal maskulin secara representatif bagi siapa pun dalam jemaat. Bahasa Indonesia tidak menandai gender pada 'orang itu', sehingga bentuk tunggal dan cakupan umumnya sama-sama terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk ὑμῖν karena sapaan itu jamak dan ditujukan kepada komunitas. Susunan kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan hubungan antara hikmat, perilaku baik, perbuatan, dan kelemahlembutan.
