id: JAS.3.17
reference: James 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: id
  text: Namun, hikmat yang dari atas pertama-tama adalah murni, kemudian suka damai, lemah lembut, bersedia mendengarkan, penuh belas kasihan dan buah-buah yang baik, tidak memihak[a], dan tulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini juga dapat dipahami sebagai “tidak terbagi” atau “tidak bimbang/ragu-ragu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: yang dari atas
  rationale: Mempertahankan gambaran ruang dalam bahasa Yunani dan kontras dengan hikmat yang bukan datang dari atas dalam konteks sebelumnya, tanpa mempersempitnya menjadi 'dari surga'.
- source_word: σοφία
  choice: hikmat
  rationale: Padanan baku dan wajar dalam konteks sastra hikmat serta menunjuk pada jenis hikmat yang sedang dilukiskan.
- source_word: πρῶτον μὲν
  choice: pertama-tama
  rationale: Menandai sifat pertama dalam urutan deskripsi secara alami dalam bahasa Indonesia.
- source_word: ἁγνή
  choice: murni
  rationale: Menyatakan kemurnian moral dan keutuhan tanpa campuran; lebih luas dan alami daripada istilah yang khusus berkaitan dengan kesucian seksual.
- source_word: ἔπειτα
  choice: kemudian
  rationale: Mempertahankan peralihan dari sifat pertama kepada sifat-sifat berikutnya.
- source_word: εἰρηνική
  choice: suka damai
  rationale: Mengungkapkan kecenderungan aktif kepada perdamaian, bukan sekadar keadaan yang tenang.
- source_word: ἐπιεικής
  choice: lemah lembut
  rationale: Padanan yang mudah dipahami untuk sikap lembut, tenggang rasa, dan tidak memaksakan hak, meskipun seluruh rentang maknanya tidak dapat dimuat dalam satu ungkapan.
- source_word: εὐπειθής
  choice: bersedia mendengarkan
  rationale: Kata yang jarang ini menggambarkan sikap yang dapat diyakinkan, mau menerima nasihat, dan tidak keras kepala; pilihan ini menghindari kesan mudah diperdaya.
- source_word: μεστὴ ἐλέους
  choice: penuh belas kasihan
  rationale: Menerjemahkan secara langsung gambaran kelimpahan belas kasihan.
- source_word: καρπῶν ἀγαθῶν
  choice: buah-buah yang baik
  rationale: Mempertahankan bentuk jamak dan metafora buah sebagai hasil nyata, alih-alih langsung menafsirkannya sebagai perbuatan.
- source_word: ἀδιάκριτος
  choice: tidak memihak
  rationale: Dalam daftar etis ini, ungkapan tersebut paling alami menyatakan ketiadaan sikap membeda-bedakan atau pilih kasih. Karena kata Yunani ini dapat ditafsirkan dengan cara lain, kemungkinan itu dicatat dalam catatan kaki.
- source_word: ἀνυπόκριτος
  choice: tulus
  rationale: Menyampaikan ketiadaan kemunafikan atau kepura-puraan dalam bahasa Indonesia modern yang ringkas dan alami.
theological_decisions:
- issue: Penafsiran ἀδιάκριτος
  choice: tidak memihak
  alternative: tidak terbagi; tidak bimbang atau ragu-ragu
  rationale: Konteks etis dan perhatian Surat Yakobus terhadap sikap pilih kasih mendukung 'tidak memihak', sedangkan tema hati mendua dan kebimbangan dalam surat yang sama memberi dukungan kontekstual bagi kemungkinan lain. Catatan kaki mempertahankan ketegangan leksikal itu tanpa memasukkannya secara paksa ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat, dengan susunan daftar yang tetap mudah dibaca. 'Hikmat' dipertahankan sebagai istilah Alkitab yang umum; ungkapan lain dipilih agar dapat dipahami pembaca biasa tanpa menghilangkan metafora atau ambiguitas sumber.
source_grounding:
  english_pob_role: consult_only
