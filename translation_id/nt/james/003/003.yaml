  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: id
  text: Jika kita memasukkan besi kekang[a] ke dalam mulut kuda agar kuda-kuda itu menaati kita, kita juga mengarahkan seluruh tubuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekang”; yang dimaksud di sini secara khusus ialah bagian kekang yang dipasang di dalam mulut kuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Jika
  rationale: Menandai perumpamaan bersyarat dengan peralihan wacana yang ringan. Dalam bahasa Indonesia, “Jika” menyampaikan daya kondisionalnya secara alami tanpa menambahkan penanda waktu yang tidak terdapat dalam teks sumber.
- source_word: χαλινοὺς
  choice: besi kekang
  rationale: Dalam konteks benda yang dipasang pada mulut kuda, kata ini menunjuk secara khusus pada bagian kekang yang masuk atau terpasang pada mulut, bukan seluruh perangkat tali kekang. “Besi kekang” jelas dan mudah dipahami pembaca modern.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: kita memasang ... pada mulut
  rationale: Ungkapan ini secara harfiah menyatakan menaruh benda itu ke dalam mulut. “Memasang ... pada mulut” merupakan ungkapan Indonesia yang alami untuk perlengkapan kuda dan tetap mempertahankan lokasi yang dinyatakan teks Yunani.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: supaya kuda-kuda itu menuruti kita
  rationale: Konstruksi εἰς dengan infinitif menyatakan tujuan atau hasil, sedangkan πείθεσθαι dengan datif berarti menaati atau menuruti. Pengulangan “kuda-kuda itu” menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
- source_word: ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: kita juga mengarahkan seluruh tubuh mereka
  rationale: μετάγομεν menyatakan mengarahkan atau mengendalikan gerak. Bentuk “seluruh tubuh mereka” mencerminkan makna distributif dari kata benda tunggal σώμα bersama pronomina jamak αὐτῶν.
