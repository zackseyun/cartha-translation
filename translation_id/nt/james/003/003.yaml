  source_fidelity: 'Draf secara keseluruhan mengikuti struktur dan makna Yunani dengan baik: kondisi ilustratif, alat pada mulut kuda, tujuan ketaatan, dan pengarahan seluruh tubuh. Namun, “memasang ... pada mulut” melemahkan arah εἰς τὰ στόματα βάλλομεν, yang secara eksplisit menyatakan memasukkan/menaruh ke dalam mulut.'
  naturalness: Bahasa draf baku dan jelas. “Memasukkan besi kekang ke dalam mulut kuda” sama alaminya dalam bahasa Indonesia modern serta lebih tepat daripada “memasang ... pada mulut.” “Menaati kita” merupakan padanan baku yang langsung bagi πείθεσθαι ἡμῖν.
