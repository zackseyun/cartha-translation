  source_fidelity: Terjemahan dengan tepat menyampaikan γάρ sebagai “Sebab,” πολλὰ ... ἅπαντες sebagai “kita semua ... dalam banyak hal,” dan mempertahankan metafora πταίω melalui “tersandung.” “Dalam perkataannya” menangkap ἐν λόγῳ dengan baik. “Matang” merupakan padanan yang tepat dan tidak berlebihan untuk τέλειος dalam konteks ini. “Mengekang” dengan tepat mempertahankan citra χαλιναγωγῆσαι dan keterkaitannya dengan ayat-ayat berikutnya. Unsur tambahan “juga” untuk καί dapat dipertahankan. Penggunaan “orang” bagi ἀνήρ dalam pernyataan bersifat umum dapat diterima, dengan transparansi bentuk maskulin dalam catatan.
