id: JAS.3.2
reference: James 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: id
  text: Sebab kita semua tersandung dalam banyak hal. Jika seseorang tidak tersandung dalam perkataannya, ia adalah orang yang matang[a][b], yang juga sanggup mengekang seluruh tubuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sempurna” atau “utuh.” Kata Yunani τέλειος di sini menunjuk pada kematangan atau keutuhan watak, bukan dengan sendirinya pada keadaan mutlak tanpa dosa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “laki-laki yang matang.” Kata Yunani ἀνήρ berbentuk maskulin, tetapi dipakai dalam pernyataan umum yang berlaku secara representatif.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: dalam banyak hal
  rationale: Bentuk jamak netral akusatif ini berfungsi secara adverbial dan menyatakan banyak segi atau keadaan kegagalan, bukan objek langsung ‘banyak hal’.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memberi dasar bagi peringatan pada ayat sebelumnya; ‘Sebab’ mempertahankan hubungan penjelasannya.
- source_word: πταίομεν / πταίει
  choice: tersandung
  rationale: Pilihan ini mempertahankan metafora Yunani tentang tersandung sekaligus menyampaikan kegagalan moral tanpa langsung meratakannya menjadi ‘berdosa’.
- source_word: ἅπαντες
  choice: kita semua
  rationale: Ungkapan ini menegaskan bahwa semua termasuk, dan mempertahankan penyertaan diri penulis.
- source_word: εἴ τις
  choice: Jika seseorang
  rationale: Ini merupakan syarat tak tentu yang mengemukakan suatu keadaan umum.
- source_word: ἐν λόγῳ
  choice: dalam perkataannya
  rationale: Dalam konteks ini λόγος menunjuk pada ucapan atau apa yang dikatakan seseorang. Bentuk ini alami dalam bahasa Indonesia dan tetap cukup dekat dengan ungkapan Yunani.
- source_word: οὗτος
  choice: ia
  rationale: Dalam bahasa Indonesia, pengulangan dengan ‘orang itulah’ terasa kaku; ‘ia’ secara alami menunjuk kembali kepada orang yang baru disebutkan.
- source_word: τέλειος
  choice: matang
  rationale: Dalam konteks pembentukan moral, kata ini menunjuk pada kematangan atau keutuhan. ‘Matang’ menghindari kesan bahwa yang dimaksud ialah keadaan mutlak tanpa dosa, sambil tetap mengakui kemungkinan arti ‘sempurna’ atau ‘utuh’.
- source_word: ἀνήρ
  choice: orang
  rationale: Walaupun kata Yunani secara harfiah berarti ‘laki-laki’, pernyataan umum yang diawali εἴ τις berlaku secara representatif. ‘Orang’ menghindari kesan keliru bahwa kematangan yang dimaksud terbatas pada laki-laki; bentuk sumber dijelaskan dalam catatan kaki.
- source_word: δυνατὸς
  choice: sanggup
  rationale: Kata ini menyatakan kemampuan; ‘sanggup’ merupakan padanan langsung dan wajar.
- source_word: χαλιναγωγῆσαι
  choice: mengekang
  rationale: Kata kerja ini berasal dari tindakan mengendalikan dengan kekang. ‘Mengekang’ mempertahankan citra yang dikembangkan dalam ayat-ayat berikutnya.
- source_word: καὶ
  choice: juga
  rationale: Kata ini menambahkan kemampuan mengendalikan seluruh tubuh kepada kemampuan mengendalikan perkataan.
- source_word: ὅλον τὸ σῶμα
  choice: seluruh tubuhnya
  rationale: Padanan ini mempertahankan cakupan menyeluruh dari ὅλον dan membuat rujukan kepada orang tersebut jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna τέλειος dalam konteks etis
  choice: matang
  alternative: sempurna; utuh
  rationale: Konteks langsung menyatakan bahwa kita semua tersandung. Karena itu, ‘matang’ paling wajar menunjuk pada kematangan watak, tanpa meniadakan nuansa keutuhan atau menyatakan kesempurnaan mutlak tanpa dosa.
- issue: Daya representatif bentuk maskulin ἀνήρ
  choice: orang, dengan bentuk harfiah dijelaskan dalam catatan kaki
  alternative: laki-laki
  rationale: Bahasa Yunani memakai kata maskulin ἀνήρ, tetapi syarat umum ‘jika seseorang’ menunjukkan penerapan representatif. Terjemahan utama menyampaikan cakupan umum, sedangkan catatan mempertahankan transparansi terhadap bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora ‘tersandung’ dan ‘mengekang’ dipertahankan agar hubungan gambaran dalam perikop tetap terlihat. ‘Dalam perkataannya’ dipilih sebagai ungkapan alami untuk kegagalan dalam ucapan.
