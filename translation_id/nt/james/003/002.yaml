  terminology: Istilah “tersandung,” “matang,” dan “mengekang” konsisten dengan metafora dan register perikop. Catatan kaki a menjelaskan rentang τέλειος secara seimbang tanpa memaksakan pembacaan doktrinal. Catatan kaki b secara akurat menjelaskan ἀνήρ dan penerapan representatifnya.
