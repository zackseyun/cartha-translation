id: JAS.3.9
reference: James 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: id
  text: Dengan lidah itu kita memberkati Tuhan dan Bapa[a], dan dengan lidah itu kita mengutuk manusia yang telah dijadikan menurut keserupaan dengan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat dipahami sebagai “Tuhan, yaitu Bapa.” Bahasa Yunani mempertahankan kemungkinan hubungan aposisional atau sebutan berpasangan.
    reason: alternative_reading
  - marker: b
    text: Atau “menurut rupa Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: dengan lidah itu
  rationale: Kata ganti feminin ini merujuk kembali kepada lidah dalam konteks sebelumnya. Penyebutan ulang nomina membuat rujukannya jelas dan menyampaikan fungsi instrumental secara alami dalam bahasa Indonesia.
- source_word: εὐλογοῦμεν
  choice: kita memberkati
  rationale: Mempertahankan makna dasar dan pertentangan leksikal dengan 'mengutuk'; dalam pemakaian yang diarahkan kepada Allah, ungkapan ini berarti menyatakan berkat atau pujian kepada-Nya.
- source_word: τὸν κύριον καὶ πατέρα
  choice: Tuhan dan Bapa
  rationale: Membawa koordinasi Yunani secara langsung tanpa memaksakan apakah kedua sebutan itu sepenuhnya bersifat aposisional atau merupakan sebutan berpasangan bagi Allah.
- source_word: καταρώμεθα
  choice: kita mengutuk
  rationale: Padanan langsung dan wajar yang mempertahankan daya moral kontras dengan 'memberkati'.
- source_word: τοὺς ἀνθρώπους
  choice: manusia
  rationale: Dalam konteks ini bentuk Yunani merujuk kepada umat manusia secara umum, bukan hanya laki-laki.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: menurut keserupaan dengan Allah
  rationale: Mempertahankan gagasan kesesuaian dengan likeness Allah serta gema bahasa penciptaan, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: γεγονότας
  choice: yang telah dijadikan
  rationale: Konteks keserupaan dengan Allah mendukung nuansa keadaan yang dihasilkan melalui penciptaan, dengan pelaku ilahi tersirat.
theological_decisions:
- issue: Hubungan antara sebutan 'Tuhan' dan 'Bapa'
  choice: Tuhan dan Bapa
  alternative: Tuhan, yaitu Bapa
  rationale: Konstruksi Yunani dapat dipahami secara aposisional, tetapi terjemahan utama mempertahankan koordinasinya agar ambiguitas yang asli tidak dihilangkan.
- issue: Cakupan ἀνθρώπους
  choice: manusia
  alternative: orang-orang
  rationale: Ayat ini berbicara tentang manusia secara umum sebagai mereka yang dijadikan menurut keserupaan dengan Allah, tanpa membatasi rujukan kepada laki-laki.
- issue: Nuansa γεγονότας dalam hubungan dengan penciptaan
  choice: telah dijadikan
  alternative: telah menjadi
  rationale: Pilihan ini menyampaikan keadaan hasil dan gema penciptaan tanpa menambahkan pelaku yang tidak dinyatakan secara eksplisit dalam klausa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'dengan lidah itu' dipilih demi kejelasan rujukan, sedangkan 'manusia' menyatakan umat manusia secara umum. Istilah 'keserupaan' mempertahankan nuansa formal ὁμοίωσις dan kaitannya dengan bahasa penciptaan.
