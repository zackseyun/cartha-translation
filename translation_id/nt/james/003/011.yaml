lexical_decisions:
- source_word: μήτι
  choice: Apakah ...?
  rationale: Partikel μήτι memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk “Apakah ...?” terdengar alami dalam bahasa Indonesia, sementara konteks menyampaikan daya retorisnya.
- source_word: ἡ πηγή
  choice: sebuah mata air
  rationale: πηγή dalam gambaran ini menunjuk pada sumber air alami; “mata air” merupakan padanan Indonesia yang tepat dan lazim.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: dari lubang yang sama
  rationale: ὀπή berarti lubang atau bukaan. “Lubang” mempertahankan gambaran konkret tempat air keluar dan juga menggemakan gambaran organ bicara dalam konteks dekat.
- source_word: βρύει
  choice: memancarkan
  rationale: βρύω menggambarkan sesuatu yang menyembur atau mengalir keluar. “Memancarkan” alami untuk mata air dan mempertahankan daya gambarnya.
- source_word: τὸ γλυκὺ καὶ τὸ πικρόν
  choice: air yang manis dan yang pahit
  rationale: Kedua adjektiva dipakai secara substantival. Penambahan “air” menjelaskan acuan yang tersirat tanpa mengubah pertentangan harfiah antara γλυκύ dan πικρόν.
