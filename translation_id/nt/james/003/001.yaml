base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: id
  text: Janganlah banyak di antara kalian menjadi pengajar, saudara-saudaraku[a], karena kalian tahu bahwa kita akan menerima penghakiman yang lebih berat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudaraku” berbentuk maskulin jamak, tetapi dalam konteks ini kemungkinan besar menyapa seluruh jemaat, termasuk perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: Janganlah banyak orang di antara kalian
  rationale: μή dengan imperatif kini γίνεσθε menyatakan larangan atau nasihat. Ungkapan ini mempertahankan sapaan orang kedua jamak dan terdengar wajar dalam bahasa Indonesia.
- source_word: διδάσκαλοι
  choice: pengajar
  rationale: Kata ini secara langsung menunjuk kepada orang yang mengajar; “pengajar” alami dan tidak mengandaikan jabatan resmi yang tidak dinyatakan teks.
- source_word: γίνεσθε
  choice: menjadi
  rationale: γίνομαι menyatakan menjadi atau memasuki suatu keadaan/peran, sehingga cocok dengan peringatan agar tidak banyak orang mengambil peran sebagai pengajar.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Sapaan ini mempertahankan bentuk kekerabatan yang akrab. Dalam pemakaian Indonesia, “saudara-saudara” dapat mencakup seluruh komunitas; catatan kaki menjelaskan bentuk Yunani dan cakupannya.
- source_word: εἰδότες
  choice: karena kalian tahu
  rationale: Partisip ini memberi dasar bagi nasihat. Bentuk klausa sebab lebih alami dalam bahasa Indonesia sambil mempertahankan hubungan logis yang paling mungkin.
- source_word: μεῖζον
  choice: lebih berat
  rationale: Bersama κρίμα, komparatif ini menyatakan penghakiman dengan bobot atau tingkat pertanggungjawaban yang lebih besar. “Lebih berat” alami dalam bahasa Indonesia dan tidak menentukan bentuk hukumannya.
- source_word: κρίμα
  choice: penghakiman
  rationale: Pilihan ini mempertahankan keluasan makna keputusan atau penilaian pengadilan dan tidak mempersempitnya menjadi penghukuman atau kebinasaan akhir.
- source_word: λημψόμεθα
  choice: kita akan menerima
  rationale: Bentuk orang pertama jamak dipertahankan, sehingga penulis memasukkan dirinya bersama kelompok yang akan menerima penghakiman itu.
theological_decisions:
- issue: Cakupan ἀδελφοί μου dalam komunitas yang mencakup laki-laki dan perempuan
  choice: saudara-saudaraku dalam teks utama, dengan penjelasan dalam catatan kaki
  alternative: saudara-saudaraku, baik laki-laki maupun perempuan
  rationale: Bentuk Yunani secara gramatikal maskulin, tetapi lazim dipakai untuk menyapa seluruh komunitas. Terjemahan utama mempertahankan sapaan kekerabatan tanpa menambahkan unsur yang tidak dinyatakan secara eksplisit.
- issue: Makna κρίμα dalam peringatan kepada para pengajar
  choice: penghakiman
  alternative: hukuman; penghukuman
  rationale: Ayat ini menegaskan pertanggungjawaban yang lebih berat, tetapi κρίμα tidak dengan sendirinya mengharuskan pengertian penghukuman akhir. “Penghakiman” menjaga keluasan dan ketegangan teologis teks.
- issue: Daya komparatif μεῖζον κρίμα
  choice: penghakiman yang lebih berat
  alternative: penghakiman yang lebih besar; penghakiman yang lebih keras
  rationale: “Lebih berat” menyampaikan peningkatan keseriusan pertanggungjawaban secara alami tanpa menjelaskan secara berlebihan apakah perbedaannya menyangkut standar, putusan, atau akibat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan orang kedua jamak secara jelas, sedangkan “kita” mempertahankan bentuk inklusif yang memasukkan penulis bersama para pengajar. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
