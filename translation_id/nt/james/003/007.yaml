  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: id
  text: Sebab setiap jenis binatang liar dan burung, binatang melata dan makhluk laut, sedang dijinakkan dan telah dijinakkan oleh umat manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh kodrat manusia” atau “oleh ranah manusia.” Frasa Yunani τῇ φύσει τῇ ἀνθρωπίνῃ dapat dipahami secara kolektif sebagai umat manusia atau secara lebih abstrak sebagai kodrat atau ranah manusia; teks utama mengambilnya secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: setiap jenis
  rationale: Dalam daftar zoologis ini, φύσις secara idiomatis menunjuk pada jenis atau golongan makhluk, bukan terutama pada sifat hakiki.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dan hubungan logis itu dipertahankan.
- source_word: θηρίων
  choice: binatang liar
  rationale: θηρίον lazim menunjuk pada binatang, khususnya binatang liar; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: πετεινῶν
  choice: burung
  rationale: Istilah ini menunjuk pada burung atau makhluk terbang; 'burung' merupakan padanan yang ringkas dan wajar.
- source_word: ἑρπετῶν
  choice: binatang melata
  rationale: Kata Yunani ini lebih luas daripada kategori ilmiah 'reptil' dan secara harfiah menunjuk pada makhluk yang merayap atau melata.
- source_word: ἐναλίων
  choice: makhluk laut
  rationale: Bentuk substantival ini menunjuk secara luas pada makhluk yang hidup di laut.
- source_word: δαμάζεται
  choice: sedang dijinakkan
  rationale: Bentuk kini pasif menyatakan proses yang berlangsung atau berulang; 'sedang dijinakkan' membedakannya dari bentuk perfek berikutnya.
- source_word: δεδάμασται
  choice: telah dijinakkan
  rationale: Bentuk perfek pasif menyatakan tindakan yang telah terlaksana dengan hasil yang tetap, sehingga kontras aspek kedua verba dipertahankan.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: oleh umat manusia
  rationale: Dalam konteks ini frasa tersebut paling wajar dipahami secara kolektif sebagai umat manusia yang menjinakkan berbagai jenis hewan, sambil mencatat kemungkinan arti abstrak dalam catatan kaki.
theological_decisions:
- issue: Makna τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: oleh umat manusia
  alternative: oleh kodrat manusia / oleh dunia manusia
  rationale: Agen kolektif paling sesuai dengan konteks penjinakan hewan, tetapi kemungkinan pembacaan yang lebih abstrak tetap diakui agar ambiguitas Yunani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sedangkan perbedaan aspek antara verba kini pasif dan perfek pasif diterjemahkan secara eksplisit. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
