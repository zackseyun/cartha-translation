id: JAS.3.15
reference: James 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: id
  text: Hikmat ini tidak turun dari atas, melainkan bersifat duniawi, tidak rohani,[a] dan demonis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alamiah”. Kata sifat Yunani ini dapat menunjuk pada apa yang hanya termasuk dalam kehidupan alamiah, sebagai lawan dari apa yang rohani.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Hikmat ini
  rationale: Ungkapan demonstratif ini menunjuk langsung pada hikmat yang baru saja digambarkan dalam konteks; terjemahan ini lugas dan tidak menambah penafsiran.
- source_word: ἄνωθεν
  choice: dari atas
  rationale: Mempertahankan ungkapan spasial sumber sekaligus resonansi asal ilahi dalam Surat Yakobus, tanpa mempersempitnya secara eksplisit menjadi 'dari surga'.
- source_word: κατερχομένη
  choice: yang turun
  rationale: Partisipel kini ini secara alami menerangkan hikmat sebagai sesuatu yang turun; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐπίγειος
  choice: bersifat duniawi
  rationale: Menunjukkan bahwa hikmat itu berasal dari ranah bumi dan berlawanan dengan yang 'dari atas'. 'Duniawi' lebih alami daripada 'bumiah', sementara 'bersifat' membantu menyatakan karakteristiknya.
- source_word: ψυχική
  choice: tidak rohani
  rationale: Dalam konteks Perjanjian Baru, kata ini kerap berlawanan dengan apa yang berasal dari Roh. Pilihan ini menyampaikan kontras tersebut dengan jelas, sementara alternatif leksikal dicatat karena cakupan kata Yunaninya lebih luas.
- source_word: δαιμονιώδης
  choice: berasal dari roh-roh jahat
  rationale: Menyampaikan kaitan atau asal demonis secara jelas bagi pembaca Indonesia. Bentuk ini lebih alami dan mudah dipahami daripada 'demonis', meskipun sedikit lebih eksplisit daripada bentuk adjektival Yunani.
theological_decisions:
- issue: Daya makna ψυχική dalam kontras rohani dan moral
  choice: tidak rohani
  alternative: alamiah; bersifat jasmani
  rationale: Pilihan ini mempertahankan kontras negatif dengan hikmat yang berasal dari atas tanpa memasukkan sistem doktrinal tertentu. Catatan kaki menjaga kemungkinan bahwa kata itu menunjuk pada kehidupan alamiah semata.
- issue: Hubungan δαιμονιώδης dengan roh-roh jahat
  choice: berasal dari roh-roh jahat
  alternative: demonis; seperti roh-roh jahat
  rationale: Konteks menyusun tiga penilaian negatif terhadap hikmat tersebut. Terjemahan ini menyatakan kaitannya dengan roh-roh jahat secara mudah dipahami, tanpa menyamakannya dengan Iblis secara khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan tiga sifat dipertahankan, dan penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskan.
