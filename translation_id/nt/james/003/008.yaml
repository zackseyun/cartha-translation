  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: id
  text: Namun, tidak seorang pun dapat menjinakkan lidah.[a] Lidah adalah kejahatan yang gelisah,[b] penuh dengan racun yang mematikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak seorang manusia pun dapat menjinakkan lidah.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “kejahatan yang tidak tenang” atau “kejahatan yang tidak stabil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν γλῶσσαν
  choice: lidah
  rationale: Mempertahankan gambaran anggota tubuh yang dalam konteks Yakobus melambangkan perkataan manusia dan menyambung dengan ayat-ayat sebelumnya.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: tidak seorang pun
  rationale: Ungkapan ini secara alami menyampaikan makna partitif ‘tidak seorang pun dari antara manusia’; kata ‘seorang’ tetap merujuk pada manusia secara umum tanpa menambahkan pembatasan jenis kelamin yang tidak dituntut dalam bahasa Indonesia.
- source_word: δαμάσαι δύναται
  choice: dapat menjinakkan
  rationale: ‘Menjinakkan’ mempertahankan hubungan verbal dengan pembahasan tentang penjinakan binatang dalam konteks sebelumnya, sedangkan ‘dapat’ mewakili δύναται.
- source_word: ἀκατάστατον
  choice: tidak terkendali
  rationale: Dalam konteks lidah, pilihan ini mengungkapkan sifat liar, tidak tertib, atau sukar dikendalikan; kemungkinan nuansa ‘tidak tenang’ dicatat dalam catatan kaki.
- source_word: κακόν
  choice: kejahatan
  rationale: Menyampaikan bobot moral κακόν, bukan sekadar sesuatu yang tidak menyenangkan atau merugikan.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: penuh dengan racun yang mematikan
  rationale: Terjemahan yang jelas dan alami bagi gambaran sesuatu yang dipenuhi racun pembawa maut; ‘racun’ lebih luas dan mudah dipahami daripada ‘bisa’.
theological_decisions:
- issue: Cakupan οὐδεὶς dengan genitif ἀνθρώπων
  choice: tidak seorang pun
  alternative: tidak seorang manusia pun
  rationale: Keduanya mencakup semua manusia. Bentuk utama lebih alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan penyebutan manusia secara eksplisit dan tidak mengubah pernyataan mutlak ayat ini.
- issue: Sifat lidah sebagai ἀκατάστατον κακόν
  choice: kejahatan yang tidak terkendali
  alternative: kejahatan yang tidak tenang / tidak stabil
  rationale: Teks menggambarkan daya rusak lidah tanpa menjelaskan secara sistematis kemampuan manusia atau pertolongan ilahi. Terjemahan mempertahankan ketegangan itu dan tidak menambahkan penyelesaian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dipecah menjadi dua kalimat yang alami. Pengulangan ‘lidah’ pada kalimat kedua memperjelas subjek yang tersirat dalam bahasa Yunani tanpa mengubah acuannya.
