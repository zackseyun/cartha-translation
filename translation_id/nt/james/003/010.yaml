  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: id
  text: Dari mulut yang sama keluar berkat dan kutuk. Saudara-saudaraku[a], hal-hal ini tidak sepatutnya demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudaraku” dalam bentuk jamak maskulin; dalam konteks ini, sapaan tersebut kemungkinan mencakup seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Dari mulut yang sama
  rationale: Mempertahankan gambaran satu sumber yang sama, dengan ungkapan yang alami dalam bahasa Indonesia.
- source_word: ἐξέρχεται
  choice: keluar
  rationale: Secara langsung menggambarkan perkataan yang keluar dari mulut dan sesuai dengan bentuk tunggal Yunani yang mendahului dua subjek yang berpasangan.
- source_word: εὐλογία
  choice: berkat
  rationale: Dalam konteks perkataan, menunjuk pada ucapan berkat dan mempertahankan pertentangan langsung dengan kutuk.
- source_word: κατάρα
  choice: kutuk
  rationale: Menyatakan ucapan kutuk secara ringkas dan berpasangan alami dengan berkat.
- source_word: οὐ χρή
  choice: tidak sepatutnya
  rationale: Mengungkapkan ketidakpatutan moral yang terkandung dalam χρή, lebih kuat daripada sekadar menyatakan bahwa hal itu tidak diharapkan.
- source_word: ἀδελφοί μου
  choice: Saudara-saudaraku
  rationale: Bentuk sapaan Indonesia ini alami dan dapat mencakup sesama anggota komunitas beriman; catatan kaki menjelaskan bentuk maskulin dalam bahasa Yunani.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: hal-hal ini tidak sepatutnya terjadi demikian
  rationale: Mempertahankan bentuk jamak ταῦτα serta gagasan cara atau keadaan dalam οὕτως, tanpa mempersempit acuannya.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί μου
  choice: Saudara-saudaraku
  alternative: Saudara-saudaraku, laki-laki dan perempuan
  rationale: Kata Yunani berbentuk jamak maskulin, tetapi dalam konteksnya kemungkinan menyapa seluruh komunitas orang percaya. Bentuk Indonesia yang dipilih tetap dekat dengan sapaan sumber dan tidak membatasi pembaca hanya pada laki-laki; bentuk Yunani dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan citra mulut sebagai sumber dua jenis ucapan yang bertentangan, lalu menyampaikan teguran moral Yakobus secara alami.
