  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: id
  text: Sebab, di mana ada iri hati[a] dan ambisi yang mementingkan diri sendiri, di situ ada kekacauan dan setiap perbuatan jahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kecemburuan.” Kata Yunani ini juga dapat berarti “semangat,” tetapi di sini konteksnya jelas negatif.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “setiap hal yang buruk”; dapat juga diterjemahkan “setiap perbuatan hina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: di mana
  rationale: Memperkenalkan keadaan umum yang bercorak lokatif dan mempertahankan pasangan ungkapan 'di mana ... di situ'.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai hubungan penjelasan dengan ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ζῆλος
  choice: iri hati
  rationale: Dalam konteks Yakobus 3:14–15, kata ini jelas menunjuk pada sifat buruk. 'Iri hati' merupakan ungkapan Indonesia yang alami; 'kecemburuan' juga mungkin, sedangkan arti netral atau positif 'semangat' tidak sesuai dengan konteks.
- source_word: ἐριθεία
  choice: ambisi yang mementingkan diri sendiri
  rationale: Menangkap dorongan mencari keuntungan dan kedudukan bagi diri sendiri yang dapat menimbulkan persaingan atau perpecahan.
- source_word: ἐκεῖ
  choice: di situ
  rationale: Berkorelasi langsung dengan ὅπου dan mempertahankan susunan aforistis 'di mana ... di situ'.
- source_word: ἀκαταστασία
  choice: kekacauan
  rationale: Menggambarkan ketidakteraturan dan gangguan dalam kehidupan bersama, bukan sekadar kebingungan pikiran.
- source_word: πᾶν
  choice: segala macam
  rationale: Dengan nomina tunggal πρᾶγμα, ungkapan ini menyampaikan cakupan menyeluruh secara idiomatis dalam bahasa Indonesia.
- source_word: φαῦλον
  choice: jahat
  rationale: Menyatakan keburukan moral secara jelas dan wajar; nuansa 'hina' atau 'buruk' tetap dicatat sebagai kemungkinan.
- source_word: πρᾶγμα
  choice: perbuatan
  rationale: Dalam konteks sifat buruk, kata ini menunjuk secara alami pada tindakan atau praktik konkret, bukan sekadar 'hal' yang abstrak.
theological_decisions:
- issue: Daya moral ζῆλος dalam konteks
  choice: Istilah sifat buruk yang diterjemahkan 'iri hati'
  alternative: '''Kecemburuan''; secara leksikal juga dapat berarti ''semangat'''
  rationale: Konteks langsung, khususnya 3:14–15, menempatkan ζῆλος bersama ambisi egois sebagai ciri hikmat duniawi. Karena itu, arti positif 'semangat' tidak dipilih, tetapi alternatif negatif yang wajar tetap diakui.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur 'di mana ... di situ' mempertahankan bentuk ringkas teks Yunani. 'Ambisi yang mementingkan diri sendiri' dipilih demi kejelasan bagi pembaca umum tanpa menghilangkan unsur kepentingan diri.
