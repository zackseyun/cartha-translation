revisions:
- from: Lidah pun adalah api. Di antara anggota-anggota tubuh kita, lidah menempati kedudukan sebagai dunia kejahatan; lidah menodai seluruh tubuh dan membakar roda kehidupan,[a] sementara lidah itu sendiri dibakar oleh Gehena.[b]
  to: Lidah pun adalah api. Lidah ditempatkan di antara anggota tubuh kita sebagai dunia kejahatan, yang menodai seluruh tubuh dan membakar roda kelahiran,[a] sementara lidah itu sendiri dibakar oleh Gehena.[b]
  rationale: Revisi memulihkan unsur leksikal γένεσις dalam teks utama melalui “roda kelahiran,” sambil mempertahankan alternatif pemahaman dalam catatan. Struktur kalimat disederhanakan agar hubungan lidah dengan “dunia kejahatan” serta rangkaian partisip Yunani tetap jelas tanpa mengubah makna.
