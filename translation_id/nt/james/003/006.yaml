review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama pada τὸν τροχὸν τῆς γενέσεως. “Roda kehidupan” menafsirkan γένεσις secara lebih luas dan menghilangkan unsur “kelahiran/asal-usul” yang hadir dalam ungkapan Yunani yang memang sukar. “Roda kelahiran” mempertahankan metafora serta ketegangan ungkapan sumber, dengan alternatif yang lebih idiomatis dijelaskan dalam catatan. Susunan kalimat juga diperjelas agar καθίσταται tampak sebagai penetapan/penempatan lidah di antara anggota tubuh.
  naturalness: Teks hasil revisi tetap memakai bahasa Indonesia baku modern. “Ditempatkan ... sebagai” lebih jelas dan lebih alami daripada “menempati kedudukan sebagai,” yang terdengar administratif dan kurang langsung dalam konteks metafora ini. Pengulangan “lidah” tidak diperlukan sesudah struktur kalimat diperjelas.
  terminology: “Lidah,” “api,” “dunia kejahatan,” “anggota tubuh,” “menodai,” dan “Gehena” dapat dipertahankan. “Gehena” secara tepat mempertahankan istilah khusus γέεννα; padanan tradisional “neraka” tetap tersedia dalam catatan tanpa menyamakan keduanya secara berlebihan.
  issues:
  - severity: medium
    issue: “Roda kehidupan” terlalu menafsirkan τὸν τροχὸν τῆς γενέσεως.
    rationale: γένέσις secara dasar menunjuk kelahiran, asal-usul, atau proses menjadi. Walaupun frasa ini dapat dipahami sebagai seluruh perjalanan atau siklus hidup, teks utama sebaiknya mempertahankan citra “roda” dan unsur kelahiran; penafsiran yang lebih idiomatis ditempatkan dalam catatan.
  - severity: low
    issue: “Menempati kedudukan sebagai” kurang alami dan kurang langsung untuk καθίσταται.
    rationale: Kata kerja ini dalam konteks menyatakan bahwa lidah ditempatkan/ditetapkan di antara anggota tubuh sebagai dunia kejahatan. “Ditempatkan ... sebagai” menyampaikan relasi itu dengan lebih jelas.
  revised_text: Lidah pun adalah api. Lidah ditempatkan di antara anggota tubuh kita sebagai dunia kejahatan, yang menodai seluruh tubuh dan membakar roda kelahiran,[a] sementara lidah itu sendiri dibakar oleh Gehena.[b]
