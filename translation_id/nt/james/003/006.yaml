id: JAS.3.6
reference: James 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: id
  text: Lidah pun adalah api. Lidah ditempatkan di antara anggota tubuh kita sebagai dunia kejahatan, yang menodai seluruh tubuh dan membakar roda kelahiran,[a] sementara lidah itu sendiri dibakar oleh Gehena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roda kelahiran”; dapat juga dipahami sebagai “perjalanan hidup” atau “siklus kehidupan”.
    reason: lexical_alternative
  - marker: b
    text: Gehena adalah istilah Yunani yang secara tradisional diterjemahkan “neraka”.
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: lidah
  rationale: Mempertahankan anggota tubuh yang menjadi metafora konkret dalam konteks, sekaligus menyiratkan perkataan secara metonimis.
- source_word: πῦρ
  choice: api
  rationale: 'Predikat metaforis ini alami dalam bahasa Indonesia tanpa artikel tak tentu: ''lidah ... adalah api''.'
- source_word: κόσμος τῆς ἀδικίας
  choice: dunia kejahatan
  rationale: Mempertahankan ungkapan Yunani yang tajam dan luas secara moral; 'kejahatan' lebih alami daripada nominal abstrak 'ketidakbenaran' dalam konstruksi ini.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: di antara anggota-anggota tubuh kita, ... menempati kedudukan
  rationale: Menyatakan posisi atau status lidah di antara bagian-bagian tubuh tanpa mengandaikan pelaku yang menetapkannya.
- source_word: σπιλοῦσα
  choice: menodai
  rationale: Mempertahankan citra noda sekaligus nuansa pencemaran moral.
- source_word: ὅλον τὸ σῶμα
  choice: seluruh tubuh
  rationale: Terjemahan langsung yang mempertahankan cakupan menyeluruh.
- source_word: φλογίζουσα
  choice: membakar
  rationale: Meneruskan citra api secara lugas dan alami.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: roda kehidupan
  rationale: Mempertahankan metafora 'roda' dan kejanggalan asli, sementara 'kehidupan' menyampaikan cakupan γένεσις dalam konteks dengan lebih wajar daripada 'kelahiran'.
- source_word: φλογιζομένη
  choice: dibakar
  rationale: Bentuk pasif dipertahankan untuk menunjukkan bahwa daya rusak lidah berasal dari sumber lain.
- source_word: ὑπὸ τῆς γεέννης
  choice: oleh Gehena
  rationale: Mempertahankan istilah khusus Yunani dan menghindari penyamaan tanpa penjelasan dengan istilah teologis yang lebih luas.
theological_decisions:
- issue: Arti γέεννα
  choice: Gehena
  alternative: neraka
  rationale: Transliterasi mempertahankan kekhususan historis dan konseptual istilah sumber; padanan tradisional dicantumkan dalam catatan.
- issue: Penafsiran τὸν τροχὸν τῆς γενέσεως
  choice: roda kehidupan
  alternative: perjalanan hidup; siklus kehidupan
  rationale: Teks utama mempertahankan metafora 'roda' tanpa memutuskan secara sempit apakah frasa itu menunjuk perjalanan, siklus, atau keseluruhan rentang hidup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan 'lidah' dipertahankan untuk kejernihan struktur Yunani; titik koma membantu mengurai rangkaian partisip tanpa menghilangkan hubungan logisnya.
