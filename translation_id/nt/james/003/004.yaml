base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: id
  text: 'Perhatikan juga kapal-kapal: sekalipun begitu besar dan digerakkan oleh angin kencang, kapal-kapal itu dikendalikan oleh kemudi yang sangat kecil ke arah yang dikehendaki oleh dorongan batin orang yang mengemudikannya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke mana pun pengemudinya ingin pergi.” Secara lebih harfiah, teks Yunani berbunyi “ke mana pun dorongan orang yang mengemudikannya menghendaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Perhatikan juga kapal-kapal
  rationale: “Perhatikan” berfungsi sebagai seruan untuk memusatkan perhatian dalam bahasa Indonesia modern, sedangkan “juga” menandai contoh tambahan yang sejajar dengan contoh sebelumnya.
- source_word: τηλικαῦτα ὄντα
  choice: sekalipun begitu besar
  rationale: Frasa ini mempertahankan penekanan pada ukuran kapal serta hubungan konsesifnya dengan kemudi yang sangat kecil.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: digerakkan oleh angin kencang
  rationale: “Angin kencang” merupakan padanan alami bagi ἀνέμων σκληρῶν dalam konteks pelayaran, dan bentuk pasif “digerakkan” mempertahankan konstruksi Yunani.
- source_word: μετάγεται
  choice: dikendalikan
  rationale: Dalam konteks kemudi kapal, “dikendalikan” menyampaikan tindakan mengarahkan atau membelokkan kapal dengan jelas dan alami.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: oleh kemudi yang sangat kecil
  rationale: “Sangat kecil” menyampaikan daya superlatif ἐλαχίστου secara idiomatis tanpa menyiratkan bahwa kemudi itu secara mutlak paling kecil dibandingkan semua kemudi.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: ke mana pun dorongan orang yang mengemudikannya menghendaki
  rationale: 'Terjemahan ini mempertahankan ungkapan Yunani yang tidak biasa: ὁρμή sebagai “dorongan”, partisip εὐθύνοντος sebagai “orang yang mengemudikannya”, dan βούλεται sebagai “menghendaki”, tanpa menyederhanakannya diam-diam menjadi sekadar tujuan pengemudi.'
theological_decisions:
- issue: Tingkat keharfiahan ungkapan tentang kehendak pengemudi
  choice: ke mana pun dorongan orang yang mengemudikannya menghendaki
  alternative: ke mana pun pengemudinya ingin pergi
  rationale: Ungkapan utama mempertahankan ketegangan leksikal antara dorongan batin dan kehendak dalam teks Yunani. Alternatif yang lebih lancar dicantumkan dalam catatan kaki agar pembaca memahami maksud praktisnya tanpa menghapus tekstur sumber dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “kapal-kapal itu” dipakai untuk menjaga kejelasan setelah klausa konsesif yang panjang. Istilah teknis “kemudi” dipertahankan karena tepat dan mudah dipahami.
