  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: id
  text: Namun, jika dalam hati kalian ada iri hati yang pahit[a] dan ambisi egois[b], janganlah menyombongkan diri dan berdusta melawan kebenaran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semangat yang pahit” atau “kedengkian yang pahit.”
    reason: lexical_alternative
  - marker: b
    text: Atau “persaingan” atau “sikap mementingkan diri yang memecah belah.”
    reason: lexical_alternative
  - marker: c
    text: Atau “berdusta dengan menentang kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: δέ menandai pertentangan dengan uraian sebelumnya tentang hikmat, sedangkan εἰ memperkenalkan syarat. Susunan ini alami dalam bahasa Indonesia.
- source_word: ζῆλον πικρὸν
  choice: iri hati yang pahit
  rationale: Dalam konteks negatif dan berdampingan dengan ἐριθεία, ζῆλος terutama menunjuk pada iri hati atau kecemburuan yang bermusuhan. Kata 'pahit' mempertahankan πικρόν secara langsung.
- source_word: ἐριθείαν
  choice: ambisi egois
  rationale: Ungkapan ini menyampaikan dorongan mencari kepentingan atau kedudukan sendiri yang dapat menimbulkan persaingan dan perpecahan.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: dalam hati kalian
  rationale: Bahasa Yunani memakai kata benda tunggal καρδίᾳ dengan kata ganti jamak ὑμῶν secara distributif. 'Dalam hati kalian' alami dalam bahasa Indonesia dan tetap menyapa sekelompok orang.
- source_word: μὴ κατακαυχᾶσθε
  choice: janganlah menyombongkan diri
  rationale: Kata kerja ini menunjuk pada tindakan bermegah atau membanggakan diri secara angkuh. 'Menyombongkan diri' mengungkapkan nilai negatifnya dengan jelas dan alami.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: berdusta melawan kebenaran
  rationale: ψεύδεσθε berarti berdusta, sedangkan κατά dengan bentuk genitif menyatakan pertentangan. Terjemahan ini mempertahankan gambaran tindakan yang berlawanan dengan kebenaran.
theological_decisions:
- issue: Cakupan makna 'kebenaran' (τῆς ἀληθείας)
  choice: kebenaran
  alternative: kebenaran Injil; jalan hikmat yang benar; kejujuran dalam perkataan
  rationale: Ayat ini tidak mempersempit ἀλήθεια pada suatu rumusan doktrinal tertentu atau hanya pada ketulusan pribadi. Istilah umum 'kebenaran' mempertahankan keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai dengan ὑμῶν dan mudah dipahami pembaca umum. Diksi tetap lugas dan bermartabat; 'kebenaran' sengaja dibiarkan luas tanpa penafsiran denominatif.
