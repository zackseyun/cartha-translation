  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: id
  text: Demikian juga, lidah adalah anggota tubuh yang kecil, tetapi membual tentang hal-hal besar. Lihatlah, betapa kecilnya api[a] yang membakar hutan yang begitu luas![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Betapa besarnya api yang membakar hutan yang begitu luas!” Susunan kata Yunani dapat dipahami sebagai seruan tentang besarnya api, tetapi teks utama mengikuti gagasan bahwa sebab yang kecil menghasilkan akibat yang besar, sesuai dengan perbandingan langsung dengan lidah sebagai anggota tubuh yang kecil.
    reason: alternative_reading
  - marker: b
    text: Atau “kayu,” “bahan bakar,” atau “belukar.” Kata Yunani ini dapat merujuk secara luas pada bahan yang dapat terbakar atau kawasan berhutan; “hutan” paling sesuai dengan gambaran ini dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: lidah
  rationale: Terjemahan harfiah ini mempertahankan gambaran konkret tentang bagian tubuh yang mendasari perbandingan Yakobus; “perkataan” akan langsung menafsirkan metafora tersebut.
- source_word: μικρὸν μέλος
  choice: anggota tubuh yang kecil
  rationale: Ungkapan ini alami dan jelas dalam bahasa Indonesia modern serta mempertahankan citra bagian tubuh.
- source_word: μεγάλα αὐχεῖ
  choice: menyombongkan perkara-perkara besar
  rationale: Pilihan ini mempertahankan makna ujaran yang angkuh atau klaim yang besar, tanpa membatasinya hanya pada volume atau banyaknya perkataan.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Bentuk ini secara alami mengarahkan perhatian pembaca kepada ilustrasi berikutnya dan tetap bernada bermartabat.
- source_word: ἡλίκον πῦρ
  choice: betapa kecilnya api
  rationale: Dalam konteks ini, ungkapan tersebut menonjolkan ketimpangan antara sebab yang kecil dan akibat yang besar, selaras dengan lidah sebagai anggota tubuh yang kecil; kemungkinan pembacaan lain dicatat dalam catatan kaki.
- source_word: ἡλίκην ὕλην
  choice: hutan yang begitu luas
  rationale: ὕλη dapat menunjuk pada hutan, kayu, atau bahan bakar. “Hutan” menghasilkan gambaran yang paling wajar dalam bahasa Indonesia, sedangkan “begitu luas” menyampaikan besarnya sasaran api.
- source_word: ἀνάπτει
  choice: membakar
  rationale: Dalam konteks api dan hutan, “membakar” merupakan ungkapan Indonesia yang alami dan jelas untuk tindakan menyalakan atau membuat terbakar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. “Anggota tubuh” dipilih daripada “anggota” saja agar metafora anatominya langsung dipahami. Penanda catatan kaki ditempatkan setelah gambaran api dan hutan yang diterangkannya, bukan pada unsur kalimat sebelumnya.
