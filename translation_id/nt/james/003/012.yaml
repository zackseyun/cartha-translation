id: JAS.3.12
reference: James 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: id
  text: Saudara-saudaraku[a], dapatkah pohon ara menghasilkan buah zaitun, atau pohon anggur menghasilkan buah ara? Air asin pun tidak dapat menghasilkan air tawar[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudaraku” berbentuk jamak maskulin, tetapi dapat digunakan untuk menyapa kelompok yang terdiri atas laki-laki dan perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “air manis”; dalam konteks ini maksudnya air tawar, sebagai lawan air asin.'
    reason: lexical_alternative
  - marker: c
    text: 'Klausa terakhir sangat ringkas dalam bahasa Yunani. Berdasarkan gambaran mata air pada ayat sebelumnya, klausa ini juga dapat dipahami: “Mata air asin pun tidak dapat menghasilkan air tawar.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Saudara-saudaraku
  rationale: Sapaan ini alami dan bermartabat dalam bahasa Indonesia. Kata Yunani berbentuk jamak maskulin, tetapi dalam konteksnya dapat menyapa seluruh jemaat, baik laki-laki maupun perempuan.
- source_word: μὴ δύναται
  choice: dapatkah
  rationale: Pertanyaan retoris dengan μή mengharapkan jawaban negatif. Bentuk “dapatkah ...?” mempertahankan daya retoris itu secara alami.
- source_word: συκῆ
  choice: pohon ara
  rationale: Kata ini menunjuk pada pohonnya, bukan buah ara.
- source_word: ἐλαίας ποιῆσαι
  choice: menghasilkan buah zaitun
  rationale: ποιέω dalam gambaran tentang pohon berarti menghasilkan atau mengeluarkan buah; “menghasilkan” merupakan padanan Indonesia yang jelas.
- source_word: ἄμπελος
  choice: pohon anggur
  rationale: Padanan ini lazim dalam bahasa Indonesia dan memperjelas bahwa yang dimaksud ialah tanaman anggur.
- source_word: σῦκα
  choice: buah ara
  rationale: Padanan langsung untuk bentuk jamak yang menunjuk pada buah ara.
- source_word: οὔτε ἁλυκὸν
  choice: Air asin pun tidak dapat
  rationale: Ungkapan Yunani sangat ringkas dan eliptis; ἁλυκόν adalah kata sifat yang dipakai secara substantival. “Air asin” mengungkapkan maknanya tanpa menetapkan secara berlebihan bahwa yang dimaksud pasti mata air.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: menghasilkan air tawar
  rationale: γλυκύς secara harfiah berarti “manis”, tetapi ketika dipertentangkan dengan air asin, padanan idiomatis Indonesianya ialah “tawar”.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί μου
  choice: Saudara-saudaraku
  alternative: Saudara-saudara laki-lakiku
  rationale: Bentuk Yunani memang maskulin, tetapi dapat berfungsi sebagai sapaan representatif kepada komunitas campuran. “Saudara-saudaraku” mempertahankan bentuk sapaan tanpa membatasi pembacanya hanya pada laki-laki.
- issue: Subjek klausa terakhir yang eliptis
  choice: Air asin
  alternative: Mata air asin
  rationale: Ayat sebelumnya berbicara tentang mata air, sehingga “mata air asin” mungkin tersirat. Namun, teks ayat ini sendiri hanya memakai kata sifat “asin” secara substantival dan kemudian menyebut “air”; terjemahan utama mempertahankan ketidakpastian itu dengan “air asin”.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pertanyaan retoris dipertahankan, istilah pertanian dibuat alami bagi pembaca umum, dan bentuk eliptis klausa terakhir tidak ditafsirkan secara berlebihan.
