id: JHN.16.10
reference: John 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: id
  text: dan tentang kebenaran[a], karena Aku pergi kepada Bapa dan kamu tidak melihat Aku lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Yunani ini dapat berarti kebenaran maupun keadilan. Di sini digunakan “kebenaran” karena konteksnya berkaitan dengan peneguhan bahwa Yesus benar ketika Ia pergi kepada Bapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: tentang
  rationale: Menjaga struktur rangkaian pokok dalam ayat 9–11 dan merupakan ungkapan Indonesia yang alami.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam bahasa Indonesia Alkitabiah yang modern, 'kebenaran' dapat menyatakan keadaan atau tindakan yang benar; dalam konteks ini istilah tersebut berkaitan dengan pembenaran atau peneguhan bahwa Yesus benar ketika Ia pergi kepada Bapa. Kemungkinan makna 'keadilan' dipertahankan dalam catatan kaki.
- source_word: δέ
  choice: dan
  rationale: Partikel ini melanjutkan butir berikutnya dalam suatu daftar, bukan menyatakan pertentangan yang kuat.
- source_word: ὅτι
  choice: karena
  rationale: Mempertahankan fungsi kausal yang menjelaskan pokok mengenai kebenaran.
- source_word: πρὸς τὸν πατέρα
  choice: kepada Bapa
  rationale: πρός bersama verba gerak menyatakan arah atau tujuan; teks Yunani menyebut 'Bapa' tanpa kata 'Bapa-Ku'.
- source_word: ὑπάγω
  choice: Aku pergi
  rationale: Bentuk kini memiliki acuan kepergian yang segera atau akan terjadi; ungkapan ini alami dan tidak mempersempit maknanya menjadi sekadar berangkat.
- source_word: οὐκέτι
  choice: tidak ... lagi
  rationale: Secara jelas menyatakan berhentinya keadaan sebelumnya.
- source_word: θεωρεῖτέ
  choice: melihat
  rationale: Dalam konteks ini menunjuk pada tidak lagi memandang atau menyaksikan Yesus; 'melihat' adalah padanan modern yang lugas.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks yang berbobot teologis
  choice: kebenaran
  alternative: keadilan
  rationale: '''Kebenaran'' mempertahankan gagasan tentang apa yang benar dan kemungkinan peneguhan bahwa Yesus benar melalui kepergian-Nya kepada Bapa, tanpa menutup cakupan semantis istilah Yunani. ''Keadilan'' dicantumkan sebagai kemungkinan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kapitalisasi kata ganti 'Aku' mengikuti rujukannya kepada Yesus; 'Bapa' dipertahankan sebagai gelar relasional.
