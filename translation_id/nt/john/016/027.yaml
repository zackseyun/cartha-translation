id: JHN.16.27
reference: John 16:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: id
  text: Sebab Bapa sendiri mengasihi kalian, karena kalian telah mengasihi Aku dan telah percaya bahwa Aku datang dari Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku keluar dari Allah”; ungkapan Yunani ini juga dapat menyiratkan datang dari hadirat Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: Sebab Bapa sendiri
  rationale: Susunan ini mempertahankan fungsi penjelas γάρ serta penekanan αὐτός pada Bapa dengan bahasa Indonesia yang alami.
- source_word: φιλεῖ ὑμᾶς
  choice: mengasihi kalian
  rationale: φιλέω menyatakan kasih atau afeksi pribadi. 'Mengasihi' bermartabat dan wajar dalam konteks ini; 'kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: karena kalian telah mengasihi Aku
  rationale: ὅτι bersifat kausal, sedangkan bentuk perfek πεφιλήκατε menunjukkan kasih yang telah dinyatakan dan tetap relevan. Pronomina eksplisit ὑμεῖς tercermin secara alami dalam 'kalian'.
- source_word: καὶ πεπιστεύκατε
  choice: dan telah percaya
  rationale: Bentuk perfek mempertahankan tindakan percaya yang hasilnya tetap berlangsung; objeknya berupa isi kepercayaan sehingga 'percaya' lebih tepat daripada parafrasa 'memercayai' atau 'menaruh kepercayaan'.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: bahwa Aku datang dari Allah
  rationale: ὅτι memperkenalkan isi kepercayaan. 'Datang dari Allah' menyampaikan asal dan pengutusan tanpa mempersempit cakupan παρά atau menambahkan rumusan doktrinal.
theological_decisions:
- issue: Daya kristologis ungkapan ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: Aku datang dari Allah
  alternative: Aku keluar dari Allah; Aku datang dari hadirat Allah
  rationale: Terjemahan utama mempertahankan bahasa tentang asal dan pengutusan Yesus tanpa menguraikannya menjadi formula teologis yang tidak dinyatakan langsung oleh teks. Catatan kaki menjaga kemungkinan nuansa 'keluar' dan asal dari hadirat Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menandai bentuk jamak orang kedua secara jelas. Huruf kapital pada 'Aku' mengikuti konvensi teks religius Indonesia untuk perkataan Yesus.
