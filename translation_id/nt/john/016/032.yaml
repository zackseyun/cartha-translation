review_pass:
  verdict: revise
  source_fidelity: Draf ini dengan tepat menerjemahkan seruan ἰδού, ketegangan ἔρχεται ... καὶ ἐλήλυθεν, bentuk pasif 'akan tercerai-berai', dan alasan kehadiran Bapa. Namun, 'pergi ke tempatnya sendiri' membatasi τὰ ἴδια pada lokasi, padahal ungkapan itu dapat mencakup segala sesuatu yang menjadi milik atau lingkup masing-masing. Catatan kaki tidak sepenuhnya menghapus pembatasan itu dalam teks utama. 'Bahkan' juga menambahkan penegasan yang tidak dinyatakan oleh καί.
  naturalness: Bahasanya baku, jelas, dan bernada khidmat. 'Masing-masing kepada apa yang menjadi miliknya sendiri' sedikit lebih eksplisit daripada idiom Yunani, tetapi tetap alami dalam Bahasa Indonesia dan menghindari pembatasan pada tempat. Susunan dengan tanda pisah menolong pembaca menangkap ketegangan waktu yang disengaja.
  terminology: Kapitalisasi 'Aku' dan 'Bapa', serta 'Bapa menyertai Aku', sesuai dengan register Alkitab Indonesia dan tidak memaksakan kesimpulan teologis di luar ayat.
  issues:
  - severity: medium
    issue: τὰ ἴδια dibatasi menjadi 'tempatnya sendiri' dalam teks utama.
    rationale: Ungkapan Yunani ini lebih luas daripada tempat atau rumah. Karena keluasan itu merupakan bagian dari makna sumber, teks utama sebaiknya tidak menetapkan referen lokasi; catatan kaki hanya menjelaskan, bukan menggantikan, makna teks utama.
  - severity: low
    issue: '''bahkan'' menambahkan penekanan pada καί.'
    rationale: Kata Yunani καί berarti 'dan' di sini. Kontras waktu yang kuat sudah tampak dari gabungan 'akan datang' dan 'sudah tiba' tanpa penegasan tambahan.
