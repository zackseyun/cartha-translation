id: JHN.16.32
reference: John 16:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: id
  text: Lihatlah, saatnya akan datang—dan sudah tiba—ketika kalian akan tercerai-berai, masing-masing kepada apa yang menjadi miliknya sendiri[a], dan meninggalkan Aku seorang diri. Namun, Aku tidak seorang diri, sebab Bapa menyertai Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “masing-masing kepada miliknya sendiri.” Ungkapan Yunani ini luas dan dapat menunjuk pada rumah, tempat, kepunyaan, atau urusan masing-masing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan nada khidmat tanpa memakai ungkapan Indonesia yang usang.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: saatnya akan tiba, bahkan sudah tiba
  rationale: Menjaga ketegangan antara peristiwa yang segera datang dan yang dalam arti tertentu telah tiba; 'saat' lebih alami daripada 'jam' untuk waktu penentu.
- source_word: ἵνα
  choice: ketika
  rationale: Dalam konstruksi ini memperkenalkan isi atau kejadian yang menandai saat tersebut, sehingga 'ketika' alami dan mempertahankan nuansa waktunya.
- source_word: σκορπισθῆτε
  choice: kalian akan tercerai-berai
  rationale: Mengungkapkan bentuk pasif dan perpisahan para murid dengan bahasa Indonesia yang wajar.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: masing-masing pergi ke tempatnya sendiri
  rationale: Menyampaikan gerak yang tersirat dalam εἰς dan penekanan distributif ἕκαστος; catatan kaki menjaga keluasan τὰ ἴδια yang tidak terbatas pada tempat atau rumah.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: dan meninggalkan Aku seorang diri
  rationale: Menyampaikan tindakan meninggalkan Yesus tanpa memperkuatnya secara berlebihan menjadi 'menelantarkan'.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Namun, Aku tidak seorang diri
  rationale: '''Namun'' mengungkapkan kontras kontekstual antara ditinggalkan para murid dan tetap disertai Bapa.'
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: sebab Bapa menyertai Aku
  rationale: Menyatakan alasan Yesus tidak seorang diri serta mempertahankan gelar relasional 'Bapa'; 'menyertai' secara alami menyampaikan kehadiran bersama.
theological_decisions:
- issue: Cakupan ἕκαστος εἰς τὰ ἴδια
  choice: masing-masing pergi ke tempatnya sendiri[a]
  alternative: masing-masing pulang ke rumahnya sendiri / masing-masing kembali kepada miliknya sendiri
  rationale: Teks utama dibuat alami, sementara catatan mempertahankan keluasan ungkapan Yunani agar tidak dipastikan hanya sebagai rumah.
- issue: Hubungan antara ditinggalkan para murid dan kehadiran Bapa
  choice: Namun, Aku tidak seorang diri, sebab Bapa menyertai Aku
  alternative: Dan Aku tidak seorang diri, karena Bapa ada bersama-Ku
  rationale: Mempertahankan ketegangan bahwa para murid sungguh meninggalkan Yesus, tetapi Ia tidak sepenuhnya sendiri karena kehadiran Bapa, tanpa memasukkan kesimpulan doktrinal dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. 'Kalian' dipakai untuk menandai sapaan jamak kepada para murid; kapitalisasi 'Aku' dan 'Bapa' mengikuti konvensi teks Alkitab Indonesia.
