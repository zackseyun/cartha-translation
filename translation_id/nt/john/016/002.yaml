  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: id
  text: Mereka akan mengucilkan kamu dari sinagoge-sinagoge[a]. Bahkan, saatnya akan tiba ketika setiap orang yang membunuh kamu akan mengira bahwa ia sedang mempersembahkan pelayanan kepada Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mengeluarkan kamu dari sinagoge" atau "menyingkirkan kamu dari komunitas sinagoge."
    reason: lexical_alternative
  - marker: b
    text: Atau "mempersembahkan ibadah kepada Allah" atau "memberikan pelayanan kepada Allah."
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Mereka akan mengucilkan kamu dari sinagoge-sinagoge
  rationale: Adjektiva ἀποσυνάγωγος dengan ποιέω menyatakan tindakan membuat seseorang terusir atau terkucil dari komunitas sinagoge. 'Mengucilkan ... dari' alami dalam bahasa Indonesia dan mempertahankan dimensi sosial-keagamaan serta bentuk jamak sinagoge.
- source_word: ἀλλ’
  choice: Bahkan
  rationale: Di sini ἀλλά meningkatkan bobot pernyataan sebelumnya, bukan sekadar menyatakan pertentangan. 'Bahkan' menyampaikan eskalasi itu secara alami.
- source_word: ἔρχεται ὥρα
  choice: saatnya akan tiba
  rationale: Ungkapan ini menyampaikan datangnya suatu waktu tertentu. 'Saatnya akan tiba' merupakan idiom Indonesia yang wajar dan tetap dekat dengan gambaran waktu dalam teks.
- source_word: ἵνα
  choice: ketika
  rationale: Sesudah ungkapan tentang saat yang akan tiba, ἵνα memperkenalkan isi atau keadaan yang menandai saat tersebut; 'ketika' paling alami dalam bahasa Indonesia.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: setiap orang yang membunuh kamu
  rationale: Konstruksi partisipial substantival ini bersifat generik dan universal. 'Setiap orang yang' mempertahankan daya πᾶς, sedangkan 'kamu' dapat merujuk kepada para murid secara kolektif.
- source_word: δόξῃ
  choice: akan mengira
  rationale: δοκέω di sini menunjuk pada keyakinan atau anggapan subjektif yang keliru; 'mengira' mengungkapkan nuansa tersebut dengan jelas.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: sedang mempersembahkan ibadah kepada Allah
  rationale: λατρεία menunjuk pada pelayanan atau ibadah religius, sedangkan προσφέρειν membawa nuansa mempersembahkan. Gabungan ini menjaga bahasa kultis dan ironi bahwa pembunuh menganggap tindakannya sebagai persembahan bagi Allah.
theological_decisions:
- issue: Pemahaman diri para penganiaya dalam bahasa ibadah
  choice: mempersembahkan ibadah kepada Allah
  alternative: memberikan pelayanan kepada Allah
  rationale: Pilihan ini mempertahankan nuansa kultis λατρεία dan προσφέρειν serta ironi mengejutkan dalam teks, tanpa menyiratkan bahwa Allah menerima atau menyetujui pembunuhan tersebut.
- issue: Rujukan generik pada πᾶς ὁ ἀποκτείνας
  choice: setiap orang yang membunuh kamu ... ia
  alternative: siapa pun yang membunuh kamu ... orang itu
  rationale: Bahasa Indonesia dapat memakai 'ia' sebagai pronomina orang ketiga tunggal tanpa harus menambahkan jenis kelamin yang tidak perlu. Bentuk tunggal dan cakupan universal sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sinagoge' dipertahankan sebagai istilah historis-keagamaan yang tepat. 'Kamu' dipakai untuk ὑμᾶς karena bentuk Indonesia tidak membedakan tunggal dan jamak; konteks menunjukkan para murid sebagai kelompok. Penanda catatan kaki [a] dan [b] muncul dalam teks utama.
