source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: id
  text: Namun, Aku telah mengatakan hal-hal ini kepadamu supaya, ketika waktu mereka tiba, kamu ingat bahwa Aku telah mengatakannya kepadamu. Aku tidak mengatakan hal-hal ini kepadamu sejak semula, karena Aku bersama kamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λελάληκα
  choice: telah mengatakan
  rationale: Bentuk perfektum menunjuk pada perkataan yang sudah disampaikan dan tetap relevan; bentuk ini alami dalam bahasa Indonesia.
- source_word: ταῦτα
  choice: semuanya ini
  rationale: Demonstrativa jamak ini merujuk kembali kepada berbagai peringatan yang baru saja Yesus sampaikan.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan dan merupakan padanan Indonesia yang alami.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: ketika saatnya tiba
  rationale: ὅταν dengan subjungtif menunjuk pada kejadian mendatang; 'saatnya' mempertahankan gagasan waktu yang ditetapkan, sedangkan hubungan pronominal αὐτῶν dijelaskan dalam catatan karena bentuk harfiahnya janggal dalam bahasa Indonesia.
- source_word: μνημονεύητε
  choice: kamu ingat
  rationale: Padanan langsung dan jelas untuk tindakan mengingat kembali.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: bahwa Aku telah mengatakannya kepadamu
  rationale: Mempertahankan klausa isi dengan ὅτι dan menekankan ἐγώ melalui penyebutan eksplisit 'Aku'.
- source_word: ἐξ ἀρχῆς
  choice: sejak semula
  rationale: Padanan idiomatis yang mempertahankan makna temporal 'dari permulaan'.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: Aku masih bersama-sama denganmu
  rationale: Menyampaikan hubungan kehadiran secara langsung; 'masih' memperjelas alasan kontekstual tanpa mengubah maksud kalimat.
theological_decisions:
- issue: Acuan dua kemunculan αὐτῶν
  choice: Teks utama menyajikan makna secara alami sebagai 'ketika saatnya tiba' dan 'Aku telah mengatakannya kepadamu', dengan bentuk Yunani yang lebih harfiah dicatat dalam catatan kaki.
  alternative: “ketika saat mereka tiba, kamu mengingat mereka, bahwa Aku telah mengatakannya kepadamu”
  rationale: SBLGNT memuat dua kemunculan αὐτῶν yang acuan dan hubungannya tidak mudah diungkapkan dengan lancar. Catatan mempertahankan ketegangan tekstual dan sintaktis tanpa memaksakan satu acuan tertentu dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal kepada para murid dinyatakan dengan 'kamu' sebagai bentuk kolektif; kapitalisasi 'Aku' mengikuti konvensi umum bagi ujaran Yesus.
