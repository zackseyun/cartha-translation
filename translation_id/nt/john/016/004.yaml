  to: Namun, Aku telah mengatakan hal-hal ini kepadamu supaya, ketika waktu mereka tiba, kamu ingat bahwa Aku telah mengatakannya kepadamu. Aku tidak mengatakan hal-hal ini kepadamu sejak semula, karena Aku bersama kamu.
