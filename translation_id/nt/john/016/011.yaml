  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: id
  text: dan tentang penghakiman, karena penguasa dunia ini[a][b] telah dihakimi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pangeran dunia ini."
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan besar menunjuk kepada Setan; bandingkan Yohanes 12:31 dan 14:30.
    reason: cross_reference
  - marker: c
    text: Atau "tetap berada di bawah penghakiman." Bentuk perfek Yunani menekankan penghakiman yang telah terjadi dan akibatnya yang tetap berlaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: dan tentang penghakiman
  rationale: περί dengan genitif memperkenalkan pokok pembicaraan, sedangkan δέ melanjutkan rangkaian sebelumnya. "Tentang penghakiman" mempertahankan istilah κρίσις secara langsung dan sesuai dengan rangkaian "dosa ... kebenaran ... penghakiman".
- source_word: ὅτι
  choice: karena
  rationale: Dalam klausa penjelas ini, ὅτι menyatakan alasan. "Karena" mengungkapkan hubungan kausal itu secara alami dalam bahasa Indonesia.
- source_word: ὁ ἄρχων
  choice: penguasa
  rationale: ἄρχων menunjuk kepada sosok yang memerintah atau menjalankan kekuasaan. "Penguasa" jelas dalam bahasa Indonesia modern dan tidak menimbulkan kesan bahwa yang dimaksud ialah seorang putra raja.
- source_word: τοῦ κόσμου τούτου
  choice: dunia ini
  rationale: κόσμος lazim berarti "dunia" dalam Injil Yohanes, termasuk tatanan dunia yang menentang Allah. Frasa ini mengikuti bentuk Yunani secara wajar.
- source_word: κέκριται
  choice: telah dihakimi
  rationale: Bentuk perfek pasif dari κρίνω menyatakan tindakan penghakiman yang sudah terjadi dengan akibat yang tetap berlaku. "Telah dihakimi" mempertahankan bentuk pasif dan tidak mempersempit maknanya menjadi "telah dihukum".
theological_decisions:
- issue: Identitas dan arti sebutan "penguasa dunia ini"
  choice: Mempertahankan sebutan itu tanpa menyebut Satan secara eksplisit dalam teks utama.
  alternative: Menerjemahkan secara interpretatif sebagai "Satan, penguasa dunia ini".
  rationale: Dalam Injil Yohanes, ungkapan ini umumnya dipahami sebagai sebutan bagi Satan (bandingkan Yohanes 12:31; 14:30), tetapi ayat ini sendiri memakai gelar, bukan nama diri. Teks utama karena itu mempertahankan ungkapan aslinya, sedangkan identifikasinya dijelaskan dalam catatan.
- issue: Nuansa κέκριται
  choice: Menerjemahkan "telah dihakimi".
  alternative: '"telah dihukum" atau "sudah berada di bawah hukuman".'
  rationale: κρίνω menyatakan penghakiman; konteks dapat menyiratkan keputusan yang menghukum, tetapi kata Yunani itu sendiri tidak perlu dipersempit menjadi penghukuman. Bentuk perfeknya tetap tercermin melalui "telah" dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan bentuk klausa lanjutan dari konteks sebelumnya. Istilah "penghakiman" dipilih demi kesinambungan teologis dan leksikal, sedangkan "penguasa" lebih alami dan tepat daripada "pangeran".
