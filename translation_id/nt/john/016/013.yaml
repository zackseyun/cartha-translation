id: JHN.16.13
reference: John 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: id
  text: Namun, ketika Dia, yaitu Roh Kebenaran, datang, Dia akan menuntun kalian ke dalam seluruh kebenaran itu.[a] Sebab, Dia tidak akan berbicara dari diri-Nya sendiri,[b] melainkan apa pun yang Dia dengar akan dikatakan-Nya. Dia juga akan memberitahukan kepada kalian hal-hal yang akan datang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di dalam seluruh kebenaran itu.” Secara harfiah, bahasa Yunani memakai preposisi yang biasanya berarti “di dalam”, tetapi bersama kata “menuntun” frasa itu dapat dipahami secara terarah: “ke dalam”.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “atas kehendak-Nya sendiri.” Secara harfiah: “dari diri-Nya sendiri.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “apa yang akan datang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Namun, ketika
  rationale: ὅταν memperkenalkan waktu yang akan datang, sedangkan δέ membawa peralihan atau kontras ringan dengan konteks sebelumnya.
- source_word: ἔλθῃ ἐκεῖνος
  choice: ketika Dia ... datang
  rationale: Aoristus subjungtif sesudah ὅταν secara alami menunjuk pada kedatangan mendatang. Kata tunjuk maskulin ἐκεῖνος mempertahankan rujukan personal kepada Roh.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roh Kebenaran
  rationale: Frasa ini merupakan sebutan khas dalam Injil Yohanes. Bentuk genitif dipertahankan secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: ὁδηγήσει
  choice: akan menuntun
  rationale: ὁδηγέω berarti membimbing atau memimpin di suatu jalan; 'menuntun' mempertahankan metafora pengarahan.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: ke dalam seluruh kebenaran
  rationale: Walaupun ἐν biasanya berarti 'di dalam', bersama ὁδηγέω frasa ini dapat dipahami secara terarah. 'Seluruh kebenaran' mempertahankan cakupan πάσῃ dan ketentuan artikelnya.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: Sebab, Dia tidak akan berbicara dari diri-Nya sendiri
  rationale: Terjemahan ini mempertahankan citra sumber atau asal dalam ἀφ’ ἑαυτοῦ tanpa menambah gagasan 'wewenang' yang tidak dinyatakan secara eksplisit.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: melainkan apa pun yang didengar-Nya, itulah yang akan dikatakan-Nya
  rationale: Susunan ini mempertahankan kontras dan penekanan pada segala sesuatu yang didengar sebelum disampaikan.
- source_word: τὰ ἐρχόμενα
  choice: hal-hal yang akan datang
  rationale: Partisipel berartikel menunjuk pada berbagai kenyataan atau peristiwa mendatang tanpa membatasi rujukannya.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: akan memberitahukan kepada kalian
  rationale: ἀναγγέλλω berarti mengumumkan, melaporkan, atau memberitahukan. Pilihan ini alami dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan personal bagi Roh
  choice: Menggunakan 'Dia' dan akhiran pronominal '-Nya'
  alternative: Menghindari pronomina dengan mengulang 'Roh'
  rationale: ἐκεῖνος berbentuk maskulin dan memperlakukan Roh sebagai rujukan personal. Bahasa Indonesia tidak membedakan gender pada pronomina, tetapi 'Dia' tetap mempertahankan personalitas tersebut.
- issue: Makna ἐν τῇ ἀληθείᾳ πάσῃ
  choice: ke dalam seluruh kebenaran
  alternative: di dalam seluruh kebenaran
  rationale: Pilihan utama menyampaikan arah metaforis yang dapat muncul bersama kata kerja 'menuntun', sedangkan bentuk yang lebih formal bagi ἐν dicatat dalam catatan kaki agar ambiguitas sumber tetap terlihat.
- issue: Makna ἀφ’ ἑαυτοῦ
  choice: dari diri-Nya sendiri
  alternative: atas kehendak-Nya sendiri
  rationale: Bentuk harfiah mempertahankan hubungan asal atau ketergantungan dalam teks dan tidak mempersempitnya menjadi kehendak atau wewenang saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Kalian' dipakai untuk menandai bahwa ὑμᾶς/ὑμῖν berbentuk jamak. Kapitalisasi 'Dia', 'Roh Kebenaran', dan '-Nya' mengikuti konvensi penghormatan yang lazim dalam terjemahan Alkitab bahasa Indonesia tanpa menambahkan pembedaan gender yang tidak dimiliki bahasa Indonesia.
