id: JHN.16.20
reference: John 16:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: kamu akan menangis dan meratap, tetapi dunia akan bersukacita. Kamu akan berdukacita, tetapi dukacitamu akan menjadi sukacita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dukacitamu akan berubah menjadi sukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang khidmat dan tegas dalam rumusan Yohanes, dengan bahasa Indonesia yang wajar dan transparan.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mencerminkan rumusan sapaan langsung Yunani dan mempertahankan gaya khas perkataan Yesus dalam Injil Yohanes.
- source_word: κλαύσετε
  choice: kamu akan menangis
  rationale: Menyampaikan ungkapan kesedihan secara langsung serta tetap dibedakan dari θρηνήσετε.
- source_word: θρηνήσετε
  choice: meratap
  rationale: Menggambarkan perkabungan atau ungkapan duka yang nyata dan mempertahankan perbedaan makna dengan 'menangis'.
- source_word: ὁ δὲ κόσμος
  choice: tetapi dunia
  rationale: Mempertahankan istilah luas khas Yohanes dan pertentangan yang ditandai δέ tanpa menambahkan penafsiran ke dalam teks.
- source_word: χαρήσεται
  choice: akan bersukacita
  rationale: Mengungkapkan kontras kuat dengan dukacita para murid dan menjaga kaitan makna dengan χαρά pada akhir ayat.
- source_word: λυπηθήσεσθε
  choice: kamu akan berdukacita
  rationale: Padanan alami dalam bahasa Indonesia untuk keadaan sedih yang dinyatakan verba ini, sekaligus menjaga kaitannya dengan nomina λύπη.
- source_word: ἡ λύπη ὑμῶν
  choice: dukacitamu
  rationale: Menjaga hubungan leksikal dengan 'berdukacita' dan menyampaikan kesedihan mendalam secara ringkas serta bermartabat.
- source_word: εἰς χαρὰν γενήσεται
  choice: akan menjadi sukacita
  rationale: Mengikuti gerak perubahan yang dinyatakan oleh εἰς bersama γενήσεται tanpa menjelaskan lebih jauh sifat perubahan tersebut.
theological_decisions:
- issue: Pemakaian κόσμος dalam Injil Yohanes
  choice: dunia
  alternative: dunia yang tidak percaya; sistem dunia
  rationale: Ayat ini mempertentangkan dunia dengan para murid, tetapi tidak secara eksplisit membatasi arti istilah itu. Padanan umum mempertahankan keluasan dan ketegangan teologis teks.
- issue: Sifat perubahan dukacita menjadi sukacita
  choice: dukacitamu akan menjadi sukacita
  alternative: dukacitamu akan berubah menjadi sukacita
  rationale: Rumusan utama mengikuti konstruksi Yunani secara dekat dan tidak menentukan apakah dukacita itu sendiri diubah atau digantikan; alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Pengulangan pembuka serta pasangan 'menangis dan meratap' dipertahankan untuk mencerminkan penekanan dan struktur sumber.
