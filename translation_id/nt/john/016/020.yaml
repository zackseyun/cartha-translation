  source_fidelity: 'Terjemahan dengan tepat mencerminkan seluruh struktur dan makna Yunani: penegasan ganda ἀμὴν ἀμὴν, dua ungkapan dukacita κλαύσετε dan θρηνήσετε, kontras dengan κόσμος yang bersukacita, serta perubahan λύπη menjadi χαρά. Nuansa luas κόσμος dipertahankan tanpa penafsiran tambahan.'
