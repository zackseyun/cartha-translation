id: JHN.16.29
reference: John 16:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: id
  text: Murid-murid-Nya berkata, “Lihatlah, sekarang Engkau berbicara dengan terus terang[a] dan sama sekali tidak menggunakan bahasa kiasan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “secara terbuka” atau “dengan jelas.” Ungkapan Yunani ini dapat menunjuk pada perkataan yang terbuka, jelas, atau terus terang.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “peribahasa,” “perumpamaan,” atau “perkataan terselubung.” Di sini istilah itu menunjuk pada bahasa figuratif atau tidak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: berkata
  rationale: Kala kini historis dialihkan menjadi bentuk naratif lampau yang alami dalam bahasa Indonesia tanpa mengubah fungsi wacananya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Murid-murid-Nya
  rationale: Bentuk posesif yang wajar dan ringkas dalam bahasa Indonesia, dengan rujukan kepada Yesus tetap jelas.
- source_word: Ἴδε
  choice: Lihatlah
  rationale: Mempertahankan fungsi sebagai seruan untuk menarik perhatian; bentuk ini jelas dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: νῦν
  choice: sekarang
  rationale: Menyatakan bahwa para murid memandang cara Yesus berbicara pada saat itu sebagai suatu perubahan.
- source_word: ἐν παρρησίᾳ
  choice: dengan terus terang
  rationale: Dalam pertentangannya dengan παροιμία, ungkapan ini terutama menunjuk pada cara berbicara yang terbuka, jelas, dan tidak terselubung.
- source_word: λαλεῖς
  choice: Engkau berbicara
  rationale: Kala kini dipertahankan karena para murid sedang mengomentari cara Yesus berbicara pada saat itu; pronomina hormat bertanda kapital mengikuti konvensi Alkitab bahasa Indonesia.
- source_word: παροιμίαν
  choice: bahasa kiasan
  rationale: Dalam konteks Yohanes, kata ini menunjuk pada perkataan figuratif atau tidak langsung, bukan hanya peribahasa dalam arti sempit.
- source_word: οὐδεμίαν
  choice: sama sekali tidak
  rationale: Mengungkapkan negasi yang tegas dan menyeluruh secara alami dalam bahasa Indonesia.
- source_word: λέγεις
  choice: menggunakan
  rationale: Walaupun secara harfiah berarti 'mengatakan', verba 'menggunakan' lebih idiomatis ketika objeknya diterjemahkan sebagai 'bahasa kiasan'.
theological_decisions:
- issue: Makna παρρησία dalam pertentangannya dengan παροιμία
  choice: Yesus digambarkan berbicara terus terang, bukan dengan bahasa kiasan atau perkataan tidak langsung.
  alternative: Yesus berbicara dengan berani atau tanpa takut.
  rationale: Pertentangan langsung dengan παροιμίαν οὐδεμίαν lebih mendukung keterusterangan dan kejelasan cara menyampaikan daripada keberanian sebagai pokok utama. Pilihan ini bersifat leksikal-kontekstual dan tidak menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Lihatlah” mempertahankan seruan perhatian dari teks Yunani, sedangkan “sama sekali tidak menggunakan bahasa kiasan” menyampaikan negasi tegas secara idiomatis. Semua penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
