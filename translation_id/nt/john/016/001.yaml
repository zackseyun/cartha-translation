  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: id
  text: Hal-hal ini telah Kukatakan kepadamu supaya kamu tidak tersandung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jatuh,” “dibuat tersandung,” atau “tersinggung.” Dalam konteks ini, kata Yunani tersebut dapat mengacu pada menjadi goyah dalam iman atau berpaling dari iman.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Hal-hal ini
  rationale: Mempertahankan bentuk jamak netral yang merujuk pada perkataan Yesus sebelumnya; dalam bahasa Indonesia, ungkapan ini lebih alami daripada terjemahan kaku yang tetap menjaga rujukan jamaknya.
- source_word: λελάληκα
  choice: telah Kukatakan
  rationale: Bentuk perfektum λαλέω menunjukkan tindakan yang telah dilakukan dengan relevansi yang tetap berlangsung. 'Telah Kukatakan' alami dalam wacana Indonesia dan sesuai untuk perkataan langsung Yesus.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Pronomina orang kedua jamak; bahasa Indonesia tidak wajib membedakan tunggal dan jamak pada bentuk ini, dan konteks menunjukkan bahwa para muridlah yang disapa.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menyampaikan klausa tujuan negatif secara alami dan tepat dalam bahasa Indonesia.
- source_word: σκανδαλισθῆτε
  choice: tersandung
  rationale: 'Mempertahankan metafora dasar σκανδαλίζω dan ambiguitasnya: terguncang, terjerat, atau sampai meninggalkan iman. Konteks penganiayaan memberi bobot rohani yang dijelaskan dalam catatan kaki tanpa mempersempit teks utama.'
theological_decisions:
- issue: Makna σκανδαλισθῆτε dalam konteks pemuridan dan penganiayaan
  choice: tidak tersandung
  alternative: tidak meninggalkan iman; tidak jatuh; tidak menjadi murtad
  rationale: '''Tersandung'' mempertahankan gambaran leksikal dan ketegangan teologis teks Yunani. Konteks Yohanes 16:2 memungkinkan akibat yang berat, termasuk goyah atau meninggalkan iman, tetapi teks utama tidak perlu menetapkan akibat paling ekstrem sebagai satu-satunya arti.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kapitalisasi pada 'Kukatakan' mengikuti konvensi penghormatan bagi ucapan Yesus. Metafora 'tersandung' dipertahankan dalam teks utama, sedangkan cakupan makna rohaninya dijelaskan dalam catatan kaki.
