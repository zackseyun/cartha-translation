id: JHN.16.15
reference: John 16:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: id
  text: Segala sesuatu yang dimiliki Bapa adalah milik-Ku. Itulah sebabnya Aku berkata bahwa Dia mengambil[a] dari apa yang menjadi milik-Ku dan akan menyatakannya kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerima.”
    reason: Alternatif leksikal bagi λαμβάνει; kata Yunani ini dapat berarti 'mengambil' atau 'menerima' dalam konteks ini.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Segala sesuatu yang
  rationale: Ungkapan ini bersifat menyeluruh dan menegaskan cakupan total; bentuk ini alami dalam bahasa Indonesia serta mempertahankan daya tekan teks Yunani.
- source_word: ἔχει
  choice: dimiliki
  rationale: Dalam konstruksi relatif bahasa Indonesia, 'yang dimiliki Bapa' lebih alami daripada 'yang Bapa punya' dan tetap menyampaikan makna kepunyaan tanpa berlebihan.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Dalam konteks Yohanes, kata ini merupakan sebutan bagi Allah. 'Bapa' adalah bentuk baku dan bermartabat dalam bahasa Indonesia.
- source_word: ἐμά
  choice: milik-Ku
  rationale: Bentuk posesif predikatif ini menyatakan bahwa semuanya adalah kepunyaan Yesus. 'Milik-Ku' langsung, alami, dan mempertahankan kuatnya pernyataan tersebut.
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Penghubung ini memperkenalkan alasan atau kesimpulan dari pernyataan sebelumnya; terjemahan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: εἶπον
  choice: Aku berkata
  rationale: Aoristus diterjemahkan dengan bentuk lampau kontekstual yang alami; bahasa Indonesia tidak memerlukan perubahan bentuk verba untuk menandai kala.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: dari apa yang menjadi milik-Ku
  rationale: Ungkapan Yunani ini eliptis. Terjemahan tersebut melengkapinya secara alami tanpa menentukan secara lebih sempit apa yang diterima atau diambil Roh.
- source_word: λαμβάνει
  choice: mengambil
  rationale: Kata ini dapat berarti 'mengambil' atau 'menerima'. 'Mengambil' mempertahankan padanan langsung, sedangkan kemungkinan makna reseptif dicantumkan dalam catatan kaki.
- source_word: ἀναγγελεῖ
  choice: akan menyatakannya
  rationale: Bentuk mendatang dipertahankan. 'Menyatakan' sesuai dengan konteks pewahyuan dan lebih kuat daripada sekadar 'memberi tahu'.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina Yunani ini berbentuk jamak. 'Kalian' menyatakan jumlah jamak secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan antara segala yang dimiliki Bapa dan Anak
  choice: Segala sesuatu yang dimiliki Bapa adalah milik-Ku
  alternative: Segala sesuatu yang dimiliki Bapa adalah kepunyaan-Ku
  rationale: Terjemahan mempertahankan pernyataan kuat bahwa segala milik Bapa adalah milik Anak, tanpa menambahkan rumusan teologis yang tidak dinyatakan langsung dalam ayat.
- issue: Cara Roh memperoleh dari milik Anak
  choice: Dia mengambil dari apa yang menjadi milik-Ku
  alternative: Dia menerima dari apa yang menjadi milik-Ku
  rationale: λαμβάνει memungkinkan nuansa aktif 'mengambil' maupun reseptif 'menerima'. Teks utama memakai padanan langsung, sementara catatan kaki mempertahankan alternatif agar ketegangan maknanya tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada Aku, Dia, dan -Ku mengikuti penggunaan pronomina ilahi dalam konteks ini. 'Kalian' dipakai untuk memperjelas bahwa ὑμῖν berbentuk jamak.
