source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: id
  text: Hal-hal ini telah Kukatakan kepadamu dengan bahasa kiasan.[a] Saatnya akan tiba ketika Aku tidak lagi berbicara kepadamu dengan bahasa kiasan, melainkan dengan terus terang[b] akan memberitahukan kepadamu tentang Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan perumpamaan” atau “dengan perkataan terselubung”; kata Yunani ini menunjuk pada cara berbicara yang figuratif atau tidak langsung.
    reason: lexical_alternative
  - marker: b
    text: Atau “secara terbuka” atau “dengan jelas”; di sini maksudnya ialah berbicara secara langsung, bukan dengan bahasa kiasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: dengan bahasa kiasan
  rationale: Dalam pemakaian Yohanes, kata ini menunjuk pada perkataan figuratif atau tidak langsung, bukan terutama perumpamaan dalam arti teknis. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kesan makna yang terselubung.
- source_word: λελάληκα
  choice: telah Kukatakan
  rationale: Bentuk perfektum menyatakan perkataan yang sudah disampaikan dan tetap relevan. Bentuk ini juga wajar dalam bahasa Indonesia.
- source_word: ἔρχεται ὥρα
  choice: Saatnya akan tiba
  rationale: Terjemahan ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa waktu yang ditetapkan dan bobot teologis ὥρα dalam Injil Yohanes, tanpa memaksakan artikel tertentu.
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Padanan langsung dan alami untuk penyangkalan berkelanjutan dalam pernyataan tentang masa depan.
- source_word: λαλήσω
  choice: Aku ... berbicara
  rationale: Menjaga penekanan pada tindakan berbicara dan menghasilkan susunan Indonesia yang alami.
- source_word: παρρησίᾳ
  choice: dengan terus terang
  rationale: Dalam kontras dengan bahasa kiasan, frasa ini menyampaikan keterbukaan dan kejelasan, bukan terutama keberanian di muka umum.
- source_word: ἀπαγγελῶ
  choice: akan memberitahukan
  rationale: Menyampaikan tindakan mengungkapkan atau menyatakan informasi secara langsung; cukup bermartabat dan sesuai dengan objek 'tentang Bapa'.
- source_word: περὶ τοῦ πατρὸς
  choice: tentang Bapa
  rationale: Padanan yang jelas dan alami serta mempertahankan sebutan relasional dan teologis bagi Allah.
theological_decisions:
- issue: Makna ὥρα dalam konteks Yohanes
  choice: Saatnya akan tiba
  alternative: Suatu waktu akan tiba; suatu jam akan tiba
  rationale: Pilihan ini mempertahankan gaung waktu yang ditetapkan dalam Injil Yohanes, tetapi memakai idiom Indonesia yang alami dan tidak mengubahnya menjadi penunjuk waktu harfiah selama enam puluh menit.
- issue: Makna παρρησίᾳ sebagai lawan ἐν παροιμίαις
  choice: dengan terus terang
  alternative: secara terbuka; dengan jelas
  rationale: Konteks menekankan komunikasi langsung sebagai lawan perkataan figuratif atau terselubung. Pilihan ini tidak mengimpor gagasan keberanian publik yang tidak menjadi fokus utama ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus serta sebutan Bapa mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Penempatan catatan kaki langsung sesudah unsur yang dijelaskan.
