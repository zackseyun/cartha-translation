id: JHN.16.33
reference: John 16:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: id
  text: Hal-hal ini telah Kukatakan kepadamu supaya di dalam Aku kamu memiliki damai. Di dunia kamu mengalami kesesakan[a], tetapi tabahkanlah hatimu[b]; Aku telah mengalahkan dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kesusahan,” “penderitaan,” atau “tekanan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kuatkanlah hatimu” atau “beranilah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: Hal-hal ini
  rationale: Bentuk jamak menunjuk kembali kepada perkataan-perkataan Yesus sebelumnya; terjemahan ini mempertahankan rujukan jamaknya.
- source_word: λελάληκα
  choice: telah Kukatakan
  rationale: Bentuk perfektum menyatakan tindakan yang sudah selesai dengan dampak yang tetap berlaku. Dalam bahasa Indonesia, 'mengatakan' lebih alami daripada 'berbicara' ketika objeknya adalah 'hal-hal ini'.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan dengan cara yang alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐν ἐμοὶ
  choice: di dalam Aku
  rationale: Mempertahankan ungkapan khas Yohanes mengenai keberadaan atau relasi 'di dalam' Yesus tanpa mempersempitnya menjadi 'melalui Aku' atau memperluasnya secara tafsiriah.
- source_word: εἰρήνην ἔχητε
  choice: kamu memiliki damai
  rationale: '''Memiliki damai'' mempertahankan makna dasar ἔχω dan menyampaikan keadaan damai yang terus dimiliki, tanpa menambahkan gagasan bahwa damai itu baru diperoleh pada saat tersebut.'
- source_word: ἐν τῷ κόσμῳ
  choice: Di dunia
  rationale: Mempertahankan istilah penting κόσμος serta kontras langsung antara 'di dalam Aku' dan 'di dunia'.
- source_word: θλῖψιν ἔχετε
  choice: kamu mengalami kesesakan
  rationale: '''Mengalami'' merupakan padanan Indonesia yang alami bagi ungkapan harfiah ''memiliki kesesakan''. ''Kesesakan'' mempertahankan bobot tekanan, penderitaan, dan keadaan sulit dalam θλῖψις.'
- source_word: θαρσεῖτε
  choice: tabahkanlah hatimu
  rationale: Imperatif ini menyerukan keberanian dan keteguhan dalam menghadapi kesesakan. Ungkapan tersebut alami, bermartabat, dan sesuai dengan konteks penguatan hati.
- source_word: νενίκηκα
  choice: Aku telah mengalahkan
  rationale: Bentuk perfektum dipertahankan dengan 'telah', yang menyatakan kemenangan tuntas dengan akibat yang tetap berlaku. 'Mengalahkan' menyampaikan kemenangan tegas tanpa menambahkan citra militer yang tidak perlu.
theological_decisions:
- issue: Makna κόσμος dalam konteks Yohanes
  choice: Kedua kemunculannya diterjemahkan sebagai 'dunia'.
  alternative: '''tatanan dunia'' atau ''dunia yang berdosa'''
  rationale: '''Dunia'' membiarkan konteks menyampaikan tatanan manusia yang berlawanan dengan Allah, tanpa membatasi keluasan makna istilah Yohanes melalui parafrasa teologis.'
- issue: Daya bentuk perfektum pada λελάληκα dan νενίκηκα
  choice: 'Keduanya diterjemahkan dengan penanda perfektif ''telah'': ''telah Kukatakan'' dan ''telah mengalahkan''.'
  alternative: 'Tanpa ''telah'': ''Kukatakan'' dan ''Aku mengalahkan'''
  rationale: Pilihan ini mempertahankan tindakan yang telah tuntas beserta relevansi atau hasilnya yang terus berlaku, termasuk ketegangan naratif bahwa Yesus menyatakan kemenangan sebelum penyaliban terjadi dalam alur cerita.
- issue: Hubungan antara damai di dalam Yesus dan kesesakan di dunia
  choice: Kontras dipertahankan secara langsung tanpa menjelaskan bagaimana keduanya dapat hadir bersamaan.
  alternative: Menambahkan penjelasan bahwa damai bersifat batiniah atau rohani
  rationale: Teks menempatkan damai dan kesesakan berdampingan. Menentukan damai hanya sebagai keadaan batiniah akan menyelesaikan ketegangan teologis yang sengaja dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan 'di dalam Aku' sengaja dipertahankan untuk menjaga ungkapan khas Yohanes, sedangkan 'mengalami kesesakan' dipilih daripada bentuk harfiah yang kurang alami 'memiliki kesesakan'.
