  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: id
  text: 'Pada hari itu kalian tidak akan menanyakan apa pun kepada-Ku.[a] Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: Apa pun yang kalian minta kepada Bapa dalam nama-Ku, Bapa akan memberikannya kepada kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang pertama di sini, ἐρωτάω, dapat berarti “bertanya” atau “meminta”. Dalam klausa berikutnya dipakai kata lain, αἰτέω, yang lebih khusus berarti “meminta” atau “memohon”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Pada hari itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tetap mempertahankan gema khas Yohanes mengenai 'hari itu'.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: kamu tidak akan menanyakan apa pun kepada-Ku
  rationale: Kata 'menanyakan' menampilkan nuansa ἐρωτάω sebagai bertanya atau mengajukan pertanyaan kepada Yesus, sekaligus membedakannya dari permohonan kepada Bapa dalam klausa berikutnya.
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang khas dan bersifat tegas, dengan bahasa Indonesia yang jelas serta bermartabat.
- source_word: ἄν τι αἰτήσητε
  choice: Apa pun yang kamu minta
  rationale: Menyampaikan cakupan tak tentu dari ἄν τι secara wajar tanpa menambahkan syarat yang tidak dinyatakan secara eksplisit.
- source_word: τὸν πατέρα
  choice: kepada Bapa
  rationale: Mempertahankan sebutan definitif 'Bapa' tanpa menambahkan kata milik yang tidak terdapat dalam teks Yunani.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Mempertahankan ungkapan penting dalam Injil Yohanes dan ambiguitas cakupan sintaksisnya tanpa parafrasa teologis.
- source_word: δώσει ὑμῖν
  choice: akan diberikan-Nya kepadamu
  rationale: Bentuk inversi ini alami dalam ragam Alkitab Indonesia, mempertahankan Bapa sebagai pelaku yang tersirat, dan tidak memasukkan objek eksplisit yang tidak ada dalam klausa Yunani.
theological_decisions:
- issue: Perbedaan antara ἐρωτάω kepada Yesus dan αἰτέω kepada Bapa
  choice: Menerjemahkan yang pertama 'menanyakan' dan yang kedua 'meminta'.
  alternative: Menerjemahkan keduanya dengan 'meminta' lalu menjelaskan perbedaannya hanya dalam catatan kaki.
  rationale: 'Bahasa Indonesia dapat mempertahankan perbedaan leksikal secara alami: konteks pertama berkaitan dengan pertanyaan kepada Yesus, sedangkan yang kedua dengan permohonan kepada Bapa. Catatan kaki tetap mengakui rentang arti ἐρωτάω.'
- issue: Cakupan janji mengenai permintaan dalam nama Yesus
  choice: Menyatakan janji secara langsung tanpa menambahkan pembatas teologis.
  alternative: Memparafrasakan janji sebagai permintaan yang sesuai dengan kehendak Yesus.
  rationale: Ayat ini sendiri tidak menyatakan pembatas tersebut secara eksplisit; terjemahan mempertahankan ketegangan teologis dan menyerahkan penafsirannya kepada konteks yang lebih luas.
- issue: Keterkaitan frasa ἐν τῷ ὀνόματί μου
  choice: Dalam teks utama, menempatkan 'dalam nama-Ku' bersama permintaan kepada Bapa.
  alternative: 'Mengaitkannya dengan tindakan Bapa memberi: ''Bapa akan memberikannya kepadamu dalam nama-Ku.'''
  rationale: Susunan ini merupakan pembacaan yang lazim dan koheren, tetapi varian tekstual serta tanda baca memungkinkan keterkaitan alternatif; karena itu alternatif didokumentasikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'kamu', sesuai bentuk Yunani jamak yang ditujukan kepada para murid sebagai kelompok tetapi lazim diungkapkan secara kolektif dalam bahasa Indonesia. Bentuk hormat bagi pribadi ilahi ditandai dengan huruf kapital pada pronomina terikat. Diksi dibuat wajar dan bermartabat tanpa mempertajam janji doa dengan syarat doktrinal yang tidak eksplisit.
