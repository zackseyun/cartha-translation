source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: id
  text: 'Namun, Aku mengatakan yang sebenarnya kepada kalian: kepergian-Ku lebih baik bagi kalian. Sebab, jika Aku tidak pergi, Sang Penolong[a] sama sekali tidak akan datang kepada kalian. Namun, jika Aku pergi, Aku akan mengutus Dia kepada kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Sang Pembela,” “Penasihat,” atau “Penghibur”; Yunani: Parakletos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan dukacita para murid dalam konteks sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: Aku mengatakan yang sebenarnya kepada kalian
  rationale: Mempertahankan penegasan bahwa perkataan Yesus benar, dengan susunan yang alami dan jelas.
- source_word: συμφέρει ὑμῖν
  choice: lebih baik bagi kalian
  rationale: Menyampaikan gagasan manfaat atau keuntungan bagi para murid secara idiomatis.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: jika Aku pergi
  rationale: Dalam konstruksi sesudah συμφέρει, frasa ini menyatakan hal yang menguntungkan. 'Jika' menghasilkan ungkapan Indonesia yang alami tanpa mengubah hubungan maknanya.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Sebab, jika Aku tidak pergi
  rationale: Mempertahankan struktur bersyarat, fungsi penjelas γάρ, dan pengulangan kata kerja ἀπέρχομαι.
- source_word: ὁ παράκλητος
  choice: Sang Penolong
  rationale: παράκλητος menunjuk pada pribadi yang hadir untuk menolong, mewakili, menasihati, atau membela. 'Penolong' cukup luas dan mudah dipahami; alternatif penting dicatat dalam catatan kaki.
- source_word: οὐ μὴ ἔλθῃ
  choice: sama sekali tidak akan datang
  rationale: Mengungkapkan negasi kuat οὐ μή dengan jelas tanpa memakai gaya arkais.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Menyatakan gerak menuju para murid dan memperjelas bahwa orang kedua jamak sedang disapa.
- source_word: ἐὰν δὲ πορευθῶ
  choice: Namun, jika Aku pergi
  rationale: δέ menyatakan kontras dengan syarat sebelumnya, sedangkan πορεύομαι secara alami diterjemahkan 'pergi' dalam konteks ini.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: Aku akan mengutus Dia kepada kalian
  rationale: Mengungkapkan tindakan mengirim serta mempertahankan rujukan personal maskulin αὐτόν kepada Sang Penolong.
theological_decisions:
- issue: Penerjemahan παράκλητος dalam wacana Yohanes
  choice: Sang Penolong
  alternative: Sang Pembela; Penasihat; Penghibur; Parakletos
  rationale: Tidak ada satu padanan Indonesia yang mencakup seluruh rentang makna istilah ini. 'Penolong' mempertahankan cakupan fungsi yang luas dan mudah dipahami, sementara kemungkinan nuansa hukum, nasihat, dan penghiburan disimpan dalam catatan kaki.
- issue: Rujukan personal kepada παράκλητος
  choice: Dia
  alternative: itu
  rationale: Bentuk αὐτόν merujuk secara personal kepada παράκλητος dalam gambaran seorang yang diutus dan datang. 'Dia' mempertahankan sifat personal itu tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan dalam ayat.
- issue: Kekuatan negasi οὐ μή
  choice: sama sekali tidak akan datang
  alternative: tidak akan datang
  rationale: Negasi ganda dengan subjungtif bersifat tegas; terjemahan mempertahankan penekanan tersebut tanpa menafsirkannya sebagai pernyataan temporal 'tidak pernah' yang dapat terdengar lebih mutlak dari konstruksinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμῖν/ὑμᾶς. Huruf kapital pada Aku dan Dia mengikuti kebiasaan umum teks keagamaan Indonesia dan membantu memperjelas rujukan tanpa menambah gelar yang tidak ada dalam teks Yunani.
