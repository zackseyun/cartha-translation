  yaml_path: translation/nt/john/016/031.yaml
  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: id
  text: Yesus menjawab mereka, “Sekarang kalian percaya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sekarang kalian percaya.” Teks Yunani dapat dibaca sebagai pernyataan, meskipun konteks lebih mendukung pertanyaan retoris.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Bentuk aoris naratif dari ἀποκρίνομαι; “menjawab” merupakan padanan Indonesia yang alami dan lazim dalam konteks percakapan.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif jamak sebagai objek tak langsung; dalam bahasa Indonesia wajar diungkapkan dengan “menjawab mereka”.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Nama diri ditransliterasikan sesuai bentuk baku dalam bahasa Indonesia.
- source_word: Ἄρτι
  choice: sekarang
  rationale: Menunjukkan waktu kini yang langsung; “sekarang” ringkas, alami, dan mempertahankan penekanan temporal.
- source_word: πιστεύετε
  choice: kalian percaya
  rationale: Bentuk kini aktif indikatif orang kedua jamak dari πιστεύω; “kalian percaya” menyatakan subjek jamak secara jelas dan mempertahankan arti dasarnya.
theological_decisions:
- issue: Daya ujar Ἄρτι πιστεύετε;
  choice: 'Diterjemahkan sebagai pertanyaan retoris: “Sekarang kalian percaya?”'
  alternative: “Sekarang kalian percaya.”
  rationale: Teks Yunani dapat dibaca sebagai pertanyaan atau pernyataan karena naskah kuno tidak menyediakan tanda baca asli. Konteks ayat berikutnya, yang menyatakan bahwa para murid akan tercerai-berai, lebih mendukung pertanyaan retoris, sambil mempertahankan ketegangan dan kemungkinan nada ironisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” dipakai untuk membuat bentuk orang kedua jamak dalam bahasa Yunani terlihat jelas tanpa menjadi kaku.
