  text: concerning sin[a], because they do not believe in me;
translation:
  language: id
  text: tentang dosa, karena mereka tidak percaya kepada-Ku;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ
  choice: tentang
  rationale: Dengan bentuk genitif, kata ini memperkenalkan pokok yang mengenainya Roh akan menyadarkan dunia. “Tentang” alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan ayat 10–11.
- source_word: ἁμαρτίας
  choice: dosa
  rationale: Nomina abstrak tunggal ini menunjuk pada kategori dosa, bukan secara eksplisit pada sejumlah perbuatan dosa.
- source_word: μέν
  choice: —
  rationale: Partikel ini menandai unsur pertama dalam rangkaian yang berlanjut pada ayat 10–11. Bahasa Indonesia tidak memerlukan padanan eksplisit; fungsi wacananya tampak dari susunan paralel.
- source_word: ὅτι
  choice: karena
  rationale: Kata penghubung ini paling wajar dipahami sebagai pemberi alasan atau dasar penjelasan bagi frasa “tentang dosa”. “Karena” menyampaikan daya kausal tersebut dengan jelas.
- source_word: οὐ πιστεύουσιν
  choice: mereka tidak percaya
  rationale: Bentuk kini indikatif menyatakan kenyataan ketidakpercayaan yang sedang berlaku. “Tidak percaya” merupakan padanan Indonesia yang alami dan tepat.
- source_word: εἰς ἐμέ
  choice: kepada-Ku
  rationale: Dalam konstruksi Yohanes ini, percaya diarahkan secara pribadi kepada Yesus. “Percaya kepada-Ku” merupakan ungkapan Indonesia yang alami dan mempertahankan arah relasionalnya.
theological_decisions:
- issue: Hakikat dosa yang disebutkan dalam ayat ini
  choice: Ayat ini mengaitkan dosa dalam konteks tersebut secara langsung dengan ketidakpercayaan kepada Yesus.
  alternative: Ayat ini dapat dipahami sebagai merujuk secara lebih umum kepada keberdosaan manusia, dengan ketidakpercayaan sebagai salah satu contohnya.
  rationale: Anak kalimat yang diperkenalkan oleh ὅτι memberikan dasar penjelasan langsung bagi “tentang dosa”. Terjemahan tidak memperluas pernyataan itu menjadi rumusan doktrinal yang tidak dinyatakan oleh teks.
- issue: Hubungan ὅτι dengan frasa sebelumnya
  choice: 'Diterjemahkan secara kausal: “karena”.'
  alternative: 'Dapat diterjemahkan secara penjelas: “bahwa mereka tidak percaya kepada-Ku”.'
  rationale: Keduanya mungkin secara gramatikal, tetapi dalam konteks ini “karena” lebih jelas menyampaikan alasan yang mendasari penyadaran tentang dosa tanpa meniadakan hubungan penjelasnya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Frasa ini dipertahankan sebagai bagian dari rangkaian ayat 8–11, termasuk tanda titik koma. Kapitalisasi pronomina “-Ku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
