  to: 'Karena itu, beberapa murid-Nya berkata satu sama lain, “Apa maksud perkataan ini yang Ia katakan kepada kita: ‘Tidak lama lagi kalian tidak akan melihat Aku, dan tidak lama lagi kalian akan melihat Aku kembali’? Dan, ‘Karena Aku pergi kepada Bapa’[a]?”'
