  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: id
  text: 'Karena itu, beberapa murid-Nya berkata satu sama lain, “Apa maksud perkataan ini yang Ia katakan kepada kita: ‘Tidak lama lagi kalian tidak akan melihat Aku, dan tidak lama lagi kalian akan melihat Aku kembali’? Dan, ‘Karena Aku pergi kepada Bapa’[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bahwa Aku pergi kepada Bapa.” Kata penghubung Yunani dapat dipahami sebagai pengantar isi kutipan atau dalam arti sebab (“karena”).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat inferensial dari perkataan Yesus sebelumnya, tanpa memutus alur narasi.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: beberapa murid-Nya
  rationale: Bentuk partitif ἐκ menunjukkan sebagian dari kelompok murid, bukan semuanya.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Menyampaikan percakapan timbal balik antarmurid secara alami dalam bahasa Indonesia.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Apa maksud perkataan-Nya kepada kita ini
  rationale: Ungkapan Yunani secara harfiah menanyakan 'apakah ini yang Ia katakan kepada kita'; susunan Indonesia ini secara alami menyatakan kebingungan para murid tanpa menambahkan penafsiran atas isi perkataan itu.
- source_word: Μικρὸν
  choice: tinggal sedikit waktu lagi
  rationale: Dalam konteks ini μικρόν berfungsi secara temporal; pilihan ini jelas dan idiomatis serta mempertahankan pengulangannya.
- source_word: θεωρεῖτέ
  choice: kalian tidak akan melihat
  rationale: θεωρέω di sini menyatakan penglihatan atau persepsi; 'melihat' sesuai dengan konteks dan memungkinkan paralel retoris dengan ὄψεσθέ dipertahankan.
- source_word: πάλιν
  choice: lalu
  rationale: Dalam susunan temporal bahasa Indonesia, 'lalu' menyampaikan peralihan menuju keadaan berikutnya dengan alami; gagasan terjadinya kembali juga tersirat oleh pengulangan 'melihat Aku'.
- source_word: ὄψεσθέ
  choice: kalian akan melihat
  rationale: Bentuk mendatang dari ὁράω diterjemahkan dengan 'akan melihat', mempertahankan kesejajaran dengan θεωρεῖτε.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Karena Aku pergi kepada Bapa
  rationale: ὅτι dapat dibaca secara kausal, sesuai dengan perkataan yang dikutip dari ayat sebelumnya; kemungkinan bahwa ὅτι memperkenalkan isi kutipan dipertahankan dalam catatan kaki.
- source_word: πατέρα
  choice: Bapa
  rationale: Mempertahankan rujukan Yunani kepada 'Bapa' tanpa menambahkan kata posesif 'Bapa-Ku'.
theological_decisions:
- issue: Rujukan kepergian dan kembalinya Yesus dalam perkataan yang dikutip
  choice: Terjemahan mempertahankan ketidakpastian para murid dan tidak menentukan peristiwa yang dimaksud.
  alternative: Kematian dan kebangkitan; kenaikan dan kehadiran rohani; atau penampakan sesudah kebangkitan.
  rationale: Ayat ini menampilkan kebingungan para murid dan belum menjelaskan rujukan perkataan Yesus, sehingga terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut secara tersirat.
- issue: Fungsi ὅτι dalam klausa terakhir
  choice: 'Diterjemahkan secara kausal: “Karena Aku pergi kepada Bapa.”'
  alternative: 'Dibaca sebagai pengantar isi: “Bahwa Aku pergi kepada Bapa.”'
  rationale: Kedua pembacaan dimungkinkan oleh bahasa Yunani dan konteks; pembacaan kausal dipakai dalam teks utama, sedangkan alternatifnya dicatat agar ambiguitas asli tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata ganti jamak 'kalian' membedakan sapaan kepada para murid dari bentuk tunggal, sedangkan 'Aku' dan '-Nya' mengikuti konvensi penghormatan dalam penerjemahan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
