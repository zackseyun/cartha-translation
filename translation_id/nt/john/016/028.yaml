base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: id
  text: Aku berasal dari Bapa dan telah datang ke dalam dunia. Sekali lagi[a] Aku meninggalkan dunia dan pergi kepada Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kembali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Aku berasal dari Bapa
  rationale: Ungkapan ini menyatakan gerak sekaligus asal dari Bapa. Dalam bahasa Indonesia, 'berasal dari Bapa' terdengar alami dan mempertahankan klaim asal-usul tanpa menambahkan uraian doktrinal.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: telah datang ke dalam dunia
  rationale: Bentuk perfektum menyatakan kedatangan yang sudah terlaksana dan tetap relevan; 'ke dalam dunia' mempertahankan arah masuk yang dinyatakan oleh εἰς.
- source_word: πάλιν
  choice: Sekarang
  rationale: Dalam susunan gerak yang berlawanan—datang dari Bapa lalu meninggalkan dunia—πάλιν menandai tahap berikutnya atau gerak balik. 'Sekarang' membuat urutan itu alami dalam bahasa Indonesia, sementara alternatif harfiahnya dicatat.
- source_word: ἀφίημι τὸν κόσμον
  choice: Aku meninggalkan dunia
  rationale: Bentuk kini dalam konteks ini menunjuk tindakan yang segera terjadi. Bentuk Indonesia ini wajar dan tetap dapat menyampaikan tindakan yang sudah di ambang pelaksanaan.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: pergi kepada Bapa
  rationale: πρός dengan akusatif menunjukkan arah menuju Bapa. 'Kepada Bapa' alami ketika tujuan geraknya adalah pribadi.
theological_decisions:
- issue: Hubungan Yesus dengan Bapa dalam ungkapan ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Menyatakan secara langsung bahwa Yesus berasal dari Bapa.
  alternative: Memperluasnya menjadi penjelasan eksplisit tentang praeksistensi atau inkarnasi.
  rationale: Teks menegaskan asal Yesus dari Bapa dan kepulangan-Nya kepada Bapa, tetapi tidak perlu diperluas dengan rumusan doktrinal di luar kata-kata ayat.
- issue: Makna πάλιν dalam rangkaian datang dan kembali
  choice: Sekarang, dengan catatan alternatif 'Kembali' atau 'Lagi'.
  alternative: Menerjemahkan langsung sebagai 'Kembali' tanpa catatan.
  rationale: πάλιν secara leksikal dapat berarti 'lagi/kembali', tetapi dalam konteks ini juga menghubungkan tahap berikutnya dalam perjalanan Yesus. Catatan menjaga ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang pertama ditulis 'Aku' sesuai tuturan langsung Yesus; struktur dibuat ringkas dengan kesejajaran antara datang ke dalam dunia dan meninggalkan dunia.
