  terminology: “Perempuan,” “kesedihan,” “saatnya,” “anak itu,” dan “seorang manusia” sesuai dengan sumber dan register modern baku. “Kesusahan itu” lebih jelas daripada bentuk posesif “kesusahannya,” karena Yunani memakai artikel tentu untuk penderitaan tersebut.
