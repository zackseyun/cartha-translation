id: JHN.16.21
reference: John 16:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: id
  text: Ketika seorang perempuan melahirkan, ia mengalami kesedihan karena saatnya telah tiba. Namun, setelah ia melahirkan anak itu, ia tidak lagi mengingat kesusahan itu karena sukacita atas kelahiran seorang manusia ke dunia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γυνή
  choice: seorang perempuan
  rationale: Dalam perumpamaan umum tentang persalinan ini, γυνή berarti perempuan, bukan secara khusus istri.
- source_word: ὅταν τίκτῃ
  choice: ketika ... melahirkan
  rationale: Bentuk kini subjungtif dengan ὅταν menggambarkan keadaan umum yang sedang berlangsung; dalam bahasa Indonesia, 'ketika ... melahirkan' alami dan mencakup proses persalinan.
- source_word: λύπην ἔχει
  choice: ia mengalami kesedihan
  rationale: λύπη mencakup kesedihan atau dukacita, bukan hanya rasa sakit jasmani, dan berkaitan dengan tema kesedihan yang berubah menjadi sukacita.
- source_word: ἡ ὥρα αὐτῆς
  choice: saatnya
  rationale: '''Saatnya'' merupakan padanan Indonesia yang alami sekaligus mempertahankan bobot tematis ὥρα dalam Injil Yohanes.'
- source_word: γεννήσῃ τὸ παιδίον
  choice: ia melahirkan anak itu
  rationale: Aoris subjungtif menunjukkan peristiwa yang telah selesai; konteks dan kata 'setelah' menyatakan penyelesaian itu secara alami.
- source_word: οὐκέτι μνημονεύει τῆς θλίψεως
  choice: ia tidak lagi mengingat kesusahannya
  rationale: Terjemahan ini mempertahankan gagasan mengingat dan memakai 'kesusahan' untuk θλῖψις, yakni tekanan atau penderitaan berat dalam persalinan, tanpa memasukkan arti teknis eskatologis.
- source_word: διὰ τὴν χαράν
  choice: karena bersukacita
  rationale: διά dengan akusatif menyatakan sebab. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada 'karena sukacita' dan tetap menyampaikan hubungan kausal.
- source_word: ὅτι ἐγεννήθη ἄνθρωπος
  choice: bahwa seorang manusia telah lahir
  rationale: ὅτι memperkenalkan isi atau dasar sukacita, sedangkan bentuk pasif aoris menyatakan kelahiran yang telah terjadi.
- source_word: ἄνθρωπος
  choice: seorang manusia
  rationale: Dalam konteks ini ἄνθρωπος bersifat generik, menunjuk pada insan yang baru lahir tanpa menyatakan jenis kelamin laki-laki.
- source_word: εἰς τὸν κόσμον
  choice: ke dunia
  rationale: Padanan langsung dan alami bagi dunia tempat manusia itu dilahirkan.
theological_decisions:
- issue: Arti generik ἄνθρωπος
  choice: seorang manusia
  alternative: seorang laki-laki; seorang anak
  rationale: '''Seorang manusia'' mempertahankan rujukan generik sumber tanpa menyiratkan bahwa bayi itu berjenis kelamin laki-laki. ''Anak'' lebih idiomatis, tetapi mengaburkan peralihan leksikal dari παιδίον ke ἄνθρωπος.'
- issue: Bobot tematis ὥρα dalam Yohanes
  choice: saatnya
  alternative: waktu melahirkannya
  rationale: '''Saatnya'' tetap terbuka pada resonansi khas Yohanes mengenai saat yang telah tiba, sambil tetap jelas merujuk pada persalinan dalam konteks langsung.'
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Struktur dua bagian dipertahankan, dengan peralihan jelas dari kesedihan menuju sukacita. Tidak diperlukan catatan kaki karena 'seorang manusia' menyampaikan sifat generik ἄνθρωπος secara langsung.
