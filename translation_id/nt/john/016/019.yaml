reference: John 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: id
  text: Yesus tahu bahwa mereka ingin bertanya kepada-Nya, dan Ia berkata kepada mereka, “Apakah kalian saling membicarakan hal ini, bahwa Aku berkata[a], ‘Sebentar lagi, kalian tidak akan melihat Aku; dan sebentar lagi, kalian akan melihat Aku kembali’[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Aku berkata.” Kata penghubung Yunani dapat memperkenalkan isi yang sedang mereka bicarakan atau menyatakan alasan pembicaraan itu.
    reason: alternative_reading
  - marker: b
    text: 'Bahasa Yunani memakai dua kata kerja yang berbeda untuk “melihat” di sini: pertama θεωρέω, yang dapat bernuansa memandang atau mengamati, kemudian ὁράω, “melihat.” Keduanya diterjemahkan “melihat” agar kesejajaran kalimat tetap alami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: tahu
  rationale: Aoristus γινώσκω menyatakan bahwa Yesus mengetahui niat para murid; “tahu” paling langsung dan wajar dalam bahasa Indonesia.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: mereka ingin bertanya kepada-Nya
  rationale: θέλω menyatakan keinginan atau niat, sedangkan αὐτόν adalah objek personal dari ἐρωτάω; “bertanya kepada-Nya” alami dan tidak memberi kesan interogasi yang keras.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Apakah kalian sedang membicarakan hal ini satu sama lain
  rationale: Dalam konteks ini ζητέω bersama μετ’ ἀλλήλων menunjuk pada usaha para murid membahas atau mencari kejelasan bersama. “Membicarakan” menyampaikan fungsi kontekstual itu dengan jelas.
- source_word: ὅτι εἶπον
  choice: karena Aku berkata
  rationale: ὅτι dapat dipahami secara kausal maupun sebagai pengantar isi pembicaraan. “Karena” menghasilkan pertanyaan Indonesia yang alami, sedangkan kemungkinan pengantar isi dicatat dalam catatan kaki.
- source_word: Μικρὸν
  choice: tinggal sesaat lagi / lalu sesaat lagi
  rationale: Bentuk netral ini dipakai secara adverbial untuk selang waktu singkat. “Sesaat lagi” mempertahankan makna temporal; “tinggal” dan “lalu” memperjelas urutan secara idiomatis tanpa menentukan berapa lama waktunya.
- source_word: οὐ θεωρεῖτέ με
  choice: kalian tidak melihat Aku
  rationale: Terjemahan ini mengikuti bentuk kini dan negasi Yunani tanpa menambahkan “tidak lagi” atau secara eksplisit mengubahnya menjadi bentuk masa depan.
- source_word: πάλιν
  choice: lalu
  rationale: Di sini πάλιν menandai tahap berikutnya dalam rangkaian waktu. “Lalu” lebih alami dalam bahasa Indonesia daripada “lagi” yang berpotensi melekat secara keliru pada verba “melihat”.
- source_word: ὄψεσθέ με
  choice: kalian akan melihat Aku
  rationale: Bentuk futurum ὁράω secara langsung dan alami diterjemahkan “akan melihat Aku”.
theological_decisions:
- issue: Hubungan ὅτι dengan pembicaraan para murid
  choice: 'Memakai pengertian kausal: “karena Aku berkata”'
  alternative: 'Memahami ὅτι sebagai pengantar isi: “bahwa Aku berkata” atau merumuskan “perkataan-Ku ini”'
  rationale: Kedua hubungan sintaksis mungkin. Bacaan kausal memberi kalimat Indonesia yang wajar tanpa menghapus alternatif pengantar isi, yang dipertahankan dalam catatan kaki.
- issue: Perbedaan θεωρέω dan ὁράω dalam kedua klausa
  choice: Menerjemahkan keduanya dengan “melihat”
  alternative: Membedakannya, misalnya dengan “memandang” dan “melihat”
  rationale: Konteks menekankan ketidakhadiran sementara dan penglihatan kembali, bukan perbedaan teologis yang pasti antara dua macam melihat. Pemakaian satu verba mempertahankan kesejajaran, sementara perbedaan leksikal dicatat.
- issue: Daya pertanyaan Yesus
  choice: Mempertahankannya sebagai pertanyaan langsung
  alternative: Mengubahnya menjadi pernyataan bahwa Yesus mengetahui pokok pembicaraan mereka
  rationale: Bentuk Yunani paling wajar dibaca sebagai pertanyaan yang menyingkapkan pembicaraan para murid, tanpa perlu menambahkan nada teguran.
translation_notes:
  register: Bahasa Indonesia modern, umum, dan bermartabat. “Kalian” dipakai karena sapaan ditujukan kepada sekelompok murid dan menjaga pembedaan jumlah yang terdapat dalam bentuk Yunani. Tanda baca membagi dua klausa waktu agar ucapan tetap mudah diikuti.
