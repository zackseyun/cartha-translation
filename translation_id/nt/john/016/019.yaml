revisions:
- from: Yesus tahu bahwa mereka ingin bertanya kepada-Nya. Karena itu, Ia berkata kepada mereka, “Apakah kalian sedang membicarakan hal ini satu sama lain karena Aku berkata[a], ‘Tinggal sesaat lagi, kalian tidak melihat Aku; lalu sesaat lagi, kalian akan melihat Aku’[b]?”
  to: Yesus tahu bahwa mereka ingin bertanya kepada-Nya, dan Ia berkata kepada mereka, “Apakah kalian saling membicarakan hal ini, bahwa Aku berkata[a], ‘Sebentar lagi, kalian tidak akan melihat Aku; dan sebentar lagi, kalian akan melihat Aku kembali’[b]?”
  rationale: Revisi memulihkan hubungan koordinatif “dan” pada klausa pembuka, mempertahankan ambiguitas ὅτι melalui teks dan catatan kaki, menerjemahkan πάλιν sebagai “kembali,” dan memperhalus klausa temporal dalam bahasa Indonesia modern. Tidak ada penafsiran doktrinal yang ditambahkan.
