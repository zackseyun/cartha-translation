base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: id
  text: Sekarang kami tahu bahwa Engkau mengetahui segala sesuatu dan tidak perlu seorang pun bertanya kepada-Mu[a]. Berdasarkan hal ini kami percaya bahwa Engkau datang dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menanyai-Mu.” Kata kerja Yunani yang dipakai dapat berarti “bertanya” atau “menanyai”; konteksnya berkaitan dengan pengetahuan Yesus, termasuk tentang pertanyaan yang belum diucapkan para murid.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Sekarang
  rationale: Menandai kesadaran para murid pada saat ini secara ringkas dan alami.
- source_word: οἴδαμεν
  choice: kami tahu
  rationale: Bentuk οἶδα bermakna kini; bentuk sederhana ini wajar dalam bahasa Indonesia dan membedakan kelompok murid dari Yesus yang mereka sapa.
- source_word: οἶδας πάντα
  choice: Engkau mengetahui segala sesuatu
  rationale: πάντα bersifat menyeluruh. Pilihan ini mempertahankan keluasan pernyataan serta register yang khidmat tanpa menambahkan penjelasan doktrinal.
- source_word: οὐ χρείαν ἔχεις
  choice: tidak memerlukan
  rationale: Mengungkapkan tidak adanya kebutuhan dengan bahasa Indonesia modern dan alami.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: seorang pun untuk bertanya kepada-Mu
  rationale: Menyampaikan klausa maksud/isi yang dipadatkan dalam bahasa Yunani. ἐρωτάω dapat berarti bertanya atau menanyai; pilihan utama ini alami dan tidak menyiratkan sikap bermusuhan.
- source_word: ἐν τούτῳ
  choice: Karena hal inilah
  rationale: Menunjukkan bahwa hal yang baru disebut menjadi dasar bagi kesimpulan atau kepercayaan para murid, sambil mempertahankan rujukan demonstratifnya.
- source_word: πιστεύομεν
  choice: kami percaya
  rationale: Padanan langsung dan lazim bagi pengakuan iman dalam konteks ini.
- source_word: ἀπὸ θεοῦ
  choice: dari Allah
  rationale: Mengikuti penyebutan θεός secara langsung tanpa menggantinya dengan 'Bapa' atau memperluas maknanya.
- source_word: ἐξῆλθες
  choice: Engkau datang
  rationale: Dalam gabungan dengan 'dari Allah', ungkapan ini secara alami menyatakan asal dan perutusan Yesus; 'keluar' akan terasa kurang wajar dan dapat mempersempit maknanya.
theological_decisions:
- issue: Daya kristologis pernyataan bahwa Yesus mengetahui segala sesuatu
  choice: Mempertahankan pengakuan para murid sebagaimana dinyatakan, tanpa menjabarkannya menjadi rumusan eksplisit tentang kemahatahuan.
  alternative: Menambahkan istilah atau penjelasan yang secara langsung menyebut kemahatahuan.
  rationale: Teks memuat pengakuan yang sangat kuat mengenai pengetahuan Yesus, tetapi terjemahan tidak semestinya menambahkan rumusan doktrinal yang tidak dinyatakan secara eksplisit.
- issue: Makna ἀπὸ θεοῦ ἐξῆλθες
  choice: Engkau datang dari Allah
  alternative: Engkau keluar dari Allah; Engkau datang dari Bapa
  rationale: Pilihan ini mempertahankan klaim mengenai asal dan perutusan ilahi Yesus sekaligus tidak mengganti 'Allah' dengan sebutan yang lebih khusus berdasarkan konteks sekitar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk langsung kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. 'Kami' dipakai karena para murid berbicara kepada Yesus, yang tidak termasuk dalam kelompok pembicara.
