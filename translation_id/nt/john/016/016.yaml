  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: id
  text: Sebentar lagi, kamu tidak akan melihat Aku lagi; dan sebentar lagi, kamu akan melihat Aku kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Yunani, dua kata kerja yang berbeda dipakai untuk “melihat” di sini: θεωρέω pada klausa pertama dan ὁράω pada klausa kedua. Perbedaan itu mungkin mengandung nuansa, tetapi keduanya diterjemahkan “melihat” karena kontras utama dalam ayat ini bersifat temporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: tinggal sesaat lagi / sesaat lagi
  rationale: Bentuk netral tunggal ini dipakai secara adverbial untuk menyatakan jangka waktu yang singkat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan temporal.
- source_word: οὐκέτι
  choice: tidak akan ... lagi
  rationale: Dalam konteks ujaran yang mengarah ke waktu dekat, bentuk idiomatis ini menyatakan bahwa keadaan melihat Yesus akan segera berhenti.
- source_word: θεωρεῖτέ
  choice: melihat
  rationale: Walaupun θεωρέω dapat bernuansa memandang atau mengamati, di sini makna dasarnya cukup diwakili oleh 'melihat' tanpa memaksakan pembedaan semantis.
- source_word: πάλιν
  choice: lalu ... lagi
  rationale: Menandai urutan berikutnya sekaligus pembalikan keadaan; 'lalu' memperjelas urutan dan 'lagi' mempertahankan gagasan pengulangan.
- source_word: ὄψεσθέ
  choice: kamu akan melihat
  rationale: Bentuk futur dari ὁράω secara wajar menyatakan penglihatan pada masa mendatang. Kata kerja yang sama dalam bahasa Indonesia menjaga kesejajaran tanpa menambahkan pembedaan teologis yang tidak pasti.
- source_word: με
  choice: Aku
  rationale: Pronomina objek ini merujuk kepada Yesus. Huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk pronomina ilahi.
- source_word: καὶ
  choice: dan / lalu
  rationale: Kata penghubung pertama menjaga hubungan antarklausa, sedangkan yang kedua dinyatakan secara idiomatis sebagai 'lalu' untuk menunjukkan urutan waktu tanpa mengubah struktur dasar.
theological_decisions:
- issue: Apakah θεωρέω dan ὁράω perlu diterjemahkan dengan dua kata kerja Indonesia yang berbeda
  choice: Keduanya diterjemahkan 'melihat' dalam teks utama
  alternative: memandang ... melihat; melihat ... memandang
  rationale: Kedua verba mempunyai tumpang tindih makna yang besar dalam pemakaian Yohanes. Pembedaan yang tegas dapat menyiratkan perbedaan cara melihat yang tidak dipastikan oleh ayat ini; perbedaan leksikalnya dicatat dalam catatan kaki.
- issue: Rujukan dua rentang 'sesaat lagi'
  choice: Dibiarkan terbuka tanpa menjelaskan peristiwa yang dimaksud
  alternative: Menafsirkannya secara eksplisit sebagai kematian dan kebangkitan Yesus atau sebagai kenaikan dan kedatangan-Nya kembali
  rationale: Ayat ini sendiri mempertahankan ketegangan temporal dan tidak menamai peristiwa-peristiwa tersebut secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sesaat lagi' dipilih sebagai ungkapan waktu yang ringkas dan alami; struktur dua klausa dipertahankan agar irama serta kesejajaran perkataan Yesus tetap terasa.
