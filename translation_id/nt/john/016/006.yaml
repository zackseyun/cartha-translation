  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: id
  text: Namun, karena Aku telah mengatakan hal-hal ini kepada kalian, dukacita telah memenuhi hati kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hati masing-masing dari kalian.” Dalam bahasa Yunani, kata “hati” berbentuk tunggal, sedangkan kata “kalian” berbentuk jamak; susunan ini dapat menggambarkan dukacita batin yang dialami bersama oleh kelompok itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya; “Namun” alami dan sesuai dengan nada wacana yang khidmat.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini memperkenalkan sebab dukacita para murid, bukan sekadar isi perkataan.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mempertahankan bentuk jamak dan menunjuk kepada berbagai perkara yang baru saja disampaikan Yesus.
- source_word: λελάληκα
  choice: telah mengatakan
  rationale: Bentuk perfek menunjukkan tindakan yang sudah dilakukan dengan dampak yang masih dirasakan. “Telah mengatakan” lebih alami dalam bahasa Indonesia daripada “telah berbicara ... kepada kalian” pada konstruksi ini.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Dativus jamak merujuk kepada para murid; “kalian” menyatakan kejamakan secara jelas dalam bahasa Indonesia modern.
- source_word: ἡ λύπη
  choice: dukacita
  rationale: Menyampaikan kesedihan mendalam dengan bobot yang sesuai bagi konteks dan ragam bahasa yang bermartabat.
- source_word: πεπλήρωκεν
  choice: telah memenuhi
  rationale: Mempertahankan makna dasar πληρόω dan aspek perfek tanpa memperkuatnya secara tafsiran menjadi “menguasai” atau “membanjiri”.
- source_word: ὑμῶν τὴν καρδίαν
  choice: hati kalian
  rationale: Mempertahankan nomina tunggal Yunani bersama pemilik jamak; dalam bahasa Indonesia ungkapan ini dapat menyatakan keadaan batin bersama kelompok tersebut.
theological_decisions:
- issue: Bentuk tunggal kolektif “hati” atau bentuk jamak distributif “hati masing-masing”
  choice: hati kalian
  alternative: hati masing-masing dari kalian
  rationale: Teks Yunani memakai kata ganti milik jamak dengan καρδίαν berbentuk tunggal. Terjemahan utama mempertahankan ketegangan gramatikal dan kemungkinan nuansa dukacita batin yang dialami bersama, sedangkan catatan memberi pembacaan distributif yang wajar.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Pronomina “Aku” dan “kalian” memperjelas bahwa Yesus berbicara kepada lebih dari satu murid. Susunan kalimat mengikuti hubungan sebab-akibat dan citra “memenuhi hati” dalam teks sumber.
