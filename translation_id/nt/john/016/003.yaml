  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: id
  text: Mereka akan melakukan hal-hal itu karena mereka tidak mengenal Bapa maupun Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani ini berbentuk aoris. Dalam konteks ini, ungkapan tersebut juga dapat diterjemahkan dengan nuansa lampau, “mereka tidak mengenal Bapa maupun Aku,” atau dengan nuansa keadaan yang berlanjut, “mereka belum mengenal Bapa maupun Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, membuka kalimat dengan “Dan” di sini terasa kurang alami. Hubungan dengan konteks sebelumnya tetap jelas tanpa konjungsi eksplisit.
- source_word: ταῦτα
  choice: semua itu
  rationale: Menunjuk kembali kepada berbagai tindakan permusuhan yang baru disebutkan; bentuk ini alami dalam bahasa Indonesia dan tetap menyampaikan acuan jamak.
- source_word: ποιήσουσιν
  choice: akan melakukan
  rationale: Bentuk futur aktif ποιέω paling wajar diterjemahkan dengan “akan melakukan” ketika objeknya adalah tindakan-tindakan tersebut.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan mereka melakukan tindakan itu, sehingga nilai kausalnya dinyatakan secara langsung.
- source_word: οὐκ ἔγνωσαν
  choice: tidak mengenal
  rationale: Aoris γινώσκω di sini menyatakan kegagalan mengenal yang menjelaskan tindakan mereka. “Tidak mengenal” alami dalam bahasa Indonesia dan mempertahankan dimensi pengenalan pribadi, bukan sekadar mengetahui informasi.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Dalam konteks Yohanes, sebutan ini merujuk kepada Allah sebagai Bapa dan diperlakukan sebagai gelar pribadi ilahi.
- source_word: οὐδὲ ἐμέ
  choice: ataupun Aku
  rationale: οὐδέ menambahkan objek kedua dalam konstruksi negatif. “Ataupun” menyampaikan bahwa mereka tidak mengenal baik Bapa maupun Yesus; “Aku” dikapitalisasi sesuai konvensi teks Alkitab bahasa Indonesia untuk ujaran Yesus.
theological_decisions:
- issue: Bahasa pengenalan dalam Yohanes mengenai Bapa dan Yesus
  choice: mereka tidak mengenal Bapa ataupun Aku
  alternative: mereka tidak pernah mengenal Bapa ataupun Aku; mereka belum mengenal Bapa ataupun Aku
  rationale: Terjemahan utama mempertahankan kaitan teologis antara penganiayaan dan kegagalan mengenal Bapa serta Yesus, tanpa mempersempit aoris menjadi “tidak pernah” atau menambahkan nuansa temporal “belum” yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Semua itu” dipilih sebagai rujukan balik yang alami, sedangkan “mengenal” mempertahankan nuansa relasional khas Injil Yohanes. Penanda catatan kaki [a] tercantum dalam teks utama.
