  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: id
  text: Pada hari itu kamu akan meminta dalam nama-Ku, dan Aku tidak mengatakan kepadamu bahwa Aku akan memohon kepada Bapa mengenai kamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi kamu” atau “bagi kamu”. Teks Yunani juga memakai dua kata kerja yang berbeda untuk “meminta” dan “memohon” dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Pada hari itu
  rationale: Frasa ini berfungsi secara temporal. 'Pada hari itu' merupakan ungkapan baku dan alami dalam bahasa Indonesia serta mempertahankan penekanan demonstratif ἐκείνῃ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Ungkapan ini mempertahankan idiom khas Yohanes yang mengaitkan permintaan dengan pribadi dan wewenang Yesus tanpa mempersempit maknanya menjadi sekadar 'dengan wewenang-Ku'.
- source_word: αἰτήσεσθε
  choice: kamu akan meminta
  rationale: Bentuknya adalah indikatif futur medial orang kedua jamak. 'Meminta' alami dalam konteks doa dan memungkinkan pembedaan dari ἐρωτάω dalam klausa berikutnya.
- source_word: οὐ λέγω ὑμῖν
  choice: Aku tidak mengatakan kepadamu
  rationale: Terjemahan ini mempertahankan kala kini dan isi pernyataan Yesus secara langsung, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Di sini ὅτι memperkenalkan isi dari apa yang tidak dikatakan Yesus, bukan menyatakan sebab.
- source_word: ἐρωτήσω
  choice: Aku akan memohon
  rationale: '''Memohon'' menyampaikan permintaan yang ditujukan Yesus kepada Bapa dan sekaligus mencerminkan bahwa teks Yunani memakai verba yang berbeda dari αἰτέω pada permulaan ayat, tanpa menambahkan gagasan yang tidak ada dalam teks.'
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Bahasa Indonesia lazim memakai 'Bapa' sebagai sebutan tertentu dalam konteks ini; tidak ditambahkan kata milik seperti 'Bapa-Ku' karena tidak ada pronomina posesif dalam teks Yunani.
- source_word: περὶ ὑμῶν
  choice: mengenai kamu
  rationale: Pilihan ini dekat dengan περί plus genitif dan mempertahankan kemungkinan nuansa 'tentang kamu' maupun 'demi kamu' tanpa menetapkan salah satunya dalam teks utama.
theological_decisions:
- issue: Apakah Yesus meniadakan seluruh peran pengantaraan-Nya pada masa depan atau hanya tidak sedang menggambarkan jalan masuk para murid kepada Bapa dengan cara itu dalam konteks ini
  choice: Klausa diterjemahkan secara langsung sebagai apa yang tidak Yesus katakan di sini, tanpa menyimpulkan bahwa Ia tidak pernah menjadi pengantara.
  alternative: Menerjemahkan secara lebih tafsiri bahwa Yesus sama sekali tidak akan memohon bagi mereka, atau bahwa mereka datang kepada Bapa tanpa pengantaraan apa pun.
  rationale: Konteks langsung menekankan permintaan para murid dalam nama Yesus, sedangkan teks-teks Perjanjian Baru lainnya berbicara tentang pembelaan atau pengantaraan-Nya. Terjemahan langsung mempertahankan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia. Tanda titik dipakai sebagai penutup ayat yang berdiri sendiri.
