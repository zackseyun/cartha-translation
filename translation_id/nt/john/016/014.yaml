id: JHN.16.14
reference: John 16:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: id
  text: Ia akan memuliakan Aku, karena Ia akan mengambil dari apa yang menjadi milik-Ku[a] dan menyatakannya kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menerima dari apa yang menjadi milik-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ia
  rationale: Kata ganti ini mengacu kepada Roh dalam konteks langsung. “Ia” wajar dalam bahasa Indonesia dan tetap menyatakan rujukan personal tanpa menonjolkan daya demonstratif secara berlebihan.
- source_word: ἐμὲ
  choice: Aku
  rationale: Pronomina orang pertama tunggal sebagai objek δοξάσει; kapitalisasi mengikuti gaya penghormatan yang lazim bagi perkataan Yesus.
- source_word: δοξάσει
  choice: akan memuliakan
  rationale: “Memuliakan” mempertahankan bobot teologis δοξάζω dalam Injil Yohanes, bukan sekadar berarti menghormati.
- source_word: ὅτι
  choice: karena
  rationale: Di sini ὅτι paling wajar memperkenalkan alasan mengapa Roh akan memuliakan Yesus.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: dari apa yang menjadi milik-Ku
  rationale: Ungkapan ini mempertahankan keluasan frasa Yunani tanpa menentukan secara berlebihan apakah yang dimaksud ialah ajaran, otoritas, atau penyataan.
- source_word: λήμψεται
  choice: akan mengambil
  rationale: λαμβάνω dapat berarti “mengambil” atau “menerima.” “Mengambil” sesuai dengan konstruksi “dari apa yang menjadi milik-Ku,” sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: ἀναγγελεῖ
  choice: menyatakannya
  rationale: ἀναγγέλλω berarti memberitakan, melaporkan, atau membuat diketahui. “Menyatakannya” dignified dan alami; akhiran “-nya” menyuplai objek yang tersirat dari frasa sebelumnya.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Bentuk Yunani adalah orang kedua jamak. Dalam bahasa Indonesia, “kepadamu” dapat bersifat tunggal atau jamak menurut konteks; para murid sebagai kelompok sudah jelas dari konteks.
theological_decisions:
- issue: Hubungan Roh dengan apa yang menjadi milik Yesus dalam ἐκ τοῦ ἐμοῦ λήμψεται
  choice: akan mengambil dari apa yang menjadi milik-Ku
  alternative: akan menerima dari apa yang menjadi milik-Ku
  rationale: Terjemahan ini mempertahankan pernyataan luas bahwa Roh menyampaikan apa yang menjadi milik Sang Anak, tanpa mengubahnya menjadi rumusan teknis tentang hubungan intrailahi yang melampaui perkataan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan hubungan sebab akibat dan ambiguitas leksikal λήμψεται. Penulisan pronomina ilahi dengan huruf kapital digunakan secara konsisten.
