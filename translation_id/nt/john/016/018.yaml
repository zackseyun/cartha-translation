    rationale: Meskipun sesuai konteks dekatnya, μικρόν sendiri eliptis dan hanya menyatakan waktu singkat. “Sedikit waktu lagi” cukup idiomatis dan tidak menambahkan nuansa leksikal yang tidak ada dalam ayat ini.
