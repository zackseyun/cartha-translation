  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Kata ganti hormat ‘Dia’ dan akhiran ‘-Nya’ digunakan untuk Yesus sesuai konvensi penerjemahan Alkitab Indonesia. Tidak ada penanda catatan kaki karena tidak diperlukan untuk menyajikan alternatif yang bermakna pada ayat ini.
