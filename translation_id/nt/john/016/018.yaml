  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: id
  text: Jadi, mereka terus berkata, “Apa maksud-Nya dengan perkataan, ‘Sedikit waktu lagi,’ itu? Kami tidak tahu apa yang Dia bicarakan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: mereka terus berkata
  rationale: Bentuk imperfek menunjukkan percakapan yang sedang berlangsung atau berulang; ‘terus berkata’ menyampaikan aspek itu secara wajar dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menghubungkan pertanyaan ini dengan kebingungan yang timbul dari perkataan sebelumnya dan mempertahankan fungsi inferensial atau kelanjutan wacana.
- source_word: Τί ἐστιν τοῦτο
  choice: Apa maksud perkataan-Nya
  rationale: Ungkapan harfiah ‘Apa ini’ terasa janggal dalam bahasa Indonesia. Pilihan ini secara alami menyatakan bahwa para murid menanyakan arti ucapan tersebut tanpa menentukan jawabannya.
- source_word: ὃ λέγει μικρόν
  choice: ‘Tinggal sedikit waktu lagi’
  rationale: Menampilkan μικρόν sebagai kutipan dari ungkapan Yesus yang sedang dipersoalkan. ‘Tinggal sedikit waktu lagi’ idiomatis dan sesuai dengan nilai temporal eliptis μικρόν dalam konteks ini.
- source_word: οὐκ οἴδαμεν
  choice: Kami tidak tahu
  rationale: Menyampaikan secara langsung verba οἶδα yang berbentuk perfek tetapi bermakna keadaan kini.
- source_word: τί λαλεῖ
  choice: apa yang sedang Dia bicarakan
  rationale: λαλεῖ mengacu pada hal yang sedang Yesus bicarakan. Bentuk progresif Indonesia menjaga nuansa tindakan yang berlangsung dan menghindari pengulangan kaku dengan ‘perkataan-Nya’.
