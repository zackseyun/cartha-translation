  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Revisi “Jadi” dan “Apa maksud-Nya dengan perkataan ... itu?” terdengar alami dalam bahasa Indonesia modern serta lebih tepat menghubungkan pertanyaan dengan kutipan.
  terminology: Penggunaan “Dia/-Nya” konsisten dengan konvensi hormat yang dipilih draf. Tidak ada istilah teologis khusus atau nama yang memerlukan penyesuaian.
