  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: id
  text: Demikian juga, sekarang kamu berdukacita. Namun, Aku akan melihat kamu lagi[a]; hatimu akan bersukacita, dan tidak seorang pun akan mengambil sukacitamu dari kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kamu akan melihat Aku lagi.” Teks Yunani secara harfiah berbunyi, “Aku akan melihat kamu lagi,” yang dapat menekankan prakarsa Yesus untuk kembali menemui murid-murid-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Demikian juga
  rationale: Menandai penerapan perumpamaan tentang persalinan pada para murid sekaligus menerjemahkan καὶ ὑμεῖς οὖν secara wajar dalam bahasa Indonesia.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: sekarang kamu diliputi dukacita
  rationale: Mengungkap keadaan emosional yang sedang dialami; μέν tidak diterjemahkan tersendiri, tetapi tercermin dalam kontras dengan 'Namun'.
- source_word: πάλιν δὲ
  choice: Namun, ... lagi
  rationale: δέ menandai kontras dengan dukacita sekarang, sedangkan πάλιν menyatakan perjumpaan kembali.
- source_word: ὄψομαι ὑμᾶς
  choice: Aku akan melihat kamu
  rationale: 'Mempertahankan susunan Yunani: Yesus adalah subjek dan para murid objek, tanpa menyelaraskannya dengan ungkapan di ayat sekitar.'
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: hatimu akan bersukacita
  rationale: Terjemahan idiomatis yang mempertahankan 'hati' sebagai pusat batin dan daya verbal χαρήσεται.
- source_word: τὴν χαρὰν ὑμῶν
  choice: sukacitamu
  rationale: Mempertahankan kaitan leksikal antara kata kerja 'bersukacita' dan nomina 'sukacita'.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: tidak seorang pun akan merampas ... darimu
  rationale: Bentuk masa depan sesuai dengan orientasi kalimat dan idiom Indonesia; 'merampas' menyampaikan tindakan mengambil sehingga sukacita itu tidak lagi dimiliki.
theological_decisions:
- issue: Subjek dan penekanan dalam perjumpaan kembali
  choice: Aku akan melihat kamu lagi
  alternative: kamu akan melihat Aku lagi
  rationale: Teks Yunani secara jelas menempatkan Yesus sebagai subjek orang pertama dan para murid sebagai objek. Bentuk ini menjaga prakarsa Yesus dalam perjumpaan kembali serta tidak menyelaraskan ayat ini dengan Yohanes 16:16.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'kamu' dipakai secara kolektif untuk para murid; kapitalisasi 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus.
