  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: id
  text: Sampai sekarang kamu belum meminta apa pun dalam nama-Ku. Mintalah[a], maka kamu akan menerima, supaya sukacitamu menjadi penuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Teruslah meminta, maka kamu akan menerima.” Bentuk perintah “mintalah” dalam konteks ini dapat menyiratkan tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Sampai sekarang
  rationale: Ungkapan ini menunjuk pada rentang waktu hingga saat berbicara; bentuk ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: kamu belum meminta apa pun
  rationale: Dalam konstruksi dengan 'sampai sekarang', 'belum ... apa pun' menyampaikan negasi Yunani secara alami dan mempertahankan arti meminta sesuatu, bukan sekadar mengajukan pertanyaan.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Terjemahan harfiah ini mempertahankan ungkapan khas Yohanes beserta cakupan maknanya mengenai pribadi, wewenang, dan misi Yesus tanpa mempersempitnya.
- source_word: αἰτεῖτε
  choice: Mintalah
  rationale: Imperatif ini diterjemahkan secara wajar tanpa memaksakan apakah tindakannya satu kali atau berulang; kemungkinan nuansa berkelanjutan dicatat dalam catatan kaki.
- source_word: λήμψεσθε
  choice: kamu akan menerima
  rationale: Bentuk futur ini menyatakan hasil yang dijanjikan dari meminta dan paling alami diterjemahkan dengan 'menerima' dalam konteks doa.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini mempertahankan nuansa tujuan atau hasil dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: sukacitamu menjadi penuh
  rationale: Pilihan ini mempertahankan gambaran kepenuhan dan keadaan hasil yang terkandung dalam konstruksi perfektum, sekaligus tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna berdoa 'dalam nama-Ku'
  choice: Mempertahankan ungkapan harfiah 'dalam nama-Ku'.
  alternative: atas nama-Ku; di bawah wewenang-Ku; dalam persekutuan dengan-Ku
  rationale: Ungkapan ini kaya secara teologis dan tidak selayaknya dibatasi pada satu penafsiran. Bentuk harfiah mempertahankan hubungan dengan pribadi, wewenang, dan misi Yesus serta membiarkan ketegangan maknanya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina 'kamu' mempertahankan sapaan jamak kepada para murid tanpa bentuk yang kaku; kapitalisasi '-Ku' mengikuti kebiasaan penulisan rujukan ilahi dalam terjemahan Alkitab Indonesia.
