  source_fidelity: 'Terjemahan secara akurat menyampaikan semua unsur Yunani: kontras νῦν δέ (“Namun sekarang”), gerak terarah ὑπάγω (“Aku pergi kepada”), pengutus yang tetap tidak disebutkan namanya (“Dia yang mengutus Aku”), negasi partitif οὐδεὶς ἐξ ὑμῶν, serta pertanyaan langsung Ποῦ ὑπάγεις; (“Ke mana Engkau pergi?”). Tidak ada penambahan identifikasi ‘Bapa’ ke dalam teks utama.'
