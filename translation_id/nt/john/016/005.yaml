id: JHN.16.5
reference: John 16:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: id
  text: Namun sekarang Aku pergi kepada Dia yang mengutus Aku, dan tidak seorang pun dari kalian bertanya kepada-Ku, “Ke mana Engkau pergi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Mempertahankan kontras wacana yang ditandai δέ sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ὑπάγω
  choice: Aku pergi
  rationale: Menyampaikan gerak menuju suatu tujuan tanpa mempersempit maknanya menjadi sekadar berangkat atau meninggalkan; bentuk kini bahasa Yunani dapat diungkapkan secara alami dengan bentuk ini dalam bahasa Indonesia.
- source_word: πρὸς τὸν πέμψαντά με
  choice: kepada Dia yang mengutus Aku
  rationale: Menerjemahkan partisip berartikel sebagai sebutan personal tanpa menambahkan identitas 'Bapa' yang tidak dinyatakan secara eksplisit dalam klausa Yunani.
- source_word: πέμψαντά
  choice: mengutus
  rationale: Dalam konteks Injil Yohanes, πέμπω membawa nuansa pengiriman dengan suatu misi; 'mengutus' lebih tepat daripada sekadar 'mengirim' untuk seorang pribadi.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: tidak seorang pun dari kalian
  rationale: Mengungkapkan penyangkalan menyeluruh dan konstruksi partitif secara jelas dalam bahasa Indonesia modern.
- source_word: ἐρωτᾷ με
  choice: bertanya kepada-Ku
  rationale: Dalam konteks ini ἐρωτάω berarti mengajukan pertanyaan, bukan meminta sesuatu.
- source_word: Ποῦ ὑπάγεις;
  choice: Ke mana Engkau pergi?
  rationale: Merupakan bentuk pertanyaan arah yang alami dan mempertahankan verba gerak yang sama seperti pada pernyataan sebelumnya.
theological_decisions:
- issue: Identitas 'Dia yang mengutus Aku'
  choice: Tidak menyebut 'Bapa' secara eksplisit.
  alternative: kepada Bapa yang mengutus Aku
  rationale: Referennya dapat dipahami dari konteks Yohanes, tetapi teks Yunani ayat ini hanya memakai partisip berartikel. Terjemahan mempertahankan apa yang dinyatakan dan tidak menambahkan identifikasi teologis ke dalam teks utama.
- issue: Ketegangan dengan pertanyaan para murid sebelumnya
  choice: Mempertahankan pernyataan mutlak 'tidak seorang pun dari kalian bertanya'.
  alternative: tidak seorang pun dari kalian sekarang bertanya
  rationale: Meskipun Yohanes 13:36 dan 14:5 memuat pertanyaan terkait tujuan Yesus, νῦν tidak secara eksplisit melekat pada verba 'bertanya'. Terjemahan tidak menyisipkan penjelasan yang dapat menghapus ketegangan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus dan pengutus-Nya memakai kapitalisasi devosional yang lazim. 'Kalian' dipilih untuk menandai bentuk jamak ὑμῶν secara jelas.
