  source_fidelity: Revisi diperlukan karena “hendak Kukatakan” terutama menyatakan niat atau rencana, sedangkan ἔχω + infinitif menyatakan bahwa masih ada banyak hal yang perlu/disisakan untuk dikatakan. “Tidak sanggup ... sekarang” menyampaikan οὐ δύνασθε ... ἄρτι secara langsung tanpa menambahkan nuansa progresif “belum.”
  naturalness: Teks revisi tetap baku, jelas, dan alami dalam bahasa Indonesia modern. “Kalian” wajar untuk bentuk jamak ὑμῖν; “menanggungnya” mempertahankan objek kolektif tanpa memaksa pembedaan tunggal/jamak yang tidak ditandai oleh sufiks Indonesia.
  terminology: “Menanggung” merupakan padanan yang baik untuk βαστάζειν dalam konteks metaforis ini, karena dapat mencakup memikul beban maupun bertahan di bawahnya tanpa menyempitkan makna menjadi sekadar memahami atau mendengar.
