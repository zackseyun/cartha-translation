base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: id
  text: Masih banyak hal yang perlu Kukatakan kepada kalian, tetapi kalian tidak sanggup menanggungnya sekarang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani yang diterjemahkan “menanggung” juga dapat berarti “memikul” atau “bertahan menghadapi sesuatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι πολλὰ ἔχω
  choice: Masih banyak hal yang hendak
  rationale: Ungkapan ini menyampaikan bahwa Yesus masih mempunyai banyak hal untuk disampaikan. Susunan Indonesia ini alami tanpa mengubahnya menjadi kewajiban atau sekadar keinginan.
- source_word: ὑμῖν λέγειν
  choice: Kukatakan kepada kalian
  rationale: ὑμῖν berbentuk jamak; “kalian” menyatakan bahwa Yesus berbicara kepada para murid sebagai kelompok. “Kukatakan” mempertahankan arti luas λέγειν.
- source_word: οὐ δύνασθε
  choice: kalian belum sanggup
  rationale: “Sanggup” menyatakan kemampuan, sedangkan “belum” sesuai dengan keterbatasan pada saat ini yang ditandai ἄρτι dan konteks ayat-ayat berikutnya.
- source_word: βαστάζειν
  choice: menanggungnya
  rationale: Pilihan ini mempertahankan metafora memikul atau menanggung beban dan tidak mempersempit maksudnya menjadi hanya memahami secara intelektual atau hanya tahan mendengarnya.
- source_word: ἄρτι
  choice: sekarang
  rationale: Menandai keadaan para murid pada waktu itu, berlawanan dengan perkembangan yang akan dijelaskan sesudahnya.
theological_decisions:
- issue: Makna βαστάζειν sehubungan dengan ketidaksanggupan para murid saat itu
  choice: Para murid saat itu belum sanggup menanggung bobot pengajaran lebih lanjut.
  alternative: Para murid belum dapat sepenuhnya memahaminya, atau belum tahan mendengarnya.
  rationale: βαστάζειν dapat berarti membawa, menanggung, atau bertahan menghadapi sesuatu. “Menanggungnya” menjaga keluasan makna kognitif dan rohani tanpa menentukan salah satunya sebagai satu-satunya maksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak ὑμῖν. Bentuk “-nya” secara alami tidak menandai tunggal atau jamak sehingga tetap dapat merujuk pada keseluruhan banyak hal yang hendak disampaikan.
