    rationale: Ἄρτι secara langsung berarti ‘sekarang/saat ini’. Konteks memang mengarah pada perubahan di kemudian hari, tetapi “tidak sanggup ... sekarang” mempertahankan pembatasan waktu sumber secara lebih eksplisit.
