id: JHN.16.8
reference: John 16:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: id
  text: Dan ketika Ia datang[a][c], Ia akan membuktikan kepada dunia kesalahannya mengenai dosa, mengenai kebenaran[b], dan mengenai penghakiman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai kata tunjuk yang menegaskan, secara harfiah, “Dia itu”; kata ini merujuk kepada Penolong yang akan datang.
    reason: lexical_alternative
  - marker: b
    text: Atau “keadilan.”
    reason: alternative_reading
  - marker: c
    text: Atau “Dan ketika Dia datang, Dia itu akan membuktikan ….”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθὼν
  choice: ketika ... datang
  rationale: Partisip aoris ini berfungsi temporal; bentuk ini menyampaikan makna waktunya secara wajar dalam bahasa Indonesia.
- source_word: ἐκεῖνος
  choice: dia itu
  rationale: Pronomina demonstratif Yunani ini bersifat menegaskan dan menunjuk kembali kepada Penolong dalam konteks terdekat. 'Dia itu' mempertahankan penekanan tersebut tanpa menambahkan identifikasi baru.
- source_word: ἐλέγξει
  choice: akan menunjukkan kesalahan
  rationale: Kata ini mencakup tindakan menyingkapkan kesalahan atau membuktikan bahwa pihak lain salah. Pilihan ini mempertahankan daya moral-forensiknya tanpa menyiratkan bahwa dunia pasti bertobat atau mengakui kesalahannya.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: '''Dunia'' mempertahankan keluasan dan resonansi khas istilah κόσμος dalam Injil Yohanes tanpa mempersempitnya menjadi hanya sistem dunia atau orang-orang tertentu.'
- source_word: περὶ
  choice: tentang
  rationale: Pengulangan 'tentang' mempertahankan kesejajaran retoris tiga frasa Yunani dalam bahasa Indonesia yang alami.
- source_word: ἁμαρτίας
  choice: dosa
  rationale: Bentuk tunggal dipertahankan dan ayat berikutnya dibiarkan menjelaskan maksud khususnya.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: '''Kebenaran'' merupakan padanan teologis yang alami bagi δικαιοσύνη dalam konteks ini dan selaras dengan penjelasan Kristologis pada ayat berikutnya; kemungkinan arti ''keadilan'' dicatat dalam catatan kaki.'
- source_word: κρίσεως
  choice: penghakiman
  rationale: Pilihan ini mempertahankan nuansa hukum dan eskatologis tanpa mempersempit maknanya menjadi hasil berupa penghukuman.
theological_decisions:
- issue: Rujukan dan daya penegasan ἐκεῖνος
  choice: Demonstratif ini merujuk kepada Penolong/Roh dan diterjemahkan secara tegas sebagai 'dia itu'.
  alternative: Pronomina sederhana 'dia', dengan penekanannya dibiarkan tersirat.
  rationale: Konteks langsung menentukan rujukannya, sedangkan bentuk demonstratif sumber memang memberi penekanan. Terjemahan ini tidak menambahkan klaim doktrinal di luar konteks wacana.
- issue: Makna δικαιοσύνη
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks Yohanes 16:10, 'kebenaran' lebih sesuai dengan penjelasan mengenai kepergian Yesus kepada Bapa, sementara alternatif leksikal yang nyata tetap dicatat.
- issue: Dampak tindakan ἐλέγξει atas dunia
  choice: menunjukkan kesalahan dunia
  alternative: menyadarkan dunia; membuktikan bahwa dunia bersalah
  rationale: Pilihan utama mempertahankan unsur penyingkapan atau pembuktian kesalahan, tetapi tidak menentukan bahwa setiap orang di dunia mengalami keinsafan batin atau pertobatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. Huruf kecil pada pronomina mengikuti bentuk teks sumber yang tidak membedakan kapitalisasi penghormatan. Pengulangan 'tentang' sengaja dipertahankan untuk mencerminkan anafora Yunani.
