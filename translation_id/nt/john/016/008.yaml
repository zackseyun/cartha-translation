  to: Dan ketika Ia datang[a][c], Ia akan membuktikan kepada dunia kesalahannya mengenai dosa, mengenai kebenaran[b], dan mengenai penghakiman.
  rationale: Revisi mengganti ungkapan yang kurang jelas dengan "membuktikan kepada dunia kesalahannya mengenai", yang secara alami menyampaikan fungsi ἐλέγξει sebagai membuktikan atau menyingkapkan kesalahan, tanpa menyatakan bahwa dunia pasti bertobat. Pronomina "Ia" memperbaiki keluwesan ragam baku; penegasan ἐκεῖνος tetap dicatat secara eksplisit dalam catatan kaki. Pengulangan "mengenai" mempertahankan paralelisme tiga kali περὶ.
