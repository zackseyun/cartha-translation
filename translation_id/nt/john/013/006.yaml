  source_fidelity: Ungkapan “Lalu” merepresentasikan οὖν dengan baik, dan “Petrus berkata kepada-Nya” tepat menangkap λέγει αὐτῷ. Namun, “sampai kepada” lebih menyatakan telah tiba daripada gerak datang yang dinyatakan oleh ἔρχεται; “datang kepada” lebih dekat dengan sumber. “Hendak membasuh” dapat diterima secara kontekstual sebagai pertanyaan yang menantang tindakan yang segera dilakukan, tetapi sedikit menggeser bentuk kini νίπτεις ke arah niat/masa depan. “Apakah Engkau membasuh kakiku?” mempertahankan bentuk kini tanpa kehilangan daya retorisnya.
  naturalness: Teks revisi tetap menggunakan bahasa Indonesia baku dan bermartabat. “Datang kepada Simon Petrus” lebih lazim dan langsung daripada “sampai kepada Simon Petrus.” Bentuk pertanyaan dengan “apakah” alami dalam ragam naratif-terjemahan modern.
  terminology: “Tuhan” merupakan terjemahan yang wajar untuk κύριε dalam konteks ini, dengan catatan kaki yang secara tepat menjaga kemungkinan sapaan hormat “Tuan.” “Membasuh” tepat untuk νίπτω, yakni mencuci bagian tubuh, dan “kakiku” idiomatis untuk μου τοὺς πόδας.
