  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: id
  text: Lalu Yesus datang kepada Simon Petrus. Petrus berkata kepada-Nya[a], “Tuhan, apakah Engkau membasuh kakiku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan “Tuhan” juga dapat diterjemahkan “Tuan”. Kata Yunani κύριε dapat berfungsi sebagai sapaan hormat; “Tuhan” dipakai dalam teks sebagai terjemahan utama.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: sampai
  rationale: Bentuk kini historis menghidupkan narasi; dalam konteks Yesus mendatangi para murid secara bergiliran, 'sampai kepada' menyatakan gerak menuju Simon Petrus secara alami.
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan alur narasi tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: kepada Simon Petrus
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang; 'kepada' sesuai dengan ungkapan 'sampai kepada'.
- source_word: λέγει αὐτῷ
  choice: Petrus berkata kepada-Nya
  rationale: Subjek tersirat ditentukan oleh alur dialog sebagai Simon Petrus. Nama 'Petrus' dan pronomina hormat memperjelas para pelaku dalam bahasa Indonesia, sementara bentuk kini historis diterjemahkan dengan bentuk naratif Indonesia yang tidak menandai kala.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan hormat sekaligus kemungkinan bobot kristologis κύριε dalam Injil Yohanes.
- source_word: σύ
  choice: Engkau
  rationale: Pronomina yang dinyatakan secara eksplisit dalam Yunani bersifat emfatis; 'Engkau' mempertahankan tekanan dan cocok sebagai sapaan kepada Yesus dalam ragam bermartabat.
- source_word: μου
  choice: kakiku
  rationale: Genitif kepunyaan paling alami dilekatkan pada nomina dalam bahasa Indonesia.
- source_word: νίπτεις
  choice: hendak membasuh
  rationale: Dalam situasi ini tindakan Yesus sedang berlangsung dalam rangkaian pembasuhan, tetapi terhadap kaki Petrus masih dipertanyakan sebagai tindakan yang hendak dilakukan. 'Membasuh' tepat untuk mencuci bagian tubuh.
- source_word: τοὺς πόδας
  choice: kakiku
  rationale: Artikel Yunani dan pronomina genitif diterjemahkan secara idiomatis sebagai bentuk posesif Indonesia.
theological_decisions:
- issue: Makna κύριε sebagai sapaan Petrus kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' mempertahankan sapaan hormat dan resonansi kristologis yang mungkin dimaksudkan, sedangkan catatan kaki menjaga kemungkinan bahwa kata itu berfungsi sebagai sapaan hormat ''Tuan''.'
- issue: Aspek νίπτεις dalam pertanyaan Petrus
  choice: hendak membasuh
  alternative: sedang membasuh
  rationale: Konteks menunjukkan Yesus telah memulai pembasuhan kaki para murid, tetapi ketika sampai kepada Petrus tindakan terhadap kakinya dipandang sebagai tindakan yang segera akan dilakukan. Pilihan ini tidak mengubah tindakan menjadi sekadar niat jauh di masa depan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yesus' serta 'Petrus' digunakan untuk menghindari ketidakjelasan rujukan pronomina. Bentuk 'kepada-Nya' mengikuti konvensi pronomina hormat bagi Yesus. Pertanyaan dibuat alami sekaligus mempertahankan penekanan pada σύ ('Engkau').
