    rationale: Pilihan ini lebih berfokus pada hasil kedatangan (tiba) daripada gerak menuju seseorang. “Datang kepada” merepresentasikan verba sumber secara lebih langsung dan alami.
  - severity: low
    issue: “hendak membasuh” untuk νίπτεις
    rationale: Kata “hendak” menambahkan nuansa intensi atau tindakan yang akan datang, sedangkan verba Yunani berbentuk kini. Menggunakan “apakah Engkau membasuh” mempertahankan aspek kini dan pertanyaan Petrus.
