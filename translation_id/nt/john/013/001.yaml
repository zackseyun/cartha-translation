source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: id
  text: Sebelum Hari Raya Paskah, Yesus tahu bahwa saat-Nya telah tiba untuk pergi dari dunia ini kepada Bapa. Setelah mengasihi orang-orang milik-Nya yang ada di dunia, Ia mengasihi mereka sampai akhir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sepenuhnya” atau “dengan sepenuh-penuhnya.” Ungkapan Yunani ini dapat menyatakan kasih yang bertahan sampai saat terakhir sekaligus kasih dalam kepenuhannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Sebelum hari raya Paskah
  rationale: Πρό dengan genitif menyatakan waktu sebelum perayaan; δέ adalah penghubung ringan yang tidak perlu dibuat eksplisit dalam bahasa Indonesia.
- source_word: εἰδὼς ὁ Ἰησοῦς
  choice: Yesus tahu
  rationale: Partisip kini menyatakan kesadaran Yesus yang menyertai tindakan utama; bentuk klausa finit lebih alami dalam bahasa Indonesia.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: saat-Nya telah tiba
  rationale: Mempertahankan idiom khas Yohanes mengenai waktu penentu bagi penderitaan, kepergian, dan pemuliaan Yesus.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: untuk beralih dari dunia ini kepada Bapa
  rationale: Beralih mempertahankan gagasan perpindahan atau transisi tanpa menyempitkannya hanya menjadi kematian; kepada Bapa menjaga gelar relasional khas Yohanes.
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: Setelah mengasihi orang-orang milik-Nya yang ada di dunia
  rationale: Setelah mengasihi menyampaikan partisip aoris sebagai keadaan pendahulu atau rangkuman, sedangkan orang-orang milik-Nya mempertahankan cakupan τοὺς ἰδίους tanpa membatasinya secara eksplisit hanya kepada para murid.
- source_word: εἰς τέλος ἠγάπησεν αὐτούς
  choice: Ia mengasihi mereka sampai kesudahannya
  rationale: Ungkapan ini mempertahankan kemungkinan makna temporal sampai akhir sekaligus membuka gema makna kasih yang sepenuhnya; alternatif kualitatif dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna εἰς τέλος dalam pernyataan puncak tentang kasih Yesus
  choice: sampai kesudahannya
  alternative: sepenuhnya; sampai pada tingkat yang paling penuh
  rationale: Ungkapan Yunani dapat menunjuk pada kasih yang berlangsung hingga akhir dan pada kasih dalam kepenuhannya. Teks utama mempertahankan ketegangan makna itu, sementara catatan kaki menjelaskan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dipecah menjadi dua kalimat agar alami dan mudah dipahami, tanpa menghilangkan hubungan logis antarklausa. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan terjemahan Alkitab Indonesia.
