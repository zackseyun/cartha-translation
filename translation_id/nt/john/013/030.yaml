id: JHN.13.30
reference: John 13:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: id
  text: Maka setelah menerima potongan roti itu[a], orang itu[b] segera keluar. Dan saat itu malam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “suapan itu” atau “potongan itu”. Kata Yunani ψωμίον merujuk pada sepotong kecil roti atau makanan yang diberikan dalam perjamuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang itu”. Ungkapan Yunani ini lebih tegas daripada sekadar “dia” dan tampaknya menyoroti Yudas.
    reason: lexical_alternative
  - marker: c
    text: Pernyataan bahwa saat itu malam secara harfiah menunjukkan waktu kejadian, tetapi mungkin juga menggemakan tema terang dan kegelapan dalam Injil Yohanes.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: setelah menerima
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului verba utama. “Setelah menerima” menyampaikan urutan tersebut secara alami; dalam konteks ini roti itu diberikan kepada Yudas, sehingga “menerima” lebih wajar daripada “mengambil” tanpa mengubah peristiwa.
- source_word: οὖν
  choice: maka
  rationale: Menandai kelanjutan atau konsekuensi dalam alur cerita. “Maka” ringkas dan sesuai dengan ragam naratif Indonesia.
- source_word: τὸ ψωμίον
  choice: potongan roti itu
  rationale: ψωμίον menunjuk pada sepotong kecil roti atau makanan. Pilihan ini jelas, konkret, dan menghindari istilah yang kuno atau kurang lazim.
- source_word: ἐκεῖνος
  choice: orang itu
  rationale: Pronomina penunjuk ini lebih tegas daripada sekadar αὐτός atau pronomina biasa. “Orang itu” mempertahankan penonjolan dan sedikit efek penjauhan terhadap Yudas.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Menerjemahkan makna spasial dasar ἐξέρχομαι secara langsung dan alami.
- source_word: εὐθύς
  choice: segera
  rationale: Menunjukkan bahwa tindakan itu dilakukan tanpa penundaan.
- source_word: ἦν δὲ νύξ
  choice: Dan saat itu malam
  rationale: Mempertahankan pernyataan waktu yang sederhana serta daya sastra kalimat Yunani tanpa memasukkan penafsiran simbolis ke dalam teks utama.
theological_decisions:
- issue: Kemungkinan makna simbolis “malam” dalam Injil Yohanes
  choice: 'Menerjemahkannya secara harfiah sebagai keterangan waktu: “Dan saat itu malam.”'
  alternative: Menjelaskan “malam” dalam teks utama sebagai lambang kegelapan rohani.
  rationale: Dalam Injil Yohanes, terang dan kegelapan kerap memiliki gema simbolis, terutama dalam konteks Yudas. Namun, klausa Yunani ini sendiri berbentuk pernyataan waktu yang lugas. Terjemahan mempertahankan kemungkinan makna ganda tanpa menetapkannya secara eksplisit.
- issue: Daya penunjukan ἐκεῖνος terhadap Yudas
  choice: Mempertahankan penekanan dengan “orang itu”.
  alternative: Menggunakan pronomina biasa “dia”.
  rationale: Bentuk demonstratif Yunani menonjolkan pelaku dan mungkin memberi efek penjauhan. “Orang itu” mempertahankan daya retoris tersebut tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan khidmat. Susunan kalimat mempertahankan urutan tindakan, penekanan pada Yudas, dan kalimat penutup yang singkat serta penuh gema sastra.
