id: JHN.13.34
reference: John 13:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: id
  text: 'Aku memberikan kepadamu sebuah perintah baru: hendaklah kamu saling mengasihi.[a] Sama seperti Aku telah mengasihi kamu, demikian juga kamu hendaknya saling mengasihi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya kamu saling mengasihi.”
    reason: ἵνα dapat menyatakan isi perintah atau tujuan; terjemahan utama menonjolkan daya perintah dalam konteks ini.
  - marker: b
    text: Bagian ini juga dapat diterjemahkan, “supaya kamu juga saling mengasihi.”
    reason: Klausa ἵνα kedua dapat dibaca dengan nuansa tujuan atau hasil, bukan hanya sebagai pengulangan yang bersifat nasihat.
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: sebuah perintah baru
  rationale: “Perintah” secara alami menyampaikan daya etis dan otoritatif ἐντολή dalam bahasa Indonesia, sedangkan “baru” mempertahankan καινός tanpa menjelaskan secara berlebihan dalam hal apa perintah itu baru.
- source_word: δίδωμι ὑμῖν
  choice: Aku memberikan kepadamu
  rationale: Bentuk kini δίδωμι diterjemahkan dengan bentuk kini bahasa Indonesia, dan datif ὑμῖν dipertahankan sebagai penerima yang dinyatakan secara eksplisit.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: hendaklah kamu saling mengasihi
  rationale: Sesudah pemberian sebuah perintah, ἵνα menyatakan isi atau tujuan dengan daya perintah; “hendaklah” menyampaikannya secara wajar dan bermartabat.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: Sama seperti Aku telah mengasihi kamu
  rationale: “Sama seperti” menandai kasih Yesus sebagai pola dan ukuran. “Telah mengasihi” menyatakan tindakan kasih yang sudah diperlihatkan tanpa membatasi kasih itu pada satu peristiwa tertentu.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: demikian juga kamu hendaknya saling mengasihi
  rationale: “Demikian juga kamu” mempertahankan penekanan καὶ ὑμεῖς, sedangkan “hendaknya” menjaga daya nasihat/perintah dari klausa ἵνα kedua.
theological_decisions:
- issue: Sifat kebaruan perintah
  choice: Diterjemahkan secara langsung sebagai “sebuah perintah baru” tanpa menjelaskan bagaimana perintah itu baru.
  alternative: Baru dalam waktu, baru dalam mutu, atau baru dalam perwujudannya melalui kasih Yesus.
  rationale: Ayat ini menyebut perintah tersebut baru, tetapi tidak menentukan secara eksplisit segi kebaruannya; terjemahan mempertahankan ketegangan itu.
- issue: Hubungan klausa ἵνα kedua dengan kasih Yesus
  choice: 'Diterjemahkan dengan daya perintah: “demikian juga kamu hendaknya saling mengasihi.”'
  alternative: “Supaya kamu juga saling mengasihi,” yang dapat lebih menonjolkan hasil atau tujuan.
  rationale: Bentuk Yunani memungkinkan nuansa tujuan/hasil sekaligus meneruskan isi perintah; teks utama menyampaikan daya perintah, sementara catatan kaki mempertahankan alternatif sintaksis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Aku” untuk Yesus ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. “Saling mengasihi” dipilih karena alami dan mempertahankan hubungan timbal balik ἀλλήλους serta pengulangan akar ἀγαπάω.
