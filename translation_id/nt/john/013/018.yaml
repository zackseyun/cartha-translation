  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: id
  text: '“Aku tidak berbicara tentang kamu semua.[a] Aku tahu siapa yang telah Kupilih. Namun, ini supaya Kitab Suci digenapi: ‘Orang yang makan roti-Ku telah mengangkat tumitnya melawan Aku.’[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Aku tidak berkata mengenai kamu semua.”
    reason: lexical_alternative
  - marker: b
    text: Kutipan atau acuan kepada Mazmur 41:10; dalam banyak terjemahan Inggris, Mazmur 41:9.
    reason: cross_reference
  - marker: c
    text: Atau “telah mengangkat tumitnya terhadap Aku.” Ungkapan ini menggambarkan permusuhan dan pengkhianatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Aku tidak berbicara tentang kamu semua
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan cakupan penyangkalan serta arti περὶ sebagai ‘tentang’ atau ‘mengenai’.
- source_word: οἶδα
  choice: Aku tahu
  rationale: 'Walaupun bentuk Yunani ini secara morfologis adalah bentuk perfek, dalam Yunani Koine maknanya berfungsi sebagai kala kini: ‘tahu’.'
- source_word: τίνας ἐξελεξάμην
  choice: siapa saja yang telah Kupilih
  rationale: ‘Siapa saja’ menyampaikan objek personal jamak yang tidak ditentukan secara satu per satu, sedangkan ‘telah Kupilih’ mempertahankan tindakan pemilihan yang sudah berlangsung dan tetap relevan.
- source_word: ἀλλ’ ἵνα
  choice: Namun, hal ini terjadi supaya
  rationale: Terjemahan ini memperjelas hubungan antarklausa secara wajar tanpa menentukan apakah ἵνα terutama menyatakan tujuan atau hasil.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: Kitab Suci digenapi
  rationale: Dalam Injil Yohanes, γραφή lazim menunjuk pada Kitab Suci, dan bentuk pasif πληρωθῇ dipertahankan dengan ‘digenapi’.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Orang yang makan roti-Ku
  rationale: Partisip substantival diterjemahkan secara alami sebagai ‘Orang yang’, sementara μου dipahami menerangkan ‘roti’, sesuai susunan dan konteks kutipan.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: telah mengangkat tumitnya melawan Aku
  rationale: Metafora dalam kutipan Mazmur dipertahankan, termasuk gambaran tumit yang diangkat sebagai tindakan permusuhan atau pengkhianatan.
theological_decisions:
- issue: Hubungan antara pemilihan oleh Yesus dan pengkhianat
  choice: Menerjemahkan ἐξελεξάμην secara langsung sebagai ‘telah Kupilih’ tanpa menjelaskan jenis pemilihan yang dimaksud.
  alternative: Menafsirkannya secara eksplisit sebagai pemilihan untuk keselamatan atau hanya sebagai pengangkatan menjadi rasul.
  rationale: Ayat ini tidak mendefinisikan kategori teologis pemilihan tersebut. Terjemahan mempertahankan ketegangan teks tanpa memasukkan kesimpulan doktrinal tertentu.
- issue: Daya ἀλλ’ ἵνα dalam kaitannya dengan pengkhianatan dan penggenapan Kitab Suci
  choice: Namun, hal ini terjadi supaya Kitab Suci digenapi
  alternative: Namun, pengkhianatan itu terjadi karena Kitab Suci harus menjadi kenyataan.
  rationale: Pilihan utama mempertahankan bahasa penggenapan serta kemungkinan nuansa tujuan atau hasil, tanpa menambahkan penjelasan deterministis tentang sebab pengkhianatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, khidmat, dan mudah dipahami. Kata ganti ilahi mengikuti kebiasaan ejaan Alkitab bahasa Indonesia dengan huruf kapital pada bentuk terikat seperti ‘Kupilih’ dan ‘roti-Ku’. Metafora kutipan dipertahankan, lalu dijelaskan singkat dalam catatan kaki.
