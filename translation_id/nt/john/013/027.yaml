revisions:
- from: Sesudah potongan roti itu[a], saat itulah Iblis masuk ke dalam dirinya. Karena itu, Yesus berkata kepadanya, “Apa yang sedang kaulakukan, lakukanlah lebih cepat[b].”
  to: Setelah ia menerima potongan roti itu[a], Iblis masuk ke dalam dia. Lalu Yesus berkata kepadanya, “Apa yang kaulakukan, lakukanlah lebih cepat[b].”
  rationale: Revisi memperbaiki rujukan pronominal yang berpotensi membalikkan makna, melancarkan elipsis temporal Yunani dalam bahasa Indonesia, dan memakai penghubung naratif yang tidak menambahkan kausalitas. Terjemahan tetap menyatakan secara langsung bahwa Iblis masuk ke dalam dia, tanpa penjelasan doktrinal tambahan, dan tetap mempertahankan nuansa komparatif pada perintah Yesus.
  reviewer_model: gpt-5.6-terra
