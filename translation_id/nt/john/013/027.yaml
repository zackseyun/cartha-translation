id: JHN.13.27
reference: John 13:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: id
  text: Setelah ia menerima potongan roti itu[a], Iblis masuk ke dalam dia. Lalu Yesus berkata kepadanya, “Apa yang kaulakukan, lakukanlah lebih cepat[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suapan itu.” Kata Yunani ψωμίον menunjuk pada sepotong kecil makanan; dalam konteks perjamuan ini, kemungkinan besar roti yang dicelupkan dan diberikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan cepat.” Kata Yunani τάχιον berbentuk komparatif, yaitu “lebih cepat,” meskipun dalam konteks ini dapat diungkapkan secara lebih luwes sebagai “dengan cepat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: potongan roti
  rationale: Kata ini menunjuk pada sepotong kecil makanan; dalam konteks perjamuan ini kemungkinan besar roti yang telah dicelupkan. Pilihan ini konkret dan mudah dipahami.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: masuk ke dalam dirinya
  rationale: Ungkapan ini mempertahankan gambaran langsung tentang masuknya pribadi yang jahat tanpa menambahkan bahwa ia masuk ke dalam hati atau menjelaskan tingkat penguasaannya.
- source_word: ὁ Σατανᾶς
  choice: Iblis
  rationale: ‘Iblis’ adalah sebutan baku dan alami dalam bahasa Indonesia untuk tokoh yang disebut Σατανᾶς dalam Perjanjian Baru.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Karena itu, Yesus berkata kepadanya
  rationale: οὖν menyatakan kaitan dengan peristiwa sebelumnya, sedangkan bentuk lampau ‘berkata’ menghasilkan narasi Indonesia yang alami tanpa mengubah urutan peristiwa.
- source_word: Ὃ ποιεῖς
  choice: Apa yang sedang kaulakukan
  rationale: Bentuk kini dipertahankan sebagai tindakan yang sedang berlangsung atau segera dijalankan, tanpa menafsirkannya sebagai ‘apa yang akan kaulakukan’.
- source_word: ποίησον
  choice: lakukanlah
  rationale: Bentuk imperatif diterjemahkan dengan perintah yang singkat dan tegas.
- source_word: τάχιον
  choice: lebih cepat
  rationale: τάχιον berbentuk komparatif; ‘lebih cepat’ mempertahankan nuansa itu, meskipun ungkapan ‘dengan cepat’ lebih lazim dalam sejumlah terjemahan.
theological_decisions:
- issue: Sifat tindakan Iblis terhadap Yudas
  choice: Iblis masuk ke dalam dirinya
  alternative: Iblis menguasai dia; Yudas menyerahkan dirinya kepada Iblis
  rationale: Teks menyatakan masuknya Iblis secara langsung, tetapi tidak merinci sifat atau kadar penguasaan yang terjadi. Terjemahan tidak mereduksinya menjadi metafora ataupun mengembangkannya menjadi doktrin yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan ‘saat itulah’ mempertahankan penekanan τότε, sedangkan ‘ke dalam dirinya’ menghindari penambahan ‘hati’ yang tidak terdapat dalam teks Yunani.
