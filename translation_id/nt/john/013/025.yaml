  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: id
  text: Maka ia, dalam posisi demikian, bersandar pada dada Yesus dan berkata kepada-Nya, “Tuhan, siapakah itu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπεσὼν (ἀναπίπτω)
  choice: bersandar ke belakang
  rationale: Dalam konteks perjamuan, kata ini mencerminkan posisi makan sambil berbaring; di sini bentuk partisipnya juga menggambarkan gerakan mendekat ke dada Yesus.
- source_word: ἐκεῖνος
  choice: ia
  rationale: Pronomina ini menunjuk kembali kepada murid yang baru disebutkan. 'Ia' alami dalam bahasa Indonesia dan tidak menambahkan sebutan yang tidak dinyatakan dalam ayat ini.
- source_word: οὕτως
  choice: sedemikian rupa
  rationale: Ungkapan ini mempertahankan kaitan dengan posisi murid tersebut yang telah digambarkan dalam konteks sebelumnya.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: pada dada Yesus
  rationale: '''Dada'' merupakan padanan modern dan wajar bagi στῆθος, sedangkan ''pada'' membiarkan hubungan fisiknya cukup terbuka sesuai ungkapan Yunani.'
- source_word: λέγει αὐτῷ
  choice: berkata kepada-Nya
  rationale: Bahasa Indonesia dapat memakai bentuk tak bertanda waktu untuk present historis Yunani tanpa perlu mengubahnya menjadi bentuk lampau.
- source_word: Κύριε
  choice: Tuhan
  rationale: Padanan ini mempertahankan baik fungsi sapaan hormat maupun bobot kristologis yang mungkin terkandung dalam penggunaan κύριος kepada Yesus.
- source_word: τίς ἐστιν;
  choice: siapakah itu?
  rationale: Pertanyaan ini meminta identitas orang yang dimaksud. 'Siapakah itu?' formal, jelas, dan alami dalam konteks tersebut.
theological_decisions:
- issue: Penerjemahan κύριος sebagai sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: '''Tuhan'' mempertahankan keterbukaan antara sapaan hormat dan makna kristologis dalam Injil Yohanes tanpa mereduksinya menjadi kesopanan belaka.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerakan partisipial, penunjukan pronominal, serta present historis Yunani secara alami.
