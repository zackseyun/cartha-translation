  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: id
  text: Simon Petrus berkata kepada-Nya, “Tuhan, ke manakah Engkau pergi?” Yesus menjawab, “Ke mana Aku pergi, engkau tidak dapat mengikuti Aku sekarang,[a] tetapi kelak engkau akan mengikuti Aku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani secara eksplisit memakai kata kerja yang menyatakan kemampuan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “kelak engkau akan mengikuti Aku” mungkin menyinggung bahwa Petrus kemudian akan mengikuti Yesus dalam penderitaan atau kematian, tetapi kata-kata ini sendiri tidak menjelaskan caranya.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani memberi kejelasan dan daya hidup pada narasi; dalam bahasa Indonesia, “berkata” tetap alami tanpa harus menandai waktu secara eksplisit.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini mempertahankan penghormatan sekaligus kemungkinan bobot teologis gelar κύριος dalam Injil Yohanes.
- source_word: ποῦ ὑπάγεις
  choice: ke manakah Engkau pergi
  rationale: Ungkapan ini alami dalam bahasa Indonesia yang bermartabat dan tidak menentukan tujuan yang tidak disebutkan dalam teks.
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang langsung dan lazim untuk ἀποκρίνομαι dalam percakapan.
- source_word: Ὅπου ὑπάγω
  choice: Ke tempat Aku pergi
  rationale: Mempertahankan kaitan verbal dengan pertanyaan Petrus serta menghindari rumusan Indonesia yang kaku.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: sekarang engkau belum dapat mengikuti Aku
  rationale: “Dapat” mempertahankan unsur kemampuan dalam δύναμαι. “Belum” menyampaikan pertentangan waktu antara νῦν dan ὕστερον secara alami tanpa menghilangkan ketidakmampuan Petrus pada saat itu.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: tetapi kelak engkau akan mengikuti Aku
  rationale: Mempertahankan bentuk masa depan dan kontras δέ; “kelak” cocok dengan konteks perkataan yang menunjuk pada waktu mendatang yang tidak ditentukan.
theological_decisions:
- issue: Makna Petrus kelak mengikuti Yesus
  choice: Pernyataan utama dibiarkan terbuka mengenai cara Petrus kelak mengikuti Yesus.
  alternative: Menafsirkannya secara khusus sebagai kemartiran Petrus, pemulihan dan pelayanannya setelah kebangkitan, atau tindakan mengikuti Yesus menuju kematian dan kemuliaan.
  rationale: Bahasa Yunani hanya menyatakan bahwa Petrus tidak dapat mengikuti sekarang, tetapi akan mengikuti kemudian; terjemahan tidak menetapkan penafsiran yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti yang merujuk kepada Yesus dipakai sesuai kebiasaan umum penerjemahan Alkitab Indonesia. Pengulangan “mengikuti Aku” dipertahankan untuk mencerminkan pengulangan Yunani dan menjaga penekanan naratif.
