source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: id
  text: Jika Allah telah dimuliakan di dalam Dia[a], Allah juga akan memuliakan Dia di dalam diri-Nya sendiri[b], dan akan segera memuliakan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena Allah telah dimuliakan di dalam Dia.” Bahasa Yunani memakai εἰ (“jika”), meskipun dalam konteksnya kondisi ini kemungkinan dianggap benar.
    reason: alternative_reading
  - marker: b
    text: “Di dalam diri-Nya sendiri” juga dapat dipahami sebagai “bersama diri-Nya sendiri” atau “oleh diri-Nya sendiri”; ungkapan Yunaninya ringkas dan sarat makna teologis.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Jika
  rationale: Mempertahankan bentuk pengandaian yang eksplisit dalam bahasa Yunani, meskipun konteksnya kemungkinan mengandaikan keadaan itu sebagai benar.
- source_word: ἐδοξάσθη
  choice: telah dimuliakan
  rationale: Bentuk aoristus pasif dipertahankan sebagai pasif; dalam bahasa Indonesia, 'telah dimuliakan' secara alami menyatakan tindakan yang sudah terjadi tanpa menentukan waktunya secara berlebihan.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mencerminkan ἐν secara langsung dan mempertahankan ungkapan Yohanes yang padat; 'melalui Dia' lebih interpretatif.
- source_word: δοξάσει
  choice: akan memuliakan
  rationale: Mempertahankan bentuk mendatang dan kesinambungan leksikal dengan kata kerja sebelumnya.
- source_word: ἐν αὑτῷ
  choice: di dalam diri-Nya sendiri
  rationale: Menyatakan sifat refleksif frasa Yunani dan mengacu kembali kepada Allah tanpa menguraikan secara berlebihan apakah nuansanya 'bersama' atau 'oleh' diri-Nya.
- source_word: εὐθύς
  choice: segera
  rationale: Ungkapan Indonesia yang alami dan jelas untuk menyampaikan kesegeraan.
theological_decisions:
- issue: Daya pengandaian εἰ ketika konteks tampaknya menganggap kondisi tersebut benar
  choice: Jika Allah telah dimuliakan di dalam Dia
  alternative: Karena Allah telah dimuliakan di dalam Dia
  rationale: Teks utama mempertahankan partikel pengandaian Yunani dan tidak mengubahnya menjadi hubungan sebab secara diam-diam; catatan kaki menjelaskan kemungkinan nuansa yang diasumsikan benar.
- issue: Makna frasa refleksif ἐν αὑτῷ
  choice: di dalam diri-Nya sendiri
  alternative: bersama diri-Nya sendiri; oleh diri-Nya sendiri
  rationale: Pilihan utama paling dekat dengan susunan Yunani dan menjaga kepadatan teologisnya, sedangkan pilihan lain menyatakan penafsiran atas fungsi ἐν.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan khidmat. Huruf kapital pada 'Dia' dan '-Nya' membantu memperjelas bahwa pronomina pertama mengacu kepada Yesus dan pronomina refleksif mengacu kepada Allah; keputusan ini bersifat ortografis dan tidak menghilangkan catatan atas kepadatan ungkapan Yunani.
