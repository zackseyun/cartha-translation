revisions:
- from: Anak-anak-Ku, hanya sebentar lagi Aku bersama kalian. Kalian akan mencari Aku. Seperti yang telah Kukatakan kepada orang-orang Yahudi[a], ‘Ke tempat Aku pergi, kalian tidak dapat datang[b],’ demikian juga sekarang Kukatakan kepada kalian.
  to: Anak-anak-Ku, Aku masih bersama kalian hanya sebentar lagi. Kalian akan mencari Aku, dan seperti yang telah Kukatakan kepada orang-orang Yahudi[a], ‘Ke mana Aku pergi, kalian tidak dapat datang[b],’ demikian juga sekarang Kukatakan kepada kalian.
  rationale: Revisi terbatas pada kelancaran dan ketepatan idiomatis bahasa Indonesia. “Masih bersama” mengekspresikan ἔτι, sedangkan “Ke mana Aku pergi” merupakan padanan yang wajar bagi ὅπου ἐγὼ ὑπάγω. Tidak ada penafsiran tambahan mengenai identitas “orang-orang Yahudi” atau alasan para murid tidak dapat datang.
