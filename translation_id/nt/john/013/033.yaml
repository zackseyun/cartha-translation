  source_fidelity: 'Makna dasar diterjemahkan dengan setia: sapaan penuh kasih, sisa waktu yang singkat, pencarian yang akan terjadi, rujukan kepada perkataan kepada orang-orang Yahudi, dan ketidakmampuan untuk datang tetap terpelihara. Namun, “Ke tempat Aku pergi” kurang idiomatis dan kurang tepat menangkap klausa lokatif interogatif ὅπου ἐγὼ ὑπάγω; “Ke mana Aku pergi” adalah padanan Indonesia yang lebih langsung.'
  naturalness: Teks pada umumnya baku dan jelas. “Aku masih bersama kalian hanya sebentar lagi” lebih alami dan secara eksplisit menandai unsur ἔτι (‘masih/lagi’) daripada susunan semula. Penggunaan koma setelah “mencari Aku” juga lebih baik mempertahankan kesinambungan sintaksis dengan perbandingan yang mengikutinya.
  terminology: “Anak-anak-Ku” dengan tepat menyampaikan sapaan τεκνία yang akrab dan penuh kasih. “Orang-orang Yahudi” mempertahankan keluasan τοῖς Ἰουδαίοις tanpa mempersempitnya secara interpretatif; catatan kaki secara tepat mencatat kemungkinan rujukan yang lebih khusus. “Tidak dapat datang” mempertahankan ketidakmampuan dalam δύνασθε tanpa menentukannya secara doktrinal.
