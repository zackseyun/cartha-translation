id: JHN.13.33
reference: John 13:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: id
  text: Anak-anak-Ku, Aku masih bersama kalian hanya sebentar lagi. Kalian akan mencari Aku, dan seperti yang telah Kukatakan kepada orang-orang Yahudi[a], ‘Ke mana Aku pergi, kalian tidak dapat datang[b],’ demikian juga sekarang Kukatakan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam beberapa konteks di Injil Yohanes, sebutan “orang-orang Yahudi” dapat menunjuk lebih khusus kepada para pemimpin Yahudi atau kalangan berwenang di Yudea.
    reason: alternative_reading
  - marker: b
    text: Atau, “tidak bisa datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Anak-anak-Ku
  rationale: Bentuk sapaan ini menyampaikan metafora kekeluargaan dan kasih sayang yang terkandung dalam bentuk diminutif. Unsur “-Ku” membuat sapaan tersebut wajar dalam bahasa Indonesia, tanpa menyiratkan bahwa mereka anak-anak secara usia.
- source_word: ἔτι μικρόν
  choice: hanya sebentar lagi
  rationale: Ungkapan ini menunjukkan sedikit waktu yang masih tersisa dan terdengar alami dalam bahasa Indonesia.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Aku bersama kalian
  rationale: Mempertahankan pernyataan kini tentang kehadiran Yesus bersama para murid tanpa menambahkan gagasan “tinggal” yang tidak dinyatakan secara eksplisit.
- source_word: ζητήσετέ με
  choice: Kalian akan mencari Aku
  rationale: “Mencari” mencakup arti dasar ζητέω dan tetap mempertahankan bobot pemakaiannya dalam Injil Yohanes.
- source_word: τοῖς Ἰουδαίοις
  choice: kepada orang-orang Yahudi
  rationale: Ini mempertahankan bentuk umum istilah Yunani dan tidak mempersempit rujukannya menjadi para pemimpin Yahudi tanpa tuntutan langsung dari ayat ini.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ke tempat Aku pergi
  rationale: Menyampaikan tujuan gerak yang tersirat dalam ὅπου bersama ὑπάγω secara alami; konteks sudah cukup menunjukkan kepergian.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: kalian tidak dapat datang
  rationale: Mempertahankan unsur kemampuan atau kemungkinan dalam δύνασθε, tanpa menjelaskan alasan ketidakmampuan itu.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: demikian juga sekarang Kukatakan kepada kalian
  rationale: Mengungkapkan hubungan paralel dengan perkataan sebelumnya serta penekanan waktu ἄρτι secara jelas dan alami.
theological_decisions:
- issue: Cakupan rujukan τοῖς Ἰουδαίοις dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi
  rationale: Istilah Yunani secara harfiah bersifat umum. Meskipun dalam konteks tertentu di Yohanes istilah ini dapat menunjuk lebih khusus kepada kalangan berwenang di Yudea, ayat ini sendiri tidak mengharuskan pembatasan tersebut; karena itu kemungkinan kontekstual dicatat tanpa dimasukkan ke teks utama.
- issue: Sifat ketidakmampuan para murid untuk datang
  choice: tidak dapat datang
  alternative: tidak bisa datang
  rationale: Terjemahan utama mempertahankan bentuk yang menyatakan ketidakmampuan, tetapi tidak menentukan apakah hambatannya bersifat sementara, rohani, atau mutlak; penjelasan itu dibiarkan kepada konteks Yohanes yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua jamak “kalian,” sesuai konteks para murid. Diksi dibuat akrab tetapi tetap khidmat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
