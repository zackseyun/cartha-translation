  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: id
  text: Salah seorang murid-Nya, yang dikasihi Yesus, sedang bersandar di sisi Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dada Yesus,” ungkapan yang menggambarkan posisi seseorang yang bersandar tepat di sebelah orang lain pada waktu makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: sedang bersandar
  rationale: Partisip ini menggambarkan posisi orang yang berbaring sambil bertumpu ketika makan menurut kebiasaan dunia Mediterania kuno. “Sedang bersandar” menjaga gambaran postur itu tanpa memberi kesan bahwa murid tersebut sedang berbaring di tempat tidur.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Seorang dari antara murid-murid-Nya
  rationale: Ungkapan partitif Yunani diterjemahkan secara jelas dan wajar, dengan tetap menunjukkan bahwa orang itu termasuk kelompok murid Yesus.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: dekat di sisi Yesus
  rationale: Dalam konteks perjamuan, frasa ini menunjuk pada posisi seorang yang bersandar tepat di sebelah orang lain. Terjemahan ini menyampaikan letak fisiknya secara alami bagi pembaca modern; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: yaitu murid yang dikasihi Yesus
  rationale: Klausa relatif diterjemahkan secara alami tanpa mengidentifikasi murid tersebut lebih jauh daripada yang dinyatakan teks. “Dikasihi” mempertahankan makna ἀγαπάω dan register naratif yang bermartabat.
theological_decisions:
- issue: Posisi murid yang dikasihi relatif terhadap Yesus
  choice: Mengungkapkan idiom posisi makan sebagai “dekat di sisi Yesus” dalam teks utama.
  alternative: “di dada Yesus” atau “di pangkuan Yesus”
  rationale: Dalam konteks ini, frasa tersebut terutama menggambarkan tata letak orang-orang yang bersandar saat perjamuan, bukan secara eksplisit menyatakan persatuan mistis. Terjemahan utama menghindari gambaran yang mudah disalahpahami, sedangkan bentuk harfiah dicatat agar gaung ungkapan Yohanes tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Murid-murid-Nya” mengikuti konvensi penghormatan kepada Yesus, sedangkan susunan kalimat dibuat alami dan mudah dipahami tanpa menghapus latar perjamuan kuno.
