  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Orang yang sudah mandi[a] tidak perlu membasuh apa-apa lagi selain kakinya; ia bersih seluruhnya. Kalian pun bersih, tetapi tidak semua dari kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai dua kata kerja yang berbeda: λούω (“mandi,” biasanya untuk membasuh seluruh tubuh) dan νίπτω (“membasuh,” sering kali untuk bagian tubuh seperti kaki).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Bentuk kini historis λέγει dialihkan dengan bentuk lampau naratif yang wajar dalam bahasa Indonesia, sedangkan αὐτῷ tetap dinyatakan sebagai “kepadanya”.
- source_word: Ὁ λελουμένος
  choice: Orang yang sudah mandi
  rationale: Perfek partisip λελουμένος menyatakan tindakan mandi yang telah selesai beserta keadaan hasilnya. “Orang yang” mempertahankan fungsi generiknya tanpa menambahkan gender.
- source_word: οὐκ ἔχει χρείαν
  choice: tidak perlu
  rationale: Ungkapan ini paling alami dan langsung dalam bahasa Indonesia sebagai “tidak perlu”.
- source_word: εἰ μὴ τοὺς πόδας νίψασθαι
  choice: membasuh apa pun selain kakinya
  rationale: εἰ μή menyatakan satu-satunya pengecualian. “Membasuh” membedakan νίπτω dari λούω “mandi,” dan “kakinya” memperjelas hubungan dengan subjek tunggal.
- source_word: ἀλλ’ ἔστιν καθαρὸς ὅλος
  choice: ia bersih seluruhnya
  rationale: “Bersih” mempertahankan citra jasmani sekaligus kemungkinan makna simbolis, sedangkan “seluruhnya” menyampaikan penekanan ὅλος tanpa menambahkan kata “tubuh” yang tidak eksplisit dalam Yunani.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Kalian pun bersih
  rationale: “Kalian” menyatakan sapaan jamak secara jelas. “Pun” menghubungkan keadaan para murid dengan pernyataan umum sebelumnya.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: tetapi tidak semua dari kalian
  rationale: Ungkapan ini memperjelas bahwa pengecualian terdapat di dalam kelompok yang disapa tanpa menentukan siapa orangnya.
theological_decisions:
- issue: Hubungan antara pembasuhan jasmani dan kebersihan simbolis atau rohani
  choice: Mempertahankan “mandi,” “membasuh,” dan “bersih” tanpa menjelaskan simbolismenya dalam teks utama.
  alternative: Menambahkan keterangan seperti “bersih secara rohani” atau memakai satu kata yang sama untuk kedua verba pembasuhan.
  rationale: Perkataan ini bekerja pada tingkat harfiah dan simbolis. Terjemahan mempertahankan citra serta ketegangan teologisnya tanpa memasukkan penafsiran doktrinal tertentu.
- issue: Partisip tunggal maskulin yang berfungsi generik
  choice: Orang yang sudah mandi
  alternative: Laki-laki yang sudah mandi; Ia yang sudah mandi
  rationale: Bentuk Yunani secara gramatikal maskulin tunggal, tetapi dalam pepatah ini berfungsi generik. “Orang yang” mempertahankan ketunggalan dan cakupan generiknya.
- issue: Pengecualian dalam kelompok murid
  choice: tetapi tidak semua dari kalian
  alternative: tetapi tidak semuanya
  rationale: Pilihan ini menunjukkan bahwa perkataan tersebut menyangkut orang-orang dalam kelompok tanpa mengidentifikasi pengecualian atau menerangkan alasan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lisan yang bermartabat. “Kalian” dipakai untuk sapaan jamak yang jelas; “membasuh” dipilih agar perbedaan leksikal dengan “mandi” tetap terdengar. Tanda titik koma membantu mempertahankan hubungan antarklausa tanpa membuat kalimat terasa kaku.
