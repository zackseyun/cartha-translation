  source_fidelity: Teks Indonesia dengan setia menyampaikan urutan tindakan εἶτα, tindakan menuangkan air ke dalam νιπτήρ, aspek permulaan dalam ἤρξατο, pembasuhan kaki para murid, serta pengelapan dengan λέντιον yang dikenakan melingkari pinggang Yesus. "Menyekanya" secara wajar mengambil "kaki" sebagai acuannya dan sesuai dengan ἐκμάσσειν.
