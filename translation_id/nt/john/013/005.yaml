id: JHN.13.5
reference: John 13:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: id
  text: Kemudian Ia menuangkan air ke dalam baskom, lalu mulai membasuh kaki murid-murid-Nya dan menyekanya dengan kain yang terikat pada pinggang-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα
  choice: Kemudian
  rationale: Menandai urutan tindakan dalam narasi secara alami dan tetap formal.
- source_word: βάλλει ὕδωρ εἰς τὸν νιπτῆρα
  choice: Ia menuangkan air ke dalam baskom
  rationale: Walaupun βάλλω secara luas berarti menaruh atau melemparkan, dalam konteks air dan wadah, 'menuangkan' merupakan padanan idiomatis yang tepat; νιπτήρ ialah wadah untuk membasuh.
- source_word: ἤρξατο νίπτειν
  choice: mulai membasuh
  rationale: Mempertahankan aspek inkoatif ἤρξατο dan memakai 'membasuh' yang wajar bagi tindakan mencuci kaki dalam ragam Alkitab Indonesia.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: kaki murid-murid-Nya
  rationale: Susunan posesif ini alami dalam bahasa Indonesia; akhiran '-Nya' memperjelas bahwa mereka adalah murid Yesus dari konteks, tanpa mengubah relasi genitif.
- source_word: ἐκμάσσειν
  choice: menyekanya
  rationale: Kata ini menyatakan tindakan mengelap hingga kering; pronomina '-nya' secara alami merujuk pada kaki.
- source_word: τῷ λεντίῳ
  choice: dengan kain
  rationale: λέντιον menunjuk kain atau handuk untuk mengelap. 'Kain' menghindari gambaran handuk modern yang terlalu spesifik dan sesuai dengan konteks kuno.
- source_word: ᾧ ἦν διεζωσμένος
  choice: yang terikat pada pinggang-Nya
  rationale: Mengungkapkan idiom Yunani tentang kain yang dikenakan dengan mengikatkannya mengelilingi pinggang, dalam bahasa Indonesia yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pergeseran kala dalam Yunani (present historis βάλλει lalu aoristus ἤρξατο) disampaikan sebagai rangkaian naratif alami dengan 'kemudian ... lalu'. Tidak diperlukan catatan kaki karena pilihan leksikal dapat diungkapkan secara memadai dalam teks utama.
