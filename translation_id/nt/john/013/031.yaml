id: JHN.13.31
reference: John 13:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: id
  text: Setelah ia keluar, Yesus berkata, “Sekarang Anak Manusia telah dimuliakan, dan Allah telah dimuliakan di dalam Dia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui Dia.” Frasa Yunani ini dapat dipahami sebagai Allah dimuliakan di dalam Anak Manusia atau melalui Dia.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Setelah
  rationale: Ὅτε membentuk anak kalimat waktu, sedangkan οὖν melanjutkan alur narasi. Dalam bahasa Indonesia, “Setelah” secara alami menyatakan urutan dan kesinambungan peristiwa tanpa ungkapan yang kaku.
- source_word: ἐξῆλθεν
  choice: ia keluar
  rationale: Bentuk aoris ἐξέρχομαι merujuk pada keluarnya Yudas dalam konteks sebelumnya. “Keluar” mempertahankan nuansa gerak dari suatu tempat; urutan waktunya sudah jelas melalui “setelah”.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bahasa Yunani memakai bentuk kini historis, bentuk lampau naratif tersampaikan secara alami dalam bahasa Indonesia melalui konteks dan kata “berkata”.
- source_word: Νῦν
  choice: Sekarang
  rationale: Mempertahankan daya temporal dan wacana νῦν, yang menandai saat yang diumumkan Yesus setelah Yudas keluar.
- source_word: ἐδοξάσθη
  choice: telah dimuliakan
  rationale: Bentuk aoris pasif menyatakan pemuliaan sebagai kenyataan yang kini dinyatakan atau mulai terlaksana. “Telah dimuliakan” menjaga bentuk pasif dan bobot pernyataannya tanpa membatasi pemuliaan itu pada satu peristiwa tertentu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan khas Yesus dan kaitan antarteksnya, termasuk dengan Daniel 7, dalam bentuk yang sudah dikenal luas dalam bahasa Indonesia.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan langsung bagi θεός dalam konteks ini.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Padanan ini mempertahankan bentuk relasional atau lokatif yang paling langsung dari ἐν dengan datif. Kemungkinan makna instrumental, “melalui Dia,” dicatat dalam catatan kaki agar ambiguitas sumber tidak dihilangkan.
theological_decisions:
- issue: Cakupan pemuliaan Anak Manusia
  choice: Pernyataan diterjemahkan sebagai pemuliaan yang telah dinyatakan atau mulai terlaksana, tanpa menetapkan apakah yang dimaksud hanya salib, kebangkitan, peninggian, atau keseluruhan rangkaian itu.
  alternative: Membatasi pemuliaan hanya pada penyaliban atau hanya pada kebangkitan dan peninggian.
  rationale: Teks ayat ini sendiri tidak mempersempit rujukannya. Terjemahan mempertahankan keluasan dan ketegangan teologis dalam Injil Yohanes.
- issue: Makna ἐν αὐτῷ
  choice: di dalam Dia
  alternative: melalui Dia
  rationale: Frasa Yunani dapat dipahami secara relasional maupun instrumental. Teks utama mempertahankan padanan yang lebih langsung, sedangkan kemungkinan instrumental disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan susunan yang mudah dipahami pembaca umum. Sebutan “Anak Manusia” dipertahankan sebagai gelar yang mapan. Penanda catatan kaki ditempatkan pada frasa yang benar-benar diterangkannya, yaitu “di dalam Dia”.
