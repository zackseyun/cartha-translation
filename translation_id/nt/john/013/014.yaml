id: JHN.13.14
reference: John 13:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: id
  text: Jadi, jika Aku, Tuhan[a] dan Guru, telah membasuh kaki kalian, kamu pun wajib membasuh kaki satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.”
    reason: κύριος dapat berarti 'Tuhan' atau 'Tuan'; teks utama memakai gelar 'Tuhan' sesuai konteks, sementara kemungkinan leksikal lainnya tetap dicatat.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Jadi, jika
  rationale: Mempertahankan unsur syarat dari εἰ dan daya simpulan dari οὖν dalam susunan bahasa Indonesia yang alami.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit dipertahankan karena bersifat menegaskan dan menjadi dasar perbandingan dengan kewajiban para murid.
- source_word: ἔνιψα
  choice: telah membasuh
  rationale: Bentuk aoris menunjuk pada tindakan yang sudah selesai dilakukan; 'telah membasuh' menyatakan tindakan lampau yang masih relevan dengan argumen saat itu.
- source_word: ὑμῶν τοὺς πόδας
  choice: kakimu
  rationale: Bentuk posesif ini alami dalam bahasa Indonesia dan mempertahankan orang kedua jamak yang ditentukan oleh konteks.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: κύριος dipertahankan sebagai gelar bagi Yesus; catatan kaki memberi alternatif kontekstual 'Tuan' tanpa meniadakan nuansa kristologisnya.
- source_word: ὁ διδάσκαλος
  choice: Guru
  rationale: Menerjemahkan gelar secara langsung dan mempertahankan kesejajarannya dengan 'Tuhan'.
- source_word: καὶ ὑμεῖς
  choice: kamu pun
  rationale: '''Pun'' menyampaikan hubungan timbal balik dan penekanan pada para murid: mereka juga harus bertindak sebagaimana Yesus telah bertindak.'
- source_word: ὀφείλετε
  choice: wajib
  rationale: Menyatakan kewajiban moral yang terkandung dalam ὀφείλετε tanpa mengubah bentuknya menjadi sekadar saran.
- source_word: ἀλλήλων
  choice: satu sama lain
  rationale: Ungkapan timbal balik yang baku dan jelas dalam bahasa Indonesia.
- source_word: νίπτειν τοὺς πόδας
  choice: membasuh kaki
  rationale: Mempertahankan tindakan konkret membasuh bagian tubuh, bukan memperluasnya menjadi parafrasa umum tentang pelayanan.
theological_decisions:
- issue: κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks ini κύριος adalah gelar yang dipakai bagi Yesus dan menonjolkan kontras antara kedudukan-Nya dan tindakan-Nya yang merendahkan diri. Namun, arti 'Tuan' tetap mungkin secara leksikal dan dicatat.
- issue: Sifat kewajiban membasuh kaki
  choice: Mempertahankan tindakan konkret 'membasuh kaki satu sama lain'
  alternative: Melayani satu sama lain dengan rendah hati
  rationale: Teks Yunani secara eksplisit menyebut pembasuhan kaki. Makna teladannya tidak boleh menggantikan tindakan konkret itu di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Jadi, jika' menjaga alur penalaran; 'kamu pun wajib' menyampaikan penekanan dan kewajiban moral. Huruf kapital pada Aku, Tuhan, dan Guru mengikuti pemakaian sebagai rujukan serta gelar bagi Yesus.
