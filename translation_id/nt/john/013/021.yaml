  naturalness: Teksnya umumnya baku dan mudah dipahami. “Salah seorang di antara kalian” lebih idiomatis daripada “salah seorang dari antara kalian.”
  terminology: “Roh-Nya,” “memberi kesaksian,” dan pengulangan “Sesungguhnya, sesungguhnya” mempertahankan diksi penting Yohanes dengan baik. “Mengkhianati” sesuai konteks, sementara alternatif harfiah perlu tetap memuat bentuk futurum agar sejajar dengan teks.
