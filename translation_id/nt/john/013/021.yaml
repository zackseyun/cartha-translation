  to: 'Setelah mengatakan hal-hal itu, Yesus terguncang dalam roh-Nya. Ia memberi kesaksian dan berkata, “Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: salah seorang di antara kalian akan mengkhianati Aku[a].”'
