  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: id
  text: 'Setelah mengatakan hal-hal itu, Yesus terguncang dalam roh-Nya. Ia memberi kesaksian dan berkata, “Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: salah seorang di antara kalian akan mengkhianati Aku[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “akan menyerahkan Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Sesudah mengatakan hal-hal itu
  rationale: Partisip aoristus diterjemahkan sebagai klausa waktu yang alami dalam bahasa Indonesia dan tetap menunjukkan urutan peristiwa.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: menjadi gelisah dalam roh-Nya
  rationale: Ungkapan ini mempertahankan gambaran pergolakan batin Yesus serta kata 'roh', tanpa menambahkan tingkat intensitas yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἐμαρτύρησεν
  choice: memberi kesaksian
  rationale: Pilihan ini mempertahankan kosakata kesaksian yang khas dalam Injil Yohanes dan menyampaikan sifat pernyataan yang sungguh-sungguh.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Pengulangan dipertahankan untuk menyampaikan rumusan penegasan khas Yesus dalam Injil Yohanes.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Terjemahan ini mempertahankan kelangsungan ujaran dan memakai 'kalian' untuk memperjelas bahwa pronomina Yunani tersebut berbentuk jamak.
- source_word: εἷς ἐξ ὑμῶν
  choice: salah seorang dari antara kalian
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan makna partitif serta kedekatan mengejutkan antara pengkhianat dan kelompok murid.
- source_word: παραδώσει με
  choice: akan mengkhianati Aku
  rationale: Dalam konteks tindakan Yudas, 'mengkhianati' menyampaikan daya pragmatis ungkapan tersebut dengan jelas. Arti yang lebih harfiah, 'menyerahkan Aku', dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penggambaran kegelisahan batin Yesus
  choice: menjadi gelisah dalam roh-Nya
  alternative: hati-Nya gelisah; sangat terguncang dalam roh-Nya
  rationale: Pilihan ini membiarkan realitas pergolakan batin Yesus tampil sebagaimana teks menyatakannya, tanpa mengganti 'roh' dengan 'hati' atau menambahkan intensitas.
- issue: Makna παραδίδωμι dalam nubuat pengkhianatan
  choice: akan mengkhianati Aku
  alternative: akan menyerahkan Aku
  rationale: Konteks langsung menunjukkan tindakan pengkhianatan oleh salah seorang murid. Namun, arti harfiah yang lebih luas tetap dicatat karena penting dalam kisah sengsara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak secara jelas; pengulangan 'sesungguhnya' dan istilah 'memberi kesaksian' dipertahankan demi corak khas Yohanes.
