  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: id
  text: Kalian menyebut Aku Guru dan Tuhan[a], dan kalian benar, sebab memang demikianlah Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuan.” Kata Yunani kyrios dapat menyatakan wewenang atau kedudukan sebagai tuan; di sini “Tuhan” dipertahankan sebagai terjemahan utama gelar tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: menyebut
  rationale: Dalam konstruksi ini, kata tersebut berarti menyebut seseorang dengan gelar tertentu; 'menyebut Aku' alami dalam bahasa Indonesia dan mempertahankan kelangsungan pernyataan.
- source_word: Ὁ διδάσκαλος
  choice: Guru
  rationale: '''Guru'' adalah padanan modern yang jelas bagi διδάσκαλος sebagai gelar Yesus. Artikel Yunani menandai gelar itu, tetapi tidak perlu diterjemahkan tersendiri dalam konstruksi Indonesia ini.'
- source_word: Ὁ κύριος
  choice: Tuhan
  rationale: '''Tuhan'' mempertahankan bobot κύριος sebagai gelar bagi Yesus dalam pemakaian Perjanjian Baru, sementara kemungkinan nuansa ''Tuan'' dicatat dalam catatan kaki.'
- source_word: καλῶς λέγετε
  choice: perkataan kalian itu tepat
  rationale: Ungkapan ini menyatakan bahwa sebutan para murid benar. Terjemahan ini alami dalam bahasa Indonesia sekaligus tetap merepresentasikan unsur λέγετε ('kalian mengatakan').
- source_word: εἰμὶ γάρ
  choice: sebab memang Akulah Guru dan Tuhan
  rationale: Kopula Yunani secara ringkas menegaskan bahwa Yesus memang demikian. Bahasa Indonesia memerlukan pelengkap yang dipahami dari konteks; mengulang kedua gelar memperjelas acuannya tanpa mengubah isi.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam ayat ini Yesus membenarkan κύριος sebagai gelar bagi diri-Nya. 'Tuhan' mempertahankan bobot kristologis dan pemakaian gelar Perjanjian Baru, sedangkan 'Tuan' tetap merupakan kemungkinan leksikal menurut konteks otoritas.
- issue: Pelengkap tersirat pada εἰμί
  choice: Mengulang 'Guru dan Tuhan'
  alternative: sebab memang demikianlah Aku
  rationale: Bahasa Yunani membiarkan pelengkap dipahami dari dua gelar sebelumnya. Pengulangan dalam bahasa Indonesia menyatakan rujukan tersirat itu dengan alami, tanpa membatasi atau menambah klaim di luar kedua gelar tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμεῖς secara jelas; huruf kapital pada Aku, Guru, dan Tuhan mengikuti kelaziman penerbitan Alkitab Indonesia untuk rujukan dan gelar Yesus.
