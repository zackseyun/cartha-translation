source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: id
  text: Yesus menjawab, “Dialah orangnya yang akan Kuberikan potongan roti itu setelah Aku mencelupkannya.” Lalu setelah mencelupkan potongan roti itu, Ia memberikannya kepada Yudas, anak Simon Iskariot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yudas Iskariot, anak Simon.” Susunan kata Yunani dapat dipahami dengan kedua cara tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: menjawab
  rationale: Bentuk kini historis Yunani dipertahankan dengan bentuk naratif Indonesia yang alami dan hidup.
- source_word: Ἐκεῖνός ἐστιν
  choice: Dialah orangnya
  rationale: Ungkapan ini mengidentifikasi seseorang secara tegas; bentuk Indonesia tersebut alami dalam jawaban atas pertanyaan mengenai identitas.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: yang akan Kuberi potongan roti setelah Aku mencelupkannya
  rationale: Susunan klausa disesuaikan agar hubungan antara mencelupkan roti dan memberikannya kepada orang itu jelas serta alami dalam bahasa Indonesia, sambil mempertahankan makna futurum.
- source_word: ψωμίον
  choice: potongan roti
  rationale: Menunjukkan sepotong kecil roti atau makanan; pilihan ini jelas dan umum bagi pembaca modern.
- source_word: βάψας οὖν
  choice: Lalu, setelah mencelupkan
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama, sedangkan οὖν menandai kelanjutan narasi.
- source_word: δίδωσιν
  choice: Ia memberikannya
  rationale: Bentuk kini historis diterjemahkan secara hidup; pronomina -nya secara alami merujuk kepada potongan roti.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: kepada Yudas, anak Simon Iskariot
  rationale: Mengikuti hubungan genitif yang paling langsung, yakni bahwa Simon disebut Iskariot, sambil mempertahankan kemungkinan sintaksis lain dalam catatan kaki.
theological_decisions:
- issue: Identifikasi Yudas dalam frasa penutup
  choice: Yudas, anak Simon Iskariot
  alternative: Yudas Iskariot, anak Simon
  rationale: Urutan dan konstruksi genitif Yunani paling langsung dapat dibaca sebagai 'Yudas, anak Simon Iskariot', tetapi bentuknya memungkinkan 'Iskariot' dipahami sebagai sebutan bagi Yudas; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti konvensi religius Indonesia tanpa menambah informasi pada teks sumber.
