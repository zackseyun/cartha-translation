  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: id
  text: Murid-murid itu saling memandang, bingung tentang siapa yang sedang Dia bicarakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Murid-murid itu terus saling memandang, bingung tentang siapa yang sedang Dia bicarakan.”
    reason: Alternatif ini menonjolkan aspek berkelanjutan dari bentuk imperfek ἔβλεπον, sambil mempertahankan nuansa kebingungan dalam ἀπορούμενοι.
lexical_decisions:
- source_word: ἔβλεπον
  choice: saling memandang
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam adegan itu; bersama εἰς ἀλλήλους, ungkapan ini wajar dan ringkas dalam bahasa Indonesia.
- source_word: εἰς ἀλλήλους
  choice: saling
  rationale: Menandai tindakan timbal balik di antara para murid.
- source_word: οἱ μαθηταὶ
  choice: murid-murid itu
  rationale: Artikel Yunani menunjuk kepada kelompok murid yang sudah dikenal dalam konteks; kata 'itu' menyampaikan kekhususan ini tanpa menambahkan kepemilikan yang tidak tersurat.
- source_word: ἀπορούμενοι
  choice: karena bingung
  rationale: Partisip ini menyatakan kebingungan atau ketidakpastian yang menyertai tindakan memandang; hubungan keadaan/sebab disampaikan secara alami dengan 'karena bingung'.
- source_word: περὶ τίνος
  choice: siapa yang
  rationale: Menanyakan orang yang menjadi pokok pembicaraan; susunan klausa tak langsung ini paling alami dalam bahasa Indonesia.
- source_word: λέγει
  choice: sedang Dia bicarakan
  rationale: Bentuk kini dalam wacana naratif menunjuk pada pembicaraan Yesus yang sedang berlangsung; 'bicarakan' mempertahankan gagasan berbicara tentang seseorang tanpa menafsirkannya sebagai sekadar 'maksud'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Huruf kapital pada 'Dia' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus; kapitalisasi tidak berasal dari naskah Yunani.
