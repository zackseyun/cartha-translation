id: JHN.13.3
reference: John 13:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: id
  text: Yesus tahu bahwa Bapa telah menyerahkan segala sesuatu ke dalam tangan-Nya, dan bahwa Dia telah datang dari Allah[a] dan sedang pergi kepada Allah[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah keluar dari Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sedang kembali kepada Allah”; teks Yunani secara harfiah hanya menyatakan “sedang pergi kepada Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: tahu
  rationale: Partisipel ini menyatakan keadaan yang melatarbelakangi tindakan pada ayat berikutnya. Bentuk “tahu bahwa” alami dalam bahasa Indonesia dan tidak memaksakan nilai kausal yang hanya tersirat.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Mewakili bentuk jamak netral dengan cakupan menyeluruh secara jelas dan wajar.
- source_word: ἔδωκεν
  choice: telah menyerahkan
  rationale: “Menyerahkan” sesuai dengan ungkapan berikutnya, “ke dalam tangan-Nya,” dan menyampaikan tindakan tuntas yang mendahului adegan ini.
- source_word: εἰς τὰς χεῖρας
  choice: ke dalam tangan-Nya
  rationale: Metafora konkret tentang kuasa atau kendali dipertahankan karena dapat dipahami dalam bahasa Indonesia dan tidak perlu diratakan menjadi ungkapan abstrak.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Mempertahankan gelar dengan kata sandang dalam teks Yunani tanpa menambahkan kata milik “Bapa-Nya.”
- source_word: ἀπὸ θεοῦ
  choice: dari Allah
  rationale: Mengikuti penyebutan “Allah” dalam teks, bukan menggantinya dengan “Bapa,” serta mempertahankan pernyataan tentang asal dan misi Yesus.
- source_word: ἐξῆλθεν
  choice: telah datang
  rationale: Dalam konteks Yohanes, verba ini dapat menunjuk pada asal atau pengutusan. “Telah datang” merupakan padanan Indonesia yang alami sambil mempertahankan hubungan dengan frasa “dari Allah.”
- source_word: πρὸς τὸν θεὸν
  choice: kepada Allah
  rationale: Menyatakan arah dan tujuan secara langsung tanpa menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit dalam klausa ini.
- source_word: ὑπάγει
  choice: sedang pergi
  rationale: Mencerminkan bentuk kini dan keberangkatan yang sedang menjelang dalam konteks narasi.
theological_decisions:
- issue: Bahasa asal Kristologis dalam ἀπὸ θεοῦ ἐξῆλθεν
  choice: telah datang dari Allah
  alternative: telah keluar dari Allah
  rationale: Pilihan utama alami dalam bahasa Indonesia dan tetap menyatakan asal atau pengutusan ilahi Yesus, tanpa memasukkan rumusan doktrinal yang tidak diucapkan ayat ini. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- issue: Bahasa tujuan dalam πρὸς τὸν θεὸν ὑπάγει
  choice: sedang pergi kepada Allah
  alternative: sedang kembali kepada Allah
  rationale: Konteks dapat menyiratkan kepulangan, tetapi teks klausa ini hanya menyatakan gerak menuju Allah. Karena itu, “kembali” tidak dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat sengaja dibiarkan berakhir dengan koma karena partisipel Yunani ini melatarbelakangi tindakan yang berlanjut pada ayat berikutnya. Huruf kapital pada pronomina yang merujuk kepada Yesus dipakai demi kejelasan rujukan dalam gaya penerbitan Indonesia.
