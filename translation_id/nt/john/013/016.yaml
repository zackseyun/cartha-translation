base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: seorang budak[a] tidak lebih besar daripada tuannya[b], dan seorang utusan[c] tidak lebih besar daripada orang yang mengutusnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba”; kata Yunani ini menunjuk kepada orang yang berada di bawah wewenang seorang tuan. “Budak” dipakai di sini untuk mempertahankan hubungan sosial yang lebih kuat itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “Tuhan”; di sini kata tersebut diterjemahkan menurut arti sosialnya agar sesuai dengan perbandingan budak–tuan.
    reason: lexical_alternative
  - marker: c
    text: Atau “rasul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Pengulangan dipertahankan karena merupakan rumusan penegasan khas dalam Injil Yohanes. “Sesungguhnya” menyampaikan daya penegasannya dalam bahasa Indonesia modern tanpa membiarkan kata Ibrani-Yunani itu tanpa terjemahan.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan langsung dan alami yang mempertahankan bentuk ujaran kini serta gaya khas Yohanes; bentuk “kepadamu” dapat menyapa kelompok maupun orang perorangan menurut pemakaian bahasa Indonesia.
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam pasangan dengan κύριος, kata ini menyatakan seseorang yang berada di bawah wewenang tuan. “Hamba” menjaga hubungan hierarkis itu dalam ragam yang bermartabat dan mudah dipahami; alternatif “budak” mencerminkan status sosial yang lebih keras dan dicatat dalam catatan kaki.
- source_word: μείζων
  choice: lebih besar
  rationale: Bentuk komparatif ini menyatakan keunggulan dalam kedudukan atau wewenang. “Lebih besar” cukup luas untuk berlaku secara sejajar pada kedua klausa.
- source_word: κύριος
  choice: tuan
  rationale: Konteksnya adalah perbandingan sosial hamba–tuan, sehingga “tuan” lebih tepat daripada gelar “Tuhan” dan mempertahankan kesejajaran yang dimaksud.
- source_word: ἀπόστολος
  choice: utusan
  rationale: Dalam klausa ini makna orang yang diutus ditegaskan langsung oleh frasa “orang yang mengutusnya.” “Utusan” menyampaikan fungsi tersebut secara alami; bentuk istilah “rasul” tetap dicatat sebagai alternatif.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: orang yang mengutusnya
  rationale: Konstruksi partisipel berartikel diterjemahkan secara alami sebagai pelaku pengutusan dan mempertahankan kesejajaran dengan “tuannya” pada klausa pertama.
theological_decisions:
- issue: Makna κύριος dalam perbandingan yang tidak secara langsung bersifat gelar
  choice: tuan
  alternative: Tuhan
  rationale: Ayat ini memakai analogi sosial hamba–tuan sejajar dengan utusan–pengutus. “Tuan” mempertahankan analogi tersebut tanpa secara tidak perlu menjadikan κύριος gelar kristologis, walaupun kata Yunani yang sama juga dapat berarti “Tuhan” dalam konteks lain.
- issue: Makna ἀπόστολος sebagai fungsi atau istilah jabatan
  choice: utusan
  alternative: rasul
  rationale: Hubungan etimologis dan semantis dengan “orang yang mengutusnya” menonjol dalam kalimat ini. Memilih “utusan” tidak menyangkal pemakaian “rasul” sebagai istilah di tempat lain; alternatif itu dicatat agar keluasan istilah sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Pengulangan pembuka dipertahankan untuk mencerminkan penegasan khas Yohanes. “Hamba–tuan” menjaga gambaran sosial secara alami, sedangkan “utusan–orang yang mengutusnya” mempertahankan permainan hubungan leksikal pada klausa kedua. Huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika Yesus berbicara.
