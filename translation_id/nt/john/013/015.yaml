id: JHN.13.15
reference: John 13:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: id
  text: Sebab Aku telah memberikan teladan[a] kepadamu, supaya kamu juga melakukan seperti yang telah Kulakukan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “contoh” atau “pola.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: teladan
  rationale: Kata ini menunjuk pada contoh atau pola yang diberikan untuk ditiru. “Teladan” alami dalam bahasa Indonesia dan tepat dalam konteks tindakan Yesus.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menjelaskan dasar bagi pengajaran sebelumnya; “sebab” mempertahankan hubungan penjelas itu.
- source_word: ἔδωκα
  choice: telah memberikan
  rationale: Aoristus Yunani menunjuk pada tindakan yang baru dilakukan; bentuk “telah” menyampaikan tindakan lampau yang tetap relevan bagi para murid.
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα menyatakan tujuan, yang secara alami disampaikan dengan “supaya”.
- source_word: καθὼς
  choice: seperti
  rationale: καθώς menyatakan kesesuaian antara tindakan Yesus dan tindakan yang diharapkan dari para murid.
- source_word: ἐποίησα ὑμῖν
  choice: yang telah Kulakukan kepadamu
  rationale: Terjemahan ini mempertahankan verba umum ποιέω dan datif ὑμῖν secara dekat tanpa memaksakan makna benefaktif, sementara konteks pembasuhan kaki menjelaskan tindakan yang dimaksud.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: Ungkapan ini memasukkan para murid sebagai pihak yang harus bertindak dengan cara yang sesuai.
- source_word: ποιῆτε
  choice: melakukan
  rationale: Subjungtif sesudah ἵνα menyatakan tindakan yang menjadi tujuan dan harapan; konstruksi Indonesia “supaya ... melakukan” menyampaikan daya tersebut secara alami.
theological_decisions:
- issue: Cakupan peneladanan tindakan Yesus
  choice: Menyatakan bahwa tindakan Yesus merupakan teladan yang harus diikuti para murid tanpa menentukan apakah ayat ini menetapkan upacara pembasuhan kaki yang universal.
  alternative: Menafsirkannya secara eksplisit sebagai ketetapan pembasuhan kaki bagi semua orang percaya, atau hanya sebagai lambang tanpa tuntutan tindakan nyata.
  rationale: Ayat ini menegaskan fungsi tindakan Yesus sebagai teladan untuk ditiru, tetapi tidak dengan sendirinya merinci bentuk penerapannya dalam setiap konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi klitik “Ku-” mengikuti rujukan kepada Yesus. Susunan kalimat dijaga alami sekaligus dekat dengan urutan dan hubungan logis teks Yunani.
