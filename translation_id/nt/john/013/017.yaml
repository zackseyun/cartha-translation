  text: If you know these things[a], you are blessed if you do them.
translation:
  language: id
  text: Jika kamu mengetahui hal-hal ini, kamu berbahagia[a] jika kamu melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diberkati” atau “beruntung”; kata Yunani yang diterjemahkan “berbahagia” menunjuk pada keadaan yang diperkenan atau sejahtera, bukan sekadar perasaan senang.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Jika
  rationale: Memperkenalkan anak kalimat bersyarat dan mempertahankan bentuk kondisi dalam bahasa Yunani.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mencerminkan bentuk jamak netral yang merujuk pada teladan dan ajaran Yesus sebelumnya.
- source_word: οἴδατε
  choice: kamu mengetahui
  rationale: Menerjemahkan makna dasar pengetahuan atau kesadaran tanpa mempersempitnya menjadi sekadar pemahaman.
- source_word: μακάριοί
  choice: diberkati
  rationale: Mengungkapkan keadaan yang mendapat perkenanan dan mengalami kebaikan, bukan hanya perasaan senang.
- source_word: ἐὰν
  choice: jika
  rationale: Menandai kondisi yang pelaksanaannya belum tentu terjadi.
- source_word: ποιῆτε αὐτά
  choice: kamu melakukannya
  rationale: Menyampaikan tindakan nyata atas hal-hal yang telah diketahui, dengan rujukan pronominal yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna μακάριοι dalam konteks kemuridan
  choice: diberkati
  alternative: berbahagia; beruntung
  rationale: Pilihan ini mempertahankan bobot alkitabiah tentang keadaan yang diperkenan dan mengalami kebaikan, tanpa mereduksinya menjadi emosi subjektif atau keberuntungan kebetulan.
translation_notes:
  register: Bahasa Indonesia baku, modern, sederhana, dan bermartabat. Kata ganti “kamu” dipakai sebagai sapaan jamak yang sesuai dengan para murid dalam konteks ini; bentuk jamaknya tidak tampak secara morfologis dalam bahasa Indonesia.
