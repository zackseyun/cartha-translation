  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: id
  text: Dan ketika perjamuan sedang berlangsung[a], Iblis sudah menaruh dalam hati Yudas, anak Simon Iskariot, niat untuk mengkhianati Yesus[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sementara perjamuan sedang berlangsung.” Bahasa Yunani tidak berarti bahwa perjamuan itu sudah selesai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Iblis sudah menaruh ke dalam hati Yudas ... agar ia menyerahkan Dia.” Ungkapan ini menggambarkan penanaman niat atau dorongan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “menyerahkan Yesus.” Dalam konteks ini, tindakan menyerahkan itu merupakan pengkhianatan.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: ketika perjamuan sedang berlangsung
  rationale: Genitivus absolutus menyatakan keadaan yang berlangsung bersamaan. Pilihan ini menegaskan bahwa perjamuan belum berakhir dan terdengar alami dalam bahasa Indonesia.
- source_word: διάβολος
  choice: Iblis
  rationale: Dalam narasi Yohanes, istilah ini menunjuk kepada pribadi si jahat; sebutan baku Indonesia 'Iblis' menyampaikan rujukan itu dengan jelas.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: sudah menaruh dalam hati ... niat
  rationale: Ungkapan ini mempertahankan metafora 'menaruh dalam hati' sambil membuat objek gagasannya eksplisit dan wajar dalam bahasa Indonesia. 'Sudah' menyampaikan aspek tindakan yang telah terjadi sebelumnya.
- source_word: καρδίαν
  choice: hati
  rationale: '''Hati'' mempertahankan metafora antropologis Yunani yang mencakup kehendak dan niat, bukan hanya perasaan.'
- source_word: ἵνα παραδοῖ
  choice: niat untuk mengkhianati
  rationale: Dalam konteks Yudas, παραδίδωμι memiliki daya makna 'mengkhianati', sedangkan konstruksi dengan 'niat untuk' mengungkapkan isi yang ditaruh dalam hati secara alami.
- source_word: αὐτόν
  choice: Yesus
  rationale: Pronomina Yunani merujuk kepada Yesus. Penyebutan nama menghindari ambiguitas akibat beberapa tokoh laki-laki dalam kalimat Indonesia.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Yudas Iskariot, anak Simon
  rationale: Susunan ini memahami 'Iskariot' sebagai sebutan bagi Yudas dan 'anak Simon' sebagai keterangan hubungan ayah-anak, selaras dengan bentuk tekstual SBLGNT dan menghindari kesan bahwa Simonlah yang disebut Iskariot.
theological_decisions:
- issue: Peran Iblis dan tanggung jawab Yudas dalam pengkhianatan
  choice: Iblis sudah menaruh niat itu dalam hati Yudas, tetapi Yudas tetap disebut sebagai pelaku yang akan mengkhianati Yesus.
  alternative: Iblis mendorong Yudas; atau Iblis bertindak melalui Yudas sebagai satu-satunya pelaku.
  rationale: Teks Yunani mengaitkan niat tersebut dengan pengaruh Iblis sekaligus menempatkan Yudas sebagai orang yang melakukan pengkhianatan. Terjemahan mempertahankan ketegangan ini tanpa memutuskan persoalan determinisme.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. 'Perjamuan' dipilih untuk δείπνον, dan bentuk progresif 'sedang berlangsung' mencegah tafsiran bahwa makan malam telah selesai. Nama 'Yesus' dipakai menggantikan pronomina demi kejelasan rujukan.
