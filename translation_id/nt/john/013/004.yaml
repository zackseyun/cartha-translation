base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: id
  text: Ia bangkit[a] dari perjamuan, menanggalkan pakaian luarnya, lalu mengambil sehelai kain pembasuh dan mengikatkannya pada pinggangnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beranjak dari acara makan.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mengikat dirinya dengan kain itu.”
    reason: literal_rendering
lexical_decisions:
- source_word: ἐγείρεται
  choice: Ia bangkit
  rationale: Bentuk kini dalam narasi dipertahankan sebagai kala kini historis. “Bangkit” bernada wajar dan bermartabat; “berdiri” dapat menyiratkan posisi tubuh secara lebih khusus daripada yang dinyatakan teks.
- source_word: ἐκ τοῦ δείπνου
  choice: dari perjamuan
  rationale: δεῖπνον menunjuk pada jamuan atau acara makan. “Perjamuan” sesuai dengan konteks Yohanes tanpa mengikatnya pada pengertian waktu makan modern.
- source_word: τίθησιν τὰ ἱμάτια
  choice: menanggalkan pakaian luarnya
  rationale: Dalam konteks ini τίθημι berarti meletakkan atau menyingkirkan, sedangkan ἱμάτια menunjuk pada pakaian, khususnya pakaian luar. Terjemahan ini tidak memberi kesan bahwa Ia menanggalkan seluruh pakaian.
- source_word: λαβὼν λέντιον
  choice: mengambil sehelai kain pembasuh
  rationale: λέντιον adalah kain linen yang digunakan untuk pelayanan membasuh dan mengeringkan. “Kain pembasuh” lebih jelas dalam konteks ini daripada sekadar “kain” dan tidak membayangkan bentuk handuk modern tertentu.
- source_word: διέζωσεν ἑαυτόν
  choice: mengikatkannya pada pinggangnya
  rationale: διαζώννυμι menggambarkan tindakan mengikat atau melilitkan sesuatu pada diri, lazimnya di pinggang. Akhiran “-kannya” merujuk secara alami pada kain yang baru disebut.
