  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: id
  text: 'Yesus menjawab, “Engkau mau menyerahkan nyawamu bagi-Ku? Sesungguhnya, sesungguhnya, Aku berkata kepadamu: ayam jantan pasti tidak akan berkokok sebelum engkau menyangkal Aku tiga kali.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: menjawab
  rationale: Bentuk kini historis Yunani berfungsi memperkenalkan tanggapan Yesus; bentuk lampau tidak perlu ditandai secara morfologis dalam bahasa Indonesia.
- source_word: ψυχήν
  choice: nyawamu
  rationale: Dalam ungkapan τίθημι τὴν ψυχήν, ψυχή menunjuk pada hidup yang diserahkan hingga mati. “Nyawa” menyampaikan makna konkret ini secara alami tanpa membatasinya pada konsep jiwa yang tak berjasad.
- source_word: ὑπὲρ ἐμοῦ
  choice: bagi-Ku
  rationale: ὑπέρ menyatakan tindakan demi atau untuk kepentingan seseorang; “bagi-Ku” ringkas dan wajar dalam konteks pengorbanan diri.
- source_word: θήσεις
  choice: mau menyerahkan
  rationale: Dalam idiom bersama ψυχή, τίθημι berarti menyerahkan atau memberikan nyawa. Bentuk pertanyaan menantang kesediaan yang baru dinyatakan Petrus, sehingga “mau” alami dalam bahasa Indonesia.
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan formula penegasan khas Yesus dalam Injil Yohanes dengan ungkapan Indonesia yang khidmat dan mudah dimengerti.
- source_word: οὐ μὴ
  choice: pasti tidak akan
  rationale: Gabungan οὐ μή merupakan negasi yang sangat tegas; “pasti tidak akan” mempertahankan daya penekanannya.
- source_word: ἀλέκτωρ
  choice: ayam jantan
  rationale: Padanan Indonesia modern yang jelas bagi ayam jantan yang berkokok.
- source_word: φωνήσῃ
  choice: berkokok
  rationale: Dengan subjek ayam jantan, verba ini secara idiomatis berarti mengeluarkan bunyi kokok.
- source_word: ἕως οὗ
  choice: sebelum
  rationale: Dalam konstruksi negasi ini, bahasa Indonesia paling alami menyatakan bahwa penyangkalan terjadi mendahului kokok ayam dengan “sebelum”; hubungan temporal sumber tetap dipertahankan.
- source_word: ἀρνήσῃ με
  choice: engkau menyangkal Aku
  rationale: ἀρνέομαι di sini berarti menyangkal hubungan atau kesetiaan kepada Yesus. “Menyangkal Aku” langsung, lazim, dan tidak menambahkan penafsiran.
- source_word: τρίς
  choice: tiga kali
  rationale: Padanan Indonesia modern yang langsung dan alami.
theological_decisions:
- issue: Makna ψυχή dalam konteks pengorbanan diri Petrus
  choice: nyawa
  alternative: jiwa; hidup
  rationale: Konteksnya adalah kesediaan Petrus untuk mati bagi Yesus. “Nyawa” mempertahankan makna konkret hidup yang dapat dikorbankan dan menghindari penyempitan ψυχή menjadi unsur tak berjasad.
- issue: Daya retoris pertanyaan Yesus
  choice: Engkau mau menyerahkan nyawamu bagi-Ku?
  alternative: Apakah engkau akan menyerahkan nyawamu bagi-Ku?
  rationale: Pertanyaan menggemakan dan menguji pernyataan Petrus pada ayat sebelumnya. “Mau” menyampaikan tantangan terhadap kesiapan yang diklaim tanpa mengubahnya menjadi pernyataan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Pronomina “Engkau” serta kapitalisasi “Aku/-Ku” dipakai untuk sapaan langsung kepada dan ucapan Yesus. Pengulangan “Sesungguhnya, sesungguhnya” dipertahankan karena merupakan ciri formula Yohanes.
