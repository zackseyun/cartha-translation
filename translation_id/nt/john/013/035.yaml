base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: id
  text: Dengan ini[a] semua orang akan tahu bahwa kamu adalah murid-murid-Ku, jika kamu saling mengasihi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dalam hal ini semua orang akan tahu” atau “Dengan cara ini semua orang akan tahu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memiliki kasih di antara satu sama lain”; maksudnya, menunjukkan kasih timbal balik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dengan inilah
  rationale: Frasa ini paling mungkin berfungsi secara instrumental dan menunjuk pada kasih timbal balik sebagai tanda atau sarana pengenal. “Dengan inilah” alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan nuansa “dalam hal ini,” yang dicatat dalam catatan kaki.
- source_word: γνώσονται
  choice: akan tahu
  rationale: Bentuk futur γινώσκω di sini menyatakan bahwa semua orang akan mengetahui atau mengenali suatu kenyataan. “Akan tahu” merupakan padanan yang alami dan cukup luas tanpa mempersempitnya menjadi sekadar pengenalan visual atau sosial.
- source_word: πάντες
  choice: semua orang
  rationale: Bentuk jamak maskulin Yunani digunakan secara generik. “Semua orang” menyampaikan cakupan universal tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- source_word: ὅτι
  choice: bahwa
  rationale: Konjungsi ini memperkenalkan isi yang akan diketahui semua orang.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: kamu adalah murid-murid-Ku
  rationale: Dativ ἐμοὶ menyatakan hubungan kepunyaan atau keterikatan dengan Yesus. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan istilah “murid” bagi μαθητής.
- source_word: ἐὰν
  choice: jika
  rationale: Kata ini memperkenalkan klausa bersyarat dengan bentuk subjungtif. “Jika” mempertahankan bentuk syarat dalam teks tanpa menafsirkannya sebagai jasa untuk memperoleh status murid.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: kamu saling mengasihi
  rationale: Secara harfiah frasa ini berbicara tentang memiliki kasih di antara satu sama lain. Ungkapan “saling mengasihi” menyampaikan kasih yang timbal balik secara alami dalam bahasa Indonesia; bentuk harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Sifat syarat yang diperkenalkan oleh ἐὰν
  choice: jika kamu saling mengasihi
  alternative: ketika kamu saling mengasihi
  rationale: “Jika” mempertahankan struktur kondisional Yunani. Dalam konteks ini, kasih timbal balik berfungsi sebagai tanda pengenal para murid, bukan sebagai dasar jasa untuk menjadi murid.
- issue: Cakupan πάντες
  choice: semua orang
  alternative: semuanya
  rationale: Yang dimaksud bersifat universal dan tidak terbatas pada laki-laki. “Semua orang” memperjelas referen manusia tanpa menambahkan pembatasan yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “kamu” mengikuti bentuk jamak Yunani dan konteks perkataan Yesus kepada para murid; kapitalisasi “-Ku” mengikuti konvensi umum untuk rujukan ilahi. Susunan kalimat dibuat alami tanpa menghilangkan hubungan kondisional atau fungsi kasih sebagai tanda pengenal.
