  text: τοῦτο δὲ οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: id
  text: Namun, tidak seorang pun dari antara mereka yang sedang bersantap memahami untuk apa Ia mengatakan hal itu kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengapa Ia mengatakan hal itu kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hal itu
  rationale: Kata ganti penunjuk ini merujuk pada ucapan sebelumnya; “hal itu” alami dalam bahasa Indonesia dan mempertahankan daya rujuknya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan dengan ayat sebelumnya, yakni antara perintah Yesus dan ketidakpahaman orang-orang lain.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Mengungkapkan negasi menyeluruh secara wajar dan tegas dalam bahasa Indonesia.
- source_word: ἔγνω
  choice: memahami
  rationale: Dalam konteks ini γινώσκω menunjuk pada menangkap maksud ucapan, sehingga “memahami” lebih alami daripada “mengetahui”.
- source_word: τῶν ἀνακειμένων
  choice: dari mereka yang sedang duduk makan
  rationale: Secara harfiah menunjuk kepada orang-orang yang bersandar saat makan; “duduk makan” menyampaikan latar perjamuan secara alami kepada pembaca modern tanpa menonjolkan kebiasaan posisi tubuh kuno.
- source_word: πρὸς τί
  choice: untuk apa
  rationale: Ungkapan ini menanyakan tujuan; “untuk apa” mempertahankan nuansa tujuan lebih langsung daripada “mengapa”.
- source_word: εἶπεν αὐτῷ
  choice: Ia mengatakan hal itu kepadanya
  rationale: Menyampaikan verba berkata dan objek tak langsung dengan jelas; “hal itu” menggemakan τοῦτο yang ditempatkan di awal klausa Yunani.
theological_decisions:
- issue: Identitas subjek dan penerima ucapan tersirat dalam pronomina
  choice: Ia ... kepadanya
  alternative: Yesus ... kepada Yudas
  rationale: Teks Yunani hanya memakai pronomina dan mengandalkan konteks. Terjemahan tidak menambahkan nama-nama yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Duduk makan” dipilih sebagai padanan kontekstual bagi kebiasaan bersandar saat perjamuan; catatan kaki mempertahankan kemungkinan bahwa πρὸς τί dipahami secara lebih umum sebagai alasan, bukan tujuan.
