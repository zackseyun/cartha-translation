  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: id
  text: '“Sesungguhnya, sesungguhnya, Aku berkata kepadamu: siapa pun yang menerima siapa saja yang Kuutus[a], menerima Aku; dan siapa pun yang menerima Aku, menerima Dia yang mengutus Aku.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “orang yang menerima siapa pun yang Kuutus.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks Injil Yohanes, “Dia yang mengutus Aku” merujuk kepada Bapa.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang menegaskan dan sifat khidmat formula pembuka Yesus, sekaligus memakai bahasa Indonesia yang jelas bagi pembaca umum.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Padanan langsung dan wajar bagi bentuk ujaran khas dalam Injil Yohanes; bentuk tunggal “-mu” dipakai secara kolektif sesuai konteks perkataan kepada para murid.
- source_word: ὁ λαμβάνων
  choice: siapa pun yang menerima
  rationale: Partisip berartikel ini bersifat umum, bukan khusus laki-laki. “Siapa pun” menyampaikan cakupan generiknya secara alami.
- source_word: ἄν τινα πέμψω
  choice: siapa saja yang Kuutus
  rationale: Gabungan ἄν, kata ganti tak tentu τινα, dan subjungtif πέμψω menyatakan orang mana pun yang mungkin diutus Yesus. “Siapa saja yang Kuutus” mempertahankan cakupan terbuka tersebut.
- source_word: λαμβάνει
  choice: menerima
  rationale: Mempertahankan pengulangan leksikal yang membentuk rantai perwakilan dalam ayat ini. Kata ini dapat mencakup menyambut atau mengakui utusan, tanpa mempersempitnya hanya pada keramahan.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: dan siapa pun yang menerima Aku
  rationale: δέ di sini terutama melanjutkan dan meningkatkan paralelisme, bukan menyatakan pertentangan kuat; karena itu “dan” lebih sesuai daripada “tetapi”.
- source_word: τὸν πέμψαντά με
  choice: Dia yang mengutus Aku
  rationale: Menjaga ungkapan relasional teks tanpa menambahkan sebutan “Bapa” ke dalam teks utama, meskipun konteks Yohanes mengidentifikasi-Nya demikian.
theological_decisions:
- issue: Identitas ‘Dia yang mengutus Aku’
  choice: Dia yang mengutus Aku
  alternative: Bapa yang mengutus Aku
  rationale: Dalam konteks Injil Yohanes, yang dimaksud adalah Bapa, tetapi ayat ini sendiri memakai ungkapan relasional dan tidak menyebut gelar “Bapa”. Terjemahan mempertahankan bentuk sumber, sedangkan identifikasinya dijelaskan dalam catatan kaki.
- issue: Partisip maskulin yang bersifat umum
  choice: siapa pun yang menerima
  alternative: orang yang menerima
  rationale: Bentuk maskulin tunggal dalam bahasa Yunani berfungsi secara generik dan tidak membatasi pelakunya pada laki-laki. “Siapa pun” menyampaikan maksud umum itu dengan jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti konvensi umum penerjemahan Alkitab bahasa Indonesia. Pengulangan “menerima” sengaja dipertahankan untuk menjaga rantai perwakilan dalam teks Yunani.
