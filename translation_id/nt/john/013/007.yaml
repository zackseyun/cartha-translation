  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Sekarang kamu belum mengetahui apa yang sedang Kulakukan, tetapi sesudah semua ini kamu akan memahaminya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: menjawab dan berkata kepadanya
  rationale: Mempertahankan kedua verba Yunani serta objek tidak langsungnya dalam bentuk naratif Indonesia yang tetap wajar dan bermartabat.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Apa yang sedang Kulakukan
  rationale: Bentuk progresif menampilkan tindakan Yesus yang sedang berlangsung, sedangkan kata ganti ἐγώ mendapat penekanan alami melalui bentuk 'Kulakukan'.
- source_word: οὐκ οἶδας ἄρτι
  choice: belum kamu ketahui sekarang
  rationale: ‘Ketahui’ mempertahankan arti dasar οἶδα dan membedakannya dari γινώσκω berikutnya. ‘Belum’ menyampaikan keadaan negatif sekarang yang akan berubah, sementara ‘sekarang’ menerjemahkan ἄρτι secara eksplisit.
- source_word: γνώσῃ
  choice: kamu akan memahaminya
  rationale: Dalam konteks ini γινώσκω menunjuk pada pengertian yang kelak diperoleh mengenai makna tindakan Yesus; akhiran '-nya' membuat objek yang tersirat jelas secara alami dalam bahasa Indonesia.
- source_word: δὲ μετὰ ταῦτα
  choice: tetapi sesudah semua ini
  rationale: ‘Tetapi’ menyatakan kontras temporal, dan ‘sesudah semua ini’ mempertahankan keluasan rujukan frasa Yunani tanpa menentukan peristiwa tertentu.
theological_decisions:
- issue: Cakupan waktu μετὰ ταῦτα
  choice: sesudah semua ini
  alternative: nanti; sesudah pembasuhan kaki; sesudah kematian dan kebangkitan Yesus; melalui karya Roh
  rationale: Frasa Yunani tidak menetapkan apakah pemahaman itu datang setelah penjelasan pembasuhan kaki atau melalui peristiwa-peristiwa yang lebih kemudian. Terjemahan dibiarkan terbuka.
- issue: Perbedaan οἶδας dan γνώσῃ
  choice: ketahui … memahaminya
  alternative: mengerti … mengerti; tahu … tahu
  rationale: Pilihan ini menandai perbedaan kedua verba Yunani dan menunjukkan gerak dari tidak mengetahui tindakan itu menuju memahami maknanya, tanpa membangun perbedaan teologis yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘menjawab dan berkata’ sengaja sedikit formal untuk mencerminkan dua verba sumber. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
