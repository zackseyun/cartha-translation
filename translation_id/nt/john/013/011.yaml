base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: id
  text: Sebab Ia tahu siapa yang menyerahkan-Nya; karena itu Ia berkata, “Tidak semua di antara kalian bersih.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδει
  choice: Ia tahu
  rationale: Bentuk dari οἶδα menyatakan pengetahuan yang sudah ada pada Yesus; dalam narasi Indonesia, bentuk sederhana “tahu” paling alami.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan bagi pernyataan sebelumnya, dan “sebab” mempertahankan hubungan penjelas itu secara ringkas.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: siapa yang menyerahkan-Nya
  rationale: παραδίδωμι secara dasar berarti “menyerahkan” atau “menyerahkan ke tangan pihak lain.” Pilihan ini mempertahankan ungkapan konkret dalam bahasa Yunani sekaligus, dalam konteks Yudas, tetap mengandung makna pengkhianatan.
- source_word: διὰ τοῦτο
  choice: karena itu
  rationale: Ungkapan ini menyatakan hubungan sebab-akibat antara pengetahuan Yesus dan perkataan-Nya.
- source_word: εἶπεν ὅτι
  choice: Ia berkata
  rationale: ὅτι berfungsi memperkenalkan isi perkataan dan secara alami diwakili oleh kutipan langsung dalam bahasa Indonesia.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: Tidak semua dari kalian bersih
  rationale: Susunan ini mempertahankan negasi terhadap keseluruhan kelompok, membuat sapaan jamak eksplisit, dan menjaga gema antara kebersihan jasmani dan rohani melalui kata “bersih”.
theological_decisions:
- issue: Makna παραδιδόντα sehubungan dengan Yudas
  choice: menyerahkan
  alternative: mengkhianati
  rationale: “Menyerahkan” lebih dekat dengan citra leksikal bahasa Yunani dan tidak menghapus makna pengkhianatan yang muncul jelas dari konteks kisah sengsara.
- issue: Makna καθαροί dalam pembicaraan tentang pembasuhan kaki
  choice: bersih
  alternative: murni atau suci
  rationale: “Bersih” mempertahankan permainan makna antara pembasuhan jasmani dan keadaan batin, tanpa membatasi perkataan itu pada satu sisi saja.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kata ganti kehormatan untuk Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Kalian” dipakai untuk menyatakan orang kedua jamak secara jelas.
