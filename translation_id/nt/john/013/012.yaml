revisions:
- from: Sesudah membasuh kaki mereka, Yesus mengenakan kembali pakaian-Nya, lalu kembali mengambil tempat dengan berbaring di meja[a]. Ia berkata kepada mereka, “Apakah kalian mengerti apa yang telah Kulakukan bagi kalian[b]?”
  to: Jadi, sesudah Yesus membasuh kaki mereka dan mengambil kembali pakaian-Nya, Ia kembali mengambil tempat-Nya di meja makan[a]. Lalu Ia berkata kepada mereka, “Apakah kalian mengerti apa yang telah Kulakukan bagi kalian[b]?”
  rationale: Revisi menghilangkan gambaran Indonesia yang keliru bahwa Yesus berbaring di atas meja, sambil mempertahankan informasi historis tentang posisi bersantap melalui catatan kaki. “Mengambil kembali pakaian-Nya” mengikuti ἔλαβεν lebih dekat daripada “mengenakan kembali,” tanpa menolak konteks bahwa pakaian itu sebelumnya telah ditanggalkan. “Jadi” secara ringan menyampaikan daya penghubung οὖν.
