review_pass:
  verdict: revise
  source_fidelity: Draf secara umum mengikuti urutan dan arti teks Yunani, termasuk pertanyaan tentang pemahaman dan nuansa perfektum dalam “telah Kulakukan.” Namun, “berbaring di meja” dalam bahasa Indonesia biasanya berarti berbaring di atas permukaan meja, bukan mengambil posisi bersantap kuno. Selain itu, “mengenakan kembali” menambahkan tindakan memakai, sedangkan ἔλαβεν secara leksikal menyatakan mengambil pakaian-Nya.
  naturalness: Kalimatnya baku dan jelas, tetapi frasa “mengambil tempat dengan berbaring di meja” tidak alami dan berpotensi menimbulkan gambaran yang keliru. “Kembali mengambil tempat-Nya di meja makan” adalah idiom Indonesia yang wajar; sikap berbaring saat makan dapat dijelaskan secara tepat dalam catatan kaki.
  terminology: “membasuh kaki mereka,” “pakaian-Nya,” “mengerti,” dan “bagi kalian” sesuai register modern baku. Kapitalisasi pronomina ilahi dipertahankan. “Meja makan” lebih jelas daripada “meja” dalam konteks perjamuan.
  issues:
  - severity: medium
    issue: Frasa “berbaring di meja” dapat berarti berbaring di atas meja.
    rationale: ἀνέπεσεν dalam konteks perjamuan berarti kembali mengambil posisi bersantap dengan bersandar/berbaring, bukan berbaring pada permukaan meja. Rumusan Indonesia saat ini tidak menyampaikan hal itu secara idiomatis.
  - severity: low
    issue: “Mengenakan kembali pakaian-Nya” melampaui tindakan yang dinyatakan secara eksplisit oleh ἔλαβεν.
    rationale: Verba Yunani berarti “mengambil”; konteks memang dapat mengisyaratkan pemakaian kembali, tetapi teks ayat ini sendiri tidak menyatakannya. “Mengambil kembali pakaian-Nya” lebih dekat pada sumber tanpa mengaburkan alur.
  revised_text: Jadi, sesudah Yesus membasuh kaki mereka dan mengambil kembali pakaian-Nya, Ia kembali mengambil tempat-Nya di meja makan[a]. Lalu Ia berkata kepada mereka, “Apakah kalian mengerti apa yang telah Kulakukan bagi kalian[b]?”
