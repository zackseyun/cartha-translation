  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: id
  text: Jadi, sesudah Yesus membasuh kaki mereka dan mengambil kembali pakaian-Nya, Ia kembali mengambil tempat-Nya di meja makan[a]. Lalu Ia berkata kepada mereka, “Apakah kalian mengerti apa yang telah Kulakukan bagi kalian[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berbaring kembali”; dalam perjamuan pada zaman itu, orang biasanya makan sambil bersandar atau berbaring di meja makan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada kalian.” Bentuk dativus Yunani dapat dipahami dengan kedua cara tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Sesudah
  rationale: Klausa temporal merangkum tindakan yang telah selesai sebelum tindakan berikutnya; daya penghubung οὖν tersampaikan secara alami oleh alur narasi Indonesia tanpa padanan tersendiri.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: membasuh kaki mereka
  rationale: Padanan langsung dan wajar; bentuk aoris dipahami sebagai tindakan yang selesai dalam klausa temporal.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: mengenakan kembali pakaian-Nya
  rationale: Secara leksikal berarti mengambil pakaian-Nya, tetapi dalam konteks setelah pakaian itu ditanggalkan (13:4), ungkapan Indonesia ini menyampaikan tindakan yang dimaksud dengan jelas. 'Pakaian' tidak mempersempit bentuk jamak ἱμάτια menjadi hanya pakaian luar.
- source_word: ἀνέπεσεν
  choice: kembali mengambil tempat dengan berbaring di meja
  rationale: Dalam konteks perjamuan, verba ini menunjuk pada posisi berbaring saat makan; rumusan ini akurat secara historis sekaligus mudah dipahami pembaca modern.
- source_word: Γινώσκετε
  choice: Apakah kalian mengerti
  rationale: Pertanyaan menyangkut pemahaman akan makna tindakan Yesus, bukan sekadar mengetahui bahwa tindakan itu terjadi.
- source_word: τί πεποίηκα ὑμῖν
  choice: apa yang telah Kulakukan bagi kalian
  rationale: Bentuk perfektum mempertahankan dampak kini dari tindakan yang telah selesai. Dativus ὑμῖν paling wajar dipahami secara benefaktif dalam konteks pelayanan, sambil mencatat alternatif yang sungguh mungkin.
theological_decisions:
- issue: Sikap tubuh Yesus ketika kembali ke meja
  choice: kembali mengambil tempat dengan berbaring di meja
  alternative: duduk kembali
  rationale: Pilihan utama mempertahankan latar budaya perjamuan abad pertama dan tidak mengubahnya menjadi kebiasaan duduk modern.
- issue: Daya dativus ὑμῖν
  choice: bagi kalian
  alternative: kepada kalian
  rationale: Konteks pembasuhan kaki mendukung nuansa manfaat atau pelayanan, tetapi dativus Yunani juga memungkinkan padanan yang lebih netral, sehingga alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk bentuk jamak yang jelas; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
