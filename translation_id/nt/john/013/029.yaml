  to: Sebab beberapa orang menyangka bahwa, karena Yudas memegang kotak uang[a], Yesus berkata kepadanya, “Belilah apa yang kita perlukan untuk perayaan itu,” atau bahwa ia harus memberikan sesuatu kepada orang-orang miskin.
