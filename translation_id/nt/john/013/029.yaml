id: JHN.13.29
reference: John 13:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: id
  text: Sebab beberapa orang menyangka bahwa, karena Yudas memegang kotak uang[a], Yesus berkata kepadanya, “Belilah apa yang kita perlukan untuk perayaan itu,” atau bahwa ia harus memberikan sesuatu kepada orang-orang miskin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kantong uang.” Istilah Yunani ini merujuk pada wadah tempat dana kelompok disimpan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: beberapa orang
  rationale: Merujuk secara tak tentu kepada sebagian orang yang hadir; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐδόκουν
  choice: menyangka
  rationale: Mengungkapkan dugaan mereka dalam alur narasi tanpa menyiratkan kepastian.
- source_word: ἐπεὶ
  choice: karena
  rationale: Memperkenalkan alasan bagi dugaan mereka, yaitu bahwa Yudas memegang tempat penyimpanan uang kelompok.
- source_word: γλωσσόκομον
  choice: kotak uang
  rationale: Istilah Yunani menunjuk pada wadah tempat dana kelompok disimpan; terjemahan ini dekat dengan bentuk sumber tanpa menentukan bahan atau bentuk wadah secara berlebihan.
- source_word: εἶχεν
  choice: memegang
  rationale: Mempertahankan arti dasar memiliki atau memegang, sementara konteks menunjukkan tanggung jawab atas dana kelompok.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Present historis dialihkan secara alami ke bentuk lampau naratif dalam bahasa Indonesia; isi perkataan dipahami sebagai dugaan para murid.
- source_word: Ἀγόρασον
  choice: Belilah
  rationale: Imperatif langsung yang alami, modern, dan tetap santun dalam register Alkitab.
- source_word: ὧν χρείαν ἔχομεν
  choice: apa yang kita perlukan
  rationale: Padanan idiomatis dan setia bagi konstruksi relatif Yunani yang berarti hal-hal yang diperlukan.
- source_word: εἰς τὴν ἑορτήν
  choice: untuk perayaan itu
  rationale: ἑορτή berarti perayaan atau hari raya keagamaan; kata penunjuk menandai perayaan yang sudah diketahui dari konteks tanpa menambahkan nama Paskah di ayat ini.
- source_word: τοῖς πτωχοῖς
  choice: kepada orang miskin
  rationale: Menerjemahkan adjektiva substantival sebagai kelompok orang dan sesuai dengan verba 'memberikan'.
- source_word: ἵνα τι δῷ
  choice: menyuruhnya memberikan sesuatu
  rationale: Dalam rangkaian alternatif setelah 'Yesus berkata kepadanya', ungkapan ini menyampaikan tindakan yang menurut mereka diperintahkan Yesus, dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Identitas perayaan
  choice: perayaan itu
  alternative: perayaan Paskah
  rationale: Konteks bagian ini adalah Paskah, tetapi ayat tersebut hanya memakai ἑορτή; terjemahan tidak menambahkan nama perayaan yang tidak diulang dalam teks ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alasan bagi dugaan para murid serta dua kemungkinan isi perkataan Yesus. 'Kotak uang' diberi alternatif karena istilah sumber tidak memastikan bentuk wadah.
