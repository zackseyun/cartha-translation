  source_fidelity: 'Teks Indonesia menerjemahkan semua unsur utama SBLGNT dengan tepat: subjek “Simon Petrus,” pronomina tidak langsung “kepadanya,” sapaan κύριε, serta konstruksi μὴ ... μόνον ἀλλὰ καί melalui “bukan hanya ... tetapi juga.” Kepemilikan yang tersirat pada tangan dipahami secara wajar dalam rangkaian “kakiku ... tangan dan kepalaku.”'
  naturalness: “Simon Petrus berkata kepadanya” dan dialognya terdengar alami dalam bahasa Indonesia modern yang bermartabat. Susunan “bukan hanya kakiku, tetapi juga tangan dan kepalaku” jelas dan idiomatis; sufiks -ku pada unsur terakhir secara alami mencakup “tangan” dalam koordinasi tersebut.
