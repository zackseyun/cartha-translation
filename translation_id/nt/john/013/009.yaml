id: JHN.13.9
reference: John 13:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: id
  text: Simon Petrus berkata kepadanya, “Tuhan,[a] bukan hanya kakiku, tetapi juga tangan dan kepalaku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Guru.” Yunani: Kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani menghidupkan narasi; dalam bahasa Indonesia, “berkata” secara alami dapat dipakai dalam penceritaan tanpa penandaan kala eksplisit.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Mempertahankan bentuk pronominal sumber; rujukannya kepada Yesus sudah jelas dari konteks.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan hormat sekaligus gema teologis κύριος dalam Injil Yohanes; alternatif kontekstual dicatat dalam catatan kaki.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: bukan hanya ... tetapi juga
  rationale: Menyampaikan perluasan kontras Yunani dengan susunan yang alami dalam bahasa Indonesia.
- source_word: τοὺς πόδας μου
  choice: kakiku
  rationale: Padanan langsung yang alami untuk objek jamak beserta pronomina posesif.
- source_word: τὰς χεῖρας
  choice: tangan
  rationale: Kepemilikan tidak diulang dalam bahasa Yunani dan dalam bahasa Indonesia dapat dipahami mencakup semua anggota tubuh yang dikoordinasikan; menghindari pengulangan yang kaku.
- source_word: τὴν κεφαλήν
  choice: kepalaku
  rationale: Menutup rangkaian anggota tubuh secara alami; sufiks posesif memperjelas cakupan kepemilikan tanpa mengubah makna.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Guru
  rationale: “Tuhan” mempertahankan daya sapaan hormat dan kemungkinan bobot kristologis yang hadir dalam κύριος, tanpa memaksa pembaca memilih hanya pengertian “Guru”; alternatif dicatat untuk menunjukkan rentang leksikal.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Tanda seru dipakai untuk mencerminkan jawaban Petrus yang mendadak dan penuh semangat, meskipun naskah Yunani kuno tidak menetapkan tanda baca modern.
