  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: id
  text: Maka Simon Petrus memberi isyarat kepada murid itu supaya ia menanyakan siapa yang dimaksud oleh Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Maka Simon Petrus memberi isyarat kepadanya supaya ia menanyakan siapa gerangan orang yang sedang dibicarakan-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: memberi isyarat
  rationale: Kata ini menunjukkan komunikasi nonverbal melalui gerak atau tanda. 'Memberi isyarat' alami dalam bahasa Indonesia dan tidak membatasi geraknya pada anggukan.
- source_word: οὖν
  choice: Maka
  rationale: Di sini kata tersebut menandai kelanjutan sekaligus akibat dari pernyataan sebelumnya; 'maka' mempertahankan alur naratif itu dengan register yang bermartabat.
- source_word: τούτῳ
  choice: kepada murid itu
  rationale: Kata tunjuk ini mengacu kepada murid yang baru disebut dalam konteks. Penambahan 'murid' memperjelas rujukan tanpa mengganti identitasnya dengan nama yang tidak terdapat dalam ayat.
- source_word: πυθέσθαι
  choice: supaya ia menanyakan
  rationale: Infinitif ini menyatakan maksud isyarat Petrus, yaitu agar murid tersebut bertanya. Bentuk ini jelas dan idiomatis dalam bahasa Indonesia.
- source_word: τίς ἂν εἴη
  choice: siapa yang dimaksud
  rationale: Ungkapan Yunani menanyakan identitas orang yang sedang dibicarakan dengan nuansa ketidakpastian. Dalam konteks ini, 'siapa yang dimaksud' menyampaikan pertanyaan itu secara alami; nuansa yang lebih harfiah dicatat dalam catatan kaki.
- source_word: περὶ οὗ λέγει
  choice: yang dimaksud oleh Yesus
  rationale: Secara harfiah berarti 'tentang siapa ia berbicara.' Penyebutan 'Yesus' menjernihkan subjek pronominal dari konteks, sedangkan 'dimaksud' menghasilkan bahasa Indonesia yang lancar tanpa mengubah rujukannya.
