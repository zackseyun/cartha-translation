review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s emphatic refusal (οὐ μή … εἰς τὸν αἰῶνα), the washing imagery, and Jesus’ conditional statement. However, “tidak mendapat bagian bersama-Ku” somewhat shifts οὐκ ἔχεις (“you do not have”) to an acquisition concept (“do not receive/get”) and “bersama-Ku” is less direct for μετ’ ἐμοῦ (“with me”).
  naturalness: The Indonesian is generally modern, standard, and suitably dignified. “Petrus berkata kepada-Nya” is slightly more natural narrative Indonesian than the inverted “Kata Petrus kepada-Nya.” “Tidak mempunyai bagian dengan-Ku” is clearer and more source-shaped in this context.
  terminology: “Membasuh” is appropriate for νίπτω in this foot-washing context. “Bagian” preserves the breadth of μέρος without imposing a sacramental, soteriological, or merely ethical interpretation. The revised footnote supplies “mendapat bagian bersama-Ku” as a natural Indonesian alternative rather than treating it as the primary wording.
  issues:
  - severity: medium
    issue: The main rendering changes “have no share” into “do not get/receive a share.”
    rationale: Greek οὐκ ἔχεις μέρος means literally and idiomatically “you have no part/share.” Indonesian “tidak mendapat bagian” can suggest failure to obtain something, whereas the source states Peter’s lack of a share/part with Jesus. “Tidak mempunyai bagian dengan-Ku” better retains the predicate and the relational ambiguity.
  - severity: low
    issue: “Bersama-Ku” is a less direct rendering of μετ’ ἐμοῦ than “dengan-Ku.”
    rationale: “Bersama-Ku” is possible, but “dengan-Ku” most directly expresses association/fellowship and avoids any slight suggestion of merely receiving a portion alongside Jesus.
  revised_text: Petrus berkata kepada-Nya, “Engkau tidak akan pernah membasuh kakiku!” Yesus menjawabnya, “Jika Aku tidak membasuh engkau, engkau tidak mempunyai bagian dengan-Ku[a].”
  revised_footnotes:
  - marker: a
    text: Atau, “engkau tidak mendapat bagian bersama-Ku.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the emphatic future refusal and the conditional form while rendering οὐκ ἔχεις μέρος μετ’ ἐμοῦ more closely as a present lack of “part/share with” Jesus. It retains the broad theological sense of μέρος and does not resolve its disputed implications.
