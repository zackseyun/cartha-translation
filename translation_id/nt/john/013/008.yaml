revisions:
- from: Kata Petrus kepada-Nya, “Engkau tidak akan pernah membasuh kakiku!” Yesus menjawabnya, “Jika Aku tidak membasuh engkau, engkau tidak mendapat bagian bersama-Ku[a].”
  to: Petrus berkata kepada-Nya, “Engkau tidak akan pernah membasuh kakiku!” Yesus menjawabnya, “Jika Aku tidak membasuh engkau, engkau tidak mempunyai bagian dengan-Ku[a].”
  rationale: The revision preserves the emphatic future refusal and the conditional form while rendering οὐκ ἔχεις μέρος μετ’ ἐμοῦ more closely as a present lack of “part/share with” Jesus. It retains the broad theological sense of μέρος and does not resolve its disputed implications.
  reviewer_model: gpt-5.6-terra
