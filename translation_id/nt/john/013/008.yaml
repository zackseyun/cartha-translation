  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: id
  text: Petrus berkata kepada-Nya, “Engkau tidak akan pernah membasuh kakiku!” Yesus menjawabnya, “Jika Aku tidak membasuh engkau, engkau tidak mempunyai bagian dengan-Ku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau tidak mendapat bagian bersama-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα
  choice: Engkau tidak akan pernah membasuh
  rationale: Gabungan οὐ μή dengan subjungtif aoris menyatakan penolakan yang sangat tegas terhadap tindakan pada masa mendatang, sedangkan εἰς τὸν αἰῶνα memperkuatnya. Ungkapan “tidak akan pernah” menyampaikan daya penolakan itu secara alami dalam bahasa Indonesia modern.
- source_word: μου τοὺς πόδας
  choice: kakiku
  rationale: Konstruksi posesif ini secara langsung berarti “kaki-kakiku/kakiku.” Bentuk tunggal kolektif “kakiku” lazim dan alami dalam bahasa Indonesia untuk sepasang kaki.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Yesus menjawabnya
  rationale: ἀποκρίνομαι adalah verba naratif biasa untuk memberi jawaban atau tanggapan. “Menjawabnya” ringkas dan setia pada objek tidak langsung αὐτῷ.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Jika Aku tidak membasuh engkau
  rationale: Terjemahan ini mempertahankan struktur syarat eksplisit dan objek orang kedua. “Membasuh” sesuai dengan tindakan mencuci bagian tubuh dan cocok dengan konteks pembasuhan kaki.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: engkau tidak mendapat bagian bersama-Ku
  rationale: μέρος dapat berarti bagian, porsi, atau keikutsertaan. “Mendapat bagian bersama-Ku” menyampaikan gagasan partisipasi atau kebersamaan tanpa menentukan mekanisme teologisnya secara lebih sempit.
theological_decisions:
- issue: Makna mendapat μέρος bersama Yesus
  choice: Menyatakan keikutsertaan atau persekutuan dengan Yesus tanpa merinci mekanisme sakramental atau soteriologisnya.
  alternative: Menafsirkannya secara khusus sebagai pembasuhan sakramental, teladan pelayanan rendah hati, atau pernyataan langsung tentang keselamatan.
  rationale: Teks menegaskan bahwa pembasuhan oleh Yesus diperlukan agar Petrus mendapat μέρος bersama-Nya, tetapi ayat ini sendiri tidak menjelaskan secara khusus bagaimana hubungan teologis itu bekerja. Terjemahan mempertahankan keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan serta pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan luas dalam teks Alkitab bahasa Indonesia. “Membasuh” dipilih daripada “mencuci” untuk konteks pembasuhan tubuh yang khidmat, tanpa menjadi arkais.
