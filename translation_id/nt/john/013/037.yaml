  terminology: “Tuhan,” “mengikuti-Mu,” dan “nyawaku” tepat. Catatan kaki secara tepat menjelaskan bahwa ψυχή dalam idiom ini berarti nyawa/hidup, bukan terutama ‘jiwa’ dalam arti metafisik. Mengganti “demi Engkau” dengan “bagi-Mu” akan memberikan padanan yang lebih netral bagi ὑπέρ tanpa menghilangkan keluasan nuansanya.
