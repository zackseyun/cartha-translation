  source_fidelity: Terjemahan ini pada umumnya setia kepada teks Yunani. “mengikuti-Mu sekarang” mempertahankan ἀκολουθῆσαι dan ἄρτι, sedangkan “menyerahkan nyawaku” menyampaikan idiom θήσω τὴν ψυχήν μου secara wajar sebagai kesediaan mati. Namun, ὑπὲρ σοῦ lebih langsung dan lebih luas diterjemahkan “bagi-Mu” daripada “demi Engkau”; pilihan terakhir dapat terdengar lebih menekankan motif atau seruan daripada relasi ‘bagi/untuk’ yang dinyatakan teks.
