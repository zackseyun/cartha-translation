  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: id
  text: Petrus berkata kepada-Nya, “Tuhan, mengapa aku tidak dapat mengikuti-Mu sekarang? Aku akan menyerahkan nyawaku[a] bagi-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwaku”; dalam ungkapan ini maksudnya ialah nyawa atau hidup yang diberikan dalam kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai kala kini historis, tetapi dalam narasi bahasa Indonesia bentuk netral “berkata” lebih alami dan tetap menyampaikan peristiwa lampau dari konteks.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini menyatakan penghormatan kepada Yesus dan dapat mengandung bobot teologis; “Tuhan” mempertahankan keduanya tanpa mempersempit maknanya menjadi sekadar guru atau tuan.
- source_word: οὐ δύναμαί σοι ἀκολουθῆσαι
  choice: aku tidak dapat mengikuti-Mu
  rationale: Ungkapan ini mempertahankan ketidakmampuan Petrus sekaligus cakupan ἀκολουθέω, yang dapat menunjuk pada tindakan pergi mengikuti Yesus maupun makna kemuridan.
- source_word: ἄρτι
  choice: sekarang
  rationale: Padanan alami bagi keterangan waktu yang menekankan saat ini.
- source_word: τὴν ψυχήν μου
  choice: nyawaku
  rationale: Dalam ungkapan ini ψυχή berarti hidup atau nyawa yang diserahkan dalam kematian, bukan terutama unsur metafisik yang terpisah dari tubuh.
- source_word: ὑπὲρ σοῦ
  choice: demi Engkau
  rationale: “Demi Engkau” mengungkapkan tindakan untuk kepentingan atau sebagai pengorbanan bagi Yesus, sambil tidak menentukan secara berlebihan apakah nuansanya semata-mata mewakili atau menggantikan.
- source_word: θήσω
  choice: akan menyerahkan
  rationale: Bersama ψυχή, verba ini membentuk ungkapan tentang memberikan nyawa. “Menyerahkan nyawa” alami dalam bahasa Indonesia dan menyampaikan kesediaan untuk mati.
theological_decisions:
- issue: Makna ψυχή dalam pernyataan Petrus
  choice: Diterjemahkan “nyawa”
  alternative: jiwa; hidup
  rationale: Konteksnya ialah kesediaan Petrus untuk mati bagi Yesus. “Nyawa” menyampaikan maksud idiom itu tanpa memberi kesan bahwa Petrus hanya berbicara tentang bagian rohaninya.
- issue: Nuansa ἀκολουθέω
  choice: Diterjemahkan “mengikuti”
  alternative: menyertai; pergi bersama
  rationale: “Mengikuti” mempertahankan sekaligus makna gerak menuju tempat Yesus pergi dan gema kemuridan yang penting dalam Injil Yohanes.
- issue: Nuansa ὑπέρ dalam janji Petrus
  choice: Diterjemahkan “demi Engkau”
  alternative: untuk Engkau; sebagai ganti-Mu
  rationale: Bentuk Yunani dapat menyatakan tindakan demi kepentingan orang lain dan dalam konteks tertentu dapat mendekati gagasan penggantian. Terjemahan ini menjaga keluasan maknanya tanpa memaksakan arti penggantian yang lebih spesifik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang mengacu langsung kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan ketegangan antara ketidakmampuan Petrus untuk mengikuti Yesus sekarang dan tekadnya untuk mati demi Dia.
