  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: id
  text: Sekarang Aku memberitahukan kepadamu sebelum hal itu terjadi, supaya ketika hal itu terjadi, kamu percaya bahwa Akulah Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “bahwa Aku adalah.” Ungkapan Yunani ini juga mungkin menggemakan pernyataan identitas ilahi dalam Kitab Yesaya dan di bagian-bagian lain Injil Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Mulai sekarang
  rationale: Ungkapan waktu ini menunjuk dari saat sekarang ke depan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan arah waktunya.
- source_word: λέγω ὑμῖν
  choice: Aku memberitahukannya kepadamu
  rationale: Konteksnya adalah pemberitahuan sebelumnya tentang peristiwa yang akan terjadi. Bentuk ini alami dalam bahasa Indonesia, dengan -nya merujuk pada hal yang akan terjadi.
- source_word: πρὸ τοῦ γενέσθαι
  choice: sebelum hal itu terjadi
  rationale: Konstruksi ini menyatakan waktu yang mendahului suatu peristiwa; 'hal itu' mempertahankan rujukan peristiwa yang tidak disebut ulang secara khusus dalam ayat ini.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan dan merupakan padanan Indonesia yang alami.
- source_word: πιστεύσητε
  choice: kamu percaya
  rationale: Mempertahankan istilah utama πιστεύω sebagai 'percaya' tanpa memaksakan nuansa ingresif yang tidak pasti.
- source_word: ὅταν γένηται
  choice: ketika hal itu terjadi
  rationale: ὅταν dengan subjungtif mengacu pada kejadian mendatang; frasa ini jelas dan tetap mempertahankan kaitannya dengan peristiwa yang telah diberitahukan.
- source_word: ὅτι ἐγώ εἰμι
  choice: bahwa Akulah Dia
  rationale: Ungkapan Yunani tidak memiliki predikat eksplisit. 'Akulah Dia' dapat dipahami dalam bahasa Indonesia sebagai identifikasi diri tanpa menambahkan gelar tertentu, sementara bentuk yang lebih harfiah dan kemungkinan gema teologisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Ungkapan absolut ἐγώ εἰμι dalam konteks Yohanes yang mungkin menggemakan identifikasi diri ilahi
  choice: bahwa Akulah Dia
  alternative: bahwa Aku adalah
  rationale: '''Akulah Dia'' memberikan identifikasi diri yang dapat dipahami dalam bahasa Indonesia tanpa memasukkan predikat atau gelar yang tidak ada dalam teks Yunani. Catatan kaki mempertahankan bentuk yang lebih harfiah dan kemungkinan gema identifikasi diri ilahi, sehingga ketegangan teologis tidak diselesaikan secara sepihak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Pengulangan 'hal itu terjadi' dipertahankan demi kejernihan hubungan antara pemberitahuan dan penggenapannya.
