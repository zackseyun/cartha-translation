review_pass:
  verdict: revise
  source_fidelity: 'Secara umum setia pada struktur dan makna Yunani: pemberitahuan mendahului peristiwa, tujuan agar para murid percaya, dan ungkapan ἐγώ εἰμι tidak diberi predikat atau gelar teologis tertentu dalam teks utama. Namun, «Mulai sekarang Aku memberitahukannya» dalam bahasa Indonesia lebih mudah dibaca sebagai tindakan yang berlangsung sejak kini dan seterusnya. Dalam konteks ayat ini, ἀπ’ ἄρτι terutama menandai saat pengucapan sekarang, sebelum peristiwa itu terjadi. Selain itu, akhiran -nya pada «memberitahukannya» menambahkan objek gramatikal yang tidak dinyatakan dalam λέγω, walaupun peristiwanya tersirat dari konteks.'
  naturalness: Revisi menjadi «Sekarang Aku memberitahukan kepadamu sebelum hal itu terjadi» lebih idiomatis dan langsung dalam bahasa Indonesia baku. Pengulangan «hal itu terjadi» tetap wajar dan membantu memperlihatkan hubungan antara pemberitahuan lebih dahulu dan terjadinya peristiwa.
  terminology: «percaya» merupakan padanan yang tepat untuk πιστεύσητε. «Akulah Dia» adalah ungkapan Indonesia yang alami untuk identifikasi diri, sambil tetap tidak menentukan predikat yang tidak hadir dalam Yunani. Catatan kaki dengan tepat memelihara bentuk absolut «Aku adalah» dan hanya menyatakan kemungkinan gema identifikasi ilahi, bukan kepastian penafsiran.
  issues:
  - severity: medium
    issue: «Mulai sekarang» dapat menyiratkan tindakan berkelanjutan mulai saat ini.
    rationale: Dalam rangkaian «Mulai sekarang Aku memberitahukannya», pembaca Indonesia dapat memahami bahwa Yesus akan terus memberitahukan hal itu dari sekarang ke depan. Di sini ἀπ’ ἄρτι berfungsi paling alami sebagai penanda saat ini dalam pemberitahuan yang mendahului kejadian.
  - severity: low
    issue: «memberitahukannya» memasukkan objek pronominal eksplisit.
    rationale: λέγω ὑμῖν tidak menyebut objek langsung; peristiwa yang akan terjadi hanya dipahami dari konteks. Menghilangkan -nya menghasilkan kalimat Indonesia yang tetap jelas dan lebih dekat pada kelonggaran rujukan dalam sumber.
  revised_text: Sekarang Aku memberitahukan kepadamu sebelum hal itu terjadi, supaya ketika hal itu terjadi, kamu percaya bahwa Akulah Dia.[a]
  revised_footnotes:
