base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: id
  text: Jika dunia membenci kalian, ketahuilah bahwa dunia telah membenci Aku sebelum membenci kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dunia telah lebih dahulu membenci Aku daripada membenci kalian.” Bahasa Yunani memakai “lebih dahulu” dengan “kalian” untuk menyatakan bahwa dunia membenci Aku sebelum membenci kalian.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: dunia
  rationale: Dalam Injil Yohanes kata ini kerap menunjuk kepada dunia manusia yang menentang Allah, tetapi 'dunia' mempertahankan keluasan dan ketegangan maknanya tanpa menambahkan tafsiran ke dalam teks.
- source_word: μισεῖ
  choice: membenci
  rationale: Bentuk kini paling alami diterjemahkan dengan verba kini sederhana dalam bahasa Indonesia dan menyatakan keadaan atau pola umum.
- source_word: γινώσκετε
  choice: ketahuilah
  rationale: Walaupun bentuk Yunaninya dapat dibaca sebagai indikatif atau imperatif, alur ujaran sesudah klausa bersyarat paling wajar mendukung seruan imperatif.
- source_word: μεμίσηκεν
  choice: telah membenci
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dan tetap relevan; 'telah membenci' mempertahankan nuansa itu.
- source_word: πρῶτον ὑμῶν
  choice: lebih dahulu daripada kalian
  rationale: Ungkapan ini menyatakan prioritas waktu. Pilihan tersebut alami dalam bahasa Indonesia dan mempertahankan perbandingan dengan para murid.
- source_word: ὑμᾶς / ὑμῶν
  choice: kalian
  rationale: Pronomina Yunani berbentuk jamak; 'kalian' menyampaikannya dengan jelas dalam bahasa Indonesia modern.
- source_word: ἐμέ
  choice: Aku
  rationale: Pronomina ini ditekankan dalam bahasa Yunani; kapitalisasi mengikuti konvensi bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
theological_decisions:
- issue: Makna κόσμος dalam teologi Yohanes
  choice: Mempertahankan 'dunia' tanpa parafrasa teologis
  alternative: '''tatanan dunia'' atau ''umat manusia yang memberontak terhadap Allah'''
  rationale: Konteks memberi warna negatif berupa permusuhan terhadap Yesus dan murid-murid-Nya, tetapi terjemahan yang diperluas akan mempersempit makna yang sengaja tetap luas dalam teks.
- issue: Ambiguitas modus γινώσκετε
  choice: 'Menerjemahkannya sebagai imperatif: ''ketahuilah'''
  alternative: 'Indikatif: ''kalian tahu'''
  rationale: Bentuknya secara morfologis ambigu, tetapi dalam hubungan dengan klausa 'Jika dunia membenci kalian' dan fungsi penghiburan/peringatan dalam wacana, imperatif paling alami.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk memperlihatkan bahwa sapaan kepada para murid berbentuk jamak. Susunan 'Aku lebih dahulu daripada kalian' agak padat tetapi mempertahankan penekanan pada Yesus dan hubungan temporal dalam bahasa Yunani; catatan kaki memberikan bentuk yang lebih eksplisit.
