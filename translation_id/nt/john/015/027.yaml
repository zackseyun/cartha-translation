  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: id
  text: Kalian juga bersaksi, karena kalian telah bersama-Ku sejak semula.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: Kamu juga
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan pada para murid, sedangkan rangkaian partikel menghubungkan kesaksian mereka dengan kesaksian Penolong dalam ayat sebelumnya. 'Kamu juga' menyampaikan hubungan dan penekanan itu secara alami.
- source_word: μαρτυρεῖτε
  choice: bersaksi
  rationale: Bentuk kini aktif orang kedua jamak ini menyatakan tindakan memberikan kesaksian. 'Bersaksi' alami dalam bahasa Indonesia modern dan mempertahankan nuansa kesaksian atau pembuktian.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini paling wajar memperkenalkan alasan para murid bersaksi, yakni kebersamaan mereka dengan Yesus sejak semula.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Ungkapan ini alami dan ringkas dalam bahasa Indonesia serta tetap membiarkan konteks menentukan awal yang dimaksud.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Menyatakan hubungan atau kebersamaan dengan Yesus secara langsung dan idiomatis.
- source_word: ἐστε
  choice: telah bersama
  rationale: Secara bentuk berarti 'kamu ada', tetapi bersama frasa 'sejak semula' keadaan itu berlangsung dari masa lampau sampai saat ujaran. 'Telah bersama' menyampaikan aspek berkelanjutan itu secara alami tanpa memerlukan catatan kaki.
theological_decisions:
- issue: Cakupan frasa ἀπ’ ἀρχῆς ('sejak semula')
  choice: Mempertahankan frasa 'sejak semula' tanpa menjelaskan titik awalnya dalam teks utama.
  alternative: Menafsirkan secara eksplisit sebagai 'sejak awal pelayanan-Ku' atau sebagai permulaan mutlak.
  rationale: Konteks menunjuk pada kebersamaan historis para murid dengan Yesus yang membuat mereka layak menjadi saksi, kemungkinan sejak awal pelayanan atau pemuridan mereka. Namun, teks tidak menyebut titik awal itu secara eksplisit, sehingga ambiguitasnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, ringkas, dan bermartabat. Bentuk 'kamu' sesuai dengan sapaan Yesus kepada para murid sebagai kelompok; kapitalisasi enklitik '-Ku' mengikuti kebiasaan umum penulisan rujukan kepada Allah/Yesus dalam Alkitab bahasa Indonesia.
