source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: id
  text: 'Namun, hal ini terjadi supaya firman yang tertulis dalam Hukum mereka digenapi: “Mereka membenci Aku tanpa alasan.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Namun, supaya firman yang tertulis dalam Hukum mereka digenapi.” Bahasa Yunani membiarkan klausa utamanya tersirat; “hal ini terjadi” ditambahkan berdasarkan konteks.'
    reason: lexical_alternative
  - marker: b
    text: “Hukum mereka” di sini memakai “Hukum” dalam arti luas yang dapat mencakup Kitab Suci Yahudi; kutipan ini berasal dari Mazmur (bdk. Mzm. 35:19; 69:5).
    reason: cross_reference
  - marker: c
    text: 'Atau: “tanpa sebab.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Konjungsi adversatif ini menghubungkan ayat dengan pernyataan sebelumnya. “Namun” menyatakan pertentangan secara wajar dalam bahasa Indonesia.
- source_word: ἵνα πληρωθῇ
  choice: supaya ... digenapi
  rationale: ἵνα dengan subjunktif pasif aoris dapat menyatakan tujuan atau hasil. Rumusan ini mempertahankan ambiguitas tersebut dan motif penggenapan dalam Injil Yohanes.
- source_word: ὁ λόγος
  choice: firman
  rationale: Di sini λόγος menunjuk pada perkataan tertentu dalam Kitab Suci, bukan gelar teologis “Firman” dalam prolog Yohanes. Huruf kecil membedakan pemakaian ini.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: yang tertulis dalam Hukum mereka
  rationale: Partisip perfek pasif menunjukkan sesuatu yang tetap tercatat. “Tertulis” merupakan ungkapan kutipan Kitab Suci yang alami; “mereka” mempertahankan bentuk eksplisit bahasa Yunani.
- source_word: νόμῳ
  choice: Hukum
  rationale: Terjemahan ini mempertahankan istilah Yunani νόμος. Dalam konteks Yohanes, istilah tersebut dapat dipakai secara luas untuk Kitab Suci Yahudi, termasuk Mazmur.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι memperkenalkan isi firman yang dikutip; tanda titik dua menjalankan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: Ἐμίσησάν με
  choice: Mereka membenci Aku
  rationale: Indikatif aoris diterjemahkan dengan bentuk lampau yang secara morfologis tidak perlu ditandai dalam bahasa Indonesia. Kapitalisasi “Aku” mengikuti kebiasaan Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: δωρεάν
  choice: tanpa alasan
  rationale: Dalam konteks ini δωρεάν berarti tanpa sebab atau alasan yang sah. Pilihan ini alami dan mempertahankan gagasan bahwa kebencian tersebut tidak beralasan.
theological_decisions:
- issue: Arti “Hukum mereka” ketika kutipan berasal dari Mazmur
  choice: Mempertahankan “Hukum” dalam teks utama dan menjelaskan bahwa cakupannya dapat meliputi Kitab Suci Yahudi secara lebih luas.
  alternative: Menerjemahkannya langsung sebagai “Kitab Suci mereka”.
  rationale: Bahasa Yunani secara eksplisit memakai νόμος. Mempertahankan “Hukum” menjaga bentuk sumber dan ketegangan tekstual, sedangkan catatan kaki mencegah pembaca membatasinya hanya pada Taurat.
- issue: Klausa utama yang eliptis setelah ἀλλ’
  choice: Menambahkan “hal ini terjadi” demi kalimat Indonesia yang utuh dan alami.
  alternative: Membiarkannya secara formal sebagai “Namun, supaya firman ... digenapi”.
  rationale: Teks Yunani bergantung pada konteks sebelumnya dan tidak menyatakan klausa utama secara eksplisit. Tambahan ini ditandai lewat catatan sebagai unsur yang dipasok dari konteks, bukan sebagai kandungan leksikal tersurat.
- issue: Nuansa tujuan atau hasil dalam ἵνα πληρωθῇ
  choice: Menggunakan “supaya ... digenapi” tanpa menjelaskan secara dogmatis hubungan sebab-akibatnya.
  alternative: Menggunakan “dengan demikian ... digenapi” untuk menonjolkan hasil.
  rationale: Konstruksi Yunani memungkinkan nuansa tujuan dan hasil. Terjemahan utama tidak seharusnya memaksakan satu penjelasan teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan melengkapi elipsis Yunani, sementara catatan kaki menyajikan bentuk yang lebih formal. Istilah “Hukum” dipertahankan untuk kesetiaan leksikal dan diterangkan agar tidak disalahpahami secara sempit.
