  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: id
  text: 'Tidak ada kasih yang lebih besar daripada ini: seseorang menyerahkan nyawanya demi sahabat-sahabatnya.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Nyawa'' menerjemahkan kata Yunani psychē, yang juga dapat berarti ''hidup'', ''jiwa'', atau ''diri''. Di sini maksudnya ialah hidup yang diserahkan sampai mati.'
    reason: lexical_alternative
  - marker: b
    text: '''Demi'' menerjemahkan kata Yunani hyper, yang juga dapat diterjemahkan ''untuk kepentingan'' atau ''bagi''.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: kasih yang lebih besar daripada ini
  rationale: Mempertahankan bentuk perbandingan dan acuan demonstratif yang menunjuk ke depan pada tindakan yang menjelaskan kasih tersebut.
- source_word: οὐδεὶς ἔχει
  choice: tidak ada ... yang
  rationale: Ungkapan eksistensial ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'tidak seorang pun memiliki', tanpa mengubah maknanya.
- source_word: ἵνα τις
  choice: seseorang
  rationale: ἵνα memperkenalkan isi yang menjelaskan 'ini', sedangkan τις adalah subjek tunggal tak tentu; tanda titik dua sudah menyampaikan hubungan penjelas itu secara alami.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: menyerahkan nyawanya
  rationale: Dalam konteks ini ψυχή berarti hidup yang diserahkan sampai mati. 'Menyerahkan nyawa' merupakan ungkapan Indonesia yang alami bagi tindakan pengorbanan diri.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: demi sahabat-sahabatnya
  rationale: '''Demi'' menyampaikan manfaat atau kepentingan pihak lain tanpa mempersempit ὑπέρ menjadi makna penggantian yang tidak wajib secara leksikal; bentuk jamak φίλων dipertahankan.'
theological_decisions:
- issue: Makna ψυχή dalam perkataan tentang pengorbanan diri
  choice: nyawa
  alternative: jiwa; hidup
  rationale: Konteksnya adalah penyerahan hidup hingga kematian, bukan penegasan dikotomi tubuh dan jiwa. 'Nyawa' menyatakan makna konkret itu dengan jelas.
- issue: Daya makna ὑπέρ dalam kaitan dengan kasih yang berkorban
  choice: demi
  alternative: untuk; bagi; menggantikan
  rationale: '''Demi'' mempertahankan makna benefaktif ''untuk kepentingan'' tanpa menetapkan secara berlebihan bahwa preposisi ini sendiri harus berarti penggantian.'
- issue: Subjek umum τις dan pronomina αὐτοῦ
  choice: seseorang ... -nya
  alternative: orang ... -nya
  rationale: Bentuk ini mempertahankan subjek tunggal tak tentu dan tidak memberi batasan gender yang tidak terdapat dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan dengan titik dua mempertahankan hubungan penjelas dari klausa kedua. 'Sahabat-sahabatnya' dipilih untuk menampilkan bentuk jamak sumber dengan jelas.
