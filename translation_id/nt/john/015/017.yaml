  text: These things I command you[b][a], so that you may love one another.
translation:
  language: id
  text: Hal-hal ini Kuperintahkan kepada kalian, supaya kalian saling mengasihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Hal-hal ini Kuperintahkan kepada kalian: kasihilah satu sama lain.” Klausa Yunani yang diawali ἵνα dapat dipahami sebagai menyatakan tujuan atau hampir sebagai isi perintah.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Kata tunjuk netral jamak ini dipertahankan sebagai bentuk jamak dan kemungkinan besar menunjuk pada hal-hal yang baru saja Yesus sampaikan.
- source_word: ἐντέλλομαι
  choice: Kuperintahkan
  rationale: Kata kerja ini menyatakan perintah atau instruksi yang berwibawa. Bahasa Indonesia tidak perlu menandai aspek kini dengan bentuk progresif; bentuk aktif ini alami dan tetap langsung.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Bentuk datif orang kedua jamak menyatakan penerima perintah. Dalam bahasa Indonesia, jumlah pada kata ganti orang kedua tidak harus dinyatakan secara eksplisit, dan konteks menunjukkan bahwa para murid disapa bersama-sama.
- source_word: ἵνα
  choice: supaya
  rationale: Kata penghubung ini secara alami menyatakan tujuan atau hasil yang dimaksudkan, tanpa menutup kemungkinan bahwa klausa tersebut mendekati penjelasan isi perintah.
- source_word: ἀγαπᾶτε
  choice: kamu ... mengasihi
  rationale: Subjungtif kini berada dalam klausa ἵνα. Dalam bahasa Indonesia, maksudnya disampaikan secara alami melalui 'supaya'; tidak ditambahkan unsur 'terus' karena bentuk Yunani tidak dengan sendirinya menuntut makna iteratif.
- source_word: ἀλλήλους
  choice: saling
  rationale: Kata ganti resiprokal ini menyatakan tindakan timbal balik di antara para murid; 'saling mengasihi' merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Hubungan antara perintah dan klausa ἵνα
  choice: 'Diterjemahkan sebagai tujuan: Yesus memerintahkan hal-hal ini supaya para murid saling mengasihi.'
  alternative: 'Klausa itu dapat dipahami hampir sebagai isi perintah: ''Hal-hal ini Kuperintahkan kepadamu: kasihilah satu sama lain.'''
  rationale: ἵνα paling wajar menyatakan tujuan atau hasil yang dimaksudkan, tetapi dalam gaya Yohanes dapat mendekati fungsi penjelas isi. Teks utama mempertahankan bentuk tujuan, sedangkan catatan kaki menjaga kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat 'Ku-' mempertahankan ujaran langsung Yesus secara ringkas. Susunan kalimat mengikuti penekanan Yunani pada 'hal-hal ini' tanpa mengorbankan kewajaran bahasa Indonesia.
