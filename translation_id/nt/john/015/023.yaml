id: JHN.15.23
reference: John 15:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: id
  text: Orang yang membenci Aku juga membenci Bapa-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Orang yang membenci
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk secara umum kepada orang yang dicirikan oleh tindakan itu. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan daya generik bentuk Yunani.
- source_word: ἐμὲ
  choice: Aku
  rationale: Pronomina ini adalah objek langsung yang merujuk kepada Yesus. Huruf kapital mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada pribadi ilahi.
- source_word: μισῶν / μισεῖ
  choice: membenci ... membenci
  rationale: μισέω berarti membenci. Pengulangan verba yang sama mempertahankan pengulangan leksikal teks Yunani, sedangkan bentuk Indonesia menyampaikan pernyataan umum yang berlaku kini.
- source_word: καὶ
  choice: juga
  rationale: Dalam hubungan ini καί menyatakan bahwa kebencian terhadap Bapa berlaku pula sebagai konsekuensi dari kebencian terhadap Yesus. 'Juga' menyampaikan kaitan tersebut secara alami tanpa menambah gagasan baru.
- source_word: τὸν πατέρα μου
  choice: Bapa-Ku
  rationale: πατήρ dengan μου secara alami diterjemahkan 'Bapa-Ku'. 'Bapa' menunjukkan Allah sebagai Bapa Yesus, dan bentuk posesif terikat '-Ku' mengikuti ejaan baku Indonesia.
theological_decisions:
- issue: Penggunaan huruf kapital untuk sebutan Bapa dan pronomina yang merujuk kepada Yesus
  choice: Aku ... Bapa-Ku
  alternative: aku ... bapaku
  rationale: Dalam konteks Injil Yohanes, 'Bapa' adalah sebutan relasional bagi Allah, dan 'Aku' merujuk kepada Yesus. Kapitalisasi membantu mengenali rujukannya sesuai konvensi Alkitab bahasa Indonesia, tanpa menambahkan penafsiran doktrinal pada isi ayat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, alami, dan bermartabat. Struktur paralel serta pengulangan 'membenci' dipertahankan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang perlu ditampilkan.
