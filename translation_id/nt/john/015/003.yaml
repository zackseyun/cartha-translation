  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: id
  text: Kalian sudah bersih karena firman yang telah Kusampaikan kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui firman yang telah Kusampaikan kepada kalian.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa frasa Yunani juga menonjolkan firman sebagai sarana pembersihan, bukan hanya sebab atau dasarnya.
lexical_decisions:
- source_word: ἤδη
  choice: sudah
  rationale: Menandai keadaan yang kini telah berlaku; dalam bahasa Indonesia, “sudah” secara alami menyampaikan nuansa ini.
- source_word: ὑμεῖς
  choice: kamu
  rationale: Pronomina ini jamak dan ditegaskan dalam bahasa Yunani. “Kamu” wajar dalam bahasa Indonesia dan dipahami sebagai jamak dari konteks para murid, tanpa tambahan yang kaku.
- source_word: καθαροί
  choice: bersih
  rationale: Mempertahankan kaitan leksikal dan metaforis dengan tindakan membersihkan dalam gambaran pokok anggur pada ayat sebelumnya; “murni” akan lebih abstrak.
- source_word: διὰ τὸν λόγον
  choice: karena firman
  rationale: διά dengan akusatif terutama menyatakan sebab atau dasar di sini. “Karena” merupakan ungkapan Indonesia yang alami, sementara kemungkinan nuansa sarana dicatat dalam catatan kaki.
- source_word: λόγον
  choice: firman
  rationale: Dalam konteks perkataan Yesus, “firman” mempertahankan diksi teologis Yohanes dan tetap merujuk pada pesan yang diucapkan, tanpa mempersempitnya menjadi sekadar ajaran.
- source_word: ὃν λελάληκα
  choice: yang telah Kusampaikan
  rationale: “Telah” mencerminkan tindakan lampau dengan hasil yang tetap berlaku dari bentuk perfektum λελάληκα. “Kusampaikan” terdengar alami untuk firman atau pesan, meski sedikit kurang harfiah daripada “Kuucapkan”.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Menerjemahkan objek tak langsung secara langsung. Bentuk “-mu” dapat merujuk kepada para murid secara kolektif dalam konteks ini.
theological_decisions:
- issue: Sifat kebersihan para murid
  choice: Pernyataan diterjemahkan sebagai keadaan “bersih” yang sudah berlaku, tanpa memasukkan kategori doktrinal teknis tertentu.
  alternative: Menafsirkannya secara khusus sebagai pembersihan sakramental atau sebagai pernyataan forensik pembenaran.
  rationale: Konteks langsung memakai gambaran pokok anggur dan pembersihan, sedangkan Yesus menghubungkan keadaan para murid dengan firman-Nya. Terjemahan mempertahankan metafora dan keterbukaan teologis teks.
- issue: Hubungan διὰ τὸν λόγον dengan keadaan bersih
  choice: “karena firman” sebagai ungkapan sebab atau dasar
  alternative: “melalui firman” sebagai ungkapan sarana
  rationale: διά dengan akusatif lazim menyatakan sebab, tetapi dalam konteks ini nuansa sarana juga mungkin dirasakan; karena itu alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Kamu” dipakai untuk sapaan kepada para murid dan kapitalisasi “Ku-” mengikuti kebiasaan penulisan rujukan ilahi. Penanda catatan kaki [a] dicantumkan dalam teks utama.
