  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: id
  text: Jika kalian tetap tinggal di dalam Aku dan perkataan-Ku tetap tinggal di dalam kalian, mintalah apa pun yang kalian kehendaki, dan hal itu akan terjadi bagi kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: tetap tinggal / tetap tinggal
  rationale: μένω menandakan keberlanjutan dalam relasi atau keberadaan. “Tetap tinggal” alami dalam bahasa Indonesia dan mempertahankan pengulangan verba Yunani pada kedua klausa.
- source_word: ἐν ἐμοὶ / ἐν ὑμῖν
  choice: di dalam Aku / di dalam kamu
  rationale: “Di dalam” mempertahankan metafora relasional dan bahasa persatuan khas Yohanes tanpa melemahkannya menjadi sekadar “bersama”.
- source_word: τὰ ῥήματά μου
  choice: perkataan-perkataan-Ku
  rationale: ῥήματα menunjuk pada ucapan atau perkataan Yesus. Bentuk jamak ini mempertahankan jumlah gramatikal sumber dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ὃ ἐὰν θέλητε
  choice: apa pun yang kamu kehendaki
  rationale: Konstruksi ini menyatakan objek kehendak yang terbuka. “Kehendaki” lebih bermartabat daripada “inginkan” tanpa menambahkan syarat yang tidak dinyatakan dalam ayat.
- source_word: αἰτήσασθε
  choice: mintalah
  rationale: Imperatif aoris ini menyampaikan perintah atau undangan untuk mengajukan permohonan; “mintalah” merupakan padanan langsung dan alami.
- source_word: γενήσεται ὑμῖν
  choice: hal itu akan terjadi bagimu
  rationale: γίνομαι secara langsung menyatakan bahwa sesuatu akan menjadi kenyataan atau terjadi. Terjemahan ini menghindari penambahan pelaku tersirat dalam bentuk “akan dilakukan” dan mempertahankan ungkapan ὑμῖν sebagai “bagimu”.
theological_decisions:
- issue: Struktur syarat dan janji mengenai permohonan
  choice: Janji bahwa permintaan akan terjadi tetap ditempatkan di bawah syarat bahwa para murid tinggal di dalam Yesus dan perkataan-Nya tinggal di dalam mereka.
  alternative: Merumuskan janji sebagai jaminan tanpa syarat atau menambahkan pembatas teologis yang tidak disebutkan dalam ayat ini.
  rationale: Klausa dengan ἐὰν secara eksplisit membingkai perintah dan janji berikutnya. Terjemahan mempertahankan hubungan sintaksis dan ketegangan teologis tersebut tanpa memperluas ataupun mempersempitnya.
- issue: Pelaku dalam γενήσεται ὑμῖν
  choice: “hal itu akan terjadi bagimu,” tanpa menyebut pelaku.
  alternative: “hal itu akan dilakukan bagimu,” yang dapat menyiratkan pelaku ilahi pasif.
  rationale: Bentuk Yunani adalah verba γίνομαι, bukan bentuk pasif dari “melakukan.” Pilihan ini mempertahankan keterbukaan gramatikal sumber dan tidak secara diam-diam menentukan pelakunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua jamak “kamu,” sesuai ὑμῖν dan konteks para murid. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Repetisi “tetap tinggal” sengaja dipertahankan karena merupakan unsur retoris dan teologis penting dalam teks Yohanes.
