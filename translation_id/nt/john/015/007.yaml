  rationale: Revisi menandai secara konsisten audiens jamak yang dinyatakan oleh ὑμεῖς/ὑμῖν dalam konstruksi Yunani, serta mengganti reduplikasi yang tidak idiomatis dengan nomina kolektif Indonesia yang alami. Tidak ada syarat tambahan, pelaku ilahi tersirat, atau penafsiran doktrinal yang dimasukkan.
