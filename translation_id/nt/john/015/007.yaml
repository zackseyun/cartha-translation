review_pass:
  verdict: revise
  source_fidelity: Struktur kondisional ἐὰν ... καί, pengulangan μένω, imperatif αἰτήσασθε, dan janji futurum γενήσεται dipertahankan dengan baik. Namun, "bagimu" memakai sufiks orang kedua tunggal, padahal ὑμῖν adalah jamak dan seluruh ujaran ditujukan kepada para murid secara jamak.
  naturalness: '"Perkataan-perkataan-Ku" dapat dipahami, tetapi reduplikasi ini terasa kaku dan tidak idiomatis dalam bahasa Indonesia modern. "Perkataan-Ku" secara wajar dapat berfungsi sebagai nomina kolektif tanpa mengurangi makna τὰ ῥήματά μου. Penggunaan "kalian" membuat bentuk jamak eksplisit dan konsisten.'
  terminology: '"Tetap tinggal di dalam" secara tepat mempertahankan metafora μένω ἐν. "Perkataan-Ku," "mintalah," dan "apa pun yang kalian kehendaki" merupakan padanan baku yang setia dan alami. "Akan terjadi bagi kalian" mempertahankan γενήσεται tanpa mengubahnya menjadi pasif ilahi tersirat.'
  issues:
  - severity: medium
    issue: Ketidakselarasan orang/jumlah pada "bagimu".
    rationale: Ὑμῖν adalah datif orang kedua jamak. Sementara "kamu" dapat dipakai secara jamak dalam pemakaian tertentu, sufiks -mu dalam "bagimu" lazimnya tunggal. "Bagi kalian" menyatakan jamak sumber dengan jelas.
  - severity: low
    issue: '"Perkataan-perkataan-Ku" kurang alami.'
    rationale: Walaupun τὰ ῥήματά μου berbentuk jamak, bahasa Indonesia lazim memakai "perkataan-Ku" secara kolektif. Reduplikasi tidak diperlukan untuk kesetiaan terhadap bentuk jamak Yunani dan membuat register lebih kaku.
  revised_text: Jika kalian tetap tinggal di dalam Aku dan perkataan-Ku tetap tinggal di dalam kalian, mintalah apa pun yang kalian kehendaki, dan hal itu akan terjadi bagi kalian.
