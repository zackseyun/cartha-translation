  verdict: approve
  source_fidelity: Setia pada teks Yunani. Kondisi tak-nyata εἰ ... ἦτε dengan hasil ἂν ... ἐφίλει tersampaikan melalui “Seandainya ... akan mengasihi.” Tiga kemunculan ἐκ τοῦ κόσμου dipertahankan secara memadai, dan “Aku telah memilih kalian dari dunia” menyampaikan aoris ἐξελεξάμην tanpa muatan doktrinal tambahan. Hubungan kausal διὰ τοῦτο serta bentuk kini μισεῖ juga diterjemahkan dengan tepat.
  naturalness: Bahasa Indonesia modern dan baku. “Kalian” tepat untuk bentuk jamak, dan susunan kalimatnya jelas serta bernada layak. “Miliknya sendiri” sedikit harfiah, tetapi tetap dapat dipahami dan dengan baik mempertahankan keluasan netral τὸ ἴδιον tanpa menambahkan “orang-orang.”
  terminology: “Dunia,” “mengasihi,” “membenci,” dan “memilih” konsisten dengan istilah penting ayat ini. Terjemahan tidak mempersempit κόσμος menjadi suatu tafsiran tertentu dan tidak memaksakan pembacaan denominasi atas ἐξελεξάμην.
