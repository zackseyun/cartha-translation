id: JHN.15.19
reference: John 15:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: id
  text: Seandainya kalian berasal dari dunia[a], dunia akan mengasihi miliknya sendiri. Namun, karena kalian tidak berasal dari dunia, melainkan Aku telah memilih kalian dari dunia, itulah sebabnya dunia membenci kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “termasuk dunia.” Ungkapan Yunani ἐκ τοῦ κόσμου dapat menyatakan asal atau keterikatan pada dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: berasal dari dunia / dari dunia
  rationale: Frasa ini muncul tiga kali. Pada dua kemunculan pertama, “berasal dari dunia” menyampaikan sumber sekaligus kemungkinan nuansa keterikatan; setelah kata kerja “memilih”, “dari dunia” lebih alami. Pengulangan unsur “dari dunia” tetap dipertahankan.
- source_word: κόσμος
  choice: dunia
  rationale: “Dunia” mempertahankan keluasan istilah khas Yohanes tanpa mempersempitnya menjadi “sistem dunia” atau memasukkan tafsiran moral-spiritual langsung ke dalam teks.
- source_word: ἂν ... ἐφίλει
  choice: akan mengasihi
  rationale: Bersama “Seandainya,” bentuk ini menyampaikan hasil dari kondisi yang berlawanan dengan kenyataan secara alami dalam bahasa Indonesia.
- source_word: τὸ ἴδιον
  choice: miliknya sendiri
  rationale: Ungkapan ini mempertahankan bentuk umum dari bahasa Yunani dan tidak menambahkan kata “orang-orang,” meskipun dalam konteks yang dimaksud mencakup mereka yang menjadi bagian dari dunia.
- source_word: φιλέω
  choice: mengasihi
  rationale: “Mengasihi” menyampaikan sikap kasih atau keberpihakan dan mempertahankan pertentangan langsung dengan μισέω, “membenci.”
- source_word: ἐξελεξάμην
  choice: telah memilih
  rationale: Pilihan ini menyatakan tindakan Yesus secara langsung tanpa menambahkan rumusan teologis mengenai pemilihan yang tidak dinyatakan oleh ayat ini.
- source_word: διὰ τοῦτο
  choice: itulah sebabnya
  rationale: Ungkapan ini mempertahankan hubungan sebab-akibat yang tegas dan merujuk kembali pada kenyataan bahwa Yesus telah memilih para murid dari dunia.
- source_word: μισεῖ
  choice: membenci
  rationale: Bentuk kini diterjemahkan dengan kala kini sederhana untuk menyampaikan sikap yang sedang berlaku dan mempertahankan ketajaman pertentangannya dengan “mengasihi.”
theological_decisions:
- issue: Makna “dunia” dalam konteks Yohanes
  choice: Mempertahankan “dunia” tanpa perluasan tafsiran dalam teks utama.
  alternative: “sistem dunia” atau “masyarakat manusia yang menentang Allah”
  rationale: Dalam ayat ini “dunia” berfungsi sebagai ranah yang berlawanan dengan Yesus dan para murid-Nya, tetapi istilah Yunani tetap memiliki keluasan makna yang sebaiknya tidak dipersempit dalam terjemahan.
- issue: Implikasi pemilihan dalam ἐξελεξάμην
  choice: Menerjemahkannya secara langsung sebagai “Aku telah memilih kalian dari dunia.”
  alternative: Memperkuatnya dengan istilah yang mengaitkannya pada suatu sistem doktrin predestinasi tertentu.
  rationale: Ayat ini menegaskan pilihan Yesus atas para murid, tetapi tidak menyelesaikan perdebatan teologis yang lebih luas. Terjemahan mempertahankan pernyataan tersebut tanpa penambahan denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam ayat ini jamak. “Seandainya” menandai kondisi yang berlawanan dengan kenyataan, sedangkan pengulangan “dunia” dan “dari dunia” mempertahankan pola retoris teks Yunani.
