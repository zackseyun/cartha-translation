base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: id
  text: 'Inilah perintah-Ku: hendaklah kalian saling mengasihi, sama seperti Aku telah mengasihi kalian[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Inilah perintah-Ku: supaya kalian saling mengasihi seperti Aku mengasihi kalian.”'
    reason: Alternatif ini mencerminkan kemungkinan menerjemahkan ἵνα dengan “supaya”, καθὼς dengan “seperti”, dan aoristus ἠγάπησα secara lebih sederhana sebagai “mengasihi” dalam bahasa Indonesia.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: Inilah perintah-Ku
  rationale: Bentuk ini secara alami memperkenalkan dan menegaskan perintah khusus yang berasal dari Yesus; sufiks -Ku mempertahankan kepemilikan sekaligus wibawa-Nya.
- source_word: ἵνα ἀγαπᾶτε
  choice: hendaklah kalian ... mengasihi
  rationale: ἵνα di sini menyatakan isi perintah. 'Hendaklah' menyampaikan daya perintah secara wajar dalam bahasa Indonesia, sedangkan bentuk kini ἀγαπᾶτε menunjuk pada pola tindakan yang terus dijalankan tanpa perlu diterjemahkan secara berlebihan.
- source_word: ἀλλήλους
  choice: saling
  rationale: '''Saling'' merupakan padanan timbal balik yang ringkas dan alami bagi ἀλλήλους.'
- source_word: καθὼς
  choice: sama seperti
  rationale: Ungkapan ini mempertahankan perbandingan yang menjadikan kasih Yesus sebagai pola bagi kasih para murid.
- source_word: ἠγάπησα ὑμᾶς
  choice: Aku telah mengasihi kalian
  rationale: Bentuk lampau aoristus menunjuk pada kasih Yesus yang telah dinyatakan kepada para murid. 'Telah mengasihi' menyampaikan tindakan terdahulu yang tetap relevan, sementara 'kalian' memperjelas bahwa ὑμᾶς berbentuk jamak.
theological_decisions:
- issue: Makna perintah untuk mengasihi
  choice: hendaklah kalian saling mengasihi
  alternative: supaya kalian saling mengasihi
  rationale: '''Hendaklah'' mempertahankan daya normatif perintah Yesus, sedangkan ''supaya'' dapat terdengar terutama sebagai tujuan. Terjemahan ini tidak menambahkan pengertian khusus tentang jenis kasih di luar kata sumber.'
- issue: Kasih Yesus sebagai pola dan ukuran
  choice: sama seperti Aku telah mengasihi kalian
  alternative: seperti Aku mengasihi kalian
  rationale: Terjemahan ini mempertahankan hubungan perbandingan καθὼς dan acuan lampau ἠγάπησα, tanpa menentukan secara sempit apakah yang dimaksud mencakup seluruh pelayanan Yesus atau secara khusus kematian-Nya yang akan datang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk memperjelas bentuk jamak ὑμᾶς; kapitalisasi pada -Ku dan Aku mengikuti kebiasaan penulisan rujukan ilahi dalam terjemahan Alkitab bahasa Indonesia. Tanda titik ditempatkan sesudah penanda catatan kaki.
