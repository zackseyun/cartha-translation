  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: id
  text: 'Dalam hal inilah Bapa-Ku dimuliakan: bahwa kalian menghasilkan banyak buah dan menjadi murid-murid-Ku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dalam hal inilah
  rationale: Mempertahankan penunjukan kata ganti yang dapat merujuk pada isi yang menyusul, tanpa mempersempitnya menjadi alat atau sebab semata.
- source_word: ἐδοξάσθη
  choice: dimuliakan
  rationale: Aoristus pasif diterjemahkan secara wajar dalam bahasa Indonesia; dalam konteks ini bentuk lampau Yunani dapat menyatakan pemuliaan yang terwujud melalui hasil yang disebutkan.
- source_word: καρπὸν πολὺν φέρητε
  choice: kalian menghasilkan banyak buah
  rationale: Ungkapan metaforis tentang berbuah dipertahankan, sementara verba dipilih agar alami dan jelas bagi pembaca modern.
- source_word: γένησθε
  choice: menjadi
  rationale: Menerjemahkan bentuk aoristus subjunktif sesuai makna dasarnya dan tidak menggantinya dengan varian tekstual 'menunjukkan diri sebagai'.
- source_word: μαθηταί
  choice: murid-murid
  rationale: Padanan lazim dan langsung untuk orang-orang yang belajar serta mengikuti Yesus.
theological_decisions:
- issue: Hubungan ἵνα dengan pemuliaan Bapa
  choice: bahwa
  alternative: supaya
  rationale: Dalam konstruksi ini ἵνα dapat menjelaskan isi atau cara Bapa dimuliakan, bukan hanya menyatakan tujuan. 'Bahwa' mempertahankan susunan penjelas yang juga tercermin dalam lapisan konsultasi.
- issue: Makna γένησθε ἐμοὶ μαθηταί
  choice: menjadi murid-murid-Ku
  alternative: membuktikan diri sebagai murid-murid-Ku
  rationale: Teks SBLGNT memakai γένησθε, sehingga terjemahan mengikuti makna 'menjadi' dan tidak memasukkan gagasan pembuktian yang berasal dari pembacaan atau varian lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' menyatakan orang kedua jamak secara jelas; kapitalisasi pada Bapa-Ku dan murid-murid-Ku mengikuti kebiasaan penghormatan dalam teks Alkitab Indonesia.
