id: JHN.15.15
reference: John 15:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: id
  text: Aku tidak lagi menyebut kamu budak[a], karena seorang budak tidak tahu apa yang dilakukan tuannya[b]. Namun, Aku telah menyebut kamu sahabat, karena segala sesuatu yang Kudengar dari Bapa-Ku sudah Kuberitahukan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba.” Kata Yunani doulos dapat berarti budak atau hamba; di sini “budak” menonjolkan status ketundukan yang dipertentangkan dengan persahabatan.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani kyrios juga dapat berarti “Tuhan,” tetapi di sini menunjuk kepada tuan dalam hubungan tuan-budak.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Mengungkapkan penyangkalan temporal dan perubahan dari keadaan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: λέγω ὑμᾶς
  choice: menyebut kamu
  rationale: Dalam konstruksi ini λέγω berarti menyebut atau menetapkan seseorang sebagai sesuatu, bukan sekadar berkata.
- source_word: δούλους / δοῦλος
  choice: budak / seorang budak
  rationale: Konteks mempertentangkan status bawahan yang tidak mengetahui urusan tuannya dengan kedekatan sahabat; 'budak' mempertahankan ketimpangan status yang terkandung dalam δοῦλος.
- source_word: οἶδεν τί ποιεῖ
  choice: tidak tahu apa yang sedang dilakukan
  rationale: οἶδα menyatakan pengetahuan, sedangkan bentuk kini ποιεῖ secara wajar dapat menggambarkan tindakan yang sedang berlangsung.
- source_word: αὐτοῦ ὁ κύριος
  choice: tuannya
  rationale: Dalam gambaran hubungan budak dan pemilik, κύριος berarti tuan, bukan gelar ilahi 'Tuhan'.
- source_word: εἴρηκα φίλους
  choice: telah menyebut kamu sahabat
  rationale: Bentuk perfek εἴρηκα menunjukkan penyebutan yang telah dilakukan dengan keadaan atau hasil yang tetap berlaku; 'telah' membantu menyampaikan nuansa itu tanpa membuat kalimat kaku.
- source_word: πάντα ἃ
  choice: segala sesuatu yang
  rationale: Padanan Indonesia yang alami dan menyeluruh bagi konstruksi relatif netral jamak ini.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: Kudengar dari Bapa-Ku
  rationale: ἀκούω berarti mendengar, dan παρά dengan genetif menunjukkan sumber.
- source_word: ἐγνώρισα ὑμῖν
  choice: sudah Kuberitahukan kepadamu
  rationale: γνωρίζω berarti membuat diketahui atau memberitahukan. Bentuk aoris menyajikan tindakan itu sebagai telah terlaksana; 'sudah' menyampaikannya secara alami tanpa mengubahnya menjadi bentuk perfek Yunani.
theological_decisions:
- issue: Pemaknaan δοῦλος dalam pertentangan status kemuridan
  choice: budak
  alternative: hamba; pelayan
  rationale: '''Budak'' mempertahankan ketundukan dan ketimpangan sosial yang menjadi dasar pertentangan dengan ''sahabat''. Catatan kaki menyediakan ''hamba'' sebagai padanan tradisional yang cakupannya lebih luas.'
- issue: Pemaknaan κύριος dalam gambaran rumah tangga
  choice: tuan
  alternative: Tuhan
  rationale: Di sini κύριος menunjuk kepada pihak yang berkuasa atas budak dalam analogi sosial, bukan digunakan sebagai gelar ilahi atau mesianik.
- issue: Aspek εἴρηκα dan ἐγνώρισα
  choice: telah menyebut ... sudah Kuberitahukan
  alternative: menyebut ... Kuberitahukan; menyebut ... telah Kuberitahukan
  rationale: 'Pembedaan ini mengikuti bentuk sumber: εἴρηκα adalah perfek dengan hasil yang tetap berlaku, sedangkan ἐγνώρισα adalah aoris. Bahasa Indonesia tidak menandai aspek dengan cara yang sama, sehingga ''telah'' dan ''sudah'' dipakai secara ringan dan alami.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ilahi ditulis dengan kapital sesuai kebiasaan penerbitan Alkitab Indonesia. 'Budak' dipertahankan karena konteks sosial ayat, sementara catatan kaki mengakui padanan tradisional 'hamba'.
