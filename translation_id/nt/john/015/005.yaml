id: JHN.15.5
reference: John 15:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: id
  text: Akulah pokok anggur; kamu adalah ranting-rantingnya. Orang yang tetap tinggal di dalam Aku[a], dan Aku di dalam dia[b], dialah yang berbuah banyak, sebab terpisah dari Aku kamu tidak dapat berbuat apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetap di dalam Aku.” Kata kerja Yunani juga dapat diterjemahkan “menetap” dan menekankan kelanjutan hubungan.
    reason: lexical_alternative
  - marker: b
    text: Kata ganti Yunani di sini berbentuk tunggal dan memiliki daya representatif; pernyataan ini berlaku bagi setiap murid yang tetap tinggal di dalam Yesus.
    reason: source_form_clarification
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyampaikan penegasan pada ἐγώ tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: ἄμπελος
  choice: pokok anggur
  rationale: Padanan baku dan mudah dipahami untuk tanaman anggur dalam metafora ini; lebih tepat daripada sekadar 'anggur', yang dapat menunjuk buah atau minuman.
- source_word: κλήματα
  choice: ranting-rantingnya
  rationale: Dalam konteks tanaman anggur, κλήματα menunjuk ranting atau cabang yang tumbuh dari pokok. 'Ranting-rantingnya' alami dan mempertahankan hubungan dengan pokok anggur.
- source_word: ὁ μένων
  choice: orang yang tetap tinggal
  rationale: Partisipel kini μένων menyiratkan keberlangsungan. 'Tetap tinggal' menyampaikan kelanjutan hubungan dengan bahasa Indonesia modern yang wajar.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: di dalam Aku ... di dalam dia
  rationale: Preposisi 'di dalam' mempertahankan bahasa timbal balik tentang keberadaan di dalam satu sama lain dan tidak melemahkannya menjadi sekadar 'bersama'.
- source_word: κἀγώ
  choice: dan Aku
  rationale: Mencerminkan crasis καὶ ἐγώ serta mempertahankan susunan timbal balik antara murid dan Yesus.
- source_word: οὗτος
  choice: dialah
  rationale: 'Bentuk ini mempertahankan daya tunjuk dan penegasan οὗτος: orang itulah yang berbuah banyak.'
- source_word: φέρει καρπὸν πολύν
  choice: berbuah banyak
  rationale: Ungkapan ini idiomatis dalam bahasa Indonesia dan mempertahankan metafora pokok anggur secara lebih alami daripada 'membawa banyak buah'.
- source_word: χωρὶς ἐμοῦ
  choice: terpisah dari Aku
  rationale: Pilihan ini menyampaikan keadaan berada di luar hubungan dengan Yesus, bukan hanya ketiadaan bantuan, sekaligus tetap dekat dengan makna χωρίς.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: kamu tidak dapat berbuat apa pun
  rationale: Mengungkapkan ketidakmampuan, bukan larangan, dan menerjemahkan konstruksi negatif Yunani secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa Yohanes tentang keberadaan timbal balik
  choice: Mempertahankan 'di dalam Aku, dan Aku di dalam dia'.
  alternative: bersama Aku, dan Aku bersama dia
  rationale: '''Di dalam'' paling dekat dengan ἐν dan menjaga kedalaman serta ketegangan teologis mengenai hubungan timbal balik antara Yesus dan murid tanpa menjelaskannya secara berlebihan.'
- issue: Cakupan mutlak οὐδέν
  choice: apa pun
  alternative: sesuatu yang berarti atau sesuatu yang baik
  rationale: Teks Yunani menyatakan 'apa pun' tanpa pembatas eksplisit. Terjemahan tidak menambahkan batasan teologis yang tidak dinyatakan dalam ayat.
- issue: Bentuk tunggal representatif αὐτῷ
  choice: dia
  alternative: mereka atau orang itu
  rationale: Kata ganti tunggal dipertahankan sesuai teks sumber. Dalam bahasa Indonesia, 'dia' tidak menandai gender dan dapat secara alami merujuk kepada siapa pun yang tetap tinggal di dalam Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Akulah' mempertahankan penegasan; 'pokok anggur' dan 'ranting-rantingnya' membuat metafora jelas bagi pembaca umum. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia, sedangkan 'dia' merujuk kepada murid.
