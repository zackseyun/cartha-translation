source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: id
  text: Ketika Penolong itu[a] datang, yang akan Kuutus kepadamu dari Bapa—Roh kebenaran, yang keluar dari Bapa[b]—Dialah yang akan bersaksi tentang Aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pembela,” “Penghibur,” “Penasihat,” atau “Parakletos”; kata Yunani παράκλητος menunjuk pada pribadi yang dipanggil untuk mendampingi, menolong, atau mewakili.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini juga dapat diterjemahkan “yang berproses dari Bapa.” Rumusan ini kemudian menjadi penting dalam pembahasan teologis tentang Tritunggal.
    reason: cross_reference
  - marker: c
    text: Atau “akan memberikan kesaksian tentang Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Ketika ... datang
  rationale: Konstruksi ὅταν dengan subjungtif menunjuk pada peristiwa mendatang yang diharapkan; bentuk ini alami dalam bahasa Indonesia dan tidak memberi kesan kejadian berulang.
- source_word: ὁ παράκλητος
  choice: Penolong
  rationale: παράκλητος mencakup pribadi yang mendampingi, menolong, mewakili, atau membela. 'Penolong' paling mudah dipahami dalam bahasa Indonesia modern, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: yang akan Kuutus kepadamu
  rationale: Mempertahankan bentuk futurum πέμψω dan ὑμῖν sebagai penerima. 'Kuutus' secara wajar menandai bahwa Yesus adalah pengutus.
- source_word: παρὰ τοῦ πατρός
  choice: dari Bapa
  rationale: παρά dengan genitif menyatakan asal dari atau dari hadapan Bapa; 'dari Bapa' ringkas dan setia pada ambiguitas relasional ungkapan itu.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roh kebenaran
  rationale: Mempertahankan konstruksi genitif khas Yohanes tanpa mempersempitnya menjadi hanya 'Roh yang benar' atau menafsirkannya sebagai identitas penuh.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: yang berasal dari Bapa
  rationale: '''Berasal dari'' menyampaikan gerak atau asal yang dinyatakan ἐκπορεύεται secara alami dalam bahasa Indonesia; catatan kaki memberikan padanan formal ''keluar dari'' dan menandai pentingnya rumusan tersebut tanpa memasukkan perkembangan doktrinal kemudian ke dalam teks.'
- source_word: ἐκεῖνος
  choice: Dialah
  rationale: Bentuk ini mempertahankan penekanan demonstratif ἐκεῖνος sekaligus menampilkan Roh secara personal, sesuai penyajian ayat.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: akan bersaksi tentang Aku
  rationale: '''Bersaksi'' mempertahankan nuansa kesaksian atau pembuktian dari μαρτυρέω dan terdengar alami dalam bahasa Indonesia modern.'
theological_decisions:
- issue: Padanan παράκλητος dalam konteks tentang Roh
  choice: Penolong
  alternative: Pembela; Penghibur; Penasihat; Parakletos
  rationale: Tidak ada satu padanan Indonesia yang mencakup seluruh rentang makna. 'Penolong' luas, personal, dan mudah dimengerti; alternatif penting dipertahankan dalam catatan kaki.
- issue: Penyebutan Roh secara personal
  choice: yang ... Dialah yang akan bersaksi
  alternative: yang ... itu akan bersaksi
  rationale: Walaupun πνεῦμα berjenis netral secara gramatikal, ἐκεῖνος berbentuk maskulin dan menekankan pribadi yang disebut sebagai παράκλητος. 'Dialah' menjaga penekanan dan sifat personal tanpa membuat klaim melampaui teks.
- issue: Penerjemahan ἐκπορεύεται
  choice: berasal dari Bapa
  alternative: keluar dari Bapa; berproses dari Bapa
  rationale: Pilihan utama menghindari istilah Indonesia yang kaku atau berpotensi disalahpahami, tetapi tetap menyatakan asal dari Bapa. Catatan kaki mempertahankan bentuk Yunani yang lebih harfiah dan signifikansi rumusannya tanpa menyelesaikan perdebatan teologis kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Tanda pisah mempertahankan aposisi 'Roh kebenaran' dan klausa penjelasnya tanpa mengaburkan struktur kalimat.
