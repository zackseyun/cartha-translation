id: JHN.15.4
reference: John 15:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: id
  text: Tinggallah di dalam Aku[a], dan Aku di dalam kalian. Sama seperti ranting tidak dapat menghasilkan buah dari dirinya sendiri jika tidak tinggal di dalam pokok anggur, demikian juga kalian tidak dapat menghasilkan buah jika tidak tinggal di dalam Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tetaplah di dalam Aku.” Kata Yunani μένω dapat berarti tinggal, tetap, atau terus berada; di sini kata itu menekankan hubungan yang berkelanjutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: tinggallah / tinggal
  rationale: Kata 'tinggal' secara alami mempertahankan pengulangan μένω serta gagasan menetap, berlanjut, dan bertahan dalam hubungan. Bentuk imperatif 'tinggallah' menyampaikan perintah tanpa mengubahnya menjadi sekadar ajakan.
- source_word: ἐν ἐμοί
  choice: di dalam Aku
  rationale: Mempertahankan ἐν dan gambaran persatuan atau partisipasi dengan Yesus, bukan sekadar kedekatan 'bersama Aku'.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: dan Aku di dalam kalian
  rationale: Klausa Yunani tidak menyatakan verba. Elipsis dipertahankan agar tidak menambahkan secara khusus 'akan tinggal' atau menjadikannya perintah kedua.
- source_word: τὸ κλῆμα
  choice: ranting
  rationale: Dalam metafora pokok anggur, κλῆμα menunjuk pada cabang atau ranting yang menghasilkan buah; 'ranting' merupakan padanan Indonesia yang lazim dan konkret.
- source_word: καρπὸν φέρειν
  choice: menghasilkan buah
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan metafora agraris tentang berbuah.
- source_word: ἀφ’ ἑαυτοῦ
  choice: dari dirinya sendiri
  rationale: Mempertahankan nuansa sumber atau kemampuan yang berasal dari ranting itu sendiri, bukan menambahkan gagasan lain.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: pada pokok anggur
  rationale: Bahasa Indonesia secara alami menempatkan ranting 'pada' pokok anggur; pilihan ini mempertahankan hubungan organik dalam metafora tanpa menambahkan kata 'melekat'.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: demikian juga kalian tidak dapat menghasilkan buah
  rationale: Kemampuan dan tindakan menghasilkan buah dipahami dari klausa sebelumnya. Pengulangannya membuat kalimat Indonesia lengkap dan jelas.
theological_decisions:
- issue: Makna μένω dalam konteks hubungan murid dengan Yesus
  choice: tinggal
  alternative: tetap
  rationale: '''Tinggal'' mempertahankan citra berdiam dan keberlangsungan relasi, sedangkan ''tetap'' lebih menonjolkan ketekunan tetapi melemahkan citra ruang dari ἐν.'
- issue: Elipsis dalam κἀγὼ ἐν ὑμῖν
  choice: dan Aku di dalam kalian
  alternative: dan Aku akan tinggal di dalam kalian
  rationale: Teks Yunani tidak memiliki verba eksplisit dalam klausa ini. Mempertahankan elipsis menjaga ambiguitas antara pernyataan, janji, dan gagasan timbal balik tanpa memaksakan penafsiran.
- issue: Implikasi verba pada οὕτως οὐδὲ ὑμεῖς
  choice: demikian juga kalian tidak dapat menghasilkan buah
  alternative: demikian juga kalian
  rationale: Klausa Yunani mengandalkan οὐ δύναται καρπὸν φέρειν dari perbandingan sebelumnya. Melengkapinya dalam bahasa Indonesia menyatakan implikasi gramatikal, bukan menambahkan ajaran baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk menampilkan bentuk Yunani ὑμεῖς secara jelas. Kapitalisasi 'Aku' mengikuti rujukan kepada Yesus. Gaya dijaga lugas, bermartabat, dan mempertahankan metafora pokok anggur serta elipsis Yunani.
