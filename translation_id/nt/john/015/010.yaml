  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: id
  text: Jika kamu menuruti perintah-perintah-Ku, kamu akan tetap tinggal dalam kasih-Ku, sama seperti Aku telah menuruti perintah-perintah Bapa-Ku dan tetap tinggal dalam kasih-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat dengan subjunktif; “jika” mempertahankan daya syarat tanpa menambahkan nuansa kebiasaan.
- source_word: ἐντολάς
  choice: perintah-perintah
  rationale: Menyatakan ketetapan yang berwibawa. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan bentuk jamak Yunani.
- source_word: τηρήσητε / τετήρηκα
  choice: menuruti / telah menuruti
  rationale: Dalam konteks perintah, τηρέω berarti memegang dan menjalankannya dengan setia. “Menuruti” alami dalam bahasa Indonesia, sementara “telah” pada τετήρηκα mencerminkan tindakan lampau yang tetap relevan dan mempertahankan kaitan leksikal kedua bentuk.
- source_word: μενεῖτε / μένω
  choice: akan tetap tinggal / tetap tinggal
  rationale: Mempertahankan pengulangan istilah khas Yohanes serta gagasan keberlangsungan dalam suatu lingkup relasional. “Tetap tinggal” lebih jelas daripada sekadar “tinggal” dan lebih wajar daripada “berdiam” dalam konteks ini.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: dalam kasih-Ku / dalam kasih-Nya
  rationale: Terjemahan ini mempertahankan gambaran kasih sebagai lingkup tempat seseorang tetap tinggal dan menjaga kesejajaran kedua klausa.
- source_word: καθὼς
  choice: sama seperti
  rationale: Menandai perbandingan yang jelas antara tindakan para murid dan teladan Yesus.
- source_word: τοῦ πατρός μου
  choice: Bapa-Ku
  rationale: Genitif kepemilikan diungkapkan secara alami; “Bapa” dipertahankan sebagai sebutan ilahi dalam konteks ini.
theological_decisions:
- issue: Hubungan antara ketaatan dan tetap tinggal dalam kasih Yesus
  choice: Pernyataan diterjemahkan sebagai hubungan bersyarat yang nyata tanpa penjelasan tambahan tentang jasa, keselamatan, atau ketekunan.
  alternative: Menafsirkan ketaatan sebagai cara memperoleh kasih ilahi, atau hanya sebagai bukti tanpa daya syarat yang nyata.
  rationale: Teks Yunani menyatakan syarat dan membandingkannya dengan ketaatan Yesus sendiri, tetapi tidak menyelesaikan perdebatan teologis yang lebih luas.
- issue: Makna ἀγάπη
  choice: kasih
  alternative: cinta
  rationale: “Kasih” merupakan padanan yang alami dan bermartabat dalam konteks relasi ilahi serta mempertahankan pengulangan istilah dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena tidak ada ambiguitas atau varian yang harus dijelaskan demi pembaca pada ayat ini.
