  source_fidelity: Terjemahan dengan tepat mempertahankan struktur bersyarat ἐὰν ... τηρήσητε, konsekuensi masa depan μενεῖτε, dan perbandingan καθὼς. Pengulangan τηρέω diterjemahkan konsisten sebagai “menuruti,” sedangkan μένω dipertahankan sebagai “tetap tinggal.” Bentuk perfektum τετήρηκα tercermin secara memadai dalam “telah menuruti,” dan μένω kala kini dalam klausa terakhir tetap dinyatakan sebagai “tetap tinggal.”
  naturalness: Bahasa Indonesia baku, jelas, dan bernada pantas untuk teks Alkitab. “Tetap tinggal dalam kasih-Ku” merupakan ungkapan yang dapat dipahami serta menjaga citra relasional dan pengulangan khas Yohanes. Kapitalisasi pronomina dan sebutan ilahi konsisten dengan kebiasaan penerbitan Alkitab Indonesia.
  terminology: “Perintah-perintah,” “kasih,” dan “Bapa-Ku” sesuai konteks serta register. “Menuruti” secara alami menyampaikan tindakan menjalankan perintah, tanpa menambahkan penafsiran teologis. Tidak ada istilah kunci yang memerlukan perubahan atau catatan kaki.
