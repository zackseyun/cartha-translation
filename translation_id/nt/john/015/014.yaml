  text: You are my friends if you do what I command you[a].
translation:
  language: id
  text: Kalian adalah sahabat-sahabat-Ku jika kalian melakukan apa yang Kuperintahkan kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Kalian adalah sahabat-sahabat-Ku jika kalian melakukan hal-hal yang Kuperintahkan kepada kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kalian
  rationale: Pronomina orang kedua jamak ini ditempatkan di awal untuk penekanan. 'Kalian' menyatakan jumlah jamak secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: φίλοι μού
  choice: sahabat-sahabat-Ku
  rationale: φίλοι menunjukkan relasi yang dekat, sehingga 'sahabat' lebih tepat daripada 'teman' dalam konteks ini. Bentuk ulang memperjelas bahwa nomina Yunani tersebut jamak, sedangkan '-Ku' menyatakan relasi kepunyaan.
- source_word: ἐστε
  choice: adalah
  rationale: Bentuk kini indikatif dari verba 'ada/menjadi' berfungsi sebagai kopula; 'adalah' memberi susunan yang jelas dan bermartabat.
- source_word: ἐὰν
  choice: jika
  rationale: Bersama bentuk subjungtif, kata ini memperkenalkan syarat. 'Jika' mempertahankan hubungan kondisional, bukan mengubahnya menjadi keterangan waktu.
- source_word: ποιῆτε
  choice: kalian melakukan
  rationale: Bentuk kini subjungtif ποιέω menyatakan pelaksanaan perintah. 'Melakukan' alami dan tidak melebihkan aspek menjadi 'terus melakukan'.
- source_word: ἃ
  choice: apa yang
  rationale: Pronomina relatif netral jamak ini merujuk pada isi perintah. 'Apa yang' merupakan padanan Indonesia yang alami; bentuk lebih harfiah ialah 'hal-hal yang'.
- source_word: ἐγὼ
  choice: Ku-
  rationale: Pronomina subjek eksplisit memberi penekanan pada Yesus sebagai pemberi perintah. Dalam bahasa Indonesia, bentuk aktif 'Kuperintahkan' mengungkapkan subjek orang pertama secara padat dan alami.
- source_word: ἐντέλλομαι
  choice: perintahkan
  rationale: Verba ini menyatakan pemberian perintah yang berwenang. 'Perintahkan' mempertahankan bobot otoritatifnya dan tidak melunakkannya menjadi sekadar 'ajarkan' atau 'anjurkan'.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Dativus jamak menandai penerima perintah. 'Kepada kalian' menyatakan relasi itu dengan jelas dalam idiom Indonesia.
theological_decisions:
- issue: Hubungan bersyarat antara persahabatan dengan Yesus dan ketaatan
  choice: Kalian adalah sahabat-sahabat-Ku jika kalian melakukan apa yang Kuperintahkan kepada kalian.
  alternative: Kalian adalah sahabat-sahabat-Ku ketika kalian melakukan apa yang Kuperintahkan kepada kalian.
  rationale: Konstruksi ἐὰν dengan subjungtif paling wajar menyatakan syarat. Terjemahan mempertahankan kaitan yang dinyatakan teks antara persahabatan dan ketaatan tanpa menjelaskan apakah kaitan itu menyangkut dasar, bukti, atau kelangsungan relasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian'. Nada dibuat langsung, alami, dan bermartabat. Kapitalisasi pada '-Ku' mengikuti konvensi penghormatan yang umum dalam terjemahan Alkitab Indonesia.
