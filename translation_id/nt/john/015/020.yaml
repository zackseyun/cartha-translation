id: JHN.15.20
reference: John 15:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: id
  text: 'Ingatlah perkataan yang telah Kukatakan kepadamu: ‘Seorang hamba tidak lebih besar daripada tuannya.’ Jika mereka telah menganiaya Aku, mereka juga akan menganiaya kamu; jika mereka telah menuruti perkataan-Ku[a], mereka juga akan menuruti perkataanmu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpegang pada perkataan-Ku.” Kata Yunani yang digunakan dapat mencakup menerima, menjaga, dan menaati perkataan Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Ingatlah
  rationale: Imperatif kini ini menyerukan agar para murid terus mengingat; ‘Ingatlah’ alami dan mempertahankan daya perintah.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: perkataan yang telah Kukatakan kepadamu
  rationale: λόγος di sini menunjuk pada ucapan tertentu yang sebelumnya disampaikan Yesus. ‘Perkataan’ lebih alami daripada ‘firman’ untuk pengantar kutipan ini, sedangkan ‘telah Kukatakan’ menyatakan tindakan lampau tanpa membuat aspek Yunani menjadi terlalu teknis.
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam bahasa Indonesia modern, ‘hamba’ membentuk pasangan yang wajar dengan ‘tuan’ dan menyatakan kedudukan bawahan dalam pepatah ini. Istilah ini juga menghindari penyempitan yang tidak perlu, sebab δοῦλος dapat diterjemahkan sebagai hamba atau budak menurut konteks.
- source_word: μείζων
  choice: lebih besar
  rationale: Mempertahankan perbandingan luas mengenai kedudukan atau keutamaan tanpa membatasinya menjadi hanya ‘lebih penting’ atau ‘lebih tinggi’.
- source_word: κυρίου
  choice: tuannya
  rationale: Dalam pasangan δοῦλος–κύριος, ‘tuan’ menyatakan hubungan kewenangan sosial dengan jelas dan tidak mengesankan bahwa κύριος di sini sedang dipakai sebagai gelar ilahi.
- source_word: ἐδίωξαν / διώξουσιν
  choice: telah menganiaya / akan menganiaya
  rationale: Dalam konteks permusuhan terhadap Yesus dan murid-murid-Nya, διώκω berarti menganiaya, bukan sekadar mengejar.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: telah menuruti / akan menuruti
  rationale: Dengan objek berupa perkataan, ‘menuruti’ secara alami mencakup menerima dan menaati ajaran. Makna harfiah ‘memelihara’ kurang idiomatis dalam bahasa Indonesia masa kini; alternatif ‘berpegang pada’ dicatat dalam catatan kaki.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: perkataan-Ku ... perkataanmu
  rationale: Mempertahankan kesejajaran antara perkataan Yesus dan pemberitaan para murid serta konsistensi dengan λόγος pada awal ayat.
theological_decisions:
- issue: Makna δοῦλος dalam perbandingan status
  choice: hamba
  alternative: budak
  rationale: Pokok pepatah adalah ketidaksetaraan kedudukan di bawah seorang κύριος. ‘Hamba ... tuan’ menyampaikan hubungan bawahan–atasan secara alami dan bermartabat dalam bahasa Indonesia, tanpa meniadakan latar sosial yang lebih keras dari kata Yunani.
- issue: Makna κύριος dalam hubungannya dengan δοῦλος
  choice: tuan
  alternative: Tuhan
  rationale: Konteks langsung adalah pepatah tentang hubungan hamba dan tuan, bukan pemakaian κύριος sebagai gelar kristologis.
- issue: Cakupan τηρέω terhadap perkataan Yesus
  choice: menuruti
  alternative: berpegang pada
  rationale: ‘Menuruti’ menonjolkan respons taat yang terkandung dalam pemakaian Yohanes, sedangkan catatan kaki mempertahankan kemungkinan nuansa menerima, menjaga, dan berpegang pada perkataan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sapaan jamak Yunani ὑμῖν/ὑμᾶς diterjemahkan ‘kamu’, yang dapat berfungsi jamak dalam bahasa Indonesia; kapitalisasi pronomina untuk Yesus mengikuti konvensi Alkitab Indonesia. Bentuk ‘perkataanmu’ sengaja tunggal secara gramatikal untuk mencerminkan τὸν ὑμέτερον, yakni perkataan atau pemberitaan para murid secara kolektif.
