  verdict: approve
  source_fidelity: Terjemahan dengan tepat mempertahankan imperatif μνημονεύετε, rujukan kepada ucapan Yesus yang telah disampaikan, pepatah perbandingan δοῦλος–κύριος, serta dua klausa bersyarat yang paralel. Bentuk "telah menganiaya" dan "telah menuruti" secara wajar mencerminkan aoris ἐδίωξαν dan ἐτήρησαν, sedangkan bentuk masa depan "akan" untuk διώξουσιν dan τηρήσουσιν dipertahankan. "Hamba ... tuannya" adalah padanan Indonesia yang sah dan idiomatis dalam bentuk pepatah ini, tanpa keliru menjadikan κύριος sebagai gelar ilahi.
  naturalness: Bahasa Indonesia baku, modern, dan lancar. "Ingatlah perkataan yang telah Kukatakan kepadamu" serta struktur paralel kedua pengandaian mudah dipahami. Pemakaian "kamu" untuk pendengar jamak juga lazim dalam bahasa Indonesia modern.
  terminology: '"Perkataan" mempertahankan keterkaitan λόγος di seluruh ayat; "menganiaya" tepat untuk διώκω dalam konteks ini; dan "menuruti perkataan" menyampaikan sisi ketaatan dari τηρέω dengan alami. Catatan kaki secara memadai mengingatkan bahwa cakupan τηρέω tidak terbatas pada ketaatan semata.'
