base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: id
  text: Hal-hal ini telah Kukatakan kepada kalian supaya sukacita-Ku ada di dalam kalian[b] dan sukacita kalian menjadi penuh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sukacita kalian menjadi sempurna.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sukacita-Ku ada di antara kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: Hal-hal ini
  rationale: Bentuk jamak demonstratif dipertahankan secara wajar dalam bahasa Indonesia dan menunjuk pada perkataan-perkataan Yesus dalam konteks sebelumnya.
- source_word: λελάληκα
  choice: telah Kukatakan
  rationale: Bentuk perfek Yunani menyatakan tindakan berbicara yang telah dilakukan dengan dampak yang tetap berlaku; 'telah Kukatakan' alami dan tepat dalam bahasa Indonesia.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Dativus orang kedua jamak diterjemahkan dengan bentuk Indonesia yang alami; jumlah jamak dipahami dari konteks para murid.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksudkan secara alami dalam bahasa Indonesia.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: sukacita-Ku
  rationale: Mempertahankan kepemilikan yang tegas tanpa menambahkan tafsiran tentang apakah sukacita itu diberikan oleh Yesus atau dibagikan bersama para murid.
- source_word: ἐν ὑμῖν
  choice: di dalam kamu
  rationale: Mempertahankan arti dasar ἐν dan kemungkinan makna batiniah; arti 'di antara kamu' tetap dicatat sebagai alternatif yang sah.
- source_word: ᾖ
  choice: ada
  rationale: Bentuk subjunktif setelah ἵνα terwakili oleh konstruksi tujuan 'supaya ... ada', yang alami dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan kedua unsur tujuan.
- source_word: ἡ χαρὰ ὑμῶν
  choice: sukacitamu
  rationale: Ungkapan posesif diterjemahkan secara ringkas dan idiomatis, sekaligus mempertahankan kontras dengan 'sukacita-Ku'.
- source_word: πληρωθῇ
  choice: menjadi penuh
  rationale: Mengungkapkan citra kepenuhan serta nuansa pasif tanpa memakai bentuk Indonesia yang kaku; 'menjadi sempurna' atau 'menjadi lengkap' juga mungkin secara leksikal.
theological_decisions:
- issue: Hakikat 'sukacita-Ku' dalam konteks Yohanes
  choice: sukacita-Ku
  alternative: sukacita yang Kuberikan; sukacita tentang Aku
  rationale: Teks Yunani hanya menyatakan 'sukacita-Ku'. Terjemahan tidak mempersempitnya menjadi sukacita yang Yesus berikan ataupun sukacita yang berobjekkan Yesus.
- issue: Lokasi atau lingkup sukacita Yesus
  choice: di dalam kamu
  alternative: di antara kamu
  rationale: ἐν ὑμῖν dapat menunjuk pada keberadaan di dalam para murid atau di tengah komunitas mereka. Teks utama mengikuti arti batiniah yang paling langsung, sedangkan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti gaya umum teks Alkitab Indonesia. Susunan kalimat mempertahankan dua klausa tujuan dan kesejajaran antara sukacita Yesus dan sukacita para murid.
