  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: id
  text: Setiap ranting di dalam Aku yang tidak menghasilkan buah[a] dibuang-Nya, dan setiap ranting yang menghasilkan buah dipangkas-Nya[b] supaya menghasilkan lebih banyak buah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “diambil-Nya”; sebagian orang memahami kata Yunaninya sebagai “diangkat-Nya.”'
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “dipangkas” juga dapat berarti “dibersihkan”; ungkapan ini sesuai dengan gambaran kebun anggur dan mengantisipasi kata “bersih” dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: setiap ranting
  rationale: πᾶν dengan nomina tunggal bersifat distributif. Dalam gambaran pokok anggur, 'ranting' merupakan padanan alami bagi κλῆμα.
- source_word: ἐν ἐμοὶ
  choice: pada-Ku
  rationale: '''Pada-Ku'' mempertahankan ungkapan relasional khas Yohanes secara ringkas dan alami tanpa memperluasnya menjadi ''terhubung dengan-Ku'' atau ''tinggal di dalam Aku''.'
- source_word: μὴ φέρον καρπὸν
  choice: yang tidak menghasilkan buah
  rationale: Klausa relatif ini menyampaikan partisipel Yunani dengan jelas serta mempertahankan gagasan menghasilkan buah.
- source_word: αἴρει αὐτό
  choice: dibuang-Nya
  rationale: Dalam pertentangan dengan pemangkasan ranting yang berbuah, αἴρει paling wajar berarti menyingkirkan atau membuang. Bentuk pasif berpelaku '-Nya' alami dalam bahasa Indonesia dan tetap menunjukkan bahwa Bapa, pengusaha kebun anggur, adalah pelakunya.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: dan setiap ranting yang menghasilkan buah
  rationale: Kata 'ranting' perlu diulang karena konstruksi artikel dan partisipel Yunani merujuk kembali kepada κλῆμα.
- source_word: καθαίρει αὐτό
  choice: dipangkas-Nya
  rationale: Dalam konteks kebun anggur, 'memangkas' menyampaikan tindakan hortikultural secara jelas. Makna terkait 'membersihkan' dicatat dalam catatan kaki karena mengantisipasi καθαροί pada ayat berikutnya.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: supaya menghasilkan lebih banyak buah
  rationale: ἵνα menyatakan tujuan, sedangkan πλείονα adalah bentuk komparatif; terjemahan ini alami dan tepat.
theological_decisions:
- issue: Makna αἴρει pada klausa pertama
  choice: dibuang-Nya
  alternative: diambil-Nya; diangkat-Nya
  rationale: Konteks langsung membedakan perlakuan terhadap ranting yang tidak berbuah dari pemangkasan ranting yang berbuah, sehingga makna menyingkirkan paling sesuai. Catatan kaki mempertahankan kemungkinan leksikal lain tanpa menjadikan ayat ini penetapan tentang kemurtadan atau ketekunan orang percaya.
- issue: Makna καθαίρει
  choice: dipangkas-Nya
  alternative: dibersihkan-Nya
  rationale: Makna pemangkasan paling sesuai dengan metafora kebun anggur, tetapi hubungan katanya dengan bahasa 'bersih' dalam ayat 3 tetap penting dan dicatat agar permainan makna Yohanes tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan, dengan bentuk '-Nya' yang alami untuk menandai tindakan Bapa. Istilah pertanian dibuat mudah dipahami tanpa menghilangkan ambiguitas leksikal yang nyata.
