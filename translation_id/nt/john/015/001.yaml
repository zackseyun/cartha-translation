  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: id
  text: Akulah pokok anggur yang sejati, dan Bapa-Ku adalah penggarap kebun anggur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “petani.” Kata Yunani γεωργός berarti orang yang mengolah atau mengusahakan tanah; dalam gambaran tentang pokok anggur, kata ini dapat merujuk khusus kepada penggarap kebun anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penegasan pada ἐγώ dalam pernyataan identitas Yesus.
- source_word: ἄμπελος
  choice: pokok anggur
  rationale: Padanan Indonesia yang lazim dan jelas untuk tanaman anggur, sekaligus mempertahankan gambaran metaforisnya.
- source_word: ἀληθινή
  choice: yang sejati
  rationale: Kata 'sejati' mencakup nuansa benar, autentik, dan penuh dalam pemakaian khas Yohanes tanpa menjelaskan metafora secara berlebihan.
- source_word: ὁ πατήρ μου
  choice: Bapa-Ku
  rationale: Sapaan ini merujuk kepada Allah dalam relasi-Nya dengan Yesus; kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk sebutan ilahi.
- source_word: ὁ γεωργός
  choice: pengusahanya
  rationale: Dalam konteks pokok anggur, kata ini menunjuk kepada orang yang mengusahakan dan merawat tanaman tersebut. Bentuk ini cukup alami serta lebih tepat secara kontekstual daripada istilah umum seperti 'petani'.
theological_decisions:
- issue: Identifikasi metaforis dalam perkataan 'Akulah'
  choice: 'Mempertahankan metafora secara langsung: ''Akulah pokok anggur yang sejati''.'
  alternative: Akulah pokok anggur yang sesungguhnya.
  rationale: Terjemahan langsung menjaga gambaran dan resonansi teologis khas Yohanes tanpa menambahkan penafsiran simbolis.
- issue: Peran Bapa sebagai ὁ γεωργός
  choice: pengusahanya
  alternative: penggarap kebun anggur; petani; perawat pokok anggur
  rationale: Pilihan ini menyatakan peran aktif Bapa dalam mengusahakan pokok anggur, tetapi tidak mempersempit makna menjadi satu kegiatan tertentu atau memasukkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Akulah' mempertahankan tekanan ungkapan sumber; 'pokok anggur' merupakan istilah yang mudah dipahami dan mapan dalam konteks Alkitab. Pronomina '-nya' mengacu kepada pokok anggur.
