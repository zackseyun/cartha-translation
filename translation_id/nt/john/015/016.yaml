id: JHN.15.16
reference: John 15:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: id
  text: Bukan kamu yang memilih Aku,[a] melainkan Akulah yang memilih kamu dan menetapkan kamu supaya kamu pergi dan menghasilkan buah, dan supaya buahmu tetap ada,[b] supaya Bapa memberikan kepadamu apa pun yang kamu minta kepada-Nya dalam nama-Ku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyeleksi.” Kata ini juga dapat diterjemahkan “memilih” dalam arti teknis “memilih sebagai umat pilihan,” tetapi “memilih” paling sesuai dengan konteks langsung tanpa memasukkan istilah doktrinal teknis ke dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Atau “bertahan.” Kata Yunani ini sering dipakai Yohanes dengan arti tinggal, tetap, atau terus berada; di sini “tetap ada” menyatakan bahwa buah itu berkelanjutan.
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani berbunyi “Bapa,” bukan “Bapa-Ku.”
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: memilih / memilih
  rationale: Kata kerja ἐκλέγομαι berarti memilih atau menyeleksi. “Memilih” paling alami dalam bahasa Indonesia dan mempertahankan kontras relasional tanpa memasukkan istilah teologis teknis ke dalam teks utama.
- source_word: ἔθηκα
  choice: menetapkan
  rationale: τίθημι secara harfiah dapat berarti menaruh atau menempatkan, tetapi dalam konteks penugasan kepada suatu tujuan, “menetapkan” menyampaikan tindakan yang disengaja tanpa mempersempitnya menjadi penahbisan jabatan.
- source_word: ἵνα
  choice: supaya / sehingga
  rationale: Dua klausa ἵνα menyatakan tujuan atau hasil. “Supaya” jelas menyatakan tujuan penetapan, sedangkan “sehingga” pada klausa terakhir mempertahankan kaitan tujuan/hasil dengan rangkaian sebelumnya secara alami.
- source_word: ὑπάγητε
  choice: pergi
  rationale: ὑπάγω dapat berarti pergi, berangkat, atau pergi meninggalkan suatu tempat. “Pergi” cukup luas untuk mempertahankan kemungkinan nuansa kegiatan atau pengutusan.
- source_word: καρπὸν φέρητε
  choice: menghasilkan buah
  rationale: Ungkapan ini mempertahankan metafora Yohanes dalam bahasa Indonesia modern. “Menghasilkan buah” lebih alami daripada terjemahan harfiah “membawa buah”.
- source_word: μένῃ
  choice: tetap ada
  rationale: μένω dapat berarti tinggal, tetap, atau bertahan. Dalam hubungan dengan buah, “tetap ada” mudah dipahami serta mempertahankan gagasan keberlangsungan tanpa menentukan apakah tekanannya relasional atau temporal.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: apa pun yang kamu minta
  rationale: Gabungan relatif dengan ἄν menyatakan cakupan tak tentu, yaitu “apa pun”; “minta” sesuai dengan konteks doa.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Terjemahan baku ini mempertahankan daya teologis dan relasional ungkapan tersebut tanpa menafsirkannya secara berlebihan sebagai sekadar formula atau dasar permintaan.
- source_word: δῷ
  choice: Ia memberikannya
  rationale: Subjungtif aoris berada di bawah ἵνα dan menyatakan tujuan/hasil. Struktur Indonesia dengan “sehingga ... Ia memberikannya” menyampaikan hubungan itu secara alami tanpa mengubahnya menjadi janji masa depan yang berdiri sendiri.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Teks Yunani berbunyi “Bapa,” bukan “Bapa-Ku.” Bentuk ini dipertahankan dan diperjelas melalui catatan kaki.
theological_decisions:
- issue: Kemungkinan pembacaan doktrinal teknis atas ἐξελεξάμην
  choice: “Akulah yang memilih kamu” dalam konteks langsung kemuridan dan pengutusan
  alternative: “Akulah yang memilih/menyeleksi kamu” dengan istilah teknis yang menonjolkan doktrin pemilihan
  rationale: Ayat ini menegaskan prakarsa Yesus, tetapi kata Yunaninya sendiri tidak mengharuskan istilah teologis teknis. Terjemahan mempertahankan pernyataan itu tanpa memaksakan sistem teologi tertentu.
- issue: Makna ἔθηκα ὑμᾶς
  choice: Dipahami sebagai penetapan atau penugasan untuk pergi dan menghasilkan buah
  alternative: Diterjemahkan secara harfiah “menempatkan kamu” atau dipersempit menjadi penahbisan kepada jabatan gerejawi
  rationale: Konteks menyebut tujuan penetapan itu secara langsung. “Menetapkan” menyampaikan maksud dan penugasan tanpa membatasi cakupannya pada suatu jabatan.
- issue: Daya klausa ἵνα terakhir
  choice: Dipertahankan sebagai hubungan tujuan/hasil melalui “sehingga ... Ia memberikannya”
  alternative: 'Dijadikan janji masa depan langsung: “Ia akan memberikannya”'
  rationale: Sintaksis Yunani menghubungkan permintaan kepada Bapa dengan penetapan dan keberbuahan melalui ἵνα. Terjemahan ini tidak meratakannya menjadi formula janji yang terlepas dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan sapaan tunggal “kamu” sesuai konteks Yesus berbicara kepada para murid sebagai kelompok. Bentuk penegas “Akulah” mencerminkan kontras eksplisit οὐχ ὑμεῖς ... ἀλλ’ ἐγώ. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
