  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: id
  text: Seandainya Aku tidak melakukan di antara mereka pekerjaan yang tidak dilakukan oleh siapa pun yang lain, mereka tidak akan mempunyai dosa[a]. Namun sekarang mereka telah melihat dan membenci baik Aku maupun Bapa-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka tidak akan bersalah karena dosa.” Secara lebih harfiah, bahasa Yunani berbunyi “mereka tidak akan mempunyai dosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: pekerjaan-pekerjaan
  rationale: Mempertahankan istilah Yohanes bagi tindakan-tindakan Yesus yang menyatakan identitas dan misi-Nya; bentuk jamak mencerminkan teks Yunani.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: Aku melakukan di antara mereka
  rationale: 'ἐν αὐτοῖς dipahami secara lokatif-sosial: Yesus melakukan pekerjaan itu di tengah mereka atau dalam kehadiran mereka, bukan di dalam diri mereka.'
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: yang tidak pernah dilakukan oleh siapa pun yang lain
  rationale: Mengungkapkan keunikan pekerjaan Yesus secara alami dalam bahasa Indonesia; 'tidak pernah' menyampaikan bahwa tidak ada orang lain yang telah melakukan pekerjaan semacam itu.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: mereka tidak akan mempunyai dosa
  rationale: Mempertahankan ungkapan khas Yohanes 'mempunyai dosa' dan tidak mempersempitnya menjadi sekadar perasaan bersalah atau pertanggungjawaban.
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Menandai pertentangan antara keadaan yang diandaikan dan kenyataan yang sedang berlaku.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: mereka telah melihat dan membenci
  rationale: Bentuk perfektum menyatakan tindakan yang telah terjadi dengan akibat yang tetap berlaku; kedua verba dipertahankan sejajar tanpa pengulangan yang janggal.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: Aku maupun Bapa-Ku
  rationale: Konstruksi korelatif menekankan kedua objek bersama-sama tanpa menambahkan unsur yang tidak terdapat dalam teks.
theological_decisions:
- issue: Arti 'mereka tidak akan mempunyai dosa' dalam kaitannya dengan kesalahan dan tanggung jawab
  choice: Mempertahankan ungkapan Yohanes 'mempunyai dosa'.
  alternative: mereka tidak akan bersalah karena dosa
  rationale: Konteks menunjukkan kesalahan yang semakin nyata setelah penyataan melalui pekerjaan Yesus, tetapi terjemahan utama mempertahankan ketegangan dan keluasan ungkapan Yunani.
- issue: Objek bersama dari 'melihat' dan 'membenci'
  choice: 'Menerjemahkan susunan Yunani secara langsung: ''melihat dan membenci Aku maupun Bapa-Ku''.'
  alternative: mereka telah melihat pekerjaan-pekerjaan itu, tetapi membenci Aku maupun Bapa-Ku
  rationale: Teks Yunani secara gramatikal mengaitkan 'Aku maupun Bapa-Ku' dengan kedua verba. Alternatif tersebut mungkin terasa lebih mudah secara konseptual, tetapi menambahkan objek yang tidak dinyatakan dan menghilangkan ketegangan teologis tentang melihat Bapa dalam Yesus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus serta bentuk 'Bapa-Ku' dipakai sesuai kebiasaan penulisan Alkitab bahasa Indonesia. Struktur pengandaian kontrafaktual disampaikan dengan 'Seandainya ... tidak akan'.
