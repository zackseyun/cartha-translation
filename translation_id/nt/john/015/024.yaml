review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan untuk dua nuansa. Frasa «tidak pernah dilakukan» menambahkan cakupan temporal yang tidak dinyatakan oleh aoris Yunani; «tidak dilakukan oleh siapa pun yang lain» menyampaikan keunikan tanpa tambahan itu. Selain itu, «Aku maupun Bapa-Ku» tanpa pasangan «baik» kurang idiomatis untuk korelasi afirmatif καὶ ... καὶ.
  naturalness: «Pekerjaan yang» lebih wajar daripada reduplikasi «pekerjaan-pekerjaan» dalam konteks ini, sedangkan «baik Aku maupun Bapa-Ku» adalah bentuk modern yang jelas dan alami.
  terminology: «Pekerjaan», «mempunyai dosa», dan «Bapa-Ku» mempertahankan istilah serta ketegangan Yohanes tanpa mempersempit «mempunyai dosa» menjadi rumusan doktrinal tentang rasa bersalah atau akuntabilitas.
  issues:
  - severity: medium
    issue: «yang tidak pernah dilakukan oleh siapa pun yang lain»
    rationale: «Tidak pernah» memperluas aorist ἐποίησεν menjadi klaim eksplisit tentang seluruh rentang waktu. Teks hanya menyatakan bahwa tidak seorang lain melakukan karya-karya itu.
  - severity: medium
    issue: «Aku maupun Bapa-Ku»
    rationale: Untuk fungsi korelatif afirmatif dari καὶ ἐμέ καὶ τὸν πατέρα μου, bahasa Indonesia baku memerlukan «baik ... maupun ...». Bentuk draft dapat terdengar tidak lengkap atau kurang tegas.
  revised_text: Seandainya Aku tidak melakukan di antara mereka pekerjaan yang tidak dilakukan oleh siapa pun yang lain, mereka tidak akan mempunyai dosa[a]. Namun sekarang mereka telah melihat dan membenci baik Aku maupun Bapa-Ku.
