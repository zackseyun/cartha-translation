revisions:
- from: Seandainya Aku tidak melakukan di antara mereka pekerjaan-pekerjaan yang tidak pernah dilakukan oleh siapa pun yang lain, mereka tidak akan mempunyai dosa[a]. Namun sekarang mereka telah melihat dan membenci Aku maupun Bapa-Ku.
  to: Seandainya Aku tidak melakukan di antara mereka pekerjaan yang tidak dilakukan oleh siapa pun yang lain, mereka tidak akan mempunyai dosa[a]. Namun sekarang mereka telah melihat dan membenci baik Aku maupun Bapa-Ku.
  rationale: Revisi menghilangkan tambahan makna temporal pada «tidak pernah», memakai bentuk Indonesia yang lebih alami untuk nomina jamak generik, dan memulihkan korelasi afirmatif yang eksplisit pada kedua objek. Ungkapan Yohanes «mempunyai dosa» serta jangkar catatan kaki tetap dipertahankan.
