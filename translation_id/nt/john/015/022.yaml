base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: id
  text: Sekiranya Aku tidak datang dan berbicara kepada mereka, mereka tidak akan mempunyai dosa.[a] Namun sekarang, mereka tidak mempunyai dalih atas dosa mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka tidak akan bersalah karena dosa” atau “mereka tidak akan menanggung kesalahan.” Secara lebih harfiah, teks Yunani berbunyi “mereka tidak akan mempunyai dosa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka tidak mempunyai alasan mengenai dosa mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Sekiranya Aku tidak datang dan berbicara kepada mereka
  rationale: Bentuk “sekiranya ... tidak” menyampaikan kondisi lampau yang bertentangan dengan kenyataan secara wajar dalam bahasa Indonesia; “berbicara kepada mereka” mencerminkan ἐλάλησα αὐτοῖς.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: mereka tidak akan mempunyai dosa
  rationale: Mempertahankan ungkapan Yohanes yang harfiah, “mempunyai dosa,” serta daya kondisionalnya, tanpa langsung menafsirkannya sebagai tidak bersalah.
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Menyatakan pertentangan tegas antara keadaan yang diandaikan dan kenyataan saat ini.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: mereka tidak mempunyai alasan untuk membenarkan
  rationale: πρόφασις dapat berarti alasan atau dalih. Dalam konteks ini, frasa tersebut menunjuk pada alasan yang diajukan sebagai pembenaran; rumusan ini alami dan memperjelas fungsi kata itu tanpa menghilangkan nuansa negatifnya.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: dosa mereka
  rationale: Dengan konstruksi idiomatis “alasan untuk membenarkan dosa mereka,” περί dengan genitif dinyatakan sebagai hal yang hendak mereka beri alasan atau pembenaran.
theological_decisions:
- issue: Apakah “mereka tidak akan mempunyai dosa” berarti sama sekali tanpa dosa atau tidak bersalah sehubungan dengan penolakan terhadap pewahyuan Yesus
  choice: Mempertahankan bentuk “mempunyai dosa” dalam teks utama
  alternative: mereka tidak akan bersalah karena dosa
  rationale: Konteks menunjuk pada tanggung jawab karena menolak Yesus setelah Ia datang dan berbicara, tetapi teks Yunani secara harfiah mengatakan “mempunyai dosa.” Terjemahan utama mempertahankan ketegangan teologis itu, sedangkan kemungkinan makna kesalahan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “Aku” mengikuti ucapan Yesus. Ungkapan “mempunyai dosa” sengaja dipertahankan karena penting bagi gaya dan ketegangan teologis Yohanes; catatan kaki menyediakan penjelasan idiomatis.
