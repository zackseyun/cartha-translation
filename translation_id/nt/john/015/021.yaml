  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: id
  text: Namun, mereka akan melakukan semua hal ini kepada kamu[a] karena nama-Ku, sebab mereka tidak mengenal Dia yang mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melawan kamu.” Frasa Yunani ini dapat menunjuk pada tindakan yang diarahkan kepada para murid; dalam konteks ini tindakan itu bersifat memusuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan yang kuat dengan pernyataan sebelumnya dan tetap alami dalam bahasa Indonesia modern.
- source_word: ταῦτα πάντα
  choice: semua hal ini
  rationale: Mempertahankan unsur penunjuk ταῦτα dan cakupan menyeluruh πάντα.
- source_word: ποιήσουσιν
  choice: akan melakukan
  rationale: Menerjemahkan bentuk indikatif aktif futur secara langsung tanpa mempersempit tindakan yang dimaksud.
- source_word: εἰς ὑμᾶς
  choice: terhadap kamu
  rationale: Menyatakan tindakan yang diarahkan kepada para murid dan secara alami dapat memuat nuansa permusuhan tanpa menentukannya secara berlebihan.
- source_word: διὰ τὸ ὄνομά μου
  choice: karena nama-Ku
  rationale: διά dengan akusatif menyatakan sebab; 'nama' dipertahankan karena mewakili pribadi, identitas, dan kewibawaan Yesus.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan yang menjelaskan perlakuan tersebut dengan hubungan kausal yang jelas.
- source_word: οὐκ οἴδασιν
  choice: tidak mengenal
  rationale: Dalam konteks Yohanes, οἶδα dapat menunjuk pada pengenalan relasional, bukan sekadar pengetahuan informasi.
- source_word: τὸν πέμψαντά με
  choice: Dia yang mengutus Aku
  rationale: Menerjemahkan partisip berartikel sebagai ungkapan substantif yang alami tanpa menambahkan sebutan 'Bapa' yang tidak tertulis eksplisit.
theological_decisions:
- issue: Rujukan 'Dia yang mengutus Aku'
  choice: Rujukan implisit kepada Bapa dipertahankan sebagai 'Dia yang mengutus Aku'.
  alternative: Bapa yang mengutus Aku
  rationale: Konteks Yohanes memperjelas rujukannya, tetapi teks Yunani memakai partisip berartikel dan tidak menyebut kata 'Bapa'; terjemahan tidak menambahkan gelar tersebut.
- issue: Makna 'nama-Ku'
  choice: Ungkapan 'nama-Ku' dipertahankan.
  alternative: karena Aku / karena reputasi-Ku
  rationale: Pemakaian 'nama' membawa bobot representatif dan teologis yang lebih luas daripada sekadar reputasi, dan ambiguitas itu patut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina untuk Yesus dan Dia yang mengutus-Nya mengikuti konvensi penerbitan Alkitab Indonesia; 'kamu' dipakai sebagai bentuk jamak yang ditentukan oleh konteks.
