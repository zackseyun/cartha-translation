id: JHN.15.6
reference: John 15:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: id
  text: Jika seseorang tidak tetap di dalam Aku[a], ia dibuang ke luar seperti ranting lalu menjadi kering. Ranting-ranting itu dikumpulkan, dilemparkan ke dalam api[b], lalu terbakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tinggal di dalam Aku.” Kata kerja Yunani ini dapat berarti tetap, tinggal, atau terus berada, dan merupakan istilah penting dalam tulisan Yohanes.
    reason: lexical_alternative
  - marker: b
    text: Gambaran ini memperingatkan tentang pembuangan dan pembakaran, tetapi ayat ini sendiri tidak menentukan apakah yang dimaksud adalah hilangnya status sebagai murid sejati atau tersingkapnya keterikatan yang tidak pernah sejati.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: tetap
  rationale: Kata μένω merupakan istilah penting dalam Injil Yohanes yang menyatakan keberlanjutan atau ketekunan dalam suatu relasi. “Tetap” alami dalam bahasa Indonesia modern dan mempertahankan cakupan maknanya tanpa mempersempitnya menjadi sekadar kedekatan fisik.
- source_word: ἐν ἐμοί
  choice: di dalam Aku
  rationale: Ungkapan ini dipertahankan secara dekat dengan bahasa sumber untuk menjaga daya relasional dan teologisnya, alih-alih melunakkannya menjadi “bersama-Ku” atau menafsirkannya sebagai “terhubung dengan-Ku”.
- source_word: ἐβλήθη ἔξω
  choice: dibuang ke luar
  rationale: Bentuk pasif dipertahankan, sedangkan aoris Yunani diterjemahkan secara wajar sebagai akibat umum dari kondisi yang disebutkan. “Dibuang ke luar” konkret dan sesuai dengan gambaran ranting.
- source_word: ὡς τὸ κλῆμα
  choice: seperti ranting
  rationale: κλῆμα adalah ranting atau carang pohon anggur. “Ranting” merupakan padanan modern yang alami dalam konteks perumpamaan pokok anggur.
- source_word: ἐξηράνθη
  choice: menjadi kering
  rationale: Kata kerja ini menunjukkan proses menjadi kering atau layu. “Menjadi kering” mempertahankan gambaran pengeringan secara langsung.
- source_word: συνάγουσιν αὐτὰ
  choice: Ranting-ranting itu dikumpulkan
  rationale: Subjek orang ketiga jamak dalam bahasa Yunani tidak ditentukan. Bentuk pasif Indonesia menjaga pelakunya tetap tidak disebutkan sekaligus membuat rujukan kata ganti jamak αὐτά kepada ranting-ranting menjadi jelas.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: dilemparkan ke dalam api
  rationale: Terjemahan ini mempertahankan tindakan konkret dan arah masuk yang dinyatakan oleh εἰς.
- source_word: καίεται
  choice: terbakar
  rationale: Bentuk tunggal Yunani dapat dipahami secara kolektif atau sebagai kelanjutan gambaran ranting perwakilan. Dalam bahasa Indonesia, “terbakar” tidak menandai jumlah dan karena itu mempertahankan ketegangan antara ranting tunggal sebelumnya dan ranting-ranting jamak yang dikumpulkan.
- source_word: τις
  choice: seseorang
  rationale: Padanan generik ini alami dalam kalimat bersyarat bahasa Indonesia dan mempertahankan bentuk tunggal tanpa membatasi jenis kelamin.
theological_decisions:
- issue: Apakah peringatan ini harus ditafsirkan sebagai kehilangan keselamatan sejati atau tersingkapnya keterikatan yang tidak sejati
  choice: Menyampaikan gambaran peringatan dan penghukuman secara langsung tanpa penjelasan doktrinal tambahan
  alternative: Menentukan bahwa orang itu adalah murid sejati yang murtad, atau sebaliknya orang yang sejak awal tidak pernah sungguh-sungguh bersatu dengan Yesus
  rationale: Ayat ini menegaskan akibat tidak tetap di dalam Yesus melalui gambaran ranting yang dibuang dan dibakar, tetapi tidak dengan sendirinya menyelesaikan perdebatan teologis kemudian tentang status sebelumnya dari orang tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” mengikuti rujukan langsung kepada Yesus. Struktur kalimat dibuat alami bagi pembaca umum, sementara pengulangan tindakan dan ketegangan teologis dalam bahasa Yunani tetap dipertahankan.
