  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: id
  text: Sebagaimana Bapa telah mengasihi Aku, demikian juga Aku telah mengasihi kalian. Tetaplah di dalam kasih-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebagaimana Bapa mengasihi Aku, demikian juga Aku mengasihi kalian. Tetaplah di dalam kasih-Ku.” Kedua kata kerja Yunani berbentuk aoris; dalam bahasa Indonesia, bentuk itu juga dapat diterjemahkan tanpa penanda “telah”. Teks utama memakai “telah” untuk menunjukkan relevansinya yang berlanjut dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Sebagaimana
  rationale: Mempertahankan daya perbandingan antara kasih Bapa kepada Yesus dan kasih Yesus kepada para murid dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: Bapa telah mengasihi Aku
  rationale: Bentuk 'telah mengasihi' menyampaikan tindakan lampau yang tetap relevan dalam konteks, tanpa menyatakan aspek yang melampaui teks Yunani.
- source_word: κἀγὼ
  choice: demikian juga Aku
  rationale: Mengungkapkan unsur penghubung dan penegasan pada κἀγώ sekaligus memperjelas kesejajaran komparatif yang dimulai oleh καθὼς.
- source_word: ὑμᾶς ἠγάπησα
  choice: Aku telah mengasihi kalian
  rationale: '''Kalian'' membuat bentuk jamak ὑμᾶς terlihat jelas; ''telah mengasihi'' sejajar dengan verba pertama dan menunjukkan relevansi kasih itu bagi perintah berikutnya.'
- source_word: μείνατε
  choice: Tetaplah
  rationale: Imperatif ini secara alami menyatakan keberlanjutan dalam suatu keadaan atau relasi dan mempertahankan tema μένω dalam Injil Yohanes.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: di dalam kasih-Ku
  rationale: Terjemahan langsung dan alami yang mempertahankan metafora relasional 'di dalam' serta posesif yang merujuk kepada kasih Yesus.
theological_decisions:
- issue: Makna ἀγάπη
  choice: kasih
  alternative: cinta
  rationale: '''Kasih'' merupakan padanan Indonesia yang alami dan bermartabat dalam konteks relasi ilahi serta tidak memasukkan kekhasan denominasi.'
- issue: Daya aspektual ἠγάπησέν dan ἠγάπησα
  choice: telah mengasihi
  alternative: mengasihi pada masa lampau tanpa penanda 'telah'
  rationale: Aoris dapat diterjemahkan sebagai lampau sederhana, tetapi 'telah' secara wajar menyampaikan tindakan terdahulu yang tetap penting bagi perintah 'Tetaplah', tanpa menegaskan bahwa bentuk Yunani sendiri adalah perfektum.
- issue: Rujukan τῇ ἀγάπῃ τῇ ἐμῇ
  choice: kasih-Ku
  alternative: kasih kepada-Ku
  rationale: Secara gramatikal, posesif ἐμῇ paling langsung berarti kasih yang menjadi milik atau berasal dari Yesus; terjemahan tidak mengalihkannya menjadi kasih para murid kepada Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk memperlihatkan bahwa ὑμᾶς berbentuk jamak. Huruf kapital pada 'Bapa', 'Aku', dan '-Ku' mengikuti rujukan ilahi yang jelas. Penanda catatan kaki ditempatkan setelah seluruh ayat karena catatan menerangkan kedua verba aoris.
