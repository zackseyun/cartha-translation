  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: id
  text: Lalu mereka berkata kepada-Nya, “Apa yang harus kami lakukan supaya kami mengerjakan pekerjaan-pekerjaan Allah?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang seharusnya kami lakukan supaya kami melakukan pekerjaan-pekerjaan Allah?” Frasa Yunani yang diterjemahkan “pekerjaan-pekerjaan Allah” juga dapat dipahami sebagai “pekerjaan-pekerjaan yang Allah tuntut.”
    reason: Mencatat kemungkinan nuansa deliberatif dan pembacaan alternatif genitif tanpa menghilangkan ambiguitas dari teks utama.
lexical_decisions:
- source_word: εἶπον
  choice: mereka berkata
  rationale: Bentuk aoris λέγω paling wajar diterjemahkan sebagai ujaran naratif lampau; bahasa Indonesia tidak memerlukan penandaan kala pada verba.
- source_word: οὖν
  choice: Lalu
  rationale: Kata ini melanjutkan alur sekaligus dapat menyiratkan akibat; “Lalu” alami dalam narasi dan tidak membuat hubungan logisnya terlalu tegas.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: Bersama verba berbicara, πρός dengan akusatif menunjukkan pihak yang disapa.
- source_word: Τί ποιῶμεν
  choice: Apa yang harus kami lakukan
  rationale: Subjungtif deliberatif menyatakan pertanyaan tentang tindakan yang dituntut; “harus” menyampaikan daya praktisnya dengan jelas.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan dan diterjemahkan dengan penghubung tujuan yang alami dalam bahasa Indonesia modern.
- source_word: ἐργαζώμεθα
  choice: kami dapat mengerjakan
  rationale: “Mengerjakan” menyampaikan arti bekerja atau melaksanakan dan mempertahankan hubungan akar kata dengan ἔργα melalui pasangan “mengerjakan pekerjaan-pekerjaan.” Kata “dapat” mencerminkan nuansa subjungtif dalam klausa tujuan, bukan kemampuan semata.
- source_word: τὰ ἔργα
  choice: pekerjaan-pekerjaan
  rationale: Bentuk jamak dipertahankan, demikian juga kaitan leksikalnya dengan ἐργαζώμεθα. Meskipun pengulangan ini lebih kentara daripada ungkapan Indonesia sehari-hari, hal itu penting bagi permainan kata dalam konteks.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Konstruksi “pekerjaan-pekerjaan Allah” mempertahankan genitif yang terbuka tanpa menetapkan apakah maksudnya pekerjaan yang dituntut Allah, berasal dari Allah, dimiliki Allah, atau dilakukan Allah.
theological_decisions:
- issue: Makna genitif dalam τὰ ἔργα τοῦ θεοῦ
  choice: Mempertahankan frasa “pekerjaan-pekerjaan Allah” dalam teks utama.
  alternative: “pekerjaan-pekerjaan yang Allah tuntut,” “pekerjaan-pekerjaan milik Allah,” atau “pekerjaan-pekerjaan yang Allah lakukan.”
  rationale: Genitif Yunani ini terbuka secara semantis, dan ayat berikutnya memanfaatkan ketegangan tersebut. Teks utama tidak boleh menetapkan satu tafsiran yang tidak ditentukan oleh bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “kepada-Nya” mengikuti kebiasaan penulisan rujukan ilahi dalam bahasa Indonesia. Pengulangan “mengerjakan pekerjaan-pekerjaan” sengaja dipertahankan untuk mencerminkan permainan leksikal Yunani, meskipun sedikit kurang lazim dalam percakapan sehari-hari.
