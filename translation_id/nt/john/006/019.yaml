id: JHN.6.19
reference: John 6:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: id
  text: Maka, setelah mereka mendayung kira-kira dua puluh lima atau tiga puluh stadia[a], mereka melihat Yesus berjalan di atas laut[b] dan mendekati perahu, lalu mereka ketakutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu stadion adalah satuan jarak kuno. Dua puluh lima atau tiga puluh stadia kira-kira sama dengan lima sampai enam kilometer.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “berjalan di atas air.” Teks Yunani secara harfiah menyebut “berjalan di atas laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: setelah mereka mendayung
  rationale: Dalam konteks perjalanan dengan perahu, ἐλαύνω menunjuk pada tindakan menggerakkan perahu dengan dayung. Bentuk partisip sempurna menyatakan tindakan yang sudah berlangsung sebelum mereka melihat Yesus.
- source_word: οὖν
  choice: Maka
  rationale: Kata ini meneruskan alur dan menghubungkan peristiwa tersebut dengan keadaan yang diceritakan sebelumnya; “Maka” mempertahankan fungsi penghubung itu secara wajar.
- source_word: ὡς
  choice: kira-kira
  rationale: Di depan ukuran jarak, ὡς menyatakan perkiraan.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: dua puluh lima atau tiga puluh stadia
  rationale: Satuan kuno dalam teks sumber dipertahankan agar bentuk pengukuran aslinya tetap terlihat; padanan modern diberikan dalam catatan kaki.
- source_word: θεωροῦσιν
  choice: mereka melihat
  rationale: Dalam konteks naratif ini, “melihat” menyampaikan tindakan pengamatan secara alami tanpa memakai ungkapan yang terlalu arkais.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: berjalan di atas laut
  rationale: Terjemahan ini mempertahankan θάλασσα sebagai “laut” dan menyatakan bahwa Yesus berjalan di atas permukaannya, sesuai dengan gambaran langsung dalam teks.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: mendekati perahu
  rationale: Gabungan γίνομαι dan ἐγγύς menggambarkan gerak menuju kedekatan, bukan sekadar keadaan sudah berada di dekat perahu.
- source_word: πλοίου
  choice: perahu
  rationale: Dalam konteks pelayaran di Danau Galilea, “perahu” lebih tepat dan alami daripada “kapal,” yang biasanya mengesankan kendaraan air yang lebih besar.
- source_word: ἐφοβήθησαν
  choice: mereka ketakutan
  rationale: Ungkapan ini menyampaikan reaksi takut para murid secara alami dan kuat.
theological_decisions:
- issue: Penggambaran mukjizat tanpa melunakkan makna langsung teks
  choice: berjalan di atas laut
  alternative: berjalan di atas air; berjalan di tepi laut
  rationale: ἐπί dengan bentuk genitif dalam konteks ini menggambarkan Yesus berjalan di atas laut itu sendiri. “Di tepi laut” tidak sesuai dengan konteks para murid yang sedang berada jauh dari pantai, sedangkan “di atas air” menyampaikan peristiwa yang sama tetapi mengganti kata θάλασσα (“laut”) dengan istilah yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mempertahankan perkembangan narasi serta keajaiban ungkapan sumber tanpa menambahkan penafsiran doktrinal.
