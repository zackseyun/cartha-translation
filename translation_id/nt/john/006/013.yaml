base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: id
  text: Maka mereka mengumpulkannya, lalu mengisi dua belas keranjang dengan potongan-potongan[a] dari lima roti jelai yang tersisa setelah orang-orang makan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pecahan-pecahan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “yang berlimpah bagi mereka yang telah makan”; maksudnya ialah bagian-bagian yang tersisa sesudah mereka makan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Maka mereka mengumpulkannya
  rationale: οὖν menyatakan akibat dari perintah Yesus pada ayat sebelumnya, sedangkan objek συνήγαγον tersirat dari konteks. “Maka” dan akhiran “-nya” menghasilkan alur narasi Indonesia yang wajar.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: lalu mengisi dua belas keranjang
  rationale: ἐγέμισαν berarti “mengisi,” dan κοφίνους secara umum berarti keranjang. “Lalu” menghubungkan tindakan berikutnya secara alami tanpa menghilangkan hubungan akibat yang sudah dinyatakan oleh “Maka.”
- source_word: κλασμάτων
  choice: potongan-potongan
  rationale: Kata ini menunjuk pada pecahan atau potongan roti. “Potongan-potongan” jelas dan alami dalam bahasa Indonesia modern; alternatif “pecahan-pecahan” dicatat dalam catatan kaki.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: dari lima roti jelai
  rationale: ἄρτων dalam konteks ini adalah roti, dan κριθίνων menyatakan bahwa roti itu dibuat dari jelai. Bentuk ini ringkas serta mempertahankan hubungan dengan lima roti semula.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: yang tersisa setelah orang-orang makan
  rationale: Ungkapan ini menyampaikan makna kontekstual bahwa potongan-potongan tersebut merupakan kelebihan sesudah makan. Terjemahan yang lebih harfiah, “yang berlimpah bagi mereka yang telah makan,” kurang alami dan dapat disalahpahami dalam bahasa Indonesia, sehingga dicatat dalam catatan kaki.
