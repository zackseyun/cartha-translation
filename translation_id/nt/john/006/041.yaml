  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi bersungut-sungut tentang Dia karena Dia berkata[a], “Akulah roti yang telah turun dari surga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani yang diterjemahkan “orang-orang Yahudi” juga dapat diterjemahkan “orang-orang Yudea” atau, dalam konteks tertentu, “para pemimpin Yahudi.” Dalam Injil Yohanes, ungkapan ini dapat menunjuk kepada kelompok tertentu yang menentang Yesus, bukan kepada seluruh orang Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: bersungut-sungut
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang pada masa lampau. Dalam bahasa Indonesia, konteks lampau sudah ditandai oleh alur narasi; “bersungut-sungut” menyampaikan keluhan bernada negatif dan menggemakan bahasa persungutan di padang gurun.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat naratif sekaligus inferensial dari perkataan Yesus sebelumnya.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Menerjemahkan ungkapan Yunani secara langsung tanpa mempersempit acuannya menjadi para pemimpin atau penduduk Yudea. Catatan kaki mencegah ungkapan ini dipahami sebagai generalisasi tentang seluruh orang Yahudi.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: περί dengan genetif secara wajar berarti “tentang” atau “mengenai”; “menentang Dia” akan menambahkan kadar permusuhan yang tidak dinyatakan oleh preposisi itu sendiri.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini ὅτι memperkenalkan alasan mereka bersungut-sungut, bukan sekadar isi ujaran.
- source_word: εἶπεν
  choice: Dia berkata
  rationale: Aoristus indikatif diterjemahkan secara alami sebagai tindakan lampau sederhana; konteks narasi memberikan waktu lampau tanpa memerlukan bentuk “telah berkata”.
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini menyampaikan identifikasi diri dan penekanan pada ἐγώ secara alami dalam bahasa Indonesia tanpa menambahkan penafsiran.
- source_word: ὁ ἄρτος
  choice: roti
  rationale: Dalam konstruksi “Akulah roti,” bahasa Indonesia tidak memerlukan artikel; identifikasi khusus tetap jelas dari struktur kalimat.
- source_word: ὁ καταβὰς
  choice: yang telah turun
  rationale: Klausa relatif merupakan padanan Indonesia yang jelas bagi partisipel aoristus berartikel dan “telah turun” menyampaikan tindakan turun yang dipandang sebagai satu keseluruhan.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Padanan Indonesia yang alami untuk ἐκ dengan genetif, dengan tetap mempertahankan penekanan pada asal.
theological_decisions:
- issue: Acuan dan penerjemahan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks ayat ini sendiri tidak secara eksplisit membatasi acuan kepada para pemimpin atau memberi penekanan geografis. Terjemahan utama mengikuti ungkapan Yunani, sedangkan catatan kaki menjaga agar ungkapan itu tidak disalahpahami sebagai pernyataan mengenai seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Bersungut-sungut” dipertahankan karena masih lazim dalam ragam Alkitabiah dan membawa nuansa keluhan berulang; huruf kapital pada “Dia” mengikuti kebiasaan penghormatan yang umum dalam penerbitan Alkitab bahasa Indonesia.
