review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan pada "danau" dan "bergerak". θάλασσα secara konsisten disebut "laut" dalam Yohanes dan sebaiknya dipertahankan, walaupun secara geografis perairan itu adalah danau. ἤρχοντο adalah imperfek perjalanan yang sedang berlangsung; "berlayar" menyampaikan tindakan itu dengan lebih tepat dan idiomatis. "Hari sudah gelap" merupakan padanan Indonesia yang wajar untuk σκοτία ἤδη ἐγεγόνει, dan "Yesus belum datang kepada mereka" secara langsung mencerminkan οὔπω ἐληλύθει πρὸς αὐτούς.
  naturalness: '"Lalu bergerak menyeberangi danau" terdengar tidak lazim dalam bahasa Indonesia modern; orang lazimnya "berlayar menyeberangi laut". Kalimat revisi tetap mengalir dan mempertahankan urutan naratif.'
  terminology: Gunakan "laut" untuk θάλασσα demi kesetiaan pada istilah sumber dan konsistensi terminologis Yohanes. "Kapernaum" dan "Yesus" sudah baku. Penghilangan "juga" dari "belum juga datang" menghindari penambahan nuansa penantian/penekanan yang tidak secara eksplisit dinyatakan oleh οὔπω.
  issues:
  - severity: medium
    issue: '"danau" menerjemahkan θάλασσα'
    rationale: Walaupun sesuai dengan geografi modern, teks Yunani menyebut θάλασσα dan jejak audit Inggris dengan sengaja mempertahankan "sea". "Laut" mempertahankan istilah sumber tanpa mengubah makna naratif.
  - severity: medium
    issue: '"lalu bergerak menyeberangi" tidak idiomatis dan kurang spesifik'
    rationale: '"Bergerak" terlalu umum untuk perjalanan dengan perahu dan rangkaiannya canggung. "Berlayar menyeberangi" alami serta menyampaikan gerak progresif imperfek ἤρχοντο.'
  - severity: low
    issue: '"belum juga" memberi penekanan tambahan'
    rationale: οὔπω berarti "belum/tidak sampai saat itu"; "belum datang" sudah memadai dan lebih netral.
  revised_text: Mereka naik ke sebuah perahu dan berlayar menyeberangi laut menuju Kapernaum.[a] Hari sudah gelap, dan Yesus belum datang kepada mereka.
  revised_footnotes:
