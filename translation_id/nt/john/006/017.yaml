revisions:
- from: Mereka naik ke sebuah perahu lalu bergerak menyeberangi danau menuju Kapernaum.[a] Hari sudah gelap, dan Yesus belum juga datang kepada mereka.
  to: Mereka naik ke sebuah perahu dan berlayar menyeberangi laut menuju Kapernaum.[a] Hari sudah gelap, dan Yesus belum datang kepada mereka.
  rationale: Revisi mengganti sebutan geografis interpretatif "danau" dengan "laut" sesuai θάλασσα, dan mengganti ungkapan perjalanan yang kaku dengan "berlayar menyeberangi laut" untuk mencerminkan perjalanan yang sedang berlangsung. Catatan kaki diselaraskan dengan istilah yang direvisi dan alternatif πέραν τῆς θαλάσσης. Tidak ada perubahan pada urutan peristiwa atau isi makna.
