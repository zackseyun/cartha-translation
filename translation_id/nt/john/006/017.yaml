source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: id
  text: Mereka naik ke sebuah perahu dan berlayar menyeberangi laut menuju Kapernaum.[a] Hari sudah gelap, dan Yesus belum datang kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke seberang laut.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Mereka naik ke sebuah perahu
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Bentuk koordinatif ini alami dalam bahasa Indonesia dan tetap mempertahankan urutan tindakan. Artikel tak tentu dipakai karena bahasa Yunani tidak menyatakan bahwa ini perahu tertentu.
- source_word: ἤρχοντο
  choice: lalu bergerak
  rationale: Bentuk imperfek menggambarkan perjalanan yang sedang berlangsung, bukan sekadar tindakan yang telah selesai. Kata 'lalu' menandai urutan tanpa menghilangkan aspek duratif.
- source_word: πέραν τῆς θαλάσσης
  choice: menyeberangi danau
  rationale: πέραν dengan genitif menyatakan gerak melintasi atau menuju seberang. Dalam konteks Danau Galilea, 'danau' merupakan sebutan geografis yang alami dalam bahasa Indonesia, sedangkan tindakan menyeberang mempertahankan arah ungkapan Yunani.
- source_word: εἰς Καφαρναούμ
  choice: menuju Kapernaum
  rationale: Preposisi εἰς menyatakan arah atau tujuan. 'Menuju' selaras dengan perjalanan yang masih berlangsung dan tidak menyiratkan bahwa mereka sudah tiba.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Hari sudah gelap
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan keadaan gelap yang telah terjadi sebelumnya sebagai hasil perubahan, sesuai dengan bentuk pluperfek ἐγεγόνει.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: belum juga datang kepada mereka
  rationale: '''Belum juga'' secara alami menonjolkan keadaan bahwa sampai saat itu Yesus belum datang, sementara ''kepada mereka'' mempertahankan πρὸς αὐτούς tanpa menafsirkan lebih jauh sebagai ''bergabung''.'
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Bentuk baku nama tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Aspek naratif dan urutan waktu
  choice: 'Urutan tindakan dan keadaan dipertahankan: mereka naik perahu, sedang bergerak menyeberang menuju Kapernaum, hari sudah gelap, dan Yesus belum datang kepada mereka.'
  alternative: Menerjemahkan perjalanan sebagai tindakan lampau sederhana atau keadaan gelap sekadar sebagai keadaan statis.
  rationale: Pilihan ini menjaga ketegangan naratif yang dibangun oleh aspek verba Yunani tanpa menambahkan penjelasan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kalimat koordinatif menghindari konstruksi partisipial yang kaku. 'Danau' dipilih sebagai sebutan geografis alami bagi Danau Galilea, sementara catatan kaki mempertahankan kemungkinan bahwa πέραν lebih menekankan tujuan di seberang.
