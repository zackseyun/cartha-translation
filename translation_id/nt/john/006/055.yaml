base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: id
  text: Sebab daging-Ku adalah makanan[a] sejati, dan darah-Ku adalah minuman sejati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “benar-benar makanan” dan “benar-benar minuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menjaga fungsi penjelas γάρ dan kaitannya dengan pernyataan sebelumnya dalam bahasa Indonesia yang alami.
- source_word: σάρξ
  choice: daging
  rationale: Menerjemahkan secara harfiah dan mempertahankan kesejajaran yang kuat antara daging dan darah, tanpa menggantinya dengan istilah interpretatif seperti tubuh.
- source_word: ἀληθής
  choice: benar-benar
  rationale: Dalam konstruksi predikatif ini, 'benar-benar' menyampaikan bahwa daging dan darah Yesus sungguh merupakan makanan dan minuman, sekaligus terdengar lebih alami daripada 'makanan yang benar' dalam bahasa Indonesia. Alternatif 'sejati' tetap dimungkinkan.
- source_word: βρῶσις
  choice: makanan
  rationale: Konteks predikatif dan kesejajarannya dengan πόσις mendukung arti sesuatu yang dimakan, bukan tindakan makan.
- source_word: αἷμα
  choice: darah
  rationale: Padanan harfiah yang mempertahankan ungkapan tegas serta kesejajaran daging dan darah dalam teks Yunani.
- source_word: πόσις
  choice: minuman
  rationale: Konteks predikatif mendukung arti sesuatu yang diminum, dan 'minuman' merupakan pasangan alami bagi 'makanan'.
theological_decisions:
- issue: Nuansa ἀληθής dalam konteks yang terkait dengan perdebatan sakramental
  choice: benar-benar
  alternative: sejati
  rationale: Pilihan ini mempertahankan penegasan realitas pada ἀληθής tanpa menjelaskan bagaimana daging dan darah Yesus menjadi makanan dan minuman. Dengan demikian, terjemahan tidak memutuskan di antara penafsiran sakramental dan non-sakramental.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk milik ilahi ditulis dengan enklitik berhuruf kapital sesuai kebiasaan luas dalam terjemahan Alkitab bahasa Indonesia. Pengulangan 'benar-benar' dipertahankan untuk mencerminkan pengulangan ἀληθής dalam teks sumber.
