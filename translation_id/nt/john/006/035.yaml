  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: id
  text: Yesus berkata kepada mereka, “Akulah roti kehidupan. Siapa yang datang kepada-Ku tidak akan pernah lapar, dan siapa yang percaya kepada-Ku tidak akan pernah haus.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sama sekali tidak akan pernah haus.” Bahasa Yunani memakai negasi yang sangat tegas bersama kata “pernah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Yesus berkata kepada mereka
  rationale: Menerjemahkan pengantar naratif dan objek datif secara langsung serta wajar dalam bahasa Indonesia.
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini alami untuk pernyataan identitas yang tegas dalam bahasa Indonesia dan mempertahankan penekanan dari pronomina eksplisit Ἐγώ.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: roti kehidupan
  rationale: Mempertahankan metafora dan konstruksi genetif tanpa menafsirkannya menjadi 'roti yang memberi hidup'.
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: siapa yang datang kepada-Ku
  rationale: Mengungkapkan partisipel substantival yang bersifat umum dengan idiom Indonesia yang alami.
- source_word: οὐ μὴ πεινάσῃ
  choice: tidak akan pernah lapar
  rationale: Frasa 'tidak akan pernah' menyampaikan negasi Yunani οὐ μή yang sangat tegas.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: siapa yang percaya kepada-Ku
  rationale: Ungkapan 'percaya kepada' lazim dan transparan untuk πιστεύω εἰς dalam konteks relasional ini.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: tidak akan pernah haus
  rationale: Menyampaikan gabungan negasi tegas οὐ μή dan πώποτε ('pernah, kapan pun') tanpa menambahkan gagasan 'lagi' yang tidak dinyatakan oleh teks sumber.
theological_decisions:
- issue: Makna πιστεύων εἰς ἐμέ
  choice: siapa yang percaya kepada-Ku
  alternative: siapa yang menaruh kepercayaan kepada-Ku
  rationale: Pilihan utama mempertahankan istilah Yohanes yang mapan dan tidak mempersempitnya menjadi satu nuansa tertentu.
- issue: Daya pernyataan Ἐγώ εἰμι
  choice: Akulah
  alternative: Aku adalah
  rationale: '''Akulah'' mempertahankan penegasan diri secara alami tanpa menambahkan penjelasan teologis yang tidak terdapat dalam ayat.'
- issue: Cakupan πώποτε
  choice: tidak akan pernah haus
  alternative: sama sekali tidak akan pernah haus
  rationale: πώποτε berarti 'pernah/kapan pun', bukan 'lagi'; karena itu teks utama mempertahankan cakupan waktu tanpa menyiratkan bahwa orang tersebut sebelumnya telah mengalami kepuasan final.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang diterangkannya.
