base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: id
  text: Orang yang makan[a] daging-Ku dan minum darah-Ku tetap tinggal[b] di dalam Aku, dan Aku di dalam dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengunyah”; kata kerja Yunani yang dipakai lebih hidup daripada kata umum untuk makan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “berdiam di dalam Aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Orang yang makan
  rationale: Artikel dengan partisipel kini berfungsi substantival dan menunjuk kepada orang yang dicirikan oleh tindakan ini. Bentuk ini mempertahankan acuan tunggal serta nuansa tindakan yang berlangsung tanpa menjadikannya lebih umum daripada teks sumber.
- source_word: τρώγων
  choice: makan
  rationale: τρώγω lebih hidup daripada kata Yunani umum untuk 'makan' dan dapat bernuansa 'mengunyah', tetapi 'makan' paling alami dalam bahasa Indonesia serta tidak menambahkan tafsiran. Nuansa yang lebih grafis dicatat dalam catatan kaki.
- source_word: μου τὴν σάρκα
  choice: daging-Ku
  rationale: σάρξ di sini dipertahankan secara konkret sebagai 'daging', bukan diparafrasakan sebagai sifat berdosa atau diberi penjelasan sakramental/metaforis.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: dan minum darah-Ku
  rationale: Partisipel kini kedua sejajar dengan τρώγων. Ungkapan harfiah mempertahankan citra pengorbanan yang kuat dan mengejutkan dalam teks Yunani.
- source_word: ἐν ἐμοὶ μένει
  choice: tetap tinggal di dalam Aku
  rationale: μένω merupakan kata penting dalam Yohanes yang menyatakan keberlanjutan atau ketetapan relasional. 'Tetap tinggal' jelas bagi pembaca modern dan mempertahankan hubungan dengan citra 'tinggal di dalam'.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: dan Aku di dalam dia
  rationale: Teks Yunani tidak mengulangi verba pada klausa kedua. Terjemahan ini mempertahankan elipsis tersebut secara alami tanpa menambahkan 'tetap tinggal'.
- source_word: αὐτῷ
  choice: dia
  rationale: Pronomina maskulin tunggal merujuk kembali kepada orang yang disebut pada awal ayat. Bahasa Indonesia menggunakan 'dia' secara alami tanpa perlu menandai gender.
theological_decisions:
- issue: Penafsiran sakramental/Ekaristis atau metaforis atas makan daging dan minum darah
  choice: Mempertahankan kata-kata konkret teks Yunani tanpa penjelasan interpretatif.
  alternative: Menjelaskannya secara eksplisit sebagai sakramen atau sebagai metafora untuk percaya.
  rationale: Teks ayat ini menyatakan gambaran tersebut tanpa menyelesaikan perdebatan penafsirannya. Terjemahan tidak memasukkan kekhasan denominasi ke dalam teks.
- issue: Bahasa saling tinggal dalam Injil Yohanes
  choice: Menerjemahkan μένει sebagai 'tetap tinggal' dan mempertahankan klausa eliptis 'dan Aku di dalam dia'.
  alternative: Memakai 'berdiam', 'tetap berada', atau memparafrasakannya sebagai 'bersatu'.
  rationale: '''Tetap tinggal'' mempertahankan gagasan keberlanjutan relasional dalam Yohanes tanpa mempersempitnya menjadi rumusan mistis atau dogmatis tertentu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan mudah dipahami. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan kesejajaran dan elipsis Yunani.
