  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: id
  text: “Di sini ada seorang anak laki-laki yang mempunyai lima roti jelai dan dua ekor ikan. Namun, apa cukupnya semua itu bagi orang sebanyak itu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, apa arti semua itu bagi orang sebanyak itu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδάριον
  choice: anak laki-laki
  rationale: Istilah ini menunjuk kepada seorang anak atau anak lelaki yang masih muda. “Anak laki-laki” alami dalam bahasa Indonesia modern tanpa menambahkan penekanan bahwa ia sangat kecil.
- source_word: ὧδε
  choice: di sini
  rationale: Padanan lokatif langsung dan alami untuk menunjukkan keberadaan anak itu di tempat tersebut.
- source_word: ὃς ἔχει
  choice: yang mempunyai
  rationale: Klausa relatif ini mengidentifikasi anak tersebut berdasarkan bekal yang dibawanya; “yang mempunyai” jelas dan wajar.
- source_word: ἄρτους κριθίνους
  choice: roti jelai
  rationale: ἄρτους berarti roti atau ketul-ketul roti, sedangkan κριθίνους menyatakan bahwa roti itu dibuat dari jelai. Bahasa Indonesia tidak perlu menyatakan bentuk ketul secara eksplisit.
- source_word: ὀψάρια
  choice: ikan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada ikan yang dimakan bersama roti. “Ikan” paling jelas; menerjemahkannya sebagai “ikan kecil” akan memberi rincian yang tidak pasti.
- source_word: ἀλλὰ
  choice: namun
  rationale: Menandai pertentangan antara bekal yang tersedia dan banyaknya orang. “Namun” mempertahankan peralihan retoris dengan register yang wajar dan bermartabat.
- source_word: ταῦτα τί ἐστιν
  choice: apa artinya semua ini
  rationale: 'Ungkapan Yunani secara harfiah menanyakan apakah atau apakah arti semua ini, tetapi dalam konteks bernilai evaluatif: bekal itu tidak memadai. Pilihan ini mempertahankan bentuk pertanyaan dan tidak mengubahnya menjadi pernyataan eksplisit.'
- source_word: εἰς τοσούτους
  choice: bagi orang sebanyak itu
  rationale: εἰς di sini menyatakan hubungan atau kecukupan terhadap jumlah orang yang sangat besar. “Bagi orang sebanyak itu” alami dan mempertahankan acuan kepada banyaknya orang.
