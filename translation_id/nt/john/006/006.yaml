  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: id
  text: Namun, Ia mengatakan hal ini untuk menguji Filipus[a], sebab Ia sendiri tahu apa yang hendak dilakukan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mencoba Filipus”; kata ini juga dapat berarti “mencobai”, tetapi dalam konteks ini maksudnya ialah menguji atau membuktikan dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hal itu
  rationale: Menunjuk pada pertanyaan Yesus dalam ayat sebelumnya; “hal itu” alami dalam narasi Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan sekaligus penjelasan terhadap pertanyaan sebelumnya.
- source_word: ἔλεγεν
  choice: mengatakan
  rationale: Imperfek menggambarkan tindakan berbicara dalam alur narasi; bahasa Indonesia tidak perlu menandai aspek progresif secara kaku.
- source_word: πειράζων
  choice: untuk menguji
  rationale: Partisipel ini menyatakan tujuan. Dalam konteks ini artinya menguji atau membuktikan tanggapan Filipus, bukan membujuknya berbuat jahat.
- source_word: αὐτόν
  choice: Filipus
  rationale: Pronomina merujuk kepada Filipus dalam konteks langsung; penyebutan nama menjernihkan rujukan yang dalam bahasa Indonesia dapat kabur karena kedua tokoh laki-laki disebut dengan pronomina yang sama.
- source_word: αὐτὸς
  choice: Ia sendiri
  rationale: Mempertahankan penekanan pronomina eksplisit pada pengetahuan Yesus sendiri.
- source_word: γὰρ
  choice: sebab
  rationale: Memperkenalkan alasan Yesus mengajukan pertanyaan tersebut.
- source_word: ᾔδει
  choice: tahu
  rationale: Bentuk dari οἶδα berfungsi sebagai keadaan lampau dalam narasi; “tahu” merupakan padanan Indonesia yang alami.
- source_word: τί
  choice: apa
  rationale: Memperkenalkan isi yang diketahui Yesus secara lugas.
- source_word: ἔμελλεν ποιεῖν
  choice: akan dilakukan-Nya
  rationale: Menyampaikan tindakan yang sudah di depan atau dimaksudkan tanpa memaksakan pilihan antara kedekatan waktu dan niat.
theological_decisions:
- issue: Makna πειράζων dalam tindakan Yesus terhadap Filipus
  choice: untuk menguji
  alternative: untuk mencobai
  rationale: Konteks menunjukkan bahwa Yesus sedang menguji tanggapan atau pemahaman Filipus, bukan membujuknya melakukan kejahatan.
- issue: Penekanan pada pengetahuan Yesus
  choice: Ia sendiri tahu
  alternative: Ia tahu
  rationale: Pronomina Yunani αὐτός bersifat tegas; terjemahan mempertahankan penekanan itu tanpa menambahkan kesimpulan doktrinal.
- issue: Subjek tindakan yang akan dilakukan
  choice: akan dilakukan-Nya
  alternative: hendak dilakukan-Nya
  rationale: μέλλω dapat menandai tindakan yang segera atau diniatkan. “Akan” mempertahankan keluasan ini, sedangkan “hendak” dapat lebih kuat menonjolkan niat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai bagi Yesus, sedangkan sufiks hormat “-Nya” menjaga rujukan subjek. Nama Filipus diulang untuk mencegah ketaksaan pronomina Indonesia.
