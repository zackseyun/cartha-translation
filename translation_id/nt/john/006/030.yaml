  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: id
  text: Karena itu mereka berkata kepada-Nya, “Kalau begitu, tanda apa yang Engkau lakukan supaya kami dapat melihat dan memercayai-Mu[a]? Pekerjaan apa yang sedang Engkau lakukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “percaya kepada-Mu” atau “menaruh kepercayaan kepada-Mu.” Secara lebih harfiah, bahasa Yunani mengatakan “memercayai-Mu” dengan memakai kata ganti datif, bukan ungkapan yang lebih umum dalam Injil Yohanes untuk “percaya kepada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Karena itu mereka berkata kepada-Nya
  rationale: οὖν menghubungkan ucapan ini dengan perkataan Yesus sebelumnya secara inferensial; “karena itu” mempertahankan hubungan wacana tersebut dalam bahasa Indonesia yang wajar.
- source_word: Τί οὖν
  choice: Kalau begitu, ... apa
  rationale: οὖν yang diulang dipertahankan sebagai “kalau begitu” untuk menyampaikan desakan logis dalam tanggapan orang banyak.
- source_word: ποιεῖς σὺ σημεῖον
  choice: tanda apa yang Engkau lakukan
  rationale: “Tanda” mempertahankan istilah khas Yohanes σημεῖον tanpa menambahkan penafsiran “mukjizat”; “lakukan” mencerminkan ποιεῖς dan bentuk kini dalam tantangan yang sedang diajukan.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: supaya kami dapat melihat dan memercayai-Mu
  rationale: “Supaya” menyatakan maksud yang dibawa ἵνα, sedangkan “memercayai-Mu” mempertahankan konstruksi πιστεύω dengan datif σοι dan tidak menyamakannya begitu saja dengan ungkapan Yohanes yang lebih umum, πιστεύω εἰς.
- source_word: τί ἐργάζῃ
  choice: Pekerjaan apa yang Engkau kerjakan?
  rationale: Pengulangan “pekerjaan/kerjakan” secara alami mempertahankan akar makna ἔργον yang terkandung dalam ἐργάζῃ sekaligus membedakannya dari ποιεῖς sebelumnya.
theological_decisions:
- issue: Makna πιστεύω dengan datif σοι
  choice: memercayai-Mu
  alternative: percaya kepada-Mu; menaruh kepercayaan kepada-Mu
  rationale: Datif σοι paling langsung menunjuk pada memercayai Yesus atau perkataan-Nya, bukan memakai konstruksi khas “percaya kepada/dalam” yang biasanya diterjemahkan dari εἰς. Pilihan utama mempertahankan perbedaan itu, sementara catatan mengakui nuansa kepercayaan yang mungkin terkandung di dalamnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi memakai kapital sesuai kelaziman penerbitan Alkitab Indonesia. Struktur pertanyaan tetap langsung dan menantang, serta pengulangan antara “melakukan” dan “mengerjakan” dipertahankan tanpa menjadi kaku.
