  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: id
  text: Jadi, bagaimana jika kalian melihat Anak Manusia naik ke tempat Ia berada sebelumnya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jadi, jika kalian melihat Anak Manusia naik ke tempat Ia berada sebelumnya?” Bahasa Yunani memakai pertanyaan bersyarat yang bersifat retoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Jadi, bagaimana jika
  rationale: Ungkapan ini menyampaikan daya simpulan οὖν dan sifat bersyarat ἐὰν sebagai pertanyaan retoris yang wajar dalam bahasa Indonesia.
- source_word: θεωρῆτε
  choice: kalian melihat
  rationale: Dalam konstruksi bersyarat ini, 'melihat' menyampaikan tindakan menyaksikan secara langsung dengan alami; subjek jamak dibuat jelas melalui 'kalian'.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan khas Yesus dalam Injil serta gema mesianiknya tanpa parafrasa penafsiran.
- source_word: ἀναβαίνοντα
  choice: naik
  rationale: Menyatakan gerak ke atas secara alami dan tetap memungkinkan makna kenaikan ke ranah surgawi tanpa menambahkannya secara eksplisit.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: ke tempat Ia berada sebelumnya
  rationale: Menjaga acuan pada tempat atau keadaan terdahulu, termasuk implikasi keberadaan sebelumnya, tanpa menyebut surga atau Bapa yang tidak disebut langsung dalam ayat.
theological_decisions:
- issue: Apakah kenaikan Yesus harus dijelaskan secara eksplisit sebagai kembali ke surga atau kepada Bapa
  choice: ke tempat Ia berada sebelumnya
  alternative: kembali ke surga, tempat Ia berada sebelumnya; kembali kepada Bapa
  rationale: Bahasa Yunani menyiratkan keberadaan sebelumnya dan kenaikan, tetapi tidak secara eksplisit menyebut surga atau Bapa. Terjemahan mempertahankan ketegangan dan daya kristologis teks tanpa perluasan doktrinal.
- issue: Bentuk pertanyaan bersyarat retoris
  choice: Jadi, bagaimana jika kalian melihat ...?
  alternative: Jadi, jika kalian melihat ...?
  rationale: Teks Yunani berbentuk kondisi yang berfungsi sebagai pertanyaan retoris; rumusan utama membuat fungsi tersebut jelas dalam bahasa Indonesia, sedangkan bentuk yang lebih harfiah dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak secara jelas; 'Ia' mempertahankan acuan hormat kepada Yesus. Susunan kalimat dibuat alami tanpa menghilangkan bentuk retoris atau ambiguitas mengenai tempat yang dituju.
