id: JHN.6.15
reference: John 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: id
  text: Karena itu, ketika Yesus mengetahui bahwa mereka akan segera datang dan menangkap-Nya[a] untuk menjadikan-Nya raja, Ia menyingkir lagi ke gunung seorang diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa-Nya dengan paksa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan naratif dan kesimpulan dari peristiwa sebelumnya tanpa menghilangkan daya penghubungnya.
- source_word: γνοὺς
  choice: ketika Yesus mengetahui
  rationale: Partisip aoris ini menyatakan keadaan yang melatarbelakangi tindakan Yesus; bentuk anak kalimat ini alami dalam bahasa Indonesia.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: mereka akan segera datang
  rationale: Menyampaikan tindakan yang sudah dekat atau segera terjadi, sebagaimana lazimnya μέλλω dengan infinitif dalam konteks ini.
- source_word: ἁρπάζειν
  choice: menangkap-Nya
  rationale: Kata ini menyatakan pengambilan secara mendadak atau paksa. 'Menangkap' mempertahankan unsur pemaksaan, sedangkan alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: untuk menjadikan-Nya raja
  rationale: Menyampaikan tujuan tindakan orang banyak dengan jelas dan alami.
- source_word: ἀνεχώρησεν
  choice: menyingkir
  rationale: Menggambarkan gerakan menjauh untuk menghindari tindakan orang banyak, tanpa memberi kesan mundur karena kalah.
- source_word: πάλιν
  choice: lagi
  rationale: Mempertahankan keterangan pengulangan yang terdapat dalam teks Yunani.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung
  rationale: Dekat dengan ungkapan Yunani dan tidak mempersempitnya menjadi bukit atau daerah perbukitan.
- source_word: αὐτὸς μόνος
  choice: seorang diri
  rationale: Secara alami menyampaikan penegasan bahwa Yesus pergi tanpa orang lain.
theological_decisions:
- issue: Sifat tindakan orang banyak untuk menjadikan Yesus raja
  choice: 'Menampilkan tindakan itu sebagai upaya pemaksaan: ''menangkap-Nya ... untuk menjadikan-Nya raja.'''
  alternative: datang untuk menjadikan-Nya raja
  rationale: ἁρπάζειν mengandung unsur merebut atau mengambil dengan paksa. Terjemahan tidak melunakkan tindakan itu menjadi penobatan sukarela ataupun menambahkan penilaian doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap mudah dipahami, sementara unsur tujuan, tindakan paksa, pengulangan, dan kesendirian Yesus dipertahankan.
