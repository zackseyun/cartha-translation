  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan gerak, lokasi, dan kebersamaan dalam teks Yunani. Huruf kapital pada pronomina “-Nya” mengikuti konvensi penghormatan yang lazim dalam penerbitan Alkitab berbahasa Indonesia.
