base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: id
  text: Lalu Yesus naik ke gunung itu dan duduk di sana bersama murid-murid-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: naik
  rationale: Bentuk aoristus dari ἀνέρχομαι menyatakan gerak naik secara geografis. “Naik” alami dalam narasi Indonesia dan tidak memberi kesan kenaikan mulia seperti “naik ke surga”.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ melanjutkan alur narasi, bukan menyatakan pertentangan kuat. “Lalu” menyampaikan perkembangan peristiwa dengan wajar.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung itu
  rationale: Bersama verba gerak ἀνῆλθεν, frasa ini menunjukkan bahwa Yesus naik menuju atau ke bagian atas gunung. Artikel Yunani tercermin melalui “itu”, tanpa menyiratkan bahwa gunung tersebut memiliki nama tertentu.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Nama diri ini diterjemahkan menurut bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan lokatif yang alami dan tepat dalam bahasa Indonesia.
- source_word: ἐκάθητο
  choice: duduk
  rationale: Bentuk imperfek κάθημαι menggambarkan Yesus berada dalam posisi duduk. Dalam alur naratif Indonesia, “duduk” menyampaikan keadaan atau tindakan itu secara alami tanpa harus memperberat kalimat dengan “sedang duduk”.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: bersama murid-murid-Nya
  rationale: μετά dengan genitif berarti “bersama”, sedangkan μαθηταί dalam konteks Injil menunjuk para pengikut yang belajar dari seorang guru. “Murid-murid-Nya” merupakan ungkapan baku, jelas, dan mempertahankan relasi guru-pengikut tersebut.
theological_decisions: []
