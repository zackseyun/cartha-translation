  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: id
  text: Sementara itu, danau itu bergelora karena angin kencang sedang bertiup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “danau itu sedang bergolak” atau “danau itu sedang diaduk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: Sementara itu, danau
  rationale: θάλασσα berarti perairan besar; dalam konteks ini merujuk pada Danau Galilea. Bahasa Indonesia secara wajar menyebutnya 'danau', bukan 'laut'. Partikel τε menghubungkan keadaan ini dengan narasi sebelumnya dan diterjemahkan secara ringan sebagai 'Sementara itu'.
- source_word: ἀνέμου μεγάλου
  choice: angin kencang
  rationale: ἄνεμος berarti 'angin', sedangkan μέγας menyatakan besarnya kekuatan. 'Angin kencang' merupakan ungkapan cuaca yang alami dan tidak melebihkan intensitas seperti 'angin dahsyat'.
- source_word: πνέοντος
  choice: bertiup
  rationale: Partisipel kini aktif menggambarkan angin yang sedang bertiup. Dalam klausa sebab bahasa Indonesia, bentuk 'karena ... bertiup' menyampaikan hubungan keadaan dan aspek berlangsung secara alami.
- source_word: διεγείρετο
  choice: mulai bergelora
  rationale: Imperfek pasif menggambarkan perairan yang sedang digerakkan atau dikacaukan. 'Mulai bergelora' adalah ungkapan Indonesia yang wajar bagi danau yang menjadi berombak, sambil mempertahankan perkembangan keadaan yang tersirat oleh bentuk imperfek.
