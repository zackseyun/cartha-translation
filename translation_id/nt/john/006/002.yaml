  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: id
  text: Lalu, sejumlah besar orang terus mengikuti Dia, karena mereka melihat tanda-tanda[a] yang dilakukan-Nya pada orang-orang sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat” atau “tanda-tanda ajaib”; kata yang dipakai Yohanes menekankan apa yang dinyatakan oleh perbuatan-perbuatan ini mengenai Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: terus mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; 'terus mengikuti' menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini berfungsi sebagai penghubung ringan yang melanjutkan alur cerita, bukan sebagai pertentangan kuat.
- source_word: ὄχλος πολύς
  choice: orang banyak
  rationale: Ungkapan ini menunjuk pada kerumunan besar. 'Orang banyak' merupakan ungkapan naratif yang alami dan mudah dipahami; besarnya kelompok sudah terkandung dalam pemakaian ini.
- source_word: ἐθεώρουν
  choice: mereka melihat
  rationale: Bentuk imperfek menyiratkan pengamatan yang berulang atau berkelanjutan. Dalam bahasa Indonesia, 'mereka melihat' sudah alami dalam konteks alasan kebiasaan mengikuti Yesus tanpa perlu bentuk progresif yang kaku.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Dalam Injil Yohanes, istilah ini menunjuk bukan hanya pada perbuatan ajaib, tetapi juga pada apa yang disingkapkannya mengenai Yesus.
- source_word: ἐποίει
  choice: yang dilakukan-Nya
  rationale: Pilihan ini mempertahankan hubungan relatif dalam bahasa Yunani dan menyampaikan kegiatan Yesus secara wajar dalam bahasa Indonesia.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: atas orang-orang sakit
  rationale: '''Atas'' mempertahankan hubungan langsung antara perbuatan tanda itu dan orang sakit sebagai pihak yang dikenai tindakan, tanpa menambahkan gagasan penerima manfaat secara eksplisit.'
- source_word: ἀσθενούντων
  choice: orang-orang sakit
  rationale: Dalam konteks ini, partisip tersebut merujuk pada orang yang menderita penyakit fisik.
theological_decisions:
- issue: Istilah σημεῖα dalam Injil Yohanes
  choice: tanda-tanda
  alternative: mukjizat; tanda-tanda ajaib
  rationale: '''Tanda-tanda'' mempertahankan penekanan khas Yohanes pada makna penyataan dari karya-karya Yesus, bukan hanya sifat adikodratinya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
