source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: id
  text: 'Maka Yesus berkata kepada mereka, “Sesungguhnya, sesungguhnya Aku berkata kepada kalian: Jika kalian tidak makan daging[a] Anak Manusia dan minum darah-Nya, kalian tidak memiliki kehidupan[b] dalam diri kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tubuh”; kata Yunani yang digunakan adalah “daging” (σάρξ), yang mempertahankan daya konkret perkataan ini.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini hanya menyebut “kehidupan”, bukan “kehidupan kekal”, meskipun konteks yang lebih luas dalam Injil Yohanes sering menghubungkan kehidupan ini dengan kehidupan kekal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan yang bersifat konsekuensial dari percakapan sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan khas Injil Yohanes yang memberi penegasan khidmat pada pernyataan Yesus.
- source_word: ἐὰν μὴ
  choice: Jika ... tidak
  rationale: Mengungkapkan syarat negatif dalam bahasa Indonesia secara jelas; secara makna sepadan dengan 'kecuali jika' atau 'jika tidak'.
- source_word: φάγητε
  choice: makan
  rationale: Mempertahankan arti harfiah dan gambaran konkret yang disengaja dalam perkataan ini.
- source_word: σάρκα
  choice: daging
  rationale: Padanan langsung bagi σάρξ yang mempertahankan daya konkret dan tajam; 'tubuh' akan melunakkan atau menafsirkan istilah sumber.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar diri Yesus yang mapan serta gaung mesianik dan Danieliknya.
- source_word: πίητε
  choice: minum
  rationale: Arti harfiah yang mempertahankan kesejajaran dengan tindakan 'makan'.
- source_word: αἷμα
  choice: darah
  rationale: Padanan langsung yang mempertahankan gambaran tajam dan bobot teologis teks.
- source_word: ζωὴν
  choice: kehidupan
  rationale: Menerjemahkan nomina ζωή tanpa menambahkan sifat 'kekal' yang tidak terdapat dalam ayat ini.
- source_word: ἐν ἑαυτοῖς
  choice: dalam diri kalian
  rationale: Menyatakan frasa refleksif jamak secara alami dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah bahasa makan dan minum harus ditafsirkan secara sakramental atau metaforis dalam terjemahan
  choice: Mempertahankan ungkapan harfiah 'makan daging ... dan minum darah-Nya'
  alternative: Menggunakan ungkapan tafsiran seperti 'mengambil bagian', 'menerima', atau mengganti 'daging' dengan 'tubuh'
  rationale: Teks Yunani sengaja memakai gambaran yang konkret dan menggugah. Terjemahan mempertahankan ketegangan antara kemungkinan pemahaman sakramental, metaforis, atau keduanya tanpa menetapkan salah satunya.
- issue: Apakah ζωή harus diperluas menjadi 'kehidupan kekal' berdasarkan konteks Yohanes
  choice: Menggunakan 'kehidupan' saja
  alternative: kehidupan kekal
  rationale: Ayat ini tidak memuat αἰώνιος ('kekal'). Menambahkannya akan membuat konteks yang lebih luas menjadi bagian eksplisit dari teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Kalian' dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam sumber Yunani bersifat jamak; kapitalisasi 'Aku' dan bentuk '-Nya' mengikuti kebiasaan penulisan hormat dalam konteks Alkitab Indonesia.
