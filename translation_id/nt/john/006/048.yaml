  text: ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: id
  text: Akulah roti kehidupan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Akulah
  rationale: Bahasa Indonesia secara idiomatis dapat menyatakan identifikasi tegas ἐγώ εἰμι dengan bentuk berpartikel -lah. Pilihan ini mempertahankan subjek yang eksplisit dan penegasan diri tanpa menambahkan gagasan seperti 'Aku sendiri'.
- source_word: ὁ ἄρτος
  choice: roti
  rationale: Kata 'roti' adalah padanan alami bagi ἄρτος dalam metafora ini. Meskipun bahasa Indonesia tidak memiliki kata sandang tentu yang sepadan dengan ὁ, konstruksi predikatif 'Akulah roti...' tetap menyampaikan identifikasi yang khusus; 'sepotong roti' akan terlalu konkret.
- source_word: τῆς ζωῆς
  choice: kehidupan
  rationale: Bentuk ini mempertahankan hubungan genitif yang ringkas dalam ungkapan 'roti kehidupan', tanpa menjelaskannya secara interpretatif menjadi 'roti yang memberi hidup'.
theological_decisions:
- issue: Daya ungkapan ἐγώ εἰμι dalam Kristologi Yohanes
  choice: Akulah
  alternative: Aku adalah; Aku sendiri adalah
  rationale: Ayat ini memakai ἐγώ εἰμι dengan predikat, bukan sebagai ungkapan absolut. 'Akulah' mempertahankan identifikasi diri Yesus yang kuat dan alami dalam bahasa Indonesia tanpa mengubahnya menjadi rumusan teologis yang lebih eksplisit atau menambahkan 'sendiri'.
- issue: Makna hubungan genitif dalam τῆς ζωῆς
  choice: roti kehidupan
  alternative: roti yang memberi hidup; roti untuk hidup
  rationale: 'Ungkapan formal yang ringkas menjaga keluasan makna sumber: roti ini dapat dipahami berkaitan dengan, memiliki, dan memberi kehidupan. Terjemahan tidak memilih hanya satu penjelasan yang mungkin.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, wajar, dan bermartabat. Partikel -lah memberi penegasan yang sesuai bagi pernyataan identitas ini tanpa terasa kaku. Tidak diperlukan catatan kaki.
