  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: id
  text: Sesudah itu[a], Yesus pergi ke seberang Danau Galilea[b], yang juga disebut Danau Tiberias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Sesudah hal-hal itu.” Bentuk Yunani memakai kata tunjuk jamak untuk merujuk pada peristiwa-peristiwa sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: “Danau Galilea” juga dikenal sebagai “Danau Tiberias.” Kedua nama itu menunjuk pada perairan yang sama.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini merupakan peralihan naratif yang alami dalam bahasa Indonesia. Bentuk Yunani memakai kata tunjuk jamak dan secara lebih harfiah berarti “sesudah hal-hal itu”; nuansa tersebut dicatat dalam catatan kaki.
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Dalam konteks ini, bentuk aoris dari ἀπέρχομαι menyatakan bahwa Yesus bergerak meninggalkan tempat sebelumnya. “Pergi” menyampaikan tindakan itu secara wajar tanpa menambahkan keterangan yang tidak terdapat dalam teks.
- source_word: πέραν
  choice: ke seberang
  rationale: Dengan latar penyeberangan suatu perairan, πέραν menunjuk pada sisi seberang yang dituju. “Ke seberang” merupakan padanan Indonesia yang ringkas dan idiomatis.
- source_word: θάλασσης
  choice: Danau
  rationale: Walaupun θάλασσα secara leksikal dapat berarti “laut”, perairan yang dimaksud secara geografis adalah sebuah danau. “Danau Galilea” dan “Danau Tiberias” adalah nama yang jelas dan alami bagi pembaca Indonesia modern.
- source_word: τῆς Γαλιλαίας τῆς Τιβεριάδος
  choice: Galilea, yaitu Danau Tiberias
  rationale: Dua bentuk genitif tersebut menerangkan perairan yang sama dengan dua penamaan. “Yaitu” mempertahankan hubungan aposisionalnya dan menghindari susunan genitif yang kaku dalam bahasa Indonesia.
