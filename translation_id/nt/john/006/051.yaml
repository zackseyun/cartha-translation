  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: id
  text: Akulah roti hidup yang telah turun dari surga. Jika seseorang makan dari roti ini, ia akan hidup selama-lamanya.[a] Dan roti yang akan Kuberikan demi kehidupan dunia adalah daging-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “ia akan hidup memasuki zaman itu”; ungkapan ini berarti hidup selama-lamanya.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “daging”, bukan “tubuh”. Pilihan katanya sengaja konkret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν
  choice: Akulah roti hidup
  rationale: Bentuk "Akulah" secara alami memberi penegasan pada ἐγώ εἰμι, sedangkan "roti hidup" mempertahankan ζῶν sebagai sifat roti dan tidak menggantinya dengan ungkapan berbeda, "roti kehidupan".
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: yang telah turun dari surga
  rationale: Partisip aoris καταβάς menunjuk pada turunnya yang telah terjadi; klausa relatif ini alami dalam bahasa Indonesia dan tetap mempertahankan klaim asal surgawi.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Jika seseorang makan dari roti ini
  rationale: ἐάν dengan subjungtif menyatakan syarat umum, τις bersifat tidak tentu dan inklusif, dan "makan dari" cukup alami sekaligus mencerminkan ἐκ.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: ia akan hidup selama-lamanya
  rationale: Ungkapan εἰς τὸν αἰῶνα dalam konteks Yohanes menyatakan kelangsungan tanpa akhir; "selama-lamanya" adalah padanan Indonesia yang jelas dan wajar.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: Dan roti yang akan Kuberikan
  rationale: δέ mengembangkan pernyataan sebelumnya tanpa pertentangan kuat, sehingga "Dan" sesuai; bentuk mendatang δώσω tetap dipertahankan.
- source_word: ἡ σάρξ μού ἐστιν
  choice: adalah daging-Ku
  rationale: σάρξ diterjemahkan konkret sebagai "daging", bukan diperhalus menjadi "tubuh"; susunan kalimat Indonesia tetap menonjolkan identifikasi yang mengejutkan ini.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: demi kehidupan dunia
  rationale: '"Demi" menyampaikan nuansa benefaktif atau demi kepentingan pada ὑπέρ tanpa memaksakan teori tertentu tentang cara pemberian itu menghasilkan hidup.'
- source_word: κόσμος
  choice: dunia
  rationale: '"Dunia" mempertahankan keluasan dan gema khas κόσμος dalam Injil Yohanes tanpa mempersempitnya menjadi kelompok tertentu.'
theological_decisions:
- issue: Makna σάρξ dalam pemberian diri Yesus
  choice: daging dalam teks utama
  alternative: tubuh
  rationale: Kata Yunani bersifat konkret dan sengaja kuat. "Tubuh" akan melunakkan sekaligus menafsirkan ungkapan itu, sedangkan "daging" menjaga ketegangan teks.
- issue: Cakupan κόσμος
  choice: mempertahankan dunia tanpa pembatasan
  alternative: umat manusia atau suatu kelompok pilihan
  rationale: Teks memakai istilah luas "dunia". Terjemahan tidak mempersempit cakupannya berdasarkan suatu sistem teologis.
- issue: Daya kristologis ungkapan turun dari surga
  choice: diterjemahkan langsung sebagai tindakan turun yang telah terjadi
  alternative: sekadar pengutusan ilahi secara metaforis
  rationale: Bahasa sumber menyatakan asal dan gerak turun dari surga secara lugas; terjemahan mempertahankannya tanpa pengenceran atau penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pronomina terikat pada "Kuberikan" dan "daging-Ku" mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Pronomina generik "ia" mempertahankan bentuk tunggal tanpa membatasi jenis kelamin.
