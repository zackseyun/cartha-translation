  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: id
  text: Sama seperti Bapa yang hidup mengutus Aku, dan Aku hidup karena Bapa, demikian juga orang yang memakan Aku[a] akan hidup karena Aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang digunakan bersifat konkret dan kuat, secara harfiah berarti makan dan dapat menggambarkan tindakan mengunyah.
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui Bapa” dan “melalui Aku.” Kata depan Yunani ini dapat dipahami dalam arti sebab maupun perantaraan; teks utama memakai arti sebab untuk mempertahankan kesejajaran antara Bapa dan Anak serta antara Anak dan orang yang memakan-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Sama seperti ... demikian juga
  rationale: Menandai perbandingan yang menguasai seluruh kalimat; “demikian juga” membuat kesejajarannya jelas dan alami dalam bahasa Indonesia.
- source_word: ὁ ζῶν πατὴρ
  choice: Bapa yang hidup
  rationale: Mempertahankan bentuk atributif dan penekanan Yohanes pada hidup tanpa menambahkan gagasan “pemberi hidup” yang tidak dinyatakan langsung oleh partisip tersebut.
- source_word: ἀπέστειλέν με
  choice: mengutus Aku
  rationale: “Mengutus” merupakan padanan alami bagi verba pengutusan dalam konteks misi Yesus dan mempertahankan bentuk lampau aoristus tanpa perlu menambahkan aspek lain.
- source_word: κἀγὼ ζῶ
  choice: dan Aku hidup
  rationale: Mempertahankan kala kini serta kesejajaran verbal dengan “akan hidup” pada klausa terakhir.
- source_word: διὰ τὸν πατέρα
  choice: karena Bapa
  rationale: διά dengan akusatif paling wajar menyatakan sebab atau dasar di sini; pilihan ini juga menjaga kesejajaran dengan δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: orang yang memakan Aku
  rationale: τρώγω adalah verba makan yang konkret dan kuat. “Memakan” mempertahankan gambaran tersebut tanpa memaksakan penafsiran sakramental maupun semata-mata metaforis.
- source_word: κἀκεῖνος
  choice: demikian juga orang itu secara idiomatis dinyatakan sebagai demikian juga orang yang
  rationale: Daya tekan “dia itu juga” diwakili oleh pasangan komparatif “sama seperti ... demikian juga,” sambil menjaga susunan bahasa Indonesia tetap alami.
- source_word: ζήσει
  choice: akan hidup
  rationale: Menerjemahkan futurum secara langsung dan mempertahankan motif serta kesejajaran kata “hidup” dalam ayat ini.
- source_word: δι’ ἐμέ
  choice: karena Aku
  rationale: Mempertahankan pengertian kausal yang sama dengan frasa mengenai Bapa, sehingga analogi Bapa-Anak dan Anak-orang percaya tetap terlihat.
theological_decisions:
- issue: Relasi hidup Anak dengan Bapa dalam διὰ τὸν πατέρα
  choice: Aku hidup karena Bapa
  alternative: Aku hidup melalui Bapa
  rationale: Terjemahan kausal mempertahankan bunyi dan analogi ayat tanpa menarik kesimpulan tentang hakikat atau tingkat keilahian Anak yang tidak dinyatakan oleh frasa ini sendiri.
- issue: Daya sakramental atau metaforis dari ὁ τρώγων με
  choice: orang yang memakan Aku
  alternative: orang yang menjadikan Aku makanannya
  rationale: Pilihan konkret ini membiarkan terbuka berbagai pemahaman teologis terhadap Yohanes 6 dan tidak mempersempit ungkapan itu menjadi salah satu tafsiran tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti “Aku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus. Ungkapan konkret “memakan Aku” sengaja dipertahankan agar ketegangan dan keluasan tafsir teks sumber tidak dihilangkan.
