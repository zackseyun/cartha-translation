  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: id
  text: Setelah mereka kenyang[a], Yesus berkata kepada murid-murid-Nya, “Kumpulkanlah potongan-potongan yang tersisa, supaya tidak ada yang hilang[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “setelah mereka dipenuhi”; dapat juga diterjemahkan “setelah mereka makan sampai kenyang.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “supaya tidak ada yang terbuang.” Bahasa Yunani secara lebih harfiah berbunyi “supaya tidak ada yang hilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐνεπλήσθησαν
  choice: Setelah mereka kenyang
  rationale: Ungkapan ini secara alami menyatakan bahwa orang banyak telah makan sampai kenyang. Bentuk pasif Yunani dapat diterjemahkan lebih harfiah sebagai ‘setelah mereka dipenuhi’, tetapi itu kurang wajar dalam bahasa Indonesia.
- source_word: λέγει
  choice: Yesus berkata
  rationale: Subjek yang tersirat diperjelas sebagai Yesus agar alami dan tidak ambigu dalam bahasa Indonesia. Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia ‘berkata’, karena bahasa Indonesia tidak menandai kala dan bentuk ini wajar dalam penceritaan.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: ‘Murid-murid’ merupakan padanan baku dan tepat bagi μαθηταί; akhiran ‘-Nya’ mempertahankan hubungan kepunyaan dalam αὐτοῦ.
- source_word: Συναγάγετε
  choice: Kumpulkanlah
  rationale: Bentuk perintah langsung dipertahankan dengan partikel ‘-lah’, yang terdengar tegas namun tetap wajar dan bermartabat.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: potongan-potongan yang tersisa
  rationale: κλάσματα menunjuk pada potongan atau pecahan makanan, khususnya roti, sedangkan περισσεύσαντα menyatakan yang tersisa. Susunan ini alami dan tidak menambahkan kata ‘roti’ yang tidak disebut eksplisit dalam frasa tersebut.
- source_word: ἵνα μή τι ἀπόληται
  choice: supaya tidak ada yang hilang
  rationale: Terjemahan ini mempertahankan arti dasar ἀπόλλυμι, ‘hilang’, dan cakupan netral τι, ‘apa pun/tidak ada yang’, tanpa mempersempitnya secara interpretatif menjadi ‘terbuang’.
theological_decisions:
- issue: Kemungkinan gema teologis ἀπόληται dalam konteks tanda
  choice: hilang
  alternative: terbuang; binasa
  rationale: Dalam konteks langsung, yang dibicarakan adalah potongan makanan yang tersisa. ‘Hilang’ mempertahankan pilihan leksikal Yunani dan memungkinkan adanya gema Yohanes yang lebih luas tanpa memaksakan makna soteriologis; ‘terbuang’ terlalu menafsirkan, sedangkan ‘binasa’ terlalu kuat dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Diksi ‘kenyang’, ‘kumpulkanlah’, dan ‘potongan-potongan yang tersisa’ menjaga kewajaran tuturan sekaligus ketepatan terhadap teks Yunani.
