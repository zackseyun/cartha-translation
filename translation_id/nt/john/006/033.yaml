  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: id
  text: Sebab roti dari Allah adalah Dia yang turun dari surga dan memberi hidup kepada dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang turun dari surga dan memberi hidup kepada dunia.” Susunan kata Yunani dapat dipahami secara lebih impersonal; bentuk partisipelnya yang maskulin juga dapat sesuai dengan kata Yunani untuk “roti,” yang berjenis kelamin maskulin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: roti
  rationale: Mempertahankan gambaran konkret yang menjadi pusat wacana ini, bukan menggeneralisasikannya menjadi ‘makanan’.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: Dalam bahasa Indonesia, ‘roti dari Allah’ secara alami menyatakan asal atau sumber sambil tetap menyisakan kemungkinan hubungan yang lebih luas dengan Allah; ‘roti Allah’ dapat terdengar seperti roti yang dimakan oleh Allah.
- source_word: ὁ καταβαίνων
  choice: Dia yang turun
  rationale: Partisipel berartikel ini berbentuk maskulin tunggal dan secara alami menunjuk kepada pribadi; ‘Dia yang turun’ mempertahankan daya personal tersebut dan wajar dalam bahasa Indonesia.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Padanan Indonesia yang lazim dan jelas untuk asal dari surga.
- source_word: ζωὴν
  choice: hidup
  rationale: Mempertahankan istilah sederhana dan berbobot yang penting dalam Injil Yohanes, tanpa mempersempitnya menjadi jenis kehidupan tertentu.
- source_word: διδοὺς
  choice: memberikan
  rationale: Menyatakan tindakan yang menjadi ciri pribadi tersebut dan berkoordinasi secara alami dengan ‘turun’.
- source_word: τῷ κόσμῳ
  choice: kepada dunia
  rationale: Mempertahankan keluasan κόσμος dalam Yohanes dan tidak mempersempitnya menjadi hanya ‘umat manusia’ atau ‘semua orang’.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan dasar atau penjelasan bagi pernyataan sebelumnya.
theological_decisions:
- issue: Rujukan personal atau impersonal dalam ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: 'Menggunakan bahasa personal: ‘Dia yang turun dari surga dan memberikan hidup kepada dunia.’'
  alternative: ‘apa yang turun dari surga dan memberikan hidup kepada dunia’
  rationale: Partisipel Yunani berbentuk maskulin tunggal dan konteks Yohanes mengarahkan kepada seorang pribadi. Terjemahan utama mempertahankan daya personal itu, sedangkan catatan kaki mengakui bahwa konstruksinya dapat dipahami secara lebih impersonal.
- issue: Cakupan κόσμος
  choice: Mempertahankan ‘dunia’.
  alternative: ‘umat manusia’ atau ‘semua orang’
  rationale: ‘Dunia’ menjaga keluasan istilah Yohanes dan tidak menyelesaikan secara diam-diam perdebatan teologis mengenai jangkauan atau penerapan pemberian hidup tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. ‘Dia’ dipakai untuk memperjelas rujukan personal tanpa menambahkan nama Yesus yang tidak disebutkan secara eksplisit dalam ayat ini. Tanda koma setelah ‘Sebab’ mengikuti jeda penjelas, sementara istilah ‘roti’, ‘hidup’, dan ‘dunia’ dipertahankan demi kesinambungan kosakata Yohanes.
