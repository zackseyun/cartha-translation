  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: id
  text: Semua yang Bapa berikan kepada-Ku[a] akan datang kepada-Ku, dan orang yang datang kepada-Ku sama sekali tidak akan Kuusir keluar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Segala sesuatu yang Bapa berikan kepada-Ku.” Bahasa Yunani memakai bentuk netral tunggal yang bermakna kolektif.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “tidak akan pernah Kuusir keluar.” Ungkapan Yunani memakai penyangkalan yang sangat tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Semua yang
  rationale: Bentuk netral tunggal ini berfungsi secara kolektif. “Semua yang” alami dalam bahasa Indonesia dan mempertahankan sifat kolektifnya tanpa secara eksplisit mengubahnya menjadi “setiap orang yang” atau membatasinya pada benda.
- source_word: δίδωσίν μοι
  choice: Bapa berikan kepada-Ku
  rationale: Bentuk kini δίδωσιν diterjemahkan dengan bentuk Indonesia yang tidak menandai waktu secara berlebihan; susunan aktif mempertahankan Bapa sebagai pelaku pemberian.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Dalam konteks Yohanes, “Bapa” merupakan sebutan yang wajar dan luhur. Tidak ditambahkan kata milik “Bapa-Ku” karena teks Yunani tidak memuat pronomina posesif.
- source_word: πρὸς ἐμὲ ἥξει
  choice: akan datang kepada-Ku
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran khas Yohanes tentang datang kepada Yesus.
- source_word: τὸν ἐρχόμενον πρός με
  choice: orang yang datang kepada-Ku
  rationale: Partisipel dengan artikel diterjemahkan sebagai ungkapan generik yang alami. “Orang yang” mempertahankan acuan personal tanpa memperluasnya menjadi rumusan doktrinal.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: sama sekali tidak akan Kubuang ke luar
  rationale: “Sama sekali tidak” menyampaikan negasi Yunani yang sangat tegas, sedangkan “buang ke luar” mempertahankan baik gagasan pengusiran dalam ἐκβάλω maupun penguatan arah ἔξω.
theological_decisions:
- issue: Bentuk netral kolektif πᾶν ὃ dalam kaitannya dengan pemberian Bapa dan tindakan datang kepada Yesus
  choice: Dipertahankan sebagai “Semua yang Bapa berikan kepada-Ku.”
  alternative: “Setiap orang yang Bapa berikan kepada-Ku” atau “Segala sesuatu yang Bapa berikan kepada-Ku.”
  rationale: Pilihan ini menjaga bentuk kolektif dan ambiguitas asli tanpa memutuskan apakah tekanannya terutama pada umat sebagai satu keseluruhan atau pada orang-orang secara individual.
- issue: Kekuatan janji dalam οὐ μὴ ἐκβάλω ἔξω
  choice: Diterjemahkan sebagai jaminan tegas, “sama sekali tidak akan Kubuang ke luar.”
  alternative: “tidak akan pernah Kubuang ke luar.”
  rationale: Terjemahan mempertahankan negasi yang emfatis dan janji penerimaan oleh Yesus, tetapi tidak mengembangkannya menjadi rumusan denominasi tertentu mengenai ketekunan atau kemurtadan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pada bentuk terikat “-Ku” mengikuti rujukan kepada Yesus. Susunan kalimat mempertahankan kesejajaran antara apa yang diberikan Bapa, yang datang kepada Yesus, dan penerimaan tegas oleh Yesus.
