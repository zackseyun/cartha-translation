  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: id
  text: Kami telah percaya dan telah mengetahui bahwa Engkaulah Yang Kudus dari Allah[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Mesias, Anak Allah Yang Hidup.”
    reason: textual_variant
  - marker: b
    text: Atau, “Yang Kudus milik Allah.” Bentuk genitif dalam bahasa Yunani dapat menyatakan hubungan, kepunyaan, atau asal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: kami
  rationale: Kata ganti eksplisit ini menegaskan kelompok para murid yang diwakili Petrus. “Kami” sesuai karena pembicara tidak menyertakan Yesus sebagai lawan bicara.
- source_word: πεπιστεύκαμεν
  choice: telah percaya
  rationale: Bentuk perfek menyatakan tindakan percaya yang telah terjadi dengan keadaan yang tetap berlangsung; “telah percaya” mempertahankan unsur tersebut tanpa menambahkan gagasan proses yang tidak dinyatakan secara eksplisit.
- source_word: ἐγνώκαμεν
  choice: telah mengetahui
  rationale: Bentuk perfek menunjukkan pengetahuan yang telah diperoleh dan tetap dimiliki. Karena objeknya berupa pernyataan tentang identitas Yesus, “mengetahui” lebih alami daripada “mengenal” dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari kepercayaan dan pengetahuan, bukan alasan bagi keduanya.
- source_word: ὁ ἅγιος
  choice: Yang Kudus
  rationale: Ungkapan berartikel ini berfungsi sebagai gelar kristologis dan menunjuk kepada pribadi yang secara khas kudus atau dikhususkan oleh Allah.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: Dalam gelar ini, “dari Allah” merupakan ungkapan Indonesia yang alami dan tetap dapat menyatakan kaitan erat dengan Allah, meskipun pembaca dapat memahaminya terutama sebagai asal. Catatan kaki mempertahankan kemungkinan nuansa kepunyaan atau hubungan.
- source_word: σὺ εἶ
  choice: Engkaulah
  rationale: Partikel “-lah” secara alami mempertahankan penekanan pada kata ganti σὺ dalam pernyataan identitas ini; “Engkau” digunakan sebagai sapaan yang bermartabat kepada Yesus.
theological_decisions:
- issue: Gelar kristologis dalam Yohanes 6:69
  choice: Yang Kudus dari Allah
  alternative: Mesias, Anak Allah yang hidup
  rationale: Teks SBLGNT berbunyi ὁ ἅγιος τοῦ θεοῦ, sehingga gelar tersebut diterjemahkan langsung dan tidak diselaraskan dengan Matius 16:16 atau bacaan naskah lain. Varian yang lebih panjang dicatat dalam catatan kaki.
- issue: Makna hubungan genitif τοῦ θεοῦ
  choice: dari Allah
  alternative: Yang Kudus milik Allah
  rationale: Bahasa Yunani dapat menunjukkan hubungan, kepunyaan, atau asal. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan catatan kaki menyatakan kemungkinan lain tanpa menetapkan satu penafsiran teologis secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel “telah percaya dan telah mengetahui” mempertahankan dua verba perfek Yunani. Kapitalisasi “Yang Kudus” menandai fungsinya sebagai gelar, bukan sekadar sifat.
