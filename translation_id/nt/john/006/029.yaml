id: JHN.6.29
reference: John 6:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: id
  text: Yesus menjawab dan berkata kepada mereka, “Inilah pekerjaan Allah[a], yaitu kamu percaya kepada[b] orang yang telah diutus-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pekerjaan yang Allah kehendaki” atau “pekerjaan yang Allah kerjakan.” Frasa Yunani “pekerjaan Allah” dapat dipahami dengan lebih dari satu cara; terjemahan utama mempertahankan ketaksaan itu.
    reason: alternative_reading
  - marker: b
    text: Atau “menaruh kepercayaan kepada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: menjawab dan berkata
  rationale: Mempertahankan konstruksi dua verba dalam narasi Yunani dengan ungkapan Indonesia yang jelas dan tetap wajar.
- source_word: Τοῦτό ἐστιν
  choice: Inilah
  rationale: Menyampaikan demonstratif dan kopula secara ringkas serta tegas dalam bahasa Indonesia.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: pekerjaan Allah
  rationale: Padanan dekat yang mempertahankan kemungkinan bahwa frasa ini berarti pekerjaan yang Allah kehendaki maupun pekerjaan yang Allah kerjakan.
- source_word: ἵνα πιστεύητε
  choice: yaitu kamu percaya
  rationale: Menyatakan isi pekerjaan tersebut tanpa mengubah bentuknya menjadi perintah langsung; bentuk kini subjungtif diterjemahkan secara idiomatis.
- source_word: πιστεύητε εἰς
  choice: percaya kepada
  rationale: Dalam pemakaian Yohanes, konstruksi ini menunjuk kepada kepercayaan yang terarah kepada seseorang; 'percaya kepada' merupakan ungkapan Indonesia yang alami.
- source_word: εἰς ὃν
  choice: kepada orang yang
  rationale: Mempertahankan objek personal tanpa memakai susunan harfiah yang kaku.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: telah diutus-Nya
  rationale: Bentuk pasif Indonesia secara alami menunjukkan bahwa Allah adalah pengutus melalui akhiran -Nya, sekaligus mempertahankan relevansi pengutusan itu bagi konteks sekarang.
theological_decisions:
- issue: Makna genitif dalam τὸ ἔργον τοῦ θεοῦ
  choice: Mempertahankan frasa “pekerjaan Allah” dalam teks utama.
  alternative: “pekerjaan yang Allah kehendaki” atau “pekerjaan yang Allah kerjakan”
  rationale: Genitif Yunani dapat dipahami sebagai pekerjaan yang dituntut atau dikehendaki Allah, atau sebagai pekerjaan yang dilakukan Allah. Teks utama tidak menetapkan salah satu tafsiran.
- issue: Makna πιστεύητε εἰς
  choice: “percaya kepada”
  alternative: “menaruh kepercayaan kepada”
  rationale: “Percaya kepada” adalah padanan standar dan jelas, sedangkan alternatif menonjolkan unsur kepercayaan personal yang juga terkandung dalam verba Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “menjawab dan berkata” sengaja mempertahankan dua verba sumber. Frasa “pekerjaan Allah” dipertahankan agar ketaksaan teologis dalam genitif Yunani tidak diselesaikan secara sepihak.
