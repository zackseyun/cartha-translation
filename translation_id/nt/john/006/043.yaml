  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepada mereka, “Jangan bersungut-sungut di antara kalian[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan satu sama lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Bentuk aoristus deponen dari ἀποκρίνομαι lazim berarti ‘menjawab’; pilihan ini mempertahankan fungsi tuturan dalam narasi.
- source_word: εἶπεν
  choice: berkata
  rationale: Dalam rumusan naratif ini, λέγω paling wajar diterjemahkan ‘berkata’. Kedua verba dipertahankan agar ungkapan Yunani ‘menjawab dan berkata’ tetap tampak tanpa menjadi tidak alami dalam bahasa Indonesia.
- source_word: Μὴ γογγύζετε
  choice: Jangan bersungut-sungut
  rationale: Imperatif kini dengan μή dapat melarang tindakan yang sedang berlangsung atau memberi larangan umum. ‘Jangan bersungut-sungut’ mempertahankan makna γογγύζω serta gaung bahasa Alkitab tentang keluhan umat, tanpa secara tegas memilih nuansa ‘berhentilah’.
- source_word: μετ’ ἀλλήλων
  choice: di antara kalian
  rationale: Frasa ini menunjuk tindakan yang terjadi secara timbal balik dalam kelompok. ‘Di antara kalian’ alami dalam bahasa Indonesia modern dan sesuai dengan konteks sungut-sungut di dalam kerumunan.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
