  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘kalian’ dipilih untuk menandai orang kedua jamak secara jelas; ‘bersungut-sungut’ dipertahankan karena alami dalam register Alkitab dan membawa gaung naratif yang lebih kuat daripada sekadar ‘mengeluh’.
