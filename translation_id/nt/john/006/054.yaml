  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: id
  text: Orang yang memakan[a] daging-Ku dan meminum darah-Ku memiliki hidup kekal, dan Aku akan membangkitkan orang itu pada hari terakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “memakan” lebih konkret daripada kata umum untuk “makan” dan juga dapat berarti “mengunyah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Orang yang memakan
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk kepada seseorang yang dicirikan oleh tindakan tersebut. Bentuk ini mempertahankan acuan tunggal serta nuansa tindakan yang berlangsung atau menjadi kebiasaan.
- source_word: τρώγων
  choice: memakan
  rationale: Kata ini bersifat lebih konkret daripada kata umum untuk makan dan dapat menyiratkan mengunyah. “Memakan” alami dalam bahasa Indonesia serta mempertahankan objek konkret tanpa membuat ungkapan utama terlalu grafis; nuansa yang lebih kuat dicatat dalam catatan kaki.
- source_word: μου τὴν σάρκα
  choice: daging-Ku
  rationale: σάρξ di sini menunjuk secara konkret kepada daging, bukan sekadar tubuh atau tabiat berdosa. Terjemahan literal mempertahankan ketegangan ungkapan sumber.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: dan meminum darah-Ku
  rationale: Partisipel kini kedua sejajar dengan τρώγων. “Meminum” mempertahankan kesejajaran bentuk dan “darah” dibiarkan literal tanpa diperhalus.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: memiliki hidup kekal
  rationale: Bentuk kini ἔχει menyatakan kepemilikan pada masa sekarang. “Hidup kekal” merupakan ungkapan Yohanes yang alami dan mapan serta mencakup baik sifat maupun keberlangsungan hidup tersebut.
- source_word: κἀγὼ ἀναστήσω
  choice: dan Aku akan membangkitkan
  rationale: κἀγώ menggabungkan “dan” dengan subjek “Aku” yang tegas, sedangkan ἀναστήσω dalam konteks ini menyatakan tindakan membangkitkan dari kematian pada masa mendatang.
- source_word: αὐτὸν
  choice: orang itu
  rationale: Ungkapan ini mempertahankan acuan tunggal kepada orang yang disebut pada awal ayat. Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga; “orang itu” juga menghindari kemungkinan acuan yang kabur.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: pada hari terakhir
  rationale: Ini adalah ungkapan eskatologis yang berulang dalam Injil Yohanes. “Pada hari terakhir” alami dalam bahasa Indonesia modern dan dekat dengan bentuk sumber.
theological_decisions:
- issue: Apakah bahasa makan dan minum harus ditafsirkan secara sakramental atau metaforis dalam teks utama
  choice: Bahasa konkret tentang memakan daging dan meminum darah dipertahankan tanpa penjelasan interpretatif
  alternative: Menjelaskannya secara eksplisit sebagai Perjamuan Kudus atau sebagai metafora untuk percaya
  rationale: Teks Yunani sendiri memakai istilah konkret. Mempertahankan kata-kata itu menjaga ambiguitas dan ketegangan teologis tanpa memasukkan tafsiran denominasi tertentu.
- issue: Acuan tunggal αὐτόν dalam bahasa Indonesia yang tidak menandai gender
  choice: orang itu
  alternative: dia
  rationale: αὐτόν merujuk kembali kepada subjek tunggal. Karena pronomina bahasa Indonesia tidak membedakan gender, “orang itu” mempertahankan ketunggalan dan memperjelas hubungan acuannya tanpa menambahkan jenis kelamin yang tidak dapat dinyatakan secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “daging-Ku” dan “darah-Ku” mempertahankan bahasa konkret sumber, sedangkan “orang itu” menjaga acuan tunggal dengan wajar dalam sistem pronomina bahasa Indonesia.
