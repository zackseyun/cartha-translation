  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: id
  text: Namun, Yesus mengetahui dalam diri-Nya bahwa murid-murid-Nya menggerutu tentang hal itu. Ia berkata kepada mereka, “Apakah hal ini membuat kalian tersandung?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah hal ini menyinggung perasaan kalian?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: karena ... tahu
  rationale: Partisip ini menyatakan keadaan yang menjadi latar bagi ucapan Yesus. Bentuk kausal menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan maknanya.
- source_word: ἐν ἑαυτῷ
  choice: dalam diri-Nya
  rationale: Ungkapan ini mempertahankan nuansa bahwa Yesus mengetahui hal tersebut secara batiniah, bukan karena laporan dari luar.
- source_word: γογγύζουσιν
  choice: menggerutu
  rationale: Kata ini menunjuk pada keluhan tidak puas yang diucapkan dengan suara rendah. 'Menggerutu' lebih tepat daripada 'mengeluh' dan lebih alami daripada 'bersungut-sungut' dalam bahasa Indonesia modern.
- source_word: περὶ τούτου
  choice: tentang hal itu
  rationale: Terjemahan ini secara alami merujuk kembali pada perkataan Yesus sebelumnya tanpa menambahkan penjelasan yang tidak terdapat dalam teks.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan idiomatis yang tidak membatasi kelompok tersebut hanya pada kedua belas murid.
- source_word: Τοῦτο
  choice: hal ini
  rationale: Demonstrativa tetap ringkas dan menunjuk pada perkataan sebelumnya tanpa menambahkan kata seperti 'ajaran'.
- source_word: σκανδαλίζει
  choice: membuat kalian tersandung
  rationale: Pilihan ini mempertahankan metafora Yunani dan kemungkinan makna yang lebih kuat daripada sekadar merasa tersinggung, yakni menjadi terhalang atau terdorong untuk meninggalkan iman.
theological_decisions:
- issue: Makna σκανδαλίζει dalam konteks kemungkinan penolakan terhadap perkataan Yesus
  choice: Apakah hal ini membuat kalian tersandung?
  alternative: Apakah hal ini menyinggung perasaan kalian?
  rationale: Metafora 'tersandung' mempertahankan ketegangan antara rasa tersinggung dan bahaya rohani berupa penolakan atau kemurtadan. Catatan kaki menyajikan padanan emosional yang juga mungkin tanpa membatasi makna teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti jamak 'kalian' memperjelas ὑμᾶς; kapitalisasi pada unsur pronominal yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
