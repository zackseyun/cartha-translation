revisions:
- from: Maka mereka bersedia menerima Dia ke dalam perahu, dan seketika itu juga perahu itu sudah berada di daratan yang mereka tuju.[a]
  to: Maka mereka bersedia membawa Dia ke dalam perahu, dan seketika itu juga perahu itu tiba di daratan yang mereka tuju.[a]
  rationale: Revisi menghindari kesan yang tidak dimaksudkan bahwa perahu berada di atas tanah kering, sambil mempertahankan kesegeraan εὐθέως dan sifat singkat-peristiwa dari ἐγένετο. “Bersedia membawa Dia ke dalam perahu” juga lebih alami dalam bahasa Indonesia dan tetap mencerminkan kesediaan yang dinyatakan oleh imperfek ἤθελον.
