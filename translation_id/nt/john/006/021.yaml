review_pass:
  verdict: revise
  source_fidelity: Klausa pertama dan penanda kesegeraan diterjemahkan dengan baik. Namun, “perahu itu sudah berada di daratan” dalam bahasa Indonesia lazimnya dapat membayangkan perahu sudah berada di atas tanah kering/terdampar. Konstruksi Yunani ἐγένετο ... ἐπὶ τῆς γῆς menyatakan bahwa perahu itu tiba atau mendapati dirinya di daratan tujuan, tanpa menuntut gambaran perahu terdampar.
  naturalness: “Maka mereka bersedia menerima Dia ke dalam perahu” dapat dipahami, tetapi “bersedia membawa Dia ke dalam perahu” lebih idiomatis untuk tindakan konkret λαβεῖν αὐτὸν εἰς τὸ πλοῖον. “Tiba di daratan” juga lebih alami dan jelas daripada “berada di daratan” dalam konteks perahu.
  terminology: “Perahu,” “Dia,” “seketika itu juga,” dan “daratan” sesuai dengan register Alkitab bahasa Indonesia baku modern. Kapitalisasi “Dia” dapat dipertahankan sebagai konvensi editorial yang umum. Catatan kaki tetap memberikan alternatif “pantai” yang sah bagi γῆ.
  issues:
  - severity: medium
    issue: Ungkapan “perahu itu sudah berada di daratan” berpotensi menyiratkan bahwa perahu berada di atas tanah kering.
    rationale: Dalam pemakaian Indonesia modern, “di daratan” untuk sebuah perahu dapat terdengar seperti perahu telah ditarik ke darat atau terdampar. Teks Yunani menyatakan pencapaian daratan tujuan secara mendadak, bukan posisi fisik perahu di atas tanah.
  - severity: low
    issue: “Menerima Dia ke dalam perahu” kurang idiomatis dibandingkan “membawa Dia ke dalam perahu.”
    rationale: λαμβάνειν di sini menunjuk tindakan membawa Yesus masuk/naik ke perahu. “Membawa” menyampaikan tindakan konkret itu secara lebih wajar tanpa menambah penafsiran.
  revised_text: Maka mereka bersedia membawa Dia ke dalam perahu, dan seketika itu juga perahu itu tiba di daratan yang mereka tuju.[a]
  revised_footnotes:
  - marker: a
    text: Atau, “dan seketika itu juga perahu itu tiba di pantai yang mereka tuju.”
    reason: Alternatif leksikal untuk γῆς (“daratan” atau “pantai”) dalam ungkapan ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς.
  revision_rationale: Revisi menghindari kesan yang tidak dimaksudkan bahwa perahu berada di atas tanah kering, sambil mempertahankan kesegeraan εὐθέως dan sifat singkat-peristiwa dari ἐγένετο. “Bersedia membawa Dia ke dalam perahu” juga lebih alami dalam bahasa Indonesia dan tetap mencerminkan kesediaan yang dinyatakan oleh imperfek ἤθελον.
