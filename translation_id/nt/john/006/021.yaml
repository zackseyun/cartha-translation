  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: id
  text: Maka mereka bersedia membawa Dia ke dalam perahu, dan seketika itu juga perahu itu tiba di daratan yang mereka tuju.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan seketika itu juga perahu itu tiba di pantai yang mereka tuju.”
    reason: Alternatif leksikal untuk γῆς (“daratan” atau “pantai”) dalam ungkapan ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς.
lexical_decisions:
- source_word: ἤθελον
  choice: mereka bersedia
  rationale: Bentuk imperfek θέλω di sini paling wajar menyatakan kesediaan setelah ketakutan mereka mereda, bukan sekadar keinginan sesaat.
- source_word: οὖν
  choice: Maka
  rationale: Menandai konsekuensi naratif dari perkataan Yesus pada ayat sebelumnya dengan penghubung Indonesia yang alami dan bermartabat.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: menerima Dia ke dalam perahu
  rationale: λαμβάνω dapat berarti mengambil atau menerima. Dalam konteks para murid menyambut Yesus masuk ke perahu, “menerima” alami serta mempertahankan nuansa keterbukaan mereka kepada-Nya.
- source_word: πλοῖον
  choice: perahu
  rationale: Sesuai dengan kendaraan air dalam konteks Danau Galilea; “kapal” dapat memberi kesan terlalu besar.
- source_word: εὐθέως
  choice: seketika itu juga
  rationale: Mengungkapkan kesegeraan yang tegas dan mempertahankan daya kejut serta kemungkinan nuansa mukjizat dalam narasi.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: perahu itu sudah berada di daratan
  rationale: Mencerminkan konstruksi lokatif Yunani tanpa menyatakan bahwa perahu terdampar di atas tanah. Kata “sudah” membantu menyampaikan peralihan mendadak menuju keadaan berada di tujuan.
- source_word: γῆς
  choice: daratan
  rationale: γῆ di sini menunjuk tempat pendaratan atau wilayah tujuan. “Daratan” dekat dengan bentuk sumber dan tidak membatasi maknanya hanya pada garis pantai.
- source_word: εἰς ἣν ὑπῆγον
  choice: yang mereka tuju
  rationale: Ungkapan ringkas dan alami dalam bahasa Indonesia untuk gerak yang sedang berlangsung menuju suatu tujuan.
theological_decisions:
- issue: Apakah klausa kedua perlu dibuat lebih biasa sehingga kesan terjadinya perpindahan secara ajaib berkurang
  choice: Mempertahankan pernyataan langsung bahwa seketika itu juga perahu sudah berada di daratan tujuan
  alternative: seketika itu juga perahu tiba di pantai yang mereka tuju
  rationale: Teks Yunani menyampaikan kejadian itu secara singkat dengan kesegeraan yang mencolok. Terjemahan utama mempertahankan ketegangan naratif tersebut tanpa menjelaskan atau mengurangi kemungkinan daya ajaibnya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapitalisasi “Dia” mengikuti kebiasaan umum teks Alkitab bahasa Indonesia ketika merujuk kepada Yesus. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan seluruh klausa kedua.
