base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: orang yang percaya[a] memiliki hidup kekal.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “siapa yang percaya.” Secara lebih harfiah, bahasa Yunani memakai partisip kini berartikel: “orang yang percaya.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “kehidupan yang kekal.” Secara lebih harfiah, “kehidupan yang bersifat kekal” atau “kehidupan dari zaman yang akan datang”; ungkapan Yunani ini dapat mencakup kedua nuansa tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Pengulangan dipertahankan sebagai penanda wacana yang khidmat dan tegas, sekaligus diungkapkan dalam bahasa Indonesia yang wajar.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Bentuk kini λέγω diterjemahkan langsung sebagai 'berkata', sedangkan ὑμῖν adalah bentuk jamak sehingga 'kalian' menghindari kesan bahwa Yesus hanya berbicara kepada satu orang.
- source_word: ὁ πιστεύων
  choice: orang yang percaya
  rationale: Frasa ini menerjemahkan partisip kini berartikel yang berfungsi sebagai nomina, yaitu seseorang yang dicirikan oleh tindakan percaya, tanpa membuat aspek kininya menjadi syarat teologis tambahan.
- source_word: ἔχει
  choice: memiliki
  rationale: Kata kerja bentuk kini ini menyatakan bahwa hidup kekal sudah dimiliki sekarang; 'memiliki' terdengar jelas dan alami dalam konteks ini.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini adalah padanan Indonesia yang mapan dan alami, serta menyampaikan kehidupan yang tidak berkesudahan tanpa meniadakan nuansa kehidupan yang berkaitan dengan zaman yang akan datang.
theological_decisions:
- issue: Hidup kekal sebagai milik pada masa kini
  choice: memiliki hidup kekal
  alternative: akan memiliki hidup kekal
  rationale: ἔχει berbentuk kini, bukan akan datang. Terjemahan mempertahankan pernyataan Yohanes bahwa hidup kekal merupakan kenyataan masa kini tanpa menjelaskan lebih jauh hubungan kenyataan itu dengan penggenapannya kelak.
- issue: Cakupan ὁ πιστεύων
  choice: orang yang percaya
  alternative: siapa pun yang percaya
  rationale: Terjemahan utama mempertahankan bentuk tunggal substantival dari bahasa Yunani. Alternatif yang lebih idiomatis dapat menyatakan cakupan umum, tetapi teks tidak perlu diperluas dengan kata 'pun'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan pembuka dipertahankan untuk menjaga irama khas Yohanes. 'Kalian' dipilih karena pronomina Yunani berbentuk jamak. Huruf kapital pada 'Aku' mengikuti kelaziman penerbitan Alkitab Indonesia ketika Yesus berbicara, tanpa mengubah makna gramatikal sumber.
