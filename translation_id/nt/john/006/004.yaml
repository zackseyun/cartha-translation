id: JHN.6.4
reference: John 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: id
  text: Hari Raya Paskah[a], yaitu perayaan orang Yahudi, sudah dekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perayaan orang Yudea.” Istilah Yunani yang dipakai dapat berarti orang Yahudi secara umum atau orang Yudea secara khusus, tergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung ringan dalam alur narasi. Dalam bahasa Indonesia, peralihannya sudah alami tanpa kata penghubung eksplisit; menambahkan “sekarang” akan memberi kesan waktu yang tidak dinyatakan secara khusus oleh teks sumber.
- source_word: ἐγγὺς
  choice: sudah dekat
  rationale: Bersama ἦν, kata ini menyatakan kedekatan waktu. “Sudah dekat” alami dalam bahasa Indonesia dan menunjukkan bahwa perayaan itu akan segera tiba.
- source_word: πάσχα
  choice: Hari Raya Paskah
  rationale: πάσχα menunjuk pada perayaan Paskah Yahudi. Bentuk ini merupakan padanan baku dan memperjelas bahwa yang dimaksud ialah hari raya, bukan sekadar suatu peristiwa.
- source_word: ἡ ἑορτὴ
  choice: perayaan
  rationale: ἑορτή berarti perayaan atau hari raya. “Perayaan” menghindari pengulangan kaku setelah “Hari Raya Paskah” dan tetap mempertahankan fungsi frasa aposisional.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam konteks ini, Ἰουδαίων paling wajar menunjuk pada umat Yahudi secara luas karena Paskah merupakan perayaan keagamaan mereka, meskipun istilah Yunani itu dalam konteks lain dapat berarti orang Yudea.
theological_decisions:
- issue: Cakupan makna Ἰουδαίων dalam narasi Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Paskah bukan hanya perayaan regional penduduk Yudea, melainkan perayaan umat Yahudi secara umum. Namun, karena istilah Yunani dapat memiliki arti etnis-keagamaan atau geografis menurut konteks, alternatif itu dicatat agar keluasan leksikalnya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan aposisional dipertahankan dengan “yaitu” agar hubungan antara Paskah dan perayaan orang Yahudi jelas bagi pembaca umum.
