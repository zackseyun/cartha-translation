  text: λέγει αὐτῷ εἷς ἐκ τῶν μαθητῶν αὐτοῦ, Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: id
  text: Salah seorang murid-Nya, yaitu Andreas, saudara Simon Petrus, berkata kepada-Nya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai kala kini naratif, tetapi dalam narasi bahasa Indonesia modern bentuk lampau dipahami dari konteks; “berkata” menyampaikan peristiwa secara alami tanpa penanda waktu tambahan.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina datif menandai pihak yang diajak bicara, yakni Yesus dalam konteks. Huruf kapital mengikuti kelaziman bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Salah seorang murid-Nya
  rationale: Ungkapan partitif εἷς ἐκ dengan bentuk jamak secara idiomatis diterjemahkan “salah seorang dari”; kata “dari” dapat dilesapkan dalam bahasa Indonesia tanpa mengurangi makna.
- source_word: μαθητῶν
  choice: murid
  rationale: “Murid” merupakan padanan baku dan alami dalam konteks Injil, serta mempertahankan hubungan belajar dan mengikuti.
- source_word: Ἀνδρέας
  choice: Andreas
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi dan penggunaan Alkitab bahasa Indonesia.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: saudara Simon Petrus
  rationale: Konstruksi ini menjelaskan Andreas secara aposisional sebagai saudara Simon Petrus. Bahasa sumber tidak menentukan apakah yang dimaksud kakak atau adik, sehingga “saudara” mempertahankan ambiguitas itu.
- source_word: Σίμωνος Πέτρου
  choice: Simon Petrus
  rationale: Kedua nama bersama-sama menunjuk pada tokoh yang dikenal sebagai Simon Petrus; tidak ada unsur “yang disebut” dalam frasa ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur aposisional dipertahankan dengan “yaitu” untuk memperjelas bahwa murid tersebut adalah Andreas. Ayat berakhir dengan koma karena kalimat langsung berlanjut pada ayat berikutnya.
