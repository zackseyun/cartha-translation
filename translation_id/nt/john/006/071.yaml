source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: id
  text: Ia sedang berbicara tentang Yudas, anak Simon Iskariot, sebab dialah yang hendak menyerahkan Dia[a]—Yudas itu salah satu dari Dua Belas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengkhianati Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Yang Ia maksud ialah Yudas
  rationale: Dalam konteks penjelasan narator, bentuk imperfek ἔλεγεν dengan objek Yudas menyatakan bahwa perkataan sebelumnya merujuk kepada Yudas. Ungkapan ini alami dalam bahasa Indonesia dan tidak memerlukan penanda wacana tersendiri untuk δέ.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: anak Simon Iskariot
  rationale: Dua bentuk genitif paling wajar dipahami sebagai hubungan anak dan ayah, dengan Iskariot menerangkan Simon.
- source_word: οὗτος γὰρ
  choice: Yudas inilah
  rationale: Pengulangan nama memperjelas acuan dalam bahasa Indonesia, sedangkan partikel -lah mempertahankan penekanan demonstratif οὗτος; hubungan penjelasan γάρ tersampaikan oleh kalimat lanjutan.
- source_word: ἔμελλεν
  choice: akan
  rationale: Menyatakan tindakan yang berada di depan dalam alur cerita tanpa menambahkan gagasan bahwa tindakan itu ditakdirkan atau secara eksplisit diniatkan.
- source_word: παραδιδόναι αὐτόν
  choice: menyerahkan Dia
  rationale: Menjaga arti dasar παραδίδωμι, yakni menyerahkan seseorang kepada pihak lain, sekaligus membiarkan konteks sengsara menyatakan sifat pengkhianatannya.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: ia termasuk salah satu dari kedua belas murid
  rationale: Menjelaskan keanggotaan Yudas dalam kelompok Dua Belas secara alami bagi pembaca Indonesia; kata 'murid' ditambahkan secara kontekstual agar sebutan kelompok itu jelas.
theological_decisions:
- issue: Arti παραδιδόναι dalam tindakan Yudas
  choice: menyerahkan Dia
  alternative: mengkhianati Dia
  rationale: Terjemahan utama mempertahankan tindakan konkret dalam verba Yunani dan tidak menghilangkan nuansa hukum serta naratif bahwa Yesus diserahkan kepada pihak lain. Catatan kaki menyajikan pengertian kontekstual 'mengkhianati'.
- issue: Daya prospektif ἔμελλεν
  choice: akan
  alternative: sudah hendak; ditakdirkan untuk
  rationale: '''Akan'' mempertahankan orientasi masa depan dari sudut pandang narator tanpa memutuskan apakah μέλλω di sini menekankan kedekatan waktu, maksud pribadi, atau keniscayaan ilahi.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Huruf kapital pada kata ganti 'Ia/Dia' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Ungkapan 'sekalipun' menampilkan daya mengejutkan dari keterangan bahwa pengkhianat itu berasal dari kelompok Dua Belas, tanpa menambahkan klaim doktrinal.
