  text: ταῦτα εἶπεν ἐν συναγωγῇ διδάσκων ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: id
  text: Ia mengatakan semua ini sambil mengajar di rumah ibadat di Kapernaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Kata tunjuk netral jamak ini merujuk kembali kepada rangkaian perkataan atau pokok dalam uraian sebelumnya; bentuk jamaknya dipertahankan secara alami dalam bahasa Indonesia.
- source_word: εἶπεν
  choice: Ia mengatakan
  rationale: Aoristus λέγω paling langsung berarti 'mengatakan'. Subjeknya tersirat dalam bahasa Yunani dan secara kontekstual adalah Yesus; pronomina mempertahankan ketidaktersuratan nama itu.
- source_word: ἐν συναγωγῇ
  choice: di rumah ibadat
  rationale: Walaupun tanpa artikel dalam bahasa Yunani, konstruksi ini dapat menunjuk kepada rumah ibadat setempat yang tertentu. 'Rumah ibadat' merupakan padanan Indonesia yang jelas dan umum untuk συναγωγή sebagai tempat pertemuan Yahudi.
- source_word: διδάσκων
  choice: ketika mengajar
  rationale: Partisipel kini menyatakan tindakan yang berlangsung bersamaan dengan tindakan utama; 'ketika mengajar' menyampaikan hubungan waktu itu secara wajar.
- source_word: ἐν Καφαρναούμ
  choice: di Kapernaum
  rationale: Nama tempat Καφαρναούμ ditransliterasikan sebagai 'Kapernaum', dengan preposisi lokatif alami 'di'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan kalimat mempertahankan rujukan jamak ταῦτα dan tidak menambahkan nama Yesus yang hanya tersirat dalam teks Yunani.
