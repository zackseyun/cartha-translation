  source_fidelity: Draf mempertahankan jamak ταῦτα melalui “hal-hal ini”, subjek tersirat melalui “Ia”, lokasi rumah ibadat, dan Kapernaum. Namun, partisipel kini διδάσκων lebih langsung menyatakan tindakan yang menyertai ujaran utama daripada sekadar titik waktu.
