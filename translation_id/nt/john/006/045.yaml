  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: id
  text: Ada tertulis dalam kitab nabi-nabi, “Mereka semua akan diajar oleh Allah.” Setiap orang yang telah mendengar dari Bapa dan belajar dari-Nya datang kepada-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: Ada tertulis
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk formula kutipan Kitab Suci, dengan tetap menyiratkan bahwa apa yang tertulis tetap berlaku.
- source_word: ἐν τοῖς προφήταις
  choice: dalam Kitab Para Nabi
  rationale: Menunjuk pada kumpulan tulisan kenabian dalam Kitab Suci, bukan hanya perkataan sejumlah nabi; penambahan 'Kitab' membuat maksud korpus tulisan jelas dalam bahasa Indonesia.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: Mereka semua akan diajar oleh Allah
  rationale: Mempertahankan bentuk masa depan dan memahami genitif θεοῦ secara wajar sebagai pelaku atau sumber pengajaran, tanpa membuat ungkapan Indonesia terasa kaku.
- source_word: πᾶς ὁ
  choice: Setiap orang yang
  rationale: Menyampaikan bentuk tunggal substantival yang berlaku umum dengan jelas dan alami.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: telah mendengar dari Bapa
  rationale: Bentuk 'telah mendengar' menunjukkan tindakan yang mendahului verba utama, sedangkan 'dari Bapa' mempertahankan παρά dengan genitif sebagai sumber.
- source_word: καὶ μαθὼν
  choice: dan belajar dari-Nya
  rationale: Bahasa Indonesia secara alami memerlukan pelengkap agar hubungan belajar dengan Bapa tetap jelas; 'dari-Nya' mengambil sumber dari frasa sebelumnya tanpa mengubah urutan gagasan.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: datang kepada-Ku
  rationale: Padanan idiomatis yang mempertahankan kala kini serta gerak atau pendekatan pribadi kepada Yesus.
theological_decisions:
- issue: Hubungan antara pengajaran ilahi dan datang kepada Yesus
  choice: 'Urutan pernyataan dipertahankan: orang yang telah mendengar dari Bapa dan belajar dari-Nya datang kepada Yesus.'
  alternative: Menjelaskannya secara deterministis atau, sebaliknya, menekankan otonomi tanggapan manusia.
  rationale: Teks menyatakan hubungan tersebut tetapi tidak menguraikan mekanisme metafisisnya; terjemahan tidak boleh menyelesaikan ketegangan teologis yang dibiarkan terbuka.
- issue: Makna διδακτοὶ θεοῦ
  choice: diajar oleh Allah
  alternative: menjadi murid Allah / belajar tentang Allah
  rationale: Bentuk ini paling langsung mempertahankan Allah sebagai sumber atau pelaku pengajaran dan menghindari pengertian lain yang tidak dituntut oleh bahasa Yunani.
- issue: Relasi Bapa dengan Yesus
  choice: Sebutan 'Bapa' dan 'kepada-Ku' dipertahankan secara langsung.
  alternative: Menambahkan penjelasan kristologis di luar bunyi ayat.
  rationale: Hal ini mempertahankan daya kristologis pernyataan bahwa belajar dari Bapa berujung pada datang kepada Yesus, tanpa memperluas teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ada tertulis' mempertahankan nuansa formula kutipan Kitab Suci; 'Kitab Para Nabi' dibuat jelas bagi pembaca umum. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
