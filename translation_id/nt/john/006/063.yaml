source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: id
  text: Rohlah yang menghidupkan;[a] daging tidak berguna sedikit pun.[b] Perkataan-perkataan yang telah Kukatakan kepada kalian adalah roh dan hidup.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rohlah yang menghidupkan.” Kata Yunani πνεῦμα dapat berarti “Roh” atau “roh”; dalam konteks ini, rujukan kepada Roh Kudus lebih mungkin.
    reason: alternative_reading
  - marker: b
    text: “Daging” dapat menunjuk secara luas kepada apa yang semata-mata manusiawi. Menerjemahkannya sebagai “natur berdosa” di sini akan lebih menafsirkan daripada yang dituntut oleh kata Yunani.
    reason: lexical_alternative
  - marker: c
    text: Atau “adalah Roh dan hidup,” atau, secara lebih interpretatif, “bersifat rohani dan memberi hidup.” Susunan Yunani ringkas dan bernuansa kualitatif.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks Injil Yohanes, bentuk definit dan tindakan menghidupkan paling wajar menunjuk kepada Roh Kudus. Huruf kapital menandai rujukan yang paling mungkin, sedangkan kemungkinan makna umum “roh” dicatat dalam catatan kaki.
- source_word: ζῳοποιοῦν
  choice: yang menghidupkan
  rationale: Partisipel kini ini berarti memberi hidup atau membuat hidup. “Menghidupkan” ringkas, alami, dan mempertahankan tindakan aktifnya.
- source_word: ἡ σὰρξ
  choice: daging
  rationale: “Daging” mempertahankan keluasan dan ketegangan metaforis istilah Yunani tanpa mempersempitnya menjadi “natur berdosa”, “usaha manusia”, atau tubuh jasmani saja.
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: tidak berguna sedikit pun
  rationale: Ungkapan ini menyatakan penyangkalan mutlak atas manfaat. Frasa Indonesia ini alami dan mempertahankan penekanannya.
- source_word: τὰ ῥήματα
  choice: perkataan-perkataan
  rationale: Istilah ini menunjuk pada tuturan atau hal-hal yang diucapkan. Bentuk ulang mempertahankan bentuk jamak dan cocok dengan konteks ujaran Yesus.
- source_word: λελάληκα
  choice: telah Kukatakan
  rationale: Bentuk perfek Yunani menggambarkan perkataan yang telah diucapkan dan tetap relevan. “Telah Kukatakan” mempertahankan aspek itu dalam bahasa Indonesia yang wajar.
- source_word: πνεῦμά ἐστιν
  choice: adalah roh
  rationale: Predikat tanpa artikel paling baik dipahami secara kualitatif. Terjemahan yang padat ini mempertahankan rumusan Yunani dan tidak secara berlebihan menyamakan perkataan itu langsung dengan Roh Kudus.
- source_word: ζωή
  choice: hidup
  rationale: “Hidup” adalah padanan langsung dan lazim bagi istilah penting dalam Injil Yohanes ini.
theological_decisions:
- issue: Rujukan πνεῦμα dalam klausa pertama
  choice: “Roh” menunjuk kepada Roh Kudus
  alternative: “roh” sebagai prinsip rohani pada umumnya atau roh manusia
  rationale: Konteks Yohanes mengaitkan tindakan memberi hidup dengan Roh, dan bentuk definit mendukung rujukan tertentu. Catatan kaki tetap mengakui ambiguitas leksikalnya.
- issue: Makna σὰρξ dalam pertentangan dengan Roh
  choice: Mempertahankan istilah luas “daging”
  alternative: “natur berdosa”, “usaha manusia semata”, atau “tubuh jasmani”
  rationale: Ayat ini tidak dengan sendirinya membatasi istilah tersebut pada salah satu tafsiran itu. “Daging” menjaga ketegangan teologis tanpa memasukkan sistem antropologi tertentu.
- issue: Daya predikatif πνεῦμά ἐστιν pada klausa terakhir
  choice: 'Kualitatif: perkataan Yesus “adalah roh dan hidup”'
  alternative: 'Identifikasional: “adalah Roh dan hidup”; atau interpretatif: “bersifat rohani dan memberi hidup”'
  rationale: Predikat tanpa artikel mendukung nuansa kualitatif. Rumusan harfiah yang ringkas mempertahankan ambiguitas dan kesejajaran dengan “hidup” tanpa menjelaskan lebih dari teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa ὑμῖν berbentuk jamak. Kapitalisasi pronomina dalam “Kukatakan” mengikuti kebiasaan penerbitan Alkitab Indonesia ketika Yesus berbicara, tanpa menambah unsur yang tidak ada dalam teks.
