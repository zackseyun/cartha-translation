id: JHN.6.52
reference: John 6:52
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi berdebat sengit satu sama lain[a]. Mereka berkata, “Bagaimana mungkin orang ini memberikan dagingnya kepada kita untuk dimakan?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea” atau, sesuai konteks, “para pemimpin Yahudi.” Teks Yunani secara harfiah berbunyi “orang-orang Yahudi.”
    reason: alternative_reading
  - marker: b
    text: Atau “tubuhnya.” Kata Yunani yang digunakan adalah “daging” (σάρξ); kata ini dipertahankan untuk menjaga ungkapan konkret dan ketegangan dalam bagian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: berdebat sengit
  rationale: Bentuk imperfek menggambarkan pertikaian yang sedang berlangsung. Ungkapan ini menyampaikan kuatnya perselisihan verbal tanpa mengesankan perkelahian fisik.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai perkembangan yang berhubungan dengan perkataan sebelumnya dan mempertahankan nuansa konsekuensialnya.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Padanan Indonesia yang alami untuk tindakan timbal balik dalam perselisihan.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Menerjemahkan ungkapan Yunani secara langsung tanpa mempersempit acuannya dalam teks utama.
- source_word: λέγοντες
  choice: Mereka berkata
  rationale: Partisip ini memperkenalkan isi perdebatan. Dijadikan kalimat tersendiri agar alami dan jelas dalam bahasa Indonesia.
- source_word: Πῶς δύναται
  choice: Bagaimana mungkin
  rationale: Menyampaikan pertanyaan mengenai kemungkinan atau kemampuan dengan idiom Indonesia yang wajar.
- source_word: οὗτος
  choice: orang ini
  rationale: Mempertahankan nada berjarak yang dapat terkandung dalam kata penunjuk Yunani.
- source_word: ἡμῖν
  choice: kepada kita
  rationale: Berfungsi sebagai objek tak langsung dari ‘memberikan’; bentuk ini alami dalam bahasa Indonesia.
- source_word: δοῦναι
  choice: memberikan
  rationale: Menyampaikan arti dasar δίδωμι tanpa memperkuat atau memperlunaknya.
- source_word: τὴν σάρκα αὐτοῦ
  choice: dagingnya
  rationale: Mempertahankan kata konkret σάρξ dan ketegangan dalam konteks, alih-alih menafsirkannya sebagai ‘tubuhnya’.
- source_word: φαγεῖν
  choice: untuk dimakan
  rationale: Infinitif pelengkap diterjemahkan secara alami dan tetap mempertahankan tindakan makan sebagai tujuan pemberian.
theological_decisions:
- issue: Penerjemahan σάρξ dalam konteks yang bermuatan teologis
  choice: dagingnya
  alternative: tubuhnya
  rationale: ‘Daging’ paling langsung mempertahankan bentuk leksikal dan gambaran konkret yang memicu reaksi para pendengar, tanpa memasukkan penafsiran sakramental tertentu ke dalam teks.
- issue: Cakupan acuan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks utama mengikuti ungkapan Yunani apa adanya. Kemungkinan acuan yang lebih sempit atau bersifat kedaerahan dicatat tanpa diam-diam menetapkannya sebagai makna tunggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan partisip Yunani dipecah menjadi dua kalimat demi kelancaran, sedangkan istilah konkret dan ambiguitas mengenai kelompok yang dimaksud tetap dipertahankan.
