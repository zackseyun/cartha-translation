  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: id
  text: Filipus menjawab-Nya, “Roti seharga dua ratus dinar[a] pun tidak cukup bagi mereka, agar masing-masing dari mereka mendapat sedikit saja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu dinar adalah uang perak Romawi yang kira-kira setara dengan upah seorang pekerja untuk satu hari.
    reason: Memberi pembaca gambaran tentang besarnya dua ratus dinar tanpa mengubahnya menjadi mata uang modern.
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: seharga dua ratus dinar
  rationale: Genitif nilai menyatakan harga atau nilai roti. Istilah mata uang dipertahankan agar ukuran jumlah dalam dunia teks tidak diganti dengan nilai modern yang cepat berubah.
- source_word: ἄρτοι
  choice: roti
  rationale: Bentuk jamak Yunani dapat dirender secara alami dengan nomina massal bahasa Indonesia tanpa kehilangan makna.
- source_word: οὐκ ἀρκοῦσιν
  choice: pun tidak cukup
  rationale: Menegaskan bahwa jumlah sebesar itu tetap tidak memadai; partikel “pun” menghasilkan bahasa Indonesia yang alami dalam konteks ini.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: untuk memberi mereka masing-masing sedikit saja
  rationale: Menyampaikan hasil atau tujuan yang dimaksud secara alami. “Sedikit saja” mewakili βραχύ τι dan menonjolkan kecilnya bagian tiap orang tanpa menetapkan ukuran tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan penekanan bahwa bahkan roti senilai dua ratus dinar tidak memadai untuk memberikan bagian kecil kepada setiap orang.
