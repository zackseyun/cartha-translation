  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: id
  text: Yesus menjawab mereka, “Sesungguhnya, sesungguhnya, Aku berkata kepadamu, kamu mencari Aku bukan karena kamu telah melihat tanda-tanda, melainkan karena kamu telah makan dari roti-roti itu dan menjadi kenyang.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kamu mencari Aku ... karena kamu makan roti itu dan merasa puas.” Ungkapan Yunani secara lebih harfiah berbunyi “dari roti-roti itu” dan memakai kata kerja yang dapat berarti “menjadi kenyang” atau “merasa puas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Yesus menjawab mereka
  rationale: Ungkapan Yunani harfiah ‘menjawab ... dan berkata’ merupakan formula pengantar tuturan; ‘menjawab mereka’ menyampaikan fungsinya secara alami dalam bahasa Indonesia tanpa pengulangan yang kaku.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya, sesungguhnya, Aku berkata kepadamu
  rationale: Pengulangan dipertahankan sebagai formula khas Injil Yohanes, dengan ragam bahasa yang khidmat dan mudah dipahami.
- source_word: ζητεῖτέ με
  choice: kamu mencari Aku
  rationale: Bentuk kini menunjukkan tindakan yang sedang berlangsung dalam konteks, sedangkan ‘mencari’ mempertahankan tema Yohanes tanpa mempersempitnya menjadi sekadar mencari lokasi.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: bukan karena ... melainkan karena
  rationale: Konstruksi ini mengontraskan alasan atau dorongan mereka secara jelas dan alami.
- source_word: εἴδετε σημεῖα
  choice: kamu telah melihat tanda-tanda
  rationale: ‘Melihat’ tidak menambahkan gagasan memahami secara rohani, sedangkan ‘tanda-tanda’ mempertahankan istilah khas Yohanes bagi karya yang menunjuk melampaui peristiwanya sendiri.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: kamu telah makan dari roti-roti itu
  rationale: Pilihan ini mempertahankan unsur partitif ἐκ, bentuk jamak ἄρτων, dan rujukannya kepada roti-roti yang sebelumnya diperbanyak.
- source_word: ἐχορτάσθητε
  choice: menjadi kenyang
  rationale: Kata kerja pasif ini menyatakan bahwa mereka diberi makan hingga kenyang; pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan citra jasmaniah konteks pemberian makan.
theological_decisions:
- issue: Makna σημεῖα dalam konteks Yohanes
  choice: tanda-tanda
  alternative: mukjizat; tanda-tanda ajaib
  rationale: ‘Tanda-tanda’ mempertahankan dimensi pewahyuan karya Yesus dalam Injil Yohanes tanpa menambahkan kata penjelas yang tidak terdapat dalam teks.
- issue: Kadar pemahaman dalam εἴδετε
  choice: melihat
  alternative: memahami; menangkap maknanya
  rationale: Teks menyatakan bahwa mereka melihat tanda-tanda, lalu mengontraskan motif pencarian mereka; terjemahan tidak menyisipkan kesimpulan bahwa kata itu sendiri berarti memahami secara rohani.
- issue: Kontras alasan pencarian orang banyak
  choice: bukan karena ... melainkan karena
  alternative: bukan bahwa ... tetapi bahwa
  rationale: 'Pilihan ini mempertahankan tegangan teks: Yesus membedakan nilai tanda dari kepuasan jasmaniah tanpa menjelaskan lebih jauh keadaan batin mereka.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pengulangan ‘Sesungguhnya, sesungguhnya’ dan istilah ‘tanda-tanda’ dipertahankan karena penting bagi gaya serta kosakata khas Yohanes; struktur lain dibuat alami tanpa menghilangkan rincian sumber.
