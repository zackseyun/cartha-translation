  text: Ketika hari mulai petang, murid-murid-Nya turun ke laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke danau.” Perairan yang dimaksud ialah Danau Galilea, yang secara geografis adalah danau, tetapi teks Yunani memakai kata “laut” (θάλασσα).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ketika
  rationale: Gabungan ini memperkenalkan peralihan waktu. Dalam bahasa Indonesia, “ketika” menyampaikan hubungan temporal secara alami; daya penghubung δέ cukup ditopang oleh alur konteks dan tidak perlu diterjemahkan secara kaku.
- source_word: ὀψία ἐγένετο
  choice: hari mulai malam
  rationale: Ungkapan Yunani ini menunjuk pada datangnya waktu malam. “Hari mulai malam” alami dalam bahasa Indonesia dan mempertahankan nuansa peralihan menuju malam.
- source_word: κατέβησαν
  choice: turun
  rationale: Kata kerja ini menyatakan gerakan ke tempat yang lebih rendah. “Turun” ringkas, alami, dan sesuai dengan sudut pandang narasi.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Bentuk posesif ini merupakan padanan Indonesia yang lazim dan jelas untuk konstruksi artikel–nomina–posesif Yunani.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: ke danau
  rationale: ἐπί dengan akusatif setelah verba gerak menunjukkan arah atau tujuan. Walaupun θάλασσα secara leksikal berarti “laut”, konteks geografisnya adalah Danau Galilea; “danau” paling mudah dipahami pembaca Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
