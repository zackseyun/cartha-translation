  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: id
  text: Karena itu, banyak dari murid-murid-Nya, setelah mendengarnya, berkata, “Perkataan ini keras[a]. Siapa yang sanggup mendengarkannya[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perkataan ini berat” atau “Perkataan ini sulit diterima.” Kata Yunani yang diterjemahkan “keras” dapat menyatakan sesuatu yang keras, berat, atau sukar diterima.
    reason: lexical_alternative
  - marker: b
    text: Atau “Siapa yang sanggup menerimanya?” Kata kerja Yunani ini dapat berarti mendengar, mendengarkan, mengindahkan, atau menerima, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: banyak
  rationale: Menunjukkan jumlah yang besar tanpa menambahkan kata benda yang tidak dinyatakan dalam teks sumber.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan hubungan logis dengan perkataan Yesus sebelumnya, bukan sekadar urutan waktu.
- source_word: ἀκούσαντες
  choice: setelah mendengarnya
  rationale: Partisip aoris ini paling wajar dipahami secara temporal; akhiran -nya merujuk pada perkataan atau pengajaran yang baru disampaikan.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: dari antara murid-murid-Nya
  rationale: Menyatakan dengan jelas bahwa orang-orang yang berbicara berasal dari kelompok murid Yesus yang lebih luas.
- source_word: Σκληρός
  choice: keras
  rationale: Kata ini mempertahankan rentang makna antara sukar, berat, tajam, dan sulit diterima, tanpa membatasi keberatan para murid pada kesulitan intelektual saja.
- source_word: ὁ λόγος οὗτος
  choice: Perkataan ini
  rationale: Dalam konteks ini λόγος menunjuk pada ujaran atau pengajaran yang baru didengar. 'Perkataan' lebih alami daripada 'firman' untuk keluhan langsung ini dan tidak memberi nuansa teknis yang tidak diwajibkan teks.
- source_word: τίς δύναται
  choice: Siapa yang sanggup
  rationale: Mengungkapkan pertanyaan tentang kemampuan dengan bahasa Indonesia yang alami dan kuat.
- source_word: αὐτοῦ ἀκούειν
  choice: mendengarkannya
  rationale: Mempertahankan kaitan verbal dengan 'mendengar' sekaligus membuka kemungkinan makna menyimak, mengindahkan, atau menerima, tanpa menetapkan salah satunya.
theological_decisions:
- issue: Makna keberatan para murid terhadap perkataan Yesus
  choice: Ucapan itu disebut 'keras', sehingga dapat berarti berat, tajam, sukar diterima, atau sulit ditanggung.
  alternative: Menerjemahkannya secara khusus sebagai 'sulit dipahami' atau 'tidak dapat diterima'.
  rationale: σκληρός tidak menentukan apakah masalahnya terutama bersifat intelektual, moral, emosional, atau karena dianggap menyinggung. Terjemahan mempertahankan ketegangan itu.
- issue: Makna ἀκούειν dalam pertanyaan penutup
  choice: mendengarkannya
  alternative: menerimanya atau menaatinya
  rationale: Konteks dapat menyiratkan penerimaan atau kepatuhan, tetapi verba Yunani tetap memakai bahasa mendengar. Terjemahan utama tidak mengubah implikasi tersebut menjadi pernyataan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk 'dari antara' mempertahankan struktur kelompok dalam teks sumber; 'keras' sengaja dipertahankan untuk menjaga ambiguitas semantis, dengan penjelasan dalam catatan kaki.
