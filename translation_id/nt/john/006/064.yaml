id: JHN.6.64
reference: John 6:64
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: id
  text: Namun, ada beberapa orang di antara kalian yang tidak percaya. Sebab, sejak semula Yesus tahu siapa saja yang tidak percaya dan siapa yang akan menyerahkan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengkhianati Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan perkataan sebelumnya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐξ ὑμῶν
  choice: di antara kalian
  rationale: Mengungkapkan bahwa orang-orang tersebut termasuk dalam kelompok yang sedang disapa; lebih alami daripada terjemahan harfiah 'dari kalian'.
- source_word: τινες
  choice: beberapa orang
  rationale: Menunjuk sebagian orang yang tidak disebutkan secara khusus.
- source_word: οἳ οὐ πιστεύουσιν
  choice: yang tidak percaya
  rationale: Bentuk kini Yunani menyatakan keadaan ketidakpercayaan yang berlangsung; bentuk ini alami dalam bahasa Indonesia.
- source_word: ᾔδει
  choice: tahu
  rationale: Bentuk lampau dari οἶδα menyatakan keadaan mengetahui pada waktu lampau; bersama keterangan waktunya, 'sejak semula Yesus tahu' merupakan ungkapan Indonesia yang alami.
- source_word: ἐξ ἀρχῆς
  choice: sejak semula
  rationale: Mempertahankan acuan temporal tanpa menentukan secara berlebihan awal mana yang dimaksud.
- source_word: οἱ μὴ πιστεύοντες
  choice: siapa saja yang tidak percaya
  rationale: Menyampaikan partisip substantival sebagai kelompok yang dikenal Yesus, tanpa konstruksi Indonesia yang kaku.
- source_word: παραδώσων
  choice: akan menyerahkan
  rationale: Mempertahankan arti dasar 'menyerahkan' dan ambiguitas leksikal tindakan itu, sementara konteks pengkhianatan dijelaskan dalam catatan kaki.
- source_word: αὐτόν
  choice: Dia
  rationale: Objek langsung yang merujuk kepada Yesus; kapitalisasi mengikuti konvensi bahasa Indonesia untuk pronomina yang merujuk kepada pribadi ilahi.
theological_decisions:
- issue: Makna πιστεύω dalam tanggapan para murid kepada Yesus
  choice: percaya
  alternative: memercayai / menaruh kepercayaan
  rationale: '''Percaya'' mempertahankan keluasan makna Yohanes, yang mencakup penerimaan dan kepercayaan, tanpa mempersempitnya menjadi salah satu unsur saja.'
- issue: Makna παραδίδωμι sehubungan dengan tindakan Yudas
  choice: menyerahkan
  alternative: mengkhianati
  rationale: Kata Yunani secara harfiah berarti menyerahkan dan dalam konteks ini tindakannya memang merupakan pengkhianatan. Teks utama mempertahankan nuansa sumber, sedangkan catatan kaki memberi padanan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk membedakan ὑμῶν dari bentuk tunggal. Susunan kalimat dibuat alami, tetapi ungkapan 'sejak semula' sengaja tidak diperjelas lebih jauh karena sumber tidak menentukan titik awal yang dimaksud.
