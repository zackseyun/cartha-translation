id: JHN.6.44
reference: John 6:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: id
  text: Tidak seorang pun dapat datang kepada-Ku jika ia tidak ditarik oleh Bapa yang mengutus Aku.[a] Dan Aku akan membangkitkan orang itu pada hari terakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “ditarik” juga dapat berarti “diseret” atau “ditarik dengan kuat.” “Ditarik” dipakai dalam teks utama untuk mempertahankan gambaran aslinya tanpa menentukan bagaimana Bapa membawa seseorang kepada Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Tidak seorang pun dapat
  rationale: Ungkapan ini mempertahankan penyangkalan universal dan makna kemampuan atau kesanggupan secara wajar dalam bahasa Indonesia.
- source_word: ἐλθεῖν πρός με
  choice: datang kepada-Ku
  rationale: Terjemahan langsung dan alami yang mempertahankan gambaran datang kepada Yesus tanpa menambahkan penafsiran teologis.
- source_word: ἐὰν μὴ
  choice: jika ... tidak
  rationale: Dalam susunan kalimat ini, bentuk bersyarat tersebut terdengar alami dan mempertahankan syarat negatif dari teks Yunani.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: Bapa yang mengutus Aku
  rationale: Partisipel berartikel diterjemahkan sebagai klausa relatif yang alami, sedangkan sebutan pribadi 'Bapa' dipertahankan.
- source_word: ἑλκύσῃ
  choice: ditarik
  rationale: '''Ditarik'' mempertahankan daya gerak verba Yunani dan tetap membuka kadar kekuatannya; alternatif yang lebih keras dijelaskan dalam catatan kaki.'
- source_word: αὐτόν
  choice: ia / orang itu
  rationale: Kedua bentuk merujuk kembali kepada 'tidak seorang pun' secara alamiah dalam bahasa Indonesia. Bahasa Indonesia tidak menandai gender pada pronomina ini, sehingga cakupan umum teks tetap jelas tanpa parafrasa gender.
- source_word: κἀγὼ
  choice: Dan Aku
  rationale: Mewakili καί + ἐγώ serta mempertahankan subjek eksplisit dan kesinambungan pernyataan.
- source_word: ἀναστήσω αὐτόν
  choice: akan membangkitkan orang itu
  rationale: Kata 'membangkitkan' menyampaikan makna kebangkitan dalam konteks Yohanes, sementara 'orang itu' menjernihkan rujukan pronomina tanpa mengubah cakupannya.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: pada hari terakhir
  rationale: Ungkapan Indonesia yang alami dan tepat untuk acuan eskatologis tersebut.
theological_decisions:
- issue: Makna ἑλκύσῃ dalam konteks keselamatan yang diperdebatkan
  choice: ditarik
  alternative: diseret; ditarik dengan kuat
  rationale: '''Ditarik'' mempertahankan makna menyebabkan seseorang bergerak mendekat tanpa menetapkan mekanisme anugerah tertentu. Catatan kaki menjaga kemungkinan nuansa verba yang lebih kuat.'
- issue: Daya rujuk αὐτόν yang berbentuk maskulin tunggal dalam bahasa Yunani
  choice: ia / orang itu
  alternative: dia / orang tersebut
  rationale: Pronomina bahasa Indonesia tidak bergender. Pilihan ini secara tepat menyampaikan rujukan tunggal yang bersifat umum dan tidak membatasi pernyataan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Susunan pasif 'ditarik oleh Bapa' menjaga fokus dan relasi pelaku dalam teks Yunani.
