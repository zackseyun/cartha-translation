  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: id
  text: Sebab Aku telah turun dari surga, bukan untuk melakukan kehendak-Ku sendiri, melainkan kehendak Dia yang mengutus Aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks ini, ὅτι memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya. “Sebab” mempertahankan daya kausalnya dan terdengar wajar dalam ragam Alkitab modern.
- source_word: καταβέβηκα
  choice: Aku telah turun
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dan tetap relevan pada saat berbicara. “Telah turun” mempertahankan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Ungkapan ini secara langsung mempertahankan gambaran asal spasial dari surga tanpa menguranginya menjadi sekadar bahasa tentang pengutusan.
- source_word: οὐχ ἵνα ποιῶ
  choice: bukan untuk melakukan
  rationale: Konstruksi ini menyatakan tujuan yang disangkal. “Bukan untuk melakukan” jelas, alami, dan mempertahankan hubungan tujuan tersebut.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: kehendak-Ku sendiri
  rationale: “Kehendak” mempertahankan bobot dan kesejajaran istilah θέλημα, sedangkan “sendiri” menyampaikan penekanan pada kata milik ἐμὸν.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Setelah penyangkalan “bukan”, “melainkan” menyatakan pertentangan korektif dengan lebih tepat dan alami daripada “tetapi”.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: kehendak Dia yang mengutus Aku
  rationale: Partisipel berartikel diterjemahkan sebagai ungkapan personal “Dia yang mengutus Aku”. Bentuk ini tidak menambahkan identitas eksplisit yang tidak disebutkan dalam ayat, sekaligus menjaga kontras dengan kehendak Yesus sendiri.
theological_decisions:
- issue: Makna turunnya Yesus dari surga
  choice: Pernyataan diterjemahkan secara langsung sebagai “Aku telah turun dari surga”.
  alternative: Memahaminya hanya sebagai kiasan tentang menerima tugas ilahi.
  rationale: Bahasa sumber menyatakan asal dari surga secara lugas. Terjemahan tidak melemahkan klaim itu menjadi sekadar bahasa pengutusan dan juga tidak menambahkan uraian doktrinal di luar teks.
- issue: Hubungan kehendak Yesus dengan kehendak Dia yang mengutus-Nya
  choice: Menggunakan “kehendak” pada kedua sisi dan mempertahankan kontrasnya.
  alternative: Menerjemahkan secara lebih dinamis sebagai “apa yang Aku inginkan” dan “apa yang Dia inginkan”.
  rationale: 'Pengulangan “kehendak” menjaga kesejajaran formal dan ketegangan teologis dalam teks: ada pembedaan nyata dalam konteks misi dan ketaatan, tanpa menjelaskan pembedaan itu memakai kategori teologis tambahan.'
- issue: Identitas pihak yang mengutus Yesus
  choice: 'Menerjemahkan secara tidak lebih spesifik daripada teks: “Dia yang mengutus Aku”.'
  alternative: Menambahkan “Bapa yang mengutus Aku”.
  rationale: Konteks Injil Yohanes mengarah kepada Bapa, tetapi ayat ini sendiri memakai partisipel substantival dan tidak menyebut “Bapa”. Terjemahan mempertahankan bentuk rujukan teks tanpa menutup kejelasan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat ringkas serta mudah dipahami, dengan kesejajaran “kehendak-Ku sendiri” dan “kehendak Dia yang mengutus Aku” dipertahankan. Kapitalisasi pronomina mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
