  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: id
  text: Yesus berkata, “Suruhlah orang-orang itu[a] duduk[b].” Di tempat itu ada banyak rumput. Maka laki-laki itu pun duduk; jumlah mereka kira-kira lima ribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani mula-mula memakai kata umum “orang-orang” (ἀνθρώπους), tetapi kemudian memakai “laki-laki” (ἄνδρες). Jadi, jumlah kira-kira lima ribu itu secara khusus merujuk kepada laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Atau “berbaring bersandar.” Kata Yunani ini dapat menggambarkan sikap tubuh ketika makan; “duduk” dipakai di sini sebagai ungkapan Indonesia yang lebih alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε
  choice: Suruhlah
  rationale: Bentuk imperatif ποιέω yang diikuti infinitif menyatakan tindakan kausatif. “Suruhlah” menyampaikan perintah Yesus secara alami dan jelas dalam bahasa Indonesia.
- source_word: τοὺς ἀνθρώπους
  choice: orang-orang itu
  rationale: ἄνθρωπος di sini menunjuk kepada orang banyak secara umum, bukan khusus kepada laki-laki; frasa ini juga mempertahankan kekontrasannya dengan οἱ ἄνδρες kemudian.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: duduk / duduk
  rationale: ἀναπίπτω dapat berarti duduk atau berbaring bersandar untuk makan. Dalam narasi luar ruang ini, “duduk” merupakan padanan Indonesia yang paling alami, sementara kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: χόρτος πολὺς
  choice: banyak rumput
  rationale: χόρτος berarti rumput dalam konteks ini dan πολύς menunjukkan jumlah yang besar. “Banyak rumput” dekat dengan bentuk sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: ἐν τῷ τόπῳ
  choice: Di tempat itu
  rationale: Padanan lokatif yang jelas dan alami; “itu” mengacu pada lokasi yang sedang diceritakan tanpa menambahkan penekanan.
- source_word: οἱ ἄνδρες
  choice: laki-laki itu
  rationale: ἀνήρ secara khusus menunjuk kepada laki-laki. Terjemahan ini mempertahankan perbedaan dengan ἀνθρώπους yang lebih umum pada awal ayat.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: jumlah mereka kira-kira lima ribu
  rationale: τὸν ἀριθμόν menyatakan jumlah, sedangkan ὡς menandai perkiraan. Susunan ini menyampaikan keduanya secara lancar dalam bahasa Indonesia.
theological_decisions:
- issue: Penghitungan khusus laki-laki dalam kisah pemberian makan
  choice: Membedakan ἀνθρώπους sebagai “orang-orang” dan ἄνδρες sebagai “laki-laki”.
  alternative: Menerjemahkan kedua istilah secara umum sebagai “orang-orang”.
  rationale: Teks Yunani beralih dari istilah umum bagi orang banyak kepada istilah khusus laki-laki untuk kelompok yang dihitung. Mempertahankan perbedaan ini menjaga ketepatan teks tanpa menyimpulkan apakah perempuan dan anak-anak hadir atau tidak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Suruhlah” mempertahankan daya perintah, sedangkan “duduk” dipilih demi kewajaran tanpa menutupi nuansa kebiasaan makan yang dijelaskan dalam catatan kaki.
