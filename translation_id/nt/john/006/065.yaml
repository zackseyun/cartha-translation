revisions:
- from: Lalu Ia berkata, “Itulah sebabnya Aku telah mengatakan kepadamu bahwa tidak seorang pun dapat datang kepada-Ku, kecuali jika hal itu telah diberikan[a] kepadanya dari Bapa.”
  to: 'Dan Ia berkata, “Itulah sebabnya Aku telah mengatakan kepadamu: tidak seorang pun dapat datang kepada-Ku, kecuali jika kepadanya telah diberikan oleh Bapa.”'
  rationale: Revisi menghapus «hal itu» agar tidak menyatakan objek yang tidak disebutkan dalam teks Yunani, serta memakai susunan pasif yang lebih alami dalam bahasa Indonesia. Tanda titik dua sesudah «kepadamu» memperjelas isi perkataan yang telah disampaikan tanpa mengubah makna.
