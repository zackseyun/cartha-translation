    reason: lexical_alternative
  revision_rationale: Revisi menghapus «hal itu» agar tidak menyatakan objek yang tidak disebutkan dalam teks Yunani, serta memakai susunan pasif yang lebih alami dalam bahasa Indonesia. Tanda titik dua sesudah «kepadamu» memperjelas isi perkataan yang telah disampaikan tanpa mengubah makna.
