  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: id
  text: 'Dan Ia berkata, “Itulah sebabnya Aku telah mengatakan kepadamu: tidak seorang pun dapat datang kepada-Ku, kecuali jika kepadanya telah diberikan oleh Bapa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek menggambarkan ujaran Yesus dalam alur percakapan. Bahasa Indonesia tidak selalu menandai aspek berkelanjutan secara gramatikal; “berkata” paling alami di sini tanpa meniadakan konteks wacana yang sedang berlangsung.
- source_word: Διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Ungkapan ini menunjuk kembali kepada penjelasan sebelumnya dan terdengar alami serta jelas dalam bahasa Indonesia modern.
- source_word: εἴρηκα
  choice: Aku telah mengatakan
  rationale: Bentuk perfek menyatakan perkataan sebelumnya yang tetap relevan pada saat itu; “telah mengatakan” mempertahankan hubungan tersebut.
- source_word: οὐδεὶς δύναται
  choice: tidak seorang pun dapat
  rationale: Frasa ini menyatakan ketidakmampuan, bukan sekadar ketiadaan izin. “Tidak seorang pun dapat” menyampaikannya dengan lugas dan alami.
- source_word: ἐλθεῖν πρός με
  choice: datang kepada-Ku
  rationale: Ini merupakan padanan idiomatis yang mempertahankan daya relasional ungkapan Yohanes tanpa menambahkan tafsiran.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: kecuali jika hal itu telah diberikan
  rationale: Konstruksi pasif dipertahankan, sedangkan “hal itu” mewakili bentuk netral tunggal δεδομένον tanpa menetapkan secara eksplisit apa yang diberikan. Alternatif “dikaruniakan” dicatat karena lebih idiomatis tetapi sedikit lebih interpretatif.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina bahasa Indonesia “-nya” dapat merujuk secara umum kepada seseorang tanpa memaksakan jenis kelamin, sekaligus mempertahankan bentuk tunggal sumber.
- source_word: ἐκ τοῦ πατρός
  choice: dari Bapa
  rationale: “Dari” mempertahankan makna sumber atau asal yang lazim pada ἐκ, alih-alih mengubahnya menjadi penanda pelaku “oleh”.
theological_decisions:
- issue: Pemberian ilahi dan kemampuan manusia untuk datang kepada Yesus
  choice: Pernyataan diterjemahkan sebagai ketidakmampuan untuk datang kepada Yesus tanpa sesuatu yang diberikan dari Bapa.
  alternative: Menjelaskannya sebagai panggilan efektif yang pasti berhasil, atau sebagai anugerah pendahuluan yang memungkinkan tanggapan manusia.
  rationale: Teks Yunani menetapkan pemberian dari Bapa sebagai syarat yang perlu, tetapi ayat ini sendiri tidak menjelaskan sifat, jangkauan, atau hasil pasti pemberian itu. Terjemahan tidak menyelesaikan perdebatan teologis tersebut.
- issue: Rujukan tunggal maskulin αὐτῷ
  choice: kepadanya
  alternative: kepada orang itu
  rationale: “Kepadanya” mempertahankan rujukan tunggal dan dalam bahasa Indonesia secara alami dapat berfungsi secara generik, sehingga tidak perlu menambahkan unsur gender yang tidak dapat dinyatakan dengan pronomina Indonesia ini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus dan sebutan “Bapa” mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan “dari Bapa” sengaja mempertahankan gagasan sumber dalam teks Yunani, walaupun “oleh Bapa” lebih lazim untuk menyatakan pelaku dalam bahasa Indonesia.
