review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: ketidakmampuan untuk datang kepada Yesus tanpa pemberian yang bersumber dari Bapa tetap dipertahankan. Namun, «hal itu» memperlakukan bentuk netral δεδομένον seolah-olah memiliki rujukan benda yang jelas, padahal apa yang diberikan sengaja tidak dinyatakan dalam teks Yunani. Susunan impersonal lebih baik mempertahankan ketidakjelasan ini.'
  naturalness: Teksnya umumnya alami dan registernya tepat. Akan tetapi, «jika hal itu telah diberikan kepadanya dari Bapa» agak berat dan kurang idiomatis dalam bahasa Indonesia. Susunan «jika kepadanya telah diberikan oleh Bapa» lebih lancar dalam konteks ini.
  terminology: Kapitalisasi «Ia», «Aku», «-Ku», dan «Bapa» konsisten dengan register Alkitab Indonesia. «Kepadanya» tepat sebagai rujukan tunggal generik. Untuk kalimat pasif bahasa Indonesia, «oleh Bapa» secara alami menyatakan pemberi dan tidak secara material mengubah maksud bahwa pemberian itu berasal dari Bapa.
  issues:
  - severity: medium
    issue: «hal itu» memberi kesan adanya objek atau rujukan tertentu.
    rationale: Partisip δεδομένον berbentuk netral, tetapi teks tidak menyebutkan apa yang diberikan. Terjemahan Indonesia dapat memakai konstruksi pasif tanpa subjek eksplisit agar ambiguitas sumber tetap terpelihara.
  - severity: low
    issue: Urutan «diberikan kepadanya dari Bapa» kurang idiomatis.
    rationale: Dalam bahasa Indonesia modern, pelaku pada pasif ini paling alami dinyatakan dengan «oleh Bapa». Ini tidak memaksakan penafsiran teologis; Bapa tetap pihak yang memberikan.
  revised_text: 'Dan Ia berkata, “Itulah sebabnya Aku telah mengatakan kepadamu: tidak seorang pun dapat datang kepada-Ku, kecuali jika kepadanya telah diberikan oleh Bapa.”'
  revised_footnotes:
