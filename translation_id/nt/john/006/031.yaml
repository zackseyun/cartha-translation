id: JHN.6.31
reference: John 6:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: id
  text: Nenek moyang kami makan manna di padang belantara,[a] seperti ada tertulis, “Ia memberi mereka roti dari surga untuk dimakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di gurun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nenek moyang kami
  rationale: Dalam konteks Israel masa lampau, ungkapan ini secara alami merujuk kepada para leluhur. Bahasa Indonesia modern lazim memakai “nenek moyang” tanpa mengaburkan rujukan historisnya.
- source_word: τὸ μάννα
  choice: manna
  rationale: “Manna” adalah istilah baku dalam bahasa Indonesia untuk makanan yang diberikan kepada Israel selama perjalanan di padang belantara.
- source_word: ἔφαγον
  choice: makan
  rationale: Bentuk aoris menyatakan tindakan lampau; dalam bahasa Indonesia, konteks sudah cukup menandai waktunya tanpa penanda kala tambahan.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: Ungkapan ini cocok dengan latar perjalanan Israel dan lebih luas daripada “gurun”, sebab ἔρημος menunjuk wilayah sepi atau tidak berpenghuni, yang tidak harus berupa gurun pasir.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: seperti ada tertulis
  rationale: Ini merupakan rumusan alami dan bermartabat untuk memperkenalkan kutipan Kitab Suci serta mempertahankan gagasan bahwa tulisan tersebut tetap berlaku sebagai kesaksian tertulis.
- source_word: Ἄρτον
  choice: roti
  rationale: “Roti” adalah padanan langsung dan wajar; bentuk Yunani tidak mengharuskan arti satu ketul roti tertentu.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: “Dari surga” secara alami menyatakan asal pemberian itu dan mempertahankan gema teologis sumber ilahi.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: Ia memberi mereka ... untuk dimakan
  rationale: Susunan ini mempertahankan hubungan antara tindakan memberi, penerima, dan tujuan makan tanpa menambahkan penafsiran.
theological_decisions:
- issue: Identitas subjek tersirat dalam ἔδωκεν
  choice: Memakai “Ia” tanpa menambahkan nama Allah
  alternative: “Allah memberi mereka”
  rationale: Kutipan Yunani hanya memiliki verba orang ketiga tunggal tanpa menyebut nama subjek. “Ia” mempertahankan bentuk sumber dan tidak memperjelas secara berlebihan, meskipun konteks Kitab Suci menunjuk kepada Allah.
- issue: Makna kristologis “roti dari surga”
  choice: Tidak memakai kapitalisasi atau perluasan yang mengantisipasi Yesus sebagai roti sejati
  alternative: Memakai bentuk interpretatif yang secara langsung menunjuk kepada Kristus
  rationale: Di ayat ini para pembicara mengutip pemberian manna pada masa lampau. Perkembangan kristologis sebaiknya muncul melalui kelanjutan wacana, bukan disisipkan ke dalam ucapan mereka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Nenek moyang kami” dipilih daripada “bapa-bapa kami” karena lebih alami bagi pembaca umum dan tepat dalam konteks leluhur Israel. Tanda catatan ditempatkan langsung sesudah frasa yang diterangkannya.
