  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: id
  text: Inilah roti yang turun dari surga[a], supaya siapa pun dapat makan darinya dan tidak mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Inilah roti yang sedang turun dari surga.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “tidak mati” sengaja dibiarkan luas. Dalam konteks ini, ungkapan tersebut dapat dipahami sebagai tidak mengalami kematian final, kematian rohani, atau kebinasaan pada akhir zaman.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Inilah
  rationale: Kata tunjuk ini mengidentifikasi roti yang sedang Yesus jelaskan. “Inilah” alami dalam bahasa Indonesia dan mempertahankan penekanan langsung dari bahasa Yunani.
- source_word: ἄρτος
  choice: roti
  rationale: Ini adalah padanan baku yang tetap dapat memuat arti harfiah maupun metaforis dalam wacana Yohanes 6.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: yang turun dari surga
  rationale: Klausa relatif ini terdengar alami dalam bahasa Indonesia dan mempertahankan gambaran partisipel kini καταβαίνων tanpa menjadikannya tindakan yang hanya terjadi pada masa lampau.
- source_word: οὐρανός
  choice: surga
  rationale: Dalam konteks Yohanes, kata ini menunjuk pada ranah surgawi ilahi, bukan sekadar langit fisik.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai maksud atau hasil secara alami dalam bahasa Indonesia modern.
- source_word: τις
  choice: siapa pun
  rationale: Menyampaikan daya umum dari pronomina tak tentu dan keterbukaan pernyataan ini.
- source_word: ἐξ αὐτοῦ
  choice: darinya
  rationale: Mempertahankan gagasan makan dari roti tersebut dalam ungkapan Indonesia yang ringkas dan wajar.
- source_word: φάγῃ
  choice: dapat makan
  rationale: Subjungtif aoristus di bawah ἵνα dinyatakan secara alami sebagai kemungkinan dalam klausa tujuan, tanpa mengesankan tindakan berulang.
- source_word: μὴ ἀποθάνῃ
  choice: dan tidak mati
  rationale: ἀποθνῄσκω berarti “mati”. Terjemahan sederhana ini tidak mempersempit kematian menjadi kategori fisik, rohani, atau eskatologis tertentu.
theological_decisions:
- issue: Hakikat kematian dalam ungkapan “tidak mati”
  choice: Mempertahankan ungkapan luas “tidak mati” tanpa penjelasan tambahan dalam teks utama.
  alternative: “tidak mati secara rohani” atau “tidak binasa untuk selama-lamanya”
  rationale: Konteks roti hidup memberi ungkapan ini kedalaman teologis, tetapi ayat ini sendiri tidak secara eksplisit menentukan jenis kematian yang dimaksud. Rumusan luas mempertahankan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur Yunani sambil tetap alami bagi pembaca umum; istilah teologis tidak diperuncing melampaui teks sumber.
