  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: id
  text: Namun, Ia berkata kepada mereka[a], “Ini Aku. Jangan takut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Aku adalah” atau “Aku ada.” Dalam Injil Yohanes, ungkapan ini dapat berfungsi sebagai pengenalan diri biasa dan mungkin juga menggemakan tema teologis yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Namun, Ia
  rationale: δέ menandai perkembangan atau kontras ringan dengan keadaan sebelumnya. “Namun” wajar dalam narasi Indonesia, sedangkan artikel ὁ dipakai secara pronominal dan merujuk kepada Yesus.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani adalah present historis, tetapi bentuk “berkata” merupakan padanan naratif yang alami dalam bahasa Indonesia tanpa mengubah isi tindakan.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif jamak diterjemahkan langsung; kontekslah yang menunjukkan bahwa mereka adalah para murid.
- source_word: Ἐγώ εἰμι
  choice: Aku ini
  rationale: Dalam konteks langsung, ungkapan ini berfungsi sebagai pengenalan diri yang menenangkan. “Aku ini” alami dalam bahasa Indonesia sekaligus mempertahankan bentuk eksplisit ἐγώ εἰμι lebih dekat daripada sekadar “Ini Aku.” Kemungkinan gema teologis “Akulah/Aku ada” dicatat tanpa dipaksakan ke dalam teks utama.
- source_word: μὴ φοβεῖσθε
  choice: Jangan takut
  rationale: Larangan ini paling alami dan langsung diungkapkan sebagai “Jangan takut” dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah Ἐγώ εἰμι harus dipahami hanya sebagai pengenalan diri atau juga dibiarkan memiliki kemungkinan gema teologis
  choice: 'Teks utama: “Aku ini”'
  alternative: “Akulah” atau, secara sangat harfiah, “Aku ada”
  rationale: Konteks terutama menunjukkan bahwa Yesus sedang mengenalkan diri kepada para murid yang ketakutan. Namun, Injil Yohanes memakai ungkapan ἐγώ εἰμι dengan kemungkinan resonansi yang lebih luas. Catatan kaki mempertahankan ketegangan tersebut tanpa menetapkan gema teologis itu sebagai satu-satunya makna.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Ia” dipakai untuk rujukan naratif kepada Yesus; dalam kutipan langsung digunakan “Aku.”
