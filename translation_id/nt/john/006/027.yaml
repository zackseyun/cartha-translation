id: JHN.6.27
reference: John 6:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: id
  text: Janganlah bekerja untuk makanan yang akan binasa, melainkan untuk makanan yang bertahan sampai kepada hidup yang kekal[a], yang akan Anak Manusia berikan kepadamu. Sebab, Allah Bapa telah membubuhkan meterai-Nya pada Dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tetap ada untuk hidup yang kekal.”
    reason: εἰς dapat menyatakan arah, tujuan, atau hasil; alternatif ini mempertahankan kemungkinan nuansa “untuk”.
  - marker: b
    text: Secara harfiah, “telah memeteraikan Dia”; ungkapan ini menyampaikan pengesahan atau pemberian wewenang.
    reason: Menjelaskan metafora σφραγίζω tanpa menghapusnya dari teks utama.
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Janganlah bekerja untuk ... melainkan untuk
  rationale: Mempertahankan daya imperatif dan kontras larangan dalam susunan yang wajar dalam bahasa Indonesia; kata depan “untuk” memperjelas hubungan verba dengan objeknya.
- source_word: βρῶσιν
  choice: makanan
  rationale: Dalam konteks ini menunjuk pada makanan, bukan tindakan makan; “makanan” merupakan padanan yang paling alami dan tepat.
- source_word: τὴν ἀπολλυμένην
  choice: yang akan binasa
  rationale: Menyatakan bahwa makanan itu bersifat fana dan akan lenyap. “Binasa” mempertahankan cakupan ἀπόλλυμι yang lebih luas daripada sekadar “menjadi basi”.
- source_word: τὴν μένουσαν εἰς ζωὴν αἰώνιον
  choice: yang bertahan sampai kepada hidup yang kekal
  rationale: “Bertahan” mempertahankan kontras dengan “akan binasa,” sedangkan “sampai kepada” menyampaikan arah atau tujuan εἰς tanpa menentukan secara berlebihan apakah nuansanya tujuan atau hasil.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku yang mempertahankan bentuk gelar dan gema teologisnya.
- source_word: ὑμῖν δώσει
  choice: akan diberikan ... kepadamu
  rationale: Bentuk pasif dalam bahasa Indonesia menjaga hubungan klausa relatif dengan “makanan” secara jelas dan tetap menyatakan Anak Manusia sebagai pemberi.
- source_word: ἐσφράγισεν
  choice: telah membubuhkan meterai-Nya pada
  rationale: Mempertahankan metafora meterai dalam bahasa yang dapat dipahami; ungkapan itu mengandung gagasan pengesahan atau pemberian wewenang.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Allah Bapa
  rationale: Menyampaikan konstruksi aposisional yang mengidentifikasi Sang Bapa sebagai Allah secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa εἰς ζωὴν αἰώνιον
  choice: sampai kepada hidup yang kekal
  alternative: untuk hidup yang kekal
  rationale: Pilihan utama mempertahankan gerak menuju tujuan atau hasil yang terkandung dalam εἰς tanpa menyatakan mekanisme teologis yang tidak dijelaskan oleh ayat ini.
- issue: Makna ἐσφράγισεν sehubungan dengan Anak Manusia
  choice: telah membubuhkan meterai-Nya pada Dia
  alternative: telah mengesahkan Dia
  rationale: Metafora sumber dipertahankan, sementara catatan kaki menjelaskan makna pengesahan atau pemberian wewenang tanpa menggantikan citra teks.
- issue: Aposisi ὁ πατὴρ ... ὁ θεός
  choice: Allah Bapa
  alternative: Sang Bapa, yaitu Allah
  rationale: “Allah Bapa” merupakan bentuk Indonesia yang ringkas dan alami untuk identifikasi aposisional tersebut tanpa menambahkan rumusan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Janganlah” memberi daya perintah yang jelas; “melainkan” menandai kontras dengan alami. Kapitalisasi “Dia” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan ilahi, tanpa mengubah isi sintaksis Yunani.
