  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: id
  text: Inilah roti yang turun dari surga, bukan seperti roti yang dimakan nenek moyang, lalu mereka mati; siapa yang makan roti ini akan hidup selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yunani secara harfiah, “akan hidup ke dalam zaman.” Ungkapan ini berarti hidup selama-lamanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Inilah roti
  rationale: Bentuk "Inilah" secara alami dan tegas menyatakan identifikasi demonstratif dalam bahasa Indonesia, sementara "roti" mempertahankan metafora utama dalam konteks.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: yang telah turun dari surga
  rationale: Klausa relatif alami dalam bahasa Indonesia; "telah turun" menyampaikan tindakan aoris, dan "dari surga" mempertahankan ἐξ οὐρανοῦ.
- source_word: οὐ καθὼς
  choice: tidak seperti
  rationale: Menyampaikan perbandingan negatif secara idiomatis tanpa memperjelas relasi lebih jauh daripada teks Yunani.
- source_word: ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: yang dimakan oleh nenek moyang lalu mereka mati
  rationale: 'Struktur ini membuat unsur pembanding yang tersirat dalam bahasa Yunani menjadi wajar dalam bahasa Indonesia: roti yang dimakan nenek moyang. "Lalu" menyatakan urutan tanpa mengharuskan klaim sebab-akibat yang tidak eksplisit.'
- source_word: οἱ πατέρες
  choice: nenek moyang
  rationale: Dalam konteks manna, ungkapan ini secara alami menunjuk kepada para leluhur Israel; bahasa Indonesia lazim memakai "nenek moyang" sebagai istilah kolektif tanpa menghapus rujukan historis tersebut.
- source_word: ὁ τρώγων
  choice: Orang yang makan
  rationale: Menyampaikan partisipel substantival kini dengan daya umum atau berkelanjutan. "Makan" tetap netral dan tidak memasukkan tafsir sakramental ataupun metaforis tertentu.
- source_word: τοῦτον τὸν ἄρτον
  choice: roti ini
  rationale: Padanan langsung dan alami untuk demonstratif serta nomina yang sudah dikenal dalam wacana.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: akan hidup selama-lamanya
  rationale: Padanan idiomatis Indonesia untuk ungkapan Yohanes yang secara harfiah berarti hidup sampai/ke dalam zaman; menyampaikan kehidupan yang tidak berkesudahan.
theological_decisions:
- issue: Rujukan οἱ πατέρες dalam perbandingan dengan manna
  choice: nenek moyang
  alternative: bapa-bapa; leluhur
  rationale: Konteks menunjuk kepada generasi Israel di padang gurun. "Nenek moyang" merupakan ungkapan Indonesia yang wajar dan tidak memperluas rujukan melampaui para pendahulu historis itu.
- issue: Daya τρώγων dalam wacana roti kehidupan
  choice: makan
  alternative: memakan; menyantap
  rationale: '"Makan" mempertahankan tindakan konkret dalam teks tanpa menetapkan apakah ucapan ini harus dipahami semata-mata secara sakramental atau metaforis.'
- issue: Makna ζήσει εἰς τὸν αἰῶνα
  choice: akan hidup selama-lamanya
  alternative: akan hidup sampai selama-lamanya; akan hidup ke dalam zaman
  rationale: Ungkapan idiomatis dipakai untuk menyampaikan durasi tanpa akhir, sementara bentuk harfiahnya dicatat agar nuansa sumber tetap tersedia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, dengan "Inilah" sebagai pembukaan yang tegas. Istilah "makan" dipertahankan secara sederhana untuk menjaga ketegangan teologis dalam wacana.
