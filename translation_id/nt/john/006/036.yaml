  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: id
  text: Namun, Aku telah berkata kepadamu bahwa kamu memang telah melihat Aku, tetapi kamu tidak percaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya; “Namun” alami dan tetap bernada wibawa.
- source_word: εἶπον ὑμῖν
  choice: Aku telah berkata kepadamu
  rationale: Menyatakan perkataan Yesus sebelumnya kepada para pendengar. Bentuk “telah berkata” mempertahankan rujukan lampau tanpa membuat bahasa Indonesia kaku.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi perkataan sebelumnya secara langsung.
- source_word: καὶ ἑωράκατέ με
  choice: kamu memang telah melihat Aku
  rationale: καί di sini paling wajar dipahami sebagai penegas (“memang”), sedangkan bentuk perfek ἑωράκατε menyatakan tindakan melihat yang telah terjadi dan tetap relevan.
- source_word: καὶ οὐ πιστεύετε
  choice: tetapi kamu tidak percaya
  rationale: καί kedua mengoordinasikan klausa yang secara konteks berlawanan; “tetapi” menyampaikan kontras itu secara alami. Bentuk kini πιστεύετε menunjuk pada ketidakpercayaan mereka yang sedang berlangsung.
theological_decisions:
- issue: Daya καί pertama dalam καὶ ἑωράκατέ με
  choice: memang telah melihat Aku
  alternative: bahkan telah melihat Aku; sekalipun telah melihat Aku
  rationale: “Memang” mempertahankan fungsi penegasan tanpa mengubah koordinasi Yunani menjadi konstruksi konsesif yang lebih tafsiran. Pilihan ini juga menghindari kejanggalan “bahkan melihat Aku” dalam bahasa Indonesia.
- issue: Penerjemahan πιστεύω
  choice: percaya
  alternative: beriman; memercayai
  rationale: “Percaya” merupakan padanan verbal paling langsung dan lazim dalam konteks Yohanes, tanpa membatasi maknanya pada persetujuan intelektual ataupun memperluasnya melalui parafrasa doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Kapitalisasi “Aku” mengikuti kebiasaan teks Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus. Tidak diperlukan catatan kaki karena alternatif leksikal dapat dijelaskan dalam dokumentasi tanpa membebani ayat.
