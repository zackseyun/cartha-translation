id: JHN.6.11
reference: John 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: id
  text: Lalu Yesus mengambil roti-roti itu dan, sesudah mengucap syukur, membagikannya kepada orang-orang yang duduk bersandar[a]. Demikian juga Ia membagikan ikan-ikan itu[b], sebanyak yang mereka inginkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berbaring.” Pada masa itu, orang lazim makan sambil berbaring atau duduk bersandar.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “ikan-ikan kecil.” Kata Yunani ini dapat menunjuk pada ikan yang dimakan bersama roti, mungkin ikan kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Kata ini menandai kelanjutan alur cerita. “Lalu” alami dalam bahasa Indonesia dan tidak memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: τοὺς ἄρτους
  choice: roti-roti itu
  rationale: Bentuk jamak menunjuk pada beberapa roti yang telah disebutkan dalam konteks. Pengulangan “roti-roti” mempertahankan jumlah jamak dengan jelas.
- source_word: εὐχαριστήσας
  choice: sesudah mengucap syukur
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan membagikan. Rumusan ini tidak menambahkan objek yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: διέδωκεν
  choice: membagikannya
  rationale: Kata kerja ini menyatakan tindakan membagi-bagikan kepada banyak orang; enklitik “-nya” secara alami merujuk kembali pada roti-roti itu.
- source_word: τοῖς ἀνακειμένοις
  choice: kepada orang-orang yang duduk bersandar
  rationale: ἀνάκειμαι menggambarkan posisi bersandar atau berbaring ketika makan. “Duduk bersandar” cukup alami bagi pembaca Indonesia sekaligus mempertahankan latar perjamuan kuno.
- source_word: ὁμοίως καὶ
  choice: Demikian juga
  rationale: Ungkapan ini mempertahankan kesejajaran antara pembagian roti dan pembagian ikan tanpa menghasilkan susunan yang kaku.
- source_word: ἐκ τῶν ὀψαρίων
  choice: ikan-ikan itu
  rationale: Dalam konstruksi eliptis ini, tindakan membagikan dari persediaan ikan dipahami dari klausa sebelumnya. “Ikan-ikan itu” alami dalam bahasa Indonesia; kemungkinan makna “ikan-ikan kecil” dicatat dalam catatan kaki.
- source_word: ὅσον ἤθελον
  choice: sebanyak yang mereka inginkan
  rationale: Frasa ini menyatakan jumlah yang mengikuti keinginan orang banyak, tanpa pembatasan yang disebutkan.
theological_decisions:
- issue: Kemungkinan gema Ekaristi pada εὐχαριστήσας dalam kisah pemberian makan
  choice: Menerjemahkannya sebagai “mengucap syukur” tanpa perluasan sakramental
  alternative: Menerjemahkannya sebagai “memberkati” atau membuat makna Ekaristis menjadi eksplisit
  rationale: Kata Yunani tersebut secara langsung menyatakan pengucapan syukur. Kemungkinan gema sakramental tetap terbuka dalam konteks Yohanes, tetapi tidak dimasukkan ke dalam bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam teks Yunani, sedangkan elipsis pada pembagian ikan dibuat jelas secara alami tanpa menambahkan penafsiran teologis.
