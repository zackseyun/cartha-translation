  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: id
  text: Mereka berkata, “Bukankah ini Yesus, anak Yusuf, yang ayah dan ibunya kita kenal? Bagaimana mungkin sekarang dia berkata, ‘Aku telah turun dari surga’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Mereka berkata
  rationale: Imperfek Yunani menggambarkan ujaran yang sedang berlangsung atau berulang. Dalam narasi bahasa Indonesia, bentuk alami “mereka berkata” menyampaikan adegan itu tanpa konstruksi progresif yang kaku.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Bukankah dia ini
  rationale: Pertanyaan negatif ini mengharapkan persetujuan. “Bukankah dia ini” mempertahankan daya retorisnya dalam bahasa Indonesia yang alami.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: anak Yusuf
  rationale: Menerjemahkan hubungan genitif secara langsung dan wajar, serta mempertahankan penekanan orang banyak pada latar keluarga Yesus yang mereka anggap sudah dikenal.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: Kita mengenal ayah dan ibunya
  rationale: Menyampaikan klaim para pembicara bahwa mereka mengenal kedua orang tua Yesus. Pemecahan menjadi kalimat tersendiri menghasilkan bahasa Indonesia yang lebih lancar tanpa mengubah hubungan logisnya.
- source_word: πῶς νῦν λέγει
  choice: Bagaimana mungkin sekarang dia berkata
  rationale: πῶς pada dasarnya berarti “bagaimana”; dalam pertanyaan keberatan seperti ini, “bagaimana mungkin” secara alami menyatakan ketidakpercayaan yang tersirat tanpa mengubahnya menjadi pertanyaan “mengapa”.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Menunjukkan asal atau sumber sebagaimana ἐκ dengan genitif. “Surga” merupakan padanan Indonesia modern yang lazim dalam konteks ini.
- source_word: καταβέβηκα
  choice: Aku telah turun
  rationale: Perfek Yunani menunjuk pada tindakan turun yang telah selesai dengan relevansi pada keadaan sekarang. “Telah turun” mempertahankan aspek tersebut secara ringkas.
theological_decisions:
- issue: Keberatan orang banyak terhadap pernyataan asal surgawi Yesus
  choice: Mempertahankan pernyataan langsung “Aku telah turun dari surga”
  alternative: Aku datang dari surga
  rationale: Teks menyajikan secara langsung benturan antara pengetahuan orang banyak tentang keluarga manusiawi Yesus dan pernyataan-Nya tentang asal dari surga. Terjemahan tidak melunakkan klaim itu menjadi metafora atau menjelaskan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. “Kita” dipakai karena para pembicara memasukkan diri mereka bersama orang yang diajak bicara dalam klaim pengetahuan bersama. Tidak diperlukan catatan kaki karena tidak ada ambiguitas atau varian tekstual yang perlu ditampilkan dalam edisi pembaca pada ayat ini.
