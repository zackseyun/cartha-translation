  naturalness: Bahasa draf baku dan jelas. Susunan “supaya Aku tidak kehilangan apa pun ... melainkan membangkitkannya” lebih langsung, alami, dan lebih dekat dengan hubungan antarklausa Yunani.
  terminology: “Kehendak,” “Dia yang mengutus Aku,” “semua yang telah diberikan-Nya kepada-Ku,” “membangkitkannya,” dan “hari terakhir” tepat serta sesuai register Alkitab Indonesia modern. Kapitalisasi pronomina konsisten dengan gaya yang dipilih.
