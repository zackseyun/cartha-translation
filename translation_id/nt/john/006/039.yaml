  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: id
  text: 'Dan inilah kehendak Dia yang mengutus Aku: supaya Aku tidak kehilangan apa pun dari semua[a] yang telah diberikan-Nya kepada-Ku, melainkan membangkitkannya pada hari terakhir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan ungkapan yang lebih personal, “supaya Aku tidak kehilangan seorang pun dari semua orang yang telah diberikan-Nya kepada-Ku, melainkan membangkitkan mereka.” Bahasa Yunani memakai ungkapan kolektif tunggal, secara harfiah “semua yang ... itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: kehendak
  rationale: Istilah ini secara wajar menyatakan kehendak atau maksud Allah tanpa mempersempitnya menjadi sekadar keinginan ataupun suatu konsep teologis tertentu.
- source_word: τοῦ πέμψαντός με
  choice: Dia yang mengutus Aku
  rationale: Partisip substantival diterjemahkan secara eksplisit dengan tetap mempertahankan unsur relasional dan tindakan mengutus.
- source_word: ἵνα
  choice: supaya
  rationale: Dalam konteks ini ἵνα memperkenalkan isi sekaligus nuansa tujuan dari kehendak tersebut; 'supaya' alami dalam bahasa Indonesia.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: semua yang telah diberikan-Nya kepada-Ku
  rationale: Mempertahankan bentuk kolektif netral tunggal Yunani dan tidak lebih dahulu mengubah rujukannya menjadi rumusan personal.
- source_word: δέδωκέν
  choice: telah diberikan-Nya
  rationale: Bentuk perfektum menunjukkan tindakan yang sudah berlangsung dengan hasil yang tetap berlaku; 'telah diberikan' mengungkapkannya secara alami.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: dari semua ... tidak ada yang hilang
  rationale: Dalam konteks ini ἀπόλλυμι berarti kehilangan, bukan membinasakan. Susunan ini juga mempertahankan gagasan ἐξ αὐτοῦ, yakni tidak kehilangan apa pun dari keseluruhan itu.
- source_word: ἀναστήσω αὐτὸ
  choice: Aku membangkitkannya
  rationale: '''Membangkitkan'' menyampaikan tindakan eskatologis, sedangkan enklitik ''-nya'' mempertahankan acuan tunggal kolektif αὐτό.'
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: pada hari terakhir
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rujukan eskatologis khas konteks Yohanes.
theological_decisions:
- issue: Apakah objek kolektif diterjemahkan secara personal ('semua orang yang') atau mengikuti bentuk netral kolektif Yunani ('semua yang').
  choice: semua yang telah diberikan-Nya kepada-Ku ... membangkitkannya
  alternative: semua orang yang telah diberikan-Nya kepada-Ku ... membangkitkan mereka
  rationale: πᾶν, ὃ, dan αὐτό semuanya berbentuk netral tunggal dan membentuk ungkapan kolektif. Terjemahan utama mempertahankan bentuk itu serta tidak menutup kemungkinan bahwa rujukannya adalah orang-orang dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Bapa dan Yesus dipakai mengikuti kelaziman gaya Alkitab bahasa Indonesia; struktur kalimat dijaga alami tanpa menghapus bentuk kolektif sumber.
