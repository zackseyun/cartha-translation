    rationale: μὴ ἀπολέσω berbentuk orang pertama tunggal aktif. Konstruksi draf dapat dibaca hanya sebagai pernyataan bahwa tidak ada sesuatu yang lenyap, bukan bahwa Yesus tidak kehilangan apa pun dari pemberian itu.
  - severity: low
