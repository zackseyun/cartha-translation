  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: id
  text: Namun, perahu-perahu dari Tiberias tiba di dekat tempat orang banyak makan roti itu, setelah Tuhan mengucap syukur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “perahu-perahu kecil”; kata Yunani πλοιάρια adalah bentuk diminutif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan keadaan yang diceritakan sebelumnya dan terdengar wajar dalam narasi Indonesia.
- source_word: ἦλθεν
  choice: datang
  rationale: Bentuk aoris ἔρχομαι di sini menyatakan kedatangan dalam alur cerita.
- source_word: πλοιάρια
  choice: perahu-perahu
  rationale: Bentuk jamak diterjemahkan secara alami; nuansa diminutif dicatat dalam catatan kaki karena ukurannya tidak menjadi pokok utama.
- source_word: ἐκ Τιβεριάδος
  choice: dari Tiberias
  rationale: Menyatakan tempat asal perahu-perahu tersebut.
- source_word: ἐγγὺς τοῦ τόπου
  choice: ke dekat tempat
  rationale: Bersama verba gerak 'datang', frasa ini secara alami menunjukkan kedatangan ke lokasi yang berdekatan dengan tempat tersebut.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: tempat orang banyak makan roti itu
  rationale: Subjek tersirat dibuat eksplisit sebagai 'orang banyak' berdasarkan konteks terdekat, sedangkan 'roti itu' menunjuk pada roti yang telah disebut sebelumnya.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: setelah Tuhan mengucap syukur
  rationale: Genitif absolut dengan partisip aoris menyatakan tindakan Tuhan yang mendahului tindakan makan; 'mengucap syukur' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks Yohanes, sebutan ini merujuk kepada Yesus dan memiliki bobot kristologis; 'Tuhan' mempertahankan daya sebutan itu tanpa menambahkan tafsiran lain.
- issue: Hubungan temporal εὐχαριστήσαντος dengan ἔφαγον
  choice: setelah Tuhan mengucap syukur
  alternative: ketika Tuhan mengucap syukur
  rationale: Partisip aoris paling wajar dipahami sebagai tindakan yang mendahului orang banyak makan, tetapi terjemahan tetap tidak menjelaskan lebih jauh mekanisme atau makna teologis ucapan syukur itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. 'Orang banyak' dipakai untuk memperjelas subjek jamak tersirat dari konteks, dan penanda catatan kaki ditempatkan tepat setelah kalimat terkait.
