id: JHN.6.24
reference: John 6:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: id
  text: Karena itu, ketika orang banyak melihat bahwa Yesus tidak ada di sana dan murid-murid-Nya pun tidak, mereka sendiri naik ke perahu-perahu kecil[a] itu lalu pergi ke Kapernaum untuk mencari Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perahu-perahu”; kata Yunani yang digunakan berbentuk diminutif dan dapat berarti perahu-perahu kecil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Karena itu, ketika
  rationale: Mempertahankan hubungan lanjutan/inferensial οὖν dan fungsi temporal ὅτε dalam susunan bahasa Indonesia yang wajar.
- source_word: ὁ ὄχλος
  choice: orang banyak
  rationale: Padanan lazim dan bermartabat bagi kelompok orang yang berkumpul, tanpa kesan arkais.
- source_word: εἶδεν
  choice: melihat
  rationale: Menerjemahkan arti langsung verba tanpa mempersempitnya menjadi proses kognitif seperti 'menyadari'.
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: Yesus tidak ada di sana dan murid-murid-Nya pun tidak
  rationale: Mengungkapkan koordinasi negatif secara alami serta mempertahankan ketidakhadiran Yesus dan para murid.
- source_word: ἐνέβησαν αὐτοὶ
  choice: mereka sendiri naik
  rationale: Kata 'sendiri' mempertahankan penekanan pada αὐτοί, sedangkan 'naik' merupakan ungkapan Indonesia yang alami untuk memasuki perahu.
- source_word: τὰ πλοιάρια
  choice: perahu-perahu kecil
  rationale: Bentuk diminutif πλοιάρια secara nyata dapat disampaikan dengan 'kecil'; bentuk jamak juga dipertahankan.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: pergi ke Kapernaum
  rationale: Dalam sudut pandang narasi bahasa Indonesia, 'pergi' paling alami untuk gerak orang banyak menuju Kapernaum, meskipun ἔρχομαι secara leksikal juga dapat diterjemahkan 'datang'.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: untuk mencari Yesus
  rationale: Menyampaikan tindakan yang menyertai sekaligus tujuan perjalanan secara jelas, tanpa muatan rohani tambahan yang mungkin timbul dari pilihan lain.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Penekanan pronominal Yunani dipertahankan melalui 'mereka sendiri', sedangkan bentuk diminutif πλοιάρια ditampilkan dalam teks utama dan kemungkinan pemudaran nuansanya dicatat dalam catatan kaki.
