  source_fidelity: 'Terjemahan menyampaikan seluruh unsur Yunani dengan tepat: hubungan naratif οὖν dan ὅτε, subjek kolektif ὁ ὄχλος, ketidakhadiran Yesus dan murid-murid-Nya, penekanan αὐτοὶ melalui “mereka sendiri,” bentuk jamak τὰ πλοιάρια, tujuan Kapernaum, serta tindakan mencari Yesus. “Pergi ke” merupakan padanan Indonesia yang wajar bagi gerak menuju Kapernaum, meskipun ἦλθον secara leksikal juga dapat diterjemahkan “datang.”'
