  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: id
  text: Maka, setelah orang-orang itu melihat tanda yang telah dilakukan-Nya[a], mereka berkata, “Dia benar-benar Nabi[b] yang datang ke dunia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat yang telah dilakukan-Nya”. Yohanes secara khas memakai kata “tanda” (σημεῖον) untuk menekankan makna pewahyuan dalam perbuatan Yesus, bukan hanya sifatnya yang ajaib.
    reason: lexical_alternative
  - marker: b
    text: Sebutan “Nabi” kemungkinan mengacu pada nabi seperti Musa yang dinantikan (Ul. 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Karena itu, ... orang-orang itu
  rationale: οὖν menandai perkembangan atau kesimpulan dalam narasi, sedangkan ἄνθρωποι merujuk secara umum kepada orang-orang yang hadir, bukan khusus laki-laki.
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoristus diungkapkan dengan anak kalimat waktu yang alami dalam bahasa Indonesia dan tetap menunjukkan bahwa penglihatan itu mendahului ucapan mereka.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: tanda yang telah dilakukan-Nya
  rationale: σημεῖον dipertahankan sebagai 'tanda' karena dalam Yohanes karya Yesus memiliki makna pewahyuan, bukan sekadar sifat ajaib. 'Telah dilakukan-Nya' mencerminkan tindakan yang sudah selesai sebelum tanggapan orang banyak.
- source_word: ἔλεγον
  choice: mereka berkata
  rationale: Bentuk imperfek menggambarkan ucapan yang sedang berlangsung, tetapi bahasa Indonesia tidak wajib menandai aspek tersebut; 'berkata' merupakan ungkapan naratif yang alami tanpa memaksakan arti pengulangan.
- source_word: ἀληθῶς
  choice: benar-benar
  rationale: Pilihan ini menyampaikan penegasan bahwa pengenalan mereka dianggap sungguh atau pasti.
- source_word: ὁ προφήτης
  choice: Nabi
  rationale: Huruf kapital menandai pemakaian yang menyerupai gelar bagi tokoh kenabian tertentu, tanpa memasukkan identifikasi eksplisit ke dalam teks.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: yang akan datang ke dunia
  rationale: Ungkapan ini mempertahankan gagasan tokoh yang datang ke dunia dan terdengar alami dalam bahasa Indonesia; 'akan datang' sesuai dengan sudut pandang pengharapan orang banyak.
theological_decisions:
- issue: Identitas ὁ προφήτης
  choice: Nabi
  alternative: nabi seperti Musa; seorang nabi
  rationale: Konteks kemungkinan besar mengacu pada nabi yang dinantikan seperti Musa dalam Ulangan 18:15–18, tetapi teks Yunani hanya menyebut 'Nabi'. Terjemahan utama mempertahankan ketegangan itu dan tidak menjadikan tafsiran sebagai bagian dari teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan khidmat. Pronomina terikat “-Nya” mengikuti kebiasaan penulisan hormat untuk Yesus. Susunan kalimat dibuat mudah dipahami tanpa menghilangkan istilah khas Yohanes, terutama “tanda” dan gelar “Nabi”.
