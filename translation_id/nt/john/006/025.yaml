  source_fidelity: Terjemahan ini menyampaikan urutan partisip aoris εὑρόντες secara wajar melalui “Setelah menemukan”, mempertahankan arti λέγω sebagai “berkata”, dan menerjemahkan pertanyaan πότε ὧδε γέγονας secara idiomatis sebagai pertanyaan tentang waktu kedatangan. “Di seberang danau” tepat dalam konteks Danau Galilea, meskipun θάλασσα secara harfiah dapat diterjemahkan “laut”. Penggunaan “Yesus” untuk αὐτόν merupakan penjelasan rujukan yang jelas dari konteks dan tidak mengubah makna.
