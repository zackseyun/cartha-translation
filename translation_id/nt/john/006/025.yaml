id: JHN.6.25
reference: John 6:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: id
  text: Setelah menemukan Yesus di seberang danau, mereka berkata kepada-Nya, “Rabi, kapan Engkau tiba di sini?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kapan Engkau sudah berada di sini?” Bentuk perfektum Yunani menyoroti keadaan Yesus yang kini berada di tempat itu, tetapi dalam konteks ini pertanyaannya secara idiomatis menanyakan waktu kedatangan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες αὐτόν
  choice: Setelah menemukan Yesus
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Nama “Yesus” dipakai sebagai rujukan alami dalam bahasa Indonesia agar tidak timbul kesan bahwa mereka baru mengenali siapa yang ditemukan.
- source_word: πέραν τῆς θαλάσσης
  choice: di seberang danau
  rationale: πέραν dengan genitif menunjukkan lokasi di sisi seberang. Dalam konteks geografis Danau Galilea, “danau” lebih alami dan tepat bagi pembaca Indonesia daripada “laut”.
- source_word: εἶπον αὐτῷ
  choice: mereka berkata kepada-Nya
  rationale: Terjemahan ini mempertahankan arti dasar λέγω, meskipun ujaran berikut berbentuk pertanyaan.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Transliterasi gelar sapaan Yahudi dipertahankan untuk menjaga latar historis dan nuansa khusus teks.
- source_word: πότε
  choice: kapan
  rationale: Padanan interogatif temporal yang langsung dan alami dalam bahasa Indonesia.
- source_word: ὧδε
  choice: di sini
  rationale: Ungkapan tempat yang alami untuk ὧδε dalam konteks kedatangan.
- source_word: γέγονας
  choice: Engkau tiba
  rationale: Bentuk perfektum γίνομαι dalam konteks ini secara idiomatis menunjuk pada kedatangan atau keberadaan yang dihasilkan oleh kedatangan. “Tiba” menyampaikan maksud itu secara jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan luwes. Sapaan “Engkau” serta pronomina “-Nya” mempertahankan ragam Alkitabiah yang bermartabat tanpa memakai bentuk yang kuno. Penanda catatan kaki ditempatkan setelah pertanyaan yang diterangkannya.
