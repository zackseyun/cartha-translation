base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: id
  text: Sejak saat itu[a], banyak murid-Nya mundur dan tidak lagi berjalan bersama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena hal itu.” Ungkapan Yunani pada awal ayat dapat dipahami sebagai penunjuk sebab, tetapi dalam konteks ini “Sejak saat itu” lebih kuat menyatakan suatu titik balik.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Sejak saat itu
  rationale: 'Dalam konteks ini, ungkapan tersebut paling wajar menunjukkan titik balik waktu: sejak saat itu dan seterusnya. Kemungkinan makna sebab-akibat tetap dicatat dalam catatan kaki.'
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: banyak dari antara murid-Nya
  rationale: 'Frasa ini mempertahankan arti partitif ἐκ: orang-orang yang berbalik berasal dari kelompok murid Yesus yang lebih luas.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: berbalik
  rationale: Gabungan kata kerja dan ungkapan arah ini menyatakan tindakan mundur atau kembali meninggalkan jalan yang sedang ditempuh, bukan sekadar pergi ke tempat lain. 'Berbalik' ringkas dan alami dalam bahasa Indonesia.
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Ungkapan ini dengan jelas menyatakan berhentinya suatu tindakan sejak titik tersebut.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: berjalan bersama-Nya
  rationale: Terjemahan ini mempertahankan metafora 'berjalan' sekaligus makna kebersamaan dan hubungan berkelanjutan dengan Yesus, tanpa mempersempitnya menjadi sekadar perpindahan fisik atau menafsirkannya langsung sebagai 'percaya'.
theological_decisions:
- issue: Apakah μαθηταί harus diterjemahkan dengan istilah yang menyiratkan kedua belas rasul atau hanya orang percaya sejati
  choice: murid-Nya
  alternative: pengikut-Nya
  rationale: Teks menyebut mereka sebagai murid Yesus, tetapi tidak menyamakan mereka dengan kedua belas rasul dan tidak menjelaskan status iman mereka secara dogmatis. 'Murid-Nya' mempertahankan kategori naratif serta ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'banyak dari antara murid-Nya' sengaja mempertahankan nuansa partitif teks Yunani; 'berjalan bersama-Nya' mempertahankan metafora sumber tanpa menjelaskan maknanya secara berlebihan.
