  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: id
  text: 'Sebab inilah kehendak Bapa-Ku: supaya setiap orang yang memandang Anak dan percaya kepada-Nya memiliki hidup kekal, dan Aku sendiri akan membangkitkan dia pada hari terakhir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan Aku akan membangkitkan dia.” Kata ganti “Aku” disebutkan secara eksplisit dalam bahasa Yunani untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Sebab inilah
  rationale: Menjaga fungsi penjelas γάρ yang menghubungkan ayat ini dengan pernyataan sebelumnya, dalam susunan Indonesia yang alami.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: kehendak Bapa-Ku
  rationale: Menerjemahkan frasa secara langsung; “Bapa” dipertahankan sebagai sebutan relasional bagi Allah.
- source_word: ἵνα
  choice: supaya
  rationale: Menjaga nuansa isi sekaligus maksud/tujuan dalam konstruksi ἵνα dengan bentuk subjungtif.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: setiap orang yang memandang Anak
  rationale: “Memandang” menyampaikan penglihatan yang penuh perhatian lebih baik daripada sekadar melihat, tanpa menjadi arkais.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: dan percaya kepada-Nya
  rationale: Ungkapan πιστεύω εἰς menyatakan kepercayaan yang diarahkan kepada pribadi; “percaya kepada-Nya” alami dan tepat dalam bahasa Indonesia.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: memperoleh hidup kekal
  rationale: Dalam klausa yang diawali “supaya”, “memperoleh” secara alami menyampaikan bahwa orang tersebut mendapat dan memiliki hidup kekal, tanpa mengubahnya menjadi pernyataan indikatif terpisah.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: dan Aku sendiri akan membangkitkan dia
  rationale: “Aku sendiri” mempertahankan penekanan dari pronomina eksplisit ἐγώ; “membangkitkan” sesuai dengan konteks kebangkitan eskatologis.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: pada hari terakhir
  rationale: Padanan temporal yang alami dan langsung dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan dan syarat dalam πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: supaya setiap orang yang memandang Anak dan percaya kepada-Nya memperoleh hidup kekal
  alternative: setiap orang yang melihat Anak dan percaya kepada-Nya memiliki hidup kekal
  rationale: Mempertahankan rumusan generik serta konstruksi tujuan/isi dengan ἵνα, tanpa memasukkan kerangka doktrinal tentang pemilihan atau kehendak bebas.
- issue: Penekanan ἐγώ dalam janji kebangkitan
  choice: Aku sendiri akan membangkitkan dia
  alternative: Aku akan membangkitkan dia
  rationale: Pronomina Yunani yang dinyatakan secara eksplisit memberi tekanan pada pelaku; “sendiri” mempertahankan penekanan itu tanpa menambahkan ajaran di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Bapa”, “Anak”, dan bentuk pronomina yang mengacu kepada pribadi ilahi mengikuti fungsi gelar dan konteks. Catatan kaki ditempatkan setelah keseluruhan klausa kebangkitan yang dijelaskannya.
