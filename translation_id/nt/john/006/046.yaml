  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: id
  text: Bukan berarti ada orang yang telah melihat Bapa, kecuali Dia yang berasal dari Allah[a]; Dialah yang telah melihat Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berada di hadirat Allah” atau “bersama Allah.” Frasa Yunani ini dapat mengandung nuansa kedekatan pribadi selain menunjukkan asal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Bukan berarti
  rationale: Ungkapan ini memperkenalkan penjelasan yang membatasi atau meluruskan pernyataan sebelumnya, bukan menyatakan sebab.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Ini adalah sebutan khas dalam Injil Yohanes bagi Allah sebagai Bapa; huruf kapital menandai rujukan ilahi tanpa menambah makna.
- source_word: ἑώρακέν τις
  choice: ada orang yang telah melihat
  rationale: Dalam konteks negatif, τις berarti siapa pun atau seseorang; bentuk perfek ἑώρακεν menunjukkan tindakan yang telah terjadi dan tetap relevan.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Di sini frasa tersebut menandai pengecualian, bukan syarat.
- source_word: ὁ ὢν
  choice: Dia yang
  rationale: Partisip substantival ini menunjuk kepada pribadi tertentu berdasarkan relasi atau keberadaannya; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan fungsi pengenalannya.
- source_word: παρὰ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: παρά dengan genitif terutama dapat menyatakan asal atau sumber. 'Berasal dari Allah' jelas dan alami, sementara kemungkinan nuansa kedekatan pribadi dicatat dalam catatan kaki.
- source_word: οὗτος
  choice: Dialah
  rationale: Kata penunjuk ini menegaskan kembali pribadi yang baru disebut. 'Dialah' mempertahankan penekanan itu dengan alami.
- source_word: ἑώρακεν
  choice: telah melihat
  rationale: Bentuk perfek menyatakan tindakan yang sudah berlangsung dengan arti yang tetap berlaku; 'telah melihat' merupakan padanan Indonesia yang wajar.
theological_decisions:
- issue: Relasi Dia yang dimaksud dengan Allah dalam παρὰ τοῦ θεοῦ
  choice: berasal dari Allah
  alternative: berada di hadirat Allah; bersama Allah
  rationale: Teks utama mempertahankan gagasan asal ilahi tanpa menentukan secara berlebihan nuansa metafisis atau ruang. Catatan kaki menjaga kemungkinan bahwa frasa itu juga menyiratkan kedekatan pribadi dengan Allah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'melihat Bapa' dipertahankan karena merupakan penekanan asli ayat; 'Dialah' menjaga daya tunjuk οὗτος.
