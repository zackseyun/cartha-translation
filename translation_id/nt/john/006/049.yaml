  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: id
  text: Nenek moyang kalian[a] makan manna di padang gurun dan mereka mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bapa-bapa kalian"; secara harfiah, "bapa-bapa kalian."
    reason: alternatif_leksikal
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Nenek moyangmu
  rationale: Dalam konteks ini πατέρες menunjuk kepada generasi pendahulu Israel di padang gurun. Ungkapan Indonesia “nenek moyangmu” menyampaikan makna leluhur secara alami dan tidak menyiratkan hanya ayah kandung.
- source_word: ἔφαγον
  choice: makan
  rationale: Bentuk aoristus indikatif dari ἐσθίω menyatakan tindakan lampau yang lugas; bahasa Indonesia tidak memerlukan penandaan aspek tambahan di sini.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: Dalam latar kisah keluaran Israel, ἔρημος merujuk pada wilayah belantara/gurun. “Padang gurun” alami dalam bahasa Indonesia dan mempertahankan gema alkitabiahnya.
- source_word: τὸ μάννα
  choice: manna
  rationale: Kata “manna” sudah merupakan istilah yang dikenal dalam bahasa Indonesia untuk makanan yang diberikan kepada Israel. Artikel Yunani menunjuk kepada manna yang sudah diketahui dari kisah tersebut, tetapi tidak perlu diterjemahkan secara terpisah dalam bahasa Indonesia.
- source_word: καὶ ἀπέθανον
  choice: tetapi mereka mati
  rationale: καί secara dasar berarti “dan”, tetapi dalam konteks ini klausa kedua membentuk kontras antara memakan manna dan tetap mengalami kematian. “Tetapi” mengungkapkan hubungan wacana tersebut secara alami tanpa mengubah isi proposisional.
theological_decisions:
- issue: Sebutan bagi generasi Israel di padang gurun
  choice: Nenek moyangmu
  alternative: Bapa-bapamu
  rationale: Ungkapan ini menunjuk kepada para leluhur historis para pendengar, bukan hanya orang tua laki-laki langsung. “Nenek moyangmu” mempertahankan rujukan kolektif itu dalam bahasa Indonesia modern tanpa menambahkan tafsiran teologis.
- issue: Kontras antara manna dan kematian
  choice: tetapi mereka mati
  alternative: dan mereka mati
  rationale: Konteks Yohanes 6 menonjolkan bahwa manna tidak mencegah kematian generasi padang gurun. “Tetapi” menyatakan kontras pragmatis yang tersirat, sementara alternatif “dan” lebih mencerminkan bentuk leksikal καί.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk terikat “-mu” sesuai dengan sapaan tunggal Yunani ὑμῶν yang secara gramatikal jamak tetapi dapat ditujukan kepada kelompok sebagai satu pihak; dalam bahasa Indonesia bentuk ini alami untuk sapaan kepada para pendengar secara kolektif.
