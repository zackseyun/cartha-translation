source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: id
  text: Lalu Yesus mengangkat mata-Nya dan melihat bahwa orang banyak sedang datang kepada-Nya. Ia berkata kepada Filipus, “Dari mana kita akan membeli roti[a] supaya orang-orang ini bisa makan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini dapat berarti roti secara umum atau roti-roti utuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμούς
  choice: mengangkat pandangan-Nya
  rationale: Ungkapan ini menyampaikan idiom Yunani ‘mengangkat mata’ secara alami dalam bahasa Indonesia modern tanpa menghilangkan gerakan Yesus memandang ke depan.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan kaitan naratif dan inferensial dengan konteks sebelumnya; frasa ini lebih jelas daripada menghilangkan penghubung tersebut.
- source_word: θεασάμενος
  choice: melihat
  rationale: Menyatakan pengamatan yang disengaja dengan kata umum dan bermartabat; ‘memperhatikan’ mungkin menambahkan penekanan yang tidak harus ada.
- source_word: πολὺς ὄχλος
  choice: orang banyak
  rationale: Padanan Indonesia yang lazim untuk kerumunan besar; besarnya kelompok tersirat kuat dalam ungkapan ini dan konteks, tanpa frasa yang terasa kaku.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: sedang datang kepada-Nya
  rationale: Bentuk progresif menangkap tindakan yang sedang berlangsung dan πρός sebagai gerak menuju Yesus.
- source_word: λέγει πρὸς Φίλιππον
  choice: Ia berkata kepada Filipus
  rationale: Kala kini historis dialihkan menjadi bentuk naratif Indonesia yang alami, sementara relasi kepada lawan bicara tetap dipertahankan.
- source_word: Πόθεν
  choice: Dari mana
  rationale: Mempertahankan arti harfiah tentang sumber atau tempat memperoleh sesuatu tanpa mempersempitnya hanya menjadi lokasi toko.
- source_word: ἀγοράσωμεν
  choice: kita akan membeli
  rationale: Menyampaikan pertanyaan deliberatif orang pertama jamak secara alami; ‘membeli’ merupakan padanan langsung dan umum.
- source_word: ἄρτους
  choice: roti
  rationale: Ἄρτος dapat menunjuk pada roti sebagai makanan atau pada ketul-ketul roti; ‘roti’ alami dalam konteks ini dan ambiguitasnya dijelaskan dalam catatan kaki.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: supaya orang-orang ini bisa makan
  rationale: ‘Supaya’ mempertahankan hubungan tujuan, sedangkan ‘orang-orang ini’ mengungkapkan acuan demonstratif οὗτοι dengan jelas dan alami.
theological_decisions:
- issue: Urutan partisip dan kala kini historis dalam narasi
  choice: Tindakan partisip diterjemahkan sebagai rangkaian tindakan, lalu λέγει sebagai bentuk lampau naratif ‘berkata’.
  alternative: 'Mempertahankan bentuk lebih harfiah: ‘Setelah mengangkat mata-Nya dan melihat ..., Yesus berkata ...’ atau kala kini naratif ‘berkata/berkatalah’ dalam susunan lain.'
  rationale: Pilihan ini bersifat gaya, bukan doktrinal. Urutan Yesus memandang, melihat orang banyak, lalu berbicara tetap utuh dalam bahasa Indonesia yang wajar.
- issue: Daya pertanyaan Πόθεν ἀγοράσωμεν
  choice: Dari mana kita akan membeli
  alternative: Di mana kita dapat membeli; dari mana harus kita beli
  rationale: ‘Dari mana’ menjaga pertanyaan tentang sumber perolehan, sedangkan ‘akan’ menyampaikan deliberasi tanpa menambahkan ketidakmampuan atau kewajiban yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan pronominal bagi Yesus memakai bentuk hormat ‘-Nya/Ia’. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alurnya mudah dipahami tanpa mengubah urutan tindakan.
