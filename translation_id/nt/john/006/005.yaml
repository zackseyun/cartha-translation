  to: Lalu Yesus mengangkat mata-Nya dan melihat bahwa orang banyak sedang datang kepada-Nya. Ia berkata kepada Filipus, “Dari mana kita akan membeli roti[a] supaya orang-orang ini bisa makan?”
  rationale: Revisi terbatas pada penyesuaian idiom agar “mata” yang disebut dalam bahasa Yunani tetap tampak dalam terjemahan, penghalusan penghubung naratif οὖν, dan perbaikan catatan kaki leksikal agar tidak menyamakan “loaves” dengan potongan-potongan roti. Makna dan struktur pertanyaan Yesus tetap dipertahankan.
