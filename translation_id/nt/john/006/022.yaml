id: JHN.6.22
reference: John 6:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: id
  text: Keesokan harinya, orang banyak yang tetap berada di seberang danau itu melihat bahwa tidak ada perahu kecil lain di sana selain satu[a], dan bahwa Yesus tidak naik ke perahu[b] itu bersama murid-murid-Nya, tetapi murid-murid-Nya telah berangkat sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perahu”; kata Yunani πλοιάριον berbentuk diminutif dan dapat diterjemahkan “perahu kecil.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah dan edisi berbeda antara “perahu kecil” (πλοιάριον) dan “perahu” (πλοῖον) dalam ayat ini; terjemahan mengikuti bentuk yang terdapat dalam teks Yunani tercetak pada masing-masing bagian.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara idiomatis menandai peristiwa pada hari berikutnya.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: orang banyak yang masih berada
  rationale: Partisipel perfek ἑστηκώς menunjukkan keadaan yang berlanjut; “masih berada” menyampaikan bahwa orang banyak itu tetap berada di lokasi tersebut tanpa terjemahan yang kaku.
- source_word: πέραν τῆς θαλάσσης
  choice: di seberang danau itu
  rationale: πέραν dengan genitif menunjukkan lokasi di sisi seberang. Dalam konteks Danau Galilea, “danau” merupakan istilah geografis Indonesia yang alami, sedangkan kata tunjuk mempertahankan sifat definit dari τῆς θαλάσσης.
- source_word: εἶδον
  choice: melihat
  rationale: Pilihan ini mempertahankan arti dasar verba persepsi tersebut; kedua klausa ὅτι menjelaskan apa yang mereka lihat atau ketahui dari pengamatan.
- source_word: πλοιάριον
  choice: perahu kecil
  rationale: Bentuk diminutif πλοιάριον dapat menyiratkan perahu berukuran kecil, dan nuansa itu dipertahankan dalam teks.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: tidak ada perahu kecil lain di sana selain satu
  rationale: Susunan ini mempertahankan penegasan eksklusif teks Yunani bahwa hanya satu perahu yang ada di sana.
- source_word: οὐ συνεισῆλθεν ... ὁ Ἰησοῦς
  choice: Yesus tidak naik ... bersama murid-murid-Nya
  rationale: Dalam konteks memasuki perahu, “naik ke perahu ... bersama” merupakan padanan Indonesia yang alami bagi verba majemuk yang berarti masuk bersama.
- source_word: εἰς τὸ πλοῖον
  choice: ke perahu itu
  rationale: πλοῖον adalah istilah umum untuk perahu; bentuk definit diterjemahkan dengan “itu” untuk merujuk pada perahu yang sudah disebutkan.
- source_word: μόνοι ... ἀπῆλθον
  choice: telah berangkat sendiri
  rationale: “Berangkat” menyampaikan gerak pergi ἀπῆλθον, sedangkan “sendiri” menegaskan bahwa para murid pergi tanpa Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Struktur dua klausa pengamatan dipertahankan dalam satu kalimat agar hubungan sintaksis dengan εἶδον tetap terlihat. Istilah “perahu kecil” dan “perahu” dibedakan sesuai bentuk Yunani yang dicetak.
