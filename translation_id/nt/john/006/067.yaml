  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: id
  text: Lalu Yesus berkata kepada kedua belas murid itu, “Kalian juga tidak mau pergi, bukan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kalian juga mau pergi?” Pertanyaan Yunani memakai μή, yang biasanya mengharapkan jawaban negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan naratif sekaligus hubungan dengan kepergian banyak murid pada konteks sebelumnya; alami dalam bahasa Indonesia modern.
- source_word: τοῖς δώδεκα
  choice: kepada Kedua Belas Murid
  rationale: Ungkapan ini merupakan sebutan bagi kelompok inti murid Yesus. Penambahan 'Murid' membuat rujukannya jelas bagi pembaca Indonesia, sedangkan kapitalisasi mempertahankan fungsi sebutannya.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Kalian juga tidak ... bukan?
  rationale: Bentuk pertanyaan dengan μή biasanya mengharapkan jawaban negatif. Susunan ini menyampaikan harapan tersebut secara wajar, sementara 'juga' mencerminkan καί dan mengaitkannya dengan murid-murid lain yang telah pergi.
- source_word: θέλετε
  choice: mau
  rationale: Dalam konteks ini menyatakan keinginan atau kemauan; 'mau' adalah padanan langsung dan alami dalam bahasa Indonesia masa kini.
- source_word: ὑπάγειν
  choice: pergi
  rationale: Mempertahankan gagasan bergerak menjauh dalam konteks murid-murid yang meninggalkan Yesus, tanpa memperjelas objek yang tidak dinyatakan secara eksplisit dalam verba Yunani.
theological_decisions:
- issue: Daya pertanyaan Yesus yang diawali μή
  choice: Pertanyaan negatif yang menyiratkan harapan akan jawaban 'tidak', tanpa mengubahnya menjadi pernyataan pasti
  alternative: 'Pertanyaan lebih netral: “Apakah kalian juga mau pergi?”'
  rationale: Dalam pertanyaan, μή lazimnya menunjukkan bahwa penutur mengharapkan jawaban negatif. Bentuk 'tidak ... bukan?' mempertahankan nuansa wacana itu tanpa menghapus kemungkinan para murid menentukan jawaban mereka sendiri.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat. 'Kalian' dipakai karena Yesus berbicara kepada kelompok jamak; bentuk pertanyaan ekor 'bukan?' menyampaikan nuansa μή secara alami.
