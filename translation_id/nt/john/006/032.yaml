source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: id
  text: 'Lalu Yesus berkata kepada mereka, “Sesungguhnya, sesungguhnya Aku berkata kepadamu: bukan Musa yang telah memberikan kepadamu roti dari surga,[a] melainkan Bapa-Ku yang memberikan kepadamu roti sejati dari surga.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, susunan Yunaninya menekankan pelaku: “bukan Musa yang telah memberikan kepadamu roti dari surga.”'
    reason: lexical_alternative
  - marker: b
    text: “Sejati” juga dapat berarti “asli”, “nyata”, atau “yang sesungguhnya”—roti dari surga dalam arti yang hakiki, bukan sekadar manna terdahulu sebagai tanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan percakapan dan kaitannya dengan pernyataan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan formula khas Yohanes serta nada pernyataan yang khidmat dan tegas.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan langsung dan wajar yang sesuai dengan formula pembuka yang khidmat.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: bukan Musa yang telah memberikan kepadamu
  rationale: Susunan ini mempertahankan penekanan negasi pada Musa sebagai pelaku, sedangkan bentuk 'telah memberikan' mencerminkan tindakan lampau yang tetap relevan bagi pembahasan sekarang.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: roti dari surga
  rationale: Ungkapan Indonesia yang alami dan dekat dengan gambaran sumber Yunani.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: melainkan Bapa-Ku yang memberikan kepadamu
  rationale: Konstruksi 'bukan ... melainkan' menampilkan kontras pelaku dengan jelas; bentuk kini Yunani dipertahankan melalui verba Indonesia yang tidak diberi penanda waktu lampau.
- source_word: τὸν ἀληθινόν
  choice: roti sejati
  rationale: '''Sejati'' dapat menyatakan yang benar-benar asli, hakiki, atau merupakan penggenapan, tanpa membatasi maknanya hanya pada ''nyata'' secara fisik.'
theological_decisions:
- issue: Kontras antara Musa dan Bapa sebagai pemberi
  choice: bukan Musa yang telah memberikan ... melainkan Bapa-Ku yang memberikan
  alternative: Musa tidak memberikan ... tetapi Bapa-Ku memberikan
  rationale: Negasi Yunani ditempatkan sebelum 'Musa', sehingga konstruksi fokus 'bukan Musa yang ...' lebih tepat mempertahankan kontras pelaku tanpa menyangkal begitu saja peranan historis Musa dalam kisah manna.
- issue: Kontras temporal antara pemberian yang dikaitkan dengan Musa dan pemberian Bapa
  choice: telah memberikan ... memberikan
  alternative: memberikan dahulu ... sekarang memberikan
  rationale: Pilihan ini mencerminkan perbedaan antara bentuk perfect δέδωκεν dan present δίδωσιν tanpa menambahkan keterangan waktu yang tidak dinyatakan secara eksplisit.
- issue: Makna roti yang ἀληθινός
  choice: roti sejati
  alternative: roti yang nyata; roti yang asli; roti yang sesungguhnya
  rationale: '''Sejati'' mempertahankan ketegangan khas Yohanes antara manna terdahulu dan realitas hakiki atau puncak yang diberikan Bapa, tanpa menjelaskan identitas roti itu melampaui ayat ini.'
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pengulangan 'Sesungguhnya' dipertahankan untuk formula khas Yohanes. Kapitalisasi pada kata ganti orang pertama mengikuti gaya Alkitab Indonesia yang lazim ketika merujuk kepada Yesus, sedangkan struktur kalimat menjaga fokus sumber Yunani pada Musa dan Bapa sebagai pelaku yang dikontraskan.
