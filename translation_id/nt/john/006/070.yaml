  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: id
  text: Yesus menjawab mereka, “Bukankah Aku sendiri yang memilih kalian, kedua belas orang itu? Namun, salah seorang dari kalian adalah seorang iblis[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang pemfitnah.” Kata Yunani ini dapat berarti penuduh palsu atau, dalam banyak konteks, Iblis. Di sini ungkapan tersebut bersifat kualitatif, bukan identifikasi langsung dengan Setan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang baku dan alami untuk tanggapan Yesus dalam dialog.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: Bukankah Aku yang memilih
  rationale: Bentuk pertanyaan dengan οὐκ mengharapkan jawaban ya. Susunan “Aku yang” mempertahankan penekanan pada ἐγώ secara alami dalam bahasa Indonesia.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: kalian, kedua belas orang itu
  rationale: Mempertahankan sapaan jamak dan menunjukkan kelompok tertentu yang beranggotakan dua belas orang tanpa menambahkan sebutan yang tidak eksplisit dalam teks Yunani.
- source_word: καὶ
  choice: Namun
  rationale: 'Dalam konteks ini καί menghubungkan dua pernyataan secara kontras: Yesus memilih kedua belas orang itu, tetapi seorang di antara mereka bersifat menentang.'
- source_word: ἐξ ὑμῶν
  choice: salah seorang dari kalian
  rationale: Mengungkapkan makna partitif secara wajar dan jelas dalam bahasa Indonesia.
- source_word: διάβολός
  choice: iblis
  rationale: Mempertahankan ketajaman ungkapan Yunani dan gema teologisnya. Karena nomina predikatif ini tidak memakai artikel, konteksnya dapat bersifat kualitatif, bukan menyamakan orang itu secara langsung dengan Satan; catatan kaki menjaga kemungkinan leksikal “pemfitnah”.
theological_decisions:
- issue: Apakah διάβολός merupakan identifikasi langsung dengan Satan atau gambaran kualitatif
  choice: adalah iblis
  alternative: adalah seorang pemfitnah
  rationale: Terjemahan utama mempertahankan daya retoris dan ketegangan teologis ungkapan Yunani. Ketiadaan artikel memungkinkan nuansa kualitatif, sehingga catatan kaki menjelaskan bahwa perkataan ini tidak harus berarti orang tersebut adalah Satan sendiri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk membedakan sapaan jamak dari tunggal. Ungkapan “kedua belas orang itu” menjaga rujukan kelompok tanpa memasukkan kata “murid” yang tidak tertulis secara eksplisit dalam ayat ini.
