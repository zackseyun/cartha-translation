  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: id
  text: Simon Petrus menjawab-Nya, “Tuhan[a], kepada siapa kami akan pergi? Engkau memiliki perkataan hidup kekal,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan” atau “Guru.” Gelar Yunani ini dapat berfungsi sebagai sapaan hormat, tetapi “Tuhan” sesuai dengan pemakaian dalam Injil Yohanes di sini dan mempertahankan bobot teologisnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: menjawab Dia
  rationale: Bentuk naratif ini menyatakan tanggapan Simon Petrus kepada Yesus. Pronomina ditulis “Dia” sesuai kebiasaan bahasa Indonesia untuk merujuk kepada Yesus.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Mengikuti bentuk nama yang baku dan umum dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan vokatif κύριος dapat menyatakan penghormatan sekaligus membawa bobot kristologis dalam konteks Yohanes; “Tuhan” mempertahankan kedua nuansa tersebut.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: kepada siapa kami akan pergi?
  rationale: Mempertahankan tujuan personal yang dinyatakan oleh πρὸς τίνα dan bentuk pertanyaan retoris masa depan. “Kami” tepat karena Petrus berbicara mewakili kelompoknya kepada Yesus, yang tidak termasuk dalam subjek.
- source_word: ῥήματα
  choice: perkataan-perkataan
  rationale: Bentuk jamak ῥήματα menunjuk pada ucapan atau perkataan yang disampaikan; bentuk ulang mempertahankan pluralitas secara jelas.
- source_word: ζωῆς αἰωνίου
  choice: hidup kekal
  rationale: Frasa genitif ini secara alami menerangkan perkataan-perkataan sebagai perkataan yang berkaitan dengan atau memberikan hidup kekal, tanpa memaksakan satu hubungan genitif yang lebih sempit.
- source_word: ἔχεις
  choice: Engkau memiliki
  rationale: Menyatakan kepemilikan secara langsung dan wajar, sementara “Engkau” mempertahankan sapaan tunggal kepada Yesus.
theological_decisions:
- issue: Daya sapaan Κύριε kepada Yesus
  choice: Tuhan
  alternative: Guru; Tuan
  rationale: “Tuhan” mempertahankan fungsi sapaan hormat dan kemungkinan resonansi kristologis dalam Injil Yohanes tanpa menjadikan resonansi itu lebih eksplisit daripada teks Yunani.
- issue: Hubungan genitif dalam ῥήματα ζωῆς αἰωνίου
  choice: perkataan-perkataan hidup kekal
  alternative: perkataan-perkataan yang memberikan hidup kekal
  rationale: 'Terjemahan ringkas mempertahankan keterbukaan hubungan genitif: perkataan itu dapat dipahami berkaitan dengan, berisi, atau menghasilkan hidup kekal. Alternatif yang lebih eksplisit akan mempersempit maknanya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur pertanyaan dibuat alami tanpa menghilangkan tujuan personal “kepada siapa.” Bentuk “perkataan-perkataan” dipilih untuk mempertahankan jamak Yunani, meskipun “perkataan” saja juga mungkin secara idiomatis.
