  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: id
  text: Maka mereka berkata kepada-Nya, “Tuhan[a], berilah kami roti ini selalu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Gelar Yunani ini dapat dipakai sebagai sapaan hormat maupun berarti “Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: mereka berkata
  rationale: Bentuk aoristus dari λέγω menyatakan ujaran dalam narasi. Subjek orang ketiga jamak yang tersirat dalam verba perlu dinyatakan sebagai “mereka” dalam bahasa Indonesia.
- source_word: οὖν
  choice: Maka
  rationale: Partikel ini menghubungkan permintaan mereka dengan pembicaraan sebelumnya, baik sebagai kelanjutan maupun tanggapan yang ditarik dari perkataan Yesus. “Maka” alami dan tidak terlalu mempertegas hubungan logis.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: Dengan verba berbicara, πρός dengan akusatif menunjukkan orang yang diajak bicara. Bentuk “-Nya” mengikuti kebiasaan ejaan Indonesia untuk rujukan kepada Yesus.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan κύριε dapat berarti gelar ilahi maupun sapaan hormat. “Tuhan” mempertahankan kemungkinan makna kristologisnya, sementara alternatif “Tuan” dicatat agar keluasan makna Yunani tidak hilang.
- source_word: πάντοτε
  choice: selalu
  rationale: πάντοτε berarti “selalu” atau “senantiasa” dan di sini mengungkapkan permintaan akan pemberian yang terus berlangsung.
- source_word: δὸς
  choice: berilah
  rationale: Imperatif aoristus δίδωμι merupakan permintaan langsung. Bentuk “berilah” terdengar alami dan santun dalam dialog tanpa menambahkan makna yang tidak terdapat dalam teks.
- source_word: ἡμῖν
  choice: kami
  rationale: Pronomina datif jamak adalah penerima pemberian. “Kami” tepat karena orang yang disapa, yaitu Yesus, tidak termasuk dalam kelompok penutur.
- source_word: τὸν ἄρτον τοῦτον
  choice: roti ini
  rationale: ἄρτος berarti “roti,” dan demonstratif τοῦτον menunjuk kepada roti yang baru saja dibicarakan.
theological_decisions:
- issue: Makna κύριος sebagai sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Orang banyak mungkin memakai sapaan hormat tanpa pemahaman kristologis yang penuh, tetapi teks Yunani sendiri tetap terbuka terhadap makna yang lebih dalam. “Tuhan” menjaga ketegangan itu, sedangkan catatan kaki memberi tahu pembaca bahwa “Tuan” juga mungkin secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan “berilah kami roti ini selalu” mempertahankan permintaan langsung dan penekanan pada pemberian yang berkelanjutan tanpa terdengar kaku.
