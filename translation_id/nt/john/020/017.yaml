  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: id
  text: Yesus berkata kepadanya, “Jangan terus memegang Aku[a], sebab Aku belum naik kepada Bapa. Tetapi pergilah kepada saudara-saudara-Ku[b] dan katakan kepada mereka, ‘Aku akan naik kepada Bapa-Ku dan Bapamu, kepada Allah-Ku dan Allahmu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Jangan menyentuh Aku” atau “Jangan berpegang pada-Ku.” Kata Yunani ini kemungkinan menunjuk pada tindakan terus memegang atau berpegang pada-Nya, bukan sekadar menyentuh-Nya.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang diterjemahkan “saudara-saudara” berbentuk jamak maskulin. Di sini istilah itu menunjuk kepada murid-murid Yesus dan mungkin juga mencakup kelompok yang lebih luas.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Jangan terus memegang Aku
  rationale: Larangan dengan bentuk imperatif kini dapat menunjuk pada penghentian tindakan yang sedang berlangsung. Ungkapan ini mempertahankan kemungkinan tindakan memegang atau berpegang secara berkelanjutan tanpa membatasinya pada sekadar sentuhan.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: sebab Aku belum naik
  rationale: Bentuk perfek menyatakan bahwa kenaikan itu belum terjadi sampai saat tersebut. Dalam konteks Yohanes, 'naik' mengandung arah teologis menuju Bapa tanpa memerlukan tambahan penjelasan.
- source_word: πρὸς τὸν πατέρα
  choice: kepada Bapa
  rationale: Teks Yunani memakai kata sandang tanpa kata ganti milik pada klausa pertama; terjemahan ini mempertahankan perbedaannya dari 'Bapa-Ku' dalam klausa berikutnya.
- source_word: πορεύου
  choice: pergilah
  rationale: Imperatif gerak ini paling wajar dan tepat diterjemahkan dengan perintah sederhana 'pergilah'.
- source_word: ἀδελφούς
  choice: saudara-saudara-Ku
  rationale: Bentuk jamak maskulin dipertahankan secara formal. Dalam konteks, istilah itu menunjuk kepada para murid Yesus; catatan kaki menjelaskan cakupan yang mungkin lebih luas.
- source_word: εἰπὲ αὐτοῖς
  choice: katakan kepada mereka
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan bentuk perintah langsung.
- source_word: Ἀναβαίνω
  choice: Aku akan naik
  rationale: Bentuk kini Yunani dalam konteks ini menunjuk pada tindakan yang segera atau akan berlangsung. Bahasa Indonesia secara alami menyatakannya dengan 'akan naik', sambil mempertahankan arah geraknya.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: Bapa-Ku dan Bapamu
  rationale: Susunan sejajar ini mempertahankan pembedaan relasi Yesus dan para murid dengan Bapa tanpa menyamakannya secara diam-diam.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: Allah-Ku dan Allahmu
  rationale: Terjemahan langsung ini menjaga kesejajaran dengan 'Bapa-Ku dan Bapamu' serta mempertahankan seluruh bobot teologis ungkapan sumber.
theological_decisions:
- issue: Makna Μή μου ἅπτου
  choice: Larangan untuk terus memegang Yesus
  alternative: Jangan menyentuh Aku; jangan berpegang pada-Ku
  rationale: Aspek bentuk Yunani mendukung nuansa penghentian atau larangan tindakan berkelanjutan, tetapi alternatif leksikal tetap dicatat karena ungkapannya dapat juga diterjemahkan lebih harfiah sebagai 'menyentuh'.
- issue: Penyebutan πατέρα dalam klausa pertama
  choice: Bapa
  alternative: Bapa-Ku
  rationale: Klausa pertama tidak memuat μου ('-Ku'). Terjemahan mengikuti bentuk sumber dan membiarkan kutipan berikutnya menyatakan relasi 'Bapa-Ku dan Bapamu' secara eksplisit.
- issue: Implikasi kristologis ungkapan θεόν μου καὶ θεὸν ὑμῶν
  choice: Allah-Ku dan Allahmu
  alternative: Parafrasa yang melunakkan atau menjelaskan 'Allah-Ku'
  rationale: Ungkapan diterjemahkan secara langsung tanpa penyesuaian doktrinal, sehingga ketegangan teologis dan pola sejajar dalam teks Yohanes tetap utuh.
- issue: Nilai waktu Ἀναβαίνω
  choice: Aku akan naik
  alternative: Aku sedang naik; Aku naik
  rationale: Bentuk kini dapat memiliki nuansa futuristik atau tindakan yang segera dimulai. Pilihan 'akan naik' paling alami dalam bahasa Indonesia pada konteks ini tanpa menentukan rincian waktu yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan umum penerbitan Alkitab Indonesia. Bentuk 'Bapamu' dan 'Allahmu' dipilih agar paralelisme terdengar alami, sedangkan 'saudara-saudara-Ku' mempertahankan bentuk sumber dan diberi penjelasan dalam catatan kaki.
