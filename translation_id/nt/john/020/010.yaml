  text: So the disciples went away again to their own homes[a].
translation:
  language: id
  text: Lalu kedua murid itu kembali ke tempat mereka tinggal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepada diri mereka sendiri”; ungkapan ini mungkin berarti ke tempat mereka sendiri atau ke tempat mereka tinggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: pulang
  rationale: Dalam konteks mereka meninggalkan makam dan kembali ke tempat semula, verba ini secara alami dapat diterjemahkan “pulang”; unsur meninggalkan tempat kejadian tersirat dalam gerak kembali itu.
- source_word: οὖν
  choice: Lalu
  rationale: Partikel ini melanjutkan alur narasi dan menunjukkan akibat dari kejadian sebelumnya. “Lalu” alami dalam narasi Indonesia tanpa memberi kesan penalaran formal yang terlalu kuat.
- source_word: πάλιν
  choice: kembali (terungkap dalam “pulang”)
  rationale: πάλιν menyatakan gerak kembali. Dalam bahasa Indonesia, maknanya sudah terkandung dalam “pulang”, sehingga menambahkan “kembali” akan terasa berlebihan.
- source_word: πρὸς αὑτούς
  choice: ke tempat mereka menginap
  rationale: Secara harfiah ungkapan ini berarti “kepada diri mereka sendiri”, tetapi dalam konteks kemungkinan menunjuk pada tempat mereka kembali atau sedang tinggal. Pilihan ini alami sekaligus menghindari kepastian yang tidak didukung bahwa masing-masing pulang ke rumah permanennya.
- source_word: οἱ μαθηταί
  choice: kedua murid itu
  rationale: Artikel menunjuk kembali kepada dua murid yang baru saja diceritakan, yakni Petrus dan murid yang lain. “Kedua murid itu” membuat rujukan naratif ini jelas dan wajar dalam bahasa Indonesia.
