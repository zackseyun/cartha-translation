  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: id
  text: Maka, pada petang hari itu, yaitu hari pertama minggu itu, sementara pintu-pintu di tempat para murid berada telah terkunci karena takut kepada orang-orang Yahudi[a], Yesus datang dan berdiri di tengah-tengah mereka. Ia berkata kepada mereka, “Damai sejahtera bagi kalian.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “para pemimpin Yahudi” atau “orang-orang Yudea”, bergantung pada bagaimana istilah Yunani Ἰουδαῖοι dipahami dalam konteks ini.
    reason: alternative_reading
  - marker: b
    text: Atau “Damai sejahtera menyertai kalian.” Secara harfiah, bahasa Yunaninya berbunyi, “Damai bagi kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: Maka, pada petang hari itu
  rationale: Genitif absolut diterjemahkan sebagai keterangan waktu yang wajar dalam bahasa Indonesia; οὖν dipertahankan dengan “Maka” untuk menandai kesinambungan narasi.
- source_word: τῇ μιᾷ σαββάτων
  choice: hari pertama dalam minggu itu
  rationale: Ungkapan Yunani ini secara idiomatis menunjuk pada hari pertama dalam satu pekan, tanpa menggantinya dengan nama hari yang tidak dinyatakan langsung dalam teks.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: pintu-pintu ... sudah terkunci
  rationale: Partisip perfektif pasif menyatakan keadaan yang dihasilkan oleh tindakan sebelumnya; “sudah terkunci” mempertahankan keadaan tersebut dan konteks pengamanan.
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: di tempat para murid berada
  rationale: Menyatakan lokasi secara sederhana tanpa menambahkan bahwa mereka menginap atau berkumpul.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: karena mereka takut kepada orang-orang Yahudi
  rationale: Mengungkapkan hubungan sebab secara alami dalam bahasa Indonesia, sambil mempertahankan sebutan eksplisit Ἰουδαῖοι dan tidak mempersempit rujukannya dalam teks utama.
- source_word: ἔστη εἰς τὸ μέσον
  choice: berdiri di tengah-tengah mereka
  rationale: Mempertahankan gambaran ruang yang jelas dari ungkapan Yunani.
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Present historis Yunani dialihkan ke bentuk naratif bahasa Indonesia yang alami; subjek disebut kembali demi kejelasan.
- source_word: Εἰρήνη ὑμῖν
  choice: Damai sejahtera bagi kalian
  rationale: Dekat dengan susunan harfiah “damai bagi kalian”; “damai sejahtera” merupakan ungkapan Indonesia yang alami dan bermartabat, sedangkan “kalian” menunjukkan bahwa sapaan itu jamak.
theological_decisions:
- issue: Rujukan τῶν Ἰουδαίων dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani tidak secara eksplisit menyebut para pemimpin. Teks utama mempertahankan keluasan istilah sumber, sedangkan catatan kaki menjelaskan kemungkinan rujukan kontekstual agar ungkapan itu tidak otomatis dipahami sebagai tuduhan terhadap seluruh kelompok etnis.
- issue: Bentuk salam Εἰρήνη ὑμῖν
  choice: Damai sejahtera bagi kalian
  alternative: Damai sejahtera menyertai kalian
  rationale: Pilihan utama mempertahankan bentuk nominal dan datif penerima dalam bahasa yang alami tanpa menentukan apakah ungkapan itu sekadar salam atau juga pernyataan pemberian damai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur kalimat diatur agar hubungan waktu dan sebab jelas bagi pembaca umum. Istilah “murid”, “orang-orang Yahudi”, dan “damai sejahtera” dipertahankan sebagai kosakata Alkitabiah yang lazim tanpa memasukkan penafsiran denominasi tertentu.
