  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: id
  text: Setelah berkata demikian, Yesus menunjukkan kepada mereka tangan-Nya dan sisi-Nya. Maka murid-murid itu bersukacita ketika mereka melihat Tuhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Setelah berkata demikian
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: ἔδειξεν
  choice: menunjukkan
  rationale: Verba ini berarti memperlihatkan atau menyajikan sesuatu agar dilihat; 'menunjukkan' merupakan padanan langsung dan wajar.
- source_word: τὰς χεῖρας
  choice: tangan
  rationale: Bahasa Indonesia tidak memerlukan bentuk jamak eksplisit atau pronomina posesif di sini; sufiks pada 'sisi-Nya' dan subjek Yesus membuat kepemilikannya jelas.
- source_word: τὴν πλευράν
  choice: sisi-Nya
  rationale: πλευρά berarti bagian samping tubuh. 'Sisi-Nya' alami dan memungkinkan kaitan dengan luka yang disebut sebelumnya tanpa menambahkannya ke dalam teks.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Datif penerima diungkapkan secara alami dengan frasa preposisional 'kepada mereka'.
- source_word: ἐχάρησαν
  choice: bersukacitalah
  rationale: χαίρω menyatakan sukacita atau kegembiraan. 'Bersukacita' mempertahankan kekuatan verba dan tetap sesuai dengan ragam Alkitab modern yang bermartabat.
- source_word: οὖν
  choice: Maka
  rationale: Partikel ini menandai hasil atau perkembangan logis dari tindakan Yesus memperlihatkan diri-Nya.
- source_word: οἱ μαθηταί
  choice: murid-murid itu
  rationale: μαθητής merupakan istilah baku bagi pengikut Yesus; bentuk ulang menyatakan jamak dan 'itu' mewakili artikel yang menunjuk kelompok yang sudah diketahui.
- source_word: ἰδόντες
  choice: ketika mereka melihat
  rationale: Partisip aoris menjelaskan keadaan atau peristiwa yang menjadi kesempatan bagi sukacita mereka; klausa temporal ini jelas dan alami.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Dalam konteks penampakan kebangkitan, κύριος mempertahankan bobot sebagai sebutan kristologis, bukan sekadar sapaan hormat.
theological_decisions:
- issue: Terjemahan κύριος
  choice: Tuhan
  alternative: Tuan; sang Guru
  rationale: Dalam konteks penampakan Yesus yang bangkit, sebutan ini berfungsi sebagai gelar kristologis. 'Tuhan' mempertahankan bobot teologis dan pemakaian Yohanes tanpa mereduksinya menjadi sapaan biasa.
- issue: Subjek tersirat pada ἔδειξεν
  choice: Yesus
  alternative: Ia
  rationale: Bahasa Yunani menyiratkan subjek dari konteks ayat sebelumnya. Penyebutan 'Yesus' memperjelas rujukan dalam ayat yang berdiri sendiri tanpa mengubah identitas subjek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur Yunani secara wajar. Tidak diperlukan catatan kaki karena tidak ada ambiguitas atau varian tekstual yang perlu ditampilkan kepada pembaca pada ayat ini.
