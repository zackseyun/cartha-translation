  verdict: revise
  source_fidelity: 'Terjemahan mengikuti urutan dan makna teks Yunani dengan baik: partisip aoris τοῦτο εἰπών dinyatakan sebagai tindakan sebelumnya, ἔδειξεν sebagai tindakan memperlihatkan, dan ἰδόντες sebagai keadaan waktu. Istilah «Tuhan» tepat untuk τὸν κύριον dalam konteks ini. Namun, posesif pada τὰς χεῖρας sebaiknya dinyatakan secara eksplisit dalam bahasa Indonesia agar kedua bagian tubuh itu jelas milik Yesus, sebagaimana ditunjukkan oleh konteks dan oleh «sisi-Nya».'
