  terminology: «Yesus», «murid-murid», dan «Tuhan» konsisten dengan istilah Injil dalam bahasa Indonesia. «Sisi-Nya» merupakan padanan yang wajar dan tidak menambahkan penafsiran seperti «luka» atau «lambung».
  issues:
