  - severity: low
    issue: Inversi verbal «Maka bersukacitalah murid-murid itu» agak lebih bercorak sastra/Alkitab lama.
    rationale: Urutan subjek–predikat yang netral lebih alami dalam bahasa Indonesia standar modern. Makna resultatif οὖν tetap dapat dipertahankan dengan «Maka».
