  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Ibu[a], mengapa engkau menangis?” Ia berkata kepada mereka, “Mereka telah mengambil Tuhanku[b], dan aku tidak tahu di mana mereka meletakkannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Perempuan”; dalam konteks ini kata Yunani tersebut merupakan sapaan yang hormat, bukan kasar.
    reason: lexical_alternative
  - marker: b
    text: Atau “tuanku.” Kata Yunani kyrios dapat berarti “Tuhan” maupun berfungsi sebagai gelar penghormatan, tergantung konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: mereka
  rationale: Kata tunjuk ini mengacu kepada kedua malaikat dalam konteks sebelumnya; dalam bahasa Indonesia, pronomina “mereka” paling alami dan acuannya tetap jelas.
- source_word: Γύναι
  choice: Ibu
  rationale: Bentuk sapaan ini hormat dan tidak kasar. “Ibu” menyampaikan fungsi sosialnya secara alami dalam bahasa Indonesia modern, sedangkan terjemahan harfiah “Perempuan” mudah terdengar merendahkan.
- source_word: τί κλαίεις
  choice: mengapa engkau menangis
  rationale: Secara harfiah τί berarti “apa”, tetapi dalam ungkapan ini menanyakan alasan. Bentuk kini κλαίεις menunjukkan tindakan menangis yang sedang berlangsung.
- source_word: Ἦραν
  choice: telah mengambil
  rationale: Aoris menunjuk tindakan yang sudah terjadi, sementara “telah” secara alami menonjolkan akibatnya yang masih dirasakan Maria. Konteks makam membuat makna pemindahan tetap jelas.
- source_word: κύριόν μου
  choice: Tuhanku
  rationale: “Tuhanku” mempertahankan penghormatan pribadi Maria sekaligus kemungkinan bobot kristologis κύριος, tanpa membatasinya hanya pada arti sosial “tuanku” atau “majikanku”.
- source_word: οὐκ οἶδα
  choice: aku tidak tahu
  rationale: οἶδα berbentuk perfek tetapi berfungsi sebagai verba keadaan kini; ungkapan Indonesia ini tepat dan alami.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: di mana mereka meletakkan dia
  rationale: τίθημι berarti menaruh atau meletakkan. “Meletakkan” sesuai dengan konteks jasad dan tetap dekat dengan sumber; “dia” tidak memakai kapitalisasi penghormatan yang tidak ditandai dalam naskah Yunani.
theological_decisions:
- issue: Makna κύριος dalam ucapan Maria
  choice: Tuhanku
  alternative: tuanku; majikanku
  rationale: κύριος dapat menjadi gelar penghormatan maupun gelar dengan bobot kristologis. “Tuhanku” menjaga kedua kemungkinan itu lebih baik daripada pilihan yang mereduksinya menjadi hubungan sosial semata.
- issue: Nada sapaan Γύναι
  choice: Ibu
  alternative: Perempuan; Nyonya
  rationale: Sapaan Yunani ini hormat dalam konteksnya. “Ibu” menyampaikan kesantunan itu dalam bahasa Indonesia modern tanpa menambahkan keakraban sentimental.
- issue: Kapitalisasi pronomina untuk Yesus
  choice: dia
  alternative: Dia; -Nya
  rationale: Teks Yunani tidak membedakan kapitalisasi pronomina penghormatan. Huruf kecil menghindari penambahan penafsiran tipografis sambil tetap membiarkan gelar “Tuhanku” membawa bobot teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. “Engkau” mempertahankan sapaan langsung yang wajar dalam gaya Kitab Suci, sedangkan “aku” cocok untuk ucapan pribadi Maria. Struktur kalimat mengikuti alur Yunani tanpa menjadi kaku.
