  naturalness: Bahasa draf sudah baku dan mudah dipahami. “Ia pun berlari dan datang kepada” sedikit lebih dekat dengan dua verba naratif Yunani daripada “ia berlari menemui,” sambil tetap dapat diterima dalam gaya naratif Alkitab bahasa Indonesia. “Murid yang lain, yang dikasihi Yesus” jelas dan alami.
  terminology: “Simon Petrus,” “murid,” “Tuhan,” dan “makam” sesuai dengan penggunaan Indonesia baku dalam konteks Injil. Kapitalisasi “-Nya” dapat dipertahankan sebagai konvensi hormat yang lazim dan tidak mengubah makna. Catatan φιλέω dan jamak οἴδαμεν sesuai dengan sumber serta tidak menutup ambiguitas.
