    rationale: Susunan “murid lain yang dikasihi Yesus” dapat dipahami secara restriktif. Klausa ὃν ἐφίλει ὁ Ἰησοῦς dalam konteks ini mengidentifikasi ‘murid yang lain’; penggunaan koma dalam bahasa Indonesia membantu mempertahankan fungsi tersebut.
  - severity: low
    issue: Arah keluar pada ἐκ τοῦ μνημείου dapat dibuat lebih eksplisit.
    rationale: “Dari makam” dapat diterima, tetapi “dari dalam makam” lebih langsung mencerminkan bahwa Tuhan diambil keluar dari tempat pemakaman.
