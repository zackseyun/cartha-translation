base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: id
  text: Karena itu, ia pun berlari dan datang kepada Simon Petrus dan kepada murid yang lain, yang dikasihi Yesus[a]. Ia berkata kepada mereka, “Mereka telah mengambil Tuhan dari dalam makam, dan kami[b] tidak tahu di mana mereka meletakkan-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata kerja Yunani di sini berasal dari φιλέω, yang dapat menekankan kasih penuh afeksi; terjemahan lain: “yang disayangi Yesus.”'
    reason: lexical_alternative
  - marker: b
    text: Maria mengatakan “kami tidak tahu,” sesuai dengan bentuk orang pertama jamak dalam teks Yunani. Sebagian pembaca memahaminya sebagai mencakup perempuan-perempuan lain yang bersamanya, tetapi ayat ini sendiri tidak menjelaskan siapa yang termasuk dalam “kami.”
    reason: preserve_ambiguity
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Karena itu, ia berlari menemui
  rationale: οὖν menyatakan akibat dari peristiwa pada ayat sebelumnya. Dua bentuk kini historis memberi ketajaman pada narasi; bahasa Indonesia tidak wajib menandai kala, dan ‘berlari menemui’ menyampaikan gerak cepat menuju orang-orang yang dituju secara alami tanpa menghilangkan alur kedua verba.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: menemui Simon Petrus dan murid lain
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang. ‘Murid’ merupakan padanan wajar bagi μαθητής, sedangkan ‘lain’ mempertahankan ἄλλον tanpa menyiratkan bahwa hanya ada dua murid secara keseluruhan.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: yang dikasihi Yesus
  rationale: φιλέω menyatakan kasih atau afeksi pribadi. ‘Dikasihi’ alami, bermartabat, dan tidak memperlemah ungkapan menjadi sekadar ‘disukai’; nuansa afeksinya dijelaskan dalam catatan kaki.
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Bentuk kini historis diterjemahkan tanpa penanda kala eksplisit, sebagaimana lazim dalam bahasa Indonesia, sambil mempertahankan peralihan langsung kepada ucapan Maria.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Mereka telah mengambil Tuhan dari makam
  rationale: Bentuk orang ketiga jamak dipertahankan sebagai ‘mereka’, tanpa menentukan siapa pelakunya. ‘Telah mengambil’ menyatakan tindakan selesai yang akibatnya masih dirasakan, μνημεῖον dalam konteks ini adalah makam, dan κύριος diterjemahkan sebagai gelar ‘Tuhan’.
- source_word: οὐκ οἴδαμεν
  choice: kami tidak tahu
  rationale: Bentuk orang pertama jamak dipertahankan secara eksplisit dan tidak diubah menjadi tunggal, sekalipun hanya Maria yang disebut dalam konteks terdekat.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: di mana mereka meletakkan-Nya
  rationale: τίθημι berarti menaruh atau meletakkan. ‘Meletakkan’ mempertahankan makna umum verba dan tidak menambahkan kesimpulan bahwa tindakan itu merupakan penguburan kembali.
theological_decisions:
- issue: Gelar κύριος bagi Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: Dalam konteks kebangkitan dan dalam ujaran seorang murid, ‘Tuhan’ mempertahankan gelar kristologis yang lazim tanpa mereduksinya menjadi sapaan sosial biasa.
- issue: Bentuk jamak οἴδαμεν dalam ucapan Maria
  choice: kami tidak tahu
  alternative: aku tidak tahu
  rationale: Bentuk jamak sumber dipertahankan agar teks tidak diselaraskan secara diam-diam dengan penyebutan Maria seorang diri. Siapa saja yang tercakup dalam ‘kami’ dibiarkan terbuka.
- issue: Pelaku tak bernama dalam bentuk jamak Ἦραν dan ἔθηκαν
  choice: mereka
  alternative: orang
  rationale: ‘Mereka’ mempertahankan bentuk orang ketiga jamak dan ketidaktahuan Maria mengenai pelakunya; terjemahan tidak mengidentifikasi pihak tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur dibuat alami bagi pembaca umum, sementara bentuk jamak, pelaku yang tidak diketahui, gelar κύριος, dan nuansa φιλέω tetap dipertahankan atau dijelaskan tanpa harmonisasi.
