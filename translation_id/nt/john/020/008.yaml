base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: id
  text: Maka murid yang lain, yang tiba lebih dahulu di makam itu, juga masuk[a]. Ia melihat dan percaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: memasuki makam itu.'
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani hanya mengatakan “percaya” tanpa menyatakan secara langsung apa yang dipercayainya. Ada yang memahami bahwa ia percaya bahwa Yesus telah bangkit, percaya pada bukti yang dilihatnya, atau percaya pada laporan sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Maka
  rationale: Dalam alur ini, gabungan tersebut menandai kelanjutan peristiwa dengan sedikit nuansa kesimpulan. “Maka” menyampaikan keduanya secara alami tanpa membuat hubungan logisnya terlalu kuat.
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Kata kerja ini berarti masuk ke dalam. “Masuk” merupakan ungkapan naratif yang paling alami dalam bahasa Indonesia; tempat yang dimasuki sudah jelas dari konteks.
- source_word: ὁ ἄλλος μαθητής
  choice: murid yang lain
  rationale: “Murid” adalah padanan baku dan tepat bagi μαθητής dalam Injil Yohanes, sedangkan “yang lain” mempertahankan pembedaan tokoh dalam teks.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: yang tiba lebih dahulu di makam itu
  rationale: Frasa ini menjelaskan bahwa murid tersebut telah sampai sebelum Petrus. “Tiba lebih dahulu” mengungkapkan urutan waktunya secara jelas dan alami.
- source_word: μνημεῖον
  choice: makam
  rationale: Dalam konteks penguburan dan kebangkitan ini, kata tersebut menunjuk pada tempat jenazah diletakkan. “Makam” tepat dan lazim dalam bahasa Indonesia modern.
- source_word: καὶ εἶδεν
  choice: Ia melihat
  rationale: Kalimat baru dengan subjek “Ia” menjaga kejelasan setelah klausa relatif, sedangkan “melihat” merupakan padanan langsung tanpa menambahkan objek yang tidak disebutkan.
- source_word: ἐπίστευσεν
  choice: percaya
  rationale: Bentuk Yunani tidak menyebutkan objek atau isi kepercayaan itu. “Percaya” mempertahankan keringkasan dan keterbukaan makna tersebut.
theological_decisions:
- issue: Apa yang dipercayai murid itu
  choice: Kata kerja diterjemahkan secara mutlak sebagai “percaya” tanpa menyebutkan isinya.
  alternative: Ia percaya bahwa Yesus telah bangkit; ia memercayai laporan Maria; atau ia mulai beriman.
  rationale: Teks Yunani tidak menyatakan objek kepercayaannya. Menambah isi tertentu akan menutup pertanyaan tafsir yang sengaja tetap terbuka, khususnya jika ayat ini dibaca bersama ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur dipecah menjadi dua kalimat agar rujukan subjek jelas, tanpa menghilangkan urutan tindakan dalam teks Yunani. Penanda catatan kaki ditempatkan langsung pada kata atau klausa yang diterangkannya.
