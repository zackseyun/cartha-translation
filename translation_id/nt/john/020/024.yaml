  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: id
  text: Tomas, salah seorang dari Kedua Belas, yang disebut Kembar, tidak bersama mereka ketika Yesus datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ di sini menandai peralihan naratif ringan, bukan pertentangan yang kuat. Alur bahasa Indonesia sudah alami tanpa kata penghubung tambahan.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: salah seorang dari Kedua Belas murid
  rationale: Ungkapan ini mengenali Tomas sebagai anggota kelompok khusus para rasul. Kata 'murid' ditambahkan demi kejelasan alami bagi pembaca Indonesia, sedangkan kapitalisasi menandai sebutan kelompok.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: yang disebut Didimus
  rationale: Didimus dipertahankan sebagai bentuk nama atau julukan Yunani yang digunakan teks, sementara arti leksikalnya, 'Kembar', dijelaskan dalam catatan kaki.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: tidak bersama mereka
  rationale: Terjemahan langsung dan alami dari bentuk imperfek εἰμί dengan μετά, yang menyatakan ketidakhadiran Tomas pada saat itu.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: ketika Yesus datang
  rationale: Menerjemahkan klausa secara langsung tanpa menambahkan rincian mengenai cara atau tempat kedatangan Yesus.
theological_decisions:
- issue: Penerjemahan Δίδυμος
  choice: Didimus dalam teks, dengan arti 'Kembar' dalam catatan kaki
  alternative: menerjemahkannya langsung sebagai 'Kembar'
  rationale: Pilihan ini mempertahankan bentuk sebutan Yunani yang dikenal sebagai nama atau julukan sekaligus membuat maknanya transparan melalui catatan kaki; tidak ada persoalan doktrinal yang ditentukan oleh pilihan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan fokus naratif pada ketidakhadiran Tomas tanpa menambahkan penanda waktu atau pertentangan yang tidak eksplisit.
