  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: id
  text: Ketika membungkuk untuk melihat ke dalam, ia melihat kain-kain linen tergeletak[a], tetapi ia tidak masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia melihat kain-kain linen yang tergeletak”; partisip Yunani dapat dipahami berhubungan erat dengan “kain-kain linen”, tanpa menyatakan tempatnya secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: membungkuk dan melihat ke dalam
  rationale: Partisip aoris ini menggambarkan gerakan tubuh sekaligus arah pandangan murid itu di pintu makam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: βλέπει
  choice: ia melihat
  rationale: Bentuk kini Yunani dipertahankan sebagai kala kini historis untuk menjaga kejelasan dan daya hidup narasi Yohanes.
- source_word: κείμενα
  choice: tergeletak
  rationale: Partisip dari κεῖμαι menyatakan bahwa kain-kain itu berada dalam posisi terbaring atau terletak. 'Tergeletak' menyampaikan keadaan yang tampak tanpa menyiratkan siapa yang menaruhnya.
- source_word: τὰ ὀθόνια
  choice: kain-kain linen
  rationale: Istilah ini menunjuk pada potongan atau kain linen yang dalam konteks ini berkaitan dengan penguburan. Terjemahan langsung menghindari penambahan makna yang sudah tersedia dari konteks.
- source_word: οὐ μέντοι
  choice: tetapi ... tidak
  rationale: Ungkapan ini menandai pertentangan ringan antara tindakan melihat dan tidak masuk; susunan ini wajar dan jelas dalam bahasa Indonesia.
- source_word: εἰσῆλθεν
  choice: ia tidak masuk
  rationale: Verba aoris ini secara langsung menyatakan tindakan memasuki makam. 'Masuk' merupakan padanan Indonesia yang alami dan tepat.
