  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: id
  text: Maka Petrus dan murid yang lain itu keluar dan sedang dalam perjalanan menuju makam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Bentuk aoris dari ἐξέρχομαι menyatakan tindakan meninggalkan suatu tempat. “Keluar” mempertahankan unsur arah dan wajar dalam narasi Indonesia.
- source_word: οὖν
  choice: Maka
  rationale: οὖν menghubungkan tindakan ini sebagai kelanjutan atau akibat dari ayat sebelumnya. “Maka” alami dalam narasi dan tidak seformal “karena itu”.
- source_word: ὁ Πέτρος
  choice: Petrus
  rationale: Nama ini memakai bentuk baku yang sudah mapan dalam bahasa Indonesia.
- source_word: ὁ ἄλλος μαθητής
  choice: murid yang lain itu
  rationale: μαθητής diterjemahkan “murid” dalam konteks Injil, sedangkan artikel dan ἄλλος menunjuk kepada murid lain yang sudah dikenal dari konteks.
- source_word: ἤρχοντο
  choice: mereka pergi menuju
  rationale: Bentuk imperfek ἔρχομαι menggambarkan gerak yang sedang berlangsung. “Pergi menuju” menyampaikan gerak ke suatu tujuan secara alami; nuansa progresif dijelaskan dalam catatan kaki karena bentuk “sedang pergi menuju” terasa kurang alami dalam rangkaian kalimat ini.
- source_word: εἰς τὸ μνημεῖον
  choice: menuju makam
  rationale: Dalam konteks ini μνημεῖον adalah makam tempat Yesus dibaringkan. “Menuju” menyatakan gerak ke arah tujuan tanpa menyiratkan bahwa mereka sudah masuk ke dalam makam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Maka” menjaga hubungan dengan konteks sebelumnya, sedangkan “lalu” membuat urutan kedua tindakan jelas dan alami. Pengulangan subjek “mereka” menghindari ambiguitas serta mencerminkan peralihan dari verba tunggal Yunani ke verba jamak.
