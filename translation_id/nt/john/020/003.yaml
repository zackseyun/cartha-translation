review_pass:
  verdict: revise
  source_fidelity: Terjemahan dasar menyampaikan keberangkatan Petrus dan murid yang lain menuju makam dengan tepat. Namun, “pergi menuju” tidak secara jelas mengungkapkan aspek imperfek ἤρχοντο; nuansa tindakan yang sedang berlangsung sebaiknya hadir dalam teks utama, bukan hanya sebagai alternatif catatan kaki.
  naturalness: “Maka Petrus dan murid yang lain itu keluar, lalu mereka sedang menuju makam” tetap baku dan dapat dipahami, tetapi kurang luwes. “Maka Petrus dan murid yang lain itu keluar dan sedang dalam perjalanan menuju makam” lebih alami serta menyatakan dua tahap narasi dengan jelas.
  terminology: “Petrus,” “murid yang lain itu,” dan “makam” sesuai dengan pemakaian Indonesia modern dan konteks Yohanes. “Makam” tidak menyiratkan bahwa mereka telah masuk ke dalamnya.
  issues:
  - severity: medium
    issue: Aspek imperfek ἤρχοντο tidak cukup tampak dalam teks utama.
    rationale: Frasa “mereka pergi menuju” dapat dibaca sebagai tindakan sederhana. Walaupun catatan kaki menyebut “sedang menuju,” terjemahan optimal-ekuivalen sebaiknya mempertahankan aspek progresif dalam teks utama bila dapat dilakukan secara alami.
  - severity: low
    issue: Catatan kaki menyajikan pembacaan yang lebih dekat dengan aspek Yunani sebagai alternatif, padahal pembacaan itu dipakai dalam revisi teks utama.
    rationale: Setelah aspek progresif dipertahankan dalam teks, catatan kaki lama menjadi tidak lagi diperlukan dan sebaiknya dihapus agar tidak redundan.
  revised_text: Maka Petrus dan murid yang lain itu keluar dan sedang dalam perjalanan menuju makam.
