id: JHN.20.16
reference: John 20:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: id
  text: Yesus berkata kepadanya, “Maria.” Perempuan itu berpaling dan berkata kepada-Nya dalam bahasa Ibrani[a], “Rabuni!” (yang berarti “Guru”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam bahasa Aram.” Ungkapan Yohanes “dalam bahasa Ibrani” dapat merujuk secara lebih luas pada bahasa Semitik yang digunakan di Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dipertahankan secara wajar dengan verba Indonesia yang tidak menandai kala; gaya narasi Yohanes tetap hidup tanpa memaksakan penanda waktu.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Dativus penerima diungkapkan secara alami dengan 'kepada'; rujukan feminin sudah jelas dari konteks.
- source_word: Μαριάμ
  choice: Maria
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: στραφεῖσα
  choice: berpaling
  rationale: Partisip aoris menyatakan tindakan yang menyertai atau mendahului ucapannya; rangkaian 'berpaling dan berkata' alami sekaligus menjaga urutan tindakan.
- source_word: ἐκείνη
  choice: perempuan itu
  rationale: Mempertahankan nuansa demonstratif ἐκείνη lebih jelas daripada sekadar 'ia', tanpa menyiratkan nada merendahkan.
- source_word: Ἑβραϊστί
  choice: dalam bahasa Ibrani
  rationale: Mengikuti bunyi langsung adverbia Yunani; kemungkinan bahwa istilah ini mencakup bahasa Aram dijaga dalam catatan kaki.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: Transliterasi yang lazim dalam bahasa Indonesia mempertahankan sapaan Semitik karena Injil sendiri langsung memberi artinya.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: yang berarti “Guru”
  rationale: Ungkapan ini memperkenalkan penjelasan arti; 'Guru' tepat untuk vokatif Διδάσκαλε dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna Ἑβραϊστί dalam narasi Yohanes
  choice: dalam bahasa Ibrani
  alternative: dalam bahasa Aram
  rationale: Teks utama mengikuti istilah Yunani secara langsung dan tidak menyelesaikan secara diam-diam perdebatan mengenai bahasa Semitik yang dimaksud; kemungkinan bahasa Aram dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kepada-Nya' mengikuti kebiasaan ortografis Indonesia untuk pronomina yang merujuk kepada Yesus. Tanda seru pada 'Rabuni!' mempertahankan daya emosional sapaan Maria.
