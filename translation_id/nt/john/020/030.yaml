  rationale: Revisi hanya memperjelas rujukan klausa relatif dengan mengulang “tanda-tanda itu” dalam kalimat kedua. Susunan ini mempertahankan isi, aspek pasif “tidak tertulis”, dan nuansa diskursif μέν melalui “memang”, tanpa menambahkan makna teologis atau posesif yang tidak tersurat. Jangkar catatan dipindahkan ke “tanda-tanda itu”, yaitu istilah yang dijelaskan.
