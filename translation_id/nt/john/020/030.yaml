source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: id
  text: Yesus memang melakukan banyak tanda lain di hadapan murid-murid. Tanda-tanda itu tidak tertulis dalam kitab ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat”; Yunani “tanda”, yang menekankan perbuatan yang menunjuk kepada identitas Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: Memang, ... banyak ... lain
  rationale: Gabungan partikel μέν οὖν dan καὶ ἄλλα meneruskan sekaligus merangkum uraian sebelumnya serta mengawali kontras dengan ayat 31. 'Memang' secara alami menandai bagian pertama kontras 'memang ... tetapi', sedangkan 'banyak ... lain' menyampaikan isi utamanya tanpa menerjemahkan setiap partikel secara kaku.
- source_word: σημεῖα
  choice: tanda
  rationale: Dalam Injil Yohanes, istilah ini menunjuk pada perbuatan ajaib yang menyatakan identitas dan karya Yesus. 'Tanda' mempertahankan muatan khas Yohanes lebih baik daripada sekadar 'mukjizat'.
- source_word: ἐποίησεν
  choice: melakukan
  rationale: Dalam konteks tanda atau perbuatan, 'melakukan' merupakan padanan Indonesia yang wajar dan cukup dekat dengan ποιέω.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: di hadapan murid-murid-Nya
  rationale: '''Di hadapan'' menyatakan bahwa para murid hadir sebagai saksi. Sufiks ''-Nya'' memperjelas rujukan yang sudah nyata dalam konteks, meskipun bahasa Yunani secara harfiah memakai artikel tanpa pronomina posesif.'
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: yang tidak tertulis
  rationale: 'Ungkapan ini mempertahankan bentuk pasif dan keadaan hasil dari bentuk perfektum: tanda-tanda itu tidak tercantum dalam kitab tersebut.'
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: dalam kitab ini
  rationale: '''Kitab'' merupakan istilah Indonesia yang alami dan bermartabat bagi karya tertulis yang sedang dirujuk, tanpa membatasi bentuk fisiknya sebagai gulungan.'
theological_decisions:
- issue: Pemakaian σημεῖα dalam Injil Yohanes
  choice: tanda
  alternative: mukjizat
  rationale: '''Tanda'' mempertahankan penekanan bahwa perbuatan Yesus bukan hanya demonstrasi kuasa, melainkan menunjuk kepada identitas dan misi-Nya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. 'Memang' dipakai sebagai penanda wacana yang berkaitan dengan kontras pada ayat berikutnya; struktur kalimat dijaga ringkas dan mudah dipahami.
