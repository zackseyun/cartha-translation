source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: id
  text: Setelah mengatakan semua itu, Maria berbalik dan melihat Yesus berdiri di sana, dan ia tidak tahu bahwa orang itu adalah Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia tidak mengenalinya sebagai Yesus.” Secara harfiah, teks Yunani berbunyi, “ia tidak tahu bahwa itu adalah Yesus,” yang menyatakan bahwa ia tidak mengetahui identitas orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Bentuk jamak demonstratif dipertahankan secara alami dalam bahasa Indonesia dan menunjuk pada perkataan Maria sebelumnya.
- source_word: εἰποῦσα
  choice: Sesudah mengatakan
  rationale: Partisip aoris feminin menyatakan tindakan yang mendahului verba utama; bentuk temporal ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: Maria berbalik
  rationale: Ungkapan Yunani berarti berbalik ke arah belakang. Nama Maria dipakai untuk memperjelas subjek yang tersirat tanpa mengubah rujukannya.
- source_word: θεωρεῖ
  choice: melihat
  rationale: Present historis dialihkan ke bentuk naratif Indonesia; 'melihat' menyampaikan persepsi aktual tanpa menambahkan gagasan pengenalan.
- source_word: ἑστῶτα
  choice: berdiri di sana
  rationale: Partisip perfek menggambarkan keadaan Yesus yang sedang berdiri; 'di sana' membuat adegan alami tanpa menentukan jarak yang tidak disebutkan.
- source_word: οὐκ ᾔδει
  choice: tidak tahu
  rationale: Pilihan ini dekat dengan arti dasar οἶδα dan mempertahankan ketegangan antara melihat Yesus dan belum mengetahui identitas-Nya.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: bahwa itu Yesus
  rationale: Klausa identifikasi ini diterjemahkan dengan susunan Indonesia yang wajar, tanpa menjelaskan penyebab ketidaktahuan Maria.
theological_decisions:
- issue: Identifikasi Yesus yang telah bangkit
  choice: ia tidak tahu bahwa itu Yesus
  alternative: ia tidak mengenali bahwa itu Yesus
  rationale: Teks menyatakan bahwa Maria tidak mengetahui identitas orang yang dilihatnya, tetapi tidak menerangkan penyebabnya. Terjemahan utama mempertahankan pernyataan itu tanpa memasukkan penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Maria' dipakai sebagai subjek eksplisit agar rujukan pronomina jelas dalam ayat yang berdiri sendiri. Konjungsi 'tetapi' menyampaikan pertentangan kontekstual antara melihat dan tidak mengetahui, meskipun καί secara bentuk berarti 'dan'.
