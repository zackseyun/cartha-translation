  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: id
  text: dan ia melihat dua malaikat berpakaian putih sedang duduk, yang satu di dekat kepala dan yang lain di dekat kaki, di tempat tubuh Yesus tadinya terbaring.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di tempat tubuh Yesus terbaring.” Bentuk Yunani menyatakan keadaan yang berlangsung pada masa lampau; kata “tadinya” memperjelas bahwa tubuh itu tidak lagi berada di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ia melihat
  rationale: Bentuk kini historis menghidupkan narasi. Subjeknya, berdasarkan konteks, adalah Maria Magdalena; pronomina “ia” alami dalam bahasa Indonesia dan tidak mengulang nama yang tidak terdapat dalam ayat ini.
- source_word: δύο ἀγγέλους
  choice: dua malaikat
  rationale: Walaupun ἄγγελος dapat berarti “utusan”, konteks makam kebangkitan dan pakaian putih menunjukkan makhluk surgawi.
- source_word: ἐν λευκοῖς
  choice: berpakaian putih
  rationale: Ungkapan Yunani secara harfiah berarti “dalam [yang] putih” dan secara idiomatis menunjuk pada pakaian putih. Pilihan ini jelas dan alami tanpa menambahkan jenis pakaian.
- source_word: καθεζομένους
  choice: sedang duduk
  rationale: Partisipel ini menyatakan postur kedua malaikat. “Sedang duduk” mempertahankan aspek duratif dalam adegan tersebut.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: yang satu di dekat kepala dan yang lain di dekat kaki
  rationale: πρός dengan datif menyatakan posisi berdekatan. “Di dekat” mempertahankan nuansa kedekatan tanpa menyiratkan titik posisi yang terlalu pasti; kepala dan kaki menandai kedua ujung tempat tubuh itu terbaring.
- source_word: ὅπου
  choice: di tempat
  rationale: Dalam susunan bahasa Indonesia, “di tempat” menghubungkan posisi para malaikat secara alami dengan lokasi tubuh Yesus sebelumnya.
- source_word: ἔκειτο
  choice: tadinya terbaring
  rationale: Imperfek κεῖμαι menyatakan keadaan yang berlangsung pada waktu lampau. “Tadinya” memperjelas bahwa keadaan tersebut mendahului penglihatan Maria tanpa menghilangkan nilai duratifnya.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: tubuh Yesus
  rationale: “Tubuh” adalah padanan baku dan hormat bagi σῶμα, sedangkan bentuk posesif alami menyampaikan genitif τοῦ Ἰησοῦ.
theological_decisions:
- issue: Hakikat ἀγγέλους dalam konteks kebangkitan
  choice: malaikat surgawi
  alternative: utusan manusia
  rationale: Makna leksikal umum “utusan” tetap mungkin bagi kata itu sendiri, tetapi konteks makam kosong dan pakaian putih kuat menunjuk kepada malaikat. Ini merupakan keputusan kontekstual, bukan penambahan ajaran.
- issue: Daya temporal ἔκειτο
  choice: keadaan lampau yang telah berakhir, “tadinya terbaring”
  alternative: keadaan lampau sederhana, “terbaring” atau “sedang terbaring”
  rationale: Konteks menunjukkan tubuh Yesus tidak lagi berada di tempat itu. “Tadinya” menyatakan hubungan waktu tersebut secara alami, sementara “terbaring” mempertahankan gambaran keadaan dari bentuk imperfek.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Berpakaian putih” lebih jelas dan idiomatis daripada terjemahan harfiah “dalam putih”. Penanda catatan kaki [a] ditempatkan sesudah klausa yang diterangkannya.
