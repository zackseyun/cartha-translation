source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: id
  text: dan kain penutup wajah[a] yang sebelumnya berada di atas kepala-Nya tidak terletak bersama kain-kain linen itu, melainkan tergulung tersendiri di satu tempat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain kepala.” Istilah Yunani ini juga dapat berarti “saputangan”; dalam konteks ini, kain itu berada di atas kepala Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: kain penutup wajah
  rationale: Dalam konteks pemakaman ini, istilah tersebut menunjuk pada kain yang dikenakan pada bagian kepala atau wajah Yesus. Pilihan ini jelas dalam bahasa Indonesia dan tidak menyiratkan bahwa kain itu membungkus seluruh jenazah.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: di atas kepala-Nya
  rationale: Terjemahan langsung ini mempertahankan cakupan preposisi Yunani tanpa menentukan secara berlebihan apakah kain itu berada di atas, menutupi, atau melingkari kepala.
- source_word: ὀθονίων
  choice: kain-kain linen
  rationale: Bentuk jamak menunjuk pada kain-kain linen di dalam makam. Pilihan ini mempertahankan bahan dan jumlahnya tanpa menambahkan rekonstruksi tertentu mengenai bentuk balutannya.
- source_word: κείμενον
  choice: terletak
  rationale: Partisipel dari κεῖμαι menggambarkan keadaan suatu benda yang terbaring atau berada pada suatu tempat; 'terletak' alami untuk benda dalam konteks ini.
- source_word: χωρὶς
  choice: tersendiri
  rationale: Kata ini menandai bahwa kain penutup wajah berada terpisah dari kain-kain linen lainnya.
- source_word: ἐντετυλιγμένον
  choice: tergulung
  rationale: Partisipel perfek pasif ini menyatakan keadaan kain yang telah dibungkus atau digulung. 'Tergulung' mempertahankan gambaran bentuk tanpa menyimpulkan bahwa kain itu dilipat dengan sengaja dan rapi.
- source_word: εἰς ἕνα τόπον
  choice: di satu tempat
  rationale: Ungkapan ini menunjukkan satu lokasi tersendiri tanpa menambahkan gagasan 'tempatnya sendiri' yang tidak dinyatakan secara eksplisit.
- source_word: καὶ
  choice: dan
  rationale: Kata sambung ini meneruskan uraian naratif dari ayat sebelumnya.
theological_decisions:
- issue: Apakah susunan kain-kain pemakaman menyampaikan klaim teologis di luar pengamatan naratif
  choice: Ayat diterjemahkan sebagai uraian mengenai letak dan keadaan kain penutup wajah yang terpisah.
  alternative: Menafsirkan kain yang tergulung sebagai simbol keteraturan atau sebagai bukti bagi rekonstruksi tertentu tentang peristiwa kebangkitan.
  rationale: Teks Yunani hanya menggambarkan lokasi dan keadaan kain tersebut; teks tidak secara eksplisit memberikan makna simbolis atau kesimpulan apologetis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Bentuk 'kepala-Nya' mengikuti kebiasaan penulisan pronomina ilahi dalam Alkitab bahasa Indonesia. Istilah 'tergulung' dipilih untuk menjaga keluasan makna ἐντετυλιγμένον dan menghindari kesan yang terlalu pasti bahwa kain itu dilipat rapi.
