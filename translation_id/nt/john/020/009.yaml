  source_fidelity: 'Teks Indonesia dengan setia mencerminkan οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι: hubungan penjelas “Sebab,” aspek temporal “sampai saat itu ... belum,” pengertian akan Kitab Suci, keharusan δεῖ, serta infinitif aktif “bangkit” semuanya terpelihara. “Dari antara orang mati” dengan tepat mengungkapkan ἐκ νεκρῶν.'
