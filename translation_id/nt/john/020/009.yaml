id: JHN.20.9
reference: John 20:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: id
  text: Sebab, sampai saat itu mereka belum memahami Kitab Suci, yaitu bahwa Dia harus bangkit dari antara orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia harus dibangkitkan dari antara orang mati.” Dalam bahasa Yunani, verba yang digunakan di sini berbentuk aktif, “bangkit.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: sampai saat itu ... belum
  rationale: Mengungkapkan arti temporal ‘belum hingga saat itu’ secara alami dalam konteks narasi lampau.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan wacananya.
- source_word: ᾔδεισαν
  choice: memahami
  rationale: Dalam hubungan dengan Kitab Suci dan klausa isinya, kata ini menunjuk pada pemahaman akan makna, bukan sekadar pengetahuan bahwa tulisan itu ada.
- source_word: τὴν γραφὴν
  choice: Kitab Suci
  rationale: Bentuk tunggal γραφή menunjuk pada tulisan suci yang berwibawa; terjemahan ini tidak memutuskan apakah yang dimaksud adalah satu nas tertentu atau kesaksian Kitab Suci secara umum.
- source_word: ὅτι
  choice: yaitu bahwa
  rationale: Memperkenalkan isi Kitab Suci yang belum mereka pahami; ‘yaitu’ memperjelas hubungan itu secara alami dalam bahasa Indonesia.
- source_word: δεῖ
  choice: harus
  rationale: Mempertahankan unsur keharusan, termasuk kemungkinan nuansa keharusan ilahi, tanpa menambah penjelasan teologis.
- source_word: αὐτὸν
  choice: Dia
  rationale: Menjadi subjek alami bagi klausa infinitif dalam bahasa Indonesia dan merujuk kepada Yesus.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mencerminkan bentuk jamak νεκρῶν dan idiom kebangkitan dengan jelas serta wajar.
- source_word: ἀναστῆναι
  choice: bangkit
  rationale: Mempertahankan bentuk aktif verba Yunani, alih-alih mengubahnya menjadi bentuk pasif ‘dibangkitkan’.
theological_decisions:
- issue: Ungkapan kebangkitan dan pelakunya
  choice: Dia harus bangkit dari antara orang mati
  alternative: Dia harus dibangkitkan dari antara orang mati
  rationale: Teks Yunani memakai infinitif aktif ἀναστῆναι. Terjemahan utama mempertahankan bentuk aktif dan tidak menyelaraskannya secara paksa dengan ungkapan pasif tentang kebangkitan di bagian lain Perjanjian Baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. ‘Sampai saat itu’ dipakai untuk memperjelas οὐδέπω dalam kerangka peristiwa lampau; ‘dari antara orang mati’ mempertahankan nuansa ungkapan Yunani.
