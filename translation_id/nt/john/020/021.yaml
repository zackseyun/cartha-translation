id: JHN.20.21
reference: John 20:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: id
  text: Lalu Yesus berkata lagi kepada mereka, “Damai sejahtera bagi kalian. Sebagaimana Bapa telah mengutus Aku, demikian juga Aku mengutus kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Dalam konteks naratif, οὖν melanjutkan adegan dan menghubungkan ucapan ini dengan peristiwa sebelumnya; “lalu” alami dalam bahasa Indonesia tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: πάλιν
  choice: lagi
  rationale: Menunjukkan bahwa Yesus mengulangi salam yang telah diucapkan dalam ayat sebelumnya.
- source_word: Εἰρήνη ὑμῖν
  choice: Damai sejahtera bagi kalian
  rationale: Mempertahankan bentuk singkat tanpa verba dari ungkapan Yunani sekaligus menyampaikan cakupan εἰρήνη sebagai salam yang mencakup kesejahteraan, bukan sekadar ketiadaan konflik.
- source_word: καθὼς
  choice: Sebagaimana
  rationale: Memperkenalkan perbandingan antara pengutusan Yesus oleh Bapa dan pengutusan para murid oleh Yesus, dengan ragam yang wajar dan bermartabat.
- source_word: ἀπέσταλκέν
  choice: telah mengutus
  rationale: 'Mencerminkan bentuk perfektum: pengutusan itu telah terjadi dan tetap relevan bagi tugas Yesus.'
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Mempertahankan sebutan khas Yohanes tanpa menambahkan kata milik seperti “Bapa-Ku,” yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: κἀγὼ
  choice: demikian juga Aku
  rationale: Menyatakan hubungan komparatif dan penekanan pada subjek “Aku” tanpa melebihkan kesetaraan antara kedua pengutusan.
- source_word: πέμπω
  choice: Aku mengutus
  rationale: Kala kini Yunani menyatakan tindakan pengutusan yang berlangsung dalam adegan ini; bentuk kini bahasa Indonesia sudah cukup alami dan tidak perlu diperluas menjadi konstruksi progresif.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Menandai dengan jelas bahwa pronomina orang kedua bersifat jamak dan ditujukan kepada para murid yang hadir.
theological_decisions:
- issue: Hubungan antara pengutusan Yesus oleh Bapa dan pengutusan para murid oleh Yesus
  choice: “Sebagaimana Bapa telah mengutus Aku, demikian juga Aku mengutus kalian.”
  alternative: “Sama seperti Bapa mengutus Aku, Aku pun mengutus kalian.”
  rationale: Terjemahan mempertahankan analogi misi yang dinyatakan teks, tetapi tidak menambahkan bahwa kewenangan, cara, atau jabatan dalam kedua pengutusan itu identik sepenuhnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak, sedangkan kapitalisasi “Aku” mengikuti kelaziman penerbitan Alkitab Indonesia ketika merujuk kepada Yesus. Susunan kalimat menjaga kesejajaran retoris teks Yunani.
