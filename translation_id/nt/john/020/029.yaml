  source_fidelity: 'Terjemahan secara akurat menyampaikan struktur dan makna Yunani: λέγει diterjemahkan alami dalam bentuk lampau naratif; ὅτι dipahami secara kausal; perfek ἑώρακάς ditandai dengan “telah melihat”; dan pembacaan interogatif yang ditandai dalam SBLGNT dipertahankan. “Mereka yang tidak melihat, namun percaya” menangkap kelompok yang tidak melihat tetapi percaya; kontrasnya wajar dalam konteks meskipun καί sendiri berarti “dan.”'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada Alkitabiah tanpa terdengar kuno secara berlebihan. “Yesus berkata kepadanya,” “engkau,” serta “Berbahagialah mereka” sesuai untuk dialog dan ucapan berkat dalam register ini. Tanda baca pertanyaan dan penempatan catatan kaki juga alami.
  terminology: “Berbahagialah” merupakan padanan yang mapan dan tepat untuk μακάριοι dalam ucapan berkat. Kapitalisasi “Aku” konsisten dengan kebiasaan penerbitan Alkitab Indonesia. Tidak ada istilah teologis yang ditambah atau dipersempit secara denominational.
