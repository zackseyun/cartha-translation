id: JHN.20.29
reference: John 20:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Karena engkau telah melihat Aku, engkau percaya?[a] Berbahagialah mereka yang tidak melihat, namun percaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena engkau telah melihat Aku, engkau percaya.” Teks Yunani dapat dibaca sebagai pertanyaan ataupun pernyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Kala kini historis λέγει dialihkan dengan bentuk lampau yang alami dalam narasi Indonesia; αὐτῷ tetap diterjemahkan dan merujuk kepada Tomas.
- source_word: Ὅτι
  choice: Karena
  rationale: Ὅτι paling wajar dipahami sebagai pengantar sebab yang menghubungkan tindakan melihat dengan percaya, tanpa menutup kemungkinan bahwa seluruh klausa merupakan pernyataan.
- source_word: ἑώρακάς με
  choice: engkau telah melihat Aku
  rationale: Bentuk perfek ἑώρακάς menyatakan tindakan melihat yang telah terjadi dan tetap relevan; 'telah melihat' mempertahankan nuansa itu.
- source_word: πεπίστευκας
  choice: engkau percaya
  rationale: Dalam bahasa Indonesia, 'percaya' secara alami menyatakan keadaan iman sekarang yang dihasilkan oleh apa yang telah terjadi; 'telah percaya' juga mungkin, tetapi lebih mudah terdengar semata-mata sebagai tindakan lampau.
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan ini merupakan padanan Indonesia yang mapan, wajar, dan bermartabat untuk ucapan berkat μακάριοι, bukan sekadar perasaan senang.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: mereka yang tidak melihat, namun percaya
  rationale: Partisip substantival diterjemahkan secara idiomatis sebagai 'mereka yang'. 'Namun' menyatakan kontras yang nyata antara tidak melihat dan percaya, meskipun καί secara leksikal berarti 'dan'.
theological_decisions:
- issue: Daya retoris klausa pertama Yesus
  choice: 'Diterjemahkan sebagai pertanyaan: “Karena engkau telah melihat Aku, engkau percaya?”'
  alternative: 'Diterjemahkan sebagai pernyataan: “Karena engkau telah melihat Aku, engkau percaya.”'
  rationale: Teks Yunani dapat diberi tanda baca sebagai pertanyaan atau pernyataan. Pembacaan interogatif sesuai dengan tanda baca SBLGNT dan menampilkan kontras retoris dengan berkat berikutnya, sedangkan kemungkinan pernyataan dipertahankan dalam catatan kaki.
- issue: Hubungan antara tidak melihat dan percaya
  choice: “tidak melihat, namun percaya”
  alternative: “tidak melihat dan percaya”
  rationale: καί secara eksplisit berarti 'dan', tetapi dalam konteks ini kedua unsur berkontras. 'Namun' membuat hubungan yang tersirat itu alami dalam bahasa Indonesia tanpa menjadikan iman tanpa penglihatan sebagai doktrin yang lebih terperinci daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti 'engkau' dipakai untuk sapaan tunggal dalam dialog Alkitab, dan 'Aku' dikapitalisasi menurut kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus.
