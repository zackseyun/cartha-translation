  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: id
  text: Kemudian Simon Petrus juga datang, mengikuti dia, lalu masuk ke dalam makam itu; ia melihat kain-kain linen terletak di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: tiba
  rationale: Bentuk kini historis menghidupkan narasi, tetapi bahasa Indonesia lazimnya tidak menandai kala pada verba; 'tiba' secara alami menyampaikan kedatangan dalam urutan cerita.
- source_word: οὖν
  choice: Kemudian
  rationale: Dalam konteks ini menandai kelanjutan dan urutan naratif, bukan kesimpulan logis yang kuat.
- source_word: καὶ Σίμων Πέτρος
  choice: Simon Petrus juga
  rationale: 'καί paling wajar dipahami secara aditif: Simon Petrus menyusul murid yang lain dan turut tiba.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: dengan mengikuti dia
  rationale: Mempertahankan tindakan yang berlangsung bersamaan serta rujukan pronomina yang ada dalam teks Yunani.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: masuk ke dalam makam itu
  rationale: Menyampaikan gerak masuk secara eksplisit; μνημεῖον dalam konteks pemakaman berarti makam.
- source_word: θεωρεῖ
  choice: Ia melihat
  rationale: θεωρέω menunjukkan pengamatan langsung. Bahasa Indonesia tidak mengharuskan perbedaan bentuk kala, sehingga daya visualnya dapat dipertahankan tanpa catatan tentang kini historis.
- source_word: τὰ ὀθόνια
  choice: kain-kain linen
  rationale: Terjemahan transparan yang mempertahankan bentuk jamak dan bahan kain tanpa menambahkan fungsi pemakaman yang hanya tersirat oleh konteks.
- source_word: κείμενα
  choice: terletak di sana
  rationale: Menggambarkan kain-kain itu berada dalam posisi tertentu; 'di sana' membuat adegan alami dalam bahasa Indonesia tanpa menyiratkan siapa yang meletakkannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur dibagi menjadi dua kalimat agar rangkaian tindakan mudah dipahami. Kala kini historis Yunani tidak diberi catatan karena verba Indonesia tidak mengalami infleksi kala; pergeseran itu tidak dapat direproduksi secara formal dengan alami.
