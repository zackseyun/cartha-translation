id: JHN.20.1
reference: John 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: id
  text: Pada hari pertama minggu itu[a], pagi-pagi ketika hari masih gelap, Maria Magdalena datang ke makam dan melihat bahwa batu itu telah disingkirkan dari makam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada satu dari sabat-sabat,” sebuah ungkapan yang berarti “pada hari pertama minggu itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Pada hari pertama minggu itu
  rationale: Ungkapan Yunani ini secara harfiah berbentuk ‘pada satu dari sabat-sabat’, tetapi merupakan idiom Koine untuk hari pertama dalam minggu. Partikel δέ tidak perlu dinyatakan tersendiri dalam bahasa Indonesia karena alur narasi sudah alami tanpa penanda tambahan.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini historis Yunani menghadirkan peristiwa secara hidup; bahasa Indonesia tidak menandai kala secara morfologis, sehingga ‘datang’ secara alami mempertahankan keterbukaan aspek naratif itu.
- source_word: πρωῒ σκοτίας ἔτι οὔσης
  choice: pagi-pagi ketika hari masih gelap
  rationale: ‘Pagi-pagi’ menyatakan waktu yang dini tanpa menyiratkan bahwa fajar telah terbit, sedangkan klausa berikut mempertahankan keadaan yang masih gelap.
- source_word: εἰς τὸ μνημεῖον
  choice: ke makam
  rationale: Dalam konteks penguburan, μνημεῖον menunjuk pada makam; ‘makam’ merupakan padanan Indonesia yang jelas dan wajar.
- source_word: βλέπει
  choice: melihat
  rationale: Padanan langsung yang mempertahankan kejelasan tindakan pengamatan tanpa menambahkan nuansa seperti ‘menyadari’ atau ‘memperhatikan’.
- source_word: τὸν λίθον ἠρμένον
  choice: bahwa batu itu telah disingkirkan
  rationale: Partisipel perfektif pasif menunjukkan tindakan yang sudah selesai beserta keadaan hasilnya. ‘Telah disingkirkan’ menyampaikan bahwa batu itu sudah tidak berada di tempat semula ketika Maria melihatnya, tanpa menyebut pelaku.
- source_word: ἐκ τοῦ μνημείου
  choice: dari makam
  rationale: ἐκ menyatakan pemindahan menjauh dari makam. Kata ‘pintu’ tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam teks.
theological_decisions:
- issue: Kala naratif dalam kisah kebangkitan
  choice: 'Menggunakan verba Indonesia tanpa penanda lampau eksplisit: ‘datang’ dan ‘melihat’'
  alternative: Menambahkan penanda lampau atau mengubah seluruh narasi menjadi bentuk lampau yang lebih eksplisit
  rationale: Bahasa Indonesia tidak memiliki konjugasi kala seperti bahasa Yunani. Bentuk sederhana mempertahankan kehadiran naratif dari present historis tanpa menghasilkan ungkapan Indonesia yang janggal atau menambahkan tafsiran teologis.
- issue: Pelaku yang memindahkan batu
  choice: Mempertahankan bentuk pasif ‘telah disingkirkan’ tanpa menyebut pelaku
  alternative: Menyatakan bahwa Allah, malaikat, atau seseorang telah menyingkirkan batu itu
  rationale: Teks ayat ini tidak menyebut pelakunya. Bentuk pasif menjaga ketidaktersuratan tersebut dan tidak mendahului penjelasan narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan keterangan waktu dibuat alami bagi pembaca umum, sementara bentuk pasif dan ketidaktersuratan pelaku dipertahankan. Penanda catatan kaki [a] hadir dalam teks utama.
