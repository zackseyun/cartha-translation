  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: id
  text: Maka murid-murid yang lain terus mengatakan kepadanya, “Kami telah melihat Tuhan!” Namun ia berkata kepada mereka, “Jika aku tidak melihat bekas paku pada tangan-Nya, memasukkan jariku ke dalam bekas paku itu, dan memasukkan tanganku ke dalam lambung-Nya, aku sama sekali tidak akan percaya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tidak akan pernah percaya.” Bahasa Yunani memakai bentuk penyangkalan yang sangat tegas.
    reason: Menampilkan padanan alternatif bagi οὐ μὴ πιστεύσω dan menjelaskan penekanannya tanpa membebani teks utama.
lexical_decisions:
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; frasa ini menyampaikan bahwa murid-murid lain terus memberi tahu Tomas.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan fungsi penghubung dan inferensial dalam alur narasi, yakni tanggapan para murid terhadap ketidakhadiran Tomas ketika Yesus menampakkan diri.
- source_word: οἱ ἄλλοι μαθηταί
  choice: murid-murid yang lain
  rationale: Padanan langsung dan alami yang menegaskan kontras dengan Tomas.
- source_word: Ἑωράκαμεν
  choice: Kami telah melihat
  rationale: Bentuk perfek menyatakan peristiwa yang sudah terjadi dengan relevansi yang masih berlaku bagi kesaksian mereka.
- source_word: κύριον
  choice: Tuhan
  rationale: Dalam konteks ini merupakan gelar bagi Yesus yang telah bangkit, bukan sekadar sapaan 'guru' atau 'tuan'.
- source_word: Ἐὰν μὴ ἴδω
  choice: Sebelum aku melihat
  rationale: Dalam kalimat penolakan bersyarat ini, ungkapan tersebut secara alami menyampaikan bahwa Tomas tidak akan percaya hingga syarat yang disebutkannya terpenuhi.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: pada tangan-Nya
  rationale: Bahasa Indonesia lazim menggunakan 'pada' untuk letak bekas luka di bagian tubuh, meskipun ἐν secara harfiah dapat berarti 'di dalam'.
- source_word: τύπον τῶν ἥλων
  choice: bekas paku
  rationale: τύπος menunjuk pada bekas atau jejak yang ditinggalkan paku; 'bekas paku' jelas dan alami dalam bahasa Indonesia.
- source_word: βάλω τὸν δάκτυλόν μου εἰς
  choice: memasukkan jariku ke dalam
  rationale: εἰς menyatakan gerak masuk; terjemahan ini mempertahankan gambaran konkret dan kuat dalam ucapan Tomas.
- source_word: μου τὴν χεῖρα
  choice: tanganku
  rationale: Mempertahankan kata ganti kepunyaan yang dinyatakan secara eksplisit dalam teks Yunani.
- source_word: πλευράν
  choice: lambung
  rationale: Menunjuk pada sisi tubuh Yesus, khususnya daerah luka tombak; 'lambung' merupakan istilah tubuh yang ringkas, bermartabat, dan sesuai konteks.
- source_word: οὐ μὴ πιστεύσω
  choice: aku sama sekali tidak akan percaya
  rationale: Gabungan οὐ μή dengan subjungtif aoris menyatakan penyangkalan yang sangat tegas; 'sama sekali tidak akan' mempertahankan penekanannya tanpa menjadikannya penolakan mutlak untuk selamanya.
theological_decisions:
- issue: Kekuatan penolakan Tomas dalam οὐ μὴ πιστεύσω
  choice: aku sama sekali tidak akan percaya
  alternative: aku tidak akan pernah percaya
  rationale: Teks Yunani memakai penyangkalan yang tegas, tetapi penolakan itu berada dalam konstruksi bersyarat. Terjemahan utama mempertahankan ketegasannya tanpa menyiratkan bahwa Tomas menolak percaya untuk selama-lamanya.
- issue: Arti κύριος dalam kesaksian para murid
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks penampakan Yesus yang bangkit, κύριος berfungsi sebagai gelar bagi Yesus. 'Tuhan' mempertahankan bobot kristologis teks tanpa menambahkan uraian doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'bekas paku' serta gerak 'memasukkan' dipertahankan karena merupakan bagian dari desakan konkret Tomas. Kata ganti bagi Yesus ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia.
