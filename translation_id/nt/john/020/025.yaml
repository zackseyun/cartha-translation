revisions:
- from: Karena itu, murid-murid yang lain terus berkata kepadanya, “Kami telah melihat Tuhan!” Namun, ia berkata kepada mereka, “Sebelum aku melihat bekas paku pada tangan-Nya, memasukkan jariku ke dalam bekas paku itu, dan memasukkan tanganku ke dalam lambung-Nya, aku sama sekali tidak akan percaya.”[a]
  to: Maka murid-murid yang lain terus mengatakan kepadanya, “Kami telah melihat Tuhan!” Namun ia berkata kepada mereka, “Jika aku tidak melihat bekas paku pada tangan-Nya, memasukkan jariku ke dalam bekas paku itu, dan memasukkan tanganku ke dalam lambung-Nya, aku sama sekali tidak akan percaya.”[a]
  rationale: Revisi hanya memperbaiki padanan Ἐὰν μὴ menjadi kondisi negatif eksplisit, sehingga struktur sumber dan ketegasan penolakan Tomas terpelihara. “Maka” dan “terus mengatakan” meningkatkan kelancaran bahasa Indonesia modern tanpa mengubah makna. Penanda catatan kaki dan isi catatan tetap sesuai dengan οὐ μὴ πιστεύσω.
