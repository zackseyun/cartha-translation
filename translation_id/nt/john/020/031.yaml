  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: id
  text: Tetapi semua ini telah ditulis supaya kamu percaya bahwa Yesus adalah Mesias[a], Anak Allah, dan supaya dengan percaya kamu memperoleh hidup dalam nama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah membaca bentuk aoristus, yang dapat dipahami sebagai “supaya kamu mulai percaya,” sedangkan teks utama membaca bentuk kini, yang dapat menyiratkan “supaya kamu terus percaya.” Teks utama menerjemahkannya secara luas sebagai “supaya kamu percaya.”
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: semua ini
  rationale: Menunjuk pada tanda-tanda dan hal-hal yang telah dituliskan dalam konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia tanpa menambahkan kata benda yang tidak diperlukan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan terhadap pernyataan sebelumnya.
- source_word: γέγραπται
  choice: telah ditulis
  rationale: 'Mencerminkan bentuk perfektif pasif: tindakan penulisan telah selesai dan hasilnya tetap berlaku.'
- source_word: ἵνα πιστεύητε
  choice: supaya kamu percaya
  rationale: Menyatakan tujuan dan membiarkan aspek 'percaya' cukup luas, tanpa memaksakan arti mulai percaya atau terus percaya.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan menurut maknanya dan bukan sekadar ditransliterasikan.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Mempertahankan gelar kristologis secara langsung dan tepat.
- source_word: πιστεύοντες
  choice: dengan percaya
  rationale: Menyampaikan fungsi adverbial partisipel sebagai cara atau keadaan yang berkaitan dengan memperoleh hidup.
- source_word: ζωὴν ἔχητε
  choice: kamu memperoleh hidup
  rationale: Dalam bahasa Indonesia, 'memperoleh hidup' mengungkapkan maksud memiliki atau mendapat hidup secara wajar tanpa menambahkan 'kekal', yang tidak terdapat dalam ayat ini.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: dalam nama-Nya
  rationale: Mempertahankan ungkapan khas Yohanes dan keluasan makna teologisnya tanpa parafrasa yang mempersempit.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini di sini merupakan gelar yang menyatakan identitas mesianik Yesus; 'Mesias' mempertahankan maknanya sebagai gelar.
- issue: Varian tekstual dan aspek πιστεύητε
  choice: supaya kamu percaya
  alternative: supaya kamu terus percaya / supaya kamu mulai percaya
  rationale: Teks SBLGNT mencetak bentuk kini subjunktif πιστεύητε, sedangkan varian aoristus πιστεύσητε juga dikenal. Rumusan utama sengaja luas agar tidak memutuskan apakah tekanannya pada mulai percaya atau terus percaya; persoalan itu dicatat dalam catatan kaki.
- issue: Makna ζωή tanpa αἰώνιος
  choice: hidup
  alternative: hidup kekal
  rationale: Kata sifat 'kekal' tidak terdapat dalam teks Yunani ayat ini. 'Hidup' mempertahankan ungkapan asli dan kedalaman maknanya dalam konteks Injil Yohanes.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua tunggal 'kamu' dipakai karena bentuk Yunani jamak ditujukan kepada para pembaca secara kolektif, dan bentuk Indonesia ini lebih alami daripada 'kalian' dalam register kitab suci. Kapitalisasi 'Anak Allah' dan enklitik hormat '-Nya' mengikuti kebiasaan penulisan religius Indonesia tanpa menambah isi doktrinal.
