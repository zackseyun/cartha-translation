  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: id
  text: Tomas menjawab dan berkata kepada-Nya[a], “Tuhanku dan Allahku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin, “Tomas menjawab dan berkata, ‘Tuhanku dan Allahku!’” sebagai seruan. Namun, teks Yunani menyatakan bahwa ia berkata “kepada-Nya,” sehingga mendukung pemahaman bahwa perkataan itu ditujukan langsung kepada Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Kata ini dalam narasi lazim berarti menjawab atau menanggapi; “menjawab” mempertahankan bentuk ungkapan Yunani secara wajar dalam bahasa Indonesia.
- source_word: Θωμᾶς
  choice: Tomas
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Kata ganti datif αὐτῷ menyatakan orang yang menjadi tujuan perkataan. “Kepada-Nya” mempertahankan kata ganti sumber tanpa menambahkan nama Yesus; huruf kapital memperjelas rujukannya dalam konteks.
- source_word: Ὁ κύριός μου
  choice: Tuhanku
  rationale: κύριος di sini merupakan sapaan langsung yang penuh hormat dan berbobot teologis. “Tuhan” mempertahankan kedua unsur itu, sedangkan enklitik “-ku” menyatakan μου secara alami.
- source_word: ὁ θεός μου
  choice: Allahku
  rationale: θεός diterjemahkan “Allah,” istilah baku untuk God dalam bahasa Indonesia; “-ku” mempertahankan pengakuan pribadi yang dinyatakan oleh μου.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini menghubungkan kedua sebutan dalam satu pengakuan terkoordinasi.
theological_decisions:
- issue: Apakah perkataan Tomas merupakan pengakuan langsung kepada Yesus atau seruan yang tidak ditujukan kepada-Nya
  choice: 'Sapaan dan pengakuan langsung kepada Yesus: “Tuhanku dan Allahku!”'
  alternative: Seruan kepada Allah yang tidak secara langsung menyebut Yesus sebagai Tuhan dan Allah
  rationale: Teks Yunani secara eksplisit menyatakan bahwa Tomas berkata “kepada-Nya” (αὐτῷ). Bentuk nominatif dengan artikel dapat berfungsi sebagai sapaan dalam bahasa Yunani Koine. Karena itu, terjemahan mempertahankan arti langsungnya tanpa melunakkan bobot kristologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “menjawab dan berkata” dipertahankan karena mencerminkan struktur sumber dan tetap mudah dipahami. Bentuk “kepada-Nya” mengikuti kebiasaan ortografis Indonesia untuk kata ganti yang merujuk kepada pribadi ilahi.
