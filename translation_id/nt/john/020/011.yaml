  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: id
  text: Namun, Maria berdiri di luar makam sambil menangis. Sementara ia menangis, ia membungkuk[a] untuk melihat ke dalam makam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menunduk dan melihat ke dalam makam itu.” Kata Yunani yang digunakan mencakup gagasan membungkukkan atau mencondongkan tubuh untuk melihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan naratif dengan kontras ringan dari murid-murid yang pulang pada ayat sebelumnya kepada Maria yang tetap berada di makam.
- source_word: εἱστήκει
  choice: berdiri
  rationale: Bentuk ini menggambarkan keadaan Maria yang masih berlangsung; dalam konteks bahasa Indonesia, keberlangsungan itu tersampaikan secara alami oleh konteks dan frasa 'sambil menangis'.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: di luar makam
  rationale: Menyatakan lokasi Maria di luar makam dan mempertahankan kontras spasial dengan tindakannya melihat ke dalam.
- source_word: μνημεῖον
  choice: makam
  rationale: Dalam konteks penguburan Yesus, kata ini menunjuk pada ruang makam, bukan sekadar kuburan tanah; 'makam' merupakan padanan Indonesia yang alami dan tepat.
- source_word: κλαίουσα
  choice: sambil menangis
  rationale: Partisipel ini menunjukkan tindakan yang berlangsung bersamaan dengan berdiri; konstruksi 'sambil' menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: ὡς οὖν
  choice: Sementara
  rationale: Menghubungkan tindakan berikutnya dengan tangisan yang sedang berlangsung tanpa melebihkan hubungan sebab-akibat dari οὖν.
- source_word: ἔκλαιεν
  choice: ia menangis
  rationale: Imperfek menggambarkan tangisan yang berlanjut; 'sementara' memberikan nilai aspek tersebut dalam bahasa Indonesia.
- source_word: παρέκυψεν
  choice: membungkuk untuk melihat
  rationale: Menyampaikan gerakan membungkuk atau mencondongkan tubuh dengan tujuan melihat ke dalam, yang terkandung dalam verba Yunani.
- source_word: εἰς τὸ μνημεῖον
  choice: ke dalam makam itu
  rationale: εἰς menunjukkan arah pandangan menuju bagian dalam makam; kata tunjuk 'itu' merujuk kembali pada makam yang telah disebut.
