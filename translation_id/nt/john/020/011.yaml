translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'menangis' dipertahankan karena mencerminkan pengulangan sumber Yunani, sedangkan hubungan aspek dinyatakan secara idiomatis melalui 'sambil' dan 'sementara'.
