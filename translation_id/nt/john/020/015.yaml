revisions:
- from: Yesus berkata kepadanya, “Ibu, mengapa engkau menangis? Siapa yang engkau cari?” Karena menyangka bahwa Dia adalah penjaga kebun itu, Maria berkata kepada-Nya, “Tuan[a], jika Tuan yang telah membawa Dia pergi, beri tahu saya di mana Tuan meletakkan-Nya, dan saya akan mengambil-Nya.”
  to: Yesus berkata kepadanya, “Ibu, mengapa engkau menangis? Siapa yang engkau cari?” Ia menyangka bahwa Dia adalah tukang kebun itu, lalu berkata kepada-Nya, “Tuan[a], jika Tuan telah membawa Dia pergi, beri tahu saya di mana Tuan meletakkan-Nya, dan saya akan membawa Dia pergi.”
  rationale: Revisi mengganti istilah pekerjaan yang kurang tepat, mempertahankan makna membawa pergi dalam ἀρῶ, dan menerjemahkan partisip δοκοῦσα secara netral. Sapaan “Ibu” dan “Tuan” dipertahankan sebagai pilihan modern yang sopan dan sesuai konteks, sementara alternatif “Tuhan” untuk κύριε tetap didokumentasikan dalam catatan kaki.
