source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Ibu, mengapa engkau menangis? Siapa yang engkau cari?” Ia menyangka bahwa Dia adalah tukang kebun itu, lalu berkata kepada-Nya, “Tuan[a], jika Tuan telah membawa Dia pergi, beri tahu saya di mana Tuan meletakkan-Nya, dan saya akan membawa Dia pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: κύριε, yang juga dapat diterjemahkan “Tuhan”. Di sini kata itu kemungkinan besar merupakan sapaan hormat, “Tuan”, sebab Maria mengira bahwa ia sedang berbicara kepada tukang kebun.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Ibu
  rationale: Sapaan vokatif yang hormat kepada seorang perempuan dewasa; dalam bahasa Indonesia modern, 'Ibu' menyampaikan kesantunan tanpa kesan merendahkan yang dapat timbul dari terjemahan harfiah 'perempuan'.
- source_word: τί κλαίεις
  choice: mengapa engkau menangis
  rationale: τί menyatakan alasan secara idiomatis, sedangkan κλαίω berarti menangis; pilihan ini alami dan tetap khidmat.
- source_word: τίνα ζητεῖς
  choice: Siapa yang engkau cari
  rationale: ζητέω di sini berarti mencari seseorang; bentuk ini alami dalam bahasa Indonesia dan mempertahankan objek personal τίνα.
- source_word: δοκοῦσα
  choice: karena menyangka
  rationale: Partisip ini menyatakan anggapan Maria yang keliru dan sekaligus latar bagi ucapannya.
- source_word: ὁ κηπουρός
  choice: penjaga kebun itu
  rationale: κηπουρός menunjuk orang yang mengurus kebun; 'penjaga kebun' lebih lazim dan mudah dipahami daripada bentuk serapan atau istilah yang terlalu teknis.
- source_word: Κύριε
  choice: Tuan
  rationale: Karena Maria mengira lawan bicaranya adalah penjaga kebun, kata ini paling wajar berfungsi sebagai sapaan hormat, bukan pengakuan kristologis eksplisit.
- source_word: ἐβάστασας αὐτόν
  choice: telah membawa Dia pergi
  rationale: βαστάζω dalam konteks pemindahan jenazah menyiratkan membawa atau mengangkat; 'membawa ... pergi' alami dan mempertahankan arah tindakan.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: di mana Tuan meletakkan-Nya
  rationale: τίθημι berarti menaruh atau meletakkan; 'meletakkan' cocok untuk konteks jenazah dan berregister bermartabat.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: dan saya akan mengambil-Nya
  rationale: αἴρω dapat berarti mengangkat, membawa, atau mengambil; konteks menunjukkan niat Maria untuk mengambil jenazah itu, sementara arah 'pergi' tidak perlu ditambahkan kembali.
theological_decisions:
- issue: Makna κύριε dalam sapaan Maria sebelum mengenali Yesus yang bangkit
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks menyatakan bahwa Maria mengira Yesus adalah penjaga kebun, sehingga sapaan hormat 'Tuan' paling mungkin. Namun, bentuk Yunani yang sama juga lazim berarti 'Tuhan', sehingga alternatif itu dicatat tanpa menjadikan ucapan Maria sebagai pengakuan yang belum dimaksudkan narasi.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Engkau' dipakai dalam ucapan Yesus, sedangkan Maria memakai sapaan hormat 'Tuan' dan pronomina 'saya'. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia, tanpa menghapus ketidaktahuan Maria dalam alur cerita.
