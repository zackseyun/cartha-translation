review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama karena κηπουρός berarti orang yang mengusahakan/merawat kebun, sehingga “tukang kebun” lebih tepat daripada “penjaga kebun.” Selain itu, ἀρῶ dalam konteks ini mencakup tindakan membawa pergi; “akan membawa Dia pergi” mempertahankan arah tindakan tersebut. Partisip δοκοῦσα sebaiknya diterjemahkan sebagai keadaan atau anggapan Maria, bukan hubungan sebab yang tegas.
  naturalness: Teks revisi memakai bahasa Indonesia modern yang wajar dan tetap bermartabat. “Ibu” merupakan sapaan hormat yang dapat diterima untuk Γύναι dalam konteks ini. Susunan “Ia menyangka ..., lalu berkata ...” mengalir alami tanpa mengubah hubungan naratif dalam bahasa Yunani.
  terminology: “Tuan” tepat untuk κύριε dalam konteks Maria yang masih mengira Yesus seorang tukang kebun. Catatan kaki diperjelas agar tidak menyatakan bahwa bentuk Yunani itu sendiri hanya berarti “Tuhan”; bentuk tersebut dapat berarti “Tuan” atau “Tuhan” menurut konteks.
  issues:
  - severity: medium
    issue: “penjaga kebun” untuk ὁ κηπουρός
    rationale: “Penjaga kebun” terutama menyiratkan orang yang menjaga atau mengawasi kebun, sedangkan κηπουρός berarti tukang kebun/gardener.
  - severity: medium
    issue: “saya akan mengambil-Nya” untuk κἀγὼ αὐτὸν ἀρῶ
    rationale: Walaupun “mengambil” mungkin, αἴρω di sini menyatakan mengambil dan membawa pergi jenazah itu. “Akan membawa Dia pergi” lebih jelas mempertahankan cakupan makna dan paralel dengan tindakan pemindahan sebelumnya.
  - severity: low
    issue: “Karena menyangka” memberi nuansa kausal yang lebih kuat
    rationale: δοκοῦσα adalah partisip yang menyatakan anggapan atau keadaan yang menyertai perkataan Maria. Terjemahan naratif tanpa “karena” lebih netral.
  - severity: low
    issue: 'Rumusan catatan kaki “Yunani: ‘Tuhan’” terlalu sempit'
    rationale: κύριε dapat digunakan sebagai sapaan hormat “Tuan” dan juga diterjemahkan “Tuhan,” bergantung konteks. Catatan perlu menyatakan alternatif itu tanpa menjadikannya makna tunggal bentuk Yunani.
  revised_text: Yesus berkata kepadanya, “Ibu, mengapa engkau menangis? Siapa yang engkau cari?” Ia menyangka bahwa Dia adalah tukang kebun itu, lalu berkata kepada-Nya, “Tuan[a], jika Tuan telah membawa Dia pergi, beri tahu saya di mana Tuan meletakkan-Nya, dan saya akan membawa Dia pergi.”
