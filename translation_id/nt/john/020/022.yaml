  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: id
  text: Sesudah berkata demikian, ia mengembusi mereka[a] dan berkata kepada mereka, “Terimalah Roh Kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengembuskan napas ke dalam mereka.” Kata kerja ini juga mengingatkan pada gambaran penciptaan dan penciptaan baru dalam Kejadian 2:7 dan Yehezkiel 37.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Sesudah berkata demikian
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: ἐνεφύσησεν
  choice: mengembusi mereka
  rationale: Verba ini berarti mengembuskan napas pada atau ke dalam; 'mengembusi mereka' mempertahankan tindakan konkret tanpa menentukan arah secara berlebihan.
- source_word: λέγει αὐτοῖς
  choice: berkata kepada mereka
  rationale: Bentuk kini historis dialihkan ke bentuk naratif Indonesia yang wajar tanpa mengubah makna.
- source_word: Λάβετε
  choice: Terimalah
  rationale: Dalam konteks pemberian Roh, imperatif ini paling alami berarti menerima, bukan mengambil atas prakarsa sendiri.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Dalam konteks Injil Yohanes, frasa tanpa artikel ini menunjuk kepada Roh ilahi; bahasa Indonesia tidak memerlukan artikel.
theological_decisions:
- issue: Apakah πνεῦμα ἅγιον menunjuk kepada Roh ilahi atau suatu roh yang kudus secara umum
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Konteks Yohanes paling wajar menunjuk kepada Roh ilahi. Kapitalisasi memperjelas rujukan tanpa menambahkan unsur yang tidak ada dalam teks.
- issue: Apakah arah ἐνεφύσησεν harus dipastikan sebagai 'pada' atau 'ke dalam' mereka
  choice: mengembusi mereka
  alternative: mengembuskan napas ke dalam mereka
  rationale: Teks Yunani memungkinkan gema penciptaan dan penciptaan baru, tetapi objek tidak dengan sendirinya mengharuskan terjemahan 'ke dalam'. Teks utama mempertahankan ketidakpastian itu, sedangkan alternatif dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Mengembusi' dipilih agar tindakan bernapas tetap konkret dan gema antarteks tidak dijabarkan secara berlebihan dalam teks utama.
