base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: id
  text: Jika kamu mengampuni dosa siapa pun[a], dosa orang itu telah diampuni; jika kamu menahannya[b], dosa itu telah ditahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih dinamis, “Jika kamu mengampuni dosa seseorang, dosanya diampuni; jika kamu menahannya, dosanya ditahan.” Kedua kata kerja pasif dalam bagian utama kalimat Yunani berbentuk perfektum, yang dapat menekankan tindakan yang telah selesai dengan hasil yang tetap berlaku.
    reason: lexical_alternative
  - marker: b
    text: Maksud harfiahnya ialah menahan dosa-dosa itu, sebagai kebalikan dari melepaskan atau mengampuninya.
    reason: clarification
lexical_decisions:
- source_word: ἄν τινων
  choice: Jika ... siapa pun
  rationale: Gabungan ἄν dengan bentuk subjungtif menyatakan syarat yang tidak tentu. Ungkapan “jika ... siapa pun” mempertahankan baik unsur persyaratan maupun cakupan orang yang tidak dibatasi.
- source_word: ἀφῆτε
  choice: kamu mengampuni
  rationale: Dalam konteks dosa, ἀφίημι secara wajar berarti “mengampuni”; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: τὰς ἁμαρτίας
  choice: dosa
  rationale: Bahasa Indonesia tidak wajib menandai bentuk jamak pada nomina. “Dosa siapa pun” terdengar lebih alami daripada pengulangan “dosa-dosa”, tanpa menghilangkan makna jamaknya.
- source_word: ἀφέωνται
  choice: telah diampuni
  rationale: Bentuk perfektum pasif menyatakan tindakan yang telah terjadi dengan hasil yang tetap berlaku. “Telah diampuni” mempertahankan aspek dan bentuk pasif itu tanpa menyebut pelaku yang tidak dinyatakan dalam teks Yunani.
- source_word: αὐτοῖς
  choice: orang itu
  rationale: Pronomina datif ini merujuk kepada orang yang dosanya dibicarakan. Bahasa Indonesia paling alami mengungkapkan relasi itu dengan “dosa orang itu telah diampuni”, memakai bentuk tunggal distributif setelah “siapa pun”.
- source_word: κρατῆτε
  choice: kamu menahannya
  rationale: κρατέω di sini berlawanan dengan mengampuni dan berarti menahan atau tidak melepaskan dosa. “Menahannya” mempertahankan gambaran leksikal dan rujukan pronominal tanpa menambahkan penafsiran.
- source_word: κεκράτηνται
  choice: telah ditahan
  rationale: Bentuk perfektum pasif disejajarkan dengan “telah diampuni”, sehingga tindakan yang telah terjadi beserta hasilnya yang berlanjut tetap tercermin.
theological_decisions:
- issue: Apakah perkataan ini harus diterjemahkan seolah-olah para murid secara mandiri menghasilkan pengampunan, atau tindakan mereka bersesuaian dengan tindakan ilahi yang telah terjadi.
  choice: 'Mempertahankan bentuk pasif perfektum: “telah diampuni” dan “telah ditahan”.'
  alternative: Menambahkan Allah sebagai pelaku, atau memakai bentuk kini sederhana seperti “diampuni” dan “tetap ada”.
  rationale: Teks Yunani tidak menyebut pelaku tindakan pasif secara eksplisit. Terjemahan ini tidak menentukan hubungan tepat antara tindakan para murid dan tindakan Allah, tetapi mempertahankan ketegangan teologis serta nuansa hasil yang tetap berlaku.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal distributif “siapa pun ... orang itu” dipakai agar konstruksi Yunani yang tidak tentu tetap alami. Bentuk pasif dan aspek perfektum dipertahankan sejauh dapat diungkapkan tanpa membuat kalimat kaku.
