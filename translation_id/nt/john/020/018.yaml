- from: Maria Magdalena datang dan memberitakan kepada murid-murid[a], “Aku telah melihat Tuhan,” dan bahwa Dia telah mengatakan hal-hal ini kepadanya.
  to: Maria Magdalena datang sambil memberitakan kepada murid-murid[a], “Aku telah melihat Tuhan, dan Dia telah mengatakan hal-hal ini kepadaku.”
  rationale: Revisi menjadikan seluruh isi pemberitaan sebagai ujaran langsung yang gramatikal dan mengubah pronomina objek menjadi “kepadaku,” sebagaimana dituntut oleh sudut pandang Maria dalam kutipan. Catatan kaki mempertahankan pembacaan alternatif yang mengambil klausa terakhir sebagai komentar narator, sehingga ambiguitas sintaksis Yunani tidak dihilangkan.
