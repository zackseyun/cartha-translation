source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: id
  text: Maria Magdalena datang sambil memberitakan kepada murid-murid[a], “Aku telah melihat Tuhan, dan Dia telah mengatakan hal-hal ini kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Maria Magdalena datang kepada murid-murid dan berkata, ‘Aku telah melihat Tuhan,’ dan Dia mengatakan hal-hal ini kepadanya.” Klausa terakhir dapat dipahami sebagai bagian dari laporan Maria atau sebagai komentar narator.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini Yunani berfungsi sebagai kini historis; bentuk lampau dipahami secara alami dari alur narasi bahasa Indonesia, sedangkan 'datang' mempertahankan gerak menuju para murid.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Mengikuti bentuk nama dan sebutan yang lazim serta mudah dikenali dalam bahasa Indonesia.
- source_word: ἀγγέλλουσα
  choice: memberitakan
  rationale: Partisip ini menyatakan tindakan penyampaian berita yang berlangsung bersama verba utama; 'memberitakan' mempertahankan daya verbalnya tanpa mempersempitnya menjadi sekadar percakapan.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: '''Murid-murid'' merupakan padanan baku bagi μαθηταί; kata milik seperti ''Yesus'' tidak ditambahkan karena tidak tersurat.'
- source_word: ὅτι
  choice: tanda petik pembuka untuk ujaran langsung
  rationale: ὅτι memperkenalkan isi pemberitaan Maria; kutipan langsung paling alami untuk klausa pertama dalam bahasa Indonesia.
- source_word: Ἑώρακα
  choice: Aku telah melihat
  rationale: Bentuk perfek menyatakan tindakan yang telah terjadi dengan relevansi pada saat Maria melapor; 'telah melihat' mempertahankan nuansa itu.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Dalam konteks kebangkitan Yohanes, κύριος adalah gelar bagi Yesus dan dipertahankan dengan bobot kristologisnya.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: dan bahwa Dia telah mengatakan hal-hal ini kepadanya
  rationale: Klausa ini dipahami sebagai kelanjutan isi laporan Maria. 'Telah mengatakan' menandai bahwa perkataan Yesus mendahului laporan Maria, sementara 'hal-hal ini' mempertahankan bentuk jamak netral ταῦτα.
theological_decisions:
- issue: Penerjemahan κύριος dalam konteks kebangkitan
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' mempertahankan fungsi gelar bagi Yesus dan bobot kristologisnya dalam konteks ini tanpa mengurangi maknanya menjadi sapaan sosial biasa.'
- issue: Hubungan καὶ ταῦτα εἶπεν αὐτῇ dengan laporan Maria
  choice: 'Dimasukkan sebagai bagian dari isi yang diberitakan Maria: ''dan bahwa Dia telah mengatakan hal-hal ini kepadanya'''
  alternative: 'Komentar tersendiri dari narator: ''dan Dia mengatakan hal-hal ini kepadanya'''
  rationale: Walaupun tidak ada ὅτι kedua, klausa tersebut dapat secara wajar melanjutkan isi ἀγγέλλουσα. Karena sintaks Yunani tetap memungkinkan pembacaan sebagai komentar narator, ambiguitas itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat cukup alami sambil mempertahankan ambiguitas sintaksis klausa terakhir melalui catatan kaki. Huruf kapital pada 'Dia' mengikuti rujukan kepada Tuhan dalam gaya teks ini.
