review_pass:
  verdict: revise
  source_fidelity: Perlu revisi kecil. πλευρά berarti «sisi», bukan «lambung» dalam pengertian modern yang terutama menunjuk organ/perut. Selain itu, kontras adjektival ἄπιστος / πιστός lebih baik dipertahankan sebagai «orang yang tidak percaya ... orang yang percaya» daripada mengubah unsur kedua menjadi imperatif «percayalah».
  naturalness: Teks umumnya alami dan sesuai register Alkitab Indonesia modern. «Kedua tangan-Ku» secara eksplisit mempertahankan bentuk jamak Yunani dan tetap wajar. «Sisi-Ku» jelas dan idiomatis dalam konteks luka tikaman.
  terminology: «Tomas», «percaya», dan «Yesus yang telah bangkit» tepat. «Sisi-Ku» adalah padanan netral dan akurat bagi πλευρά. Catatan kaki mempertahankan kemungkinan «tidak beriman/beriman» dan «tidak setia/setia» tanpa memaksakan salah satunya sebagai makna utama.
  issues:
  - severity: medium
    issue: «lambung-Ku» untuk πλευρά
    rationale: Dalam bahasa Indonesia modern, «lambung» lazim dipahami sebagai perut atau organ lambung, sedangkan πλευρά menunjuk sisi tubuh. «Sisi-Ku» mempertahankan rujukan anatomis tanpa penyempitan atau pergeseran makna.
  - severity: low
    issue: «tetapi percayalah» mengubah πιστός yang berbentuk adjektiva menjadi imperatif verba
    rationale: Walaupun maknanya kontekstual dapat dipahami, bentuk ini kurang mempertahankan kontras «unbelieving/believing». Frasa nomina «orang yang tidak percaya ... orang yang percaya» alami dan mencerminkan struktur sumber.
