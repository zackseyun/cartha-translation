source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: id
  text: Lalu ia berkata kepada Tomas, “Bawalah jarimu ke sini dan lihatlah kedua tangan-Ku. Bawalah tanganmu dan masukkanlah ke sisi-Ku. Jangan menjadi orang yang tidak percaya, melainkan orang yang percaya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan menjadi orang yang tidak beriman, melainkan orang yang beriman,” atau, “Jangan menjadi orang yang tidak setia, melainkan orang yang setia.” Kata-kata sifat Yunani dapat mengandung arti-arti tersebut, tetapi dalam konteks ini kontrasnya terutama menyangkut kepercayaan Tomas kepada Yesus yang telah bangkit.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Lalu
  rationale: Menandai urutan dalam narasi secara wajar dan ringkas.
- source_word: λέγει
  choice: ia berkata
  rationale: Kala kini historis Yunani dialihkan ke bentuk lampau naratif yang alami dalam bahasa Indonesia.
- source_word: Φέρε
  choice: Bawalah
  rationale: Mempertahankan arti dasar dan pengulangan imperatif yang digunakan bagi jari maupun tangan.
- source_word: δάκτυλόν σου ὧδε
  choice: jarimu ke sini
  rationale: Mengungkapkan gerakan menuju tempat yang ditunjuk oleh ὧδε secara alami.
- source_word: ἴδε
  choice: lihatlah
  rationale: Padanan langsung dan modern bagi imperatif yang berarti melihat atau memperhatikan.
- source_word: τὰς χεῖράς μου
  choice: tangan-Ku
  rationale: Dalam bahasa Indonesia, bentuk tunggal tanpa penanda jumlah lazim dipakai secara generik untuk anggota tubuh berpasangan; konteks tetap menunjuk kedua tangan.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: masukkanlah ke lambung-Ku
  rationale: βάλε dengan εἰς menyatakan tindakan memasukkan; lambung menunjuk bagian sisi tubuh yang tertikam dan lebih spesifik daripada sisi.
- source_word: μὴ γίνου
  choice: Jangan menjadi
  rationale: Mempertahankan nuansa proses atau peralihan dari γίνομαι tanpa memperkuatnya menjadi perintah untuk berhenti.
- source_word: ἄπιστος
  choice: tidak percaya
  rationale: Konteks langsung berpusat pada penolakan Tomas untuk memercayai kebangkitan Yesus.
- source_word: πιστός
  choice: percayalah
  rationale: Bentuk verbal menghasilkan seruan yang alami dalam bahasa Indonesia dan mempertahankan fokus kontekstual pada kepercayaan, meskipun secara bentuk kata Yunani adalah adjektiva.
theological_decisions:
- issue: Kontras ἄπιστος / πιστός dalam seruan kepada Tomas
  choice: tidak percaya / percayalah
  alternative: tidak beriman / beriman; tidak setia / setia
  rationale: Narasi langsung membahas apakah Tomas percaya bahwa Yesus telah bangkit. Terjemahan utama menonjolkan makna itu, sedangkan catatan kaki mempertahankan kemungkinan leksikal yang berkaitan dengan iman atau kesetiaan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Imperatif -lah mempertahankan ketegasan undangan Yesus tanpa terdengar kasar. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
