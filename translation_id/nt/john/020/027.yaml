  to: Lalu ia berkata kepada Tomas, “Bawalah jarimu ke sini dan lihatlah kedua tangan-Ku. Bawalah tanganmu dan masukkanlah ke sisi-Ku. Jangan menjadi orang yang tidak percaya, melainkan orang yang percaya.”[a]
  rationale: Revisi mengganti «lambung-Ku» dengan «sisi-Ku» untuk kesetiaan leksikal dan kejelasan modern, serta mempertahankan kontras adjektival Yunani pada klausa terakhir. «Kedua tangan-Ku» membuat jamak sumber eksplisit tanpa mengubah makna.
