  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: id
  text: Keduanya berlari bersama-sama, dan murid yang lain itu berlari lebih cepat daripada Petrus dan tiba lebih dahulu di makam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: berlari
  rationale: Imperfek menggambarkan tindakan yang sedang berlangsung; dalam narasi Indonesia, bentuk sederhana “berlari” secara alami menyampaikan tindakan lampau yang berkelanjutan dari konteks.
- source_word: δὲ
  choice: dan
  rationale: Partikel ini di sini bersifat penghubung ringan; “dan” mengikuti alur narasi tanpa menambahkan pertentangan yang tidak tegas dalam bahasa Yunani.
- source_word: οἱ δύο ὁμοῦ
  choice: keduanya ... bersama-sama
  rationale: Ungkapan ini menyatakan bahwa dua orang tersebut berlari bersama; “keduanya” dan “bersama-sama” mempertahankan kedua unsur yang eksplisit dalam sumber.
- source_word: ὁ ἄλλος μαθητής
  choice: murid yang lain itu
  rationale: “Murid” adalah padanan baku μαθητής dalam konteks Injil, sedangkan “yang lain itu” membedakannya dari Petrus yang telah disebut.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: berlari lebih cepat daripada Petrus
  rationale: Padanan ini menyatakan gerak mendahului dan perbandingan kecepatan secara alami dalam bahasa Indonesia tanpa pengulangan janggal seperti “berlari mendahului lebih cepat”.
- source_word: ἦλθεν πρῶτος
  choice: tiba lebih dahulu
  rationale: Ungkapan ini secara idiomatis menyampaikan bahwa murid tersebut mencapai tempat itu sebelum Petrus.
- source_word: εἰς τὸ μνημεῖον
  choice: di makam
  rationale: Dengan verba “tiba,” bahasa Indonesia memakai “di” untuk tujuan yang telah dicapai. “Makam” merujuk pada tempat penguburan, dan ayat berikutnya menunjukkan bahwa murid itu belum masuk ke dalamnya.
