source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: id
  text: Setelah delapan hari, murid-murid-Nya kembali berada di dalam, dan Tomas bersama mereka. Ketika pintu-pintu terkunci, Yesus datang, lalu berdiri di tengah mereka dan berkata, “Damai sejahtera bagi kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Delapan hari kemudian
  rationale: Ungkapan idiomatis ini secara harfiah berarti 'setelah delapan hari'; terjemahan yang dipilih alami dalam bahasa Indonesia dan tetap mempertahankan hitungan waktu teks sumber.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid Yesus
  rationale: Rujukan pronominal 'murid-murid-Nya' diperjelas dengan nama Yesus agar alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: Meskipun pintu-pintu terkunci
  rationale: Genitif absolut menyatakan keadaan yang menyertai kedatangan Yesus, dengan nuansa konsesif dalam konteks; bentuk jamak 'pintu-pintu' dipertahankan.
- source_word: ἔρχεται
  choice: datang
  rationale: Present historis Yunani diterjemahkan dengan bentuk tak bertanda waktu dalam bahasa Indonesia, yang dapat berfungsi alami dalam narasi tanpa memaksakan penandaan kala.
- source_word: εἰς τὸ μέσον
  choice: di tengah-tengah mereka
  rationale: Makna lokatif dibuat eksplisit sesuai konteks kelompok murid.
- source_word: Εἰρήνη ὑμῖν
  choice: Damai sejahtera bagi kalian!
  rationale: Mempertahankan bentuk berkat/salam yang lebih kaya daripada salam biasa; 'kalian' menyatakan orang kedua jamak secara jelas dan modern.
theological_decisions:
- issue: Cara Yesus memasuki ruangan dengan pintu-pintu terkunci
  choice: Tidak menjelaskan mekanismenya; hanya menyatakan bahwa pintu-pintu terkunci ketika Yesus datang
  alternative: Menerjemahkan seolah-olah Yesus menembus pintu atau masuk tanpa membukanya
  rationale: Teks menyandingkan keadaan pintu-pintu yang terkunci dengan kedatangan Yesus, tetapi tidak menerangkan mekanismenya; ambiguitas ini harus dipertahankan.
- issue: Arti ucapan Εἰρήνη ὑμῖν
  choice: Mempertahankannya sebagai 'Damai sejahtera bagi kalian!'
  alternative: Mereduksinya menjadi 'Salam!' atau memperluasnya menjadi pernyataan doktrinal tertentu
  rationale: Ucapan itu dapat berfungsi sebagai salam sekaligus berkat; pilihan ini menjaga keluasan maknanya tanpa menambahkan tafsir denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum, dengan nama 'Yesus' untuk memperjelas rujukan dan 'kalian' untuk menandai bentuk jamak. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan di luar teks.
