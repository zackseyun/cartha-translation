  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: id
  text: Aku tidak akan banyak lagi berbicara dengan kalian, sebab penguasa dunia sedang datang. Ia tidak memiliki apa pun dalam diri-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini secara harfiah berarti “ia tidak memiliki apa pun dalam diri-Ku.” Ungkapan itu dapat pula dipahami sebagai “ia tidak mempunyai hak atas-Ku” atau “ia tidak mempunyai pegangan atas-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω
  choice: Aku tidak akan berbicara banyak lagi
  rationale: Susunan ini menyampaikan οὐκέτι sebagai penghentian dari titik ini dan πολλὰ secara adverbial sebagai 'banyak', dengan bentuk masa depan λαλήσω.
- source_word: μεθ’ ὑμῶν
  choice: dengan kalian
  rationale: μετά dengan genitif menyatakan kebersamaan atau percakapan dengan para murid. 'Kalian' secara jelas menandai orang kedua jamak dalam bahasa Indonesia modern.
- source_word: ἔρχεται
  choice: sedang datang
  rationale: Bentuk kini memiliki daya futuris dan menyiratkan kedatangan yang sudah dekat; 'sedang datang' mempertahankan kesan gerak yang berlangsung atau mendekat.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: penguasa dunia ini
  rationale: ἄρχων diterjemahkan secara transparan sebagai 'penguasa'. Kata 'ini' menjadikan ungkapan Indonesia lebih alami dalam idiom Yohanes, meskipun tidak dinyatakan tersendiri dalam bahasa Yunani.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: Ia tidak memiliki apa pun dalam diri-Ku
  rationale: Terjemahan yang dekat dengan bentuk harfiah mempertahankan keluasan ungkapan Yunani dan tidak membatasinya hanya pada klaim, kuasa, atau pijakan.
theological_decisions:
- issue: Identitas 'penguasa dunia'
  choice: Mempertahankan gelar 'penguasa dunia ini' tanpa menggantinya dengan 'Iblis'.
  alternative: Menyebutnya secara langsung sebagai Iblis atau memahaminya sebagai personifikasi umum kuasa kejahatan.
  rationale: Dalam konteks Yohanes gelar ini menunjuk kepada lawan rohani Yesus yang lazim dipahami sebagai Iblis, tetapi teks sendiri memakai gelar tersebut; terjemahan tidak menyelesaikan identitas inferensial itu di dalam teks utama.
- issue: Makna 'tidak memiliki apa pun dalam diri-Ku'
  choice: Mempertahankan ungkapan yang dekat dengan bentuk harfiah.
  alternative: Ia tidak mempunyai hak atas-Ku; ia tidak berkuasa atas-Ku; ia tidak mempunyai pijakan dalam diri-Ku.
  rationale: Ungkapan Yunani ringkas dan idiomatis, serta dapat mencakup tidak adanya klaim, kuasa, pijakan, atau kesamaan dengan Yesus. Terjemahan utama menjaga ketegangan ini, sedangkan kemungkinan maknanya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' dan 'kalian' menjaga kealamian tuturan langsung sekaligus membedakan orang kedua jamak. Kapitalisasi pada 'diri-Ku' mengikuti konvensi umum Alkitab Indonesia untuk rujukan kepada Yesus. Penanda catatan [a] ditempatkan tepat setelah ungkapan yang dijelaskan.
