  rationale: Revisi menghapus demonstratif “ini” yang tidak terdapat dalam teks Yunani dan mempertahankan bentuk literal bagi pernyataan penutup. Catatan kaki mempertahankan kemungkinan makna idiomatis tanpa menetapkan satu penafsiran teologis tertentu. Penanda [a] tetap langsung melekat pada ungkapan yang diterangkan.
