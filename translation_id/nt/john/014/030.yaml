  verdict: revise
  source_fidelity: 'Perlu revisi kecil tetapi penting: κόσμου berarti “dunia”; teks Yunani ayat ini tidak memuat padanan untuk “ini.” Penambahan “ini” tidak diperlukan bagi tata bahasa Indonesia dan mengurangi kesetiaan leksikal terhadap sumber. Selebihnya, bentuk futuris “tidak akan ... lagi,” nuansa mendekat dalam “sedang datang,” serta ungkapan literal “tidak memiliki apa pun dalam diri-Ku” selaras dengan Yunani.'
  naturalness: “Aku tidak akan banyak lagi berbicara dengan kalian” adalah bahasa Indonesia baku-modern yang alami dalam tuturan langsung. “Penguasa dunia” sedikit lebih padat daripada “penguasa dunia ini,” tetapi tetap jelas dan diperlukan untuk tidak menambahkan demonstratif yang tidak ada dalam sumber.
  terminology: “Penguasa” merupakan padanan yang baik untuk ἄρχων. Gelar itu tidak boleh diganti menjadi “Iblis” dalam teks utama. “Tidak memiliki apa pun dalam diri-Ku” dengan tepat mempertahankan ungkapan ἐν ἐμοὶ οὐκ ἔχει οὐδέν tanpa membatasi maknanya menjadi semata-mata kuasa atau hak.
  issues:
