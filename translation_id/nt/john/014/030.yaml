    issue: “dunia ini” menambahkan “ini”
    rationale: SBLGNT berbunyi ὁ τοῦ κόσμου ἄρχων, harfiahnya “penguasa dunia.” Tidak ada οὗτος atau demonstratif lain. Walaupun “dunia ini” muncul dalam ungkapan Yohanes yang serupa di tempat lain dan terdengar idiomatis, ayat ini sendiri tidak memuatnya.
  - severity: low
    issue: Catatan kaki dapat menyatakan alternatif secara kurang membatasi
    rationale: “Tidak mempunyai kuasa atas-Ku” menyempitkan ungkapan Yunani yang sengaja ringkas. Alternatif “tidak mempunyai hak atas-Ku” dan “tidak mempunyai pegangan atas-Ku” lebih dekat dengan kemungkinan ‘claim/hold,’ sambil teks utama tetap literal.
  revised_text: Aku tidak akan banyak lagi berbicara dengan kalian, sebab penguasa dunia sedang datang. Ia tidak memiliki apa pun dalam diri-Ku.[a]
