  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: id
  text: Dan jika Aku pergi dan menyiapkan tempat bagi kalian, Aku akan datang kembali[a][b] dan akan membawa kalian kepada-Ku, supaya kalian juga berada di tempat Aku berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai verba berbentuk kini yang dalam konteks ini bermakna masa depan. Terjemahan lain: “Aku datang kembali.”'
    reason: lexical_alternative
  - marker: b
    text: Ada beragam penafsiran mengenai apakah “Aku akan datang kembali” secara khusus menunjuk pada penampakan Yesus sesudah kebangkitan-Nya, kedatangan Roh, kedatangan-Nya yang terakhir, atau janji berlapis yang mencakup lebih dari satu hal tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: jika Aku pergi
  rationale: Konstruksi ἐάν dengan aoristus subjungtif menyatakan kemungkinan yang berorientasi ke masa depan. 'Pergi' langsung, alami, dan sesuai dengan konteks kepergian Yesus.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: menyiapkan tempat bagimu
  rationale: ἑτοιμάζω berarti 'menyiapkan' dan τόπος berarti 'tempat'. Terjemahan ini tidak memperluas makna atau menjelaskan hakikat tempat tersebut.
- source_word: πάλιν ἔρχομαι
  choice: Aku akan datang kembali
  rationale: Bentuk kini ἔρχομαι memiliki acuan masa depan dalam konteks ini. Bahasa Indonesia tidak lazim mempertahankan bentuk kini secara harfiah untuk janji semacam ini, sehingga 'akan datang kembali' menyampaikan maksudnya secara alami; catatan kaki menjelaskan bentuk Yunaninya.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: membawamu kepada-Ku
  rationale: παραλαμβάνω di sini menyatakan membawa atau menerima para murid ke dalam kebersamaan dengan Yesus. 'Membawamu kepada-Ku' alami dan mempertahankan daya relasional πρὸς ἐμαυτόν.
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα memperkenalkan tujuan. 'Supaya' merupakan padanan Indonesia yang alami dan jelas.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: di tempat Aku berada
  rationale: Ungkapan ini menyatakan lokasi keberadaan Yesus. Penambahan 'di tempat' membuat hubungan lokatifnya alami dalam bahasa Indonesia tanpa menentukan tempat itu lebih lanjut.
- source_word: καὶ ὑμεῖς ἦτε
  choice: kamu pun berada
  rationale: Subjungtif ἦτε berada dalam klausa tujuan sesudah ἵνα. 'Kamu pun berada' mempertahankan kesejajaran dengan keberadaan Yesus dan menerjemahkan καί sebagai 'pun'.
theological_decisions:
- issue: Hakikat kedatangan yang dijanjikan Yesus dalam πάλιν ἔρχομαι
  choice: Diterjemahkan sebagai janji berorientasi masa depan, 'Aku akan datang kembali,' tanpa menetapkan cara atau waktu kedatangan itu.
  alternative: Dapat dipahami secara khusus sebagai penampakan sesudah kebangkitan, kedatangan Roh, kedatangan terakhir Yesus, atau sebagai janji berlapis yang mencakup lebih dari satu penggenapan.
  rationale: Ayat ini dengan jelas menjanjikan kehadiran kembali dan bahwa para murid akan dibawa kepada Yesus, tetapi tidak dengan sendirinya menyelesaikan perdebatan mengenai cakupan tepat janji tersebut. Catatan kaki mempertahankan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Bentuk tunggal 'bagimu' dan 'membawamu' mewakili ὑμῖν/ὑμᾶς yang secara gramatikal jamak secara kolektif; dalam konteks sapaan kepada para murid, bahasa Indonesia tidak menandai jumlah pada bentuk ini. Semua penanda catatan kaki muncul dalam teks utama.
