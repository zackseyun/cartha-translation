review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Yunani: pengulangan ἀμὴν ἀμὴν, bentuk generik ὁ πιστεύων, objek tersirat pada μείζονα, hubungan sebab ὅτι, dan “Bapa” tanpa penambahan “-Ku” semuanya terpelihara. Namun, “Bahkan” memberi penekanan adversatif/eskalatif yang tidak dinyatakan oleh καί, yang di sini lebih baik diterjemahkan sebagai penghubung aditif “dan.”'
  naturalness: Bahasa ini baku dan jelas. “Orang yang percaya kepada-Ku” serta “ia” alami dalam penggunaan generik bahasa Indonesia. Penggantian “Bahkan” dengan “dan” membuat alur dua predikat masa depan lebih langsung dan lebih dekat dengan struktur sumber.
  terminology: “Pekerjaan-pekerjaan” mempertahankan bentuk jamak τὰ ἔργα dan tidak membatasi maknanya pada mukjizat. “Lebih besar” dengan sengaja tidak menentukan dalam segi apa pekerjaan itu lebih besar, sesuai keluasan teks. Catatan mengenai kala kini Yunani tidak diperlukan karena “Aku pergi kepada Bapa” sudah merupakan terjemahan kontekstual yang wajar dan tidak ada varian atau ambiguitas tekstual yang perlu diberi jangkar.
  issues:
  - severity: low
    issue: “Bahkan” menerjemahkan καί pada klausa kedua.
    rationale: καί terutama bersifat aditif. Walaupun “bahkan” dapat terdengar wajar sebagai penegasan retoris, kata itu menambahkan nuansa eskalatif yang tidak perlu. “Dan” mempertahankan hubungan antarklausa tanpa interpretasi tambahan.
  - severity: low
    issue: Catatan kaki a menjelaskan bentuk kala kini sebagai “secara harfiah” dan diberi jangkar pada akhir ayat.
    rationale: Kala kini πορεύομαι memang dapat bernuansa prospektif dalam konteks ini, tetapi teks utama sudah menyampaikannya secara memadai. Catatan itu tidak diperlukan untuk memahami terjemahan dan berpotensi menyiratkan bahwa “sedang pergi” adalah satu-satunya terjemahan harfiah.
  revised_text: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: Orang yang percaya kepada-Ku juga akan melakukan pekerjaan-pekerjaan yang Kulakukan, dan ia akan melakukan pekerjaan-pekerjaan yang lebih besar daripada itu, karena Aku pergi kepada Bapa.'
