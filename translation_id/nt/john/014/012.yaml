revisions:
- from: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: Orang yang percaya kepada-Ku juga akan melakukan pekerjaan-pekerjaan yang Kulakukan. Bahkan, ia akan melakukan pekerjaan-pekerjaan yang lebih besar daripada itu, karena Aku pergi kepada Bapa.[a]'
  to: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: Orang yang percaya kepada-Ku juga akan melakukan pekerjaan-pekerjaan yang Kulakukan, dan ia akan melakukan pekerjaan-pekerjaan yang lebih besar daripada itu, karena Aku pergi kepada Bapa.'
  rationale: Mengganti “Bahkan” dengan “dan” agar καί diterjemahkan secara netral dan setia, serta menghilangkan catatan kaki yang tidak diperlukan. Makna ayat, termasuk keluasan “pekerjaan-pekerjaan yang lebih besar,” tetap dipertahankan tanpa penafsiran tambahan.
