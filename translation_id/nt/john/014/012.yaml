id: JHN.14.12
reference: John 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: Orang yang percaya kepada-Ku juga akan melakukan pekerjaan-pekerjaan yang Kulakukan, dan ia akan melakukan pekerjaan-pekerjaan yang lebih besar daripada itu, karena Aku pergi kepada Bapa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan formula penegasan yang khidmat, sekaligus transparan dan alami bagi pembaca Indonesia modern.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Orang yang percaya kepada-Ku
  rationale: Menerjemahkan partisipel substantival sebagai bentuk tunggal representatif dan mempertahankan ungkapan Yohanes tentang percaya kepada Yesus.
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: pekerjaan-pekerjaan yang Kulakukan
  rationale: Mempertahankan kosakata ἔργα dan konsistensi verba ποιέω tanpa membatasi maknanya hanya pada mukjizat.
- source_word: κἀκεῖνος ποιήσει
  choice: juga akan melakukan
  rationale: Unsur καί dalam bentuk gabungan κἀκεῖνος dinyatakan dengan 'juga', sedangkan subjeknya diteruskan secara alami dari klausa sebelumnya.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: Bahkan, ia akan melakukan pekerjaan-pekerjaan yang lebih besar daripada itu
  rationale: Kata 'pekerjaan-pekerjaan' dipasok secara wajar dari τὰ ἔργα pada klausa sebelumnya; 'lebih besar' membiarkan jenis kebesaran itu tetap tidak ditentukan oleh ayat.
- source_word: ὅτι
  choice: karena
  rationale: Menyatakan hubungan sebab yang diberikan teks antara pekerjaan-pekerjaan yang lebih besar dan kepergian Yesus kepada Bapa.
- source_word: ἐγὼ πρὸς τὸν πατέρα πορεύομαι
  choice: Aku pergi kepada Bapa
  rationale: Menerjemahkan kala kini sesuai konteks kepergian yang segera terjadi dan mempertahankan 'Bapa', bukan menambahkan 'Bapa-Ku'.
theological_decisions:
- issue: Arti pekerjaan-pekerjaan yang lebih besar
  choice: Terjemahan mempertahankan pernyataan luas bahwa orang percaya akan melakukan pekerjaan-pekerjaan yang lebih besar, dengan alasannya ialah kepergian Yesus kepada Bapa.
  alternative: Dapat ditafsirkan lebih besar dalam jangkauan misi, dalam arti penting sejarah penebusan, atau melalui pelayanan umat yang dimampukan Roh.
  rationale: Ayat ini tidak menjelaskan dalam segi apa pekerjaan tersebut lebih besar. Terjemahan tidak memasukkan penjelasan teologis tertentu ke dalam teks.
- issue: Cakupan bentuk tunggal maskulin ὁ πιστεύων ... κἀκεῖνος
  choice: Orang yang ... ia
  alternative: Barang siapa yang ... dia
  rationale: Dalam bahasa Indonesia, bentuk ini secara alami dapat berlaku generik bagi setiap orang percaya tanpa perlu menambahkan penanda gender atau catatan budaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai sesuai kelaziman Alkitab bahasa Indonesia. Pengulangan 'Sesungguhnya' dipertahankan untuk mencerminkan ἀμὴν ἀμὴν. Tanda titik memecah kalimat Yunani yang panjang agar lebih mudah dipahami tanpa mengubah hubungan antarklausa.
