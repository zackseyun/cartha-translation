source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: id
  text: Kalian sudah mendengar bahwa Aku berkata kepada kalian, “Aku pergi dan akan datang kepada kalian.” Sekiranya kalian mengasihi Aku, kalian tentu sudah bersukacita[a] karena Aku pergi kepada Bapa, sebab Bapa lebih besar daripada Aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalian tentu bersukacita karena Aku pergi kepada Bapa.” Bentuk Yunaninya dapat diterjemahkan secara lebih umum, tetapi “tentu sudah bersukacita” paling sesuai dengan kondisi yang berlawanan dengan kenyataan dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: “Bapa lebih besar daripada Aku” diterjemahkan sebagaimana tertulis, tanpa menambahkan penjelasan seperti “dalam peran” atau “dalam kedudukan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: kalian sudah mendengar
  rationale: Bentuk aoris menunjuk pada tindakan mendengar yang telah terjadi; “sudah mendengar” alami dalam bahasa Indonesia dan mengaitkannya dengan perkataan Yesus sebelumnya.
- source_word: Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς
  choice: Aku pergi dan akan datang kepada kalian
  rationale: “Pergi” mempertahankan gerak menjauh, sedangkan “akan datang” menyampaikan daya futuris ἔρχομαι secara alami tanpa menambahkan kata “kembali” yang tidak dinyatakan dalam bahasa Yunani.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Sekiranya kalian mengasihi Aku
  rationale: “Sekiranya” membantu menandai kondisi yang berlawanan dengan kenyataan, sementara bentuk “mengasihi” tetap wajar dalam bahasa Indonesia.
- source_word: ἐχάρητε ἄν
  choice: kalian tentu sudah bersukacita
  rationale: Aoris dengan ἄν dalam akibat kondisi berlawanan dengan kenyataan menunjuk pada sukacita yang seharusnya telah timbul; “tentu sudah” mengungkapkan nuansa itu dengan jelas.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: Aku pergi kepada Bapa
  rationale: Terjemahan ini mempertahankan tindakan pergi dan tujuan relasionalnya. “Bapa” dipertahankan sebagai gelar tanpa menambahkan kata milik.
- source_word: ὁ πατὴρ μείζων μού ἐστιν
  choice: Bapa lebih besar daripada Aku
  rationale: Terjemahan langsung ini mempertahankan perbandingan sebagaimana tertulis dan tidak memasukkan penjelasan teologis yang tidak dinyatakan oleh teks.
theological_decisions:
- issue: Arti pernyataan bahwa Bapa lebih besar daripada Yesus
  choice: Bapa lebih besar daripada Aku
  alternative: Bapa lebih besar daripada Aku dalam peran atau kedudukan; Bapa lebih besar sehubungan dengan keadaan Yesus sebagai manusia
  rationale: Teks Yunani menyatakan perbandingan itu tanpa pembatas. Terjemahan mempertahankan ketegangan teologisnya dan tidak menyelesaikannya dengan keterangan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak “kalian” membedakan ὑμῖν/ὑμᾶς dari bentuk tunggal. Huruf kapital pada “Aku” dan “Bapa” mengikuti konvensi umum teks Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghapus bentuk kondisi yang berlawanan dengan kenyataan.
