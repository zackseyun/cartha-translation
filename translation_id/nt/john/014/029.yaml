  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: id
  text: Dan sekarang Aku telah mengatakannya kepadamu sebelum hal itu terjadi,[a] supaya ketika hal itu terjadi,[b] kamu percaya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebelum hal itu menjadi kenyataan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika hal itu menjadi kenyataan.”
    reason: lexical_alternative
  - marker: c
    text: Kata ini juga dapat mengandung arti “menaruh kepercayaan”; namun, “percaya” merupakan padanan yang lazim dalam Injil Yohanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Dan sekarang
  rationale: Mempertahankan kata penghubung καί dan keterangan waktu νῦν, serta kesinambungan dengan perkataan sebelumnya.
- source_word: εἴρηκα ὑμῖν
  choice: Aku telah mengatakannya kepadamu
  rationale: Bentuk perfektum εἴρηκα menyatakan ucapan yang telah disampaikan dan tetap relevan sekarang. Pronomina objek tersirat 'hal itu' dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: πρὶν γενέσθαι
  choice: sebelum hal itu terjadi
  rationale: πρίν dengan infinitif aoris berarti sebelum peristiwa yang dimaksud terjadi. Pilihan 'terjadi' alami dalam bahasa Indonesia dan memungkinkan pengulangan γίνομαι dipertahankan.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan secara jelas dan alami.
- source_word: ὅταν γένηται
  choice: ketika hal itu terjadi
  rationale: ὅταν dengan bentuk subjungtif menunjuk pada peristiwa mendatang. Pengulangan 'terjadi' mencerminkan pengulangan verba γίνομαι dalam teks Yunani.
- source_word: πιστεύσητε
  choice: kamu percaya
  rationale: πιστεύω lazim berarti 'percaya' dalam Injil Yohanes dan dapat mencakup unsur mempercayai atau menaruh kepercayaan. Terjemahan ini tidak menentukan apakah yang dimaksud ialah mulai percaya atau diteguhkan dalam kepercayaan.
theological_decisions:
- issue: Daya makna πιστεύσητε dalam konteks
  choice: kamu percaya
  alternative: kamu tetap percaya; kamu menaruh kepercayaan
  rationale: Ucapan nubuat Yesus dapat membangkitkan maupun menguatkan kepercayaan ketika peristiwa itu terjadi. Bahasa Yunani tidak secara eksplisit membatasi maknanya pada awal kepercayaan atau ketekunan, sehingga terjemahan yang lebih luas dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi 'Aku' mengikuti rujukan kepada Yesus. Pengulangan 'terjadi' dipertahankan untuk mencerminkan pengulangan γίνομαι, sedangkan susunan kalimat dibuat alami dalam bahasa Indonesia.
