  text: And you know the way where I am going[a].
translation:
  language: id
  text: Dan ke mana Aku pergi, kalian tahu jalannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi, “Dan kalian tahu ke mana Aku pergi, dan kalian tahu jalannya.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan kata penghubung sederhana yang mengaitkan perkataan ini dengan konteks sebelumnya tanpa menambahkan penekanan.
- source_word: ὅπου
  choice: ke mana
  rationale: ὅπου menyatakan tempat; bersama verba gerak ὑπάγω, ungkapan Indonesia yang alami adalah “ke mana”.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit dipertahankan sebagai subjek. Huruf kapital mengikuti kebiasaan penulisan bahasa Indonesia ketika Yesus berbicara tentang diri-Nya.
- source_word: ὑπάγω
  choice: pergi
  rationale: Menyampaikan gerak menuju suatu tujuan tanpa menambahkan nuansa “berangkat” atau “meninggalkan” yang lebih khusus.
- source_word: οἴδατε
  choice: kalian tahu
  rationale: οἴδατε berbentuk jamak dan bermakna kini. “Kalian” membuat jumlah jamaknya jelas bagi pembaca Indonesia modern.
- source_word: τὴν ὁδόν
  choice: jalannya
  rationale: ὁδός dapat berarti jalan, jalur, atau cara. “Jalannya” alami dalam konstruksi ini dan mempertahankan cakupan metaforis yang menjadi penting dalam konteks berikutnya.
theological_decisions:
- issue: Urutan klausa dan hubungan antara tujuan Yesus dengan “jalan”
  choice: Dan ke mana Aku pergi, kalian tahu jalannya.
  alternative: Dan kalian tahu jalan ke tempat Aku pergi.
  rationale: Susunan dengan klausa tempat di depan mengikuti struktur Yunani dan tetap alami dalam bahasa Indonesia. Terjemahan ini menghubungkan “jalan” dengan tujuan Yesus tanpa menjelaskan lebih jauh hakikat jalan itu atau mengimpor pernyataan ayat 6.
- issue: Varian tekstual yang menyebut pengetahuan tentang tujuan dan jalan secara terpisah
  choice: Mengikuti teks SBLGNT yang hanya menyatakan bahwa para murid mengetahui jalan sehubungan dengan tempat yang Yesus tuju.
  alternative: Dan kalian tahu ke mana Aku pergi, dan kalian tahu jalannya.
  rationale: Bacaan alternatif berasal dari sebagian naskah dan tidak dipakai dalam teks utama SBLGNT; karena itu dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk menyatakan bentuk jamak Yunani secara jelas; “jalannya” mempertahankan ungkapan yang alami sekaligus keterbukaan makna harfiah dan metaforis.
