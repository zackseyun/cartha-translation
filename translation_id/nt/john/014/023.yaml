id: JHN.14.23
reference: John 14:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: id
  text: Yesus menjawab kepadanya, “Jika seseorang mengasihi Aku, ia akan memegang perkataan-Ku[a]. Bapa-Ku akan mengasihi dia, dan Kami akan datang kepadanya serta menetap bersama dia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menaati perkataan-Ku” atau “akan menuruti ajaran-Ku.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “membuat tempat tinggal bersama dia”; dapat juga diterjemahkan “tinggal bersama dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jawab Yesus kepadanya
  rationale: Ungkapan Yunani harfiah ‘menjawab dan berkata kepadanya’ merupakan formula naratif. ‘Jawab Yesus kepadanya’ menyampaikan tindakan menjawab secara alami dalam bahasa Indonesia tanpa pengulangan yang kaku.
- source_word: Ἐάν τις
  choice: Jika seseorang
  rationale: Konstruksi syarat tak tentu ini bersifat umum dan terbuka bagi siapa pun; ‘seseorang’ mempertahankan bentuk tunggal tanpa membatasi cakupannya.
- source_word: ἀγαπᾷ με
  choice: mengasihi Aku
  rationale: ‘Mengasihi’ merupakan padanan yang wajar dan bermartabat untuk ἀγαπάω serta cocok bagi kasih kepada pribadi.
- source_word: τὸν λόγον μου
  choice: perkataan-Ku
  rationale: λόγος di sini menunjuk pada perkataan atau pesan Yesus. ‘Perkataan-Ku’ mempertahankan diksi Yohanes dan lebih alami daripada bentuk tunggal ‘kata-Ku’ dalam bahasa Indonesia.
- source_word: τηρήσει
  choice: akan menaati
  rationale: Dalam konteks memelihara perkataan Yesus, τηρέω mencakup ketaatan. ‘Menaati’ menyampaikan maksud itu dengan jelas dan alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Bapa-Ku akan mengasihi dia
  rationale: Mempertahankan sebutan khas Yohanes bagi Allah dan mengulang verba ‘mengasihi’ sesuai teks sumber.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: Kami akan datang kepadanya
  rationale: Bentuk orang pertama jamak dipertahankan untuk menunjukkan tindakan bersama Yesus dan Bapa; ‘datang kepadanya’ menyatakan gerak relasional menuju orang itu.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: tinggal bersamanya
  rationale: Idiom Yunani secara harfiah berarti ‘membuat tempat tinggal padanya/bersamanya’. ‘Tinggal bersamanya’ mengungkapkan kehadiran menetap secara alami dalam bahasa Indonesia tanpa menghilangkan gagasan berdiam.
theological_decisions:
- issue: Subjek ilahi jamak dalam ‘Kami akan datang ... serta tinggal’
  choice: Mempertahankan ‘Kami’ sebagai rujukan bersama kepada Yesus dan Bapa
  alternative: Meratakan bentuk jamak atau memparafrasakannya sebagai kehadiran Allah
  rationale: Dua verba Yunani berbentuk orang pertama jamak dan secara eksplisit menggambarkan Yesus serta Bapa bertindak bersama. Terjemahan mempertahankan kesatuan tindakan sekaligus pembedaan pribadi tanpa menambahkan rumusan doktrinal.
- issue: Rujukan manusia generik berbentuk tunggal
  choice: Menggunakan ‘seseorang’, lalu ‘ia/dia’
  alternative: Menggunakan ‘siapa pun’ dan mengulang sebutan itu pada setiap klausa
  rationale: Pilihan ini mempertahankan konstruksi tunggal generik sumber, tetap inklusif secara alami, dan menghindari penandaan gender yang tidak diperlukan dalam bahasa Indonesia.
- issue: Hubungan kasih dan ketaatan
  choice: Mempertahankan bentuk syarat dan urutan klausa tanpa menjelaskan hubungan sebab-akibat lebih lanjut
  alternative: Memparafrasakan ketaatan sebagai bukti atau syarat memperoleh kasih ilahi
  rationale: Teks menyatakan hubungan tersebut tetapi tidak menguraikan seluruh logika teologisnya. Terjemahan tidak boleh diam-diam menentukan apakah klausa berikut terutama merupakan akibat, janji, atau penjelasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan dibuat alami bagi pembaca umum sambil mempertahankan bentuk syarat, pengulangan ‘mengasihi’, dan subjek jamak ilahi.
