id: JHN.14.1
reference: John 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: id
  text: “Janganlah hati kalian gelisah. Percayalah kepada Allah[a]; percayalah juga kepada-Ku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Yunani yang diterjemahkan “percayalah” dapat berupa perintah atau pernyataan. Karena itu, bagian ini juga dapat diterjemahkan, “Kalian percaya kepada Allah; percayalah juga kepada-Ku.” Kedua bagiannya pun mungkin dibaca sebagai pernyataan.
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “percaya” juga dapat bermakna menaruh kepercayaan atau memercayai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Janganlah ... gelisah
  rationale: Larangan dengan μή dan imperatif pasif orang ketiga tunggal dinyatakan secara alami dalam bahasa Indonesia. ‘Gelisah’ menyampaikan keadaan batin yang terusik tanpa mempersempit maknanya hanya pada rasa takut.
- source_word: ὑμῶν ἡ καρδία
  choice: hatimu
  rationale: Kata Yunani ‘hati’ berbentuk tunggal, sedangkan kata ganti pemiliknya jamak. Bahasa Indonesia tidak menandai jumlah pada bentuk ‘-mu’, sehingga ‘hatimu’ secara alami mempertahankan bentuk tunggal kolektif dalam sapaan kepada para murid.
- source_word: πιστεύετε
  choice: Percayalah
  rationale: πιστεύω dapat berarti percaya atau menaruh kepercayaan. Bentuk imperatif dipilih dalam teks utama karena sesuai dengan rangkaian penghiburan dan nasihat, tetapi ambiguitas gramatikal dengan bentuk indikatif dipertahankan dalam catatan kaki.
- source_word: εἰς τὸν θεόν
  choice: kepada Allah
  rationale: Dengan πιστεύω, εἰς menyatakan arah atau sasaran kepercayaan. ‘Percaya kepada Allah’ alami dalam bahasa Indonesia dan lebih jelas menyampaikan kepercayaan yang tertuju kepada pribadi daripada sekadar persetujuan atas suatu pernyataan.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: percayalah juga kepada-Ku
  rationale: ‘Juga’ mempertahankan daya aditif καί dan paralel antara kepercayaan kepada Allah dan kepada Yesus. Pengulangan kata kerja dipertahankan sebagaimana dalam bahasa Yunani.
theological_decisions:
- issue: Daya indikatif atau imperatif pada kedua bentuk πιστεύετε
  choice: 'Keduanya diterjemahkan sebagai imperatif: ‘Percayalah kepada Allah; percayalah juga kepada-Ku.’'
  alternative: '‘Kalian percaya kepada Allah; percayalah juga kepada-Ku.’ Kedua klausa juga secara gramatikal dapat dibaca sebagai pernyataan: ‘Kalian percaya kepada Allah dan juga percaya kepada-Ku.’'
  rationale: Bentuk indikatif dan imperatif orang kedua jamak identik dalam bahasa Yunani. Konteks penghiburan serta larangan pembuka mendukung pembacaan sebagai dua nasihat, tetapi bentuk aslinya sungguh ambigu; karena itu pembacaan indikatif dicatat tanpa menjadikannya teks utama.
- issue: Makna πιστεύω sebagai percaya atau memercayai/menaruh kepercayaan
  choice: ‘Percayalah kepada’ dalam teks utama
  alternative: ‘Taruhlah kepercayaan kepada’ atau ‘Percayakanlah dirimu kepada’
  rationale: ‘Percaya kepada’ ringkas, alami, dan dapat memuat unsur keyakinan maupun kepercayaan pribadi. Alternatif yang lebih eksplisit berisiko mempersempit atau menambahkan nuansa yang tidak dinyatakan secara terpisah dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk ‘janganlah’ dan ‘percayalah’ mempertahankan nada nasihat yang bermartabat. Sapaan ‘-mu’ dapat merujuk kepada kelompok tanpa harus memakai bentuk tidak alami ‘hati kalian’. Kapitalisasi ‘-Ku’ mengikuti konvensi umum teks Alkitab Indonesia untuk rujukan kepada Yesus.
