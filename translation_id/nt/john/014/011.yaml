base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: id
  text: Percayalah kepada-Ku bahwa Aku ada di dalam Bapa dan Bapa ada di dalam Aku; tetapi jika tidak, percayalah karena perbuatan-perbuatan itu sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “percayalah” yang terakhir tidak memiliki objek yang dinyatakan secara eksplisit dalam bahasa Yunani. Maksudnya, perbuatan-perbuatan itu sendiri menjadi dasar yang memadai untuk percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Percayalah kepada-Ku
  rationale: Kata kerja πιστεύω dengan datif μοι menyampaikan seruan untuk memercayai Yesus atau perkataan-Nya. Bentuk ini alami dalam bahasa Indonesia dan tidak memperluas objek menjadi “apa yang Kukatakan”.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι memperkenalkan isi yang harus dipercayai, bukan alasan untuk percaya.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: di dalam Bapa ... di dalam Aku
  rationale: Pengulangan ἐν dipertahankan untuk menjaga bahasa khas Yohanes mengenai keberadaan timbal balik tanpa menggantinya dengan parafrasa doktrinal.
- source_word: εἰ δὲ μή
  choice: Namun, jika tidak
  rationale: Ungkapan ini menghadirkan dasar alternatif untuk percaya jika seruan sebelumnya tidak diterima. Terjemahan tersebut mempertahankan bentuk kondisionalnya dan ambiguitas unsur yang dilesapkan.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: karena pekerjaan-pekerjaan itu sendiri
  rationale: διά dengan akusatif menunjukkan alasan atau dasar, sedangkan αὐτά menegaskan pekerjaan-pekerjaan itu sebagai kesaksian. “Pekerjaan-pekerjaan” mempertahankan cakupan istilah Yohanes tanpa membatasinya hanya pada mukjizat.
- source_word: πιστεύετε
  choice: percayalah
  rationale: Imperatif terakhir tidak memiliki objek eksplisit. Terjemahan absolut mempertahankan keringkasan dan ketaktertentuan teks Yunani.
theological_decisions:
- issue: Keberadaan timbal balik Anak dan Bapa
  choice: Aku ada di dalam Bapa dan Bapa ada di dalam Aku
  alternative: Aku bersatu dengan Bapa dan Bapa bersatu dengan Aku
  rationale: Pilihan ini mempertahankan rumusan relasional teks dan bobot teologisnya tanpa menyamakannya dengan rumusan lain atau menyisipkan tafsiran mengenai hakikat persatuan itu.
- issue: Dasar kepercayaan dari pekerjaan-pekerjaan
  choice: percayalah karena pekerjaan-pekerjaan itu sendiri
  alternative: percayalah kepada-Ku karena pekerjaan-pekerjaan itu sendiri
  rationale: πιστεύετε yang kedua tidak menyebutkan objek. Membiarkannya tanpa objek menjaga ketegangan dan keringkasan Yunani, sementara frasa berikutnya tetap menyatakan dasar untuk percaya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
