    rationale: Dalam bahasa Indonesia modern, “pekerjaan” terutama berarti tugas atau mata pencaharian. Dalam konteks Yohanes, ἔργα menunjuk tindakan/karya Yesus yang memberi kesaksian; “perbuatan-perbuatan” merupakan istilah yang lebih jelas dan tetap cukup luas.
