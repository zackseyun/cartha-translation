  source_fidelity: 'Terjemahan mempertahankan struktur pokok Yunani dengan baik: seruan untuk percaya, isi pengakuan timbal balik “di dalam” Bapa dan Anak, serta dasar alternatif pada karya-karya itu sendiri. Objek dari πιστεύετε yang terakhir dengan tepat tidak ditambahkan. Namun, “pekerjaan-pekerjaan” kurang tepat untuk τὰ ἔργα dalam konteks Yohanes; istilah itu dalam bahasa Indonesia lebih lazim menunjuk pekerjaan/tugas, sedangkan perbuatan atau karya Yesus yang menjadi kesaksian lebih jelas dinyatakan dengan “perbuatan-perbuatan.”'
  naturalness: Bahasa keseluruhan sudah baku dan mudah dipahami. Penggantian “Namun” dengan “tetapi” sedikit lebih langsung mencerminkan δέ dalam kontras bersyarat ini, dan “perbuatan-perbuatan itu sendiri” lebih alami serta lazim dalam register Alkitab Indonesia daripada “pekerjaan-pekerjaan itu sendiri.”
  terminology: “Bapa,” “Aku,” dan ungkapan “di dalam” dipertahankan. “Percayalah kepada-Ku” merupakan padanan Indonesia yang mapan untuk πιστεύετε μοι dalam konteks ini, tanpa perlu memperluasnya menjadi “percayalah kepada-Ku sebagai objek” pada imperatif kedua. “Perbuatan-perbuatan” mempertahankan keluasan ἔργα tanpa membatasinya pada mukjizat.
