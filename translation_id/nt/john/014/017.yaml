source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: id
  text: yaitu Roh Kebenaran[a]. Dunia tidak dapat menerima-Nya, sebab dunia tidak melihat-Nya dan tidak mengenal-Nya. Namun, kamu mengenal-Nya, sebab Ia tinggal bersama kamu dan akan ada di dalam kamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani untuk “Roh” berbentuk netral secara tata bahasa, tetapi dalam konteks ini acuannya diperlakukan sebagai pribadi.
    reason: lexical_alternative
  - marker: b
    text: “Di dalam kamu” juga dapat dipahami secara kolektif sebagai “di antara kamu.” Sejumlah naskah berbunyi “ada di dalam kamu,” bukan “akan ada di dalam kamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roh Kebenaran
  rationale: Mempertahankan konstruksi genitif Yunani dan ungkapan khas Yohanes; huruf kapital menunjukkan bahwa dalam konteks ini yang dimaksud ialah Roh Kudus.
- source_word: ὃ / αὐτό
  choice: yang / -Nya
  rationale: Bahasa Yunani memakai bentuk gramatikal netral karena πνεῦμα berjenis netral, tetapi konteks merujuk kepada pribadi. Bahasa Indonesia dapat mempertahankan acuan personal secara alami melalui akhiran -Nya.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah Yohanes yang luas tanpa mempersempitnya menjadi seluruh umat manusia atau suatu sistem dunia tertentu.
- source_word: οὐ δύναται λαβεῖν
  choice: tidak dapat diterima
  rationale: Menyatakan ketidakmampuan yang terkandung dalam δύναται dan menerjemahkan λαβεῖν dengan makna menerima; susunan pasif alami dalam bahasa Indonesia mempertahankan dunia sebagai pihak yang tidak mampu menerima.
- source_word: θεωρεῖ
  choice: melihat
  rationale: Padanan modern dan langsung yang tidak membatasi nuansa kata ini hanya pada persepsi batin.
- source_word: γινώσκει / γινώσκετε
  choice: mengenal / mengenal
  rationale: Mempertahankan pengulangan leksikal dan cocok untuk pengenalan personal, bukan sekadar mengetahui fakta.
- source_word: παρ’ ὑμῖν μένει
  choice: Ia tinggal bersama kamu
  rationale: Menerjemahkan μένει secara alami sekaligus mempertahankan motif menetap dalam Injil Yohanes; παρά dengan datif dinyatakan sebagai 'bersama kamu'.
- source_word: ἐν ὑμῖν ἔσται
  choice: akan ada di dalam kamu
  rationale: Mempertahankan bentuk masa depan ἔσται dan arti lokatif dasar ἐν serta membedakannya dari παρά, tanpa mengubah verba 'akan ada' menjadi 'akan tinggal'.
theological_decisions:
- issue: Acuan personal kepada Roh meskipun bentuk gramatikal Yunani netral
  choice: Menggunakan acuan personal 'Ia' dan '-Nya'
  alternative: Menggunakan acuan impersonal seperti 'itu' atau '-nya' tanpa kapitalisasi
  rationale: Jenis gramatikal πνεῦμα tidak dengan sendirinya menentukan bahwa referennya impersonal. Konteks perpisahan Yohanes memperlakukan Roh sebagai pelaku personal; bahasa Indonesia menyatakannya secara wajar tanpa mengubah konstruksi Yunani.
- issue: Hubungan Roh dengan para murid dalam παρά dan ἐν
  choice: Membedakan 'bersama kamu' dari 'di dalam kamu'
  alternative: Menerjemahkan ἐν ὑμῖν sebagai 'di antara kamu'
  rationale: Dua preposisi yang berbeda dipertahankan agar perkembangan atau ketegangan tekstual tidak diratakan. Karena ὑμῖν berbentuk jamak, kemungkinan pengertian kolektif tetap dicatat.
- issue: Varian tekstual waktu pada ἐν ὑμῖν ἔσται
  choice: 'Mengikuti teks utama SBLGNT: ''akan ada di dalam kamu'''
  alternative: 'Varian waktu kini: ''ada di dalam kamu'''
  rationale: SBLGNT mencetak ἔσται sebagai bacaan utama, sehingga bentuk masa depan dipertahankan. Varian penting dicatat agar pembaca mengetahui adanya bukti naskah untuk waktu kini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kamu' dipakai untuk mempertahankan sapaan orang kedua jamak dalam konteks para murid. 'Namun' mengungkapkan kontras yang tersirat oleh penempatan tegas ὑμεῖς tanpa mengubah isi proposisional.
