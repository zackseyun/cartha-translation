id: JHN.14.31
reference: John 14:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: id
  text: Namun, supaya dunia tahu bahwa Aku mengasihi Bapa, Aku melakukan tepat seperti yang Bapa perintahkan kepada-Ku.[a] Bangunlah, mari kita pergi dari sini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, supaya dunia tahu bahwa Aku mengasihi Bapa—dan sebagaimana Bapa telah memerintahkan kepada-Ku, demikianlah Aku melakukannya.”
    reason: Alternatif ini mempertahankan susunan καθώς ... οὕτως dan koordinasi καί secara lebih eksplisit.
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Mempertahankan daya pertentangan dengan pernyataan sebelumnya, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἵνα γνῷ
  choice: supaya ... tahu
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan; susunan ini menyampaikan maksud tersebut secara alami dalam bahasa Indonesia.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes yang di sini menunjuk kepada umat manusia secara kolektif, tanpa mempersempitnya melalui parafrasa.
- source_word: ἀγαπῶ
  choice: Aku mengasihi
  rationale: Bentuk kini diterjemahkan dengan kala kini sederhana; 'mengasihi' wajar untuk hubungan pribadi ini dan mempertahankan bobot teologis istilah tersebut.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Mempertahankan gelar relasional tanpa menambahkan kata milik 'Bapa-Ku', yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: Aku melakukan tepat seperti yang diperintahkan Bapa kepada-Ku
  rationale: Mengungkapkan pasangan καθώς ... οὕτως sebagai kesesuaian yang tepat dan mempertahankan kekuatan ἐντέλλομαι sebagai perintah. Susunan alternatif yang lebih harfiah dicatat karena struktur Yunani dapat dipertahankan secara berbeda.
- source_word: Ἐγείρεσθε
  choice: Bangunlah
  rationale: Imperatif jamak ini menyuruh para murid bangkit dari posisi mereka; 'Bangunlah' ringkas dan alami.
- source_word: ἄγωμεν
  choice: mari kita pergi
  rationale: Menyampaikan subjungtif ajakan orang pertama jamak dengan bentuk ajakan Indonesia yang lazim.
- source_word: ἐντεῦθεν
  choice: dari sini
  rationale: Menyatakan keberangkatan dari tempat mereka berada secara langsung dan alami.
theological_decisions:
- issue: Gelar relasional πατήρ dalam Kristologi Yohanes
  choice: Bapa
  alternative: Bapa-Ku
  rationale: Teks menampilkan kasih dan ketaatan Yesus kepada Bapa tanpa kata ganti milik yang eksplisit. Pilihan ini mempertahankan rumusan Yunani dan tidak menambahkan penafsiran.
- issue: Kekuatan ἐντέλλομαι dalam hubungan Bapa dan Anak
  choice: diperintahkan
  alternative: diarahkan
  rationale: Kata Yunani menyatakan perintah atau amanat yang berwenang. Terjemahan tidak melunakkan bahasanya karena pertimbangan doktrinal, tetapi tetap membiarkan ketegangan teologis teks mengenai kasih dan ketaatan Sang Anak.
- issue: Hubungan sintaksis antara klausa tujuan dan καθώς ... οὕτως
  choice: Klausa 'Aku melakukan...' menjadi tindakan yang membuat dunia tahu
  alternative: 'Mempertahankan susunan koordinatif: ''dan sebagaimana Bapa memerintahkan kepada-Ku, demikianlah Aku melakukannya'''
  rationale: Bahasa Yunani padat dan memungkinkan hubungan sintaksis yang ditata secara berbeda dalam terjemahan. Teks utama memberi alur Indonesia yang paling alami, sedangkan catatan kaki mempertahankan kemungkinan susunan yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Kapitalisasi 'Aku' dan 'Bapa' mengikuti rujukan kepada Yesus dan Allah. Bentuk 'Bangunlah, mari kita pergi' tetap mudah dipahami pembaca umum tanpa menjadi terlalu percakapan.
