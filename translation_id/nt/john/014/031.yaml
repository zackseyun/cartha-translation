  source_fidelity: Teks utama pada dasarnya menyampaikan kontras ἀλλά, tujuan ἵνα, istilah Yohanes κόσμος, kasih kepada Bapa, ketaatan yang sesuai dengan perintah Bapa, serta dua imperatif penutup. Namun, konstruksi pasif “yang diperintahkan Bapa kepada-Ku” kurang langsung untuk ἐνετείλατο μοι ὁ πατήρ, dan catatan kaki memakai kala kini “memerintahkan,” padahal bentuk Yunani adalah aoris.
  naturalness: Bahasa teks utama umumnya baku dan mudah dipahami. Bentuk aktif “yang Bapa perintahkan kepada-Ku” lebih alami dan lebih jelas daripada konstruksi pasif yang ada. “Bangunlah, mari kita pergi dari sini” sudah idiomatis dan sesuai register.
  terminology: “Dunia,” “mengasihi,” dan “Bapa” mempertahankan diksi penting Yohanes dengan baik. “Perintahkan” mempertahankan kekuatan ἐντέλλομαι tanpa pelunakan. Kapitalisasi rujukan ilahi konsisten dengan konvensi naskah.
