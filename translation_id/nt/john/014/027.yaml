  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: id
  text: Damai Kutinggalkan bagimu; damai-Ku Kuberikan kepadamu. Aku memberikannya kepadamu bukan seperti dunia memberikannya. Janganlah hatimu gelisah ataupun gentar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takut” atau “kehilangan keberanian.” Kata Yunani yang dipakai dapat berarti menjadi takut atau gentar sehingga kehilangan keberanian.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang alami dan bermartabat ini mempertahankan keluasan makna εἰρήνη sebagai damai, keutuhan, dan kesejahteraan tanpa membatasinya pada ketenangan batin atau ketiadaan konflik.
- source_word: ἀφίημι
  choice: Kutinggalkan
  rationale: Menerjemahkan verba kini secara langsung dan tetap membuka kemungkinan nuansa meninggalkan sebagai warisan tanpa menjadikan nuansa itu eksplisit.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: Damai sejahtera-Ku
  rationale: Akhiran posesif mempertahankan penekanan bahwa damai itu milik Yesus dan berbeda dari apa yang diberikan dunia.
- source_word: δίδωμι
  choice: Kuberikan / memberikannya
  rationale: Padanan langsung dan alami yang mempertahankan pengulangan serta kontras antara pemberian Yesus dan pemberian dunia; pronomina -nya pada kalimat ketiga memperjelas objek tersirat dalam bahasa Indonesia.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: tidak seperti dunia memberikannya
  rationale: Mempertahankan perbandingan cara pemberian tanpa menjelaskan secara berlebihan apa yang dimaksud dengan cara dunia.
- source_word: κόσμος
  choice: dunia
  rationale: Padanan baku yang mempertahankan keluasan dan resonansi khas Yohanes tanpa mempersempitnya menjadi masyarakat atau tatanan tertentu.
- source_word: μὴ ταρασσέσθω
  choice: Janganlah ... gelisah
  rationale: Padanan idiomatis untuk keadaan terguncang atau resah dan selaras dengan konteks Yohanes 14:1.
- source_word: ὑμῶν ἡ καρδία
  choice: hatimu
  rationale: Mempertahankan bentuk tunggal kolektif Yunani dengan posesif yang secara idiomatis dapat ditujukan kepada kelompok dalam bahasa Indonesia.
- source_word: μηδὲ δειλιάτω
  choice: atau menjadi gentar
  rationale: Gentar menyampaikan rasa takut yang melemahkan keberanian dan membedakannya dari gelisah, tanpa konotasi celaan sekeras pengecut.
theological_decisions:
- issue: Sifat damai yang diberikan Yesus
  choice: Memakai 'damai sejahtera' dan 'damai sejahtera-Ku' tanpa menjabarkannya lebih lanjut.
  alternative: Menafsirkannya secara khusus sebagai ketenangan batin, keutuhan eskatologis, atau pendamaian dengan Allah.
  rationale: Ayat ini tidak membatasi maknanya pada satu dimensi; terjemahan mempertahankan keluasan teologis εἰρήνη.
- issue: Bentuk tunggal kolektif 'hati'
  choice: Mempertahankan 'hatimu' sebagai bentuk tunggal kolektif.
  alternative: Menggunakan bentuk distributif 'hati kalian'.
  rationale: Pilihan ini lebih dekat dengan ὑμῶν ἡ καρδία dan tetap dapat dipahami sebagai sapaan kepada para murid secara bersama-sama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Inversi ringan pada 'Kutinggalkan bagimu' mempertahankan fokus awal Yunani pada damai sejahtera, sedangkan bentuk terikat -Ku dan Ku- menjaga kelancaran serta penekanan ucapan langsung Yesus.
