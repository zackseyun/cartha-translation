id: JHN.14.24
reference: John 14:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: id
  text: Orang yang tidak mengasihi Aku tidak menuruti perkataan-perkataan-Ku. Perkataan[a] yang kamu dengar itu bukan milik-Ku, melainkan milik Bapa yang mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pesan yang kamu dengar itu bukan berasal dari-Ku, melainkan dari Bapa yang mengutus Aku.”'
    reason: Alternatif ini menyatakan arti kolektif λόγος sebagai 'pesan' dan memahami konstruksi kepunyaan sebagai penunjuk asal atau sumber.
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Orang yang tidak mengasihi Aku
  rationale: Partisipel berartikel berfungsi sebagai nomina dan menunjuk secara umum kepada orang yang dicirikan oleh sikap tidak mengasihi Yesus. Bentuk ini mempertahankan sifat umum ungkapan Yunani dengan bahasa Indonesia yang wajar.
- source_word: τοὺς λόγους μου
  choice: perkataan-perkataan-Ku
  rationale: Bentuk ulang mempertahankan kemajemukan λόγους dan membedakannya dari bentuk tunggal λόγος pada klausa berikutnya. 'Perkataan' lebih sesuai untuk ajaran yang diucapkan daripada 'kata-kata' yang dapat terkesan menunjuk unsur bahasa satu per satu.
- source_word: τηρεῖ
  choice: menuruti
  rationale: Dalam konteks Yohanes, τηρέω berarti memegang teguh dengan melaksanakan atau menaati. 'Menuruti' menyampaikan unsur ketaatan secara alami tanpa membatasi maknanya pada penjagaan harfiah.
- source_word: ὁ λόγος
  choice: Perkataan
  rationale: Bentuk tunggal dipertahankan dan dapat dipahami secara kolektif sebagai perkataan atau pesan yang disampaikan Yesus. Catatan kaki memberi alternatif 'pesan' tanpa menghapus diksi λόγος dari teks utama.
- source_word: ὃν ἀκούετε
  choice: yang kamu dengar itu
  rationale: Terjemahan ini mengikuti klausa relatif secara langsung. 'Itu' membuat konstruksi Indonesia lebih alami tanpa menambahkan sumber yang tidak dinyatakan dalam klausa Yunani.
- source_word: οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: bukan milik-Ku, melainkan milik Bapa yang mengutus Aku
  rationale: Ungkapan kepunyaan 'milik-Ku ... milik Bapa' mempertahankan kesejajaran ἐμός dengan genitif τοῦ ... πατρός serta menghasilkan kalimat Indonesia yang jelas dan alami.
theological_decisions:
- issue: Hubungan antara perkataan Yesus dan perkataan Bapa
  choice: bukan milik-Ku, melainkan milik Bapa yang mengutus Aku
  alternative: bukan berasal dari-Ku, melainkan dari Bapa yang mengutus Aku
  rationale: 'Teks utama mempertahankan bentuk kepunyaan dan ketegangan ungkapan sumber: perkataan itu didengar dari Yesus, tetapi disebut milik Bapa yang mengutus-Nya. Terjemahan tidak menambahkan penjelasan teologis yang menghapus pembedaan ataupun kesatuan pesan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk kepada Yesus dan Bapa ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerjemahan Alkitab Indonesia. Pengulangan 'perkataan-perkataan' dipilih untuk mempertahankan kontras bentuk jamak λόγους dengan bentuk tunggal λόγος.
