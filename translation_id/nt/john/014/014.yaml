  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: id
  text: Jika kamu meminta apa pun kepada-Ku dalam nama-Ku[a], Aku akan melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Jika kamu meminta apa pun dalam nama-Ku, Aku akan melakukannya,” dengan tidak mencantumkan “kepada-Ku”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat; “jika” merupakan padanan Indonesia yang alami dan tepat dalam konteks ini.
- source_word: τι
  choice: apa pun
  rationale: Menyampaikan cakupan tak tentu dari pronomina ini secara alami dalam bahasa Indonesia.
- source_word: αἰτήσητέ
  choice: kamu meminta
  rationale: Bentuk aoris subjungtif orang kedua jamak berada dalam klausa dengan ἐάν. Bahasa Indonesia secara alami memakai “meminta”; “kamu” dapat mencakup para murid sebagai kelompok.
- source_word: με
  choice: kepada-Ku
  rationale: Pronomina objek hadir dalam teks SBLGNT dan diterjemahkan secara eksplisit. Karena verba “meminta” dalam bahasa Indonesia lazim menandai orang yang dimintai dengan “kepada”, bentuk ini lebih alami daripada “meminta Aku”.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Mempertahankan ungkapan Yohanes yang mengaitkan permintaan dengan nama, kewenangan, dan pribadi Yesus tanpa mempersempit maknanya melalui penjelasan interpretatif.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina Yunani dinyatakan secara eksplisit dan agak menegaskan pelakunya. “Aku” mempertahankan subjek yang jelas tanpa menambahkan penekanan berlebihan.
- source_word: ποιήσω
  choice: akan melakukannya
  rationale: Menyampaikan bentuk futurum dan secara alami merujuk kembali kepada hal yang diminta.
theological_decisions:
- issue: Kehadiran με (“Aku/Kepada-Ku”) dan implikasinya bahwa permintaan secara eksplisit ditujukan kepada Yesus
  choice: Menerjemahkan με dalam teks utama sebagai “kepada-Ku”
  alternative: “Jika kamu meminta apa pun dalam nama-Ku, Aku akan melakukannya,” tanpa “kepada-Ku”
  rationale: Teks sumber SBLGNT memuat με, sehingga teks utama harus mencerminkannya. Karena varian yang menghilangkannya memengaruhi apakah Yesus disebut secara eksplisit sebagai pihak yang dimintai, varian itu dicatat dalam catatan kaki tanpa menyelesaikan ketegangan teologis secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapitalisasi pada kata ganti yang merujuk kepada Yesus mengikuti gaya penghormatan yang umum dalam penerjemahan Alkitab bahasa Indonesia. Ungkapan “dalam nama-Ku” dipertahankan agar keluasan makna sumber tidak dipersempit.
