  source_fidelity: 'Teks Indonesia menyampaikan semua unsur utama Yunani dengan setia: ἔτι μικρόν sebagai waktu singkat yang tersisa, οὐκέτι sebagai penghentian penglihatan oleh dunia, kontras δέ, pengulangan θεωρέω bagi dunia dan murid, serta hubungan kausal ὅτι antara hidup Yesus dan hidup para murid. Kala mendatang pada ζήσετε dipertahankan dengan “akan hidup.”'
  naturalness: '“Tidak lama lagi, dunia tidak akan melihat Aku lagi, tetapi kamu akan melihat Aku” adalah bahasa Indonesia modern yang jelas dan wajar. Pengulangan “lagi” tidak janggal: yang pertama membentuk ungkapan waktu, sedangkan yang kedua menerjemahkan οὐκέτι.'
