id: JHN.14.19
reference: John 14:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: id
  text: Tidak lama lagi, dunia tidak akan melihat Aku lagi, tetapi kamu akan melihat Aku[a]. Karena Aku hidup, kamu pun akan hidup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “melihat” pada kedua kemunculannya juga dapat berarti “memandang” atau “mengamati”, bukan sekadar melihat sepintas.
    reason: lexical_alternative
  - marker: b
    text: “Kamu pun akan hidup” dapat menunjuk pada kehidupan rohani bersama Yesus, kehidupan kebangkitan, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Tidak lama lagi
  rationale: Ungkapan waktu ini menunjuk pada sisa waktu yang singkat sebelum perubahan yang segera terjadi; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah luas khas Yohanes tanpa mempersempitnya menjadi sistem dunia atau orang-orang tertentu.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: tidak akan melihat / akan melihat
  rationale: Kata kerja ini dapat menyiratkan pengamatan yang lebih dari sekadar pandangan sesaat, tetapi 'melihat' paling alami dan tetap membiarkan hakikat penglihatan itu terbuka. Bentuk 'akan' menyatakan perubahan mendatang yang ditandai oleh konteks waktu.
- source_word: οὐκέτι
  choice: tidak ... lagi
  rationale: Padanan Indonesia yang ringkas dan wajar untuk berhentinya suatu keadaan.
- source_word: δὲ
  choice: tetapi
  rationale: Menandai pertentangan antara dunia dan para murid dalam hubungan mereka dengan Yesus.
- source_word: ὅτι
  choice: Karena
  rationale: 'Mempertahankan hubungan sebab: hidup para murid berlandaskan hidup Yesus.'
- source_word: ἐγὼ ζῶ
  choice: Aku hidup
  rationale: Mempertahankan kala kini dan ungkapan singkat yang sarat makna tanpa menambahkan penafsiran.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: kamu pun akan hidup
  rationale: '''Pun'' mencerminkan καί dan menegaskan hubungan antara hidup Yesus dan hidup para murid; ''akan'' mempertahankan kala mendatang.'
theological_decisions:
- issue: Makna para murid 'melihat' Yesus
  choice: Diterjemahkan secara luas sebagai 'melihat' tanpa menentukan jenis penglihatan itu.
  alternative: Penampakan Yesus secara jasmani sesudah kebangkitan, pengenalan rohani terhadap Yesus yang bangkit, atau keduanya.
  rationale: Bahasa Yunani tidak secara tegas membatasi rujukannya, dan konteks Yohanes memungkinkan lebih dari satu gema makna.
- issue: Makna 'kamu pun akan hidup'
  choice: Diterjemahkan secara luas tanpa membatasinya pada satu dimensi kehidupan.
  alternative: Hidup rohani dalam persatuan dengan Yesus, hidup kebangkitan pada masa depan, atau keduanya.
  rationale: Bentuk mendatang ζήσετε memiliki cakupan teologis yang kaya; terjemahan utama sebaiknya mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi 'Aku' mengikuti kebiasaan umum untuk ucapan Yesus. Susunan kalimat mempertahankan kontras dunia–murid serta hubungan sebab antara hidup Yesus dan hidup para murid.
