id: JHN.14.8
reference: John 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: id
  text: Filipus berkata kepada-Nya, “Tuhan,[a] tunjukkanlah Bapa kepada kami, dan itu cukup bagi kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan”.
    reason: κύριος dalam bentuk sapaan dapat berarti gelar “Tuhan” atau sapaan hormat “Tuan”.
lexical_decisions:
- source_word: Λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai present historis, tetapi dalam narasi bahasa Indonesia modern pengantar dialog lebih wajar dinyatakan dengan bentuk lampau kontekstual “berkata”.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina datif menandai pihak yang diajak bicara; kapitalisasi mengikuti kebiasaan bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: Φίλιππος
  choice: Filipus
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Vokatif κύριος dapat menyatakan sapaan hormat atau gelar. Dalam konteks Yohanes, “Tuhan” mempertahankan bobot kristologisnya tanpa menutup kemungkinan nuansa sapaan hormat, yang dicatat dalam catatan kaki.
- source_word: δεῖξον
  choice: tunjukkanlah
  rationale: Imperatif aoris menunjukkan permintaan langsung agar Bapa diperlihatkan atau diperkenalkan; “tunjukkanlah” alami sekaligus dekat dengan makna dasar.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Datif penerima dengan δεῖξον secara alami diterjemahkan “kepada kami”; “kami” tepat karena tidak mencakup Yesus yang diajak bicara.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Dalam konteks ini menunjuk secara khusus kepada Allah sebagai Bapa Yesus; bentuk definit Yunani secara alami menjadi nama/sebutan “Bapa” dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan hubungan koordinatif langsung antara permintaan Filipus dan pernyataan tentang kecukupannya.
- source_word: ἀρκεῖ
  choice: cukup
  rationale: Menyampaikan makna present ἀρκέω, yakni memadai atau mencukupi, dengan ungkapan Indonesia yang sederhana dan tepat.
- source_word: ἡμῖν
  choice: bagi kami
  rationale: Datif dengan ἀρκεῖ paling alami dinyatakan sebagai “bagi kami”, yaitu cukup dari sudut kebutuhan para murid yang diwakili Filipus.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan penghormatan dan bobot kristologis sapaan dalam konteks Injil Yohanes. Karena κύριος juga dapat menjadi sapaan hormat “Tuan”, alternatif itu dicatat agar ambiguitas leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan alur langsung teks Yunani sambil memakai bentuk naratif yang alami. Pronomina “kami” membedakan kelompok Filipus dari Yesus sebagai lawan bicara.
