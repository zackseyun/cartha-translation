base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: id
  text: Di rumah Bapa-Ku ada banyak tempat tinggal[a]. Seandainya tidak demikian, masakan Aku mengatakan kepada kalian bahwa Aku pergi untuk menyiapkan tempat bagi kalian?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “banyak kamar.” Kata Yunani ini dapat berarti tempat untuk tinggal atau menetap; “tempat tinggal” lebih luas dan mempertahankan kaitannya dengan tema tinggal dalam pasal ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Seandainya tidak demikian, tentu Aku sudah mengatakannya kepada kalian, karena Aku pergi untuk menyiapkan tempat bagi kalian.” Klausa Yunani ini juga dapat dipahami sebagai pernyataan, bukan pertanyaan retoris.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῇ οἰκίᾳ τοῦ πατρός μου
  choice: Di rumah Bapa-Ku
  rationale: “Rumah” mempertahankan gambaran konkret οἰκία dan merupakan ungkapan Indonesia yang alami. “Bapa-Ku” merujuk kepada Allah sebagaimana dalam perkataan Yesus.
- source_word: μοναὶ πολλαί
  choice: banyak tempat tinggal
  rationale: μονή berarti tempat untuk tinggal atau menetap. “Tempat tinggal” lebih luas daripada “kamar” dan tetap mencerminkan tema tinggal/menetap dalam Yohanes 14.
- source_word: εἰ δὲ μή
  choice: Seandainya tidak demikian
  rationale: Ungkapan ini menyatakan kondisi yang berlawanan dengan kenyataan; bentuk tersebut jelas dan wajar dalam bahasa Indonesia.
- source_word: εἶπον ἂν ὑμῖν
  choice: apakah Aku akan mengatakan kepadamu
  rationale: Aoristus bersama ἄν dalam konstruksi bersyarat diterjemahkan secara alami dengan “akan mengatakan”; “apakah” menyatakan pembacaan sebagai pertanyaan retoris.
- source_word: ὅτι
  choice: bahwa
  rationale: Pada pembacaan utama, ὅτι memperkenalkan isi dari apa yang dikatakan. Kemungkinan arti “karena” dicatat dalam catatan kaki karena berkaitan dengan pembagian klausa.
- source_word: πορεύομαι
  choice: Aku pergi
  rationale: Bentuk kini dapat membawa arah yang segera atau futuristis dalam konteks ini. “Aku pergi” ringkas, alami, dan tidak mempersempitnya menjadi sekadar keberangkatan biasa.
- source_word: ἑτοιμάσαι τόπον ὑμῖν
  choice: untuk menyiapkan tempat bagimu
  rationale: Infinitif menyatakan tujuan; τόπος tetap diterjemahkan secara luas sebagai “tempat,” dan datif ὑμῖν sebagai penerima manfaat. “Bagimu” secara gramatikal dapat mencakup jamak menurut konteks.
theological_decisions:
- issue: Makna μονή dalam gambaran eskatologis
  choice: banyak tempat tinggal
  alternative: banyak kamar; banyak kediaman
  rationale: “Tempat tinggal” tidak memasukkan gambaran kemewahan seperti “mahligai” dan tidak mempersempitnya menjadi bagian-bagian arsitektural sebuah bangunan seperti “kamar.”
- issue: Tanda baca dan fungsi klausa kedua
  choice: 'Pertanyaan retoris: “Seandainya tidak demikian, apakah Aku akan mengatakan kepadamu bahwa Aku pergi untuk menyiapkan tempat bagimu?”'
  alternative: 'Pernyataan: “Seandainya tidak demikian, tentu Aku sudah mengatakannya kepadamu, karena Aku pergi untuk menyiapkan tempat bagimu.”'
  rationale: Naskah Yunani mula-mula tidak memiliki tanda baca modern, dan ὅτι dapat dipahami sebagai “bahwa” atau “karena.” Pertanyaan retoris dipakai dalam teks utama, sedangkan pembacaan pernyataan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi mengikuti ejaan Alkitab Indonesia yang lazim. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas asli; alternatif leksikal dan tanda baca yang penting dipertahankan dalam catatan kaki.
