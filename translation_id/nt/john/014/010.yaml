  terminology: Istilah 'Bapa', 'percaya', 'di dalam', dan 'pekerjaan' dipertahankan. 'Ucapkan' memberikan padanan alami bagi λαλῶ dan masih membedakannya secara ringan dari λέγω, 'katakan'. Kapitalisasi pronomina dipertahankan sesuai register draf.
