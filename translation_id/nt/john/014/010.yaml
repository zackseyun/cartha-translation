  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: id
  text: Tidakkah engkau percaya bahwa Aku ada di dalam Bapa dan Bapa ada di dalam Aku? Perkataan yang Kukatakan kepada kalian tidak Kuucapkan dari diri-Ku sendiri[a], tetapi Bapa yang tetap tinggal di dalam Aku[b] melakukan pekerjaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “atas prakarsa-Ku sendiri” atau “atas wewenang-Ku sendiri.” Ungkapan Yunani ini dapat menunjuk pada sumber, prakarsa, atau wewenang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berdiam di dalam Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: percaya
  rationale: Padanan baku bagi tema πιστεύω yang berulang dalam Injil Yohanes; mempertahankan kaitan leksikal antarayat.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: di dalam Bapa ... di dalam Aku
  rationale: Mempertahankan bahasa saling berdiam dalam teks Yunani tanpa menggantinya dengan parafrasa teologis seperti 'bersatu dengan'.
- source_word: ῥήματα
  choice: perkataan-perkataan
  rationale: Menunjuk pada hal-hal yang diucapkan dan mempertahankan bentuk jamak sumber; ungkapan ini wajar dalam bahasa Indonesia formal modern.
- source_word: λέγω
  choice: Kukatakan
  rationale: Secara alami mengungkapkan tindakan mengatakan isi perkataan dan tetap dapat dibedakan dari λαλῶ pada klausa berikutnya.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: dari diri-Ku sendiri
  rationale: Mempertahankan metafora sumber dalam bahasa Yunani serta membuka kemungkinan nuansa asal, prakarsa, atau wewenang tanpa mempersempitnya.
- source_word: λαλῶ
  choice: Kusampaikan
  rationale: Menghasilkan kalimat Indonesia yang lebih alami daripada pengulangan 'katakan', sambil mempertahankan perbedaan dengan λέγω; dalam konteks ini menunjuk pada penyampaian perkataan.
- source_word: μένων
  choice: yang tetap tinggal
  rationale: Mengungkapkan daya duratif partisipel μένων dengan bahasa modern dan mempertahankan tema μένω dalam Yohanes.
- source_word: ποιεῖ
  choice: melakukan
  rationale: Padanan langsung dan alami ketika objeknya adalah 'pekerjaan-pekerjaan-Nya'.
- source_word: τὰ ἔργα αὐτοῦ
  choice: pekerjaan-pekerjaan-Nya
  rationale: Mempertahankan bentuk jamak ἔργα dan pronomina kepunyaan αὐτοῦ serta kosakata khas Yohanes tentang pekerjaan ilahi.
theological_decisions:
- issue: Saling berdiamnya Bapa dan Anak
  choice: Aku di dalam Bapa dan Bapa di dalam Aku
  alternative: Aku bersatu dengan Bapa dan Bapa bersatu dengan Aku
  rationale: Terjemahan mempertahankan rumusan relasional yang tepat dari ayat ini, tanpa menyamakannya dengan rumusan Yohanes lain atau memasukkan terminologi doktrinal kemudian.
- issue: Sumber dan prakarsa perkataan Yesus
  choice: tidak Kusampaikan dari diri-Ku sendiri
  alternative: tidak Kusampaikan atas prakarsa-Ku sendiri
  rationale: Bentuk yang dipilih menjaga keluasan ἀπ’ ἐμαυτοῦ, yang dapat menyangkut sumber, prakarsa, atau wewenang, dan tidak mempersempit ketegangan teologis teks.
- issue: Karya Bapa yang tetap tinggal dalam Anak
  choice: Bapa yang tetap tinggal di dalam Aku melakukan pekerjaan-pekerjaan-Nya
  alternative: Bapa yang berdiam di dalam Aku sedang mengerjakan pekerjaan-pekerjaan itu
  rationale: Mempertahankan pembedaan Bapa dan Anak sekaligus bahasa kesatuan relasional dalam ayat, serta merepresentasikan αὐτοῦ yang ada dalam SBLGNT.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk 'engkau' mempertahankan sapaan tunggal kepada Filipus; 'kepadamu' dapat berbentuk sama untuk tunggal maupun jamak, sesuai konteks langsung dan bentuk Yunani ὑμῖν yang jamak. Kedua penanda catatan kaki ditempatkan tepat pada unsur yang diterangkan.
