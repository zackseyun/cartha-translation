id: JHN.14.6
reference: John 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: id
  text: Yesus berkata kepadanya[a], “Akulah jalan, kebenaran, dan hidup. Tidak seorang pun datang kepada Bapa kecuali melalui Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Yesus berkata kepadanya” memakai bentuk kini dalam bahasa Yunani (“Yesus berkata/mengatakan kepadanya”), yaitu bentuk kini historis dalam sebuah narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai present historis, secara harfiah 'berkata', tetapi dalam narasi bahasa Indonesia bentuk 'berkata' secara alami dapat merujuk pada peristiwa lampau tanpa mengubah sudut pandang naratif.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina datif ini menandai orang yang menjadi tujuan perkataan Yesus; 'kepadanya' merupakan padanan Indonesia yang langsung dan alami.
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Pronomina ἐγώ yang dinyatakan secara eksplisit memberi penekanan. Bentuk 'Akulah' menyampaikan penekanan itu dengan alami dalam bahasa Indonesia.
- source_word: ἡ ὁδός
  choice: jalan
  rationale: ὁδός dapat berarti jalan atau jalur. 'Jalan' mempertahankan baik gambaran konkret maupun makna metaforis tentang akses kepada Bapa.
- source_word: ἡ ἀλήθεια
  choice: kebenaran
  rationale: ἀλήθεια terutama berarti kebenaran; pilihan ini mempertahankan keluasan pemakaiannya dalam Injil Yohanes tanpa mempersempitnya menjadi tafsiran tertentu.
- source_word: ἡ ζωή
  choice: hidup
  rationale: ζωή berarti hidup dan dalam Yohanes memiliki bobot teologis yang luas. 'Hidup' mempertahankan keluasan itu tanpa tambahan penafsiran.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan ini menyampaikan negasi universal dengan jelas, wajar, dan bermartabat.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini ini menyatakan kenyataan umum, bukan tindakan progresif; 'datang' merupakan padanan Indonesia yang alami.
- source_word: πρὸς τὸν πατέρα
  choice: kepada Bapa
  rationale: πρός dengan akusatif menunjukkan gerak menuju. 'Bapa' diperlakukan sebagai sebutan pribadi bagi Allah dalam konteks ini.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Gabungan ini berfungsi secara idiomatis sebagai pengecualian. 'Kecuali' menyampaikan hubungan logisnya secara ringkas dan tepat.
- source_word: δι’ ἐμοῦ
  choice: melalui Aku
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. 'Melalui Aku' mempertahankan daya perantara frasa tersebut.
theological_decisions:
- issue: Eksklusivitas jalan kepada Bapa melalui Yesus
  choice: Pernyataan langsung 'Tidak seorang pun datang kepada Bapa kecuali melalui Aku' dipertahankan tanpa pelunakan.
  alternative: '''Tidak seorang pun datang kepada Bapa jika tidak melalui Aku.'''
  rationale: Bahasa Yunani secara jelas menyatakan bahwa jalan kepada Bapa adalah melalui Yesus. Terjemahan tidak memperlunak ataupun memperluas pernyataan melampaui bunyi ayat.
- issue: Rangkaian tiga predikat Yohanes
  choice: Diterjemahkan 'jalan, kebenaran, dan hidup' dengan 'Akulah' sebagai penanda predikasi dan penekanan.
  alternative: '''Aku adalah jalan dan kebenaran dan hidup.'''
  rationale: Bahasa Yunani mengulang artikel dan kata penghubung untuk memberi bobot tersendiri pada ketiga predikat. Dalam bahasa Indonesia, daftar dengan koma dan 'dan' terakhir lebih alami, sementara kesejajaran ketiganya tetap jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Akulah' dipilih untuk membawa penekanan Ἐγώ tanpa susunan yang kaku. Kapitalisasi 'Aku' dan 'Bapa' mengikuti pemakaian sebagai rujukan pribadi ilahi. Hanya satu catatan kaki dipakai, dan penandanya [a] tercantum dalam teks utama.
