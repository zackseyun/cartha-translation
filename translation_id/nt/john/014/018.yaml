  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: id
  text: Aku tidak akan meninggalkan kalian sebagai yatim piatu[a]; Aku datang kepada kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku tidak akan meninggalkan kalian menjadi yatim piatu.” Kata Yunani ini menggambarkan orang yang kehilangan orang tua atau yang ditinggalkan tanpa pemeliharaan orang tua.
    reason: lexical_alternative
  - marker: b
    text: “Aku datang kepada kalian” dapat menunjuk pada kedatangan Yesus sesudah kebangkitan-Nya, kedatangan-Nya melalui Roh Kudus, atau kedatangan-Nya kembali kelak; ungkapan Yunani ini tidak mengharuskan hanya satu rujukan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: akan meninggalkan
  rationale: Bentuk futurum ἀφίημι di sini berarti membiarkan atau meninggalkan seseorang dalam suatu keadaan. “Akan meninggalkan” alami dalam bahasa Indonesia dan tidak menambahkan nuansa penolakan yang lebih kuat seperti “menelantarkan”.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina ini berbentuk jamak dan merujuk kepada para murid; “kalian” menyatakan jumlah jamak secara jelas dalam bahasa Indonesia modern.
- source_word: ὀρφανούς
  choice: sebagai yatim piatu
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang anak-anak yang kehilangan pemeliharaan orang tua, bukan sekadar mengungkapkan rasa kesepian atau ditinggalkan.
- source_word: ἔρχομαι
  choice: Aku datang
  rationale: Bentuk kini Yunani dipertahankan untuk menyampaikan kedekatan dan kepastian tindakan, tanpa meratakannya menjadi futurum biasa “Aku akan datang”.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: πρός dengan akusatif menunjukkan gerak menuju orang tertentu; “kepada kalian” merupakan padanan yang wajar setelah verba “datang”.
- source_word: Οὐκ
  choice: tidak
  rationale: Negasi ini secara alami bergabung dengan verba futurum menjadi “tidak akan”.
theological_decisions:
- issue: Waktu dan cara kedatangan Yesus dalam frasa ἔρχομαι πρὸς ὑμᾶς
  choice: Menerjemahkan secara terbuka sebagai “Aku datang kepada kalian” tanpa menentukan satu peristiwa tertentu.
  alternative: Menafsirkannya secara khusus sebagai penampakan Yesus sesudah kebangkitan, kedatangan-Nya melalui Roh Kudus, atau kedatangan-Nya kembali pada akhir zaman.
  rationale: Konteks dekat berbicara tentang Roh Kudus, tetapi ungkapan ini juga dapat menunjuk pada kedatangan pribadi Yesus kepada para murid. Teks Yunani sendiri tidak menetapkan hanya satu rujukan, sehingga ambiguitas teologisnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Kalian” dipilih untuk memperjelas bahwa sapaan berbentuk jamak. Huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika Yesus berbicara tentang diri-Nya.
