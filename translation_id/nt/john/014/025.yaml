  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: id
  text: Semua ini telah Kukatakan kepada kalian selagi Aku masih tinggal bersama kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “selagi Aku tinggal bersama kalian” atau “ketika Aku masih bersama kalian.” Kata Yunani yang dipakai berarti “tinggal” atau “tetap” dan berulang kali muncul dalam Injil Yohanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Semua ini
  rationale: Kata tunjuk netral jamak ini menunjuk pada berbagai ajaran yang baru disampaikan. “Semua ini” alami dalam bahasa Indonesia dan tetap menyampaikan cakupan bentuk jamaknya.
- source_word: λελάληκα
  choice: telah Kukatakan
  rationale: Bentuk perfek menunjukkan perkataan yang sudah disampaikan dan tetap relevan. “Telah Kukatakan” lebih alami daripada “telah Kubicarakan” dalam konteks pengajaran langsung.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina ini berbentuk jamak dan ditujukan kepada para murid. “Kalian” menyatakan jumlah jamak secara jelas dalam bahasa Indonesia modern.
- source_word: παρ’ ὑμῖν
  choice: bersama kalian
  rationale: παρά dengan datif di sini menyatakan kehadiran atau kedekatan. “Bersama kalian” merupakan padanan Indonesia yang alami.
- source_word: μένων
  choice: selagi Aku masih tinggal
  rationale: Partisipel kini dari μένω menyatakan keadaan yang berlangsung bersamaan dengan tindakan berkata. “Tinggal” mempertahankan hubungan leksikal dengan tema μένω dalam Yohanes, sedangkan “selagi” membuat hubungan waktunya jelas; “masih” secara alami menyiratkan bahwa masa kehadiran itu akan berakhir.
theological_decisions:
- issue: Menjaga kesinambungan istilah μένω dalam Injil Yohanes
  choice: selagi Aku masih tinggal bersama kalian
  alternative: selagi Aku masih bersama kalian
  rationale: Pilihan “tinggal” mempertahankan gema kata μένω yang berulang dalam Yohanes tanpa memaksakan makna teologis tambahan. Alternatif yang menghilangkan “tinggal” lebih luwes, tetapi mengaburkan hubungan leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menyatakan bahwa sapaan Yunani berbentuk jamak. Bentuk terikat “Kukatakan” mempertahankan gaya langsung perkataan Yesus tanpa terasa kuno.
