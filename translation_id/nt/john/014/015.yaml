  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: id
  text: Jika kamu mengasihi Aku, kamu akan menjalankan perintah-perintah-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamu akan menaati perintah-perintah-Ku.” Kata Yunaninya dapat berarti menjalankan, menaati, menjaga, atau memegang teguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Jika
  rationale: Mengawali klausa bersyarat. “Jika” merupakan padanan Indonesia yang alami dan tidak menambahkan makna berulang seperti “setiap kali”.
- source_word: ἀγαπᾶτέ
  choice: kamu mengasihi
  rationale: Bentuk kini subjungtif orang kedua jamak sesudah ἐάν paling alami diterjemahkan sebagai kondisi “kamu mengasihi”; “kamu” dapat merujuk kepada jamak dalam bahasa Indonesia.
- source_word: με
  choice: Aku
  rationale: Pronomina objek ini merujuk kepada Yesus. Huruf kapital dipakai mengikuti kelaziman ejaan Alkitab bahasa Indonesia bagi pronomina yang merujuk kepada-Nya.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: perintah-perintah-Ku
  rationale: ἐντολάς berbentuk jamak dan berarti perintah atau ketetapan; bentuk ulang menyatakan jamak secara jelas, sedangkan enklitik “-Ku” secara alami menerjemahkan penegasan kepunyaan τὰς ἐμὰς.
- source_word: τηρήσετε
  choice: kamu akan menaati
  rationale: Bentuk futur indikatif orang kedua jamak dipertahankan sebagai pernyataan masa depan, bukan diubah menjadi imperatif. Dalam konteks perintah, “menaati” menyampaikan tindakan menjalankan atau memelihara perintah secara alami dalam bahasa Indonesia, sementara keluasan makna verba dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah τηρήσετε diterjemahkan sebagai perintah atau sebagai pernyataan masa depan
  choice: 'pernyataan masa depan: “kamu akan menaati”'
  alternative: 'arti imperatif: “taatilah perintah-perintah-Ku”'
  rationale: Bentuk Yunani adalah futur indikatif, bukan imperatif. Terjemahan mempertahankan ketegangan bahwa kasih kepada Yesus dinyatakan atau menghasilkan ketaatan, tanpa mengubahnya menjadi perintah langsung.
- issue: Keluasan makna τηρέω dalam hubungan dengan perintah Yesus
  choice: “menaati” dalam teks utama, dengan “memegang teguh/menjaga” dicatat sebagai nuansa alternatif
  alternative: “memegang teguh” atau “menjaga” dalam teks utama
  rationale: Dalam bahasa Indonesia modern, “menaati perintah” adalah kolokasi yang paling wajar. Namun, catatan mempertahankan jangkauan τηρέω yang dapat mencakup menjaga, memelihara, mengamalkan, dan memegang teguh, sehingga maknanya tidak dipersempit secara diam-diam menjadi kepatuhan belaka.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan bersyarat serta bentuk futur dipertahankan. “Perintah-perintah-Ku” mempertahankan bentuk jamak dan bobot ungkapan Yohanes, sedangkan catatan kaki menjelaskan keluasan makna τηρέω.
