source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: id
  text: Orang yang memiliki perintah-perintah-Ku dan menaatinya, dialah yang mengasihi Aku. Orang yang mengasihi Aku akan dikasihi oleh Bapa-Ku. Aku pun akan mengasihinya dan menyatakan diri-Ku kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memperlihatkan diri-Ku kepadanya.” Kata Yunani yang dipakai dapat berarti membuat diri dikenal atau terlihat; dalam konteks ini, ungkapan itu menekankan penyingkapan diri Yesus secara pribadi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Orang yang memegang
  rationale: Artikel dengan partisipel kini berfungsi substantival dan menunjuk kepada seorang wakil secara umum. 'Orang yang memegang' mempertahankan bentuk tunggal serta menyampaikan bahwa perintah itu dimiliki dan dipegang teguh.
- source_word: τὰς ἐντολάς μου
  choice: perintah-perintah-Ku
  rationale: ἐντολή menyatakan perintah yang berwibawa. Bentuk jamak dan kata ganti milik Yesus dipertahankan.
- source_word: τηρῶν αὐτά
  choice: menaatinya
  rationale: τηρέω di sini berarti menaati atau menjalankan dengan setia. 'Menaatinya' lebih alami dalam bahasa Indonesia daripada mengulang 'memegang', sambil tetap mempertahankan hubungan antara memiliki dan melaksanakan perintah.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: dialah yang mengasihi Aku
  rationale: Kata tunjuk ἐκεῖνος bersifat menegaskan. 'Dialah' mempertahankan identifikasi yang tegas dalam ungkapan Indonesia yang alami.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: mengasihi / akan dikasihi / akan mengasihi
  rationale: Pengulangan kelompok kata ἀγαπάω dipertahankan agar kaitan leksikal dan bobot teologisnya tetap tampak.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: Orang yang mengasihi Aku
  rationale: δέ bersifat penghubung ringan. Pemisahan menjadi kalimat baru menghasilkan alur Indonesia yang alami tanpa memberi kesan pertentangan yang kuat.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: akan dikasihi oleh Bapa-Ku
  rationale: Bentuk pasif masa depan dan pelaku tindakan dipertahankan secara langsung, begitu pula bahasa relasional 'Bapa-Ku'.
- source_word: κἀγώ
  choice: Aku pun
  rationale: κἀγώ menggabungkan καί dan ἐγώ. 'Aku pun' menyampaikan tindakan Yesus yang sejalan dan menyusul tindakan Bapa.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: akan menyatakan diri-Ku kepadanya
  rationale: ἐμφανίζω dapat berarti membuat tampak atau membuat dikenal. 'Menyatakan diri-Ku' mempertahankan cakupan penyingkapan pribadi tanpa membatasinya pada penampakan jasmani.
theological_decisions:
- issue: Hubungan antara kasih dan ketaatan
  choice: Susunan kalimat mengidentifikasi orang yang memegang dan menaati perintah Yesus sebagai orang yang mengasihi-Nya.
  alternative: Menafsirkan ketaatan sebagai hal yang membuktikan kasih atau menghasilkan kasih ilahi sebagai upah.
  rationale: Teks Yunani menyatakan hubungan identifikasi, bukan secara eksplisit hubungan jasa atau sebab. Terjemahan mempertahankan ketegangan itu tanpa menambahkan penjelasan doktrinal.
- issue: Sifat penyataan diri Yesus
  choice: menyatakan diri-Ku kepadanya
  alternative: memperlihatkan diri-Ku kepadanya
  rationale: Konteks memungkinkan penyingkapan pribadi yang lebih luas daripada penglihatan jasmani. Pilihan utama tidak menutup kemungkinan manifestasi, tetapi tidak mempersempit makna ke penampakan visual saja.
- issue: Bentuk tunggal maskulin yang representatif
  choice: orang yang ... kepadanya
  alternative: dia laki-laki / mereka
  rationale: Bahasa Indonesia tidak mewajibkan penandaan gender pada pronomina. Bentuk tunggal dipertahankan, sementara daya representatif Yunani disampaikan secara alami tanpa memasukkan gender biologis yang tidak menjadi pokok pernyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina ilahi mengikuti gaya Alkitab Indonesia yang lazim. 'Memegang ... dan menaatinya' menjaga dua unsur Yunani sambil menghindari ungkapan yang kaku. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa yang dijelaskannya.
