  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: id
  text: Tetapi Sang Penolong[a], yaitu Roh Kudus, yang akan Bapa utus dalam nama-Ku, Dialah yang akan mengajarkan segala sesuatu kepada kalian dan mengingatkan kalian akan semua yang telah Kukatakan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Pembela,” “Pendamping,” “Penghibur,” atau “Penasihat” untuk “Penolong” (Yunani: paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Sang Penolong
  rationale: Istilah ini menunjuk pada pribadi yang hadir untuk menolong, mendampingi, mewakili, atau membela. “Sang Penolong” alami dalam bahasa Indonesia dan cukup luas, sementara nuansa lain dipertahankan dalam catatan kaki.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku dan wajar dalam bahasa Indonesia modern untuk gelar ini.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: yang akan diutus Bapa
  rationale: Bentuk pasif menghasilkan susunan Indonesia yang alami tanpa mengubah pelaku pengutusan, yaitu Bapa, atau pribadi yang diutus, yaitu Roh Kudus.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Mempertahankan ungkapan sumber beserta cakupan makna perwakilan, hubungan, dan kewenangan tanpa membatasinya pada satu tafsiran.
- source_word: ἐκεῖνος
  choice: Dialah
  rationale: Bentuk ini mempertahankan penekanan demonstratif maskulin yang kembali menunjuk kepada παράκλητος dan menegaskan pelaku pribadi.
- source_word: διδάξει ὑμᾶς πάντα
  choice: akan mengajarkan segala sesuatu kepadamu
  rationale: Padanan langsung dan alami yang mempertahankan keluasan πάντα serta bentuk orang kedua jamak melalui konteks bahasa Indonesia.
- source_word: ὑπομνήσει ὑμᾶς
  choice: mengingatkan kamu
  rationale: Secara ringkas dan alami menyampaikan makna kausatif, yakni membuat para murid mengingat.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: semua yang telah Kukatakan kepadamu
  rationale: Mempertahankan konstruksi relatif dan acuan kepada seluruh perkataan Yesus; “telah Kukatakan” wajar untuk tindakan lampau yang tetap relevan.
theological_decisions:
- issue: Bahasa personal bagi Roh Kudus
  choice: Memakai “yang” dan penegasan personal “Dialah”
  alternative: Memakai rujukan impersonal atau menghilangkan penegasan ἐκεῖνος
  rationale: Ayat ini menggabungkan πνεῦμα yang berjenis netral secara gramatikal dengan gelar personal παράκλητος dan demonstratif maskulin ἐκεῖνος. “Dialah” mencerminkan penekanan dan tindakan personal tanpa memaksakan pronomina bergender yang tidak lazim dalam bahasa Indonesia.
- issue: Penerjemahan παράκλητος
  choice: Sang Penolong
  alternative: Pembela, Pendamping, Penghibur, atau Penasihat
  rationale: Kata Yunani ini memiliki jangkauan makna hukum, perwakilan, dukungan, dan penghiburan. “Sang Penolong” paling mudah dipahami dan cukup luas dalam konteks ini; alternatif penting dicatat agar kekayaan istilah tidak disempitkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pada sebutan ilahi serta bentuk terikat “nama-Ku” dan “Kukatakan” mengikuti kelaziman penerbitan Alkitab Indonesia. “Kepadamu” dan “kamu” menerjemahkan bentuk jamak Yunani; bahasa Indonesia tidak selalu menandai jumlah secara eksplisit.
