source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: id
  text: Pada hari itu kamu akan mengetahui bahwa Aku di dalam Bapa-Ku, dan kamu di dalam Aku, dan Aku di dalam kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di dalam” diulang sesuai teks Yunani untuk mempertahankan gambaran tentang hubungan timbal balik yang erat. Ungkapan ini dapat dijelaskan sebagai “bersatu dengan”, tetapi terjemahan tersebut lebih bersifat tafsiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Pada hari itu
  rationale: Frasa ini menyatakan waktu. “Pada hari itu” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan kekhususan kata penunjuk ἐκείνῃ.
- source_word: γνώσεσθε ὑμεῖς
  choice: kamu akan mengetahui
  rationale: Bentuk mendatang γνώσεσθε menunjuk pada pengetahuan atau kesadaran yang kelak dimiliki para murid. Pronomina eksplisit ὑμεῖς memberi penekanan ringan, tetapi tidak perlu ditambah menjadi “kamu sendiri” dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang akan diketahui, bukan alasan sebab-akibat.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: Aku di dalam Bapa-Ku
  rationale: Kopula “adalah” tidak dinyatakan dalam bahasa Yunani dan tidak diperlukan dalam bahasa Indonesia. “Di dalam” mempertahankan metafora ἐν serta hubungan filial dalam πατρί μου.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: dan kamu di dalam Aku
  rationale: Klausa tanpa verba ini dapat diterjemahkan secara alami tanpa menambahkan “berada”. Pengulangan “di dalam” dipertahankan agar pola timbal balik teks sumber tetap tampak.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: dan Aku di dalam kamu
  rationale: κἀγώ berarti “dan Aku”. Terjemahan ini mempertahankan kesejajaran dan bahasa saling berdiam tanpa mempersempitnya menjadi satu penafsiran tertentu.
theological_decisions:
- issue: Bahasa saling berdiam dalam Yohanes (ἐν ... ἐν ... ἐν)
  choice: Mempertahankan “di dalam” pada ketiga klausa.
  alternative: “Aku bersatu dengan Bapa-Ku, kamu bersatu dengan Aku, dan Aku bersatu dengan kamu.”
  rationale: “Di dalam” menjaga metafora dan ketegangan teologis teks mengenai hubungan Yesus dengan Bapa serta hubungan timbal balik Yesus dan para murid. “Bersatu dengan” lebih interpretatif dan dapat mempersempit cakupannya.
- issue: Hubungan Yesus dengan Bapa
  choice: “Aku di dalam Bapa-Ku”
  alternative: “Aku satu hakikat dengan Bapa-Ku” atau “Aku bersama Bapa-Ku”
  rationale: Pilihan ini tidak melemahkan pernyataan Kristologisnya, tetapi juga tidak memasukkan rumusan teologis kemudian yang tidak dinyatakan secara langsung oleh ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” dan “Bapa-Ku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus dan Bapa. Penanda catatan kaki ditempatkan setelah seluruh rangkaian klausa yang diterangkannya.
