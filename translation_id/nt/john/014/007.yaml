  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: id
  text: Seandainya kamu telah mengenal Aku, kamu tentu juga telah mengenal Bapa-Ku. Mulai sekarang, kamu mengenal Dia[a] dan telah melihat Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kenallah Dia.'
    reason: Bentuk Yunani γινώσκετε dapat secara morfologis dibaca sebagai indikatif (“kamu mengenal”) atau imperatif (“kenallah”), meskipun indikatif lebih sesuai dengan konteks.
lexical_decisions:
- source_word: ἐγνώκειτέ
  choice: telah mengenal
  rationale: Bentuk aoristus dalam syarat yang tidak terpenuhi dipadankan dengan frasa lampau untuk menyampaikan makna ‘seandainya kamu telah mengenal’ secara alami dalam bahasa Indonesia.
- source_word: ἂν ᾔδειτε
  choice: tentu telah mengenal
  rationale: Gabungan ἄν dengan bentuk lampau menyatakan akibat yang berlawanan dengan kenyataan; ‘tentu’ mempertahankan nuansa kondisional tanpa membuat kalimat kaku.
- source_word: ἀπ’ ἄρτι
  choice: mulai sekarang
  rationale: Ungkapan ini menunjuk titik awal pada saat itu dan kelanjutan sesudahnya.
- source_word: γινώσκετε
  choice: kamu mengenal
  rationale: Bentuk kini dipahami sebagai indikatif dalam konteks pernyataan Yesus; arti dasarnya adalah mengenal, bukan sekadar mengetahui fakta.
- source_word: ἑωράκατε
  choice: telah melihat
  rationale: Bentuk perfek menyatakan tindakan melihat yang telah terjadi dengan hasil yang tetap relevan.
theological_decisions:
- issue: Hubungan mengenal dan melihat Bapa melalui Yesus
  choice: Dipertahankan sebagai pernyataan langsung tanpa penjelasan tambahan.
  alternative: Menambahkan ‘melalui Aku’ atau menyamakan Yesus dan Bapa secara eksplisit.
  rationale: Teks menyatakan bahwa para murid mengenal dan telah melihat Bapa dalam kaitannya dengan mengenal Yesus, tetapi tidak memuat frasa penjelas tersebut; penambahan akan menyelesaikan ketegangan teologis yang sengaja dibiarkan oleh teks.
- issue: Nuansa modus γινώσκετε
  choice: 'Indikatif: ‘kamu mengenal Dia’.'
  alternative: 'Imperatif: ‘kenallah Dia’.'
  rationale: Konteks dan rangkaian dengan ‘telah melihat Dia’ lebih mendukung pernyataan indikatif, tetapi bentuk Yunani dapat dibaca sebagai indikatif atau imperatif; kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua jamak diterjemahkan ‘kamu’, yang dalam bahasa Indonesia dapat berfungsi untuk tunggal maupun jamak; konteks menunjukkan para murid sebagai kelompok. Kapitalisasi ‘Aku’, ‘Bapa-Ku’, dan ‘Dia’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan ilahi.
