  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: id
  text: Kata Yesus kepadanya, “Sudah sekian lama[a] Aku bersama kalian, tetapi engkau masih belum mengenal Aku, Filipus? Orang yang telah melihat Aku telah melihat Bapa. Bagaimana mungkin engkau berkata, ‘Tunjukkanlah Bapa kepada kami’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Selama ini.”
    reason: Alternatif idiomatis bagi Τοσούτῳ χρόνῳ yang juga menyatakan lamanya waktu sampai saat itu.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: Sudah sekian lama
  rationale: Frasa datif ini menyatakan rentang waktu yang panjang hingga saat berbicara. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya teguran dalam pertanyaan Yesus.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Aku bersama kalian
  rationale: Bentuk kini Yunani menyatakan kebersamaan yang terus berlangsung. “Kalian” mempertahankan bentuk jamak ὑμῶν dan membedakannya dari sapaan tunggal kepada Filipus.
- source_word: οὐκ ἔγνωκάς με
  choice: engkau masih belum mengenal Aku
  rationale: Bentuk perfektum menunjuk pada keadaan belum mengenal yang tetap berlangsung setelah kesempatan yang panjang. “Masih belum” menyampaikan daya teguran konteks, sedangkan “engkau” mempertahankan bentuk tunggal.
- source_word: Φίλιππε
  choice: Filipus
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia; posisi sapaan mempertahankan fungsi vokatif Yunani.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Orang yang telah melihat Aku
  rationale: Partisip perfektum berartikel berfungsi substantival. Rumusan ini jelas, wajar, dan mempertahankan aspek telah melihat tanpa membatasi pernyataan pada jenis kelamin tertentu.
- source_word: ἑώρακεν τὸν πατέρα
  choice: telah melihat Bapa
  rationale: Terjemahan langsung mempertahankan gelar “Bapa” dan kekuatan pernyataan Kristologis tanpa menambahkan penjelasan.
- source_word: πῶς σὺ λέγεις
  choice: Bagaimana mungkin engkau berkata
  rationale: πῶς bersifat retoris dan mengungkapkan keheranan atau teguran. “Bagaimana mungkin” menyampaikan daya tersebut secara alami.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Tunjukkanlah Bapa kepada kami
  rationale: Imperatif aoris δείκνυμι diterjemahkan langsung sebagai permintaan untuk menunjukkan; “kepada kami” mempertahankan penerima jamak.
theological_decisions:
- issue: Hubungan antara melihat Yesus dan melihat Bapa
  choice: Orang yang telah melihat Aku telah melihat Bapa
  alternative: Orang yang telah melihat Aku telah melihat seperti apa Bapa itu
  rationale: Teks Yunani menyatakan hubungan itu secara langsung dan kuat. Terjemahan tidak melemahkannya menjadi sekadar kemiripan atau perwakilan, tetapi juga tidak menambahkan rumusan ontologis di luar bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk bentuk jamak, sedangkan “engkau” untuk sapaan tunggal kepada Filipus, sehingga peralihan jumlah dalam teks Yunani tetap terlihat. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti gaya penghormatan yang lazim dalam teks Alkitab bahasa Indonesia.
