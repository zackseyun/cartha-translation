  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: id
  text: Tomas berkata kepada-Nya, “Tuhan, kami tidak tahu ke mana Engkau pergi. Bagaimana kami dapat[a] mengetahui[b] jalan itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bagaimana kami mampu mengetahui jalan itu?”'
    reason: lexical_alternative
  - marker: b
    text: 'Kata Yunani yang berarti “tahu/mengetahui” dipakai dua kali dalam ayat ini: “kami tidak tahu” dan “mengetahui jalan itu.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Tomas berkata kepada-Nya
  rationale: Bentuk present historis λέγει dialihkan dengan bentuk lampau naratif yang alami dalam bahasa Indonesia. Nama Θωμᾶς ditransliterasikan menurut bentuk Indonesia yang lazim, “Tomas”.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan vokatif ini mempertahankan baik rasa hormat seorang murid maupun kemungkinan bobot kristologisnya dalam Injil Yohanes tanpa membatasinya menjadi sapaan sopan biasa.
- source_word: οὐκ οἴδαμεν
  choice: kami tidak tahu
  rationale: οἶδα menyatakan pengetahuan; “tidak tahu” merupakan padanan langsung dan alami. “Kami” dipilih karena Tomas berbicara kepada Yesus atas nama kelompok murid yang tidak mencakup lawan bicara.
- source_word: ποῦ ὑπάγεις
  choice: ke mana Engkau pergi
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan membiarkan resonansi khas Yohanes tentang kepergian Yesus tetap tersirat, tanpa menjelaskan tujuan-Nya di dalam terjemahan.
- source_word: πῶς δυνάμεθα
  choice: Bagaimana kami dapat
  rationale: “Dapat” menyampaikan kemampuan yang dinyatakan oleh δύναμαι secara wajar dan cukup formal dalam bahasa Indonesia modern.
- source_word: τὴν ὁδὸν
  choice: jalan itu
  rationale: ὁδός berarti jalan atau cara. “Jalan itu” merujuk pada jalan menuju tujuan yang baru disebut dan mempertahankan kaitan tematis dengan ayat berikutnya.
- source_word: εἰδέναι
  choice: mengetahui
  rationale: Pilihan ini mempertahankan pengulangan akar makna ‘tahu/mengetahui’ antara οἴδαμεν dan εἰδέναι, sekaligus menghasilkan kalimat Indonesia yang alami.
theological_decisions:
- issue: Nuansa teologis ὑπάγεις dalam konteks Yohanes
  choice: ke mana Engkau pergi
  alternative: ke mana Engkau akan pergi / ke mana Engkau berangkat
  rationale: Tujuan kepergian Yesus memiliki makna teologis dalam Yohanes, tetapi pertanyaan Tomas menonjolkan ketidaktahuan para murid. Rumusan netral ini mempertahankan ketegangan naratif tanpa menambahkan penjelasan tentang kenaikan atau kepulangan kepada Bapa.
- issue: Makna ὁδός menjelang pernyataan Yesus dalam ayat berikutnya
  choice: jalan itu
  alternative: cara untuk sampai ke sana
  rationale: Terjemahan literal-alami “jalan itu” mempertahankan kemungkinan makna konkret dan kiasan serta kaitannya dengan Yohanes 14:6, tanpa lebih dahulu menafsirkan jalan sebagai metode atau ajaran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia. Pengulangan ‘tahu/mengetahui’ dipertahankan untuk mencerminkan hubungan leksikal dalam bahasa Yunani.
