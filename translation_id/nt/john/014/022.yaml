id: JHN.14.22
reference: John 14:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: id
  text: Yudas—bukan Yudas Iskariot—berkata kepada-Nya, “Tuhan, apa yang telah terjadi sehingga Engkau akan menyatakan diri-Mu kepada kami, tetapi tidak kepada dunia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan dengan bentuk naratif Indonesia yang alami tanpa mengubah maknanya.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Yudas—bukan Yudas Iskariot—
  rationale: Keterangan ini secara eksplisit membedakan pembicara dari Yudas Iskariot; nama Yudas dipertahankan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini mempertahankan penghormatan sekaligus bobot gelar κύριος dalam konteks perkataan kepada Yesus.
- source_word: τί γέγονεν
  choice: apa yang telah terjadi
  rationale: 'Ungkapan ini mempertahankan daya perfektum Yunani: sesuatu telah terjadi dan menghasilkan keadaan yang sedang dipertanyakan.'
- source_word: ὅτι
  choice: sehingga
  rationale: Dalam pertanyaan ini, ὅτι menghubungkan keadaan yang terjadi dengan maksud Yesus; 'sehingga' alami dalam bahasa Indonesia dan tidak memaksakan hubungan sebab yang terlalu tegas.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Datif menunjukkan para penerima penyataan diri Yesus tanpa menambahkan penjelasan yang tidak dinyatakan dalam teks.
- source_word: μέλλεις
  choice: Engkau akan
  rationale: Pilihan ini menyampaikan orientasi ke depan dari μέλλω secara alami, tanpa memastikan apakah tekanannya pada niat atau kedekatan waktu.
- source_word: ἐμφανίζειν σεαυτόν
  choice: menyatakan diri-Mu
  rationale: Terjemahan ini mencakup arti membuat diri terlihat atau dikenal dan mempertahankan unsur refleksifnya.
- source_word: κόσμῳ
  choice: dunia
  rationale: Istilah ini mempertahankan kosakata khas Yohanes dan ambiguitasnya antara umat manusia secara luas dan tatanan manusia yang jauh dari Allah.
theological_decisions:
- issue: Makna κόσμος dalam Injil Yohanes
  choice: dunia
  alternative: umat manusia pada umumnya; tatanan dunia yang tidak percaya
  rationale: Ayat ini tidak mengharuskan satu nuansa dipilih secara eksklusif. 'Dunia' mempertahankan keluasan dan ketegangan teologis istilah tersebut.
- issue: Cara Yesus menyatakan diri
  choice: menyatakan diri-Mu
  alternative: memperlihatkan diri-Mu; membuat diri-Mu dikenal
  rationale: Ungkapan Indonesia yang dipilih tidak membatasi penyataan itu hanya pada penampakan kasatmata atau hanya pada pemberian pengetahuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mengapit klarifikasi identitas agar kalimat tetap jelas. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia.
