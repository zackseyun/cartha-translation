  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan semua unsur utama SBLGNT: Yudas dibedakan dari Iskariot, sapaan Κύριε diterjemahkan “Tuhan,” τί γέγονεν mempertahankan aspek hasil dengan “apa yang telah terjadi,” dan μέλλεις diterjemahkan secara wajar dengan “akan.” Hubungan ὅτι diterjemahkan “sehingga,” yang sesuai dalam bentuk pertanyaan ini. Kontras antara penerima penyataan (“kami”) dan κόσμος (“dunia”) tetap utuh.'
  naturalness: Kalimatnya baku, jelas, dan terdengar alami dalam bahasa Indonesia modern. Penggunaan tanda pisah untuk keterangan “bukan Yudas Iskariot” dapat diterima dan membantu pembaca mengenali pembicara. “Menyatakan diri-Mu” merupakan ungkapan yang lancar dan tepat dalam register Alkitab yang modern dan bermartabat.
  terminology: “Tuhan” mempertahankan gelar κύριος tanpa penafsiran tambahan. “Dunia” tepat untuk κόσμος dalam penggunaan Yohanes dan dengan baik mempertahankan ambiguitas teologisnya. Kapitalisasi pronomina bagi Yesus konsisten dengan kebiasaan penerbitan Alkitab Indonesia dan tidak mengubah makna.
