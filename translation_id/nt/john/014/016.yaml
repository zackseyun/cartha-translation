  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: id
  text: Dan Aku akan meminta kepada Bapa, dan Dia akan memberikan kepada kalian seorang Penolong[a] yang lain, supaya Dia menyertai kalian selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pembela,” “Penasihat,” atau, menurut terjemahan tradisional, “Penghibur”; menerjemahkan kata Yunani παράκλητος.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Dan Aku
  rationale: Bentuk gabungan καί + ἐγώ menghubungkan kalimat dengan konteks sebelumnya serta memberi sedikit penekanan pada subjek, tanpa perlu menambahkan kata seperti 'sendiri'.
- source_word: ἐρωτήσω
  choice: akan meminta kepada
  rationale: Bentuk futur ἐρωτάω menyatakan tindakan meminta. Ungkapan ini alami dalam bahasa Indonesia dan tidak memasukkan nuansa religius tambahan seperti 'berdoa kepada'.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Teks Yunani memakai gelar dengan artikel tanpa pronomina posesif. 'Bapa' mempertahankan pemakaian khas Yohanes tanpa menambahkan 'Bapa-Ku'.
- source_word: ἄλλον παράκλητον
  choice: seorang Penolong yang lain
  rationale: ἄλλον berarti 'yang lain', sedangkan παράκλητος mencakup gagasan penolong, pembela, penasihat, dan penghibur. 'Penolong' paling luas dan alami dalam bahasa Indonesia, sementara alternatif penting dipertahankan dalam catatan kaki.
- source_word: δώσει ὑμῖν
  choice: Dia akan memberikan kepadamu
  rationale: Menerjemahkan verba futur dan objek tak langsung secara jelas; 'kamu' dipahami sebagai jamak dari konteks percakapan dengan para murid.
- source_word: ἵνα ᾖ
  choice: supaya Dia menyertai
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan. Dalam bahasa Indonesia, 'supaya' mempertahankan hubungan tujuan, dan 'menyertai' mengungkapkan kehadiran personal secara alami.
- source_word: μεθ’ ὑμῶν
  choice: menyertai kamu
  rationale: Secara harfiah berarti 'bersama kamu'. 'Menyertai kamu' merupakan padanan Indonesia yang alami dan tetap menekankan keberadaan bersama mereka.
- source_word: εἰς τὸν αἰῶνα
  choice: selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan keberlangsungan tanpa akhir dalam konteks Yohanes. 'Selama-lamanya' jelas, bermartabat, dan lazim dalam register Alkitab Indonesia.
theological_decisions:
- issue: Penerjemahan παράκλητος dalam konteks janji tentang Roh
  choice: Penolong
  alternative: Pembela, Penasihat, atau secara tradisional Penghibur
  rationale: '''Penolong'' mempertahankan pribadi dan fungsi yang luas tanpa membatasi istilah hanya pada ranah hukum, nasihat, atau penghiburan. Karena istilah Yunani ini kaya makna dan penting secara teologis, alternatifnya dicantumkan dalam catatan kaki.'
- issue: Hubungan 'yang lain' dengan Yesus
  choice: yang lain
  alternative: yang lain yang sejenis
  rationale: Teks hanya menyatakan ἄλλον. Terjemahan tidak menambahkan penjelasan ontologis 'yang sejenis', sehingga hubungan antara Yesus dan Penolong tetap hadir sebagai ketegangan kontekstual tanpa diuraikan melampaui ayat.
- issue: Daya ἵνα ᾖ
  choice: supaya Dia menyertai
  alternative: agar Dia akan menyertai
  rationale: '''Supaya'' mempertahankan nuansa tujuan dan tidak mengubah bentuk subjungtif menjadi pernyataan futur datar, meskipun janji tersebut tetap memiliki kepastian dalam konteksnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Aku', 'Dia', 'Bapa', dan 'Penolong' mengikuti rujukan personal dalam konteks ilahi. Bentuk 'kamu' secara morfologis tidak menandai jumlah dalam bahasa Indonesia, tetapi di sini merujuk kepada para murid secara jamak.
