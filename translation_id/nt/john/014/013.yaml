id: JHN.14.13
reference: John 14:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: id
  text: Apa pun yang kalian minta dalam nama-Ku, itu akan Kulakukan, supaya Bapa dimuliakan di dalam Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui Anak.” Bahasa Yunani berbunyi “di dalam Anak,” yang dapat menyatakan lingkup atau sarana yang melaluinya Bapa dimuliakan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: apa pun yang
  rationale: Konstruksi relatif tak tentu dengan ἄν menyatakan cakupan yang terbuka; “apa pun yang” alami dalam bahasa Indonesia dan mempertahankan keluasan maknanya.
- source_word: αἰτήσητε
  choice: kalian minta
  rationale: Bentuk ini adalah orang kedua jamak. “Kalian minta” menyampaikan jumlah jamak secara jelas dan memakai verba Indonesia yang lazim untuk konteks permohonan atau doa.
- source_word: ἐν τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Terjemahan langsung ini mempertahankan keluasan makna ungkapan Yohanes—termasuk perwakilan, kewenangan, hubungan, dan keselarasan dengan Yesus—tanpa membatasinya pada satu tafsiran.
- source_word: τοῦτο
  choice: itu
  rationale: Pronomina penunjuk yang eksplisit dipertahankan dan secara alami menunjuk kembali kepada apa pun yang diminta.
- source_word: ποιήσω
  choice: akan Kulakukan
  rationale: Ungkapan ini dekat dengan makna luas ποιέω dan mempertahankan subjek orang pertama yang ditekankan tanpa menambahkan penafsiran.
- source_word: ἵνα
  choice: supaya
  rationale: “Supaya” secara wajar menyampaikan hubungan tujuan yang diperkenalkan oleh ἵνα.
- source_word: δοξασθῇ
  choice: dimuliakan
  rationale: Bentuk pasif ini mempertahankan bahasa teologis tentang kemuliaan dan lebih tepat daripada ungkapan yang lebih lemah seperti “dihormati.”
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Teks Yunani menyebut “Bapa,” bukan “Bapa-Ku”; bentuk ini dipertahankan sebagai sebutan ilahi khas dalam Injil Yohanes.
- source_word: ἐν τῷ υἱῷ
  choice: di dalam Anak
  rationale: Pilihan ini mempertahankan ἐν secara langsung dan membiarkan terbuka apakah frasa tersebut terutama menyatakan lingkup, relasi, atau sarana pemuliaan Bapa.
theological_decisions:
- issue: Makna meminta “dalam nama-Ku”
  choice: Ungkapan “dalam nama-Ku” dipertahankan tanpa perluasan parafrastis.
  alternative: “berdasarkan kewenangan-Ku,” “dalam persatuan dengan-Ku,” atau “sesuai dengan sifat dan kehendak-Ku”
  rationale: Ungkapan ini memiliki beberapa lapisan makna dalam konteks Yohanes. Terjemahan langsung mempertahankan kekayaan tersebut dan tidak memasukkan satu penjelasan doktrinal ke dalam teks utama.
- issue: Makna ἐν τῷ υἱῷ
  choice: di dalam Anak
  alternative: melalui Anak
  rationale: Preposisi ἐν dapat menyatakan lingkup atau sarana. Karena teks Yunani tidak mengharuskan satu pemaknaan sempit, teks utama mempertahankan ungkapan yang lebih langsung dan catatan kaki mencantumkan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa αἰτήσητε berbentuk jamak. Kapitalisasi pada nama dan sebutan ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan setelah “Anak,” yaitu pada frasa yang diterangkannya.
