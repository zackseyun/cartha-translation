  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: id
  text: Namun sekarang kalian berusaha membunuh Aku, seorang manusia yang telah menyampaikan kepada kalian kebenaran yang Kudengar dari Allah. Abraham tidak melakukan hal itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Menjaga pertentangan yang dinyatakan oleh δέ sekaligus penekanan waktu pada νῦν dalam bahasa Indonesia yang alami.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: kalian berusaha membunuh Aku
  rationale: ζητέω dengan infinitif dapat berarti berusaha melakukan sesuatu; bentuk ini mempertahankan tindakan yang sedang berlangsung dan niat mereka tanpa menambahkan nuansa hukum yang tidak dinyatakan.
- source_word: ἄνθρωπον
  choice: seorang manusia
  rationale: Dalam konteks ini Yesus menyebut diri-Nya sebagai manusia. Pilihan ini alami dalam aposisi bahasa Indonesia dan mempertahankan penegasan kemanusiaan-Nya tanpa menyiratkan penyangkalan terhadap keilahian-Nya.
- source_word: τὴν ἀλήθειαν ὑμῖν λελάληκα
  choice: yang telah menyampaikan kepada kalian kebenaran
  rationale: Bentuk perfektum λελάληκα dinyatakan dengan 'telah' untuk menunjukkan perkataan yang sudah disampaikan dan tetap relevan; 'menyampaikan ... kebenaran' menghasilkan susunan Indonesia yang wajar.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: yang Kudengar dari Allah
  rationale: παρά dengan genitif menunjukkan sumber; 'dari Allah' tepat dan tidak mempersempitnya menjadi 'dari Bapa', yang tidak tertulis dalam ayat ini.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Abraham tidak melakukan hal itu
  rationale: Mempertahankan acuan terbuka τοῦτο dan kontras langsung dengan tindakan orang-orang yang hendak membunuh Yesus.
theological_decisions:
- issue: Sebutan ἄνθρωπον bagi Yesus
  choice: seorang manusia
  alternative: seorang laki-laki
  rationale: ἄνθρωπος di sini menegaskan bahwa Yesus adalah manusia. 'Seorang manusia' lebih wajar dalam konstruksi aposisional Indonesia dan tidak menghilangkan kenyataan bahwa pembicaranya laki-laki.
- issue: Sumber berita Yesus dalam παρὰ τοῦ θεοῦ
  choice: dari Allah
  alternative: dari Bapa
  rationale: Teks Yunani menyebut τοῦ θεοῦ, bukan 'Bapa'; terjemahan tidak menambahkan gelar teologis yang lebih khusus.
- issue: Acuan τοῦτο pada kalimat terakhir
  choice: hal itu
  alternative: bertindak demikian
  rationale: '''Hal itu'' menjaga keluasan acuan demonstratif Yunani, yang dapat menunjuk pada usaha membunuh Yesus atau keseluruhan perilaku yang baru disebutkan, tanpa menentukannya secara berlebihan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk ὑμῖν yang jamak agar jumlah penerima ujaran tetap jelas. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
