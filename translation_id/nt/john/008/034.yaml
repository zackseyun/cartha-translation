  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: id
  text: 'Yesus menjawab mereka, “Sesungguhnya, sesungguhnya Aku berkata kepada kalian: setiap orang yang berbuat dosa[a] adalah budak dosa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang terus berbuat dosa” atau, secara lebih harfiah, “yang melakukan dosa.” Bentuk Yunani dapat menunjuk pada tindakan yang berlangsung atau menjadi kebiasaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “hamba dosa.” Kata Yunani δοῦλος dapat berarti budak atau hamba; “budak” menonjolkan keadaan terikat dan berada di bawah kuasa dosa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Yesus menjawab mereka
  rationale: Mengikuti susunan yang wajar dalam bahasa Indonesia sambil mempertahankan bahwa jawaban Yesus ditujukan kepada mereka.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan khas dalam Injil Yohanes dan menyampaikan penegasan yang khidmat serta mudah dipahami.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Padanan yang dekat dan alami untuk rumusan pernyataan Yesus; bentuk -mu dapat merujuk kepada lawan bicara jamak menurut pemakaian bahasa Indonesia.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: setiap orang yang berbuat dosa
  rationale: Ungkapan generik ini alami dalam bahasa Indonesia dan dapat menyatakan perbuatan yang menjadi pola, tanpa menambahkan keterangan aspek yang lebih tegas daripada bentuk Yunani.
- source_word: δοῦλός ἐστιν τῆς ἁμαρτίας
  choice: adalah budak dosa
  rationale: “Budak” mempertahankan daya metafora δοῦλος sebagai keadaan terikat dan dikuasai, yang menjadi pokok argumen dalam konteks ini.
theological_decisions:
- issue: Apakah bentuk partisip kini menyatakan satu tindakan atau praktik yang berlangsung
  choice: yang berbuat dosa
  alternative: yang terus-menerus berbuat dosa; yang mempraktikkan dosa
  rationale: Bentuk Yunani dapat menggambarkan tindakan yang berlangsung atau berciri khas. Ungkapan Indonesia yang dipilih tetap bersifat umum dan tidak membatasi pernyataan pada satu tindakan terisolasi, tetapi juga tidak menambahkan kata “terus-menerus” yang dapat terdengar mutlak.
- issue: Kekuatan metafora δοῦλος
  choice: budak dosa
  alternative: hamba dosa
  rationale: “Budak” secara lebih jelas menyatakan keterikatan dan penguasaan oleh dosa. “Hamba” dimungkinkan secara leksikal, tetapi dalam bahasa Indonesia modern dapat terdengar lebih sukarela atau terhormat.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan lugas. Pengulangan “Sesungguhnya, sesungguhnya” dipertahankan sebagai ciri khas ucapan Yesus dalam Injil Yohanes. Tanda titik dua dipakai untuk memperkenalkan isi pernyataan dengan jelas.
