base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: id
  text: Karena itu, Aku berkata kepada kalian bahwa kalian akan mati dalam dosa-dosa kalian. Sebab, jika kalian tidak percaya bahwa Akulah dia[a], kalian akan mati dalam dosa-dosa kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “bahwa Aku adalah,” tanpa predikat yang dinyatakan. Ungkapan Yunani ini mungkin memiliki gaung yang lebih dalam dalam Injil Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Karena itu, Aku berkata kepada kalian
  rationale: οὖν menghubungkan pernyataan ini sebagai kesimpulan dari konteks sebelumnya, sehingga diterjemahkan secara wajar dengan “Karena itu”. Bentuk aoristus εἶπον diterjemahkan dengan “berkata”, sedangkan ὑμῖν yang berbentuk jamak dinyatakan secara jelas melalui “kepada kalian”.
- source_word: ἀποθανεῖσθε
  choice: kalian akan mati
  rationale: Bentuk futurum ini secara langsung menyatakan kematian; “mati” tidak menambahkan nuansa tafsiran seperti “binasa”.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: dalam dosa-dosa kalian
  rationale: '“Dosa-dosa” mempertahankan bentuk jamak ἁμαρτίαις, sementara “dalam” menyampaikan keadaan atau ranah: mereka mati dengan tetap berada dalam dosa-dosa mereka.'
- source_word: ἐὰν γὰρ μὴ
  choice: Sebab, jika ... tidak
  rationale: γάρ memberikan alasan bagi pernyataan sebelumnya, sedangkan ἐὰν μή memperkenalkan syarat negatif. Susunan ini alami dalam bahasa Indonesia dan mempertahankan kedua fungsi tersebut.
- source_word: πιστεύσητε
  choice: kalian ... percaya
  rationale: “Percaya” merupakan padanan langsung dan lazim bagi πιστεύω dalam Injil Yohanes, tanpa meniadakan nuansa kepercayaan atau penyerahan diri yang dapat dikandungnya.
- source_word: ὅτι ἐγώ εἰμι
  choice: bahwa Akulah Dia
  rationale: Bahasa Yunani tidak menyebutkan predikat setelah ἐγώ εἰμι. “Akulah Dia” merupakan ungkapan identifikasi yang alami dalam bahasa Indonesia, sedangkan bentuk yang lebih harfiah dan kemungkinan gaung yang lebih dalam dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan ungkapan Yohanes ἐγώ εἰμι tanpa predikat yang dinyatakan
  choice: Akulah Dia
  alternative: Aku ada
  rationale: “Akulah Dia” memungkinkan pembacaan sebagai identifikasi diri yang sesuai dengan konteks, tetapi bahasa Yunani secara harfiah hanya berbunyi “Aku ada”. Catatan kaki mempertahankan bentuk mutlak itu dan kemungkinan gaung pewahyuan diri tanpa menetapkan satu tafsiran teologis sebagai satu-satunya makna.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa semua kata ganti orang kedua dalam ayat ini berbentuk jamak. Pengulangan “kalian akan mati dalam dosa-dosa kalian” dipertahankan sesuai penekanan teks sumber.
