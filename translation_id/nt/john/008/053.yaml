  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: id
  text: Kamu tentu tidak lebih besar daripada Abraham, leluhur kami, yang sudah mati, bukan?[a] Para nabi juga sudah mati. Kamu menganggap dirimu siapa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bukankah kamu lebih besar daripada Abraham, leluhur kami, yang sudah mati?” Pertanyaan dalam bahasa Yunani ini dirumuskan dengan mengharapkan jawaban negatif.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Kamu menjadikan dirimu siapa?” Maksudnya ialah “Kamu menganggap dirimu siapa?” atau “Kamu mengaku sebagai siapa?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Tentunya kamu tidak ... bukan?
  rationale: μή memperkenalkan pertanyaan yang mengharapkan jawaban negatif. Bentuk ini menyampaikan daya retoris dan nada menantang secara alami dalam bahasa Indonesia.
- source_word: μείζων
  choice: lebih besar
  rationale: Komparatif ini dibiarkan luas, mencakup kedudukan dan keutamaan tanpa mempersempit maknanya menjadi sekadar lebih penting atau lebih unggul.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: daripada Abraham, bapak leluhur kami
  rationale: Genitif sesudah komparatif diterjemahkan dengan 'daripada'. 'Bapak leluhur' mengungkapkan hubungan Abraham sebagai nenek moyang yang dihormati, tanpa memberi kesan bahwa ia ayah langsung para penutur.
- source_word: ὅστις ἀπέθανεν
  choice: yang telah mati
  rationale: Aoristus menunjuk kepada fakta historis kematian Abraham. 'Telah mati' alami dalam argumen ini dan menghubungkan fakta lampau itu dengan tantangan yang sedang diajukan.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Para nabi juga telah mati
  rationale: 'καί menambahkan contoh sejajar: bukan hanya Abraham, melainkan para nabi pun mengalami kematian.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Kamu menganggap dirimu siapa?
  rationale: Ungkapan idiomatis ini menantang identitas atau kedudukan yang diklaim seseorang. Pilihan ini alami, ringkas, dan mempertahankan nada menuduh.
theological_decisions:
- issue: Tantangan retoris mengenai kedudukan Yesus dibandingkan dengan Abraham dan para nabi
  choice: Pertanyaan pertama dirumuskan sebagai penyangkalan retoris yang mengharapkan jawaban negatif.
  alternative: Apakah kamu lebih besar daripada Abraham, bapak leluhur kami?
  rationale: μή menandai harapan akan jawaban negatif. Terjemahan mempertahankan ketegangan mengenai identitas dan kewibawaan Yesus tanpa menjawab atau menyelesaikannya dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada konfrontatif yang tetap bermartabat. Pronomina 'kamu' dipakai karena para penutur sedang menyapa satu orang secara langsung; 'bapak leluhur' dipilih untuk memperjelas πατήρ sebagai sebutan bagi nenek moyang yang dihormati.
