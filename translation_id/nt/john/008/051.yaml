  source_fidelity: 'Secara umum draf mengikuti teks Yunani dengan baik: pengulangan ἀμὴν, metafora ‘melihat kematian’, dan penyangkalan kuat οὐ μὴ dipertahankan. Namun, ‘menuruti’ lebih sempit dan terutama bernuansa mematuhi instruksi; τηρέω dalam konstruksi ini lebih luas, yakni menjaga atau memegang teguh perkataan Yesus.'
  naturalness: Kalimatnya jelas dan berregister khidmat. ‘Tidak akan melihat kematian untuk selama-lamanya’ dapat dipahami, tetapi ‘tidak akan pernah melihat kematian’ lebih idiomatis dalam bahasa Indonesia modern serta menyampaikan gabungan penyangkalan tegas dan durasi tanpa batas.
  terminology: ‘Sesungguhnya, sesungguhnya’, ‘perkataan-Ku’, dan ‘melihat kematian’ tepat serta tidak menafsirkan jenis ‘kematian’. ‘Memegang teguh perkataan-Ku’ lebih sesuai untuk τηρήσῃ daripada ‘menuruti perkataan-Ku’.
