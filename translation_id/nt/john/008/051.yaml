  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: id
  text: '“Sesungguhnya, sesungguhnya, Aku berkata kepadamu: jika seseorang memegang teguh perkataan-Ku, ia tidak akan pernah melihat kematian.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang khidmat dan tegas dalam ucapan Yesus.
- source_word: τηρήσῃ
  choice: menuruti
  rationale: Dalam konteks perkataan atau ajaran, kata ini menyatakan memegang teguh dengan menaati, bukan sekadar menyimpan atau mengingat.
- source_word: τὸν ἐμὸν λόγον
  choice: perkataan-Ku
  rationale: Bentuk tunggal λόγον di sini menunjuk pada pesan atau ajaran Yesus sebagai satu kesatuan; “perkataan-Ku” alami dan tetap dekat dengan bentuk sumber.
- source_word: θάνατον ... θεωρήσῃ
  choice: melihat kematian
  rationale: Mempertahankan metafora sumber, yang berarti mengalami kematian tetapi tidak perlu dijelaskan di dalam teks utama.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: sama sekali tidak akan ... untuk selama-lamanya
  rationale: οὐ μή memberi penyangkalan yang sangat tegas, sedangkan εἰς τὸν αἰῶνα menyatakan kesinambungan tanpa batas; keduanya dipertahankan tanpa meleburkan tekanannya.
theological_decisions:
- issue: Makna janji bahwa orang yang menuruti perkataan Yesus tidak akan melihat kematian untuk selama-lamanya
  choice: Mempertahankan ungkapan paradoksal Yesus secara langsung
  alternative: Menjelaskannya sebagai tidak mengalami kematian rohani atau kematian kekal
  rationale: Teks sumber tidak secara eksplisit menentukan jenis kematian dalam ayat ini. Terjemahan tidak boleh menyelesaikan ketegangan teologis yang sengaja dibiarkan oleh ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Pengulangan “Sesungguhnya” serta metafora “melihat kematian” dipertahankan; konstruksi penyangkalan dibuat tegas sesuai bahasa Yunani.
