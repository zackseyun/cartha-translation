  - severity: low
    issue: Konstruksi ‘sama sekali tidak akan melihat kematian untuk selama-lamanya’ kurang idiomatis.
    rationale: ‘Tidak akan pernah melihat kematian’ merupakan ungkapan modern yang alami dan menyampaikan penyangkalan mutlak yang berkelanjutan dari οὐ μὴ ... εἰς τὸν αἰῶνα.
