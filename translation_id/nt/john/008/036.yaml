  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: id
  text: Karena itu, jika Anak memerdekakan kalian, kalian akan benar-benar merdeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sungguh-sungguh merdeka” atau “merdeka dalam arti yang sebenarnya.” Kata keterangan Yunani menegaskan bahwa kemerdekaan itu nyata dan sejati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Karena itu, jika
  rationale: ἐὰν menyatakan syarat, sedangkan οὖν menarik kesimpulan dari pembahasan sebelumnya. Ungkapan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: ὁ υἱὸς
  choice: Anak
  rationale: Dengan kata sandang dan dalam konteks Injil Yohanes, ungkapan ini merupakan gelar kristologis yang menunjuk kepada Yesus. Huruf kapital menandai pemakaian sebagai gelar tanpa menambahkan penafsiran lain.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Kata ganti Yunani ini berbentuk orang kedua jamak. “Kalian” menyatakan kejamakan itu secara jelas dalam bahasa Indonesia modern.
- source_word: ἐλευθερώσῃ
  choice: memerdekakan
  rationale: Kata kerja ini berarti menjadikan seseorang bebas. “Memerdekakan” alami dalam konteks pertentangan dengan perbudakan dan mempertahankan hubungan leksikal dengan “merdeka” pada klausa berikutnya.
- source_word: ὄντως
  choice: benar-benar
  rationale: Kata keterangan ini menegaskan kenyataan atau kesejatian keadaan bebas tersebut. “Benar-benar” menyampaikan tekanan itu secara alami.
- source_word: ἐλεύθεροι
  choice: merdeka
  rationale: Ini adalah kata sifat predikatif yang menggambarkan keadaan yang dihasilkan, bukan hanya tindakan pembebasan. “Merdeka” juga mempertahankan kaitannya dengan “memerdekakan”.
- source_word: ἔσεσθε
  choice: akan ...
  rationale: Bentuk futurum dari εἰμί menyatakan keadaan yang akan berlaku; dalam susunan Indonesia, maknanya diungkapkan dengan “akan benar-benar merdeka” tanpa kopula tersurat.
theological_decisions:
- issue: Identitas “Anak”
  choice: Gelar kristologis yang menunjuk secara khusus kepada Yesus
  alternative: Seorang anak dalam arti umum
  rationale: Dalam konteks Yohanes 8, “Anak” adalah bagian dari pernyataan Yesus mengenai kedudukan dalam rumah dan kewenangan untuk memerdekakan. Terjemahan mempertahankannya sebagai gelar tanpa memperluas uraian doktrinal di dalam ayat.
- issue: Sifat kemerdekaan yang dimaksud
  choice: Kemerdekaan yang nyata atau sejati, tanpa mempersempit cakupannya dalam terjemahan
  alternative: Hanya kemerdekaan rohani, hanya kemerdekaan batin, atau hanya kemerdekaan sosial-politik
  rationale: Konteks langsung membicarakan perbudakan oleh dosa, tetapi ayat ini sendiri menyatakan hasilnya secara luas. “Benar-benar merdeka” menjaga bobot pernyataan tersebut tanpa memasukkan pembatasan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk jamak Yunani secara terbuka; “memerdekakan” dan “merdeka” mempertahankan permainan akar kata sumber.
