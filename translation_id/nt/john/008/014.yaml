id: JHN.8.14
reference: John 8:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepada mereka, “Sekalipun Aku bersaksi[a] tentang diri-Ku sendiri, kesaksian-Ku benar, sebab Aku tahu dari mana Aku datang dan ke mana Aku pergi. Namun, kamu tidak tahu dari mana Aku datang atau ke mana Aku pergi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi kesaksian.”
    reason: lexical_alternative
  - marker: b
    text: Sebagian naskah berbunyi “dan ke mana Aku pergi”, bukan “atau ke mana Aku pergi”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: menjawab dan berkata
  rationale: Mempertahankan pasangan verba khas narasi Yohanes tanpa meleburkannya, sekalipun ungkapan ini sedikit lebih formal daripada percakapan Indonesia sehari-hari.
- source_word: Κἂν
  choice: Sekalipun
  rationale: 'Menyampaikan daya konsesif konstruksi Yunani: Yesus menerima kemungkinan itu sebagai dasar argumen tanpa mengakui bahwa kesaksian-Nya tidak benar.'
- source_word: μαρτυρῶ
  choice: bersaksi
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan nuansa saksi atau kesaksian yang penting dalam Injil Yohanes.
- source_word: περὶ ἐμαυτοῦ
  choice: tentang diri-Ku sendiri
  rationale: Menerjemahkan περί dengan lugas tanpa menambahkan nuansa hukum ‘demi membela diri’ yang tidak dinyatakan secara eksplisit.
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: kesaksian-Ku benar
  rationale: ‘Benar’ mempertahankan cakupan makna ἀληθής dan tidak mempersempitnya menjadi sekadar sah secara hukum.
- source_word: ὅτι οἶδα
  choice: sebab Aku tahu
  rationale: 'Menunjukkan hubungan sebab: pengetahuan Yesus tentang asal dan tujuan-Nya menjadi alasan yang diberikan bagi kebenaran kesaksian-Nya.'
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: dari mana Aku datang dan ke mana Aku pergi
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan perbedaan antara asal dan tujuan, tanpa memaksakan penandaan kala yang tidak dimiliki verba Indonesia.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: Namun, kamu tidak tahu
  rationale: ‘Namun’ menyatakan kontras, sedangkan ‘kamu’ mempertahankan penekanan dari pronomina Yunani yang disebutkan secara eksplisit.
theological_decisions:
- issue: Dasar kebenaran kesaksian Yesus tentang diri-Nya
  choice: Pernyataan diterjemahkan sebagai kesaksian yang ‘benar’ karena Yesus mengetahui asal dan tujuan-Nya.
  alternative: Menerjemahkannya secara lebih sempit sebagai kesaksian yang ‘sah’ secara hukum, atau memperjelas asal surgawi-Nya langsung di dalam ayat.
  rationale: ἀληθής secara langsung berarti ‘benar’, dan ayat ini sendiri menyebut pengetahuan Yesus tentang asal serta tujuan-Nya. Terjemahan tidak menambahkan rumusan metafisis atau hukum yang lebih khusus daripada bunyi teks, sehingga kaitan teologis yang lebih luas tetap muncul dari konteks Injil Yohanes.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘menjawab dan berkata’ sengaja dipertahankan untuk mencerminkan struktur narasi Yunani. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia dan tidak menambahkan isi pada teks.
