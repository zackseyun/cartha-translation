  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: id
  text: Lalu ia berkata lagi kepada mereka, “Aku pergi, dan kalian akan mencari Aku[a], dan kalian akan mati dalam dosa kalian[b]. Ke tempat Aku pergi, kalian tidak dapat datang[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mencari-cari Aku”. Kata ini dapat berarti mencari seseorang dan, dalam Injil Yohanes, mungkin juga mengandung makna rohani yang lebih dalam.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Yunani memakai bentuk tunggal: “dalam dosa kalian”. Sebagian terjemahan memakai “dalam dosa-dosa kalian”, tetapi bentuk tunggal dapat menekankan keadaan berdosa yang terus berlangsung, bukan hanya tindakan-tindakan tertentu.'
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “kalian tidak mampu datang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat konsekuensial dari percakapan sebelumnya tanpa menjadikannya kesimpulan yang terlalu tegas.
- source_word: πάλιν
  choice: lagi
  rationale: Padanan alami untuk adverbia yang menyatakan pengulangan.
- source_word: ὑπάγω
  choice: akan pergi
  rationale: Dalam konteks Yohanes, verba ini menunjuk pada kepergian Yesus dan dapat mengandung makna yang lebih dalam. Bentuk ini alami dalam bahasa Indonesia dan tidak menentukan tujuan kepergian itu secara eksplisit.
- source_word: ζητήσετέ με
  choice: kalian akan mencari aku
  rationale: “Mencari” mencakup pencarian secara harfiah dan tetap membuka kemungkinan makna rohani yang lebih dalam dalam Injil Yohanes.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: dalam dosa kalian
  rationale: Mempertahankan preposisi dan bentuk tunggal “dosa”, sementara “kalian” memperjelas bahwa kata ganti Yunani ditujukan kepada lebih dari satu orang.
- source_word: ἀποθανεῖσθε
  choice: kalian akan mati
  rationale: Padanan langsung dan alami bagi bentuk futurum Yunani.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Ke tempat aku pergi
  rationale: Mengungkapkan makna lokatif ὅπου secara alami dan mempertahankan pengulangan verba “pergi” tanpa menambahkan penafsiran tentang tujuannya.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: kalian tidak dapat datang
  rationale: Mempertahankan unsur ketidakmampuan dalam δύνασθε dengan susunan yang wajar dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk tunggal ἁμαρτίᾳ dibandingkan bentuk jamak yang lebih lazim dalam sebagian terjemahan
  choice: dalam dosa kalian
  alternative: dalam dosa-dosa kalian
  rationale: Teks Yunani memakai bentuk tunggal. Mempertahankannya membiarkan “dosa” menunjuk pada suatu keadaan yang berkelanjutan tanpa membatasi artinya hanya pada sejumlah tindakan tertentu.
- issue: Cakupan makna kepergian Yesus dalam ὑπάγω
  choice: Aku akan pergi
  alternative: Aku akan pergi meninggalkan kalian
  rationale: Dalam Yohanes, kepergian Yesus dapat menunjuk melampaui perpindahan biasa kepada kematian, kebangkitan, dan kepulangan-Nya kepada Bapa. Teks utama tidak mengeksplisitkan rangkaian penafsiran itu.
- issue: Sifat ketidakmampuan dalam οὐ δύνασθε ἐλθεῖν
  choice: kalian tidak dapat datang
  alternative: kalian tidak bisa datang
  rationale: Terjemahan mempertahankan pernyataan ketidakmampuan tanpa menentukan dalam teks utama apakah penyebabnya terutama bersifat moral, rohani, atau terkait tujuan kepergian Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa semua kata ganti orang kedua dalam bahasa Yunani berbentuk jamak. Kata ganti ilahi tidak diberi kapitalisasi khusus agar mengikuti kaidah umum bahasa Indonesia dan tidak memasukkan konvensi denominasi ke dalam teks.
