id: JHN.8.47
reference: John 8:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: id
  text: Orang yang berasal dari Allah mendengarkan firman Allah. Itulah sebabnya kalian tidak mendengarkan, karena kalian tidak berasal dari Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ὅτι juga dapat berarti “bahwa”, sehingga bagian akhir dapat dibaca, “kalian tidak mendengarkan bahwa kalian tidak berasal dari Allah.” Namun, arti kausal “karena” lebih sesuai dengan konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: Orang yang
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk pada satu golongan orang; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan daya representatif bentuk tunggalnya.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: ἐκ menyatakan sumber atau asal. Pilihan ini lebih jelas daripada sekadar 'dari Allah' dan tidak mempersempit ungkapan tersebut menjadi kategori doktrinal tertentu.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: firman-firman Allah
  rationale: ῥήματα berbentuk jamak dan menunjuk pada perkataan-perkataan Allah. 'Firman-firman' mempertahankan bentuk jamak serta ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: ἀκούει / ἀκούετε
  choice: mendengarkan / mendengarkan
  rationale: Dalam konteks ini ἀκούω mencakup penerimaan yang sungguh-sungguh, bukan sekadar menangkap bunyi. 'Mendengarkan' mempertahankan pengulangan verba tanpa menafsirkannya langsung sebagai 'menaati'.
- source_word: διὰ τοῦτο
  choice: Itulah sebabnya
  rationale: Ungkapan ini menyatakan alasan atau penjelasan dan diterjemahkan secara alami dalam bahasa Indonesia modern.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina Yunani berbentuk jamak dan eksplisit. 'Kalian' menyampaikan jumlah jamak serta pembedaan dari bentuk tunggal secara jelas.
- source_word: ὅτι
  choice: karena
  rationale: 'Nilai kausal paling sesuai dengan alur argumen: mereka tidak mendengarkan karena mereka tidak berasal dari Allah. Kemungkinan nilai deklaratif tetap dicatat dalam catatan kaki.'
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: kalian tidak berasal dari Allah
  rationale: Terjemahan ini mempertahankan bahasa sumber/asal dari ἐκ dan kontras Yohanes tanpa mengubahnya menjadi rumusan teologis yang lebih khusus.
theological_decisions:
- issue: Makna 'berasal dari Allah' dalam konteks Yohanes
  choice: 'Mempertahankan bahasa sumber atau asal: ''berasal dari Allah''.'
  alternative: milik Allah; dilahirkan dari Allah dalam arti keselamatan yang lebih sempit
  rationale: Ayat ini tidak secara eksplisit menentukan satu kategori sistematika seperti pemilihan, kelahiran baru, atau keanggotaan perjanjian. Terjemahan mempertahankan ketegangan teologis ungkapan Yohanes.
- issue: Daya makna ἀκούω
  choice: mendengarkan
  alternative: mendengar; menaati
  rationale: Konteks mengisyaratkan penerimaan atau tanggapan, tetapi verba itu tidak secara eksplisit berarti 'menaati'. 'Mendengarkan' menyampaikan perhatian reseptif tanpa menyelesaikan implikasinya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai jamak pada ὑμεῖς; 'firman-firman' mempertahankan bentuk jamak ῥήματα. Penanda catatan kaki ditempatkan pada akhir kalimat yang memuat ambiguitas ὅτι.
