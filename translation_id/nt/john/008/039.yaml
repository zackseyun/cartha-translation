  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: id
  text: Mereka menjawab dan berkata kepada-Nya, “Abraham adalah bapa kami.” Yesus berkata kepada mereka, “Seandainya kalian anak-anak Abraham, kalian tentu akan melakukan perbuatan-perbuatan Abraham.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jika kalian adalah anak-anak Abraham, kalian tentu melakukan perbuatan-perbuatan Abraham.” Verba Yunani pada klausa kedua berbentuk imperfek dan dapat menyiratkan keadaan yang berlawanan dengan kenyataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Mereka menjawab dan berkata kepada-Nya
  rationale: Mempertahankan rumusan dua verba khas narasi Yohanes tanpa menghilangkan unsur menjawab maupun berkata. Bentuk ini tetap jelas dalam bahasa Indonesia yang bermartabat.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Abraham adalah bapa kami
  rationale: Mempertahankan sebutan kekerabatan πατήρ secara langsung dan menyampaikan dengan wajar klaim mereka tentang hubungan dengan Abraham.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesus berkata kepada mereka
  rationale: Kala kini historis Yunani dialihkan ke bentuk naratif Indonesia yang netral; bahasa Indonesia tidak menandai kala verba, sehingga kejelasan alur tetap terjaga tanpa kehilangan daya langsung tuturan.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: anak-anak Abraham
  rationale: τέκνα mencakup laki-laki dan perempuan serta menekankan hubungan sebagai anak; terjemahan ini mempertahankan bahasa relasional sumber.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: perbuatan-perbuatan Abraham
  rationale: ἔργα di sini menunjuk pada tindakan nyata. Bentuk ulang menyampaikan nomina jamak dan mempertahankan kontras antara pengakuan keturunan dan perilaku.
- source_word: ἐποιεῖτε
  choice: tentu kalian melakukan
  rationale: Imperfek indikatif dalam konstruksi bersyarat ini memberi nuansa akibat yang semestinya berlaku tetapi bertentangan dengan kenyataan. Kata 'tentu' menyampaikan daya implikasinya tanpa membuat bahasa Indonesia kaku; ambiguitas struktur dijelaskan dalam catatan.
theological_decisions:
- issue: Hakikat status sebagai anak-anak Abraham
  choice: Bahasa hubungan keluarga dipertahankan secara harfiah dan dipertentangkan dengan perbuatan, sebagaimana dalam ayat.
  alternative: Menafsirkan ucapan Yesus sebagai penyangkalan mutlak terhadap keturunan jasmani atau sebagai pernyataan yang semata-mata mengenai status rohani.
  rationale: Ayat ini mengontraskan klaim bahwa Abraham adalah bapa mereka dengan kegagalan melakukan perbuatan Abraham. Terjemahan tidak memaksakan sistem teologis yang melampaui pernyataan ayat.
- issue: Daya syarat pada Εἰ ... ἐστε ... ἐποιεῖτε
  choice: Jika kalian anak-anak Abraham, tentu kalian melakukan ...
  alternative: Jika kalian benar-benar anak-anak Abraham, kalian akan melakukan ...
  rationale: Pilihan utama mempertahankan bentuk protasis kala kini sekaligus memberi ruang bagi daya kontrafaktual dari imperfek pada klausa akibat. Alternatif dicatat karena konstruksi Yunani dapat dipahami lebih tegas sebagai keadaan yang berlawanan dengan kenyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak ὑμεῖς dinyatakan dengan “kalian” agar jelas bahwa Yesus berbicara kepada sekelompok orang; “bapa” dipakai untuk mempertahankan metafora kekerabatan dan nuansa teks Alkitab tanpa menambahkan istilah teologis. Pronomina yang merujuk kepada Yesus ditulis dengan kapital mengikuti kelaziman editorial Alkitab bahasa Indonesia.
