  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: id
  text: Budak[a] tidak tetap tinggal dalam rumah tangga selama-lamanya; anak laki-laki[b] tetap tinggal selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hamba”; kata Yunani doulos dapat memiliki kedua nuansa itu, tetapi “budak” lebih jelas mempertahankan kontras status dalam rumah tangga ini.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks sekitarnya, “anak laki-laki” juga mungkin secara tersirat menunjuk kepada Yesus, meskipun perkataan ini berbentuk seperti peribahasa umum.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: budak
  rationale: Kata ini menunjuk pada orang yang berstatus tidak merdeka. “Budak” mempertahankan kontras status dengan anak dalam rumah tangga; “hamba” dapat terdengar sekadar sebagai pelayan sukarela.
- source_word: μένει
  choice: tinggal
  rationale: Dipakai pada kedua klausa untuk mempertahankan pengulangan Yunani dan menyampaikan keberadaan yang terus berlangsung dalam rumah tangga.
- source_word: οἰκία
  choice: rumah tangga
  rationale: Dalam peribahasa ini yang disoroti ialah kedudukan dan keberlangsungan seseorang di dalam lingkup keluarga, bukan hanya keberadaan di sebuah bangunan.
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk durasi tanpa akhir dan diulang pada kedua klausa sebagaimana dalam sumber.
- source_word: υἱός
  choice: anak
  rationale: Dalam konteks rumah tangga, “anak” secara alami menyatakan hubungan keluarga dan mempertahankan kemungkinan gema kristologis tanpa menjadikannya gelar secara eksplisit.
- source_word: δέ
  choice: tidak dinyatakan dengan kata penghubung tersendiri
  rationale: Daya kontras ringan δέ sudah tampak melalui susunan budak–anak dan tanda titik koma; penambahan “tetapi” pada awal ayat akan terasa lebih adversatif daripada sumber.
theological_decisions:
- issue: Kemungkinan gema kristologis pada ὁ υἱός
  choice: “seorang anak” dengan huruf kecil
  alternative: “Sang Anak”
  rationale: Ucapan ini berbentuk pernyataan umum tentang kedudukan dalam rumah tangga, tetapi dalam konteks berikutnya juga dapat menunjuk secara tersirat kepada Yesus. Bentuk huruf kecil mempertahankan kedua kemungkinan tanpa mengubahnya menjadi gelar kristologis yang eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rumah tangga” dipilih untuk menonjolkan lingkup keluarga serta status di dalamnya. Struktur paralel dan pengulangan “tinggal” serta “untuk selama-lamanya” dipertahankan.
