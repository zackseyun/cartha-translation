id: JHN.8.27
reference: John 8:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: id
  text: Mereka tidak mengerti bahwa Ia sedang berbicara kepada mereka tentang Bapa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka tidak tahu bahwa Ia sedang berbicara kepada mereka tentang Bapa.”
    reason: 'Alternatif leksikal: γινώσκω dapat berarti “tahu”, meskipun konteks mendukung makna “mengerti”.'
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Mereka tidak mengerti
  rationale: Dalam konteks ini, γινώσκω menyatakan kegagalan menangkap maksud atau rujukan perkataan Yesus. “Tidak mengerti” menyampaikan makna kontekstual itu secara alami, sementara “tidak tahu” tetap dicatat sebagai kemungkinan leksikal.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι memperkenalkan isi dari apa yang tidak mereka mengerti; “bahwa” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Dalam konteks Injil Yohanes, sebutan ini merujuk kepada Allah sebagai Bapa Yesus. Huruf kapital menunjukkan rujukan tersebut tanpa menambahkan penjelasan teologis ke dalam teks.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Bentuk datif bersama λέγω secara alami menyatakan pihak yang diajak bicara.
- source_word: ἔλεγεν
  choice: sedang berbicara
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung. “Sedang berbicara” mempertahankan aspek imperfektif itu dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Rujukan sebutan “Bapa”
  choice: Bapa merujuk kepada Allah, Bapa Yesus.
  alternative: Seorang ayah manusia.
  rationale: Konteks langsung Injil Yohanes berulang kali memakai “Bapa” sebagai sebutan Yesus bagi Allah. Kapitalisasi mencerminkan identifikasi kontekstual tersebut tanpa memasukkan rumusan doktrinal tambahan.
- issue: Makna γινώσκω dalam konteks
  choice: Diterjemahkan “mengerti”.
  alternative: “Tahu” atau “mengenali”.
  rationale: Ayat ini menyoroti kegagalan para pendengar menangkap siapa yang dimaksud Yesus. “Mengerti” menyampaikan fungsi kontekstual itu, sedangkan “tahu” dipertahankan dalam catatan kaki sebagai alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Ia” dipakai sebagai pronomina orang ketiga yang bermartabat dan alami; susunan kalimat mempertahankan tindakan yang sedang berlangsung serta tidak memperjelas lebih jauh daripada teks Yunani.
