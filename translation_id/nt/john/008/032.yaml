  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: id
  text: Dan kamu akan mengenal kebenaran[a], dan kebenaran itu akan memerdekakan kamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kamu akan mulai mengenal kebenaran.”
    reason: lexical_alternative
  - marker: b
    text: Ayat ini sendiri tidak menyebutkan jenis kebebasan yang dimaksud; konteks sesudahnya menghubungkannya dengan kebebasan dari dosa.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: akan mengenal
  rationale: Bentuk futur dari γινώσκω. Dalam konteks ini, «mengenal» secara alami dapat mencakup proses sampai pada pengenalan, tanpa menambahkan penafsiran yang tidak dinyatakan secara eksplisit.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: kebenaran / kebenaran itu
  rationale: 'Artikel Yunani dipertahankan secara idiomatis: penyebutan pertama memperkenalkan «kebenaran», sedangkan «kebenaran itu» pada penyebutan kedua menjaga kekhususan dan pengulangan retoris.'
- source_word: ἐλευθερώσει
  choice: akan memerdekakan
  rationale: Kata kerja ἐλευθερόω menyatakan tindakan menjadikan bebas. «Memerdekakan» ringkas, wajar, dan tidak menentukan jenis kebebasan di dalam teks utama.
- source_word: ὑμᾶς
  choice: kamu
  rationale: Pronomina ini adalah orang kedua jamak. Bahasa Indonesia baku lazim memakai «kamu» tanpa penanda jamak tambahan bila konteksnya jelas; «kalian» akan lebih eksplisit tetapi kurang netral dalam register ini.
- source_word: καὶ ... καὶ
  choice: dan ... dan
  rationale: Kedua konjungsi dipertahankan untuk menjaga susunan koordinatif, alur logis, dan irama kalimat Yunani.
theological_decisions:
- issue: Sifat kebebasan dalam «kebenaran itu akan memerdekakan kamu»
  choice: Tidak menentukan dalam teks utama apakah kebebasan itu bersifat politik, psikologis, atau secara khusus rohani.
  alternative: «kebenaran itu akan memerdekakan kamu dari dosa»
  rationale: Ayat ini sendiri tidak menyebutkan sumber perbudakan. Konteks berikutnya menghubungkannya dengan dosa, sehingga hubungan itu dijelaskan dalam catatan tanpa dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register yang lugas dan bermartabat. Pengulangan «kebenaran» serta dua konjungsi dipertahankan. Penanda catatan ditempatkan pada klausa yang diterangkannya.
