lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: membawa
  rationale: Bentuk kini historis Yunani dinyatakan dengan bentuk naratif Indonesia yang alami; konteks menunjukkan bahwa mereka membawa perempuan itu kepada Yesus.
- source_word: γραμματεῖς
  choice: ahli Taurat
  rationale: Padanan Indonesia yang lazim dan jelas bagi kelompok pakar serta pengajar hukum Taurat.
- source_word: ἐν μοιχείᾳ κατειλημμένην (καταλαμβάνω)
  choice: yang kedapatan berzina
  rationale: Partisip perfek pasif menunjukkan perempuan itu telah didapati dalam perbuatan zina; ungkapan ini alami dalam bahasa Indonesia tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: στήσαντες (ἵστημι)
  choice: menyuruh ... berdiri
  rationale: Partisip aoris aktif menggambarkan tindakan sengaja menempatkan perempuan itu dalam posisi berdiri di hadapan orang banyak.
- source_word: ἐν μέσῳ (μέσος)
  choice: di tengah-tengah
  rationale: Menyatakan posisi perempuan itu di tengah kelompok yang hadir dan mempertahankan gambaran spasial teks Yunani.
