  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: id
  text: Akulah yang bersaksi tentang diri-Ku sendiri, dan Bapa yang mengutus Aku juga bersaksi tentang Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memberi kesaksian tentang diri-Ku sendiri ... memberi kesaksian tentang Aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Akulah yang bersaksi
  rationale: Konstruksi ἐγώ εἰμι dengan partisipel berartikel menegaskan bahwa Yesus adalah pribadi yang memberi kesaksian. Bentuk “Akulah yang” alami dalam bahasa Indonesia dan mempertahankan penekanan subjek.
- source_word: μαρτυρῶν / μαρτυρεῖ
  choice: bersaksi
  rationale: “Bersaksi” merupakan padanan modern yang jelas bagi μαρτυρέω dan mempertahankan nuansa kesaksian hukum serta pengulangan istilah dalam kedua klausa.
- source_word: περὶ ἐμαυτοῦ
  choice: tentang diri-Ku sendiri
  rationale: περί dengan genetif berarti “tentang/mengenai”; bentuk refleksif ἐμαυτοῦ dipertahankan secara eksplisit tanpa mempersempitnya menjadi “demi kepentingan-Ku”.
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: Terjemahan ini mengikuti arti langsung περί dengan genetif dan mempertahankan kesejajaran dengan “tentang diri-Ku sendiri”.
- source_word: ὁ πέμψας με πατήρ
  choice: Bapa yang mengutus Aku
  rationale: Partisipel aoris berartikel menerangkan πατήρ dan secara alami diterjemahkan dengan klausa relatif. Kata “Bapa-Ku” tidak ditambahkan karena unsur posesif tidak dinyatakan dalam teks Yunani.
- source_word: καί
  choice: juga
  rationale: Dalam klausa kedua, καί menghubungkan kesaksian Bapa sebagai kesaksian tambahan di samping kesaksian Yesus; “juga” mengungkapkan fungsi aditif ini secara alami.
theological_decisions:
- issue: Sebutan ὁ ... πατήρ dalam konteks Yohanes
  choice: Bapa
  alternative: Bapa-Ku; Allah Bapa
  rationale: Teks menyebut “Bapa” tanpa kata ganti posesif atau penjelasan tambahan. Terjemahan mempertahankan hubungan dan klaim teologis ayat tanpa memasukkan rumusan yang tidak eksplisit.
- issue: Nuansa hukum dari bahasa kesaksian
  choice: bersaksi
  alternative: memberi kesaksian
  rationale: “Bersaksi” mempertahankan motif kesaksian yang menyerupai suasana pengadilan dalam perikop ini sekaligus ringkas dan mudah dipahami. Pengulangan padanan yang sama mencerminkan pengulangan μαρτυρέω.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Partikel “-lah” mempertahankan penekanan ἐγώ, sedangkan “juga” menyampaikan hubungan aditif kedua kesaksian.
