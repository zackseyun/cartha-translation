  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: id
  text: Karena itu, mereka mengambil batu untuk melempari Dia dengan batu. Tetapi Yesus menyembunyikan diri dan keluar dari kompleks Bait Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan hanya ruang suci bagian dalam.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἦραν
  choice: mengambil
  rationale: Dalam konteks ini αἴρω berarti mengambil batu dan memegangnya untuk tindakan yang hendak dilakukan; “mengambil” paling alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai akibat atau tanggapan terhadap perkataan sebelumnya dan mempertahankan hubungan logis antarkalimat.
- source_word: λίθους
  choice: batu
  rationale: Padanan baku untuk λίθος dalam konteks upaya melempari seseorang dengan batu.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: untuk dilemparkan kepada-Nya
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan arah tindakan terhadap Yesus.
- source_word: ἐκρύβη
  choice: menyembunyikan diri
  rationale: Walaupun bentuk Yunaninya secara morfologis pasif, dalam konteks ini dapat dipahami dengan nuansa medial; pilihan ini tidak menyiratkan adanya pelaku lain yang menyembunyikan Yesus.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Menyampaikan gerakan fisik ἐξέρχομαι secara langsung dan alami.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: dari kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan ruang suci bagian dalam (ναός); terjemahan ini lebih tepat secara leksikal.
theological_decisions:
- issue: Sifat keluarnya Yesus dari ancaman
  choice: Menyatakan hanya bahwa Yesus menyembunyikan diri lalu keluar.
  alternative: Menambahkan bahwa Yesus menjadi tidak terlihat atau secara ajaib berjalan di tengah-tengah mereka.
  rationale: Teks SBLGNT hanya menyebut Yesus menyembunyikan diri dan keluar dari kompleks Bait Allah. Rincian mukjizat dalam tradisi naskah yang lebih kemudian tidak dimasukkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bait Allah” mempertahankan istilah Alkitabiah yang dikenal luas, sedangkan “kompleks” memperjelas cakupan ἱερόν. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskan.
