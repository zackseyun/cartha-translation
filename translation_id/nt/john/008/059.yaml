  source_fidelity: 'Makna pokok tersampaikan dengan benar: mereka mengambil batu dengan maksud menyerang Yesus; Yesus menyembunyikan diri dan keluar dari ἱερόν. Namun, frasa "untuk dilemparkan kepada-Nya" berbentuk pasif dan dalam bahasa Indonesia kurang jelas serta kurang idiomatis untuk tindakan pelemparan yang dilakukan oleh mereka.'
  naturalness: Kalimatnya pada dasarnya baku, tetapi "batu untuk dilemparkan kepada-Nya" terdengar kaku dan dapat dibaca seolah-olah batu itu diserahkan kepada Yesus. "untuk melempari Dia dengan batu" secara langsung menyatakan tujuan para pelaku. "Tetapi" juga menyatakan kontras δέ dengan lebih lugas daripada "Namun" dalam susunan ini.
  terminology: '"Bait Allah" tepat dan mapan. "Kompleks Bait Allah" secara baik mencerminkan ἱερόν sebagai kawasan Bait Allah, bukan ναός/ruang suci bagian dalam. Catatan kaki sesuai dengan penandanya dan tidak menambahkan rincian mukjizat atau doktrinal.'
