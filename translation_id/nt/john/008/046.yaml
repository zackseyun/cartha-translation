  source_fidelity: Makna pokok draf setia pada teks Yunani. Namun, ἐλέγχει με περὶ ἁμαρτίας paling jelas dipertahankan dengan ungkapan forensik langsung “membuktikan Aku bersalah atas dosa,” bukan bentuk yang menambahkan “dapat” dan mengubahnya menjadi anak kalimat deklaratif. Untuk πιστεύετέ μοι, “memercayai Aku” lebih dekat dengan percaya kepada seorang saksi/pembicara, sementara tetap cukup luas untuk mencakup unsur kepercayaan.
  naturalness: Bahasa draf umumnya baku, lugas, dan alami. Revisi kecil membuat pertanyaan pertama lebih padat dan idiomatis dalam corak forensik, serta menjadikan kontras dengan catatan alternatif pada pertanyaan kedua lebih konsisten.
  terminology: Kapitalisasi “Aku/-Ku” dan penggunaan “kalian” sesuai register Alkitab Indonesia modern yang dipilih. “Memercayai Aku” secara leksikal lebih tepat untuk πιστεύω dengan datif daripada menjadikan “percaya kepada-Ku” sebagai teks utama; yang terakhir layak sebagai alternatif.
  issues:
