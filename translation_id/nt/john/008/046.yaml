  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: id
  text: Siapakah di antara kalian yang membuktikan Aku bersalah atas dosa?[a] Jika Aku mengatakan kebenaran, mengapa kalian tidak memercayai Aku?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Siapakah di antara kalian yang membuktikan bahwa Aku berdosa?”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mengapa kalian tidak percaya kepada-Ku?” Kata Yunani ini dapat berarti memercayai perkataan seseorang maupun menaruh kepercayaan kepadanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Siapakah di antara kalian
  rationale: Ungkapan ini merupakan pertanyaan langsung kepada para pendengar Yesus; bentuk tersebut alami dalam bahasa Indonesia dan mempertahankan tantangannya.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: yang dapat membuktikan bahwa Aku berdosa
  rationale: ἐλέγχω dalam konteks ini bernuansa membuktikan kesalahan atau menetapkan seseorang bersalah. Rumusan ini lebih alami daripada terjemahan harfiah dengan 'mengenai dosa' dan tetap mempertahankan corak forensiknya.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Jika Aku mengatakan kebenaran
  rationale: Kata εἰ dipertahankan sebagai 'jika' agar bentuk bersyarat dan daya retoris teks tidak diubah menjadi pernyataan sebab.
- source_word: διὰ τί
  choice: mengapa
  rationale: Padanan Indonesia yang langsung dan wajar untuk pertanyaan tentang alasan.
- source_word: πιστεύετέ μοι
  choice: percaya kepada-Ku
  rationale: πιστεύω dengan datif dapat menunjuk pada mempercayai perkataan seseorang sekaligus menaruh kepercayaan kepadanya. 'Percaya kepada-Ku' mempertahankan dimensi kesaksian dan relasional tersebut.
theological_decisions:
- issue: Daya retoris klaim Yesus tentang ketidakberdosaan dan kebenaran-Nya
  choice: Kedua pertanyaan diterjemahkan secara langsung tanpa melunakkan atau memperluas klaimnya.
  alternative: Menambahkan kata seperti 'dosa apa pun' atau mengubah 'jika' menjadi 'karena'.
  rationale: Teks menantang para lawan untuk membuktikan adanya dosa pada Yesus dan menghubungkannya dengan kebenaran perkataan-Nya. Terjemahan mempertahankan klaim kuat itu tanpa membuat implikasinya lebih eksplisit daripada bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital menurut kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμεῖς dengan jelas.
