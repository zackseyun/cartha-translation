    issue: Ungkapan utama “yang dapat membuktikan bahwa Aku berdosa” kurang langsung dibanding corak forensik teks sumber.
    rationale: ἐλέγχει berarti membuktikan kesalahan/menyatakan bersalah; kata “dapat” tidak dinyatakan dalam Yunani dan bentuk “membuktikan Aku bersalah atas dosa” lebih dekat sekaligus alami.
  - severity: low
    issue: Teks utama “percaya kepada-Ku” lebih menonjolkan kepercayaan relasional, sedangkan πιστεύετέ μοι memakai datif dan secara langsung berarti memercayai Aku/perkataan-Ku.
    rationale: “Memercayai Aku” mempertahankan ambiguitas antara menerima kesaksian Yesus dan menaruh kepercayaan kepada-Nya; alternatif dapat mencatat nuansa “percaya kepada-Ku.”
