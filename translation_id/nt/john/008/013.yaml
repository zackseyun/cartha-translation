  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: id
  text: Karena itu, orang-orang Farisi berkata kepada-Nya, “Engkau bersaksi tentang diri-Mu sendiri; kesaksian-Mu tidak benar[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesaksian-Mu tidak sah.” Kata Yunani yang digunakan berarti “tidak benar,” tetapi dalam konteks ini juga dapat mengandung pengertian bahwa suatu kesaksian tidak berlaku atau tidak dapat diterima.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesinambungan logis dengan perkataan Yesus sebelumnya; lebih jelas daripada sekadar penanda urutan waktu.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: orang-orang Farisi berkata kepada-Nya
  rationale: Mengikuti susunan alami bahasa Indonesia sambil mempertahankan pronomina objek yang eksplisit dalam bahasa Yunani.
- source_word: Σὺ
  choice: Engkau
  rationale: Pronomina eksplisit membawa penekanan. Bentuk “Engkau” sesuai dengan ragam Alkitab Indonesia yang modern dan bermartabat.
- source_word: περὶ σεαυτοῦ
  choice: tentang diri-Mu sendiri
  rationale: Menyampaikan bahwa diri Yesus merupakan pokok kesaksian sekaligus mempertahankan unsur refleksif dan penekanannya.
- source_word: μαρτυρεῖς
  choice: bersaksi
  rationale: Bentuk kini sederhana alami dalam bahasa Indonesia dan mempertahankan nuansa pemberian kesaksian dalam perdebatan yang bernada hukum.
- source_word: ἡ μαρτυρία σου
  choice: kesaksian-Mu
  rationale: Menjaga kesinambungan leksikal dengan verba “bersaksi” dan nuansa pembuktian atau kesaksian.
- source_word: οὐκ ἔστιν ἀληθής
  choice: tidak benar
  rationale: Padanan langsung yang mempertahankan keluasan makna ἀληθής, tanpa membatasinya hanya pada keabsahan hukum.
theological_decisions:
- issue: Arti keberatan orang-orang Farisi terhadap kesaksian tentang diri sendiri
  choice: kesaksian-Mu tidak benar
  alternative: kesaksian-Mu tidak sah
  rationale: Konteksnya bernuansa hukum, tetapi ἀληθής lebih luas daripada istilah teknis untuk keabsahan. “Tidak benar” mempertahankan ketegangan antara tuduhan mengenai kebenaran dan keberatan mengenai bobot atau keabsahan kesaksian.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab berbahasa Indonesia; kalimat langsung tetap tegas tanpa mempersempit nuansa hukum pada istilah Yunani.
