  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: id
  text: Namun, karena Aku mengatakan kebenaran, kamu tidak percaya kepada-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina subjek yang eksplisit dipertahankan untuk menandai penekanan dan kontras antara Yesus dan para pendengar-Nya.
- source_word: δὲ
  choice: Namun
  rationale: Dalam konteks ini δέ menyatakan pertentangan dengan ayat sebelumnya; “Namun” menyampaikan fungsi adversatif itu secara wajar dan bermartabat.
- source_word: ὅτι
  choice: karena
  rationale: 'ὅτι paling tepat dipahami secara kausal: para pendengar tidak memercayai Yesus justru karena Ia mengatakan kebenaran. Kemungkinan formal “bahwa” dicatat dalam catatan kaki.'
- source_word: τὴν ἀλήθειαν
  choice: kebenaran
  rationale: Padanan baku dan alami bagi ἀλήθεια; artikel Yunani tidak perlu direproduksi secara mekanis dalam bahasa Indonesia.
- source_word: λέγω
  choice: mengatakan
  rationale: Bentuk kini diterjemahkan dengan verba biasa bahasa Indonesia. “Mengatakan kebenaran” dekat dengan bentuk sumber dan tetap alami.
- source_word: οὐ πιστεύετέ μοι
  choice: kamu tidak percaya kepada-Ku
  rationale: πιστεύω dengan datif merujuk pada percaya kepada atau memercayai seseorang. Rumusan ini mempertahankan objek personal tanpa memperluasnya menjadi “tidak percaya pada perkataan-Ku”.
theological_decisions:
- issue: Makna ὅτι dalam hubungan antara perkataan benar Yesus dan ketidakpercayaan para pendengar
  choice: 'Kausal: “karena Aku mengatakan kebenaran”'
  alternative: 'Deklaratif/formal: “bahwa Aku mengatakan kebenaran”'
  rationale: Alur wacana dan kontras dengan ayat sebelumnya mendukung hubungan kausal serta mempertahankan ironi tajam kalimat itu. Karena bentuk Yunani juga dapat dibaca lebih formal dengan “bahwa”, kemungkinan tersebut dicatat tanpa dijadikan teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan “Aku” dan “kamu” yang langsung serta mudah dipahami. “Justru” dipakai untuk menyampaikan penekanan ironis yang timbul dari struktur dan konteks, bukan untuk menambahkan gagasan doktrinal. Bentuk “kepada-Ku” mempertahankan hubungan personal dalam konstruksi πιστεύω + datif.
