  text: As he was saying these things[b][a], many believed in him.
translation:
  language: id
  text: Ketika Ia sedang mengatakan semua itu,[a] banyak orang percaya kepada-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sementara Ia berbicara demikian.”
    reason: Alternatif ini menerjemahkan λαλοῦντος dengan “berbicara” dan menonjolkan tindakan yang berlangsung bersamaan.
  - marker: b
    text: Atau “menaruh iman kepada-Nya.”
    reason: Alternatif ini menyatakan secara lebih eksplisit arah kepercayaan dalam konstruksi πιστεύω εἰς, tetapi teks utama lebih langsung dan alami.
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Bentuk jamak netral ini menunjuk pada isi perkataan Yesus sebelumnya; “hal-hal ini” mempertahankan bentuk jamak dan kaitan wacananya.
- source_word: αὐτοῦ λαλοῦντος
  choice: ketika Dia mengatakan
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang berlangsung bersamaan; ungkapan ini menyatakan bahwa kepercayaan itu timbul saat Yesus masih berbicara.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva ini dipakai secara substantival. Dalam bahasa Indonesia, penambahan “orang” diperlukan agar maknanya alami dan jelas.
- source_word: ἐπίστευσαν
  choice: percaya
  rationale: Aoristus indikatif menyajikan tindakan tersebut sebagai satu peristiwa utuh; “percaya” merupakan padanan langsung tanpa menambahkan nuansa proses secara berlebihan.
- source_word: εἰς αὐτόν
  choice: kepada-Nya
  rationale: Dalam konstruksi πιστεύω + εἰς, kepercayaan diarahkan kepada pribadi Yesus. “Percaya kepada-Nya” merupakan ungkapan Indonesia yang alami dan mempertahankan daya relasional konstruksi itu.
theological_decisions:
- issue: Makna πιστεύω εἰς αὐτόν dalam pemakaian Yohanes
  choice: percaya kepada-Nya
  alternative: menaruh iman kepada-Nya
  rationale: Pilihan ini menyatakan kepercayaan yang diarahkan kepada pribadi Yesus, bukan hanya menerima kebenaran perkataan-Nya, sambil tidak menentukan lebih jauh mutu atau ketahanan iman orang-orang tersebut—sebuah ketegangan yang diteruskan oleh konteks berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pronomina yang merujuk kepada Yesus dikapitalisasi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia; kapitalisasi ini bersifat editorial, bukan ciri gramatikal teks Yunani.
