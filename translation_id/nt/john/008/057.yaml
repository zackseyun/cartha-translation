id: JHN.8.57
reference: John 8:57
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi[a] berkata kepada-Nya, “Umur-Mu belum lima puluh tahun, dan Engkau sudah pernah melihat Abraham?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea” atau “para pemimpin Yahudi”, bergantung pada seberapa luas cakupan yang dimaksud Yohanes dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ini merupakan padanan langsung bagi sebutan naratif Yohanes. Konteks ayat ini tidak secara eksplisit membatasi kelompok tersebut hanya pada para pemimpin atau pada penduduk Yudea.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan konsekuensial dengan pernyataan sebelumnya dan mempertahankan alur argumentasi.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Umur-Mu belum lima puluh tahun
  rationale: Mengalihkan idiom Yunani yang secara harfiah berarti 'belum mempunyai lima puluh tahun' ke ungkapan usia yang alami dalam bahasa Indonesia.
- source_word: ἑώρακας
  choice: sudah pernah melihat
  rationale: Bentuk perfek Yunani menyatakan tindakan melihat yang dipandang relevan hingga saat percakapan; 'sudah pernah melihat' alami dalam pertanyaan bernada tidak percaya ini.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan konjungsi aditif Yunani sekaligus membiarkan konteks menyampaikan nada keheranan.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks Yunani memakai sebutan yang luas dan tidak secara eksplisit menyempitkannya kepada para pemimpin. Terjemahan utama mempertahankan keluasan itu, sedangkan kemungkinan lain dicatat agar ambiguitas kontekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk sapaan kepada Yesus ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab bahasa Indonesia; tanda kaki ditempatkan langsung setelah frasa yang dijelaskannya.
