  source_fidelity: Setia pada teks Yunani. “Karena itu” menyampaikan οὖν secara wajar; “orang-orang Yahudi” mempertahankan keluasan οἱ Ἰουδαῖοι; “Umur-Mu belum lima puluh tahun” mengungkapkan idiom usia; dan “Engkau sudah pernah melihat Abraham?” mempertahankan pertanyaan retoris serta aspek perfektum ἑώρακας tanpa menambahkan penafsiran.
