  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: id
  text: Namun, Aku tidak mencari kemuliaan-Ku sendiri; ada yang mencarinya dan menghakimi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ada yang mencari dan menghakimi.” Objek yang tersirat dari “mencari” adalah kemuliaan Yesus pada klausa sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteksnya, subjek yang tidak disebutkan itu umumnya dipahami sebagai Bapa, meskipun teks Yunani tidak menyebutkan hal itu secara eksplisit dalam ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Namun, Aku
  rationale: Pronomina eksplisit mempertahankan penekanan kontras pada Yesus, sedangkan δέ diterjemahkan “Namun” untuk menyampaikan pertentangan dengan konteks sebelumnya secara wajar.
- source_word: οὐ ζητῶ
  choice: tidak mencari
  rationale: Bentuk kini indikatif negatif diterjemahkan dengan bentuk kini sederhana; “mencari” juga mempertahankan kaitan leksikal dengan ζητῶν pada klausa berikutnya.
- source_word: τὴν δόξαν μου
  choice: kemuliaan-Ku sendiri
  rationale: δόξα dapat menunjuk pada kemuliaan atau kehormatan. Kata “sendiri” memperjelas penolakan terhadap pencarian kemuliaan bagi diri tanpa mengubah rujukan posesif μου.
- source_word: ἔστιν ὁ ζητῶν
  choice: ada Dia yang mencarinya
  rationale: Konstruksi eksistensial dan partisipel berartikel diterjemahkan secara alami. “Dia” tetap tidak menyebut identitas subjek, sedangkan “-nya” memasok objek yang tersirat dari klausa sebelumnya.
- source_word: καὶ κρίνων
  choice: dan menghakimi
  rationale: Partisipel yang sejajar dengan ζητῶν diterjemahkan sebagai verba yang sejajar. “Menghakimi” mempertahankan nuansa yudisial κρίνω dalam konteks Yohanes 8.
theological_decisions:
- issue: Identitas subjek tak bernama yang mencari dan menghakimi
  choice: Teks utama memakai “Dia” tanpa menyebut Bapa secara eksplisit.
  alternative: “Ada Bapa yang mencarinya dan menghakimi” atau secara lebih harfiah “ada yang mencari dan menghakimi.”
  rationale: Konteks kuat mengarahkan pembaca kepada Bapa, tetapi teks Yunani tidak menamai-Nya dalam ayat ini. Terjemahan mempertahankan ketidaktersuratan tersebut.
- issue: Objek dari ζητῶν
  choice: “mencarinya,” dengan “-nya” merujuk kepada kemuliaan Yesus
  alternative: “yang mencari” tanpa objek tersurat
  rationale: Objek tidak dinyatakan ulang dalam bahasa Yunani, tetapi dipahami dari τὴν δόξαν μου pada klausa pertama. Memasok pronomina menghasilkan bahasa Indonesia yang alami tanpa menyelesaikan identitas subjek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku,” “-Ku,” dan “Dia” mengikuti rujukan ilahi dalam konteks. Susunan kalimat dibuat alami sambil mempertahankan pengulangan akar kata ζητέω dan ketidaktersuratan identitas subjek.
