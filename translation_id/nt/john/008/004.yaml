  text: λέγουσιν αὐτῷ, Διδάσκαλε, αὕτη ἡ γυνὴ κατείληπται ἐπαυτοφώρῳ μοιχευομένη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: id
  text: Mereka[a] berkata kepada-Nya, “Guru, perempuan ini tertangkap basah ketika sedang berzina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan kelanjutan kisah tentang perempuan yang tertangkap berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif lampau yang wajar dalam bahasa Indonesia; verba bahasa Indonesia sendiri tidak menandai kala.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan langsung yang alami dan tepat bagi sebutan seorang pengajar.
- source_word: κατείληπται
  choice: tertangkap
  rationale: Perfek pasif menyatakan tindakan penangkapan yang sudah terjadi dan hasilnya masih berlaku; konteks naratif membuat nuansa tersebut jelas tanpa penanda aspek tambahan.
- source_word: ἐπαυτοφώρῳ
  choice: basah
  rationale: Dipadukan dalam idiom Indonesia “tertangkap basah,” yang secara alami berarti tertangkap ketika sedang melakukan perbuatan itu sendiri.
- source_word: μοιχευομένη
  choice: sedang berzina
  rationale: Partisipel kini menggambarkan tindakan yang tengah berlangsung pada saat perempuan itu tertangkap.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Tertangkap basah sedang berzina” mempertahankan penekanan Yunani bahwa perempuan itu ditangkap tepat ketika perbuatan tersebut berlangsung; sapaan “Guru” menjaga nada langsung dalam adegan pengadilan terbuka ini.
