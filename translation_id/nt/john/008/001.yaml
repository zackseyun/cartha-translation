  text: Namun, Yesus[a] pergi ke Bukit Zaitun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan kelanjutan kisah tentang perempuan yang tertangkap berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53 mengenai bukti tekstual.
    reason: textual_critical
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Kata penghubung ini menandai peralihan yang berlawanan dengan tindakan orang-orang pada ayat sebelumnya; “Namun” menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: ἐπορεύθη (πορεύομαι)
  choice: pergi
  rationale: Bentuk aoris ini bermakna aktif dan menyatakan gerak sederhana menuju suatu tempat; “pergi” adalah padanan Indonesia yang wajar dan tepat.
- source_word: ὄρος τῶν Ἐλαιῶν
  choice: Bukit Zaitun
  rationale: Ini adalah nama geografis yang sudah dikenal dalam bahasa Indonesia. “Bukit” sesuai dengan pemakaian baku nama tempat ini, sedangkan bentuk tunggal kolektif “Zaitun” secara alami mewakili pepohonan zaitun yang melatarbelakangi nama Yunani tersebut.
