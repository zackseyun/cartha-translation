  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: id
  text: Saat fajar, Ia datang lagi ke pelataran Bait Allah. Seluruh rakyat berdatangan kepada-Nya, lalu Ia duduk dan mengajar mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini melanjutkan kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11), yang tidak terdapat dalam naskah-naskah Yunani paling awal. Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Saat fajar
  rationale: Bentuk genitif waktu menunjuk pada waktu menjelang atau sekitar matahari terbit; frasa ini ringkas dan alami dalam bahasa Indonesia.
- source_word: παρεγένετο
  choice: Ia datang
  rationale: Kata ini menyatakan kedatangan di suatu tempat; 'datang' sesuai dengan tujuan yang disebutkan.
- source_word: ἱερόν
  choice: pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah, bukan ruang kudus bagian dalam; dalam konteks pengajaran umum, 'pelataran Bait Allah' mencegah kesan bahwa Yesus memasuki ruang suci tertutup.
- source_word: πᾶς ὁ λαὸς ἤρχετο
  choice: Seluruh rakyat berdatangan
  rationale: Bentuk imperfek menggambarkan orang-orang yang terus datang; 'berdatangan' menyampaikan aspek berlangsung itu secara alami.
- source_word: καθίσας
  choice: lalu Ia duduk
  rationale: Partisip aoris menyatakan tindakan duduk yang mendahului pengajaran.
- source_word: ἐδίδασκεν
  choice: mengajar
  rationale: Imperfek dapat menyatakan tindakan yang sedang berlangsung atau mulai dilakukan. 'Mengajar' mempertahankan keluasan makna tanpa memaksakan tafsiran inkoatif 'mulai mengajar'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bait Allah' dipakai sebagai istilah umum yang mudah dipahami, sedangkan 'pelataran' memperjelas cakupan ἱερόν. Penanda catatan ditempatkan pada akhir ayat agar jelas bahwa catatan menyangkut status tekstual seluruh bagian.
