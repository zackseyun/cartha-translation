  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: id
  text: Yesus berkata kepada mereka, “Sekiranya Allah adalah Bapamu, kamu tentu mengasihi Aku, sebab Aku berasal dari Allah dan kini ada di sini.[a] Sebab Aku tidak datang dari diri-Ku sendiri,[b] melainkan Dialah yang mengutus Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sebab Aku keluar dari Allah dan telah datang.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku datang bukan atas kehendak-Ku sendiri.” Ungkapan Yunani dapat menekankan sumber maupun prakarsa mandiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Sekiranya Allah adalah Bapamu, kamu tentu mengasihi Aku
  rationale: Konstruksi syarat dengan bentuk imperfek dan ἄν menyatakan keadaan yang bertentangan dengan kenyataan. “Sekiranya ... tentu” menyampaikan nuansa itu secara alami dalam bahasa Indonesia.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: Aku berasal dari Allah
  rationale: Ungkapan ini menandai sumber atau asal. “Berasal dari Allah” mempertahankan klaim tentang asal ilahi tanpa memasukkan istilah teologis teknis yang muncul kemudian.
- source_word: καὶ ἥκω
  choice: dan kini berada di sini
  rationale: ἥκω menunjuk pada kedatangan beserta keadaan hadir sebagai hasilnya. Kata “kini” memperjelas daya kini ungkapan tersebut secara wajar.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Aku datang bukan atas kehendak-Ku sendiri
  rationale: ἀπ’ ἐμαυτοῦ dapat menyoroti sumber ataupun prakarsa mandiri. Pilihan ini alami dalam bahasa Indonesia dan menegaskan bahwa kedatangan Yesus bukan berdasarkan prakarsa-Nya sendiri, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: melainkan Dialah yang mengutus Aku
  rationale: ἐκεῖνος bersifat menegaskan dan merujuk kepada Allah. “Dialah” mempertahankan penekanan tersebut, sedangkan “mengutus” melestarikan bahasa misi dari ἀποστέλλω.
theological_decisions:
- issue: Bahasa mengenai asal Yesus tanpa menentukan kategori teologis yang lebih kemudian
  choice: Aku berasal dari Allah dan kini berada di sini
  alternative: Aku keluar dari Allah dan telah datang
  rationale: Teks menegaskan asal dan pengutusan ilahi Yesus, tetapi kata kerja Yunani di sini tidak perlu diterjemahkan dengan istilah kredal teknis. Alternatif yang lebih formal dipertahankan dalam catatan kaki.
- issue: Makna ἀπ’ ἐμαυτοῦ
  choice: bukan atas kehendak-Ku sendiri
  alternative: bukan dari diri-Ku sendiri
  rationale: Frasa Yunani dapat menekankan asal maupun prakarsa mandiri. Teks utama memakai ungkapan Indonesia yang alami tentang prakarsa, sedangkan nuansa sumber dipertahankan dalam catatan kaki agar ambiguitas aslinya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina yang merujuk kepada Yesus dan Allah ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Pengulangan γάρ kedua tidak diterjemahkan dengan konjungsi tersendiri karena hubungan penjelasnya sudah jelas dan hasilnya lebih alami dalam bahasa Indonesia.
