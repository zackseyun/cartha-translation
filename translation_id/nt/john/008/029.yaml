  source_fidelity: 'Terjemahan dengan tepat mencerminkan struktur dan makna Yunani: subjek substantival ὁ πέμψας με dipertahankan sebagai "Dia yang mengutus Aku"; μετ’ ἐμοῦ ἐστιν tersampaikan oleh "menyertai Aku"; dan hubungan sebab melalui ὅτι diterjemahkan secara tepat dengan "karena." Bentuk "tidak meninggalkan Aku sendirian" tidak memaksakan penandaan aspek atau waktu yang tidak diperlukan dalam bahasa Indonesia dan tetap sesuai dengan aoris ἀφῆκεν dalam konteksnya.'
