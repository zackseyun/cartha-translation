  terminology: Istilah dan pronomina konsisten dengan register Alkitab bahasa Indonesia. Ungkapan relasional "Dia yang mengutus Aku" tidak secara tidak perlu menggantikan teks dengan "Bapa," tetapi rujukannya tetap jelas dari konteks. Kapitalisasi pronomina mengikuti konvensi yang dapat diterima dalam register ini.
