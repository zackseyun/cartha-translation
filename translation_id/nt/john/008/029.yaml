id: JHN.8.29
reference: John 8:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: id
  text: Dan Dia yang mengutus Aku menyertai Aku. Dia tidak meninggalkan Aku sendirian, karena Aku selalu melakukan apa yang berkenan kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: Dia yang mengutus Aku
  rationale: Partisip aoris berartikel ini berfungsi sebagai nomina dan menunjuk kepada Bapa. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan bentuk relasional teks tanpa menambahkan sebutan 'Bapa'.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: menyertai Aku
  rationale: μετά dengan genitif menyatakan kebersamaan atau kehadiran. 'Menyertai Aku' mengungkapkan kehadiran yang terus berlangsung secara alami dan bermartabat.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Dia tidak meninggalkan Aku sendirian
  rationale: ἀφῆκεν adalah aoris, dan bentuk lampau bahasa Indonesia tidak wajib ditandai secara khusus. Terjemahan ini mempertahankan tindakan tidak meninggalkan sekaligus relevansinya dalam keadaan kini; μόνον menerangkan keadaan objek, yaitu 'sendirian'.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini ὅτι memperkenalkan alasan dan paling wajar diterjemahkan 'karena'.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: apa yang berkenan kepada-Nya
  rationale: Frasa netral jamak substantival ini secara harfiah menunjuk pada 'hal-hal yang berkenan kepada-Nya'. Bentuk 'apa yang berkenan kepada-Nya' alami dalam bahasa Indonesia dan mempertahankan nuansa penilaian ἀρεστός.
- source_word: ποιῶ πάντοτε
  choice: Aku selalu melakukan
  rationale: Bentuk kini ποιῶ menyatakan tindakan yang terus menjadi kebiasaan, sedangkan πάντοτε menegaskan kekonsistenannya. Susunan ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan 'Dia yang mengutus Aku'
  choice: Ungkapan relasional dipertahankan; konteks menunjuk kepada Bapa tanpa menyisipkan kata 'Bapa' ke dalam ayat.
  alternative: Menerjemahkan secara eksplisit 'Bapa yang mengutus Aku'.
  rationale: Bahasa Yunani tidak memakai kata 'Bapa' dalam ayat ini. Mempertahankan ungkapan tersebut menjaga gaya Yohanes dan menghindari penambahan penafsiran ke dalam teks.
- issue: Hubungan kausal ὅτι
  choice: Diterjemahkan 'karena', sehingga tindakan Yesus melakukan apa yang berkenan kepada Sang Pengutus dinyatakan sebagai alasan Dia tidak ditinggalkan sendirian.
  alternative: Menerjemahkan dengan penghubung penjelas yang lebih longgar, seperti 'sebab', atau memahami klausa terutama sebagai penegasan hubungan timbal balik.
  rationale: Nilai kausal adalah pembacaan sintaksis yang paling langsung. Terjemahan mempertahankan ketegangan teologis pernyataan itu dan tidak mengubahnya menjadi rumusan doktrinal yang lebih lunak.
- issue: Aspek ἀφῆκεν
  choice: 'Diterjemahkan tanpa penanda waktu tambahan: ''tidak meninggalkan'', yang dalam bahasa Indonesia dapat mencakup tindakan lampau dengan akibat yang tetap berlaku.'
  alternative: Menambahkan 'tidak pernah meninggalkan' atau 'belum meninggalkan'.
  rationale: Penambahan 'pernah' atau 'belum' dapat mempersempit atau menggeser nilai aoris. Bentuk sederhana lebih dekat dengan sumber dan tetap alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Pronomina yang merujuk kepada Yesus dan Sang Pengutus ditulis dengan kapital secara konvensional. Tidak diperlukan catatan kaki karena alternatif leksikal tidak cukup penting untuk dicantumkan dalam teks publikasi.
