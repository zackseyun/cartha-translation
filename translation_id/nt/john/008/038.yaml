  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: id
  text: Aku mengatakan apa yang telah Kulihat di hadirat Bapa, dan karena itu kamu melakukan apa yang telah kamu dengar dari bapakmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku mengatakan hal-hal yang telah Kulihat di hadirat Bapa, dan karena itu kamu melakukan hal-hal yang kamu dengar dari bapak itu.” Bahasa Yunani tidak memakai kata “-mu” pada penyebutan bapak yang kedua; konteks selanjutnya menjelaskan siapa yang dimaksud (lihat ay. 44).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: apa yang
  rationale: Pronomina relatif netral jamak berfungsi sebagai klausa objek; “apa yang” alami dalam bahasa Indonesia dan tetap menyampaikan isi yang dimaksud.
- source_word: ἑώρακα
  choice: telah Kulihat
  rationale: Bentuk perfek menunjuk pada penglihatan pada masa lampau yang tetap relevan; “telah” cukup mencerminkan aspek itu tanpa membuat kalimat kaku.
- source_word: παρὰ τῷ πατρὶ
  choice: di hadirat Bapa
  rationale: παρά dengan datif menyatakan kedekatan atau keberadaan di sisi seseorang. “Di hadirat Bapa” mempertahankan nuansa relasional dan menghindari penyamaan dengan παρά plus genitif pada klausa kedua.
- source_word: λαλῶ
  choice: Aku mengatakan
  rationale: Verba ini berarti berbicara atau mengatakan; dengan klausa objek, “mengatakan apa yang” merupakan ungkapan Indonesia yang alami dan dekat dengan susunan Yunani.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai hubungan inferensial antara apa yang didengar dan tindakan mereka, sambil mempertahankan pertentangan dengan tindakan Yesus.
- source_word: ἠκούσατε
  choice: telah kamu dengar
  rationale: Aoris dapat diterjemahkan sebagai tindakan lampau; “telah” menonjolkan bahwa apa yang didengar itu kini tampak dalam tindakan mereka.
- source_word: παρὰ τοῦ πατρὸς
  choice: dari bapakmu
  rationale: παρά dengan genitif menunjukkan sumber. Walaupun teks Yunani tidak memuat pronomina posesif, konteks mengontraskan Bapa Yesus dengan bapak para lawan-Nya; “bapakmu” membuat implikasi itu wajar dalam bahasa Indonesia tanpa mengidentifikasinya lebih jauh.
- source_word: ποιεῖτε
  choice: kamu melakukan
  rationale: Bentuk kini menggambarkan tindakan mereka yang berlangsung atau khas; “melakukan” mempertahankan makna umum tanpa mempersempitnya menjadi kebiasaan tertentu.
- source_word: πατήρ / πατρὸς
  choice: Bapa / bapak
  rationale: “Bapa” menandai Allah dalam relasi-Nya dengan Yesus, sedangkan “bapak” pada klausa kedua mempertahankan kontras dan ketidaktersuratan identitasnya dalam ayat ini.
theological_decisions:
- issue: Identitas “bapak” pada klausa kedua
  choice: Menerjemahkan secara implisit sebagai “bapakmu”
  alternative: “bapak itu” atau “Iblis”
  rationale: Ayat 44 baru menyebut Iblis secara eksplisit. “Bapakmu” menjaga perkembangan retoris percakapan dan tidak memasukkan penjelasan ayat berikutnya ke dalam ayat ini.
- issue: Arti παρά dalam dua klausa
  choice: Membedakan “di hadirat Bapa” dari “dari bapakmu”
  alternative: Menerjemahkan keduanya dengan “dari”
  rationale: Kasus datif pada klausa pertama terutama menyatakan kehadiran atau kedekatan, sedangkan genitif pada klausa kedua menyatakan sumber. Pembedaan ini mempertahankan nuansa tata bahasa dan hubungan khas Yesus dengan Bapa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada “Aku/Kulihat” mengikuti rujukan kepada Yesus, sedangkan “Bapa” dan “bapakmu” mempertahankan kontras teologis serta perkembangan naratif.
