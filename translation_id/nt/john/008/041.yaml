  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: id
  text: Kalian melakukan perbuatan-perbuatan bapa kalian.” Mereka berkata kepada-Nya, “Kami tidak lahir dari perzinaan[a]; kami mempunyai satu Bapa, yaitu Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kami bukan anak-anak yang lahir di luar nikah.” Secara harfiah, bahasa Yunani berbunyi, “Kami tidak lahir dari perzinaan.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: ποιεῖτε
  choice: melakukan
  rationale: Bentuk kini menunjukkan tindakan yang sedang atau terus dilakukan; dalam bahasa Indonesia, aspek ini cukup alami disampaikan oleh konteks tanpa penanda progresif tambahan.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatan
  rationale: Pilihan ini menyampaikan tindakan atau pekerjaan yang mencerminkan sumber dan watak pelakunya, serta mempertahankan kaitannya dengan kata kerja 'melakukan'.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: bapa kalian
  rationale: πατήρ dipertahankan sebagai 'bapa' agar makna relasional dan metaforis serta ketegangan tentang asal-usul rohani tidak dihilangkan.
- source_word: ἐκ πορνείας
  choice: dari percabulan
  rationale: πορνεία menunjuk pada hubungan seksual yang tidak sah atau amoral. Ungkapan yang dekat dengan bentuk Yunani dipertahankan karena juga dapat menyiratkan kelahiran tidak sah.
- source_word: οὐ γεγεννήμεθα
  choice: kami tidak lahir
  rationale: Perfek pasif dalam ungkapan kelahiran ini paling alami diterjemahkan demikian dalam bahasa Indonesia; hasil atau status kelahiran tetap tersirat.
- source_word: ἕνα πατέρα ἔχομεν
  choice: kami mempunyai satu Bapa
  rationale: ἕνα menekankan bahwa hanya ada satu Bapa; huruf kapital digunakan karena sosok itu langsung diidentifikasi sebagai Allah.
- source_word: τὸν θεόν
  choice: yaitu Allah
  rationale: Frasa ini menjelaskan secara aposisional siapa satu Bapa tersebut; 'yaitu' menyatakannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah penyangkalan bahwa mereka lahir ἐκ πορνείας perlu dijelaskan langsung sebagai klaim bahwa mereka bukan anak tidak sah
  choice: Mempertahankan ungkapan dekat dengan bentuk Yunani, 'Kami tidak lahir dari percabulan,' dalam teks utama
  alternative: Kami bukan anak-anak yang lahir di luar nikah
  rationale: Ungkapan Yunani kemungkinan menyiratkan penyangkalan atas kelahiran yang tidak sah dan mungkin mengandung sindiran polemis, tetapi teks menyatakannya dengan istilah πορνεία. Terjemahan utama mempertahankan ketegangan dan ambiguitas itu, sedangkan implikasinya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk bentuk jamak ὑμεῖς/ὑμῶν; 'bapa' mempertahankan gambaran kekerabatan, dan 'Bapa' dikapitalisasi ketika secara langsung merujuk kepada Allah.
