base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: id
  text: Ia mengucapkan perkataan-perkataan ini di perbendaharaan ketika mengajar di Bait Allah.[a] Dan tidak seorang pun menangkap Dia, sebab saat-Nya belum tiba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang diterjemahkan “Bait Allah” menunjuk pada seluruh kawasan Bait Allah, termasuk pelatarannya, bukan hanya ruang kudus bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Dalam Injil Yohanes, “saat-Nya” menunjuk pada waktu yang ditetapkan bagi penderitaan dan pemuliaan Yesus; dapat juga diterjemahkan “waktu yang ditetapkan bagi-Nya.”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: perkataan-perkataan ini
  rationale: Bentuk ini menunjuk pada perkataan yang baru saja diucapkan dan mempertahankan acuan eksplisit ῥήματα tanpa mengubahnya menjadi gagasan yang lebih umum.
- source_word: ἐλάλησεν
  choice: mengucapkan
  rationale: λαλέω menekankan tindakan berbicara; bersama objek 'perkataan-perkataan ini', 'mengucapkan' terdengar alami dalam bahasa Indonesia.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: di tempat perbendaharaan
  rationale: γαζοφυλάκιον dapat menunjuk pada lokasi atau kawasan perbendaharaan Bait Allah, bukan semata-mata satu peti persembahan; 'tempat perbendaharaan' mempertahankan keluasan itu.
- source_word: διδάσκων
  choice: ketika mengajar
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung bersamaan dengan verba utama.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan hanya ruang kudus bagian dalam.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: tidak seorang pun menangkap Dia
  rationale: πιάζω menyatakan tindakan menangkap atau memegang secara paksa; 'menangkap' mempertahankan nuansa permusuhan tanpa mengharuskan prosedur hukum formal.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan mengapa tidak seorang pun menangkap Yesus; 'sebab' sesuai dengan gaya naratif yang dignified dan alami.
- source_word: οὔπω ἐληλύθει
  choice: belum tiba
  rationale: Bentuk pluperfek menunjukkan bahwa sampai pada titik narasi tersebut waktunya belum datang; ungkapan Indonesia 'belum tiba' menyampaikannya secara idiomatis.
- source_word: ἡ ὥρα αὐτοῦ
  choice: saat-Nya
  rationale: '''Saat-Nya'' mempertahankan metafora waktu dan motif khas Injil Yohanes, sekaligus lebih alami daripada ''jam-Nya'' dalam bahasa Indonesia untuk waktu yang ditetapkan.'
theological_decisions:
- issue: Makna teologis ἡ ὥρα αὐτοῦ dalam Injil Yohanes
  choice: Mempertahankan ungkapan 'saat-Nya' dalam teks utama.
  alternative: waktu yang ditetapkan bagi-Nya
  rationale: Ungkapan ringkas ini mempertahankan ketegangan motif Yohanes mengenai waktu penderitaan dan pemuliaan Yesus tanpa menjelaskan seluruh maknanya di dalam teks utama. Catatan kaki memberi konteks tanpa menutup keluasan motif tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. Kapitalisasi pronomina 'Dia' dan sufiks '-Nya' mengikuti kebiasaan luas penerjemahan Alkitab Indonesia saat merujuk kepada Yesus. 'Kompleks Bait Allah' dipilih agar cakupan ἱερόν jelas bagi pembaca umum.
