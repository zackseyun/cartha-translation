  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: id
  text: Aku tahu bahwa kalian adalah keturunan Abraham[a]. Namun, kalian berusaha membunuh Aku, karena firman-Ku tidak mendapat tempat di dalam diri kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “benih Abraham.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “karena firman-Ku tidak menemukan ruang di dalam diri kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: keturunan Abraham
  rationale: Kata σπέρμα berbentuk tunggal tetapi bermakna kolektif dan di sini menunjuk pada garis keturunan jasmani. 'Keturunan Abraham' alami dalam bahasa Indonesia serta tidak mencampurkan gagasan tentang anak-anak Abraham secara rohani yang dikembangkan dalam konteks berikutnya.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: kamu berusaha membunuh Aku
  rationale: Konstruksi ζητέω dengan infinitif dapat menyatakan usaha atau upaya melakukan sesuatu. Bentuk kini dipertahankan dengan 'berusaha', tanpa menambahkan penilaian lebih jauh tentang motif mereka.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: firman-Ku
  rationale: '''Firman'' mempertahankan hubungan leksikal dengan λόγος dan merupakan padanan yang wajar serta bermartabat bagi ucapan atau pesan ilahi dalam konteks Yohanes; ''pesan-Ku'' mungkin, tetapi mempersempit gema leksikalnya.'
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: tidak mendapat tempat di dalam dirimu
  rationale: Ungkapan ini mempertahankan metafora tentang tidak adanya ruang atau penerimaan batin, sambil membiarkan terbuka nuansa χωρέω yang dapat mencakup penerimaan maupun kemajuan.
- source_word: ἀλλὰ
  choice: Namun
  rationale: Konjungsi ini menandai pertentangan kuat antara pengakuan atas garis keturunan Abraham dan usaha mereka membunuh Yesus.
- source_word: οἶδα ὅτι
  choice: Aku tahu bahwa
  rationale: Padanan langsung dan alami yang mempertahankan klausa isi eksplisit dalam bahasa Yunani.
theological_decisions:
- issue: Hubungan antara keturunan jasmani Abraham dan keselarasan sejati dengan Abraham
  choice: Menerjemahkan σπέρμα Ἀβραάμ secara genealogis sebagai 'keturunan Abraham'.
  alternative: '''anak-anak Abraham'''
  rationale: Dalam ayat ini Yesus mengakui garis keturunan jasmani mereka, sementara ayat-ayat sekitar mempertanyakan apakah tindakan mereka selaras dengan Abraham. Terjemahan ini mempertahankan ketegangan tersebut tanpa menyelesaikannya secara prematur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina 'Aku' dan enklitik '-Ku' dikapitalisasi untuk rujukan kepada Yesus sesuai kelaziman penerbitan Alkitab Indonesia; 'kamu/dirimu' mempertahankan bentuk orang kedua jamak sumber secara alami, meskipun bahasa Indonesia tidak menandai jumlah secara eksplisit.
