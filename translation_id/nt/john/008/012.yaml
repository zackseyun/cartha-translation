id: JHN.8.12
reference: John 8:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: id
  text: Maka Yesus berbicara lagi kepada mereka, kata-Nya, “Akulah terang dunia. Siapa yang mengikuti Aku sama sekali tidak akan berjalan dalam kegelapan[a], tetapi akan memiliki terang kehidupan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak akan pernah berjalan dalam kegelapan.” Bahasa Yunani memakai bentuk penyangkalan yang sangat kuat (οὐ μὴ).
    reason: lexical_alternative
  - marker: b
    text: “Terang kehidupan” juga dapat dipahami sebagai “terang yang memberi kehidupan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Maka ... lagi
  rationale: Gabungan ini melanjutkan alur wacana sekaligus menunjukkan bahwa Yesus kembali berbicara; “maka” tidak melebihkan οὖν menjadi kesimpulan logis yang kaku.
- source_word: ἐλάλησεν ... λέγων
  choice: berbicara ... kata-Nya
  rationale: Membedakan tindakan berbicara dari pengantar isi perkataan dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini menyampaikan identifikasi predikatif dengan penekanan wajar pada subjek, tanpa menambahkan tafsiran eksplisit tentang nama ilahi.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: terang dunia
  rationale: Padanan ringkas dan lazim yang mempertahankan metafora serta hubungan genitif dalam bahasa Indonesia.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Siapa yang mengikuti Aku
  rationale: Menyampaikan partisipel substantival sebagai pernyataan yang berlaku bagi setiap orang tanpa mengubahnya menjadi jamak tertentu.
- source_word: οὐ μὴ περιπατήσῃ
  choice: sama sekali tidak akan berjalan
  rationale: “Sama sekali tidak” mempertahankan kekuatan penyangkalan οὐ μὴ, sedangkan “berjalan” mempertahankan metafora περιπατέω.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dalam kegelapan
  rationale: Mempertahankan gambaran kegelapan sebagai ranah kehidupan; bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: ἕξει
  choice: akan memiliki
  rationale: Padanan masa depan yang jelas dan alami untuk ἕξει.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: terang kehidupan
  rationale: Mempertahankan hubungan genitif yang padat dan terbuka, tanpa membatasinya hanya pada arti terang yang memberi kehidupan.
theological_decisions:
- issue: Daya teologis identifikasi Ἐγώ εἰμι
  choice: Menerjemahkannya sebagai “Akulah” dalam pernyataan berpredikat “terang dunia”.
  alternative: Memberi penekanan tambahan untuk menandai secara eksplisit kemungkinan gema nama ilahi.
  rationale: Dalam ayat ini Ἐγώ εἰμι secara gramatikal diikuti predikat. Terjemahan mengikuti sintaksis itu sambil membiarkan gema teologis Yohanes tetap dapat didengar tanpa dipaksakan.
- issue: Makna τὸ φῶς τῆς ζωῆς
  choice: Mempertahankan frasa “terang kehidupan”.
  alternative: “terang yang memberi kehidupan” atau “terang yang menghidupkan”.
  rationale: Hubungan genitifnya dapat menunjuk pada sumber, sifat, atau terang yang menghasilkan kehidupan. Bentuk yang lebih formal mempertahankan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Metafora “berjalan”, “terang”, dan “kegelapan” dipertahankan.
