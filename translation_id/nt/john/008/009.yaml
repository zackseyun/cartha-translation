  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: id
  text: Namun, mereka[a] yang mendengar perkataan itu, karena ditegur oleh hati nurani mereka, pergi satu per satu, mulai dari yang lebih tua sampai yang terakhir.[b] Yesus ditinggalkan seorang diri, sementara perempuan itu tetap berdiri di tengah-tengah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan kelanjutan kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
  - marker: b
    text: Secara harfiah, “hingga mereka yang terakhir.” Ungkapan Yunani ini tidak secara tegas mengatakan “hingga yang termuda.”
    reason: translation_ambiguity
lexical_decisions:
- source_word: συνείδησις
  choice: hati nurani
  rationale: Istilah ini menunjuk pada kesadaran batin yang menilai benar dan salah; “hati nurani” merupakan padanan Indonesia yang baku dan alami.
- source_word: ἐλέγχω
  choice: ditegur
  rationale: Bentuk pasif ini menggambarkan hati nurani yang menyatakan kesalahan dan menggugah rasa bersalah. “Ditegur” mempertahankan unsur penyingkapan atau koreksi tanpa menjelaskan proses batin itu secara berlebihan.
- source_word: πρεσβύτερος
  choice: yang lebih tua
  rationale: Dalam rangkaian ini kata tersebut paling wajar menunjuk pada usia atau senioritas, bukan jabatan resmi “penatua”.
- source_word: ἔσχατος
  choice: orang yang terakhir
  rationale: Pilihan ini mempertahankan arti urutan dalam teks sumber tanpa menyimpulkan bahwa yang dimaksud pasti “yang termuda”.
- source_word: ἐν μέσῳ
  choice: di tengah-tengah
  rationale: Padanan ini mempertahankan gambaran perempuan itu masih berdiri di tengah tempat ia sebelumnya dihadapkan kepada orang banyak.
theological_decisions:
- issue: Yesus disebut tinggal seorang diri meskipun perempuan itu masih ada
  choice: “tinggallah Yesus seorang diri, dan perempuan itu tetap berdiri”
  alternative: “hanya Yesus yang tetap bersama perempuan itu”
  rationale: Teks Yunani mempertahankan kedua pernyataan tersebut secara berdampingan. Terjemahan ini tidak menghapus ketegangan ungkapannya; “seorang diri” dapat dipahami dalam kaitannya dengan para penuduh yang telah pergi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan gerak narasi Yunani serta pengulangan “seorang demi seorang,” tanpa mengubah “yang terakhir” menjadi “yang termuda” atau “penatua” menjadi jabatan resmi.
