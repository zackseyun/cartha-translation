  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: id
  text: Ada banyak hal untuk Kukatakan dan Kuhakimi tentang kamu.[a] Namun, Dia yang mengutus Aku adalah benar, dan apa yang Kudengar dari-Nya, itulah yang Kusampaikan kepada dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengenai kamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “apa yang Kudengar dari-Nya, hal-hal itulah yang Kusampaikan kepada dunia.” Kata Yunani mengulangi kata tunjuk untuk memberi penekanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: banyak yang
  rationale: Adjektiva netral jamak yang dipakai secara substantival; ungkapan ini alami dalam bahasa Indonesia dan mencakup banyak hal yang dapat dikatakan serta dihakimi.
- source_word: περὶ ὑμῶν
  choice: tentang kamu
  rationale: περί dengan genitif menyatakan pokok atau acuan. 'Tentang kamu' alami dan tetap dapat mencakup perkataan maupun penghakiman yang berkenaan dengan para pendengar.
- source_word: λαλεῖν
  choice: Kukatakan
  rationale: Dalam pasangan infinitif dengan κρίνειν, 'Kukatakan' terdengar alami dan menyampaikan tindakan bertutur.
- source_word: κρίνειν
  choice: Kuhakimi
  rationale: '''Menghakimi'' mempertahankan cakupan umum κρίνω tanpa mempersempitnya menjadi ''menghukum'' atau ''menjatuhkan vonis''.'
- source_word: ὁ πέμψας με
  choice: Dia yang mengutus Aku
  rationale: Partisipel berartikel diterjemahkan sebagai frasa substantival yang alami tanpa menambahkan sebutan 'Bapa' yang tidak dinyatakan dalam ayat ini.
- source_word: ἀληθής
  choice: benar
  rationale: '''Benar'' mempertahankan kemungkinan makna benar, tulus, atau dapat dipercaya tanpa mempersempit nuansa Yohanes.'
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: apa yang Kudengar dari-Nya
  rationale: Menyampaikan isi yang didengar dari Sang Pengutus secara alami dan akurat.
- source_word: ταῦτα
  choice: itulah
  rationale: Kata tunjuk eksplisit yang merujuk kembali pada 'apa yang Kudengar' dipertahankan secara idiomatis sekaligus memberi penekanan.
- source_word: λαλῶ
  choice: Kusampaikan
  rationale: '''Kusampaikan'' alami untuk ujaran yang diarahkan kepada khalayak dan menghindari pengulangan kaku, sambil tetap menyatakan tindakan berbicara.'
- source_word: εἰς τὸν κόσμον
  choice: kepada dunia
  rationale: Dengan verba berbicara, εἰς menyatakan arah kepada penerima; 'kepada dunia' merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Rujukan 'Dia yang mengutus Aku'
  choice: Rujukan implisit kepada Bapa dipertahankan tanpa menyebut 'Bapa' secara eksplisit.
  alternative: Namun, Bapa yang mengutus Aku adalah benar.
  rationale: Konteks Injil Yohanes memperjelas rujukannya, tetapi teks Yunani ayat ini memakai ungkapan partisipial dan tidak menyebut Bapa secara langsung.
- issue: Daya makna κρίνειν
  choice: Diterjemahkan 'Kuhakimi' dalam arti luas.
  alternative: '''Kuhukum'' atau ''Kujatuhi vonis.'''
  rationale: Rentang makna κρίνω mencakup menilai dan menghakimi; konteks ini tidak mengharuskan arti yang lebih sempit berupa penghukuman.
- issue: Makna ἀληθής
  choice: Diterjemahkan 'benar'.
  alternative: '''Dapat dipercaya'' atau ''jujur''.'
  rationale: '''Benar'' menjaga resonansi teologis dan ambiguitas antara kebenaran, ketulusan, dan keterandalan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat berhuruf kapital pada kata ganti yang merujuk kepada Yesus dan Sang Pengutus mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan dibuat alami tanpa menghapus penekanan ταῦτα.
