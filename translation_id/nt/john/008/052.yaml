  terminology: “Orang-orang Yahudi,” “kerasukan setan,” “firman-Ku,” dan sapaan “Engkau” sesuai dengan register serta tidak menambahkan penafsiran kelompok lawan. “Mengecap kematian” mempertahankan idiom sumber dan ketegangan teologisnya.
