  to: Orang-orang Yahudi berkata kepada-Nya, “Sekarang kami tahu bahwa Engkau kerasukan setan.[a] Abraham sudah mati, demikian juga para nabi, tetapi Engkau berkata, ‘Jika seseorang menuruti firman-Ku, ia pasti tidak akan pernah mengecap kematian.’[b]”
