  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: id
  text: Orang-orang Yahudi berkata kepada-Nya, “Sekarang kami tahu bahwa Engkau kerasukan setan.[a] Abraham sudah mati, demikian juga para nabi, tetapi Engkau berkata, ‘Jika seseorang menuruti firman-Ku, ia pasti tidak akan pernah mengecap kematian.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Engkau mempunyai setan.”'
    reason: lexical_alternative
  - marker: b
    text: Frasa Yunani ini secara harfiah mencakup “untuk selama-lamanya.” Bentuk ini merupakan penyangkalan yang sangat tegas, yang berarti bahwa ia sama sekali tidak akan mengecap kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Orang-orang Yahudi
  rationale: Terjemahan langsung bagi kelompok yang menentang Yesus dalam konteks ini; 'para pemimpin Yahudi' akan menambahkan penafsiran yang tidak dinyatakan secara eksplisit.
- source_word: Νῦν ἐγνώκαμεν
  choice: Sekarang kami tahu
  rationale: Menyampaikan keadaan mengetahui yang timbul dari suatu kesimpulan, dengan ungkapan Indonesia yang alami.
- source_word: δαιμόνιον ἔχεις
  choice: Engkau kerasukan setan
  rationale: Padanan Indonesia yang alami bagi idiom Yunani harfiah 'mempunyai setan'; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Abraham sudah mati, demikian juga para nabi
  rationale: '''Sudah mati'' menonjolkan fakta kematian yang menjadi dasar keberatan mereka, sedangkan ''demikian juga'' menyatakan koordinasi καί secara alami.'
- source_word: καὶ σὺ λέγεις
  choice: tetapi Engkau berkata
  rationale: καί memiliki daya pertentangan dalam konteks ini, yang wajar dinyatakan dengan 'tetapi'.
- source_word: Ἐάν τις
  choice: Jika seseorang
  rationale: Mempertahankan sifat umum dan tidak terbatas dari syarat tersebut.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: menuruti firman-Ku
  rationale: τηρέω di sini mencakup memegang dan menaati; 'menuruti' alami dalam bahasa Indonesia, sedangkan 'firman' mempertahankan bobot λόγος dalam ucapan Yesus.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: ia pasti tidak akan pernah mengalami kematian
  rationale: οὐ μή dinyatakan melalui 'pasti tidak akan pernah', sementara idiom 'mengecap kematian' disampaikan secara alami sebagai 'mengalami kematian'. εἰς τὸν αἰῶνα tercakup dalam 'tidak akan pernah', sehingga tidak menimbulkan frasa Indonesia yang janggal.
theological_decisions:
- issue: Makna janji Yesus mengenai kematian
  choice: Memakai ungkapan netral 'mengalami kematian' tanpa menentukan jenis kematian yang dimaksud
  alternative: mengecap kematian; tidak mengalami kematian jasmani; tidak mengalami kematian rohani atau kekal
  rationale: Konteks mempertahankan ketegangan antara pemahaman para penentang tentang kematian Abraham dan para nabi dengan maksud ucapan Yesus. Terjemahan tidak menetapkan apakah kematian itu terutama jasmani, rohani, atau eskatologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai 'Engkau' dan enklitik hormat '-Nya'. Tanda baca menempatkan penanda catatan kaki langsung sesudah ungkapan yang dijelaskan.
