  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: id
  text: Yesus menjawab, “Jika Aku memuliakan diri-Ku sendiri, kemuliaan-Ku tidak berarti apa-apa. Bapa-Kulah yang memuliakan Aku, yang kamu katakan adalah Allah kita.[a]”
