lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang baku dan alami untuk ἀποκρίνομαι dalam percakapan.
- source_word: δοξάσω / δοξάζων
  choice: memuliakan
  rationale: Mempertahankan bobot teologis tema kemuliaan dalam Injil Yohanes, bukan sekadar makna menghormati.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: kemuliaan-Ku tidak berarti apa-apa
  rationale: Mengungkapkan οὐδέν secara alami dalam bahasa Indonesia sambil mempertahankan bahwa kemuliaan yang berasal dari diri sendiri tidak memiliki nilai atau bobot.
- source_word: ὁ πατήρ μου ὁ δοξάζων με
  choice: Bapa-Kulah yang memuliakan Aku
  rationale: Konstruksi fokus -lah secara alami menandai Bapa sebagai pihak yang memuliakan Yesus dan mencerminkan fungsi partisipel artikular.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: Dia yang kamu katakan sebagai ‘Allah kita’
  rationale: Mempertahankan rujukan relatif kepada Bapa serta isi pernyataan lawan bicara; ‘kamu’ dipakai sebagai sapaan jamak yang tidak membedakan jumlah dalam bahasa Indonesia.
- source_word: θεὸς
  choice: Allah
  rationale: Dalam konteks ini menunjuk kepada Allah Israel; ‘Allah’ merupakan padanan baku dalam bahasa Indonesia.
- source_word: ἡμῶν
  choice: kita
  rationale: Mengikuti teks SBLGNT ἡμῶν dan memakai ‘kita’ karena pihak yang disapa termasuk dalam lingkup klaim tentang Allah bersama; varian ὑμῶν dicatat dalam catatan kaki.
theological_decisions:
- issue: Pronomina dalam θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: Allah kita
  alternative: Allahmu
  rationale: Teks utama mengikuti bacaan SBLGNT ἡμῶν (‘kita/kami’). ‘Kita’ dipilih agar klaim yang dikutip mencakup pembicara dan pendengar, sedangkan bacaan varian ὑμῶν (‘Allahmu’) dipertahankan dalam catatan kaki karena berpengaruh pada nuansa perdebatan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk ‘Bapa-Kulah’ memberi fokus yang alami tanpa menambahkan identitas atau penafsiran doktrinal.
