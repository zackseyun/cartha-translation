  text: Καὶ πάλιν κάτω κύψας ἔγραφεν εἰς τὴν γῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/008.yaml
  text: And again[a], he stooped down and wrote on the ground.
translation:
  language: id
  text: Lalu Ia membungkuk lagi[a] dan menulis di tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini melanjutkan kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: καὶ πάλιν
  choice: lalu ... lagi
  rationale: Καί melanjutkan alur narasi, sedangkan πάλιν menyatakan pengulangan tindakan; susunan ini alami dalam bahasa Indonesia.
- source_word: κάτω κύψας
  choice: membungkuk
  rationale: Partisip aoristus κύψας bersama κάτω menggambarkan gerakan membungkukkan tubuh ke bawah. Dalam bahasa Indonesia, 'membungkuk' sudah secara alami mencakup arah tersebut.
- source_word: ἔγραφεν
  choice: menulis
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang berlangsung, tetapi dalam narasi bahasa Indonesia 'menulis' mempertahankan aspek yang tidak dibatasi tanpa harus mempertegasnya sebagai 'terus menulis'.
- source_word: εἰς τὴν γῆν
  choice: di tanah
  rationale: Walaupun εἰς secara harfiah sering menyatakan arah, dengan γράφω frasa ini secara idiomatis menunjuk pada permukaan tempat tulisan dibuat. 'Di tanah' adalah padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Status tekstual Yohanes 7:53–8:11
  choice: Teks ayat diterjemahkan dan diberi penanda catatan tekstual setelah 'lagi'.
  alternative: Menghilangkan perikop dari teks utama atau menaruh seluruhnya hanya dalam catatan.
  rationale: Sumber yang ditetapkan, Robinson-Pierpont 2005 Byzantine, memuat ayat ini. Catatan mempertahankan transparansi mengenai persoalan tekstual tanpa menghapus bacaan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan wajar. Pronomina 'Ia' dipakai dengan kapitalisasi konvensional untuk merujuk kepada Yesus tanpa menambahkan unsur yang tidak terdapat dalam teks Yunani.
