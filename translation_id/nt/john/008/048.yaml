source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: id
  text: Orang-orang Yahudi itu[a] menjawab dan berkata kepada-Nya, “Bukankah kami benar ketika berkata bahwa Engkau adalah orang Samaria dan kerasukan setan?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam beberapa konteks, sebutan ini dapat diterjemahkan “orang-orang Yudea” atau dipahami sebagai kelompok pemimpin Yahudi. Dalam Injil Yohanes, sebutan “orang-orang Yahudi” sering menunjuk kepada kelompok tertentu yang menentang Yesus, bukan kepada setiap orang Yahudi tanpa kecuali.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “mempunyai setan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: menjawab
  rationale: Bentuk aoris deponen ini berarti ‘menjawab’; padanan langsung ini sesuai dengan gaya naratif Yohanes.
- source_word: οἱ Ἰουδαῖοι
  choice: Orang-orang Yahudi itu
  rationale: Ungkapan Yunani secara harfiah menunjuk kepada ‘orang-orang Yahudi’. Kata ‘itu’ menandai kelompok tertentu dalam adegan ini tanpa mempersempitnya secara tidak tersurat menjadi para pemimpin atau orang Yudea.
- source_word: καὶ εἶπαν αὐτῷ
  choice: dan berkata kepada-Nya
  rationale: Mempertahankan kedua verba dalam teks Yunani, meskipun dalam bahasa Indonesia terasa agak berulang, sehingga corak penceritaannya tetap terlihat.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Bukankah benar perkataan kami
  rationale: Pertanyaan dengan Οὐ mengharapkan jawaban ya; rumusan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada ‘kami’ yang dinyatakan oleh ἡμεῖς.
- source_word: Σαμαρίτης
  choice: orang Samaria
  rationale: Padanan langsung bagi sebutan etnis-keagamaan yang digunakan sebagai penghinaan dalam konteks ini.
- source_word: δαιμόνιον ἔχεις
  choice: kerasukan setan
  rationale: Secara harfiah berarti ‘mempunyai setan’, tetapi dalam pemakaian Indonesia modern ungkapan itu tidak alami dan mudah disalahpahami sebagai kepemilikan; ‘kerasukan setan’ menyampaikan maksud tuduhan tersebut secara jelas.
theological_decisions:
- issue: Cakupan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: Orang-orang Yahudi itu
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks utama mempertahankan sebutan umum Yunani sambil memakai ‘itu’ untuk menunjukkan kelompok tertentu yang sedang berbicara. Catatan kaki mencegah pembacaan seolah-olah tuduhan ini berasal dari semua orang Yahudi tanpa kecuali.
- issue: Ungkapan δαιμόνιον ἔχεις
  choice: kerasukan setan
  alternative: mempunyai setan
  rationale: Pilihan utama mengungkapkan makna idiomatis tuduhan itu dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat untuk menjaga transparansi terhadap susunan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘menjawab dan berkata’ dipertahankan untuk mencerminkan bentuk Yunani. Sapaan kepada Yesus memakai ‘Engkau’ dan pronomina naratif ‘-Nya’, sesuai register Alkitab Indonesia yang tetap mudah dipahami.
