base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: id
  text: Maka mereka bertanya kepada-Nya, “Siapakah Engkau?” Yesus berkata kepada mereka, “Sejak semula, itulah yang Kukatakan kepadamu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Yunani ini sukar dipahami. Ungkapan tersebut juga dapat dibaca sebagai pertanyaan: “Mengapa Aku masih berbicara kepadamu?”'
    reason: Mempertahankan ambiguitas sintaksis dan kemungkinan tanda baca alternatif bagi Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν, tanpa menyajikan pembacaan alternatif itu sebagai makna pasti.
lexical_decisions:
- source_word: ἔλεγον
  choice: bertanya
  rationale: Bentuk imperfek secara harfiah berarti ‘mereka berkata’, tetapi dalam konteks ujaran interogatif bahasa Indonesia, ‘bertanya’ menyampaikan fungsi tuturan secara alami.
- source_word: Σὺ τίς εἶ;
  choice: Siapakah Engkau?
  rationale: Mempertahankan penekanan pada ‘Engkau’ dan pertanyaan tentang identitas Yesus dalam ragam yang wajar serta bermartabat.
- source_word: Τὴν ἀρχὴν
  choice: sejak semula
  rationale: Mengikuti pemahaman adverbial temporal yang paling sesuai dengan alur jawaban dan tercermin dalam lapisan konsultasi Inggris, sambil mencatat analisis alternatif dalam catatan kaki.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: seperti yang ... sudah Kukatakan kepadamu
  rationale: Ungkapan Yunani sangat padat dan sulit. ‘Seperti yang’ menghasilkan jawaban identitas yang alami dalam bahasa Indonesia tanpa menyisipkan gelar atau rumusan identitas yang tidak disebutkan dalam teks.
theological_decisions:
- issue: Identitas Yesus tidak dinyatakan ulang secara eksplisit dalam jawaban
  choice: Aku adalah seperti yang sejak semula sudah Kukatakan kepadamu
  alternative: Sejak semula, Aku sudah mengatakan kepadamu siapa Aku
  rationale: Pilihan utama menjaga sifat jawaban Yunani yang padat dan tidak menambahkan objek ‘siapa Aku’ secara eksplisit, sekaligus tetap dapat dipahami sebagai jawaban atas pertanyaan tentang identitas.
- issue: Ambiguitas sintaksis Τὴν ἀρχὴν
  choice: Memakai pembacaan temporal ‘sejak semula’ dalam teks utama
  alternative: ‘Mengapa Aku masih berbicara kepadamu?’ atau ‘Mengapa Aku berbicara kepadamu sama sekali?’
  rationale: Teks Yunani memungkinkan analisis alternatif yang menjadikan ucapan Yesus sebuah pertanyaan. Karena perbedaan ini nyata dan dapat memengaruhi nada teologis perikop, alternatif dicatat dan tidak dihapus secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. ‘Maka’ menghubungkan pertanyaan ini dengan pernyataan sebelumnya tanpa memberi kesan kesimpulan kausal yang terlalu kuat.
