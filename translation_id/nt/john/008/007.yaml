  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: id
  text: Namun, ketika mereka terus bertanya kepada-Nya,[a] Ia menegakkan diri dan berkata kepada mereka, “Siapa di antara kalian yang tidak berdosa, hendaklah ia yang pertama melemparkan batu kepada perempuan ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan bagian dari kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11), yang tidak terdapat dalam naskah-naskah Yunani paling awal. Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: terus-menerus bertanya
  rationale: Bentuk imperfek ἐπέμενον bersama partisipel kini ἐρωτῶντες menyatakan tindakan bertanya yang berlangsung dan dilakukan dengan gigih.
- source_word: ἀνακύψας
  choice: Ia bangkit
  rationale: Dalam konteks Yesus sebelumnya membungkuk untuk menulis di tanah, frasa ini menyatakan gerakan menegakkan tubuh atau bangkit kembali; 'bangkit' alami dan ringkas dalam bahasa Indonesia.
- source_word: ἀναμάρτητος
  choice: tidak berdosa
  rationale: Adjektiva langka ini berarti 'tanpa dosa' atau 'tidak bersalah'. 'Tidak berdosa' mempertahankan bobot moral ungkapan itu tanpa membatasinya hanya pada perkara hukum yang sedang dituduhkan.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: hendaklah ia yang pertama melemparkan batu
  rationale: Menyampaikan imperatif orang ketiga βαλέτω dan penekanan πρῶτος secara alami serta bermartabat.
- source_word: ἐπ’ αὐτήν
  choice: kepada perempuan ini
  rationale: Pronomina feminin merujuk kepada perempuan yang hadir dalam adegan. Penyebutan eksplisit menghindari ketidakjelasan pronomina Indonesia tanpa menambah identitas baru.
theological_decisions:
- issue: Cakupan ἀναμάρτητος
  choice: tidak berdosa
  alternative: tidak bersalah dalam perkara ini
  rationale: Teks Yunani tidak secara eksplisit membatasi ketiadaan dosa pada dosa tertentu atau pada kelayakan hukum sebagai saksi. Terjemahan mempertahankan keluasan dan ketegangan moral ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Sapaan jamak 'kalian' dipilih agar pembedaan bentuk jamak ὑμῶν tetap jelas dan ujaran langsung terdengar alami. Penanda catatan ditempatkan setelah klausa pembuka agar tidak mengganggu perkataan Yesus.
