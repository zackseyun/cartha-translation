  source_fidelity: 'Semua kontras utama dipertahankan dengan baik: pronomina jamak dan tunggal yang eksplisit, asal “dari bawah/dari atas,” serta pengulangan “dari dunia ini.” Namun, “terus berkata” dapat menyiratkan bahwa Yesus melanjutkan perkataan secara berulang atau tanpa henti, lebih kuat daripada fungsi lazim imperfek ἔλεγεν sebagai pengantar ujaran dalam narasi. “Ia berkata” menyampaikan ujaran tersebut tanpa menambahkan nuansa kesinambungan yang tidak pasti.'
  naturalness: Susunan paralel “Kalian berasal ...; Aku berasal ...” alami, jelas, dan memiliki daya retoris yang baik dalam bahasa Indonesia modern. “Ia berkata kepada mereka” lebih idiomatis daripada “Ia terus berkata kepada mereka” dalam pengantar dialog naratif.
