base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Kalian berasal dari bawah; Aku berasal dari atas. Kalian berasal dari dunia ini[a]; Aku bukan berasal dari dunia ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Injil Yohanes, “dunia” sering kali bukan hanya berarti bumi secara fisik, melainkan juga tatanan manusia yang terasing dari Allah.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: terus berkata
  rationale: Bentuk imperfek menyajikan tindakan berkata sebagai sesuatu yang sedang berlangsung dalam konteks; “terus berkata” mempertahankan aspek itu dengan bahasa Indonesia yang wajar.
- source_word: Ὑμεῖς / ἐγὼ
  choice: Kalian / Aku
  rationale: Pronomina eksplisit dipertahankan untuk menonjolkan pertentangan antara para pendengar Yesus dan diri-Nya. “Kalian” memperjelas bahwa Ὑμεῖς berbentuk jamak.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: berasal dari bawah / berasal dari atas
  rationale: Pilihan ini mempertahankan konstruksi ἐκ serta citra vertikal dan paralel yang disengaja, tanpa mempersempitnya menjadi penjelasan moral atau kosmologis tertentu.
- source_word: κόσμος
  choice: dunia
  rationale: “Dunia” merupakan padanan luas dan alami bagi κόσμος serta membiarkan nuansa khas Yohanes ditentukan oleh konteks.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: dunia ini
  rationale: Demonstratif dipertahankan, sedangkan dua susunan kata Yunani diterjemahkan secara alami dengan frasa Indonesia yang sama.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: Aku bukan berasal dari dunia ini
  rationale: Ungkapan ini mempertahankan gagasan sumber atau asal dalam konstruksi ἐκ dan pengulangan pola klausa sebelumnya; “bukan bagian dari” akan lebih menekankan afiliasi.
theological_decisions:
- issue: Makna pertentangan “dari bawah/dari atas” dan “dunia ini”
  choice: Mempertahankan bahasa asal dan ranah melalui “berasal dari bawah/atas” serta “berasal dari dunia ini”.
  alternative: Menjelaskannya secara eksplisit sebagai pertentangan moral, atau sebagai bumi berlawanan dengan surga.
  rationale: Teks menampilkan pertentangan khas Yohanes yang tajam, tetapi tidak menguraikan seluruh maknanya dalam ayat ini. Terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut melalui parafrasa yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” digunakan agar bentuk jamak dari Ὑμεῖς terlihat jelas. Pengulangan “berasal dari” sengaja dipertahankan untuk mencerminkan kesejajaran retoris teks Yunani.
