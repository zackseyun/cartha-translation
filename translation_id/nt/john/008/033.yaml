  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: id
  text: Mereka menjawab-Nya, “Kami adalah keturunan Abraham[a] dan tidak pernah diperbudak oleh siapa pun.[b] Bagaimana mungkin Engkau berkata, ‘Kalian akan menjadi bebas’?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih Abraham.” Kata Yunani berbentuk tunggal dipakai secara kolektif untuk menyatakan keturunan jasmani.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak pernah menjadi hamba siapa pun.” Kata kerja ini juga dapat berarti “melayani,” tetapi dalam konteks ini makna perbudakan lebih menonjol.
    reason: lexical_alternative
  - marker: c
    text: Atau, “Kalian akan bebas.” Teks Yunani secara lebih harfiah menyatakan, “Kalian akan menjadi bebas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Mereka menjawab-Nya
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyatakan bahwa jawaban itu ditujukan langsung kepada Yesus, tanpa meniru konstruksi Yunani secara kaku.
- source_word: Σπέρμα Ἀβραάμ
  choice: keturunan Abraham
  rationale: Dalam konteks ini σπέρμα merupakan nomina tunggal kolektif yang menunjuk pada garis keturunan jasmani. “Keturunan Abraham” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: tidak pernah diperbudak oleh siapa pun
  rationale: Bentuk perfektum δεδουλεύκαμεν menyatakan keadaan perbudakan yang diklaim tidak pernah mereka alami; πώποτε dan οὐδενὶ secara alami diterjemahkan “tidak pernah ... oleh siapa pun.”
- source_word: πῶς σὺ λέγεις
  choice: Bagaimana mungkin Engkau berkata
  rationale: Ungkapan ini menyampaikan nada tidak percaya atau keberatan dalam pertanyaan tersebut. Kata ganti σὺ yang eksplisit tercermin dalam penyebutan “Engkau.”
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Kalian akan menjadi merdeka
  rationale: “Menjadi” mempertahankan gagasan peralihan dalam γενήσεσθε, sedangkan “merdeka” menyatakan lawan dari keadaan diperbudak. “Kalian” menunjukkan bahwa kata kerja Yunani berbentuk jamak.
theological_decisions:
- issue: Makna δουλεύω dalam pertentangan antara perbudakan dan kemerdekaan
  choice: diperbudak
  alternative: melayani; menjadi hamba
  rationale: Konteks langsung membahas budak dan kemerdekaan (ayat 34–36). “Diperbudak” mempertahankan daya sosial dan teologis dari ikatan tersebut tanpa melemahkannya menjadi pelayanan biasa.
- issue: Makna Σπέρμα Ἀβραάμ
  choice: keturunan Abraham
  alternative: benih Abraham; anak cucu Abraham
  rationale: Ungkapan ini menyatakan klaim garis keturunan Abraham. Pilihan ini tidak memasukkan nuansa teologis dari konteks lain dan tetap mencerminkan penggunaan kolektifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai “Engkau,” sedangkan bentuk jamak “kalian” memperjelas jumlah gramatikal tanpa menambah tafsiran. Istilah “diperbudak” dan “merdeka” mempertahankan pertentangan utama dalam konteks.
