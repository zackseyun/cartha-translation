  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: id
  text: Yesus menjawab[a], “Aku tidak mempunyai setan, melainkan Aku menghormati Bapa-Ku, dan kalian menghina Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “Aku tidak kerasukan setan.”
    reason: Alternatif ini menjelaskan makna idiomatis ungkapan Yunani “mempunyai setan” tanpa menggantikannya dalam teks utama.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang baku dan alami untuk verba tanggapan dalam dialog.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: Aku tidak mempunyai setan
  rationale: Mempertahankan secara dekat ungkapan Yunani ‘mempunyai setan’; makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menandai pertentangan tegas antara tuduhan bahwa Yesus mempunyai setan dan kenyataan bahwa Ia menghormati Bapa-Nya.
- source_word: τιμῶ
  choice: menghormati
  rationale: Padanan langsung yang sekaligus mempertahankan kontras leksikal dengan ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: Bapa-Ku
  rationale: Dalam konteks Yohanes, sebutan ini merujuk kepada Allah sebagai Bapa Yesus; kapitalisasi menandai rujukan ilahi tanpa menambah isi.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina jamak eksplisit dalam bahasa Yunani diterjemahkan dengan bentuk jamak Indonesia yang jelas dan modern.
- source_word: ἀτιμάζετέ με
  choice: kalian tidak menghormati Aku
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras ‘menghormati/tidak menghormati’; bentuk positif ‘menghina’ lebih tajam dan lebih sempit.
theological_decisions:
- issue: Makna ungkapan ‘mempunyai setan’
  choice: Ungkapan langsung dipertahankan dalam teks utama.
  alternative: “Aku tidak kerasukan setan.”
  rationale: Bahasa sumber secara harfiah memakai δαιμόνιον ... ἔχω, ‘mempunyai setan’. Alternatif menyatakan makna idiomatis yang mungkin tetapi lebih interpretatif.
- issue: Rujukan ‘Bapa-Ku’
  choice: Dipahami sebagai sebutan Yesus bagi Allah dan ditulis dengan huruf kapital.
  alternative: “bapaku” sebagai hubungan keluarga biasa
  rationale: Konteks Injil Yohanes dengan jelas mengidentifikasi Bapa yang disebut Yesus sebagai Allah, sedangkan kapitalisasi tidak mengubah kata-kata sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Aku’ dipakai dalam ucapan Yesus sesuai gaya dialog Alkitab Indonesia, sedangkan ‘kalian’ memperjelas bahwa ὑμεῖς berbentuk jamak. Kontras τιμῶ/ἀτιμάζετε dipertahankan sebagai ‘menghormati/tidak menghormati’.
