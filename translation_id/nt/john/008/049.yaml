  naturalness: Teks revisi tetap baku dan alami dalam bahasa Indonesia modern. “Aku tidak mempunyai setan” sengaja mempertahankan idiom sumber yang agak harfiah, dengan alternatif idiomatis dalam catatan kaki.
  terminology: “Bapa-Ku” tepat dalam konteks Yohanes dan kapitalisasi tepat untuk rujukan kepada Allah. Pasangan “menghormati/menghina” menyampaikan kontras τιμῶ/ἀτιμάζετε dengan lebih akurat daripada “menghormati/tidak menghormati.”
