  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: id
  text: Bahkan dalam hukum kalian tertulis bahwa kesaksian dua orang itu benar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesaksian dua manusia itu benar.” Kata Yunani yang dipakai dapat merujuk kepada manusia secara umum; dalam konteks ini, kepada dua saksi manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: hukum
  rationale: Merujuk pada hukum atau korpus Kitab Suci Yahudi yang dijadikan dasar oleh Yesus. Huruf kecil mempertahankan nuansa hukum dalam frasa polemis ini tanpa membatasi rujukan secara tegas hanya pada Taurat sebagai judul formal.
- source_word: ὑμετέρῳ
  choice: kalian
  rationale: Kata ganti posesif orang kedua jamak dipertahankan dalam frasa 'hukum kalian', sehingga jarak retoris dalam perkataan Yesus tetap terasa tanpa penajaman tambahan seperti 'hukum kalian sendiri'.
- source_word: γέγραπται
  choice: tertulis
  rationale: Rumus kutipan Kitab Suci ini alami dalam bahasa Indonesia dan tetap menyampaikan bahwa ketentuan tersebut telah tertulis serta terus berlaku sebagai rujukan.
- source_word: δύο ἀνθρώπων
  choice: dua orang
  rationale: Dalam bahasa Indonesia, 'orang' merupakan padanan alami bagi ἀνθρώπων dalam ungkapan hukum ini dan tidak memaksakan jenis kelamin yang tidak ditandai secara khusus oleh nomina Yunani ἄνθρωπος.
- source_word: μαρτυρία
  choice: kesaksian
  rationale: Padanan yuridis yang tepat dan alami bagi μαρτυρία dalam konteks pembuktian oleh para saksi.
- source_word: ἀληθής
  choice: benar
  rationale: Mempertahankan arti langsung ἀληθής, sementara implikasi bahwa kesaksian itu sah atau dapat diterima secara hukum tetap dibiarkan tersirat.
- source_word: καὶ ... δὲ
  choice: Bahkan
  rationale: Dalam konteks Indonesia, 'bahkan' menangkap daya penekanan gabungan partikel tersebut dengan lebih alami daripada meniru kedua penghubung secara mekanis.
theological_decisions:
- issue: Daya retoris frasa 'hukum kalian'
  choice: Mempertahankan sapaan langsung 'hukum kalian'.
  alternative: hukum itu; hukum kalian sendiri
  rationale: Bahasa Yunani secara eksplisit memuat posesif orang kedua jamak. Pilihan ini menjaga ketegangan retoris tanpa menyiratkan bahwa Yesus menolak hukum tersebut atau memperkeras nada melebihi teks.
- issue: Cakupan ἀνθρώπων dalam kaidah hukum
  choice: Menerjemahkannya sebagai 'orang'.
  alternative: laki-laki; manusia
  rationale: ἄνθρωπος lazim berarti manusia atau orang, termasuk dalam ungkapan hukum mengenai saksi. 'Dua orang' paling alami dan akurat dalam bahasa Indonesia; catatan mencatat alternatif harfiah/tradisional bila ungkapan itu dipahami sebagai saksi laki-laki.
- issue: Makna hukum dari ἀληθής
  choice: Mempertahankan 'benar'.
  alternative: sah; dapat dipercaya
  rationale: Teks memakai kata yang secara langsung berarti 'benar'. Konteks memberi nuansa keabsahan hukum, tetapi menerjemahkannya sebagai 'sah' akan menyelesaikan nuansa semantis yang sengaja tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; susunan kalimat dibuat alami tanpa menghilangkan penekanan dan ketegangan retoris teks Yunani.
