source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: id
  text: Namun, kamu tidak mengenal Dia[a], sedangkan Aku mengenal Dia. Jika Aku berkata[b] bahwa Aku tidak mengenal Dia, Aku akan menjadi pendusta seperti kamu. Akan tetapi, Aku mengenal Dia dan memegang teguh firman-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kamu belum mengenal Dia.” Bentuk perfek Yunani menyoroti keadaan mereka yang tetap tidak sungguh-sungguh mengenal-Nya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “Seandainya Aku berkata” atau “Kalaupun Aku berkata.” Konstruksi Yunani ini menyatakan pengandaian dan dapat pula bernuansa konsesif.
    reason: lexical_alternative
  - marker: c
    text: “Memegang teguh” juga dapat diterjemahkan “menaati,” “menuruti,” atau “menjaga.” Dalam tulisan Yohanes, kata ini dapat mencakup kesetiaan dalam memelihara firman Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: belum mengenal
  rationale: Bentuk perfek menyatakan keadaan yang terus berlaku sebagai akibat dari kegagalan mengenal sebelumnya. Frasa “belum mengenal” terdengar alami dalam bahasa Indonesia dan mempertahankan perbedaan dengan οἶδα.
- source_word: οἶδα
  choice: mengenal
  rationale: Walaupun berbentuk perfek secara morfologis, οἶδα berfungsi sebagai verba statif kini. “Mengenal” sesuai untuk pengetahuan pribadi tentang Allah dalam konteks ini.
- source_word: κἂν εἴπω
  choice: Jika Aku berkata
  rationale: Konstruksi ini menyatakan pengandaian. Bentuk Indonesia ini alami dan tidak menentukan secara berlebihan apakah tekanannya bersifat hipotetis atau konsesif.
- source_word: ἔσομαι
  choice: Aku akan menjadi
  rationale: Bentuk futur dipertahankan secara alami sebagai akibat dalam kalimat bersyarat.
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: pendusta seperti kamu
  rationale: Terjemahan ini mempertahankan tuduhan langsung dan daya banding ungkapan Yunani; “kamu” dapat merujuk kepada kelompok lawan bicara sebagaimana lazim dalam bahasa Indonesia.
- source_word: τὸν λόγον αὐτοῦ
  choice: firman-Nya
  rationale: “Firman” mempertahankan corak Yohanes dan mencakup perkataan maupun pesan yang dinyatakan Allah.
- source_word: τηρῶ
  choice: memegang teguh
  rationale: Pilihan ini mencakup unsur menaati, memelihara, dan menjaga, tanpa menyempitkan maknanya menjadi kepatuhan terhadap aturan semata.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: Namun ... sedangkan ... Akan tetapi
  rationale: Rangkaian penghubung ini mengungkapkan pertentangan tajam antara ketidaktahuan para lawan bicara, pengenalan Yesus, pernyataan hipotetis, dan kenyataan yang ditegaskan.
theological_decisions:
- issue: Klaim Yesus tentang pengenalan-Nya akan Allah dibandingkan dengan para lawan-Nya
  choice: Menyampaikan secara langsung bahwa para lawan belum mengenal Allah, sedangkan Yesus mengenal-Nya dan memegang teguh firman-Nya.
  alternative: Menambahkan penjelasan tentang keunikan hubungan Anak dengan Bapa atau melunakkan “mengenal” menjadi sekadar mengetahui tentang Allah.
  rationale: Ayat ini sendiri menegaskan perbedaan tajam dalam pengenalan akan Allah dan kesetiaan kepada firman-Nya. Terjemahan mempertahankan klaim tersebut tanpa memasukkan uraian doktrinal yang tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada kata ganti yang merujuk kepada Allah dan Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. “Pendusta” dipilih karena tegas dan bermartabat; “memegang teguh” mempertahankan keluasan makna τηρέω.
