  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: id
  text: Mereka[a] mengatakan hal itu untuk menguji dia, agar mereka mempunyai dasar untuk menuduhnya. Namun, Yesus membungkuk dan menulis di tanah dengan jarinya, tanpa menghiraukan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini melanjutkan kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: untuk menguji
  rationale: Konteksnya menunjukkan upaya menguji Yesus dengan maksud menjebaknya dalam persoalan hukum; “menguji” mempertahankan makna dasar tanpa mengurangi niat buruk mereka.
- source_word: κατηγορίαν
  choice: dasar untuk menuduhnya
  rationale: Kata ini menunjuk pada tuduhan atau dakwaan. Ungkapan ini menyampaikan secara alami bahwa mereka mencari dasar yang dapat dipakai untuk mengajukan tuduhan terhadap Yesus.
- source_word: κάτω κύψας
  choice: membungkuk
  rationale: Menyampaikan gerakan Yesus menundukkan tubuh ke arah tanah secara ringkas dan alami.
- source_word: ἔγραφεν
  choice: menulis
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; dalam bahasa Indonesia, aspek tersebut cukup wajar disampaikan oleh konteks tanpa harus menambahkan “mulai” yang tidak dinyatakan sumber.
- source_word: μὴ προσποιούμενος
  choice: tanpa menghiraukan mereka
  rationale: Dalam konteks ini ungkapan tersebut berarti tidak menanggapi atau tidak memberi perhatian. Pilihan ini tidak mempersempit maknanya menjadi seolah-olah hanya tidak mendengar.
theological_decisions:
- issue: Status tekstual kisah perempuan yang kedapatan berzina (Yohanes 7:53–8:11)
  choice: Ayat diterjemahkan sesuai teks sumber Bizantin yang diberikan, dengan penanda catatan tekstual pada subjek pembuka.
  alternative: Menghilangkan atau mengapit bagian ini karena tidak terdapat dalam sejumlah saksi naskah awal.
  rationale: Edisi sumber yang ditetapkan memuat bagian ini. Catatan kaki mengakui persoalan sejarah teks tanpa menghapus kisah tersebut atau memutuskan secara dogmatis statusnya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kata ganti ilahi tidak dikapitalisasi agar mengikuti gaya modern yang netral dan tidak menambahkan pembedaan yang tidak terdapat dalam teks Yunani. Konjungsi “Namun” mempertahankan peralihan antara maksud para penanya dan tanggapan Yesus.
