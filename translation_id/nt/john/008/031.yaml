id: JHN.8.31
reference: John 8:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: id
  text: Karena itu, Yesus berkata kepada orang-orang Yahudi yang telah memercayai Dia[a], “Jika kalian tetap dalam firman-Ku, kalian benar-benar murid-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah percaya kepada-Nya.” Secara harfiah, bahasa Yunani berbunyi “yang telah memercayai Dia.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran dalam latar naratif, tetapi bahasa Indonesia tidak wajib menandai aspek itu secara eksplisit. ‘Berkata’ lebih alami daripada ‘sedang berkata’ atau ‘terus berkata’, yang dapat memberi nuansa tambahan.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat inferensial dari konteks sebelumnya tanpa membuat hubungan logisnya terlalu kaku.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: kepada orang-orang Yahudi yang telah memercayai Dia
  rationale: ‘Telah memercayai’ mencerminkan tindakan sebelumnya dengan keadaan hasil yang tersirat dalam bentuk perfektum. ‘Memercayai Dia’ mempertahankan konstruksi datif langsung dan tidak otomatis memperluasnya menjadi ‘percaya kepada-Nya’.
- source_word: Ἐὰν
  choice: Jika
  rationale: Menyampaikan syarat yang diperkenalkan oleh ἐὰν dengan jelas dan wajar.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina eksplisit dan jamak diterjemahkan dengan ‘kalian’ agar sasaran jamaknya jelas dalam bahasa Indonesia modern.
- source_word: μείνητε
  choice: tetap
  rationale: Dalam konteks Yohanes, μένω menyatakan keberlanjutan atau ketekunan. ‘Tetap’ alami dan mempertahankan nuansa bertahan tanpa memakai ungkapan yang terasa kuno.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: dalam firman-Ku
  rationale: ‘Firman’ mempertahankan diksi khas Yohanes dan cakupan λόγος sebagai perkataan, pesan, atau ajaran Yesus, sedangkan ‘dalam’ menjaga metafora sumber.
- source_word: ἀληθῶς
  choice: benar-benar
  rationale: Menegaskan keaslian atau kenyataan status mereka sebagai murid dengan bahasa Indonesia yang lugas.
- source_word: μαθηταί μού ἐστε
  choice: kalian benar-benar murid-Ku
  rationale: ‘Murid’ adalah padanan baku μαθητής dalam konteks Injil; susunan ini alami dalam bahasa Indonesia dan mempertahankan penegasan predikat.
theological_decisions:
- issue: Makna πιστεύω dengan datif αὐτῷ
  choice: yang telah memercayai Dia
  alternative: yang telah percaya kepada-Nya
  rationale: Teks Yunani memakai datif αὐτῷ tanpa εἰς. Terjemahan utama mempertahankan arti langsung ‘memercayai Dia’ agar tidak secara diam-diam memperluasnya menjadi rumusan ‘percaya kepada/dalam Dia’. Padanan yang lazim secara teologis dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk memperjelas bentuk jamak tanpa menambah formalitas yang kaku; ‘firman-Ku’ mempertahankan gema khas Yohanes.
