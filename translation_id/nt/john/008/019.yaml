  naturalness: Selebihnya teksnya alami dan baku. “Lalu mereka bertanya kepada-Nya” wajar untuk ujaran berbentuk pertanyaan dan mempertahankan hubungan kelanjutan οὖν tanpa membuat inferensi “Karena itu” terlalu eksplisit.
  terminology: “Bapa,” “mengenal,” dan kapitalisasi religius konsisten dengan konteks Yohanes dan penggunaan Alkitab Indonesia. “Mengenal” mempertahankan kesinambungan οἶδα tanpa mempersempit maknanya.
