base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: id
  text: Lalu mereka bertanya kepada-Nya, “Di manakah Bapa-Mu?” Yesus menjawab, “Kalian tidak mengenal Aku maupun Bapa-Ku. Seandainya kalian mengenal Aku, kalian tentu juga mengenal Bapa-Ku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: mereka bertanya
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung dalam alur cerita. Karena ujaran langsungnya berupa pertanyaan, ‘bertanya’ merupakan ungkapan Indonesia yang alami tanpa harus menambahkan gagasan pengulangan seperti ‘terus bertanya’.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata penghubung ini mengaitkan pertanyaan mereka dengan pernyataan Yesus sebelumnya dan dapat menyatakan kelanjutan sekaligus kesimpulan dalam percakapan.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Di manakah Bapa-Mu?
  rationale: Terjemahan ini mempertahankan pertanyaan langsung. ‘Bapa’ memakai huruf kapital karena dalam konteks Yohanes yang dimaksud ialah Allah, meskipun para penanya belum memahami rujukan itu.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Kalian tidak mengenal Aku maupun Bapa-Ku
  rationale: Pola οὔτε…οὔτε dinyatakan secara alami dengan ‘tidak … maupun’. ‘Mengenal’ mempertahankan dimensi pengetahuan relasional dalam οἶδα tanpa membatasinya menjadi sekadar pemahaman intelektual.
- source_word: οἶδατε / ᾔδειτε
  choice: mengenal
  rationale: Pemakaian kata yang sama di seluruh ayat menjaga kesinambungan leksikal. Dalam bahasa Indonesia, ‘mengenal’ lebih tepat daripada ‘mengetahui’ ketika objeknya adalah pribadi.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Jika kalian mengenal Aku, kalian juga akan mengenal Bapa-Ku
  rationale: Susunan ini menyampaikan pengandaian yang berkenaan dengan keadaan kini dan mempertahankan καί melalui ‘juga’. Catatan kaki menjelaskan daya berlawanan-dengan-kenyataan yang dapat dibuat lebih tegas.
- source_word: πατήρ / πατέρα μου
  choice: Bapa / Bapa-Ku
  rationale: ‘Bapa’ adalah padanan Indonesia yang mapan dan wajar bagi Allah sebagai Bapa dalam konteks ini; kapitalisasi menandai rujukan ilahi tanpa menambahkan penjelasan ke dalam teks.
- source_word: ὑμεῖς (tersirat dalam bentuk verba jamak)
  choice: kalian
  rationale: Bentuk verba Yunani adalah jamak. ‘Kalian’ membuat jumlah itu jelas bagi pembaca Indonesia modern dan mencegah pembacaan sebagai sapaan kepada satu orang.
theological_decisions:
- issue: Kapitalisasi sebutan Bapa dan pronomina yang merujuk kepada Yesus
  choice: Bapa, Bapa-Ku, Aku, dan -Nya ditulis dengan huruf kapital
  alternative: Menuliskannya dengan huruf kecil menurut kaidah umum pronomina
  rationale: Konvensi religius Indonesia ini membantu menunjukkan rujukan kepada Allah dan Yesus, tanpa mengubah isi leksikal ayat.
- issue: Makna mengenal Yesus dan Bapa
  choice: Memakai ‘mengenal’ secara konsisten
  alternative: Memakai ‘mengetahui’, ‘memahami’, atau ‘mengakui’
  rationale: ‘Mengenal’ cukup luas untuk memuat hubungan pribadi dan pengenalan sejati yang khas dalam Injil Yohanes, tanpa menentukan apakah tekanannya semata-mata intelektual, relasional, atau pengakuan iman.
- issue: Daya pengandaian εἰ … ἄν
  choice: Teks utama memakai bentuk pengandaian kini yang alami, dengan catatan tentang sifat berlawanan dengan kenyataan
  alternative: Menegaskannya dalam teks utama sebagai ‘Seandainya … tentu …’ atau menjadikannya pengandaian masa lampau
  rationale: Pilihan ini tidak mengimpor nuansa masa lampau, tetapi tetap menjaga kemungkinan pembacaan yang lebih tegas sebagai keadaan yang tidak nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk memperjelas bahwa sapaan Yunani berbentuk jamak. Susunan kalimat dibuat alami tanpa menghilangkan hubungan teologis antara mengenal Yesus dan mengenal Bapa.
