  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: id
  text: Lalu Yesus[a] menegakkan tubuh-Nya. Ketika Ia tidak melihat seorang pun selain perempuan itu, Ia berkata kepadanya, “Ibu, di manakah para penuduhmu itu? Tidak adakah seorang pun yang menjatuhkan putusan bersalah atasmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan bagian dari kisah perempuan yang kedapatan berzina (Yohanes 7:53–8:11), yang tidak terdapat dalam naskah-naskah Yunani paling awal. Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: menegakkan tubuh-Nya
  rationale: Menggambarkan Yesus kembali ke posisi tegak setelah membungkuk untuk menulis di tanah; lebih tepat daripada 'berdiri' karena teks tidak mengharuskan perubahan dari duduk menjadi berdiri.
- source_word: θεασάμενος
  choice: melihat
  rationale: Menyampaikan persepsi visual secara langsung dan alami dalam bahasa Indonesia.
- source_word: Ἡ γυνή
  choice: Ibu
  rationale: Sapaan hormat dan wajar kepada perempuan dewasa dalam bahasa Indonesia; menghindari kesan kasar yang dapat timbul dari sapaan literal 'Perempuan'.
- source_word: οἱ κατήγοροί σου
  choice: para penuduhmu
  rationale: Mempertahankan nuansa hukum dari κατήγοροι, yakni orang-orang yang mengajukan tuduhan terhadap perempuan itu.
- source_word: κατέκρινεν
  choice: menghukummu
  rationale: Dalam konteks hukum ini berarti menjatuhkan putusan bersalah atau hukuman, bukan sekadar menilai.
