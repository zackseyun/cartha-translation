id: JHN.8.15
reference: John 8:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: id
  text: Kalian menghakimi menurut daging[a]; Aku tidak menghakimi siapa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut ukuran manusia” atau “berdasarkan apa yang tampak dari luar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kalian
  rationale: Pronomina orang kedua jamak ini dinyatakan secara eksplisit dan berkontras dengan ἐγώ. “Kalian” menyampaikan bentuk jamak dengan jelas dalam bahasa Indonesia modern.
- source_word: κατὰ τὴν σάρκα
  choice: menurut daging
  rationale: Ungkapan ini dipertahankan secara dekat agar citra Yohanes dan ketegangan maknanya tidak dipersempit menjadi satu tafsiran; alternatif idiomatis diberikan dalam catatan kaki.
- source_word: κρίνετε
  choice: menghakimi
  rationale: Bentuk kini aktif indikatif orang kedua jamak ini secara langsung dan wajar diterjemahkan “menghakimi” dalam konteks penilaian terhadap seseorang.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit ini menegaskan kontras dengan ὑμεῖς; susunan antitesis dalam kalimat mempertahankan penekanan tersebut.
- source_word: οὐ κρίνω οὐδένα
  choice: Aku tidak menghakimi siapa pun
  rationale: Terjemahan ini menyampaikan negasi menyeluruh dari οὐ ... οὐδένα secara alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σάρξ dalam κατὰ τὴν σάρκα
  choice: “daging” dipertahankan dalam teks utama
  alternative: “menurut ukuran manusia” atau “berdasarkan apa yang tampak dari luar”
  rationale: Dalam konteks ini ungkapan tersebut mungkin menunjuk pada ukuran manusiawi, duniawi, atau lahiriah. Mempertahankan “daging” menjaga tekstur bahasa sumber dan tidak mengubahnya menjadi istilah doktrinal “natur berdosa” ataupun membatasi maknanya pada penampilan luar saja.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas; kapitalisasi “Aku” mengikuti kebiasaan penerjemahan Alkitab Indonesia ketika Yesus berbicara.
