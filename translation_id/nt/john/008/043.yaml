  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: id
  text: Mengapa kalian tidak memahami cara Aku berbicara[a]? Karena kalian tidak dapat mendengar firman-Ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tutur kata-Ku", "ucapan-Ku", atau "bahasa-Ku". Istilah Yunani ini menunjuk pada cara Yesus berbicara dan dibedakan di sini dari "firman-Ku" dalam klausa berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Atau "kalian tidak mampu mendengar firman-Ku".
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: cara-Ku berbicara
  rationale: Ungkapan ini menunjuk pada cara atau corak Yesus berbicara dan menjaga perbedaannya dari λόγος pada klausa berikutnya.
- source_word: γινώσκετε
  choice: memahami
  rationale: Dalam konteks pertanyaan ini, kata tersebut menyatakan pemahaman terhadap perkataan Yesus, bukan sekadar mengetahui atau mengenali.
- source_word: ἀκούειν
  choice: mendengarkan
  rationale: Dalam bahasa Indonesia, 'mendengarkan firman' terdengar lebih alami daripada 'mendengar firman' dan tetap mempertahankan gagasan mendengar tanpa secara eksplisit mengubahnya menjadi 'menerima' atau 'menaati'.
- source_word: λόγον
  choice: firman
  rationale: '''Firman'' merupakan padanan yang wajar dan bermartabat bagi λόγος ketika merujuk pada perkataan atau pesan Yesus, sekaligus tetap dibedakan dari ''cara berbicara'' pada klausa pertama.'
- source_word: οὐ δύνασθε
  choice: tidak sanggup
  rationale: Padanan ini secara alami menyatakan ketidakmampuan dan tidak mereduksinya menjadi sekadar ketidakmauan.
- source_word: ὅτι
  choice: Karena
  rationale: Kata ini memperkenalkan alasan bagi pertanyaan sebelumnya.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: -Ku
  rationale: Bentuk enklitik Indonesia secara alami menyatakan kepunyaan dan mempertahankan kesejajaran antara 'cara-Ku berbicara' dan 'firman-Ku'.
theological_decisions:
- issue: Sifat ketidakmampuan dalam 'tidak sanggup mendengarkan firman-Ku'
  choice: Pernyataan diterjemahkan sebagai ketidakmampuan tanpa menjelaskan penyebab teologisnya.
  alternative: Menafsirkannya secara khusus sebagai ketidakmauan moral, pengerasan sebagai hukuman, atau ketidakmampuan rohani.
  rationale: Ayat ini menyatakan ketidakmampuan, tetapi tidak menerangkan seluruh mekanismenya; terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penempatan penanda catatan kaki sesudah kalimat tetap mengacu pada frasa terkait dalam klausa kedua.
