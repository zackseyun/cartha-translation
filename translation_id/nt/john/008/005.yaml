  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: id
  text: '[a] Dalam hukum kita, Musa memerintahkan agar perempuan-perempuan seperti itu dirajam. Jadi, apa pendapat-Mu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini merupakan kelanjutan kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: Dalam hukum kita
  rationale: Menerjemahkan frasa lokatif secara alami. Partikel δέ tidak diberi padanan tersendiri karena di sini hanya menandai kelanjutan atau peralihan ringan dalam wacana.
- source_word: ἐνετείλατο
  choice: memerintahkan
  rationale: Menyampaikan perintah yang berwenang tanpa melemahkannya menjadi sekadar nasihat.
- source_word: τὰς τοιαύτας
  choice: perempuan-perempuan seperti itu
  rationale: Bentuk feminin jamak menunjuk kepada perempuan dari golongan yang dimaksud dalam konteks, tanpa mempersempitnya secara eksplisit melebihi bahasa sumber.
- source_word: λιθοβολεῖσθαι
  choice: dilempari batu
  rationale: Padanan pasif yang alami untuk hukuman rajam; konteks hukumannya sudah menunjukkan maksud mematikan sehingga kata 'sampai mati' tidak perlu ditambahkan.
- source_word: σὺ οὖν τί λέγεις;
  choice: Jadi, apa pendapat-Mu?
  rationale: οὖν diterjemahkan 'Jadi', sedangkan idiom τί λέγεις dalam konteks meminta sikap atau putusan Yesus paling alami disampaikan sebagai 'apa pendapat-Mu?' Penulisan '-Mu' menandai sapaan kepada Yesus sesuai konvensi penerbitan Alkitab Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mempertahankan penekanan pada hukum Musa lalu pertanyaan langsung kepada Yesus. Penanda catatan ditempatkan setelah klausa tentang hukuman agar tidak mengganggu pembukaan ayat.
