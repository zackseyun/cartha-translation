  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: id
  text: Karena itu, Yesus berkata, “Apabila kamu meninggikan[a] Anak Manusia, barulah kamu akan tahu bahwa Akulah Dia[b], dan bahwa Aku tidak berbuat apa pun dari diri-Ku sendiri, melainkan Aku mengatakan hal-hal ini sebagaimana Bapa telah mengajar Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “meninggikan” dapat menunjuk pada pengangkatan secara fisik dan, dalam pemakaian Yohanes, juga pada pemuliaan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Aku adalah.” Dalam bahasa Yunani ungkapan ini hanya berbunyi “Aku adalah” (ἐγώ εἰμι), tanpa predikat yang dinyatakan.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan sekaligus kesimpulan dari percakapan sebelumnya dengan gaya Indonesia yang wajar.
- source_word: Ὅταν
  choice: Apabila
  rationale: Menunjuk pada suatu peristiwa tertentu pada masa depan yang menjadi keadaan bagi terjadinya pengenalan berikutnya.
- source_word: ὑψώσητε
  choice: meninggikan
  rationale: 'Mempertahankan makna ganda khas Yohanes: mengangkat secara fisik pada salib dan memuliakan atau meninggikan.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku bagi gelar ini serta mempertahankan gema kitab Daniel dan pemakaiannya dalam Injil.
- source_word: τότε γνώσεσθε
  choice: barulah kamu akan tahu
  rationale: τότε menyatakan bahwa pengenalan itu terjadi sesudah peristiwa yang disebutkan; 'barulah' menyampaikan hubungan waktunya secara alami.
- source_word: ἐγώ εἰμι
  choice: Akulah Dia
  rationale: Bahasa Yunani tidak menyatakan predikat. 'Akulah Dia' wajar dalam bahasa Indonesia, tetapi tetap terasa khidmat; bentuk harfiah dicatat dalam catatan kaki agar ambiguitas dan kemungkinan alusinya tidak hilang.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: Aku tidak berbuat apa pun dari diri-Ku sendiri
  rationale: Menjaga gagasan sumber atau prakarsa tindakan tanpa mempersempitnya menjadi sekadar bertindak sendirian.
- source_word: ἀλλὰ
  choice: Sebaliknya
  rationale: Menyatakan pertentangan antara bertindak dari diri sendiri dan berbicara sesuai pengajaran Bapa.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: sebagaimana Bapa telah mengajar Aku
  rationale: Mempertahankan hubungan kesesuaian yang dinyatakan καθώς serta acuan khas Yohanes kepada Bapa.
- source_word: ταῦτα λαλῶ
  choice: Aku mengatakan hal-hal ini
  rationale: Mempertahankan penunjuk jamak ταῦτα dalam ungkapan Indonesia yang lebih alami daripada terjemahan sangat harfiah 'berbicara hal-hal ini'.
theological_decisions:
- issue: Penerjemahan ἐγώ εἰμι yang tidak memiliki predikat tersurat
  choice: Akulah Dia
  alternative: Aku adalah
  rationale: Teks utama perlu terbaca alami tanpa menetapkan predikat yang tidak terdapat dalam bahasa Yunani. Catatan kaki mempertahankan bentuk harfiahnya dan keterbukaan terhadap kemungkinan gema penyataan diri ilahi.
- issue: Makna ὑψώσητε dalam konteks Injil Yohanes
  choice: meninggikan
  alternative: mengangkat; menyalibkan; memuliakan
  rationale: Kata ini dapat menunjuk sekaligus pada pengangkatan Yesus di salib dan pemuliaan-Nya. Terjemahan tidak membatasi maknanya hanya pada salah satu sisi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pronomina yang mengacu kepada Yesus dipakai sesuai kebiasaan luas penerbitan Alkitab Indonesia. Penanda catatan ditempatkan pada klausa yang dijelaskannya; catatan [b] menjelaskan kata 'meninggikan' yang muncul lebih awal dalam ayat.
