  footnotes:
  - marker: a
    text: Ayat terakhir dalam kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11). Lihat catatan pada Yohanes 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Tuhan
  rationale: Sapaan vokatif ini dapat berarti ‘Tuan’, tetapi ‘Tuhan’ dipertahankan karena sesuai dengan pengakuan akan kewibawaan Yesus dan tradisi penerjemahan Indonesia, tanpa menghilangkan kemungkinan nuansa sapaan hormat dalam konteks.
- source_word: κατακρίνω
  choice: menghukum
  rationale: Dalam konteks yudisial ini, kata tersebut menunjuk pada penjatuhan hukuman atau vonis bersalah. ‘Menghukum’ terdengar alami dalam bahasa Indonesia dan mempertahankan daya hukum ungkapan Yunani.
- source_word: μηκέτι ἁμάρτανε
  choice: jangan berbuat dosa lagi
  rationale: Bentuk larangan dengan μηκέτι menyatakan penghentian sejak saat ini; rumusan ini alami, jelas, dan mempertahankan tuntutan Yesus agar perilaku berdosa tidak diteruskan.
- source_word: πορεύου
  choice: Pergilah
  rationale: Imperatif kini diterjemahkan secara langsung dan wajar sebagai perintah untuk pergi.
theological_decisions:
- issue: Hubungan antara tidak menghukum dan perintah meninggalkan dosa
  choice: Kedua pernyataan dipertahankan berdampingan tanpa penjelasan tambahan.
  alternative: Menafsirkan ‘tidak menghukum’ sebagai pengampunan mutlak atau hanya sebagai tidak menjatuhkan hukuman hukum pada saat itu.
  rationale: Teks menyandingkan tidak dijatuhkannya hukuman dengan tuntutan untuk tidak berbuat dosa lagi; terjemahan tidak boleh menyelesaikan ketegangan teologis ini secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina ‘engkau’ dipakai untuk menjaga corak percakapan Kitab Suci yang tetap mudah dipahami. Penanda catatan ditempatkan pada akhir ayat agar jelas merujuk pada status tekstual keseluruhan kisah.
