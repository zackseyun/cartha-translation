  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: id
  text: Perempuan itu menjawab, “Tidak seorang pun, Tuan.” Lalu Yesus berkata, “Aku pun tidak menghukum engkau. Pergilah, dan jangan berbuat dosa lagi.”[a]
