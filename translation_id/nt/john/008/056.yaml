  terminology: “Bersukacita,” “hari-Ku,” dan “bergembira” mempertahankan register yang pantas serta pembedaan yang cukup antara ἠγαλλιάσατο dan ἐχάρη. “Hari-Ku” dibiarkan tidak ditafsirkan secara sempit.
