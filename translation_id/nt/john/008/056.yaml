  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: id
  text: Abraham, bapak kalian, bersukacita karena ia akan melihat hari-Ku; ia melihatnya dan bergembira.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersukacita untuk melihat hari-Ku” atau “bersukacita supaya ia dapat melihat hari-Ku.” Klausa Yunani dapat dipahami dalam beberapa cara yang maknanya berdekatan.'
    reason: lexical_alternative
  - marker: b
    text: “Hari-Ku” dapat merujuk secara luas kepada hari atau penggenapan mesianis Yesus; ayat ini tidak menentukan secara tepat peristiwa atau waktu yang dimaksud.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Mengikuti bentuk baku nama sang leluhur dalam bahasa Indonesia.
- source_word: ὁ πατὴρ ὑμῶν
  choice: bapak leluhur kalian
  rationale: Dalam konteks perdebatan tentang keturunan Abraham, frasa ini menyatakan hubungan leluhur; pilihan ini lebih jelas daripada 'bapak kalian' dan tetap mempertahankan sapaan orang kedua jamak.
- source_word: ἠγαλλιάσατο
  choice: bersukacita
  rationale: Menyampaikan kegembiraan yang kuat dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: ἵνα ἴδῃ
  choice: karena akan melihat
  rationale: Menyampaikan pengharapan yang mengarah ke depan dan dapat dibaca sebagai isi atau tujuan sukacita, tanpa menyisipkan kepastian temporal yang berlebihan.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: hari-Ku
  rationale: Mempertahankan ungkapan metaforis dan keluasan makna teks sumber tanpa menentukan peristiwa tertentu.
- source_word: καὶ εἶδεν
  choice: ia telah melihatnya
  rationale: Objek pronominal merujuk secara alami kepada 'hari-Ku'; aspek perfektif diterjemahkan dengan 'telah' untuk menonjolkan pernyataan bahwa penglihatan itu terjadi.
- source_word: καὶ ἐχάρη
  choice: dan bergembira
  rationale: Membedakan χαίρω dari kata sukacita yang lebih kuat pada klausa pertama, sambil mempertahankan kesejajaran kalimat.
theological_decisions:
- issue: Makna 'hari-Ku'
  choice: Mempertahankan ungkapan literal 'hari-Ku'.
  alternative: Menafsirkannya secara khusus sebagai kedatangan, pelayanan duniawi, kematian dan kebangkitan, zaman Mesias, atau penyataan akhir Yesus.
  rationale: Ayat ini sendiri tidak menetapkan peristiwa atau waktu tertentu; terjemahan tidak boleh menutup keluasan makna mesianisnya.
- issue: Daya ἵνα dalam sukacita Abraham
  choice: Diterjemahkan 'karena akan melihat', dengan catatan alternatif.
  alternative: '''untuk melihat'' atau ''supaya ia dapat melihat''.'
  rationale: Konstruksi tersebut dapat mengungkapkan isi/pengharapan ataupun tujuan yang berhubungan erat; catatan mempertahankan ambiguitas yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' memperjelas bentuk jamak ὑμῶν, sedangkan 'bapak leluhur' menghindari kesan bahwa Abraham adalah ayah langsung para pendengar. Penanda catatan kaki ditempatkan dalam teks utama sesuai urutan [a], [b].
