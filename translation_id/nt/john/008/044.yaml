id: JHN.8.44
reference: John 8:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: id
  text: Kalian berasal dari bapak kalian, yaitu Iblis, dan kalian ingin melakukan keinginan-keinginan bapak kalian. Ia adalah pembunuh sejak semula dan tidak berdiri dalam kebenaran,[a] karena tidak ada kebenaran di dalam dirinya. Setiap kali ia mengucapkan dusta,[b] ia berbicara dari apa yang ada pada dirinya sendiri,[c] karena ia adalah pendusta dan bapak dari dusta.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak tetap bertahan dalam kebenaran.” Terjemahan ini dapat menyiratkan bahwa ia sebelumnya berada dalam kebenaran, sedangkan bahasa Yunani tidak mengharuskan kesimpulan itu.
    reason: theological_ambiguity
  - marker: b
    text: Secara lebih harfiah, “setiap kali ia mengatakan dusta itu.” Dapat juga diterjemahkan, “setiap kali ia berdusta.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ia berbicara dari miliknya sendiri,” yakni dari apa yang menjadi ciri dirinya.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “dan bapaknya.” Kata ganti itu paling mungkin menunjuk kepada “dusta”; karena itu maksudnya ialah bahwa Iblis adalah sumber dusta. Sering juga diterjemahkan, “bapak segala dusta.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: berasal dari bapak kalian, yaitu Iblis
  rationale: ἐκ bersama εἰμί menyatakan asal atau kepunyaan. Ungkapan ini mempertahankan konfrontasi mengenai asal atau kesetiaan rohani, sedangkan 'yaitu' memperjelas bahwa bapak yang dimaksud adalah Iblis tanpa menjadikan 'bapak' gelar bagi Iblis.
- source_word: ἐπιθυμίας
  choice: keinginan-keinginan
  rationale: Maknanya luas dan dalam konteks ini menunjuk pada kehendak jahat, bukan khusus hasrat seksual.
- source_word: θέλετε ποιεῖν
  choice: kalian ingin melakukan
  rationale: Menyampaikan kemauan atau niat secara alami dalam bahasa Indonesia modern.
- source_word: ἀνθρωποκτόνος
  choice: pembunuh
  rationale: Padanan langsung dan wajar untuk orang yang membunuh manusia dalam konteks moral ini.
- source_word: ἀπ’ ἀρχῆς
  choice: sejak semula
  rationale: Mempertahankan ungkapan temporal serta corak khas Yohanes.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: tidak berdiri dalam kebenaran
  rationale: Mempertahankan citra verba ἵστημι dan tidak menyisipkan secara tegas gagasan bahwa Iblis dahulu berada dalam kebenaran lalu meninggalkannya.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: setiap kali ia mengucapkan dusta
  rationale: Bahasa Indonesia yang alami sambil mempertahankan pola berulang ὅταν dan objek tunggal τὸ ψεῦδος.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: ia berbicara dari apa yang ada pada dirinya sendiri
  rationale: Mendekati ungkapan harfiah 'dari miliknya sendiri' sekaligus membuat maksud idiomatisnya dapat dipahami tanpa membatasi secara berlebihan pada konsep metafisis tentang kodrat.
- source_word: ψεύστης
  choice: pendusta
  rationale: Padanan langsung, bermartabat, dan lazim dalam register Alkitab bahasa Indonesia.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: bapak dari dusta
  rationale: Memahami αὐτοῦ sebagai merujuk kepada τὸ ψεῦδος, sehingga Iblis disebut sumber dusta. Pengulangan 'dusta' memperjelas rujukan pronomina yang kurang alami bila diterjemahkan harfiah.
theological_decisions:
- issue: Rujukan ὁ πατὴρ αὐτοῦ
  choice: Dipahami sebagai 'bapak dari dusta', yakni sumber dusta.
  alternative: Secara formal dapat dibaca 'bapaknya', atau diparafrasakan secara umum sebagai 'bapak segala dusta'.
  rationale: Anteseden terdekat dan paling koheren ialah τὸ ψεῦδος. Terjemahan tidak memakai 'segala dusta' karena bentuk Yunani tunggal dan tidak memuat kata 'segala'.
- issue: Apakah Iblis dahulu berdiri dalam kebenaran lalu jatuh
  choice: Tidak berdiri dalam kebenaran.
  alternative: Tidak tetap bertahan dalam kebenaran.
  rationale: Pilihan 'tidak berdiri' mempertahankan ketegangan teks dan menghindari penegasan bahwa pernah ada keadaan sebelumnya yang kemudian ditinggalkan.
- issue: Makna relasi 'bapak' dalam klausa pembuka
  choice: Asal atau kesetiaan rohani kepada Iblis, dinyatakan tanpa uraian doktrinal tambahan.
  alternative: Keturunan biologis atau pernyataan ontologis yang diperluas.
  rationale: Konteks menghubungkan relasi itu dengan keinginan dan perbuatan; terjemahan tidak mengimpor kerangka denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena ὑμεῖς berbentuk jamak dan untuk membedakannya dari sapaan tunggal. 'Bapak' mempertahankan metafora relasional πατήρ, sedangkan 'Iblis' mengikuti istilah Indonesia yang mapan. Struktur kalimat dibuat jelas bagi pembaca umum tanpa menghapus ambiguitas pada ἔστηκεν dan αὐτοῦ.
