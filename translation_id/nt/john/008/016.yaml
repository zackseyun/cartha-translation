id: JHN.8.16
reference: John 8:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: id
  text: Namun, sekalipun Aku menghakimi[a], penghakiman-Ku benar, karena Aku tidak sendirian, melainkan Aku bersama Bapa yang mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “jika Aku menghakimi” atau “jika Aku sampai menghakimi.” Ungkapan bersyarat dalam bahasa Yunani dapat diterjemahkan lebih formal, tetapi di sini kemungkinan besar bernuansa konsesif: “sekalipun Aku menghakimi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: sekalipun Aku menghakimi
  rationale: Konstruksi ἐὰν dengan subjungtif kini menyatakan kemungkinan bersyarat; dalam konteks ini nuansanya kemungkinan besar konsesif. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan alternatif formal dalam catatan kaki.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai pertentangan atau perkembangan dari pernyataan sebelumnya; “Namun” menyampaikan peralihan adversatif secara wajar dan bermartabat.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: penghakiman-Ku
  rationale: Bentuk ini mempertahankan nuansa forensik κρίσις dan menerjemahkan konstruksi posesif secara ringkas serta alami.
- source_word: ἀληθινή
  choice: benar
  rationale: “Benar” mempertahankan gema khas Yohanes dan dapat mencakup baik kebenaran maupun keabsahan tanpa mempersempit makna menjadi sekadar “sah”.
- source_word: μόνος οὐκ εἰμί
  choice: Aku tidak sendirian
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pokok relasional bahwa penghakiman Yesus tidak berdiri sendiri.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: melainkan Aku bersama Bapa yang mengutus Aku
  rationale: Kata “bersama” membuat konstruksi eliptis Yunani dapat dipahami secara alami dalam bahasa Indonesia, seraya tetap menempatkan Yesus dan Bapa bersama-sama sebagai dasar penghakiman tersebut. Partisip πέμψας diterjemahkan dengan klausa relatif “yang mengutus Aku”.
theological_decisions:
- issue: Hubungan penghakiman Yesus dengan Bapa yang mengutus-Nya
  choice: Ayat ini menyatakan bahwa penghakiman Yesus benar karena Ia tidak bertindak sendirian, tetapi bersama Bapa yang mengutus-Nya.
  alternative: Ayat ini dapat dibaca secara lebih sempit hanya sebagai pernyataan mengenai ketentuan kesaksian hukum, tanpa menarik implikasi teologis yang lebih luas.
  rationale: Terjemahan mempertahankan alasan yang dinyatakan teks—Yesus tidak sendirian dan Bapa terlibat—tanpa mengembangkannya menjadi rumusan doktrinal yang tidak dinyatakan langsung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerjemahan Alkitab Indonesia. “Penghakiman” dipertahankan untuk nuansa forensik, sedangkan “bersama” melengkapi elipsis Yunani agar kalimat jelas bagi pembaca umum.
