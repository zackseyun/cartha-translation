id: JHN.8.22
reference: John 8:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi[a] berkata, “Ia tidak mungkin akan membunuh diri-Nya sendiri, bukan? Sebab Ia berkata, ‘Ke mana Aku pergi, kamu tidak dapat datang.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, sesuai konteks Injil Yohanes, “orang-orang Yudea” atau “para pemimpin Yahudi,” bergantung pada seberapa luas rujukan yang dimaksud Yohanes di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung dalam alur narasi. Bahasa Indonesia tidak perlu menandai aspek ini secara eksplisit ketika konteks sudah memadai.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan kesimpulan atau kelanjutan dari perkataan Yesus sebelumnya dengan bahasa Indonesia yang wajar.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ini mempertahankan padanan leksikal langsung tanpa mempersempit rujukannya menjadi para pemimpin atau penduduk Yudea; kemungkinan kontekstual dijelaskan dalam catatan kaki.
- source_word: Μήτι
  choice: Ia tidak mungkin ... bukan?
  rationale: Susunan ini menyampaikan pertanyaan yang mengharapkan jawaban negatif serta nada tidak percaya dalam bahasa Indonesia alami.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: akan membunuh diri-Nya sendiri
  rationale: Menyampaikan verba berwaktu mendatang dan objek refleksif secara langsung, jelas, dan modern.
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari dugaan mereka, yaitu perkataan Yesus.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini Yunani dipertahankan sebagai pelaporan langsung yang hidup dan wajar dalam konteks dialog.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ke mana Aku pergi
  rationale: Menyampaikan gerak menuju suatu tujuan tanpa menambahkan penafsiran tentang tujuan keberangkatan itu.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: kamu tidak dapat datang
  rationale: Padanan ringkas dan alami yang mempertahankan makna ketidakmampuan dari δύνασθε.
theological_decisions:
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Ayat ini sendiri tidak secara eksplisit membatasi rujukannya. Terjemahan utama mempertahankan keluasan ungkapan Yunani, sedangkan catatan kaki menjelaskan kemungkinan cakupan kontekstual agar pembaca tidak menganggapnya pasti merujuk kepada seluruh kelompok etnis atau agama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk sapaan ilahi memakai kapitalisasi sesuai kebiasaan penerbitan Alkitab Indonesia. Pertanyaan berekor “bukan?” mempertahankan dugaan yang mengharapkan jawaban negatif.
