  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: id
  text: 'Yesus berkata kepada mereka, “Sesungguhnya, sesungguhnya Aku berkata kepada kalian: sebelum Abraham mulai ada[a], Aku ada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “sebelum Abraham lahir.” Kata kerja Yunani yang dipakai lebih luas maknanya daripada kelahiran: “mulai ada” atau “menjadi ada.”'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku sudah ada.” Teks Yunani berbunyi “Aku ada,” dengan mempertahankan bentuk kini dan kemungkinan gaung teologisnya.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Yesus berkata kepada mereka
  rationale: Mengikuti susunan naratif Yunani secara wajar dalam bahasa Indonesia dan mempertahankan bahwa perkataan itu ditujukan kepada sekelompok orang.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang memberi penegasan khidmat. Bentuk ini alami dalam ragam Alkitab bahasa Indonesia tanpa sekadar mentransliterasikan ‘amin’.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Merupakan padanan dekat bagi ungkapan Yunani dan menyatakan dengan jelas bahwa ὑμῖν berbentuk jamak. ‘Kalian’ lebih terang daripada ‘kamu’ dalam konteks ini.
- source_word: πρὶν
  choice: sebelum
  rationale: Padanan temporal langsung dan alami untuk πρὶν.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: γενέσθαι
  choice: menjadi ada
  rationale: Mempertahankan cakupan γίνομαι yang lebih luas daripada kelahiran fisik serta kontras verbalnya dengan ἐγὼ εἰμί. Walaupun sedikit tidak biasa, ungkapan ini dapat dipahami dan tidak mempersempit artinya.
- source_word: ἐγὼ εἰμί
  choice: Aku ada
  rationale: Menerjemahkan bentuk kini Yunani secara langsung dan mempertahankan ungkapan absolut yang mencolok beserta kemungkinan gema teologisnya. ‘Aku sudah ada’ lebih lancar, tetapi mengubah daya bentuk kini.
theological_decisions:
- issue: Terjemahan ἐγὼ εἰμί dalam konteks kristologis
  choice: Aku ada
  alternative: Aku sudah ada; Aku telah ada
  rationale: Bentuk Yunani secara harfiah memakai kala kini dan tampil secara absolut. ‘Aku ada’ mempertahankan ketegangan antara makna keberadaan sebelum Abraham dan kemungkinan gema pengenalan diri ilahi, tanpa menetapkan salah satu penafsiran di dalam teks utama.
- issue: Kontras antara γενέσθαι dan ἐγὼ εἰμί
  choice: menjadi ada … Aku ada
  alternative: lahir … Aku sudah ada
  rationale: 'Pilihan utama menjaga perbedaan verba Yunani: Abraham ‘menjadi ada’, sedangkan Yesus berkata ‘Aku ada’. Alternatif yang lebih idiomatis akan mempersempit verba pertama dan melunakkan bentuk kini verba kedua.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ‘Aku’ sesuai dengan tuturan langsung Yesus; ‘kalian’ dipakai untuk memperjelas bentuk jamak Yunani. Tanda titik dua membantu pembaca mengikuti pernyataan puncak tanpa menambahkan isi.
