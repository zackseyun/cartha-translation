  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Setiap orang menyajikan anggur yang baik lebih dahulu, dan ketika ia sudah mabuk, barulah yang kurang baik. Namun, engkau menyimpan anggur yang baik sampai sekarang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: ia berkata kepadanya
  rationale: Bentuk kini λέγει berfungsi sebagai kala kini historis dalam narasi; bahasa Indonesia secara wajar memakai bentuk naratif “berkata” tanpa penandaan kala.
- source_word: Πᾶς ἄνθρωπος
  choice: Setiap orang
  rationale: Ungkapan tunggal generik ini merujuk kepada orang pada umumnya, bukan hanya laki-laki; “setiap orang” tepat dan alami dalam bahasa Indonesia modern.
- source_word: τὸν καλὸν οἶνον
  choice: anggur yang baik
  rationale: καλός menunjukkan mutu dalam kontras dengan anggur yang kurang baik; pilihan ini lugas dan tidak menambahkan gagasan kemewahan.
- source_word: τίθησιν
  choice: menyajikan
  rationale: Dalam konteks perjamuan, arti harfiah “menaruh” secara idiomatis berarti menghidangkan atau menyajikan kepada para tamu.
- source_word: ὅταν μεθυσθῶσιν
  choice: setelah orang-orang menjadi mabuk
  rationale: μεθύω lazim berarti menjadi mabuk. Bentuk dengan ὅταν menggambarkan keadaan yang terjadi sebelum anggur bermutu lebih rendah disajikan; terjemahan ini tidak melunakkan maknanya.
- source_word: τὸν ἐλάσσω
  choice: anggur yang kurang baik
  rationale: ἐλάσσων menyatakan mutu yang lebih rendah. Kata “anggur” yang tersirat dalam bahasa Yunani diulangi agar kalimat Indonesia jelas dan alami.
- source_word: τετήρηκας
  choice: engkau menyimpan
  rationale: Bentuk perfektum menyatakan bahwa anggur itu telah dipertahankan hingga saat tersebut; “menyimpan” mempertahankan makna dasar tanpa menambahkan motif tertentu.
- source_word: ἕως ἄρτι
  choice: sampai sekarang
  rationale: Ungkapan ini menunjuk pada saat kini dalam adegan dan diterjemahkan secara langsung serta alami.
theological_decisions:
- issue: Makna μεθυσθῶσιν dalam konteks mukjizat yang melibatkan anggur
  choice: Mempertahankan arti lugas “menjadi mabuk”
  alternative: “sudah banyak minum” atau “sudah puas minum”
  rationale: Kata kerja Yunani ini biasanya menyatakan kemabukan. Ucapan kepala perjamuan melaporkan kebiasaan sosial dan tidak dengan sendirinya menyetujui kemabukan; karena itu ketegangan dalam teks tidak dilunakkan demi kesimpulan etis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “engkau” dipakai untuk mempertahankan bentuk tunggal langsung σύ. Pengulangan “ia menyajikan” mengungkapkan elipsis Yunani secara alami tanpa mengubah maksud.
