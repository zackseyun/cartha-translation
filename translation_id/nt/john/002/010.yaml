    text: Dapat juga diterjemahkan, “ketika mereka mabuk” atau “ketika mereka sudah banyak minum.” Kata kerja Yunani ini lazim berarti “menjadi mabuk”; beberapa terjemahan melunakkannya menjadi “sudah banyak minum.”
    reason: lexical_alternative
