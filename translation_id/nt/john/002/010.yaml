review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: perkataan naratif, anggur yang baik lebih dahulu, kemabukan yang dinyatakan secara lugas, anggur bermutu lebih rendah sesudahnya, dan anggur baik yang disimpan hingga saat itu. Namun, ὅταν lebih tepat diterjemahkan "ketika" daripada "setelah"; bentuk ini memperkenalkan keadaan ketika anggur inferior disajikan, bukan terutama urutan waktu pascakejadian. Selain itu, subjek generik tunggal Πᾶς ἄνθρωπος sebaiknya tetap konsisten dalam klausa berikutnya.'
  naturalness: Bahasa draf pada umumnya modern dan jelas. "Setiap orang" alami dan inklusif. Pengulangan "ia menyajikan" dapat dihilangkan karena dalam bahasa Indonesia "yang kurang baik" sudah jelas merujuk pada anggur dan menghasilkan paralelisme yang lebih ringkas.
  terminology: '"Anggur", "yang baik", "yang kurang baik", "mabuk", dan "engkau" sesuai register dan makna. Catatan a tidak diperlukan karena pilihan "setiap orang" sudah menyampaikan generic singular dengan wajar; apabila dipertahankan, catatan itu tidak keliru. Catatan b berguna untuk mencatat alternatif terjemahan, tetapi terjemahan utama harus tetap lugas.'
  issues:
  - severity: medium
    issue: '"setelah orang-orang menjadi mabuk" untuk ὅταν μεθυσθῶσιν'
    rationale: ὅταν dengan aoristus subjungtif lazimnya berarti "ketika/apabila ... sudah menjadi mabuk". "Setelah" dapat menyatakan relasi temporal yang lebih tegas daripada konstruksi Yunani, sedangkan "ketika mereka sudah mabuk" mempertahankan keadaan yang menjadi latar penyajian anggur inferior.
  - severity: low
    issue: Peralihan dari "Setiap orang" ke "orang-orang"
    rationale: Yunani memakai subjek generik singular Πᾶς ἄνθρωπος; kata kerja jamak selanjutnya merujuk kembali secara generik. "ketika ia sudah mabuk" menjaga konsistensi bentuk generik tunggal dan terdengar alami dalam bahasa Indonesia.
  - severity: low
    issue: Pengulangan "ia menyajikan anggur" pada klausa eliptis
    rationale: τὸν ἐλάσσω adalah elipsis untuk anggur yang lebih rendah mutunya. Bahasa Indonesia dapat menyatakannya dengan "yang kurang baik" tanpa menambah subjek dan verba; rujukan kepada anggur sudah jelas.
  revised_text: Lalu ia berkata kepadanya, “Setiap orang menyajikan anggur yang baik lebih dahulu, dan ketika ia sudah mabuk, barulah yang kurang baik. Namun, engkau menyimpan anggur yang baik sampai sekarang.”
  revised_footnotes:
