revisions:
- from: Lalu ia berkata kepadanya, “Setiap orang[a] menyajikan anggur yang baik lebih dahulu, dan setelah orang-orang menjadi mabuk[b], barulah ia menyajikan anggur yang kurang baik. Namun, engkau menyimpan anggur yang baik sampai sekarang.”
  to: Lalu ia berkata kepadanya, “Setiap orang menyajikan anggur yang baik lebih dahulu, dan ketika ia sudah mabuk, barulah yang kurang baik. Namun, engkau menyimpan anggur yang baik sampai sekarang.”
  rationale: Revisi mengganti "setelah" dengan "ketika" untuk mencerminkan ὅταν secara lebih tepat, mempertahankan kemabukan secara lugas, dan menyelaraskan kembali rujukan generik dengan "Setiap orang ... ia". Elipsis pada "yang kurang baik" lebih dekat dengan bentuk sumber dan tetap sangat jelas dalam bahasa Indonesia. Catatan a dihapus karena tidak diperlukan bagi pembaca Indonesia dan marker a sebelumnya ditempatkan pada "Setiap orang", bukan pada unsur yang memerlukan penjelasan; catatan b dipertahankan dengan penanda yang benar pada "mabuk".
  reviewer_model: gpt-5.6-terra
