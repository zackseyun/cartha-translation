  source_fidelity: Frasa “ditempatkan sesuai dengan adat penyucian orang Yahudi” dapat dipahami bahwa cara menempatkan tempayan itu mengikuti suatu adat. Dalam konteks sintaksis Yunani, κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων lebih tepat menerangkan kegunaan/penyediaan tempayan-tempayan tersebut dalam kaitannya dengan penyucian Yahudi. Kapasitas “masing-masing ... dua atau tiga takaran” dan bahan wadah telah diterjemahkan dengan setia.
  naturalness: “Tempayan air dari batu” dan “masing-masing dapat menampung” alami dalam bahasa Indonesia baku. Mengganti konstruksi pasif yang berpotensi rancu dengan “yang disediakan untuk penyucian menurut adat orang Yahudi” membuat hubungan antarklausa lebih jelas dan tetap lugas.
  terminology: “Tempayan” tepat untuk ὑδρίαι, “penyucian” mempertahankan καθαρισμός dalam konteks ritual tanpa menambahkan penafsiran khusus, dan “orang Yahudi” sesuai konteks religius-budaya τῶν Ἰουδαίων. “Takaran” dapat dipertahankan di teks utama; metretēs dan perkiraan volumenya dijelaskan dalam catatan.
