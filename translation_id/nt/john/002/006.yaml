base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: id
  text: Di situ ada enam tempayan air dari batu, yang disediakan untuk penyucian menurut adat orang Yahudi.[a] Masing-masing dapat menampung dua atau tiga takaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan adat penyucian orang Yahudi”; ungkapan ini merujuk pada praktik pembasuhan ritual.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani metretēs adalah satuan cair kuno, kira-kira 35–40 liter.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: Di situ ada
  rationale: Menyampaikan keberadaan dan lokasi secara alami dalam bahasa Indonesia. δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan dengan kata waktu seperti “sekarang”.
- source_word: λίθιναι ὑδρίαι ἓξ
  choice: enam tempayan air dari batu
  rationale: “Tempayan air” menyatakan jenis wadah, sedangkan “dari batu” mempertahankan bahan pembuatannya; urutannya alami dalam bahasa Indonesia.
- source_word: κείμεναι
  choice: ditempatkan
  rationale: Partisip ini menyatakan bahwa tempayan-tempayan itu berada atau telah diletakkan di tempat tersebut. “Ditempatkan” lebih sesuai untuk wadah daripada terjemahan harfiah yang dapat menyiratkan posisi berbaring.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: sesuai dengan adat penyucian orang Yahudi
  rationale: “Adat penyucian” menyampaikan praktik pembersihan ritual tanpa mempersempitnya menjadi satu ritus tertentu. κατά dapat menyatakan kesesuaian dengan kebiasaan itu, sekaligus memungkinkan nuansa tujuan yang dicatat dalam catatan kaki.
- source_word: χωροῦσαι
  choice: Masing-masing dapat menampung
  rationale: Kata kerja ini menunjuk pada kapasitas. “Masing-masing” menyatakan daya tampung setiap tempayan yang tersirat oleh bentuk jamak dan ἀνά.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: dua atau tiga takaran
  rationale: Mempertahankan satuan kuno secara umum dalam teks utama tanpa memberi kesan bahwa padanannya dalam satuan modern benar-benar tepat; nama Yunani dan perkiraan kapasitas dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna τῶν Ἰουδαίων dalam konteks penyucian
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Dalam konteks ini ungkapan tersebut menunjuk pada kebiasaan religius-budaya, bukan terutama pada asal wilayah. “Orang Yahudi” menyampaikan makna itu tanpa menambahkan nada polemis.
- issue: Hubungan tempayan dengan καθαρισμός menurut κατά
  choice: sesuai dengan adat penyucian
  alternative: untuk adat penyucian
  rationale: κατά memungkinkan nuansa kesesuaian dengan kebiasaan, sedangkan konteks juga dapat menyiratkan tujuan penggunaan. Teks utama memakai rumusan yang dekat dengan struktur sumber, dan alternatif tujuan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Tempayan” mudah dipahami dan cocok bagi wadah air besar; istilah teknis kuno dijelaskan dalam catatan kaki.
