  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: id
  text: Yesus dan murid-murid-Nya juga diundang ke pesta pernikahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Yesus juga diundang, dan murid-murid-Nya, ke pesta pernikahan itu.”'
    reason: Urutan ini mempertahankan struktur Yunani, yang mula-mula menyebut Yesus dengan kata kerja pasif tunggal lalu mengoordinasikan murid-murid-Nya; terjemahan utama menyatakannya secara lebih alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: ἐκλήθη
  choice: diundang
  rationale: Dalam konteks menghadiri sebuah acara sosial, bentuk pasif καλέω secara alami berarti 'diundang', bukan sekadar 'dipanggil'.
- source_word: δὲ καὶ
  choice: juga
  rationale: Gabungan penghubung ringan δέ dan καί menambahkan Yesus serta murid-murid-Nya kepada orang-orang yang telah disebut dalam ayat sebelumnya; 'juga' menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: dan murid-murid-Nya
  rationale: καί mengoordinasikan Yesus dengan para murid-Nya. 'Murid-murid' mempertahankan makna orang-orang yang belajar dan mengikuti Yesus, sedangkan αὐτοῦ dinyatakan dengan akhiran posesif '-Nya'.
- source_word: εἰς τὸν γάμον
  choice: ke pesta pernikahan
  rationale: Dalam konteks ini γάμος menunjuk pada perayaan pernikahan. 'Pesta pernikahan' lebih jelas bagi pembaca Indonesia daripada hanya 'pernikahan' dan tidak menyiratkan upacara saja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kapitalisasi '-Nya' mengikuti kebiasaan penulisan Indonesia untuk pronomina yang merujuk kepada Yesus. Penanda catatan kaki [a] dicantumkan dalam teks utama.
