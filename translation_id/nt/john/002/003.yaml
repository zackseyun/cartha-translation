  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: id
  text: Ketika anggur habis[a], ibu Yesus berkata kepadanya[b], “Mereka tidak mempunyai anggur.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “ketika anggur tidak mencukupi.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, kata kerjanya berbentuk kini historis, secara harfiah “berkata.” Dalam narasi bahasa Indonesia, bentuk “berkata” tidak membedakan kala kini dan lampau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: ketika anggur habis
  rationale: Konstruksi genitif absolut dengan partisip aoris menyatakan keadaan atau peristiwa yang mendahului ujaran berikutnya. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan bahwa persediaan anggur telah habis, sementara catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: λέγει
  choice: berkata
  rationale: Bahasa Yunani memakai kala kini historis. Kata “berkata” merupakan bentuk naratif Indonesia yang alami dan tidak menandai kala secara morfologis; catatan kaki menjelaskan corak teks Yunani.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: ibu Yesus
  rationale: Mengikuti cara khas Yohanes menyebut tokoh ini dalam konteks tersebut tanpa mengganti sebutannya dengan nama yang tidak terdapat dalam ayat.
- source_word: πρὸς αὐτόν
  choice: kepadanya
  rationale: Menyatakan arah ujaran kepada Yesus secara langsung dan alami tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Mereka tidak mempunyai anggur
  rationale: Mempertahankan subjek jamak tersirat sebagai “mereka” tanpa menentukan apakah yang dimaksud adalah tuan rumah, penyelenggara, atau rombongan pesta.
- source_word: οἶνος
  choice: anggur
  rationale: Padanan biasa bagi minuman anggur dalam konteks perjamuan; tidak ada alasan kontekstual untuk memperlemah atau memparafrasakan istilah ini.
theological_decisions:
- issue: Kala kini historis dalam narasi Yohanes
  choice: Menggunakan “berkata” dan menjelaskan bentuk kini Yunani dalam catatan kaki
  alternative: Mengungkapkannya secara eksplisit dengan bentuk lampau, meskipun bahasa Indonesia tidak memiliki perubahan kala yang sepadan
  rationale: Pilihan ini mempertahankan corak wacana Yunani sejauh dapat dilakukan secara alami dalam bahasa Indonesia tanpa menciptakan pembedaan kala yang asing.
- issue: Rujukan subjek jamak tersirat dalam Οἶνον οὐκ ἔχουσιν
  choice: Mempertahankan “mereka” tanpa memperjelas rujukannya
  alternative: Menentukan subjek sebagai tuan rumah atau pihak penyelenggara pesta
  rationale: Teks Yunani tidak menyebut rujukan subjek jamak itu secara eksplisit, sehingga terjemahan tidak seharusnya menghapus ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ambiguitas subjek “mereka” dan corak kala kini historis dalam teks Yunani tetap dijaga. Pronomina ilahi tidak dikapitalisasi karena teks sumber tidak memberi pembedaan grafis semacam itu.
