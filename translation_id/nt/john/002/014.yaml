  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: id
  text: Di dalam Bait Allah[a] Ia mendapati orang-orang yang menjual sapi, domba, dan merpati, serta para penukar uang yang sedang duduk di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani yang diterjemahkan “Bait Allah” adalah ἱερόν, yang menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: mendapati
  rationale: Bentuk aoristus εὑρίσκω menyatakan apa yang Yesus jumpai di tempat itu; “mendapati” alami dalam bahasa Indonesia dan lebih dekat pada makna leksikal daripada sekadar “melihat”.
- source_word: ἱερῷ
  choice: Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam. “Bait Allah” adalah padanan Indonesia yang baku dan mudah dipahami, sedangkan cakupan ruangnya dijelaskan dalam catatan kaki.
- source_word: πωλοῦντας
  choice: orang-orang yang menjual
  rationale: Partisipel kini substantival ini menggambarkan kegiatan jual beli yang sedang berlangsung.
- source_word: βόας
  choice: sapi
  rationale: βοῦς dapat menunjuk pada ternak sapi secara umum. “Sapi” jelas dan wajar dalam bahasa Indonesia serta tidak mempersempit makna kepada jenis kelamin atau status kebiri tertentu.
- source_word: πρόβατα
  choice: domba
  rationale: Dalam konteks hewan kurban, πρόβατα paling wajar diterjemahkan “domba”.
- source_word: περιστερὰς
  choice: merpati
  rationale: περιστερά dapat berarti dara atau merpati; “merpati” merupakan istilah Indonesia yang umum dan sesuai dengan konteks hewan kurban.
- source_word: κερματιστὰς
  choice: para penukar uang
  rationale: κερματιστής adalah orang yang menukarkan uang atau koin; frasa ini akurat dan alami dalam bahasa Indonesia modern.
- source_word: καθημένους
  choice: yang sedang duduk di sana
  rationale: Partisipel ini menyatakan posisi mereka. “Sedang duduk di sana” mempertahankan gambaran adegan tanpa menambahkan meja yang tidak disebutkan dalam teks Yunani.
theological_decisions:
- issue: Cakupan ἱερόν dalam kaitannya dengan Bait Allah di Yerusalem
  choice: “Bait Allah” dalam teks utama, dengan catatan bahwa istilah Yunani menunjuk pada kompleks atau pelatarannya.
  alternative: “pelataran Bait Allah”; “kompleks Bait Allah”; “tempat kudus”
  rationale: Kehadiran para penjual hewan dan penukar uang menunjukkan kawasan Bait Allah yang lebih luas, bukan ruang kudus bagian dalam. Terjemahan utama tetap idiomatis, sementara catatan kaki menjaga ketepatan ruang tanpa mengatasi ambiguitas secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan keterangan tempat di awal; pengulangan καί dibawakan melalui koma dan “serta”. Huruf kapital pada “Ia” mengikuti register Alkitab Indonesia yang menghormati rujukan kepada Yesus tanpa menambahkan penafsiran ke dalam isi ayat.
