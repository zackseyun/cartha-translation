  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: id
  text: Namun, Yesus sendiri tidak memercayakan diri-Nya kepada mereka[a], karena Ia mengenal semua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai kata kerja yang sama seperti pada ayat sebelumnya: banyak orang “percaya kepada” Yesus, tetapi Yesus tidak “memercayakan diri-Nya kepada” mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Namun, Yesus sendiri
  rationale: δέ menandai pertentangan dengan respons orang banyak pada ayat sebelumnya, sedangkan αὐτός bersifat emfatis; susunan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: οὐκ ἐπίστευεν
  choice: tidak memercayakan
  rationale: Dengan objek refleksif dan penerima dalam bentuk datif, πιστεύω di sini berarti menyerahkan atau memercayakan diri, bukan sekadar percaya. Bentuk imperfek dipahami sebagai sikap yang berlangsung, yang secara alami dapat dinyatakan dengan bentuk verba Indonesia tanpa penanda aspek tambahan.
- source_word: αὑτὸν αὐτοῖς
  choice: diri-Nya kepada mereka
  rationale: Ungkapan ini mempertahankan hubungan refleksif dan penerima tindakan; kapitalisasi pronomina mengikuti kebiasaan bahasa Indonesia bagi rujukan kepada Yesus.
- source_word: διὰ τὸ
  choice: karena
  rationale: διά dengan infinitif berartikel menyatakan sebab; 'karena' merupakan padanan modern dan langsung.
- source_word: αὐτὸν γινώσκειν
  choice: Ia mengenal
  rationale: Konstruksi infinitif dialihkan secara idiomatis menjadi klausa finit. 'Mengenal' mencakup pengetahuan pribadi dan pemahaman mengenai manusia dalam konteks ini.
- source_word: πάντας
  choice: semua orang
  rationale: Bentuk jamak maskulin ini merujuk secara umum kepada manusia. 'Semua orang' jelas, alami, dan tidak mempersempit cakupannya.
theological_decisions:
- issue: Hubungan leksikal πιστεύω dalam ayat 23–24
  choice: Gunakan 'percaya' pada ayat 23 dan 'memercayakan diri' pada ayat 24, sambil menjelaskan pengulangan verba Yunani dalam catatan kaki.
  alternative: Memakai 'percaya' secara harfiah pada kedua ayat atau memakai 'mempercayai' pada ayat 24.
  rationale: Verba Yunani yang sama membentuk permainan kata yang disengaja, tetapi konstruksi pada ayat 24 secara idiomatis berarti memercayakan diri. Terjemahan utama menyampaikan makna kontekstual, sedangkan catatan mempertahankan hubungan leksikalnya.
- issue: Cakupan πάντας
  choice: Terjemahkan sebagai 'semua orang' tanpa membatasinya pada kelompok tertentu.
  alternative: Semua manusia; setiap orang; mereka semua.
  rationale: Teks menyatakan keluasan pengetahuan Yesus mengenai orang-orang dan mengarah ke pembicaraan tentang apa yang ada dalam diri manusia pada ayat berikutnya, tanpa perlu menambahkan rumusan doktrinal yang melampaui ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Namun' menyatakan peralihan yang berlawanan secara alami; 'memercayakan diri-Nya' dipilih untuk ketepatan idiomatis sekaligus mempertahankan gema leksikal melalui catatan kaki.
