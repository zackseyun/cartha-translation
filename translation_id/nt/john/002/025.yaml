  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: id
  text: dan karena Ia tidak memerlukan seorang pun untuk memberi kesaksian tentang manusia[a], sebab Ia sendiri tahu apa yang ada dalam diri manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tentang seseorang”; kata Yunani yang diterjemahkan “manusia” berbentuk tunggal dan digunakan secara umum untuk seorang manusia atau umat manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: tidak perlu
  rationale: Ungkapan χρείαν ἔχειν berarti ‘mempunyai kebutuhan/perlu’. Bentuk ‘tidak perlu’ paling alami dalam bahasa Indonesia modern.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: seorang pun memberi kesaksian
  rationale: Setelah penyangkalan, τις secara alami diterjemahkan ‘seorang pun’; μαρτυρέω dipertahankan sebagai ‘memberi kesaksian’, sesuai dengan motif kesaksian dalam Injil Yohanes.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: tentang manusia
  rationale: ἄνθρωπος tunggal dipakai secara generik. ‘Manusia’ dapat menunjuk seorang manusia maupun umat manusia tanpa membatasi cakupannya.
- source_word: αὐτὸς γὰρ
  choice: sebab Ia sendiri
  rationale: ‘Ia sendiri’ mempertahankan penekanan αὐτός, sedangkan ‘sebab’ menyatakan fungsi penjelas γάρ secara alami.
- source_word: ἐγίνωσκεν
  choice: tahu
  rationale: Imperfek verba statif ini menyatakan pengetahuan yang menetap atau khas; ‘tahu’ merupakan padanan Indonesia yang wajar tanpa membuat aspek tersebut berlebihan.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: apa yang ada dalam diri manusia
  rationale: Frasa ini sengaja luas dan menunjuk realitas batin manusia. ‘Dalam diri’ alami dalam bahasa Indonesia, sementara pengulangan ‘manusia’ mempertahankan kaitan dengan frasa sebelumnya.
theological_decisions:
- issue: Cakupan pengetahuan Yesus mengenai manusia
  choice: Pernyataan diterjemahkan sebagai pengetahuan langsung Yesus tentang apa yang ada dalam diri manusia, dengan ‘manusia’ tetap bercakupan luas.
  alternative: ‘apa yang ada dalam diri setiap orang’ atau ‘sifat dasar manusia’
  rationale: Bentuk tunggal generik ἀνθρώπου/ἀνθρώπῳ dapat mencakup pribadi tertentu sekaligus manusia secara umum. Terjemahan tidak mempersempitnya menjadi wawasan sosial semata atau memperluasnya dengan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi ‘Ia’ mengikuti kebiasaan penulisan rujukan kepada Yesus dalam Alkitab bahasa Indonesia. Struktur sebab-akibat dan penekanan pada pengetahuan langsung Yesus dipertahankan.
