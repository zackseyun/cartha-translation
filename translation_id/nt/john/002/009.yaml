  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: id
  text: Ketika pemimpin perjamuan itu mencicipi air yang telah menjadi anggur dan tidak tahu dari mana asalnya (tetapi para pelayan yang telah menimba air itu tahu), pemimpin perjamuan itu memanggil pengantin laki-laki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: pemimpin perjamuan
  rationale: Istilah ini menunjuk kepada orang yang mengawasi penyelenggaraan perjamuan. Pilihan ini jelas dalam bahasa Indonesia dan tidak mempersempit perannya menjadi sekadar kepala pelayan.
- source_word: ἐγεύσατο
  choice: mencicipi
  rationale: Kata ini secara langsung menyatakan tindakan mengecap atau mencicipi, dan bentuk ini alami dalam konteks hidangan perjamuan.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: air yang telah menjadi anggur
  rationale: Partisip perfek menyatakan perubahan keadaan yang telah terjadi dengan hasil yang tetap berlaku; terjemahan ini mempertahankan pernyataan transformasi secara lugas.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: ia tidak tahu dari mana asalnya
  rationale: πόθεν menanyakan asal atau sumber. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan acuan kepada anggur yang sedang dicicipi.
- source_word: διάκονοι
  choice: para pelayan
  rationale: Dalam konteks perjamuan, kata ini menunjuk kepada orang-orang yang melayani, bukan jabatan gerejawi.
- source_word: ἠντληκότες
  choice: yang menimba
  rationale: Kata ini menyatakan tindakan mengambil air dengan menimba. Bentuk partisipnya secara alami diterjemahkan sebagai klausa relatif.
- source_word: φωνεῖ
  choice: memanggil
  rationale: Present historis Yunani memberi kejelasan naratif, tetapi bahasa Indonesia modern biasanya memakai bentuk verba yang sama tanpa penandaan kala; 'memanggil' mempertahankan tindakan itu secara alami.
- source_word: νυμφίον
  choice: mempelai laki-laki
  rationale: Padanan baku dan bermartabat untuk laki-laki yang menikah dalam konteks pesta perkawinan.
- source_word: ὡς δὲ
  choice: Ketika
  rationale: Gabungan ini mengantar peristiwa berikutnya. 'Ketika' menyampaikan hubungan waktunya tanpa menambahkan penanda wacana yang tidak diperlukan.
theological_decisions:
- issue: Gambaran naratif tentang mukjizat
  choice: air yang telah menjadi anggur
  alternative: air yang berubah menjadi anggur
  rationale: Bahasa Yunani menyatakan bahwa air itu telah menjadi anggur. Terjemahan mempertahankan transformasi nyata tersebut tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sisipan tentang pengetahuan para pelayan dipisahkan dengan tanda pisah agar struktur kalimat Yunani tetap terbaca jelas tanpa terasa kaku. Tidak ada catatan kaki karena alternatif leksikal dan present historis tidak menimbulkan ambiguitas penting dalam bahasa Indonesia.
