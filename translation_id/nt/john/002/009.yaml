  - severity: low
    issue: Padanan νυμφίος dapat dibuat lebih idiomatis.
    rationale: '"Mempelai laki-laki" dapat dipahami, tetapi "pengantin laki-laki" adalah padanan modern yang lebih umum dan alami bagi bridegroom.'
