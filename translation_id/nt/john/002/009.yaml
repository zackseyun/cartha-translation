- from: Ketika pemimpin perjamuan mencicipi air yang telah menjadi anggur—ia tidak tahu dari mana asalnya, tetapi para pelayan yang menimba air itu tahu—pemimpin perjamuan itu memanggil mempelai laki-laki.
  to: Ketika pemimpin perjamuan itu mencicipi air yang telah menjadi anggur dan tidak tahu dari mana asalnya (tetapi para pelayan yang telah menimba air itu tahu), pemimpin perjamuan itu memanggil pengantin laki-laki.
  rationale: Revisi hanya memperjelas bahwa para pelayan sudah menimba air sebelum pemimpin perjamuan mencicipinya, sesuai nilai perfek ἠντληκότες, dan memakai padanan Indonesia yang lebih idiomatis untuk νυμφίος. Makna, hubungan antarklausa, dan pernyataan perubahan air menjadi anggur tetap dipertahankan.
