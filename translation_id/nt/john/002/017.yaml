review_pass:
  verdict: revise
  source_fidelity: Bentuk futur καταφάγεταί dipertahankan dengan “akan.” Namun, “menghanguskan” secara khusus berarti membakar sampai hangus, sedangkan καταφάγεταί berarti “akan menghabiskan/melalap”; unsur pembakaran tidak ada dalam teks Yunani. Catatan alternatif juga diperlukan untuk mendokumentasikan perbedaan bentuk dengan tradisi Mazmur sebagaimana jejak audit bahasa Inggris.
  naturalness: “Murid-murid-Nya teringat bahwa ada tertulis” adalah bahasa Indonesia baku dan wajar dalam register Kitab Suci. “Semangat untuk rumah-Mu akan menghabiskan Aku” alami dan lebih dekat pada makna verba sumber daripada “menghanguskan.”
  terminology: “Murid-murid,” “ada tertulis,” “semangat,” dan “rumah-Mu” mempertahankan register serta gema kutipan Mazmur. “Rumah” tidak diganti dengan “Bait Allah,” sehingga tidak mempersempit ungkapan sumber.
  issues:
  - severity: medium
    issue: “Menghanguskan” menambahkan citra pembakaran.
    rationale: καταφάγεταί adalah futur dari kata kerja “memakan habis/menghabiskan, melalap”; kata itu tidak menuntut arti ‘membakar hingga hangus.’ “Akan menghabiskan” menyampaikan dampak penghabisan tanpa tambahan citra.
  - severity: low
    issue: Catatan kaki untuk varian bentuk kutipan Mazmur tidak dicantumkan.
    rationale: Jejak audit Inggris menandai alternatif “telah menghabiskan Aku” dalam beberapa tradisi tekstual Mazmur, sementara Yohanes memakai futur. Penanda setelah formula kutipan dan catatan terjemahan mempertahankan informasi ini.
