  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: id
  text: Murid-murid-Nya teringat bahwa ada tertulis[a], “Semangat untuk rumah-Mu akan menghabiskan Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah menghabiskan Aku,” sesuai dengan rumusan Mazmur 69:10 dalam beberapa tradisi tekstual; bahasa Yunani Yohanes di sini berbunyi “akan menghabiskan Aku.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: teringat
  rationale: Bentuk aoris pasif/deponen ini secara alami menyatakan bahwa para murid teringat akan suatu nas Kitab Suci; “teringat” lebih wajar dalam bahasa Indonesia daripada bentuk harfiah pasif.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: “Murid” adalah padanan baku dan alami untuk μαθητής, sedangkan enklitik hormat “-Nya” merujuk kepada Yesus.
- source_word: γεγραμμένον ἐστίν
  choice: ada tertulis
  rationale: Ungkapan ini merupakan formula pengantar kutipan Kitab Suci. “Ada tertulis” mempertahankan nuansa bahwa tulisan itu tetap berlaku dan terdengar alami dalam ragam kitab suci Indonesia.
- source_word: ζῆλος
  choice: semangat
  rationale: Dalam konteks ini ζῆλος menunjuk pada gairah atau pengabdian yang sangat kuat. “Semangat” jelas bagi pembaca modern dan tidak memasukkan arti “kecemburuan” yang kurang cocok di sini.
- source_word: τοῦ οἴκου σου
  choice: untuk rumah-Mu
  rationale: “Rumah” mempertahankan ungkapan kutipan Mazmur dan acuannya kepada rumah Allah; menerjemahkannya sebagai “Bait Allah” akan memperjelas konteks tetapi mempersempit kata sumber.
- source_word: καταφάγεταί
  choice: akan menghanguskan
  rationale: Bentuk futur ini menggambarkan semangat yang menghabiskan atau membinasakan diri si pembicara. “Menghanguskan” merupakan ungkapan Indonesia yang hidup dan bermartabat untuk daya yang melalap, tanpa terdengar seharfiah “memakan habis”.
- source_word: με
  choice: aku
  rationale: Kata ganti objek orang pertama ini berada dalam kutipan Mazmur; “aku” sesuai dengan suara pemazmur dan penerapannya kepada Yesus.
theological_decisions:
- issue: Bentuk futur dalam kutipan Mazmur yang diterapkan kepada Yesus
  choice: 'Mempertahankan orientasi masa depan: “akan menghanguskan aku”'
  alternative: “telah menghanguskan aku” atau “menghanguskan aku”
  rationale: Teks Yunani Yohanes dalam SBLGNT memakai bentuk futur καταφάγεταί. Terjemahan mengikuti bentuk yang terdapat dalam Yohanes dan tidak menyelaraskannya secara diam-diam dengan tradisi tekstual Mazmur yang memakai pengertian lampau.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan mempertahankan “rumah” dan bentuk futur sumber Yunani. Tidak diberikan catatan kaki karena teks utama langsung mengikuti bacaan SBLGNT; tidak ada penanda catatan yang diperlukan.
