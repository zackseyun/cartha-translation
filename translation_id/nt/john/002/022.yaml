id: JHN.2.22
reference: John 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: id
  text: Maka ketika Ia dibangkitkan dari antara orang mati,[a] murid-murid-Nya teringat bahwa Ia telah mengatakan hal itu,[b] dan mereka percaya kepada Kitab Suci dan kepada perkataan yang telah diucapkan Yesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Ia bangkit dari antara orang mati.” Kata kerja Yunaninya berbentuk pasif, “dibangkitkan,” sebagaimana dipertahankan dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “bahwa Ia mengatakan hal itu” atau “bahwa Ia terus mengatakan hal itu.” Bentuk imperfek Yunani dapat menggambarkan perkataan yang berlangsung atau berulang pada waktu lampau.
    reason: lexical_alternative
  - marker: c
    text: Atau “pernyataan.” Kata Yunani yang diterjemahkan “perkataan” dapat menunjuk pada perkataan, pernyataan, atau pesan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Maka, ketika
  rationale: ὅτε memperkenalkan anak kalimat waktu, sedangkan οὖν menghubungkannya dengan alur dan kesimpulan naratif sebelumnya. 'Maka, ketika' mempertahankan kedua fungsi itu secara alami.
- source_word: ἠγέρθη
  choice: Ia dibangkitkan
  rationale: Bentuk pasif dipertahankan, dan dalam konteks ini ἐγείρω menunjuk pada kebangkitan dari kematian.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini mempertahankan bentuk jamak νεκρῶν dan menyampaikan idiom kebangkitan dengan jelas dalam bahasa Indonesia.
- source_word: ἐμνήσθησαν
  choice: teringat
  rationale: Kata ini menyatakan bahwa sesuatu yang telah didengar sebelumnya muncul kembali dalam ingatan para murid; 'teringat' alami dalam konteks naratif.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan idiomatis langsung bagi konstruksi posesif Yunani.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: bahwa Ia pernah mengatakan hal itu
  rationale: Imperfek ἔλεγεν menempatkan perkataan itu dalam latar waktu lampau. 'Pernah mengatakan' alami dan tidak memaksakan makna bahwa perkataan tersebut berulang kali diucapkan.
- source_word: ἐπίστευσαν
  choice: mereka percaya kepada
  rationale: πιστεύω dengan objek datif di sini menyatakan penerimaan sebagai benar atau dapat dipercaya. 'Percaya kepada' menjaga kedua objek tetap sejajar dan alami dalam bahasa Indonesia.
- source_word: τῇ γραφῇ
  choice: Kitab Suci
  rationale: γραφή tunggal di sini menunjuk pada tulisan suci yang berwibawa; 'Kitab Suci' merupakan padanan baku dan wajar.
- source_word: τῷ λόγῳ
  choice: perkataan
  rationale: λόγος menunjuk pada ucapan Yesus yang baru disebut. 'Perkataan' lebih alami daripada 'firman' untuk ucapan tertentu ini tanpa menghilangkan bobotnya.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: yang telah diucapkan Yesus
  rationale: Klausa relatif ini menerangkan 'perkataan' dan memandang ucapan Yesus dari sudut waktu kebangkitan; 'telah diucapkan' menyampaikan hubungan waktu itu dengan jelas.
theological_decisions:
- issue: Bentuk pasif kata kerja kebangkitan
  choice: Ia dibangkitkan dari antara orang mati
  alternative: Ia bangkit dari antara orang mati
  rationale: Teks Yunani memakai bentuk pasif. Mempertahankannya mengikuti bentuk sumber tanpa menetapkan secara eksplisit pelaku yang tidak disebut dalam ayat ini.
- issue: Makna πιστεύω dengan objek datif
  choice: percaya kepada Kitab Suci dan perkataan
  alternative: memercayai Kitab Suci dan perkataan
  rationale: '''Percaya kepada'' mempertahankan konstruksi sejajar terhadap Kitab Suci dan ucapan Yesus serta tidak memperluas tindakan percaya menjadi rumusan teologis yang lebih khusus.'
- issue: Aspek imperfek ἔλεγεν
  choice: pernah mengatakan
  alternative: sedang mengatakan; berulang kali mengatakan
  rationale: Imperfek menampilkan tindakan lampau dari sudut pandang naratif, tetapi konteks tidak menuntut penafsiran bahwa Yesus mengulanginya berkali-kali. Catatan kaki mempertahankan kemungkinan aspek berlangsung atau berulang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Tanda titik memecah kalimat Yunani yang panjang agar mudah dipahami tanpa mengubah hubungan logisnya.
