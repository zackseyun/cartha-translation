id: JHN.2.16
reference: John 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: id
  text: Kepada orang-orang yang menjual burung merpati, Ia berkata, “Bawa semua ini pergi dari sini! Jangan jadikan rumah Bapa-Ku rumah perdagangan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat berdagang.” Secara lebih harfiah, teks Yunani berbunyi “rumah perdagangan,” sehingga pengulangan kata “rumah” dalam kalimat ini tetap terpelihara.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: burung merpati
  rationale: Istilah ini menunjuk pada burung yang dijual untuk persembahan. “Burung merpati” merupakan padanan Indonesia yang alami dan tidak memaksakan pembedaan zoologis yang tidak dinyatakan oleh konteks.
- source_word: πωλοῦσιν
  choice: yang menjual
  rationale: Partisipel kini ini mengidentifikasi orang-orang tersebut berdasarkan kegiatan dagang yang sedang mereka lakukan; bentuk “yang menjual” ringkas dan alami.
- source_word: Ἄρατε
  choice: Bawa ... pergi
  rationale: Imperatif aoris menuntut tindakan tegas. Gabungan “bawa ... pergi dari sini” menyampaikan tindakan memindahkan secara jelas dan wajar dalam bahasa Indonesia.
- source_word: ταῦτα
  choice: semua ini
  rationale: Kata tunjuk netral jamak ini tidak merinci apakah yang dimaksud burung, sangkar, atau barang terkait lainnya. “Semua ini” mempertahankan keluasan rujukannya tanpa menambah rincian.
- source_word: ἐντεῦθεν
  choice: dari sini
  rationale: Adverbia ini menandai pemindahan dari tempat pembicara berada dan berpadu secara alami dengan “bawa ... pergi”.
- source_word: μὴ ποιεῖτε
  choice: Jangan jadikan
  rationale: Larangan dengan μή dan imperatif kini diterjemahkan langsung sebagai larangan. “Jadikan” menyampaikan ποιεῖτε secara alami tanpa menambahkan gagasan lain.
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: rumah Bapa-Ku
  rationale: Ungkapan ini mempertahankan sebutan bait sebagai “rumah” sekaligus klaim relasional eksplisit Yesus, yaitu “Bapa-Ku”.
- source_word: οἶκον ἐμπορίου
  choice: rumah perdagangan
  rationale: Padanan ini mempertahankan pengulangan οἶκον (“rumah ... rumah”) dan kontras retoris dalam perkataan Yesus. Bentuk yang lebih idiomatis, “tempat berdagang,” akan menghilangkan pengulangan tersebut.
theological_decisions:
- issue: Sebutan Yesus bagi bait sebagai “rumah Bapa-Ku”
  choice: 'Mempertahankan bentuk tunggal dan klaim pribadi: “rumah Bapa-Ku.”'
  alternative: “rumah Bapa kita” atau “rumah Allah”
  rationale: Teks Yunani memakai μου (“-Ku”), sehingga hubungan filial yang dinyatakan Yesus tidak boleh diperluas menjadi “kita” ataupun diganti dengan sebutan umum “Allah”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan klausa disesuaikan secara ringan agar alami. Tanda seru pada perintah pertama menyampaikan ketegasan imperatif tanpa mengubah isi. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
