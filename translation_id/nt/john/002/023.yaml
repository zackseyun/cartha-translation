source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: id
  text: Ketika Ia berada di Yerusalem pada waktu Paskah, selama perayaan itu, banyak orang percaya kepada nama-Nya[a] ketika mereka menyaksikan tanda-tanda[b] yang dilakukan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “percaya kepada-Nya.” Secara harfiah, “percaya kepada nama-Nya,” ungkapan khas Yohanes yang menekankan kepercayaan kepada identitas-Nya yang dinyatakan.
    reason: lexical_alternative
  - marker: b
    text: “Tanda-tanda” adalah istilah khas Yohanes bagi perbuatan yang menunjuk melampaui dirinya kepada siapa Yesus itu; beberapa terjemahan memakai “tanda-tanda ajaib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ketika
  rationale: Mengawali latar waktu bagi adegan baru dengan kesinambungan ringan; bentuk ini alami dalam narasi Indonesia tanpa menambahkan kata waktu yang tidak tersurat.
- source_word: ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: Ia berada di Yerusalem
  rationale: Padanan lokatif yang baku dan alami dalam bahasa Indonesia modern.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: pada waktu Paskah, selama perayaan itu
  rationale: 'Mempertahankan dua keterangan yang saling menjelaskan: Paskah sebagai waktu dan perayaan tersebut sebagai suasana berlangsungnya kejadian.'
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Bahasa Indonesia memerlukan nomina orang agar ungkapan kuantitatif ini terdengar lengkap dan alami.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: percaya kepada nama-Nya
  rationale: Mempertahankan ungkapan khas Yohanes yang mengarahkan kepercayaan kepada nama, yakni identitas yang dinyatakan, tanpa meratakannya menjadi sekadar 'percaya kepada-Nya'.
- source_word: θεωροῦντες
  choice: ketika mereka menyaksikan
  rationale: Menyatakan pengamatan yang berlangsung bersamaan dengan tindakan percaya, sambil tidak memaksakan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
- source_word: τὰ σημεῖα
  choice: tanda-tanda
  rationale: Mempertahankan istilah khas Yohanes bagi perbuatan yang menunjuk melampaui dirinya kepada identitas Yesus, tanpa menambahkan kata 'mukjizat' dalam teks utama.
- source_word: ἃ ἐποίει
  choice: yang dilakukan-Nya
  rationale: Ungkapan ini alami dalam bahasa Indonesia; konteks dan konstruksi dengan 'menyaksikan' tetap menggambarkan tindakan-tindakan yang sedang berlangsung pada masa itu.
theological_decisions:
- issue: Sifat kepercayaan yang dinyatakan oleh ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: Menerjemahkannya secara langsung sebagai 'banyak orang percaya kepada nama-Nya'.
  alternative: Menafsirkannya sebagai iman awal, dangkal, atau sekadar pengakuan karena mukjizat.
  rationale: Ayat ini sendiri menyatakan bahwa mereka percaya kepada nama-Nya. Mutu atau kecukupan iman itu tidak diturunkan dalam terjemahan ini; konteks berikutnya dapat memberi nuansa sehingga ketegangan naratif Yohanes tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada ungkapan yang benar-benar diterangkannya, yaitu “nama-Nya” dan “tanda-tanda”.
