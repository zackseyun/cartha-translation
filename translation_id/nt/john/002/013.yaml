  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: id
  text: Paskah orang Yahudi sudah dekat[a], dan Yesus naik ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Paskah orang-orang Yudea.” Dalam Injil Yohanes, Ἰουδαῖοι dalam beberapa konteks dapat berarti “orang-orang Yudea,” bukan “orang Yahudi”; tetapi di sini istilah itu paling wajar menyatakan bahwa Paskah adalah perayaan Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: sudah dekat
  rationale: Dalam konteks ini, kata tersebut menyatakan kedekatan waktu. Ungkapan “sudah dekat” alami dalam bahasa Indonesia dan menunjukkan bahwa perayaan itu segera tiba.
- source_word: πάσχα
  choice: Hari Raya Paskah
  rationale: Ini adalah sebutan Indonesia yang lazim bagi perayaan Yahudi yang dimaksud; penambahan “Hari Raya” memperjelas bahwa πάσχα di sini menunjuk pada perayaan.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Frasa ini menerangkan Paskah sebagai perayaan Yahudi. Dalam konteks ini, makna tersebut lebih wajar daripada pembatasan regional “orang Yudea,” tetapi alternatif leksikalnya tetap dicatat.
- source_word: ἀνέβη
  choice: pergi ke
  rationale: Dalam bahasa Yunani, verba ini secara harfiah berarti “naik” dan lazim digunakan untuk perjalanan menuju Yerusalem. Dalam bahasa Indonesia modern, “pergi ke Yerusalem” lebih alami; nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama kota tersebut dalam bahasa Indonesia.
- source_word: Καὶ
  choice: dan
  rationale: καί pertama berfungsi melanjutkan narasi dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia; καί kedua diterjemahkan “dan” untuk menghubungkan kedua klausa.
theological_decisions:
- issue: Makna Ἰουδαῖοι dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Di sini istilah tersebut menerangkan identitas perayaan Paskah, bukan secara jelas menunjuk pada kelompok regional atau lawan tertentu. “Orang Yahudi” paling sesuai dengan konteks, sedangkan kemungkinan “orang Yudea” dicatat tanpa dipaksakan ke dalam teks utama.
- issue: Nuansa ἀνέβη dalam perjalanan ke Yerusalem
  choice: pergi ke
  alternative: naik ke
  rationale: “Naik ke” mempertahankan bentuk verba Yunani dan bahasa ziarah, tetapi dapat terdengar kurang alami bagi sebagian pembaca Indonesia. Teks utama mengutamakan kelancaran, sementara nuansa sumber dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada naratif yang bermartabat. “Hari Raya Paskah” membedakan perayaan dari penggunaan lain istilah Paskah dalam bahasa Indonesia. Catatan kaki mempertahankan ambiguitas Ἰουδαῖοι dan nuansa perjalanan “naik” menuju Yerusalem.
