id: JHN.2.11
reference: John 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: id
  text: Yesus melakukan hal ini[a] di Kana di Galilea sebagai permulaan tanda-tanda-Nya. Ia menyatakan kemuliaan-Nya, dan murid-murid-Nya percaya kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan ini sebagai yang pertama dari tanda-tanda-Nya.”
    reason: Alternatif ini mengungkapkan secara eksplisit daya kontekstual ἀρχή sebagai tanda pertama, sedangkan teks utama mempertahankan arti dasarnya, “permulaan”.
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: melakukan hal ini
  rationale: Demonstrativa ταύτην menunjuk pada tindakan yang baru dikisahkan, sedangkan ἐποίησεν adalah verba umum ‘melakukan/membuat’. Ungkapan ini tidak menambahkan kata ‘mukjizat’ atau ‘tanda’ ke dalam pronomina.
- source_word: ἀρχὴν τῶν σημείων
  choice: sebagai permulaan tanda-tanda-Nya
  rationale: ἀρχή berarti ‘permulaan’ dan dalam konteks ini menandai tindakan tersebut sebagai tanda pembuka dalam rangkaian tanda Yesus. ‘Sebagai’ membuat hubungan predikatifnya jelas dan alami dalam bahasa Indonesia; ‘-Nya’ ditambahkan dari konteks.
- source_word: σημείων
  choice: tanda-tanda
  rationale: Dalam Injil Yohanes, σημεῖον menunjuk pada karya yang menyingkapkan identitas dan kemuliaan Yesus; ‘tanda’ mempertahankan fungsi khas itu lebih baik daripada ‘mukjizat’.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: di Kana, Galilea
  rationale: Bentuk geografis yang ringkas dan alami dalam bahasa Indonesia, sekaligus membedakan Kana ini berdasarkan wilayahnya.
- source_word: ἐφανέρωσεν
  choice: menyatakan
  rationale: φανερόω berarti membuat sesuatu tampak atau diketahui. ‘Menyatakan’ jelas, wajar, dan mempertahankan gagasan penyingkapan.
- source_word: τὴν δόξαν αὐτοῦ
  choice: kemuliaan-Nya
  rationale: ‘Kemuliaan’ merupakan padanan baku dan sesuai bagi δόξα, istilah teologis penting yang di sini merujuk pada tersingkapnya keagungan Yesus.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: percaya kepada-Nya
  rationale: πιστεύω dengan εἰς mengungkapkan kepercayaan yang diarahkan kepada Yesus. ‘Percaya kepada-Nya’ alami dalam bahasa Indonesia dan mempertahankan daya relasionalnya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan Indonesia yang alami dan tepat bagi frasa posesif Yunani tersebut.
theological_decisions:
- issue: Istilah σημεῖον dalam Injil Yohanes
  choice: Diterjemahkan ‘tanda’, bukan ‘mukjizat’.
  alternative: mukjizat
  rationale: Karya-karya ini bukan hanya pertunjukan kuasa, melainkan tanda yang menyingkapkan identitas dan kemuliaan Yesus. ‘Tanda’ menjaga dimensi teologis Yohanes tanpa menambahkan tafsiran.
- issue: Daya ungkapan ἀρχὴν τῶν σημείων
  choice: Diterjemahkan ‘sebagai permulaan tanda-tanda-Nya’.
  alternative: sebagai yang pertama dari tanda-tanda-Nya
  rationale: ἀρχή secara langsung berarti ‘permulaan’, tetapi dalam konteks juga menyatakan bahwa inilah tanda pertama. Teks utama mempertahankan bentuk sumber, sedangkan alternatif yang sah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar hubungan antarklausa jelas tanpa menghilangkan isinya. Bentuk hormat pronominal ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
