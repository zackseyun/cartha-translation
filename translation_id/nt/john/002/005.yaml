base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: id
  text: Ibu-Nya berkata kepada para pelayan, “Apa pun yang Ia katakan kepadamu, lakukanlah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μήτηρ αὐτοῦ
  choice: Ibu-Nya
  rationale: Bentuk ini alami dalam narasi Indonesia dan mempertahankan hubungan kekeluargaan serta pronomina yang merujuk kepada Yesus.
- source_word: τοῖς διακόνοις
  choice: kepada para pelayan
  rationale: Dalam konteks pesta pernikahan, kata ini menunjuk kepada orang-orang yang melayani, bukan jabatan gerejawi di kemudian hari.
- source_word: Ὅ τι ἂν
  choice: Apa pun yang
  rationale: Konstruksi relatif tak tentu dengan ἄν menyatakan kemungkinan yang terbuka; frasa ini menangkapnya secara wajar dalam bahasa Indonesia modern.
- source_word: λέγῃ ὑμῖν
  choice: dikatakan-Nya kepadamu
  rationale: Ungkapan ini menyampaikan arti 'apa pun yang mungkin Ia katakan kepada kalian' secara alami, tanpa perlu menambahkan nama Yesus.
- source_word: ποιήσατε
  choice: lakukanlah
  rationale: Imperatif ini memerintahkan para pelayan untuk melaksanakan apa pun yang dikatakan; enklitik -lah memberi nada perintah yang tegas namun wajar.
theological_decisions:
- issue: Subjek tersirat pada λέγῃ
  choice: Diterjemahkan dengan pronomina hormat -Nya yang merujuk kepada Yesus.
  alternative: Apa pun yang Yesus katakan kepadamu, lakukanlah.
  rationale: Bahasa Yunani tidak menyebut nama Yesus, meskipun konteks membuat rujukannya jelas. Pronomina mempertahankan keekonomisan teks sumber tanpa memperluasnya secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Kepadamu' dipahami sebagai sapaan kepada kelompok para pelayan, sebagaimana bentuk jamak ὑμῖν dalam bahasa Yunani; bahasa Indonesia tidak menandai perbedaan tunggal-jamak pada pronomina ini.
