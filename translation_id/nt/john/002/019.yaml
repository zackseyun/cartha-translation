  naturalness: “Yesus menjawab dan berkata kepada mereka” dapat diterima dalam register Alkitab, meskipun agak harfiah. “Bait Allah” dan “dalam tiga hari” alami. Untuk objek “Bait Allah,” “Aku akan mendirikannya kembali” adalah idiom Indonesia yang wajar.
