  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepada mereka, “Hancurkan Bait Allah ini, dan dalam tiga hari Aku akan mendirikannya kembali.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Robohkan Bait Allah ini ... Aku akan membangunnya kembali.” Kata Yunani yang diterjemahkan “mendirikannya kembali” juga dapat beresonansi dengan kebangkitan; Yohanes kemudian menjelaskan bahwa Yesus berbicara tentang bait tubuh-Nya (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: menjawab dan berkata
  rationale: Mempertahankan struktur ungkapan Yunani yang dipengaruhi gaya Semitis; bentuk ini tetap alami dan bermartabat dalam bahasa Indonesia.
- source_word: Λύσατε
  choice: Hancurkan
  rationale: Dalam konteks Bait Allah, λύω menunjuk pada penghancuran atau perobohan, bukan sekadar pelepasan.
- source_word: τὸν ναὸν τοῦτον
  choice: Bait Allah ini
  rationale: ναός merujuk pada bait atau tempat kudus; 'Bait Allah' merupakan istilah Indonesia yang jelas dan lazim, sementara 'ini' mempertahankan demonstratif τοῦτον.
- source_word: ἐν τρισὶν ἡμέραις
  choice: dalam tiga hari
  rationale: Menerjemahkan ungkapan waktu secara langsung tanpa mempersempit nuansanya menjadi 'setelah' atau 'dalam waktu paling lama'.
- source_word: ἐγερῶ αὐτόν
  choice: Aku akan membangkitkannya
  rationale: ἐγείρω dapat berarti mendirikan atau membangkitkan. 'Membangkitkannya' tetap dapat dipahami secara metaforis terhadap bait dan sekaligus mempertahankan gema kebangkitan yang dijelaskan dalam Yohanes 2:21.
theological_decisions:
- issue: Identitas 'Bait Allah ini'
  choice: Tidak menjelaskan dalam teks utama bahwa yang dimaksud ialah tubuh Yesus.
  alternative: Bait Allah ini, yaitu tubuh-Ku
  rationale: Ucapan pada ayat ini sengaja bersifat enigmatik; penjelasan narator baru diberikan dalam Yohanes 2:21. Ambiguitas dan ketegangan naratif perlu dipertahankan.
- issue: Nuansa ἐγερῶ antara pembangunan dan kebangkitan
  choice: Aku akan membangkitkannya
  alternative: Aku akan membangunnya kembali
  rationale: Pilihan ini mempertahankan gema kebangkitan dalam ἐγείρω tanpa menambahkan secara eksplisit identitas bait sebagai tubuh Yesus; alternatif arsitektural dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi 'Aku' mengikuti rujukan kepada Yesus. Catatan kaki mempertahankan kemungkinan pembacaan arsitektural tanpa menghilangkan gema kebangkitan.
