  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: id
  text: Setelah membuat cambuk dari tali-tali, Ia mengusir semuanya dari pelataran Bait Allah[a], termasuk domba dan sapi[b][c]. Ia menumpahkan uang logam para penukar uang dan membalikkan meja-meja itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang suci bagian dalam.
    reason: cultural_note
  - marker: b
    text: Atau “domba dan lembu.”
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani mengatakan “semuanya,” kemudian menyebut domba dan sapi; teks itu tidak secara eksplisit menyatakan bahwa cambuk tersebut digunakan terhadap manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: setelah membuat
  rationale: Partisip aoris ini secara alami menyatakan tindakan yang mendahului kata kerja utama; pilihan ini memperjelas urutan tanpa mengubah hubungan sintaksisnya.
- source_word: φραγέλλιον
  choice: cambuk
  rationale: Istilah ini menunjuk pada alat seperti cambuk; “cambuk” merupakan padanan Indonesia modern yang jelas dan wajar.
- source_word: ἐκ σχοινίων
  choice: dari tali-tali
  rationale: Frasa ini menyatakan bahan pembuat cambuk. Bentuk jamak dipertahankan tanpa menambahkan jenis bahan yang tidak dinyatakan teks.
- source_word: πάντας
  choice: mereka semua
  rationale: Bentuk maskulin akusatif jamak ini memiliki cakupan yang dapat diperdebatkan dalam hubungan dengan penyebutan domba dan sapi sesudahnya. Padanan ini mempertahankan keluasan ungkapan Yunani tanpa menentukan bahwa cambuk digunakan terhadap manusia.
- source_word: ἐξέβαλεν
  choice: mengusir ... dari
  rationale: Dalam konteks ini ἐκβάλλω menyatakan pengeluaran secara tegas atau paksa; “mengusir” alami dalam bahasa Indonesia dan sesuai dengan adegan tersebut.
- source_word: τοῦ ἱεροῦ
  choice: pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau kawasan Bait Allah, bukan secara khusus ruang suci bagian dalam (ναός). “Pelataran Bait Allah” menyampaikan lokasi adegan secara mudah dipahami.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: termasuk domba dan sapi
  rationale: Konstruksi ini menyebut domba dan ternak besar dalam lingkup pengusiran. “Sapi” lebih umum dan mudah dipahami dalam bahasa Indonesia modern daripada “lembu,” sambil tetap sesuai dengan βοῦς.
- source_word: κολλυβιστῶν
  choice: para penukar uang
  rationale: Padanan ini merupakan istilah Indonesia yang jelas bagi orang-orang yang menukarkan mata uang di kawasan Bait Allah.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: menumpahkan uang logam
  rationale: ἐκχέω secara harfiah menggambarkan tindakan menuangkan atau menumpahkan, sedangkan κέρματα adalah uang berbentuk koin. Pilihan ini mempertahankan gambaran konkret teks.
- source_word: ἀνέστρεψεν
  choice: membalikkan
  rationale: Dalam konteks meja, verba ini berarti membalikkan atau menjungkirbalikkan. “Membalikkan” jelas, alami, dan tidak berlebihan.
theological_decisions:
- issue: Cakupan pengusiran dan penggunaan cambuk
  choice: Terjemahan mempertahankan “mereka semua,” lalu menyebut domba dan sapi sebagai bagian dari yang diusir, tanpa menyatakan bahwa Yesus memakai cambuk terhadap manusia.
  alternative: Menentukan secara eksplisit bahwa semua manusia dan hewan diusir dengan cambuk, atau bahwa hanya hewan yang diusir.
  rationale: Susunan Yunani memakai πάντας lalu menyebut domba dan sapi, tetapi tidak secara eksplisit menerangkan kepada siapa cambuk itu digunakan. Terjemahan tidak menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kapitalisasi “Ia” mengikuti register penghormatan yang lazim dalam teks Alkitab Indonesia. Istilah “pelataran Bait Allah” dipilih untuk membedakan ἱερόν dari ruang suci bagian dalam, sedangkan catatan kaki mempertahankan ambiguitas tentang cakupan tindakan dan penggunaan cambuk.
