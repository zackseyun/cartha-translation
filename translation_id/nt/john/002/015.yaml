  to: Setelah membuat cambuk dari tali-tali, Ia mengusir semuanya dari pelataran Bait Allah[a], termasuk domba dan sapi[b][c]. Ia menumpahkan uang logam para penukar uang dan membalikkan meja-meja itu.
