  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan perintah Yesus untuk mengisi tempayan-tempayan dengan air dan ketaatan mereka. Namun, “sampai penuh hingga ke atas” menduplikasi makna dan kurang tepat sebagai padanan alami bagi ἕως ἄνω, yang menyatakan pengisian hingga batas paling atas/bibir wadah.
  naturalness: Kalimat pertama alami dan berdaftar netral. Klausa terakhir tidak luwes karena “sampai penuh” dan “hingga ke atas” menyatakan kepenuhan yang sama secara bertumpuk. “Sampai ke bibirnya” adalah ungkapan Indonesia yang jelas dan alami untuk pengisian hingga batas atas wadah.
  terminology: “Tempayan-tempayan” sesuai untuk ὑδρίας dalam konteks ini; ayat ini tidak perlu mengulang keterangan bahwa wadah itu terbuat dari batu. “Isilah” tepat untuk imperatif jamak. Tidak ada istilah teologis atau nama yang memerlukan penyesuaian.
