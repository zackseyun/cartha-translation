  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: id
  text: Yesus berkata kepada mereka, “Isilah tempayan-tempayan itu dengan air.” Lalu mereka mengisi tempayan-tempayan itu sampai ke bibirnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai present historis, tetapi bentuk lampau naratif dipahami secara alami dalam bahasa Indonesia melalui konteks; “berkata” menyampaikan tindakan ujaran tanpa kekakuan.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif jamak ini menunjukkan pihak yang menerima perkataan Yesus.
- source_word: Γεμίσατε
  choice: Isilah
  rationale: Imperatif aoris aktif jamak menyatakan perintah langsung kepada beberapa orang; “Isilah” merupakan bentuk perintah yang alami dan jelas.
- source_word: τὰς ὑδρίας
  choice: tempayan-tempayan itu
  rationale: ὑδρία adalah wadah besar untuk air. “Tempayan” sesuai dengan konteks benda pada ayat sebelumnya, sedangkan penunjuk “itu” mewakili artikel Yunani dan merujuk kepada wadah yang sudah disebutkan.
- source_word: ὕδατος
  choice: dengan air
  rationale: Genitif sesudah γεμίζω menyatakan isi yang dimasukkan; idiom Indonesia yang alami adalah “mengisi ... dengan air”.
- source_word: ἐγέμισαν αὐτάς
  choice: mereka mengisinya
  rationale: Aoris indikatif menuturkan pelaksanaan perintah tersebut sebagai tindakan selesai. Akhiran “-nya” secara alami merujuk kembali kepada tempayan-tempayan.
- source_word: ἕως ἄνω
  choice: sampai penuh hingga ke atas
  rationale: Ungkapan ini secara harfiah menunjuk sampai ke bagian atas dan menegaskan bahwa wadah-wadah itu diisi sepenuhnya. Rumusan ini mempertahankan unsur “ke atas” sambil tetap jelas bagi pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “tempayan” dipilih untuk wadah air besar dalam konteks perjamuan, tanpa menambahkan bahan pembuatannya yang tidak disebut ulang dalam ayat ini. Tidak digunakan catatan kaki karena teks Yunani tidak menghadirkan varian atau ambiguitas yang perlu dijelaskan pada ayat ini.
