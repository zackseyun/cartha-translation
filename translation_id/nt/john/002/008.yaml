  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan urutan dan isi Yunani: kata penghubung naratif, ujaran Yesus, dua imperatif jamak (menimba dan membawa), keterangan waktu “sekarang,” penerima tindakan, dan respons para pelayan. Objek yang tersirat pada “timbalah” dan “membawanya” jelas dari konteks langsung dan wajar dalam bahasa Indonesia.'
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif. “Timbalah” dan “bawalah” adalah imperatif yang alami dalam konteks mengambil cairan dari tempayan. “Mereka pun membawanya” menyampaikan fungsi penghubung δέ dengan baik tanpa memberi kontras yang berlebihan.
