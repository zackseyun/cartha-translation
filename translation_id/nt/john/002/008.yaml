  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Sekarang timbalah, lalu bawalah kepada pemimpin perjamuan[a].” Mereka pun membawanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepala pelayan” atau “pengatur perjamuan.” Istilah Yunani ini menunjuk kepada orang yang bertanggung jawab atas penyelenggaraan perjamuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini Yunani berfungsi sebagai kala kini historis dalam narasi; bentuk lampau dipahami secara alami dalam konteks bahasa Indonesia tanpa perlu penanda waktu tambahan.
- source_word: Ἀντλήσατε
  choice: timbalah
  rationale: Kata kerja ini menunjuk pada tindakan mengambil atau menimba cairan; konteks tempayan air membuat “timbalah” alami dan tepat.
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan keterangan waktu dan kesegeraan perintah.
- source_word: φέρετε
  choice: bawalah
  rationale: Menyatakan pemindahan cairan yang telah ditimba kepada orang yang dituju, dengan bentuk imperatif yang alami.
- source_word: ἀρχιτρικλίνῳ
  choice: pemimpin perjamuan
  rationale: Istilah ini menunjuk kepada orang yang bertanggung jawab mengatur atau mengawasi perjamuan; pilihan ini jelas, bermartabat, dan tidak terlalu teknis.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Mereka pun membawanya
  rationale: δέ bersifat penghubung ringan, sedangkan ἤνεγκαν menyatakan bahwa mereka melaksanakan perintah membawa apa yang ditimba. “-nya” memasok objek yang tersirat dan jelas dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Imperatif “timbalah” dan “bawalah” mempertahankan ketegasan perintah tanpa terdengar kasar.
