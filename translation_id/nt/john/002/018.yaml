  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi menjawab dan berkata kepada-Nya[a], “Tanda apa yang Engkau tunjukkan kepada kami karena Engkau melakukan hal-hal ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi” atau “orang-orang Yudea.” Dalam Injil Yohanes, “orang-orang Yahudi” kadang-kadang dapat merujuk secara lebih sempit kepada suatu kelompok perwakilan, khususnya para penguasa di Yudea, bergantung pada konteksnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: Karena itu, ... menjawab
  rationale: οὖν menghubungkan tanggapan ini dengan tindakan Yesus sebelumnya dan bernuansa konsekuensial; ἀπεκρίθησαν adalah bentuk naratif baku untuk suatu jawaban.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan eksplisit dalam teks Yunani tanpa mempersempitnya dalam teks utama menjadi para pemimpin atau orang Yudea.
- source_word: καὶ εἶπαν αὐτῷ
  choice: dan berkata kepada-Nya
  rationale: Mencerminkan konstruksi koordinatif Yunani secara wajar dan menjaga gaya naratif yang khidmat.
- source_word: Τί σημεῖον
  choice: Tanda apa
  rationale: ‘Tanda’ mempertahankan istilah penting σημεῖον dalam Injil Yohanes, yang menunjuk kepada tindakan yang mengesahkan sekaligus memiliki makna lebih jauh.
- source_word: δεικνύεις ἡμῖν
  choice: yang Engkau tunjukkan kepada kami
  rationale: Menyampaikan permintaan akan tanda yang dapat diperlihatkan sebagai pengesahan; bentuk relatif ini alami dalam pertanyaan bahasa Indonesia.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: sehingga Engkau melakukan hal-hal ini
  rationale: ὅτι menghubungkan tuntutan akan tanda dengan dasar atau kewenangan untuk melakukan tindakan tersebut. ‘Sehingga’ mempertahankan hubungan itu tanpa menjadikannya ungkapan temporal; ‘hal-hal ini’ mempertahankan bentuk jamak ταῦτα.
theological_decisions:
- issue: Cakupan sebutan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Ayat ini tidak secara eksplisit membatasi kelompok tersebut. Terjemahan utama mempertahankan bentuk sumber, sedangkan catatan menjelaskan bahwa dalam konteks Yohanes sebutan itu dapat merujuk secara lebih sempit dan tidak harus berarti seluruh orang Yahudi.
- issue: Fungsi tanda yang diminta
  choice: Tanda apa yang Engkau tunjukkan
  alternative: Mukjizat apa; bukti apa
  rationale: ‘Tanda’ mempertahankan istilah teologis-naratif Yohanes dan tidak mereduksinya hanya menjadi mukjizat atau bukti.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Sapaan kepada Yesus memakai kapital hormat sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur ‘menjawab dan berkata’ dipertahankan karena wajar dalam register Alkitab yang khidmat dan mencerminkan koordinasi teks Yunani.
