  naturalness: Bahasa Indonesia umumnya baku dan jelas. “Maka” memberi penghubung wacana yang lebih langsung daripada “Karena itu” dalam dialog ini. “Membangkitkannya” terdengar ganjil bila dipahami hanya sebagai bait, tetapi keganjilan itu mempertahankan ketegangan yang disengaja dalam teks Yohanes; catatan kaki menjelaskan pemahaman konstruksi yang mungkin dimaksud para penutur.
  terminology: “orang-orang Yahudi” setia pada οἱ Ἰουδαῖοι dan catatan alternatif “orang-orang Yudea” memadai tanpa membatasi rujukan menjadi pemimpin. “Bait” cocok untuk ναός dalam konteks ini. Verba “membangkitkan” paling baik mempertahankan gema kebangkitan dari ἐγείρω; alternatif “mendirikan kembali” dapat dicatat sebagai pemahaman dalam arti konstruksi, bukan dijadikan teks utama.
