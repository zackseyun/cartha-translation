source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: id
  text: Maka orang-orang Yahudi berkata[a], “Bait ini dibangun selama empat puluh enam tahun, dan engkau akan membangkitkannya dalam tiga hari[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea.” Ungkapan Yunani secara harfiah berbunyi “orang-orang Yahudi,” yang digunakan Yohanes dengan cakupan berbeda-beda menurut konteks.
    reason: alternative_reading
  - marker: b
    text: Atau “mendirikannya kembali.” Kata Yunani ini dapat dipahami oleh para penutur dalam arti mendirikan kembali sebuah bangunan, tetapi Yohanes kemudian menghubungkannya dengan kebangkitan Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan konsekuensial dengan perkataan Yesus sebelumnya dan tetap wajar dalam bahasa Indonesia modern.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan Yunani tanpa mempersempitnya menjadi para pemimpin; cakupannya yang kontekstual dijelaskan dalam catatan kaki.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: selama empat puluh enam tahun
  rationale: Datif waktu menunjukkan rentang berlangsungnya pembangunan; bentuk ini paling alami dan jelas dalam bahasa Indonesia.
- source_word: οἰκοδομήθη
  choice: dibangun
  rationale: Mencerminkan aoristus pasif sebagai pernyataan ringkas mengenai pembangunan bait.
- source_word: ὁ ναὸς οὗτος
  choice: Bait ini
  rationale: ναός menunjuk pada bait atau tempat kudus; 'Bait' adalah istilah Alkitabiah Indonesia yang ringkas dan dapat dipahami dalam konteks Yerusalem.
- source_word: καὶ σὺ
  choice: lalu engkau akan
  rationale: Kata ganti σὺ bersifat tegas; 'engkau' mempertahankan penekanan kepada lawan bicara, sedangkan 'lalu' mengalirkan pertanyaan bernada tidak percaya.
- source_word: ἐν τρισὶν ἡμέραις
  choice: dalam tiga hari
  rationale: Ungkapan temporal yang langsung dan mempertahankan kaitannya dengan penjelasan mengenai kebangkitan pada ayat berikutnya.
- source_word: ἐγερεῖς
  choice: mendirikannya kembali
  rationale: Dalam konteks salah paham para penutur, frasa ini dapat merujuk pada mendirikan kembali bangunan, tetapi tetap memakai verba 'mendirikan' yang dapat menjembatani gagasan 'membangkitkan'; catatan kaki menjaga alternatif yang lebih harfiah.
- source_word: αὐτόν
  choice: -nya
  rationale: Merujuk kembali kepada bait dan secara alami dilekatkan pada verba dalam bahasa Indonesia.
theological_decisions:
- issue: Kemungkinan salah pengertian anti-Yahudi atas οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: Memakai 'orang-orang Yahudi' dalam teks utama dengan catatan kontekstual
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Terjemahan mempertahankan sebutan sumber dan tidak memasukkan pembatasan yang tidak dinyatakan ayat ini, sambil mengingatkan bahwa pemakaiannya dalam Yohanes berbeda-beda menurut konteks.
- issue: Hubungan ἐγερεῖς dengan gambaran kebangkitan
  choice: Menerjemahkan 'mendirikannya kembali' dan mencatat alternatif 'membangkitkannya'
  alternative: membangkitkannya
  rationale: Pilihan utama terdengar alami sebagai ucapan orang yang sedang memikirkan bangunan, sementara catatan mempertahankan permainan makna yang kemudian dihubungkan Yohanes dengan tubuh dan kebangkitan Yesus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Engkau' dipakai untuk mempertahankan penekanan pada σὺ dan register naratif Kitab Suci; pertanyaan mempertahankan nada tidak percaya para penutur.
