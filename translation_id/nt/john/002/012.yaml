  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: id
  text: Sesudah itu, Ia turun ke Kapernaum bersama ibu-Nya, saudara-saudara-Nya[a], dan murid-murid-Nya. Mereka tinggal di sana hanya beberapa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum kerabat-Nya.” Kata Yunani ini dapat berarti saudara laki-laki dalam arti sempit atau, dalam konteks tertentu, kerabat yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Sesudah itu
  rationale: Ungkapan transisi waktu yang alami dalam bahasa Indonesia dan tetap mempertahankan bentuk demonstratif tunggal.
- source_word: κατέβη
  choice: pergi turun
  rationale: Mempertahankan unsur gerak dan arah topografis dari Kana menuju Kapernaum; bentuk ini lebih jelas daripada sekadar 'pergi' dan lebih alami daripada 'turunlah' dalam konteks ini.
- source_word: εἰς Καφαρναοὺμ
  choice: ke Kapernaum
  rationale: Preposisi tujuan menuju sebuah kota secara idiomatis diterjemahkan dengan 'ke'; nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: αὐτὸς καὶ ἡ μήτηρ αὐτοῦ
  choice: Ia ... bersama ibu-Nya
  rationale: Susunan dengan 'bersama' menyampaikan bahwa Yesus dan ibu-Nya termasuk dalam rombongan tanpa menghasilkan rangkaian yang kaku dalam bahasa Indonesia. Nama Maria tidak ditambahkan karena tidak terdapat dalam ayat.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara-Nya
  rationale: Kata Indonesia 'saudara-saudara' merupakan padanan alami bagi bentuk jamak maskulin Yunani dan, seperti sumbernya, dapat menunjuk saudara laki-laki dalam arti sempit atau hubungan kerabat yang lebih luas menurut konteks. Catatan kaki mempertahankan ambiguitas tersebut.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: '''Murid'' adalah istilah Injil yang mapan dan mempertahankan gagasan orang yang belajar sekaligus mengikuti seorang guru.'
- source_word: ἐκεῖ ἔμειναν
  choice: Mereka tinggal di sana
  rationale: Kata kerja jamak menunjukkan seluruh rombongan sebagai subjek. Kalimat terpisah menghasilkan bahasa Indonesia yang alami dan jelas.
- source_word: οὐ πολλὰς ἡμέρας
  choice: tidak banyak hari
  rationale: Mempertahankan ungkapan negatif sumber secara dekat, tanpa mengubahnya menjadi parafrasa 'hanya beberapa hari'.
theological_decisions:
- issue: Hubungan yang dimaksud oleh ἀδελφοί dengan keluarga Yesus
  choice: saudara-saudara-Nya
  alternative: saudara-saudara laki-laki-Nya; kerabat-kerabat-Nya
  rationale: Teks utama memakai padanan yang paling langsung sekaligus cukup terbuka dalam bahasa Indonesia. Catatan kaki menyatakan kemungkinan hubungan keluarga yang lebih luas, sehingga terjemahan tidak memutuskan perdebatan teologis mengenai keluarga Maria.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Struktur kalimat dibuat alami tanpa menghilangkan arah topografis, susunan rombongan, atau ungkapan waktu yang dekat dengan teks Yunani.
