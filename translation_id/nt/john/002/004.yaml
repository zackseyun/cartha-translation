  source_fidelity: Sapaan γύναι secara leksikal adalah “Perempuan,” bukan “Ibu.” Walaupun Yesus berbicara kepada ibu-Nya dan “Ibu” dapat terdengar lebih wajar dalam bahasa Indonesia, pilihan itu memasukkan hubungan kekeluargaan ke dalam bentuk sapaan yang sengaja berbeda dalam teks Yunani. Ungkapan Τί ἐμοὶ καὶ σοί dipertahankan sebagai idiom yang menandai jarak atau perbedaan ranah tanpa menetapkan bahwa nadanya bermusuhan. “Saat-Ku belum tiba” dengan tepat menerjemahkan οὔπω ἥκει ἡ ὥρα μου dan mempertahankan gema Yohanes tentang ‘saat.’
