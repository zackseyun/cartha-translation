base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Apa urusan-Ku denganmu,[a] Perempuan?[b] Saat-Ku belum tiba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Apa bagi-Ku dan bagimu?” Ungkapan ini menyatakan jarak kepentingan atau perbedaan ranah, tidak selalu permusuhan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perempuan.” Dalam konteks budaya waktu itu, ini dapat menjadi sapaan yang wajar dan hormat, meskipun sebagai sapaan langsung dapat terdengar kasar dalam bahasa Indonesia modern.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan dengan bentuk naratif Indonesia yang alami tanpa mengubah fungsi wacananya.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Apa urusan hal itu dengan-Ku dan denganmu
  rationale: Ungkapan idiomatis ini menyatakan jarak kepentingan atau perbedaan ranah tanggung jawab. Terjemahan ini tetap dekat dengan susunan Yunani, tetapi dapat dipahami dalam bahasa Indonesia modern dan tidak melebih-lebihkan nadanya menjadi permusuhan.
- source_word: γύναι
  choice: Ibu
  rationale: Secara harfiah berarti 'perempuan', tetapi sebagai sapaan kepada perempuan dewasa kata ini dapat bersifat hormat. 'Ibu' menyampaikan fungsi sapaan yang wajar dalam bahasa Indonesia tanpa menambahkan kemesraan yang tidak dinyatakan teks; catatan kaki menjelaskan bentuk dan nadanya.
- source_word: οὔπω
  choice: belum
  rationale: Kata ini menunjukkan bahwa waktu yang dimaksud belum tiba sampai saat itu.
- source_word: ἥκει
  choice: tiba
  rationale: Kata kerja ini menyatakan kedatangan atau hadirnya sesuatu; 'tiba' merupakan pasangan yang alami dengan 'saat' dalam bahasa Indonesia.
- source_word: ἡ ὥρα μου
  choice: Saat-Ku
  rationale: '''Saat'' mempertahankan gagasan tentang waktu tertentu yang telah ditetapkan dan tetap memungkinkan gema tematisnya dalam Injil Yohanes, tanpa mempersempitnya hanya pada kejadian langsung ini.'
theological_decisions:
- issue: Nada dan daya sapaan Yesus kepada ibu-Nya
  choice: Tanggapan yang hormat tetapi mengambil jarak, bukan penghinaan
  alternative: Teguran keras; atau sapaan yang sangat mesra
  rationale: Idiom Τί ἐμοὶ καὶ σοί menandai jarak kepentingan atau perbedaan ranah, sedangkan γύναι dapat menjadi sapaan yang wajar dan hormat. Terjemahan mempertahankan ketegangan itu tanpa membuat ucapan Yesus terdengar kasar ataupun sentimental.
- issue: Makna 'saat-Ku' dalam teologi Yohanes
  choice: Saat yang ditetapkan bagi Yesus, dengan kemungkinan gema yang lebih luas dalam misi dan pemuliaan-Nya
  alternative: Hanya waktu untuk melakukan tanda ini; atau sekadar pernyataan umum tentang waktu
  rationale: Dalam Injil Yohanes, 'saat' memiliki bobot tematis. Terjemahan tidak menjabarkan maknanya di dalam teks, sehingga pembaca tetap dapat menangkap baik konteks langsung maupun gema yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ibu' dipakai sebagai padanan fungsional untuk sapaan γύναι, sedangkan catatan kaki mempertahankan informasi bentuk harfiahnya. Ungkapan utama sengaja tidak dilunakkan menjadi sapaan mesra dan tidak diperkeras menjadi penolakan bermusuhan.
