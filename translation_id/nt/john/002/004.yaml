  terminology: “Perempuan” mempertahankan bentuk sapaan γύναι; catatan kaki menjelaskan bahwa sapaan tersebut dapat wajar dan hormat dalam konteks kuno, tanpa mengubah teks utama menjadi sapaan yang lebih hangat. “Saat-Ku” sebaiknya dipertahankan untuk ἡ ὥρα μου, agar tidak menghilangkan keterkaitan istilah dalam Injil Yohanes.
