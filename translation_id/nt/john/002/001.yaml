  naturalness: Kalimatnya umumnya baku dan mudah dipahami. “Ada sebuah pernikahan” merupakan pengantar peristiwa yang lebih sederhana dan alami daripada inversi “berlangsunglah sebuah pernikahan,” tanpa mengubah makna.
  terminology: “Pernikahan” adalah padanan luas yang tepat untuk γάμος; catatan kaki dengan tepat menjaga kemungkinan makna “pesta pernikahan.” “Ibu Yesus” alami dan setia pada ἡ μήτηρ τοῦ Ἰησοῦ.
