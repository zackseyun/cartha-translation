id: JHN.2.1
reference: John 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: id
  text: Pada hari ketiga, ada sebuah pernikahan[a] di Kana di Galilea, dan ibu Yesus ada di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesta pernikahan”. Kata Yunani yang digunakan dapat menunjuk pada pernikahan maupun perayaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Pada
  rationale: Penghubung Yunani Καί tidak diterjemahkan secara tersendiri karena pembukaan dengan keterangan waktu lebih alami dalam bahasa Indonesia dan tetap menjaga kesinambungan narasi.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: Pada hari ketiga
  rationale: Menerjemahkan datif waktu secara langsung dan mempertahankan penanda kronologis tanpa menambahkan penafsiran simbolis.
- source_word: γάμος
  choice: sebuah pernikahan
  rationale: Istilah γάμος dapat menunjuk pada pernikahan maupun perayaannya; 'pernikahan' alami, luas, dan tidak mempersempit makna.
- source_word: ἐγένετο
  choice: berlangsunglah
  rationale: Dalam konteks suatu acara, bentuk ini secara alami menyatakan bahwa pernikahan itu berlangsung, sekaligus mencerminkan fungsi γίνομαι sebagai pengantar peristiwa.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: di Kana, Galilea
  rationale: Bentuk aposisional ini alami dalam bahasa Indonesia dan mengidentifikasi Kana sebagai tempat di wilayah Galilea.
- source_word: ἦν
  choice: ada
  rationale: Mempertahankan ungkapan keberadaan yang sederhana dan tidak memperluasnya menjadi 'hadir'.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: ibu Yesus
  rationale: Ungkapan genitif ini diterjemahkan secara alami dan tetap dekat dengan susunan makna sumber.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan lokatif langsung yang mempertahankan nada naratif sederhana.
theological_decisions:
- issue: Penanda waktu 'hari ketiga'
  choice: Dipertahankan sebagai keterangan waktu tanpa penjelasan simbolis dalam teks utama.
  alternative: Mengeksplisitkan hubungan simbolis dengan kebangkitan.
  rationale: Frasa tersebut secara langsung berfungsi sebagai penanda kronologis. Kemungkinan gema teologis tetap terbuka bagi pembaca dan tidak disisipkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; partikel '-lah' memberi alur naratif tanpa menambah muatan teologis. Penanda catatan kaki [a] ditempatkan tepat setelah istilah yang dijelaskan.
