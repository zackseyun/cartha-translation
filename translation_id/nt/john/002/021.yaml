  text: But he was speaking about the temple of his body[a].
translation:
  language: id
  text: Namun, Ia berbicara tentang bait suci tubuh-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat suci tubuh-Nya”; kata Yunani naos sering kali menunjuk secara lebih khusus pada bagian dalam Bait Allah, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ia
  rationale: Dalam konteks, kata tunjuk ini merujuk kembali kepada Yesus. Kata ganti “Ia” alami dalam bahasa Indonesia dan tetap menandai bahwa rujukannya adalah Yesus.
- source_word: δὲ
  choice: Namun
  rationale: Partikel δέ menandai pertentangan ringan dengan kesalahpahaman pada ayat sebelumnya; “Namun” menyatakan hubungan itu secara wajar.
- source_word: ἔλεγεν
  choice: yang Ia maksudkan
  rationale: Secara harfiah berarti “Ia sedang berkata/berbicara,” tetapi dalam komentar penjelas ini ungkapan idiomatis Indonesia “yang Ia maksudkan” menyampaikan bahwa perkataan sebelumnya merujuk pada sesuatu, tanpa menambahkan isi tafsiran di luar teks.
- source_word: περὶ
  choice: adalah ...
  rationale: περί dengan genitif berarti “tentang/mengenai.” Dalam konstruksi idiomatis “yang Ia maksudkan adalah,” relasi rujukan tersebut dinyatakan secara alami dalam bahasa Indonesia.
- source_word: τοῦ ναοῦ
  choice: bait suci
  rationale: ναός secara lebih khusus menunjuk ruang suci atau bangunan inti Bait Allah, bukan seluruh kompleksnya. “Bait suci” mempertahankan nuansa sakral dan metafora teks; cakupan leksikalnya dijelaskan dalam catatan kaki.
- source_word: τοῦ σώματος αὐτοῦ
  choice: tubuh-Nya
  rationale: Frasa genitif ini mengidentifikasi tubuh itu sebagai tubuh Yesus sendiri. Bentuk “-Nya” mengikuti kaidah bahasa Indonesia untuk rujukan hormat kepada Yesus.
theological_decisions:
- issue: Identifikasi metaforis tubuh Yesus dengan bait suci
  choice: Mempertahankan frasa “bait suci tubuh-Nya” secara langsung.
  alternative: “tubuh-Nya sebagai bait suci” atau “tempat suci tubuh-Nya”
  rationale: Susunan langsung mempertahankan metafora dan ketegangan teologis teks tanpa menjabarkannya menjadi tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” memperjelas kontras; “yang Ia maksudkan” merupakan ungkapan penjelas yang alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
