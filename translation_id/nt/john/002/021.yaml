review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat merujuk kepada Yesus, mempertahankan kontras δέ, serta mempertahankan metafora ναός dan tubuh-Nya. Namun, “yang Ia maksudkan adalah” menggeser ἔλεγεν περὶ (“Ia berbicara tentang”) menjadi penjelasan makna yang lebih interpretatif. Perumusan langsung lebih setia pada verba dan preposisi Yunani, sambil tetap wajar dalam bahasa Indonesia.
  naturalness: “Namun, Ia berbicara tentang bait suci tubuh-Nya” adalah bahasa Indonesia baku, jelas, dan sesuai dengan gaya komentar naratif Yohanes. Aspek imperfek ἔλεγεν tidak perlu dipaksakan dengan “sedang” dalam bahasa Indonesia, yang dapat terdengar kurang alami dalam narasi lampau.
  terminology: “Bait suci” merupakan padanan yang baik untuk ναός dalam metafora ini. Catatan kaki dengan tepat membedakannya dari seluruh kompleks Bait Allah. Kata “sering kali” lebih selaras dengan nuansa “often” daripada “biasanya,” yang dapat terdengar terlalu mutlak.
  issues:
  - severity: medium
    issue: “yang Ia maksudkan adalah” menggantikan tindakan berbicara dengan pernyataan tentang maksud.
    rationale: ἔλεγεν περὶ secara langsung berarti “Ia berbicara tentang,” bukan “yang Ia maksudkan adalah.” Meski maknanya berkaitan dalam konteks, draf menambahkan tingkat interpretasi yang tidak diperlukan.
  - severity: low
    issue: Catatan kaki memakai “biasanya” untuk nuansa leksikal ναός.
    rationale: Sumber audit menyatakan ναός “often” menunjuk lebih khusus kepada bagian dalam atau inti Bait Allah. “Sering kali” menyampaikan generalisasi ini dengan lebih tepat.
  revised_text: Namun, Ia berbicara tentang bait suci tubuh-Nya[a].
  revised_footnotes:
