id: JHN.5.16
reference: John 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: id
  text: Karena hal itu, orang-orang Yahudi[a] terus menganiaya Yesus, sebab Ia melakukan hal-hal itu pada hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea”; atau, sesuai konteks, “para pemimpin Yahudi.” Dalam Injil Yohanes, istilah ini sering menunjuk kepada kelompok tertentu yang menentang Yesus, bukan kepada setiap orang Yahudi tanpa kecuali.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena hal itu
  rationale: Frasa ini menunjuk kembali kepada peristiwa sebelumnya sebagai penyebab penganiayaan; bentuk ini mempertahankan hubungan sebab-akibat secara jelas.
- source_word: ἐδίωκον
  choice: terus menganiaya
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang. Kata 'menganiaya' menyampaikan permusuhan tanpa mendahului ayat 18 dengan memasukkan niat membunuh.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ini merupakan padanan langsung bagi sebutan jamak etnoreligius dalam bahasa Yunani. Catatan kaki mempertahankan kemungkinan bahwa dalam konteks Yohanes yang dimaksud adalah kelompok tertentu, khususnya para pemimpin, bukan semua orang Yahudi.
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Padanan ini mempertahankan bentuk jamak demonstratif dan menunjuk kepada tindakan-tindakan yang baru saja diceritakan.
- source_word: ἐποίει
  choice: Ia melakukan
  rationale: Bentuk imperfek menampilkan tindakan yang sedang atau berulang kali dilakukan. Dalam bahasa Indonesia, aspek tersebut cukup tersirat melalui konteks dan ungkapan 'hal-hal itu', tanpa konstruksi progresif yang kaku.
- source_word: ἐν σαββάτῳ
  choice: pada hari Sabat
  rationale: Ungkapan ini merupakan cara alami dalam bahasa Indonesia untuk menyatakan waktu terjadinya tindakan pada hari Sabat.
theological_decisions:
- issue: Rujukan dan penerjemahan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks utama mempertahankan padanan leksikal yang langsung dan tidak mempersempit rujukannya secara interpretatif. Catatan kaki menjelaskan bahwa dalam konteks Injil Yohanes istilah ini sering menunjuk kepada kelompok penentang tertentu, sehingga tidak boleh digeneralisasi kepada semua orang Yahudi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Terus menganiaya' dipakai untuk menyampaikan aspek imperfek secara alami; kata ganti 'Ia' mengikuti kebiasaan penulisan Alkitab bahasa Indonesia.
