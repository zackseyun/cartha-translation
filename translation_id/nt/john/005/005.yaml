  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: id
  text: Di situ ada seorang laki-laki yang sudah menderita sakit selama tiga puluh delapan tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengalami kelemahan” atau “menderita penyakit.” Kata Yunani ἀσθένεια dapat merujuk secara luas pada kelemahan jasmani atau keadaan sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: ada
  rationale: δέ merupakan penghubung ringan yang melanjutkan narasi, bukan pertentangan kuat. Dalam bahasa Indonesia, alur ini wajar disampaikan tanpa kata penghubung tersendiri.
- source_word: τις ἄνθρωπος
  choice: seorang
  rationale: Frasa ini memperkenalkan seorang individu yang belum ditentukan identitasnya. “Seorang” alami dan tidak menambahkan nuansa arkais.
- source_word: ἐκεῖ
  choice: di situ
  rationale: Adverbia ini menunjuk lokasi dalam adegan yang baru disebutkan; “di situ” merupakan padanan kontekstual yang langsung.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: tiga puluh delapan tahun
  rationale: Ini adalah bentuk bilangan baku dalam bahasa Indonesia.
- source_word: ἔχων
  choice: sudah menderita ... selama
  rationale: Partisipel kini bersama keterangan rentang waktu menggambarkan keadaan yang terus berlangsung sampai saat itu. Susunan ini menyampaikan aspek duratif secara alami dalam bahasa Indonesia.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: menderita sakit
  rationale: ἀσθένεια dapat berarti kelemahan, penyakit, atau keadaan sakit. Dalam konteks ini, “menderita sakit” alami tanpa menentukan jenis penyakitnya.
