  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: id
  text: Sebab Bapa tidak menghakimi siapa pun, tetapi telah memberikan seluruh penghakiman kepada Anak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan penjelasan atas pernyataan sebelumnya. Dalam bahasa Indonesia, “Sebab” menyampaikan hubungan penjelas itu secara alami; daya negatif οὐδέ tercakup dalam “tidak ... siapa pun”.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Dalam konteks Yohanes, kata ini merupakan gelar bagi Allah dalam hubungan-Nya dengan Anak; huruf kapital mempertahankan fungsi gelar tersebut.
- source_word: κρίνει
  choice: menghakimi
  rationale: Bentuk kini menyatakan kenyataan umum. “Menghakimi” mempertahankan hubungan leksikal dengan κρίσιν dan tidak mempersempit maknanya menjadi sekadar menghukum.
- source_word: οὐδένα
  choice: tidak ... siapa pun
  rationale: Bentuk ini merupakan ungkapan negatif yang alami dalam bahasa Indonesia dan menyampaikan cakupan menyeluruh dari οὐδένα.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Menandai pertentangan tegas antara Bapa yang tidak menghakimi siapa pun dan pemberian seluruh penghakiman kepada Anak.
- source_word: τὴν κρίσιν πᾶσαν
  choice: seluruh penghakiman
  rationale: Pilihan ini mempertahankan bentuk nomina κρίσις serta cakupan penuh πᾶσαν tanpa menambahkan gagasan “wewenang” yang tidak dinyatakan secara eksplisit.
- source_word: δέδωκεν
  choice: telah memberikan
  rationale: “Telah memberikan” mencerminkan tindakan yang sudah terlaksana dengan hasil yang tetap berlaku, sesuai aspek perfektum Yunani, tanpa menambahkan nuansa “memercayakan”.
- source_word: τῷ υἱῷ
  choice: kepada Anak
  rationale: Teks Yunani memakai artikel dan tidak menyatakan kata ganti kepunyaan. “Anak” dipertahankan sebagai gelar kristologis.
theological_decisions:
- issue: Hubungan antara penghakiman Bapa dan penghakiman Anak
  choice: 'Pernyataan diterjemahkan secara langsung: Bapa tidak menghakimi siapa pun, tetapi telah memberikan seluruh penghakiman kepada Anak.'
  alternative: Menambahkan bahwa Bapa tidak menghakimi secara terpisah dari Anak, atau membatasi penghakiman ini hanya pada penghakiman terakhir.
  rationale: Teks tidak memuat pembatas atau penjelasan penyelaras tersebut. Terjemahan mempertahankan ketegangan teologis sebagaimana dinyatakan sumber.
- issue: Gelar kristologis “Anak”
  choice: Mempertahankan “Anak” sebagai gelar.
  alternative: Menerjemahkannya sebagai “anak-Nya”.
  rationale: Bahasa Yunani tidak mencantumkan kata ganti kepunyaan, dan dalam konteks ini “Anak” berfungsi sebagai gelar penting dalam hubungan Bapa-Anak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum sambil mempertahankan pengulangan konseptual antara “menghakimi” dan “penghakiman” serta pernyataan teologis teks tanpa pelunakan.
