id: JHN.5.14
reference: John 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: id
  text: Sesudah itu[a], Yesus menemukan orang itu di kompleks Bait Allah dan berkata kepadanya, “Lihat, engkau sudah sembuh.[b] Jangan berbuat dosa lagi, supaya jangan terjadi sesuatu yang lebih buruk kepadamu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Sesudah hal-hal ini” atau “Sesudah semuanya itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “engkau telah menjadi sehat”; bentuk Yunani menekankan keadaan pulih orang itu sebagai hasil dari apa yang telah terjadi.
    reason: lexical_alternative
  - marker: c
    text: Peringatan ini tidak menyatakan secara tegas apakah penyakit sebelumnya disebabkan oleh dosa tertentu, ataupun apakah “sesuatu yang lebih buruk” itu berupa penderitaan dalam hidup sekarang, penghakiman akhir, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini menyampaikan urutan kisah secara alami dalam bahasa Indonesia. Bentuk Yunani secara harfiah bersifat jamak, ‘sesudah hal-hal ini’ atau ‘sesudah semuanya itu’; nuansa tersebut dicatat dalam catatan kaki.
- source_word: εὑρίσκει
  choice: menemukan
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang wajar tanpa mengubah urutan peristiwa.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kawasan atau kompleks Bait Allah, bukan hanya ruang kudus bagian dalam. ‘Kompleks Bait Allah’ mempertahankan pembedaan itu dengan jelas.
- source_word: Ἴδε
  choice: Lihat
  rationale: Mempertahankan fungsi seruan untuk menarik perhatian tanpa memakai ungkapan arkais.
- source_word: ὑγιὴς γέγονας
  choice: engkau sudah sembuh
  rationale: Ungkapan alami ini menyampaikan perubahan yang telah terjadi beserta keadaan pulih yang masih berlangsung. Nuansa harfiahnya dijelaskan dalam catatan kaki.
- source_word: μηκέτι ἁμάρτανε
  choice: Jangan berbuat dosa lagi
  rationale: Menyampaikan perintah untuk berhenti atau tidak melanjutkan perbuatan dosa tanpa memaksakan bahwa bentuk aspek Yunani pasti menunjuk pada kebiasaan yang sedang berlangsung.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: supaya jangan terjadi sesuatu yang lebih buruk kepadamu
  rationale: Mempertahankan kemungkinan akibat yang diperingatkan Yesus, termasuk unsur tak tentu τι (‘sesuatu’), tanpa menentukan apa tepatnya hal yang lebih buruk itu.
theological_decisions:
- issue: Hubungan antara dosa dan penderitaan dalam peringatan Yesus
  choice: Peringatan diterjemahkan secara langsung, tetapi tidak dinyatakan bahwa penyakit sebelumnya pasti disebabkan oleh suatu dosa tertentu atau bahwa akibat yang lebih buruk hanya bersifat jasmani maupun hanya menunjuk pada penghakiman akhir.
  alternative: Menafsirkan penyakit sebelumnya sebagai hukuman langsung atas dosa tertentu, atau menetapkan bahwa ‘sesuatu yang lebih buruk’ semata-mata penderitaan sementara ataupun secara khusus penghukuman akhir.
  rationale: Teks Yunani menghubungkan peringatan untuk tidak berbuat dosa dengan kemungkinan terjadinya sesuatu yang lebih buruk, tetapi tidak menjelaskan hubungan kausal dengan penyakit sebelumnya ataupun sifat akibat yang dimaksud. Terjemahan dan catatan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “engkau” dipakai dalam ujaran langsung Yesus agar tetap akrab dan sesuai dengan ragam Alkitab Indonesia tanpa menjadi arkais. “Kompleks Bait Allah” dipilih untuk membedakan ἱερόν dari ruang kudus bagian dalam.
