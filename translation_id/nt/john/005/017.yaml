  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: id
  text: Tetapi Ia menjawab mereka, “Bapa-Ku bekerja sampai sekarang, dan Aku pun bekerja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan tuduhan dalam konteks sebelumnya dan tetap alami sebagai pengantar jawaban Yesus.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: Ia menjawab mereka
  rationale: Padanan langsung dan wajar bagi verba deponen bentuk lampau dengan objek tak langsung; pronomina mempertahankan bentuk teks sumber.
- source_word: Ὁ πατήρ μου
  choice: Bapa-Ku
  rationale: Mempertahankan hubungan pribadi yang dinyatakan Yesus serta penggunaan “Bapa” sebagai sebutan bagi Allah.
- source_word: ἕως ἄρτι
  choice: sampai sekarang
  rationale: Mengungkapkan keberlangsungan hingga saat Yesus berbicara secara langsung dan idiomatis.
- source_word: ἐργάζεται
  choice: terus bekerja
  rationale: Bahasa Indonesia tidak memiliki bentuk kala kini progresif yang setara; “terus” memperjelas aspek keberlangsungan yang didukung oleh konteks dan frasa ἕως ἄρτι.
- source_word: κἀγὼ
  choice: dan Aku pun
  rationale: “Pun” mempertahankan tekanan aditif yang menempatkan pekerjaan Yesus sejajar dengan pekerjaan Bapa.
- source_word: ἐργάζομαι
  choice: bekerja
  rationale: Pengulangan verba mempertahankan kesejajaran dengan pekerjaan Bapa; keberlangsungannya dipahami melalui struktur paralel dan konteks kalimat.
theological_decisions:
- issue: Hubungan pekerjaan Yesus dengan pekerjaan Bapa pada hari Sabat
  choice: “Bapa-Ku terus bekerja sampai sekarang, dan Aku pun bekerja.”
  alternative: “Bapa-Ku bekerja sampai sekarang, dan Aku bekerja.”
  rationale: Terjemahan mempertahankan kesejajaran yang disengaja antara pekerjaan Bapa dan pekerjaan Yesus tanpa menambahkan penjelasan tentang hari Sabat, hak ilahi, atau kesetaraan yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Ia”, “Bapa-Ku”, dan “Aku” mengikuti kebiasaan penulisan rujukan ilahi dalam teks Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan setelah “mereka” agar tidak mengganggu alur kutipan.
