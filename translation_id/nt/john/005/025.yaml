reference: John 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: id
  text: '“Sesungguhnya[a], sesungguhnya, Aku berkata kepada kalian: Akan tiba suatu saat[b], dan saat itu sekarang sudah ada, ketika orang-orang mati[c] akan mendengar suara Anak Allah, dan mereka yang mendengar[d] akan hidup.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “Amin, amin, Aku berkata kepada kalian.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “saat” dapat juga diterjemahkan “jam”; menurut konteks, kata itu dapat menunjuk pada suatu waktu atau saat yang ditetapkan.
    reason: lexical_alternative
  - marker: c
    text: “Orang-orang mati” dapat mencakup makna rohani pada masa kini (“saat itu sekarang sudah ada”), sekaligus mengantisipasi kebangkitan jasmani dalam konteks sekitarnya.
    reason: cross_reference
  - marker: d
    text: Atau, “mereka yang telah mendengar akan hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang khidmat dan tegas dalam bentuk yang langsung dipahami pembaca Indonesia; bentuk transliterasi “Amin, amin” dicatat sebagai alternatif yang lebih formal.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan irama khas perkataan Yesus. Bahasa Indonesia tidak membedakan tunggal dan jamak pada bentuk “kepadamu”, sedangkan ὑμῖν berbentuk jamak.
- source_word: ἔρχεται ὥρα
  choice: Saatnya akan tiba
  rationale: “Saat” merupakan padanan Indonesia yang alami bagi ὥρα dalam ungkapan ini dan tetap membawa bobot waktu yang ditentukan; bentuk Yunani tidak memakai kata sandang, tetapi terjemahan harfiah “suatu jam akan tiba” tidak alami dan dapat disalahpahami sebagai durasi enam puluh menit.
- source_word: καὶ νῦν ἐστιν
  choice: dan sekarang sudah tiba
  rationale: Mengungkapkan secara alami bahwa saat yang akan datang itu juga telah hadir sekarang, sambil mempertahankan ketegangan antara dimensi kini dan mendatang.
- source_word: οἱ νεκροὶ
  choice: orang-orang mati
  rationale: Padanan langsung yang tidak membatasi maknanya hanya pada kematian jasmani atau hanya pada keadaan rohani.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: akan mendengar suara
  rationale: Dalam konteks pribadi, φωνή berarti “suara”, dan ἀκούω menyatakan tindakan mendengar tanpa menambahkan gagasan ketaatan yang tidak dinyatakan secara eksplisit.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Anak Allah
  rationale: Mempertahankan gelar kristologis lengkap secara langsung dan lazim dalam bahasa Indonesia.
- source_word: οἱ ἀκούσαντες
  choice: mereka yang mendengar
  rationale: Partisip aoris dapat menyatakan tindakan mendengar yang mendahului hasil “akan hidup”. Bentuk kini dalam bahasa Indonesia lebih alami dalam konstruksi umum ini, sedangkan alternatif “telah mendengar” dicatat untuk memperlihatkan bentuk sumber.
- source_word: ζήσουσιν
  choice: akan hidup
  rationale: Menerjemahkan ζάω secara langsung tanpa mempersempitnya menjadi “akan hidup kembali”, yang akan menonjolkan kebangkitan jasmani lebih tegas daripada yang diwajibkan oleh ayat ini.
theological_decisions:
- issue: Rujukan “orang-orang mati” dalam konteks Yohanes 5
  choice: Dibiarkan sebagai “orang-orang mati” tanpa penjelasan interpretatif di dalam teks.
  alternative: “orang-orang yang mati secara rohani” atau “orang-orang yang mati secara jasmani”
  rationale: Ungkapan “sekarang sudah tiba” menunjukkan dimensi masa kini, sedangkan konteks berikutnya juga berbicara tentang kebangkitan jasmani. Terjemahan mempertahankan ketegangan itu.
- issue: Hubungan antara saat yang akan datang dan saat yang telah hadir
  choice: “Saatnya akan tiba dan sekarang sudah tiba”
  alternative: Menghapus salah satu dimensi atau menjelaskan keduanya sebagai dua peristiwa yang terpisah.
  rationale: Teks Yunani dengan sengaja menempatkan masa depan dan masa kini berdampingan; terjemahan tidak menyelaraskan atau memisahkannya secara teologis.
- issue: Gelar kristologis τοῦ υἱοῦ τοῦ θεοῦ
  choice: “Anak Allah”
  alternative: “Anak-Nya” atau parafrasa yang memperluas hubungan ilahi tersebut.
  rationale: Padanan ini mengikuti gelar Yunani secara langsung tanpa menambahkan rumusan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan pembuka serta gelar “Anak Allah” dipertahankan. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika Yesus berbicara, tanpa mengubah isi leksikal teks sumber.
