  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: id
  text: Ia juga memberi-Nya wewenang untuk melaksanakan penghakiman, karena Ia adalah Anak Manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Ia seorang anak manusia,” yaitu karena Ia memiliki kodrat manusia. Teks utama mempertahankan pemakaian yang kemungkinan besar merupakan gelar dalam Injil Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menunjukkan otoritas atau yurisdiksi yang diberikan, bukan sekadar kekuatan.
- source_word: ἔδωκεν
  choice: memberi
  rationale: Menerjemahkan bentuk aoristus δίδωμι secara langsung dan alami; subjeknya adalah Bapa dalam konteks.
- source_word: αὐτῷ
  choice: -Nya
  rationale: Merujuk kepada Sang Anak; bentuk pronominal ini alami dalam bahasa Indonesia dan mempertahankan rujukan hormat.
- source_word: κρίσιν ποιεῖν
  choice: untuk melaksanakan penghakiman
  rationale: Ungkapan ini berarti menjalankan atau melaksanakan keputusan pengadilan; pilihan ini mempertahankan nuansa yudisial lebih jelas daripada sekadar 'menghakimi'.
- source_word: ὅτι
  choice: karena
  rationale: Memperkenalkan alasan bagi pemberian wewenang tersebut.
- source_word: υἱὸς ἀνθρώπου
  choice: Anak Manusia
  rationale: Dalam Injil Yohanes, ungkapan ini kemungkinan besar berfungsi sebagai gelar khas Yesus dan menggema latar Daniel 7, walaupun tanpa artikel dalam bahasa Yunani bentuk generik tetap mungkin.
- source_word: ἐστίν
  choice: adalah
  rationale: Menerjemahkan kopula kini secara langsung.
theological_decisions:
- issue: Apakah υἱὸς ἀνθρώπου merupakan gelar kristologis atau ungkapan generik tentang kemanusiaan
  choice: Diterjemahkan sebagai gelar 'Anak Manusia'.
  alternative: '''seorang anak manusia'', yakni seseorang yang memiliki kodrat manusia'
  rationale: Pemakaian dalam Yohanes dan konteks wewenang penghakiman mendukung gelar yang memiliki gema apokaliptik dan mesianik. Namun, ketiadaan artikel dalam teks Yunani memungkinkan pemahaman generik, sehingga kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai agar rujukan kepada Yesus jelas dan alami; 'wewenang' serta 'melaksanakan penghakiman' mempertahankan corak yudisial teks sumber.
