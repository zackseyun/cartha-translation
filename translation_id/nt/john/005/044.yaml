id: JHN.5.44
reference: John 5:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: id
  text: Bagaimana kalian dapat percaya,[a] sementara kalian menerima kemuliaan[b] dari satu sama lain dan tidak mencari kemuliaan yang berasal dari satu-satunya Allah?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bagaimana mungkin kalian percaya ...?”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “kehormatan” pada kedua kemunculan kata “kemuliaan” (Yunani: δόξα).'
    reason: lexical_alternative
  - marker: c
    text: Atau “Allah yang satu-satunya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε
  choice: Bagaimana kalian dapat
  rationale: Mempertahankan bentuk pertanyaan tentang kemampuan atau kemungkinan. Kata “dapat” menyatakan daya atau kemampuan yang terkandung dalam δύνασθε, tanpa memperkeras pertanyaan menjadi pernyataan ketidakmungkinan mutlak.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Bentuk jamak eksplisit dalam bahasa Yunani ditampilkan secara jelas dengan “kalian”. Penekanan pronominalnya cukup disampaikan oleh konteks pertanyaan retoris tanpa tambahan “kalian sendiri” yang terasa berlebihan.
- source_word: πιστεῦσαι
  choice: percaya
  rationale: Merupakan padanan luas dan lazim bagi πιστεύω dalam konteks Yohanes, serta tidak mempersempit maknanya menjadi persetujuan intelektual atau suatu rumusan doktrinal tertentu.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Dipakai secara konsisten pada kedua kemunculan untuk mempertahankan pengulangan dan kontras antara kemuliaan yang bersumber dari manusia dan yang berasal dari Allah. “Kehormatan” tetap dicatat sebagai alternatif kontekstual.
- source_word: παρ’ ἀλλήλων
  choice: dari satu sama lain
  rationale: Menyatakan sumber manusiawi yang timbal balik sebagaimana ditunjukkan oleh ἀλλήλων.
- source_word: λαμβάνοντες
  choice: menerima
  rationale: Padanan langsung yang mempertahankan gambaran tentang sikap terus-menerus menerima kemuliaan dari sesama, tanpa menambahkan nuansa persetujuan yang lebih kuat.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: dan tidak mencari
  rationale: Mempertahankan koordinasi Yunani dan mengontraskan penerimaan kemuliaan manusia dengan tidak dicarinya kemuliaan ilahi.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: kemuliaan yang berasal dari satu-satunya Allah
  rationale: Klausa relatif menghasilkan bahasa Indonesia yang alami sekaligus mempertahankan sumber kemuliaan dan daya eksklusif μόνος.
theological_decisions:
- issue: Makna πιστεῦσαι dalam konteks Yohanes
  choice: percaya
  alternative: memercayai; menaruh kepercayaan
  rationale: “Percaya” mempertahankan keluasan makna verba Yunani dan kaitannya dengan iman atau kepercayaan tanpa menetapkan secara berlebihan objek atau bentuk kepercayaan yang tidak dinyatakan dalam ayat ini.
- issue: Pengulangan δόξα pada kedua klausa
  choice: kemuliaan pada kedua kemunculan
  alternative: kehormatan pada kedua kemunculan
  rationale: Pemakaian istilah yang sama menjaga paralelisme dan ketegangan teologis antara kemuliaan dari sesama manusia dan kemuliaan dari Allah. Alternatif “kehormatan” menjelaskan nuansa sosial yang mungkin dimaksud tanpa menggantikan istilah utama.
- issue: Daya eksklusif τοῦ μόνου θεοῦ
  choice: satu-satunya Allah
  alternative: Allah yang satu-satunya
  rationale: Terjemahan ini menegaskan keunikan Allah sebagaimana dinyatakan teks, tanpa menambahkan gelar tradisional atau kesimpulan kristologis maupun antikristologis yang tidak dinyatakan di sini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipilih untuk menyatakan bentuk jamak Yunani secara transparan. Susunan “sementara kalian ...” membuat hubungan keadaan dalam partisip Yunani terbaca alami, sedangkan pengulangan “kemuliaan” sengaja dipertahankan.
