  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: id
  text: Namun, Aku tidak menerima kesaksian dari manusia, tetapi Aku mengatakan hal-hal ini supaya kamu diselamatkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: dari manusia
  rationale: παρά dengan bentuk genitif menyatakan sumber. Kata tunggal ἀνθρώπου di sini bersifat umum, sehingga frasa alami bahasa Indonesia “dari manusia” mempertahankan kontras dengan kesaksian yang bukan berasal dari manusia tanpa menjadikannya seorang tertentu.
- source_word: μαρτυρίαν
  choice: kesaksian
  rationale: μαρτυρία menunjuk pada isi kesaksian dan dalam konteks ini memiliki nuansa pembuktian; “kesaksian” juga berpadanan alami dengan verba “menerima”.
- source_word: λαμβάνω
  choice: menerima
  rationale: Bentuk kini λαμβάνω diterjemahkan langsung sebagai “menerima”. Pilihan ini mempertahankan ungkapan Yunani dan tidak mempersempit maknanya menjadi sekadar menyetujui atau mengakui.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Bentuk penunjuk netral jamak dipertahankan dengan “hal-hal ini”, bukan diratakan menjadi bentuk tunggal “ini”.
- source_word: λέγω
  choice: Aku mengatakan
  rationale: Present indikatif diterjemahkan secara wajar sebagai “Aku mengatakan”; bentuk ini dapat mengambil objek langsung “hal-hal ini” dengan alami.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: supaya kamu diselamatkan
  rationale: ἵνα menyatakan tujuan, sedangkan σωθῆτε adalah aoris pasif subjungtif. “Supaya kamu diselamatkan” mempertahankan tujuan dan bentuk pasif tanpa menambahkan pelaku atau model keselamatan tertentu.
- source_word: δὲ ... ἀλλὰ
  choice: Namun ... Sebaliknya
  rationale: 'Pasangan ini menyatakan peralihan dan kontras: Yesus tidak bergantung pada kesaksian manusia, tetapi mengatakan semuanya demi keselamatan para pendengar. “Namun ... Sebaliknya” menyampaikan hubungan itu dengan jelas dalam bahasa Indonesia modern.'
theological_decisions:
- issue: Makna σωθῆτε dalam konteks
  choice: diselamatkan
  alternative: dilepaskan; memperoleh keselamatan
  rationale: Terjemahan “diselamatkan” mempertahankan keluasan makna keselamatan dan bentuk pasif teks, tanpa membatasinya pada pembebasan jasmani ataupun memasukkan rumusan soteriologis denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Aku” mengikuti tuturan langsung Yesus, sedangkan “kamu” mewakili ὑμεῖς yang jamak secara alami dalam bahasa Indonesia; kontekslah yang menunjukkan bahwa sapaan ditujukan kepada lebih dari satu orang. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang harus ditampilkan kepada pembaca.
