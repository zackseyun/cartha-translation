base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: id
  text: Orang itu pergi lalu memberitahukan kepada orang-orang Yahudi bahwa Yesuslah yang telah membuatnya sembuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi” atau “orang-orang Yudea”, bergantung pada bagaimana sebutan “orang-orang Yahudi” yang digunakan Yohanes dipahami dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Aoristus ἀπέρχομαι menyatakan bahwa orang itu meninggalkan tempat kejadian; 'pergi' alami dan jelas dalam narasi Indonesia.
- source_word: ὁ ἄνθρωπος
  choice: Orang itu
  rationale: Frasa definit merujuk kembali kepada laki-laki yang telah disembuhkan. 'Orang itu' wajar dalam bahasa Indonesia dan tidak perlu mengulang keterangan gender yang sudah jelas dari konteks.
- source_word: ἀνήγγειλεν
  choice: memberitahukan
  rationale: ἀναγγέλλω berarti menyampaikan atau melaporkan informasi. 'Memberitahukan' mempertahankan makna itu tanpa menyiratkan pengumuman kepada khalayak luas ataupun motif mengadu.
- source_word: τοῖς Ἰουδαίοις
  choice: kepada orang-orang Yahudi
  rationale: Terjemahan ini mempertahankan bentuk leksikal teks Yunani dan tidak langsung mempersempit acuannya menjadi para pemimpin. Kemungkinan nuansa kontekstual dicatat dalam catatan kaki.
- source_word: ὅτι
  choice: bahwa
  rationale: Konjungsi deklaratif yang memperkenalkan isi pemberitahuan.
- source_word: Ἰησοῦς ἐστιν
  choice: Yesuslah
  rationale: 'Partikel fokus ''-lah'' secara alami menandai identifikasi predikatif: Yesus adalah orang yang melakukan tindakan itu. Bahasa Indonesia tidak menuntut penandaan kala pada kopula.'
- source_word: ὁ ποιήσας
  choice: yang telah membuat
  rationale: Partisip aoristus berartikel mengidentifikasi pelaku tindakan yang sudah terjadi. 'Telah' menunjukkan bahwa tindakan tersebut mendahului pemberitahuan tanpa mengganti verba umum ποιέω dengan verba yang lebih interpretatif.
- source_word: αὐτὸν ὑγιῆ
  choice: membuatnya sembuh
  rationale: ὑγιής menunjukkan keadaan sehat atau pulih. Ungkapan 'membuatnya sembuh' alami dalam bahasa Indonesia dan sesuai dengan konteks penyembuhan.
theological_decisions:
- issue: Acuan τοῖς Ἰουδαίοις dalam Injil Yohanes
  choice: orang-orang Yahudi dalam teks utama, dengan kemungkinan kontekstual dijelaskan dalam catatan kaki
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani memakai istilah Ἰουδαῖοι. Dalam konteks Yohanes istilah itu kadang menunjuk secara khusus kepada kalangan pemimpin di Yudea, tetapi ayat ini sendiri tidak secara eksplisit memberikan pembatasan tersebut. Ambiguitas dipertahankan dan alternatif dicatat tanpa menetapkan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan 'Yesuslah yang ...' dipilih untuk menyampaikan fokus identifikasi dalam Ἰησοῦς ἐστιν ὁ ποιήσας secara alami.
