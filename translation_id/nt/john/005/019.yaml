  terminology: Kapitalisasi “Anak” dan “Bapa” konsisten dengan fungsi gelar dalam konteks. “Tidak dapat ... dari diri-Nya sendiri” secara memadai mempertahankan makna kemampuan dan relasi tanpa penambahan tafsiran dogmatis.
