  to: 'Karena itu, Yesus menjawab dan berkata kepada mereka, “Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: Anak tidak dapat melakukan apa pun dari diri-Nya sendiri, kecuali jika Ia melihat Bapa melakukan sesuatu. Sebab, apa pun yang dilakukan Bapa, Anak juga melakukan hal-hal itu dengan cara yang sama.”'
