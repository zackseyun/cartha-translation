id: JHN.5.19
reference: John 5:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: id
  text: 'Karena itu, Yesus menjawab dan berkata kepada mereka, “Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: Anak tidak dapat melakukan apa pun dari diri-Nya sendiri, kecuali jika Ia melihat Bapa melakukan sesuatu. Sebab, apa pun yang dilakukan Bapa, Anak juga melakukan hal-hal itu dengan cara yang sama.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Karena itu, Yesus menjawab dan berkata kepada mereka
  rationale: οὖν dipertahankan sebagai penghubung inferensial “Karena itu”. Gabungan aoris ἀπεκρίνατο dan imperfek ἔλεγεν diterjemahkan secara wajar sebagai “menjawab dan berkata”; bentuk progresif harfiah akan terasa tidak alami dalam narasi Indonesia.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Sesungguhnya, sesungguhnya, Aku berkata kepadamu
  rationale: Pengulangan ἀμὴν dipertahankan untuk menjaga penegasan khidmat khas perkataan Yesus. Bentuk tunggal ὑμῖν dapat dinyatakan dengan “kepadamu” sebagai sapaan kolektif dalam bahasa Indonesia.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: Anak tidak dapat melakukan apa pun dari diri-Nya sendiri
  rationale: “Tidak dapat” mempertahankan makna kemampuan pada οὐ δύναται, sedangkan “dari diri-Nya sendiri” mencerminkan ἀφ’ ἑαυτοῦ dan menjaga penekanan relasional tanpa menambahkan gagasan “inisiatif” yang tidak dinyatakan secara eksplisit.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: kecuali jika Ia melihat Bapa melakukan sesuatu
  rationale: “Kecuali jika” mempertahankan konstruksi pengecualian, dan “sesuatu” mewakili τι yang tak tentu. “Melihat” dipilih daripada “mengamati” agar tidak menambah nuansa yang tidak wajib.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: Sebab, apa pun yang dilakukan Bapa
  rationale: Relatif dengan ἄν dan subjungtif menyatakan generalisasi, sehingga diterjemahkan “apa pun”. ἐκεῖνος merujuk kembali kepada Bapa; pengulangan “Bapa” lebih alami dan jelas daripada “Dia itu” dalam bahasa Indonesia.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: itu juga dilakukan Anak dengan cara yang sama
  rationale: “Itu juga” mempertahankan korelasi ταῦτα καί, sementara “dengan cara yang sama” menyatakan ὁμοίως tanpa mengurangi kuatnya kesepadanan tindakan.
theological_decisions:
- issue: Ketidakmampuan Anak bertindak dari diri-Nya sendiri
  choice: Anak tidak dapat melakukan apa pun dari diri-Nya sendiri
  alternative: Anak tidak melakukan apa pun atas prakarsa-Nya sendiri
  rationale: Pilihan utama mempertahankan bahasa kemampuan dalam οὐ δύναται serta ketergantungan relasional dalam ἀφ’ ἑαυτοῦ. Terjemahan tidak mengubahnya menjadi sekadar pilihan atau prakarsa, dan juga tidak menyisipkan penjelasan ontologis yang tidak terdapat dalam ayat.
- issue: Kesatuan tindakan Anak dan Bapa
  choice: apa pun yang dilakukan Bapa, itu juga dilakukan Anak dengan cara yang sama
  alternative: apa yang dikerjakan Bapa, itu pula yang dikerjakan Anak
  rationale: 'Rumusan ini mempertahankan klaim luas dan kuat dari ἃ ... ταῦτα ... ὁμοίως: tindakan Anak bersesuaian dengan tindakan Bapa. Ambiguitas dan ketegangan teologis ayat dibiarkan berdiri tanpa penjelasan dogmatis tambahan.'
- issue: Kapitalisasi gelar relasional
  choice: Anak / Bapa
  alternative: anak / bapa
  rationale: Dalam konteks ini kedua nomina berfungsi sebagai sebutan khusus bagi Yesus dan Allah; kapitalisasi membantu pembaca mengenali fungsi tersebut tanpa menambah isi pada teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat cukup dekat dengan teks Yunani, tetapi menghindari kekakuan seperti “Dia itu” atau bentuk progresif “sedang berkata”. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia.
