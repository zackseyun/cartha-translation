  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: id
  text: Kamu menyelidiki Kitab Suci karena kamu menyangka bahwa di dalamnya kamu memiliki hidup kekal; dan Kitab Suci itulah yang bersaksi tentang Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Selidikilah Kitab Suci,” jika Ἐραυνᾶτε dipahami sebagai bentuk perintah, bukan pernyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Kamu menyelidiki
  rationale: Bentuk Yunani ini dapat berupa indikatif atau imperatif. Dalam konteks, indikatif paling wajar sebagai uraian tentang kebiasaan para lawan bicara Yesus; kemungkinan imperatif dipertahankan dalam catatan kaki.
- source_word: τὰς γραφάς
  choice: Kitab Suci
  rationale: Dalam pemakaian Yohanes, istilah ini menunjuk pada tulisan-tulisan suci Israel. 'Kitab Suci' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Konjungsi ini dipahami secara kausal, yaitu menjelaskan alasan mereka menyelidiki Kitab Suci.
- source_word: δοκεῖτε
  choice: kamu menyangka
  rationale: '''Menyangka'' menyampaikan keyakinan atau anggapan mereka sekaligus mempertahankan nada korektif yang tersirat.'
- source_word: ἐν αὐταῖς
  choice: di dalamnya
  rationale: Menerjemahkan ἐν secara langsung dan merujuk kembali kepada Kitab Suci tanpa menyatakan bahwa hidup diperoleh 'melaluinya'.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini adalah ungkapan Yohanes yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἐκεῖναί
  choice: justru Kitab Suci itulah
  rationale: Kata tunjuk feminin jamak ini merujuk kembali kepada Kitab Suci dan bersifat emfatis. Pengulangan acuannya menghindari kata ganti jamak yang tidak alami dalam bahasa Indonesia, sedangkan 'justru ... itulah' mempertahankan penekanannya.
- source_word: αἱ μαρτυροῦσαι
  choice: yang bersaksi
  rationale: '''Bersaksi'' jelas, alami, dan mempertahankan nuansa kesaksian yang penting dalam Injil Yohanes.'
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: Padanan alami bagi περί dengan genitif. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
theological_decisions:
- issue: Modus Ἐραυνᾶτε
  choice: 'Indikatif: ''Kamu menyelidiki Kitab Suci'''
  alternative: 'Imperatif: ''Selidikilah Kitab Suci'''
  rationale: Bentuk Yunani memungkinkan kedua pembacaan. Konteks langsung lebih mendukung indikatif karena Yesus sedang menggambarkan praktik para lawan bicara-Nya dan menunjukkan bahwa Kitab Suci yang mereka selidiki bersaksi tentang diri-Nya. Kemungkinan imperatif tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang kedua tunggal/jamak Yunani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat kolektif sesuai konteks. Susunan kalimat mempertahankan hubungan sebab-akibat dan penekanan pada Kitab Suci sebagai pemberi kesaksian.
