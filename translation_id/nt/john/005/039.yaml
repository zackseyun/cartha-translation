  naturalness: Bahasa umumnya baku dan alami. “Kitab Suci itulah yang bersaksi tentang Aku” lebih lugas dan idiomatis daripada “dan justru Kitab Suci itulah,” sambil tetap menyatakan penekanan demonstratif.
  terminology: “Kitab Suci,” “hidup kekal,” dan “bersaksi” adalah padanan yang mapan dan tepat bagi istilah Yohanes. Kapitalisasi “Aku” konsisten dengan register penerbitan Alkitab Indonesia.
