base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: id
  text: Seketika itu juga orang itu sembuh. Ia mengangkat tikarnya[a] dan mulai berjalan.[b] Hari itu adalah hari Sabat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “alas tidurnya.” Kata Yunani κράβαττον menunjuk pada tikar, kasur tipis, atau alas tidur sederhana yang dapat dibawa, bukan selalu ranjang sebagai perabot.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sedang berjalan.” Bentuk imperfek Yunani dapat menekankan tindakan yang sedang atau terus berlangsung; dalam konteks ini, bentuk tersebut juga dapat dipahami sebagai awal tindakannya berjalan setelah sembuh.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah, urutan katanya: “Adalah Sabat pada hari itu.” Bahasa Yunani tidak memakai kata sandang pada kata “Sabat” di sini.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: seketika itu juga
  rationale: Mengungkapkan bahwa kesembuhan terjadi langsung pada saat itu, dengan gaya naratif yang alami dalam bahasa Indonesia.
- source_word: ἐγένετο ὑγιὴς
  choice: sembuh
  rationale: Dalam konteks ini, ungkapan Yunani yang secara harfiah berarti 'menjadi sehat' paling alami diterjemahkan 'sembuh'; bentuk ini tetap menyatakan perubahan keadaan tanpa menambahkan pelaku pasif yang tidak dinyatakan oleh teks.
- source_word: ὁ ἄνθρωπος
  choice: orang itu
  rationale: Merujuk secara jelas kepada laki-laki yang sudah dikenal dari konteks. Bahasa Indonesia tidak perlu mengulang penanda gender ketika konteks telah menjelaskannya.
- source_word: ἦρε
  choice: mengangkat
  rationale: Menyatakan tindakan mengambil dan membawa alas tidur portabel itu; 'mengangkat' alami dan cukup konkret dalam konteks.
- source_word: κράβαττον
  choice: tikar
  rationale: Kata ini menunjuk pada alas tidur sederhana atau kasur tipis yang dapat dibawa, bukan ranjang besar sebagai perabot.
- source_word: περιεπάτει
  choice: mulai berjalan
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang atau terus berlangsung; dalam konteks pemulihan ini, 'mulai berjalan' secara alami menonjolkan dimulainya kemampuan berjalan, sementara kemungkinan aspek berkelanjutan dicatat dalam catatan kaki.
- source_word: Ἦν δὲ
  choice: Hari itu adalah
  rationale: δέ memperkenalkan keterangan naratif yang menyiapkan peristiwa berikutnya, bukan pertentangan kuat. Susunan ini alami dalam bahasa Indonesia tanpa memerlukan kata penghubung eksplisit.
- source_word: σάββατον
  choice: hari Sabat
  rationale: Padanan baku dan mudah dipahami untuk hari perhentian Yahudi yang dimaksud dalam narasi.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Hari itu
  rationale: Merupakan bentuk idiomatis bahasa Indonesia untuk keterangan waktu 'pada hari itu' ketika ditempatkan sebagai subjek kalimat nominal.
theological_decisions:
- issue: Penyajian σάββατον sebagai keterangan waktu dalam narasi
  choice: hari Sabat
  alternative: Sabat
  rationale: Bahasa Indonesia tidak memiliki artikel tak tentu dan tentu seperti bahasa Inggris, sehingga perbedaan 'a Sabbath' dan 'the Sabbath' tidak dapat disalin secara langsung. 'Hari Sabat' mengenali jenis hari yang dimaksud tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas, wajar, dan bermartabat. Kalimat Yunani yang panjang dibagi agar mudah dibaca tanpa mengubah urutan peristiwa. Istilah 'tikar' dipilih untuk menghindari gambaran ranjang besar, sedangkan catatan kaki mempertahankan alternatif leksikal dan nuansa aspek verba.
