  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi[a] berkata kepada orang yang telah disembuhkan itu, “Hari ini hari Sabat, dan menurut hukum kamu tidak boleh membawa tikarmu[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “para pemimpin Yahudi” atau “orang-orang Yudea”, bergantung pada cara Yohanes memakai ungkapan ini dalam konteks tersebut.
    reason: alternative_reading
  - marker: b
    text: Atau “mengangkat tikarmu” atau “mengambil tikarmu”.
    reason: lexical_alternative
  - marker: c
    text: Kata yang diterjemahkan “tikar” menunjuk alas tidur atau tempat tidur sederhana yang dapat dibawa, bukan suatu ranjang besar berkerangka.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran dalam alur waktu lampau. Bahasa Indonesia tidak wajib menandai aspek ini; “berkata” paling alami tanpa memaksakan arti bahwa mereka terus-menerus atau berulang kali mengatakannya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menghubungkan teguran ini dengan peristiwa sebelumnya dan mempertahankan daya inferensial atau kelanjutan naratif οὖν.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ini merupakan padanan langsung ungkapan Yunani. Konteks dekat tidak secara eksplisit membatasi para pembicara pada pemimpin Yahudi atau penduduk Yudea, sehingga kemungkinan yang lebih sempit dicatat dalam catatan kaki.
- source_word: τῷ τεθεραπευμένῳ
  choice: kepada orang yang telah disembuhkan itu
  rationale: Partisipel perfek pasif menyatakan penyembuhan yang sudah terjadi dengan hasil yang tetap berlaku; “telah disembuhkan” mempertahankan unsur tersebut secara wajar.
- source_word: Σάββατόν ἐστιν
  choice: Hari ini hari Sabat
  rationale: Ungkapan ini menyatakan bahwa waktu tersebut adalah hari Sabat. Penambahan “Hari ini” membuat maksud temporalnya alami dalam bahasa Indonesia tanpa mengubah isi.
- source_word: οὐκ ἔξεστίν σοι
  choice: menurut hukum kamu tidak boleh
  rationale: ἔξεστιν menyangkut apa yang diizinkan atau sah. “Menurut hukum ... tidak boleh” mempertahankan nuansa hukum-keagamaan dalam teguran itu.
- source_word: ἆραι
  choice: membawa
  rationale: αἴρω dapat berarti mengangkat atau mengambil, tetapi dalam konteks ini keberatannya menyangkut membawa alas tidur pada hari Sabat. “Membawa” menyampaikan daya praktis tuduhan tersebut.
- source_word: κράβαττον
  choice: tikar
  rationale: Kata ini menunjuk alas tidur atau tempat tidur sederhana yang dapat dibawa. “Tikar” mudah dipahami dan tidak menimbulkan gambaran ranjang besar berkerangka.
theological_decisions:
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani secara langsung berbunyi “orang-orang Yahudi,” sedangkan ayat ini sendiri tidak menyebut para pemimpin atau memperjelas arti geografis. Terjemahan utama tidak mempersempit rujukan secara diam-diam; kemungkinan kontekstual lain dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nuansa legal dalam larangan Sabat dan ambiguitas rujukan οἱ Ἰουδαῖοι tetap dipertahankan.
