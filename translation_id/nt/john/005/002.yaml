  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: id
  text: Di Yerusalem, dekat Gerbang Domba[a], ada sebuah kolam yang dalam bahasa Ibrani[b] disebut Betesda[c] dan memiliki lima serambi beratap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “Gerbang” tidak tertulis secara eksplisit dalam bahasa Yunani. Ungkapan itu kemungkinan menunjuk pada kawasan Gerbang Domba (bandingkan Nehemia 3:1; 12:39).
    reason: cross_reference
  - marker: b
    text: Atau “dalam bahasa Aram”; ungkapan Yohanes “dalam bahasa Ibrani” sering menunjuk pada bahasa Semit setempat di Yudea, bukan hanya bahasa Ibrani klasik.
    reason: lexical_alternative
  - marker: c
    text: Sejumlah naskah memuat “Betzata” atau “Betsaida” sebagai ganti “Betesda”.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: ada
  rationale: Bentuk kini ἔστιν dipertahankan melalui konstruksi eksistensial alami dalam bahasa Indonesia. δέ hanya menghubungkan dengan ringan dan tidak perlu diterjemahkan dengan kata temporal seperti “sekarang”.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: Di Yerusalem
  rationale: Nama tempat berbentuk jamak secara morfologis dalam bahasa Yunani, tetapi secara wajar diterjemahkan dengan nama kota tunggal “Yerusalem”.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: dekat Gerbang Domba
  rationale: Ungkapan ini eliptis; kata sifat προβατικῇ kemungkinan menunjuk pada Gerbang Domba atau kawasan di sekitarnya. “Gerbang” dilengkapi demi kejelasan dan dicatat dalam catatan kaki.
- source_word: κολυμβήθρα
  choice: sebuah kolam
  rationale: Padanan umum dan jelas untuk kolam atau penampungan air dalam konteks ini.
- source_word: ἡ ἐπιλεγομένη
  choice: disebut
  rationale: Menyampaikan fungsi partisip yang memperkenalkan nama kolam secara ringkas dan alami.
- source_word: Ἑβραϊστὶ
  choice: dalam bahasa Ibrani
  rationale: Terjemahan langsung ungkapan sumber dipertahankan, sementara kemungkinan bahwa istilah itu mencakup bahasa Aram setempat dijelaskan dalam catatan kaki.
- source_word: Βηθεσδά
  choice: Betesda
  rationale: Mengikuti bentuk Βηθεσδά dalam teks SBLGNT yang diberikan; bentuk-bentuk naskah lain dicatat sebagai varian.
- source_word: πέντε στοὰς ἔχουσα
  choice: memiliki lima serambi beratap
  rationale: στοά menunjuk pada serambi atau jalur beratap, lazimnya dengan deretan tiang. Ungkapan ini mudah dipahami dan tetap mempertahankan gagasan bangunan beratap.
