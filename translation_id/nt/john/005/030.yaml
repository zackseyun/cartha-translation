id: JHN.5.30
reference: John 5:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: id
  text: “Aku tidak dapat berbuat apa pun dari diri-Ku sendiri.[a] Sebagaimana Aku mendengar, Aku menghakimi, dan penghakiman-Ku adil, karena Aku tidak mencari kehendak-Ku sendiri, melainkan kehendak Dia yang mengutus Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku tidak dapat berbuat apa pun atas prakarsa-Ku sendiri.” Frasa Yunani ini dapat menekankan tindakan yang tidak dilakukan secara mandiri; terjemahan utama mempertahankan juga nuansa sumber atau asal tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Aku tidak dapat
  rationale: Mempertahankan pernyataan kemampuan yang dinegasikan serta subjek ἐγώ yang dinyatakan secara eksplisit. Bentuk ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi sekadar keengganan.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: berbuat apa pun dari diri-Ku sendiri
  rationale: Di bawah negasi, οὐδέν secara alami diterjemahkan 'apa pun'. Frasa 'dari diri-Ku sendiri' mempertahankan nuansa sumber atau asal tindakan dalam ἀπ’ ἐμαυτοῦ, sekaligus menyiratkan bahwa tindakan itu tidak dilakukan secara mandiri.
- source_word: καθὼς ἀκούω κρίνω
  choice: Sebagaimana Aku mendengar, Aku menghakimi
  rationale: Mempertahankan hubungan kesesuaian yang ditandai καθὼς dan bentuk kini dari kedua verba, tanpa menambahkan objek atau sumber pendengaran yang tidak disebutkan secara eksplisit.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: Aku menghakimi / penghakiman-Ku
  rationale: Menjaga kesinambungan leksikal dan nuansa yudisial antara verba κρίνω dan nomina κρίσις.
- source_word: δικαία
  choice: adil
  rationale: Dalam konteks penghakiman, 'adil' menyampaikan bahwa penghakiman itu benar dan sesuai keadilan secara lebih alami daripada 'benar' atau 'saleh'.
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: Aku tidak mencari kehendak-Ku sendiri
  rationale: Kata 'mencari' mempertahankan gambaran ζητῶ sebagai tujuan atau hal yang dikejar, sedangkan 'sendiri' mencerminkan penekanan pada kepunyaan dalam frasa Yunani.
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: melainkan kehendak Dia yang mengutus Aku
  rationale: Menerjemahkan konstruksi partisipial secara jelas tanpa mengganti sebutan relasional itu dengan 'Bapa', yang tidak muncul secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Hubungan tindakan Sang Anak dengan Dia yang mengutus-Nya dalam ἀπ’ ἐμαυτοῦ
  choice: dari diri-Ku sendiri
  alternative: atas prakarsa-Ku sendiri; seorang diri
  rationale: 'Pilihan ini mempertahankan ketegangan teks: Yesus menyatakan bahwa tindakan-Nya tidak bersumber dari diri-Nya secara terpisah, tanpa mengubah pernyataan itu menjadi ketidakmampuan mutlak ataupun sekadar tindakan tanpa bantuan.'
- issue: Makna δικαία dalam kaitannya dengan κρίσις
  choice: penghakiman-Ku adil
  alternative: penghakiman-Ku benar
  rationale: Konteksnya bersifat yudisial, sehingga 'adil' paling langsung menyatakan kualitas penghakiman tersebut tanpa meniadakan dimensi kebenaran moralnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk kepada Yesus dan pengutus-Nya ditulis dengan huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur 'Sebagaimana Aku mendengar, Aku menghakimi' sengaja mempertahankan kesejajaran ringkas teks Yunani.
