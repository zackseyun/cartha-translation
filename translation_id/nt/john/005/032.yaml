  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: id
  text: Ada yang lain yang bersaksi tentang Aku,[a] dan Aku tahu bahwa kesaksian yang ia berikan tentang Aku itu benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ada yang lain yang memberikan kesaksian tentang Aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: Pribadi lain
  rationale: ἄλλος menunjuk kepada pihak lain sebagai saksi, berlawanan dengan kesaksian Yesus tentang diri-Nya sendiri dalam konteks terdekat. Kapitalisasi menjaga kemungkinan bahwa yang dimaksud ialah Allah tanpa menyebut identitas-Nya secara eksplisit.
- source_word: ὁ μαρτυρῶν
  choice: yang bersaksi
  rationale: Partisipel kini berartikel ini berfungsi substantival, yaitu 'dia yang bersaksi'. 'Yang bersaksi' alami dalam bahasa Indonesia dan mempertahankan nuansa verbalnya.
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: περί dengan genitif menyatakan pokok atau hal yang menjadi isi kesaksian. 'Tentang Aku' merupakan padanan langsung dan wajar.
- source_word: οἶδα
  choice: Aku tahu
  rationale: Padanan langsung dan alami bagi verba yang menyatakan pengetahuan.
- source_word: ἀληθής
  choice: benar
  rationale: Dalam konteks ini kata tersebut menyatakan bahwa kesaksian itu benar atau dapat dipercaya; 'benar' mempertahankan makna dasar tanpa mempersempitnya menjadi 'sah' atau 'jujur'.
- source_word: ἡ μαρτυρία
  choice: kesaksian
  rationale: '''Kesaksian'' mempertahankan corak yuridis konteks dan hubungan leksikal dengan verba μαρτυρέω.'
- source_word: ἣν μαρτυρεῖ
  choice: yang diberikan-Nya
  rationale: Secara harfiah, frasa ini berbunyi 'yang disaksikan-Nya'. Dalam bahasa Indonesia, 'kesaksian yang diberikan' lebih alami, sementara gagasan bersaksi telah dinyatakan dalam klausa sebelumnya.
theological_decisions:
- issue: Identitas ἄλλος ('yang lain')
  choice: Tidak menyebut identitas saksi itu secara eksplisit; menerjemahkannya sebagai 'Pribadi lain'.
  alternative: Yohanes Pembaptis; Bapa; atau seorang saksi lain dalam pengertian hukum.
  rationale: Ayat ini sendiri tidak secara eksplisit mengidentifikasi referennya. Terjemahan mempertahankan tingkat kekhususan teks dan tidak memasukkan kesimpulan penafsiran ke dalam ayat.
- issue: Rujukan pronomina kepada saksi lain
  choice: Menggunakan bentuk hormat berhuruf kapital '-Nya'.
  alternative: Menggunakan 'dia' atau '-nya' tanpa kapital untuk membiarkan identitas sepenuhnya tidak ditandai.
  rationale: Dalam konteks Yohanes 5:31–37, saksi lain itu paling mungkin menunjuk kepada Bapa, tetapi nama atau gelar-Nya tidak ditambahkan. Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi sambil tetap mempertahankan ungkapan generik teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan akar kata Yunani μαρτυρ- sebagian dipertahankan melalui 'bersaksi' dan 'kesaksian', tetapi konstruksi kedua dibuat idiomatis sebagai 'kesaksian yang diberikan-Nya'.
