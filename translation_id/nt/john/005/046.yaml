base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: id
  text: Sebab, seandainya kalian percaya kepada Musa[a], kalian tentu akan percaya kepada-Ku, karena dialah[b] yang menulis tentang Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memercayai Musa” dan “memercayai Aku.” Kata kerja Yunani yang sama dipakai dalam kedua klausa.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “karena orang itulah yang menulis tentang Aku.” Kata ἐκεῖνος memberi penekanan pada Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sebab, seandainya
  rationale: γάρ menghubungkan ayat ini dengan alasan sebelumnya, sedangkan εἰ bersama bentuk lampau dan ἄν menyatakan kondisi yang berlawanan dengan kenyataan; “seandainya” menyampaikannya secara alami.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: kalian percaya kepada Musa
  rationale: πιστεύω dengan datif menunjuk kepada pribadi yang dipercayai. “Percaya kepada Musa” mempertahankan konstruksi tersebut dan kaitan leksikal dengan klausa berikutnya.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: kalian tentu akan percaya kepada-Ku
  rationale: Imperfek dengan ἄν dalam apodosis menyatakan akibat yang tidak terwujud. “Tentu akan” membawa daya inferensialnya, sementara “kepada-Ku” tidak menambahkan gagasan πιστεύω εἰς yang tidak terdapat dalam teks.
- source_word: περὶ γὰρ ἐμοῦ
  choice: karena ... tentang Aku
  rationale: περί dengan genitif berarti “tentang” atau “mengenai”; “tentang Aku” alami dalam bahasa Indonesia dan tidak memperluas klaim teks.
- source_word: ἐκεῖνος
  choice: dialah
  rationale: Demonstratif ini merujuk kembali secara tegas kepada Musa. “Dialah” mempertahankan penekanannya lebih baik daripada sekadar “ia”.
- source_word: ἔγραψεν
  choice: menulis
  rationale: Aoris menunjukkan tindakan Musa menulis; bentuk “menulis” merupakan padanan Indonesia yang alami tanpa memaksakan aspek tambahan.
theological_decisions:
- issue: Sifat kesaksian tulisan Musa tentang Yesus
  choice: dialah yang menulis tentang Aku
  alternative: ia menulis mengenai Aku
  rationale: Terjemahan mempertahankan pernyataan bahwa tulisan Musa bersaksi tentang Yesus tanpa menentukan satu nas tertentu atau memasukkan penafsiran kristologis yang lebih luas daripada bahasa Yunani.
- issue: Makna percaya kepada Yesus dalam konstruksi datif
  choice: percaya kepada-Ku
  alternative: memercayai Aku
  rationale: Teks memakai datif ἐμοί, bukan frasa dengan εἰς. Pilihan ini menjaga kesejajaran dengan “percaya kepada Musa” dan tidak secara diam-diam mengubahnya menjadi rumusan “percaya di dalam.”
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai agar subjek jamak Yunani terlihat jelas; huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab Indonesia.
