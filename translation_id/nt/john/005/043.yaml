id: JHN.5.43
reference: John 5:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: id
  text: Aku telah datang dalam nama Bapa-Ku[a], tetapi kalian tidak menerima Aku. Jika orang lain datang dalam namanya sendiri[b], kalian akan menerima dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan wewenang Bapa-Ku.” Ungkapan Yunani “dalam nama” dapat menunjukkan perwakilan atau wewenang, bukan hanya nama itu sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau, “atas wewenangnya sendiri.” Ungkapan “dalam namanya sendiri” sangat berlawanan dengan kedatangan Yesus “dalam nama Bapa-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐλήλυθα
  choice: Aku telah datang
  rationale: Kata ganti yang dinyatakan secara eksplisit mempertahankan penekanan pada Yesus, sedangkan bentuk perfektum diterjemahkan dengan 'telah datang' untuk menyampaikan kedatangan yang sudah terjadi dan tetap relevan.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: dalam nama Bapa-Ku
  rationale: Ungkapan ini mempertahankan idiom Yunani beserta cakupan makna perwakilan dan wewenang, sekaligus menjaga kesejajaran dengan 'dalam namanya sendiri'.
- source_word: οὐ λαμβάνετέ με
  choice: kalian tidak menerima Aku
  rationale: Dalam konteks ini λαμβάνω berarti menerima atau mengakui Yesus, bukan mengambil secara fisik. 'Menerima' juga mempertahankan pengulangan retoris dengan klausa terakhir.
- source_word: ἐὰν ἄλλος ἔλθῃ
  choice: Jika orang lain datang
  rationale: '''Orang lain'' menyatakan kontras dengan Yesus secara alami dalam bahasa Indonesia tanpa menambahkan identitas atau kekhususan yang tidak terdapat dalam teks.'
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: dalam namanya sendiri
  rationale: Terjemahan ini mempertahankan susunan sejajar dan kontras tajam dengan kedatangan Yesus dalam nama Bapa-Nya, tanpa membatasi maknanya hanya pada wewenang.
- source_word: ἐκεῖνον λήμψεσθε
  choice: kalian akan menerima dia
  rationale: Pengulangan 'menerima' menjaga kontras retoris dengan penolakan terhadap Yesus; 'dia' alami dalam bahasa Indonesia dan tetap merujuk kepada orang lain tersebut.
theological_decisions:
- issue: Apakah 'Bapa-Ku' perlu dibuat eksplisit sebagai Allah Bapa
  choice: Memakai 'Bapa-Ku' dengan huruf kapital tanpa menambahkan kata 'Allah'.
  alternative: Allah, Bapa-Ku; atau bapa-Ku dengan huruf kecil
  rationale: Konteks Yohanes menunjukkan bahwa yang dimaksud ialah Allah, tetapi penambahan 'Allah' tidak terdapat dalam teks Yunani. Kapitalisasi membantu menunjukkan rujukan ilahi tanpa menambah isi.
- issue: Apakah ungkapan 'dalam nama' harus dijelaskan sebagai bahasa wewenang dalam teks utama
  choice: Mempertahankan 'dalam nama' pada kedua klausa.
  alternative: dengan wewenang Bapa-Ku / atas wewenangnya sendiri
  rationale: Ungkapan Yunani dapat mencakup perwakilan dan wewenang, tetapi terjemahan yang langsung memakai 'wewenang' akan mempersempit cakupan makna dan melemahkan kesejajaran sastra yang disengaja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan bahwa kata ganti orang kedua dalam bahasa Yunani berbentuk jamak. Kapitalisasi pada 'Aku', 'Bapa-Ku', dan rujukan kepada Yesus mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia; kata ganti bagi 'orang lain' tetap huruf kecil.
