base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Bangunlah, angkat tikarmu[a], dan berjalanlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “angkat alas tidurmu.” Kata Yunani yang dipakai menunjuk pada tikar atau alas tidur sederhana yang dapat dibawa, bukan semestinya ranjang berupa perabot.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani merupakan ciri narasi Yohanes. Dalam bahasa Indonesia, “berkata” tetap alami tanpa harus membedakan bentuk kini dan lampau secara morfologis.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Menyampaikan objek tak langsung datif secara ringkas dan alami.
- source_word: Ἔγειρε
  choice: Bangunlah
  rationale: Imperatif ini memerintahkan orang itu segera bangkit dari tempatnya; “Bangunlah” alami, langsung, dan tidak menambahkan gagasan penyembuhan yang tidak dinyatakan secara leksikal.
- source_word: ἆρον
  choice: angkat
  rationale: Imperatif αἴρω menunjuk pada tindakan mengangkat atau mengambil benda tersebut. “Angkat” jelas dan cocok dengan tikar yang dapat dibawa.
- source_word: κράβαττόν
  choice: tikar
  rationale: Istilah ini menunjuk pada alas tidur sederhana atau kasur tipis yang mudah dibawa, bukan semestinya ranjang berupa perabot.
- source_word: περιπάτει
  choice: berjalanlah
  rationale: Dalam konteks ini kata tersebut secara harfiah memerintahkan tindakan berjalan; terjemahan ini tidak melebihkan aspek duratifnya.
theological_decisions:
- issue: Sifat perintah Yesus dalam konteks penyembuhan
  choice: 'Ketiga imperatif diterjemahkan sebagai perintah fisik langsung: bangun, angkat tikar, dan berjalan.'
  alternative: “Bangunlah dan sembuhlah,” atau ungkapan lain yang secara eksplisit menambahkan penyembuhan.
  rationale: Ayat Yunani hanya menyatakan tiga perintah tersebut. Penyembuhan tersirat jelas dari konteks, tetapi tidak boleh ditambahkan ke dalam bunyi ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Akhiran imperatif -lah mempertahankan nada perintah langsung tanpa terdengar kasar. Penanda catatan kaki ditempatkan sesudah kalimat karena catatan menjelaskan kata “tikar” dalam kutipan.
