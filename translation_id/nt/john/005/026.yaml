  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: id
  text: Sebab, sama seperti Bapa memiliki hidup di dalam diri-Nya sendiri,[a] demikian juga Ia telah mengaruniakan kepada Anak supaya Anak memiliki hidup di dalam diri-Nya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Hidup di dalam diri-Nya sendiri'' dapat dipahami sebagai hidup yang melekat pada keberadaan-Nya sendiri. Terjemahan ini mempertahankan susunan bahasa Yunani dan tidak memakai istilah teologis teknis.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: ''memberikan kepada Anak untuk memiliki hidup di dalam diri-Nya sendiri.'''
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab, sama seperti
  rationale: Mempertahankan fungsi penjelas γάρ dan pembandingan ὥσπερ, sekaligus menghubungkan ayat ini secara wajar dengan konteks sebelumnya.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Gelar definit bagi Allah dalam konteks Yohanes; bentuk tanpa artikel alami dalam bahasa Indonesia.
- source_word: ἔχει ζωὴν
  choice: memiliki hidup
  rationale: Menyampaikan pernyataan kala kini secara lugas; 'memiliki' terdengar lebih alami daripada sekadar 'mempunyai' dalam register ini.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: hidup di dalam diri-Nya sendiri
  rationale: Menjaga frasa preposisional tetap eksplisit dan tidak menggantinya dengan istilah teologis teknis seperti 'hidup yang ada dengan sendirinya'.
- source_word: οὕτως καὶ
  choice: demikian juga
  rationale: Mempertahankan struktur korelatif ὥσπερ ... οὕτως dan nilai καί sebagai 'juga'.
- source_word: τῷ υἱῷ
  choice: kepada Anak
  rationale: Mencerminkan datif penerima setelah ἔδωκεν dan mempertahankan gelar kristologis dalam konteks.
- source_word: ἔδωκεν
  choice: mengaruniakan
  rationale: Mencerminkan tindakan memberi yang dikaruniakan atau dianugerahkan dan menghasilkan bahasa Indonesia yang bermartabat; alternatif yang lebih harfiah dicatat.
- source_word: ζωὴν ἔχειν
  choice: untuk memiliki hidup
  rationale: Terjemahan alami bagi konstruksi infinitif yang melengkapi verba ἔδωκεν.
- source_word: ἐν ἑαυτῷ
  choice: di dalam diri-Nya sendiri
  rationale: Mengulang ungkapan yang sama untuk menjaga kesejajaran antara Bapa dan Anak.
theological_decisions:
- issue: Apakah ζωὴν ἐν ἑαυτῷ perlu diterjemahkan dengan istilah teknis tentang keberadaan mandiri
  choice: Mempertahankan ungkapan 'hidup di dalam diri-Nya sendiri'.
  alternative: '''hidup yang ada dengan sendirinya'' atau istilah teknis ''aseitas'''
  rationale: Bahasa Yunani menyatakan 'hidup dalam diri-Nya sendiri'. Terjemahan mempertahankan bobot dan kemungkinan maknanya tanpa menggantinya dengan rumusan teologis yang lebih kemudian.
- issue: Bagaimana mempertahankan bahasa pemberian dari Bapa kepada Anak
  choice: Menerjemahkan ἔδωκεν sebagai 'mengaruniakan' tanpa menambahkan penjelasan doktrinal dalam teks utama.
  alternative: '''memberikan'''
  rationale: Ayat secara eksplisit berbicara tentang Bapa yang memberi kepada Anak untuk memiliki hidup dalam diri-Nya sendiri. Terjemahan tidak boleh melunakkan pemberian itu ataupun menyelesaikan ketegangan kristologisnya melalui tambahan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan frasa 'di dalam diri-Nya sendiri' dipertahankan dengan sengaja demi kesejajaran retoris dan teologis. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
