base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: id
  text: 'Jangan mengira bahwa Aku akan menuduh kamu di hadapan Bapa[a]. Ada yang menuduh kamu: Musa[b], yang kepadanya kamu telah menaruh harapan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan menyangka bahwa Aku akan mengajukan tuduhan terhadap kamu di hadapan Bapa.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ayat-ayat berikutnya, tuduhan Musa dikaitkan dengan tulisan-tulisannya (lihat ayat 46–47).
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Jangan mengira
  rationale: Bentuk larangan ini secara alami menyatakan peringatan langsung. “Jangan mengira” jelas, wajar dalam bahasa Indonesia modern, dan mempertahankan makna ‘jangan berpikir/menyangka’.
- source_word: κατηγορήσω
  choice: Aku akan menuduh
  rationale: κατηγορέω berarti menuduh atau mengajukan tuduhan. “Menuduh” mempertahankan nuansa hukum tanpa memperkuatnya menjadi ‘menghukum’.
- source_word: πρὸς τὸν πατέρα
  choice: di hadapan Bapa
  rationale: Dalam konteks tuduhan, frasa ini menggambarkan tuduhan yang disampaikan di hadapan Bapa. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan citra yudisial.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Yang menuduh kamu adalah
  rationale: Susunan ini memperkenalkan dan menegaskan siapa penuduh mereka. Bentuk “menuduh” juga mempertahankan daya kini dari partisipel Yunani.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk baku nama ini dalam bahasa Indonesia.
- source_word: εἰς ὃν
  choice: yang kepadanya
  rationale: ἐλπίζω dengan εἰς menyatakan arah atau sasaran pengharapan. “Kepadanya” mempertahankan bahwa Musa sendiri disebut sebagai sasaran pengharapan, bukan secara eksplisit Taurat atau tulisannya.
- source_word: ἠλπίκατε
  choice: kamu telah menaruh harapan
  rationale: Bentuk perfektum menunjukkan sikap yang telah terbentuk dan tetap relevan. “Telah menaruh harapan” menyampaikan tindakan beserta hasilnya yang berlanjut.
theological_decisions:
- issue: Daya forensik pernyataan Yesus tentang tuduhan
  choice: Menggunakan “menuduh”, bukan istilah yang berarti menjatuhkan hukuman.
  alternative: Aku akan menghukum kamu di hadapan Bapa.
  rationale: κατηγορέω menunjuk pada tindakan menuduh atau mengajukan dakwaan, bukan pada putusan akhir. Terjemahan ini mempertahankan gambaran hukum tanpa menambahkan klaim teologis yang lebih kuat.
- issue: Sasaran pengharapan kepada Musa
  choice: Menyatakan bahwa mereka menaruh harapan kepada Musa.
  alternative: Menaruh harapan pada Taurat Musa atau tulisan-tulisan Musa.
  rationale: Konteks yang lebih luas memang berkaitan dengan tulisan Musa, tetapi teks Yunani menyebut Musa secara langsung. Terjemahan mempertahankan ungkapan itu dan tidak memasukkan penafsiran kontekstual ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “Aku” memakai huruf kapital karena merujuk kepada Yesus sesuai kebiasaan penerbitan Alkitab bahasa Indonesia; “Bapa” dipertahankan sebagai gelar khas dalam Injil Yohanes. Struktur kalimat kedua dibuat alami tanpa menghilangkan penekanan pada Musa.
