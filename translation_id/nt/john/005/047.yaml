  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: id
  text: Namun, jika kamu tidak percaya kepada tulisan-tulisannya[a], bagaimana kamu akan percaya kepada perkataan-Ku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surat-suratnya.” Kata Yunani ini dapat berarti surat atau tulisan; di sini yang dimaksud ialah apa yang ditulis Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: Menyampaikan syarat εἰ sekaligus daya kontras δέ dengan ungkapan Indonesia yang alami.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: kepada apa yang ditulisnya
  rationale: Dalam konteks, γράμματα menunjuk pada tulisan Musa. Bentuk ini alami dalam bahasa Indonesia, mempertahankan pronomina Yunani, dan tidak mempersempit maknanya menjadi surat-surat atau memberi label eksplisit Kitab Suci.
- source_word: οὐ πιστεύετε
  choice: kamu tidak percaya
  rationale: πιστεύω dengan datif di sini menyatakan menerima kesaksian sebagai benar; 'percaya kepada' juga mempertahankan kesejajaran kedua klausa.
- source_word: πῶς ... πιστεύσετε
  choice: bagaimana kamu akan percaya
  rationale: Mempertahankan pertanyaan retoris πῶς dan orientasi waktu mendatang dari bentuk futurum πιστεύσετε tanpa mengubahnya menjadi pertanyaan tentang kemampuan.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: kepada perkataan-Ku
  rationale: ῥήματα menunjuk pada perkataan atau ujaran Yesus. 'Perkataan-Ku' terdengar wajar dan bermartabat serta mempertahankan kontras dengan apa yang ditulis Musa.
theological_decisions:
- issue: Acuan ἐκείνου ('dia/-nya')
  choice: Akhiran '-nya' mengacu kepada Musa dalam konteks langsung.
  alternative: Mengulang nama 'Musa' dalam teks utama atau membiarkan acuannya generik.
  rationale: Yohanes 5:45–46 secara eksplisit menyebut Musa dan tulisannya. Pronomina dipertahankan sebagaimana teks Yunani, sementara konteks menjelaskan acuannya.
- issue: Makna πιστεύω
  choice: Diterjemahkan secara konsisten sebagai 'percaya' dalam kedua klausa.
  alternative: Memakai 'memercayai' atau 'menaruh kepercayaan'.
  rationale: Konteks menekankan penerimaan terhadap kesaksian tulisan Musa dan perkataan Yesus sebagai benar. Pilihan yang sama menjaga kesejajaran retoris tanpa memasukkan pembedaan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina orang kedua tunggal diterjemahkan 'kamu' sesuai sapaan langsung dalam konteks; kapitalisasi '-Ku' mengikuti konvensi penulisan rujukan ilahi dalam bahasa Indonesia. Susunan kalimat menjaga kontras antara tulisan Musa dan perkataan Yesus.
