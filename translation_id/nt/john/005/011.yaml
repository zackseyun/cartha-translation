  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: id
  text: Namun, ia menjawab mereka, “Orang yang telah menyembuhkan aku, dialah yang telah berkata kepadaku, ‘Angkatlah tikarmu dan berjalanlah.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang langsung dan alami untuk verba tanggapan dalam dialog.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Orang yang menyembuhkan aku
  rationale: Mengungkapkan konstruksi partisipial dan makna kausatif dalam konteks pemulihan fisik secara alami dalam bahasa Indonesia.
- source_word: ἐκεῖνός
  choice: dialah
  rationale: Mempertahankan penekanan pada pronomina Yunani tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: Ἆρον
  choice: Angkatlah
  rationale: Menyampaikan perintah konkret untuk mengangkat benda tersebut; bentuk -lah sesuai dengan kutipan perintah yang bermartabat dan wajar.
- source_word: κράβαττόν
  choice: tikarmu
  rationale: Merujuk pada alas tidur sederhana, bukan ranjang besar; 'tikar' jelas dan mudah dipahami pembaca modern.
- source_word: περιπάτει
  choice: berjalanlah
  rationale: Padanan idiomatis bagi perintah untuk berjalan; aspek kini tidak perlu diperjelas menjadi tindakan berkelanjutan dalam konteks ini.
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan dengan perkataan sebelumnya secara alami.
theological_decisions:
- issue: Cakupan makna pemulihan dalam Ὁ ποιήσας με ὑγιῆ
  choice: menyembuhkan aku
  alternative: membuat aku pulih / menjadikan aku utuh
  rationale: Konteks terutama menyatakan kesembuhan fisik. 'Menyembuhkan' tidak memasukkan gagasan keutuhan rohani yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Penekanan ἐκεῖνός dipertahankan melalui 'dialah'. Tidak diperlukan catatan kaki karena 'tikar' secara tepat dan alami menyampaikan benda yang dimaksud.
