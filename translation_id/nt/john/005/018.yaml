  verdict: revise
  source_fidelity: Klausa utama pada umumnya setia pada teks Yunani. Namun, tambahan “dan dengan demikian” memberi hubungan inferensial yang lebih tegas daripada partisipel ποιῶν, yang secara langsung menerangkan tindakan “menjadikan diri-Nya setara dengan Allah.” Terjemahan sebaiknya mempertahankan hubungan itu tanpa menambahkan penilaian tentang jenis implikasinya.
  naturalness: Bahasa draf baku dan mudah dipahami. “Allah sebagai Bapa-Nya sendiri” dapat dibuat lebih langsung dan alami sebagai “Allah Bapa-Nya sendiri,” tanpa perubahan makna. Susunan dengan “dengan menjadikan diri-Nya setara dengan Allah” juga lebih dekat dengan struktur klausa partisipial Yunani.
  terminology: “orang-orang Yahudi,” “hari Sabat,” “Allah,” dan “Bapa-Nya” sesuai dengan register Alkitab bahasa Indonesia serta mempertahankan istilah sumber. Catatan kaki a secara tepat menghindari generalisasi referen οἱ Ἰουδαῖοι. Catatan kaki b tetap dapat dipertahankan sebagai alternatif gaya yang sah.
  issues:
