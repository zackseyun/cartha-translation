id: JHN.5.18
reference: John 5:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: id
  text: Karena itulah orang-orang Yahudi[a] makin berusaha membunuh Dia, sebab Dia bukan hanya melanggar hari Sabat, tetapi juga menyebut Allah Bapa-Nya sendiri, dengan menjadikan diri-Nya setara dengan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Injil Yohanes, sebutan “orang-orang Yahudi” sering merujuk secara lebih khusus kepada para penentang Yesus di Yudea atau kalangan pemimpin Yahudi tertentu dalam konteksnya, bukan kepada semua orang Yahudi tanpa kecuali.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan, “menyamakan diri-Nya dengan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Karena itulah
  rationale: Ungkapan ini menyampaikan hubungan sebab-akibat dan kesimpulan dengan wajar dalam bahasa Indonesia tanpa menghasilkan pengulangan yang kaku.
- source_word: μᾶλλον
  choice: makin
  rationale: Menunjukkan peningkatan intensitas usaha mereka dibandingkan dengan keadaan sebelumnya.
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: berusaha membunuh
  rationale: Bentuk imperfek menyatakan usaha yang sedang atau terus dilakukan; 'berusaha' alami dalam bahasa Indonesia dan tetap mempertahankan daya verba sumber.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan bentuk leksikal teks Yunani; cakupan rujukannya dalam konteks Yohanes dijelaskan melalui catatan kaki agar tidak dipersempit secara diam-diam.
- source_word: ἔλυε τὸ σάββατον
  choice: melanggar hari Sabat
  rationale: λύω dalam konteks ini berarti melanggar atau meniadakan ketentuan Sabat, bukan secara harfiah 'melepaskan'; pilihan ini jelas dan alami.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: menyebut Allah sebagai Bapa-Nya sendiri
  rationale: Mempertahankan tindakan 'menyebut' serta penekanan ἴδιον pada hubungan dengan Bapa yang dinyatakan sebagai milik-Nya sendiri.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: dan dengan demikian menyamakan diri-Nya dengan Allah
  rationale: Partisipel menjelaskan akibat atau implikasi klaim sebelumnya. 'Menyamakan diri-Nya dengan Allah' mempertahankan kekuatan kristologis klausa secara alami.
theological_decisions:
- issue: Kekuatan kristologis pernyataan tentang kesetaraan dengan Allah
  choice: menyamakan diri-Nya dengan Allah
  alternative: menjadikan diri-Nya setara dengan Allah
  rationale: Pilihan utama tidak melemahkan pernyataan eksplisit teks, tetapi juga tidak memasukkan istilah dogmatis yang tidak terdapat dalam ayat.
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi dalam teks utama, dengan penjelasan kontekstual dalam catatan kaki
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks sumber menggunakan istilah yang secara leksikal berarti 'orang-orang Yahudi'. Catatan kaki menjaga kemungkinan bahwa dalam konteks ini rujukannya lebih khusus tanpa mengubah teks utama menjadi tafsiran yang lebih sempit.
- issue: Hubungan partisipel ποιῶν dengan klaim bahwa Allah adalah Bapa-Nya sendiri
  choice: dan dengan demikian
  alternative: sehingga; sambil
  rationale: Ungkapan ini menampilkan klausa terakhir sebagai implikasi dari penyebutan Allah sebagai Bapa-Nya sendiri, sambil tidak menentukan apakah narasi sedang melaporkan kesimpulan para lawan saja atau sekaligus memberi penilaian narator.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dia' dan bentuk '-Nya' dipakai secara konsisten untuk Yesus; 'hari Sabat' merupakan ungkapan yang umum dipahami. Susunan kalimat mempertahankan alur sebab-akibat teks Yunani tanpa terdengar kaku.
