revisions:
- from: Karena itulah orang-orang Yahudi[a] makin berusaha membunuh Dia, sebab Dia bukan hanya melanggar hari Sabat, tetapi juga menyebut Allah sebagai Bapa-Nya sendiri, dan dengan demikian menyamakan diri-Nya dengan Allah.[b]
  to: Karena itulah orang-orang Yahudi[a] makin berusaha membunuh Dia, sebab Dia bukan hanya melanggar hari Sabat, tetapi juga menyebut Allah Bapa-Nya sendiri, dengan menjadikan diri-Nya setara dengan Allah.[b]
  rationale: Revisi menghilangkan penambahan inferensial “dan dengan demikian” dan menerjemahkan ποιῶν secara langsung dengan “dengan menjadikan diri-Nya setara dengan Allah.” Frasa tentang Allah sebagai Bapa-Nya juga dibuat lebih alami dan dekat dengan susunan sumber. Catatan kaki dipertahankan, dengan alternatif pada b diselaraskan dengan pilihan teks utama.
