translation:
  language: id
  text: 'Di serambi-serambi itu terbaring sejumlah besar orang: yang sakit, buta, timpang, dan yang anggota tubuhnya layu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kering” atau “layu”; kemungkinan menunjuk pada anggota tubuh yang layu atau menyusut sehingga tidak dapat berfungsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Di serambi-serambi itu
  rationale: Kata tunjuk feminin jamak merujuk pada serambi-serambi dalam ayat sebelumnya. Penyebutan nomina secara eksplisit menghasilkan bahasa Indonesia yang alami tanpa mengubah acuannya.
- source_word: κατέκειτο
  choice: terbaring
  rationale: Bentuk imperfek κατάκειμαι menggambarkan keadaan berbaring yang sedang berlangsung; 'terbaring' ringkas dan wajar dalam narasi.
- source_word: πλῆθος
  choice: sejumlah besar
  rationale: Mengungkapkan banyaknya orang dengan alami dalam bahasa Indonesia dan mempertahankan makna kolektif πλῆθος.
- source_word: τῶν ἀσθενούντων
  choice: orang sakit
  rationale: Dalam konteks ini, partisipel ἀσθενέω menunjuk pada orang yang sakit atau lemah secara jasmani.
- source_word: τυφλῶν
  choice: buta
  rationale: Padanan langsung dan lazim bagi kategori kondisi jasmani yang disebutkan.
- source_word: χωλῶν
  choice: timpang
  rationale: χωλός menunjuk pada orang yang mengalami gangguan berjalan; 'timpang' tepat, ringkas, dan lebih bermartabat daripada beberapa istilah alternatif.
- source_word: ξηρῶν
  choice: anggota tubuhnya mengering
  rationale: ξηρός secara harfiah berarti 'kering' atau 'layu' dan dalam konteks tubuh kemungkinan menunjuk pada anggota tubuh yang mengering atau menyusut. Ungkapan ini mempertahankan citra sumber tanpa langsung menafsirkannya sebagai kelumpuhan.
