  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: id
  text: Dialah pelita yang menyala dan bercahaya, tetapi kalian bersedia bersukacita untuk sementara waktu[a] dalam cahayanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk sesaat.” Ungkapan Yunani ini menunjuk pada waktu yang terbatas, bukan harus satu jam secara harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Dialah
  rationale: Kata ganti penunjuk ini secara tegas menunjuk kepada Yohanes. “Dialah” mempertahankan penekanan tersebut dengan ungkapan Indonesia yang alami.
- source_word: λύχνος
  choice: pelita
  rationale: Kata ini menunjuk pada lampu minyak portabel, bukan cahaya secara abstrak. “Pelita” juga mempertahankan pembedaan antara Yohanes sebagai pembawa terang dan Yesus sebagai terang dalam konteks Injil Yohanes.
- source_word: καιόμενος καὶ φαίνων
  choice: yang menyala dan bercahaya
  rationale: Kedua partisip menggambarkan pelita yang terus menyala serta memancarkan cahaya. Pasangan ini mempertahankan kedua unsur Yunani tanpa menyamakannya.
- source_word: ἠθελήσατε
  choice: kalian mau
  rationale: Bentuk ini menyatakan kehendak atau kesediaan para pendengar. “Kalian mau” alami dalam bahasa Indonesia dan tidak melebihkan nuansanya menjadi keputusan yang teguh atau keinginan yang bertahan lama.
- source_word: ἀγαλλιαθῆναι
  choice: bersukacita
  rationale: Kata kerja ini menyatakan kegembiraan yang kuat. “Bersukacita” bermartabat, mudah dipahami, dan sesuai dengan intensitas makna sumber.
- source_word: πρὸς ὥραν
  choice: untuk sesaat
  rationale: Ungkapan ini berarti selama waktu yang terbatas dan tidak harus menunjuk pada satu jam secara harfiah. “Untuk sesaat” menonjolkan sifat sementara dari tanggapan mereka.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: dalam cahayanya
  rationale: Terjemahan ini mempertahankan metafora berada dalam atau menikmati cahaya yang dipancarkan pelita tersebut, sekaligus mengikuti preposisi sumber secara wajar.
theological_decisions:
- issue: Pembedaan metaforis antara Yohanes dan Yesus dalam gambaran terang
  choice: Yohanes disebut “pelita”, bukan “terang”.
  alternative: Yohanes disebut “terang”.
  rationale: Teks Yunani memakai λύχνος, bukan φῶς. Pilihan “pelita” mempertahankan kedudukan Yohanes sebagai saksi yang memancarkan cahaya tanpa menyamakannya dengan terang utama dalam Injil Yohanes.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menyatakan bahwa ὑμεῖς berbentuk jamak; “tetapi” mempertahankan kontras δέ antara fungsi Yohanes sebagai pelita dan tanggapan para pendengar yang hanya sementara.
