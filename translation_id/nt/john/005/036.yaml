  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: id
  text: Namun, Aku mempunyai kesaksian yang lebih besar daripada kesaksian Yohanes[a]. Sebab, pekerjaan-pekerjaan yang telah Bapa berikan kepada-Ku untuk Kuselesaikan—pekerjaan-pekerjaan itulah yang Kulakukan—bersaksi tentang Aku bahwa Bapa telah mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani secara ringkas berbunyi “lebih besar daripada Yohanes”; dalam konteks ini, yang dibandingkan adalah kesaksian Yohanes.
    reason: Menjelaskan bentuk genitif eliptis dalam teks sumber, yang perlu diperluas dalam bahasa Indonesia agar perbandingannya tidak disalahpahami.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: kesaksian
  rationale: Istilah ini mempertahankan nuansa pembuktian dalam konteks kesaksian mengenai identitas dan pengutusan Yesus. Dalam bahasa Indonesia, “kesaksian” lebih tepat daripada “saksi”, yang biasanya menunjuk kepada orang yang memberi kesaksian.
- source_word: μείζω
  choice: lebih besar
  rationale: Padanan ini mempertahankan bentuk komparatif dan bobot ungkapan Yunani tanpa mempersempitnya menjadi sekadar “lebih penting” atau “lebih kuat”.
- source_word: τοῦ Ἰωάννου
  choice: daripada kesaksian Yohanes
  rationale: Genitif Yunani bersifat eliptis; dalam bahasa Indonesia, pengulangan “kesaksian” diperlukan agar perbandingannya jelas dan alami.
- source_word: τὰ ἔργα
  choice: pekerjaan
  rationale: “Pekerjaan” cukup luas untuk mencakup seluruh kegiatan yang dipercayakan Bapa kepada Yesus dan tidak mempersempit maknanya hanya menjadi mukjizat.
- source_word: δέδωκέν μοι ὁ πατὴρ
  choice: yang telah Bapa berikan kepada-Ku
  rationale: “Telah ... berikan” mencerminkan tindakan pemberian yang sudah terjadi dengan hasil yang tetap berlaku; “Bapa” mempertahankan gelar relasional dalam teks.
- source_word: ἵνα τελειώσω αὐτά
  choice: untuk Kuselesaikan
  rationale: Ungkapan ini menyampaikan tujuan pemberian pekerjaan tersebut dan makna membawa pekerjaan itu sampai tuntas.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: yaitu pekerjaan yang sedang Kulakukan itu
  rationale: Susunan ini menyampaikan penegasan pada pekerjaan yang sama sekaligus aspek kegiatan Yesus yang sedang berlangsung, dengan bahasa Indonesia yang wajar.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: bersaksi tentang Aku
  rationale: 'Padanan ini mempertahankan gambaran yuridis atau pembuktian: pekerjaan Yesus memberikan kesaksian mengenai diri-Nya.'
- source_word: ἀπέσταλκεν
  choice: telah mengutus
  rationale: Bentuk ini mencerminkan tindakan pengutusan yang telah terjadi dan tetap bermakna pada saat Yesus berbicara.
theological_decisions:
- issue: Cakupan pekerjaan yang menjadi kesaksian tentang Yesus
  choice: “Pekerjaan” dibiarkan mencakup seluruh kegiatan yang Bapa berikan kepada Yesus untuk diselesaikan.
  alternative: Menafsirkannya secara khusus sebagai mukjizat-mukjizat saja.
  rationale: ἔργα tidak dibatasi oleh ayat ini hanya pada mukjizat. Terjemahan yang lebih luas mempertahankan ketegangan dan cakupan istilah Yohanes tanpa memasukkan penafsiran yang lebih sempit.
- issue: Sebutan ὁ πατήρ dalam relasinya dengan Yesus
  choice: Bapa
  alternative: Allah atau Bapa-Ku
  rationale: Teks Yunani memakai gelar ὁ πατήρ tanpa kata ganti milik. “Bapa” mempertahankan sebutan relasional tersebut tanpa menambah unsur yang tidak dinyatakan.
- issue: Fungsi kesaksian pekerjaan Yesus
  choice: Pekerjaan itu bersaksi bahwa Bapa telah mengutus Yesus.
  alternative: Pekerjaan itu semata-mata membuktikan kuasa Yesus.
  rationale: Klausa terakhir secara eksplisit menghubungkan kesaksian pekerjaan dengan pengutusan Yesus oleh Bapa; terjemahan mengikuti pernyataan itu tanpa mempersempitnya menjadi bukti kuasa saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Aku”, “Bapa”, dan “-Ku” ditulis dengan huruf kapital sesuai kebiasaan ejaan untuk rujukan ilahi. Pengulangan penuh “pekerjaan-pekerjaan” dihindari karena terasa kaku; penegasan Yunani disampaikan melalui “yaitu ... itu”.
