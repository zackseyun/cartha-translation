  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: id
  text: Orang yang sakit itu menjawab-Nya, “Tuhan, tidak ada seorang pun yang memasukkan saya ke dalam kolam itu ketika airnya bergolak. Ketika saya sedang menuju ke sana, orang lain turun sebelum saya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: orang yang sakit itu
  rationale: Mengungkapkan partisipel substantival secara alami dan mempertahankan identitas tokoh sebagai orang sakit.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini dapat berarti ‘Tuan’ atau ‘Tuhan’; ‘Tuhan’ mempertahankan pilihan lapisan konsultasi serta kemungkinan bobot kristologis dalam konteks Injil Yohanes tanpa menambah penjelasan ke dalam teks.
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: menurunkan saya ke kolam itu
  rationale: Dalam konteks orang sakit yang hendak masuk ke kolam, ‘menurunkan’ lebih wajar daripada arti harfiah dasar ‘melemparkan/memasukkan’ dan sejalan dengan καταβαίνει pada akhir ayat.
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: airnya bergolak
  rationale: Menangkap gambaran air yang digerakkan atau dikacaukan dalam ungkapan Indonesia yang ringkas.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: Sementara saya berusaha menuju ke sana
  rationale: Bentuk kini ‘saya datang/pergi’ dalam konteks keterbatasan fisik menyiratkan proses menuju kolam; ‘berusaha’ membuat maksud situasional jelas tanpa menentukan cara geraknya.
- source_word: ἄλλος πρὸ ἐμοῦ καταβαίνει
  choice: orang lain sudah turun mendahului saya
  rationale: Menyampaikan bahwa orang lain masuk lebih dahulu; ‘sudah’ memberi hubungan temporal yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna sapaan Κύριε
  choice: Tuhan
  alternative: Tuan
  rationale: Kata Yunani itu memang dapat menjadi sapaan hormat biasa maupun sebutan yang lebih tinggi. Terjemahan ‘Tuhan’ mengikuti penggunaan yang lazim dalam narasi Yohanes dan mempertahankan kemungkinan makna kristologis, tanpa menyatakan bahwa si sakit sudah memahami identitas Yesus sepenuhnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina penghormatan ‘-Nya’ dipakai bagi Yesus, sedangkan ‘saya’ menjaga kewajaran tutur langsung. Tidak ada penanda catatan kaki karena tidak ada catatan kaki yang diperlukan.
