    rationale: Mengganti “mengguncangkan / berguncang” dengan “mengaduk / bergolak” memberi hubungan makna yang lebih idiomatis sambil tetap mempertahankan perbedaan antara verba aktif ἐτάρασσεν dan nomina ταραχήν.
