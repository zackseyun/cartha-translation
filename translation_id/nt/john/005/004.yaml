source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: id
  text: Sebab seorang malaikat turun ke kolam itu dari waktu ke waktu dan mengaduk airnya. Sesudah air itu bergolak, orang pertama yang masuk akan sembuh dari penyakit apa pun yang dideritanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini, bersama bagian akhir ayat 3, tidak terdapat dalam papirus Yunani tertua, seperti Papirus 66 dan Papirus 75 dari abad ketiga, maupun dalam naskah utama abad keempat, yaitu Sinaiticus dan Vaticanus. Namun, bagian ini terdapat dalam tradisi mayoritas Bizantin serta sejumlah terjemahan Latin dan Siria awal. Banyak ahli memandangnya sebagai tambahan penyalin pada masa awal untuk menjelaskan mengapa orang-orang sakit berkumpul di kolam itu.
    reason: textual_critical
lexical_decisions:
- source_word: Ἄγγελος
  choice: seorang malaikat
  rationale: Nomina tanpa artikel ini secara alami diterjemahkan sebagai 'seorang malaikat'; tidak perlu menentukan identitasnya.
- source_word: κατὰ καιρὸν
  choice: dari waktu ke waktu
  rationale: Ungkapan ini menunjukkan kejadian yang berlangsung sesekali atau secara berkala, tanpa menyiratkan jadwal atau musim tertentu.
- source_word: κατέβαινεν
  choice: turun
  rationale: Imperfek menggambarkan tindakan yang biasa atau berulang pada masa lampau; dalam bahasa Indonesia, nilai aspektual tersebut disampaikan oleh konteks dan frasa 'dari waktu ke waktu'.
- source_word: ἐτάρασσεν / ταραχήν
  choice: mengguncangkan / berguncang
  rationale: Pilihan ini mempertahankan hubungan leksikal antara tindakan malaikat dan keadaan air serta terdengar alami untuk gerakan air.
- source_word: ὁ ... πρῶτος ἐμβὰς
  choice: orang pertama yang masuk
  rationale: Merujuk pada orang pertama yang masuk ke dalam kolam setelah air berguncang.
- source_word: ὑγιὴς ἐγίνετο
  choice: akan sembuh
  rationale: Imperfek dalam konteks kebiasaan menyatakan hasil yang berulang; 'akan sembuh' secara alami menunjukkan apa yang terjadi setiap kali syarat itu terpenuhi.
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: dari penyakit apa pun yang dideritanya
  rationale: κατέχω dalam bentuk pasif dengan νόσημα bermakna dikuasai atau ditimpa penyakit; 'dideritanya' adalah padanan idiomatis yang jelas dan alami.
theological_decisions:
- issue: Status tekstual Yohanes 5:4
  choice: Ayat diterjemahkan sesuai teks sumber Bizantin yang ditetapkan dan diberi catatan kritik teks.
  alternative: Menghilangkan ayat dari teks utama atau menaruhnya hanya dalam catatan kaki.
  rationale: Sumber yang diminta memuat ayat ini, tetapi bukti naskah awal yang penting tidak memuatnya. Catatan kaki mempertahankan transparansi tanpa mengabaikan teks sumber.
- issue: Sifat pernyataan tentang malaikat dan penyembuhan
  choice: Diterjemahkan sebagai pernyataan naratif sebagaimana terdapat dalam teks Yunani, tanpa tambahan penjelasan doktrinal.
  alternative: Menandainya dalam teks sebagai kepercayaan masyarakat atau menjelaskan mekanisme mukjizatnya.
  rationale: Teks sumber tidak secara eksplisit menyebutnya sekadar kepercayaan masyarakat dan tidak menjelaskan lebih jauh; terjemahan tidak boleh menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Penanda kebiasaan lampau dalam bentuk imperfek Yunani disampaikan terutama melalui 'dari waktu ke waktu' dan hubungan antarklausa, sebab bahasa Indonesia tidak menandai kala secara morfologis. Penanda catatan kaki ditempatkan setelah keseluruhan ayat karena catatan membahas status tekstual seluruh ayat.
