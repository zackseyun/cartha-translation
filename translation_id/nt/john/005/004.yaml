  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: tindakan malaikat yang berulang (κατὰ καιρόν; imperfek κατέβαινεν dan ἐτάρασσεν), orang pertama yang masuk sesudah air terusik, serta kesembuhan dari penyakit apa pun. Namun, “mengguncangkan airnya” kurang tepat dan kurang idiomatis untuk ταράσσω dalam konteks air; verba ini lebih baik dinyatakan sebagai mengaduk atau mengusik air. “Bergolak” menyampaikan ταραχήν secara alami tanpa menambahkan mekanisme penyembuhan.'
