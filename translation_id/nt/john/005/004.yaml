revisions:
- from: Sebab, dari waktu ke waktu, seorang malaikat turun ke kolam itu dan mengguncangkan airnya. Sesudah air itu berguncang, orang pertama yang masuk akan sembuh dari penyakit apa pun yang dideritanya.[a]
  to: Sebab seorang malaikat turun ke kolam itu dari waktu ke waktu dan mengaduk airnya. Sesudah air itu bergolak, orang pertama yang masuk akan sembuh dari penyakit apa pun yang dideritanya.[a]
  rationale: Revisi terbatas pada padanan ταράσσω/ταραχήν demi ketepatan semantis dan kelaziman bahasa Indonesia. Semua unsur makna sumber, termasuk pola tindakan berulang dan cakupan “penyakit apa pun,” dipertahankan. Penanda catatan kaki tetap ditempatkan pada akhir ayat karena catatan tersebut menyangkut status tekstual seluruh ayat.
