translation:
  language: id
  text: 'Namun, Aku tahu tentang kalian: kalian tidak memiliki kasih Allah dalam diri kalian.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “kalian tidak memiliki kasih kepada Allah dalam diri kalian.” Ungkapan Yunani ini juga dapat dipahami sebagai “kasih yang berasal dari Allah” atau “kasih Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan kuat dengan konteks sebelumnya dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ἔγνωκα
  choice: Aku mengenal
  rationale: Bentuk perfek menyatakan pengetahuan yang telah terbentuk dan tetap berlaku; “mengenal” juga mempertahankan nuansa pengenalan terhadap orang, bukan sekadar mengetahui fakta.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina ini jamak; “kalian” menyatakan jumlah tersebut secara jelas dalam bahasa Indonesia modern.
- source_word: ὅτι
  choice: ': kalian'
  rationale: ὅτι memperkenalkan isi dari apa yang Yesus ketahui. Tanda titik dua menyampaikan hubungan itu secara alami tanpa menambah kata yang kaku.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: kasih Allah
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan bahwa genitif menunjuk kepada kasih kepada Allah, kasih yang berasal dari Allah, atau kasih milik Allah.
- source_word: οὐκ ἔχετε
  choice: tidak memiliki
  rationale: Menyatakan keadaan kini secara langsung; “memiliki” sesuai dengan konstruksi objek yang abstrak.
- source_word: ἐν ἑαυτοῖς
  choice: dalam diri kalian
  rationale: Menyampaikan kehadiran batin pada masing-masing anggota kelompok dan lebih alami daripada terjemahan harfiah yang kaku.
theological_decisions:
- issue: Makna genitif dalam τὴν ἀγάπην τοῦ θεοῦ
  choice: kasih Allah
  alternative: kasih kepada Allah; kasih yang berasal dari Allah; kasih yang dimiliki Allah
  rationale: Genitif Yunani tidak dengan sendirinya menetapkan arah atau sumber kasih. Konteks mendukung pengertian kasih kepada Allah, tetapi teks utama mempertahankan ambiguitas asli dan catatan kaki menjelaskan kemungkinan utamanya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperlihatkan bahwa sapaan Yunani berbentuk jamak; kapitalisasi “Aku” mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab bahasa Indonesia.
