  terminology: “Kasih Allah” tepat sebagai padanan yang ringkas dan ambigu bagi τὴν ἀγάπην τοῦ θεοῦ. Catatan kaki perlu memperbaiki “kasih yang dimiliki Allah,” yang kurang jelas dan dapat memberi kesan kepemilikan semata; “kasih Allah” lebih idiomatis sebagai alternatif untuk kasih yang berasal dari atau merupakan kasih Allah.
