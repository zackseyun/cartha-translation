revisions:
- from: Ketika Yesus melihat orang itu terbaring dan mengetahui bahwa ia sudah lama dalam keadaan demikian,[a] Yesus berkata kepadanya, “Apakah kamu ingin menjadi sembuh?”
  to: Ketika Yesus melihat orang itu terbaring dan mengetahui bahwa ia sudah lama dalam keadaan demikian,[a] Yesus berkata kepadanya, “Apakah kamu ingin sembuh?”
  rationale: Revisi terbatas pada penggantian “menjadi sembuh” dengan “sembuh” demi kefasihan bahasa Indonesia modern. Bentuk ini tetap menerjemahkan ὑγιὴς γενέσθαι sebagai pemulihan menuju keadaan sehat, tanpa menambahkan pelaku atau cara penyembuhan. Catatan kaki dan penandanya dipertahankan karena dengan tepat mencatat alternatif rujukan durasi dalam ungkapan Yunani yang eliptis.
