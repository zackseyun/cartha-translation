id: JHN.5.6
reference: John 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: id
  text: Ketika Yesus melihat orang itu terbaring dan mengetahui bahwa ia sudah lama dalam keadaan demikian,[a] Yesus berkata kepadanya, “Apakah kamu ingin sembuh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahwa ia sudah lama berada di situ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: orang itu
  rationale: Demonstrativa ini menunjuk kepada orang sakit tertentu dalam konteks; “orang itu” jelas dan wajar dalam bahasa Indonesia.
- source_word: ἰδὼν
  choice: ketika ... melihat
  rationale: Partisip aoristus ini secara alami dialihkan menjadi anak kalimat waktu, sambil mempertahankan urutan naratif.
- source_word: κατακείμενον
  choice: terbaring
  rationale: Menggambarkan keadaan tubuh orang tersebut yang sedang berbaring; bentuk ini alami tanpa menambahkan lokasi yang tidak dinyatakan dalam kata itu sendiri.
- source_word: γνοὺς
  choice: mengetahui
  rationale: Menyatakan pengetahuan Yesus tanpa menentukan bagaimana pengetahuan itu diperoleh.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: ia sudah lama dalam keadaan demikian
  rationale: Ungkapan Yunani secara harfiah tidak menyebut objek dari “mempunyai”; konteks menunjukkan lamanya keadaan orang itu. Rumusan ini mempertahankan ketidaktersuratan tersebut dengan bahasa Indonesia yang jelas.
- source_word: λέγει αὐτῷ
  choice: Yesus berkata kepadanya
  rationale: Kala kini historis dialihkan menjadi bentuk naratif Indonesia yang alami; nama “Yesus” diulang untuk menghindari rangkaian pronomina yang kabur.
- source_word: Θέλεις
  choice: Apakah kamu ingin
  rationale: Menyampaikan keinginan atau kemauan secara langsung dalam bahasa Indonesia modern.
- source_word: ὑγιὴς γενέσθαι
  choice: menjadi sembuh
  rationale: “Sembuh” sesuai dengan konteks pemulihan kesehatan, sedangkan “menjadi” mempertahankan nuansa masuk ke dalam keadaan baru dari γενέσθαι.
theological_decisions:
- issue: Sifat pengetahuan Yesus dalam γνοὺς
  choice: Menyatakan bahwa Yesus mengetahui tanpa menjelaskan sumber pengetahuan-Nya.
  alternative: Menentukan bahwa Yesus mengetahuinya secara adikodrati atau melalui pengamatan maupun laporan.
  rationale: Teks tidak menerangkan bagaimana Yesus mengetahui hal itu, sehingga terjemahan tidak boleh menetapkan kesimpulan teologis yang melampaui teks.
- issue: Rujukan durasi dalam πολὺν ἤδη χρόνον ἔχει
  choice: Mengaitkannya secara umum dengan keadaan orang tersebut.
  alternative: Mengaitkannya secara khusus dengan lamanya ia berada di tempat itu.
  rationale: Bahasa Yunani tidak menyebut secara eksplisit apakah durasi itu merujuk pada penyakitnya atau keberadaannya di lokasi tersebut; konteks dekat dan ayat 5 mendukung keadaan sakit, tetapi ambiguitas ungkapan patut dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sapaan “kamu” dipakai karena pertanyaan ditujukan kepada satu orang dan agar tetap mudah dipahami; susunan kalimat dijaga bermartabat tanpa menjadi kaku.
