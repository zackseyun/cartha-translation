id: JHN.5.23
reference: John 5:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: id
  text: supaya semua orang menghormati Anak sama seperti mereka menghormati Bapa. Siapa yang tidak menghormati Anak, tidak menghormati Bapa yang mengutus-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil yang dimaksudkan secara alami dalam bahasa Indonesia modern.
- source_word: πάντες
  choice: semua orang
  rationale: Menjadikan subjek jamak tersirat dalam bahasa Yunani jelas dan wajar bagi pembaca Indonesia.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: menghormati
  rationale: Mempertahankan pengulangan verba τιμάω dan makna memberi penghormatan yang semestinya.
- source_word: τὸν υἱὸν
  choice: Anak
  rationale: Dalam konteks ini merupakan gelar bagi Yesus; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk gelar ilahi.
- source_word: καθὼς
  choice: sama seperti
  rationale: Menyampaikan perbandingan kuat dan langsung tanpa melemahkannya menjadi sekadar kemiripan.
- source_word: τὸν πατέρα
  choice: Bapa
  rationale: Merupakan sebutan personal bagi Allah dalam konteks ini; 'Bapa' adalah bentuk Indonesia yang lazim dan bermartabat.
- source_word: ὁ μὴ τιμῶν
  choice: Siapa yang tidak menghormati
  rationale: Mengungkapkan partisipel substantival secara generik dan alami, tanpa membatasi rujukannya pada orang tertentu.
- source_word: τὸν πέμψαντα αὐτόν
  choice: yang mengutus-Nya
  rationale: Klausa relatif secara jelas menerangkan Bapa sebagai pengutus Anak; 'mengutus' sesuai dengan konteks pengutusan personal dan tetap tidak menambahkan gagasan di luar πέμπω.
theological_decisions:
- issue: Kekuatan perbandingan penghormatan kepada Anak dan Bapa
  choice: καθὼς diterjemahkan 'sama seperti' untuk mempertahankan kesejajaran kuat dalam teks.
  alternative: '''seperti'' atau ''sebagaimana'''
  rationale: Pilihan ini mempertahankan bobot kristologis pernyataan Yunani tanpa memasukkan istilah teologis yang tidak terdapat dalam ayat.
- issue: Huruf kapital pada Anak dan Bapa
  choice: Menggunakan 'Anak' dan 'Bapa' sebagai gelar personal dalam konteks ini.
  alternative: 'Menggunakan huruf kecil: ''anak'' dan ''bapa'''
  rationale: Naskah Yunani tidak menentukan kapitalisasi modern, tetapi konteks dengan jelas menunjuk kepada Yesus dan Allah sebagai Bapa; kapitalisasi membantu pembaca mengenali fungsi gelarnya tanpa menambah isi.
- issue: Rujukan pronomina αὐτόν
  choice: Diterjemahkan '-Nya' dengan kapital untuk merujuk kepada Anak.
  alternative: '''-nya'' tanpa kapital'
  rationale: Kapitalisasi pronomina ilahi merupakan konvensi editorial Indonesia. Rujukannya tetap ditentukan oleh tata bahasa Yunani, yakni Anak yang diutus Bapa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'menghormati' dipertahankan demi paralelisme retoris. Frasa 'semua orang' memperjelas πάντες, sedangkan 'Siapa yang' memberi bentuk generik yang alami. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan kepada pembaca.
