  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: id
  text: dan mereka akan keluar—mereka yang telah berbuat baik, untuk kebangkitan untuk hidup, tetapi mereka yang telah berbuat jahat, untuk kebangkitan untuk penghakiman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kebangkitan untuk penghukuman.” Kata Yunani yang digunakan berarti “penghakiman,” yang cakupannya lebih luas; “penghukuman” merupakan penafsiran yang lebih sempit dan dipakai dalam sebagian terjemahan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: akan keluar
  rationale: Dalam konteks orang mati keluar dari makam (ay. 28–29), frasa ini alami dan tepat dalam bahasa Indonesia.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: mereka yang telah berbuat baik
  rationale: Ungkapan ini mempertahankan fungsi substantival τὰ ἀγαθὰ serta merangkum perbuatan mereka sebagai suatu keseluruhan.
- source_word: ἀνάστασιν ζωῆς
  choice: akan bangkit untuk hidup
  rationale: Bentuk ini menyampaikan arah atau hasil kebangkitan secara alami dalam bahasa Indonesia tanpa menambahkan rincian teologis.
- source_word: τὰ φαῦλα πράξαντες
  choice: mereka yang telah berbuat jahat
  rationale: φαῦλα memiliki arti moral yang negatif dalam konteks penghakiman. 'Berbuat jahat' jelas dan alami; perbedaan verba πράσσω dan ποιέω tidak dipaksakan karena sulit dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: ἀνάστασιν κρίσεως
  choice: akan bangkit untuk menghadapi penghakiman
  rationale: Terjemahan ini memakai arti luas κρίσις, yaitu 'penghakiman', dan menghindari penyempitan menjadi 'penghukuman' atau 'kebinasaan'.
- source_word: δὲ
  choice: tetapi
  rationale: Kata ini menandai pertentangan antara kedua kelompok dan hasil kebangkitan mereka.
theological_decisions:
- issue: Apakah κρίσεως diterjemahkan secara luas sebagai 'penghakiman' atau dipersempit menjadi 'penghukuman'.
  choice: penghakiman
  alternative: penghukuman
  rationale: κρίσις pada dasarnya berarti 'penghakiman' dan tidak dengan sendirinya mengharuskan arti yang lebih sempit, yaitu keputusan bersalah atau penghukuman. Pilihan ini mempertahankan ketegangan teologis dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur paralel kedua klausa dipertahankan, sementara ungkapan genitif Yunani dialihkan secara alami dengan 'bangkit untuk'.
