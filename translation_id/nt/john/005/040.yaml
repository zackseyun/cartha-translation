  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: id
  text: Namun, kamu tidak mau datang kepada-Ku supaya kamu memiliki hidup.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan kamu tidak mau datang kepada-Ku supaya kamu memiliki hidup.” Kata penghubung Yunani dapat diterjemahkan secara sederhana sebagai “dan.”
    reason: lexical_alternative
  - marker: b
    text: Dalam Injil Yohanes, “hidup” sering mengandung arti yang lebih penuh, yaitu hidup yang berasal dari Allah—hidup kekal—meskipun kata “kekal” tidak disebutkan di sini.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Dalam konteks ini, καί menghubungkan kalimat dengan nuansa pertentangan terhadap kesaksian Kitab Suci yang disebut sebelumnya. “Namun” menyatakan kontras itu secara wajar, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: οὐ θέλετε
  choice: kamu tidak mau
  rationale: θέλω menyatakan kemauan, keinginan, atau kehendak. “Tidak mau” alami dalam bahasa Indonesia dan mempertahankan unsur kehendak tanpa memperkuatnya menjadi “menolak.”
- source_word: ἐλθεῖν πρός με
  choice: datang kepada-Ku
  rationale: Ungkapan ἐλθεῖν dengan πρός dan akusatif secara idiomatis berarti datang kepada seseorang. Pilihan ini mempertahankan gambaran khas Yohanes dan tidak menafsirkannya langsung sebagai “percaya kepada-Ku.”
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα di sini memperkenalkan tujuan. “Supaya” merupakan ungkapan tujuan yang jelas dan alami dalam bahasa Indonesia modern.
- source_word: ζωὴν
  choice: hidup
  rationale: ζωή berarti “hidup.” Dalam Injil Yohanes kata ini sering menunjuk pada hidup yang berasal dari Allah, tetapi teks ini tidak secara eksplisit memakai kata “kekal.”
- source_word: ἔχητε
  choice: kamu memiliki
  rationale: Bentuk subjungtif kini sesudah ἵνα menyatakan tujuan. Dalam bahasa Indonesia, konstruksi “supaya kamu memiliki” menyampaikan fungsi tersebut secara alami tanpa perlu modal tambahan.
theological_decisions:
- issue: Apakah ζωὴν diterjemahkan sebagai “hidup” atau “hidup kekal”
  choice: hidup
  alternative: hidup kekal
  rationale: Walaupun ζωή sering memiliki kedalaman makna keselamatan dalam Injil Yohanes, αἰώνιος (“kekal”) tidak terdapat dalam ayat ini. Teks utama tidak menambahkan unsur yang tidak dinyatakan, sedangkan resonansi teologisnya dijelaskan dalam catatan kaki.
- issue: Apakah “datang kepada-Ku” ditafsirkan dalam teks utama sebagai percaya
  choice: datang kepada-Ku
  alternative: percaya kepada-Ku; datang kepada-Ku dengan iman
  rationale: Dalam Injil Yohanes, datang kepada Yesus erat kaitannya dengan percaya, tetapi sumber memakai verba konkret “datang.” Mempertahankan ungkapan itu menjaga gambaran dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kamu” dipakai untuk bentuk jamak orang kedua sesuai konteks; bahasa Indonesia tidak menandai kejamakan pada pronomina ini. Kapitalisasi “-Ku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
