id: JHN.5.28
reference: John 5:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: id
  text: Janganlah kamu heran akan hal ini, sebab saatnya akan tiba ketika semua orang yang ada di dalam kubur[a] akan mendengar suara-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: makam. Kata Yunani μνημεῖα dapat merujuk pada tempat-tempat penguburan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Janganlah kamu heran
  rationale: Larangan dengan μή dan imperatif kini diterjemahkan secara wajar dan bermartabat; bentuk jamak tetap tercermin dalam kata ganti 'kamu'.
- source_word: τοῦτο
  choice: akan hal ini
  rationale: Menunjuk kepada pernyataan sebelumnya dan menghasilkan ungkapan Indonesia yang alami bersama 'heran'.
- source_word: ὅτι
  choice: sebab
  rationale: Mengungkapkan hubungan kausal dengan jelas tanpa menambah penafsiran.
- source_word: ἔρχεται ὥρα
  choice: saatnya akan tiba
  rationale: ὥρα dalam konteks ini menunjuk pada waktu yang akan datang. 'Saatnya akan tiba' alami dalam bahasa Indonesia dan tetap mempertahankan bobot khas ungkapan Yohanes.
- source_word: ἐν ᾗ
  choice: ketika
  rationale: Padanan idiomatis bagi konstruksi relatif temporal Yunani, lebih alami daripada 'di dalamnya'.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: semua orang yang ada di dalam kubur
  rationale: Mencerminkan πάντες secara substantival dan mempertahankan gambaran konkret tempat penguburan; 'kubur' dalam bahasa Indonesia dapat berfungsi sebagai nomina kolektif dalam konstruksi ini.
- source_word: ἀκούσουσιν
  choice: akan mendengar
  rationale: Menerjemahkan bentuk indikatif aktif kala mendatang secara langsung.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: suara-Nya
  rationale: φωνή berarti suara dalam konteks ujaran pribadi; genitif sesudah ἀκούω tidak perlu diperluas.
theological_decisions:
- issue: Bahasa kebangkitan yang tersirat ketika orang-orang di dalam kubur mendengar suara Anak
  choice: Mempertahankan gambaran konkret 'di dalam kubur' tanpa menambahkan penjelasan doktrinal ke dalam ayat.
  alternative: Memperjelasnya sebagai 'semua orang mati' atau secara eksplisit menyebut kebangkitan.
  rationale: Teks mengarah kepada kebangkitan orang mati, tetapi terjemahan harus mempertahankan cara ungkap teks dan membiarkan ayat berikutnya mengembangkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Janganlah' memberi nada larangan yang tegas tanpa terasa usang; 'saatnya akan tiba' dipilih demi kelancaran alami sekaligus mempertahankan nuansa temporal khas Injil Yohanes.
