  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: id
  text: Namun, orang yang telah disembuhkan itu tidak tahu siapa Dia, sebab Yesus telah menyingkir[a], sementara ada orang banyak di tempat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai dapat berarti “menyingkir”, “pergi”, atau “menyelinap pergi”; kata ini dapat menyiratkan bahwa Yesus pergi tanpa menarik perhatian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: orang yang telah disembuhkan itu
  rationale: Partisip aoris pasif dengan artikel berfungsi sebagai nomina. Ungkapan ini mempertahankan makna pasif dan tindakan penyembuhan yang mendahului ketidaktahuannya.
- source_word: οὐκ ᾔδει
  choice: tidak tahu
  rationale: Padanan Indonesia yang lugas dan alami untuk οἶδα dalam konteks ini.
- source_word: τίς ἐστιν
  choice: siapa Dia
  rationale: Klausa ini menunjuk kepada Yesus sebagai pribadi. Huruf kapital membantu memperjelas rujukan pronomina dalam bahasa Indonesia tanpa menambahkan gelar.
- source_word: ἐξένευσεν
  choice: telah menyingkir tanpa diketahui
  rationale: ἐκνεύω menyatakan tindakan pergi atau mengundurkan diri secara tidak mencolok. Pilihan ini mempertahankan nuansa bahwa Yesus luput dari perhatian, tanpa menyiratkan secara pasti cara fisik tertentu.
- source_word: ὄχλου ὄντος
  choice: di tengah kerumunan yang ada
  rationale: Genitif absolut dapat menyatakan keadaan yang menyertai dan mungkin juga alasan. Susunan ini mempertahankan ketaksaan tersebut lebih baik daripada menetapkannya hanya sebagai sebab.
- source_word: ἐν τῷ τόπῳ
  choice: di tempat itu
  rationale: Padanan lokatif yang jelas dan alami; demonstratif 'itu' sesuai dengan tempat yang sedang dibicarakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Penanda catatan kaki ditempatkan sesudah kalimat yang memuat ungkapan terkait. Frasa keadaan kerumunan dipertahankan agar tidak secara berlebihan memutuskan apakah kerumunan itu semata-mata alasan atau keadaan yang memungkinkan Yesus menyingkir.
