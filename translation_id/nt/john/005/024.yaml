  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepada kalian: siapa yang mendengar perkataan-Ku dan percaya kepada Dia yang mengutus Aku, ia memiliki hidup kekal dan tidak masuk ke dalam penghakiman[a], melainkan telah berpindah dari kematian ke dalam kehidupan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghukuman.” Kata Yunani κρίσις dapat berarti “penghakiman” secara umum atau, dalam konteks ini, penghakiman yang menghasilkan hukuman.
    reason: lexical_alternative
  - marker: b
    text: 'Kata kerja Yunani berbentuk perfektum menunjukkan perpindahan yang telah selesai dan hasilnya terus berlaku: orang itu “telah berpindah” atau “telah menyeberang” dari kematian ke dalam kehidupan.'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan formula penegasan yang khidmat dan menyampaikan maknanya secara jelas dalam bahasa Indonesia modern.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mencerminkan formula ujaran langsung secara dekat dan tetap alami; bentuk tunggal 'kepadamu' dapat berfungsi kolektif dalam bahasa Indonesia.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: Siapa yang mendengar ... dan percaya
  rationale: Menyampaikan arti umum dari kedua partisipel berartikel tanpa menambahkan penandaan gender.
- source_word: τὸν λόγον μου
  choice: perkataan-Ku
  rationale: Dalam konteks ini λόγος menunjuk pada perkataan atau pesan Yesus; 'perkataan-Ku' alami sekaligus mempertahankan hubungan leksikal dengan ujaran-Nya.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: percaya kepada Dia yang mengutus Aku
  rationale: Mencerminkan πιστεύω dengan datif sebagai percaya atau menaruh kepercayaan kepada seseorang, tanpa memperluasnya secara tidak perlu.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: memiliki hidup kekal
  rationale: Bentuk kini ἔχει menyatakan kepemilikan sekarang, sedangkan 'hidup kekal' merupakan padanan yang jelas dan lazim bagi ζωὴ αἰώνιος.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: tidak masuk ke dalam penghakiman
  rationale: '''Penghakiman'' mempertahankan keluasan makna κρίσις, sedangkan ''masuk ke dalam'' menjaga daya arah εἰς.'
- source_word: μεταβέβηκεν
  choice: telah berpindah
  rationale: Bentuk perfektum menyatakan perpindahan yang sudah terjadi dengan hasil yang tetap berlaku; 'telah berpindah' mengungkapkannya secara alami.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: dari kematian ke dalam kehidupan
  rationale: Mempertahankan kontras tajam dan arah gerak dari kematian menuju ranah kehidupan.
theological_decisions:
- issue: Makna κρίσις dalam konteks keselamatan
  choice: penghakiman
  alternative: penghukuman
  rationale: Konteks dapat menunjuk pada penghakiman yang merugikan, tetapi κρίσις sendiri lebih luas daripada penghukuman. Padanan ini mempertahankan ambiguitas dan ketegangan teks.
- issue: Daya bentuk kini dan perfektum dalam kaitannya dengan keselamatan
  choice: kepemilikan hidup kekal sekarang dan perpindahan yang telah selesai dengan hasil berkelanjutan
  alternative: hidup yang hanya akan dimiliki pada masa depan atau pembebasan yang semata-mata akan terjadi kelak
  rationale: ἔχει berbentuk kini dan μεταβέβηκεν berbentuk perfektum; terjemahan mempertahankan aspek-aspek tersebut tanpa memasukkannya ke dalam suatu sistem denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Pengulangan 'Sesungguhnya' dipertahankan demi penekanan khas ucapan Yesus dalam Yohanes.
