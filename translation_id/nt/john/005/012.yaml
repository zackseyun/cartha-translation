  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: id
  text: Lalu mereka bertanya kepadanya, “Siapa orang yang berkata kepadamu, ‘Angkatlah tikarmu dan berjalanlah’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam teks Yunani, objek setelah “Angkatlah” tidak disebutkan secara eksplisit: “Angkatlah dan berjalanlah.” Objek itu dipahami dari konteks sebelumnya sebagai tikar atau alas tidur orang itu.'
    reason: implicit_object
lexical_decisions:
- source_word: ἠρώτησαν
  choice: mereka bertanya
  rationale: Bentuk aoristus aktif indikatif orang ketiga jamak dari ἐρωτάω. Pilihan ini alami dalam narasi dan tidak menambahkan kesan permusuhan yang tidak dinyatakan secara eksplisit.
- source_word: οὖν
  choice: Lalu
  rationale: Partikel ini menghubungkan pertanyaan tersebut dengan tanggapan dalam ayat sebelumnya. “Lalu” menyampaikan kelanjutan naratif dan hubungan akibat secara wajar dalam bahasa Indonesia.
- source_word: αὐτόν
  choice: kepadanya
  rationale: Pronomina akusatif tunggal maskulin ini merujuk kepada orang yang telah disembuhkan; dengan verba “bertanya”, bentuk Indonesia yang alami adalah “kepadanya”.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Siapakah orang
  rationale: Pertanyaan ini meminta identitas seorang laki-laki tertentu. “Siapakah orang” mempertahankan bentuk langsung dan ragam yang bermartabat tanpa menjadi kaku.
- source_word: ὁ εἰπών σοι
  choice: yang berkata kepadamu
  rationale: Partisip aoristus berartikel ini menerangkan orang tersebut berdasarkan ucapannya. “Berkata kepadamu” mengikuti struktur sumber dan tidak mengubahnya menjadi perintah tidak langsung.
- source_word: Ἆρον
  choice: Angkatlah
  rationale: Imperatif aoristus dari αἴρω berarti mengangkat atau membawa. Teks Yunani tidak menyebutkan objek secara eksplisit karena objeknya dipahami dari konteks sebelumnya; terjemahan utama mempertahankan elipsis itu.
- source_word: καὶ περιπάτει
  choice: dan berjalanlah
  rationale: Imperatif kini dari περιπατέω diterjemahkan secara alami sebagai perintah untuk berjalan. Tidak ditambahkan nuansa “teruslah” karena hal itu dapat memberi penekanan aspek yang berlebihan.
