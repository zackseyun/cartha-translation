id: JHN.5.37
reference: John 5:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: id
  text: Dan Bapa yang mengutus Aku—Dialah yang telah bersaksi tentang Aku.[a] Kamu tidak pernah mendengar suara-Nya ataupun melihat rupa-Nya,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia sendiri telah bersaksi tentang Aku.” Kata penunjuk Yunani ἐκεῖνος memberi penekanan sesudah frasa “Bapa yang mengutus Aku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “penampakan-Nya.” Kata Yunani εἶδος dapat berarti rupa, bentuk yang terlihat, atau penampakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: Bapa yang mengutus Aku
  rationale: Partisipel aoris berartikel πέμψας menerangkan πατήρ dan secara alami dinyatakan sebagai klausa relatif dalam bahasa Indonesia.
- source_word: ἐκεῖνος
  choice: Dialah
  rationale: Kata ganti demonstratif ini menegaskan kembali Bapa sebagai pelaku; “Dialah” mempertahankan penekanan itu secara alami.
- source_word: μεμαρτύρηκεν
  choice: telah bersaksi
  rationale: Bentuk perfektum menunjuk pada kesaksian yang telah diberikan dan tetap berlaku; “telah bersaksi” mempertahankan makna kesaksian dengan bahasa yang wajar.
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: περί dengan genitif berarti mengenai atau tentang.
- source_word: οὔτε ... οὔτε
  choice: tidak ... ataupun
  rationale: Pasangan negasi ini secara alami menyatukan dua pengalaman yang sama-sama disangkal.
- source_word: φωνὴν αὐτοῦ
  choice: suara-Nya
  rationale: φωνή dalam konteks sesuatu yang didengar paling langsung berarti suara.
- source_word: πώποτε ἀκηκόατε
  choice: tidak pernah mendengar
  rationale: πώποτε di bawah negasi berarti pada waktu mana pun; bahasa Indonesia idiomatis mengungkapkannya dengan “tidak pernah.”
- source_word: εἶδος αὐτοῦ
  choice: rupa-Nya
  rationale: εἶδος menunjuk pada bentuk atau penampakan yang terlihat; “rupa” cukup luas dan tidak memaksakan tafsiran tertentu.
- source_word: ἑωράκατε
  choice: melihat
  rationale: Dalam rangkaian dengan “tidak pernah,” aspek pengalaman hingga kini sudah tersampaikan secara alami tanpa bentuk bantu tambahan.
theological_decisions:
- issue: Penekanan ἐκεῖνος yang merujuk kepada Bapa
  choice: Dialah yang telah bersaksi tentang Aku
  alternative: Ia sendiri telah bersaksi tentang Aku
  rationale: “Dialah” mempertahankan daya demonstratif dan penegasan subjek tanpa menambahkan klaim teologis di luar teks.
- issue: Makna εἶδος αὐτοῦ
  choice: rupa-Nya
  alternative: penampakan-Nya
  rationale: “Rupa” mempertahankan keluasan makna antara bentuk yang terlihat dan penampilan, sehingga ketegangan mengenai cara Allah dapat dipersepsi tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Huruf kapital pada Aku dan -Nya mengikuti kebiasaan penerjemahan Alkitab Indonesia untuk rujukan ilahi. Tanda pisah mempertajam penegasan “Dialah”; tanda koma akhir dipertahankan karena ayat berlanjut ke kalimat berikutnya.
