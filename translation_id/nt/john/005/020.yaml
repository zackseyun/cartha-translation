  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: id
  text: Sebab Bapa mengasihi Anak dan menunjukkan kepada-Nya segala sesuatu yang Ia sendiri kerjakan; Ia juga akan menunjukkan kepada-Nya pekerjaan-pekerjaan yang lebih besar daripada ini, supaya kamu menjadi takjub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sehingga kamu akan menjadi takjub.” Kata Yunani yang diterjemahkan “supaya” dapat menyatakan tujuan dan, dalam konteks ini, juga dapat menyiratkan hasil berupa ketakjuban para pendengar Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: mengasihi
  rationale: Menyatakan kasih pribadi Bapa kepada Anak secara alami dan bermartabat tanpa menganggap φιλέω lebih lemah daripada ἀγαπάω.
- source_word: δείκνυσιν ... δείξει
  choice: menunjukkan ... akan menunjukkan
  rationale: Mempertahankan pengulangan verba Yunani yang sama serta peralihan dari kala kini ke kala mendatang.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Menyampaikan cakupan menyeluruh dengan ungkapan Indonesia yang wajar.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: yang dikerjakan-Nya sendiri
  rationale: Kata 'sendiri' mempertahankan penekanan αὐτός pada Bapa; bentuk ini juga menyampaikan tindakan Bapa yang berlangsung tanpa membuat kalimat kaku.
- source_word: μείζονα τούτων ... ἔργα
  choice: pekerjaan-pekerjaan yang lebih besar daripada semua ini
  rationale: '''Pekerjaan'' mempertahankan istilah penting dalam Injil Yohanes, sedangkan bentuk perbandingan mengikuti konstruksi Yunani secara alami.'
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: supaya kamu menjadi takjub
  rationale: '''Supaya'' mempertahankan kemungkinan nuansa tujuan, sedangkan ''menjadi takjub'' merupakan ungkapan Indonesia modern dan jelas; ''kamu'' mewakili orang kedua jamak yang ditujukan kepada para pendengar.'
theological_decisions:
- issue: Sifat kasih Bapa kepada Anak dalam φιλεῖ
  choice: Diterjemahkan 'mengasihi' tanpa menunjukkan kasih yang lebih rendah atau semata-mata manusiawi.
  alternative: '''menyayangi'' atau ''menaruh kasih sayang kepada'''
  rationale: Dalam Yohanes, φιλέω dapat bertumpang tindih dengan ἀγαπάω. Terjemahan umum ini mempertahankan kedekatan relasi Bapa dan Anak tanpa memasukkan pembedaan teologis yang tidak dituntut teks.
- issue: Daya ἵνα ὑμεῖς θαυμάζητε
  choice: Diterjemahkan sebagai klausa 'supaya kamu menjadi takjub'.
  alternative: '''sehingga kamu akan menjadi takjub'''
  rationale: ἵνα dengan subjungtif dapat menyatakan tujuan dan dalam konteks ini juga dapat menyiratkan hasil. Teks utama tidak memaksakan daya prediktif yang lebih kuat; kemungkinan hasil dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia dan membantu memperjelas rujukan tanpa mengubah isi. Bentuk ulang 'pekerjaan-pekerjaan' dipertahankan untuk menandai jamak ἔργα.
