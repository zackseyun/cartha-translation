id: JHN.5.21
reference: John 5:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: id
  text: Sebab, sama seperti Bapa membangkitkan orang-orang mati dan menghidupkan mereka,[a] demikian juga Anak menghidupkan orang-orang yang Ia kehendaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi mereka hidup”; kata Yunani yang sama muncul lagi dalam kalimat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang Ia inginkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sebab, sama seperti
  rationale: Mempertahankan fungsi penjelas γάρ dan membuka perbandingan ὥσπερ secara wajar dalam bahasa Indonesia.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Dalam konteks ini merupakan sebutan bagi Allah dan membentuk pasangan eksplisit dengan 'Anak'.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: membangkitkan orang-orang mati
  rationale: '''Membangkitkan'' merupakan padanan yang lazim dan tepat dalam konteks kebangkitan; bentuk jamak substantival diterjemahkan secara eksplisit sebagai orang-orang mati.'
- source_word: ζῳοποιεῖ
  choice: menghidupkan mereka / menghidupkan
  rationale: '''Menghidupkan'' menyampaikan tindakan menjadikan hidup. Pada kemunculan pertama, ''mereka'' merujuk secara alami kepada orang-orang mati; pada kemunculan kedua, objeknya dinyatakan oleh klausa relatif.'
- source_word: οὕτως καὶ
  choice: demikian juga
  rationale: Menjaga kesejajaran langsung antara tindakan Bapa dan tindakan Anak.
- source_word: ὁ υἱὸς
  choice: Anak
  rationale: Merupakan sebutan kristologis dalam konteks dan sejajar dengan 'Bapa'.
- source_word: οὓς θέλει
  choice: orang-orang yang Ia kehendaki
  rationale: Menjaga bentuk jamak οὓς serta daya kehendak pada θέλει dengan ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Kesejajaran Bapa dan Anak dalam menghidupkan
  choice: Mempertahankan pernyataan bahwa Anak menghidupkan sebagaimana Bapa membangkitkan dan menghidupkan.
  alternative: Melonggarkan perbandingan sehingga tindakan Anak terdengar lebih rendah atau hanya bersifat perantara.
  rationale: Susunan Yunani membuat kesejajaran tindakan Bapa dan Anak secara tegas; terjemahan tidak menambah penjelasan ontologis, tetapi juga tidak melemahkan daya kristologis teks.
- issue: Kehendak Anak dalam οὓς θέλει
  choice: orang-orang yang Ia kehendaki
  alternative: orang-orang yang Ia inginkan; siapa saja yang Ia mau
  rationale: '''Kehendaki'' mempertahankan unsur volisi dan wibawa tindakan Anak tanpa mempersempit maknanya menjadi keputusan teologis tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'menghidupkan' dipertahankan untuk mencerminkan pengulangan ζῳοποιεῖ dan menonjolkan kesejajaran Bapa–Anak. Huruf kapital pada 'Bapa', 'Anak', dan 'Ia' mengikuti penggunaannya sebagai sebutan serta rujukan ilahi dalam konteks.
