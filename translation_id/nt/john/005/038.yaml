  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: id
  text: Dan kalian tidak memiliki firman-Nya yang tinggal dalam diri kalian[a], sebab kalian tidak percaya kepada Dia yang diutus-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, yang tetap ada dalam diri kalian.
    reason: Alternatif ini menampilkan nuansa keberlanjutan dalam μένοντα; “tinggal” mempertahankan kosakata khas Yohanes, sedangkan “tetap ada” membuat unsur duratifnya lebih eksplisit.
lexical_decisions:
- source_word: λόγον
  choice: firman
  rationale: Dalam konteks ini λόγος menunjuk pada firman atau penyataan Allah. “Firman” alami dalam bahasa Indonesia, mempertahankan diksi khas Yohanes, dan tidak mempersempit maknanya menjadi sekadar perkataan biasa.
- source_word: ἔχετε ... μένοντα
  choice: tidak tinggal di dalam diri kalian
  rationale: Konstruksi ini secara harfiah menyatakan bahwa mereka tidak mempunyai firman-Nya sebagai sesuatu yang terus tinggal dalam diri mereka. Bentuk Indonesia ini mempertahankan daya duratif μένω tanpa menjadi kaku.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” menyampaikan hubungan kausal itu dengan jelas dan bermartabat.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: Dia yang diutus-Nya
  rationale: Ungkapan ini menunjuk kepada Yesus sebagai pribadi yang diutus oleh Bapa. Bentuk pasif dengan enklitik “-Nya” alami dalam bahasa Indonesia dan mempertahankan relasi pengutusan.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: kalian tidak percaya kepada Dia
  rationale: πιστεύω dengan objek datif paling langsung diterjemahkan “percaya kepada”. “Dia” mempertahankan rujukan personal kepada pribadi yang diutus, sedangkan “kalian” menandai bentuk jamak ὑμεῖς.
theological_decisions:
- issue: Hubungan antara firman Allah yang tinggal dalam diri para pendengar dan ketidakpercayaan mereka kepada pribadi yang diutus-Nya
  choice: 'Terjemahan mempertahankan alasan yang dinyatakan teks: firman-Nya tidak tinggal dalam diri mereka sebab mereka tidak percaya kepada Dia yang diutus-Nya.'
  alternative: Ayat ini dapat dipahami secara lebih khusus sebagai kegagalan menyimpan atau menaati Kitab Suci dalam batin, bukan sebagai pernyataan teknis tentang kelahiran baru atau kediaman ilahi.
  rationale: Bahasa terjemahan mempertahankan hubungan kausal dan ketegangan teologis dalam teks tanpa memasukkan doktrin denominasi tertentu mengenai kelahiran baru, penerangan, atau ketekunan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan bahwa ὑμεῖς berbentuk jamak; “firman-Nya” mempertahankan diksi Yohanes dan rujukan kepada Allah. Kapitalisasi “Dia” dan “-Nya” membantu memperjelas rujukan ilahi tanpa menambahkan tafsiran ke dalam isi ayat.
