  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: id
  text: Kalian telah mengutus utusan kepada Yohanes, dan ia telah bersaksi tentang kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah memberikan kesaksian tentang kebenaran.”
    reason: Alternatif idiomatis untuk menerjemahkan verba Yunani yang menyatakan pemberian kesaksian.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kalian
  rationale: Kata ganti ini berbentuk jamak dan menunjuk kepada para lawan bicara Yesus. “Kalian” menyatakan jumlah jamak dengan jelas dalam bahasa Indonesia modern tanpa melebihkan penekanan kata ganti Yunani.
- source_word: ἀπεστάλκατε
  choice: telah mengutus orang
  rationale: Bentuk perfektum menunjukkan tindakan pengutusan yang sudah terjadi dan tetap relevan bagi pembicaraan ini. Karena objek orang yang diutus tersirat dalam bahasa Yunani, “orang” ditambahkan agar konstruksinya alami dan jelas dalam bahasa Indonesia.
- source_word: πρὸς Ἰωάννην
  choice: kepada Yohanes
  rationale: πρός dengan objek personal menyatakan arah atau tujuan pengutusan. Teks hanya menyebut “Yohanes”, sehingga gelar “Pembaptis” tidak ditambahkan.
- source_word: μεμαρτύρηκε
  choice: telah bersaksi
  rationale: Bentuk perfektum menggambarkan kesaksian yang telah diberikan dan masih relevan. “Bersaksi” mempertahankan nuansa kesaksian atau pembuktian serta terdengar wajar dalam bahasa Indonesia.
- source_word: τῇ ἀληθείᾳ
  choice: tentang kebenaran
  rationale: Datif sesudah μαρτυρέω menyatakan hal yang disaksikan. “Tentang kebenaran” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan muatan khas istilah “kebenaran” dalam Injil Yohanes.
theological_decisions:
- issue: Pemakaian khas Yohanes atas frasa “kebenaran”
  choice: tentang kebenaran
  alternative: tentang apa yang benar
  rationale: Pilihan “kebenaran” mempertahankan nomina berartikel dalam bahasa Yunani dan kemungkinan bobot teologisnya, tanpa menentukan secara berlebihan apa tepatnya yang dimaksud dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak; “ia” mempertahankan rujukan kepada Yohanes tanpa menambahkan gelar yang tidak terdapat dalam ayat.
