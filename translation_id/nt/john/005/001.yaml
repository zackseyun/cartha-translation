id: JHN.5.1
reference: John 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: id
  text: Sesudah itu, ada suatu hari raya[a] orang Yahudi,[b] dan Yesus pergi ke Yerusalem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perayaan.”
    reason: lexical_alternative
  - marker: b
    text: Dalam beberapa konteks lain di Injil Yohanes, istilah Yunani yang sama juga dapat berarti “orang Yudea”; di sini yang dimaksud ialah orang Yahudi sehubungan dengan salah satu hari raya mereka.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “naik ke Yerusalem.” Ungkapan ini lazim dipakai untuk perjalanan menuju Yerusalem.
    reason: translation_clarity
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini merupakan padanan Indonesia yang alami bagi frasa peralihan naratif tersebut. Bentuk tunggal idiomatis “itu” tetap dapat merujuk pada rangkaian peristiwa sebelumnya tanpa menghapus fungsi penghubungnya.
- source_word: ἦν
  choice: ada
  rationale: Bentuk “ada” memperkenalkan berlangsungnya hari raya secara alami dalam bahasa Indonesia dan mencerminkan fungsi eksistensial bentuk imperfek εἰμί.
- source_word: ἑορτὴ
  choice: hari raya
  rationale: Dalam konteks ibadah Yahudi, “hari raya” lebih alami dan tepat daripada “pesta,” yang dalam bahasa Indonesia modern dapat terutama menyiratkan acara sosial.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Genitif ini menunjukkan bahwa hari raya tersebut merupakan perayaan yang dijalankan oleh bangsa Yahudi. Dalam konteks ini, rujukannya bukan khusus penduduk Yudea.
- source_word: ἀνέβη
  choice: pergi ke
  rationale: Untuk perjalanan menuju Yerusalem, “pergi ke” adalah ungkapan Indonesia yang paling alami. Nuansa harfiah “naik” dipertahankan dalam catatan kaki karena kata Yunani juga mencerminkan bahasa perjalanan atau ziarah menuju Yerusalem.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna Ἰουδαίων dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Walaupun Ἰουδαῖοι dalam beberapa konteks Yohanes dapat berarti “orang Yudea,” di sini kata itu menerangkan suatu hari raya keagamaan dan paling wajar menunjuk kepada orang Yahudi secara umum. Catatan kaki mengakui kemungkinan leksikal lain tanpa menerapkannya secara tidak tepat pada ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Hari raya” mempertahankan konteks keagamaan; struktur kalimat tetap dekat dengan urutan Yunani tanpa terasa kaku.
