  text: I do not receive glory from men[b][a],
translation:
  language: id
  text: Aku tidak menerima kemuliaan dari manusia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehormatan” atau “pujian” untuk “kemuliaan.”
    reason: lexical_alternative
  - marker: b
    text: Yunani “dari manusia”; istilah ini juga dapat berarti “dari orang-orang” atau “dari umat manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: kemuliaan
  rationale: Kata δόξα dalam konteks ini dapat menunjuk pada kehormatan, pujian, atau penghargaan yang diberikan orang lain. “Kemuliaan” mempertahankan kaitan leksikal dengan tema kemuliaan dalam Injil Yohanes, sedangkan alternatif kontekstual dicatat dalam catatan kaki.
- source_word: παρὰ ἀνθρώπων
  choice: dari manusia
  rationale: Konstruksi παρά dengan bentuk genitif menyatakan sumber. Bentuk jamak ἀνθρώπων bersifat generik dan dalam bahasa Indonesia wajar diterjemahkan “manusia,” yakni manusia sebagai sumber kemuliaan itu.
- source_word: οὐ λαμβάνω
  choice: Aku tidak menerima
  rationale: λαμβάνω secara langsung berarti “menerima” atau “mengambil.” “Tidak menerima” mempertahankan bentuk pernyataan Yunani tanpa menambahkan gagasan “mencari” yang hanya tersirat dari konteks.
theological_decisions:
- issue: Sifat pernyataan Yesus tentang pengakuan manusia
  choice: Teks diterjemahkan sebagai penyangkalan bahwa Yesus menerima kemuliaan yang bersumber dari manusia, tanpa perluasan interpretatif.
  alternative: “Aku tidak mencari kemuliaan dari manusia” atau pemahaman mutlak bahwa Yesus tidak pernah menerima penghormatan manusia dalam arti apa pun.
  rationale: Konteks menunjukkan bahwa misi dan jati diri Yesus tidak bergantung pada pengakuan manusia. Namun, kata Yunani yang digunakan adalah “menerima,” bukan “mencari”; karena itu, ketegangan makna dipertahankan dalam teks utama.
translation_notes:
  register: Menggunakan ragam Indonesia baku, alami, dan bermartabat. Pronomina “Aku” mengikuti tuturan langsung Yesus. Urutan penanda catatan kaki dibuat [a][b] agar berurutan dan setiap penanda muncul dalam teks utama.
