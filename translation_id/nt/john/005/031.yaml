  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: id
  text: Jika Aku bersaksi tentang diri-Ku sendiri, kesaksian-Ku tidak benar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesaksian-Ku tidak sah,” sesuai dengan konteks hukum mengenai kesaksian seorang saksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Jika
  rationale: Menandai klausa bersyarat secara langsung tanpa menambahkan nuansa berulang.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Yunani dipertahankan untuk membawa penekanan ringan pada Yesus sebagai subjek.
- source_word: μαρτυρῶ
  choice: bersaksi
  rationale: Padanan Indonesia yang alami dan tetap mempertahankan nuansa kesaksian, termasuk latar pembuktian atau hukum.
- source_word: περὶ ἐμαυτοῦ
  choice: tentang diri-Ku sendiri
  rationale: Menyampaikan arti langsung περί dengan genitif, yaitu tentang atau mengenai, tanpa mempersempitnya menjadi 'demi kepentingan-Ku sendiri'.
- source_word: ἡ μαρτυρία μου
  choice: kesaksian-Ku
  rationale: Mempertahankan hubungan kata dengan 'bersaksi' dan cocok dengan konteks kesaksian.
- source_word: οὐκ ἔστιν ἀληθής
  choice: tidak benar
  rationale: Merupakan padanan langsung bagi ἀληθής dan mempertahankan ketegangan dengan Yohanes 8:14, tanpa diam-diam membatasinya pada keabsahan hukum.
theological_decisions:
- issue: Makna pernyataan Yesus bahwa kesaksian-Nya 'tidak benar'
  choice: tidak benar
  alternative: tidak sah
  rationale: Teks Yunani memakai ἀληθής, yang secara langsung berarti 'benar', meskipun dalam konteks kesaksian dapat pula menunjuk pada kesaksian yang dianggap sah atau berlaku. Teks utama mempertahankan ketegangan teologis dan catatan kaki menyajikan kemungkinan nuansa hukumnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pada pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerjemahan Alkitab bahasa Indonesia.
