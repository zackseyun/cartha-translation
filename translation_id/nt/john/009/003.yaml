  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: id
  text: Yesus menjawab, “Bukan orang ini yang berdosa, dan bukan pula orang tuanya, tetapi hal ini terjadi supaya karya-karya Allah dinyatakan dalam dirinya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui dirinya.” Secara harfiah, bahasa Yunani berbunyi “dalam dirinya,” yang dapat menunjuk kepada orang itu sebagai tempat atau sarana karya-karya Allah dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: Jawab Yesus
  rationale: Bentuk naratif yang wajar dan ringkas dalam bahasa Indonesia, serta mempertahankan fungsi ujaran sebagai jawaban.
- source_word: Οὔτε ... οὔτε
  choice: Bukan ... dan bukan pula
  rationale: Menyampaikan penyangkalan korelatif terhadap kedua kemungkinan secara alami dalam bahasa Indonesia.
- source_word: οὗτος
  choice: orang ini
  rationale: Menunjuk secara jelas kepada laki-laki yang sedang dibicarakan tanpa menambahkan informasi baru.
- source_word: ἥμαρτεν
  choice: berbuat dosa
  rationale: Padanan langsung dan lazim untuk bentuk aoris ἁμαρτάνω.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: orang tuanya
  rationale: Padanan Indonesia yang alami dan tepat untuk kedua orang tua laki-laki itu.
- source_word: ἀλλ’ ἵνα
  choice: melainkan supaya
  rationale: Mempertahankan konstruksi eliptis dan nuansa tujuan dalam bahasa Yunani tanpa menyisipkan klausa seperti 'hal ini terjadi' yang tidak tertulis eksplisit.
- source_word: φανερωθῇ
  choice: dinyatakan
  rationale: Mempertahankan bentuk pasif dan gagasan bahwa sesuatu dibuat nyata atau tampak.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: pekerjaan-pekerjaan Allah
  rationale: Mempertahankan bentuk jamak dan diksi khas Yohanes secara transparan.
- source_word: ἐν αὐτῷ
  choice: dalam dirinya
  rationale: Merupakan padanan paling langsung bagi ἐν αὐτῷ dan tidak menutup kemungkinan nuansa sarana.
theological_decisions:
- issue: Cakupan penyangkalan hubungan antara dosa dan kebutaan
  choice: Penyangkalan dibatasi pada orang ini dan orang tuanya dalam kasus yang sedang dibahas.
  alternative: Memparafrasakan ayat sebagai pernyataan universal bahwa penderitaan tidak pernah berkaitan dengan dosa.
  rationale: Teks menjawab dua kemungkinan khusus yang diajukan dalam konteks dan tidak merumuskan kaidah universal mengenai semua penderitaan.
- issue: Apakah ἵνα menyatakan tujuan atau hasil
  choice: Menggunakan bahasa tujuan, 'supaya'.
  alternative: Mengalihkannya sebagai hasil semata, atau mengubah tanda baca untuk menghindari nuansa tujuan.
  rationale: ἵνα dengan bentuk subjungtif paling langsung menyatakan tujuan di sini; ketegangan teologisnya dipertahankan tanpa menambahkan pernyataan bahwa Allah menyebabkan kebutaan.
- issue: Elipsis sesudah ἀλλ’ sebelum ἵνα
  choice: Mempertahankan bentuk ringkas 'melainkan supaya' dalam teks utama.
  alternative: Menambahkan 'hal ini terjadi' atau klausa tersirat lainnya.
  rationale: Sumber Yunani tidak memuat klausa tersebut secara eksplisit. Bahasa Indonesia masih dapat mempertahankan elipsis itu dengan cukup alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat cukup dekat dengan sumber Yunani, tetapi tetap dapat dipahami pembaca umum. Elipsis Yunani dipertahankan dan dijelaskan hanya sejauh diperlukan; tidak ada klausa sebab-akibat tambahan yang dimasukkan.
