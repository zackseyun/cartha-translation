  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Di mana orang itu[a]?” Ia berkata, “Aku tidak tahu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di mana dia?” Teks Yunani memakai kata penunjuk yang secara harfiah berarti “orang itu” atau “yang itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπαν
  choice: Mereka berkata
  rationale: Καί berfungsi sebagai penghubung naratif sederhana; dalam bahasa Indonesia modern, tidak perlu selalu dinyatakan pada awal kalimat. Εἶπαν diterjemahkan secara leksikal sebagai “berkata,” tanpa memperjelasnya menjadi “bertanya” meskipun ujarannya berupa pertanyaan.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Dativus ini menunjuk kepada orang yang telah disembuhkan dan secara wajar diterjemahkan sebagai objek tak langsung.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Di mana orang itu
  rationale: Ποῦ ἐστιν menyatakan pertanyaan tentang lokasi. Pronomina demonstratif substantival ἐκεῖνος dipertahankan dengan ungkapan alami “orang itu,” yang membawa nuansa penunjukan atau jarak.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis Yohanes dialihkan dengan bentuk naratif Indonesia yang alami. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga “berkata” tidak menghapus kontras kala secara gramatikal.
- source_word: Οὐκ οἶδα
  choice: Aku tidak tahu
  rationale: Terjemahan langsung dan alami yang mempertahankan jawaban singkat orang yang telah disembuhkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” dipakai dalam dialog sebagai padanan orang pertama tunggal yang alami tanpa menjadi terlalu resmi. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
