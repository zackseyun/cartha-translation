id: JHN.9.35
reference: John 9:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: id
  text: Yesus mendengar bahwa mereka telah mengusir orang itu. Ketika Yesus menemukannya, Ia berkata, “Apakah kamu percaya kepada Anak Manusia?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “Anak Allah” sebagai ganti “Anak Manusia.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: telah mengusir orang itu
  rationale: Gabungan ἐκβάλλω dan ἔξω menegaskan tindakan mengeluarkan atau mengusir. ‘Mengusir’ menyampaikan daya ungkap dan pengucilan sosial dalam konteks ini secara alami dalam bahasa Indonesia.
- source_word: εὑρὼν αὐτόν
  choice: ketika Yesus menemukannya
  rationale: Partisip aoris ini paling wajar dipahami secara temporal. Subjek ‘Yesus’ diulangi agar rujukan pronomina tidak kabur dalam bahasa Indonesia.
- source_word: Σὺ πιστεύεις
  choice: apakah kamu percaya
  rationale: πιστεύω di sini menyatakan iman atau kepercayaan kepada pribadi. Bentuk pertanyaan langsung dengan ‘kamu’ mempertahankan sapaan personal dan penekanan wajar dari Σὺ.
- source_word: εἰς
  choice: kepada
  rationale: Sesudah πιστεύω, εἰς menunjuk pada kepercayaan yang diarahkan kepada seseorang; ‘percaya kepada’ merupakan padanan Indonesia yang alami dan tepat.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan ini mempertahankan gelar yang sudah dikenal, pola pemakaian dalam Injil Yohanes, dan gema antarteksnya tanpa menafsirkannya lebih jauh.
theological_decisions:
- issue: Varian gelar kristologis dalam pertanyaan Yesus
  choice: Anak Manusia
  alternative: Anak Allah
  rationale: Teks utama SBLGNT berbunyi ἀνθρώπου (‘manusia’), sehingga ‘Anak Manusia’ dipakai dalam teks utama. Varian ‘Anak Allah’ penting secara tekstual dan historis, sehingga dicatat dalam catatan kaki tanpa menggantikan bacaan teks utama.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Orang itu’ dipakai untuk memperjelas rujukan αὐτόν, sedangkan ‘Ia’ mempertahankan gaya naratif yang hormat. Penanda catatan kaki ditempatkan tepat setelah pertanyaan yang mengandung varian tekstual.
