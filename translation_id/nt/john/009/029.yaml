  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: id
  text: Kami tahu bahwa Allah telah berfirman kepada Musa. Namun, tentang orang ini, kami tidak tahu dari mana asalnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari mana ia datang.” Dalam Injil Yohanes, pertanyaan tentang asal Yesus dapat mengandung makna biasa sekaligus makna teologis yang lebih dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Kami
  rationale: Kata ganti yang dinyatakan secara eksplisit menegaskan dan mempertentangkan para pembicara dengan pandangan orang yang telah disembuhkan; “kami” menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: οἴδαμεν
  choice: tahu
  rationale: Kata ini menyatakan pengetahuan atau kepastian. “Tahu” merupakan padanan langsung dan alami serta dipakai secara konsisten pada kedua kemunculannya.
- source_word: Μωϋσεῖ
  choice: Musa
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: λελάληκεν
  choice: telah berfirman
  rationale: Bentuk perfektum menggambarkan firman Allah kepada Musa sebagai kenyataan yang telah terjadi dan tetap berwibawa. “Berfirman” sesuai untuk tindakan Allah berbicara dalam ragam Alkitab Indonesia yang bermartabat.
- source_word: τοῦτον δὲ
  choice: Namun, tentang orang ini
  rationale: δέ menyatakan pertentangan, sedangkan τοῦτον mengalihkan pokok pembicaraan kepada Yesus dengan nada menjaga jarak. Susunan ini alami dan mempertahankan kontras tersebut.
- source_word: πόθεν ἐστίν
  choice: dari mana asalnya
  rationale: Ungkapan ini menanyakan sumber atau asal. Pilihan ini alami dalam bahasa Indonesia dan tetap terbuka terhadap makna asal geografis maupun makna yang lebih dalam mengenai asal dan wewenang Yesus.
theological_decisions:
- issue: Makna asal Yesus dalam πόθεν ἐστίν
  choice: dari mana asalnya
  alternative: dari mana ia datang
  rationale: Injil Yohanes kerap memberi pertanyaan tentang asal Yesus makna berlapis. Terjemahan ini tidak menentukan apakah para pembicara hanya memaksudkan asal geografis atau, tanpa mereka sadari, menyentuh asal dan wewenang ilahi Yesus; ironi naratif dan ketegangan teologisnya tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” mempertahankan ragam yang lazim bagi perkataan Allah tanpa memperluas isi teks. Penanda catatan kaki ditempatkan pada frasa tentang asal Yesus karena catatan tersebut menjelaskan πόθεν ἐστίν.
