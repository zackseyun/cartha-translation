  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: id
  text: Dan ketika Yesus sedang lewat[a], ia melihat seorang laki-laki yang buta sejak lahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sambil lewat”; partisipel Yunani menggambarkan Yesus sedang dalam perjalanan ketika ia melihat laki-laki itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ketika
  rationale: Kata penghubung Καὶ bersama partisipel παράγων secara alami diwujudkan sebagai klausa waktu dalam bahasa Indonesia. Hubungan naratif tetap terpelihara tanpa memakai pembuka kaku 'Dan ketika'.
- source_word: παράγων
  choice: sedang lewat
  rationale: Partisipel kini aktif menggambarkan tindakan yang sedang berlangsung dan bersamaan dengan εἶδεν; 'sedang lewat' alami dan mempertahankan aspek latar tersebut.
- source_word: εἶδεν
  choice: ia melihat
  rationale: Bentuk aoris indikatif dari ὁράω secara langsung berarti 'melihat'; 'memperhatikan' akan menambahkan nuansa yang tidak dituntut teks.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Walaupun ἄνθρωπος dapat berarti manusia atau orang, konteks selanjutnya menunjukkan individu ini laki-laki. Pilihan ini tepat gender dan alami dalam bahasa Indonesia.
- source_word: τυφλὸν
  choice: yang buta
  rationale: Adjektiva yang menerangkan ἄνθρωπον disampaikan dengan klausa relatif agar susunan bahasa Indonesia alami.
- source_word: ἐκ γενετῆς
  choice: sejak lahir
  rationale: Ungkapan ini menyatakan kebutaan yang telah ada mulai dari kelahiran; 'sejak lahir' merupakan padanan Indonesia yang ringkas dan idiomatis.
theological_decisions:
- issue: Penyebutan gender pada ἄνθρωπον
  choice: seorang laki-laki
  alternative: seorang
  rationale: Istilah Yunani dapat bersifat umum, tetapi dalam narasi ini mengacu kepada individu tertentu yang kemudian dikenali sebagai laki-laki. Terjemahan tidak menetralkan gender yang didukung konteks.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Nama 'Yesus' dinyatakan untuk memperjelas subjek tersirat dalam bahasa Yunani sesuai konteks dekat; pronomina 'ia' dipakai dengan huruf kecil menurut kaidah umum dan tanpa memasukkan kekhasan denominasi.
