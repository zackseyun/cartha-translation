base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: id
  text: Ada yang berkata, “Dialah orangnya.” Yang lain berkata, “Bukan, tetapi ia mirip dengan orang itu.” Orang itu terus berkata, “Akulah orangnya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “Aku adalah.” Di sini maksudnya adalah pengenalan diri biasa: orang itu mengatakan bahwa dialah orang yang sedang mereka bicarakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: Ada yang … Yang lain
  rationale: Mengungkapkan dua kelompok yang berlawanan secara alami dalam bahasa Indonesia tanpa mengubah acuan jamaknya.
- source_word: ἔλεγον
  choice: berkata
  rationale: Dalam konteks perdebatan yang sedang berlangsung, bentuk imperfek tercermin melalui susunan dialog; 'berkata' lebih alami daripada 'sedang berkata' untuk ujaran langsung ini.
- source_word: Οὗτός ἐστιν
  choice: Dialah orangnya
  rationale: Menyampaikan identifikasi langsung secara idiomatis tanpa menambahkan identitas baru di luar konteks.
- source_word: Οὐχί, ἀλλὰ
  choice: Bukan, tetapi
  rationale: Mempertahankan penyangkalan tegas dan kontras yang dinyatakan teks Yunani.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: ia mirip dengan orang itu
  rationale: Menjaga perbedaan antara kemiripan dan identitas serta menghindari ambiguitas pronomina dalam bahasa Indonesia.
- source_word: ἐκεῖνος ἔλεγεν
  choice: Namun, orang itu terus berkata
  rationale: '''Orang itu'' menunjuk kembali kepada pria yang diperdebatkan, sedangkan ''terus berkata'' menangkap daya iteratif bentuk imperfek.'
- source_word: Ἐγώ εἰμι
  choice: Akulah orangnya
  rationale: Dalam konteks ini merupakan pengenalan diri sebagai orang yang sedang dibicarakan; bentuk berpartikel '-lah' menyampaikan penegasan secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna Ἐγώ εἰμι dalam konteks Yohanes
  choice: Akulah orangnya
  alternative: Aku ada / Akulah dia
  rationale: Pembicara adalah orang yang telah disembuhkan dan sedang menegaskan identitasnya. Terjemahan ini tidak memaksakan makna kristologis absolut, sementara catatan kaki tetap menunjukkan bentuk harfiah dan menjaga kemungkinan pembaca melihat ungkapan Yunani yang mendasarinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan dialog yang alami dan bermartabat. 'Dialah orangnya' dan 'Akulah orangnya' jelas bagi pembaca umum; 'ia' dipakai untuk menjaga ragam tulis yang netral.
