  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: id
  text: Mereka mencaci dia dan berkata, “Engkau adalah murid orang itu[a], tetapi kami adalah murid-murid Musa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “muridnya.” Secara harfiah, bahasa Yunani memakai ungkapan “murid orang itu,” yang dalam konteks ini dapat bernada meremehkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: mencaci
  rationale: Kata ini menyatakan celaan atau penghinaan secara lisan dengan nada keras. “Mencaci” mempertahankan kekuatan dan permusuhan ungkapan Yunani tanpa menjadi bertele-tele.
- source_word: αὐτὸν
  choice: dia
  rationale: Pronomina objek ini merujuk kepada orang yang telah disembuhkan; “dia” adalah bentuk baku dan alami dalam bahasa Indonesia modern.
- source_word: καὶ εἶπον
  choice: dan berkata
  rationale: Menerjemahkan koordinasi naratif secara langsung dan alami; pelakunya tetap jelas dari klausa sebelumnya.
- source_word: Σὺ
  choice: Engkau
  rationale: Pronomina yang diletakkan di depan dalam bahasa Yunani bersifat tegas. “Engkau” mempertahankan penekanan itu dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: μαθητὴς / μαθηταί
  choice: murid / murid-murid
  rationale: μαθητής menunjuk pada orang yang belajar sekaligus mengikatkan diri kepada seorang guru. Pemakaian “murid” pada kedua bagian mempertahankan kesejajaran dan pertentangan retoris ayat ini.
- source_word: ἐκείνου
  choice: orang itu
  rationale: Kata tunjuk ini menciptakan jarak dan, dalam konteks permusuhan, dapat bernada meremehkan. “Orang itu” menyampaikan nuansa tersebut secara alami tanpa menambahkan sebutan yang lebih kasar.
- source_word: ἡμεῖς δὲ
  choice: tetapi kami
  rationale: δέ menandai pertentangan, sedangkan pronomina eksplisit ἡμεῖς menegaskan kelompok pembicara. “Tetapi kami” mempertahankan keduanya.
- source_word: τοῦ Μωϋσέως
  choice: Musa
  rationale: Genitif ini menyatakan hubungan seorang murid dengan gurunya. Dalam bahasa Indonesia, hubungan tersebut dinyatakan secara alami dengan “murid-murid Musa” tanpa preposisi.
- source_word: ἐσμὲν μαθηταί
  choice: adalah murid-murid
  rationale: Mempertahankan struktur kopulatif dan menghasilkan kontras yang jelas dengan “Engkau adalah murid” pada klausa sebelumnya.
theological_decisions:
- issue: Nada ἐκείνου ketika menunjuk kepada Yesus
  choice: Diterjemahkan “orang itu” untuk mempertahankan jarak dan kemungkinan nada meremehkan dari para pembicara.
  alternative: Diterjemahkan secara lebih netral sebagai “dia” atau “muridnya.”
  rationale: Konteks cacian dan pertentangan antara kesetiaan kepada Yesus dan kepada Musa mendukung nuansa meremehkan, tetapi catatan kaki tetap mengakui bahwa bentuk Yunani dapat dialihkan secara lebih netral.
- issue: Penerjemahan μαθητής secara konsisten
  choice: Menggunakan “murid” untuk kedua kemunculannya.
  alternative: Menggunakan “pengikut” atau “pelajar.”
  rationale: “Murid” mencakup hubungan belajar dan keterikatan kepada seorang guru serta mempertahankan kontras teologis dan retoris yang sengaja dibangun dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mencaci” dipilih untuk menyampaikan kerasnya serangan lisan, sedangkan “Engkau” mempertahankan penekanan pronomina serta cocok dengan ragam dialog kitab suci. Bentuk “murid-murid” mengikuti kaidah Indonesia untuk menyatakan jamak dan memperjelas kesejajaran antarklausa.
