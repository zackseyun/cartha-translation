  to: Ia menjawab, “Orang yang bernama Yesus itu membuat lumpur[a], lalu mengoleskannya pada mata saya[b] dan berkata kepada saya, ‘Pergilah ke Siloam dan basuhlah.’ Maka saya pergi dan membasuh, lalu saya dapat melihat[c].”
