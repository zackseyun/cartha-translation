    issue: “Membasuh diri” terlalu mengkhususkan objek tindakan.
    rationale: νίψαι dan νιψάμενος tidak menyebut “diri” sebagai objek dalam teks ini. Dalam konteksnya tindakan itu terkait dengan lumpur pada mata, sedangkan “membasuh diri” dalam bahasa Indonesia lazimnya dapat mengesankan mandi atau membasuh tubuh.
  - severity: medium
    issue: Catatan kaki c menyatakan terjemahan harfiah yang tidak tepat.
    rationale: ἀνέβλεψα bukan secara harfiah “saya menerima penglihatan.” Dalam konteks ini artinya memperoleh atau kembali mendapat kemampuan melihat; catatan harus membedakan makna kontekstual dari terjemahan harfiah.
