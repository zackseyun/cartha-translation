  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: id
  text: Ia menjawab, “Orang yang bernama Yesus itu membuat lumpur[a], lalu mengoleskannya pada mata saya[b] dan berkata kepada saya, ‘Pergilah ke Siloam dan basuhlah.’ Maka saya pergi dan membasuh, lalu saya dapat melihat[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah liat.” Kata Yunani πηλός dapat berarti tanah liat atau lumpur.
    reason: lexical_alternative
  - marker: b
    text: Atau “melumuri mata saya.” Kata kerja Yunani ini dapat berarti mengoleskan atau melumurkan sesuatu pada permukaan.
    reason: lexical_alternative
  - marker: c
    text: Atau “saya memperoleh penglihatan” atau “saya kembali dapat melihat.” Dalam konteks ini kata kerja Yunani itu berarti menjadi dapat melihat setelah buta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Ia menjawab
  rationale: Rumus naratif ini disampaikan secara alami dalam bahasa Indonesia; subjek eksplisit ἐκεῖνος cukup diwakili oleh “ia” dalam konteks.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Orang yang disebut Yesus itu
  rationale: Mempertahankan identifikasi pembicara terhadap Yesus sebagai seorang manusia tanpa memasukkan pengakuan kristologis yang lebih lanjut; “itu” membantu menandai frasa nominal tertentu secara alami.
- source_word: πηλὸν ἐποίησεν
  choice: membuat lumpur
  rationale: πηλός dapat berarti lumpur atau tanah liat; konteks tindakan Yesus sebelumnya mendukung “lumpur”, yang juga lebih wajar dalam bahasa Indonesia modern.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: mengoleskannya pada mata saya
  rationale: ἐπιχρίω menggambarkan tindakan mengoleskan atau melumurkan bahan; “mengoleskannya” jelas dan tidak menambahkan kesan ritual yang dapat timbul dari “mengurapi”.
- source_word: εἶπέν μοι ὅτι
  choice: berkata kepada saya
  rationale: Pengantar ujaran langsung ini dekat dengan bentuk Yunani dan tetap alami dalam bahasa Indonesia.
- source_word: Ὕπαγε εἰς τὸν Σιλωάμ
  choice: Pergilah ke Siloam
  rationale: Menyampaikan imperatif gerak dengan wajar serta mempertahankan nama tempat tanpa menambahkan “kolam”, yang tidak muncul dalam ayat ini.
- source_word: νίψαι
  choice: basuhlah dirimu
  rationale: Bentuk tengah dapat dinyatakan secara alami dengan tindakan yang diarahkan kepada diri sendiri; “basuh” cocok dengan konteks membersihkan bagian tubuh dari lumpur.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Maka saya pergi dan membasuh diri
  rationale: “Maka” menyampaikan hubungan akibat οὖν, sementara kedua partisip diterjemahkan sebagai rangkaian tindakan yang alami dalam narasi Indonesia.
- source_word: ἀνέβλεψα
  choice: saya dapat melihat
  rationale: Dalam konteks penyembuhan orang buta, ἀναβλέπω berarti memperoleh kemampuan melihat, bukan sekadar menengadah. Ungkapan ini tidak memaksakan apakah kebutaan itu sejak lahir atau kehilangan penglihatan sebelumnya.
theological_decisions:
- issue: Cara pembicara menggambarkan Yesus
  choice: Orang yang disebut Yesus itu
  alternative: Orang bernama Yesus itu
  rationale: 'Pilihan ini mempertahankan tahap pemahaman tokoh dalam alur cerita: ia menyebut Yesus sebagai “orang” tanpa memasukkan gelar atau pengakuan teologis yang belum ia ucapkan.'
- issue: Makna hasil penyembuhan dalam ἀνέβλεψα
  choice: saya dapat melihat
  alternative: penglihatan saya pulih
  rationale: Karena tokoh ini buta sejak lahir, “pulih” dapat menyiratkan bahwa ia pernah melihat sebelumnya. “Dapat melihat” menyampaikan hasil mukjizat tanpa menciptakan ketegangan dengan konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Saya” dipakai dalam kutipan sebagai bentuk netral yang alami; “basuhlah” mempertahankan nuansa perintah yang sedikit formal tetapi tetap mudah dipahami. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
