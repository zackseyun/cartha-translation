  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan objek sebelum keterangan tujuan dipilih agar alami, tanpa menghilangkan satu pun unsur sumber. Tidak diperlukan catatan kaki karena alternatif urutan kata tidak menghasilkan perbedaan makna yang penting dalam bahasa Indonesia.
