  text: Ἄγουσιν αὐτὸν πρὸς τοὺς Φαρισαίους τόν ποτε τυφλόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: id
  text: Mereka membawa orang yang dahulu buta itu kepada orang-orang Farisi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Mereka membawa
  rationale: Bentuk kini Yunani berfungsi sebagai kala kini historis dalam narasi. Bahasa Indonesia alami mengungkapkan tindakan lampau ini tanpa penandaan kala khusus; “membawa” sesuai dengan gerak menuju orang-orang Farisi.
- source_word: αὐτὸν
  choice: orang ... itu
  rationale: Pronomina “dia” dijalin secara alami dengan frasa aposisi berikutnya menjadi “orang yang dahulu buta itu,” sehingga rujukannya jelas tanpa susunan yang kaku.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: kepada orang-orang Farisi
  rationale: πρός dengan akusatif menyatakan gerak menuju sekelompok orang. “Kepada” mempertahankan arah tersebut tanpa menambahkan gagasan pengadilan yang dapat tersirat dalam “ke hadapan.”
- source_word: Φαρισαίους
  choice: orang-orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok Farisi, dengan penanda jamak yang sesuai karena artikelnya merujuk kepada beberapa anggota kelompok.
- source_word: τόν ποτε τυφλόν
  choice: orang yang dahulu buta itu
  rationale: Frasa ini bersifat substantival, yakni “orang yang dahulu buta.” Klausa relatif terdengar alami dan tetap menonjolkan perbedaan antara keadaan sebelumnya dan keadaan sekarang.
- source_word: ποτε
  choice: dahulu
  rationale: Dalam konteks ini berarti “sebelumnya/pada masa lampau,” bukan “pernah” dalam arti pengalaman yang mungkin berulang. “Dahulu” menyampaikan kontras waktunya secara jelas.
- source_word: τυφλόν
  choice: buta
  rationale: Padanan langsung dan alami bagi keadaan orang itu sebelumnya.
theological_decisions: []
