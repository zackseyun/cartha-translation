  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: id
  text: Kita harus melakukan pekerjaan Dia yang mengutus Aku selama hari masih terang; malam akan datang[a], ketika tidak seorang pun dapat bekerja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Aku harus melakukan pekerjaan Dia yang mengutus Aku.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: Kita
  rationale: Bentuk jamak orang pertama dengan δεῖ menyatakan keharusan yang mencakup Yesus dan pihak lain; “kita” paling alami dalam bahasa Indonesia dan mempertahankan bacaan SBLGNT.
- source_word: δεῖ
  choice: harus
  rationale: Menyampaikan keharusan atau kewajiban secara kuat, ringkas, dan alami.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: melakukan pekerjaan-pekerjaan
  rationale: Menghindari pengulangan kaku “mengerjakan pekerjaan” sambil mempertahankan nomina jamak ἔργα dan kaitannya dengan karya-karya ilahi dalam Injil Yohanes.
- source_word: τοῦ πέμψαντός με
  choice: Dia yang mengutus Aku
  rationale: Menerjemahkan partisipel substantival secara personal dan alami tanpa menambahkan identitas yang tidak dinyatakan langsung dalam frasa Yunani.
- source_word: ἕως ἡμέρα ἐστίν
  choice: selama hari masih terang
  rationale: Mengungkapkan rentang kesempatan untuk bertindak dan memperjelas kontras metaforis dengan malam secara alami dalam bahasa Indonesia.
- source_word: ἔρχεται νὺξ
  choice: malam akan datang
  rationale: Kala kini Yunani memiliki daya futuristik atau mendatang; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kesan datangnya malam.
- source_word: οὐδεὶς δύναται ἐργάζεσθαι
  choice: tidak seorang pun dapat bekerja
  rationale: Padanan langsung dan wajar yang mempertahankan penyangkalan universal serta makna kemampuan.
theological_decisions:
- issue: 'Varian tekstual pada awal ayat: ἡμᾶς (“kita”) atau ἐμέ (“Aku”)'
  choice: Kita harus melakukan pekerjaan-pekerjaan Dia yang mengutus Aku
  alternative: Aku harus melakukan pekerjaan-pekerjaan Dia yang mengutus Aku
  rationale: Teks sumber SBLGNT memakai ἡμᾶς, sehingga teks utama mengikuti bentuk jamak. Bacaan tunggal cukup luas dalam tradisi manuskrip dan dicatat dalam catatan kaki agar perbedaan yang bermakna tetap transparan.
- issue: Citra “hari” dan “malam”
  choice: Mempertahankan bahasa figuratif hari dan malam
  alternative: Menjelaskannya sebagai masa kesempatan dan masa ketika pekerjaan mustahil dilakukan
  rationale: Teks Yunani menyampaikan makna melalui metafora tanpa menjabarkan seluruh rujukan teologisnya; terjemahan tidak sepatutnya menyelesaikan ambiguitas itu di dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Dia” dan “Aku” dipakai untuk memperjelas rujukan personal kepada Allah dan Yesus sesuai kebiasaan luas penerbitan Alkitab Indonesia, tanpa menambahkan nama atau gelar yang tidak ada dalam teks Yunani.
