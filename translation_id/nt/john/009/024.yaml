  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: id
  text: Lalu mereka memanggil untuk kedua kalinya orang yang tadinya buta itu dan berkata kepadanya, “Muliakanlah Allah[a]. Kami tahu bahwa orang ini seorang berdosa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin suatu desakan khidmat dengan arti: “Katakanlah yang sebenarnya di hadapan Allah” atau “Mengakulah dengan terus terang di hadapan Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: mereka memanggil
  rationale: Dalam konteks ini, φωνέω menyatakan bahwa para pemimpin memanggil orang yang telah disembuhkan itu kembali. 'Memanggil' alami dalam bahasa Indonesia dan tidak menambahkan nuansa paksaan resmi yang tidak dinyatakan secara eksplisit.
- source_word: οὖν
  choice: Lalu
  rationale: οὖν menghubungkan tindakan ini dengan percakapan sebelumnya sekaligus melanjutkan alur cerita. 'Lalu' paling alami di sini tanpa menghilangkan fungsi penghubungnya.
- source_word: ἐκ δευτέρου
  choice: untuk kedua kalinya
  rationale: Ungkapan ini secara eksplisit berarti 'untuk kedua kalinya'; pilihan ini lebih tepat daripada sekadar 'lagi'.
- source_word: ὃς ἦν τυφλός
  choice: yang tadinya buta
  rationale: Bentuk imperfek menunjuk pada keadaan sebelumnya. 'Tadinya buta' menjelaskan secara alami bahwa ia dahulu buta tetapi kini telah sembuh.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Muliakanlah Allah
  rationale: Pilihan ini mempertahankan bentuk harfiah ungkapan Yunani yang secara idiomatis dapat berfungsi sebagai desakan khidmat agar berkata benar atau mengaku di hadapan Allah.
- source_word: ἡμεῖς οἴδαμεν
  choice: Kami tahu
  rationale: Pronomina eksplisit ἡμεῖς memberi penekanan pada klaim para penutur. 'Kami tahu' mempertahankan makna dan ketegasan retoris itu.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: orang ini
  rationale: Terjemahan ini wajar dan tepat untuk demonstratif serta nomina tersebut tanpa menambahkan nada merendahkan yang tidak harus ada dalam teks Yunani.
- source_word: ἁμαρτωλός
  choice: seorang berdosa
  rationale: Dalam posisi predikatif, kata ini menyatakan bahwa orang tersebut adalah seorang yang berdosa. Bentuk nomina 'seorang berdosa' mempertahankan tuduhan langsung dalam teks.
theological_decisions:
- issue: Daya idiomatis Δὸς δόξαν τῷ θεῷ
  choice: Mempertahankan makna harfiah 'Muliakanlah Allah' dalam teks utama
  alternative: Menerjemahkannya secara interpretatif sebagai 'Katakanlah yang sebenarnya di hadapan Allah' atau 'Mengakulah dengan terus terang di hadapan Allah'
  rationale: Ungkapan ini kemungkinan merupakan desakan khidmat agar orang itu berkata benar atau mengaku, tetapi susunan Yunaninya sendiri berbicara tentang memuliakan Allah. Teks utama mempertahankan ungkapan tersebut, sedangkan kemungkinan daya idiomatisnya dijelaskan dalam catatan kaki agar ambiguitas dan ketegangan teologis tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Tadinya buta' mudah dipahami serta tidak menyiratkan bahwa orang itu masih buta. Tanda catatan kaki ditempatkan langsung setelah ungkapan yang diterangkannya.
