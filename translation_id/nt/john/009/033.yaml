  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: id
  text: Jika orang ini tidak berasal dari Allah[a], ia tidak akan dapat melakukan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kecuali orang ini berasal dari Allah, ia tidak dapat melakukan apa pun.”
    reason: Alternatif leksikal untuk εἰ μὴ (“kecuali”), sepadan dengan catatan audit bahasa Inggris tanpa mengubah makna pengandaian.
lexical_decisions:
- source_word: εἰ μὴ
  choice: Jika ... tidak
  rationale: Dalam konstruksi ini, εἰ μή membentuk syarat negatif. Bentuk terbuka “Jika ... tidak” mempertahankan susunan kondisional Yunani dan tidak memadatkannya menjadi “kecuali”.
- source_word: ἦν
  choice: berasal
  rationale: Bersama παρὰ θεοῦ, bentuk ἦν menyatakan bahwa orang itu ada atau datang dari pihak Allah. “Berasal dari” merupakan ungkapan Indonesia yang alami tanpa menambahkan gagasan khusus seperti “diutus”.
- source_word: οὗτος
  choice: orang ini
  rationale: Kata tunjuk ini merujuk kepada seorang laki-laki yang sedang dibicarakan, yaitu Yesus. “Orang ini” alami dan tidak memasukkan gelar yang tidak ada dalam teks.
- source_word: παρὰ θεοῦ
  choice: dari Allah
  rationale: παρά dengan genitif menunjukkan sumber atau asal. “Dari Allah” mempertahankan keluasan makna itu, sedangkan “diutus oleh Allah” atau “diberi kuasa oleh Allah” akan mempersempitnya.
- source_word: οὐκ ἠδύνατο
  choice: dia tidak akan dapat
  rationale: Bentuk imperfek dalam akibat syarat menyatakan ketidakmampuan dalam keadaan yang diandaikan. “Tidak akan dapat” menyampaikan hubungan kontrafaktual secara alami dalam bahasa Indonesia.
- source_word: ποιεῖν οὐδέν
  choice: melakukan apa pun
  rationale: ποιεῖν bersifat luas, dan οὐδέν di bawah negasi menyatakan ketiadaan kemampuan sama sekali. “Melakukan apa pun” alami dan tidak membatasi perbuatan itu secara eksplisit hanya pada mukjizat.
theological_decisions:
- issue: Makna “dari Allah” dalam hubungannya dengan Yesus
  choice: Mempertahankan ungkapan sumber “dari Allah” tanpa penjelasan tambahan.
  alternative: “diutus oleh Allah” atau “diberi kuasa oleh Allah”
  rationale: Ayat ini menghubungkan kemampuan Yesus melakukan perbuatan-perbuatan tersebut dengan asal-Nya dari Allah, tetapi frasa Yunani tidak menentukan secara teknis apakah yang terutama dimaksud ialah pengutusan, pemberian wewenang, atau aspek lain. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kata ganti “dia” dipakai secara wajar tanpa kapitalisasi teologis yang tidak ditandai dalam bahasa sumber; ungkapan “melakukan apa pun” mempertahankan cakupan umum ποιεῖν οὐδέν.
