  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: id
  text: Sejak dahulu tidak pernah terdengar bahwa ada orang yang membuka mata seseorang yang buta sejak lahir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sejak dunia dijadikan tidak pernah terdengar …”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Sejak dahulu
  rationale: Ungkapan ini menunjuk pada seluruh rentang sejarah yang diingat. Pilihan ini mempertahankan arti historis tanpa mengubahnya menjadi pernyataan metafisis tentang kekekalan.
- source_word: οὐκ ἠκούσθη
  choice: tidak pernah terdengar
  rationale: Bentuk pasif ini menyatakan bahwa kejadian semacam itu belum pernah dilaporkan atau dikenal sebagai preseden; ungkapan Indonesia ini alami dan mempertahankan bentuk pasifnya.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari hal yang tidak pernah terdengar dan diterjemahkan secara langsung serta alami.
- source_word: ἠνέῳξέν
  choice: membuka
  rationale: Dengan objek 'mata', verba ini secara langsung berarti 'membuka mata'; 'menyembuhkan' akan menambahkan penafsiran di luar nilai leksikalnya.
- source_word: τις
  choice: ada orang
  rationale: Subjek tak tentu ini berada dalam pernyataan negatif umum; 'ada orang' terdengar alami dalam bahasa Indonesia dan tidak menentukan identitas pelakunya.
- source_word: ὀφθαλμοὺς
  choice: mata
  rationale: Dalam idiom bahasa Indonesia, 'membuka mata seseorang' tidak memerlukan kata sandang yang tidak tersedia dalam bahasa Indonesia.
- source_word: τυφλοῦ γεγεννημένου
  choice: seseorang yang buta sejak lahir
  rationale: Frasa genitif ini menerangkan pemilik mata dan keadaan yang sudah berlangsung sejak kelahiran. 'Seseorang' tidak menambahkan kata 'laki-laki', yang tidak dinyatakan secara leksikal oleh frasa tersebut.
theological_decisions:
- issue: Cakupan ἐκ τοῦ αἰῶνος
  choice: 'ungkapan historis: ''sejak dahulu'''
  alternative: '''sejak dunia dijadikan'' atau ''sejak kekekalan'''
  rationale: Dalam konteks ini, pembicara menyatakan belum adanya preseden dalam pengalaman manusia, bukan membuat pernyataan metafisis tentang kekekalan. Alternatif tradisional dicatat karena ungkapan Yunani dapat dipahami mencakup masa sejak permulaan dunia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan pasif Yunani dipertahankan secara alami, sedangkan frasa kelahiran diterjemahkan tanpa menambahkan jenis kelamin yang tidak perlu.
