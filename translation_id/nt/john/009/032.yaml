  source_fidelity: Teks Indonesia dengan tepat menyampaikan idiom ἐκ τοῦ αἰῶνος sebagai rentang sejarah yang diketahui (“Sejak dahulu”), negasi preseden dalam οὐκ ἠκούσθη (“tidak pernah terdengar”), serta isi klaim bahwa seseorang telah membuka mata orang yang buta sejak lahir. Terjemahan tidak mengubah ungkapan “membuka mata” menjadi penafsiran seperti “menyembuhkan.”
  naturalness: Kalimat ini baku, jelas, dan alami dalam bahasa Indonesia modern. “Ada orang yang membuka mata seseorang yang buta sejak lahir” menyatakan subjek tak tentu dan pemilik mata secara jelas tanpa memaksakan jenis kelamin.
  terminology: Istilah “buta sejak lahir” tepat untuk τυφλοῦ γεγεννημένου dan mempertahankan fokus pada kebutaan sejak kelahiran. Catatan alternatif “Sejak dunia dijadikan” wajar sebagai alternatif tradisional untuk cakupan temporal idiom tersebut, tanpa dijadikan pembacaan utama.
