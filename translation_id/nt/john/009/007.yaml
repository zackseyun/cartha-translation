  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: id
  text: Lalu Ia berkata kepadanya, “Pergilah, basuhlah dirimu di kolam Siloam” (nama itu diterjemahkan “yang diutus”[a]). Maka orang itu pergi dan membasuh dirinya, lalu kembali dalam keadaan dapat melihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “nama itu berarti ‘yang diutus’.”
    reason: Alternatif ini menyampaikan ἑρμηνεύεται sebagai penjelasan makna, bukan dengan istilah teknis “diterjemahkan”.
lexical_decisions:
- source_word: Ὕπαγε
  choice: Pergilah
  rationale: Imperatif ini menyatakan perintah bergerak menuju suatu tempat. “Pergilah” lugas, alami, dan tidak menambahkan nuansa yang tidak dinyatakan dalam bahasa Yunani.
- source_word: νίψαι / ἐνίψατο
  choice: basuhlah dirimu / membasuh dirinya
  rationale: νίπτω lazim menunjuk pada tindakan membasuh, sering kali bagian tubuh dan bukan mandi seluruh badan. “Membasuh diri” menyampaikan bentuk tindakan yang mengenai pelakunya tanpa menambahkan objek seperti mata, yang tidak disebutkan secara eksplisit.
- source_word: εἰς τὴν κολυμβήθραν
  choice: di kolam
  rationale: κολυμβήθρα adalah kolam atau waduk. Bersama verba membasuh, preposisi εἰς paling alami dinyatakan sebagai lokasi tindakan dalam bahasa Indonesia, yaitu “di kolam”, bukan secara kaku “ke dalam kolam”.
- source_word: Σιλωάμ
  choice: Siloam
  rationale: Bentuk transliterasi nama tempat ini sudah dikenal luas dalam bahasa Indonesia dan tetap dekat dengan bentuk Yunani.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: nama itu diterjemahkan “Yang Diutus”
  rationale: ἑρμηνεύεται memperkenalkan keterangan penerjemahan atas nama Siloam. “Yang Diutus” mempertahankan bentuk pasif dan sifat sebutan dari Ἀπεσταλμένος tanpa memperjelas simbolismenya melampaui teks.
- source_word: οὖν
  choice: Maka
  rationale: οὖν menghubungkan perintah dengan tindakan berikutnya sebagai konsekuensi naratif. “Maka” jelas dan wajar dalam ragam narasi Indonesia.
- source_word: ἀπῆλθεν
  choice: orang itu pergi
  rationale: Aoristus ini secara sederhana menyatakan keberangkatan. Subjek dinyatakan sebagai “orang itu” agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἦλθεν βλέπων
  choice: kembali dengan dapat melihat
  rationale: Frasa ini mempertahankan gerak kedatangan dan keadaan melihat yang menyertainya. “Kembali” menyatakan arah yang tersirat oleh urutan narasi, sedangkan “dengan dapat melihat” mengungkapkan hasil penyembuhan tanpa mengubahnya menjadi penjelasan teologis.
theological_decisions:
- issue: Keterangan arti nama Siloam dan kemungkinan simbolismenya
  choice: Mempertahankan keterangan “nama itu diterjemahkan ‘Yang Diutus’” dalam teks utama.
  alternative: Memperluas terjemahan agar secara eksplisit menghubungkan “Yang Diutus” dengan Yesus sebagai utusan Bapa.
  rationale: Keterangan tersebut merupakan bagian dari teks Yunani dan harus dipertahankan, tetapi hubungan simbolisnya tidak dijelaskan secara eksplisit dalam ayat ini. Terjemahan tidak boleh menyelesaikan atau memperbesar implikasi teologis yang dibiarkan tersirat oleh penulis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. “Membasuh” dipilih daripada “mencuci” agar cocok untuk tindakan pada tubuh, sementara struktur kalimat tetap mudah dipahami pembaca umum.
