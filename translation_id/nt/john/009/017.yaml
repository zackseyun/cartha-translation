  rationale: Revisi mengembalikan keluasan pertanyaan Yunani περὶ αὐτοῦ dan tetap menyampaikan penekanan pada orang yang ditanyai melalui “katamu.” Hubungan kausal ὅτι dipertahankan dengan “karena,” tindakan pembukaan mata tetap dinyatakan sebagai peristiwa yang telah terjadi, dan “seorang nabi” dipertahankan tanpa memaksakan pembacaan sebagai gelar khusus.
