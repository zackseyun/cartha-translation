  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: id
  text: Lalu mereka berkata lagi kepada orang buta itu, “Apa katamu tentang dia, karena ia telah membuka matamu?” Ia menjawab, “Dia seorang nabi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan naratif dan konsekuensi dari percakapan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: τῷ τυφλῷ
  choice: kepada orang buta itu
  rationale: Adjektiva Yunani dipakai secara substantival. Ungkapan ini ringkas dan tidak menambahkan sudut pandang bahwa ia dahulu buta, yang tidak dinyatakan dalam frasa ini.
- source_word: πάλιν
  choice: lagi
  rationale: Mempertahankan gagasan bahwa pertanyaan diajukan kembali dalam pemeriksaan yang sedang berlangsung.
- source_word: Τί σὺ λέγεις περὶ αὐτοῦ
  choice: Menurutmu sendiri, siapakah dia
  rationale: Bentuk σὺ yang eksplisit diberi tekanan melalui “sendiri”. Dalam konteks Indonesia, pertanyaan ini secara wajar meminta penilaian orang tersebut tentang identitas atau kedudukan Yesus.
- source_word: ὅτι
  choice: karena
  rationale: Dipahami secara kausal sebagai alasan atau dasar pertanyaan; “karena” mempertahankan hubungan itu secara langsung.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: dia telah membuka matamu
  rationale: Mengungkapkan tindakan yang sudah terjadi dan hasilnya tetap relevan dalam konteks pemeriksaan.
- source_word: Προφήτης ἐστίν
  choice: Dia seorang nabi
  rationale: Nomina predikatif tanpa artikel paling wajar dibaca secara tak tentu atau kualitatif di sini, tanpa memaksakan gelar khusus.
theological_decisions:
- issue: Apakah Προφήτης merupakan gelar khusus atau nomina umum
  choice: seorang nabi
  alternative: Sang Nabi / Nabi itu
  rationale: Konteks menunjukkan penilaian orang yang disembuhkan sedang berkembang. “Seorang nabi” mempertahankan pengakuan yang nyata tanpa mengimpor klaim mesianik khusus yang tidak harus dinyatakan oleh bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Penekanan pada σὺ dinyatakan dengan “menurutmu sendiri”; tidak diperlukan catatan kaki karena unsur itu hadir dalam teks utama.
