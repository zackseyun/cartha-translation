  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: id
  text: Beberapa orang Farisi yang bersama Yesus mendengar hal-hal itu dan berkata kepada-Nya, “Kami juga tidak buta, bukan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kami bukan orang buta juga, bukan?” Dalam bahasa Yunani, pertanyaan dengan μή mengharapkan jawaban “tidak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: mendengar
  rationale: Aoristus ἀκούω di sini menyatakan bahwa mereka mendengar perkataan Yesus; “mendengar” merupakan padanan naratif yang alami.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Beberapa orang Farisi
  rationale: ἐκ dengan genitif bersifat partitif dan menunjuk kepada sebagian dari kelompok orang Farisi, bukan semuanya.
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Mempertahankan bentuk jamak demonstratif tanpa membatasi acuannya hanya pada kata-kata tertentu.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: yang bersama Yesus
  rationale: Frasa partisipial ini mengidentifikasi orang-orang Farisi yang berada bersama αὐτοῦ. Nama “Yesus” dipakai untuk memperjelas acuan pronomina secara alami dalam bahasa Indonesia.
- source_word: εἶπον αὐτῷ
  choice: berkata kepada-Nya
  rationale: Menerjemahkan λέγω secara langsung; bentuk pertanyaan sudah tampak dalam kutipan.
- source_word: Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
  choice: Kami bukan orang buta juga, bukan?
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif. Susunan “bukan ..., bukan?” menyampaikan harapan tersebut sekaligus mempertahankan penekanan pada “kami” dan cakupan καί, “juga”.
- source_word: τυφλοί
  choice: orang buta
  rationale: Mempertahankan istilah tanpa menambahkan “secara rohani”, sehingga metafora dan ironi Yohanes tetap ditentukan oleh konteks.
theological_decisions:
- issue: Apakah makna metaforis τυφλοί perlu dinyatakan secara eksplisit
  choice: Mempertahankan “orang buta” tanpa menambahkan “secara rohani”
  alternative: “buta secara rohani”
  rationale: Bahasa Yunani tidak memberi penjelas pada τυφλοί. Konteks menunjukkan pemakaian metaforis, tetapi menerangkannya dalam teks utama akan mengurangi ironi dan menutup ruang ungkapan aslinya.
- issue: Acuan αὐτοῦ dalam “yang bersama dia”
  choice: Menyatakan acuan sebagai “Yesus”
  alternative: “yang bersama-Nya”
  rationale: Konteks menunjuk kepada Yesus. Penyebutan nama menghindari rangkaian pronomina yang kurang alami dalam bahasa Indonesia tanpa mengubah identitas acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Sapaan “Kami” mencerminkan penekanan ἡμεῖς; konstruksi pertanyaan penegas mempertahankan harapan jawaban negatif. Istilah “orang buta” dibiarkan tanpa penjelasan interpretatif.
