  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: id
  text: Lalu mereka berkata kepadanya, “Bagaimana matamu dibuka[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagaimana matamu menjadi terbuka?” Bahasa Yunani memakai bentuk pasif dan tidak menyebutkan pelakunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: mereka bertanya
  rationale: Bentuk imperfek λέγω secara harfiah berarti “mereka berkata/bertanya.” Dalam konteks pertanyaan langsung, “bertanya” paling alami dalam bahasa Indonesia. Aspek imperfek tidak perlu dibuat eksplisit karena dapat memberi kesan pertanyaan itu diulang-ulang, yang tidak pasti dimaksudkan.
- source_word: οὖν
  choice: Lalu
  rationale: Partikel ini menghubungkan pertanyaan dengan peristiwa sebelumnya. “Lalu” wajar dalam alur naratif Indonesia dan tetap mempertahankan daya penghubungnya.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Menyatakan pihak yang dituju oleh ujaran dan diterjemahkan secara langsung serta alami.
- source_word: Πῶς
  choice: Bagaimana
  rationale: Padanan langsung bagi kata tanya yang menanyakan cara atau proses.
- source_word: ἠνεῴχθησάν
  choice: dapat melihat
  rationale: Secara harfiah bentuk ini adalah aoristus pasif, “dibuka.” Namun ungkapan Yunani tentang mata yang dibuka secara idiomatis berarti memperoleh penglihatan. “Matamu dapat melihat” menyampaikan maksudnya dengan bahasa Indonesia yang alami, sementara catatan kaki mempertahankan bentuk pasif sumber.
- source_word: σου οἱ ὀφθαλμοί
  choice: matamu
  rationale: Konstruksi posesif Yunani diterjemahkan dengan enklitik Indonesia -mu; artikel Yunani tidak perlu dinyatakan tersendiri.
theological_decisions:
- issue: Pelaku yang membuat mata itu terbuka tidak disebutkan dalam bentuk pasif Yunani.
  choice: Teks utama memakai ungkapan “matamu dapat melihat” tanpa menyebut pelaku.
  alternative: “Bagaimana matamu dibuka?”
  rationale: Terjemahan tidak menambahkan Allah, Yesus, atau pelaku lain yang tidak dinyatakan dalam ayat ini; catatan kaki menyediakan bentuk yang lebih formal dan mempertahankan pasif.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Matamu dapat melihat” lebih mudah dipahami daripada “matamu dibuka,” sedangkan catatan kaki menjaga transparansi terhadap bentuk pasif Yunani.
