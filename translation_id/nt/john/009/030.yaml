  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: id
  text: 'Orang itu menjawab, “Justru inilah yang mengherankan[a]: kalian tidak tahu dari mana ia berasal[b], tetapi ia telah membuka mata saya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menakjubkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari mana ia datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Orang itu menjawab mereka
  rationale: Mengungkapkan formula dialog Yunani secara alami dalam bahasa Indonesia tanpa mengulang secara kaku ‘menjawab dan berkata kepada mereka’. ‘Orang itu’ menunjuk kepada laki-laki yang sebelumnya buta.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Justru inilah yang mengherankan
  rationale: ‘Inilah’ mempertahankan penekanan demonstratif, sedangkan ‘justru’ menyampaikan daya penjelas sekaligus nada ironis γάρ dalam konteks. ‘Mengherankan’ merupakan padanan alami bagi θαυμαστόν.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: kalian tidak tahu
  rationale: ‘Kalian’ menunjukkan bahwa Yesus sedang berbicara kepada beberapa lawan bicara dan mempertahankan penekanan pada ὑμεῖς; ‘tidak tahu’ menyatakan ketidaktahuan tentang asal-usul.
- source_word: πόθεν ἐστίν
  choice: dari mana ia berasal
  rationale: Ungkapan ini secara alami menyatakan sumber atau asal seseorang tanpa menentukan lebih jauh apakah yang dimaksud asal geografis atau ilahi.
- source_word: καὶ
  choice: tetapi
  rationale: Walaupun secara bentuk berarti ‘dan’, dalam konteks ini penghubung tersebut menandai kontras ironis antara ketidaktahuan mereka dan tindakan penyembuhan Yesus.
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: ia telah membuka mata saya
  rationale: Mempertahankan gambaran konkret tentang pemulihan penglihatan. ‘Telah’ menonjolkan tindakan yang sudah terjadi dan hasilnya yang masih nyata.
theological_decisions:
- issue: Gema metaforis ungkapan ‘membuka mata’ dalam Injil Yohanes
  choice: Mempertahankan ungkapan harfiah tentang penyembuhan fisik tanpa menjelaskan makna rohaninya di dalam teks
  alternative: Menerjemahkannya dengan ungkapan yang secara eksplisit menonjolkan pencerahan rohani
  rationale: Acuan langsungnya adalah pemulihan penglihatan orang itu. Tema rohani tentang melihat dan kebutaan tetap dapat muncul melalui konteks tanpa dipaksakan ke dalam terjemahan.
- issue: Asal Yesus dalam frasa πόθεν ἐστίν
  choice: Membiarkan ‘dari mana ia berasal’ tetap terbuka
  alternative: Menentukan bahwa yang dimaksud adalah tempat asal geografis atau asal ilahi
  rationale: Ucapan tersebut mengandung ketegangan khas narasi Yohanes tentang asal Yesus. Terjemahan tidak boleh menyelesaikan ambiguitas itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada percakapan yang tetap bermartabat. ‘Kalian’ dipakai karena lawan bicara berbentuk jamak dan konteksnya adalah teguran langsung. Kata ganti ‘ia’ tidak diberi huruf kapital agar tipografi tidak menambahkan penafsiran teologis yang tidak ditandai oleh teks Yunani.
