  text: While I am in the world, I am the light of the world.
translation:
  language: id
  text: Selama Aku berada di dunia, Aku adalah terang dunia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Selama
  rationale: Dalam konteks ini, ὅταν bersama bentuk subjungtif ὦ menyatakan rentang waktu keberadaan Yesus di dunia; “selama” menyampaikan fungsi temporal itu secara alami tanpa memberi kesan pengulangan seperti “setiap kali”.
- source_word: ἐν τῷ κόσμῳ
  choice: berada di dunia
  rationale: Ungkapan ini mempertahankan arti lokatif ἐν dan memakai susunan Indonesia yang wajar.
- source_word: φῶς ... τοῦ κόσμου
  choice: terang dunia
  rationale: Mempertahankan metafora dan konstruksi genitif Yunani yang ringkas serta lazim dalam bahasa Indonesia Alkitabiah-modern.
- source_word: ἐγώ tersirat dalam εἰμι
  choice: Akulah
  rationale: Bentuk “Akulah” menegaskan identitas predikatif Yesus secara alami dalam bahasa Indonesia, sesuai tekanan pernyataan “Aku adalah terang dunia” tanpa menambahkan isi baru.
theological_decisions:
- issue: Batas waktu pernyataan tentang Yesus sebagai terang dunia
  choice: Selama Aku berada di dunia
  alternative: Setiap kali Aku berada di dunia
  rationale: Konteks wacana menunjuk pada masa pelayanan dan kehadiran Yesus di dunia. “Selama” mempertahankan nuansa temporal tanpa menyiratkan beberapa kali kedatangan atau kehadiran yang tidak dinyatakan oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kapitalisasi “Aku” mengikuti kebiasaan penghormatan bagi ujaran Yesus. Tidak diperlukan catatan kaki karena perbedaan nuansa ὅταν dapat disampaikan dengan memadai dalam teks utama.
