  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: id
  text: Ia berkata, “Aku percaya, Tuhan[a],” lalu ia menyembah-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε juga dapat digunakan sebagai sapaan hormat; di sini “Tuhan” dipilih karena konteksnya memuncak dalam pengakuan percaya dan penyembahan.
    reason: alternative_reading
  - marker: b
    text: Atau “bersujud di hadapan-Nya” atau “memberi hormat kepada-Nya.” Kata kerja Yunani ini dapat menunjuk pada tindakan bersujud atau memberi penghormatan; di sini diterjemahkan “menyembah” sesuai dengan konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Jawab orang itu
  rationale: Artikel ὁ berfungsi sebagai pronomina yang menunjuk kepada orang yang telah disembuhkan; δέ menandai kelanjutan respons. Ungkapan Indonesia ini mengalir alami sebagai pengantar ujaran tanpa melebihkan nuansa pertentangan.
- source_word: ἔφη
  choice: Jawab
  rationale: Aoristus φημί memperkenalkan ujaran. Karena perkataan ini merupakan respons langsung kepada Yesus, 'Jawab' lebih alami dalam narasi Indonesia daripada 'berkata', tanpa mengubah makna.
- source_word: Πιστεύω
  choice: Aku percaya
  rationale: Mempertahankan ungkapan langsung dan kaitan verbal dengan tema percaya dalam Injil Yohanes; 'aku' sesuai dengan ujaran pribadi dan sungguh-sungguh.
- source_word: κύριε
  choice: Tuhan
  rationale: κύριε dapat menjadi sapaan hormat, tetapi konteks pengakuan percaya yang diikuti προσκύνησις mendukung sapaan yang berbobot lebih tinggi, 'Tuhan'. Kemungkinan 'Tuan' tetap dicatat dalam catatan kaki.
- source_word: προσεκύνησεν
  choice: menyembah
  rationale: προσκυνέω dapat menggambarkan sujud atau pemberian hormat. Dalam konteks respons kepada Yesus sesudah pengakuan percaya, 'menyembah' paling tepat menangkap daya teologisnya, sedangkan alternatif leksikal dicatat dalam catatan kaki.
- source_word: αὐτῷ
  choice: -Nya
  rationale: Dativum αὐτῷ merupakan objek προσκυνέω. Bentuk enklitik hormat '-Nya' merujuk secara alami kepada Yesus dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah κύριε merupakan sapaan hormat biasa atau pengakuan yang lebih tinggi
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks mencapai puncak pada pengakuan percaya dan tindakan προσκύνησις kepada Yesus. 'Tuhan' mempertahankan bobot kristologis yang mungkin dimaksud tanpa meniadakan ambiguitas leksikal, yang dijaga dalam catatan kaki.
- issue: Apakah προσεκύνησεν berarti menyembah atau sekadar bersujud/memberi hormat
  choice: menyembah
  alternative: bersujud di hadapan-Nya / memberi hormat kepada-Nya
  rationale: Objek tindakan itu adalah Yesus, dan tindakan tersebut langsung mengikuti pengakuan percaya. Karena itu, 'menyembah' paling sesuai dengan dorongan konteks, sementara cakupan makna tindakan lahiriah atau penghormatan tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang ringkas dan khidmat. 'Jawab orang itu' memperjelas rujukan pronominal Yunani dan terdengar alami. Kapitalisasi '-Nya' mengikuti kebiasaan Indonesia untuk rujukan ilahi, tanpa menambahkan unsur semantis pada teks sumber.
