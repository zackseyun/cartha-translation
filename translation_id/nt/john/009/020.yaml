translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Pengulangan 'bahwa' dipertahankan untuk mencerminkan dua klausa isi yang sejajar dalam teks Yunani. Tidak diperlukan catatan kaki karena 'terlahir buta' secara alami memuat makna 'buta sejak lahir' tanpa menutup ambiguitas yang relevan.
