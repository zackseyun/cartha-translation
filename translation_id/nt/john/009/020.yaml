  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: id
  text: Karena itu, orang tuanya menjawab, “Kami tahu bahwa inilah anak kami dan bahwa ia dilahirkan buta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat naratif sekaligus logis dari pertanyaan dalam ayat sebelumnya; bentuk ini wajar dan tetap mempertahankan hubungan inferensial.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: orang tuanya
  rationale: Merujuk secara kolektif kepada ayah dan ibu laki-laki itu; ini padanan Indonesia yang alami dan tepat.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: menjawab
  rationale: Dalam bahasa Indonesia, pasangan verba Yunani ini secara idiomatis dinyatakan dengan satu verba; menerjemahkannya sebagai 'menjawab dan berkata' akan terasa kaku tanpa menambah makna.
- source_word: Οἴδαμεν
  choice: Kami tahu
  rationale: Menyatakan pengetahuan atau kepastian orang tua tersebut dan merupakan padanan langsung yang alami.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: dia ini anak kami
  rationale: Mempertahankan daya tunjuk οὗτος dalam identifikasi langsung, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: τυφλὸς ἐγεννήθη
  choice: dia terlahir buta
  rationale: Menyampaikan bahwa kebutaan telah ada sejak kelahiran secara ringkas dan idiomatis, seraya mengikuti hubungan predikatif dalam bahasa Yunani.
