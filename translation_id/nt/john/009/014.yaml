id: JHN.9.14
reference: John 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: id
  text: Hari ketika Yesus membuat lumpur[a] dan membuka mata orang itu[b] adalah hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah liat”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuka matanya”; dalam konteks ini ungkapan tersebut mengacu pada penyembuhannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: hari Sabat
  rationale: Dalam bahasa Indonesia, “hari Sabat” merupakan ungkapan alami untuk menyatakan jenis hari yang dimaksud. Bentuk Yunani tanpa artikel tidak perlu ditiru dengan kata sandang karena bahasa Indonesia tidak memiliki padanan langsung bagi “a/the”.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan naratif ringan. Susunan kalimat Indonesia sudah menjalankan fungsi transisi itu; penambahan “namun” akan terlalu adversatif, sedangkan “adapun” terasa lebih formal daripada yang diperlukan.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: Hari ketika … itu
  rationale: Konstruksi relatif temporal Yunani dialihkan menjadi susunan Indonesia yang alami, dengan anak kalimat sebagai subjek dan “itu” sebagai penegas batasnya.
- source_word: πηλόν
  choice: lumpur
  rationale: Dalam konteks tanah yang dicampur dengan ludah, “lumpur” adalah istilah Indonesia yang paling alami. “Tanah liat” tetap mungkin dan dicatat sebagai alternatif.
- source_word: ἐποίησεν
  choice: membuat
  rationale: ποιέω di sini menyatakan tindakan membuat lumpur; “membuat” merupakan padanan langsung dan wajar.
- source_word: ἀνέῳξεν
  choice: membuka
  rationale: Padanan konkret “membuka” mempertahankan cara ungkap Yohanes dan tidak menggantinya dengan penafsiran abstrak seperti “memulihkan penglihatan”.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: mata orang itu
  rationale: Acuan pronomina diperjelas secara alami sebagai “orang itu” agar tidak menimbulkan ambiguitas dalam bahasa Indonesia, sambil tetap mempertahankan rujukan konkret kepada matanya.
theological_decisions:
- issue: Penyebutan hari Sabat sehubungan dengan penyembuhan oleh Yesus
  choice: Menyampaikan keterangan waktunya secara langsung tanpa komentar tentang hukum Sabat atau pertentangan yang menyusul.
  alternative: Memperluasnya dengan penjelasan bahwa tindakan Yesus memicu perselisihan mengenai Sabat.
  rationale: Ayat ini hanya memberikan fakta naratif yang mempersiapkan perdebatan berikutnya. Penjelasan teologis tambahan akan mendahului dan menyelesaikan ketegangan yang sengaja dibiarkan oleh narasi.
- issue: Ungkapan “membuka mata”
  choice: Mempertahankan ungkapan konkret “membuka mata orang itu”.
  alternative: Menerjemahkan secara interpretatif sebagai “memulihkan penglihatannya”.
  rationale: Ungkapan konkret sesuai dengan teks Yunani dan gaya narasi Yohanes, sekaligus tetap dapat dipahami sebagai tindakan penyembuhan dari konteks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan kalimat dibalik dari urutan Yunani agar hubungan antara hari terjadinya tindakan Yesus dan hari Sabat terbaca alami. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
