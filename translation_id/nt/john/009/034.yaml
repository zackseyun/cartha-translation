review_pass:
  verdict: revise
  source_fidelity: Teks mempertahankan verba ganda pembuka, bentuk jamak ἁμαρτίαις sebagai “dosa-dosa,” intensifikasi ὅλος, dan tindakan pengusiran ἐξέβαλον ... ἔξω. Namun, “hendak mengajar” menggeser present indicative διδάσκεις ke arah niat atau tindakan yang akan dilakukan. Pertanyaan retoris lebih setia jika memakai bentuk kini “mengajar.”
  naturalness: Bahasa Indonesia baku dan bernada formal. “Mereka mengusirnya keluar” dapat dipahami dan mencerminkan penegasan ἔξω, meskipun agak pleonastis; dalam terjemahan optimal-ekuivalen hal itu dapat dipertahankan. “Namun” tidak diperlukan, karena καί terutama menghubungkan tuduhan dengan pertanyaan yang bernada geram; “dan” lebih dekat dan tetap alami dalam dialog.
  terminology: “Dosa-dosa” dengan tepat mempertahankan bentuk jamak dan tidak memaksakan penafsiran doktrinal. “Engkau” tepat untuk penekanan σὺ serta register dialog yang formal. Catatan kaki secara tepat menyajikan kemungkinan pengusiran dari hadapan mereka maupun implikasi pengucilan komunitas tanpa menyatakannya sebagai kepastian.
  issues:
  - severity: medium
    issue: “Hendak mengajar” tidak mencerminkan kala kini διδάσκεις.
    rationale: 'Kata “hendak” lazimnya menunjukkan maksud atau tindakan yang akan dilakukan, sedangkan Yunani memakai bentuk kini dalam pertanyaan retoris yang mencela tindakan orang itu: “dan engkau mengajar kami?”'
  - severity: low
    issue: “Namun” terlalu memperjelas hubungan adversatif.
    rationale: καί berarti “dan”; kontras dan nada penghinaan sudah tersirat dalam pertanyaan retoris serta pronomina σὺ yang eksplisit.
  revised_text: Mereka menjawab dan berkata kepadanya, “Engkau dilahirkan sepenuhnya dalam dosa-dosa, dan engkau mengajar kami?” Lalu mereka mengusirnya keluar.[a]
