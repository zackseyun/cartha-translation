source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: id
  text: Mereka menjawab dan berkata kepadanya, “Engkau dilahirkan sepenuhnya dalam dosa-dosa, dan engkau mengajar kami?” Lalu mereka mengusirnya keluar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka mengusirnya.” Ini dapat berarti bahwa mereka mengusir dia dari hadapan mereka; dalam konteksnya, tindakan itu mungkin juga menyiratkan pengucilan dari komunitas sinagoge.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Mereka menjawab dan berkata kepadanya
  rationale: Mempertahankan rumusan dua verba khas narasi Yohanes, yang dapat diterima dalam ragam Indonesia yang formal dan bermartabat.
- source_word: Ἐν ἁμαρτίαις
  choice: dalam dosa-dosa
  rationale: Mempertahankan bentuk jamak Yunani dan daya tuduh dalam penghinaan para penutur, tanpa mengubahnya menjadi pernyataan doktrinal tentang 'dosa' dalam bentuk tunggal.
- source_word: ἐγεννήθης ὅλος
  choice: dilahirkan sepenuhnya
  rationale: 'Kata ''sepenuhnya'' menyampaikan cakupan ὅλος: menurut tuduhan mereka, seluruh keadaan orang itu sejak lahir ditandai oleh dosa-dosa.'
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: namun engkau hendak mengajar kami?
  rationale: '''Engkau'' menampilkan penekanan pada σὺ, sedangkan ''namun'' menyampaikan daya konfrontatif καί dalam pertanyaan retoris. ''Hendak mengajar'' terdengar alami dalam bahasa Indonesia untuk celaan terhadap upaya orang itu mengoreksi mereka.'
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: mereka mengusirnya keluar
  rationale: Mempertahankan unsur pengusiran yang kuat dalam ἐκβάλλω serta penegasan ἔξω. Ungkapan ini dapat menunjuk pada pengusiran dari hadapan mereka dan, dalam konteks, mungkin juga pada pengucilan dari komunitas sinagoge.
theological_decisions:
- issue: Makna tuduhan bahwa orang itu dilahirkan sepenuhnya dalam dosa-dosa
  choice: Tuduhan para lawan dipertahankan secara harfiah sebagai 'dalam dosa-dosa' tanpa menjelaskan sumber atau jenis dosa yang mereka maksud.
  alternative: Engkau dilahirkan sepenuhnya dalam dosa; Engkau sejak lahir adalah orang yang penuh dosa; Engkau lahir menanggung dosa orang tuamu.
  rationale: Teks mencatat penghinaan mereka, tetapi tidak menentukan apakah yang dimaksud ialah dosanya sendiri, dosa orang tuanya, dosa warisan, atau anggapan bahwa kebutaan sejak lahir membuktikan keberdosaan. Terjemahan tidak menyelesaikan ketegangan teologis itu.
- issue: Cakupan tindakan mengusir
  choice: Teks utama memakai 'mengusirnya keluar', dengan catatan tentang kemungkinan cakupannya.
  alternative: Mereka mengucilkannya dari sinagoge.
  rationale: Kata-kata Yunani menyatakan pengusiran, tetapi ayat ini sendiri tidak secara eksplisit menyebut sinagoge. Implikasi pengucilan komunal tidak dimasukkan secara pasti ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan 'menjawab dan berkata' sengaja dipertahankan untuk mencerminkan gaya Yohanes. Bentuk jamak 'dosa-dosa' agak tidak lazim, tetapi penting untuk menjaga bentuk dan daya tuduh teks Yunani.
