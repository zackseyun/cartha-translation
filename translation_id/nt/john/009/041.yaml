  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: id
  text: Yesus berkata kepada mereka, “Sekiranya kamu buta, kamu tidak akan mempunyai dosa.[a] Namun sekarang kamu berkata, ‘Kami melihat’; dosamu tetap ada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamu tidak akan bersalah.” Bahasa Yunani memakai kata “dosa,” yang dalam konteks ini dapat juga mencakup makna kesalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: buta
  rationale: Padanan langsung yang mempertahankan metafora kebutaan dalam konteks pasal ini tanpa menambahkan penafsiran ‘secara rohani’ ke dalam teks utama.
- source_word: οὐκ ἂν εἴχετε
  choice: kamu tidak akan mempunyai
  rationale: Bentuk imperfek dengan ἄν menyatakan akibat yang berlawanan dengan kenyataan; susunan ini menyampaikan makna kondisional tersebut secara jelas.
- source_word: ἁμαρτίαν
  choice: dosa
  rationale: Padanan leksikal langsung yang mempertahankan pemakaian khas Yohanes; dalam konteks ini kata tersebut juga dapat mencakup nuansa kesalahan atau tanggung jawab moral.
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: Menandai pertentangan antara keadaan hipotetis dan kenyataan saat ini dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: kamu berkata, ‘Kami melihat’
  rationale: Mempertahankan peralihan retoris dari orang kedua jamak ke kutipan langsung orang pertama jamak serta ironi dalam ucapan itu.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: dosamu tetap ada
  rationale: Menyampaikan keadaan yang terus berlangsung dari μένει secara alami; ‘tetap ada’ lebih idiomatis daripada ‘tinggal’ dalam konteks ini.
theological_decisions:
- issue: Apakah kebutaan rohani dan kesalahan di hadapan Allah perlu dinyatakan secara eksplisit
  choice: Mempertahankan istilah sederhana ‘buta’ dan ‘dosa’ dalam teks utama.
  alternative: ‘Sekiranya kamu buta secara rohani, kamu tidak akan bersalah karena dosa.’
  rationale: Konteks menunjukkan persepsi rohani, tetapi perkataan Yesus tetap memakai metafora kebutaan jasmani yang dikembangkan sepanjang pasal. Penjelasan eksplisit akan mempersempit ambiguitas dan ketegangan teologis teks Yunani.
- issue: Hubungan logis klausa terakhir dengan pengakuan ‘Kami melihat’
  choice: Menerjemahkan hubungan akibat secara eksplisit dengan ‘Karena itu’.
  alternative: 'Menghubungkan klausa hanya dengan tanda baca: ‘Namun sekarang kamu berkata, “Kami melihat”; dosamu tetap ada.’'
  rationale: Teks Yunani menjajarkan klausa-klausa tersebut tanpa konjungsi akibat yang dinyatakan. ‘Karena itu’ mengungkapkan hubungan yang kuat tersirat dalam konteks dan menghasilkan bahasa Indonesia yang lancar, meskipun alternatif yang lebih formal mempertahankan asindeton.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ‘buta’, ‘melihat’, dan ‘dosa’ dipertahankan untuk menjaga metafora serta ironi khas Yohanes. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang diterangkannya.
