id: JHN.9.22
reference: John 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: id
  text: Orang tuanya mengatakan hal-hal itu karena mereka takut kepada orang-orang Yahudi[a]. Sebab, orang-orang Yahudi sudah sepakat bahwa jika seseorang mengakui dia sebagai Mesias[b], orang itu akan dikucilkan dari sinagoge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “orang-orang Yahudi.” Dalam konteks ini, sebutan tersebut kemungkinan besar merujuk kepada para pemegang wewenang Yahudi yang dapat menjatuhkan pengucilan dari sinagoge, bukan kepada semua orang Yahudi tanpa kecuali.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “mengakui dia sebagai Kristus” atau “mengakui bahwa dialah Mesias.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: mengatakan hal-hal itu
  rationale: Mempertahankan bentuk jamak ταῦτα dan memakai ungkapan naratif Indonesia yang alami.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: orang tuanya
  rationale: Padanan idiomatis dan ringkas untuk 'kedua orang tuanya' tanpa perlu menambahkan unsur yang tidak dinyatakan.
- source_word: ὅτι ἐφοβοῦντο
  choice: karena mereka takut
  rationale: ὅτι menyatakan alasan, sedangkan bentuk imperfek ἐφοβοῦντο menunjukkan keadaan takut yang sedang berlangsung.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan eksplisit teks Yunani; catatan kaki menjelaskan bahwa dalam konteks ini yang dimaksud kemungkinan besar ialah para pemegang wewenang Yahudi.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: Sebab, orang-orang Yahudi sudah sepakat
  rationale: γὰρ memperkenalkan penjelasan, ἤδη berarti 'sudah', dan bentuk pluskuamperfek συνετέθειντο menunjuk pada kesepakatan yang telah dibuat sebelumnya.
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν
  choice: jika seseorang mengakui dia sebagai Mesias
  rationale: ὁμολογέω di sini berarti mengakui secara terbuka, sedangkan χριστόν berfungsi sebagai gelar bagi Yesus.
- source_word: ἀποσυνάγωγος γένηται
  choice: orang itu akan dikucilkan dari sinagoge
  rationale: Menyampaikan akibat berupa pengucilan dari komunitas sinagoge dengan jelas, tanpa mempersempitnya menjadi sekadar dikeluarkan dari sebuah gedung.
theological_decisions:
- issue: Makna χριστόν sebagai gelar
  choice: Mesias
  alternative: Kristus; Sang Kristus
  rationale: Dalam konteks ini χριστός merupakan gelar mesianik yang diakui tentang Yesus, bukan nama diri.
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi, dengan catatan kontekstual
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks utama mempertahankan keluasan istilah Yunani, sementara catatan mencegah pemahaman bahwa semua orang Yahudi tanpa kecuali sedang dimaksudkan.
- issue: Cakupan ἀποσυνάγωγος
  choice: dikucilkan dari sinagoge
  alternative: dikeluarkan dari sinagoge
  rationale: Istilah ini dapat mencakup penyingkiran dari kehidupan komunitas sinagoge; 'dikucilkan' mempertahankan dimensi sosialnya tanpa menentukan mekanisme yang tidak dijelaskan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pengulangan 'orang-orang Yahudi' dipertahankan sesuai teks sumber. Frasa 'orang itu' dipakai untuk meneruskan τις secara jelas dan alami.
