  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Engkau sudah melihat Dia, dan orang yang berbicara denganmu itulah Dia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Bentuk aoristus λέγω dengan datif penerima paling wajar diterjemahkan sebagai ujaran langsung, tanpa mempertegasnya menjadi ‘memberi tahu’.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: Engkau sudah melihat Dia
  rationale: Bentuk perfektum ὁράω menyatakan tindakan melihat yang telah terjadi dan tetap relevan pada saat percakapan; ‘sudah melihat’ menyampaikan nuansa itu secara alami dalam bahasa Indonesia. Καί tidak perlu diterjemahkan sebagai ‘dan’ pada awal kalimat karena dalam bahasa Indonesia hubungan dengan klausa berikut tetap jelas dan lebih alami.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: yang sedang berbicara denganmu
  rationale: Partisipel kini substantival menunjukkan orang yang sedang berbicara. μετά dengan genitif secara harfiah berarti ‘dengan’, dan ungkapan ‘berbicara denganmu’ alami dalam bahasa Indonesia.
- source_word: ἐκεῖνός ἐστιν
  choice: Dia adalah
  rationale: Rumus identifikasi ini menyatakan bahwa orang yang sedang berbicara itu adalah sosok yang baru disebut. Susunan ‘Dia adalah yang sedang berbicara denganmu’ mempertahankan identifikasi langsung tanpa mengulang gelar dari ayat sebelumnya.
theological_decisions:
- issue: Identifikasi diri Yesus sebagai sosok yang ditanyakan dalam konteks sebelumnya
  choice: Dia adalah yang sedang berbicara denganmu
  alternative: orang yang sedang berbicara denganmu, Dialah itu
  rationale: Terjemahan mempertahankan identifikasi langsung tetapi tidak menambahkan kembali gelar ‘Anak Manusia’, yang tidak diulang dalam teks Yunani ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ‘Engkau’ sesuai untuk sapaan tunggal dalam dialog Alkitab, sedangkan ‘Dia’ ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia saat merujuk kepada Yesus. Bentuk ‘denganmu’ mempertahankan μετά σοῦ dan tidak memerlukan catatan kaki karena sepenuhnya alami dalam bahasa Indonesia.
