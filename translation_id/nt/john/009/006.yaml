  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: id
  text: Setelah mengatakan semua itu, Dia meludah ke tanah dan membuat lumpur dari ludah tersebut. Lalu Dia mengoleskan[a] lumpur itu pada mata orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: mengurapi mata orang itu dengan lumpur tersebut. Kata Yunani yang dipakai dapat berarti “mengurapi” atau “mengoleskan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Setelah mengatakan hal-hal itu
  rationale: Partisip aoris menunjukkan bahwa perkataan tersebut mendahului tindakan-tindakan utama. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan urutan waktunya.
- source_word: ἔπτυσεν χαμαί
  choice: Dia meludah ke tanah
  rationale: χαμαί berarti ke tanah atau di tanah. Ungkapan ini menyampaikan tindakan fisik tersebut secara lugas dan alami.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: membuat lumpur dari ludah tersebut
  rationale: πηλός dapat berarti tanah liat atau lumpur; karena bahan ini terbentuk dari ludah dan tanah, 'lumpur' paling wajar dalam konteks ini. 'Ludah tersebut' menerjemahkan πτύσμα dan merujuk kembali pada tindakan sebelumnya.
- source_word: ἐπέχρισεν
  choice: mengoleskan
  rationale: ἐπιχρίω dapat berarti mengoleskan atau mengurapi. Karena objeknya lumpur dan tindakannya berupa penerapan fisik pada mata, 'mengoleskan' jelas dan alami tanpa menambahkan nuansa upacara yang tidak dinyatakan secara eksplisit.
- source_word: αὐτοῦ ... ἐπὶ τοὺς ὀφθαλμούς
  choice: pada mata orang itu
  rationale: αὐτοῦ merujuk kepada orang buta dalam konteks. Menyebut 'orang itu' menghindari ketaksaan pronomina bahasa Indonesia yang dapat membuat pembaca mengira bahwa yang dimaksud adalah mata Yesus.
- source_word: τὸν πηλόν
  choice: lumpur itu
  rationale: Artikel menunjuk kembali kepada lumpur yang baru saja dibuat, sehingga bentuk definit ini mempertahankan hubungan acuannya.
theological_decisions:
- issue: Kemungkinan nuansa seremonial pada ἐπέχρισεν
  choice: mengoleskan lumpur itu pada mata orang itu
  alternative: mengurapi mata orang itu dengan lumpur tersebut
  rationale: Kata kerjanya memang dapat diterjemahkan 'mengurapi', tetapi konteks langsung menggambarkan tindakan fisik dengan lumpur, bukan tindakan kultis yang dinyatakan secara eksplisit. Terjemahan utama tetap netral, sedangkan kemungkinan leksikal lainnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat sederhana dan bermartabat. 'Dia' dipakai untuk rujukan kepada Yesus sesuai register naratif yang hormat, sedangkan 'orang itu' memperjelas rujukan αὐτοῦ. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami dan mudah dipahami tanpa mengubah urutan tindakan.
