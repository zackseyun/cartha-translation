base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: id
  text: Lalu mereka berkata kepadanya, “Apa yang Ia lakukan kepadamu? Bagaimana Ia membuka matamu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: mereka berkata
  rationale: Bentuk aoris dari λέγω memperkenalkan ujaran langsung. Walaupun isi ujarannya berupa pertanyaan, verba Yunani yang dipakai berarti umum ‘berkata’, bukan verba khusus ‘bertanya’.
- source_word: οὖν
  choice: Lalu
  rationale: Dalam konteks ini οὖν melanjutkan alur percakapan dengan nuansa konsekuensial ringan. ‘Lalu’ alami dalam bahasa Indonesia dan tidak seformal ‘karena itu’.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Dativus ini menandai penerima ujaran, yaitu orang yang tadinya buta.
- source_word: Τί ἐποίησέν σοι
  choice: Apa yang dilakukan-Nya kepadamu?
  rationale: Ungkapan ini mempertahankan ποιέω dengan dativus sebagai tindakan yang dikenakan kepada orang tersebut, tanpa menambahkan nuansa manfaat seperti ‘untukmu’.
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Bagaimana Ia membuka matamu?
  rationale: ‘Bagaimana’ menyatakan pertanyaan tentang cara atau sarana, sedangkan konstruksi Yunani mengenai anggota tubuh diterjemahkan secara alami dengan bentuk posesif ‘matamu’.
theological_decisions:
- issue: Rujukan kepada pelaku yang membuka mata
  choice: kata ganti hormat ‘-Nya/Ia’
  alternative: ‘dia’
  rationale: Konteks merujuk kepada Yesus. Kapitalisasi kata ganti mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia sebagai penanda rujukan ilahi, tanpa mengubah isi proposisional ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur dua pertanyaan dipertahankan, demikian juga nada pemeriksaan yang langsung.
