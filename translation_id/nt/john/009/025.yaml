id: JHN.9.25
reference: John 9:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: id
  text: 'Lalu orang itu menjawab, “Apakah dia orang berdosa, aku tidak tahu.[a] Satu hal yang aku tahu: dahulu aku buta, tetapi sekarang aku melihat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika dia orang berdosa, aku tidak tahu.”
    reason: Alternatif ini mempertahankan arti kondisional yang mungkin dari εἰ, meskipun dalam konteks ini arti pertanyaan tidak langsung lebih alami.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang langsung dan wajar untuk verba tanggapan dalam dialog.
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan percakapan secara alami tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: ἐκεῖνος
  choice: orang itu
  rationale: Mempertahankan daya tunjuk pronomina Yunani yang merujuk kembali kepada orang yang tadinya buta.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Apakah dia orang berdosa
  rationale: Dalam ujaran tak langsung sesudah verba mengetahui, εἰ secara idiomatis menyatakan pertanyaan tidak langsung, sehingga 'apakah' lebih tepat daripada menjadikannya syarat.
- source_word: οὐκ οἶδα
  choice: aku tidak tahu
  rationale: Menyampaikan bentuk perfektum οἶδα yang bermakna keadaan mengetahui pada masa kini.
- source_word: ἓν οἶδα
  choice: Satu hal yang aku tahu
  rationale: Mempertahankan penekanan pada satu kepastian yang dikontraskan dengan ketidaktahuan sebelumnya.
- source_word: τυφλὸς ὢν
  choice: dahulu aku buta
  rationale: Mengungkapkan keadaan latar yang sudah berlalu secara alami dalam bahasa Indonesia dan mempertahankan kontras dengan keadaan sekarang.
- source_word: ἄρτι βλέπω
  choice: sekarang aku melihat
  rationale: Mempertahankan kontras temporal dan bentuk pernyataan yang sederhana serta kuat.
theological_decisions:
- issue: Kesaksian orang yang disembuhkan tidak boleh diubah menjadi penilaian narator mengenai apakah Yesus berdosa.
  choice: Apakah dia orang berdosa, aku tidak tahu.
  alternative: Jika dia orang berdosa, aku tidak tahu.
  rationale: Terjemahan utama mempertahankan keterbatasan pengetahuan si pembicara dan tidak menyelesaikan ketegangan teologis di luar apa yang ia katakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti 'aku' dipakai sesuai ujaran pribadi dalam dialog; struktur kontras dibuat alami tanpa mengurangi ketegasan kesaksian.
