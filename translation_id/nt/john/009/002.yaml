id: JHN.9.2
reference: John 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: id
  text: Murid-murid-Nya bertanya kepada-Nya, “Rabi, siapakah yang berdosa, orang ini atau orang tuanya, sehingga ia dilahirkan buta?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa Yunani ini dapat menyatakan hubungan tujuan atau akibat yang diasumsikan dalam pertanyaan para murid.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: bertanya
  rationale: Bentuk aoris ini menyatakan tindakan bertanya secara langsung; “bertanya” paling alami dan tidak menambahkan kesan menginterogasi.
- source_word: μαθηταὶ
  choice: murid-murid
  rationale: Istilah ini mempertahankan hubungan pengikut dengan guru dan merupakan padanan baku dalam narasi Injil.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Bentuk sapaan Yahudi ini ditransliterasikan untuk mempertahankan warna historisnya dan tetap mudah dipahami pembaca Indonesia.
- source_word: ἥμαρτεν
  choice: yang berdosa
  rationale: Padanan langsung ini menyampaikan pertanyaan tentang pihak yang telah berbuat dosa tanpa menambahkan sifat atau kadar dosa.
- source_word: οὗτος
  choice: orang ini
  rationale: Kata tunjuk tersebut merujuk kepada laki-laki yang buta; “orang ini” jelas dan alami dalam konteks.
- source_word: γονεῖς
  choice: orang tuanya
  rationale: Padanan lazim untuk kedua orang tua, dengan pronomina yang menyatakan hubungan kepada laki-laki tersebut.
- source_word: ἵνα
  choice: sehingga
  rationale: Dalam pertanyaan ini, ἵνα menghubungkan dosa yang diperkirakan para murid dengan keadaan buta sejak lahir. “Sehingga” mempertahankan nuansa tujuan/akibat tanpa memastikan hubungan sebab-akibat itu sebagai pandangan narator.
- source_word: τυφλὸς γεννηθῇ
  choice: ia dilahirkan buta
  rationale: Ungkapan ini mempertahankan bentuk pasif dan menyatakan bahwa kebutaan sudah ada sejak kelahiran.
theological_decisions:
- issue: Nuansa hubungan ἵνα antara dosa dan kebutaan sejak lahir
  choice: sehingga ia dilahirkan buta
  alternative: dengan akibat ia dilahirkan buta
  rationale: Terjemahan mempertahankan anggapan yang terkandung dalam pertanyaan para murid, tetapi tidak menyatakannya sebagai ajaran yang dibenarkan oleh narator.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sapaan “Rabi” mempertahankan latar Yahudi. Struktur pertanyaan dibuat alami tanpa menghilangkan ketegangan teologis dalam anggapan para murid.
