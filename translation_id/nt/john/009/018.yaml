revisions:
- from: Karena itu, orang-orang Yahudi tidak percaya bahwa ia tadinya buta dan kemudian dapat melihat, sampai mereka memanggil orang tua dari orang yang telah dapat melihat itu.[a]
  to: Karena itu, orang-orang Yahudi[a] tidak percaya bahwa ia sebelumnya buta dan telah menerima penglihatan sampai mereka memanggil orang tua dari orang yang telah menerima penglihatan itu.
  rationale: Revisi mengganti ungkapan kemampuan melihat dengan padanan peristiwa pemulihan penglihatan, menghilangkan tambahan temporal yang tidak diperlukan, memperhalus frasa partisipial terakhir, dan menempatkan jangkar catatan kaki pada ungkapan yang dijelaskannya. Rujukan οἱ Ἰουδαῖοι serta ambiguitas kontekstualnya tetap dipertahankan.
