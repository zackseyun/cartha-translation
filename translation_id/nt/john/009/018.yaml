id: JHN.9.18
reference: John 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: id
  text: Karena itu, orang-orang Yahudi[a] tidak percaya bahwa ia sebelumnya buta dan telah menerima penglihatan sampai mereka memanggil orang tua dari orang yang telah menerima penglihatan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “para pemimpin Yahudi” atau “orang-orang Yudea”, bergantung pada bagaimana ungkapan “orang-orang Yahudi” dalam Injil Yohanes dipahami dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: tidak percaya
  rationale: Dengan klausa isi yang diperkenalkan oleh ὅτι, kata ini menyatakan tidak menerima suatu fakta sebagai benar; “tidak percaya” merupakan padanan Indonesia yang alami.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ungkapan Yunani secara langsung berarti “orang-orang Yahudi.” Konteks mungkin menunjuk pada kalangan pemimpin atau kelompok penyelidik tertentu, tetapi teks utama tidak mempersempit rujukannya.
- source_word: περὶ αὐτοῦ
  choice: bahwa ia
  rationale: Dalam susunan Indonesia, makna “mengenai dia” secara alami terwakili dengan langsung menghubungkan kata “percaya” kepada klausa fakta tentang dirinya, tanpa menghasilkan ungkapan kaku.
- source_word: ἦν τυφλὸς
  choice: ia tadinya buta
  rationale: “Tadinya” menyatakan keadaan buta yang mendahului kesembuhan dan secara alami mencerminkan sudut pandang naratif kala lampau.
- source_word: ἀνέβλεψεν
  choice: kemudian dapat melihat
  rationale: Dalam konteks penyembuhan, ἀναβλέπω berarti memperoleh kemampuan melihat. Pilihan ini tidak menyiratkan bahwa ia pernah dapat melihat sebelumnya, sebagaimana mungkin tersirat oleh “melihat kembali.”
- source_word: ἕως ὅτου
  choice: sampai
  rationale: Padanan temporal yang ringkas dan wajar untuk batas waktu tindakan mereka.
- source_word: ἐφώνησαν
  choice: memanggil
  rationale: φωνέω dapat berarti memanggil atau menyuruh datang; “memanggil” cukup tepat tanpa menambahkan nuansa resmi yang tidak wajib.
- source_word: γονεῖς
  choice: orang tua
  rationale: Padanan baku dan tepat untuk γονεῖς.
- source_word: τοῦ ἀναβλέψαντος
  choice: dari orang yang telah dapat melihat itu
  rationale: Mempertahankan bentuk pengenal partisipial berdasarkan peristiwa diperolehnya penglihatan, tanpa menambahkan unsur yang tidak dinyatakan.
theological_decisions:
- issue: Rujukan dan nuansa οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks utama mempertahankan cakupan leksikal ungkapan Yunani dan tidak memastikan rujukan sosiologis yang lebih sempit. Catatan kaki mengakui bahwa dalam konteks Yohanes ungkapan ini dapat menunjuk pada kelompok tertentu, sehingga pembaca tidak harus memahaminya sebagai seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Urutan “tadinya buta dan kemudian dapat melihat” memperjelas hubungan waktu tanpa menambah gagasan bahwa orang tersebut pernah melihat sebelum kebutaannya. Penanda catatan kaki ditempatkan setelah kalimat karena catatan menjelaskan ungkapan “orang-orang Yahudi” dalam ayat tersebut.
