id: JHN.9.39
reference: John 9:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: id
  text: Lalu Yesus berkata, “Untuk penghakiman[a] Aku datang ke dalam dunia ini, supaya mereka yang tidak melihat dapat melihat, dan mereka yang melihat menjadi buta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu penghakiman.” Ungkapan Yunani εἰς κρίμα dapat menekankan dampak yudisial dari kedatangan Yesus, bukan hanya penghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: penghakiman
  rationale: Kata ini menunjuk pada dampak atau hasil penghakiman yang menyingkapkan keadaan manusia. 'Penghakiman' mempertahankan keluasan makna dan tidak mempersempitnya menjadi penghukuman semata.
- source_word: κόσμον
  choice: dunia
  rationale: '''Dunia'' merupakan padanan baku dan sesuai dengan pemakaian Yohanes untuk ranah kehidupan manusia tempat Yesus datang.'
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: mereka yang tidak melihat / mereka yang melihat
  rationale: Bentuk paralel ini mempertahankan ambiguitas antara penglihatan jasmani dan rohani serta tidak mempersempit bagian pertama menjadi sebutan 'orang buta'.
- source_word: βλέπωσιν
  choice: dapat melihat
  rationale: Ungkapan ini alami setelah 'supaya' dan tetap memuat kemungkinan makna jasmani maupun rohani.
- source_word: τυφλοὶ γένωνται
  choice: menjadi buta
  rationale: Terjemahan ini mempertahankan daya hasil dari γένωνται dan pembalikan tajam dalam perkataan Yesus.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: Aku datang ke dalam dunia ini
  rationale: '''Ke dalam dunia ini'' mempertahankan arah εἰς serta bahasa khas Yohanes mengenai kedatangan Yesus.'
theological_decisions:
- issue: Hubungan ayat ini dengan Yohanes 3:17, yang mengatakan bahwa Anak tidak datang untuk menghakimi dunia
  choice: Mempertahankan 'penghakiman' tanpa melunakkan ketegangan
  alternative: Menerjemahkan sebagai 'pemisahan', 'krisis', atau 'penghukuman'
  rationale: 'Ayat ini menggambarkan kedatangan Yesus sebagai peristiwa yang menghasilkan penyingkapan dan pembalikan yudisial: yang tidak melihat dapat melihat, sedangkan yang melihat menjadi buta. Terjemahan tidak menyelaraskan atau menyelesaikan ketegangan teologis itu secara diam-diam.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'Aku' mengikuti ujaran langsung Yesus. Susunan paralel dipertahankan agar ironi dan pembalikan retoris ayat tetap jelas.
