  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: id
  text: Ia menjawab mereka, “Aku sudah mengatakannya kepada kalian, tetapi kalian tidak mendengarkan.[a] Mengapa kalian ingin mendengarnya lagi? Kalian juga tidak ingin menjadi murid-Nya, bukan?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi kalian tidak mendengarnya.” Kata Yunani yang dipakai dapat berarti ‘mendengar’ atau ‘mendengarkan’; dalam konteks ini kemungkinan besar maksudnya ialah mereka tidak mengindahkan apa yang dikatakan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Tentunya kalian juga tidak ingin menjadi murid-Nya?” Pertanyaan Yunani ini memakai μή, yang mengantisipasi jawaban negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Ia menjawab mereka
  rationale: Padanan naratif yang langsung dan wajar untuk verba respons ἀποκρίνομαι beserta objek tidak langsung αὐτοῖς.
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa pemberitahuan itu telah dilakukan sebelumnya; 'sudah' merupakan padanan Indonesia yang alami.
- source_word: οὐκ ἠκούσατε
  choice: kalian tidak mau mendengarkan
  rationale: Dalam konteks ini ἀκούω menunjuk bukan sekadar tidak mendengar secara indrawi, melainkan tidak mengindahkan keterangan yang telah diberikan. Unsur 'mau' membuat teguran itu alami dalam bahasa Indonesia, sementara alternatif harfiahnya dicatat.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Mengapa kalian ingin mendengarnya lagi?
  rationale: τί dalam konteks pertanyaan bernada jengkel paling alami dipahami sebagai 'mengapa'; objek '-nya' tersirat dari pernyataan sebelumnya.
- source_word: μὴ καὶ ὑμεῖς
  choice: Jangan-jangan kalian juga
  rationale: Pertanyaan dengan μή mengantisipasi jawaban negatif. 'Jangan-jangan' menyampaikan dugaan retoris dan nada sindiran secara alami, tanpa mengubahnya menjadi pernyataan tegas.
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: menjadi murid-Nya
  rationale: '''Menjadi'' mempertahankan aspek memasuki keadaan dari γενέσθαι, dan ''murid-Nya'' adalah konstruksi posesif Indonesia yang alami.'
theological_decisions:
- issue: Daya retoris pertanyaan terakhir
  choice: “Jangan-jangan kalian juga ingin menjadi murid-Nya?”
  alternative: “Kalian juga tidak ingin menjadi murid-Nya, bukan?”
  rationale: μή menunjukkan bahwa penanya mengantisipasi jawaban negatif. Bentuk 'jangan-jangan' mempertahankan pertanyaan bernada sindiran dan terasa lebih idiomatis dalam bahasa Indonesia; catatan kaki menjelaskan kecenderungan gramatikal tersebut tanpa meniadakan bentuk pertanyaannya.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada lugas dan bermartabat. Pronomina jamak 'kalian' dipakai untuk memperjelas ὑμεῖν/ὑμεῖς; 'Ia' dan enklitik hormat '-Nya' mengikuti register Alkitab Indonesia yang umum. Nada jengkel dan sindiran dipertahankan tanpa dibuat kasar.
