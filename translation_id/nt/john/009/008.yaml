  source_fidelity: Draf secara umum menyampaikan alur dan pertanyaan retoris Yunani dengan baik. Namun, penambahan “sering” pada θεωροῦντες tidak dinyatakan oleh teks dan tidak perlu untuk menerjemahkan partisip itu. Terjemahan “mengemis” lebih langsung untuk προσαιτῶν daripada “meminta-minta.”
  naturalness: Susunan revisi tetap baku dan alami dalam bahasa Indonesia modern. “Maka” berfungsi wajar sebagai penghubung naratif untuk οὖν, dan “melihatnya” lebih lancar daripada “melihat dia.”
  terminology: “Pengemis” dan “mengemis” adalah padanan jelas, lazim, dan konsisten bagi προσαίτης dan προσαιτῶν. Tidak ada istilah teologis khusus dalam ayat ini.
