  - severity: low
    issue: “Meminta-minta” kurang langsung untuk προσαιτῶν.
    rationale: Walaupun dapat dipahami dalam konteks, “mengemis” secara leksikal lebih tepat dan menghindari kemungkinan pemahaman umum ‘meminta berulang-ulang’ yang tidak khusus berarti meminta sedekah.
