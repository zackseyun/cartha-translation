  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: id
  text: Maka para tetangga dan orang-orang yang sebelumnya melihatnya sebagai pengemis berkata, “Bukankah ini orang yang biasa duduk dan mengemis?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Bukankah ini orang yang duduk dan mengemis?” Bahasa Yunani memakai bentuk partisip (“duduk” dan “mengemis”) untuk mengenali dia berdasarkan kegiatan yang dahulu biasa dilakukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang berkaitan dengan peristiwa sebelumnya; ungkapan ini mempertahankan daya penghubung dan inferensialnya secara wajar dalam bahasa Indonesia.
- source_word: γείτονες
  choice: para tetangga
  rationale: Secara langsung menunjuk kepada orang-orang yang tinggal di dekatnya.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: orang-orang yang dahulu sering melihat dia
  rationale: θεωροῦντες berarti melihat atau mengamati, sedangkan τὸ πρότερον menunjuk pada waktu sebelumnya. Kata 'sering' menyampaikan bahwa mereka mengenalnya dari pengamatan yang lazim pada masa lalu.
- source_word: ὅτι προσαίτης ἦν
  choice: sebagai pengemis
  rationale: Dalam konteks ini, frasa tersebut menjelaskan keadaan atau identitas ketika mereka dahulu melihatnya, tanpa memaksakan hubungan sebab-akibat pada ὅτι.
- source_word: ἔλεγον
  choice: berkata
  rationale: Imperfek Yunani menggambarkan ujaran yang sedang berlangsung atau berulang di antara mereka. Bahasa Indonesia tidak wajib menandai aspek itu secara eksplisit; 'berkata' tetap alami dalam narasi kelompok.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Bukankah dia ini
  rationale: Mempertahankan bentuk pertanyaan yang mengharapkan jawaban setuju serta penekanan deiktis pada οὗτός.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: orang yang biasa duduk dan meminta-minta
  rationale: Kedua partisip substantival mengidentifikasi orang itu melalui kegiatan lamanya yang lazim. 'Biasa' menyampaikan sifat kebiasaan tersebut, dan 'meminta-minta' merupakan padanan alami bagi tindakan meminta sedekah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada naratif. Kata 'meminta-minta' dipilih karena mudah dipahami dan sesuai dengan tindakan mengemis; 'biasa' memperjelas kebiasaan masa lalu tanpa mengubah identitas tokoh.
