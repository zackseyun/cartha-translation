id: JHN.9.31
reference: John 9:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: id
  text: Kita tahu bahwa Allah tidak mendengarkan orang-orang berdosa. Namun, jika seseorang takut akan Allah[a] dan melakukan kehendak-Nya, Allah mendengarkan orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang penyembah Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Kita tahu
  rationale: Bentuk perfek οἶδα berfungsi dengan makna kini dalam bahasa Yunani Koine. “Kita tahu” merupakan padanan Indonesia yang alami dan mempertahankan bentuk orang pertama jamak.
- source_word: ἁμαρτωλῶν
  choice: orang-orang berdosa
  rationale: Bentuk genitif jamak bersama ἀκούει menunjuk kepada golongan orang yang dimaksud. Pilihan ini mempertahankan daya moral dan religius istilah tersebut.
- source_word: ἀκούει
  choice: mendengarkan
  rationale: Dalam konteks ini, ἀκούω dengan objek orang berarti mendengar dengan sikap berkenan atau menanggapi, bukan sekadar menangkap bunyi. “Mendengarkan” menyampaikan nuansa itu tanpa mempersempitnya menjadi “mengabulkan”.
- source_word: θεοσεβὴς
  choice: takut akan Allah
  rationale: θεοσεβής menggambarkan orang yang menghormati dan hidup dengan rasa gentar kepada Allah. Ungkapan “takut akan Allah” alami dalam ragam Alkitab Indonesia dan tetap mempertahankan rujukan eksplisit kepada Allah.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: melakukan kehendak-Nya
  rationale: Ini adalah padanan yang alami dan dekat bagi ungkapan ποιεῖν τὸ θέλημα, dengan kata ganti hormat “-Nya” yang merujuk kepada Allah.
- source_word: τούτου ἀκούει
  choice: Allah mendengarkan orang itu
  rationale: τούτου secara tegas merujuk kembali kepada orang yang takut akan Allah dan melakukan kehendak-Nya. Mengulangi subjek “Allah” dan verba “mendengarkan” menghasilkan kalimat Indonesia yang jelas serta menjaga kesejajaran dengan klausa pertama.
- source_word: ἀλλ’ ἐάν τις
  choice: Namun, jika seseorang
  rationale: Ungkapan ini memperkenalkan syarat yang berlawanan dengan pernyataan sebelumnya. “Namun, jika seseorang” mempertahankan kontras dan sifat tunggal tak tentu.
theological_decisions:
- issue: Cakupan pernyataan bahwa Allah tidak mendengarkan orang-orang berdosa
  choice: Pernyataan diterjemahkan sebagaimana diucapkan, tanpa dilunakkan atau dijadikan rumusan doktrinal yang lebih luas.
  alternative: Allah tidak mendengarkan doa orang-orang berdosa; Allah tidak berkenan kepada orang-orang berdosa.
  rationale: Teks Yunani hanya menyatakan bahwa Allah tidak “mendengarkan” orang-orang berdosa, lalu mengontraskannya dengan orang yang takut akan Allah dan melakukan kehendak-Nya. Terjemahan mempertahankan ketegangan pernyataan sang pembicara dalam konteks tanpa menentukan setiap kemungkinan makna teologis dari tindakan Allah mendengar.
- issue: Makna θεοσεβής
  choice: takut akan Allah
  alternative: seorang penyembah Allah
  rationale: Pilihan utama mempertahankan makna sifat berupa hormat dan gentar kepada Allah, sedangkan alternatif dapat memberi kesan yang lebih sempit pada kegiatan ibadah. Karena keduanya mungkin secara leksikal, alternatif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kita” dipakai karena pembicara memasukkan dirinya bersama para pendengar dalam pengetahuan bersama. Pengulangan “Allah” pada klausa terakhir menghindari ketidakjelasan kata ganti dan tetap alami dalam bahasa Indonesia.
