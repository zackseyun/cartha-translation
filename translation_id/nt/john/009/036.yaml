  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: id
  text: Ia menjawab, “Dan siapakah dia, Tuhan,[a] supaya aku percaya kepadanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat menjadi sapaan hormat maupun berarti “Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Ia menjawab
  rationale: Ungkapan naratif Yunani secara harfiah memuat dua verba, ‘menjawab dan berkata’. Dalam bahasa Indonesia modern, ‘Ia menjawab’ menyampaikan fungsinya secara alami tanpa pengulangan yang kaku.
- source_word: Καὶ τίς ἐστιν
  choice: Dan siapakah dia
  rationale: Kata penghubung Καὶ dipertahankan untuk menjaga kesinambungan langsung pertanyaan, sedangkan τίς ἐστιν diterjemahkan secara lugas sebagai ‘siapakah dia’.
- source_word: κύριε
  choice: Tuhan
  rationale: ‘Tuhan’ mempertahankan padanan utama κύριε sekaligus ketegangan teologis dalam narasi. Karena sapaan ini juga dapat berarti ‘Tuan’ sebagai bentuk penghormatan, kemungkinan itu dicatat dalam catatan kaki.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: supaya aku percaya kepadanya
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan; ‘supaya’ membuat hubungan tujuan itu jelas. ‘Percaya kepada’ merupakan ungkapan Indonesia yang alami bagi πιστεύω εἰς dan mempertahankan bahasa iman dalam teks.
theological_decisions:
- issue: Makna κύριε sebelum pengakuan eksplisit orang yang disembuhkan
  choice: Tuhan
  alternative: Tuan
  rationale: κύριε dapat menjadi sapaan hormat biasa atau gelar ‘Tuhan’. Teks utama mempertahankan ‘Tuhan’, sementara catatan kaki menjaga ambiguitas kontekstual agar tingkat pengenalan sang pembicara tidak dipastikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina ‘Ia’ dipakai untuk alur naratif; bentuk ‘aku’ dalam ujaran langsung sesuai dengan percakapan pribadi. Pengulangan formal ‘menjawab dan berkata’ diringkas secara idiomatis.
