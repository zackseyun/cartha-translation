  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: id
  text: Maka orang-orang Farisi pun bertanya lagi kepadanya bagaimana ia dapat melihat.[a] Ia berkata kepada mereka, “Ia menaruh lumpur[b] pada mataku, lalu aku membasuh diri, dan sekarang aku dapat melihat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagaimana ia memperoleh penglihatannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tanah liat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Maka ... bertanya lagi
  rationale: οὖν melanjutkan alur narasi dan πάλιν menandai pengulangan pertanyaan; susunan ini alami dalam bahasa Indonesia tanpa membuat hubungan logisnya terlalu kuat.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: orang-orang Farisi pun
  rationale: Partikel “pun” menyampaikan fungsi καί yang memasukkan orang-orang Farisi sebagai pihak yang juga mengajukan pertanyaan.
- source_word: ἠρώτων
  choice: bertanya
  rationale: Bentuk imperfek dapat menunjukkan tindakan yang sedang berlangsung atau berulang; bersama “lagi,” terjemahan ini menyampaikan pengulangan secara alami.
- source_word: πῶς ἀνέβλεψεν
  choice: bagaimana ia dapat melihat kembali
  rationale: Dalam konteks penyembuhan orang buta, ἀναβλέπω berarti memperoleh atau memperoleh kembali penglihatan. “Dapat melihat kembali” jelas bagi pembaca modern, sementara catatan kaki mempertahankan kemungkinan ungkapan yang tidak menekankan unsur “kembali.”
- source_word: Πηλόν
  choice: lumpur
  rationale: πηλός dapat berarti lumpur atau tanah liat. “Lumpur” paling alami dalam konteks bahan basah yang dioleskan pada mata; alternatifnya dicatat.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: mengoleskan ... pada mataku
  rationale: Secara dasar frasa ini berarti menaruh atau meletakkan pada mata. Karena bendanya berupa lumpur, “mengoleskan” merupakan ungkapan Indonesia yang alami tanpa mengubah tindakan pokoknya.
- source_word: ἐνιψάμην
  choice: aku membasuh diri
  rationale: Bentuk medium menyatakan bahwa orang itu melakukan pembasuhan pada dirinya sendiri. Terjemahan ini tidak menambahkan objek tertentu yang tidak disebutkan secara eksplisit dalam ayat.
- source_word: βλέπω
  choice: sekarang aku dapat melihat
  rationale: Kala kini menekankan keadaan yang sedang berlaku sebagai hasil tindakan sebelumnya. “Sekarang” membuat hasil kini itu jelas, sedangkan “dapat melihat” adalah ungkapan Indonesia yang lebih alami daripada “aku melihat” dalam konteks pulihnya penglihatan.
