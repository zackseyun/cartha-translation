translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan orang ketiga memakai “ia” dalam narasi. Ungkapan “orang itu” memperjelas bahwa subjek tindakan dalam jawaban adalah Yesus tanpa memasukkan nama yang tidak terdapat dalam ayat ini. Penanda catatan kaki ditempatkan pada kata atau frasa yang benar-benar memiliki alternatif leksikal terkait.
