  verdict: revise
  source_fidelity: Frasa “melihat kembali” untuk ἀνέβλεψεν berpotensi menyatakan bahwa orang itu sebelumnya pernah melihat, padahal konteks Yohanes 9 adalah seorang yang buta sejak lahir. Dalam konteks ini verba tersebut menyatakan bahwa ia memperoleh penglihatan/dapat melihat. Selain itu, “orang itu” tidak ada dalam teks Yunani; subjeknya cukup dinyatakan dengan “Ia,” yang mengacu kepada Yesus dari konteks sebelumnya.
  naturalness: Bahasa draf umumnya modern dan jelas. Namun, “bagaimana ia dapat melihat” lebih alami dan tidak menimbulkan implikasi pemulihan penglihatan sebelumnya. “Ia menaruh lumpur pada mataku” merupakan padanan yang lugas bagi tindakan menaruh lumpur pada mata.
  terminology: “Orang-orang Farisi,” “lumpur,” dan “penglihatan” sesuai dengan register Alkitab bahasa Indonesia modern. Catatan alternatif “tanah liat” tepat untuk πηλός.
