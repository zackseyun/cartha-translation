  to: Maka orang-orang Farisi pun bertanya lagi kepadanya bagaimana ia dapat melihat.[a] Ia berkata kepada mereka, “Ia menaruh lumpur[b] pada mataku, lalu aku membasuh diri, dan sekarang aku dapat melihat.”
