  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: id
  text: Lalu beberapa orang Farisi berkata, “Orang ini bukan berasal dari Allah, karena ia tidak menaati Sabat.” Namun, yang lain berkata, “Bagaimana mungkin orang berdosa[a] dapat melakukan tanda-tanda seperti itu[b]?” Dan terjadi perpecahan di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang pendosa.” Teks Yunani memakai kata sifat “berdosa” untuk menerangkan “orang.”
    reason: lexical_alternative
  - marker: b
    text: Yohanes sering memakai “tanda-tanda” untuk karya-karya Yesus guna menekankan sifatnya sebagai penyataan. Alternatifnya, “tanda-tanda ajaib” membuat implikasi itu lebih eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: beberapa orang ... berkata
  rationale: Bentuk imperfek ἔλεγον menggambarkan ujaran yang berlangsung dalam adegan. Bahasa Indonesia tidak perlu menandai aspek itu dengan bentuk progresif yang kaku; susunan ini tetap alami dalam narasi.
- source_word: οὖν
  choice: Karena itu
  rationale: Mengungkapkan hubungan lanjutan atau kesimpulan dengan konteks sebelumnya tanpa memperberat gaya.
- source_word: ἐκ τῶν Φαρισαίων
  choice: dari kalangan Farisi
  rationale: Menunjukkan bahwa para pembicara itu merupakan sebagian dari kelompok Farisi.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Orang ini
  rationale: Wajar dalam bahasa Indonesia dan mempertahankan penunjukan langsung tanpa menambahkan nada slang atau penghinaan yang tidak tersurat.
- source_word: παρὰ θεοῦ
  choice: berasal dari Allah
  rationale: παρά dengan genitif menyatakan sumber atau asal. Pilihan ini tidak memperluasnya menjadi 'diutus oleh Allah', yang tidak dinyatakan secara eksplisit.
- source_word: τηρεῖ τὸ σάββατον
  choice: memelihara hari Sabat
  rationale: Ungkapan ini menyampaikan arti menaati atau menjalankan Sabat dan lazim dipahami dalam ragam Alkitab bahasa Indonesia.
- source_word: ἁμαρτωλὸς
  choice: berdosa
  rationale: Mempertahankan bentuk kata sifat yang menerangkan ἄνθρωπος, yakni 'orang berdosa', sambil memberi alternatif nominal dalam catatan kaki.
- source_word: τοιαῦτα σημεῖα
  choice: tanda-tanda seperti ini
  rationale: Menjaga istilah khas Yohanes σημεῖα dan menerjemahkan τοιαῦτα secara alami tanpa mereduksinya menjadi sekadar mukjizat.
- source_word: σχίσμα
  choice: perpecahan
  rationale: Menyatakan keterbelahan atau perselisihan nyata di dalam kelompok dengan bahasa Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Makna teologis σημεῖα dalam Injil Yohanes
  choice: tanda-tanda
  alternative: mukjizat; tanda-tanda ajaib
  rationale: Yohanes memakai σημεῖα untuk karya yang menunjuk melampaui peristiwa itu sendiri kepada makna penyataan. 'Tanda-tanda' mempertahankan nuansa tersebut tanpa menambahkan kata yang tidak ada.
- issue: Pernyataan bahwa Yesus berasal dari Allah
  choice: berasal dari Allah
  alternative: diutus oleh Allah
  rationale: Terjemahan ini mempertahankan gagasan sumber atau asal serta ketegangan teologis dalam perdebatan, tanpa mempersempitnya menjadi rumusan pengutusan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah 'memelihara hari Sabat' dipertahankan karena dikenal luas, sedangkan susunan lain dibuat alami bagi pembaca masa kini.
