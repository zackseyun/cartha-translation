  to: Lalu beberapa orang Farisi berkata, “Orang ini bukan berasal dari Allah, karena ia tidak menaati Sabat.” Namun, yang lain berkata, “Bagaimana mungkin orang berdosa[a] dapat melakukan tanda-tanda seperti itu[b]?” Dan terjadi perpecahan di antara mereka.
