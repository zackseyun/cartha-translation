source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: id
  text: Tetapi, bagaimana ia sekarang melihat, kami tidak tahu; atau siapa yang membuka matanya, kami tidak tahu. Tanyakanlah kepadanya; ia sudah cukup umur. Ia sendiri akan berbicara tentang dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia dapat berbicara untuk dirinya sendiri.” Bentuk mendatang dalam bahasa Yunani dapat berfungsi sebagai penegasan praktis bahwa ia mampu atau bertanggung jawab untuk menjawab sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Namun, bagaimana sekarang ia dapat melihat
  rationale: πῶς berarti 'bagaimana', δέ memberi peralihan ringan yang cocok diterjemahkan 'namun', νῦν berarti 'sekarang', dan βλέπει berarti 'melihat'. Dalam bahasa Indonesia, 'dapat melihat' secara alami menyatakan keadaan bahwa ia kini memiliki penglihatan tanpa menentukan bagaimana hal itu terjadi.
- source_word: οὐκ οἴδαμεν
  choice: kami tidak tahu
  rationale: Padanan langsung bagi ungkapan 'kami tidak tahu'. Pengulangannya dipertahankan untuk mencerminkan penekanan dan gaya kesaksian dalam teks Yunani.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: atau siapa yang membuka matanya
  rationale: Terjemahan ini mempertahankan pertanyaan alternatif serta ungkapan naratif 'membuka mata' yang menghubungkan ayat ini dengan mukjizat yang sedang dibicarakan.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Tanyakanlah kepadanya
  rationale: Bentuk perintah jamak diterjemahkan sebagai perintah langsung yang wajar dalam bahasa Indonesia. Kejamakan para pendengar sudah ditentukan oleh konteks.
- source_word: ἡλικίαν ἔχει
  choice: ia sudah cukup umur
  rationale: Dalam konteks pemeriksaan ini, frasa tersebut menunjuk pada usia yang memadai untuk menjawab dan memberi keterangan sendiri, bukan pada tinggi badan. 'Sudah cukup umur' alami dan tepat dalam bahasa Indonesia.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Ia sendiri akan berbicara tentang dirinya
  rationale: αὐτός diberi tekanan melalui 'sendiri', περί ἑαυτοῦ diterjemahkan 'tentang dirinya', dan bentuk mendatang λαλήσει dipertahankan sebagai 'akan berbicara'. Rumusan ini menjaga nuansa kesaksian pribadi tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Makna ἡλικίαν ἔχει dalam konteks
  choice: Menunjuk pada usia yang cukup untuk menjawab secara mandiri
  alternative: Menunjuk secara umum pada kedewasaan, atau pada tinggi badan
  rationale: Konteksnya adalah keengganan orang tua dan pemeriksaan oleh para pemimpin. Pernyataan yang sama dalam ayat 23 menjelaskan mengapa mereka mengarahkan para penanya kepada anak mereka. Karena itu, usia yang memadai untuk memberi jawaban sendiri merupakan makna kontekstual yang paling kuat.
- issue: Daya ungkap αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Pernyataan bahwa orang itu sendiri akan memberi keterangan mengenai dirinya
  alternative: Pernyataan sederhana bahwa ia akan berbicara tentang dirinya, atau penegasan praktis bahwa ia dapat menjawab sendiri
  rationale: Latar pemeriksaan memberi klausa ini nuansa kesaksian, tetapi terjemahan mempertahankan bentuk mendatang Yunani dan tidak mengubahnya langsung menjadi pernyataan kemampuan. Alternatif pragmatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'kami tidak tahu' dipertahankan sesuai teks sumber. Penanda catatan kaki ditempatkan pada klausa terakhir karena catatan tersebut menerangkan bentuk mendatang λαλήσει, bukan verba βλέπει pada awal ayat.
