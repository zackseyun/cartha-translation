lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itulah
  rationale: Frasa ini menunjuk kembali pada alasan yang dijelaskan dalam ayat 22 dan mempertahankan hubungan sebab-akibat secara alami dalam bahasa Indonesia.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: orang tuanya
  rationale: Bentuk jamak γονεῖς merujuk secara kolektif kepada ayah dan ibu laki-laki itu; “orang tuanya” adalah padanan Indonesia yang alami dan tepat.
- source_word: εἶπαν
  choice: berkata
  rationale: Kata kerja ini menyatakan tindakan berbicara secara umum; “berkata” tidak menambahkan nuansa menjawab atau memberitahukan yang tidak dinyatakan secara khusus.
- source_word: Ἡλικίαν ἔχει
  choice: Ia sudah cukup umur
  rationale: Ungkapan idiomatis ini berarti bahwa ia telah mencapai usia yang memadai untuk berbicara dan bertanggung jawab atas jawabannya sendiri. Pilihan ini alami dalam bahasa Indonesia tanpa mempersempit maknanya menjadi status hukum tertentu.
- source_word: αὐτὸν ἐπερωτήσατε
  choice: tanyakanlah kepadanya sendiri
  rationale: Bentuk imperatif mengarahkan para penanya untuk bertanya langsung kepada laki-laki itu. “Sendiri” menyampaikan penekanan pada αὐτόν secara alami.
