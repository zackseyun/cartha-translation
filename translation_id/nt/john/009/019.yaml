  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: id
  text: Mereka bertanya kepada kedua orang tuanya, “Apakah ini anak kalian, yang kalian katakan lahir buta? Kalau begitu, bagaimana ia sekarang melihat?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς
  choice: Mereka bertanya kepada kedua orang tuanya
  rationale: Kata ganti αὐτούς merujuk kepada kedua orang tua dalam konteks ayat sebelumnya. Penyebutan rujukannya secara eksplisit membuat bahasa Indonesia jelas dan alami tanpa mengubah makna.
- source_word: λέγοντες
  choice: (tidak diterjemahkan tersendiri)
  rationale: Partisipel ini memperkenalkan isi pertanyaan. Dalam bahasa Indonesia, fungsi tersebut sudah disampaikan secara alami oleh tanda koma dan kutipan langsung setelah 'bertanya'.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Apakah ini anak kalian
  rationale: Walaupun susunan Yunaninya berbentuk deklaratif, konteks dan rangkaian interogasi menunjukkan fungsi pertanyaan. 'Kalian' mempertahankan bentuk jamak ὑμῶν dan sesuai untuk menyapa kedua orang tua.
- source_word: ὃν ὑμεῖς λέγετε
  choice: yang menurut kalian
  rationale: Ungkapan ini menyampaikan laporan netral tentang apa yang dikatakan kedua orang tua. Pilihan ini tidak menambahkan nada skeptis seperti 'yang kalian akui' atau 'yang kalian klaim'.
- source_word: τυφλὸς ἐγεννήθη
  choice: lahir buta
  rationale: Padanan Indonesia yang ringkas dan lazim untuk kondisi buta sejak lahir.
- source_word: πῶς οὖν
  choice: Kalau begitu, bagaimana
  rationale: Οὖν menandai kesimpulan atau konsekuensi dari pernyataan sebelumnya. 'Kalau begitu' mempertahankan hubungan logis itu secara alami.
- source_word: βλέπει ἄρτι
  choice: sekarang ia dapat melihat
  rationale: ἄρτι menunjukkan keadaan sekarang yang berlawanan dengan kebutaan sejak lahir. Dalam idiom Indonesia, 'dapat melihat' secara wajar menyatakan bahwa ia kini memiliki penglihatan; bukan sekadar kemungkinan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan 'kalian' dipakai karena rujukannya jamak, yaitu kedua orang tua. Tidak ada catatan kaki yang diperlukan.
