id: JHN.21.9
reference: John 21:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: id
  text: Ketika mereka naik ke darat[a], mereka melihat api arang[b] di sana, ikan di atasnya, dan roti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka tiba di darat.” Secara lebih harfiah, bahasa Yunaninya mengatakan bahwa mereka keluar ke daratan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang diterjemahkan “api arang” juga dipakai dalam Yohanes 18:18, dalam kisah ketika Petrus menyangkal Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Ketika
  rationale: Menyampaikan hubungan waktu dan melanjutkan alur cerita secara wajar dalam bahasa Indonesia. οὖν berfungsi sebagai penghubung naratif dan tidak perlu selalu diterjemahkan dengan kata tersendiri seperti “maka”.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: mereka turun ke darat
  rationale: Menggambarkan tindakan keluar dari perahu menuju daratan tanpa menambahkan kata “perahu” yang hanya tersirat dari konteks.
- source_word: βλέπουσιν
  choice: mereka melihat
  rationale: Bentuk kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang alami tanpa mengubah urutan peristiwa.
- source_word: ἀνθρακιὰν
  choice: api arang
  rationale: Padanan yang jelas dan alami, sekaligus mempertahankan hubungan verbal dengan Yohanes 18:18.
- source_word: κειμένην
  choice: di situ
  rationale: Dalam kaitannya dengan api, ungkapan ini menyampaikan keadaan bahwa api itu ada atau telah disiapkan di tempat tersebut tanpa frasa harfiah yang kaku seperti “terbaring”.
- source_word: ὀψάριον
  choice: ikan
  rationale: Dalam pemakaian Yohanes, kata ini secara alami menunjuk pada ikan sebagai makanan. Bentuk Indonesia “ikan” tidak memaksakan apakah yang dimaksud satu ekor atau ikan secara kolektif.
- source_word: ἐπικείμενον
  choice: terletak di atasnya
  rationale: Menjelaskan bahwa ikan berada di atas api arang sambil mempertahankan gambaran spasial teks Yunani.
- source_word: ἄρτον
  choice: roti
  rationale: Padanan umum yang tidak menentukan secara berlebihan jumlah atau bentuk rotinya.
theological_decisions:
- issue: Bentuk kini historis dalam narasi
  choice: βλέπουσιν diterjemahkan “mereka melihat” dalam alur lampau
  alternative: Mempertahankan efek kini yang hidup, misalnya “mereka pun melihat” atau bentuk naratif kini
  rationale: Ini terutama persoalan gaya, bukan penetapan teologis. Bahasa Indonesia tidak perlu menandai kala secara morfologis; rumusan yang dipilih menyajikan peristiwa secara alami dalam rangkaian narasi.
- issue: Hubungan verbal dengan penyangkalan Petrus
  choice: Memakai istilah “api arang” dan memberi catatan silang ke Yohanes 18:18
  alternative: Memakai ungkapan umum seperti “perapian” atau “bara api”
  rationale: Istilah yang sama, ἀνθρακιά, muncul dalam Yohanes 18:18. Mempertahankan padanan yang sama memungkinkan pembaca melihat kaitan sastra itu tanpa menyatakan secara dogmatis makna teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Susunan “dengan ikan terletak di atasnya, serta roti” membedakan ikan yang berada di atas api dari roti, yang tidak secara eksplisit dikatakan berada di atas api.
