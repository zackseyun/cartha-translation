  naturalness: “Dengan ikan terletak di atasnya, serta roti” dapat dipahami, tetapi agak kaku dalam bahasa Indonesia baku modern. “Ikan di atasnya, dan roti” lebih lancar dan tetap membatasi keterangan “di atasnya” pada ikan, bukan pada roti.
  terminology: “Api arang” merupakan padanan yang baik dan konsisten bagi ἀνθρακιά, juga mempertahankan kaitan leksikal dengan Yohanes 18:18. “Ikan” dan “roti” tepat serta tidak memaksakan jumlah. Catatan silang perlu dirapikan agar lebih alami, tanpa menyimpulkan makna teologis dari pengulangan istilah.
