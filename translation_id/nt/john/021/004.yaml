source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: id
  text: Ketika hari sudah mulai terang, Yesus berdiri di tepi danau. Namun, murid-murid tidak tahu bahwa itu Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mengenali bahwa itu Yesus.” Secara lebih harfiah, bahasa Yunani berbunyi “tidak tahu bahwa itu Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Ketika hari mulai terang
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu. Ungkapan ini secara alami menyampaikan datangnya fajar atau pagi hari; δέ berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: ἔστη
  choice: berdiri
  rationale: Bentuk aoris dari ἵστημι menyatakan bahwa Yesus berdiri atau mengambil posisi di sana; 'berdiri' mempertahankan bentuk sederhana teks sumber.
- source_word: εἰς τὸν αἰγιαλόν
  choice: di tepi danau
  rationale: Dengan verba 'berdiri', εἰς dapat menunjuk posisi. αἰγιαλός berarti pantai atau tepi perairan; dalam konteks Danau Tiberias, 'tepi danau' paling jelas dan alami.
- source_word: οὐ μέντοι
  choice: Namun
  rationale: Gabungan ini menandai kontras antara kehadiran Yesus dan ketidaktahuan para murid.
- source_word: ᾔδεισαν
  choice: tidak tahu
  rationale: Verba οἶδα secara harfiah berarti 'tahu'. Konteks memungkinkan nuansa 'mengenali', tetapi teks utama mempertahankan keluasan ungkapan sumber.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Artikel Yunani menunjuk kelompok murid yang sudah diketahui dari konteks; bahasa Indonesia tidak memerlukan penambahan kata ganti kepunyaan.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: bahwa itu Yesus
  rationale: Ini merupakan bentuk identifikasi yang wajar dalam bahasa Indonesia dan menyampaikan klausa Yunani tanpa menambahkan penjelasan.
theological_decisions:
- issue: Para murid tidak mengidentifikasi Yesus sesudah kebangkitan
  choice: tidak tahu bahwa itu Yesus
  alternative: tidak mengenali bahwa itu Yesus
  rationale: Ayat ini menyatakan fakta bahwa mereka belum mengetahui atau mengenali Yesus, tetapi tidak menjelaskan penyebabnya. Terjemahan tidak menambahkan kesimpulan tentang rupa Yesus atau keadaan persepsi para murid.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. 'Tepi danau' dipilih berdasarkan konteks Danau Tiberias. Penanda catatan ditempatkan sesudah klausa yang dijelaskannya.
