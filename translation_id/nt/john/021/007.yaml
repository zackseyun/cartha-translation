  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: id
  text: Maka murid yang dikasihi Yesus itu berkata kepada Petrus, “Itu Tuhan!” Maka, ketika Simon Petrus mendengar bahwa itu Tuhan, ia mengikatkan pakaian luarnya di sekeliling tubuhnya—sebab ia tidak berpakaian lengkap[a]—lalu menerjunkan dirinya ke laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telanjang.” Kata Yunani yang dipakai dapat berarti telanjang atau tidak berpakaian lengkap, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Maka ... berkata
  rationale: οὖν melanjutkan alur sekaligus mengaitkan perkataan murid itu dengan peristiwa sebelumnya; “maka” alami dalam narasi Indonesia dan tidak memaksakan hubungan sebab-akibat yang terlalu kuat.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: murid yang dikasihi Yesus itu
  rationale: Demonstratif ἐκεῖνος dipertahankan secara alami dengan “itu”, sementara ungkapan khas Yohanes dan bentuk kasihnya tetap terpelihara.
- source_word: Ὁ κύριός ἐστιν
  choice: Itu Tuhan!
  rationale: Dalam konteks pengenalan seseorang, bahasa Indonesia idiomatis memakai “Itu Tuhan”; “Tuhan” mempertahankan bobot sapaan κύριος kepada Yesus. Tanda seru menyampaikan seruan langsung tanpa menambah isi semantis.
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: Ketika Simon Petrus mendengar
  rationale: Partisipel aoris ἀκούσας dinyatakan sebagai anak kalimat waktu. Hubungan naratif οὖν tetap tersirat jelas oleh urutan tindakan dan ungkapan “ketika”, sehingga pengulangan “maka” dihindari.
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: mengikatkan pakaian luarnya pada tubuhnya
  rationale: ἐπενδύτης adalah pakaian luar, sedangkan διεζώσατο menyatakan tindakan mengenakan atau mengikatkannya pada diri, bukan sekadar mengambilnya.
- source_word: ἦν γὰρ γυμνός
  choice: sebab ia tidak berpakaian lengkap
  rationale: γυμνός dapat berarti telanjang atau berpakaian tidak lengkap. Pilihan ini sesuai dengan konteks kerja di perahu dan keberadaan pakaian luar, sambil mempertahankan alternatif literal dalam catatan kaki.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: menerjunkan dirinya ke danau
  rationale: Ungkapan refleksif mempertahankan daya gambar tindakan yang segera dan kuat. θάλασσα secara leksikal berarti laut, tetapi dalam konteks ini menunjuk Danau Tiberias/Galilea; “danau” paling jelas dan alami bagi pembaca Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος ketika murid mengenali Yesus
  choice: Tuhan
  alternative: Tuan / Guru
  rationale: “Tuhan” mempertahankan baik fungsi sapaan kepada Yesus maupun bobot kristologisnya dalam konteks penampakan sesudah kebangkitan, tanpa menjelaskan maknanya secara berlebihan.
- issue: Keadaan Petrus yang disebut γυμνός
  choice: tidak berpakaian lengkap
  alternative: telanjang
  rationale: Kata Yunani itu memiliki rentang makna yang mencakup telanjang dan tidak berpakaian lengkap. Teks tidak memastikan ketelanjangan total; terjemahan utama menjaga keluwesan kontekstual, sedangkan arti yang lebih literal dicatat.
- issue: Rujukan θάλασσα
  choice: danau
  alternative: laut
  rationale: Yang dimaksud ialah Danau Tiberias/Galilea. Pilihan geografis ini tidak mengubah muatan teologis dan mencegah kesan bahwa Petrus melompat ke laut terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang wajar dan bermartabat. Susunan kalimat dibuat lancar untuk pembaca umum, sementara demonstratif, urutan tindakan, dan ambiguitas γυμνός tetap dipertahankan.
