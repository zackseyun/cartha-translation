  to: Ada juga banyak hal lain yang dilakukan Yesus; seandainya semuanya dituliskan satu demi satu, saya kira dunia sendiri pun tidak akan cukup luas untuk menampung[a] buku-buku yang akan ditulis.
  rationale: Revisi ini mengganti “Masih ada” dengan “Ada juga” agar tidak menambahkan aspek temporal yang tidak dinyatakan dalam bahasa Yunani, menghubungkan klausa relatif dan pengandaian dengan lebih dekat, serta memakai “buku-buku yang akan ditulis” untuk menyampaikan hasil hipotetis dari partisipel Yunani tanpa memaksakan bentuk harfiahnya. Hiperbola tentang kapasitas dunia dan sisipan rendah hati “saya kira” tetap dipertahankan.
