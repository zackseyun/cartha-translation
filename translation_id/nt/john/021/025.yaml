  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: id
  text: Ada juga banyak hal lain yang dilakukan Yesus; seandainya semuanya dituliskan satu demi satu, saya kira dunia sendiri pun tidak akan cukup luas untuk menampung[a] buku-buku yang akan ditulis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dunia sendiri pun tidak akan dapat memuat buku-buku yang akan ditulis.” Kata kerja Yunani ini dapat berarti “cukup luas untuk menampung” atau “memuat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Masih ada banyak hal lain
  rationale: Mengungkapkan tambahan terhadap perbuatan-perbuatan yang telah dicatat dan membawa daya penghubung δέ secara alami tanpa menambahkan penanda waktu eksplisit.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: yang dilakukan Yesus
  rationale: ποιέω dalam konteks ini menunjuk secara luas pada tindakan atau perbuatan; bentuk pasif relatif ini wajar dalam bahasa Indonesia.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: Seandainya semuanya dituliskan satu demi satu
  rationale: Menjaga sifat hipotesis ἐάν dengan subjungtif serta daya distributif καθ’ ἕν. 'Semuanya' memperjelas bahwa yang ditulis ialah seluruh hal yang baru disebutkan.
- source_word: οὐδ’ αὐτὸν οἶμαι τὸν κόσμον
  choice: saya kira dunia ini sendiri pun tidak
  rationale: Mempertahankan sisipan pribadi οἶμαι dan penekanan intensif αὐτόν pada 'dunia'.
- source_word: χωρήσειν
  choice: akan cukup luas untuk menampung
  rationale: Memadukan citra ruang 'memiliki tempat' dengan makna 'menampung' yang sama-sama tersedia bagi χωρέω, sehingga hiperbola tetap jelas dan alami.
- source_word: τὰ γραφόμενα βιβλία
  choice: kitab-kitab yang ditulis itu
  rationale: Menunjuk pada kitab-kitab yang secara hipotetis dihasilkan oleh penulisan tersebut; bentuk ini lebih alami daripada terjemahan partisipel yang kaku.
theological_decisions:
- issue: Hiperbola retoris tentang kapasitas dunia
  choice: Dunia ini sendiri pun tidak akan cukup luas untuk menampung kitab-kitab itu
  alternative: Akan ada kitab yang tak terhitung banyaknya
  rationale: Citra hiperbolis asli dipertahankan dan tidak diratakan menjadi pernyataan umum tentang jumlah yang sangat banyak.
- issue: Sisipan penilaian pribadi penulis
  choice: saya kira
  alternative: dapat dipastikan
  rationale: οἶμαι menyatakan penilaian retoris orang pertama; terjemahan tidak mengubahnya menjadi klaim kepastian atau menghapus suara narator.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada penutup yang agung namun mudah dipahami. 'Kitab-kitab' dipilih daripada 'buku-buku' karena konteks karya-karya tertulis mengenai perbuatan Yesus, tanpa menyiratkan bahwa masing-masing merupakan bagian dari kanon.
