  naturalness: Teks revisi tetap baku dan alami dalam bahasa Indonesia modern. Titik koma membantu mempertahankan hubungan erat antara “banyak hal lain” dan klausa pengandaian tanpa menghasilkan kalimat yang terlalu panjang.
  terminology: “Buku-buku” adalah padanan netral dan lazim bagi βιβλία dalam konteks ini; istilah itu tidak memberi kesan bahwa setiap karya tersebut adalah “kitab” suci. “Dunia sendiri pun” mempertahankan penekanan αὐτόν, dan “saya kira” mempertahankan οἶμαι.
