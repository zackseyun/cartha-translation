id: JHN.21.12
reference: John 21:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: id
  text: Yesus berkata kepada mereka, “Mari, sarapanlah.”[a] Namun, tidak seorang pun dari murid-murid itu berani bertanya kepada-Nya,[b] “Siapakah Engkau?” Mereka tahu bahwa Dia adalah Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata kerja Yunani ini berarti makan pagi atau sarapan.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “bertanya” juga dapat berarti “menanyai” atau “menyelidiki dengan saksama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Mari
  rationale: Ajakan imperatif ini secara alami diterjemahkan sebagai “Mari” dalam bahasa Indonesia, sesuai dengan undangan Yesus untuk mendekat dan makan.
- source_word: ἀριστήσατε
  choice: sarapanlah
  rationale: Kata kerja ini secara khusus merujuk pada makan pagi; “sarapanlah” ringkas, alami, dan mempertahankan kekhususan waktunya.
- source_word: οὐδεὶς δὲ
  choice: Namun, tidak seorang pun
  rationale: δέ menandai peralihan dengan kontras ringan; “Namun” menyampaikan hubungan itu secara wajar.
- source_word: ἐτόλμα
  choice: berani
  rationale: Bentuk imperfek menyatakan bahwa tak seorang pun mempunyai keberanian untuk mengajukan pertanyaan tersebut; bahasa Indonesia idiomatis memakai “berani” dengan infinitif verbal.
- source_word: ἐξετάσαι
  choice: bertanya kepada-Nya
  rationale: Dalam konteks ujaran langsung, kata ini berarti mengajukan pertanyaan, meskipun dapat memiliki nuansa menyelidiki atau menanyai dengan saksama; nuansa itu dicatat dalam catatan kaki.
- source_word: Σὺ τίς εἶ;
  choice: Siapakah Engkau?
  rationale: Pronomina Yunani yang eksplisit memberi penekanan. “Siapakah Engkau?” mempertahankan pertanyaan identitas dan memakai sapaan hormat yang sesuai dengan konteks.
- source_word: εἰδότες ὅτι
  choice: Mereka tahu bahwa
  rationale: 'Partisipel ini dipertahankan tanpa memaksakan hubungan kausal eksplisit. Kalimat mandiri menghasilkan bahasa Indonesia yang alami sambil mempertahankan ketegangan naratif: mereka tidak bertanya dan mereka tahu.'
- source_word: ὁ κύριός
  choice: Tuhan
  rationale: Dalam konteks penampakan Yesus sesudah kebangkitan, κύριος mempertahankan bobot kristologisnya sebagai “Tuhan,” bukan sekadar “tuan” atau “guru.”
theological_decisions:
- issue: Penerjemahan κύριος yang merujuk kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks pengenalan Yesus yang bangkit mendukung gelar “Tuhan,” yang mempertahankan bobot kristologis tanpa menambahkan penafsiran di luar teks.
- issue: Hubungan logis partisipel εἰδότες dengan keengganan para murid untuk bertanya
  choice: Mereka tahu bahwa
  alternative: karena mereka tahu bahwa
  rationale: Teks Yunani memakai partisipel yang dapat dipahami secara sirkumstansial atau kausal. Terjemahan tidak menambahkan kata “karena,” sehingga tidak mengunci hubungan itu secara lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Mari, sarapanlah” menyampaikan undangan langsung dengan kekhususan makan pagi. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
