  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: id
  text: Simon Petrus, Tomas yang disebut Didimus[a], Natanael dari Kana di Galilea, putra-putra Zebedeus, dan dua orang lain dari antara murid-murid Yesus berada bersama-sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Didimus adalah kata Yunani yang berarti “Kembar”.
    reason: Menjelaskan arti sebutan Yunani Δίδυμος yang tidak tampak bila ditransliterasikan.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: sedang berkumpul
  rationale: Gabungan bentuk imperfek ἦσαν dan ὁμοῦ menyatakan keadaan mereka berada bersama pada saat itu. 'Sedang berkumpul' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka baru mulai berkumpul.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Mengikuti bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Tomas yang disebut Didimus
  rationale: λεγόμενος diterjemahkan secara langsung sebagai 'yang disebut'. Δίδυμος dipertahankan sebagai Didimus, sebutan yang hadir dalam teks Yunani, sementara maknanya dijelaskan dalam catatan kaki.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Natanael dari Kana di Galilea
  rationale: ἀπό menunjukkan asal; 'Kana di Galilea' merupakan ungkapan geografis yang jelas dan alami dalam bahasa Indonesia.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: anak-anak Zebedeus
  rationale: Ungkapan genitif ini secara idiomatis menunjuk kepada anak-anak laki-laki Zebedeus. Bahasa Indonesia dapat memakai bentuk umum 'anak-anak' tanpa perlu menambahkan informasi gender yang sudah dapat dipahami dari konteks.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: dua orang lain dari antara murid-murid Yesus
  rationale: '''Dari antara'' mempertahankan nuansa partitif ἐκ. Nama ''Yesus'' dipakai sebagai rujukan alami bagi αὐτοῦ dalam bahasa Indonesia dan menghindari ketidakjelasan akibat beberapa tokoh laki-laki dalam daftar.'
- source_word: καί ... καί
  choice: daftar dengan koma dan 'dan' sebelum unsur terakhir
  rationale: Pengulangan καί mengoordinasikan semua unsur; tanda koma dan satu 'dan' terakhir menghasilkan daftar yang wajar dalam bahasa Indonesia tanpa mengubah hubungan antartokoh.
