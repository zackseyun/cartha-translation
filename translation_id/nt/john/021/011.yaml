source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: id
  text: Maka Simon Petrus naik ke perahu[a] lalu menarik jala itu ke darat[b]. Jala itu penuh dengan seratus lima puluh tiga ekor ikan besar. Walaupun jumlah ikan itu begitu banyak, jala itu tidak robek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah “naik.” Kata Yunani tidak menyebutkan ke mana Petrus naik; dalam konteks ini, maksudnya kemungkinan besar naik ke perahu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “ke tanah” atau “ke daratan”; dalam konteks ini maksudnya membawa jala keluar dari air ke darat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: naik
  rationale: Secara harfiah berarti ‘naik’. Karena objek atau tujuan tidak dinyatakan dalam teks Yunani, pilihan ini mempertahankan ketaksaan asli; dalam konteksnya, kemungkinan besar Petrus naik ke perahu.
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan atau akibat naratif dari perintah Yesus pada ayat sebelumnya.
- source_word: εἵλκυσεν
  choice: menarik
  rationale: Padanan langsung dan wajar untuk tindakan membawa jala menuju darat.
- source_word: τὸ δίκτυον
  choice: jala itu
  rationale: ‘Jala’ adalah istilah Indonesia yang lazim untuk alat penangkap ikan; unsur definit diteruskan dengan ‘itu’.
- source_word: εἰς τὴν γῆν
  choice: ke darat
  rationale: Secara harfiah berarti ‘ke tanah/daratan’; dalam adegan penangkapan ikan, ‘ke darat’ menyampaikan arah gerakan dari air secara alami.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: penuh dengan ikan-ikan besar
  rationale: Meneruskan gambaran isi jala secara langsung dan jelas.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: seratus lima puluh tiga ekor
  rationale: Mempertahankan angka yang eksplisit; ‘ekor’ merupakan penggolong alami bagi ikan dalam bahasa Indonesia.
- source_word: τοσούτων ὄντων
  choice: Walaupun ikannya sebanyak itu
  rationale: Menyampaikan fungsi konsesif konstruksi genitif absolut dan mempertahankan kaitannya dengan banyaknya ikan.
- source_word: οὐκ ἐσχίσθη
  choice: tidak robek
  rationale: Mencerminkan bentuk pasif dan menyatakan bahwa jala tetap utuh meskipun menanggung banyak ikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. ‘Naik’ dipertahankan tanpa objek dalam teks utama untuk menjaga ketaksaan sumber, sedangkan kemungkinan naik ke perahu dijelaskan dalam catatan kaki. Ayat dibagi menjadi tiga kalimat agar mudah dibaca tanpa mengubah hubungan gagasannya.
