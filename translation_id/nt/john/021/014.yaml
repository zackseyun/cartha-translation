  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: id
  text: Ini adalah kali ketiga Yesus menyatakan diri kepada murid-murid setelah Ia dibangkitkan dari antara orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ini adalah kali ketiga Yesus menampakkan diri kepada murid-murid setelah Ia dibangkitkan dari antara orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Ini adalah kali ketiga
  rationale: Ungkapan ini secara alami merujuk pada peristiwa yang baru diceritakan dan menyatakan urutan kemunculan. Nuansa ἤδη tersirat dalam tercapainya hitungan 'kali ketiga' tanpa perlu menambahkan 'sekarang' yang terasa kurang alami dalam bahasa Indonesia.
- source_word: ἐφανερώθη
  choice: menyatakan diri
  rationale: Bentuk ini mempertahankan gagasan bahwa Yesus menjadi nyata atau memperlihatkan diri kepada para murid, sekaligus terdengar alami. Alternatif 'menampakkan diri' dicatat karena sangat sesuai dengan konteks kemunculan pascakebangkitan.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: Mengikuti bentuk definit dalam bahasa Yunani tanpa menambahkan kata milik 'murid-murid-Nya', meskipun hubungan itu jelas dari konteks.
- source_word: ἐγερθεὶς
  choice: setelah Ia dibangkitkan
  rationale: Partisip aoris pasif menunjukkan tindakan yang mendahului verba utama. Terjemahan ini memperjelas hubungan waktu dan mempertahankan bentuk pasif sumber.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Menyampaikan secara cukup dekat idiom Yunani yang secara harfiah menunjuk pada kebangkitan dari antara mereka yang mati, dengan bahasa Indonesia yang tetap dapat dipahami.
theological_decisions:
- issue: Bentuk pasif dalam bahasa kebangkitan ἐγερθεὶς ἐκ νεκρῶν
  choice: setelah Ia dibangkitkan dari antara orang mati
  alternative: setelah Ia bangkit dari antara orang mati
  rationale: Teks utama mempertahankan bentuk pasif Yunani dan tidak mengubahnya menjadi bentuk aktif/intransitif. Pilihan ini menjaga bentuk sumber tanpa menetapkan secara eksplisit pelaku yang tidak disebut dalam ayat.
- issue: Makna ἐφανερώθη dalam konteks penampakan Yesus
  choice: menyatakan diri
  alternative: menampakkan diri
  rationale: Pilihan utama menjaga nuansa 'menjadi nyata/terungkap' yang khas verba φανερόω, sedangkan alternatif kontekstualnya mengungkapkan tindakan kemunculan secara lebih langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Ia' mengikuti kebiasaan penulisan rujukan kepada Yesus dalam terjemahan Alkitab Indonesia, tanpa menambah unsur yang tidak terdapat dalam sumber.
