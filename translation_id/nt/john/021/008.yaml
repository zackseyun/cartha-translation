translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Yunani dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan logisnya. “Darat” dipilih daripada “pantai” untuk mengikuti γῆ secara lebih langsung, sedangkan konteks tetap menunjukkan tepian danau.
