base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: id
  text: Namun, murid-murid yang lain datang dengan perahu kecil itu. Mereka tidak jauh dari darat, hanya kira-kira dua ratus hasta[a] jauhnya, sambil menyeret jala yang berisi ikan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dua ratus hasta kira-kira sama dengan 90 meter.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, frasa Yunani ini menghubungkan “jala” dengan “ikan-ikan” (“jala ikan”). Dalam konteks ini, kemungkinan maksudnya adalah jala yang berisi ikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Namun, murid-murid yang lain
  rationale: δέ menandai peralihan yang sekaligus mengontraskan tindakan para murid lain dengan tindakan Petrus dalam ayat sebelumnya; “Namun” menyampaikan hubungan itu secara alami.
- source_word: τῷ πλοιαρίῳ
  choice: dengan perahu kecil itu
  rationale: πλοιάριον adalah bentuk diminutif; “perahu kecil” mempertahankan nuansanya. Dativus menyatakan sarana atau kendaraan dan paling alami diterjemahkan “dengan” dalam bahasa Indonesia.
- source_word: ἦλθον
  choice: datang
  rationale: Aoristus ἔρχομαι menyatakan tindakan utama dalam urutan narasi dan secara wajar diterjemahkan “datang”.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: Mereka tidak jauh dari darat
  rationale: γάρ memberi alasan bagi tindakan mereka; hubungan penjelas tetap jelas tanpa menerjemahkannya secara kaku. γῆ dalam konteks ini menunjuk daratan yang berlawanan dengan air.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: hanya kira-kira dua ratus hasta jauhnya
  rationale: ἀλλά sesudah penyangkalan membatasi jarak, sehingga “hanya” alami dalam bahasa Indonesia. ὡς menandai perkiraan. Satuan budaya sumber dipertahankan sebagai “hasta” dan dijelaskan dalam catatan kaki.
- source_word: σύροντες
  choice: sambil menyeret
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung bersamaan dengan kedatangan mereka; “sambil menyeret” mempertahankan hubungan tersebut dan daya fisik yang tersirat dalam σύρω.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: jala yang berisi ikan
  rationale: Genitif τῶν ἰχθύων paling mungkin menyatakan isi, yakni ikan yang berada di dalam jala. “Yang berisi ikan” alami dan tidak menambahkan gagasan bahwa jala itu sepenuhnya penuh.
