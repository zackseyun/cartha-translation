source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: id
  text: Ketika Petrus menoleh, ia melihat murid yang dikasihi Yesus sedang mengikuti[a]. Murid itulah yang pada waktu perjamuan juga bersandar pada dada Yesus dan berkata, “Tuhan, siapakah yang mengkhianati Engkau?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang mengikuti Dia” atau “sedang mengikuti mereka”; partisip Yunani tidak menyatakan objeknya secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: Ketika Petrus menoleh
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan melihat; bentuk ini alami dalam narasi Indonesia tanpa mengubah urutannya.
- source_word: βλέπει
  choice: ia melihat
  rationale: Presens historis Yunani diterjemahkan dengan bentuk naratif Indonesia yang netral dan alami.
- source_word: τὸν μαθητὴν
  choice: murid
  rationale: Istilah baku Yohanes untuk seorang murid Yesus dan mempertahankan kesinambungan leksikal.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: yang dikasihi Yesus
  rationale: Bentuk pasif relatif ini idiomatis dalam bahasa Indonesia serta mempertahankan Yesus sebagai pelaku kasih.
- source_word: ἀκολουθοῦντα
  choice: sedang mengikuti
  rationale: Tidak menambahkan objek yang tidak dinyatakan dalam teks Yunani, sehingga ambiguitas mengenai siapa yang diikuti tetap terpelihara.
- source_word: ἀνέπεσεν
  choice: bersandar
  rationale: Dalam konteks makan sambil berbaring, kata ini menggambarkan gerakan menyandarkan diri; ungkapan tersebut alami bagi pembaca modern.
- source_word: ἐν τῷ δείπνῳ
  choice: pada waktu perjamuan
  rationale: Menunjukkan peristiwa makan tertentu tanpa memasukkan makna liturgis yang tidak dinyatakan oleh kata Yunani.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: pada dada Yesus
  rationale: Mengungkapkan kedekatan fisik sesuai tata cara makan pada masa itu; nama Yesus dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Padanan baku κύριος dalam sapaan langsung kepada Yesus, dengan tetap mempertahankan gema teologis Yohanes.
- source_word: ὁ παραδιδούς σε
  choice: yang akan menyerahkan Engkau
  rationale: Menjaga arti dasar παραδίδωμι, 'menyerahkan', yang dalam konteks kisah sengsara juga membawa makna pengkhianatan, tanpa mempersempitnya secara diam-diam.
theological_decisions:
- issue: Objek implisit pada ἀκολουθοῦντα
  choice: 'Objek tidak ditambahkan: “sedang mengikuti”'
  alternative: “sedang mengikuti Dia” atau “sedang mengikuti mereka”
  rationale: Teks Yunani tidak menyatakan objek. Konteks memungkinkan pembaca mengaitkannya dengan Yesus atau dengan rombongan, sehingga terjemahan mempertahankan ketaktertentuan tersebut.
- issue: Makna παραδιδούς dalam konteks sengsara
  choice: “yang akan menyerahkan Engkau”
  alternative: “yang akan mengkhianati Engkau”
  rationale: “Menyerahkan” mempertahankan cakupan leksikal verba Yunani sekaligus tetap dapat dipahami sebagai tindakan pengkhianatan dalam konteks ini.
- issue: Rujukan αὐτοῦ dalam frasa tentang dada
  choice: Diperjelas menjadi “dada Yesus”
  alternative: “dadanya”
  rationale: Rujukannya adalah Yesus berdasarkan adegan Yohanes 13; penyebutan nama menghindari ambiguitas pronominal yang tidak produktif dalam bahasa Indonesia tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar rangkaian klausa Yunani tetap jelas bagi pembaca umum. Sapaan “Engkau” dipertahankan sebagai bentuk hormat dalam ujaran langsung kepada Yesus.
