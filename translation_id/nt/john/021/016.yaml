  to: Yesus kembali berkata kepadanya, untuk kedua kalinya,[a] “Simon, anak Yohanes, apakah engkau mengasihi Aku?” Petrus berkata kepada-Nya, “Ya, Tuhan, Engkau tahu bahwa aku mengasihi Engkau.” Yesus berkata kepadanya, “Gembalakanlah domba-domba-Ku.”[b]
