  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: id
  text: Yesus kembali berkata kepadanya, untuk kedua kalinya,[a] “Simon, anak Yohanes, apakah engkau mengasihi Aku?” Petrus berkata kepada-Nya, “Ya, Tuhan, Engkau tahu bahwa aku mengasihi Engkau.” Yesus berkata kepadanya, “Gembalakanlah domba-domba-Ku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia berkata kepadanya lagi, untuk kedua kalinya.” Ungkapan Yunani memakai dua penanda pengulangan sekaligus.
    reason: source_emphasis
  - marker: b
    text: Dalam percakapan ini, Yesus memakai verba Yunani agapaō untuk “mengasihi”, sedangkan Petrus menjawab dengan phileō. Sebagian penafsir melihat perbedaan makna; yang lain menganggapnya variasi gaya. Teks utama memakai “mengasihi” untuk keduanya agar tidak melebih-lebihkan perbedaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: Untuk kedua kalinya ... berkata lagi
  rationale: Mempertahankan kedua unsur Yunani—pengulangan (πάλιν) dan urutan kedua (δεύτερον)—dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: Σίμων Ἰωάννου
  choice: Simon, anak Yohanes
  rationale: Genitif Ἰωάννου berfungsi sebagai patronimik. Bentuk ini mengikuti bacaan Yunani 'Yohanes', bukan varian tradisional 'Yunus'.
- source_word: ἀγαπᾷς / φιλῶ
  choice: mengasihi / mengasihi
  rationale: Kedua verba memiliki tumpang tindih makna dalam pemakaian Yohanes. Satu padanan dalam teks utama menghindari penegasan perbedaan yang belum tentu dimaksudkan, sedangkan variasi Yunani dijelaskan dalam catatan kaki.
- source_word: κύριε
  choice: Tuhan
  rationale: Sapaan Petrus kepada Yesus dalam konteks ini bersifat hormat dan mengakui kedudukan-Nya; 'Tuhan' lebih tepat daripada sapaan sopan biasa.
- source_word: σὺ οἶδας
  choice: Engkau tahu
  rationale: Pronomina eksplisit Yunani memberi penekanan ringan yang secara alami dipertahankan melalui bentuk 'Engkau'.
- source_word: Ποίμαινε
  choice: Gembalakanlah
  rationale: Mempertahankan metafora gembala dan mencakup tindakan memelihara, membimbing, serta menjaga, bukan hanya memberi makan.
- source_word: τὰ πρόβατά μου
  choice: domba-domba-Ku
  rationale: Mempertahankan gambaran konkret tentang domba serta hubungan kepemilikan kepada Yesus.
theological_decisions:
- issue: Apakah ἀγαπάω dan φιλέω harus diterjemahkan dengan kata Indonesia yang berbeda
  choice: Keduanya diterjemahkan 'mengasihi' dalam teks utama, dengan variasi leksikal dicatat dalam catatan kaki.
  alternative: Menerjemahkan ἀγαπάω sebagai 'mengasihi' dan φιλέω sebagai 'menyayangi' atau 'mencintai'.
  rationale: Perbedaan verba itu nyata, tetapi kadar perbedaan maknanya dalam konteks ini diperdebatkan dan keduanya sering bertumpang tindih dalam tulisan Yohanes. Memaksakan dua padanan dapat memasukkan perbedaan psikologis atau teologis yang tidak dinyatakan dengan pasti.
- issue: Lingkup perintah Ποίμαινε
  choice: Gembalakanlah
  alternative: Peliharalah; berilah makan
  rationale: '''Gembalakanlah'' mempertahankan metafora pastoral dan tidak mempersempit tugas itu menjadi pemberian makanan saja.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai kapitalisasi hormat sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan awal dipilih untuk mempertahankan pleonasme Yunani πάλιν δεύτερον tanpa menjadi terlalu kaku.
