  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: id
  text: Namun, ia berkata kepada mereka, “Tebarkanlah jala itu di sebelah kanan perahu, dan kalian akan mendapat ikan[a].” Lalu mereka menebarkannya, dan mereka tidak lagi mampu menariknya karena begitu banyaknya ikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan kalian akan menemukan”; objeknya tidak dinyatakan dalam teks Yunani, tetapi tersirat dari konteks penangkapan ikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Tebarkanlah
  rationale: Imperatif aoris βάλλω dalam konteks menangkap ikan paling alami diterjemahkan dengan tindakan menebarkan jala, bukan sekadar melempar.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: di sebelah kanan perahu
  rationale: Ungkapan ini menunjuk pada bagian atau sisi kanan perahu; terjemahan ini jelas dan tidak memakai jargon pelayaran.
- source_word: τὸ δίκτυον
  choice: jala itu
  rationale: δίκτυον adalah jala penangkap ikan; artikel tertentu diteruskan secara alami dengan 'itu' karena jala tersebut sudah diketahui dari konteks.
- source_word: εὑρήσετε
  choice: kalian akan mendapatkannya
  rationale: Objek εὑρήσετε tidak dinyatakan dalam bahasa Yunani, tetapi dipahami dari konteks sebagai ikan atau hasil tangkapan. 'Mendapatkannya' alami dalam bahasa Indonesia sambil mempertahankan objek yang tersirat.
- source_word: ἑλκύσαι ἴσχυον
  choice: mereka tidak sanggup lagi menariknya
  rationale: ἰσχύω menyatakan kekuatan atau kemampuan, sedangkan ἑλκύω berarti menarik. 'Tidak sanggup lagi menariknya' mempertahankan kedua unsur itu secara wajar.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: karena begitu banyaknya ikan
  rationale: ἀπό berfungsi kausal dalam konteks ini dan πλῆθος menyatakan jumlah yang sangat besar. Ungkapan ini alami bagi pembaca modern.
