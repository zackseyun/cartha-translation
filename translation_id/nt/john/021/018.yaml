  to: '“Sesungguhnya, sesungguhnya, Aku berkata kepadamu: ketika engkau masih lebih muda, engkau mengikat pinggangmu sendiri[a] dan berjalan ke mana pun engkau mau. Namun, ketika engkau sudah tua, engkau akan merentangkan tanganmu[b], dan orang lain akan mengikat engkau lalu membawa engkau[c] ke tempat yang tidak engkau kehendaki.”'
