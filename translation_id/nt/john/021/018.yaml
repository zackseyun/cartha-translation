language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: id
  text: '“Sesungguhnya, sesungguhnya, Aku berkata kepadamu: ketika engkau masih lebih muda, engkau mengikat pinggangmu sendiri[a] dan berjalan ke mana pun engkau mau. Namun, ketika engkau sudah tua, engkau akan merentangkan tanganmu[b], dan orang lain akan mengikat engkau lalu membawa engkau[c] ke tempat yang tidak engkau kehendaki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau mengikat dirimu sendiri” dan kemudian “orang lain akan mengikat engkau.” Kata Yunani ini dapat merujuk pada mengikat atau mengencangkan pakaian pada pinggang; ungkapan itu mengontraskan kemandirian Petrus dahulu dengan tindakan orang lain atas dirinya kelak.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “merentangkan tanganmu” sering dipahami sebagai kiasan tentang kematian Petrus melalui penyaliban. Ayat berikutnya menjelaskan bahwa Yesus mengatakan hal ini untuk menunjukkan dengan kematian macam apa Petrus akan memuliakan Allah.
    reason: cross_reference
  - marker: c
    text: Atau “mengangkut engkau” atau “membawa engkau pergi.” Kata Yunani ini dapat menggambarkan seseorang yang dibawa ke tujuan yang tidak dikehendakinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang memberi penegasan khidmat pada rumusan khas dalam Injil Yohanes, dengan bahasa Indonesia yang jelas dan wajar.
- source_word: λέγω σοι
  choice: Aku berkata kepadamu
  rationale: Menerjemahkan sapaan langsung secara dekat dan mempertahankan gaya pernyataan Yesus dalam konteks Yohanes.
- source_word: ὅτε ἦς νεώτερος
  choice: ketika engkau masih lebih muda
  rationale: Mencerminkan bentuk komparatif νεώτερος dan pertentangannya dengan usia tua yang disebut sesudahnya.
- source_word: ἐζώννυες σεαυτόν
  choice: engkau mengikat pakaianmu sendiri
  rationale: ζώννυμι menunjuk pada tindakan mengikat atau mengenakan pakaian. Ungkapan ini mempertahankan gambaran konkret sekaligus menonjolkan kemandirian Petrus pada masa mudanya.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: berjalan ke mana pun engkau mau
  rationale: Di sini περιπατέω merujuk pada gerak fisik biasa, bukan perilaku etis; terjemahan ini mempertahankan gambaran kebebasan bergerak.
- source_word: ὅταν δὲ γηράσῃς
  choice: namun, ketika engkau sudah tua
  rationale: Menyampaikan acuan masa depan dari konstruksi ὅταν dengan subjungtif secara alami dalam bahasa Indonesia, sementara 'namun' menandai kontras δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: engkau akan merentangkan tanganmu
  rationale: Terjemahan langsung yang mempertahankan citra teks tanpa menjelaskan makna kematian secara prematur di dalam ucapan Yesus.
- source_word: ἄλλος σε ζώσει
  choice: orang lain akan mengikatkan pakaianmu
  rationale: Mempertahankan kesejajaran leksikal dengan ἐζώννυες sebelumnya dan kontras antara tindakan sendiri dengan tindakan orang lain atas Petrus.
- source_word: οἴσει
  choice: membawa engkau
  rationale: φέρω dapat berarti membawa atau mengangkut. 'Membawa engkau' terdengar alami serta tetap memungkinkan nuansa bahwa Petrus dibawa tanpa kehendaknya.
- source_word: ὅπου οὐ θέλεις
  choice: ke tempat yang tidak engkau kehendaki
  rationale: Mengungkapkan tujuan yang tidak diinginkan secara lengkap dan alami, tanpa menambahkan tafsiran mengenai tempat tersebut.
theological_decisions:
- issue: Apakah ucapan ini harus diterjemahkan secara eksplisit sebagai nubuat tentang penyaliban Petrus
  choice: Mempertahankan gambaran harfiah dan tidak menyebut penyaliban dalam teks utama
  alternative: Menafsirkan 'merentangkan tangan' dan tindakan orang lain sebagai penyebutan langsung penyaliban atau pengikatan Petrus
  rationale: Ayat berikutnya menjelaskan bahwa Yesus mengatakan hal ini untuk menunjukkan dengan kematian macam apa Petrus akan memuliakan Allah. Membiarkan citra ayat ini tetap utuh mempertahankan urutan penjelasan narasi dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Aku' dan 'engkau' mempertahankan wacana langsung yang personal dan sesuai dengan register Alkitab Indonesia. Struktur kalimat menjaga kesejajaran antara masa muda dan masa tua serta antara kemandirian Petrus dan tindakan orang lain atas dirinya.
