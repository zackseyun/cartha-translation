base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: id
  text: Simon Petrus berkata kepada mereka[a], “Aku pergi memancing.” Kata mereka kepadanya, “Kami juga ikut denganmu.” Mereka pun keluar dan naik ke perahu itu, dan malam itu mereka tidak menangkap apa-apa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, verba yang dipakai berbentuk kini historis (secara harfiah, “Simon Petrus berkata kepada mereka … mereka berkata kepadanya”), suatu ciri umum dalam narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει … λέγουσιν
  choice: berkata … Kata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang tidak menandai waktu secara morfologis. Susunan ini tetap alami dan menjaga pergantian penutur.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Aku pergi menangkap ikan
  rationale: Ὑπάγω menyatakan gerak atau kepergian, sedangkan infinitif ἁλιεύειν menyatakan kegiatan yang dituju. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan yang tidak ada dalam teks.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Kami juga ikut denganmu
  rationale: “Juga” mempertahankan penekanan καὶ ἡμεῖς, sedangkan “ikut denganmu” secara alami menyampaikan gerak bersama dan kebersamaan yang dinyatakan oleh Ἐρχόμεθα dan σὺν σοί.
- source_word: ἐξῆλθον
  choice: Mereka pun keluar
  rationale: “Keluar” mempertahankan makna dasar verba, dan “pun” menandai kelanjutan tindakan secara alami tanpa menambah isi substantif.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: naik ke perahu itu
  rationale: “Naik ke perahu” adalah padanan Indonesia yang lazim untuk tindakan memasuki atau menaiki perahu. “Perahu” sesuai dengan konteks penangkapan ikan, dan “itu” mencerminkan artikel tertentu.
- source_word: ἐν ἐκείνῃ τῇ νυκτὶ
  choice: malam itu
  rationale: Padanan temporal yang ringkas dan idiomatis bagi frasa datif Yunani.
- source_word: ἐπίασαν οὐδέν
  choice: mereka tidak menangkap apa-apa
  rationale: Dalam konteks menangkap ikan, πιάζω berarti “menangkap”; bentuk negatif ini mempertahankan kegagalan total yang dinyatakan oleh οὐδέν.
- source_word: καὶ ἐν ἐκείνῃ τῇ νυκτὶ
  choice: tetapi malam itu
  rationale: Καί secara leksikal bersifat penghubung, tetapi dalam konteks hasil yang berlawanan dengan tujuan mereka, “tetapi” menyatakan hubungan wacana secara alami tanpa mengubah fakta narasi.
