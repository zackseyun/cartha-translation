id: JHN.21.19
reference: John 21:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: id
  text: Ia mengatakan hal ini untuk menunjukkan dengan kematian seperti apa Petrus akan memuliakan Allah.[a] Sesudah mengatakan hal itu, Ia berkata kepadanya,[b] “Ikutlah Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan cara kematian yang bagaimana.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Yunani memakai bentuk kini historis: “Ia berkata kepadanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: untuk menunjukkan
  rationale: Partisip ini menjelaskan maksud perkataan Yesus; 'menunjukkan' alami dalam bahasa Indonesia dan mempertahankan makna menyatakan secara tidak langsung.
- source_word: ποίῳ θανάτῳ
  choice: dengan kematian seperti apa
  rationale: Ungkapan ini mempertahankan nuansa kualitatif ποίῳ dan bentuk datif yang menyatakan sarana atau cara.
- source_word: δοξάσει τὸν θεόν
  choice: akan memuliakan Allah
  rationale: Bentuk futur diterjemahkan secara langsung dan frasa teologisnya dipertahankan tanpa penjelasan tambahan.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina merujuk kepada Petrus dalam konteks terdekat.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Imperatif kini dapat mencakup tindakan langsung sekaligus pemuridan berkelanjutan; bentuk ini alami dan tetap terbuka terhadap kedua nuansa tersebut.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bahasa Indonesia lazim memakai bentuk naratif lampau; catatan kaki mencatat bentuk kini historis dalam bahasa Yunani.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Sesudah mengatakan hal itu
  rationale: Partisip aoris secara alami dinyatakan sebagai klausa temporal yang menunjukkan tindakan sebelumnya.
theological_decisions:
- issue: Subjek tersirat dari δοξάσει
  choice: Petrus disebut secara eksplisit
  alternative: mempertahankan pronomina 'ia'
  rationale: Konteks menunjukkan bahwa Petruslah yang akan mati; penyebutan nama menghindari ambiguitas pronomina bahasa Indonesia tanpa menambahkan tafsiran tentang cara kematiannya.
- issue: Makna memuliakan Allah melalui kematian Petrus
  choice: frasa 'akan memuliakan Allah' dipertahankan tanpa perluasan
  alternative: menjelaskan bahwa kemartiran atau kesaksian setia Petrus memuliakan Allah
  rationale: Teks menyatakan hasil teologis itu tetapi tidak menjelaskan mekanismenya, sehingga ketegangan dan bobot pernyataannya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerjemahan Alkitab Indonesia. Tanda penghubung δέ dan καί tidak diterjemahkan secara mekanis bila hubungan wacananya sudah jelas dalam susunan Indonesia.
