  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: id
  text: Yesus berkata kepada mereka, “Bawalah beberapa ekor ikan yang baru saja kalian tangkap.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis dalam narasi Yunani diterjemahkan dengan bentuk naratif alami bahasa Indonesia tanpa perlu menandai waktu secara morfologis.
- source_word: Ἐνέγκατε
  choice: Bawalah
  rationale: Imperatif aoris jamak dari φέρω menyatakan perintah langsung untuk membawa ikan kepada Yesus; partikel -lah memberi nada perintah yang wajar dan bermartabat.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: beberapa ekor dari ikan
  rationale: ἀπό dengan frasa nominal ini menyatakan pengambilan sebagian dari hasil tangkapan; 'beberapa ekor dari ikan' mempertahankan nuansa partitif dengan jelas dalam bahasa Indonesia.
- source_word: ὀψαρίων
  choice: ikan
  rationale: Dalam konteks ini kata tersebut merujuk pada ikan hasil tangkapan, tanpa alasan cukup untuk mengkhususkan ukuran atau keadaan olahannya.
- source_word: ὧν ἐπιάσατε
  choice: yang kalian tangkap
  rationale: Klausa relatif mengidentifikasi ikan yang dimaksud; 'kalian' menyatakan orang kedua jamak secara alami dan jelas.
- source_word: νῦν
  choice: baru saja
  rationale: Dalam konteks hasil tangkapan yang sangat baru, 'baru saja' menyampaikan kedekatan waktunya dengan lebih alami daripada 'sekarang'.
