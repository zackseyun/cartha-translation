  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Anak-anak, kalian tidak punya ikan untuk dimakan, bukan?” Mereka menjawab-Nya, “Tidak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Berfungsi sebagai penghubung yang meneruskan alur narasi; “lalu” alami dalam bahasa Indonesia tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: Παιδία
  choice: Anak-anak
  rationale: Sapaan akrab dan bernuansa kasih; padanan langsung ini mempertahankan bentuk sumber tanpa menafsirkan para murid sebagai anak kecil secara harfiah.
- source_word: μή τι
  choice: tidak ... bukan?
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif; konstruksi “tidak ..., bukan?” menyampaikan kecenderungan itu secara wajar.
- source_word: προσφάγιον
  choice: ikan untuk dimakan
  rationale: Secara leksikal menunjuk pada lauk atau makanan yang dimakan bersama roti; dalam konteks penangkapan ikan, rujukannya kemungkinan besar ialah ikan. Pilihan ini menyampaikan konteks sekaligus fungsi makanan tersebut.
- source_word: ἔχετε
  choice: kalian ... punya
  rationale: Menyatakan kepemilikan dalam bentuk jamak; “kalian” membuat bentuk jamak eksplisit dan tetap alami.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Mereka menjawab-Nya
  rationale: Padanan naratif yang langsung dan wajar untuk tindakan menjawab kepada Yesus.
- source_word: Οὔ
  choice: Tidak
  rationale: Mempertahankan jawaban negatif yang singkat sebagaimana teks Yunani.
theological_decisions: []
