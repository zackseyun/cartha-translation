  terminology: '“Menyatakan diri-Nya” merupakan padanan yang baik untuk ἐφανέρωσεν ἑαυτόν: refleksif, cukup luas untuk mencakup terlihat maupun dikenal, dan tidak memaksakan penafsiran teologis tertentu. Kapitalisasi pronomina ilahi konsisten dengan konvensi Indonesia yang lazim. Catatan kaki secara tepat menyediakan alternatif leksikal “menampakkan diri.”'
