  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan seluruh unsur Yunani: Μετὰ ταῦτα sebagai “Sesudah semuanya itu,” manifestasi diri Yesus yang berulang, penerima “murid-murid” tanpa posesif yang tidak eksplisit, lokasi di sisi Danau Tiberias, serta pengantar cara peristiwa berikutnya. Pengulangan ἐφανέρωσεν dipertahankan.'
