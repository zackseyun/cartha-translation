id: JHN.21.1
reference: John 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: id
  text: Sesudah semuanya itu, Yesus kembali menyatakan diri-Nya[a] kepada murid-murid di tepi Danau Tiberias. Ia menyatakan diri-Nya dengan cara berikut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menampakkan diri”; kata kerja Yunani dapat berarti membuat diri terlihat atau dikenal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah semuanya itu
  rationale: Ungkapan ini menjadi peralihan waktu yang wajar dalam bahasa Indonesia sekaligus mempertahankan bentuk jamak demonstratif dan corak narasi Yohanes.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: menyatakan diri-Nya
  rationale: Pilihan ini mempertahankan unsur refleksif serta cakupan makna φανερόω, yaitu membuat diri terlihat atau dikenal, bukan sekadar hadir.
- source_word: πάλιν
  choice: kembali
  rationale: Kata ini secara alami menyatakan terulangnya tindakan tersebut setelah penampakan-penampakan kebangkitan sebelumnya.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: Tidak ditambahkan kata milik 'Nya' karena unsur itu tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: di tepi Danau Tiberias
  rationale: Dalam konteks lokasi, ἐπί dengan genitif menunjuk tempat di sisi perairan. 'Danau Tiberias' merupakan sebutan geografis Indonesia yang alami bagi perairan tersebut.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Ia menyatakan diri-Nya dengan cara berikut
  rationale: Pengulangan kata kerja dipertahankan untuk menjaga kohesi sastra, sedangkan οὕτως secara alami mengantar uraian tentang cara peristiwa itu berlangsung.
theological_decisions:
- issue: Bahasa mengenai penampakan Yesus setelah kebangkitan
  choice: menyatakan diri-Nya
  alternative: menampakkan diri
  rationale: Pilihan utama mempertahankan penekanan kata Yunani pada tindakan penyingkapan diri tanpa mengurangi kenyataan perjumpaan dengan Yesus yang telah bangkit. Alternatif yang lebih visual dicatat agar rentang makna aslinya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sesudah semuanya itu' lebih alami daripada terjemahan harfiah 'sesudah hal-hal ini'; 'di tepi Danau Tiberias' memakai istilah geografis yang mudah dipahami pembaca umum.
