source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: id
  text: Sesudah mereka sarapan, Yesus berkata kepada Simon Petrus, “Simon, anak Yohanes, apakah engkau mengasihi[a] Aku lebih daripada ini[b]?” Simon menjawab, “Ya, Tuhan, Engkau tahu bahwa aku mengasihi-Mu.” Yesus berkata kepadanya, “Berilah makan anak-anak domba-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, Yesus memakai ἀγαπάω ketika bertanya, sedangkan Petrus memakai φιλέω ketika menjawab. Sebagian penafsir melihat perbedaan makna; yang lain menganggapnya variasi gaya. Teks utama menerjemahkan keduanya sebagai “mengasihi” agar tidak melebih-lebihkan perbedaan yang tidak dinyatakan secara tegas oleh konteks.
    reason: lexical_alternative
  - marker: b
    text: “Lebih daripada ini” dapat berarti “lebih daripada murid-murid ini mengasihi Aku” atau “lebih daripada engkau mengasihi orang-orang atau hal-hal ini.” Bahasa Yunani membiarkan dasar perbandingannya tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: mereka sarapan
  rationale: Kata ἀριστάω merujuk pada makan pagi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keterangan waktu dalam bentuk ‘sesudah mereka sarapan’.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang wajar tanpa mengubah urutan peristiwa.
- source_word: Σίμων Ἰωάννου
  choice: Simon, anak Yohanes
  rationale: Genitif Ἰωάννου berfungsi sebagai patronimik. ‘Anak Yohanes’ mengikuti bentuk Yunani ayat ini dan tidak menggantinya dengan bentuk tradisional lain.
- source_word: ἀγαπᾷς
  choice: engkau mengasihi
  rationale: ‘Mengasihi’ menyampaikan pertanyaan pribadi Yesus secara langsung dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: πλέον τούτων
  choice: lebih daripada semua ini
  rationale: Frasa Yunani bersifat eliptis dan tidak menjelaskan apakah yang dibandingkan adalah kasih para murid lain atau kasih Petrus terhadap orang atau hal di sekitarnya. Rumusan Indonesia ini mempertahankan ketaktertentuan tersebut sejauh mungkin, disertai catatan kaki.
- source_word: κύριε
  choice: Tuhan
  rationale: Sapaan ini mengungkapkan penghormatan Petrus kepada Yesus dalam konteks Injil Yohanes dan lebih kuat daripada sapaan sopan biasa.
- source_word: οἶδας
  choice: Engkau tahu
  rationale: Ini merupakan padanan langsung dan alami bagi seruan Petrus kepada pengetahuan Yesus.
- source_word: φιλῶ
  choice: aku mengasihi
  rationale: Walaupun φιλέω dapat menonjolkan kasih sayang atau keakraban, dalam konteks ini ‘mengasihi’ paling alami. Perbedaan dengan ἀγαπάω tidak dipertegas dalam teks utama, tetapi didokumentasikan dalam catatan kaki.
- source_word: Βόσκε
  choice: Berilah makan
  rationale: βόσκω secara khusus berarti memberi makan, bukan keseluruhan tugas menggembalakan. Pilihan ini juga mempertahankan perbedaannya dari ποιμαίνω dalam konteks berikutnya.
- source_word: τὰ ἀρνία μου
  choice: anak-anak domba-Ku
  rationale: ἀρνία menunjuk kepada domba muda, sedangkan μου menyatakan bahwa kawanan itu adalah milik Yesus. Bentuk Indonesia ini mempertahankan gambaran pastoral dan unsur kepemilikan tersebut.
theological_decisions:
- issue: Apakah ἀγαπάω dan φιλέω harus dibedakan secara tajam dalam teks utama
  choice: Keduanya diterjemahkan ‘mengasihi’, sedangkan pergantian kata Yunani dijelaskan dalam catatan kaki.
  alternative: Menerjemahkan ἀγαπάω sebagai ‘mengasihi’ dan φιλέω sebagai ‘menyayangi’ atau ‘menaruh kasih sayang’.
  rationale: Tidak pasti apakah Yohanes bermaksud menunjukkan tingkatan kasih yang berbeda atau sekadar variasi gaya. Memakai satu padanan dalam teks utama menghindari pemasukan hierarki teologis yang tidak dinyatakan secara tegas, sementara catatan kaki tetap mempertahankan data leksikalnya.
- issue: Acuan dan dasar perbandingan dalam πλέον τούτων
  choice: Ketaksaan dipertahankan dengan ‘lebih daripada semua ini’.
  alternative: ‘Lebih daripada murid-murid ini mengasihi Aku’ atau ‘lebih daripada engkau mengasihi semua ini’.
  rationale: Bahasa Yunani tidak menyebutkan dasar perbandingan secara eksplisit. Menetapkan salah satu tafsiran dalam teks utama akan mempersempit maknanya melampaui bukti kebahasaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat digunakan dengan susunan dialog yang alami. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia; bentuk ‘aku’ untuk Petrus tetap huruf kecil. Ketaksaan utama dalam frasa perbandingan dan variasi dua verba kasih dipertahankan melalui teks dan catatan kaki.
