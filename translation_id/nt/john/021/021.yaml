  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: id
  text: Maka, ketika Petrus melihat orang itu, ia berkata kepada Yesus, “Tuhan, bagaimana dengan orang ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: ketika Petrus melihat dia
  rationale: Partisip aoris ἰδών dibuat sebagai anak kalimat waktu yang alami dalam bahasa Indonesia; τοῦτον merujuk kepada murid yang disebut sebelumnya.
- source_word: λέγει
  choice: ia berkata
  rationale: Bentuk kini historis Yunani diterjemahkan dengan bentuk naratif Indonesia yang wajar tanpa mengubah isi ujaran.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan κύριε kepada Yesus dalam konteks ini paling tepat diterjemahkan dengan sapaan hormat dan kristologis yang lazim, “Tuhan”.
- source_word: οὗτος δὲ τί;
  choice: bagaimana dengan orang ini?
  rationale: Ungkapan eliptis Yunani secara idiomatis menanyakan apa yang akan terjadi atau dituntut dari murid ini; terjemahan mempertahankan sifat pertanyaan yang tidak sepenuhnya dijabarkan.
theological_decisions:
- issue: Pertanyaan eliptis Petrus tentang murid lain
  choice: bagaimana dengan orang ini?
  alternative: apa yang akan terjadi dengan orang ini?
  rationale: Pilihan utama tidak menentukan apakah Petrus bertanya tentang nasib, tugas, atau tuntutan bagi murid tersebut, sehingga ambiguitas οὗτος δὲ τί dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina “dia/ia” dipakai secara alami; konteks ayat sebelumnya menjelaskan siapa yang dilihat Petrus.
