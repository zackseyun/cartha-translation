source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: id
  text: Untuk ketiga kalinya Yesus berkata kepadanya, “Simon, anak Yohanes, apakah engkau mengasihi Aku[a]?” Petrus merasa sedih karena Yesus berkata kepadanya untuk ketiga kalinya, “Apakah engkau mengasihi Aku?” Lalu Petrus berkata kepada-Nya, “Tuhan, Engkau tahu segala sesuatu[b]; Engkau tahu bahwa aku mengasihi Engkau.” Yesus berkata kepadanya, “Berilah makan domba-domba-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini bahasa Yunani memakai φιλέω (“mengasihi, menaruh kasih sayang”), sedangkan dalam dua pertanyaan sebelumnya Yesus memakai ἀγαπάω. Sebagian penafsir menganggap perbedaan itu bermakna; yang lain menilai kedua kata tersebut saling bertumpang tindih dalam konteks ini. Terjemahan memakai “mengasihi” dan tidak memaksakan perbedaan yang lebih tajam daripada yang dapat dipastikan dari bahasa Yunani.
    reason: lexical_alternative
  - marker: b
    text: Dalam jawaban Petrus, bahasa Yunani memakai dua verba yang berarti “tahu”, yaitu οἶδα dan γινώσκω. Bahasa Indonesia dapat menerjemahkan keduanya dengan “tahu”; pengulangan itu mungkin mengandung nuansa, tetapi nuansa tersebut tidak dapat dinyatakan secara alami tanpa memberi tafsiran berlebihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: untuk ketiga kalinya
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan motif pertanyaan yang diulang tiga kali.
- source_word: Σίμων Ἰωάννου
  choice: Simon, anak Yohanes
  rationale: Bentuk genitif Ἰωάννου paling wajar dipahami sebagai patronimik, yaitu anak Yohanes, bukan anak Yunus.
- source_word: φιλεῖς / φιλῶ
  choice: mengasihi
  rationale: φιλέω menyatakan kasih atau afeksi. 'Mengasihi' mempertahankan bobot relasional dan kekhidmatan percakapan tanpa memaksakan perbedaan yang tajam dengan ἀγαπάω.
- source_word: ἐλυπήθη
  choice: merasa sedih
  rationale: Ungkapan ini menyampaikan dukacita atau rasa terluka Petrus dalam bahasa Indonesia modern yang wajar.
- source_word: Κύριε
  choice: Tuhan
  rationale: Dalam konteks Petrus berbicara kepada Yesus yang bangkit, sapaan ini lebih kuat daripada sekadar 'Tuan'.
- source_word: πάντα σὺ οἶδας
  choice: Engkau mengetahui segala sesuatu
  rationale: Terjemahan ini mempertahankan keluasan πάντα dan penekanan pada subjek σὺ tanpa susunan yang kaku.
- source_word: οἶδας ... γινώσκεις
  choice: mengetahui ... tahu
  rationale: Kedua verba berhubungan dengan pengetahuan. Variasi Indonesia yang alami mempertahankan pengulangan makna tanpa mengklaim adanya perbedaan teknis yang pasti.
- source_word: Βόσκε
  choice: Berilah makan
  rationale: βόσκω secara khusus berarti memberi makan atau menyediakan makanan, berbeda dari istilah yang lebih luas untuk menggembalakan.
- source_word: πρόβατά
  choice: domba-domba
  rationale: πρόβατα berarti domba, bukan secara khusus anak domba; bentuk ulang alami untuk menyatakan jamak dalam konteks ini.
theological_decisions:
- issue: Apakah perbedaan antara φιλέω dan ἀγαπάω harus ditampilkan sebagai dua jenis kasih yang berbeda
  choice: Menerjemahkan φιλέω dengan 'mengasihi' tanpa menyatakan jenis kasih yang berbeda dalam teks utama
  alternative: Membedakannya dengan ungkapan seperti 'mengasihi' dan 'menyayangi'
  rationale: Dalam penggunaan Yunani Koine, perbedaan kedua verba itu dalam konteks ini tidak cukup stabil untuk dijadikan kesimpulan teologis dalam terjemahan. Variasi leksikal dijelaskan dalam catatan kaki.
- issue: Cakupan pengakuan Petrus πάντα σὺ οἶδας
  choice: Mempertahankan pernyataan kuat 'Engkau mengetahui segala sesuatu'
  alternative: Mempersempitnya menjadi 'Engkau mengetahui segala sesuatu tentang hal ini' atau memperluasnya menjadi penjelasan doktrinal eksplisit
  rationale: Bahasa Yunani menyatakan 'segala sesuatu'. Terjemahan mempertahankan kekuatannya tanpa mempersempit cakupan atau menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Urutan klausa dibuat alami, sementara pengulangan 'untuk ketiga kalinya', dua pernyataan tentang mengetahui, dan perintah memberi makan tetap dipertahankan.
