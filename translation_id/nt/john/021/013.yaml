id: JHN.21.13
reference: John 21:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: id
  text: Yesus datang[a], lalu mengambil roti itu dan memberikannya kepada mereka; demikian juga ikan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata-kata kerja Yunani memakai bentuk kini historis. Bahasa Indonesia tidak membedakan bentuk kata kerja menurut kala.
    reason: translation_note
  - marker: b
    text: Atau, “dan ikan itu juga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini naratif dipertahankan sebagai kala kini historis untuk mencerminkan gaya penceritaan Yohanes.
- source_word: λαμβάνει
  choice: mengambil
  rationale: Dalam konteks pembagian makanan yang sudah tersedia, kata ini menyatakan tindakan mengambil sebelum memberikan.
- source_word: τὸν ἄρτον
  choice: roti itu
  rationale: Artikel menunjuk pada roti tertentu yang tersedia dalam adegan tersebut; 'roti itu' wajar dalam bahasa Indonesia.
- source_word: δίδωσιν αὐτοῖς
  choice: memberikannya kepada mereka
  rationale: Akhiran '-nya' secara alami merujuk kembali kepada roti, sedangkan 'kepada mereka' mewakili objek tak langsung.
- source_word: τὸ ὀψάριον
  choice: ikan itu
  rationale: Dalam konteks ini kata tersebut berarti ikan sebagai makanan; teks tidak mengharuskan keterangan yang lebih khusus seperti 'ikan matang'.
- source_word: ὁμοίως
  choice: demikian juga
  rationale: Ungkapan ini menyatakan bahwa Yesus melakukan hal yang sama terhadap ikan seperti terhadap roti, sambil mempertahankan paralelisme ringkas.
theological_decisions:
- issue: Kala kini naratif dalam kisah penampakan sesudah kebangkitan
  choice: 'Mempertahankan kala kini historis: ''datang, mengambil ... memberikannya'''
  alternative: 'Mengubahnya menjadi bentuk lampau kontekstual: ''datang lalu mengambil ... memberikannya'' atau menambahkan penanda ''kemudian'''
  rationale: Bahasa Indonesia tidak menginfleksikan verba menurut kala, sehingga bentuk tanpa penanda waktu dapat mempertahankan daya langsung kala kini historis Yunani tanpa memaksakan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. 'Lalu' memperjelas urutan tindakan tanpa mengubah hubungan antarklausa; titik koma menjaga frasa eliptis terakhir tetap jelas. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
