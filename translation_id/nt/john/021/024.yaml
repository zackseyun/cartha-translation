  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: id
  text: Dialah murid yang memberi kesaksian tentang hal-hal ini dan yang telah menuliskan hal-hal ini,[a] dan kita tahu bahwa kesaksiannya benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang telah menulis hal-hal ini.” Bahasa Yunani memakai kata-kata seakar untuk “memberi kesaksian” dan “kesaksian” dalam ayat ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: Dialah
  rationale: Kata tunjuk ini merujuk kembali kepada murid yang baru disebut dan memiliki daya pengenalan; “Dialah” wajar dalam bahasa Indonesia.
- source_word: ὁ μαθητὴς
  choice: murid
  rationale: Istilah baku dalam Injil Yohanes untuk pengikut Yesus dan mudah dipahami pembaca modern.
- source_word: ὁ μαρτυρῶν
  choice: yang memberi kesaksian
  rationale: Partisipel kini menyatakan tindakan yang berlangsung atau menjadi ciri murid itu. Pilihan ini mempertahankan hubungan akar kata dengan “kesaksian” pada akhir ayat.
- source_word: περὶ τούτων
  choice: tentang hal-hal ini
  rationale: Terjemahan langsung yang mempertahankan rujukan demonstratif kepada berbagai hal yang dicatat dalam Injil.
- source_word: ὁ γράψας ταῦτα
  choice: yang telah menuliskannya
  rationale: Partisipel aoris menunjuk pada tindakan menulis yang telah dilakukan; akhiran “-nya” secara alami merujuk kepada hal-hal tersebut.
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Bentuk perfektum ini bermakna kini. “Kita” mempertahankan bentuk orang pertama jamak tanpa menentukan siapa para penuturnya.
- source_word: ἀληθὴς
  choice: benar
  rationale: Predikat ini menegaskan kebenaran kesaksian dan merupakan padanan langsung serta alami dalam bahasa Indonesia.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: kesaksiannya
  rationale: Bentuk posesif Indonesia menyampaikan konstruksi genitif Yunani secara ringkas dan mempertahankan kosakata kesaksian.
theological_decisions:
- issue: Identitas dan suara dalam “kita tahu”
  choice: Menerjemahkan orang pertama jamak secara langsung sebagai “kita tahu” tanpa menentukan penuturnya.
  alternative: Memahami bentuk jamak itu sebagai suara editorial penulis Injil atau sebagai komunitas para pemberi pengesahan.
  rationale: Teks Yunani memakai orang pertama jamak tetapi tidak mengidentifikasi rujukannya; terjemahan tidak semestinya menyelesaikan pertanyaan tentang kepengarangan atau komunitas.
- issue: Hubungan murid dengan penulisan
  choice: Mempertahankan pernyataan bahwa murid itulah yang memberi kesaksian dan telah menuliskan hal-hal tersebut.
  alternative: Mengubahnya menjadi pernyataan yang hanya mengatakan bahwa kesaksian murid itu menjadi sumber tulisan.
  rationale: Kedua partisipel Yunani secara gramatikal menerangkan murid yang sama, sehingga hubungan langsung ini perlu dipertahankan tanpa menambahkan teori kepengarangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa terasa kuno. “Memberi kesaksian—kesaksian” sengaja dipertahankan untuk mencerminkan pengulangan kata seakar dalam bahasa Yunani; “kita” tidak dijelaskan lebih lanjut agar ambiguitas sumber tetap terjaga.
