  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Jika Aku menghendaki dia tetap tinggal sampai Aku datang,[a] apa urusanmu? Engkau ikutlah Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “sampai Aku datang” sengaja dibiarkan terbuka; ayat ini tidak menjelaskan kedatangan mana yang dimaksud.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Kata Yesus kepadanya
  rationale: Bentuk kini historis λέγει dialihkan dengan bentuk naratif Indonesia yang alami tanpa mengubah urutan pelaku dan penerima.
- source_word: Ἐὰν
  choice: Jika
  rationale: Mempertahankan sifat pengandaian dari klausa bersyarat Yunani.
- source_word: θέλω
  choice: Aku menghendaki
  rationale: Mencakup unsur keinginan sekaligus kehendak yang dapat dinyatakan θέλω, dengan ragam bahasa yang wajar dan bermartabat.
- source_word: μένειν
  choice: tetap tinggal
  rationale: Mempertahankan arti dasar ‘tinggal/bertahan’ dan hubungan leksikal dengan pemakaian μένω dalam tulisan Yohanes, tanpa mempersempitnya menjadi ‘tetap hidup’.
- source_word: ἕως ἔρχομαι
  choice: sampai Aku datang
  rationale: Terjemahan temporal langsung yang tidak menentukan sifat atau waktu kedatangan Yesus.
- source_word: τί πρὸς σέ;
  choice: apa urusanmu?
  rationale: Ungkapan Indonesia yang alami dan langsung untuk idiom yang menolak campur tangan atau kekhawatiran Petrus mengenai murid lain.
- source_word: σύ μοι ἀκολούθει
  choice: Engkau, ikutlah Aku
  rationale: ‘Engkau’ yang diletakkan tersendiri mempertahankan penekanan dan kontras dari σύ; bentuk ‘ikutlah’ menyampaikan perintah kini secara alami.
theological_decisions:
- issue: Makna kedatangan Yesus dalam ἕως ἔρχομαι
  choice: Diterjemahkan secara terbuka sebagai ‘sampai Aku datang’.
  alternative: Menafsirkannya secara khusus sebagai kedatangan dalam suatu peristiwa sejarah, penampakan sesudah kebangkitan, penghakiman atas Yerusalem, atau kedatangan terakhir.
  rationale: Ayat ini tidak menjelaskan rujukan kedatangan tersebut, dan konteks ayat 22–23 memperingatkan pembaca agar tidak menarik kesimpulan melebihi perkataan Yesus.
- issue: Arti bertahannya murid dalam μένειν
  choice: Diterjemahkan ‘tetap tinggal’ tanpa menjelaskan bahwa ia pasti tetap hidup.
  alternative: ‘tetap hidup’ atau ‘hidup terus’.
  rationale: Konteks memungkinkan implikasi mengenai kelangsungan hidup, tetapi kata Yunani itu sendiri lebih luas; terjemahan tidak boleh mengubah implikasi menjadi pernyataan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan langsung. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab Indonesia. Penekanan σύ dipertahankan dengan ‘Engkau,’ sebelum perintah. Penanda catatan kaki [a] ditempatkan tepat sesudah klausa yang diterangkannya.
