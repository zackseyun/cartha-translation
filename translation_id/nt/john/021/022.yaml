  source_fidelity: Terjemahan menangkap dengan tepat struktur pengandaian ἐὰν, kehendak θέλω, arti terbuka μένειν sebagai ‘tetap tinggal’, serta rujukan yang tidak diperjelas dalam ἕως ἔρχομαι. ‘Apa urusanmu?’ menyampaikan idiom τί πρὸς σέ; secara langsung dan wajar. ‘Engkau’ mempertahankan penekanan σύ.
  naturalness: Teks umumnya baku dan alami. Namun, koma dalam ‘Engkau, ikutlah Aku’ membuat ‘Engkau’ tampak seperti sapaan/vokatif dan kurang lancar dalam bahasa Indonesia modern. Tanpa koma, kontras yang ditekankan dalam bahasa Yunani tetap jelas dan kalimat lebih idiomatis.
  terminology: ‘Menghendaki’, ‘tetap tinggal’, dan ‘ikutlah Aku’ sesuai dengan register Alkitab Indonesia yang modern-baku dan tidak menambahkan penafsiran bahwa murid itu harus tetap hidup. Kapitalisasi kata ganti yang merujuk kepada Yesus konsisten dengan konvensi penerbitan yang dipilih.
  issues:
