revisions:
- from: Kata Yesus kepadanya, “Jika Aku menghendaki dia tetap tinggal sampai Aku datang,[a] apa urusanmu? Engkau, ikutlah Aku.”
  to: Yesus berkata kepadanya, “Jika Aku menghendaki dia tetap tinggal sampai Aku datang,[a] apa urusanmu? Engkau ikutlah Aku.”
  rationale: ‘Yesus berkata kepadanya’ adalah susunan modern yang lebih langsung daripada inversi ‘Kata Yesus kepadanya’, tanpa mengubah nilai naratif λέγει. Koma setelah ‘Engkau’ dihilangkan agar perintah terdengar alami, sambil tetap mempertahankan kontras eksplisit antara ‘dia’ dan ‘Engkau’. Catatan kaki dipertahankan karena dengan tepat menjaga ketaktertentuan rujukan ‘Aku datang’.
