id: JHN.21.23
reference: John 21:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: id
  text: Karena itu, kabar ini tersebar di antara saudara-saudara[a] bahwa murid itu tidak akan mati. Namun, Yesus tidak mengatakan kepadanya bahwa murid itu tidak akan mati, melainkan, “Jika Aku menghendaki dia tetap tinggal sampai Aku datang, apa urusanmu?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara” di sini merujuk kepada komunitas para murid; bahasa Yunani memakai bentuk maskulin jamak ἀδελφοί.
    reason: cultural_note
  - marker: b
    text: 'Yesus tidak berjanji bahwa murid ini tidak akan pernah mati. Ia menyatakan suatu kondisi: “Jika Aku menghendaki dia tetap tinggal sampai Aku datang ....”'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν οὖν οὗτος ὁ λόγος
  choice: Karena itu, tersebarlah kabar ini
  rationale: Ungkapan ini menggambarkan suatu kabar atau pernyataan yang beredar dalam suatu kelompok. “Tersebarlah kabar ini” alami dalam bahasa Indonesia dan sesuai dengan konteks kesalahpahaman yang kemudian diluruskan.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: di antara saudara-saudara
  rationale: Dalam konstruksi ini, εἰς menunjukkan penyebaran ke dalam komunitas. Bentuk maskulin jamak dipertahankan sebagai “saudara-saudara,” dengan catatan mengenai rujukan komunitas murid.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: murid itu
  rationale: Demonstratif ἐκεῖνος dipertahankan untuk menunjuk secara khusus kepada murid yang sedang dibicarakan.
- source_word: οὐκ ἀποθνῄσκει
  choice: tidak akan mati
  rationale: Walaupun bentuk Yunani memakai kala kini, dalam isi kabar tidak langsung bahasa Indonesia bentuk futuratif ini menyampaikan maksudnya secara alami.
- source_word: οὐκ εἶπεν δὲ
  choice: Namun, Yesus tidak mengatakan
  rationale: δέ menandai kontras dan koreksi terhadap kabar yang telah tersebar; “Namun” menyatakan fungsi itu dengan jelas.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Jika Aku menghendaki dia tetap tinggal
  rationale: “Menghendaki” menyampaikan volisi θέλω dengan register yang bermartabat, sedangkan “tetap tinggal” mempertahankan nuansa μένω tanpa menentukan apa tepatnya bentuk keberlangsungan itu.
- source_word: ἕως ἔρχομαι
  choice: sampai Aku datang
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan tidak menambahkan penafsiran eksplisit seperti “datang kembali,” meskipun konteks dapat mengarah ke sana.
- source_word: τί πρὸς σέ
  choice: apa urusanmu?
  rationale: Ini adalah padanan idiomatis dan langsung dalam bahasa Indonesia untuk ungkapan yang menolak keharusan Petrus mencampuri nasib murid lain.
theological_decisions:
- issue: Sifat kabar mengenai murid tersebut
  choice: Menampilkan pernyataan itu sebagai kabar yang tersebar, lalu mempertahankan koreksi tegas bahwa Yesus tidak menjanjikan murid itu tidak akan mati.
  alternative: Menerjemahkan secara lebih harfiah sebagai “perkataan ini keluar” atau menyebutnya “perkataan ini tersebar.”
  rationale: λόγος dapat berarti perkataan, pernyataan, atau kabar. Konteks menunjukkan sebuah kesimpulan yang beredar dan kemudian dikoreksi, sehingga “kabar” jelas tanpa membuat Yesus sebagai sumber janji yang keliru.
- issue: Sifat bersyarat ucapan Yesus
  choice: Mempertahankan “Jika Aku menghendaki ...” sebagai kondisi hipotetis.
  alternative: Menafsirkannya sebagai janji bahwa murid itu pasti tetap hidup sampai kedatangan Yesus.
  rationale: ἐάν mempertahankan kondisi yang tidak menegaskan bahwa keinginan tersebut benar-benar menjadi keputusan Yesus. Ayat itu sendiri membedakan kondisi ini dari klaim bahwa sang murid tidak akan mati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum, sambil mempertahankan koreksi penulis, kondisi hipotetis, dan ketidakpastian yang terdapat dalam teks Yunani.
