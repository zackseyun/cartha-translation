  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: id
  text: Keesokan harinya, orang banyak yang telah datang ke perayaan itu, ketika mereka mendengar bahwa Yesus sedang menuju Yerusalem,[a]
  philosophy: optimal-equivalence
