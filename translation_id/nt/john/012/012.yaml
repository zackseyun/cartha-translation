lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami menandai hari berikutnya dalam urutan narasi.
- source_word: ὁ ὄχλος πολὺς
  choice: orang banyak
  rationale: Dalam bahasa Indonesia Alkitabiah yang tetap modern, 'orang banyak' menyampaikan kelompok besar tanpa ungkapan yang kaku; besarnya kelompok sudah lazim tersirat dalam frasa ini.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: yang datang ke perayaan itu
  rationale: Klausa relatif alami dalam bahasa Indonesia dan mempertahankan fungsi partisip atributif. 'Perayaan' menyampaikan ἑορτή sebagai perayaan keagamaan tanpa kesan khusus tentang jamuan makan.
- source_word: ἀκούσαντες
  choice: mendengar
  rationale: Partisip aoris merujuk kepada anggota-anggota orang banyak; bentuk verbal Indonesia tidak perlu menandai peralihan jumlah gramatikal tersebut.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: bahwa Yesus sedang menuju
  rationale: Bentuk progresif menangkap gerak yang tengah berlangsung dalam konteks narasi lampau, sedangkan nama pribadi ditransliterasikan secara baku.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Dengan 'menuju', nama tempat langsung menjadi tujuan gerak; bentuk 'Yerusalem' mengikuti transliterasi Indonesia yang mapan.
