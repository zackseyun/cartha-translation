  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: id
  text: Aku telah datang ke dalam dunia sebagai terang, supaya setiap orang yang percaya kepada-Ku tidak tinggal dalam kegelapan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit memberi penekanan pada diri Yesus; bentuk “Aku” alami dan sesuai dengan tuturan langsung yang bermartabat.
- source_word: φῶς
  choice: sebagai terang
  rationale: Nomina tanpa artikel ini paling wajar dipahami secara kualitatif. “Sebagai terang” mempertahankan metafora identitas dan fungsi Yesus tanpa mengubahnya menjadi sekadar pembawa terang.
- source_word: εἰς τὸν κόσμον
  choice: ke dalam dunia
  rationale: εἰς dengan akusatif menyatakan gerak masuk ke suatu ranah; frasa ini mempertahankan nuansa kedatangan Yesus ke dalam dunia.
- source_word: ἐλήλυθα
  choice: telah datang
  rationale: Bentuk perfek menyoroti kedatangan yang sudah terjadi dengan keadaan atau dampak yang tetap berlangsung; “telah datang” paling dekat dengan nuansa itu dalam bahasa Indonesia.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: πᾶς ὁ πιστεύων
  choice: setiap orang yang percaya
  rationale: Partisip substantival dengan πᾶς menunjuk kepada seluruh golongan orang yang percaya secara umum, tanpa membatasi cakupannya.
- source_word: πιστεύων εἰς ἐμέ
  choice: percaya kepada-Ku
  rationale: πιστεύω dengan εἰς dan objek personal mengungkapkan iman yang diarahkan kepada Yesus. “Percaya kepada-Ku” merupakan ungkapan Indonesia yang alami dan personal.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dalam kegelapan
  rationale: Artikel Yunani menampilkan kegelapan sebagai ranah moral-rohani yang dikenal dalam Injil Yohanes; bahasa Indonesia tidak memerlukan penanda definit yang terpisah untuk mempertahankan gagasan tersebut.
- source_word: μὴ μείνῃ
  choice: tidak tetap berada
  rationale: Subjungtif aoris setelah ἵνα dengan μή menyatakan tujuan negatif. “Tidak tetap berada” mempertahankan gagasan tidak terus tinggal dalam suatu keadaan.
theological_decisions:
- issue: Identifikasi kristologis Yesus melalui gambaran terang
  choice: “sebagai terang”
  alternative: “sebagai suatu terang” atau “untuk membawa terang”
  rationale: Pilihan ini mempertahankan metafora teks bahwa Yesus datang dalam identitas dan fungsi sebagai terang, tanpa memaksakan ketakrifan yang tidak dinyatakan atau mengurangi metafora menjadi tindakan membawa terang.
- issue: Cakupan πᾶς ὁ πιστεύων
  choice: “setiap orang yang percaya”
  alternative: “siapa pun yang percaya”
  rationale: Keduanya memungkinkan, tetapi “setiap orang yang percaya” lebih langsung mencerminkan πᾶς dan menyatakan cakupan umum para percaya tanpa memasukkan kesimpulan denominasi tertentu mengenai asal atau mekanisme iman.
- issue: Tujuan kedatangan dan keberadaan dalam kegelapan
  choice: “supaya ... tidak tetap berada dalam kegelapan”
  alternative: “agar ... jangan tinggal dalam kegelapan”
  rationale: Rumusan ini mempertahankan tujuan negatif dari ἵνα μή dan gambaran kegelapan sebagai ranah yang tidak lagi menjadi tempat menetap orang yang percaya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapital pada akhiran pronomina “-Ku” mengikuti kebiasaan penulisan penghormatan dalam terjemahan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena ambiguitas anarthrous φῶς dapat diwakili secara memadai oleh ungkapan kualitatif “sebagai terang”, sedangkan alternatif cakupan πᾶς ὁ πιστεύων tidak menghasilkan perbedaan makna yang cukup berarti dalam bahasa Indonesia.
