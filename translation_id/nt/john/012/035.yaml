revisions:
- from: Lalu Yesus berkata kepada mereka, “Hanya sedikit waktu lagi terang itu ada di antara kalian.[a] Berjalanlah selagi kalian memiliki terang itu, supaya kegelapan tidak menguasai kalian. Orang yang berjalan dalam kegelapan tidak tahu ke mana ia pergi.”
  to: Lalu Yesus berkata kepada mereka, “Terang itu masih ada di antara kalian untuk sedikit waktu lagi.[a] Berjalanlah selagi kalian memiliki terang itu, supaya kegelapan tidak menyergap kalian. Orang yang berjalan dalam kegelapan tidak tahu ke mana ia pergi.”
  rationale: Revisi memperjelas ἔτι (“masih”) dan mengganti “menguasai” dengan “menyergap” agar daya aktif serta nuansa kegelapan yang mengejar/menangkap dalam καταλάβῃ tetap terasa. Catatan kaki dan pembacaan kontekstual ἐν ὑμῖν dipertahankan.
