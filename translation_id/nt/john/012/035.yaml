    text: Atau “di dalam kalian” atau “bersama kalian.” Frasa Yunani ini dapat dipahami dengan lebih dari satu cara, tetapi “di antara kalian” paling sesuai dengan konteks langsung tentang kehadiran Yesus di tengah orang banyak.
    reason: alternative_reading
