review_pass:
  verdict: revise
  source_fidelity: Draf secara umum setia kepada teks Yunani dan dengan baik mempertahankan metafora terang/kegelapan, bentuk jamak penerima, serta ambiguitas ἐν ὑμῖν melalui catatan kaki. Namun, “menguasai” untuk καταλάβῃ terutama menyatakan dominasi, sedangkan dalam konteks ini kata Yunani itu menonjolkan kegelapan yang datang menyergap atau mengejar hingga menangkap seseorang. Selain itu, “Hanya sedikit waktu lagi” dapat terdengar terutama prospektif dan kurang jelas mencerminkan ἔτι (“masih”).
  naturalness: Bahasa draf modern, baku, dan mudah dibaca. “Terang itu masih ada di antara kalian untuk sedikit waktu lagi” lebih jelas dan idiomatis dalam menyatakan sisa waktu yang terbatas. “Menyergap kalian” secara alami menyampaikan ancaman aktif dan gerak yang tersirat dalam konteks.
  terminology: “Terang,” “kegelapan,” dan “berjalan” dipertahankan sebagai istilah/metafora Yohanes tanpa penafsiran doktrinal tambahan. “Di antara kalian” tepat untuk pembacaan kontekstual ἐν ὑμῖν, dan catatan kaki tetap perlu mempertahankan alternatifnya.
  issues:
  - severity: medium
    issue: Nuansa καταλάβῃ kurang tepat dalam “menguasai.”
    rationale: Kata ini dapat berarti menangkap, menyergap, atau menyusul; dalam kontras perjalanan terang/kegelapan, citra kegelapan yang menyergap lebih dekat daripada penguasaan sebagai keadaan statis.
  - severity: low
    issue: Unsur ἔτι kurang eksplisit pada “Hanya sedikit waktu lagi.”
    rationale: Frasa tersebut dapat dipahami sebagai waktu yang akan datang, sedangkan Yunani menyatakan bahwa terang itu masih hadir, tetapi hanya untuk waktu singkat.
  revised_text: Lalu Yesus berkata kepada mereka, “Terang itu masih ada di antara kalian untuk sedikit waktu lagi.[a] Berjalanlah selagi kalian memiliki terang itu, supaya kegelapan tidak menyergap kalian. Orang yang berjalan dalam kegelapan tidak tahu ke mana ia pergi.”
  revised_footnotes:
