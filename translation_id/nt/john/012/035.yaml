id: JHN.12.35
reference: John 12:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Terang itu masih ada di antara kalian untuk sedikit waktu lagi.[a] Berjalanlah selagi kalian memiliki terang itu, supaya kegelapan tidak menyergap kalian. Orang yang berjalan dalam kegelapan tidak tahu ke mana ia pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam kalian” atau “bersama kalian.” Frasa Yunani ini dapat dipahami dengan lebih dari satu cara, tetapi “di antara kalian” paling sesuai dengan konteks langsung tentang kehadiran Yesus di tengah orang banyak.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Berfungsi sebagai penghubung wacana yang alami dengan percakapan sebelumnya tanpa memberi kesan hubungan sebab-akibat yang terlalu kuat.
- source_word: Ἔτι μικρὸν χρόνον
  choice: Hanya sedikit waktu lagi
  rationale: Mengungkapkan bahwa waktu keberadaan terang bersama para pendengar masih tersisa, tetapi singkat.
- source_word: τὸ φῶς
  choice: terang itu
  rationale: Mempertahankan metafora langsung dan bobot kristologis khas Yohanes; bentuk definit dipantulkan dengan 'itu'.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Paling sesuai dengan konteks kehadiran Yesus di tengah orang banyak, sambil tetap mencatat kemungkinan makna lain.
- source_word: περιπατεῖτε
  choice: Berjalanlah
  rationale: Mempertahankan citra berjalan yang dapat menunjuk pada tindakan sekaligus cara hidup.
- source_word: ὡς
  choice: selagi
  rationale: Dipahami secara temporal dalam hubungan dengan 'memiliki terang', sesuai dengan nada mendesak perkataan ini.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menyatakan tujuan atau hasil yang hendak dihindari dalam bahasa Indonesia modern dan wajar.
- source_word: σκοτία
  choice: kegelapan
  rationale: Mempertahankan kontras utama antara terang dan kegelapan dalam Injil Yohanes.
- source_word: καταλάβῃ
  choice: menguasai
  rationale: Menyampaikan daya aktif kegelapan yang menyergap atau mengatasi seseorang; nuansa 'menyusul/menangkap' tetap mungkin.
- source_word: ὁ περιπατῶν
  choice: Orang yang berjalan
  rationale: Menerjemahkan partisip substantival sebagai pernyataan umum dalam bentuk tunggal yang alami.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dalam kegelapan
  rationale: Ungkapan Indonesia yang alami serta mempertahankan ranah metaforis yang berlawanan dengan terang.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: tidak tahu ke mana ia pergi
  rationale: Secara idiomatis mempertahankan ketidaktahuan mengenai arah atau tujuan.
theological_decisions:
- issue: Makna ἐν ὑμῖν dalam hubungan dengan 'terang'
  choice: di antara kalian
  alternative: di dalam kalian; bersama kalian
  rationale: Konteks langsung menunjuk pada terbatasnya kehadiran publik Yesus sebagai terang di tengah orang banyak. Catatan kaki mempertahankan kemungkinan makna internal atau kebersamaan tanpa memasukkan doktrin tertentu.
- issue: Daya metaforis καταλάβῃ
  choice: menguasai
  alternative: menyusul; menangkap; mengatasi
  rationale: Pilihan ini menjaga ancaman kegelapan sebagai kekuatan yang mendatangi dan menguasai, tanpa mengubah citra menjadi penjelasan teologis eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' dipakai agar bentuk jamak Yunani terlihat jelas dan tuturan langsung tetap alami. Metafora terang, berjalan, dan kegelapan dipertahankan.
