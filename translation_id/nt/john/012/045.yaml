id: JHN.12.45
reference: John 12:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: id
  text: Dan orang yang melihat Aku melihat Dia yang mengutus Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memandang”; kata Yunani yang dipakai dapat berarti melihat dengan penuh perhatian atau penghayatan, bukan sekadar melihat secara fisik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan fungsi penghubung sederhana dengan perkataan sebelumnya.
- source_word: ὁ θεωρῶν
  choice: orang yang melihat
  rationale: Partisipel kini berartikel ini menunjuk secara umum kepada orang yang melakukan tindakan tersebut. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan bentuk tunggal representatif.
- source_word: ἐμὲ
  choice: Aku
  rationale: Pronomina orang pertama tunggal sebagai objek langsung; huruf kapital mengikuti kelaziman bahasa Indonesia dalam teks keagamaan ketika merujuk kepada Yesus.
- source_word: θεωρεῖ
  choice: melihat
  rationale: θεωρέω dapat berarti melihat, mengamati, atau memandang dengan perhatian. 'Melihat' paling alami dan mempertahankan pengulangan verba dari klausa pertama.
- source_word: τὸν πέμψαντά με
  choice: Dia yang mengutus Aku
  rationale: Menerjemahkan partisipel aoris berartikel sebagai sebutan relasional bagi sang pengutus tanpa menambahkan gelar 'Bapa', yang tidak dinyatakan langsung dalam ayat ini.
theological_decisions:
- issue: Hubungan antara melihat Yesus dan melihat Dia yang mengutus-Nya
  choice: Pernyataan langsung bahwa orang yang melihat Yesus melihat Dia yang mengutus-Nya
  alternative: Memperlemah menjadi sekadar mengenal sang pengutus melalui Yesus, atau memperluasnya menjadi pernyataan eksplisit tentang identitas ontologis
  rationale: Terjemahan mempertahankan kesatuan pewahyuan yang kuat dalam teks tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan oleh susunan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'melihat' dipertahankan karena penting bagi bentuk dan penekanan teks Yunani.
