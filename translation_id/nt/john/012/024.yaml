base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: jika sebutir gandum tidak jatuh ke tanah dan mati, butir itu tetap satu butir saja[a]. Namun, jika butir itu mati, ia menghasilkan banyak buah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tetap sendirian.”'
    reason: lexical_alternative
  - marker: b
    text: Gambaran ini berbicara tentang sebutir gandum yang harus mati di dalam tanah agar menghasilkan buah. Dalam konteksnya, Yesus menerapkan pola ini pada kematian-Nya sendiri dan pada orang-orang yang mengikuti-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan khas Injil Yohanes serta daya penegasan yang khidmat dalam bahasa Indonesia yang wajar.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan rumusan khas Yohanes; bentuk tunggal “kepadamu” dapat mewakili kelompok pendengar sebagaimana bentuk Yunani jamak, tetapi bahasa Indonesia tidak menandai jumlah pada pronomina ini.
- source_word: ἐὰν μὴ
  choice: jika ... tidak
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan bentuk syarat negatif Yunani tanpa mengubah hubungan logisnya.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: sebutir gandum
  rationale: κόκκος menunjuk pada butir atau biji; “sebutir gandum” merupakan ungkapan pertanian yang ringkas dan alami.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: jatuh ke tanah
  rationale: Menyampaikan gerak masuk ke tanah dalam konteks penanaman dan mengungkapkan partisip Yunani secara alami sebagai verba beruntun.
- source_word: ἀποθάνῃ
  choice: mati
  rationale: Subjungtif aoris dalam klausa syarat secara alami diterjemahkan dengan bentuk verba dasar bahasa Indonesia.
- source_word: αὐτὸς μόνος μένει
  choice: butir itu tetap sendirian
  rationale: “Tetap” mewakili μένει, sedangkan “sendirian” mempertahankan μόνος dan gagasan bahwa butir tersebut tidak menghasilkan pertambahan.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: Namun, jika butir itu mati
  rationale: “Namun” menyatakan kontras δέ dengan jelas; pengulangan “butir itu” menghindari rujukan pronomina yang kabur.
- source_word: πολὺν καρπὸν φέρει
  choice: ia menghasilkan banyak buah
  rationale: Mempertahankan metafora καρπός sebagai “buah”; “menghasilkan” terdengar alami untuk butir gandum sekaligus menyampaikan idiom φέρει καρπόν.
theological_decisions:
- issue: Gambaran pertanian yang secara tersirat menunjuk pada kematian Yesus dan pemuridan
  choice: Mempertahankan gambaran pertanian secara harfiah dalam teks utama tanpa mengeksplisitkan penerapan kristologisnya.
  alternative: Menambahkan dalam teks bahwa Yesus sedang menunjuk pada kematian-Nya sendiri dan hasilnya bagi banyak orang.
  rationale: Konteks mengarahkan pembaca pada kematian Yesus dan, dalam ayat berikutnya, pada para pengikut-Nya. Namun, ayat ini sendiri menyampaikan perumpamaan pertanian; penerapannya tidak boleh disisipkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi “Aku” mengikuti rujukan kepada Yesus. Pengulangan “sesungguhnya” dan metafora “buah” dipertahankan agar corak khas Yohanes serta ketegangan teologis teks tetap terasa.
