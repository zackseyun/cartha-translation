  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: id
  text: Namun, Yudas Iskariot, salah seorang murid-Nya—yang hendak mengkhianati Dia—berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai kala kini historis, tetapi dalam narasi bahasa Indonesia modern bentuk lampau tidak perlu ditandai secara gramatikal; “berkata” menyampaikan fungsi naratifnya secara alami.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan kontras ringan terhadap tindakan Maria sebelumnya; “Namun” menyatakan pertentangan itu tanpa membuatnya terlalu tajam.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Yudas Iskariot
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: salah seorang murid-Nya
  rationale: “Murid” mempertahankan hubungan guru-murid yang dinyatakan μαθητής; “salah seorang” merupakan ungkapan Indonesia yang alami untuk εἷς τῶν.
- source_word: ὁ μέλλων
  choice: yaitu orang yang akan
  rationale: Ungkapan ini mempertahankan keterangan aposisional dan orientasi tindakan yang akan terjadi, tanpa memaksakan arti bahwa tindakan itu seketika akan berlangsung.
- source_word: παραδιδόναι
  choice: mengkhianati Dia
  rationale: Dalam konteks tindakan Yudas terhadap Yesus, verba ini menyatakan penyerahan yang bersifat pengkhianatan. Arti harfiahnya, “menyerahkan Dia,” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna παραδιδόναι bagi tindakan Yudas terhadap Yesus
  choice: mengkhianati Dia
  alternative: menyerahkan Dia
  rationale: “Mengkhianati” menyampaikan sifat tindakan Yudas dalam konteks ini, sedangkan “menyerahkan” lebih dekat dengan cakupan leksikal dasarnya dan menjaga hubungan verbal dengan konteks penyerahan lain. Alternatif yang lebih harfiah dicatat agar ketegangan leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar untuk narasi. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Tanda pisah menandai keterangan sisipan tentang Yudas, dan koma akhir dipertahankan karena ayat ini mengantar langsung kepada ucapannya pada ayat berikutnya.
