  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: id
  text: Ia mengatakan hal itu untuk menunjukkan bagaimana Ia akan mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan kematian seperti apa Ia akan mati.” Ungkapan Yunani dapat menekankan cara atau jenis kematian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hal itu
  rationale: Kata tunjuk netral tunggal ini merujuk pada perkataan Yesus sebelumnya; “hal itu” alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini bersifat penghubung atau transisional ringan; alur kalimat Indonesia sudah menyampaikan hubungan tersebut tanpa perlu menambahkan “sekarang” atau pertentangan yang kuat.
- source_word: ἔλεγεν
  choice: mengatakan
  rationale: Bentuk imperfek menggambarkan tindakan dalam konteks lampau. Bahasa Indonesia tidak menandai aspek ini secara wajib, dan “mengatakan” tetap alami serta tidak menghilangkan konteks naratif.
- source_word: σημαίνων
  choice: untuk menunjukkan
  rationale: Partisip ini menyatakan cara atau maksud perkataan tersebut, yaitu memberi petunjuk mengenai kematian-Nya. “Menunjukkan” lebih alami bagi pembaca umum daripada “menandakan,” sambil mempertahankan makna indikatifnya.
- source_word: ποίῳ θανάτῳ
  choice: dengan kematian seperti apa
  rationale: Bentuk datif dapat menekankan jenis sekaligus cara kematian. Susunan ini mempertahankan unsur cara yang terkandung dalam bahasa Yunani tanpa menyebut penyaliban secara eksplisit.
- source_word: ἤμελλεν
  choice: akan
  rationale: Dalam konteks ini μέλλω menunjuk pada kematian yang akan terjadi. “Akan” merupakan ungkapan Indonesia yang alami dan tidak memasukkan gagasan takdir secara lebih kuat daripada teks sumber.
- source_word: ἀποθνῄσκειν
  choice: mati
  rationale: Infinitif pelengkap bagi ἤμελλεν diterjemahkan secara wajar dengan “mati.”
theological_decisions:
- issue: Apakah penyaliban perlu disebutkan secara eksplisit
  choice: 'Mempertahankan ungkapan tidak langsung: “dengan kematian seperti apa Ia akan mati”'
  alternative: “bahwa Ia akan mati disalibkan” atau “bagaimana Ia akan dihukum mati”
  rationale: Ayat ini menerangkan bahwa perkataan Yesus menunjukkan cara atau jenis kematian-Nya, tetapi tidak menyebut penyaliban secara langsung. Terjemahan tidak memperjelas melampaui bentuk ungkapan teks.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Kata ganti “Ia” mengikuti rujukan kepada Yesus. Pengulangan “kematian ... mati” dipertahankan karena mencerminkan konstruksi sumber dan tetap dapat dipahami.
