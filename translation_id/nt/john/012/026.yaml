  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: id
  text: Jika seseorang melayani Aku[a], hendaklah ia mengikuti Aku; dan di mana Aku berada, di situ juga pelayan-Ku akan berada. Jika seseorang melayani Aku, Bapa akan menghormati dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani memakai konstruksi tunggal maskulin yang bersifat umum: “Jika seseorang melayani Aku ... Bapa akan menghormati dia.”'
    reason: Menjelaskan bahwa konstruksi maskulin tunggal dalam bahasa sumber bersifat generik; pronomina bahasa Indonesia tidak membedakan gender.
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: melayani
  rationale: Kata ini menyatakan pelayanan kepada Yesus secara umum. “Melayani” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi pelayanan gerejawi resmi.
- source_word: ἀκολουθείτω
  choice: hendaklah ia mengikuti
  rationale: Bentuk imperatif kini menyampaikan panggilan untuk mengikuti Yesus. Ungkapan ini mempertahankan daya perintah tanpa membuat nuansa keberlangsungan lebih eksplisit daripada yang diperlukan.
- source_word: διάκονος
  choice: pelayan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada orang yang melayani Yesus, bukan jabatan gerejawi “diaken”. “Pelayan” juga mempertahankan kaitan leksikal dengan verba “melayani”.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: di mana Aku berada
  rationale: Terjemahan ini alami dan mempertahankan rujukan lokatif; penekanan dari ἐγώ cukup tersampaikan oleh konteks dan penggunaan “Aku”.
- source_word: ἐκεῖ καὶ
  choice: di situ juga
  rationale: Pilihan ini mempertahankan baik unsur tempat maupun makna aditif καί dalam susunan Indonesia yang wajar.
- source_word: τιμήσει
  choice: akan menghormati
  rationale: τιμάω di sini berarti memberi atau menunjukkan hormat. Bentuk ini mempertahankan janji berorientasi masa depan tanpa menentukan wujud penghormatan tersebut.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Teks Yunani menyebut “Bapa” tanpa menambahkan kata milik “Bapa-Ku”; terjemahan ini tidak memasukkan unsur yang tidak dinyatakan.
- source_word: τις
  choice: seseorang
  rationale: Pronomina tak tentu ini bersifat umum. “Seseorang” menyampaikan cakupan tersebut secara alami tanpa membatasi rujukan pada laki-laki.
- source_word: αὐτόν
  choice: dia
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga. “Dia” secara akurat merujuk kembali kepada “seseorang” tanpa menambahkan atau menghapus informasi gender yang secara semantis tidak ditentukan.
theological_decisions:
- issue: Rujukan generik dalam pernyataan bersyarat
  choice: Menggunakan “seseorang”, lalu pronomina tunggal “ia/dia”.
  alternative: Menggunakan bentuk eksplisit bergender seperti “seorang laki-laki” atau mengulang “orang itu”.
  rationale: Maskulin gramatikal Yunani berfungsi generik. Karena pronomina Indonesia tidak bergender, “ia/dia” mempertahankan rujukan tunggal dan cakupan umum secara alami tanpa membuat rujukan itu khusus laki-laki.
- issue: Makna penghormatan dari Bapa
  choice: Menerjemahkan secara langsung “Bapa akan menghormati dia”.
  alternative: Menafsirkannya secara khusus sebagai pahala surgawi atau pemuliaan eskatologis.
  rationale: Ayat ini menjanjikan penghormatan ilahi, tetapi tidak menjelaskan bentuk atau waktunya. Terjemahan mempertahankan keluasan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Aku” dan “-Ku” dipakai sebagai konvensi penghormatan bagi rujukan kepada Yesus; “Bapa” dipertahankan sebagai sebutan teologis. “Hendaklah” menjaga daya imperatif dengan register yang pantas bagi teks Kitab Suci.
