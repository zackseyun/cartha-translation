  to: Pada mulanya, murid-murid-Nya tidak memahami semua ini[a]. Namun, ketika Yesus dimuliakan[b], barulah mereka teringat bahwa semua ini telah tertulis tentang Dia[c] dan bahwa semua ini telah dilakukan kepada-Nya.
