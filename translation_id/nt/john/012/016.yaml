  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: id
  text: Pada mulanya, murid-murid-Nya tidak memahami semua ini[a]. Namun, ketika Yesus dimuliakan[b], barulah mereka teringat bahwa semua ini telah tertulis tentang Dia[c] dan bahwa semua ini telah dilakukan kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak mengetahui semua ini.”'
    reason: lexical_alternative
  - marker: b
    text: Dalam Injil Yohanes, “dimuliakan” lazim berkaitan dengan pemuliaan Yesus melalui kematian, kebangkitan, dan peninggian-Nya.
    reason: cross_reference
  - marker: c
    text: 'Atau: “telah tertulis mengenai Dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: tidak memahami
  rationale: Dalam konteks ini, para murid bukan sekadar belum mengetahui fakta, melainkan belum menangkap makna peristiwa tersebut. Pilihan ini tetap berada dalam cakupan γινώσκω dan terdengar alami dalam bahasa Indonesia.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: murid-murid-Nya
  rationale: Genitif αὐτοῦ menyatakan hubungan atau kepunyaan; bentuk ini merupakan ungkapan Indonesia yang wajar dan ringkas.
- source_word: τὸ πρῶτον
  choice: pada mulanya
  rationale: Ungkapan temporal ini berarti 'pada awalnya'; 'pada mulanya' alami dan sesuai dengan register naratif yang bermartabat.
- source_word: ἐδοξάσθη
  choice: dimuliakan
  rationale: Mempertahankan istilah teologis khas Yohanes tanpa mempersempitnya menjadi sekadar 'dihormati' atau 'ditinggikan'.
- source_word: ἐμνήσθησαν
  choice: mereka teringat
  rationale: Menyampaikan tindakan mengingat kembali secara alami dan mempertahankan urutan naratif.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: telah tertulis tentang Dia
  rationale: ἐπί dengan datif di sini berarti mengenai atau tentang Dia; bentuk perfektum γεγραμμένα menekankan tulisan yang sudah ada dan tetap berlaku.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: orang-orang telah melakukan hal-hal itu kepada-Nya
  rationale: Bahasa Yunani tidak menyatakan subjek secara eksplisit selain bentuk verba orang ketiga jamak. 'Orang-orang' mempertahankan subjek tak tentu dan menghindari kesan keliru bahwa para muridlah pelakunya; 'kepada-Nya' mengikuti datif αὐτῷ tanpa menafsirkan secara lebih khusus sebagai 'bagi-Nya'.
- source_word: ταῦτα
  choice: hal-hal ini / hal-hal itu
  rationale: Mempertahankan bentuk jamak dan rujukan kolektif kepada tindakan serta rincian yang baru diceritakan; peralihan deiktis 'ini' ke 'itu' membuat kalimat Indonesia lebih alami tanpa mengubah acuannya.
theological_decisions:
- issue: Makna Yesus 'dimuliakan' dalam Injil Yohanes
  choice: Mempertahankan 'dimuliakan' tanpa menentukan satu peristiwa secara sempit
  alternative: ditinggikan; dihormati; dimuliakan melalui kematian, kebangkitan, dan kenaikan-Nya
  rationale: Bahasa pemuliaan dalam Yohanes berlapis dan dapat mencakup kematian, kebangkitan, serta peninggian Yesus. Terjemahan utama mempertahankan ketegangan teologis itu.
- issue: Subjek tersirat dalam 'mereka melakukan hal-hal itu kepada-Nya'
  choice: orang-orang
  alternative: mereka; para murid; orang banyak
  rationale: Bentuk Yunani hanya menunjukkan orang ketiga jamak, dan konteks menunjuk kepada para pelaku tindakan penyambutan. 'Orang-orang' cukup jelas dalam bahasa Indonesia tanpa menetapkan kelompok secara lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang alami dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
