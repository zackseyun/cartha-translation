  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: id
  text: Maka, orang banyak yang berdiri di situ dan telah mendengar suara itu mengatakan bahwa bunyi guntur telah terdengar; yang lain berkata, “Seorang malaikat telah berbicara kepada-Nya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan sekaligus hubungan dengan suara dari surga pada ayat sebelumnya tanpa membuat hubungan sebab-akibat terlalu kuat.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: orang banyak yang berdiri di situ
  rationale: Mengungkapkan kelompok orang yang hadir serta keadaan mereka di lokasi kejadian dengan bahasa Indonesia yang wajar.
- source_word: ἀκούσας
  choice: telah mendengar suara itu
  rationale: Bentuk aoris partisip menunjukkan tindakan yang mendahului tindakan mengatakan. 'Suara itu' melengkapi objek tersirat berdasarkan konteks ayat sebelumnya.
- source_word: ἔλεγεν
  choice: mengatakan
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung; dalam konteks ini 'mengatakan' lebih alami daripada bentuk yang menyiratkan pengulangan secara tegas.
- source_word: βροντὴν γεγονέναι
  choice: bahwa barusan terdengar bunyi guntur
  rationale: Menyampaikan secara idiomatis persepsi orang banyak bahwa suatu kejadian berupa guntur baru saja berlangsung, sambil mempertahankan bentuk yang lebih harfiah dalam catatan kaki.
- source_word: ἄλλοι
  choice: yang lain
  rationale: Menunjuk kelompok kedua di antara orang banyak dan mempertahankan kontras dengan penafsiran kelompok pertama.
- source_word: Ἄγγελος
  choice: Seorang malaikat
  rationale: Dalam konteks suara dari surga, kata ini paling mungkin merujuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativa setelah λαλέω paling wajar diterjemahkan 'kepada'; pronomina tersebut merujuk kepada Yesus.
- source_word: λελάληκεν
  choice: telah berbicara
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dan tetap relevan pada saat orang banyak menanggapinya.
theological_decisions:
- issue: Identitas pembicara yang diduga oleh sebagian orang banyak
  choice: Seorang malaikat telah berbicara kepada-Nya
  alternative: Seorang utusan telah berbicara kepada-Nya
  rationale: Konteks suara surgawi mendukung arti 'malaikat', tetapi pernyataan tetap disajikan sebagai penafsiran sebagian orang banyak, bukan penjelasan narator mengenai hakikat suara tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan utama dibuat alami bagi pembaca umum, sedangkan bentuk Yunani yang lebih harfiah dipertahankan dalam catatan kaki. Huruf kapital pada pronomina -Nya mengikuti kebiasaan penulisan Indonesia untuk rujukan kepada Yesus.
