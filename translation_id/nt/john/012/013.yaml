base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: id
  text: Mereka mengambil daun-daun palem lalu keluar untuk menemui Dia. Mereka terus berseru, “Hosana![a] Diberkatilah Dia yang datang dalam nama Tuhan,[b] Raja Israel!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hosana berasal dari ungkapan Ibrani yang berarti “selamatkanlah sekarang” atau “tolong selamatkan”; pada masa itu ungkapan ini juga digunakan sebagai seruan pujian.
    reason: lexical_alternative
  - marker: b
    text: Seruan ini menggemakan Mazmur 118:26.
    reason: cross_reference
  - marker: c
    text: Atau, “dan Raja Israel!”
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ βαΐα τῶν φοινίκων
  choice: ranting-ranting pohon palem
  rationale: Ungkapan ini menyebut ranting dan jenis pohonnya secara eksplisit. Bentuk ulang menyampaikan nomina jamak Yunani dengan wajar dalam bahasa Indonesia.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: pergi menyongsong Dia
  rationale: Menyongsong secara alami menyatakan tindakan pergi keluar untuk menemui seseorang yang sedang datang, tanpa menambahkan gagasan sambutan yang tidak dinyatakan secara eksplisit.
- source_word: ἐκραύγαζον
  choice: terus berseru
  rationale: Kata terus membantu menyampaikan aspek imperfek, yaitu seruan yang berlangsung atau berulang.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Aklamasi yang berasal dari bahasa Ibrani dipertahankan dalam bentuk transliterasi Indonesia; makna asal dan fungsi pujiannya dijelaskan dalam catatan kaki.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Diberkatilah Dia yang datang
  rationale: Terjemahan ini mempertahankan bentuk berkat dan partisip substantival secara alami serta sesuai dengan gema Mazmur 118:26.
- source_word: ἐν ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Ungkapan biblis ini dipertahankan secara formal. Tuhan mewakili κυρίου dalam teks Yunani tanpa menggantinya langsung dengan bentuk nama ilahi dari sumber Ibraninya.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: Dan Raja Israel
  rationale: καί diterjemahkan secara langsung sebagai Dan agar hubungan sintaksisnya tidak diputuskan secara berlebihan sebagai penjelasan aposisional; kemungkinan nuansa 'bahkan' dicatat sebagai alternatif.
theological_decisions:
- issue: Penerjemahan κυρίου dalam kutipan atau gema Mazmur
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κυρίου. Walaupun Mazmur 118:26 dalam bahasa Ibrani memuat nama ilahi, teks utama mengikuti bentuk Yunani; kaitan dengan Mazmur dicatat tanpa mengganti bacaannya.
- issue: Hubungan sebutan Raja Israel dengan Dia yang datang
  choice: Dan Raja Israel
  alternative: bahkan Raja Israel
  rationale: καί memungkinkan bacaan koordinatif maupun penegasan aposisional. Teks utama mempertahankan padanan langsung 'dan', sementara alternatif 'bahkan' dicatat agar ambiguitas dan daya mesianis-rajawi tidak dihilangkan.
- issue: Daya mesianis dan rajawi dalam seruan orang banyak
  choice: mempertahankan gelar Raja Israel tanpa perluasan
  alternative: Raja bagi Israel
  rationale: Gelar eksplisit dalam teks dipertahankan tanpa menambahkan penjelasan kristologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti Dia dipakai menurut kebiasaan luas dalam penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Tanda seru mempertahankan sifat aklamatif ujaran, sedangkan catatan kaki menjaga latar leksikal, gema Mazmur, dan kemungkinan fungsi καί.
