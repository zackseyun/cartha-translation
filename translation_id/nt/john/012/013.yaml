  to: Mereka mengambil daun-daun palem lalu keluar untuk menemui Dia. Mereka terus berseru, “Hosana![a] Diberkatilah Dia yang datang dalam nama Tuhan,[b] Raja Israel!”[c]
  rationale: Revisi memakai “daun-daun palem” dan “keluar untuk menemui Dia” demi kelaziman bahasa Indonesia serta ketelitian terhadap tindakan “keluar untuk menemui.” “Raja Israel” dijadikan aposisi bagi “Dia yang datang,” yang menghasilkan seruan lengkap dan alami; terjemahan koordinatif “dan Raja Israel” tetap tersedia dalam catatan kaki untuk menjaga kemungkinan fungsi καί.
