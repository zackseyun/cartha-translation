id: JHN.12.43
reference: John 12:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: id
  text: Sebab mereka lebih mencintai kemuliaan dari manusia daripada kemuliaan dari Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pujian manusia” atau “penerimaan manusia.”
    reason: Alternatif ini menjelaskan kemungkinan makna kontekstual δόξα tanpa menggantikan istilah “kemuliaan” dalam teks utama.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: mencintai
  rationale: Bentuk aoristus aktif indikatif orang ketiga jamak dari ἀγαπάω. Pilihan ini mempertahankan kekuatan afeksi dan kehendak dalam kata Yunani; unsur perbandingan μᾶλλον ἤπερ menyatakan bahwa yang satu lebih mereka cintai daripada yang lain.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan kausal antarkalimat secara alami dalam bahasa Indonesia.
- source_word: δόξαν
  choice: kemuliaan
  rationale: δόξα dapat berarti kemuliaan, kehormatan, pujian, atau penerimaan. “Kemuliaan” mempertahankan pengulangan kata yang sama dan gaung teologisnya dalam Injil Yohanes tanpa mempersempit makna.
- source_word: τῶν ἀνθρώπων
  choice: dari manusia
  rationale: ἄνθρωποι di sini merujuk kepada manusia secara umum, bukan hanya laki-laki. Kata depan “dari” menyampaikan kemungkinan bahwa kemuliaan itu berasal dari manusia, sambil tetap cukup luas untuk mencakup kehormatan atau pujian manusia.
- source_word: μᾶλλον ἤπερ
  choice: lebih ... daripada
  rationale: Pasangan komparatif ini menyatakan bahwa mereka mengutamakan satu objek kasih dibandingkan objek lainnya; susunan “lebih ... daripada” alami dan tepat dalam bahasa Indonesia.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: “Dari Allah” sejajar dengan “dari manusia” dan menyampaikan kemungkinan sumber kemuliaan tersebut tanpa menghilangkan kontras antara yang manusiawi dan yang ilahi.
theological_decisions:
- issue: Makna δόξα dalam kontras antara manusia dan Allah
  choice: kemuliaan
  alternative: pujian; kehormatan; penerimaan
  rationale: “Kemuliaan” mempertahankan kesinambungan leksikal dan teologis δόξα dalam Injil Yohanes. Pilihan lain mungkin menjelaskan maksud dalam konteks ini, tetapi lebih sempit daripada cakupan istilah Yunani.
- issue: Arah genitif dalam τῶν ἀνθρώπων dan τοῦ θεοῦ
  choice: dari manusia ... dari Allah
  alternative: kemuliaan manusia ... kemuliaan Allah
  rationale: Genitif Yunani dapat dipahami sebagai sumber atau sebagai hubungan kepunyaan. “Dari” menonjolkan sumber pujian atau kehormatan yang cocok dengan konteks, sedangkan catatan kaki mempertahankan kemungkinan ungkapan yang lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Manusia” dipakai secara inklusif sesuai cakupan ἀνθρώπων. Paralel “dari manusia ... dari Allah” dipertahankan agar kontras sumber kemuliaan terdengar jelas.
