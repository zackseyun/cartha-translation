  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: id
  text: Lalu, orang-orang itu datang kepada Filipus, yang berasal dari Betsaida di Galilea. Mereka meminta kepadanya, “Tuan[a], kami ingin melihat Yesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Tuan” juga dapat diterjemahkan “Tuhan”. Di sini kata itu merupakan sapaan hormat kepada Filipus.
    reason: Menjelaskan rentang makna κύριε dan mengapa konteks mendukung sapaan hormat, bukan gelar ilahi.
lexical_decisions:
- source_word: οὗτοι
  choice: orang-orang itu
  rationale: Demonstratif jamak ini menunjuk kembali kepada orang-orang Yunani dalam ayat sebelumnya. “Orang-orang itu” mempertahankan hubungan wacana tersebut dan terdengar alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Lalu
  rationale: Dalam konteks ini οὖν menggerakkan alur narasi sebagai kelanjutan dari ayat sebelumnya. “Lalu” lebih alami daripada “oleh karena itu” tanpa menghilangkan fungsi penghubungnya.
- source_word: προσῆλθον
  choice: datang kepada
  rationale: Bentuk aoris προσέρχομαι berarti datang atau menghampiri seseorang. “Datang kepada” jelas dan wajar dalam narasi Indonesia.
- source_word: Φιλίππῳ
  choice: Filipus
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk Φίλιππος.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: yang berasal dari Betsaida di Galilea
  rationale: Frasa berartikel yang menerangkan Filipus dialihkan menjadi klausa relatif alami. “Di Galilea” menyampaikan hubungan geografis Betsaida dengan wilayah Galilea.
- source_word: ἠρώτων
  choice: Mereka meminta kepadanya
  rationale: Dalam konteks permohonan ini, ἐρωτάω berarti meminta atau memohon. Bentuk imperfek menunjukkan tindakan yang sedang berlangsung, tetapi bahasa Indonesia tidak wajib menandai aspek itu secara eksplisit; “meminta” menghindari penambahan kesan desakan dari “terus meminta”.
- source_word: λέγοντες
  choice: diungkapkan melalui kutipan langsung
  rationale: Partisipel ini memperkenalkan isi permintaan. Dalam bahasa Indonesia, konstruksi “meminta ...” yang langsung diikuti kutipan sudah secara alami menyampaikan fungsi “dengan berkata” tanpa ungkapan yang kaku.
- source_word: Κύριε
  choice: Tuan
  rationale: Sapaan ini ditujukan kepada Filipus. Dalam konteks tersebut, κύριε berfungsi sebagai sapaan hormat kepada seorang laki-laki, sehingga “Tuan” lebih tepat daripada gelar ilahi “Tuhan”; kemungkinan leksikal lainnya dicatat dalam catatan kaki.
- source_word: θέλομεν
  choice: kami ingin
  rationale: θέλω menyatakan kehendak atau keinginan. “Kami ingin” merupakan padanan langsung dan alami dalam bahasa Indonesia modern.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Nama diri sebagai objek langsung tidak memerlukan artikel dalam bahasa Indonesia.
- source_word: ἰδεῖν
  choice: melihat
  rationale: Infinitif aoris ὁράω secara langsung berarti “melihat”. Walaupun konteksnya mungkin menyiratkan pertemuan, terjemahan tidak mempersempit maknanya menjadi “menemui” atau “berbicara dengan”.
theological_decisions:
- issue: Makna κύριε sebagai sapaan langsung kepada Filipus
  choice: Tuan
  alternative: Tuhan
  rationale: Karena orang-orang Yunani sedang berbicara kepada Filipus, sapaan tersebut paling wajar dipahami sebagai bentuk penghormatan kepada manusia, bukan pengakuan kristologis. Namun, κύριε juga merupakan bentuk vokatif dari kata yang sering diterjemahkan “Tuhan”, sehingga rentang maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sambil mempertahankan penunjukan kembali melalui “orang-orang itu”, lokasi asal Filipus, sifat permintaan, dan makna harfiah “melihat”.
