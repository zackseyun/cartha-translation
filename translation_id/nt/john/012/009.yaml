id: JHN.12.9
reference: John 12:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: id
  text: Karena itu, banyak orang dari kalangan Yahudi[a] mengetahui bahwa Yesus ada di sana. Mereka datang bukan hanya karena Yesus, tetapi juga untuk melihat Lazarus, yang telah dibangkitkan-Nya dari antara orang mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kalangan orang Yudea.” Istilah Yunani ini dapat menunjuk kepada orang Yahudi secara umum atau, dalam beberapa konteks di Injil Yohanes, secara lebih khusus kepada orang Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: mengetahui
  rationale: Aoristus γινώσκω di sini menyatakan bahwa orang banyak memperoleh informasi. Dalam konteks ini, 'mengetahui' merupakan ungkapan Indonesia yang alami; nuansa mulai tahu tersirat dari alur narasi.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan konsekuensi dengan konteks sebelumnya dan mempertahankan daya penghubungnya dalam bahasa Indonesia yang wajar.
- source_word: ὄχλος πολὺς
  choice: banyak orang
  rationale: Mengungkapkan kumpulan orang dalam jumlah besar secara alami. Bentuk ini lebih luwes daripada 'kerumunan besar' dalam konteks kedatangan mereka.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: dari kalangan Yahudi
  rationale: Mencerminkan ἐκ sebagai asal atau lingkup kelompok dan menghindari kesan bahwa seluruh orang Yahudi bertindak sebagai satu kesatuan. Catatan kaki mempertahankan kemungkinan makna geografis 'orang Yudea'.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: bahwa Yesus ada di sana
  rationale: Subjek yang tersirat dijelaskan sebagai Yesus berdasarkan konteks. Bahasa Indonesia tidak memerlukan penyesuaian kala seperti bahasa Inggris.
- source_word: ἦλθον
  choice: Mereka datang
  rationale: Padanan naratif langsung dan alami bagi verba gerak ἔρχομαι.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: bukan hanya karena Yesus
  rationale: διά dengan akusatif menyatakan alasan atau motif; 'karena' menyampaikan hubungan kausal dengan jelas.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: tetapi juga untuk melihat
  rationale: Menyampaikan pertentangan korelatif sekaligus tujuan ἵνα secara ringkas dan alami.
- source_word: Λάζαρον
  choice: Lazarus
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: yang telah dibangkitkan-Nya dari antara orang mati
  rationale: '''Telah'' memperjelas bahwa tindakan itu mendahului kedatangan orang banyak. Bentuk pasif hormat dengan enklitik ''-Nya'' secara alami menunjukkan Yesus sebagai pelaku tanpa mengubah makna, sedangkan ''dari antara orang mati'' mempertahankan konstruksi Yunani.'
theological_decisions:
- issue: Cakupan makna Ἰουδαίων dalam Injil Yohanes
  choice: dari kalangan Yahudi
  alternative: dari kalangan orang Yudea
  rationale: Istilah Ἰουδαῖοι dapat menunjuk orang Yahudi secara etnoreligius atau orang Yudea secara geografis. Konteks perayaan dan khalayak umum mendukung terjemahan 'Yahudi', tetapi kemungkinan geografis tetap dicatat agar ambiguitas sumber tidak dihapus.
- issue: Pelaku dalam ὃν ἤγειρεν
  choice: yang telah dibangkitkan-Nya
  alternative: yang telah Ia bangkitkan
  rationale: Keduanya menunjuk kepada Yesus sebagai pelaku berdasarkan subjek tersirat dalam konteks. Bentuk yang dipilih alami dan bermartabat dalam bahasa Indonesia serta tidak menambahkan klaim di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Struktur Yunani dipertahankan sejauh tetap alami; ambiguitas Ἰουδαίων disajikan melalui catatan kaki.
