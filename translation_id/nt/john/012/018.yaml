  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: id
  text: Karena itulah orang banyak itu juga pergi menemui Dia[a], sebab mereka mendengar bahwa Dia telah melakukan tanda ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menemui Dia” atau “keluar untuk menemui Dia.” Kata kerja Yunani mencakup pengertian pergi untuk menemui seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Tanda” adalah istilah khas Yohanes untuk tindakan ajaib yang menunjuk kepada identitas dan misi Yesus; dapat juga diterjemahkan “mukjizat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itulah
  rationale: Ungkapan ini menyatakan hubungan sebab dengan konteks sebelumnya secara jelas dan alami dalam bahasa Indonesia.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan daya tambah konjungsi Yunani tanpa memberi penekanan berlebihan.
- source_word: ὑπήντησεν αὐτῷ
  choice: pergi menemui Dia
  rationale: Kata kerja Yunani mengandung gagasan bergerak untuk menemui seseorang; bentuk ini mempertahankan nuansa arah tersebut.
- source_word: ὁ ὄχλος
  choice: orang banyak itu
  rationale: Padanan yang alami dan bermartabat untuk kelompok orang yang sudah tertentu dalam konteks.
- source_word: ὅτι
  choice: sebab
  rationale: Di sini konjungsi memperkenalkan alasan tindakan orang banyak.
- source_word: ἤκουσαν
  choice: mereka mendengar
  rationale: Aoristus diterjemahkan secara wajar sebagai tindakan lampau; urutan peristiwa sudah jelas dari konteks.
- source_word: αὐτὸν πεποιηκέναι
  choice: Dialah yang telah melakukan
  rationale: Susunan ini mempertahankan penonjolan pronomina αὐτόν serta aspek tindakan yang telah selesai dan tetap relevan.
- source_word: τοῦτο ... τὸ σημεῖον
  choice: tanda itu
  rationale: Demonstrativa menunjuk kepada tanda tertentu yang baru dibicarakan; 'tanda' mempertahankan istilah khas Yohanes.
theological_decisions:
- issue: Penerjemahan σημεῖον dalam Injil Yohanes
  choice: tanda
  alternative: mukjizat
  rationale: '''Tanda'' mempertahankan sifat perbuatan itu sebagai tindakan ajaib yang menunjuk melampaui dirinya kepada identitas dan karya Yesus, tanpa membatasi maknanya hanya pada unsur keajaiban.'
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Dia' dikapitalisasi menurut kebiasaan umum penulisan rujukan kepada Yesus. Penekanan pada αὐτόν diwakili oleh konstruksi 'Dialah yang', sedangkan istilah Yohanes 'tanda' dipertahankan.
