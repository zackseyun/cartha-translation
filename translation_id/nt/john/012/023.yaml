base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: id
  text: Yesus menjawab mereka, “Saatnya[a] telah tiba bagi Anak Manusia[b] untuk dimuliakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jam.” Kata Yunani ini berulang dalam Injil Yohanes untuk saat yang ditetapkan bagi penderitaan dan kemuliaan Yesus.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Sang Manusia.” Gelar Yunani ini menggemakan Daniel 7; “Anak Manusia” dipertahankan untuk menjaga daya teologis dan kaitan antarteks tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: menjawab mereka
  rationale: Bentuk kini historis Yunani dialihkan secara wajar sebagai narasi bahasa Indonesia. Partisipel λέγων tersirat dalam pengantar kutipan langsung sehingga tidak perlu diterjemahkan secara kaku sebagai ‘dengan berkata’.
- source_word: Ἐλήλυθεν
  choice: telah tiba
  rationale: Bentuk perfektum menyatakan bahwa saat yang ditentukan sudah datang dan kini berlangsung; ‘telah tiba’ mempertahankan aspek hasil kini itu.
- source_word: ἡ ὥρα
  choice: saatnya
  rationale: Dalam bahasa Indonesia, ‘saat’ lebih alami daripada ‘jam’ untuk waktu penentu yang telah ditetapkan, sedangkan akhiran -nya mewakili ketentuan frasa Yunani dan menjaga motif khas Injil Yohanes.
- source_word: ἵνα δοξασθῇ
  choice: bagi … untuk dimuliakan
  rationale: Susunan ini menyampaikan isi atau tujuan saat tersebut secara alami serta mempertahankan bentuk pasif dan bobot teologis δοξάζω.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar yang telah mapan ini mempertahankan gema Daniel 7 dan fungsi kristologisnya dalam Injil Yohanes tanpa mereduksinya menjadi sebutan umum bagi manusia.
theological_decisions:
- issue: Gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: ‘Anak Manusia’ mempertahankan bentuk gelar tradisional, kaitan antarteks dengan Daniel 7, dan ketegangan antara kemanusiaan, penderitaan, serta kemuliaan Yesus.
- issue: Daya aspek dan motif Ἐλήλυθεν ἡ ὥρα
  choice: Saatnya telah tiba
  alternative: Waktunya telah tiba
  rationale: ‘Saatnya’ cukup alami dalam bahasa Indonesia sekaligus lebih dekat dengan istilah penentu yang berulang dalam Injil Yohanes; ‘telah tiba’ menandai datangnya saat itu dengan akibat yang kini berlaku.
- issue: Makna δοξασθῇ
  choice: dimuliakan
  alternative: menerima kemuliaan
  rationale: Bentuk pasif dipertahankan tanpa menetapkan secara eksplisit pelakunya, sehingga hubungan paradoksal antara penderitaan, kematian, peninggian, dan kemuliaan dalam konteks Yohanes tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku yang modern, alami, dan khidmat. ‘Namun’ menandai peralihan δέ tanpa memberi pertentangan berlebihan. Pengantar ujaran diringkas menjadi ‘menjawab mereka’ karena kutipan langsung sudah mengungkapkan fungsi λέγων.
