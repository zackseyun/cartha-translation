  naturalness: “Di dunia ini” lebih idiomatis daripada “dalam dunia ini.” Penempatan penanda catatan kaki diperjelas agar catatan leksikal ditautkan pada ψυχή dan catatan paradoks pada ungkapan “membenci nyawanya.”
  terminology: “Nyawa” dapat dipertahankan untuk ψυχή dalam konteks ini dan membedakannya dari ζωή dalam “hidup kekal,” asalkan rentang “hidup/diri/jiwa” dicatat. “Memeliharanya untuk hidup kekal” tetap merupakan terjemahan Indonesia yang wajar untuk φυλάξει αὐτήν εἰς ζωὴν αἰώνιον.
