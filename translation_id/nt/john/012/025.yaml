  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: id
  text: Orang yang mencintai nyawanya[a] akan kehilangan nyawanya itu, dan orang yang membenci nyawanya[b] di dunia ini akan memeliharanya untuk hidup kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupnya” atau “dirinya.” Kata Yunani ψυχή dapat berarti nyawa, hidup, diri, atau jiwa, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: “Membenci nyawanya” merupakan paradoks yang disengaja tentang menolak keterikatan pada hidupnya dalam tatanan dunia sekarang; bandingkan Lukas 14:26 untuk ungkapan serupa. Ini bukan anjuran untuk membenci diri sendiri.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: orang yang mencintai
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menyatakan siapa saja yang terus mencintai; bentuk ini alami dalam bahasa Indonesia dan mempertahankan sifat umum ungkapan tersebut.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nyawanya
  rationale: Dalam konteks kehilangan atau memelihara kehidupan diri sendiri, ψυχή terutama menunjuk pada nyawa atau kehidupan seseorang, bukan secara khusus unsur tak berjasad. 'Nyawa' juga mempertahankan perbedaan dari ζωή dalam frasa 'hidup kekal'.
- source_word: ἀπολλύει αὐτήν
  choice: akan kehilangan nyawanya itu
  rationale: ἀπόλλυμι dengan ψυχή sebagai objek secara wajar berarti kehilangan nyawa. Bentuk kini Yunani menyatakan akibat yang berlaku umum; bahasa Indonesia dapat memakai 'akan' untuk mengungkapkan konsekuensi itu. 'Itu' memperjelas rujukan αὐτήν tanpa pengulangan yang kabur.
- source_word: ὁ μισῶν
  choice: orang yang membenci
  rationale: Kata yang kuat 'membenci' dipertahankan agar paradoks yang disengaja tidak dilunakkan menjadi 'kurang mencintai'.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: dalam dunia ini
  rationale: Terjemahan ini alami dan mempertahankan dunia sekarang sebagai lingkup keterikatan pada nyawa yang dikontraskan dengan hidup kekal.
- source_word: φυλάξει αὐτήν
  choice: akan memeliharanya
  rationale: φυλάσσω di sini berarti menjaga atau mempertahankan agar tidak hilang. 'Memelihara' membentuk kontras yang jelas dengan 'kehilangan' dan tetap alami dalam ragam Kitab Suci yang modern.
- source_word: εἰς ζωὴν αἰώνιον
  choice: untuk hidup kekal
  rationale: εἰς menyatakan tujuan atau hasil. 'Untuk hidup kekal' ringkas dan alami, tanpa memaksakan apakah nuansanya terutama tujuan atau peralihan menuju keadaan tersebut.
theological_decisions:
- issue: Makna 'membenci nyawanya'
  choice: Mempertahankan ungkapan tajam 'membenci nyawanya' sebagai paradoks tentang penolakan terhadap keterikatan pada nyawa dalam dunia sekarang.
  alternative: kurang mencintai nyawanya; tidak mengutamakan nyawanya
  rationale: μισέω secara leksikal berarti membenci, dan frasa 'dalam dunia ini' memberi batas kontekstual. Melunakkannya di teks utama akan menghapus ketegangan retoris dan dapat menutupi tuntutan radikal perkataan Yesus.
- issue: Makna ψυχή
  choice: Menerjemahkannya sebagai 'nyawa' dalam kedua klausa.
  alternative: jiwa; hidup; diri
  rationale: '''Nyawa'' sesuai dengan tindakan kehilangan dan memelihara kehidupan diri, menghindari pemaksaan antropologi dualistis, serta membedakan ψυχή dari ζωή dalam ''hidup kekal''. Rentang makna yang lebih luas dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitetis serta kata kuat 'membenci' dipertahankan. Penanda catatan ditempatkan sesudah seluruh kalimat karena catatan [a] berlaku pada kedua kemunculan 'nyawa', sedangkan [b] menjelaskan paradoks pada klausa kedua.
