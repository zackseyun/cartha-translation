  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: id
  text: Filipus datang dan berkata kepada Andreas[a]; Andreas dan Filipus datang dan berkata kepada Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai bentuk kala kini historis sepanjang ayat ini (secara harfiah, “datang ... berkata ... datang ... berkata”), suatu ciri penceritaan yang membuat adegan terasa langsung. Terjemahan Indonesia sering mengubahnya menjadi bentuk lampau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: datang
  rationale: Mempertahankan kala kini historis Yunani untuk menghadirkan alur secara hidup; dalam konteks ini geraknya menuju orang yang berikutnya ditemui.
- source_word: λέγει
  choice: memberi tahu
  rationale: Mengungkapkan tindakan menyampaikan permintaan orang-orang Yunani kepada Andreas secara wajar dalam bahasa Indonesia, bukan sekadar berkata kepadanya.
- source_word: τῷ Ἀνδρέᾳ
  choice: Andreas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; datif penerima tersirat secara idiomatis setelah 'memberi tahu'.
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: Andreas dan Filipus datang
  rationale: Kala kini historis kembali dipertahankan, sedangkan susunan subjek dan predikat dibuat alami dalam bahasa Indonesia.
- source_word: λέγουσιν
  choice: memberi tahu
  rationale: Bentuk jamak dipahami dari subjek gabungan; pilihan ini mempertahankan kesejajaran dengan klausa pertama.
- source_word: τῷ Ἰησοῦ
  choice: Yesus
  rationale: Datif penerima diungkapkan secara idiomatis sebagai pelengkap verba 'memberi tahu'; nama ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: καί
  choice: dan / lalu
  rationale: Sebagian besar hubungan koordinatif dipertahankan dengan 'dan'; 'lalu' pada peralihan klausa membuat urutan naratif alami tanpa menambahkan hubungan sebab-akibat.
- source_word: ὁ Φίλιππος
  choice: Filipus
  rationale: Artikel Yunani di depan nama diri tidak diterjemahkan karena tidak memiliki fungsi khusus di sini; nama memakai bentuk Indonesia yang lazim.
