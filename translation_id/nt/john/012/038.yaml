  - severity: medium
    issue: Kolokasi “percaya kepada pemberitaan kami” kurang idiomatis
    rationale: Untuk menerima atau menaruh kepercayaan pada isi berita, bahasa Indonesia modern lazim memakai “memercayai berita kami.” “Pemberitaan” juga lebih mudah dipahami sebagai kegiatan memberitakan daripada berita yang dipercayai.
