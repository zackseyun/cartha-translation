  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: id
  text: 'supaya perkataan Nabi Yesaya digenapi, seperti yang ia katakan: “Tuhan, siapakah yang telah memercayai berita kami[a]? Dan kepada siapakah lengan Tuhan telah dinyatakan?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang kami dengar” atau “pesan kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan penghubung Yunani yang dapat mengandung nuansa tujuan maupun hasil tanpa menentukan salah satunya secara tegas.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: perkataan Nabi Yesaya
  rationale: ‘Perkataan’ sesuai dengan rumusan penggenapan kutipan, sedangkan gelar ‘nabi’ dipertahankan secara alami dalam bahasa Indonesia.
- source_word: πληρωθῇ
  choice: genaplah
  rationale: Ungkapan Indonesia yang lazim dan bermartabat untuk motif penggenapan Kitab Suci, sekaligus mempertahankan bentuk pasif secara idiomatis.
- source_word: Κύριε
  choice: Tuhan
  rationale: Menerjemahkan bentuk vokatif κύριος sebagai sapaan langsung dalam kutipan Kitab Suci.
- source_word: ἐπίστευσεν τῇ ἀκοῇ ἡμῶν
  choice: percaya kepada pemberitaan kami
  rationale: ἀκοή dapat menunjuk pada berita atau pesan yang didengar. ‘Pemberitaan kami’ menyampaikan isi yang diberitakan dan cocok dengan verba ‘percaya kepada’.
- source_word: ὁ βραχίων κυρίου
  choice: lengan Tuhan
  rationale: Metafora Alkitab tentang kuasa dan tindakan ilahi dipertahankan, bukan ditafsirkan menjadi ungkapan nonmetaforis.
- source_word: ἀπεκαλύφθη
  choice: telah dinyatakan
  rationale: Mempertahankan bentuk pasif dan menyampaikan tindakan penyingkapan yang hasilnya tetap relevan dalam pertanyaan retoris.
theological_decisions:
- issue: Bahasa penggenapan serta hubungan tujuan dan hasil
  choice: supaya genaplah
  alternative: sehingga genaplah; agar digenapi
  rationale: ἵνα dalam konteks Yohanes dapat membawa nuansa tujuan, hasil, atau keduanya. ‘Supaya genaplah’ mempertahankan ketegangan itu tanpa menambahkan penjelasan deterministis.
- issue: Makna ἀκοή dalam kutipan Yesaya
  choice: pemberitaan kami
  alternative: apa yang kami dengar; pesan kami
  rationale: Kata ini dapat menunjuk pada tindakan mendengar maupun isi yang didengar atau diberitakan. Teks utama memakai makna isi pemberitaan, sementara pilihan lain yang sungguh mungkin dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘supaya genaplah’ mempertahankan corak rumusan penggenapan tanpa menjadi kaku; metafora ‘lengan Tuhan’ dipertahankan apa adanya.
