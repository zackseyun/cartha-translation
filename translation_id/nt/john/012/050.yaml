  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: id
  text: Dan Aku tahu bahwa perintah-Nya adalah hidup yang kekal.[a] Jadi, apa yang Aku katakan, Aku katakan sebagaimana Bapa telah berkata kepada-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perintah-Nya membawa kepada hidup yang kekal” atau “perintah-Nya berkenaan dengan hidup yang kekal.” Secara lebih harfiah, bahasa Yunaninya berbunyi “perintah-Nya adalah hidup yang kekal.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδα
  choice: Aku tahu
  rationale: Padanan langsung dan alami yang mempertahankan kepastian khidmat dalam pernyataan Yesus.
- source_word: ἐντολή
  choice: perintah
  rationale: Menyampaikan ketetapan atau amanat yang berwenang dalam bahasa Indonesia modern tanpa nuansa arkais yang tidak diperlukan.
- source_word: ζωὴ αἰώνιος
  choice: hidup yang kekal
  rationale: Ungkapan baku dalam konteks Yohanes yang mempertahankan makna durasi sekaligus bobot teologis kehidupan zaman yang akan datang.
- source_word: ἃ
  choice: apa yang
  rationale: Padanan idiomatis bagi kata ganti relatif netral jamak ini dan tetap menunjukkan isi perkataan Yesus.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai hubungan kesimpulan dengan klausa sebelumnya secara alami.
- source_word: λαλῶ
  choice: Aku katakan
  rationale: Pengulangan pilihan yang sama pada kedua kemunculan mempertahankan pengulangan λαλέω; 'katakan' lebih alami daripada 'bicarakan' dalam susunan ini.
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menandai kesesuaian antara perkataan Bapa dan perkataan Yesus dengan ragam yang wajar dan bermartabat.
- source_word: εἴρηκέν μοι
  choice: telah mengatakannya kepada-Ku
  rationale: Mencerminkan aspek perfektum sebagai perkataan yang telah disampaikan dan tetap berlaku; akhiran '-nya' merujuk secara alami pada apa yang Yesus katakan.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Mempertahankan gelar relasional Yohanes tanpa menambahkan kata 'Ku' yang tidak terdapat dalam teks Yunani.
theological_decisions:
- issue: Makna 'perintah-Nya adalah hidup yang kekal'
  choice: Mempertahankan ungkapan ekuatif langsung 'adalah hidup yang kekal'.
  alternative: Perintah-Nya menghasilkan hidup yang kekal; perintah-Nya berkenaan dengan hidup yang kekal.
  rationale: Teks Yunani memakai predikat ekuatif langsung. Terjemahan utama mempertahankan ketegangan teologisnya dan tidak mempersempit hubungan tersebut menjadi hasil atau pokok bahasan saja.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam khidmat dan mudah dipahami. Kapitalisasi kata ganti yang merujuk kepada Allah dan Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
