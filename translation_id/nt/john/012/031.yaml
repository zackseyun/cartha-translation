base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: id
  text: Sekaranglah penghakiman atas dunia ini; sekarang penguasa dunia ini[a][b] akan diusir keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemimpin dunia ini”; secara tradisional, “pangeran dunia ini.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “penguasa dunia ini” biasanya dipahami sebagai sebutan bagi Iblis.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: sekarang
  rationale: Dipakai pada kedua kemunculannya untuk mempertahankan penekanan waktu dan kesejajaran struktur Yunani.
- source_word: κρίσις
  choice: penghakiman
  rationale: Menyatakan tindakan penghakiman yang menentukan terhadap dunia ini, tanpa mempersempit maknanya menjadi penghukuman semata.
- source_word: τοῦ κόσμου τούτου
  choice: atas dunia ini
  rationale: Genitif setelah κρίσις dinyatakan secara alami dalam bahasa Indonesia dengan 'atas', sedangkan 'dunia ini' mempertahankan unsur penunjuk τούτου dan corak khas Yohanes.
- source_word: ὁ ἄρχων τοῦ κόσμου τούτου
  choice: penguasa dunia ini
  rationale: '''Penguasa'' menyampaikan sosok yang menjalankan kuasa dengan jelas dalam bahasa Indonesia modern, sementara identitasnya tidak ditambahkan ke dalam teks utama.'
- source_word: ἐκβληθήσεται ἔξω
  choice: akan dilemparkan ke luar
  rationale: Mempertahankan bentuk pasif futur dan daya gabungan verba ἐκβάλλω dengan ἔξω, yaitu pengusiran atau penyingkiran secara tegas.
theological_decisions:
- issue: Identitas 'penguasa dunia ini'
  choice: Dibiarkan tersirat dalam teks utama sebagai 'penguasa dunia ini'.
  alternative: Iblis atau Satan; tatanan dunia sekarang yang dipersonifikasikan.
  rationale: Dalam konteks Injil Yohanes ungkapan ini lazim dipahami sebagai rujukan kepada Iblis, tetapi teks Yunani memakai gelar dan bukan nama. Terjemahan mempertahankan ketegangan tersebut.
- issue: Sasaran penghakiman
  choice: '''Penghakiman atas dunia ini'' tanpa menjelaskan apakah yang terutama dimaksud adalah penghukuman, penilaian, atau titik krisis.'
  alternative: '''Dunia ini dihukum'' atau ''dunia ini menghadapi krisis penghakiman''.'
  rationale: κρίσις memiliki cakupan makna yang lebih luas daripada penghukuman saja; rumusan ini mempertahankan keluasan makna dan ungkapan ringkas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel '-lah' pada 'Sekaranglah' memberi penekanan alami pada νῦν pertama; pengulangan 'sekarang' mempertahankan paralelisme sumber. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
