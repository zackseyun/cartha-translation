id: JHN.12.7
reference: John 12:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: id
  text: Maka Yesus berkata,[a] “Biarkan dia,[b] supaya dia menyimpannya untuk hari penguburan-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarkan dia; dia telah menyimpannya untuk hari penguburan-Ku.” Sebagian orang memahami klausa ini sebagai keterangan tentang apa yang sudah dilakukannya, bukan tentang apa yang masih akan dilakukannya.
    reason: alternative_reading
  - marker: b
    text: Atau, “Biarkan dia, supaya dia menyimpannya sampai hari penguburan-Ku.” Susunan bahasa Yunani ini juga dapat dipahami dengan arti waktu yang lebih tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sekaligus hubungan dengan ucapan Yudas pada ayat sebelumnya; “maka” alami dalam narasi Indonesia dan tidak membuat hubungan itu terlalu tegas sebagai kesimpulan formal.
- source_word: Ἄφες αὐτήν
  choice: Biarkan dia
  rationale: Dalam konteks ini, bentuk perintah tersebut meminta orang lain berhenti mengusik atau mempersoalkan tindakan perempuan itu. “Biarkan dia” menyampaikan daya perintahnya secara ringkas dan alami.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan hubungan tujuan atau hasil yang dimaksudkan tanpa menjelaskan secara berlebihan bagaimana tindakan menyimpan itu berkaitan dengan pengurapan yang baru dilakukan.
- source_word: εἰς τὴν ἡμέραν
  choice: untuk hari
  rationale: Menunjuk kepada peristiwa mendatang yang menjadi tujuan penyimpanan. Pilihan ini tidak mempersempit frasa menjadi arti temporal “sampai hari”, yang tetap dicatat sebagai kemungkinan.
- source_word: ἐνταφιασμοῦ
  choice: penguburan
  rationale: Padanan Indonesia yang jelas dan umum untuk tindakan memakamkan atau menguburkan, tanpa nuansa teknis berlebihan.
- source_word: τηρήσῃ
  choice: dia menyimpannya
  rationale: Bentuk subjungtif setelah ἵνα disampaikan sebagai klausa tujuan. “Menyimpannya” menangkap gagasan menjaga atau mencadangkan sesuatu untuk kesempatan tertentu, sementara kemungkinan bahwa klausa ini menggambarkan apa yang telah dilakukan dicatat dalam catatan kaki.
- source_word: αὐτό
  choice: -nya
  rationale: Akhiran objek pada “menyimpannya” mempertahankan rujukan pronominal Yunani kepada minyak wangi tanpa menambahkan nomina yang tidak muncul dalam ayat ini.
theological_decisions:
- issue: Hubungan tindakan perempuan itu dengan hari penguburan Yesus
  choice: 'Ucapan Yesus diterjemahkan sebagai arahan bertujuan ke depan: “supaya dia menyimpannya untuk hari penguburan-Ku.”'
  alternative: “Biarkan dia; dia telah menyimpannya untuk hari penguburan-Ku,” atau “supaya dia menyimpannya sampai hari penguburan-Ku.”
  rationale: Susunan Yunani sulit dan memungkinkan lebih dari satu pemahaman mengenai waktu serta fungsi tindakan perempuan itu. Teks utama mempertahankan bentuk klausa tujuan yang paling langsung, sedangkan penafsiran tentang tindakan yang sudah dilakukan dan nuansa temporal “sampai” disediakan dalam catatan kaki agar ketegangan dengan konteks tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. “Maka” menjaga alur narasi, “biarkan dia” memakai idiom sehari-hari yang tetap pantas, dan “penguburan” mudah dipahami. Bentuk “-Ku” mengikuti kebiasaan ejaan teks Alkitab Indonesia untuk rujukan diri Yesus.
