  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: id
  text: Sebab orang-orang miskin selalu ada bersama kalian[a], tetapi Aku tidak selalu ada bersama kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “kaum miskin.” Kata sifat Yunani dipakai sebagai kata benda: “orang-orang yang miskin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: orang-orang miskin
  rationale: Kata sifat Yunani ini dipakai secara substantival untuk menunjuk orang-orang yang miskin sebagai suatu golongan. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: γάρ
  choice: sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan logis tersebut secara wajar.
- source_word: πάντοτε
  choice: selalu
  rationale: Adverbia ini menyatakan keberadaan yang terus tersedia dalam konteks ini. Pilihan yang sama dipakai pada kedua kemunculannya untuk mempertahankan kesejajaran.
- source_word: ἔχετε
  choice: ada bersama kalian
  rationale: Dalam konteks ini verba tersebut menyatakan kehadiran atau keberadaan dalam lingkungan para murid, bukan kepemilikan. Bentuk “ada bersama kalian” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “kalian mempunyai”.
- source_word: μεθ’ ἑαυτῶν
  choice: bersama kalian
  rationale: Frasa ini menunjuk keberadaan dalam kebersamaan atau lingkungan mereka. “Kalian” memperjelas bahwa pronomina Yunani berbentuk jamak.
- source_word: ἐμέ
  choice: Aku
  rationale: Pronomina objek ini merujuk kepada Yesus dan dikontraskan secara tegas dengan orang-orang miskin. Susunan bahasa Indonesia dengan “Aku” sebagai subjek klausa keberadaan tetap mempertahankan kontras tersebut.
- source_word: δέ
  choice: tetapi
  rationale: Kata penghubung ini menandai kontras antara keberadaan orang-orang miskin yang berkelanjutan dan terbatasnya waktu kehadiran Yesus bersama para murid.
- source_word: οὐ πάντοτε
  choice: tidak selalu
  rationale: Ungkapan ini secara langsung mempertahankan negasi dan cakupan adverbia tanpa mengubahnya menjadi pernyataan mutlak.
theological_decisions:
- issue: Pernyataan Yesus dapat disalahgunakan seolah-olah meremehkan kepedulian terhadap orang miskin
  choice: Menerjemahkannya sebagai kontras mengenai keberadaan dan waktu, tanpa menambahkan penilaian bahwa orang miskin kurang penting.
  alternative: Memparafrasakan ayat sehingga kepedulian kepada orang miskin tampak tidak penting, atau melemahkan kontras dengan kehadiran Yesus.
  rationale: 'Teks Yunani menyatakan kontras faktual: orang-orang miskin senantiasa ada bersama para murid, sedangkan Yesus tidak senantiasa ada bersama mereka. Terjemahan mempertahankan ketegangan ini tanpa memasukkan kesimpulan teologis yang tidak dinyatakan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipilih untuk menyatakan orang kedua jamak secara alami; “ada bersama” menghindari kesan kepemilikan yang dapat timbul dari terjemahan terlalu harfiah atas ἔχετε. Huruf kapital pada “Aku” mengikuti konvensi penulisan pronomina yang merujuk kepada Yesus.
