    issue: Penambahan “seluruh” pada subjek rumah
    rationale: Teks Yunani menyatakan bahwa “rumah” dipenuhi oleh bau minyak wangi; “seluruh” bukan unsur tersendiri dalam teks dan dapat dihilangkan tanpa kehilangan gambaran intensitas dari verba pasif “dipenuhi.”
  - severity: low
    issue: Rangkaian nomina “minyak wangi narwastu” kurang eksplisit
    rationale: Penambahan “dari” memperjelas bahwa narwastu adalah bahan atau jenis minyak wangi, bukan sekadar aposisi yang mungkin terasa padat bagi pembaca modern.
