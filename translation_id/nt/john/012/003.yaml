id: JHN.12.3
reference: John 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: id
  text: Lalu Maria mengambil satu litra minyak wangi dari narwastu murni yang sangat mahal[a][b], meminyaki kaki Yesus, dan menyeka kaki-Nya dengan rambutnya. Rumah itu pun dipenuhi aroma minyak wangi tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu litra adalah satuan berat Romawi, kira-kira 327 gram.
    reason: cultural_note
  - marker: b
    text: Atau “narwastu asli”; arti kata Yunani yang diterjemahkan “murni” diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan narasi dan kaitannya dengan adegan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: λαβοῦσα
  choice: mengambil
  rationale: Partisip aoris ini paling alami disampaikan sebagai verba berurutan dalam narasi Indonesia.
- source_word: λίτραν
  choice: satu litra
  rationale: Mempertahankan satuan kuno secara spesifik; taksiran modern dijelaskan dalam catatan kaki.
- source_word: μύρου
  choice: minyak wangi
  rationale: Dalam konteks pengurapan, μύρον adalah minyak atau salep beraroma; 'minyak wangi' jelas dan alami bagi pembaca modern.
- source_word: νάρδου
  choice: narwastu
  rationale: '''Narwastu'' adalah istilah Indonesia yang lazim dalam tradisi Alkitab untuk bahan harum nard, tanpa memakai bentuk Inggris.'
- source_word: πιστικῆς
  choice: murni
  rationale: Mengikuti pengertian umum sebagai narwastu berkualitas murni, sambil mempertahankan ketidakpastian leksikalnya dalam catatan kaki.
- source_word: πολυτίμου
  choice: sangat mahal
  rationale: Menyampaikan nilai ekonominya yang tinggi dengan ungkapan Indonesia yang langsung dan alami.
- source_word: ἤλειψεν
  choice: meminyaki
  rationale: Menggambarkan tindakan mengoleskan minyak wangi secara tepat dan bermartabat tanpa memaksakan makna ritual atau doktrinal.
- source_word: τοὺς πόδας τοῦ Ἰησοῦ
  choice: kaki Yesus
  rationale: Bentuk yang alami dan jelas dalam bahasa Indonesia.
- source_word: ἐξέμαξεν
  choice: menyeka
  rationale: Secara langsung menyatakan tindakan mengusap atau mengeringkan dengan rambut.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: dengan rambutnya
  rationale: Mempertahankan fungsi instrumental datif dengan ungkapan Indonesia yang ringkas.
- source_word: ἐπληρώθη
  choice: dipenuhi
  rationale: Mempertahankan bentuk pasif serta gambaran aroma yang memenuhi rumah.
- source_word: ὀσμῆς
  choice: aroma
  rationale: Kata netral dan alami untuk bau harum yang menyebar dari minyak wangi.
theological_decisions:
- issue: Kemungkinan penafsiran berlebihan atas bahasa pengurapan
  choice: Menggunakan 'meminyaki' untuk tindakan fisik dalam narasi
  alternative: Menggunakan 'mengurapi', yang dapat mempertahankan resonansi simbolis tetapi juga lebih mudah dibaca sebagai tindakan ritual atau mesianik
  rationale: Teks menyatakan tindakan mengoleskan minyak wangi pada kaki Yesus, tetapi tidak secara eksplisit menjelaskan makna teologis tindakan itu dalam ayat ini. Pilihan ini menjaga tindakan konkret tanpa menutup kemungkinan makna simbolis dalam konteks yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Istilah kuno 'litra' dipertahankan demi ketepatan sumber dan diterangkan dalam catatan kaki; 'narwastu' dipakai sebagai nama bahan aromatik yang telah dikenal dalam kosakata Alkitab Indonesia.
