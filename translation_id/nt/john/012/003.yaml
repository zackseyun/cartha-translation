  to: Lalu Maria mengambil satu litra minyak wangi dari narwastu murni yang sangat mahal[a][b], meminyaki kaki Yesus, dan menyeka kaki-Nya dengan rambutnya. Rumah itu pun dipenuhi aroma minyak wangi tersebut.
  rationale: Revisi terbatas pada kejelasan idiomatis dan penghilangan tambahan kecil yang tidak diperlukan oleh teks sumber. Makna, urutan tindakan, ambiguitas leksikal πιστική, serta jangkar catatan kaki tetap dipertahankan.
