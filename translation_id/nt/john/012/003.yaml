review_pass:
  verdict: revise
  source_fidelity: 'Draf pada dasarnya menerjemahkan unsur-unsur Yunani dengan tepat: Maria mengambil satu litra minyak wangi narwastu yang mahal, meminyaki kaki Yesus, menyekanya dengan rambutnya, dan rumah dipenuhi harum minyak itu. Catatan mengenai ketidakpastian πιστικῆς juga tepat. Namun, kata “seluruh” dalam “Seluruh rumah itu” tidak diperlukan; οἰκία hanya berarti “rumah,” sedangkan gagasan kepenuhannya telah dinyatakan oleh ἐπληρώθη.'
  naturalness: Bahasanya baku dan lancar. “Minyak wangi dari narwastu” sedikit lebih jelas dan lebih alami daripada rangkaian nomina “minyak wangi narwastu.” Mengganti “lalu” yang kedua dengan “dan” membuat urutan tindakan lebih mengalir tanpa mengubah hubungan naratif.
  terminology: “Litra” mempertahankan satuan kuno λίτρα dan catatan ukurannya memadai. “Narwastu” adalah istilah Alkitab Indonesia yang dikenal untuk νάρδος. “Meminyaki” secara tepat menyatakan tindakan fisik ἀλείφω tanpa memaksakan pembacaan ritual. “Murni” dipertahankan sebagai pilihan utama dengan alternatif “asli” pada catatan kaki, sebab arti πιστική diperdebatkan.
  issues:
