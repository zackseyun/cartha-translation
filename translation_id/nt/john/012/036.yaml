  source_fidelity: 'Makna pokok diterjemahkan dengan setia: ὡς bersifat temporal, seruan πιστεύετε dipertahankan, γένησθε diterjemahkan secara ingresif sebagai “menjadi,” dan ἐκρύβη dipahami secara tepat dalam arti medial, “menyembunyikan diri.” Namun, “ada padamu” kurang langsung menyampaikan ἔχετε (“kamu memiliki/mempunyai”), dan “semuanya itu” memberi penekanan totalitas yang tidak dinyatakan oleh Ταῦτα.'
  naturalness: Teks umumnya baku dan lancar. “Selama kamu masih memiliki terang itu” lebih lazim dan jelas daripada “Selama terang itu ada padamu,” khususnya dalam bahasa Indonesia modern. “Yesus mengatakan hal-hal itu” merupakan padanan yang lebih dekat untuk Ταῦτα tanpa terdengar tidak alami.
  terminology: “Terang itu,” “percayalah kepada terang itu,” dan “anak-anak terang” sesuai dengan diksi Yohanes dan penggunaan Indonesia baku. Catatan kaki secara tepat menjelaskan bentuk maskulin harfiah υἱοί sambil membiarkan idiom Indonesia yang inklusif tetap berada dalam teks utama.
