base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: id
  text: Selama kamu masih memiliki terang itu, percayalah kepada terang itu, supaya kamu menjadi anak-anak terang.[a] Yesus mengatakan hal-hal itu, lalu pergi dan menyembunyikan diri dari mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra terang”; sebuah ungkapan untuk orang-orang yang dicirikan oleh terang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Selama terang itu ada padamu
  rationale: ὡς bersama bentuk kini ἔχετε menyatakan waktu, yakni selama mereka masih mempunyai terang itu. Ungkapan 'ada padamu' alami dalam bahasa Indonesia dan mempertahankan kesan bahwa kesempatan tersebut terbatas.
- source_word: τὸ φῶς
  choice: terang itu
  rationale: Artikel Yunani menandai terang yang tertentu. 'Terang itu' mempertahankan motif terang dalam Injil Yohanes beserta kemungkinan makna harfiah dan kristologisnya tanpa menjelaskannya secara berlebihan.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: percayalah kepada terang itu
  rationale: Bentuk imperatif diterjemahkan sebagai ajakan langsung. 'Percaya kepada' secara alami menyampaikan konstruksi πιστεύω εἰς dan sesuai dengan penggambaran terang secara personal dalam konteks Yohanes.
- source_word: ἵνα ... γένησθε
  choice: supaya kamu menjadi
  rationale: '''Supaya'' mempertahankan daya tujuan/hasil dari ἵνα, sedangkan ''menjadi'' menyampaikan makna γίνομαι dan tidak meratakannya menjadi sekadar ''ada'' atau ''adalah''.'
- source_word: υἱοὶ φωτός
  choice: anak-anak terang
  rationale: Dalam bahasa Indonesia, 'anak-anak terang' adalah ungkapan idiomatis yang mencakup orang-orang yang dicirikan oleh terang. Bentuk harfiah maskulin Yunani dijelaskan dalam catatan kaki agar bentuk sumber tetap transparan tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Yesus mengatakan semuanya itu
  rationale: Susunan ini alami dalam narasi Indonesia. 'Semuanya itu' menunjuk pada perkataan-perkataan yang baru saja disampaikan, tanpa menambah isi.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: lalu pergi dan menyembunyikan diri dari mereka
  rationale: Partisip aoris ἀπελθών menunjukkan tindakan pergi yang mendahului tindakan utama. Dua verba berurutan dengan 'lalu' menyampaikan urutan itu secara lancar; 'menyembunyikan diri' menangkap penggunaan pasif yang bermakna medial dalam konteks ini.
theological_decisions:
- issue: Ungkapan kekeluargaan υἱοὶ φωτός
  choice: anak-anak terang, dengan bentuk harfiah Yunani dijelaskan dalam catatan kaki
  alternative: putra-putra terang
  rationale: υἱοί secara bentuk berarti 'putra-putra', tetapi konstruksi ini merupakan idiom Semitik/Yohanes bagi orang-orang yang dicirikan oleh terang dan tidak terbatas pada laki-laki. Teks utama memakai bahasa Indonesia yang alami dan representatif, sementara catatan menjaga transparansi bentuk gramatikal sumber.
- issue: Makna kristologis 'terang'
  choice: terang itu
  alternative: Kristus atau Sang Terang
  rationale: Teks Yunani hanya mengatakan τὸ φῶς. Terjemahan mempertahankan metafora dan gema kristologisnya tanpa mengganti metafora itu dengan tafsiran eksplisit.
- issue: Ungkapan πιστεύω εἰς
  choice: percayalah kepada terang itu
  alternative: berimanlah kepada terang itu
  rationale: '''Percayalah kepada'' merupakan padanan langsung dan alami yang mempertahankan seruan Yohanes untuk menaruh kepercayaan pada terang, tanpa memasukkan istilah teologis tambahan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. Pengulangan 'terang itu' dipertahankan karena merupakan unsur retoris dan teologis penting dalam teks Yunani. Pronomina 'kamu' digunakan untuk orang kedua jamak sesuai konteks, tanpa bentuk regional atau arkais.
