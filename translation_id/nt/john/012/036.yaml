  - severity: low
    issue: “Semuanya itu” menambahkan nuansa totalitas pada Ταῦτα.
    rationale: Ταῦτα berarti “hal-hal ini/itu,” tanpa unsur “semua.” Penggantian dengan “hal-hal itu” menjaga rujukan demonstratif tanpa penambahan makna.
