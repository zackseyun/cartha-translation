  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: id
  text: Maka, mereka menyiapkan perjamuan bagi Yesus di sana. Marta melayani, sedangkan Lazarus adalah salah seorang dari mereka yang duduk makan[a] bersama Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “salah seorang dari mereka yang berbaring bersandar bersama-Nya.” Berbaring bersandar adalah kebiasaan pada perjamuan resmi pada masa itu.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: menyiapkan
  rationale: Dalam gabungan dengan δεῖπνον, ποιέω berarti membuat atau mempersiapkan sebuah jamuan. “Menyiapkan” alami dalam bahasa Indonesia dan tidak menentukan siapa tuan rumahnya.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata ini menghubungkan peristiwa tersebut dengan konteks sebelumnya dan dapat menyatakan kelanjutan yang bersifat simpulan; “Karena itu” mempertahankan daya penghubungnya.
- source_word: αὐτῷ
  choice: bagi Yesus
  rationale: Datif ini menyatakan pihak yang untuknya jamuan disiapkan. Nama “Yesus” dipakai agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: δεῖπνον
  choice: perjamuan
  rationale: Kata ini menunjuk pada santapan utama, biasanya pada petang hari. “Perjamuan” mempertahankan nuansa acara makan bersama tanpa melebih-lebihkannya sebagai pesta besar.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan lokatif langsung yang merujuk kembali kepada Betania dalam konteks.
- source_word: διηκόνει
  choice: melayani
  rationale: Bentuk imperfek menggambarkan kegiatan Marta yang sedang berlangsung. Dalam konteks jamuan, “melayani” secara wajar dipahami sebagai melayani hidangan dan tidak perlu diberi warna jabatan keagamaan.
- source_word: δὲ
  choice: sedangkan
  rationale: Partikel ini menandai peralihan dengan kontras ringan antara Marta yang melayani dan Lazarus yang ikut makan.
- source_word: εἷς ἦν ἐκ
  choice: termasuk orang-orang
  rationale: Ungkapan ini menyatakan bahwa Lazarus adalah salah seorang dari kelompok yang hadir makan bersama Yesus.
- source_word: ἀνακειμένων
  choice: orang-orang yang duduk makan
  rationale: Secara harfiah kata ini menggambarkan orang yang berbaring bersandar pada waktu makan. Dalam teks utama, “duduk makan” menyampaikan fungsi adegan secara alami bagi pembaca Indonesia, sementara postur historis dijelaskan dalam catatan.
- source_word: σὺν αὐτῷ
  choice: bersama Yesus
  rationale: Ungkapan ini menyatakan kebersamaan; nama “Yesus” memperjelas rujukan kata ganti dalam bahasa Indonesia.
theological_decisions: []
