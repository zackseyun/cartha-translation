  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Duduk makan” dipilih sebagai ungkapan alami dalam teks utama, dengan postur makan kuno dipertahankan melalui catatan kaki. Pergantian kata ganti menjadi nama Yesus menghindari ketidakjelasan tanpa menambah tafsiran.
