  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: id
  text: Sebab Aku tidak berbicara dari diri-Ku sendiri,[a] tetapi Bapa yang mengutus Aku, Dialah yang telah memberi-Ku perintah tentang apa yang harus Kukatakan dan apa yang harus Kuucapkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “atas prakarsa-Ku sendiri” atau “atas wewenang-Ku sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani memakai dua kata kerja yang berbeda, yang dapat diterjemahkan “mengatakan” dan “berbicara”; terjemahan ini mempertahankan variasinya dengan “mengatakan” dan “mengucapkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: atas kehendak-Ku sendiri
  rationale: Ungkapan ini menyatakan bahwa Yesus tidak berbicara secara mandiri atau atas prakarsa-Nya sendiri. Bentuk ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada sumber perkataan atau kewenangan.
- source_word: οὐκ ἐλάλησα
  choice: Aku tidak berbicara
  rationale: Aoristus Yunani dipadankan dengan bentuk lampau yang secara alami juga dapat merangkum pelayanan Yesus hingga saat itu; bahasa Indonesia tidak mewajibkan pembedaan antara simple past dan present perfect.
- source_word: ὁ πέμψας με πατὴρ
  choice: Bapa yang mengutus Aku
  rationale: Menerjemahkan partisip substantival secara alami dan mempertahankan 'Bapa' sebagai gelar ilahi dalam konteks Yohanes.
- source_word: αὐτός
  choice: Dialah
  rationale: Bentuk penegas ini mempertahankan tekanan pada Bapa sendiri sebagai pemberi perintah.
- source_word: ἐντολήν
  choice: perintah
  rationale: '''Perintah'' merupakan padanan Indonesia modern yang alami dan tetap mempertahankan daya otoritatif kata Yunani.'
- source_word: δέδωκεν
  choice: telah memberi-Ku
  rationale: 'Kata ''telah'' mencerminkan aspek perfektif: perintah itu sudah diberikan dan tetap berlaku.'
- source_word: τί εἴπω
  choice: apa yang harus Kukatakan
  rationale: Konstruksi pertanyaan tak langsung sesudah 'perintah' secara alami mengandung daya pengarahan, yang dinyatakan dengan 'harus'.
- source_word: καὶ τί λαλήσω
  choice: dan apa yang harus Kusampaikan
  rationale: Pilihan 'sampaikan' mempertahankan variasi leksikal dari εἴπω/λαλήσω tanpa menghasilkan pengulangan Indonesia yang kaku. Catatan kaki menjelaskan adanya dua verba Yunani.
theological_decisions:
- issue: Hubungan perkataan Sang Anak dengan perintah Bapa
  choice: Terjemahan menyatakan bahwa Yesus tidak berbicara atas kehendak-Nya sendiri, tetapi menurut perintah Bapa yang mengutus-Nya.
  alternative: Yesus berbicara secara mandiri namun kebetulan sejalan dengan Bapa; atau ayat ini semata-mata menyamakan Yesus dengan seorang nabi manusia biasa.
  rationale: Teks menekankan ketidakmandirian dalam pelaksanaan misi dan perkataan, tanpa membuat pernyataan tambahan mengenai hakikat Sang Anak atau menyelesaikan ketegangan teologis di luar yang dinyatakan ayat.
- issue: Pemadanan πατήρ
  choice: Bapa
  alternative: bapa
  rationale: Dalam konteks Yohanes, kata ini menunjuk kepada Allah sebagai Bapa dan berfungsi sebagai sebutan ilahi; kapitalisasi sesuai kaidah dan kebiasaan bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada pribadi ilahi mengikuti konvensi umum penerjemahan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami sambil mempertahankan penegasan αὐτός dan perbedaan kedua verba penuturan.
