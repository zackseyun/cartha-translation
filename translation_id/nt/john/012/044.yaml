  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: id
  text: Namun, Yesus berseru dan berkata, “Orang yang percaya kepada-Ku[a] tidak percaya kepada-Ku[b], melainkan kepada Dia yang mengutus Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang percaya kepada-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Ini tidak menyangkal bahwa iman memang tertuju kepada Yesus; maksudnya, percaya kepada-Nya tidak dapat dipisahkan dari percaya kepada Dia yang mengutus-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang disertai kontras ringan dengan konteks sebelumnya. “Namun” alami dalam bahasa Indonesia dan tidak membuat kontrasnya terlalu tajam.
- source_word: ἔκραξεν
  choice: berseru
  rationale: Kata κράζω menunjuk pada ucapan yang lantang dan terbuka. “Berseru” mempertahankan kekuatan serta kekhidmatan tuturan tanpa menyiratkan kemarahan seperti yang mungkin ditimbulkan oleh “berteriak”.
- source_word: Ὁ πιστεύων
  choice: Orang yang percaya
  rationale: Partisipel kini berartikel ini berfungsi secara substantival dan generik. “Orang yang percaya” dekat dengan bentuk Yunani, tetap wajar, dan tidak menambahkan penafsiran tentang aspek verbal.
- source_word: πιστεύων / πιστεύει εἰς
  choice: percaya kepada
  rationale: Dalam bahasa Indonesia, “percaya kepada” secara alami menyatakan iman atau kepercayaan yang diarahkan kepada pribadi. Pilihan ini juga mempertahankan pengulangan verba Yunani dalam kedua klausa.
- source_word: εἰς ἐμέ
  choice: kepada-Ku
  rationale: Bersama πιστεύω, εἰς menyatakan arah kepercayaan kepada suatu pribadi. Terjemahan harfiah spasial seperti “ke dalam Aku” tidak alami dan mengaburkan idiom Yunani.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: melainkan kepada Dia yang mengutus Aku
  rationale: “Melainkan” menyatakan koreksi atau kontras setelah bentuk negatif, sedangkan “Dia yang mengutus Aku” mempertahankan konstruksi partisipial dan tidak mengganti rujukannya dengan “Bapa” di dalam teks utama.
theological_decisions:
- issue: Pernyataan “bukan percaya kepada-Ku, melainkan kepada Dia yang mengutus Aku” dapat disalahpahami sebagai penyangkalan bahwa iman tertuju kepada Yesus.
  choice: Mempertahankan susunan negatif dan kontras sebagaimana dalam bahasa Yunani, sambil menjelaskan dalam catatan bahwa iman kepada Yesus tidak terpisahkan dari iman kepada Dia yang mengutus-Nya.
  alternative: Menerjemahkan “bukan hanya percaya kepada-Ku” atau menyebut “Bapa” secara langsung dalam teks utama.
  rationale: Teks Yunani tidak memuat kata “hanya.” Menambahkannya akan menghilangkan ketegangan retoris dan teologis yang disengaja. Rujukan “Dia yang mengutus Aku” juga dipertahankan agar terjemahan tidak memperjelas lebih jauh daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berseru” dipilih sebagai ungkapan publik yang lantang tetapi tidak kasar. Huruf kapital pada bentuk sapaan ilahi (“-Ku,” “Dia,” dan “Aku”) mengikuti kebiasaan ortografis Indonesia dalam teks keagamaan. Struktur kalimat mempertahankan pengulangan dan ketegangan asli tanpa menambahkan kata “hanya.”
