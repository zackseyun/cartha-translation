- from: Yesaya mengatakan hal-hal ini karena ia telah melihat kemuliaan-Nya dan berbicara tentang Dia.[a]
  to: Yesaya mengatakan semuanya ini karena ia melihat kemuliaan-Nya dan berbicara tentang-Nya.[a]
  rationale: Revisi menghilangkan nuansa perfektif yang tidak dituntut oleh εἶδεν, memperhalus idiom Indonesia, dan memperbaiki koherensi pronomina dalam catatan kaki. Teks utama tetap tidak menamai referen pronomina sehingga ketegangan antara penerapan Yohanes kepada Yesus dan latar Yesaya 6 tetap terpelihara.
