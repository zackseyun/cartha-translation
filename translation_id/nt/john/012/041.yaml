  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: id
  text: Yesaya mengatakan semuanya ini karena ia melihat kemuliaan-Nya dan berbicara tentang-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesaya mengatakan semuanya ini karena ia melihat kemuliaan Allah dan berbicara tentang-Nya.” Dalam konteks Yohanes, kedua pronomina itu kemungkinan besar merujuk kepada Yesus, tetapi latar yang lebih luas dalam kitab Yesaya adalah penglihatan tentang kemuliaan Tuhan (Yes. 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Bentuk jamak netral ini merujuk kembali pada pernyataan-pernyataan nubuat yang baru dikutip; “hal-hal ini” mempertahankan bentuk jamaknya secara wajar.
- source_word: εἶπεν
  choice: mengatakan
  rationale: Padanan langsung bagi aoristus λέγω; pilihan ini juga membedakannya dari ἐλάλησεν pada bagian akhir ayat.
- source_word: Ἠσαΐας
  choice: Yesaya
  rationale: Bentuk nama nabi yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini, ὅτι paling wajar menyatakan alasan Yesaya mengatakan hal-hal tersebut. Arti “bahwa” mungkin secara gramatikal, tetapi kurang sesuai dengan alur penjelasan ayat.
- source_word: εἶδεν
  choice: telah melihat
  rationale: Menyatakan tindakan lampau yang menjadi dasar perkataan Yesaya; “telah melihat” alami dalam bahasa Indonesia dan menegaskan hubungan waktunya tanpa menambah isi.
- source_word: τὴν δόξαν
  choice: kemuliaan
  rationale: “Kemuliaan” adalah padanan baku yang mempertahankan bobot teologis δόξα dalam Injil Yohanes.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina posesif maskulin tunggal diterjemahkan secara alami sebagai “kemuliaan-Nya”; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi, sementara identitas rujukannya dijelaskan dalam catatan.
- source_word: ἐλάλησεν
  choice: berbicara
  rationale: Padanan alami bagi λαλέω dan mempertahankan sedikit pembedaan dari εἶπεν, “mengatakan”.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: περί dengan genetif berarti “tentang/mengenai”; “tentang Dia” merupakan ungkapan modern dan alami.
theological_decisions:
- issue: Rujukan kedua pronomina αὐτοῦ
  choice: Teks utama memakai pronomina “-Nya” dan “Dia”, yang dalam konteks Yohanes paling mungkin merujuk kepada Yesus.
  alternative: Kedua pronomina dapat dipahami merujuk kepada Allah/Tuhan sebagaimana latar penglihatan Yesaya 6.
  rationale: Konteks langsung Yohanes 12:37–41 menerapkan nubuat Yesaya pada tanggapan terhadap Yesus, sehingga rujukan kepada Yesus paling mungkin. Namun, karena bentuk Yunani sendiri hanya berupa pronomina dan latar Yesaya adalah penglihatan kemuliaan Tuhan, catatan kaki mempertahankan ketegangan dan kemungkinan rujukan yang lebih umum kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dekat dengan teks Yunani tetapi tetap alami; pembedaan antara εἶπεν dan ἐλάλησεν dipertahankan melalui “mengatakan” dan “berbicara”.
