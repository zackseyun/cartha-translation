    issue: '"telah melihat" untuk εἶδεν'
    rationale: Aoristus Yunani cukup diterjemahkan "melihat". "Telah melihat" bukan salah, tetapi memberi penandaan perfektif yang tidak eksplisit dalam sumber.
  - severity: medium
    issue: Ketidakselarasan rujukan dalam catatan kaki alternatif
    rationale: Catatan alternatif berbunyi "kemuliaan Allah dan berbicara tentang Dia." Dalam alternatif yang menawarkan Allah sebagai rujukan, pronomina terakhir semestinya juga ditandai sebagai rujukan kepada Allah ("tentang-Nya") agar pembacaan alternatif tidak rancu.
