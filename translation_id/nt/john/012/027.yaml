base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: id
  text: Sekarang jiwa-Ku gelisah,[a] dan apa yang harus Kukatakan? Bapa, selamatkanlah Aku dari saat ini. Namun, justru untuk inilah Aku sampai pada saat ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang harus Kukatakan? ‘Bapa, selamatkanlah Aku dari saat ini’?” Teks Yunani juga dapat dibaca sebagai pertanyaan retoris, bukan sebagai permohonan langsung.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Sekarang
  rationale: Menandai langsungnya kegelisahan Yesus pada saat itu; alami dan lugas dalam bahasa Indonesia.
- source_word: ἡ ψυχή μου
  choice: jiwa-Ku
  rationale: Menunjuk pada batin atau pribadi Yesus yang sedang mengalami kegelisahan. 'Jiwa' mempertahankan bobot ungkapan Yunani tanpa mempersempitnya menjadi sekadar emosi.
- source_word: τετάρακται
  choice: gelisah
  rationale: Bentuk perfek menyatakan keadaan kini yang timbul akibat guncangan. 'Gelisah' alami dalam bahasa Indonesia dan menyampaikan pergolakan batin, sedangkan aspek keadaannya ditopang oleh konteks 'sekarang'.
- source_word: τί εἴπω
  choice: apa yang harus Kukatakan?
  rationale: Subjungtif deliberatif menyatakan pertimbangan mengenai apa yang akan dikatakan; frasa ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: πάτερ
  choice: Bapa
  rationale: Sapaan langsung kepada Allah; 'Bapa' adalah bentuk yang alami, khidmat, dan lazim dalam konteks ini.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: selamatkanlah Aku dari saat ini
  rationale: Imperatif aoris meminta pelepasan dari masa penderitaan yang segera dihadapi. 'Selamatkanlah' mempertahankan cakupan verba σῴζω, sementara 'dari' mencerminkan ἐκ.
- source_word: ὥρα
  choice: saat
  rationale: Dalam Injil Yohanes, ὥρα menunjuk pada waktu penentu yang telah ditetapkan bagi penderitaan, kematian, dan pemuliaan Yesus. 'Saat' mempertahankan motif waktu penentu itu dan lebih alami daripada 'jam' dalam bahasa Indonesia.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Namun, justru untuk inilah
  rationale: ἀλλά menandai pertentangan, sedangkan διὰ τοῦτο di sini menyampaikan alasan atau tujuan. 'Justru' menegaskan peralihan dari keinginan untuk dilepaskan kepada penerimaan tujuan kedatangan-Nya.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: Aku datang kepada saat ini
  rationale: Mempertahankan gerak εἰς menuju waktu penentu tersebut dan tidak mengubahnya secara diam-diam menjadi 'Aku datang untuk saat ini', walaupun nuansa tujuan hadir dalam konteks.
theological_decisions:
- issue: Apakah 'Bapa, selamatkanlah Aku dari saat ini' merupakan permohonan langsung atau bagian dari pertanyaan retoris sebelumnya.
  choice: 'Diterjemahkan sebagai permohonan langsung: ''Bapa, selamatkanlah Aku dari saat ini.'''
  alternative: 'Dibaca sebagai kemungkinan yang ditolak secara retoris: ''Apa yang harus Kukatakan? “Bapa, selamatkanlah Aku dari saat ini”?'''
  rationale: Tanda baca bukan bagian asli naskah paling awal, sehingga kedua pembacaan dimungkinkan. Tanda baca SBLGNT mendukung permohonan langsung yang kemudian dikontraskan dengan penerimaan tujuan kedatangan Yesus. Catatan kaki mempertahankan pembacaan alternatif dan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai sesuai kebiasaan penerbitan Alkitab Indonesia. Istilah 'saat' dipilih untuk motif ὥρα dalam Yohanes; susunan 'datang kepada saat ini' sengaja agak formal guna mempertahankan metafora tiba pada waktu yang ditetapkan.
