  terminology: “Jiwa,” “Bapa,” dan “selamatkanlah” sesuai register Alkitab dan cukup dekat dengan ψυχή, πάτερ, dan σῶσον. “Saat” dapat dipertahankan untuk ὥρα, meskipun frasa “saat ini” juga berfungsi idiomatis sebagai “sekarang”; pengulangan dan konteks menjaga rujukan pada saat yang menentukan. Catatan kaki perlu memusatkan pembacaan alternatif pada pertanyaan dan permohonan yang dipersoalkan, bukan mengutip ulang klausa pembuka.
