  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: id
  text: '“Bapa, muliakanlah nama-Mu.” Lalu terdengarlah suara dari surga: “Aku telah memuliakannya[a] dan akan memuliakannya lagi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Aku memuliakannya dan akan memuliakannya lagi.”
    reason: Alternatif ini mencerminkan bentuk aoris Yunani ἐδόξασα tanpa memakai penanda eksplisit “telah,” dan mencakup seluruh ucapan dari surga.
lexical_decisions:
- source_word: πάτερ
  choice: Bapa
  rationale: Bentuk vokatif ini merupakan sapaan langsung kepada Allah. “Bapa” alami dan bermartabat dalam bahasa Indonesia serta tidak menambahkan kata “-Ku” yang tidak terdapat dalam bahasa Yunani.
- source_word: δόξασόν
  choice: muliakanlah
  rationale: Bentuk imperatif aoris dari δοξάζω. “Muliakanlah” mempertahankan jaringan makna teologis tentang kemuliaan dalam Injil Yohanes dan lebih tepat daripada sekadar “hormatilah”.
- source_word: σου τὸ ὄνομα
  choice: nama-Mu
  rationale: Ungkapan ini menunjuk bukan hanya pada sebutan, melainkan juga pada pribadi, karakter, dan penyataan Allah. “Nama-Mu” mempertahankan ungkapan alkitabiah itu tanpa parafrasa berlebihan.
- source_word: ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: Lalu terdengarlah suara dari surga
  rationale: οὖν menandai kelanjutan narasi, sehingga “lalu” sesuai dalam konteks ini. Secara harfiah suara itu “datang,” tetapi “terdengarlah suara” merupakan ungkapan Indonesia yang lebih alami untuk kemunculan suara tanpa mengubah asal ilahinya, yaitu “dari surga”.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Aku telah memuliakannya dan akan memuliakannya lagi
  rationale: 'Bentuk aoris ἐδόξασα diterjemahkan dengan “telah memuliakannya” untuk menyatakan tindakan yang sudah terlaksana dan tetap relevan bagi jawaban ini; alternatif yang lebih formal dicatat dalam catatan kaki. Akhiran “-nya” secara wajar merujuk kembali kepada “nama-Mu,” sedangkan πάλιν melekat pada tindakan yang akan datang: “lagi.”'
theological_decisions:
- issue: Objek tersirat dalam jawaban dari surga
  choice: Menambahkan akhiran “-nya” yang merujuk kepada “nama-Mu”
  alternative: 'Membiarkan objek tidak disebutkan: “Aku telah memuliakan dan akan memuliakan lagi”'
  rationale: Bahasa Yunani membiarkan objeknya tersirat karena dapat dipahami dari konteks. Bahasa Indonesia lebih alami dengan objek “-nya,” yang menjelaskan bahwa Bapa sedang berbicara tentang pemuliaan nama-Nya sendiri tanpa memperkenalkan objek baru.
- issue: Terjemahan δοξάζω dalam konteks teologis Injil Yohanes
  choice: memuliakan
  alternative: menghormati; menyatakan kemuliaan
  rationale: “Memuliakan” mempertahankan kaitan leksikal dan teologis dengan tema kemuliaan Bapa dan Anak dalam Injil Yohanes, tanpa mempersempitnya menjadi penghormatan biasa.
- issue: Aspek verba aoris ἐδόξασα
  choice: Aku telah memuliakannya
  alternative: Aku memuliakannya
  rationale: Perfektif aoris menyajikan tindakan sebagai suatu keseluruhan, tetapi tidak dengan sendirinya menentukan padanan kala Indonesia. “Telah memuliakannya” paling jelas menyampaikan tindakan lampau yang relevan dengan jawaban sekarang, sementara bentuk yang lebih dekat secara formal dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Sapaan ilahi memakai “Bapa” dan pronomina hormat “-Mu.” Tanda petik membedakan ucapan Yesus dan suara dari surga; catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
