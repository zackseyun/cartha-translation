  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: id
  text: “Mengapa minyak wangi ini tidak dijual seharga tiga ratus dinar dan uangnya diberikan kepada orang miskin?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu dinar merupakan upah harian yang lazim bagi seorang pekerja; tiga ratus dinar kira-kira setara dengan penghasilan setahun, dengan memperhitungkan hari-hari ketika tidak bekerja.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Ungkapan tanya ini secara idiomatis berarti ‘mengapa?’ atau ‘karena alasan apa?’; ‘Mengapa’ ringkas dan alami dalam bahasa Indonesia modern.
- source_word: μύρον
  choice: minyak wangi
  rationale: Kata ini menunjuk pada minyak atau salep beraroma yang mahal. ‘Minyak wangi’ alami dalam konteks pengurapan dan tidak mengesankan parfum modern berbasis alkohol.
- source_word: οὐκ ἐπράθη
  choice: tidak dijual
  rationale: Bentuk pasif aoristus dari πιπράσκω dipertahankan secara langsung dan sesuai dengan nada pertanyaan retoris.
- source_word: τριακοσίων δηναρίων
  choice: seharga tiga ratus dinar
  rationale: Genitif menyatakan harga. ‘Dinar’ mempertahankan satuan uang historis, sedangkan nilai ekonominya dijelaskan dalam catatan kaki.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: dan uangnya diberikan kepada orang miskin
  rationale: Secara harfiah teks berbunyi ‘dan diberikan kepada orang miskin’, dengan objek yang dilesapkan. Dalam bahasa Indonesia, ‘uangnya’ membuat rujukan pada hasil penjualan menjadi jelas dan alami tanpa mengubah maksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah historis ‘dinar’ dipertahankan, sedangkan nilainya diterangkan dalam catatan kaki. Pertanyaan retoris dan bentuk pasif teks Yunani dipertahankan.
