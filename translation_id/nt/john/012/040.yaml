id: JHN.12.40
reference: John 12:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: id
  text: Ia telah membutakan mata mereka dan mengeraskan hati mereka, supaya mereka tidak melihat dengan mata mereka, tidak mengerti dengan hati mereka, dan tidak berbalik[a], dan Aku akan menyembuhkan mereka.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertobat.”
    reason: lexical_alternative
  - marker: b
    text: Bentuk Yunani adalah masa depan, “Aku akan menyembuhkan mereka.” Dalam rangkaian kutipan ini, bentuk itu dapat dipahami dalam hubungan dengan mereka berbalik.
    reason: lexical_alternative
  - marker: c
    text: Bagian ini menggemakan Yesaya 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: telah membutakan
  rationale: Bentuk perfektum menunjukkan tindakan yang telah terjadi dengan keadaan yang masih berlangsung; “telah membutakan” mempertahankan daya tersebut.
- source_word: ἐπώρωσεν
  choice: mengeraskan
  rationale: Kata ini berarti membuat keras atau tidak peka; “mengeraskan” alami dalam bahasa Indonesia dan mempertahankan nuansa penghakiman dalam kutipan profetis.
- source_word: καρδίαν / καρδίᾳ
  choice: hati
  rationale: “Hati” mempertahankan gambaran antropologis Alkitab, sedangkan unsur kognitifnya disampaikan oleh kata “mengerti”.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Ungkapan ini mempertahankan kemungkinan makna tujuan/hasil tanpa meredakan ketegangan mengenai tindakan ilahi.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: melihat dengan mata mereka
  rationale: Terjemahan langsung mempertahankan gambaran konkret dan kesejajaran dengan memahami menggunakan hati.
- source_word: νοήσωσιν
  choice: mengerti
  rationale: Kata kerja ini menunjuk pada pemahaman atau penangkapan makna; “mengerti” jelas dan alami.
- source_word: στραφῶσιν
  choice: berbalik
  rationale: “Berbalik” mempertahankan keluasan dan idiom profetis verba Yunani tanpa langsung mempersempitnya menjadi istilah doktrinal “bertobat” atau bentuk pasif “dipertobatkan”.
- source_word: ἰάσομαι
  choice: Aku menyembuhkan
  rationale: Bentuk Yunani secara morfologis adalah futurum, tetapi berada dalam rangkaian klausa ἵνα yang ditiadakan. Dalam bahasa Indonesia, “lalu Aku menyembuhkan” secara alami berada di bawah cakupan “tidak” terakhir dan menyampaikan hasil yang terhalang tanpa memaksakan modalitas yang tidak dinyatakan.
- source_word: αὐτῶν τὴν καρδίαν
  choice: hati mereka
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal kolektif “hati mereka”, sehingga bentuk sumber dan pengertian korporatnya tetap terpelihara.
theological_decisions:
- issue: Pelaku ilahi dalam pembutaan dan pengerasan
  choice: 'Mempertahankan subjek tersurat: “Ia telah membutakan ... dan mengeraskan ...”'
  alternative: Menggunakan bentuk pasif atau impersonal yang mengaburkan pelakunya
  rationale: Kata kerja Yunani secara tersurat memiliki subjek tunggal yang dalam konteks kutipan menunjuk kepada Allah. Terjemahan mempertahankan ketegangan tentang pengerasan sebagai penghakiman dan tidak melunakkannya.
- issue: Bahasa pertobatan untuk στραφῶσιν
  choice: berbalik
  alternative: bertobat; dipertobatkan
  rationale: Verba Yunani lebih luas daripada istilah doktrinal tertentu. “Berbalik” mempertahankan ambiguitas antara tindakan kembali dan pemulihan/pertobatan.
- issue: Relasi ἵνα μή dengan rangkaian tindakan
  choice: 'Menyatakan “tidak” pada tiap verba: tidak melihat, tidak mengerti, dan tidak berbalik'
  alternative: Hanya menempatkan satu “tidak” sebelum seluruh rangkaian
  rationale: Pengulangan ini membuat cakupan penyangkalan jelas dalam bahasa Indonesia serta mempertahankan kekuatan tujuan/hasil kutipan tanpa menyelesaikan perdebatan teologis mengenainya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Pengulangan “mereka” mempertahankan kesejajaran sumber. “Ia” dipakai untuk subjek naratif, sedangkan “Aku” dipertahankan dalam ucapan ilahi kutipan.
