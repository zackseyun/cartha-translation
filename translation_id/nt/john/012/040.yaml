  source_fidelity: Teks utama dengan tepat mempertahankan pelaku ilahi yang tersurat, perfektum pada "telah membutakan", citra "mata" dan "hati", serta rangkaian penyangkalan dalam kutipan Yesaya. Namun, "lalu Aku menyembuhkan mereka" mengubah hubungan sintaktis καὶ ἰάσομαι menjadi urutan waktu dan tidak menyatakan bentuk futurum Yunani. "Dan Aku akan menyembuhkan mereka" lebih dekat dengan sumber tanpa menyelesaikan secara doktrinal hubungan bersyarat yang tersirat dalam kutipan.
  naturalness: Bahasa draft umumnya baku, jelas, dan bernada wajar untuk teks Alkitab modern. Penggantian "lalu" dengan "dan" menghasilkan kesejajaran yang lebih alami dengan rangkaian sumber.
  terminology: '"Membutakan", "mengeraskan hati", "mengerti", dan "berbalik" sesuai dengan istilah sumber dan pemakaian Indonesia modern. "Berbalik" patut dipertahankan karena tidak mempersempit στραφῶσιν menjadi istilah pertobatan tertentu. Catatan yang mencantumkan "dipertobatkan" sebagai alternatif tidak diperlukan dan lebih interpretatif daripada teks.'
