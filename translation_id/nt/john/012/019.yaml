  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: id
  text: Karena itu, orang-orang Farisi berkata satu sama lain, “Kalian lihat bahwa usaha kalian tidak menghasilkan apa-apa. Lihat, dunia sudah mengikuti dia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua orang sudah mengikuti dia.” Kata Yunani yang diterjemahkan “dunia” kemungkinan digunakan sebagai ungkapan yang dilebih-lebihkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari peristiwa sebelumnya dan mempertahankan hubungan wacana secara alami dalam bahasa Indonesia.
- source_word: πρὸς ἑαυτούς
  choice: satu sama lain
  rationale: 'Konteks mendukung makna timbal balik: orang-orang Farisi berbicara di antara sesama anggota kelompok mereka.'
- source_word: Θεωρεῖτε
  choice: Kalian lihat sendiri
  rationale: Bentuk indikatif jamak ini merupakan pernyataan retoris penuh kekesalan, bukan semata-mata perintah untuk melihat. Kata 'sendiri' memperjelas bahwa bukti kegagalan mereka nyata di hadapan mereka.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: usaha kalian sama sekali tidak berhasil
  rationale: Ungkapan ini menyatakan kesia-siaan tindakan mereka. Terjemahan tersebut alami dan mempertahankan penegasan ganda dari οὐκ dan οὐδέν.
- source_word: ἴδε
  choice: Lihat
  rationale: Mempertahankan seruan singkat yang menarik perhatian dan memberi daya retoris pada ucapan tersebut.
- source_word: κόσμος
  choice: dunia
  rationale: Mempertahankan padanan leksikal dan gema khas Yohanes, tanpa mempersempit hiperbola itu menjadi 'semua orang' dalam teks utama.
- source_word: ὀπίσω αὐτοῦ
  choice: mengikuti dia
  rationale: Dalam konteks orang banyak yang tertarik kepada Yesus, ungkapan idiomatis ini berarti pergi mengikuti seseorang; bentuk Indonesia ini lebih alami daripada 'ke belakang dia'.
- source_word: ἀπῆλθεν
  choice: sudah pergi
  rationale: Aoristus menggambarkan tindakan yang dipandang telah terjadi, sedangkan 'sudah' menyampaikan hasil yang kini tampak dan menjadi sumber kekesalan para pembicara.
theological_decisions:
- issue: Cakupan κόσμος dalam ucapan orang-orang Farisi
  choice: Mempertahankan 'dunia' sebagai hiperbola retoris.
  alternative: Semua orang telah mengikuti dia; seluruh orang banyak telah mengikuti dia.
  rationale: Ucapan ini mengungkapkan kekesalan dengan melebih-lebihkan keadaan, bukan mengajarkan bahwa setiap manusia menjadi pengikut Yesus. Mempertahankan 'dunia' menjaga ambiguitas dan resonansi Yohanes tanpa mengubah hiperbola menjadi klaim universal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Kalian' dipakai karena verba Yunani berbentuk jamak dan para anggota kelompok saling menyapa; 'dia' tidak dikapitalisasi agar mengikuti kaidah umum tanpa memasukkan keputusan teologis ke dalam ortografi.
