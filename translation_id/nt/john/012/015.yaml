base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: id
  text: “Jangan takut, hai putri Sion.[a] Lihatlah, Rajamu datang, duduk di atas seekor anak keledai.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Putri Sion” adalah personifikasi profetis bagi Sion, yaitu Yerusalem.
    reason: cultural_note
  - marker: b
    text: Ungkapan ini menggemakan Zakharia 9:9 dan menampilkan Yesus sebagai Raja yang dijanjikan bagi Sion. Secara harfiah, bagian akhirnya berbunyi “duduk di atas seekor anak keledai.”
    reason: cross_reference_and_literal_rendering
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Larangan dengan μή dan imperatif φοβέομαι diterjemahkan secara alami dan langsung dalam bahasa Indonesia modern.
- source_word: θυγάτηρ Σιών
  choice: hai putri Sion
  rationale: Bentuk sapaan profetis yang mempersonifikasikan Sion/Yerusalem dipertahankan; partikel “hai” memperjelas fungsi vokatif.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini diterjemahkan dengan bentuk yang jelas, wajar, dan tetap bernada luhur.
- source_word: ὁ βασιλεύς σου
  choice: Rajamu
  rationale: Frasa definit dengan pronomina posesif diterjemahkan secara ringkas. Huruf kapital menandai penggunaan sebagai gelar bagi Yesus dalam konteks kerajaan mesianik.
- source_word: ἔρχεται
  choice: datang
  rationale: Present historis atau vivid menyatakan kedatangan yang sedang ditampilkan kepada pembaca; bentuk Indonesia “datang” mempertahankan kehadiran langsung itu tanpa tambahan aspek yang tidak wajib.
- source_word: καθήμενος
  choice: dengan duduk
  rationale: Partisipel ini menerangkan cara sang Raja datang. Pilihan ini mempertahankan makna dasar ‘duduk’ dan tidak menambahkan nuansa ‘menunggang’ yang tidak dinyatakan secara leksikal.
- source_word: ἐπὶ πῶλον ὄνου
  choice: di atas seekor anak keledai
  rationale: πῶλος menunjuk hewan muda, sedangkan ὄνου menentukan bahwa hewan itu keledai. Ungkapan Indonesia ini alami dan menyampaikan kedua unsur tersebut.
theological_decisions:
- issue: Gema profetis Zakharia 9:9 dan penggambaran Yesus sebagai Raja yang dijanjikan
  choice: Mempertahankan sapaan “putri Sion” dan gelar “Rajamu” dalam teks utama, dengan penjelasan gema nubuat dalam catatan kaki.
  alternative: Menjelaskan “putri Sion” sebagai Yerusalem atau menguraikan identitas mesianik Yesus langsung di dalam teks utama.
  rationale: Terjemahan perlu mempertahankan bentuk dan ketegangan bahasa profetis tanpa memasukkan tafsiran penjelas ke dalam teks.
- issue: Kapitalisasi gelar raja
  choice: Menulis “Rajamu” dengan huruf kapital.
  alternative: Menulis “rajamu” dengan huruf kecil.
  rationale: Naskah Yunani tidak menentukan kapitalisasi modern. Huruf kapital mencerminkan fungsi gelar yang merujuk kepada Yesus dalam konteks mesianik, tanpa mengubah isi leksikal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Diksi profetis “putri Sion” dipertahankan agar hubungan antarteks tetap tampak; “Lihatlah” menjaga fungsi penarik perhatian dari ἰδοὺ.
