id: JHN.12.14
reference: John 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: id
  text: 'Kemudian Yesus menemukan seekor keledai muda[a] lalu duduk di atasnya, seperti ada tertulis:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seekor anak keledai." Kata Yunani ὀνάριον menunjuk pada keledai, sering kali keledai yang masih muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: menemukan ... lalu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. Konstruksi finit berurutan dengan 'lalu' lebih alami dalam bahasa Indonesia dan tetap mempertahankan urutan tindakan.
- source_word: δὲ
  choice: Kemudian
  rationale: Di sini δέ merupakan penghubung ringan yang melanjutkan alur cerita, bukan pertentangan kuat.
- source_word: ὀνάριον
  choice: seekor keledai muda
  rationale: Bentuk diminutif ini menunjuk pada keledai dan sering menyiratkan yang masih muda. Pilihan ini jelas serta tidak menambahkan rincian yang tidak dinyatakan teks.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: duduk di atasnya
  rationale: Menerjemahkan ungkapan Yunani secara langsung dan alami tanpa menafsirkannya lebih dinamis sebagai 'menungganginya'.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: seperti ada tertulis
  rationale: Rumus kutipan Kitab Suci yang lazim dalam bahasa Indonesia; 'seperti' mempertahankan daya banding καθώς, sedangkan 'ada tertulis' menyampaikan keadaan hasil dari bentuk perfektif γεγραμμένον.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Artikel pada nama diri merupakan kebiasaan naratif Yunani dan tidak perlu diterjemahkan dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan tindakan Yesus dengan kutipan Kitab Suci
  choice: Tindakan Yesus disajikan sebagai bersesuaian dengan apa yang tertulis, tanpa menyatakan secara eksplisit motif tindakan itu.
  alternative: Menerjemahkan secara lebih dinamis sehingga menyiratkan bahwa Yesus dengan sengaja memperagakan penggenapan nubuat.
  rationale: Ayat ini menyebut tindakan Yesus lalu memperkenalkan kutipan Kitab Suci. Teks menegaskan kesesuaian profetis, tetapi tidak secara eksplisit menjelaskan motif Yesus.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan 'menemukan ... lalu duduk' menghindari bentuk partisip yang kaku sambil menjaga urutan tindakan. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
