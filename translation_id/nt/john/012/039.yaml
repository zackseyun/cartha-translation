  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: id
  text: 'Karena itu mereka tidak dapat percaya, sebab Yesaya berkata lagi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena alasan inilah
  rationale: Frasa διά dengan akusatif menyatakan sebab atau alasan dan menghubungkan ayat ini secara eksplisit dengan konteks sebelumnya.
- source_word: οὐκ ἠδύναντο
  choice: mereka tidak dapat
  rationale: Bentuk imperfek δύναμαι menyatakan ketidakmampuan; terjemahan ini mempertahankan gagasan ketidakmampuan tanpa mengubahnya menjadi sekadar ketidakmauan.
- source_word: πιστεύειν
  choice: percaya
  rationale: Dalam pemakaian Yohanes, πιστεύω paling wajar diterjemahkan 'percaya' dan di sini menjadi pelengkap dari 'tidak dapat'.
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteks ini ὅτι memperkenalkan alasan bagi ketidakmampuan tersebut, yakni perkataan Yesaya yang dikutip sesudahnya.
- source_word: πάλιν
  choice: lagi
  rationale: Kata ini menandai kutipan tambahan dari Yesaya setelah kutipan sebelumnya.
- source_word: εἶπεν
  choice: berkata
  rationale: Dalam rumusan pengantar kutipan, λέγω secara alami diterjemahkan 'berkata'.
- source_word: Ἠσαΐας
  choice: Yesaya
  rationale: Nama ini memakai bentuk baku bahasa Indonesia yang lazim dalam Alkitab dan penggunaan umum.
theological_decisions:
- issue: Sifat ketidakmampuan untuk percaya yang dinyatakan dalam teks
  choice: 'Menerjemahkan secara langsung sebagai ketidakmampuan: ''mereka tidak dapat percaya''.'
  alternative: Melunakkannya menjadi 'mereka tidak mau percaya' atau menjelaskannya secara eksplisit menurut kerangka teologis tertentu.
  rationale: Bahasa Yunani menyatakan ketidakmampuan, bukan hanya ketidakmauan. Terjemahan mempertahankan ketegangan antara ketidakmampuan ini dan tanggung jawab manusia tanpa menyelesaikan perdebatan teologis yang lebih luas di dalam redaksi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Karena alasan inilah' dipilih untuk mempertahankan hubungan kausal yang eksplisit, sedangkan 'sebab' menghindari pengulangan 'karena' dan tetap memperkenalkan alasan dengan jelas. Tanda titik dua dipertahankan karena ayat berikutnya memuat kutipan Yesaya.
