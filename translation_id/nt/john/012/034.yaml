base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: id
  text: Lalu orang banyak itu menjawab Dia, “Kami telah mendengar dari Taurat bahwa Mesias tetap ada selama-lamanya. Jadi, bagaimana mungkin Engkau berkata bahwa Anak Manusia harus ditinggikan[a]? Siapakah Anak Manusia ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “diangkat.” Dalam Injil Yohanes, kata ini dapat mengandung dua arti sekaligus: diangkat secara fisik dan dimuliakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Lalu orang banyak itu menjawab Dia
  rationale: οὖν melanjutkan alur percakapan dan diterjemahkan secara alami dengan ‘Lalu’; ὁ ὄχλος adalah kelompok orang yang sedang berkumpul, sehingga ‘orang banyak’ tepat dalam bahasa Indonesia Alkitabiah yang tetap mudah dipahami.
- source_word: Ἡμεῖς ἠκούσαμεν
  choice: Kami telah mendengar
  rationale: Bentuk lampau menunjuk pada ajaran yang sudah mereka terima dan masih relevan bagi keberatan mereka; ‘telah mendengar’ menyampaikan nuansa itu secara alami.
- source_word: ἐκ τοῦ νόμου
  choice: dari Taurat
  rationale: νόμος mempertahankan bingkai kesaksian Kitab Suci Yahudi. ‘Taurat’ adalah padanan Indonesia yang lazim, tanpa mempersempit secara eksplisit pada lima kitab Musa.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar bagi tokoh yang dinantikan, sehingga ‘Mesias’ mempertahankan konteks Yahudinya.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: tetap ada selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; ‘tetap ada selama-lamanya’ jelas dan wajar dalam bahasa Indonesia.
- source_word: πῶς λέγεις σὺ
  choice: bagaimana mungkin Engkau berkata
  rationale: Pertanyaan ini mengungkapkan keberatan atau ketidakpercayaan, bukan sekadar menanyakan caranya. ‘Bagaimana mungkin’ membawa daya tantangnya.
- source_word: δεῖ ὑψωθῆναι
  choice: harus ditinggikan
  rationale: δεῖ menyatakan keharusan. ‘Ditinggikan’ dapat menunjuk baik pada pengangkatan secara fisik maupun pemuliaan, sehingga mempertahankan makna berlapis khas Yohanes.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan gelar yang mapan ini mempertahankan fungsi ungkapan sebagai sebutan khas serta gaung Danieliknya.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Siapakah Anak Manusia ini?
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada identitas sosok yang disebut Yesus.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Karena istilah tersebut jelas berfungsi sebagai gelar dalam pengharapan Yahudi, ‘Mesias’ lebih langsung menyampaikan konteks itu tanpa mengubahnya menjadi nama diri.
- issue: Makna ὑψωθῆναι dalam Injil Yohanes
  choice: ditinggikan
  alternative: diangkat; dimuliakan
  rationale: ‘Ditinggikan’ menjaga ketegangan antara pengangkatan fisik Yesus pada salib dan pemuliaan-Nya, alih-alih menetapkan hanya salah satu makna.
- issue: Cakupan νόμος
  choice: Taurat
  alternative: Hukum Taurat; Kitab Suci
  rationale: ‘Taurat’ mempertahankan istilah sumber dan bingkai Yahudi, sementara konteks memungkinkan pemakaian yang lebih luas daripada sekadar Pentateukh; ketidakpastian cakupan tidak dijabarkan secara berlebihan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘Dia/Engkau’ mengikuti konvensi penghormatan dalam terjemahan Alkitab Indonesia. Teks memakai ‘ditinggikan’ untuk mempertahankan permainan makna Yohanes; penjelasannya ditempatkan pada catatan kaki.
