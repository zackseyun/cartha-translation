  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: id
  text: Ada beberapa orang Yunani di antara orang-orang yang pergi untuk beribadah pada perayaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang Yunani tertentu”; mungkin orang-orang bukan Yahudi yang datang untuk beribadah pada perayaan itu.
    reason: Menyatakan alternatif bagi τινες dan kemungkinan identitas mereka tanpa mengubah sebutan utama “orang Yunani” atau memastikan status keagamaan mereka.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ada
  rationale: Bentuk ἦσαν menyatakan keberadaan. Partikel δέ menandai peralihan ringan dalam wacana dan tidak perlu diterjemahkan dengan kata penghubung yang memberi kesan pertentangan.
- source_word: Ἕλληνές τινες
  choice: beberapa orang Yunani
  rationale: Ἕλληνες secara wajar menunjuk kepada orang Yunani, sedangkan τινες menyatakan jumlah yang tidak tentu. Terjemahan ini tidak menggeneralisasikannya menjadi semua orang bukan Yahudi.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: di antara orang-orang yang pergi ke Yerusalem
  rationale: Frasa ini menyatakan bahwa mereka termasuk dalam rombongan yang sedang 'naik', yaitu ungkapan perjalanan ziarah ke Yerusalem. Nama Yerusalem dibuat eksplisit agar ungkapan tersebut alami dan jelas dalam bahasa Indonesia.
- source_word: ἵνα προσκυνήσωσιν
  choice: untuk beribadah
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan, dan προσκυνέω dalam konteks ini berarti melakukan ibadah kepada Allah.
- source_word: ἐν τῇ ἑορτῇ
  choice: pada perayaan itu
  rationale: ἑορτή menunjuk kepada perayaan keagamaan Yahudi yang sedang dibicarakan dalam konteks, tanpa perlu mengulang namanya di ayat ini.
theological_decisions:
- issue: Identitas Ἕλληνες
  choice: orang Yunani
  alternative: orang bukan Yahudi
  rationale: Teks menyebut mereka sebagai Ἕλληνες dan tidak memastikan apakah mereka proselit, orang yang takut akan Allah, atau kelompok lain. Sebutan etnis-budaya dipertahankan agar ketidakpastian itu tidak diselesaikan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mendahulukan kelompok peziarah agar hubungan partitif ἐκ τῶν jelas. Istilah “perayaan” dipilih sebagai padanan yang alami bagi perayaan keagamaan Yahudi.
