  source_fidelity: 'Teks Indonesia secara akurat mencerminkan kontras Οὐ ... ἀλλὰ serta pembacaan paling wajar διὰ + akusatif sebagai manfaat/tujuan: suara itu bukan diberikan demi Yesus, melainkan demi para pendengar. “Datang” merupakan padanan kontekstual yang baik untuk γέγονεν mengenai suara yang baru terdengar. Penyederhanaan formula ἀπεκρίθη ... καὶ εἶπεν menjadi “Yesus menjawab” wajar dalam bahasa Indonesia dan tidak mengubah fungsi wacananya.'
