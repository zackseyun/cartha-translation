  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: id
  text: Yesus menjawab, “Suara itu datang bukan untuk kepentingan-Ku, melainkan untuk kepentingan kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Suara itu terjadi bukan karena Aku, melainkan karena kalian.” Preposisi Yunani yang digunakan juga dapat dipahami sebagai menyatakan sebab, meskipun konteks lebih mendukung arti “untuk kepentingan” atau “demi manfaat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: Yesus menjawab
  rationale: Dalam narasi dialog bahasa Indonesia, gabungan harfiah ‘menjawab dan berkata’ terasa berlebihan. ‘Menjawab’ secara wajar menyampaikan fungsi kedua verba dalam formula Yunani ini.
- source_word: ἡ φωνὴ αὕτη
  choice: Suara itu
  rationale: Konteks menunjuk kepada suara dari langit yang baru saja didengar. ‘Suara’ lebih tepat daripada ‘bunyi’, sedangkan ‘itu’ merujuk kembali kepada peristiwa tersebut.
- source_word: γέγονεν
  choice: datang
  rationale: Bentuk perfek γίνομαι menunjuk pada terjadinya suara beserta hasilnya. Bersama ‘suara’, kata ‘datang’ alami dalam bahasa Indonesia dan tidak menyiratkan penciptaan suara.
- source_word: δι’ ἐμὲ ... δι’ ὑμᾶς
  choice: untuk kepentingan-Ku ... untuk kepentingan kalian
  rationale: Dalam konteks ini διά dengan akusatif paling mungkin menyatakan tujuan atau manfaat. Pengulangan ‘untuk kepentingan’ mempertahankan kesejajaran dan pertentangan Yunani dengan jelas.
- source_word: Οὐ ... ἀλλὰ
  choice: bukan ... melainkan
  rationale: Pasangan ini secara alami mempertahankan kontras tegas antara dua pihak dalam bahasa Indonesia.
theological_decisions:
- issue: Tujuan suara dari langit
  choice: Suara itu datang bukan untuk kepentingan Yesus, melainkan untuk kepentingan para pendengar-Nya.
  alternative: Suara itu terjadi bukan karena Yesus, melainkan karena para pendengar-Nya.
  rationale: Konteks mendukung makna tujuan/manfaat bagi διά dengan akusatif, tetapi kemungkinan makna sebab tetap diakui dalam catatan tanpa menyelesaikan ambiguitas secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti ‘kalian’ dipakai untuk menandai bentuk jamak ὑμᾶς secara jelas; huruf kapital pada ‘-Ku’ dan ‘Aku’ mengikuti konvensi umum untuk rujukan kepada Yesus.
