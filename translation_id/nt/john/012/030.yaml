  terminology: “Suara” tepat dalam konteks ujaran surgawi. Kapitalisasi “-Ku” dan “Aku” konsisten dengan konvensi Indonesia yang dipilih. Catatan kaki secara layak mencatat kemungkinan pembacaan kausal tanpa mengutamakannya secara tidak semestinya.
