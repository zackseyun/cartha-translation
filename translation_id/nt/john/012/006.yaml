  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: id
  text: Ia mengatakan hal itu bukan karena ia peduli kepada orang-orang miskin, melainkan karena ia seorang pencuri; ia memegang kotak uang[a] dan biasa mengambil apa yang dimasukkan ke dalamnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kantong uang.” Istilah Yunani ini dapat merujuk pada wadah untuk menyimpan uang.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang dipakai dapat berarti “membawa” atau “mengambil.” Namun, dalam konteks ini—karena ia disebut pencuri—kata itu sangat mungkin menunjukkan bahwa ia mengambil isinya untuk dirinya sendiri; karena itu dapat juga diterjemahkan “biasa mencuri apa yang dimasukkan ke dalamnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Ia mengatakan hal itu
  rationale: δέ bersifat penghubung ringan dan tidak perlu diterjemahkan dengan penanda waktu atau pertentangan yang tegas; τοῦτο diterjemahkan langsung sebagai “hal itu”.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: bukan karena ia peduli kepada orang-orang miskin
  rationale: Konstruksi οὐχ ὅτι menyangkal alasan, sedangkan μέλει dengan περί menyatakan kepedulian terhadap seseorang; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: melainkan karena ia seorang pencuri
  rationale: ἀλλ’ ὅτι mengemukakan alasan yang sebenarnya sebagai lawan dari alasan yang disangkal; κλέπτης berarti pencuri.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: Ia memegang kotak uang
  rationale: γλωσσόκομον menunjuk pada wadah tempat menyimpan uang, sementara ἔχων di sini menyiratkan bahwa Yudas memegang atau menguasainya. Kalimat mandiri lebih alami daripada konstruksi partisipial yang kaku.
- source_word: τὰ βαλλόμενα
  choice: apa yang dimasukkan ke dalamnya
  rationale: Partisip pasif βάλλω menunjuk pada sesuatu yang dimasukkan; tujuan yang tersirat dinyatakan dengan “ke dalamnya” agar jelas dalam bahasa Indonesia.
- source_word: ἐβάσταζεν
  choice: biasa mengambil untuk dirinya sendiri
  rationale: Bentuk imperfek menyatakan kebiasaan. βαστάζω dapat berarti membawa atau mengambil, tetapi konteks eksplisit bahwa Yudas adalah pencuri menunjukkan pengambilan untuk kepentingannya sendiri tanpa harus mengganti verba itu langsung dengan “mencuri”.
theological_decisions:
- issue: Makna ἐβάσταζεν dalam kaitannya dengan pencurian Yudas
  choice: biasa mengambil untuk dirinya sendiri
  alternative: biasa membawa; biasa mencuri
  rationale: Konteks “ia seorang pencuri” sangat mendukung makna penyelewengan, sedangkan pilihan “mengambil untuk dirinya sendiri” mempertahankan hubungan antara arti verba yang lebih luas dan tuduhan narator tanpa menghapus ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. “Orang-orang miskin” dipilih agar rujukan kepada kelompok manusia terdengar alami; “melainkan” mempertahankan kontras alasan. Semua penanda catatan kaki muncul dalam teks utama.
