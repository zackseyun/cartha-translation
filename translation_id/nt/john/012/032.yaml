  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: id
  text: Dan Aku, apabila Aku ditinggikan dari bumi, akan menarik semua orang kepada-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua”; bentuk Yunaninya merujuk kepada orang-orang. Ungkapan ini tidak dengan sendirinya menentukan bagaimana cakupannya harus dipahami dalam perdebatan teologis tentang keselamatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Dan Aku
  rationale: Bentuk gabungan καί + ἐγώ bersifat menghubungkan sekaligus memberi penekanan ringan pada Yesus; “Dan Aku” mempertahankan keduanya secara wajar.
- source_word: ἐὰν
  choice: apabila
  rationale: ἐάν dengan bentuk subjungtif secara formal bersifat kondisional. “Apabila” menjaga nuansa itu, tetapi juga cocok untuk peristiwa mendatang yang dipandang pasti dalam konteks ini.
- source_word: ὑψωθῶ
  choice: ditinggikan
  rationale: Pilihan ini dapat menunjuk pada pengangkatan Yesus secara fisik di salib sekaligus pemuliaan-Nya, sehingga mempertahankan makna ganda khas Yohanes.
- source_word: ἐκ τῆς γῆς
  choice: dari bumi
  rationale: γῆ di sini paling alami merujuk pada bumi atau permukaan tanah, selaras dengan gambaran Yesus yang diangkat dalam penyaliban.
- source_word: πάντας
  choice: semua orang
  rationale: Bentuk jamak maskulin ini secara alami merujuk kepada manusia. “Semua orang” membuat objeknya jelas tanpa menentukan bagaimana cakupan tersebut harus dijelaskan dalam perdebatan teologis kemudian.
- source_word: ἑλκύσω
  choice: akan menarik
  rationale: “Menarik” mempertahankan rentang makna ἕλκω—gerak menuju seseorang yang dapat mengandung unsur daya tarik maupun kekuatan—tanpa mempersempit mekanismenya.
- source_word: πρὸς ἐμαυτόν
  choice: kepada-Ku
  rationale: Ungkapan ini menyatakan gerak menuju diri Yesus. Dalam bahasa Indonesia, “kepada-Ku” menyampaikan maknanya secara alami; unsur refleksif sudah jelas karena pembicara dan tujuan gerak adalah pribadi yang sama.
theological_decisions:
- issue: Cakupan πάντας dalam kaitannya dengan keselamatan
  choice: semua orang
  alternative: semua; segala sesuatu; semua golongan orang
  rationale: Teks menyatakan luasnya tindakan Yesus menarik manusia, tetapi ayat ini sendiri tidak merinci apakah yang dimaksud setiap individu tanpa kecuali atau manusia dari segala golongan. Terjemahan dibiarkan seluas teks sumber.
- issue: Makna ganda ὑψωθῶ dalam Injil Yohanes
  choice: ditinggikan
  alternative: diangkat; dimuliakan
  rationale: “Ditinggikan” mempertahankan hubungan antara penyaliban secara fisik dan peninggian atau pemuliaan Yesus, alih-alih memilih salah satu sisi saja.
- issue: Nilai kondisional ἐὰν dan kepastian kematian Yesus
  choice: apabila
  alternative: jika; ketika
  rationale: “Apabila” menjaga bentuk kondisional Yunani tanpa menyiratkan bahwa peristiwa tersebut diragukan; dalam alur Injil Yohanes, kematian Yesus dipandang akan terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti konvensi Alkitab bahasa Indonesia. Susunan kalimat dibuat alami sambil mempertahankan penekanan “Dan Aku” serta ketegangan makna pada “apabila” dan “ditinggikan”.
