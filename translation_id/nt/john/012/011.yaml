  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: id
  text: Sebab banyak orang Yahudi[a] pergi karena dia[b] dan percaya kepada Yesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak orang Yudea.” Dalam Injil Yohanes, istilah ini dapat merujuk kepada orang Yahudi pada umumnya, penduduk Yudea, atau, dalam konteks tertentu, para pemimpin Yahudi.
    reason: alternative_reading
  - marker: b
    text: Atau “meninggalkan” atau “beranjak pergi.” Kata kerja Yunani ini menggambarkan tindakan yang sedang berlangsung atau berulang. Bahasa Yunani tidak menyebut secara eksplisit dari siapa atau dari pihak mana mereka pergi.
    reason: lexical_alternative
  - marker: c
    text: Atau “menaruh iman kepada Yesus” atau “memercayakan diri kepada Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan para imam kepala hendak membunuh Lazarus dalam ayat sebelumnya. “Sebab” mempertahankan hubungan kausal antarayat secara wajar.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: banyak orang Yahudi
  rationale: 'Genitifnya menyatakan sebagian dari keseluruhan: banyak orang dari kalangan Yahudi, bukan semua orang Yahudi. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit rujukannya tanpa kepastian.'
- source_word: δι’ αὐτὸν
  choice: karena dia
  rationale: διά dengan akusatif bersifat kausal di sini. Kata ganti itu merujuk secara kontekstual kepada Lazarus, tetapi kata ganti dipertahankan agar tidak menambahkan nama yang tidak ada dalam teks Yunani.
- source_word: ὑπῆγον
  choice: meninggalkan pihak mereka
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang atau berulang kali terjadi. Dalam konteks ini, orang-orang itu menjauh dari pihak para pemimpin yang menentang Yesus. “Meninggalkan pihak mereka” menyampaikan gerak menjauh dengan lebih jelas daripada “pergi” tanpa tujuan, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: percaya kepada Yesus
  rationale: Ungkapan ini menyatakan kepercayaan yang diarahkan kepada Yesus. Bahasa Indonesia tidak perlu menandai aspek imperfek secara khusus; konteks “banyak orang” dapat mencakup tindakan yang berlangsung atau berulang.
theological_decisions:
- issue: Cakupan Ἰουδαίων dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea; para pemimpin Yahudi
  rationale: Dalam ayat ini, “banyak orang Yahudi” jelas menunjuk kepada sebagian orang dalam kelompok yang lebih besar, bukan kecaman terhadap semua orang Yahudi. Teks utama mempertahankan istilah luas sumber, sedangkan kemungkinan arti geografis dicatat.
- issue: Makna πιστεύω εἰς
  choice: percaya kepada Yesus
  alternative: menaruh iman kepada Yesus; memercayakan diri kepada Yesus
  rationale: Ayat ini menyatakan kepercayaan yang tertuju kepada Yesus, tetapi tidak secara eksplisit menyebut mereka menjadi murid atau diselamatkan. Karena itu, terjemahan tidak menambahkan kesimpulan teologis tersebut.
- issue: Objek tersirat dalam ὑπῆγον
  choice: meninggalkan pihak mereka
  alternative: pergi; beranjak pergi
  rationale: Teks Yunani tidak menyebut objek yang ditinggalkan. Konteks menunjukkan gerak menjauh dari pihak atau pengaruh para penentang Yesus, tetapi catatan kaki menandai bahwa unsur “pihak mereka” merupakan penjelasan kontekstual, bukan objek yang tertulis eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan kausal “Sebab karena dia” dipertahankan karena kedua unsur mewakili ὅτι dan δι’ αὐτόν serta tetap dapat dipahami secara alami; “dia” secara kontekstual menunjuk kepada Lazarus. Istilah “orang Yahudi” tidak dimaksudkan sebagai generalisasi terhadap seluruh kelompok etnis atau agama.
