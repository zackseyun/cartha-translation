  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: id
  text: Jadi, enam hari sebelum Paskah, Yesus datang ke Betania, tempat Lazarus berada, yang telah Yesus bangkitkan dari antara orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Jadi
  rationale: Menjaga fungsi penghubung naratif dengan konteks sebelumnya dalam bahasa Indonesia yang alami.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: enam hari sebelum Paskah
  rationale: Mengungkapkan idiom waktu Yunani secara alami dan tepat; Paskah merujuk pada perayaan Yahudi yang sudah dikenal dalam konteks.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: datang ke Betania
  rationale: Terjemahan langsung dan wajar bagi gerak menuju Betania tanpa menambahkan gagasan bahwa Yesus sekadar tiba atau menetap.
- source_word: ὅπου ἦν Λάζαρος
  choice: tempat Lazarus berada
  rationale: Mempertahankan pernyataan lokatif yang sederhana tanpa menambahkan bahwa Lazarus tinggal atau sedang menginap di sana.
- source_word: ἤγειρεν
  choice: telah dibangkitkan
  rationale: Bentuk pasif bahasa Indonesia ini secara alami menyatakan bahwa Lazarus menerima tindakan membangkitkan; kata 'telah' menandai bahwa peristiwa itu mendahului kedatangan Yesus.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mencerminkan secara transparan nuansa jamak substantival Yunani, yakni keluar dari antara mereka yang mati, sambil tetap dapat dipahami pembaca modern.
- source_word: πάσχα
  choice: Paskah
  rationale: Padanan baku bahasa Indonesia bagi perayaan Yahudi Passover dalam konteks ini.
theological_decisions:
- issue: Bahasa kebangkitan yang merujuk kepada Lazarus
  choice: yang telah dibangkitkan Yesus dari antara orang mati
  alternative: yang telah dibangkitkan-Nya dari kematian
  rationale: Nama 'Yesus' dipertahankan karena teks Yunani mengulang Ἰησοῦς sebagai pelaku pada akhir klausa. Ungkapan 'dari antara orang mati' mempertahankan gambaran ἐκ νεκρῶν tanpa mengubahnya menjadi konsep abstrak 'kematian'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan keterangan waktu dibuat alami, sedangkan pengulangan nama Yesus dan ungkapan kebangkitan dipertahankan sedekat mungkin dengan sumber Yunani.
