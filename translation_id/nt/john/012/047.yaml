  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: id
  text: Jika seseorang mendengar perkataan-Ku dan tidak memeliharanya[a], Aku tidak menghakimi dia[b]. Sebab Aku datang bukan untuk menghakimi dunia, melainkan untuk menyelamatkan dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaatinya”; kata Yunani ini juga dapat berarti menjaga atau berpegang pada perkataan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghukum dia”; dalam konteks tertentu, kata Yunani yang diterjemahkan “menghakimi” dapat menunjuk pada keputusan penghakiman yang merugikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: jika seseorang
  rationale: Konstruksi bersyarat tak tentu ini menyatakan kasus umum. “Seseorang” alami dalam bahasa Indonesia dan mencakup siapa pun tanpa membatasi acuannya.
- source_word: ἀκούσῃ
  choice: mendengar
  rationale: Mempertahankan arti dasar verba dan kaitannya dengan perkataan yang diucapkan Yesus, tanpa menambahkan nuansa perhatian atau ketaatan yang terkandung dalam “menyimak”.
- source_word: μου ... τῶν ῥημάτων
  choice: perkataan-perkataan-Ku
  rationale: ῥήματα menunjuk pada tuturan atau perkataan Yesus. Bentuk ini jelas dan tetap dekat dengan bentuk jamak Yunani.
- source_word: φυλάξῃ
  choice: memeliharanya
  rationale: φυλάσσω dapat berarti menjaga, memelihara, atau menaati. Dalam konteks Yohanes, kata ini menyiratkan kesetiaan yang terwujud dalam ketaatan; “memelihara” mempertahankan keluasan makna itu lebih baik daripada hanya “menaati”.
- source_word: οὐ κρίνω αὐτόν
  choice: Aku tidak menghakimi dia
  rationale: “Menghakimi” mempertahankan arti κρίνω dan pengulangan leksikalnya dalam klausa tujuan berikutnya. “Dia” menerjemahkan pronomina tunggal yang kembali kepada “seseorang” dan berfungsi generik.
- source_word: οὐ γὰρ ἦλθον ἵνα κρίνω
  choice: Sebab Aku datang bukan untuk menghakimi
  rationale: Menyampaikan alasan serta tujuan misi dengan susunan Indonesia yang alami. Aoristus ἦλθον diringkas dengan “datang,” sebagaimana lazim untuk pernyataan tentang misi Yesus.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Dalam konteks Yohanes, κόσμος secara wajar menunjuk pada dunia umat manusia dalam tatanannya; “dunia” mempertahankan cakupan istilah tanpa mempersempitnya.
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: melainkan untuk menyelamatkan dunia
  rationale: “Melainkan” menyatakan pertentangan tujuan, sedangkan “menyelamatkan” mempertahankan makna utama dan bobot teologis σῴζω.
theological_decisions:
- issue: Pernyataan Yesus bahwa Ia tidak menghakimi orang yang tidak memelihara perkataan-Nya, di tengah bahasa penghakiman dalam Injil Yohanes
  choice: κρίνω diterjemahkan secara konsisten sebagai “menghakimi,” dan batas waktu atau lingkup misi tidak ditambahkan ke dalam teks.
  alternative: “Menghukum” atau parafrasa “Aku tidak menghakiminya sekarang.”
  rationale: Ayat ini menekankan tujuan kedatangan Yesus sebagai penyelamatan, bukan penghakiman. Pilihan “menghakimi” menjaga pengulangan kata dan ketegangan dengan pernyataan Yohanes lainnya tanpa menyelesaikannya melalui tafsiran tambahan.
- issue: Acuan generik pronomina tunggal αὐτόν
  choice: Menggunakan “dia” sebagai pronomina tunggal generik.
  alternative: “Orang itu.”
  rationale: Bahasa Indonesia “dia” tidak menandai gender dan secara alami mengacu kembali kepada “seseorang,” sehingga sekaligus setia pada bentuk tunggal dan mencakup siapa pun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada pronomina dan enklitik yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda titik sebelum “Sebab” membagi kalimat Yunani yang panjang agar mudah dipahami tanpa mengubah hubungan alasannya.
