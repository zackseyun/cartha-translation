  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: id
  text: Namun demikian, banyak juga di antara para pemimpin yang percaya kepada-Nya. Akan tetapi, karena orang-orang Farisi, mereka tidak mengakuinya secara terbuka, supaya mereka tidak dikucilkan dari komunitas rumah ibadat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikeluarkan dari rumah ibadat” atau “diusir dari rumah ibadat”. Istilah Yunani menunjuk pada pengucilan dari komunitas rumah ibadat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Namun demikian
  rationale: Gabungan partikel ini menyatakan konsesi sekaligus pertentangan yang kuat; “Namun demikian” alami dan bermartabat dalam bahasa Indonesia.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: banyak juga di antara para pemimpin
  rationale: ἐκ dengan bentuk genitif menunjukkan keanggotaan dalam kelompok, sedangkan ἄρχοντες dalam konteks ini menunjuk kepada para pemimpin atau penguasa masyarakat, bukan para pangeran.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: percaya kepada-Nya
  rationale: Ungkapan khas Yohanes ini menyatakan kepercayaan yang diarahkan kepada Yesus; terjemahan ini mempertahankan pernyataan teks tanpa menentukan lebih jauh hakikat iman mereka.
- source_word: διὰ τοὺς Φαρισαίους
  choice: karena orang-orang Farisi
  rationale: διά dengan akusatif menyatakan sebab. Unsur ketakutan dapat dipahami dari konteks, tetapi tidak dinyatakan langsung dalam frasa Yunani.
- source_word: οὐχ ὡμολόγουν
  choice: mereka tidak mengakuinya secara terbuka
  rationale: Bentuk imperfek menggambarkan sikap yang berlangsung atau berulang. Objek verba tidak disebutkan dalam bahasa Yunani; “-nya” membiarkan acuannya cukup terbuka, sedangkan “secara terbuka” menjelaskan sifat pengakuan dalam konteks tanpa menjadikannya pengakuan batin semata.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Ungkapan ini mempertahankan nuansa tujuan, yakni menghindari akibat tertentu.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: dikucilkan dari komunitas rumah ibadat
  rationale: ἀποσυνάγωγος menunjuk pada pengecualian dari komunitas sinagoge, sementara γένωνται menyatakan keadaan yang hendak mereka hindari. “Komunitas rumah ibadat” memperjelas bahwa yang dimaksud bukan sekadar dilarang memasuki bangunan.
theological_decisions:
- issue: Hakikat iman para pemimpin dalam teologi Yohanes
  choice: Menerjemahkan ἐπίστευσαν secara langsung sebagai “percaya” sambil tetap menyatakan bahwa mereka tidak mengakuinya secara terbuka.
  alternative: Melemahkannya menjadi “mengaku percaya” atau menguatkannya menjadi pernyataan bahwa mereka telah memperoleh keselamatan sejati.
  rationale: Ayat ini sendiri menempatkan kepercayaan mereka berdampingan dengan kegagalan mengaku secara terbuka. Terjemahan mempertahankan ketegangan tersebut dan tidak memutuskan status rohani mereka melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Para pemimpin” sesuai dengan konteks otoritas Yahudi; “rumah ibadat” dipakai untuk sinagoge, dan unsur komunitas dijelaskan agar cakupan sosial-keagamaannya tetap terlihat.
