  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: id
  text: 'Orang yang menolak Aku dan tidak menerima perkataan-Ku[a], ada yang menghakiminya: firman[b] yang Kuucapkan itu akan menghakiminya pada hari terakhir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menyambut perkataan-Ku” atau “tidak menerima perkataan-Ku.” Kata Yunani yang dipakai dapat berarti menerima, menyambut, atau menerima sebagai benar.
    reason: lexical_alternative
  - marker: b
    text: Atau “pesan.” Kata Yunani logos dapat berarti “firman”, “perkataan”, atau “pesan”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀθετῶν ἐμὲ
  choice: orang yang menolak Aku
  rationale: ἀθετέω dalam konteks ini menyatakan penolakan terhadap pribadi Yesus, bukan sekadar mengabaikan. Bentuk partisip diterjemahkan secara wajar sebagai “orang yang”.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: tidak menerima perkataan-perkataan-Ku
  rationale: λαμβάνω dapat berarti menerima atau menyambut, sedangkan bentuk jamak ῥήματα menunjuk pada ucapan-ucapan Yesus. “Menerima” mempertahankan nuansa Yohanes dan tidak membatasinya pada persetujuan intelektual.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: sudah memiliki sesuatu yang menghakiminya
  rationale: Konstruksi ini menyatakan bahwa penolak itu telah mempunyai penghakimnya; bentuk netral “sesuatu” mempertahankan kaitannya dengan λόγος yang kemudian dijelaskan, tanpa memaksakan penghakim pribadi.
- source_word: ὁ λόγος ὃν ἐλάλησα
  choice: firman yang telah Kusampaikan
  rationale: λόγος tunggal memiliki bobot sebagai firman atau pesan Yesus. “Firman” mempertahankan diksi khas Yohanes, sementara “Kusampaikan” secara alami mengungkapkan firman yang diucapkan.
- source_word: ἐκεῖνος κρινεῖ αὐτόν
  choice: itulah yang akan menghakiminya
  rationale: ἐκεῖνος bersifat tegas dan menunjuk kembali kepada λόγος; “itulah” mempertahankan penekanan bahwa firman tersebut menjadi penghakim.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: pada hari terakhir
  rationale: Ungkapan ini adalah bahasa eskatologis khas Yohanes. Terjemahan tersebut alami dalam bahasa Indonesia dan tidak menambahkan skema doktrinal tertentu.
theological_decisions:
- issue: Hakikat pihak yang menghakimi dalam ayat ini
  choice: Firman atau pesan yang disampaikan Yesus tampil sebagai penghakim atau dasar penghakiman terakhir.
  alternative: Yesus sendiri adalah satu-satunya penghakim, dan “firman” hanya merupakan sebutan singkat bagi tolok ukur-Nya.
  rationale: Susunan Yunani mula-mula mengatakan bahwa orang itu memiliki sesuatu yang menghakiminya, lalu mengidentifikasinya sebagai firman yang Yesus sampaikan. Terjemahan mempertahankan ketegangan ini tanpa menyelaraskannya secara diam-diam dengan pernyataan Yohanes lainnya tentang peran Anak dalam penghakiman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Pengulangan “menghakimi” dipertahankan untuk mencerminkan pengulangan akar κρίνω dalam sumber.
