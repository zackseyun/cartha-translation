lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: memutuskan
  rationale: Kata ini menunjukkan pertimbangan yang menghasilkan keputusan atau tekad. “Memutuskan” alami dalam bahasa Indonesia modern dan mempertahankan unsur kesengajaan; “merencanakan” tetap mungkin, tetapi lebih menonjolkan proses penyusunan rencana.
- source_word: δὲ
  choice: Karena itu
  rationale: Dalam alur narasi, partikel ini menghubungkan tindakan para imam kepala dengan keadaan yang baru disebutkan. “Karena itu” menyampaikan perkembangan sebab-akibat secara alami tanpa menambahkan pertentangan.
- source_word: οἱ ἀρχιερεῖς
  choice: para imam kepala
  rationale: Bentuk jamak ini menunjuk kepada kelompok pemimpin keimaman, bukan beberapa imam besar yang menjabat sekaligus. “Para imam kepala” merupakan padanan Indonesia yang lazim dan tepat.
- source_word: ἵνα
  choice: untuk
  rationale: Sesudah verba yang menyatakan keputusan, ἵνα dengan bentuk subjungtif mengungkapkan isi atau tujuan keputusan. “Untuk” menghasilkan susunan Indonesia yang alami.
- source_word: καὶ
  choice: juga
  rationale: 'Kata ini bersifat aditif: Lazarus turut menjadi sasaran, selain sasaran yang sudah tersirat dari konteks. “Juga” mempertahankan makna tersebut tanpa tekanan tambahan seperti “bahkan”.'
- source_word: τὸν Λάζαρον
  choice: Lazarus
  rationale: Nama diri dialihaksarakan menurut bentuk Indonesia yang sudah mapan; artikel Yunani tidak perlu diterjemahkan tersendiri.
- source_word: ἀποκτείνωσιν
  choice: membunuh
  rationale: Kata ini secara langsung berarti menyebabkan kematian atau membunuh. “Membunuh” jelas dan alami; “menghukum mati” dapat menyiratkan proses hukum yang tidak dinyatakan dalam klausa ini.
theological_decisions:
- issue: Penggambaran niat para imam kepala terhadap Lazarus
  choice: Menyatakan secara langsung bahwa mereka memutuskan untuk membunuh Lazarus, tanpa menambahkan motif atau gagasan persekongkolan.
  alternative: “Bersekongkol” atau “menyusun rencana untuk membunuh” dengan penekanan lebih kuat pada konspirasi.
  rationale: Teks menyatakan keputusan yang disengaja dan mematikan, tetapi tidak memakai istilah khusus yang dengan sendirinya berarti persekongkolan. Terjemahan mempertahankan beratnya niat tersebut tanpa memperluas maknanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “para imam kepala” mengikuti pemakaian Alkitabiah Indonesia yang dikenal luas, sedangkan “memutuskan untuk membunuh” menyampaikan kesengajaan secara jelas tanpa bahasa arkais atau penafsiran tambahan.
