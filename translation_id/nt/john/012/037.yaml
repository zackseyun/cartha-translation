base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: id
  text: Meskipun Ia telah melakukan begitu banyak tanda di depan mata mereka, mereka tetap tidak percaya kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka tidak percaya kepada-Nya.” Bentuk kata kerja Yunani dapat menggambarkan ketidakpercayaan yang sedang berlangsung atau berulang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: begitu banyak
  rationale: Ungkapan ini menekankan banyaknya tanda yang telah dilakukan; “begitu banyak” alami dalam bahasa Indonesia dan mempertahankan daya tekan teks.
- source_word: δὲ
  choice: Meskipun
  rationale: Kontras yang ditandai δέ disampaikan melalui susunan konsesif “meskipun ..., mereka tetap ...”, sehingga pertentangan dengan konteks sebelumnya tetap jelas tanpa ungkapan yang berlebihan.
- source_word: σημεῖα
  choice: tanda
  rationale: Dalam Injil Yohanes, istilah ini menunjuk pada perbuatan yang menyatakan identitas dan karya Yesus, bukan sekadar keajaiban; “tanda” mempertahankan nuansa khas tersebut.
- source_word: πεποιηκότος
  choice: telah melakukan
  rationale: Partisipel perfektum dalam konstruksi genitivus absolutus menyatakan tindakan yang sudah dilakukan dengan dampak yang masih relevan bagi ketidakpercayaan mereka.
- source_word: ἔμπροσθεν αὐτῶν
  choice: di depan mata mereka
  rationale: Ungkapan ini menyampaikan bahwa tanda-tanda tersebut dilakukan secara terbuka dalam kehadiran dan penglihatan mereka.
- source_word: οὐκ ἐπίστευον
  choice: tetap tidak percaya
  rationale: Bentuk imperfektum menggambarkan ketidakpercayaan yang berlangsung; “tetap tidak percaya” mengungkapkan aspek itu secara alami tanpa menambahkan gagasan penolakan sengaja yang tidak dinyatakan secara eksplisit.
- source_word: εἰς αὐτόν
  choice: kepada-Nya
  rationale: Dalam bahasa Indonesia, konstruksi Yohanes πιστεύω εἰς paling alami diterjemahkan “percaya kepada”, yang menyatakan kepercayaan yang tertuju kepada Yesus.
theological_decisions:
- issue: Aspek ketidakpercayaan dalam bentuk imperfektum
  choice: mereka tetap tidak percaya kepada-Nya
  alternative: mereka tidak percaya kepada-Nya
  rationale: Pilihan utama mempertahankan kesan ketidakpercayaan yang berlangsung meskipun banyak tanda telah dilakukan, tanpa memperkuatnya menjadi penolakan yang sengaja atau terus-menerus.
- issue: Hubungan antara tanda-tanda Yesus dan ketidakpercayaan orang banyak
  choice: Meskipun ... mereka tetap ...
  alternative: Namun, setelah Ia melakukan ... mereka tidak ...
  rationale: 'Konstruksi konsesif mempertahankan ketegangan teks: tanda-tanda itu terlihat nyata dan berlimpah, tetapi tidak dengan sendirinya menghasilkan iman.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dan “-Nya” dipakai untuk merujuk kepada Yesus sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami sambil mempertahankan kontras, istilah khas Yohanes “tanda”, dan kemungkinan aspek imperfektum.
