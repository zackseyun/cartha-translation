id: JHN.12.17
reference: John 12:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: id
  text: Karena itu, orang banyak yang bersama Yesus ketika Ia memanggil Lazarus keluar dari makam dan membangkitkannya dari antara orang mati terus memberikan kesaksian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terus bersaksi”; kata kerja Yunani ini dapat berarti memberikan kesaksian atau bersaksi, sebuah tema yang berulang dalam Injil Yohanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: terus memberikan kesaksian
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang dalam konteks narasi. Ungkapan ini juga mempertahankan tema kesaksian yang khas dalam Injil Yohanes.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan naratif dan logis dengan konteks sebelumnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: ὁ ὄχλος
  choice: orang banyak
  rationale: Padanan baku dan alami untuk kelompok besar orang dalam narasi Injil.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: yang bersama Yesus
  rationale: Partisipel berartikel menentukan orang banyak yang hadir bersama Yesus pada peristiwa tersebut. Nama Yesus dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: ὅτε
  choice: ketika
  rationale: Konjungsi temporal yang langsung dan alami.
- source_word: ἐφώνησεν
  choice: memanggil
  rationale: Menyatakan tindakan Yesus memanggil Lazarus tanpa menambahkan tekanan yang tidak dinyatakan oleh verba itu sendiri.
- source_word: ἐκ τοῦ μνημείου
  choice: keluar dari makam
  rationale: Μνημεῖον di sini adalah tempat penguburan, sedangkan 'keluar dari' menyampaikan gerak yang ditandai oleh ἐκ.
- source_word: ἤγειρεν
  choice: membangkitkannya
  rationale: Dalam konteks orang mati, ἐγείρω secara tepat berarti membangkitkan; sufiks '-nya' mempertahankan objek αὐτόν, yaitu Lazarus.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Mempertahankan nuansa frasa Yunani bahwa Lazarus dibangkitkan keluar dari kalangan orang mati, dengan bentuk yang tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pernyataan kebangkitan Lazarus
  choice: membangkitkannya dari antara orang mati
  alternative: menghidupkannya kembali dari kematian
  rationale: Pilihan ini mengikuti ungkapan Yunani secara dekat dan mempertahankan klaim mukjizat tanpa melunakkannya atau menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Orang banyak' dipilih daripada 'kerumunan' agar sesuai dengan register narasi Alkitab yang tetap mudah dipahami. Aspek imperfek dinyatakan dengan 'terus'.
