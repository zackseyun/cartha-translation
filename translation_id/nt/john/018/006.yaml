  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: id
  text: Jadi, ketika Ia berkata kepada mereka, “Akulah Dia,”[a] mereka mundur dan jatuh ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Aku adalah.” Ungkapan Yunani ini mungkin juga menggemakan ucapan-ucapan khas “Aku adalah” dalam Injil Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Jadi, ketika
  rationale: Memadukan hubungan naratif/inferensial οὖν dengan makna temporal ὡς secara alami dalam bahasa Indonesia.
- source_word: εἶπεν αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Padanan langsung dan wajar bagi verba berkata dengan objek tak langsung αὐτοῖς.
- source_word: Ἐγώ εἰμι
  choice: Akulah Dia
  rationale: Dalam konteks penangkapan, ungkapan ini berfungsi sebagai pengenalan diri sebagai orang yang mereka cari. Bentuk ini tetap cukup dekat dengan susunan Yunani dan membuka ruang bagi gema teologisnya.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: mereka mundur
  rationale: Ungkapan Yunani menyatakan gerakan ke belakang; 'mundur' merupakan padanan Indonesia yang ringkas, alami, dan tepat.
- source_word: ἔπεσαν χαμαί
  choice: jatuh ke tanah
  rationale: Menyampaikan gerakan fisik jatuh hingga ke tanah secara jelas dan alami.
theological_decisions:
- issue: Penerjemahan Ἐγώ εἰμι dalam konteks Injil Yohanes yang mungkin memiliki gema teologis
  choice: Akulah Dia
  alternative: Aku ada
  rationale: Konteks langsung menunjuk pada pengenalan diri sebagai orang yang dicari, sehingga teks utama memakai ungkapan Indonesia yang idiomatis. Namun, bentuk Yunani secara harfiah adalah 'Aku ada' dan mungkin menggemakan perkataan-perkataan khas ἐγώ εἰμι dalam Injil Yohanes; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, ringkas, dan bermartabat. Kapitalisasi kata ganti 'Ia' dan bentuk 'Akulah Dia' mengikuti register Alkitab Indonesia yang umum tanpa menambahkan penafsiran denominasi.
