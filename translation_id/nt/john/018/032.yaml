  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: id
  text: Hal itu terjadi supaya perkataan Yesus digenapi[a], yang telah Ia ucapkan sambil menunjukkan bagaimana Ia akan mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan Yesus.”
    reason: lexical_alternative
  - marker: b
    text: Yesus sebelumnya telah menunjukkan cara Ia akan mati, yang kemungkinan merujuk pada penyaliban. Bandingkan Yohanes 12:32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil dengan ungkapan Indonesia yang alami, tanpa menghilangkan daya teleologis klausa.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: perkataan Yesus
  rationale: Dalam konteks ini λόγος menunjuk pada ucapan atau pernyataan Yesus, bukan gelar 'Firman' dalam Yohanes 1:1.
- source_word: πληρωθῇ
  choice: digenapi
  rationale: Mempertahankan bahasa penggenapan yang khas dan berbobot dalam Injil Yohanes.
- source_word: ὃν εἶπεν
  choice: yaitu perkataan yang telah diucapkan-Nya
  rationale: Memperjelas rujukan pronomina relatif kepada 'perkataan' dan menempatkan ucapan itu sebelum peristiwa naratif ini.
- source_word: σημαίνων
  choice: untuk menunjukkan
  rationale: Menyampaikan fungsi partisipel sebagai penjelasan tentang maksud atau dampak ucapan Yesus dalam bahasa Indonesia yang lancar.
- source_word: ποίῳ θανάτῳ
  choice: bagaimana Ia akan mati
  rationale: Ungkapan alami dalam bahasa Indonesia untuk jenis atau cara kematian; tidak sekadar menyatakan fakta bahwa Ia akan mati.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: Ia akan mati
  rationale: Menyatakan masa depan yang sudah dekat atau akan terjadi tanpa menambahkan gagasan determinisme yang lebih kuat daripada teks.
theological_decisions:
- issue: Bahasa penggenapan sehubungan dengan nubuat Yesus sebelumnya
  choice: perkataan Yesus digenapi
  alternative: apa yang dikatakan Yesus menjadi kenyataan
  rationale: Pilihan ini mempertahankan motif teologis πληρόω dalam Yohanes dan kaitan antara peristiwa tersebut dengan ucapan Yesus sebelumnya.
- issue: Jenis kematian Yesus
  choice: bagaimana Ia akan mati
  alternative: dengan jenis kematian apa Ia akan mati
  rationale: Terjemahan utama menyampaikan cara kematian secara alami tanpa menyebut penyaliban secara eksplisit; konteks dan Yohanes 12:32–33 mendukung kaitan itu, tetapi istilah tersebut tidak muncul dalam ayat ini.
- issue: Daya μέλλω
  choice: Ia akan mati
  alternative: Ia sudah hampir mati; Ia ditakdirkan untuk mati
  rationale: Menghindari penekanan berlebihan baik pada kesegeraan maupun predestinasi, sambil mempertahankan rujukan ke peristiwa mendatang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami dengan menambahkan 'Hal itu terjadi' sebagai penopang klausa tujuan yang bergantung pada konteks sebelumnya. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan terjemahan Alkitab Indonesia.
