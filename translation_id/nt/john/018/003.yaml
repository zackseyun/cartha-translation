  source_fidelity: Draf pada dasarnya memuat semua unsur sumber Yunani dan membedakan pasukan dari para petugas yang berasal dari imam-imam kepala dan orang-orang Farisi. Namun, pemecahan menjadi dua kalimat mengubah subjek eksplisit dari Yudas menjadi “mereka” untuk lentera, obor, dan senjata. Walaupun hal itu mungkin tersirat secara konteks, teks Yunani menyatakan bahwa Yudas datang ke sana μετὰ (“dengan/disertai”) perlengkapan tersebut. Susunan satu kalimat lebih dekat kepada konstruksi sumber dan lebih jelas.
  naturalness: Bahasa draf umumnya modern dan wajar. “Setelah membawa serta” lebih idiomatis daripada “datang ... dengan membawa satu pasukan,” serta menghindari kesan bahwa Yudas secara fisik membawa pasukan itu. Kalimat tunggal tetap lancar tanpa menjadi kaku.
  terminology: “Imam-imam kepala,” “orang-orang Farisi,” “petugas,” “lentera,” “obor,” dan “senjata” sudah tepat. “Pasukan” dapat dipertahankan sebagai istilah umum untuk σπεῖρα, dengan catatan kaki yang menjaga kemungkinan “detasemen” atau “sekelompok tentara” dan tidak mengandaikan seluruh kohor hadir.
  issues:
