  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: id
  text: Maka Yudas, setelah membawa serta satu pasukan[a] dan para petugas[b] dari imam-imam kepala dan orang-orang Farisi, datang ke sana dengan lentera, obor, dan senjata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu detasemen” atau “sekelompok tentara”. Kata Yunani yang dipakai dapat menunjuk satuan militer, tetapi tidak mengharuskan bahwa seluruh pasukan itu hadir.
    reason: lexical_alternative
  - marker: b
    text: Atau “para penjaga” atau “petugas keamanan Bait Allah”. Yang dimaksud ialah para pelayan resmi yang bekerja bagi para pemimpin Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan dan akibat naratif dari konteks sebelumnya dengan ungkapan Indonesia yang wajar.
- source_word: λαβὼν
  choice: dengan membawa
  rationale: Menyatakan tindakan yang menyertai dan secara logis mendahului kedatangan Yudas tanpa menghasilkan susunan partisipial yang kaku dalam bahasa Indonesia.
- source_word: σπεῖραν
  choice: satu pasukan
  rationale: Menunjuk satuan atau detasemen militer, tetapi tidak memastikan bahwa seluruh kohor dengan jumlah lengkap hadir; alternatif dijelaskan dalam catatan kaki.
- source_word: ὑπηρέτας
  choice: para petugas
  rationale: Cukup luas untuk para pelayan resmi atau penjaga yang bekerja bagi para pemimpin Yahudi tanpa secara berlebihan menetapkan jabatan mereka sebagai polisi Bait Allah.
- source_word: ἀρχιερέων
  choice: imam-imam kepala
  rationale: Padanan baku bagi kelompok pemimpin keimaman, bukan pernyataan bahwa ada beberapa pemegang jabatan imam besar secara bersamaan.
- source_word: Φαρισαίων
  choice: orang-orang Farisi
  rationale: Sebutan kelompok yang lazim dan jelas dalam bahasa Indonesia.
- source_word: ἔρχεται
  choice: datang
  rationale: Menyampaikan peristiwa naratif secara alami dalam bahasa Indonesia; bentuk sekarang historis Yunani tidak perlu ditiru secara kaku karena bahasa Indonesia tidak menandai kala pada verba.
- source_word: ἐκεῖ
  choice: ke sana
  rationale: Merujuk secara alami kepada tempat yang telah disebutkan dalam konteks.
- source_word: φανῶν
  choice: lentera
  rationale: Menunjuk alat penerang portabel dan mempertahankan perbedaannya dari obor.
- source_word: λαμπάδων
  choice: obor
  rationale: Padanan alami bagi alat penerang berupa nyala terbuka, berbeda dari lentera.
- source_word: ὅπλων
  choice: senjata
  rationale: Padanan umum dan jelas bagi perlengkapan bersenjata.
theological_decisions:
- issue: Identitas dan susunan rombongan yang menangkap Yesus
  choice: Membedakan satu pasukan dari para petugas yang berasal dari imam-imam kepala dan orang-orang Farisi.
  alternative: Menyebut seluruh rombongan secara umum sebagai sekelompok tentara dan penjaga.
  rationale: Struktur Yunani menyajikan σπεῖρα dan ὑπηρέται sebagai unsur yang dapat dibedakan, serta mengaitkan para petugas dengan para pemimpin Yahudi. Terjemahan tidak menetapkan jumlah pasukan atau memastikan bahwa seluruh kohor hadir.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua agar hubungan pelaku dan perlengkapannya mudah dipahami, tanpa menghilangkan unsur apa pun. Semua penanda catatan kaki ditempatkan langsung dalam teks.
