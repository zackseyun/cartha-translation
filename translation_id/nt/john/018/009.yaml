  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: id
  text: 'supaya perkataan yang telah diucapkan-Nya terpenuhi: “Dari antara mereka yang telah Engkau berikan kepada-Ku, Aku tidak kehilangan seorang pun.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak satu pun dari mereka.”
    reason: Alternatif leksikal untuk ungkapan partitif ἐξ αὐτῶν οὐδένα.
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan sekaligus hasil dalam alur narasi; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya telik klausa Yunani.
- source_word: πληρωθῇ
  choice: genaplah
  rationale: Menerjemahkan bentuk pasif subjungtif dengan ungkapan yang lazim untuk terlaksananya suatu perkataan, sambil mempertahankan bobot teologis bahasa penggenapan.
- source_word: ὁ λόγος
  choice: perkataan
  rationale: Dalam konteks ini λόγος menunjuk pada ucapan tertentu yang sebelumnya disampaikan Yesus, bukan gelar teologis 'Firman'.
- source_word: ὃν εἶπεν
  choice: yang telah diucapkan-Nya
  rationale: Aspek lampau dinyatakan secara alami dengan 'telah'; akhiran hormat -Nya merujuk kepada Yesus tanpa mengulang nama-Nya.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi langsung dari perkataan itu.
- source_word: Οὓς δέδωκάς μοι
  choice: mereka yang telah Engkau berikan kepada-Ku
  rationale: Kata 'telah' mempertahankan nuansa perfektum bahwa pemberian itu sudah terjadi dan hasilnya tetap berlaku; huruf kapital pada pronomina mengikuti register Alkitab Indonesia untuk sapaan kepada Allah.
- source_word: ἀπώλεσα
  choice: Aku tidak kehilangan
  rationale: Dalam konteks perlindungan terhadap para murid, verba ini berarti tidak kehilangan mereka yang dipercayakan kepada Yesus, bukan bahwa Ia tidak membinasakan mereka.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: tidak ... seorang pun
  rationale: Ungkapan ini menyampaikan penyangkalan yang tegas, yakni tidak satu orang pun dari kelompok tersebut.
theological_decisions:
- issue: Sifat bahasa penggenapan
  choice: Menerjemahkan πληρωθῇ dengan 'genaplah' sebagai terlaksananya perkataan Yesus sebelumnya.
  alternative: menjadi kenyataan
  rationale: Yohanes memakai bahasa penggenapan juga bagi perkataan Yesus sendiri. 'Genaplah' mempertahankan bobot maksud ilahi dan perwujudan dalam narasi tanpa menyebut perkataan itu secara khusus sebagai nubuat Kitab Suci.
- issue: Makna ἀπώλεσα sehubungan dengan para murid
  choice: Aku tidak kehilangan seorang pun
  alternative: Aku tidak membinasakan seorang pun; Aku tidak membiarkan seorang pun binasa
  rationale: Konteks penangkapan menyoroti perlindungan Yesus terhadap para murid dan menggemakan Yohanes 17:12. 'Kehilangan' mempertahankan metafora sumber serta ketegangan teologisnya tanpa memasukkan sistem doktrinal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan 'dari antara mereka' mempertahankan nuansa partitif Yunani, sedangkan keseluruhan kutipan ditata agar tetap jelas bagi pembaca umum.
