review_pass:
  verdict: revise
  source_fidelity: 'Makna dasar terjaga: Yesus dibawa dari Kayafas ke praetorium pada pagi hari, sementara para pengantar tidak masuk demi menghindari kenajisan dan agar dapat makan Paskah. Namun, “dari tempat Kayafas” menambahkan dan sekaligus membentuk ungkapan yang kurang idiomatis; teks Yunani hanya menyatakan “dari Kayafas.” “Masih pagi-pagi sekali” juga sedikit menguatkan πρωΐ, yang cukup berarti pagi hari/awal pagi.'
  naturalness: 'Bahasa keseluruhan sudah baku dan jelas. Revisi kecil membuat pembukaan lebih idiomatis serta hubungan tujuan-kontras dalam anak kalimat lebih langsung: “supaya mereka tidak menjadi najis, melainkan dapat makan Paskah.”'
  terminology: “Kayafas,” “Yesus,” “najis,” dan “Paskah” tepat serta lazim. “Kediaman resmi gubernur” merupakan padanan maknawi yang dapat diterima untuk πραιτώριον, dengan “pretorium” dipertahankan sebagai alternatif dalam catatan. Catatan tentang “makan Paskah” dengan tepat mempertahankan cakupan yang diperdebatkan tanpa memutuskan persoalan kronologi.
  issues:
  - severity: low
    issue: “dari tempat Kayafas”
    rationale: Ungkapan ini menambahkan “tempat” yang tidak ada dalam teks Yunani dan kurang alami karena Kayafas adalah nama orang. “Dari Kayafas” mempertahankan keluwesan sumber, yang secara konteks dapat menunjuk pada tempat atau hadiratnya.
  - severity: low
    issue: “masih pagi-pagi sekali”
    rationale: Kata “sekali” dapat memberi intensitas yang tidak secara eksplisit dituntut oleh πρωΐ. “Masih pagi” menyampaikan waktu awal pagi tanpa mempersempit atau menguatkannya.
  - severity: low
    issue: Koordinasi “supaya tidak ... tetapi dapat ...”
    rationale: “Melainkan” lebih jelas menyatakan kontras dalam satu klausa tujuan Yunani ἵνα μὴ ... ἀλλὰ ... dan menghindari kemungkinan pembacaan bahwa “tetapi” memulai hubungan antarklausa yang longgar.
