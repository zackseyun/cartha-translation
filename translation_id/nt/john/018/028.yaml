id: JHN.18.28
reference: John 18:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: id
  text: Lalu mereka membawa Yesus dari Kayafas ke kediaman resmi gubernur[a]. Waktu itu masih pagi. Mereka sendiri tidak masuk ke kediaman itu supaya mereka tidak menjadi najis[b], melainkan dapat makan Paskah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pretorium”, yaitu kediaman resmi gubernur Romawi yang juga menjadi pusat pemerintahan dan pengadilan.
    reason: lexical_alternative
  - marker: b
    text: “Menjadi najis” berarti menjadi tidak tahir menurut ketentuan upacara keagamaan.
    reason: cultural_note
  - marker: c
    text: “Makan Paskah” dapat merujuk secara khusus pada jamuan Paskah atau secara lebih luas pada santapan dan perayaan selama masa Paskah.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: mereka membawa
  rationale: Kala kini historis dialihkan secara wajar sebagai bentuk lampau naratif dalam bahasa Indonesia; “membawa” sesuai dengan pemindahan Yesus dalam tahanan.
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan sekaligus hubungan dengan peristiwa sebelumnya tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: πραιτώριον
  choice: kediaman resmi gubernur
  rationale: Istilah ini menunjuk pada tempat tinggal resmi gubernur Romawi yang juga berfungsi sebagai pusat pemerintahan dan pengadilan. Terjemahan maknawi lebih mudah dipahami daripada transliterasi semata.
- source_word: πρωΐ
  choice: masih pagi-pagi sekali
  rationale: Menunjukkan bagian awal pagi hari tanpa menetapkan waktunya secara lebih sempit sebagai fajar.
- source_word: αὐτοὶ
  choice: mereka sendiri
  rationale: Mempertahankan penekanan pada orang-orang yang menyerahkan Yesus dan kontras dengan tindakan mereka yang tidak mau masuk.
- source_word: εἰσῆλθον
  choice: tidak masuk
  rationale: Padanan langsung dan alami bagi tindakan memasuki gedung tersebut.
- source_word: μιανθῶσιν
  choice: menjadi najis
  rationale: Dalam konteks ini verba tersebut merujuk pada kenajisan ritual; “menjadi najis” alami dalam bahasa Indonesia dan mempertahankan nuansa keagamaan.
- source_word: φάγωσιν τὸ πάσχα
  choice: dapat makan Paskah
  rationale: Mempertahankan ungkapan sumber dan membiarkan terbuka apakah yang dimaksud adalah jamuan Paskah secara khusus atau santapan/perayaan selama masa Paskah.
- source_word: Καϊάφα
  choice: Kayafas
  rationale: Menggunakan bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Menggunakan bentuk nama baku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna “makan Paskah” dalam kaitannya dengan kronologi Injil Yohanes
  choice: Mempertahankan ungkapan “makan Paskah” tanpa menentukan rujukannya secara sempit.
  alternative: “makan jamuan Paskah” atau “makan santapan-santapan perayaan Paskah”
  rationale: Ungkapan Yunani itu jelas secara leksikal, tetapi cakupan tepatnya diperdebatkan. Terjemahan utama mempertahankan ambiguitas sumber dan tidak menyelesaikan ketegangan kronologis melalui penerjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Istilah teknis πραιτώριον diterjemahkan secara maknawi dalam teks utama, sedangkan bentuk transliterasinya dicantumkan dalam catatan. Urutan penanda catatan dibuat [a], [b], [c] sesuai kemunculannya dalam teks.
