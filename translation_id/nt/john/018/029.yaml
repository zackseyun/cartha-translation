  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: id
  text: Karena itu, Pilatus keluar menemui mereka dan berkata, “Tuduhan apa yang kalian ajukan terhadap orang ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: keluar
  rationale: Gabungan verba ἐξέρχομαι dan adverbia ἔξω menegaskan gerakan dari ruang dalam ke luar. Dalam bahasa Indonesia, “keluar” secara alami mewakili keduanya tanpa pengulangan yang janggal.
- source_word: οὖν
  choice: Karena itu
  rationale: οὖν menghubungkan tindakan Pilatus dengan keadaan pada ayat sebelumnya dan dapat menyatakan kelanjutan yang beralasan. “Karena itu” mempertahankan daya hubung tersebut dalam narasi yang wajar.
- source_word: πρὸς αὐτούς
  choice: menemui mereka
  rationale: πρός dengan akusatif menunjukkan gerakan menuju orang-orang itu. Dalam konteks Pilatus keluar untuk berbicara kepada mereka, “menemui mereka” menyampaikan arah sekaligus perjumpaan secara alami.
- source_word: φησίν
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang tidak menandai kala secara morfologis; “berkata” sesuai dengan alur peristiwa lampau.
- source_word: Τίνα κατηγορίαν
  choice: Tuduhan apa
  rationale: κατηγορία adalah tuduhan atau dakwaan dalam konteks hukum. “Tuduhan” jelas bagi pembaca umum dan tetap mempertahankan nuansa forensik.
- source_word: φέρετε
  choice: kalian ajukan
  rationale: φέρω dalam konteks hukum berarti membawa atau mengemukakan tuduhan. Kolokasi Indonesia yang alami ialah “mengajukan tuduhan”.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: terhadap orang ini
  rationale: κατά dengan genitif bermakna melawan atau terhadap dalam perkara hukum; ἄνθρωπος menunjuk seorang individu laki-laki, tetapi bahasa Indonesia lazim menyebutnya “orang ini” tanpa mengaburkan rujukan personal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “kalian” dipakai karena Pilatus berbicara kepada sekelompok orang; susunan pertanyaan dibuat alami tanpa mengurangi corak pemeriksaan hukum.
