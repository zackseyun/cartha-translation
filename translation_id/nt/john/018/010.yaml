id: JHN.18.10
reference: John 18:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: id
  text: Lalu Simon Petrus, yang membawa sebilah pedang, menghunusnya dan menebas budak[a] imam besar itu hingga telinga kanannya putus. Nama budak itu Malkhus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba.” Kata Yunani doulos dapat berarti “budak” atau “hamba/pelayan,” bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan adegan secara alami dalam narasi Indonesia tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: ἔχων μάχαιραν
  choice: yang membawa sebilah pedang
  rationale: Mengungkapkan bahwa Petrus memiliki pedang pada saat itu; 'membawa' lebih alami daripada terjemahan harfiah 'mempunyai', sedangkan 'pedang' mempertahankan cakupan umum μάχαιρα tanpa mempersempitnya menjadi belati.
- source_word: εἵλκυσεν αὐτήν
  choice: menghunusnya
  rationale: Padanan idiomatis untuk menarik senjata dari sarungnya dan mempertahankan pronomina objek Yunani.
- source_word: ἔπαισεν
  choice: menyerang
  rationale: Dalam konteks serangan dengan pedang, 'menyerang' menyampaikan tindakan kekerasan secara alami tanpa mengharuskan rincian tentang bagian tubuh yang terkena.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: hamba imam besar itu
  rationale: '''Hamba'' merupakan istilah Indonesia yang wajar dan bermartabat bagi δοῦλος dalam rumah tangga pejabat tinggi, sambil tetap dapat mencakup status sebagai budak; artikel tertentu ditampilkan dengan ''itu''.'
- source_word: ἀπέκοψεν
  choice: memotong
  rationale: Bersama objek 'telinga', verba ini secara alami menyatakan bahwa telinga tersebut terpotong; bahasa Indonesia tidak memerlukan partikel terpisah yang setara dengan 'off'.
- source_word: ὠτάριον τὸ δεξιόν
  choice: telinga kanannya
  rationale: Bentuk diminutif ὠτάριον lazim berarti 'telinga' dan tidak perlu diterjemahkan sebagai 'telinga kecil' atau dipersempit menjadi 'cuping telinga'; τὸ δεξιόν menentukan sisi kanan.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Nama hamba itu Malkhus
  rationale: Susunan posesif Yunani dialihkan ke bentuk idiomatis Indonesia. δέ berfungsi sebagai peralihan ringan yang tidak harus diberi kata penghubung tersendiri setelah kalimat sebelumnya.
theological_decisions:
- issue: Pemadanan δοῦλος
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' dalam konteks ini menjaga cakupan semantis antara pelayan rumah tangga dan orang berstatus budak serta terdengar alami dalam narasi Indonesia. Karena δοῦλος dapat secara tegas menunjuk budak, alternatif itu dipertahankan dalam catatan kaki agar realitas status sosialnya tidak disamarkan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama Μάλχος ditransliterasikan sebagai 'Malkhus' untuk mencerminkan bunyi konsonan Yunani χ sesuai kebiasaan transliterasi Indonesia. Penanda catatan ditempatkan setelah nama karena catatan menjelaskan kedua kemunculan 'hamba' dalam ayat.
