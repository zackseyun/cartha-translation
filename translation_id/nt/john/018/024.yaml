  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: id
  text: Lalu Hanas mengirim Dia dalam keadaan terikat kepada Kayafas, Imam Besar itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dalam konteks, “Hanas telah mengirim Dia dalam keadaan terikat kepada Kayafas, Imam Besar itu,” jika dipahami sebagai catatan sisipan yang menjelaskan kejadian sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mengirim
  rationale: Bentuk aoristus aktif indikatif dari ἀποστέλλω menyatakan tindakan naratif; “mengirim” merupakan padanan Indonesia yang alami dan tepat.
- source_word: οὖν
  choice: Karena itu
  rationale: οὖν menghubungkan tindakan ini dengan konteks sebelumnya dan dapat menyatakan kelanjutan yang beralasan; “Karena itu” mempertahankan daya penghubungnya tanpa menghilangkannya.
- source_word: δεδεμένον
  choice: dalam keadaan terikat
  rationale: Partisipel perfekt pasif dari δέω menerangkan keadaan Yesus ketika dikirim. Ungkapan ini mempertahankan aspek keadaan yang telah terjadi dan masih berlangsung tanpa menambahkan penekanan “masih” yang tidak eksplisit.
- source_word: πρὸς Καϊάφαν
  choice: kepada Kayafas
  rationale: Dengan verba gerak dan bentuk akusatif, πρός menunjukkan arah menuju seseorang; “kepada Kayafas” alami dalam bahasa Indonesia.
- source_word: ὁ Ἅννας
  choice: Hanas
  rationale: Nama diri Ἅννας ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: τὸν ἀρχιερέα
  choice: Imam Besar itu
  rationale: ἀρχιερεύς menunjuk jabatan imam besar Yahudi. Artikel tertentu diterjemahkan dengan “itu” agar hubungan aposisional dengan Kayafas tetap jelas.
theological_decisions:
- issue: Urutan narasi dalam hubungannya dengan konteks sekitar
  choice: 'Menerjemahkan aoristus sebagai tindakan lampau dalam alur narasi: Hanas mengirim Yesus kepada Kayafas.'
  alternative: 'Memahaminya sebagai catatan sisipan tentang tindakan yang telah terjadi sebelumnya: “Sebelumnya Hanas telah mengirim Dia …”'
  rationale: Secara langsung, aoristus indikatif dapat dibaca sebagai peristiwa naratif. Namun, hubungan ayat ini dengan rangkaian pemeriksaan sebelumnya memungkinkan pembacaan sebagai kilas balik. Teks utama mempertahankan pembacaan gramatikal yang lugas, sedangkan catatan kaki menjaga alternatif kontekstual tanpa memaksakan penyelarasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Dia” mengikuti kebiasaan terjemahan Alkitab Indonesia untuk rujukan kepada Yesus; “Imam Besar” diperlakukan sebagai sebutan jabatan tertentu. Struktur dibuat alami sambil mempertahankan keadaan terikat dan ambiguitas urutan narasi melalui catatan kaki.
