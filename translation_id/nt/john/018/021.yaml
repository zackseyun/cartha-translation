id: JHN.18.21
reference: John 18:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: id
  text: “Mengapa engkau menanyai Aku? Tanyailah mereka yang telah mendengar apa yang Kukatakan kepada mereka. Lihat, mereka ini tahu apa yang Kukatakan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Mengapa engkau menanyai Aku?
  rationale: Kata kerja ἐρωτάω pada konteks pemeriksaan resmi ini wajar diterjemahkan dengan 'menanyai', yang lebih kuat daripada 'bertanya kepada' tanpa melebihkan maknanya.
- source_word: ἐρώτησον
  choice: Tanyailah
  rationale: Bentuk imperatif aoristus menuntut tindakan langsung; 'tanyailah' mempertahankan kesejajaran dengan 'menanyai' dan cocok dengan konteks pemeriksaan.
- source_word: τοὺς ἀκηκοότας
  choice: mereka yang telah mendengar
  rationale: Ungkapan ini mempertahankan aspek perfektum partisipel, yakni orang-orang yang sudah mendengar dan karena itu dapat memberi kesaksian.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: apa yang Kukatakan kepada mereka
  rationale: λαλέω di sini berarti berbicara atau mengatakan; bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan mengajar atau memberitahukan.
- source_word: ἴδε
  choice: Lihat
  rationale: Imperatif ini berfungsi menarik perhatian; 'Lihat' jelas, modern, dan mempertahankan daya tunjuknya.
- source_word: οὗτοι οἴδασιν
  choice: mereka ini tahu
  rationale: '''Mereka ini'' mempertahankan tekanan deiktis οὗτοι sambil tetap alami dalam bahasa Indonesia dan tanpa menambahkan gender.'
- source_word: ἃ εἶπον ἐγώ
  choice: apa yang Kukatakan
  rationale: Terjemahan ini menyampaikan isi yang diketahui para pendengar; susunan bahasa Indonesia dan bentuk pronominal 'Ku-' cukup menandai pembicara tanpa menambahkan 'Aku sendiri'.
theological_decisions:
- issue: Nada forensik jawaban Yesus di hadapan imam besar
  choice: Memakai 'menanyai/Tanyailah' untuk kedua kemunculan ἐρωτάω.
  alternative: Memakai 'bertanya kepada/tanyakanlah kepada' yang lebih netral.
  rationale: Latar pemeriksaan resmi mendukung nuansa interogatif yang lebih kuat. Pilihan ini menjaga ketegasan jawaban Yesus tanpa menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' serta kapitalisasi pronomina yang merujuk kepada Yesus mengikuti register Alkitab Indonesia yang lazim. Pengulangan dipertahankan karena mencerminkan struktur retoris teks Yunani.
