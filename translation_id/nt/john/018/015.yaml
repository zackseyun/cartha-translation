base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: id
  text: Simon Petrus sedang mengikuti Yesus[a], dan seorang murid lain juga mengikuti Dia. Murid itu dikenal oleh Imam Besar, dan ia masuk bersama Yesus ke halaman Imam Besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Simon Petrus sedang mengikuti Yesus, dan seorang murid lain.” Bahasa Yunani membiarkan tindakan mengikuti yang juga dilakukan murid kedua itu tersirat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam alur cerita. Dalam narasi bahasa Indonesia, bentuk lampau tidak perlu ditandai secara gramatikal; konteks dan verba “mengikuti” menyampaikan tindakan tersebut dengan wajar.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini berfungsi sebagai penghubung ringan dalam perkembangan narasi. Alur antarkalimat sudah alami dalam bahasa Indonesia tanpa tambahan seperti “adapun” yang dapat terasa lebih bertanda.
- source_word: καὶ ἄλλος μαθητής
  choice: demikian juga seorang murid lain
  rationale: Ungkapan ini mengoordinasikan murid lain dengan Simon Petrus dan secara implisit membuatnya turut melakukan tindakan mengikuti. Terjemahan ini memperjelas tindakan bersama tanpa mengubah acuannya.
- source_word: μαθητής
  choice: murid
  rationale: “Murid” adalah padanan baku dan alami bagi seorang pengikut sekaligus pelajar Yesus dalam Injil Yohanes.
- source_word: ἐκεῖνος
  choice: itu
  rationale: Kata penunjuk tersebut mengacu kembali kepada “seorang murid lain”; “murid itu” mempertahankan fungsi anaforisnya dengan alami.
- source_word: γνωστός
  choice: dikenal
  rationale: Padanan ini mempertahankan pernyataan bahwa murid tersebut dikenal oleh Imam Besar tanpa melebihkan tingkat kedekatan menjadi “dikenal baik” atau “akrab”.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: Imam Besar
  rationale: Ini adalah istilah Indonesia yang baku dalam konteks jabatan keagamaan Yahudi dan mempertahankan bentuk tunggal pada kedua kemunculan.
- source_word: συνεισῆλθεν
  choice: masuk bersama
  rationale: Verba majemuk ini menyatakan bahwa murid tersebut masuk bersama Yesus; pilihan ini mempertahankan unsur kebersamaan secara langsung.
- source_word: αὐλήν
  choice: halaman kediaman
  rationale: Dalam konteks ini αὐλή menunjuk halaman tertutup pada kediaman Imam Besar. “Halaman kediaman” memberi pembaca modern konteks tempat tanpa mempersempitnya secara berlebihan menjadi istana.
