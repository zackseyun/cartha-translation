base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: id
  text: Tetapi, kamu sekalian mempunyai kebiasaan bahwa aku membebaskan satu orang bagi kamu sekalian pada hari raya Paskah. Jadi, apakah kamu sekalian ingin aku membebaskan Raja orang Yahudi[a] bagi kamu sekalian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Raja orang Yudea.” Istilah Yunani yang dipakai dapat berarti orang Yahudi atau orang Yudea, bergantung pada konteks; di sini istilah itu muncul dalam gelar tetap yang digunakan dalam kisah sengsara.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: kebiasaan
  rationale: Dalam konteks ini menunjuk pada praktik yang sudah berlaku; “kebiasaan” alami dalam bahasa Indonesia dan tidak harus berarti kebiasaan pribadi.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: bahwa aku membebaskan satu orang bagi kalian
  rationale: Menjaga isi kebiasaan yang dinyatakan oleh klausa ἵνα serta membuat acuan personal ἕνα jelas secara alami.
- source_word: ἀπολύω
  choice: membebaskan
  rationale: Tepat untuk tindakan penguasa yang melepaskan seorang tahanan dan dipakai secara konsisten pada kedua kemunculannya.
- source_word: ἐν τῷ πάσχα
  choice: pada hari raya Paskah
  rationale: Menyampaikan waktu perayaan dengan jelas bagi pembaca Indonesia; πάσχα di sini mengacu pada perayaan Paskah Yahudi.
- source_word: βούλεσθε οὖν
  choice: Jadi, apakah kalian ingin
  rationale: “Jadi” menyampaikan hubungan inferensial οὖν, sedangkan “apakah kalian ingin” merupakan ungkapan modern dan wajar untuk βούλεσθε.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  rationale: Mempertahankan gelar yang berfungsi sebagai tuduhan kerajaan dalam kisah sengsara; huruf kapital menandai pemakaiannya sebagai gelar bagi Yesus.
theological_decisions:
- issue: Makna Ἰουδαίων dalam gelar τὸν βασιλέα τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  alternative: Raja orang Yudea
  rationale: Dalam kisah sengsara Yohanes, ungkapan ini merupakan gelar atau tuduhan kerajaan yang dilekatkan kepada Yesus. “Orang Yahudi” mempertahankan pengertian historis dan naratif yang lazim, sementara kemungkinan makna regional dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak “kalian” dipakai karena Pilatus berbicara kepada sekelompok orang; “aku” mengikuti tuturan langsung tanpa meninggikan diri. Susunan klausa kedua mempertahankan pengulangan “bagi kalian” yang terdapat dalam teks Yunani.
