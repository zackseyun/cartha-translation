source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: id
  text: Lalu gadis pelayan[a] yang menjaga pintu itu berkata kepada Petrus, “Bukankah kamu juga salah seorang murid orang itu?” Petrus menjawab, “Bukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “budak perempuan yang menjaga pintu.”
    reason: alternatif leksikal untuk παιδίσκη; istilah ini dapat merujuk kepada pelayan perempuan atau budak perempuan.
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Dalam konteks ini menandai kelanjutan alur cerita; “lalu” alami dalam bahasa Indonesia dan tetap mempertahankan fungsi penghubungnya.
- source_word: παιδίσκη
  choice: pelayan perempuan
  rationale: Menunjuk seorang pelayan perempuan, kemungkinan masih muda. Pilihan ini menyampaikan peran dan gender tanpa memastikan status hukum sebagai budak, yang tidak dinyatakan secara tegas oleh konteks.
- source_word: θυρωρός
  choice: yang menjaga pintu
  rationale: Mengungkapkan fungsi orang tersebut secara alami dan jelas dalam bahasa Indonesia.
- source_word: Μὴ καὶ σὺ
  choice: Bukankah kamu juga
  rationale: Bentuk pertanyaan dengan μή mengharapkan jawaban negatif; “bukankah” menyampaikan kecenderungan itu secara wajar.
- source_word: ἐκ τῶν μαθητῶν
  choice: salah seorang murid
  rationale: Ungkapan idiomatis untuk keanggotaan dalam kelompok dan mempertahankan nuansa partitif ἐκ.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: orang itu
  rationale: Mempertahankan cara penyebutan yang berjarak tanpa menjadikan ἄνθρωπος sebagai gelar.
- source_word: ἐκεῖνος
  choice: Petrus
  rationale: Rujukannya adalah Petrus; penyebutan nama menghindari ambiguitas yang dapat timbul dari pronomina bahasa Indonesia.
- source_word: Οὐκ εἰμί
  choice: Bukan
  rationale: Jawaban singkat dan tegas yang secara idiomatis menolak identitas atau keanggotaan yang ditanyakan, sepadan dengan elipsis Yunani.
theological_decisions:
- issue: Daya pertanyaan negatif yang diawali μή
  choice: 'Diterjemahkan sebagai pertanyaan yang mengharapkan jawaban negatif: “Bukankah kamu juga ...?”'
  alternative: Pertanyaan netral seperti “Apakah kamu juga ...?”
  rationale: Pilihan ini mempertahankan arah pragmatis pertanyaan Yunani tanpa menambahkan kepastian atau emosi yang tidak tersurat.
- issue: Nuansa status sosial παιδίσκη
  choice: pelayan perempuan
  alternative: budak perempuan
  rationale: Kata ini dapat merujuk pada pelayan atau budak perempuan. Konteks lebih menonjolkan peran orang itu daripada status hukumnya, sehingga terjemahan utama tidak memastikan hal yang tetap terbuka secara leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Kamu” sesuai dengan percakapan langsung antara seorang pelayan dan Petrus; “orang itu” mempertahankan nada berjarak. Tidak diperlukan catatan kaki karena alternatif παιδίσκη tidak harus ditampilkan untuk memahami ayat, dan semua penanda catatan kaki harus muncul dalam teks utama.
