source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: id
  text: Pilatus berkata kepada-Nya, “Apakah kebenaran itu?” Setelah berkata demikian, ia keluar lagi menemui orang-orang Yahudi[a] dan berkata kepada mereka, “Aku tidak menemukan dasar apa pun untuk menuduh Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi.” Dalam Injil Yohanes, sebutan “orang-orang Yahudi” kadang-kadang dapat merujuk secara lebih khusus kepada para penguasa Yahudi atau kelompok perwakilan yang menentang Yesus dalam konteks tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pilatus berkata kepada-Nya
  rationale: Bentuk kini λέγει berfungsi sebagai kala kini historis; bentuk lampau naratif “berkata” lebih alami dalam bahasa Indonesia. Pronomina hormat “-Nya” mengikuti kebiasaan penulisan untuk Yesus tanpa menambahkan gelar yang tidak ada dalam teks.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Apakah kebenaran itu?
  rationale: ἀλήθεια tanpa artikel dibiarkan bersifat umum. Susunan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi suatu kebenaran tertentu.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Setelah berkata demikian
  rationale: Partisip aoris εἰπών menunjukkan tindakan yang mendahului tindakan utama; “setelah” menyampaikan urutan itu secara jelas dan wajar.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: ia keluar lagi menemui orang-orang Yahudi[a]
  rationale: πάλιν diterjemahkan “lagi,” sedangkan ἐξῆλθεν mempertahankan gerakan keluar. “Menemui” secara alami menyatakan gerakan menuju kelompok yang dimaksud oleh πρός. Istilah Ἰουδαίους dipertahankan secara leksikal dalam teks utama, dengan catatan konteks.
- source_word: καὶ λέγει αὐτοῖς
  choice: dan berkata kepada mereka
  rationale: Kala kini historis kedua juga dialihkan ke bentuk lampau naratif agar alurnya konsisten dan alami.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Aku tidak menemukan dasar apa pun untuk menuduh Dia
  rationale: Dalam konteks pengadilan, αἰτία menunjuk pada alasan atau dasar tuduhan. Ungkapan ini mempertahankan nuansa forensik sambil tetap jelas bagi pembaca Indonesia; penekanan ἐγώ tercermin melalui penyebutan “Aku”.
theological_decisions:
- issue: Cakupan makna τοὺς Ἰουδαίους dalam kisah sengsara Yohanes
  choice: orang-orang Yahudi dalam teks utama, dengan catatan bahwa konteks dapat menunjuk lebih khusus kepada para pemimpin Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Padanan leksikal dipertahankan tanpa menyiratkan bahwa seluruh orang Yahudi hadir atau menentang Yesus. Catatan kaki menjaga kemungkinan rujukan kontekstual yang lebih sempit dan menghindari generalisasi etnis.
- issue: Nuansa yudisial αἰτία
  choice: dasar apa pun untuk menuduh Dia
  alternative: kesalahan apa pun pada-Nya; perkara apa pun terhadap-Nya
  rationale: Konteks pemeriksaan di hadapan Pilatus mendukung makna hukum berupa dasar tuduhan, bukan sekadar kesalahan moral yang umum.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Dialog dibuat alami tanpa menghilangkan sifat umum pertanyaan Pilatus atau konteks hukum pernyataan akhirnya.
