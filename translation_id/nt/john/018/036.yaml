  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: id
  text: Yesus menjawab, “Kerajaan-Ku bukan berasal dari dunia ini. Sekiranya kerajaan-Ku berasal dari dunia ini, para pelayan-Ku tentu sedang bertarung agar Aku tidak diserahkan kepada orang Yahudi[a]. Namun kenyataannya, kerajaan-Ku bukan berasal dari sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea”; dalam konteks ini mungkin lebih khusus menunjuk kepada para pemimpin Yahudi di Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: kerajaan
  rationale: “Kerajaan” merupakan padanan yang alami dan mapan dalam konteks kerajaan Yesus serta dapat mencakup wilayah maupun pemerintahan-Nya.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: berasal dari dunia ini
  rationale: ἐκ menandai sumber atau asal. “Berasal dari dunia ini” mempertahankan penekanan tersebut dan tidak menyiratkan bahwa kerajaan Yesus sama sekali tidak hadir di dunia.
- source_word: κόσμος
  choice: dunia
  rationale: “Dunia” adalah padanan langsung dan wajar; nuansa tatanan manusia yang berlawanan dengan Allah tetap dibiarkan muncul dari konteks Yohanes.
- source_word: ὑπηρέται
  choice: para pelayan-Ku
  rationale: Kata ini menunjuk kepada orang-orang yang melayani di bawah suatu wewenang. “Para pelayan-Ku” sesuai dengan konteks kerajaan tanpa mempersempitnya menjadi petugas resmi.
- source_word: ἠγωνίζοντο ἄν
  choice: tentu akan bertarung
  rationale: Bentuk pengandaian yang berlawanan dengan kenyataan menyatakan tindakan yang secara hipotetis akan dilakukan. “Bertarung” menyampaikan adanya perlawanan aktif dan sesuai dengan konteks penangkapan.
- source_word: ἵνα μὴ παραδοθῶ
  choice: agar Aku tidak diserahkan
  rationale: Ungkapan ini mempertahankan hubungan tujuan dan bentuk pasif παραδοθῶ secara alami dalam bahasa Indonesia.
- source_word: τοῖς Ἰουδαίοις
  choice: kepada orang Yahudi
  rationale: Padanan utama tetap dekat dengan bentuk leksikal bahasa Yunani, sedangkan kemungkinan acuan yang lebih sempit kepada orang Yudea atau para penguasa Yudea dijelaskan dalam catatan kaki.
- source_word: νῦν δὲ
  choice: Namun kenyataannya
  rationale: Dalam konstruksi ini, νῦν δὲ mengontraskan keadaan yang sebenarnya dengan pengandaian sebelumnya, bukan semata-mata menunjukkan waktu sekarang.
- source_word: ἐντεῦθεν
  choice: berasal dari sini
  rationale: “Berasal dari sini” mempertahankan ungkapan deiktis penutup dan kaitannya dengan bahasa sumber atau asal pada awal ayat.
theological_decisions:
- issue: Sifat kerajaan Yesus dalam hubungannya dengan dunia
  choice: “bukan berasal dari dunia ini”
  alternative: “bukan dari dunia ini” atau “bukan bagian dari dunia ini”
  rationale: Teks terutama menyangkal bahwa kerajaan Yesus bersumber dari tatanan dunia, bukan menyangkal kehadiran atau dampaknya di dunia. Penambahan “berasal” memperjelas nilai ἐκ tanpa meniadakan ketegangan teologis itu.
- issue: Acuan Ἰουδαῖοι dalam Injil Yohanes
  choice: Teks utama memakai “orang Yahudi” dengan alternatif kontekstual dalam catatan kaki.
  alternative: “orang Yudea” atau “para penguasa Yudea”
  rationale: Istilah Yunani dapat memiliki cakupan umum ataupun lebih sempit menurut konteks. Terjemahan utama mempertahankan keterbukaan leksikal, sementara catatan mengakui kemungkinan acuan khusus dalam adegan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Pengulangan “kerajaan-Ku” dipertahankan untuk mencerminkan penekanan teks Yunani.
