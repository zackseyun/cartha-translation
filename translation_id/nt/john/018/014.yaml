  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: id
  text: Kayafaslah yang telah menasihati orang-orang Yahudi[a] bahwa lebih baik satu orang mati demi rakyat itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi” atau “orang-orang Yudea”, bergantung pada bagaimana sebutan “orang-orang Yahudi” dalam Injil Yohanes dipahami dalam konteks ini.
    reason: alternative_reading
  - marker: b
    text: Atau “untuk rakyat itu” atau “atas nama rakyat itu”; dalam konteksnya, ungkapan ini juga dapat mengandung nuansa perwakilan atau pengorbanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Καϊάφας
  choice: Kayafaslah
  rationale: δέ berfungsi sebagai penghubung ringan dalam narasi dan tidak perlu dinyatakan dengan penanda waktu. Bentuk -lah secara alami menyoroti identitas Kayafas dalam konstruksi ini tanpa menambahkan pertentangan yang kuat.
- source_word: ὁ συμβουλεύσας
  choice: yang telah menasihati
  rationale: Partisip aoris berartikel mengidentifikasi Kayafas melalui tindakan yang mendahului peristiwa utama; 'telah menasihati' menyampaikan hubungan waktu dan fungsi atributifnya secara wajar.
- source_word: τοῖς Ἰουδαίοις
  choice: orang-orang Yahudi
  rationale: Teks Yunani memakai sebutan ini tanpa pembatas eksplisit. Terjemahan utama mempertahankan bentuk tersebut, sedangkan catatan kaki mencantumkan kemungkinan rujukan kontekstual.
- source_word: ὅτι συμφέρει
  choice: bahwa lebih baik
  rationale: συμφέρει menyatakan manfaat atau keuntungan; 'lebih baik' merupakan ungkapan Indonesia yang alami dalam konteks pertimbangan politis.
- source_word: ἕνα ἄνθρωπον ἀποθανεῖν
  choice: satu orang mati
  rationale: Terjemahan ini mempertahankan penekanan pada jumlah satu. Bahasa Indonesia tidak perlu menandai gender gramatikal; rujukan kepada seorang laki-laki tetap jelas dari konteks.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: demi bangsa itu
  rationale: ὑπέρ menyatakan manfaat atau tindakan atas nama pihak lain dan dapat mengandung gema representatif atau pengorbanan. 'Demi' menjaga keluasan itu. Dalam konteks Yohanes 11:50, λαός merujuk pada bangsa/umat yang sedang dibicarakan; 'bangsa itu' alami dalam bahasa Indonesia tanpa menyamakannya secara leksikal dengan ἔθνος.
theological_decisions:
- issue: Nuansa pendamaian atau penggantian dalam ὑπὲρ τοῦ λαοῦ
  choice: demi bangsa itu
  alternative: untuk bangsa itu; atas nama bangsa itu; menggantikan bangsa itu
  rationale: '''Demi'' memungkinkan makna manfaat dan perwakilan serta gema pengorbanan, tetapi tidak memaksakan rumusan penggantian yang lebih eksplisit daripada teks.'
- issue: Rujukan τοῖς Ἰουδαίοις dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Sumber tidak membatasi rujukannya secara eksplisit. Teks utama mempertahankan istilah formal, sementara catatan kaki menjaga pilihan penafsiran yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Nama Καϊάφας ditulis menurut bentuk Indonesia yang lazim, 'Kayafas'. Terjemahan mempertahankan ambiguitas rujukan 'orang-orang Yahudi' dan keluasan makna ὑπέρ melalui catatan kaki.
