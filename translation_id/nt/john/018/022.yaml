  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: id
  text: Setelah Yesus mengatakan hal-hal itu, salah seorang petugas yang berdiri di situ menampar-Nya[a] sambil berkata, “Begitukah Engkau menjawab Imam Besar?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memukul-Nya dengan tangan”; ungkapan Yunani menunjuk pada tamparan atau pukulan serupa dengan tangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Setelah Yesus mengatakan hal-hal itu
  rationale: Konstruksi genitif absolut menyatakan tindakan yang mendahului peristiwa berikutnya. Nama Yesus dipakai untuk memperjelas rujukan pronomina, sedangkan bentuk jamak ταῦτα dipertahankan sebagai ‘hal-hal itu’.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: salah seorang petugas yang berdiri di situ
  rationale: ὑπηρέτης menunjuk bawahan atau pelayan dalam kapasitas resmi; dalam konteks ini ‘petugas’ wajar dan tidak mempersempitnya secara tidak pasti menjadi polisi Bait Allah. παρεστηκώς menyatakan bahwa orang itu berada atau berdiri di dekat situ.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: menampar-Nya
  rationale: Ungkapan Yunani berarti memberikan pukulan dengan tangan, lazimnya tamparan atau pukulan serupa. ‘Menampar’ ringkas, alami, dan sesuai dengan makna utamanya; alternatif yang lebih luas dicatat dalam catatan kaki.
- source_word: εἰπών
  choice: sambil berkata
  rationale: Partisip ini mengantar ucapan yang menyertai tindakan; ‘sambil berkata’ menghasilkan narasi Indonesia yang lancar.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: Begitukah Engkau menjawab Imam Besar?
  rationale: Οὕτως menyoroti cara Yesus menjawab dan pertanyaan tersebut bernada teguran. ‘Imam Besar’ merupakan padanan baku bagi ἀρχιερεύς dalam konteks ini.
theological_decisions:
- issue: Identitas ὑπηρετῶν
  choice: petugas resmi dalam lingkungan imam besar
  alternative: pelayan; pengawal atau polisi Bait Allah
  rationale: Konteks menunjukkan personel bawahan yang menjalankan fungsi resmi, tetapi istilah Yunani sendiri tidak memastikan jabatan khususnya. Karena itu ‘petugas’ mempertahankan keluasan makna tanpa memasukkan identifikasi yang terlalu spesifik.
- issue: Jenis pukulan dalam ῥάπισμα
  choice: tamparan
  alternative: pukulan dengan tangan atau pukulan serupa
  rationale: ‘Tamparan’ adalah padanan alami dan kemungkinan utama, tetapi istilahnya dapat mencakup pukulan tangan serupa; ketidakpastian kecil ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘Engkau’ dipakai dalam ucapan langsung kepada Yesus, dan ‘Imam Besar’ ditulis sebagai gelar kontekstual. Struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam teks Yunani.
