  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: id
  text: Yesus menjawab, “Sudah Kukatakan kepada kalian bahwa Akulah Dia.[a] Jadi, jika kalian mencari Aku, biarkan orang-orang ini pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku adalah.” Bahasa Yunani tidak memuat kata “dia”; dalam konteks ini ungkapan tersebut mengidentifikasi Yesus sebagai orang yang mereka cari.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang baku dan alami untuk respons Yesus dalam dialog.
- source_word: Εἶπον ὑμῖν
  choice: Sudah Kukatakan kepada kalian
  rationale: Aoristus menunjuk pada pernyataan yang baru disampaikan sebelumnya; bentuk 'sudah' secara alami menyatakan pengingatan itu dalam bahasa Indonesia.
- source_word: ἐγώ εἰμι
  choice: Akulah dia
  rationale: Dalam konteks penangkapan, ungkapan ini mengidentifikasi Yesus sebagai orang yang dicari. Partikel -lah memberi penegasan pada ἐγώ, sedangkan 'dia' melengkapi identifikasi secara alami; bentuk harfiah dipertahankan dalam catatan kaki.
- source_word: ζητεῖτε
  choice: kalian mencari
  rationale: Kata kerja kini menyatakan tindakan yang sedang berlangsung dalam perjumpaan ini; dalam bahasa Indonesia bentuk sederhana 'mencari' sudah alami dan tidak memerlukan penanda progresif.
- source_word: ἄφετε
  choice: biarkan
  rationale: Imperatif ini berarti mengizinkan mereka pergi, tanpa harus menyiratkan bahwa mereka telah ditahan.
- source_word: τούτους
  choice: orang-orang ini
  rationale: Demonstrativa menunjuk kepada para pengikut Yesus yang hadir; padanan ini jelas dan tidak menambahkan identitas yang tidak dinyatakan oleh teks.
- source_word: ὑπάγειν
  choice: pergi
  rationale: Infinitif sesudah ἄφετε menyatakan keberangkatan yang diizinkan; 'pergi' merupakan padanan yang ringkas dan alami.
theological_decisions:
- issue: Penerjemahan ἐγώ εἰμι dalam konteks Yohanes
  choice: Akulah dia
  alternative: Akulah Aku / secara harfiah, “Aku adalah”
  rationale: Konteks langsung menekankan identifikasi Yesus sebagai orang yang dicari, sehingga 'Akulah dia' paling jelas dalam bahasa Indonesia. Namun, karena bentuk Yunani tidak memuat kata ganti predikatif dan dapat membawa gema teologis khas Injil Yohanes, bentuk yang lebih harfiah dicatat tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk ὑμῖν yang jamak; kapitalisasi pada kata ganti yang merujuk kepada Yesus mengikuti kelaziman gaya Alkitab bahasa Indonesia.
