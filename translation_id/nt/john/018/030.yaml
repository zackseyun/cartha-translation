source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: id
  text: Mereka menjawab dan berkata kepadanya, “Sekiranya orang ini tidak berbuat jahat, kami tidak akan menyerahkan dia kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Mereka menjawab dan berkata kepadanya
  rationale: Mempertahankan kedua verba dalam formula naratif yang bercorak Semitis. Ungkapan ini tetap wajar dan bermartabat dalam bahasa Indonesia serta mempertahankan rujukan αὐτῷ kepada Pilatus.
- source_word: Εἰ μὴ ἦν
  choice: Sekiranya ... tidak
  rationale: Bersama οὐκ ἄν dan bentuk lampau pada klausa utama, frasa ini menyatakan kondisi yang berlawanan dengan kenyataan. 'Sekiranya ... tidak' menyampaikan nuansa tersebut secara jelas dan alami.
- source_word: οὗτος
  choice: orang ini
  rationale: Merujuk kepada Yesus dengan nada menjaga jarak. 'Orang ini' alami dalam bahasa Indonesia tanpa menambahkan penghinaan yang tidak diwajibkan teks.
- source_word: κακὸν ποιῶν
  choice: berbuat jahat
  rationale: Mempertahankan daya verbal partisip ποιῶν dan muatan moral κακόν tanpa mengubahnya menjadi label atau tuduhan pidana teknis.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: kami tidak akan menyerahkan dia kepadamu
  rationale: Menyampaikan akibat kondisi kontrafaktual dan makna παραδίδωμι dalam konteks penyerahan kepada penguasa. 'Menyerahkan' sesuai dengan konteks hukum dan alur kisah.
theological_decisions:
- issue: Nada dan cakupan tuduhan para penuduh terhadap Yesus
  choice: berbuat jahat
  alternative: seorang penjahat
  rationale: κακὸν ποιῶν merupakan tuduhan umum tentang melakukan kejahatan, bukan sebutan hukum teknis. Terjemahan verbal mempertahankan sifat tuduhan yang luas dan tidak menentukan dakwaan yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif formal dan mudah dipahami. Bentuk 'menjawab dan berkata' sengaja dipertahankan untuk mencerminkan formula ganda sumber; 'dia' dipakai sebagai objek manusia sesuai pemakaian Indonesia modern.
