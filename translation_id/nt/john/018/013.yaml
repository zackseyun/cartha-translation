  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: id
  text: Mula-mula mereka membawa Yesus kepada Hanas, sebab Hanas adalah ayah mertua Kayafas, yang pada tahun itu adalah Imam Besar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: membawa Yesus
  rationale: ἄγω dapat berarti ‘menuntun’ atau ‘membawa’. Dalam konteks pemindahan seorang tahanan, ‘membawa’ terdengar alami dalam bahasa Indonesia. Objek yang tersirat dijelaskan sebagai ‘Yesus’ agar rujukannya jelas.
- source_word: πρὸς Ἅνναν
  choice: kepada Hanas
  rationale: πρός dengan akusatif menyatakan gerak menuju seseorang; ‘kepada Hanas’ merupakan padanan Indonesia yang langsung dan wajar.
- source_word: πρῶτον
  choice: mula-mula
  rationale: Kata ini berfungsi sebagai adverbia urutan dan menunjukkan bahwa Hanas adalah tujuan pertama.
- source_word: πενθερὸς
  choice: mertua
  rationale: πενθερός secara khusus berarti ayah mertua. Dalam bahasa Indonesia, ‘mertua’ adalah sebutan alami; hubungan dengan Kayafas tetap jelas dari susunan kalimat.
- source_word: ἀρχιερεὺς
  choice: imam besar
  rationale: ‘Imam besar’ adalah istilah Indonesia yang mapan dan tepat untuk jabatan keagamaan Yahudi ini.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: pada tahun itu
  rationale: Frasa genitif ini secara idiomatis menyatakan masa Kayafas menjabat sebagai imam besar.
- source_word: Ἅνναν
  choice: Hanas
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Καϊάφα
  choice: Kayafas
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Rujukan klausa ‘yang menjadi imam besar pada tahun itu’
  choice: Klausa relatif merujuk kepada Kayafas.
  alternative: Klausa dipahami merujuk kepada Hanas.
  rationale: Dalam bahasa Yunani, ὃς paling wajar merujuk kepada anteseden terdekat, Καϊάφα. Susunan Indonesia mempertahankan rujukan itu tanpa menambahkan ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Mula-mula’ mempertahankan urutan naratif, sedangkan pengulangan nama ‘Hanas’ menghindari ketidakjelasan pronominal.
