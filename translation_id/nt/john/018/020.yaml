  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: id
  text: Yesus menjawabnya, “Aku telah berbicara secara terbuka kepada dunia. Aku selalu mengajar di sinagoge dan di Bait Allah[a], tempat semua orang Yahudi[b] berkumpul. Aku tidak mengatakan apa pun secara rahasia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di kompleks Bait Allah” atau “di pelataran Bait Allah.” Kata Yunani hieron menunjuk pada keseluruhan kompleks Bait Allah, bukan khususnya ruang kudus bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Atau, “semua orang Yahudi” dapat dipahami sebagai “semua orang Yudea.” Istilah Yunani Ioudaioi peka terhadap konteks; dalam ayat ini istilah itu dapat merujuk kepada orang Yahudi secara luas atau kepada orang-orang Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: secara terbuka
  rationale: Konteks mempertentangkan perkataan yang terbuka dengan perkataan secara rahasia; pilihan ini menyatakan sifat publik dan tidak tersembunyi tanpa terlalu menonjolkan keberanian.
- source_word: λελάληκα
  choice: telah berbicara
  rationale: Bentuk perfek menunjukkan bahwa perkataan Yesus sebelumnya tetap relevan dalam pemeriksaan ini.
- source_word: τῷ κόσμῳ
  choice: kepada dunia
  rationale: Mempertahankan diksi khas Yohanes dan cakupan publik yang luas tanpa mereduksinya menjadi sekadar ‘kepada umum’.
- source_word: πάντοτε ἐδίδαξα
  choice: selalu mengajar
  rationale: Menyampaikan kebiasaan pelayanan pengajaran Yesus dengan bahasa Indonesia yang alami.
- source_word: ἐν συναγωγῇ
  choice: di sinagoge
  rationale: Bentuk tunggal Yunani dapat dipahami secara generik sebagai tempat pengajaran Yahudi; bahasa Indonesia tidak memerlukan artikel tertentu.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada keseluruhan kawasan Bait Allah, bukan secara khusus ruang kudus bagian dalam.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: semua orang Yahudi
  rationale: Dalam konteks tempat ibadah dan berkumpul, ungkapan ini paling wajar menunjuk secara luas kepada umat Yahudi, bukan hanya para penguasa atau penduduk Yudea.
- source_word: συνέρχονται
  choice: berkumpul
  rationale: Padanan alami yang menyampaikan tindakan datang bersama sebagai komunitas.
- source_word: ἐν κρυπτῷ
  choice: secara rahasia
  rationale: Mempertahankan pertentangan langsung dengan παρρησίᾳ, yaitu terbuka lawan tersembunyi.
- source_word: ἐλάλησα οὐδέν
  choice: Aku tidak pernah mengatakan apa pun
  rationale: Negasi οὐδέν diterjemahkan secara idiomatis; ‘tidak pernah’ dalam konteks ini memperjelas penyangkalan bahwa ada bagian pengajaran yang disampaikan diam-diam, selaras dengan pernyataan kebiasaan publik sebelumnya.
- source_word: ἀπεκρίθη αὐτῷ
  choice: Yesus menjawab dia
  rationale: Padanan naratif yang langsung dan alami; pronomina tetap dipertahankan sesuai teks.
theological_decisions:
- issue: Cakupan κόσμος dalam pernyataan Yesus
  choice: kepada dunia
  alternative: kepada umum / kepada semua orang
  rationale: Pilihan utama mempertahankan keluasan dan diksi teologis khas Yohanes sekaligus dapat dipahami sebagai ranah publik dalam konteks ini.
- issue: Referen οἱ Ἰουδαῖοι
  choice: semua orang Yahudi
  alternative: semua orang Yudea
  rationale: Istilah ini bersifat peka konteks dalam Yohanes. Penyebutan sinagoge dan Bait Allah mendukung rujukan komunal yang luas, tetapi kemungkinan nuansa geografis dicatat tanpa mempersempit teks kepada para pemimpin Yahudi.
- issue: Sifat perkataan Yesus yang tidak rahasia
  choice: Aku tidak pernah mengatakan apa pun secara rahasia
  alternative: Aku tidak mengatakan apa pun secara rahasia
  rationale: Ungkapan ini menyatakan bahwa ajaran Yesus bukan ajaran rahasia. Terjemahan tidak dimaksudkan untuk menyangkal bahwa Yesus pernah berbicara kepada murid-murid dalam lingkungan terbatas, melainkan mempertahankan kontras teks antara pengajaran terbuka dan tersembunyi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina ‘Aku’ mengikuti gaya langsung perkataan Yesus. ‘Sinagoge’ dipilih sebagai istilah baku modern, sedangkan ‘kompleks Bait Allah’ memperjelas cakupan ἱερόν. Semua penanda catatan kaki dicantumkan dalam teks utama.
