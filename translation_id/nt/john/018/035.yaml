id: JHN.18.35
reference: John 18:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: id
  text: Pilatus menjawab, “Memangnya aku orang Yahudi[a]? Bangsamu sendiri dan para imam kepala telah menyerahkan engkau kepadaku. Apa yang telah kaulakukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea.” Istilah Yunani ini dapat menunjuk pada identitas etnis-keagamaan (“orang Yahudi”) atau identitas kewilayahan (“orang Yudea”), bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang lazim dan alami untuk memperkenalkan tanggapan Pilatus.
- source_word: Μήτι ἐγὼ Ἰουδαῖός εἰμι
  choice: Memangnya aku orang Yahudi?
  rationale: ‘Memangnya’ menyampaikan pertanyaan retoris yang mengharapkan jawaban negatif tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: Ἰουδαῖός
  choice: orang Yahudi
  rationale: Dalam konteks ini Pilatus membedakan identitas etnis-nasionalnya dari identitas Yesus dan para penuduhnya; ‘orang Yahudi’ merupakan padanan paling wajar, sementara kemungkinan regional dicatat dalam catatan kaki.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: bangsamu sendiri
  rationale: ‘Bangsa’ mempertahankan gagasan kolektif-politis ἔθνος, sedangkan ‘sendiri’ menegaskan unsur posesif dan nada pembandingan.
- source_word: οἱ ἀρχιερεῖς
  choice: para imam kepala
  rationale: Istilah Indonesia yang mapan untuk kelompok pemimpin keimaman Yerusalem dalam bentuk jamak.
- source_word: παρέδωκάν σε ἐμοί
  choice: telah menyerahkan engkau kepadaku
  rationale: ‘Menyerahkan’ mempertahankan nuansa penyerahan kepada penguasa tanpa memasukkan makna ‘mengkhianati’ yang lebih spesifik.
- source_word: τί ἐποίησας
  choice: Apa yang telah kaulakukan?
  rationale: Bentuk perfektif Indonesia menghubungkan tindakan yang sudah dilakukan dengan pemeriksaan hukum yang sedang berlangsung.
theological_decisions:
- issue: Cakupan makna Ἰουδαῖος dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Pertanyaan retoris Pilatus yang segera diikuti ‘bangsamu sendiri’ lebih mendukung identitas etnis-nasional daripada arti regional yang sempit. Namun, karena istilah Yunani dapat memiliki kedua cakupan tersebut, kemungkinan regional tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan dialog yang alami dan tetap bermartabat. ‘Memangnya’ dipilih untuk mempertahankan daya retoris μήτι; pronomina ‘aku–engkau’ mencerminkan dialog langsung tanpa meninggikan Pilatus atau merendahkan Yesus.
