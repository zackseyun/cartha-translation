  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: id
  text: Lalu Petrus kembali menyangkal[a], dan seketika itu juga ayam jantan berkokok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Lalu Petrus menyangkalnya lagi"; bahasa Yunani tidak menyatakan objeknya secara eksplisit, tetapi konteks mengaitkan penyangkalan itu dengan pertanyaan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Adverbia ini menyatakan pengulangan penyangkalan Petrus; “lagi” alami dan ringkas dalam konteks naratif.
- source_word: οὖν
  choice: Lalu
  rationale: Partikel ini menghubungkan jawaban Petrus dengan pertanyaan sebelumnya sekaligus meneruskan urutan cerita; “lalu” tidak melebih-lebihkan daya inferensialnya.
- source_word: ἠρνήσατο
  choice: menyangkalnya
  rationale: Verba ini berarti menyangkal; enklitik “-nya” secara wajar merujuk pada isi pertanyaan sebelumnya, meskipun objek tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: Πέτρος
  choice: Petrus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan penyangkalan Petrus dengan peristiwa berikutnya.
- source_word: εὐθέως
  choice: saat itu juga
  rationale: Ungkapan ini menyampaikan bahwa kokok ayam terjadi seketika setelah penyangkalan, dengan bahasa Indonesia yang alami.
- source_word: ἀλέκτωρ
  choice: ayam jantan
  rationale: Padanan modern dan jelas untuk ayam jantan dewasa.
- source_word: ἐφώνησεν
  choice: berkokok
  rationale: Walaupun verba Yunani secara umum berarti mengeluarkan suara atau berseru, ketika subjeknya ayam jantan, padanan idiomatis bahasa Indonesia ialah “berkokok”.
