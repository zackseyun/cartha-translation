source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: id
  text: Maka Yesus bertanya lagi kepada mereka, “Siapa yang kalian cari?” Mereka menjawab, “Yesus orang Nazaret[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus dari Nazaret”; Yunani: “Yesus, orang Nazaret itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Maka ... lagi
  rationale: πάλιν menyatakan pengulangan, sedangkan οὖν menghubungkan pertanyaan ini dengan kejadian sebelumnya. Susunan ini alami dalam narasi bahasa Indonesia.
- source_word: ἐπηρώτησεν αὐτούς
  choice: Yesus bertanya ... kepada mereka
  rationale: Kata kerja ini menyatakan tindakan mengajukan pertanyaan secara langsung. Subjek tersirat diperjelas sebagai Yesus dari konteks agar kalimat Indonesia tidak rancu.
- source_word: Τίνα ζητεῖτε
  choice: Siapa yang kalian cari?
  rationale: Τίνα adalah objek persona dari ζητεῖτε. Dalam bahasa Indonesia modern, 'Siapa yang kalian cari?' merupakan bentuk alami dan tetap tepat; 'kalian' sesuai dengan orang kedua jamak.
- source_word: οἱ δὲ εἶπαν
  choice: Mereka menjawab
  rationale: Dalam percakapan tanya-jawab, εἶπαν paling alami diterjemahkan 'menjawab'. δέ menandai kelanjutan narasi dan tidak perlu selalu dinyatakan dengan konjungsi tersendiri.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Yesus orang Nazaret
  rationale: Ναζωραῖος adalah sebutan yang mengidentifikasi Yesus berdasarkan kaitannya dengan Nazaret. 'Orang Nazaret' alami, ringkas, dan mempertahankan bentuk sebutan tersebut tanpa menambah tafsiran.
theological_decisions:
- issue: Makna sebutan Ναζωραῖος bagi Yesus
  choice: Yesus orang Nazaret
  alternative: Yesus dari Nazaret; Yesus orang Nazorean
  rationale: Sebutan ini terutama merupakan identifikasi geografis atau historis, bukan gelar doktrinal. 'Orang Nazaret' mempertahankan bentuk julukan Yunani sekaligus mudah dipahami pembaca Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog memakai 'kalian' untuk menandai orang kedua jamak secara alami. Nama Yesus sebagai subjek dinyatakan secara eksplisit berdasarkan konteks ayat sebelumnya.
