source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: id
  text: Yesus menjawabnya, “Jika yang Kukatakan salah, bersaksilah tentang kesalahan itu[a]. Namun, jika yang Kukatakan benar, mengapa engkau memukul Aku[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “bersaksilah mengenai apa yang salah” atau “berikanlah kesaksian tentang kesalahan itu.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “mengapa engkau menghantam Aku?” Kata kerja Yunani ini dapat berarti memukul secara umum dan, dalam konteks tertentu, memukuli atau mencambuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: menjawabnya
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa jawaban Yesus ditujukan kepada orang yang baru saja memukul-Nya.
- source_word: κακῶς ἐλάλησα
  choice: Aku berbicara salah
  rationale: Menjaga bentuk bersyarat dan pertentangan langsung dengan καλῶς, tanpa membatasi kesalahan itu hanya pada ketidakakuratan faktual atau kejahatan moral.
- source_word: μαρτύρησον
  choice: bersaksilah
  rationale: Bentuk imperatif ini mempertahankan nuansa kesaksian dalam konteks pemeriksaan atau pengadilan.
- source_word: περὶ τοῦ κακοῦ
  choice: tentang apa yang salah itu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rujukan kepada kesalahan yang dituduhkan dalam perkataan Yesus, tanpa mempersempitnya menjadi tindak pidana.
- source_word: εἰ δὲ καλῶς
  choice: Namun, jika Aku berbicara benar
  rationale: Kata 'benar' membentuk kontras yang jelas dengan 'salah' dan menyampaikan bahwa perkataan Yesus patut atau tepat, bukan sekadar disampaikan dengan baik.
- source_word: τί με δέρεις
  choice: mengapa engkau memukul Aku
  rationale: Kata kerja Yunani dapat menunjuk pada tindakan memukul secara luas; 'memukul' sesuai dengan konteks satu pukulan tanpa menentukan bahwa tindakan itu tamparan atau pemukulan berulang.
theological_decisions:
- issue: Sifat tanggapan Yesus terhadap kekerasan yang tidak beralasan
  choice: Diterjemahkan sebagai tantangan hukum dan moral yang menuntut kesaksian atas dugaan kesalahan.
  alternative: Memparafrasakan ucapan Yesus secara lebih konfrontatif sebagai kecaman eksplisit terhadap ketidakadilan, atau melunakkan nuansa pemeriksaannya.
  rationale: Teks Yunani mempertentangkan kesaksian yang semestinya diberikan jika ada kesalahan dengan pukulan yang diterima jika perkataan-Nya benar. Terjemahan mempertahankan logika ini tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipakai karena Yesus berbicara langsung kepada satu orang. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti gaya Alkitab Indonesia yang lazim tanpa menambah penafsiran pada isi ayat.
