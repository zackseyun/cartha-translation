  to: Maka Yesus, yang mengetahui segala sesuatu yang akan menimpa-Nya[a], keluar dan berkata kepada mereka, “Siapa yang kalian cari?”
  rationale: “Maju” diganti dengan “keluar” agar ἐξῆλθεν diterjemahkan secara langsung. “Karena itu” diganti dengan “Maka” sebagai penghubung naratif-logis yang lebih lazim dalam prosa Alkitab Indonesia. Catatan alternatif ditambahkan pada frasa yang menerjemahkan ἐρχόμενα untuk mencerminkan kemungkinan nuansa kedekatan peristiwa tanpa memaksakannya ke dalam teks utama.
