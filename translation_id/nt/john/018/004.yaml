review_pass:
  verdict: revise
  source_fidelity: Frasa “segala sesuatu yang akan menimpa-Nya” dengan tepat menyampaikan πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν, dan pertanyaan “Siapa yang kalian cari?” secara setia menerjemahkan Τίνα ζητεῖτε. Namun, ἐξῆλθεν secara dasar berarti “keluar/pergi keluar”; “maju” menggeser fokus dari gerak keluar yang dinyatakan teks Yunani.
  naturalness: Revisi “Maka Yesus ... keluar dan berkata kepada mereka” adalah bahasa Indonesia baku modern yang mengalir dan mempertahankan register naratif yang bermartabat. “Kalian” wajar untuk bentuk jamak dalam dialog ini.
  terminology: Nama Yesus dan penggunaan honorifik “-Nya” konsisten dengan kebiasaan Alkitab bahasa Indonesia. “Maka” menyampaikan οὖν secara alami sebagai kelanjutan naratif-logis tanpa memberi kesan kausal yang lebih kuat daripada yang diperlukan.
