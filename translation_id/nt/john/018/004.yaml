  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: id
  text: Maka Yesus, yang mengetahui segala sesuatu yang akan menimpa-Nya[a], keluar dan berkata kepada mereka, “Siapa yang kalian cari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang segera akan menimpa-Nya.”
    reason: Padanan alternatif untuk bentuk partisip ἐρχόμενα, yang dapat menonjolkan peristiwa yang sudah dekat.
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesinambungan naratif sekaligus hubungan logis dengan konteks sebelumnya; lebih kuat daripada sekadar “lalu” tanpa terasa tidak wajar.
- source_word: εἰδὼς
  choice: yang mengetahui
  rationale: Mengungkapkan kesadaran Yesus yang sudah ada dan utuh, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: segala sesuatu yang akan menimpa-Nya
  rationale: Mempertahankan cakupan πάντα dan sifat peristiwa yang segera datang. “Menimpa” secara alami menyampaikan bahwa peristiwa-peristiwa itu akan dialami Yesus tanpa merincinya melebihi teks Yunani.
- source_word: ἐξῆλθεν
  choice: maju
  rationale: Dalam konteks perjumpaan ini, “maju” secara alami menggambarkan Yesus keluar ke hadapan rombongan. Pilihan ini tidak menambahkan gerak dramatis seperti “melangkah maju” dan menghindari kesan bahwa lokasi asal-Nya harus berupa bangunan.
- source_word: λέγει
  choice: berkata
  rationale: Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang lazim.
- source_word: Τίνα
  choice: Siapa
  rationale: Kata tanya ini merupakan objek ζητεῖτε; bahasa Indonesia tidak membedakan bentuk subjek dan objek seperti Yunani.
- source_word: ζητεῖτε
  choice: yang kalian cari
  rationale: “Cari” adalah padanan alami dalam konteks mencari seseorang, sedangkan “kalian” memperjelas bentuk orang kedua jamak tanpa memakai ragam terlalu formal.
theological_decisions:
- issue: Pengetahuan Yesus sebelumnya tentang peristiwa yang akan dialami-Nya
  choice: Yesus mengetahui segala sesuatu yang akan menimpa-Nya.
  alternative: Yesus mengetahui semua yang sedang datang atas diri-Nya.
  rationale: Terjemahan mempertahankan keluasan pengetahuan Yesus dan sifat peristiwa yang akan datang tanpa mengembangkannya menjadi rumusan doktrinal yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Kata ganti hormat “-Nya” dipakai untuk Yesus sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Dialog memakai “kalian” karena lawan bicara berbentuk jamak dan ragam ini alami bagi pembaca modern.
