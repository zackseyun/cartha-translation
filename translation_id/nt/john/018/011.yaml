  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: id
  text: Maka Yesus berkata kepada Petrus, “Masukkan pedang itu ke dalam sarungnya.”[a] Tidakkah Aku akan meminum cawan yang telah Bapa berikan kepada-Ku?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sarungkan pedang itu.”'
    reason: lexical_alternative
  - marker: b
    text: “Cawan” adalah metafora alkitabiah bagi penderitaan atau bagian yang ditetapkan Allah; bandingkan doa Yesus di Getsemani (Mat. 26:39; Mrk. 14:36; Luk. 22:42).
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sekaligus konsekuensi dalam alur narasi secara alami dan tetap mempertahankan daya hubungnya.
- source_word: Βάλε τὴν μάχαιραν εἰς τὴν θήκην
  choice: Sarungkan pedangmu
  rationale: Ungkapan idiomatis Indonesia ini secara wajar menyampaikan perintah untuk memasukkan kembali pedang ke dalam sarungnya tanpa menghilangkan gambaran konkret.
- source_word: μάχαιραν
  choice: pedang
  rationale: Istilah umum yang jelas untuk senjata berbilah dalam adegan penangkapan ini; pilihan yang lebih khusus seperti belati akan terlalu mempersempit arti.
- source_word: θήκην
  choice: sarung
  rationale: Padanan alami bagi wadah pedang dalam bahasa Indonesia; maknanya terwakili dalam verba 'sarungkan'.
- source_word: τὸ ποτήριον
  choice: cawan
  rationale: Mempertahankan metafora alkitabiah bagi penderitaan atau bagian yang ditetapkan, tanpa mempersempitnya menjadi murka, kematian, atau penyaliban.
- source_word: δέδωκέν
  choice: telah diberikan
  rationale: Mencerminkan tindakan yang sudah selesai dengan relevansi yang tetap berlaku, sesuai aspek perfektum Yunani.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Mempertahankan idiom Yohanes dan bobot relasional-teologisnya tanpa menambahkan kata 'Bapa-Ku' yang tidak eksplisit dalam teks Yunani.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Bukankah Aku harus minum dari cawan
  rationale: Pertanyaan retoris ini mengharapkan jawaban positif dan menyatakan ketetapan Yesus untuk menjalaninya; bentuk 'Bukankah ... harus' alami dalam bahasa Indonesia. 'Minum dari cawan' juga merupakan kolokasi Indonesia yang lebih wajar daripada 'minum cawan'.
theological_decisions:
- issue: Makna 'cawan'
  choice: Mempertahankan 'cawan' sebagai metafora bagi penderitaan dan bagian yang ditetapkan Bapa, tanpa menguraikannya dalam teks utama.
  alternative: penderitaan yang ditetapkan bagi Yesus; nasib yang diberikan Bapa; cawan murka ilahi
  rationale: Konteks mendukung gagasan penderitaan yang ditetapkan, tetapi ayat ini tidak secara eksplisit membatasinya pada satu rumusan doktrinal tertentu. Metafora mempertahankan keluasan dan ketegangan teologis teks.
- issue: Hubungan Yesus dengan Bapa dalam frasa 'yang telah diberikan Bapa kepada-Ku'
  choice: Menyatakan secara langsung ketaatan sukarela Yesus kepada Bapa tanpa tambahan penjelasan doktrinal.
  alternative: yang ditugaskan Bapa-Ku kepada-Ku; yang diserahkan Bapa kepada-Ku
  rationale: Terjemahan lugas mengikuti teks, menjaga martabat Yesus, dan tidak menambahkan kata ganti kepunyaan atau penafsiran yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sarungkan pedangmu' dipilih karena ringkas dan alami; kapitalisasi Aku/-Ku dan Bapa mengikuti konvensi umum teks Alkitab bahasa Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
