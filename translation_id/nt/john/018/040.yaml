base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: id
  text: Lalu mereka berteriak lagi, “Bukan orang ini, melainkan Barabas!” Adapun Barabas adalah seorang perampok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyamun”; istilah Yunani ini dapat merujuk kepada perampok, penyamun, atau, dalam konteks tertentu, pemberontak bersenjata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: mereka berteriak
  rationale: Kata kerja ini menyatakan seruan dengan suara keras; “berteriak” alami dalam bahasa Indonesia modern dan mempertahankan kekuatannya.
- source_word: οὖν
  choice: Lalu
  rationale: Partikel ini menghubungkan respons orang banyak dengan percakapan sebelumnya; “lalu” menyampaikan kelanjutan alur secara alami tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: πάλιν
  choice: lagi
  rationale: Kata ini secara langsung menunjukkan pengulangan.
- source_word: λέγοντες
  choice: dinyatakan melalui tanda petik langsung setelah “berteriak”
  rationale: Dalam bahasa Indonesia, menambahkan “dengan berkata” setelah “berteriak” terasa kaku dan berlebihan. Kutipan langsung sudah menyampaikan fungsi partisip ini.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Bukan orang ini, melainkan Barabas
  rationale: “Orang ini” mempertahankan daya tunjuk τοῦτον, sedangkan “melainkan” menyampaikan pertentangan ἀλλά dengan jelas.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Barabas
  rationale: Nama ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: ἦν δὲ
  choice: Adapun ... adalah
  rationale: δέ memperkenalkan keterangan latar tentang Barabas; “adapun” menandai peralihan penjelasan itu secara wajar.
- source_word: λῃστής
  choice: perampok
  rationale: “Perampok” menyampaikan makna dasar orang yang merampas dengan kekerasan. Kemungkinan nuansa penyamun atau pemberontak bersenjata dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Nuansa λῃστής dalam penggambaran Barabas
  choice: perampok
  alternative: penyamun; perampok bersenjata; dalam konteks tertentu, pemberontak bersenjata
  rationale: Ayat ini sendiri menyebut Barabas dengan istilah yang makna dasarnya ialah perampok atau penyamun. Dalam lingkungan sejarah tertentu istilah tersebut dapat mencakup pelaku pemberontakan dengan kekerasan, tetapi ayat ini tidak mengharuskan makna yang lebih khusus itu. Karena itu, teks utama memakai padanan umum dan catatan kaki mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan pertentangan dalam seruan dipertahankan secara tegas. Penanda catatan kaki ditempatkan pada “perampok”, yaitu kata yang diterangkannya.
