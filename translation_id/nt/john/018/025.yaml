  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: id
  text: Simon Petrus sedang berdiri sambil menghangatkan diri. Mereka lalu berkata kepadanya[a], “Kamu juga bukan salah seorang murid-Nya, bukan?” Ia menyangkalnya dan berkata, “Bukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pertanyaan Yunani dengan μή mengharapkan jawaban negatif; dapat juga diterjemahkan, “Tentunya kamu juga bukan salah seorang murid-Nya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: sedang
  rationale: δέ merupakan penghubung naratif ringan yang tidak perlu ditampilkan sebagai pertentangan tersendiri; bentuk ἦν bersama kedua partisip menerangkan keadaan yang sedang berlangsung.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: berdiri sambil menghangatkan diri
  rationale: Partisip pertama menyatakan posisi Petrus yang berlanjut, sedangkan partisip kedua menyatakan tindakan serentak. Ungkapan 'di dekat api' tidak ditambahkan karena tidak eksplisit dalam ayat ini.
- source_word: εἶπον οὖν αὐτῷ
  choice: Karena itu, mereka berkata kepadanya
  rationale: Bentuk jamak εἶπον diterjemahkan dengan subjek 'mereka', sedangkan οὖν mempertahankan kaitan konsekuensial dengan adegan sebelumnya.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Kamu juga bukan ... bukan?
  rationale: Susunan ini mempertahankan καὶ σὺ ('kamu juga') dan kecenderungan pertanyaan dengan μή untuk mengharapkan jawaban negatif.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: salah seorang murid-Nya
  rationale: ἐκ dengan genitif menyatakan keanggotaan dalam suatu kelompok; bentuk ini merupakan padanan Indonesia yang alami.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Ia menyangkalnya
  rationale: Kata ganti objek merujuk pada tuduhan tersirat dalam pertanyaan, tanpa memperluas penyangkalan itu secara teologis.
- source_word: Οὐκ εἰμί
  choice: Bukan
  rationale: Dalam bahasa Indonesia, jawaban eliptis 'Bukan' secara ringkas dan alami menyangkal bahwa Petrus termasuk kelompok murid yang disebutkan.
theological_decisions:
- issue: Cakupan penyangkalan Petrus
  choice: Penyangkalan ditampilkan sebagai penolakan bahwa ia adalah salah seorang murid Yesus.
  alternative: Memperluasnya menjadi 'Aku bukan pengikut-Nya' atau penyangkalan doktrinal yang lebih umum.
  rationale: Teks Yunani singkat dan eliptis, dengan jawaban yang menggemakan predikat dalam pertanyaan. Terjemahan tidak memperluas cakupan penyangkalan melampaui pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Ia' dipakai untuk Petrus, sedangkan '-Nya' mempertahankan rujukan hormat kepada Yesus. Formulasi pertanyaan sengaja mempertahankan harapan akan jawaban negatif tanpa menghilangkan keluwesan bahasa Indonesia.
