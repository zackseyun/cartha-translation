id: JHN.18.33
reference: John 18:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: id
  text: Lalu Pilatus masuk kembali ke markas gubernur[a], memanggil Yesus, dan berkata kepada-Nya, “Apakah Engkau Raja orang Yahudi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “praetorium,” yaitu kediaman atau markas resmi gubernur Romawi.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Yudea.” Istilah Yunani yang dipakai dapat merujuk kepada orang Yahudi secara umum atau, dalam konteks tertentu, kepada penduduk Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν οὖν πάλιν
  choice: Lalu ... masuk kembali
  rationale: Gabungan ini menandai kelanjutan narasi sekaligus gerak kembali ke tempat yang sebelumnya ditinggalkan. 'Lalu ... masuk kembali' alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: πραιτώριον
  choice: markas gubernur
  rationale: Istilah ini menunjuk pada kediaman atau markas resmi gubernur Romawi. 'Markas gubernur' jelas bagi pembaca modern tanpa memakai transliterasi yang kurang dikenal.
- source_word: ἐφώνησεν
  choice: memanggil
  rationale: Dalam konteks ini kata tersebut berarti memanggil seseorang agar datang atau menghadap. 'Memanggil' tepat dan tidak memperkuat makna menjadi 'memerintahkan menghadap'.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Terjemahan ini mengikuti verba umum 'berkata' dalam sumber, sementara bentuk kutipannya sendiri menyatakan pertanyaan.
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: Apakah Engkau Raja
  rationale: Bentuk tanya Indonesia ini alami. Pronomina eksplisit σύ dipertahankan sebagai 'Engkau', dan 'Raja' diperlakukan sebagai gelar dalam pertanyaan langsung.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam dakwaan politik di hadapan Pilatus, ungkapan baku dan kontekstualnya ialah 'Raja orang Yahudi'. Kemungkinan arti geografis 'orang Yudea' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna Ἰουδαίων dalam gelar kerajaan
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Konteks pengadilan Romawi mendukung ungkapan 'Raja orang Yahudi' sebagai dakwaan politik terhadap Yesus. Namun, karena istilah Yunani tersebut dapat memiliki nuansa geografis dalam konteks tertentu, alternatif itu tidak dihapus dan dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Engkau' dipakai dalam tuturan langsung kepada Yesus sesuai register Alkitab Indonesia yang tetap mudah dipahami; struktur narasinya dibuat alami tanpa menghilangkan urutan tindakan dalam teks Yunani.
