revisions:
- from: Para hamba dan para petugas berdiri di sana dekat api arang yang telah mereka nyalakan karena udara dingin, dan mereka sedang menghangatkan diri. Petrus juga berdiri bersama mereka dan menghangatkan diri.
  to: Para budak dan para petugas sedang berdiri di sana; mereka telah menyalakan api arang karena udara dingin dan sedang menghangatkan diri. Petrus juga sedang berdiri bersama mereka dan menghangatkan diri.
  rationale: Revisi mengganti “hamba” dengan “budak” untuk mempertahankan makna δοῦλοι yang lebih spesifik, serta menghapus “dekat” agar tidak menambahkan keterangan lokasi. Bentuk progresif “sedang berdiri” dan “sedang menghangatkan diri” menyampaikan keadaan/tindakan yang berlangsung, sementara “telah menyalakan” mencerminkan tindakan yang sudah dilakukan sebelum keadaan yang digambarkan.
