base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: id
  text: Para budak dan para petugas sedang berdiri di sana; mereka telah menyalakan api arang karena udara dingin dan sedang menghangatkan diri. Petrus juga sedang berdiri bersama mereka dan menghangatkan diri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: para hamba
  rationale: Dalam lingkungan rumah Imam Besar, istilah ini menunjuk pada anggota rumah tangga yang berada dalam status pengabdian. 'Hamba' merupakan padanan Indonesia yang alami dan cukup luas tanpa menghapus kemungkinan status terikat yang tersirat dalam konteks.
- source_word: ὑπηρέται
  choice: para petugas
  rationale: Dalam Injil Yohanes istilah ini sering menunjuk pada pelayan resmi yang menjalankan tugas kelembagaan, termasuk penangkapan atau penjagaan. 'Petugas' mempertahankan sifat resmi itu tanpa mempersempitnya menjadi 'penjaga'.
- source_word: ἀνθρακιὰν
  choice: api arang
  rationale: Istilah ini secara khusus berarti api dari arang. Padanan ini alami dalam bahasa Indonesia dan mempertahankan detail naratif yang muncul kembali dalam Yohanes 21:9.
- source_word: πεποιηκότες
  choice: yang telah mereka nyalakan
  rationale: Partisip perfek menyatakan tindakan yang telah selesai dengan hasil yang masih ada. Dalam bahasa Indonesia, api lebih alami dikatakan 'dinyalakan' daripada 'dibuat', sementara 'telah' mempertahankan hasil kini dari tindakan terdahulu.
- source_word: ὅτι ψῦχος ἦν
  choice: karena udara dingin
  rationale: ὅτι bersifat kausal. Ungkapan 'udara dingin' merupakan bahasa Indonesia alami bagi keadaan cuaca tanpa menambahkan pelaku.
- source_word: ἐθερμαίνοντο
  choice: mereka sedang menghangatkan diri
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung; 'sedang' menyatakan aspek duratif dan bentuk refleksif dipertahankan.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Petrus juga berdiri bersama mereka
  rationale: καί dipertahankan sebagai 'juga', μετ’ αὐτῶν sebagai 'bersama mereka', dan konstruksi perifrastik menyatakan keadaan Petrus yang sedang berdiri. δέ tidak perlu diberi padanan tersendiri karena hubungan wacananya tetap jelas dalam bahasa Indonesia.
- source_word: θερμαινόμενος
  choice: menghangatkan diri
  rationale: Partisip kini menggambarkan tindakan Petrus yang berlangsung dan sejajar dengan tindakan kelompok tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan 'menghangatkan diri' dipertahankan untuk mencerminkan kesejajaran yang disengaja dalam teks Yunani. Frasa 'di sana dekat api arang' menyampaikan bahwa mereka berdiri pada lokasi api; 'dekat' merupakan pengungkapan idiomatis dari keadaan yang tersirat oleh tindakan menghangatkan diri, bukan tambahan teologis.
