review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama pada δοῦλοι. Dalam konteks ini istilah tersebut menunjuk pada orang-orang berstatus terikat; “hamba” dalam bahasa Indonesia modern terlalu luas dan dapat dibaca sebagai pelayan umum atau, dalam register keagamaan, sebagai sebutan hormat. “Budak” lebih jelas mempertahankan status sosial yang ditandai teks. Revisi juga menghindari penambahan eksplisit “dekat” yang tidak dinyatakan dalam teks Yunani.
  naturalness: Teks hasil revisi tetap baku dan alami. Pemisahan dengan titik koma membuat hubungan partisipial (“setelah menyalakan”) dan tindakan yang berlangsung (“sedang menghangatkan diri”) mudah diikuti tanpa menambah informasi lokasi.
  terminology: “Budak” untuk δοῦλοι selaras dengan status terikat yang kemungkinan dimaksud, “petugas” merupakan padanan yang baik untuk ὑπηρέται, dan “api arang” tepat untuk ἀνθρακιά. Pengulangan “menghangatkan diri” dipertahankan sebagaimana paralelisme dalam Yunani.
  issues:
  - severity: medium
    issue: “Para hamba” untuk δοῦλοι terlalu umum.
    rationale: δοῦλοι secara leksikal berarti budak/orang dalam perhambaan. “Hamba” tidak dengan cukup jelas menyampaikan status tersebut dalam pemakaian Indonesia modern.
  - severity: low
    issue: “dekat api arang” menambahkan relasi lokasi yang tidak dinyatakan secara eksplisit.
    rationale: Mereka tentu menghangatkan diri pada api itu menurut konteks, tetapi teks hanya menyatakan bahwa mereka berdiri di sana, telah menyalakan api arang, dan menghangatkan diri. Tambahan ini tidak diperlukan demi kelancaran bahasa Indonesia.
  revised_text: Para budak dan para petugas sedang berdiri di sana; mereka telah menyalakan api arang karena udara dingin dan sedang menghangatkan diri. Petrus juga sedang berdiri bersama mereka dan menghangatkan diri.
