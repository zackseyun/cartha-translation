id: JHN.18.26
reference: John 18:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: id
  text: Salah seorang budak imam besar[a], yang merupakan kerabat orang yang telinganya dipotong Petrus, berkata, “Bukankah aku melihatmu di taman bersama dia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan.” Kata Yunani doulos dapat berarti budak atau pelayan, bergantung pada konteks; di sini “budak” dipakai untuk mempertahankan status terikat yang tersirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: budak
  rationale: Kata ini menunjuk pada anggota rumah tangga imam besar yang berstatus terikat, bukan sekadar pelayan biasa. “Budak” mempertahankan kenyataan sosial tersebut, sedangkan alternatif “pelayan” dicatat dalam catatan kaki.
- source_word: ἀρχιερέως
  choice: imam besar
  rationale: Padanan baku dan jelas untuk jabatan imam tertinggi dalam konteks kisah sengsara Yesus.
- source_word: συγγενὴς ὢν
  choice: yang merupakan kerabat
  rationale: Mengungkapkan frasa partisipial dan hubungan keluarga secara alami tanpa menentukan jenis kekerabatannya.
- source_word: οὗ
  choice: orang yang telinganya
  rationale: Rujukan pronomina relatif dibuat eksplisit agar hubungan antara kerabat itu dan orang yang terluka jelas dalam bahasa Indonesia.
- source_word: ἀπέκοψεν
  choice: dipotong Petrus
  rationale: Bentuk pasif alami dalam bahasa Indonesia mempertahankan Petrus sebagai pelaku dan menyatakan bahwa telinga itu terpotong, sesuai tindakan yang sudah terjadi sebelumnya.
- source_word: ὠτίον
  choice: telinga
  rationale: Padanan langsung dan wajar; nuansa bentuk diminutif tidak perlu dinyatakan karena tidak bermakna khusus dalam konteks ini.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Bukankah aku melihatmu
  rationale: Pertanyaan dengan οὐκ mengharapkan jawaban positif. Bentuk “Bukankah” menyampaikan daya retoris itu secara alami, sementara “aku” tetap hadir untuk mencerminkan subjek eksplisit ἐγώ.
- source_word: ἐν τῷ κήπῳ
  choice: di taman
  rationale: Padanan lazim untuk κῆπος dalam konteks tempat Yesus ditangkap.
- source_word: μετ’ αὐτοῦ
  choice: bersama dia
  rationale: Padanan langsung yang merujuk kepada Yesus; huruf kecil mengikuti kaidah umum bahasa Indonesia tanpa menambahkan penafsiran teologis melalui kapitalisasi pronomina.
theological_decisions:
- issue: Pemadanan δοῦλος dalam konteks rumah tangga yang nonmetaforis
  choice: budak
  alternative: pelayan
  rationale: Konteks menunjuk pada personel rumah tangga yang berada dalam status perbudakan. “Budak” tidak melunakkan status sosial yang tersirat dalam istilah Yunani, sedangkan “pelayan” tetap dicatat sebagai kemungkinan pemadanan kontekstual.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan “yang merupakan kerabat” mempertahankan nilai frasa partisipial Yunani tanpa terasa kaku. Pronomina “dia” ditulis dengan huruf kecil sesuai ejaan umum dan untuk menghindari penambahan konvensi teologis yang tidak ditandai dalam teks Yunani.
