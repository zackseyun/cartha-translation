  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: id
  text: Maka pasukan itu, komandan, dan para petugas orang Yahudi[a] menangkap Yesus dan mengikat-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi” atau “orang Yudea”, bergantung pada konteks. Dalam Injil Yohanes, sebutan “orang Yahudi” sering digunakan dengan arti yang lebih khusus daripada seluruh bangsa Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kemudian
  rationale: Menandai kelanjutan narasi dan akibat dari peristiwa sebelumnya; “kemudian” alami dalam narasi Indonesia tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: σπεῖρα
  choice: pasukan
  rationale: Istilah ini menunjuk pada satuan militer, sering kali kohor. “Pasukan” mudah dipahami dan mempertahankan arti militernya tanpa memastikan bahwa seluruh kohor hadir.
- source_word: χιλίαρχος
  choice: komandan
  rationale: Menunjuk kepada perwira yang memimpin satuan tersebut. “Komandan” jelas bagi pembaca modern, sedangkan istilah historis seperti “tribun” kurang umum.
- source_word: ὑπηρέται
  choice: para petugas
  rationale: Dalam konteks Yohanes, kata ini menunjuk kepada petugas resmi yang menjalankan penangkapan, bukan pelayan rumah tangga; pilihan ini tidak mempersempitnya menjadi polisi Bait Allah.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Menerjemahkan frasa genitif secara transparan. Dalam Injil Yohanes ungkapan ini kadang menunjuk lebih khusus kepada para pemimpin Yahudi atau orang Yudea, sehingga cakupan kontekstualnya dijelaskan dalam catatan kaki.
- source_word: συνέλαβον
  choice: menangkap
  rationale: Menyampaikan tindakan mencengkeram dan membawa ke dalam tahanan secara alami dalam bahasa Indonesia; konteks penangkapan tetap jelas.
- source_word: ἔδησαν
  choice: mengikat
  rationale: Padanan langsung dan wajar bagi tindakan membelenggu atau mengikat Yesus.
theological_decisions:
- issue: Cakupan sebutan τῶν Ἰουδαίων dalam Injil Yohanes
  choice: “orang Yahudi” dipertahankan dalam teks utama dengan catatan kaki.
  alternative: “para pemimpin Yahudi” atau “orang Yudea”
  rationale: Bahasa Yunani tidak secara eksplisit menyebut para pemimpin dalam ayat ini. Terjemahan utama mempertahankan bentuk sumber, sementara catatan mencegah ungkapan itu dipahami sebagai tuduhan terhadap seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah teknis militer yang kurang dikenal dihindari dalam teks utama, sementara ambiguitas penting pada sebutan “orang Yahudi” dipertahankan dan dijelaskan.
