id: JHN.18.16
reference: John 18:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: id
  text: Namun, Petrus sedang berdiri di luar, dekat pintu. Maka murid yang lain itu, yang dikenal oleh imam besar[a], keluar dan berbicara kepada perempuan penjaga pintu[b], lalu membawa Petrus masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang merupakan kenalan imam besar.” Bahasa Yunani tidak menjelaskan seberapa dekat hubungan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “perempuan penjaga gerbang.” Istilah Yunani menunjuk kepada orang yang ditempatkan untuk menjaga jalan masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: sedang berdiri
  rationale: Bentuk ini menggambarkan keadaan Petrus yang sedang berlangsung; frasa Indonesia ini menyampaikan aspek tersebut secara alami tanpa menambahkan durasi tertentu.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: di luar, dekat pintu
  rationale: Terjemahan ini mempertahankan baik lokasi di luar maupun kedekatan dengan pintu masuk; tanda koma membantu kejelasan dalam bahasa Indonesia.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: murid yang lain itu
  rationale: Dalam narasi Injil, μαθητής secara wajar diterjemahkan 'murid'; kata 'itu' mencerminkan ketertentuan frasa Yunani dan merujuk kembali kepada murid yang sudah disebut.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: yang dikenal oleh imam besar
  rationale: γνωστός menyatakan bahwa murid itu dikenal oleh imam besar, tetapi tidak menentukan seberapa dekat hubungan mereka; rumusan ini mempertahankan ketidakjelasan tersebut.
- source_word: ἀρχιερεύς
  choice: imam besar
  rationale: Ini adalah padanan baku dan tepat bagi jabatan keagamaan Yahudi dalam konteks ini.
- source_word: θυρωρῷ
  choice: perempuan penjaga pintu
  rationale: Istilah itu menunjuk kepada orang yang menjaga pintu masuk, sedangkan bentuk artikelnya menunjukkan bahwa orang tersebut perempuan. Terjemahan ini mempertahankan kedua informasi itu.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: berbicara kepada perempuan penjaga pintu
  rationale: Karena isi perkataannya tidak dikutip, 'berbicara kepada' lebih alami daripada 'berkata kepada' dalam bahasa Indonesia.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: membawa Petrus masuk
  rationale: εἰσάγω berarti membawa atau mengantar masuk; pilihan ini alami dan tidak menyiratkan rincian tindakan yang tidak dinyatakan teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan kalimat mempertahankan alur tindakan teks Yunani, sedangkan pilihan 'dikenal oleh' sengaja tidak menentukan tingkat kedekatan hubungan murid itu dengan imam besar.
