  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: id
  text: Mereka menjawab-Nya, “Yesus orang Nazaret.” Ia berkata kepada mereka, “Akulah Dia.” Yudas, yang menyerahkan-Nya, juga berdiri bersama mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Yesus orang Nazaret
  rationale: Ungkapan ini secara alami mengidentifikasi Yesus berdasarkan asal-Nya; ‘orang Nazaret’ jelas dan lazim dalam bahasa Indonesia modern.
- source_word: Ἐγώ εἰμι
  choice: Akulah Dia
  rationale: Dalam konteks jawaban atas orang yang sedang dicari, frasa ini berarti pengakuan identitas, ‘Akulah orangnya/Dia’. ‘Akulah Dia’ tetap ringkas dan mempertahankan bentuk ungkapan Yohanes tanpa menjadikannya kalimat yang janggal dalam bahasa Indonesia.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: yang mengkhianati-Nya
  rationale: Partisipel kini menggambarkan Yudas dalam tindakan penyerahan yang bersifat pengkhianatan; pilihan ini alami dan sesuai konteks naratif.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: berdiri bersama mereka
  rationale: Mempertahankan gambaran posisi Yudas yang secara nyata berada di pihak rombongan yang datang menangkap Yesus.
theological_decisions:
- issue: Kemungkinan gema teologis dalam Ἐγώ εἰμι
  choice: Akulah Dia
  alternative: Aku ada / Akulah Aku
  rationale: Konteks langsung menuntut jawaban identifikasi terhadap pencarian ‘Yesus orang Nazaret’. Terjemahan ini tidak memaksakan pembacaan sebagai nama ilahi, tetapi bentuk yang ringkas masih memungkinkan pembaca menangkap gema khas ungkapan tersebut dalam Injil Yohanes.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina untuk Yesus menggunakan bentuk hormat ‘Dia/-Nya’; dialog dibuat ringkas sesuai ketegangan adegan.
