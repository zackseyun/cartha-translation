revisions:
- from: Mereka menjawab Dia, “Yesus orang Nazaret.” Kata Yesus kepada mereka, “Akulah Dia.” Yudas, yang mengkhianati-Nya, juga berdiri bersama mereka.
  to: Mereka menjawab-Nya, “Yesus orang Nazaret.” Ia berkata kepada mereka, “Akulah Dia.” Yudas, yang menyerahkan-Nya, juga berdiri bersama mereka.
  rationale: The revision corrects the Indonesian object construction, keeps the concise dialogue and identification sense of ἐγώ εἰμι, and renders παραδιδοὺς more directly as “menyerahkan-Nya.” No footnote is necessary because the contextual identification sense is clear and the translation does not resolve a disputed textual reading.
