  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: id
  text: Sesudah mengatakan semuanya itu, Yesus pergi bersama murid-murid-Nya ke seberang aliran Kidron[a]. Di sana ada sebuah taman, lalu Yesus dan murid-murid-Nya masuk ke dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wadi Kidron,” “lembah Kidron,” atau “sungai Kidron.” Istilah Yunani menunjuk pada alur air yang dapat mengalir secara musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Sesudah mengatakan semuanya itu
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: ἐξῆλθεν
  choice: pergi
  rationale: Dalam konteks ini verba tersebut menggambarkan Yesus keluar lalu bergerak bersama para murid. 'Pergi' lebih alami daripada 'keluar' tanpa keterangan tempat asal yang dinyatakan dalam ayat ini.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: bersama murid-murid-Nya
  rationale: Menyampaikan makna penyertaan dari σύν secara ringkas dan wajar.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: ke seberang aliran Kidron
  rationale: πέραν menunjukkan tujuan di sisi seberang, sedangkan χείμαρρος adalah alur air yang dapat bersifat musiman. 'Aliran' cukup alami dan tidak mengunci maknanya menjadi sungai permanen atau lembah semata.
- source_word: ὅπου ἦν κῆπος
  choice: Di sana ada sebuah taman
  rationale: Mempertahankan makna keberadaan secara jelas sambil membagi kalimat Yunani yang panjang agar mudah dipahami pembaca Indonesia.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: masuk ke dalamnya
  rationale: Menyatakan arah gerak yang terkandung dalam εἰς dan verba εἰσέρχομαι secara alami.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Yesus dan murid-murid-Nya
  rationale: Nama 'Yesus' diulang untuk menjernihkan subjek setelah kalimat dibagi, tanpa menambahkan penekanan refleksif yang tidak diperlukan.
