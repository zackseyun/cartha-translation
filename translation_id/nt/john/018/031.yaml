revisions:
- from: Karena itu, Pilatus berkata kepada mereka[a], “Bawalah dia dan hakimilah dia menurut hukum kalian sendiri.” Para pemimpin Yahudi berkata kepadanya, “Kami tidak diperbolehkan menghukum mati siapa pun.”
  to: Karena itu, Pilatus berkata kepada mereka, “Kalian sendiri, ambillah dia dan adili dia menurut hukum kalian.” Orang-orang Yahudi[a] berkata kepadanya, “Kami tidak diperbolehkan menghukum mati siapa pun.”
  rationale: Revisi memindahkan penekanan “sendiri” ke subjek yang sesuai dengan ὑμεῖς, memakai “adili” sebagai istilah yudisial Indonesia yang lebih alami, mempertahankan “menghukum mati” bagi ἀποκτεῖναι dalam konteks ini, serta memindahkan penanda catatan kaki ke “Orang-orang Yahudi”. Pemakaian bentuk harfiah di teks utama bersama penjelasan kontekstual pada catatan kaki lebih baik mempertahankan ungkapan sumber sekaligus mencegah pembacaan yang menggeneralisasi.
