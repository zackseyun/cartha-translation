    rationale: Catatan kaki menjelaskan οἱ Ἰουδαῖοι, yang diterjemahkan kemudian sebagai “Para pemimpin Yahudi” dalam draft. Jangkar harus ditempatkan pada rujukan tersebut agar pembaca tidak mengira catatan itu menjelaskan “mereka”.
  - severity: low
    issue: “Hakimilah” kurang idiomatis sebagai istilah prosedural hukum modern.
    rationale: “Adili” adalah padanan Indonesia baku yang lebih alami untuk perintah dalam konteks pengadilan, tanpa mengubah lingkup legal κρίνω di sini.
