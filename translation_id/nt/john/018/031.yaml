  naturalness: Bahasa draft umumnya baku dan jelas. Namun, “Bawalah dia ... menurut hukum kalian sendiri” membuat “sendiri” secara sintaktis lebih mudah dibaca sebagai pembatas bagi “hukum”, bukan sebagai penekanan pada pihak yang harus mengambil dan mengadili Yesus. Susunan revisi menghilangkan ketaksaan ini.
  terminology: “Pilatus”, “hukum”, dan “menghukum mati” sesuai register naratif-yudisial. “Orang-orang Yahudi” mempertahankan ungkapan Yunani οἱ Ἰουδαῖοι dalam teks, sementara catatan kaki menjelaskan bahwa dalam adegan ini yang berbicara adalah kelompok pemimpin atau pendakwa, bukan seluruh orang Yahudi.
