    rationale: Dalam “menurut hukum kalian sendiri”, kata “sendiri” terutama memodifikasi “hukum kalian”. Padahal ὑμεῖς menekankan bahwa merekalah yang harus mengambil dan mengadili dia. “Kalian sendiri, ambillah dia” menyampaikan fungsi ini dengan jelas.
  - severity: medium
