  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: id
  text: Karena itu, Pilatus berkata kepada mereka, “Kalian sendiri, ambillah dia dan adili dia menurut hukum kalian.” Orang-orang Yahudi[a] berkata kepadanya, “Kami tidak diperbolehkan menghukum mati siapa pun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang Yahudi” (hoi Ioudaioi). Dalam konteks ini, ungkapan tersebut merujuk pada kelompok pemimpin atau pendakwa Yahudi yang berbicara dengan Pilatus, bukan orang Yahudi secara keseluruhan.
    reason: Menjelaskan referen kontekstual οἱ Ἰουδαῖοι tanpa menghapus bentuk ungkapan Yunani dari teks utama atau menggeneralisasikannya kepada seluruh orang Yahudi.
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai alur inferensial dari percakapan sebelumnya secara alami dan tetap dekat dengan fungsi penghubung Yunani.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Bawalah dia ... kalian sendiri
  rationale: Imperatif Λάβετε diterjemahkan secara wajar sebagai “Bawalah,” sedangkan pronomina eksplisit ὑμεῖς tercermin melalui “kalian sendiri” untuk mempertahankan penekanan pada pihak yang harus bertindak.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: menurut hukum kalian sendiri
  rationale: κατά dengan akusatif menunjukkan tolok ukur atau kesesuaian; “menurut” tepat dan alami. Kata “sendiri” turut menyampaikan penekanan serta jarak Pilatus terhadap hukum mereka.
- source_word: κρίνατε
  choice: hakimilah
  rationale: Mempertahankan arti luas κρίνω dalam konteks hukum tanpa mempersempitnya menjadi sekadar mengadili dalam bentuk persidangan tertentu.
- source_word: οἱ Ἰουδαῖοι
  choice: Para pemimpin Yahudi
  rationale: Dalam konteks langsung, ungkapan ini menunjuk kelompok otoritas atau pendakwa Yahudi yang sedang berbicara dengan Pilatus, bukan seluruh orang Yahudi. Pilihan kontekstual ini mencegah generalisasi yang menyesatkan.
- source_word: οὐκ ἔξεστιν
  choice: tidak diperbolehkan
  rationale: Menyampaikan ketiadaan izin atau kewenangan hukum dalam bahasa Indonesia modern; tidak menentukan secara berlebihan sumber larangan itu.
- source_word: ἀποκτεῖναι οὐδένα
  choice: menghukum mati siapa pun
  rationale: Dalam percakapan yudisial dengan Pilatus, “menghukum mati” menangkap daya eksekutorial konteksnya, sementara “siapa pun” mempertahankan cakupan οὐδένα.
theological_decisions:
- issue: Referen οἱ Ἰουδαῖοι dalam kisah sengsara Yohanes
  choice: Para pemimpin Yahudi
  alternative: Orang-orang Yahudi; orang-orang Yudea
  rationale: Konteks naratif membatasi referen pada para penguasa atau pendakwa yang hadir di hadapan Pilatus. Terjemahan kontekstual menghindari kesan bahwa seluruh bangsa Yahudi mengucapkan pernyataan tersebut, sementara catatan kaki menyajikan bentuk harfiah Yunani.
- issue: Dasar ketidakbolehan menjatuhkan hukuman mati
  choice: Kami tidak diperbolehkan
  alternative: Kami tidak berhak; menurut hukum kami tidak diperbolehkan
  rationale: Teks Yunani menyatakan bahwa tindakan itu tidak diperbolehkan, tetapi tidak secara eksplisit menyebut apakah batasan tersebut terutama berasal dari hukum Romawi, keadaan administratif, atau alasan lain. Terjemahan mempertahankan ketidakpastian itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena Pilatus berbicara kepada sekelompok orang, sedangkan “hakimilah” mempertahankan nuansa yudisial. Penanda catatan kaki ditempatkan sesudah referen pronominal agar pembaca memperoleh penjelasan tentang identitas kelompok tersebut.
