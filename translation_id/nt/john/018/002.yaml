id: JHN.18.2
reference: John 18:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: id
  text: Yudas, yang mengkhianati Dia[a], juga mengetahui tempat itu, karena Yesus sudah sering berkumpul[b] di sana bersama murid-murid-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyerahkan Dia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bertemu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: mengetahui
  rationale: Bentuk οἶδα menyatakan pengetahuan atau pengenalan Yudas terhadap lokasi itu; “mengetahui” jelas dan wajar dalam konteks ini.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: δέ hanya menandai perkembangan ringan dalam narasi. Dalam bahasa Indonesia, peralihan ini sudah mengalir secara alami tanpa kata penghubung tambahan; menerjemahkannya sebagai “sekarang” akan memberi kesan waktu yang tidak dinyatakan oleh teks.
- source_word: καὶ
  choice: juga
  rationale: “Juga” mempertahankan daya aditif καί dan menegaskan bahwa Yudas pun mengetahui tempat itu.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: yang mengkhianati Dia
  rationale: Partisipel kini mengidentifikasi Yudas melalui perannya yang sedang berlangsung dalam kisah. Dalam konteks penyerahan Yesus oleh Yudas, “mengkhianati” menyampaikan bobot naratif dan moral secara alami.
- source_word: τὸν τόπον
  choice: tempat itu
  rationale: τόπος berarti tempat atau lokasi; “tempat itu” secara alami merujuk kembali kepada lokasi yang baru disebutkan dalam konteks.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan Yudas mengetahui tempat tersebut.
- source_word: πολλάκις
  choice: sudah sering
  rationale: πολλάκις menyatakan kejadian berulang. “Sering” menerjemahkan frekuensinya, sedangkan “sudah” menunjukkan bahwa pertemuan-pertemuan itu terjadi sebelum peristiwa narasi saat ini tanpa memaksakan sistem kala Yunani ke dalam bahasa Indonesia.
- source_word: συνήχθη
  choice: berkumpul
  rationale: Bentuk pasif συνάγω dapat berfungsi dengan arti intransitif dalam konteks ini. “Berkumpul” mempertahankan citra berkumpul bersama dan tetap alami dalam bahasa Indonesia.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: bersama murid-murid-Nya
  rationale: μετά dengan genitif menyatakan kebersamaan, dan μαθηταί secara tepat diterjemahkan “murid-murid” dalam konteks hubungan guru dan murid.
theological_decisions:
- issue: Makna παραδιδοὺς ketika merujuk kepada Yudas
  choice: mengkhianati
  alternative: menyerahkan
  rationale: Dalam kisah sengsara, tindakan Yudas bukan penyerahan yang netral. “Mengkhianati” menyampaikan fungsi kontekstual kata itu, sementara alternatif yang lebih harfiah dicatat agar rentang leksikalnya tetap terlihat.
- issue: Makna dan diatesis συνήχθη
  choice: Yesus sudah sering berkumpul di sana bersama murid-murid-Nya
  alternative: Yesus sudah sering bertemu di sana dengan murid-murid-Nya
  rationale: Walaupun bentuk Yunani bersifat pasif, kata ini dapat digunakan secara intransitif untuk tindakan berkumpul. Terjemahan ini tidak menjadikan Yesus objek yang dikumpulkan dan tidak menambahkan nuansa teologis di luar pertemuan yang berulang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan alur sebab-akibat teks Yunani, sementara penanda wacana δέ tidak diterjemahkan secara eksplisit karena akan terasa berlebihan dalam bahasa Indonesia.
