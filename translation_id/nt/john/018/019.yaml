  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: id
  text: Lalu Imam Besar menanyai Yesus tentang murid-murid-Nya dan tentang ajaran-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertanya kepada Yesus.” Kata kerja Yunani ini dapat berarti “bertanya” atau “menanyai”; “menanyai” dipilih karena konteksnya adalah pemeriksaan resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan narasi dari peristiwa sebelumnya secara alami dalam bahasa Indonesia, tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: ἀρχιερεὺς
  choice: Imam Besar
  rationale: Padanan baku bagi jabatan imam tertinggi Yahudi; bentuk tunggal dan definit dalam bahasa Yunani dipertahankan sebagai gelar jabatan, tanpa menggantinya dengan nama Annas.
- source_word: ἠρώτησεν
  choice: menanyai
  rationale: Dalam konteks pemeriksaan resmi, 'menanyai' menyampaikan pertanyaan yang terarah dengan lebih tepat daripada 'bertanya kepada', tetapi tidak sekeras 'menginterogasi'.
- source_word: περὶ
  choice: tentang
  rationale: Kedua kemunculannya menunjukkan pokok yang ditanyakan; 'tentang' merupakan padanan Indonesia yang jelas dan alami.
- source_word: μαθητῶν
  choice: murid-murid
  rationale: Padanan Injil yang mapan dan tepat, serta mempertahankan hubungan guru-murid.
- source_word: διδαχῆς
  choice: ajaran
  rationale: '''Ajaran'' alami dan mudah dipahami dalam konteks ini serta tidak seteknis ''doktrin''.'
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Kedua pronomina merujuk kepada Yesus. Bentuk hormat '-Nya' mengikuti kebiasaan penulisan Alkitab bahasa Indonesia dan memperjelas rujukannya.
theological_decisions:
- issue: Gelar ἀρχιερεύς ketika konteks narasi menunjuk kepada Annas, bukan Kayafas yang saat itu diakui Roma sebagai imam besar
  choice: Menerjemahkan gelar Yunani secara langsung sebagai 'Imam Besar'
  alternative: Annas, Imam Besar; imam kepala
  rationale: Terjemahan mengikuti bentuk teks Yunani dan tidak menyelaraskan rincian sejarah dengan menambahkan nama atau mengganti gelarnya.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. 'Lalu' menjaga alur narasi, sedangkan 'menanyai' mencerminkan suasana pemeriksaan tanpa melebihkannya sebagai interogasi. Kapitalisasi 'Imam Besar' dan pronomina ilahi '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia.
