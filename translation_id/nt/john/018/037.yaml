source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: id
  text: Lalu Pilatus berkata kepada-Nya, “Jadi, apakah Engkau seorang raja?” Yesus menjawab, “Engkau mengatakan bahwa Aku adalah raja.[a] Untuk inilah Aku dilahirkan, dan untuk inilah Aku telah datang ke dalam dunia, yaitu untuk memberi kesaksian tentang kebenaran. Setiap orang yang berasal dari kebenaran mendengarkan suara-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Engkau mengatakannya: Aku adalah raja,” atau, “Benar katamu bahwa Aku adalah raja.” Ungkapan Yunani ini ringkas dan dapat dipahami sebagai penegasan yang bernuansa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Jadi
  rationale: Menunjukkan bahwa pertanyaan Pilatus merupakan kesimpulan dari percakapan sebelumnya, dengan ungkapan yang wajar dalam bahasa Indonesia.
- source_word: βασιλεὺς
  choice: raja
  rationale: Padanan langsung yang mempertahankan muatan politis dan mesianik dalam pemeriksaan oleh penguasa Romawi.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Engkau mengatakan bahwa Aku adalah raja
  rationale: Mengikuti susunan Yunani dengan dekat dan mempertahankan kemungkinan bahwa jawaban ini merupakan penegasan berkualifikasi, tanpa mengubahnya menjadi penegasan mutlak ataupun penyangkalan.
- source_word: γεγέννημαι
  choice: Aku dilahirkan
  rationale: Bahasa Indonesia tidak membedakan aspek perfektum dengan cara yang sama seperti bahasa Yunani; bentuk ini alami dan tetap menyatakan kelahiran Yesus tanpa memasukkan gagasan teologis tambahan.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: Aku telah datang ke dalam dunia
  rationale: Kata 'telah' membantu mencerminkan aspek perfektum, sementara 'datang ke dalam dunia' mempertahankan bahasa khas Yohanes mengenai asal dan misi.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: memberi kesaksian tentang kebenaran
  rationale: Mengungkapkan tujuan dengan alami dan mempertahankan corak kesaksian atau pengadilan yang penting dalam Injil Yohanes.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Setiap orang yang berasal dari kebenaran
  rationale: Mempertahankan bahasa sumber atau asal yang dinyatakan oleh ἐκ, alih-alih menafsirkannya secara lebih sempit sebagai sekadar memihak atau menyetujui kebenaran.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: mendengarkan suara-Ku
  rationale: Kata 'mendengarkan' menyampaikan penerimaan yang tanggap, sedangkan 'suara-Ku' mempertahankan ungkapan konkret dan gaung khas Yohanes.
theological_decisions:
- issue: Nuansa jawaban Yesus kepada Pilatus (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: Mempertahankan rumusan dekat dengan bahasa Yunani sebagai penegasan yang dapat dipahami berkualifikasi
  alternative: “Benar, Aku adalah raja,” atau “Itu perkataanmu, bukan perkataan-Ku”
  rationale: Bahasa Yunani ringkas dan tidak secara eksplisit menyatakan penegasan mutlak maupun pengambilan jarak. Teks utama mempertahankan ketegangan itu, sedangkan catatan kaki menyebutkan kemungkinan nuansanya.
- issue: Pembedaan antara kelahiran dan kedatangan Yesus ke dalam dunia
  choice: Mempertahankan kedua klausa sebagai pernyataan tersendiri
  alternative: Melebur keduanya menjadi satu pernyataan umum tentang misi Yesus
  rationale: Susunan Yohanes dengan sengaja menyebut kelahiran dan kedatangan ke dalam dunia secara terpisah. Terjemahan tidak menghapus pembedaan yang mungkin memiliki bobot inkarnasional itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Kata ganti penghormatan “Engkau” dan bentuk terikat “-Nya/-Ku” dipakai sesuai kebiasaan penerjemahan Alkitab Indonesia. Struktur Yunani dipertahankan bila penting bagi ambiguitas dan tema Yohanes, tetapi susunan kalimat dibuat alami dalam bahasa Indonesia.
