  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: id
  text: Yesus menjawab, “Apakah engkau mengatakan hal ini dari dirimu sendiri, ataukah orang lain telah mengatakan kepadamu tentang Aku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Kata kerja naratif baku untuk menanggapi ucapan atau pertanyaan; “menjawab” alami dalam dialog Injil.
- source_word: Ἀπὸ σεαυτοῦ
  choice: dari dirimu sendiri
  rationale: Mempertahankan gambaran sumber atau asal dalam ἀπό dengan kata ganti refleksif, yakni apakah perkataan itu berasal dari Pilatus sendiri.
- source_word: σὺ
  choice: engkau
  rationale: Kata ganti eksplisit dalam bahasa Yunani memberi penekanan pada Pilatus; “engkau” mempertahankan penekanan itu dalam ragam yang bermartabat.
- source_word: τοῦτο
  choice: hal ini
  rationale: Merujuk pada pertanyaan Pilatus sebelumnya dan terdengar jelas dalam bahasa Indonesia modern.
- source_word: λέγεις
  choice: mengatakan
  rationale: Bentuk kini dalam dialog menunjuk pada ucapan yang sedang dipersoalkan; konstruksi “Apakah engkau mengatakan” alami dan tidak menambah tafsiran.
- source_word: ἢ
  choice: atau
  rationale: Menandai dua kemungkinan sumber pernyataan Pilatus.
- source_word: ἄλλοι
  choice: orang-orang lain
  rationale: Menyatakan pihak-pihak selain Pilatus tanpa menentukan identitas mereka.
- source_word: εἶπόν σοι
  choice: yang mengatakannya kepadamu
  rationale: Aoristus λέγω dengan objek tak langsung berarti bahwa orang lain telah menyampaikan hal tersebut kepada Pilatus; bentuk ini juga mempertahankan pengulangan akar λέγω.
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: περί dengan genitif berarti “tentang” atau “mengenai”; kapitalisasi “Aku” mengikuti kebiasaan Indonesia untuk rujukan kepada Yesus tanpa mengubah makna sumber.
theological_decisions:
- issue: Daya pertanyaan Yesus kepada Pilatus
  choice: 'Pertanyaan diterjemahkan sebagai pertanyaan tentang asal pernyataan Pilatus: dari dirinya sendiri atau dari orang lain.'
  alternative: “Apakah engkau menanyakan hal ini atas prakarsamu sendiri?”
  rationale: Teks Yunani memakai λέγεις, “mengatakan,” dan ἀπὸ σεαυτοῦ, “dari dirimu sendiri.” Terjemahan tidak mengubahnya menjadi pertanyaan tentang motif atau prakarsa dan tidak menerangkan implikasi teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk mempertahankan penekanan σὺ dan nuansa dialog kitab suci. Susunan “dari dirimu sendiri” sengaja agak harfiah karena tepat menyampaikan asal pernyataan tanpa mengalihkannya menjadi gagasan kemandirian tindakan.
