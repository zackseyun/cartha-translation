base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: id
  text: Segala sesuatu menjadi ada melalui Dia,[a] dan tanpa Dia, dari segala yang telah menjadi ada tidak satu pun menjadi ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, ayat 4 dimulai: “Apa yang telah menjadi ada di dalam Dia adalah hidup.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Segala sesuatu
  rationale: Bentuk jamak netral ini bersifat menyeluruh. Ungkapan “segala sesuatu” alami dalam bahasa Indonesia dan mempertahankan cakupan kosmisnya.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: διά dengan bentuk genitif menyatakan perantaraan atau sarana. “Melalui Dia” mempertahankan peran Sang Firman sebagai perantara bagi keberadaan segala sesuatu tanpa mereduksinya menjadi sekadar tindakan pembuatan.
- source_word: ἐγένετο
  choice: menjadi ada
  rationale: Dalam konteks ini γίνομαι menunjuk pada datangnya sesuatu ke dalam keberadaan. “Menjadi ada” lebih tepat daripada “dibuat” dan tetap mudah dipahami.
- source_word: χωρὶς αὐτοῦ
  choice: tanpa Dia
  rationale: χωρίς menyatakan keterpisahan atau ketiadaan. “Tanpa Dia” merupakan padanan Indonesia yang lugas dan alami.
- source_word: οὐδὲ ἕν
  choice: tidak satu pun
  rationale: Ungkapan ini menegaskan penyangkalan secara menyeluruh. “Tidak satu pun” mempertahankan daya tekan οὐδέ dan bentuk tunggal netral ἕν.
- source_word: ὃ γέγονεν
  choice: dari segala yang telah menjadi ada
  rationale: Dengan mengaitkan klausa relatif ini pada ayat 3, ungkapan tersebut menjelaskan bahwa dari seluruh hal yang kini telah ada, tidak satu pun menjadi ada tanpa Dia. Bentuk “telah menjadi ada” mencerminkan aspek perfektum γέγονεν.
theological_decisions:
- issue: Kaitan klausa terakhir ὃ γέγονεν
  choice: 'Dikaitkan dengan ayat 3: “tidak satu pun menjadi ada dari segala yang telah menjadi ada.”'
  alternative: 'Memulai ayat 4: “Apa yang telah menjadi ada di dalam Dia adalah hidup.”'
  rationale: Naskah Yunani awal tidak memiliki tanda baca asli yang menentukan kaitan klausa ini. Mengaitkannya dengan ayat 3 menghasilkan makna yang koheren dan menegaskan cakupan universal penciptaan melalui Sang Firman; kemungkinan kaitannya dengan ayat 4 tetap dicatat karena ambiguitas sumbernya nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Dia” dipakai sebagai rujukan pronominal kepada Sang Firman sesuai kelaziman teks Alkitab Indonesia; susunan kalimat mempertahankan penegasan dan pengulangan teks Yunani tanpa menjadi tidak wajar.
