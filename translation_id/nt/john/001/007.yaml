  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: id
  text: Ia datang sebagai saksi[a] untuk bersaksi tentang Terang itu, supaya melalui dia semua orang percaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk kesaksian.”'
    reason: lexical_alternative
  - marker: b
    text: Kata “dia” kemungkinan besar merujuk kepada Yohanes; sebagian orang memahaminya sebagai Terang itu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Ia
  rationale: Kata tunjuk ini merujuk kembali kepada Yohanes dalam ayat sebelumnya. Dalam bahasa Indonesia modern, “Ia” mengungkapkan rujukan itu secara alami tanpa kehilangan kesinambungan wacana.
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: datang sebagai saksi
  rationale: Ungkapan ini menyatakan kedatangan Yohanes dalam peran dan tujuan sebagai saksi; terjemahan ini alami sekaligus mempertahankan nuansa kesaksian.
- source_word: ἵνα μαρτυρήσῃ
  choice: untuk bersaksi
  rationale: ἵνα menyatakan tujuan. “Untuk bersaksi” ringkas, wajar, dan mempertahankan hubungan leksikal dengan μαρτυρίαν.
- source_word: περὶ τοῦ φωτός
  choice: tentang Terang itu
  rationale: περί dengan genitif berarti “tentang”. “Terang” memakai huruf kapital karena dalam konteks ini menunjuk secara gelar kepada pribadi yang disebut Terang, sedangkan “itu” mewakili artikel tertentu.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: supaya ... semua orang percaya
  rationale: Klausa tujuan kedua dipertahankan dengan “supaya”. πάντες bersifat luas dan tanpa pembatasan, sehingga diterjemahkan “semua orang”.
- source_word: δι’ αὐτοῦ
  choice: melalui dia
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. “Melalui dia” mempertahankan bentuk sumber dan ambiguitas gramatikal mengenai rujukan kata ganti.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam δι’ αὐτοῦ
  choice: Teks utama mempertahankan “dia”; catatan menerangkan bahwa rujukan yang paling wajar adalah Yohanes.
  alternative: Kata “dia” dapat dipahami merujuk kepada Terang itu.
  rationale: Yohanes adalah subjek ayat dan konteks berikutnya membedakannya dari Terang, sehingga Yohanes merupakan anteseden yang paling wajar. Namun, bentuk Yunani sendiri memungkinkan pembaca menghubungkannya dengan “Terang” yang disebut paling dekat; ambiguitas ini tidak dihapus dari teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan kata yang berakar pada “saksi” dipertahankan untuk mencerminkan μαρτυρίαν/μαρτυρήσῃ. Susunan klausa dibuat alami dalam bahasa Indonesia sambil mempertahankan kedua tujuan dalam teks Yunani.
