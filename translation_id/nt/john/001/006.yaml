  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: id
  text: Ada seorang yang diutus dari Allah; namanya Yohanes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan secara lebih ringkas: “seorang bernama Yohanes.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: Ada
  rationale: Dalam konteks ini, γίνομαι memperkenalkan tokoh baru ke dalam narasi. “Ada” menyampaikan fungsi eksistensial itu secara alami tanpa menyiratkan bahwa ia diciptakan atau sekadar tampak.
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Kata ini menunjuk kepada satu pribadi laki-laki, yaitu Yohanes. Dalam bahasa Indonesia, “seorang” sudah alami karena identitas laki-lakinya langsung dinyatakan melalui nama Yohanes.
- source_word: ἀπεσταλμένος
  choice: yang diutus
  rationale: Bentuk partisip pasif ini menggambarkan Yohanes sebagai orang yang telah menerima pengutusan. “Yang diutus” mempertahankan makna pasif dan gagasan penugasan tanpa menambah jabatan tertentu.
- source_word: παρὰ θεοῦ
  choice: dari Allah
  rationale: παρά dengan genetif menyatakan sumber atau asal. “Dari Allah” mempertahankan penekanan pada sumber pengutusan, sedangkan “oleh Allah” akan lebih menonjolkan pelaku.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: namanya Yohanes
  rationale: Ungkapan Yunani ini secara idiomatis mengidentifikasi nama orang tersebut. “Namanya Yohanes” alami, ringkas, dan tetap dekat dengan susunan serta daya identifikasinya.
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Nama ini memakai bentuk baku yang sudah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat pengutusan Yohanes
  choice: Yohanes ditampilkan sebagai orang yang diutus dari Allah.
  alternative: Yohanes diutus oleh Allah.
  rationale: Frasa παρὰ θεοῦ bersama bentuk pasif ἀπεσταλμένος menunjukkan sumber ilahi dari pengutusannya. “Dari Allah” mempertahankan nuansa sumber tanpa menambahkan klaim tentang jabatan kenabian atau doktrin lain yang tidak dinyatakan langsung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan sederhana. Tanda titik koma mempertahankan hubungan erat antara pengutusan tokoh dan penyebutan namanya, sekaligus membuat kalimat mudah dibaca.
