  naturalness: '"Salah seorang dari dua orang" lebih alami dalam bahasa Indonesia baku daripada "salah seorang dari kedua orang." Susunan kalimat lainnya jelas dan wajar. "Mendengar dari Yohanes" mempertahankan elipsis objek yang juga terdapat dalam sumber dan dapat dipahami dari konteks.'
  terminology: '"Andreas," "Simon Petrus," dan "saudara" sudah tepat. Pronomina "dia" mempertahankan rujukan kontekstual tanpa menjadikan kapitalisasi pronomina sebagai penafsiran tambahan.'
