  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: id
  text: Andreas, saudara Simon Petrus, adalah salah seorang dari dua orang yang telah mendengar dari Yohanes dan mengikuti dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “salah seorang dari dua orang yang mendengar dari Yohanes dan mengikuti dia.” Dalam konteks, “dia” merujuk kepada Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: adalah
  rationale: Bentuk imperfek εἰμί berfungsi sebagai kopula yang mengidentifikasi Andreas sebagai salah seorang dari kedua orang itu; dalam bahasa Indonesia, 'adalah' menyampaikan fungsi ini secara alami.
- source_word: Ἀνδρέας
  choice: Andreas
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: saudara Simon Petrus
  rationale: ἀδελφός di sini menunjuk pada saudara kandung; susunan ini alami dan tetap mempertahankan hubungan genitif serta sebutan lengkap 'Simon Petrus'.
- source_word: εἷς ἐκ τῶν δύο
  choice: salah seorang dari kedua orang
  rationale: Ungkapan partitif ini menyatakan bahwa Andreas adalah satu dari dua orang; 'salah seorang dari kedua orang' jelas dan idiomatis.
- source_word: τῶν ἀκουσάντων
  choice: yang telah mendengar
  rationale: Partisip aoris menyatakan tindakan mendengar yang mendahului tindakan mengikuti; 'telah mendengar' mempertahankan urutan tersebut secara wajar.
- source_word: παρὰ Ἰωάννου
  choice: dari Yohanes
  rationale: παρά dengan genitif menyatakan sumber. Terjemahan ini tidak menambahkan 'Pembaptis', yang tidak tertulis dalam ayat.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: lalu mengikuti Dia
  rationale: '''Mengikuti'' adalah padanan langsung ἀκολουθέω. ''Lalu'' memperjelas urutan naratif tanpa mengubah hubungan tindakan. Dalam konteks, αὐτῷ merujuk kepada Yesus; kapitalisasi ''Dia'' mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada pribadi ilahi.'
theological_decisions:
- issue: Rujukan αὐτῷ
  choice: '''Dia'' merujuk kepada Yesus'
  alternative: '''dia'' merujuk kepada Yohanes'
  rationale: Dalam konteks langsung Yohanes 1:35–39, kedua murid mendengar perkataan Yohanes, kemudian mengikuti Yesus. Teks utama tetap memakai pronomina, sebagaimana bahasa Yunani, sedangkan catatan menjelaskan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dan pronomina dalam teks Yunani.
