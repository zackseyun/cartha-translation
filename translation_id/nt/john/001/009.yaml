base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: id
  text: Terang sejati[a], yang menerangi setiap orang, sedang datang ke dalam dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Terang sejati, yang menerangi setiap orang yang datang ke dalam dunia.” Partisip Yunani “yang datang” secara tata bahasa dapat dikaitkan dengan “setiap orang”; dalam teks utama, partisip itu dipahami secara makna berkaitan dengan “Terang sejati”.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: terang
  rationale: Kata benda biasa ini mempertahankan citra Yohanes secara alami tanpa menambahkan kapitalisasi yang tidak ditandai dalam bahasa Yunani.
- source_word: ἀληθινόν
  choice: sejati
  rationale: “Sejati” menyampaikan arti yang sungguh-sungguh, hakiki, atau nyata, bukan sekadar benar secara faktual.
- source_word: φωτίζει
  choice: menerangi
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan baik citra cahaya maupun daya metaforis verba tersebut.
- source_word: πάντα ἄνθρωπον
  choice: setiap orang
  rationale: Ungkapan ini menyampaikan bentuk distributif tunggal serta cakupan universal ἄνθρωπος tanpa membatasinya pada laki-laki.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: sedang datang ke dalam dunia
  rationale: Dalam teks utama, partisip ini dipahami secara makna sebagai merujuk kepada Terang; bentuk progresif bersama ἦν mencerminkan tindakan yang sedang berlangsung. Kemungkinan bahwa partisip menerangkan “setiap orang” dipertahankan dalam catatan kaki.
- source_word: κόσμον
  choice: dunia
  rationale: Padanan baku dan sesuai konteks bagi κόσμος dalam Injil Yohanes.
- source_word: ἦν
  choice: sedang
  rationale: Imperfek ἦν dipadukan dengan gagasan partisip “datang” menjadi konstruksi progresif Indonesia “sedang datang” agar alur klausa wajar.
theological_decisions:
- issue: Keterkaitan sintaktis ἐρχόμενον (“datang”)
  choice: 'Dipahami dalam teks utama sebagai merujuk kepada “Terang sejati”: “sedang datang ke dalam dunia.”'
  alternative: 'Dipahami sebagai menerangkan “setiap orang”: “setiap orang yang datang ke dalam dunia.”'
  rationale: Secara gramatikal, partisip akusatif tunggal maskulin dapat menerangkan ἄνθρωπον. Namun, konteks prolog dan pemakaian ungkapan “datang ke dalam dunia” dalam Yohanes mendukung pembacaan kristologis. Ambiguitas asli tetap dinyatakan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. “Terang” tidak dikapitalisasi karena teks Yunani memakai kata benda umum, meskipun rujukannya bersifat kristologis.
