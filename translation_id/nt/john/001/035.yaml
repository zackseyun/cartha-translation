  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: id
  text: Keesokan harinya, Yohanes kembali berdiri di sana bersama dua orang muridnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan temporal ini berarti ‘pada hari berikutnya’; ‘Keesokan harinya’ alami dalam narasi Indonesia dan mempertahankan urutan waktunya.
- source_word: πάλιν
  choice: kembali
  rationale: Menandai pengulangan dari adegan sebelumnya; ‘kembali’ ringkas dan alami dalam konteks ini.
- source_word: εἱστήκει
  choice: berdiri di sana
  rationale: Bentuk statif lampau ini menggambarkan Yohanes dalam keadaan berdiri. ‘Di sana’ disuplai demi kelancaran bahasa Indonesia tanpa menambahkan lokasi tertentu.
- source_word: ὁ Ἰωάννης
  choice: Yohanes
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia; teks Yunani hanya menyebut Yohanes dan tidak memperluasnya menjadi Yohanes Pembaptis.
- source_word: καὶ
  choice: bersama
  rationale: Dalam susunan Indonesia, ‘bersama’ secara alami menghubungkan Yohanes dengan kedua murid yang hadir, sementara relasi dasar konjungsi tetap terpelihara.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: dua orang muridnya
  rationale: Mempertahankan makna partitif, yakni dua orang dari antara para murid Yohanes. Kata bantu bilangan ‘orang’ sesuai untuk manusia dalam bahasa Indonesia.
