  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: id
  text: Natanael berkata kepada-Nya[a], “Bagaimana Engkau mengenal aku?” Yesus menjawab kepadanya, “Sebelum Filipus memanggilmu, ketika engkau berada di bawah pohon ara, Aku melihatmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara harfiah, “Dari mana Engkau mengenal aku?”
    reason: Mempertahankan alternatif leksikal yang lebih dekat dengan arti harfiah Πόθεν, sementara teks utama menggunakan ungkapan Indonesia yang alami untuk maksud pertanyaan tersebut.
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: Dari mana Engkau mengenal aku?
  rationale: Mempertahankan bentuk pertanyaan Yunani Πόθεν (‘dari mana’) secara wajar dalam bahasa Indonesia, dengan γινώσκεις sebagai ‘mengenal’ untuk pengetahuan pribadi tentang Natanael.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Yesus menjawab kepadanya
  rationale: Dalam bahasa Indonesia, ‘menjawab dan berkata kepadanya’ terasa berlebihan; ‘menjawab kepadanya’ menyampaikan fungsi kedua verba Yunani secara alami tanpa kehilangan isi ujaran.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Sebelum Filipus memanggilmu
  rationale: Πρὸ τοῦ dengan infinitif menyatakan waktu yang mendahului, sedangkan φωνέω di sini paling alami berarti ‘memanggil’.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: ketika engkau berada di bawah pohon ara
  rationale: Partisip ὄντα menyatakan keadaan atau latar waktu Natanael ketika dilihat; ‘ketika engkau berada’ jelas dan idiomatis.
- source_word: εἶδόν σε
  choice: Aku melihatmu
  rationale: Menerjemahkan aoristus secara langsung sebagai tindakan lampau; urutan waktunya telah dinyatakan oleh ‘sebelum’.
theological_decisions:
- issue: Sifat pengetahuan Yesus tentang Natanael
  choice: Pernyataan bahwa Yesus melihat Natanael diterjemahkan secara langsung tanpa menjelaskan mekanismenya.
  alternative: Menambahkan kesan bahwa penglihatan itu secara khusus bersifat adikodrati atau, sebaliknya, sekadar pengamatan biasa.
  rationale: Ayat ini tidak menerangkan bagaimana Yesus melihat atau mengenal Natanael; terjemahan perlu mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai ‘Engkau’ dan pronomina naratif ‘-Nya’; bentuk ‘aku’ dipertahankan dalam dialog pribadi. Tidak diperlukan catatan kaki karena ‘Dari mana Engkau mengenal aku?’ sekaligus dekat dengan struktur Yunani dan dapat dipahami secara alami.
