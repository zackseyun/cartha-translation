translation:
  language: id
  text: Filipus berasal dari Betsaida[a], kota asal Andreas dan Petrus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari Betsaida, dari kota Andreas dan Petrus”; maksudnya, kota asal mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: berasal
  rationale: Imperfek εἰμί menyatakan keadaan atau latar belakang Filipus. Dalam konteks asal daerah, “berasal” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “adalah”.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ merupakan penghubung naratif ringan. Dalam ayat singkat ini, alur wacana bahasa Indonesia tetap alami tanpa kata penghubung eksplisit, dan penghilangan ini tidak menghapus pertentangan atau unsur temporal.
- source_word: Φίλιππος
  choice: Filipus
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἀπὸ Βηθσαϊδά
  choice: dari Betsaida
  rationale: ἀπό menunjukkan sumber atau asal. “Dari Betsaida” merupakan padanan Indonesia yang idiomatis; nama tempat ditransliterasikan sebagai “Betsaida”.
- source_word: ἐκ τῆς πόλεως
  choice: kota asal
  rationale: ἐκ menunjukkan asal dan πόλις dapat berarti kota atau permukiman. Frasa “kota asal” secara alami mengungkapkan bahwa Betsaida juga merupakan tempat asal Andreas dan Petrus, meskipun struktur preposisional Yunani tidak diulang secara harfiah.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: Andreas dan Petrus
  rationale: Bentuk genitif ini bergantung pada πόλεως dan menyatakan hubungan dengan kota tersebut, dalam konteks ini sebagai kota asal mereka. Nama-nama memakai bentuk Indonesia yang lazim.
