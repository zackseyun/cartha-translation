  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: id
  text: Dialah yang datang sesudah aku, yang tali sandal-Nya tidak layak aku lepaskan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: Dialah yang datang sesudah aku
  rationale: Partisipel kini berartikel berfungsi sebagai nomina dan menunjuk kepada orang tertentu. Bentuk ini mempertahankan gagasan kedatangan serta urutan waktu/pelayanan tanpa memasukkan penjelasan teologis dari ayat sekitar.
- source_word: οὗ
  choice: yang ... -Nya
  rationale: Pronomina relatif genitif menyatakan hubungan kepunyaan dengan tali sandal. Dalam bahasa Indonesia, hubungan itu paling alami disampaikan melalui klausa relatif dan enklitik posesif hormat '-Nya'.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: aku tidak layak
  rationale: ἄξιος menyatakan kelayakan atau kepantasan. 'Tidak layak' akurat, wajar, dan mempertahankan ungkapan kerendahan hati Yohanes.
- source_word: ἵνα λύσω
  choice: untuk melepaskannya
  rationale: Setelah ungkapan kelayakan, ἵνα dengan bentuk subjungtif menunjuk kepada tindakan yang dipertimbangkan dan secara alami dapat diterjemahkan dengan 'untuk'. Dalam konteks tali alas kaki, λύω berarti melepaskan atau membuka ikatan.
- source_word: ἱμάντα
  choice: tali
  rationale: ἱμάς adalah tali atau pengikat sandal. 'Tali' merupakan padanan Indonesia yang jelas dan alami dalam frasa 'tali sandal'.
- source_word: τοῦ ὑποδήματος
  choice: sandal
  rationale: ὑπόδημα berarti alas kaki atau sandal; 'sandal' paling tepat untuk latar budaya dan benda yang dimaksud.
theological_decisions:
- issue: Hubungan ungkapan 'sesudah aku' dengan Dia yang datang
  choice: 'Diterjemahkan sebagai urutan waktu/pelayanan: ''yang datang sesudah aku''.'
  alternative: '''yang datang di belakangku'''
  rationale: ὀπίσω μου dapat bersifat spasial atau menyatakan urutan. Dalam konteks ini, 'sesudah aku' secara alami menunjukkan bahwa pelayanan-Nya tampil setelah Yohanes, tanpa secara eksplisit memasukkan klaim keunggulan dari ayat-ayat sekitarnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Aku' dipakai sesuai tuturan langsung Yohanes. Partikel 'pun' menegaskan bahwa bahkan tugas rendah melepaskan tali sandal itu melampaui kelayakannya. Huruf kapital pada '-Nya' mengikuti kebiasaan penghormatan dalam penerbitan Alkitab Indonesia.
