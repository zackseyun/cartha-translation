id: JHN.1.33
reference: John 1:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: id
  text: Aku pun tidak mengenal Dia[a]. Namun, Dia yang mengutus aku untuk membaptis dalam air[b] berkata kepadaku, “Dia yang kaulihat Roh turun dan tetap tinggal[c] di atas-Nya, Dialah yang membaptis dalam Roh Kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mengenali Dia.” Ungkapan Yunani ini dapat menyatakan tidak mengenal seseorang atau tidak mengenali identitasnya dalam konteks tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “membaptis dengan air” dan “membaptis dengan Roh Kudus.” Bahasa Yunani memakai preposisi yang sama dalam kedua frasa; teks utama mempertahankan kesejajaran itu dengan kata “dalam.”
    reason: lexical_alternative
  - marker: c
    text: “Tetap tinggal” menerjemahkan kata kerja penting dalam Injil Yohanes yang juga dapat diterjemahkan “tetap” atau “berdiam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Aku pun
  rationale: Bentuk gabungan καί + ἐγώ menghubungkan perkataan ini dengan konteks sebelumnya sekaligus menegaskan kesaksian Yohanes. “Aku pun” alami dalam bahasa Indonesia dan mempertahankan kedua nuansa itu.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: tidak mengenal Dia
  rationale: οἶδα dalam bentuk imperfek menyatakan bahwa sebelumnya Yohanes tidak mengetahui atau tidak mengenali identitas Yesus. “Tidak mengenal” merupakan padanan langsung tanpa menutup kemungkinan nuansa “tidak mengenali” dalam konteks.
- source_word: ὁ πέμψας με
  choice: Dia yang mengutus aku
  rationale: Partisip aoris dengan artikel berfungsi substantival dan menunjuk kepada pribadi tertentu. Bentuk ini dekat dengan struktur Yunani tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: membaptis dalam air
  rationale: Infinitif menyatakan tujuan pengutusan. “Dalam” mempertahankan preposisi ἐν dan kesejajarannya dengan ἐν πνεύματι ἁγίῳ pada akhir ayat.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Dia yang kaulihat ... di atas-Nya
  rationale: Konstruksi relatif ini memperkenalkan tanda pengenal. Susunan Indonesia menempatkan pelengkap “di atas-Nya” setelah kedua partisip agar berlaku bagi turunnya dan tetap tinggalnya Roh.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον
  choice: Roh turun dan tetap tinggal
  rationale: “Roh” menunjuk kepada Roh Kudus dalam konteks langsung. μένω diterjemahkan “tetap tinggal” untuk mempertahankan gagasan keberlanjutan dan kaitannya dengan kosakata khas Injil Yohanes.
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: Dialah yang membaptis
  rationale: “Dialah” mempertahankan daya tunjuk dan penegasan dari οὗτός ἐστιν, sedangkan bentuk relatif menerjemahkan partisip substantival secara alami.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Pilihan “dalam” mempertahankan preposisi yang sama dengan frasa baptisan dalam air; “Roh Kudus” adalah referen yang jelas dalam konteks.
theological_decisions:
- issue: Identitas πνεῦμα dan πνεύματι ἁγίῳ
  choice: Roh ... Roh Kudus
  alternative: roh ... roh kudus
  rationale: Konteks langsung menyamakan Roh yang turun dengan Roh Kudus pada akhir ayat. Huruf kapital menandai referennya, bukan menambahkan gagasan yang tidak terdapat dalam teks.
- issue: Preposisi dalam kedua ungkapan baptisan
  choice: membaptis dalam air ... membaptis dalam Roh Kudus
  alternative: membaptis dengan air ... membaptis dengan Roh Kudus
  rationale: ἐν digunakan dalam kedua frasa. Memakai “dalam” pada keduanya mempertahankan kesejajaran sengaja dalam teks dan tidak menetapkan secara sempit apakah nuansanya lokatif atau instrumental.
- issue: Arti οὐκ ᾔδειν dalam hubungan Yohanes dengan Yesus
  choice: tidak mengenal Dia
  alternative: tidak mengenali Dia
  rationale: Teks dapat menyatakan tidak mengenal atau belum mengenali identitas-Nya. Teks utama memakai padanan yang lebih langsung, sedangkan kemungkinan kontekstual lainnya dicatat tanpa menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa bentuk arkais. “Kaulihat” mempertahankan sapaan orang kedua tunggal secara ringkas. Kapitalisasi pada Dia/-Nya dan Roh mengikuti referen ilahi yang jelas dalam konteks. Tanda baca membagi pernyataan pembuka dari kontras berikutnya agar kalimat panjang tetap mudah dipahami.
