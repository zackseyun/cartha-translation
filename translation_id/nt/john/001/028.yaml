  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: id
  text: Hal-hal ini terjadi di Betania, di seberang Sungai Yordan,[a] tempat Yohanes sedang membaptis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah dan tradisi terjemahan kemudian memakai nama “Betabara” sebagai ganti “Betania”.
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: Hal-hal ini
  rationale: Mempertahankan bentuk jamak demonstratif yang merujuk pada rangkaian percakapan dan peristiwa sebelumnya.
- source_word: ἐν Βηθανίᾳ
  choice: di Betania
  rationale: Menyampaikan fungsi lokatif ἐν dengan nama tempat secara langsung dan alami dalam bahasa Indonesia.
- source_word: ἐγένετο
  choice: terjadi
  rationale: Dalam konteks ini γίνομαι menyatakan berlangsungnya peristiwa; 'terjadi' merupakan padanan naratif modern dan ringkas.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: di seberang Sungai Yordan
  rationale: '''Di seberang'' menunjukkan lokasi pada sisi lain sungai, sedangkan penambahan ''Sungai'' memperjelas nama geografis secara alami bagi pembaca Indonesia.'
- source_word: ὅπου
  choice: tempat
  rationale: Klausa lokasi paling alami dirangkai sebagai 'tempat Yohanes ...' setelah keterangan Betania.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: Yohanes sedang membaptis
  rationale: ἦν dengan partisipel kini membentuk konstruksi perifrastik imperfek yang menandakan kegiatan yang sedang berlangsung.
theological_decisions:
- issue: Nama tempat Βηθανίᾳ ('Betania') dibandingkan varian Βηθαβαρᾷ ('Betabara')
  choice: Betania
  alternative: Betabara
  rationale: Teks SBLGNT yang menjadi sumber berbunyi Βηθανίᾳ. Varian yang dikenal dalam sejumlah naskah dan tradisi terjemahan kemudian dicatat dalam catatan kaki tanpa menggantikan bacaan teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Hal-hal ini' mempertahankan bentuk jamak Yunani, sementara 'sedang membaptis' mempertahankan nuansa kegiatan yang berlangsung. Penanda catatan kaki ditempatkan sesudah frasa lokasi yang diterangkannya.
