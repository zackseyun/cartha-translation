id: JHN.1.25
reference: John 1:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: id
  text: Lalu mereka bertanya kepadanya dan berkata, “Kalau begitu, mengapa engkau membaptis jika engkau bukan Mesias[a], bukan Elia, dan bukan Nabi itu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός (Christos) diterjemahkan di sini sebagai “Mesias” untuk mempertahankan konteks pengharapan mesianik Yahudi.
    reason: alternative_reading
  - marker: b
    text: “Nabi itu” kemungkinan merujuk kepada nabi seperti Musa yang dinantikan (lihat Ul. 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: mereka bertanya kepadanya
  rationale: Dalam bahasa Yunani terdapat dua verba, secara harfiah ‘bertanya ... dan berkata kepadanya’. Dalam bahasa Indonesia modern, ‘bertanya kepadanya’ secara wajar sudah mencakup pengantar ujaran itu; mempertahankan keduanya akan terasa berlebihan tanpa menambah makna.
- source_word: Τί οὖν βαπτίζεις
  choice: Kalau begitu, mengapa engkau membaptis
  rationale: Dalam konstruksi ini τί menanyakan alasan atau dasar tindakan, sedangkan οὖν menghubungkannya dengan penyangkalan sebelumnya. ‘Kalau begitu, mengapa’ menyampaikan daya idiomatisnya secara alami.
- source_word: βαπτίζεις
  choice: engkau membaptis
  rationale: Bentuk kini menunjukkan kegiatan Yohanes yang sedang berlangsung. Bentuk Indonesia ini dapat menyatakan praktik yang tengah dilakukan tanpa harus menambahkan ‘sedang’.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar tokoh yang dinantikan dalam konteks Yahudi, sehingga ‘Mesias’ lebih langsung mempertahankan konteks tersebut daripada ‘Kristus’.
- source_word: Ἠλίας
  choice: Elia
  rationale: Mengikuti bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: ὁ προφήτης
  choice: Nabi itu
  rationale: Artikel tertentu menunjuk kepada seorang nabi yang sudah dikenal dalam pengharapan para penanya, bukan sembarang nabi. ‘Nabi itu’ menyampaikan ketertentuan ini secara alami dalam bahasa Indonesia tanpa bergantung pada kapitalisasi semata.
- source_word: οὐδὲ ... οὐδὲ
  choice: bukan ... dan bukan
  rationale: Rangkaian negasi Yunani mengoordinasikan tiga identitas yang disangkal. Pengulangan ‘bukan’ menjaga kejelasan dan penekanan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar dalam pertanyaan identitas
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini merupakan gelar, bukan nama diri, dan dalam percakapan ini merujuk pada pengharapan mesianik Yahudi. Catatan kaki mempertahankan padanan tradisional ‘Kristus’ sebagai alternatif.
- issue: Apakah ὁ προφήτης menunjuk kepada tokoh tertentu
  choice: Nabi itu
  alternative: nabi itu / Sang Nabi
  rationale: Artikel Yunani menunjukkan tokoh tertentu yang dikenal oleh para penanya. ‘Nabi itu’ menjaga kekhususan tersebut tanpa memastikan secara mutlak identifikasi yang hanya tersirat oleh konteks; catatan menerangkan kemungkinan kaitannya dengan Ulangan 18:15.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ‘engkau’ dipakai untuk percakapan langsung dalam narasi Alkitab. Susunan pertanyaan dibuat alami, sementara pengulangan tiga penyangkalan dan kekhususan gelar tetap dipertahankan.
