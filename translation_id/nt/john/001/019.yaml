id: JHN.1.19
reference: John 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: id
  text: Dan inilah kesaksian Yohanes ketika orang-orang Yahudi[a] mengutus para imam dan orang-orang Lewi dari Yerusalem untuk bertanya kepadanya, “Siapakah engkau?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Yahudi” atau “orang-orang Yudea”. Dalam Injil Yohanes, sebutan “orang-orang Yahudi” sering terutama merujuk kepada para penguasa keagamaan di Yudea, bukan kepada seluruh bangsa Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: kesaksian
  rationale: Mempertahankan nuansa pemberian kesaksian yang penting dalam Injil Yohanes dan sesuai dengan pernyataan Yohanes dalam adegan berikutnya.
- source_word: τοῦ Ἰωάννου
  choice: Yohanes
  rationale: 'Genitif ini dipahami secara subjektif: kesaksian yang diberikan oleh Yohanes, bukan kesaksian tentang Yohanes.'
- source_word: ὅτε
  choice: ketika
  rationale: Menyatakan waktu atau peristiwa yang menjadi kesempatan bagi kesaksian tersebut.
- source_word: ἀπέστειλαν
  choice: mengutus
  rationale: Dalam konteks pengiriman wakil resmi dari Yerusalem, 'mengutus' lebih tepat daripada sekadar 'mengirim' dan tetap alami dalam bahasa Indonesia.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan Yunani tanpa mempersempit rujukannya di dalam teks utama; catatan kaki menjelaskan bahwa dalam konteks Yohanes sebutan ini sering terutama menunjuk para pemimpin keagamaan di Yudea.
- source_word: ἐξ Ἱεροσολύμων
  choice: dari Yerusalem
  rationale: Padanan tempat asal yang baku dan alami.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: para imam dan orang-orang Lewi
  rationale: Mempertahankan dua kelompok yang berbeda dan terkait dengan pelayanan Bait Allah.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: untuk bertanya kepadanya
  rationale: Mengungkapkan tujuan pengutusan secara ringkas dan alami.
- source_word: Σὺ τίς εἶ;
  choice: Siapakah engkau?
  rationale: Padanan Indonesia yang alami dan bermartabat; kata ganti eksplisit dalam bahasa Yunani memberi sedikit penekanan pada orang yang ditanya.
theological_decisions:
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks utama mempertahankan keluasan ungkapan sumber, sedangkan catatan kaki mencegah pembacaan yang menyamaratakan seluruh bangsa Yahudi. Pengutusan para imam dan orang Lewi dari Yerusalem menunjukkan bahwa kalangan pemimpin keagamaan terutama berada dalam pandangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'engkau' dipakai dalam pertanyaan langsung agar tetap alami dalam gaya Kitab Suci tanpa menjadi kuno; susunan kalimat mengikuti alur Yunani dengan 'ketika' tanpa memaksakan tanda titik dua.
