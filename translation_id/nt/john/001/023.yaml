  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: id
  text: Ia berkata, “Akulah suara seorang yang berseru di padang gurun[a], ‘Luruskanlah jalan Tuhan,’ seperti yang dikatakan Nabi Yesaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Akulah suara di padang gurun, dari seorang yang berseru.” Frasa Yunani ini dapat dianalisis dengan cara lain, tetapi teks utama mengikuti pembacaan yang paling alami di sini.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Ia berkata
  rationale: Pengantar ujaran naratif yang wajar dalam bahasa Indonesia dan sesuai dengan konteks dialog.
- source_word: Ἐγὼ
  choice: Akulah
  rationale: Bentuk ini menyampaikan penekanan pada pronomina eksplisit Yunani sekaligus tetap alami dalam pernyataan identitas.
- source_word: φωνὴ βοῶντος
  choice: suara orang yang berseru-seru
  rationale: Mencerminkan hubungan genitif yang paling alami antara 'suara' dan orang yang berseru; bentuk ulang 'berseru-seru' menyampaikan seruan lantang dan berkelanjutan secara idiomatis.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: Ungkapan baku dan mudah dipahami untuk kawasan sunyi atau tandus, serta mempertahankan gema kutipan kenabian.
- source_word: Εὐθύνατε
  choice: Luruskanlah
  rationale: Imperatif langsung yang alami dan mempertahankan citra membuat jalan menjadi lurus.
- source_word: τὴν ὁδὸν
  choice: jalan
  rationale: Mempertahankan citra harfiah dan daya metaforis istilah Yunani.
- source_word: κυρίου
  choice: Tuhan
  rationale: Pilihan baku bagi κύριος dalam konteks kutipan dari Yesaya, dengan tetap mempertahankan bobot teologisnya.
- source_word: καθὼς εἶπεν
  choice: seperti yang dikatakan
  rationale: Secara alami menyatakan kesesuaian dengan perkataan nubuat Yesaya.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: Nabi Yesaya
  rationale: Urutan yang paling alami dalam bahasa Indonesia untuk gelar dan nama, tanpa kehilangan informasi sumber.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Yesaya
  choice: Tuhan
  alternative: tuan
  rationale: Dalam kutipan Yesaya, 'Tuhan' mempertahankan acuan ilahi dan bobot perjanjian yang terkandung dalam sumber, sedangkan 'tuan' akan melemahkan atau mengaburkan acuan tersebut.
- issue: Hubungan frasa 'di padang gurun' dengan partisipel
  choice: orang yang berseru-seru di padang gurun
  alternative: suara di padang gurun dari orang yang berseru-seru
  rationale: Susunan utama merupakan pemahaman paling alami atas frasa Yunani dan tetap menjaga ambiguitas sintaksis yang nyata melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Akulah' mempertahankan penekanan identitas; 'berseru-seru' memberi daya profetis tanpa terdengar terlalu teknis. Tanda catatan kaki ditempatkan langsung sesudah pengantar ujaran sesuai cakupan alternatif sintaksis.
