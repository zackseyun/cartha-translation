id: JHN.1.12
reference: John 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: id
  text: Namun, kepada semua orang yang menerima-Nya, Dia memberikan hak[a] untuk menjadi anak-anak Allah, yaitu kepada mereka yang percaya kepada nama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “wewenang” atau “kuasa” untuk menjadi anak-anak Allah; kata Yunani ini dapat menunjuk pada kewenangan yang diberikan, hak, atau kemampuan.'
    reason: Alternatif leksikal untuk ἐξουσίαν dan rentang maknanya.
lexical_decisions:
- source_word: ὅσοι
  choice: semua orang yang
  rationale: Ungkapan relatif jamak ini mencakup seluruh kelompok yang dimaksud; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna kolektifnya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan dengan penolakan yang disebutkan pada ayat sebelumnya.
- source_word: ἔλαβον αὐτόν
  choice: menerima-Nya
  rationale: Dalam konteks ini, λαμβάνω berarti menyambut atau menerima Sang Firman, bukan mengambil secara fisik. 'Menerima-Nya' tetap luas dan tidak mempersempitnya menjadi sekadar persetujuan mental.
- source_word: ἔδωκεν
  choice: Dia memberikan
  rationale: Padanan langsung untuk tindakan memberi; nuansa penganugerahan atau pemberian kewenangan dinyatakan oleh objeknya, ἐξουσίαν.
- source_word: ἐξουσίαν
  choice: hak
  rationale: Dalam konteks ini, kata tersebut terutama menunjuk pada hak atau kewenangan yang diberikan untuk menjadi anak-anak Allah, bukan kekuatan mentah. Catatan kaki mempertahankan kemungkinan nuansa 'wewenang' dan 'kuasa'.
- source_word: τέκνα θεοῦ
  choice: anak-anak Allah
  rationale: τέκνα bersifat inklusif dan berarti anak-anak, bukan khusus anak laki-laki; bentuk jamak Indonesia mempertahankan cakupan tersebut.
- source_word: γενέσθαι
  choice: untuk menjadi
  rationale: Infinitif γίνομαι menyatakan masuk ke dalam keadaan atau status baru, sehingga 'menjadi' lebih tepat daripada sekadar 'berada'.
- source_word: τοῖς πιστεύουσιν
  choice: mereka yang percaya
  rationale: Partisipel kini menggambarkan orang-orang yang dicirikan oleh kepercayaan; susunan ini alami dan tetap verbal dalam bahasa Indonesia.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: kepada nama-Nya
  rationale: Frasa ini mempertahankan unsur 'nama' dan menyatakan kepercayaan yang diarahkan kepada pribadi serta identitas yang dinyatakan melalui nama-Nya. 'Kepada' lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'ke dalam'.
theological_decisions:
- issue: Hubungan antara 'menerima-Nya' dan 'percaya kepada nama-Nya'
  choice: Kedua ungkapan dipertahankan, dan ungkapan kedua disajikan sebagai penjelasan tentang siapa yang menerima-Nya.
  alternative: Melebur keduanya menjadi satu ungkapan karena dianggap sepenuhnya bersinonim.
  rationale: Teks Yunani mempertahankan kedua ungkapan. Menyajikan keduanya menjaga corak teologis Yohanes tanpa menetapkan bahwa hubungan keduanya lebih sederhana daripada yang dinyatakan sumber.
- issue: Makna istilah hubungan sebagai anak Allah
  choice: anak-anak Allah
  alternative: putra-putra Allah
  rationale: Sumber memakai τέκνα, bukan υἱοί. Karena itu, terjemahan tidak boleh mempersempit rujukannya menjadi laki-laki saja.
- issue: Nuansa ἐξουσίαν
  choice: hak, dengan alternatif leksikal dalam catatan kaki
  alternative: kuasa atau wewenang sebagai satu-satunya terjemahan utama
  rationale: Konteks mendukung hak atau kewenangan yang dianugerahkan, tetapi rentang kata Yunani juga dapat mencakup wewenang dan kuasa. Catatan kaki mempertahankan keluwesan itu tanpa mengaburkan teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Frasa penjelas 'yaitu mereka yang' mempertahankan hubungan appositif pada teks Yunani. Penanda catatan kaki ditempatkan sesudah 'hak', yaitu kata yang diterangkannya.
