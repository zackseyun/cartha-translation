  source_fidelity: 'Terjemahan dengan tepat menyampaikan urutan dan makna dasar Yunani: dua murid itu mendengar Yohanes sedang berbicara, kemudian mereka mengikuti Yesus. Bentuk “mendengarnya berbicara” secara wajar mengekspresikan ἤκουσαν ... λαλοῦντος, dan “mengikuti Yesus” mempertahankan baik arti gerak langsung maupun gema kemuridan tanpa mempersempitnya.'
