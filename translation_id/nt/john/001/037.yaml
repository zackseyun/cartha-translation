  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: id
  text: Kedua murid itu mendengarnya berbicara[a], lalu mereka mengikuti Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata “-nya” mengacu kepada Yohanes Pembaptis: kedua murid Yohanes mendengar dia berbicara.'
    reason: Menjelaskan acuan pronomina Yunani αὐτοῦ berdasarkan konteks langsung.
lexical_decisions:
- source_word: ἤκουσαν
  choice: mendengar
  rationale: Bentuk aoristis menyatakan peristiwa mereka mendengar ucapan itu; “mendengar” merupakan padanan Indonesia yang wajar tanpa menambahkan gagasan bahwa mereka menyimak dalam waktu lama.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: kedua murid itu
  rationale: Konstruksi ini menunjuk kembali kepada dua murid Yohanes Pembaptis dalam ayat sebelumnya. “Kedua murid itu” mengidentifikasi mereka secara alami dalam bahasa Indonesia, sedangkan unsur αὐτοῦ tetap tercermin melalui pronomina pada “mendengarnya” dan dijelaskan dalam catatan kaki.
- source_word: λαλοῦντος
  choice: berbicara
  rationale: Partisipel kini menunjukkan tindakan yang berlangsung bersamaan dengan tindakan mendengar. “Berbicara” bernada netral dan bermartabat.
- source_word: ἠκολούθησαν
  choice: mengikuti
  rationale: Kata ini langsung menggambarkan mereka berjalan mengikuti Yesus, sekaligus tetap memungkinkan gema makna menjadi pengikut tanpa memaksakan penafsiran itu.
- source_word: τῷ Ἰησοῦ
  choice: Yesus
  rationale: Datif menandai orang yang diikuti; idiom Indonesia yang alami adalah “mengikuti Yesus” tanpa preposisi tambahan.
theological_decisions:
- issue: Acuan αὐτοῦ dalam frasa tentang kedua murid dan pelaku yang berbicara
  choice: Dipahami sebagai Yohanes Pembaptis dan dijelaskan dalam catatan kaki.
  alternative: Membiarkan pronomina tanpa penjelasan sehingga secara sepintas dapat disangka mengacu kepada Yesus.
  rationale: Konteks langsung Yohanes 1:35–36 menyebut Yohanes berdiri bersama dua muridnya dan berbicara tentang Yesus. Penjelasan menjaga kesinambungan narasi tanpa memasukkan identitas yang tidak dinyatakan sebagai nama dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam teks Yunani serta membiarkan “mengikuti” memuat makna gerak harfiah dan kemungkinan gema kemuridan.
