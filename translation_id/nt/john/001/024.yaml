id: JHN.1.24
reference: John 1:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: id
  text: Mereka yang diutus itu berasal dari kalangan orang Farisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka diutus oleh orang-orang Farisi.” Secara lebih harfiah, bahasa Yunani menunjukkan bahwa mereka berasal dari kalangan orang Farisi.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam ayat ini Καί berfungsi sebagai penghubung wacana. Mengawali kalimat dengan “Dan” terasa kurang alami dalam bahasa Indonesia modern, sedangkan alur narasi tetap jelas tanpa penghubung eksplisit.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: mereka yang diutus itu
  rationale: Konstruksi perifrastis dengan partisipel perfektum dan ἦσαν menunjukkan orang-orang yang berada dalam keadaan telah diutus. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengubah gagasan verbal menjadi jabatan seperti “utusan”.
- source_word: ἐκ
  choice: berasal dari kalangan
  rationale: ἐκ terutama menandai sumber atau asal. “Berasal dari kalangan” mempertahankan makna bahwa mereka berasal dari kelompok Farisi, tanpa mempertegas agensi seolah-olah teks memakai penanda pelaku yang eksplisit.
- source_word: τῶν Φαρισαίων
  choice: orang Farisi
  rationale: Ini adalah sebutan baku dan mudah dipahami bagi kelompok Φαρισαῖοι dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan orang-orang yang diutus dengan kelompok Farisi
  choice: Mereka berasal dari kalangan orang Farisi.
  alternative: Mereka diutus oleh orang-orang Farisi.
  rationale: Frasa ἐκ τῶν Φαρισαίων secara langsung menandai asal atau sumber, bukan pelaku dengan konstruksi yang eksplisit. Terjemahan utama mempertahankan nuansa itu, sementara kemungkinan makna agensi dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan perbedaan antara asal kelompok dan agensi pengutusan.
