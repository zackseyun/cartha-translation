  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: id
  text: Yohanes menjawab mereka, “Aku membaptis dengan air. Di antara kamu[a] berdiri seseorang yang tidak kamu kenal,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di tengah kamu berdiri seseorang yang tidak kamu kenal.”
    reason: Alternatif leksikal untuk μέσος ὑμῶν, disajikan dalam seluruh klausa agar jelas dalam bahasa Indonesia.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: Yohanes menjawab mereka, katanya
  rationale: Mempertahankan verba jawaban dan fungsi partisip λέγων sebagai pengantar isi jawaban dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: βαπτίζω
  choice: membaptis
  rationale: Istilah baku yang sesuai dalam konteks ini; ‘mencelupkan’ akan mempersempit makna dan dapat memasukkan kekhususan denominasi yang tidak dituntut teks.
- source_word: ἐν ὕδατι
  choice: dengan air
  rationale: Dalam konstruksi ini ἐν dapat menyatakan sarana; ‘dengan air’ merupakan ungkapan Indonesia yang paling alami tanpa menentukan cara pelaksanaan baptisan.
- source_word: μέσος ὑμῶν
  choice: di antara kamu
  rationale: Menyampaikan kehadiran seseorang di tengah kelompok secara alami; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἕστηκεν
  choice: berdiri
  rationale: Bentuk perfek menyatakan keadaan kini sebagai hasil mengambil tempat; bentuk kini ‘berdiri’ menyampaikan daya statifnya dengan alami.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: seseorang yang tidak kamu kenal
  rationale: ‘Tidak kamu kenal’ mempertahankan makna umum οἶδα tanpa mempersempitnya menjadi sekadar ‘tidak mengenali’; ‘seseorang’ melengkapi konstruksi relatif secara alami tanpa menyebut identitasnya.
theological_decisions:
- issue: Identitas tokoh yang berdiri di antara mereka tetapi tidak disebut namanya
  choice: seseorang
  alternative: Mesias; Dia
  rationale: Walaupun konteks lebih luas menunjuk kepada Yesus, ayat ini sendiri belum menyebut identitas tokoh itu. Pilihan generik mempertahankan ketegangan naratif dan tidak menjelaskannya lebih awal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. ‘Aku’ dipertahankan dalam ucapan langsung Yohanes. Koma penutup dipakai karena ucapan berlanjut ke ayat berikutnya.
