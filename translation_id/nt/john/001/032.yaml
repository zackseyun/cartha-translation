  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: id
  text: Dan Yohanes memberi kesaksian dengan berkata, “Aku telah melihat Roh turun seperti burung merpati[a] dari surga[b], dan Roh itu tetap tinggal di atas-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sebagai seekor burung merpati.” Bahasa Yunani memungkinkan kedua ungkapan, tetapi paling alami menyatakan kemiripan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “keluar dari surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: bersaksi
  rationale: Kata ini menyatakan pemberian kesaksian. “Bersaksi” alami dalam bahasa Indonesia modern dan mempertahankan nuansa saksi yang terkandung dalam verba Yunani.
- source_word: λέγων
  choice: katanya
  rationale: Partisip ini memperkenalkan isi kesaksian Yohanes. “Katanya” menyampaikan fungsi tersebut secara ringkas dan alami.
- source_word: Τεθέαμαι
  choice: Aku telah melihat
  rationale: Bentuk perfektum menyatakan penglihatan yang sungguh dialami dan tetap relevan bagi kesaksian Yohanes. “Telah melihat” mempertahankan aspek itu tanpa memakai ungkapan kuno.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks Yohanes 1:32–33, rujukannya adalah Roh Kudus. Huruf kapital menandai rujukan ilahi tanpa menambahkan kata “Kudus” yang tidak terdapat dalam ayat ini.
- source_word: καταβαῖνον
  choice: turun
  rationale: Partisip ini menggambarkan gerak ke bawah. “Turun” lebih alami daripada “menurun” dalam bahasa Indonesia dan tetap tepat secara semantis.
- source_word: ὡς περιστερὰν
  choice: seperti burung merpati
  rationale: ὡς terutama menyatakan perbandingan atau kemiripan. Pilihan ini mempertahankan citra teks tanpa menyatakan bahwa Roh secara ontologis adalah seekor burung merpati.
- source_word: ἐξ οὐρανοῦ
  choice: dari surga
  rationale: Frasa ini menunjukkan asal gerakan dari surga. “Dari surga” paling alami dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἔμεινεν
  choice: tetap tinggal
  rationale: Verba μένω penting secara tematis dalam Injil Yohanes. “Tetap tinggal” mempertahankan gagasan keberlanjutan dengan bahasa Indonesia yang wajar.
- source_word: ἐπ’ αὐτόν
  choice: di atas-Nya
  rationale: ἐπί dengan akusatif di sini menggambarkan Roh berada pada atau di atas Yesus. “Di atas-Nya” mempertahankan gambaran spasial; kapitalisasi pronomina mengikuti konvensi bahasa Indonesia untuk rujukan kepada Yesus.
theological_decisions:
- issue: Identitas τὸ πνεῦμα
  choice: “Roh” merujuk kepada Roh Kudus
  alternative: “roh” sebagai roh yang tidak ditentukan atau impersonal
  rationale: Konteks langsung ayat 32–33 mengidentifikasikan Roh ini sebagai tanda ilahi yang turun dan tinggal pada Yesus. Namun, kata “Kudus” tidak ditambahkan karena tidak muncul dalam ayat 32.
- issue: Daya perbandingan ὡς περιστερὰν
  choice: Roh turun “seperti burung merpati”
  alternative: Roh turun “sebagai seekor burung merpati”
  rationale: ὡς secara alami menyatakan kemiripan. Terjemahan utama tidak menentukan apakah kemiripan itu menyangkut rupa, cara turun, atau keduanya, sehingga ambiguitas citranya tetap terpelihara.
- issue: Rujukan pronomina dalam ἐπ’ αὐτόν
  choice: “-Nya” merujuk kepada Yesus
  alternative: “dia” tanpa kapitalisasi
  rationale: Bentuk Yunani αὐτόν maskulin dan dalam konteks merujuk kepada Yesus, bukan kepada Roh yang secara gramatikal netral. Kapitalisasi adalah konvensi ortografis Indonesia dan tidak menambahkan gelar kristologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. Struktur kesaksian dipertahankan, sedangkan pilihan “turun” dan “katanya” dibuat agar mudah dipahami pembaca umum. Pengulangan “Roh itu” menghindari pronomina bergender yang tidak diperlukan dalam bahasa Indonesia dan memperjelas subjek verba “tetap tinggal”.
