  naturalness: “Mungkinkah ada sesuatu yang baik berasal dari Nazaret?” adalah bahasa Indonesia baku dan jelas, walaupun “dapat berasal” dapat dipakai untuk kelancaran. “Datanglah dan lihatlah” merupakan undangan langsung yang alami dan mempertahankan dua imperatif Yunani.
