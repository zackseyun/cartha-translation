  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: id
  text: Dan Natanael berkata kepadanya, “Mungkinkah ada sesuatu yang baik yang berasal dari Nazaret?” Filipus berkata kepadanya, “Datanglah dan lihatlah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam narasi bahasa Indonesia, “Lalu” menghubungkan ujaran ini dengan ayat sebelumnya secara alami tanpa memberi hubungan sebab-akibat yang tidak dinyatakan.
- source_word: εἶπεν αὐτῷ Ναθαναήλ
  choice: Natanael berkata kepadanya
  rationale: Susunan ini alami dalam bahasa Indonesia serta mempertahankan Natanael sebagai subjek dan pronomina datif sebagai lawan bicara.
- source_word: Ἐκ Ναζαρὲτ
  choice: dari Nazaret
  rationale: ἐκ menyatakan asal atau sumber; “dari Nazaret” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: Mungkinkah ada sesuatu yang baik
  rationale: δύναται menyatakan kemungkinan, τι ἀγαθόν berarti sesuatu yang baik, dan εἶναι dipertahankan dalam arti keberadaan melalui “ada”; bentuk ini alami sekaligus tidak mengganti “ada” dengan gagasan gerak “datang” yang tidak dinyatakan secara leksikal.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Filipus berkata kepadanya
  rationale: Present historis Yunani dialihkan menjadi bentuk naratif Indonesia yang tidak menandai kala secara morfologis; “berkata” terdengar wajar dalam konteks ini.
- source_word: Ἔρχου καὶ ἴδε
  choice: Mari dan lihatlah
  rationale: Dua imperatif dipertahankan sebagai undangan yang ringkas. “Lihatlah” menjaga makna literal dan resonansi tematis tindakan melihat dalam Injil Yohanes.
theological_decisions:
- issue: Nada pertanyaan Natanael mengenai Nazaret
  choice: Pertanyaan retoris yang menunjukkan keraguan tanpa tambahan penanda ejekan atau penghinaan
  alternative: “Adakah sesuatu yang baik yang dapat berasal dari Nazaret?” atau rumusan dengan nada sinis yang lebih tegas
  rationale: Teks Yunani menyiratkan keraguan, tetapi tidak secara eksplisit menandai sarkasme atau penghinaan. Terjemahan mempertahankan ketegangan itu tanpa menambah penilaian.
- issue: Makna εἶναι dalam pertanyaan
  choice: “ada”
  alternative: “datang” atau “berasal”
  rationale: εἶναι secara leksikal berarti “ada/berada,” sementara ἐκ Ναζαρέτ sudah menyatakan asal. Pilihan ini mempertahankan bentuk pertanyaan Yunani dan tidak mempersempitnya menjadi gagasan kedatangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mungkinkah” mempertahankan daya retoris pertanyaan; “Mari dan lihatlah” ringkas dan mudah dipahami, meskipun sedikit lebih formal daripada percakapan sehari-hari.
