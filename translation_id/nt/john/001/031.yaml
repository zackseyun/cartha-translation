id: JHN.1.31
reference: John 1:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: id
  text: Aku pun tidak mengenal Dia[a], tetapi aku datang membaptis dengan air supaya Dia dinyatakan kepada Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mengenali Dia.” Kata Yunani yang dipakai dapat menunjuk pada tidak mengenal seseorang atau tidak mengenali siapa dirinya; teks utama mempertahankan ungkapan yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Aku pun
  rationale: Bentuk gabungan καί + ἐγώ meneruskan kesaksian sebelumnya dan memberi penekanan ringan pada subjek; “Aku pun” menyampaikan kedua unsur itu secara alami.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: tidak mengenal Dia
  rationale: Bentuk imperfek menyatakan keadaan tidak mengetahui atau tidak mengenal pada masa lampau. Pilihan ini tetap luas dan tidak membatasi maknanya pada kegagalan mengenali identitas-Nya.
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai kontras antara ketidakkenalan Yohanes sebelumnya dan tujuan pelayanannya; “Namun” sesuai dengan register naratif yang bermartabat.
- source_word: ἵνα φανερωθῇ
  choice: supaya Dia dinyatakan
  rationale: Mempertahankan fungsi tujuan ἵνα dan bentuk pasif φανερωθῇ tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: τῷ Ἰσραήλ
  choice: kepada Israel
  rationale: Dativus ini secara wajar menyatakan pihak yang kepadanya Dia dinyatakan, dengan Israel dipertahankan sebagai rujukan kolektif.
- source_word: διὰ τοῦτο
  choice: untuk itulah
  rationale: Ungkapan ini menunjuk pada tujuan yang baru disebutkan dan secara idiomatis menegaskan alasan kedatangan Yohanes.
- source_word: ἦλθον ἐγὼ
  choice: aku datang
  rationale: Aoristus diterjemahkan sebagai tindakan lampau sederhana; pronomina eksplisit Yunani tercermin dalam “aku” dan susunan kalimat yang menegaskan alasan kedatangannya.
- source_word: ἐν ὕδατι
  choice: dalam air
  rationale: Mempertahankan nilai lokatif/instrumental terbuka dari ἐν dan ungkapan khas konteks Yohanes tanpa menetapkan doktrin khusus tentang cara baptisan.
- source_word: βαπτίζων
  choice: membaptis
  rationale: Partisip ini berlangsung bersamaan dengan “datang”; bentuk verba Indonesia menghasilkan ungkapan yang alami, “datang membaptis”.
theological_decisions:
- issue: Arti pernyataan Yohanes bahwa ia tidak mengenal Yesus
  choice: tidak mengenal Dia
  alternative: tidak mengenali Dia; belum mengetahui bahwa Dialah Mesias
  rationale: Teks Yunani tidak menentukan apakah yang dimaksud ialah tidak mempunyai pengenalan pribadi atau belum mengenali identitas mesianis-Nya. Terjemahan utama mempertahankan keluasan dan ketegangan tersebut.
- issue: Bentuk pasif pada φανερωθῇ
  choice: Dia dinyatakan
  alternative: Dia menyatakan diri; Allah menyatakan Dia
  rationale: Bentuk pasif dipertahankan agar terjemahan tidak menetapkan pelaku atau mengubahnya menjadi tindakan refleksif yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kesaksian yang lugas dan bermartabat. Huruf kapital pada “Dia” mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus. Susunan tujuan di depan dipilih agar hubungan ἵνα dan διὰ τοῦτο jelas serta alami dalam bahasa Indonesia.
