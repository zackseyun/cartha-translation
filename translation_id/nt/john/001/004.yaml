id: JHN.1.4
reference: John 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: id
  text: Di dalam Dia ada hidup, dan hidup itu adalah terang manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: Di dalam Dia
  rationale: Preposisi ἐν dengan datif secara wajar berarti “di dalam.” Kata ganti ini merujuk kepada Sang Firman dalam konteks sebelumnya; “Dia” mempertahankan rujukan personal tersebut.
- source_word: ζωὴ
  choice: hidup
  rationale: ζωή berarti “hidup.” Bentuk sederhana ini dipertahankan agar bobot teologisnya muncul dari konteks, tanpa mempersempitnya menjadi “hidup kekal” pada ayat ini.
- source_word: ἦν
  choice: ada
  rationale: Imperfek εἰμί menyatakan keberadaan. Dalam frasa Indonesia “di dalam Dia ada hidup,” kata “ada” lebih alami daripada “adalah” dan tetap menyampaikan makna sumber.
- source_word: ἡ ζωὴ
  choice: hidup itu
  rationale: 'Kata penunjuk “itu” secara alami mempertahankan fungsi anaforis artikelnya: hidup yang baru saja disebut.'
- source_word: τὸ φῶς
  choice: terang
  rationale: φῶς diterjemahkan “terang,” istilah alami dan bermartabat yang mempertahankan citra utama dalam prolog Yohanes. Dalam konstruksi predikatif Indonesia, kata sandang Yunani tidak memerlukan unsur definit eksplisit tambahan.
- source_word: τῶν ἀνθρώπων
  choice: manusia
  rationale: ἀνθρώπων bersifat generik dan menunjuk umat manusia, bukan hanya laki-laki. “Manusia” mempertahankan bentuk genitif secara ringkas dalam frasa “terang manusia” dan mencakup semua orang.
theological_decisions:
- issue: Rujukan dan daya personal αὐτῷ
  choice: Diterjemahkan secara personal sebagai “Dia,” dengan rujukan kepada Sang Firman.
  alternative: “di dalamnya,” jika λόγος dipahami secara abstrak atau impersonal
  rationale: Konteks langsung menggambarkan Sang Firman secara personal. Pilihan “Dia” mempertahankan daya tersebut tanpa menambahkan rumusan doktrinal yang tidak dinyatakan dalam ayat ini.
- issue: Cakupan generik ἀνθρώπων
  choice: Diterjemahkan “manusia,” yang mencakup umat manusia secara umum.
  alternative: “umat manusia” atau “orang-orang”
  rationale: Bentuk maskulin jamak Yunani digunakan secara generik. Bahasa Indonesia tidak perlu memakai istilah yang berkesan khusus laki-laki; “manusia” tepat, ringkas, dan mempertahankan kemungkinan bahwa terang itu berkaitan dengan seluruh umat manusia.
- issue: Hubungan hidup dan terang
  choice: 'Dipertahankan sebagai identifikasi: “hidup itu adalah terang manusia.”'
  alternative: Parafrasa seperti “hidup itu memberi terang kepada manusia”
  rationale: Teks memakai verba kopulatif ἦν dan tidak secara eksplisit mengatakan “memberi.” Terjemahan mempertahankan ketegangan metaforis dan identifikasi yang dibuat oleh sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan pengulangan “hidup” serta metafora “terang” tanpa parafrasa penjelas. Huruf kapital pada “Dia” mengikuti kebiasaan Indonesia untuk kata ganti yang merujuk kepada pribadi ilahi.
