id: JHN.1.42
reference: John 1:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: id
  text: Ia membawa Simon kepada Yesus. Yesus menatapnya lalu berkata, “Engkau adalah Simon, anak Yohanes.[a] Engkau akan disebut Kefas[b]” (yang diterjemahkan “Petrus”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “Yunus” sebagai ganti “Yohanes”; teks SBLGNT memuat “Yohanes”.
    reason: textual_variant
  - marker: b
    text: Kefas adalah nama Semitik yang berpadanan dengan Petrus dan mengandung arti “batu” atau “batu karang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Ia membawa Simon kepada Yesus
  rationale: ἄγω dengan πρός dan akusatif menyatakan membawa seseorang kepada orang lain. Nama “Simon” dipakai sebagai pengganti pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἐμβλέψας αὐτῷ
  choice: Yesus menatapnya
  rationale: ἐμβλέπω menunjukkan pandangan yang terarah atau penuh perhatian; “menatap” mempertahankan nuansa itu tanpa menjadi berlebihan.
- source_word: Σὺ εἶ Σίμων
  choice: Engkau adalah Simon
  rationale: Pronomina eksplisit σὺ memberi kesan langsung dan tegas. “Engkau” sesuai dengan tuturan langsung yang bermartabat.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: anak Yohanes
  rationale: Mengikuti bacaan SBLGNT Ἰωάννου. Dalam bahasa Indonesia, “anak Yohanes” lebih alami daripada “putra dari Yohanes” dan tetap menyatakan hubungan keturunan.
- source_word: σὺ κληθήσῃ
  choice: Engkau akan disebut
  rationale: Bentuk pasif futurum καλέω dipertahankan dengan “akan disebut”, termasuk nuansa pemberian nama.
- source_word: Κηφᾶς
  choice: Kefas
  rationale: Nama Semitik ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan dalam teks utama.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: yang diterjemahkan “Petrus”
  rationale: Frasa ini mempertahankan keterangan penerjemahan yang diberikan teks Yunani, sedangkan Πέτρος ditransliterasikan sebagai nama pribadi “Petrus”.
theological_decisions:
- issue: Keterangan nama Kefas/Petrus dan maknanya
  choice: Mempertahankan “Kefas” dan “Petrus” sebagai nama pribadi dalam teks utama
  alternative: Menerjemahkan nama itu secara langsung sebagai “Batu”
  rationale: Teks menyajikan nama Semitik lalu padanannya dalam bahasa Yunani. Mempertahankan kedua nama menjaga fungsi penamaan dan menghindari penetapan kesimpulan teologis tertentu; makna leksikalnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Menatap” mempertahankan daya ἐμβλέπω; “Engkau” menjaga kelangsungan sapaan langsung. Penanda catatan ditempatkan tepat setelah unsur yang dijelaskan.
