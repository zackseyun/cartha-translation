  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: id
  text: Natanael menjawab kepada-Nya, “Rabi, Engkaulah Anak Allah; Engkaulah Raja Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang alami untuk ἀποκρίνομαι dalam dialog dan tetap dekat dengan bentuk sumber.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mempertahankan sapaan kehormatan Yahudi dalam bentuk yang lazim di Alkitab bahasa Indonesia serta konteks Yahudi abad pertama.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Mempertahankan gelar definit dan bobot kristologis ungkapan Yunani tanpa perluasan atau pelemahan.
- source_word: βασιλεὺς
  choice: Raja
  rationale: Padanan langsung bagi βασιλεύς; dalam konstruksi predikatif ini ungkapan tersebut secara wajar dipahami sebagai gelar definit.
- source_word: τοῦ Ἰσραήλ
  choice: Israel
  rationale: Dalam bahasa Indonesia, bentuk gelar yang alami ialah 'Raja Israel'; ini menyampaikan hubungan genitif tanpa menambahkan tafsiran 'atas Israel'.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: Engkaulah … Engkaulah
  rationale: Pengulangan bentuk berpartikel -lah mempertahankan penekanan dan kesejajaran pengakuan dalam teks Yunani.
- source_word: Ναθαναήλ
  choice: Natanael
  rationale: Mengikuti bentuk nama yang sudah mapan dan mudah dikenali dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: Dia
  rationale: Pronomina objek diterjemahkan secara eksplisit; huruf kapital mengikuti konvensi bahasa Indonesia untuk rujukan kepada Yesus.
theological_decisions:
- issue: Daya kristologis pengakuan 'Anak Allah'
  choice: Mempertahankan gelar 'Anak Allah' sebagaimana dinyatakan teks.
  alternative: '''seorang anak Allah'' atau parafrasa yang mengurangi daya gelarnya'
  rationale: Konstruksi Yunani bersifat definit dan dalam Injil Yohanes memiliki bobot mesianis-kristologis; terjemahan tidak memperluasnya dengan rumusan kredal kemudian dan tidak melemahkannya.
- issue: Makna kerajaan-mesianis 'Raja Israel'
  choice: Menerjemahkannya sebagai gelar eksplisit 'Raja Israel'.
  alternative: '''raja atas Israel'' atau ''rajanya Israel'''
  rationale: Bentuk ini mempertahankan ungkapan gelar dalam sumber serta gaung harapan akan raja Mesias tanpa parafrasa tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. 'Engkaulah' dipakai untuk menjaga penekanan ganda pada σύ tanpa menghasilkan susunan yang kaku. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang harus ditandai dalam ayat ini.
