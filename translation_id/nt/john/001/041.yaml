id: JHN.1.41
reference: John 1:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: id
  text: Ia mula-mula menemui Simon, saudaranya sendiri, lalu berkata kepadanya, “Kami telah menemukan Mesias” (yang dalam bahasa Yunani disebut “Kristus”[a]).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kristus” berasal dari kata Yunani yang berarti “Yang Diurapi” dan merupakan padanan bagi gelar “Mesias.”
    reason: Menjelaskan makna χριστός dan fungsi klausa penjelas tanpa mengganti bentuk gelar yang terdapat dalam teks.
lexical_decisions:
- source_word: εὑρίσκει
  choice: menemui
  rationale: Bentuk kini historis Yunani menyatakan peristiwa dalam alur narasi. Bahasa Indonesia tidak menandai kala secara morfologis, dan “menemui” secara alami menyampaikan bahwa ia mendapatkan Simon untuk berbicara dengannya.
- source_word: οὗτος
  choice: Ia
  rationale: Kata tunjuk ini merujuk kepada Andreas dalam konteks sebelumnya. “Ia” merupakan rujukan anaforis yang alami tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: πρῶτον
  choice: mula-mula
  rationale: 'Mempertahankan makna urutan atau prioritas tindakan: hal pertama yang dilakukannya ialah menemui Simon.'
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: Simon, saudaranya sendiri
  rationale: “Saudaranya sendiri” mempertahankan penekanan ἴδιον, sedangkan susunan ini terdengar alami dalam bahasa Indonesia.
- source_word: λέγει αὐτῷ
  choice: lalu berkata kepadanya
  rationale: “Berkata kepadanya” dekat dengan ungkapan Yunani; “lalu” membuat urutan naratif yang tersirat menjadi jelas tanpa mengubah isinya.
- source_word: Εὑρήκαμεν
  choice: Kami telah menemukan
  rationale: '“Telah menemukan” mencerminkan aspek perfektum: penemuan itu sudah terjadi dan hasilnya tetap relevan pada saat perkataan ini disampaikan.'
- source_word: Μεσσίαν
  choice: Mesias
  rationale: Mentransliterasikan gelar Semitik Μεσσίας dengan bentuk baku dan umum dalam bahasa Indonesia.
- source_word: μεθερμηνευόμενον
  choice: yang jika diterjemahkan berarti
  rationale: Ungkapan ini mempertahankan fungsi penjelasan lintas bahasa dari teks Yunani dan tetap alami bagi pembaca Indonesia.
- source_word: χριστός
  choice: Kristus
  rationale: Dalam klausa penjelas ini, χριστός adalah padanan Yunani bagi Μεσσίας. “Kristus” mempertahankan perbedaan bentuk kedua gelar sebagaimana terdapat dalam sumber; arti harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Hubungan antara Μεσσίας dan χριστός
  choice: “Mesias” dalam ucapan dan “Kristus” dalam penjelasan kurung
  alternative: “Mesias” ... “Yang Diurapi”
  rationale: Teks sumber bukan sekadar mengulangi gelar yang sama, melainkan menerangkan istilah Semitik Μεσσίας dengan padanan Yunaninya, χριστός. Bentuk Indonesia “Mesias” dan “Kristus” mempertahankan hubungan historis tersebut, sementara catatan menjelaskan makna leksikalnya tanpa menghapus perbedaan bentuk dalam teks.
- issue: Identitas subjek οὗτος
  choice: Ia
  alternative: Andreas
  rationale: Konteks mengidentifikasi subjek sebagai Andreas, tetapi nama itu tidak diulang dalam ayat Yunani. Kata ganti mempertahankan kohesi konteks tanpa memasukkan nama secara eksplisit ke dalam teks ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar untuk pembacaan umum, dengan istilah tradisional “Mesias” dan “Kristus” dipertahankan karena keduanya mapan serta mencerminkan dua bentuk bahasa dalam sumber.
