id: JHN.1.5
reference: John 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: id
  text: Terang itu bersinar dalam kegelapan, dan kegelapan tidak mengalahkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kegelapan tidak memahaminya” atau “tidak menangkapnya.” Kata kerja Yunani dapat berarti mengalahkan atau menguasai, tetapi juga menangkap atau memahami.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: Terang itu
  rationale: Kata sandang Yunani dan konteks prolog menunjukkan terang yang sudah menjadi pokok tertentu; bentuk ini juga menjaga kontras tematis dengan kegelapan.
- source_word: σκοτίᾳ / σκοτία
  choice: dalam kegelapan / kegelapan
  rationale: Istilah yang sama dipertahankan pada kedua kemunculannya, dengan pemakaian tertentu pada kemunculan kedua sesuai kontras yang dipersonifikasikan dalam prolog.
- source_word: φαίνει
  choice: bersinar
  rationale: Bentuk kini indikatif menyatakan tindakan yang sedang dan terus berlaku tanpa perlu dibuat lebih berat menjadi 'terus-menerus bersinar'.
- source_word: κατέλαβεν
  choice: tidak mengalahkan
  rationale: Dalam gambaran pertentangan antara terang dan kegelapan, makna 'menguasai/mengalahkan' cocok sebagai bacaan utama; ambiguitas dengan makna 'memahami/menangkap' dipertahankan dalam catatan kaki.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina Yunani berjenis netral dan secara gramatikal merujuk kepada φῶς; akhiran '-nya' secara alami merujuk kembali kepada 'Terang itu' tanpa memaksakan rujukan personal.
theological_decisions:
- issue: Makna κατέλαβεν dalam pertentangan terang dan kegelapan
  choice: tidak mengalahkannya
  alternative: tidak memahaminya atau tidak menangkapnya
  rationale: Kata kerja Yunani dapat menyatakan tindakan menguasai atau mengalahkan, tetapi juga menangkap dalam arti memahami. Teks utama mengikuti gambaran konflik terang dan kegelapan, sedangkan kemungkinan makna kognitif dicatat agar ketegangan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Terang' dipilih alih-alih 'cahaya' untuk mempertahankan diksi biblis yang tetap umum dan kontras langsung dengan 'kegelapan'.
