  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: id
  text: Pada mulanya[a] Firman itu ada. Firman itu bersama Allah, dan Firman itu adalah Allah.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: b
    text: Atau, “Firman itu ilahi,” atau, “apa yang Allah adalah, demikian pula Firman.” Dalam klausa terakhir, kata Yunani untuk “Allah” berfungsi secara kualitatif, yang menerangkan siapa Firman itu, sambil membedakan Firman dari “Allah” yang disebut dalam klausa sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Pada mulanya
  rationale: Ungkapan ini secara alami menggemakan Kejadian 1:1 dalam bahasa Indonesia dan mempertahankan kaitannya dengan permulaan penciptaan.
- source_word: ἦν
  choice: ada / adalah
  rationale: 'Bentuk imperfek εἰμί menyatakan keberadaan Firman pada mulanya. Bahasa Indonesia memerlukan bentuk yang berbeda menurut konstruksinya: “ada” untuk keberadaan dan “adalah” untuk klausa predikatif terakhir.'
- source_word: ὁ λόγος
  choice: Firman itu
  rationale: “Firman” mempertahankan cakupan makna λόγος yang berkaitan dengan perkataan dan penyataan, sekaligus berfungsi sebagai sebutan pribadi dalam konteks Yohanes. Kata “itu” menandai nomina definit sebagaimana artikel Yunani.
- source_word: πρὸς τὸν θεόν
  choice: bersama Allah
  rationale: Dalam konteks ini, πρός dengan akusatif menyatakan kebersamaan relasional sekaligus pembedaan pribadi. “Bersama Allah” alami dalam bahasa Indonesia tanpa mempersempitnya menjadi sekadar kedekatan tempat.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Bentuk berartikel ini menunjuk secara definit kepada Allah. Dalam bahasa Indonesia, nama atau sebutan ilahi ini tidak memerlukan artikel tersendiri.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Firman itu adalah Allah
  rationale: Susunan Yunani menempatkan θεός tanpa artikel sebagai predikat sebelum verba, dengan daya terutama kualitatif. Terjemahan ini menegaskan hakikat keallahan Firman tanpa menyamakan pribadi Firman dengan pribadi yang disebut “Allah” dalam klausa sebelumnya; nuansa sintaksisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna θεός tanpa artikel dalam klausa terakhir
  choice: Firman itu adalah Allah
  alternative: Firman itu bersifat ilahi; atau, hakikat Allah juga merupakan hakikat Firman
  rationale: 'Predikat θεός terutama bersifat kualitatif: klausa itu menyatakan bahwa Firman sepenuhnya memiliki hakikat Allah, sementara klausa sebelumnya tetap membedakan Firman dari Allah yang bersama-Nya. Terjemahan utama mempertahankan rumusan yang langsung dan kuat; alternatif dicatat agar nuansa kualitatif bahasa Yunani tidak hilang.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat-kalimat pendek mempertahankan irama tiga klausa teks Yunani. “Firman” dipertahankan sebagai sebutan kristologis yang dikenal luas, sedangkan “bersama Allah” menyampaikan relasi tanpa menambahkan penafsiran spasial.
