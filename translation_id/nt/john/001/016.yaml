id: JHN.1.16
reference: John 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: id
  text: Sebab dari kepenuhan-Nya kita semua telah menerima, dan anugerah sebagai ganti anugerah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anugerah demi anugerah” atau “anugerah yang satu menyusul anugerah yang lain.” Frasa Yunani ini dapat menggambarkan anugerah yang datang berturut-turut, ketika satu pemberian menyusul pemberian lainnya, meskipun ἀντί secara lebih harfiah berarti “sebagai ganti.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata penghubung ini memberikan dasar atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan daya kausal-eksplanatorisnya secara alami dalam bahasa Indonesia.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: dari kepenuhan-Nya
  rationale: πλήρωμα menunjuk pada kepenuhan atau keseluruhan yang penuh. Bentuk ini mempertahankan sumber penerimaan dan hubungan kepemilikan dengan Sang Firman.
- source_word: ἡμεῖς πάντες
  choice: kita semua
  rationale: Pronomina eksplisit bersama πάντες memberi penekanan inklusif. “Kita semua” mempertahankan penekanan tersebut dan sesuai dengan suara kolektif penulis.
- source_word: ἐλάβομεν
  choice: telah menerima
  rationale: Aoristus menyatakan penerimaan yang sudah terjadi; “telah menerima” alami dalam bahasa Indonesia dan memungkinkan implikasi hasilnya tetap berlaku tanpa memaksakan aspek yang terlalu khusus.
- source_word: καὶ
  choice: dan
  rationale: Terjemahan langsung ini mempertahankan hubungan sintaksis tanpa menentukan bahwa frasa berikutnya semata-mata merupakan penjelasan atau penegasan.
- source_word: χάριν ἀντὶ χάριτος
  choice: anugerah sebagai ganti anugerah
  rationale: ἀντί pada dasarnya berarti “sebagai ganti” atau “menggantikan.” Terjemahan ini mempertahankan daya leksikal serta ketegangan antara penggantian dan rangkaian anugerah, sedangkan pembacaan yang lebih idiomatis dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna χάριν ἀντὶ χάριτος
  choice: anugerah sebagai ganti anugerah
  alternative: anugerah demi anugerah; anugerah yang satu menyusul anugerah yang lain
  rationale: Frasa ini memang ambigu. Teks utama mempertahankan arti dasar ἀντί dan tidak diam-diam memutuskan apakah yang dimaksud terutama penggantian, kesinambungan, atau kelimpahan berturut-turut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kepenuhan-Nya” mempertahankan istilah konseptual sumber, sedangkan susunan penutup sengaja agak padat agar ambiguitas Yunani tidak diselesaikan secara sepihak.
