    rationale: “Dia sudah ada sebelum aku” menafsirkan πρῶτός μου ἦν secara eksplisit sebagai praeksistensi, sedangkan bentuk Yunani yang padat juga memungkinkan nuansa prioritas atau keutamaan. Teks utama sebaiknya mempertahankan ambiguitas itu; praeksistensi dapat disebut dalam catatan kaki.
  - severity: low
    issue: Pembuka kalimat kurang idiomatis sepenuhnya.
    rationale: Menambahkan “orang” dalam “Dialah orang yang tentangnya aku berkata” membuat konstruksi rujukan ini lebih alami tanpa mengubah makna.
