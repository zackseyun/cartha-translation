revisions:
- from: Dialah yang tentangnya aku berkata, “Sesudah aku datang seorang laki-laki yang telah mendahului aku[a], sebab dia sudah ada sebelum aku[b].”
  to: Dialah orang yang tentangnya aku berkata, “Sesudah aku datang seorang laki-laki yang telah mendahului aku[a], sebab dia lebih dahulu daripada aku[b].”
  rationale: Revisi mengembalikan klausa terakhir kepada padanan Indonesia yang mempertahankan ambiguitas πρῶτός μου ἦν, sesuai teks Yunani dan jejak audit Inggris, sementara catatan kaki memberikan pembacaan temporal yang kuat dalam konteks tanpa memaksakannya ke dalam teks utama. Pembuka juga sedikit diperhalus agar lebih idiomatis.
