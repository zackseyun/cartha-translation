  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: id
  text: Dialah orang yang tentangnya aku berkata, “Sesudah aku datang seorang laki-laki yang telah mendahului aku[a], sebab dia lebih dahulu daripada aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menjadi lebih utama daripada aku.” Ungkapan Yunani dapat menyatakan bahwa seseorang berada di depan atau memiliki keutamaan, bukan hanya urutan waktu.
    reason: lexical_alternative
  - marker: b
    text: Atau “dia sudah ada sebelum aku.” Dalam konteks ini, ungkapan tersebut dapat menunjuk pada keberadaan Yesus sebelum Yohanes, walaupun bahasa Yunani menyatakannya secara lebih ringkas.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Dialah
  rationale: Bentuk penunjuk dengan kopula menegaskan identitas orang yang sedang ditunjuk. “Dialah” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: yang tentangnya aku berkata
  rationale: Dalam konstruksi ini ὑπὲρ οὗ berarti “tentang siapa” atau “mengenai siapa.” Bentuk ini mempertahankan hubungan rujukannya tanpa menambah tafsiran.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Sesudah aku datang
  rationale: 'ὀπίσω μου di sini terutama menyatakan urutan: orang itu datang sesudah Yohanes. Susunan ini juga mempertahankan bingkai perbandingan dalam ucapan Yohanes.'
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: ἀνήρ secara eksplisit menunjuk kepada seorang manusia laki-laki. Padanan ini akurat dan mudah dipahami, meskipun sedikit lebih eksplisit daripada “seorang.”
- source_word: ἔμπροσθέν μου γέγονεν
  choice: telah mendahului aku
  rationale: Gabungan ἔμπροσθεν dan bentuk perfektum γέγονεν menyatakan keadaan kini sebagai yang berada di depan atau memiliki keutamaan. “Telah mendahului aku” cukup alami dan tetap dapat mencakup urutan maupun keutamaan, tanpa membatasi maknanya hanya pada kedudukan.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan kausal dengan gaya yang wajar dan bermartabat.
- source_word: πρῶτός μου ἦν
  choice: dia sudah ada sebelum aku
  rationale: Ungkapan ini menyatakan bahwa dia lebih dahulu daripada Yohanes. “Sudah ada sebelum aku” menyampaikan prioritas temporal secara alami dalam bahasa Indonesia dan sesuai dengan daya ungkap konteks Yohanes.
theological_decisions:
- issue: Seberapa tegas klausa terakhir menyatakan praeksistensi Kristus
  choice: dia sudah ada sebelum aku
  alternative: dia lebih dahulu daripada aku
  rationale: Konteks Yohanes kuat mengarah pada keberadaan Yesus sebelum Yohanes, tetapi catatan kaki mempertahankan bentuk yang lebih ringkas dan kemungkinan nuansa keutamaan dalam ungkapan Yunani.
- issue: 'Makna ἔμπροσθέν μου γέγονεν: urutan atau keutamaan'
  choice: telah mendahului aku
  alternative: telah menjadi lebih utama daripada aku
  rationale: Terjemahan utama mempertahankan keluwesan ungkapan sumber, sedangkan alternatif menjelaskan kemungkinan makna keutamaan tanpa memasukkannya secara eksklusif ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti untuk Yesus tidak dikapitalisasi agar kapitalisasi tidak menambahkan penandaan teologis yang tidak terdapat dalam naskah Yunani. Tanda [a] dan [b] ditempatkan tepat setelah frasa yang dijelaskan.
