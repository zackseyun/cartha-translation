    rationale: Setelah teks utama memakai “lebih dahulu daripada aku,” catatan perlu menawarkan “dia sudah ada sebelum aku” sebagai pembacaan/penjabaran temporal yang mungkin, sambil menjelaskan bahwa konteks mendukung praeksistensi tanpa menjadikannya eksplisit dalam teks utama.
