  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: id
  text: Ketika ia memandang Yesus yang sedang berjalan, ia berkata, “Lihatlah, Anak Domba Allah!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: memandang
  rationale: Menyampaikan tindakan melihat dengan perhatian atau saksama, lebih kuat daripada sekadar ‘melihat’, tanpa menambahkan gagasan yang tidak tersurat.
- source_word: περιπατοῦντι
  choice: yang sedang berjalan
  rationale: Partisipel kini menggambarkan Yesus dalam keadaan sedang berjalan pada saat dipandang.
- source_word: λέγει
  choice: ia berkata
  rationale: Kala kini historis Yunani dialihkan secara alami ke bentuk lampau dalam narasi bahasa Indonesia.
- source_word: Ἴδε
  choice: Lihatlah
  rationale: Bentuk imperatif penunjuk yang mengarahkan perhatian pendengar; ‘Lihatlah’ alami, tegas, dan bermartabat.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Anak Domba Allah
  rationale: Mempertahankan metafora dan konstruksi genitif sumber tanpa menjelaskan hubungan genitif secara berlebihan.
theological_decisions:
- issue: Makna genitif dalam τοῦ θεοῦ
  choice: Allah
  alternative: yang berasal dari Allah / milik Allah
  rationale: Ungkapan tradisional dan langsung ‘Anak Domba Allah’ mempertahankan keluasan hubungan genitif serta tidak memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan klausa dibuat alami sambil mempertahankan urutan tindakan dan seruan pada teks Yunani.
