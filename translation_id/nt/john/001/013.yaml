id: JHN.1.13
reference: John 1:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: id
  text: yang dilahirkan bukan dari garis keturunan[a], bukan dari kehendak daging, bukan pula dari kehendak seorang laki-laki, melainkan dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah-darah”; ungkapan yang tidak lazim ini menunjuk pada keturunan alami atau asal-usul dari orang tua manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: yang
  rationale: Kata penghubung relatif ini merujuk kepada orang-orang dalam ayat sebelumnya dan mempertahankan kaitan sintaksis dengan wajar dalam bahasa Indonesia.
- source_word: ἐξ αἱμάτων
  choice: dari garis keturunan[a]
  rationale: Bentuk jamak harfiah 'darah-darah' merupakan ungkapan Yunani yang tidak lazim dan menunjuk pada asal-usul biologis atau keturunan. 'Garis keturunan' menyampaikan maknanya secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: θελήματος
  choice: kehendak
  rationale: '''Kehendak'' mempertahankan makna dan pengulangan struktur Yunani dengan bahasa yang jelas dan bermartabat.'
- source_word: σαρκὸς
  choice: daging
  rationale: '''Daging'' mempertahankan istilah konkret Yunani serta ketegangan maknanya; dalam konteks ini istilah tersebut berkaitan dengan dorongan atau proses perkembangbiakan manusia, bukan secara otomatis berarti ''tabiat berdosa''.'
- source_word: ἀνδρὸς
  choice: seorang laki-laki
  rationale: Kata Yunani menunjuk pada laki-laki dewasa dan di sini kemungkinan menyoroti peran laki-laki dalam proses memperanakkan. Bentuk ini mempertahankan makna tunggal tanpa mengubahnya menjadi istilah netral.
- source_word: ἐκ θεοῦ
  choice: dari Allah
  rationale: '''Dari Allah'' menyatakan sumber atau asal dan mempertahankan kontras dengan tiga frasa negatif sebelumnya.'
- source_word: ἐγεννήθησαν
  choice: dilahirkan
  rationale: Bentuk pasif aoris γεννάω paling alami diterjemahkan 'dilahirkan' dalam konteks ini; pilihan ini juga dapat mencakup gagasan diperanakkan tanpa memakai ungkapan yang kaku dalam bahasa Indonesia modern.
theological_decisions:
- issue: Kontras antara asal-usul manusiawi dan asal-usul dari Allah
  choice: Ayat ini menyatakan bahwa kelahiran atau asal mereka tidak bersumber pada keturunan alami maupun kehendak manusia, tetapi pada Allah.
  alternative: Ungkapan pertama dapat dipahami secara lebih sempit sebagai penolakan terhadap keistimewaan berdasarkan keturunan etnis; tradisi kemudian juga memberi pembacaan sakramental atau metafisis.
  rationale: Tiga penyangkalan berturut-turut paling wajar mengontraskan kelahiran manusia secara alami dengan kelahiran yang bersumber dari Allah. Terjemahan mempertahankan kontras tersebut tanpa menetapkan ajaran denominasi tertentu tentang kelahiran kembali.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga penyangkalan dipertahankan, dengan 'bukan pula' menandai kelanjutan secara alami. Istilah 'daging' sengaja dipertahankan agar citra dan ketegangan teologis teks sumber tidak dilunakkan.
