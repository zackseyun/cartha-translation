  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: id
  text: Ia datang ke milik-Nya sendiri[a], tetapi orang-orang-Nya sendiri tidak menerima[b] Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke apa yang menjadi milik-Nya sendiri.” Frasa Yunani pertama berbentuk netral jamak dan berbeda dari frasa berikutnya yang berbentuk maskulin jamak, yaitu “orang-orang-Nya sendiri.”
    reason: alternative_reading
  - marker: b
    text: Atau, “tidak menerima-Nya,” “tidak menerima Dia,” atau “tidak menyambut Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: kepada milik-Nya sendiri
  rationale: Bentuk netral jamak menunjuk pada apa yang menjadi milik-Nya—ranah, tempat kediaman, atau kepunyaan-Nya—bukan langsung pada orang. Ungkapan ini tetap ringkas dan dibedakan dari bentuk maskulin jamak berikutnya.
- source_word: ἦλθεν
  choice: datang
  rationale: Bentuk aorist dari ἔρχομαι secara lugas menyatakan kedatangan dan wajar diterjemahkan 'datang'.
- source_word: οἱ ἴδιοι
  choice: orang-orang kepunyaan-Nya sendiri
  rationale: Bentuk maskulin jamak menunjuk pada manusia. Terjemahan ini mempertahankan permainan kata ἴδιος sekaligus membedakannya dari τὰ ἴδια.
- source_word: παρέλαβον
  choice: menerima
  rationale: Dalam konteks ini παραλαμβάνω dapat berarti menerima, menyambut, atau mengakui seseorang. 'Menerima' mempertahankan keluasan maknanya tanpa mempersempit tafsir.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti ini merujuk kembali kepada Firman dalam konteks dan secara alami diterjemahkan dengan kata ganti orang ketiga.
theological_decisions:
- issue: Rujukan dan nuansa dua pemakaian ἴδιος
  choice: Frasa pertama menunjuk pada milik atau ranah-Nya sendiri, sedangkan frasa kedua menunjuk pada orang-orang kepunyaan-Nya sendiri.
  alternative: Kedua frasa menunjuk kepada umat-Nya; atau frasa pertama secara khusus berarti rumah atau lingkungan kediaman-Nya.
  rationale: Peralihan dari bentuk netral jamak τὰ ἴδια ke bentuk maskulin jamak οἱ ἴδιοι mengisyaratkan pembedaan sengaja antara kepunyaan/ranah dan orang-orang. Teks utama dan catatan mempertahankan ketegangan ini tanpa menentukan satu tempat atau kelompok secara terlalu sempit.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan 'sendiri' dipertahankan untuk mencerminkan pengulangan ἴδιος dan kontras antara kepunyaan/ranah dengan orang-orang, sementara 'tetapi' mengungkapkan daya kontras καί secara alami dalam konteks.
