  naturalness: «Orang-orang kepunyaan-Nya sendiri» terasa tidak alami dan terlalu nominal dalam bahasa Indonesia modern. «Orang-orang-Nya sendiri» adalah bentuk yang lebih lancar, tetap jelas menunjuk kepada orang, dan kontras gramatikal Yunani dijelaskan dalam catatan. Penanda catatan leksikal juga sebaiknya ditempatkan langsung sesudah «menerima», bukan sesudah «Dia».
  terminology: Kapitalisasi «Nya» dan «Dia» konsisten dengan register Alkitab yang bermartabat. «Milik-Nya» dan «orang-orang-Nya» menjaga pengulangan ἴδιος tanpa memaksakan diksi «kepunyaan» yang kaku.
