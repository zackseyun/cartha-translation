id: JHN.1.45
reference: John 1:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: id
  text: 'Filipus menemukan Natanael dan berkata kepadanya, “Kami telah menemukan dia yang tentangnya Musa menulis dalam Taurat dan para nabi juga menulis: Yesus, anak Yusuf, dari Nazaret.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: menemui
  rationale: Bentuk kini historis dialihkan ke bentuk naratif Indonesia yang alami. Dalam konteks ini, ‘menemui’ menyatakan bahwa Filipus mendapatkan Natanael untuk berbicara dengannya.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis diterjemahkan dengan bentuk naratif yang wajar dalam bahasa Indonesia.
- source_word: Ὃν ... ἔγραψεν
  choice: dia yang tentangnya ... menulis
  rationale: Ungkapan ini mempertahankan orang sebagai objek tulisan Musa dan para nabi, sambil memakai susunan bahasa Indonesia yang jelas dan alami.
- source_word: ἐν τῷ νόμῳ
  choice: dalam Kitab Taurat
  rationale: Yang dimaksud ialah kumpulan Kitab Suci yang dikaitkan dengan Musa, bukan hukum secara umum. ‘Kitab Taurat’ mudah dipahami pembaca Indonesia.
- source_word: οἱ προφῆται
  choice: para nabi
  rationale: Padanan baku yang dalam konteks ini menunjuk pada kesaksian para nabi dalam Kitab Suci.
- source_word: εὑρήκαμεν
  choice: kami telah menemukan
  rationale: Bentuk perfektum Yunani menyampaikan penemuan yang hasilnya masih berlaku pada saat Filipus berbicara.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: anak Yusuf
  rationale: Mempertahankan identifikasi sosial yang diucapkan Filipus tanpa menambahkan penjelasan kristologis yang tidak terdapat dalam ayat.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: dari Nazaret
  rationale: Kata depan ἀπό paling langsung menyatakan asal atau hubungan dengan suatu tempat; ‘dari Nazaret’ mencerminkan bentuk Yunani lebih tepat daripada sekadar gelar tempat.
- source_word: Φίλιππος / Ναθαναὴλ / Ἰησοῦν / Ἰωσὴφ / Μωϋσῆς
  choice: Filipus / Natanael / Yesus / Yusuf / Musa
  rationale: Nama-nama mengikuti bentuk baku yang telah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan ‘anak Yusuf’ dan kristologi
  choice: Mempertahankan ucapan Filipus sebagai ‘Yesus, anak Yusuf’.
  alternative: Yesus, yang dianggap anak Yusuf
  rationale: Teks melaporkan cara Filipus mengenali Yesus pada tahap ini. Terjemahan tidak menyisipkan harmonisasi dengan ajaran tentang kelahiran Yesus maupun menolak ajaran tersebut.
- issue: Kesaksian Musa dan para nabi
  choice: Musa dan para nabi sama-sama dinyatakan menulis tentang orang yang telah ditemukan.
  alternative: Menafsirkan pernyataan itu secara eksplisit sebagai nubuat mesianik tertentu
  rationale: Terjemahan mempertahankan klaim Filipus mengenai kesaksian Kitab Suci tanpa menentukan teks atau nubuat tertentu yang tidak disebut dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk kini historis Yunani disampaikan sebagai narasi lampau yang alami tanpa penanda waktu tambahan. Kata ganti ‘dia’ tidak dikapitalisasi agar terjemahan tidak memasukkan penafsiran teologis melalui tipografi.
