base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: id
  text: Maka mereka berkata kepadanya, “Siapakah engkau? Supaya kami dapat memberi jawaban kepada mereka yang mengutus kami, apakah yang engkau katakan tentang dirimu sendiri?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan yang bersifat simpulan atau peralihan dari percakapan sebelumnya; “maka” alami dalam narasi Indonesia dan mempertahankan alur wacana.
- source_word: εἶπαν ... αὐτῷ
  choice: mereka berkata kepadanya
  rationale: λέγω memperkenalkan ujaran langsung; ungkapan ini dekat dengan bentuk Yunani sekaligus wajar dalam bahasa Indonesia.
- source_word: Τίς εἶ;
  choice: Siapakah engkau?
  rationale: Pertanyaan langsung tentang identitas. Bentuk “siapakah engkau” mempertahankan ketegasan dan register bermartabat tanpa menambahkan penekanan.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Kami harus memberi jawaban
  rationale: 'ἵνα menyatakan tujuan, tetapi dalam konteks ini tujuan tersebut secara idiomatis tampil sebagai kebutuhan praktis para utusan. “Harus” membuat hubungan pragmatisnya jelas tanpa mengubah maksud: mereka memerlukan jawaban untuk dibawa kembali.'
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: kepada mereka yang mengutus kami
  rationale: Partisipel berartikel berfungsi substantival; terjemahan klausa relatif ini jelas, alami, dan mempertahankan tindakan pengutusan yang telah terjadi.
- source_word: τί λέγεις
  choice: Apa yang engkau katakan
  rationale: Bentuk kini menanyakan pernyataan atau kesaksian Yohanes mengenai dirinya; bentuk ini alami dan cukup dekat dengan susunan sumber.
- source_word: περὶ σεαυτοῦ
  choice: tentang dirimu sendiri
  rationale: περί dengan genitif menunjukkan pokok pembicaraan, sedangkan σεαυτοῦ bersifat refleksif; “sendiri” mempertahankan penekanan refleksif tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” dipakai karena ujaran langsung tunggal dan sesuai dengan register Alkitab Indonesia yang tetap mudah dipahami. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas penting yang perlu ditampilkan pada ayat ini.
