id: JHN.1.21
reference: John 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: id
  text: Mereka bertanya kepadanya, “Kalau begitu? Apakah engkau Elia?” Ia berkata, “Bukan.” “Apakah engkau Sang Nabi[a]?” Ia menjawab, “Bukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “nabi itu”; kemungkinan menunjuk kepada nabi seperti Musa yang dinantikan (Ul. 18:15, 18).
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: bertanya
  rationale: Bentuk aoris ini memperkenalkan pertanyaan langsung dalam narasi; “bertanya” merupakan padanan Indonesia yang wajar tanpa menambahkan kesan menginterogasi.
- source_word: Τί οὖν;
  choice: Kalau begitu?
  rationale: Ungkapan singkat dan eliptis ini menghubungkan pertanyaan lanjutan dengan penyangkalan sebelumnya. Bentuk “Kalau begitu?” mempertahankan kepadatan dan sifat menggantung dari bahasa Yunani tanpa menambahkan “siapakah engkau?” yang tidak dinyatakan.
- source_word: σὺ Ἠλίας εἶ
  choice: Apakah engkau Elia?
  rationale: Kata ganti σὺ mendapat tekanan dalam bahasa Yunani; penggunaan “engkau” dan susunan pertanyaan langsung menyampaikannya secara alami. Nama Ἠλίας ditulis menurut bentuk baku Indonesia, “Elia”.
- source_word: Οὐκ εἰμί
  choice: Bukan
  rationale: Jawaban Yunani berupa kopula yang dinegasikan secara ringkas. Dalam bahasa Indonesia, “Bukan” adalah jawaban idiomatis dan padat untuk menyangkal identitas, tanpa memasukkan pelengkap yang tidak ada.
- source_word: Ὁ προφήτης
  choice: Sang Nabi
  rationale: Artikel menunjuk kepada sosok nabi tertentu yang dikenal atau dinantikan, bukan sekadar seorang nabi. “Sang Nabi” mempertahankan kekhususan gelar tersebut tanpa menetapkan identitasnya di dalam teks utama.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bentuk kini historis memberi daya hidup pada narasi Yunani. Karena bahasa Indonesia tidak menandai kala pada verba, “Ia berkata” menyampaikan pergantian ujaran secara alami tanpa kehilangan isi temporal yang wajib dinyatakan.
- source_word: ἀπεκρίθη
  choice: Ia menjawab
  rationale: Padanan naratif langsung dan lazim bagi verba yang memperkenalkan jawaban.
- source_word: Οὔ
  choice: Bukan
  rationale: Partikel negatif mandiri ini menjadi jawaban penyangkalan. Karena pertanyaannya menyangkut identitas, “Bukan” lebih tepat daripada “Tidak” dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas “Sang Nabi”
  choice: Menerjemahkannya sebagai “Sang Nabi” tanpa penjelasan identitas dalam teks utama.
  alternative: “nabi itu,” “nabi seperti Musa,” atau “seorang nabi”
  rationale: Artikel Yunani menunjuk kepada sosok tertentu yang diharapkan, kemungkinan berkaitan dengan nabi seperti Musa dalam Ulangan 18:15, 18. Terjemahan mempertahankan rujukan yang khas sekaligus tidak menutup ambiguitas historis dan teologisnya.
- issue: Penyangkalan Yohanes bahwa dirinya adalah Elia
  choice: Menyajikan penyangkalan secara langsung sebagai “Bukan.”
  alternative: Memperluasnya menjadi “Aku bukan Elia secara harfiah” atau menyelaraskannya dengan penggambaran Yohanes sebagai Elia dalam bagian lain.
  rationale: Teks memuat penyangkalan langsung tanpa pembatasan. Terjemahan tidak memasukkan harmonisasi atau penjelasan teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. “Engkau” dipakai untuk menjaga nuansa dialog yang khidmat tanpa menjadi arkais. Dua jawaban “Bukan” mempertahankan ketegasan dan kependekan jawaban Yunani. Elipsis pada “Kalau begitu?” sengaja dipertahankan agar teks tidak menambahkan pertanyaan yang tidak dinyatakan.
