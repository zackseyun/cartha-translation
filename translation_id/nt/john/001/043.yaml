id: JHN.1.43
reference: John 1:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: id
  text: Keesokan harinya, Yesus hendak pergi ke Galilea. Ia menjumpai Filipus dan berkata kepadanya,[a] “Ikutlah Aku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, kata kerja yang diterjemahkan “menjumpai” dan “berkata” berbentuk kala kini yang dipakai untuk menghidupkan penuturan peristiwa lampau. Kata kerja bahasa Indonesia tidak menandai kala dengan bentuk seperti itu.
    reason: lexical_alternative
  - marker: b
    text: “Ikutlah Aku” dapat menunjuk pada tindakan menyertai Yesus secara fisik dan, dalam konteks Injil, pada panggilan untuk menjadi murid-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami menyatakan hari sesudah peristiwa sebelumnya dan mempertahankan urutan narasi.
- source_word: ἠθέλησεν
  choice: hendak
  rationale: Kata ini menyampaikan kehendak atau niat tanpa mempertegasnya menjadi keputusan yang telah dipertimbangkan secara resmi.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: pergi ke Galilea
  rationale: Secara harfiah ungkapan ini menyatakan gerak keluar menuju atau memasuki Galilea. Dalam bahasa Indonesia, 'pergi ke Galilea' paling alami dan tidak menambahkan titik keberangkatan yang tidak disebutkan.
- source_word: εὑρίσκει Φίλιππον
  choice: menjumpai Filipus
  rationale: '''Menjumpai'' mempertahankan makna menemukan atau bertemu dengan Filipus tanpa harus menyiratkan bahwa Yesus sebelumnya sedang mencarinya.'
- source_word: λέγει αὐτῷ
  choice: berkata kepadanya
  rationale: Padanan ini mempertahankan tindakan berbicara dan rujukan kepada Filipus secara jelas dan wajar.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Bentuk perintah ini secara alami dapat berarti menyertai Yesus secara nyata sekaligus menanggapi panggilan untuk menjadi pengikut-Nya; kedua lapisan makna tetap terbuka.
theological_decisions:
- issue: Cakupan perintah Yesus kepada Filipus
  choice: Ikutlah Aku
  alternative: Mari ikut bersama-Ku
  rationale: Terjemahan yang dipilih tidak membatasi perintah itu hanya pada perjalanan fisik ataupun menjabarkannya secara eksplisit sebagai rumusan teologis tentang pemuridan. Dengan demikian, ketegangan makna dalam konteks Injil tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang sederhana dan bermartabat. Nama 'Yesus' ditempatkan pada kalimat pertama agar pelaku 'hendak pergi' jelas dalam bahasa Indonesia; penyebutan ini tetap mewakili subjek yang dinyatakan secara eksplisit dalam teks Yunani pada klausa berikutnya. Kapitalisasi 'Aku' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus, tanpa mengubah isi gramatikal sumber.
