  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: id
  text: Ia ada di dunia, dan dunia mulai ada melalui dia[a], dan dunia tidak mengenal dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dunia dijadikan melalui dia.” Kata kerja Yunani ini berarti “menjadi ada” atau “mulai ada.”
    reason: lexical_alternative
  - marker: b
    text: “Tidak mengenal dia” juga dapat menyiratkan “tidak mengenali dia” atau “tidak mengakui dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: dunia
  rationale: Ketiga kemunculan κόσμος diterjemahkan secara konsisten sebagai “dunia”. Pilihan ini mempertahankan keluasan maknanya, yang dalam konteks Yohanes dapat mencakup tatanan ciptaan, dunia yang dihuni, dan manusia, tanpa mempersempitnya secara berlebihan.
- source_word: ἦν
  choice: ada
  rationale: Bentuk imperfek ἦν menyatakan keberadaan atau kehadiran yang berlanjut. “Ada” sederhana dan sekaligus mempertahankan kontras dengan ἐγένετο, “menjadi ada”.
- source_word: δι’ αὐτοῦ
  choice: melalui dia
  rationale: διά dengan bentuk genitif menyatakan perantaraan atau sarana. “Melalui dia” menyampaikan peran perantara Logos dan selaras dengan Yohanes 1:3.
- source_word: ἐγένετο
  choice: menjadi ada
  rationale: Dalam konteks ini γίνομαι menunjuk pada dunia yang mulai ada. “Menjadi ada” mempertahankan bahasa asal-usul dan membedakannya dari ἦν, “ada”.
- source_word: ἔγνω
  choice: mengenal
  rationale: γινώσκω pada dasarnya berarti “mengenal”. Dalam konteks ini maknanya dapat pula mencakup mengenali atau mengakui, tetapi “mengenal” menjaga kedalaman dan ambiguitas ungkapan Yunani.
- source_word: αὐτόν / αὐτοῦ
  choice: dia
  rationale: Kata ganti ini merujuk kepada Logos dalam konteks sebelumnya. “Dia” mempertahankan rujukan personal tanpa menambahkan sebutan yang tidak terdapat dalam ayat ini.
theological_decisions:
- issue: Subjek tersirat pada awal ayat
  choice: Menggunakan kata ganti personal “Ia”, yang merujuk kepada Logos dalam konteks langsung.
  alternative: Mengulang “Firman” atau memakai kata ganti nonpersonal.
  rationale: Bahasa Yunani tidak mengulang nomina subjek, tetapi konteks Yohanes 1:1–9 dengan jelas menyediakan Logos sebagai rujukannya. Kata ganti personal mempertahankan alur wacana tanpa menambahkan nomina ke dalam ayat.
- issue: Bahasa penciptaan dan hubungan dunia dengan Logos
  choice: “Dunia menjadi ada melalui dia.”
  alternative: “Dunia dijadikan melalui dia.”
  rationale: Pilihan ini mempertahankan perbedaan verbal antara keberadaan Logos (ἦν) dan mulainya keberadaan dunia (ἐγένετο), tanpa memasukkan istilah teologis tambahan.
- issue: Cakupan makna “tidak mengenal”
  choice: Mempertahankan “tidak mengenal” dalam teks utama.
  alternative: “Tidak mengenali” atau “tidak mengakui”.
  rationale: Konteks memungkinkan nuansa pengenalan dan pengakuan relasional. Teks utama mempertahankan keluasan γινώσκω, sedangkan kemungkinan nuansanya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan “dunia” dan rangkaian tiga klausa dengan “dan” dipertahankan untuk mencerminkan struktur serta tekanan retoris teks Yunani. Kata ganti “dia” ditulis menurut kaidah umum tanpa kapitalisasi penghormatan agar terjemahan tidak menambahkan penandaan teologis yang tidak dinyatakan oleh bentuk Yunani.
