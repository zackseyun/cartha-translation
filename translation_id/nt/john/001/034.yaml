base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: id
  text: Dan aku telah melihat dan telah bersaksi bahwa Dialah Yang Dipilih Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Anak Allah”, bukan “Yang Dipilih Allah”.
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Dan aku
  rationale: Bentuk gabungan καί + ἐγώ menyatakan kesinambungan sekaligus memberi penekanan pada subjek; 'Dan aku' mempertahankan keduanya secara alami.
- source_word: ἑώρακα
  choice: telah melihatnya
  rationale: Bentuk perfek menyatakan pengalaman melihat yang telah terjadi dan tetap menjadi dasar kesaksian Yohanes. Akhiran '-nya' memperjelas objek yang tersirat dari konteks tanpa menambah identitas baru.
- source_word: μεμαρτύρηκα
  choice: telah bersaksi
  rationale: Bentuk perfek menunjuk pada kesaksian yang telah diberikan dan tetap berlaku; ungkapan ini wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi kesaksian, bukan alasan.
- source_word: οὗτός
  choice: Dialah
  rationale: Demonstrativa ini menunjuk langsung kepada Yesus. 'Dialah' menyampaikan daya tunjuk dan penegasannya secara alami dalam bahasa Indonesia.
- source_word: ὁ ἐκλεκτός
  choice: Yang Dipilih
  rationale: Adjektiva berartikel ini dipakai secara substantival sebagai sebutan. 'Yang Dipilih' jelas bagi pembaca modern dan tidak membawa konotasi teknis yang dapat muncul pada istilah 'Yang Terpilih'.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Dalam susunan 'Yang Dipilih Allah', Allah dipahami sebagai pelaku yang memilih. Bentuk ini alami dalam bahasa Indonesia dan menyampaikan relasi genitif tanpa tambahan tafsiran seperti 'dari Allah'.
theological_decisions:
- issue: Gelar kristologis dalam Yohanes 1:34
  choice: Yang Dipilih Allah
  alternative: Anak Allah
  rationale: Teks SBLGNT yang diberikan berbunyi ὁ ἐκλεκτὸς τοῦ θεοῦ dan harus diterjemahkan secara langsung, bukan diselaraskan dengan varian yang lebih dikenal. Varian 'Anak Allah' tetap dicatat karena penting secara tekstual dan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pada 'Yang Dipilih' menandai pemakaiannya sebagai sebutan bagi Yesus, bukan sebagai kata sifat biasa.
