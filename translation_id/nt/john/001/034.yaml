  naturalness: “Dan aku telah melihat dan telah bersaksi bahwa Dialah Yang Dipilih Allah” adalah bahasa Indonesia baku, jelas, dan bernada wajar untuk register Alkitab. Penghilangan “-nya” juga membuat kalimat lebih dekat pada keluwesan objek tersirat dalam bahasa sumber.
  terminology: “Yang Dipilih Allah” secara alami menyampaikan gelar substantival ὁ ἐκλεκτός serta relasinya dengan Allah. Kapitalisasi gelar dan varian “Anak Allah” pada catatan kaki sudah tepat.
