id: JHN.1.50
reference: John 1:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Karena Aku berkata kepadamu bahwa Aku melihatmu di bawah pohon ara, apakah engkau percaya?[a] Engkau akan melihat hal-hal yang lebih besar daripada ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah karena Aku berkata kepadamu bahwa Aku melihatmu di bawah pohon ara maka engkau percaya?”
    reason: Alternatif susunan sintaksis yang memperjelas cakupan Ὅτι pertama tanpa mengubah pertanyaan menjadi pernyataan.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Yesus menjawab dan berkata kepadanya
  rationale: Mempertahankan formula naratif Yunani secara wajar dan bermartabat dalam bahasa Indonesia; kedua verba tetap diterjemahkan tanpa menambah makna.
- source_word: Ὅτι
  choice: Karena
  rationale: Ὅτι pertama paling wajar dipahami sebagai pengantar sebab. Susunan pertanyaannya tetap dapat dibaca secara retoris, sementara kemungkinan perluasan ‘Apakah karena ...’ dicatat dalam catatan kaki.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι kedua memperkenalkan isi perkataan Yesus, sehingga dibedakan dengan jelas dari ὅτι pertama.
- source_word: εἶδόν σε
  choice: Aku melihatmu
  rationale: Aoristus diterjemahkan dengan bentuk lampau kontekstual yang alami dalam bahasa Indonesia tanpa memaksakan aspek tambahan.
- source_word: ὑποκάτω τῆς συκῆς
  choice: di bawah pohon ara
  rationale: Padanan konkret dan lazim yang mempertahankan gambaran sumber.
- source_word: πιστεύεις
  choice: apakah engkau percaya?
  rationale: Mempertahankan bentuk pertanyaan dan istilah khas Yohanes tentang percaya; ‘engkau’ memberi ragam yang dignified tanpa menjadi arkais.
- source_word: μείζω τούτων
  choice: hal-hal yang lebih besar daripada ini
  rationale: Menerjemahkan bentuk komparatif netral jamak secara alami serta mempertahankan acuan jamaknya.
- source_word: ὄψῃ
  choice: Engkau akan melihat
  rationale: Menyampaikan bentuk futurum secara langsung dan modern.
theological_decisions:
- issue: Daya pertanyaan πιστεύεις; dan hubungan kausal Ὅτι
  choice: 'Diterjemahkan sebagai pertanyaan retoris yang sungguh: ‘Karena ... apakah engkau percaya?’'
  alternative: ‘Apakah karena Aku berkata kepadamu ... maka engkau percaya?’ atau pembacaan sebagai pernyataan
  rationale: Teks Yunani mendukung pertanyaan, tetapi tidak menentukan secara mutlak tingkat teguran yang tersirat. Terjemahan utama tidak mempertajamnya menjadi kecaman; susunan alternatif yang lebih eksplisit dicatat agar ambiguitas sintaksis tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘Aku’ dan ‘engkau’ dipakai dalam ucapan langsung untuk menjaga keluhuran yang tetap mudah dipahami. Tanda catatan kaki ditempatkan tepat setelah pertanyaan yang memiliki alternatif sintaksis.
