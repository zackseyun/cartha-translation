revisions:
- from: Firman itu menjadi manusia dan tinggal di antara kita.[a] Kita telah menyaksikan kemuliaan-Nya, yaitu kemuliaan sebagai Anak Tunggal yang berasal dari Bapa,[b] penuh dengan anugerah dan kebenaran.
  to: Firman itu menjadi manusia dan tinggal di antara kita.[a] Kami telah melihat kemuliaan-Nya, kemuliaan yang dimiliki Anak Tunggal dari Bapa. Firman itu penuh dengan anugerah dan kebenaran.[b]
  rationale: Revisi memperjelas bahwa “penuh dengan anugerah dan kebenaran” menerangkan Firman, sebagaimana didukung bentuk nominatif πλήρης, dan memperbaiki kelancaran hubungan antara kemuliaan dan Anak Tunggal. Catatan kaki dipindahkan ke akhir kalimat agar jangkar b tetap berkaitan dengan “Anak Tunggal,” sambil tidak mengaburkan subjek frasa akhir.
