  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: id
  text: Firman itu menjadi manusia dan tinggal di antara kita.[a] Kami telah melihat kemuliaan-Nya, kemuliaan yang dimiliki Anak Tunggal dari Bapa. Firman itu penuh dengan anugerah dan kebenaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berkemah di antara kita”; kata kerjanya menggemakan gambaran kemah atau Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: “Anak Tunggal” dapat juga diterjemahkan “Anak yang unik”; menurut terjemahan tradisional, “Anak yang diperanakkan satu-satunya.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Firman
  rationale: Mempertahankan gelar khas dalam prolog Yohanes serta keluasan maknanya, tanpa menyempitkannya menjadi sekadar “pesan” atau konsep abstrak.
- source_word: σὰρξ
  choice: manusia
  rationale: Dalam konteks ini σάρξ menunjuk pada keberadaan manusia yang nyata dan bertubuh. “Menjadi manusia” menyampaikan maksud itu secara alami dalam bahasa Indonesia modern; “menjadi daging” terlalu mudah disalahpahami secara jasmani-material semata.
- source_word: ἐγένετο
  choice: menjadi
  rationale: Mengungkapkan perubahan keadaan yang dinyatakan teks secara langsung dan wajar.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: tinggal di antara kita
  rationale: Padanan yang alami dan jelas. Gaung gambaran kemah suci tetap dicatat dalam catatan kaki.
- source_word: ἐθεασάμεθα
  choice: kita telah menyaksikan
  rationale: Menunjukkan pengamatan langsung dan kesaksian para penutur dengan bahasa Indonesia yang wajar.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Padanan baku yang mempertahankan bobot teologis dan kesinambungan istilah dalam tulisan Yohanes.
- source_word: μονογενοῦς
  choice: Anak Tunggal
  rationale: Dalam hubungan dengan πατρός, kata sifat ini secara kontekstual menunjuk kepada Anak yang unik dan satu-satunya. “Anak Tunggal” ringkas, alami, dan mapan dalam bahasa Indonesia.
- source_word: παρὰ πατρός
  choice: yang berasal dari Bapa
  rationale: Menyampaikan asal dan relasi yang dinyatakan oleh παρά dalam konteks ini tanpa memperluas maknanya.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: penuh dengan anugerah dan kebenaran
  rationale: Menerjemahkan ungkapan secara langsung serta mempertahankan kaitannya dengan bahasa perjanjian tentang kasih karunia dan kebenaran.
theological_decisions:
- issue: Makna inkarnasi dalam σὰρξ ἐγένετο
  choice: menjadi manusia
  alternative: menjadi daging
  rationale: Pilihan utama mengungkapkan bahwa Firman benar-benar memasuki keberadaan manusia yang bertubuh, tanpa menimbulkan kesan bahwa Ia berubah menjadi materi daging semata.
- issue: Gambaran kemah suci dalam ἐσκήνωσεν
  choice: tinggal di antara kita
  alternative: berkemah di antara kita
  rationale: Teks utama mengutamakan kejelasan dan kewajaran, sedangkan kemungkinan gaung kehadiran Allah dalam kemah suci dipertahankan dalam catatan kaki.
- issue: Arti kristologis μονογενοῦς
  choice: Anak Tunggal
  alternative: Anak satu-satunya; Anak yang diperanakkan satu-satunya
  rationale: Terjemahan ini mempertahankan keunikan relasi Anak dengan Bapa. Catatan kaki menyajikan alternatif historis tanpa memaksakan gagasan tentang proses kelahiran biologis ke dalam kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Bentuk “kita” mengikuti sudut pandang kesaksian penulis. Kapitalisasi pada “Firman”, “Anak Tunggal”, dan “Bapa” menandai gelar atau rujukan personal dalam konteks tanpa menambahkan penafsiran denominatif.
