id: JHN.1.17
reference: John 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: id
  text: Sebab hukum Taurat diberikan melalui Musa; anugerah dan kebenaran datang melalui Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan tradisional, “Yesus Kristus.”
    reason: Mencatat bentuk tradisional untuk Ἰησοῦ Χριστοῦ sambil mempertahankan terjemahan gelar Χριστός dalam teks utama.
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks ini, ὅτι memperkenalkan penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan penjelas-kausal itu secara alami.
- source_word: ὁ νόμος
  choice: hukum Taurat
  rationale: Ungkapan ini merujuk pada hukum yang disampaikan melalui Musa. “Hukum Taurat” merupakan ungkapan Indonesia yang jelas dan lazim tanpa menambahkan penafsiran di luar konteks.
- source_word: διὰ Μωϋσέως
  choice: melalui Musa
  rationale: διά dengan bentuk genitif menyatakan perantaraan; “melalui” mempertahankan kesejajaran dengan frasa mengenai Yesus.
- source_word: ἐδόθη
  choice: diberikan
  rationale: Bentuk pasif aoris ini secara langsung berarti “diberikan” dan tidak menyebut pelaku yang tidak dinyatakan dalam teks.
- source_word: ἡ χάρις
  choice: anugerah
  rationale: “Anugerah” menyampaikan pemberian atau kemurahan ilahi dalam konteks Yohanes dengan bahasa Indonesia modern dan bermartabat.
- source_word: ἡ ἀλήθεια
  choice: kebenaran
  rationale: Pilihan ini mempertahankan makna luas ἀλήθεια dalam Yohanes dan kaitannya dengan Yohanes 1:14 tanpa mempersempitnya menjadi sekadar kesetiaan atau realitas.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: “Melalui” mempertahankan gagasan perantaraan, sedangkan Χριστός diterjemahkan sebagai gelar “Sang Mesias” agar maknanya tetap terlihat dalam bahasa Indonesia.
- source_word: ἐγένετο
  choice: datang
  rationale: Dalam pertentangan dengan “diberikan,” kata ini menyatakan bahwa anugerah dan kebenaran hadir dalam sejarah melalui Yesus; “datang” alami dan tidak menyiratkan bahwa keduanya baru mulai ada secara mutlak.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Χριστός mempunyai makna gelar, yaitu Mesias. Terjemahan utama mempertahankan makna gelar tersebut, sementara bentuk tradisional dicatat tanpa meniadakan kemungkinan bahwa rangkaian nama-gelar ini telah memiliki sifat seperti nama diri.
- issue: Hubungan antara hukum Taurat dengan anugerah dan kebenaran
  choice: Mempertahankan dua klausa sejajar tanpa menambahkan kata pertentangan
  alternative: Menambahkan “tetapi” sebelum “anugerah dan kebenaran”
  rationale: Teks Yunani menempatkan kedua klausa secara berdampingan tanpa konjungsi pertentangan. Tanda titik koma menjaga kontras retorisnya tanpa memperkerasnya menjadi pertentangan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Hukum Taurat” serta “Sang Mesias” mudah dipahami pembaca umum. Titik koma mempertahankan struktur dua klausa Yunani dan kontrasnya tanpa memasukkan kata “tetapi” yang tidak terdapat dalam sumber.
