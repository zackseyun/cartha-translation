id: JHN.1.39
reference: John 1:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: id
  text: Ia berkata kepada mereka, “Datanglah, dan kamu akan melihat.” Maka mereka datang dan melihat di mana Ia tinggal, lalu mereka tinggal bersama-Nya pada hari itu. Waktu itu kira-kira jam kesepuluh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jika dihitung sejak matahari terbit, kira-kira pukul 16.00; sebagian orang memahaminya menurut penghitungan Romawi sebagai kira-kira pukul 10.00.
    reason: Menjelaskan dua kemungkinan utama penghitungan waktu tanpa menetapkan salah satunya di dalam teks.
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Bentuk kini historis λέγει dialihkan ke bentuk lampau naratif yang wajar dalam bahasa Indonesia, tanpa mengubah urutan peristiwa.
- source_word: Ἔρχεσθε
  choice: Datanglah
  rationale: Imperatif jamak ini merupakan undangan langsung. Bentuk “Datanglah” alami, jelas, dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: ὄψεσθε
  choice: kamu akan melihat
  rationale: Mempertahankan bentuk futur dan kaitan verbal dengan εἶδαν; “kamu” dipahami sebagai jamak dari konteks.
- source_word: ἦλθαν οὖν
  choice: Maka mereka datang
  rationale: οὖν menyatakan kelanjutan atau akibat wajar, sedangkan ἦλθαν dipertahankan secara formal sebagai “datang” sesuai sudut pandang narasi Yunani.
- source_word: εἶδαν
  choice: melihat
  rationale: Padanan langsung yang mempertahankan gema dengan ucapan “kamu akan melihat”.
- source_word: ποῦ μένει
  choice: di mana Ia tinggal
  rationale: Dalam konteks ini μένω menunjuk pada tempat Yesus sedang tinggal; ungkapan Indonesia ini alami tanpa menentukan apakah tempat itu penginapan sementara atau kediaman tetap.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: mereka tinggal bersama-Nya
  rationale: “Bersama-Nya” menyampaikan kedekatan atau kebersamaan yang dinyatakan παρά dengan datif, sementara “tinggal” mempertahankan pengulangan μένω.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: pada hari itu
  rationale: Menerjemahkan frasa waktunya tanpa menambahkan “sepanjang” atau “sisa” yang tidak tersurat.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Waktu itu kira-kira jam kesepuluh
  rationale: Mempertahankan ungkapan waktu sumber dan ketidakpastian yang ditandai ὡς, tanpa memilih sistem penghitungan jam tertentu.
theological_decisions:
- issue: Penghitungan “jam kesepuluh”
  choice: Ungkapan “jam kesepuluh” dipertahankan dalam teks utama.
  alternative: Sekitar pukul 16.00 jika dihitung sejak matahari terbit, atau sekitar pukul 10.00 menurut penghitungan Romawi.
  rationale: Teks Yunani tidak menyebut sistem penghitungan waktu yang digunakan. Mempertahankan ungkapan literal menjaga ambiguitas historis dan menghindari penyelesaian perdebatan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. Kapitalisasi kata ganti untuk Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Pengulangan “melihat” dan “tinggal” sengaja dipertahankan untuk mencerminkan hubungan leksikal dalam teks Yunani.
