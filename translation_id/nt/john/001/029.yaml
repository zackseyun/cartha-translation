id: JHN.1.29
reference: John 1:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: id
  text: Keesokan harinya, Yohanes melihat Yesus datang ke arahnya dan berkata, “Lihatlah, Anak Domba Allah yang menghapus dosa dunia!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Keesokan harinya
  rationale: Ungkapan alami dalam bahasa Indonesia untuk penanda waktu pada hari berikutnya.
- source_word: βλέπει
  choice: melihat
  rationale: Mempertahankan bentuk kini historis Yunani secara wajar dalam narasi Indonesia, dengan subjek Yohanes dibuat eksplisit demi kejelasan konteks.
- source_word: Ἴδε
  choice: Lihatlah
  rationale: Seruan deiktis yang alami, bermartabat, dan mengarahkan perhatian pendengar kepada Yesus.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Anak Domba Allah
  rationale: Padanan mapan yang mempertahankan metafora dan hubungan genitif sumber tanpa menafsirkan lebih jauh.
- source_word: ὁ αἴρων
  choice: yang menghapus
  rationale: Menyampaikan tindakan menyingkirkan atau mengambil dosa; 'menghapus' alami dalam bahasa Indonesia dan tidak memaksakan mekanisme teologis tertentu.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: dosa dunia
  rationale: Mempertahankan bentuk tunggal 'dosa' dan cakupan 'dunia' sebagaimana teks Yunani.
theological_decisions:
- issue: Makna αἴρων dalam hubungan dengan dosa
  choice: menghapus
  alternative: menanggung / mengangkat
  rationale: Kata Yunani dapat mencakup mengangkat, membawa, atau menyingkirkan. 'Menghapus' menyampaikan hasil tindakan tanpa secara eksklusif menetapkan bahwa frasa ini hanya berarti memikul hukuman atau sekadar membawa pergi.
- issue: Makna gelar 'Anak Domba Allah'
  choice: Metafora dipertahankan tanpa penjelasan tambahan
  alternative: Menambahkan rujukan eksplisit kepada Paskah atau korban penghapus dosa
  rationale: Teks sendiri tidak menguraikan satu latar simbolis tertentu; mempertahankan metafora menjaga keluasan gema kitabiah dan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama 'Yohanes' dieksplisitkan karena subjek verba Yunani tersirat dari konteks, sehingga ayat dapat dipahami dengan lancar tanpa mengubah referennya.
