id: JHN.1.2
reference: John 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: id
  text: Ia pada mulanya bersama dengan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia inilah yang pada mulanya bersama dengan Allah.”
    reason: Alternatif leksikal yang mencerminkan secara lebih eksplisit bentuk penunjuk οὗτος.
lexical_decisions:
- source_word: οὗτος
  choice: Ia
  rationale: Kata penunjuk ini merujuk kembali kepada Sang Firman dalam ayat 1. Dalam bahasa Indonesia, “Ia” secara alami mempertahankan rujukan personal tersebut; bentuk yang lebih harfiah, “Dia inilah,” dicatat sebagai alternatif.
- source_word: ἦν
  choice: pada mulanya bersama dengan
  rationale: Bentuk imperfek εἰμί menyatakan keadaan yang berlangsung dan secara alami diterjemahkan melalui konstruksi “Ia ... bersama dengan Allah”; kopula “adalah” tidak diperlukan sebelum frasa preposisional dalam bahasa Indonesia.
- source_word: ἐν ἀρχῇ
  choice: pada mulanya
  rationale: Ungkapan ini mempertahankan gema Kejadian 1:1 dan kesinambungan langsung dengan Yohanes 1:1.
- source_word: πρὸς
  choice: bersama dengan
  rationale: Dalam konteks ini, πρός dengan akusatif menyatakan kedekatan sekaligus relasi dan pembedaan. “Bersama dengan” alami dalam bahasa Indonesia dan tidak memperinci relasi itu melampaui teks.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Artikel Yunani tidak perlu diterjemahkan tersendiri. “Allah” adalah padanan baku dan alami bagi θεός sebagai sebutan bagi satu-satunya Allah dalam konteks ini.
theological_decisions:
- issue: Rujukan οὗτος dalam hubungannya dengan Yohanes 1:1
  choice: Diterjemahkan secara personal sebagai “Ia,” merujuk kembali kepada Sang Firman.
  alternative: “Dia inilah”
  rationale: Ayat ini merangkum dan menegaskan kembali keberadaan serta relasi Sang Firman yang disebut dalam ayat 1. “Ia” menjaga rujukan personal tanpa menambahkan rumusan doktrinal.
- issue: Makna πρὸς τὸν θεόν
  choice: “bersama dengan Allah”
  alternative: “menghadap Allah” atau “di hadirat Allah”
  rationale: Terjemahan ini mempertahankan kedekatan relasional dan pembedaan antara Sang Firman dan Allah, tanpa menentukan kategori metafisis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Ia” dipilih sebagai pronomina naratif formal; “pada mulanya” mempertahankan gema sastra Kejadian 1:1. Penanda catatan kaki ditempatkan dalam teks utama.
