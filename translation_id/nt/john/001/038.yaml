id: JHN.1.38
reference: John 1:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: id
  text: Lalu Yesus berpaling dan melihat mereka sedang mengikuti-Nya. Ia berkata kepada mereka, “Apa yang kalian cari?[a]” Mereka berkata kepada-Nya, “Rabi” (yang berarti “Guru”)[b], “di manakah Engkau tinggal?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Apa yang kalian upayakan untuk temukan?” Kata Yunani ini dapat menunjuk pada pencarian biasa, tetapi dalam narasi Yohanes mungkin juga memiliki makna yang lebih dalam.
    reason: lexical_alternative
  - marker: b
    text: “Rabi” adalah gelar Ibrani/Aram yang berarti “Guru.”
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan secara lebih harfiah “di manakah Engkau tetap?” Kata Yunani yang sama sering diterjemahkan “tetap” di bagian-bagian lain dalam Injil Yohanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: berpaling
  rationale: Partisip aoristus ini menyatakan tindakan Yesus berbalik ke arah kedua orang itu sebelum berbicara; “berpaling” alami dan tidak menentukan arah gerak secara berlebihan.
- source_word: θεασάμενος
  choice: melihat
  rationale: Kata ini menyatakan pengamatan visual yang disengaja. “Melihat” ringkas dan wajar dalam rangkaian tindakan ini.
- source_word: ἀκολουθοῦντας
  choice: sedang mengikuti-Nya
  rationale: Partisip kini menunjukkan tindakan yang sedang berlangsung. “Mengikuti” mempertahankan arti harfiah sekaligus kemungkinan nuansa awal pemuridan.
- source_word: Τί ζητεῖτε;
  choice: Apa yang kalian cari?
  rationale: ζητέω dapat berarti mencari, menginginkan, atau berusaha menemukan. “Cari” merupakan ungkapan Indonesia yang alami dan tetap dapat memuat pertanyaan yang lebih mendalam dalam narasi Yohanes.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Gelar Semitik ini ditransliterasikan karena teks sendiri langsung memberikan artinya.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: yang berarti “Guru”
  rationale: Ungkapan ini adalah penjelasan narator bagi pembaca yang tidak mengenal gelar tersebut. “Yang berarti” menyampaikan fungsi penjelasannya secara alami; bentuk vokatif Yunani dipahami sebagai sapaan.
- source_word: ποῦ μένεις;
  choice: di manakah Engkau tinggal?
  rationale: Dalam konteks langsung, μένω menanyakan tempat Yesus bermukim atau menginap. “Tinggal” paling alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kaitannya dengan tema “tetap” dalam Injil Yohanes.
theological_decisions:
- issue: ζητέω dapat memiliki arti biasa dan gema rohani dalam narasi Yohanes
  choice: Apa yang kalian cari?
  alternative: Apa yang kalian kehendaki? / Apa yang kalian upayakan untuk temukan?
  rationale: “Cari” wajar sebagai pertanyaan langsung, tetapi tidak menutup kemungkinan bahwa pertanyaan Yesus menyentuh keinginan atau pencarian mereka yang lebih dalam.
- issue: μένω kelak menjadi kata bertema teologis dalam Injil Yohanes
  choice: di manakah Engkau tinggal?
  alternative: di manakah Engkau tetap?
  rationale: Konteks terdekat menunjuk pada tempat Yesus tinggal atau menginap. Terjemahan utama tidak memaksakan bobot teologis dari pemakaian-pemakaian kemudian, sedangkan catatan kaki menunjukkan kesinambungan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Kalian” dipakai karena αὐτοῖς dan verba jamak menunjuk kepada dua orang. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Tanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
