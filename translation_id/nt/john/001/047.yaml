  source_fidelity: 'Teks Indonesia secara akurat mencerminkan unsur-unsur utama Yunani: Yesus melihat Natanael datang προς αὐτόν, lalu berbicara περὶ αὐτοῦ; seruan Ἴδε dipertahankan sebagai “Lihat”; ἀληθῶς Ἰσραηλίτης disampaikan tanpa menambahkan penafsiran teologis; dan δόλος diterjemahkan tepat sebagai “tipu daya.”'
