source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: id
  text: Yesus melihat Natanael datang kepada-Nya dan berkata tentang dia, “Lihat, sungguh seorang Israel yang tidak memiliki tipu daya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Lihat
  rationale: Mempertahankan seruan yang mengarahkan perhatian pendengar dengan ungkapan Indonesia yang alami dan langsung.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: sungguh seorang Israel
  rationale: Menyampaikan penekanan ἀληθῶς tanpa mengubahnya menjadi penilaian identitas yang lebih tafsiriah seperti ‘Israel sejati’.
- source_word: δόλος
  choice: tipu daya
  rationale: Mencakup kelicikan dan maksud menipu, serta sesuai dengan konteks penilaian terhadap karakter.
theological_decisions:
- issue: Hubungan ἀληθῶς dengan Ἰσραηλίτης
  choice: sungguh seorang Israel
  alternative: seorang Israel sejati
  rationale: Pilihan ini mempertahankan kemungkinan bahwa ἀληθῶς menegaskan pernyataan Yesus, tanpa secara mutlak menjadikannya kategori teologis tentang ‘Israel sejati’.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘kepada-Nya’ memakai kapital penghormatan yang lazim dalam penerbitan Alkitab Indonesia; ‘tentang dia’ mengikuti acuan orang ketiga dalam teks Yunani.
