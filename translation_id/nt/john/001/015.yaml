  source_fidelity: Revisi diperlukan terutama untuk ἔμπροσθέν μου γέγονεν. “Telah mendapat tempat di depan aku” menambahkan gagasan memperoleh suatu posisi/tempat yang tidak dinyatakan oleh γέγονεν dan kurang alami dalam bahasa Indonesia. “Telah mendahului aku” menyampaikan hasil/perubahan keadaan perfektum secara alami, sementara catatan kaki menjaga kemungkinan makna keutamaan. Pengantar kutipan juga sebaiknya lebih langsung mencerminkan ὃν εἶπον, yaitu “yang tentang-Nya telah kukatakan.”
  naturalness: 'Teks revisi memakai susunan modern dan lancar: “telah berseru demikian” menghubungkan verba perfektum dengan kutipan tanpa kekakuan “katanya”; “telah mendahului aku” adalah idiom Indonesia yang jelas. “Lebih dahulu daripada aku” tetap cukup ringkas dan mempertahankan keluasan prioritas pada klausa akhir.'
  terminology: “Bersaksi,” “berseru,” dan “tentang Dia” tepat bagi μαρτυρεῖ, κέκραγεν, dan περὶ αὐτοῦ. Kapitalisasi “Dia/-Nya” konsisten dengan konvensi Alkitab Indonesia. Klausa terakhir tidak diperluas menjadi pernyataan eksplisit tentang praeksistensi dalam teks utama; alternatif tersebut tetap tersedia di catatan kaki.
