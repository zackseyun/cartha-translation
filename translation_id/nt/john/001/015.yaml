    issue: “telah mendapat tempat di depan aku” untuk ἔμπροσθέν μου γέγονεν
    rationale: Frasa ini menyiratkan penerimaan atau penempatan pada suatu posisi (“mendapat tempat”), unsur yang tidak ada dalam bahasa Yunani. Selain itu, ungkapannya kurang idiomatis. “Telah mendahului aku” lebih alami dan dapat mencakup prioritas maupun keunggulan dalam konteks.
  - severity: low
    issue: “Dialah yang kumaksud ketika aku berkata” untuk Οὗτος ἦν ὃν εἶπον
    rationale: Walaupun dapat dipahami, “kumaksud” dan “ketika” agak menggeser bentuk langsung “yang tentang-Nya kukatakan.” Revisi mempertahankan hubungan relatif dan tindakan berkata dengan lebih dekat.
  - severity: low
    issue: Catatan kaki a belum sepenuhnya selaras dengan teks utama yang direvisi
    rationale: Setelah teks utama memakai “telah mendahului aku,” alternatif perlu menjelaskan kemungkinan “telah menjadi/berada di depan aku” dan “menjadi lebih utama,” bukan mengulang terjemahan utama sebagai alternatif.
