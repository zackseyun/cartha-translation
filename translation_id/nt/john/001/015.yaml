revisions:
- from: Yohanes bersaksi tentang Dia dan telah berseru, katanya, “Dialah yang kumaksud ketika aku berkata, ‘Dia yang datang sesudah aku telah mendapat tempat di depan aku[a], karena Dia sudah lebih dahulu daripada aku[b].’”
  to: 'Yohanes bersaksi tentang Dia dan telah berseru demikian: “Dialah yang tentang-Nya telah kukatakan, ‘Dia yang datang sesudah aku telah mendahului aku[a], karena Dia sudah lebih dahulu daripada aku[b].’”'
  rationale: Revisi menghilangkan tambahan makna “mendapat tempat” dan menggantinya dengan padanan Indonesia yang alami bagi klausa perfektum “telah mendahului aku.” Pengantar kutipan dibuat lebih dekat dengan konstruksi Yunani tanpa menjadi kaku. Ambiguitas yang relevan mengenai kedudukan, urutan, dan praeksistensi tetap dipelihara melalui pilihan teks utama dan catatan kaki.
