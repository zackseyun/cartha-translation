base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: id
  text: 'Yohanes bersaksi tentang Dia dan telah berseru demikian: “Dialah yang tentang-Nya telah kukatakan, ‘Dia yang datang sesudah aku telah mendahului aku[a], karena Dia sudah lebih dahulu daripada aku[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah menjadi di depan aku” atau “telah menjadi lebih utama daripada aku.” Ungkapan Yunani dapat menyatakan prioritas atau kedudukan, selain urutan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Dia sudah ada sebelum aku.” Terjemahan utama mempertahankan ungkapan prioritas yang lebih ringkas, sementara alternatif ini menyatakan implikasi praeksistensi secara lebih eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: bersaksi
  rationale: Bentuk kini Yunani menyajikan kesaksian Yohanes sebagai tindakan yang berlangsung atau tetap relevan; “bersaksi” jelas dan mempertahankan nuansa kesaksian.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: Padanan alami bagi περί dengan genitif dalam bahasa Indonesia modern.
- source_word: κέκραγεν
  choice: telah berseru
  rationale: “Berseru” menyampaikan suara yang lantang, sedangkan “telah” menandai aspek perfektum sejauh dapat diungkapkan secara wajar dalam bahasa Indonesia.
- source_word: λέγων
  choice: katanya
  rationale: Menghubungkan seruan dengan kutipan secara alami tanpa membuat kalimat terasa kaku.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Dialah yang kumaksud ketika aku berkata
  rationale: Ungkapan ini menyampaikan rujukan Yohanes kepada perkataannya sebelumnya dengan bahasa Indonesia yang alami; “ketika aku berkata” mempertahankan pengantar menuju kutipan langsung.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Dia yang datang sesudah aku
  rationale: Mempertahankan gerak “datang” dan urutan “sesudah aku,” yang dalam konteks dapat menunjuk pada kemunculan atau pelayanan.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: telah mendapat tempat di depan aku
  rationale: Pilihan ini mempertahankan citra posisi di depan sekaligus memungkinkan makna keutamaan atau kedudukan, tanpa membatasi frasa hanya pada urutan waktu.
- source_word: ὅτι
  choice: karena
  rationale: Menandai alasan bagi pernyataan sebelumnya secara langsung dan jelas.
- source_word: πρῶτός μου ἦν
  choice: Dia sudah lebih dahulu daripada aku
  rationale: Mempertahankan pernyataan prioritas dalam bentuk yang alami, tanpa secara eksplisit menambahkan kata “ada”; konteks tetap memungkinkan pembaca menangkap implikasi keberadaan sebelumnya.
theological_decisions:
- issue: Seberapa eksplisit klausa terakhir harus menyatakan praeksistensi Kristus
  choice: Dia sudah lebih dahulu daripada aku
  alternative: Dia sudah ada sebelum aku
  rationale: Terjemahan utama mempertahankan ketegangan dan keluasan ungkapan Yunani, sedangkan alternatif yang lebih eksplisit mengenai keberadaan dicatat dalam catatan kaki. Dengan demikian, implikasi praeksistensi tidak disangkal, tetapi juga tidak diperluas secara diam-diam di dalam teks utama.
- issue: Makna ἔμπροσθέν μου γέγονεν sebagai urutan atau kedudukan
  choice: telah mendapat tempat di depan aku
  alternative: telah mendahului aku; telah menjadi lebih utama daripada aku
  rationale: Ungkapan utama membiarkan citra “di depan” memuat baik prioritas maupun kedudukan. Alternatif yang lebih interpretatif diberikan dalam catatan kaki agar ambiguitas asli tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi “Dia” dipakai untuk rujukan kepada Kristus sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Bentuk “kumaksud” dan “aku” menjaga kelancaran kutipan langsung tanpa nada arkais.
