  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: id
  text: 'Lalu Ia berkata kepadanya, “Sesungguhnya, sesungguhnya, Aku berkata kepada kalian[a]: Kalian akan melihat langit terbuka dan malaikat-malaikat Allah naik dan turun di atas Anak Manusia.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “kalian” berbentuk jamak dalam bahasa Yunani, meskipun dalam bingkai narasi Yesus sedang berbicara kepada Natanael seorang diri.
    reason: lexical_alternative
  - marker: b
    text: Gambaran ini menggemakan mimpi Yakub dalam Kejadian 28:12, tetapi di sini gerak para malaikat berpusat pada Anak Manusia.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang memberi penegasan khidmat, sekaligus menyampaikan maknanya dengan bahasa Indonesia yang jelas dan wajar.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Bentuk Yunani ini jamak. “Kalian” mempertahankan peralihan yang bermakna dari sapaan naratif tunggal kepada Natanael menuju perkataan yang ditujukan kepada lebih dari satu orang.
- source_word: ὄψεσθε
  choice: Kalian akan melihat
  rationale: Bentuk futur ini secara alami diterjemahkan dengan “akan melihat”; subjek jamaknya dinyatakan secara eksplisit.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: langit terbuka
  rationale: Partisipel perfek menggambarkan langit dalam keadaan telah dibuka; “langit terbuka” ringkas, alami, dan tidak menambahkan rincian yang tidak terdapat dalam teks.
- source_word: ἀγγέλους
  choice: malaikat-malaikat
  rationale: Dalam penglihatan yang dikaitkan dengan Allah dan menggemakan Kejadian 28, maknanya adalah makhluk surgawi, bukan sekadar utusan manusia.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: naik dan turun
  rationale: Pasangan arah ini menerjemahkan kedua partisipel secara langsung dan mempertahankan gema bahasa tentang mimpi Yakub.
- source_word: ἐπὶ
  choice: di atas
  rationale: Dengan bentuk akusatif di sini, frasa tersebut menggambarkan gerak para malaikat dalam hubungannya dengan Anak Manusia. “Di atas” mempertahankan citra teks tanpa menjelaskannya secara teologis.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Istilah baku ini mempertahankan sebutan diri Yesus beserta hubungan antarteks dan bobot teologisnya.
theological_decisions:
- issue: Sapaan beralih dari objek tunggal αὐτῷ (“kepadanya”) kepada kata ganti jamak ὑμῖν dan verba jamak ὄψεσθε.
  choice: Menggunakan “kepadanya” dalam bingkai narasi dan “kalian” dua kali dalam perkataan langsung.
  alternative: Menggunakan “kamu” lalu menjelaskan bentuk jamaknya hanya dalam catatan kaki.
  rationale: Bahasa Indonesia memungkinkan jumlah jamak dinyatakan dengan alami. Pilihan ini mempertahankan pelebaran cakupan perkataan melampaui Natanael tanpa mengaburkan bentuk sumber.
- issue: Gambaran para malaikat yang naik dan turun menggemakan mimpi Yakub dalam Kejadian 28:12 dan kini berpusat pada Anak Manusia.
  choice: Mempertahankan gambaran tersebut tanpa uraian tafsir dalam teks utama.
  alternative: Menjelaskan dalam teks utama bahwa Yesus adalah penghubung antara surga dan bumi.
  rationale: Teks sumber menyajikan citra, bukan penjelasan eksplisit atas maknanya. Gema antarteks dicatat tanpa menjadikan salah satu penafsiran sebagai bagian dari terjemahan.
- issue: Makna relasional ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου dapat menimbulkan pertanyaan tentang bagaimana para malaikat bergerak sehubungan dengan Anak Manusia.
  choice: Menerjemahkan secara dekat sebagai “di atas Anak Manusia”.
  alternative: “kepada Anak Manusia” atau “melalui Anak Manusia”.
  rationale: “Di atas” paling langsung mempertahankan citra dan ketegangan ungkapan Yunani; alternatif lain berisiko menjelaskan mekanisme atau makna teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi “Ia” dan “Aku” mengikuti kebiasaan terjemahan Alkitab Indonesia untuk rujukan kepada Yesus. Pengulangan “Sesungguhnya” dipertahankan demi tekanan retoris; “kalian” dipilih untuk menampilkan jumlah jamak sumber secara terbuka.
