  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: id
  text: Ia bukanlah terang itu,[a] melainkan datang untuk bersaksi tentang terang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ia bukanlah terang itu, melainkan supaya ia bersaksi tentang terang itu.” Dalam bahasa Yunani, kata kerja pada bagian kedua dibiarkan tersirat dari konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: bukanlah
  rationale: Menyampaikan bentuk negatif imperfek εἰμί secara alami dalam bahasa Indonesia; enklitik -lah memberi penegasan yang sesuai dengan kontras ayat ini tanpa mengubah makna.
- source_word: ἐκεῖνος
  choice: Ia
  rationale: Dalam gaya Yohanes, demonstrativa ini berfungsi sebagai rujukan personal yang tegas kepada Yohanes. 'Ia' alami dan bermartabat, sedangkan 'orang itu' akan terdengar terlalu harfiah.
- source_word: τὸ φῶς
  choice: terang itu
  rationale: Kata penunjuk 'itu' mencerminkan artikel definit dan merujuk kepada terang tertentu yang telah diperkenalkan dalam prolog.
- source_word: ἀλλ’ ἵνα
  choice: melainkan datang untuk
  rationale: Sesudah ἀλλά, bahasa Yunani mengelipsiskan unsur verbal dan langsung memakai klausa tujuan. 'Datang untuk' memasok unsur yang tersirat dari konteks ayat sebelumnya sambil menghasilkan bahasa Indonesia yang wajar.
- source_word: μαρτυρήσῃ
  choice: bersaksi
  rationale: Padanan alami bagi μαρτυρέω yang mempertahankan nuansa pemberian kesaksian dan konsisten dengan peran Yohanes dalam konteks.
- source_word: περὶ τοῦ φωτός
  choice: tentang terang itu
  rationale: περί dengan genitif secara alami berarti 'tentang'; 'terang itu' mempertahankan rujukan definitnya.
theological_decisions:
- issue: Identitas dan peran Yohanes dalam hubungannya dengan terang
  choice: Ayat ini menyangkal bahwa Yohanes adalah terang itu dan menyatakan bahwa ia datang untuk bersaksi tentang terang itu.
  alternative: Terjemahan yang lebih harfiah dapat berbunyi, 'Ia bukanlah terang itu, melainkan supaya ia bersaksi tentang terang itu.'
  rationale: Terjemahan mempertahankan pembedaan dalam prolog antara saksi dan terang tanpa menambahkan penjelasan doktrinal. Kata 'datang' hanya mengungkapkan unsur verbal yang tersirat oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. 'Ia' dipilih untuk narasi kitab suci yang alami; pengulangan 'terang itu' mempertahankan penekanan dan rujukan khusus dalam teks sumber.
