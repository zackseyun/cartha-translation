  source_fidelity: Teks Indonesia secara tepat menyampaikan οὐκ ἦν ἐκεῖνος τὸ φῶς sebagai penyangkalan bahwa Yohanes adalah terang itu. Klausa eliptis ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός diterjemahkan secara sah dan sesuai konteks sebagai "melainkan datang untuk bersaksi tentang terang itu." Penambahan "datang" mencerminkan konteks dekat (ayat 6–7) dan jejak audit Inggris, tanpa menambah makna teologis.
  naturalness: '"Ia bukanlah terang itu, melainkan datang untuk bersaksi tentang terang itu" adalah bahasa Indonesia baku, modern, lancar, dan bernada sesuai register kitab suci. Pengulangan "terang itu" jelas dan tidak terasa janggal dalam konteks prolog.'
  terminology: '"Ia," "terang itu," dan "bersaksi tentang" merupakan pilihan istilah yang konsisten, jelas, dan setia pada fungsi personal ἐκεῖνος, rujukan definit τὸ φῶς, serta nuansa kesaksian μαρτυρέω. Catatan kaki terikat dengan benar pada "terang itu" dan secara memadai menjelaskan elipsis Yunani.'
