  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: id
  text: Ia mengaku dan tidak menyangkal, dan ia mengaku, “Aku bukan Mesias[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός (Christos) berarti “Yang Diurapi”; di sini gelar itu menunjuk kepada Mesias yang dinantikan.
    reason: Menjelaskan padanan alternatif dan makna gelar Yunani tanpa mengaburkan fungsi mesianiknya dalam konteks.
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: mengaku dengan terus terang / mengaku
  rationale: Kata ὁμολογέω di sini menunjuk pada pengakuan terbuka di hadapan umum. Pengulangan “mengaku” dipertahankan untuk mencerminkan penekanan retoris teks Yunani, sementara “dengan terus terang” memperjelas daya publik dari pemakaian pertama.
- source_word: οὐκ ἠρνήσατο
  choice: tidak menyangkalnya
  rationale: ἀρνέομαι lazim berarti “menyangkal,” termasuk dalam pemakaian Yohanes. Akhiran “-nya” secara alami menunjuk pada pengakuan yang sedang disampaikan tanpa menambahkan objek teologis baru.
- source_word: καὶ ... καὶ ... καὶ
  choice: dan ... melainkan ...
  rationale: Rangkaian καί memberi penekanan kumulatif. Bahasa Indonesia alami memakai “melainkan” pada bagian terakhir untuk menyatakan penegasan positif setelah “tidak menyangkal,” tanpa menghilangkan pengulangan kata kerja.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Aku bukan
  rationale: Pronomina eksplisit Ἐγώ memberi tekanan, tetapi “Aku bukan” sudah langsung dan tegas dalam bahasa Indonesia; tambahan seperti “aku sendiri” akan terasa berlebihan dan dapat mengubah nuansa.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi tokoh yang dinantikan, bukan sebagai nama diri. “Mesias” menyampaikan konteks pengharapan Yahudi secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus; Yang Diurapi
  rationale: Dalam konteks ini Yohanes menyangkal bahwa dirinya adalah tokoh terurapi yang dinantikan. “Mesias” mempertahankan fungsi gelar dan latar pengharapan Yahudi, sedangkan “Kristus” dapat terdengar seperti nama diri bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “mengaku” sengaja dipertahankan karena merupakan penekanan retoris dalam teks sumber; “dengan terus terang” membantu membuat pemakaian pertama terasa alami dan publik dalam bahasa Indonesia.
