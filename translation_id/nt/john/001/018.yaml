  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: id
  text: Tidak seorang pun pernah melihat Allah; Allah yang satu-satunya[a], yang berada di pangkuan Bapa[b], Dialah yang telah menyatakan-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “Anak yang satu-satunya” (atau secara tradisional, “Anak Tunggal”), bukan “Allah yang satu-satunya”.
    reason: textual_variant
  - marker: b
    text: 'Secara harfiah: “di dalam dada/pangkuan Bapa”; ungkapan ini menggambarkan kedekatan yang sangat intim. Dapat juga diterjemahkan “di sisi Bapa”.'
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “telah menjelaskan-Nya” atau “telah memperkenalkan-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Allah
  rationale: Objek langsung dari ἑώρακεν; padanan baku θεός ketika menunjuk kepada Allah secara mutlak.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan Indonesia yang alami dan bermartabat serta mempertahankan penyangkalan universal.
- source_word: ἑώρακεν πώποτε
  choice: pernah melihat
  rationale: Dalam konstruksi negatif, πώποτε secara alami dinyatakan dengan 'pernah'; bentuk perfektum menyatakan kenyataan yang tetap berlaku hingga kini.
- source_word: μονογενὴς θεὸς
  choice: Allah yang satu-satunya
  rationale: Mengikuti teks tercetak SBLGNT yang berbunyi θεός. μονογενής di sini menyatakan keunikan atau satu-satunya, bukan secara langsung tindakan diperanakkan.
- source_word: ὁ ὢν
  choice: yang berada
  rationale: Partisip substantival diterjemahkan sebagai klausa relatif yang alami dan menghubungkannya dengan gambaran lokasi relasional berikutnya.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: dalam dekapan Bapa
  rationale: Mempertahankan gambaran κόλπος sebagai kedekatan yang sangat intim dengan ungkapan Indonesia yang lebih wajar daripada terjemahan harfiah 'dalam dada Bapa'.
- source_word: ἐκεῖνος
  choice: Dialah
  rationale: Kata tunjuk yang menegaskan subjek dinyatakan dengan bentuk fokus Indonesia, sekaligus mempertahankan tekanan yang dapat hilang bila hanya diterjemahkan 'Dia'.
- source_word: ἐξηγήσατο
  choice: telah menyatakan-Nya
  rationale: Menyampaikan arti menjelaskan, menyingkapkan, atau membuat dikenal dalam konteks pewahyuan; sufiks '-Nya' merujuk kepada Allah yang belum pernah dilihat.
theological_decisions:
- issue: Varian teks μονογενὴς θεὸς dan ὁ μονογενὴς υἱός
  choice: 'Teks utama mengikuti SBLGNT: ''Allah yang satu-satunya''.'
  alternative: '''Anak yang satu-satunya'' atau secara tradisional ''Anak Tunggal''.'
  rationale: Sumber yang ditetapkan membaca μονογενὴς θεός. Karena varian ini penting secara tekstual dan kristologis, bacaan alternatif dicatat tanpa menggantikan teks sumber.
- issue: Arti μονογενής
  choice: yang satu-satunya
  alternative: yang tunggal; yang diperanakkan satu-satunya
  rationale: Bukti leksikal mendukung makna unik atau satu-satunya. Pilihan ini tidak memasukkan gagasan 'diperanakkan' ke dalam arti kata secara tersendiri, tetapi juga tidak meniadakan pertanyaan teologis yang lebih luas.
- issue: Rujukan objek dalam ἐξηγήσατο
  choice: '''-Nya'' merujuk kepada Allah pada awal ayat.'
  alternative: 'Membiarkan objek tersirat: ''telah menyatakan''.'
  rationale: Bahasa Indonesia lebih jelas dengan objek eksplisit, sebagaimana konteks Yunani menuntut Allah sebagai yang dinyatakan; kapitalisasi membantu menunjukkan rujukannya tanpa menambahkan gelar.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Dekapan Bapa' mempertahankan citra kedekatan κόλπος tanpa ungkapan harfiah yang terasa janggal. 'Dialah' mempertahankan penegasan ἐκεῖνος. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
