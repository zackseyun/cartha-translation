  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: id
  text: Maka perempuan itu meninggalkan tempayannya dan pergi ke kota, lalu berkata kepada orang-orang,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρίαν
  choice: tempayannya
  rationale: Mengacu pada wadah air yang dibawa perempuan itu; “tempayan” alami dan mudah dipahami dalam konteks pengambilan air.
- source_word: πόλιν
  choice: kota
  rationale: Padanan langsung bagi πόλις; konteks menentukan kota yang baru saja disebut.
- source_word: τοῖς ἀνθρώποις
  choice: orang-orang di sana
  rationale: ἄνθρωποι bersifat umum dan tidak secara leksikal membatasi jenis kelamin. Tambahan “di sana” secara alami menunjukkan orang-orang yang berada di kota tanpa mempersempit acuannya.
- source_word: λέγει
  choice: berkata
  rationale: Present historis Yunani diterjemahkan dengan bentuk naratif lampau yang alami dalam bahasa Indonesia, selaras dengan verba aoristus sebelumnya tanpa mengubah urutan peristiwa.
