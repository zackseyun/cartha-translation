id: JHN.4.45
reference: John 4:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: id
  text: Jadi, ketika Yesus tiba di Galilea, orang-orang Galilea menyambut Dia[a] karena mereka telah melihat semua yang telah dilakukan-Nya di Yerusalem pada perayaan[b] itu; sebab mereka juga telah pergi ke perayaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerima Dia.” Kata kerja Yunani dapat berarti menerima atau menyambut; dalam konteks ini tampaknya yang dimaksud adalah sambutan yang baik.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah perayaan keagamaan Yahudi di Yerusalem; berdasarkan konteks sebelumnya, ini adalah perayaan Paskah.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Jadi, ketika
  rationale: Οὖν melanjutkan alur narasi sekaligus menghubungkannya dengan konteks sebelumnya; “Jadi, ketika” mempertahankan daya penghubung itu secara alami.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: Yesus tiba di Galilea
  rationale: Kata kerja ἦλθεν dengan εἰς menyatakan gerak menuju dan masuk ke wilayah itu. Nama “Yesus” dipakai sebagai rujukan alami bagi pronomina Yunani tanpa mengubah acuannya.
- source_word: ἐδέξαντο αὐτὸν
  choice: menyambut Dia
  rationale: Dalam konteks ini δέχομαι menunjukkan penerimaan sosial yang positif; “menyambut” lebih alami daripada “menerima” dalam bahasa Indonesia.
- source_word: οἱ Γαλιλαῖοι
  choice: orang-orang Galilea
  rationale: Ungkapan ini merupakan sebutan geografis bagi penduduk Galilea dan terdengar alami bagi pembaca Indonesia.
- source_word: πάντα ἑωρακότες ὅσα
  choice: karena mereka telah melihat semua yang
  rationale: Partisipel perfek menyatakan bahwa mereka sebelumnya telah melihat hal-hal itu, dengan dampak pada sambutan mereka. “Karena” menyatakan hubungan kausal yang tersirat oleh konteks.
- source_word: ἐποίησεν
  choice: dilakukan-Nya
  rationale: Bentuk ini mempertahankan cakupan umum dari ποιέω dan secara idiomatis merujuk pada tindakan Yesus yang telah mereka saksikan.
- source_word: ἐν Ἱεροσολύμοις
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dan baku.
- source_word: ἐν τῇ ἑορτῇ
  choice: pada waktu perayaan itu
  rationale: Ἑορτή menunjuk pada perayaan keagamaan tertentu yang sudah dikenal dari konteks; “perayaan itu” mempertahankan ketertentuan artikelnya.
- source_word: καὶ αὐτοὶ γὰρ
  choice: Mereka sendiri juga
  rationale: Αὐτοί memberi penekanan dan καί menyatakan keikutsertaan. Hubungan penjelas dari γάρ diungkapkan secara alami oleh kalimat yang mengikuti sebab sebelumnya.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: pergi menghadiri perayaan itu
  rationale: Secara harfiah frasa ini berarti pergi ke perayaan; “menghadiri” menjelaskan tujuan gerak secara idiomatis tanpa menambahkan gagasan asing.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pronomina ilahi ditulis dengan kapital sesuai kelaziman penerbitan Alkitab Indonesia. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar hubungan sebab dan penjelasannya mudah dipahami.
