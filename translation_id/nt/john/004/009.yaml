source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: id
  text: Lalu perempuan Samaria itu berkata kepada-Nya, “Bagaimana mungkin Engkau, seorang Yahudi, meminta minum dariku, seorang perempuan Samaria?” (Sebab orang Yahudi tidak bergaul dengan orang Samaria.)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab orang Yahudi tidak berurusan dengan orang Samaria.” Ungkapan ini mungkin secara lebih khusus berarti bahwa mereka tidak menggunakan barang secara bersama-sama, misalnya wadah minum.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Lalu ... berkata
  rationale: οὖν menghubungkan perkataan ini dengan permintaan Yesus sebelumnya dan melanjutkan alur narasi; “lalu” alami dalam bahasa Indonesia tanpa menghilangkan daya penghubungnya.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: perempuan Samaria itu
  rationale: Artikel berulang menunjuk kepada perempuan yang telah disebutkan; “perempuan Samaria itu” mempertahankan identitas gender dan komunitasnya dengan susunan Indonesia yang alami.
- source_word: Πῶς
  choice: Bagaimana mungkin
  rationale: Ungkapan ini menyampaikan keheranan terhadap tindakan yang melanggar kebiasaan sosial, bukan semata-mata menanyakan caranya.
- source_word: Ἰουδαῖος
  choice: seorang Yahudi
  rationale: Dalam konteks ini istilah tersebut mengontraskan identitas komunal-keagamaan Yahudi dan Samaria, bukan terutama daerah asal Yudea.
- source_word: ὢν
  choice: seorang Yahudi
  rationale: Partisipel menyatakan keadaan atau latar belakang. Konstruksi aposisional Indonesia mempertahankan keadaan tersebut tanpa menentukan secara berlebihan apakah nuansanya kausal atau konsesif.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: meminta minum kepadaku
  rationale: Infinitif πεῖν bersama αἰτεῖς menyatakan permintaan untuk minum; pilihan ini ringkas, alami, dan mempertahankan arah permintaan kepada perempuan itu.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: kepadaku, seorang perempuan Samaria
  rationale: Genitif absolut memberi identitas perempuan itu sebagai latar keheranannya. Aposisi setelah “kepadaku” mempertahankan orang pertama serta identitas gender dan komunitasnya.
- source_word: συγχρῶνται
  choice: bergaul dengan
  rationale: Kata kerja ini dapat berarti berhubungan atau memakai sesuatu bersama. “Bergaul dengan” menyampaikan kerenggangan sosial secara luas, sedangkan kemungkinan makna yang lebih khusus dipertahankan dalam catatan kaki.
- source_word: οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις
  choice: Sebab orang Yahudi tidak bergaul dengan orang Samaria
  rationale: Klausa ini dipertahankan sebagai penjelasan narator dalam tanda kurung dan menggunakan bentuk generik yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna Ἰουδαῖος dalam pemakaian Yohanes
  choice: Yahudi
  alternative: orang Yudea
  rationale: Ayat ini mengontraskan orang Yahudi dan orang Samaria sebagai komunitas sosial-keagamaan; “Yahudi” paling tepat menyatakan perbedaan yang dimaksud.
- issue: Cakupan makna συγχρῶνται
  choice: 'hubungan sosial secara umum: “bergaul dengan”'
  alternative: secara khusus tidak memakai atau berbagi barang bersama, misalnya wadah minum
  rationale: Konteks langsung memungkinkan arti yang lebih sempit karena Yesus meminta minum, tetapi klausa penjelas dapat menyatakan kerenggangan antarkelompok secara lebih luas. Catatan kaki mempertahankan kedua kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan hormat “Engkau” bagi Yesus. Susunan kalimat dibuat alami dan bermartabat, sementara penjelasan narator tetap berada dalam tanda kurung. Penanda catatan kaki ditempatkan setelah klausa dalam tanda kurung.
