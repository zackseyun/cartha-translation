base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: id
  text: Mereka berkata kepada perempuan itu, “Kami percaya bukan lagi karena perkataanmu,[a] sebab kami sendiri sudah mendengar dan kami tahu bahwa Dialah benar-benar Juru Selamat dunia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “karena ucapanmu.” Kata Yunani ini menunjuk pada kesaksian yang disampaikan perempuan itu secara lisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: Mereka berkata kepada perempuan itu
  rationale: Imperfek ἔλεγον dapat menggambarkan ujaran yang sedang berlangsung, tetapi dalam narasi bahasa Indonesia bentuk alami ‘berkata’ menyampaikan tindakan lampau tanpa membuat kalimat terasa kaku. τε memiliki daya penghubung ringan yang tidak perlu dinyatakan tersendiri.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Sekarang kami percaya bukan lagi karena perkataanmu
  rationale: Οὐκέτι menyatakan bahwa dasar sebelumnya tidak lagi menjadi dasar kini. λαλιά menunjuk pada perkataan atau kesaksian lisan perempuan itu; ‘perkataanmu’ dekat dengan bentuk sumber dan tetap alami.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: sebab kami sendiri sudah mendengar
  rationale: αὐτοί bersifat intensif dan dipertahankan dengan ‘kami sendiri’. Bentuk perfektum ἀκηκόαμεν menyatakan tindakan mendengar yang telah terjadi dan tetap berdampak; ‘sudah mendengar’ merupakan padanan Indonesia yang alami.
- source_word: καὶ οἴδαμεν
  choice: dan kami tahu
  rationale: οἴδαμεν berfungsi sebagai verba statif kala kini, sehingga tepat diterjemahkan ‘kami tahu’.
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: Dialah benar-benar
  rationale: Konstruksi ‘Dialah’ mempertahankan penunjukan dan penegasan οὗτός secara lebih alami dalam bahasa Indonesia daripada ‘orang ini’. ‘Benar-benar’ menyampaikan daya penegas ἀληθῶς.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: Juru Selamat dunia
  rationale: ‘Juru Selamat’ merupakan padanan baku dan bermartabat bagi σωτήρ. ‘Dunia’ mempertahankan cakupan κόσμος tanpa menambahkan penjelasan seperti ‘semua orang’.
theological_decisions:
- issue: Cakupan pengakuan orang-orang Samaria
  choice: Juru Selamat dunia
  alternative: Juru Selamat semua orang; Juru Selamat orang-orang pilihan dari dunia
  rationale: Terjemahan mempertahankan keluasan ungkapan sumber tanpa mempersempit atau memperluasnya melalui rumusan teologis yang tidak dinyatakan dalam ayat.
- issue: Penegasan identitas Yesus dalam οὗτός
  choice: Dialah benar-benar
  alternative: orang ini benar-benar; Ia benar-benar
  rationale: ‘Dialah’ mempertahankan penegasan demonstratif οὗτός sekaligus terdengar wajar dan khidmat dalam pengakuan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan penekanan pada pengalaman langsung para penutur dan pengakuan kristologis ayat tersebut.
