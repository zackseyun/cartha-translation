  source_fidelity: Terjemahan mempertahankan kontras jamak ὑμεῖς/ἡμεῖς, objek netral ὃ sebagai “apa yang”, makna religius προσκυνέω sebagai “menyembah”, serta hubungan kausal ὅτι. “Keselamatan berasal dari orang Yahudi” menerjemahkan ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν secara setia sebagai asal/sumber historis tanpa menambahkan penafsiran doktrinal.
