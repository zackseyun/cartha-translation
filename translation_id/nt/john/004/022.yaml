id: JHN.4.22
reference: John 4:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: id
  text: Kalian menyembah apa yang tidak kalian kenal; kami menyembah apa yang kami kenal, karena keselamatan berasal dari orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat Yahudi”. Dalam beberapa bagian lain di Yohanes, istilah ini dapat berarti “orang Yudea”, tetapi di sini orang Yahudi dikontraskan dengan orang Samaria dalam hal ibadah dan sejarah keselamatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: menyembah
  rationale: Dalam konteks percakapan tentang tempat dan hakikat ibadah, verba ini menunjuk pada penyembahan religius, bukan sekadar bersujud atau memberi penghormatan.
- source_word: ὃ
  choice: apa yang
  rationale: Pronomina relatif netral dipertahankan secara alami sebagai 'apa yang', tanpa memperjelasnya menjadi bentuk personal yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: οἴδατε / οἴδαμεν
  choice: kenal
  rationale: '''Kenal'' mengungkapkan pengetahuan tentang objek penyembahan secara langsung dan alami serta mempertahankan kontras tajam antara kedua kelompok.'
- source_word: σωτηρία
  choice: keselamatan
  rationale: Ini padanan baku dan tepat bagi karya penyelamatan Allah dalam konteks Yohanes, bukan hanya pembebasan sementara.
- source_word: ἐκ
  choice: berasal dari
  rationale: Preposisi ini menandai sumber atau asal; 'berasal dari' merupakan ungkapan Indonesia yang alami dan tidak menentukan lebih jauh cara keselamatan itu hadir.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam konteks ini istilah tersebut mengacu pada umat Yahudi, yang dibedakan dari orang Samaria dalam perkara ibadah dan sejarah keselamatan; 'orang Yudea' akan terlalu sempit.
theological_decisions:
- issue: Makna 'keselamatan berasal dari orang Yahudi'
  choice: Pernyataan tentang sumber historis keselamatan melalui umat Yahudi dalam sejarah karya Allah.
  alternative: Rujukan yang lebih sempit hanya kepada asal-usul Mesias sebagai orang Yahudi, atau pernyataan lebih luas tentang keutamaan seluruh bentuk ibadah Yahudi.
  rationale: Terjemahan mempertahankan rumusan sumber tanpa mengubahnya menjadi klaim keunggulan etnis atau membatasi cakupannya hanya kepada satu unsur sejarah keselamatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμεῖς secara jelas; pengulangan struktur Yunani dipertahankan demi kontras retoris.
