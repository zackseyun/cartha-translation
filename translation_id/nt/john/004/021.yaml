  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Percayalah kepada-Ku[a], hai perempuan[b], saat akan tiba ketika kalian tidak akan menyembah Bapa, baik di gunung ini maupun di Yerusalem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini dapat berarti mempercayai apa yang dikatakan seseorang atau menaruh kepercayaan kepada orang itu.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang secara harfiah berarti “perempuan” merupakan sapaan yang santun dalam konteks ini, bukan sapaan kasar.
    reason: cultural_note
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Percayalah kepada-Ku
  rationale: Imperatif ini meminta perempuan itu menerima perkataan Yesus sebagai benar, tetapi bentuk Yunaninya juga dapat menyiratkan kepercayaan kepada pribadi-Nya. Ungkapan Indonesia ini mempertahankan kedua kemungkinan itu.
- source_word: γύναι
  choice: Ibu
  rationale: Dalam konteks ini γύναι adalah sapaan langsung yang santun, bukan sebutan kasar. 'Ibu' menyampaikan fungsi pragmatisnya secara wajar dalam bahasa Indonesia modern; terjemahan harfiah 'perempuan' mudah disalahpahami sebagai tidak sopan.
- source_word: ἔρχεται ὥρα
  choice: akan tiba saat
  rationale: '''Saat'' mempertahankan istilah tematis ὥρα dalam Injil Yohanes, sedangkan susunan tanpa ''-nya'' tidak memaksakan ketakrifan yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.'
- source_word: οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις
  choice: tidak ... baik di gunung ini maupun di Yerusalem
  rationale: Konstruksi ini secara alami menyatakan peniadaan kedua lokasi dalam bahasa Indonesia dan mempertahankan kontras antara gunung orang Samaria dan Yerusalem.
- source_word: προσκυνήσετε
  choice: kalian tidak akan menyembah
  rationale: Bentuk verba adalah orang kedua jamak futur. 'Kalian' mempertahankan peralihan dari sapaan tunggal kepada pendengar yang lebih luas, dan 'menyembah' sesuai dengan tindakan keagamaan yang dibahas.
- source_word: τῷ πατρί
  choice: Bapa
  rationale: Dalam konteks Yohanes, sebutan ini merujuk kepada Allah sebagai Bapa; kapitalisasi menandai gelar ilahi tersebut tanpa menambahkan penafsiran lain.
theological_decisions:
- issue: Nada sapaan γύναι
  choice: Diterjemahkan 'Ibu' sebagai sapaan santun
  alternative: '''Perempuan'' atau ''Hai perempuan'''
  rationale: Terjemahan harfiah dalam bahasa Indonesia modern dapat terdengar tajam atau merendahkan, padahal sapaan Yunani ini santun dalam konteksnya. Pilihan 'Ibu' mempertahankan maksud sosial sapaan tanpa menambahkan keakraban seperti 'Ibu yang baik'.
- issue: Motif ὥρα dalam Injil Yohanes
  choice: Mempertahankan kata 'saat'
  alternative: '''Waktu'' atau ''masanya'''
  rationale: '''Saat'' mempertahankan gema istilah khas Yohanes tentang titik penentu dalam karya Allah, tanpa menjelaskan secara berlebihan saat yang dimaksud.'
- issue: Cakupan orang yang akan menyembah
  choice: Mempertahankan bentuk jamak dengan 'kalian'
  alternative: Menggunakan 'engkau' atau menghilangkan subjek
  rationale: Bahasa Yunani beralih dari perintah dan sapaan tunggal kepada verba orang kedua jamak. 'Kalian' menjaga perluasan cakupan tersebut tanpa menentukan lebih jauh kelompok yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Ibu' dipakai sebagai padanan fungsional bagi sapaan santun γύναι. Susunan 'akan tiba saat ketika' sengaja mempertahankan kata tematis 'saat' dan menghindari ketakrifan berlebihan. Bentuk 'kalian' menyatakan dengan jelas bahwa προσκυνήσετε berbentuk jamak.
