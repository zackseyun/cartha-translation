id: JHN.4.47
reference: John 4:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: id
  text: Ketika orang itu mendengar bahwa Yesus telah datang dari Yudea ke Galilea, ia pergi menemui Yesus dan meminta[a] agar Ia turun[b] dan menyembuhkan anak laki-lakinya, sebab anak itu hampir mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “terus meminta” atau “berulang kali meminta.” Bentuk imperfek Yunani dapat menggambarkan tindakan yang sedang berlangsung atau berulang, tetapi tidak mengharuskan nuansa itu dinyatakan dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Kata “turun” mencerminkan perbedaan ketinggian antara tempat-tempat yang dimaksud di Galilea.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: orang itu
  rationale: Bentuk demonstratif ini merujuk kembali kepada pegawai istana pada ayat sebelumnya. “Orang itu” alami dalam narasi Indonesia dan mempertahankan daya tunjuknya.
- source_word: ἀκούσας
  choice: ketika ... mendengar
  rationale: Partisip aoris dipahami secara temporal terhadap tindakan utama; bentuk anak kalimat ini alami dalam bahasa Indonesia.
- source_word: ἥκει
  choice: telah datang
  rationale: Kata ini menyatakan kedatangan yang menghasilkan keberadaan di tempat tujuan. “Telah datang” sesuai dengan isi kabar yang didengar pegawai itu.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: dari Yudea ke Galilea
  rationale: Terjemahan ini mempertahankan tempat asal dan tujuan gerak secara jelas dan idiomatis.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ia pergi menemui Yesus
  rationale: “Pergi menemui” menyampaikan gerak menuju seseorang dengan alami. Nama “Yesus” diulang untuk mencegah kerancuan pronomina dalam bahasa Indonesia.
- source_word: ἠρώτα
  choice: meminta
  rationale: ἐρωτάω di sini berarti meminta, bukan dengan sendirinya “memohon dengan sangat.” Imperfeknya dapat menyiratkan tindakan yang berlangsung atau berulang, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: ἵνα καταβῇ
  choice: agar Ia turun
  rationale: Sesudah verba meminta, konstruksi “agar” alami dalam bahasa Indonesia. “Turun” mempertahankan unsur arah/topografi dalam καταβαίνω.
- source_word: ἰάσηται
  choice: menyembuhkan
  rationale: Pilihan langsung dan lazim untuk penyembuhan jasmani dalam konteks ini.
- source_word: αὐτοῦ τὸν υἱόν
  choice: anak laki-lakinya
  rationale: υἱός secara khusus berarti anak laki-laki; bentuk posesifnya merujuk kepada pegawai istana tersebut.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: sebab anak itu sudah hampir mati
  rationale: μέλλω dengan infinitif menyatakan kematian yang segera terjadi. Pengulangan “anak itu” memperjelas rujukan yang secara konteks menunjuk kepada anak sang pegawai.
theological_decisions:
- issue: Rujukan subjek dalam ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: Anak pegawai istana itu yang hampir mati
  alternative: Yesus atau pegawai istana itu yang hampir mati
  rationale: Anteseden terdekat dan konteks narasinya dengan jelas menunjuk kepada anak yang perlu disembuhkan. Nama “anak itu” digunakan agar rujukannya tidak kabur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar bagi pembaca umum. Kalimat mempertahankan hubungan temporal, arah perjalanan, unsur topografis “turun,” serta urgensi keadaan anak tanpa memperkuat ἠρώτα menjadi permohonan emosional yang tidak diwajibkan oleh leksikon.
