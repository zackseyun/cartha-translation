  text: ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους· Μή τις ἤνεγκεν αὐτῷ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: id
  text: Maka murid-murid berkata satu sama lain, “Apakah ada orang yang membawakan-Nya sesuatu untuk dimakan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidak mungkin ada orang yang membawakan-Nya sesuatu untuk dimakan, bukan?” Pertanyaan Yunani yang memakai μή mengharapkan jawaban negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan percakapan yang sedang berlangsung; dalam bahasa Indonesia, nuansa itu terbaca secara alami dari konteks percakapan kelompok tanpa perlu ungkapan yang kaku.
- source_word: οὖν
  choice: Maka
  rationale: Kata ini menghubungkan reaksi para murid dengan perkataan Yesus sebelumnya sekaligus melanjutkan alur narasi.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Ini adalah padanan baku dan tepat bagi para pengikut yang belajar dari Yesus dalam Injil Yohanes.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: 'Ungkapan ini mempertahankan makna timbal balik: para murid berbicara di antara anggota kelompok mereka.'
- source_word: Μή τις
  choice: Apakah ada orang
  rationale: Bentuk pertanyaan dibuat alami dalam bahasa Indonesia; kecenderungan pertanyaan Yunani untuk mengharapkan jawaban negatif dipertahankan dalam catatan kaki agar tidak dipaksakan menjadi kepastian.
- source_word: ἤνεγκεν αὐτῷ
  choice: membawakan-Nya
  rationale: Konstruksi ini secara alami menyatakan bahwa seseorang membawa sesuatu bagi Yesus; akhiran -Nya merujuk kepada Yesus.
- source_word: φαγεῖν
  choice: sesuatu untuk dimakan
  rationale: Infinitif ini menyatakan tujuan dari sesuatu yang dibawa, dan penambahan 'sesuatu' membuat kalimat lengkap serta wajar tanpa mempersempitnya menjadi jenis makanan tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan pertanyaan utama dibuat alami, sedangkan dugaan para murid bahwa jawabannya adalah tidak dijelaskan dalam catatan kaki untuk mempertahankan nuansa teks Yunani.
