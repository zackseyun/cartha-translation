base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: id
  text: Ia harus melalui Samaria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia perlu melalui Samaria.” Teks Yunani menyatakan suatu keharusan tanpa menjelaskan secara khusus apa yang mendasarinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: harus
  rationale: Bentuk imperfek ini menyatakan keharusan dalam narasi lampau. Dalam bahasa Indonesia, waktu lampau ditentukan oleh konteks, sehingga “harus” menyampaikan keharusan secara alami tanpa menjelaskan dasarnya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai kelanjutan narasi dengan ringan, bukan pertentangan yang kuat. Dalam kalimat Indonesia ini, hubungan tersebut sudah wajar tanpa kata penghubung tambahan.
- source_word: αὐτὸν
  choice: Ia
  rationale: Walaupun secara bentuk merupakan akusatif sebagai subjek infinitif, konstruksi Indonesia yang idiomatis memakai klausa finit dengan subjek “Ia”.
- source_word: διέρχεσθαι
  choice: melewati
  rationale: Dengan διά dan nama wilayah, kata kerja ini berarti bergerak melalui suatu daerah. “Melewati” ringkas, alami, dan mempertahankan gagasan perjalanan melalui wilayah itu.
- source_word: διὰ τῆς Σαμαρείας
  choice: melewati Samaria
  rationale: διά dengan genitif menunjukkan gerakan melalui suatu tempat. Nama “Samaria” cukup jelas tanpa penambahan interpretatif seperti “wilayah” atau “melalui jalan yang melintasi”.
theological_decisions:
- issue: Dasar keharusan dalam ἔδει
  choice: Menyatakan keharusan yang nyata dengan “harus” tanpa menentukan dasarnya.
  alternative: Menafsirkannya secara khusus sebagai keharusan geografis atau sebagai keharusan ilahi yang berkaitan dengan misi Yesus.
  rationale: Teks Yunani menyatakan keharusan, tetapi ayat ini sendiri tidak menyebutkan apakah dasarnya geografis, praktis, atau ilahi. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Ia” dipakai untuk rujukan kepada Yesus sesuai register Alkitab Indonesia yang umum, sedangkan “melewati” terdengar alami bagi pembaca masa kini.
