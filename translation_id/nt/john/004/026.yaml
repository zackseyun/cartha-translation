  text: Yesus berkata kepadanya[a], “Akulah dia yang sedang berbicara kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Yunani berbunyi: “Aku adalah, yang berbicara kepadamu.” Berdasarkan konteks tentang Mesias dalam ayat sebelumnya, ungkapan Yunani Ἐγώ εἰμι juga dapat dipahami sebagai “Akulah dia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami; bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Dativus objek tak langsung secara alami diterjemahkan “kepadanya”; konteks jelas menunjuk kepada perempuan itu.
- source_word: Ἐγώ εἰμι
  choice: Akulah dia
  rationale: Dalam konteks perkataan perempuan tentang Mesias pada ayat sebelumnya, ungkapan ini merupakan pengenalan diri. “Akulah dia” menyampaikan idiom itu secara alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya yang tanpa pelengkap tersurat.
- source_word: ὁ λαλῶν σοι
  choice: yang sedang berbicara denganmu
  rationale: Partisipel kini berartikel diterjemahkan sebagai frasa substantival; “sedang” mempertahankan aspek berlangsung, dan “denganmu” alami bagi percakapan langsung ini.
theological_decisions:
- issue: Apakah identifikasi Mesias dibuat eksplisit dalam teks utama
  choice: Memakai “Akulah dia” tanpa menambahkan kata “Mesias”.
  alternative: “Aku ada, yaitu yang sedang berbicara denganmu” atau “Akulah Mesias.”
  rationale: Konteks ayat 25 menyediakan rujukan bagi “dia”, tetapi kata “Mesias” tidak diulang dalam teks Yunani. Pilihan ini menyampaikan identifikasi secara wajar tanpa menambahkan gelar secara eksplisit, sedangkan catatan kaki menjaga bentuk ringkas Yunani dan kemungkinan gaung teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “Akulah dia” dipilih karena lebih alami daripada terjemahan kaku “Aku ada” dalam konteks pengenalan diri, sambil mempertahankan bentuk harfiah dalam catatan kaki.
