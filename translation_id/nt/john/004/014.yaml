id: JHN.4.14
reference: John 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: id
  text: Namun, siapa pun yang minum dari air yang akan Kuberikan kepadanya tidak akan pernah haus lagi. Sebaliknya, air yang akan Kuberikan kepadanya akan menjadi di dalam dirinya mata air yang memancar menuju hidup kekal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: tidak akan pernah haus lagi
  rationale: Gabungan negasi tegas οὐ μή dan ungkapan waktu εἰς τὸν αἰῶνα menyatakan bahwa kehausan itu tidak akan kembali untuk selamanya; bentuk Indonesia ini alami dan tegas tanpa frasa janggal 'haus selama-lamanya'.
- source_word: πηγὴ ὕδατος
  choice: mata air
  rationale: πηγή menunjuk sumber atau mata air, bukan sekadar genangan maupun sumur.
- source_word: ἁλλομένου
  choice: memancar
  rationale: Partisipel ini menggambarkan air yang melonjak, menyembur, atau memancar; 'memancar' memberi gambaran hidup dengan bahasa Indonesia yang wajar.
- source_word: εἰς ζωὴν αἰώνιον
  choice: menuju hidup kekal
  rationale: Mempertahankan arah atau hasil yang dinyatakan εἰς tanpa memutuskan lebih jauh apakah hidup kekal terutama dipahami sebagai tujuan, hasil, atau kepenuhan pancaran itu.
theological_decisions:
- issue: Sifat mutlak janji tidak haus
  choice: tidak akan pernah haus lagi
  alternative: tidak akan haus untuk selama-lamanya
  rationale: Terjemahan pilihan mempertahankan kekuatan negasi Yunani dan cakupan waktunya dalam ungkapan Indonesia yang alami, tanpa menjelaskan secara tambahan sifat metaforis kehausan tersebut.
- issue: Hubungan mata air dengan hidup kekal
  choice: memancar menuju hidup kekal
  alternative: memancar sampai kepada hidup yang kekal
  rationale: Kata 'menuju' mempertahankan keluwesan εἰς dan menghindari penambahan penafsiran kausal atau sakramental yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapital pada 'Kuberikan' mengikuti kebiasaan ortografis Indonesia untuk pronomina yang merujuk kepada Yesus sebagai pribadi ilahi. Kontras δέ ... ἀλλά disampaikan dengan 'Namun ... Sebaliknya' agar alur argumentasi jelas.
