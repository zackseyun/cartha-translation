id: JHN.4.20
reference: John 4:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: id
  text: Nenek moyang kami menyembah di gunung ini, tetapi kalian mengatakan bahwa Yerusalemlah tempat orang harus menyembah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tempat di mana orang harus menyembah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nenek moyang kami
  rationale: Ungkapan ini menunjuk kepada para leluhur komunitas sang perempuan. Dalam bahasa Indonesia modern, “nenek moyang kami” lebih alami dan tidak membatasi rujukan hanya kepada leluhur laki-laki.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: di gunung ini
  rationale: Preposisi ἐν bersifat lokatif; “di gunung ini” merupakan bentuk Indonesia yang alami dan tetap mempertahankan penunjukan kepada lokasi tertentu.
- source_word: προσεκύνησαν
  choice: menyembah
  rationale: Dalam konteks perdebatan tentang lokasi ibadah, προσκυνέω menyatakan tindakan menyembah, bukan sekadar membungkuk.
- source_word: καὶ ὑμεῖς λέγετε
  choice: tetapi kalian mengatakan
  rationale: καί secara dasar berarti “dan”, tetapi hubungan antarklausa di sini jelas bersifat kontras. “Tetapi” menyampaikan hubungan wacana itu secara alami, sedangkan “kalian” mempertahankan bentuk jamak dan kontras dengan “kami”.
- source_word: ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος
  choice: Yerusalemlah tempat
  rationale: Partikel penegas “-lah” secara alami menandai Yerusalem sebagai lokasi yang diklaim, tanpa menambahkan kata “satu-satunya” yang tidak dinyatakan secara eksplisit.
- source_word: ὅπου προσκυνεῖν δεῖ
  choice: orang harus menyembah
  rationale: Konstruksi infinitif dengan δεῖ menyatakan keharusan secara umum dan impersonal. “Orang harus menyembah” jelas, alami, dan tidak mengarah kepada satu individu tertentu.
theological_decisions:
- issue: Kontras antara tradisi ibadah orang Samaria dan klaim orang Yahudi
  choice: Identitas kedua kelompok tidak ditambahkan; kontras dipertahankan melalui “kami” dan “kalian”.
  alternative: “Nenek moyang kami orang Samaria ... tetapi kalian orang Yahudi mengatakan ...”
  rationale: Ayat ini tidak menyebut kedua identitas tersebut secara eksplisit. Menambahkannya akan menjelaskan konteks dengan informasi yang melampaui kata-kata sumber.
- issue: Eksklusivitas Yerusalem sebagai tempat ibadah
  choice: “Yerusalemlah tempat orang harus menyembah”
  alternative: “Yerusalem adalah satu-satunya tempat orang harus menyembah”
  rationale: Susunan Yunani menegaskan lokasi dan menyatakan keharusan, tetapi kata “satu-satunya” tidak hadir. Terjemahan mempertahankan kuatnya klaim tanpa memperluasnya.
- issue: Sifat keharusan dalam προσκυνεῖν δεῖ
  choice: 'Keharusan umum: “orang harus menyembah”'
  alternative: “di mana perlu menyembah”
  rationale: δεῖ mengandung daya normatif yang lebih jelas daripada sekadar “perlu”, sementara subjek impersonalnya tetap dipertahankan dengan “orang”.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk jamak ὑμεῖς dan mempertahankan kontras komunal dengan “kami”; “nenek moyang” dipilih daripada “bapa-bapa” karena lebih alami bagi pembaca umum masa kini.
