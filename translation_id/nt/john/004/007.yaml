  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: id
  text: Seorang perempuan dari Samaria datang untuk menimba air. Yesus berkata kepadanya[a], “Berilah Aku minum.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunani secara lebih harfiah memakai bentuk kini: “datang … berkata”; bentuk-bentuk ini merupakan present historis dalam narasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: datang
  rationale: Bentuk kini Yunani berfungsi sebagai present historis dalam narasi. Bahasa Indonesia lazim tidak menandai kala secara morfologis, sehingga “datang” alami dan tetap mempertahankan urutan naratif.
- source_word: γυνὴ
  choice: seorang perempuan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seorang perempuan yang belum diperkenalkan, bukan secara khusus seorang istri.
- source_word: ἐκ τῆς Σαμαρείας
  choice: dari Samaria
  rationale: Menerjemahkan asal tempat secara langsung tanpa mengubahnya menjadi sebutan etnis yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: ἀντλῆσαι ὕδωρ
  choice: untuk menimba air
  rationale: Infinitif menyatakan tujuan; “menimba air” merupakan ungkapan Indonesia yang tepat dan alami untuk mengambil air dari sumur.
- source_word: λέγει αὐτῇ
  choice: berkata kepadanya
  rationale: Bentuk kini Yunani adalah present historis. “Berkata kepadanya” alami dalam narasi Indonesia dan tidak memerlukan penandaan kala eksplisit.
- source_word: Δός μοι πεῖν
  choice: Berilah Aku minum
  rationale: Ungkapan ini menyampaikan permintaan singkat agar diberi air untuk diminum, sekaligus lebih dekat pada susunan Yunani daripada “Beri Aku air.”
theological_decisions:
- issue: Rujukan frasa “dari Samaria”
  choice: Mempertahankan “seorang perempuan dari Samaria”
  alternative: “seorang perempuan Samaria” atau “seorang perempuan dari kota Samaria”
  rationale: Teks Yunani menyebut seorang perempuan “dari Samaria” dan tidak secara eksplisit memakai sebutan etnis dalam ayat ini. Terjemahan tidak mempersempit Samaria menjadi kota ataupun menambahkan identitas yang baru ditegaskan oleh konteks berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Berilah” mempertahankan bentuk permintaan langsung dengan nada yang sesuai, sedangkan huruf kapital pada “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia bagi rujukan kepada Yesus.
