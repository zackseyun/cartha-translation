  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: id
  text: Aku telah mengutus kalian untuk menuai apa yang tidak kalian usahakan. Orang lain telah berjerih payah, dan kalian telah masuk ke dalam jerih payah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ ἀπέστειλα ὑμᾶς
  choice: Aku mengutus kalian
  rationale: Aoristus ἀπέστειλα dipadankan dengan bentuk lampau yang dalam bahasa Indonesia cukup dinyatakan oleh verba tanpa penanda waktu tambahan. 'Kalian' memperjelas bahwa ὑμᾶς berbentuk jamak, sedangkan 'Aku' mempertahankan pronomina eksplisit yang agak menonjol dalam bahasa Yunani.
- source_word: θερίζειν
  choice: untuk menuai
  rationale: '''Menuai'' merupakan padanan langsung dan alami yang mempertahankan metafora pertanian dalam konteks ini.'
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: apa yang tidak kalian kerjakan
  rationale: Terjemahan ini mempertahankan objek relatif ὃ dan kontras tegas antara ὑμεῖς dan ἄλλοι. 'Kerjakan' menghubungkan jerih payah itu dengan sesuatu yang kini dituai tanpa menambahkan gagasan 'hasil' yang tidak dinyatakan secara eksplisit.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: Orang-orang lain telah bekerja keras
  rationale: Perfect κεκοπιάκασιν menunjukkan pekerjaan terdahulu yang hasil atau relevansinya masih berlaku. 'Bekerja keras' menyampaikan unsur keletihan dan usaha dalam κοπιάω secara alami.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: kalian telah masuk ke dalam jerih payah mereka
  rationale: Ungkapan ini mengikuti struktur Yunani secara dekat dan mempertahankan gambaran yang tidak biasa, alih-alih menafsirkannya sebagai sekadar menikmati hasil atau ikut bekerja. Bentuk 'telah masuk' mencerminkan keadaan kini yang timbul dari tindakan sebelumnya.
theological_decisions:
- issue: Identitas 'orang-orang lain' dan sifat penuaian
  choice: Referennya dibiarkan tidak ditentukan, dan metafora penuaian dipertahankan.
  alternative: '''Orang-orang lain'' dapat ditafsirkan secara khusus sebagai para nabi, Yohanes Pembaptis, Yesus, atau para saksi terdahulu.'
  rationale: Ayat ini sendiri tidak menetapkan siapa yang dimaksud. Menyebut kelompok tertentu akan mempersempit ambiguitas asli dan memasukkan tafsiran ke dalam teks.
- issue: Makna masuk ke dalam jerih payah orang lain
  choice: Ungkapan Yunani diterjemahkan secara langsung sebagai 'masuk ke dalam jerih payah mereka'.
  alternative: Dapat dijelaskan sebagai menikmati hasil jerih payah mereka atau ikut mengambil bagian dalam pekerjaan mereka.
  rationale: Teks Yunani menyebut κόπος, yaitu jerih payah, bukan secara eksplisit hasilnya. Rumusan utama mempertahankan ketegangan ungkapan tersebut tanpa memilih salah satu penjelasan interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Aku' sesuai dengan tuturan langsung Yesus dalam gaya Alkitab Indonesia, sedangkan 'kalian' secara alami menandai bentuk jamak Yunani. Pilihan 'jerih payah' menjaga bobot usaha berat dalam κόπος dan menghindari nada teknis atau denominatif.
