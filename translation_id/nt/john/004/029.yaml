id: JHN.4.29
reference: John 4:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: id
  text: “Mari, lihatlah seorang laki-laki yang mengatakan kepadaku segala sesuatu yang pernah kulakukan. Mungkinkah orang ini Mesias?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan-jangan orang ini Mesias?”
    reason: Alternatif ini lebih jelas mencerminkan pertanyaan μήτι yang lazimnya mengantisipasi jawaban negatif atau mengungkapkan keraguan.
lexical_decisions:
- source_word: Δεῦτε
  choice: Mari
  rationale: Ajakan kepada beberapa orang; “Mari” menyampaikan dorongan untuk datang bersama tanpa terdengar kasar atau kuno.
- source_word: ἴδετε
  choice: lihatlah
  rationale: Bentuk ajakan langsung yang berpadu secara alami dengan “Mari” dan mempertahankan tindakan melihat.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Dalam konteks ini nomina maskulin tunggal menunjuk kepada Yesus sebagai seorang pria; pilihan ini menyatakan rujukan gender secara jelas.
- source_word: ὃς εἶπέ μοι
  choice: yang mengatakan kepadaku
  rationale: Menyampaikan tindakan berbicara kepada perempuan itu secara alami, dengan isi perkataan dijelaskan oleh klausa berikutnya.
- source_word: πάντα ὅσα
  choice: segala sesuatu yang
  rationale: Mempertahankan tekanan pada cakupan menyeluruh yang dinyatakan oleh gabungan kedua unsur Yunani.
- source_word: ἐποίησα
  choice: pernah kulakukan
  rationale: Aoristus mengacu pada perbuatan-perbuatannya pada masa lampau; “pernah” menghasilkan ungkapan Indonesia yang alami tanpa menentukan satu waktu tertentu.
- source_word: μήτι
  choice: Mungkinkah
  rationale: Menjaga nuansa pertanyaan yang ragu-ragu dan mengundang pertimbangan, yang secara bentuk dapat mengantisipasi jawaban negatif tanpa memaksakannya.
- source_word: οὗτός
  choice: orang ini
  rationale: Mempertahankan daya tunjuk pronomina Yunani dan memperjelas bahwa pertanyaan merujuk kepada laki-laki yang baru disebut.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar mesianik dalam konteks Yahudi-Samaria, sehingga diterjemahkan sebagai “Mesias”, bukan diperlakukan sebagai nama diri.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini istilah tersebut adalah gelar bagi sosok yang dinantikan. “Mesias” mempertahankan fungsi gelarnya dan konteks pengharapan mesianik.
- issue: Daya pertanyaan μήτι
  choice: Mungkinkah orang ini Mesias?
  alternative: Jangan-jangan orang ini Mesias?
  rationale: Pilihan utama mempertahankan keterbukaan dan keraguan pertanyaan tanpa mengubahnya menjadi penegasan. Alternatif mencerminkan kecenderungan menuju jawaban negatif dengan lebih kentara.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Mari, lihatlah” mempertahankan ajakan langsung; bentuk “kulakukan” ringkas dan alami dalam tuturan. Penanda catatan kaki [a] ditempatkan sesudah pertanyaan yang dijelaskannya.
