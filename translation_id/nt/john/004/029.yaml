  naturalness: Bahasa Indonesia modern, jelas, dan wajar. “Mari, lihatlah” merupakan ajakan yang lancar; “seorang laki-laki” dan “orang ini” jelas tanpa terasa tidak alami. Pertanyaan “Mungkinkah orang ini Mesias?” mempertahankan nada penyelidikan, bukan penegasan.
  terminology: “Mesias” konsisten dengan fungsi χριστός sebagai gelar, bukan nama diri. Tidak ada istilah teologis lain yang memerlukan penyesuaian.
