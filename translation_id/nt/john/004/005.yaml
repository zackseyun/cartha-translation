  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: id
  text: Karena itu, Yesus tiba di sebuah kota di Samaria,[a] bernama Sikhar, dekat sebidang tanah[b] yang telah Yakub berikan kepada Yusuf, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah kota di wilayah Samaria.” Kata Yunani πόλις dapat merujuk pada kota atau permukiman, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “ladang” atau “tanah milik.” Kata Yunani χωρίον dapat berarti ladang, tanah milik, atau sebidang tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: sampai
  rationale: Bentuk kini Yunani berfungsi sebagai present historis dalam narasi. Bahasa Indonesia tidak menandai kala secara morfologis; 'sampai' secara alami menyatakan tibanya Yesus pada tahap perjalanan ini.
- source_word: οὖν
  choice: Karena itu
  rationale: Menjaga daya penghubung dan inferensial dengan konteks sebelumnya, bukan sekadar urutan waktu.
- source_word: πόλιν τῆς Σαμαρείας
  choice: sebuah kota di Samaria
  rationale: πόλις dapat menunjuk kota atau permukiman; 'kota' adalah padanan umum yang wajar, sedangkan genitif wilayah paling alami dinyatakan dengan 'di Samaria'.
- source_word: λεγομένην Συχὰρ
  choice: yang bernama Sikhar
  rationale: Ungkapan partisipial ini secara idiomatis memperkenalkan nama tempat. 'Sikhar' mentransliterasikan Συχάρ secara wajar dalam ejaan Indonesia.
- source_word: πλησίον
  choice: dekat
  rationale: Padanan spasial yang ringkas dan alami.
- source_word: χωρίου
  choice: sebidang tanah
  rationale: χωρίον dapat berarti bidang tanah, ladang, atau milik tanah; pilihan ini menjaga cakupan umum tanpa menyiratkan bahwa tanah itu pasti sedang digarap.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: yang telah diberikan Yakub
  rationale: '''Telah'' menandai tindakan pemberian yang mendahului peristiwa narasi, sementara susunan ini tetap jelas dan alami.'
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: kepada Yusuf, anaknya
  rationale: Menjaga Yusuf sebagai penerima dan 'anaknya' sebagai keterangan aposisional yang mengacu kepada Yakub.
