  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: id
  text: Apakah kamu lebih besar daripada leluhur kami, Yakub,[a] yang memberikan sumur itu kepada kami dan yang sendiri minum dari sumur itu, demikian juga anak-anak lelakinya dan ternaknya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “Tentunya kamu tidak lebih besar daripada leluhur kami, Yakub, bukan?” Dalam bahasa Yunani, pertanyaan dengan μή mengharapkan jawaban negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Apakah kamu
  rationale: Pertanyaan yang diawali μή mengharapkan jawaban negatif. Bentuk pertanyaan retoris ini alami dalam bahasa Indonesia, sedangkan penekanannya dijelaskan dalam catatan kaki.
- source_word: μείζων
  choice: lebih besar daripada
  rationale: Dalam konteks ini, kata komparatif tersebut menunjuk pada kebesaran atau kedudukan, bukan ukuran fisik.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: leluhur kami, Yakub
  rationale: πατήρ di sini menyatakan nenek moyang yang dihormati. 'Leluhur' lebih jelas dan alami bagi pembaca Indonesia daripada 'bapa' ketika merujuk kepada Yakub sebagai nenek moyang jauh.
- source_word: ἔδωκεν ἡμῖν τὸ φρέαρ
  choice: memberikan sumur ini kepada kami
  rationale: Aoristus diterjemahkan sebagai tindakan lampau dalam klausa relatif; 'sumur ini' mencerminkan artikel dan benda yang sedang dibicarakan.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: dan yang juga minum dari sumur ini
  rationale: αὐτός menekankan bahwa Yakub sendiri turut minum. 'Juga' menyampaikan keterlibatan pribadi itu secara alami, dan pengulangan 'sumur ini' menghindari rujukan pronominal yang kaku.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: anak-anak lelakinya
  rationale: υἱοί secara khusus berarti anak-anak laki-laki; pilihan ini mempertahankan ketepatan gender.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: ternaknya
  rationale: Istilah ini mencakup hewan piaraan atau ternak tanpa membatasinya hanya pada sapi.
theological_decisions:
- issue: Daya retoris pertanyaan yang diawali μή
  choice: Pertanyaan retoris yang secara tersirat mengharapkan jawaban 'tidak'
  alternative: “Tentunya kamu tidak lebih besar daripada leluhur kami, Yakub, bukan?”
  rationale: Teks utama mempertahankan bentuk pertanyaan dan tantangan perempuan itu tanpa mengubahnya menjadi pernyataan negatif eksplisit; catatan kaki menjelaskan ekspektasi jawaban yang terkandung dalam bahasa Yunani.
- issue: Sebutan πατήρ bagi Yakub
  choice: leluhur
  alternative: bapa
  rationale: Yang dimaksud ialah hubungan nenek moyang dan identitas warisan, bukan ayah biologis langsung. 'Leluhur' mempertahankan maksud tersebut tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'kamu' sesuai dengan dialog langsung tunggal dan mudah dipahami. Susunan kalimat mempertahankan satu pertanyaan retoris serta deretan Yakub, anak-anak lelakinya, dan ternaknya.
