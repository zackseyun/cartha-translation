revisions:
- from: Apakah kamu lebih besar daripada leluhur kami, Yakub,[a] yang memberikan sumur ini kepada kami dan yang juga minum dari sumur ini, bersama anak-anak lelakinya dan ternaknya?
  to: Apakah kamu lebih besar daripada leluhur kami, Yakub,[a] yang memberikan sumur itu kepada kami dan yang sendiri minum dari sumur itu, demikian juga anak-anak lelakinya dan ternaknya?
  rationale: Revisi menghilangkan demonstratif yang tidak diperlukan, menyatakan penekanan αὐτός dengan “sendiri”, dan memperjelas bahwa anak-anak lelaki serta ternak Yakub juga minum dari sumur itu, bukan sekadar hadir bersama Yakub ketika ia minum. Makna retoris pertanyaan tetap dipertahankan, dengan penjelasan dalam catatan kaki.
