id: JHN.4.36
reference: John 4:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: id
  text: Orang yang menuai menerima upah[a] dan mengumpulkan buah untuk hidup kekal[b], supaya orang yang menabur dan orang yang menuai bersukacita bersama-sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “imbalan”. Kata Yunani ini dapat berarti upah kerja maupun balasan.
    reason: lexical_alternative
  - marker: b
    text: Atau “menuju hidup kekal”. Ungkapan ini dapat menyatakan tujuan atau hasil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: orang yang menuai
  rationale: Partisipel kini dengan artikel yang berfungsi sebagai nomina; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa tindakan.
- source_word: μισθὸν
  choice: upah
  rationale: Mempertahankan gambaran konkret tentang pekerjaan dalam metafora panen, sementara kemungkinan arti 'imbalan' dicatat dalam catatan kaki.
- source_word: λαμβάνει
  choice: menerima
  rationale: Bentuk kini menyatakan tindakan yang sedang berlaku; bahasa Indonesia lazim memakai verba tanpa penanda progresif khusus ketika konteks sudah jelas.
- source_word: συνάγει καρπὸν
  choice: mengumpulkan buah
  rationale: Menjaga metafora καρπός secara luas dan membedakannya dari tindakan menuai.
- source_word: εἰς ζωὴν αἰώνιον
  choice: untuk hidup kekal
  rationale: εἰς dapat menyatakan arah, tujuan, atau hasil; 'untuk' alami dan cukup terbuka, dengan alternatif yang lebih harfiah dicatat.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai klausa tujuan atau hasil tanpa memutuskan nuansanya secara berlebihan.
- source_word: ὁ σπείρων
  choice: orang yang menabur
  rationale: Sejajar dengan 'orang yang menuai' dan mempertahankan bentuk verbal partisipelnya.
- source_word: ὁμοῦ χαίρῃ
  choice: dapat bersukacita bersama-sama
  rationale: '''Bersama-sama'' menyampaikan sukacita yang dibagikan, sedangkan ''dapat'' secara wajar mewakili modus subjungtif dalam klausa ἵνα.'
theological_decisions:
- issue: Daya kini dari verba λαμβάνει dan συνάγει
  choice: Tidak menambahkan kata 'sudah' atau 'sekarang'; memakai bentuk kini biasa 'menerima ... dan mengumpulkan'.
  alternative: “Sekarang orang yang menuai sedang menerima ...” atau “Orang yang menuai sudah menerima ...”
  rationale: Teks Yunani tidak memiliki adverbia tersendiri yang berarti 'sudah'. Bentuk kini tetap tercermin secara alami tanpa penambahan yang dapat mempersempit aspek atau waktu.
- issue: Hubungan εἰς ζωὴν αἰώνιον dengan buah yang dikumpulkan
  choice: “untuk hidup kekal”
  alternative: “menuju hidup kekal”
  rationale: Terjemahan utama mempertahankan kemungkinan tujuan atau hasil dan tidak menjelaskan secara dogmatis identitas 'buah'.
- issue: Nuansa ἵνα
  choice: “supaya”
  alternative: “sehingga”
  rationale: ἵνα dapat memuat tujuan dan, dalam konteks, kemungkinan nuansa hasil. 'Supaya' mempertahankan konstruksi tujuan tanpa meniadakan hasil yang dicapai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan 'orang yang menabur' dan 'orang yang menuai' dipertahankan demi paralelisme teks Yunani. 'Bersukacita' dipilih untuk nada yang bermartabat tetapi tetap umum.
