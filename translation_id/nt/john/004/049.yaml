  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: id
  text: Pejabat kerajaan itu berkata kepada-Nya, “Tuhan,[a] turunlah sebelum anakku mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε merupakan sapaan hormat yang juga dapat berarti “Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: pejabat kerajaan
  rationale: Bentuk substantival ini menunjuk kepada seseorang yang terkait dengan raja atau istana. “Pejabat kerajaan” jelas dalam bahasa Indonesia modern dan tidak menambahkan gagasan kelas bangsawan.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini dapat berarti “Tuan,” tetapi “Tuhan” mempertahankan kemungkinan makna berlapis dalam Injil Yohanes tanpa memastikan sejauh mana pemahaman si pembicara.
- source_word: κατάβηθι
  choice: datanglah
  rationale: Imperatif ini secara harfiah mengandung arti turun. Dalam konteks perjalanan dari Kana ke Kapernaum, “datanglah” terdengar alami dalam permohonan langsung; unsur topografis dicatat dalam catatan kaki.
- source_word: πρὶν ἀποθανεῖν
  choice: sebelum ... mati
  rationale: Konstruksi πρίν dengan infinitif menyatakan waktu yang mendahului suatu kejadian; subjek tersiratnya dijelaskan secara alami sebagai anak si pejabat.
- source_word: τὸ παιδίον μου
  choice: anakku
  rationale: παιδίον berarti anak atau anak kecil. “Anakku” mempertahankan hubungan dan tidak menentukan jenis kelamin lebih jauh daripada bentuk Yunani ayat ini.
- source_word: λέγει πρὸς αὐτόν
  choice: berkata kepada-Nya
  rationale: Kala kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami. Pronomina merujuk kepada Yesus.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” menjaga gema kristologis yang mungkin dimaksudkan oleh narasi Yohanes, sedangkan konteks percakapan langsung juga memungkinkan sapaan hormat biasa. Kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Arah gerak dalam κατάβηθι
  choice: datanglah
  alternative: turunlah
  rationale: “Datanglah” paling alami dari sudut pandang pemohon, sementara “turunlah” lebih harfiah dan mempertahankan unsur topografis. Alternatif tersebut dicatat agar rincian sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk “kepada-Nya” mengikuti konvensi penghormatan bagi rujukan kepada Yesus. Permohonan mendesak dipertahankan dengan imperatif “datanglah.”
