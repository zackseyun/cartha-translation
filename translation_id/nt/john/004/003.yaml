  text: he left Judea and went back to Galilee[a].
translation:
  language: id
  text: Ia meninggalkan Yudea dan kembali ke Galilea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pergi lagi ke Galilea.” Kata Yunani πάλιν dapat berarti “lagi”, tetapi di sini kemungkinan besar menunjukkan tindakan kembali; karena itu diterjemahkan “kembali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: meninggalkan
  rationale: Dalam konteks ini, bentuk aoris ἀφίημι berarti meninggalkan suatu tempat. 'Meninggalkan' merupakan padanan Indonesia yang langsung dan wajar dengan objek 'Yudea'.
- source_word: τὴν Ἰουδαίαν
  choice: Yudea
  rationale: Nama baku dalam bahasa Indonesia untuk wilayah geografis yang dimaksud dalam konteks Injil.
- source_word: ἀπῆλθεν
  choice: kembali
  rationale: Secara leksikal ἀπέρχομαι menyatakan pergi atau berangkat, tetapi bersama πάλιν dalam konteks perjalanan ini, frasa tersebut secara alami diterjemahkan 'kembali'.
- source_word: πάλιν
  choice: kembali
  rationale: Di sini πάλιν kemungkinan besar menunjukkan gerak kembali ke tempat yang pernah ditinggalkan, bukan sekadar pengulangan tindakan. Makna itu disampaikan secara idiomatis melalui 'kembali'.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: εἰς menandai arah atau tujuan gerak; 'ke Galilea' adalah ungkapan Indonesia yang alami untuk perjalanan menuju suatu wilayah.
