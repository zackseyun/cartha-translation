base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: id
  text: Namun, Dia berkata kepada mereka, “Aku mempunyai makanan untuk dimakan yang tidak kalian ketahui.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras terhadap perkataan para murid sebelumnya; ‘Namun’ alami dalam narasi Indonesia.
- source_word: εἶπεν αὐτοῖς
  choice: Dia berkata kepada mereka
  rationale: Padanan langsung dan wajar yang mempertahankan gaya naratif sumber.
- source_word: Ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit memberi kontras; ‘Aku’ sudah cukup menyampaikannya tanpa penegas tambahan yang berlebihan.
- source_word: βρῶσιν
  choice: makanan
  rationale: Dalam konteks ini berarti makanan, bukan tindakan makan; pilihan ini juga mempertahankan metafora yang baru dijelaskan oleh konteks berikutnya.
- source_word: ἔχω φαγεῖν
  choice: mempunyai makanan untuk dimakan
  rationale: Mempertahankan konstruksi kepemilikan dan infinitif tujuan secara cukup dekat sekaligus tetap jelas dalam bahasa Indonesia.
- source_word: ἣν
  choice: yang
  rationale: Pronomina relatif ini merujuk kepada ‘makanan’ dan secara alami diterjemahkan ‘yang’.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: yang tidak kalian ketahui
  rationale: ‘Kalian’ menyatakan orang kedua jamak secara jelas, sedangkan ‘ketahui’ mempertahankan objek langsung dan kedekatan dengan οἴδατε.
theological_decisions:
- issue: Makna metaforis ‘makanan’ Yesus
  choice: Mempertahankan istilah harfiah ‘makanan’ tanpa menjelaskan metaforanya dalam ayat ini.
  alternative: Mengganti dengan ‘sumber kekuatan’ atau langsung menjelaskan bahwa yang dimaksud ialah melakukan kehendak Bapa.
  rationale: Konteks berikutnya menerangkan metafora itu, sedangkan ayat ini sengaja mempertahankan ketegangan dan peluang kesalahpahaman para murid.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Dia’ digunakan untuk subjek naratif dan ‘Aku’ dalam ucapan langsung. ‘Kalian’ dipilih untuk menandai bentuk jamak ὑμεῖς dengan jelas.
