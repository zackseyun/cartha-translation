id: JHN.4.48
reference: John 4:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya[a], “Jika kalian tidak melihat tanda-tanda dan keajaiban-keajaiban, kalian pasti tidak akan percaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja “melihat” dan “percaya” dalam bahasa Yunani berbentuk jamak. Jadi, meskipun Yesus sedang berbicara kepada pejabat itu, perkataan-Nya tampaknya juga mencakup kelompok yang lebih luas.
    reason: Menjelaskan peralihan dari satu orang dalam pengantar ke sapaan jamak dalam perkataan Yesus.
lexical_decisions:
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan sekaligus hubungan dengan percakapan sebelumnya secara alami dalam narasi Indonesia, tanpa membuat hubungan logisnya terlalu eksplisit.
- source_word: πρὸς αὐτόν
  choice: kepadanya
  rationale: Menerjemahkan arah tuturan kepada pejabat itu secara langsung dan wajar.
- source_word: Ἐὰν μὴ
  choice: Jika ... tidak
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan struktur syarat negatif Yunani; 'kecuali jika' juga mungkin, tetapi lebih berat di sini.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Mempertahankan istilah khas Injil Yohanes yang menunjuk bukan hanya kepada tindakan ajaib, tetapi juga kepada maknanya.
- source_word: τέρατα
  choice: keajaiban-keajaiban
  rationale: Menyampaikan peristiwa luar biasa yang menimbulkan rasa takjub dan mempertahankan pasangan ungkapan 'tanda-tanda dan keajaiban-keajaiban'.
- source_word: ἴδητε
  choice: kalian ... melihat
  rationale: Pronomina 'kalian' membuat bentuk orang kedua jamak dalam bahasa Yunani terlihat jelas bagi pembaca Indonesia.
- source_word: οὐ μὴ πιστεύσητε
  choice: kalian pasti tidak akan percaya
  rationale: Kata 'pasti' mempertahankan penyangkalan kuat οὐ μή, sedangkan 'akan percaya' sesuai dengan daya prediktif ungkapan tersebut.
- source_word: πιστεύσητε
  choice: percaya
  rationale: Padanan baku dan paling tidak interpretatif bagi πιστεύω dalam Injil Yohanes.
theological_decisions:
- issue: Jumlah dan cakupan pihak yang disapa
  choice: Pengantar tetap menyatakan bahwa Yesus berbicara kepada satu orang, sedangkan perkataan-Nya memakai 'kalian' untuk menandai bentuk jamak Yunani.
  alternative: Memakai 'engkau' sehingga seluruh ucapan dipahami hanya tertuju kepada pejabat itu, atau memakai 'kamu' yang dapat mengaburkan jumlah.
  rationale: πρὸς αὐτόν menunjuk kepada satu orang, tetapi ἴδητε dan πιστεύσητε berbentuk jamak. Terjemahan ini mempertahankan ketegangan antara lawan bicara langsung dan cakupan ucapan yang lebih luas tanpa menentukan secara pasti siapa saja yang termasuk di dalamnya.
translation_notes:
  register: Bahasa Indonesia baku-modern, lugas, dan bermartabat. 'Kalian' dipilih bukan untuk memberi nuansa santai, melainkan untuk memperlihatkan jumlah jamak yang dinyatakan oleh bentuk verba Yunani. Pengulangan bentuk jamak pada 'tanda-tanda' dan 'keajaiban-keajaiban' mengikuti makna nomina jamak sumber dan terdengar alami dalam konteks ini.
