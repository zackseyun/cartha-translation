  source_fidelity: Terjemahan mempertahankan alur οὖν dengan “Lalu,” pengantar tunggal πρὸς αὐτόν dengan “kepadanya,” serta pergeseran penting ke orang kedua jamak pada ἴδητε dan πιστεύσητε melalui “kalian.” “Jika ... tidak” menyampaikan Ἐὰν μὴ secara setia, dan “pasti tidak akan percaya” cukup mencerminkan penyangkalan tegas οὐ μή tanpa menambahkan penafsiran.
  naturalness: Bahasanya baku-modern, jelas, dan sesuai register naratif Injil. “Kalian” secara efektif menandai bentuk jamak yang tidak dapat ditangkap oleh “kamu.” Pengulangan pada “tanda-tanda dan keajaiban-keajaiban” agak berirama berat, tetapi tetap alami dan dapat dibenarkan untuk mempertahankan kedua nomina jamak.
  terminology: “Yesus,” “tanda-tanda,” “keajaiban-keajaiban,” dan “percaya” merupakan padanan yang konsisten dan tidak terlalu menafsirkan. “Tanda-tanda” khususnya mempertahankan istilah penting σημεῖα dalam Yohanes tanpa menggantinya dengan “mukjizat.”
