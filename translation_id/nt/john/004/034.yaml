  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: id
  text: Yesus berkata kepada mereka, “Makanan-Ku ialah melakukan kehendak Dia yang mengutus Aku[b] dan menyelesaikan pekerjaan-Nya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menuntaskan pekerjaan-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: “Dia yang mengutus Aku” dalam konteksnya mengacu kepada Bapa, meskipun teks Yunani tidak menyebut gelar itu secara eksplisit di sini.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: makanan
  rationale: Makna biasa βρῶμα adalah ‘makanan’. Ungkapan konkret ini dipertahankan karena dalam konteksnya para murid sedang membicarakan makanan jasmani.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Makanan-Ku ialah
  rationale: Terjemahan ini mempertahankan metafora sumber secara jelas dan tetap wajar dalam bahasa Indonesia yang bermartabat.
- source_word: ἵνα ποιήσω
  choice: melakukan
  rationale: Sesudah ‘ialah’, bentuk verbal ini secara idiomatis menyatakan isi dari metafora makanan, tanpa mempertahankan susunan Yunani secara kaku.
- source_word: τὸ θέλημα
  choice: kehendak
  rationale: ‘Kehendak’ merupakan padanan yang tepat dan lazim bagi θέλημα serta mempertahankan bobot teologis ungkapan ini.
- source_word: τοῦ πέμψαντός με
  choice: Dia yang mengutus Aku
  rationale: Partisipel berartikel diterjemahkan sebagai klausa relatif personal. Huruf kapital mengikuti acuan kontekstual kepada Allah tanpa menambahkan gelar yang tidak tertulis dalam bahasa Yunani.
- source_word: τελειώσω
  choice: menyelesaikan
  rationale: τελειόω menunjuk pada membawa sesuatu sampai tuntas atau mencapai penyelesaiannya. ‘Menyelesaikan’ alami dalam bahasa Indonesia dan tetap memuat gagasan penuntasan.
- source_word: ἔργον
  choice: pekerjaan
  rationale: ‘Pekerjaan’ adalah padanan paling langsung dan sesuai konteks bagi ἔργον, yakni karya atau tugas yang dipercayakan kepada Yesus.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesus berkata kepada mereka
  rationale: Walaupun λέγει berbentuk kini historis, bentuk lampau ‘berkata’ lebih alami dalam narasi bahasa Indonesia dan tidak mengubah urutan peristiwa.
theological_decisions:
- issue: Acuan ‘Dia yang mengutus Aku’
  choice: Acuan kontekstual kepada Bapa/Allah tetap dinyatakan secara implisit sebagai ‘Dia yang mengutus Aku’.
  alternative: Menuliskan secara eksplisit ‘Bapa yang mengutus Aku’.
  rationale: Konteks Injil Yohanes menunjuk kepada Bapa, tetapi teks Yunani ayat ini tidak menyebut gelar tersebut. Terjemahan tidak menambahkan identifikasi eksplisit ke dalam teks utama.
- issue: Nuansa τελειώσω
  choice: menyelesaikan
  alternative: menuntaskan
  rationale: Keduanya dapat menyatakan penyelesaian karya. ‘Menyelesaikan’ lebih umum dan alami, sementara catatan kaki mempertahankan alternatif yang menekankan penuntasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Metafora ‘makanan’ dipertahankan, pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia, dan susunan kalimat dibuat alami tanpa memperjelas secara berlebihan hal yang tetap implisit dalam teks Yunani.
