  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καίτοιγε Ἰησοῦς αὐτὸς οὐκ ἐβάπτιζεν ἀλλ’ οἱ μαθηταὶ αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/002.yaml
  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: id
  text: meskipun Yesus sendiri tidak membaptis[a], melainkan murid-murid-Nya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus sendiri tidak sedang membaptis, melainkan murid-murid-Nya.” Bentuk kata kerja Yunani dapat menunjukkan tindakan yang sedang berlangsung atau yang biasa dilakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοιγε
  choice: meskipun
  rationale: Kata penghubung ini memperkenalkan penjelasan konsesif terhadap ayat sebelumnya. “Meskipun” alami dalam bahasa Indonesia modern dan mempertahankan hubungan tersebut.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: αὐτὸς
  choice: sendiri
  rationale: Kata ganti ini bersifat emfatis dan menegaskan bahwa Yesus secara pribadi bukanlah orang yang melakukan pembaptisan.
- source_word: οὐκ ἐβάπτιζεν
  choice: tidak membaptis
  rationale: Bentuk imperfek menyatakan tindakan yang sedang berlangsung atau biasa dilakukan dalam konteks lampau. Bahasa Indonesia tidak wajib menandai aspek itu pada verba, dan “tidak membaptis” paling alami; kemungkinan nuansa aspek dicatat dalam catatan kaki.
- source_word: ἀλλ’
  choice: melainkan
  rationale: Dalam konstruksi negatif, “melainkan” menyatakan kontras korektif secara lebih tepat dan alami daripada sekadar “tetapi”.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Bentuk jamak Yunani dipertahankan. Verba kedua dilesapkan dalam bahasa Yunani dan tetap dapat dipahami secara alami dalam bahasa Indonesia dari klausa sebelumnya.
theological_decisions:
- issue: Siapa yang melakukan pembaptisan dalam pelayanan Yesus
  choice: Yesus sendiri tidak secara pribadi membaptis; murid-murid-Nya yang melakukannya.
  alternative: Ayat dapat dibuat eksplisit sebagai “Yesus sendiri tidak membaptis, melainkan murid-murid-Nya yang membaptis.”
  rationale: Terjemahan mempertahankan penekanan pada αὐτός dan elipsis Yunani tanpa menambahkan penjelasan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda pisah dipertahankan karena ayat ini merupakan sisipan penjelas yang berlanjut ke ayat berikutnya; kapitalisasi “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus.
