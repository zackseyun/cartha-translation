  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: id
  text: Karena itu, ia menanyakan kepada mereka pada jam berapa anaknya mulai membaik. Mereka menjawab, “Kemarin pada jam ketujuh[a] demamnya hilang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jika jam dihitung sejak matahari terbit, artinya sekitar pukul satu siang; sebagian penafsir memahami cara Yohanes menghitung waktu secara berbeda.
    reason: Menjelaskan kemungkinan padanan waktu modern tanpa menghapus ketidakpastian yang ada dalam teks.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Karena itu, ia menanyakan
  rationale: ἐπύθετο menyatakan tindakan bertanya atau mencari tahu, sedangkan οὖν menghubungkan pertanyaan ini dengan laporan para hamba pada ayat sebelumnya. Bentuk ini alami dalam narasi Indonesia.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: kepada mereka pada jam berapa
  rationale: παρ’ αὐτῶν menunjukkan para hamba sebagai sumber informasi. Susunan pertanyaan tidak langsung ini lebih alami daripada mempertahankan struktur Yunani secara kaku.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: anaknya mulai membaik
  rationale: Ungkapan idiomatis κομψότερον ἔσχεν berarti keadaan kesehatannya menjadi lebih baik. 'Mulai membaik' sesuai dengan fokus pada saat perubahan itu terjadi; subjek dijelaskan sebagai 'anaknya' agar rujukannya alami dan tidak rancu dalam bahasa Indonesia.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Mereka menjawab
  rationale: Dalam konteks pertanyaan langsung, 'menjawab' mengungkapkan fungsi ujaran dengan alami. οὖν di sini meneruskan urutan narasi dan tidak perlu diterjemahkan lagi secara eksplisit.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Kemarin pada jam ketujuh
  rationale: Terjemahan ini mempertahankan penamaan waktu dalam teks Yunani tanpa menentukan sistem penghitungan jam yang digunakan.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: demamnya hilang
  rationale: Secara harfiah demam itu 'meninggalkan dia'. 'Demamnya hilang' merupakan ungkapan Indonesia yang alami dan tetap menyatakan lenyapnya demam dari anak itu.
theological_decisions:
- issue: Sistem penghitungan 'jam ketujuh'
  choice: Mempertahankan 'jam ketujuh' dalam teks utama
  alternative: Sekitar pukul satu siang jika dihitung sejak matahari terbit; atau waktu lain bila Yohanes memakai sistem penghitungan yang berbeda
  rationale: Teks Yunani tidak menyebut sistem penghitungan waktunya. Mempertahankan bentuk literal menghindari penetapan kronologi yang melampaui bukti dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur Yunani disampaikan secara alami; 'anaknya' dipakai untuk memperjelas rujukan αὐτόν dalam konteks, sedangkan istilah waktu sumber dipertahankan dan diterangkan dalam catatan kaki.
