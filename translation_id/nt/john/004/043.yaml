  text: Μετὰ δὲ τὰς δύο ἡμέρας ἐξῆλθεν ⸀ἐκεῖθεν εἰς τὴν Γαλιλαίαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: id
  text: Setelah dua hari itu, Yesus berangkat dari sana ke Galilea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Setelah dua hari itu
  rationale: μετά dengan akusatif menyatakan urutan waktu, yaitu “setelah.” Artikel pada “dua hari” menunjuk kembali pada masa tinggal dua hari yang baru disebutkan (ayat 40). δέ merupakan penghubung ringan dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia.
- source_word: ἐξῆλθεν
  choice: Yesus berangkat
  rationale: Bentuk aoris ἐξέρχομαι secara harfiah berarti “keluar,” tetapi dalam narasi perjalanan “berangkat” secara alami menyatakan bahwa ia meninggalkan tempat sebelumnya. Subjek “Yesus” dibuat eksplisit agar jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Adverbia tempat ini menunjuk pada tempat yang baru disebutkan dalam konteks sebelumnya; “dari sana” adalah padanan Indonesia yang alami dan tepat.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: menuju Galilea
  rationale: εἰς menandai gerak ke arah tujuan. “Menuju Galilea” berpadu alami dengan “berangkat” dan mempertahankan gagasan arah perjalanan tanpa penandaan spasial yang berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur narasi Yunani secara alami. Tidak diperlukan catatan kaki karena variasi “ke Galilea” hanya merupakan padanan Indonesia yang setara, bukan perbedaan makna yang perlu dicatat.
