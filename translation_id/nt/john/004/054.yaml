  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: id
  text: Inilah, sekali lagi, tanda kedua yang dilakukan Yesus setelah Ia datang dari Yudea ke Galilea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat.” Yohanes lazim memakai “tanda” untuk menekankan makna perbuatan itu, bukan hanya kuasanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Itulah
  rationale: Kata penunjuk ini merujuk kembali kepada penyembuhan yang baru saja diceritakan; “Itulah” secara alami mengidentifikasi peristiwa tersebut.
- source_word: δὲ πάλιν δεύτερον
  choice: tanda kedua
  rationale: πάλιν bersama δεύτερον menandai bahwa inilah tanda yang kedua dalam rangkaian yang dimaksud. Dalam bahasa Indonesia, penomoran “kedua” sudah menyampaikan hubungan pengulangan itu tanpa ungkapan kaku “lagi yang kedua”.
- source_word: σημεῖον
  choice: tanda
  rationale: Dalam Injil Yohanes, istilah ini menunjuk kepada karya ajaib yang juga memiliki makna penyingkapan; “tanda” mempertahankan fungsi sastra dan teologis tersebut.
- source_word: ἐποίησεν
  choice: yang dilakukan
  rationale: ποιέω dengan σημεῖον berarti melakukan suatu karya; bentuk pasif-relatif ini alami dalam kalimat bahasa Indonesia dan tidak menambahkan nuansa khusus seperti “mempertunjukkan”.
- source_word: ἐλθὼν
  choice: setelah Ia datang
  rationale: Partisip aoris paling wajar dipahami secara temporal sebagai tindakan yang mendahului tanda tersebut.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: dari Yudea ke Galilea
  rationale: Ungkapan ini secara alami mempertahankan titik asal dan arah perjalanan dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah σημεῖον dalam Injil Yohanes
  choice: tanda
  alternative: mukjizat
  rationale: “Tanda” mempertahankan penekanan khas Yohanes bahwa karya itu bukan hanya perbuatan berkuasa, melainkan juga menunjuk kepada makna yang lebih jauh, tanpa menjelaskan makna tersebut secara berlebihan.
- issue: Hubungan πάλιν dengan δεύτερον
  choice: Itulah tanda kedua
  alternative: Itulah lagi tanda kedua / Ini kembali merupakan tanda kedua
  rationale: Susunan Yunani dapat terasa berlebih jika dipindahkan secara harfiah. Bahasa Indonesia menyampaikan urutan yang dimaksud secara alami melalui “kedua”, sambil menghindari kesan bahwa ada dua tanda yang masing-masing disebut kedua.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Kata ganti “Ia” dipakai untuk Yesus sesuai kebiasaan teks Alkitab Indonesia, sedangkan nama wilayah memakai bentuk umum “Yudea” dan “Galilea”.
