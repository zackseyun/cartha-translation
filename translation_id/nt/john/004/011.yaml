  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: id
  text: Perempuan itu berkata kepada-Nya, “Tuan[a], Tuan tidak mempunyai timba, dan sumur itu dalam. Jadi, dari mana Tuan memperoleh air hidup[b] itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan.” Kata Yunani κύριε adalah sapaan hormat yang dapat berarti “Tuan” atau “Tuhan,” bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Atau “air mengalir,” yaitu air segar yang mengalir, bukan air yang tergenang. Ungkapan “air hidup” juga mempertahankan kemungkinan makna yang lebih dalam dalam percakapan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: Perempuan itu berkata kepadanya
  rationale: Bentuk kini historis λέγει dialihkan dengan bentuk lampau naratif yang alami dalam bahasa Indonesia. ἡ γυνή menunjuk kepada perempuan Samaria dalam konteks ini.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam tahap percakapan ini, sapaan tersebut paling wajar dipahami sebagai sapaan hormat. Bahasa Indonesia membedakan lebih tegas antara 'Tuan' dan 'Tuhan', sehingga 'Tuan' menghindari kesan bahwa perempuan itu sudah mengakui keilahian Yesus; kemungkinan 'Tuhan' tetap dicatat.
- source_word: ἄντλημα
  choice: timba
  rationale: Kata ini menunjuk pada alat untuk menimba air. 'Timba' adalah padanan Indonesia yang alami dan tepat bagi latar sumur.
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: sumur ini dalam
  rationale: φρέαρ dalam konteks ini adalah sumur, dan βαθύ berarti dalam tanpa perlu penambahan 'sangat'.
- source_word: πόθεν οὖν ἔχεις
  choice: Jadi, dari mana Tuan mendapatkan
  rationale: πόθεν menanyakan asal atau sumber, sedangkan οὖν menyatakan kesimpulan dari keadaan yang baru disebutkan.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: air hidup itu
  rationale: 'Terjemahan harfiah ini mempertahankan permainan makna Yohanes: ungkapan tersebut dapat dipahami sebagai air segar yang mengalir, tetapi juga mengandung arti rohani yang lebih dalam.'
theological_decisions:
- issue: Makna sapaan κύριε kepada Yesus
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks awal percakapan mendukung sapaan hormat biasa. Memakai 'Tuhan' dalam teks utama dapat menyiratkan pengakuan teologis yang belum tentu dimaksudkan oleh perempuan itu, tetapi kemungkinan tersebut dipertahankan dalam catatan kaki.
- issue: Makna ganda ὕδωρ τὸ ζῶν
  choice: air hidup
  alternative: air mengalir
  rationale: '''Air hidup'' mempertahankan ungkapan sumber serta ketegangan antara pemahaman harfiah perempuan itu dan makna rohani dalam perkataan Yesus.'
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pengulangan 'Tuan' menghindari pemilihan antara 'Anda' yang lebih modern dan 'Engkau' yang dapat terdengar religius atau menandai keakraban. 'Sedangkan' menyampaikan hubungan antara ketiadaan timba dan kedalaman sumur tanpa mengikuti konstruksi Inggris yang secara logis bermasalah.
