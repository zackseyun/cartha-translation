id: JHN.4.25
reference: John 4:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: id
  text: Perempuan itu berkata kepadanya, “Saya tahu bahwa Mesias akan datang, yaitu dia yang disebut Kristus.[a] Ketika dia datang, dia akan memberitahukan segala sesuatu kepada kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Mesias, dia yang disebut Kristus.” “Mesias” berasal dari gelar Semitik, sedangkan “Kristus” adalah padanan Yunaninya; keduanya berarti “Yang Diurapi.”'
    reason: Mempertahankan dan menjelaskan fungsi dwibahasa frasa Μεσσίας, ὁ λεγόμενος χριστός.
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: Perempuan itu berkata kepadanya
  rationale: Bentuk kini historis λέγει dialihkan dengan bentuk naratif lampau yang wajar dalam bahasa Indonesia; γυνή dalam konteks menunjuk kepada perempuan Samaria itu.
- source_word: Οἶδα
  choice: Saya tahu
  rationale: Ungkapan ini langsung dan alami; “saya” sesuai dengan percakapan seorang perempuan dengan orang yang belum lama dikenalnya.
- source_word: Μεσσίας
  choice: Mesias
  rationale: Μεσσίας adalah bentuk Yunani dari gelar Semitik; bentuk baku dan dikenal dalam bahasa Indonesia ialah “Mesias”.
- source_word: ἔρχεται
  choice: akan datang
  rationale: Bentuk kini Yunani di sini berfungsi futuristik; “akan datang” menyampaikan acuan masa depan dengan jelas dalam bahasa Indonesia.
- source_word: ὁ λεγόμενος χριστός
  choice: yaitu dia yang disebut Kristus
  rationale: Rumusan ini mempertahankan keterangan penjelas dalam teks Yunani dan membedakan Μεσσίας dari padanan Yunaninya, χριστός.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: Ketika dia datang
  rationale: Konstruksi ini menunjuk kepada peristiwa masa depan yang diharapkan. Kata ganti eksplisit mempertahankan rujukan ἐκεῖνος tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: dia akan memberitahukan segala sesuatu kepada kami
  rationale: “Memberitahukan” mencakup tindakan menyatakan atau menjelaskan, sedangkan “segala sesuatu” mempertahankan daya cakup ἅπαντα. “Kami” secara alami mengecualikan lawan bicara dari kelompok yang dimaksud perempuan itu.
theological_decisions:
- issue: Pembedaan Μεσσίας dan χριστός dalam frasa penjelas
  choice: “Mesias” untuk Μεσσίας dan “Kristus” untuk χριστός
  alternative: Menerjemahkan keduanya sebagai “Mesias”
  rationale: Teks sumber sengaja menjelaskan gelar Semitik dengan padanan Yunaninya. Bahasa Indonesia mengenal kedua bentuk tersebut, sehingga pembedaan itu dapat dipertahankan secara alami tanpa menambahkan klaim teologis.
- issue: Cakupan kata ganti ἡμῖν
  choice: “kepada kami”
  alternative: “kepada kita”
  rationale: Dalam konteks percakapan perempuan Samaria dengan seorang Yahudi, bentuk eksklusif “kami” paling mungkin mencerminkan kelompok yang sedang dipikirkannya, tetapi ayat itu sendiri tidak menjabarkan batas kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Saya” dipakai sebagai kata ganti penutur yang wajar dalam percakapan ini; kata ganti orang ketiga tidak dikapitalisasi agar kapitalisasi tidak menambahkan penafsiran teologis yang tidak ditandai oleh teks Yunani.
