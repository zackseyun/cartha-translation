id: JHN.4.1
reference: John 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: id
  text: Karena itu, ketika Yesus mengetahui bahwa orang-orang Farisi telah mendengar bahwa Yesus menjadikan dan membaptis lebih banyak murid daripada Yohanes—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus menjadikan lebih banyak orang sebagai murid dan membaptis lebih banyak orang daripada Yohanes.” Dalam bahasa Yunani, perbandingan ini dapat berlaku pada gabungan kedua kegiatan, bukan hanya pada jumlah “murid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Karena itu, ketika
  rationale: Ὡς membentuk anak kalimat waktu, sedangkan οὖν menandai kesimpulan atau kelanjutan alur; susunan ini mempertahankan kedua fungsi tersebut dalam bahasa Indonesia yang wajar.
- source_word: ἔγνω
  choice: mengetahui
  rationale: Bentuk aoris γινώσκω di sini menyatakan bahwa Yesus mengetahui atau menyadari keadaan tersebut; 'mengetahui' ringkas dan netral.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Padanan baku dan mudah dipahami untuk nama kelompok tersebut; bentuk jamak dinyatakan secara alami.
- source_word: ἤκουσαν
  choice: telah mendengar
  rationale: Kata 'telah' memperjelas bahwa kabar itu sudah sampai kepada orang-orang Farisi sebelum Yesus mengetahuinya.
- source_word: πλείονας μαθητὰς
  choice: lebih banyak murid
  rationale: Menyampaikan bentuk perbandingan secara langsung dan alami.
- source_word: ποιεῖ
  choice: menjadikan
  rationale: Dalam hubungan dengan μαθητάς, ποιέω berarti menjadikan orang sebagai murid. Pilihan ini dekat dengan bentuk Yunani tanpa mendahului penjelasan ayat berikutnya.
- source_word: βαπτίζει
  choice: membaptis
  rationale: Padanan baku βαπτίζω dalam narasi Perjanjian Baru.
- source_word: ἢ Ἰωάννης
  choice: daripada Yohanes
  rationale: Mempertahankan konstruksi perbandingan yang ringkas; cakupan perbandingannya dapat dipahami dengan lebih dari satu cara.
theological_decisions:
- issue: Kesan bahwa Yesus sendiri membaptis orang
  choice: Mempertahankan bunyi permukaan ayat 4:1 bahwa Yesus menjadikan dan membaptis murid.
  alternative: Menambahkan bahwa kelompok atau murid-murid Yesuslah yang membaptis, berdasarkan penjelasan ayat 4:2.
  rationale: Ayat berikutnya memberi penjelasan bahwa Yesus sendiri tidak membaptis. Terjemahan ayat ini tidak boleh mendahului dan memasukkan penjelasan itu sehingga ketegangan naratif asli tetap terpelihara.
- issue: Cakupan perbandingan πλείονας ... ἢ Ἰωάννης
  choice: Teks utama dapat dibaca sebagai 'lebih banyak murid daripada Yohanes' dalam rangkaian menjadikan dan membaptis.
  alternative: 'Perbandingan berlaku pada gabungan kegiatan: Yesus lebih banyak menjadikan murid dan membaptis daripada Yohanes.'
  rationale: Susunan Yunani memungkinkan perbandingan dipahami terutama bersama 'lebih banyak murid' maupun meliputi kedua verba. Ambiguitas yang nyata dicatat tanpa dipaksakan ke satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki ditempatkan sesudah klausa dan sebelum kelanjutan naratif.
