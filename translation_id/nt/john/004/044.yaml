  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: id
  text: Sebab Yesus sendiri telah bersaksi bahwa seorang nabi tidak mendapat kehormatan di daerah asalnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tanah airnya” atau “di tempat asalnya.” Kata Yunani πατρίς dapat merujuk pada tanah air, kampung halaman, atau daerah asal seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan yang menghubungkan ayat ini dengan alur narasi di sekitarnya; “Sebab” mempertahankan fungsi wacananya secara alami dalam bahasa Indonesia.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: Yesus sendiri
  rationale: αὐτός memberi penekanan pada Ἰησοῦς; “Yesus sendiri” mempertahankan penekanan itu dengan ungkapan Indonesia yang wajar.
- source_word: ἐμαρτύρησεν
  choice: telah bersaksi
  rationale: Pilihan ini mempertahankan kosakata kesaksian yang penting dalam Injil Yohanes. Bentuk “telah” menyatakan tindakan lampau secara alami tanpa memaksakan nuansa yang tidak ada.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi kesaksian Yesus dan secara wajar diterjemahkan dengan “bahwa”.
- source_word: προφήτης
  choice: seorang nabi
  rationale: Nomina tunggal tanpa artikel ini bersifat tak tentu dan merupakan bagian dari pernyataan yang bernada pepatah.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: di daerah asalnya
  rationale: πατρίς dapat menunjuk tempat asal, daerah asal, atau tanah air seseorang. “Daerah asalnya” alami dalam bahasa Indonesia dan tidak terlalu cepat menentukan cakupan geografisnya.
- source_word: τιμὴν οὐκ ἔχει
  choice: tidak mendapat kehormatan
  rationale: Ungkapan ini menyampaikan ketiadaan penghormatan secara idiomatis dalam bahasa Indonesia sambil mempertahankan nomina τιμή sebagai “kehormatan”.
theological_decisions:
- issue: Acuan dan cakupan “daerah asalnya” dalam konteks Injil Yohanes
  choice: Menerjemahkan pernyataan itu apa adanya tanpa menentukan apakah tempat yang dimaksud adalah Yudea, Galilea, atau Nazaret.
  alternative: Menentukan acuannya secara eksplisit sebagai Yudea, Galilea, atau Nazaret.
  rationale: Ayat ini sendiri menyampaikan pernyataan umum dan tidak secara eksplisit menyebut wilayah yang dimaksud. Pilihan yang lebih luas mempertahankan ketegangan penafsiran dalam konteks narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. “Daerah asalnya” dipilih agar mudah dipahami sekaligus mempertahankan keluasan makna geografis πατρίς.
