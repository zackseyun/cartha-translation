  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: id
  text: Sebab engkau pernah mempunyai lima suami[a], dan laki-laki yang sekarang bersamamu bukan suamimu. Yang engkau katakan itu benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “lima laki-laki.” Kata Yunani ἀνήρ dapat berarti “laki-laki” atau “suami”; dalam konteks ini, arti “suami” lebih sesuai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε
  choice: lima
  rationale: Angka pokok yang secara langsung menerangkan ἄνδρας.
- source_word: γὰρ
  choice: sebab
  rationale: Kata ini menjelaskan alasan Yesus menegaskan bahwa perkataan perempuan itu benar.
- source_word: ἄνδρας
  choice: suami
  rationale: ἀνήρ dapat berarti 'laki-laki' atau 'suami', tetapi konteks riwayat perkawinan dan kontras dengan οὐκ ἔστιν σου ἀνήρ mendukung arti 'suami'.
- source_word: ἔσχες
  choice: sudah mempunyai
  rationale: Aoristus menunjuk pada riwayat hubungan sebelumnya; 'sudah mempunyai' menyampaikan pengalaman lampau yang relevan dengan keadaan kini.
- source_word: νῦν
  choice: sekarang
  rationale: Adverbia temporal yang menandai keadaan perempuan itu pada saat ini.
- source_word: ὃν ἔχεις
  choice: laki-laki yang sekarang bersamamu
  rationale: Terjemahan relasional ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan kepemilikan harfiah yang dapat muncul dari 'yang kaumiliki'.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: bukanlah suamimu
  rationale: Genitif σου bersama ἀνήρ menyatakan hubungan perkawinan; bentuk ini jelas dan mempertahankan kontras dengan lima suami sebelumnya.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: Dalam hal ini, engkau berkata benar
  rationale: Ungkapan ini mempertahankan demonstrativa τοῦτο sebagai rujukan pada pernyataan sebelumnya serta nuansa bahwa perkataan tersebut benar.
theological_decisions:
- issue: Makna ἀνήρ pada kedua kemunculan
  choice: Kemunculan pertama diterjemahkan 'suami' dan kemunculan kedua 'suamimu'.
  alternative: Menerjemahkan secara lebih leksikal sebagai 'laki-laki' pada satu atau kedua kemunculan.
  rationale: Konteks langsung membicarakan riwayat perkawinan dan hubungan kini yang bukan perkawinan. Pilihan 'suami' menyampaikan arti kontekstual tanpa menambahkan penilaian moral yang tidak dinyatakan dalam ayat.
- issue: Makna relasional ὃν ἔχεις
  choice: laki-laki yang sekarang bersamamu
  alternative: laki-laki yang sekarang kaumiliki
  rationale: Bahasa sumber memakai ἔχω, tetapi dalam konteks ini maknanya relasional. 'Bersamamu' mempertahankan maksudnya dalam bahasa Indonesia alami tanpa mengubah laki-laki tersebut menjadi objek kepemilikan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'engkau' dipakai sesuai tuturan langsung tunggal dalam konteks Alkitab. Susunan dua kalimat menjaga alur penjelasan Yunani sekaligus menghindari kalimat Indonesia yang terlalu berat.
