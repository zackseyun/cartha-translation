id: JHN.4.31
reference: John 4:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: id
  text: Sementara itu[a], murid-murid terus mendesaknya[b], “Rabi,[c] makanlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada waktu itu.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerjanya juga dapat diterjemahkan “terus meminta kepadanya” atau “berulang kali memintanya”; dalam konteks ini permintaan itu bernada desakan agar Yesus makan.
    reason: lexical_alternative
  - marker: c
    text: “Rabi” adalah gelar sapaan Yahudi yang juga berarti “Guru.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Sementara itu
  rationale: Ungkapan ini menunjuk pada waktu sela dalam rangkaian peristiwa. “Sementara itu” alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: ἠρώτων
  choice: terus mendesak
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau berulang. Dalam konteks ajakan agar Yesus makan, “terus mendesak” menyampaikan daya permohonan itu, sedangkan catatan kaki mempertahankan kemungkinan terjemahan yang lebih netral.
- source_word: αὐτὸν
  choice: -nya
  rationale: Pronomina objek ini merujuk kepada Yesus. Bentuk enklitik “-nya” merupakan padanan Indonesia yang alami tanpa mengulang nama yang tidak terdapat dalam teks sumber.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Artikel Yunani menunjuk pada kelompok murid yang sudah diketahui dari konteks; bahasa Indonesia tidak memerlukan penanda definit yang tersendiri.
- source_word: λέγοντες
  choice: diungkapkan melalui kutipan langsung
  rationale: Bahasa Indonesia secara alami dapat menghubungkan verba mendesak langsung dengan isi ujarannya tanpa menerjemahkan partisip ini secara kaku sebagai “sambil berkata.”
- source_word: Ῥαββί
  choice: Rabi
  rationale: Gelar sapaan Yahudi ini dipertahankan dalam bentuk transliterasi Indonesia, dengan keterangan maknanya dalam catatan kaki.
- source_word: φάγε
  choice: makanlah
  rationale: Imperatif tunggal diterjemahkan langsung dengan bentuk perintah atau permintaan Indonesia “makanlah,” yang tetap dapat bernada ajakan sesuai konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami dengan kutipan langsung sebagai isi desakan; bentuk “terus” mencerminkan aspek imperfek Yunani. Pronomina “-nya” ditulis dengan huruf kecil sesuai ejaan umum dan tidak dimaksudkan sebagai pernyataan teologis.
