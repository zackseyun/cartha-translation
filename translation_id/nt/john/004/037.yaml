  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: id
  text: 'Sebab dalam hal ini perkataan itu benar: yang satu menabur dan yang lain menuai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yang satu adalah penabur dan yang lain adalah penuai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Sebab dalam hal ini
  rationale: Menjaga fungsi γάρ sebagai penghubung penjelas dan rujukan demonstratif ἐν τούτῳ kepada keadaan yang sedang dibicarakan.
- source_word: ὁ λόγος
  choice: perkataan ini
  rationale: Dalam konteks ini λόγος menunjuk pada ungkapan atau peribahasa yang isi lengkapnya segera diberikan, bukan gelar teologis 'Firman'.
- source_word: ἀληθινός
  choice: benarlah
  rationale: Menyatakan bahwa perkataan tersebut berlaku atau terbukti benar; bentuk ini alami dalam bahasa Indonesia yang bermartabat.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi perkataan yang dinyatakan benar.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: orang yang satu ... orang yang lain
  rationale: Mempertahankan kontras antara dua pihak yang berbeda tanpa menentukan identitas mereka.
- source_word: ὁ σπείρων
  choice: yang menabur
  rationale: Mencerminkan partisipel substantival kini secara alami dan mempertahankan tindakan verbalnya.
- source_word: ὁ θερίζων
  choice: yang menuai
  rationale: Sejajar dengan 'yang menabur' serta mempertahankan bentuk dan tindakan verbal partisipel Yunani.
theological_decisions:
- issue: Identitas penabur dan penuai
  choice: Dibiarkan sebagai dua pihak umum yang berbeda.
  alternative: Menentukan penabur sebagai para nabi, Yohanes Pembaptis, atau Yesus, dan penuai sebagai para murid.
  rationale: Ayat ini sendiri menyampaikan sebuah perkataan umum dan tidak menyebut identitas pihak-pihak tersebut; penafsirannya diserahkan kepada konteks agar ketegangan teologis tidak diselesaikan di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Yang menabur adalah orang yang satu' sengaja mempertahankan penekanan Yunani bahwa penabur dan penuai merupakan pihak yang berbeda, sedangkan catatan kaki menyediakan bentuk nominal yang lebih ringkas dan bercorak peribahasa.
