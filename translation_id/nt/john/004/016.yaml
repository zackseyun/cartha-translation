  register: Bahasa Indonesia modern, jelas, dan bermartabat. Subjek “Yesus” dinyatakan agar rujukan pronomina Yunani yang tersirat dalam verba tetap jelas dalam kutipan ayat yang berdiri sendiri. Partikel “-lah” mempertahankan bentuk perintah secara alami tanpa membuat nadanya berlebihan.
