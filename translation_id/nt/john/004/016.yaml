  text: Yesus berkata kepadanya, “Pergilah, panggillah suamimu dan datanglah ke sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: berkata
  rationale: Bentuk kini Yunani dipakai sebagai present historis dalam narasi. Bahasa Indonesia secara alami dapat memakai “berkata” tanpa menandai waktu secara morfologis; catatan kaki mempertahankan kemungkinan nuansa “berkata” dalam adegan yang dihadirkan secara hidup.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Pronomina datif menandai penerima tuturan. Rujukannya adalah perempuan Samaria dalam konteks; bentuk “kepadanya” alami dalam bahasa Indonesia.
- source_word: Ὕπαγε
  choice: Pergilah
  rationale: Imperatif ini menyuruh perempuan itu pergi untuk melakukan tindakan berikutnya. “Pergilah” ringkas, alami, dan mempertahankan daya perintah.
- source_word: φώνησον
  choice: panggil
  rationale: Dalam konteks ini φωνέω berarti memanggil atau menyuruh seseorang datang. “Panggil” adalah padanan Indonesia yang langsung dan wajar.
- source_word: τὸν ἄνδρα σου
  choice: suamimu
  rationale: ἀνήρ dapat berarti “laki-laki” atau “suami”; konstruksi dengan kata milik serta konteks ayat berikutnya mendukung arti “suami”.
- source_word: καὶ
  choice: lalu
  rationale: Konjungsi menghubungkan dua perintah yang berurutan. “Lalu” menyampaikan urutan tindakan secara alami tanpa mengubah hubungan dasarnya.
- source_word: ἐλθὲ
  choice: datanglah
  rationale: Imperatif ἔρχομαι berarti “datang”. Terjemahan ini tidak menambahkan gagasan “kembali” yang hanya tersirat oleh konteks.
- source_word: ἐνθάδε
  choice: ke sini
  rationale: Adverbia tempat ini berarti “di/ke sini”; bersama verba gerak, “ke sini” merupakan ungkapan Indonesia yang paling alami.
