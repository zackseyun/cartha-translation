  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: id
  text: Allah adalah roh[b], dan mereka yang menyembah-Nya harus menyembah dalam roh dan kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam Roh dan kebenaran.” Bahasa Yunani dapat dipahami secara lebih khusus demikian, tetapi terjemahan utama mempertahankan cakupan ungkapan yang lebih luas.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “Allah adalah roh” menyatakan hakikat Allah; bukan berarti bahwa Allah adalah salah satu roh di antara roh-roh lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: roh
  rationale: Sebagai predikat tanpa artikel yang mendahului ὁ θεός, kata ini terutama menyatakan hakikat atau sifat Allah, bukan menempatkan Allah sebagai salah satu roh di antara roh-roh lain.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk θεός ketika menunjuk kepada satu-satunya Allah; artikelnya menandai ὁ θεός sebagai subjek klausa.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: mereka yang menyembah-Nya
  rationale: Partisip berartikel ini menunjuk kepada para penyembah sebagai suatu golongan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan acuan umum atau berkelanjutan.
- source_word: ἐν πνεύματι
  choice: dalam roh
  rationale: Terjemahan ini mempertahankan keluasan frasa Yunani yang tidak memakai artikel dan berpasangan dengan ἀληθείᾳ, tanpa membatasinya secara pasti pada Roh Kudus ataupun pada ketulusan batin semata.
- source_word: ἀληθείᾳ
  choice: kebenaran
  rationale: Padanan baku yang sesuai dengan pemakaian Yohanes, mencakup kebenaran dan realitas yang dinyatakan Allah.
- source_word: δεῖ
  choice: harus
  rationale: Menyampaikan keharusan atau keniscayaan dengan ringkas dan alami.
- source_word: προσκυνεῖν
  choice: menyembah
  rationale: Padanan kontekstual yang baku; nuansa historis bersujud tidak perlu dibuat eksplisit dalam konteks ini.
theological_decisions:
- issue: Makna “Allah adalah roh”
  choice: Pernyataan kualitatif tentang hakikat Allah.
  alternative: Allah adalah suatu roh, yakni salah satu makhluk atau keberadaan roh di antara yang lain.
  rationale: Susunan kata Yunani dan tidak adanya artikel pada πνεῦμα mendukung predikat kualitatif. Terjemahan ini tidak menambahkan kata sandang yang dapat menempatkan Allah sekadar dalam satu golongan keberadaan.
- issue: Makna “dalam roh dan kebenaran”
  choice: Ibadah harus bercirikan roh dan kebenaran, dengan keluasan ungkapan Yunani tetap dipertahankan.
  alternative: Secara khusus “dalam Roh Kudus dan kebenaran,” atau hanya “dengan ketulusan dan kebenaran.”
  rationale: πνεύματι dan ἀληθείᾳ sama-sama tanpa artikel. Teks memungkinkan hubungan dengan Roh Kudus, tetapi tidak mengharuskan terjemahan mempersempit maknanya ke sana; demikian pula maknanya lebih luas daripada ketulusan batin semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Allah” dipakai sebagai padanan θεός, “menyembah-Nya” mempertahankan objek eksplisit, dan huruf kecil pada “roh” dalam teks utama menjaga pernyataan kualitatif serta ambiguitas frasa berikutnya. Semua penanda catatan kaki muncul dalam teks utama.
