  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: id
  text: Banyak orang Samaria dari kota itu percaya kepadanya karena perkataan[a] perempuan itu yang bersaksi, “Ia memberitahukan kepadaku semua yang telah kulakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesan”. Kata Yunani λόγος dapat berarti “perkataan”, “pesan”, atau “laporan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: dari kota itu
  rationale: ἐκ menyatakan asal, sedangkan πόλις secara wajar diterjemahkan “kota”. Nuansa penghubung δέ tidak perlu dipaksakan sebagai kata tersendiri karena alur narasi sudah jelas dalam bahasa Indonesia.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: Banyak orang Samaria
  rationale: Genitif partitif ini secara idiomatis menyatakan bahwa banyak orang dari kalangan orang Samaria percaya.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: percaya kepadanya
  rationale: πιστεύω dengan εἰς menunjuk pada kepercayaan yang diarahkan kepada pribadi Yesus. Ungkapan ini mempertahankan daya relasionalnya tanpa memperluasnya menjadi rumusan doktrinal.
- source_word: διὰ τὸν λόγον
  choice: karena perkataan
  rationale: διά dengan akusatif menyatakan sebab. “Perkataan” mempertahankan hubungan dekat dengan λόγος, sementara kemungkinan makna “pesan” dicatat dalam catatan kaki.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: perempuan itu yang bersaksi
  rationale: Frasa ini merujuk kepada perempuan Samaria yang telah diperkenalkan dan mempertahankan fungsi partisipel kini μαρτυρούσης sebagai tindakan memberi kesaksian.
- source_word: Εἶπέν μοι
  choice: Dia mengatakan kepadaku
  rationale: λέγω dengan objek tak langsung dapat diterjemahkan secara alami sebagai “mengatakan kepadaku”; bentuk lampau dipahami dari konteks narasi.
- source_word: πάντα ἃ ἐποίησα
  choice: semua yang telah kulakukan
  rationale: πάντα ἃ bersifat menyeluruh, sedangkan “telah kulakukan” secara alami menyampaikan tindakan yang sudah terjadi tanpa menentukan lebih jauh cakupan waktunya.
theological_decisions:
- issue: Daya ungkapan πιστεύω εἰς dalam pemakaian Yohanes
  choice: percaya kepadanya
  alternative: menaruh iman kepadanya
  rationale: Teks melaporkan kepercayaan yang diarahkan kepada Yesus, tetapi tidak merincinya dengan kategori teologis tambahan. Terjemahan ini mempertahankan ketegangan dan keluasan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan mudah dipahami. Kata ganti untuk Yesus tidak diberi kapitalisasi khusus karena pembedaan tipografis tersebut tidak terdapat dalam teks Yunani.
