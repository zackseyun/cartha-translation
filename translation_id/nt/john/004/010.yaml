id: JHN.4.10
reference: John 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Seandainya engkau tahu karunia Allah dan siapa yang berkata kepadamu, ‘Beri aku minum,’ tentu engkau sudah meminta kepadanya, dan ia tentu sudah memberimu air hidup.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air mengalir” atau “air segar.” Ungkapan ini dapat merujuk pada air yang mengalir, tetapi “air hidup” mempertahankan makna ganda yang dimaksudkan Yesus di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Yesus menjawab dan berkata kepadanya
  rationale: Mempertahankan dua verba dalam rumusan ujaran Yunani sekaligus tetap dapat dipahami dalam narasi Indonesia.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: karunia Allah
  rationale: “Karunia” menyampaikan pemberian yang diberikan dengan cuma-cuma dan merupakan padanan alami bagi δωρεά dalam konteks keagamaan tanpa menambahkan penafsiran mengenai wujud karunia itu.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: siapa yang berkata kepadamu
  rationale: Menyampaikan penekanan pada identitas orang yang sedang berbicara dengan susunan Indonesia yang alami.
- source_word: Δός μοι πεῖν
  choice: Beri aku minum
  rationale: Padanan idiomatis dan ringkas bagi imperatif Yunani yang secara harfiah meminta agar diberi minum.
- source_word: ᾔτησας αὐτόν
  choice: engkau sudah meminta kepadanya
  rationale: Dengan “seandainya” dan “tentu ... sudah,” bentuk ini menyampaikan kondisi yang tidak terwujud tanpa membuat kalimat Indonesia terasa kaku.
- source_word: ἔδωκεν ἄν σοι
  choice: ia tentu sudah memberimu
  rationale: “Tentu ... sudah” menandai hasil hipotetis yang tidak terwujud sebagaimana konstruksi dengan ἄν.
- source_word: ὕδωρ ζῶν
  choice: air hidup
  rationale: Padanan harfiah ini mempertahankan permainan makna antara air yang mengalir dan realitas rohani yang ditunjuk Yesus.
theological_decisions:
- issue: Daya literal dan simbolis ὕδωρ ζῶν
  choice: air hidup
  alternative: air mengalir; air segar
  rationale: “Air hidup” tidak membatasi ungkapan itu pada arti fisik saja, sehingga ketegangan antara salah paham pada tingkat harfiah dan makna rohaninya tetap terpelihara.
- issue: Identitas “karunia Allah”
  choice: dibiarkan tanpa penjelasan tambahan
  alternative: menyebut karunia itu sebagai Yesus, Roh, atau keselamatan
  rationale: Ayat ini sendiri tidak secara eksplisit mengidentifikasi karunia tersebut; terjemahan tidak seharusnya menyelesaikan ambiguitas itu di dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai karena percakapan bersifat langsung dan tunggal. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kecil agar kapitalisasi tidak menambahkan penandaan teologis yang tidak terdapat dalam naskah Yunani.
