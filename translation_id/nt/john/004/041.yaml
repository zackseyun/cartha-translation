  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: id
  text: Dan jauh lebih banyak orang percaya karena perkataan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena pesan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: jauh lebih banyak orang
  rationale: Bentuk datif πολλῷ memperkuat komparatif πλείους. Ungkapan ini secara alami menyatakan peningkatan yang besar dibandingkan orang-orang yang percaya dalam ayat sebelumnya.
- source_word: ἐπίστευσαν
  choice: menjadi percaya
  rationale: Aoristus πιστεύω menyatakan bahwa mereka percaya. Dalam bahasa Indonesia, 'menjadi percaya' secara wajar menggambarkan bertambahnya orang yang percaya tanpa memperluasnya menjadi rumusan doktrinal yang tidak dinyatakan secara eksplisit.
- source_word: διὰ
  choice: karena
  rationale: Dengan bentuk akusatif τὸν λόγον, διά menyatakan sebab atau alasan; 'karena' menyampaikan hubungan kausal itu dengan jelas dan alami.
- source_word: λόγον
  choice: perkataan
  rationale: Dalam konteks ini λόγος mengacu pada apa yang Yesus ucapkan. 'Perkataan' mempertahankan bentuk tunggal dan nuansa Yohanes, sementara 'pesan' tetap merupakan kemungkinan makna.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini mengacu kepada Yesus. Bentuk '-Nya' merupakan padanan langsung dan jelas dalam konteks.
theological_decisions:
- issue: Penerjemahan πιστεύω dalam narasi yang berkaitan dengan keselamatan
  choice: menjadi percaya
  alternative: beriman kepada-Nya
  rationale: Teks Yunani hanya menyatakan bahwa jauh lebih banyak orang percaya dan tidak mencantumkan objek setelah verba ini. Terjemahan tidak menambahkan rumusan teologis yang lebih lengkap, tetapi membiarkan konteks Injil Yohanes menunjukkan kepada siapa mereka percaya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. 'Jauh lebih banyak orang' mempertahankan komparatif yang diperkuat; 'perkataan-Nya' mempertahankan nuansa λόγος tanpa terdengar kaku.
