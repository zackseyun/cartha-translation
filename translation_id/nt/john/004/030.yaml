  text: They went out of the city and were coming to him[a].
translation:
  language: id
  text: Mereka keluar dari kota itu dan sedang menuju kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka keluar dari kota itu dan sedang datang kepada-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: keluar
  rationale: Bentuk aoris ἐξέρχομαι menyatakan gerak meninggalkan suatu tempat; "keluar" alami dalam bahasa Indonesia dan tidak menambahkan arah pandang yang tidak dinyatakan.
- source_word: ἐκ τῆς πόλεως
  choice: dari kota itu
  rationale: ἐκ menyatakan gerak dari dalam, sedangkan artikel pada πόλις secara wajar diterjemahkan dengan "itu" karena kotanya sudah diketahui dari konteks.
- source_word: ἤρχοντο
  choice: sedang datang
  rationale: Bentuk imperfek ἔρχομαι menggambarkan tindakan yang tengah berlangsung pada waktu lampau; "sedang datang" mempertahankan aspek berlangsung tersebut.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: πρός dengan akusatif menunjukkan gerak mendekati seseorang. "Kepada-Nya" idiomatis dan mempertahankan tujuan personal; huruf kapital mengikuti kebiasaan ejaan Alkitab Indonesia untuk rujukan kepada Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan dua verba mempertahankan peralihan dari tindakan selesai (keluar) ke perjalanan yang sedang berlangsung (sedang datang).
