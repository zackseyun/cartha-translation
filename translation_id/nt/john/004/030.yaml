review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan ἐξῆλθον sebagai tindakan selesai, «keluar», dan mempertahankan gerak dari dalam kota melalui «dari kota itu». Imperfek ἤρχοντο perlu tetap menyatakan gerak yang sedang berlangsung. «Sedang menuju kepada-Nya» menyampaikan nilai ini secara lebih idiomatis tanpa mengubah tujuan πρὸς αὐτόν.
  naturalness: «Sedang datang kepada-Nya» dapat dipahami, tetapi kurang lazim dalam bahasa Indonesia modern karena «datang kepada» cenderung terdengar seperti kedatangan/kunjungan yang telah mencapai tujuan. Untuk orang-orang yang baru keluar dan masih dalam perjalanan, «sedang menuju kepada-Nya» lebih alami.
  terminology: «Kota itu» sesuai dengan konteks kota yang telah dikenal dalam perikop. Kapitalisasi «-Nya» konsisten dengan kebiasaan Alkitab Indonesia bagi rujukan kepada Yesus. Tidak ada istilah teologis yang dipersoalkan.
  issues:
  - severity: low
    issue: Ungkapan «sedang datang kepada-Nya» kurang idiomatis untuk perjalanan yang masih berlangsung.
    rationale: Imperfek ἤρχοντο menggambarkan orang-orang itu sedang bergerak mendekati Yesus. «Sedang menuju kepada-Nya» mempertahankan aspek progresif tersebut dengan lebih lancar dalam bahasa Indonesia.
  revised_text: Mereka keluar dari kota itu dan sedang menuju kepada-Nya.[a]
