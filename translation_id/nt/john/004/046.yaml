  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: id
  text: Maka Yesus datang lagi ke Kana di Galilea, tempat Ia pernah membuat air menjadi anggur.[a] Ada seorang pejabat kerajaan[b] yang anak laki-lakinya sedang sakit di Kapernaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan ungkapan yang lebih interpretatif, “mengubah air menjadi anggur.” Secara lebih harfiah, bahasa Yunani berbunyi “membuat air menjadi anggur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pegawai raja,” “pejabat istana,” atau “bangsawan.” Kata Yunani βασιλικός menunjuk pada seseorang yang berhubungan dengan lingkungan istana atau bekerja dalam pelayanan kerajaan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan atau hubungan dengan konteks sebelumnya secara alami dalam narasi Indonesia.
- source_word: πάλιν
  choice: lagi
  rationale: Menyatakan bahwa Yesus kembali ke tempat yang sama.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Kana di Galilea
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyampaikan bahwa Kana terletak di wilayah Galilea.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: pernah membuat air menjadi anggur
  rationale: Mempertahankan ungkapan Yunani yang secara harfiah memakai kata 'membuat', sedangkan 'pernah' menempatkan peristiwa itu sebelum kunjungan ini secara wajar dalam bahasa Indonesia.
- source_word: βασιλικός
  choice: pejabat kerajaan
  rationale: Menunjukkan seseorang yang berhubungan dengan raja atau dinas kerajaan tanpa memastikan jabatan, pangkat, atau status kebangsawanannya.
- source_word: τις
  choice: seorang
  rationale: Memperkenalkan seorang tokoh yang tertentu tetapi tidak disebutkan namanya; bentuk ini lebih alami daripada 'seorang tertentu' dalam narasi Indonesia.
- source_word: υἱός
  choice: anak laki-laki
  rationale: Menjaga keterangan jenis kelamin yang dinyatakan secara khusus oleh kata Yunani υἱός.
- source_word: ἠσθένει
  choice: sedang sakit
  rationale: Dalam konteks ini kata kerja tersebut menunjuk pada penyakit fisik yang berlangsung pada waktu itu.
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Makna βασιλικός tanpa memastikan hubungan historis atau jabatan khusus dalam istana Herodes Antipas
  choice: pejabat kerajaan
  alternative: bangsawan; pegawai raja; pejabat istana
  rationale: Teks hanya menyatakan hubungan orang itu dengan lingkungan atau pelayanan kerajaan. Pilihan ini mempertahankan hubungan tersebut tanpa menambahkan kepastian tentang pangkat, status sosial, atau penguasa yang dilayaninya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama “Yesus” dinyatakan untuk memperjelas subjek tersirat dari kata kerja Yunani berdasarkan konteks langsung. Ungkapan “di sana” memperlancar peralihan ke tokoh berikutnya tanpa mengubah isi.
