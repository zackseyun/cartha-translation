  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: id
  text: Maka ayah itu tahu bahwa pada waktu itulah Yesus berkata kepadanya, “Anakmu hidup,”[a] dan ia sendiri percaya,[b] bersama seisi rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Anakmu masih hidup.”
    reason: lexical_alternative
  - marker: b
    text: Kata “percaya” dapat berarti bahwa ia secara khusus mempercayai perkataan Yesus atau bahwa ia sampai pada iman yang lebih penuh kepada Yesus; bahasa Yunaninya tidak menyebutkan cakupannya secara tegas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: tahu
  rationale: Aoristus γινώσκω menyatakan pengenalan sang ayah bahwa waktu kesembuhan itu bertepatan dengan perkataan Yesus. 'Tahu' mempertahankan daya kognitifnya secara wajar dalam bahasa Indonesia.
- source_word: οὖν
  choice: Maka
  rationale: Menandai kesimpulan dari keterangan para hambanya pada ayat sebelumnya dan menghubungkan alur narasi secara alami.
- source_word: ὁ πατὴρ
  choice: ayah itu
  rationale: Mengikuti peralihan teks Yunani dari jabatan tokoh tersebut kepada perannya sebagai ayah, yang kini menjadi pusat narasi.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: tepat pada waktu itulah
  rationale: Mengungkapkan waktu tertentu yang sama dengan saat Yesus berbicara. 'Tepat' menyampaikan korespondensi waktu yang dibentuk oleh konstruksi kalimat dan konteks, bukan menambahkan intensifikasi teologis.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Padanan langsung dan bermartabat untuk λέγω dengan objek tak langsung.
- source_word: Ὁ υἱός σου ζῇ
  choice: Anakmu hidup
  rationale: ζῇ berbentuk kini dan menyatakan keadaan bahwa anak itu hidup. Rumusan ini ringkas dan dekat dengan bentuk Yunani; 'masih hidup' dihindari karena dapat menyiratkan bahwa ia tidak pernah berada dalam bahaya kematian.
- source_word: ἐπίστευσεν
  choice: percaya
  rationale: Mempertahankan keluasan makna πιστεύω tanpa menentukan apakah yang dimaksud khususnya mempercayai perkataan Yesus atau iman yang lebih penuh kepada Yesus.
- source_word: αὐτὸς
  choice: ia sendiri
  rationale: Pronomina eksplisit dalam bahasa Yunani memberi penekanan pada sang ayah secara pribadi sebelum rumah tangganya disebut.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: seluruh isi rumahnya
  rationale: οἰκία di sini menunjuk kelompok rumah tangga, bukan bangunan fisik. Ungkapan Indonesia ini alami dan mencakup semua anggota rumah tangganya.
theological_decisions:
- issue: Cakupan kepercayaan sang ayah
  choice: Menyatakan secara sederhana bahwa ia percaya, tanpa menentukan lebih jauh objek atau tahap imannya.
  alternative: Ia hanya mempercayai perkataan khusus Yesus tentang kesembuhan; atau pada saat itu ia sampai pada iman yang lebih penuh kepada Yesus.
  rationale: Dalam Injil Yohanes πιστεύω sering memiliki bobot teologis, tetapi ayat ini tidak menjelaskan cakupannya. Terjemahan dan catatan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Maka' menjaga hubungan inferensial dengan ayat sebelumnya; 'isi rumah' dipakai dalam arti rumah tangga, bukan bangunan.
