  to: Maka ayah itu tahu bahwa pada waktu itulah Yesus berkata kepadanya, “Anakmu hidup,”[a] dan ia sendiri percaya,[b] bersama seisi rumahnya.
  rationale: Revisi menghilangkan penegasan “tepat” dan penanda urutan “lalu” agar lebih dekat dengan kekuatan frasa temporal dan καί dalam teks Yunani. “Seisi rumahnya” memperjelas bahwa yang dimaksud ialah seluruh rumah tangga, bukan isi bangunan. Catatan kaki dan ambiguitas tentang cakupan πιστεύω dipertahankan.
