  naturalness: Bahasa draf umumnya baku dan jelas. “Seisi rumahnya” lebih alami dan lebih langsung menunjukkan kelompok rumah tangga daripada “seluruh isi rumahnya,” yang berpotensi terdengar seperti isi sebuah bangunan.
  terminology: “Ayah itu,” “percaya,” dan “Anakmu hidup” sesuai dengan register naratif serta mempertahankan keterbukaan teologis πιστεύω. Catatan b juga secara tepat tidak menentukan cakupan iman sang ayah.
