  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Setiap orang yang minum dari air ini akan haus lagi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan dahaga lagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif baku untuk tindakan memberi tanggapan; bentuk lampau Yunani dipahami melalui konteks narasi dalam bahasa Indonesia.
- source_word: εἶπεν
  choice: berkata
  rationale: Mempertahankan verba kedua dalam rumusan Yunani ἀπεκρίθη ... καὶ εἶπεν, meskipun bahasa Indonesia sering cukup memakai satu verba.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Menyatakan objek tak langsung feminin yang merujuk kepada perempuan Samaria; gender rujukan sudah jelas dari konteks.
- source_word: Πᾶς ὁ πίνων
  choice: Setiap orang yang minum
  rationale: Mengungkapkan cakupan universal dan daya generik partisipel kini artikular tanpa membatasinya pada laki-laki.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: dari air ini
  rationale: Padanan langsung dan wajar bagi sumber air yang sedang dibicarakan, sekaligus mempertahankan daya penunjuk τούτου.
- source_word: διψήσει
  choice: akan haus
  rationale: Ungkapan Indonesia yang alami bagi bentuk mendatang διψάω dan tidak menambahkan penafsiran di luar makna leksikalnya.
- source_word: πάλιν
  choice: lagi
  rationale: Adverbia yang paling ringkas dan alami untuk menyatakan berulangnya rasa haus.
theological_decisions:
- issue: Rumusan ganda ἀπεκρίθη ... καὶ εἶπεν
  choice: 'Mempertahankan kedua verba: “menjawab dan berkata”'
  alternative: Meringkasnya menjadi “menjawab” atau “berkata”
  rationale: Teks Yunani memuat kedua verba dalam rumusan naratif khas. Mempertahankannya menjaga tekstur sumber tanpa mengubah isi teologis.
- issue: Konstruksi maskulin generik Πᾶς ὁ πίνων
  choice: “Setiap orang yang minum”
  alternative: “Barang siapa yang minum” atau ungkapan yang hanya menunjuk laki-laki
  rationale: Bentuk gramatikal maskulin ini bersifat generik dan mencakup siapa pun; pilihan tersebut mempertahankan cakupan universalnya.
- issue: Rujukan “air ini”
  choice: Mempertahankan rujukan langsung kepada air jasmani yang sedang dibicarakan
  alternative: Menjelaskannya secara eksplisit sebagai air sumur atau memberinya arti rohani dalam ayat ini
  rationale: τούτου hanya menunjuk pada air dalam konteks percakapan. Terjemahan tidak mendahului kontras yang dikembangkan dalam ayat-ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Akan haus” dipilih karena lebih lazim bagi pembaca umum, sedangkan “akan dahaga” dicatat sebagai alternatif yang lebih harfiah. Rumusan ganda “menjawab dan berkata” sengaja dipertahankan demi kedekatan dengan struktur sumber.
