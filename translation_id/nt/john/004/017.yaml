base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: id
  text: Perempuan itu menjawab, “Saya tidak mempunyai suami.”[a] Yesus berkata kepadanya, “Benar katamu, ‘Saya tidak mempunyai suami.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saya tidak punya suami.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ἀνήρ dapat berarti “laki-laki” atau “suami”; dalam konteks ini artinya “suami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: Perempuan itu menjawab
  rationale: Ungkapan Yunani secara harfiah memuat dua verba, ‘menjawab dan berkata’, tetapi dalam bahasa Indonesia modern ‘menjawab’ sudah secara alami mencakup tindakan berkata dalam konteks ini.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Saya tidak mempunyai suami
  rationale: Ἀνήρ dapat berarti ‘laki-laki’ atau ‘suami’. Konteks langsung mengenai hubungan perkawinan perempuan itu, khususnya ayat berikutnya, mendukung ‘suami’. ‘Saya’ wajar dalam percakapan dengan orang yang belum akrab, sedangkan ‘mempunyai’ menjaga ragam yang bermartabat.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Kata Yesus kepadanya
  rationale: Kala kini historis λέγει dialihkan dengan bentuk lampau naratif yang lazim dalam bahasa Indonesia. Susunan ini alami dan tetap menyatakan bahwa perkataan itu ditujukan kepada perempuan tersebut.
- source_word: Καλῶς εἶπας
  choice: Benar katamu
  rationale: Καλῶς di sini menilai bahwa pernyataannya tepat atau benar. ‘Benar katamu’ ringkas, alami, dan mempertahankan penegasan Yesus tanpa menambahkan penafsiran moral.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ‘Saya tidak mempunyai suami.’
  rationale: Ὅτι memperkenalkan isi perkataan. Kutipan langsung mempertahankan pengulangan yang disengaja dalam bahasa Yunani dan terdengar lebih alami daripada konstruksi dengan ‘bahwa’.
theological_decisions:
- issue: Makna ἀνήρ dalam pengakuan perempuan itu
  choice: suami
  alternative: laki-laki
  rationale: Kedua arti tersedia secara leksikal, tetapi pembicaraan tentang riwayat perkawinannya dalam ayat 18 menunjukkan bahwa yang dimaksud di sini adalah ‘suami’. Pilihan ini tidak menambahkan penilaian teologis di luar konteks.
- issue: Nuansa pujian dalam Καλῶς εἶπας
  choice: Benar katamu
  alternative: Baik sekali perkataanmu; Tepat katamu
  rationale: Ucapan Yesus mengakui kebenaran pernyataan perempuan itu, tetapi konteks berikutnya juga menyingkapkan bahwa pernyataan tersebut belum mengungkapkan seluruh keadaannya. ‘Benar katamu’ mempertahankan ketegangan itu tanpa mengubahnya menjadi pujian moral yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. ‘Saya’ dipakai dalam ucapan perempuan sebagai bentuk yang alami kepada orang yang belum akrab; ‘katamu’ mempertahankan kelugasan jawaban Yesus. Pengulangan pernyataan perempuan dipertahankan karena penting bagi alur dan penekanan teks.
