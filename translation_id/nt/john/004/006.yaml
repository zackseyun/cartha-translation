  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: id
  text: Di situ ada sumur Yakub.[a] Yesus, yang letih karena perjalanan, maka duduk di dekat sumur itu dalam keadaan demikian.[b] Saat itu kira-kira jam keenam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mata air”; kata Yunani πηγή dapat berarti mata air atau sumur.
    reason: lexical_alternative
  - marker: b
    text: Atau “duduk demikian”; ungkapan ini mungkin berarti “duduk dalam keadaan-Nya saat itu” atau “duduk dengan cara demikian.”
    reason: lexical_alternative
  - marker: c
    text: Jika dihitung menurut pembagian waktu siang Yahudi yang lazim, jam keenam kira-kira pukul dua belas siang. Menurut hipotesis penghitungan Romawi, ungkapan ini dapat dipahami sebagai kira-kira pukul enam petang.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: sumur Yakub
  rationale: Walaupun πηγή dapat berarti mata air atau sumur, konteks pengambilan air dalam kisah ini mendukung 'sumur' sebagai padanan Indonesia yang paling alami; kemungkinan 'mata air' dipertahankan dalam catatan kaki.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: letih akibat perjalanan
  rationale: Bentuk partisip perfek menggambarkan keadaan letih yang dihasilkan oleh perjalanan. 'Akibat' menyatakan daya kausal ἐκ secara alami.
- source_word: ἐκαθέζετο
  choice: duduk
  rationale: Dalam narasi Indonesia, 'duduk' secara alami menyampaikan tindakan deskriptif yang sedang berlangsung tanpa perlu konstruksi progresif yang kaku.
- source_word: οὕτως
  choice: begitu saja
  rationale: Ungkapan ini mempertahankan unsur cara atau keadaan pada οὕτως dan dapat menyiratkan bahwa Yesus duduk dalam keadaan-Nya saat itu, tanpa memaksakan satu penafsiran rinci.
- source_word: ἐπὶ τῇ πηγῇ
  choice: di dekat sumur itu
  rationale: ἐπί dengan datif bersifat lokatif di sini; 'di dekat' merupakan ungkapan Indonesia yang wajar bagi seseorang yang duduk di sisi sumur.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Saat itu kira-kira jam keenam
  rationale: '''Jam keenam'' mempertahankan bentuk waktu dalam teks Yunani, sedangkan ''kira-kira'' menerjemahkan ὡς tanpa menyelesaikan perdebatan mengenai sistem penghitungan waktunya.'
- source_word: δὲ / οὖν
  choice: Di situ / pun
  rationale: Partikel-partikel ini menandai kelanjutan dan hubungan naratif. Susunan 'Di situ ada' dan partikel 'pun' menyampaikannya secara wajar tanpa menambahkan penanda waktu yang tidak terdapat dalam sumber.
theological_decisions:
- issue: Rujukan waktu 'jam keenam'
  choice: Mempertahankan ungkapan harfiah 'kira-kira jam keenam' dalam teks utama.
  alternative: Sekitar pukul dua belas siang menurut penghitungan jam siang Yahudi yang lazim; atau sekitar pukul enam petang menurut hipotesis penghitungan Romawi.
  rationale: Teks Yunani tidak menyebutkan padanan jam modern. Bentuk harfiah mempertahankan ketegangan dalam kronologi Injil Yohanes dan tidak menetapkan salah satu sistem penghitungan yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. 'Letih' mudah dipahami tetapi tetap bernada sastra. Susunan kalimat menghindari kekakuan harfiah sambil mempertahankan ambiguitas πηγή, οὕτως, dan sistem penghitungan 'jam keenam' melalui catatan kaki.
