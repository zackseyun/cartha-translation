id: JHN.4.23
reference: John 4:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: id
  text: Namun, saatnya akan tiba—dan sekarang sudah tiba—ketika para penyembah sejati akan menyembah Bapa dalam roh[a] dan kebenaran, sebab Bapa memang mencari penyembah-penyembah seperti itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Roh”. Ungkapan Yunani ini dapat menunjuk pada penyembahan yang dimampukan oleh Roh Kudus, penyembahan dalam roh manusia, atau penyembahan yang bercirikan kenyataan rohani.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan pembicaraan sebelumnya tentang tempat ibadah secara ringkas dan wajar.
- source_word: ἔρχεται ὥρα
  choice: saatnya akan tiba
  rationale: Mempertahankan ungkapan waktu khas Yohanes dalam bahasa Indonesia yang alami; bentuk definit menunjukkan saat yang dimaksud dalam konteks.
- source_word: καὶ νῦν ἐστιν
  choice: dan sekarang sudah tiba
  rationale: Menyatakan bahwa saat yang akan datang itu sekaligus telah hadir atau dimulai sekarang.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: para penyembah sejati
  rationale: Menjaga makna orang-orang yang sungguh atau autentik dalam penyembahan tanpa menambahkan batasan sektarian.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: akan menyembah Bapa
  rationale: Mewakili bentuk futur dan objek tidak langsung Yunani secara idiomatis.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: dalam roh dan kebenaran
  rationale: Mempertahankan kedua nomina dan ambiguitas πνεῦμα, tanpa memutuskan apakah yang dimaksud terutama Roh Kudus, roh manusia, atau ranah dan sifat rohani.
- source_word: καὶ γὰρ
  choice: sebab ... memang
  rationale: ‘Sebab’ menyampaikan alasan yang diperkenalkan γάρ, sedangkan ‘memang’ membawa daya penegasan καί.
- source_word: τοιούτους ζητεῖ
  choice: mencari orang-orang demikian
  rationale: Menyampaikan tindakan kini dan jenis orang yang dimaksud secara alami, sementara partisip berikut menjelaskan tujuan atau ciri mereka.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: untuk menyembah-Nya
  rationale: Dalam susunan ini, partisip dapat dipahami sebagai orang-orang yang menyembah Dia atau sebagai kaitan dengan penyembahan kepada-Nya; terjemahan ini mengikuti alur idiomatis ayat sambil mempertahankan fokusnya.
theological_decisions:
- issue: Makna ἐν πνεύματι
  choice: dalam roh
  alternative: dalam Roh; secara rohani
  rationale: Kata Yunani itu tidak memakai artikel dan memungkinkan beberapa nuansa teologis. Huruf kecil dalam teks utama mempertahankan ambiguitas, sedangkan catatan kaki mencantumkan pembacaan yang merujuk kepada Roh Kudus.
- issue: Arti ‘penyembah sejati’
  choice: para penyembah sejati
  alternative: para penyembah yang sungguh; para penyembah yang autentik
  rationale: Pilihan ini mempertahankan kontras Yohanes mengenai penyembahan yang sesuai dengan kenyataan dan penyataan Allah tanpa mengidentifikasikannya dengan kelompok tertentu.
- issue: Hubungan τοιούτους dengan τοὺς προσκυνοῦντας αὐτόν
  choice: orang-orang demikian untuk menyembah-Nya
  alternative: orang-orang demikian, yaitu mereka yang menyembah-Nya
  rationale: Bahasa Yunani secara harfiah menunjuk orang-orang semacam itu sebagai para penyembah-Nya. Susunan Indonesia yang dipilih alami dan sesuai konteks, tanpa menyatakan bahwa Allah membutuhkan penyembahan.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Tanda pisah memperjelas paradoks waktu ‘akan tiba’ sekaligus ‘sekarang sudah tiba’. Kapitalisasi ‘Bapa’ dan pronomina ‘-Nya’ mengikuti pemakaian gelar ilahi dalam konteks.
