source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: id
  text: 'Bukankah kalian berkata, “Masih ada empat bulan lagi, lalu panen tiba”? Lihatlah, Aku berkata kepada kalian: Angkatlah pandangan kalian dan perhatikanlah ladang-ladang itu; semuanya sudah putih[a] untuk dipanen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sudah matang dan siap dipanen.” Teks Yunani secara harfiah mengatakan “putih,” sehingga gambaran visualnya dipertahankan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Bukankah kalian berkata
  rationale: Bentuk pertanyaan negatif diterjemahkan secara wajar dalam bahasa Indonesia, sedangkan ὑμεῖς dinyatakan dengan “kalian” tanpa menambahkan penekanan berlebihan seperti “kalian sendiri”.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Masih empat bulan lagi
  rationale: Ungkapan ini secara idiomatis menyatakan sisa waktu sebelum panen.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: lalu tibalah musim panen
  rationale: “Tibalah” menyampaikan datangnya waktu panen secara alami dan mempertahankan nuansa ungkapan yang dikutip.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Penanda wacana ini mengarahkan perhatian para pendengar dengan kuat tanpa memakai bentuk arkais.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: Angkatlah pandangan kalian
  rationale: Mempertahankan gambaran konkret tentang mengangkat mata, tetapi memakai ungkapan Indonesia yang lebih alami daripada terjemahan harfiah “angkatlah mata kalian”.
- source_word: θεάσασθε
  choice: perhatikanlah
  rationale: Kata ini mengajak para pendengar memandang dengan sengaja dan saksama; pilihan ini juga menghindari pengulangan “lihat”.
- source_word: τὰς χώρας
  choice: ladang-ladang itu
  rationale: Dalam konteks panen, χώρας paling wajar menunjuk kepada lahan pertanian, bukan wilayah secara umum.
- source_word: λευκαί εἰσιν
  choice: sudah putih
  rationale: Mempertahankan warna dan gambaran visual yang benar-benar terdapat dalam teks Yunani, alih-alih langsung menafsirkannya sebagai “matang”.
- source_word: πρὸς θερισμόν
  choice: untuk dipanen
  rationale: Menyatakan arah atau kesiapan menuju panen secara ringkas sambil tetap mempertahankan metafora pertanian.
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa keadaan panen itu telah hadir sekarang, berlawanan dengan perkataan tentang menunggu empat bulan lagi.
theological_decisions:
- issue: Apakah perkataan tentang panen harus dijelaskan secara langsung sebagai rujukan rohani kepada manusia
  choice: Mempertahankan gambaran pertanian dalam teks utama
  alternative: Menerjemahkan secara interpretatif, misalnya “orang-orang sudah siap dikumpulkan”
  rationale: Konteks memberi makna metaforis kepada panen, tetapi bentuk bahasa Yunani tetap berbicara tentang ladang dan panen. Terjemahan tidak seharusnya menutup ketegangan antara gambaran harfiah dan maksud rohaninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai karena Yesus berbicara kepada lebih dari satu murid. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
