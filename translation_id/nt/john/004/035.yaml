  source_fidelity: 'Makna pokoknya setia pada Yunani: pertanyaan negatif, selang empat bulan, seruan untuk mengangkat pandangan dan memerhatikan ladang, serta citra ladang yang "putih" dan sudah siap bagi panen tetap terjaga. Revisi kecil menghilangkan pengulangan nomina yang tidak ditandai dalam teks sumber dan membuat ungkapan waktu-panennya lebih langsung.'
