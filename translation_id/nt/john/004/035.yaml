  terminology: '"Ladang-ladang," "putih," dan "dipanen" mempertahankan metafora pertanian serta tidak mengalihkannya secara interpretatif kepada manusia. Catatan kaki dengan tepat menjelaskan kemungkinan makna kesiapan panen sambil mempertahankan citra warna dalam teks utama.'
