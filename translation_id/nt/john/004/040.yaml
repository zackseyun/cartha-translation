id: JHN.4.40
reference: John 4:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: id
  text: Jadi, ketika orang-orang Samaria datang menemui Dia, mereka meminta[a] Dia tinggal bersama mereka. Lalu Dia tinggal di sana selama dua hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk kata kerja Yunani dapat menunjukkan bahwa mereka terus meminta atau meminta berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Jadi, ketika
  rationale: Mengungkapkan hubungan dengan peristiwa sebelumnya sekaligus makna waktu secara alami dalam bahasa Indonesia.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: datang menemui Dia
  rationale: Menyatakan gerak menuju seseorang dengan ungkapan Indonesia yang alami; konteks menunjukkan bahwa mereka sengaja datang kepada Yesus.
- source_word: οἱ Σαμαρῖται
  choice: orang-orang Samaria
  rationale: Sebutan kelompok etnis yang langsung, jelas, dan wajar dalam bahasa Indonesia.
- source_word: ἠρώτων
  choice: meminta
  rationale: Dalam konstruksi dengan infinitif, verba ini menyatakan permintaan. Bentuk imperfeknya dapat menyiratkan permintaan yang berlangsung atau berulang, sehingga nuansa itu dicatat dalam catatan kaki tanpa membuat teks utama kaku.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: Dia tinggal bersama mereka
  rationale: ‘Tinggal’ merupakan padanan alami bagi μένω, sedangkan παρά dengan datif menunjukkan kebersamaan atau keberadaan di tengah mereka.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: Lalu Dia tinggal di sana
  rationale: ‘Lalu’ menghubungkan permintaan dengan tanggapan Yesus secara alami, sementara ‘tinggal di sana’ mewakili μένω dan ἐκεῖ secara eksplisit.
- source_word: δύο ἡμέρας
  choice: selama dua hari
  rationale: Kata ‘selama’ memperjelas fungsi akusatif durasi dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Kalimat Yunani dibagi menjadi dua kalimat agar alurnya lebih alami tanpa mengubah hubungan antartindakan.
