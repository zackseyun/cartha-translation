  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: id
  text: Perempuan itu berkata kepada-Nya, “Tuhan[a], berilah aku air itu supaya aku tidak haus dan tidak datang ke sini untuk menimba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuan.”'
    reason: Κύριε dapat berfungsi sebagai sapaan hormat biasa maupun sebagai sebutan “Tuhan”; konteks langsung tidak sepenuhnya meniadakan salah satu nuansa itu.
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah fungsi wacananya.
- source_word: ἡ γυνή
  choice: perempuan itu
  rationale: Yang dimaksud ialah perempuan Samaria dalam konteks ini; bentuk tersebut juga menandai bahwa tokohnya sudah dikenal dalam narasi.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan padanan utama κύριος dan kemungkinan makna berlapis dalam Injil Yohanes; arti sapaan hormat dicatat dalam catatan kaki.
- source_word: δός μοι
  choice: berilah aku
  rationale: Menyampaikan imperatif secara langsung, wajar, dan sopan dalam bahasa Indonesia.
- source_word: τοῦτο τὸ ὕδωρ
  choice: air itu
  rationale: Kata Yunani hanya menyebut 'air itu'; sifat 'hidup' tidak ditambahkan dari konteks sebelumnya.
- source_word: ἵνα μὴ διψῶ
  choice: supaya aku tidak haus
  rationale: Menjaga hubungan tujuan yang dinyatakan oleh ἵνα serta bentuk negatifnya tanpa mengubahnya menjadi kepastian mutlak.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: dan tidak datang lagi ke sini
  rationale: Dalam konteks pergi berulang kali ke sumur, διέρχομαι dengan ἐνθάδε menunjuk pada datang ke tempat ini; 'lagi' menyampaikan aspek kegiatan yang berulang secara alami.
- source_word: ἀντλεῖν
  choice: untuk menimba
  rationale: Dalam konteks sumur, 'menimba' secara alami sudah menyiratkan mengambil air sehingga objek tidak perlu diulang.
theological_decisions:
- issue: Makna κύριος dalam sapaan perempuan Samaria
  choice: Tuhan
  alternative: Tuan
  rationale: Sapaan ini dapat sekadar menyatakan penghormatan, tetapi juga dapat memiliki gema yang lebih dalam dalam narasi Yohanes. Teks utama mempertahankan 'Tuhan', sedangkan kemungkinan arti sosial biasa dipelihara dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Ungkapan 'datang lagi ke sini untuk menimba' terdengar alami dalam percakapan sekaligus mempertahankan gagasan tindakan berulang dalam konteks pengambilan air.
