id: JHN.4.27
reference: John 4:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: id
  text: Tepat pada saat itu murid-murid-Nya datang. Mereka heran karena Ia sedang berbicara dengan seorang perempuan. Namun, tidak seorang pun bertanya, “Apa yang Engkau cari?”[a] atau, “Mengapa Engkau berbicara dengannya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang Engkau inginkan?”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Apa yang Engkau bicarakan dengannya?” Dalam konteks ini, maksudnya adalah, “Mengapa Engkau berbicara dengannya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: tepat pada saat itu
  rationale: Ungkapan ini berfungsi secara temporal dan menunjukkan bahwa para murid datang pada momen percakapan tersebut; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktu.
- source_word: ἐθαύμαζον
  choice: mereka heran
  rationale: Bentuk imperfek menggambarkan reaksi keheranan yang sedang berlangsung. 'Heran' jelas, alami, dan tidak berlebihan.
- source_word: μετὰ γυναικὸς
  choice: dengan seorang perempuan
  rationale: γυνή tanpa artikel paling wajar dipahami secara tak tentu di sini. Konteks menunjuk kepada perempuan Samaria, bukan kepada arti 'istri'.
- source_word: ἐλάλει
  choice: Ia sedang berbicara
  rationale: Bentuk imperfek menunjukkan percakapan yang sedang berlangsung; 'berbicara' juga mempertahankan hubungan leksikal dengan λαλεῖς pada pertanyaan berikutnya.
- source_word: μέντοι
  choice: namun
  rationale: 'Kata ini menandai kontras: meskipun mereka heran, tidak seorang pun mengucapkan pertanyaannya.'
- source_word: Τί ζητεῖς;
  choice: Apa yang Engkau inginkan darinya?
  rationale: ζητέω secara harfiah berarti 'mencari', tetapi objeknya tidak dinyatakan. Dalam konteks sapaan kepada Yesus, pertanyaan ini secara idiomatis menanyakan apa yang Ia kehendaki dari perempuan itu. Ambiguitas bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Mengapa Engkau berbicara dengannya?
  rationale: Secara bentuk τί berarti 'apa', tetapi bersama λαλεῖς μετά dan dalam konteks ini daya pragmatis pertanyaannya adalah 'mengapa'. Bentuk literal dicatat dalam catatan kaki.
theological_decisions:
- issue: Implikasi sosial ketika Yesus berbicara dengan seorang perempuan
  choice: Menyatakan keheranan para murid tanpa menambahkan alasan moral, etnis, atau adat ke dalam teks utama.
  alternative: Menjelaskan di dalam ayat bahwa keheranan itu disebabkan oleh batas sosial antara laki-laki dan perempuan atau antara orang Yahudi dan Samaria.
  rationale: Teks Yunani hanya menyatakan bahwa mereka heran Ia berbicara dengan seorang perempuan. Latar sosial dapat membantu penafsiran, tetapi alasan terperinci tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina bagi Yesus memakai huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. 'Perempuan' dipilih sebagai padanan netral dan modern untuk γυνή.
