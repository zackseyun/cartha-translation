id: JHN.4.50
reference: John 4:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: id
  text: Yesus berkata kepadanya, “Pergilah; anak laki-lakimu hidup.” Orang itu percaya kepada perkataan[a] yang Yesus ucapkan kepadanya, lalu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memercayai perkataan yang Yesus ucapkan kepadanya.”'
    reason: Alternatif leksikal untuk πιστεύω yang dapat menekankan penerimaan atau pengandalan terhadap ucapan Yesus, tanpa menentukan sifat teologis tanggapan orang itu.
lexical_decisions:
- source_word: Πορεύου
  choice: Pergilah
  rationale: Bentuk imperatif ini merupakan perintah langsung agar orang itu pergi. “Pergilah” ringkas, alami, dan mempertahankan daya perintah dalam bahasa Indonesia.
- source_word: ὁ υἱός σου
  choice: anakmu
  rationale: Dalam konteks ini υἱός menunjuk kepada anak laki-laki orang tersebut. Bahasa Indonesia lazim memakai “anakmu” ketika jenis kelaminnya sudah diketahui dari konteks, tanpa harus menggunakan bentuk yang lebih kaku “putramu”.
- source_word: ζῇ
  choice: hidup
  rationale: Bentuk kini ini menyatakan bahwa anak itu hidup, bukan sekadar bahwa ia akan hidup kelak. “Hidup” mempertahankan pernyataan Yesus yang padat dan tegas.
- source_word: ἐπίστευσεν
  choice: percaya
  rationale: Dengan objek datif τῷ λόγῳ, kata ini berarti menerima perkataan itu sebagai benar atau dapat diandalkan. “Percaya pada” mempertahankan hubungan dengan rumpun istilah iman/percaya tanpa menentukan lebih jauh sifat iman orang itu.
- source_word: ὁ ἄνθρωπος
  choice: Orang itu
  rationale: Teks Yunani menyebutnya secara umum sebagai “orang itu”, bukan mengulangi sebutan pejabat kerajaan dari konteks sebelumnya.
- source_word: τῷ λόγῳ
  choice: pada perkataan
  rationale: λόγος di sini menunjuk pada ucapan Yesus yang baru saja disampaikan. “Perkataan” alami dalam bahasa Indonesia dan diperjelas oleh klausa relatif berikutnya.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: yang diucapkan Yesus kepadanya
  rationale: Ungkapan ini secara jelas menerangkan “perkataan” dan mempertahankan bahwa Yesuslah yang mengucapkannya kepada orang tersebut.
- source_word: ἐπορεύετο
  choice: lalu ia pun pergi
  rationale: Bentuk imperfek menggambarkan bahwa ia mulai atau meneruskan perjalanannya setelah percaya. “Lalu ia pun pergi” menyampaikan urutan dan respons tindakannya secara alami tanpa melebih-lebihkan aspek duratif.
theological_decisions:
- issue: Makna πιστεύω sebagai tanggapan terhadap janji yang diucapkan Yesus
  choice: percaya pada perkataan
  alternative: memercayai perkataan
  rationale: Pilihan utama mempertahankan istilah “percaya” dan membiarkan narasi Yohanes sendiri menunjukkan kadar serta perkembangan iman orang itu. Terjemahan tidak menentukan apakah ini sudah merupakan iman dalam arti keselamatan atau sekadar keyakinan terhadap janji khusus Yesus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat langsung dibuat ringkas agar mempertahankan ketegasan ucapan Yesus; titik koma mencerminkan dua bagian ucapan yang berhubungan erat. Penanda catatan kaki [a] ditempatkan sesudah frasa yang diterangkannya.
