id: JHN.4.51
reference: John 4:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: id
  text: Sementara ia sudah dalam perjalanan turun, hamba-hambanya menemuinya dan berkata bahwa anaknya[a] hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “putranya”; kata Yunani pais dapat berarti “anak”, “anak laki-laki”, atau dalam konteks tertentu “hamba”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa perjalanan turun itu telah berlangsung sebelum pertemuan terjadi; “sudah” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: δὲ
  choice: Sementara
  rationale: Partikel ini meneruskan alur narasi secara ringan. Dalam konstruksi bersama partisipel, “sementara” mengungkapkan hubungan waktu secara alami tanpa menambahkan pertentangan.
- source_word: καταβαίνοντος
  choice: dalam perjalanan turun
  rationale: Partisipel kini dalam konstruksi genitif absolut menunjukkan tindakan yang sedang berlangsung. Ungkapan ini alami untuk perjalanan dari Kana menuju Kapernaum dan tetap mempertahankan gambaran gerak turun.
- source_word: δοῦλοι
  choice: hamba-hambanya
  rationale: Dalam konteks rumah tangga ini, kata tersebut menunjuk orang-orang yang berada di bawah kuasa pejabat itu. “Hamba-hamba” mempertahankan hubungan ketundukan lebih baik daripada sekadar “pelayan”, tanpa memakai istilah Indonesia yang terlalu terkait dengan perbudakan modern.
- source_word: ὑπήντησαν
  choice: menemuinya
  rationale: Kata kerja ini menyatakan pertemuan, sering kali dengan nuansa pergi menyongsong seseorang. “Menemuinya” jelas dan alami dalam narasi ini.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel ini menyatakan tindakan yang menyertai pertemuan. Bentuk klausa setara lebih alami dalam bahasa Indonesia daripada mempertahankan struktur partisipial secara kaku.
- source_word: παῖς
  choice: anaknya
  rationale: Kata ini dapat berarti anak, anak laki-laki, atau hamba. Dalam konteks luas Yohanes 4, orang yang disembuhkan adalah anak pejabat itu; “anaknya” mempertahankan hubungan keluarga tanpa mempersempitnya menjadi jenis kelamin tertentu dalam ayat ini.
- source_word: ζῇ
  choice: hidup
  rationale: Bentuk kini secara harfiah menyatakan bahwa anak itu hidup. “Hidup” mempertahankan bentuk dan daya pernyataan tersebut tanpa menambahkan penafsiran seperti “telah sembuh”.
theological_decisions:
- issue: Rujukan παῖς dalam kisah penyembuhan
  choice: anaknya
  alternative: putranya; hambanya
  rationale: Ayat ini memakai παῖς, istilah yang cakupan maknanya lebih luas daripada υἱός. Konteks sebelumnya menunjukkan hubungan keluarga, tetapi bentuk “anak” tidak memaksakan rincian jenis kelamin dari kata ayat ini sendiri. Catatan kaki mempertahankan alternatif leksikal yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan bermartabat. Struktur waktu dari genitif absolut dinyatakan dengan “Sementara”, sedangkan pengulangan pronomina dipertahankan secukupnya agar rujukannya jelas.
