  text: οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: id
  text: Sebab murid-murid-Nya telah pergi ke kota untuk membeli makanan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membeli perbekalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini menjelaskan keadaan yang memungkinkan percakapan sebelumnya terjadi; “Sebab” mempertahankan hubungan penjelas dengan ayat sebelumnya.
- source_word: μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Bentuk posesif yang wajar dan baku dalam narasi Alkitab berbahasa Indonesia.
- source_word: ἀπεληλύθεισαν
  choice: telah pergi
  rationale: Bentuk pluskuamperfek menunjukkan tindakan yang sudah terjadi sebelum adegan utama; “telah pergi” menyampaikan hubungan waktu itu secara alami.
- source_word: εἰς τὴν πόλιν
  choice: ke kota
  rationale: εἰς menandai gerak menuju atau masuk ke suatu tempat; dalam bahasa Indonesia, “ke kota” paling alami dan tetap membiarkan konteks menentukan apakah tempat itu tergolong kota atau kota kecil.
- source_word: ἵνα
  choice: untuk
  rationale: Di sini ἵνα menyatakan tujuan, yang secara idiomatis dinyatakan dengan “untuk”.
- source_word: τροφὰς
  choice: makanan
  rationale: Dalam konteks ini bentuk jamak τροφάς menunjuk pada bahan makanan atau perbekalan secara umum; “makanan” merupakan padanan modern yang paling lazim.
- source_word: ἀγοράσωσιν
  choice: membeli
  rationale: Aoristus subjungtif sesudah ἵνα menyatakan tindakan yang dituju; “membeli” adalah padanan langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan fungsi penjelas γὰρ serta urutan waktu dari bentuk pluskuamperfek tanpa membuat kalimat terasa kaku. Alternatif “kota kecil” tidak dimasukkan ke teks utama karena πόλις tidak menentukan ukuran permukiman secara tegas.
