  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: id
  text: Perempuan itu berkata kepada-Nya, “Tuhan[a], saya melihat bahwa Engkau seorang nabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat menjadi sapaan hormat maupun berarti “Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: Kata
  rationale: Bentuk kini historis Yunani dialihkan secara idiomatis sebagai bentuk lampau naratif dalam bahasa Indonesia; susunan ‘Kata perempuan itu’ tetap wajar dalam narasi yang bermartabat.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativanya menandai pihak yang diajak berbicara, yaitu Yesus. Huruf kapital mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada-Nya.
- source_word: ἡ γυνή
  choice: perempuan itu
  rationale: Dalam konteks ini γυνή menunjuk kepada perempuan Samaria yang sudah dikenal dalam narasi, bukan kepada seorang istri.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan padanan baku κύριος, sambil mencatat bahwa sapaan ini dalam konteks tersebut juga dapat berarti sapaan hormat ‘Tuan’.
- source_word: θεωρῶ
  choice: saya melihat
  rationale: Di sini θεωρέω menyatakan pengenalan atau kesimpulan berdasarkan apa yang baru saja Yesus nyatakan. ‘Saya melihat’ alami dan tetap dekat dengan citra leksikal sumber.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang dipahami perempuan itu.
- source_word: προφήτης
  choice: seorang nabi
  rationale: Nomina predikatif tanpa artikel menyatakan bahwa perempuan itu mengenali Yesus sebagai seorang nabi, tanpa secara eksplisit menyebut-Nya ‘Nabi itu’.
- source_word: σύ
  choice: Engkau
  rationale: Pronomina eksplisit Yunani tetap tercermin sebagai subjek. ‘Engkau’ sesuai dengan sapaan langsung kepada Yesus dalam register Alkitab Indonesia.
theological_decisions:
- issue: Makna κύριε sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks memungkinkan sapaan hormat tanpa harus menyiratkan bahwa perempuan itu sudah membuat pengakuan kristologis penuh. Teks utama memakai ‘Tuhan’, sedangkan kemungkinan ‘Tuan’ dipertahankan dalam catatan kaki agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Saya’ dipakai untuk ucapan perempuan itu karena merupakan pronomina orang pertama yang alami dalam percakapan sopan; ‘Engkau’ dan ‘-Nya’ mengikuti register Alkitab Indonesia ketika merujuk kepada Yesus.
