  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: id
  text: Aku memberi mereka hidup yang kekal. Mereka sama sekali tidak akan pernah binasa, dan tidak seorang pun akan merebut mereka dari tangan-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: hidup yang kekal
  rationale: Ungkapan Indonesia yang alami dan tepat untuk hidup yang bersifat kekal.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: sama sekali tidak akan pernah binasa
  rationale: Gabungan “sama sekali tidak” dan “tidak akan pernah” menyampaikan penyangkalan Yunani yang sangat tegas serta cakupan waktu εἰς τὸν αἰῶνα tanpa menghasilkan pengulangan yang janggal dalam bahasa Indonesia.
- source_word: ἁρπάσει
  choice: akan merebut
  rationale: Menyampaikan tindakan mengambil dengan paksa, sesuai makna ἁρπάζω dan metafora kawanan dalam konteks.
- source_word: ἐκ τῆς χειρός μου
  choice: dari tangan-Ku
  rationale: Mempertahankan citra konkret dan bentuk tunggal pada teks Yunani.
theological_decisions:
- issue: Kekuatan dan cakupan penyangkalan kebinasaan
  choice: sama sekali tidak akan pernah binasa
  alternative: tidak akan binasa untuk selama-lamanya
  rationale: Pilihan utama mempertahankan penegasan mutlak οὐ μή dan cakupan temporal εἰς τὸν αἰῶνα dalam ungkapan Indonesia yang lebih wajar, tanpa menambahkan penjelasan doktrinal tentang mekanisme atau syarat keselamatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “Aku” dan enklitik hormat “-Ku” mengikuti ujaran langsung Yesus serta kebiasaan penulisan rujukan ilahi dalam bahasa Indonesia.
