  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: id
  text: Yesus menjawab mereka, “Aku sudah mengatakannya kepada kalian, dan kalian tidak percaya. Karya-karya yang Kulakukan dalam nama Bapa-Ku[a], itulah yang bersaksi tentang Aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kewenangan Bapa-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memberi kesaksian mengenai Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang alami untuk ἀποκρίνομαι dalam percakapan.
- source_word: Εἶπον ὑμῖν
  choice: Aku sudah mengatakannya kepadamu
  rationale: Bentuk aoristus menunjuk pada perkataan yang telah disampaikan sebelumnya; 'sudah mengatakannya' terdengar alami dan mempertahankan rujukan retrospektifnya.
- source_word: οὐ πιστεύετε
  choice: kamu tidak percaya
  rationale: '''Percaya'' mempertahankan istilah kunci πιστεύω dan kesinambungan teologisnya dalam Injil Yohanes.'
- source_word: τὰ ἔργα
  choice: pekerjaan-pekerjaan
  rationale: Mempertahankan istilah khas Yohanes bagi tindakan-tindakan Yesus, termasuk karya yang berfungsi sebagai tanda.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: dalam nama Bapa-Ku
  rationale: Mempertahankan ungkapan Yunani beserta keluasan maknanya yang mencakup perwakilan dan kewenangan, tanpa mempersempitnya hanya menjadi 'dengan kuasa'.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: itulah yang bersaksi tentang Aku
  rationale: '''Itulah'' mencerminkan penegasan demonstratif ταῦτα, sedangkan ''bersaksi'' mempertahankan nuansa kesaksian yang penting dalam Yohanes.'
theological_decisions:
- issue: Hubungan pekerjaan Yesus dengan nama dan kewenangan Bapa
  choice: dalam nama Bapa-Ku
  alternative: dengan kewenangan Bapa-Ku
  rationale: Terjemahan formal ungkapan tersebut menjaga cakupan makna representasi, perutusan, dan kewenangan tanpa menetapkan hanya satu penafsiran.
- issue: Fungsi pekerjaan Yesus sebagai kesaksian
  choice: bersaksi tentang Aku
  alternative: memberi kesaksian mengenai Aku
  rationale: Pilihan ini mempertahankan gambaran yuridis tentang kesaksian sekaligus tetap ringkas dan alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi penerbitan Alkitab bahasa Indonesia. Pengulangan 'pekerjaan-pekerjaan' dipertahankan untuk menandai bentuk jamak dan istilah khas Yohanes.
