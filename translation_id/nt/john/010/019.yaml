  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: id
  text: Karena perkataan ini, timbul lagi perpecahan di antara orang-orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea”; dalam beberapa konteks dalam Injil Yohanes, istilah ini dapat menunjuk kepada “para pemimpin Yahudi”. Ungkapan “orang-orang Yahudi” di sini mengikuti istilah Yunani, tetapi dalam Injil Yohanes istilah itu sering menunjuk kepada kelompok tertentu sesuai konteks, bukan kepada seluruh bangsa Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: perpecahan
  rationale: Kata ini menyatakan keretakan atau perpecahan; dalam konteks ini, tanggapan orang-orang terhadap perkataan Yesus menjadi terbagi.
- source_word: πάλιν
  choice: lagi
  rationale: Adverbia ini menandai pengulangan dan mengingatkan pada perpecahan sebelumnya dalam narasi Yohanes.
- source_word: ἐγένετο
  choice: timbul
  rationale: Bentuk γίνομαι di sini menyatakan munculnya suatu keadaan; 'timbul perpecahan' alami dalam bahasa Indonesia dan mempertahankan nuansa peristiwa.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: di antara orang-orang Yahudi
  rationale: Ini merupakan padanan langsung frasa Yunani. Karena Ἰουδαῖοι dalam Injil Yohanes dapat menunjuk secara kontekstual kepada orang Yudea atau para pemimpin Yahudi, catatan kaki mempertahankan nuansa tersebut tanpa mempersempit teks utama.
- source_word: διὰ
  choice: Karena
  rationale: Dengan kasus akusatif, διά menyatakan sebab; 'karena' menyampaikan hubungan kausal secara ringkas dan wajar.
- source_word: τοὺς λόγους τούτους
  choice: perkataan-perkataan itu
  rationale: λόγοι menunjuk pada ucapan Yesus yang mendahului ayat ini. Bentuk ini alami, jelas, dan mempertahankan bentuk jamak sumber.
theological_decisions:
- issue: Rujukan Ἰουδαῖοι dalam Injil Yohanes
  choice: Orang-orang Yahudi dalam teks utama, disertai catatan kontekstual
  alternative: Orang-orang Yudea; para pemimpin Yahudi
  rationale: Istilah Yunani itu memiliki cakupan yang bergantung pada konteks. Padanan langsung dipertahankan, tetapi catatan mencegah pembacaan seolah-olah yang dimaksud selalu seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
