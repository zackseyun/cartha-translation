base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: id
  text: Karena itu, orang-orang Yahudi kembali mengambil batu untuk merajam Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, mungkin dalam konteks ini, “para pemimpin Yahudi” atau “orang-orang Yudea.” Dalam Injil Yohanes, ungkapan “orang-orang Yahudi” sering menunjuk pada lawan-lawan Yesus dari kalangan Yahudi tertentu, bukan pada bangsa Yahudi secara keseluruhan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: mengambil
  rationale: Dalam konteks λίθους dan tindakan bermusuhan yang segera dilakukan, βαστάζω berarti mengambil batu untuk digunakan; 'mengambil' alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: οὖν
  choice: Karena itu
  rationale: οὖν menghubungkan tindakan ini sebagai tanggapan atau konsekuensi dari perkataan Yesus sebelumnya; 'karena itu' mempertahankan hubungan inferensial tersebut.
- source_word: πάλιν
  choice: kembali
  rationale: πάλιν menyatakan pengulangan; 'kembali' terdengar alami di sini dan mengacu pada tindakan serupa sebelumnya.
- source_word: λίθους
  choice: batu
  rationale: λίθος secara langsung berarti batu. Bahasa Indonesia lazim memakai bentuk tak bertanda jumlah setelah verba, sehingga 'batu' sudah dapat bermakna jamak sesuai konteks.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ungkapan Yunani secara harfiah menyebut orang-orang Yahudi. Teks utama tidak dipersempit menjadi 'para pemimpin Yahudi', tetapi catatan kaki menjelaskan kemungkinan cakupan kontekstual agar tidak dipahami sebagai seluruh bangsa Yahudi.
- source_word: ἵνα
  choice: untuk
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan; 'untuk' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: λιθάσωσιν
  choice: merajam
  rationale: λιθάζω berarti melempari dengan batu sebagai tindakan penghukuman atau pembunuhan. 'Merajam' merupakan verba Indonesia yang tepat dan ringkas tanpa secara eksplisit menambahkan hasil kematian.
- source_word: αὐτόν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Yesus. 'Dia' jelas dan wajar; huruf kapital mengikuti konvensi penerbitan Alkitab bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
theological_decisions:
- issue: Referen dan cakupan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: Memakai 'orang-orang Yahudi' dalam teks utama dan memberi penjelasan kontekstual dalam catatan kaki.
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Bunyi Yunani tidak secara eksplisit mengatakan 'para pemimpin', sehingga teks utama mempertahankan cakupan leksikalnya. Namun, dalam Injil Yohanes ungkapan ini sering menunjuk kelompok lawan tertentu, bukan bangsa Yahudi secara keseluruhan; catatan mempertahankan kemungkinan itu tanpa menentukannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan kalimat mempertahankan hubungan logis, pengulangan tindakan, dan tujuan yang terdapat dalam bahasa Yunani. Catatan kaki mencegah generalisasi antisemit tanpa mempersempit referen teks utama.
