  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: id
  text: 'Inilah sebabnya Bapa mengasihi Aku: Aku menyerahkan nyawa-Ku supaya Aku mengambilnya kembali.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itulah
  rationale: Ungkapan ini menyampaikan hubungan sebab-akibat dengan bagian yang mengikutinya secara alami dalam bahasa Indonesia.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: Bapa mengasihi Aku
  rationale: Mempertahankan subjek tertentu, 'Bapa', tanpa menambahkan kata milik yang tidak terdapat dalam teks Yunani.
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteks ini kata tersebut memperkenalkan alasan Bapa mengasihi Yesus.
- source_word: τίθημι τὴν ψυχήν μου
  choice: Aku menyerahkan nyawa-Ku
  rationale: Ungkapan Indonesia yang wajar untuk tindakan sukarela memberikan hidup sampai mati; lebih alami daripada terjemahan harfiah 'meletakkan nyawa-Ku'.
- source_word: ἵνα
  choice: supaya
  rationale: Menjaga daya tujuan pada klausa Yunani tanpa menentukan secara berlebihan hubungan tujuan dan hasil.
- source_word: πάλιν λάβω αὐτήν
  choice: Aku mengambilnya kembali
  rationale: Menyampaikan tindakan memperoleh kembali nyawa yang telah diserahkan; 'mengambil' juga sesuai dengan penekanan konteks dekat pada kewenangan Yesus.
theological_decisions:
- issue: Makna ψυχή dalam konteks penyerahan diri Kristus
  choice: nyawa-Ku
  alternative: jiwa-Ku
  rationale: Konteks membicarakan kematian Yesus dan hidup yang diambil kembali, bukan mengajarkan pembedaan antara tubuh dan jiwa. 'Nyawa' mengungkapkan hidup fana yang diserahkan sambil tetap memberi alternatif leksikal dalam catatan kaki.
- issue: Daya ἵνα dengan λάβω sehubungan dengan kematian dan kebangkitan Yesus
  choice: supaya Aku mengambilnya kembali
  alternative: agar Aku dapat menerimanya kembali
  rationale: '''Supaya'' mempertahankan nuansa tujuan, sedangkan bentuk Indonesia tidak perlu menambahkan modalitas ''dapat'' yang dapat terdengar seolah-olah hanya menyatakan kemampuan. ''Mengambil'' menjaga tindakan aktif tanpa menguraikan lebih jauh mekanisme kebangkitan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti konvensi penerbitan Alkitab bahasa Indonesia. 'Menyerahkan nyawa' dipilih sebagai ungkapan alami bagi tindakan sukarela, sementara struktur sebab dan tujuan teks sumber tetap dipertahankan.
