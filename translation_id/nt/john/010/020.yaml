  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: id
  text: Namun, banyak di antara mereka terus berkata, “Ia kerasukan setan dan gila. Mengapa kalian mendengarkan Dia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ucapan yang berlangsung dalam adegan; dalam narasi Indonesia, “berkata” tetap alami tanpa harus menambahkan aspek yang terasa berat seperti “terus berkata”.
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan tanggapan sebelumnya secara alami dan bermartabat.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: banyak dari antara mereka
  rationale: Mempertahankan nuansa partitif bahwa yang berbicara hanyalah sebagian dari kelompok itu.
- source_word: Δαιμόνιον ἔχει
  choice: Ia kerasukan setan
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan tuduhan bahwa Yesus berada di bawah pengaruh atau penguasaan roh jahat; bentuk harfiah “mempunyai setan” tidak alami dalam bahasa Indonesia.
- source_word: μαίνεται
  choice: sudah gila
  rationale: Menyampaikan tuduhan bahwa Ia kehilangan kewarasan; “sudah” memberi daya ungkap alami dalam seruan tersebut tanpa menjadikannya diagnosis klinis.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Mengapa kalian mendengarkan Dia?
  rationale: τί berfungsi sebagai “mengapa” dalam konteks ini, sedangkan ἀκούω dengan genitif bermakna mendengarkan atau mengindahkan. “Kalian” memperjelas bentuk jamak.
theological_decisions:
- issue: Tuduhan bermusuhan mengenai keadaan Yesus
  choice: Ia kerasukan setan dan sudah gila
  alternative: Ia mempunyai setan dan mengamuk seperti orang gila
  rationale: Terjemahan menyajikan tuduhan para penentang sebagai ucapan mereka, tanpa membenarkannya atau melunakkannya. Rumusan idiomatis dipilih tanpa menambahkan penjelasan klinis maupun doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Kata ganti “Ia/Dia” dipakai bagi Yesus sesuai kebiasaan penerbitan Alkitab Indonesia; “kalian” menandai sapaan jamak secara jelas.
