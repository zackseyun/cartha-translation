id: JHN.10.2
reference: John 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: id
  text: Namun, orang yang masuk melalui pintu adalah gembala domba-domba itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang gembala bagi domba-domba itu.” Kata Yunani untuk “gembala” tidak memakai artikel, tetapi konteks mendukung pengertian gembala yang sah, sebagai lawan dari orang-orang yang masuk secara tidak sah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Namun, orang yang masuk
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk kepada orang yang dikenali melalui tindakannya. "Orang yang masuk" alami dalam bahasa Indonesia dan tetap memiliki daya generik. δέ diterjemahkan "Namun" untuk menandai kontras dengan pencuri dan perampok pada ayat sebelumnya.
- source_word: διὰ τῆς θύρας
  choice: melalui pintu
  rationale: διά dengan bentuk genitif menyatakan gerak melalui sesuatu; frasa ini mempertahankan gambaran ruang dalam teks sumber secara lugas.
- source_word: ποιμήν
  choice: gembala
  rationale: ποιμήν adalah nomina predikatif tanpa artikel. Bahasa Indonesia tidak memiliki artikel tentu yang langsung sepadan; susunan "adalah gembala domba-domba itu" secara alami dapat mengidentifikasi dia sebagai gembala yang sah dalam kontras konteks, sambil tidak menutup kemungkinan pembacaan tak tentu.
- source_word: τῶν προβάτων
  choice: domba-domba itu
  rationale: Bentuk jamak πρόβατα diterjemahkan secara konkret sebagai "domba-domba", bukan secara interpretatif sebagai "kawanan". Penunjuk "itu" menyampaikan ketentuan frasa Yunani dan mengacu pada domba-domba dalam gambaran yang sedang dibicarakan.
theological_decisions:
- issue: Ketentuan ποιμήν sebagai nomina predikatif
  choice: gembala domba-domba itu
  alternative: seorang gembala bagi domba-domba itu
  rationale: Konteks mengontraskan orang yang masuk dengan sah dan para penyusup, sehingga frasa utama wajar dipahami sebagai identifikasi gembala yang sah. Namun, karena ποιμήν tidak berartikel dan bahasa Indonesia memungkinkan ungkapan ini tetap agak terbuka, terjemahan tidak menambahkan "sang" yang akan membuat ketentuannya lebih tegas daripada teks Yunani. Alternatif tak tentu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. "Namun" menjaga kontras antarayat; "domba-domba" mempertahankan citra konkret teks sumber. Tidak digunakan "sang gembala" agar ketentuan nomina predikatif Yunani tidak ditegaskan secara berlebihan.
