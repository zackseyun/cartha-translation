  source_fidelity: Terjemahan secara akurat mencerminkan ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων. “Namun” memadai untuk δέ dalam kontras dengan ayat sebelumnya; “orang yang masuk melalui pintu” mempertahankan partisipel substantival dan arti spasial διά dengan genitif. “Gembala domba-domba itu” menyampaikan hubungan ποιμήν dengan τῶν προβάτων tanpa menambahkan penegasan kristologis atau denominasional.
