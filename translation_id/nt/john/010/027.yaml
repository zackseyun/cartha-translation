  naturalness: Dengan «mendengar», kalimat tetap sangat alami dalam bahasa Indonesia modern. Penyusunan tiga klausa dengan koma juga mencerminkan rangkaian καί dalam sumber secara lebih dekat, tanpa menjadi tidak wajar.
  terminology: «Domba-domba-Ku», «suara-Ku», «mengenal», dan «mengikuti Aku» tepat, jelas, dan sesuai register Alkitab Indonesia modern. Kapitalisasi pronomina ilahi dan penggunaan tanda hubung dapat dipertahankan sebagai konvensi editorial yang lazim.
