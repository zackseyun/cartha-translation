  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: id
  text: Domba-domba-Ku mendengar suara-Ku, dan Aku mengenal mereka, dan mereka mengikuti Aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Domba-domba-Ku
  rationale: Mengungkapkan metafora gembala dan kepunyaan dengan wajar dalam bahasa Indonesia. Bentuk ulang menandai jamak, sedangkan -Ku mempertahankan kepunyaan dan penekanan ringan dari konstruksi Yunani.
- source_word: τῆς φωνῆς μου
  choice: suara-Ku
  rationale: Dalam konteks pengenalan antara gembala dan domba, φωνή paling tepat diterjemahkan sebagai suara, bukan bunyi.
- source_word: ἀκούουσιν
  choice: mendengarkan
  rationale: Dengan objek suara seseorang, mendengarkan merupakan ungkapan Indonesia yang alami dan dapat mencakup respons khas para domba dalam konteks ini. Bentuk kini Yunani menyatakan tindakan yang menjadi ciri mereka, tanpa perlu ditandai secara khusus dalam bahasa Indonesia.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: Aku mengenal mereka
  rationale: κἀγώ menghubungkan klausa berikutnya dan memberi penekanan ringan pada Aku; pemisahan menjadi kalimat baru tetap menyampaikan hubungan itu secara alami. Mengenal mempertahankan daya relasional γινώσκω tanpa memperluasnya menjadi mengenal secara pribadi.
- source_word: καὶ ἀκολουθοῦσίν μοι
  choice: dan mereka mengikuti Aku
  rationale: Terjemahan langsung dan alami; bentuk kini menyatakan tindakan yang terus menjadi ciri domba-domba itu.
theological_decisions:
- issue: Daya relasional γινώσκω dalam metafora gembala dan domba
  choice: mengenal
  alternative: mengetahui; mengenal secara pribadi
  rationale: Mengenal menyampaikan pengetahuan yang bersifat personal dan relasional dalam bahasa Indonesia, tetapi tidak menambahkan penjelasan doktrinal yang tidak dinyatakan secara eksplisit oleh teks Yunani.
- issue: Hubungan antara mendengar suara Yesus dan mengikuti-Nya
  choice: Kedua tindakan dipertahankan sebagai pernyataan sejajar tanpa penjelasan kausal
  alternative: mereka mendengarkan suara-Ku sehingga mengikuti Aku
  rationale: Teks menghubungkan klausa-klausa dengan καί, bukan dengan penanda sebab-akibat. Terjemahan tidak boleh menetapkan hubungan logis yang lebih sempit daripada sumber.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Tanda hubung pada bentuk ulang dan enklitik dipakai sesuai ejaan Indonesia: Domba-domba-Ku.'
