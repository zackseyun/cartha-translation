  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: id
  text: masakan kamu berkata tentang Dia yang dikuduskan[a] oleh Bapa dan diutus-Nya ke dalam dunia, ‘Engkau menghujat,’ karena Aku berkata, ‘Aku adalah Anak Allah’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikhususkan” atau “ditahbiskan” untuk ἡγίασεν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: dikuduskan
  rationale: Bentuk ini mempertahankan hubungan leksikal dengan kekudusan dan tindakan Bapa terhadap Anak. Dalam konteks pengutusan, maknanya juga dapat mencakup ‘dikhususkan’ atau ‘ditahbiskan’, tanpa menyiratkan perbaikan moral.
- source_word: ἀπέστειλεν
  choice: diutus-Nya
  rationale: ‘Mengutus’ secara alami menyampaikan tindakan mengirim dengan suatu misi dan mempertahankan bahasa pengutusan yang khas dalam Injil Yohanes. Akhiran -Nya merujuk kepada Bapa sebagai pelaku.
- source_word: εἰς τὸν κόσμον
  choice: ke dalam dunia
  rationale: Terjemahan ini mempertahankan arah gerak εἰς dan istilah Yohanes yang lazim untuk κόσμος.
- source_word: Βλασφημεῖς
  choice: Engkau menghujat
  rationale: Bentuk kini diterjemahkan sebagai tuduhan langsung yang ringkas dan wajar dalam bahasa Indonesia.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Ungkapan baku ini mempertahankan daya kristologis frasa tersebut tanpa menambahkan rumusan teologis di luar teks.
- source_word: ὃν ὁ πατὴρ
  choice: Dia yang dikuduskan oleh Bapa
  rationale: Konstruksi relatif dibuat alami dalam bahasa Indonesia sambil mempertahankan Bapa sebagai pelaku tindakan.
- source_word: ὅτι ... ὅτι
  choice: berkata tentang ... karena Aku berkata
  rationale: ὅτι pertama memperkenalkan isi perkataan, yang dalam bahasa Indonesia dapat langsung mengikuti ‘berkata’; ὅτι kedua menyatakan alasan tuduhan dan diterjemahkan ‘karena’.
theological_decisions:
- issue: Makna ἡγίασεν ketika dikenakan kepada Anak
  choice: dikuduskan
  alternative: dikhususkan; ditahbiskan
  rationale: ‘Dikuduskan’ mempertahankan istilah sumber dan ketegangan teologisnya. Dalam konteks ini tindakan itu berkaitan dengan pengkhususan bagi pengutusan, bukan pernyataan bahwa Anak sebelumnya tidak kudus atau perlu diperbaiki secara moral.
- issue: Daya kristologis Υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  alternative: Putra Allah
  rationale: ‘Anak Allah’ merupakan ungkapan Alkitabiah yang paling dikenal dan alami dalam bahasa Indonesia serta mempertahankan bobot gelarnya dalam konteks tuduhan penghujatan.
- issue: Tekanan retoris pertanyaan
  choice: masakan kamu berkata
  alternative: apakah kamu berkata
  rationale: Partikel ‘masakan’ menyampaikan sifat pertanyaan yang menantang dan ketidakselarasan yang ditekankan oleh argumen Yesus, tanpa mengubahnya menjadi pernyataan biasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Kamu’ dipakai sebagai sapaan jamak yang sesuai dengan kelompok lawan bicara; kapitalisasi pronomina bagi Yesus dan akhiran -Nya mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan bentuk pertanyaan retoris Yunani.
