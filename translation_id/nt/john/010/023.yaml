base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: id
  text: Dan Yesus sedang berjalan di pelataran Bait Allah, di Serambi Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Serambi ini adalah jalur beratap yang ditopang deretan tiang; istilah Yunaninya juga dapat diterjemahkan “kolonade.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung sederhana ini mempertahankan hubungan dengan konteks sebelumnya tanpa menambahkan nuansa waktu.
- source_word: περιεπάτει
  choice: sedang berjalan
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung pada masa lampau; konstruksi ini menyampaikan aspek progresif secara alami dalam bahasa Indonesia.
- source_word: ἱερῷ
  choice: pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau kawasan Bait Allah, bukan secara khusus ruang kudus bagian dalam (ναός). Dalam konteks Serambi Salomo, 'pelataran Bait Allah' menyatakan lokasi umum itu dengan jelas.
- source_word: στοᾷ
  choice: Serambi
  rationale: στοά adalah jalur beratap yang ditopang deretan tiang. 'Serambi' merupakan istilah yang alami dan bermartabat untuk nama lokasi ini, sementara rincian arsitektural dijelaskan dalam catatan kaki.
- source_word: τοῦ Σολομῶνος
  choice: Salomo
  rationale: Genitif ini membentuk nama tempat dan secara alami diterjemahkan sebagai 'Serambi Salomo' dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan wajar. Kapitalisasi 'Bait Allah' dan 'Serambi Salomo' menandai nama tempat. Catatan tentang cakupan ἱερόν diwakili langsung oleh pilihan 'pelataran', sehingga tidak diperlukan catatan kaki tambahan.
