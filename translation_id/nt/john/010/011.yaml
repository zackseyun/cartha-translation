  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: id
  text: Akulah gembala yang baik.[a] Gembala yang baik menyerahkan nyawanya[b] bagi domba-domba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gembala yang mulia”; kata Yunani καλός dapat berarti baik, mulia, atau patut diteladani.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “meletakkan jiwanya”; ungkapan Yunani ini berarti menyerahkan nyawanya.
    reason: lexical_alternative
  - marker: c
    text: Atau “demi domba-domba” atau “untuk kepentingan domba-domba.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini menyampaikan identifikasi diri sekaligus penekanan dari pronomina eksplisit Ἐγώ secara alami dalam bahasa Indonesia, tanpa memperkuatnya menjadi pernyataan teologis yang melampaui konstruksi predikatif ayat ini.
- source_word: ποιμήν
  choice: gembala
  rationale: Padanan langsung dan wajar bagi ποιμήν dalam gambaran kawanan domba; “pendeta” akan memasukkan asosiasi jabatan gerejawi yang tidak dinyatakan oleh konteks langsung.
- source_word: καλός
  choice: baik
  rationale: “Baik” merupakan padanan alami yang tetap dapat mencakup mutu luhur, mulia, dan patut diteladani dari καλός tanpa mempersempit nuansanya.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nyawanya
  rationale: Dalam ungkapan ini ψυχή menunjuk pada hidup atau nyawa seseorang, bukan secara khusus pada jiwa sebagai unsur nonjasmani.
- source_word: τίθησιν
  choice: menyerahkan
  rationale: Bersama ψυχή, kata ini membentuk ungkapan tentang penyerahan nyawa. “Menyerahkan nyawanya” alami dalam bahasa Indonesia dan mempertahankan sifat tindakan yang disengaja.
- source_word: ὑπὲρ
  choice: bagi
  rationale: “Bagi” secara ringkas mempertahankan daya benefaktif atau perwakilan dari ὑπέρ tanpa menetapkan teori pendamaian tertentu.
- source_word: τῶν προβάτων
  choice: domba-domba itu
  rationale: Pengulangan kata menandai bentuk jamak, sedangkan “itu” mencerminkan artikel Yunani tanpa menambahkan kata milik seperti “domba-dombanya” yang tidak terdapat dalam teks.
theological_decisions:
- issue: Daya identifikasi diri Ἐγώ εἰμι
  choice: Akulah
  alternative: Aku sendiri adalah; Aku adalah
  rationale: “Akulah” menyampaikan penekanan pronomina secara idiomatis, tetapi tidak secara eksplisit menjadikannya acuan kepada nama ilahi. Dengan demikian, kemungkinan resonansi teologis tetap tidak dipaksakan ke dalam terjemahan.
- issue: Makna καλός dalam gelar gembala
  choice: gembala yang baik
  alternative: gembala yang mulia; gembala teladan
  rationale: “Baik” akurat, alami, dan mempertahankan keluasan makna yang dapat meliputi keluhuran serta keteladanan tanpa penafsiran berlebihan.
- issue: Makna ὑπὲρ τῶν προβάτων berkaitan dengan kematian Yesus
  choice: bagi domba-domba itu
  alternative: demi domba-domba itu; mewakili domba-domba itu
  rationale: “Bagi” mempertahankan kemungkinan makna demi kepentingan atau atas nama mereka dan tidak mempersempit frasa kepada satu rumusan teori pendamaian.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Akulah” menjaga penekanan pembuka; “menyerahkan nyawanya” menyampaikan idiom Yunani dengan jelas; dan semua alternatif penting dicatat tanpa memasukkan istilah denominasi atau teori pendamaian tertentu.
