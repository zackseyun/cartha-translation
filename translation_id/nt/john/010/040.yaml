  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: id
  text: Lalu Yesus pergi lagi ke seberang Sungai Yordan, ke tempat Yohanes mula-mula membaptis, dan Ia tinggal di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Bentuk aoris ἀπέρχομαι menyatakan bahwa Yesus meninggalkan tempat sebelumnya; dalam bahasa Indonesia, "pergi" sudah alami dan cukup jelas dalam konteks.
- source_word: πάλιν
  choice: lagi
  rationale: Padanan langsung dan alami untuk tindakan yang berulang.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ke seberang Sungai Yordan
  rationale: πέραν dengan genitif menunjuk sisi lain Yordan. Penambahan "Sungai" memperjelas nama geografis bagi pembaca Indonesia, sedangkan "ke" sesuai dengan gerak yang dinyatakan oleh ἀπῆλθεν.
- source_word: εἰς τὸν τόπον
  choice: ke tempat
  rationale: εἰς menandai tujuan gerak; "ke tempat" merupakan ungkapan Indonesia yang langsung dan wajar.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: Yohanes dahulu membaptis
  rationale: Ungkapan ini merujuk pada kegiatan Yohanes pada masa sebelumnya. "Dahulu membaptis" menyampaikan hubungan waktu dan kegiatan berkelanjutan secara ringkas tanpa memaksakan kala gramatikal yang tidak dimiliki bahasa Indonesia.
- source_word: ἔμεινεν
  choice: tinggal
  rationale: Dalam konteks menetap sementara di suatu tempat, "tinggal" adalah padanan modern dan alami bagi μένω.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Padanan lokatif langsung yang merujuk kembali kepada tempat di seberang Yordan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Yesus dinyatakan sebagai subjek karena bahasa Indonesia tidak memiliki pronomina orang ketiga bergender; hal ini mencegah rujukan "Ia" menjadi kabur setelah penyebutan Yohanes dalam ayat sebelumnya. "Ia" kemudian dipakai untuk mempertahankan gaya naratif yang hormat dan alami.
