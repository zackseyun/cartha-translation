  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: id
  text: Yesus menjawab mereka, “Aku telah memperlihatkan kepada kalian banyak perbuatan baik yang berasal dari Bapa[a]. Karena perbuatan baik yang manakah di antaranya kalian melempari Aku dengan batu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani berbunyi “dari Bapa,” bukan “dari Bapa-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Kata kerja naratif ini secara wajar menyatakan jawaban atau tanggapan Yesus kepada lawan bicara-Nya.
- source_word: Πολλὰ ἔργα καλὰ
  choice: banyak perbuatan baik
  rationale: “Perbuatan” mempertahankan arti ἔργα sebagai tindakan nyata Yesus, sedangkan “baik” menyampaikan mutu καλὰ sebagai sesuatu yang baik, patut, dan bermanfaat.
- source_word: ἔδειξα
  choice: telah memperlihatkan
  rationale: Bentuk perfektif Yunani menunjuk pada tindakan yang telah dilakukan; “memperlihatkan” juga mempertahankan gagasan bahwa karya-karya itu dibuat nyata di hadapan mereka.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: “Kalian” menyatakan dengan jelas bahwa pronomina Yunani ini berbentuk jamak dan tetap alami dalam bahasa Indonesia modern.
- source_word: ἐκ τοῦ πατρός
  choice: yang berasal dari Bapa
  rationale: ἐκ menyatakan sumber atau asal. Rumusan ini mempertahankan “Bapa” tanpa menambahkan pronomina posesif yang tidak terdapat dalam teks Yunani.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: karena perbuatan yang mana di antaranya
  rationale: διά dengan akusatif menyatakan sebab atau dasar, sedangkan bentuk tunggal ἔργον dan acuan αὐτῶν kepada banyak perbuatan sebelumnya tetap tampak.
- source_word: ἐμὲ λιθάζετε
  choice: kalian melempari Aku dengan batu
  rationale: Terjemahan ini mempertahankan kala kini dan objek yang ditekankan tanpa menambahkan gagasan “mencoba” atau “berniat,” yang tidak dinyatakan langsung oleh verba Yunani.
theological_decisions:
- issue: Sebutan “Bapa” dalam perkataan Yesus
  choice: Mempertahankan “Bapa” tanpa menambahkan “Bapa-Ku”
  alternative: “Bapa-Ku”
  rationale: Teks Yunani berbunyi τοῦ πατρός tanpa μου. Konteks tetap menunjukkan hubungan Yesus dengan Bapa, tetapi terjemahan tidak memperkuat pernyataan itu melebihi bentuk sumber.
- issue: Hubungan perbuatan Yesus dengan Bapa
  choice: “yang berasal dari Bapa”
  alternative: “atas nama Bapa” atau “demi Bapa”
  rationale: Ungkapan ἐκ τοῦ πατρός terutama menyatakan asal atau sumber. Terjemahan tidak mempersempitnya menjadi sekadar perwakilan atau tujuan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak ὑμῖν dan λιθάζετε. Susunan pertanyaan sengaja mempertahankan kaitan sebab antara salah satu perbuatan baik dan tindakan melempari Yesus dengan batu.
