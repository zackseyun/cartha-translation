  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: id
  text: Pencuri datang hanya untuk mencuri, menyembelih, dan membinasakan.[a] Aku datang supaya mereka memiliki hidup dan memilikinya dalam kelimpahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membunuh” untuk “menyembelih” (θύσῃ). Kata kerja Yunani ini sering merujuk pada penyembelihan, sesuai dengan gambaran domba dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “memiliki hidup dalam kelimpahan” atau “memilikinya secara penuh.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: pencuri
  rationale: Nomina berartikel ini menunjuk secara definit/generik kepada sosok pencuri dalam wacana tentang gembala; bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: datang hanya
  rationale: Ungkapan ini membatasi tujuan kedatangan pencuri pada rangkaian tindakan yang menyusul; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: ἵνα κλέψῃ
  choice: untuk mencuri
  rationale: Infinitif dengan 'untuk' menyampaikan tujuan secara alami setelah ungkapan pembatas.
- source_word: θύσῃ
  choice: menyembelih
  rationale: θύω lazim berarti menyembelih, khususnya binatang, sehingga pilihan ini mempertahankan gambaran domba dalam konteks.
- source_word: ἀπολέσῃ
  choice: membinasakan
  rationale: Kata ini menyampaikan kehancuran menyeluruh tanpa menentukan objek atau caranya lebih jauh daripada teks Yunani.
- source_word: ἐγὼ ἦλθον
  choice: Aku datang
  rationale: Aoristus diterjemahkan secara lugas dan mempertahankan kontras tegas antara misi Yesus dan tujuan pencuri.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: supaya mereka memiliki hidup
  rationale: Pilihan ini mempertahankan klausa tujuan dan istilah Yohanes ζωὴ tanpa mempersempitnya menjadi 'hidup kekal', yang tidak dinyatakan secara eksplisit di ayat ini.
- source_word: περισσὸν ἔχωσιν
  choice: memilikinya dengan berlimpah
  rationale: περισσόν berfungsi menerangkan kadar atau cara mereka memiliki hidup; pronomina '-nya' merujuk kembali kepada hidup.
theological_decisions:
- issue: Cakupan ζωὴ dalam pemakaian Yohanes
  choice: hidup
  alternative: hidup kekal; hidup sejati
  rationale: Teks memakai ζωὴ tanpa kata sifat 'kekal'. 'Hidup' mempertahankan keluasan dan kedalaman teologis istilah itu tanpa memasukkan penafsiran yang lebih khusus ke dalam teks utama.
- issue: Daya makna περισσὸν
  choice: dengan berlimpah
  alternative: dalam kelimpahan; sepenuhnya
  rationale: Ungkapan ini menggambarkan kelimpahan hidup yang diberikan Yesus, tetapi tidak boleh diperluas menjadi janji kemakmuran atau berkat materi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' mempertahankan bentuk orang pertama tunggal yang langsung dalam perkataan Yesus. Paralelisme tiga verba dan dua klausa tujuan dipertahankan; pilihan 'menyembelih' menjaga citra pastoral tanpa menutup alternatif 'membunuh'.
