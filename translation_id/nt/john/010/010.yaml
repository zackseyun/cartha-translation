  terminology: “Pencuri,” “menyembelih,” “membinasakan,” dan “hidup” sesuai dengan register modern baku dan tidak memasukkan penafsiran teologis tambahan. Catatan a tepat. Catatan b perlu sedikit diperbaiki agar alternatif “to the full” tidak terdengar sebagai penyelesaian total, melainkan kepenuhan hidup.
