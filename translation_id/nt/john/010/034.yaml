  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: id
  text: 'Yesus menjawab mereka, “Bukankah dalam Taurat kalian tertulis, ‘Aku telah berkata: Kamu adalah allah-allah’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk-makhluk ilahi.” Yesus mengutip Mazmur 82:6. Makna istilah ini diperdebatkan; teks utama mempertahankan bunyi langsung kutipan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: menjawab mereka
  rationale: Ungkapan naratif yang alami dalam bahasa Indonesia dan tetap menyatakan objek datif αὐτοῖς.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Bukankah ... tertulis
  rationale: Mencerminkan pertanyaan retoris Yunani dan keadaan tetap dari bentuk perfektum pasif dalam idiom pengutipan Kitab Suci.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: dalam Tauratmu
  rationale: νόμος di sini menunjuk pada Kitab Suci Yahudi secara lebih luas, sebab kutipannya berasal dari Mazmur 82:6; 'Taurat' mempertahankan sebutan tradisional tanpa membatasinya hanya pada Pentateukh dalam konteks ini.
- source_word: Ἐγὼ εἶπα
  choice: Aku telah berfirman
  rationale: Dalam kutipan Mazmur, penuturnya adalah Allah; 'berfirman' alami untuk ucapan ilahi, sedangkan 'telah' menyampaikan tindakan lampau tanpa menambahkan penekanan yang tidak perlu.
- source_word: Θεοί ἐστε
  choice: Kamu adalah allah-allah
  rationale: Menerjemahkan nomina jamak dan kopula secara langsung, tanpa menambahkan 'disebut' atau menentukan identitas para pihak yang disapa.
theological_decisions:
- issue: Makna θεοί dalam kutipan Mazmur 82:6
  choice: allah-allah
  alternative: makhluk-makhluk ilahi
  rationale: Padanan langsung mempertahankan daya retoris kutipan serta ketegangan penafsirannya. Alternatif yang lebih interpretatif dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
- issue: Cakupan νόμος ketika kutipan berasal dari Mazmur
  choice: Tauratmu
  alternative: Kitab Sucimu
  rationale: Terjemahan mempertahankan istilah νόμος yang dipakai Yesus, meskipun dalam konteks ini cakupannya meliputi Mazmur dan dengan demikian lebih luas daripada lima kitab Musa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Bukankah' menjaga bentuk pertanyaan retoris; 'Tauratmu' mempertahankan istilah sumber; 'allah-allah' ditulis dengan huruf kecil dan bentuk ulang untuk menyatakan jamak secara jelas.
