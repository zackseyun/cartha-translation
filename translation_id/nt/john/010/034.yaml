  - severity: low
    issue: ‘Tauratmu’ tidak secara eksplisit menyatakan bentuk jamak ὑμῶν.
    rationale: Yesus berbicara kepada lebih dari satu orang. ‘Taurat kalian’ menyampaikan sapaan jamak secara jelas dalam bahasa Indonesia modern.
