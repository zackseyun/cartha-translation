  source_fidelity: 'Teks Yunani diterjemahkan dengan tepat dalam struktur utamanya: pertanyaan retoris, acuan kepada ‘Taurat,’ dan kutipan ‘Aku berkata: Kamu adalah allah-allah.’ Namun, ‘berfirman’ menambahkan register khusus ucapan ilahi yang tidak terkandung secara leksikal dalam εἶπα (‘berkata’), dan bentuk -mu tidak secara jelas menyatakan jamak ὑμῶν.'
  naturalness: Susunan kalimatnya sudah alami dan baku. ‘Taurat kalian’ lebih jelas untuk sapaan jamak modern, sedangkan ‘telah berkata’ tetap wajar dalam pengantar kutipan terdahulu.
  terminology: ‘Taurat’ mempertahankan νόμος sebagai sebutan Kitab Suci yang dipakai Yesus, tanpa menyelesaikan pertanyaan cakupannya. ‘Allah-allah’ dengan huruf kecil dan bentuk jamak mempertahankan θεοί. Penggantian ‘berfirman’ dengan ‘berkata’ menghindari penambahan nuansa teologis/register yang tidak eksplisit dalam teks Yunani.
  issues:
