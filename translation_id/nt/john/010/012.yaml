  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: id
  text: Orang upahan[a], yang bukan gembala dan yang domba-domba itu bukan miliknya sendiri, melihat serigala datang, lalu meninggalkan domba-domba itu dan melarikan diri—serigala itu menyambar mereka dan mencerai-beraikan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menelantarkan domba-domba itu.” Kata yang diterjemahkan “meninggalkan” dapat mengandung arti yang lebih kuat, yakni meninggalkan domba-domba itu ketika mereka berada dalam bahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: orang upahan
  rationale: Menunjuk kepada orang yang bekerja demi upah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan gembala.
- source_word: οὐκ ὢν ποιμήν
  choice: yang bukan gembala
  rationale: Konstruksi partisipial dialihkan menjadi klausa relatif yang jelas tanpa mengubah penegasan bahwa ia bukan gembala.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: dan bukan pemilik domba-domba itu
  rationale: Menyatakan bahwa domba-domba tersebut bukan miliknya sendiri. Bentuk ini lebih alami daripada susunan harfiah dan tetap menjaga gagasan kepemilikan.
- source_word: θεωρεῖ
  choice: melihat
  rationale: Dalam konteks ini menyatakan bahwa ia melihat bahaya yang mendekat; padanan sederhana ini tidak menambahkan nuansa yang tidak pasti.
- source_word: τὸν λύκον ἐρχόμενον
  choice: serigala datang
  rationale: Mempertahankan gerak yang sedang mendekat dalam bentuk Indonesia yang ringkas dan wajar.
- source_word: ἀφίησιν
  choice: meninggalkan
  rationale: Padanan langsung yang dalam konteks bahaya dapat mengandung arti menelantarkan; nuansa yang lebih kuat dicatat dalam catatan kaki.
- source_word: φεύγει
  choice: melarikan diri
  rationale: Secara jelas menyatakan tindakan lari untuk menghindari bahaya dan sesuai dengan register naratif modern.
- source_word: ἁρπάζει
  choice: menerkam
  rationale: Dalam konteks serigala yang menyerang domba, kata ini secara alami menyampaikan tindakan menangkap dengan keras, tanpa menentukan secara eksplisit apakah domba itu dibawa pergi atau dibunuh.
- source_word: σκορπίζει
  choice: mencerai-beraikan mereka
  rationale: Menyampaikan akibat serangan terhadap domba-domba; pronomina 'mereka' membuat objek tersirat menjadi jelas dan alami.
- source_word: πρόβατα
  choice: domba-domba
  rationale: Mempertahankan bentuk konkret jamak dan citra pastoral, bukan menggantinya dengan istilah kolektif 'kawanan'.
theological_decisions:
- issue: Daya metaforis gambaran gembala
  choice: Mempertahankan istilah pastoral harfiah 'gembala', 'orang upahan', 'domba-domba', dan 'serigala' di dalam metafora.
  alternative: Mengganti istilah-istilah itu dengan bahasa tafsiran seperti 'pemimpin', 'pengasuh', atau 'musuh'.
  rationale: Yohanes 10 membangun metafora pastoral yang berkelanjutan. Bahasa tafsiran akan mempersempit atau menetapkan rujukan yang tidak dijelaskan dalam ayat ini.
- issue: Nuansa ἀφίησιν
  choice: Menggunakan 'meninggalkan' dalam teks dan mencatat kemungkinan nuansa 'menelantarkan' dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai 'menelantarkan'.
  rationale: Konteks mendukung tindakan meninggalkan secara tercela, tetapi kata sumber memiliki rentang makna yang lebih luas. Catatan kaki menjaga ketegangan leksikal tanpa melemahkan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Tanda pisah Yunani diwujudkan sebagai pemisahan kalimat agar alur tindakan mudah dipahami; partikel 'pun' mempertahankan hubungan akibat yang hidup antara pelarian orang upahan dan serangan serigala.
