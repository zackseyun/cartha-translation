  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: id
  text: Akulah pintu.[a] Jika seseorang masuk melalui Aku, ia akan diselamatkan; ia akan masuk dan keluar serta menemukan padang rumput.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gerbang.” Kata Yunani ini dapat menunjuk pada pintu atau gerbang; “pintu” dipakai dalam teks utama sebagai padanan leksikal yang lebih langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: pintu
  rationale: Kata θύρα pada dasarnya menunjuk pada pintu atau jalan masuk. Dalam gambaran kawanan domba, “gerbang” juga mungkin, tetapi “pintu” merupakan padanan langsung yang alami dan mempertahankan bentuk metafora Yohanes.
- source_word: δι’ ἐμοῦ
  choice: melalui Aku
  rationale: διά dengan bentuk genitif menyatakan sarana atau perantaraan. “Melalui Aku” secara jelas dan alami menyatakan bahwa Yesus adalah jalan masuk.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Jika siapa pun masuk
  rationale: Konstruksi ἐάν dengan subjungtif aoristus menyatakan syarat umum, sedangkan τις mencakup siapa saja tanpa pembatasan.
- source_word: σωθήσεται
  choice: ia akan diselamatkan
  rationale: Pilihan ini mempertahankan keluasan makna keselamatan dalam Injil Yohanes tanpa membatasinya hanya pada keselamatan fisik atau mempersempitnya menjadi rumusan teologis tertentu.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: Ia akan masuk dan keluar
  rationale: Terjemahan ini mempertahankan pasangan gerak dalam teks Yunani tanpa menambahkan tafsiran tentang kebebasan atau keamanan.
- source_word: νομὴν
  choice: padang rumput
  rationale: νομή berarti tempat merumput atau padang penggembalaan. “Padang rumput” jelas dan sesuai dengan gambaran domba dalam konteksnya.
- source_word: εὑρήσει
  choice: menemukan
  rationale: Padanan langsung bagi εὑρίσκω yang mempertahankan pernyataan sederhana dalam teks sumber.
theological_decisions:
- issue: Metafora θύρα dalam konteks penggembalaan
  choice: pintu
  alternative: gerbang
  rationale: “Pintu” mempertahankan padanan leksikal langsung dan rumusan metaforis “Akulah pintu,” sementara “gerbang” tetap merupakan kemungkinan kontekstual yang dicatat dalam catatan kaki.
- issue: Cakupan makna σωθήσεται
  choice: akan diselamatkan
  alternative: akan dilepaskan atau ditolong
  rationale: “Diselamatkan” menjaga keluasan teologis kata tersebut sekaligus membiarkan gambaran keamanan kawanan domba tetap hadir, tanpa mereduksinya menjadi pertolongan fisik semata atau mempersempitnya menjadi formulasi doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Akulah” mempertahankan penekanan ἐγώ εἰμι secara alami. “Ia” dipakai sebagai pronomina tunggal generik, dan dua kalimat setelah syarat membuat rangkaian janji tetap jelas tanpa mengubah hubungan antarklausa.
