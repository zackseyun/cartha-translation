id: JHN.10.39
reference: John 10:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: id
  text: Karena itu, mereka kembali berusaha menangkap Dia, tetapi Dia lolos dari tangan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “keluar dari tangan mereka.” Ungkapan “dari tangan” dapat berarti dari kuasa atau cengkeraman mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: berusaha
  rationale: Bentuk imperfek menggambarkan upaya yang sedang atau berulang dilakukan; dalam konstruksi dengan infinitif, “berusaha” menyampaikan tindakan yang dicoba tetapi tidak berhasil.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai perkembangan yang timbul dari pernyataan Yesus dan tanggapan para lawan-Nya dalam ayat sebelumnya.
- source_word: πάλιν
  choice: kembali
  rationale: Menyatakan pengulangan upaya mereka untuk menangkap Yesus.
- source_word: πιάσαι
  choice: menangkap
  rationale: Menyampaikan tindakan merenggut atau menahan Yesus dengan maksud menguasai-Nya, tanpa harus menambahkan nuansa proses hukum resmi.
- source_word: ἐξῆλθεν
  choice: lolos
  rationale: Secara leksikal berarti “keluar”, tetapi bersama ungkapan “dari tangan mereka” hasil tindakannya adalah terlepas dari kuasa atau cengkeraman mereka; “lolos” merupakan padanan Indonesia yang alami.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: dari tangan mereka
  rationale: Mempertahankan citra ungkapan Yunani sedekat mungkin dalam bahasa Indonesia; “tangan” di sini menunjuk pada kuasa atau penguasaan.
theological_decisions:
- issue: Apakah cara Yesus terlepas perlu dibuat lebih eksplisit
  choice: Dia lolos dari tangan mereka
  alternative: Dia keluar dari tangan mereka; Dia melepaskan diri dari cengkeraman mereka
  rationale: Teks menyatakan hasilnya tanpa menjelaskan cara Yesus terlepas. “Lolos” menyampaikan hasil secara alami tanpa menambahkan bahwa Ia menyelinap, memakai kekuatan, atau mengalami pembebasan secara ajaib.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan mudah dipahami. “Karena itu” mempertahankan hubungan wacana, sedangkan “kembali berusaha menangkap” menyampaikan pengulangan serta aspek upaya dalam bentuk imperfek Yunani.
