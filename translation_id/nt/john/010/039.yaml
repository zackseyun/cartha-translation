  source_fidelity: Teks Indonesia dengan tepat menyampaikan ἐζήτουν ... πιάσαι sebagai “kembali berusaha menangkap,” mempertahankan unsur upaya yang belum berhasil dan pengulangan. “Karena itu” cukup mewakili οὖν dalam konteks ini. “Dia lolos dari tangan mereka” merupakan padanan idiomatis yang setia bagi ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν tanpa menetapkan cara Yesus terlepas.
  naturalness: Kalimatnya baku, jelas, dan alami dalam bahasa Indonesia modern. Urutan “Karena itu, mereka kembali berusaha menangkap Dia, tetapi Dia lolos dari tangan mereka” mengalir baik serta mempertahankan kontras naratifnya.
  terminology: “Menangkap” tepat untuk πιάσαι dan tidak secara tidak perlu memaksakan nuansa hukum formal. “Tangan mereka” dipertahankan dalam teks, sementara catatan kaki dengan benar menjelaskan nilai idiomatiknya sebagai kuasa atau cengkeraman. Kapitalisasi “Dia” konsisten dengan register Alkitab Indonesia dan tidak mengubah makna.
