id: JHN.10.29
reference: John 10:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: id
  text: Bapa-Ku[a], yang telah memberikan mereka kepada-Ku, lebih besar daripada segala-galanya, dan tidak seorang pun dapat merenggut mereka dari tangan Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Bapa-Ku, apa yang telah diberikan-Nya kepada-Ku, lebih besar daripada segala-galanya.” Susunan bahasa Yunani di sini sulit, dan sebagian orang memahami pemberian itu sendiri, bukan orang-orang yang diberikan, sebagai pokok perbandingan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Bapa-Ku
  rationale: Ungkapan posesif yang wajar dan khas dalam bahasa Indonesia, dengan tetap mempertahankan hubungan Yesus sebagai Anak dengan Allah.
- source_word: ὃ δέδωκέν μοι
  choice: yang telah memberikan mereka kepada-Ku
  rationale: Bentuk relatif netral tunggal ὃ sulit secara tekstual dan sintaksis serta dapat dipahami secara kolektif. Dalam konteks domba-domba pada ayat 27–28, terjemahan ini menjadikan acuan personalnya jelas; bentuk perfektum diterjemahkan dengan 'telah memberikan' untuk menyampaikan tindakan yang hasilnya tetap berlaku.
- source_word: πάντων μεῖζων
  choice: lebih besar daripada semua
  rationale: Mempertahankan luasnya perbandingan tanpa membatasi πάντων secara khusus kepada semua orang atau segala sesuatu.
- source_word: οὐδεὶς δύναται
  choice: tidak seorang pun dapat
  rationale: Padanan Indonesia yang alami dan tepat untuk menyatakan ketidakmampuan.
- source_word: ἁρπάζειν
  choice: merenggut
  rationale: Menyampaikan tindakan mengambil secara paksa dan selaras dengan gambaran perlindungan dalam konteks langsung.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: dari tangan Bapa
  rationale: Mempertahankan metafora tangan sebagai kuasa dan perlindungan; 'dari' merupakan bentuk Indonesia yang alami untuk pelepasan paksa dari genggaman atau kuasa seseorang.
theological_decisions:
- issue: Kesulitan tekstual dan sintaksis dalam ὃ δέδωκέν μοι
  choice: 'Menerjemahkan klausa sesuai acuan kontekstual kepada domba-domba: ''yang telah memberikan mereka kepada-Ku''.'
  alternative: 'Bapa-Ku, apa yang telah diberikan-Nya kepada-Ku, lebih besar daripada semua; atau: Apa yang telah diberikan Bapa-Ku kepada-Ku lebih besar daripada semua.'
  rationale: Teks Yunani tercetak sulit secara sintaksis dan tradisi manuskripnya bervariasi. Konteks membahas domba-domba yang diberikan Bapa kepada Anak, tetapi kemungkinan bahwa pemberian itu sendiri menjadi subjek perbandingan tetap nyata dan karena itu dicatat dalam catatan kaki.
- issue: Cakupan perbandingan πάντων μεῖζων
  choice: lebih besar daripada semua
  alternative: lebih besar daripada semua orang; lebih besar daripada segala sesuatu
  rationale: Ungkapan luas ini tidak memaksakan apakah πάντων terutama merujuk kepada pribadi atau segala sesuatu, sehingga ambiguitas sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Kapitalisasi pada sebutan dan pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia; struktur kalimat dibuat alami tanpa menghapus kesulitan asli, yang dipertahankan melalui catatan kaki.
