  text: I and the Father are one[a].
translation:
  language: id
  text: Aku dan Bapa adalah satu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “satu” berjenis netral. Kata itu menegaskan kesatuan tanpa menyatakan bahwa Yesus dan Bapa adalah satu pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina orang pertama tunggal ini dinyatakan secara eksplisit dalam bahasa Yunani. Dalam tuturan langsung Yesus, “Aku” alami, jelas, dan mempertahankan penekanan pada subjek.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan kedua subjek tanpa menambahkan makna lain.
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Dengan artikel dan dalam pemakaian khas Injil Yohanes, istilah ini menunjuk kepada Bapa Yesus sebagai sebutan personal-ilahi; huruf kapital menandai fungsi tersebut.
- source_word: ἕν
  choice: satu
  rationale: Bentuk netral tunggal menyatakan kesatuan atau keesaan tanpa menyebut Yesus dan Bapa sebagai satu pribadi. “Satu” merupakan padanan langsung yang tetap mempertahankan keluasan makna aslinya.
- source_word: ἐσμεν
  choice: adalah
  rationale: Bentuk kini orang pertama jamak dari verba 'ada/menjadi'. Kopula bahasa Indonesia tidak menandai jumlah, tetapi dua subjek yang dihubungkan oleh “dan” tetap menyatakan pembedaan antara “Aku” dan “Bapa”.
theological_decisions:
- issue: Makna ἕν yang berjenis netral bersama ἐσμεν yang berbentuk jamak dalam pernyataan kristologis
  choice: 'Ayat diterjemahkan sebagai penegasan kesatuan nyata antara Yesus dan Bapa sambil tetap membedakan keduanya: “Aku dan Bapa adalah satu.”'
  alternative: “Aku dan Bapa adalah satu hal” atau “Aku dan Bapa berada dalam kesatuan.”
  rationale: '“Satu” mempertahankan ketegangan gramatikal dan teologis teks: bentuk netral tidak menyamakan Yesus dan Bapa sebagai satu pribadi, sedangkan bentuk verba jamak dalam bahasa Yunani tetap membedakan mereka. Terjemahan tidak memperlemah pernyataan menjadi sekadar kesepakatan dan tidak memasukkan rumusan kredal yang lebih kemudian.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Aku” dipakai karena ini tuturan langsung Yesus, sedangkan “Bapa” dipertahankan sebagai sebutan khas dalam Injil Yohanes. Susunan sederhana mengikuti kepadatan teks Yunani.
