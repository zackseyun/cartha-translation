  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: id
  text: Aku juga mempunyai domba-domba lain yang bukan dari kandang ini. Mereka juga harus Kubawa, dan mereka akan mendengarkan suara-Ku.[a] Maka akan ada satu kawanan,[b] satu gembala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka akan mendengar suara-Ku.” Kata kerja Yunani dapat berarti “mendengar” atau “mendengarkan”; dalam konteks ini kemungkinan mencakup tindakan mendengar yang disertai tanggapan.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani membedakan “kandang” (αὐλή, tempat berpagar) dari “kawanan” (ποίμνη, kelompok domba). Karena itu, frasa terakhir bukan “satu kandang”, melainkan “satu kawanan”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: domba-domba lain
  rationale: πρόβατα adalah istilah umum untuk domba, bukan khusus anak domba; ἄλλα menunjukkan domba lain di samping yang sedang dibicarakan.
- source_word: αὐλή
  choice: kandang
  rationale: Dalam gambaran penggembalaan ini, αὐλή menunjuk pada tempat berpagar untuk domba. 'Kandang' alami dalam bahasa Indonesia dan tetap berbeda dari 'kawanan' pada akhir ayat.
- source_word: κἀκεῖνα
  choice: mereka juga
  rationale: Kata ganti ini merujuk kembali kepada domba-domba lain. Bahasa Indonesia secara alami memakai 'mereka juga' untuk hewan yang diperlakukan sebagai anggota kawanan dalam metafora ini.
- source_word: δεῖ με ἀγαγεῖν
  choice: harus Kubawa
  rationale: δεῖ menyatakan keharusan, sedangkan ἀγαγεῖν dapat berarti membawa atau menuntun. 'Harus Kubawa' mempertahankan daya keharusan dan susunan yang alami tanpa menjelaskan sumber keharusan itu.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: mereka akan mendengarkan suara-Ku
  rationale: ἀκούω dapat berarti mendengar atau mendengarkan. Dalam konteks gambaran gembala Yohanes, 'mendengarkan' dapat mencakup perhatian dan tanggapan, tetapi alternatif 'mendengar' tetap dicatat karena ambiguitas leksikalnya nyata.
- source_word: γενήσονται
  choice: akan ada
  rationale: γίνομαι di sini menggambarkan keadaan yang akan terwujud. 'Akan ada' alami dalam bahasa Indonesia dan mempertahankan orientasi masa depan.
- source_word: μία ποίμνη
  choice: satu kawanan
  rationale: ποίμνη adalah kawanan domba, bukan kandang. 'Satu kawanan' mempertahankan perbedaan penting dengan αὐλή.
- source_word: εἷς ποιμήν
  choice: satu gembala
  rationale: ποιμήν berarti gembala, dan ungkapan yang lugas mempertahankan gambaran utama ayat.
theological_decisions:
- issue: Pembedaan αὐλή dan ποίμνη
  choice: kandang ini ... satu kawanan
  alternative: kandang ini ... satu kandang
  rationale: 'Teks Yunani memakai dua kata benda berbeda: αὐλή untuk tempat berpagar dan ποίμνη untuk kelompok domba. Menerjemahkan keduanya sebagai ''kandang'' menghapus perbedaan sumber dan dapat menggeser penekanan dari kawanan yang dipersatukan di bawah satu gembala kepada satu tempat atau lembaga.'
- issue: Daya δεῖ
  choice: harus Kubawa
  alternative: perlu Kubawa
  rationale: δεῖ menyatakan keharusan yang kuat dan dalam Injil Yohanes dapat memiliki bobot teologis. 'Harus' mempertahankan daya itu tanpa menentukan atau menjelaskan secara denominatif sumber keharusan tersebut.
- issue: Hubungan klausa terakhir
  choice: Maka akan ada satu kawanan, satu gembala
  alternative: dan mereka akan menjadi satu kawanan, dengan satu gembala
  rationale: γενήσονται dapat diterjemahkan 'mereka akan menjadi' atau secara idiomatis 'akan ada'. Pilihan ini menyatakan hasil yang akan terwujud tanpa menambahkan kata penghubung atau penjelasan teologis yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Bentuk terikat 'Kubawa' dan 'suara-Ku' mengikuti kaidah penulisan kata ganti ilahi dalam tradisi penerjemahan Alkitab Indonesia tanpa menambah penafsiran. Istilah 'kandang' dan 'kawanan' sengaja dibedakan.
