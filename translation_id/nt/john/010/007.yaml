  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: id
  text: 'Maka Yesus berkata lagi kepada mereka, “Sesungguhnya, sesungguhnya Aku berkata kepada kalian: Akulah pintu bagi domba-domba.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Akulah pintu gerbang bagi domba-domba.” Secara harfiah, “pintu domba-domba.” Kata Yunani θύρα dapat berarti “pintu” atau “pintu gerbang,” khususnya dalam gambaran penggembalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat naratif sekaligus menyimpulkan tanggapan Yesus terhadap ketidakmengertian pada ayat sebelumnya.
- source_word: πάλιν
  choice: lagi
  rationale: Secara langsung dan wajar menyatakan bahwa Yesus kembali berbicara.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan dan tekanan khidmat formula khas Injil Yohanes dalam bahasa Indonesia yang jelas.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Terjemahan dekat dan bermartabat dari formula ujaran; bentuk -mu dapat dipahami secara kolektif sesuai rujukan jamak Yunani.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι memperkenalkan isi pernyataan; tanda titik dua mengungkapkan fungsi itu secara alami tanpa memerlukan kata 'bahwa'.
- source_word: ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini mengungkapkan penegasan pada kata ganti ἐγώ secara alami dalam bahasa Indonesia.
- source_word: ἡ θύρα
  choice: pintu
  rationale: Padanan leksikal langsung yang tetap alami; dalam gambaran kandang domba kata ini juga dapat berarti pintu gerbang.
- source_word: τῶν προβάτων
  choice: bagi domba-domba itu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan hubungan Yesus sebagai jalan masuk bagi domba-domba, sambil tidak mengembangkan metafora menjadi penjelasan doktrinal.
theological_decisions:
- issue: Identifikasi diri metaforis dalam perkataan 'Akulah'
  choice: Akulah pintu bagi domba-domba itu
  alternative: Akulah pintu domba-domba itu / Akulah pintu gerbang bagi domba-domba itu
  rationale: Terjemahan mempertahankan metafora akses dalam gambaran penggembalaan tanpa menjabarkannya sebagai rumusan doktrinal. 'Pintu' dekat dengan θύρα, sedangkan kemungkinan 'pintu gerbang' dicatat sebagai alternatif kontekstual.
- issue: Hubungan genitif τῶν προβάτων
  choice: bagi domba-domba itu
  alternative: 'domba-domba itu (secara harfiah: ''pintu domba-domba itu'')'
  rationale: Genitif Yunani memungkinkan hubungan kepunyaan atau asosiasi. 'Bagi' menghasilkan bahasa Indonesia yang alami dalam konteks, tetapi hubungan yang lebih formal tidak ditutup dan disebutkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Pengulangan formula pembuka dipertahankan. Huruf kapital pada 'Aku/Akulah' mengikuti konvensi penghormatan bahasa Indonesia tanpa menambahkan isi doktrinal.
