  rationale: Revisi menyatakan bentuk jamak ὑμῖν secara eksplisit, menghilangkan demonstratif yang tidak diperlukan pada τῶν προβάτων, dan merapikan catatan leksikal. Pilihan “bagi domba-domba” tetap merupakan padanan Indonesia yang alami bagi hubungan genitif yang secara konteks bersifat asosiatif dan tidak memaksakan penafsiran teologis.
