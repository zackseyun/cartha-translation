  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: id
  text: Banyak orang datang kepada-Nya dan berkata, “Yohanes memang tidak mengadakan satu tanda pun,[a] tetapi semua yang dikatakan Yohanes tentang orang ini[b] adalah benar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak melakukan satu tanda pun.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tentang Dia.” Secara harfiah, bahasa Yunani berbunyi “tentang orang ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva jamak ini dipakai secara substantival; penambahan 'orang' diperlukan agar wajar dan jelas dalam bahasa Indonesia.
- source_word: ἦλθον πρὸς αὐτόν
  choice: datang kepada-Nya
  rationale: Ungkapan ini menyatakan gerak menuju seseorang; 'datang kepada-Nya' alami dalam sudut pandang narasi.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang berlangsung atau berulang, tetapi bahasa Indonesia tidak wajib menandai aspek itu secara eksplisit; 'berkata' paling alami tanpa menambahkan frekuensi yang tidak pasti.
- source_word: σημεῖον
  choice: tanda
  rationale: Dalam Injil Yohanes istilah ini menunjuk pada perbuatan yang menandakan kenyataan lebih jauh, sehingga 'tanda' mempertahankan muatan khasnya dibanding 'mukjizat'.
- source_word: ἐποίησεν οὐδέν
  choice: tidak mengadakan satu tanda pun
  rationale: '''Mengadakan'' merupakan padanan Indonesia yang alami bagi melakukan suatu tanda, sedangkan ''satu ... pun'' mempertahankan penyangkalan menyeluruh οὐδέν.'
- source_word: πάντα δὲ ὅσα
  choice: tetapi semua yang
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh konstruksi Yunani dengan susunan yang ringkas dan alami.
- source_word: περὶ τούτου
  choice: tentang orang ini
  rationale: Kata penunjuk τούτου merujuk kepada Yesus dan secara harfiah memiliki daya 'ini'; 'orang ini' menjaga daya demonstratif tanpa sekadar menggantinya dengan pronomina.
- source_word: ἀληθῆ ἦν
  choice: adalah benar
  rationale: Padanan ini secara langsung menyatakan bahwa seluruh perkataan Yohanes itu benar tanpa menambahkan gagasan bahwa kebenarannya baru kemudian terbukti.
theological_decisions:
- issue: Istilah σημεῖον dalam Injil Yohanes
  choice: tanda
  alternative: mukjizat
  rationale: Pemakaian 'tanda' mempertahankan istilah tematis Yohanes, yakni perbuatan yang menunjuk melampaui dirinya sendiri, dan tidak mereduksinya menjadi sekadar kejadian ajaib.
- issue: Daya demonstratif περὶ τούτου
  choice: tentang orang ini
  alternative: tentang Dia
  rationale: Pilihan ini mempertahankan unsur demonstratif τούτου dan cara orang banyak menunjuk kepada Yesus, tanpa mengubahnya menjadi pronomina biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang sederhana dan bermartabat. Kapitalisasi pronomina bagi Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia; ucapan langsung dibuat alami tanpa menghilangkan kontras μὲν ... δέ ('memang ... tetapi').
