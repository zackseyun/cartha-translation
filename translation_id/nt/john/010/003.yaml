  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: id
  text: Penjaga pintu membukakan pintu baginya, dan domba-domba mendengar suaranya. Ia memanggil domba-dombanya sendiri menurut nama, lalu menuntun mereka keluar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa mereka keluar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: baginya
  rationale: Bentuk datif ini menunjuk kembali kepada sosok gembala dalam ayat sebelumnya; “baginya” alami dalam bahasa Indonesia dan mempertahankan rujukan pribadi.
- source_word: ὁ θυρωρός
  choice: penjaga pintu
  rationale: Menunjuk kepada orang yang menjaga dan membuka jalan masuk ke kandang; ungkapan ini jelas dan wajar dalam konteks tersebut.
- source_word: ἀνοίγει
  choice: membukakan pintu
  rationale: Objek pintu tersirat dari konteks dan dari peran penjaga pintu; verba benefaktif “membukakan” secara alami menyatakan bahwa pintu dibuka bagi gembala.
- source_word: τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει
  choice: domba-domba mendengarkan suaranya
  rationale: Subjek netral jamak Yunani memakai verba tunggal tetapi bermakna jamak. Dalam konteks ini ἀκούω dengan genitif menyiratkan mendengar serta memberi respons atau mengindahkan, yang dapat disampaikan dengan “mendengarkan”.
- source_word: τὰ ἴδια πρόβατα
  choice: domba-dombanya sendiri
  rationale: ἴδια menekankan bahwa domba-domba itu adalah miliknya sendiri dan memiliki relasi khusus dengannya.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: memanggil ... menurut nama masing-masing
  rationale: Ungkapan ini berarti memanggil setiap domba secara individual berdasarkan namanya; pilihan ini mempertahankan unsur distributif yang dapat tersirat dalam κατ’ ὄνομα.
- source_word: ἐξάγει αὐτά
  choice: menuntun mereka keluar
  rationale: ἐξάγω dapat berarti membawa atau menuntun keluar. Dalam gambaran seorang gembala, “menuntun” paling tepat menyampaikan pengarahan pribadi.
theological_decisions:
- issue: Gambaran gembala dan pelaku tindakan
  choice: 'Tindakan tetap dikaitkan langsung dengan sosok gembala: penjaga pintu membukakan pintu baginya, domba-domba mendengarkan suaranya, dan ia memanggil serta menuntun mereka.'
  alternative: Menyebut sosok itu secara eksplisit sebagai Yesus atau menafsirkan setiap unsur perumpamaan di dalam ayat.
  rationale: Teks Yunani mempertahankan gambaran metaforis dan tidak menyebut Yesus secara eksplisit dalam ayat ini; terjemahan tidak boleh mendahului penjelasan konteks atau menyelesaikan metafora secara doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “pintu” dan “domba-domba” dipertahankan demi kejelasan gambaran, sedangkan struktur kalimat dibagi dua agar mudah dipahami tanpa mengubah urutan tindakan.
