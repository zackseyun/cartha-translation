    issue: “mendengarkan suaranya” untuk τῆς φωνῆς αὐτοῦ ἀκούει
    rationale: ἀκούω dengan genitif secara langsung berarti “mendengar.” “Mendengarkan” dapat menyiratkan tindakan menyimak secara sengaja dan sedikit melampaui pernyataan leksikal dasar.
  - severity: low
    issue: “menurut nama masing-masing”
    rationale: Frasa ini dapat dipahami, tetapi “menurut nama” lebih alami dalam bahasa Indonesia dan cukup menyampaikan pemanggilan secara individual yang dimaksud oleh κατ’ ὄνομα.
