  rationale: Revisi membatasi terjemahan pada makna langsung ἀκούω sebagai “mendengar” dan memperhalus ungkapan pemanggilan individual tanpa mengubah gambaran, pelaku, urutan tindakan, atau ambiguitas metaforis teks sumber.
