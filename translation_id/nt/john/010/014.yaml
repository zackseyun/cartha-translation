  terminology: “Gembala yang baik” tepat untuk ὁ ποιμὴν ὁ καλός dan menghindari asosiasi jabatan gerejawi dari “pastor.” “Mengenal” tepat bagi γινώσκω dalam relasi timbal balik. Kapitalisasi Aku/-Ku dapat dipertahankan sesuai konvensi penghormatan yang digunakan draf.
