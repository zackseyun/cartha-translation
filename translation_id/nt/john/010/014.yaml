base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: id
  text: Akulah gembala yang baik, dan Aku mengenal mereka yang menjadi milik-Ku, dan mereka yang menjadi milik-Ku mengenal Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “domba-domba-Ku.” Secara harfiah, teks Yunani memakai ungkapan netral jamak yang berarti “milik-Ku” dalam kedua klausa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini menyampaikan identifikasi diri dalam kala kini sekaligus penekanan dari pronomina ἐγώ yang dinyatakan secara eksplisit, dengan ungkapan Indonesia yang alami dan ringkas.
- source_word: ποιμὴν
  choice: gembala
  rationale: Makna lazimnya adalah penjaga kawanan domba. “Gembala” mempertahankan gambaran konkret dalam wacana ini tanpa memasukkan pengertian jabatan gerejawi yang dapat melekat pada “pastor”.
- source_word: καλός
  choice: yang baik
  rationale: Dalam konteks ini, καλός menyatakan kebaikan, keluhuran, dan kesesuaian yang patut diteladani. “Yang baik” alami dalam bahasa Indonesia dan tidak mempersempit nuansanya menjadi sekadar “mulia” atau “ideal”.
- source_word: γινώσκω / γινώσκουσί
  choice: mengenal / mengenal
  rationale: Kata kerja ini mengungkapkan pengenalan yang bersifat pribadi dan relasional, bukan hanya pengetahuan tentang fakta. “Mengenal” juga mempertahankan sifat timbal balik kedua klausa.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: milik-Ku / milik-Ku
  rationale: Adjektiva posesif netral jamak ini secara harfiah berarti “milik-Ku” dan dalam konteks menunjuk kepada mereka yang menjadi kepunyaan sang gembala. Pilihan ini mempertahankan ungkapan ringkas serta ambiguitas gramatikal teks Yunani tanpa menambahkan kata “domba” ke dalam teks utama.
- source_word: καί
  choice: dan
  rationale: Konjungsi kedua diterjemahkan “dan” untuk mempertahankan hubungan koordinatif dan timbal balik antarklausa. Konjungsi pertama disampaikan melalui kelanjutan kalimat setelah tanda titik agar susunannya tetap alami dalam bahasa Indonesia tanpa mengubah hubungan gagasan.
theological_decisions:
- issue: Mengungkapkan hubungan timbal balik antara Yesus dan mereka yang menjadi milik-Nya tanpa memasukkan rumusan doktrinal yang lebih kemudian
  choice: milik-Ku
  alternative: domba-domba-Ku; orang-orang yang menjadi milik-Ku
  rationale: “Milik-Ku” mempertahankan bahasa kepunyaan dan pengenalan pribadi dalam teks Yunani. Pilihan ini tidak secara diam-diam memperjelas rujukannya menjadi “domba-domba-Ku,” meskipun konteks mendukung pemahaman tersebut, dan tidak memperluas bentuk ringkas Yunani menjadi “orang-orang yang menjadi milik-Ku.”
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Akulah” mempertahankan penekanan identifikasi diri, sedangkan “milik-Ku” sengaja dipertahankan dalam kedua klausa untuk mencerminkan kesejajaran teks sumber. Tanda titik setelah klausa pembuka menghindari rangkaian “dan” yang kaku tanpa menghilangkan perkembangan gagasan Yunani.
