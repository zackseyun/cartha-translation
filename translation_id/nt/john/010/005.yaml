id: JHN.10.5
reference: John 10:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: id
  text: Namun, mereka sama sekali tidak akan mengikuti orang asing[a]. Sebaliknya, mereka akan lari menjauhinya, karena mereka tidak mengenal suara[b] orang-orang asing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “tidak akan pernah mengikuti orang asing.” Bahasa Yunani memakai penyangkalan yang tegas (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: “Mengenal suara” juga dapat dipahami sebagai “mengenali suara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: orang asing
  rationale: Dalam metafora gembala dan domba, istilah ini menunjuk kepada orang yang tidak dikenal atau bukan milik kawanan, bukan terutama kepada orang dari bangsa lain.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: sama sekali tidak akan mengikuti
  rationale: Gabungan οὐ μή dengan bentuk futur menyatakan penyangkalan yang tegas; ungkapan ini mempertahankan penekanan tersebut dalam bahasa Indonesia modern.
- source_word: ἀκολουθήσουσιν
  choice: akan mengikuti
  rationale: Dalam konteks domba dan gembala, 'mengikuti' merupakan padanan yang langsung dan alami.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: akan lari menjauhinya
  rationale: Kata φεύγω dengan ἀπό menyatakan tindakan melarikan diri atau menjauh dari seseorang; pilihan ini terdengar alami sekaligus mempertahankan kuatnya tindakan penghindaran.
- source_word: οἴδασι
  choice: mengenal
  rationale: οἶδα dapat berarti mengetahui, mengenal, atau mengenali. 'Mengenal suara' mempertahankan nuansa pengetahuan yang akrab tanpa menutup kemungkinan makna 'mengenali'.
- source_word: τῶν ἀλλοτρίων
  choice: orang-orang asing
  rationale: Bentuk genitif jamak menunjuk kepada golongan orang asing secara umum dan dibedakan dari bentuk tunggal sebelumnya.
- source_word: φωνήν
  choice: suara
  rationale: φωνή di sini adalah suara atau panggilan yang dapat dibedakan oleh domba; 'suara' mempertahankan dimensi harfiah dan relasional.
- source_word: δὲ ... ἀλλὰ
  choice: Namun ... Sebaliknya
  rationale: Pasangan penghubung ini menandai pertentangan antara tidak mengikuti dan justru melarikan diri.
theological_decisions:
- issue: Daya metaforis gambaran domba dan gembala
  choice: Mempertahankan metafora secara langsung tanpa menjelaskan siapa yang dilambangkan oleh 'orang asing'.
  alternative: Menerjemahkan 'orang asing' secara eksplisit sebagai guru palsu atau pemimpin yang tidak sah.
  rationale: Ayat ini tetap berbicara dalam metafora dan tidak mengidentifikasi rujukannya secara eksplisit; penjelasan demikian akan memasukkan tafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Sama sekali tidak akan' menyampaikan penyangkalan tegas tanpa gaya arkais. Kedua penanda catatan kaki ditempatkan pada unsur teks yang diterangkan.
