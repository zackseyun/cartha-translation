  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: id
  text: Apabila ia telah membawa ke luar semua miliknya[a], ia berjalan di depan mereka, dan domba-domba itu mengikutinya karena mereka mengenal suaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengusir ke luar” atau “menuntun ke luar”; kata kerja Yunani ini dapat mengandung arti menghalau atau membawa keluar dari suatu kandang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Setelah
  rationale: Dalam klausa waktu dengan aoristus subjungtif, ungkapan ini menunjuk pada tindakan yang selesai sebelum tindakan utama. “Setelah” paling alami dalam bahasa Indonesia, tanpa menghilangkan sifat umum adegan tersebut.
- source_word: τὰ ἴδια πάντα
  choice: semua miliknya
  rationale: Ungkapan netral jamak ini secara kontekstual menunjuk kepada semua domba kepunyaan gembala. “Semua miliknya” mempertahankan ungkapan Yunani tanpa mendahului penyebutan eksplisit “domba-domba” pada klausa berikutnya.
- source_word: ἐκβάλῃ
  choice: membawa ke luar
  rationale: Kata kerja ini dapat berarti mengusir atau mengeluarkan. Dalam konteks penggembalaan, “membawa ke luar” menyatakan gerakan dari dalam kandang tanpa memberi kesan keras yang tidak diwajibkan konteks.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: ia berjalan di depan mereka
  rationale: Terjemahan ini mempertahankan gambaran spasial tentang gembala yang bergerak mendahului kawanan dan terdengar alami dalam bahasa Indonesia.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: domba-domba itu mengikutinya
  rationale: “Domba-domba” adalah padanan lazim bagi πρόβατα, sedangkan objek datif dari ἀκολουθέω secara alami diterjemahkan dengan akhiran objek “-nya”.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: karena mereka mengenal suaranya
  rationale: ὅτι menyatakan alasan. Dalam konteks suara gembala, “mengenal” menyampaikan pengetahuan yang mencakup pengenalan, tanpa mengubahnya menjadi sekadar kemampuan mengenali bunyi.
theological_decisions:
- issue: Gambaran penggembalaan dan kekuatan makna ἐκβάλῃ
  choice: membawa ke luar
  alternative: mengusir ke luar; menuntun ke luar
  rationale: Konteks menggambarkan gembala bersama domba-domba miliknya, bukan pengusiran yang bermusuhan. Pilihan ini mempertahankan gerakan keluar dari kandang tanpa memasukkan gagasan paksaan secara teologis; catatan kaki tetap menunjukkan keluasan makna kata Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya sederhana dan bermartabat. “Ke luar” ditulis terpisah karena berfungsi sebagai keterangan arah. Pronomina “ia” dipakai untuk narasi, dan “miliknya” mempertahankan ungkapan sumber tanpa penambahan dini kata “domba”.
