  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: id
  text: sebab ia adalah seorang pekerja upahan dan tidak peduli terhadap domba-domba itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteksnya, kata ini menyatakan alasan pekerja upahan itu melarikan diri pada ayat sebelumnya. “Sebab” alami dalam bahasa Indonesia dan mempertahankan hubungan kausal tersebut.
- source_word: μισθωτός
  choice: seorang pekerja upahan
  rationale: Istilah ini menunjuk kepada orang yang bekerja demi upah, bukan pemilik domba. “Pekerja upahan” jelas, modern, dan tidak memuat nada kuno atau tafsiran tambahan.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: tidak peduli terhadap
  rationale: Konstruksi impersonal ini menyatakan tiadanya perhatian atau kepedulian. Ungkapan “tidak peduli terhadap” idiomatis dan tetap mempertahankan bobot moral pernyataan itu.
- source_word: τῶν προβάτων
  choice: domba-domba itu
  rationale: Bentuk jamak Yunani dipertahankan secara eksplisit sebagai “domba-domba,” sedangkan “itu” menandai kelompok domba yang telah disebut dalam konteks, tanpa menggantinya dengan istilah yang lebih interpretatif seperti “kawanan.”
theological_decisions:
- issue: Gambaran pekerja upahan sebagai lawan dari gembala yang baik
  choice: Menyampaikan alasan etis ayat ini secara langsung tanpa menentukan bahwa pekerja upahan melambangkan golongan tertentu.
  alternative: Menafsirkannya secara khusus sebagai golongan pemimpin palsu, atau melunakkan kontrasnya menjadi sekadar sikap profesional.
  rationale: Teks menyatakan bahwa ia pekerja upahan dan tidak memedulikan domba-domba itu. Terjemahan mempertahankan kontras dengan gembala yang baik, tetapi tidak menambahkan identitas simbolis yang tidak disebutkan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mengikuti hubungan alasan dalam bahasa Yunani sekaligus tetap alami bagi pembaca umum.
