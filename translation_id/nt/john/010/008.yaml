  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: id
  text: Semua orang yang datang sebelum Aku[a] adalah pencuri dan perampok, tetapi domba-domba itu tidak mendengarkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendahului Aku.” Ungkapan ini dapat dipahami secara waktu (“sebelum Aku”) atau dalam arti datang lebih dahulu sambil mengaku memiliki wewenang yang terlepas dari Yesus. Konteksnya mengarah kepada gembala-gembala palsu, bukan kepada semua hamba Allah yang hidup sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Semua orang yang
  rationale: Ungkapan ini bersifat distributif dan mencakup seluruh kelompok yang dimaksud; bentuk ini alami dalam bahasa Indonesia dan mempertahankan cakupan luas teks Yunani.
- source_word: ἦλθον
  choice: datang
  rationale: Aoristus indikatif menyatakan tindakan lampau; dalam konstruksi relatif bahasa Indonesia, 'yang datang' secara alami menyampaikan makna itu tanpa penandaan kala tambahan.
- source_word: πρὸ ἐμοῦ
  choice: sebelum Aku
  rationale: Ini merupakan padanan temporal yang paling langsung dan alami. Kemungkinan nuansa 'mendahului Aku' dipertahankan dalam catatan kaki.
- source_word: κλέπται
  choice: pencuri
  rationale: Padanan baku bagi κλέπτης dan sesuai dengan gambaran orang yang mengambil secara tidak sah dalam konteks ini.
- source_word: λῃσταί
  choice: perampok
  rationale: Menjaga pembedaan dari 'pencuri' dan dapat menyiratkan tindakan yang lebih terbuka, keras, atau ganas tanpa mempersempitnya menjadi istilah teknis.
- source_word: ἀλλ’
  choice: tetapi
  rationale: Kata hubung pertentangan yang langsung dan wajar dalam bahasa Indonesia modern.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: tidak mendengarkan mereka
  rationale: Dengan objek genitif, ἀκούω dapat berarti mendengar dengan tanggapan atau mengindahkan. 'Mendengarkan' sesuai dengan gambaran domba yang mengenali dan mengikuti suara.
- source_word: τὰ πρόβατα
  choice: domba-domba itu
  rationale: Bentuk ulang menandai jamak secara jelas, sedangkan 'itu' mempertahankan sifat definit dari artikelnya dan merujuk kepada domba-domba dalam perumpamaan yang sedang dibicarakan.
theological_decisions:
- issue: Cakupan dan daya ungkapan 'semua orang yang datang sebelum Aku'
  choice: Menerjemahkan secara langsung sebagai 'Semua orang yang datang sebelum Aku' tanpa membatasi kelompok itu dalam teks utama.
  alternative: Semua orang yang mendahului Aku; atau penjelasan eksplisit bahwa yang dimaksud ialah mereka yang mengaku berwenang sebagai gembala terlepas dari Yesus.
  rationale: Bentuk Yunani luas dan secara harfiah dapat dipahami secara temporal, tetapi konteks mengenai gembala palsu tidak mendukung anggapan bahwa Yesus sedang mengecam semua utusan Allah terdahulu. Ketegangan ini dipertahankan dalam teks utama dan dijelaskan secara hati-hati dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi 'Aku' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus. Pasangan 'pencuri dan perampok' mempertahankan dua istilah Yunani yang berbeda, dan penanda catatan kaki [a] ditempatkan langsung setelah pasangan tersebut.
