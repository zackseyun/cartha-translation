  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: id
  text: Yesus menyampaikan kiasan ini[a] kepada mereka, tetapi mereka tidak mengerti apa yang sedang Ia katakan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perumpamaan”, “gambaran”, atau “peribahasa”. Kata Yunani yang digunakan dapat menunjuk secara luas pada perkataan figuratif; di sini kata itu memperkenalkan uraian Yesus tentang gembala dalam bentuk yang tidak harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: kiasan
  rationale: Kata ini dapat menunjuk secara luas pada perkataan figuratif, perumpamaan terselubung, atau peribahasa. Dalam konteks ini, “kiasan” menyatakan sifat tidak harfiah dari uraian tentang gembala tanpa membatasinya pada kategori teknis tertentu.
- source_word: εἶπεν
  choice: menyampaikan
  rationale: Dengan objek berupa kiasan yang lebih panjang, “menyampaikan” terdengar alami dalam bahasa Indonesia dan tetap menyatakan tindakan Yesus berbicara kepada mereka.
- source_word: ἐκεῖνοι δὲ
  choice: tetapi mereka
  rationale: Kata ganti penunjuk itu mengontraskan para pendengar dengan Yesus, sedangkan δέ bersifat adversatif dalam konteks ini; “tetapi mereka” menyampaikan kontras tersebut secara wajar.
- source_word: οὐκ ἔγνωσαν
  choice: tidak mengerti
  rationale: Dalam konteks ini, γινώσκω mengacu pada kegagalan menangkap arti perkataan figuratif Yesus, bukan sekadar tidak mengetahui suatu fakta.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: apa yang dikatakan-Nya kepada mereka
  rationale: Susunan Yunani secara harfiah agak janggal, kira-kira “apa gerangan hal-hal yang sedang Ia bicarakan kepada mereka.” Pilihan ini menyampaikan maksud klausa dengan jelas tanpa menambahkan penafsiran eksplisit seperti “apa yang dimaksud-Nya.”
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Bentuk datif ini menandai pihak yang menerima perkataan. Pengulangannya pada akhir ayat dipertahankan sesuai struktur dan penekanan teks Yunani.
