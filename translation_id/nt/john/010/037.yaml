  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: id
  text: Jika Aku tidak melakukan pekerjaan Bapa-Ku, jangan percaya kepada-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan percaya pada apa yang Kukatakan.”
    reason: Alternatif leksikal untuk πιστεύω dengan dativus μοι; konstruksi ini dapat menyoroti kepercayaan terhadap perkataan seseorang.
lexical_decisions:
- source_word: εἰ
  choice: Jika
  rationale: Memperkenalkan anak kalimat bersyarat secara langsung dan alami dalam bahasa Indonesia.
- source_word: οὐ ποιῶ
  choice: Aku tidak melakukan
  rationale: Menerjemahkan verba kini aktif orang pertama tunggal beserta negasinya; bentuk Indonesia ini dapat mencakup tindakan yang sedang dan terus dilakukan tanpa memaksakan aspek progresif.
- source_word: τὰ ἔργα
  choice: pekerjaan-pekerjaan
  rationale: Mempertahankan bentuk jamak dan istilah penting dalam Injil Yohanes bagi tindakan-tindakan Yesus yang memberi kesaksian tentang diri-Nya.
- source_word: τοῦ πατρός μου
  choice: Bapa-Ku
  rationale: Genitif kepunyaan dapat diungkapkan secara alami dengan enklitik -Ku; huruf kapital menandai Bapa sebagai sebutan bagi Allah dalam konteks ini.
- source_word: μὴ πιστεύετέ
  choice: jangan percaya
  rationale: Imperatif kini dengan μή menyatakan larangan; 'percaya' merupakan padanan wajar dan konsisten bagi πιστεύω.
- source_word: μοι
  choice: kepada-Ku
  rationale: Dativus setelah πιστεύω diarahkan kepada pribadi Yesus. 'Kepada-Ku' alami dalam bahasa Indonesia dan mempertahankan dimensi personal tanpa menutup nuansa mempercayai perkataan-Nya.
theological_decisions:
- issue: Makna πιστεύω dengan dativus μοι
  choice: jangan percaya kepada-Ku
  alternative: jangan percaya pada apa yang Kukatakan
  rationale: Konstruksi Yunani dapat berarti mempercayai seseorang, sementara konteks juga menyangkut penerimaan terhadap klaim-Nya. Teks utama mempertahankan sasaran personal yang eksplisit dan catatan kaki menyajikan nuansa proposisional tanpa menganggap keduanya saling meniadakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti hubungan syarat dan akibat dalam bahasa Yunani, dengan istilah Yohanes 'pekerjaan-pekerjaan' dipertahankan.
