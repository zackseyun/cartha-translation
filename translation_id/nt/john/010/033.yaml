  naturalness: Bahasa draf baku dan jelas. Mengganti “hendak melempari” dengan “melempari” menghasilkan padanan yang lebih langsung bagi bentuk Yunani tanpa mengurangi kelugasan.
  terminology: “Penghujatan,” “Allah,” dan “seorang manusia” sesuai register Alkitab bahasa Indonesia. “Orang-orang Yahudi itu” mempertahankan rujukan Yunani yang tidak diperinci; tidak perlu dipersempit menjadi para pemimpin Yahudi. Catatan kaki dengan tepat melestarikan kemungkinan alternatif bagi θεόν.
