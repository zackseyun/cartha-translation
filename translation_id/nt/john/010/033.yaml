id: JHN.10.33
reference: John 10:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: id
  text: Orang-orang Yahudi itu menjawab Dia, “Bukan karena suatu perbuatan baik kami melempari Engkau dengan batu, melainkan karena penghujatan, yakni karena Engkau, seorang manusia, menjadikan diri-Mu Allah.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadikan diri-Mu suatu ilah.” Kata Yunani θεόν tidak memakai kata sandang, tetapi dalam konteks tuduhan penghujatan ini, arti yang paling mungkin ialah “Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: Orang-orang Yahudi itu
  rationale: Ini adalah padanan langsung yang tetap mempertahankan keluasan rujukan istilah Yohanes. Dalam konteks ini, yang dimaksud ialah kelompok yang sedang menentang Yesus, tetapi menerjemahkannya sebagai 'para pemimpin Yahudi' akan mempersempit rujukan melampaui bentuk Yunani.
- source_word: Περὶ καλοῦ ἔργου
  choice: karena suatu perbuatan baik
  rationale: περί dengan genitif menyatakan alasan atau perkara yang menjadi dasar tindakan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal ἔργου.
- source_word: λιθάζομέν
  choice: kami hendak melempari Engkau dengan batu
  rationale: Kala kini menunjukkan tindakan yang sedang diupayakan atau dimaksudkan dalam konfrontasi tersebut. 'Hendak melempari ... dengan batu' terdengar alami dalam bahasa Indonesia dan sesuai dengan tindakan yang baru saja mereka persiapkan menurut ayat 31.
- source_word: βλασφημίας
  choice: penghujatan
  rationale: Istilah ini secara ringkas menyatakan perkataan atau klaim yang dianggap menghina Allah dan sesuai dengan tuduhan dalam konteks ini.
- source_word: ἄνθρωπος ὢν
  choice: Engkau, seorang manusia
  rationale: Ungkapan ini mempertahankan kontras yang dibuat para penuduh antara keadaan Yesus sebagai manusia dan status ilahi yang menurut mereka Ia klaim, tanpa menambahkan kata 'hanya' yang tidak dinyatakan dalam teks.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: menjadikan diri-Mu Allah
  rationale: Konstruksi ποιέω dengan objek refleksif dan predikat akusatif berarti 'menjadikan diri sebagai X' atau mengajukan diri sebagai X. Dalam konteks tuduhan penghujatan, 'Allah' paling mungkin menyampaikan maksud tuduhan tersebut, sementara kemungkinan gramatikal 'suatu ilah' dicatat dalam catatan kaki.
theological_decisions:
- issue: Arti θεόν tanpa artikel dalam tuduhan ποιεῖς σεαυτὸν θεόν
  choice: Allah
  alternative: suatu ilah
  rationale: Walaupun θεόν tidak memakai artikel dan secara terpisah dapat dipahami secara kualitatif atau diterjemahkan 'suatu ilah', konteks monoteistis dan tuduhan penghujatan menunjukkan bahwa para penuduh menganggap Yesus mengambil bagi diri-Nya status yang menjadi milik Allah. Catatan kaki mempertahankan alternatif gramatikal tanpa melemahkan arti yang paling mungkin dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan pronominal hormat berhuruf kapital bagi Yesus. Diksi dibuat lugas dan bermartabat. 'Melempari ... dengan batu' dipilih daripada 'merajam' karena konteks menggambarkan upaya melempari Yesus dengan batu dan tidak secara eksplisit menetapkan suatu pelaksanaan hukuman formal.
