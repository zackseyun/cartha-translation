  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: id
  text: Jika Ia menyebut mereka yang kepadanya firman Allah datang sebagai “allah”[a]—dan Kitab Suci tidak dapat dibatalkan[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “makhluk-makhluk ilahi.” Teks Yunani berbunyi “allah,” menggemakan Mazmur 82:6; sebagian penafsir memahami yang dimaksud sebagai hakim-hakim manusia.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak dapat ditiadakan” atau “tidak dapat dikesampingkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Jika
  rationale: Mempertahankan bentuk syarat yang menjadi bagian dari alur argumentasi Yesus.
- source_word: ἐκείνους
  choice: orang-orang
  rationale: Menunjuk kepada pihak-pihak yang disebut dalam kutipan Kitab Suci tanpa menambahkan identitas mereka secara interpretatif.
- source_word: εἶπεν θεοὺς
  choice: menyebut ... sebagai “allah”
  rationale: Konstruksi ini menyampaikan fungsi predikatif εἶπεν secara alami dalam bahasa Indonesia dan mempertahankan istilah yang dikutip dari Mazmur 82:6.
- source_word: θεοὺς
  choice: “allah”
  rationale: Mempertahankan kata yang menjadi dasar argumentasi Yesus. Huruf kecil dan tanda kutip membedakannya dari Allah Yang Esa tanpa menentukan apakah yang dimaksud ialah hakim manusia atau makhluk ilahi.
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: yang menerima firman Allah
  rationale: Secara idiomatis menyatakan bahwa firman Allah datang atau ditujukan kepada mereka; 'menerima' menghindari susunan Indonesia yang kaku tanpa menghilangkan arah tindakan.
- source_word: οὐ δύναται λυθῆναι
  choice: tidak dapat dibatalkan
  rationale: Menangkap makna bahwa kewibawaan Kitab Suci tidak dapat dinyatakan tidak berlaku atau dikesampingkan.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Padanan baku dan alami bagi tulisan suci yang berwibawa dalam konteks ini.
theological_decisions:
- issue: Makna θεοὺς dalam kutipan Yesus
  choice: Mempertahankan “allah” dalam huruf kecil tanpa menjelaskan rujukannya di teks utama.
  alternative: hakim-hakim; makhluk-makhluk ilahi
  rationale: Argumentasi Yesus bergantung pada bunyi Mazmur 82:6. Memilih salah satu identifikasi akan menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
- issue: Makna pernyataan bahwa Kitab Suci tidak dapat λυθῆναι
  choice: Kitab Suci tidak dapat dibatalkan.
  alternative: Kitab Suci tidak dapat ditiadakan; Kitab Suci tidak dapat dikesampingkan
  rationale: Pilihan ini menyatakan ketidakmungkinan meniadakan daya berlaku Kitab Suci tanpa memperluas klausa menjadi rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan sifat parentetis klausa terakhir serta menunjukkan bahwa kalimat dan argumentasi berlanjut ke ayat berikutnya.
