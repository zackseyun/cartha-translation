base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: id
  text: Pada waktu itu, Perayaan Penahbisan berlangsung di Yerusalem.[a] Saat itu musim dingin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hanukkah”, perayaan Yahudi untuk memperingati penahbisan kembali Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: berlangsung
  rationale: Dalam konteks ini, γίνομαι menyatakan terjadinya suatu perayaan. “Berlangsung” alami dalam bahasa Indonesia dan mempertahankan makna peristiwa.
- source_word: τότε
  choice: Pada waktu itu
  rationale: τότε menandai peralihan waktu; “Pada waktu itu” jelas dan wajar dalam narasi Indonesia.
- source_word: τὰ ἐγκαίνια
  choice: Perayaan Penahbisan
  rationale: Istilah ini menunjuk pada perayaan penahbisan kembali Bait Allah. Terjemahan deskriptif ini mudah dipahami, sedangkan nama umum “Hanukkah” dijelaskan dalam catatan kaki.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: di Yerusalem
  rationale: Ungkapan lokatif langsung dan alami dalam bahasa Indonesia modern.
- source_word: χειμὼν ἦν
  choice: Saat itu musim dingin
  rationale: Menerjemahkan klausa sederhana ini secara langsung sambil menghindari rangkaian yang kaku dengan kalimat sebelumnya.
theological_decisions:
- issue: Identifikasi τὰ ἐγκαίνια
  choice: Perayaan Penahbisan dalam teks utama
  alternative: Hanukkah; Penahbisan
  rationale: Teks utama menerjemahkan istilah Yunani secara transparan tanpa menggantinya dengan nama perayaan yang lebih umum. Identifikasi sebagai Hanukkah dipertahankan dalam catatan kaki agar informasi budaya tersedia tanpa mengaburkan bentuk ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perayaan” dipilih daripada “Hari Raya” agar tidak menambahkan nuansa yang tidak dituntut oleh istilah Yunani, sedangkan “penahbisan” mempertahankan hubungan dengan pengudusan kembali Bait Allah.
