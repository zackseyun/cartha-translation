  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: id
  text: Namun, jika Aku melakukannya, sekalipun kamu tidak memercayai Aku,[a] percayailah pekerjaan-pekerjaan itu, supaya kamu mengetahui dan terus mengetahui[b] bahwa Bapa ada di dalam Aku dan Aku di dalam Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “sekalipun kamu tidak percaya kepada-Ku.” Bentuk Yunani dapat berarti tidak menerima perkataan Yesus sebagai benar atau tidak percaya kepada-Nya.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani memakai dua bentuk dari kata kerja “mengetahui”, yang mungkin menekankan mulai mengetahui lalu terus berada dalam pengetahuan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: Aku melakukannya
  rationale: Bentuk kini aktif ini mengacu kembali pada pekerjaan-pekerjaan Yesus dalam konteks terdekat. Akhiran “-nya” menyatakan objek yang tersirat tanpa mengubah acuannya menjadi istilah lain.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: sekalipun kamu tidak memercayai Aku
  rationale: πιστεύω dengan pronomina datif di sini paling wajar menyatakan menerima perkataan atau kesaksian Yesus sebagai benar. “Memercayai Aku” mempertahankan kemungkinan itu dan tidak otomatis mengubahnya menjadi rumusan “percaya kepada-Ku”.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: percayailah pekerjaan-pekerjaan itu
  rationale: 'Terjemahan ini mempertahankan bentuk ringkas bahasa Yunani: jika para pendengar tidak memercayai Yesus, mereka harus menerima kesaksian yang diberikan oleh pekerjaan-pekerjaan-Nya. Ungkapan ini sengaja tidak diperluas menjadi “percaya berdasarkan” atau “percaya kepada” pekerjaan-pekerjaan itu.'
- source_word: ἔργοις
  choice: pekerjaan-pekerjaan
  rationale: “Pekerjaan” mempertahankan kosakata khas Yohanes bagi tindakan-tindakan Yesus yang menyatakan siapa Dia. “Tanda-tanda” akan menafsirkan ἔργα sebagai σημεῖα, sedangkan teks tidak memakai kata itu.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: Dengan demikian, kamu dapat mengetahui dan terus mengetahui
  rationale: Dua bentuk dari kata kerja yang sama dipertahankan dengan pengulangan “mengetahui”; bentuk pertama memandang tercapainya pengetahuan, sedangkan bentuk kedua menonjolkan keberlangsungannya. “Dengan demikian” menyampaikan tujuan sekaligus hasil yang dimaksud tanpa membuat kalimat Indonesia terlalu kaku.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: Bapa ada di dalam Aku dan Aku di dalam Bapa
  rationale: Pengulangan “di dalam” mempertahankan bahasa timbal balik teks dan tidak menjelaskannya dengan istilah teologis yang berasal dari masa kemudian.
- source_word: πατήρ
  choice: Bapa
  rationale: Kata benda Yunani memakai artikel dan menunjuk kepada “Bapa”, bukan secara eksplisit “Bapa-Ku”.
theological_decisions:
- issue: Keberadaan timbal balik Bapa dan Anak
  choice: Bapa ada di dalam Aku dan Aku di dalam Bapa
  alternative: Bapa bersatu dengan Aku dan Aku bersatu dengan Bapa
  rationale: Terjemahan langsung mempertahankan kekuatan dan ketegangan ungkapan Yohanes tanpa mereduksinya menjadi sekadar kesatuan tujuan atau memperluasnya dengan terminologi kredal.
- issue: Objek kepercayaan dalam klausa pertama
  choice: tidak memercayai Aku
  alternative: tidak percaya kepada-Ku
  rationale: Dativus ἐμοί dapat dipahami sebagai “memercayai perkataan-Ku/memercayai Aku” atau “percaya kepada-Ku”. Kontras dengan perintah untuk memercayai pekerjaan-pekerjaan mendukung pilihan utama, tetapi alternatif yang lebih bersifat iman personal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat digunakan tanpa ungkapan yang terlalu gerejawi. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Pengulangan “mengetahui” dipertahankan meskipun agak mencolok agar perbedaan aspek dalam bahasa Yunani tidak hilang; catatan kaki menjelaskannya. Semua penanda catatan kaki muncul dalam teks utama.
