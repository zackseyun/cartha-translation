  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: id
  text: Dan di sana banyak orang percaya kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung yang secara langsung mengaitkan ayat ini dengan alur narasi sebelumnya tanpa menambahkan hubungan sebab-akibat atau urutan waktu yang tidak dinyatakan.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Adjektiva jamak ini dipakai secara substantival untuk menunjuk banyak orang; penyebutan 'orang' diperlukan agar alami dan jelas dalam bahasa Indonesia.
- source_word: ἐπίστευσαν
  choice: percaya
  rationale: Bentuk aoris indikatif menyatakan tindakan percaya; 'percaya' merupakan padanan langsung dan tidak memaksakan nuansa mulai percaya yang tidak diwajibkan oleh bentuk aoris itu sendiri.
- source_word: εἰς αὐτόν
  choice: kepada-Nya
  rationale: Dalam konstruksi πιστεύω εἰς, frasa ini menyatakan kepercayaan yang diarahkan kepada Yesus. 'Percaya kepada-Nya' alami dalam bahasa Indonesia dan mempertahankan unsur kepercayaan pribadi.
- source_word: ἐκεῖ
  choice: di sana
  rationale: Adverbia tempat ini menandai lokasi terjadinya tindakan percaya; 'di sana' adalah padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Makna πιστεύω εἰς αὐτόν dalam konteks iman kepada Yesus
  choice: percaya kepada-Nya
  alternative: beriman kepada-Nya; menaruh kepercayaan kepada-Nya
  rationale: '''Percaya kepada-Nya'' mempertahankan makna kepercayaan yang diarahkan kepada Yesus tanpa memperluasnya menjadi parafrasa atau memasukkan rumusan teologis tambahan.'
translation_notes:
  register: Bahasa Indonesia modern yang ringkas, alami, dan bermartabat. Urutan 'di sana' ditempatkan dekat awal klausa untuk mempertahankan penekanan lokatif ἐκεῖ sekaligus menghasilkan kalimat yang wajar. Huruf kapital pada '-Nya' mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab bahasa Indonesia.
