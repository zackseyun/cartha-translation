  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: id
  text: Namun, kalian tidak percaya[a], karena kalian tidak termasuk di antara domba-domba-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, kalian tidak percaya bahwa kalian tidak termasuk di antara domba-domba-Ku.” Konjungsi Yunani yang diterjemahkan “karena” juga dapat dipahami sebagai pengantar isi dari apa yang tidak mereka percayai.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan uraian sebelumnya tentang domba-domba Yesus; “Namun” alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina jamak yang eksplisit dalam bahasa Yunani ditampilkan dengan “kalian”, sehingga jumlah dan kontras dengan domba-domba Yesus tetap jelas.
- source_word: οὐ πιστεύετε
  choice: tidak percaya
  rationale: Bentuk kini aktif dengan negasi paling wajar diterjemahkan sebagai keadaan atau tindakan kini; “percaya” sesuai dengan pemakaian Yohanes.
- source_word: ὅτι
  choice: karena
  rationale: Konjungsi ini kemungkinan besar menyatakan sebab dalam alur argumen, tetapi dapat pula memperkenalkan isi dari apa yang tidak mereka percayai; kemungkinan kedua dipertahankan dalam catatan kaki.
- source_word: οὐκ ἐστὲ
  choice: kalian bukan
  rationale: Kopula negatif diterjemahkan secara idiomatis; dalam konstruksi keanggotaan kelompok, “bukan” lebih alami daripada “tidak berada”.
- source_word: ἐκ τῶν προβάτων
  choice: termasuk domba-domba
  rationale: ἐκ menyatakan bahwa seseorang berasal dari atau tergolong dalam suatu kelompok; “termasuk” menyampaikan keanggotaan kelompok dengan alami.
- source_word: τῶν ἐμῶν
  choice: -Ku
  rationale: Kata kepunyaan tersebut secara alami melekat pada “domba-domba” sebagai “domba-domba-Ku”.
theological_decisions:
- issue: Fungsi ὅτι dalam hubungan antara ketidakpercayaan dan menjadi bagian dari domba-domba Yesus
  choice: 'Kausal: “karena kalian bukan termasuk domba-domba-Ku”'
  alternative: 'Isi/epexegetis: “bahwa kalian bukan termasuk domba-domba-Ku”'
  rationale: Bacaan kausal paling sesuai dengan kontras dalam konteks dekat antara domba-domba yang mendengar dan mengikuti Yesus dan para lawan yang tidak percaya. Namun, bahasa Yunani juga memungkinkan ὅτι memperkenalkan isi yang tidak mereka percayai. Catatan kaki mempertahankan ambiguitas ini tanpa menjadikannya dasar bagi suatu sistem doktrin tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk mempertahankan jumlah pronomina Yunani. Ungkapan “domba-domba-Ku” mempertahankan metafora dan bentuk kepunyaan secara langsung; susunan kalimat dibuat alami tanpa menghapus ambiguitas penting pada ὅτι.
