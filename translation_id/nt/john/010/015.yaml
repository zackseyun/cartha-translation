  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: id
  text: sebagaimana Bapa mengenal Aku dan Aku mengenal Bapa, dan Aku menyerahkan nyawa-Ku[a] bagi domba-domba itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hidup-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “demi domba-domba itu.” Kata depan Yunani ini dapat mengandung nuansa bertindak untuk kepentingan, mewakili, atau berkorban bagi pihak lain.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menandai perbandingan erat dengan pernyataan sebelumnya sambil mempertahankan alur kalimat Yunani secara wajar dalam bahasa Indonesia.
- source_word: γινώσκει / γινώσκω
  choice: mengenal
  rationale: Dalam konteks ini verba tersebut menyatakan pengenalan yang bersifat relasional, bukan sekadar mengetahui fakta. Pengulangan 'mengenal' mempertahankan kesejajaran Yunani.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: Bapa
  rationale: Teks Yunani memakai sebutan 'Bapa' tanpa pronomina posesif; bentuk ini juga mempertahankan kesejajaran khas Yohanes.
- source_word: κἀγὼ
  choice: dan Aku
  rationale: Mencerminkan gabungan καί dan ἐγώ serta menjaga keseimbangan antara pengenalan Bapa akan Yesus dan pengenalan Yesus akan Bapa.
- source_word: τὴν ψυχήν μου
  choice: nyawa-Ku
  rationale: Dalam konteks penyerahan diri sampai mati, ψυχή menunjuk pada nyawa atau hidup seseorang, bukan khusus pada unsur batin yang tidak berwujud. 'Nyawa-Ku' jelas dan alami dalam konteks pengorbanan.
- source_word: τίθημι
  choice: menyerahkan
  rationale: Bersama ψυχή, verba ini membentuk ungkapan tentang secara sukarela memberikan nyawa. 'Menyerahkan' mempertahankan unsur tindakan yang disengaja tanpa menerjemahkan idiom Yunani secara kaku.
- source_word: ὑπὲρ
  choice: bagi
  rationale: '''Bagi'' menyatakan bahwa tindakan itu dilakukan demi kepentingan domba-domba dan tetap membuka kemungkinan nuansa perwakilan atau pengorbanan tanpa mempersempitnya menjadi rumusan teknis.'
- source_word: τῶν προβάτων
  choice: domba-domba itu
  rationale: Mempertahankan nomina konkret dan metafora gembala yang menjadi pusat perikop; bentuk jamak eksplisit terasa alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya makna ὑπὲρ dalam penyerahan diri Yesus
  choice: bagi
  alternative: demi; untuk kepentingan; sebagai ganti
  rationale: '''Bagi'' memuat arah tindakan untuk kepentingan domba-domba dan sesuai dengan konteks pengorbanan, tetapi tidak memaksakan satu perumusan khusus mengenai perwakilan atau penggantian yang melampaui apa yang dinyatakan preposisi Yunani.'
- issue: Makna ψυχή dalam konteks ini
  choice: nyawa-Ku
  alternative: hidup-Ku; jiwa-Ku
  rationale: Konteksnya adalah kematian Sang Gembala demi domba-domba. Karena itu ψυχή menunjuk pada nyawa atau hidup yang diserahkan, bukan semata-mata 'jiwa' sebagai unsur nonjasmani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pada 'Aku' dan sufiks '-Ku' mengikuti rujukan kepada Yesus. Susunan paralel 'Bapa mengenal Aku dan Aku mengenal Bapa' dipertahankan, sedangkan idiom Yunani diterjemahkan secara alami sebagai 'menyerahkan nyawa-Ku'.
