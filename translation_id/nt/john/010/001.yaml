id: JHN.10.1
reference: John 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: id
  text: '“Sesungguhnya, sesungguhnya, Aku berkata kepadamu: orang yang tidak masuk ke kandang domba melalui pintu[a], tetapi memanjat masuk dari tempat lain, orang itu adalah pencuri dan perampok[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gerbang.” Kata Yunani θύρα dapat berarti pintu atau gerbang, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Yunani membedakan “pencuri” (κλέπτης) dari “perampok” (λῃστής); istilah kedua sering menyiratkan pencurian yang lebih terang-terangan atau disertai kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang memberi penegasan khidmat, sekaligus menyampaikan maknanya dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan bentuk ujaran langsung; bentuk -mu dapat merujuk kepada para pendengar secara kolektif dalam bahasa Indonesia.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: orang yang tidak masuk
  rationale: Menyampaikan partisip substantival tunggal secara alami tanpa membuatnya terlalu abstrak atau kuno.
- source_word: διὰ τῆς θύρας
  choice: melalui pintu
  rationale: θύρα dapat berarti pintu atau gerbang; 'pintu' mempertahankan padanan dasar dan tetap sesuai dengan jalan masuk kandang.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: ke kandang domba
  rationale: Dalam konteks pastoral, αὐλή menunjuk pada tempat berpagar atau tertutup bagi domba; 'kandang domba' adalah ungkapan Indonesia yang paling alami.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: tetapi memanjat masuk dari tempat lain
  rationale: ἀναβαίνων menggambarkan tindakan naik atau memanjat, sedangkan ἀλλαχόθεν menyatakan asal dari tempat lain; penambahan 'masuk' memperjelas arah tindakan yang tersirat oleh konteks.
- source_word: ἐκεῖνος
  choice: orang itu
  rationale: Mempertahankan daya tunjuk dan penegasan demonstratif Yunani dengan ungkapan Indonesia yang alami.
- source_word: κλέπτης
  choice: pencuri
  rationale: Padanan baku bagi orang yang mencuri, biasanya secara tersembunyi.
- source_word: λῃστής
  choice: perampok
  rationale: Mempertahankan perbedaan dari κλέπτης dan kemungkinan nuansa perampasan dengan kekerasan atau secara terang-terangan.
theological_decisions:
- issue: Gambaran metaforis αὐλή dan θύρα
  choice: Menerjemahkan secara konkret sebagai 'kandang domba' dan 'pintu' tanpa menjelaskan makna alegorisnya.
  alternative: Memakai 'gerbang' dan/atau menambahkan identifikasi alegoris berdasarkan ayat-ayat berikutnya.
  rationale: Ayat ini memperkenalkan gambaran yang dikembangkan dalam konteks selanjutnya. Terjemahan sebaiknya mempertahankan gambaran tersebut tanpa mendahului penjelasan teks.
- issue: Partisip substantival maskulin tunggal dan ἐκεῖνος
  choice: Menggunakan 'orang yang ... orang itu'.
  alternative: Menggunakan 'siapa pun yang ... dia' atau menyebut 'laki-laki itu'.
  rationale: Bentuk Yunani bersifat tunggal dan representatif. 'Orang itu' mempertahankan ketunggalan dan penegasan tanpa menambahkan jenis kelamin yang tidak perlu dalam bahasa Indonesia.
- issue: Perbedaan κλέπτης dan λῃστής
  choice: Mempertahankan dua istilah sebagai 'pencuri dan perampok'.
  alternative: Menyatukannya menjadi satu istilah umum seperti 'penjahat'.
  rationale: Dua nomina Yunani berbeda dan sengaja disejajarkan; terjemahan mempertahankan ketegangan leksikal tanpa memperbesar perbedaannya menjadi tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Sesungguhnya, sesungguhnya' dipertahankan sebagai ciri formula penegasan dalam Injil Yohanes. Susunan kalimat dibuat alami tanpa menghilangkan kontras antara masuk melalui pintu dan memanjat dari tempat lain.
