  source_fidelity: 'Terjemahan secara setia mencerminkan konstruksi Yunani: formula penegasan ganda, partisip substantival tunggal, kontras antara masuk melalui pintu dan memanjat dari tempat lain, serta dua sebutan κλέπτης dan λῃστής tetap terpelihara. Tambahan implisit “masuk” pada “memanjat masuk” wajar dalam bahasa Indonesia dan dituntut oleh kontras konteks, tanpa menambahkan penafsiran alegoris.'
  naturalness: Bahasa Indonesia baku, modern, dan khidmat. “Sesungguhnya, sesungguhnya, Aku berkata kepadamu” sesuai register Injil Yohanes; “kandang domba,” “memanjat masuk dari tempat lain,” dan “orang itu” semuanya alami dan jelas.
  terminology: “Pintu” mempertahankan ambiguitas leksikal θύρα dengan alternatif “gerbang” dalam catatan. “Kandang domba” sesuai konteks αὐλή. “Pencuri dan perampok” dengan tepat mempertahankan dua istilah yang berbeda dalam bahasa sumber. Catatan untuk λῃστής memberi nuansa leksikal secara hati-hati, bukan sebagai kepastian berlebihan.
