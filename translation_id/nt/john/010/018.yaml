id: JHN.10.18
reference: John 10:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: id
  text: Tidak seorang pun mengambilnya dari-Ku. Sebaliknya, Aku menyerahkannya atas kehendak-Ku sendiri.[a] Aku memiliki wewenang[b] untuk menyerahkannya dan memiliki wewenang untuk mengambilnya kembali.[c] Perintah ini Kuterima dari Bapa-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dari diri-Ku sendiri” atau “atas prakarsa-Ku sendiri.” Ungkapan ini menegaskan bahwa Yesus menyerahkan nyawa-Nya dengan sukarela.
    reason: lexical_alternative
  - marker: b
    text: Atau “kuasa” atau “hak.” Kata Yunani yang digunakan dapat mencakup baik kemampuan maupun kewenangan yang sah.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud dengan “-nya” ialah nyawa-Nya; bandingkan pengulangan “nyawa-Ku” dalam Yohanes 10:17.
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει
  choice: mengambil
  rationale: Dalam konteks nyawa Yesus, kata ini berarti mengambil dari-Nya. Pilihan ini mempertahankan kontras dengan tindakan-Nya yang sukarela tanpa menambahkan pelaku tertentu.
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: menyerahkannya
  rationale: Ungkapan ini merujuk pada tindakan menyerahkan nyawa. 'Menyerahkannya' alami dalam bahasa Indonesia, mempertahankan sifat sukarela tindakan itu, dan digunakan secara konsisten pada kedua kemunculannya.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: atas kehendak-Ku sendiri
  rationale: Ungkapan ini menegaskan prakarsa dan kesukarelaan Yesus. Pilihan ini tidak menyiratkan bahwa Ia bertindak terlepas dari Bapa, sebab kalimat terakhir menyebut perintah Bapa.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Kata Yunani ini mencakup otoritas atau hak yang sah, bukan sekadar kemampuan. 'Wewenang' menjaga kaitannya dengan perintah yang diterima dari Bapa.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: mengambilnya kembali
  rationale: '''Mengambil kembali'' mempertahankan daya aktif λαβεῖν dan makna πάλιν, sambil membiarkan rujukan kata ganti tetap tersirat sebagaimana dalam teks Yunani.'
- source_word: ἐντολήν
  choice: perintah
  rationale: '''Perintah'' merupakan padanan langsung yang mempertahankan kekuatan leksikal kata Yunani dan hubungan yang dinyatakan antara Anak dan Bapa.'
- source_word: παρὰ τοῦ πατρός μου
  choice: dari Bapa-Ku
  rationale: παρά dengan genitif menunjukkan sumber; terjemahan ini mempertahankan bahasa relasional dan pribadi teks.
theological_decisions:
- issue: Makna ἐξουσία sehubungan dengan kematian dan kebangkitan Yesus
  choice: wewenang
  alternative: kuasa; hak
  rationale: '''Wewenang'' menyatakan tindakan yang sah dan berotoritas, bukan hanya kemampuan. Pilihan ini menjaga sekaligus kedaulatan tindakan Yesus dan kaitannya dengan perintah Bapa.'
- issue: Daya makna ἀπ’ ἐμαυτοῦ
  choice: atas kehendak-Ku sendiri
  alternative: dari diri-Ku sendiri; atas prakarsa-Ku sendiri
  rationale: Terjemahan ini menegaskan bahwa penyerahan nyawa Yesus bersifat sukarela tanpa menyimpulkan bahwa tindakan-Nya independen dari Bapa.
- issue: Rujukan αὐτήν
  choice: -nya
  alternative: nyawa-Ku
  rationale: Kata ganti dipertahankan karena merujuk kepada 'nyawa-Ku' dalam konteks langsung, khususnya Yohanes 10:17. Ini menjaga bentuk teks sumber dan tidak menghilangkan kejelasan dalam konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk sapaan ilahi memakai kapital pada pronomina terikat dan posesif. Struktur pengulangan dipertahankan untuk mencerminkan penekanan teks Yunani, sementara 'menyerahkannya' dipilih alih-alih terjemahan harfiah yang kaku seperti 'meletakkannya'.
