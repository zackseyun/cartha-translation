  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: id
  text: Yang lain berkata, “Kata-kata ini bukanlah perkataan orang yang kerasukan setan.[a] Masakan setan dapat membuka mata orang buta?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kata-kata ini bukan berasal dari orang yang kerasukan setan.”
    reason: Alternatif ini menampilkan hubungan genitif sebagai asal atau sumber ucapan, sedangkan teks utama mengungkapkannya secara idiomatis sebagai jenis perkataan yang khas dari pembicara tersebut.
lexical_decisions:
- source_word: ἄλλοι
  choice: Orang-orang lain
  rationale: Menunjukkan kelompok lain yang berbeda dari para pembicara pada ayat sebelumnya; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung atau berulang, tetapi dalam narasi bahasa Indonesia, “berkata” sudah paling alami tanpa memaksakan aspek yang tidak perlu.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Kata-kata ini
  rationale: Merujuk pada ucapan Yesus dan mempertahankan ungkapan konkret teks Yunani dalam bahasa Indonesia yang wajar.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: bukanlah perkataan orang yang kerasukan setan
  rationale: Genitif substantival ini menyatakan bahwa kata-kata tersebut bukan ciri atau ucapan seseorang yang berada di bawah kuasa setan. Ungkapan Indonesia ini jelas dan idiomatis tanpa menambahkan teori teknis tentang keadaan orang itu.
- source_word: μὴ
  choice: Masakan
  rationale: Partikel μή memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif; “masakan” menyampaikan daya retoris itu secara alami.
- source_word: δαιμόνιον
  choice: setan
  rationale: Dalam pemakaian umum bahasa Indonesia Alkitabiah, “setan” menyatakan makhluk roh jahat yang dimaksud oleh δαιμόνιον, dan tidak disamakan dengan nama khusus “Iblis”.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: mata orang buta
  rationale: Mempertahankan gambaran konkret tentang membuka mata sekaligus mengacu secara jelas pada penyembuhan orang yang lahir buta dalam konteks sebelumnya.
- source_word: ἀνοῖξαι
  choice: membuka
  rationale: Menerjemahkan arti harfiah verba dan mempertahankan citra “membuka mata”, alih-alih menjelaskannya sebagai “memulihkan penglihatan”.
theological_decisions:
- issue: Bahasa δαιμονίζομαι dan δαιμόνιον
  choice: orang yang kerasukan setan / setan
  alternative: orang yang dikuasai setan / roh jahat
  rationale: Pilihan ini memakai ungkapan Indonesia yang lazim dan jelas, sambil mempertahankan klaim teks tentang pengaruh setan. Terjemahan ini tidak merinci mekanisme atau tingkat penguasaan yang tidak dijelaskan oleh ayat.
- issue: Daya pertanyaan retoris dengan μή
  choice: Masakan setan dapat membuka mata orang buta?
  alternative: Dapatkah setan membuka mata orang buta?
  rationale: “Masakan” memperlihatkan bahwa para pembicara mengharapkan jawaban negatif, tanpa mengubah pertanyaan itu menjadi pernyataan mutlak atau menyelesaikan ketegangan dalam penalaran mereka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Masakan” dipakai dalam arti retoris yang masih umum dan mudah dipahami; “Iblis” dihindari agar δαιμόνιον tidak disamakan dengan tokoh khusus sang Iblis.
