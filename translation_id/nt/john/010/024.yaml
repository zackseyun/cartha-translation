  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: id
  text: Lalu orang-orang Yahudi[b] mengelilingi Yesus dan terus berkata kepada-Nya, “Berapa lama lagi Engkau akan membiarkan kami dalam ketidakpastian?[a] Jika Engkau adalah Mesias, katakanlah kepada kami dengan terus terang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Sampai kapan Engkau mengangkat jiwa kami?” Ungkapan ini berarti membiarkan seseorang terus berada dalam ketidakpastian atau penantian yang menegangkan.
    reason: lexical_alternative
  - marker: b
    text: Dalam Injil Yohanes, sebutan “orang-orang Yahudi” dalam konteks tertentu dapat secara lebih khusus menunjuk kepada kalangan berwenang di Yudea atau para penentang Yesus, bukan kepada seluruh orang Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: mengelilingi
  rationale: Mempertahankan arti fisik κυκλόω, yakni berada mengitari seseorang, serta nuansa konfrontatif dalam konteks ini.
- source_word: οὖν
  choice: Lalu
  rationale: Menandai kelanjutan alur narasi secara alami dalam bahasa Indonesia tanpa memberi kesan kesimpulan logis yang terlalu kuat.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan ungkapan Yunani tanpa mempersempitnya secara diam-diam menjadi para pemimpin; kemungkinan rujukan kontekstual yang lebih sempit dijelaskan dalam catatan kaki.
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Menyampaikan aspek imperfek yang dapat menunjukkan ujaran yang berlangsung atau berulang.
- source_word: Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις
  choice: Berapa lama lagi Engkau akan membiarkan kami dalam ketidakpastian?
  rationale: Mengungkapkan makna idiomatis ungkapan harfiah tentang mengangkat atau menggantungkan jiwa, dengan bahasa Indonesia yang jelas dan wajar; citra harfiahnya dipertahankan dalam catatan.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar pengharapan Yahudi dalam pertanyaan ini, sehingga 'Mesias' lebih tepat daripada bentuk yang dapat terdengar seperti nama diri.
- source_word: εἰπὲ ἡμῖν
  choice: katakanlah kepada kami
  rationale: Menyampaikan perintah langsung dalam bentuk Indonesia yang alami dan tegas.
- source_word: παρρησίᾳ
  choice: dengan terus terang
  rationale: Dalam konteks ini menunjuk pada pernyataan yang terbuka, jelas, dan tidak samar; 'dengan terus terang' mempertahankan unsur keterbukaan ucapan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini di sini merupakan gelar yang sedang dipertanyakan dalam konteks pengharapan Yahudi, bukan pemakaian yang terutama menyerupai nama diri.
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi dalam teks utama, dengan penjelasan kontekstual dalam catatan kaki
  alternative: para pemimpin Yahudi atau orang-orang Yudea
  rationale: Ayat ini sendiri tidak secara eksplisit membatasi kelompok itu kepada para pemimpin. Terjemahan mempertahankan cakupan leksikal teks sambil mencegah generalisasi terhadap seluruh bangsa Yahudi melalui catatan.
- issue: Makna idiom τὴν ψυχὴν ἡμῶν αἴρεις
  choice: membiarkan kami dalam ketidakpastian
  alternative: mengangkat jiwa kami atau membuat jiwa kami tergantung
  rationale: Ungkapan harfiah akan kabur dalam bahasa Indonesia. Makna idiomatis diberikan dalam teks utama, sedangkan citra sumber dicatat agar ambiguitas leksikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pronomina yang merujuk kepada Yesus dikapitalisasi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Penempatan catatan [a] langsung sesudah idiom dan [b] pada akhir ayat menghubungkan masing-masing catatan dengan pokok yang dijelaskannya.
