  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: id
  text: Karena itu, sebagian orang dari kerumunan itu, setelah mendengar perkataan ini, berkata, “Orang ini benar-benar Sang Nabi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sang Nabi” kemungkinan menunjuk kepada nabi seperti Musa yang dinantikan (lihat Ulangan 18:15), meskipun sebagian penafsir memahaminya secara lebih umum sebagai “nabi itu.”
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: sebagian orang dari antara orang banyak
  rationale: Frasa ini menunjukkan bahwa yang berbicara hanyalah sebagian dari kumpulan orang itu. Bentuk ini menyatakan makna partitif secara jelas dan alami.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata penghubung ini mengaitkan tanggapan orang banyak dengan perkataan Yesus sebelumnya dan menandai kelanjutan yang bersifat konsekuensial.
- source_word: ἀκούσαντες
  choice: setelah mendengar
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: τῶν λόγων τούτων
  choice: perkataan-perkataan itu
  rationale: λόγοι menunjuk pada ucapan Yesus yang baru saja didengar. Bentuk ulang mempertahankan nuansa jamak sumber.
- source_word: ἔλεγον
  choice: berkata
  rationale: Imperfek Yunani menggambarkan ujaran yang sedang berlangsung atau muncul di antara sebagian orang banyak. Bahasa Indonesia lazim memakai verba sederhana ini tanpa harus memaksakan penanda aspek.
- source_word: Οὗτός ἐστιν
  choice: Orang ini ... adalah
  rationale: Demonstrativa menunjuk langsung kepada Yesus. 'Orang ini' lebih wajar daripada terjemahan harfiah 'ini' untuk seorang pribadi dalam tuturan bahasa Indonesia.
- source_word: ἀληθῶς
  choice: benar-benar
  rationale: Pilihan ini menyampaikan penegasan bahwa identifikasi tersebut sungguh atau pasti benar dengan bahasa modern yang tetap bermartabat.
- source_word: ὁ προφήτης
  choice: Sang Nabi
  rationale: Artikel dan konteks Yohanes memberi ungkapan ini daya seperti gelar bagi tokoh yang dinantikan. 'Sang Nabi' menandai kekhususan itu tanpa menyamakannya secara eksplisit dengan Mesias.
theological_decisions:
- issue: Identitas yang tersirat dalam ὁ προφήτης
  choice: Sang Nabi
  alternative: nabi itu; seorang nabi; Sang Nabi sebagai sebutan yang secara eksplisit sama dengan Mesias
  rationale: Konteks kemungkinan mengacu kepada nabi seperti Musa yang dinantikan, tetapi ayat ini sendiri tidak mendefinisikan hubungan gelar tersebut dengan Mesias. Terjemahan mempertahankan ketegangan itu tanpa menjadikannya nabi biasa ataupun secara eksplisit menyamakannya dengan Mesias.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara hubungan logis, urutan tindakan, dan nuansa gelar dalam teks Yunani tetap dipertahankan.
