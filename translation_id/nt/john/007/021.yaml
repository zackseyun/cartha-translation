  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepada mereka, “Aku melakukan satu pekerjaan[a][b], dan kamu semua merasa heran.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan.” Kata Yunani ini dapat berarti keduanya, tetapi “pekerjaan” mempertahankan pemakaian istilah yang berulang dalam Injil Yohanes untuk tindakan-tindakan Yesus.
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan besar “satu pekerjaan” ini merujuk kembali pada tindakan Yesus menyembuhkan orang lumpuh pada hari Sabat dalam Yohanes 5:1–18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang lazim dan langsung untuk tindakan memberi tanggapan.
- source_word: εἶπεν
  choice: berkata
  rationale: Mempertahankan kedua verba dalam rumusan ἀπεκρίθη ... καὶ εἶπεν, yang secara harfiah dan wajar dapat diterjemahkan 'menjawab dan berkata'.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Menyatakan objek tak langsung datif secara alami dalam bahasa Indonesia.
- source_word: Ἓν
  choice: satu
  rationale: 'Mempertahankan penekanan pada jumlah: hanya satu pekerjaan menjadi penyebab reaksi mereka.'
- source_word: ἔργον
  choice: pekerjaan
  rationale: Mempertahankan istilah kunci Yohanes bagi tindakan-tindakan Yesus dan tetap wajar dalam bahasa Indonesia; 'perbuatan' juga mungkin.
- source_word: ἐποίησα
  choice: Aku melakukan
  rationale: Menyampaikan aoristus aktif secara lugas tanpa menambah nuansa yang tidak dinyatakan.
- source_word: πάντες
  choice: kamu semua
  rationale: Membuat cakupan seluruh kelompok serta bentuk orang kedua jamak pada verba berikutnya menjadi eksplisit.
- source_word: θαυμάζετε
  choice: merasa heran
  rationale: Mengungkapkan keheranan atau ketakjuban tanpa memastikan bahwa reaksinya sepenuhnya positif; bentuk kini Yunani dipertahankan secara idiomatis dalam konteks ujaran langsung.
theological_decisions:
- issue: Bobot khas Yohanes pada ἔργον
  choice: pekerjaan
  alternative: perbuatan
  rationale: Dalam Injil Yohanes, ἔργον berulang kali digunakan bagi tindakan Yesus dengan resonansi teologis. 'Pekerjaan' menjaga hubungan istilah itu tanpa memasukkan penafsiran tambahan ke dalam teks utama.
- issue: Rujukan implisit dari 'satu pekerjaan'
  choice: Tidak mengidentifikasi tindakan itu di dalam teks utama
  alternative: Menjelaskannya sebagai penyembuhan orang lumpuh pada hari Sabat
  rationale: Ayat ini sendiri tidak menyebut tindakan tersebut secara eksplisit. Kemungkinan rujukannya dicatat dalam catatan kaki agar hubungan dengan Yohanes 5:1–18 tidak dinaikkan menjadi kepastian tekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Rumusan 'menjawab dan berkata' sengaja mempertahankan struktur ganda sumber Yunani. Pronomina 'Aku' dan 'kamu' dipakai secara alami dalam ujaran langsung; 'merasa heran' menjaga kemungkinan nuansa takjub maupun bingung.
