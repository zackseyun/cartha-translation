id: JHN.7.19
reference: John 7:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: id
  text: Bukankah Musa telah memberikan hukum Taurat kepada kamu? Namun, tidak seorang pun di antara kamu menaatinya.[a] Mengapa kamu berusaha membunuh Aku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melakukan hukum itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Bukankah ... telah memberikan
  rationale: Pertanyaan dengan Οὐ mengharapkan jawaban yang membenarkan. Bentuk perfektum δέδωκεν dinyatakan secara alami dengan “telah memberikan”, yang juga menandakan bahwa pemberian itu tetap relevan.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: τὸν νόμον
  choice: hukum Taurat
  rationale: Dalam konteks penyebutan Musa, νόμος menunjuk pada hukum yang diberikan melalui Musa. “Hukum Taurat” merupakan padanan Indonesia yang jelas tanpa memperluas isi teks.
- source_word: καὶ
  choice: Namun
  rationale: 'Kata penghubung ini secara harfiah sering berarti “dan”, tetapi di sini menghubungkan dua pernyataan yang berlawanan: hukum diberikan, tetapi tidak ditaati.'
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: tidak seorang pun di antara kamu
  rationale: Padanan ini mempertahankan penyangkalan menyeluruh dan menunjukkan bahwa yang disapa adalah suatu kelompok.
- source_word: ποιεῖ τὸν νόμον
  choice: menaatinya
  rationale: Secara harfiah berarti “melakukan hukum itu”. Dalam bahasa Indonesia masa kini, “menaati hukum Taurat” menyampaikan maksud menjalankan atau mematuhi hukum dengan lebih alami; akhiran “-nya” menghindari pengulangan.
- source_word: τί
  choice: Mengapa
  rationale: Dalam konstruksi ini τί menanyakan alasan atau tujuan, sehingga “Mengapa” adalah padanan Indonesia yang langsung dan alami.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: kamu berusaha membunuh
  rationale: ζητεῖτε menyatakan pencarian atau upaya yang sedang berlangsung, sedangkan ἀποκτεῖναι berarti membunuh. “Berusaha membunuh” alami dalam bahasa Indonesia dan mempertahankan unsur niat/upaya.
theological_decisions:
- issue: Rujukan “hukum”
  choice: Hukum Taurat yang diberikan melalui Musa
  alternative: Hukum dalam arti moral yang umum
  rationale: Penyebutan Musa secara eksplisit menentukan rujukannya sebagai hukum Musa/Taurat, bukan hukum dalam arti abstrak.
- issue: Cakupan tuduhan “tidak seorang pun”
  choice: Mempertahankan pernyataan menyeluruh Yesus tanpa pelunakan
  alternative: Mengungkapkannya sebagai kegagalan umum atau ketidaktaatan sebagian orang
  rationale: οὐδεὶς ἐξ ὑμῶν bersifat tegas dan menyeluruh. Terjemahan tidak menambahkan batasan teologis yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kamu” dipertahankan sebagai sapaan kelompok yang wajar dalam wacana Alkitabiah; frasa “di antara kamu” memperjelas sifat jamaknya. “Aku” memakai kapital sesuai konvensi penerbitan Alkitab bahasa Indonesia untuk ucapan Yesus.
