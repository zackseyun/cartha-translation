  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: id
  text: Hari raya orang Yahudi, yaitu Hari Raya Pondok Daun[a], sudah dekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Hari Raya Pondok-Pondok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini berfungsi sebagai penghubung wacana ringan. Dalam bahasa Indonesia, peralihan narasi sudah alami tanpa kata penghubung tambahan; menerjemahkannya sebagai “sekarang” akan memberi kesan waktu yang tidak dinyatakan secara eksplisit.
- source_word: ἐγγὺς
  choice: sudah dekat
  rationale: Menyatakan kedekatan waktu secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἑορτὴ
  choice: hari raya
  rationale: Istilah ini lazim untuk perayaan keagamaan dan sesuai dengan konteks perayaan Yahudi.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Genitif ini mengidentifikasi perayaan tersebut sebagai hari raya bangsa Yahudi. Ungkapan ini tepat secara kontekstual dan tidak dimaksudkan sebagai pernyataan polemis.
- source_word: σκηνοπηγία
  choice: Hari Raya Pondok Daun
  rationale: Nama konvensional yang dikenal luas dalam bahasa Indonesia bagi perayaan yang berkaitan dengan tinggal dalam pondok-pondok sementara; makna harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pengungkapan τῶν Ἰουδαίων dalam sebutan suatu perayaan
  choice: hari raya orang Yahudi
  alternative: hari raya Yahudi
  rationale: Bentuk ini mempertahankan hubungan genitif sumber secara jelas tanpa menyiratkan nada polemis.
- issue: Penamaan σκηνοπηγία
  choice: Hari Raya Pondok Daun
  alternative: Hari Raya Pondok-Pondok
  rationale: Nama konvensional dipakai agar mudah dikenali, sementara catatan kaki menjaga transparansi terhadap arti leksikal yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan aposisional “yaitu” memperjelas bahwa Hari Raya Pondok Daun adalah nama hari raya yang dimaksud.
