translation:
  language: id
  text: Sebab bahkan saudara-saudara-Nya pun tidak percaya kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab bahkan saudara-saudara-Nya pun pada waktu itu tidak percaya kepada-Nya.” Bentuk imperfek kata kerja Yunani dapat menandakan keadaan yang berlangsung pada masa lampau.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: sendiri pun tidak
  rationale: Dalam konteks ini, οὐδὲ memberi penekanan ‘bahkan ... pun tidak’. Susunan ‘saudara-saudara-Nya sendiri pun tidak’ menyampaikan tekanan itu secara alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γὰρ menjelaskan alasan bagi pernyataan sebelumnya; ‘Sebab’ mempertahankan hubungan penjelas tersebut.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara-Nya
  rationale: Bentuk maskulin jamak ini mengacu pada saudara-saudara laki-laki atau kerabat laki-laki Yesus dalam narasi. Istilah Indonesia ‘saudara-saudara-Nya’ tetap wajar dan tidak memaksakan penentuan hubungan biologis yang tidak dinyatakan oleh istilah Yunani itu sendiri.
- source_word: ἐπίστευον
  choice: percaya
  rationale: Imperfek Yunani menyatakan keadaan atau tindakan pada masa lampau yang dapat dipahami sebagai berkelanjutan atau berciri kebiasaan. Dalam narasi Indonesia, ‘tidak percaya’ paling alami; kemungkinan aspek berkelanjutan dicatat dalam catatan kaki.
- source_word: εἰς αὐτόν
  choice: kepada-Nya
  rationale: Dengan πιστεύω, εἰς menyatakan kepercayaan yang diarahkan kepada seseorang. ‘Percaya kepada-Nya’ merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Makna πιστεύω εἰς αὐτόν dalam Injil Yohanes
  choice: kepercayaan pribadi yang diarahkan kepada Yesus
  alternative: memercayai perkataan atau klaim-Nya saja
  rationale: Ungkapan Yohanes πιστεύω εἰς lazimnya menunjukkan percaya kepada atau menaruh kepercayaan pada Yesus. Terjemahan ini mempertahankan klaim tersebut tanpa menjelaskan alasan ketidakpercayaan mereka atau menarik kesimpulan doktrinal tambahan.
- issue: Identitas οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara-Nya
  alternative: saudara-saudara kandung-Nya; kerabat-kerabat-Nya
  rationale: ἀδελφοί dapat menunjuk saudara laki-laki dan dalam pemakaian tertentu kerabat. Teks tidak merinci hubungan biologis mereka, sehingga terjemahan umum ‘saudara-saudara-Nya’ menjaga ketegangan penafsiran itu.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Kata ‘sendiri’ menolong menyampaikan penekanan οὐδὲ tanpa membuat kalimat terasa kaku.
