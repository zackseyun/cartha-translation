id: JHN.7.14
reference: John 7:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: id
  text: Ketika hari raya itu sudah mencapai pertengahan,[a] Yesus naik ke kompleks Bait Allah[b] dan mengajar di sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ketika hari raya itu berada di pertengahan.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang dipakai di sini menunjuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam.
    reason: cultural_note
  - marker: c
    text: 'Atau: “sedang mengajar.” Bentuk kata kerja Yunani dapat menekankan tindakan yang sedang berlangsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: sudah
  rationale: Menandai bahwa titik waktu tersebut telah tercapai dalam berlangsungnya hari raya.
- source_word: δὲ
  choice: tidak dinyatakan dengan kata penghubung tersendiri
  rationale: Partikel ini menandai peralihan naratif ringan; dalam bahasa Indonesia, peralihan itu sudah terasa alami melalui anak kalimat waktu, sedangkan “namun” akan memberi kesan pertentangan yang terlalu kuat.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: ketika hari raya itu sudah mencapai pertengahan
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu, dan μεσούσης menunjukkan bahwa hari raya telah berada pada titik tengahnya.
- source_word: ἀνέβη
  choice: naik
  rationale: Mempertahankan nuansa arah ἀναβαίνω, yakni bergerak naik menuju kawasan Bait Allah.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: εἰς τὸ ἱερὸν
  choice: ke kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kawasan atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam; “kompleks” membuat cakupan tempat itu jelas.
- source_word: ἐδίδασκεν
  choice: mengajar di sana
  rationale: Bentuk imperfek menggambarkan kegiatan yang sedang berlangsung. Ungkapan Indonesia ini alami dalam urutan naratif dan tidak menambahkan nuansa bahwa Yesus baru mulai mengajar.
theological_decisions:
- issue: Cakupan tempat yang dimaksud oleh ἱερόν
  choice: kompleks Bait Allah
  alternative: Bait Allah
  rationale: Pilihan ini mempertahankan pembedaan leksikal antara ἱερόν, yaitu kawasan atau pelataran Bait Allah, dan ναός, yaitu bangunan kudus atau ruang suci bagian dalam.
- issue: Aspek imperfek dalam ἐδίδασκεν
  choice: mengajar di sana
  alternative: sedang mengajar; mulai mengajar
  rationale: Terjemahan utama mempertahankan gambaran tindakan yang berlangsung tanpa memaksakan nuansa ingresif “mulai”, yang tidak dinyatakan secara eksplisit oleh bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Hari raya” mengikuti pemakaian umum untuk ἑορτή; “kompleks Bait Allah” memberi ketepatan budaya tanpa istilah teknis yang sulit. Susunan kalimat tetap ringkas dan bernada naratif-dignified.
