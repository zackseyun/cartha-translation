  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: id
  text: Jangan menghakimi menurut apa yang tampak, tetapi hakimilah dengan adil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Jangan menghakimi
  rationale: Imperatif kini dengan μή menyatakan larangan. Bentuk ini ringkas dan wajar tanpa memaksakan arti aspektual ‘berhentilah menghakimi’.
- source_word: κατ’ ὄψιν
  choice: berdasarkan apa yang tampak
  rationale: Ungkapan ini menunjuk pada penilaian yang didasarkan pada tampilan luar atau kesan permukaan. Terjemahan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada wajah atau penglihatan harfiah.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Konjungsi adversatif ini menandai pertentangan langsung antara cara menghakimi yang dilarang dan yang diperintahkan.
- source_word: τὴν δικαίαν κρίσιν
  choice: dengan penghakiman yang benar
  rationale: Secara harfiah frasa ini menjadi objek dari ‘hakimilah’, tetapi konstruksi ‘hakimilah penghakiman yang benar’ tidak alami. Pemakaian ‘dengan’ menyampaikan cara atau ukuran penghakiman sambil mempertahankan nomina κρίσις dan kualitas moral δικαία.
- source_word: κρίνετε
  choice: hakimilah
  rationale: Pengulangan akar kata ‘hakim’ mempertahankan paralelisme retoris teks Yunani antara larangan dan perintah.
theological_decisions:
- issue: Makna δικαία dalam konteks etis-yudisial
  choice: yang benar
  alternative: yang adil
  rationale: ‘Yang benar’ mempertahankan cakupan moral δικαία dan cocok dengan kontras antara kesan lahiriah dan penilaian yang selaras dengan kebenaran. ‘Yang adil’ juga mungkin, tetapi dapat terdengar lebih sempit sebagai keadilan prosedural.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘menghakimi/hakimilah’ sengaja dipertahankan untuk mencerminkan pengulangan κρίνετε dalam teks sumber.
