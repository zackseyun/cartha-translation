  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: id
  text: Namun, tidak seorang pun berbicara secara terbuka tentang Dia karena takut kepada orang-orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus dalam konteks ini, “para pemimpin Yahudi” atau “para penguasa Yahudi di Yudea.” Dalam Injil Yohanes, “orang-orang Yahudi” dapat merujuk kepada orang Yahudi pada umumnya atau, dalam beberapa bagian, kepada para penguasa yang berpusat di Yerusalem dan menentang Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Menyampaikan kata ganti negatif yang mencakup semua orang dalam kerumunan dengan bentuk Indonesia yang baku dan wajar.
- source_word: μέντοι
  choice: Namun
  rationale: Menandai pertentangan ringan dengan perbedaan pendapat yang disebutkan sebelumnya.
- source_word: παρρησίᾳ
  choice: secara terbuka
  rationale: Dalam konteks ini menunjuk pada berbicara tanpa menyembunyikan pendapat di hadapan umum; frasa ini juga mempertahankan kemungkinan nuansa keterusterangan atau keberanian.
- source_word: ἐλάλει
  choice: berbicara
  rationale: Bahasa Indonesia tidak wajib menandai aspek imperfektif pada verba; dalam konteks naratif ini bentuk sederhana tetap dapat menyatakan tindakan yang sedang atau berulang berlangsung.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: Padanan idiomatis bagi περί dengan genitif; huruf kapital mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: διὰ τὸν φόβον
  choice: karena takut
  rationale: Menyatakan sebab secara alami dalam bahasa Indonesia tanpa mengubah konstruksi itu menjadi penjelasan yang lebih spesifik daripada teks sumber.
- source_word: τῶν Ἰουδαίων
  choice: orang-orang Yahudi
  rationale: Mempertahankan keluasan leksikal Ἰουδαῖοι, sementara catatan kaki menjelaskan bahwa dalam konteks Yohanes istilah ini dapat secara khusus menunjuk pada para pemimpin atau penguasa Yahudi di Yudea.
theological_decisions:
- issue: Rujukan τῶν Ἰουδαίων dalam narasi Yohanes
  choice: orang-orang Yahudi dalam teks utama, disertai catatan kaki kontekstual
  alternative: para pemimpin Yahudi; para penguasa Yahudi di Yudea; orang-orang Yudea
  rationale: Terjemahan utama mempertahankan keluasan dan ketegangan istilah Yunani tanpa mempersempit rujukannya secara diam-diam. Catatan menjelaskan kemungkinan rujukan kontekstual agar frasa ini tidak disalahpahami sebagai tuduhan terhadap seluruh orang Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan sebab maupun ambiguitas rujukan istilah Ἰουδαῖοι.
