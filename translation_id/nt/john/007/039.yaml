  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: id
  text: Ia mengatakan hal ini tentang Roh[a], yang akan diterima oleh orang-orang yang percaya kepada-Nya; sebab Roh itu belum ada[b], karena Yesus belum dimuliakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Roh ilahi; teks Yunani tidak menambahkan kata “Kudus”.
    reason: Menjelaskan kapitalisasi dan identitas rujukan tanpa menambah kata ke dalam teks utama.
  - marker: b
    text: Atau, dengan menyatakan maksudnya secara lebih eksplisit, “Roh itu belum diberikan.” Teks Yunani secara harfiah berbunyi, “Roh itu belum ada,” dan menghubungkannya dengan kenyataan bahwa Yesus belum dimuliakan.
    reason: Menjaga ungkapan Yunani yang sulit dalam teks utama sambil menyediakan alternatif interpretatif yang umum.
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: Roh / Roh itu
  rationale: Konteks menunjuk kepada Roh ilahi yang akan diterima orang percaya. Huruf kapital menandai rujukan tersebut tanpa menambahkan kata 'Kudus', yang tidak terdapat dalam teks Yunani. Dalam klausa kedua, 'Roh itu' menjaga kesinambungan rujukan secara alami dalam bahasa Indonesia.
- source_word: οὗ
  choice: yang
  rationale: Pronomina relatif ini merujuk kembali kepada Roh. Bahasa Indonesia memakai 'yang' secara wajar tanpa perlu menentukan kategori gramatikal personal atau nonpersonal.
- source_word: ἔμελλον λαμβάνειν
  choice: akan diterima
  rationale: Gabungan μέλλω dan infinitif menyatakan penerimaan yang masih akan berlangsung dari sudut pandang narasi. 'Akan diterima' alami dalam bahasa Indonesia dan mempertahankan orientasi prospektifnya tanpa memperkerasnya menjadi takdir.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: orang-orang yang percaya kepada-Nya
  rationale: Ungkapan ini menyampaikan konstruksi khas Yohanes πιστεύω εἰς. Bentuk partisip aoris tidak harus diubah menjadi bentuk lampau tersendiri dalam bahasa Indonesia; konteks sudah menunjukkan bahwa mereka percaya sebelum menerima Roh.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: sebab Roh itu belum ada
  rationale: Terjemahan ini mengikuti secara dekat dan sengaja mempertahankan ketegangan ungkapan Yunani yang ringkas, tanpa menyisipkan 'diberikan' atau 'hadir' ke dalam teks utama.
- source_word: οὐδέπω ἐδοξάσθη
  choice: belum dimuliakan
  rationale: Bentuk pasif dan hubungan waktunya tersampaikan secara alami dengan 'belum dimuliakan'; bahasa Indonesia tidak memerlukan bentuk pluperfek tersendiri.
theological_decisions:
- issue: Cara menerjemahkan οὔπω γὰρ ἦν πνεῦμα tanpa menyiratkan bahwa Roh tidak memiliki keberadaan sebelum pemuliaan Yesus.
  choice: 'Mempertahankan ketegangan harfiah dalam teks utama: ''sebab Roh itu belum ada'', lalu menjelaskan kemungkinan maksudnya dalam catatan kaki.'
  alternative: sebab Roh itu belum diberikan; sebab Roh itu belum hadir
  rationale: Teks Yunani tidak memuat kata 'diberikan' atau 'hadir'. Karena itu, teks utama tidak menyelesaikan secara diam-diam ungkapan yang sengaja ringkas tersebut; catatan kaki memberi pembaca penjelasan yang lazim tanpa menjadikannya bagian dari terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dijaga dekat dengan sumber, tetapi tetap wajar bagi pembaca umum. Kapitalisasi 'Roh' dan pronomina '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan ilahi.
