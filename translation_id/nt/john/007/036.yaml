base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: id
  text: '“Apa maksud perkataan[a] yang Dia ucapkan ini: ‘Kalian akan mencari Aku dan tidak akan menemukan Aku, dan kalian tidak dapat datang ke tempat Aku berada’[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani λόγος di sini dapat berarti “perkataan,” “ucapan,” “pernyataan,” atau “pesan,” sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di tempat Aku berada.” Sebagian terjemahan memakai “ke tempat Aku pergi,” tetapi teks Yunani di sini menggunakan bentuk kini, “Aku berada.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐστιν ὁ λόγος οὗτος ὃν εἶπε
  choice: Apa maksud perkataan yang Dia ucapkan ini
  rationale: Ungkapan ini menyampaikan pertanyaan tentang isi atau makna ucapan Yesus secara wajar dalam bahasa Indonesia. Kata “perkataan” mempertahankan acuan λόγος pada ucapan yang baru saja disampaikan, sedangkan “apa maksud” menghindari bentuk harfiah yang kaku, “Apakah perkataan ini?”
- source_word: Ζητήσετέ με
  choice: Kalian akan mencari Aku
  rationale: “Mencari” adalah padanan alami bagi ζητέω dalam konteks usaha menemukan seseorang. “Kalian” menandai bentuk jamak ὑμεῖς secara jelas dalam bahasa Indonesia modern.
- source_word: οὐχ εὑρήσετε
  choice: tetapi tidak akan menemukan Aku
  rationale: Kata “tetapi” mengungkapkan pertentangan pragmatis antara mencari dan tidak menemukan, sementara “Aku” diulangi demi kejelasan dalam bahasa Indonesia.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: ke tempat Aku berada
  rationale: Terjemahan ini mempertahankan bentuk kini εἰμί, “Aku berada,” dan tidak mengubahnya menjadi “Aku pergi.” Penambahan “tempat” membuat hubungan dengan verba “datang” alami dalam bahasa Indonesia tanpa menentukan lokasi tersebut.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: kalian tidak dapat datang
  rationale: “Tidak dapat” secara langsung mempertahankan gagasan ketidakmampuan dalam δύνασθε, bukan sekadar ketidakmauan atau larangan.
theological_decisions:
- issue: Bentuk kini dalam ucapan Yesus, ὅπου εἰμὶ ἐγώ
  choice: ke tempat Aku berada
  alternative: ke tempat Aku pergi
  rationale: Teks Yunani memakai εἰμί dalam bentuk kini, bukan verba “pergi.” Mempertahankan “Aku berada” menjaga ketegangan khas Injil Yohanes mengenai keberadaan, asal, dan relasi Yesus tanpa menyempitkannya menjadi tujuan perjalanan pada masa depan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Kalian” dipakai untuk menyatakan orang kedua jamak secara jelas; “Dia” dan “Aku” mempertahankan acuan personal dalam dialog. Susunan kutipan dibuat sebagai satu ucapan berkesinambungan, sesuai struktur Yunani.
