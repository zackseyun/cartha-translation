id: JHN.7.38
reference: John 7:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: id
  text: Orang yang percaya kepada-Ku—seperti yang dikatakan Kitab Suci—dari dalam dirinya[a][b] akan mengalir sungai-sungai air hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari dalam Dia”; sebagian orang memahami kata “dirinya” mengacu kepada Mesias, bukan kepada orang yang percaya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dari perutnya” atau “dari rahimnya”; di sini kemungkinan besar merupakan ungkapan kiasan untuk bagian terdalam diri seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Orang yang percaya
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk kepada seseorang yang dicirikan oleh iman. Bentuk ini mempertahankan acuan tunggal dan sifat umum/berkelanjutan tanpa menjadi kaku.
- source_word: εἰς ἐμέ
  choice: kepada-Ku
  rationale: Bersama πιστεύω, εἰς menyatakan kepercayaan yang diarahkan kepada seseorang. Dalam bahasa Indonesia, 'percaya kepada-Ku' alami dan tepat.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: seperti yang dikatakan Kitab Suci
  rationale: Ungkapan ini memperkenalkan kesaksian Kitab Suci. Bentuk pasif idiomatis bahasa Indonesia tetap mencerminkan verba lampau Yunani tanpa memaksakan penandaan waktu yang tidak alami.
- source_word: ποταμοὶ
  choice: sungai-sungai
  rationale: Bentuk jamak ποταμοί berarti sungai-sungai dan mempertahankan gambaran kelimpahan, bukan sekadar aliran kecil.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: dari dalam dirinya
  rationale: κοιλία secara harfiah berarti 'perut' atau 'rahim', tetapi di sini menunjuk secara kiasan kepada bagian terdalam seseorang. 'Dari dalam dirinya' alami dalam bahasa Indonesia, mempertahankan metafora sumber internal, dan tidak terlalu anatomis.
- source_word: ῥεύσουσιν
  choice: akan mengalir
  rationale: Ini menerjemahkan indikatif aktif futur secara langsung tanpa menambahkan intensitas seperti 'memancar deras'.
- source_word: ὕδατος ζῶντος
  choice: air hidup
  rationale: Ungkapan Yohanes ini mempertahankan metafora harfiah sekaligus gema teologisnya; parafrasa seperti 'air yang memberi hidup' akan mempersempit maknanya.
theological_decisions:
- issue: Acuan αὐτοῦ dalam frasa 'dari dalam dirinya'
  choice: Kata ganti dipahami terutama mengacu kepada orang yang percaya.
  alternative: Kata ganti dapat dipahami mengacu kepada Mesias/Yesus sebagai sumber air hidup.
  rationale: Pendahulu gramatikal terdekat adalah 'orang yang percaya', dan Yohanes 7:39 menghubungkan air itu dengan Roh yang akan diterima orang-orang percaya. Namun, kemungkinan bahwa Mesias adalah acuannya tetap dicatat karena sintaksis dan cara menghubungkan kutipan Kitab Suci memungkinkan pembacaan tersebut.
- issue: Makna kiasan κοιλία
  choice: dalam dirinya
  alternative: perutnya; rahimnya
  rationale: Terjemahan anatomi yang ketat dapat menyesatkan pembaca modern. 'Dalam dirinya' menyampaikan pusat batin seseorang sambil tetap menjaga catatan tentang arti harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Tanda pisah mengapit klausa kutipan agar hubungan sintaksis tetap terbaca tanpa meniadakan ketegangan mengenai acuan kata ganti. Kapitalisasi '-Ku' mengikuti kebiasaan umum bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
