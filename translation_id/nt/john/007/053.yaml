translation:
  language: id
  text: Lalu[a] masing-masing pulang ke rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini mengawali kisah tentang perempuan yang kedapatan berzina (Yohanes 7:53–8:11). Seluruh bagian itu tidak terdapat dalam naskah-naskah Yunani paling awal yang masih ada, termasuk papirus abad ke-3 serta Kodeks Sinaiticus dan Vaticanus dari abad ke-4, dan juga tidak terdapat dalam terjemahan Koptik dan Suryani awal. Bagian ini terdapat dalam Kodeks Bezae dari abad ke-5, tradisi Latin, dan mayoritas naskah Bizantin yang lebih kemudian. Dalam beberapa naskah, kisah ini muncul di tempat lain, misalnya sesudah Yohanes 21:25 atau Lukas 21:38. Perbedaan letak ini menunjukkan bahwa transmisi kisah tersebut dalam tradisi naskah tidak seragam dan mungkin pernah beredar secara terpisah. Bagian ini dipertahankan di sini karena telah diterima dan dihargai secara teologis serta pastoral selama sekitar 1.500 tahun dalam pembacaan umat Kristen.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi; “Lalu” lebih alami dalam bahasa Indonesia daripada “Dan” pada awal kalimat, tanpa menghilangkan fungsi penghubungnya.
- source_word: ἐπορεύθη
  choice: pulang
  rationale: Secara dasar verba ini berarti pergi atau berjalan, tetapi tujuan εἰς τὸν οἶκον αὐτοῦ menunjukkan gerak kembali ke rumah; “pulang” menyampaikan idiom tersebut secara wajar.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Bentuk tunggal ini menekankan bahwa setiap orang pergi sendiri-sendiri; “masing-masing” mempertahankan nuansa distributif itu.
- source_word: οἶκον
  choice: rumahnya
  rationale: Dalam frasa εἰς τὸν οἶκον αὐτοῦ, οἶκος menunjuk tempat tinggal orang itu, sehingga “rumahnya” merupakan padanan alami dan tepat.
theological_decisions:
- issue: Status tekstual Yohanes 7:53–8:11
  choice: Ayat dipertahankan dalam teks utama dengan catatan tekstual
  alternative: Menghilangkan ayat dari teks utama atau menempatkannya hanya dalam catatan
  rationale: Sumber edisi Bizantin yang ditetapkan memuat ayat ini, sementara bukti naskah mengenai perikop tersebut sangat beragam. Mempertahankannya dengan catatan memungkinkan pembaca melihat tradisi teks yang digunakan sekaligus mengetahui ketidakpastian tekstualnya tanpa menyelesaikannya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan “masing-masing pulang ke rumahnya” alami bagi pembaca umum serta mempertahankan penekanan distributif teks Yunani.
