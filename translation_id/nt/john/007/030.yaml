source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: id
  text: Maka, mereka berusaha menangkap Dia[a], tetapi tidak seorang pun menangkap Dia, sebab saat-Nya belum tiba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menahan Dia.” Kata Yunani ini dapat berarti “menangkap” atau “memegang”; dalam konteks ini tindakan tersebut kemungkinan mengacu pada penahanan-Nya.
    reason: lexical_alternative
  - marker: b
    text: “Saat-Nya” merupakan ungkapan yang berulang dalam Injil Yohanes untuk waktu yang ditetapkan bagi misi Yesus, khususnya penderitaan, kematian, kebangkitan, dan pemuliaan-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: mereka berusaha
  rationale: Bentuk imperfek menunjukkan upaya yang sedang berlangsung atau berulang; 'berusaha' menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat inferensial dari perkataan sebelumnya.
- source_word: πιάσαι
  choice: menangkap
  rationale: Kata ini berarti menangkap atau memegang; dalam konteks ini 'menangkap' mempertahankan makna tindakan fisik sekaligus memungkinkan implikasi penahanan tanpa menjadikannya istilah hukum formal.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Padanan baku dan jelas bagi kata ganti negatif ini.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: menyentuh Dia untuk menangkap-Nya
  rationale: Ungkapan harfiahnya adalah 'meletakkan tangan atas Dia', tetapi maksud kontekstualnya ialah melakukan tindakan fisik untuk menangkap. Rumusan ini alami dan menghindari kesan bahwa yang dimaksud sekadar sentuhan biasa.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan mengapa tidak seorang pun bertindak; 'sebab' jelas dan sesuai dengan register naratif yang bermartabat.
- source_word: οὔπω
  choice: belum
  rationale: Padanan temporal yang langsung dan alami.
- source_word: ἐληλύθει
  choice: tiba
  rationale: Bentuk pluperfek menyatakan bahwa hingga saat itu waktu tersebut belum datang; bahasa Indonesia secara alami mengungkapkannya dengan 'belum tiba'.
- source_word: ἡ ὥρα αὐτοῦ
  choice: saat-Nya
  rationale: Mempertahankan istilah waktu yang sarat makna dalam Injil Yohanes. 'Saat' lebih alami daripada 'jam' untuk waktu yang ditetapkan, tanpa menjabarkan maknanya secara terlalu sempit.
theological_decisions:
- issue: Makna ἡ ὥρα αὐτοῦ dalam konteks Yohanes
  choice: Mempertahankan ungkapan ringkas 'saat-Nya' dalam teks utama.
  alternative: waktu-Nya; waktu yang ditetapkan bagi kematian-Nya
  rationale: Ungkapan ini menunjuk pada waktu yang ditetapkan dalam misi Yesus, terutama rangkaian penderitaan, kematian, kebangkitan, dan pemuliaan-Nya. Ayat ini tidak membatasinya hanya pada kematian atau penangkapan, sehingga ketegangan teologisnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Kapitalisasi pronomina bagi Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Ungkapan idiomatis Yunani dijelaskan secara alami agar tidak disalahpahami sebagai sentuhan biasa.
