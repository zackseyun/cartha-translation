id: JHN.7.42
reference: John 7:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: id
  text: Bukankah Kitab Suci mengatakan bahwa Mesias[a] datang dari keturunan Daud dan dari Betlehem, desa tempat Daud berada?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunaninya adalah ὁ χριστός.
    reason: Mencatat padanan tradisional bagi gelar Yunani dan mempertahankan transparansi istilah.
lexical_decisions:
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Dalam pemakaian Yohanes, bentuk tunggal ini menunjuk pada tulisan suci yang berwibawa; “Kitab Suci” merupakan padanan Indonesia yang alami.
- source_word: εἶπεν
  choice: mengatakan
  rationale: Dalam pertanyaan retoris ini, bentuk lampau Yunani merujuk pada pernyataan Kitab Suci yang tetap berlaku; bahasa Indonesia secara alami memakai bentuk tak bertanda waktu “mengatakan”.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: dari keturunan Daud
  rationale: σπέρμα di sini menyatakan garis keturunan, bukan benih secara harfiah.
- source_word: ἀπὸ Βηθλέεμ
  choice: dari Betlehem
  rationale: ἀπό menandai asal; “dari Betlehem” tepat dan alami.
- source_word: τῆς κώμης
  choice: desa
  rationale: κώμη menunjuk pada permukiman kecil; “desa” mempertahankan pembedaan leksikalnya dari kota.
- source_word: ὅπου ἦν Δαυίδ
  choice: tempat Daud dahulu tinggal
  rationale: Ungkapan Yunani secara harfiah berarti “tempat Daud dahulu berada.” “Dahulu tinggal” menyampaikan maksud lokal ungkapan itu secara wajar dalam bahasa Indonesia tanpa menjadikannya pernyataan tentang tempat kelahiran.
- source_word: ἔρχεται
  choice: datang
  rationale: Bentuk kini menyatakan asal Mesias menurut pengharapan yang dikutip; “datang dari” mempertahankan citra verbal sumber dan tetap alami.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Dalam perdebatan mengenai asal-usul tokoh yang dinantikan orang Yahudi, Χριστός berfungsi sebagai gelar, sehingga diterjemahkan “Mesias,” bukan diperlakukan sebagai nama diri.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Konteks membahas gelar raja-penyelamat yang dinantikan dan asal-usulnya. “Mesias” menyatakan fungsi gelar tersebut, sedangkan “Kristus” dicatat sebagai padanan tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Bukankah” mempertahankan pertanyaan retoris yang mengharapkan jawaban ya; “dahulu” memperjelas nilai lampau ἦν tanpa membuat kalimat terasa janggal.
