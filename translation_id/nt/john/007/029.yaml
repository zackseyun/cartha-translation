base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: id
  text: Aku mengenal Dia,[a] sebab Aku berasal dari Dia,[b] dan Dialah yang telah mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku tahu tentang Dia.” Kata Yunani yang dipakai dapat berarti mengetahui, tetapi dalam konteks ini “mengenal” lebih baik menyatakan pengenalan pribadi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bahwa Aku berasal dari Dia.” Kata Yunani yang diterjemahkan “sebab” juga dapat memperkenalkan isi pernyataan dengan arti “bahwa.” Ungkapan “berasal dari Dia” dapat pula diterjemahkan “datang dari Dia” atau “berasal dari hadirat-Nya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Kata ganti subjek yang dinyatakan secara eksplisit memberi penekanan pada pengakuan Yesus; bentuk “Aku” juga mengikuti pemakaian wajar dalam tuturan langsung Yesus.
- source_word: οἶδα
  choice: mengenal
  rationale: Dalam konteks relasi pribadi dengan Bapa, “mengenal” lebih tepat dan alami daripada sekadar “mengetahui,” sambil tetap menyatakan keadaan kini.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti ini merujuk kepada Bapa dalam konteks; “Dia” mempertahankan rujukan personal tanpa menambahkan penjelasan ke dalam teks.
- source_word: ὅτι
  choice: sebab
  rationale: Konjungsi ini paling mungkin menyatakan alasan Yesus mengenal Dia. “Sebab” menyampaikan hubungan kausal dengan bahasa yang ringkas dan bermartabat.
- source_word: παρ’ αὐτοῦ
  choice: dari Dia
  rationale: παρά dengan genitif menyatakan sumber atau asal. “Dari Dia” mempertahankan keluasan makna tersebut tanpa mempersempitnya menjadi lokasi atau sekadar keberangkatan.
- source_word: εἰμι
  choice: Aku berasal
  rationale: Secara harfiah εἰμι berarti “Aku ada/adalah,” tetapi dalam gabungan παρ’ αὐτοῦ εἰμι, bahasa Indonesia alami memerlukan ungkapan “Aku berasal dari Dia” untuk menyatakan sumber atau asal tanpa mengubahnya menjadi verba kedatangan.
- source_word: κἀκεῖνός
  choice: dan Dialah
  rationale: Gabungan καί dan ἐκεῖνος diterjemahkan secara alami sebagai “dan Dialah”; partikel -lah secara wajar mencerminkan sifat penunjuk dan penekanan pada subjek.
- source_word: με
  choice: Aku
  rationale: Sebagai objek ἀπέστειλεν, kata ganti orang pertama dinyatakan dengan “Aku” menurut konvensi kapitalisasi untuk tuturan Yesus.
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: “Mengutus” menangkap unsur pengiriman dengan mandat dalam tema misi Yohanes dan lebih tepat daripada “mengirim” dalam konteks ini; bentuk lampau Yunani tidak perlu diberi penanda waktu terpisah dalam bahasa Indonesia.
theological_decisions:
- issue: Makna hubungan Yesus dengan Bapa dalam παρ’ αὐτοῦ εἰμι
  choice: Aku berasal dari Dia
  alternative: Aku datang dari Dia; Aku berada di sisi-Nya
  rationale: Pilihan ini menyatakan sumber atau asal sambil mempertahankan kedalaman dan ketegangan teologis ungkapan Yunani. Terjemahan tidak membatasinya hanya pada tindakan datang, lokasi, atau misi.
- issue: Fungsi ὅτι
  choice: sebab
  alternative: bahwa
  rationale: 'Konteks paling mendukung hubungan kausal: Yesus mengenal Bapa karena Ia berasal dari-Nya. Namun, kemungkinan bahwa ὅτι memperkenalkan isi pernyataan tetap dicatat dalam catatan kaki agar ambiguitas Yunani tidak dihapus.'
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Mengenal” dipilih untuk relasi personal; “berasal dari Dia” menjaga gagasan sumber atau asal; dan “Dialah yang mengutus Aku” memberi penekanan alami tanpa terdengar kaku. Semua penanda catatan kaki dicantumkan dalam teks utama.
