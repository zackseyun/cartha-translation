  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: id
  text: Jadi Yesus menjawab mereka, “Ajaran-Ku bukan milik-Ku, melainkan milik Dia yang mengutus Aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς
  choice: Maka Yesus menjawab mereka
  rationale: “Menjawab” secara alami menyatakan tanggapan terhadap pembicaraan sebelumnya; “maka” mempertahankan fungsi οὖν sebagai penghubung alur dan simpulan tanpa terdengar terlalu kaku.
- source_word: καὶ εἶπεν
  choice: kata-Nya
  rationale: Unsur “dan berkata” dipertahankan karena bahasa Indonesia dapat memakai formula naratif “menjawab mereka, kata-Nya” secara wajar, sekaligus mencerminkan kedua verba Yunani.
- source_word: διδαχή
  choice: ajaran
  rationale: “Ajaran” merupakan padanan modern, jelas, dan tidak seteknis “doktrin”.
- source_word: Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ
  choice: Ajaran-Ku bukan milik-Ku sendiri
  rationale: Pengulangan bentuk milik mempertahankan penekanan dan kontras Yunani. “Sendiri” memperjelas bahwa yang disangkal ialah kepemilikan atau asal yang independen, tanpa menambahkan kesimpulan teologis.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: melainkan milik Dia yang mengutus Aku
  rationale: Genitif eliptis dipahami dalam paralel dengan ἐμὴ dan diterjemahkan sebagai kepemilikan, sambil tetap dapat menyiratkan sumber. “Mengutus” tepat bagi πέμπω dan alami dalam konteks misi.
theological_decisions:
- issue: Hubungan ajaran Yesus dengan Dia yang mengutus-Nya
  choice: 'Mempertahankan kontras kepemilikan atau sumber: ajaran itu bukan milik Yesus sendiri, melainkan milik Dia yang mengutus-Nya.'
  alternative: “Ajaran-Ku bukan berasal dari-Ku, melainkan dari Dia yang mengutus Aku.”
  rationale: Bentuk genitif Yunani dapat menonjolkan kepemilikan sekaligus sumber. Teks utama mempertahankan paralel “milik-Ku ... milik Dia” tanpa menjelaskan lebih jauh hakikat hubungan Yesus dengan Sang Pengutus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti gaya Alkitab Indonesia yang umum; susunan kalimat menjaga penekanan kontras dalam teks Yunani.
