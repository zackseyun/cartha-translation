revisions:
- from: Karena itu, orang-orang Yahudi merasa heran dan berkata, “Bagaimana orang ini memiliki pengetahuan seperti itu[a], padahal ia tidak pernah belajar?”[b]
  to: Maka orang-orang Yahudi merasa heran dan berkata, “Bagaimana orang ini memiliki pengetahuan[a], padahal ia tidak pernah belajar?”[b]
  rationale: Revisi menghapus tambahan makna "seperti itu", memakai penghubung naratif yang lebih alami, dan memperjelas catatan budaya agar tidak menyamakan rujukan kontekstual dengan seluruh bangsa Yahudi atau dengan penguasa politik Yudea. Makna ayat serta ambiguitas rujukan οἱ Ἰουδαῖοι tetap dipertahankan.
