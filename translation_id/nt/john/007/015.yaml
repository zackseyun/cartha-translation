  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: id
  text: Maka orang-orang Yahudi merasa heran dan berkata, “Bagaimana orang ini memiliki pengetahuan[a], padahal ia tidak pernah belajar?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengetahui huruf-huruf”; maksudnya, mempunyai pengetahuan atau pendidikan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks Injil Yohanes di sini, “orang-orang Yahudi” menunjuk kepada lawan bicara Yahudi Yesus di Yerusalem, kemungkinan termasuk pihak-pihak berwenang Yahudi, bukan kepada bangsa Yahudi secara keseluruhan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: merasa heran
  rationale: Bentuk imperfek menggambarkan reaksi yang sedang berlangsung; frasa ini alami dalam bahasa Indonesia dan tetap menyampaikan rasa takjub.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan hubungan naratif dan logis dengan ayat sebelumnya.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Menerjemahkan ungkapan Yunani secara langsung tanpa mempersempit rujukannya menjadi para pemimpin dalam teks utama; konteks dijelaskan dalam catatan kaki.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Mengalihkan partisipel Yunani ke konstruksi koordinatif yang wajar dalam bahasa Indonesia.
- source_word: Πῶς οὗτος
  choice: Bagaimana orang ini
  rationale: Menyampaikan pertanyaan langsung serta nada berjarak dari kata penunjuk οὗτος tanpa menjadi kasar.
- source_word: γράμματα οἶδεν
  choice: memiliki pengetahuan seperti itu
  rationale: Dalam konteks ini, idiom harfiah 'mengetahui huruf-huruf' menunjuk pada pengetahuan atau pembelajaran, bukan sekadar kemampuan mengenali abjad.
- source_word: μὴ μεμαθηκώς
  choice: padahal ia tidak pernah belajar
  rationale: Menyatakan bahwa Yesus tidak menjalani pendidikan atau pengajaran formal yang diharapkan, tanpa menambahkan lembaga tertentu yang tidak disebutkan teks.
theological_decisions:
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Bentuk leksikal dipertahankan dalam teks utama agar cakupan istilah tidak dipersempit secara interpretatif. Catatan menjelaskan bahwa dalam konteks ini istilah tersebut menunjuk kepada lawan bicara Yahudi Yesus di Yerusalem, kemungkinan termasuk para penguasa Yudea, bukan bangsa Yahudi secara keseluruhan.
- issue: Arti γράμματα οἶδεν
  choice: memiliki pengetahuan seperti itu
  alternative: mengetahui huruf-huruf; memahami Kitab Suci
  rationale: Ungkapan tersebut dapat menunjuk pada pengetahuan atau pendidikan kesusastraan/keagamaan. Terjemahan utama memakai ungkapan Indonesia yang alami tanpa membatasinya secara tegas pada Kitab Suci, sedangkan bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dibuat alami, sementara idiom Yunani yang tidak lazim dijelaskan melalui catatan kaki.
