  naturalness: Bahasa draf umumnya baku dan alami. Revisi “seorang laki-laki pulih seutuhnya” mempertahankan kontras retoris dengan sunat pada satu bagian tubuh tanpa menghasilkan ungkapan yang kaku seperti “seluruh tubuh seseorang menjadi sehat.”
  terminology: “Hari Sabat,” “hukum Musa,” dan “disunat” sesuai dengan pemakaian Alkitab Indonesia modern. “Pulih seutuhnya” menyatakan pemulihan manusia secara menyeluruh tanpa memasukkan penafsiran doktrinal atau membatasi pemulihan itu hanya pada tubuh.
