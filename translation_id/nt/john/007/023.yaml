  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: id
  text: Jika seorang laki-laki disunat pada hari Sabat supaya hukum Musa tidak dilanggar,[a] apakah kalian marah kepada-Ku karena Aku telah membuat seorang laki-laki pulih seutuhnya pada hari Sabat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak ditiadakan” atau “tidak dibatalkan.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “seorang laki-laki pulih seutuhnya” menonjolkan perbandingan antara menyunat satu bagian tubuh dan memulihkan seorang manusia secara utuh.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει ἄνθρωπος
  choice: seorang laki-laki disunat
  rationale: Ungkapan Yunani secara harfiah berarti ‘seorang laki-laki menerima sunat’, tetapi bentuk pasif ‘disunat’ lebih alami dalam bahasa Indonesia dan tetap tepat karena yang dimaksud memang seorang laki-laki.
- source_word: ἐν σαββάτῳ
  choice: pada hari Sabat
  rationale: Padanan temporal yang alami dalam bahasa Indonesia dan sesuai dengan konteks pelaksanaan Sabat.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: supaya hukum Musa tidak dilanggar
  rationale: Dalam konteks hukum, λύω dapat berarti melanggar, meniadakan, atau membatalkan. ‘Dilanggar’ menyampaikan maksud utama secara jelas tanpa menutup kemungkinan nuansa lainnya, yang dicatat dalam catatan kaki.
- source_word: ἐμοὶ χολᾶτε
  choice: mengapa kalian marah kepada-Ku
  rationale: χολάω menyatakan kemarahan atau kejengkelan. Bentuk pertanyaan dengan ‘mengapa’ alami dalam bahasa Indonesia dan menyampaikan daya retoris konstruksi Yunani.
- source_word: ὅλον ἄνθρωπον
  choice: seluruh tubuh seseorang
  rationale: Ungkapan ini menekankan keutuhan manusia yang dipulihkan, berlawanan dengan tindakan pada satu bagian tubuh. ‘Tubuh’ dibuat eksplisit agar permainan kontrasnya dapat dipahami pembaca Indonesia, tanpa membatasi kesembuhan hanya pada satu anggota tubuh.
- source_word: ὑγιῆ ἐποίησα
  choice: Aku membuat ... menjadi sehat
  rationale: Mempertahankan konstruksi ‘membuat menjadi sehat’ dan kontras retoris yang lebih mudah hilang jika hanya diterjemahkan ‘menyembuhkan’.
theological_decisions:
- issue: Perbandingan antara sunat dan penyembuhan pada hari Sabat
  choice: Yesus membandingkan sunat yang tetap dilaksanakan pada hari Sabat demi menaati hukum Musa dengan pemulihan seluruh tubuh seseorang pada hari Sabat.
  alternative: Yesus sekadar mempertentangkan hukum ritual dengan tindakan belas kasih secara umum.
  rationale: Susunan ayat mendukung argumen dari praktik sunat yang diterima menuju pembenaran yang lebih kuat bagi pemulihan manusia seutuhnya. Terjemahan mempertahankan logika tersebut tanpa memasukkan polemik teologis kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. ‘Kalian’ dipakai karena verba Yunani berbentuk jamak. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti konvensi penerbitan Alkitab Indonesia.
