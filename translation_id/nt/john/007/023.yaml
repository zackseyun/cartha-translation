  to: Jika seorang laki-laki disunat pada hari Sabat supaya hukum Musa tidak dilanggar,[a] apakah kalian marah kepada-Ku karena Aku telah membuat seorang laki-laki pulih seutuhnya pada hari Sabat?[b]
