base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: id
  text: Orang-orang Farisi mendengar orang banyak bergumam[a] demikian tentang Dia. Lalu imam-imam kepala dan orang-orang Farisi mengutus para petugas[b] untuk menangkap Dia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggerutu” atau “berbisik-bisik.” Kata Yunani menunjukkan pembicaraan dengan suara rendah, yang dapat bernada tidak puas.
    reason: lexical_alternative
  - marker: b
    text: Atau “para penjaga Bait Allah.” Yang dimaksud ialah para petugas resmi yang diutus oleh imam-imam kepala dan orang-orang Farisi.
    reason: lexical_alternative
  - marker: c
    text: Atau “menahan Dia.” Kata Yunani secara harfiah menekankan tindakan menangkap atau menguasai seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: mendengar
  rationale: Bentuk aoris ἀκούω di sini menyatakan bahwa orang-orang Farisi mendengar atau mengetahui perkataan orang banyak; “mendengar” merupakan padanan Indonesia yang langsung dan alami.
- source_word: τοῦ ὄχλου
  choice: orang banyak
  rationale: ὄχλος menunjuk kepada kerumunan yang berkumpul. “Orang banyak” lazim dalam narasi Alkitab Indonesia dan tetap mudah dipahami.
- source_word: γογγύζοντος
  choice: bergumam
  rationale: Kata ini menggambarkan pembicaraan dengan suara rendah, sering kali bernada tidak puas. “Bergumam” mempertahankan unsur suara pelan tanpa memastikan bahwa semua perkataan itu merupakan keluhan.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: demikian tentang Dia
  rationale: Susunan ini menyampaikan bahwa isi gumaman orang banyak adalah hal-hal yang baru disebut dan bahwa pembicaraan itu mengenai Yesus. “Demikian” menghindari susunan Indonesia yang kaku sambil tetap merujuk pada perkataan sebelumnya.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Bentuk jamak ini menunjuk kepada kalangan pimpinan keimaman, bukan kepada beberapa orang yang masing-masing sedang menjabat sebagai Imam Besar.
- source_word: ὑπηρέτας
  choice: para petugas
  rationale: Dalam konteks Yohanes, kata ini menunjuk kepada pelayan atau aparat resmi di bawah kewenangan para pemimpin Yahudi. “Para petugas” mempertahankan fungsi resmi itu tanpa menentukan secara berlebihan bahwa mereka adalah polisi dalam pengertian modern.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: untuk menangkap Dia
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan, sedangkan πιάζω berarti menangkap atau menguasai seseorang. “Untuk menangkap Dia” alami dalam bahasa Indonesia dan tidak mengharuskan pembaca memahami tindakan tersebut sebagai prosedur hukum formal.
theological_decisions:
- issue: Identitas kelembagaan ὑπηρέτας
  choice: para petugas resmi di bawah kewenangan imam-imam kepala dan orang-orang Farisi
  alternative: para penjaga Bait Allah; para pelayan
  rationale: Konteksnya adalah upaya resmi untuk menangkap Yesus. “Para petugas” mempertahankan sifat kelembagaan tindakan tersebut tanpa menambahkan rincian yang tidak dinyatakan secara eksplisit oleh teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Orang banyak” serta “imam-imam kepala” dipertahankan sebagai istilah naratif yang sudah dikenal, sedangkan “para petugas” menghindari anakronisme “polisi” dan ambiguitas sosial pada kata “pelayan.”
