  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: id
  text: Namun, beberapa orang di antara mereka ingin menangkap Dia, tetapi tidak seorang pun menangkap-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Namun, beberapa orang
  rationale: τινὲς menunjuk pada sejumlah orang yang tidak disebutkan secara khusus, sedangkan δὲ menandai kontras dengan tanggapan orang banyak sebelumnya. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἐξ αὐτῶν
  choice: dari antara mereka
  rationale: Frasa ini menyatakan bahwa orang-orang tersebut merupakan sebagian dari kelompok yang telah disebutkan; terjemahan eksplisit ini mempertahankan hubungan partitif bahasa Yunani.
- source_word: ἤθελον
  choice: ingin
  rationale: Bentuk imperfek menyatakan keinginan atau niat pada waktu lampau. Dalam konteks naratif bahasa Indonesia, 'ingin' menyampaikan maksud itu secara wajar tanpa menambahkan tindakan yang tidak dinyatakan.
- source_word: πιάσαι
  choice: menangkap
  rationale: πιάζω dapat berarti mencengkeram atau menangkap dan dalam konteks Yohanes sering mengarah pada penahanan. 'Menangkap' mempertahankan unsur penguasaan fisik sekaligus cocok dengan maksud penahanan.
- source_word: ἀλλ’ οὐδεὶς
  choice: tetapi tidak seorang pun
  rationale: ἀλλά memberi kontras kuat antara niat dan hasil, sementara οὐδείς meniadakan setiap pelaku tanpa kecuali.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: menyentuhkan tangan kepada-Nya
  rationale: Terjemahan ini mempertahankan gambaran idiomatis tindakan fisik dalam bahasa Yunani. Dalam konteksnya, ungkapan tersebut berarti memegang atau menangkap dengan maksud bermusuhan.
