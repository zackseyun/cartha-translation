  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: id
  text: Setelah mengatakan hal-hal itu, ia sendiri tetap tinggal di Galilea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Bentuk jamak netral ini menunjuk kembali pada perkataan Yesus sebelumnya; “hal-hal itu” mempertahankan acuan jamaknya secara wajar dalam bahasa Indonesia.
- source_word: δὲ ... εἰπὼν
  choice: Setelah mengatakan
  rationale: Partisip aoris εἰπών menyatakan tindakan yang mendahului verba utama. Dalam konstruksi ini, δέ melanjutkan alur narasi dan secara alami terwakili oleh susunan temporal “Setelah mengatakan”.
- source_word: αὐτὸς
  choice: ia sendiri
  rationale: Pronomina eksplisit ini dapat membawa penekanan atau kontras dengan saudara-saudara Yesus dalam konteks terdekat; “ia sendiri” mempertahankan kemungkinan penekanan tersebut tanpa menambah tafsiran.
- source_word: ἔμεινεν
  choice: tetap tinggal
  rationale: Dalam konteks naratif ini μένω berarti tetap berada atau tinggal di suatu tempat. “Tetap tinggal” menyampaikan unsur keberlanjutan dengan alami.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: di Galilea
  rationale: Ini adalah frasa lokatif langsung dan paling alami diterjemahkan “di Galilea”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pronomina “ia” dipilih untuk corak narasi yang bermartabat; “ia sendiri” mempertahankan penekanan yang mungkin hadir dalam αὐτός.
