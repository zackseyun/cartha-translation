  - severity: low
    issue: Pemisahan dengan titik
    rationale: Kedua bagian merupakan satu pernyataan kontras dalam teks Yunani. Titik koma mempertahankan keterkaitan retorisnya tanpa membuat kalimat Indonesia tidak alami.
  - severity: low
    issue: Kapitalisasi “Dia”
    rationale: Kapitalisasi pronomina adalah konvensi editorial, bukan informasi yang ditandai oleh Yunani. Huruf kecil mempertahankan register standar dan netral.
