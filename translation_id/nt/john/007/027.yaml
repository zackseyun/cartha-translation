  source_fidelity: 'Makna pokoknya setia pada Yunani: para pembicara mengaku mengetahui asal Yesus, lalu mengontraskan hal itu dengan anggapan mereka tentang asal Mesias. Namun, δέ paling baik diterjemahkan dengan penghubung pertentangan biasa, bukan “Sebaliknya,” yang dalam bahasa Indonesia dapat menyiratkan kebalikan yang lebih kuat daripada kontras argumentatif dalam teks.'
  naturalness: Bahasa draft umumnya baku dan jelas. Menggunakan “tetapi” pada kedua penghubung mencerminkan alur ἀλλά ... δέ secara lebih langsung dan wajar. Titik di tengah ayat sebaiknya diganti titik koma untuk mempertahankan dua klausa yang erat berlawanan seperti dalam sumber.
  terminology: “Mesias” tepat untuk ὁ χριστός sebagai gelar yang dinantikan. “Orang ini,” “dari mana ... berasal,” dan “tidak seorang pun tahu” adalah padanan modern yang alami. Pronomina “dia” digunakan tanpa kapitalisasi untuk tidak menambahkan penandaan interpretatif yang tidak ditentukan oleh bahasa sumber.
