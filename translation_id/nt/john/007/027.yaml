  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: id
  text: Tetapi kita tahu dari mana orang ini berasal; tetapi apabila Mesias datang, tidak seorang pun tahu dari mana dia berasal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan pembicaraan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: τοῦτον
  choice: orang ini
  rationale: Menunjuk kepada Yesus secara konkret dan agak tajam; lebih alami daripada 'yang ini'.
- source_word: οἴδαμεν
  choice: kita tahu
  rationale: Menyampaikan pengetahuan yang diklaim telah dimiliki oleh para pembicara.
- source_word: πόθεν ἐστίν
  choice: dari mana ... berasal
  rationale: Ungkapan Indonesia yang wajar untuk menyatakan asal-usul dan dapat dipertahankan pada kedua kemunculannya.
- source_word: ὁ δὲ χριστός
  choice: Sebaliknya, ... Mesias
  rationale: δέ melanjutkan pertentangan, sedangkan χριστός di sini merupakan gelar bagi tokoh mesianik yang dinantikan.
- source_word: ὅταν ἔρχηται
  choice: apabila Mesias datang
  rationale: Menyampaikan kemungkinan masa depan yang belum tertentu tanpa menghilangkan pengharapan akan kedatangannya.
- source_word: οὐδεὶς γινώσκει
  choice: tidak seorang pun tahu
  rationale: Padanan yang jelas dan alami bagi penyangkalan universal tentang pengetahuan.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini istilah tersebut menunjuk pada tokoh mesianik yang dinantikan, bukan berfungsi seperti nama diri.
- issue: Pernyataan orang banyak tentang asal Mesias
  choice: Disampaikan langsung sebagai ucapan mereka tanpa penjelasan korektif
  alternative: Menambahkan penjelasan bahwa ini hanya anggapan populer atau keliru
  rationale: Teks melaporkan klaim para pembicara dan tidak mengharuskan penerjemah mengesahkan ataupun membetulkannya dalam ayat ini.
- issue: Rujukan pronomina kepada Mesias
  choice: Dia
  alternative: dia
  rationale: Kapitalisasi pronomina mengikuti kebiasaan terjemahan Alkitab Indonesia ketika merujuk kepada Mesias, tanpa menambah penafsiran pada isi klaim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Namun' dan 'Sebaliknya' menghindari pengulangan 'tetapi' yang kaku sambil mempertahankan dua gerak pertentangan dalam bahasa Yunani. Tidak diperlukan catatan kaki karena susunan alternatif Inggris tidak mencerminkan varian teks dan maknanya sudah terwakili secara alami.
