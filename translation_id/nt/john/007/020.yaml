  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: id
  text: Orang banyak itu menjawab, “Kamu kerasukan setan![a] Siapa yang berusaha membunuhmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kamu mempunyai setan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Verba naratif baku untuk tanggapan dalam percakapan; alami dan jelas dalam bahasa Indonesia.
- source_word: ὁ ὄχλος
  choice: orang banyak itu
  rationale: Menunjuk kepada kerumunan yang hadir dalam adegan tersebut; bentuk ini alami dan mempertahankan ketakrifan frasa Yunani.
- source_word: Δαιμόνιον ἔχεις
  choice: Kamu kerasukan setan
  rationale: Walaupun secara harfiah berarti 'kamu mempunyai setan', ungkapan idiomatis Indonesia 'kerasukan setan' menyampaikan tuduhan yang sama secara alami. Makna harfiahnya dicatat dalam catatan kaki.
- source_word: τίς
  choice: Siapa
  rationale: Mempertahankan kata tanya eksplisit dan bentuk pertanyaan retoris dalam teks Yunani.
- source_word: ζητεῖ
  choice: berusaha
  rationale: Dalam konstruksi dengan infinitif 'membunuh', pilihan ini secara idiomatis menyampaikan upaya atau maksud yang sedang berlangsung.
- source_word: ἀποκτεῖναι
  choice: membunuh
  rationale: Padanan langsung dan wajar tanpa menambahkan nuansa hukum atau moral yang tidak dinyatakan oleh verba Yunani.
theological_decisions:
- issue: Cara menerjemahkan δαιμόνιον ἔχεις sebagai tuduhan terhadap Yesus
  choice: Kamu kerasukan setan
  alternative: Kamu mempunyai setan
  rationale: Teks melaporkan tuduhan bermusuhan orang banyak dan tidak membenarkannya. Ungkapan idiomatis Indonesia menyampaikan tuduhan itu tanpa mengurangi ketegangannya, sedangkan bentuk harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Sapaan 'kamu' sesuai dengan ujaran langsung bernada menuduh; enklitik '-mu' membuat pertanyaan penutup alami dan ringkas.
