  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: id
  text: Karena itu, Musa telah memberikan sunat kepada kalian—bukan berarti sunat berasal dari Musa, melainkan dari para leluhur[a]—dan pada hari Sabat kalian menyunat seorang laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, sunat tidak bermula dari Musa, tetapi telah diberikan kepada para bapa leluhur sebelum zaman Musa. Ungkapan Yunani juga dapat diterjemahkan, “bukan karena sunat berasal dari Musa, melainkan dari para leluhur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Penghubung ini mempertahankan daya penjelas atau kausal ungkapan Yunani secara alami dalam bahasa Indonesia.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk baku nama ini dalam bahasa Indonesia.
- source_word: δέδωκεν
  choice: telah memberikan
  rationale: Bentuk ini mencerminkan tindakan lampau dengan hasil yang tetap berlaku bagi para pendengar Yesus.
- source_word: τὴν περιτομήν
  choice: sunat
  rationale: Istilah Indonesia yang alami dan jelas untuk lembaga serta praktik perjanjian yang dimaksud.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: bukan berarti sunat berasal dari Musa, melainkan dari para leluhur
  rationale: Frasa ini disajikan sebagai keterangan sisipan mengenai asal historis sunat. Pengulangan 'sunat' memperjelas rujukan pronominal dalam bahasa Indonesia tanpa menambah gagasan baru.
- source_word: ἐν σαββάτῳ
  choice: pada hari Sabat
  rationale: Ungkapan temporal ini alami dan menunjuk pada praktik umum pada hari Sabat.
- source_word: περιτέμνετε
  choice: kalian menyunat
  rationale: Bentuk kini mempertahankan makna kebiasaan, sedangkan 'kalian' menandai orang kedua jamak secara jelas.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Konteks sunat menuntut rujukan konkret kepada orang berjenis kelamin laki-laki.
theological_decisions:
- issue: Rujukan 'para leluhur' dalam keterangan sisipan
  choice: Para leluhur dipahami terutama sebagai bapa-bapa leluhur Israel, yang menunjukkan bahwa sunat mendahului hukum Musa.
  alternative: Istilah itu dapat dipahami lebih luas sebagai nenek moyang Israel pada umumnya.
  rationale: Terjemahan mempertahankan sebutan yang cukup terbuka, tetapi tidak mengaburkan pokok historis teks bahwa sunat tidak bermula dari Musa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak dengan jelas; tanda pisah mempertahankan struktur keterangan sisipan dalam teks Yunani.
