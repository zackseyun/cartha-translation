  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: id
  text: Namun, setelah saudara-saudara-Nya pergi ke perayaan itu, Ia pun pergi, tidak secara terang-terangan, melainkan seolah-olah secara rahasia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melainkan secara rahasia.” Ungkapan Yunani secara harfiah berbunyi “melainkan seolah-olah secara rahasia,” yang mungkin sedikit memperhalus pernyataan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Namun, setelah
  rationale: ὡς dengan aoristus membentuk anak kalimat waktu, sedangkan δέ menandai peralihan atau kontras ringan. Dalam bahasa Indonesia, “setelah” menyatakan urutan peristiwa dengan alami, dan “namun” mempertahankan kaitannya yang kontras dengan konteks sebelumnya.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: pergi ... pergi
  rationale: ἀναβαίνω secara harfiah berarti “naik/pergi ke atas” dan lazim dipakai untuk perjalanan ke Yerusalem. Namun, pengulangan “naik” kurang alami dalam bahasa Indonesia pada konteks ini; “pergi” menyampaikan gerak yang dimaksud, sementara urutan waktunya dijelaskan oleh “setelah”.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara-Nya
  rationale: Dalam konteks dekat, ἀδελφοί merujuk kepada saudara laki-laki Yesus. Bentuk Indonesia “saudara-saudara-Nya” alami dan sesuai dengan pemakaian biblis, tanpa memperluasnya menjadi kelompok campuran.
- source_word: εἰς τὴν ἑορτήν
  choice: ke perayaan itu
  rationale: ἑορτή menunjuk pada perayaan keagamaan, yakni Perayaan Pondok Daun dalam konteks. “Perayaan” lebih alami dalam bahasa Indonesia modern daripada “pesta” dan tetap mempertahankan artikel tertentu melalui “itu”.
- source_word: τότε καὶ αὐτὸς
  choice: Ia pun
  rationale: τότε sudah tercakup secara alami dalam urutan yang dinyatakan oleh “setelah”, sedangkan καὶ αὐτός diterjemahkan “Ia pun” untuk mempertahankan unsur tambahan bahwa Yesus juga pergi.
- source_word: οὐ φανερῶς
  choice: tidak secara terang-terangan
  rationale: φανερῶς berarti secara terbuka atau di muka umum. “Tidak secara terang-terangan” merupakan padanan Indonesia yang jelas dan alami dalam kontras dengan tindakan diam-diam.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: melainkan seolah-olah dengan diam-diam
  rationale: ὡς mempertahankan nuansa pembatas atau pelembutan, bukan sekadar pernyataan langsung bahwa Ia pergi secara rahasia. “Seolah-olah dengan diam-diam” menjaga kejanggalan dan ambiguitas asli; catatan kaki memberi alternatif yang lebih lancar.
theological_decisions:
- issue: Hubungan tindakan Yesus dengan pernyataan-Nya sebelumnya tentang tidak pergi ke perayaan
  choice: Menyatakan bahwa Yesus pergi kemudian dan tidak secara terang-terangan, tanpa menjelaskan atau menyelaraskan ketegangan itu.
  alternative: Memarafrasakan bahwa Yesus berubah pikiran atau bahwa sejak awal Ia hanya menolak cara perjalanan saudara-saudara-Nya.
  rationale: Teks Yunani hanya menuturkan urutan tindakan dan cara Yesus pergi. Terjemahan tidak menambahkan penjelasan teologis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur kalimat mempertahankan kontras dan nuansa ὡς tanpa menghilangkan ketegangan naratif.
