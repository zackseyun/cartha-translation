  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: id
  text: Nikodemus, yang sebelumnya datang kepada-Nya dan yang merupakan salah seorang dari mereka, berkata kepada mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani adalah kala kini historis, tetapi bentuk lampau naratif tersirat secara alami melalui konteks dalam bahasa Indonesia; 'berkata' mempertahankan fungsi pengantar ujaran.
- source_word: Νικόδημος
  choice: Nikodemus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: πρός dengan akusatif sesudah verba berbicara menandai pihak yang dituju.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: yang sebelumnya pernah datang kepada-Nya
  rationale: Konstruksi artikel dan partisipel menjelaskan identitas Nikodemus. 'Sebelumnya pernah datang' mengungkapkan tindakan terdahulu secara wajar; kapitalisasi pronomina mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Yesus tanpa menambahkan nama-Nya ke dalam teks.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: dan merupakan salah seorang dari mereka
  rationale: Ungkapan ini memberikan informasi latar bahwa Nikodemus termasuk kelompok tersebut. Bentuk ini tidak menafsirkan partisipel sebagai sebab.
theological_decisions:
- issue: Rujukan αὐτόν dalam frasa tentang kedatangan Nikodemus sebelumnya
  choice: Pronomina dipertahankan sebagai '-Nya', dengan catatan bahwa konteks menunjuk kepada Yesus.
  alternative: Menyebut 'Yesus' secara langsung, atau mempertahankan 'dia' tanpa kapitalisasi.
  rationale: Yohanes 3:1–2 mengidentifikasi kunjungan terdahulu Nikodemus kepada Yesus. Teks tetap memakai pronomina sebagaimana bahasa Yunani dan catatan menjelaskan rujukannya tanpa menyisipkan nama ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan apposisional Yunani dipertahankan dalam bentuk yang mudah dibaca; koma akhir mengikuti kenyataan bahwa ayat ini mengantar perkataan pada ayat berikutnya.
