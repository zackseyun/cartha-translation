id: JHN.7.28
reference: John 7:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: id
  text: Maka Yesus berseru di Bait Allah ketika Ia sedang mengajar dan berkata, “Kamu mengenal Aku dan tahu dari mana Aku berasal.[a] Aku tidak datang dari diri-Ku sendiri,[b] melainkan Dia yang mengutus Aku adalah benar,[c] yang tidak kamu kenal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pernyataan ini dapat terdengar ironis atau menantang dalam konteksnya, tetapi bentuk Yunaninya adalah pernyataan, bukan pertanyaan.
    reason: alternative_reading
  - marker: b
    text: “Dari diri-Ku sendiri” juga dapat diterjemahkan “atas kemauan-Ku sendiri” atau “atas prakarsa-Ku sendiri.”
    reason: lexical_alternative
  - marker: c
    text: Kata “benar” di sini juga dapat mengandung arti “sejati” atau “nyata”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: berseru
  rationale: Menyampaikan ucapan yang lantang dan terbuka tanpa menyiratkan bahwa Yesus sedang menjerit karena kesusahan.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: Ἱερόν menunjuk pada kompleks Bait Allah; ungkapan baku ini alami dalam bahasa Indonesia dan tidak menyempitkannya menjadi ruang mahakudus.
- source_word: διδάσκων ... καὶ λέγων
  choice: ketika sedang mengajar ... kata-Nya
  rationale: Menampilkan kegiatan mengajar yang sedang berlangsung dan memperkenalkan ucapan langsung secara alami dalam bahasa Indonesia.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: Kamu mengenal Aku dan tahu
  rationale: Pembedaan idiomatis antara mengenal seseorang dan mengetahui asalnya mempertahankan pengulangan gagasan οἴδατε tanpa menghasilkan bahasa Indonesia yang kaku.
- source_word: πόθεν εἰμί
  choice: dari mana Aku berasal
  rationale: Menjaga cakupan makna asal-usul tetap terbuka, baik yang tampak secara manusiawi maupun makna yang lebih dalam dalam Injil Yohanes.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: dari diri-Ku sendiri
  rationale: Mempertahankan metafora sumber dalam bahasa Yunani dan tidak langsung membatasi maknanya pada inisiatif atau kehendak.
- source_word: οὐκ ἐλήλυθα
  choice: Aku datang bukan
  rationale: Bentuk ini alami dalam bahasa Indonesia; konteks misi yang masih berlangsung tetap jelas meskipun bahasa Indonesia tidak menandai aspek perfektum seperti bahasa Yunani.
- source_word: ἀληθινὸς
  choice: benar
  rationale: Menjaga istilah Yohanes yang dapat mencakup kebenaran, keaslian, dan kenyataan tanpa memilih hanya salah satu nuansa.
- source_word: ὁ πέμψας με
  choice: Dia yang mengutus Aku
  rationale: Mempertahankan pelaku personal dan tidak menambahkan sebutan 'Bapa' yang tidak muncul secara eksplisit dalam klausa ini.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: kamu tidak mengenal Dia
  rationale: Dalam bahasa Indonesia, 'mengenal' paling wajar untuk pengetahuan relasional terhadap pribadi dan mempertahankan tuduhan langsung Yesus.
theological_decisions:
- issue: Apakah pernyataan 'Kamu mengenal Aku dan tahu dari mana Aku berasal' harus dibuat menjadi pertanyaan retoris atau ironi yang eksplisit
  choice: Dipertahankan sebagai pernyataan deklaratif
  alternative: “Kamu mengenal Aku dan tahu dari mana Aku berasal?” atau penambahan penanda sindiran
  rationale: Bentuk Yunani bersifat deklaratif. Konteks dapat memberi kesan menantang atau ironis, tetapi terjemahan tidak memutuskan daya retoris yang memang dibiarkan tersirat.
- issue: Cakupan asal-usul Yesus dalam πόθεν εἰμί dan ἀπ’ ἐμαυτοῦ
  choice: Dibiarkan mencakup asal-usul yang tampak dan misi ilahi yang lebih dalam
  alternative: Dibatasi pada asal geografis atau diperjelas secara eksplisit sebagai asal surgawi
  rationale: Ungkapan Yunani tidak membatasi makna pada geografi dan juga tidak menyebut surga secara eksplisit; ketegangan khas Yohanes dipertahankan.
- issue: Identitas pihak yang mengutus Yesus
  choice: Diterjemahkan 'Dia yang mengutus Aku'
  alternative: “Bapa yang mengutus Aku”
  rationale: Konteks Injil Yohanes menunjuk kepada Bapa, tetapi ayat ini memakai deskripsi relasional tanpa menyebut gelar tersebut. Terjemahan tidak menambahkan identifikasi yang tidak tersurat.
- issue: Nuansa ἀληθινός
  choice: Diterjemahkan 'benar' dengan penjelasan kemungkinan makna dalam catatan kaki
  alternative: “sejati”, “nyata”, atau “dapat dipercaya”
  rationale: Kata ini dapat menyentuh keaslian atau kenyataan sekaligus kebenaran. Memilih satu perluasan dalam teks utama akan mempersempit ketegangan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat digunakan tanpa ungkapan yang terlalu arkais. Sapaan ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur partisipial Yunani diubah menjadi susunan waktu yang alami, sementara pernyataan utama dan ambiguitas teologis tetap dipertahankan.
