base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: id
  text: Mereka menjawab dan berkata kepadanya, “Kamu juga bukan dari Galilea, kan?[a] Selidikilah dan lihatlah bahwa tidak ada nabi yang muncul dari Galilea.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kamu juga dari Galilea?” Pertanyaan Yunani ini disusun dengan mengharapkan jawaban negatif.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak ada nabi yang Allah bangkitkan dari Galilea,” yang mempertahankan kemungkinan nuansa bahwa Allah membangkitkan atau memunculkan nabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: Mereka menjawab dan berkata
  rationale: Mempertahankan pasangan verba yang merupakan formula naratif khas Yohanes serta memberi tekanan pada tanggapan mereka, meskipun sedikit berulang dalam bahasa Indonesia.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Jangan-jangan kamu juga dari Galilea?
  rationale: Bentuk ini terdengar alami dalam bahasa Indonesia dan menyampaikan nada curiga serta harapan akan jawaban negatif yang ditandai oleh μή.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Selidikilah dan lihatlah
  rationale: Dua imperatif dipertahankan untuk mencerminkan tantangan langsung agar Nikodemus memeriksa persoalan itu dan menyadari kesimpulan mereka.
- source_word: προφήτης
  choice: nabi
  rationale: Nomina tanpa artikel dipahami secara umum, bukan sebagai sebutan khusus bagi ‘Nabi’ eskatologis.
- source_word: οὐκ ἐγείρεται
  choice: tidak ada ... yang muncul
  rationale: Mengungkapkan kemunculan seorang nabi secara alami dalam bahasa Indonesia, sambil mencatat dalam catatan kaki kemungkinan nuansa pasif bahwa Allah membangkitkan atau mengutus nabi.
theological_decisions:
- issue: Daya retoris pertanyaan negatif
  choice: Jangan-jangan kamu juga dari Galilea?
  alternative: Kamu bukan juga dari Galilea, bukan?
  rationale: μή menunjukkan bahwa penutur mengharapkan jawaban negatif. Pilihan utama menyampaikan nada meremehkan secara alami tanpa mengubah pertanyaan menjadi pernyataan tegas.
- issue: Nuansa ἐγείρεται mengenai tampilnya nabi
  choice: muncul
  alternative: dibangkitkan
  rationale: Bentuk Yunani dapat menyatakan bahwa seorang nabi tampil atau muncul, tetapi bentuk pasifnya juga dapat memberi nuansa bahwa Allah membangkitkannya. Teks utama memakai ungkapan Indonesia yang alami, sedangkan kemungkinan teologis tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sapaan “kamu” sesuai dengan nada langsung dan merendahkan dalam perdebatan ini; bentuk imperatif berakhiran -lah mempertahankan ketegasan sekaligus keluhuran gaya naratif.
