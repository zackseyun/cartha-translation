  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: id
  text: Sebab tidak seorang pun melakukan sesuatu secara tersembunyi sementara ia sendiri berusaha tampil di muka umum.[a] Jika engkau melakukan hal-hal ini, nyatakanlah dirimu kepada dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikenal secara terbuka” atau “berada di depan umum.” Ungkapan Yunani menekankan keterbukaan atau keterlihatan di hadapan umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Sebab tidak seorang pun
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ yang menghubungkan perkataan ini dengan ayat sebelumnya; “tidak seorang pun” secara alami mewakili οὐδεὶς.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: melakukan sesuatu secara tersembunyi
  rationale: Mempertahankan objek tak tentu τι dan makna idiomatis ἐν κρυπτῷ sebagai tindakan yang dilakukan tidak di hadapan umum.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: sementara ia sendiri ingin
  rationale: “Sementara” menyatakan pertentangan pragmatis antara bertindak tersembunyi dan menginginkan keterbukaan tanpa mengubahnya menjadi syarat. “Ia sendiri” mempertahankan penekanan αὐτός, sedangkan “ingin” menyampaikan arah kehendak atau upaya dalam ζητεῖ secara alami.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: tampil di muka umum
  rationale: Dalam konteks ini, ungkapan tersebut menunjuk pada keberadaan yang terbuka dan terlihat oleh khalayak, bukan terutama keberanian dalam berbicara. Ungkapan Indonesia ini alami dan mempertahankan fokus pada keterlihatan publik.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Jika engkau melakukan hal-hal ini
  rationale: Mempertahankan bentuk syarat dan kala kini Yunani serta rujukan jamak ταῦτα.
- source_word: φανέρωσον σεαυτὸν
  choice: nyatakanlah dirimu
  rationale: Menyampaikan imperatif aoris yang langsung dan tegas, dengan makna membuat diri tampak atau dikenal.
- source_word: τῷ κόσμῳ
  choice: kepada dunia
  rationale: Mempertahankan istilah khas Yohanes κόσμος dan kemungkinan gaung sastrawi-teologisnya, tanpa menyempitkannya menjadi sekadar “masyarakat umum”.
theological_decisions:
- issue: Cakupan κόσμος dalam konteks Yohanes
  choice: dunia
  alternative: khalayak umum
  rationale: Konteks langsung memang menyangkut penampakan di hadapan umum, tetapi “dunia” menjaga konsistensi istilah Yohanes dan tidak meniadakan cakupan maknanya yang lebih luas.
- issue: Nuansa ἐν παρρησίᾳ εἶναι
  choice: tampil di muka umum
  alternative: dikenal secara terbuka
  rationale: Teks Yunani menekankan keberadaan dalam keterbukaan atau ranah publik dan tidak secara eksplisit memakai kata “dikenal”. Pilihan utama mempertahankan keterlihatan publik, sedangkan alternatif tetap mungkin secara idiomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Sapaan tunggal “engkau” mempertahankan jumlah gramatikal tanpa menambahkan gelar kehormatan yang tidak dinyatakan dalam teks Yunani. Nada perkataan saudara-saudara Yesus tetap langsung dan menantang.
