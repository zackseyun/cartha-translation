  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: id
  text: Yang lain berkata, “Dialah Mesias[a].” Namun, sebagian orang berkata, “Mesias tidak datang dari Galilea, bukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  choice: Yang lain
  rationale: Adjektiva substantival jamak ini menunjuk pada kelompok lain di tengah orang banyak; bentuk ini alami dalam bahasa Indonesia dan mempertahankan perbedaan antarkelompok.
- source_word: ἔλεγον
  choice: berkata
  rationale: Imperfek Yunani menggambarkan ujaran yang berlangsung dalam kerumunan, tetapi bentuk lampau tidak wajib ditandai secara khusus dalam bahasa Indonesia; “berkata” tetap alami dalam konteks naratif.
- source_word: Οὗτός ἐστιν
  choice: Dialah
  rationale: Bentuk ini secara alami menyatakan identifikasi yang tegas terhadap orang yang sedang dibicarakan.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi tokoh yang diurapi dan dinantikan, bukan sebagai nama diri.
- source_word: οἱ δὲ
  choice: Namun, sebagian orang
  rationale: Artikel jamak dengan δέ memperkenalkan kelompok yang berlawanan; “sebagian orang” menghindari pengulangan kaku sekaligus mempertahankan kontras.
- source_word: Μὴ γὰρ
  choice: tidak mungkin ... bukan?
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif, sedangkan γάρ memberi nuansa keberatan atau alasan; konstruksi ini menyampaikan ketidakpercayaan retoris secara alami.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: dari Galilea
  rationale: ἐκ menyatakan tempat asal atau sumber; “dari” merupakan padanan Indonesia yang langsung dan idiomatis.
- source_word: ἔρχεται
  choice: datang
  rationale: Kala kini menyatakan anggapan umum tentang asal kedatangan Mesias; “datang” mempertahankan aspek umum itu tanpa menambahkan waktu tertentu.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini Χριστός adalah gelar mesianik yang sedang diperdebatkan oleh orang banyak. “Mesias” mempertahankan hubungan dengan harapan akan tokoh yang diurapi tanpa menjadikannya seolah-olah nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Dialog dibuat alami namun tetap bermartabat. Pertanyaan terakhir mempertahankan sifat retorisnya dan harapan akan jawaban negatif.
