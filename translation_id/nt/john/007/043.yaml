  text: So there was a division in the crowd because of him.
translation:
  language: id
  text: Maka terjadilah perpecahan di antara orang banyak karena Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: terpecah
  rationale: Kata ini menunjuk pada perpecahan di antara orang-orang. Bentuk verbal "terpecah" alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa orang banyak terbagi menjadi kubu-kubu.
- source_word: οὖν
  choice: Karena itu
  rationale: Partikel ini menghubungkan ayat dengan perdebatan sebelumnya sebagai akibat atau kelanjutannya. "Karena itu" jelas tanpa memberi kesan kesimpulan logis yang terlalu kaku.
- source_word: ἐγένετο
  choice: terpecah
  rationale: Dalam konstruksi bersama σχίσμα, kata ini menyatakan timbulnya suatu keadaan. Maknanya digabungkan secara wajar ke dalam predikat Indonesia "terpecah".
- source_word: ἐν τῷ ὄχλῳ
  choice: orang banyak
  rationale: ὄχλος mengacu pada kumpulan orang yang sedang memperdebatkan identitas Yesus. "Orang banyak" merupakan padanan Alkitabiah yang tetap lazim dan mudah dipahami.
- source_word: δι’ αὐτόν
  choice: karena Dia
  rationale: διά dengan akusatif menyatakan sebab. "Karena Dia" menyampaikan hubungan sebab secara langsung sambil mempertahankan pronomina sumber.
theological_decisions:
- issue: Rujukan αὐτόν
  choice: Dia, merujuk kepada Yesus tanpa menyebut nama-Nya secara eksplisit
  alternative: karena Yesus
  rationale: Konteks memastikan bahwa pronomina itu merujuk kepada Yesus, tetapi teks Yunani memakai pronomina. Terjemahan mempertahankannya tanpa menambahkan penjelasan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan verbal dipilih karena lebih alami daripada nominalisasi seperti "terjadi perpecahan", tanpa mengurangi makna sosial dari σχίσμα.
