  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: id
  text: Orang yang berbicara dari dirinya sendiri[a] mencari kemuliaannya sendiri. Namun, orang yang mencari kemuliaan Dia yang mengutusnya, orang itulah yang benar[b], dan tidak ada ketidakadilan[c] dalam dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas inisiatif sendiri” atau “atas wewenangnya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jujur” atau “dapat dipercaya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “perbuatan salah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: dari dirinya sendiri
  rationale: Mempertahankan ungkapan sumber dan kontras Yohanes antara perkataan yang berasal dari diri sendiri dan pengutusan oleh pihak lain; catatan kaki memberi padanan makna yang lebih eksplisit.
- source_word: λαλῶν
  choice: yang berbicara
  rationale: Partisipel kini berfungsi substantival dan menyatakan ciri umum orang tersebut; bentuk ini alami dalam bahasa Indonesia.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Padanan baku yang mempertahankan gema teologis δόξα sekaligus mencakup kehormatan yang dicari.
- source_word: τὴν ἰδίαν
  choice: sendiri
  rationale: Menandai kemuliaan yang menjadi milik atau kepentingan pribadi subjek dan mempertahankan kontras dengan kemuliaan sang pengutus.
- source_word: ζητεῖ / ζητῶν
  choice: mencari / yang mencari
  rationale: Mempertahankan pengulangan verbal dan kesejajaran kedua klausa dalam bahasa sumber.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: Dia yang mengutusnya
  rationale: Menerjemahkan partisipel berartikel sebagai pribadi yang mengutus; kapitalisasi kontekstual menunjukkan rujukan kepada Allah tanpa menambahkan nama yang tidak dinyatakan dalam ayat.
- source_word: οὗτος
  choice: adalah orang yang
  rationale: Menyampaikan penegasan demonstratif secara alami dalam bahasa Indonesia; terjemahan harfiah 'orang inilah' terasa lebih kaku.
- source_word: ἀληθής
  choice: benar
  rationale: Mempertahankan keluasan istilah Yohanes, yang dapat menunjuk pada kebenaran, ketulusan, atau sifat dapat dipercaya; alternatif 'jujur' dicatat.
- source_word: ἀδικία
  choice: ketidakbenaran
  rationale: Mempertahankan cakupan moral dan teologis istilah serta hubungan antitesisnya dengan ἀληθής; kemungkinan arti 'ketidakadilan' atau 'perbuatan salah' dicatat.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: tidak ada ... dalam dirinya
  rationale: Mewakili konstruksi eksistensial dan penilaian tentang keadaan moral internal secara jelas dan alami.
theological_decisions:
- issue: Kontras antara berbicara ἀφ’ ἑαυτοῦ dan mencari kemuliaan sang pengutus
  choice: Dipertahankan sebagai kontras antara perkataan yang berasal dari diri sendiri dan orientasi kepada kemuliaan Dia yang mengutus.
  alternative: Menafsirkannya secara lebih khusus sebagai bertindak 'atas wewenangnya sendiri'.
  rationale: Konteks membahas sumber dan tujuan pengajaran. Rumusan ini tidak memasukkan kategori doktrinal yang melampaui pernyataan teks.
- issue: Makna ἀληθής
  choice: benar
  alternative: jujur atau dapat dipercaya
  rationale: ‘Benar’ menjaga diksi Yohanes dan tidak mempersempit istilah hanya pada kejujuran verbal.
- issue: Makna ἀδικία
  choice: ketidakbenaran
  alternative: ketidakadilan atau perbuatan salah
  rationale: Padanan ini menjaga keluasan etis-teologis kata Yunani dan pertentangannya dengan ‘benar’, sementara catatan kaki mempertahankan kemungkinan nuansa lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ‘mencari ... mencari’ dipertahankan. ‘Dia’ dikapitalisasi karena secara kontekstual menunjuk kepada Allah sebagai pengutus, sedangkan enklitik ‘-nya’ tetap mengikuti ejaan biasa. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
