id: JHN.7.1
reference: John 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: id
  text: Sesudah itu Yesus berkeliling di Galilea, sebab Ia tidak mau berkeliling di Yudea karena orang-orang Yahudi[a] berusaha membunuh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea” atau “para pemimpin Yahudi”. Dalam Injil Yohanes, sebutan “orang-orang Yahudi” sering kali dapat menunjuk lebih khusus kepada pihak Yahudi di Yudea yang menentang Yesus, termasuk para penguasa Yahudi dalam konteks tertentu, bukan kepada seluruh orang Yahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini menjadi penghubung waktu yang alami dalam bahasa Indonesia. Kata “itu” dapat merujuk secara kolektif kepada berbagai peristiwa sebelumnya tanpa harus diterjemahkan dengan bentuk jamak yang kaku.
- source_word: περιεπάτει / περιπατεῖν
  choice: berjalan keliling
  rationale: Dalam konteks pergerakan di suatu wilayah, “berjalan keliling” menyampaikan kegiatan yang berlangsung dan lebih alami daripada sekadar “berjalan”. Pengulangan pilihan yang sama mempertahankan pengulangan περιπατέω dalam teks Yunani.
- source_word: ἐν τῇ Γαλιλαίᾳ / ἐν τῇ Ἰουδαίᾳ
  choice: di Galilea / di Yudea
  rationale: Terjemahan lokatif yang langsung dan wajar tanpa memperluas cakupan gerak yang tidak dinyatakan secara eksplisit.
- source_word: οὐ γὰρ ἤθελεν
  choice: Ia tidak mau
  rationale: Menyatakan kehendak, bukan ketidakmampuan. Hubungan penjelas γάρ tersampaikan secara alami melalui susunan dua kalimat dan alasan yang kemudian diperkenalkan dengan “karena”.
- source_word: ὅτι ἐζήτουν
  choice: karena ... berusaha
  rationale: ὅτι memperkenalkan alasan, sedangkan bentuk imperfek ἐζήτουν menggambarkan upaya atau maksud bermusuhan yang terus berlangsung. “Berusaha” alami dalam bahasa Indonesia ketika diikuti infinitif tujuan.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan padanan formal ungkapan Yunani, sementara catatan kaki menjelaskan bahwa dalam konteks naratif Yohanes sebutan ini tidak harus berarti seluruh bangsa Yahudi.
- source_word: ἀποκτεῖναι
  choice: membunuh-Nya
  rationale: Padanan langsung dan alami bagi infinitif yang menyatakan tujuan dari upaya mereka.
theological_decisions:
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: Memakai “orang-orang Yahudi” dalam teks utama dengan catatan penjelas kontekstual.
  alternative: “orang-orang Yudea” atau “para pemimpin Yahudi”
  rationale: Pilihan ini mempertahankan bentuk leksikal sumber dan ambiguitas cakupan kelompoknya, tetapi catatan mencegah pembacaan anakronistis seolah-olah Yohanes sedang mengecam semua orang Yahudi tanpa pembedaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Berjalan keliling” mempertahankan pengulangan kata kerja Yunani sambil menyampaikan makna idiomatis bergerak atau berkegiatan di suatu wilayah. Pronomina ilahi ditulis menurut kebiasaan penerbitan Alkitab Indonesia.
