  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: id
  text: Lalu orang-orang Farisi menjawab mereka, “Apakah kalian juga sudah disesatkan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kalian juga sudah ditipu?” Kata kerja ini dapat berarti disesatkan atau ditipu; “disesatkan” menekankan bahwa mereka telah dibawa ke dalam kekeliruan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: menjawab
  rationale: Kata kerja naratif umum untuk memberikan tanggapan dalam percakapan; padanan Indonesia yang alami dan tepat.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan konsekuensial dengan percakapan sebelumnya; bentuk ini mempertahankan kaitan wacana secara jelas.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Objek tak langsungnya merujuk kepada para petugas dalam konteks sebelumnya dan dapat dinyatakan secara alami sesudah 'menjawab'.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok Yahudi ini; bentuk jamak dinyatakan secara alami.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Apakah kalian juga
  rationale: καί memberi arti 'juga', sedangkan μή menunjukkan pertanyaan retoris yang mengharapkan jawaban negatif. 'Kalian' membedakan pihak yang disapa dalam bentuk jamak.
- source_word: πεπλάνησθε
  choice: sudah disesatkan
  rationale: Bentuk perfekt pasif menyampaikan keadaan kini sebagai hasil tindakan menyesatkan; 'disesatkan' mempertahankan nuansa dibawa ke dalam kekeliruan.
theological_decisions:
- issue: Daya retoris pertanyaan dengan μή
  choice: Diterjemahkan sebagai pertanyaan yang secara konteks mengharapkan jawaban negatif tanpa menambahkan kata penegas.
  alternative: “Jangan-jangan kalian juga sudah disesatkan?” atau “Tentunya kalian tidak ikut disesatkan, bukan?”
  rationale: Bahasa Yunani mengisyaratkan harapan akan jawaban 'tidak', tetapi penambahan 'tentunya' akan membuat sikap itu lebih eksplisit daripada teks sumber. Susunan pertanyaan dan konteks mempertahankan nada meremehkan orang-orang Farisi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' dipakai untuk bentuk orang kedua jamak yang jelas, sedangkan 'sudah disesatkan' mencerminkan aspek perfekt serta bentuk pasif Yunani.
