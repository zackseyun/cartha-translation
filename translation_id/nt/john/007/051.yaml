  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: id
  text: “Bukankah hukum kita tidak menghakimi seseorang sebelum mendengar darinya lebih dahulu dan mengetahui apa yang dilakukannya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Apakah ...?
  rationale: Dalam pertanyaan retoris ini, μή mengisyaratkan jawaban negatif. Bentuk tanya dengan konteks negatif melalui ‘sebelum’ menyampaikan sanggahan Nikodemus secara alami dalam bahasa Indonesia.
- source_word: ὁ νόμος ἡμῶν
  choice: hukum kita
  rationale: Merujuk pada kaidah hukum komunitas Yahudi yang diajukan Nikodemus tanpa mempersempitnya secara pasti hanya pada Pentateukh.
- source_word: κρίνει
  choice: menghakimi
  rationale: Mempertahankan nuansa yudisial κρίνω tanpa memperkuatnya menjadi ‘menghukum’ atau ‘menyatakan bersalah’.
- source_word: τὸν ἄνθρωπον
  choice: seseorang
  rationale: ἄνθρωπον merupakan bentuk tunggal generik; ‘seseorang’ alami dalam bahasa Indonesia dan tidak menyiratkan orang tertentu.
- source_word: ἐὰν μὴ
  choice: sebelum
  rationale: Dalam susunan pertanyaan bahasa Indonesia, ‘sebelum’ secara alami menyatakan bahwa pemeriksaan harus mendahului penghakiman, sepadan dengan syarat negatif ἐὰν μή.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: mendengar langsung darinya terlebih dahulu
  rationale: παρ’ αὐτοῦ menunjukkan bahwa keterangan didengar dari orang itu sendiri, sedangkan πρῶτον mempertahankan urutan prosedural.
- source_word: γνῷ
  choice: mengetahui
  rationale: Menyatakan diperolehnya pengetahuan tentang fakta perkara tanpa menambahkan gagasan penyelidikan yang tidak tersurat.
- source_word: τί ποιεῖ
  choice: apa yang sedang dilakukannya
  rationale: Bentuk kini ποιεῖ dipertahankan dengan ‘sedang dilakukan’, bukan diubah menjadi tindakan lampau.
theological_decisions:
- issue: Cakupan ‘hukum kita’
  choice: Tidak mengidentifikasinya secara eksplisit hanya sebagai Taurat
  alternative: ‘Taurat kita’
  rationale: νόμος dalam konteks ini dapat menunjuk standar hukum Yahudi secara luas; terjemahan ‘hukum kita’ menjaga keluasan rujukan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan retoris dibuat alami, dengan istilah yudisial ‘menghakimi’ serta keterangan ‘langsung darinya’ untuk mempertahankan παρ’ αὐτοῦ.
