id: JHN.7.26
reference: John 7:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: id
  text: Lihat, Dia berbicara secara terbuka, dan mereka tidak mengatakan apa-apa kepada-Nya. Mungkinkah[a] para pemimpin itu benar-benar sudah tahu bahwa orang inilah Mesias?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan-jangan”.
    reason: Menunjukkan kemungkinan nuansa μήποτε sebagai dugaan terkejut atau penuh kecurigaan.
lexical_decisions:
- source_word: ἴδε
  choice: Lihat
  rationale: Dipakai sebagai seruan untuk mengarahkan perhatian, dengan bentuk yang alami dan langsung dalam bahasa Indonesia modern.
- source_word: παρρησίᾳ
  choice: dengan terbuka
  rationale: Menunjukkan bahwa Yesus berbicara secara terbuka di hadapan umum; pilihan ini tidak mempersempit maknanya menjadi keberanian semata.
- source_word: λαλεῖ
  choice: Dia berbicara
  rationale: Bentuk kini Yunani menggambarkan tindakan yang sedang disaksikan; dalam konteks ini bentuk Indonesia tanpa penanda aspek tetap alami dan jelas.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: mereka tidak mengatakan apa-apa kepada-Nya
  rationale: Mempertahankan datif αὐτῷ sebagai 'kepada-Nya' tanpa menambahkan gagasan 'menentang' yang hanya tersirat oleh konteks.
- source_word: μήποτε
  choice: Mungkinkah
  rationale: Mengungkapkan dugaan yang mengejutkan dan tentatif dalam bentuk pertanyaan. Nuansa alternatif 'jangan-jangan' dicatat dalam catatan kaki.
- source_word: ἀληθῶς
  choice: benar-benar
  rationale: Padanan Indonesia yang alami untuk penegasan bahwa dugaan tersebut mungkin sungguh benar.
- source_word: ἔγνωσαν
  choice: sudah tahu
  rationale: Menyampaikan hasil atau keadaan pengetahuan yang tersirat oleh aoristus secara idiomatis, tanpa mempersempitnya menjadi 'mengakui'.
- source_word: οἱ ἄρχοντες
  choice: para pemimpin itu
  rationale: Dalam konteks Yohanes, istilah ini menunjuk kepada kalangan pemimpin yang berwenang; 'itu' menandai kelompok yang sudah dikenal dalam wacana.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: bahwa orang inilah Mesias
  rationale: Konstruksi 'orang inilah' mempertahankan daya tunjuk οὗτός, sedangkan 'Mesias' menyampaikan Χριστός sebagai gelar dalam konteks pengharapan Yahudi.
theological_decisions:
- issue: Penerjemahan ὁ χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pertanyaan orang banyak ini, Χριστός berfungsi sebagai gelar mesianik, bukan sebagai unsur nama; 'Mesias' mempertahankan latar pengharapan Yahudi.
- issue: Kadar kepastian dalam μήποτε
  choice: Mungkinkah
  alternative: Jangan-jangan
  rationale: Teks menyuarakan dugaan terkejut, bukan pernyataan pasti. 'Mungkinkah' mempertahankan bentuk pertanyaannya, sementara 'jangan-jangan' merupakan kemungkinan idiomatis dengan nada kekhawatiran atau kecurigaan yang sedikit lebih kuat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia; susunan kalimat tetap dekat dengan gerak ujaran Yunani tanpa terdengar kaku.
