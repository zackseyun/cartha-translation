  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: id
  text: Pergilah kalian ke perayaan itu. Aku tidak pergi ke perayaan ini[a], karena waktu-Ku belum genap[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “Aku belum pergi ke perayaan ini.”
    reason: textual_variant
  - marker: b
    text: Atau, “waktu yang ditetapkan bagi-Ku belum digenapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: Pergilah
  rationale: Bentuk imperatif dipertahankan. Dalam konteks perjalanan menuju Yerusalem, unsur arah 'naik' tersirat secara budaya, tetapi 'pergilah' lebih alami dalam bahasa Indonesia dan tidak mengesankan sekadar gerak menuju tempat yang lebih tinggi.
- source_word: ἑορτή
  choice: perayaan
  rationale: Menunjuk perayaan keagamaan Yahudi; 'perayaan' alami dan lebih luas dipahami daripada 'hari raya', tanpa menyisipkan kata 'hari' yang tidak terdapat dalam teks.
- source_word: οὐκ ἀναβαίνω
  choice: Aku tidak pergi
  rationale: Mengikuti bacaan SBLGNT οὐκ, bukan οὔπω. Bentuk kini dapat menyatakan tindakan yang segera direncanakan dalam konteks ini.
- source_word: ταύτην
  choice: ini
  rationale: Mempertahankan demonstrativa yang menunjuk pada perayaan khusus yang sedang dibicarakan.
- source_word: καιρός
  choice: waktu
  rationale: Padanan ringkas dan alami yang tetap dapat memuat nuansa waktu yang tepat atau ditetapkan.
- source_word: πεπλήρωται
  choice: belum genap
  rationale: Menyampaikan aspek keadaan yang belum mencapai kepenuhan dari bentuk perfek pasif πληρόω dengan ungkapan Indonesia yang alami dan padat.
theological_decisions:
- issue: Varian tekstual dalam pernyataan Yesus tentang pergi ke perayaan
  choice: 'Mengikuti bacaan SBLGNT οὐκ: ''Aku tidak pergi ke perayaan ini.'''
  alternative: 'Sejumlah naskah memuat οὔπω: ''Aku belum pergi ke perayaan ini.'''
  rationale: Teks utama mengikuti edisi sumber yang diberikan dan tidak meredakan ketegangan dengan tindakan Yesus kemudian. Varian yang penting secara penafsiran dicatat secara terbuka.
- issue: Nuansa καιρός sebagai waktu yang ditentukan
  choice: '''waktu-Ku'' dalam teks utama'
  alternative: '''waktu yang ditetapkan bagi-Ku'''
  rationale: Kata 'waktu' mempertahankan keluasan makna καιρός dan tidak memaksakan unsur penetapan secara eksplisit, sementara kemungkinan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kalian' dipakai untuk memperjelas bahwa ὑμεῖς berbentuk jamak. Kapital pada enklitik '-Ku' mengikuti kebiasaan ejaan Alkitab Indonesia untuk rujukan kepada Yesus.
