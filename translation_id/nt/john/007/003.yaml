  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: id
  text: Karena itu, saudara-saudara Yesus berkata kepada-Nya, “Tinggalkan tempat ini dan pergilah ke Yudea, supaya murid-murid-Mu juga melihat pekerjaan-pekerjaan yang Engkau lakukan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan melihat” atau “mengamati.” Kata kerja Yunani ini dapat menekankan tindakan memperhatikan atau menyaksikan, dan bentuk futur dalam klausa tujuan ini dapat diterjemahkan dengan beberapa cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menjaga daya inferensial penghubung wacana dengan bentuk Indonesia yang alami dalam narasi.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara Yesus
  rationale: Bentuk maskulin jamak dalam konteks menunjuk kepada saudara laki-laki Yesus; penyebutan nama memperjelas acuan pronomina secara alami dalam bahasa Indonesia tanpa menambah klaim tentang sifat hubungan kekerabatan.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Tinggalkan tempat ini
  rationale: Menyampaikan perintah langsung untuk beranjak dari lokasi sekarang dengan bahasa Indonesia modern.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: pergilah ke Yudea
  rationale: Padanan langsung dan wajar bagi perintah bergerak menuju wilayah Yudea.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: supaya murid-murid-Mu juga
  rationale: “Supaya” mempertahankan tujuan yang diperkenalkan ἵνα, sedangkan “juga” mewakili καὶ.
- source_word: θεωρήσουσιν
  choice: melihat
  rationale: Dalam klausa tujuan sesudah ἵνα, bentuk futur ini menyatakan hasil yang dimaksudkan; “melihat” alami sekaligus mempertahankan makna perseptual, sementara nuansa mengamati dicatat dalam catatan kaki.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: pekerjaan-pekerjaan yang Engkau lakukan
  rationale: Mempertahankan istilah tematis ἔργα dalam Injil Yohanes dan mengungkapkan hubungan dengan Yesus secara idiomatis melalui klausa relatif.
theological_decisions:
- issue: Acuan οἱ ἀδελφοὶ αὐτοῦ
  choice: Saudara-saudara laki-laki Yesus sebagai para penutur dalam narasi
  alternative: Kerabat atau sanak saudara Yesus dalam arti yang lebih luas
  rationale: Konteks Yohanes 7:3–5 menampilkan anggota keluarga yang disebut dengan istilah maskulin jamak ἀδελφοί. Terjemahan mempertahankan istilah kekeluargaan tanpa menentukan lebih jauh sifat biologis hubungan itu.
- issue: Daya klausa tujuan ἵνα dengan futur θεωρήσουσιν
  choice: supaya ... melihat
  alternative: sehingga ... akan melihat atau supaya ... mengamati
  rationale: Terjemahan utama mempertahankan tujuan ajakan para saudara tanpa mengubahnya menjadi kepastian hasil; kemungkinan nuansa futur dan pengamatan tetap disebutkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai kapital penghormatan sesuai kelaziman penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan hubungan tujuan, istilah kekeluargaan, atau tema “pekerjaan-pekerjaan” dalam Yohanes.
