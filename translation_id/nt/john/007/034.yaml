base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: id
  text: Kalian akan mencari Aku tetapi tidak akan menemukan Aku, dan kalian tidak dapat datang ke tempat Aku berada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: kalian akan mencari
  rationale: Bentuk futur orang kedua jamak menyatakan tindakan mencari pada waktu mendatang. “Kalian” mempertahankan jumlah jamak, sedangkan “mencari” merupakan padanan Indonesia yang alami dan tepat dalam konteks usaha menemukan Yesus.
- source_word: με
  choice: Aku
  rationale: Pronomina objek ini merujuk kepada Yesus. Dalam susunan Indonesia, bentuk yang sama dipakai sebagai objek; huruf kapital mengikuti kaidah penulisan pronomina yang merujuk kepada Tuhan.
- source_word: οὐχ εὑρήσετε
  choice: tidak akan menemukan Aku
  rationale: Negasi dengan futur diterjemahkan secara langsung tanpa menambahkan penekanan yang tidak terdapat dalam teks Yunani. Objek “Aku” diulang agar kalimat Indonesia jelas dan alami.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: ke tempat Aku berada
  rationale: Secara harfiah klausa ini berarti “di mana Aku berada”. Karena klausa tersebut melengkapi verba gerak “datang”, “ke tempat Aku berada” lebih alami dalam bahasa Indonesia dan tetap mempertahankan makna lokatifnya. Pronomina eksplisit ἐγώ memberi kontras dengan ὑμεῖς; kontras itu terpelihara melalui “Aku” dan “kalian”.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: kalian tidak dapat datang
  rationale: “Tidak dapat” menyatakan ketidakmampuan yang terkandung dalam δύνασθε, bukan larangan atau tidak adanya izin. “Datang” menerjemahkan infinitif ἐλθεῖν secara langsung.
theological_decisions:
- issue: Sifat ketidakmampuan untuk datang ke tempat Yesus berada
  choice: 'Dinyatakan sebagai ketidakmampuan: “kalian tidak dapat datang”.'
  alternative: “Kalian tidak boleh datang,” yang akan menyiratkan larangan atau ketiadaan izin.
  rationale: δύνασθε berbicara tentang kemampuan. Ayat ini tidak menjelaskan apakah ketidakmampuan itu bersifat moral, rohani, penghakiman, atau sementara, sehingga terjemahan tidak menentukan penjelasan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk mempertahankan orang kedua jamak secara jelas. Struktur kalimat tetap dekat dengan urutan dan ketegangan teks Yunani tanpa terdengar kaku.
