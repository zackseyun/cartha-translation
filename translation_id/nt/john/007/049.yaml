base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: id
  text: Namun, orang banyak ini, yang tidak mengenal Taurat[a], terkutuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud dengan “Taurat” ialah hukum Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan perkataan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ὁ ὄχλος οὗτος
  choice: orang banyak ini
  rationale: Padanan alami untuk kelompok orang tanpa memasukkan nuansa merendahkan seperti 'gerombolan'.
- source_word: ὁ μὴ γινώσκων
  choice: yang tidak mengenal
  rationale: Menyampaikan sifat atributif partisipel kini, yaitu anggapan bahwa mereka tidak memiliki pengenalan terhadap Taurat.
- source_word: τὸν νόμον
  choice: Taurat
  rationale: Dalam konteks ucapan kaum Farisi, νόμος menunjuk pada hukum Yahudi, yakni Taurat; istilah ini jelas dan lazim bagi pembaca Indonesia.
- source_word: ἐπάρατοί εἰσιν
  choice: terkutuk
  rationale: Mempertahankan nada kecaman yang keras dan konstruksi predikatif Yunani; dalam bahasa Indonesia bentuk ini wajar bagi subjek kolektif.
theological_decisions:
- issue: Apakah kecaman para pembicara harus dibedakan secara eksplisit dari penilaian narator
  choice: Menerjemahkan kecaman itu secara langsung sebagai bagian dari ucapan para tokoh.
  alternative: Menambahkan ungkapan seperti 'menurut mereka' atau 'mereka anggap terkutuk'.
  rationale: Teks Yunani menyajikannya sebagai ucapan langsung lawan-lawan Yesus. Terjemahan mempertahankan kerasnya penilaian mereka tanpa menyiratkan bahwa narator mendukungnya dan tanpa menambahkan jarak yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Orang banyak' dipilih daripada 'massa' atau 'gerombolan' agar tidak menambahkan konotasi negatif yang tidak diwajibkan oleh ὄχλος. Tanda kutip penutup mengikuti konteks ayat sebagai ucapan langsung.
