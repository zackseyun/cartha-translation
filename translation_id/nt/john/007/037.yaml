  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: id
  text: Pada hari terakhir, hari besar perayaan itu, Yesus berdiri lalu berseru, “Jika ada orang yang haus, hendaklah ia[a] datang kepada-Ku dan minum.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pronomina “ia” menerjemahkan ungkapan Yunani tunggal yang bersifat generik, yakni “siapa pun.” Dalam bahasa Indonesia, “ia” tidak menandai gender.
    reason: Menjelaskan bentuk tunggal generik dari τις dan ditempatkan langsung pada pronomina yang dijelaskan.
lexical_decisions:
- source_word: Ἐν δὲ
  choice: Pada
  rationale: Ἐν dengan datif menandai waktu. Partikel δέ hanya merupakan penghubung ringan dan tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia karena alur narasi sudah jelas.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: hari terakhir
  rationale: Padanan temporal yang langsung dan wajar, tanpa menambahkan nuansa eskatologis yang tidak dituntut konteks.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: yaitu hari yang agung dalam perayaan itu
  rationale: Frasa ini menerangkan hari terakhir sebagai hari yang besar atau agung. 'Perayaan' menyampaikan ἑορτή secara alami dalam konteks perayaan keagamaan.
- source_word: εἱστήκει
  choice: berdiri
  rationale: Bentuk ἵστημι ini menggambarkan posisi Yesus yang berdiri; bentuk naratif sederhana paling alami dalam bahasa Indonesia.
- source_word: ἔκραξεν λέγων
  choice: berseru, kata-Nya
  rationale: '''Berseru'' mempertahankan gagasan ujaran publik dengan suara kuat, sedangkan ''kata-Nya'' memperkenalkan isi seruan secara alami.'
- source_word: Ἐάν τις διψᾷ
  choice: Jika ada orang yang haus
  rationale: τις bersifat tak tentu dan umum; 'ada orang yang' mempertahankan bentuk tunggal generik. 'Haus' menjaga citra sumber tetap terbuka.
- source_word: ἐρχέσθω πρός με
  choice: hendaklah ia datang kepada-Ku
  rationale: Bentuk imperatif orang ketiga dipertahankan dengan 'hendaklah', sementara 'ia' merujuk secara tunggal dan generik kepada orang yang haus.
- source_word: καὶ πινέτω
  choice: dan minum
  rationale: Imperatif kedua dikoordinasikan dengan yang pertama. Dalam bahasa Indonesia, daya perintah 'hendaklah' secara alami mencakup verba kedua tanpa harus diulang.
theological_decisions:
- issue: Daya metaforis rasa haus dan minum
  choice: Mempertahankan citra secara harfiah sebagai 'haus' dan 'minum'.
  alternative: Menjelaskannya sebagai kerinduan rohani, percaya, atau menerima Roh.
  rationale: Ayat ini sendiri menyampaikan undangan melalui citra yang kemudian dikembangkan dalam konteks. Penjelasan langsung dalam teks utama akan menutup keterbukaan dan ketegangan teologisnya.
- issue: Ungkapan tunggal generik setelah τις
  choice: Menggunakan 'ia' sebagai pronomina tunggal generik.
  alternative: Mengubahnya menjadi bentuk jamak atau seruan langsung orang kedua.
  rationale: Bahasa Yunani memakai konstruksi tunggal generik. 'Ia' mempertahankan jumlah dan rujukan generik tanpa menambahkan pembedaan gender yang tidak dimiliki pronomina Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Ungkapan 'hari yang agung' mempertahankan penekanan sumber tanpa memakai istilah teknis, sedangkan 'hendaklah' menjaga daya undangan sekaligus perintah dari bentuk imperatif Yunani.
