  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: id
  text: Maka Yesus berkata kepada mereka, “Waktu-Ku belum tiba,[a] tetapi waktu kalian selalu tersedia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Waktu-Ku yang telah ditentukan belum tiba.” Kata Yunani yang dipakai dapat berarti waktu yang tepat atau yang telah ditentukan, bukan sekadar waktu pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan yang bersifat konsekuensial dari perkataan saudara-saudara Yesus, dengan ungkapan naratif yang alami dalam bahasa Indonesia.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Yesus berkata
  rationale: Bentuk kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang wajar tanpa mengubah tindakan yang diceritakan.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Mempertahankan objek tak langsung tanpa memperjelas identitas mereka di luar yang dinyatakan ayat ini.
- source_word: καιρός
  choice: waktu
  rationale: Dalam konteks ini menunjuk pada saat yang tepat atau yang ditentukan, bukan sekadar waktu kronologis; 'waktu' tetap alami dan tidak mempersempit maknanya.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: Waktu-Ku
  rationale: Mempertahankan kontras kepemilikan yang tegas dan mengikuti kaidah bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: οὔπω πάρεστιν
  choice: belum tiba
  rationale: Mengungkapkan secara idiomatis bahwa waktu tersebut belum hadir atau belum datang.
- source_word: δὲ
  choice: tetapi
  rationale: Menandai pertentangan antara waktu Yesus dan waktu mereka.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: waktu kalian
  rationale: Mencerminkan struktur klausa pertama; 'kalian' secara alami menunjukkan orang kedua jamak dan membedakannya dari bentuk tunggal.
- source_word: πάντοτέ
  choice: selalu
  rationale: Padanan langsung yang menyatakan kesiapan pada setiap waktu.
- source_word: ἕτοιμος
  choice: siap
  rationale: Mempertahankan predikat Yunani secara dekat dan membiarkan ungkapan yang agak mencolok 'waktu ... siap' tetap membawa nuansa kesempatan yang senantiasa tersedia.
theological_decisions:
- issue: Makna 'waktu' Yesus dalam konteks Injil Yohanes
  choice: Waktu-Ku
  alternative: Saat-Ku yang telah ditentukan; saat-Ku; waktu-Ku yang tepat
  rationale: Teks memakai καιρός, bukan ὥρα. Terjemahan tidak mengubahnya menjadi istilah 'saat/jam' yang dapat mengimpor asosiasi teologis Yohanes secara lebih khusus, tetapi catatan menjelaskan kemungkinan makna waktu yang tepat atau ditentukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipilih untuk menyatakan bentuk jamak secara jelas dalam percakapan, sedangkan susunan paralel kedua klausa dipertahankan agar kontras retoris teks sumber tetap terasa.
