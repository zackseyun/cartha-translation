id: JHN.7.17
reference: John 7:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: id
  text: Jika seseorang mau melakukan kehendak-Nya, ia akan mengetahui apakah ajaran itu berasal dari Allah atau apakah Aku berbicara dari diri-Ku sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas kemauan-Ku sendiri” atau “atas wewenang-Ku sendiri.” Secara harfiah, bahasa Yunani berbunyi “dari diri-Ku sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Jika seseorang mau
  rationale: Konstruksi ἐάν dengan bentuk subjungtif menyatakan syarat umum, sedangkan θέλω mengandung unsur kemauan atau keinginan. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: melakukan kehendak-Nya
  rationale: Ungkapan ποιεῖν τὸ θέλημα secara idiomatis berarti melakukan kehendak seseorang. Pronomina tetap dipertahankan sebagaimana teks Yunani, dengan rujukan kepada Allah yang jelas dari konteks.
- source_word: γνώσεται περὶ τῆς διδαχῆς
  choice: ia akan mengetahui apakah ajaran itu
  rationale: γνώσεται menyatakan pengetahuan atau pengenalan yang akan diperoleh. Dalam bahasa Indonesia, isi yang diketahui paling alami langsung diperkenalkan oleh 'apakah'; 'ajaran itu' menunjuk kepada ajaran Yesus yang sedang dibicarakan.
- source_word: πότερον ... ἢ
  choice: apakah ... atau apakah
  rationale: Pasangan ini menghadapkan dua kemungkinan. Pengulangan 'apakah' mempertahankan kesejajaran dan memperjelas kontras.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: berasal dari Allah
  rationale: ἐκ menyatakan sumber atau asal. 'Berasal dari Allah' menyampaikan fungsi itu dengan jelas dan alami.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  choice: Aku berbicara dari diri-Ku sendiri
  rationale: Terjemahan ini mempertahankan gambaran sumber atau asal dalam ἀπ’ ἐμαυτοῦ dan tidak mempersempitnya menjadi persoalan kemauan atau wewenang saja.
theological_decisions:
- issue: Rujukan αὐτοῦ dalam τὸ θέλημα αὐτοῦ
  choice: Dipertahankan sebagai pronomina 'kehendak-Nya', dengan Allah sebagai rujukan kontekstual.
  alternative: kehendak Allah
  rationale: Konteks menyatakan bahwa ajaran Yesus mungkin berasal dari Allah, sehingga rujukannya cukup jelas. Mempertahankan pronomina menghindari penjelasan berlebih.
- issue: Makna ἀπ’ ἐμαυτοῦ
  choice: dari diri-Ku sendiri
  alternative: atas kemauan-Ku sendiri; atas wewenang-Ku sendiri
  rationale: Bahasa Yunani secara langsung menyatakan sumber atau asal. Terjemahan utama mempertahankan keluasan makna itu, sedangkan kemungkinan nuansa kemandirian atau wewenang dicatat tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kapitalisasi pronomina yang merujuk kepada Allah dan Yesus mengikuti kebiasaan hormat yang umum dalam penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah frasa ἀπ’ ἐμαυτοῦ yang dijelaskannya.
