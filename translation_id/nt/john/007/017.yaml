  naturalness: Bahasa Indonesia baku dan mudah dipahami. Pengulangan “apakah ... atau apakah” sedikit formal, tetapi alami dan membantu menampilkan struktur dua alternatif dari bahasa sumber. “Dari diri-Ku sendiri” merupakan pilihan yang cukup literal, namun tetap dapat dipahami dalam register Alkitab modern.
