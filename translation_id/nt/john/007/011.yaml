  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: id
  text: Maka orang-orang Yahudi[a] mencari Dia pada perayaan itu dan berkata, “Di mana orang itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea”; dalam konteks kisah Yohanes, istilah ini mungkin secara lebih khusus merujuk kepada kalangan penguasa Yahudi di Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan atau konsekuensi naratif dari ayat sebelumnya; ungkapan ini alami dan tetap mempertahankan daya penghubungnya.
- source_word: Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Padanan leksikal yang tidak mempersempit rujukan menjadi para pemimpin; kemungkinan arti 'orang-orang Yudea' atau kalangan penguasa Yahudi dijaga dalam catatan kaki.
- source_word: ἐζήτουν
  choice: mencari
  rationale: Imperfek menunjukkan tindakan yang sedang berlangsung dalam latar perayaan; dalam bahasa Indonesia, aspek tersebut cukup jelas dari konteks dan frasa 'selama perayaan itu'.
- source_word: ἐν τῇ ἑορτῇ
  choice: selama perayaan itu
  rationale: Menunjukkan bahwa pencarian berlangsung dalam masa perayaan yang sudah disebut sebelumnya.
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk ini alami dalam narasi Indonesia; imperfek dapat menyiratkan bahwa pertanyaan tersebut terus atau berulang kali diucapkan tanpa harus menambahkan unsur yang terlalu tegas.
- source_word: ἐκεῖνος
  choice: orang itu
  rationale: Mempertahankan nuansa demonstratif dan jarak yang lebih kuat daripada sekadar 'Dia', tanpa menambahkan identitas atau penilaian yang tidak dinyatakan.
theological_decisions:
- issue: Rujukan Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; atau, secara kontekstual, kalangan penguasa Yahudi
  rationale: Ayat ini sendiri tidak secara eksplisit membatasi rujukannya kepada para pemimpin. Teks utama mempertahankan cakupan leksikal yang lebih luas, sedangkan kemungkinan kontekstual dicatat agar ambiguitas tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Kapitalisasi 'Dia' dipakai untuk memperjelas bahwa pronomina tersebut merujuk kepada Yesus; kutipan 'orang itu' mempertahankan jarak dalam ujaran para pencari.
