  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: id
  text: Para petugas itu menjawab, “Belum pernah seorang pun berbicara seperti ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Tidak pernah seorang manusia berbicara demikian.” Kata Yunani yang diterjemahkan “seorang pun” berbentuk tunggal dan di sini digunakan dengan makna yang mewakili manusia pada umumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: menjawab
  rationale: Bentuk aoris deponen dari ἀποκρίνομαι berarti ‘menjawab’ atau ‘menanggapi’; ‘menjawab’ paling wajar dalam konteks dialog ini.
- source_word: οἱ ὑπηρέται
  choice: para petugas itu
  rationale: Dalam konteks Yohanes 7:32 dan 7:45, mereka adalah petugas yang diutus untuk menangkap Yesus. ‘Petugas’ menyatakan fungsi mereka tanpa menambahkan rincian interpretatif seperti ‘penjaga Bait Allah’.
- source_word: Οὐδέποτε
  choice: Belum pernah
  rationale: Dalam pernyataan mengenai pengalaman sampai saat itu, ‘belum pernah’ merupakan ungkapan Indonesia yang alami dan mempertahankan penyangkalan kuat terhadap waktu lampau.
- source_word: ἐλάλησεν
  choice: berbicara
  rationale: Kata ini menyatakan tindakan berkata atau berbicara. Bentuk Indonesia tidak perlu menandai aspek aoris secara terpisah karena nuansa waktunya telah dibawa oleh ‘belum pernah’.
- source_word: οὕτως
  choice: seperti ini
  rationale: οὕτως menerangkan cara berbicara; ‘seperti ini’ alami dalam bahasa Indonesia modern dan mempertahankan rujukan pada cara Yesus berbicara.
- source_word: ἄνθρωπος
  choice: seorang pun
  rationale: ἄνθρωπος berbentuk tunggal dan di sini berdaya representatif. Dalam konstruksi negatif bahasa Indonesia, ‘seorang pun’ secara alami menyampaikan bahwa tidak ada manusia yang pernah berbicara demikian, tanpa menyempitkannya hanya kepada laki-laki.
theological_decisions:
- issue: Daya representatif ἄνθρωπος tunggal
  choice: seorang pun
  alternative: seorang manusia
  rationale: ἄνθρωπος dapat menunjuk seorang manusia dan dalam konteks ini berfungsi secara umum. ‘Seorang pun’ mempertahankan daya universal dalam kalimat negatif, sedangkan catatan kaki menyediakan bentuk yang lebih dekat secara formal tanpa mengharuskan makna khusus laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Para petugas itu’ sesuai dengan konteks kelembagaan tanpa menjadi terlalu teknis; susunan kutipan dibuat idiomatis bagi pembaca umum.
