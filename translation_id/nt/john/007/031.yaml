  source_fidelity: Teks dengan tepat mencerminkan kontras δέ, makna partitif ἐκ τοῦ ὄχλου, iman kepada Yesus, serta perbandingan tanda-tanda dalam pertanyaan retoris. “Mesias” tepat untuk Ὁ χριστός dalam konteks pengharapan Yahudi. Bentuk pertanyaan Indonesia tidak dengan sendirinya menandai ekspektasi jawaban negatif dari μή, tetapi catatan kaki menerangkannya tanpa mengubah teks utama menjadi penafsiran dogmatis.
  naturalness: Bahasa Indonesia baku dan mudah dipahami. “Banyak orang dari antara orang banyak itu” agak repetitif, tetapi tetap alami dalam register Alkitab dan menyatakan bahwa mereka merupakan bagian dari kerumunan. “Orang ini” mencerminkan demonstratif οὗτος dengan baik dalam ujaran publik.
  terminology: “Mesias,” “percaya kepada-Nya,” dan “tanda” konsisten dengan konteks Yohanes serta tidak menambahkan makna “mukjizat” yang tidak secara eksplisit dinyatakan. Kapitalisasi “-Nya” dan “Ia” sesuai kebiasaan penerbitan Alkitab Indonesia.
