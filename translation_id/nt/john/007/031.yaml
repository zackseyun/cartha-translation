id: JHN.7.31
reference: John 7:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: id
  text: Namun, banyak orang dari antara orang banyak itu percaya kepada-Nya dan berkata, “Apabila Mesias datang, apakah Ia akan melakukan lebih banyak tanda daripada yang telah dilakukan orang ini?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pertanyaan ini mengharapkan jawaban “tidak”; maksudnya, Mesias tidak akan melakukan lebih banyak tanda daripada yang telah dilakukan Yesus.
    reason: Menjelaskan daya retoris partikel Yunani μή yang tidak selalu tampak jelas dalam bentuk pertanyaan bahasa Indonesia.
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Namun, banyak orang dari antara orang banyak itu
  rationale: 'Susunan ini mempertahankan kontras ringan δέ dan makna partitif ἐκ τοῦ ὄχλου: sejumlah besar orang berasal dari kelompok orang banyak tersebut.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: percaya kepada-Nya
  rationale: Ungkapan ini menyatakan kepercayaan yang diarahkan kepada pribadi Yesus; bentuk Indonesia ini alami dan tidak menambahkan kadar komitmen yang tidak dinyatakan secara eksplisit.
- source_word: ἔλεγον
  choice: berkata
  rationale: Dalam konteks ujaran kolektif, bentuk sederhana ini alami dalam bahasa Indonesia; aspek imperfek dapat dipahami sebagai percakapan yang berlangsung tanpa perlu diberi tambahan seperti 'terus berkata'.
- source_word: Ὁ χριστός
  choice: Mesias
  rationale: Χριστός dipakai sebagai gelar dalam konteks pengharapan Yahudi, sehingga 'Mesias' menyampaikan fungsi titulernya dengan jelas.
- source_word: ὅταν ἔλθῃ
  choice: Apabila Mesias datang
  rationale: ὅταν dengan subjungtif menunjuk pada kemungkinan masa depan. 'Apabila' mempertahankan unsur kontingensi tanpa mengubahnya menjadi keraguan eksplisit.
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: apakah Ia akan melakukan lebih banyak tanda
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif. Bentuk pertanyaan Indonesia ini, bersama perbandingan yang mengikutinya, menyampaikan maksud retoris tersebut tanpa menambahkan penegasan yang berlebihan.
- source_word: σημεῖα
  choice: tanda
  rationale: Dalam Injil Yohanes, istilah ini bukan sekadar menyebut mukjizat, melainkan tindakan yang menunjuk pada identitas dan karya Yesus; 'tanda' mempertahankan istilah khas itu.
- source_word: ὧν οὗτος ἐποίησεν
  choice: daripada yang telah dilakukan orang ini
  rationale: '''Orang ini'' merupakan rujukan publik yang alami kepada Yesus, sedangkan ''telah dilakukan'' mengaitkan tanda-tanda yang sudah terjadi dengan perbandingan masa depan.'
theological_decisions:
- issue: Fungsi Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa mengenai kedatangan tokoh yang dinantikan, kata tersebut berfungsi sebagai gelar mesianik, bukan sebagai nama diri. 'Mesias' mempertahankan konteks pengharapan Yahudi.
- issue: Daya retoris pertanyaan dengan μή
  choice: Pertanyaan yang secara tersirat mengharapkan jawaban 'tidak'
  alternative: Pertanyaan masa depan yang sepenuhnya netral
  rationale: Partikel μή lazimnya menandai dugaan jawaban negatif. Terjemahan tetap berbentuk pertanyaan agar penilaian orang banyak terhadap tanda-tanda Yesus tidak dijadikan pernyataan teologis langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan pronominal kepada Yesus ditulis dengan kapital menurut kebiasaan penerbitan Alkitab Indonesia. Istilah 'orang banyak' dipertahankan untuk ὄχλος, dan 'tanda' dipakai secara konsisten dengan terminologi khas Yohanes.
