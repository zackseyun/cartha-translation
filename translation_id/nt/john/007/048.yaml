  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: id
  text: Adakah seorang pun di antara para pemimpin atau orang Farisi yang percaya kepada-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, pertanyaan yang diawali μή mengharapkan jawaban “tidak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Adakah seorang pun
  rationale: Mempertahankan bentuk pertanyaan retoris yang secara alami mengisyaratkan jawaban ‘tidak’, tanpa mengubahnya menjadi penyangkalan eksplisit.
- source_word: ἐκ τῶν ἀρχόντων
  choice: di antara para pemimpin
  rationale: Menunjukkan keanggotaan dalam kalangan penguasa Yahudi; ‘para pemimpin’ alami dalam bahasa Indonesia dan cukup mempertahankan cakupan istilah sumber.
- source_word: ἐπίστευσεν
  choice: yang percaya
  rationale: Dalam konstruksi pertanyaan ini, bentuk relatif dengan ‘percaya’ terdengar alami dan menyampaikan tindakan percaya tanpa menambahkan aspek yang tidak dinyatakan.
- source_word: εἰς αὐτόν
  choice: kepada-Nya
  rationale: ‘Percaya kepada’ adalah padanan idiomatis bahasa Indonesia bagi πιστεύω εἰς ketika objeknya adalah pribadi.
- source_word: ἢ
  choice: atau
  rationale: Koordinasi sederhana mempertahankan struktur dan tidak memperkuat retorika secara berlebihan.
- source_word: ἐκ τῶν Φαρισαίων
  choice: orang Farisi
  rationale: Sebutan baku bagi anggota kelompok Farisi; dalam rangkaian ‘di antara ... atau ...’, frasa ini tetap menunjukkan orang dari kelompok tersebut.
theological_decisions:
- issue: Daya retoris pertanyaan negatif
  choice: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ‘tidak’.
  alternative: 'Mengubahnya menjadi pernyataan eksplisit: ‘Tentu tidak seorang pun dari para pemimpin atau orang Farisi percaya kepada-Nya.’'
  rationale: μή τις mengisyaratkan jawaban negatif, tetapi teks sumber tetap berbentuk pertanyaan. Bentuk itu mempertahankan nada meremehkan dari para penutur dan ambiguitas formalnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Adakah seorang pun’ dipilih untuk mempertahankan bentuk retoris; ‘para pemimpin’ dan ‘orang Farisi’ mudah dipahami pembaca umum.
