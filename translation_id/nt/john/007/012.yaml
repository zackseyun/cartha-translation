  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: id
  text: Ada banyak bisik-bisik[a] tentang Dia di antara orang banyak. Sebagian berkata, “Dia orang baik.” Namun, yang lain berkata, “Tidak! Justru Dia menyesatkan orang banyak[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak sungut-sungut tentang Dia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Dia menipu orang banyak” atau “Dia membawa orang banyak ke jalan yang salah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: bisik-bisik
  rationale: Kata ini menunjuk pada pembicaraan dengan suara rendah yang dapat bernuansa sungut-sungut atau keluhan. “Bisik-bisik” secara alami mempertahankan sifat pembicaraan yang tidak terbuka tanpa menetapkan bahwa semuanya berupa keluhan.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: Padanan Indonesia yang langsung dan alami untuk topik pembicaraan; kapitalisasi pronomina mengikuti register Alkitab Indonesia yang umum bagi Yesus.
- source_word: πολύς
  choice: banyak
  rationale: Menunjukkan luas atau banyaknya bisik-bisik tersebut secara ringkas.
- source_word: ἐν τοῖς ὄχλοις
  choice: di antara orang banyak
  rationale: Menggambarkan pembicaraan yang beredar di tengah kelompok-kelompok massa; bahasa Indonesia lazim memakai ungkapan kolektif “orang banyak” meskipun bentuk Yunani di sini jamak.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Sebagian ... Namun, yang lain ...
  rationale: Menyatakan dua kelompok dengan penilaian yang bertentangan secara jelas dan alami.
- source_word: Ἀγαθός ἐστιν
  choice: Dia orang baik
  rationale: Predikat adjektival Yunani secara harfiah berarti “Dia baik”; dalam konteks penilaian atas karakter seseorang, “Dia orang baik” lebih idiomatis dalam bahasa Indonesia tanpa menambah klaim teologis.
- source_word: Οὔ, ἀλλὰ
  choice: Tidak! Justru
  rationale: Mempertahankan penolakan langsung yang diikuti koreksi tegas.
- source_word: πλανᾷ
  choice: menyesatkan
  rationale: Mempertahankan kemungkinan makna membawa orang ke jalan yang salah tanpa memastikan apakah tekanannya pada penipuan yang disengaja atau akibat berupa kesesatan.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: Padanan kolektif yang alami dan menjaga hubungan leksikal dengan ὄχλοις sebelumnya.
theological_decisions:
- issue: Penilaian yang bertentangan tentang Yesus
  choice: 'Kedua pendapat dilaporkan langsung dan tanpa dukungan narator: “Dia orang baik” dan “Dia menyesatkan orang banyak.”'
  alternative: Melunakkan salah satu penilaian atau menjelaskan pendapat mana yang benar.
  rationale: Ayat ini melaporkan perpecahan pendapat di tengah orang banyak dan tidak secara eksplisit memberikan putusan narator; ketegangan itu perlu dipertahankan.
- issue: Nuansa πλανᾷ
  choice: menyesatkan
  alternative: menipu
  rationale: “Menyesatkan” mempertahankan cakupan semantis yang dapat menunjuk pada membawa ke dalam kekeliruan, sedangkan “menipu” lebih tegas mengisyaratkan kesengajaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bisik-bisik” dipilih untuk pembicaraan dengan suara rendah; “sungut-sungut” dicatat sebagai alternatif bernuansa keluhan. Tanda seru pada “Tidak!” menyampaikan bantahan tegas tanpa menambah isi.
