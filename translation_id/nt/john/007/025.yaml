  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pertanyaan retoris dipertahankan, sedangkan aspek imperfek dibiarkan tersirat karena penandaan eksplisit dengan “sedang” akan terdengar seolah-olah semua orang itu berbicara serempak.
