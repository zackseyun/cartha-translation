  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: id
  text: Maka beberapa orang dari penduduk Yerusalem[a] berkata, “Bukankah ini orang yang hendak mereka bunuh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “beberapa penduduk Yerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang berlangsung atau berulang dalam adegan itu. Bahasa Indonesia tidak wajib menandai aspek tersebut; “berkata” paling alami tanpa memaksakan arti bahwa mereka sedang berbicara serempak.
- source_word: οὖν
  choice: Maka
  rationale: Kata ini menghubungkan ucapan tersebut dengan konteks sebelumnya, baik sebagai kelanjutan naratif maupun sebagai tanggapan logis. “Maka” mempertahankan daya penghubung itu secara ringkas dan wajar.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: beberapa penduduk Yerusalem
  rationale: Frasa ini menunjuk pada sejumlah orang dari antara para penghuni Yerusalem. Ungkapan terpilih alami dalam bahasa Indonesia dan tidak sekadar menyatakan bahwa mereka berasal dari kota itu.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Bukankah ini orang
  rationale: Οὐχ memperkenalkan pertanyaan yang mengharapkan jawaban ya. Susunan “Bukankah ini orang...” mempertahankan dorongan retoris dan penunjukan langsung kepada Yesus.
- source_word: ὃν ζητοῦσιν ἀποκτεῖναι
  choice: yang mereka cari untuk dibunuh
  rationale: Terjemahan ini mempertahankan ζητοῦσιν sebagai tindakan mencari yang sedang berlangsung dan ἀποκτεῖναι sebagai tujuan membunuh, tanpa menambahkan nuansa proses hukum.
