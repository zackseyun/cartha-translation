id: JHN.7.35
reference: John 7:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi[a] berkata satu sama lain, “Ke manakah orang ini akan pergi sehingga kita tidak akan menemukannya? Ia tidak akan pergi ke Diaspora[b] di antara orang-orang Yunani dan mengajar orang-orang Yunani, bukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea.” Istilah Yunani ini dapat menunjuk orang Yahudi pada umumnya atau, dalam konteks tertentu, orang-orang dari Yudea.
    reason: lexical_alternative
  - marker: b
    text: “Diaspora di antara orang-orang Yunani” menunjuk orang-orang Yahudi yang hidup tersebar di tengah populasi berbahasa atau berkebudayaan Yunani, bukan suatu diaspora yang terdiri atas orang-orang Yunani.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Padanan langsung yang wajar dalam konteks ini; teks tidak secara eksplisit membatasi kelompok tersebut pada para pemimpin. Kemungkinan arti regional dipertahankan dalam catatan kaki.
- source_word: πρὸς ἑαυτούς
  choice: satu sama lain
  rationale: Menyampaikan makna timbal balik bahwa mereka berbicara di antara anggota kelompok itu.
- source_word: Ποῦ οὗτος
  choice: Ke manakah orang ini
  rationale: Kata οὗτος memiliki nuansa menunjuk atau mengambil jarak; “orang ini” mempertahankan nuansa itu secara alami.
- source_word: μέλλει πορεύεσθαι
  choice: akan pergi
  rationale: Dalam pertanyaan spekulatif ini, bentuk Indonesia tersebut secara alami menyampaikan tindakan yang diperkirakan atau dimaksudkan akan terjadi tanpa memaksakan pembedaan antara niat dan waktu dekat.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: sehingga kita tidak akan menemukan dia
  rationale: Menyampaikan hubungan akibat yang dimaksud oleh pertanyaan dan mempertahankan verba futur tanpa menambahkan gagasan kemampuan.
- source_word: μὴ
  choice: Apakah ia akan ...?
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif. Dalam bahasa Indonesia, bentuk pertanyaan ini alami; ekspektasi negatifnya muncul dari konteks spekulasi yang tidak masuk akal bagi para penutur.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: orang-orang Yahudi yang tersebar di antara orang-orang Yunani
  rationale: Mengungkapkan referen budaya διασπορά secara jelas bagi pembaca modern dan memahami genitif sebagai lingkungan tempat mereka tersebar, bukan orang Yunani sebagai kelompok yang tercerai-berai.
- source_word: Ἕλληνας
  choice: orang-orang Yunani
  rationale: Mempertahankan arti leksikal etnis-budaya dan tidak memperluasnya menjadi semua bangsa bukan Yahudi.
theological_decisions:
- issue: Cakupan οἱ Ἰουδαῖοι dalam narasi Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea
  rationale: Konteks ini tidak menuntut pembatasan regional maupun penambahan “para pemimpin”; alternatif regional dicatat agar ambiguitas leksikal tetap terlihat.
- issue: Identitas διασπορά dalam frasa διασπορὰ τῶν Ἑλλήνων
  choice: orang-orang Yahudi yang tersebar di antara orang-orang Yunani
  alternative: diaspora di antara orang-orang Yunani
  rationale: Dalam pemakaian Yahudi, διασπορά menunjuk komunitas Yahudi yang tersebar. Perumusan eksplisit mencegah salah pengertian bahwa orang Yunani sendiri yang tersebar, tanpa mengubah objek pengajaran pada klausa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Orang ini” mempertahankan nada mengambil jarak, sedangkan uraian tentang komunitas yang tersebar dipilih agar istilah budaya tersebut langsung dipahami pembaca umum.
