  terminology: “Dia yang mengutus Aku” dengan tepat mencerminkan partisip substantival τὸν πέμψαντά με dan mempertahankan pengacuan tidak langsung dalam sumber. Kapitalisasi kata ganti hormat dapat dipertahankan sebagai konvensi Indonesia tanpa mengubah makna.
