  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: id
  text: Maka Yesus berkata, “Aku masih bersama kalian untuk sedikit waktu lagi[a], dan Aku pergi kepada Dia yang mengutus Aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “masih untuk waktu yang singkat.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks Injil Yohanes yang lebih luas, “Dia yang mengutus Aku” merujuk kepada Bapa.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan naratif sekaligus hubungan logis dengan percakapan sebelumnya tanpa membuat hubungan sebab-akibat terlalu tegas.
- source_word: Ἔτι χρόνον μικρόν
  choice: masih ... untuk waktu yang singkat
  rationale: Mempertahankan unsur ἔτι (‘masih’) dan χρόνον μικρόν (‘waktu yang singkat’) serta gagasan bahwa waktu kebersamaan yang tersisa hanya pendek.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Aku ... bersama kalian
  rationale: Menyampaikan bentuk kini dan menunjukkan bahwa ὑμῶν berjumlah jamak. ‘Kalian’ merupakan bentuk modern yang wajar dan jelas.
- source_word: καὶ ὑπάγω
  choice: dan Aku pergi
  rationale: Mempertahankan penghubung sederhana καί dan kesederhanaan ὑπάγω tanpa menambahkan ‘kemudian’, yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: πρὸς τὸν πέμψαντά με
  choice: kepada Dia yang mengutus Aku
  rationale: Mempertahankan bentuk partisip substantival, ‘Dia yang mengutus Aku’, tanpa menyebut Bapa secara eksplisit di dalam teks utama.
theological_decisions:
- issue: Identitas ‘Dia yang mengutus Aku’
  choice: Mempertahankan ungkapan tidak langsung ‘Dia yang mengutus Aku’.
  alternative: kepada Bapa yang mengutus Aku
  rationale: Dalam konteks Injil Yohanes, yang dimaksud ialah Bapa, tetapi ayat Yunani ini sendiri memakai ungkapan relasional dan tidak menyebut ‘Bapa’ secara langsung.
- issue: Nuansa kepergian Yesus dalam ὑπάγω
  choice: Menerjemahkannya secara sederhana sebagai ‘Aku pergi’.
  alternative: Aku kembali
  rationale: Konteks Yohanes memberi kepergian ini bobot teologis sebagai kepergian kepada Bapa, tetapi kata ‘kembali’ tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk menyatakan bentuk jamak secara jelas; huruf kapital pada kata ganti yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penghormatan yang lazim tanpa menambah identifikasi yang tidak eksplisit dalam teks Yunani.
