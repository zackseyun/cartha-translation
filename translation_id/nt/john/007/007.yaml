id: JHN.7.7
reference: John 7:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: id
  text: Dunia tidak dapat membenci kalian,[a] tetapi dunia membenci Aku, karena Aku bersaksi tentangnya bahwa perbuatan-perbuatannya jahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak sanggup membenci kalian.”
    reason: lexical_alternative
  - marker: b
    text: Dalam Injil Yohanes, “dunia” sering menunjuk kepada tatanan manusia yang menentang Allah, bukan kepada alam ciptaan itu sendiri.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: tidak dapat
  rationale: Mempertahankan gagasan ketidakmampuan yang dinyatakan oleh δύναμαι, dengan ungkapan Indonesia yang alami dan langsung.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes tanpa mempersempitnya menjadi parafrasa seperti 'umat manusia yang melawan Allah'; konteks menunjukkan tatanan manusia yang menentang Yesus.
- source_word: μισεῖν / μισεῖ
  choice: membenci / membenci
  rationale: Mengulang padanan yang sama untuk menjaga ketegasan verba Yunani dan kontras retoris antara 'kalian' dan 'Aku'.
- source_word: ἐμὲ δὲ
  choice: tetapi dunia membenci Aku
  rationale: δέ menyatakan kontras; subjek 'dunia' diulang agar kalimat Indonesia jelas dan alami, sementara penekanan pada objek ἐμέ tetap terasa.
- source_word: μαρτυρῶ
  choice: Aku bersaksi
  rationale: Padanan ini mempertahankan nuansa kesaksian yang penting dalam Injil Yohanes dan tetap wajar dalam bahasa Indonesia modern.
- source_word: περὶ αὐτοῦ
  choice: tentangnya
  rationale: Merujuk kembali kepada 'dunia' tanpa mempersonifikasikannya secara berlebihan.
- source_word: τὰ ἔργα αὐτοῦ
  choice: perbuatan-perbuatannya
  rationale: Dalam konteks moral ini, 'perbuatan' lebih alami daripada 'pekerjaan' dan tetap mewakili bentuk jamak ἔργα.
- source_word: πονηρά
  choice: jahat
  rationale: Menyampaikan penilaian moral yang kuat, bukan sekadar 'buruk' dalam arti mutu rendah.
theological_decisions:
- issue: Cakupan dan daya teologis istilah 'dunia' dalam konteks Yohanes
  choice: Mempertahankan 'dunia' dalam teks utama
  alternative: umat manusia yang memberontak terhadap Allah; tatanan dunia yang melawan Allah
  rationale: κόσμος memiliki makna berlapis dalam Yohanes. Konteks menunjukkan dunia sebagai lingkungan manusia yang menolak Yesus, tetapi parafrasa yang lebih sempit akan menutup ambiguitas dan ketegangan asli.
- issue: Sifat ketidakmampuan dunia untuk membenci saudara-saudara Yesus
  choice: Menerjemahkan secara langsung sebagai 'tidak dapat' tanpa menjelaskan sebabnya
  alternative: tidak mempunyai alasan untuk membenci; tidak mungkin membenci
  rationale: Teks menyatakan ketidakmampuan dengan οὐ δύναται, tetapi tidak menerangkan apakah ketidakmampuan itu bersifat moral, relasional, atau situasional. Terjemahan tidak boleh menyelesaikannya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai karena ὑμᾶς merujuk kepada saudara-saudara Yesus; 'Aku' dikapitalisasi sesuai kebiasaan penerbitan Alkitab Indonesia untuk perkataan Yesus. Pengulangan 'dunia' menghindari pronomina 'ia' yang terlalu mempersonifikasikan κόσμος dan membuat kontras lebih jelas.
