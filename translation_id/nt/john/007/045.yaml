  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: id
  text: Maka para petugas itu datang kepada imam-imam kepala dan orang-orang Farisi, lalu para pemimpin itu berkata kepada para petugas itu, “Mengapa kalian tidak membawa dia?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani juga dapat berarti “menggiring” atau “membawa”. Dalam konteks ini, para petugas telah diutus untuk menangkap Yesus dan membawanya kepada para pemimpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan atau konsekuensi naratif dari peristiwa sebelumnya dengan penghubung yang wajar dalam bahasa Indonesia.
- source_word: ὑπηρέται
  choice: para petugas
  rationale: Dalam konteks ini mereka adalah petugas yang diutus oleh para pemimpin untuk menangkap Yesus; pilihan ini lebih tepat daripada istilah umum seperti 'pelayan' dan tidak mempersempitnya menjadi 'penjaga Bait Allah'.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Padanan baku bagi kelompok pemimpin keimaman yang dinyatakan dalam bentuk jamak.
- source_word: Φαρισαίους
  choice: orang-orang Farisi
  rationale: Bentuk yang lazim dan mudah dipahami untuk nama kelompok Yahudi tersebut.
- source_word: ἐκεῖνοι
  choice: orang-orang itu
  rationale: Mempertahankan kata tunjuk yang dinyatakan secara eksplisit dan ditekankan dalam bahasa Yunani, dengan rujukan kepada imam-imam kepala dan orang-orang Farisi.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang alami dan tepat.
- source_word: ἠγάγετε
  choice: kalian tidak membawa
  rationale: Bentuk lampau Yunani dipahami dari konteks naratif, sedangkan bahasa Indonesia tidak perlu menandai kala secara morfologis. 'Membawa' paling sesuai dengan tugas para petugas untuk menghadapkan Yesus kepada para pemimpin.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina objek ini merujuk kepada Yesus; huruf kecil mengikuti kaidah umum bahasa Indonesia tanpa menambahkan penandaan teologis yang tidak terdapat dalam teks Yunani.
