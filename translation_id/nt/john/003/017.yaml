id: JHN.3.17
reference: John 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: id
  text: Sebab Allah tidak mengutus Sang Anak ke dalam dunia untuk menghakimi dunia[a], melainkan supaya dunia diselamatkan melalui dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menghukum dunia.” Dalam konteks ini, kata kerja Yunani tersebut dapat diterjemahkan dengan arti yang lebih sempit, tetapi arti dasarnya ialah “menghakimi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab ... bukan
  rationale: γάρ menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya, sedangkan οὐ menegasikan tujuan pengutusan; susunan ini alami dalam bahasa Indonesia.
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: ἀποστέλλω berarti mengirim atau mengutus; 'mengutus' secara alami menyampaikan pengiriman dengan suatu misi tanpa mempersempit sifat misi itu.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Sebutan θεός dengan artikel tertentu secara idiomatis diterjemahkan 'Allah' dalam konteks monoteistis ini.
- source_word: τὸν υἱὸν
  choice: Sang Anak
  rationale: Teks Yunani memakai 'Anak' dengan artikel, tanpa kata milik eksplisit. 'Sang Anak' mempertahankan sifat gelarnya serta relasinya dengan Allah tanpa menambahkan 'Anak-Nya'.
- source_word: εἰς τὸν κόσμον
  choice: ke dalam dunia
  rationale: εἰς dengan akusatif menunjukkan gerak masuk ke dalam ranah dunia; 'ke dalam dunia' mempertahankan nuansa tersebut.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: supaya ia menghakimi dunia
  rationale: κρίνω pada dasarnya berarti 'menghakimi' atau 'menilai', lebih luas daripada 'menghukum'. Terjemahan ini mempertahankan cakupan leksikal dan bentuk klausa tujuan dengan ἵνα.
- source_word: ἀλλ’ ἵνα
  choice: melainkan supaya
  rationale: Ungkapan ini menandai pertentangan kuat antara dua tujuan dan mempertahankan kesejajaran kedua klausa ἵνα.
- source_word: σωθῇ
  choice: diselamatkan
  rationale: Bentuk pasif aoristus subjungtif dari σῴζω menyatakan tujuan agar dunia menerima keselamatan; bentuk pasif Indonesia mempertahankannya dengan jelas.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Pengulangan 'dunia' mempertahankan istilah κόσμος tanpa mempersempit acuannya secara tafsir menjadi hanya umat manusia atau tata ciptaan.
- source_word: δι’ αὐτοῦ
  choice: melalui dia
  rationale: διά dengan genitif menyatakan sarana atau perantaraan; 'melalui dia' mempertahankan nuansa perantaraan tanpa penjelasan tambahan.
theological_decisions:
- issue: Makna κρίνῃ dalam pertentangannya dengan σωθῇ
  choice: menghakimi
  alternative: menghukum
  rationale: κρίνω memiliki arti dasar yang lebih luas, yaitu 'menghakimi', walaupun dalam konteks ini dapat dipahami secara lebih sempit sebagai 'menghukum'. Teks menyandingkan tujuan menghakimi dengan tujuan menyelamatkan; terjemahan utama mempertahankan ketegangan itu dan catatan kaki menyajikan kemungkinan kontekstual yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Sang Anak' dipakai untuk mempertahankan bentuk definit dan sifat gelar tanpa menambahkan kata milik yang tidak eksplisit. Kata ganti 'ia' dan 'dia' ditulis dengan huruf kecil sesuai ejaan umum serta tanpa memasukkan konvensi denominasi tertentu.
