  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: id
  text: Siapa pun yang telah menerima kesaksian-Nya telah menegaskan bahwa Allah itu benar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “telah membubuhkan meterainya sebagai tanda bahwa Allah itu benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Siapa pun yang telah menerima
  rationale: Artikel dengan partisip aoris berfungsi secara substantival dan menunjuk secara umum kepada setiap orang yang menerima; bentuk ini juga mempertahankan aspek tindakan yang telah terjadi relatif terhadap verba utama.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini paling wajar merujuk kepada tokoh yang dibicarakan dalam konteks dekat, yaitu Dia yang datang dari surga/Sang Anak.
- source_word: τὴν μαρτυρίαν
  choice: kesaksian
  rationale: Istilah ini menunjuk pada kesaksian yang diterima dan sesuai dengan motif kesaksian yang menonjol dalam Injil Yohanes.
- source_word: ἐσφράγισεν
  choice: telah menegaskan
  rationale: Secara harfiah berarti membubuhkan meterai, tetapi di sini dipakai secara metaforis untuk menyatakan pengukuhan atau penegasan. 'Telah menegaskan' alami dalam bahasa Indonesia, sedangkan metafora harfiahnya dipertahankan dalam catatan kaki.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari hal yang ditegaskan, bukan alasan kausal.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjek nominatif berartikel ini definit dan secara langsung merujuk kepada Allah.
- source_word: ἀληθής
  choice: benar
  rationale: Pilihan ini mempertahankan keluasan makna Yunani, yang dalam konteks dapat mencakup benar, berkata benar, dan dapat dipercaya.
theological_decisions:
- issue: Daya metaforis bahasa tentang meterai
  choice: Menerjemahkan ἐσφράγισεν sebagai 'telah menegaskan' dalam teks utama
  alternative: telah membubuhkan meterainya sebagai tanda bahwa; telah mengukuhkan
  rationale: Menerima kesaksian Sang Anak dipandang sebagai penegasan bahwa Allah benar. Terjemahan utama menyampaikan fungsi metafora secara jelas, sementara gambaran meterai dipertahankan dalam catatan kaki.
- issue: Cakupan makna ἀληθής ketika dikenakan kepada Allah
  choice: Allah itu benar
  alternative: Allah berkata benar; Allah dapat dipercaya
  rationale: '''Benar'' tidak mempersempit pernyataan hanya pada kejujuran ucapan atau keandalan, sehingga gema teologis yang lebih luas dalam Injil Yohanes tetap terbuka.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Bentuk 'siapa pun' bersifat generik, sedangkan 'telah menegaskan' menyampaikan makna metafora meterai tanpa menghilangkan bentuk harfiahnya dari catatan kaki.
