id: JHN.3.30
reference: John 3:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: id
  text: Ia harus makin besar, tetapi aku harus makin kecil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia harus bertambah, tetapi aku harus berkurang.”'
    reason: Alternatif ini lebih langsung mempertahankan pasangan leksikal ‘bertambah–berkurang’, sedangkan teks utama memakai ungkapan Indonesia yang lebih alami bagi kenaikan dan penurunan kedudukan atau pengaruh.
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Ia
  rationale: Kata tunjuk akusatif ini menjadi subjek logis infinitif dalam konstruksi dengan δεῖ dan dalam konteks merujuk kepada Yesus. “Ia” alami dalam bahasa Indonesia dan tidak menambahkan penekanan yang tidak dinyatakan bentuk Yunani.
- source_word: δεῖ
  choice: harus
  rationale: “Harus” mempertahankan daya keharusan atau keniscayaan dalam δεῖ tanpa menentukan secara berlebihan apakah keharusan itu berupa ketetapan ilahi, kepatutan, atau keniscayaan dalam rencana keselamatan.
- source_word: αὐξάνειν
  choice: makin besar
  rationale: Ungkapan ini alami dan cukup luas untuk mencakup bertambahnya kedudukan, pengaruh, atau keutamaan, bukan hanya pertumbuhan jasmani atau jumlah. “Makin” juga menyampaikan corak proses yang sedang berlangsung dari infinitif kini.
- source_word: ἐμὲ
  choice: aku
  rationale: Pronomina akusatif ini merupakan subjek logis infinitif. “Aku” mempertahankan tuturan langsung Yohanes dan sesuai dengan ragam Indonesia yang alami serta bermartabat.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai pertentangan antara bertambah besarnya Yesus dan menjadi kecilnya Yohanes.
- source_word: ἐλαττοῦσθαι
  choice: makin kecil
  rationale: Pilihan ini mempertahankan kesejajaran ringkas dengan “makin besar” dan menyatakan proses menjadi kurang besar atau kurang menonjol tanpa membatasi maknanya pada jumlah.
theological_decisions:
- issue: Sifat keharusan yang dinyatakan oleh δεῖ
  choice: Diterjemahkan “harus” sebagai keharusan yang kuat namun tidak diperinci.
  alternative: Menafsirkannya secara eksplisit sebagai ketetapan ilahi, atau hanya sebagai keharusan praktis.
  rationale: Dalam konteksnya, Yohanes mengakui tatanan yang mengharuskan Yesus makin menonjol dan dirinya makin surut. Teks Yunani tidak menjelaskan mekanisme keharusan itu, sehingga terjemahan tidak menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern, ringkas, dan bernada peribahasa. Pasangan “makin besar—makin kecil” menjaga kesejajaran retoris dan mudah dipahami, sementara catatan kaki menyediakan padanan leksikal yang lebih harfiah.
