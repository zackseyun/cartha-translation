  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: id
  text: Dia yang datang dari atas berada di atas semuanya.[a] Dia yang berasal dari bumi adalah dari bumi dan berbicara dari bumi.[b] Dia yang datang dari surga berada di atas semuanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari surga” untuk “dari atas” pada klausa pertama. Kata Yunani ἄνωθεν menunjukkan asal dari atas dan diperjelas oleh ungkapan “dari surga” kemudian dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “berbicara tentang bumi.” Secara lebih harfiah, bahasa Yunani kembali memakai “dari bumi”; ungkapan itu dapat menunjukkan sumber, ranah, atau pokok pembicaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: dari atas
  rationale: Dalam konteks ini kata tersebut menyatakan asal, bukan pengulangan. “Dari atas” mempertahankan gambaran vertikal dan diklarifikasi oleh “dari surga” pada akhir ayat.
- source_word: ἐρχόμενος
  choice: yang datang
  rationale: Partisipel berartikel ini berfungsi substantival; “yang datang” alami dalam bahasa Indonesia dan mempertahankan sifat deskriptif bentuk kini.
- source_word: ἐπάνω πάντων
  choice: berada di atas semuanya
  rationale: Ungkapan ini menyatakan kedudukan tertinggi. Pilihan ini mempertahankan metafora ruang sekaligus makna keunggulan, serta dapat diulang secara wajar.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: dia yang berasal dari bumi
  rationale: “Berasal dari bumi” menyampaikan asal dengan bahasa Indonesia yang alami, sementara pengulangan berikutnya tetap mempertahankan tekanan retoris teks Yunani.
- source_word: γῆ
  choice: bumi
  rationale: Kata ini berlawanan dengan surga sebagai ranah atau asal surgawi, sehingga “bumi” lebih tepat daripada “tanah” atau “negeri”.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: adalah dari bumi
  rationale: Rumusan ini sengaja mempertahankan pengulangan frasa sumber dalam bahasa Yunani, meskipun agak bertanda dalam bahasa Indonesia.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: berbicara dari bumi
  rationale: Terjemahan ini mempertahankan ἐκ dan membiarkan nuansanya tetap terbuka antara sumber, ranah, dan pokok pembicaraan.
- source_word: οὐρανός
  choice: surga
  rationale: Dalam konteks Yohanes, kata ini menunjuk pada ranah surgawi atau ilahi, bukan semata-mata langit fisik.
theological_decisions:
- issue: Hubungan antara “dari atas” dan “dari surga”
  choice: Menerjemahkan ἄνωθεν sebagai “dari atas” dan ἐκ τοῦ οὐρανοῦ sebagai “dari surga.”
  alternative: Menerjemahkan keduanya sebagai “dari surga.”
  rationale: Teks memakai dua ungkapan yang berkaitan tetapi berbeda. Pembedaan ini mempertahankan diksi Yohanes dan memungkinkan ungkapan terakhir memperjelas asal surgawi tanpa menyamakan bentuk keduanya.
- issue: Daya retoris pengulangan bahasa tentang bumi
  choice: Mempertahankan tiga kemunculan gagasan “dari bumi.”
  alternative: Meringkasnya menjadi “orang duniawi bersifat duniawi dan berbicara secara duniawi.”
  rationale: Pengulangan Yunani menegaskan kontras antara asal bumi dan asal surgawi; mempertahankannya menghindari penafsiran tambahan yang mempersempit makna.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Kata ganti “Dia” dipakai untuk rujukan personal tanpa menambahkan identitas yang tidak dinyatakan secara eksplisit dalam klausa. Pengulangan yang agak tidak biasa dipertahankan karena penting bagi retorika ayat.
