  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan makna Yunani: Μετὰ ταῦτα sebagai “Sesudah itu”; perpindahan Yesus dan murid-murid-Nya ke τὴν Ἰουδαίαν γῆν sebagai “ke wilayah Yudea”; serta dua verba imperfek, διέτριβεν dan ἐβάπτιζεν, melalui “tinggal” dan “membaptis.” Subjek tunggal yang secara gramatikal merujuk kepada Yesus dipertahankan, selaras dengan teks sumber dan audit Inggris, tanpa menyelaraskannya secara prematur dengan Yohanes 4:2.'
  naturalness: Bahasa Indonesia baku, jelas, dan alami. “Wilayah Yudea” merupakan padanan modern yang baik untuk γῆν dalam konteks kawasan, dan “Di sana Ia tinggal bersama mereka dan membaptis” mengalir baik dalam register naratif kitab suci.
  terminology: Nama “Yesus” dan “Yudea,” istilah “murid-murid-Nya,” serta “membaptis” digunakan secara konsisten dan sesuai pemakaian Indonesia modern. Kapitalisasi pronomina ilahi merupakan pilihan register yang lazim dan tidak memaksakan penafsiran denominasi.
