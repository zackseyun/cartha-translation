id: JHN.3.22
reference: John 3:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: id
  text: Sesudah itu, Yesus dan murid-murid-Nya pergi ke wilayah Yudea. Di sana Ia tinggal bersama mereka dan membaptis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yohanes 4:2 kemudian menjelaskan bahwa bukan Yesus sendiri yang membaptis, melainkan murid-murid-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini menyampaikan urutan waktu yang ditandai bentuk jamak Yunani secara alami dalam bahasa Indonesia tanpa membuatnya terlalu harfiah.
- source_word: ἦλθεν
  choice: pergi
  rationale: Dengan tujuan yang disebutkan, 'pergi ke' merupakan ungkapan naratif Indonesia yang alami untuk perpindahan Yesus dan para murid dari latar sebelumnya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Bentuk jamak dan hubungan kepunyaan disampaikan secara ringkas dan wajar.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: ke wilayah Yudea
  rationale: γῆ dalam konteks ini menunjuk kawasan atau daerah Yudea; 'wilayah Yudea' alami dalam bahasa Indonesia dan tetap membedakannya dari kota Yerusalem.
- source_word: διέτριβεν
  choice: tinggal
  rationale: Kata ini menyatakan bahwa Yesus berada atau menetap di sana selama suatu waktu. Konteks dan rangkaian verba menyampaikan sifat berlangsung dari bentuk imperfek.
- source_word: μετ’ αὐτῶν
  choice: bersama mereka
  rationale: Terjemahan langsung dan alami yang merujuk kepada murid-murid Yesus.
- source_word: ἐβάπτιζεν
  choice: membaptis
  rationale: '''Membaptis'' adalah istilah baku untuk tindakan religius ini dan tidak menentukan cara pelaksanaannya. Bentuk imperfek dipahami sebagai kegiatan yang berlangsung dalam latar narasi.'
theological_decisions:
- issue: Subjek tindakan membaptis dalam hubungannya dengan Yohanes 4:2
  choice: Mempertahankan Yesus sebagai subjek gramatikal dari 'membaptis' dalam ayat ini.
  alternative: Mengubah subjek menjadi murid-murid atau merumuskan tindakan itu secara impersonal.
  rationale: Verba tunggal Yunani secara alami meneruskan Yesus sebagai subjek. Yohanes 4:2 kemudian menjelaskan bahwa Yesus tidak melakukannya sendiri, melainkan murid-murid-Nya. Teks utama mempertahankan ketegangan naratif tersebut dan catatan kaki memberi penjelasan silang.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Wilayah Yudea' dipilih daripada 'tanah Yudea' agar mudah dipahami pembaca modern, sedangkan 'Ia' mempertahankan gaya naratif yang lazim bagi rujukan kepada Yesus.
