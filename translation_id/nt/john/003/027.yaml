  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: id
  text: Yohanes menjawab dan berkata, “Seseorang tidak dapat menerima satu hal pun kecuali jika hal itu telah diberikan kepadanya dari surga.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Yohanes menjawab dan berkata
  rationale: Mempertahankan formula naratif rangkap dalam teks Yunani tanpa menambah tafsiran.
- source_word: Οὐ δύναται
  choice: tidak dapat
  rationale: Ungkapan Indonesia yang alami dan tepat untuk ketidakmampuan yang dinyatakan oleh δύναμαι.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: Dalam konteks ini bentuk tunggal tersebut bersifat generik dan mencakup manusia tanpa pembatasan jenis kelamin; “seseorang” menyampaikan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: menerima satu hal pun
  rationale: “Menerima” sesuai dengan gagasan pemberian pada klausa berikutnya, sedangkan “satu hal pun” mempertahankan penegasan minimal οὐδὲ ἓν.
- source_word: ἐὰν μὴ
  choice: kecuali jika
  rationale: Menyampaikan syarat pengecualian secara jelas dan alami.
- source_word: ᾖ δεδομένον αὐτῷ
  choice: hal itu telah diberikan kepadanya
  rationale: “Telah diberikan” mencerminkan bentuk perfektum pasif, yakni pemberian yang sudah terjadi dan hasilnya tetap berlaku.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Mempertahankan ungkapan sumber ilahi sebagaimana dinyatakan teks, tanpa menggantinya secara interpretatif dengan “dari Allah”.
theological_decisions:
- issue: Cakupan sumber ilahi dalam pernyataan Yohanes
  choice: Mempertahankan rumusan umum bahwa seseorang hanya dapat menerima apa yang diberikan dari surga.
  alternative: Membatasinya secara eksplisit pada pelayanan atau jabatan, atau memperluasnya menjadi pernyataan determinisme menyeluruh.
  rationale: Konteks langsung menyangkut pelayanan Yohanes dan meningkatnya kedudukan Yesus, tetapi susunan kalimatnya bersifat luas. Terjemahan mempertahankan keluasan dan ketegangan itu tanpa menetapkan sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Seseorang” dipilih untuk makna generik ἄνθρωπος, sedangkan “menjawab dan berkata” mempertahankan bentuk formula naratif sumber meskipun sedikit lebih formal daripada percakapan sehari-hari.
