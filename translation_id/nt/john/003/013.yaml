id: JHN.3.13
reference: John 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: id
  text: Tidak seorang pun telah naik ke surga selain Dia yang telah turun dari surga, yaitu Anak Manusia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dia yang datang turun dari surga.”
    reason: lexical_alternative
  - marker: b
    text: “Anak Manusia” adalah sebutan khas yang digunakan Yesus bagi diri-Nya dan menggemakan Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan ini secara alami menyatakan penyangkalan tanpa membatasi cakupannya pada jenis kelamin tertentu.
- source_word: ἀναβέβηκεν
  choice: telah naik
  rationale: Bentuk perfektum menunjuk pada tindakan yang sudah terjadi dan tetap relevan; kata 'telah' mempertahankan nuansa tersebut.
- source_word: εἰς τὸν οὐρανόν
  choice: ke surga
  rationale: Dalam bahasa Indonesia, 'ke surga' adalah ungkapan alami untuk gerak menuju atau memasuki surga dan mempertahankan kontras dengan 'dari surga'.
- source_word: εἰ μὴ
  choice: selain
  rationale: Dalam konstruksi pengecualian setelah penyangkalan, 'selain' paling wajar menandai satu-satunya pengecualian.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: Dia yang telah turun dari surga
  rationale: Frasa partisipial substantival diterjemahkan sebagai sebutan bagi pribadi tertentu. 'Turun' menjaga kesejajaran dengan 'naik', sedangkan 'telah' menyampaikan tindakan yang mendahului konteks ujaran.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Bentuk baku ini mempertahankan sebutan khas Yesus serta gaung Daniel 7 tanpa menafsirkannya menjadi ungkapan generik.
theological_decisions:
- issue: Daya kristologis ungkapan ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Menerjemahkannya sebagai gelar yang dikenal, 'Anak Manusia'.
  alternative: '''Sang Manusia'' atau ungkapan generik ''anak manusia''.'
  rationale: Pilihan ini mempertahankan ketegangan antara bentuk idiomatis dan makna apokaliptis/intertekstualnya tanpa menyelesaikannya secara interpretatif.
- issue: Implikasi temporal dan aspektual bahasa naik-turun
  choice: Menggunakan 'telah naik' dan 'telah turun'.
  alternative: '''naik ... turun'' atau ''pergi naik ... datang turun''.'
  rationale: Rumusan ini mempertahankan klaim teks tentang asal surgawi dan akses unik Anak Manusia tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Tidak seorang pun' mudah dipahami dan inklusif; 'Dia' diberi huruf kapital sebagai pronomina yang merujuk kepada Yesus sesuai kebiasaan penerbitan Alkitab Indonesia. Tanda pisah Inggris diungkapkan dengan 'yaitu' agar hubungan aposisional jelas dan alami.
