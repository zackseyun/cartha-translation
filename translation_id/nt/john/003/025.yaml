  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: id
  text: Lalu timbullah perselisihan antara murid-murid Yohanes dan seorang Yahudi tentang penyucian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembersihan” atau “penyucian secara ritual”. Istilah Yunani ini dapat menunjuk pada pembersihan secara umum, tetapi dalam konteks ini kemungkinan mengandung nuansa ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: timbullah
  rationale: Bentuk ini menyatakan muncul atau terjadinya suatu peristiwa dan secara alami berpadu dengan nomina “perselisihan” dalam narasi Indonesia.
- source_word: οὖν
  choice: Lalu
  rationale: Partikel ini meneruskan alur narasi; “lalu” menjaga hubungan dengan konteks sebelumnya tanpa memaksakan kesimpulan logis yang kuat.
- source_word: ζήτησις
  choice: perselisihan
  rationale: Kata ini dapat berarti pembahasan, perdebatan, atau pertikaian. “Perselisihan” menyampaikan adanya pertentangan tanpa menggambarkannya secara berlebihan sebagai pertengkaran keras.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: antara murid-murid Yohanes dan seorang Yahudi
  rationale: Walaupun ἐκ secara harfiah berarti “dari” dan μετά berarti “dengan”, konstruksi keseluruhannya menunjukkan dua pihak yang terlibat. “Antara ... dan ...” merupakan ungkapan Indonesia yang wajar, sedangkan bentuk tunggal Ἰουδαίου dipertahankan sebagai “seorang Yahudi”.
- source_word: περὶ καθαρισμοῦ
  choice: tentang penyucian
  rationale: καθαρισμός menunjuk pada pembersihan atau penyucian dan dalam konteks Yohanes kemungkinan bernuansa ritual. “Penyucian” mempertahankan keluasan makna tersebut tanpa menambahkan kata “upacara” ke teks utama.
theological_decisions:
- issue: Apakah καθαρισμός harus diterjemahkan dengan istilah yang secara eksplisit menyatakan ritus
  choice: penyucian
  alternative: pembersihan; penyucian secara ritual
  rationale: Konteks dekatnya mengisyaratkan penyucian religius atau ritual, tetapi ayat ini sendiri tidak menjelaskan cakupan tepat persoalannya. “Penyucian” mempertahankan kemungkinan tersebut tanpa mempersempit makna secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi “timbullah perselisihan” mempertahankan gerak naratif dengan tetap mudah dipahami; “murid-murid” dipakai untuk menyatakan bentuk jamak secara jelas.
