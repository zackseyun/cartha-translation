translation:
  language: id
  text: Nikodemus menjawab dan berkata kepadanya, “Bagaimana mungkin hal-hal ini terjadi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Bentuk deponen dari ἀποκρίνομαι lazim berfungsi sebagai verba dialog ‘menjawab’; padanan ini mempertahankan fungsi wacananya secara wajar.
- source_word: Νικόδημος
  choice: Nikodemus
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Mengikuti ungkapan Yunani ‘berkata kepadanya’ tanpa mengganti pronomina dengan nama Yesus. Huruf kapital mengikuti konvensi umum bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan.
- source_word: Πῶς δύναται
  choice: Bagaimana mungkin
  rationale: Gabungan ini menyatakan pertanyaan tentang kemungkinan; ‘bagaimana mungkin’ alami dalam bahasa Indonesia dan mempertahankan daya modal δύναται.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Mempertahankan bentuk jamak netral dan rujukannya kepada berbagai hal yang baru saja Yesus jelaskan.
- source_word: γενέσθαι
  choice: terjadi
  rationale: Infinitif γίνομαι di sini menunjuk pada terjadinya atau terwujudnya hal-hal tersebut; ‘terjadi’ jelas dan alami tanpa terlalu menafsirkan caranya.
theological_decisions:
- issue: Pertanyaan Nikodemus mengenai kelahiran baru dan kenyataan yang dijelaskan Yesus
  choice: Bagaimana mungkin hal-hal ini terjadi?
  alternative: Bagaimana hal-hal ini dapat terwujud?
  rationale: ‘Terjadi’ mempertahankan pengertian peristiwa atau keadaan yang menjadi kenyataan dalam γενέσθαι, sekaligus tidak menjelaskan atau menyelesaikan misteri teologis yang sedang dipertanyakan Nikodemus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumusan ‘menjawab dan berkata’ dipertahankan karena mencerminkan dua verba dalam teks Yunani, meskipun sedikit lebih formal daripada percakapan sehari-hari.
