id: JHN.3.29
reference: John 3:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: id
  text: Yang memiliki mempelai perempuan adalah mempelai laki-laki. Namun, sahabat mempelai laki-laki[a], yang berdiri dan mendengarkannya, sangat bersukacita[b] karena suara mempelai laki-laki itu. Karena itu, sukacitaku ini telah menjadi sempurna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kebudayaan pernikahan pada masa itu, peran ini mungkin menyerupai pendamping utama pengantin pria.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “bersukacita dengan sukacita,” suatu ungkapan Yunani yang menegaskan besarnya sukacita.
    reason: lexical_alternative
  - marker: c
    text: Atau “telah digenapi” atau “telah mencapai kepenuhannya.” Kata Yunani ini dapat menyatakan sesuatu yang dibawa kepada kepenuhan atau penyelesaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Yang memiliki mempelai perempuan
  rationale: Partisipel berartikel diterjemahkan sebagai subjek umum. ‘Mempelai perempuan’ mempertahankan gambaran pernikahan dan kontras dengan mempelai laki-laki.
- source_word: νυμφίος
  choice: mempelai laki-laki
  rationale: Padanan ini jelas dan alami dalam bahasa Indonesia serta mempertahankan gambaran pernikahan yang diulang dalam ayat.
- source_word: φίλος τοῦ νυμφίου
  choice: sahabat mempelai laki-laki
  rationale: Terjemahan ini mengikuti ungkapan Yunani secara transparan tanpa memasukkan jabatan budaya yang tidak dinyatakan secara eksplisit.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: yang berdiri dan mendengarkan dia
  rationale: Bentuk perfektum ‘berdiri’ menggambarkan keadaan atau posisi yang sedang berlangsung, sedangkan pronomina genitif sesudah ἀκούω dipertahankan sebagai objek orang tanpa menambahkan ‘suara’ sebelum kata itu muncul dalam teks.
- source_word: χαρᾷ χαίρει
  choice: sangat bersukacita
  rationale: Gabungan nomina dan verba serumpun memberi penegasan; ‘sangat bersukacita’ menyampaikan intensitas itu secara alami.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: karena suara mempelai laki-laki itu
  rationale: διά dengan akusatif menyatakan sebab. Susunan ini tetap dekat dengan teks dan mempertahankan pengulangan ‘mempelai laki-laki’.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Karena itu, sukacitaku ini
  rationale: ‘Karena itu’ menyatakan kesimpulan atau hasil, sementara ‘sukacitaku ini’ mempertahankan unsur penunjuk dan penekanan kepunyaan.
- source_word: πεπλήρωται
  choice: telah menjadi penuh
  rationale: Perfektum menyatakan keadaan kini sebagai hasil yang telah tercapai. Ungkapan ini alami dalam konteks sukacita yang mencapai kepenuhannya dan tidak membatasi makna pada penggenapan nubuat.
theological_decisions:
- issue: Gambaran pernikahan dan posisi Yohanes Pembaptis
  choice: Mempertahankan gambaran tentang mempelai laki-laki, mempelai perempuan, dan sahabat mempelai laki-laki tanpa menjelaskan identitas simbolis mempelai perempuan.
  alternative: Menyebut sahabat itu ‘pendamping pengantin pria’ atau secara eksplisit mengidentifikasi mempelai perempuan sebagai umat Allah atau gereja.
  rationale: Ayat ini memakai gambaran pernikahan tetapi tidak mengidentifikasi mempelai perempuan secara langsung. Terjemahan tidak boleh memasukkan kesimpulan eklesiologis atau rincian budaya yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah pernikahan dibuat eksplisit menurut jenis kelamin karena bahasa Indonesia tidak memiliki satu pasangan kata sepadan dengan νύμφη dan νυμφίος. Pengulangan dalam teks Yunani dipertahankan sejauh tetap alami.
