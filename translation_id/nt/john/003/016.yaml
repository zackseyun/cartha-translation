  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: id
  text: 'Sebab, beginilah Allah mengasihi dunia[a]: Ia memberikan Anak-Nya satu-satunya[b], supaya setiap orang yang percaya kepada-Nya tidak binasa, melainkan memiliki hidup kekal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut terjemahan tradisional, “Sebab, begitu besar kasih Allah kepada dunia.” Namun, kata Yunani yang dipakai di sini dapat menekankan cara Allah mengasihi: “beginilah Allah mengasihi dunia.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “Anak-Nya yang tunggal”; secara tradisional juga diterjemahkan “Anak-Nya yang diperanakkan tunggal.” Kata Yunani ini dapat menekankan bahwa Sang Anak itu satu-satunya atau unik.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: beginilah
  rationale: Menunjukkan cara atau wujud kasih Allah yang kemudian dijelaskan melalui pemberian Anak-Nya, tanpa meniadakan kemungkinan pemahaman tradisional sebagai penekanan kadar kasih.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan konteks sebelumnya.
- source_word: ἠγάπησεν
  choice: mengasihi
  rationale: Padanan Indonesia yang alami dan bermartabat untuk tindakan kasih Allah; bentuk lampau Yunani tidak perlu diberi penanda waktu tersendiri dalam bahasa Indonesia.
- source_word: τὸν κόσμον
  choice: dunia
  rationale: Mempertahankan keluasan κόσμος dalam Injil Yohanes dan tidak mempersempitnya hanya menjadi umat manusia.
- source_word: ὥστε ... ἔδωκεν
  choice: ': Ia memberikan'
  rationale: Tanda titik dua secara alami memperkenalkan tindakan konkret yang menyatakan kasih Allah; 'memberikan' menjaga keluasan makna tanpa membatasinya hanya pada inkarnasi atau penyaliban.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: Anak-Nya satu-satunya
  rationale: Mengungkapkan keunikan relasi Sang Anak dengan jelas dalam bahasa Indonesia modern, tanpa memasukkan gagasan tentang proses kelahiran biologis ke dalam kata μονογενής.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: setiap orang yang percaya kepada-Nya
  rationale: Mempertahankan cakupan umum dan inklusif frasa Yunani serta memakai ungkapan Indonesia yang alami untuk percaya kepada seseorang.
- source_word: μὴ ἀπόληται
  choice: tidak binasa
  rationale: Menjaga bobot ἀπόλλυμι tanpa menentukan secara berlebihan bentuk kebinasaan yang dimaksud.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: memiliki hidup kekal
  rationale: Padanan langsung dan wajar yang mempertahankan gagasan memiliki hidup yang bersifat kekal.
theological_decisions:
- issue: Makna Οὕτως
  choice: 'cara atau wujud kasih: ''beginilah'''
  alternative: 'kadar atau intensitas kasih: ''begitu besar'''
  rationale: Susunan kalimat dengan ὥστε dan tindakan memberikan Anak paling alami menjelaskan bagaimana Allah mengasihi dunia. Alternatif tradisional dipertahankan dalam catatan kaki.
- issue: Makna μονογενής bagi Sang Anak
  choice: '''Anak-Nya satu-satunya'''
  alternative: '''Anak-Nya yang tunggal'' atau, secara tradisional, ''Anak-Nya yang diperanakkan tunggal'''
  rationale: Pilihan utama menekankan keunikan Sang Anak sesuai bukti leksikal kini, sambil mempertahankan ungkapan historis yang penting dalam catatan kaki.
- issue: Cakupan πᾶς ὁ πιστεύων
  choice: '''setiap orang yang percaya'''
  alternative: '''siapa pun yang percaya'''
  rationale: Menjaga bahasa universal dan umum dalam ayat tanpa menyelesaikan perdebatan teologis tentang pemilihan, cakupan pendamaian, atau tanggapan manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' menghindari pengulangan 'Allah' tanpa terasa percakapan; huruf kapital pada rujukan kepada Allah dan Anak-Nya mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Struktur titik dua membuat hubungan antara kasih Allah dan pemberian Anak-Nya jelas serta alami.
