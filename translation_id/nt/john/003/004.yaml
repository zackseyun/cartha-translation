id: JHN.3.4
reference: John 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: id
  text: Nikodemus berkata kepada-Nya, “Bagaimana mungkin seseorang dilahirkan ketika ia sudah tua? Tidak mungkin ia masuk ke dalam rahim ibunya untuk kedua kalinya dan dilahirkan, bukan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: berkata kepada-Nya
  rationale: Bentuk kini λέγει berfungsi sebagai kala kini historis dalam narasi Yohanes; bentuk lampau naratif Indonesia, “berkata”, terdengar alami. Akhiran “-Nya” mengikuti konvensi penghormatan bahasa Indonesia untuk Yesus.
- source_word: Νικόδημος
  choice: Nikodemus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Πῶς δύναται
  choice: Bagaimana mungkin
  rationale: Ungkapan ini menyampaikan pertanyaan tentang kemungkinan secara wajar dan mempertahankan nada heran Nikodemus.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: ἄνθρωπος berbentuk tunggal maskulin tetapi digunakan secara generik. “Seseorang” menyampaikan cakupan generiknya secara alami dalam bahasa Indonesia tanpa membatasinya pada laki-laki.
- source_word: γεννηθῆναι
  choice: dilahirkan
  rationale: Infinitif pasif γεννάω di sini merujuk pada kelahiran. Bentuk “dilahirkan” mempertahankan diatesis pasif dan tidak memasukkan nuansa “kembali” ke dalam kata ini.
- source_word: γέρων ὤν
  choice: ketika ia sudah tua
  rationale: Konstruksi partisipial keadaan/waktu diterjemahkan menjadi anak kalimat temporal yang alami; “sudah” menegaskan keadaan usia lanjut dalam konteks.
- source_word: μὴ δύναται
  choice: Tidak mungkin ... bukan?
  rationale: μή memperkenalkan pertanyaan yang mengharapkan jawaban negatif. Bentuk ini mempertahankan ketidakpercayaan Nikodemus dan harapan akan jawaban “tidak”.
- source_word: κοιλίαν
  choice: rahim
  rationale: Bersama frasa “ibunya”, κοιλία secara kontekstual menunjuk pada rahim, bukan perut secara umum.
- source_word: δεύτερον
  choice: untuk kedua kalinya
  rationale: δεύτερον secara eksplisit berarti “untuk kedua kalinya”; pilihan ini mempertahankan penafsiran harfiah Nikodemus.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: masuk kembali ... lalu dilahirkan
  rationale: Kedua infinitif dipertahankan secara eksplisit. “Lalu” menyampaikan urutan logis, sedangkan “kembali” pada verba masuk mengungkapkan bahwa tindakan itu diandaikan terjadi lagi tanpa mengaburkan δεύτερον.
theological_decisions:
- issue: Penerjemahan bentuk maskulin generik ἄνθρωπος
  choice: seseorang
  alternative: seorang laki-laki / seorang manusia
  rationale: Dalam konteks ini ἄνθρωπος bersifat generik. Bahasa Indonesia tidak perlu memakai bentuk maskulin untuk mempertahankan makna representatifnya; “seseorang” lebih alami dan tidak menambahkan pembatasan jenis kelamin yang tidak dimaksudkan.
- issue: Apakah nuansa “kembali” dari Yohanes 3:3 harus dimasukkan ke dalam γεννηθῆναι
  choice: dilahirkan ... untuk kedua kalinya
  alternative: dilahirkan kembali
  rationale: Ayat ini memiliki δεύτερον, “untuk kedua kalinya”, yang memperlihatkan pemahaman harfiah Nikodemus. Terjemahan tidak memasukkan perdebatan makna ἄνωθεν dari ayat sebelumnya ke dalam γεννηθῆναι, sehingga ketegangan naratif tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Susunan pertanyaan dibuat alami bagi pembaca umum sambil mempertahankan pertanyaan yang mengharapkan jawaban negatif. Tidak diperlukan catatan kaki karena pilihan generik dan arti δεύτερον dapat disampaikan langsung dengan jelas dalam teks.
