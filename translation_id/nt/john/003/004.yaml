  naturalness: Ragamnya baku dan umumnya alami. “Masuk ke dalam rahim ibunya untuk kedua kalinya dan dilahirkan” lebih langsung serta lebih dekat pada dua infinitif Yunani daripada penggunaan “lalu.”
  terminology: “Nikodemus,” “rahim,” dan “dilahirkan” tepat. Kapitalisasi pronomina ilahi (“-Nya”) merupakan konvensi Indonesia yang dapat diterima dalam register Alkitab.
