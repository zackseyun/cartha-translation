  to: Nikodemus berkata kepada-Nya, “Bagaimana mungkin seseorang dilahirkan ketika ia sudah tua? Tidak mungkin ia masuk ke dalam rahim ibunya untuk kedua kalinya dan dilahirkan, bukan?”
  rationale: Revisi terbatas pada penghapusan “kembali” dari verba “masuk” dan penggantian “lalu” dengan “dan,” agar kedua infinitif εἰσελθεῖν καὶ γεννηθῆναι serta keterangan δεύτερον terwakili secara lebih tepat tanpa redundansi. Tidak diperlukan catatan kaki; bentuk generik “seseorang” dan “untuk kedua kalinya” cukup jelas dalam bahasa Indonesia.
