  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: id
  text: 'Dan inilah penghakiman itu: terang telah datang ke dalam dunia, dan manusia lebih mencintai kegelapan daripada terang, sebab perbuatan mereka jahat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: penghakiman
  rationale: Mempertahankan arti luas berupa penilaian yang menentukan, tanpa mempersempitnya menjadi penghukuman atau putusan akhir saja.
- source_word: τὸ φῶς
  choice: terang
  rationale: Mempertahankan metafora khas Yohanes tanpa menggantinya secara interpretatif dengan nama Yesus.
- source_word: ἐλήλυθεν
  choice: telah datang
  rationale: Bentuk perfektum Yunani menyatakan kedatangan yang sudah terjadi dengan dampak yang tetap berlangsung.
- source_word: κόσμον
  choice: dunia
  rationale: Padanan alami yang mempertahankan keluasan dan nuansa istilah dalam Injil Yohanes.
- source_word: ἠγάπησαν
  choice: mencintai
  rationale: Mempertahankan kekuatan moral verba ἀγαπάω; unsur perbandingan μᾶλλον ... ἢ dinyatakan dengan 'lebih ... daripada'.
- source_word: οἱ ἄνθρωποι
  choice: manusia
  rationale: Dalam konteks ini istilah tersebut mengacu kepada manusia secara umum, bukan hanya laki-laki; 'manusia' alami dan inklusif dalam bahasa Indonesia.
- source_word: τὸ σκότος
  choice: kegelapan
  rationale: Mempertahankan kontras simbolis langsung dengan terang.
- source_word: πονηρὰ
  choice: jahat
  rationale: Menyampaikan penilaian moral yang tegas dan alami dalam bahasa Indonesia modern.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatan
  rationale: Menunjuk tindakan nyata secara idiomatis sekaligus mempertahankan bentuk jamak Yunani.
theological_decisions:
- issue: Rujukan 'terang'
  choice: Metafora 'terang' dipertahankan tanpa mengeksplisitkan rujukannya.
  alternative: '''Terang'' ditulis sebagai gelar kristologis atau diganti dengan ''Yesus''.'
  rationale: Konteks menghubungkan terang dengan Sang Anak, tetapi teks Yunani tetap memakai metafora; mempertahankannya menjaga corak teologis Yohanes.
- issue: Makna κρίσις
  choice: '''Penghakiman'' dipertahankan sebagai tindakan atau kenyataan penilaian ilahi.'
  alternative: '''Penghukuman'' atau ''putusan''.'
  rationale: Ayat ini menjelaskan hakikat atau dasar penghakiman; terjemahan yang lebih sempit dapat terlalu cepat menetapkan hasilnya.
- issue: Daya cakup οἱ ἄνθρωποι
  choice: '''Manusia'' sebagai umat manusia secara umum.'
  alternative: '''Orang-orang'' atau ''laki-laki''.'
  rationale: Bentuk Yunani di sini memiliki rujukan generik, sehingga 'manusia' menyampaikan cakupannya tanpa membatasinya pada jenis kelamin tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur 'inilah penghakiman itu' mempertahankan penekanan Yunani, sedangkan 'lebih mencintai ... daripada ...' menjaga baik verba kasih maupun perbandingannya. Konjungsi καί sebelum klausa tentang manusia diterjemahkan 'tetapi' karena hubungan kontekstualnya bersifat kontras.
