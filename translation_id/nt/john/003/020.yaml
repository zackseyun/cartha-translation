id: JHN.3.20
reference: John 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: id
  text: Sebab, setiap orang yang berbuat jahat membenci terang dan tidak datang kepada terang itu, supaya perbuatan-perbuatannya tidak tersingkap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “tersingkap” juga dapat berarti “ditegur”, “dinyatakan bersalah”, atau “dibuktikan salah”; kata itu mencakup gagasan membuka kesalahan dan memperlihatkan bahwa sesuatu itu salah.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Sebab, setiap orang yang
  rationale: γάρ memberi alasan bagi pernyataan sebelumnya, sedangkan πᾶς dengan partisip berartikel membentuk ungkapan umum yang mencakup setiap orang dengan ciri tindakan tersebut.
- source_word: φαῦλα πράσσων
  choice: berbuat jahat
  rationale: Dalam pertentangan Yohanes antara kejahatan dan terang, φαῦλα bernilai moral. Ungkapan alami 'berbuat jahat' menyampaikan pola perilaku yang mencirikan orang itu tanpa membuat kalimat menjadi kaku.
- source_word: μισεῖ τὸ φῶς
  choice: membenci terang
  rationale: Terjemahan langsung ini mempertahankan kuatnya μισεῖ dan metafora teologis 'terang' dalam Injil Yohanes.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: tidak datang kepada terang itu
  rationale: Mempertahankan gambaran gerak menuju terang serta pengulangan τὸ φῶς. 'Terang itu' secara alami merujuk kembali kepada terang yang sudah disebut.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menyatakan tujuan negatif atau tindakan menghindar dalam bahasa Indonesia modern secara jelas dan alami.
- source_word: ἐλεγχθῇ
  choice: tersingkap
  rationale: Dalam konteks terang, pilihan ini menonjolkan terbukanya kenyataan moral perbuatan, sambil tidak membatasi verba pada arti teguran atau penghukuman resmi.
- source_word: τὰ ἔργα αὐτοῦ
  choice: perbuatan-perbuatannya
  rationale: Menerjemahkan bentuk jamak ἔργα dan rujukan tunggal αὐτοῦ. Akhiran '-nya' dalam bahasa Indonesia tidak menandai gender sehingga tetap akurat dan inklusif secara alami.
theological_decisions:
- issue: Makna ἐλεγχθῇ ketika perbuatan berhadapan dengan terang
  choice: tersingkap
  alternative: ditegur; dinyatakan bersalah; dibuktikan salah
  rationale: Konteks terang mendukung gagasan penyingkapan, tetapi verba Yunani juga dapat memuat unsur menunjukkan kesalahan atau kesalahan moral. Catatan kaki mempertahankan rentang makna itu tanpa mempersempitnya pada penghakiman formal.
- issue: Rujukan maskulin tunggal dalam pernyataan umum
  choice: perbuatan-perbuatannya
  alternative: perbuatan-perbuatan orang itu
  rationale: Bahasa Yunani memakai bentuk maskulin tunggal secara generik. Akhiran '-nya' mempertahankan rujukan tunggal tanpa menambahkan gender yang tidak perlu dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan sederhana dan bermartabat. Metafora khas Yohanes tentang terang dipertahankan. 'Berbuat jahat' dipilih sebagai ungkapan alami bagi perilaku yang mencirikan seseorang, dan 'tersingkap' menjaga hubungan gambaran antara terang dan terbukanya perbuatan.
