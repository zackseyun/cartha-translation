id: JHN.3.18
reference: John 3:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: id
  text: Orang yang percaya kepada-Nya tidak dihukum; tetapi orang yang tidak percaya sudah dihukum, karena ia tidak percaya kepada nama Anak Tunggal Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Anak satu-satunya” atau “Anak yang unik”; secara tradisional, “Anak Tunggal yang diperanakkan.” Kata Yunani μονογενής menekankan keunikan Sang Anak.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: orang yang percaya kepada-Nya
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menyatakan orang secara umum; 'percaya kepada-Nya' secara alami menyampaikan kepercayaan yang diarahkan kepada pribadi.
- source_word: οὐ κρίνεται
  choice: tidak dihukum
  rationale: Dalam konteks Yohanes 3:17–19, κρίνω mengarah pada keputusan pengadilan yang merugikan, yakni penghukuman; bentuk kini pasif dipertahankan.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: tetapi orang yang tidak percaya
  rationale: δέ menyatakan kontras, sedangkan partisipel berartikel kembali diterjemahkan sebagai sebutan umum bagi seseorang.
- source_word: ἤδη κέκριται
  choice: sudah dijatuhi hukuman
  rationale: Bentuk perfek menyatakan keputusan yang telah terjadi dengan keadaan yang tetap berlaku; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan citra yudisial.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: karena ia tidak percaya
  rationale: ὅτι memberikan alasan. Perfek Yunani menunjuk pada ketidakpercayaan yang telah menetap; bahasa Indonesia tidak menandai aspek perfek secara langsung, dan 'tidak percaya' menyampaikan keadaan tersebut secara wajar.
- source_word: εἰς τὸ ὄνομα
  choice: kepada nama
  rationale: Mempertahankan ungkapan konkret Yohanes; 'nama' merangkum identitas dan kewibawaan pribadi tanpa menguraikannya di dalam teks.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: Anak Tunggal Allah
  rationale: '''Anak Tunggal'' adalah ungkapan Indonesia yang alami untuk μονογενής dan menyampaikan keunikan sang Anak tanpa memasukkan gagasan biologis yang tidak wajib dari kata Yunani.'
theological_decisions:
- issue: Makna κρίνω dalam kedua klausa
  choice: Gunakan 'dihukum' dan 'dijatuhi hukuman'
  alternative: '''diadili'' atau ''telah dihakimi'''
  rationale: Konteks dekat membandingkan penyelamatan dengan putusan merugikan atas ketidakpercayaan. Pilihan ini menyampaikan daya yudisial κρίνω, sementara alternatif yang lebih luas dicatat sebagai kemungkinan leksikal.
- issue: Makna μονογενής
  choice: Anak Tunggal
  alternative: Anak satu-satunya; Anak yang unik; secara tradisional, Anak yang diperanakkan satu-satunya
  rationale: μονογενής menekankan keunikan dan status satu-satunya. 'Anak Tunggal' jelas dan bermartabat dalam bahasa Indonesia tanpa memaksakan rumusan teologis kemudian ke dalam kata itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Variasi 'dihukum'/'dijatuhi hukuman' menghindari pengulangan yang kaku sambil mempertahankan akar Yunani yang sama dan aspek perfek pada klausa kedua. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia.
