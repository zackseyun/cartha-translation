  source_fidelity: Terjemahan mempertahankan kontras partisipel kini yang bersifat umum, kepemilikan hidup kekal pada masa kini (ἔχει), penyangkalan tentang melihat hidup pada masa depan (οὐκ ὄψεται), serta keberlanjutan murka Allah (μένει). Namun, ἀπειθῶν lebih tepat dan langsung diterjemahkan sebagai tindakan ‘tidak menaati’ Sang Anak daripada predikatif ‘tidak taat kepada,’ sambil catatan kaki tetap memelihara kemungkinan ‘menolak percaya.’
  naturalness: Bahasa keseluruhan baku dan bernada khidmat. ‘Tidak menaati Sang Anak’ lebih idiomatis dan lebih dekat dengan verba transitif Yunani daripada ‘tidak taat kepada Sang Anak.’ Frasa lokasi ‘tetap ada di atasnya’ juga lebih lancar dalam bahasa Indonesia daripada ‘tetap ada atasnya.’
  terminology: ‘Sang Anak,’ ‘hidup kekal,’ dan ‘murka Allah’ merupakan padanan yang tepat, jelas, dan konsisten dengan register Yohanes. Catatan kaki secara tepat menandai ambiguitas semantis ἀπειθέω tanpa memaksakan salah satu penafsiran.
  issues:
