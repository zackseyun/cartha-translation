source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: id
  text: Orang yang percaya kepada Sang Anak memiliki hidup kekal. Namun, orang yang tidak menaati Sang Anak[a] tidak akan melihat hidup, melainkan murka Allah tetap ada di atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang menolak untuk percaya kepada Sang Anak.” Kata kerja Yunani yang digunakan dapat mengandung arti menolak percaya maupun tidak taat.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: orang yang percaya kepada Sang Anak
  rationale: Partisipel kini berartikel berfungsi sebagai sebutan umum bagi seseorang. Dalam bahasa Indonesia, πιστεύω dengan εἰς secara alami dinyatakan sebagai 'percaya kepada', yang menunjukkan kepercayaan yang diarahkan kepada pribadi Sang Anak.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: Sang Anak
  rationale: Teks Yunani memakai gelar tertentu tanpa menambahkan kata 'Allah'. 'Sang Anak' mempertahankan pemakaian gelar kristologis khas Yohanes dan terdengar wajar serta khidmat dalam bahasa Indonesia.
- source_word: ἔχει
  choice: memiliki
  rationale: Indikatif kini menyatakan kepemilikan pada masa sekarang, bukan hanya harapan pada masa depan. 'Memiliki' jelas dan alami.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Padanan yang mapan dan tepat dalam konteks Yohanes, mencakup keberlangsungan serta mutu eskatologis hidup tersebut.
- source_word: ὁ δὲ ἀπειθῶν
  choice: orang yang tidak taat
  rationale: ἀπειθέω dapat berarti tidak taat dan juga menolak percaya. Terjemahan utama mempertahankan cakupan ketaatan, sedangkan kemungkinan makna penolakan untuk percaya dicatat dalam catatan kaki.
- source_word: οὐκ ὄψεται ζωήν
  choice: tidak akan melihat hidup
  rationale: Mempertahankan ungkapan Yohanes dengan verba 'melihat' dan bentuk masa depannya, tanpa meratakannya menjadi sekadar 'tidak memiliki hidup'.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: murka Allah
  rationale: Menyampaikan konstruksi genitif secara langsung dan tidak melunakkan pernyataan tentang penghakiman ilahi.
- source_word: μένει ἐπ’ αὐτόν
  choice: tetap ada atasnya
  rationale: μένει menyatakan keadaan yang terus berlangsung. 'Tetap ada atasnya' mempertahankan gambaran murka yang berada atas orang itu, meskipun ungkapan ini sengaja sedikit lebih formal daripada bahasa percakapan.
theological_decisions:
- issue: Makna ἀπειθῶν dalam kontras dengan πιστεύων
  choice: orang yang tidak taat
  alternative: orang yang menolak untuk percaya
  rationale: Kontras dengan 'percaya' memungkinkan nuansa ketidakpercayaan, tetapi verba tersebut juga menyatakan ketidaktaatan. Teks utama mempertahankan cakupan yang lebih luas, sementara catatan kaki menjaga alternatifnya agar ketegangan makna tidak dihilangkan.
- issue: Daya waktu hidup kekal dan murka
  choice: Kepemilikan hidup kekal sekarang dan keberlanjutan murka Allah sekarang sama-sama dipertahankan.
  alternative: Memahami hidup kekal dan murka hanya sebagai kenyataan masa depan.
  rationale: ἔχει dan μένει sama-sama berbentuk indikatif kini, sedangkan οὐκ ὄψεται menunjuk ke depan. Terjemahan mempertahankan perpaduan kenyataan kini dan akibat mendatang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Sang Anak' dipakai sebagai gelar tertentu; 'atasnya' mempertahankan citra sumber dan merujuk secara umum kepada orang tersebut, bukan hanya kepada laki-laki.
