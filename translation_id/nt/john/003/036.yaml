  - severity: low
    issue: ‘tetap ada atasnya’
    rationale: Penambahan ‘di’ menghasilkan kolokasi bahasa Indonesia yang lebih alami, sambil tetap mempertahankan gambaran ἐπ’ αὐτόν (‘di atasnya’).
