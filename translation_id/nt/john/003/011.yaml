  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: id
  text: 'Sesungguhnya, sesungguhnya, Aku berkata kepadamu: kami mengatakan apa yang kami ketahui dan bersaksi tentang apa yang telah kami lihat, dan kamu tidak menerima kesaksian kami.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, “kepadamu” berbentuk tunggal, sedangkan “kamu tidak menerima” berbentuk jamak. Rujukan tepat bentuk jamak itu tidak dijelaskan.
    reason: source_language_clarification
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan formula penegasan yang khidmat sambil menyampaikan maknanya dalam bahasa Indonesia yang jelas dan lazim dalam konteks Alkitab.
- source_word: λέγω σοι
  choice: Aku berkata kepadamu
  rationale: Menerjemahkan formula ujaran dan sapaan tunggal secara langsung; kapitalisasi 'Aku' mengikuti kebiasaan bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: kami mengatakan apa yang kami ketahui
  rationale: Mempertahankan bentuk orang pertama jamak dan susunan objek relatif secara alami tanpa menentukan siapa saja yang tercakup dalam 'kami'.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: bersaksi tentang apa yang telah kami lihat
  rationale: Bentuk 'telah ... lihat' menyampaikan tindakan lampau dengan relevansi yang tetap berlangsung, sedangkan 'bersaksi' mempertahankan bahasa kesaksian khas Yohanes.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: kesaksian kami
  rationale: Menjaga hubungan leksikal dengan 'bersaksi' serta mempertahankan kata ganti jamak tanpa penafsiran tambahan.
- source_word: οὐ λαμβάνετε
  choice: kamu tidak menerima
  rationale: Mempertahankan arti dasar λαμβάνω dan gema leksikal Yohanes; dalam konteks ini 'menerima' juga dapat mencakup makna menyambut atau mengakui kebenaran kesaksian.
- source_word: καὶ
  choice: tetapi
  rationale: Walaupun arti formalnya 'dan', pada klausa terakhir konjungsi ini menghubungkan kesaksian yang benar dengan penolakan pendengar secara kontras; 'tetapi' menyampaikan hubungan wacana itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan kata ganti orang pertama jamak 'kami'
  choice: Bentuk 'kami' dipertahankan tanpa menentukan kelompok yang dimaksud.
  alternative: Menafsirkannya sebagai Yesus dan murid-murid-Nya, sebagai jamak retoris, atau sebagai lingkup kesaksian ilahi/surgawi.
  rationale: Teks Yunani jelas memakai bentuk jamak, tetapi identitas kelompoknya diperdebatkan. Terjemahan tidak boleh menutup ambiguitas teologis tersebut.
- issue: Cakupan kata ganti orang kedua
  choice: '''Kepadamu'' dan ''kamu'' digunakan, yang tidak menandai perbedaan tunggal-jamak dalam bentuk biasa bahasa Indonesia.'
  alternative: Mengeksplisitkan bahwa σοι tunggal sedangkan λαμβάνετε jamak melalui parafrasa seperti 'kalian'.
  rationale: Bahasa Yunani beralih dari sapaan tunggal kepada Nikodemus ke verba orang kedua jamak yang dapat memperluas sasaran. Karena bahasa Indonesia 'kamu' dapat terbaca tunggal atau kolektif dalam konteks, catatan kaki menjelaskan peralihan yang signifikan ini tanpa membuat teks utama kaku.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pengulangan 'sesungguhnya' dipertahankan karena bersifat khas dan emfatis. 'Kami' dipilih, bukan 'kita', karena para pendengar yang menolak kesaksian dibedakan dari pihak yang menyampaikan kesaksian.
