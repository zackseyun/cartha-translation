  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: id
  text: Kalian sendiri bersaksi bahwa aku berkata, “Aku bukan Mesias,[a] melainkan aku telah diutus[b] mendahului Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Padanan alternatif bagi gelar Yunani Χριστός.
  - marker: b
    text: Atau, “aku diutus di depan-Nya” atau “aku dahulu diutus mendahului Dia.”
    reason: Konstruksi Yunani dapat diungkapkan dengan beberapa bentuk waktu dalam bahasa Indonesia; ungkapan tempat/waktu ἔμπροσθεν ἐκείνου juga dapat diterjemahkan lebih harfiah sebagai “di depan-Nya.”
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Kamu sendiri
  rationale: Gabungan kata ganti ini bersifat emfatis; “kamu sendiri” mempertahankan penekanan pada para pendengar sebagai saksi.
- source_word: μοι μαρτυρεῖτε
  choice: bersaksi tentang aku
  rationale: Dativus μοι menunjukkan bahwa kesaksian itu berkenaan dengan atau mendukung pernyataan Yohanes. Ungkapan ini lebih alami dalam bahasa Indonesia modern daripada “bersaksi bagiku,” yang dapat terdengar seperti kesaksian yang menguntungkan pihak tertentu.
- source_word: ὅτι εἶπον
  choice: bahwa aku telah berkata
  rationale: ὅτι memperkenalkan isi kesaksian, sedangkan aoristus εἶπον menunjuk kepada perkataan Yohanes sebelumnya. “Telah berkata” menyampaikan acuan lampau itu secara wajar.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar bagi tokoh yang diurapi dan dinantikan, bukan sebagai nama diri.
- source_word: ἀλλ’ ὅτι
  choice: melainkan
  rationale: 'Kata ini menyatakan pertentangan tegas antara dua klausa isi: Yohanes bukan Mesias, tetapi ia adalah orang yang diutus mendahului-Nya.'
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: aku telah diutus
  rationale: Konstruksi perifrastis ini menggambarkan pengutusan yang sudah terjadi dengan keadaan atau tugas yang tetap berlaku.
- source_word: ἔμπροσθεν ἐκείνου
  choice: mendahului Dia
  rationale: Pilihan ini secara alami menyampaikan bahwa Yohanes diutus lebih dahulu dalam peran persiapan, tanpa menyiratkan keunggulan kedudukan.
theological_decisions:
- issue: Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Yohanes menyangkal bahwa dirinya adalah tokoh yang diurapi dan dinantikan. “Mesias” menjelaskan fungsi gelarnya, sementara “Kristus” tetap merupakan padanan tradisional yang sah.
- issue: Daya aspek Ἀπεσταλμένος εἰμὶ
  choice: aku telah diutus mendahului Dia
  alternative: aku diutus di depan-Nya; aku dahulu diutus mendahului Dia
  rationale: Pilihan utama mempertahankan tindakan pengutusan yang telah berlangsung beserta relevansinya pada saat Yohanes berbicara, tanpa menambahkan identitas pengutus atau rincian misi yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kamu” dipakai sesuai sapaan jamak dalam konteks, sedangkan kapitalisasi “Dia/-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Mesias. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
