id: JHN.3.26
reference: John 3:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: id
  text: Lalu mereka datang kepada Yohanes dan berkata kepadanya, “Rabi, orang yang bersama denganmu di seberang Sungai Yordan, yang tentangnya engkau telah bersaksi—lihat, dia membaptis, dan semua orang datang kepadanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: mereka datang kepada Yohanes
  rationale: ἔρχομαι dapat berarti datang atau pergi menurut sudut pandang; dalam alur ini, 'datang kepada Yohanes' alami dan tepat.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Transliterasi gelar ini mempertahankan latar Yahudi dan sudah lazim dalam bahasa Indonesia.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: orang yang bersama denganmu di seberang Sungai Yordan
  rationale: Ungkapan ini menyampaikan relasi dan lokasi secara alami; 'Sungai' memperjelas nama geografis bagi pembaca umum.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: yang tentangnya engkau telah bersaksi
  rationale: Dativus relatif paling alami dipahami sebagai pihak yang menjadi pokok kesaksian; bentuk perfektum dipertahankan dengan 'telah bersaksi'.
- source_word: ἴδε οὗτος
  choice: lihat, dia
  rationale: '''Lihat'' mempertahankan seruan penarik perhatian, sedangkan ''dia'' lebih alami daripada ''orang ini'' dalam bahasa Indonesia; konteks dan seruan tetap membawa penekanan pembicara.'
- source_word: βαπτίζει
  choice: membaptis
  rationale: Bentuk kini Yunani menyatakan kegiatan yang sedang berlangsung; dalam bahasa Indonesia verba tanpa penanda aspek sudah alami dalam laporan ini.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: semua orang datang kepadanya
  rationale: '''Semua orang'' mempertahankan generalisasi retoris πάντες, dan ''datang kepadanya'' mengikuti arah gerak yang dinyatakan teks.'
theological_decisions:
- issue: Bahasa kesaksian khas Yohanes
  choice: bersaksi
  alternative: memberi kesaksian
  rationale: '''Bersaksi'' mempertahankan motif μαρτυρέω secara konsisten, ringkas, dan bermartabat tanpa menambahkan tafsiran teologis.'
- issue: Hubungan dativus pada ᾧ σὺ μεμαρτύρηκας
  choice: yang tentangnya engkau telah bersaksi
  alternative: yang kepadanya engkau telah bersaksi
  rationale: Konstruksi Yunani dapat dipahami dengan nuansa objek atau kepentingan, tetapi konteks Yohanes 1 menunjukkan bahwa Yesus adalah pokok kesaksian Yohanes; formulasi Indonesia ini paling alami tanpa memperluas isi kesaksian.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina 'engkau' dipakai dalam ujaran langsung kepada Yohanes; 'kepadanya' menjaga rujukan tanpa membuat kalimat kaku. Tidak diperlukan catatan kaki karena alternatif konstruksi dativus tidak menghasilkan ambiguitas penting yang perlu ditampilkan dalam teks publikasi.
