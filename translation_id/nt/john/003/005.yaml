id: JHN.3.5
reference: John 3:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: id
  text: Yesus menjawab, “Sesungguhnya, sesungguhnya, Aku berkata kepadamu, jika seseorang tidak dilahirkan dari air dan Roh[a], ia tidak dapat masuk ke dalam Kerajaan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air dan roh.” Bahasa Yunani tidak membedakan huruf besar dan kecil; dalam konteks ini, “Roh” kemungkinan besar merujuk kepada Roh Kudus. Ungkapan “air dan Roh” telah dipahami sebagai gambaran penyucian dan pembaruan, sebagai kelahiran jasmani dan kelahiran rohani, atau sebagai rujukan kepada baptisan. Terjemahan mempertahankan ungkapan Yunani tanpa menentukan penafsirannya dalam teks utama.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif yang baku dan alami untuk tanggapan dalam percakapan.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang memberi penegasan khidmat, sambil menyampaikan maknanya dalam bahasa Indonesia yang mudah dipahami.
- source_word: λέγω σοι
  choice: Aku berkata kepadamu
  rationale: Mempertahankan bentuk langsung dan khidmat dari rumusan Yunani.
- source_word: ἐὰν μή τις
  choice: jika seseorang tidak
  rationale: Mengungkapkan syarat negatif dan acuan generik tanpa memasukkan kekhususan gender.
- source_word: γεννηθῇ
  choice: dilahirkan
  rationale: Mempertahankan bentuk pasif dan tidak memasukkan arti 'kembali' atau 'dari atas', sebab ἄνωθεν tidak terdapat dalam ayat ini.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: dari air dan Roh
  rationale: Mengikuti susunan dan citra Yunani tanpa menentukan secara eksplisit hubungan air dan Roh atau satu tafsiran sakramental tertentu.
- source_word: οὐ δύναται
  choice: tidak dapat
  rationale: Padanan Indonesia yang alami dan tepat untuk ketidakmampuan yang dinyatakan oleh δύναμαι.
- source_word: εἰσελθεῖν εἰς
  choice: masuk ke dalam
  rationale: Padanan idiomatis yang mempertahankan gagasan memasuki suatu ranah.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan Indonesia yang mapan dan tetap memungkinkan dimensi pemerintahan maupun ranah kerajaan.
theological_decisions:
- issue: Acuan πνεύματος dalam frasa 'dari air dan roh/Roh'
  choice: Roh, kemungkinan besar merujuk kepada Roh Kudus
  alternative: roh, sebagai roh manusia atau prinsip rohani
  rationale: Konteks Yohanes dan latar pembaruan oleh Roh mendukung acuan kepada Roh Kudus, tetapi bahasa Yunani tidak memakai huruf kapital dan nomina ini tidak berartikel; karena itu kemungkinan lain dicatat tanpa dihapus.
- issue: Makna 'air dan Roh'
  choice: Wording Yunani dipertahankan tanpa menetapkan satu penafsiran dalam teks utama
  alternative: Air sebagai kelahiran jasmani; air sebagai baptisan; atau air dan Roh sebagai gambaran terpadu tentang penyucian dan pembaruan
  rationale: Ayat ini telah dipahami dengan beberapa cara. Terjemahan tidak boleh memasukkan kekhasan denominasi atau menyelesaikan ambiguitas yang tidak diselesaikan oleh bentuk Yunani itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Sesungguhnya, sesungguhnya' sengaja dipertahankan. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk tuturan Yesus, dan 'Kerajaan Allah' mengikuti bentuk istilah yang mapan.
