  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: id
  text: Namun, orang yang melakukan kebenaran datang kepada terang[a], supaya perbuatan-perbuatannya dinyatakan bahwa perbuatan-perbuatan itu telah dikerjakan di dalam Allah[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunaninya secara harfiah berarti “melakukan kebenaran”; dapat juga diterjemahkan “mempraktikkan kebenaran” atau “melakukan apa yang benar”.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “supaya perbuatan-perbuatannya dinyatakan, karena perbuatan-perbuatan itu telah dikerjakan di dalam Allah.” Kata penghubung Yunaninya dapat memperkenalkan isi yang dinyatakan atau alasan perbuatan-perbuatan itu dinyatakan.'
    reason: alternative_reading
  - marker: c
    text: “Di dalam Allah” dapat pula dipahami sebagai “oleh Allah” atau “melalui Allah”; ungkapan Yunaninya membiarkan nuansanya tetap terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Namun, orang yang melakukan kebenaran
  rationale: δέ menyatakan kontras ringan dengan ayat sebelumnya. Partisipel berartikel menunjuk kepada orang yang bercirikan tindakan ini. Ungkapan yang tidak biasa, 'melakukan kebenaran', dipertahankan untuk membawa daya moral dan pewahyuan dari idiom Yohanes, bukan dipersempit menjadi sekadar berkata benar.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: datang kepada terang
  rationale: πρός sesudah verba gerak menyatakan gerak menuju sesuatu. 'Kepada terang' mempertahankan metafora mendekati terang tanpa mengubahnya menjadi 'masuk ke dalam terang'.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: supaya perbuatannya menjadi nyata
  rationale: ἵνα menyatakan tujuan, sedangkan bentuk pasif φανερωθῇ dipertahankan melalui 'menjadi nyata'. 'Perbuatan' merupakan padanan Indonesia yang alami bagi ἔργα dalam konteks perilaku.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι dipahami terutama sebagai pengantar isi dari apa yang menjadi nyata, walaupun makna kausal 'karena' tetap mungkin dan dicatat dalam catatan kaki.
- source_word: ἐν θεῷ
  choice: di dalam Allah
  rationale: 'Terjemahan ini mempertahankan keterbukaan ἐν: lingkup, hubungan, atau perantaraan/agensi ilahi tidak dipastikan secara sempit.'
- source_word: ἐστιν εἰργασμένα
  choice: telah dilakukan
  rationale: Konstruksi perfektum pasif perifrasis menyatakan tindakan yang telah selesai dengan keadaan hasil yang tetap relevan. 'Telah dilakukan' mempertahankan aspek hasil dan bentuk pasif secara wajar.
theological_decisions:
- issue: Makna idiom ποιῶν τὴν ἀλήθειαν
  choice: melakukan kebenaran
  alternative: mempraktikkan kebenaran; melakukan apa yang benar; hidup menurut kebenaran
  rationale: Ungkapan harfiah yang khas dipertahankan agar kebenaran tetap dipahami sebagai sesuatu yang diwujudkan dalam tindakan, tanpa membatasi cakupan teologisnya melalui parafrasa.
- issue: Fungsi ὅτι
  choice: 'pengantar isi: ''bahwa'''
  alternative: 'pengantar alasan: ''karena'''
  rationale: Setelah 'menjadi nyata', ὅτι dapat menjelaskan isi yang dinyatakan, tetapi pembacaan kausal juga sah. Teks utama memilih pembacaan isi dan catatan kaki menjaga alternatifnya.
- issue: Nuansa ἐν θεῷ
  choice: di dalam Allah
  alternative: oleh Allah; melalui Allah; dalam persekutuan dengan Allah
  rationale: Bahasa sumber membiarkan relasi antara perbuatan dan Allah cukup terbuka. Terjemahan utama tidak menentukan apakah nuansa utamanya adalah agensi, sarana, lingkup, atau hubungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom khas Yohanes 'melakukan kebenaran' dan ambiguitas pada ὅτι serta ἐν θεῷ tetap dipertahankan atau dijelaskan melalui catatan kaki.
