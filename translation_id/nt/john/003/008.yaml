id: JHN.3.8
reference: John 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: id
  text: Angin bertiup ke mana ia mau,[a] dan kamu mendengar bunyinya,[b] tetapi kamu tidak tahu dari mana datangnya dan ke mana perginya. Demikianlah halnya dengan setiap orang yang telah dilahirkan dari Roh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani pneuma dapat berarti “angin” atau “roh”. Yesus memakai kata yang sama pada kedua bagian ayat ini, sehingga tercipta permainan kata yang tidak dapat dipertahankan sepenuhnya dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Atau “suaranya”. Kata Yunani yang dipakai dapat berarti “bunyi” atau “suara”; di sini kata itu menunjuk pada bunyi angin yang terdengar.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (ayat 8a)
  choice: angin
  rationale: Dalam klausa pertama, πνεῦμα menjadi subjek πνεῖ (“bertiup”) dan bunyinya terdengar, sehingga makna konkret “angin” paling sesuai. Pilihan ini juga membedakannya secara wajar dari πνεῦμα pada akhir ayat, yang berarti “Roh”.
- source_word: ὅπου θέλει
  choice: ke mana ia mau
  rationale: Ungkapan ini mempertahankan unsur kehendak atau personifikasi dalam bahasa Yunani, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: πνεῖ
  choice: bertiup
  rationale: Dengan πνεῦμα dalam arti “angin”, kata kerja meteorologis yang alami adalah “bertiup”.
- source_word: φωνήν
  choice: bunyinya
  rationale: φωνή dapat berarti “suara” atau “bunyi”. Karena acuannya adalah angin, “bunyi” menyampaikan dampak yang terdengar tanpa personifikasi berlebihan.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: kamu tidak tahu dari mana datangnya atau ke mana perginya
  rationale: 'Susunan ini secara alami mempertahankan pasangan arah asal dan tujuan dalam bahasa Yunani. “Atau” sesuai dengan bentuk negatif bahasa Indonesia: tidak mengetahui yang satu ataupun yang lain.'
- source_word: οὕτως ἐστίν
  choice: Demikianlah halnya dengan
  rationale: Ungkapan Indonesia ini menyampaikan fungsi perbandingan yang menghubungkan gambaran angin dengan orang yang dilahirkan dari Roh.
- source_word: πᾶς ὁ γεγεννημένος
  choice: setiap orang yang telah dilahirkan
  rationale: '“Setiap orang” mempertahankan cakupan distributif πᾶς, sedangkan “telah dilahirkan” mencerminkan aspek perfektum: kelahiran yang sudah terjadi dengan keadaan yang tetap berlangsung.'
- source_word: ἐκ τοῦ πνεύματος (ayat 8b)
  choice: dari Roh
  rationale: ἐκ menyatakan sumber atau asal. Dalam konteks kelahiran baru di Yohanes 3, πνεῦμα di sini merujuk kepada Roh, dan kapitalisasi membantu menandai rujukan tersebut.
theological_decisions:
- issue: Permainan makna πνεῦμα yang diulang dalam ayat ini
  choice: Menerjemahkan kemunculan pertama sebagai “angin” dan kemunculan terakhir sebagai “Roh”.
  alternative: Menerjemahkan kedua kemunculan dengan istilah yang sama, atau menerjemahkan kemunculan pertama sebagai “Roh”.
  rationale: Bahasa Yunani memakai satu kata yang dapat berarti “angin” maupun “roh”. Klausa pembuka jelas membangun gambaran angin yang bertiup dan terdengar, sedangkan klausa penutup berbicara tentang kelahiran dari Roh. Bahasa Indonesia tidak memiliki satu kata alami yang mempertahankan kedua makna itu, jadi teks utama membedakannya dan catatan kaki menjelaskan permainan katanya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina “ia” untuk angin mempertahankan personifikasi ringan dalam ὅπου θέλει tanpa mengesankan bahwa angin adalah pribadi secara harfiah. Kalimat tetap dekat dengan struktur dan ketegangan leksikal sumber Yunani.
