base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: id
  text: Apa yang telah Dia lihat dan dengar, tentang itulah Dia bersaksi, dan tidak seorang pun menerima kesaksian-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pernyataan “tidak seorang pun menerima kesaksian-Nya” merupakan generalisasi yang sangat tegas; ayat berikutnya berbicara tentang orang yang menerima kesaksian itu.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ ἑώρακεν καὶ ἤκουσεν
  choice: Apa yang telah Dia lihat dan dengar
  rationale: ὃ menunjuk pada isi yang dilihat dan didengar. Kata “telah” menyampaikan relevansi berkelanjutan dari bentuk perfektum ἑώρακεν; bahasa Indonesia tidak perlu memaksakan perbedaan aspek antara perfektum dan aoristus dalam rangkaian ini.
- source_word: τοῦτο μαρτυρεῖ
  choice: tentang itulah Dia bersaksi
  rationale: Susunan ini mempertahankan penegasan resumptif τοῦτο—isi yang baru disebut itulah yang diberi kesaksian—serta menjaga nuansa kesaksian pada μαρτυρεῖ.
- source_word: μαρτυρίαν
  choice: kesaksian
  rationale: “Kesaksian” mempertahankan hubungan leksikal dengan “bersaksi” dan nuansa pemberian kesaksian yang penting dalam Injil Yohanes.
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan ini mempertahankan penyangkalan universal Yunani secara tegas tanpa melunakkannya menjadi “hanya sedikit orang”.
- source_word: λαμβάνει
  choice: menerima
  rationale: “Menerima” dekat dengan makna dasar λαμβάνω dan tetap membuka nuansa menerima atau mengakui kesaksian, tanpa menjelaskan secara berlebihan sebagai “memercayai” atau “menerima sebagai benar”.
- source_word: καὶ
  choice: tetapi
  rationale: Konjungsi menghubungkan kesaksian yang diberikan dengan tanggapan negatif terhadapnya. “Tetapi” menyatakan pertentangan yang tersirat secara alami dalam bahasa Indonesia tanpa mengubah isi proposisional.
theological_decisions:
- issue: Cakupan pernyataan οὐδεὶς λαμβάνει (“tidak seorang pun menerima”)
  choice: Mempertahankan rumusan tegas “tidak seorang pun menerima”.
  alternative: “Hampir tidak seorang pun menerima” atau memahami pernyataan itu sebagai kemutlakan matematis tanpa mempertimbangkan ayat berikutnya.
  rationale: Teks Yunani memakai penyangkalan universal yang tegas, sedangkan ayat berikutnya menyebut orang yang menerima kesaksian itu. Terjemahan mempertahankan ketegangan retoris tersebut dan tidak melunakkan ataupun menyelesaikannya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “tentang itulah Dia bersaksi” mempertahankan penekanan Yunani tanpa terdengar kaku. Huruf kapital pada “Dia” dan enklitik “-Nya” mengikuti kebiasaan penulisan Indonesia untuk rujukan kepada Kristus.
