  source_fidelity: Konjungsi καὶ pada klausa terakhir berarti “dan,” bukan “tetapi.” Walaupun terdapat kontras konseptual antara kesaksian yang diberikan dan penolakannya, teks Yunani mengoordinasikan kedua klausa tanpa penanda pertentangan. Selebihnya, “Apa yang telah Dia lihat dan dengar” menyampaikan isi netral ὃ serta relevansi perfektum ἑώρακεν secara wajar, dan “tidak seorang pun menerima” mempertahankan οὐδεὶς λαμβάνει yang tegas.
  naturalness: Susunan “tentang itulah Dia bersaksi” dapat diterima dalam ragam Alkitab Indonesia yang modern dan bermartabat. Dengan mengganti “tetapi” menjadi “dan,” kalimat tetap alami serta lebih setia kepada hubungan antarklausa dalam sumber.
  terminology: “Bersaksi” dan “kesaksian” mempertahankan keterkaitan μαρτυρεῖ/μαρτυρίαν dan nuansa kesaksian yang penting dalam Yohanes. “Menerima” tepat untuk λαμβάνει dan tidak menambahkan penafsiran seperti “memercayai” atau “mengakui sebagai benar.”
