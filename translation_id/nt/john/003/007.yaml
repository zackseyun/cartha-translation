  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: id
  text: Jangan heran bahwa Aku berkata kepadamu[b], “Kalian harus dilahirkan dari atas.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dilahirkan kembali.” Kata Yunani ἄνωθεν dapat berarti “dari atas” atau “kembali/lagi.”
    reason: alternative_reading
  - marker: b
    text: Kata “kepadamu” berbentuk tunggal dalam bahasa Yunani, sedangkan “kalian” dalam kalimat berikutnya berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Jangan heran
  rationale: μή dengan subjungtif aoristus menyatakan larangan. “Jangan heran” alami dalam bahasa Indonesia modern dan mempertahankan daya θαυμάζω tanpa terdengar kaku.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι di sini memperkenalkan isi perkataan Yesus, sehingga “bahwa” paling sesuai dengan sintaksisnya.
- source_word: εἶπόν σοι
  choice: Aku berkata kepadamu
  rationale: Terjemahan ini mempertahankan tindak tutur langsung dan memungkinkan catatan kaki menjelaskan bahwa σοι berbentuk tunggal.
- source_word: Δεῖ
  choice: harus
  rationale: Δεῖ menyatakan keharusan; “harus” ringkas, alami, dan mempertahankan kekuatan pernyataan itu.
- source_word: ὑμᾶς
  choice: kalian
  rationale: ὑμᾶς berbentuk jamak. “Kalian” menyatakan jumlah itu secara jelas dan alami sekaligus mempertahankan kontras dengan σοι yang tunggal.
- source_word: γεννηθῆναι
  choice: dilahirkan
  rationale: Infinitif pasif γεννηθῆναι paling alami diterjemahkan “dilahirkan” dalam konteks kelahiran yang dibicarakan Yesus.
- source_word: ἄνωθεν
  choice: dari atas
  rationale: ἄνωθεν dapat berarti “dari atas” atau “kembali/lagi.” “Dari atas” mempertahankan penekanan Yohanes pada asal surgawi, sementara makna alternatifnya dicatat agar ambiguitas yang asli tidak hilang.
theological_decisions:
- issue: Makna ἄνωθεν dalam perkataan tentang kelahiran
  choice: dari atas
  alternative: kembali; lagi
  rationale: Istilah ini memiliki lebih dari satu kemungkinan makna dalam Yohanes 3. Pemakaian Yohanes dan penekanan pada kelahiran yang berasal dari Allah mendukung “dari atas” dalam teks utama, tetapi makna “kembali/lagi” tetap dicantumkan dalam catatan kaki untuk mempertahankan ketegangan dan permainan makna dalam percakapan dengan Nikodemus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Aku” mengikuti ujaran langsung Yesus; “kalian” dipakai untuk menampilkan bentuk jamak Yunani secara eksplisit. Penempatan [b] langsung sesudah “kepadamu” dan [a] sesudah frasa yang diterangkannya memperjelas cakupan setiap catatan.
