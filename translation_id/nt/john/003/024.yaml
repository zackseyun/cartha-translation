  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: id
  text: Sebab pada waktu itu Yohanes belum dimasukkan ke dalam penjara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, Yohanes Pembaptis.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: belum
  rationale: Menandakan bahwa pemenjaraan Yohanes belum terjadi sampai pada titik waktu dalam narasi ini.
- source_word: γὰρ
  choice: sebab
  rationale: Memberikan keterangan latar yang menjelaskan mengapa pelayanan Yohanes dan Yesus masih berlangsung pada masa yang sama.
- source_word: ἦν βεβλημένος
  choice: pada waktu itu ... belum dimasukkan
  rationale: Bentuk perifrastik lampau menyatakan keadaan akibat tindakan yang, pada titik narasi tersebut, belum terjadi. Ungkapan 'dimasukkan' alami dalam konteks pemenjaraan; keterangan 'pada waktu itu' memperjelas acuan waktu lampau.
- source_word: εἰς τὴν φυλακήν
  choice: ke dalam penjara
  rationale: Menyampaikan arah εἰς dan arti φυλακή sebagai tempat pemenjaraan secara alami dalam bahasa Indonesia.
- source_word: ὁ Ἰωάννης
  choice: Yohanes
  rationale: Teks Yunani hanya menyebut nama Yohanes; identitasnya sebagai Yohanes Pembaptis dijelaskan dalam catatan kaki, bukan ditambahkan ke teks utama.
theological_decisions:
- issue: Identitas ὁ Ἰωάννης
  choice: Yohanes
  alternative: Yohanes Pembaptis
  rationale: Konteks mengidentifikasinya sebagai Yohanes Pembaptis, tetapi ayat Yunani hanya berbunyi 'Yohanes'. Terjemahan utama mempertahankan bentuk sumber tanpa menambahkan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. 'Dimasukkan ke dalam penjara' dipilih daripada 'dilemparkan' karena merupakan ungkapan Indonesia yang alami untuk tindakan memenjarakan tanpa mengubah makna konteks.
