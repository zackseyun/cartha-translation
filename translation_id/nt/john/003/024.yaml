  source_fidelity: 'Teks Indonesia menyampaikan semua unsur utama Yunani: γάρ sebagai penjelasan latar (''Sebab''), οὔπω sebagai ''belum'', Yohanes sebagai subjek, dan φυλακή sebagai ''penjara''. Ungkapan ''dimasukkan ke dalam penjara'' merupakan padanan idiomatis yang memadai bagi εἰς τὴν φυλακήν dan pasif βεβλημένος dalam konteks pemenjaraan. Tambahan ''pada waktu itu'' secara wajar menyatakan titik acuan naratif yang tersirat dalam οὔπω dan bentuk lampau, tanpa menambah peristiwa atau penafsiran baru.'
