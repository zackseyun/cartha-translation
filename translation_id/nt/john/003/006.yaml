id: JHN.3.6
reference: John 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: id
  text: Yang lahir dari daging adalah daging, dan yang lahir dari Roh adalah roh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang lahir dari Roh bersifat rohani.” Teks Yunani secara harfiah berbunyi “adalah roh”, sehingga mempertahankan perbedaan kualitatif dengan “daging”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: yang lahir
  rationale: Bentuk partisipel pasif perfek dengan artikel netral dipakai secara umum. Dalam bahasa Indonesia, “yang lahir” menyampaikan kategori umum itu secara alami tanpa menunjuk kepada orang tertentu.
- source_word: ἐκ
  choice: dari
  rationale: Dalam konteks kelahiran, “dari” menyatakan sumber atau asal secara jelas dan wajar.
- source_word: σάρξ / σαρκὸς
  choice: daging
  rationale: “Daging” mempertahankan istilah konkret dan kesejajaran kata Yunani. Dalam konteks ini, yang terutama dikontraskan ialah kelahiran alamiah manusia dengan kelahiran dari Roh, bukan secara khusus tabiat berdosa.
- source_word: πνεύματος / πνεῦμά
  choice: Roh / roh
  rationale: Kemunculan pertama menunjuk kepada Roh sebagai sumber kelahiran dan karena itu ditulis “Roh”. Predikat tanpa artikel pada kemunculan kedua dipertahankan sebagai “roh”, yang menyatakan sifat atau ranah hasil kelahiran itu tanpa menyamakannya begitu saja dengan Roh Kudus.
- source_word: ἐστιν
  choice: adalah
  rationale: Kopula “adalah” mempertahankan bentuk pernyataan yang ringkas, seimbang, dan bersifat kategoris.
theological_decisions:
- issue: Makna σάρξ dalam klausa pertama
  choice: “daging” sebagai ranah manusiawi atau alamiah
  alternative: “tabiat berdosa” atau “kodrat manusia”
  rationale: Konteks membedakan kelahiran manusiawi dengan kelahiran dari Roh. “Tabiat berdosa” akan mempersempit makna secara teologis, sedangkan “daging” mempertahankan ketegangan dan gaya ungkapan Yohanes.
- issue: Makna πνεῦμα sebagai predikat dalam klausa kedua
  choice: “roh” dengan huruf kecil
  alternative: “Roh” atau “bersifat rohani”
  rationale: Predikat Yunani tanpa artikel kemungkinan besar bersifat kualitatif. “Roh” dapat menyamakan hasil kelahiran dengan Roh Kudus, sementara “bersifat rohani” lebih interpretatif daripada bentuk nomina sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan aforistis dan paralel. Istilah “daging”, “Roh”, dan “roh” dipertahankan untuk mencerminkan permainan dan kontras leksikal dalam teks Yunani.
