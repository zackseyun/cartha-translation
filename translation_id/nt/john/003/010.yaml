  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Engkau adalah guru Israel[a] dan engkau tidak mengetahui hal-hal ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “sang guru Israel.” Bahasa Yunani memakai kata sandang tentu, yang mungkin memberi sapaan ini nada tegas dan retoris. Terjemahan lain: “seorang guru Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Padanan naratif baku dalam dialog dan mempertahankan bentuk tanggapan formal.
- source_word: εἶπεν
  choice: berkata
  rationale: Mempertahankan formula dua verba Yunani, ‘menjawab dan berkata’, secara wajar dalam bahasa Indonesia.
- source_word: Σὺ
  choice: Engkau
  rationale: Pronomina eksplisit dalam bahasa Yunani bersifat menegaskan; ‘Engkau’ mempertahankan penekanan itu dan sesuai dengan register percakapan yang bermartabat.
- source_word: ὁ διδάσκαλος
  choice: guru
  rationale: Bahasa Indonesia umumnya tidak memakai kata sandang tertentu; bentuk ‘guru Israel’ dapat menyampaikan kedudukan yang dikenali, sedangkan catatan kaki menjelaskan daya tentu dan retoris teks Yunani.
- source_word: τοῦ Ἰσραὴλ
  choice: Israel
  rationale: Konstruksi ‘guru Israel’ secara alami menyatakan hubungan representatif dengan umat Israel, bukan sekadar lokasi geografis.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Menjaga keluasan rujukan demonstratif jamak kepada ajaran dalam konteks sebelumnya.
- source_word: γινώσκεις
  choice: mengetahui
  rationale: Padanan leksikal langsung yang tetap dapat mencakup nuansa memahami dalam konteks.
- source_word: καί
  choice: tetapi
  rationale: Dalam pertanyaan bernada teguran ini, καί menghubungkan dua kenyataan yang berlawanan secara retoris; ‘tetapi’ mengungkapkan relasi kontras tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya sapaan ὁ διδάσκαλος τοῦ Ἰσραὴλ kepada Nikodemus
  choice: ‘guru Israel’, dengan daya tentu teks Yunani diterangkan dalam catatan kaki
  alternative: ‘seorang guru Israel’ atau ‘guru terkemuka Israel’
  rationale: Bahasa Indonesia tidak memiliki kata sandang tentu yang langsung setara dengan ὁ. ‘Guru Israel’ tidak melemahkan sapaan menjadi sekadar salah satu guru, sementara ‘guru terkemuka’ akan menambahkan tafsiran yang tidak dinyatakan secara eksplisit. Catatan kaki mempertahankan ketajaman retoris dan ambiguitas cakupannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Formula ‘menjawab dan berkata’ sengaja dipertahankan untuk mencerminkan bentuk naratif Yunani. ‘Engkau’ dipilih untuk menjaga penekanan pronomina dan nada sapaan langsung.
