  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: id
  text: Ada seorang dari kalangan Farisi bernama Nikodemus, seorang pemimpin orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang pemimpin orang Yudea.” Istilah Yunani yang diterjemahkan “orang Yahudi” dapat merujuk kepada orang Yahudi secara umum atau, dalam konteks tertentu, lebih khusus kepada orang Yudea atau para pemimpin Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Ada
  rationale: ἦν memperkenalkan keberadaan tokoh baru, sedangkan δέ merupakan penghubung ringan. Dalam bahasa Indonesia, “Ada” secara alami membuka adegan tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Konteks dan nama tokoh menunjukkan seorang laki-laki tertentu. Dalam konstruksi “seorang ... bernama,” bahasa Indonesia tidak perlu menambahkan kata “laki-laki” agar maknanya jelas dan alami.
- source_word: ἐκ τῶν Φαρισαίων
  choice: dari kalangan Farisi
  rationale: ἐκ dengan genitif menyatakan bahwa Nikodemus berasal dari atau termasuk dalam kelompok Farisi. “Dari kalangan” menyampaikan keanggotaan kelompok secara alami.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: bernama Nikodemus
  rationale: Ungkapan penamaan Yunani ini paling wajar dan ringkas diterjemahkan dengan “bernama Nikodemus.”
- source_word: ἄρχων
  choice: seorang pemimpin
  rationale: ἄρχων menunjuk kepada orang yang memegang kewenangan. “Pemimpin” mempertahankan cakupan istilah tanpa memastikan jabatan khusus yang tidak disebutkan dalam ayat.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam konteks ini, frasa tersebut berkaitan dengan kepemimpinan komunitas Yahudi. Terjemahan utama mempertahankan sebutan luas, sementara kemungkinan nuansa Yudea atau kalangan penguasa Yahudi dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna Ἰουδαίων dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea; kalangan penguasa Yahudi
  rationale: Istilah Ἰουδαῖοι dapat memiliki nuansa etnis, keagamaan, geografis, atau kelembagaan. Karena Nikodemus diperkenalkan sebagai orang Farisi dan pemimpin, konteks mengarah pada kepemimpinan Yahudi, tetapi teks tidak secara eksplisit menyebut dewan atau jabatan tertentu. Terjemahan utama dibiarkan luas dan ketegangan maknanya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. “Dari kalangan Farisi” menghindari kesan bahwa Farisi adalah tempat asal, sedangkan “pemimpin” tidak mempersempit ἄρχων menjadi jabatan tertentu.
