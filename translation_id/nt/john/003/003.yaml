id: JHN.3.3
reference: John 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Sesungguhnya, sesungguhnya, Aku berkata kepadamu, jika seseorang tidak dilahirkan dari atas,[a] ia tidak dapat melihat Kerajaan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dilahirkan kembali.” Kata keterangan Yunani ini dapat berarti “dari atas” maupun “kembali”; percakapan pada ayat berikutnya bertumpu pada makna ganda tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: menjawab dan berkata
  rationale: Mempertahankan konstruksi dua verba Yunani dengan ungkapan Indonesia yang tetap wajar dan bermartabat.
- source_word: Ἀμὴν ἀμὴν
  choice: Sesungguhnya, sesungguhnya
  rationale: Mempertahankan pengulangan yang memberi penekanan kuat sekaligus menyampaikan maknanya secara jelas dalam bahasa Indonesia modern.
- source_word: ἐὰν μή τις
  choice: jika seseorang tidak
  rationale: Menyampaikan syarat negatif dan sifat generik τις tanpa menentukan gender.
- source_word: γεννηθῇ
  choice: dilahirkan
  rationale: Mencerminkan bentuk pasif γεννάω tanpa memasukkan makna ‘kembali’ yang berasal dari kemungkinan arti ἄνωθεν.
- source_word: ἄνωθεν
  choice: dari atas
  rationale: Arti ini sesuai dengan pola pemakaian Yohanes dan tema asal surgawi, sementara arti alternatif ‘kembali’ dipertahankan dalam catatan kaki.
- source_word: οὐ δύναται ἰδεῖν
  choice: tidak dapat melihat
  rationale: Menerjemahkan ketidakmampuan dan verba ‘melihat’ secara langsung, tanpa mempersempitnya menjadi sekadar memahami atau mengalami.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan Indonesia yang mapan dan tetap memungkinkan cakupan makna pemerintahan maupun ranah kerajaan Allah.
theological_decisions:
- issue: Makna ἄνωθεν dalam perkataan Yesus
  choice: dari atas
  alternative: kembali; sekali lagi
  rationale: Ἄνωθεν sungguh dapat berarti ‘dari atas’ maupun ‘kembali/sekali lagi’. Konteks Yohanes mendukung ‘dari atas’, sedangkan tanggapan Nikodemus pada ayat berikutnya bertumpu pada kemungkinan arti ‘kembali’. Teks utama dan catatan kaki mempertahankan permainan makna serta ketegangan ini.
- issue: Makna ‘melihat’ Kerajaan Allah
  choice: melihat
  alternative: mengalami; memahami
  rationale: Terjemahan literal mempertahankan keluasan makna Yohanes dan tidak memutuskan apakah yang terutama dimaksud adalah memahami, mengalami, atau turut mengambil bagian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘Sesungguhnya, sesungguhnya’ serta konstruksi ‘menjawab dan berkata’ dipertahankan demi penekanan dan keterlacakan terhadap bentuk Yunani. Kata ganti ‘Aku’ ditulis dengan huruf kapital sesuai kebiasaan ortografi Alkitab bahasa Indonesia untuk ujaran Yesus.
