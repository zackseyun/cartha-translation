  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: id
  text: Jika Aku sudah memberitahukan kepada kalian hal-hal duniawi[a] dan kalian tidak percaya, bagaimana kalian akan percaya jika Aku memberitahukan kepada kalian hal-hal surgawi[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal di bumi”.
    reason: lexical_alternative
  - marker: b
    text: Atau “hal-hal di surga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: hal-hal duniawi
  rationale: Adjektiva netral jamak ini berfungsi sebagai nomina. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras langsung dengan τὰ ἐπουράνια tanpa menentukan apakah yang dimaksud ialah perumpamaan duniawi atau peristiwa di bumi.
- source_word: εἶπον
  choice: Aku sudah memberitahukan
  rationale: Bentuk aoristus menunjuk pada perkataan Yesus sebelumnya. 'Memberitahukan' sesuai dengan objek tidak langsung ὑμῖν, sedangkan 'sudah' secara alami menandai tindakan yang telah dilakukan dalam konteks ini.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Pronomina Yunani berbentuk jamak, tetapi bahasa Indonesia tidak membedakan jumlah pada '-mu'. Dalam konteks percakapan dengan Nikodemus, bentuk ini alami sekaligus tidak menutup kemungkinan nuansa jamak dari teks Yunani.
- source_word: οὐ πιστεύετε
  choice: kamu tidak percaya
  rationale: Present indikatif menyatakan tanggapan atau keadaan sekarang. 'Tidak percaya' merupakan padanan baku dan tidak mempersempit πιστεύω menjadi sekadar pemahaman intelektual ataupun secara eksplisit menjadi kepercayaan personal.
- source_word: πῶς ... πιστεύσετε
  choice: bagaimana kamu akan percaya
  rationale: Pilihan ini mempertahankan kata tanya πῶς dan bentuk futur πιστεύσετε, serta menjaga sifat retoris pertanyaan tanpa mengubahnya menjadi pernyataan tentang kemampuan.
- source_word: ἐὰν εἴπω
  choice: jika Aku memberitahukan
  rationale: ἐὰν dengan aoristus subjungtif menyatakan kondisi yang berorientasi ke masa depan. Bentuk Indonesia ini wajar dan tidak memerlukan ungkapan kaku seperti 'jika Aku kelak memberitahukan'.
- source_word: τὰ ἐπουράνια
  choice: hal-hal surgawi
  rationale: Adjektiva netral jamak ini berfungsi substantival dan berkontras dengan τὰ ἐπίγεια. 'Hal-hal surgawi' mempertahankan kategori luas tentang realitas yang berkaitan dengan surga tanpa memberi tafsiran lebih sempit.
theological_decisions:
- issue: Makna kontras antara τὰ ἐπίγεια dan τὰ ἐπουράνια
  choice: Menerjemahkannya secara langsung sebagai 'hal-hal duniawi' dan 'hal-hal surgawi'.
  alternative: Menafsirkannya secara khusus sebagai gambaran dari pengalaman di bumi versus rahasia ilahi yang lebih dalam, atau sebagai kejadian di bumi versus hal-hal yang berada di surga.
  rationale: Teks membedakan dua kategori penyataan, tetapi tidak menjelaskan secara tegas cakupan masing-masing. Padanan yang luas mempertahankan ambiguitas dan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi 'Aku' mengikuti praktik umum ketika pronomina merujuk kepada Yesus. Susunan kalimat mempertahankan bentuk kondisi dan pertanyaan retoris sumber Yunani.
