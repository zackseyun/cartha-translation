base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: id
  text: Yohanes juga sedang membaptis[a] di Ainon, dekat Salim, karena di situ terdapat banyak air[b], dan orang-orang berdatangan dan dibaptis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “membaptis” dapat juga diterjemahkan “mencelupkan.” Istilah “membaptis” dipertahankan sebagai istilah yang sudah lazim dan tidak dengan sendirinya menentukan cara pelaksanaannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “karena banyak air ada di situ”; maksudnya dapat juga dinyatakan, “karena di situ tersedia air yang melimpah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Yohanes juga sedang membaptis
  rationale: δέ berfungsi sebagai penghubung wacana yang ringan dan tidak perlu dinyatakan secara khusus; καί diterjemahkan “juga.” Gabungan ἦν dengan participel kini βαπτίζων menyatakan kegiatan yang sedang berlangsung pada masa lampau, sehingga diterjemahkan “sedang membaptis.”
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: di Ainon, dekat Salim
  rationale: Nama tempat ditransliterasikan, sedangkan ἐγγύς dengan bentuk genitif menyatakan kedekatan lokasi.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: karena di situ terdapat banyak air
  rationale: ὅτι bersifat kausal. Ungkapan plural harfiah “banyak air-air” secara alami dinyatakan “banyak air” dalam bahasa Indonesia, tanpa menghilangkan gagasan tersedianya sumber air yang melimpah.
- source_word: παρεγίνοντο
  choice: orang-orang berdatangan
  rationale: Bentuk imperfek menunjukkan kedatangan yang berlangsung atau berulang. Subjek tersirat dibuat eksplisit sebagai “orang-orang” agar alami dalam bahasa Indonesia.
- source_word: ἐβαπτίζοντο
  choice: dibaptis
  rationale: Bentuk imperfek pasif mempertahankan makna bahwa mereka menerima baptisan; aspek berlangsung sudah didukung oleh “berdatangan” dalam rangkaian kalimat.
theological_decisions:
- issue: Cara menerjemahkan βαπτίζω
  choice: membaptis / dibaptis
  alternative: mencelupkan / dicelupkan
  rationale: “Membaptis” adalah istilah keagamaan yang mapan dalam bahasa Indonesia dan mempertahankan kesinambungan istilah Perjanjian Baru. Pilihan ini tidak dengan sendirinya menetapkan cara pelaksanaan baptisan; kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat mempertahankan kegiatan yang berlangsung dan berulang, tetapi menghindari ungkapan harfiah yang tidak alami dalam bahasa Indonesia.
