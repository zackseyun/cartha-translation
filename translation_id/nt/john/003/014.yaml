  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: id
  text: Sama seperti Musa meninggikan ular itu di padang gurun[a], demikian pula Anak Manusia harus ditinggikan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lihat Bilangan 21:8–9 tentang Musa meninggikan ular di padang gurun.
    reason: cross_reference
  - marker: b
    text: Kata Yunani yang diterjemahkan “ditinggikan” dapat menunjuk pada pengangkatan secara fisik dan juga pada pemuliaan; dalam Injil Yohanes, kedua makna itu kemungkinan dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ... οὕτως
  choice: sama seperti ... demikian pula
  rationale: Bentuk korelatif ini secara alami dan jelas mempertahankan perbandingan langsung antara tindakan Musa dan apa yang harus dialami Anak Manusia.
- source_word: ὕψωσεν ... ὑψωθῆναι
  choice: meninggikan ... ditinggikan
  rationale: Pemakaian akar kata Indonesia yang sama mempertahankan kaitan verbal dalam bahasa Yunani. Kata ini dapat menunjuk pada pengangkatan secara fisik sekaligus menyiratkan pemuliaan.
- source_word: τὸν ὄφιν
  choice: ular itu
  rationale: “Ular” adalah padanan modern yang jelas, sedangkan unsur “itu” menandai objek tertentu dalam kisah yang dirujuk.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang gurun
  rationale: Padanan ini lazim dalam ragam Alkitab bahasa Indonesia dan sesuai dengan latar perjalanan Israel dalam Bilangan 21.
- source_word: δεῖ
  choice: harus
  rationale: “Harus” menyampaikan keharusan yang tegas, bukan sekadar kemungkinan atau ramalan.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar diri Yesus yang mapan serta gaung teologisnya tanpa menafsirkannya secara berlebihan.
theological_decisions:
- issue: Makna ganda Yohanes dalam ὑψόω
  choice: Memakai “meninggikan/ditinggikan” pada kedua kemunculan.
  alternative: “mengangkat/diangkat” atau “memuliakan/dimuliakan”
  rationale: Pilihan ini menjaga hubungan dengan pengangkatan ular secara nyata dan sekaligus membuka kemungkinan makna pemuliaan bagi Anak Manusia, tanpa membatasi ungkapan itu hanya pada penyaliban atau hanya pada pemuliaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “sama seperti ... demikian pula” mempertahankan kesejajaran retoris ayat, sedangkan “ditinggikan” menjaga ambiguitas teologis yang disengaja.
