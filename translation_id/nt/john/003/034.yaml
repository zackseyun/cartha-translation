  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: id
  text: Sebab Dia yang diutus Allah menyampaikan perkataan Allah, sebab Allah memberikan Roh tanpa batas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Dia yang diutus Allah itu memberikan Roh tanpa batas.” Bahasa Yunani tidak menyebutkan secara eksplisit siapa yang memberikan Roh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: orang yang
  rationale: Pronomina relatif akusatif maskulin tunggal ini menunjuk kepada pribadi yang diutus Allah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya substantivalnya.
- source_word: ἀπέστειλεν
  choice: diutus
  rationale: Bentuk aoris menunjuk pada tindakan pengutusan; konstruksi pasif Indonesia menghasilkan ungkapan yang alami tanpa mengubah Allah sebagai pelaku.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: perkataan-perkataan Allah
  rationale: Bentuk jamak ῥήματα menunjuk pada perkataan atau ujaran. Pengulangan kata mempertahankan bentuk jamak dan genitif sumber/milik secara jelas.
- source_word: λαλεῖ
  choice: menyampaikan
  rationale: Dalam konteks utusan yang membawa perkataan Allah, 'menyampaikan' mengungkap tindakan berbicara secara alami sekaligus tidak menambahkan isi di luar teks.
- source_word: ἐκ μέτρου
  choice: tanpa batas
  rationale: Dengan negasi, idiom ini menyatakan pemberian yang tidak ditakar atau dibatasi. 'Tanpa batas' alami bagi pembaca Indonesia dan mempertahankan gagasan ketiadaan batas takaran.
- source_word: δίδωσιν
  choice: memberikan
  rationale: Bentuk present indikatif diterjemahkan secara langsung sebagai pernyataan kini atau umum.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks Yohanes, rujukan yang paling wajar ialah Roh Allah. Huruf kapital menandai rujukan tersebut menurut kebiasaan bahasa Indonesia, meskipun aksara Yunani tidak membedakannya.
theological_decisions:
- issue: Subjek tersirat dari δίδωσιν ('memberikan')
  choice: 'Kata ganti ''Dia'' dalam teks utama dipahami sebagai Allah: Allah memberikan Roh tanpa batas.'
  alternative: Orang yang diutus Allah, yaitu Sang Anak, memberikan Roh tanpa batas.
  rationale: Allah adalah subjek eksplisit terdekat dalam rangkaian klausa, dan alurnya mendukung Allah sebagai pemberi Roh kepada Dia yang diutus sehingga utusan itu menyampaikan perkataan Allah. Namun, bahasa Yunani tidak menyebut subjek δίδωσιν secara eksplisit, sehingga kemungkinan bahwa Sang Anak adalah pemberinya tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Dia' memakai huruf kapital karena dalam pembacaan utama merujuk kepada Allah; catatan kaki mempertahankan ambiguitas subjek dalam bahasa Yunani.
