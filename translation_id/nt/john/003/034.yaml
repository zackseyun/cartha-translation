revisions:
- from: Sebab orang yang diutus Allah menyampaikan perkataan-perkataan Allah, karena Dia memberikan Roh tanpa batas.[a]
  to: Sebab Dia yang diutus Allah menyampaikan perkataan Allah, sebab Allah memberikan Roh tanpa batas.[a]
  rationale: Revisi ini memperjelas bahwa teks utama mengikuti pembacaan Allah sebagai subjek "memberikan," sebagaimana alur klausa dan audit bahasa Inggris, tanpa meniadakan pembacaan alternatif bahwa pribadi yang diutus itulah pemberinya. "Perkataan Allah" adalah bentuk kolektif yang lebih alami dalam bahasa Indonesia dan tetap setia pada bentuk jamak Yunani.
