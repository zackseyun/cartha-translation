id: JHN.3.2
reference: John 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: id
  text: Orang ini datang kepada Yesus pada malam hari[a] dan berkata kepada-Nya, “Rabi, kami tahu bahwa Engkau telah datang dari Allah sebagai pengajar. Sebab, tidak seorang pun dapat melakukan tanda-tanda[b] yang Engkau lakukan itu jika Allah tidak menyertai dia[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pada waktu malam.” Dalam Injil Yohanes, malam atau kegelapan juga dapat memiliki gema simbolis.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tanda-tanda ajaib.” Kata Yunani σημεῖα diterjemahkan “tanda-tanda” untuk mempertahankan fungsinya sebagai perbuatan yang menunjuk melampaui dirinya sendiri.
    reason: lexical_alternative
  - marker: c
    text: 'Teks Yunani mempertahankan orang ketiga: “jika Allah tidak menyertai dia.” Jadi, bagian akhir pernyataan Nikodemus tidak beralih kembali kepada “Engkau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Orang ini
  rationale: Merujuk kembali kepada Nikodemus yang baru diperkenalkan pada ayat sebelumnya dan mempertahankan daya tunjuk bentuk Yunani tanpa menjadi kaku dalam bahasa Indonesia.
- source_word: νυκτός
  choice: pada malam hari
  rationale: Ungkapan waktu ini alami dalam bahasa Indonesia dan tetap membuka kemungkinan adanya gema tematis tentang malam atau kegelapan dalam Injil Yohanes.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Gelar sapaan Yahudi ini dipertahankan dalam bentuk serapan untuk menjaga latar historis dan pemakaian khasnya dalam Injil Yohanes.
- source_word: οἴδαμεν
  choice: kami tahu
  rationale: Bentuk orang pertama jamak dipertahankan; teks tidak menjelaskan secara pasti kelompok yang diwakili Nikodemus.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: Engkau telah datang dari Allah
  rationale: Menyampaikan asal dan relevansi kini dari bentuk perfektum tanpa menambahkan gagasan ‘diutus’ yang tidak dinyatakan oleh verba ini.
- source_word: διδάσκαλος
  choice: sebagai pengajar
  rationale: Mengungkapkan peran predikatif secara alami dalam bahasa Indonesia tanpa mengubahnya menjadi gelar tambahan.
- source_word: ταῦτα τὰ σημεῖα
  choice: tanda-tanda
  rationale: Mempertahankan istilah penting dalam Injil Yohanes bagi perbuatan yang menunjuk melampaui dirinya sendiri, tanpa menghilangkan sifat ajaibnya.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: melakukan tanda-tanda yang Engkau lakukan itu
  rationale: Mempertahankan pengulangan verba ποιέω dan penekanan pada tanda-tanda tertentu yang dilakukan Yesus.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: jika Allah tidak menyertainya
  rationale: Merender syarat secara alami dan tetap mempertahankan peralihan teks Yunani dari sapaan orang kedua kepada rujukan orang ketiga.
theological_decisions:
- issue: Makna σημεῖα dalam konteks Yohanes
  choice: tanda-tanda
  alternative: mukjizat-mukjizat
  rationale: ‘Tanda-tanda’ mempertahankan fungsi teologis perbuatan itu sebagai penunjuk kepada identitas dan karya Yesus, sedangkan ‘mukjizat’ saja lebih menonjolkan keajaibannya.
- issue: Peralihan dari orang kedua ke orang ketiga dalam ucapan Nikodemus
  choice: mempertahankan ‘jika Allah tidak menyertainya’
  alternative: jika Allah tidak menyertai Engkau
  rationale: Bahasa Yunani beralih dari sapaan langsung ‘Engkau’ kepada orang ketiga. Peralihan ini dipertahankan agar tekstur dan kemungkinan nuansa formal ucapannya tidak dihapus.
- issue: Apakah ἀπὸ θεοῦ ἐλήλυθας menyatakan pengutusan resmi
  choice: Engkau telah datang dari Allah
  alternative: Engkau telah diutus oleh Allah
  rationale: Frasa ini secara langsung menyatakan asal dari Allah, bukan memakai verba ‘mengutus’; terjemahan tidak menambahkan klaim yang lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. Sapaan kepada Yesus memakai kapitalisasi konvensional Indonesia. Pengulangan ‘melakukan’ sengaja dipertahankan untuk mencerminkan teks Yunani, sementara ‘pada malam hari’ dipilih sebagai ungkapan yang alami.
