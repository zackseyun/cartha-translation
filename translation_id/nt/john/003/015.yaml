  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: id
  text: supaya setiap orang yang percaya kepada-Nya memiliki hidup yang kekal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “siapa saja yang percaya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Yunani berbunyi “percaya di dalam Dia” (ἐν αὐτῷ), bukan memakai preposisi yang berarti “ke dalam.” Dalam bahasa Indonesia, “percaya kepada-Nya” lebih alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan atau hasil yang berkaitan dengan pernyataan sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: πᾶς ὁ πιστεύων
  choice: setiap orang yang percaya
  rationale: Partisipel kini berartikel ini berfungsi sebagai nomina dan bersifat umum serta inklusif. Ungkapan ini jelas, alami, dan tidak memaksakan aspek progresif.
- source_word: πιστεύων
  choice: percaya
  rationale: Padanan yang baku dan transparan bagi πιστεύω dalam konteks Yohanes; tidak menambahkan nuansa yang lebih khusus seperti sekadar menyetujui atau mempercayakan diri.
- source_word: ἐν αὐτῷ
  choice: kepada-Nya
  rationale: Dalam bahasa Indonesia, verba 'percaya' ketika menunjuk pribadi secara idiomatis memakai 'kepada'. Ini mengungkapkan relasi kepercayaan yang dimaksud tanpa memakai bentuk tidak alami 'percaya di dalam-Nya'; catatan kaki mencatat bentuk harfiah preposisi Yunani.
- source_word: ἔχῃ
  choice: memperoleh
  rationale: Dalam klausa tujuan sesudah ἵνα, 'memperoleh' menyampaikan hasil yang dimaksud secara alami. Modalitas tidak perlu dinyatakan dengan 'dapat', yang dalam bahasa Indonesia dapat menyiratkan sekadar kemampuan atau kemungkinan.
- source_word: ζωὴν αἰώνιον
  choice: hidup yang kekal
  rationale: Padanan Indonesia yang mapan dan akurat, yang dapat mencakup baik keberlangsungan tanpa akhir maupun kualitas eskatologis hidup tersebut.
theological_decisions:
- issue: Ungkapan percaya dengan ἐν αὐτῷ
  choice: percaya kepada-Nya
  alternative: percaya di dalam-Nya
  rationale: Teks Yunani memakai ἐν, bukan εἰς, tetapi padanan harfiah 'di dalam-Nya' tidak alami setelah verba 'percaya' dalam bahasa Indonesia. 'Kepada-Nya' mempertahankan sasaran personal dari kepercayaan, sementara catatan kaki menjaga transparansi bentuk sumber tanpa mengubahnya menjadi klaim doktrinal.
- issue: Cakupan πᾶς ὁ πιστεύων
  choice: setiap orang yang percaya
  alternative: siapa saja yang percaya
  rationale: Frasa ini bersifat umum dan inklusif. 'Setiap orang' mempertahankan unsur distributif πᾶς dan konstruksi partisipial tunggal tanpa membatasi berdasarkan gender.
- issue: Nuansa ἔχῃ dalam klausa ἵνα
  choice: memperoleh hidup yang kekal
  alternative: dapat memiliki hidup yang kekal
  rationale: Subjungtif Yunani dituntut oleh klausa tujuan dan tidak dengan sendirinya menyatakan ketidakpastian. Terjemahan tanpa 'dapat' menghindari kesan bahwa ayat ini hanya berbicara tentang kemampuan atau kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Kedua penanda catatan kaki dicantumkan dalam teks utama.
