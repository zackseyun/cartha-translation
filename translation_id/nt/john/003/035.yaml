  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: id
  text: Bapa mengasihi Anak dan telah menyerahkan segala sesuatu ke dalam tangan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam tangan-Nya.” Ungkapan Yunani ini menyatakan bahwa segala sesuatu dipercayakan kepada kuasa atau penguasaan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Bapa
  rationale: Dalam konteks Yohanes, kata ini merupakan sebutan ilahi yang menunjuk kepada Allah dalam hubungan-Nya dengan Anak; bentuk “Bapa” alami dan mapan dalam bahasa Indonesia.
- source_word: ἀγαπᾷ
  choice: mengasihi
  rationale: Bentuk kini menyatakan kenyataan yang sedang dan terus berlaku; “mengasihi” menyampaikannya secara alami serta mempertahankan nuansa relasional yang kuat.
- source_word: τὸν υἱόν
  choice: Anak
  rationale: Dalam konteks ini, kata tersebut menunjuk secara khusus kepada Yesus dalam hubungan-Nya dengan Bapa, sehingga digunakan sebagai sebutan personal.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak netral mencakup semuanya secara menyeluruh; “segala sesuatu” jelas dan tidak mempersempit cakupannya.
- source_word: δέδωκεν
  choice: telah menyerahkan
  rationale: Bentuk perfektum menunjukkan tindakan yang sudah terlaksana dengan hasil yang tetap berlaku. “Telah menyerahkan” juga cocok dengan idiom tangan yang menyatakan pemberian kepercayaan, kuasa, atau penguasaan.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: ke dalam tangan-Nya
  rationale: Secara harfiah berarti “di dalam tangan-Nya,” tetapi bersama verba memberi/menyerahkan, ungkapan ini secara idiomatis menyatakan bahwa segala sesuatu dipercayakan ke dalam kuasa atau penguasaan Anak. Terjemahan utama mempertahankan citra tangan.
theological_decisions:
- issue: Hubungan Bapa dan Anak
  choice: Mempertahankan sebutan personal “Bapa” dan “Anak”.
  alternative: Menerjemahkannya sebagai hubungan ayah dan anak secara umum.
  rationale: Konteks Injil Yohanes menunjuk secara khusus kepada Allah sebagai Bapa dan Yesus sebagai Anak, tanpa perlu menambahkan rumusan doktrinal yang tidak dinyatakan dalam ayat.
- issue: Cakupan dan keberlangsungan pemberian kepada Anak
  choice: “telah menyerahkan segala sesuatu”
  alternative: “menyerahkan semuanya” atau “memberikan segala sesuatu”
  rationale: Pilihan ini menjaga cakupan πάντα dan hasil berkelanjutan dari perfektum δέδωκεν, sekaligus membiarkan ungkapan tangan menyiratkan kepercayaan, kuasa, atau penguasaan tanpa membatasinya pada satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Bapa,” “Anak,” dan enklitik “-Nya” menandai rujukan personal ilahi menurut konteks, bukan menambahkan penjelasan teologis. Citra tangan dipertahankan agar idiom sumber tetap terasa, dengan keterangan singkat dalam catatan kaki.
