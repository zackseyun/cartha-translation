review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan unsur-unsur utama teks Yunani, termasuk pengulangan πάλιν dan ketidakpastian nuansa emosional ἐμβριμώμενος. Namun, “pergi” kurang langsung untuk ἔρχεται, yang secara harfiah berarti “datang,” dan “terpasang pada pintunya” menambahkan konsep pintu serta memberi kesan batu dipasang secara mekanis. Teks sumber hanya menyatakan bahwa makam itu sebuah gua dan sebuah batu berada menutupinya/di depannya.
  naturalness: Susunan “Yesus, yang sekali lagi sangat terguncang dalam diri-Nya” dapat dipahami, tetapi klausa relatifnya agak berat. “Yesus, yang sekali lagi sangat tergugah dalam diri-Nya, datang ...” lebih lancar sebagai narasi Indonesia baku. “Menutup pintu masuknya” merupakan pengungkapan yang alami bagi batu pada makam gua, tanpa menyatakan cara batu itu ditempatkan.
  terminology: “Makam,” “gua,” dan “batu” sudah tepat. “Sangat tergugah dalam diri-Nya” menyampaikan gejolak batin yang kuat tanpa memutuskan apakah emosi itu kesedihan, kegelisahan, atau kegeraman. Catatan kaki tetap diperlukan untuk kemungkinan nuansa kegeraman atau kegelisahan.
  issues:
  - severity: medium
    issue: “pergi ke makam itu” untuk ἔρχεται
    rationale: ἔρχεται berarti “datang” (historical present yang wajar diterjemahkan bentuk lampau). Walaupun arah gerak menuju makam memungkinkan “pergi,” “datang” lebih dekat dengan verba sumber dan tidak perlu mengubah sudut pandang naratif.
  - severity: medium
    issue: “sebuah batu terpasang pada pintunya”
    rationale: Frasa ini menambahkan “pintu” dan “terpasang,” padahal teks menyebut gua serta batu yang terletak terhadapnya. Batu itu secara konteks menutup akses masuk, tetapi tidak digambarkan sebagai benda yang dipasang pada sebuah pintu.
  - severity: low
    issue: “sangat terguncang dalam diri-Nya”
    rationale: Ungkapan ini dapat terdengar seperti Yesus terguncang oleh suatu kejadian. “Sangat tergugah dalam diri-Nya” lebih idiomatis untuk gejolak batin, sambil tetap tidak mempersempit valensi ἐμβριμώμενος.
  revised_text: Lalu Yesus, yang sekali lagi sangat tergugah dalam diri-Nya[a], datang ke makam itu. Makam itu berupa sebuah gua, dan sebuah batu menutup pintu masuknya.
