  rationale: Revisi memakai “Lalu” untuk fungsi penghubung οὖν dalam alur narasi, “datang” untuk ἔρχεται, dan “sangat tergugah dalam diri-Nya” untuk mempertahankan intensitas serta ambiguitas ἐμβριμώμενος. Ungkapan tentang batu diubah agar menyampaikan fungsinya pada akses masuk makam gua tanpa menyiratkan adanya pintu fisik atau mekanisme pemasangan.
