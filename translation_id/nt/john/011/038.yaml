  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: id
  text: Lalu Yesus, yang sekali lagi sangat tergugah dalam diri-Nya[a], datang ke makam itu. Makam itu berupa sebuah gua, dan sebuah batu menutup pintu masuknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merasa geram dalam diri-Nya” atau “sangat gelisah dalam diri-Nya”; kata Yunani yang dipakai sangat kuat dan mungkin menunjukkan lebih daripada kesedihan saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: karena itu
  rationale: Menandai hubungan naratif sekaligus inferensial dengan kejadian sebelumnya; bentuk ini mempertahankan daya penghubung tanpa terasa kaku.
- source_word: πάλιν
  choice: sekali lagi
  rationale: Menunjukkan terulangnya gejolak emosi Yesus yang telah disebut sebelumnya.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: sangat terguncang dalam diri-Nya
  rationale: Mengungkapkan gejolak batin yang kuat tanpa membatasi nuansanya hanya pada kesedihan atau hanya pada kemarahan; kemungkinan makna yang lebih spesifik dicatat dalam catatan kaki.
- source_word: ἔρχεται
  choice: pergi
  rationale: Present historis Yunani dialihkan secara alami ke bentuk naratif Indonesia; dalam konteks ini geraknya menuju makam, sehingga 'pergi ke' lebih wajar daripada 'datang ke'.
- source_word: μνημεῖον
  choice: makam
  rationale: Merujuk pada tempat penguburan yang kemudian dijelaskan berupa gua, bukan sekadar kuburan tanah.
- source_word: σπήλαιον
  choice: gua
  rationale: Padanan langsung dan lazim dalam bahasa Indonesia modern.
- source_word: λίθος
  choice: batu
  rationale: Padanan umum bagi batu penutup makam.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: terpasang pada pintunya
  rationale: Menggambarkan batu yang berada menutupi bukaan makam gua. 'Pintu' dipakai secara metonimis untuk bukaan makam, sedangkan 'terpasang' tidak menentukan apakah batu itu disandarkan atau digulingkan.
theological_decisions:
- issue: Kekuatan emosi ἐμβριμώμενος pada diri Yesus
  choice: Yesus digambarkan mengalami gejolak batin yang sangat kuat, tanpa menetapkan satu jenis emosi dalam teks utama.
  alternative: Yesus merasa geram dalam diri-Nya; atau Yesus sangat gelisah dalam diri-Nya.
  rationale: Kata kerja Yunani ini sangat kuat dan dapat mengandung nuansa kemarahan atau kegeraman, tetapi konteks tidak mengharuskan penerjemah membatasi maknanya pada emosi tersebut. Teks utama mempertahankan ketegangan itu, dan alternatifnya diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang alami dan bermartabat. Intensitas emosi dipertahankan, sementara ambiguitas jenis emosinya tidak dihilangkan.
