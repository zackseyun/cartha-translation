  naturalness: Pasangan “Namun ... Tetapi” untuk δέ dan ἀλλά terasa berlebihan dan kurang luwes dalam bahasa Indonesia modern. Menghilangkan penghubung pertama mempertahankan alur tanpa mengurangi kontras utama yang ditandai ἀλλά.
  terminology: “Mengutus” dengan penekanan “Engkaulah” secara baik mempertahankan tema pengutusan dan penekanan pada σύ. Kapitalisasi pronomina konsisten dengan register Alkitab Indonesia yang dipilih.
