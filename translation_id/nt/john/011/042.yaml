  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: id
  text: Aku tahu bahwa Engkau selalu mendengar Aku. Tetapi Aku mengatakan ini karena orang banyak yang berdiri di sekeliling, supaya mereka percaya bahwa Engkaulah yang mengutus Aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδειν
  choice: Aku tahu
  rationale: Bentuk dari οἶδα ini berfungsi sebagai bentuk lampau, tetapi dalam bahasa Indonesia keadaan mengetahui secara alami dinyatakan dengan “Aku tahu”; konteks sudah menunjukkan bahwa pengetahuan itu mendahului ucapan ini.
- source_word: πάντοτέ μου ἀκούεις
  choice: Engkau selalu mendengarkan Aku
  rationale: ἀκούω dengan genitif dapat berarti mendengar atau mendengarkan. Dalam konteks doa, “mendengarkan Aku” menyampaikan penerimaan yang dimaksud tanpa menambahkan gagasan bahwa permintaan tertentu pasti dikabulkan.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: Tetapi ... demi orang banyak
  rationale: ἀλλά menandai kontras, sedangkan διά dengan akusatif menyatakan alasan atau kepentingan. “Demi orang banyak” alami dalam bahasa Indonesia dan cocok dengan klausa tujuan yang mengikutinya.
- source_word: τὸν περιεστῶτα
  choice: yang berdiri di sekeliling-Ku
  rationale: Partisipel perfektum ini menggambarkan orang banyak yang berada sambil berdiri mengelilingi Yesus. Unsur “-Ku” tersirat oleh pusat situasi dan membuat ungkapan Indonesia jelas serta alami.
- source_word: εἶπον
  choice: Aku mengatakan ini
  rationale: Aoristus λέγω berarti “mengatakan.” Kata “ini” menjelaskan secara minimal bahwa yang dirujuk ialah ucapan doa yang baru disampaikan.
- source_word: ἵνα πιστεύσωσιν
  choice: supaya mereka percaya
  rationale: ἵνα dengan subjungtif menyatakan tujuan; “supaya” mempertahankan daya purposifnya secara alami.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: bahwa Engkaulah yang mengutus Aku
  rationale: Pronomina eksplisit σύ mendapat penekanan. Bentuk “Engkaulah” mempertahankan penekanan itu, sedangkan “mengutus” menyampaikan tema pengutusan dalam Injil Yohanes.
theological_decisions:
- issue: Arti pernyataan bahwa Bapa selalu mendengarkan Yesus
  choice: Teks menyatakan bahwa Bapa selalu mendengarkan Yesus dan bahwa Yesus mengucapkan doa itu di depan umum demi orang banyak.
  alternative: Pernyataan ini dapat dipahami terutama sebagai prinsip umum tentang doa yang dijawab.
  rationale: Terjemahan mempertahankan konteks langsung doa Yesus dan kedekatan relasi yang tersirat, tanpa memasukkan rumusan doktrinal di luar teks.
- issue: Tujuan ucapan doa di depan umum
  choice: Ucapan itu bertujuan agar orang banyak percaya bahwa Bapalah yang mengutus Yesus.
  alternative: Tujuannya dapat dipersempit hanya sebagai pengesahan mukjizat tertentu ini.
  rationale: Klausa ἵνα secara eksplisit memusatkan tujuan pada kepercayaan bahwa Bapa mengutus Yesus; terjemahan tidak mempersempit atau memperluas pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Bapa dan Yesus mengikuti kelaziman gaya Alkitab Indonesia. Pengulangan kontras “Namun ... Tetapi” mencerminkan δέ dan ἀλλά, meski dapat terasa sedikit formal; susunan ini menjaga hubungan wacana sumber.
