  to: Aku tahu bahwa Engkau selalu mendengar Aku. Tetapi Aku mengatakan ini karena orang banyak yang berdiri di sekeliling, supaya mereka percaya bahwa Engkaulah yang mengutus Aku.
  rationale: Revisi menghilangkan kontras ganda yang tidak perlu, memakai “mendengar” sebagai padanan paling langsung untuk ἀκούω, dan tidak menambahkan “-Ku” yang tidak terdapat secara eksplisit dalam teks sumber. “Tetapi,” “karena,” “supaya,” serta “Engkaulah yang mengutus Aku” tetap menyampaikan kontras, alasan, tujuan, dan penekanan pronomina Yunani.
