  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: id
  text: Maka orang-orang Yahudi[a] yang bersama-sama dengan Maria di dalam rumah dan menghiburnya, ketika melihat bahwa Maria segera berdiri dan keluar, mengikutinya dengan menyangka bahwa ia pergi ke makam untuk menangis di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea”. Dalam Injil Yohanes, istilah Yunani ini kadang-kadang dapat secara lebih khusus menunjuk kepada orang-orang dari Yudea atau para pemimpin di Yudea, tetapi di sini istilah itu menunjuk kepada kelompok yang berkabung bersama Maria.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Karena itu, orang-orang Yahudi
  rationale: οὖν menandai kelanjutan narasi dan diterjemahkan secara alami sebagai “Karena itu”. Dalam konteks ini Ἰουδαῖοι menunjuk kepada para pelayat Yahudi yang bersama Maria; kemungkinan arti geografis “orang-orang Yudea” dipertahankan dalam catatan kaki.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: yang berada bersama Maria di dalam rumah
  rationale: Frasa partisipial ini membatasi kelompok yang dimaksud. Nama “Maria” digunakan untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: παραμυθούμενοι αὐτήν
  choice: sedang menghiburnya
  rationale: παραμυθέομαι berarti memberi penghiburan atau menghibur, sesuai dengan suasana perkabungan.
- source_word: ἰδόντες
  choice: melihat bahwa
  rationale: Partisip aoris ini menyatakan keadaan yang memicu tindakan berikutnya; bentuk klausa menghasilkan bahasa Indonesia yang lancar.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: cepat-cepat berdiri lalu keluar
  rationale: ἀνίστημι di sini berarti bangkit dari posisi duduk, bukan kebangkitan dari kematian. “Berdiri” menghindari kesan teologis yang tidak dimaksudkan, sedangkan “lalu” menyampaikan urutan tindakan.
- source_word: ἠκολούθησαν αὐτῇ
  choice: Mereka pun mengikutinya
  rationale: ἀκολουθέω di sini menyatakan tindakan mengikuti secara fisik, tanpa harus mengandung nuansa pemuridan.
- source_word: δόξαντες
  choice: karena menyangka
  rationale: Partisip ini menyatakan dugaan yang menjadi alasan mereka mengikuti Maria.
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: ia pergi ke makam
  rationale: ὑπάγει menyatakan gerak pergi, sedangkan μνημεῖον dalam konteks pemakaman Lazarus paling tepat diterjemahkan “makam”.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: untuk menangis di sana
  rationale: ἵνα dengan subjungtif menyatakan tujuan; konstruksi “untuk” menyampaikannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna Ἰουδαῖοι dalam narasi Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea
  rationale: Pemakaian Ἰουδαῖοι dalam Yohanes bergantung pada konteks. Di sini frasa tersebut menunjuk kepada kelompok pelayat yang berada bersama Maria, bukan kepada seluruh orang Yahudi ataupun secara khusus para pemimpin. Terjemahan langsung dipakai dalam teks, sementara kemungkinan nuansa geografis dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, tanpa mengubah urutan atau hubungan logis antartindakan.
