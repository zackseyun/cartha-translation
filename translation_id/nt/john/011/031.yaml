revisions:
- from: Karena itu, orang-orang Yahudi[a] yang berada bersama Maria di dalam rumah dan sedang menghiburnya melihat bahwa Maria cepat-cepat berdiri lalu keluar. Mereka pun mengikutinya karena menyangka bahwa ia pergi ke makam untuk menangis di sana.
  to: Maka orang-orang Yahudi[a] yang bersama-sama dengan Maria di dalam rumah dan menghiburnya, ketika melihat bahwa Maria segera berdiri dan keluar, mengikutinya dengan menyangka bahwa ia pergi ke makam untuk menangis di sana.
  rationale: Revisi ini mempertahankan seluruh unsur dan urutan tindakan dalam teks Yunani, menggunakan penghubung naratif yang lebih netral, dan mengungkapkan δόξαντες sebagai dugaan yang menyertai tindakan mereka. Catatan kaki tetap mempertahankan alternatif leksikal tanpa memaksakan cakupan geografis atau sosial tertentu.
