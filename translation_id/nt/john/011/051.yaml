  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: id
  text: Ia tidak mengatakan hal itu bukan dari dirinya sendiri[a], melainkan sebagai imam besar pada tahun itu, ia bernubuat bahwa Yesus akan mati bagi bangsa itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas prakarsanya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “demi bangsa itu” atau “untuk kepentingan bangsa itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: hal itu. Namun
  rationale: δέ menandai peralihan atau pertentangan ringan. Dalam bahasa Indonesia, pemisahan kalimat dan “Namun” menghasilkan alur yang alami tanpa memberi unsur waktu yang tidak ada dalam bahasa Yunani.
- source_word: ἀφ’ ἑαυτοῦ
  choice: dari dirinya sendiri
  rationale: Ungkapan ini mempertahankan gagasan sumber atau asal perkataan tersebut, tanpa menentukan apakah Kayafas sadar akan makna kenabiannya.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: Namun, karena ia adalah imam besar pada tahun itu
  rationale: Partisip ὢν dapat membawa nuansa latar sekaligus sebab. “Karena” membuat hubungan yang dimaksud penulis jelas dan wajar dalam bahasa Indonesia, tanpa menyatakan persetujuan moral terhadap Kayafas.
- source_word: ἐπροφήτευσεν
  choice: ia bernubuat
  rationale: Padanan ini mempertahankan pernyataan eksplisit bahwa perkataan Kayafas memiliki sifat kenabian.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: akan mati
  rationale: μέλλω dengan infinitif di sini menunjuk kepada peristiwa mendatang yang sudah akan terjadi. “Akan mati” alami dan tidak terlalu menekankan kedekatan waktunya ataupun gagasan takdir.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: bagi bangsa itu
  rationale: “Bagi” mempertahankan cakupan benefaktif atau representatif ὑπέρ tanpa mempersempitnya menjadi rumusan penebusan tertentu; “bangsa itu” merujuk kepada bangsa Yahudi dalam konteks.
theological_decisions:
- issue: Sifat kenabian perkataan Kayafas
  choice: Teks menyatakan bahwa Kayafas bernubuat dalam kedudukannya sebagai imam besar, tanpa menjelaskan tingkat kesadaran atau keadaan moralnya.
  alternative: Menganggap Kayafas dengan sadar menyampaikan nubuat ilahi, atau menganggap pernyataan ini hanya ironi dan bukan nubuat yang nyata.
  rationale: Kata ἐπροφήτευσεν secara langsung berarti “bernubuat”; terjemahan tidak boleh menghapus kekuatan itu ataupun menambahkan teori inspirasi yang tidak dinyatakan ayat ini.
- issue: Makna ὑπέρ dalam kematian Yesus
  choice: Diterjemahkan “bagi bangsa itu,” sehingga nuansa manfaat dan perwakilan tetap terbuka.
  alternative: “Atas nama bangsa itu” atau “sebagai pengganti bangsa itu.”
  rationale: ὑπέρ dapat memiliki bobot representatif dan dalam konteks kematian dapat mengandung implikasi lebih lanjut, tetapi ayat ini sendiri tidak mengharuskan terjemahan Indonesia yang secara teknis menetapkan satu teori penebusan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “ia” menjaga kelancaran narasi; “imam besar” dan “bernubuat” mempertahankan istilah Alkitab yang sudah luas dipahami. Tanda baca memecah struktur Yunani yang panjang agar mudah dibaca tanpa mengubah hubungan logisnya.
