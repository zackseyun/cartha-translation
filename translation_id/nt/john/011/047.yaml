  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: id
  text: Karena itu, imam-imam kepala dan orang-orang Farisi mengadakan sidang[a] dan berkata, “Apa yang sedang kita lakukan? Sebab orang ini melakukan banyak tanda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sanhedrin”, yaitu dewan penguasa Yahudi.
    reason: Menjelaskan kemungkinan rujukan kelembagaan dari συνέδριον tanpa menjadikannya lebih spesifik daripada teks Yunani dalam teks utama.
lexical_decisions:
- source_word: συνήγαγον
  choice: mengadakan sidang
  rationale: Bentuk aoris aktif ini menyatakan bahwa mereka menghimpunkan dewan untuk bersidang. Ungkapan ini lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah “mengumpulkan dewan”.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai akibat naratif dan logis dari peristiwa sebelumnya tanpa menjadikannya kesimpulan yang terlalu formal.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Merujuk kepada para pemimpin kalangan imam, bukan kepada beberapa orang yang semuanya sedang menjabat sebagai imam besar.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok Yahudi tersebut.
- source_word: συνέδριον
  choice: dewan
  rationale: Menerjemahkan istilah Yunani secara umum dan tidak langsung menggantinya dengan nama teknis “Sanhedrin”; kemungkinan rujukan kelembagaannya dijelaskan dalam catatan kaki.
- source_word: ἔλεγον
  choice: berkata
  rationale: Imperfek Yunani menggambarkan percakapan yang berlangsung, tetapi bentuk sederhana “berkata” paling alami dalam narasi Indonesia dan tidak memaksakan arti berulang.
- source_word: Τί ποιοῦμεν
  choice: Apa yang sedang kita lakukan?
  rationale: Mempertahankan bentuk indikatif kini dan nada gusar atau sadar akan ketidakberesan, tanpa mengubahnya secara diam-diam menjadi pertanyaan eksplisit tentang kewajiban.
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pertanyaan mereka secara jelas dan alami dalam ujaran langsung.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: orang ini
  rationale: Alami dalam bahasa Indonesia dan mempertahankan nada berjarak para pembicara ketika merujuk kepada Yesus.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: melakukan banyak tanda
  rationale: Mempertahankan kala kini serta istilah penting dalam Injil Yohanes, “tanda”, tanpa mempersempitnya menjadi sekadar mukjizat.
theological_decisions:
- issue: Makna σημεῖα dalam Injil Yohanes
  choice: tanda
  alternative: mukjizat; tanda ajaib
  rationale: Dalam Injil Yohanes, karya-karya Yesus bukan hanya perbuatan ajaib, tetapi juga tindakan yang menunjuk kepada identitas-Nya. “Tanda” mempertahankan bobot teologis itu tanpa menambahkan tafsiran.
- issue: Identitas συνέδριον
  choice: dewan dalam teks utama, dengan kemungkinan identifikasi sebagai Sanhedrin dalam catatan kaki
  alternative: Sanhedrin; Mahkamah Agama
  rationale: Istilah Yunani dapat menunjuk kepada dewan atau persidangan, dan dalam konteks ini sangat mungkin merujuk kepada dewan penguasa Yahudi di Yerusalem. Terjemahan utama mempertahankan keluasan istilah, sedangkan catatan memberi identifikasi historis.
- issue: Nuansa Τί ποιοῦμεν
  choice: Apa yang sedang kita lakukan?
  alternative: Apa yang harus kita lakukan?
  rationale: Bentuk Yunani adalah indikatif kini, walaupun dalam konteksnya dapat berfungsi sebagai pertanyaan pertimbangan. Pilihan utama mempertahankan ketegangan antara arti harfiah dan maksud deliberatif.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Mengadakan sidang dewan” dipilih agar konstruksi alami bagi pembaca umum; “tanda” dipertahankan sebagai istilah khas Yohanes. Penanda catatan kaki [a] ditempatkan langsung sesudah kata yang dijelaskannya.
