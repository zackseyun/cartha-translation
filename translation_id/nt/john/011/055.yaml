id: JHN.11.55
reference: John 11:55
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: id
  text: Paskah orang Yahudi sudah dekat,[a] dan banyak orang pergi ke Yerusalem dari daerah pedesaan sebelum Paskah untuk menyucikan diri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Paskah Yahudi.” Secara lebih harfiah, teks Yunani berbunyi “Paskah orang Yahudi,” ungkapan yang berulang dalam Injil Yohanes.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, menjalani penyucian ritual sebagai persiapan untuk Paskah.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: sudah dekat
  rationale: δέ merupakan penghubung ringan yang tidak perlu selalu dinyatakan tersendiri dalam bahasa Indonesia; ἐγγύς menyatakan kedekatan waktu. Kata "sudah" menghasilkan alur naratif yang alami tanpa menambahkan kata waktu seperti "sekarang".
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: Paskah orang Yahudi
  rationale: Mempertahankan bentuk genitif dan ungkapan khas yang berulang dalam Injil Yohanes, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα
  choice: banyak orang pergi ke Yerusalem
  rationale: Secara harfiah ἀνέβησαν berarti "naik/pergi naik", sesuai perjalanan ziarah ke Yerusalem. Namun, "pergi ke Yerusalem" lebih alami dalam bahasa Indonesia dan tidak mengaburkan tujuan perjalanan; nuansa elevasi bukan fokus utama ayat ini.
- source_word: ἐκ τῆς χώρας
  choice: dari daerah pedesaan
  rationale: χώρα di sini menunjuk wilayah luar kota atau pedalaman, dibedakan dari Yerusalem. "Daerah pedesaan" menyampaikan kontras tersebut dengan jelas.
- source_word: πρὸ τοῦ πάσχα
  choice: sebelum Paskah
  rationale: Padanan temporal yang langsung, jelas, dan alami.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: untuk menyucikan diri
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan. "Menyucikan diri" mempertahankan makna pemurnian ritual tanpa memasukkan penjelasan doktrinal ke dalam teks utama.
theological_decisions:
- issue: Sifat penyucian sebelum Paskah
  choice: menyucikan diri
  alternative: membersihkan diri secara ritual
  rationale: Konteks menunjuk persiapan ritual Yahudi menjelang Paskah. Teks utama mempertahankan ungkapan ringkas sumber tanpa mengalihkannya menjadi kategori moral, sakramental, atau doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Istilah "Paskah" dipertahankan sebagai sebutan lazim. Penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkannya.
