  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: id
  text: Maka, ketika Yesus melihat Maria menangis dan orang-orang Yahudi[a] yang datang bersamanya menangis, Ia sangat tergugah[b] dalam roh-Nya dan menjadi gelisah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea.” Di sini istilah itu menunjuk kepada para pelayat Yahudi yang datang bersama Maria, bukan kepada seluruh orang Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya juga dapat berarti “menjadi geram” atau “sangat tergerak”; kata itu mengungkapkan gejolak batin yang kuat.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan fungsi penghubung yang menandai kelanjutan atau simpulan naratif dari adegan sebelumnya.
- source_word: ὡς εἶδεν
  choice: ketika ... melihat
  rationale: ὡς dengan aoris di sini berfungsi secara temporal; ungkapan ini alami dalam bahasa Indonesia.
- source_word: αὐτήν
  choice: Maria
  rationale: Pronomina feminin merujuk kepada Maria dalam konteks sebelumnya; penyebutan nama menghindari bentuk Indonesia yang canggung atau ambigu.
- source_word: κλαίουσαν / κλαίοντας
  choice: menangis
  rationale: κλαίω menunjukkan tangisan yang tampak atau terdengar; 'menangis' wajar dan tidak memaksakan nuansa ratapan ritual.
- source_word: συνελθόντας αὐτῇ
  choice: yang datang bersamanya
  rationale: Menyampaikan bahwa mereka datang bersama atau menyertai Maria tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: Ἰουδαίους
  choice: orang-orang Yahudi
  rationale: Padanan leksikal langsung; dalam konteks ini acuannya dibatasi pada para pelayat Yahudi yang bersama Maria, yang dijelaskan dalam catatan kaki.
- source_word: ἐνεβριμήσατο
  choice: sangat tergugah
  rationale: Kata ini menyatakan gejolak batin yang kuat dan dapat mengandung nuansa geram atau marah. Pilihan ini menjaga intensitas tanpa menetapkan jenis emosi secara sempit.
- source_word: τῷ πνεύματι
  choice: dalam roh-Nya
  rationale: Mempertahankan datif ranah dan bahasa antropologis teks tanpa menggantinya dengan tafsiran seperti 'dalam batin-Nya'.
- source_word: ἐτάραξεν ἑαυτόν
  choice: mengguncangkan diri-Nya sendiri
  rationale: Bentuk aktif-refleksif Yunani dipertahankan, bukan diratakan menjadi keadaan pasif 'menjadi gelisah'; 'mengguncangkan' menyampaikan gangguan batin yang kuat.
theological_decisions:
- issue: Sifat emosi Yesus dalam ἐνεβριμήσατο
  choice: Ia sangat tergugah
  alternative: Ia menjadi geram / sangat bergejolak
  rationale: Teks menyatakan emosi kuat tetapi tidak menyebut objek atau penyebabnya. Terjemahan utama tidak memutuskan apakah emosi itu terutama kesedihan, kejengkelan, atau kemarahan; nuansa yang lebih tajam dicatat.
- issue: Refleksivitas ἐτάραξεν ἑαυτόν
  choice: mengguncangkan diri-Nya sendiri
  alternative: Ia menjadi gelisah / hati-Nya terguncang
  rationale: Bentuk Yunani secara eksplisit aktif dan refleksif. Pilihan utama mempertahankan ketegangan itu tanpa menjelaskan secara doktrinal bagaimana Yesus menggerakkan atau membiarkan diri-Nya mengalami gejolak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'menangis' dipertahankan untuk mencerminkan pengulangan κλαίω. Ungkapan 'mengguncangkan diri-Nya sendiri' sengaja agak bertanda karena mempertahankan konstruksi aktif-refleksif sumber.
