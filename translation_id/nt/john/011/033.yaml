revisions:
- from: Karena itu, ketika Yesus melihat Maria menangis dan orang-orang Yahudi[a] yang datang bersamanya juga menangis, Ia sangat tergugah[b] dalam roh-Nya dan mengguncangkan diri-Nya sendiri.
  to: Maka, ketika Yesus melihat Maria menangis dan orang-orang Yahudi[a] yang datang bersamanya menangis, Ia sangat tergugah[b] dalam roh-Nya dan menjadi gelisah.
  rationale: 'Revisi mengganti ungkapan refleksif yang secara harfiah tetapi tidak idiomatis dengan padanan Indonesia yang menyatakan gangguan batin dalam konteksnya. Nuansa sengaja tidak dipersempit: teks utama mempertahankan gejolak kuat, sementara catatan kaki mencatat kemungkinan nuansa geram. Penanda dan isi catatan kaki tetap selaras dengan kata-kata yang dijelaskannya.'
