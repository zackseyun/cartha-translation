review_pass:
  verdict: revise
  source_fidelity: Terjemahan dengan tepat menyampaikan urutan naratif, rujukan Maria, pengulangan κλαίω, kelompok Ἰουδαίους yang hadir bersama Maria, serta gejolak kuat pada ἐνεβριμήσατο. Namun, “mengguncangkan diri-Nya sendiri” menyarankan tindakan fisik atau tindakan sengaja mengguncang diri, yang bukan makna idiomatis ἐτάραξεν ἑαυτόν dalam konteks ini. “Menjadi gelisah” menyampaikan keadaan terguncang/terusik tanpa menambahkan gambaran fisik.
  naturalness: “Mengguncangkan diri-Nya sendiri” tidak alami dalam bahasa Indonesia modern dan dapat membingungkan. “Menjadi gelisah” adalah padanan baku dan jelas untuk gangguan batin tersebut. “Maka” juga lebih lancar sebagai penghubung naratif daripada “Karena itu,” di awal ayat, sambil tetap mewakili οὖν.
  terminology: “Roh-Nya” mempertahankan πνεύμα tanpa menafsirkannya sebagai sekadar perasaan batin. “Sangat tergugah” cukup menandai emosi kuat tanpa memilih secara tegas antara geram, marah, dan ketergerakan mendalam. Catatan untuk Ἰουδαίους dan ἐνεβριμήσατο dipertahankan serta diperjelas.
  issues:
  - severity: medium
    issue: Padanan ἐτάραξεν ἑαυτόν berbunyi “mengguncangkan diri-Nya sendiri.”
    rationale: Ungkapan ini dalam bahasa Indonesia lazimnya berarti mengguncang tubuh sendiri secara fisik dan dapat mengisyaratkan tindakan volisional. Dalam Yunani, konstruksi aktif-refleksif ini berfungsi idiomatis untuk menyatakan bahwa Yesus menjadi terguncang atau gelisah.
  - severity: low
    issue: Catatan b memakai “sangat bergejolak” sebagai alternatif verba.
    rationale: Alternatif itu kurang langsung sebagai padanan bagi verba sumber. “Sangat tergerak” lebih idiomatis dan tetap tidak menetapkan objek emosi Yesus.
  revised_text: Maka, ketika Yesus melihat Maria menangis dan orang-orang Yahudi[a] yang datang bersamanya menangis, Ia sangat tergugah[b] dalam roh-Nya dan menjadi gelisah.
  revised_footnotes:
  - marker: a
    text: Atau “orang-orang Yudea.” Di sini istilah itu menunjuk kepada para pelayat Yahudi yang datang bersama Maria, bukan kepada seluruh orang Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya juga dapat berarti “menjadi geram” atau “sangat tergerak”; kata itu mengungkapkan gejolak batin yang kuat.
    reason: alternative_reading
  revision_rationale: 'Revisi mengganti ungkapan refleksif yang secara harfiah tetapi tidak idiomatis dengan padanan Indonesia yang menyatakan gangguan batin dalam konteksnya. Nuansa sengaja tidak dipersempit: teks utama mempertahankan gejolak kuat, sementara catatan kaki mencatat kemungkinan nuansa geram. Penanda dan isi catatan kaki tetap selaras dengan kata-kata yang dijelaskannya.'
