  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: id
  text: Jika kita membiarkan Dia terus seperti ini, semua orang akan percaya kepada-Nya. Lalu orang-orang Romawi akan datang dan mengambil tempat kita[a] serta bangsa kita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah kita”. Kata Yunani yang diterjemahkan “tempat” dapat menunjuk secara khusus pada Bait Allah, tetapi juga dapat berarti wilayah atau kedudukan mereka.
    reason: alternative_reading
  - marker: b
    text: Atau “rakyat kita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: membiarkan Dia terus seperti ini
  rationale: ἀφίημι digunakan dalam arti permisif, yakni ‘membiarkan’, sedangkan οὕτως menunjuk pada tindakan atau keadaan yang sedang berlangsung. Ungkapan ini menyampaikan maksud tersebut secara wajar tanpa menentukan secara lebih khusus tindakan Yesus yang dimaksud.
- source_word: πάντες
  choice: semua orang
  rationale: Bentuk jamak ini bersifat umum dan paling alami disampaikan sebagai ‘semua orang’ dalam bahasa Indonesia.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: akan percaya kepada-Nya
  rationale: Konstruksi khas Yohanes πιστεύω εἰς dengan objek menyatakan percaya kepada atau menaruh iman kepada seseorang. ‘Percaya kepada-Nya’ merupakan padanan Indonesia yang alami dan mapan.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: orang-orang Romawi akan datang
  rationale: Menerjemahkan secara langsung verba futurum ἔρχομαι dan subjek eksplisit οἱ Ῥωμαῖοι.
- source_word: ἀροῦσιν
  choice: merenggut
  rationale: αἴρω di sini berarti mengambil atau menyingkirkan. ‘Merenggut’ cocok dengan ancaman tindakan penguasa asing dan tetap tidak sekuat penafsiran eksplisit ‘menghancurkan’.
- source_word: τόπον
  choice: tempat
  rationale: τόπος secara dasar berarti ‘tempat’. Dalam konteks ini mungkin menunjuk pada Bait Allah, wilayah, atau kedudukan para pemimpin, sehingga ‘tempat’ mempertahankan keluasan makna teks Yunani.
- source_word: ἔθνος
  choice: bangsa
  rationale: ἔθνος dapat berarti bangsa atau suatu kelompok masyarakat. ‘Bangsa’ sesuai dengan kekhawatiran politis dalam konteks ini, sementara kemungkinan ‘rakyat’ dicatat dalam catatan kaki.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: tempat kita serta bangsa kita
  rationale: Genitif ἡμῶν berkaitan dengan kedua objek. Pengulangan ‘kita’ membuat hubungan itu jelas dan alami dalam bahasa Indonesia, sedangkan ‘serta’ menyampaikan pasangan kedua unsur tersebut.
theological_decisions:
- issue: Rujukan ‘tempat kita’ (τόπον)
  choice: Mempertahankan kata ‘tempat’ dalam teks utama
  alternative: Bait Allah; wilayah; kedudukan atau status kelembagaan para pemimpin
  rationale: Konteks memungkinkan kekhawatiran terhadap Bait Allah dan/atau kedudukan para pemimpin, tetapi kata Yunani sendiri tidak menentukan salah satunya. Terjemahan utama karena itu mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi pronomina yang mengacu kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar jelas dan alami tanpa mengubah hubungan logisnya.
