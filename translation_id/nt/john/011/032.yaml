id: JHN.11.32
reference: John 11:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: id
  text: Maka, ketika Maria sampai di tempat Yesus berada dan melihat Dia, ia tersungkur di kaki-Nya serta berkata kepada-Nya, “Tuhan,[a] sekiranya Engkau ada di sini, saudaraku tidak akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat menjadi sapaan hormat. Di sini diterjemahkan “Tuhan” sesuai dengan pemakaian κύριος dalam Injil Yohanes dan penggambaran Yesus di dalamnya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ketika
  rationale: Dalam bahasa Indonesia, daya penghubung naratif οὖν dapat tersirat secara alami dalam klausa waktu; menambahkan “maka” akan terasa kaku dan kurang diperlukan di sini.
- source_word: ὡς ἦλθεν
  choice: ketika ... sampai
  rationale: ὡς dengan verba aoris memperkenalkan keadaan waktu. “Ketika ... sampai” menyampaikan kedatangan Maria secara idiomatis.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: di tempat Yesus berada
  rationale: Mempertahankan makna lokatif klausa Yunani dengan susunan Indonesia yang jelas.
- source_word: ἰδοῦσα αὐτόν
  choice: dan melihat Dia
  rationale: Partisip aoris ini menyatakan tindakan yang berkaitan erat dengan kedatangan Maria; verba finit dengan “dan” terasa alami dan menjaga urutan tindakan.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: tersungkurlah ia di kaki-Nya
  rationale: Ungkapan ini menggambarkan Maria menjatuhkan diri di hadapan Yesus. “Tersungkur di kaki-Nya” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: λέγουσα αὐτῷ
  choice: serta berkata kepada-Nya
  rationale: Partisip kini memperkenalkan ucapan langsung. “Serta berkata kepada-Nya” menghubungkannya secara alami dengan tindakan sebelumnya.
- source_word: Κύριε
  choice: Tuhan
  rationale: “Tuhan” mempertahankan bobot κύριε dalam narasi Yohanes, sambil mengakui melalui catatan kaki bahwa bentuk sapaan ini juga dapat bersifat hormat.
- source_word: εἰ ἦς ὧδε
  choice: sekiranya Engkau ada di sini
  rationale: Konstruksi ini menyatakan kondisi lampau yang berlawanan dengan kenyataan. Dalam bahasa Indonesia, “sekiranya ... ada” mengungkapkan andaian tersebut secara alami tanpa harus menandai kala secara morfologis.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: tidak akan mati
  rationale: Partikel ἄν bersama aoris menyatakan akibat lampau yang tidak terjadi. Konteks dan klausa “sekiranya” membuat nilai kontrafaktualnya jelas dalam bahasa Indonesia.
- source_word: μου ὁ ἀδελφός
  choice: saudaraku
  rationale: Genitif μου bersifat posesif; bentuk enklitik “-ku” menghasilkan ungkapan Indonesia yang ringkas dan alami. Kata Yunani ἀδελφός di sini merujuk kepada Lazarus, saudara laki-laki Maria, tetapi “saudaraku” cukup jelas dari konteks.
theological_decisions:
- issue: Sapaan κύριε kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mengikuti bobot naratif dan teologis penggunaan κύριος dalam Injil Yohanes, tetapi catatan kaki mempertahankan kemungkinan bahwa sapaan itu pada tingkat leksikal dapat berarti sapaan hormat “Tuan”.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai sebagai konvensi penerbitan Indonesia, tanpa dimaksudkan untuk menghapus ambiguitas sapaan κύριε; ambiguitas itu dipertahankan dalam catatan kaki.
