  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: id
  text: Setelah mengatakan hal itu, Marta pergi lalu memanggil Maria, saudara perempuannya, secara diam-diam.[a] Ia berkata, “Guru ada di sini dan memanggilmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara pribadi,” tanpa terdengar oleh orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Setelah mengatakan hal itu
  rationale: Partisip aoris dipahami secara temporal dan menunjukkan bahwa tindakan berikutnya berlangsung sesudah perkataan Marta sebelumnya.
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Padanan yang wajar dan langsung untuk tindakan meninggalkan tempat dalam alur narasi.
- source_word: ἐφώνησεν Μαριὰμ
  choice: memanggil Maria
  rationale: Dalam konteks ini φωνέω berarti memanggil seseorang agar datang, bukan sekadar berseru kepadanya.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: saudaranya
  rationale: Frasa aposisional ini mengidentifikasi Maria sebagai saudara perempuan Marta; konteks membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: λάθρᾳ
  choice: secara diam-diam
  rationale: Menunjukkan bahwa panggilan itu disampaikan tanpa didengar atau diketahui orang banyak, tanpa menambahkan alasan atau motif yang tidak dinyatakan teks.
- source_word: Ὁ διδάσκαλος
  choice: Guru
  rationale: Mempertahankan arti leksikal διδάσκαλος sebagai gelar hormat bagi Yesus tanpa memperluasnya menjadi gelar dengan nuansa kekuasaan yang tidak tersurat.
- source_word: πάρεστιν
  choice: ada di sini
  rationale: Mengungkapkan kehadiran di tempat itu secara alami dalam percakapan bahasa Indonesia.
- source_word: φωνεῖ σε
  choice: memanggilmu
  rationale: Bentuk kini Yunani menyatakan panggilan yang berlaku pada saat itu. Bahasa Indonesia tidak wajib menandai aspek, sehingga 'memanggilmu' secara alami mempertahankan kemungkinan 'memanggil' atau 'sedang memanggil'.
theological_decisions:
- issue: Gelar διδάσκαλος bagi Yesus
  choice: Guru
  alternative: Tuan
  rationale: '''Guru'' mengikuti arti biasa kata Yunani dan mempertahankan penghormatan dalam narasi tanpa memasukkan nuansa kristologis atau kekuasaan tambahan.'
- issue: Nuansa λάθρᾳ
  choice: secara diam-diam
  alternative: secara pribadi
  rationale: Pilihan ini menyampaikan bahwa perkataan itu tidak disampaikan di hadapan orang lain. Catatan kaki mempertahankan alternatif yang lebih netral tanpa menetapkan motif kerahasiaan.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Nama 'Marta' dinyatakan sebagai subjek agar rujukan pronomina jelas dalam bahasa Indonesia, berdasarkan konteks ayat sebelumnya. 'Lalu' menjaga urutan tindakan secara alami; kalimat langsung dibuat sebagai kalimat baru untuk kelancaran.
