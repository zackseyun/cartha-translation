  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: id
  text: Yesus berkata kepadanya, “Bukankah sudah Kukatakan kepadamu bahwa jika engkau percaya, engkau akan melihat kemuliaan Allah?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Kata
  rationale: Bentuk kini historis Yunani dialihkan dengan bentuk naratif Indonesia yang alami, tanpa mengubah fungsi peristiwanya.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Datif ini menunjuk kepada Marta dalam konteks; ‘kepadanya’ mempertahankan rujukan tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: Οὐκ εἶπόν σοι
  choice: Bukankah sudah Kukatakan kepadamu
  rationale: Pertanyaan retoris ini mengharapkan jawaban yang membenarkan. ‘Sudah Kukatakan’ terdengar alami dalam bahasa Indonesia dan menegaskan perkataan terdahulu tanpa memperluas maknanya.
- source_word: ἐὰν πιστεύσῃς
  choice: jika engkau percaya
  rationale: Terjemahan ini mempertahankan bentuk syarat dan kaitan leksikal πιστεύω yang penting dalam Injil Yohanes. ‘Engkau’ sesuai untuk sapaan tunggal langsung dalam register Alkitab yang tetap mudah dipahami.
- source_word: ὄψῃ
  choice: engkau akan melihat
  rationale: Bentuk futurum ὁράω diterjemahkan langsung dengan ‘akan melihat’.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: kemuliaan Allah
  rationale: ‘Kemuliaan’ adalah padanan baku dan luas bagi δόξα, sedangkan ‘Allah’ merupakan padanan alami bagi θεός dalam bahasa Indonesia; konstruksi ini mempertahankan hubungan genitif tanpa menafsirkannya lebih jauh.
theological_decisions:
- issue: Hubungan antara percaya dan melihat kemuliaan Allah
  choice: Mempertahankan pernyataan sebagai janji bersyarat yang ditujukan langsung kepada Marta.
  alternative: Menafsirkannya secara eksplisit sebagai prinsip umum tentang iman dan mukjizat, atau membatasinya melalui penjelasan tambahan hanya pada kebangkitan Lazarus.
  rationale: Teks menyatakan syarat dan hasilnya secara langsung, tetapi tidak menguraikan cakupan doktrinalnya. Terjemahan tidak menambahkan penafsiran yang menyelesaikan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk ‘Kata Yesus’ mengikuti gaya naratif Indonesia; ‘engkau’ mempertahankan sapaan tunggal dan nuansa khidmat tanpa menjadi kuno. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia.
