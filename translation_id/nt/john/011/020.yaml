  source_fidelity: Draf dengan baik menerjemahkan klausa temporal, tindakan Marta yang pergi menemui Yesus, serta keadaan Maria yang sedang duduk. Namun, οὖν, yang menandai kelanjutan atau simpulan naratif, tidak terwakili; kata “Ketika” hanya menerjemahkan ὡς. “Maka” memulihkan fungsi penghubung itu secara wajar. Kontras δέ lebih dekat dengan “tetapi” daripada “namun,” walaupun keduanya mungkin.
  naturalness: “Maka, ketika Marta mendengar bahwa Yesus sedang datang, ia pergi menemui-Nya; tetapi Maria sedang duduk di rumah” adalah bahasa Indonesia baku, jelas, dan mengalir. “Di rumah” cukup untuk ἐν τῷ οἴκῳ; “di dalam rumah” juga benar, tetapi sedikit lebih berat tanpa menambah ketepatan penting.
  terminology: Nama Marta, Maria, dan Yesus sudah sesuai pemakaian Alkitab Indonesia. Pronomina “-Nya” untuk Yesus konsisten dengan register Alkitab Indonesia. Catatan kaki perlu diperbaiki karena istilah “bentuk kini yang hidup” tidak diperlukan dan kurang tepat untuk sekadar menjelaskan bentuk kini dalam klausa laporan.
