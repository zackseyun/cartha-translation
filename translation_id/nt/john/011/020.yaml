  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: id
  text: Maka, ketika Marta mendengar bahwa Yesus sedang datang[a], ia pergi menemui-Nya; tetapi Maria sedang duduk di rumah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus datang.” Dalam klausa laporan, kata kerja Yunani berbentuk kini dan dapat diterjemahkan lebih harfiah sebagai “datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ketika
  rationale: Daya penghubung naratif οὖν diserap secara alami ke dalam pembukaan kalimat temporal; menambahkan 'maka' akan terasa berlebih dalam bahasa Indonesia.
- source_word: ὡς
  choice: ketika
  rationale: Memperkenalkan klausa temporal tanpa mempertegas kesegeraan seperti 'begitu' atau 'segera setelah'.
- source_word: ἤκουσεν
  choice: mendengar
  rationale: Padanan langsung bagi ἀκούω dan tidak menambahkan nuansa 'mengetahui' atau 'mendapat kabar'.
- source_word: ἔρχεται
  choice: sedang datang
  rationale: Menjaga aspek tindakan yang sedang berlangsung dari bentuk kini Yunani dan tetap wajar dalam narasi lampau bahasa Indonesia.
- source_word: ὑπήντησεν αὐτῷ
  choice: ia pergi menemui-Nya
  rationale: Menjaga nuansa gerak untuk menyongsong atau menemui seseorang, tanpa menambahkan kata 'keluar' yang tidak dinyatakan.
- source_word: δὲ
  choice: Namun
  rationale: Menyampaikan pertentangan ringan antara tindakan Marta dan keadaan Maria.
- source_word: ἐν τῷ οἴκῳ
  choice: di dalam rumah
  rationale: Padanan konkret dan alami yang mempertahankan acuan pada rumah.
- source_word: ἐκαθέζετο
  choice: sedang duduk
  rationale: Mencerminkan keadaan yang berlangsung dalam bentuk imperfek tanpa menambahkan gagasan bahwa Maria sengaja tetap duduk.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Marta / Maria / Yesus
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
