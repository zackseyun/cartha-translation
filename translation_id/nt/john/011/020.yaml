  - severity: low
    issue: Penjelasan catatan kaki tentang “bentuk kini yang hidup” kurang tepat dan berpotensi membingungkan.
    rationale: ἔρχεται adalah bentuk kini dalam klausa laporan. Catatan sebaiknya menyatakan fakta itu secara netral, tanpa melabelinya sebagai bentuk kini yang hidup.
