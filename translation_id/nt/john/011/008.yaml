    reason: alternative_reading
  revision_rationale: Revisi hanya menghapus “sekarang,” yang tidak perlu setelah “baru saja.” Selebihnya dipertahankan karena terjemahan tersebut setia pada teks sumber, alami dalam bahasa Indonesia modern, dan catatan kaki telah menangani ambiguitas rujukan οἱ Ἰουδαῖοι.
