id: JHN.11.8
reference: John 11:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: id
  text: Murid-murid berkata kepada-Nya[a], “Rabi, baru saja orang-orang Yahudi berusaha melempari Engkau dengan batu, dan Engkau hendak pergi ke sana lagi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea” atau, sesuai konteks, “para pemimpin Yahudi.” Dalam Injil Yohanes, sebutan “orang-orang Yahudi” sering merujuk kepada para penentang Yesus di Yudea, bukan kepada seluruh bangsa Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: berkata
  rationale: Bentuk kini historis Yunani dialihkan ke bentuk naratif Indonesia yang alami; bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mempertahankan gelar sapaan Semitik yang ditransliterasikan dalam teks Yunani dan sesuai dengan gaya Yohanes.
- source_word: νῦν
  choice: baru saja
  rationale: Dalam konteks ini menunjuk pada ancaman yang masih sangat baru, bukan sekadar waktu kini.
- source_word: ἐζήτουν
  choice: berusaha
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang diupayakan pada masa lampau; pilihan ini alami dalam bahasa Indonesia tanpa menyatakan bahwa upaya itu berhasil.
- source_word: λιθάσαι
  choice: melempari Engkau dengan batu
  rationale: Mengungkapkan tindakan merajam secara jelas dan alami, tanpa menambahkan 'sampai mati' yang tidak dinyatakan eksplisit.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ini padanan leksikal langsung; kemungkinan rujukan yang lebih sempit dalam konteks Yohanes dipertahankan dalam catatan kaki.
- source_word: πάλιν
  choice: lagi
  rationale: Padanan adverbial langsung dan alami.
- source_word: ὑπάγεις
  choice: Engkau hendak pergi
  rationale: Bentuk kini dalam pertanyaan menyatakan tindakan yang akan atau sedang diniatkan; 'hendak pergi' terdengar alami dan sesuai konteks.
- source_word: ἐκεῖ
  choice: ke sana
  rationale: Adverbia tempat yang merujuk kembali kepada Yudea, tempat bahaya tersebut.
theological_decisions:
- issue: Rujukan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea; para pemimpin Yahudi
  rationale: Teks utama mempertahankan arti leksikal yang paling langsung dan tidak menambahkan pembatas 'pemimpin' yang tidak eksplisit. Catatan kaki menjaga kemungkinan bahwa dalam konteks ini istilah tersebut merujuk secara lebih sempit kepada para penentang Yesus di Yudea, bukan kepada seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Engkau' dipakai untuk menjaga bentuk langsung yang hormat; 'Rabi' dipertahankan sebagai gelar. Susunan pertanyaan dibuat alami tanpa menghilangkan nada keberatan dan keheranan para murid.
