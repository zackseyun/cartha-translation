- from: Murid-murid berkata kepada-Nya[a], “Rabi, baru saja orang-orang Yahudi berusaha melempari Engkau dengan batu, dan sekarang Engkau hendak pergi ke sana lagi?”
  to: Murid-murid berkata kepada-Nya[a], “Rabi, baru saja orang-orang Yahudi berusaha melempari Engkau dengan batu, dan Engkau hendak pergi ke sana lagi?”
  rationale: Revisi hanya menghapus “sekarang,” yang tidak perlu setelah “baru saja.” Selebihnya dipertahankan karena terjemahan tersebut setia pada teks sumber, alami dalam bahasa Indonesia modern, dan catatan kaki telah menangani ambiguitas rujukan οἱ Ἰουδαῖοι.
