  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Saudara laki-lakimu akan bangkit kembali.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saudara laki-lakimu akan bangkit.” Kata kerja Yunani dapat diterjemahkan hanya dengan “bangkit”; kata “kembali” memperjelas bahwa yang dimaksud ialah bangkit dari kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini historis Yunani menyajikan tuturan secara hidup. Dalam narasi bahasa Indonesia, “berkata” terdengar alami tanpa harus menandai waktu lampau secara khusus.
- source_word: αὐτῇ
  choice: kepadanya
  rationale: Pronomina datif dinyatakan secara idiomatis sebagai penerima perkataan.
- source_word: Ἀναστήσεται
  choice: akan bangkit kembali
  rationale: Bentuk futur ini dalam konteks kematian Lazarus menunjuk pada bangkit dari kematian. “Bangkit kembali” menyampaikan makna kebangkitan secara alami tanpa mengubahnya menjadi bentuk pasif yang lebih menonjolkan pelaku ilahi.
- source_word: ὁ ἀδελφός σου
  choice: saudaramu
  rationale: Ungkapan posesif ini diterjemahkan secara ringkas dan alami; dalam konteks, yang dimaksud ialah saudara laki-laki Marta, yaitu Lazarus.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri ditransliterasikan menurut bentuk baku bahasa Indonesia; artikelnya tidak perlu dinyatakan.
theological_decisions:
- issue: Ungkapan kebangkitan
  choice: akan bangkit kembali
  alternative: akan bangkit; akan dibangkitkan
  rationale: Terjemahan ini mempertahankan kepastian tentang kebangkitan saudara Marta tanpa menentukan dalam ayat ini apakah yang dimaksud pemulihan segera atau kebangkitan pada akhir zaman. Bentuk aktif juga lebih dekat dengan nuansa bentuk Yunani daripada “akan dibangkitkan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan kalimat mengikuti dialog alami; “saudaramu” dipertahankan sebagai bentuk ringkas yang mudah dipahami.
