id: JHN.11.44
reference: John 11:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: id
  text: Orang yang telah mati itu keluar; kaki dan tangannya masih terikat dengan kain-kain pembungkus, dan wajahnya terbalut dengan sehelai kain. Yesus berkata kepada mereka, “Lepaskan ikatannya dan biarkan dia pergi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: orang yang telah mati itu
  rationale: Partisipel perfekt menyatakan orang yang telah mengalami kematian dan berada dalam keadaan mati; bentuk ini juga mempertahankan penunjukan yang substantival tanpa sekadar menggantinya dengan nama Lazarus.
- source_word: κειρίαις
  choice: kain-kain pembungkus
  rationale: Istilah ini menunjuk pada potongan atau pita kain yang dipakai membungkus jenazah; pilihan ini lebih jelas bagi pembaca modern daripada istilah teknis yang asing.
- source_word: ἡ ὄψις
  choice: wajahnya
  rationale: Dalam konteks kain yang menutupi kepala jenazah, kata ini secara alami merujuk pada wajah atau tampak muka.
- source_word: σουδαρίῳ
  choice: sehelai kain
  rationale: Kata ini merujuk pada kain kecil atau kain muka; frasa ini mempertahankan makna umum tanpa menyamakannya dengan jenis kain modern tertentu.
- source_word: Λύσατε αὐτόν
  choice: Lepaskan ikatannya
  rationale: Secara idiomatis menyampaikan perintah untuk membebaskan Lazarus dari kain-kain yang mengikatnya, bukan melepaskan dirinya dari pegangan seseorang.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: biarkan dia pergi
  rationale: Mempertahankan konstruksi permisif dan ketaktertentuan arah atau tujuan dari ὑπάγειν.
theological_decisions:
- issue: Kala kini historis pada λέγει
  choice: Yesus berkata
  alternative: Yesus mengatakan
  rationale: Bahasa Indonesia naratif lazim memakai bentuk lampau yang dipahami dari konteks; ini tidak mengurangi daya hidup kala kini historis Yunani dan menghindari kesan bahwa ucapan berlangsung pada masa pembaca.
- issue: Identitas orang yang keluar
  choice: orang yang telah mati itu
  alternative: Lazarus
  rationale: Mengikuti ungkapan eksplisit teks Yunani dan menonjolkan kenyataan kematian yang telah dibalikkan, tanpa memasukkan nama yang tidak disebut dalam ayat ini.
- issue: Makna perintah penutup
  choice: biarkan dia pergi
  alternative: biarkan dia berjalan
  rationale: ὑπάγειν dapat berarti pergi atau berjalan meninggalkan tempat; 'pergi' mempertahankan keluasan maknanya tanpa menentukan bahwa tekanan utama terletak pada kemampuan fisik berjalan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Susunan klausa dibuat alami tanpa menghilangkan gambaran konkret kain pembungkus jenazah. Tidak ada catatan kaki karena tidak ada ambiguitas atau varian yang perlu dijelaskan bagi teks utama.
