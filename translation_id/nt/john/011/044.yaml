  source_fidelity: 'Teks Indonesia mengikuti struktur dan isi SBLGNT dengan baik: orang yang telah mati itu keluar; kaki dan tangan terikat kain pembungkus; wajah terbalut kain; lalu Yesus memerintahkan mereka untuk melepaskannya dan membiarkannya pergi. Frasa “masih terikat” secara wajar menyatakan keadaan resultatif dari δεδεμένος tanpa menambah peristiwa baru. “Biarkan dia pergi” mempertahankan keluasan ὑπάγειν.'
