  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: id
  text: Kalian juga tidak mempertimbangkan bahwa lebih baik bagi kalian jika satu orang mati untuk rakyat[a] daripada seluruh bangsa binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi rakyat”; frasa ini juga dapat mengandung arti “sebagai pengganti rakyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: Kalian juga tidak mempertimbangkan
  rationale: Gabungan ini meneruskan teguran sebelumnya. Bentuk “juga tidak” wajar dalam bahasa Indonesia, sedangkan “mempertimbangkan” menyampaikan gagasan memperhitungkan atau menalar dalam musyawarah.
- source_word: συμφέρει ὑμῖν
  choice: lebih baik bagi kalian
  rationale: Ungkapan ini menyatakan keuntungan pragmatis bagi para pendengar; “bagi kalian” mempertahankan datif keuntungan dan kepentingan diri yang tersirat.
- source_word: ἵνα
  choice: jika
  rationale: Dalam konstruksi Indonesia “lebih baik ... jika,” kata ini secara alami memperkenalkan keadaan yang dinilai lebih menguntungkan tanpa menambahkan tujuan yang tidak harus dinyatakan secara eksplisit.
- source_word: εἷς ἄνθρωπος
  choice: satu orang
  rationale: “Satu orang” mempertahankan tekanan pada satu individu. Bahasa Indonesia tidak menandai gender secara wajib, dan konteks sudah menunjuk kepada seorang laki-laki.
- source_word: ἀποθάνῃ
  choice: mati
  rationale: Bentuk ini menyampaikan tindakan dalam klausa yang diperkenalkan oleh ἵνα; “mati” alami dan tidak melebihkan unsur modal.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: untuk rakyat
  rationale: “Untuk” mempertahankan rentang makna ὑπέρ, baik demi kepentingan maupun dengan kemungkinan nuansa mewakili atau menggantikan. “Rakyat” sesuai dengan λαός sebagai komunitas bangsa dalam konteks politik ini.
- source_word: καὶ μὴ
  choice: daripada
  rationale: 'Dalam perbandingan Indonesia yang diawali “lebih baik,” “daripada” mengungkapkan kontras yang dimaksud secara alami: kematian satu orang dibandingkan dengan kebinasaan seluruh bangsa.'
- source_word: ὅλον τὸ ἔθνος
  choice: seluruh bangsa
  rationale: ἔθνος di sini menunjuk bangsa sebagai keseluruhan politik-etnis, bukan bangsa-bangsa bukan Yahudi.
- source_word: ἀπόληται
  choice: binasa
  rationale: “Binasa” mempertahankan bobot kehancuran atau keruntuhan tanpa menentukan cara terjadinya.
theological_decisions:
- issue: Makna ὑπέρ sehubungan dengan kematian Yesus
  choice: Diterjemahkan secara luas sebagai “untuk rakyat” dalam teks utama
  alternative: “demi rakyat” atau “sebagai pengganti rakyat”
  rationale: Kayafas sedang menyatakan perhitungan politik, tetapi narator kemudian memahami ucapannya sebagai nubuat yang tidak disadarinya (11:51). Terjemahan luas mempertahankan baik makna politik langsung maupun kemungkinan gaung perwakilan dan penggantian tanpa menetapkan salah satunya dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai teguran langsung kepada para anggota dewan. Susunan komparatif “lebih baik ... daripada ...” dipilih agar alami, jelas, dan tetap bermartabat.
