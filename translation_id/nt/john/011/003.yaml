  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: id
  text: 'Maka, kedua saudari itu mengirim pesan kepada-Nya: “Tuhan, lihatlah, orang yang Engkau kasihi sedang sakit.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan naratif dengan keadaan yang telah dijelaskan sebelumnya; lebih jelas daripada sekadar 'maka' tanpa menambahkan sebab baru.
- source_word: αἱ ἀδελφαί
  choice: kedua saudari itu
  rationale: Konteks langsung mengidentifikasi Maria dan Marta sebagai dua saudari; 'itu' menandai bahwa mereka sudah disebut.
- source_word: ἀπέστειλαν ... πρὸς αὐτόν λέγουσαι
  choice: mengirim pesan kepada-Nya
  rationale: Ungkapan idiomatis Yunani berarti menyampaikan kabar melalui utusan; bahasa Indonesia alami tidak perlu mempertahankan bentuk harfiah 'mengutus ... sambil berkata'.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan hormat yang dalam konteks Yohanes juga dapat membawa bobot kristologis; 'Tuhan' mempertahankan kedua kemungkinan itu.
- source_word: ἴδε
  choice: lihatlah
  rationale: Mempertahankan seruan langsung untuk menarik perhatian, tanpa mengubahnya menjadi penjelasan seperti 'ketahuilah'.
- source_word: ὃν φιλεῖς
  choice: orang yang Engkau kasihi
  rationale: Menerjemahkan relasi secara alami sambil mempertahankan verba φιλέω sebagai kasih pribadi tanpa memaksakan pembedaan teologis dari ἀγαπάω.
- source_word: ἀσθενεῖ
  choice: sedang sakit
  rationale: Bentuk kini menunjukkan keadaan Lazarus saat pesan disampaikan; 'sedang sakit' alami dan tepat.
theological_decisions:
- issue: Makna κύριε sebagai sapaan
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam Injil Yohanes sapaan ini dapat sekaligus berfungsi sebagai penghormatan dan pengakuan yang lebih penuh. 'Tuhan' mempertahankan ketegangan itu tanpa membatasinya pada kesopanan sosial.
- issue: Kemungkinan pembedaan φιλέω dan ἀγαπάω
  choice: kasihi
  alternative: sayangi
  rationale: Ayat ini tidak perlu diberi pembedaan doktrinal berdasarkan verba kasih. 'Kasihi' bermartabat dan mempertahankan kesinambungan makna tanpa menghapus nuansa kedekatan pribadi.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat dibuat ringkas sebagai penyampaian pesan mendesak.
