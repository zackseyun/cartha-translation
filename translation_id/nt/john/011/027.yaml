  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: id
  text: Marta berkata kepada-Nya, “Ya, Tuhan. Aku telah percaya bahwa Engkaulah Mesias[a], Anak Allah, yaitu Dia yang datang ke dalam dunia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός adalah gelar yang berarti “Yang Diurapi” dan sepadan dengan “Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Marta berkata kepada-Nya
  rationale: Bentuk Yunani memakai kala kini historis, tetapi bentuk lampau lebih alami dalam narasi bahasa Indonesia. Nama Marta dijelaskan dari konteks sebagai subjek tersirat.
- source_word: Ναί, κύριε
  choice: Ya, Tuhan
  rationale: “Ya” menyampaikan jawaban tegas secara langsung, sedangkan “Tuhan” mempertahankan bobot sapaan κύριε dalam konteks pengakuan iman ini.
- source_word: ἐγὼ πεπίστευκα
  choice: Aku telah percaya
  rationale: Bentuk perfektum menunjukkan keyakinan yang telah terbentuk dan tetap berlaku; “telah percaya” mempertahankan nuansa tersebut tanpa parafrasa berlebihan.
- source_word: ὅτι σὺ εἶ
  choice: bahwa Engkaulah
  rationale: ὅτι memperkenalkan isi kepercayaan, dan bentuk “Engkaulah” secara alami memberi tekanan pada σὺ serta menyatakan identitas yang ditegaskan.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga “Mesias” mempertahankan makna gelar bagi Raja yang diurapi, bukan memperlakukannya sebagai nama diri.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Terjemahan ini mempertahankan bentuk gelar kristologis yang tertentu dan bobot pengakuannya.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: Dia yang datang ke dalam dunia
  rationale: Frasa ini mempertahankan fungsi substantival partisipel kini dan gema sebutan bagi tokoh yang dinantikan, tanpa menambahkan penanda waktu yang tidak dinyatakan secara eksplisit.
- source_word: κόσμον
  choice: dunia
  rationale: “Dunia” adalah padanan alami bagi κόσμος dan sesuai dengan pemakaiannya dalam Injil Yohanes.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar pengakuan
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini istilah tersebut jelas menjadi gelar identitas Yesus. “Mesias” menyampaikan kandungan gelar itu, sementara catatan kaki mencatat padanan tradisional “Kristus” tanpa menghapus latar Yahudinya.
- issue: Daya makna κύριε dalam sapaan Marta
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks langsungnya adalah pengakuan bahwa Yesus adalah Mesias dan Anak Allah. “Tuhan” mempertahankan daya hormat dan kemungkinan bobot teologisnya, tanpa menjelaskan lebih jauh daripada teks.
- issue: Aspek perfektum πεπίστευκα
  choice: Aku telah percaya
  alternative: Aku percaya
  rationale: Pilihan ini menjaga ketegangan antara tindakan percaya yang telah terbentuk dan keadaan percaya yang masih berlangsung.
- issue: Daya waktu dan fungsi ὁ ἐρχόμενος
  choice: Dia yang datang ke dalam dunia
  alternative: Dia yang akan datang ke dalam dunia
  rationale: Bahasa Yunani memakai partisipel kini substantival yang juga dapat berfungsi sebagai sebutan bagi sosok yang dinantikan. Terjemahan tanpa “akan” tidak mempersempitnya menjadi futuritas semata.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pronomina “Engkau” dan akhiran “-Nya” dipakai sesuai register Alkitab Indonesia yang terhormat. Struktur pengakuan dibuat lugas, sementara perfektum Yunani dan ungkapan partisipial tetap dipertahankan sejauh alami dalam bahasa sasaran.
