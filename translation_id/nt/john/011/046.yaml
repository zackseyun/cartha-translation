id: JHN.11.46
reference: John 11:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: id
  text: Namun, beberapa orang di antara mereka pergi kepada orang-orang Farisi dan memberi tahu mereka apa yang telah dilakukan Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melaporkan kepada mereka apa yang dilakukan Yesus.” Teks Yunani tidak menyatakan secara eksplisit motif orang-orang yang pergi kepada orang-orang Farisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Namun, beberapa orang di antara mereka
  rationale: Ungkapan ini menunjuk pada sebagian dari kelompok yang disebut sebelumnya, sedangkan δὲ menandai kontras dengan orang-orang yang percaya dalam ayat sebelumnya.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: pergi kepada orang-orang Farisi
  rationale: ἀπῆλθον menyatakan bahwa mereka meninggalkan tempat itu dan mendatangi suatu kelompok; dalam bahasa Indonesia, 'pergi kepada' menyampaikan gerak menuju orang-orang tersebut secara wajar tanpa perlu menambahkan 'pergi dari sana'.
- source_word: εἶπαν αὐτοῖς
  choice: memberi tahu mereka
  rationale: Dalam konteks laporan mengenai tindakan Yesus, bentuk ini lebih alami daripada 'berkata kepada mereka' dan tidak dengan sendirinya menyiratkan motif bermusuhan.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: apa yang telah dilakukan Yesus
  rationale: ἃ secara alami diterjemahkan 'apa yang', sedangkan 'telah dilakukan' menunjukkan bahwa tindakan Yesus mendahului laporan mereka.
theological_decisions:
- issue: Motif orang-orang yang pergi kepada orang-orang Farisi
  choice: Menggunakan bahasa pelaporan yang netral
  alternative: Mengadukan atau melaporkan Yesus dengan maksud jahat
  rationale: Teks Yunani hanya menyatakan bahwa mereka memberi tahu orang-orang Farisi tentang apa yang Yesus lakukan. Ayat ini tidak menyebutkan secara eksplisit apakah motif mereka bermusuhan, netral, atau lainnya.
translation_notes:
  register: Bahasa Indonesia baku yang modern, alami, dan bermartabat. Sebutan 'orang-orang Farisi' dipakai sebagai bentuk yang jelas bagi pembaca umum. Ambiguitas mengenai motif para pelapor dipertahankan.
