id: JHN.11.56
reference: John 11:56
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: id
  text: Karena itu, mereka terus mencari Yesus dan, sambil berdiri di kawasan Bait Allah[a], berkata satu sama lain, “Bagaimana menurut kalian? Apakah Ia sama sekali tidak akan datang ke perayaan itu?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani hieron menunjuk pada seluruh kompleks atau kawasan Bait Allah, bukan khusus ruang suci bagian dalam.
    reason: cultural_note
  - marker: b
    text: Atau, “Ia pasti tidak akan datang ke perayaan itu.” Bahasa Yunani memakai bentuk penyangkalan yang sangat tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: terus mencari
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang; frasa ini alami dalam bahasa Indonesia dan mempertahankan aspek tersebut.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan yang bersifat inferensial dari konteks sebelumnya.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: berkata satu sama lain
  rationale: Mengungkapkan percakapan timbal balik dalam kelompok; aspek berlangsungnya percakapan turut ditopang oleh konstruksi kalimat.
- source_word: ἐν τῷ ἱερῷ
  choice: di pelataran Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau kawasan Bait Allah, bukan khusus ruang suci bagian dalam; 'pelataran' menyampaikan lokasi yang dapat dimasuki orang banyak.
- source_word: ἑστηκότες
  choice: sambil berdiri
  rationale: Partisipel perfektum menggambarkan keadaan mereka yang sedang berada dalam posisi berdiri.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Bagaimana menurut kalian?
  rationale: Ungkapan Indonesia yang alami untuk pertanyaan yang meminta pendapat beberapa orang.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: Apakah Ia sama sekali tidak akan datang
  rationale: ὅτι memperkenalkan isi pendapat, sedangkan οὐ μή memberi penyangkalan yang kuat. Bentuk pertanyaan Indonesia ini mempertahankan keterkaitannya dengan pertanyaan sebelumnya tanpa menghapus kemungkinan nuansa retoris.
- source_word: εἰς τὴν ἑορτήν
  choice: ke perayaan ini
  rationale: Dalam konteks Yohanes 11, ἑορτή merujuk pada perayaan Paskah yang sedang dibicarakan; 'perayaan' alami dalam bahasa Indonesia, sementara 'ini' membuat acuan definitnya jelas.
theological_decisions:
- issue: Daya penyangkalan οὐ μή dalam pertanyaan
  choice: sama sekali tidak akan datang
  alternative: pasti tidak akan datang
  rationale: Pilihan utama mempertahankan penyangkalan emfatik tanpa menetapkan secara berlebihan apakah para pembicara menyatakan kepastian atau mengajukan pertanyaan retoris tentang kemungkinan kedatangan Yesus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Kalian' dipakai karena pertanyaan ditujukan kepada lebih dari satu orang; 'Bait Allah' mempertahankan istilah Alkitab Indonesia yang luas dikenal.
