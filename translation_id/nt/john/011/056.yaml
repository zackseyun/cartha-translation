  to: Karena itu, mereka terus mencari Yesus dan, sambil berdiri di kawasan Bait Allah[a], berkata satu sama lain, “Bagaimana menurut kalian? Apakah Ia sama sekali tidak akan datang ke perayaan itu?”[b]
  rationale: Revisi membatasi perubahan pada ketepatan leksikal dan catatan. «Kawasan Bait Allah» lebih mencakup makna ἱερόν; «perayaan itu» mempertahankan rujukan definit tanpa menambahkan deiksis; dan catatan b kini memberikan alternatif yang setia pada negasi emfatik Yunani tanpa menambahkan «bukan?».
