lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan narasi; dalam bahasa Indonesia, alur ini sudah alami tanpa kata penghubung eksplisit, dan menerjemahkannya sebagai “tetapi” akan memberi kesan pertentangan yang terlalu kuat.
- source_word: Βηθανία
  choice: Betania
  rationale: Mengikuti bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: dekat Yerusalem
  rationale: ἐγγύς menyatakan kedekatan tempat; konstruksi ini diterjemahkan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: ὡς
  choice: kira-kira
  rationale: Di depan ukuran jarak, ὡς menandai perkiraan dan bukan angka yang persis.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: lima belas stadia dari sana
  rationale: Satuan kuno στάδιον dipertahankan agar latar budaya sumber tetap terlihat; “dari sana” mengungkapkan hubungan jarak yang dinyatakan oleh ἀπό dengan acuan Yerusalem.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, ringkas, dan bermartabat. “Terletak” dipakai untuk menyatakan lokasi secara idiomatis. Penanda catatan ditempatkan langsung setelah satuan kuno yang dijelaskan.
