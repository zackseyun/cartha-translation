  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: id
  text: Betania terletak dekat Yerusalem, kira-kira lima belas stadia[a] dari Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sekitar tiga kilometer.
