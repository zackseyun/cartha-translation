  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: id
  text: Yesus mengasihi Marta, saudarinya, dan Lazarus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: mengasihi
  rationale: Bentuk imperfek dari ἀγαπάω menyatakan kasih Yesus yang berlangsung atau menetap pada waktu lampau. Dalam bahasa Indonesia, bentuk sederhana "mengasihi" menyampaikannya secara alami tanpa memaksakan nuansa ingresif atau progresif yang berlebihan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ adalah penghubung ringan yang di sini menandai kesinambungan atau peralihan wacana. Bahasa Indonesia tidak memerlukan kata penghubung eksplisit pada awal kalimat ini; "tetapi" akan memberi kesan pertentangan yang terlalu kuat, sedangkan "adapun" terasa lebih bertanda daripada teks sumber.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: saudarinya
  rationale: Padanan alami bagi frasa nomina dengan pronomina posesif. Ayat ini sendiri tidak menyebut nama saudari Marta, sehingga terjemahan tidak menambah nama Maria dari konteks.
- source_word: Μάρθαν
  choice: Marta
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Λάζαρον
  choice: Lazarus
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: καὶ ... καὶ ... καὶ
  choice: Marta, saudarinya, dan Lazarus
  rationale: Ketiga objek tetap dikoordinasikan secara setara. Bahasa Indonesia baku secara alami memakai koma lalu "dan" sebelum unsur terakhir, tanpa harus mengulang "dan" pada setiap unsur.
theological_decisions:
- issue: Daya aspek imperfek ἠγάπα dalam pernyataan tentang kasih Yesus
  choice: Pernyataan sederhana mengenai kasih Yesus yang terus ada terhadap Marta, saudarinya, dan Lazarus
  alternative: Nuansa ingresif ("mulai mengasihi") atau progresif yang ditegaskan ("sedang terus mengasihi")
  rationale: Imperfek paling wajar menggambarkan keadaan yang berlangsung pada masa lampau. Terjemahan "mengasihi" mempertahankan pernyataan itu tanpa menambahkan klaim emosional atau doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan bermartabat. "Saudarinya" dipilih sebagai bentuk posesif yang alami; tidak ada penanda catatan kaki karena tidak diperlukan.
