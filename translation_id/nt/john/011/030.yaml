id: JHN.11.30
reference: John 11:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: id
  text: Yesus belum masuk ke desa itu, tetapi masih berada di tempat Marta menemui-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “tempat Marta keluar untuk menemui-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: belum
  rationale: Secara alami menyatakan bahwa sampai saat itu peristiwa tersebut belum terjadi.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan naratif ringan; dalam bahasa Indonesia alurnya tetap alami tanpa kata penghubung pembuka.
- source_word: ἐληλύθει
  choice: masuk
  rationale: Dalam konteks tujuan εἰς τὴν κώμην, bentuk ini menyatakan bahwa Yesus belum datang masuk ke desa; 'masuk' menyampaikan hubungan spasial itu secara wajar.
- source_word: κώμην
  choice: desa
  rationale: κώμη lazim menunjuk permukiman kecil; 'desa' merupakan padanan Indonesia yang jelas dan tepat.
- source_word: ἀλλ’
  choice: tetapi
  rationale: Menandai kontras antara belum masuk ke desa dan masih berada di tempat sebelumnya.
- source_word: ἔτι
  choice: masih
  rationale: Menegaskan keberlanjutan keberadaan Yesus di lokasi yang sama.
- source_word: τόπῳ
  choice: tempat
  rationale: Padanan umum dan alami bagi istilah lokasi ini.
- source_word: ὅπου
  choice: di tempat ...
  rationale: Klausa lokasi dibentuk secara alami dalam bahasa Indonesia melalui frasa 'di tempat' yang diikuti klausa penjelas.
- source_word: ὑπήντησεν
  choice: menemui
  rationale: Dapat berarti bertemu atau pergi menyongsong untuk bertemu; 'menemui' ringkas dan alami, sedangkan nuansa gerak keluar dipertahankan dalam catatan kaki.
- source_word: αὐτῷ
  choice: -Nya
  rationale: Pronomina datif merujuk kepada Yesus dan menjadi objek alami dari 'menemui'.
- source_word: Μάρθα
  choice: Marta
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, sederhana, dan bermartabat. Susunan kalimat mempertahankan kontras naratif sumber. Penanda catatan kaki ditempatkan setelah klausa yang menjelaskan lokasi pertemuan karena alternatif itu berkaitan dengan ὑπήντησεν, bukan dengan kata 'desa'.
