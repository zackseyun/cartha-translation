  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: id
  text: Karena itu, banyak orang Yahudi yang telah datang kepada Maria dan melihat apa yang telah dilakukan Yesus percaya kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “banyak dari antara orang Yahudi”. Dalam beberapa konteks Injil Yohanes, Ἰουδαῖοι juga dapat diterjemahkan “orang Yudea”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: banyak
  rationale: Padanan kuantitatif yang langsung dan alami, dengan jumlah yang tidak pasti tetapi cukup besar.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan akibat dengan peristiwa sebelumnya, khususnya tindakan Yesus membangkitkan Lazarus.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: banyak orang Yahudi
  rationale: Ungkapan partitif Yunani disampaikan secara alami dalam bahasa Indonesia; alternatif yang lebih eksplisit ialah 'banyak dari antara orang Yahudi'.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: yang telah datang kepada Maria
  rationale: Partisip berartikel membatasi kelompok yang dimaksud, sedangkan 'telah datang' menunjukkan bahwa kedatangan itu mendahului tindakan utama.
- source_word: θεασάμενοι
  choice: melihat
  rationale: Menyampaikan tindakan menyaksikan perbuatan Yesus secara langsung tanpa membuat bahasa Indonesia terasa kaku.
- source_word: ἃ ἐποίησεν
  choice: apa yang telah dilakukan Yesus
  rationale: Bentuk idiomatis Indonesia untuk klausa relatif netral jamak. Nama 'Yesus' memperjelas anteseden pronomina dalam bahasa Indonesia tanpa mengubah rujukan.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: menjadi percaya kepada-Nya
  rationale: Ungkapan alami yang menyatakan bahwa mereka mulai menaruh kepercayaan kepada Yesus sebagai akibat dari apa yang mereka saksikan.
theological_decisions:
- issue: Makna πιστεύω εἰς dalam konteks iman kepada Yesus menurut Yohanes
  choice: menjadi percaya kepada-Nya
  alternative: menaruh iman kepada-Nya; percaya kepada-Nya
  rationale: Pilihan ini mempertahankan arah personal kepercayaan kepada Yesus sekaligus mencerminkan bentuk aoris yang dalam konteks ini menyatakan respons yang terjadi, tanpa menambahkan rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. 'Karena itu' mempertahankan kaitan logis narasi; 'menjadi percaya' menegaskan respons yang muncul setelah mereka menyaksikan tindakan Yesus.
