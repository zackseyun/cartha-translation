id: JHN.11.36
reference: John 11:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: id
  text: Karena itu, orang-orang Yahudi berkata[a], “Lihatlah, betapa ia mengasihi Lazarus!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yudea,” jika ungkapan ini dipahami secara lebih khusus sebagai sebutan regional bagi para pengamat Yahudi yang hadir di sana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: berkata
  rationale: Bentuk imperfek menggambarkan perkataan yang berlangsung dalam adegan itu. Dalam bahasa Indonesia, aspek tersebut biasanya cukup dinyatakan secara alami oleh konteks; ‘sedang berkata’ akan terdengar kurang wajar di sini.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan para pengamat berdasarkan tangisan Yesus pada ayat sebelumnya, sekaligus mempertahankan hubungan logis antarayat.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Mempertahankan sebutan khas Injil Yohanes secara langsung. Dalam konteks ini, rujukannya ialah orang-orang Yahudi yang hadir menyaksikan peristiwa tersebut, bukan semua orang Yahudi.
- source_word: Ἴδε
  choice: Lihatlah
  rationale: Imperatif yang mengarahkan perhatian; bentuk ini alami dan bermartabat dalam tuturan langsung bahasa Indonesia.
- source_word: πῶς
  choice: betapa
  rationale: Dalam seruan ini, ‘betapa’ secara alami dapat menyatakan cara sekaligus kuatnya kasih tanpa menentukan secara sempit salah satu nuansa itu.
- source_word: ἐφίλει
  choice: mengasihi
  rationale: φιλέω di sini menyatakan kasih atau afeksi pribadi. ‘Mengasihi’ mempertahankan bobot maknanya tanpa melemahkannya menjadi sekadar ‘menyayangi’ atau ‘menaruh perhatian’.
- source_word: αὐτόν
  choice: Lazarus
  rationale: Pronomina Yunani berarti ‘dia/ia’ dan merujuk kepada Lazarus. Nama diulangi agar rujukannya jelas dan tuturan Indonesia tidak menimbulkan ambiguitas antara Yesus dan Lazarus.
theological_decisions:
- issue: Penerjemahan οἱ Ἰουδαῖοι dalam Injil Yohanes
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea
  rationale: Teks utama mempertahankan arti etnoreligius yang lazim dari ungkapan Yunani. Catatan menjelaskan alternatif regional karena dalam konteks langsung istilah ini menunjuk kepada para pelayat atau pengamat Yahudi yang hadir, bukan suatu kecaman terhadap seluruh kelompok etnis.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Tuturan langsung dibuat ringkas dan ekspresif; nama Lazarus dipakai untuk memperjelas rujukan pronomina.
