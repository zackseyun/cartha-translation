id: JHN.11.39
reference: John 11:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: id
  text: Yesus berkata, “Singkirkanlah batu itu.” Marta, saudara perempuan orang yang telah meninggal itu, berkata kepada-Nya, “Tuhan, sekarang ia sudah berbau[a], sebab ia sudah meninggal selama empat hari.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “ia sudah berbau busuk”; kata Yunani yang digunakan berarti “mengeluarkan bau”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab ia adalah orang hari keempat”, yaitu sudah empat hari sejak ia meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Singkirkanlah
  rationale: Bentuk perintah jamak dari αἴρω meminta orang-orang yang hadir memindahkan batu penutup makam. “Singkirkanlah” menyampaikan tindakan mengeluarkan batu dari tempatnya secara alami tanpa menambahkan subjek yang tidak dinyatakan.
- source_word: τὸν λίθον
  choice: batu itu
  rationale: Dalam konteks makam, λίθος menunjuk pada batu yang menutup jalan masuk. Artikel tertentu diterjemahkan dengan “itu” agar acuannya jelas.
- source_word: τοῦ τετελευτηκότος
  choice: orang yang telah meninggal itu
  rationale: Partisipel perfektum τελευτάω menunjuk pada orang yang sudah meninggal dan tetap berada dalam keadaan mati. Frasa ini alami serta mempertahankan nuansa hasil dari bentuk perfektum.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan κύριε kepada Yesus diterjemahkan “Tuhan”, sesuai bobot sapaan tersebut dalam Injil Yohanes, tanpa mempersempitnya menjadi kesopanan sosial belaka.
- source_word: ἤδη
  choice: sekarang ... sudah
  rationale: Gabungan “sekarang” dan “sudah” secara alami menyampaikan bahwa keadaan tersebut telah terjadi pada saat Marta berbicara.
- source_word: ὄζει
  choice: ia sudah berbau
  rationale: ὄζω berarti mengeluarkan bau; konteks kematian membuat bau tidak sedap tersirat. “Berbau” mempertahankan ungkapan sumber yang tidak menyebut kata khusus untuk bau busuk.
- source_word: τεταρταῖος
  choice: ia sudah meninggal selama empat hari
  rationale: Adjektiva ini secara harfiah menyatakan bahwa ia adalah orang “hari keempat”. Bahasa Indonesia memerlukan penguraian agar maknanya jelas dan alami.
- source_word: γάρ
  choice: sebab
  rationale: γάρ memperkenalkan alasan Marta atas keberatannya dan secara wajar diterjemahkan “sebab”.
theological_decisions:
- issue: Makna κύριε dalam sapaan Marta kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan bobot kristologis yang mungkin terkandung dalam penggunaan κύριος di Injil Yohanes, sedangkan “Tuan” cenderung membatasinya menjadi sapaan hormat biasa. Terjemahan ini tidak memaksa pembaca menentukan seluruh kadar pengakuan Marta hanya dari ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “berkata kepada-Nya” mempertahankan rujukan kepada Yesus, sedangkan “Singkirkanlah” menyampaikan perintah kepada orang-orang yang hadir tanpa menambahkan kata “kalian”. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
