  source_fidelity: 'Terjemahan dengan tepat mencerminkan teks Yunani: perintah jamak untuk menyingkirkan batu, identifikasi Marta sebagai saudara perempuan orang yang telah meninggal, sapaan Κύριε, keadaan bau yang telah muncul, dan alasan bahwa ia telah meninggal empat hari. Frasa “ia sudah meninggal selama empat hari” adalah penguraian yang akurat dan alami bagi τεταρταῖος.'
