id: JHN.11.34
reference: John 11:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: id
  text: Lalu Ia berkata, “Di mana kalian membaringkan dia?” Mereka berkata kepada-Nya, “Tuhan, mari dan lihatlah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuan, mari dan lihatlah.” Kata Yunani κύριε dapat dipakai sebagai sapaan hormat; “Tuhan” dipertahankan sebagai terjemahan utama.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk ini berasal dari λέγω, verba umum untuk berbicara. Walaupun ucapannya berupa pertanyaan, ‘berkata’ mempertahankan bentuk sumber tanpa mengubahnya secara interpretatif menjadi ‘bertanya’.
- source_word: Ποῦ
  choice: Di mana
  rationale: Adverbia interogatif langsung yang menanyakan tempat.
- source_word: τεθείκατε
  choice: kalian membaringkan
  rationale: Bentuk perfektum aktif τίθημι menunjuk pada tindakan menempatkan jenazah Lazarus yang sudah dilakukan. ‘Membaringkan’ wajar dalam konteks jenazah dan lebih khusus daripada ‘menaruh’, sementara hasil tindakannya tetap tersirat secara alami dalam bahasa Indonesia.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina maskulin tunggal ini merujuk kepada Lazarus.
- source_word: λέγουσιν
  choice: Mereka berkata
  rationale: Presens historis Yunani dialihkan ke bentuk naratif Indonesia yang wajar; bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sebagai sapaan kepada Yesus, κύριε dapat berarti sapaan hormat maupun memuat bobot kristologis. ‘Tuhan’ mempertahankan kemungkinan keduanya sebagai padanan utama, dengan alternatif ‘Tuan’ dicatat.
- source_word: ἔρχου
  choice: mari
  rationale: Imperatif ἔρχομαι di sini berfungsi sebagai ajakan agar Yesus menyertai mereka. ‘Mari’ lebih alami dalam bahasa Indonesia daripada ‘datanglah’ ketika segera diikuti tindakan melihat.
- source_word: ἴδε
  choice: lihatlah
  rationale: Imperatif aoris ὁράω diterjemahkan secara langsung dan alami sebagai ‘lihatlah’.
theological_decisions:
- issue: Sapaan κύριε kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: ‘Tuhan’ menjaga kemungkinan bobot kristologis dalam narasi Yohanes, sedangkan konteks juga memungkinkan sapaan hormat biasa. Alternatif tersebut dicatat agar ambiguitas semantis sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk menampilkan bentuk jamak pada τεθείκατε secara jelas. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia, tanpa menambah makna pada teks Yunani.
