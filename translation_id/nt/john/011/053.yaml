  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: id
  text: Karena itu, sejak hari itu mereka berencana membunuh dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: sejak hari itu
  rationale: Frasa ini menandai titik awal dari tindakan atau keadaan yang berlanjut. “Sejak hari itu” merupakan ungkapan temporal yang alami dan tepat dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata penghubung ini menyatakan akibat atau kesimpulan dari sidang yang diceritakan sebelumnya. “Karena itu” mempertahankan hubungan logis tersebut dengan jelas.
- source_word: ἐβουλεύσαντο
  choice: mereka berencana
  rationale: Bentuk ini menunjuk pada pertimbangan yang menghasilkan rencana yang disengaja. “Berencana” mempertahankan unsur perencanaan tanpa melemahkannya menjadi sekadar pembicaraan.
- source_word: ἵνα ἀποκτείνωσιν
  choice: untuk membunuh
  rationale: Konstruksi ἵνα menyatakan tujuan atau isi dari rencana mereka. “Untuk membunuh” adalah padanan Indonesia yang alami dan langsung.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti ini merujuk kepada Yesus dalam konteks langsung. Kata ganti dipertahankan dan ditulis dengan huruf kapital sesuai kebiasaan umum dalam penerjemahan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Sifat niat para pemimpin terhadap Yesus
  choice: Pernyataan diterjemahkan sebagai rencana nyata untuk membunuh Yesus.
  alternative: Mereka membicarakan atau mempertimbangkan kemungkinan membunuh Dia.
  rationale: Bahasa Yunani menunjukkan peralihan menuju rencana yang disengaja, bukan sekadar pembahasan kemungkinan. Terjemahan mempertahankan beratnya niat tersebut tanpa menambahkan gambaran tentang proses hukum atau penafsiran teologis lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “Karena itu, sejak hari itu” mempertahankan hubungan konsekuensial οὖν sekaligus titik awal temporal dari frasa ἀπό.
