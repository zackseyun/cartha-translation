id: JHN.11.4
reference: John 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: id
  text: Namun, ketika Yesus mendengarnya, Ia berkata, “Penyakit ini tidak berakhir pada kematian,[a] melainkan untuk kemuliaan Allah, supaya melalui penyakit itu Anak Allah dimuliakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bukan menuju kematian.” Ungkapan Yunani ini dapat berarti bahwa kematian bukanlah hasil akhir atau tujuan penyakit tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Namun, ketika Yesus mendengarnya
  rationale: Partisip aoris menyatakan keadaan temporal bagi perkataan Yesus, sedangkan δέ menandai perkembangan atau kontras ringan. Akhiran -nya secara alami merujuk pada kabar tentang penyakit Lazarus dari konteks sebelumnya.
- source_word: ἀσθένεια
  choice: penyakit
  rationale: Istilah ini menunjuk pada keadaan sakit Lazarus; “penyakit” merupakan padanan Indonesia yang umum, jelas, dan tidak terlalu klinis.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: tidak berakhir pada kematian
  rationale: πρός dengan akusatif di sini dapat menunjukkan hasil atau tujuan akhir. Padanan ini alami dalam bahasa Indonesia dan mempertahankan nuansa bahwa kematian bukan hasil akhirnya, tanpa menyangkal bahwa Lazarus sempat mati.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: untuk kemuliaan Allah
  rationale: ὑπέρ menyatakan tujuan atau manfaat; terjemahan ini mempertahankan bobot teologis δόξα dan tetap alami.
- source_word: ἵνα δοξασθῇ
  choice: supaya ... dimuliakan
  rationale: ἵνα memperkenalkan tujuan, dan bentuk pasif δοξασθῇ dipertahankan dengan “dimuliakan”.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Padanan baku dan tepat bagi gelar kristologis ini dalam bahasa Indonesia.
- source_word: δι’ αὐτῆς
  choice: melalui penyakit itu
  rationale: διά dengan genitif menyatakan sarana. Mengulangi “penyakit itu” memperjelas acuan kata ganti feminin αὐτῆς dan terdengar lebih alami daripada “melaluinya” dalam kalimat ini.
theological_decisions:
- issue: Makna “tidak ... pada kematian” mengingat Lazarus kemudian benar-benar mati
  choice: Diterjemahkan “tidak berakhir pada kematian” untuk menunjukkan bahwa kematian bukan hasil akhir penyakit itu.
  alternative: “Tidak menyebabkan kematian” atau “bukan penyakit yang mematikan,” yang dapat terdengar seperti penyangkalan bahwa Lazarus akan mati.
  rationale: Konteks selanjutnya menyatakan Lazarus mati (11:14). Terjemahan ini mempertahankan daya teleologis πρὸς dan ketegangan naratif tanpa menjelaskan lebih jauh daripada teks.
- issue: Hubungan antara kemuliaan Allah dan pemuliaan Anak Allah
  choice: 'Kedua klausa dipertahankan secara tersendiri: penyakit itu untuk kemuliaan Allah dan menjadi sarana supaya Anak Allah dimuliakan.'
  alternative: Melebur keduanya menjadi satu pernyataan umum tentang kemuliaan ilahi.
  rationale: Teks Yunani secara eksplisit menyandingkan kemuliaan Allah dengan pemuliaan Anak Allah. Mempertahankan keduanya menjaga penekanan kristologis teks tanpa menambahkan rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk menjaga register naratif Alkitab yang lazim; “tidak berakhir pada kematian” dipilih agar idiom Yunani dapat dipahami pembaca umum sekaligus mempertahankan ketegangan konteks.
