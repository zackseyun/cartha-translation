id: JHN.11.10
reference: John 11:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: id
  text: Namun, jika seseorang berjalan pada malam hari, ia tersandung, karena terang itu tidak ada di dalam dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terang itu tidak menyertainya.” Secara lebih harfiah, teks Yunani berbunyi “di dalam dirinya,” yang mungkin menyiratkan lebih dari sekadar tidak adanya terang dari luar.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: Namun, jika
  rationale: Menyatakan pertentangan dengan ayat sebelumnya sekaligus memperkenalkan syarat; bentuk ini alami dalam bahasa Indonesia dan tidak memperumit susunan kalimat.
- source_word: τις
  choice: seseorang
  rationale: Mempertahankan sifat tak tentu dan umum dari kata ganti Yunani.
- source_word: περιπατῇ
  choice: berjalan
  rationale: Makna harfiahnya dipertahankan agar gambaran berjalan serta kemungkinan gema metaforisnya tetap terbuka.
- source_word: ἐν τῇ νυκτί
  choice: pada malam hari
  rationale: Ungkapan Indonesia yang alami untuk waktu malam; tetap mempertahankan citra malam tanpa menafsirkannya langsung sebagai kegelapan rohani.
- source_word: προσκόπτει
  choice: tersandung
  rationale: Mencakup gambaran fisik dan kemungkinan makna metaforis secara wajar.
- source_word: ὅτι
  choice: karena
  rationale: Menyampaikan hubungan sebab secara jelas.
- source_word: τὸ φῶς
  choice: terang itu
  rationale: Kata penunjuk 'itu' mencerminkan ke-definit-an artikel Yunani dan kaitannya dengan terang yang sedang dibicarakan.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: tidak ada di dalam dirinya
  rationale: Menerjemahkan ἐν secara langsung sebagai 'di dalam' dan mempertahankan kemungkinan makna yang lebih dalam daripada sekadar tidak tersedianya penerangan dari luar.
theological_decisions:
- issue: Acuan dan daya ungkap frasa 'terang itu tidak ada di dalam dirinya'
  choice: Mempertahankan ungkapan batiniah 'di dalam dirinya' tanpa membatasinya pada ketiadaan cahaya dari luar.
  alternative: '''terang itu tidak menyertainya'' sebagai pernyataan situasional semata tentang tidak adanya penerangan'
  rationale: Preposisi Yunani ἐν secara wajar berarti 'di dalam'. Bahasa terang dan malam dalam Yohanes dapat mengandung kedalaman teologis; terjemahan ini mempertahankan ketegangan antara gambaran harfiah dan kemungkinan makna rohaninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat dibuat alami, sementara citra berjalan, malam, tersandung, dan terang serta ambiguitas teologis frasa penutup tetap dipertahankan.
