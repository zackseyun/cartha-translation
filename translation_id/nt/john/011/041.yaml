base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: id
  text: Maka mereka menyingkirkan batu itu. Lalu Yesus menengadah[a] dan berkata, “Bapa, Aku bersyukur kepada-Mu karena Engkau telah mendengar Aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mengangkat mata-Nya ke atas”; dapat juga diterjemahkan “memandang ke atas.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Engkau mendengar Aku.” Bentuk aoris Yunani menunjuk pada tindakan mendengar yang sudah terjadi; “telah mendengar” mengungkapkannya secara alami dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: menyingkirkan
  rationale: Dalam konteks pintu makam, αἴρω menunjuk pada tindakan memindahkan batu dari tempatnya. “Menyingkirkan” jelas dan alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Maka
  rationale: Menandai akibat naratif dari perintah Yesus sebelumnya dan mempertahankan alur inferensial ayat.
- source_word: λίθον
  choice: batu
  rationale: Padanan baku dan alami untuk λίθος dalam konteks batu penutup makam.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: menengadah
  rationale: Ungkapan Indonesia yang alami untuk mengarahkan pandangan ke atas, khususnya dalam konteks doa; gambaran harfiahnya dijelaskan dalam catatan kaki.
- source_word: δὲ
  choice: Lalu
  rationale: δέ berfungsi sebagai peralihan naratif ringan, bukan pertentangan kuat. “Lalu” menghubungkan tindakan berikutnya secara alami.
- source_word: Πάτερ
  choice: Bapa
  rationale: Bentuk sapaan langsung yang lazim, ringkas, dan khidmat dalam doa kepada Allah.
- source_word: εὐχαριστῶ σοι
  choice: Aku bersyukur kepada-Mu
  rationale: Menyampaikan ungkapan syukur dalam bentuk bahasa Indonesia yang alami dan tetap dekat dengan susunan sumber.
- source_word: ὅτι ἤκουσάς μου
  choice: karena Engkau telah mendengarkan Aku
  rationale: “Telah” menandai tindakan yang sudah terjadi dan masih relevan saat Yesus berbicara; “mendengarkan” sesuai dengan konteks doa tanpa memperluas maknanya.
theological_decisions:
- issue: Sapaan Yesus kepada Allah dalam doa
  choice: Bapa
  alternative: Ya Bapa
  rationale: “Bapa” mempertahankan sapaan vokatif langsung tanpa menambahkan partikel seru yang tidak dinyatakan dalam bahasa Yunani.
- issue: Makna ἤκουσάς μου dalam konteks doa
  choice: Engkau telah mendengarkan Aku
  alternative: Engkau telah mendengar Aku
  rationale: Pilihan utama wajar dalam bahasa Indonesia untuk Allah yang mendengar doa, tetapi tidak menambahkan penjelasan teologis mengenai jawaban doa atau relasi Bapa dan Anak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Maka” dan “lalu” menjaga hubungan antartindakan, sedangkan “menengadah” menghindari ungkapan yang kaku. Kapitalisasi pronomina sapaan kepada Bapa dan rujukan kepada Yesus mengikuti kebiasaan hormat yang luas dalam teks keagamaan Indonesia.
