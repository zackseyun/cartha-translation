id: JHN.11.54
reference: John 11:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: id
  text: Karena itu, Yesus tidak lagi berjalan secara terang-terangan di antara orang Yahudi[a], tetapi pergi dari sana ke daerah dekat padang belantara, ke sebuah kota bernama Efraim. Ia tinggal di sana bersama murid-murid-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Yudea.” Dalam Injil Yohanes, sebutan “orang Yahudi” kadang-kadang dapat secara lebih khusus merujuk pada orang Yudea atau para penguasa Yahudi, bergantung pada konteksnya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai akibat dari rencana para pemimpin untuk membunuh Yesus dalam ayat sebelumnya; ungkapan ini alami dan tetap mempertahankan daya inferensialnya.
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Menyatakan berhentinya pola tindakan yang sebelumnya dilakukan.
- source_word: παρρησίᾳ περιεπάτει
  choice: berjalan secara terang-terangan
  rationale: Mempertahankan gambaran harfiah verba 'berjalan/berkeliling' sekaligus menyampaikan bahwa Yesus tidak lagi bergerak di depan umum secara terbuka.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: di antara orang Yahudi
  rationale: Menerjemahkan ungkapan sosial-geografis secara langsung tanpa membatasinya secara pasti pada para pemimpin; kemungkinan arti regional 'orang Yudea' dicatat dalam catatan kaki.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: pergi dari sana
  rationale: Padanan Indonesia yang wajar dan jelas untuk gerak meninggalkan tempat sebelumnya.
- source_word: χώραν
  choice: daerah
  rationale: Menunjuk suatu kawasan atau wilayah, bukan negara dalam pengertian modern.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: dekat padang belantara
  rationale: Menggambarkan kawasan sepi atau jarang dihuni; tidak memaksakan pengertian gurun pasir.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: ke sebuah kota bernama Efraim
  rationale: Menerjemahkan πόλις secara langsung sebagai 'kota' dan λεγομένην secara alami sebagai 'bernama'.
- source_word: κἀκεῖ ἔμεινεν
  choice: Ia tinggal di sana
  rationale: Dalam konteks perjalanan, 'tinggal' merupakan padanan idiomatis untuk μένω; pemisahan menjadi kalimat baru meningkatkan keterbacaan tanpa mengubah hubungan naratif.
- source_word: μετὰ τῶν μαθητῶν
  choice: bersama murid-murid-Nya
  rationale: Akhiran posesif memperjelas rujukan yang tersirat kuat dalam konteks bahasa Indonesia, meskipun kata ganti posesif tidak dinyatakan dalam teks Yunani.
theological_decisions:
- issue: Rujukan Ἰουδαῖοι dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Istilah ini dapat bernuansa etnis, regional, atau merujuk pada kalangan penguasa menurut konteks. Ayat ini menggambarkan ruang gerak Yesus di tengah masyarakat; teks utama memakai padanan umum, sedangkan catatan kaki mempertahankan kemungkinan regional dan mencegah generalisasi terhadap semua orang Yahudi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Padang belantara' dipilih untuk kawasan sepi, sedangkan 'secara terang-terangan' menekankan keterlihatan di depan umum. Penanda catatan kaki [a] dicantumkan tepat setelah frasa terkait.
source_grounding:
  english_pob_role: consult_only
