  source_fidelity: 'Terjemahan secara akurat menyampaikan urutan dan hubungan naratif Yunani: konsekuensi (οὖν), penghentian tindakan sebelumnya (οὐκέτι), keterbukaan di muka umum (παρρησίᾳ), perpindahan dari tempat itu ke wilayah dekat padang belantara, tujuan di Efraim, dan tinggal bersama para murid. Kalimat baru sebelum “Ia tinggal” tidak mengubah makna.'
