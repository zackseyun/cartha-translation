  source_fidelity: 'Teks Indonesia mengikuti unsur-unsur Yunani dengan setia: οὖν diterjemahkan “Karena itu”; Θωμᾶς dan Δίδυμος dipertahankan sebagai Tomas dan Didimus; bentuk hortatoris Ἄγωμεν diterjemahkan tepat dengan “Mari kita ... pergi”; dan ἵνα ἀποθάνωμεν μετ’ αὐτοῦ disampaikan sebagai “supaya kita mati bersama Dia.” Terjemahan ini tidak memaksakan penilaian atas nada perkataan Tomas.'
