id: JHN.11.16
reference: John 11:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: id
  text: Karena itu, Tomas, yang disebut Didimus[a], berkata kepada murid-murid yang lain, “Mari kita juga pergi supaya kita mati bersama Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Didimus berarti “Kembar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kelanjutan sekaligus simpulan dari percakapan sebelumnya; ungkapan ini wajar dan tetap mempertahankan hubungan logis narasi.
- source_word: Θωμᾶς
  choice: Tomas
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: yang disebut Didimus[a]
  rationale: Mempertahankan nama Yunani Δίδυμος dalam teks utama, sementara arti leksikalnya, 'Kembar', dijelaskan dalam catatan kaki.
- source_word: τοῖς συμμαθηταῖς
  choice: kepada murid-murid yang lain
  rationale: Menunjukkan para murid lain yang belajar dan mengikut Yesus bersama Tomas; bentuk ini lebih alami daripada istilah teknis 'sesama murid' dalam kalimat ini.
- source_word: Ἄγωμεν
  choice: Mari kita ... pergi
  rationale: Menyampaikan subjunktif hortatoris orang pertama jamak sebagai ajakan yang alami dalam bahasa Indonesia.
- source_word: καὶ ἡμεῖς
  choice: kita juga
  rationale: Mempertahankan penekanan inklusif bahwa Tomas dan murid-murid lainnya turut pergi.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan hubungan tujuan atau hasil yang diharapkan tanpa menentukan nuansanya secara berlebihan.
- source_word: ἀποθάνωμεν
  choice: kita mati
  rationale: Sesudah 'supaya', bahasa Indonesia tidak memerlukan penanda modal khusus; bentuk ini menyampaikan kemungkinan atau tujuan dalam konstruksi Yunani secara lugas.
- source_word: μετ’ αὐτοῦ
  choice: bersama Dia
  rationale: Menyatakan penyertaan dengan rujukan kontekstual kepada Yesus; kapitalisasi pronomina mengikuti konvensi umum teks Alkitab bahasa Indonesia.
theological_decisions:
- issue: Nada dan maksud perkataan Tomas
  choice: Pernyataan diterjemahkan secara lugas tanpa pewarnaan interpretatif.
  alternative: Dapat dipahami sebagai kesetiaan yang berani, kepasrahan fatalistis, atau pesimisme ironis.
  rationale: Teks Yunani tidak secara eksplisit menentukan nada psikologis Tomas, sehingga terjemahan mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat dan mudah dipahami. Nama Didimus dipertahankan dalam teks dan maknanya diberikan dalam catatan kaki.
source_grounding:
  english_pob_role: consult_only
