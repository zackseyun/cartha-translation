  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: id
  text: Yesus menjawab, “Bukankah siang hari terdiri dari dua belas jam? Jika seseorang berjalan pada siang hari, ia tidak tersandung, karena ia melihat terang dunia ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: Jawab Yesus
  rationale: Bentuk naratif yang ringkas, wajar, dan setia bagi verba respons aoristus serta subjeknya.
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας;
  choice: Bukankah siang hari terdiri dari dua belas jam?
  rationale: Οὐχί memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya. Susunan ini menyampaikan bahwa masa terang pada siang hari dihitung sebagai dua belas jam, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: Jika seseorang berjalan pada siang hari
  rationale: τις bersifat umum dan tidak tentu; “seseorang” mempertahankan bentuk tunggal tanpa membatasi rujukannya. “Pada siang hari” menjaga pengulangan ἡμέρα dan kontras yang berkembang dalam konteks.
- source_word: οὐ προσκόπτει
  choice: ia tidak tersandung
  rationale: “Tersandung” mempertahankan gambaran harfiah sekaligus kemungkinan daya metaforis προσκόπτει.
- source_word: ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει
  choice: karena ia melihat terang dunia ini
  rationale: Terjemahan ini mempertahankan verba melihat dan frasa genitif secara langsung, tanpa menambahkan penafsiran seperti “dapat melihat” atau secara eksplisit menyamakan terang itu dengan Yesus.
theological_decisions:
- issue: Kemungkinan makna simbolis “terang” dalam Injil Yohanes
  choice: Mempertahankan ungkapan “terang dunia ini” tanpa menjelaskan simbolnya di dalam teks
  alternative: Menerjemahkannya secara lebih eksplisit sebagai Yesus, terang ilahi, atau tuntunan Allah
  rationale: Dalam konteks langsung, ungkapan itu berfungsi sebagai gambaran tentang berjalan pada siang hari, tetapi tema terang memiliki gema teologis yang luas dalam Injil Yohanes. Terjemahan dibiarkan memuat kedua lapisan tersebut tanpa menetapkan salah satunya secara berlebihan.
- issue: Rujukan umum dalam τις ... βλέπει
  choice: Menggunakan “seseorang ... ia”
  alternative: Menggunakan bentuk jamak atau mengulang “orang itu”
  rationale: Bentuk tunggal representatif dalam bahasa Yunani dipertahankan secara alami dalam bahasa Indonesia; “ia” tidak menambahkan penandaan gender yang tidak diwajibkan oleh makna ungkapan umum tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur pertanyaan dibuat idiomatis, sementara pengulangan “siang hari,” citra “tersandung,” dan ungkapan “terang dunia ini” dipertahankan untuk menjaga hubungan literal serta kemungkinan makna simbolis.
