  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: id
  text: Namun, bahkan sekarang[a] aku tahu bahwa apa pun yang Engkau minta kepada Allah[b], Allah akan memberikannya kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan sekarang aku tahu.” Kata penghubung Yunani dapat diterjemahkan hanya dengan “dan”, tetapi dalam konteks juga menyiratkan peralihan yang kontras sesudah perkataan Marta tentang kematian Lazarus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Engkau minta Allah.” Dalam bahasa Indonesia, ungkapan ini lebih alami disampaikan sebagai “Engkau minta kepada Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Namun, sekarang pun
  rationale: Καί menghubungkan ucapan ini dengan ayat sebelumnya, tetapi dalam konteks juga menandai peralihan bernuansa kontras dari kematian Lazarus kepada keyakinan Marta yang masih ada; νῦν tetap dipertahankan dengan “sekarang pun”.
- source_word: οἶδα
  choice: aku tahu
  rationale: Bentuk perfektum ini memiliki makna kini dan paling langsung diterjemahkan “aku tahu”, tanpa melemahkannya menjadi sekadar dugaan atau harapan.
- source_word: ὅσα ἂν
  choice: apa pun yang
  rationale: Gabungan kata ganti relatif dengan ἄν menyatakan cakupan yang tidak ditentukan; “apa pun yang” alami dalam bahasa Indonesia dan mempertahankan keterbukaannya.
- source_word: αἰτήσῃ τὸν θεόν
  choice: Engkau minta kepada Allah
  rationale: Bahasa Yunani menjadikan θεόν objek langsung αἰτέω, sedangkan bahasa Indonesia modern lebih alami memakai “minta kepada Allah” ketika pihak yang dimintai disebut dan hal yang diminta telah dinyatakan oleh “apa pun”.
- source_word: δώσει σοι ὁ θεός
  choice: Allah akan memberikannya kepada-Mu
  rationale: Urutan ini mempertahankan Allah sebagai subjek yang dinyatakan secara eksplisit dan memakai “memberikan” untuk δίδωμι. Akhiran “-nya” merujuk kembali pada “apa pun” dan diperlukan agar kalimat Indonesia mengalir alami.
- source_word: θεός / ὁ θεός
  choice: Allah ... Allah
  rationale: Kedua kemunculan menerjemahkan θεός secara langsung sebagai “Allah”; tidak ada dasar tekstual untuk memperluasnya menjadi “Bapa”.
theological_decisions:
- issue: Ucapan Marta dapat dibaca terlalu jauh sebagai pernyataan doktrinal tentang hubungan Yesus dengan Allah.
  choice: 'Mempertahankan ucapan Marta secara langsung: Yesus meminta kepada Allah dan Allah memberikan kepada-Nya.'
  alternative: Mengganti “Allah” dengan “Bapa” atau memparafrasakan kalimat untuk menghindari kesan subordinasi.
  rationale: Ayat ini melaporkan perkataan Marta dalam alur narasi Yohanes. Terjemahan perlu mempertahankan ketegangan naratif dan tidak memasukkan penjelasan kristologis yang tidak dinyatakan dalam ayat.
- issue: Pemakaian kata ganti untuk Yesus dalam sapaan Marta.
  choice: Menggunakan “Engkau” dan “-Mu” dengan huruf kapital.
  alternative: Menggunakan “engkau” dan “-mu” dengan huruf kecil.
  rationale: Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk sapaan langsung kepada Yesus dan membantu kejelasan rujukan, tanpa mengubah isi leksikal teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun, sekarang pun” mempertahankan hubungan dengan ayat sebelumnya sekaligus nuansa kontras. Susunan “memberikannya kepada-Mu” dipilih agar alami dalam bahasa Indonesia, dengan “-nya” merujuk pada hal apa pun yang diminta.
