id: JHN.11.2
reference: John 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: id
  text: Maria inilah yang telah mengurapi Tuhan dengan minyak wangi[a] dan menyeka kaki-Nya dengan rambutnya; Lazarus, saudara laki-lakinya, sedang sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “minyak harum” atau “salep wangi”; istilah Yunani menunjuk pada minyak atau salep beraroma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Maria inilah
  rationale: Konstruksi pengenal ini secara alami menegaskan identitas Maria dalam bahasa Indonesia; daya penghubung δέ dibiarkan tersirat karena konteks sudah menghubungkan ayat ini dengan ayat sebelumnya.
- source_word: ἡ ἀλείψασα
  choice: yang telah mengurapi
  rationale: Artikel dan partisip aoristus mengenalkan Maria melalui tindakan yang menjadi cirinya. 'Telah' menunjukkan tindakan tersebut sebagai acuan yang sudah dikenal, tanpa memaksakan urutan ketat dalam alur cerita.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος bagi Yesus beserta bobot naratif dan teologisnya.
- source_word: μύρῳ
  choice: dengan minyak wangi
  rationale: μύρον menunjuk pada minyak atau salep beraroma. 'Minyak wangi' jelas, alami, dan cocok dengan tindakan mengurapi.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: dan menyeka kaki-Nya
  rationale: ἐκμάσσω berarti menyeka atau mengeringkan dengan mengusap; 'menyeka' merupakan padanan Indonesia yang ringkas dan tepat.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: dengan rambutnya
  rationale: Dativus ini bersifat instrumental dan secara alami diterjemahkan dengan 'dengan'; bentuk refleksif posesif mengacu kepada Maria.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: Saudaranya, Lazarus
  rationale: Hubungan genitif relatif dipertahankan sebagai hubungan persaudaraan. Pemecahan menjadi kalimat kedua menghindari klausa bertumpuk dan tetap mempertahankan Lazarus sebagai aposisi yang menjelaskan siapa saudara Maria.
- source_word: ἠσθένει
  choice: sedang sakit
  rationale: Imperfek menggambarkan keadaan sakit yang sedang berlangsung pada latar waktu narasi.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' mempertahankan bobot gelar kristologis dan pemakaian naratif Yohanes, sedangkan ''Tuan'' dapat terlalu membatasi maknanya pada sapaan sosial.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur panjang bahasa Yunani dibagi menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan Maria dengan Lazarus. Huruf kapital pada akhiran posesif dalam 'kaki-Nya' mengikuti konvensi Indonesia untuk rujukan kepada Tuhan; 'rambutnya' merujuk kepada Maria.
