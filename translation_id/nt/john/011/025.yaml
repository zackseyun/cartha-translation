source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: id
  text: Yesus berkata kepadanya, “Akulah kebangkitan dan hidup. Orang yang percaya kepada-Ku, sekalipun ia mati, akan hidup.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa pun yang percaya kepada-Ku, sekalipun mati, akan hidup.” Bentuk Yunani memakai orang ketiga tunggal maskulin secara representatif dan berlaku bagi siapa pun yang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: berkata kepadanya
  rationale: Bentuk aoris εἶπεν memperkenalkan tuturan secara lugas, sedangkan datif feminin αὐτῇ menunjuk kepada Marta dalam konteks.
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada Ἐγώ dalam pernyataan identitas Yesus.
- source_word: ἡ ἀνάστασις
  choice: kebangkitan
  rationale: Dalam konteks ini ἀνάστασις menunjuk pada kebangkitan dari kematian; konstruksi predikatif bahasa Indonesia tidak memerlukan padanan tersendiri bagi artikelnya.
- source_word: ἡ ζωή
  choice: hidup
  rationale: “Hidup” merupakan padanan yang alami dan luas bagi ζωή serta mempertahankan kesejajarannya dengan “kebangkitan” tanpa mempersempit maknanya menjadi sekadar kelangsungan hidup.
- source_word: ὁ πιστεύων
  choice: orang yang percaya
  rationale: Frasa ini mempertahankan bentuk tunggal dan sifat umum dari partisipel substantival kini, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: εἰς ἐμέ
  choice: kepada-Ku
  rationale: Dengan verba “percaya”, bahasa Indonesia secara idiomatis memakai “kepada”; padanan harfiah spasial bagi εἰς akan terasa janggal.
- source_word: κἂν ἀποθάνῃ
  choice: sekalipun ia mati
  rationale: “Sekalipun” menyampaikan daya konsesif κἂν, dan “ia mati” secara alami mewakili aoris subjungtif dalam kondisi tersebut.
- source_word: ζήσεται
  choice: akan hidup
  rationale: Bentuk futur diterjemahkan langsung tanpa menambahkan “kembali”, sehingga keluasan janji hidup yang dinyatakan teks tetap terpelihara.
theological_decisions:
- issue: Identifikasi diri Yesus dalam Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Akulah kebangkitan dan hidup
  alternative: Akulah yang membangkitkan dan memberi hidup
  rationale: Terjemahan mempertahankan klaim identitas predikatif dalam bahasa Yunani dan tidak mengubahnya menjadi sekadar pernyataan tentang fungsi Yesus.
- issue: Bentuk tunggal maskulin representatif pada ὁ πιστεύων dan verba-verba berikutnya
  choice: Orang yang percaya kepada-Ku, sekalipun ia mati, akan hidup
  alternative: Setiap orang yang percaya kepada-Ku, sekalipun mereka mati, akan hidup
  rationale: Bahasa Indonesia dapat mempertahankan rujukan tunggal dengan “orang” dan “ia”. Bentuk ini tetap berlaku secara umum bagi siapa pun, tanpa mengubah tunggal Yunani menjadi jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Akulah” mempertahankan penekanan pernyataan identitas secara alami; “kepada-Ku” mengikuti idiom bahasa Indonesia untuk percaya kepada seseorang. Kata ganti generik “ia” ditulis dengan huruf kecil karena merujuk kepada orang yang percaya, bukan kepada Yesus.
