  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: id
  text: Karena itu murid-murid berkata kepada-Nya, “Tuhan, jika ia sudah tertidur[a], ia akan sembuh[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “telah tidur.” Yesus memakai tidur sebagai kiasan untuk kematian Lazarus, tetapi para murid memahami-Nya sebagai tidur biasa.
    reason: lexical_alternative
  - marker: b
    text: 'Kata kerja Yunani ini juga dapat diterjemahkan “akan diselamatkan,” tetapi dalam konteks ini menunjuk pada pulih dari penyakit: “akan sembuh” atau “akan pulih.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan para murid dari perkataan Yesus sebelumnya dan mempertahankan hubungan logis antarkalimat secara alami dalam bahasa Indonesia.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Artikel Yunani menunjuk kepada kelompok murid yang sudah jelas dalam konteks; bahasa Indonesia tidak memerlukan unsur tambahan seperti “murid-murid-Nya”.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina ini merujuk kepada Yesus. Bentuk pronominal dipertahankan, sedangkan huruf kapital mengikuti kelaziman bahasa Indonesia untuk sapaan atau rujukan kepada Yesus.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan makna dasar κύριος dalam sapaan kepada Yesus serta kemungkinan lapisan makna antara sapaan hormat dan pengakuan kristologis.
- source_word: εἰ
  choice: jika
  rationale: Mengungkapkan syarat yang diajukan para murid berdasarkan pemahaman mereka bahwa Lazarus sedang tidur biasa.
- source_word: κεκοίμηται
  choice: sudah tertidur
  rationale: Bentuk perfektum menunjukkan keadaan tidur sebagai hasil tindakan sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan mencerminkan pemahaman harfiah para murid, sementara kemungkinan kiasan tentang kematian dijelaskan dalam catatan.
- source_word: σωθήσεται
  choice: ia akan sembuh
  rationale: Dalam konteks penyakit, σῴζω dapat berarti pulih atau sembuh. Pilihan ini menyampaikan maksud para murid tanpa memasukkan nuansa keselamatan rohani yang tidak menjadi fokus langsung kalimat ini.
theological_decisions:
- issue: Makna κύριος dalam sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: “Tuhan” mempertahankan nilai leksikal dan lapisan kristologis khas Injil Yohanes tanpa memaksa pembaca menentukan apakah para murid di sini sedang memakai gelar ilahi secara penuh.
- issue: Makna ganda κεκοίμηται sebagai tidur biasa atau kiasan untuk kematian
  choice: Bahasa tidur biasa dalam teks utama
  alternative: telah beristirahat
  rationale: Para murid memahami perkataan Yesus secara harfiah, sedangkan Yesus sebelumnya memakai tidur sebagai kiasan bagi kematian Lazarus. Terjemahan ini mempertahankan salah paham naratif tersebut dan tidak menghapus ketegangannya.
- issue: Rentang makna σωθήσεται
  choice: ia akan sembuh
  alternative: ia akan diselamatkan; ia akan pulih
  rationale: Konteks menunjukkan bahwa para murid berbicara tentang kesembuhan dari penyakit. Catatan kaki tetap mencatat arti leksikal yang lebih luas, “diselamatkan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Ia” dipakai untuk menjaga ragam yang bermartabat, sedangkan susunan kalimat tetap alami. Penanda catatan ditempatkan langsung sesudah kata yang dijelaskan.
