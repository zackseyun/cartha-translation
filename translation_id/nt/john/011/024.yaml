base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: id
  text: Marta berkata kepadanya, “Aku tahu bahwa ia akan bangkit pada kebangkitan[a], pada hari terakhir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kebangkitan pada hari terakhir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: berkata
  rationale: Bentuk Yunani memakai kala kini historis, tetapi bentuk lampau naratif tersirat melalui konteks dan secara wajar diterjemahkan dengan “berkata” dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Pronomina datif ini menandai orang yang menjadi tujuan perkataan; “kepadanya” merupakan padanan Indonesia yang alami.
- source_word: ἡ Μάρθα
  choice: Marta
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; artikel Yunani tidak perlu diterjemahkan.
- source_word: Οἶδα
  choice: Aku tahu
  rationale: Ungkapan ini menyatakan pengetahuan atau keyakinan yang tegas; “Aku tahu” langsung, alami, dan tidak menambahkan kadar kepastian di luar teks.
- source_word: ἀναστήσεται
  choice: ia akan bangkit
  rationale: Dalam konteks kebangkitan, bentuk futur ini secara alami berarti bangkit dari kematian. “Bangkit” mempertahankan sudut pandang verbal Yunani tanpa mengubahnya menjadi bentuk pasif “dibangkitkan”.
- source_word: ἐν τῇ ἀναστάσει
  choice: dalam kebangkitan
  rationale: Padanan ini mempertahankan konstruksi ἐν dan dapat menunjuk pada lingkup atau waktu peristiwa kebangkitan, tanpa memaksakan salah satu nuansa.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: pada hari terakhir
  rationale: “Pada” adalah preposisi Indonesia yang alami untuk keterangan waktu berupa hari, sedangkan “hari terakhir” mempertahankan ungkapan eskatologis teks.
theological_decisions:
- issue: Rujukan kepada kebangkitan eskatologis
  choice: Marta menyatakan bahwa Lazarus akan bangkit dalam kebangkitan pada hari terakhir.
  alternative: Marta hanya menyatakan harapan umum tentang kehidupan setelah kematian.
  rationale: Pengulangan ἀναστήσεται dan ἀνάστασις, disertai frasa “hari terakhir,” secara khusus menunjuk kepada kebangkitan pada masa mendatang, tetapi terjemahan tidak menambahkan rincian doktrinal yang tidak dinyatakan ayat ini.
- issue: Nuansa ἐν dalam dua frasa waktu
  choice: Teks utama mempertahankan “dalam kebangkitan pada hari terakhir.”
  alternative: “pada waktu kebangkitan pada hari terakhir.”
  rationale: Bahasa Yunani memungkinkan ἐν τῇ ἀναστάσει dipahami sebagai lingkup atau waktu. Teks utama mempertahankan bentuk yang lebih dekat dengan sumber, sementara catatan kaki menyediakan ungkapan temporal yang lebih eksplisit tanpa meniadakan ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “Aku” dan “ia” menjaga dialog tetap alami; “ia” merujuk kepada Lazarus. Susunan kalimat mempertahankan pengulangan “bangkit/kebangkitan” yang terdapat dalam teks Yunani.
