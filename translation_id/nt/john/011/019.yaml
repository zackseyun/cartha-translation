  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: id
  text: Banyak orang Yahudi telah datang kepada Marta dan Maria untuk menghibur mereka berkenaan dengan saudara mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Banyak orang dari antara orang Yudea telah datang kepada Marta dan Maria.” Istilah Yunani yang digunakan dapat berarti orang Yahudi pada umumnya atau, dalam beberapa konteks dalam Injil Yohanes, orang Yudea secara lebih khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Banyak
  rationale: πολλοί berarti “banyak.” δέ merupakan penghubung ringan; dalam bahasa Indonesia hubungan wacananya sudah wajar tanpa harus dinyatakan dengan “dan,” “tetapi,” atau “adapun.”
- source_word: ἐκ τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Frasa ini bersifat partitif, yaitu banyak orang dari kalangan orang Yahudi. Dalam konteks ini, yang dimaksud paling wajar ialah orang-orang Yahudi yang datang melayat, bukan khusus para pemimpin Yahudi. Kemungkinan arti “orang Yudea” dicatat dalam catatan kaki.
- source_word: ἐληλύθεισαν
  choice: telah datang
  rationale: Bentuk pluperfek ἔρχομαι menunjukkan bahwa kedatangan mereka telah terjadi sebelum titik waktu narasi.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: kepada Marta dan Maria
  rationale: πρός dengan akusatif di sini menyatakan kedatangan atau kunjungan kepada orang. Bentuk nama Indonesia yang lazim ialah Marta dan Maria.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: untuk menghibur mereka
  rationale: ἵνα dengan subjungtif menyatakan tujuan. παραμυθέομαι dalam konteks perkabungan berarti menghibur atau memberi penghiburan.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: karena kematian saudara mereka
  rationale: Secara harfiah frasa ini berarti “mengenai saudara itu,” tetapi dalam konteks kedukaan, maksud idiomatisnya ialah menghibur mereka sehubungan dengan kematian saudara mereka. “Saudara mereka” menjelaskan bahwa ia saudara Marta dan Maria tanpa mengubah bentuk tunggal sumber.
theological_decisions:
- issue: Makna Ἰουδαίων dalam Injil Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Ayat ini bersifat deskriptif dan tidak polemis; rujukannya ialah para pelayat Yahudi yang mengunjungi Marta dan Maria. Namun, karena Ἰουδαῖοι dalam beberapa konteks Yohanes dapat menunjuk orang Yudea secara lebih khusus, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Ungkapan “karena kematian saudara mereka” menyampaikan konteks perkabungan secara jelas bagi pembaca umum; catatan kaki mempertahankan ambiguitas geografis-etnoreligius pada Ἰουδαίων.
