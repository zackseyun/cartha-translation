  naturalness: “Banyak orang Yahudi telah datang kepada Marta dan Maria untuk menghibur mereka berkenaan dengan saudara mereka” adalah bahasa Indonesia baku dan alami dalam register naratif Alkitab. “Berkenaan dengan” mempertahankan arti περί tanpa secara eksplisit memasukkan kematian.
  terminology: “Orang Yahudi,” “Marta,” dan “Maria” sudah tepat dan lazim. Catatan kaki dengan alternatif “orang Yudea” patut dipertahankan, karena Ἰουδαίων dapat dipahami secara lebih geografis dalam sejumlah konteks Yohanes.
