id: JHN.11.21
reference: John 11:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: id
  text: Maka Marta berkata kepada Yesus[a], “Tuhan, seandainya Engkau ada di sini, saudaraku tidak akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan”; kata Yunani κύριε dapat berfungsi sebagai sapaan hormat, tetapi “Tuhan” juga mempertahankan kemungkinan bobot teologisnya dalam Injil Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sekaligus kaitan logis dengan narasi sebelumnya secara alami dalam bahasa Indonesia.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan naratif yang lazim dan tepat untuk verba pengantar ujaran.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kepada Yesus
  rationale: πρός dengan akusatif setelah verba ujaran menunjukkan pihak yang disapa.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan fungsi sapaan hormat sekaligus kemungkinan bobot kristologis dalam Injil Yohanes.
- source_word: εἰ ἦς ὧδε
  choice: seandainya Engkau ada di sini
  rationale: Bentuk ini menyampaikan kondisi lampau yang berlawanan dengan kenyataan secara idiomatis; ὧδε berarti 'di sini'.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: tidak akan mati
  rationale: Dalam konstruksi bersyarat ini, οὐκ + ἄν + aoristus indikatif menyatakan akibat lampau yang tidak terjadi; konteks dan anak kalimat 'seandainya' membuat nilai kontrafaktualnya jelas.
- source_word: ὁ ἀδελφός μου
  choice: saudaraku
  rationale: Dalam konteks ini menunjuk kepada saudara laki-laki Marta, yakni Lazarus; bentuk Indonesia ini alami dan tidak perlu mengulang penanda gender yang telah jelas dari konteks.
theological_decisions:
- issue: Sapaan κύριος yang digunakan Marta kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: ‘Tuhan’ mempertahankan rentang makna antara sapaan penuh hormat dan kemungkinan gema kristologis, tanpa memaksa pembaca menentukan bobotnya hanya dari ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan kepada Yesus memakai huruf kapital sesuai kebiasaan penulisan religius Indonesia. Konstruksi ‘seandainya ... tidak akan mati’ dipilih agar kondisi lampau yang berlawanan dengan kenyataan tersampaikan tanpa ungkapan yang kaku.
