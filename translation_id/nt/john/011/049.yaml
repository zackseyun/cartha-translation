id: JHN.11.49
reference: John 11:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: id
  text: Namun, salah seorang dari mereka, yaitu Kayafas, yang pada tahun itu menjabat sebagai imam besar, berkata kepada mereka, “Kalian sama sekali tidak tahu apa-apa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Namun, salah seorang dari mereka
  rationale: Gabungan εἷς ... τις secara idiomatis menunjuk seorang anggota kelompok tanpa perlu menerjemahkan kedua unsurnya secara terpisah. δέ menyatakan peralihan bernuansa kontras, yang wajar diungkapkan dengan “Namun”.
- source_word: Καϊάφας
  choice: Kayafas
  rationale: Nama ini ditransliterasikan sesuai bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: yang pada tahun itu menjabat sebagai imam besar
  rationale: Frasa partisipial ini menerangkan Kayafas. “Menjabat sebagai imam besar” merupakan ungkapan Indonesia yang alami dan mempertahankan keterangan historis tentang kedudukannya pada tahun itu.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Terjemahan langsung dan alami bagi verba λέγω dengan objek tak langsung datif, tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Kalian sama sekali tidak tahu apa-apa
  rationale: Kata ganti eksplisit ὑμεῖς dan konstruksi negatif yang diperkuat menyampaikan teguran tajam kepada sekelompok lawan bicara. “Sama sekali tidak tahu apa-apa” mempertahankan penekanan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Keterangan waktu mengenai jabatan Kayafas
  choice: yang pada tahun itu menjabat sebagai imam besar
  alternative: yang menjadi imam besar pada tahun itu
  rationale: Terjemahan mempertahankan keterangan historis Yohanes tanpa menjelaskan alasan ungkapan “pada tahun itu” atau memasukkan penafsiran mengenai masa jabatan imam besar dan ironi naratif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai karena Kayafas berbicara kepada beberapa orang dan nada ucapannya langsung serta menegur; “Anda sekalian” akan terlalu formal dan mengurangi ketajaman teguran.
