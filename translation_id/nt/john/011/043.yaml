id: JHN.11.43
reference: John 11:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: id
  text: Setelah mengatakan hal-hal itu, ia berseru dengan suara keras, “Lazarus, keluarlah!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Bentuk jamak netral ini menunjuk pada perkataan yang baru saja diucapkan. “Hal-hal itu” mempertahankan bentuk jamaknya tanpa terdengar terlalu kaku.
- source_word: εἰπὼν
  choice: setelah mengatakan
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului kata kerja utama; “setelah mengatakan” menyampaikan urutan waktunya secara jelas dan alami.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara keras
  rationale: Frasa datif ini menyatakan cara dan menekankan kerasnya suara; ungkapan tersebut wajar dalam bahasa Indonesia modern.
- source_word: ἐκραύγασεν
  choice: ia berseru
  rationale: Kata kerja ini menggambarkan seruan lantang. “Berseru” mempertahankan daya ungkapnya, sedangkan kerasnya seruan dinyatakan secara eksplisit oleh frasa sebelumnya.
- source_word: Λάζαρε
  choice: Lazarus
  rationale: Bentuk vokatif nama Λάζαρος dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: δεῦρο ἔξω
  choice: keluarlah
  rationale: δεῦρο berfungsi sebagai ajakan atau perintah untuk datang, sedangkan ἔξω berarti ke luar. Dalam konteks Lazarus dipanggil dari kubur, “keluarlah” menyampaikan perintah gabungan itu secara ringkas, kuat, dan alami.
theological_decisions:
- issue: Menerjemahkan perintah mukjizat tanpa memakai ungkapan tradisional yang kaku
  choice: keluarlah
  alternative: marilah ke luar
  rationale: “Keluarlah” menyampaikan maksud δεῦρο ἔξω dalam bahasa Indonesia modern dan tidak menambahkan penafsiran teologis. Alternatif yang lebih harfiah terasa kurang alami dalam konteks perintah langsung ini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam bahasa Yunani serta penekanan pada kerasnya seruan, tanpa memakai ungkapan arkais.
