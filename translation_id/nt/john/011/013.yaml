  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: id
  text: Yesus sebenarnya telah berbicara tentang kematian Lazarus, tetapi mereka mengira bahwa Ia berbicara tentang tidur biasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tentang tidur dari tidur.” Maksudnya, mereka mengira Yesus sedang berbicara tentang tidur harfiah, bukan tentang kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: telah berbicara
  rationale: Bentuk pluskuamperfek menunjukkan bahwa perkataan Yesus mendahului kesalahpahaman para murid; dalam bahasa Indonesia, 'telah berbicara' menyampaikan hubungan waktu ini secara alami.
- source_word: δὲ ... δὲ
  choice: sebenarnya ... tetapi
  rationale: δέ pertama bersifat transisional sekaligus menjelaskan maksud Yesus yang sebenarnya, sedangkan δέ kedua menandai kontras dengan pemahaman para murid.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: tentang kematian Lazarus
  rationale: περί dengan genitif berarti 'tentang'. Referen αὐτοῦ adalah Lazarus; penyebutan namanya menghindari ambiguitas pronomina Indonesia yang dapat membuat pembaca mengira bahwa yang dimaksud ialah kematian Yesus.
- source_word: ἐκεῖνοι
  choice: mereka
  rationale: Kata tunjuk ini merujuk kepada para murid yang sudah disebut dalam konteks; 'mereka' merupakan padanan Indonesia yang wajar.
- source_word: ἔδοξαν
  choice: mengira
  rationale: Dalam konteks ini δοκέω menyatakan anggapan yang keliru; 'mengira' menyampaikan nuansa tersebut dengan ringkas.
- source_word: κοιμήσεως τοῦ ὕπνου
  choice: tidur dalam arti beristirahat
  rationale: Ungkapan genitif ini menunjuk pada tidur harfiah. Terjemahan ini mempertahankan kata 'tidur' sekaligus menjelaskan bahwa para murid memahaminya sebagai istirahat biasa, bukan kematian.
- source_word: λέγει
  choice: berbicara
  rationale: Bentuk present ini berfungsi dalam laporan tidak langsung setelah 'mengira'; bahasa Indonesia tidak perlu menandai historical present secara khusus.
theological_decisions:
- issue: Apakah gambaran tidur untuk kematian harus ditafsirkan sebagai ajaran tentang keadaan orang mati
  choice: Menyebut secara lugas bahwa maksud Yesus adalah kematian Lazarus dan bahwa para murid memahami 'tidur' secara harfiah.
  alternative: Memakai ungkapan yang mengisyaratkan suatu doktrin tertentu tentang keadaan jiwa setelah kematian.
  rationale: Ayat ini menjelaskan kesalahpahaman naratif antara penggunaan kiasan 'tidur' untuk kematian dan tidur harfiah; terjemahan tidak boleh menambahkan kesimpulan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Sebenarnya' mengantar penjelasan narator tanpa menambahkan penanda waktu. Nama 'Lazarus' dipakai untuk memperjelas referen αὐτοῦ. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
