  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: id
  text: Ada seorang yang sakit, yaitu Lazarus, dari Betania, dari desa Maria dan Marta, saudara perempuan Maria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Ada
  rationale: Bentuk ini membuka episode baru dengan penghubung naratif ringan. Dalam bahasa Indonesia, “Ada” menyampaikan keberadaan tokoh secara alami tanpa menambahkan penanda waktu yang tidak dinyatakan secara eksplisit.
- source_word: τις
  choice: seorang
  rationale: Kata ganti tak tentu ini memperkenalkan seseorang yang tertentu tetapi belum diperkenalkan; “seorang” sesuai karena tokohnya kemudian disebut sebagai Lazarus.
- source_word: ἀσθενῶν
  choice: sedang sakit
  rationale: Dalam konteks ini, verba tersebut berarti menderita sakit, bukan sekadar lemah. “Sedang” mempertahankan nuansa keadaan yang berlangsung dari bentuk partisipel kini.
- source_word: Λάζαρος
  choice: Lazarus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἀπὸ Βηθανίας
  choice: dari Betania
  rationale: ἀπό menyatakan asal; “dari Betania” merupakan padanan langsung dan alami.
- source_word: ἐκ τῆς κώμης
  choice: desa tempat ... tinggal
  rationale: κώμη menunjuk permukiman kecil, sehingga diterjemahkan “desa”. Susunan “tempat ... tinggal” membuat hubungan genitif dengan Maria dan Marta jelas dan wajar dalam bahasa Indonesia.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: Maria dan Marta, saudara perempuan Maria
  rationale: Frasa ini mengaitkan desa itu dengan Maria dan Marta serta menjelaskan bahwa Marta adalah saudara perempuan Maria. Pengulangan nama “Maria” mencegah ketidakjelasan rujukan kata ganti dalam bahasa Indonesia.
