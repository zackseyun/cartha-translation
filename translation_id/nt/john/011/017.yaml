  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: id
  text: Maka ketika Yesus tiba, Ia mendapati Lazarus sudah empat hari berada di dalam makam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: Ketika Yesus tiba
  rationale: Partisip aoris menyatakan tindakan yang mendahului atau menyertai verba utama. Bentuk temporal ini alami dalam narasi Indonesia, sedangkan “setelah datang” terasa lebih kaku.
- source_word: οὖν
  choice: tidak diterjemahkan secara tersendiri
  rationale: Di sini οὖν terutama menjadi penghubung alur narasi. Hubungan dengan konteks tetap jelas melalui pembukaan “Ketika Yesus tiba”; menambahkan “maka” dimungkinkan, tetapi kurang alami dalam kalimat ini.
- source_word: εὗρεν
  choice: didapati-Nya bahwa
  rationale: Dalam konteks ini εὗρεν menyatakan keadaan yang Yesus temukan pada saat tiba. Bentuk Indonesia ini menyampaikan hasil pengamatan secara alami tanpa menyiratkan bahwa lokasi Lazarus sebelumnya tidak diketahui.
- source_word: αὐτὸν
  choice: Lazarus
  rationale: Pronomina Yunani merujuk dengan jelas kepada Lazarus dalam konteks sebelumnya. Menyebut namanya menghindari ketaksaan dalam bahasa Indonesia tanpa menambahkan informasi baru.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: sudah empat hari berada
  rationale: Ungkapan Yunani secara idiomatis menunjukkan lamanya keadaan tersebut. “Sudah empat hari berada” mempertahankan aspek duratif dan ἤδη dengan bahasa Indonesia yang wajar.
- source_word: μνημείῳ
  choice: makam
  rationale: μνημεῖον di sini adalah tempat penguburan. “Makam” merupakan padanan modern dan tepat dalam konteks Lazarus.
theological_decisions:
- issue: Penyebutan rujukan αὐτόν
  choice: Menyebut Lazarus secara eksplisit
  alternative: Mempertahankan pronomina “dia”
  rationale: Rujukannya jelas dalam teks sumber, tetapi penyebutan nama membuat kalimat Indonesia tidak rancu dan tidak mengubah muatan teologis.
- issue: Makna durasi empat hari
  choice: Menghubungkan empat hari dengan keberadaan Lazarus di dalam makam
  alternative: Menerjemahkan lebih harfiah sebagai “telah mempunyai empat hari di dalam makam”
  rationale: Konstruksi Yunani adalah idiom durasi. Terjemahan yang dipilih menyatakan lamanya ia telah berada di makam tanpa menambahkan penjelasan mengenai waktu kematian atau penguburannya di luar yang dinyatakan konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif “didapati-Nya” lazim dalam gaya naratif Alkitab Indonesia, tetap mudah dipahami, dan mempertahankan Yesus sebagai pelaku verba utama.
