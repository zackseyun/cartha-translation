  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: id
  text: Setelah mengatakan hal-hal ini, Ia berkata kepada mereka, “Lazarus, sahabat kita, telah tertidur[a], tetapi Aku pergi untuk membangunkannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menjelaskan kiasannya, “telah meninggal.” Di sini Yesus memakai tidur sebagai kiasan untuk kematian; para murid pada mulanya salah memahami perkataan-Nya dalam ayat-ayat berikutnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Setelah mengatakan semuanya itu
  rationale: Ungkapan ini merujuk kembali kepada perkataan Yesus sebelumnya dan menandai urutan waktu. Bentuk ini alami dalam bahasa Indonesia serta tetap mencerminkan demonstrativa jamak ταῦτα.
- source_word: λέγει αὐτοῖς
  choice: Dia berkata kepada mereka
  rationale: Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang wajar tanpa mengubah urutan peristiwa.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Lazarus, sahabat kita
  rationale: Mempertahankan nama diri dan tekanan relasional dari frasa Yunani dalam susunan Indonesia yang alami.
- source_word: κεκοίμηται
  choice: sudah tertidur
  rationale: Bentuk perfek menyatakan keadaan yang telah terjadi dan masih berlaku. Metafora tidur dipertahankan agar kesalahpahaman para murid dalam ayat-ayat berikutnya tetap berfungsi.
- source_word: ἀλλὰ πορεύομαι
  choice: tetapi Aku akan pergi
  rationale: Konjungsi pertentangan dipertahankan, sedangkan gerak yang segera dan disengaja dinyatakan secara alami dalam bahasa Indonesia dengan 'akan pergi'.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: untuk membangunkannya
  rationale: Infinitif tujuan Indonesia menyampaikan fungsi purposif ἵνα dengan jelas sekaligus mempertahankan gambaran tidur dan bangun.
theological_decisions:
- issue: Apakah κεκοίμηται diterjemahkan secara interpretatif sebagai 'sudah meninggal' atau metaforanya dipertahankan
  choice: Metafora dipertahankan dalam teks utama sebagai 'sudah tertidur'.
  alternative: sudah meninggal
  rationale: Yesus memakai tidur sebagai kiasan bagi kematian, sedangkan para murid mula-mula memahaminya secara harfiah. Mempertahankan metafora menjaga ketegangan naratif dan tidak memberikan penjelasan sebelum waktunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami digunakan tanpa menghilangkan gaya naratif yang bermartabat. Kata ganti yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman luas dalam penerbitan Alkitab bahasa Indonesia; kapitalisasi ini tidak dimaksudkan untuk menyelesaikan ambiguitas yang tidak terdapat dalam sumber.
