  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: id
  text: Dan demi kamu Aku bersukacita atas kenyataan bahwa Aku tidak berada di sana, supaya kamu percaya.[a] Namun, marilah kita pergi kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya kamu mulai percaya.” Bentuk subjungtif aoris Yunani dapat dipahami dengan nuansa mulai memasuki keadaan percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: aku bersukacita
  rationale: Menyampaikan afek positif dari verba kini orang pertama tunggal dengan bahasa yang wajar dan bermartabat; lebih kuat daripada sekadar 'aku senang' tanpa menjadi kaku.
- source_word: δι’ ὑμᾶς
  choice: demi kamu
  rationale: διά dengan akusatif di sini paling alami menyatakan kepentingan atau manfaat bagi para murid, bukan sekadar sebab.
- source_word: ἵνα πιστεύσητε
  choice: supaya kamu percaya
  rationale: ἵνα dengan subjungtif aoris menyatakan tujuan. 'Percaya' mempertahankan keluasan makna Yohanes tanpa memastikan bahwa para murid sebelumnya sama sekali tidak percaya.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: bahwa aku tidak berada di sana
  rationale: ὅτι dipahami sebagai pengantar isi sukacita Yesus, sedangkan bentuk imperfek εἰμί diterjemahkan secara langsung dan alami.
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai kontras sekaligus peralihan dari penjelasan menuju tindakan; 'namun' terdengar alami dalam register naratif yang bermartabat.
- source_word: ἄγωμεν
  choice: marilah kita pergi
  rationale: Subjungtif kini orang pertama jamak berfungsi sebagai ajakan; bentuk ini merupakan padanan Indonesia yang jelas dan alami.
- source_word: πρὸς αὐτόν
  choice: kepadanya
  rationale: πρός dengan akusatif menyatakan gerak menuju seseorang; konteks menjelaskan bahwa yang dimaksud ialah Lazarus.
theological_decisions:
- issue: Daya aspek πιστεύσητε dalam konteks Yohanes
  choice: percaya
  alternative: mulai percaya
  rationale: Aoris subjungtif dapat dibaca secara ingresif, tetapi tidak mengharuskan kesimpulan bahwa para murid sebelumnya sama sekali belum percaya. Teks utama mempertahankan ungkapan yang lebih luas, sedangkan kemungkinan ingresif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'aku' dan 'kamu' mengikuti tuturan langsung Yesus kepada para murid. Susunan klausa dipertahankan sedekat mungkin dengan sumber selama tetap alami.
