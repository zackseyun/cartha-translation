  text: Jesus wept[a].
translation:
  language: id
  text: Yesus meneteskan air mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus menangis.” Kata kerja Yunani di sini secara khusus berarti meneteskan air mata dan berbeda dari kata untuk tangisan atau ratapan yang lebih keras dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: meneteskan air mata
  rationale: Bentuk aoristus aktif indikatif orang ketiga tunggal dari δακρύω menyatakan bahwa Yesus mencucurkan air mata. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kekhususan verba tersebut tanpa menambahkan nuansa bahwa tindakan itu baru mulai atau berupa ratapan keras.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri dengan artikel yang berfungsi sebagai subjek. Dalam bahasa Indonesia, artikel Yunani tidak diterjemahkan di depan nama diri.
theological_decisions:
- issue: Penggambaran emosi Yesus
  choice: Yesus meneteskan air mata
  alternative: Yesus menangis
  rationale: Terjemahan ini menyampaikan ungkapan emosi manusiawi Yesus secara langsung, tetapi tidak memperkuatnya menjadi ratapan keras. Tidak ada penjelasan doktrinal tambahan yang dimasukkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, alami, dan bermartabat. Susunan subjek-predikat mengikuti narasi Indonesia yang wajar; partikel seperti “maka” tidak ditambahkan karena tidak terdapat dalam teks Yunani.
