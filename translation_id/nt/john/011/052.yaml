reference: John 11:52
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: id
  text: dan bukan hanya bagi bangsa itu,[a] tetapi juga supaya Ia mengumpulkan anak-anak Allah yang tercerai-berai menjadi satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bangsa itu” dalam konteks ini merujuk kepada bangsa Yahudi.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: bangsa
  rationale: Dalam konteks langsungnya, bentuk tunggal ini menunjuk kepada bangsa Yahudi. “Bangsa” mempertahankan makna korporat tanpa memperluasnya menjadi bangsa-bangsa pada umumnya.
- source_word: ἵνα
  choice: supaya
  rationale: Secara alami memperkenalkan maksud atau hasil dalam bahasa Indonesia, sambil mempertahankan daya purposif klausa Yunani.
- source_word: τέκνα τοῦ θεοῦ
  choice: anak-anak Allah
  rationale: τέκνα mencakup semua gender dan secara langsung sepadan dengan ungkapan Indonesia “anak-anak Allah”.
- source_word: διεσκορπισμένα
  choice: yang tercerai-berai
  rationale: Partisipel perfektif pasif ini menggambarkan keadaan mereka yang telah tersebar; “tercerai-berai” alami dan mempertahankan nuansa keadaan tersebut.
- source_word: συναγάγῃ
  choice: Ia mengumpulkan
  rationale: Subjungtif aoris sesudah ἵνα dinyatakan secara idiomatis melalui klausa “supaya Ia mengumpulkan”; bahasa Indonesia tidak memerlukan penanda modal tersendiri.
- source_word: εἰς ἕν
  choice: menjadi satu
  rationale: Mempertahankan keringkasan teks Yunani tanpa menambahkan “tubuh” atau menjelaskan jenis kesatuan yang dimaksud.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: dan bukan hanya bagi bangsa itu, tetapi juga
  rationale: Melanjutkan gagasan ayat sebelumnya mengenai kematian Yesus bagi pihak lain. “Bagi” menyampaikan ὑπέρ dengan alami, sedangkan “bangsa itu” menandai rujukan khusus dalam konteks.
theological_decisions:
- issue: Identitas “anak-anak Allah”
  choice: Dibiarkan sebagai sebutan luas bagi anak-anak Allah di luar cakupan “bangsa itu” yang akan dikumpulkan melalui kematian Yesus.
  alternative: Hanya orang Yahudi diaspora; atau orang-orang pilihan dari kalangan Yahudi dan non-Yahudi.
  rationale: Ayat ini membedakan bangsa Yahudi dari kelompok anak-anak Allah yang tercerai-berai, tetapi tidak secara eksplisit menentukan cakupan kelompok kedua. Terjemahan tidak mempersempit ambiguitas tersebut.
- issue: Jenis kesatuan dalam εἰς ἕν
  choice: “menjadi satu” tanpa menambahkan kata benda penjelas
  alternative: “menjadi satu tubuh” atau “dalam kesatuan”
  rationale: Bahasa Yunani tidak menyebut “tubuh” dan membiarkan sifat kesatuan itu tetap ringkas serta terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat mempertahankan hubungan dengan ayat sebelumnya; huruf kapital pada “Ia” mengikuti konvensi umum teks Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
