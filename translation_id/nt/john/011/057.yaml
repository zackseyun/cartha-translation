  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: id
  text: 'Para imam kepala dan orang-orang Farisi telah mengeluarkan perintah: siapa pun yang mengetahui di mana Ia berada harus melaporkannya, supaya mereka dapat menangkap-Nya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: telah mengeluarkan
  rationale: Bentuk pluskuamperfek menunjukkan tindakan yang sudah dilakukan sebelum titik waktu narasi. Dalam bahasa Indonesia, “telah mengeluarkan perintah” menyampaikan tindakan yang telah selesai secara alami tanpa harus menandai urutan waktu secara berlebihan.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini menandai kelanjutan narasi yang lemah, bukan pertentangan tegas. Dalam bahasa Indonesia, hubungan itu sudah wajar dari konteks; penambahan “sekarang”, “tetapi”, atau “sementara itu” akan memberi nuansa yang lebih khusus daripada teks sumber.
- source_word: οἱ ἀρχιερεῖς
  choice: para imam kepala
  rationale: Dalam konteks Yahudi abad pertama, bentuk jamak ini menunjuk para pemimpin kalangan imam, bukan beberapa imam besar yang sedang menjabat.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok Yahudi tersebut.
- source_word: ἐντολὰς
  choice: perintah
  rationale: Konteksnya adalah arahan resmi dan berwenang. Bahasa Indonesia lazim memakai “perintah” sebagai nomina kolektif tanpa harus menggandakan bentuk jamaknya.
- source_word: ἵνα ἐάν τις γνῷ
  choice: siapa pun yang mengetahui
  rationale: Rumusan ini menyampaikan isi perintah beserta unsur syarat umum secara ringkas dan alami dalam bahasa Indonesia.
- source_word: ποῦ ἐστιν
  choice: di mana Ia berada
  rationale: Bahasa Indonesia tidak mewajibkan perubahan kala dalam ujaran tidak langsung, sehingga bentuk ini secara alami mempertahankan kala kini Yunani tanpa terdengar kaku.
- source_word: μηνύσῃ
  choice: harus melaporkannya
  rationale: Kata ini berarti memberitahukan atau melaporkan informasi, khususnya kepada pihak berwenang. “Harus” menyatakan daya perintah dalam konstruksi tersebut, sedangkan “-nya” merujuk pada informasi tentang lokasi Yesus.
- source_word: ὅπως
  choice: supaya
  rationale: Menandai tujuan dari pelaporan dengan jelas dan alami.
- source_word: πιάσωσιν αὐτόν
  choice: mereka dapat menangkap-Nya
  rationale: πιάζω berarti menangkap atau menguasai seseorang. “Menangkap” sesuai dengan konteks dan tidak mempersempitnya menjadi istilah prosedural hukum tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda titik dua memperkenalkan isi perintah secara alami. Pronomina “Ia” dan akhiran “-Nya” mempertahankan rujukan kepada Yesus yang jelas dari konteks tanpa mengulang nama-Nya.
