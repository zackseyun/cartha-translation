  naturalness: “Maka, ketika” dapat dipahami, tetapi koma sesudah “Maka” membuat pembukaan kalimat agak tersendat dalam bahasa Indonesia modern. “Maka ketika” lebih lancar. Menyebut “Lazarus” memperjelas rujukan yang dalam bahasa Indonesia dapat menjadi kurang jelas bila hanya memakai “dia,” tanpa mengubah isi yang dimaksud oleh konteks langsung.
  terminology: Penggunaan “Ia” untuk Yesus dan “Lazarus” untuk orang yang sakit sesuai dengan register Alkitab bahasa Indonesia yang baku. “Sedang sakit,” “tetap tinggal,” dan “selama dua hari” merupakan padanan yang alami dan tepat. Tidak diperlukan catatan kaki, sebab bentuk kini Yunani telah cukup tersampaikan melalui “sedang sakit.”
