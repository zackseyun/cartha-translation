base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: id
  text: Maka ketika Ia mendengar bahwa Lazarus sedang sakit, Ia pun tetap tinggal selama dua hari di tempat Ia berada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Maka, ketika
  rationale: Gabungan ini menandai kelanjutan sekaligus hubungan logis dalam narasi. “Maka, ketika” mempertahankan daya penghubung οὖν dan makna temporal ὡς secara wajar dalam bahasa Indonesia.
- source_word: ἤκουσεν
  choice: Ia mendengar
  rationale: Aoristus ἀκούω menyatakan bahwa Yesus mendengar berita tersebut; padanan langsung ini tidak menambahkan gagasan seperti ‘diberi tahu’ atau ‘mengetahui’.
- source_word: ὅτι ἀσθενεῖ
  choice: bahwa dia sedang sakit
  rationale: Dalam konteks ini ἀσθενέω merujuk pada penyakit jasmani Lazarus. “Sedang sakit” secara alami mempertahankan bentuk kini Yunani sebagai keadaan yang berlangsung pada saat berita itu didengar. Huruf kecil pada “dia” membedakan Lazarus dari Yesus tanpa menambahkan namanya ke dalam teks.
- source_word: τότε μὲν
  choice: Ia tetap
  rationale: Dalam susunan kalimat Indonesia, kesinambungan waktu sudah dinyatakan oleh “Maka, ketika,” sedangkan “tetap” menyampaikan bahwa Yesus tidak segera berangkat. Partikel μέν bersifat ringan dan tidak memerlukan padanan tersendiri yang kaku.
- source_word: ἔμεινεν
  choice: tinggal
  rationale: Dalam konteks tempat, μένω berarti tetap berada atau tinggal. “Tinggal” merupakan padanan yang alami dan tepat.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: di tempat Ia berada
  rationale: Ungkapan ini mempertahankan penekanan lokatif dan sedikit pengulangan yang terdapat dalam bahasa Yunani tanpa menjadi tidak wajar dalam bahasa Indonesia.
- source_word: δύο ἡμέρας
  choice: selama dua hari
  rationale: Akusatif ini menyatakan lamanya waktu. “Selama dua hari” menyampaikan durasi secara jelas tanpa menambahkan kata “lagi,” yang tidak dinyatakan secara eksplisit dalam teks Yunani.
theological_decisions:
- issue: Implikasi naratif bahwa Yesus tidak segera pergi setelah mendengar penyakit Lazarus
  choice: 'Pernyataan diterjemahkan secara lugas: Ia tetap tinggal selama dua hari.'
  alternative: Menambahkan penjelasan bahwa penundaan itu merupakan strategi penuh belas kasihan, atau memperhalus kalimat untuk mengurangi ketegangannya.
  rationale: Ayat ini dengan sengaja menampilkan ketegangan antara berita tentang sakitnya Lazarus dan tindakan Yesus untuk tetap tinggal. Terjemahan tidak menjelaskan atau meredakan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk Yesus sesuai kebiasaan penulisan Alkitab bahasa Indonesia, sedangkan “dia” untuk Lazarus menjaga rujukan pronominal tetap jelas. Susunan kalimat dibuat dekat dengan alur Yunani tetapi tetap alami bagi pembaca umum.
