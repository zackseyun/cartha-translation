  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: id
  text: Ketika mendengar hal itu, Maria segera bangkit dan pergi menemui Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Perempuan itu, ketika mendengar, segera bangkit dan sedang pergi ke arah-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη
  choice: Maria
  rationale: Kata penunjuk ini merujuk kepada Maria dalam konteks langsung. Menyebut namanya menghasilkan bahasa Indonesia yang jelas dan alami tanpa mengubah rujukannya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini hanya menggerakkan alur narasi dengan ringan; hubungan antarklausa sudah tersampaikan secara alami melalui susunan kalimat Indonesia.
- source_word: ὡς ἤκουσεν
  choice: Begitu mendengar hal itu
  rationale: ὡς menyatakan hubungan waktu, sedangkan objek 'hal itu' tersirat dari pesan pada ayat sebelumnya. 'Begitu' menyampaikan urutan yang dekat tanpa harus menambahkan gagasan kausal.
- source_word: ἠγέρθη ταχὺ
  choice: segera bangkit
  rationale: Bentuk pasif ἠγέρθη dipakai secara intransitif dalam konteks ini, yaitu bangkit atau berdiri, bukan dibangkitkan oleh pelaku lain. 'Segera' menyampaikan ταχύ secara alami.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: pergi menemui Yesus
  rationale: Imperfek menggambarkan gerak menuju dirinya. Dalam bahasa Indonesia, 'pergi menemui' secara alami menyatakan gerak menuju seseorang; nama Yesus memperjelas rujukan pronomina dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan bermartabat. Penanda waktu ditempatkan di awal, dan rujukan pronomina diperjelas sebagai Maria dan Yesus agar mudah dipahami sebagai ayat mandiri. Catatan kaki mempertahankan bentuk demonstratif serta nuansa aspek imperfek dan arah gerak dalam teks Yunani.
