  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: id
  text: Kemudian Ia berkata kepada murid-murid, “Mari kita pergi ke Yudea lagi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Kemudian, sesudah itu
  rationale: Mempertahankan kedua penanda urutan waktu dalam teks Yunani tanpa menggabungkannya menjadi satu, meskipun dalam bahasa Indonesia terdapat sedikit pengulangan.
- source_word: λέγει
  choice: Ia berkata
  rationale: Bahasa Indonesia tidak menandai kala gramatikal seperti bahasa Yunani. Bentuk ini wajar dalam narasi dan tidak memaksakan kala lampau yang tidak dinyatakan oleh bentuk Indonesia.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: Menerjemahkan objek tak langsung secara langsung tanpa menambahkan kata 'Nya', yang tersirat dalam konteks tetapi tidak dinyatakan dalam teks Yunani.
- source_word: Ἄγωμεν
  choice: Mari kita pergi
  rationale: Menyampaikan subjunktif hortatoris orang pertama jamak sebagai ajakan yang alami dan jelas dalam bahasa Indonesia.
- source_word: εἰς τὴν Ἰουδαίαν πάλιν
  choice: pergi lagi ke Yudea
  rationale: Kata 'ke' secara alami menyatakan gerak menuju atau memasuki suatu wilayah dalam bahasa Indonesia, sedangkan 'lagi' mempertahankan gagasan kembali ke tempat yang pernah dikunjungi.
theological_decisions:
- issue: Kala kini historis dalam narasi Yohanes
  choice: Menggunakan 'Ia berkata' tanpa penandaan kala eksplisit
  alternative: Menambahkan penanda lampau seperti 'pada waktu itu Ia berkata' atau penanda kini seperti 'Ia berkata sekarang'
  rationale: Bahasa Indonesia tidak memiliki kontras morfologis antara kala kini dan lampau pada verba. Terjemahan yang tidak menambahkan penanda waktu mempertahankan keluwesan bahasa sasaran tanpa menghapus atau melebih-lebihkan gaya naratif Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan 'Mari kita' menyampaikan ajakan dengan wajar dan bermartabat. Huruf kapital pada 'Ia' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus, tanpa mengubah makna sumber.
