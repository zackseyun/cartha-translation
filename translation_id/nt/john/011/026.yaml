  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: id
  text: Dan setiap orang yang hidup dan percaya kepada-Ku sama sekali tidak akan mati selama-lamanya.[a] Percayakah engkau akan hal ini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani ini dapat juga diterjemahkan, “tidak akan mati untuk selama-lamanya.”
    reason: Menunjukkan susunan alternatif yang lebih idiomatis tanpa menghilangkan penyangkalan tegas οὐ μή maupun frasa εἰς τὸν αἰῶνα.
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: setiap orang yang hidup
  rationale: Mempertahankan cakupan universal πᾶς dan bentuk partisipial ὁ ζῶν secara alami dalam bahasa Indonesia.
- source_word: πιστεύων εἰς ἐμέ
  choice: percaya kepada-Ku
  rationale: Ungkapan πιστεύειν εἰς menunjuk pada kepercayaan yang diarahkan kepada pribadi Yesus; 'percaya kepada-Ku' merupakan padanan Indonesia yang alami.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: tidak akan pernah mati
  rationale: Gabungan οὐ μή dengan bentuk subjungtif menyatakan penyangkalan yang sangat tegas; 'tidak akan pernah' menyampaikan penegasan itu.
- source_word: εἰς τὸν αἰῶνα
  choice: selama-lamanya
  rationale: Frasa idiomatis ini berarti 'untuk selama-lamanya/selamanya'; diterjemahkan tersendiri agar unsur durasinya tidak hilang, walaupun dalam bahasa Indonesia menghasilkan penguatan bersama 'tidak akan pernah'.
- source_word: πιστεύεις τοῦτο
  choice: Percayakah kamu akan hal ini?
  rationale: Mempertahankan pertanyaan langsung Yesus dan acuan τοῦτο pada pernyataan yang baru disampaikan.
theological_decisions:
- issue: Ketegangan antara kematian jasmani dan janji bahwa orang percaya tidak akan mati selama-lamanya
  choice: Tidak akan pernah mati selama-lamanya
  alternative: Tidak akan mati untuk selama-lamanya / pasti akan hidup selama-lamanya
  rationale: Teks Yunani secara tegas memakai verba 'mati', bukan 'hidup', dan konteks Yohanes 11 sengaja mempertahankan ketegangan dengan kenyataan kematian jasmani. Terjemahan tidak menambahkan penjelasan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi enklitik '-Ku' mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab Indonesia; 'kamu' dipilih sebagai sapaan tunggal yang wajar dan jelas.
