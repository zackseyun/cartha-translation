id: JHN.11.37
reference: John 11:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: id
  text: Namun, beberapa di antara mereka berkata, “Bukankah orang ini, yang telah membuka mata orang buta itu, juga sanggup mencegah orang ini mati?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Namun, beberapa dari antara mereka
  rationale: τινές dengan ἐξ αὐτῶν berarti sebagian dari kelompok itu; δέ menandai kontras dengan tanggapan sebelumnya.
- source_word: εἶπαν
  choice: berkata
  rationale: Aoris indikatif dalam narasi secara wajar diterjemahkan dengan bentuk lampau yang dalam bahasa Indonesia cukup dinyatakan oleh verba tanpa penanda kala.
- source_word: Οὐκ ἐδύνατο
  choice: Bukankah ... sanggup
  rationale: Bentuk pertanyaan negatif ini bersifat retoris dan mengisyaratkan bahwa para penutur menganggap tindakan tersebut seharusnya berada dalam kemampuan Yesus.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: orang yang membuka mata orang buta itu
  rationale: Konstruksi partisipial mengidentifikasi Yesus melalui tanda dalam Yohanes 9; susunan ini alami dan tetap mempertahankan rujukan yang bernada menunjuk.
- source_word: ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ
  choice: juga mencegah orang ini mati
  rationale: Secara kontekstual, konstruksi ποιῆσαι ἵνα menyatakan tindakan yang menghasilkan Lazarus tidak mati. 'Mencegah ... mati' menyampaikan maksud itu secara ringkas dan alami tanpa menambahkan sebab atau cara.
theological_decisions:
- issue: Nada pertanyaan para penutur
  choice: Pertanyaan retoris yang menyiratkan kritik terhadap kegagalan Yesus mencegah kematian Lazarus
  alternative: Pertanyaan netral mengenai kemampuan Yesus
  rationale: Οὐκ pada awal pertanyaan mengharapkan jawaban positif dan dalam konteks ini memuat nada keberatan, tetapi terjemahan tidak menambahkan tuduhan yang tidak dinyatakan teks.
- issue: Ruang lingkup kemampuan Yesus
  choice: sanggup juga mencegah orang ini mati
  alternative: dapat membuat supaya orang ini tidak mati
  rationale: Terjemahan mempertahankan ketegangan naratif mengenai kemampuan Yesus dan kematian Lazarus tanpa menjelaskan alasan Yesus membiarkannya terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menandai kontras; 'sanggup' menyatakan kemampuan dengan jelas; 'mencegah orang ini mati' lebih alami daripada konstruksi harfiah 'membuat supaya ... tidak mati'. Tidak diperlukan catatan kaki karena alternatif Inggris pada dasarnya sama dengan terjemahan utama Indonesia.
