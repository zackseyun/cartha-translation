  naturalness: Kalimatnya pada dasarnya alami dan berregister baku. “Beberapa di antara mereka” lebih idiomatis daripada “beberapa dari antara mereka.” Penempatan “orang ini” sebelum klausa relatif juga menjaga kejelasan dan nada menunjuk dari teks Yunani.
  terminology: “Membuka mata orang buta itu,” “sanggup,” dan “mencegah ... mati” adalah pilihan yang jelas dan sesuai konteks. Pengulangan “orang ini” secara sengaja mempertahankan dua demonstratif Yunani yang masing-masing merujuk kepada Yesus dan Lazarus.
