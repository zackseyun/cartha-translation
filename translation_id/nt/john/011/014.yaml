  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: id
  text: Maka Yesus berkata terus terang kepada mereka, “Lazarus sudah meninggal.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: Maka
  rationale: Gabungan penanda urutan τότε dan penghubung transisional/inferensial οὖν menggerakkan wacana menuju penjelasan langsung. “Maka” menyampaikan perkembangan itu secara alami dalam bahasa Indonesia tanpa menggandakan penghubung.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Ungkapan ini secara langsung dan wajar menerjemahkan verba berkata dengan objek tak langsung, tanpa menambahkan nuansa yang tidak ada dalam sumber.
- source_word: παρρησίᾳ
  choice: terus terang
  rationale: Dalam konteks ini, kata tersebut menandai bahwa Yesus tidak lagi memakai ungkapan kiasan tentang tidur, melainkan berbicara secara terbuka dan tanpa ketaksaan.
- source_word: Λάζαρος
  choice: Lazarus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: ἀπέθανεν
  choice: sudah meninggal
  rationale: Aoris menyatakan peristiwa kematian yang telah terjadi. “Sudah meninggal” terdengar alami, menyampaikan selesainya peristiwa itu serta relevansinya bagi keadaan saat ini, dan sesuai dengan ragam yang bermartabat.
theological_decisions:
- issue: Sifat pernyataan Yesus mengenai keadaan Lazarus
  choice: Pernyataan langsung bahwa Lazarus telah meninggal secara fisik
  alternative: Mempertahankan kiasan bahwa Lazarus sedang tidur
  rationale: Konteks sebelumnya memakai gambaran tidur, tetapi ayat ini sendiri menjelaskannya dengan ἀπέθανεν. Karena sumber mengakhiri ketaksaan tersebut, terjemahan juga harus menyatakan kematian secara jelas.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Terus terang” mempertahankan kontras dengan ucapan kiasan sebelumnya, sedangkan “meninggal” dipilih daripada “mati” sebagai ungkapan yang lazim dan pantas untuk kematian seseorang.
