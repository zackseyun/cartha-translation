id: JHN.17.15
reference: John 17:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: id
  text: Aku tidak meminta supaya Engkau mengambil mereka dari dunia, tetapi supaya Engkau menjaga mereka dari si Jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjaga mereka dari kejahatan.” Frasa Yunani τοῦ πονηροῦ dapat berarti “si Jahat” atau “kejahatan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Aku meminta
  rationale: Bentuk kini orang pertama tunggal menyatakan permintaan Yesus yang sedang disampaikan. 'Meminta' mewakili makna leksikal secara langsung dan terdengar alami dalam konteks doa.
- source_word: ἄρῃς
  choice: mengambil
  rationale: Dalam konstruksi ἄρῃς ... ἐκ τοῦ κόσμου, αἴρω bermakna mengambil atau menyingkirkan. 'Mengambil ... dari dunia' alami dalam bahasa Indonesia dan tidak mempersempit caranya.
- source_word: κόσμου
  choice: dunia
  rationale: κόσμος dalam tulisan Yohanes dapat menunjuk pada tatanan manusia yang menentang Allah, tetapi 'dunia' mempertahankan keluasan istilah sumber.
- source_word: τηρήσῃς
  choice: menjaga
  rationale: τηρέω dapat berarti menjaga, memelihara, atau melindungi. 'Menjaga' ringkas, wajar, dan tidak menentukan secara berlebihan bentuk perlindungan yang dimaksud.
- source_word: ἐκ
  choice: dari
  rationale: Dengan τηρήσῃς, ἐκ menyatakan penjagaan atau perlindungan dari sesuatu. 'Dari' mempertahankan hubungan tersebut secara alami.
- source_word: τοῦ πονηροῦ
  choice: si Jahat
  rationale: Adjektiva genitif tunggal berartikel ini dapat dipahami sebagai maskulin ('si Jahat') atau netral ('kejahatan'). Pemakaian Yohanes mendukung rujukan personal, sedangkan ambiguitas aslinya dipertahankan melalui catatan kaki.
theological_decisions:
- issue: Apakah τοῦ πονηροῦ bersifat personal ('si Jahat') atau impersonal ('kejahatan')
  choice: si Jahat
  alternative: kejahatan
  rationale: Bentuk Yunani memang ambigu. Konteks perlindungan ilahi dan pemakaian Yohanes cukup mendukung rujukan personal, tetapi alternatif impersonal dicantumkan agar ketegangan teologis teks tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat tetapi mudah dipahami. Pronomina 'Aku' dan 'Engkau' memakai kapitalisasi konvensional untuk rujukan ilahi; 'si Jahat' dipilih sebagai sebutan personal tanpa menambahkan nama yang tidak terdapat dalam teks.
