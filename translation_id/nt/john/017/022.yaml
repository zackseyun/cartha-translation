  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: id
  text: Dan Aku telah memberikan kepada mereka kemuliaan yang telah Engkau berikan kepada-Ku[a], supaya mereka menjadi satu, sama seperti Kita adalah satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku juga telah memberikan kepada mereka kemuliaan yang telah Engkau berikan kepada-Ku.” Kata Yunani κἀγώ dapat mengandung penekanan tambahan, “Aku juga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Aku telah
  rationale: κἀγώ merupakan gabungan καί + ἐγώ dan dapat menyatakan kesinambungan ('dan Aku') atau penekanan tambahan ('Aku juga'). Dalam bahasa Indonesia, kesinambungan konteks dapat dipahami tanpa harus selalu menerjemahkan καί secara tersurat; kemungkinan makna tambahan dicatat dalam catatan kaki.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Dalam Injil Yohanes, δόξα lazim menunjuk pada kemuliaan ilahi, bukan sekadar kehormatan manusia. 'Kemuliaan' mempertahankan bobot teologis dan konsistensi istilah.
- source_word: ἣν δέδωκάς μοι
  choice: yang telah Engkau berikan kepada-Ku
  rationale: Bentuk perfek δέδωκάς menyatakan tindakan yang telah terlaksana dengan hasil yang tetap berlaku. 'Telah ... berikan' mengungkapkan aspek ini secara alami.
- source_word: δέδωκα αὐτοῖς
  choice: telah memberikan kepada mereka
  rationale: Bentuk perfek δέδωκα juga menggambarkan pemberian yang sudah terlaksana dan tetap berdampak. Susunan 'memberikan kepada mereka' alami dan jelas dalam bahasa Indonesia.
- source_word: ἵνα ὦσιν
  choice: supaya mereka menjadi
  rationale: ἵνα dengan bentuk subjungtif menyatakan tujuan atau hasil yang dimaksudkan. 'Supaya' mempertahankan daya telisnya, sedangkan 'menjadi' sesuai dengan ungkapan Indonesia yang alami untuk kesatuan yang dikehendaki.
- source_word: ἓν
  choice: satu
  rationale: Bentuk netral tunggal menekankan kesatuan, bukan bahwa mereka menjadi satu pribadi. 'Satu' mempertahankan ungkapan ringkas dan tidak mempersempit artinya menjadi jenis persatuan tertentu.
- source_word: καθὼς
  choice: sama seperti
  rationale: Ungkapan ini menandai perbandingan secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἡμεῖς ἕν
  choice: Kita adalah satu
  rationale: Kopula tidak diulang dalam bahasa Yunani, tetapi perlu dinyatakan dalam bahasa Indonesia. 'Kita' tepat karena Yesus berbicara kepada Bapa dan mencakup lawan bicara; 'adalah satu' mempertahankan perbandingan tanpa menafsirkan sifat kesatuan itu.
theological_decisions:
- issue: Sifat kesatuan orang percaya dibandingkan dengan kesatuan Bapa dan Anak
  choice: Menerjemahkan secara terbuka sebagai 'supaya mereka menjadi satu, sama seperti Kita adalah satu'.
  alternative: Menentukan kesatuan itu secara khusus sebagai kesatuan relasional, partisipasi dalam kehidupan ilahi, atau kesatuan kelembagaan gereja.
  rationale: Ayat ini membuat perbandingan nyata antara kesatuan para murid dan kesatuan Bapa-Anak, tetapi tidak menjelaskan di sini tepatnya dalam arti apa. Terjemahan mempertahankan ketegangan teologis tersebut tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur dipertahankan dekat dengan teks Yunani, tetapi tetap alami bagi pembaca umum.
