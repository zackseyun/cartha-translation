id: JHN.17.24
reference: John 17:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: id
  text: Bapa, Aku menghendaki agar mereka yang telah Engkau berikan kepada-Ku[a] juga berada bersama-Ku di tempat Aku berada, supaya mereka melihat kemuliaan-Ku yang telah Engkau berikan kepada-Ku, karena Engkau telah mengasihi Aku sebelum dunia dijadikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani memakai bentuk netral tunggal, “apa yang telah Engkau berikan kepada-Ku”. Ungkapan itu bersifat kolektif dan mengacu kepada orang-orang yang diberikan Bapa kepada Anak; kelanjutannya memakai bentuk jamak, “mereka”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebelum peletakan dasar dunia”.
    reason: literal_rendering
lexical_decisions:
- source_word: πάτερ
  choice: Bapa
  rationale: Sapaan langsung kepada Allah; “Bapa” merupakan padanan Indonesia yang baku, wajar, dan tidak menambahkan kata milik yang tidak terdapat dalam bahasa Yunani.
- source_word: ὃ δέδωκάς μοι
  choice: mereka yang telah Engkau berikan kepada-Ku
  rationale: Walaupun ὃ secara harfiah berbentuk netral tunggal, ungkapan ini bersifat kolektif dan mengacu kepada orang-orang, sebagaimana ditegaskan oleh bentuk jamak κἀκεῖνοι dan ὦσιν. “Mereka yang” menyampaikan acuannya secara alami.
- source_word: δέδωκάς
  choice: telah Engkau berikan
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dengan hasil yang tetap berlaku; “telah ... berikan” mempertahankan aspek itu secara idiomatis.
- source_word: θέλω
  choice: Aku menghendaki
  rationale: θέλω menyatakan kehendak atau keinginan yang kuat. “Menghendaki” mempertahankan daya volisionalnya dalam suasana doa tanpa mengubahnya menjadi pernyataan masa depan.
- source_word: ἵνα
  choice: agar / supaya
  rationale: ἵνα pertama memperkenalkan isi kehendak Yesus, sedangkan yang kedua menyatakan tujuan. Variasi “agar” dan “supaya” alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksis tersebut.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: di tempat Aku berada
  rationale: Padanan ini alami dalam bahasa Indonesia dan menyampaikan makna lokatif ὅπου. Pronomina eksplisit ἐγώ tidak perlu ditambah dengan “sendiri” yang dapat memberi nuansa lain.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: mereka ... juga berada bersama-Ku
  rationale: Penempatan “juga” sesudah subjek mempertahankan daya aditif κἀκεῖνοι dan menghasilkan susunan Indonesia yang jelas.
- source_word: θεωρῶσιν
  choice: melihat
  rationale: θεωρέω dapat berarti melihat, menyaksikan, atau memandang. “Melihat” merupakan padanan modern yang lugas tanpa menghilangkan kemungkinan nuansa kontemplatif dalam konteks kemuliaan.
- source_word: τὴν δόξαν τὴν ἐμὴν
  choice: kemuliaan-Ku
  rationale: Konstruksi artikel berulang dengan kata sifat posesif secara alami diterjemahkan “kemuliaan-Ku”, dengan kepemilikan tetap tegas.
- source_word: ἣν δέδωκάς μοι
  choice: yang telah Engkau berikan kepada-Ku
  rationale: Klausa relatif ini menerangkan kemuliaan tersebut; bentuk “telah ... berikan” kembali mencerminkan aspek perfek.
- source_word: ὅτι
  choice: karena
  rationale: Dalam konteks ini ὅτι paling wajar dibaca secara kausal, menghubungkan pemberian kemuliaan dengan kasih Bapa kepada Anak.
- source_word: ἠγάπησάς με
  choice: Engkau telah mengasihi Aku
  rationale: Keterangan waktu sebelum penciptaan mengacu kepada kasih Bapa yang nyata sebelum dunia ada. “Telah mengasihi” terdengar alami dalam bahasa Indonesia dan mempertahankan acuan lampau tanpa menyiratkan bahwa kasih itu berakhir.
- source_word: πρὸ καταβολῆς κόσμου
  choice: sebelum dunia dijadikan
  rationale: Secara idiomatis menyampaikan makna ‘sebelum peletakan dasar dunia’, yakni sebelum penciptaan dunia; bentuk harfiahnya dicatat agar metafora sumber tetap terlihat.
theological_decisions:
- issue: Praeksistensi Anak yang tersirat dalam kasih Bapa sebelum penciptaan
  choice: 'Pernyataan temporal dipertahankan secara langsung: “Engkau telah mengasihi Aku sebelum dunia dijadikan.”'
  alternative: Parafrasa yang memetaforakan atau melemahkan acuan sebelum penciptaan
  rationale: Bahasa Yunani menyatakan kasih Bapa kepada Yesus sebelum peletakan dasar dunia. Terjemahan mempertahankan klaim tersebut tanpa perluasan doktrinal.
- issue: Daya θέλω dalam doa Yesus
  choice: Aku menghendaki
  alternative: Aku mau / Aku berkehendak agar
  rationale: “Menghendaki” menyampaikan kemauan yang kuat dan tetap sesuai dengan konteks doa, tanpa mengubahnya menjadi dekret atau sekadar keinginan lemah.
- issue: Hubungan kausal ὅτι dengan pemberian kemuliaan
  choice: karena
  alternative: bahwa / sebab
  rationale: “Karena” mempertahankan pembacaan kausal yang paling wajar, tetapi terjemahan tidak menambahkan penjelasan tentang sifat atau waktu pemberian kemuliaan itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Huruf kapital pada kata ganti yang merujuk kepada Bapa dan Yesus mengikuti kebiasaan penulisan Alkitab Indonesia. Susunan kalimat dijaga tetap dekat dengan struktur Yunani, tetapi tidak kaku.
