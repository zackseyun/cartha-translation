id: JHN.17.12
reference: John 17:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: id
  text: Selama Aku bersama mereka, Aku memelihara mereka dalam nama-Mu, yaitu nama yang telah Engkau berikan kepada-Ku. Aku menjaga mereka, dan tidak seorang pun dari mereka binasa[a], kecuali anak kebinasaan[b], supaya Kitab Suci digenapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hilang.”
    reason: lexical_alternative
  - marker: b
    text: “Anak kebinasaan” adalah ungkapan bergaya Ibrani; dapat juga dipahami sebagai “orang yang ditentukan untuk binasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Selama Aku bersama mereka
  rationale: “Selama” menyampaikan keadaan dan tindakan yang berlangsung sepanjang masa kebersamaan Yesus dengan para murid.
- source_word: ἐτήρουν αὐτοὺς
  choice: Aku memelihara mereka
  rationale: “Memelihara” menyatakan tindakan terus-menerus untuk menjaga mereka dan tetap membedakannya dari ἐφύλαξα.
- source_word: ἐν τῷ ὀνόματί σου
  choice: dalam nama-Mu
  rationale: Bentuk formal ini mempertahankan keluasan makna “nama” sebagai penyataan diri dan kewibawaan Allah tanpa menambahkan tafsiran ke dalam teks.
- source_word: ᾧ δέδωκάς μοι
  choice: yaitu nama yang telah Engkau berikan kepada-Ku
  rationale: Klausa diperjelas secara alami dalam bahasa Indonesia dengan mengulang “nama”; ini mengikuti kata ganti relatif netral tunggal yang merujuk kepada “nama”, bukan kepada para murid.
- source_word: καὶ ἐφύλαξα
  choice: Aku menjaga mereka
  rationale: “Menjaga” mempertahankan nuansa perlindungan dan variasi verba terhadap “memelihara” untuk τηρέω.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: tidak seorang pun dari mereka binasa
  rationale: “Binasa” sesuai dengan makna intransitif ἀπόλλυμι dalam konteks yang khidmat; alternatif “hilang” dicantumkan dalam catatan kaki.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: anak kebinasaan
  rationale: Ungkapan formal ini mempertahankan idiom Semitis dan ketegangan teologisnya, tanpa menguraikannya menjadi pernyataan doktrinal.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: supaya Kitab Suci digenapi
  rationale: “Supaya” mempertahankan kemungkinan nuansa tujuan/hasil dari ἵνα, sedangkan bentuk pasif “digenapi” mengikuti teks Yunani.
theological_decisions:
- issue: Rujukan ᾧ δέδωκάς μοι
  choice: 'Klausa relatif menerangkan “nama-Mu”: “nama yang telah Engkau berikan kepada-Ku”.'
  alternative: 'Klausa tersebut menerangkan para murid: “mereka yang telah Engkau berikan kepada-Ku”.'
  rationale: Dalam teks SBLGNT, kata ganti relatif berbentuk netral tunggal dan paling wajar bersesuaian dengan ὀνόματι, bukan dengan αὐτούς yang maskulin jamak.
- issue: Makna ὁ υἱὸς τῆς ἀπωλείας
  choice: “anak kebinasaan” sebagai ungkapan Semitis yang dipertahankan secara formal.
  alternative: “orang yang ditentukan untuk binasa” atau bentuk tradisional “anak kebinasaan/perdition”.
  rationale: Teks utama tidak memperluas ungkapan itu menjadi ajaran eksplisit mengenai penentuan nasib; catatan kaki menerangkan kemungkinan maknanya.
- issue: Nuansa ἵνα dalam penggenapan Kitab Suci
  choice: “supaya Kitab Suci digenapi”.
  alternative: “sehingga Kitab Suci digenapi”.
  rationale: “Supaya” menjaga nuansa tujuan tanpa meniadakan kemungkinan hubungan hasil yang terkandung dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Sapaan ilahi memakai huruf kapital. Susunan kalimat dibuat alami, tetapi hubungan gramatikal klausa tentang nama, pembedaan kedua verba penjagaan, dan idiom “anak kebinasaan” tetap dipertahankan.
