  source_fidelity: Terjemahan mengikuti teks SBLGNT dengan baik. “Selama Aku bersama mereka” menyampaikan latar waktu yang berlangsung; “memelihara” dan “menjaga” secara tepat membedakan τηρέω dan φυλάσσω. Klausa “nama yang telah Engkau berikan kepada-Ku” dengan tepat merujuk pada ὀνόματι melalui kata ganti relatif netral tunggal, bukan kepada para murid. “Tidak seorang pun ... binasa” serta “supaya Kitab Suci digenapi” mempertahankan makna dan hubungan sintaksis Yunani.
