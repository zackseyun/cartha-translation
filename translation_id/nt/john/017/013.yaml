  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: id
  text: Namun sekarang Aku datang kepada-Mu, dan Aku mengatakan semua ini di dunia supaya sukacita-Ku menjadi penuh dalam diri mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “supaya mereka memiliki sukacita-Ku yang dipenuhi dalam diri mereka,” atau “supaya sukacita-Ku menjadi lengkap dalam diri mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Namun sekarang
  rationale: νῦν menandai saat kini, sedangkan δέ memberi peralihan dengan nuansa kontras ringan; “Namun sekarang” alami dan tidak melebih-lebihkan pertentangan.
- source_word: πρὸς σὲ ἔρχομαι
  choice: Aku datang kepada-Mu
  rationale: ἔρχομαι dengan πρὸς menyatakan gerak menuju Bapa. Bentuk kini juga dapat mengacu pada tindakan yang segera terjadi; bahasa Indonesia tidak perlu menandai aspek progresif secara khusus.
- source_word: ταῦτα λαλῶ
  choice: Aku mengatakan hal-hal ini
  rationale: Ungkapan ini mempertahankan rujukan pada perkataan yang sedang Yesus ucapkan dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐν τῷ κόσμῳ
  choice: selama Aku berada di dunia
  rationale: Secara idiomatis memperjelas bahwa perkataan itu diucapkan ketika Yesus masih berada dalam lingkup dunia, tanpa menghilangkan istilah khas Yohanes “dunia”.
- source_word: ἵνα ἔχωσιν
  choice: supaya ... di dalam diri mereka
  rationale: 'ἵνα menyatakan tujuan, dan ἔχωσιν dipadukan secara alami dengan konstruksi hasil πεπληρωμένην: mereka memiliki sukacita Yesus dalam keadaan penuh.'
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: sukacita-Ku
  rationale: Konstruksi artikel dan posesif menegaskan sukacita yang merupakan milik Yesus; bentuk ringkas ini alami serta mempertahankan makna tersebut.
- source_word: πεπληρωμένην
  choice: menjadi penuh
  rationale: Partisip perfek pasif πληρόω menggambarkan sukacita yang telah dibawa kepada kepenuhannya. “Menjadi penuh” mempertahankan citra kepenuhan dan keadaan hasil secara alami.
- source_word: ἐν ἑαυτοῖς
  choice: di dalam diri mereka
  rationale: Kata ganti refleksif paling wajar menunjuk pada sukacita yang dialami secara batin oleh para murid, sambil tetap membiarkan kemungkinan terjemahan yang lebih harfiah.
theological_decisions:
- issue: Hakikat “sukacita-Ku”
  choice: Sukacita yang merupakan milik Yesus dan hadir sepenuhnya dalam diri para murid
  alternative: Sukacita tentang Yesus
  rationale: Posesif ἐμὴν paling alami menunjuk pada sukacita Yesus sendiri. Terjemahan tidak memperluasnya menjadi ajaran tertentu tentang bagaimana sukacita itu dibagikan.
- issue: Hubungan πεπληρωμένην dengan sukacita
  choice: sukacita-Ku menjadi penuh di dalam diri mereka
  alternative: mereka dipenuhi dengan sukacita-Ku
  rationale: Secara gramatikal, πεπληρωμένην menerangkan τὴν χαράν, sehingga yang dinyatakan penuh adalah sukacita, bukan para murid secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Bapa dan Yesus mengikuti kelaziman penerbitan Alkitab Indonesia. Klausa “selama Aku berada di dunia” dipilih agar relasi temporal-lokatif terdengar alami.
