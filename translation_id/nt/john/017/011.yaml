  terminology: “Dunia,” “Bapa yang kudus,” “peliharalah,” “dalam nama-Mu,” dan “menjadi satu” mempertahankan istilah serta keluasan makna teks Yunani dengan baik. Kapitalisasi kata ganti ilahi konsisten dengan kebiasaan Alkitab bahasa Indonesia.
