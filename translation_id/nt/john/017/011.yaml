  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: id
  text: Aku tidak lagi berada di dalam dunia, dan mereka berada di dalam dunia, dan Aku datang kepada-Mu. Bapa yang kudus, peliharalah mereka dalam nama-Mu[a] yang telah Engkau berikan kepada-Ku[b], supaya mereka menjadi satu, sama seperti Kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peliharalah mereka oleh nama-Mu” atau “lindungilah mereka melalui nama-Mu.” Frasa Yunani ini dapat menyatakan lingkup, sarana, atau otoritas.
    reason: lexical_alternative
  - marker: b
    text: Sebagian naskah dibaca atau dipahami sebagai “peliharalah mereka dalam nama-Mu, orang-orang yang telah Engkau berikan kepada-Ku.” Terjemahan ini mengikuti bacaan SBLGNT, yang menghubungkan kata “yang” dengan “nama.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: tidak lagi
  rationale: Ungkapan temporal yang wajar dalam bahasa Indonesia dan menyatakan bahwa keadaan tersebut telah berakhir dari sudut pandang Yesus saat berbicara.
- source_word: κόσμος
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes bagi ranah kehidupan manusia di bumi tempat para murid masih berada, tanpa mempersempitnya menjadi 'masyarakat' atau 'zaman'.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: dan Aku datang kepada-Mu
  rationale: Bentuk kini Yunani menunjuk pada kedatangan yang segera atau sedang menuju penggenapan. 'Datang kepada-Mu' mempertahankan sudut ungkap verba Yunani tanpa mengubahnya menjadi 'pergi'.
- source_word: πάτερ ἅγιε
  choice: Bapa yang kudus
  rationale: Sapaan vokatif ini diterjemahkan secara alami dan bermartabat, dengan tetap mempertahankan keakraban 'Bapa' dan sifat kekudusan-Nya.
- source_word: τήρησον
  choice: peliharalah
  rationale: Kata τηρέω mencakup menjaga, melindungi, dan mempertahankan. 'Peliharalah' cukup luas untuk tidak membatasi maknanya hanya pada perlindungan fisik.
- source_word: ἐν τῷ ὀνόματί σου
  choice: dalam nama-Mu
  rationale: Terjemahan ini mempertahankan kemungkinan bahwa ἐν menyatakan lingkup, sarana, atau otoritas, alih-alih menetapkan satu tafsiran saja.
- source_word: ᾧ δέδωκάς μοι
  choice: yang telah Engkau berikan kepada-Ku
  rationale: Kata ganti relatif ᾧ bersesuaian dengan ὀνόματι ('nama'), sehingga dalam teks SBLGNT klausa ini menerangkan nama yang diberikan Bapa kepada Anak.
- source_word: ἵνα ὦσιν ἓν
  choice: supaya mereka menjadi satu
  rationale: ἵνα menyatakan tujuan, sedangkan bentuk netral tunggal ἓν menyatakan kesatuan tanpa mengatakan bahwa para murid menjadi satu pribadi atau satu benda.
- source_word: καθὼς ἡμεῖς
  choice: sama seperti Kita
  rationale: καθώς menyatakan perbandingan. Karena Yesus berbicara kepada Bapa, kata ganti inklusif 'Kita' secara tepat mencakup pembicara dan lawan bicara serta mempertahankan bobot perbandingan itu.
theological_decisions:
- issue: Makna 'peliharalah mereka dalam nama-Mu'
  choice: Frasa utama dipertahankan sebagai 'dalam nama-Mu'.
  alternative: '''oleh nama-Mu'' atau ''melalui nama-Mu'''
  rationale: Bahasa Yunani dapat menunjuk pada lingkup, sarana, otoritas, atau kenyataan yang diungkapkan oleh nama Allah. Terjemahan utama tidak memilih salah satu secara eksklusif.
- issue: Kesatuan para murid 'sama seperti Kita'
  choice: Mempertahankan perbandingan langsung tanpa menjelaskan hakikat kesatuan itu di dalam teks utama.
  alternative: Menafsirkannya hanya sebagai kesatuan moral atau, sebaliknya, sebagai identitas hakikat yang sama.
  rationale: Teks menyatakan analogi yang nyata antara kesatuan para murid dan kesatuan Bapa-Anak, tetapi ayat ini sendiri tidak merinci sifat atau batas analogi tersebut.
- issue: Acuan klausa relatif 'yang telah Engkau berikan kepada-Ku'
  choice: Klausa tersebut menerangkan 'nama-Mu'.
  alternative: Memahaminya sebagai 'orang-orang yang telah Engkau berikan kepada-Ku'.
  rationale: Terjemahan mengikuti teks SBLGNT yang diberikan, tempat bentuk kata ganti relatif bersesuaian dengan 'nama', sambil mencatat adanya varian naskah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan serta kata ganti yang merujuk langsung kepada Bapa dan Yesus ditulis dengan huruf kapital sesuai kebiasaan penerjemahan Alkitab bahasa Indonesia. Pengulangan 'di dalam dunia' dipertahankan untuk mencerminkan kesejajaran Yunani, sedangkan 'dalam nama-Mu' digunakan tanpa 'di' agar tetap alami sebagai ungkapan abstrak.
