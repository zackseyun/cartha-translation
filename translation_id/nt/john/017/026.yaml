  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: id
  text: Aku telah memperkenalkan nama-Mu kepada mereka[a], dan Aku akan memperkenalkannya, supaya kasih yang dengannya Engkau telah mengasihi Aku ada di dalam mereka[b], dan Aku di dalam mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah menyatakan nama-Mu kepada mereka, dan Aku akan menyatakannya.” “Nama-Mu” menunjuk kepada identitas dan sifat Allah sebagaimana Dia menyatakannya, bukan sekadar sebutan yang diucapkan.
    reason: lexical_alternative dan cultural_note
  - marker: b
    text: Atau, “di antara mereka”; namun, “di dalam mereka” lebih langsung dan mempertahankan tema Yohanes tentang kediaman ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: Aku telah memperkenalkan
  rationale: Aoristus aktif orang pertama tunggal dari γνωρίζω menyatakan tindakan membuat sesuatu dikenal. 'Memperkenalkan' alami dalam bahasa Indonesia ketika objeknya adalah 'nama-Mu' dan mempertahankan arti kausatifnya.
- source_word: τὸ ὄνομά σου
  choice: nama-Mu
  rationale: Mempertahankan ungkapan konkret Yunani tanpa menguraikannya menjadi 'siapa Engkau' atau 'karakter-Mu'; cakupannya dijelaskan dalam catatan kaki.
- source_word: γνωρίσω
  choice: Aku akan terus memperkenalkannya
  rationale: Bentuk futurum menunjuk pada tindakan yang akan datang. 'Terus' menyampaikan kelanjutan dari tindakan sebelumnya secara alami, sedangkan '-nya' merujuk kembali kepada nama Bapa.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan atau hasil yang dimaksud dengan wajar dalam bahasa Indonesia modern.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: kasih yang dengannya Engkau telah mengasihi Aku
  rationale: Mempertahankan hubungan erat antara kasih sebagai nomina dan tindakan Bapa mengasihi Anak, meskipun susunannya sengaja agak khidmat agar struktur sumber tetap terlihat.
- source_word: ἐν αὐτοῖς
  choice: di dalam mereka
  rationale: Padanan langsung yang juga mempertahankan tema Yohanes tentang kehadiran atau kediaman di dalam para murid; 'di antara mereka' tetap mungkin secara leksikal.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: dan Aku di dalam mereka
  rationale: Mempertahankan elipsis Yunani serta koordinasi ringkas antara kasih Bapa dan kehadiran Kristus tanpa menjelaskan hubungan teologis keduanya secara berlebihan.
theological_decisions:
- issue: Makna 'nama-Mu' dalam teologi Yohanes
  choice: Mempertahankan 'nama-Mu' dalam teks utama.
  alternative: siapa Engkau; karakter-Mu
  rationale: Ungkapan itu mencakup identitas dan sifat Bapa sebagaimana dinyatakan, tetapi teks Yunani tetap berkata 'nama'; penguraian dalam teks utama akan mempersempit atau menafsirkan metafora tersebut.
- issue: Hubungan kasih ilahi dengan kehadiran Kristus dalam klausa terakhir
  choice: 'Menyajikan keduanya secara koordinatif: kasih itu ada di dalam mereka, dan Aku di dalam mereka.'
  alternative: supaya ... Aku berada di dalam mereka; karena Aku berada di dalam mereka
  rationale: Bahasa Yunani mengoordinasikan kedua kenyataan itu dan tidak secara eksplisit menjadikan salah satunya sebab bagi yang lain.
- issue: Lingkup ἐν αὐτοῖς
  choice: di dalam mereka
  alternative: di antara mereka
  rationale: Keduanya mungkin dalam konteks tertentu, tetapi arti lokatif 'di dalam mereka' lebih langsung dan mempertahankan gema tema saling berdiam dalam Injil Yohanes.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi memakai huruf kapital. Struktur akhir yang eliptis dipertahankan karena jelas dalam bahasa Indonesia dan mencerminkan kepadatan teks Yunani.
