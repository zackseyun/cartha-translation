id: JHN.17.25
reference: John 17:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: id
  text: Ya Bapa yang adil, sekalipun dunia tidak mengenal Engkau, sedangkan Aku mengenal Engkau, dan mereka ini tahu bahwa Engkaulah yang mengutus Aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Ya Bapa yang benar
  rationale: Sapaan vokatif diterjemahkan secara alami dan khidmat. 'Benar' mempertahankan bobot moral δίκαιος tanpa membatasinya hanya pada keadilan yudisial.
- source_word: καὶ
  choice: sekalipun
  rationale: Dalam konteks ini, καὶ memiliki daya konsesif yang mengontraskan ketidaktahuan dunia dengan pengenalan Yesus akan Bapa.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes dan keluasan maknanya, termasuk umat manusia dalam keterasingannya dari Allah, tanpa mempersempitnya dalam teks utama.
- source_word: ἔγνω / ἔγνων
  choice: tidak mengenal / mengenal
  rationale: Bahasa Indonesia tidak mewajibkan penandaan kala seperti bahasa Inggris. Bentuk ini alami dan mempertahankan pengertian kognitif-relasional γινώσκω serta relevansinya dalam konteks.
- source_word: οὗτοι ἔγνωσαν
  choice: mereka ini tahu
  rationale: Οὗτοι ditampilkan dengan 'mereka ini' tanpa menambahkan 'murid-murid'; 'tahu' alami untuk isi proposisional yang diperkenalkan oleh ὅτι.
- source_word: σύ με ἀπέστειλας
  choice: Engkaulah yang mengutus Aku
  rationale: Konstruksi berpartikel -lah menyampaikan penekanan eksplisit pada σύ, sedangkan 'mengutus' mempertahankan nuansa perutusan ἀποστέλλω.
theological_decisions:
- issue: Atribut Bapa dalam δίκαιε
  choice: Bapa yang benar
  alternative: Bapa yang adil
  rationale: '''Benar'' mencakup kelurusan moral secara lebih luas; ''adil'' dapat terdengar terutama yudisial. Pilihan ini tidak meniadakan unsur keadilan dalam istilah Yunani.'
- issue: Makna κόσμος dalam konteks Yohanes
  choice: dunia
  alternative: manusia di dunia / tatanan dunia
  rationale: '''Dunia'' menjaga keluasan dan ketegangan teologis istilah Yunani, alih-alih menetapkan satu tafsiran dalam teks utama.'
- issue: Aspek bentuk aoristus γινώσκω
  choice: tidak mengenal / mengenal / tahu
  alternative: tidak pernah mengenal / telah mengenal / telah mengetahui
  rationale: Bahasa Indonesia menyampaikan hubungan waktu melalui konteks; penambahan 'telah' atau 'pernah' dapat memberi batas temporal yang tidak harus dinyatakan oleh aoristus di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Huruf kapital pada kata ganti yang merujuk kepada Bapa dan Yesus mengikuti gaya penghormatan yang lazim dalam terjemahan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena perbedaan aspek aoristus dapat dijelaskan secara memadai melalui keputusan penerjemahan tanpa membebani ayat.
