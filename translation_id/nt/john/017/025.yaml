  to: Ya Bapa yang adil, sekalipun dunia tidak mengenal Engkau, sedangkan Aku mengenal Engkau, dan mereka ini tahu bahwa Engkaulah yang mengutus Aku.
  rationale: 'Revisi mengganti ''yang benar'' dengan ''yang adil'' agar δίκαιε diterjemahkan lebih setia dan tidak ambigu dalam bahasa Indonesia modern. ''Sedangkan'' ditambahkan untuk mencerminkan daya kontras δέ. Unsur lainnya dipertahankan: ''dunia'' menjaga keluasan κόσμος, ''mengenal'' mempertahankan makna relasional γινώσκω, dan ''mereka ini'' tidak menambahkan rujukan interpretatif seperti ''murid-murid''. Tidak diperlukan catatan kaki.'
