id: JHN.17.1
reference: John 17:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: id
  text: Setelah mengatakan semuanya itu, Yesus menengadah ke langit dan berkata, “Bapa, saatnya telah tiba. Muliakanlah Anak-Mu, supaya Anak itu memuliakan Engkau.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: Setelah mengatakan semuanya itu
  rationale: Ταῦτα merujuk kembali pada perkataan sebelumnya, sedangkan aoristus ἐλάλησεν mendahului tindakan berikutnya. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan urutan tanpa mengubah isi.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: menengadah
  rationale: Ungkapan harfiah 'mengangkat mata-Nya' menyatakan gerak mengarahkan pandangan ke atas. 'Menengadah' menyampaikan gestur fisik itu secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: εἰς τὸν οὐρανόν
  choice: ke langit
  rationale: εἰς dengan akusatif menunjukkan arah. 'Ke langit' mempertahankan arah pandangan dan lebih langsung daripada ungkapan interpretatif.
- source_word: Πάτερ
  choice: Bapa
  rationale: Vokatif ini berupa sapaan langsung tanpa pronomina posesif; karena itu tidak ditambahkan 'Ku'.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: saatnya telah tiba
  rationale: Bentuk perfektum menandai tibanya saat yang menentukan. 'Saatnya' alami dalam bahasa Indonesia dan tetap mempertahankan motif waktu yang ditetapkan dalam Injil Yohanes.
- source_word: δόξασόν
  choice: Muliakanlah
  rationale: δοξάζω dalam konteks Yohanes memuat makna kemuliaan, penyataan, dan kehormatan. 'Muliakanlah' mempertahankan bobot teologis serta pengulangan kata yang sama dalam kedua klausa.
- source_word: σου τὸν υἱόν
  choice: Anak-Mu
  rationale: Genitif σου menyatakan hubungan posesif dan paling alami diterjemahkan dengan enklitik '-Mu'. Huruf kapital menandai acuan gelar kepada Yesus.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini mempertahankan daya tujuan atau hasil dari klausa Yunani tanpa memutuskan lebih sempit di antara kedua nuansa tersebut.
- source_word: ὁ υἱὸς
  choice: Anak itu
  rationale: Artikel Yunani hadir, sedangkan σου tidak diulang. 'Anak itu' mempertahankan pergeseran dari 'Anak-Mu' dan mengidentifikasi kembali Anak yang baru disebut tanpa memasukkan posesif yang tidak ada.
- source_word: δοξάσῃ σέ
  choice: memuliakan Engkau
  rationale: Subjungtif sesudah ἵνα diterjemahkan secara alami melalui 'supaya'. Pemakaian verba yang sama menjaga simetri dengan 'Muliakanlah'.
theological_decisions:
- issue: Pemuliaan timbal balik antara Bapa dan Anak
  choice: Muliakanlah Anak-Mu, supaya Anak itu memuliakan Engkau
  alternative: Hormatilah Anak-Mu, supaya Ia menghormati Engkau
  rationale: Terjemahan mempertahankan pengulangan δοξάζω dan ketegangan teologis hubungan Bapa-Anak tanpa menambahkan penjelasan doktrinal.
- issue: Penulisan gelar Anak dengan huruf kapital
  choice: Anak-Mu; Anak itu
  alternative: anak-Mu; anak itu
  rationale: Dalam konteks ini υἱός mengacu kepada Yesus sebagai Anak dalam hubungan-Nya dengan Bapa. Kapitalisasi membantu pembaca mengenali acuan tersebut tanpa mengubah makna leksikal.
- issue: Nuansa ἵνα sebagai tujuan atau hasil
  choice: supaya
  alternative: sehingga
  rationale: '''Supaya'' terutama menyampaikan tujuan, tetapi dalam bahasa Indonesia tetap dapat memuat hasil yang dimaksudkan; dengan demikian ambiguitas wajar klausa tidak dijelaskan secara berlebihan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Menengadah ke langit' dipilih sebagai ungkapan alami untuk gestur doa. Pronomina sapaan ilahi ditulis dengan huruf kapital sesuai konvensi umum, tanpa menambahkan unsur yang tidak terdapat dalam teks Yunani.
