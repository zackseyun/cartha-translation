  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: id
  text: Mereka bukan berasal dari dunia[a], sama seperti Aku bukan berasal dari dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “milik dunia.” Kata Yunani yang diterjemahkan “berasal dari” (ἐκ) dapat menyatakan sumber, asal, atau keterikatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: berasal dari
  rationale: Dalam gabungan ἐκ τοῦ κόσμου, preposisi ἐκ menyatakan sumber atau asal, dan dapat pula menyiratkan keterikatan. 'Berasal dari' alami dalam bahasa Indonesia dan mempertahankan nuansa asal tanpa mempersempit maknanya menjadi lokasi fisik.
- source_word: κόσμου
  choice: dunia
  rationale: Dalam Injil Yohanes, κόσμος sering menunjuk pada dunia manusia yang terasing dari Allah, tetapi ungkapan sederhana 'dunia' dipertahankan agar kedalaman dan ketegangan teologis konteks tidak digantikan oleh parafrasa seperti 'sistem dunia'.
- source_word: οὐκ εἰσὶν
  choice: bukan
  rationale: Bentuk kini εἰμί yang dinegasikan menyatakan identitas atau asal mereka. Dalam susunan 'bukan berasal dari', 'bukan' merupakan negasi bahasa Indonesia yang wajar.
- source_word: καθὼς
  choice: sama seperti
  rationale: καθώς memperkenalkan perbandingan langsung antara para murid dan Yesus. 'Sama seperti' jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit dipertahankan karena menonjolkan pribadi Yesus dalam perbandingan. Huruf kapital mengikuti kebiasaan penerjemahan Alkitab bahasa Indonesia bagi pembicara ilahi tanpa menambahkan makna pada teks Yunani.
- source_word: οὐκ εἰμὶ
  choice: bukan
  rationale: Bentuk kini orang pertama dari εἰμί yang dinegasikan diterjemahkan secara alami dalam frasa 'Aku bukan berasal dari dunia'.
- source_word: ἐκ τοῦ κόσμου
  choice: berasal dari dunia
  rationale: Frasa yang sama diterjemahkan secara konsisten dalam kedua klausa. Pilihan ini mempertahankan nuansa sumber atau asal dari ἐκ, sementara kemungkinan makna keterikatan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna 'dunia' dalam teologi Yohanes
  choice: Mempertahankan 'dunia' tanpa perluasan interpretatif dalam teks utama.
  alternative: sistem dunia; tatanan dunia yang telah jatuh
  rationale: κόσμος memiliki kedalaman teologis dalam Injil Yohanes, tetapi ayat ini tidak mengharuskan parafrasa yang lebih sempit. Istilah sederhana tersebut mempertahankan ketegangan teks dan membiarkan konteks menerangkan maknanya.
- issue: Nuansa asal dan keterikatan dalam ἐκ τοῦ κόσμου
  choice: Menggunakan 'berasal dari dunia' dalam teks utama dan mencatat kemungkinan nuansa keterikatan.
  alternative: milik dunia; dari dunia
  rationale: '''Berasal dari'' paling jelas mencerminkan sumber atau asal yang ditandai ἐκ, sedangkan catatan kaki mencegah nuansa keterikatan hilang atau ayat dipahami hanya sebagai asal tempat secara harfiah.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'berasal dari dunia' dipertahankan untuk mencerminkan kesejajaran yang disengaja dalam teks Yunani.
