  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: id
  text: Sekarang mereka tahu bahwa segala sesuatu yang telah Engkau berikan kepada-Ku berasal dari-Mu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang telah Engkau berikan kepada-Ku datang dari-Mu.”
    reason: Alternatif leksikal untuk παρὰ σοῦ εἰσιν yang tetap menyatakan sumber atau asal.
lexical_decisions:
- source_word: νῦν
  choice: Sekarang
  rationale: Adverbia waktu ini menandai tahap kini dalam pemahaman para murid; “sekarang” ringkas dan alami dalam bahasa Indonesia.
- source_word: ἔγνωκαν
  choice: mereka telah mengetahui
  rationale: Bentuk perfektum γινώσκω menyatakan pengetahuan yang telah diperoleh dan tetap berlaku. “Telah mengetahui” mempertahankan aspek hasil tersebut tanpa membuat kalimat terasa janggal.
- source_word: ὅτι
  choice: bahwa
  rationale: Konjungsi ini memperkenalkan isi dari apa yang telah mereka ketahui.
- source_word: πάντα ὅσα
  choice: segala sesuatu yang
  rationale: Gabungan ini menyatakan keseluruhan dan sekaligus memperkenalkan klausa relatif. “Segala sesuatu yang” alami serta mempertahankan cakupan menyeluruhnya.
- source_word: δέδωκάς
  choice: telah Engkau berikan
  rationale: Bentuk perfektum δίδωμι menunjuk pada pemberian yang sudah terjadi dan tetap bermakna dalam keadaan sekarang.
- source_word: μοι
  choice: kepada-Ku
  rationale: Dativus ini menandai penerima. “Kepada-Ku” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: παρὰ σοῦ
  choice: berasal dari-Mu
  rationale: παρά dengan genitivus menyatakan sumber atau asal. “Berasal dari-Mu” menyampaikan hubungan asal itu secara langsung.
- source_word: εἰσιν
  choice: berasal
  rationale: Dalam susunan Indonesia, predikat verbal “berasal” tidak berubah menurut jumlah dan secara alami menyatakan bahwa seluruh hal tersebut bersumber dari Bapa.
theological_decisions:
- issue: Hubungan antara pemberian Bapa kepada Anak dan sumber pemberian itu
  choice: 'Klausa diterjemahkan sebagai pernyataan asal: “segala sesuatu yang telah Engkau berikan kepada-Ku berasal dari-Mu.”'
  alternative: “segala sesuatu yang telah Engkau berikan kepada-Ku datang dari-Mu.”
  rationale: Teks menegaskan Bapa sebagai sumber segala sesuatu yang diterima Anak, tanpa memperluas pernyataan itu ke rumusan doktrinal lain. Alternatif “datang dari-Mu” mempertahankan makna sumber dengan ungkapan yang sedikit lebih dinamis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada kata ganti yang merujuk kepada Bapa dan Yesus mengikuti konvensi umum penerjemahan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan nuansa perfektum dan penegasan tentang asal.
