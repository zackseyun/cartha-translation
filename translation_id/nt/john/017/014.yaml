id: JHN.17.14
reference: John 17:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: id
  text: Aku telah memberikan firman-Mu kepada mereka, dan dunia membenci mereka karena mereka bukan berasal dari dunia,[a] sama seperti Aku bukan berasal dari dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukan bagian dari dunia.” Ungkapan Yunani secara harfiah memakai kata “dari” dan dapat menyatakan asal maupun keberadaan sebagai bagian dari sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: telah memberikan
  rationale: Bentuk perfek menyatakan tindakan yang sudah dilakukan dengan hasil yang tetap berlaku; kata aspek “telah” mempertahankan nuansa itu secara wajar dalam bahasa Indonesia.
- source_word: λόγον
  choice: firman
  rationale: Dalam konteks ini λόγος menunjuk pada perkataan Allah yang disampaikan melalui Yesus. “Firman” mempertahankan diksi khas Injil Yohanes dan bobot teologisnya tanpa mempersempitnya menjadi sekadar “pesan”.
- source_word: κόσμος
  choice: dunia
  rationale: “Dunia” adalah padanan luas dan lazim bagi κόσμος; dalam konteks ini permusuhannya terhadap Yesus dan para murid tampak dari klausa “membenci mereka”, sehingga tidak perlu diperluas menjadi parafrasa seperti “tatanan dunia”.
- source_word: ἐμίσησεν
  choice: membenci
  rationale: Aoristus Yunani menyatakan kenyataan kebencian dunia. Bentuk “membenci” lebih alami dalam bahasa Indonesia dan, dalam konteks ini, menyampaikan permusuhan yang nyata tanpa memaksakan penandaan aspek yang tidak wajib.
- source_word: ὅτι
  choice: karena
  rationale: 'Kata penghubung ini bersifat kausal: kebencian dunia dijelaskan berdasarkan asal atau keberadaan para murid yang bukan dari dunia.'
- source_word: ἐκ τοῦ κόσμου
  choice: berasal dari dunia
  rationale: Preposisi ἐκ secara dasar menyatakan sumber atau asal. “Berasal dari dunia” mempertahankan gambaran tersebut, sedangkan catatan kaki mengakui kemungkinan nuansa keanggotaan atau keberpihakan.
- source_word: καθὼς
  choice: sama seperti
  rationale: Ungkapan ini dengan jelas mempertahankan perbandingan antara hubungan para murid dengan dunia dan hubungan Yesus dengan dunia.
theological_decisions:
- issue: Hubungan para murid dengan “dunia” dibandingkan dengan hubungan Yesus dengan dunia
  choice: 'Menerjemahkan perbandingan secara langsung: “mereka bukan berasal dari dunia, sama seperti Aku bukan berasal dari dunia.”'
  alternative: “mereka bukan bagian dari dunia, sama seperti Aku bukan bagian dari dunia.”
  rationale: Pilihan utama mempertahankan daya ungkap ἐκ sebagai asal atau sumber sekaligus membiarkan ketegangan teologis khas Yohanes tetap terbuka. Terjemahan tidak membatasi ungkapan itu hanya pada keanggotaan sosial dan tidak pula menambahkan penjelasan metafisis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum terjemahan Alkitab Indonesia. “Firman-Mu” dipilih untuk mempertahankan diksi Yohanes; struktur kalimat tetap dekat dengan urutan dan perbandingan teks Yunani.
