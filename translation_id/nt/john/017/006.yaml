  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: id
  text: Aku telah menyatakan nama-Mu[a] kepada orang-orang yang Engkau berikan kepada-Ku dari dunia. Mereka adalah milik-Mu, dan Engkau telah memberikan mereka kepada-Ku, dan mereka telah memegang firman-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nama-Mu” menunjuk pada jati diri dan karakter Allah sebagaimana dinyatakan-Nya, bukan sekadar sebutan yang diucapkan.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Aku telah menyatakan
  rationale: φανερόω berarti membuat sesuatu nyata atau diketahui. 'Menyatakan' alami dalam bahasa Indonesia dan mempertahankan gagasan penyingkapan tanpa memakai bentuk yang lebih longgar.
- source_word: τὸ ὄνομα
  choice: nama-Mu
  rationale: Teks secara konkret memakai 'nama'; ungkapan ini dipertahankan agar cakupan identitas dan karakter Allah yang dinyatakan tidak dipersempit menjadi parafrasa.
- source_word: τοῖς ἀνθρώποις
  choice: kepada orang-orang
  rationale: ἄνθρωποι dapat menunjuk manusia atau orang-orang. Dalam bahasa Indonesia, 'orang-orang' paling alami dan tidak membuat pembedaan gender yang tidak ditandai secara eksplisit oleh nomina Yunani tersebut, sementara konteks tetap menentukan rujukannya kepada para murid.
- source_word: οὓς ἔδωκάς μοι
  choice: yang telah Engkau berikan kepada-Ku
  rationale: Bentuk perfektif Yunani menyatakan tindakan pemberian; 'telah ... berikan' merupakan ungkapan Indonesia yang alami dan menonjolkan keadaan kini sebagai hasil pemberian itu.
- source_word: ἐκ τοῦ κόσμου
  choice: dari dunia ini
  rationale: ἐκ menunjukkan asal atau pemilihan dari dalam dunia. 'Dari dunia ini' alami dalam bahasa Indonesia dan tidak menyiratkan secara keliru bahwa para murid secara fisik sudah berada di luar dunia.
- source_word: σοὶ ἦσαν
  choice: Mereka adalah milik-Mu
  rationale: Ungkapan posesif ini menyampaikan bahwa mereka kepunyaan Bapa. Kopula kini lebih alami dalam bahasa Indonesia karena kepemilikan itu tidak dinyatakan telah berakhir.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: lalu Engkau memberikan mereka kepada-Ku
  rationale: κἀμοί menandai pemberian kepada Yesus. 'Lalu' menyampaikan hubungan lanjutan secara alami tanpa menjadikannya hubungan sebab-akibat.
- source_word: τὸν λόγον σου
  choice: firman-Mu
  rationale: λόγος di sini ialah perkataan atau pesan Allah. 'Firman-Mu' merupakan padanan Indonesia yang wajar dalam konteks Kitab Suci dan mempertahankan resonansi teologis istilah itu.
- source_word: τετήρηκαν
  choice: mereka telah menaati
  rationale: τηρέω dalam konstruksi 'menjaga firman' mencakup memegang dan menaatinya; 'menaati firman' adalah kolokasi Indonesia yang lebih alami daripada 'menjaga firman', sedangkan bentuk 'telah' mencerminkan hasil yang tetap dari perfektum.
theological_decisions:
- issue: Makna 'nama-Mu' dalam teologi Yohanes
  choice: Mempertahankan ungkapan konkret 'nama-Mu' dalam teks utama
  alternative: Memparafrasakannya sebagai 'siapa Engkau' atau 'jati diri-Mu'
  rationale: Nama menunjuk pada identitas dan karakter Bapa yang dinyatakan, tetapi teks tidak menguraikannya dengan sebuah parafrasa. Ungkapan asli menjaga keluasan makna teologisnya.
- issue: Rujukan τοῖς ἀνθρώποις
  choice: Menerjemahkan 'orang-orang'
  alternative: Menerjemahkan 'laki-laki' atau langsung 'murid-murid'
  rationale: Konteks menunjuk kepada para murid yang diberikan Bapa kepada Yesus, tetapi kata Yunani itu sendiri berarti orang-orang/manusia dan tidak menyebut mereka dengan istilah 'murid'. Terjemahan ini mempertahankan kata teks tanpa menambahkan penandaan gender yang kurang alami dalam bahasa Indonesia.
- issue: Bapa memberikan orang-orang kepada Anak
  choice: Mempertahankan pernyataan pemberian tanpa menerangkan mekanismenya
  alternative: Menafsirkannya secara eksplisit menurut suatu sistem doktrinal tentang pemilihan atau tanggapan manusia
  rationale: Ayat ini menegaskan bahwa mereka adalah milik Bapa dan diberikan kepada Anak, tetapi tidak menjelaskan seluruh hubungan antara tindakan ilahi dan tanggapan manusia. Terjemahan tidak menyelesaikan ketegangan itu secara denominatif.
- issue: Makna τετήρηκαν terhadap firman
  choice: Menerjemahkan secara idiomatis sebagai 'telah menaati firman-Mu'
  alternative: Menerjemahkan lebih konkordan sebagai 'telah memegang/menjaga firman-Mu'
  rationale: Dalam konteks perkataan atau firman, τηρέω berarti memegang teguh dengan menaatinya. Pilihan ini membuat maksudnya jelas dalam bahasa Indonesia tanpa mengubah objek atau menambahkan isi ajaran.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. Pronomina ilahi memakai huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. 'Aku' dipilih untuk suara doa Yesus yang akrab namun bermartabat; susunan kalimat dibuat alami tanpa menghapus pengulangan pemberian yang penting dalam teks Yunani.
