- from: Aku telah menyatakan nama-Mu[a] kepada orang-orang yang telah Engkau berikan kepada-Ku dari dunia ini. Mereka adalah milik-Mu, lalu Engkau memberikan mereka kepada-Ku, dan mereka telah menaati firman-Mu.
  to: Aku telah menyatakan nama-Mu[a] kepada orang-orang yang Engkau berikan kepada-Ku dari dunia. Mereka adalah milik-Mu, dan Engkau telah memberikan mereka kepada-Ku, dan mereka telah memegang firman-Mu.
