  terminology: “Satu,” “di dalam,” “dunia,” dan “mengutus” mempertahankan istilah serta ambiguitas teologis teks. Kapitalisasi kata ganti ilahi konsisten dengan konvensi yang dinyatakan. Catatan b diperhalus agar menjelaskan bahasa Yohanes tanpa menyiratkan perumusan doktrinal yang lebih sempit.
