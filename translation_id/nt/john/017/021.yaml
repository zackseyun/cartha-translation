id: JHN.17.21
reference: John 17:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: id
  text: supaya mereka semua menjadi satu[a], sama seperti Engkau, ya Bapa, di dalam Aku dan Aku di dalam Engkau, supaya mereka juga ada di dalam Kita[b], supaya dunia percaya[c] bahwa Engkaulah yang telah mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya mereka semua bersatu.” Secara lebih harfiah, bahasa Yunani berbunyi “supaya mereka semua menjadi satu,” yang mempertahankan makna kesatuan yang lebih luas tanpa membatasinya pada satu segi tertentu.
    reason: lexical_alternative
  - marker: b
    text: Pengulangan ungkapan “di dalam” (“di dalam Aku,” “di dalam Engkau,” “di dalam Kita”) mencerminkan bahasa khas Yohanes tentang saling tinggal di dalam dan partisipasi; maknanya lebih kuat daripada sekadar kebersamaan.
    reason: cross_reference
  - marker: c
    text: Atau “mulai percaya.” Bahasa Yunani dapat dipahami sebagai tindakan percaya tanpa secara tegas menentukan apakah tekanannya pada mulai percaya atau terus percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya / sehingga
  rationale: Tiga klausa ἵνα dipertahankan sebagai rangkaian tujuan atau hasil. Dua yang pertama diterjemahkan “supaya,” sedangkan yang terakhir “sehingga,” demi alur bahasa Indonesia yang alami tanpa menghilangkan hubungan antarklausa.
- source_word: πάντες
  choice: mereka semua
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh πάντες sekaligus membuat subjek jamak tersurat dan alami dalam bahasa Indonesia.
- source_word: ἓν
  choice: satu
  rationale: Kata “satu” mempertahankan ungkapan Yunani yang padat dan tidak mempersempit kesatuan itu menjadi kesatuan organisasi, tujuan, atau bentuk tertentu.
- source_word: καθὼς
  choice: sama seperti
  rationale: Pilihan ini menandai dengan jelas perbandingan antara kesatuan para murid dan relasi Bapa-Anak.
- source_word: πάτερ
  choice: ya Bapa
  rationale: Bentuk sapaan langsung dipertahankan secara eksplisit dan wajar dalam bahasa Indonesia.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: di dalam Aku ... di dalam Engkau
  rationale: Pengulangan ἐν diterjemahkan secara konsisten untuk mempertahankan bahasa khas Yohanes tentang keberadaan timbal balik, bukan sekadar kebersamaan.
- source_word: κἀγώ
  choice: dan Aku
  rationale: 'Pilihan ini secara alami menghubungkan relasi timbal balik: Bapa di dalam Anak dan Anak di dalam Bapa.'
- source_word: καὶ αὐτοὶ
  choice: mereka juga
  rationale: Kata “juga” mempertahankan daya tambah καί dan mengaitkan keberadaan para murid dengan relasi Bapa dan Anak.
- source_word: ἐν ἡμῖν
  choice: di dalam Kita
  rationale: Terjemahan harfiah ini mempertahankan bahasa partisipasi atau saling berdiam khas Yohanes; “bersama Kita” akan melemahkan maknanya.
- source_word: κόσμος
  choice: dunia
  rationale: “Dunia” mempertahankan istilah khas Yohanes beserta keluasan dan bobot teologisnya.
- source_word: πιστεύῃ
  choice: percaya
  rationale: Bentuk ini tidak memaksakan apakah tekanannya terletak pada mulai percaya atau terus percaya; ambiguitas aspek dalam konteks tetap terpelihara.
- source_word: ἀπέστειλας
  choice: telah mengutus
  rationale: Bentuk ini menyatakan tindakan pengutusan yang sudah terjadi dan tetap relevan dalam konteks doa, serta terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat kesatuan orang-orang percaya dalam hubungannya dengan Bapa dan Anak
  choice: Menerjemahkan ἓν sebagai “satu” dan mempertahankan ungkapan “di dalam Kita.”
  alternative: “bersatu,” “satu tujuan,” atau “bersatu dengan Kita”
  rationale: Teks membandingkan kesatuan orang percaya dengan relasi Bapa dan Anak, tetapi tidak mendefinisikannya secara sempit sebagai kesatuan organisasi, moral, tujuan, atau metafisis. Terjemahan ini mempertahankan kedalaman dan ketegangan teologis teks tanpa penambahan doktrinal.
- issue: Bahasa Yohanes mengenai keberadaan timbal balik
  choice: Menggunakan “di dalam Aku,” “di dalam Engkau,” dan “di dalam Kita” secara konsisten.
  alternative: “bersama Aku/Engkau/Kita” atau “bersatu dengan Kita”
  rationale: Pengulangan ἐν merupakan unsur penting dalam bahasa teologis Yohanes. Parafrasa dengan “bersama” akan mengubahnya menjadi sekadar pergaulan, sedangkan “bersatu dengan” akan menafsirkan sesuatu yang dibiarkan lebih luas oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Huruf kapital pada kata ganti yang merujuk kepada Bapa dan Anak mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan klausa mempertahankan tiga tujuan/hasil yang berurutan dalam teks Yunani.
