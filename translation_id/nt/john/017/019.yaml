  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: id
  text: Demi mereka, Aku menguduskan diri-Ku[a], supaya mereka juga dikuduskan dalam kebenaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengkhususkan diri-Ku” atau “mempersembahkan diri-Ku.” Kata kerja Yunani ini memiliki akar yang sama dengan kata yang diterjemahkan “dikuduskan” kemudian dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam kebenaran itu” atau “oleh kebenaran”; bandingkan 17:17.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: Demi mereka
  rationale: Ὑπέρ dengan bentuk genitif menyatakan tindakan untuk kepentingan mereka. “Demi mereka” alami dalam bahasa Indonesia dan tidak secara berlebihan menetapkan makna penggantian.
- source_word: ἁγιάζω ἐμαυτόν
  choice: Aku menguduskan diri-Ku sendiri
  rationale: “Menguduskan” mempertahankan hubungan akar kata dengan ἡγιασμένοι dalam klausa berikutnya. Dalam konteks ini, ungkapan tersebut menunjuk pada tindakan Yesus mengkhususkan atau mempersembahkan diri-Nya bagi tugas-Nya, bukan pada perubahan dari tidak kudus menjadi kudus.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan dan diterjemahkan secara alami serta jelas dalam bahasa Indonesia modern.
- source_word: ὦσιν καὶ αὐτοὶ ἡγιασμένοι
  choice: mereka juga dikuduskan
  rationale: “Juga” mempertahankan unsur penyertaan dan penekanan καὶ αὐτοὶ, sedangkan “dikuduskan” menjaga pengulangan akar kata Yunani. Bentuk ini menyampaikan keadaan yang dihasilkan oleh tindakan pengudusan.
- source_word: ἐν ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Terjemahan ini mempertahankan kemungkinan makna lingkup atau ranah tanpa menambahkan kata sandang yang tidak terdapat dalam bahasa Yunani. Kemungkinan pembacaan yang lebih definit atau instrumental dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna Yesus menguduskan diri-Nya sendiri
  choice: Yesus mengkhususkan atau mempersembahkan diri-Nya bagi tugas-Nya demi para murid.
  alternative: Yesus menjadikan diri-Nya lebih suci secara moral.
  rationale: Konteks mendukung makna pengkhususan diri bagi misi. Terjemahan utama tetap mempertahankan kata “menguduskan” agar pengulangan istilah Yunani terlihat, sementara catatan kaki menjelaskan kemungkinan makna kontekstual tanpa memasukkan rumusan doktrinal ke dalam ayat.
- issue: Makna ἐν ἀληθείᾳ
  choice: dalam kebenaran, yakni kebenaran sebagai lingkup atau kenyataan pengudusan
  alternative: di dalam kebenaran itu; oleh kebenaran
  rationale: Frasa Yunani tidak memakai kata sandang dan dapat dipahami sebagai lingkup, secara lebih definit dalam kaitannya dengan ayat 17, atau secara instrumental. Teks utama tidak menutup ambiguitas tersebut, dan catatan kaki menyajikan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Aku” dan bentuk terikat “-Ku” mengikuti kebiasaan penulisan rujukan ilahi dalam terjemahan Alkitab bahasa Indonesia. Pengulangan “menguduskan/dikuduskan” sengaja dipertahankan untuk mencerminkan pengulangan akar kata Yunani.
