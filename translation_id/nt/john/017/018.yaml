  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: id
  text: Sama seperti Engkau telah mengutus Aku ke dalam dunia, demikian pula Aku telah mengutus mereka ke dalam dunia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Sama seperti
  rationale: Menandai perbandingan yang jelas antara pengutusan Yesus oleh Bapa dan pengutusan para murid oleh Yesus.
- source_word: ἐμὲ
  choice: Aku
  rationale: Objek langsung dari ἀπέστειλας. Bentuk “Aku” sesuai dengan sapaan Yesus kepada Bapa dan mempertahankan gaya yang wajar serta bermartabat.
- source_word: ἀπέστειλας
  choice: mengutus
  rationale: ἀποστέλλω di sini menyatakan tindakan mengirim dengan suatu misi; “mengutus” alami dalam bahasa Indonesia dan mempertahankan bahasa misi khas Yohanes.
- source_word: εἰς τὸν κόσμον
  choice: ke dalam dunia
  rationale: εἰς menyatakan gerak masuk, sedangkan κόσμος tetap diterjemahkan secara terbuka sebagai “dunia” agar gema ruang lingkup manusia dan ketegangan teologis khas Yohanes tidak dipersempit.
- source_word: κἀγὼ
  choice: demikian juga Aku
  rationale: Gabungan καὶ ἐγώ memiliki daya aditif dan meneruskan perbandingan. “Demikian juga Aku” membuat kesejajaran kedua klausa jelas dan alami dalam bahasa Indonesia.
- source_word: ἀπέστειλα
  choice: mengutus
  rationale: Diterjemahkan sama dengan ἀπέστειλας untuk mempertahankan kesejajaran sengaja antara tindakan Bapa dan tindakan Yesus.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Merujuk kepada para murid dalam konteks, tanpa menambahkan keterangan yang tidak tersurat dalam ayat.
- source_word: κόσμον
  choice: dunia
  rationale: Mempertahankan istilah kunci Yohanes dan ketegangan antara dunia sebagai tempat misi dan sebagai ranah yang kerap menentang Allah.
theological_decisions:
- issue: Kesejajaran misi antara pengutusan Anak oleh Bapa dan pengutusan para murid oleh Anak
  choice: Mempertahankan verba yang sama, “mengutus ... mengutus,” serta hubungan perbandingan “Sama seperti ... demikian juga.”
  alternative: Mengutus ... menugaskan; mengirim ... mengutus.
  rationale: Kesejajaran verbal merupakan bagian penting dari bentuk ayat. Terjemahan ini menyatakan analogi misi tanpa menyiratkan bahwa kedudukan atau hakikat pengutusan para murid identik dengan pengutusan Anak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Engkau” dan “Aku” mengikuti konvensi penghormatan yang lazim dalam terjemahan Alkitab Indonesia. Pengulangan “ke dalam dunia” dipertahankan untuk mencerminkan paralelisme teks Yunani.
