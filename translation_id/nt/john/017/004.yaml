  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: id
  text: Aku telah memuliakan Engkau di bumi dengan menyelesaikan pekerjaan yang telah Engkau berikan kepada-Ku untuk Kulakukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setelah menyelesaikan pekerjaan yang telah Engkau berikan kepada-Ku untuk Kulakukan.”'
    reason: Alternatif ini mencerminkan partisip Yunani secara lebih formal dan mempertahankan kemungkinan nuansa temporal atau keadaan penyerta.
lexical_decisions:
- source_word: ἐδόξασα
  choice: telah memuliakan
  rationale: Dalam Injil Yohanes, δοξάζω mengandung makna menyatakan atau mendatangkan kemuliaan. 'Memuliakan' mempertahankan bobot teologis itu dan lebih tepat daripada sekadar 'menghormati'.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Frasa ini menyatakan lokasi. 'Di bumi' alami dalam bahasa Indonesia modern dan tetap sepadan dengan bentuk Yunani.
- source_word: τελειώσας
  choice: dengan menyelesaikan
  rationale: Partisip aoris ini paling wajar dipahami sebagai sarana yang menerangkan bagaimana Yesus memuliakan Bapa. Bentuk ini juga menjaga kemungkinan hubungan partisipial yang lebih longgar melalui catatan kaki.
- source_word: τὸ ἔργον
  choice: pekerjaan
  rationale: '''Pekerjaan'' merupakan padanan langsung dan sesuai dengan pemakaian Yohanes mengenai tugas atau misi yang diberikan Bapa kepada Yesus.'
- source_word: δέδωκάς μοι
  choice: telah Engkau berikan kepada-Ku
  rationale: Bentuk perfek menandakan pemberian yang sudah terjadi dan tetap relevan. 'Telah ... berikan' mencerminkan aspek tersebut dengan wajar.
- source_word: ἵνα ποιήσω
  choice: untuk Kulakukan
  rationale: ἵνα dengan subjunktif sesudah gagasan pemberian menyatakan tujuan atau tugas yang dimaksudkan. 'Untuk Kulakukan' ringkas dan alami.
- source_word: ἐγώ σε
  choice: Aku ... Engkau
  rationale: Pronomina eksplisit dipertahankan tanpa menambahkan 'Aku sendiri', yang akan memberi tekanan lebih kuat daripada yang diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan tindakan memuliakan Bapa dengan partisip τελειώσας
  choice: 'Partisip diterjemahkan sebagai sarana: Yesus memuliakan Bapa dengan menyelesaikan pekerjaan yang diberikan kepada-Nya.'
  alternative: 'Partisip dapat dibaca sebagai keadaan penyerta atau secara lebih formal: ''setelah/telah menyelesaikan pekerjaan''.'
  rationale: Sintaksis paling alami menghubungkan penyelesaian pekerjaan dengan cara Yesus memuliakan Bapa. Catatan kaki mempertahankan bentuk alternatif tanpa memutuskan hubungan itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Bapa dan Yesus mengikuti kebiasaan umum teks Alkitab bahasa Indonesia; bentuk terikat 'Kulakukan' menjaga kelancaran kalimat.
