  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: id
  text: 'Dan inilah hidup yang kekal: yaitu bahwa mereka mengenal Engkau, satu-satunya Allah yang benar, dan Yesus, Sang Mesias[a], yang telah Engkau utus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut bentuk yang lazim secara tradisional, “Yesus Kristus.” Kata Yunani Χριστός dapat berfungsi sebagai gelar (“Mesias”) atau, dalam konteks tertentu, sebagai sebutan yang menyerupai nama (“Kristus”).
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Dan inilah
  rationale: Menyampaikan daya penghubung δέ secara wajar dalam bahasa Indonesia dan memperkenalkan penjelasan tentang hidup kekal.
- source_word: ἡ αἰώνιος ζωὴ
  choice: hidup yang kekal
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk kehidupan zaman mendatang yang bersumber dari Allah dan tidak berkesudahan.
- source_word: ἵνα γινώσκωσι
  choice: bahwa mereka mengenal
  rationale: ἵνα di sini menjelaskan isi atau hakikat hidup kekal; bentuk kini γινώσκωσι tetap memberi ruang bagi pengenalan yang berlangsung, bukan sekadar mengetahui fakta.
- source_word: σὲ
  choice: Engkau
  rationale: Objek langsung dari γινώσκωσι dan sapaan kepada Bapa dalam doa Yesus; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada Allah.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: satu-satunya Allah yang benar
  rationale: Menjaga pembatasan μόνον dan arti ἀληθινός sebagai benar atau sejati dengan susunan Indonesia yang jelas dan alami.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan koordinasi sederhana antara pengenalan akan Bapa dan akan Yesus tanpa menambahkan penjelasan teologis di luar sintaksis.
- source_word: ὃν ἀπέστειλας
  choice: yang telah Engkau utus
  rationale: Klausa relatif mengidentifikasi Yesus melalui pengutusan-Nya oleh Bapa; 'telah' secara alami menyampaikan tindakan lampau aoristus dalam konteks ini.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesus, Sang Mesias
  rationale: Χριστός masih terdengar sebagai gelar dalam pernyataan ini. 'Sang Mesias' idiomatis dan bermartabat; koma memperjelas bahwa gelar tersebut beraposisi dengan nama Yesus.
theological_decisions:
- issue: Hubungan sebutan 'satu-satunya Allah yang benar' dengan Yesus
  choice: Mempertahankan sapaan kepada Bapa sebagai 'satu-satunya Allah yang benar' dan membedakan Yesus sebagai Dia yang diutus, tanpa tambahan penjelas.
  alternative: Memparafrasakan ayat untuk menegaskan suatu rumusan Trinitaris atau, sebaliknya, untuk menyangkal keilahian Yesus.
  rationale: Teks harus mempertahankan bentuk dan ketegangan teologisnya sendiri. Ayat ini membedakan Bapa dan Yesus dalam relasi pengutusan, tetapi tidak sepatutnya diperluas untuk menyelesaikan perdebatan doktrinal kemudian.
- issue: Pemaknaan Χριστόν
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks pengakuan dan penjelasan ini, daya gelar 'Yang Diurapi/Mesias' tetap nyata. Namun, karena Χριστός juga dapat berfungsi sebagai sebutan yang menyerupai nama, bentuk tradisional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk 'Engkau' dipakai karena konteksnya adalah doa langsung kepada Bapa. Tanda koma pada 'Yesus, Sang Mesias' menandai gelar aposisional dan menghindari kesan bahwa 'Mesias' sekadar nama keluarga.
