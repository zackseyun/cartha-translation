id: JHN.17.10
reference: John 17:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: id
  text: Segala milik-Ku adalah milik-Mu, dan milik-Mu adalah milik-Ku, dan Aku telah dimuliakan di dalam mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui mereka” atau “di antara mereka.” Teks Yunani berbunyi “di dalam mereka,” yang dalam konteks ini dapat menyatakan tempat, sarana, atau perwujudan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: segala milik-Ku
  rationale: Ungkapan netral jamak dengan πᾶς mencakup segala sesuatu yang menjadi milik Yesus. “Segala milik-Ku” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada benda-benda material.
- source_word: σά
  choice: milik-Mu
  rationale: Adjektiva posesif ini berfungsi secara substantival. “Milik-Mu” menyampaikan kepemilikan secara ringkas dan membentuk kesejajaran dengan “milik-Ku”.
- source_word: τὰ σὰ ἐμά
  choice: milik-Mu adalah milik-Ku
  rationale: Terjemahan ini mempertahankan pernyataan timbal balik serta susunan paralel kedua klausa tanpa menambahkan penjelasan teologis.
- source_word: δεδόξασμαι
  choice: Aku telah dimuliakan
  rationale: Bentuk perfek pasif menunjukkan tindakan yang telah terjadi dengan hasil yang tetap berlaku. “Telah dimuliakan” mempertahankan aspek dan diatesis tersebut.
- source_word: ἐν αὐτοῖς
  choice: di dalam mereka
  rationale: Ini mempertahankan padanan langsung ἐν dan ambiguitas kontekstualnya. Kata ganti tersebut secara wajar merujuk kepada orang-orang yang diberikan Bapa kepada Yesus dalam konteks sekitar.
theological_decisions:
- issue: Kepemilikan timbal balik antara Anak dan Bapa
  choice: 'Pernyataan diterjemahkan secara langsung sebagai kepemilikan timbal balik: “Segala milik-Ku adalah milik-Mu, dan milik-Mu adalah milik-Ku.”'
  alternative: Menafsirkannya secara lebih lemah sebagai kerja sama fungsional semata.
  rationale: Bahasa Yunani menyatakan kepemilikan timbal balik dengan jelas. Terjemahan tidak boleh melemahkannya, tetapi juga tidak menambahkan istilah kredal yang tidak terdapat dalam ayat.
- issue: Rujukan dan daya ἐν αὐτοῖς
  choice: Mempertahankan ungkapan “di dalam mereka” dalam teks utama.
  alternative: “melalui mereka” sebagai instrumental, atau “di antara mereka” sebagai lokatif-relasional.
  rationale: Preposisi ἐν dapat mengandung nuansa lokasi, sarana, atau perwujudan dalam konteks ini. Teks Yunani tidak mengharuskan salah satunya dipilih secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Struktur paralel sumber dipertahankan agar penegasan kepemilikan timbal balik tetap terasa.
