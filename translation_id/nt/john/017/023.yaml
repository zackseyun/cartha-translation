  source_fidelity: Terjemahan mempertahankan bahasa saling-mendiami (ἐν), arah menuju kesatuan dalam εἰς ἕν, pengutusan Yesus, serta perbandingan langsung καθὼς. Namun, klausa ἵνα kedua sebaiknya juga diterjemahkan sebagai klausa tujuan dengan “supaya,” bukan “sehingga,” agar pengulangan dan fungsi sintaksis dua klausa ἵνα dalam bahasa Yunani tetap tampak.
  naturalness: Bahasa umumnya baku, alami, dan sesuai register doa yang khidmat. Pengulangan “supaya” tetap wajar dalam bahasa Indonesia serta lebih dekat dengan struktur sumber.
  terminology: “Di dalam,” “disempurnakan,” “menjadi satu,” “dunia,” “mengutus,” dan “mengasihi” merupakan pilihan yang tepat dan konsisten. Catatan kaki direvisi sedikit agar alternatif “completion” tidak memakai “penyelesaian,” yang dalam bahasa Indonesia modern kurang alami untuk makna ini.
