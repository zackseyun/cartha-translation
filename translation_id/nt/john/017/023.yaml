id: JHN.17.23
reference: John 17:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: id
  text: Aku di dalam mereka dan Engkau di dalam Aku, supaya mereka disempurnakan menjadi satu,[a] supaya dunia tahu bahwa Engkaulah yang mengutus Aku dan bahwa Engkau mengasihi mereka sama seperti Engkau mengasihi Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dijadikan sempurna menjadi satu” atau “dibawa sampai tuntas menjadi satu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: Aku di dalam mereka dan Engkau di dalam Aku
  rationale: Mempertahankan preposisi ἐν dan bahasa khas Yohanes tentang keberadaan timbal balik, tanpa melemahkannya menjadi sekadar kehadiran 'di antara' mereka.
- source_word: τετελειωμένοι
  choice: disempurnakan
  rationale: Bentuk partisip perfek pasif menyatakan keadaan yang dihasilkan oleh tindakan yang membawa kepada kesempurnaan atau penyelesaian. 'Disempurnakan' mempertahankan nuansa transformasi sekaligus penyelesaian.
- source_word: εἰς ἕν
  choice: menjadi satu
  rationale: Mengungkapkan arah atau hasil yang terkandung dalam εἰς dengan akusatif secara alami dalam bahasa Indonesia, yaitu menuju kesatuan.
- source_word: γινώσκῃ
  choice: tahu
  rationale: Padanan lugas dan alami bagi bentuk subjungtif dalam klausa tujuan; konteks 'supaya/sehingga' sudah menyampaikan sifat tujuannya.
- source_word: ὁ κόσμος
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes tanpa mempersempitnya secara tafsir menjadi 'orang-orang dunia' atau suatu sistem dunia.
- source_word: ἀπέστειλας
  choice: mengutus
  rationale: '''Mengutus'' secara alami menyampaikan tindakan mengirim dengan misi dan sesuai dengan pemakaian ἀποστέλλω bagi pengutusan Sang Anak dalam Injil Yohanes.'
- source_word: ἠγάπησας
  choice: mengasihi
  rationale: Mempertahankan pengulangan verba yang sama untuk kasih Bapa kepada para murid dan kepada Sang Anak.
- source_word: καθὼς
  choice: sama seperti
  rationale: Menandai perbandingan nyata secara langsung tanpa melunakkan atau menjelaskan batas perbandingan itu.
theological_decisions:
- issue: Kekuatan perbandingan dalam 'Engkau mengasihi mereka sama seperti Engkau mengasihi Aku'
  choice: Perbandingan diterjemahkan langsung dengan 'sama seperti'.
  alternative: '''seperti'' atau parafrasa yang melunakkan menjadi ''dengan kasih yang serupa'''
  rationale: καθὼς menyatakan perbandingan yang nyata. Terjemahan mempertahankan bobot teologis pernyataan tersebut tanpa menentukan secara tambahan bagaimana persamaan itu harus dipahami.
- issue: Makna τετελειωμένοι dalam konteks kesatuan
  choice: Diterjemahkan 'disempurnakan menjadi satu'.
  alternative: '''dibawa kepada penyelesaian dalam kesatuan'' atau ''dijadikan sempurna dalam satu'''
  rationale: Pilihan ini mempertahankan unsur kesempurnaan dan pencapaian hasil, tetapi konteks menghubungkannya dengan kesatuan, bukan secara eksplisit dengan keadaan tanpa dosa.
- issue: Hubungan dua klausa ἵνα
  choice: Klausa pertama memakai 'supaya' dan klausa kedua 'sehingga'.
  alternative: Keduanya diterjemahkan 'supaya'
  rationale: Kedua klausa tetap mempertahankan hubungan tujuan/hasil. 'Sehingga' membuat alur Indonesia lebih alami dan dapat mencerminkan hasil dari kesatuan mereka, tanpa menutup kemungkinan nuansa tujuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Huruf kapital pada kata ganti yang merujuk kepada Bapa dan Yesus dipakai sebagai konvensi penghormatan dalam penerbitan Alkitab Indonesia; struktur kalimat tetap dekat dengan susunan dan pengulangan teks Yunani.
