  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: id
  text: Aku tidak meminta hanya untuk mereka ini, tetapi juga untuk orang-orang yang percaya kepada-Ku melalui perkataan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui pesan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Aku meminta
  rationale: Dalam konteks doa Yesus kepada Bapa, kata ini berarti meminta atau memohon. “Meminta” transparan dan tidak menambahkan nuansa yang melampaui verba Yunani.
- source_word: περὶ τούτων
  choice: untuk mereka ini
  rationale: περί dengan genitif menandai pihak yang menjadi pokok permintaan. Dalam bahasa Indonesia, “meminta untuk mereka” lebih alami daripada “meminta mengenai mereka”; “mereka ini” membiarkan rujukannya ditentukan oleh konteks.
- source_word: μόνον
  choice: hanya
  rationale: Kata ini membatasi cakupan permintaan dan diterjemahkan secara langsung serta wajar.
- source_word: ἀλλὰ καὶ
  choice: tetapi juga
  rationale: Mempertahankan pertentangan sekaligus perluasan cakupan doa.
- source_word: τῶν πιστευόντων
  choice: orang-orang yang percaya
  rationale: Partisipel substantival dipertahankan dengan bentuk verbal yang alami, tanpa mengubahnya menjadi sebutan kelompok yang lebih statis.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: melalui pemberitaan mereka
  rationale: λόγος di sini menunjuk pada perkataan atau pesan kesaksian para murid. “Pemberitaan” menyampaikan sarana orang lain menjadi percaya secara alami dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: εἰς ἐμέ
  choice: kepada-Ku
  rationale: Dengan πιστεύω, konstruksi ini menyatakan kepercayaan yang diarahkan kepada pribadi Yesus. “Percaya kepada-Ku” merupakan ungkapan Indonesia yang alami tanpa menerjemahkan εἰς secara mekanis sebagai “ke dalam”.
- source_word: Οὐ ... μόνον
  choice: bukan hanya
  rationale: Susunan korelatif “bukan hanya ... tetapi juga” menyampaikan penyangkalan dan pembatas Yunani dengan jelas dan idiomatis.
theological_decisions:
- issue: Cakupan doa Yesus melampaui para murid yang hadir
  choice: Tidak menambahkan penanda waktu seperti “kelak” atau “akan percaya.”
  alternative: “orang-orang yang akan percaya kepada-Ku”
  rationale: Bentuk Yunani menyatakan “orang-orang yang percaya” tanpa secara eksplisit memberi penanda waktu. Terjemahan ini memungkinkan rujukan kepada orang-orang percaya di kemudian hari melalui kesaksian para murid, tetapi tidak menutup kemungkinan cakupan yang lebih dekat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti orang pertama “Aku” mengikuti tuturan Yesus; “-Ku” ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Struktur “bukan hanya ... tetapi juga” menjaga penekanan teks Yunani.
