base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: id
  text: Kuduskanlah mereka dalam kebenaran; firman-Mu adalah kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “firman-Mu adalah kebenaran itu.” Dalam bahasa Yunani, kata “kebenaran” sebagai predikat tidak memakai artikel; bentuk ini dapat menekankan sifat atau hakikat (“adalah kebenaran”), meskipun pengertian definitif juga mungkin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: Kuduskanlah
  rationale: Bentuk imperatif aoristus dari ἁγιάζω menyatakan permohonan agar mereka dikuduskan atau dikhususkan bagi Allah. “Kuduskanlah” mempertahankan kaitan dengan kekudusan sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina objek jamak ini merujuk kepada para murid; “mereka” adalah padanan langsung dan alami.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Terjemahan ini mempertahankan keluasan makna ἐν, yang dapat menyatakan ranah maupun sarana, tanpa membatasinya hanya menjadi “oleh/dengan kebenaran”.
- source_word: λόγος
  choice: firman
  rationale: Dalam konteks ini λόγος menunjuk pada perkataan atau pesan yang berasal dari Allah. “Firman” merupakan istilah Indonesia yang alami dan bermartabat untuk perkataan Allah serta mempertahankan nuansa Yohanes.
- source_word: ὁ σὸς
  choice: -Mu
  rationale: Konstruksi posesif Yunani berarti “milik-Mu”; dalam bahasa Indonesia, “firman-Mu” menyampaikannya secara ringkas dan idiomatis.
- source_word: ἀλήθειά ἐστιν
  choice: adalah kebenaran
  rationale: Nomina predikatif ἀλήθεια tidak memakai artikel. “Adalah kebenaran” mempertahankan bentuk substantif dan daya kualitatif pernyataan itu, alih-alih melemahkannya menjadi sekadar “benar”.
theological_decisions:
- issue: Apakah ἀλήθεια dalam klausa kedua harus dipahami secara kualitatif atau definitif
  choice: firman-Mu adalah kebenaran
  alternative: firman-Mu adalah kebenaran itu
  rationale: 'Karena nomina predikatif Yunani tidak berartikel, terjemahan utama mempertahankan kemungkinan penekanan kualitatif: firman Allah berhakikat kebenaran. Namun, tata bahasa Yunani tetap memungkinkan pengertian definitif; alternatif itu dicatat tanpa memaksakan penyelesaian.'
- issue: Apakah ἐν menyatakan ranah atau sarana pengudusan
  choice: dalam kebenaran
  alternative: dengan kebenaran
  rationale: “Dalam kebenaran” mempertahankan ambiguitas asli antara ranah tempat mereka dikuduskan dan kebenaran sebagai sarana pengudusan. Memilih “dengan” akan mempersempitnya pada makna instrumental.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Kuduskanlah” serta “firman-Mu” mempertahankan bobot teologis tanpa memasukkan penafsiran denominasi tertentu. Penanda catatan ditempatkan pada klausa yang dijelaskannya.
