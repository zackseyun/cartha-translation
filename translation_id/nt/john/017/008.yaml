id: JHN.17.8
reference: John 17:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: id
  text: Sebab perkataan-perkataan yang Engkau berikan kepada-Ku telah Kuberikan kepada mereka,[a] dan mereka menerimanya. Mereka benar-benar mengetahui bahwa Aku datang dari-Mu,[b] dan mereka percaya bahwa Engkaulah yang mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan-ucapan yang Engkau berikan kepada-Ku telah Kuberikan kepada mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku keluar dari-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: perkataan-perkataan
  rationale: Bentuk jamak ini menunjuk pada perkataan atau ucapan yang disampaikan; pilihan ini mempertahankan makna konkret dan jamak tanpa menafsirkannya menjadi satu 'pesan'.
- source_word: ἔδωκάς ... δέδωκα
  choice: Engkau berikan ... telah Kuberikan
  rationale: Ungkapan kedua memakai bentuk perfek dan diterjemahkan dengan 'telah Kuberikan' untuk menyatakan tindakan yang sudah selesai dengan hasil yang tetap berlaku; bentuk pertama diterjemahkan secara alami sebagai 'berikan'.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pilihan ini menyatakan dengan jelas hubungan objek tak langsung dari tindakan memberi.
- source_word: ἔλαβον
  choice: menerimanya
  rationale: Dalam konteks sesuatu yang diberikan sebagai penyataan, verba ini paling alami berarti menerima, bukan sekadar mengambil secara fisik.
- source_word: ἔγνωσαν ἀληθῶς
  choice: benar-benar mengetahui
  rationale: Terjemahan ini mempertahankan penegasan ἀληθῶς dan menyampaikan pengenalan yang sungguh tercapai tanpa mempersempitnya menjadi kepastian intelektual semata.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: Aku datang dari-Mu
  rationale: Frasa ini menyatakan asal; 'datang dari-Mu' alami dalam bahasa Indonesia dan tetap mempertahankan bobot pernyataan tanpa menambahkan rumusan doktrinal.
- source_word: ἐπίστευσαν
  choice: mereka percaya
  rationale: Karena diikuti klausa ὅτι yang menyatakan isi kepercayaan, 'percaya bahwa' merupakan padanan langsung dan alami.
- source_word: ἀπέστειλας
  choice: mengutus
  rationale: '''Mengutus'' menangkap unsur pengiriman dengan tujuan atau mandat yang lazim terkandung dalam konteks ini, tanpa menambahkan rincian yang tidak disebutkan.'
- source_word: ὅτι
  choice: Sebab
  rationale: ὅτι pada awal ayat memberi alasan atau penjelasan bagi pernyataan sebelumnya; 'Sebab' mempertahankan hubungan tersebut dengan wajar.
theological_decisions:
- issue: Hubungan Yesus dengan Bapa dalam παρὰ σοῦ ἐξῆλθον
  choice: Aku datang dari-Mu
  alternative: Aku keluar dari-Mu
  rationale: Pilihan ini mempertahankan pernyataan tentang asal tanpa memaksakan penjelasan metafisik tertentu, sementara alternatif yang lebih harfiah dicatat.
- issue: Arti πιστεύω dalam klausa ὅτι
  choice: mereka percaya bahwa
  alternative: mereka yakin bahwa
  rationale: Konstruksi ini menyatakan kepercayaan terhadap kebenaran suatu pernyataan. 'Percaya bahwa' mengikuti sintaksis dan tidak menggesernya menjadi sekadar keyakinan psikologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Bapa dan Yesus mengikuti kelaziman Alkitab bahasa Indonesia. Kalimat panjang Yunani dibagi pada titik alami agar mudah dipahami tanpa mengubah hubungan antarklausa.
