id: JHN.17.5
reference: John 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: id
  text: Dan sekarang, ya Bapa, muliakanlah Aku di hadirat-Mu dengan kemuliaan yang Kumiliki bersama-Mu sebelum dunia ada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebelum dunia menjadi ada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Sekarang
  rationale: Dalam konteks doa ini, καί menghubungkan permohonan dengan ayat sebelumnya dan tidak perlu selalu dinyatakan sebagai “dan” dalam bahasa Indonesia; “Sekarang” menyampaikan peralihan waktunya secara alami.
- source_word: δόξασόν
  choice: muliakanlah
  rationale: Bentuk imperatif aoris dari δοξάζω. “Muliakanlah” mempertahankan kosakata khas Yohanes tentang kemuliaan dan pemuliaan, lebih tepat daripada sekadar “hormatilah”.
- source_word: σύ, πάτερ
  choice: ya Bapa
  rationale: Sapaan “ya Bapa” alami dan khidmat dalam doa. Penempatan sapaan serta bentuk imperatif menyampaikan tekanan pada Bapa yang dinyatakan oleh σύ tanpa terjemahan kaku “Engkau, Bapa”.
- source_word: παρὰ σεαυτῷ
  choice: di hadirat-Mu
  rationale: παρά dengan datif menyatakan kedekatan atau keberadaan di sisi seseorang. “Di hadirat-Mu” merupakan ungkapan Indonesia yang wajar dan tetap mempertahankan nuansa relasional-spasialnya.
- source_word: τῇ δόξῃ
  choice: dengan kemuliaan
  rationale: Datif ini mengaitkan tindakan memuliakan dengan kemuliaan yang dijelaskan oleh klausa relatif; “dengan kemuliaan” jelas dan alami.
- source_word: ᾗ εἶχον
  choice: yang Kumiliki
  rationale: Imperfek εἶχον menunjuk pada kemuliaan yang dimiliki Yesus sebelumnya. “Kumiliki” menyatakan kepemilikan lampau yang tetap dipandang dari saat sebelum dunia ada tanpa menjadikannya ungkapan Indonesia yang kaku.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: sebelum dunia ada
  rationale: Konstruksi infinitif berartikel ini menyatakan waktu yang mendahului keberadaan dunia. “Sebelum dunia ada” ringkas, alami, dan mempertahankan arti εἶναι.
- source_word: παρὰ σοί
  choice: bersama-Mu
  rationale: παρά dengan datif kembali menyatakan kedekatan atau kehadiran. “Bersama-Mu” alami dalam bahasa Indonesia dan menegaskan relasi tanpa mempersempitnya menjadi lokasi fisik.
- source_word: κόσμον
  choice: dunia
  rationale: “Dunia” adalah padanan baku dan sesuai konteks bagi κόσμος, yakni dunia atau tatanan ciptaan.
theological_decisions:
- issue: Praeksistensi Sang Anak yang tersirat dalam ayat ini
  choice: Klausa waktu diterjemahkan secara langsung sebagai kemuliaan yang dimiliki Yesus bersama Bapa sebelum dunia ada.
  alternative: Menafsirkan kemuliaan itu hanya sebagai kemuliaan yang direncanakan sebelumnya.
  rationale: Bahasa Yunani menyatakan bahwa Yesus memiliki kemuliaan bersama Bapa sebelum keberadaan dunia. Terjemahan tidak melemahkan maupun menguraikan pernyataan itu melampaui teks.
- issue: Sifat kemuliaan yang dimiliki bersama Bapa
  choice: Mempertahankan istilah “kemuliaan” tanpa penjelasan tambahan.
  alternative: keagungan; kehormatan
  rationale: Ayat ini menyatakan kemuliaan bersama Bapa, tetapi tidak mendefinisikan sifatnya lebih lanjut. “Kemuliaan” mempertahankan kosakata dan ketegangan teologis Yohanes.
- issue: Nuansa spasial-relasional pada παρά dengan datif
  choice: Membedakan secara idiomatis “di hadirat-Mu” dan “bersama-Mu” sambil mempertahankan gagasan kehadiran dekat.
  alternative: di sisi-Mu pada kedua kemunculan
  rationale: Kedua frasa Yunani berkaitan erat, tetapi variasi Indonesia menghasilkan kalimat yang alami tanpa menghapus nuansa kedekatan atau kehadiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, sesuai bentuk doa. Huruf kapital pada pronomina yang merujuk kepada Bapa dan Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Diksi tetap dekat dengan struktur dan kosakata teologis Yunani, tetapi menghindari susunan yang kaku.
