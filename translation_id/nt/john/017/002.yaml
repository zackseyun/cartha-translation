  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: id
  text: sama seperti Engkau telah memberikan kepada-Nya wewenang atas semua manusia[a], supaya Ia memberi hidup kekal kepada semua orang yang telah Engkau berikan kepada-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “atas seluruh daging,” sebuah ungkapan alkitabiah yang merujuk kepada seluruh umat manusia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “semua yang telah Engkau berikan kepada-Nya”; bahasa Yunani memakai bentuk netral tunggal yang bersifat kolektif untuk orang-orang yang diberikan kepada Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sama seperti
  rationale: Mempertahankan hubungan perbandingan dengan permohonan pada ayat sebelumnya secara jelas dan alami.
- source_word: ἔδωκας
  choice: Engkau telah memberikan
  rationale: Menyatakan tindakan Bapa yang menganugerahkan wewenang kepada Anak; bahasa Indonesia tidak harus membedakan aspek aoristus secara kaku.
- source_word: ἐξουσίαν
  choice: kuasa
  rationale: Dalam konteks ini, 'kuasa' mencakup wewenang atau hak yang diberikan, bukan sekadar kemampuan fisik.
- source_word: πάσης σαρκός
  choice: atas semua manusia
  rationale: Ungkapan Yunani harfiah 'seluruh daging' merupakan idiom alkitabiah yang merujuk kepada seluruh umat manusia; terjemahan ini menyampaikan acuannya dengan wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksudkan.
- source_word: πᾶν ὃ
  choice: semua orang yang
  rationale: Bentuk netral tunggal Yunani dipakai secara kolektif bagi orang-orang yang diberikan Bapa kepada Anak; pilihan ini jelas dalam bahasa Indonesia tanpa menghilangkan ciri bentuk sumber, yang dicatat dalam catatan kaki.
- source_word: δέδωκας
  choice: telah Engkau berikan
  rationale: 'Mencerminkan tindakan yang sudah terlaksana dan tetap relevan: mereka berada dalam keadaan telah diberikan kepada Anak.'
- source_word: δώσῃ
  choice: Ia memberikan
  rationale: Sesudah ἵνα, subjungtif menyatakan tujuan; bahasa Indonesia secara alami mengungkapkannya dengan 'supaya ... memberikan' tanpa modal tambahan.
- source_word: αὐτοῖς
  choice: kepada semua orang yang telah Engkau berikan kepada-Nya
  rationale: Pronomina datif dihubungkan secara eksplisit dengan antes Ringkasannya agar penerima hidup kekal tidak disamakan dengan 'semua manusia' pada klausa sebelumnya.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ungkapan baku dan tepat dalam konteks Yohanes, yang menunjuk pada hidup tanpa akhir sekaligus hidup yang berkaitan dengan zaman yang akan datang.
theological_decisions:
- issue: Cakupan 'semua manusia' dan acuan 'semua orang yang telah Engkau berikan kepada-Nya'
  choice: Mempertahankan cakupan universal kuasa Anak, sekaligus membedakannya dari kelompok yang disebut menerima hidup kekal.
  alternative: Menyamakan kedua kelompok atau memperluas maupun mempersempit salah satunya berdasarkan suatu sistem teologis.
  rationale: Teks Yunani sendiri membedakan kuasa atas seluruh manusia dari pemberian hidup kekal kepada mereka yang diberikan Bapa kepada Anak. Susunan klausa dipertahankan agar ketegangan ini tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang mengacu kepada Bapa dan Anak mengikuti gaya penerjemahan Alkitab Indonesia yang umum. Penempatan frasa penerima sebelum subjek pada klausa tujuan agak bertanda, tetapi tetap wajar dan membantu mempertahankan susunan serta pembedaan dalam teks Yunani.
