  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: id
  text: Aku memohon[b] bagi mereka[a]. Aku tidak memohon bagi dunia, melainkan bagi mereka yang telah Engkau berikan kepada-Ku, sebab mereka adalah milik-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenai mereka”; kata depan Yunani dalam konteks ini dapat berarti “bagi” maupun “mengenai.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku berdoa”; kata kerja Yunani ini secara lebih harfiah berarti “meminta” atau “memohon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: meminta
  rationale: Kata ini pada dasarnya berarti meminta atau memohon. Dalam konteks ini Yesus sedang berdoa kepada Bapa, tetapi “meminta” mempertahankan makna leksikalnya tanpa menggantinya dengan istilah keagamaan yang lebih khusus.
- source_word: περὶ αὐτῶν
  choice: untuk mereka
  rationale: περί dengan genitif dapat berarti “mengenai/tentang” dan, dalam konteks permohonan, “untuk.” “Untuk mereka” menyampaikan fungsi perantaraan doa ini secara alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan arti yang lebih harfiah.
- source_word: κόσμου
  choice: dunia
  rationale: Mempertahankan istilah khas Yohanes tanpa mempersempit acuannya menjadi seluruh umat manusia atau sistem dunia yang tidak percaya.
- source_word: ὧν δέδωκάς μοι
  choice: mereka yang telah Engkau berikan kepada-Ku
  rationale: Bentuk perfektum Yunani menyatakan tindakan pemberian yang sudah terjadi dan hasilnya tetap berlaku; “telah ... berikan” menyampaikan aspek itu secara wajar.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini paling wajar dipahami sebagai pemberi alasan bagi permintaan Yesus.
- source_word: σοί εἰσιν
  choice: mereka adalah milik-Mu
  rationale: Ungkapan ini menyampaikan hubungan kepemilikan atau keberadaan mereka pada pihak Bapa secara langsung dan alami.
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit dipertahankan untuk mencerminkan penekanan pada subjek dalam struktur kontras ayat ini.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: “Melainkan” secara alami menandai kontras kuat sesudah bentuk “tidak ...” dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἐρωτῶ diterjemahkan dengan istilah doa yang eksplisit
  choice: meminta
  alternative: berdoa; memohon
  rationale: Walaupun konteksnya adalah doa Yesus kepada Bapa, kata Yunani tersebut pada dasarnya berarti “meminta.” Pilihan ini menjaga transparansi leksikal tanpa menyangkal konteks doanya.
- issue: Cakupan makna “dunia”
  choice: dunia
  alternative: umat manusia pada umumnya; sistem dunia yang tidak percaya
  rationale: κόσμος dalam tulisan Yohanes memiliki rentang makna yang bernuansa. Terjemahan tidak mempersempitnya secara tafsiran dan dengan demikian mempertahankan ketegangan teologis ayat ini.
- issue: Arti περί dalam permohonan Yesus
  choice: untuk
  alternative: mengenai; tentang
  rationale: Dalam konteks permohonan kepada Bapa, “untuk” secara alami menyatakan bahwa Yesus meminta demi mereka. Kemungkinan arti “mengenai” tetap dicatat agar ambiguitas asli tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Pengulangan “meminta untuk” dipertahankan untuk mencerminkan paralelisme dan kontras teks Yunani.
