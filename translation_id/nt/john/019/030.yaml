  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: id
  text: Maka, sesudah Yesus menerima anggur asam[a] itu, Ia berkata, “Sudah selesai.”[b] Ia menundukkan kepala dan menyerahkan roh-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cuka anggur”. Kata Yunani ὄξος menunjuk pada anggur asam.
    reason: lexical_alternative
  - marker: b
    text: Atau “Sudah terlaksana” atau “Sudah diselesaikan”.
    reason: lexical_alternative
  - marker: c
    text: Atau “mengembuskan napas terakhir”. Secara lebih harfiah, teks Yunani berbunyi “menyerahkan roh”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Sesudah
  rationale: Dalam alur narasi ini, gabungan penanda waktu dan partikel wacana menunjukkan tindakan berikutnya setelah Yesus menerima anggur asam. “Sesudah” menyampaikan urutan itu secara alami dalam bahasa Indonesia, sementara hubungan akibat/alur juga terbawa oleh konteks.
- source_word: ἔλαβεν
  choice: menerima
  rationale: λαμβάνω dapat berarti mengambil atau menerima. Karena anggur asam disodorkan kepada Yesus, “menerima” paling sesuai dengan konteks.
- source_word: τὸ ὄξος
  choice: anggur asam
  rationale: ὄξος menunjuk pada anggur yang telah menjadi asam atau cuka anggur. “Anggur asam” jelas bagi pembaca modern dan tidak menimbulkan kesan cuka masak biasa.
- source_word: Τετέλεσται
  choice: Sudah selesai
  rationale: Bentuk perfek τετέλεσται menyatakan sesuatu yang telah diselesaikan dengan hasil yang tetap berlaku. “Sudah selesai” ringkas, alami, dan tidak menentukan secara eksplisit apa yang diselesaikan.
- source_word: κλίνας τὴν κεφαλήν
  choice: menundukkan kepala
  rationale: Ungkapan ini secara langsung menggambarkan Yesus mencondongkan atau menundukkan kepala. Bentuk Indonesia ini alami dan mempertahankan tindakan yang mendahului verba utama.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: menyerahkan roh-Nya
  rationale: Secara harfiah, ungkapan ini berarti menyerahkan roh. Terjemahan ini mempertahankan kekhasan dan bobot ungkapan Yunani, bukan meratakannya menjadi sekadar “meninggal”.
theological_decisions:
- issue: Apakah παρέδωκεν τὸ πνεῦμα diterjemahkan sebagai idiom biasa untuk kematian atau dengan mempertahankan unsur roh dan tindakan penyerahan.
  choice: menyerahkan roh-Nya
  alternative: mengembuskan napas terakhir; meninggal
  rationale: Terjemahan utama mempertahankan ungkapan khusus teks Yunani serta kemungkinan nuansa tindakan yang disengaja dalam kisah Yohanes, tanpa menjabarkannya menjadi kesimpulan doktrinal.
- issue: Cakupan dan nuansa Τετέλεσται.
  choice: Sudah selesai
  alternative: Sudah terlaksana; Sudah diselesaikan
  rationale: Teks tidak menyebutkan secara eksplisit subjek yang telah selesai atau terlaksana. Terjemahan ini mempertahankan ketaktertentuan tersebut dan sekaligus menyampaikan finalitas bentuk perfek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi memakai kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan atau ambiguitas teologis teks sumber.
