  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: id
  text: Lalu Pilatus mengambil Yesus dan mencambuk-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan menyatakan pendelegasian tindakan secara lebih eksplisit: “Lalu Pilatus mengambil Yesus dan menyuruh orang mencambuk-Nya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Lalu
  rationale: Menandai peristiwa berikutnya dalam urutan narasi dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: οὖν
  choice: Tersirat dalam alur kalimat
  rationale: Partikel ini menandai kelanjutan logis atau naratif. Dalam bahasa Indonesia, dayanya sudah terwakili secara wajar oleh “Lalu”; menerjemahkan kedua unsur secara terpisah akan terasa berlebihan.
- source_word: ἔλαβεν
  choice: membawa
  rationale: Dalam konteks tindakan Pilatus terhadap Yesus, “membawa” merupakan padanan Indonesia yang alami tanpa menambahkan gagasan kekerasan seperti “menyeret” atau secara eksplisit menetapkan pendelegasian seperti “menyuruh membawa”.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia; artikel Yunani tidak perlu dinyatakan.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia dan berfungsi sebagai objek langsung.
- source_word: ἐμαστίγωσεν
  choice: mencambuk-Nya
  rationale: Kata kerja ini menunjuk pada pemukulan dengan cambuk. “Mencambuk” jelas, modern, dan cukup mempertahankan kerasnya tindakan tersebut; sufiks “-Nya” secara alami merujuk kembali kepada Yesus.
theological_decisions:
- issue: Pelaku langsung atau pelaku melalui pendelegasian dalam ἔλαβεν ... ἐμαστίγωσεν
  choice: Pilatus dipertahankan sebagai subjek gramatikal kedua tindakan tanpa menentukan apakah ia sendiri mencambuk Yesus.
  alternative: “Lalu Pilatus membawa Yesus dan menyuruh orang mencambuk-Nya.”
  rationale: Teks Yunani menjadikan Pilatus subjek kedua verba, tetapi dalam konteks pejabat berwenang tindakan itu dapat mencakup tindakan yang dilaksanakan atas perintahnya. Teks utama mempertahankan bentuk permukaan dan ketegangan ini; catatan kaki menjelaskan kemungkinan pendelegasian tanpa memasukkannya secara paksa ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lalu” menjaga gerak narasi; “mencambuk” dipilih daripada istilah yang lebih kuno atau kurang jelas. Penulisan “-Nya” mengikuti kelaziman gaya Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
