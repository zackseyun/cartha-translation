  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: id
  text: Ketika Pilatus mendengar perkataan itu, ia menjadi semakin takut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Ketika
  rationale: Ὅτε memperkenalkan waktu terjadinya reaksi Pilatus. Dalam konteks ini, daya penghubung οὖν sudah tersampaikan secara alami oleh alur narasi sehingga tidak perlu diterjemahkan secara eksplisit.
- source_word: ἤκουσεν
  choice: mendengar
  rationale: Bentuk aoris ἀκούω di sini menyatakan bahwa Pilatus menerima atau mendengar informasi yang baru saja disampaikan.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Nama diri diterjemahkan menurut bentuk baku bahasa Indonesia tanpa artikel Yunani.
- source_word: τοῦτον τὸν λόγον
  choice: perkataan itu
  rationale: λόγος menunjuk pada isi yang baru saja diucapkan, yakni pernyataan dalam ayat sebelumnya. 'Perkataan itu' alami dalam narasi Indonesia dan tidak menyiratkan hanya satu kata.
- source_word: μᾶλλον
  choice: semakin
  rationale: Adverbia komparatif ini menunjukkan peningkatan rasa takut dibandingkan keadaan sebelumnya.
- source_word: ἐφοβήθη
  choice: menjadi ... takut
  rationale: Bentuk aoris φοβέομαι dapat bernuansa ingresif atau peristiwa; bersama μᾶλλον, ungkapan 'menjadi semakin takut' menyampaikan meningkatnya ketakutan Pilatus secara wajar.
theological_decisions:
- issue: Sifat atau penyebab ketakutan Pilatus
  choice: Menyatakan secara lugas bahwa ketakutan Pilatus meningkat tanpa menentukan penyebabnya.
  alternative: Menjelaskan ketakutan itu sebagai kecemasan politik atau sebagai rasa takut terhadap kemungkinan bahwa Yesus bersifat ilahi.
  rationale: Teks Yunani hanya menyebut peningkatan rasa takut setelah Pilatus mendengar perkataan tersebut. Terjemahan mempertahankan ketegangan naratif dan tidak memastikan motif yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, alami, dan bermartabat. Susunan kalimat mempertahankan hubungan waktu serta peningkatan rasa takut dalam teks sumber.
