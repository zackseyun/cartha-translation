  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: id
  text: Jadi, karena hari itu adalah hari persiapan orang Yahudi dan karena makam itu dekat, mereka membaringkan Yesus di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: di sana
  rationale: Keterangan tempat ini menunjuk pada makam yang dekat itu. Penempatannya pada akhir kalimat alami dalam bahasa Indonesia dan tetap mempertahankan rujukan tempatnya.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kelanjutan sekaligus kesimpulan naratif dari konteks sebelumnya; “Jadi” ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: διὰ τὴν παρασκευὴν
  choice: karena hari persiapan
  rationale: διά dengan akusatif menyatakan alasan. παρασκευή dapat menjadi istilah kalender bagi hari persiapan menjelang Sabat atau hari raya; “hari persiapan” jelas tanpa mempersempitnya melebihi teks.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Genitif ini menerangkan “hari persiapan.” Bentuk “hari persiapan orang Yahudi” cukup dekat dengan susunan Yunani dan tidak menentukan secara berlebihan apakah tekanannya etnis, agama, atau adat.
- source_word: ὅτι
  choice: dan karena
  rationale: Memperkenalkan alasan tambahan bahwa makam itu dekat. Pengulangan “karena” memperjelas hubungan sebab dalam bahasa Indonesia, sedangkan “dan” menghubungkan kedua pertimbangan.
- source_word: ἐγγὺς
  choice: dekat
  rationale: Menyatakan kedekatan lokasi makam; “dekat” merupakan padanan Indonesia yang alami dan tepat.
- source_word: μνημεῖον
  choice: makam
  rationale: Dalam konteks pemakaman ini, istilah tersebut menunjuk tempat jenazah dibaringkan; “makam” merupakan istilah baku dan mudah dipahami.
- source_word: ἔθηκαν
  choice: membaringkan
  rationale: τίθημι di sini mengacu pada menempatkan jenazah Yesus di makam. “Membaringkan” alami dalam konteks pemakaman dan lebih khusus daripada “menaruh.”
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Objek langsung verba; memakai bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna παρασκευή dalam konteks kisah sengsara
  choice: hari persiapan
  alternative: Hari Persiapan
  rationale: Istilah Yunani dapat berfungsi sebagai sebutan kalender tetap, tetapi bentuk deskriptif dengan huruf kecil dapat dipahami pembaca modern tanpa memasukkan penetapan kalender yang lebih khusus daripada teks.
- issue: Hubungan τῶν Ἰουδαίων dengan παρασκευή
  choice: hari persiapan orang Yahudi
  alternative: hari persiapan Yahudi; Hari Persiapan orang Yahudi
  rationale: Pilihan ini mempertahankan bentuk genitif dan ketegangan ungkapan Yohanes tanpa melunakkan atau mempertajamnya menjadi penilaian teologis terhadap orang Yahudi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab dibuat jelas dengan dua kali “karena,” sementara istilah kalender dan ungkapan Johannine dipertahankan tanpa tambahan denominasi atau harmonisasi kronologis.
