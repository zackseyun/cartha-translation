base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: id
  text: Tetapi, salah seorang prajurit menusuk sisi-Nya dengan tombak[a], dan seketika itu juga darah dan air keluar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembing.”
    reason: lexical_alternative
  - marker: b
    text: Sebagian penafsir memahami “darah dan air” secara simbolis atau sakramental; sebagian lain memahaminya sebagai gambaran fisik. Teks Yunani sendiri tidak menjelaskan maknanya di sini.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai kontras dengan pernyataan sebelumnya bahwa kaki Yesus tidak dipatahkan; “Namun” alami dan cukup kuat dalam narasi Indonesia.
- source_word: εἷς τῶν στρατιωτῶν
  choice: salah seorang prajurit
  rationale: Mempertahankan konstruksi partitif Yunani secara alami, bukan meratakannya menjadi sekadar “seorang prajurit”.
- source_word: λόγχῃ
  choice: dengan tombak
  rationale: Menunjuk pada senjata tikam bertangkai yang digunakan prajurit; “tombak” adalah istilah Indonesia modern yang jelas.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini secara wajar merujuk kepada Yesus dari konteks; bentuk hormat “-Nya” lazim dalam teks Alkitab bahasa Indonesia.
- source_word: τὴν πλευρὰν
  choice: lambung
  rationale: πλευρά berarti sisi tubuh; “lambung” merupakan padanan naratif yang alami tanpa menentukan organ internal tertentu.
- source_word: ἔνυξεν
  choice: menikam
  rationale: Kata kerja ini menyatakan tindakan menusuk dengan benda runcing; “menikam” tepat untuk tindakan dengan tombak dan tetap lugas.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: dan seketika itu juga ... mengalir keluar
  rationale: Mempertahankan urutan καί dan daya temporal εὐθύς. “Mengalir keluar” mengungkapkan keluarnya cairan secara alami dalam bahasa Indonesia tanpa menambahkan penafsiran.
- source_word: αἷμα καὶ ὕδωρ
  choice: darah dan air
  rationale: Terjemahan langsung mempertahankan ungkapan yang tidak biasa itu tanpa perluasan interpretatif.
theological_decisions:
- issue: Apakah “darah dan air” harus ditafsirkan secara sakramental atau fisiologis dalam teks utama
  choice: Mempertahankan frasa harfiah “darah dan air” tanpa penjelasan interpretatif.
  alternative: Memahaminya sebagai kiasan sakramental atau sebagai gambaran fisiologis akibat luka.
  rationale: Ayat ini menyatakan fenomena tersebut, tetapi tidak menjelaskan maknanya. Terjemahan perlu mempertahankan ketegangan dan keterbukaan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan kalimat menjaga kontras serta urutan tindakan dalam teks Yunani. Penanda catatan kaki ditempatkan tepat setelah unsur yang diterangkannya.
