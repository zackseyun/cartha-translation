  rationale: Revisi mengganti “Namun” dengan “Tetapi” sebagai konjungsi adversatif naratif yang langsung, “lambung-Nya” dengan “sisi-Nya” agar sesuai dengan makna πλευρά tanpa penyempitan anatomis, dan “mengalir keluar” dengan “keluar” agar tidak menambahkan cara keluarnya. Ambiguitas mengenai makna “darah dan air” tetap dipertahankan dalam teks utama dan dijelaskan secara netral dalam catatan kaki.
