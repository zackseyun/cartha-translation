  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: id
  text: Orang-orang Yahudi menjawabnya, “Kami mempunyai hukum, dan menurut hukum itu dia harus mati, karena dia menjadikan dirinya Anak Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang anak Allah.” Bentuk Yunani tidak memakai artikel, tetapi dalam konteks ini ungkapan tersebut dapat dipahami sebagai gelar, “Anak Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: menjawab dia
  rationale: Mengungkapkan verba naratif ‘menjawab’ dan objek tidak langsung αὐτῷ secara langsung serta alami dalam bahasa Indonesia.
- source_word: οἱ Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Merupakan padanan langsung bagi sebutan kelompok dalam teks. Ayat ini sendiri tidak secara eksplisit membatasi rujukannya hanya kepada para pemimpin Yahudi.
- source_word: νόμον ἔχομεν
  choice: Kami mempunyai hukum
  rationale: Mempertahankan bentuk tanpa artikel pada penyebutan pertama dan menampilkan dasar hukum yang mereka ajukan tanpa langsung menggantinya dengan istilah yang lebih khusus, ‘Taurat’.
- source_word: κατὰ τὸν νόμον
  choice: menurut hukum itu
  rationale: 'Kata penunjuk ‘itu’ secara alami menyampaikan fungsi anaforis artikel Yunani: hukum yang dimaksud ialah hukum yang baru saja disebut.'
- source_word: ὀφείλει ἀποθανεῖν
  choice: dia harus mati
  rationale: Dalam konteks tuntutan hukum, ‘harus mati’ menyampaikan kewajiban yang dinyatakan oleh ὀφείλει dengan jelas dan wajar; ini melaporkan tuntutan para penuduh, bukan menetapkan keniscayaan ilahi.
- source_word: υἱὸν θεοῦ
  choice: Anak Allah
  rationale: Ungkapan ini dapat berfungsi sebagai gelar atau sebutan kualitatif meskipun tanpa artikel. Dalam konteks Yohanes, ‘Anak Allah’ menyampaikan tuduhan tentang status filial ilahi yang khas tanpa menambahkan artikel yang tidak diperlukan dalam bahasa Indonesia.
- source_word: ἑαυτὸν ἐποίησεν
  choice: menjadikan dirinya
  rationale: Mempertahankan gambaran dan bentuk tuduhan dalam ungkapan Yunani secara cukup dekat, tanpa mengubahnya secara interpretatif menjadi sekadar ‘mengaku’ atau ‘menyatakan’.
theological_decisions:
- issue: Makna υἱὸν θεοῦ dalam tuduhan terhadap Yesus
  choice: Anak Allah
  alternative: seorang anak Allah
  rationale: Ketiadaan artikel dalam bahasa Yunani tidak dengan sendirinya menuntut arti tak tentu. Konteks Yohanes menunjukkan bahwa para penuduh mempersoalkan klaim akan hubungan filial ilahi yang khas. Terjemahan utama mempertahankan daya tersebut, sedangkan kemungkinan bentuk tak tentu dicatat agar ciri gramatikal sumber tidak disembunyikan.
- issue: Sifat keharusan dalam ὀφείλει ἀποθανεῖν
  choice: harus mati
  alternative: patut mati
  rationale: ‘Harus’ paling alami menyatakan kewajiban hukum yang diklaim para penuduh. Frasa itu tidak disajikan sebagai penilaian narator atau sebagai keharusan teologis yang mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti ‘dia’ tidak dikapitalisasi agar kapitalisasi tidak memasukkan penafsiran atau gaya denominasi yang tidak terdapat dalam naskah Yunani. Pengulangan ‘hukum ... hukum itu’ dipertahankan untuk mencerminkan pengulangan νόμος dan hubungan rujukannya.
