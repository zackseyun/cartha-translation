  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: id
  text: Maka, para imam kepala orang Yahudi[a] terus berkata kepada Pilatus, “Jangan tulis, ‘Raja Orang Yahudi,’ melainkan tulislah bahwa orang itu berkata, ‘Aku adalah Raja Orang Yahudi.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea” / “Raja Orang Yudea.” Istilah Yunani ini dapat menunjuk kepada orang Yahudi pada umumnya atau, bergantung pada konteks, kepada orang Yudea secara lebih khusus.
    reason: alternative_reading
  - marker: b
    text: Atau “Akulah Raja Orang Yahudi.” Bahasa Yunani tidak memakai kata sandang sebelum “Raja” dalam klausa ini, tetapi bahasa Indonesia tidak memiliki kata sandang tentu yang tepat sepadan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: terus berkata
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau diulang; ‘terus berkata’ mempertahankan aspek itu secara wajar dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Mempertahankan fungsi penghubung yang meneruskan alur sekaligus mengaitkannya dengan tindakan Pilatus pada konteks sebelumnya.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Istilah ini menunjuk kepada kalangan pemimpin keimaman, bukan kepada beberapa orang yang semuanya sekaligus menjabat sebagai satu-satunya imam besar.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam kisah sengsara, frasa ini merupakan sebutan politis-religius yang lazim diterjemahkan ‘orang Yahudi’; kemungkinan makna yang lebih geografis, ‘orang Yudea,’ dicatat dalam catatan kaki.
- source_word: Μὴ γράφε
  choice: Jangan tulis
  rationale: Larangan langsung ini diterjemahkan dengan bentuk Indonesia yang ringkas dan alami.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Raja Orang Yahudi
  rationale: Mempertahankan bunyi gelar pada tulisan yang dipersoalkan; huruf kapital menandai pemakaiannya sebagai gelar dalam kutipan.
- source_word: ἀλλ’ ὅτι
  choice: melainkan tulislah bahwa
  rationale: Kata kerja ‘tulislah’ disuplai dari perintah sebelumnya agar konstruksi korektifnya jelas dan alami dalam bahasa Indonesia tanpa mengubah maksud sumber.
- source_word: ἐκεῖνος
  choice: orang itu
  rationale: Demonstratif ini lebih kuat daripada pronomina netral dan dapat menyiratkan jarak; ‘orang itu’ mempertahankan nuansa tersebut tanpa menambahkan penghinaan yang tidak pasti.
- source_word: εἶπεν
  choice: berkata
  rationale: Menerjemahkan verba secara langsung tanpa memasukkan gagasan ‘mengaku’ atau ‘mengeklaim’ yang tidak dinyatakan secara eksplisit.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Aku adalah Raja Orang Yahudi
  rationale: Susunan predikatif diterjemahkan secara alami dalam bahasa Indonesia. Bahasa Indonesia tidak memiliki kata sandang tentu yang langsung sepadan dengan ‘the,’ sehingga ketidakhadiran artikel Yunani tidak boleh dibebani secara berlebihan.
theological_decisions:
- issue: Makna Ἰουδαίων dalam konteks kisah sengsara Yohanes
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Konteks langsungnya adalah gelar resmi ‘Raja Orang Yahudi,’ sehingga pilihan konvensional ini paling jelas. Namun, karena istilah Yunani dapat memiliki cakupan geografis ‘orang Yudea,’ kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Ketentuan gelar dalam Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Aku adalah Raja Orang Yahudi
  alternative: Akulah Raja Orang Yahudi
  rationale: Bahasa Yunani tidak memakai artikel sebelum βασιλεύς dalam klausa ini, tetapi konstruksi predikatif tetap dapat bersifat tentu. Terjemahan utama menghindari penekanan tambahan dari partikel ‘-lah,’ sedangkan alternatifnya dicatat sebagai kemungkinan idiomatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan ‘tulis/tulislah’ dipertahankan demi kejelasan koreksi yang diminta para imam kepala; ‘orang itu’ menjaga daya demonstratif ἐκεῖνος.
