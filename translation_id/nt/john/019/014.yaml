  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: id
  text: Hari itu adalah hari persiapan Paskah; waktu itu kira-kira jam keenam.[a] Lalu ia berkata kepada orang-orang Yahudi,[b] “Lihatlah, rajamu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemungkinan juga berarti kira-kira tengah hari dalam sistem penghitungan jam tertentu; cara penghitungan jam yang dimaksud diperdebatkan.
    reason: cultural_note
  - marker: b
    text: Dalam konteks ini, “orang-orang Yahudi” mungkin secara lebih khusus menunjuk kepada para penguasa di Yudea atau para pemimpin Yahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ
  choice: hari persiapan
  rationale: Istilah ini menunjuk pada hari persiapan menjelang perayaan atau Sabat. Padanan ini mempertahankan makna waktunya dan terdengar wajar dalam bahasa Indonesia.
- source_word: τοῦ πάσχα
  choice: Paskah
  rationale: Genitif Yunani dipadankan secara alami dalam frasa “hari persiapan Paskah,” tanpa memaksakan apakah yang dimaksud khususnya persiapan untuk perjamuan atau hari persiapan dalam masa Paskah.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: waktu itu kira-kira jam keenam
  rationale: Mempertahankan cara penyebutan waktu dalam budaya sumber serta unsur perkiraan ὡς. Kemungkinan padanan waktu modern dijelaskan dalam catatan kaki.
- source_word: λέγει
  choice: ia berkata
  rationale: Bahasa Indonesia tidak menandai kala seperti bahasa Yunani; bentuk ini alami dalam narasi dan tidak perlu memaksakan perbedaan antara present historis dan lampau.
- source_word: τοῖς Ἰουδαίοις
  choice: kepada orang-orang Yahudi
  rationale: Menerjemahkan sebutan Yunani secara langsung. Kemungkinan bahwa konteks menunjuk lebih khusus kepada para penguasa atau pemimpin Yahudi dipertahankan dalam catatan kaki.
- source_word: Ἴδε
  choice: Lihatlah
  rationale: Seruan ini menarik perhatian kepada orang yang sedang ditampilkan dan mempertahankan nada publik serta khidmat tanpa memakai ungkapan yang usang.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: rajamu
  rationale: Bentuk posesif tunggal kolektif ini alami dalam bahasa Indonesia dan mempertahankan daya sindiran serta muatan politik perkataan Pilatus.
theological_decisions:
- issue: Rujukan “orang-orang Yahudi” dalam Injil Yohanes
  choice: Mempertahankan “orang-orang Yahudi” dalam teks utama
  alternative: para pemimpin Yahudi; para penguasa Yudea
  rationale: Teks sumber memakai τοῖς Ἰουδαίοις tanpa pembatas eksplisit. Terjemahan utama tidak mempersempit rujukannya, sedangkan kemungkinan kontekstual yang lebih khusus dicatat agar sebutan ini tidak digeneralisasi melampaui konteks.
- issue: Penyebutan waktu kuno “jam keenam”
  choice: Mempertahankan ungkapan berorientasi budaya sumber
  alternative: kira-kira tengah hari
  rationale: Teks menyebut jam keenam dan menyertakan penanda perkiraan. Mempertahankannya menghindari penyelesaian berlebihan atas perdebatan mengenai sistem penghitungan jam; kemungkinan padanan modern diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hari persiapan Paskah” mempertahankan kepadatan frasa sumber; “Lihatlah” menjaga kekuatan seruan; dan tanda titik koma mencerminkan hubungan erat antara penanggalan dan keterangan waktu.
