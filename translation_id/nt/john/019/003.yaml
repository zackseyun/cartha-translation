  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: id
  text: Mereka berulang kali datang kepada-Nya dan berkata[a], “Salam, Raja orang Yahudi!” dan mereka berulang kali menampar-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka terus datang kepada-Nya dan terus berkata.” Kedua verba Yunani ini berbentuk imperfek dan dapat menunjukkan tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: Mereka terus mendatangi Dia dan berkata
  rationale: Kedua verba berbentuk imperfek dan dalam konteks ini menggambarkan tindakan berulang. Kata “terus” menyampaikan corak iteratif secara wajar tanpa mengulang penanda aspek pada kedua verba.
- source_word: Χαῖρε
  choice: Salam
  rationale: Dalam konteks penghormatan kerajaan yang pura-pura, “Salam” merupakan sapaan formal yang alami dalam bahasa Indonesia; nada ejekannya tampak dari konteks, gelar, dan tindakan para prajurit.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: hai Raja orang Yahudi
  rationale: Gelar itu diterjemahkan langsung. Partikel vokatif “hai” mempertahankan bentuk sapaan langsung dan nuansa penghormatan yang dibuat-buat.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: mereka menampar-Nya
  rationale: ῥαπίσματα menunjuk pada tamparan atau pukulan dengan tangan. “Menampar” menyampaikan tindakan fisik itu secara tepat dan alami; konteks serta bentuk imperfek mendukung tindakan yang berulang.
theological_decisions:
- issue: Nada sapaan kepada Yesus
  choice: Sapaan kerajaan formal yang bersifat mengejek
  alternative: Sapaan netral atau tulus
  rationale: Konteks penghinaan dalam kisah sengsara menunjukkan bahwa penghormatan tersebut pura-pura. Terjemahan tidak menambahkan kata “mengejek”, tetapi membiarkan ironi muncul dari sapaan dan tindakan mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina yang mengacu kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. “Salam, hai Raja orang Yahudi!” mempertahankan bentuk penghormatan kerajaan yang ironis tanpa menjelaskan ejekan itu secara berlebihan.
