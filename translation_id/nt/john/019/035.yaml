id: JHN.19.35
reference: John 19:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: id
  text: Dan orang yang telah melihat telah bersaksi, dan kesaksiannya benar. Orang itu tahu bahwa ia mengatakan yang benar, supaya kamu juga percaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya kamu juga terus percaya.” Bentuk subjungtif kini dapat mengandung nuansa yang berkelanjutan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: orang yang telah melihatnya
  rationale: Partisipel perfek substantival dipertahankan tanpa langsung menamai sosok itu sebagai saksi mata. Objek tersirat dibuat eksplisit secara wajar dalam bahasa Indonesia melalui akhiran '-nya', mengacu pada peristiwa yang baru diceritakan.
- source_word: μεμαρτύρηκεν
  choice: sudah bersaksi
  rationale: Bentuk perfek menyatakan tindakan bersaksi yang telah terjadi dan tetap berlaku. 'Sudah bersaksi' alami dalam bahasa Indonesia dan mempertahankan hubungan leksikal dengan 'kesaksian'.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: kesaksiannya benar
  rationale: '''Benar'' secara langsung menyampaikan bahwa kesaksian itu dapat dipercaya dan sesuai dengan kebenaran, tanpa mempersempitnya menjadi sekadar ''tulus'' atau ''asli''.'
- source_word: ἐκεῖνος
  choice: orang itu
  rationale: Ungkapan ini mempertahankan daya tunjuk dan penekanan kata Yunani, serta tidak memutuskan apakah yang dimaksud ialah narator sendiri atau seorang saksi lain.
- source_word: οἶδεν
  choice: tahu
  rationale: Walaupun bentuknya secara historis perfek, οἶδα berfungsi statif dengan makna kini; 'tahu' merupakan padanan Indonesia yang idiomatis.
- source_word: ἀληθῆ λέγει
  choice: ia mengatakan yang benar
  rationale: Frasa ini menyampaikan bahwa yang dikatakannya benar. Rumusan tersebut cukup alami sekaligus lebih dekat pada bentuk Yunani daripada parafrasa 'berkata jujur'.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: supaya kamu juga percaya
  rationale: ἵνα menyatakan tujuan dan καί menandai bahwa para pembaca juga termasuk. Bentuk 'kamu' dapat menunjuk jamak dalam bahasa Indonesia modern tanpa menambahkan penanda yang tidak ada dalam teks.
theological_decisions:
- issue: Rujukan ungkapan orang ketiga yang tegas
  choice: Identitas saksi tidak disebutkan; teks memakai 'orang yang telah melihatnya' dan 'orang itu'.
  alternative: Mengidentifikasinya sebagai murid yang dikasihi/narator, atau sebagai saksi mata lain yang berbeda.
  rationale: Teks Yunani tidak secara eksplisit mengidentifikasi saksi tersebut. Mempertahankan bentuk orang ketiga menjaga ambiguitas dan kemungkinan gaya penyebutan diri secara khidmat.
- issue: Nuansa πιστεύητε
  choice: percaya
  alternative: terus percaya
  rationale: Subjungtif kini dapat memiliki nuansa berkelanjutan, tetapi konteks juga memungkinkan arti yang tidak ditandai sebagai awal atau kelanjutan iman. Teks utama tidak memutuskan nuansa itu, dan catatan kaki menyajikan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar jelas bagi pembaca umum, tanpa mengubah hubungan gagasannya. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
