  to: Dan orang yang telah melihat telah bersaksi, dan kesaksiannya benar. Orang itu tahu bahwa ia mengatakan yang benar, supaya kamu juga percaya.[a]
  rationale: Akhiran “-nya” dihapus untuk mempertahankan objek partisipel Yunani yang tidak dinyatakan dan untuk tidak mengarahkan pembaca kepada rujukan tertentu. Selebihnya, pilihan terjemahan dipertahankan karena setia kepada bentuk orang ketiga yang ambigu, penekanan demonstratif ἐκεῖνος, serta tujuan ἵνα dengan subjungtif kini. Catatan kaki tetap ditempatkan pada “percaya” dan secara tepat menyatakan kemungkinan nuansa berkelanjutan tanpa menjadikannya makna utama.
