  source_fidelity: Teks Indonesia dengan setia menyampaikan alur inferensial οὖν (“Maka”), seruan keras berulang Ἆρον ἆρον, perintah penyaliban, pertanyaan retoris Pilatus, serta pernyataan eksklusif para imam kepala. Penambahan objek “dia” dalam seruan “Singkirkan dia!” merupakan pelengkapan konteks yang wajar dan tidak mengubah makna.
