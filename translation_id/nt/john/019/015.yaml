id: JHN.19.15
reference: John 19:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: id
  text: Maka mereka berteriak, “Singkirkan dia! Singkirkan dia! Salibkan dia!” Pilatus berkata kepada mereka, “Haruskah aku menyalibkan raja kalian?” Para imam kepala menjawab, “Kami tidak mempunyai raja selain Kaisar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Maka mereka berteriak
  rationale: οὖν menyatakan kelanjutan atau akibat dalam narasi, sedangkan κραυγάζω menunjuk pada teriakan keras. Kata ἐκεῖνοι memberi penekanan pada kelompok itu, tetapi dalam bahasa Indonesia alami cukup diwakili oleh “mereka” dalam konteks ini.
- source_word: Ἆρον ἆρον
  choice: Singkirkan dia! Singkirkan dia!
  rationale: Imperatif αἴρω yang diulang merupakan seruan kuat agar Yesus disingkirkan. Objeknya tersirat dalam bahasa Yunani dan dibuat eksplisit dalam bahasa Indonesia agar seruan itu alami dan jelas.
- source_word: σταύρωσον αὐτόν
  choice: Salibkan dia!
  rationale: Dalam konteks hukuman mati Romawi, σταυρόω secara tepat berarti menyalibkan.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Haruskah aku menyalibkan raja kalian?
  rationale: Bentuk subjungtif deliberatif dipertahankan sebagai pertanyaan retoris. “Kalian” menunjukkan bahwa ὑμῶν berbentuk jamak dan mempertahankan sindiran tajam Pilatus.
- source_word: οἱ ἀρχιερεῖς
  choice: Para imam kepala
  rationale: Bentuk jamak ini menunjuk kepada para pemimpin kalangan imam, bukan kepada beberapa imam besar yang sedang menjabat pada saat yang sama.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Kami tidak mempunyai raja selain Kaisar
  rationale: εἰ μὴ menyatakan pengecualian yang tegas. “Selain Kaisar” terdengar alami dalam bahasa Indonesia dan mempertahankan eksklusivitas pernyataan itu.
theological_decisions:
- issue: Pernyataan kesetiaan politik para imam kepala
  choice: Kami tidak mempunyai raja selain Kaisar
  alternative: Kami tidak mempunyai raja kecuali Kaisar
  rationale: Terjemahan mempertahankan penolakan keras terhadap raja lain dalam adegan tersebut tanpa menambahkan kesimpulan teologis yang tidak dinyatakan langsung oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan seruan dipertahankan untuk menyampaikan desakan massa; “kalian” dipakai untuk menandai bentuk jamak Yunani secara alami.
