id: JHN.19.24
reference: John 19:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: id
  text: Lalu mereka berkata satu sama lain, “Janganlah kita merobeknya, tetapi marilah kita membuang undi untuk menentukan siapa yang akan memilikinya,” agar Kitab Suci digenapi, yang berkata, “Mereka membagi-bagi pakaian-ku di antara mereka[a], dan untuk jubah-ku mereka membuang undi.” Jadi, para prajurit melakukan hal-hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dikutip dari Mazmur 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: merobeknya
  rationale: Kata kerja ini berarti merobek atau membelah; 'merobek' merupakan ungkapan Indonesia yang alami untuk kain.
- source_word: λάχωμεν
  choice: membuang undi
  rationale: Ungkapan ini menunjuk pada penentuan pemilik dengan undian. 'Membuang undi' jelas dan juga selaras dengan ungkapan dalam kutipan Mazmur.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: untuk menentukan siapa yang akan mendapatkannya
  rationale: Terjemahan ini menyatakan fungsi undian secara alami dalam bahasa Indonesia, yakni menentukan siapa yang memperoleh pakaian itu, tanpa menambahkan gagasan yang tidak tersirat.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: supaya genaplah Kitab Suci
  rationale: Mempertahankan rumusan penggenapan khas Yohanes dan hubungan tujuan/hasil yang dinyatakan oleh ἵνα, tanpa menjelaskan mekanisme teologisnya secara berlebihan.
- source_word: ἱμάτιά
  choice: pakaian
  rationale: Istilah jamak ini merujuk pada pakaian-pakaian; dalam bahasa Indonesia, 'pakaian' dapat berfungsi kolektif dan terdengar wajar dalam kutipan.
- source_word: ἑαυτοῖς
  choice: di antara mereka
  rationale: Menangkap makna distributif refleksif, yaitu pakaian itu dibagi di antara para pelaku.
- source_word: ἱματισμόν
  choice: jubah
  rationale: Mempertahankan perbedaan leksikal dari ἱμάτια dan sesuai dengan paralelisme puitis; konteks ayat sebelumnya juga berbicara tentang pakaian yang tidak berjahit.
- source_word: ἔβαλον κλῆρον
  choice: mereka membuang undi
  rationale: Mewakili verba dan objek tunggal sebagai idiom Indonesia yang lazim tanpa memaksakan bentuk tunggal yang kaku.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Demikianlah yang dilakukan para prajurit itu
  rationale: Menyampaikan penegasan penutup bahwa tindakan para prajurit tersebut sesuai dengan kutipan yang baru diberikan.
theological_decisions:
- issue: Hubungan tindakan para prajurit dengan penggenapan Kitab Suci dalam ἵνα ἡ γραφὴ πληρωθῇ
  choice: 'Menerjemahkannya sebagai pernyataan penggenapan: ''supaya genaplah Kitab Suci''.'
  alternative: ‘sehingga genaplah Kitab Suci’ sebagai pernyataan hasil.
  rationale: Bentuk ἵνα dipertahankan sebagai rumusan penggenapan tanpa menambahkan penjelasan deterministis atau menghapus ketegangan antara maksud ilahi dan tindakan manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Marilah kita' mempertahankan nuansa ajakan deliberatif; 'para prajurit' lebih alami daripada pengulangan 'prajurit-prajurit'. Kutipan memakai kapital pada pronomina '-Ku' menurut kebiasaan penerbitan Alkitab Indonesia karena suara pemazmur diterapkan pada Yesus dalam konteks Yohanes.
