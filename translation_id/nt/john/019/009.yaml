id: JHN.19.9
reference: John 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: id
  text: Lalu ia masuk lagi ke markas gubernur[a] dan berkata kepada Yesus, “Dari manakah asal-Mu?” Namun, Yesus tidak memberikan jawaban kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pretorium”, yaitu kediaman atau markas resmi gubernur Romawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Bentuk aoris dari εἰσέρχομαι menyatakan gerak masuk ke suatu tempat; “masuk” alami dan tepat dalam narasi bahasa Indonesia.
- source_word: πραιτώριον
  choice: markas gubernur
  rationale: Istilah ini menunjuk pada kediaman atau markas resmi gubernur Romawi. “Markas gubernur” menyampaikan fungsinya dengan jelas, sementara istilah sumber dicantumkan dalam catatan kaki.
- source_word: πάλιν
  choice: lagi
  rationale: Adverbia ini menandai pengulangan tindakan; “lagi” merupakan padanan yang lugas dan alami.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bahasa Yunani memakai bentuk kini historis, bentuk lampau naratif dipahami secara alami dari konteks bahasa Indonesia tanpa perlu penanda waktu tambahan.
- source_word: Πόθεν εἶ σύ
  choice: Dari manakah asal-Mu?
  rationale: Pertanyaan ini menanyakan asal atau sumber. Rumusan tersebut alami, bermartabat, dan tetap mempertahankan kemungkinan makna yang lebih dalam dalam konteks Injil Yohanes.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: tidak memberikan jawaban kepadanya
  rationale: Terjemahan ini mempertahankan ungkapan Yunani yang secara harfiah menyatakan bahwa Yesus tidak memberikan jawaban kepadanya.
- source_word: καὶ ... καὶ ... δὲ
  choice: Lalu ... dan ... Namun
  rationale: “Lalu” mengalirkan narasi, “dan” menghubungkan tindakan, sedangkan “Namun” menonjolkan kontras antara pertanyaan dan diamnya Yesus.
theological_decisions:
- issue: Rujukan subjek yang tersirat
  choice: Memakai “ia”, dengan konteks sebelumnya menunjuk kepada Pilatus.
  alternative: Menyebut “Pilatus” secara eksplisit.
  rationale: Teks Yunani tidak menyebut nama subjek dalam ayat ini. “Ia” mengikuti bentuk sumber dan tidak menambahkan nama, sementara konteks mengidentifikasinya dengan jelas sebagai Pilatus.
- issue: Cakupan pertanyaan tentang asal Yesus
  choice: “Dari manakah asal-Mu?”
  alternative: “Engkau berasal dari mana?”
  rationale: Pilihan ini mempertahankan pertanyaan mengenai asal tanpa membatasinya hanya pada tempat geografis, sehingga ambiguitas dan ketegangan teologis khas konteks Yohanes tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Huruf kapital pada “-Mu” mengikuti kebiasaan penulisan sapaan kepada Yesus. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
