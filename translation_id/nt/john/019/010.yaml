  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: id
  text: Lalu Pilatus berkata kepada-Nya, “Engkau tidak berbicara kepadaku? Tidak tahukah Engkau bahwa aku memiliki wewenang[a] untuk membebaskan Engkau dan memiliki wewenang untuk menyalibkan Engkau?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuasa” atau “hak”. Kata Yunani exousia dapat menunjuk pada wewenang, hak, atau kuasa. “Wewenang” dipilih di sini karena Pilatus berbicara dalam konteks hukum dan pemerintahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Lalu ... berkata
  rationale: οὖν berfungsi sebagai penghubung yang memajukan alur narasi; “lalu” alami dalam bahasa Indonesia dan mempertahankan daya urutannya tanpa membuat hubungan sebab-akibat terlalu tegas.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativus ini menyatakan objek tidak langsung. Huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika pronomina mengacu kepada Yesus.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Engkau tidak mau berbicara kepadaku?
  rationale: Ἐμοί ditempatkan di depan dan bersifat emfatis. Bentuk “tidak mau” menyampaikan pertanyaan retoris bernada teguran secara alami, sedangkan “kepadaku” mempertahankan penekanan Pilatus pada dirinya.
- source_word: οὐκ οἶδας
  choice: Tidak tahukah Engkau
  rationale: Terjemahan ini dekat dengan arti “tidak mengetahui” dan mempertahankan bentuk pertanyaan retoris.
- source_word: ἐξουσίαν ἔχω
  choice: aku memiliki wewenang
  rationale: ἐξουσία dapat berarti wewenang, hak, atau kuasa. “Wewenang” paling tepat dalam konteks hukum dan pemerintahan Pilatus tanpa menyiratkan bahwa klaimnya mutlak.
- source_word: ἀπολῦσαί σε
  choice: untuk membebaskan Engkau
  rationale: Dalam konteks peradilan, ἀπολύω berarti melepaskan atau membebaskan seseorang. Pilihan ini jelas dan tidak menambahkan gagasan bahwa Yesus dinyatakan tidak bersalah secara resmi.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: dan memiliki wewenang untuk menyalibkan Engkau
  rationale: Pengulangan ἐξουσίαν ἔχω dipertahankan secara wajar melalui “memiliki wewenang” untuk menegaskan kontras antara dua hasil yang diklaim berada di bawah keputusan Pilatus.
theological_decisions:
- issue: Sifat ἐξουσία yang diklaim Pilatus
  choice: Diterjemahkan “wewenang” tanpa mengesahkan klaim Pilatus sebagai wewenang yang mutlak atau mandiri.
  alternative: kuasa; hak
  rationale: Ayat ini melaporkan klaim Pilatus, sementara jawaban Yesus pada ayat berikutnya mengungkapkan batas dan sumber wewenang tersebut. Terjemahan harus mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Engkau” dipakai dalam dialog langsung sesuai register Alkitab Indonesia yang umum; struktur pengulangan mempertahankan tekanan retoris teks Yunani.
