  source_fidelity: 'Susunan dan isi utama draf sesuai dengan Yunani: permintaan diajukan kepada Pilatus berkaitan dengan tubuh-tubuh yang tidak boleh tetap di salib pada Sabat, dengan pematahan kaki dan pengangkatan tubuh. Namun, “hari yang istimewa” agak mengurangi kata μεγάλη (“besar/agung”) dan dapat terdengar terlalu umum.'
  naturalness: Bahasanya pada umumnya baku dan jelas. Menempatkan tujuan lebih dekat dengan permintaan serta memakai “tetap berada di salib” menghasilkan alur yang lebih langsung dan tidak menambahkan gambaran “tergantung” yang tidak tersurat dalam verba Yunani.
  terminology: “orang-orang Yahudi,” “hari persiapan,” “Sabat,” dan “Pilatus” tepat. Istilah “hari yang besar” mempertahankan ungkapan Yunani dengan lebih setia; catatan kaki dapat menjelaskan arti kontekstualnya tanpa menjadikannya pembatasan makna dalam teks utama.
  issues:
  - severity: low
    issue: Padanan μεγάλη sebagai “istimewa”
    rationale: Padanan ini dapat diterima secara kontekstual, tetapi kurang mempertahankan leksikon sumber yang secara harfiah menyebut hari Sabat itu “besar.” “Hari yang besar” tetap alami dalam register Alkitab dan memungkinkan penjelasan makna di catatan kaki.
  - severity: low
    issue: Tambahan “tergantung” dan urutan klausa
    rationale: “Tergantung” adalah implikasi konteks, bukan unsur leksikal dari μείνῃ. Menyusun ulang kalimat agar tujuan “tidak tetap berada di salib” mendahului rincian permintaan lebih dekat dengan struktur dan penekanan Yunani.
