  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: id
  text: Maka, karena hari itu adalah hari persiapan, orang-orang Yahudi[a] meminta kepada Pilatus agar tubuh-tubuh itu tidak tetap berada di salib pada hari Sabat—sebab hari Sabat itu adalah hari yang besar[c]—dan agar kaki mereka dipatahkan serta tubuh-tubuh itu diturunkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Injil Yohanes, sebutan “orang-orang Yahudi” kadang dapat menunjuk lebih khusus kepada para pemimpin atau penguasa Yahudi.
    reason: alternative_reading
  - marker: b
    text: 'Atau: “disingkirkan” atau “dibawa pergi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sebab Sabat itu adalah hari yang agung.” Ungkapan ini menunjukkan bahwa Sabat tersebut mempunyai arti khusus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: orang-orang Yahudi
  rationale: Ἰουδαῖοι secara formal berarti orang-orang Yahudi atau orang-orang Yudea. Dalam Injil Yohanes istilah ini kadang menunjuk lebih khusus kepada para pemimpin Yahudi, tetapi teks di sini tidak menyatakannya secara eksplisit. οὖν tidak diterjemahkan tersendiri karena hubungan akibat sudah tersampaikan secara alami oleh susunan kalimat dengan alasan di depan.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: Karena hari itu adalah hari persiapan
  rationale: παρασκευή menunjuk pada hari persiapan menjelang Sabat. Ungkapan deskriptif ini jelas bagi pembaca modern tanpa menjadikan istilah tersebut nama khusus.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: agar tubuh-tubuh itu tidak tetap tergantung pada salib pada hari Sabat
  rationale: ἵνα dengan subjungtif menyatakan tujuan. μείνῃ berarti tetap atau tinggal; kata 'tergantung' ditambahkan secara kontekstual untuk menghasilkan bahasa Indonesia yang alami tentang tubuh pada salib.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: sebab hari Sabat itu adalah hari yang istimewa
  rationale: μεγάλη secara harfiah berarti 'besar', tetapi mengenai suatu hari menyatakan arti penting atau keistimewaan. 'Hari yang istimewa' menyampaikan makna kontekstual secara alami tanpa memakai ungkapan gerejawi tertentu.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: meminta kepada Pilatus
  rationale: ἐρωτάω di sini berarti meminta, bukan sekadar mengajukan pertanyaan. Bentuk ini sesuai dengan permohonan agar suatu tindakan diizinkan.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: supaya kaki orang-orang yang disalibkan itu dipatahkan
  rationale: κατάγνυμι berarti mematahkan, dan bentuk pasif dipertahankan. Anteseden kata ganti dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia.
- source_word: καὶ ἀρθῶσιν
  choice: dan tubuh mereka diturunkan
  rationale: αἴρω dapat berarti mengangkat, menyingkirkan, atau membawa pergi. Dalam konteks tubuh yang masih berada pada salib, 'diturunkan' merupakan padanan kontekstual yang alami; alternatif yang lebih luas dicatat.
theological_decisions:
- issue: Cakupan sebutan Ἰουδαῖοι dalam narasi Yohanes
  choice: orang-orang Yahudi
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Terjemahan utama mempertahankan sebutan umum dalam bahasa sumber dan tidak mempersempit rujukannya secara diam-diam. Catatan kaki mengingatkan bahwa dalam konteks Yohanes istilah itu dapat menunjuk lebih khusus kepada kalangan berwenang.
- issue: Makna μεγάλη sehubungan dengan hari Sabat
  choice: hari yang istimewa
  alternative: hari yang besar; Sabat yang sangat penting
  rationale: Keterangan ini menunjukkan arti khusus Sabat tersebut. Padanan 'istimewa' menyampaikan daya makna μεγάλη dalam pemakaian mengenai hari tanpa mengimpor terminologi tradisional atau penjelasan kalender yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan klausa ditata ulang agar alasan, permintaan, dan tujuannya mudah diikuti. Istilah 'hari persiapan' dipertahankan dalam huruf kecil sebagai deskripsi, sementara 'Sabat' ditulis sebagai nama hari. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
