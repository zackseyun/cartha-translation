  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: id
  text: Setelah itu, Yesus, yang mengetahui bahwa segala sesuatu sudah selesai, berkata, “Aku haus,” supaya Kitab Suci digenapi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Sesudah itu
  rationale: Ungkapan ini menjadi peralihan waktu yang alami dalam bahasa Indonesia dan tetap mencerminkan bentuk demonstratif tunggal τοῦτο.
- source_word: εἰδὼς
  choice: karena tahu
  rationale: Partisip ini menerangkan keadaan atau dasar tindakan Yesus; 'karena tahu' alami dalam bahasa Indonesia sekaligus mempertahankan kaitan sintaksisnya.
- source_word: ἤδη πάντα τετέλεσται
  choice: segala sesuatu sudah selesai
  rationale: Bentuk perfektum menyatakan bahwa semuanya telah mencapai keadaan selesai; 'sudah selesai' jelas dan wajar tanpa menambahkan penafsiran mengenai cakupan πάντα.
- source_word: ἵνα τελειωθῇ
  choice: supaya ... digenapi
  rationale: Dengan Kitab Suci sebagai subjek, 'digenapi' merupakan padanan idiomatis, sedangkan 'supaya' mempertahankan nuansa tujuan atau hasil dari ἵνα.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Dalam konteks Yohanes, γραφή mengacu pada tulisan suci yang berotoritas; 'Kitab Suci' adalah ungkapan Indonesia yang lazim.
- source_word: λέγει
  choice: berkata
  rationale: Present historis Yunani secara alami diterjemahkan dengan bentuk naratif Indonesia 'berkata'.
- source_word: Διψῶ
  choice: Aku haus
  rationale: Padanan ini langsung, ringkas, alami, dan mempertahankan bentuk orang pertama serta keadaan yang dinyatakan oleh verba kini Yunani.
theological_decisions:
- issue: Hubungan antara pengetahuan Yesus, selesainya segala sesuatu, dan penggenapan Kitab Suci
  choice: Yesus mengetahui bahwa segala sesuatu sudah selesai, lalu berkata 'Aku haus' supaya Kitab Suci digenapi.
  alternative: Klausa ἵνα dapat dipahami dengan nuansa hasil—bahwa dengan perkataan itu Kitab Suci pun digenapi—tanpa menegaskan suatu sistem teologis yang lebih luas.
  rationale: Terjemahan mempertahankan hubungan sintaksis serta ketegangan tujuan/hasil dalam ἵνα, dan tidak menambahkan penjelasan mengenai pengetahuan ilahi, predestinasi, atau cakupan 'segala sesuatu'.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan klausa diatur agar hubungan 'supaya Kitab Suci digenapi' paling alami dipahami sebagai tujuan perkataan Yesus, sambil tetap mempertahankan ambiguitas tujuan/hasil yang ada dalam ἵνα.
