id: JHN.19.12
reference: John 19:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: id
  text: Sejak saat itu Pilatus terus berusaha membebaskan Dia.[a] Namun, orang-orang Yahudi[b] berteriak, “Jika engkau membebaskan orang ini, engkau bukan sahabat Kaisar. Setiap orang yang menjadikan dirinya raja menentang Kaisar.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena hal itu Pilatus terus berusaha membebaskan Dia.” Ungkapan Yunani ἐκ τούτου dapat dipahami sebagai penanda waktu (“sejak saat itu”) atau sebab (“karena hal itu”).
    reason: lexical_alternative
  - marker: b
    text: Dalam Injil Yohanes, ungkapan “orang-orang Yahudi” sering merujuk secara lebih khusus kepada para penguasa di Yudea atau lawan-lawan Yahudi tertentu dalam konteks cerita, bukan kepada seluruh bangsa Yahudi.
    reason: cultural_note
  - marker: c
    text: Atau, “berbicara melawan Kaisar” atau “melawan Kaisar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Sejak saat itu
  rationale: Ungkapan ini secara wajar menandai kelanjutan waktu dalam alur narasi, sambil tetap mengakui kemungkinan makna kausal dalam catatan kaki.
- source_word: ἐζήτει
  choice: terus berusaha
  rationale: Bentuk imperfek menunjukkan upaya yang berlangsung atau berulang; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan aspek tersebut.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: membebaskan
  rationale: Dalam konteks pengadilan, kata ini menunjuk pada pembebasan resmi dari tahanan.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Namun, orang-orang Yahudi
  rationale: Terjemahan mempertahankan cakupan leksikal teks Yunani tanpa mempersempitnya menjadi para pemimpin Yahudi; konteks rujukannya dijelaskan dalam catatan kaki.
- source_word: ἐκραύγασαν λέγοντες
  choice: berteriak
  rationale: Kata kerja ini menyatakan seruan keras. Dalam bahasa Indonesia, bentuk langsung tanpa menerjemahkan λέγοντες secara tersendiri lebih alami dan tetap mengantar ujaran langsung dengan jelas.
- source_word: τοῦτον
  choice: orang ini
  rationale: Pilihan ini mempertahankan daya tunjuk demonstratif dan nada merendahkan yang mungkin terdapat dalam ucapan tersebut.
- source_word: φίλος τοῦ Καίσαρος
  choice: sahabat Kaisar
  rationale: Ungkapan ini dekat dengan konstruksi Yunani dan mempertahankan nuansa kesetiaan politik tanpa menetapkannya secara pasti sebagai gelar resmi.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Setiap orang yang menjadikan dirinya raja
  rationale: Terjemahan ini mempertahankan struktur dan kekuatan ungkapan Yunani, tanpa melemahkannya menjadi sekadar mengaku sebagai raja.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: menentang Kaisar
  rationale: Dalam tuduhan politik ini, ἀντιλέγω menyatakan sikap melawan atau menentang; pilihan ini lebih alami dan tepat secara kontekstual daripada terjemahan harfiah 'berkata melawan'.
theological_decisions:
- issue: Rujukan ungkapan 'orang-orang Yahudi' dalam Injil Yohanes
  choice: Mempertahankan 'orang-orang Yahudi' dalam teks utama
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani memakai οἱ Ἰουδαῖοι. Mempersempit rujukannya dalam teks utama akan menyelesaikan sesuatu yang dibiarkan pada tingkat konteks; catatan kaki mencegah generalisasi terhadap seluruh bangsa Yahudi.
- issue: Makna ἀντιλέγει dalam tuduhan terhadap Yesus
  choice: menentang Kaisar
  alternative: berbicara melawan Kaisar; melawan Kaisar
  rationale: Konteksnya adalah ancaman politik mengenai kesetiaan kepada Kaisar. 'Menentang' mempertahankan cakupan makna tindakan atau sikap melawan tanpa membatasi tuduhan pada ucapan verbal saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Kapitalisasi pronomina 'Dia' mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Istilah 'Kaisar' mempertahankan gelar politik yang lazim dikenal.
