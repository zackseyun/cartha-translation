base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: id
  text: 'Sebab semua itu terjadi supaya Kitab Suci digenapi: “Tidak satu pun dari tulang-Nya akan dipatahkan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Tulang dari-Nya tidak akan dipatahkan.”'
    reason: Teks Yunani memakai “tulang” dalam bentuk tunggal dan konstruksi genetif, yang diterjemahkan secara idiomatis dalam teks utama.
lexical_decisions:
- source_word: ἐγένετο
  choice: terjadi
  rationale: Bentuk aoris dari γίνομαι menunjuk pada peristiwa-peristiwa yang baru saja diceritakan; “terjadi” alami dan tepat dalam bahasa Indonesia modern.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan penjelasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan penjelas itu dalam ragam sastra yang wajar.
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Demonstrativa netral jamak ini merujuk pada beberapa peristiwa sebelumnya. “Hal-hal itu” mempertahankan bentuk jamak tanpa menafsirkan rujukannya secara terlalu sempit.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil yang terkait dengan penggenapan ilahi; “supaya” mempertahankan nuansa tersebut secara alami.
- source_word: ἡ γραφή
  choice: Kitab Suci
  rationale: Dalam konteks Yohanes, γραφή menunjuk pada tulisan suci yang berwibawa. “Kitab Suci” adalah padanan Indonesia yang lazim dan jelas.
- source_word: πληρωθῇ
  choice: digenapi
  rationale: Bentuk pasif aoris subjungtif sesudah ἵνα dipertahankan dengan bentuk pasif “digenapi”, yang lazim bagi penggenapan nas Kitab Suci.
- source_word: Ὀστοῦν
  choice: satu pun tulang
  rationale: Nomina tunggal dalam kutipan ini bermakna distributif/kolektif. Ungkapan “tidak satu pun tulang-Nya” alami dalam bahasa Indonesia dan tetap mencerminkan bentuk tunggal Yunani.
- source_word: οὐ συντριβήσεται
  choice: tidak ... akan dipatahkan
  rationale: Bentuk pasif futur συντρίβω dalam konteks tulang paling tepat diterjemahkan “akan dipatahkan”; negasinya dipertahankan dengan “tidak”.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina genetif diungkapkan secara alami sebagai akhiran posesif Indonesia. Huruf kapital mengikuti konvensi penghormatan kepada Yesus tanpa menambahkan identitas yang tidak ada dalam klausa.
theological_decisions:
- issue: Menerjemahkan kutipan Kitab Suci sambil mempertahankan kaitannya dengan Keluaran 12:46, Bilangan 9:12, dan Mazmur 34:21 (penomoran Indonesia)
  choice: Tidak satu pun tulang-Nya akan dipatahkan
  alternative: Sebuah tulang dari-Nya tidak akan diremukkan
  rationale: Terjemahan utama menyampaikan bentuk tunggal Yunani secara idiomatis melalui “satu pun tulang-Nya” dan mempertahankan motif penggenapan serta gema teks Perjanjian Lama. Kata “dipatahkan” paling sesuai dengan konteks tindakan terhadap tulang, tanpa menentukan secara eksplisit teks Perjanjian Lama mana yang menjadi sumber tunggal kutipan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab–tujuan serta bentuk pasif penggenapan dipertahankan. Kutipan dibuat idiomatis tanpa menghilangkan bentuk distributif dari kata benda tunggal Yunani.
