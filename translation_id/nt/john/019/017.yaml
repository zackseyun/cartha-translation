source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: id
  text: Sambil memikul sendiri salib itu, Yesus keluar menuju tempat yang disebut Tempat Tengkorak, yang dalam bahasa Ibrani[a] disebut Golgota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dalam bahasa Aram.” Istilah yang dipakai Yohanes untuk “dalam bahasa Ibrani” dapat merujuk pada bahasa Semitik setempat di Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: sambil memikul
  rationale: Partisipel ini menyatakan tindakan membawa beban secara fisik yang berlangsung bersamaan dengan tindakan keluar; “memikul” alami untuk salib sebagai beban.
- source_word: αὑτῷ τὸν σταυρόν
  choice: memikul sendiri salib itu
  rationale: Dativus refleksif memberi penekanan bahwa Yesus sendiri yang memikulnya. Bentuk ini mempertahankan artikel pada “salib itu” dan tidak mengubahnya menjadi konstruksi posesif yang tidak dinyatakan secara langsung.
- source_word: σταυρός
  choice: salib
  rationale: “Salib” adalah padanan baku dan jelas dalam konteks penderitaan Yesus; teks Yunani tidak mengharuskan arti yang lebih sempit seperti “kayu palang”.
- source_word: ἐξῆλθεν εἰς
  choice: keluar menuju
  rationale: Gabungan ini menyampaikan gerak keluar dengan tujuan tertentu secara alami dalam bahasa Indonesia.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: tempat yang disebut Tempat Tengkorak
  rationale: Terjemahan ini mempertahankan rumusan penamaan dan makna unsur κρανίον serta τόπος tanpa memasukkan bentuk tradisional yang tidak tersurat.
- source_word: Ἑβραϊστί
  choice: dalam bahasa Ibrani
  rationale: Ini adalah padanan langsung istilah Yunani; kemungkinan bahwa istilah tersebut merujuk pada bahasa Aram setempat dicatat dalam catatan kaki.
- source_word: Γολγοθα
  choice: Golgota
  rationale: Nama tempat Semitik ini ditransliterasikan dalam bentuk Indonesia yang sudah dikenal.
theological_decisions:
- issue: Rujukan bahasa pada Ἑβραϊστί
  choice: dalam bahasa Ibrani
  alternative: dalam bahasa Aram
  rationale: Teks Yunani secara eksplisit memakai istilah yang lazim diterjemahkan “dalam bahasa Ibrani”. Namun, dalam pemakaian Yohanes istilah itu mungkin menunjuk lebih luas pada bahasa Semitik setempat, sehingga kemungkinan bahasa Aram dipertahankan dalam catatan kaki dan tidak menggantikan bentuk utama.
- issue: Daya refleksif αὑτῷ
  choice: memikul sendiri salib itu
  alternative: memikul salib-Nya sendiri
  rationale: Pilihan utama menonjolkan bahwa Yesus sendiri yang memikul salib itu sekaligus mempertahankan artikel tertentu Yunani, tanpa mengubah tekanan refleksif menjadi kepemilikan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Yesus” dinyatakan untuk menghindari ketidakjelasan pronomina ketika ayat dibaca tersendiri. Penanda catatan kaki ditempatkan sesudah “Ibrani”, yaitu pada unsur yang dijelaskan oleh catatan.
