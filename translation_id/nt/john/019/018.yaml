    text: Atau, lebih ringkas, “seorang di setiap sisi, dengan Yesus di antara mereka.”
    reason: lexical_alternative
  revision_rationale: “Di tempat itu” merupakan padanan locatif yang alami bagi ὅπου dalam konteks naratif. Susunan “mereka menyalibkan Dia bersama dua orang lainnya” menyatakan secara idiomatis bahwa kedua orang lain itu turut disalibkan bersama Yesus. Frasa distributif “seorang di satu sisi dan seorang di sisi yang lain” mempertahankan ἐντεῦθεν καὶ ἐντεῦθεν, sedangkan “Yesus di tengah-tengah” tetap mencerminkan μέσον tanpa menjadikan “di antara mereka” sebagai teks utama.
