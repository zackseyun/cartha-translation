  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: id
  text: Di tempat itu mereka menyalibkan Dia bersama dua orang lainnya, seorang di satu sisi dan seorang di sisi yang lain, sedangkan Yesus di tengah-tengah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih ringkas, “seorang di setiap sisi, dengan Yesus di antara mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Di situlah
  rationale: Adverbia relatif lokatif ini menunjuk kembali kepada tempat yang disebut dalam konteks; “Di situlah” alami dalam bahasa Indonesia dan mempertahankan penekanan tempat.
- source_word: ἐσταύρωσαν
  choice: mereka menyalibkan
  rationale: Dalam kisah sengsara Yohanes, verba ini secara tepat berarti menghukum mati dengan penyaliban tanpa merinci mekanismenya.
- source_word: μετ’ αὐτοῦ
  choice: bersama Dia
  rationale: μετά dengan genetif menyatakan penyertaan; “bersama Dia” ringkas dan wajar.
- source_word: ἄλλους δύο
  choice: dua orang lainnya
  rationale: Ungkapan Yunani berarti “dua lainnya.” Kata “orang” diperlukan agar ungkapan Indonesia alami dan tidak menambahkan identitas khusus yang tidak dinyatakan.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: seorang di sebelah sini dan seorang di sebelah sana
  rationale: Pasangan adverbia ini menggambarkan penempatan pada dua sisi yang berlawanan dan mempertahankan bentuk distributif serta gambaran spasial teks.
- source_word: μέσον
  choice: di tengah-tengah
  rationale: Bentuk ini berfungsi secara adverbial untuk menunjukkan posisi sentral; “di tengah-tengah” mempertahankan gambaran ruang tanpa secara eksplisit menggantinya dengan “di antara mereka.”
- source_word: δὲ
  choice: sedangkan
  rationale: δέ mengalihkan perhatian kepada posisi Yesus dengan kontras ringan; “sedangkan” menyampaikan hubungan itu secara alami, bukan pertentangan keras.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Akusatif ini menempatkan Yesus sebagai sosok yang berada di posisi tengah; susunan Indonesia menyampaikan fungsi tersebut secara jelas.
theological_decisions:
- issue: Apakah posisi Yesus perlu dinyatakan secara eksplisit sebagai berada di antara kedua orang lainnya
  choice: seorang di sebelah sini dan seorang di sebelah sana, sedangkan Yesus di tengah-tengah
  alternative: masing-masing di sebelah-Nya, dengan Yesus di antara mereka
  rationale: Teks Yunani menyatakan kedua sisi lalu posisi tengah Yesus. Terjemahan utama mempertahankan urutan dan citra spasial itu tanpa mereduksinya menjadi penafsiran “di antara mereka,” walaupun makna tersebut tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina “Dia” mengikuti register penghormatan yang lazim untuk Yesus. Struktur spasial Yunani dipertahankan dengan ungkapan yang dapat dipahami pembaca umum.
