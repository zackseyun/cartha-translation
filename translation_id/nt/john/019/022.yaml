lexical_decisions:
- source_word: ἀπεκρίθη
  choice: menjawab
  rationale: Bentuk aoris dari ἀποκρίνομαι secara wajar berarti ‘menjawab’ dalam dialog naratif.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Nama diri dengan artikel dalam gaya naratif Yunani; artikel tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: Ὃ
  choice: Apa yang
  rationale: Pronomina relatif netral substantival ini secara alami diterjemahkan ‘apa yang’ dalam bahasa Indonesia.
- source_word: γέγραφα γέγραφα
  choice: sudah kutulis, tetap tertulis
  rationale: 'Ungkapan ini mempertahankan pengulangan gagasan sekaligus menyampaikan aspek perfektif Yunani: tindakan menulis telah selesai dan hasilnya tetap berlaku. Bentuk ini lebih alami daripada mengulang ‘sudah kutulis’ dua kali dalam bahasa Indonesia.'
theological_decisions:
- issue: Daya ungkap pengulangan bentuk perfektif γέγραφα γέγραφα
  choice: Apa yang sudah kutulis, tetap tertulis.
  alternative: Apa yang telah kutulis, telah kutulis.
  rationale: Terjemahan utama menyampaikan ketetapan keputusan Pilatus dan keadaan tulisan yang terus berlaku, tanpa menambahkan alasan atau muatan teologis yang tidak dinyatakan teks. Alternatif lebih formal mempertahankan pengulangan verbal secara lebih harfiah, tetapi kurang alami dan kurang jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina terikat ‘ku-’ sesuai untuk ujaran langsung dan menghindari pengulangan ‘aku’ yang tidak diperlukan. Tidak ada catatan kaki karena nuansa perfektif dapat disampaikan secara alami dalam teks utama.
