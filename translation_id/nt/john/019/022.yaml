  footnotes:
  - marker: a
    text: Atau, “Apa yang kutulis, kutulis.” Teks Yunani mengulang bentuk perfektum “telah kutulis,” yang dapat menekankan tindakan yang sudah selesai dengan hasil yang tetap berlaku.
