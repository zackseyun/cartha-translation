  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: id
  text: Yesus menjawabnya, “Engkau sama sekali tidak akan mempunyai wewenang atas Aku jika wewenang itu tidak diberikan kepadamu dari atas.[a] Karena itu, orang yang menyerahkan Aku kepadamu[b] mempunyai dosa yang lebih besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari surga.” Bahasa Yunani berbunyi “dari atas,” ungkapan yang dalam Injil Yohanes sering menunjuk kepada sumber ilahi.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini tidak secara eksplisit menyebut siapa yang menyerahkan Yesus kepada Pilatus. Ungkapan ini dapat dipahami sebagai merujuk kepada Yudas, Kayafas, atau para pemimpin Yahudi secara lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Dalam konteks pengadilan ini, “wewenang” dengan tepat menyatakan yurisdiksi pemerintahan yang didelegasikan kepada Pilatus; “kuasa” dapat terdengar sebagai kemampuan atau kekuatan semata.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: sama sekali tidak ... wewenang atas Aku
  rationale: “Atas Aku” alami dengan “wewenang” dalam bahasa Indonesia, sedangkan “sama sekali tidak” mempertahankan penegasan οὐδεμίαν.
- source_word: εἰ μὴ ἦν δεδομένον σοι
  choice: jika wewenang itu tidak diberikan kepadamu
  rationale: Bentuk pasif mempertahankan pemberi yang tidak disebutkan secara eksplisit, sementara pengulangan “wewenang” memperjelas rujukan kata ganti dalam bahasa Indonesia.
- source_word: ἄνωθεν
  choice: dari atas
  rationale: Terjemahan ini mempertahankan ungkapan khas Yohanes dan implikasi sumber ilahi tanpa mempersempitnya secara eksplisit menjadi “dari surga” dalam teks utama.
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini menyampaikan hubungan sebab-akibat atau kesimpulan secara alami tanpa menentukan lebih jauh tepatnya dasar perbandingan kesalahan.
- source_word: ὁ παραδούς μέ σοι
  choice: orang yang menyerahkan Aku kepadamu
  rationale: Terjemahan ini mempertahankan bentuk umum partisipel Yunani dan tidak secara dini mengidentifikasinya sebagai Yudas, Kayafas, atau kelompok tertentu.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: mempunyai dosa yang lebih besar
  rationale: Pilihan ini dekat dengan konstruksi Yunani dan mempertahankan perbandingan tingkat kesalahan antara pihak yang menyerahkan Yesus dan Pilatus.
theological_decisions:
- issue: Sumber wewenang Pilatus yang tersirat dalam ἄνωθεν
  choice: “Dari atas” menyiratkan sumber ilahi tetapi tidak mengembangkan pernyataan ini menjadi doktrin umum mengenai legitimasi politik.
  alternative: “Dari surga” menyatakan sumber ilahi dengan lebih eksplisit.
  rationale: Bahasa Yohanes menunjuk kepada sumber yang lebih tinggi atau ilahi, tetapi teks tidak menguraikan lebih jauh cakupan teologisnya.
- issue: Identitas ὁ παραδούς μέ σοι
  choice: Dibiarkan sebagai “orang yang menyerahkan Aku kepadamu.”
  alternative: Yudas, Kayafas, atau para pemimpin Yahudi secara kolektif.
  rationale: Ayat ini tidak menyebut nama atau kelompok tertentu, sehingga ambiguitas aslinya perlu dipertahankan.
- issue: Perbandingan dosa
  choice: “Dosa yang lebih besar” mempertahankan gagasan perbedaan tingkat kesalahan tanpa membebaskan Pilatus dari kesalahan.
  alternative: Mengartikan perkataan ini sebagai penghapusan kesalahan Pilatus.
  rationale: Bentuk komparatif menyatakan bahwa pihak lain menanggung kesalahan lebih besar, yang dengan sendirinya tetap mengandaikan kesalahan Pilatus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” serta kapitalisasi kata ganti bagi Yesus mengikuti register Alkitab Indonesia yang umum. Susunan kalimat dibuat alami tanpa menghilangkan penegasan, bentuk pasif, atau ambiguitas rujukan dalam teks Yunani.
