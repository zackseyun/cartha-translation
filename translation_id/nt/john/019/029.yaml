  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: id
  text: Di situ terletak sebuah wadah yang penuh dengan anggur asam[a]. Karena itu, mereka memasang spons yang penuh dengan anggur asam itu pada hisop[b], lalu membawanya ke mulut Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cuka”. Kata Yunani ini dapat berarti anggur asam atau cuka; di sini kemungkinan besar yang dimaksud ialah minuman anggur asam yang biasa tersedia bagi para prajurit.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada ranting hisop” atau “dengan hisop”. Teks Yunani hanya menyatakan “pada/dengan hisop”; gambaran tepatnya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: wadah
  rationale: Istilah umum untuk suatu benda atau tempat penampung; “wadah” alami dalam bahasa Indonesia modern dan tidak menentukan jenisnya secara berlebihan.
- source_word: ἔκειτο
  choice: ada ... di situ
  rationale: Menyampaikan keadaan suatu benda yang berada di tempat itu secara alami, tanpa menyiratkan tindakan menaruh yang tidak dinyatakan.
- source_word: ὄξους
  choice: anggur asam
  rationale: Dalam konteks ini menunjuk pada minuman anggur murah yang telah menjadi asam; pilihan ini lebih jelas sebagai minuman daripada sekadar “cuka”, sambil mencatat alternatif leksikal.
- source_word: μεστόν
  choice: penuh
  rationale: Padanan langsung dan alami yang dipertahankan pada wadah maupun spons.
- source_word: σπόγγον
  choice: spons
  rationale: Padanan langsung yang lazim dalam bahasa Indonesia modern.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kelanjutan sebagai akibat atau tanggapan dalam narasi.
- source_word: ὑσσώπῳ
  choice: pada hisop
  rationale: Mempertahankan istilah tumbuhan dan keluwesan datif Yunani tanpa menambahkan “ranting” ke dalam teks utama.
- source_word: περιθέντες
  choice: memasang
  rationale: Menggambarkan tindakan menempatkan atau melekatkan spons pada hisop sebelum membawanya ke mulut Yesus.
- source_word: προσήνεγκαν
  choice: membawanya
  rationale: Menyampaikan gerakan membawa atau mendekatkan benda kepada sasaran tanpa menambahkan gagasan penawaran.
- source_word: αὐτοῦ τῷ στόματι
  choice: ke mulut Yesus
  rationale: Rujukan nama dibuat eksplisit agar alami dan jelas dalam bahasa Indonesia, tanpa mengubah acuannya.
theological_decisions:
- issue: Gema historis dan kultis dari ὑσσώπῳ
  choice: Mempertahankan “hisop” dalam teks utama tanpa menjelaskan simbolismenya.
  alternative: Menerjemahkan secara lebih interpretatif sebagai “ranting hisop” atau mengaburkannya sebagai “batang”.
  rationale: Kata-kata Yohanes mungkin membangkitkan kaitan dengan Paskah atau pentahiran, tetapi ayat ini tidak menyatakan simbolisme tersebut. “Hisop” mempertahankan kemungkinan gema teologis tanpa memasukkan tafsiran ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami, sementara ambiguitas mengenai ὄξος dan fungsi ὑσσώπῳ dipertahankan melalui catatan kaki.
