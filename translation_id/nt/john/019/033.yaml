  naturalness: Kalimat utama jelas dan baku. “Datang kepada Yesus” sedikit lebih langsung dan dekat dengan gerak dalam ἐλθόντες daripada “sampai kepada Yesus,” tanpa mengurangi kelancaran bahasa Indonesia.
  terminology: Penggunaan “Yesus,” kata ganti hormat “Ia/-Nya,” “Kitab Suci,” serta singkatan rujukan adalah sesuai register Alkitab Indonesia modern. Catatan b perlu diperbaiki karena alternatifnya harus menerjemahkan ὡς εἶδον sebagai penanda waktu/keadaan, bukan sekadar mengulang “dan melihat.”
