  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: id
  text: Namun, ketika mereka datang kepada Yesus[a] dan melihat bahwa Ia sudah mati[b], mereka tidak mematahkan kaki-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yohanes kemudian menghubungkan tindakan ini dengan Kitab Suci: “Tidak satu pun tulang-Nya akan dipatahkan” (Yoh. 19:36; bdk. Kel. 12:46; Bil. 9:12; Mzm. 34:21).'
    reason: cross_reference
  - marker: b
    text: Atau “ketika mereka melihat bahwa Ia sudah mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Namun, ketika mereka sampai kepada Yesus
  rationale: Partisip aoristis ini secara alami diungkapkan sebagai anak kalimat waktu. δέ menandai peralihan yang agak kontras dari tindakan terhadap orang-orang yang disalibkan bersama Yesus.
- source_word: ὡς εἶδον
  choice: dan melihat bahwa
  rationale: Ungkapan ini memperkenalkan keadaan yang mereka amati dan yang menjadi dasar tindakan berikutnya; susunan ini alami dalam bahasa Indonesia tanpa mempertegas hubungan sebab secara berlebihan.
- source_word: ἤδη
  choice: sudah
  rationale: Menunjukkan bahwa kematian Yesus telah terjadi sebelum para prajurit tiba kepada-Nya.
- source_word: τεθνηκότα
  choice: Ia sudah mati
  rationale: Partisip perfek menekankan keadaan sebagai hasil dari kematian; 'sudah mati' menyampaikan keadaan tersebut secara jelas dan wajar.
- source_word: οὐ κατέαξαν
  choice: mereka tidak mematahkan
  rationale: Dalam konteks ini κατάγνυμι berarti mematahkan anggota tubuh atau tulangnya.
- source_word: τὰ σκέλη
  choice: kaki-Nya
  rationale: σκέλη menunjuk pada kedua kaki. Ungkapan 'mematahkan kaki' merupakan bentuk Indonesia yang alami dan tidak mendahului penyebutan 'tulang' dalam ayat 36.
theological_decisions:
- issue: Kaitan tindakan ini dengan penggenapan Kitab Suci mengenai tulang Yesus yang tidak dipatahkan
  choice: Teks utama tetap berupa pernyataan naratif langsung tentang kaki Yesus yang tidak dipatahkan.
  alternative: Menggunakan kata 'tulang kaki' untuk menonjolkan kaitannya dengan Yohanes 19:36.
  rationale: Yohanes 19:36 sendiri menjelaskan kaitan penggenapan itu. Ayat ini tidak perlu diperluas sehingga penafsiran teologis muncul lebih awal daripada dalam alur teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti hormat untuk Yesus digunakan sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur kalimat mempertahankan urutan narasi Yunani sambil tetap alami bagi pembaca umum.
