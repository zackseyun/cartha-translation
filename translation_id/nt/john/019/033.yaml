- from: Namun, ketika mereka sampai kepada Yesus[a] dan melihat bahwa Ia sudah mati[b], mereka tidak mematahkan kaki-Nya.
  to: Namun, ketika mereka datang kepada Yesus[a] dan melihat bahwa Ia sudah mati[b], mereka tidak mematahkan kaki-Nya.
  rationale: Revisi kecil ini mempertahankan seluruh makna naratif dan ambiguitas hubungan temporal-keadaan dalam Yunani. Teks utama hanya diperhalus pada verba kedatangan, sedangkan catatan b dikoreksi agar benar-benar memberi alternatif yang sesuai dengan ὡς εἶδον dan tidak mengubah aspek keadaan yang dinyatakan oleh τεθνηκότα.
