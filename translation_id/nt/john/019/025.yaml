  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: id
  text: Di dekat salib Yesus berdiri ibu-Nya, saudara perempuan ibu-Nya, Maria istri Klopas[a][b], dan Maria Magdalena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Maria dari Klopas.” Teks Yunani tidak menyatakan secara eksplisit hubungan Maria dengan Klopas, meskipun “istri Klopas” merupakan pemahaman yang umum.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini juga mungkin dipahami sebagai menyebut tiga perempuan, bukan empat, jika “saudara perempuan ibu-Nya” adalah orang yang sama dengan “Maria dari Klopas.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: berdiri
  rationale: Bentuk ini menggambarkan keadaan atau sikap tubuh yang sedang berlangsung; dalam susunan kalimat Indonesia, "berdiri" menyampaikan keadaan tersebut secara alami.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan naratif yang ringan. Dalam bahasa Indonesia, peralihan itu cukup tersirat dari konteks tanpa perlu menambahkan "sekarang" atau konjungsi yang dapat memberi kesan temporal maupun pertentangan yang lebih kuat.
- source_word: παρὰ τῷ σταυρῷ
  choice: di dekat salib
  rationale: παρά dengan datif menyatakan kedekatan tempat; "di dekat" jelas dan alami tanpa menyiratkan kontak langsung.
- source_word: τοῦ Ἰησοῦ
  choice: Yesus
  rationale: Genitif ini menghubungkan salib dengan Yesus; frasa "salib Yesus" mempertahankan hubungan yang ringkas dalam teks Yunani.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ibu-Nya
  rationale: Padanan langsung dan wajar bagi frasa yang merujuk kepada ibu Yesus.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: saudara perempuan ibu-Nya
  rationale: Menerjemahkan konstruksi genitif secara jelas tanpa menentukan apakah ia kakak atau adik.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Maria istri Klopas
  rationale: Konstruksi artikel dan genitif mengidentifikasi Maria melalui hubungannya dengan Klopas. Hubungan sebagai istri merupakan pemahaman yang umum, tetapi kata "istri" tidak dinyatakan secara eksplisit dalam bahasa Yunani; ambiguitas itu dicatat dalam catatan kaki.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalena
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia untuk Maria yang berasal dari Magdala.
theological_decisions:
- issue: Identitas dan jumlah perempuan di dekat salib
  choice: 'Teks utama dibaca sebagai daftar empat perempuan: ibu Yesus, saudara perempuan ibu-Nya, Maria istri Klopas, dan Maria Magdalena.'
  alternative: Ayat ini dapat dibaca sebagai daftar tiga perempuan jika "saudara perempuan ibu-Nya" dianggap sebagai keterangan bagi Maria dari Klopas.
  rationale: Rangkaian unsur nominatif paling langsung dibaca sebagai empat orang, tetapi sintaksis Yunani cukup padat sehingga pembacaan tiga orang tetap mungkin. Teks utama mengikuti pembacaan empat orang dan catatan kaki mempertahankan alternatifnya.
- issue: Hubungan Maria dengan Klopas
  choice: istri Klopas
  alternative: Maria dari Klopas
  rationale: Hubungan perkawinan merupakan penafsiran kontekstual yang umum, tetapi genitif Yunani tidak menyebut jenis hubungan itu secara eksplisit. Karena itu, alternatif yang lebih harfiah dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Kapital pada pronomina "-Nya" mengikuti kebiasaan penulisan religius Indonesia untuk rujukan kepada Yesus. Semua ambiguitas penting mengenai hubungan Maria dengan Klopas dan jumlah perempuan dipertahankan melalui catatan kaki.
