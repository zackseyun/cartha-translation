base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: id
  text: Lalu Pilatus keluar lagi dan berkata kepada mereka, “Lihat, aku membawa Dia keluar kepada kalian supaya kalian tahu bahwa aku tidak menemukan dasar tuduhan apa pun terhadap-Nya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “aku tidak menemukan kesalahan apa pun pada-Nya.” Ungkapan Yunani ini dapat diterjemahkan secara lebih tradisional demikian, tetapi dalam konteks ini kemungkinan besar bermakna yuridis: Pilatus tidak menemukan dakwaan atau dasar perkara yang sah terhadap Yesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: keluar
  rationale: Gabungan verba dan adverbia ini menyatakan gerakan ke luar. Dalam bahasa Indonesia, ‘keluar’ sudah alami dan cukup untuk memuat makna spasialnya tanpa pengulangan yang janggal.
- source_word: πάλιν
  choice: lagi
  rationale: Kata ini menandai pengulangan tindakan Pilatus dan secara alami diterjemahkan ‘lagi’.
- source_word: λέγει
  choice: berkata
  rationale: Walaupun bahasa Yunani memakai bentuk kini historis, bentuk lampau naratif tersirat secara alami melalui konteks bahasa Indonesia; ‘berkata’ menjaga alur narasi yang lancar.
- source_word: Ἴδε
  choice: Lihat
  rationale: Kata seru ini menarik perhatian para pendengar. ‘Lihat’ jelas, langsung, dan modern.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: aku membawa Dia keluar
  rationale: ἄγω dapat berarti memimpin atau membawa. Dalam adegan ini Pilatus menghadirkan Yesus kepada orang banyak, sehingga ‘membawa ... keluar’ paling alami.
- source_word: ἵνα γνῶτε
  choice: supaya kalian tahu
  rationale: Terjemahan ini mempertahankan fungsi tujuan dari ἵνα dan menyampaikan maksud Pilatus secara wajar dalam bahasa Indonesia modern.
- source_word: οὐδεμίαν αἰτίαν
  choice: tidak menemukan dasar tuduhan apa pun
  rationale: Dalam konteks pengadilan, αἰτία menunjuk pada dakwaan atau dasar untuk menuduh. Ungkapan ini mempertahankan nuansa yuridis sekaligus terdengar jelas bagi pembaca Indonesia.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: aku tidak menemukan ... terhadap-Nya
  rationale: Susunan Yunani secara idiomatis menyatakan bahwa Pilatus tidak mendapati dasar perkara terhadap Yesus. ‘Terhadap-Nya’ lebih alami daripada meniru harfiah ‘di dalam Dia’.
theological_decisions:
- issue: Rumusan yuridis dalam pernyataan Pilatus tentang Yesus
  choice: aku tidak menemukan dasar tuduhan apa pun terhadap-Nya
  alternative: aku tidak menemukan kesalahan apa pun pada-Nya
  rationale: Konteksnya adalah penilaian hukum Pilatus, sehingga ‘dasar tuduhan’ menampilkan daya yuridis αἰτία tanpa memperluas ucapan itu menjadi pernyataan teologis yang lebih umum. Alternatif tradisional tetap dicatat karena ungkapan Yunani juga dapat diterjemahkan demikian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘aku’ dan ‘kalian’ dipakai dalam ujaran langsung untuk mencerminkan bentuk tunggal pembicara dan jamak pendengar secara jelas; huruf kapital pada rujukan kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah kalimat yang diterangkannya.
