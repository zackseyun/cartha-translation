source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: id
  text: Kemudian Yesus berkata kepada murid itu, “Lihat, ibumu.” Sejak saat itu, murid tersebut menerima dia di rumahnya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Lihat
  rationale: Mempertahankan bentuk perintah yang menarik perhatian, dengan ungkapan Indonesia yang alami dan langsung.
- source_word: εἰς τὰ ἴδια
  choice: di rumahnya sendiri
  rationale: Dalam konteks ini, ungkapan idiomatis tersebut menunjuk pada lingkungan atau kediaman milik sang murid; terjemahan ini menyampaikan maksudnya secara wajar tanpa menambahkan gagasan yang tidak tersurat.
- source_word: ἔλαβεν
  choice: menerima
  rationale: Kata ini dapat berarti mengambil atau menerima. “Menerima dia di rumahnya sendiri” secara alami menyatakan bahwa murid itu membawa Maria ke dalam pemeliharaan dan kediamannya.
theological_decisions:
- issue: Identitas subjek yang berkata
  choice: Yesus
  alternative: ia
  rationale: Konteks langsung mengidentifikasi Yesus sebagai pembicara. Penyebutan nama menghindari ambiguitas pronominal dalam bahasa Indonesia tanpa menambah penafsiran teologis.
- issue: Makna hubungan dalam ucapan “ibumu”
  choice: Diterjemahkan secara harfiah tanpa penjelasan tambahan
  alternative: ibumu mulai sekarang
  rationale: Teks menyatakan “ibumu” tetapi tidak menjabarkan di dalam ayat ini sifat atau cakupan hubungan tersebut; ketegangan dan implikasinya dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Murid itu” dan “murid tersebut” dipakai untuk rujukan yang alami; tanda kutip mengikuti kaidah Indonesia.
