  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: id
  text: Di tempat Yesus disalibkan ada sebuah taman, dan di dalam taman itu ada sebuah makam baru yang di dalamnya belum pernah dibaringkan siapa pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan narasi ringan. Dalam bahasa Indonesia, alur kalimat sudah cukup menyampaikan peralihan itu tanpa kata penghubung tambahan.
- source_word: ἐν τῷ τόπῳ ὅπου ἐσταυρώθη
  choice: Di tempat Yesus disalibkan
  rationale: Mempertahankan konstruksi pasif Yunani secara alami. Nama Yesus dipakai sebagai subjek tersirat agar rujukannya jelas dalam bahasa Indonesia.
- source_word: κῆπος
  choice: taman
  rationale: Padanan umum dan alami; 'kebun buah' terlalu khusus.
- source_word: μνημεῖον καινόν
  choice: makam baru
  rationale: '''Makam'' sesuai dengan tempat penguburan dalam konteks ini, sedangkan ''baru'' mempertahankan arti langsung καινόν tanpa meleburkannya dengan penjelasan pada klausa berikut.'
- source_word: ἐν ᾧ οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: yang belum pernah digunakan untuk membaringkan siapa pun
  rationale: Ungkapan ini secara alami menyatakan bahwa belum seorang pun pernah dibaringkan di makam itu, sambil mempertahankan konteks penguburan dan keadaan makam yang belum digunakan.
theological_decisions:
- issue: Istilah penguburan untuk μνημεῖον dan τεθειμένος
  choice: makam ... digunakan untuk membaringkan siapa pun
  alternative: kubur ... siapa pun belum pernah dibaringkan di dalamnya
  rationale: Pilihan ini menggambarkan tempat penguburan dan tindakan membaringkan jenazah secara konkret tanpa menambahkan tafsiran teologis.
- issue: Bentuk pasif ἐσταυρώθη
  choice: Yesus disalibkan
  alternative: mereka menyalibkan Yesus
  rationale: Bentuk pasif dipertahankan agar pelaku yang tidak disebutkan dalam klausa Yunani tidak ditambahkan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum; pengulangan 'taman' dipertahankan karena menjadi penghubung lokasi yang jelas dalam teks sumber.
