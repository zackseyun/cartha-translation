source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: id
  text: Maka, ketika imam-imam kepala dan para petugas melihat Dia, mereka berteriak, “Salibkan Dia! Salibkan Dia!” Pilatus berkata kepada mereka, “Kalian sendiri, ambillah Dia dan salibkanlah Dia[a], sebab aku tidak menemukan dasar tuduhan terhadap-Nya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ambillah Dia sendiri dan salibkanlah Dia.” Kata ganti “kalian” dinyatakan secara tegas dalam bahasa Yunani, untuk menekankan bahwa merekalah yang harus mengambil Dia dan menyalibkan Dia.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku tidak menemukan kesalahan pada-Nya.” Kata Yunani yang digunakan dapat berarti tuduhan, dasar untuk menuduh, atau kesalahan; dalam konteks ini nuansa hukumnya paling menonjol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ketika
  rationale: Dalam alur narasi ini, οὖν meneruskan akibat dari peristiwa sebelumnya, tetapi tidak perlu diterjemahkan dengan kata tersendiri karena hubungan itu sudah jelas dalam bahasa Indonesia. “Ketika” secara alami menyampaikan unsur waktu dari ὅτε.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Bentuk jamak ini menunjuk pada kalangan pemimpin keimaman di Yerusalem, bukan hanya seorang imam besar. “Imam-imam kepala” merupakan padanan yang tepat dan dikenal luas.
- source_word: ὑπηρέται
  choice: para petugas
  rationale: Istilah ini menunjuk pada bawahan resmi yang bertugas bagi para pemimpin Yahudi. “Para petugas” mempertahankan nuansa kelembagaan tanpa mempersempitnya secara tidak pasti menjadi penjaga Bait Allah.
- source_word: ἐκραύγασαν λέγοντες
  choice: mereka berteriak
  rationale: Gabungan verba dan partisip ini menyatakan seruan keras beserta isinya. Dalam bahasa Indonesia, “mereka berteriak” menyampaikan tindakan tersebut secara alami tanpa perlu menambahkan “dengan berkata”.
- source_word: Σταύρωσον σταύρωσον
  choice: Salibkan Dia! Salibkan Dia!
  rationale: Pengulangan dipertahankan untuk menyampaikan desakan keras. Objek “Dia” tersirat jelas dalam bahasa Yunani dan dinyatakan dalam bahasa Indonesia agar seruannya lengkap dan alami.
- source_word: Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε
  choice: Ambillah Dia dan salibkanlah sendiri
  rationale: Kata “sendiri” menyampaikan penekanan pada kata ganti ὑμεῖς, yaitu bahwa pihak merekalah—bukan Pilatus—yang diminta mengambil dan menyalibkan Yesus.
- source_word: αἰτίαν
  choice: dasar tuduhan
  rationale: Dalam konteks pengadilan, αἰτία terutama berarti tuduhan atau dasar untuk mengajukan tuduhan. “Dasar tuduhan” mempertahankan nuansa hukum dengan bahasa Indonesia yang jelas.
theological_decisions:
- issue: Pernyataan Pilatus mengenai tidak adanya kesalahan hukum pada Yesus
  choice: aku tidak menemukan dasar tuduhan terhadap-Nya
  alternative: aku tidak menemukan kesalahan pada-Nya
  rationale: Pilatus sedang memberikan penilaian yudisial. Terjemahan “dasar tuduhan” mempertahankan nuansa forensik αἰτία dan tidak mengubah pernyataan hukum dalam konteks ini menjadi rumusan teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “-lah” mempertahankan daya imperatif tanpa terdengar kasar, sedangkan “sendiri” menyampaikan kontras yang ditekankan oleh kata ganti Yunani. Huruf kapital pada “Dia” dan “-Nya” mengikuti kebiasaan penulisan rujukan kepada Yesus dalam terjemahan Alkitab Indonesia.
