  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: id
  text: Maka ketika Yesus melihat ibu-Nya dan murid yang dikasihi-Nya berdiri di situ, Ia berkata kepada ibu-Nya, “Ibu,[a] lihatlah, anakmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Perempuan.” Dalam bahasa Yunani, sapaan ini hormat, bukan kasar; dalam bahasa Indonesia modern dapat diungkapkan dengan sapaan hormat seperti “Ibu” atau “Nyonya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ketika
  rationale: Daya penghubung οὖν dipadukan secara alami dengan konstruksi temporal partisip ἰδών. Dalam konteks narasi Indonesia, 'Ketika' menjaga alur tanpa memerlukan 'maka' yang terasa lebih formal.
- source_word: ἰδὼν
  choice: melihat
  rationale: 'Partisip aoris dipahami secara temporal: ''ketika Yesus melihat'', yang menyampaikan urutan adegan dengan wajar.'
- source_word: τὴν μητέρα
  choice: ibu-Nya
  rationale: Walaupun bahasa Yunani memakai artikel tanpa kata milik eksplisit, konteks menunjuk kepada ibu Yesus dan bahasa Indonesia secara alami menyatakan kepemilikan tersebut.
- source_word: τὸν μαθητὴν
  choice: murid
  rationale: Konteks dan klausa pewatas membuat murid tertentu ini teridentifikasi; bentuk Indonesia tidak memerlukan artikel tersendiri.
- source_word: παρεστῶτα
  choice: berdiri di dekatnya
  rationale: Menyampaikan bahwa murid itu hadir sambil berdiri dekat dalam adegan tersebut. Akhiran '-nya' dibiarkan memiliki keluwesan rujukan yang wajar sesuai gambaran tempat.
- source_word: ὃν ἠγάπα
  choice: yang dikasihi-Nya
  rationale: Bentuk pasif idiomatis dan ringkas dalam bahasa Indonesia, dengan Yesus sebagai pelaku kasih yang jelas dari konteks.
- source_word: λέγει
  choice: Ia berkata
  rationale: Kala kini historis Yunani dialihkan menjadi bentuk naratif Indonesia yang alami; bahasa Indonesia tidak menandai kala secara morfologis, dan 'berkata' mempertahankan kejelasan tindakan ujaran.
- source_word: Γύναι
  choice: Ibu
  rationale: Sapaan γύναι bersifat hormat dan tidak kasar. Dalam bahasa Indonesia modern, 'Ibu' merupakan sapaan langsung yang alami dan bermartabat kepada seorang perempuan serta menghindari kesan merendahkan dari 'Perempuan'.
- source_word: ἴδε
  choice: lihatlah
  rationale: Imperatif deiktis diterjemahkan langsung dan bermartabat. Partikel '-lah' memberi bobot pada perintah tanpa memakai bentuk arkais.
- source_word: ὁ υἱός σου
  choice: anakmu
  rationale: υἱός secara leksikal berarti anak laki-laki, tetapi dalam deklarasi hubungan ini 'anakmu' merupakan ungkapan Indonesia yang alami; jenis kelamin murid telah jelas dari konteks naratif.
theological_decisions:
- issue: Nada sapaan Yesus kepada Maria dalam Γύναι
  choice: Ibu
  alternative: Perempuan; Nyonya
  rationale: '''Ibu'' mempertahankan fungsi sapaan hormat dalam bahasa sasaran tanpa menyiratkan kekasaran. Catatan kaki menjelaskan bentuk harfiahnya agar bentuk sumber dan ketegangan leksikalnya tetap terlihat.'
- issue: Makna hubungan dalam ὁ υἱός σου
  choice: Pernyataan langsung 'anakmu' tanpa penjelasan doktrinal
  alternative: Menambahkan bahwa murid itu menjadi anak rohani atau anak angkat
  rationale: Teks menyatakan hubungan secara ringkas tetapi tidak menjelaskan sifat teologis atau hukumnya. Terjemahan tidak boleh memasukkan penafsiran denominatif yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan 'Ibu' dipilih untuk kesepadanan pragmatis, sedangkan bentuk harfiah dicatat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambahkan informasi pada teks.
