  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: id
  text: Nikodemus juga datang—orang yang sebelumnya datang kepada Yesus pada malam hari—sambil membawa campuran mur dan gaharu, kira-kira seratus litra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu litra adalah pon Romawi, kira-kira 327 gram. Jadi, seratus litra kurang lebih 32–33 kilogram.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: juga datang
  rationale: δέ menghubungkan secara ringan, sedangkan καί menambahkan Nikodemus kepada para pelaku pemakaman yang sudah disebut. Susunan ini alami dalam bahasa Indonesia.
- source_word: Νικόδημος
  choice: Nikodemus
  rationale: Mengikuti bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: dialah yang dahulu datang kepada Yesus pada malam hari
  rationale: Frasa partisipial ini mengidentifikasi Nikodemus dengan mengingatkan pembaca pada kunjungannya dalam Yohanes 3:1–2. 'Dahulu' mempertahankan rujukan temporal τὸ πρῶτον; nama 'Yesus' memperjelas referen pronomina secara alami dalam bahasa Indonesia.
- source_word: φέρων
  choice: sambil membawa
  rationale: Partisipel kini menyatakan keadaan yang menyertai kedatangannya; 'sambil membawa' alami dan mempertahankan hubungan tersebut.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: campuran mur dan gaharu
  rationale: μίγμα berarti campuran, σμύρνη adalah mur, dan ἀλόη di sini menunjuk bahan kayu aromatik untuk penguburan, yang dalam bahasa Indonesia lazim disebut gaharu, bukan tanaman lidah buaya modern.
- source_word: ὡς
  choice: kira-kira
  rationale: Di depan jumlah, ὡς menyatakan perkiraan.
- source_word: λίτρας ἑκατόν
  choice: seratus litra
  rationale: Mempertahankan satuan berat Romawi kuno agar tidak memberi kesan kesetaraan tepat dengan satuan modern; nilainya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Rujukan αὐτόν dalam klausa pengenal
  choice: '''Yesus'''
  alternative: '''Dia'' atau ''-Nya'''
  rationale: Konteks naratif Yohanes dengan jelas mengacu pada Yesus dan mengingatkan pembaca pada Yohanes 3:1–2. Menyebut nama Yesus mencegah ketidakjelasan pronomina dalam bahasa Indonesia tanpa menambahkan tafsiran teologis.
- issue: Makna τὸ πρῶτον
  choice: '''dahulu'''
  alternative: '''pertama kali'''
  rationale: Ungkapan itu dapat menandai waktu sebelumnya atau kunjungan pertama. 'Dahulu' secara alami mengacu kembali pada peristiwa Yohanes 3 tanpa secara tegas memutuskan bahwa itu adalah kunjungan pertama dari beberapa kunjungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan klausa pengenal yang bersifat selingan. Istilah kuno 'litra' dipertahankan dan diterangkan melalui catatan kaki.
