revisions:
- from: Dan ada lagi nas Kitab Suci yang berkata, “Mereka akan memandang Dia yang telah mereka tikam.”
  to: Dan sekali lagi, Kitab Suci yang lain berkata, “Mereka akan memandang kepada orang yang telah mereka tikam.”[a]
  rationale: The revision follows the Greek citation formula closely while using fluent modern Indonesian. It retains the Greek’s personal but non-name-specific expression (“orang yang”), represents the completed piercing with “telah mereka tikam,” and supplies an anchored note for the defensible alternative treatment of εἰς.
