  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: id
  text: Dan sekali lagi, Kitab Suci yang lain berkata, “Mereka akan memandang kepada orang yang telah mereka tikam.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka akan memandang orang yang telah mereka tikam.” Konstruksi Yunani dapat menyatakan pandangan yang diarahkan kepada seseorang; kutipan ini menggemakan Zakharia 12:10.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Menandai tambahan kutipan Kitab Suci dan terdengar alami dalam rumusan “ada lagi”.
- source_word: ἑτέρα γραφή
  choice: nas Kitab Suci
  rationale: γραφή merujuk pada Kitab Suci, sedangkan ἑτέρα menunjukkan kesaksian tertulis tambahan. Dalam bahasa Indonesia, “ada lagi nas Kitab Suci” secara alami menyampaikan keduanya tanpa ungkapan janggal “Kitab Suci lain”.
- source_word: λέγει
  choice: berkata
  rationale: Mempertahankan bentuk kini dalam formula pengutipan Kitab Suci dan personifikasi yang juga terdapat dalam bahasa sumber.
- source_word: Ὄψονται
  choice: mereka akan memandang
  rationale: Menyatakan tindakan melihat yang diarahkan kepada seseorang, bukan sekadar menangkap secara visual; “memandang” sesuai dengan konstruksi bersama εἰς.
- source_word: εἰς ὃν
  choice: Dia yang
  rationale: Sesudah verba melihat, εἰς menunjukkan arah pandangan kepada pribadi tersebut. Huruf kapital pada “Dia” mengikuti rujukan kontekstual kepada Yesus, sedangkan klausa relatif tetap ringkas dan alami.
- source_word: ἐξεκέντησαν
  choice: telah mereka tikam
  rationale: Menyampaikan tindakan menusuk yang sudah terjadi dalam konteks penyaliban. “Tikam” jelas dan idiomatis untuk penusukan dengan senjata.
theological_decisions:
- issue: Cara menerjemahkan kutipan Zakharia tanpa memasukkan rumusan tambahan dari teks Ibrani atau Septuaginta
  choice: Mereka akan memandang Dia yang telah mereka tikam
  alternative: Mereka akan memandang kepada Dia yang telah mereka tikam
  rationale: Terjemahan mengikuti rumusan Yunani Yohanes sendiri dan mempertahankan identitas pribadi yang ditikam, yang dalam konteks merujuk kepada Yesus. Terjemahan tidak menambahkan bentuk orang pertama ilahi dari Zakharia 12:10.
- issue: Nuansa εἰς sesudah verba melihat
  choice: memandang Dia
  alternative: memandang kepada Dia
  rationale: Kedua bentuk dapat mencerminkan arah pandangan. “Memandang Dia” lebih alami dalam bahasa Indonesia modern dan tetap mempertahankan objek pribadi serta arah perhatian.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Formula “ada lagi nas Kitab Suci yang berkata” mempertahankan fungsi kutipan tambahan dengan susunan yang mudah dipahami pembaca umum.
