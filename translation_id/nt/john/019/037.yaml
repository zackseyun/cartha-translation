    issue: The draft leaves πάλιν only implicit in “ada lagi” and renders ἑτέρα γραφή as “nas Kitab Suci.”
    rationale: Although understandable, “Dan sekali lagi, Kitab Suci yang lain berkata” more transparently preserves both the additional citation and the distinct Scripture/passage while remaining idiomatic.
  - severity: low
    issue: The draft has no Indonesian footnote corresponding to the documented εἰς rendering alternative.
    rationale: The source construction permits both a direct-object rendering and a directional rendering. An anchored note records this lexical alternative without overstating it or changing the text’s meaning.
  - severity: low
    issue: Capitalized “Dia” in the quotation makes the contextual identification explicit in an otherwise source-level quotation.
    rationale: The Greek says “the one whom,” not a pronoun with an explicit honorific distinction. “Orang yang” retains the personal referent and lets the surrounding context establish identification.
