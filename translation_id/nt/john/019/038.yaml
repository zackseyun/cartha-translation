id: JHN.19.38
reference: John 19:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: id
  text: Sesudah itu, Yusuf dari Arimatea, yang merupakan murid Yesus tetapi merahasiakan statusnya sebagai murid karena takut kepada orang-orang Yahudi,[a] meminta izin kepada Pilatus untuk mengambil jenazah Yesus. Pilatus mengizinkannya. Maka Yusuf datang dan mengambil jenazah-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus dalam konteks ini, “para pemimpin Yahudi/Yudea”. Dalam Injil Yohanes, sebutan “orang-orang Yahudi” sering dipakai untuk pihak-pihak yang menentang Yesus, bukan untuk seluruh bangsa Yahudi tanpa pembedaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan waktu ini menyatakan urutan peristiwa. Bentuk Indonesia yang alami ini tetap mewakili bentuk jamak ταῦτα secara idiomatis.
- source_word: ἠρώτησεν
  choice: meminta izin kepada
  rationale: Dalam konteks permohonan kepada Pilatus, verba ini secara alami berarti meminta izin; tujuan permintaan dijelaskan oleh klausa ἵνα berikutnya.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: dari Arimatea
  rationale: ἀπό menunjukkan asal atau hubungan tempat secara langsung.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: yang merupakan murid Yesus
  rationale: Menyampaikan konstruksi partisipial dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: κεκρυμμένος
  choice: merahasiakannya
  rationale: Partisip perfek pasif mengacu pada statusnya sebagai murid yang disembunyikan. Akhiran -nya mempertahankan objek tersirat itu tanpa menambahkan tafsiran yang lebih jauh.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: karena takut kepada orang-orang Yahudi
  rationale: Mewakili hubungan sebab dan ungkapan ketakutan secara alami, sambil mempertahankan istilah sumber dalam teks utama.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: untuk mengambil jenazah Yesus
  rationale: Klausa tujuan diterjemahkan secara idiomatis. Dalam konteks penguburan, jenazah lebih alami daripada tubuh, sedangkan mengambil menyampaikan tindakan memindahkan atau membawa pergi.
- source_word: ἐπέτρεψεν
  choice: mengizinkannya
  rationale: Verba ini berarti memberikan izin; bentuk dengan -nya secara ringkas merujuk pada permintaan Yusuf.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Maka Yusuf datang dan mengambil jenazah-Nya
  rationale: Maka menyampaikan fungsi inferensial-sekuensial οὖν. Nama Yusuf diulangi demi kejelasan, dan -Nya mewakili αὐτοῦ.
theological_decisions:
- issue: Rujukan dan penerjemahan τῶν Ἰουδαίων dalam Injil Yohanes
  choice: orang-orang Yahudi dalam teks utama, dengan catatan penjelas mengenai kemungkinan rujukan kontekstualnya
  alternative: para pemimpin Yahudi; orang-orang Yudea
  rationale: Teks Yunani memakai istilah yang secara formal berarti orang-orang Yahudi. Mempertahankannya menghindari penyempitan tafsir dalam teks utama, sementara catatan mencegah pembacaan seolah-olah ungkapan itu tanpa pembedaan menunjuk seluruh bangsa Yahudi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pilihan “jenazah” digunakan karena konteksnya adalah tubuh Yesus yang telah wafat dan hendak dikuburkan. Ambiguitas kontekstual Ἰουδαῖοι dipertahankan dalam teks utama lalu dijelaskan dalam catatan.
