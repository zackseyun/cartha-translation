base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: id
  text: Karena itu, mereka mengambil jenazah Yesus dan membalutnya dengan kain-kain lenan dan rempah-rempah, sesuai dengan kebiasaan orang Yahudi[a] dalam mempersiapkan jenazah untuk dimakamkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesuai dengan kebiasaan orang Yudea dalam mempersiapkan jenazah untuk dimakamkan.” Namun, konteks ini lebih mendukung arti kebiasaan pemakaman orang Yahudi secara umum.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: mengambil
  rationale: Dalam konteks ini, λαμβάνω menyatakan tindakan mengambil jenazah untuk dipersiapkan bagi pemakaman.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai akibat atau kelanjutan logis dari tindakan yang diizinkan dalam ayat sebelumnya.
- source_word: σῶμα
  choice: jenazah
  rationale: Dalam konteks pemakaman, 'jenazah' merupakan padanan Indonesia yang alami dan hormat bagi tubuh orang yang telah meninggal.
- source_word: ἔδησαν
  choice: membalutnya
  rationale: Secara harfiah berarti mengikat, tetapi bersama kain-kain lenan dalam konteks pemakaman, 'membalut' menyampaikan tindakan tersebut secara alami tanpa menghilangkan gagasan pengikatan.
- source_word: ὀθονίοις
  choice: dengan kain-kain lenan
  rationale: Bentuk jamak menunjuk pada lembaran atau potongan kain lenan; 'kain-kain lenan' mempertahankan bahan dan jumlahnya.
- source_word: ἀρωμάτων
  choice: rempah-rempah
  rationale: Menunjuk pada bahan-bahan harum yang digunakan dalam persiapan jenazah; istilah ini jelas dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: καθὼς
  choice: sesuai dengan
  rationale: Menyatakan bahwa tindakan itu dilakukan menurut praktik yang lazim.
- source_word: ἔθος ἐστὶν τοῖς Ἰουδαίοις
  choice: kebiasaan orang Yahudi
  rationale: Dativus menyatakan kebiasaan yang berlaku di kalangan orang Yahudi; susunan ini alami dalam bahasa Indonesia.
- source_word: ἐνταφιάζειν
  choice: dalam mempersiapkan jenazah untuk dimakamkan
  rationale: Kata ini dapat mencakup penyiapan jenazah dan pemakamannya, bukan sekadar tindakan memasukkan ke makam; terjemahan ini sesuai dengan tindakan yang sedang diceritakan.
theological_decisions:
- issue: Makna τοῖς Ἰουδαίοις
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Konteks membicarakan adat pemakaman yang bersifat keagamaan dan budaya secara umum, bukan terutama asal geografis dari Yudea.
- issue: Cakupan ἐνταφιάζειν
  choice: mempersiapkan jenazah untuk dimakamkan
  alternative: menguburkan
  rationale: Ayat ini menggambarkan pembalutan dan pemberian rempah-rempah sebelum penempatan di makam; pilihan ini mempertahankan cakupan funeraria kata Yunani tanpa membatasi maknanya pada penguburan saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Jenazah' dipilih agar alami serta hormat dalam konteks kematian; struktur kalimat tetap mengikuti hubungan logis dan urutan tindakan dalam teks Yunani.
