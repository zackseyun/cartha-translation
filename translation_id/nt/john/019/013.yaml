id: JHN.19.13
reference: John 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: id
  text: Maka ketika Pilatus mendengar kata-kata itu, ia membawa Yesus ke luar, lalu duduk di kursi pengadilan[a] di tempat yang disebut Lantai Batu, yang dalam bahasa Ibrani[b] disebut Gabata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lalu mendudukkan Dia di kursi pengadilan.” Kata kerja Yunani dapat dipahami secara transitif, meskipun yang lebih mungkin di sini ialah Pilatus sendiri duduk di kursi pengadilan.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “dalam bahasa Ibrani” kemungkinan menunjuk pada bahasa Semitik setempat, mungkin bahasa Aram, sebagaimana di bagian lain Injil Yohanes.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sekaligus akibat dari percakapan sebelumnya dengan gaya naratif Indonesia yang alami.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: ketika Pilatus mendengar perkataan-perkataan itu
  rationale: Partisip aoris diterjemahkan secara temporal; bentuk ulang 'perkataan-perkataan' menunjuk pada pernyataan yang baru saja diucapkan.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: ia membawa Yesus ke luar
  rationale: Menyatakan gerakan menuju luar tanpa mempersempit makna ἄγω menjadi cara tertentu seperti menggiring.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: lalu duduk di kursi pengadilan
  rationale: Dalam konteks ini βῆμα adalah tempat duduk resmi untuk mengadili. Bacaan yang paling wajar menjadikan Pilatus subjek verba, tetapi kemungkinan transitif dipertahankan dalam catatan kaki.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: di tempat yang disebut Lantai Batu
  rationale: εἰς menunjuk lokasi hasil gerakan dan wajar diterjemahkan 'di'; nama Yunani diterjemahkan karena maknanya transparan.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: atau dalam bahasa Ibrani, Gabata
  rationale: Teks menyebut bahasa Ibrani, sehingga istilah itu dipertahankan; 'atau' secara alami memperkenalkan nama setempat sebagai padanan nama sebelumnya.
theological_decisions:
- issue: Subjek dan valensi ἐκάθισεν
  choice: Pilatus duduk di kursi pengadilan
  alternative: Pilatus mendudukkan Yesus di kursi pengadilan
  rationale: Bentuk Yunani dapat dipahami secara intransitif atau transitif. Konteks persidangan dan sintaksis paling wajar mendukung Pilatus sebagai orang yang duduk untuk mengadili, tetapi ambiguitas yang bermakna tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. 'Kursi pengadilan' dipilih daripada istilah teknis yang kurang umum, sedangkan 'Gabata' ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
