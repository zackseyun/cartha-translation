  source_fidelity: 'Terjemahan ini secara akurat menyampaikan rangkaian Yunani: οὖν sebagai penghubung naratif (“Maka”), ἐξῆλθεν ... ἔξω melalui “keluar,” partisip φορῶν melalui “dengan mengenakan,” serta kedua benda sandang yang dikenakan Yesus. “Pilatus” merupakan penjelasan subjek yang sah dari konteks langsung dan tidak mengubah makna. “Lihatlah, orang itu!” menyampaikan daya deiktis Ἰδοὺ dan rujukan konkret ὁ ἄνθρωπος tanpa memaksakan penafsiran tambahan.'
