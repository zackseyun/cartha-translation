  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: id
  text: Maka Yesus keluar dengan mengenakan mahkota duri dan jubah ungu. Pilatus berkata kepada mereka, “Lihatlah, orang itu!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Inilah orang itu!” Kata Yunani Ἰδοὺ merupakan ungkapan untuk menarik perhatian dan dapat diterjemahkan “Lihatlah” atau “Inilah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Maka ... keluar
  rationale: Gabungan verba gerak dan adverbia menegaskan bahwa Yesus bergerak ke luar; “keluar” menyatakannya secara alami dalam bahasa Indonesia, sedangkan οὖν diterjemahkan “Maka” sebagai penghubung kelanjutan dan akibat naratif.
- source_word: φορῶν
  choice: dengan mengenakan
  rationale: Partisipel kini menerangkan keadaan Yesus ketika keluar; “dengan mengenakan” jelas dan alami untuk mahkota serta jubah.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: mahkota duri
  rationale: Ungkapan ini menunjuk pada mahkota yang terbuat dari duri; “mahkota duri” adalah bentuk Indonesia yang ringkas dan lazim.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: jubah ungu
  rationale: ἱμάτιον adalah pakaian luar; dalam konteks olok-olok kerajaan, “jubah” menyampaikan fungsi kontekstualnya tanpa memberi rincian bentuk yang tidak dinyatakan teks.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini merupakan present historis. Bahasa Indonesia umumnya memakai bentuk tak bertanda waktu “berkata”, yang tetap hidup dalam narasi. Subjek eksplisit “Pilatus” dipulihkan dari ayat sebelumnya karena dalam bahasa Indonesia “ia” dapat secara keliru dianggap merujuk kepada Yesus.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru deiktis ini menarik perhatian kepada sosok yang sedang ditampilkan. “Lihatlah” bermartabat, alami, dan mempertahankan daya presentasionalnya.
- source_word: ὁ ἄνθρωπος
  choice: orang itu
  rationale: Frasa definit ini menunjuk kepada laki-laki tertentu yang sedang ditampilkan, yaitu Yesus. “Orang itu” lebih alami daripada “manusia itu” dan tidak menambahkan tafsiran antropologis yang lebih luas.
theological_decisions:
- issue: Makna ὁ ἄνθρωπος dalam pernyataan Pilatus
  choice: orang itu
  alternative: manusia itu; laki-laki itu
  rationale: Terjemahan utama mempertahankan rujukan konkret kepada Yesus sebagai pribadi tertentu. “Manusia itu” dapat menonjolkan gema representatif tentang kemanusiaan, sedangkan “laki-laki itu” terlalu menekankan jenis kelamin; kemungkinan gema teologis tidak dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. Nama “Pilatus” dinyatakan untuk menghindari ambiguitas pronomina, berdasarkan subjek yang tersedia dalam konteks langsung. Penanda catatan kaki [a] ditempatkan sesudah seluruh ucapan yang dijelaskannya.
