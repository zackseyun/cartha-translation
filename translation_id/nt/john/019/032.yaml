id: JHN.19.32
reference: John 19:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: id
  text: Maka datanglah para prajurit itu, lalu mereka mematahkan kaki orang yang pertama dan kaki orang lain yang telah disalibkan bersama Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersama dia”; dalam konteks ini, “dia” merujuk kepada Yesus.
    reason: referent_clarification
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sekaligus akibat dari perintah pada ayat sebelumnya; alami dalam narasi Indonesia yang bermartabat.
- source_word: οἱ στρατιῶται
  choice: para prajurit itu
  rationale: Sebutan baku bagi personel militer Romawi dalam konteks ini; artikel Yunani tercermin melalui 'itu' karena kelompoknya sudah disebut pada ayat sebelumnya.
- source_word: τοῦ μὲν πρώτου
  choice: orang yang pertama
  rationale: Kata 'orang' dilengkapi agar rujukan personal yang tersirat dalam bahasa Yunani jelas dan alami dalam bahasa Indonesia.
- source_word: κατέαξαν
  choice: mematahkan
  rationale: Secara langsung menyatakan tindakan mematahkan kaki dalam konteks penyaliban.
- source_word: τὰ σκέλη
  choice: kaki
  rationale: Dalam bahasa Indonesia, 'kaki' dapat menyatakan anggota tubuh secara kolektif tanpa penanda jamak; pengulangan 'kaki' pada unsur kedua memperjelas objek verba.
- source_word: τοῦ ἄλλου
  choice: orang lain
  rationale: Mengacu kepada orang kedua dari dua orang yang disalibkan di samping Yesus; bentuk ini alami dan tetap mencerminkan pembedaan 'yang pertama ... yang lain'.
- source_word: συσταυρωθέντος αὐτῷ
  choice: yang telah disalibkan bersama Yesus
  rationale: Partisipel mengidentifikasi orang itu berdasarkan penyaliban yang telah terjadi. Nama 'Yesus' dipakai untuk menjernihkan rujukan pronomina αὐτῷ tanpa mengubah makna kontekstual.
theological_decisions:
- issue: Rujukan αὐτῷ
  choice: '''bersama Yesus'''
  alternative: '''bersama dia'', yang secara gramatikal dapat terdengar merujuk kepada orang pertama'
  rationale: Dalam konteks Yohanes, kedua orang itu dikenali berdasarkan hubungan mereka dengan Yesus dalam penyaliban. Penyebutan nama Yesus menghindari ketaksaan rujukan yang tidak wajar dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur paralel dibuat eksplisit dengan mengulang 'kaki' agar kalimat tidak terasa eliptis atau kaku. 'Telah disalibkan' mempertahankan tindakan yang mendahului kedatangan para prajurit.
