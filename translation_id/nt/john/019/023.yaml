source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: id
  text: Sesudah para prajurit menyalibkan Yesus, mereka mengambil pakaian luar-Nya[a] dan membaginya menjadi empat bagian, satu bagian untuk setiap prajurit, dan juga baju-Nya. Baju itu tanpa jahitan[b], ditenun dari atas secara utuh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian-Nya”; kata Yunani ini dapat menunjuk pakaian secara umum, tetapi di sini kemungkinan berarti pakaian luar, yang dibedakan dari baju yang disebut sesudahnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tanpa sambungan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ditenun dari atas pada seluruh bagiannya”; ungkapan ini dapat dipahami sebagai pakaian yang ditenun utuh pada seluruh bagiannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Sesudah para prajurit
  rationale: οὖν melanjutkan alur narasi dan dapat tersirat secara alami dalam hubungan waktu; 'para prajurit' menerjemahkan στρατιῶται.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: menyalibkan Yesus
  rationale: Dengan 'sesudah', bentuk aoris dipahami sebagai tindakan yang selesai sebelum tindakan berikutnya, tanpa membuat susunan Indonesia terasa kaku.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: mereka mengambil pakaian luar-Nya
  rationale: ἱμάτια dapat berarti pakaian secara umum, tetapi dalam konteks ini kemungkinan menunjuk pakaian luar yang dibedakan dari χιτών.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: membaginya menjadi empat bagian, satu bagian untuk setiap prajurit
  rationale: Ungkapan ini menyampaikan pembagian empat bagian dan peruntukan satu bagian bagi tiap prajurit dengan jelas dan alami.
- source_word: καὶ τὸν χιτῶνα
  choice: Mereka juga mengambil jubah-Nya
  rationale: χίτων adalah pakaian yang dikenakan dekat tubuh; 'jubah' cukup dikenal dalam ragam Alkitab Indonesia, sementara kalimat lengkap memperjelas bahwa benda ini juga diambil.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Jubah itu tidak berjahit
  rationale: δέ berfungsi sebagai peralihan naratif, sedangkan ἄραφος secara langsung berarti tanpa jahitan.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: ditenun utuh dari atas sampai ke bawah
  rationale: Dalam konteks pakaian, ἄνωθεν paling wajar berarti dari bagian atas; δι’ ὅλου menunjukkan tenunan yang berlanjut pada keseluruhan pakaian.
theological_decisions:
- issue: Kemungkinan pemaknaan simbolis atas jubah tanpa jahitan
  choice: Menerjemahkan ciri jubah secara deskriptif saja.
  alternative: Menampilkan jubah sebagai lambang pakaian imam atau kesatuan gereja.
  rationale: Ayat ini sendiri hanya menjelaskan bentuk pakaian dan tindakan para prajurit; makna simbolis tidak boleh dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah secukupnya agar mudah dipahami, sambil mempertahankan urutan narasi, pembedaan antara ἱμάτια dan χιτών, serta ambiguitas terbatas dalam keterangan cara jubah itu ditenun.
