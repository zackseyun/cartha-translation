revisions:
- from: Sesudah para prajurit menyalibkan Yesus, mereka mengambil pakaian luar-Nya[a] dan membaginya menjadi empat bagian, satu bagian untuk setiap prajurit. Mereka juga mengambil jubah-Nya. Jubah itu tidak berjahit[b], ditenun utuh dari atas sampai ke bawah.[c]
  to: Sesudah para prajurit menyalibkan Yesus, mereka mengambil pakaian luar-Nya[a] dan membaginya menjadi empat bagian, satu bagian untuk setiap prajurit, dan juga baju-Nya. Baju itu tanpa jahitan[b], ditenun dari atas secara utuh.[c]
  rationale: Revisi mempertahankan makna deskriptif tanpa memasukkan penafsiran simbolis. “Baju” menggantikan “jubah” agar kontras leksikal antara pakaian luar dan χιτών tidak terbalik. “Secara utuh” mempertahankan gagasan δι’ ὅλου tanpa menjadikan arah tenunan ke bawah sebagai pernyataan eksplisit teks.
