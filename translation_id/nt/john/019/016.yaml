  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: id
  text: Lalu Pilatus menyerahkan Dia kepada mereka untuk disalibkan.[a] Maka mereka mengambil Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” dalam kedua kalimat ini tidak secara eksplisit menunjuk kelompok tertentu dalam teks Yunani ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Lalu
  rationale: Gabungan penanda waktu dan kesinambungan/inferensi ini secara alami diringkas sebagai “Lalu” dalam narasi Indonesia; hubungan dengan adegan sebelumnya tetap jelas tanpa memakai dua penghubung yang terasa kaku.
- source_word: παρέδωκεν
  choice: menyerahkan
  rationale: Menyatakan tindakan menyerahkan seseorang ke dalam kuasa pihak lain dan sesuai dengan konteks keputusan pengadilan.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti objek ini merujuk kepada Yesus. Huruf kapital mengikuti kelaziman bahasa Indonesia untuk kata ganti yang merujuk kepada Yesus.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Mempertahankan rujukan pronominal Yunani tanpa menentukan kelompok yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: ἵνα σταυρωθῇ
  choice: untuk disalibkan
  rationale: Mengungkapkan tujuan tindakan penyerahan secara alami dan ringkas serta mempertahankan bentuk pasif.
- source_word: Παρέλαβον
  choice: membawa
  rationale: Dalam konteks ini παραλαμβάνω menyatakan bahwa mereka mengambil Yesus untuk dibawa pergi; “membawa” lebih alami daripada “menerima” dan tidak menambahkan istilah teknis mengenai penahanan.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan αὐτοῖς dan subjek tersirat pada Παρέλαβον
  choice: Mempertahankan “mereka” tanpa menyebut kelompok tertentu.
  alternative: Menentukan mereka sebagai para imam kepala dan petugas mereka, atau sebagai para prajurit Romawi.
  rationale: Teks Yunani ayat ini hanya memakai kata ganti dan subjek verba yang tersirat. Menyebut kelompok tertentu akan menyelesaikan ketaksaan yang dibiarkan terbuka oleh teks.
- issue: Subjek παρέδωκεν
  choice: Menyebut “Pilatus” demi kejelasan alami dalam bahasa Indonesia.
  alternative: Mempertahankan kata ganti “ia/dia”.
  rationale: Subjeknya adalah Pilatus dari konteks langsung. Penyebutan nama menghindari rangkaian kata ganti yang berpotensi membingungkan, tanpa mengubah identitas pelaku.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Terjemahan mempertahankan ketaksaan mengenai identitas “mereka”, memakai bentuk pasif “disalibkan”, dan menyederhanakan τότε οὖν secara idiomatis menjadi “Lalu”.
