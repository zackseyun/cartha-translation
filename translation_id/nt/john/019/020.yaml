id: JHN.19.20
reference: John 19:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: id
  text: Karena itu, banyak orang Yahudi membaca tulisan itu, sebab tempat Yesus disalibkan berada dekat kota. Tulisan itu tertulis dalam bahasa Ibrani[a], Latin, dan Yunani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “bahasa Aram”; Yohanes menggunakan istilah “Ibrani” untuk bahasa Semitik setempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: tulisan
  rationale: Dalam konteks penyaliban, kata ini menunjuk pada pemberitahuan tertulis yang dipasang pada salib. 'Tulisan' alami dalam bahasa Indonesia dan tidak memberi kesan bahwa yang dimaksud ialah gelar kehormatan.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: banyak orang Yahudi
  rationale: Ungkapan ini secara alami menyatakan bahwa sejumlah besar dari kalangan orang Yahudi membacanya, tanpa menyiratkan bahwa semua orang Yahudi berbuat demikian.
- source_word: ἀνέγνωσαν
  choice: membaca
  rationale: Bentuk aoris menyatakan tindakan membaca secara sederhana; teks tidak mengharuskan arti 'membacakan dengan suara keras'.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: tempat ... berada dekat kota
  rationale: Terjemahan ini mengikuti arti langsung teks tanpa menambahkan keterangan seperti gerbang kota.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: tempat Yesus disalibkan
  rationale: Bentuk pasif Yunani dipertahankan secara alami tanpa menambahkan pelaku.
- source_word: γεγραμμένον
  choice: ditulis
  rationale: Konstruksi perfektum menyatakan keadaan tulisan yang sudah tertulis; dalam konteks ini, bentuk pasif 'ditulis' menyampaikannya dengan jelas.
- source_word: Ἑβραϊστί
  choice: dalam bahasa Ibrani
  rationale: Teks Yunani secara harfiah menyebut bahasa Ibrani. Kemungkinan bahwa istilah ini menunjuk pada bahasa Aram setempat dipertahankan dalam catatan kaki.
- source_word: Ῥωμαϊστί
  choice: dalam bahasa Latin
  rationale: Walaupun secara bentuk berarti 'secara Romawi', yang dimaksud ialah bahasa Latin.
- source_word: Ἑλληνιστί
  choice: dalam bahasa Yunani
  rationale: Ini adalah padanan langsung dan lazim bagi kata keterangan bahasa tersebut.
- source_word: οὖν
  choice: Karena itu
  rationale: Ungkapan ini mempertahankan hubungan logis dan naratif dengan ayat sebelumnya.
theological_decisions:
- issue: Makna Ἑβραϊστί dalam pemakaian Yohanes
  choice: bahasa Ibrani dalam teks utama
  alternative: bahasa Aram
  rationale: Teks Yunani menyebut 'Ibrani', sehingga istilah itu dipertahankan dalam teks utama. Namun, istilah tersebut mungkin dipakai untuk bahasa Semitik setempat, yakni bahasa Aram; kemungkinan ini dicatat tanpa menyelesaikan ambiguitas secara paksa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara istilah bahasa dan ambiguitas historis dipertahankan.
