  source_fidelity: 'Makna sumber terpelihara: πολλοὶ τῶν Ἰουδαίων diterjemahkan secara partitif sebagai “banyak orang Yahudi”; τίτλος dipahami sebagai tulisan/pengumuman pada penyaliban; lokasi penyaliban dinyatakan dekat kota; dan tiga bahasa mengikuti urutan serta makna teks Yunani. Catatan kaki dengan tepat mempertahankan kemungkinan rujukan Ἑβραϊστί pada bahasa Aram setempat tanpa menggantikan pembacaan utama “Ibrani.”'
