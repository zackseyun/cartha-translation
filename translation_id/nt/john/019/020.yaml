  terminology: “Orang Yahudi,” “disalibkan,” “Ibrani,” “Latin,” dan “Yunani” sesuai dengan register modern baku dan tidak menambahkan penafsiran. “Tulisan” dapat diterima untuk τίτλος dalam konteks ini.
