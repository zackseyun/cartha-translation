id: JHN.19.19
reference: John 19:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: id
  text: Pilatus juga menulis sebuah tulisan dan memasangnya pada salib itu. Tulisan itu berbunyi, “Yesus orang Nazaret, Raja orang Yahudi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Raja orang Yudea.” Istilah Yunani yang digunakan dapat merujuk kepada orang Yahudi secara luas atau, bergantung pada konteksnya, kepada orang Yudea secara khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: sebuah tulisan
  rationale: Dalam konteks penyaliban, kata ini menunjuk pada tulisan yang dipasang pada salib untuk menyatakan identitas atau tuduhan terhadap orang yang dihukum. 'Tulisan' alami dalam bahasa Indonesia dan selaras dengan klausa berikutnya.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: memasangnya pada salib itu
  rationale: Mewakili secara langsung makna 'menaruh/memasang pada salib'; 'memasang' paling alami untuk sebuah tulisan atau papan keterangan.
- source_word: ἦν ... γεγραμμένον
  choice: Tulisan itu berbunyi
  rationale: Ungkapan Indonesia ini menyampaikan keadaan hasil dari sesuatu yang telah ditulis dan mengantar isi tulisan secara alami, tanpa mengubah maknanya.
- source_word: Ναζωραῖος
  choice: orang Nazaret
  rationale: Mengidentifikasi Yesus berdasarkan kaitannya dengan Nazaret dalam bahasa Indonesia yang jelas dan idiomatis; bentuk 'orang Nazaret' tetap berfungsi sebagai julukan identitas.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  rationale: Dalam tulisan tuduhan pada kisah sengsara, frasa ini paling wajar menunjuk kepada orang Yahudi secara luas. Kemungkinan makna geografis 'orang Yudea' dicatat dalam catatan kaki.
- source_word: δὲ καὶ
  choice: juga
  rationale: Menyampaikan daya aditif partikel Yunani secara lancar.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: σταυροῦ
  choice: salib
  rationale: Padanan baku dan sesuai konteks bagi σταυρός dalam kisah penyaliban.
theological_decisions:
- issue: Makna Ἰουδαίων dalam tulisan pada salib
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Dalam konteks gelar kerajaan yang menjadi tuduhan publik terhadap Yesus, 'orang Yahudi' paling mungkin dan paling lazim dimaksudkan. Namun, istilah Yunani itu dapat pula mempunyai arti geografis 'orang Yudea', sehingga kemungkinan tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan isi serta urutan pokok teks Yunani.
