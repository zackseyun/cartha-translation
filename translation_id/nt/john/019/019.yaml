  source_fidelity: 'Terjemahan dengan setia menyampaikan unsur pokok teks Yunani: Pilatus sebagai pelaku, tindakan menulis dan memasang tulisan pada salib, serta isi tulisan itu. “Tulisan itu berbunyi” merupakan padanan idiomatis yang memadai untuk ἦν ... γεγραμμένον dalam konteks pengantar isi inskripsi.'
