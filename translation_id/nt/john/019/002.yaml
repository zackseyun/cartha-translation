  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: id
  text: Lalu para prajurit menganyam sebuah mahkota dari duri, memasangnya di kepala Yesus, dan mengenakan jubah ungu kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: para prajurit
  rationale: Padanan baku dan alami bagi personel militer Romawi dalam konteks ini.
- source_word: πλέξαντες
  choice: menganyam
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; urutan itu tetap jelas secara alami dalam rangkaian verba bahasa Indonesia.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: sebuah mahkota dari duri
  rationale: “Mahkota” mempertahankan gambaran kerajaan semu, sedangkan “dari duri” menyatakan bahan pembuatannya secara wajar.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: memasangnya di kepala Yesus
  rationale: “Memasang” sesuai untuk tindakan menaruh mahkota; nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa menambah tafsiran.
- source_word: ἱμάτιον πορφυροῦν
  choice: jubah ungu
  rationale: Dalam adegan penobatan olok-olok ini, “jubah” merupakan padanan kontekstual yang alami bagi pakaian luar, dan “ungu” mempertahankan warna serta asosiasi kerajaannya.
- source_word: περιέβαλον αὐτόν
  choice: mengenakan ... kepada-Nya
  rationale: Mengungkapkan tindakan menyelubungi atau memakaikan pakaian secara idiomatis, tanpa menentukan bentuk tindakan lebih jauh.
theological_decisions:
- issue: Gambaran kerajaan semu dalam tindakan para prajurit
  choice: Tindakan dan bendanya diterjemahkan secara langsung tanpa menyisipkan kata “mengejek” atau penjelasan lain.
  alternative: Menerjemahkan secara interpretatif sebagai tindakan mengejek Yesus dengan mahkota dan jubah kerajaan.
  rationale: Konteks memperlihatkan olok-olok tersebut, tetapi ayat ini sendiri hanya menuturkan tindakan mereka; terjemahan tidak perlu menjadikan implikasinya sebagai pernyataan eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan tiga tindakan mempertahankan alur naratif Yunani. Kapitalisasi pada “-Nya” mengikuti kebiasaan hormat yang lazim dalam teks Alkitab Indonesia.
