  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: id
  text: dan telah mengenakan manusia baru[a], yang terus diperbarui menuju pengetahuan[b], menurut gambar Dia yang menciptakannya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diri yang baru.” Ungkapan Yunani ini berlawanan dengan “manusia lama” dalam konteks sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini juga dapat mengandung nuansa pengetahuan yang penuh atau lebih mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: telah mengenakan
  rationale: Partisip aoris medium ini melanjutkan metafora pakaian dari konteks sebelumnya. Bentuk “telah mengenakan” menyampaikan tindakan yang telah dilakukan tanpa menghilangkan metaforanya.
- source_word: τὸν νέον
  choice: manusia baru
  rationale: Adjektiva substantival ini dipahami dari kontras dengan “manusia lama” dalam ayat sebelumnya. “Manusia baru” alami dalam bahasa Indonesia, tidak terbatas pada laki-laki, dan dapat memuat dimensi pribadi maupun bersama.
- source_word: ἀνακαινούμενον
  choice: yang terus diperbarui
  rationale: Partisip presens pasif menunjukkan proses yang sedang berlangsung dan tindakan yang diterima. Kata “terus” memperjelas aspek berkelanjutan itu.
- source_word: εἰς ἐπίγνωσιν
  choice: menuju pengenalan
  rationale: εἰς menyatakan arah atau hasil yang dituju dalam proses pembaruan. “Pengenalan” mempertahankan kemungkinan nuansa pengetahuan yang lebih penuh tanpa menjadikannya eksplisit di dalam teks utama.
- source_word: κατ’ εἰκόνα
  choice: sesuai dengan gambar
  rationale: κατά dengan akusatif menyatakan pola atau standar kesesuaian. “Gambar” mempertahankan kaitan leksikal dengan bahasa penciptaan dalam Kejadian.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: Dia yang menciptakannya
  rationale: Frasa partisipial genitif menunjuk kepada Sang Pencipta sebagai pola pembaruan. Klitik “-nya” merujuk kepada “manusia baru” dan mempertahankan struktur relasional teks Yunani.
theological_decisions:
- issue: Makna antropologis τὸν νέον
  choice: manusia baru
  alternative: diri yang baru
  rationale: “Manusia baru” mempertahankan kontras eksplisit dengan manusia lama dalam konteks serta memungkinkan cakupan identitas individual dan korporat, tanpa mengesankan bahwa rujukannya hanya laki-laki.
- issue: Kekuatan makna ἐπίγνωσις
  choice: pengenalan
  alternative: pengetahuan penuh
  rationale: Kata Yunani dapat menyiratkan pengetahuan atau pengenalan yang lebih penuh, tetapi unsur “penuh” tidak perlu dibuat eksplisit dalam teks utama; nuansa itu dicatat dalam catatan kaki.
- issue: Hubungan pembaruan dengan εἰκών
  choice: sesuai dengan gambar Dia yang menciptakannya
  alternative: menurut gambar Penciptanya
  rationale: Terjemahan ini mempertahankan bahasa “gambar” dan identitas personal Sang Pencipta tanpa menentukan lebih jauh apakah frasa tersebut terutama menunjuk pola, tujuan, atau kesesuaian pembaruan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora mengenakan pakaian, proses pembaruan yang berkelanjutan, serta bahasa gambar-penciptaan dipertahankan. Koma akhir mengikuti bentuk kutipan yang merupakan kelanjutan kalimat dari konteks sebelumnya.
