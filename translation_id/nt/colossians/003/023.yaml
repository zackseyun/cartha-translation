id: COL.3.23
reference: Colossians 3:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: id
  text: Apa pun yang kamu lakukan, kerjakanlah dengan segenap hati[a], seperti untuk Tuhan[b] dan bukan untuk manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari jiwa”; dapat juga diterjemahkan “dengan sungguh-sungguh” atau “sepenuh hati.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks rumah tangga ini, “Tuhan” juga dapat mengandung nuansa “Tuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Apa pun yang kamu lakukan
  rationale: Konstruksi relatif tak tentu ini menyatakan cakupan umum, yaitu segala sesuatu yang dilakukan; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐκ ψυχῆς
  choice: dengan segenap hati
  rationale: Secara harfiah berarti 'dari jiwa', tetapi dalam konteks menerangkan pekerjaan yang dilakukan dengan ketulusan batin dan keterlibatan diri sepenuhnya. 'Dengan segenap hati' mempertahankan makna itu dalam ungkapan Indonesia yang wajar; gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: ἐργάζεσθε
  choice: kerjakanlah
  rationale: Bentuk imperatif ini menyerukan tindakan atau pekerjaan yang sungguh-sungguh. 'Kerjakanlah' menyambung secara alami dengan 'apa pun yang kamu lakukan'.
- source_word: ὡς
  choice: seperti untuk
  rationale: 'Partikel ini menunjukkan cara pandang atau orientasi tindakan: pekerjaan itu dilakukan sebagaimana pekerjaan bagi Tuhan.'
- source_word: τῷ κυρίῳ
  choice: Tuhan
  rationale: κύριος di sini paling wajar dipahami sebagai gelar bagi Kristus. Nuansa 'Tuan' tetap mungkin karena konteks rumah tangga dan dicatat dalam catatan kaki.
- source_word: ἀνθρώποις
  choice: manusia
  rationale: Bentuk jamak ini merujuk secara umum kepada sesama manusia dan dikontraskan dengan Tuhan; 'manusia' alami, ringkas, dan tidak menyiratkan laki-laki saja.
theological_decisions:
- issue: Makna κύριος dalam konteks petunjuk rumah tangga
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks dekat membicarakan hubungan hamba dan tuan, sehingga nuansa 'Tuan' dapat terdengar. Namun, kontras ayat ini dan kelanjutannya paling alami menunjuk kepada Kristus sebagai Tuhan; alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kamu' yang terbaca alami. Diksi dibuat lugas dan bermartabat. Ungkapan idiomatis 'dengan segenap hati' dipakai dalam teks utama, sedangkan bentuk harfiah Yunani dipertahankan dalam catatan kaki.
