source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: id
  text: 'Karena itu, matikanlah anggota-anggota tubuhmu yang bersifat duniawi[a]: percabulan, kenajisan, hawa nafsu, keinginan jahat, dan keserakahan[b], yang adalah penyembahan berhala.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu dalam dirimu yang bersifat duniawi.” Secara lebih harfiah, teks Yunani berbunyi “anggota-anggota yang ada di atas bumi.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ketamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: matikanlah
  rationale: Imperatif aoris aktif ini menyerukan tindakan tegas. “Matikanlah” mempertahankan metafora kematian dan daya perintahnya secara alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari uraian sebelumnya dan mempertahankan hubungan logis ayat ini dengan konteksnya.
- source_word: μέλη
  choice: anggota-anggota tubuh
  rationale: Secara harfiah berarti anggota atau bagian tubuh. Pilihan ini mempertahankan metafora tubuh tanpa mengubahnya menjadi gagasan abstrak seperti “tabiat duniawi”.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: yang ada di bumi
  rationale: Terjemahan yang relatif formal ini mempertahankan citra ruang dalam teks Yunani serta ambiguitas hubungan frasa tersebut dengan “anggota-anggota tubuh”.
- source_word: πορνείαν
  choice: percabulan
  rationale: Istilah Indonesia yang mapan dan cukup luas untuk perilaku seksual yang tidak bermoral, tanpa membatasinya pada satu bentuk tertentu.
- source_word: ἀκαθαρσίαν
  choice: kenajisan
  rationale: Padanan lazim bagi istilah keburukan moral Paulus dan mempertahankan cakupan makna ketidakmurnian moral.
- source_word: πάθος
  choice: hawa nafsu
  rationale: Dalam konteks daftar keburukan, kata ini menunjuk pada dorongan kuat yang tidak teratur. “Hawa nafsu” menyampaikan nuansa negatif yang ditentukan konteks.
- source_word: ἐπιθυμίαν κακήν
  choice: keinginan jahat
  rationale: Menerjemahkan nomina dan adjektiva secara langsung serta mempertahankan penilaian moral eksplisit dari κακήν.
- source_word: πλεονεξίαν
  choice: keserakahan
  rationale: Menunjuk pada hasrat untuk terus memperoleh lebih banyak. “Keserakahan” jelas dan alami; alternatif “ketamakan” juga mungkin.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: yang adalah penyembahan berhala
  rationale: Mempertahankan identifikasi tegas dalam bahasa Yunani tanpa melunakkannya menjadi “sama dengan” atau “merupakan semacam” penyembahan berhala.
theological_decisions:
- issue: Rujukan frasa “yang adalah penyembahan berhala”
  choice: Klausa tersebut merujuk khusus pada “keserakahan”.
  alternative: Klausa tersebut merangkum seluruh daftar keburukan sebelumnya.
  rationale: Pronomina relatif feminin tunggal ἥτις paling wajar bersesuaian dengan nomina feminin tunggal terdekat, πλεονεξίαν. Susunan Indonesia mempertahankan kedekatan itu tanpa menambahkan penjelasan doktrinal.
- issue: Makna “anggota-anggota tubuh yang ada di bumi”
  choice: Mempertahankan metafora anggota tubuh dalam teks utama.
  alternative: Menerjemahkannya secara interpretatif sebagai “segala sesuatu dalam dirimu yang bersifat duniawi” atau “tabiat duniawimu”.
  rationale: Teks Yunani secara eksplisit memakai μέλη, “anggota-anggota tubuh”. Daftar berikutnya dapat dipahami sebagai penjelasan aposisional, tetapi terjemahan utama tidak seharusnya menghapus metafora atau menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora tubuh dan identifikasi tegas antara keserakahan dan penyembahan berhala dipertahankan. Penanda catatan kaki [a] dan [b] muncul dalam teks utama.
