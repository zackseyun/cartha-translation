  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: id
  text: Para ayah, janganlah membuat anak-anak kalian kesal, supaya mereka tidak patah semangat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkecil hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Hai para ayah
  rationale: πατέρες secara leksikal dan gramatikal berarti para ayah. Sapaan “Hai” membuat bentuk vokatif dalam konteks nasihat rumah tangga terasa alami dalam bahasa Indonesia.
- source_word: μὴ ἐρεθίζετε
  choice: janganlah membuat ... kesal
  rationale: ἐρεθίζω berarti membangkitkan atau memancing reaksi negatif. Ungkapan ini alami dalam bahasa Indonesia dan menunjukkan tindakan berulang atau sikap orang tua yang menimbulkan kejengkelan pada anak.
- source_word: τὰ τέκνα ὑμῶν
  choice: anak-anakmu
  rationale: τέκνα mencakup anak laki-laki maupun perempuan. Akhiran “-mu” mempertahankan orang kedua jamak secara idiomatis sebagai sapaan kolektif kepada para ayah.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: ἵνα μή menyatakan tujuan atau hasil yang hendak dihindari; “supaya ... tidak” mempertahankan hubungan itu dengan jelas.
- source_word: ἀθυμῶσιν
  choice: menjadi patah semangat
  rationale: ἀθυμέω menunjuk pada kehilangan keberanian atau semangat. “Patah semangat” adalah ungkapan Indonesia yang wajar dan mempertahankan dimensi batin dari kata tersebut.
theological_decisions:
- issue: Cakupan πατέρες dalam nasihat rumah tangga
  choice: Ditujukan secara khusus kepada para ayah
  alternative: Ditujukan secara umum kepada orang tua
  rationale: Teks Yunani secara eksplisit memakai πατέρες, “para ayah”. Walaupun prinsipnya dapat diterapkan lebih luas, terjemahan mempertahankan penerima sapaan yang spesifik.
- issue: Nuansa hubungan ἵνα μή
  choice: Tujuan atau hasil yang hendak dicegah
  alternative: Hanya menyatakan akibat yang pasti
  rationale: ἵνα μή dapat mengungkapkan tujuan maupun hasil yang dimaksudkan; “supaya ... tidak” menjaga keluwesan ini tanpa memastikan satu nuansa saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Para ayah” mempertahankan kekhususan sapaan Yunani; “membuat ... kesal” dipilih sebagai ungkapan alami tanpa mempersempit makna menjadi kemarahan saja.
