translation:
  language: id
  text: Dalam hal-hal itu kamu juga dahulu menjalani hidup[a], ketika kamu hidup di dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “di dalam hal-hal yang.” Kata ganti relatif Yunani dapat diterjemahkan demikian dan merujuk pada hal-hal yang disebut sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: dalam hal-hal itu
  rationale: Frasa ini merujuk pada keburukan yang disebut sebelumnya. Bentuk relatif Yunani secara harfiah dapat berarti “di dalam hal-hal yang,” tetapi demonstratif “hal-hal itu” membuat rujukannya wajar dalam bahasa Indonesia tanpa menghilangkan gagasan tentang lingkup kehidupan.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: καί bersama ὑμεῖς menekankan bahwa para pembaca pun dahulu mengambil bagian dalam pola hidup tersebut.
- source_word: περιεπατήσατε
  choice: hidup
  rationale: περιπατέω dipakai secara metaforis untuk cara atau perilaku hidup. Dalam bahasa Indonesia, “hidup” menyampaikan idiom ini secara alami; metafora harfiah “berjalan” berisiko dipahami sebagai gerak fisik.
- source_word: ποτε
  choice: dahulu
  rationale: Menandai masa lampau yang kini telah berlalu; “dahulu” ringkas, jelas, dan sesuai dengan register ayat.
- source_word: ὅτε
  choice: ketika
  rationale: Menghubungkan perilaku mereka dahulu dengan keadaan hidup mereka pada masa itu.
- source_word: ἐζῆτε
  choice: menjalani kehidupan
  rationale: Ungkapan ini membedakan ζάω dari περιπατέω yang telah diterjemahkan “hidup,” sekaligus menyampaikan aspek imperfektif sebagai keadaan yang berlangsung pada masa lampau.
- source_word: ἐν τούτοις
  choice: di dalamnya
  rationale: τούτοις kembali merujuk pada hal-hal atau praktik-praktik yang disebut sebelumnya. “Di dalamnya” menghindari pengulangan yang kaku dan mempertahankan gambaran tentang lingkup kehidupan mereka dahulu.
theological_decisions:
- issue: Hubungan antara περιεπατήσατε dan ἐζῆτε dalam gambaran etis Paulus
  choice: Membedakan perilaku hidup dahulu (“hidup dalam hal-hal itu”) dari keadaan atau lingkup kehidupan dahulu (“menjalani kehidupan di dalamnya”).
  alternative: Menerjemahkan kedua verba secara sama sebagai “hidup.”
  rationale: Pembedaan ini mencerminkan dua verba Yunani yang berbeda dan mempertahankan gambaran berlapis tentang perilaku serta lingkup kehidupan lama, tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. “Hidup” dipilih untuk metafora περιπατέω karena “berjalan” kurang lazim sebagai ungkapan cara hidup dalam bahasa Indonesia; perbedaan verba tetap dijaga melalui “menjalani kehidupan” untuk ἐζῆτε.
