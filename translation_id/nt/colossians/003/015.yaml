  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: id
  text: Hendaklah damai sejahtera Mesias memerintah[a] dalam hati kalian; kepada damai itu kalian juga telah dipanggil dalam satu tubuh[b]. Dan hendaklah kalian bersyukur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “memerintah” juga dapat berarti “bertindak sebagai wasit” atau “menentukan”; kata ini menggambarkan damai sejahtera Mesias sebagai penentu dalam kehidupan batin umat.
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin “ke dalam satu tubuh,” dengan penekanan pada masuknya ke dalam kesatuan satu tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk εἰρήνη, mencakup kedamaian relasional dan komunal dalam konteks nasihat Paulus.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan dengan padanan semantis 'Mesias' dan bukan sekadar ditransliterasikan.
- source_word: βραβευέτω
  choice: hendaklah ... memimpin
  rationale: Menyampaikan fungsi menentukan atau mengendalikan yang terkandung dalam gambaran seorang wasit, tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dalam hati kalian
  rationale: Mempertahankan ungkapan mengenai kehidupan batin serta bentuk orang kedua jamak secara jelas.
- source_word: εἰς ἣν
  choice: untuk itulah
  rationale: Menunjuk kembali kepada damai sejahtera sebagai tujuan panggilan; padanan ini alami dalam bahasa Indonesia sambil mempertahankan hubungan relatifnya.
- source_word: καὶ ἐκλήθητε
  choice: kalian juga telah dipanggil
  rationale: καί dipertahankan sebagai 'juga'; bentuk pasif dan aspek lampau panggilan tetap terlihat.
- source_word: ἐν ἑνὶ σώματι
  choice: dalam satu tubuh
  rationale: Menerjemahkan ἐν dengan langsung dan mempertahankan metafora korporat tanpa menafsirkannya secara eksplisit sebagai gereja.
- source_word: εὐχάριστοι γίνεσθε
  choice: hendaklah kalian bersyukur
  rationale: Mengungkapkan nasihat imperatif secara alami; 'bersyukur' merupakan padanan Indonesia yang lazim untuk keadaan penuh terima kasih.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini diperlakukan sebagai gelar yang bermakna 'Yang Diurapi'. Pilihan ini mempertahankan daya semantis teks Yunani tanpa menambahkan isi doktrinal.
- issue: Makna ἐν ἑνὶ σώματι
  choice: dalam satu tubuh
  alternative: ke dalam satu tubuh
  rationale: Frasa utama mempertahankan nilai lokatif atau lingkup dari ἐν + datif. Kemungkinan nuansa inkorporasi tidak dimasukkan ke teks utama agar metafora dan ambiguitasnya tetap terpelihara.
- issue: Daya βραβευέτω
  choice: memimpin
  alternative: bertindak sebagai wasit / menentukan
  rationale: Kata kerja ini berlatar gambaran seorang wasit atau pihak yang mengambil keputusan. 'Memimpin' menyampaikan peran pengarah dalam kehidupan batin komunitas tanpa memaksakan metafora olahraga.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῶν/ἐκλήθητε secara jelas. Tanda pisah menghubungkan panggilan dengan damai sejahtera secara alami. Semua penanda catatan kaki muncul dalam teks utama.
