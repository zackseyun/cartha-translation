  terminology: “Tuhan, Sang Mesias” mempertahankan κύριος sebagai “Tuhan” dan menerjemahkan Χριστός sebagai gelar “Mesias”. Catatan alternatif “Tuhan Kristus” tetap tepat sebagai bentuk tradisional.
