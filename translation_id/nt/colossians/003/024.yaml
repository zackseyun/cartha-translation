  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: id
  text: karena kalian tahu bahwa dari Tuhan kalian akan menerima upah berupa warisan. Kalian melayani Tuhan, Sang Mesias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk kata kerja Yunaninya adalah indikatif, “kalian melayani,” bukan imperatif langsung, “layanilah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, menurut ungkapan yang lebih tradisional, “Tuhan Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: karena kamu tahu
  rationale: Partisipel ini meneruskan alur nasihat ayat sebelumnya dan secara wajar memiliki nuansa sebab. Ungkapan ini alami dalam bahasa Indonesia tanpa memutus hubungannya dengan konteks.
- source_word: ἀπὸ κυρίου
  choice: dari Tuhan
  rationale: Preposisi ἀπό dengan genitif menunjukkan sumber; Tuhanlah yang memberikan upah itu.
- source_word: ἀπολήμψεσθε
  choice: kamu akan menerima
  rationale: Bentuk future middle indicative menyatakan penerimaan pada masa mendatang. Nuansa menerima kembali atau sebagai balasan dinyatakan oleh frasa berikutnya.
- source_word: ἀνταπόδοσιν τῆς κληρονομίας
  choice: warisan sebagai upah
  rationale: Susunan ini mengungkapkan secara alami bahwa warisan merupakan upah atau balasan, sambil mempertahankan hubungan genitif Yunani yang padat tanpa menjadikannya dua hal terpisah.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: Tuhan, Sang Mesias
  rationale: κύριος dipertahankan sebagai gelar 'Tuhan', sedangkan Χριστός diterjemahkan sebagai gelar 'Mesias'. Koma membantu bahasa Indonesia membaca kedua sebutan itu sebagai menunjuk kepada pribadi yang sama.
- source_word: δουλεύετε
  choice: kamu sedang melayani
  rationale: Bentuknya present active indicative orang kedua jamak, bukan imperatif. 'Sedang melayani' menegaskan tindakan yang berlaku kini dan mempertahankan daya pernyataannya.
theological_decisions:
- issue: Daya gramatikal δουλεύετε
  choice: 'indikatif: ''kamu sedang melayani'''
  alternative: 'imperatif: ''layanilah'''
  rationale: Morfologi Yunani adalah present active indicative. Terjemahan mempertahankannya sebagai pernyataan yang menjadi dasar dorongan dalam konteks, bukan mengubahnya menjadi perintah langsung.
- issue: Penerjemahan Χριστῷ sebagai gelar
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός berfungsi sebagai gelar. 'Sang Mesias' membuat arti gelarnya jelas, sedangkan bentuk tradisional dicantumkan dalam catatan kaki.
- issue: Hubungan ἀνταπόδοσιν dan κληρονομίας
  choice: warisan sebagai upah
  alternative: upah berupa warisan; upah dari warisan
  rationale: Genitifnya dapat dipahami sebagai penjelas isi atau sifat upah. Pilihan ini menyatakan bahwa warisan itu sendiri adalah upah tanpa menambahkan skema teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan khidmat. 'Warisan sebagai upah' dipilih daripada bentuk harfiah yang kaku 'upah dari warisan'. Bentuk jamak orang kedua dalam bahasa Yunani tidak dapat dibedakan secara morfologis dalam kata ganti Indonesia 'kamu', tetapi konteks tetap menunjukkan para penerima surat secara kolektif.
