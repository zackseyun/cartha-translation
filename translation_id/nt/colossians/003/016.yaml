id: COL.3.16
reference: Colossians 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: id
  text: Hendaklah firman Mesias tinggal dengan melimpah di dalam kamu[a], dalam segala hikmat, sambil kamu saling mengajar dan menegur dengan mazmur, puji-pujian, dan nyanyian rohani, serta menyanyi dengan anugerah[b] di dalam hatimu kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah-tengah kamu.” Bentuk Yunani “kamu” adalah jamak dan dapat menggambarkan firman yang berdiam dalam komunitas secara keseluruhan maupun dalam diri tiap orang percaya.
    reason: alternative_reading
  - marker: b
    text: Atau “dengan rasa syukur.” Ungkapan Yunani ini dapat berarti dengan anugerah, dengan kemurahan, atau dengan rasa syukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: firman Mesias
  rationale: “Firman” mempertahankan keluasan λόγος sebagai perkataan atau pesan, sedangkan “Mesias” menyampaikan fungsi Χριστός sebagai gelar. Bentuk ini tidak memutuskan secara sempit apakah genitif menunjuk pada firman yang berasal dari Mesias atau firman tentang Mesias.
- source_word: ἐνοικείτω ἐν ὑμῖν πλουσίως
  choice: hendaklah ... tinggal dengan limpah di dalam kamu
  rationale: “Tinggal” mempertahankan metafora berdiam, dan “hendaklah” menyampaikan imperatif orang ketiga. “Di dalam kamu” dekat dengan bentuk Yunani dan tetap dapat dipahami secara komunal karena pronominanya jamak.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: dalam segala hikmat
  rationale: Terjemahan yang dekat dengan susunan Yunani ini mempertahankan kemungkinan bahwa frasa tersebut berkaitan dengan berdiamnya firman dan/atau kegiatan mengajar serta menegur.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: ajarlah dan tegurlah satu sama lain
  rationale: Bentuk perintah menghasilkan bahasa Indonesia yang alami serta menunjukkan sarana atau akibat dari firman yang berdiam. “Tegurlah” mempertahankan unsur korektif νουθετέω, dan bentuk refleksif jamak dipahami secara timbal balik.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: dengan mazmur, puji-pujian, dan nyanyian rohani
  rationale: Ketiga istilah musikal tetap dibedakan; πνευματικαῖς secara gramatikal menerangkan “nyanyian.”
- source_word: ἐν χάριτι
  choice: dengan anugerah
  rationale: “Anugerah” mempertahankan arti dasar χάρις dan keterbukaan ungkapan tersebut; kemungkinan makna “dengan rasa syukur” dicatat dalam catatan kaki.
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: di dalam hatimu kepada Allah
  rationale: “Hatimu” adalah bentuk posesif jamak yang wajar dalam bahasa Indonesia dan mempertahankan arah nyanyian kepada Allah.
theological_decisions:
- issue: Arti dan fungsi Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός diperlakukan sebagai gelar dan diterjemahkan menurut maknanya, tanpa menjadikannya sekadar nama diri.
- issue: Daya komunal atau individual ἐν ὑμῖν
  choice: di dalam kamu
  alternative: di tengah-tengah kamu
  rationale: Terjemahan utama mengikuti preposisi Yunani secara langsung. Karena “kamu” merujuk kepada jemaat secara jamak dan konteksnya menampilkan tindakan timbal balik, ungkapan itu dapat menunjuk pada orang percaya secara individual maupun komunitas secara keseluruhan; catatan kaki mempertahankan kedua kemungkinan.
- issue: Hubungan sintaksis ἐν πάσῃ σοφίᾳ
  choice: ditempatkan bersama kalimat pertama tanpa mengunci keterkaitannya
  alternative: “Dengan segala hikmat, ajarlah ...”
  rationale: Susunan Yunani memungkinkan frasa ini dikaitkan dengan berdiamnya firman atau dengan kegiatan mengajar dan menegur. Terjemahan mempertahankan ketegangan sintaksis itu.
- issue: Makna ἐν χάριτι
  choice: dengan anugerah
  alternative: dengan rasa syukur
  rationale: χάρις dapat menyatakan anugerah, kemurahan, atau rasa syukur. Teks utama mempertahankan padanan leksikal yang luas, sementara alternatif kontekstual dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. “Hendaklah” dipakai untuk imperatif orang ketiga, sedangkan partisipel berikutnya diungkapkan sebagai perintah langsung agar alurnya alami. Semua penanda catatan kaki tercantum dalam teks utama.
