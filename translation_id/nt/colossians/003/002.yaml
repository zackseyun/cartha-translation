  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: id
  text: Arahkan pikiran kalian kepada hal-hal yang di atas,[a] bukan kepada hal-hal di bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pikirkanlah hal-hal yang di atas.” Kata kerja Yunani yang dipakai tidak hanya berarti memikirkan, tetapi juga mengarahkan pola pikir atau perhatian kepada sesuatu.
    reason: lexical_alternative
  - marker: b
    text: Atau “hal-hal yang ada di bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: hal-hal yang di atas
  rationale: Artikel netral jamak dengan ἄνω berfungsi sebagai nomina dan menunjuk pada berbagai realitas atau perkara di atas. Ungkapan ini mempertahankan bentuk jamak serta kontras spasial dengan hal-hal di bumi.
- source_word: φρονεῖτε
  choice: Arahkan pikiran kalian kepada
  rationale: Kata kerja ini mencakup orientasi pikiran, sikap, dan perhatian, bukan sekadar kegiatan memikirkan sesuatu. Bentuk imperatif kini menyerukan orientasi yang terus berlangsung; “kalian” menyatakan bahwa perintah ditujukan kepada jemaat secara jamak.
- source_word: μὴ
  choice: bukan kepada
  rationale: μή menegasikan objek kedua melalui kontras dengan objek pertama. Dalam bahasa Indonesia, “bukan kepada” secara alami mempertahankan struktur eliptis dari perintah yang sama.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: hal-hal yang ada di bumi
  rationale: Terjemahan ini mempertahankan konstruksi substantival dan kontras konkret antara yang di atas dan yang di bumi tanpa mengubahnya menjadi kata sifat yang lebih interpretatif.
- source_word: γῆς
  choice: bumi
  rationale: Dalam kontras kosmis dengan “di atas”, γῆ menunjuk pada bumi, bukan suatu negeri atau wilayah tertentu.
theological_decisions:
- issue: Sifat nasihat Paulus dalam φρονεῖτε
  choice: Seruan untuk mengarahkan pola pikir, sikap, dan perhatian kepada realitas yang di atas
  alternative: Perintah yang lebih sempit untuk sekadar memikirkan surga secara intelektual
  rationale: Rentang makna φρονέω meliputi pola pikir, sikap, dan orientasi batin. “Arahkan pikiran kalian kepada” mempertahankan daya etis dan rohaninya tanpa menambahkan isi doktrinal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa imperatif Yunani berbentuk jamak; susunan paralel mempertahankan kontras antara yang di atas dan yang di bumi.
