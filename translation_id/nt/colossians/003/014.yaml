id: COL.3.14
reference: Colossians 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: id
  text: Dan di atas semuanya itu, kenakanlah kasih, yang merupakan pengikat kesempurnaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengikat kelengkapan” atau “pengikat kedewasaan.”
    reason: Alternatif leksikal bagi τελειότης, yang dapat menunjuk pada kesempurnaan, kelengkapan, atau kedewasaan.
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Namun, di atas semuanya itu
  rationale: Dengan konteks metafora pakaian dari ayat 12–13, frasa ini menggambarkan kasih sebagai sesuatu yang dikenakan di atas semua kebajikan lain, sekaligus menonjolkan keutamaannya. “Namun” mencerminkan δέ secara wajar tanpa memberi kontras yang terlalu kuat.
- source_word: τὴν ἀγάπην
  choice: kasih
  rationale: “Kasih” merupakan padanan Indonesia yang lazim dan bermartabat untuk ἀγάπη serta sesuai dengan konteks kebajikan yang memahkotai semuanya.
- source_word: '[kata kerja tersirat dari ἐνδύσασθε dalam ayat 12]'
  choice: kenakanlah
  rationale: Bentuk akusatif τὴν ἀγάπην bergantung pada perintah ἐνδύσασθε di ayat 12. Kata ini perlu dihadirkan dalam bahasa Indonesia untuk menghasilkan kalimat yang utuh dan mempertahankan metafora berpakaian.
- source_word: ὅ
  choice: yang
  rationale: Kata ganti relatif netral ini mengomentari kasih atau gagasan sebelumnya secara keseluruhan. “Yang” mempertahankan hubungan relatif itu tanpa mempersempit rujukannya.
- source_word: σύνδεσμος
  choice: pengikat
  rationale: Kata ini menunjuk pada sesuatu yang mengikat atau menyatukan. “Pengikat” alami dalam bahasa Indonesia dan tetap membuka apakah kasih menyatukan kebajikan-kebajikan atau membawa semuanya kepada keutuhan.
- source_word: τῆς τελειότητος
  choice: kesempurnaan
  rationale: τελειότης dapat berarti kesempurnaan, kelengkapan, atau kedewasaan. “Kesempurnaan” mempertahankan ungkapan Yunani yang padat dan tidak menentukan secara berlebihan nuansa genitifnya.
theological_decisions:
- issue: Makna kasih sebagai σύνδεσμος τῆς τελειότητος
  choice: Kasih disebut “pengikat kesempurnaan,” dengan hubungan tepat antara pengikat dan kesempurnaan dibiarkan terbuka.
  alternative: Kasih adalah pengikat yang menyatukan semuanya secara sempurna; atau pengikat yang menghasilkan kelengkapan/kedewasaan.
  rationale: 'Genitif τῆς τελειότητος memungkinkan beberapa nuansa yang saling berkaitan: pengikat yang bercirikan kesempurnaan, pengikat yang menghasilkan kesempurnaan, atau pengikat yang menyatukan kebajikan menjadi utuh. Terjemahan ringkas mempertahankan ketegangan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Metafora pakaian dipertahankan melalui “kenakanlah,” sedangkan ungkapan “pengikat kesempurnaan” menjaga kepadatan dan ambiguitas asli.
