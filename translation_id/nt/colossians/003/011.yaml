id: COL.3.11
reference: Colossians 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: id
  text: Di situ tidak ada orang Yunani dan orang Yahudi, orang bersunat dan orang tidak bersunat, orang barbar, orang Skit, budak, ataupun orang merdeka. Sebaliknya, Mesias[a] adalah segala-galanya dan ada di dalam semua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yunani Christos, yaitu gelar yang berarti “Yang Diurapi”; secara tradisional, “Kristus”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani “di dalam semua” sangat ringkas. Dalam konteks ini, ungkapan itu dapat dipahami sebagai “di dalam setiap orang”, yakni semua anggota komunitas yang diperbarui; secara gramatikal, ungkapan itu juga dapat dibaca lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: di situ
  rationale: Menunjuk pada ranah manusia baru dalam konteks ayat sebelumnya, sambil mempertahankan bentuk lokatif yang ringkas.
- source_word: οὐκ ἔνι
  choice: tidak ada
  rationale: Menyatakan tidak berlakunya pembedaan-pembedaan tersebut dalam ranah yang sedang dibicarakan.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: orang Yunani dan orang Yahudi
  rationale: Mempertahankan pasangan etnis-budaya yang disebut secara khusus, tanpa memperluas 'Yunani' menjadi semua orang bukan Yahudi.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: orang bersunat dan orang tidak bersunat
  rationale: Bentuk konkret ini lebih wajar dalam bahasa Indonesia dan menyampaikan fungsi kedua nomina abstrak itu sebagai penanda identitas sosial-keagamaan.
- source_word: βάρβαρος
  choice: orang barbar
  rationale: Mempertahankan daya retoris istilah kuno bagi orang yang dipandang sebagai orang luar; istilah ini tidak dipakai sebagai penilaian penerjemah.
- source_word: Σκύθης
  choice: orang Skit
  rationale: Nama kelompok etnis tertentu ditransliterasikan dalam bentuk Indonesia yang ringkas.
- source_word: δοῦλος
  choice: budak
  rationale: Pasangannya dengan 'orang merdeka' menonjolkan status sosial-hukum sebagai orang yang diperbudak, bukan sekadar pelayan.
- source_word: ἐλεύθερος
  choice: orang merdeka
  rationale: Padanan alami bagi status bebas yang dikontraskan dengan budak.
- source_word: ἀλλά
  choice: sebaliknya
  rationale: Menandai kontras kuat antara pembedaan manusia yang tidak menentukan lagi dan kenyataan yang berpusat pada Mesias.
- source_word: τὰ πάντα
  choice: segala-galanya
  rationale: Mengungkapkan kedudukan Mesias yang menyeluruh dalam komunitas baru tanpa menambahkan rincian metafisik yang tidak dinyatakan teks.
- source_word: ἐν πᾶσιν
  choice: ada di dalam semua
  rationale: Mempertahankan ungkapan Yunani yang ringkas dan cakupannya yang tidak sepenuhnya ditentukan; konteks terutama menunjuk kepada semua anggota komunitas baru.
- source_word: Χριστός
  choice: Mesias
  rationale: Istilah ini berfungsi sebagai gelar dan diterjemahkan menurut makna gelarnya; bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan ἐν πᾶσιν
  choice: ada di dalam semua
  alternative: ada di dalam setiap orang; ada di dalam segala sesuatu
  rationale: Konteks mendukung rujukan kepada seluruh anggota komunitas yang diperbarui, tetapi bentuk Yunani tetap ringkas dan secara gramatikal tidak menyebut 'orang' secara eksplisit. Terjemahan utama mempertahankan keterbukaan itu.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός dapat dipahami sebagai gelar. 'Mesias' menyampaikan makna gelar tersebut, sedangkan bentuk yang lazim ditransliterasikan dicatat sebagai alternatif.
- issue: Penerjemahan δοῦλος
  choice: budak
  alternative: hamba
  rationale: Kontras langsung dengan ἐλεύθερος membuat status tidak bebas menjadi unsur penting; 'budak' menyatakannya lebih tepat daripada 'hamba'.
- issue: Makna daftar identitas
  choice: pembedaan-pembedaan itu tidak menentukan kedudukan dalam manusia baru
  alternative: semua identitas sosial dan etnis secara harfiah ditiadakan
  rationale: οὐκ ἔνι menyatakan bahwa kategori-kategori tersebut tidak berlaku sebagai pembeda dalam ranah manusia baru; teks tidak perlu dipaksa untuk menyangkal keberadaan sosial atau historis semua identitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Daftar identitas dibuat konkret agar alami bagi pembaca umum. Titik sebelum 'Sebaliknya' memperjelas peralihan retoris tanpa mengubah hubungan sintaksis. 'Orang barbar' dipertahankan sebagai istilah historis, bukan sebagai penghinaan yang disetujui penerjemah.
