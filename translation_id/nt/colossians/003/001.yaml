id: COL.3.1
reference: Colossians 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: id
  text: Jadi, jika[a] kamu telah dibangkitkan bersama Mesias[b], carilah hal-hal yang di atas, tempat Mesias duduk di sebelah kanan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena kamu telah dibangkitkan bersama Mesias.” Bahasa Yunani mempertahankan bentuk pengandaian (“jika”), meskipun dalam konteksnya syarat itu tampaknya dianggap benar.
    reason: alternative_reading
  - marker: b
    text: 'Yunani: Χριστός (Christos), yaitu gelar yang berarti “Yang Diurapi”; dapat juga diterjemahkan “Kristus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Jadi, jika
  rationale: Mempertahankan bentuk pengandaian εἰ dan hubungan kesimpulan yang ditandai οὖν. Susunan ini alami dalam bahasa Indonesia tanpa mengubah pengandaian itu menjadi pernyataan sebab.
- source_word: συνηγέρθητε
  choice: kamu telah dibangkitkan bersama
  rationale: Bentuk aorist pasif orang kedua jamak menunjuk pada tindakan Allah yang telah terjadi. Kata 'bersama' mempertahankan unsur συν- serta hubungan dengan Mesias yang dinyatakan oleh datif berikutnya.
- source_word: τῷ Χριστῷ / ὁ Χριστός
  choice: Mesias
  rationale: Χριστός masih bermakna gelar bagi Yang Diurapi dalam konteks ini; 'Mesias' mempertahankan daya gelarnya dengan jelas bagi pembaca Indonesia.
- source_word: τὰ ἄνω
  choice: hal-hal yang di atas
  rationale: Ungkapan netral jamak ini mempertahankan keluasan bentuk substantival Yunani tanpa mempersempitnya menjadi sekadar 'hal-hal surgawi'.
- source_word: ζητεῖτε
  choice: carilah
  rationale: Imperatif kini diterjemahkan dengan perintah langsung yang alami. Konteks dapat menyampaikan orientasi yang terus berlangsung tanpa perlu menambahkan kata 'terus'.
- source_word: οὗ
  choice: di mana
  rationale: Adverbia relatif lokatif ini merujuk pada ranah 'di atas' dan diterjemahkan secara langsung serta alami.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: di sebelah kanan Allah
  rationale: Ungkapan ini mempertahankan citra kedudukan mulia dan kekuasaan tanpa menjelaskannya secara berlebihan.
- source_word: καθήμενος
  choice: duduk
  rationale: Partisip kini menggambarkan posisi Mesias saat ini. 'Duduk' mempertahankan citra konkret teks, sedangkan 'bertakhta' akan membuat implikasi kerajaan menjadi eksplisit.
theological_decisions:
- issue: Daya pengandaian Εἰ
  choice: Mempertahankan bentuk 'jika'
  alternative: Karena kamu telah dibangkitkan bersama Mesias
  rationale: Dalam konteks, Paulus tampaknya menganggap syarat itu benar, tetapi bentuk Yunani tetap berupa pengandaian. Terjemahan mempertahankan bentuk dan ketegangan retoris tersebut.
- issue: Makna Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini, gelar bagi Yang Diurapi tetap bermakna dalam pembicaraan tentang kebangkitan bersama dan pemuliaan-Nya; karena itu, gelarnya diterjemahkan, bukan sekadar ditransliterasikan.
- issue: Gambaran καθήμενος ἐν δεξιᾷ τοῦ θεοῦ
  choice: duduk di sebelah kanan Allah
  alternative: bertakhta di sebelah kanan Allah
  rationale: Terjemahan mempertahankan bahasa gambaran dari teks dan tidak menjadikan makna penobatan yang tersirat sebagai sesuatu yang dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak Yunani diterjemahkan dengan 'kamu', yang dapat berfungsi sebagai bentuk tunggal maupun jamak dalam bahasa Indonesia; konteks surat menunjukkan bahwa seluruh jemaat disapa. Struktur kalimat mengikuti alur Yunani sambil tetap mudah dibaca.
