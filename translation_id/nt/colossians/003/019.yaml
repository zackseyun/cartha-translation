  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: id
  text: Para suami, kasihilah istri kalian dan jangan bersikap kasar terhadap mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan menyimpan kepahitan terhadap mereka.” Kata kerja Yunani dapat berarti menjadi pahit atau menyimpan kepahitan; dalam konteks ini, kemungkinan besar yang dimaksud ialah sikap atau perlakuan yang kasar dan penuh kekesalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Hai para suami
  rationale: Dalam rangkaian nasihat rumah tangga dan sebagai pasangan dari τὰς γυναῖκας, ἄνδρες jelas berarti para suami; partikel sapaan “Hai” menyampaikan fungsi vokatif dari bentuk berartikel ini secara alami dalam bahasa Indonesia.
- source_word: ἀγαπᾶτε
  choice: kasihilah
  rationale: Bentuk imperatif kini ini memerintahkan kasih yang terus diwujudkan; “kasihilah” mempertahankan hubungan leksikal dengan “kasih” dan sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: τὰς γυναῖκας
  choice: istrimu
  rationale: γυνή dapat berarti perempuan atau istri, tetapi konteks perkawinan menuntut arti “istri”. Bentuk milik orang kedua tersirat oleh hubungan timbal balik dan dinyatakan secara idiomatis dalam bahasa Indonesia.
- source_word: μὴ πικραίνεσθε
  choice: jangan bersikap kasar
  rationale: πικραίνω berhubungan dengan kepahitan atau menjadi pahit; dalam konstruksi relasional dengan πρός, ungkapan ini menunjuk pada sikap atau perlakuan keras yang lahir dari kepahitan. Terjemahan utama menyampaikan daya praktisnya, sedangkan nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: πρὸς αὐτάς
  choice: terhadap mereka
  rationale: πρός dengan akusatif menandai arah sikap atau tindakan. “Terhadap mereka” alami setelah “bersikap kasar” dan mempertahankan rujukan jamak kepada para istri.
theological_decisions:
- issue: Sapaan rumah tangga yang spesifik menurut jenis kelamin dan hubungan perkawinan
  choice: Mempertahankan sapaan kepada para suami dan menyebut pasangan mereka sebagai istri.
  alternative: Menerjemahkan secara umum sebagai laki-laki dan perempuan.
  rationale: Konteks kode rumah tangga serta pasangan leksikal ἄνδρες–γυναῖκας menunjukkan bahwa yang dimaksud ialah hubungan suami-istri, bukan laki-laki dan perempuan pada umumnya.
- issue: Nuansa kepahitan dan kekasaran dalam larangan
  choice: Memakai “jangan bersikap kasar” dalam teks utama dan mencatat alternatif “jangan menjadi pahit hati”.
  alternative: Memakai hanya terjemahan harfiah “jangan menjadi pahit hati terhadap mereka”.
  rationale: Larangan Yunani mempertahankan gambaran kepahitan sekaligus mengarah pada sikap terhadap istri. Teks utama menyampaikan dampak relasionalnya secara alami tanpa menghapus ambiguitas leksikal, yang dicatat di kaki halaman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hai para suami” menandai sapaan langsung; “kasihilah” mempertahankan nada imperatif Alkitabiah tanpa terdengar usang. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa yang dijelaskannya.
