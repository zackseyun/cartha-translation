  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: id
  text: Hai anak-anak, taatilah orang tuamu dalam segala hal, sebab hal ini berkenan dalam Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dapat diterima dalam Tuhan.” Ungkapan “dalam Tuhan” juga dapat dipahami sebagai hal yang berkenan dalam hubungan seseorang dengan Tuhan, bukan semata-mata “berkenan kepada Tuhan.”
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Hai anak-anak
  rationale: τέκνα adalah bentuk sapaan jamak kepada anak-anak dalam keluarga dan tidak terbatas pada anak laki-laki. Partikel sapaan “Hai” membuat fungsi vokatifnya jelas dan tetap wajar dalam bahasa Indonesia.
- source_word: ὑπακούετε
  choice: taatilah
  rationale: Imperatif ὑπακούω menyatakan menaati atau mematuhi pihak yang berwenang. “Taatilah” menangkap daya perintahnya secara alami dalam konteks hubungan anak dan orang tua.
- source_word: τοῖς γονεῦσιν
  choice: orang tuamu
  rationale: γονεῦσιν berarti orang tua. Akhiran posesif “-mu” wajar dalam sapaan langsung bahasa Indonesia dan menyatakan hubungan yang tersirat dalam konteks Yunani tanpa mempersempitnya menjadi ayah dan ibu.
- source_word: κατὰ πάντα
  choice: dalam segala hal
  rationale: Frasa κατά dengan πάντα menyatakan cakupan atau segi, bukan terutama waktu. “Dalam segala hal” mempertahankan keluasan ungkapan sumber dan menghindari arti temporal “selalu”.
- source_word: τοῦτο
  choice: hal ini
  rationale: τοῦτο menunjuk kembali kepada ketaatan yang baru saja diperintahkan. “Hal ini” mempertahankan bentuk demonstratif tanpa menguraikan rujukannya secara berlebihan.
- source_word: γὰρ
  choice: sebab
  rationale: γάρ memperkenalkan alasan bagi perintah sebelumnya. “Sebab” menyatakan hubungan penjelas itu dengan jelas dan bermartabat.
- source_word: εὐάρεστόν ἐστιν
  choice: berkenan
  rationale: εὐάρεστος berarti menyenangkan atau dapat diterima, khususnya dalam penilaian ilahi. “Berkenan” merupakan padanan Indonesia yang alami dalam konteks ini; catatan kaki mempertahankan alternatif leksikal “dapat diterima”.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan formal “dalam Tuhan” mempertahankan ungkapan Paulus dan ambiguitas relasional atau sferis dari ἐν, tanpa mempersempitnya menjadi “kepada Tuhan”.
theological_decisions:
- issue: Cakupan “dalam segala hal” dan hubungan frasa “dalam Tuhan”
  choice: Kedua frasa dipertahankan apa adanya; “dalam Tuhan” ditempatkan bersama pernyataan tentang apa yang berkenan.
  alternative: Menjadikan “dalam Tuhan” sebagai pembatas eksplisit atas ketaatan, atau menerjemahkannya “kepada Tuhan” sebagai pihak yang disenangkan.
  rationale: Teks Yunani tidak menyatakan klausa pengecualian dan secara susunan menempatkan ἐν κυρίῳ dalam pernyataan τοῦτο ... εὐάρεστόν ἐστιν. Terjemahan tidak menambahkan batas etis yang tidak dinyatakan dalam ayat ini dan juga tidak menutup kemungkinan bahwa frasa tersebut menggambarkan apa yang berkenan dalam hubungan dengan Tuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. “Hai anak-anak” menandai sapaan; “orang tuamu” alami bagi pembaca umum. Ungkapan khas Paulus “dalam Tuhan” dipertahankan agar ambiguitas sumber tidak diselesaikan secara diam-diam.
