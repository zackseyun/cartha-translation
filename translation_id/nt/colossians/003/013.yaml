  terminology: '''Tuhan'', ''saling mengampuni'', dan ''keluhan'' sesuai dengan register baku serta konteks etis ayat ini. ''Keberatan'' merupakan alternatif yang mungkin untuk μομφή, walau ''keluhan'' lebih dekat dengan pilihan utama.'
