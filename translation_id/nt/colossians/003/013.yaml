base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: id
  text: Hendaklah kalian bersabar seorang terhadap yang lain dan saling mengampuni jika seseorang mempunyai keluhan terhadap orang lain[a]. Sebagaimana Tuhan telah mengampuni kalian, kalian pun harus melakukan hal yang sama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika seseorang mempunyai keberatan terhadap orang lain.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “demikian juga kalian.” Bahasa Yunani membiarkan kata kerja yang dimaksud tersirat dari konteks; terjemahan melengkapinya dengan “melakukan hal yang sama.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: Hendaklah kalian sabar seorang terhadap yang lain
  rationale: Mengungkapkan tindakan relasional yang terus berlaku tanpa memakai ungkapan sehari-hari yang bernada kasar seperti ‘saling tahan’. Bentuk ‘hendaklah’ menyampaikan daya nasihat dari rangkaian parenesis dalam konteks.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: saling mengampuni
  rationale: Dalam konteks pelanggaran antarpersonal, χαρίζομαι berarti mengampuni; ‘saling’ menyampaikan fungsi timbal balik dari ἑαυτοῖς secara alami dalam bahasa Indonesia.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: jika seseorang mempunyai keluhan terhadap orang lain
  rationale: Mempertahankan sifat syarat yang umum dan tidak tertentu. ‘Keluhan’ menyampaikan alasan untuk mencela atau merasa dirugikan tanpa menaikkannya menjadi tuduhan resmi.
- source_word: καθὼς καὶ
  choice: Sebagaimana
  rationale: Menjaga hubungan perbandingan antara pengampunan Tuhan dan kewajiban komunitas untuk bertindak serupa; unsur καί tercermin secara alami dalam susunan kalimat, bukan diterjemahkan secara kaku.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku dan bermartabat bagi gelar κύριος; tidak mempersempit rujukannya di dalam teks terjemahan.
- source_word: ἐχαρίσατο
  choice: telah mengampuni
  rationale: Menyampaikan tindakan pengampunan yang sudah dilakukan dan mempertahankan hubungan makna dengan χαριζόμενοι.
- source_word: οὕτως καὶ ὑμεῖς
  choice: kalian pun harus demikian
  rationale: Bahasa Indonesia memerlukan penyelesaian yang alami. ‘Demikian’ tetap membiarkan tindakan yang tersirat ditentukan oleh konteks, sedangkan ‘harus’ menyampaikan daya nasihat dari rangkaian perintah.
theological_decisions:
- issue: Rujukan ὁ κύριος
  choice: Memakai gelar ‘Tuhan’ tanpa menyebut nama rujukannya secara eksplisit
  alternative: Menjelaskan sebagai ‘Kristus’ atau memahami gelar itu lebih umum sebagai Allah
  rationale: Dalam konteks Kolose, gelar ini paling mungkin menunjuk kepada Kristus, tetapi terjemahan ‘Tuhan’ mempertahankan bentuk dan ruang rujukan teks Yunani tanpa penjelasan teologis tambahan.
- issue: Elipsis pada οὕτως καὶ ὑμεῖς
  choice: Menggunakan ‘kalian pun harus demikian’ tanpa mengulang kata ‘mengampuni’
  alternative: Menerjemahkan secara eksplisit ‘kalian pun harus mengampuni’
  rationale: Teks Yunani tidak menyatakan ulang verba. ‘Demikian’ menghasilkan bahasa Indonesia yang lengkap sekaligus mempertahankan elipsis semantis, sebab tindakan yang dimaksud jelas dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina ‘kalian’ dipakai untuk menandai bentuk jamak ὑμεῖς dengan jelas. Susunan dibuat alami tanpa menghapus sifat timbal balik, syarat umum, atau elipsis pada akhir ayat.
