  terminology: “Manusia lama” secara tepat menjaga hubungan leksikal dan konseptual dengan “manusia baru” pada ayat berikutnya. “Menanggalkan” mempertahankan citra pakaian dari ἀπεκδύομαι, sedangkan “perbuatan-perbuatannya” memadai untuk πράξεις.
