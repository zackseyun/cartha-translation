id: COL.3.9
reference: Colossians 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: id
  text: Jangan saling berdusta, sebab kamu telah menanggalkan manusia lama beserta perbuatan-perbuatannya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah menanggalkan manusia lama beserta perbuatan-perbuatannya.” Bentuk partisip Yunani dapat diterjemahkan secara lebih formal atau dipahami secara temporal; dalam teks utama, bentuk itu dipahami sebagai dasar bagi larangan tersebut.
    reason: grammatical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Jangan berdusta
  rationale: Bentuk imperatif kini dengan μή menyatakan larangan. Ungkapan ini langsung, wajar, dan tidak memaksakan arti bahwa kebiasaan yang sedang berlangsung harus dihentikan.
- source_word: εἰς ἀλλήλους
  choice: saling
  rationale: Dalam konstruksi ini frasa tersebut menyatakan hubungan timbal balik. Bahasa Indonesia paling alami mengungkapkannya dengan 'saling'.
- source_word: ἀπεκδυσάμενοι
  choice: sebab kamu telah menanggalkan
  rationale: Partisip aoris medium ini paling mungkin memberi dasar bagi larangan dan mempertahankan metafora pakaian. 'Telah' menyampaikan tindakan yang dipandang sudah terjadi.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: manusia lama
  rationale: '''Manusia'' merupakan padanan alami bagi ἄνθρωπος dan mempertahankan kontras Paulus dengan ''manusia baru'' pada ayat berikutnya tanpa mempersempitnya menjadi laki-laki.'
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: beserta perbuatan-perbuatannya
  rationale: '''Beserta'' menyampaikan penyertaan yang erat, sedangkan bentuk ulang ''perbuatan-perbuatan'' menunjukkan rangkaian tindakan atau perilaku. Akhiran ''-nya'' secara alami merujuk kepada manusia lama.'
theological_decisions:
- issue: Hubungan partisip ἀπεκδυσάμενοι dengan larangan
  choice: 'Kausal: ''sebab kamu telah menanggalkan'''
  alternative: '''setelah menanggalkan'' atau ''dengan telah menanggalkan'''
  rationale: Dalam konteks ayat 9–10, tindakan menanggalkan manusia lama tampaknya menjadi dasar etis bagi larangan berdusta. Karena bentuk partisip itu sendiri dapat dibaca lebih formal atau temporal, alternatifnya dicatat dalam catatan kaki.
- issue: Makna τὸν παλαιὸν ἄνθρωπον
  choice: manusia lama
  alternative: diri yang lama
  rationale: Pilihan ini mempertahankan metafora antropologis dan kaitannya dengan 'manusia baru' pada ayat berikutnya. 'Diri yang lama' lebih interpretatif dan dapat mempersempit dimensi korporat atau representatif ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Saling berdusta' lebih alami daripada 'berdusta satu kepada yang lain'; 'menanggalkan' mempertahankan metafora pakaian dalam teks Yunani.
