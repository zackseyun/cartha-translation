  verdict: revise
  source_fidelity: Secara umum daftar lima hal dan imperatif ἀπόθεσθε tersampaikan. Namun βλασφημία dalam konteks ini mencakup cercaan/ucapan menghina atau pencemaran nama, bukan khusus "fitnah" dalam arti tuduhan palsu. Selain itu, "semuanya ini" kurang idiomatis dalam bahasa Indonesia baku.
  naturalness: Susunan kalimatnya jelas, tetapi "semuanya ini" sebaiknya diganti dengan "semuanya". "Luapan amarah" merupakan padanan modern yang alami untuk θυμός dan membedakannya dari ὀργή.
  terminology: '"Amarah" untuk ὀργή dan "niat jahat" untuk κακία sudah memadai. "Cercaan" lebih luas dan lebih setia daripada "fitnah" untuk βλασφημία. "Perkataan memalukan" mencerminkan αἰσχρολογία tanpa membatasinya pada kata-kata cabul atau sekadar kotor.'
