  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: id
  text: 'Tetapi sekarang, kamu juga harus membuang semuanya: amarah, luapan amarah, niat jahat, cercaan, dan perkataan memalukan dari mulutmu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: harus membuang
  rationale: Menyampaikan daya imperatif aoristus sebagai tuntutan tegas untuk menanggalkan atau menyingkirkan perilaku-perilaku tersebut; “membuang” alami dalam bahasa Indonesia dan mempertahankan metafora menanggalkan sesuatu.
- source_word: ὀργήν
  choice: amarah
  rationale: Padanan umum dan alami untuk kemarahan, serta dapat dibedakan dari θυμός yang lebih meledak atau berkobar.
- source_word: θυμόν
  choice: kegeraman
  rationale: Menggambarkan luapan kemarahan yang kuat dan menjaga pembedaan leksikal dengan ὀργή.
- source_word: κακίαν
  choice: niat jahat
  rationale: Dalam daftar sifat dan perilaku antarmanusia ini, ungkapan tersebut menyampaikan kedengkian atau keinginan mencelakakan tanpa membatasinya pada satu tindakan tertentu.
- source_word: βλασφημίαν
  choice: fitnah
  rationale: Dalam konteks etika tutur antarmanusia, kata ini menunjuk pada ucapan yang merusak nama baik atau mencerca; “fitnah” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: αἰσχρολογίαν
  choice: perkataan kotor
  rationale: Mencakup tutur yang memalukan, kasar, atau cabul tanpa mempersempit maknanya hanya pada kecabulan seksual.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: yang keluar dari mulutmu
  rationale: Ungkapan Indonesia yang alami untuk mempertahankan gambaran sumber ujaran dalam teks Yunani.
theological_decisions: []
