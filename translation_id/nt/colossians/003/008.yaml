  register: Bahasa Indonesia baku modern dengan nada nasihat rasuli yang tegas dan bermartabat. Kata ganti “kamu” dipahami secara jamak dari konteks surat, sebagaimana lazim dalam bahasa Indonesia; tidak ditambahkan penanda jamak yang terasa berat.
