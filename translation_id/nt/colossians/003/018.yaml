  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: id
  text: Hai para istri, tunduklah kepada suamimu, sebagaimana sepatutnya di dalam Tuhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Hai para istri
  rationale: Dalam konteks petunjuk rumah tangga dan berpasangan dengan ἀνδράσιν, kata γυναῖκες berarti para istri, bukan perempuan secara umum. Bentuk sapaan 'Hai para istri' menyampaikan vokatif fungsional dari bentuk nominatif Yunani secara wajar.
- source_word: ὑποτάσσεσθε
  choice: tunduklah
  rationale: Imperatif kini medio-pasif ini menyerukan sikap menempatkan diri di bawah tatanan relasional. 'Tunduklah' ringkas, alami, dan tidak memberi kesan bahwa mereka dipaksa untuk ditaklukkan.
- source_word: τοῖς ἀνδράσιν
  choice: kepada suamimu
  rationale: Dalam konteks rumah tangga, ἀνήρ berarti 'suami'. Bentuk '-mu' dipakai secara distributif untuk para istri yang disapa dan terdengar lebih alami daripada 'kepada suami-suami kalian'.
- source_word: ὡς
  choice: sebagaimana
  rationale: ὡς memperkenalkan ukuran atau kesesuaian tindakan, bukan alasan kausal; 'sebagaimana' mempertahankan hubungan tersebut.
- source_word: ἀνῆκεν
  choice: sepatutnya
  rationale: Walaupun secara morfologis berbentuk imperfek, kata ini dipakai secara idiomatis untuk menyatakan apa yang patut atau sesuai. 'Sepatutnya' menyampaikan daya umum-kini tanpa memaksakan kala lampau.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Terjemahan ini mempertahankan ungkapan teologis yang mengaitkan kepatutan nasihat tersebut dengan relasi kepada Tuhan, tanpa menguraikannya melampaui teks.
theological_decisions:
- issue: Cakupan dan dasar nasihat
  choice: Frasa 'sebagaimana sepatutnya di dalam Tuhan' dipertahankan sebagai kualifikasi teologis atas ketundukan yang diperintahkan.
  alternative: Memahami nasihat itu sebagai norma sosial mutlak tanpa kualifikasi, atau mengaitkan 'di dalam Tuhan' hanya dengan para istri.
  rationale: Susunan Yunani menghubungkan ἐν κυρίῳ dengan pernyataan tentang apa yang patut. Terjemahan menjaga batas dan ketegangan yang ada dalam teks tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Sapaan 'Hai para istri' cocok untuk nasihat langsung; 'suamimu' dipahami secara distributif. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili secara memadai dalam teks utama tanpa kehilangan ambiguitas penting.
