translation:
  language: id
  text: Sebab kalian telah mati, dan hidup kalian telah disembunyikan[b] bersama Mesias[a] di dalam Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau “Kristus”; di sini diterjemahkan sebagai gelar untuk mempertahankan maknanya.
    reason: alternative_reading
  - marker: b
    text: Atau, “tersembunyi.” Bentuk perfek Yunani dapat menekankan keadaan sekarang yang merupakan hasil dari tindakan yang telah selesai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: kalian telah mati
  rationale: Bentuk aoristus indikatif orang kedua jamak menunjuk pada kematian yang telah terjadi secara menentukan. Kata “kalian” memperjelas bahwa sapaan ini jamak, sedangkan “telah mati” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan acuan pada tindakan lampau.
- source_word: γάρ
  choice: sebab
  rationale: Partikel ini memberikan alasan atau dasar bagi nasihat sebelumnya. “Sebab” mempertahankan hubungan penjelas tersebut dengan gaya yang ringkas dan wajar.
- source_word: ἡ ζωὴ ὑμῶν
  choice: hidup kalian
  rationale: Terjemahan langsung dan alami yang tidak memperluas makna teologis kata ζωή melampaui yang dinyatakan teks.
- source_word: κέκρυπται
  choice: telah disembunyikan
  rationale: Bentuk perfek pasif menyatakan tindakan yang telah berlangsung dengan keadaan yang tetap berlaku. “Telah disembunyikan” mempertahankan unsur tindakan lampau dan bentuk pasifnya; alternatif “tersembunyi” menonjolkan keadaan sekarang.
- source_word: σὺν τῷ Χριστῷ
  choice: bersama Sang Mesias
  rationale: σύν menyatakan kebersamaan atau persekutuan dan diterjemahkan “bersama.” Χριστός berfungsi sebagai gelar bagi Yang Diurapi, sehingga “Sang Mesias” mempertahankan makna gelarnya.
- source_word: ἐν τῷ θεῷ
  choice: di dalam Allah
  rationale: ἐν di sini menyatakan ranah atau lokasi. “Di dalam Allah” mempertahankan susunan dan daya teologis ungkapan Yunani tanpa mengubahnya menjadi parafrasa.
theological_decisions:
- issue: Χριστῷ diterjemahkan sebagai gelar atau bentuk yang menyerupai nama diri
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap membawa makna gelar “Yang Diurapi.” “Sang Mesias” menyatakan fungsi gelar itu dengan jelas, sementara “Kristus” dicatat sebagai padanan tradisional yang sah.
- issue: Hubungan hidup orang percaya dengan Mesias dan Allah
  choice: bersama Sang Mesias di dalam Allah
  alternative: bersama Kristus dalam Allah
  rationale: 'Terjemahan ini mempertahankan kedua relasi yang dibedakan oleh teks: σύν menunjukkan kebersamaan dengan Mesias, sedangkan ἐν menunjukkan keberadaan dalam Allah. Keduanya tidak dilebur atau dijelaskan lebih jauh.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. “Kalian” dipakai untuk mempertahankan bentuk jamak sapaan Yunani secara jelas. Susunan kalimat tetap dekat dengan teks sumber, tetapi mengalir alami dalam bahasa Indonesia.
