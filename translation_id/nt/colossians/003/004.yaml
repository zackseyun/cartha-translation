id: COL.3.4
reference: Colossians 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: id
  text: Ketika Mesias[a], yang adalah hidup kalian[b], dinyatakan[c], maka kalian juga akan dinyatakan bersama dia dalam kemuliaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”. Gelar Yunani Χριστός dapat diterjemahkan dengan kedua cara ini; “Mesias” mempertahankan makna gelarnya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “Mesias, hidup kalian.”
    reason: lexical_alternative
  - marker: c
    text: Atau “tampak”. Kata kerja Yunani yang berakar sama juga dipakai dalam frasa “kalian juga akan dinyatakan” pada bagian selanjutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Menandai peristiwa mendatang yang diharapkan terjadi; “ketika” lebih alami daripada “kapan pun” dan tidak menyiratkan kejadian berulang.
- source_word: ὁ Χριστός
  choice: Mesias
  rationale: Χριστός merupakan gelar yang berarti “Yang Diurapi”; “Mesias” mempertahankan daya gelarnya dalam konteks ini. Bentuk berartikelnya juga mendukung pemahaman sebagai gelar.
- source_word: φανερωθῇ
  choice: dinyatakan
  rationale: Mempertahankan bentuk pasif serta gagasan bahwa Mesias dibuat nyata atau tampak secara terbuka.
- source_word: ἡ ζωὴ ὑμῶν
  choice: yang adalah hidup kalian
  rationale: Klausa relatif membuat aposisi Yunani “Mesias, hidup kalian” jelas dan alami dalam bahasa Indonesia tanpa menambahkan gagasan baru. “Kalian” menunjukkan bahwa pronomina sumber berbentuk jamak.
- source_word: τότε καὶ
  choice: pada saat itu ... juga
  rationale: “Pada saat itu” mempertahankan hubungan waktu, sedangkan “juga” menyatakan keikutsertaan umat dalam apa yang terjadi pada Mesias.
- source_word: ὑμεῖς
  choice: kalian
  rationale: Pronomina Yunani berbentuk jamak dan eksplisit untuk penekanan; “kalian juga” mempertahankan penekanan itu secara alami.
- source_word: σὺν αὐτῷ
  choice: bersama dia
  rationale: Menyatakan persekutuan atau keikutsertaan erat dan lebih kuat daripada sekadar kebersamaan kebetulan.
- source_word: φανερωθήσεσθε
  choice: akan dinyatakan
  rationale: Mempertahankan bentuk pasif dan memakai akar terjemahan yang sama seperti φανερωθῇ, sehingga kesejajaran antara penyataan Mesias dan penyataan umat tetap terlihat.
- source_word: ἐν δόξῃ
  choice: dalam kemuliaan
  rationale: Mempertahankan bentuk frasa preposisional dan membiarkan frasa itu menyatakan lingkup atau keadaan penyataan tanpa mempersempitnya menjadi sekadar cara yang mulia.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk yang menyerupai nama diri
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pernyataan kristologis ini, bentuk berartikel mendukung daya gelar. “Mesias” menerjemahkan makna gelarnya, sedangkan catatan kaki mempertahankan bentuk tradisional “Kristus” sebagai alternatif yang sah.
- issue: Aposisi yang menyamakan Mesias dengan hidup umat
  choice: yang adalah hidup kalian
  alternative: Mesias, hidup kalian
  rationale: Pilihan ini menyatakan hubungan identifikasi yang kuat dalam teks Yunani, bukan sekadar mengatakan bahwa Mesias memberi hidup, sambil membuat susunannya wajar bagi pembaca Indonesia.
- issue: Kesejajaran dua bentuk pasif φανερόω
  choice: dinyatakan ... akan dinyatakan
  alternative: menampakkan diri ... akan tampak
  rationale: Pengulangan akar yang sama mempertahankan hubungan teologis dan gramatikal antara penyataan Mesias dan penyataan umat bersama dia, tanpa menentukan siapa pelaku implisit dari bentuk pasif tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami namun tetap dekat pada bentuk sumber. “Kalian” dipakai untuk menandai jamaknya ὑμῶν dan ὑμεῖς secara jelas. Pronomina “dia” ditulis dengan huruf kecil sesuai ejaan umum dan tanpa menambahkan penandaan kehormatan yang tidak terdapat dalam teks Yunani.
