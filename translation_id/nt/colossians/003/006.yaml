lexical_decisions:
- source_word: δι’ ἃ
  choice: Karena hal-hal inilah
  rationale: διά dengan pronomina relatif akusatif menyatakan sebab. Frasa ini secara alami menunjuk kembali kepada berbagai kejahatan dalam ayat sebelumnya dan mempertahankan acuan jamaknya.
- source_word: ἔρχεται
  choice: sedang datang
  rationale: Bentuk kini ἔρχομαι dipertahankan dengan daya progresif atau mendatang yang dekat, sesuai dengan nuansa penghakiman eskatologis.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: murka Allah
  rationale: ὀργή di sini menunjuk pada murka ilahi dalam konteks penghakiman; ungkapan ini ringkas, wajar, dan tetap berbobot teologis.
- source_word: ἐπὶ
  choice: atas
  rationale: Dengan akusatif, ἐπί menandai sasaran atau arah datangnya murka. 'Atas' mempertahankan gambaran tersebut dalam bahasa Indonesia yang bermartabat.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: anak-anak ketidaktaatan
  rationale: Ungkapan genitif bergaya Semitis ini secara harfiah menyebut 'anak-anak ketidaktaatan', yaitu orang-orang yang dicirikan oleh ketidaktaatan. Pilihan ini mempertahankan bentuk idiom sumber tanpa menyiratkan bahwa kelompoknya hanya laki-laki.
theological_decisions:
- issue: Apakah idiom τοὺς υἱοὺς τῆς ἀπειθείας dipertahankan atau langsung diparafrasakan
  choice: Mempertahankan idiom 'anak-anak ketidaktaatan' dalam teks utama
  alternative: orang-orang yang tidak taat / orang-orang yang dicirikan oleh ketidaktaatan
  rationale: Idiom sumber membawa nuansa identitas atau ciri yang melekat, bukan sekadar satu tindakan tidak taat. Catatan kaki menjelaskan maksudnya tanpa menghilangkan tekstur ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab, aspek verbal, serta idiom sumber; catatan kaki menjelaskan idiom yang mungkin terasa tidak lazim.
