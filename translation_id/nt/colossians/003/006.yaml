  text: Karena semuanya itulah murka Allah sedang datang menimpa orang-orang yang tidak taat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak ketidaktaatan,” yaitu orang-orang yang dicirikan oleh ketidaktaatan.
