  to: Sebab orang yang berbuat tidak adil akan menerima balasan atas perbuatan tidak adil yang telah dilakukannya[a], dan tidak ada pilih kasih[b].
  rationale: Revisi memperjelas bahwa ἀδικέω berbicara tentang tindakan tidak adil, bukan sekadar kekeliruan. “Menerima balasan atas” adalah cara Indonesia yang wajar untuk menyatakan bahwa pelaku menerima kembali apa yang patut diterimanya menurut perbuatannya, tanpa menambahkan agen pembalasan atau membatasi ayat pada waktu maupun bentuk penghakiman tertentu. Catatan kaki mempertahankan alternatif yang lebih dekat pada susunan leksikal Yunani dan menjelaskan idiom προσωπολημψία.
