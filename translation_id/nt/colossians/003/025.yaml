review_pass:
  verdict: revise
  source_fidelity: Draf menangkap struktur dasar ayat dan fungsi γάρ dengan baik. Namun, “berbuat salah” dapat mencakup kekeliruan yang tidak disengaja, sedangkan ἀδικέω menunjuk tindakan yang salah/tidak adil; selain itu, “apa yang telah dilakukannya dengan salah” tidak alami dalam bahasa Indonesia dan kurang jelas sebagai dasar pembalasan.
  naturalness: Kalimat utama pada umumnya baku, tetapi frasa “apa yang telah dilakukannya dengan salah” terasa terjemahan-harfiah dan tidak idiomatis. “Tidak ada pilih kasih” adalah ungkapan Indonesia modern yang langsung dan alami untuk προσωπολημψία.
  terminology: “Berbuat tidak adil” dan “perbuatan tidak adil” mempertahankan ranah makna ἀδικέω serta pengulangan yang disengaja dalam Yunani. “Pilih kasih” menyampaikan προσωπολημψία tanpa istilah yang kaku atau arkais.
  issues:
  - severity: medium
    issue: “berbuat salah” berpotensi terlalu luas untuk ἀδικῶν.
    rationale: Dalam bahasa Indonesia, frasa itu dapat berarti membuat kekeliruan biasa. Konteks dan akar ἀδικ- lebih tepat ditampilkan sebagai tindakan yang tidak adil atau jahat.
  - severity: medium
    issue: “apa yang telah dilakukannya dengan salah” tidak idiomatis dan kurang tegas menyatakan pembalasan atas perbuatan salah itu.
    rationale: Susunan tersebut terdengar seperti calque. “Menerima balasan atas perbuatan tidak adil yang telah dilakukannya” menyampaikan daya retributif κομίσεται secara alami tanpa menentukan pelaku, waktu, atau mekanisme penghakiman.
  - severity: low
    issue: “sikap memihak” kurang langsung dibanding ungkapan lazim “pilih kasih.”
    rationale: “Pilih kasih” merupakan padanan modern yang jelas untuk larangan keberpihakan berdasarkan status, sementara catatan kaki dapat menjelaskan idiom harfiahnya.
  revised_text: Sebab orang yang berbuat tidak adil akan menerima balasan atas perbuatan tidak adil yang telah dilakukannya[a], dan tidak ada pilih kasih[b].
