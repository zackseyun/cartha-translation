base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: id
  text: Sebab orang yang berbuat tidak adil akan menerima balasan atas perbuatan tidak adil yang telah dilakukannya[a], dan tidak ada pilih kasih[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menerima kembali apa yang telah ia lakukan secara tidak adil.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak ada keberpihakan”; secara harfiah, “tidak ada menerima muka,” yaitu tidak menilai berdasarkan kedudukan atau keadaan lahiriah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Sebab orang yang berbuat salah
  rationale: Partisipel kini berartikel berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang melakukan kesalahan. “Sebab” menerjemahkan γάρ sebagai penjelasan atau dasar bagi pernyataan sebelumnya.
- source_word: κομίσεται
  choice: akan menerima kembali
  rationale: Dalam konteks ini κομίζω menyatakan menerima kembali sebagai balasan atas perbuatan sendiri. Pilihan ini mempertahankan bentuk tengah dan hubungan verbal langsung dengan apa yang telah dilakukan tanpa menyebut pelaku pembalasan yang tidak dinyatakan dalam teks.
- source_word: ὃ ἠδίκησεν
  choice: apa yang telah dilakukannya dengan salah
  rationale: Klausa relatif menunjuk kepada kesalahan yang telah dilakukan dan mempertahankan pengulangan akar ἀδικ- dalam bahasa Yunani sejauh dapat diungkapkan secara wajar dalam bahasa Indonesia.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: tidak ada sikap memihak
  rationale: προσωπολημψία berarti keberpihakan atau perlakuan istimewa berdasarkan kedudukan atau keadaan lahiriah. Ungkapan ini modern, jelas, dan tetap sesuai dengan nada peringatan yang khidmat.
theological_decisions:
- issue: Sifat pembalasan dan ketidakberpihakan dalam penghakiman
  choice: Ayat ini menyatakan prinsip umum bahwa pelaku kesalahan akan menerima kembali akibat yang setimpal dengan perbuatannya dan bahwa tidak ada keberpihakan.
  alternative: Membatasi pernyataan ini hanya pada penghakiman akhir atau hanya pada hubungan antara hamba dan tuan.
  rationale: Teks Yunani tidak menentukan secara eksplisit mekanisme, waktu, atau lingkup tunggal pembalasan. Terjemahan mempertahankan keluasan dan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Bentuk “orang yang” mempertahankan acuan tunggal yang bersifat umum tanpa memasukkan pembedaan gender yang tidak diperlukan dalam bahasa Indonesia. Semua penanda catatan kaki dicantumkan dalam teks utama.
