  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: id
  text: Karena itu, sebagai orang-orang pilihan Allah, yang kudus dan dikasihi, kenakanlah belas kasih yang mendalam,[a] kebaikan hati, kerendahan hati, kelemahlembutan,[b] dan kesabaran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagian-bagian batin belas kasihan”; maksudnya ialah belas kasih yang berakar jauh di dalam diri.
    reason: lexical_alternative
  - marker: b
    text: Atau “kelembutan.”
    reason: lexical_alternative
  - marker: c
    text: Kata Yunaninya dapat menunjuk pada kesabaran yang panjang terhadap orang lain.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: kenakanlah
  rationale: Bentuk imperatif ini dipakai secara metaforis untuk mengenakan kebajikan seperti pakaian. “Kenakanlah” alami dalam bahasa Indonesia dan mempertahankan metafora tersebut.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari nasihat sebelumnya; “Karena itu” jelas mempertahankan hubungan wacananya.
- source_word: ὡς
  choice: sebagai
  rationale: Menunjukkan bahwa pembaca harus bertindak sesuai dengan identitas mereka, tanpa mengubahnya menjadi pernyataan sebab yang lebih tegas.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: orang-orang pilihan Allah
  rationale: Menyatakan bahwa mereka dipilih oleh Allah, sambil menghindari penjabaran mekanisme pemilihan yang tidak diberikan ayat ini.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: yang kudus dan dikasihi
  rationale: Mempertahankan kedua keterangan tentang identitas pembaca. “Dikasihi” menyampaikan keadaan sebagai orang yang telah dan tetap dikasihi.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: belas kasih yang mendalam
  rationale: Ungkapan harfiahnya menunjuk pada bagian batin sebagai pusat belas kasih. Pilihan ini menyampaikan kedalaman perasaan tanpa memakai ungkapan anatomis yang tidak alami dalam bahasa Indonesia.
- source_word: χρηστότητα
  choice: kebaikan hati
  rationale: Dalam daftar kebajikan ini, ungkapan tersebut secara alami menyampaikan sikap baik dan murah hati kepada sesama.
- source_word: ταπεινοφροσύνην
  choice: kerendahan hati
  rationale: Padanan Indonesia yang baku dan jelas untuk sikap rendah hati.
- source_word: πραΰτητα
  choice: kelemahlembutan
  rationale: Menyampaikan sifat lembut yang terkendali tanpa menyiratkan kelemahan.
- source_word: μακροθυμίαν
  choice: kesabaran
  rationale: Menunjuk pada kesabaran yang panjang, khususnya dalam menghadapi orang lain; “kesabaran” merupakan padanan paling alami dalam daftar kebajikan.
theological_decisions:
- issue: Bahasa pemilihan dalam ἐκλεκτοὶ τοῦ θεοῦ
  choice: orang-orang pilihan Allah
  alternative: orang-orang yang dipilih Allah
  rationale: Pilihan utama mempertahankan bentuk identitas kelompok dalam teks dan prakarsa ilahi, tetapi tidak menerangkan cara atau urutan pemilihan sehingga ketegangan teologis ayat tetap terjaga.
- issue: Nuansa etis πραΰτης
  choice: kelemahlembutan
  alternative: kelembutan
  rationale: “Kelemahlembutan” merupakan istilah etis yang dikenal dalam bahasa Alkitab Indonesia dan tidak harus berarti kelemahan; catatan memberi alternatif yang lebih langsung bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan metafora mengenakan pakaian serta rangkaian identitas dan kebajikan dalam bahasa Yunani, sambil menghindari idiom anatomis yang terasa janggal.
