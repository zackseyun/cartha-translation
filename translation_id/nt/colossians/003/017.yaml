id: COL.3.17
reference: Colossians 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: id
  text: Apa pun yang kamu lakukan, baik dalam perkataan maupun dalam perbuatan, lakukanlah semuanya dalam nama Tuhan Yesus[a], sambil mengucap syukur kepada Allah Bapa melalui Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dalam nama” juga dapat berarti “di bawah otoritas” atau “sebagai wakil”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: Apa pun yang kamu lakukan
  rationale: Ungkapan ini menyatakan cakupan yang tidak terbatas dan menyeluruh. Bentuk ini alami dalam bahasa Indonesia serta mempertahankan daya cakup teks Yunani.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: baik dengan perkataan maupun perbuatan
  rationale: Pasangan ini mencakup ucapan dan tindakan. Konstruksi 'baik ... maupun ...' menyampaikan kesejajaran retorisnya dengan jelas dan wajar.
- source_word: πάντα
  choice: semuanya
  rationale: Kata ini merangkum kembali seluruh hal yang baru disebutkan dan mempertahankan penekanan menyeluruh dalam nasihat tersebut.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: dalam nama Tuhan Yesus
  rationale: Terjemahan langsung ini mempertahankan ungkapan alkitabiah yang dapat mencakup otoritas, perwakilan, dan keterikatan kepada Yesus tanpa mempersempitnya pada satu pengertian.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam konteks kristologis ini, κύριος merupakan gelar bagi Yesus; 'Tuhan' mempertahankan bobot dan pemakaian Perjanjian Baru.
- source_word: εὐχαριστοῦντες
  choice: sambil mengucap syukur
  rationale: Partisipel kini menunjukkan tindakan yang menyertai pelaksanaan nasihat utama. 'Sambil' membuat hubungan itu jelas tanpa mengubahnya menjadi perintah terpisah.
- source_word: τῷ θεῷ πατρὶ
  choice: kepada Allah Bapa
  rationale: πατρί beraposisi dengan θεῷ, sehingga 'Allah Bapa' merupakan padanan Indonesia yang alami dan tepat.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: Pronomina ini paling wajar merujuk kepada Tuhan Yesus yang baru disebutkan. 'Melalui' mempertahankan gagasan perantaraan dalam διά.
theological_decisions:
- issue: Makna 'dalam nama Tuhan Yesus'
  choice: Mempertahankan ungkapan 'dalam nama Tuhan Yesus' dalam teks utama.
  alternative: di bawah otoritas Tuhan Yesus; sebagai wakil Tuhan Yesus
  rationale: Ungkapan Yunani memiliki jangkauan makna yang luas, termasuk otoritas, perwakilan, dan identifikasi. Mempertahankan idiom tersebut menghindari pembatasan makna secara sepihak.
- issue: Rujukan 'melalui Dia'
  choice: Kata ganti tersebut merujuk kepada Tuhan Yesus sebagai perantara ucapan syukur kepada Allah Bapa.
  alternative: Rujukan umum tanpa penekanan kristologis khusus
  rationale: Anteseden terdekatnya ialah 'Tuhan Yesus', dan hubungan sintaksis ini sesuai dengan pola Paulus mengenai ucapan syukur kepada Bapa melalui Kristus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang luhur tetapi mudah dipahami. Kata ganti orang kedua jamak Yunani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat berfungsi tunggal maupun jamak; konteks surat menunjukkan para pembaca secara kolektif. Kapitalisasi 'Dia' dipakai untuk memperjelas rujukan kepada Tuhan Yesus.
