revisions:
- from: Hai para budak[a], taatilah tuan-tuanmu secara jasmani[b] dalam segala hal, bukan hanya ketika mereka melihatmu, seperti orang yang berusaha menyenangkan manusia[c], melainkan dengan ketulusan hati karena takut akan Tuhan.
  to: Para budak[a], taatilah tuan-tuanmu di dunia ini[b] dalam segala hal. Janganlah taat hanya ketika diawasi[c], seperti orang yang berusaha menyenangkan manusia, melainkan dengan ketulusan hati, karena takut akan Tuhan.
  rationale: Revisi mengganti ungkapan yang tidak idiomatis “tuan-tuanmu secara jasmani” dengan “tuan-tuanmu di dunia ini”, yang menyatakan pembatasan relasi para tuan pada ranah manusiawi sebagaimana dimaksud κατὰ σάρκα; catatan kaki mempertahankan bentuk harfiahnya. Kalimat juga dipisahkan agar larangan terhadap ketaatan demi pengawasan lebih jelas, dan penanda [c] dipindahkan ke padanan unsur Yunani yang relevan. Istilah perbudakan dan kontras dengan Tuhan tetap dipertahankan tanpa menambahkan penilaian doktrinal.
