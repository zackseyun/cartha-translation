  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: id
  text: Para budak[a], taatilah tuan-tuanmu di dunia ini[b] dalam segala hal. Janganlah taat hanya ketika diawasi[c], seperti orang yang berusaha menyenangkan manusia, melainkan dengan ketulusan hati, karena takut akan Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “budak” juga dapat diterjemahkan “hamba” atau “pelayan”, tetapi dalam konteks ini biasanya menunjuk pada orang yang diperbudak dan berada di bawah kuasa seorang tuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tuan-tuan menurut daging”; maksudnya ialah tuan dalam hubungan manusiawi di dunia ini.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan pelayanan di depan mata”, yaitu bekerja hanya ketika sedang diawasi.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Hai para budak
  rationale: Dalam aturan rumah tangga ini, δοῦλοι menunjuk pada orang-orang yang diperbudak dan berada di bawah kuasa tuan; “budak” menyatakan realitas sosial itu dengan lebih jujur daripada “pelayan”.
- source_word: ὑπακούετε κατὰ πάντα
  choice: taatilah ... dalam segala hal
  rationale: Bentuk imperatif ὑπακούετε menuntut ketaatan, sedangkan κατὰ πάντα mempertahankan cakupan luas “dalam segala hal”.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: tuan-tuanmu secara jasmani
  rationale: “Tuan-tuanmu” sesuai dengan relasi perbudakan, sedangkan “secara jasmani” mempertahankan ungkapan Paulus κατὰ σάρκα dan membatasi relasi itu pada ranah manusiawi sekarang.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: bukan hanya ketika mereka melihatmu
  rationale: Alih-alih membuat kata majemuk Indonesia yang tidak alami, frasa ini menyampaikan maksud pelayanan yang dilakukan demi pengawasan mata.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: seperti orang yang berusaha menyenangkan manusia
  rationale: Ungkapan ini mempertahankan nada negatif tentang orang yang bertindak demi memperoleh perkenanan manusia.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: melainkan dengan ketulusan hati
  rationale: Dalam konteks etis ini ἁπλότης berarti ketulusan dan kebulatan niat, bukan kepolosan intelektual.
- source_word: φοβούμενοι τὸν κύριον
  choice: karena takut akan Tuhan
  rationale: Partisipel ini menyatakan sikap atau motivasi bagi ketulusan tersebut; “takut akan Tuhan” mempertahankan konsep alkitabiah tanpa melunakkannya menjadi sekadar hormat.
theological_decisions:
- issue: Nasihat etis dalam konteks perbudakan
  choice: Menerjemahkan δοῦλοι dan κύριοι secara terus terang sebagai “budak” dan “tuan”, tanpa mengubahnya menjadi hubungan kerja modern.
  alternative: “Pelayan” dan “majikan” atau “pekerja” dan “atasan”.
  rationale: Istilah Yunani menggambarkan perbudakan dunia kuno. Menggantinya dengan kategori pekerjaan modern akan menutupi realitas historis dan ketegangan etis teks; penerjemahan yang lugas tidak dengan sendirinya menyatakan dukungan terhadap lembaga tersebut.
- issue: Hubungan antara tuan manusia dan Tuhan
  choice: Mempertahankan pembatas κατὰ σάρκα sebagai “secara jasmani” dan menerjemahkan κύριος terakhir sebagai “Tuhan”.
  alternative: Meratakan keduanya sebagai “tuan”, atau menjelaskan κατὰ σάρκα hanya sebagai “duniawi”.
  rationale: Pilihan ini mempertahankan kontras Paulus antara kuasa para tuan dalam tatanan manusiawi dan Tuhan sebagai pihak ilahi yang harus ditakuti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Hai para budak” mempertahankan bentuk vokatif; “bukan hanya ketika mereka melihatmu” mengutamakan kejelasan alami sambil menyediakan bentuk harfiahnya dalam catatan kaki. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
