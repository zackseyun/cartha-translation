review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan status perbudakan (δοῦλοι), perintah untuk taat dalam segala hal, kontras dengan Tuhan, serta makna ketulusan hati. Namun, “tuan-tuanmu secara jasmani” tidak secara alami memodifikasi “tuan-tuanmu” dalam bahasa Indonesia dan dapat terbaca sebagai cara menaati secara fisik. Frasa ini perlu diungkapkan sebagai pembatas bagi tuan manusiawi/di dunia ini. Penanda catatan tentang ὀφθαλμοδουλίαις juga harus ditempatkan pada unsur yang dijelaskannya.
  naturalness: Bahasa draf pada umumnya baku, tetapi “Hai para budak” terasa lebih artifisial daripada yang diperlukan karena vokatif eksplisit tidak ada dalam bahasa Yunani, dan “secara jasmani” tidak idiomatis dalam posisi tersebut. “Janganlah taat hanya ketika diawasi” menyampaikan makna “eye-service” dengan jelas dan alami.
  terminology: “Budak” dan “tuan” tepat bagi konteks sosial kuno dan lebih jujur daripada istilah hubungan kerja modern. “Tuhan” tepat untuk τὸν κύριον. “Ketulusan hati” merupakan padanan yang baik untuk ἁπλότης καρδίας.
  issues:
  - severity: medium
    issue: “Tuan-tuanmu secara jasmani” berpotensi salah cakup dan tidak alami.
    rationale: κατὰ σάρκα membatasi identitas/ranah para κύριοι sebagai tuan manusiawi, bukan cara pelaksanaan ketaatan. Dalam bahasa Indonesia, “secara jasmani” setelah nomina mudah dipahami sebagai keterangan cara.
  - severity: low
    issue: Penanda catatan kaki [c] tidak melekat pada padanan “eye-service”.
    rationale: Catatan [c] menjelaskan “bukan hanya ketika diawasi”, tetapi penandanya saat ini diletakkan setelah “manusia”, yang menjelaskan unsur berikutnya (ἀνθρωπάρεσκοι).
  - severity: low
    issue: Sapaan “Hai” menambahkan penandaan vokatif yang tidak eksplisit dalam sumber dan terasa kurang modern.
    rationale: Artikel οἱ bersama bentuk imperatif dapat dialihkan langsung sebagai “Para budak,” tanpa kehilangan fungsi alamat.
