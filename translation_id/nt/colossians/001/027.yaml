  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: id
  text: Kepada mereka Allah berkenan memberitahukan betapa kayanya kemuliaan rahasia ini di antara bangsa-bangsa bukan Yahudi, yaitu Mesias di dalam kamu[a], pengharapan akan kemuliaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di tengah-tengah kamu.” Kata-kata Yunani ini dapat menunjuk kepada Mesias yang berada dalam diri orang-orang percaya atau hadir di tengah komunitas mereka.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Kepada mereka
  rationale: Kata ganti relatif datif jamak ini menunjuk kembali kepada orang-orang kudus pada ayat sebelumnya dan berfungsi sebagai penerima tindakan 'memberitahukan'.
- source_word: ἠθέλησεν
  choice: berkenan
  rationale: θέλω menyatakan kehendak atau kerelaan yang disengaja. 'Berkenan' alami dalam konteks tindakan Allah dan tidak memaksakan gagasan pemilihan yang tidak dinyatakan secara eksplisit.
- source_word: γνωρίσαι
  choice: memberitahukan
  rationale: Mencerminkan arti dasar γνωρίζω, yakni membuat sesuatu diketahui, tanpa mempersempitnya menjadi istilah teknis 'menyingkapkan'.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: betapa kayanya kemuliaan
  rationale: Ungkapan Yunani yang padat ini secara idiomatis menyatakan besarnya kekayaan kemuliaan. Bentuk ini menjaga hubungan 'kekayaan' dan 'kemuliaan' tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: μυστηρίου
  choice: rahasia
  rationale: Dalam konteks Paulus, μυστήριον ialah maksud ilahi yang dahulu tersembunyi tetapi kini diberitahukan. 'Rahasia' lebih mudah dipahami pembaca Indonesia modern daripada 'misteri', yang dapat menyiratkan teka-teki yang belum terpecahkan.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: di antara bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks ini ἔθνη merujuk kepada bangsa-bangsa non-Yahudi. Bentuk eksplisit ini lebih jelas dalam bahasa Indonesia daripada sekadar 'bangsa-bangsa'.
- source_word: ὅ ἐστιν
  choice: yaitu
  rationale: Memperkenalkan penjelasan atau identifikasi isi rahasia tersebut secara alami dalam bahasa Indonesia.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Χριστός berfungsi kuat sebagai gelar dalam identifikasi isi rahasia, sehingga 'Mesias' mempertahankan daya titularnya.
- source_word: ἐν ὑμῖν
  choice: di dalam kamu
  rationale: Terjemahan langsung ini mempertahankan kemungkinan kehadiran Mesias dalam diri orang-orang percaya secara jamak; kemungkinan arti korporat 'di tengah-tengah kamu' dicatat dalam catatan kaki.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: pengharapan akan kemuliaan
  rationale: Genitif Yunani yang padat diungkapkan secara alami sebagai pengharapan yang tertuju pada kemuliaan, tanpa menjabarkan lebih jauh hakikat kemuliaan itu.
theological_decisions:
- issue: Makna Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam klausa penjelas ini istilah tersebut mengidentifikasi isi rahasia dan tetap memiliki daya sebagai gelar. 'Mesias' mempertahankan fungsi itu tanpa menjadikannya sekadar nama diri.
- issue: Makna ἐν ὑμῖν
  choice: di dalam kamu
  alternative: di tengah-tengah kamu
  rationale: Bahasa Yunani dapat menunjuk kepada kehadiran dalam orang-orang percaya atau kehadiran di tengah komunitas mereka. Teks utama memakai padanan langsung, sedangkan catatan kaki mempertahankan kemungkinan korporat.
- issue: Hubungan pengharapan dan kemuliaan
  choice: pengharapan akan kemuliaan
  alternative: pengharapan kemuliaan
  rationale: Padanan dengan 'akan' alami dalam bahasa Indonesia dan menyatakan orientasi pengharapan kepada kemuliaan tanpa menentukan secara berlebihan apakah genitifnya objektif atau menjelaskan isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan kepadatan teologis dan ambiguitas ἐν ὑμῖν.
