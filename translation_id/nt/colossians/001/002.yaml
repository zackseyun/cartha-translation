  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: id
  text: 'Kepada saudara-saudara[b] di Kolose yang kudus dan setia[a] dalam Mesias[c]: Anugerah bagi kalian dan damai sejahtera dari Allah, Bapa kita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “percaya”; kata Yunani πιστοῖς dapat menggambarkan orang yang percaya atau orang yang setia.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang digunakan secara harfiah berarti “saudara-saudara”; dalam konteks ini Paulus kemungkinan menyapa seluruh jemaat, termasuk perempuan.
    reason: lexical_alternative
  - marker: c
    text: 'Terjemahan tradisional: “dalam Kristus.” Gelar Yunani Χριστός berarti “Mesias.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: kepada ... di Kolose
  rationale: Konstruksi datif dengan ἐν dan nama tempat menunjukkan para penerima berdasarkan lokasi mereka. Bentuk ini alami dalam pembukaan surat bahasa Indonesia dan mempertahankan makna lokatif.
- source_word: ἁγίοις
  choice: yang kudus
  rationale: Kata sifat ini menerangkan saudara-saudara dan menyatakan bahwa mereka dikhususkan bagi Allah. Pilihan ini mempertahankan makna dasarnya tanpa konotasi khusus yang dapat melekat pada sebutan nominal 'orang kudus'.
- source_word: πιστοῖς
  choice: setia
  rationale: πιστός dapat berarti setia ataupun percaya. 'Setia' merupakan sifat yang alami dalam sapaan ini, sedangkan kemungkinan arti 'percaya' dipertahankan dalam catatan kaki.
- source_word: ἀδελφοῖς
  choice: saudara-saudara
  rationale: Padanan ini mengikuti bentuk persaudaraan dalam bahasa Yunani. Dalam konteks sapaan kepada jemaat, cakupannya kemungkinan meliputi laki-laki dan perempuan, sehingga hal itu dijelaskan dalam catatan kaki.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός merupakan gelar yang berarti 'Mesias'. Ungkapan 'dalam Mesias' juga mempertahankan bahasa khas Paulus tentang hubungan atau kesatuan umat dengan Mesias.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: anugerah dan damai sejahtera bagi kalian
  rationale: Terjemahan ini mempertahankan urutan rumusan salam Paulus. 'Kalian' menyatakan bahwa ὑμῖν berbentuk jamak, sedangkan 'damai sejahtera' menyampaikan keluasan makna εἰρήνη secara alami.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: dari Allah, Bapa kita
  rationale: 'Konstruksi genitif ini paling alami dipahami secara aposisional: Allah adalah Bapa kita. Tanda koma memperjelas hubungan itu tanpa menambahkan kata sambung yang tidak terdapat dalam teks Yunani.'
theological_decisions:
- issue: Makna πιστοῖς
  choice: setia
  alternative: percaya
  rationale: Teks tidak memaksa pemisahan tegas antara kesetiaan dan kepercayaan. Teks utama memakai 'setia', sementara catatan kaki mempertahankan kemungkinan makna lainnya.
- issue: Cakupan ἀδελφοῖς
  choice: saudara-saudara
  alternative: saudara-saudari
  rationale: Teks utama mempertahankan bentuk leksikal sumber, tetapi catatan menjelaskan bahwa sapaan Paulus dalam konteks ini kemungkinan ditujukan kepada seluruh jemaat, termasuk perempuan.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός adalah gelar yang berarti 'Yang Diurapi' atau 'Mesias'. 'Mesias' menyampaikan arti gelar tersebut, sedangkan bentuk tradisional 'Kristus' dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. 'Kalian' dipakai untuk menyatakan bentuk jamak orang kedua secara jelas; 'anugerah' dipilih sebagai padanan yang ringkas dan mudah dipahami bagi χάρις.
