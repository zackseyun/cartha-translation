  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: id
  text: di dalam Dia kita memiliki penebusan[a], yaitu pengampunan dosa-dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan”; baik kata yang diterjemahkan “penebusan” maupun kata yang diterjemahkan “pengampunan” dapat mengandung gagasan pelepasan. Di sini Paulus tampaknya memakai “pengampunan dosa-dosa” untuk menjelaskan wujud penebusan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: di dalam Dia
  rationale: Pronomina relatif datif maskulin tunggal merujuk kepada Sang Anak yang dikasihi dalam ayat sebelumnya. “Di dalam Dia” mempertahankan makna personal dan relasional, tanpa mengubahnya menjadi makna instrumental “oleh Dia”.
- source_word: ἔχομεν
  choice: kita memiliki
  rationale: Bentuk kini aktif indikatif menyatakan bahwa manfaat tersebut dimiliki sekarang. “Kita memiliki” terdengar wajar dan sedikit lebih bermartabat daripada “kita mempunyai”.
- source_word: ἀπολύτρωσιν
  choice: penebusan
  rationale: “Penebusan” adalah padanan Indonesia yang mapan bagi ἀπολύτρωσις dan mempertahankan bobot gagasan pembebasan yang diperoleh dengan suatu harga. Kemungkinan “pembebasan” dicatat dalam catatan kaki.
- source_word: ἄφεσιν
  choice: pengampunan
  rationale: Dalam konteks dosa, “pengampunan” merupakan padanan modern yang paling jelas. Frasa ini berdiri sebagai aposisi yang menerangkan penebusan.
- source_word: τῶν ἁμαρτιῶν
  choice: dosa-dosa
  rationale: Genitif jamak menunjuk pada hal yang diampuni. Bentuk ulang “dosa-dosa” mencerminkan bentuk jamak Yunani secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara “penebusan” dan “pengampunan dosa-dosa”
  choice: 'Menerjemahkan frasa nominal kedua secara aposisional dengan “yaitu”: “penebusan, yaitu pengampunan dosa-dosa.”'
  alternative: “penebusan, pengampunan dosa-dosa” tanpa kata penghubung
  rationale: Bahasa Yunani menempatkan τὴν ἄφεσιν τῶν ἁμαρτιῶν sebagai aposisi bagi τὴν ἀπολύτρωσιν. “Yaitu” membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia tanpa memperluas isinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Dia” dipakai untuk memperjelas bahwa rujukannya adalah Sang Anak dalam ayat sebelumnya. Susunan tetap dekat dengan struktur Yunani, sementara “yaitu” membuat aposisi terbaca alami.
