id: COL.1.28
reference: Colossians 1:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: id
  text: Dialah yang kami beritakan. Kami memperingatkan setiap orang dan mengajar setiap orang dengan segala hikmat, supaya kami dapat menghadirkan setiap orang sebagai orang yang dewasa di dalam Kristus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: kami beritakan
  rationale: Menyampaikan tindakan memberitakan secara terbuka dan luas dengan ungkapan Indonesia yang alami serta bermartabat.
- source_word: νουθετοῦντες
  choice: memperingatkan
  rationale: Mencakup unsur menasihati dengan mengingatkan atau mengoreksi; pilihan ini sejalan dengan konteks pengajaran dan tidak mempersempitnya menjadi teguran keras semata.
- source_word: πάντα ἄνθρωπον
  choice: setiap orang
  rationale: Pengulangan tiga kali dipertahankan karena bersifat retoris dan menekankan jangkauan pelayanan kepada tiap-tiap orang.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: dengan segala hikmat
  rationale: Mempertahankan cakupan πάσῃ dan hubungan instrumental atau cara yang wajar dari ἐν dalam konteks ini.
- source_word: παραστήσωμεν
  choice: kami dapat menghadirkan
  rationale: Menjaga gagasan membawa atau mempersembahkan seseorang untuk tampil di hadapan pihak lain, tanpa menentukan secara eksplisit pihak yang dihadapi karena teks tidak menyebutkannya.
- source_word: τέλειον
  choice: dewasa
  rationale: Dalam konteks pertumbuhan orang percaya, kata ini paling alami berarti matang atau dewasa, bukan tanpa dosa atau sempurna secara mutlak.
- source_word: ἐν Χριστῷ
  choice: di dalam Kristus
  rationale: Mempertahankan ungkapan relasional dan partisipatif Paulus serta memakai bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna τέλειον
  choice: dewasa
  alternative: sempurna
  rationale: ‘Dewasa’ menyampaikan kematangan rohani tanpa memasukkan klaim kesempurnaan mutlak yang tidak diwajibkan oleh konteks.
- issue: Objek tersirat dalam παραστήσωμεν
  choice: tidak ditambahkan
  alternative: menghadirkan ... di hadapan Allah
  rationale: Walaupun Allah mungkin dipahami sebagai pihak yang dihadapi, ayat ini sendiri tidak menyatakannya; ambiguitas sumber dipertahankan.
- issue: Terjemahan Χριστός
  choice: Kristus
  alternative: Mesias
  rationale: ‘Kristus’ merupakan padanan baku dan alami dalam konteks surat Paulus berbahasa Indonesia, sekaligus tetap membawa gelar yang berasal dari ‘Yang Diurapi’.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur dipecah menjadi dua kalimat agar mudah dibaca, sementara pengulangan ‘setiap orang’ dan alur tujuan teks Yunani tetap dipertahankan.
