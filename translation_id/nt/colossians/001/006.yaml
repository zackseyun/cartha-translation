  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: id
  text: yang telah sampai kepadamu[a]. Sebagaimana di seluruh dunia[b], Injil itu terus berbuah dan bertumbuh, demikian juga di antara kamu[c], sejak hari kamu mendengarnya dan mengenal anugerah Allah dalam kebenaran[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang hadir di tengah-tengah kamu” atau “yang telah datang kepadamu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di seluruh dunia.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di dalam kamu”; bentuk Yunani dapat menunjuk kepada jemaat sebagai komunitas atau kepada karya Injil di dalam diri mereka.
    reason: lexical_alternative
  - marker: d
    text: Atau “dengan benar,” “dengan sungguh-sungguh,” atau “di dalam kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: yang telah sampai kepadamu
  rationale: Partisip berartikel ini melanjutkan keterangan tentang Injil pada ayat 5. Ungkapan ini mencakup gagasan kedatangan yang menghasilkan kehadiran; 'telah sampai kepadamu' alami dalam bahasa Indonesia dan tetap menggambarkan gerak Injil menuju jemaat.
- source_word: καθὼς καὶ ... καθὼς καὶ
  choice: Sebagaimana ... demikian juga
  rationale: Pasangan ini mengungkapkan struktur perbandingan Yunani secara alami dan jelas dalam bahasa Indonesia, sambil mempertahankan hubungan antara karya Injil di dunia dan di tengah jemaat Kolose.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: di seluruh dunia
  rationale: κόσμος di sini menunjuk secara luas dan retoris kepada dunia yang dihuni. Terjemahan ini mempertahankan cakupan universal ungkapan Yunani tanpa menambahkan batas geografis.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: Injil itu terus berbuah dan bertumbuh
  rationale: Bentuk perifrastis dengan partisip kini menekankan tindakan yang berlangsung. 'Terus' menyampaikan aspek berkelanjutan, sedangkan 'berbuah dan bertumbuh' mempertahankan metafora pertanian. Subjek 'Injil itu' dinyatakan kembali agar rujukannya jelas dalam bahasa Indonesia.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: demikian juga di antara kamu
  rationale: ἐν ὑμῖν dapat menunjuk kepada karya Injil di tengah komunitas maupun di dalam diri mereka. 'Di antara kamu' paling alami untuk sapaan jamak-komunal, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: sejak hari
  rationale: Ungkapan temporal ini menandai awal karya Injil di antara mereka; 'sejak hari' merupakan bentuk Indonesia yang ringkas dan alami.
- source_word: ἠκούσατε
  choice: kamu mendengarnya
  rationale: Aoristus menyatakan peristiwa mendengar tanpa kata eksplisit yang berarti 'pertama kali'. Akhiran '-nya' secara alami merujuk kepada Injil/anugerah yang diberitakan.
- source_word: ἐπέγνωτε
  choice: sungguh-sungguh mengenal
  rationale: ἐπιγινώσκω dapat menyiratkan pengenalan yang nyata atau mendalam. 'Sungguh-sungguh mengenal' menyampaikan pengenalan sejati tanpa mengklaim pengetahuan sempurna.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: anugerah Allah
  rationale: '''Anugerah Allah'' adalah ungkapan Indonesia yang wajar dan bermartabat untuk frasa Paulus ini serta mempertahankan bobot teologis χάρις.'
- source_word: ἐν ἀληθείᾳ
  choice: dalam kebenaran
  rationale: Terjemahan formal ini mempertahankan kemungkinan makna cara ('dengan sungguh-sungguh/benar') maupun ranah atau isi ('dalam kebenaran'), tanpa menutup ambiguitas Yunani.
theological_decisions:
- issue: Cakupan 'seluruh dunia'
  choice: Mempertahankan bahasa universal sebagai gambaran retoris yang luas tentang penyebaran Injil
  alternative: Pernyataan universal secara harfiah bahwa setiap orang dan setiap wilayah di bumi telah dijangkau
  rationale: Teks Yunani memakai cakupan universal untuk menekankan perluasan Injil. Terjemahan mempertahankan ungkapannya tanpa menambahkan penafsiran geografis yang kaku.
- issue: Nuansa ἐν ἀληθείᾳ
  choice: dalam kebenaran
  alternative: dengan benar; sungguh-sungguh; dalam Sang Kebenaran
  rationale: Frasa Yunani dapat menerangkan cara pengenalan atau ranah/isi kebenaran. Terjemahan utama sengaja mempertahankan ketegangan ini.
- issue: Lokasi karya Injil dalam ἐν ὑμῖν
  choice: di antara kamu, dengan alternatif 'di dalam kamu' dalam catatan kaki
  alternative: Hanya karya batin dalam masing-masing individu
  rationale: Sapaan jamak memungkinkan pengertian komunal maupun internal. Terjemahan utama mengutamakan konteks jemaat, tetapi catatan kaki mempertahankan kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat diatur ulang secara ringan agar subjek 'Injil itu' jelas dan perbandingan ganda Yunani terbaca alami. Istilah 'anugerah' dipilih sebagai padanan lazim χάρις; ambiguitas penting pada ἐν ὑμῖν dan ἐν ἀληθείᾳ dipertahankan melalui teks utama dan catatan kaki.
