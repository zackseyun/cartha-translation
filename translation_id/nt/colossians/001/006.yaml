  terminology: “Injil,” “anugerah Allah,” dan “kebenaran” sesuai dengan register Alkitab bahasa Indonesia modern. Catatan untuk “seluruh dunia” sebaiknya memberikan alternatif leksikal, bukan penjelasan yang membatasi pernyataan retoris teks.
