id: COL.1.20
reference: Colossians 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: id
  text: dan melalui Dia[a] mendamaikan segala sesuatu[b] dengan diri-Nya, setelah mengadakan perdamaian melalui darah salib-Nya—melalui Dia[d]—baik yang ada di bumi maupun yang ada di surga[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh Dia” untuk kedua kemunculan “melalui Dia”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “segala sesuatu” dibiarkan luas, sesuai dengan bahasa Yunani dan frasa berikutnya, “baik yang ada di bumi maupun yang ada di surga”. Ayat ini sendiri tidak menjelaskan bagaimana pendamaian ini berkaitan dengan keselamatan akhir.
    reason: alternative_reading
  - marker: c
    text: Dalam bahasa Yunani, kata “surga” berbentuk jamak.
    reason: lexical_alternative
  - marker: d
    text: Beberapa naskah tidak memuat kemunculan kedua frasa “melalui Dia”.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: διά dengan genitif menyatakan sarana atau perantaraan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada peran pengantaraan Sang Anak.
- source_word: ἀποκαταλλάξαι
  choice: mendamaikan
  rationale: Kata ini menunjuk pada pemulihan hubungan. Terjemahan ini mempertahankan makna dasarnya tanpa menambahkan gagasan ‘sepenuhnya’ yang tidak harus dinyatakan oleh bentuk majemuk Yunaninya.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan netral jamak ini bersifat luas dan selaras dengan cakupan kosmis pada frasa berikutnya, tanpa mempersempitnya menjadi hanya manusia.
- source_word: εἰς αὐτόν
  choice: dengan diri-Nya
  rationale: Dalam ungkapan Indonesia ‘mendamaikan ... dengan’, pilihan ini menyampaikan arah pemulihan hubungan kepada diri-Nya sendiri secara alami. Rujukannya paling mungkin kepada Allah berdasarkan kelanjutan sintaksis dari ayat 19.
- source_word: εἰρηνοποιήσας
  choice: setelah mengadakan perdamaian
  rationale: Partisip aoris diterjemahkan dengan konstruksi yang menunjukkan tindakan yang mendasari pendamaian tersebut, sambil tetap mempertahankan citra konkret tentang terciptanya damai.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: melalui darah-Nya di salib
  rationale: Terjemahan ini mempertahankan unsur ‘darah’ dan ‘salib’ secara konkret, tetapi menyusun hubungan genitif Yunani dalam bentuk Indonesia yang lebih alami daripada ‘darah salib-Nya’.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: melalui Dia
  rationale: Frasa berulang dipertahankan sebagai penegasan sisipan dan diapit tanda pisah; keberadaannya dalam tradisi naskah diberi catatan tekstual.
- source_word: εἴτε ... εἴτε
  choice: baik ... maupun
  rationale: Pasangan korelatif ini merupakan padanan Indonesia yang alami dan mempertahankan pasangan cakupan menyeluruh dalam bahasa Yunani.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: yang ada di bumi
  rationale: Pilihan ini mempertahankan kontras kosmis antara bumi dan surga, serta mencakup segala yang berada di ranah tersebut.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: yang ada di surga
  rationale: Bahasa Indonesia lazim memakai ‘surga’ tanpa penandaan jumlah dalam ungkapan ini. Bentuk jamak bahasa Yunani dijelaskan dalam catatan agar bukti sumber tetap terlihat tanpa menghasilkan bentuk Indonesia yang kaku.
theological_decisions:
- issue: Cakupan pendamaian dalam τὰ πάντα
  choice: Diterjemahkan secara luas sebagai ‘segala sesuatu’ tanpa membatasi rujukannya atau menyamakannya secara eksplisit dengan keselamatan akhir semua makhluk.
  alternative: ‘semua orang’ atau ‘seluruh alam semesta diselamatkan’
  rationale: Teks mengungkapkan pendamaian kosmis dan langsung menjabarkannya sebagai yang ada di bumi dan di surga. Terjemahan harus mempertahankan keluasan serta ketegangan teologis itu tanpa menentukan lebih jauh bagaimana pendamaian tersebut berkaitan dengan keselamatan akhir.
- issue: Rujukan εἰς αὐτόν
  choice: Dipahami sebagai Allah yang melalui Sang Anak mendamaikan segala sesuatu dengan diri-Nya.
  alternative: Sang Mesias mendamaikan segala sesuatu dengan diri-Nya sendiri.
  rationale: Struktur kalimat berlanjut dari ayat 19, yang paling wajar menempatkan Allah sebagai pelaku yang tersirat. Namun, nama ‘Allah’ tidak disisipkan ke dalam teks ayat ini sehingga hubungan sintaksis dengan konteks tetap dapat diperiksa pembaca.
- issue: Makna ‘darah ... salib’
  choice: Bahasa konkret tentang darah dan salib dipertahankan.
  alternative: ‘kematian-Nya di salib’
  rationale: Teks Yunani secara eksplisit menyebut darah dan salib. Mempertahankan keduanya menjaga daya korban dan historis ungkapan tersebut tanpa memasukkan teori penebusan tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat mempertahankan bentuk lanjutan dari konteks sebelumnya. Tanda pisah menandai pengulangan penegas ‘melalui Dia’. ‘Surga’ dipakai dalam bentuk lazim bahasa Indonesia, sedangkan jumlah jamak Yunani dicatat dalam catatan kaki.
