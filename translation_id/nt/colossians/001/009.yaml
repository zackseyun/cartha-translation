id: COL.1.9
reference: Colossians 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: id
  text: Karena itu, sejak hari kami mendengarnya, kami pun tidak berhenti berdoa bagi kamu dan memohon agar kamu dipenuhi dengan pengetahuan[a] tentang kehendak-Nya, disertai segala hikmat dan pengertian rohani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengetahuan penuh” atau “pengenalan yang mendalam”. Kata Yunani ini dapat mengandung arti pengetahuan yang lebih penuh atau mendalam.
    reason: lexical_alternative
  - marker: b
    text: “Rohani” dapat berarti bersifat rohani atau diberikan oleh Roh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Frasa ini menyatakan alasan yang mengacu pada kabar tentang iman dan kasih jemaat Kolose dalam ayat-ayat sebelumnya; “Karena itu” alami dan mempertahankan daya kausal-inferensialnya.
- source_word: καὶ ἡμεῖς
  choice: kami pun
  rationale: καί menekankan bahwa Paulus dan rekan-rekannya turut memberikan tanggapan; “kami pun” mempertahankan penekanan inklusif itu secara alami.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: sejak hari kami mendengarnya
  rationale: Frasa ini menandai awal berlangsungnya doa mereka. Akhiran “-nya” secara wajar merujuk pada kabar yang baru disebutkan dalam konteks.
- source_word: οὐ παυόμεθα
  choice: tidak berhenti
  rationale: Bentuk kini menyatakan tindakan yang terus berlangsung; “tidak berhenti” jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ὑπὲρ ὑμῶν
  choice: bagi kamu
  rationale: ὑπέρ menunjukkan kepentingan atau manfaat pihak yang didoakan. “Bagi kamu” sesuai dengan ragam bahasa doa dan tidak berlebihan.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: berdoa bagi kamu dan memohon
  rationale: 'Kedua partisip dipertahankan: προσεύχομαι menyatakan doa secara umum, sedangkan αἰτέω memperjelas tindakan memohon.'
- source_word: ἵνα πληρωθῆτε
  choice: agar kamu dipenuhi
  rationale: Bentuk pasif mempertahankan Allah sebagai pelaku yang tersirat tanpa menyebutkan-Nya secara eksplisit.
- source_word: τὴν ἐπίγνωσιν
  choice: dengan pengetahuan
  rationale: ἐπίγνωσις dapat menyiratkan pengetahuan yang penuh atau mendalam, tetapi “pengetahuan” menghindari penegasan berlebih; nuansa yang lebih kuat dicatat dalam catatan kaki.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: tentang kehendak-Nya
  rationale: Genitif ini paling alami dinyatakan dengan “tentang” setelah “pengetahuan”; “kehendak-Nya” mempertahankan rujukan kepada Allah.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: disertai segala hikmat dan pengertian rohani
  rationale: ἐν dapat menunjukkan lingkup atau keadaan yang menyertai. “Disertai” menghasilkan bahasa Indonesia yang alami dan mempertahankan hubungan pengetahuan itu dengan hikmat serta pengertian. “Rohani” secara wajar dapat menerangkan keduanya.
- source_word: σοφίᾳ
  choice: hikmat
  rationale: “Hikmat” adalah padanan baku dan bermartabat bagi σοφία dalam konteks Alkitab.
- source_word: συνέσει
  choice: pengertian
  rationale: σύνεσις menunjuk pada kemampuan memahami atau menghubungkan berbagai hal; “pengertian” jelas dan berpasangan alami dengan “hikmat”.
theological_decisions:
- issue: Kekuatan makna ἐπίγνωσις dalam doa Paulus
  choice: pengetahuan
  alternative: pengetahuan penuh; pengenalan yang mendalam
  rationale: Kata ini dapat memiliki nuansa pengetahuan yang lebih penuh atau mendalam, tetapi konteks tidak mengharuskan intensifikasi itu dimasukkan secara eksplisit ke dalam teks utama. Ambiguitas leksikal dipertahankan melalui catatan kaki.
- issue: Rujukan πνευματικῇ
  choice: rohani, menerangkan hikmat dan pengertian tanpa secara eksplisit menyebut Roh Kudus
  alternative: hikmat dan pengertian yang diberikan oleh Roh
  rationale: Adjektiva ini dapat menunjuk pada sifat rohani atau pada asalnya dari Roh Kudus. Teks Yunani tetap ringkas dan tidak menjelaskan hubungan itu secara eksplisit, sehingga terjemahan utama mempertahankan keterbukaannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat mengalir bagi pembaca umum, sementara bentuk pasif dan ambiguitas pada “pengetahuan” serta “rohani” dipertahankan. Penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskan.
