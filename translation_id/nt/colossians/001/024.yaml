  - severity: low
    issue: Catatan tentang Mesias belum memiliki jangkar tersendiri
    rationale: Jejak audit Inggris juga mencatat keputusan leksikal untuk menerjemahkan Χριστός sebagai 'Messiah'. Catatan [b] setelah 'jemaat' dapat menjelaskan pilihan ini tanpa membebani catatan frasa sulit.
