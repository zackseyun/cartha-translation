id: COL.1.24
reference: Colossians 1:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: id
  text: Sekarang aku bersukacita dalam penderitaanku demi kamu, dan dalam dagingku aku melengkapi apa yang masih kurang dari penderitaan Sang Mesias[a] demi tubuh-Nya, yaitu jemaat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku memenuhi apa yang kurang dari penderitaan Sang Mesias.” Kata Yunani ini juga dapat diterjemahkan “aku melengkapi apa yang masih tersisa.” Frasa ini dipahami dengan beragam cara; dalam konteksnya, Paulus menghubungkan penderitaannya dengan tubuh Sang Mesias, yaitu jemaat.
    reason: Menjelaskan alternatif leksikal dan mempertahankan ambiguitas frasa yang diperdebatkan tanpa memasukkan kesimpulan teologis ke dalam teks utama.
  - marker: b
    text: Yunani “Kristus”; diterjemahkan “Mesias” karena Χριστός berfungsi sebagai gelar.
    reason: Menjelaskan pilihan padanan titular untuk Χριστός.
lexical_decisions:
- source_word: Νῦν
  choice: Sekarang
  rationale: Penanda waktu yang memperkenalkan keadaan dan sikap Paulus saat ini; ringkas dan alami dalam bahasa Indonesia.
- source_word: χαίρω
  choice: aku bersukacita
  rationale: Menjaga bentuk verbal kini dan menyatakan sikap sukacita Paulus tanpa terlalu menekankan aspek progresif.
- source_word: ἐν τοῖς παθήμασιν
  choice: dalam penderitaanku
  rationale: Kepunyaan orang pertama tersirat oleh konteks dan ditegaskan kemudian oleh 'dagingku'; bentuk ini alami dalam bahasa Indonesia.
- source_word: ὑπὲρ ὑμῶν
  choice: demi kamu
  rationale: 'Menyampaikan makna benefaktif: penderitaan Paulus berlangsung untuk kepentingan para penerima surat.'
- source_word: ἀνταναπληρῶ
  choice: aku menggenapi
  rationale: Mengungkapkan tindakan memenuhi atau melengkapi apa yang tersisa, sambil mempertahankan ketegangan ungkapan Yunani.
- source_word: τὰ ὑστερήματα
  choice: apa yang masih kurang
  rationale: Padanan idiomatis bagi bentuk jamak netral yang menunjuk kepada sesuatu yang belum terpenuhi atau masih tersisa.
- source_word: τῶν θλίψεων
  choice: dalam penderitaan
  rationale: Kata 'penderitaan' paling mudah dipahami dalam konteks ini; konstruksi Indonesia 'yang masih kurang dalam' menyampaikan hubungan genitif tanpa menyiratkan bahwa penderitaan itu sendiri cacat.
- source_word: τοῦ Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Sang Mesias' mempertahankan daya titular dan konteks mesianiknya.
- source_word: ἐν τῇ σαρκί μου
  choice: dalam dagingku
  rationale: Mempertahankan metafora σάρξ dan menunjuk pada keberadaan jasmani Paulus, bukan 'tabiat berdosa'.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: demi tubuh-Nya
  rationale: Menjaga makna benefaktif ὑπέρ serta metafora tubuh yang langsung dijelaskan oleh klausa berikutnya.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: yaitu jemaat
  rationale: Klausa ini mengidentifikasi tubuh Sang Mesias sebagai jemaat; 'yaitu' alami sebagai penjelasan identitas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'apa yang masih kurang dalam penderitaan Sang Mesias'
  choice: Teks utama mempertahankan ungkapan kuat bahwa Paulus menggenapi dalam dagingnya apa yang masih kurang, lalu catatan menjelaskan bahwa ini menunjuk pada keikutsertaannya dalam penderitaan yang berkaitan dengan Sang Mesias, misi-Nya, dan jemaat-Nya.
  alternative: Penderitaan Paulus melengkapi kekurangan dalam karya pendamaian Sang Mesias; atau ungkapan ini semata-mata menunjuk pada kuota tetap kesusahan mesianik akhir zaman.
  rationale: θλίψεις lebih menunjuk pada kesusahan atau penderitaan daripada istilah yang secara langsung menyatakan pendamaian, dan frasa 'demi tubuh-Nya, yaitu jemaat' menempatkan penderitaan Paulus dalam konteks pelayanan dan kehidupan umat Mesias. Ketegangan teks dipertahankan tanpa menyatakan bahwa kematian pendamaian Sang Mesias tidak memadai.
- issue: Penerjemahan Χριστοῦ
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap memiliki daya sebagai gelar, sehingga 'Sang Mesias' mempertahankan latar mesianik Yahudinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang pertama tunggal 'aku' mengikuti suara surat pribadi Paulus; kapitalisasi '-Nya' dipakai untuk rujukan kepada Sang Mesias. Metafora 'daging' dan 'tubuh' dipertahankan. Penanda catatan kaki [a] ditempatkan sesudah seluruh pernyataan yang dijelaskannya.
