  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: id
  text: karena pengharapan yang tersimpan bagi kamu di surga[a]. Tentang pengharapan itu sudah lebih dahulu kamu dengar[b] dalam firman kebenaran[c], yaitu Injil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bentuk Yunani berbunyi “di surga-surga”; bahasa Indonesia biasanya memakai bentuk tunggal “di surga”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang telah kamu dengar sebelumnya” atau “yang sebelumnya telah kamu dengar tentangnya”.
    reason: lexical_alternative
  - marker: c
    text: “Firman kebenaran” dapat juga diterjemahkan “pesan kebenaran”; “Injil” menjelaskan firman atau pesan yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: karena pengharapan
  rationale: διά dengan akusatif menyatakan sebab atau dasar dan melanjutkan alasan yang disebut dalam konteks sebelumnya. ‘Pengharapan’ mempertahankan istilah Paulus tanpa menyempitkannya menjadi sikap optimistis belaka.
- source_word: ἀποκειμένην ὑμῖν
  choice: yang tersimpan bagi kamu
  rationale: ἀπόκειμαι menggambarkan sesuatu yang disimpan atau disediakan untuk kelak; ‘bagi kamu’ menyampaikan datif keuntungan. Bentuk ‘kamu’ dapat merujuk kepada para pembaca secara jamak dalam bahasa Indonesia.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: Bahasa Indonesia baku paling alami memakai bentuk tunggal ‘surga’. Bentuk Yunani yang secara gramatikal jamak dicatat dalam catatan kaki agar bentuk sumber tetap transparan tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: ἣν προηκούσατε
  choice: Pengharapan itu telah kamu dengar sebelumnya
  rationale: ἣν feminin tunggal kembali kepada ἐλπίδα, sehingga antesedennya dinyatakan ulang demi kejelasan alami dalam bahasa Indonesia. προακούω menyatakan bahwa mereka sudah mendengarnya pada waktu sebelumnya.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: dalam firman kebenaran
  rationale: λόγος dapat berarti ‘firman’, ‘perkataan’, atau ‘pesan’. ‘Firman kebenaran’ dekat dengan bentuk Yunani dan tetap dapat dipahami, sementara alternatif yang lebih komunikatif dicatat dalam catatan kaki.
- source_word: τοῦ εὐαγγελίου
  choice: yaitu Injil
  rationale: Genitif ini paling wajar dipahami sebagai aposisi yang mengidentifikasi ‘firman kebenaran’ sebagai Injil. ‘Yaitu’ menjadikan hubungan itu jelas dalam bahasa Indonesia tanpa mengubah isinya.
theological_decisions:
- issue: Acuan klausa relatif ἣν προηκούσατε
  choice: Klausa itu mengacu langsung kepada ‘pengharapan’.
  alternative: Klausa itu dipahami secara lebih luas sebagai mengacu kepada seluruh berita Injil.
  rationale: Kata ganti relatif feminin tunggal ἣν bersesuaian langsung dengan ἐλπίδα. Pengulangan ‘Pengharapan itu’ mempertahankan hubungan sintaksis tersebut.
- issue: Bentuk jamak οὐρανοῖς
  choice: Memakai ‘surga’ dalam teks utama dan mencatat bentuk jamak Yunani dalam catatan kaki.
  alternative: Memakai bentuk harfiah ‘surga-surga’ dalam teks utama.
  rationale: Bentuk jamak harfiah terdengar tidak alami dan berpotensi menyiratkan gagasan yang tidak harus dimaksudkan oleh bentuk Yunani. Catatan kaki mempertahankan transparansi sumber.
- issue: Hubungan τοῦ εὐαγγελίου dengan ‘firman kebenaran’
  choice: 'Memahaminya sebagai aposisi: ‘yaitu Injil’.'
  alternative: Memahaminya sebagai genitif atributif, misalnya ‘firman kebenaran Injil’.
  rationale: 'Aposisi menghasilkan sintaksis paling masuk akal: Injil mengidentifikasi firman atau pesan kebenaran tersebut, tanpa menambahkan pembedaan teologis.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat Yunani dibagi menjadi dua kalimat Indonesia agar rujukan kepada ‘pengharapan’ jelas dan alami; titik ini tidak dimaksudkan untuk memutus hubungan logis ayat dengan konteks sebelumnya. Istilah ‘Injil’ dipertahankan karena luas dikenal.
