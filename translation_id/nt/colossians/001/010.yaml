  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: id
  text: supaya kalian hidup dengan cara yang layak bagi Tuhan dan menyenangkan-Nya dalam segala hal,[a] sambil menghasilkan buah dalam setiap perbuatan baik dan bertumbuh dalam pengenalan akan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk segala yang menyenangkan” atau “untuk segala keberkenanan.” Bahasa Yunani tidak menyebutkan objeknya secara eksplisit; dari konteks, yang dimaksud ialah menyenangkan Tuhan dalam segala hal.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bertumbuh melalui pengenalan akan Allah.” Kata yang diterjemahkan “pengenalan” juga dapat menyiratkan pengenalan yang lebih penuh atau mendalam.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: hidup
  rationale: Secara harfiah berarti “berjalan”, tetapi di sini merupakan metafora Paulus bagi cara hidup. “Hidup” menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: ἀξίως τοῦ κυρίου
  choice: dengan cara yang layak bagi Tuhan
  rationale: Ungkapan ini menyatakan cara hidup yang sesuai atau pantas dalam hubungannya dengan Tuhan, tanpa menyiratkan bahwa manusia memperoleh kelayakan melalui jasanya.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: dan menyenangkan-Nya dalam segala hal
  rationale: Frasa Yunani secara harfiah menunjuk kepada segala hal yang menyenangkan. Objeknya tidak disebutkan, tetapi konteks paling dekat menyiratkan Tuhan; catatan kaki mempertahankan fakta bahwa objek itu tersirat.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: sambil menghasilkan buah dalam setiap perbuatan baik
  rationale: “Menghasilkan buah” mempertahankan metafora καρποφορέω dan kaitannya dengan gambaran pertumbuhan, sedangkan “setiap perbuatan baik” mempertahankan daya distributif παντί.
- source_word: αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: bertumbuh dalam pengenalan akan Allah
  rationale: Dativus dipahami sebagai ranah atau segi pertumbuhan. “Pengenalan” cukup alami dan relasional dalam bahasa Indonesia, tanpa harus menetapkan arti teknis “pengetahuan penuh” dalam teks utama.
theological_decisions:
- issue: Objek tersirat dari ἀρεσκείαν
  choice: Mengeksplisitkan rujukan kontekstual dengan “menyenangkan-Nya”, disertai catatan bahwa objek tersebut tidak tertulis dalam bahasa Yunani.
  alternative: “menuju segala hal yang berkenan” atau bentuk lain yang membiarkan objek tetap tersirat
  rationale: Terjemahan harfiah yang mempertahankan struktur tanpa objek akan terasa tidak alami dan kabur dalam bahasa Indonesia. Konteks langsung menunjuk kepada Tuhan, tetapi catatan kaki menjaga transparansi terhadap bentuk sumber.
- issue: Nuansa ἐπίγνωσις
  choice: “pengenalan” dalam teks utama
  alternative: “pengenalan yang penuh” atau “pengetahuan yang mendalam”
  rationale: Kata ini dapat menyiratkan pengenalan yang lebih penuh atau mendalam, tetapi nuansa itu tidak perlu dipaksakan sebagai istilah teknis. Alternatif dicatat dalam catatan kaki.
- issue: Fungsi dativus τῇ ἐπιγνώσει
  choice: 'ranah/segi: “dalam pengenalan akan Allah”'
  alternative: 'sarana: “melalui pengenalan akan Allah”'
  rationale: Kedua pemahaman dimungkinkan secara gramatikal. Bacaan ranah cocok dengan verba “bertumbuh” dan mempertahankan konstruksi yang paling langsung, sementara kemungkinan instrumental dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak “kalian” dipakai karena subjek infinitif berlanjut dari doa Paulus bagi para pembaca dalam ayat sebelumnya. Struktur partisipial diterjemahkan dengan “sambil” agar hubungan tindakan tetap jelas dan alami.
