id: COL.1.13
reference: Colossians 1:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: id
  text: Ia telah menyelamatkan kita dari kuasa kegelapan dan memindahkan kita ke dalam kerajaan Anak yang dikasihi-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Anak dari kasih-Nya”; atau “Anak-Nya yang terkasih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: menyelamatkan
  rationale: Kata ῥύομαι menyatakan tindakan membebaskan atau menyelamatkan dari bahaya maupun kuasa yang memusuhi. “Menyelamatkan” alami dalam bahasa Indonesia dan menegaskan campur tangan yang menentukan.
- source_word: ἐξουσίας
  choice: kuasa
  rationale: ἐξουσία dapat berarti wewenang, kuasa, atau wilayah kekuasaan. Dalam pasangan dengan “kerajaan,” “kuasa” secara wajar menyampaikan kekuatan pemerintahan kegelapan tanpa mempersempitnya menjadi lokasi semata.
- source_word: σκότους
  choice: kegelapan
  rationale: Terjemahan langsung yang mempertahankan konotasi moral dan rohani dalam konteks Paulus tanpa menjabarkannya di dalam teks.
- source_word: μετέστησεν
  choice: memindahkan
  rationale: μεθίστημι berarti memindahkan dari satu tempat, keadaan, atau wilayah kekuasaan ke yang lain. “Memindahkan” jelas dan cocok dengan gambaran peralihan ke dalam kerajaan.
- source_word: βασιλείαν
  choice: kerajaan
  rationale: βασιλεία dapat menunjuk pada pemerintahan atau kerajaan. Dengan εἰς dan gambaran pemindahan, “kerajaan” paling alami sambil tetap menyiratkan pemerintahan sang Anak.
- source_word: υἱοῦ
  choice: Anak
  rationale: υἱός secara langsung berarti “anak.” Huruf kapital menandai bahwa yang dimaksud dalam konteks Kristologis ini ialah Sang Anak.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Anak yang dikasihi-Nya
  rationale: Secara harfiah frasa genitif ini berbunyi “Anak dari kasih-Nya,” tetapi dalam bahasa Indonesia bentuk itu mudah terdengar seolah-olah Anak berasal dari kasih. “Anak yang dikasihi-Nya” menyampaikan relasi genitif tersebut secara alami, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan frasa genitif τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Anak yang dikasihi-Nya
  alternative: Anak dari kasih-Nya; Anak-Nya yang terkasih
  rationale: Frasa itu menyatakan kasih khusus Allah kepada Sang Anak. Terjemahan utama mempertahankan arah relasinya tanpa memakai susunan Indonesia yang berpotensi disalahpahami; catatan kaki menjaga bentuk harfiah dan alternatif idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Ia” merujuk kepada Bapa dalam konteks sebelumnya; akhiran “-Nya” memakai kapitalisasi konvensional untuk rujukan ilahi. Struktur paralel “dari ... ke dalam ...” mempertahankan gerak antara dua wilayah kekuasaan.
