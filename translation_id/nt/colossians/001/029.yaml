  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: id
  text: Untuk itulah aku juga bekerja keras[a] dan berjuang[b] sesuai dengan karya-Nya[c] yang bekerja dengan kuasa di dalam diriku.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk tujuan inilah” atau “Demi hal inilah”.
    reason: lexical_alternative
  - marker: b
    text: Atau “bergumul” untuk “berjuang”.
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani berbunyi “karya-Nya” tanpa menyebut secara eksplisit apakah “-Nya” mengacu kepada Allah atau Kristus.
    reason: alternative_reading
  - marker: d
    text: Atau “yang bekerja di dalam diriku dengan kuasa” atau “yang bekerja dalam diriku dalam kuasa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Untuk itulah
  rationale: Frasa ini menunjuk kembali pada tujuan pelayanan dalam ayat sebelumnya. 'Untuk itulah' alami dalam bahasa Indonesia dan mempertahankan daya rujuk sekaligus nuansa tujuan.
- source_word: καὶ
  choice: juga
  rationale: Kata ini menghubungkan jerih payah Paulus dengan pernyataan sebelumnya dan mempertahankan makna penambahan.
- source_word: κοπιῶ
  choice: bekerja keras
  rationale: κοπιάω menyatakan kerja berat yang menguras tenaga. 'Bekerja keras' jelas dan alami bagi pembaca Indonesia modern.
- source_word: ἀγωνιζόμενος
  choice: berjuang
  rationale: Partisip ini menggambarkan pengerahan tenaga seperti dalam suatu pertandingan atau pergumulan; 'berjuang' mempertahankan intensitas tersebut tanpa menjadi teknis.
- source_word: κατὰ
  choice: sesuai dengan
  rationale: κατά dengan akusatif menyatakan ukuran atau kesesuaian. Terjemahan ini tidak mereduksinya menjadi sekadar alat atau sebab.
- source_word: τὴν ἐνέργειαν
  choice: karya
  rationale: ἐνέργεια menunjuk pada daya atau kegiatan yang bekerja secara efektif. 'Karya' terdengar wajar dalam konteks ini, sedangkan 'energi' membawa konotasi ilmiah modern dan 'pekerjaan' akan terasa janggal bersama verba berikutnya.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina tetap dipertahankan tanpa menyebut secara eksplisit apakah acuannya Allah atau Kristus, sebagaimana teks Yunani.
- source_word: τὴν ἐνεργουμένην
  choice: yang bekerja
  rationale: Partisip kini ini menyatakan kegiatan yang sedang berlangsung. 'Yang bekerja' juga mempertahankan hubungan akar kata dengan ἐνέργεια sejauh dimungkinkan secara alami.
- source_word: ἐν ἐμοὶ
  choice: di dalam diriku
  rationale: Terjemahan ini mempertahankan arti paling langsung dari ἐν dan tidak mengubahnya menjadi 'melalui aku', sehingga ketegangan antara pemberdayaan batin dan pelayanan lahiriah tetap terbuka.
- source_word: ἐν δυνάμει
  choice: dengan penuh kuasa
  rationale: Frasa ini menyatakan cara atau lingkup bekerjanya karya tersebut. 'Dengan penuh kuasa' alami dalam bahasa Indonesia dan tetap mempertahankan unsur nomina δύναμις.
theological_decisions:
- issue: Acuan αὐτοῦ ('-Nya')
  choice: Mempertahankan pronomina '-Nya' tanpa menyebut acuan secara eksplisit.
  alternative: karya Allah; karya Kristus
  rationale: Ayat ini sendiri tidak menamai antesedennya secara eksplisit. Mempertahankan pronomina menghindari penyelesaian ketegangan teologis yang dibiarkan terbuka oleh teks Yunani.
- issue: Hubungan jerih payah Paulus dengan daya ilahi
  choice: '''berjuang sesuai dengan karya-Nya'''
  alternative: '''berjuang oleh karya-Nya'''
  rationale: 'Terjemahan ''sesuai dengan'' menjaga fungsi κατά sebagai ukuran atau kesesuaian: perjuangan Paulus nyata, tetapi berlangsung sepadan dengan karya ilahi yang bekerja di dalam dirinya, tanpa menghapus salah satu sisi.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Bekerja keras' dan 'berjuang' menyampaikan intensitas kedua verba tanpa bahasa arkais. Kapital pada '-Nya' mengikuti konvensi ejaan Indonesia untuk pronomina ilahi, sementara identitas acuannya tetap tidak diperjelas.
