  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: id
  text: Aku menjadi pelayan jemaat itu sesuai dengan tugas yang Allah percayakan kepadaku untuk kamu[a], yaitu untuk menggenapi firman Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “sesuai dengan tanggung jawab penatalayanan dari Allah yang diberikan kepadaku untuk kamu.”
    reason: alternative_rendering
  - marker: b
    text: Atau, “untuk memberitakan firman Allah sepenuhnya”; atau, “untuk melengkapi firman Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: jemaat itu
  rationale: Kata ganti relatif feminin ini merujuk kepada ἐκκλησία (jemaat) pada ayat sebelumnya. Penyebutan ulang nomina membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: Aku telah menjadi pelayan
  rationale: Menunjukkan bahwa Paulus memasuki peran pelayanan tersebut. 'Pelayan' menyampaikan fungsi διάκονος tanpa memasukkan jabatan gerejawi yang berkembang kemudian.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: sesuai dengan tugas yang Allah percayakan kepadaku
  rationale: οἰκονομία menunjuk pada tanggung jawab atau amanat yang dipercayakan. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai sumber pemberian tugas, tanpa memakai istilah teknis yang kurang lazim.
- source_word: εἰς ὑμᾶς
  choice: demi kamu
  rationale: Mengungkapkan arah sekaligus manfaat tugas Paulus bagi para pembaca.
- source_word: πληρῶσαι
  choice: untuk menggenapi
  rationale: Mempertahankan keluasan makna πληρόω dan kaitannya dengan gagasan kepenuhan, tanpa membatasi maksudnya hanya pada pemberitaan atau penyelesaian.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Padanan Indonesia yang mapan untuk pesan atau penyataan Allah serta mempertahankan gema antarteks Alkitab.
theological_decisions:
- issue: Makna πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: menggenapi firman Allah
  alternative: memberitakan firman Allah sepenuhnya; melengkapi firman Allah
  rationale: Ungkapan Yunani dapat menekankan pelaksanaan, penyampaian sepenuhnya, atau penyelesaian firman Allah. Teks utama mempertahankan ketegangan makna itu, sedangkan kemungkinan yang lebih khusus dicatat dalam catatan kaki.
- issue: Nuansa οἰκονομία τοῦ θεοῦ
  choice: tugas yang Allah percayakan kepadaku
  alternative: tanggung jawab penatalayanan dari Allah yang diberikan kepadaku
  rationale: Bentuk utama menyampaikan amanat ilahi secara alami, sementara alternatif mempertahankan metafora pengelolaan secara lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' mengikuti suara pribadi Paulus; 'kamu' merujuk secara kolektif kepada jemaat. Struktur kalimat dibuat alami tanpa menghilangkan hubungan logis antara pelayanan Paulus, amanat Allah, manfaat bagi jemaat, dan tujuan amanat tersebut.
