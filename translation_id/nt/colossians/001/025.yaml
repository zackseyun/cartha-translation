  - severity: low
    issue: '''demi kamu'' untuk εἰς ὑμᾶς'
    rationale: '''Demi kamu'' dapat dipahami, tetapi ''untuk kamu'' lebih alami dalam bahasa Indonesia modern dan langsung menyatakan arah/manfaat amanat itu bagi jemaat.'
