  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: id
  text: Ia ada sebelum segala sesuatu[b], dan di dalam Dia segala sesuatu tetap menyatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala sesuatu tetap berpadu di dalam Dia” atau “segala sesuatu berada sebagai satu kesatuan di dalam Dia.”
    reason: lexical_alternative
  - marker: b
    text: “Sebelum segala sesuatu” juga dapat menyiratkan kedudukan-Nya yang tertinggi atas segala sesuatu, tetapi susunan bahasa Yunani terutama menyatakan prioritas.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτός
  choice: Ia
  rationale: Pronomina ini menunjuk kepada Sang Anak dan bersifat emfatis karena posisinya. Dalam bahasa Indonesia, “Ia” menyampaikan rujukan itu secara wajar dan bermartabat tanpa memperkuatnya secara berlebihan menjadi “Ia sendiri”.
- source_word: πρὸ πάντων
  choice: sebelum segala sesuatu
  rationale: πρό dengan bentuk genitif terutama menyatakan prioritas, khususnya keberadaan lebih dahulu dalam konteks ini. Pilihan ini mempertahankan makna temporal tanpa mempersempitnya menjadi peringkat semata.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan ini luas dan menyeluruh serta menggemakan pemakaiannya dalam konteks sekitar. “Segala sesuatu” alami dalam bahasa Indonesia dan tidak membatasi cakupannya secara tidak perlu.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Terjemahan ini mempertahankan ἐν dan membiarkan hubungan berupa lingkup maupun daya penopang tetap terbuka, daripada menafsirkannya secara lebih sempit sebagai “oleh Dia” atau “melalui Dia”.
- source_word: συνέστηκεν
  choice: tetap menyatu
  rationale: Bentuk perfektum menggambarkan keadaan kini yang dihasilkan oleh tindakan sebelumnya. “Tetap menyatu” menyampaikan keberlangsungan, keterpaduan, dan keteraturan segala sesuatu dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan Kristus dengan ciptaan dalam πρὸ πάντων
  choice: Prioritas temporal dinyatakan dengan “sebelum segala sesuatu”, sementara implikasi ontologisnya tidak dijabarkan dalam teks utama.
  alternative: “Di atas segala sesuatu”, yang menonjolkan supremasi atau kedudukan.
  rationale: Susunan Yunani terutama menyatakan prioritas. Dalam konteks Kolose 1:15–20, hal itu mendukung kristologi yang tinggi, tetapi terjemahan tidak perlu mengubahnya menjadi parafrasa doktrinal.
- issue: Daya συνέστηκεν
  choice: Keterpaduan kosmis yang terus berlangsung, diterjemahkan “segala sesuatu tetap menyatu”.
  alternative: “Segala sesuatu terdiri/berada di dalam Dia” atau “segala sesuatu berpadu di dalam Dia”.
  rationale: Ayat ini menggambarkan segala sesuatu tetap berada dalam keteraturan dan kesatuan di dalam Sang Anak. Pilihan utama menyampaikan bobot tersebut dengan jelas tanpa istilah teknis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Ia” dipakai untuk pronomina subjek, sedangkan “Dia” setelah preposisi agar kalimat alami. Urutan penanda catatan kaki dibuat [b] pada frasa “sebelum segala sesuatu” dan [a] pada “tetap menyatu”, sesuai dengan bagian teks yang dijelaskan masing-masing.
