source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: id
  text: dikuatkan dengan segala kuasa[a], sesuai dengan keperkasaan kemuliaan-Nya, untuk segala ketekunan dan kesabaran dengan sukacita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dikuatkan dengan segala kuasa sesuai dengan kuasa-Nya yang mulia.” Secara lebih harfiah, bahasa Yunani berbunyi “sesuai dengan keperkasaan kemuliaan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: dengan segala kuasa
  rationale: ἐν dengan datif di sini menyatakan sarana atau lingkup. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan menyeluruh dari πάσῃ.
- source_word: δυναμούμενοι
  choice: dikuatkan
  rationale: Partisipel kini pasif menunjukkan proses yang berlangsung, dengan Allah sebagai pelaku tersirat. Bentuk pasif ini juga sesuai dengan rangkaian doa dalam konteksnya.
- source_word: κατὰ τὸ κράτος
  choice: sesuai dengan keperkasaan
  rationale: κατά menyatakan ukuran atau tolok ukur. 'Keperkasaan' membedakan κράτος dari δύναμις sebelumnya serta menyampaikan kekuatan yang nyata dan besar.
- source_word: τῆς δόξης αὐτοῦ
  choice: kemuliaan-Nya
  rationale: Mempertahankan konstruksi genitif Yunani dalam frasa 'keperkasaan kemuliaan-Nya' dan tidak melebur δόξα menjadi sekadar kata sifat.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: untuk segala ketekunan
  rationale: εἰς menyatakan tujuan atau hasil. 'Ketekunan' menggambarkan ketabahan yang bertahan dalam kesukaran, sedangkan 'segala' mempertahankan daya cakup πᾶσαν.
- source_word: μακροθυμίαν
  choice: kesabaran
  rationale: Pilihan yang alami dan mudah dipahami; tetap membedakannya dari ὑπομονή yang diterjemahkan 'ketekunan'.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Terjemahan langsung yang mempertahankan nomina χαρά dan tidak memutuskan secara berlebihan cakupan sintaksis frasa tersebut.
theological_decisions:
- issue: Hubungan penguatan ilahi dengan kemuliaan Allah
  choice: sesuai dengan keperkasaan kemuliaan-Nya
  alternative: sesuai dengan kuasa-Nya yang mulia
  rationale: Pilihan utama mempertahankan ungkapan genitif yang padat dan tidak mengubah 'kemuliaan' menjadi kata sifat, sehingga hubungan antara keperkasaan dan kemuliaan Allah tetap terbuka sebagaimana dalam teks Yunani.
- issue: Keterkaitan frasa 'dengan sukacita'
  choice: Mempertahankan frasa pada akhir ayat tanpa memperjelas secara paksa apakah terutama menerangkan ketekunan dan kesabaran atau berlanjut ke ucapan syukur pada ayat berikutnya.
  alternative: dengan tekun dan sabar serta penuh sukacita
  rationale: Teks Yunani memungkinkan ketidakpastian dalam keterkaitan frasa μετὰ χαρᾶς; susunan sumber dipertahankan agar ambiguitas tersebut tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Keperkasaan' dipakai untuk mempertahankan perbedaan antara κράτος dan δύναμις, sedangkan pasangan 'ketekunan dan kesabaran' menjaga dua istilah Yunani yang berdekatan tetapi tidak identik. Teks sengaja dibiarkan sebagai bagian lanjutan dari kalimat panjang mulai ayat 9.
