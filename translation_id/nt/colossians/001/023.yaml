id: COL.1.23
reference: Colossians 1:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: id
  text: jika memang kamu tetap dalam iman, telah diberi dasar dan teguh, serta tidak digeser dari pengharapan Injil yang telah kamu dengar. Injil itu telah diberitakan di seluruh ciptaan di bawah langit,[a] dan aku, Paulus, telah menjadi pelayan Injil itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada setiap makhluk di bawah langit.” Kata Yunani κτίσις dapat berarti “ciptaan” atau, dalam konteks tertentu, “makhluk.”
    reason: lexical_alternative
  - marker: b
    text: Atau “abdi Injil itu.” Kata Yunani διάκονος dapat menunjuk kepada seorang pelayan atau abdi; di sini tidak harus berarti jabatan gerejawi tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: asalkan ... sungguh-sungguh
  rationale: Mempertahankan daya kondisional εἰ serta penegasan γε tanpa mengubahnya menjadi pernyataan kepastian.
- source_word: ἐπιμένετε τῇ πίστει
  choice: kamu ... tetap teguh dalam iman
  rationale: Menyampaikan keberlanjutan tindakan dalam bentuk kini; 'dalam iman' mempertahankan iman sebagai ranah tempat mereka bertahan.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: berlandaskan fondasi yang kokoh
  rationale: Mempertahankan metafora fondasi dan keadaan mantap sebagai hasil tindakan sebelumnya, dalam ungkapan Indonesia yang alami.
- source_word: μὴ μετακινούμενοι
  choice: tidak bergeser
  rationale: Mempertahankan gambaran perpindahan dari kedudukan yang tetap tanpa membuat konstruksi pasif yang kaku.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: dari pengharapan yang diberikan oleh Injil
  rationale: Genitif dipahami sebagai pengharapan yang disampaikan atau dihasilkan Injil; perumusannya memperjelas hubungan itu tanpa mengubah isinya.
- source_word: τοῦ κηρυχθέντος
  choice: telah diberitakan
  rationale: Menyampaikan tindakan pewartaan publik serta relevansi hasilnya pada masa kini.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: di antara seluruh ciptaan di bawah langit
  rationale: κτίσις dipertahankan sebagai 'ciptaan', dengan catatan yang menyajikan kemungkinan makna 'makhluk'.
- source_word: διάκονος
  choice: pelayan
  rationale: '''Pelayan'' mempertahankan makna pelayanan tanpa memasukkan jabatan gerejawi tertentu.'
theological_decisions:
- issue: Daya kondisional εἴ γε dan ketekunan
  choice: asalkan kamu sungguh-sungguh tetap teguh
  alternative: karena kamu memang tetap teguh; jika kamu tetap teguh dengan implikasi pasti dapat kehilangan keselamatan
  rationale: Teks menyatakan suatu syarat yang berkaitan dengan ketekunan dalam iman, tetapi tidak dengan sendirinya menyelesaikan perdebatan teologis yang lebih luas.
- issue: Makna πίστις dalam τῇ πίστει
  choice: iman
  alternative: kesetiaan; kepercayaan
  rationale: '''Iman'' merupakan padanan paling langsung dalam konteks ini dan tidak memaksakan makna ''kesetiaan''.'
- issue: Cakupan pemberitaan Injil
  choice: telah diberitakan di antara seluruh ciptaan di bawah langit
  alternative: telah diberitakan kepada setiap makhluk di bawah langit
  rationale: Terjemahan mempertahankan cakupan universal dan gaya retoris teks tanpa menentukan secara dogmatis mekanisme atau keluasan geografisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. Metafora fondasi dipertahankan, sementara rangkaian partisip Yunani disusun ulang secara alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
