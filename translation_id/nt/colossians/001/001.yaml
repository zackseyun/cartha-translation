lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Bentuk baku nama Παῦλος dalam bahasa Indonesia dan tradisi Alkitab berbahasa Indonesia.
- source_word: ἀπόστολος
  choice: rasul
  rationale: Dalam pengenalan diri Paulus, kata ini menunjuk pada seorang utusan yang diberi wewenang, yakni jabatan atau peran yang lazim disebut “rasul,” bukan sekadar pembawa pesan.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: 'Χριστός mempertahankan daya maknanya sebagai gelar, “Mesias,” sedangkan urutan unsur dalam teks Yunani dipertahankan: Mesias Yesus.'
- source_word: διὰ θελήματος θεοῦ
  choice: atas kehendak Allah
  rationale: Dengan bentuk genitif, διά menyatakan dasar atau perantaraan yang menetapkan kerasulan Paulus. Ungkapan “atas kehendak Allah” alami dalam bahasa Indonesia dan menunjukkan bahwa kerasulannya terjadi sesuai dengan kehendak Allah.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung yang mengaitkan Timotius dengan Paulus dalam pembukaan surat.
- source_word: Τιμόθεος
  choice: Timotius
  rationale: Bentuk baku nama Τιμόθεος dalam bahasa Indonesia dan tradisi Alkitab berbahasa Indonesia.
- source_word: ὁ ἀδελφὸς
  choice: saudara kita
  rationale: Secara harfiah berbunyi “saudara itu,” tetapi dalam pembukaan surat sebutan ini menyatakan hubungan kekeluargaan di antara orang percaya. “Saudara kita” menyampaikan relasi tersebut secara alami tanpa menggantinya dengan parafrasa yang lebih interpretatif.
theological_decisions:
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konstruksi “rasul Mesias Yesus,” Χριστός masih berfungsi sebagai gelar dan diterjemahkan menurut maknanya. Bentuk tradisional “Kristus” dicatat sebagai alternatif agar pembaca mengetahui padanan yang umum dipakai.
- issue: Daya relasional ὁ ἀδελφός
  choice: saudara kita
  alternative: saudara itu
  rationale: Artikel Yunani tidak perlu diterjemahkan secara mekanis. Dalam konteks pembukaan surat, “saudara kita” secara alami mengungkapkan hubungan komunal yang tersirat tanpa mengubah Timotius menjadi saudara kandung Paulus.
