  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus Yesus.” Gelar Yunani Χριστός berarti “Mesias”; di sini diterjemahkan menurut makna gelarnya.
    reason: alternative_reading
