  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: id
  text: rahasia[a] yang tersembunyi dari zaman ke zaman dan dari generasi ke generasi, tetapi sekarang telah dinyatakan kepada orang-orang kudus-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “misteri.” Dalam surat-surat Paulus, istilah ini biasanya menunjuk maksud ilahi yang dahulu tersembunyi dan sekarang disingkapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada umat-Nya yang kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: rahasia
  rationale: Dalam bahasa Indonesia, “rahasia” secara alami menyatakan sesuatu yang dahulu tersembunyi lalu disingkapkan; konteks ayat menjelaskan pengertian khas Paulus ini tanpa menyiratkan hal esoteris.
- source_word: ἀποκεκρυμμένον
  choice: yang tersembunyi
  rationale: Bentuk ini mempertahankan keadaan akibat penyembunyian sebelumnya dan berfungsi alami sebagai keterangan bagi “rahasia”.
- source_word: ἀπὸ τῶν αἰώνων
  choice: sejak zaman-zaman
  rationale: “Sejak” menyampaikan titik awal temporal yang dikandung ἀπό, sedangkan bentuk ulang “zaman-zaman” mempertahankan jamak αἰώνων dan nuansa rentang-rentang zaman.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: dan dari generasi-generasi
  rationale: Pilihan ini mempertahankan pengulangan ἀπό serta kesejajaran dengan frasa sebelumnya tanpa menambahkan kata “semua”.
- source_word: νῦν δὲ
  choice: tetapi sekarang
  rationale: Ungkapan ini menyampaikan kontras tegas antara keadaan tersembunyi dahulu dan penyingkapan sekarang.
- source_word: ἐφανερώθη
  choice: telah dinyatakan
  rationale: Bentuk pasif dipertahankan, dan “dinyatakan” mengungkapkan tindakan membuat sesuatu yang tersembunyi menjadi diketahui; “telah” alami dalam bahasa Indonesia untuk hasil yang kini berlaku tanpa memaksakan nilai aspek Yunani secara berlebihan.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: kepada orang-orang kudus-Nya
  rationale: “Orang-orang kudus” merupakan istilah Indonesia yang mapan bagi umat yang dikhususkan bagi Allah dan mempertahankan bobot leksikal ἅγιοι.
theological_decisions:
- issue: Cakupan “orang-orang kudus-Nya”
  choice: Mengacu kepada umat Allah yang dikuduskan, yaitu komunitas orang percaya, bukan hanya golongan elite yang kemudian dikanonisasi.
  alternative: “umat-Nya yang kudus”
  rationale: Pemakaian Paulus biasanya menunjuk seluruh orang percaya sebagai mereka yang dikhususkan bagi Allah. Teks utama mempertahankan istilah teologis yang mapan, sementara catatan kaki menjernihkan padanan alternatif.
- issue: Makna μυστήριον
  choice: Diterjemahkan “rahasia,” yaitu maksud ilahi yang dahulu tersembunyi tetapi kini dinyatakan.
  alternative: “misteri”
  rationale: “Rahasia” lebih langsung dan alami bagi pembaca Indonesia serta cocok dengan kontras eksplisit antara tersembunyi dan dinyatakan. Maknanya tidak dipersempit menjadi informasi rahasia biasa karena konteks penyingkapan ilahi tetap jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan frasa dipertahankan sebagai bagian dari kalimat yang berlanjut dari ayat sebelumnya. Bentuk ulang “zaman-zaman” dan “generasi-generasi” sengaja mempertahankan jamak serta paralelisme Yunani, meskipun sedikit lebih formal daripada ungkapan sehari-hari.
