base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: id
  text: Sebagaimana kamu telah belajar dari Epafras, sesama budak kami yang terkasih[a]. Ia adalah pelayan Mesias[b] yang setia demi kami.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sesama budak.” Kata Yunani σύνδουλος menggambarkan orang-orang yang menjadi budak bersama di bawah tuan yang sama.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: Χριστοῦ, yaitu “Mesias” atau “Kristus.” Di sini kata itu berfungsi sebagai gelar.'
    reason: lexical_alternative
  - marker: c
    text: Atau “bagi kami” atau “atas nama kami.” Sejumlah naskah berbunyi “bagi kamu sekalian.”
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Mempertahankan hubungan kesesuaian dengan pernyataan sebelumnya dan berfungsi alami sebagai penghubung dalam bahasa Indonesia.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: kamu telah belajar dari Epafras
  rationale: ἀπό menandai Epafras sebagai sumber pengajaran yang mereka terima; bentuk perfektif diterjemahkan secara wajar dengan 'telah belajar'.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: rekan kami sesama budak yang terkasih
  rationale: Ungkapan ini mempertahankan unsur kebersamaan dan status sebagai budak di bawah tuan yang sama, sambil menghindari susunan 'sesama budak kami' yang kurang alami dan dapat disalahpahami dalam bahasa Indonesia.
- source_word: πιστὸς
  choice: yang setia
  rationale: Menyatakan kesetiaan dan keterandalan Epafras dalam pelayanannya.
- source_word: διάκονος
  choice: pelayan
  rationale: Menunjuk kepada orang yang melayani, tanpa mengimpor jabatan gerejawi teknis yang belum tentu dimaksudkan dalam konteks ini.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi orang yang dilayani Epafras; 'Mesias' menyampaikan isi gelar itu secara langsung.
- source_word: ὑπὲρ ἡμῶν
  choice: yang mewakili kami
  rationale: ὑπέρ dengan genetif di sini paling mungkin menyatakan tindakan atas nama atau demi kepentingan Paulus dan rekan-rekannya; 'mewakili kami' menyampaikan nuansa representatif dengan alami.
theological_decisions:
- issue: Bahasa perbudakan dalam σύνδουλος
  choice: rekan kami sesama budak
  alternative: rekan sepelayanan kami
  rationale: Pilihan utama mempertahankan gambaran bahwa Epafras, Paulus, dan rekan-rekannya sama-sama berada di bawah satu Tuan. Alternatif lebih halus, tetapi menghilangkan status terikat yang terdapat dalam unsur δοῦλος.
- issue: Makna gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa 'pelayan Mesias', kata Yunani itu berfungsi jelas sebagai gelar dan bukan sekadar unsur nama; 'Mesias' menjaga isi semantis gelar tersebut.
- issue: Rujukan ὑπὲρ ἡμῶν
  choice: mewakili kami
  alternative: demi kami; bagi kamu sekalian (varian naskah)
  rationale: Teks SBLGNT memakai ἡμῶν ('kami'), dengan kemungkinan nuansa representatif atau manfaat. Sejumlah saksi memakai ὑμῶν ('kamu sekalian'), sehingga ketidakpastian tekstual perlu dicatat tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ayat dibagi menjadi dua kalimat agar rangkaian klausa relatif tidak terasa berat. Bentuk 'kamu' dipertahankan sebagai sapaan jamak yang lazim dalam terjemahan modern; catatan tekstual memakai 'kamu sekalian' untuk memperjelas bahwa bentuk Yunani variannya jamak.
