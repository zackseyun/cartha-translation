  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: id
  text: Dialah gambar Allah yang tidak kelihatan, yang sulung[a] dari seluruh ciptaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Yunani ini berbunyi “yang sulung dari seluruh ciptaan.” Dalam pemakaian Alkitab, “yang sulung” dapat menunjuk pada kedudukan utama dan hak waris, bukan hanya pada urutan kelahiran. Karena itu, dalam konteks ayat-ayat berikutnya, frasa ini juga dapat dipahami sebagai “yang sulung atas seluruh ciptaan.”
    reason: Menjelaskan ambiguitas genitif Yunani dan cakupan makna “yang sulung” tanpa menghapus ketegangan teologis dari teks utama.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Dialah
  rationale: Kata ganti relatif ini merujuk kepada Sang Anak pada ayat sebelumnya. Dalam bahasa Indonesia, “Dialah” secara alami melanjutkan rujukan tersebut sekaligus mempertahankan penekanan pernyataannya.
- source_word: εἰκὼν
  choice: gambar
  rationale: “Gambar” mempertahankan daya representatif dan pewahyuan dari εἰκών tanpa mempersempitnya menjadi sekadar kemiripan atau menjelaskannya secara metafisis.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: Allah yang tidak kelihatan
  rationale: Terjemahan ini mengikuti konstruksi genitif dan menyampaikan bahwa Allah tidak dapat dilihat, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: πρωτότοκος
  choice: yang sulung
  rationale: “Yang sulung” mempertahankan metafora πρωτότοκος serta latar alkitabiahnya mengenai kedudukan dan hak waris. “Anak sulung” tidak dipakai agar unsur “anak” yang tidak dinyatakan dalam kata Yunani ini tidak ditambahkan ke frasa.
- source_word: πάσης κτίσεως
  choice: dari seluruh ciptaan
  rationale: “Dari seluruh ciptaan” mencerminkan bentuk genitif Yunani secara langsung dan mempertahankan ketegangan penafsirannya. Makna kedudukan Sang Anak dalam kaitannya dengan ciptaan diterangkan dalam catatan tanpa dimasukkan secara diam-diam ke dalam teks.
theological_decisions:
- issue: Makna πρωτότοκος πάσης κτίσεως dalam hubungan Sang Anak dengan ciptaan
  choice: yang sulung dari seluruh ciptaan
  alternative: yang sulung atas seluruh ciptaan
  rationale: Bentuk “dari seluruh ciptaan” paling langsung mencerminkan genitif Yunani dan tidak menyelesaikan ambiguitasnya di dalam terjemahan. Sebutan “yang sulung” dalam pemakaian alkitabiah dapat menyatakan kedudukan utama dan hak waris, bukan hanya urutan kelahiran; konteks langsung pada ayat 16–17 juga menempatkan Sang Anak sebagai perantara, tujuan, dan pendahulu segala ciptaan. Catatan menjelaskan hal ini tanpa mengganti metafora sumber dengan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat ringkas serta mudah dibaca, sambil mempertahankan metafora utama dan hubungan gramatikal teks Yunani.
