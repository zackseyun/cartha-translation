id: COL.1.3
reference: Colossians 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: id
  text: Kami selalu mengucap syukur kepada Allah, Bapa Tuhan kita Yesus Sang Mesias[a], ketika kami berdoa untuk kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara tradisional, “Yesus Kristus.”
    reason: Menampilkan padanan tradisional bagi Χριστός sambil mempertahankan “Mesias” sebagai gelar dalam teks utama.
  - marker: b
    text: 'Susunan bahasa Yunani juga dapat dipahami: “Kami mengucap syukur kepada Allah … ketika kami selalu berdoa untuk kalian.”'
    reason: πάντοτε dapat dikaitkan dengan kata kerja utama “mengucap syukur” atau dengan partisipel “berdoa”; catatan ini mempertahankan ambiguitas sintaksis.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Kami mengucap syukur
  rationale: Bentuk ini menyampaikan ungkapan terima kasih kepada Allah dalam konteks doa dan lazim dalam bahasa Indonesia Alkitabiah yang tetap modern.
- source_word: τῷ θεῷ πατρὶ
  choice: kepada Allah, Bapa
  rationale: 'Dua bentuk datif paling wajar dipahami secara aposisional: Allah dijelaskan sebagai Bapa. Koma mempertahankan hubungan itu tanpa menjadikannya dua sebutan yang terkoordinasi.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: κύριος berfungsi sebagai gelar dan konstruksi genitif menyatakan bahwa Allah adalah Bapa dari Tuhan kita.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός masih dapat didengar sebagai gelar, yaitu Mesias. Kata “Sang” membuat gelar tersebut idiomatis dan bermartabat dalam bahasa Indonesia, sedangkan bentuk tradisional dicatat dalam catatan kaki.
- source_word: πάντοτε
  choice: selalu
  rationale: πάντοτε berarti “selalu”; dalam teks utama kata ini dihubungkan dengan tindakan mengucap syukur, sesuai urutan dan pembacaan yang paling alami, sementara kemungkinan kaitannya dengan doa dicatat.
- source_word: περὶ ὑμῶν
  choice: untuk kalian
  rationale: Dalam konteks doa, περί dengan genitif menyatakan pihak yang didoakan, bukan sekadar pokok pembicaraan. “Kalian” membedakan bentuk jamak sumber secara jelas dalam bahasa Indonesia modern.
- source_word: προσευχόμενοι
  choice: ketika kami berdoa
  rationale: Partisipel kini menyatakan keadaan atau waktu yang bersamaan dengan tindakan utama; bentuk klausa ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan Χριστός sebagai gelar atau unsur nama
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Dalam konteks ini Χριστός tidak harus diperlakukan sebagai unsur nama yang sudah kehilangan makna gelarnya. “Sang Mesias” mempertahankan arti gelar itu tanpa mengubah hubungan kristologis dalam kalimat.
- issue: Cakupan πάντοτε
  choice: “selalu” menerangkan “mengucap syukur”
  alternative: “selalu” menerangkan “berdoa untuk kalian”
  rationale: Posisi πάντοτε memungkinkan perbedaan pengelompokan sintaksis. Teks utama mengikuti pembacaan bahwa ucapan syukur berlangsung senantiasa, tetapi alternatifnya tetap dicatat agar ambiguitas Yunani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan orang kedua jamak secara eksplisit dan wajar. Koma setelah “Allah” menandai aposisi. Kalimat mempertahankan bentuk orang pertama jamak dan alur surat Paulus.
