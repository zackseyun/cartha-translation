id: COL.1.16
reference: Colossians 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: id
  text: Sebab di dalam Dia segala sesuatu diciptakan, baik yang ada di surga maupun yang ada di bumi, yang kelihatan maupun yang tidak kelihatan, entah takhta, kekuasaan, pemerintah, ataupun penguasa; segala sesuatu telah diciptakan melalui Dia dan untuk Dia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Yunani, kata yang diterjemahkan “surga” berbentuk jamak: “surga-surga”.'
    reason: lexical_alternative
  - marker: b
    text: Atau “menuju Dia”; ungkapan ini menyatakan bahwa Dia adalah tujuan penciptaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Mempertahankan daya kausal yang menghubungkan ayat ini dengan pernyataan sebelumnya tentang keutamaan Sang Anak.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan ἐν secara tersendiri dan tidak menyamakannya dengan δι’ αὐτοῦ pada klausa berikutnya.
- source_word: ἐκτίσθη / ἔκτισται
  choice: diciptakan / telah diciptakan
  rationale: Bentuk aoris pertama menyatakan tindakan penciptaan, sedangkan bentuk perfektum terakhir menyoroti hasil yang tetap berlaku.
- source_word: τὰ πάντα
  choice: segala sesuatu
  rationale: Ungkapan Indonesia yang alami dan luas, tanpa mempersempit cakupan kosmisnya.
- source_word: ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς
  choice: baik yang ada di surga maupun yang ada di bumi
  rationale: Merupakan pasangan merismik yang alami dalam bahasa Indonesia; catatan kaki mempertahankan informasi bahwa bentuk Yunani untuk 'surga' adalah jamak.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: yang kelihatan maupun yang tidak kelihatan
  rationale: Menyampaikan dua adjektiva substantival secara jelas dan sejajar.
- source_word: θρόνοι
  choice: takhta
  rationale: Padanan langsung yang mempertahankan citra kedudukan atau tingkat kewenangan.
- source_word: κυριότητες
  choice: kekuasaan
  rationale: Padanan modern yang dapat menunjuk kelas kuasa tanpa memaksakan identifikasi ontologis tertentu.
- source_word: ἀρχαὶ
  choice: pemerintah
  rationale: Menyampaikan gagasan kuasa yang memerintah dan tetap dibedakan dari ἐξουσίαι.
- source_word: ἐξουσίαι
  choice: penguasa
  rationale: Padanan yang mudah dipahami untuk pihak-pihak yang memiliki wewenang.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: Mempertahankan peran perantaraan atau sarana yang dibedakan dari 'di dalam Dia'.
- source_word: εἰς αὐτόν
  choice: untuk Dia
  rationale: Menyatakan Dia sebagai tujuan penciptaan dalam bahasa Indonesia yang alami; alternatif yang lebih harfiah dicatat.
theological_decisions:
- issue: Hubungan Sang Anak dengan penciptaan dalam ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: di dalam Dia ... melalui Dia ... untuk Dia
  alternative: oleh Dia ... melalui Dia ... menuju Dia
  rationale: Perbedaan ketiga preposisi dipertahankan agar dimensi lingkup, perantaraan, dan tujuan tidak diratakan menjadi satu gagasan.
- issue: Hakikat takhta, kekuasaan, pemerintah, dan penguasa
  choice: Menerjemahkan sebagai kategori kewenangan yang diciptakan tanpa memperinci hakikatnya
  alternative: Menjelaskannya secara eksplisit sebagai tingkatan malaikat atau sebagai lembaga politik manusia
  rationale: Ayat ini tidak membatasi daftar tersebut hanya pada makhluk rohani atau struktur duniawi, sehingga ambiguitasnya perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur satu kalimat dengan titik koma mempertahankan kesatuan argumen Yunani. Pasangan “baik ... maupun” dan “entah ... ataupun” dipakai agar daftar panjang tetap mudah dibaca.
