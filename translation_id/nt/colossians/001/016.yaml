  source_fidelity: 'Teks dengan setia mempertahankan hubungan kausal ὅτι dan tiga preposisi yang berbeda: “di dalam Dia ... melalui Dia ... untuk Dia.” Cakupan τὰ πάντα, pasangan “di surga ... di bumi” serta “yang kelihatan ... yang tidak kelihatan,” dan daftar empat kategori otoritas semuanya tersampaikan tanpa mempersempit rujukannya. Perfektum ἔκτισται diterjemahkan dengan tepat melalui “telah diciptakan.”'
  naturalness: Bahasa Indonesia baku, lancar, dan cukup khidmat. Penggunaan “baik ... maupun,” “entah ... ataupun,” dan titik koma menghasilkan satu kalimat panjang yang tetap jelas serta mencerminkan alur kalimat Yunani.
