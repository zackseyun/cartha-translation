id: COL.1.18
reference: Colossians 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: id
  text: Ia adalah kepala tubuh, yaitu jemaat. Ia adalah permulaan[a], yang sulung dari antara orang mati, supaya dalam segala sesuatu Ia sendiri menjadi yang terutama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “asal” atau “penguasa” untuk “permulaan” (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Atau “menduduki tempat pertama dalam segala sesuatu” untuk “menjadi yang terutama dalam segala sesuatu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: Ia / Ia sendiri
  rationale: Kata ganti ini bersifat menegaskan. Pada klausa pertama, “Ia” terdengar alami dalam bahasa Indonesia; pada klausa terakhir, “Ia sendiri” mempertahankan penekanan yang eksplisit.
- source_word: κεφαλή
  choice: kepala
  rationale: Padanan langsung ini mempertahankan metafora kepala-tubuh tanpa membatasinya hanya pada makna penguasa atau sumber.
- source_word: σῶμα
  choice: tubuh
  rationale: Padanan baku yang mempertahankan metafora korporat dan kaitannya dengan “kepala”.
- source_word: ἐκκλησία
  choice: jemaat
  rationale: Dalam konteks Paulus, “jemaat” secara alami menunjuk kepada umat yang merupakan tubuh Kristus, bukan sekadar sebuah pertemuan.
- source_word: ἀρχή
  choice: permulaan
  rationale: Dalam rangkaian dengan “yang sulung dari antara orang mati”, pilihan ini paling wajar menunjuk kepada Kristus sebagai pemula tatanan kebangkitan, sambil tidak meniadakan kemungkinan nuansa asal atau penguasa.
- source_word: πρωτότοκος
  choice: yang sulung
  rationale: Pilihan ini mempertahankan bentuk leksikal dan gema alkitabiahnya, termasuk nuansa urutan dan kedudukan utama, tanpa menyiratkan bahwa Kristus adalah makhluk ciptaan.
- source_word: ἐκ τῶν νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan gagasan keluar dari lingkungan orang-orang mati dalam kebangkitan.
- source_word: ἵνα γένηται
  choice: supaya ... menjadi
  rationale: Mencerminkan tujuan atau hasil yang dinyatakan oleh ἵνα serta perubahan/kemunculan kedudukan yang terkandung dalam γένηται.
- source_word: ἐν πᾶσιν
  choice: dalam segala sesuatu
  rationale: Bentuk netral jamak paling alami dipahami secara luas sebagai “segala sesuatu”, sesuai cakupan kosmis konteksnya.
- source_word: πρωτεύων
  choice: yang terutama
  rationale: Mengungkapkan arti memegang tempat pertama dengan bahasa Indonesia yang jelas dan wajar.
theological_decisions:
- issue: Makna κεφαλή dalam metafora Kristus dan tubuh
  choice: Mempertahankan metafora “kepala” tanpa menjelaskannya sebagai hanya penguasa atau hanya sumber.
  alternative: pemimpin/penguasa atas tubuh; sumber tubuh
  rationale: Metafora Yunani mengandung kekayaan makna dan tidak sepatutnya dipersempit oleh terjemahan.
- issue: Makna ἀρχή dalam hubungannya dengan kebangkitan dan ciptaan baru
  choice: permulaan
  alternative: asal; penguasa
  rationale: Konteks langsung, terutama frasa “yang sulung dari antara orang mati”, mendukung gagasan Kristus sebagai pemula tatanan kebangkitan, tetapi alternatif leksikal tetap dicatat.
- issue: Daya ungkap πρωτότοκος ἐκ τῶν νεκρῶν
  choice: yang sulung dari antara orang mati
  alternative: yang pertama bangkit dari antara orang mati; yang terutama atas orang mati
  rationale: Terjemahan ini mempertahankan ungkapan sumber dan gema teologisnya. Dalam konteks, istilah tersebut menyatakan keutamaan Kristus dalam kebangkitan, bukan bahwa Ia termasuk ciptaan.
- issue: Hubungan tujuan dan hasil dalam ἵνα γένηται
  choice: supaya ... menjadi
  alternative: agar ... berada sebagai; sehingga ... menjadi
  rationale: “Supaya” mempertahankan daya tujuan yang kuat, sementara konteks juga memungkinkan nuansa hasil; terjemahan tidak memaksakan pemisahan mutlak antara keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur metaforis Yunani dipertahankan, sedangkan “yaitu jemaat” memperjelas aposisi tubuh–jemaat secara alami. Kapitalisasi kata ganti “Ia” dipakai sebagai konvensi penghormatan dalam teks keagamaan Indonesia, bukan untuk menambahkan makna gramatikal pada bahasa Yunani.
