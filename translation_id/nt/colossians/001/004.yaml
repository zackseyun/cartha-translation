  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: id
  text: karena kami telah mendengar tentang imanmu kepada Mesias Yesus[a] dan kasih yang kamu miliki kepada semua orang kudus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepercayaanmu kepada Mesias Yesus” atau “kesetiaanmu di dalam Mesias Yesus.” Kata Yunani pistis dapat memuat makna-makna yang berkaitan ini, bergantung pada konteks. Frasa Yunaninya juga secara harfiah dapat diterjemahkan “imanmu di dalam Mesias Yesus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: karena kami telah mendengar tentang
  rationale: Partisip aoristus ini menerangkan subjek tersirat dari ayat sebelumnya dan menyatakan dasar ucapan syukur. Bentuk kausal ini alami dalam bahasa Indonesia sambil mempertahankan kaitannya dengan kalimat sebelumnya.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks hubungan dengan Mesias Yesus, 'iman' merupakan padanan baku dan paling sesuai, sementara kemungkinan nuansa 'kepercayaan' atau 'kesetiaan' dipertahankan dalam catatan kaki.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kepada Mesias Yesus
  rationale: Walaupun ἐν secara harfiah sering berarti 'di dalam', bersama πίστις frasa ini secara idiomatis menyatakan arah atau objek iman. 'Kepada' lebih alami dalam bahasa Indonesia. Χριστός diterjemahkan sebagai gelar 'Mesias', sedangkan Ἰησοῦ ditransliterasikan sebagai nama 'Yesus'.
- source_word: ἀγάπην
  choice: kasih
  rationale: '''Kasih'' adalah padanan yang jelas, bermartabat, dan lazim bagi ἀγάπη dalam konteks Perjanjian Baru.'
- source_word: ἣν ἔχετε
  choice: yang kamu miliki
  rationale: Mempertahankan klausa relatif yang terdapat dalam teks SBLGNT dan menyatakan bahwa kasih itu ada serta nyata pada para pembaca.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: kepada semua orang kudus
  rationale: εἰς menyatakan arah kasih dan secara alami diterjemahkan 'kepada'. 'Orang kudus' mempertahankan sebutan khas Paulus bagi umat Allah.
theological_decisions:
- issue: Penerjemahan Χριστῷ sebagai gelar atau bentuk menyerupai nama
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός pada dasarnya adalah gelar, dan di sini diterjemahkan 'Mesias' serta dipasangkan dengan nama pribadi Yesus.
- issue: Kemungkinan nuansa πίστις dalam pemakaian Paulus
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Konteks paling wajar menunjuk pada iman para pembaca yang tertuju kepada Mesias Yesus. Namun, rentang makna πίστις mencakup kepercayaan dan kesetiaan, sehingga ketegangan leksikal itu dicatat tanpa mengubah bacaan utama.
- issue: Nilai relasional ἐν dalam frasa πίστις ἐν Χριστῷ Ἰησοῦ
  choice: imanmu kepada Mesias Yesus
  alternative: imanmu di dalam Mesias Yesus
  rationale: '''Kepada'' menghasilkan ungkapan Indonesia yang alami untuk objek iman, sedangkan ''di dalam'' lebih dekat pada bentuk Yunani dan dapat menonjolkan lingkup atau kesatuan relasional dengan Mesias.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang bermartabat. Bentuk 'kamu' dipakai sebagai sapaan jamak yang alami dalam bahasa Indonesia; 'kami' dieksplisitkan dari subjek kalimat sebelumnya agar hubungan sintaksisnya jelas. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
