  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: id
  text: Dialah juga yang telah memberitahukan kepada kami tentang kasih kalian dalam Roh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih kalian dalam roh,” yaitu kasih kalian yang bersifat rohani.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: Dialah ... yang telah memberitahukan
  rationale: Artikel dengan partisip aoris berfungsi substantival dan menunjuk kembali kepada Epafras pada ayat sebelumnya. Bentuk klausa relatif ini alami dalam bahasa Indonesia, sementara δηλόω berarti memberitahukan atau membuat sesuatu diketahui.
- source_word: καὶ
  choice: juga
  rationale: καί menambahkan tindakan Epafras ini pada uraian sebelumnya; 'juga' menyampaikan daya aditifnya secara alami.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: 'Bentuk datif berfungsi sebagai objek tidak langsung: Epafras memberitahukan hal itu kepada Paulus dan rekan-rekannya.'
- source_word: τὴν ὑμῶν ἀγάπην
  choice: tentang kasih kalian
  rationale: ἀγάπη diterjemahkan secara langsung sebagai 'kasih'. Pronomina jamak ὑμῶν dinyatakan dengan 'kalian', dan 'tentang' menghasilkan konstruksi Indonesia yang alami sesudah 'memberitahukan kepada kami'.
- source_word: ἐν πνεύματι
  choice: dalam Roh
  rationale: Ungkapan ini kemungkinan besar merujuk kepada Roh Kudus dalam pemakaian Paulus, walaupun tidak berartikel. Terjemahan 'dalam Roh' mempertahankan bentuk dan ketegangan maknanya tanpa memperjelas secara berlebihan; kemungkinan arti 'dalam roh' dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan πνεύματι
  choice: Roh Kudus sebagai acuan yang paling mungkin dalam 'kasih kalian dalam Roh'
  alternative: kasih kalian dalam roh, yakni kasih yang bersifat rohani
  rationale: Frasa tersebut dapat menunjuk kepada Roh Kudus atau, secara lebih umum, kepada ranah maupun watak rohani. Teks utama memakai kemungkinan yang paling sesuai dengan idiom Paulus, sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dialah' menjaga hubungan dengan Epafras dalam ayat sebelumnya; 'kalian' menandai orang kedua jamak dengan jelas. Huruf kapital pada 'Roh' menunjukkan pembacaan utama sebagai Roh Kudus, sementara ambiguitas sumber dipertahankan melalui catatan kaki.
