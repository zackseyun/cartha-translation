  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: id
  text: sambil mengucap syukur kepada Bapa yang telah membuat kalian[a] layak menerima bagian dalam warisan orang-orang kudus di dalam terang[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “kami”, bukan “kalian”.
    reason: textual_variant
  - marker: b
    text: Atau, “bagian yang diperuntukkan bagi orang-orang kudus di dalam terang”; bahasa Yunaninya menggugah gambaran tentang bagian warisan yang dialokasikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: sambil mengucap syukur
  rationale: Partisipel kini aktif ini meneruskan alur kalimat sebelumnya. “Sambil mengucap syukur” mempertahankan hubungan partisipial dan nuansa tindakan yang berlangsung.
- source_word: τῷ πατρὶ
  choice: kepada Bapa
  rationale: Menerjemahkan gelar relasional yang eksplisit tanpa menambahkan kata “Allah” yang tidak terdapat dalam ayat ini.
- source_word: ἱκανώσαντι
  choice: yang telah membuat ... layak
  rationale: Bentuk aoris dari ἱκανόω menyatakan tindakan menjadikan seseorang cukup atau layak. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyempitkan maknanya menjadi sekadar memberi izin.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Mengikuti bacaan SBLGNT dan menyatakan dengan jelas bahwa pronomina orang kedua ini berbentuk jamak. Varian “kami” dicatat dalam catatan kaki.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: menerima bagian dalam warisan
  rationale: Ungkapan ini menyampaikan keikutsertaan dalam suatu bagian atau jatah warisan secara wajar dalam bahasa Indonesia, sambil mempertahankan latar gambaran pembagian milik pusaka.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Sebutan Paulus bagi umat yang dikhususkan bagi Allah. Pilihan ini ringkas dan mempertahankan hubungan leksikal dengan konsep kekudusan.
- source_word: ἐν τῷ φωτί
  choice: di dalam terang
  rationale: Mempertahankan metafora dan membiarkan frasa ini menerangkan ranah warisan atau bagian orang-orang kudus tanpa menentukannya secara lebih sempit.
theological_decisions:
- issue: Varian tekstual pada pronomina objek
  choice: kalian
  alternative: kami
  rationale: Teks sumber SBLGNT berbunyi ὑμᾶς, “kalian”. Bacaan ἡμᾶς, “kami”, yang terdapat dalam sejumlah naskah dicatat tanpa menggantikan bacaan utama.
- issue: Hubungan antara bagian, warisan, orang-orang kudus, dan terang
  choice: bagian dalam warisan orang-orang kudus di dalam terang
  alternative: bagian yang diperuntukkan bagi orang-orang kudus di dalam terang
  rationale: Teks utama mempertahankan susunan genitif dan ambiguitas mengenai kaitan tepat frasa “di dalam terang”, sedangkan catatan kaki menyajikan kemungkinan gambaran jatah yang diperuntukkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Kalian” dipakai untuk menandai bentuk jamak secara transparan; “membuat ... layak” dipilih daripada bentuk yang lebih teknis “melayakkan”.
