base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: id
  text: Dan kamu, yang dahulu terasing dan bermusuhan dalam pikiran, dalam perbuatan jahat[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menjadi musuh dalam pikiran, dalam perbuatan-perbuatan jahat.” Ungkapan Yunani ini padat. Frasa “dalam perbuatan jahat” dapat dipahami sebagai ranah atau kaitan permusuhan itu, tanpa memastikan hubungan sebab-akibat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Dan kamu
  rationale: Mempertahankan kesinambungan kalimat dari ayat sebelumnya dan menandai bahwa para pembaca juga tercakup dalam karya pendamaian Kristus.
- source_word: ποτε ὄντας
  choice: yang dahulu
  rationale: Mengalihkan konstruksi partisipial Yunani ke klausa relatif yang alami dalam bahasa Indonesia sambil mempertahankan keadaan mereka pada masa lampau.
- source_word: ἀπηλλοτριωμένους
  choice: terasing
  rationale: Menunjukkan keadaan terpisah atau renggang secara relasional tanpa menambahkan objek yang tidak dinyatakan dalam ayat ini.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: bersikap sebagai musuh dalam pikiran
  rationale: Mempertahankan nuansa nomina ἐχθρούς, 'musuh', sekaligus menyampaikan bahwa permusuhan itu berada dalam ranah pikiran.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: yang tampak dalam perbuatan-perbuatan jahat
  rationale: Menyatakan perbuatan jahat sebagai ranah atau perwujudan permusuhan tanpa menjadikannya sebab secara eksplisit; catatan kaki mempertahankan bentuk yang lebih harfiah dan padat.
- source_word: ἔργοις
  choice: perbuatan-perbuatan
  rationale: Padanan Indonesia yang alami dalam konteks perilaku moral dan tidak membawa asosiasi teknis yang tidak diperlukan.
- source_word: πονηροῖς
  choice: jahat
  rationale: Padanan langsung dan umum yang mempertahankan bobot moral istilah Yunani.
theological_decisions:
- issue: Hubungan antara permusuhan batin dan perbuatan jahat
  choice: Permusuhan dalam pikiran dinyatakan tampak dalam perbuatan-perbuatan jahat.
  alternative: “menjadi musuh dalam pikiran, dalam perbuatan-perbuatan jahat” atau “menjadi musuh dalam pikiran karena perbuatan-perbuatan jahat”
  rationale: Preposisi ἐν dapat menunjukkan ranah atau perwujudan, sedangkan hubungan sebab-akibat tidak dinyatakan secara pasti. Terjemahan utama dibuat alami tanpa menetapkan bahwa perbuatan jahat merupakan penyebab permusuhan.
- issue: Objek keterasingan dan permusuhan
  choice: Tidak menambahkan “dari Allah” atau “terhadap Allah” dalam teks utama.
  alternative: “terasing dari Allah dan memusuhi-Nya”
  rationale: Konteks mengarah kepada hubungan dengan Allah, tetapi objek tersebut tidak disebutkan secara eksplisit dalam frasa Yunani ayat ini; ketidaktersuratannya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “bersikap sebagai musuh” dipilih agar nuansa nominal Yunani tetap terdengar wajar; tanda pisah mempertahankan kalimat yang berlanjut ke ayat berikutnya.
