    issue: “Menempatkan kamu” untuk παραστῆσαι
    rationale: 'Kata ini terdengar seperti menaruh atau menugaskan pada suatu posisi. Infinitif Yunani di sini menyatakan tujuan pendamaian: menghadapkan para penerima di hadapan-Nya.'
  - severity: medium
    issue: “Tidak bercela” kurang menangkap nuansa ἀνεγκλήτους
    rationale: Ungkapan ini sangat berdekatan dengan “tanpa noda” untuk ἀμώμους. Ἀνεγκλήτους berhubungan dengan tidak adanya dasar tuduhan atau dakwaan; “tidak dapat dituduh” mempertahankan perbedaan itu.
  - severity: low
