source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: id
  text: Namun sekarang kamu telah diperdamaikan[a] dalam tubuh-Nya yang berdaging melalui kematian, untuk menghadapkan kamu di hadapan-Nya sebagai orang-orang yang kudus, tanpa noda[b], dan tidak dapat dituduh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata kerja Yunani berbentuk pasif. Dapat juga diungkapkan secara aktif, “Dia telah mendamaikan kamu,” dengan pelaku yang dipahami dari konteks.
    reason: alternative_reading
  - marker: b
    text: “Tanpa noda” dapat juga diterjemahkan “tidak bercacat”; kata Yunani ini dapat menggemakan gambaran kurban yang tidak bercacat.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: Mempertahankan peralihan waktu sekaligus pertentangan dengan keadaan mereka sebelumnya dalam ayat 21.
- source_word: ἀποκατηλλάγητε
  choice: kamu telah diperdamaikan
  rationale: Mempertahankan bentuk pasif aoristus Yunani dan tidak menyatakan secara eksplisit pelaku yang dibiarkan tersirat dalam teks sumber.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: di dalam tubuh jasmani-Nya
  rationale: Menyampaikan penekanan pada tubuh yang sungguh bersifat fisik tanpa memakai frasa Indonesia yang kaku seperti 'tubuh daging-Nya' atau memberi kesan bahwa σάρξ berarti tabiat berdosa.
- source_word: διὰ τοῦ θανάτου
  choice: melalui kematian
  rationale: Mempertahankan διά dengan genitif sebagai sarana, tanpa menambahkan kata ganti posesif yang tidak terdapat pada frasa ini.
- source_word: παραστῆσαι
  choice: untuk menempatkan kamu
  rationale: Menyatakan tujuan atau hasil pendamaian dan sesuai dengan gambaran membawa seseorang berdiri di hadapan pihak lain.
- source_word: ἁγίους
  choice: sebagai orang-orang yang kudus
  rationale: Menjaga makna pengudusan dan kemurnian serta menunjukkan bahwa kata sifat jamak ini menerangkan para penerima surat.
- source_word: ἀμώμους
  choice: tanpa noda
  rationale: Mempertahankan kemungkinan nuansa kurban yang tidak bercacat sekaligus tetap wajar sebagai gambaran keadaan umat.
- source_word: ἀνεγκλήτους
  choice: tidak bercela
  rationale: Ungkapan Indonesia yang alami untuk keadaan yang tidak memberi dasar bagi tuduhan, dan tetap dibedakan dari 'tanpa noda'.
- source_word: κατενώπιον αὐτοῦ
  choice: di hadapan-Nya
  rationale: Mempertahankan suasana kehadiran dan penilaian tanpa menentukan lebih jauh apakah kata ganti itu merujuk kepada Allah atau Kristus.
theological_decisions:
- issue: Pelaku pendamaian dalam bentuk pasif ἀποκατηλλάγητε
  choice: 'Mempertahankan bentuk pasif: ''kamu telah diperdamaikan''.'
  alternative: 'Membuat pelaku tersirat menjadi eksplisit: ''Dia telah mendamaikan kamu''.'
  rationale: Teks Yunani berbentuk pasif dan tidak menyebut pelakunya secara gramatikal. Bentuk pasif Indonesia cukup alami dan mempertahankan ketakterangan asli.
- issue: Arti σάρξ dalam frasa tentang tubuh
  choice: Memahaminya secara fisik melalui ungkapan 'tubuh jasmani-Nya'.
  alternative: Menerjemahkannya sebagai 'tabiat berdosa'.
  rationale: Konteks kematian menunjuk pada keberadaan jasmani yang nyata; pengertian moral 'tabiat berdosa' tidak didukung di sini.
- issue: Pembedaan ἀμώμους dan ἀνεγκλήτους
  choice: Menerjemahkan 'tanpa noda' dan 'tidak bercela'.
  alternative: Menerjemahkan keduanya dengan ungkapan yang hampir sama, misalnya 'tidak bercela dan tidak bercacat'.
  rationale: Pilihan ini menjaga kemungkinan gema kurban pada istilah pertama dan nuansa bebas dari tuduhan pada istilah kedua tanpa memaksakan satu kerangka teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pasif dipertahankan untuk menjaga ambiguitas gramatikal teks Yunani; 'tubuh jasmani' dipilih agar makna fisik jelas tanpa kekakuan 'tubuh daging'.
