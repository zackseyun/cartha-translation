id: COL.2.11
reference: Colossians 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: id
  text: Di dalam Dia, kamu juga telah disunat dengan sunat yang bukan buatan tangan manusia[a], dalam penanggalan tubuh daging[b], dalam sunat Mesias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang tidak dibuat dengan tangan.”'
    reason: Ungkapan Yunani menekankan bahwa sunat ini bukan hasil tindakan manusia.
  - marker: b
    text: Atau “dalam penanggalan tubuh dari daging” atau “dalam penanggalan tubuh yang bersifat daging.” Kata “daging” dapat memiliki nuansa moral, tetapi tidak diterjemahkan secara lebih interpretatif sebagai “tabiat berdosa.”
    reason: Frasa τοῦ σώματος τῆς σαρκός padat dan dapat dipahami dengan beberapa cara.
  - marker: c
    text: Atau “oleh sunat yang dilakukan Mesias” atau “dalam sunat yang dialami Mesias.” Ungkapan Yunaninya dapat menunjuk pada sunat yang dilakukan oleh, dimiliki oleh, atau dikaitkan dengan Mesias.
    reason: Genitif τοῦ Χριστοῦ memiliki lebih dari satu hubungan makna yang mungkin.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Di dalam Dia
  rationale: Kata ganti relatif ini menunjuk kepada Kristus dalam konteks sebelumnya. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan gagasan kesatuan dengan-Nya.
- source_word: περιετμήθητε
  choice: kamu juga telah disunat
  rationale: Bentuk aoristus pasif menyatakan tindakan yang telah dialami; istilah metaforis 'disunat' dipertahankan dan tidak diparafrasakan.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: dengan sunat yang tidak dilakukan oleh tangan manusia
  rationale: Datif dipahami secara instrumental atau asosiatif. Rumusan ini menyampaikan bahwa sunat tersebut bukan tindakan manusia tanpa mengaburkankan metaforanya.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: dalam penanggalan
  rationale: ἀπέκδυσις menunjuk pada tindakan menanggalkan atau melepaskan. 'Penanggalan' mempertahankan citra metaforis dan pengulangan ἐν.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: tubuh daging
  rationale: Ungkapan genitif yang sulit ini diterjemahkan cukup harfiah agar tidak dipersempit menjadi tubuh jasmani semata atau 'tabiat berdosa'.
- source_word: σαρκός
  choice: daging
  rationale: Padanan literal mempertahankan corak bahasa Paulus dan menghindari penafsiran doktrinal yang lebih sempit seperti 'tabiat berdosa'.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: dalam sunat Mesias
  rationale: 'Pengulangan ἐν diterjemahkan ''dalam'', sedangkan genitif τοῦ Χριστοῦ dibiarkan terbuka: sunat yang dilakukan oleh, dimiliki oleh, atau berkaitan dengan Mesias.'
theological_decisions:
- issue: Makna 'sunat Mesias'
  choice: 'Genitif terbuka: ''dalam sunat Mesias'''
  alternative: oleh sunat yang dilakukan Mesias; dalam sunat yang dialami Mesias; dalam sunat yang menjadi milik umat Mesias
  rationale: τοῦ Χριστοῦ dapat dipahami secara subjektif, objektif, posesif, atau asosiatif. Terjemahan tidak menetapkan satu tafsiran saja.
- issue: Makna 'tubuh daging'
  choice: Dipertahankan sebagai 'tubuh daging'
  alternative: tubuh jasmani; tubuh yang dikuasai daging; tabiat berdosa
  rationale: Frasa Yunani bersifat padat dan secara antropologis terbuka. Terjemahan mengikuti bacaan SBLGNT tanpa memasukkan perluasan dari varian naskah atau tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sunat' dipilih daripada 'penyunatan' untuk menjaga pengulangan istilah dan kelancaran. Kata 'Dia' dikapitalisasi menurut kebiasaan rujukan ilahi dalam bahasa Indonesia; tanda koma akhir dari fragmen sumber diganti titik karena ayat disajikan mandiri.
