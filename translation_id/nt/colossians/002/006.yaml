  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: id
  text: Karena itu, sebagaimana kamu telah menerima Mesias Yesus[a], Tuhan, hendaklah kamu hidup dalam Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus Yesus.”
    reason: alternatif terjemahan untuk Χριστὸν Ἰησοῦν; “Kristus” dapat dipahami sebagai bentuk gelar yang sudah sangat lazim digunakan bersama nama Yesus.
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Karena itu, sebagaimana
  rationale: οὖν menyatakan kesimpulan dari uraian sebelumnya, sedangkan ὡς menghubungkan cara mereka dahulu menerima Mesias dengan cara mereka harus terus hidup.
- source_word: παρελάβετε
  choice: kamu telah menerima
  rationale: Bentuk aoris menunjuk pada penerimaan yang telah terjadi. 'Menerima' tetap cukup luas untuk mencakup penerimaan terhadap pribadi Yesus dan pengajaran tentang-Nya tanpa mempersempit maknanya.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: Mesias Yesus
  rationale: Χριστός di sini memiliki daya sebagai gelar; 'Mesias' menerjemahkan makna gelar itu, sedangkan 'Yesus' mempertahankan nama pribadi.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: κύριος merupakan gelar kristologis. Dalam aposisi bahasa Indonesia, bentuk 'Mesias Yesus, Tuhan,' terasa alami dan tidak memerlukan artikel tersendiri.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Terjemahan ringkas ini mempertahankan keluasan bahasa kesatuan Paulus dan tidak membatasinya menjadi sekadar 'dalam persekutuan dengan Dia'.
- source_word: περιπατεῖτε
  choice: hendaklah kamu hidup
  rationale: Secara harfiah berarti 'berjalanlah', tetapi dalam konteks ini merupakan metafora bagi seluruh cara hidup. 'Hendaklah kamu hidup' menyampaikan imperatif berkelanjutan secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Daya gelar Χριστός dalam rangkaian τὸν Χριστὸν Ἰησοῦν
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Adanya artikel dan susunan aposisional mendukung pemahaman Χριστός sebagai gelar. 'Mesias' menyatakan arti gelar tersebut dan menghindari kesan bahwa 'Kristus' sekadar unsur nama.
- issue: Bahasa kesatuan Paulus dalam ἐν αὐτῷ
  choice: di dalam Dia
  alternative: dalam kesatuan dengan Dia
  rationale: Ungkapan Yunani singkat dan mengandung keluasan teologis. Bentuk 'di dalam Dia' mempertahankan ketegangan dan ambiguitas itu tanpa menambahkan penafsiran tertentu.
- issue: Metafora περιπατεῖτε
  choice: hendaklah kamu hidup
  alternative: berjalanlah
  rationale: Makna kontekstualnya ialah menjalani kehidupan atau berperilaku. Terjemahan idiomatis dipilih agar pembaca Indonesia tidak menangkapnya sebagai gerak fisik, sementara aspek cara hidup tetap jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan aposisional dipertahankan dengan koma untuk memperjelas bahwa 'Tuhan' adalah gelar bagi Mesias Yesus.
