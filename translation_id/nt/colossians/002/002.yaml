  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: id
  text: agar hati mereka dikuatkan, dipersatukan dalam kasih, dan agar mereka memperoleh segala kekayaan keyakinan penuh akan pengertian, sampai kepada pengenalan akan rahasia Allah, Mesias[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Teks Yunani di sini sangat ringkas: “rahasia Allah, Mesias.” “Mesias” mungkin dipahami sebagai aposisi yang mengidentifikasi rahasia Allah, tetapi teks Yunani tidak memakai kata “yaitu.”'
    reason: alternative_reading
  - marker: d
    text: Sejumlah naskah memuat bacaan yang lebih panjang, misalnya “rahasia Allah, yaitu Bapa, dan Mesias.” Terjemahan ini mengikuti bacaan pendek dalam teks Yunani yang diberikan.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: dikuatkan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penguatan dan peneguhan batin; “dikuatkan” lebih luas daripada sekadar “dihibur” dan wajar dipakai bagi hati.
- source_word: καρδίαι
  choice: hati
  rationale: Mempertahankan metafora antropologis yang lazim dalam bahasa Alkitab tanpa mempersempitnya menjadi pikiran atau perasaan saja.
- source_word: συμβιβασθέντες
  choice: dipersatukan
  rationale: Konteks “dalam kasih” mendukung arti dibawa bersama atau disatukan erat. Pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan metafora rajutan yang kurang idiomatis.
- source_word: ἐν ἀγάπῃ
  choice: dalam kasih
  rationale: Mempertahankan kasih sebagai lingkup atau ikatan tempat persatuan itu berlangsung.
- source_word: εἰς πᾶν πλοῦτος
  choice: supaya mereka memperoleh seluruh kekayaan
  rationale: Mengungkapkan arah menuju hasil atau tujuan yang terkandung dalam εἰς dengan susunan Indonesia yang alami.
- source_word: πληροφορίας τῆς συνέσεως
  choice: keyakinan penuh yang berasal dari pengertian
  rationale: πληροφορία menyatakan kepastian atau keyakinan yang mantap, sedangkan genitif συνέσεως dipertahankan tanpa mengubahnya menjadi sekadar banyaknya informasi.
- source_word: ἐπίγνωσιν
  choice: pengenalan
  rationale: “Pengenalan” menyampaikan pengetahuan yang bersifat penuh dan mendalam sekaligus tetap alami ketika diikuti “akan”.
- source_word: μυστηρίου
  choice: rahasia
  rationale: Dalam pemakaian Paulus, istilah ini menunjuk pada maksud ilahi yang dahulu tersembunyi dan kini dinyatakan. “Rahasia” lebih mudah dipahami pembaca Indonesia modern daripada serapan “misteri” tanpa menghilangkan nuansa tersebut.
- source_word: θεοῦ, Χριστοῦ
  choice: Allah, yaitu Mesias
  rationale: Χριστοῦ paling mungkin berfungsi sebagai aposisi yang mengidentifikasi rahasia Allah sebagai Mesias. “Yaitu” membuat hubungan sintaksis yang padat itu dapat dipahami, sementara catatan kaki mempertahankan keambiguan teks Yunani.
theological_decisions:
- issue: Hubungan aposisional dalam τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: “rahasia Allah, yaitu Mesias”
  alternative: “rahasia Allah, Mesias” atau bacaan naskah yang lebih panjang, “rahasia Allah, yaitu Bapa, dan Mesias”
  rationale: Teks Yunani yang diberikan paling wajar dipahami sebagai aposisi, tetapi bentuknya sangat ringkas. Terjemahan utama menjernihkan hubungan itu secukupnya dan catatan kaki menyatakan bahwa teks Yunani sendiri tidak memakai kata “yaitu”.
- issue: Nilai teologis μυστηρίου
  choice: “rahasia” sebagai maksud ilahi yang dinyatakan
  alternative: “misteri”
  rationale: Pilihan ini tidak menyiratkan sesuatu yang selamanya tidak dapat diketahui, tetapi mempertahankan gagasan Paulus tentang rahasia Allah yang disingkapkan dalam Mesias.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Struktur tujuan dalam ayat dipertahankan melalui “supaya” dan “hingga mencapai”; istilah abstrak dirangkai secara alami tanpa menghapus kepadatan teologis teks Yunani.
