    rationale: Teks SBLGNT berbunyi ringkas, “rahasia Allah, Mesias,” tanpa padanan eksplisit bagi “yaitu.” Karena konstruksinya sulit dan diperdebatkan, ambiguitasnya sebaiknya dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
