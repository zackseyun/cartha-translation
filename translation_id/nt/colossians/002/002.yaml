  source_fidelity: Draf menangkap unsur-unsur leksikal utama dengan baik, tetapi “sementara mereka dipersatukan” memberi hubungan waktu yang tidak dinyatakan oleh partisip Yunani συμβιβασθέντες. Selain itu, “yaitu Mesias” dalam teks utama menghilangkan kepadatan serta ambiguitas aposisional dari “τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ.”
  naturalness: Bahasa draf pada umumnya baku, tetapi rangkaian “seluruh kekayaan berupa keyakinan penuh yang berasal dari pengertian” terdengar terlalu eksplikatif dan menggeser hubungan genitif Yunani. Revisi mempertahankan kepadatan Paulus dengan konstruksi Indonesia yang tetap dapat dipahami.
  terminology: “Hati,” “kasih,” “pengenalan,” “rahasia,” “Allah,” dan “Mesias” tepat. “Keyakinan penuh akan pengertian” lebih dekat dengan πληροφορίας τῆς συνέσεως daripada “keyakinan penuh yang berasal dari pengertian.”
