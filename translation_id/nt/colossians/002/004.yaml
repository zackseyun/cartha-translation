  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: id
  text: Aku mengatakan hal ini agar tidak seorang pun memperdayakan kalian dengan argumen yang meyakinkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan argumen yang tampaknya masuk akal” atau “melalui perkataan yang meyakinkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hal ini
  rationale: Demonstrativa netral tunggal ini paling wajar menunjuk pada pernyataan atau rangkaian pemikiran sebelumnya; “hal ini” mempertahankan rujukannya tanpa mempersempit cakupannya.
- source_word: λέγω
  choice: Aku mengatakan
  rationale: Bentuk kini indikatif diterjemahkan secara langsung dan alami, sekaligus mempertahankan nada pribadi Paulus.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan; “supaya” alami dalam bahasa Indonesia modern dan mempertahankan daya telik konstruksi ini.
- source_word: μηδεὶς
  choice: jangan ada seorang pun
  rationale: Dalam konstruksi tujuan negatif, ungkapan ini menyampaikan larangan atau pencegahan terhadap siapa pun tanpa kecuali.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina orang kedua jamak ditampilkan secara eksplisit sebagai “kalian”, sesuai dengan sapaan kepada komunitas di Kolose.
- source_word: παραλογίζηται
  choice: memperdayakan
  rationale: Kata kerja ini menyatakan tindakan menyesatkan atau menipu melalui penalaran yang keliru; “memperdayakan” mempertahankan unsur tipu daya dan cocok dengan sarana yang disebut sesudahnya.
- source_word: ἐν πιθανολογίᾳ
  choice: dengan argumen yang meyakinkan
  rationale: ἐν menyatakan sarana atau cara, sedangkan πιθανολογία menunjuk pada ujaran atau argumentasi yang terdengar persuasif. Pilihan ini tidak menyiratkan bahwa argumen itu benar atau sahih.
theological_decisions:
- issue: Sifat peringatan dalam παραλογίζηται ἐν πιθανολογίᾳ
  choice: Peringatan umum agar pembaca tidak diperdayakan oleh argumentasi yang terdengar meyakinkan.
  alternative: Peringatan khusus terhadap filsafat palsu atau semata-mata terhadap kefasihan berbicara.
  rationale: Ayat ini sendiri tidak menyebut sistem ajaran tertentu. Terjemahan mempertahankan keluasan peringatan Yunani dan tidak memasukkan sasaran polemis yang lebih sempit dari konteks lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan “Aku” dan “kalian” yang alami serta jelas. Diksi “memperdayakan” bernada bermartabat dan mempertahankan gagasan penipuan melalui penalaran. Penanda catatan kaki [a] dicantumkan dalam teks utama.
