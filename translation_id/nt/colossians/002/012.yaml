source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: id
  text: Kamu telah dikuburkan bersama Dia dalam baptisan[a], dan di dalamnya kamu juga dibangkitkan bersama Dia melalui iman akan karya Allah[b], yang telah membangkitkan Dia dari antara orang mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, mungkin, “di dalam Dia,” jika kata ganti penghubung itu dianggap merujuk kepada Kristus, bukan kepada baptisan.
    reason: alternative_reading
  - marker: b
    text: Atau “melalui kepercayaan akan karya Allah.” Kata Yunani yang diterjemahkan “iman” dalam konteks tertentu juga dapat berarti “kesetiaan,” tetapi di sini “iman” merupakan terjemahan utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: Kamu telah dikuburkan bersama Dia
  rationale: Partisip aoris pasif menyatakan tindakan yang telah terjadi, sedangkan awalan συν- dan pronomina αὐτῷ mempertahankan gagasan kebersamaan dengan Kristus.
- source_word: ἐν τῷ βαπτισμῷ
  choice: dalam baptisan
  rationale: Mempertahankan ἐν sebagai 'dalam' dan tidak mempersempit nuansa lokatif-instrumentalnya menjadi teori tertentu tentang cara kerja baptisan.
- source_word: ἐν ᾧ
  choice: di dalamnya
  rationale: Secara sintaksis paling wajar merujuk kepada baptisan sebagai anteseden terdekat, sambil mencatat kemungkinan rujukan kepada Kristus.
- source_word: συνηγέρθητε
  choice: kamu juga dibangkitkan bersama Dia
  rationale: Bentuk aoris pasif orang kedua jamak diterjemahkan secara alami; 'bersama Dia' menyatakan daya awalan συν- dan tema persatuan dengan Kristus.
- source_word: διὰ τῆς πίστεως
  choice: melalui iman
  rationale: πίστις di sini terutama berarti iman sebagai sarana menerima atau mengambil bagian dalam karya Allah; 'kepercayaan' mungkin, tetapi kurang baku dalam konteks ini.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: kepada karya Allah
  rationale: ἐνέργεια menunjuk pada tindakan atau daya yang bekerja secara efektif. Dalam konstruksi 'iman kepada', bahasa Indonesia alami mengungkapkan objek iman tanpa menghilangkan gagasan aktivitas Allah.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: yang telah membangkitkan Dia dari antara orang mati
  rationale: Klausa relatif mempertahankan fungsi partisip artikular; 'dari antara orang mati' secara jelas menyampaikan ungkapan kebangkitan ἐκ νεκρῶν.
theological_decisions:
- issue: Rujukan ἐν ᾧ
  choice: 'Merujuk kepada baptisan: ''di dalamnya'''
  alternative: 'Merujuk kepada Kristus: ''di dalam Dia'''
  rationale: Anteseden terdekat secara tata bahasa ialah βαπτισμῷ, tetapi bentuk relatifnya memungkinkan pembacaan yang mengaitkannya dengan Kristus; alternatif ini dipertahankan dalam catatan kaki.
- issue: Makna bahasa baptisan
  choice: Mempertahankan kaitan kuat antara baptisan, penguburan bersama Kristus, kebangkitan bersama Kristus, dan iman
  alternative: Menentukan pembacaan sakramental yang kuat atau pembacaan yang semata-mata simbolis
  rationale: Ayat ini tidak menyelesaikan perdebatan teologis yang muncul kemudian. Terjemahan mempertahankan ketegangan teks tanpa memasukkan teori denominasi tertentu.
- issue: Hubungan iman dengan karya Allah
  choice: iman kepada karya Allah
  alternative: iman yang dikerjakan Allah atau iman akan kuasa Allah
  rationale: Genitif τῆς ἐνεργείας dapat dipahami sebagai genitif objektif setelah πίστις, yakni iman yang diarahkan kepada karya Allah. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyamakan ἐνέργεια begitu saja dengan kuasa abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina untuk Kristus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur dibuat sebagai satu kalimat yang mengalir alami sambil mempertahankan hubungan erat antara baptisan, iman, dan tindakan Allah.
