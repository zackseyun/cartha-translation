  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: id
  text: Peraturan-peraturan itu memang tampak bijaksana dalam ibadah yang dibuat sendiri[a], kerendahan hati, dan perlakuan keras terhadap tubuh. Namun, semuanya tidak ada gunanya untuk mengekang hawa nafsu daging[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ibadah yang ditetapkan sendiri”; secara harfiah dapat dipahami sebagai “ibadah menurut kehendak sendiri.”'
    reason: lexical_alternative
  - marker: b
    text: 'Klausa terakhir sulit ditafsirkan. Kemungkinan lain: “tidak dalam kehormatan apa pun, untuk pemuasan daging,” atau “tidak bernilai untuk menghadapi pemuasan daging.”'
    reason: alternative_reading
  - marker: c
    text: “Daging” di sini dapat menunjuk pada keinginan manusia yang telah jatuh ke dalam dosa, bukan sekadar tubuh jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Peraturan-peraturan itu
  rationale: Mengacu kembali pada larangan-larangan dalam ayat 21–22. Penyebutan eksplisit 'peraturan-peraturan' memperjelas rujukannya secara alami dalam bahasa Indonesia.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: memang tampak bijaksana
  rationale: Ungkapan ini menyatakan kesan atau reputasi sebagai sesuatu yang bijaksana, sedangkan μέν memberi nada konsesif yang kemudian dipatahkan oleh klausa terakhir.
- source_word: ἐθελοθρησκίᾳ
  choice: ibadah yang dibuat sendiri
  rationale: Istilah langka ini menunjuk pada ibadah yang berasal dari kehendak atau prakarsa manusia sendiri. Pilihan ini menjaga nuansa negatif tanpa memakai istilah teknis yang asing.
- source_word: ταπεινοφροσύνῃ
  choice: kerendahan hati
  rationale: Padanan leksikal langsung yang mempertahankan kemungkinan ironi kontekstual tanpa mengubahnya secara eksplisit menjadi 'merendahkan diri'.
- source_word: ἀφειδίᾳ σώματος
  choice: perlakuan keras terhadap tubuh
  rationale: Menyampaikan tindakan asketis yang tidak menyayangkan tubuh dengan bahasa Indonesia yang jelas dan wajar.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: semuanya tidak berguna
  rationale: Dalam konteks, frasa sulit ini dipahami sebagai penyangkalan nilai atau daya guna praktik-praktik tersebut, bukan sebagai perintah untuk tidak menghormati tubuh.
- source_word: πρὸς πλησμονὴν
  choice: untuk mengekang pemuasan keinginan
  rationale: 'Terjemahan ini mengikuti hubungan kontekstual: praktik asketis itu tidak efektif menghadapi atau membatasi pemuasan dorongan daging. Unsur ''keinginan'' ditambahkan secara idiomatis untuk memperjelas apa yang dipuaskan.'
- source_word: τῆς σαρκός
  choice: daging
  rationale: Mempertahankan istilah teologis Paulus dan ambiguitasnya; konteks memungkinkan makna dorongan manusia yang telah jatuh, tetapi hal itu tidak dimasukkan langsung ke dalam teks.
theological_decisions:
- issue: Makna klausa sulit οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Praktik asketis tersebut tidak berguna untuk mengekang pemuasan keinginan daging.
  alternative: Praktik itu tidak menghormati tubuh dan justru memuaskan daging; atau praktik itu tidak memberi kehormatan apa pun kepada tubuh dalam menghadapi pemenuhannya.
  rationale: Sintaksis Yunani sangat padat dan dapat dipahami dengan beberapa cara. Bacaan yang dipilih paling sesuai dengan alur kritik Paulus terhadap peraturan asketis yang tampak bijaksana tetapi tidak berdaya menghadapi dorongan daging. Bacaan alternatif dicatat karena ambiguitasnya nyata.
- issue: Makna σάρξ
  choice: daging
  alternative: keinginan manusia berdosa / tabiat berdosa
  rationale: Terjemahan harfiah menjaga rentang makna dan ketegangan teologis istilah Paulus tanpa secara diam-diam menyamakannya dengan tubuh fisik atau satu rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur konsesif dipertahankan dengan 'memang ... Namun'. Istilah 'daging' dipertahankan untuk menjaga kekhasan dan ambiguitas teologis σάρξ; klausa akhir diterjemahkan secara komunikatif, sementara alternatif sintaksis dicatat dalam catatan kaki.
