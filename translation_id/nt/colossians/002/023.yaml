revisions:
- from: Peraturan-peraturan itu memang tampak bijaksana karena ibadah yang dibuat sendiri[a], kerendahan hati, dan perlakuan keras terhadap tubuh. Namun, semuanya tidak berguna untuk mengekang pemuasan keinginan daging[b][c].
  to: Peraturan-peraturan itu memang tampak bijaksana dalam ibadah yang dibuat sendiri[a], kerendahan hati, dan perlakuan keras terhadap tubuh. Namun, semuanya tidak ada gunanya untuk mengekang hawa nafsu daging[b][c].
  rationale: Revisi mengganti “karena” dengan “dalam” agar fungsi ἐν lebih dekat dengan teks sumber. Klausa akhir tetap mengikuti pembacaan kontekstual yang dipilih dalam audit Inggris, tetapi dirumuskan secara lebih idiomatis dalam bahasa Indonesia. Catatan kaki b diperbaiki supaya alternatif pembacaannya tidak menambahkan unsur “hanya” dan tetap mencerminkan ambiguitas sintaksis yang nyata.
