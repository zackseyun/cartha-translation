    issue: Hubungan ἐν diterjemahkan “karena”.
    rationale: ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος lebih wajar diterjemahkan “dalam” atau “melalui/berupa” ketiga ciri tersebut; “karena” terlalu menekankan sebab.
  - severity: medium
    issue: Catatan kaki b menyatakan alternatif secara terlalu longgar dan memasukkan “hanya”.
    rationale: Klausa Yunani tidak memuat kata yang setara dengan “hanya”. Alternatif perlu mempertahankan ketidakpastian hubungan antara “kehormatan/nilai” dan “pemuasan daging”, tanpa menyatakan bahwa praktik itu “justru” atau “hanya” memuaskan daging.
