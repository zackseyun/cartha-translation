  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: id
  text: “Jangan pegang[a], jangan cicipi, jangan sentuh,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan sentuh, jangan cicipi, jangan sentuh.” Kata pertama (ἅψῃ) juga dapat diterjemahkan “sentuh” atau “memegang”; di sini diterjemahkan “pegang” untuk membedakannya dari kata terakhir, θίγῃς (“sentuh”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Jangan
  rationale: μή dengan bentuk subjungtif aoris menyatakan larangan; “jangan” merupakan bentuk larangan yang alami dan langsung dalam bahasa Indonesia.
- source_word: ἅψῃ
  choice: pegang
  rationale: Bentuk dari ἅπτω ini dapat berarti menyentuh atau memegang. “Pegang” mempertahankan perbedaannya dari θίγῃς, yang diterjemahkan “sentuh,” tanpa menghilangkan kemungkinan kontak fisik.
- source_word: μηδὲ
  choice: jangan
  rationale: Pengulangan “jangan” lebih alami daripada rangkaian “maupun” untuk tiga larangan singkat dalam bahasa Indonesia, sekaligus mempertahankan daya kumulatifnya.
- source_word: γεύσῃ
  choice: kecap
  rationale: γεύομαι secara langsung berarti mencicipi atau mengecap. “Kecap” menyampaikan tindakan merasakan dengan lidah tanpa memperluasnya menjadi “makan.”
- source_word: θίγῃς
  choice: sentuh
  rationale: θιγγάνω lazim berarti menyentuh. “Sentuh” tepat dan tetap membedakannya dari ἅψῃ yang diterjemahkan “pegang.”
theological_decisions:
- issue: Sifat larangan dalam konteks
  choice: Mempertahankan rangkaian larangan yang singkat dan menyerupai kutipan, tanpa tambahan penjelas.
  alternative: Menambahkan objek seperti “ini” atau “itu,” atau secara eksplisit mengaitkannya dengan peraturan manusia.
  rationale: Teks Yunani ayat ini hanya memuat tiga larangan yang ringkas. Menambahkan objek atau penjelasan kontekstual akan menafsirkan lebih jauh daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “jangan” mempertahankan irama larangan yang tajam; tanda koma akhir mengikuti sifat ayat yang berlanjut secara sintaksis ke konteks berikutnya.
