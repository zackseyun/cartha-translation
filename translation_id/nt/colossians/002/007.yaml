source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: id
  text: telah berakar dan sedang dibangun di dalam Dia, serta sedang diteguhkan dalam iman[a], sebagaimana kamu telah diajar, berlimpah dengan ucapan syukur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kepercayaan”; mungkin juga “dalam kesetiaan.” Kata Yunani pistis dapat berarti iman, kepercayaan, atau kesetiaan, tetapi di sini “iman” kemungkinan besar mengacu pada iman yang telah diajarkan kepada mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: telah berakar
  rationale: Partisip perfektum ini menggambarkan tindakan yang sudah terjadi dengan hasil yang terus berlangsung. Ungkapan ini mempertahankan metafora tumbuhan secara wajar dalam bahasa Indonesia.
- source_word: ἐποικοδομούμενοι
  choice: terus dibangun
  rationale: Partisip kini pasif menunjukkan proses yang sedang berlangsung. Pilihan ini mempertahankan metafora pembangunan dan membedakannya dari keadaan yang dihasilkan oleh tindakan sebelumnya.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Kata ganti ini merujuk kepada Kristus dalam konteks terdekat. Terjemahan tetap memakai kata ganti dan mempertahankan gagasan kesatuan atau keberadaan di dalam Dia, tanpa menggantinya dengan nama atau gelar.
- source_word: βεβαιούμενοι
  choice: diteguhkan
  rationale: Kata ini menyatakan bahwa mereka dibuat teguh atau kokoh. 'Diteguhkan' alami dalam konteks iman dan mempertahankan bentuk pasif.
- source_word: τῇ πίστει
  choice: dalam iman
  rationale: Artikel dan frasa berikutnya, 'sebagaimana kamu telah diajar,' mendukung pengertian iman sebagai ajaran atau kepercayaan yang telah mereka terima. Bahasa Indonesia tidak selalu memarkahi ketakrifan dengan kata sandang, sehingga 'dalam iman' lebih alami daripada 'dalam iman itu'; kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: καθὼς ἐδιδάχθητε
  choice: sebagaimana kamu telah diajar
  rationale: Pilihan ini mempertahankan hubungan perbandingan serta bentuk pasif aoristus, yang menunjuk kepada pengajaran yang telah mereka terima.
- source_word: περισσεύοντες
  choice: sambil melimpah
  rationale: Partisip kini aktif menyatakan keadaan berlimpah yang menyertai hal-hal sebelumnya. 'Melimpah' mempertahankan gambaran kelimpahan tanpa mengubahnya menjadi perintah tersendiri.
- source_word: ἐν εὐχαριστίᾳ
  choice: dengan ucapan syukur
  rationale: Walaupun ἐν secara harfiah dapat berarti 'di dalam,' ungkapan 'dengan ucapan syukur' lebih alami dalam bahasa Indonesia dan tetap menyampaikan sikap bersyukur yang menyertai kelimpahan tersebut.
theological_decisions:
- issue: Makna τῇ πίστει
  choice: iman, terutama sebagai kepercayaan atau ajaran yang telah diterima
  alternative: iman sebagai tindakan percaya pribadi; atau kesetiaan
  rationale: Artikel pada πίστις dan kaitannya dengan apa yang telah diajarkan cenderung menunjuk kepada isi iman yang diterima. Namun, istilah Yunani itu juga dapat menyatakan kepercayaan atau kesetiaan, sehingga ambiguitas yang nyata tidak dihapus dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian partisip dipertahankan agar ayat ini tetap terhubung secara gramatikal dengan perintah pada ayat sebelumnya. Metafora tumbuhan dan pembangunan tetap dipertahankan. Penanda catatan kaki ditempatkan sesudah 'iman', yaitu istilah yang diterangkan oleh catatan tersebut.
