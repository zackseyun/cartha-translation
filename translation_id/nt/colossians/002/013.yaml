id: COL.2.13
reference: Colossians 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: id
  text: Dan kamu, yang mati dalam pelanggaran-pelanggaranmu[a] dan dalam ketidakbersunatan dagingmu[b], telah dihidupkan-Nya bersama Dia dengan mengampuni kita segala pelanggaran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam kesalahan-kesalahanmu.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “ketidakbersunatan dagingmu” paling langsung menunjuk pada keadaan tubuh mereka yang tidak bersunat, tetapi dalam konteks ini juga dapat memiliki makna rohani.
    reason: cultural_note
  - marker: c
    text: 'Teks Yunani beralih dari “kamu” ke “kita”: “dengan mengampuni kita segala pelanggaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: yang dahulu mati
  rationale: Klausa relatif alami dalam bahasa Indonesia dan mempertahankan keadaan mati yang mendahului tindakan menghidupkan; 'dahulu' memperjelas hubungan waktunya tanpa mengubah makna.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: dalam pelanggaran-pelanggaranmu
  rationale: Mempertahankan ἐν dan gambaran keadaan mereka dalam ranah pelanggaran, bukan mempersempitnya menjadi sebab semata.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: dalam keadaan tidak bersunat secara jasmani
  rationale: Mengungkapkan keadaan tubuh yang tidak bersunat dengan bahasa Indonesia yang wajar, sambil tidak menafsirkannya sebagai 'tabiat berdosa'.
- source_word: συνεζωοποίησεν ... σὺν αὐτῷ
  choice: telah dihidupkan-Nya bersama Dia
  rationale: Mempertahankan tindakan Allah yang memberi hidup dan unsur kebersamaan dengan referen maskulin yang secara kontekstual adalah Kristus.
- source_word: χαρισάμενος
  choice: Ia telah mengampuni
  rationale: Klausa mandiri lebih jelas dalam bahasa Indonesia daripada konstruksi partisipial; makna pengampunan yang diberikan dengan murah hati tetap terwakili oleh verba 'mengampuni'.
- source_word: ἡμῖν
  choice: kita
  rationale: Mempertahankan peralihan nyata dari orang kedua jamak 'kamu' ke orang pertama jamak inklusif 'kita'.
- source_word: πάντα τὰ παραπτώματα
  choice: segala pelanggaran kita
  rationale: '''Segala'' menyampaikan totalitas πᾶς, sedangkan pengulangan ''pelanggaran'' menjaga konsistensi leksikal.'
theological_decisions:
- issue: Makna τῆς σαρκὸς ὑμῶν
  choice: jasmani, dengan rujukan langsung pada keadaan tubuh yang tidak bersunat
  alternative: tabiat berdosa atau makna rohani semata
  rationale: Konteks sunat dalam Kolose 2:11 mendukung makna tubuh yang konkret, tetapi catatan kaki mengakui bahwa ungkapan itu juga memiliki arti rohani dalam konteks ini.
- issue: Referen αὐτῷ dalam σὺν αὐτῷ
  choice: mempertahankan pronomina 'Dia', yang dalam konteks merujuk kepada Kristus
  alternative: mengganti langsung dengan 'Kristus' atau memahami referennya sebagai Allah
  rationale: Ayat sebelumnya berbicara tentang dibangkitkan bersama Kristus; pronomina dipertahankan agar tetap dekat dengan teks Yunani dan tidak menghapus bentuk acuannya.
- issue: Peralihan dari ὑμᾶς kepada ἡμῖν
  choice: mempertahankan 'kamu' lalu 'kita'
  alternative: menyeragamkan semuanya menjadi 'kamu' atau 'kita'
  rationale: Peralihan orang gramatikal terdapat dalam teks Yunani dan dapat mencerminkan perluasan cakupan dari jemaat Kolose kepada Paulus beserta semua orang percaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk pasif berakhiran -Nya mempertahankan fokus pada penerima tindakan sambil menyatakan Allah sebagai pelaku; pemenggalan menjadi dua kalimat menghindari susunan partisipial yang kaku.
