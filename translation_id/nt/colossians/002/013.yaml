  terminology: “Pelanggaran” konsisten untuk παράπτωμα. “Ketidakbersunatan” mempertahankan nomina abstrak ἀκροβυστία, dan “daging” mempertahankan σάρξ tanpa memasukkan penafsiran “tabiat berdosa.”
