id: COL.2.5
reference: Colossians 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: id
  text: Sebab, sekalipun aku tidak hadir secara jasmani[a], aku tetap bersama kalian dalam roh[b], sambil bersukacita dan melihat keteraturan kalian serta keteguhan[c] iman kalian kepada Mesias[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak hadir dalam daging.”
    reason: literal_rendering
  - marker: b
    text: Atau mungkin, “dalam Roh” (Roh Kudus).
    reason: theological_ambiguity
  - marker: c
    text: Atau, “kekokohan” atau “kemantapan.”
    reason: lexical_alternative
  - marker: d
    text: Atau mungkin, “kesetiaan kalian kepada Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ σαρκί
  choice: secara jasmani
  rationale: Dalam pertentangan dengan τῷ πνεύματι, frasa ini menunjuk pada ketidakhadiran Paulus secara fisik, bukan pada arti etis ‘tabiat berdosa’. Ungkapan ‘secara jasmani’ alami dalam bahasa Indonesia.
- source_word: τῷ πνεύματι
  choice: dalam roh
  rationale: Pertentangan dengan ketidakhadiran jasmani paling wajar menunjuk pada kehadiran nonfisik Paulus. Huruf kecil mempertahankan kemungkinan makna tanpa memastikan bahwa yang dimaksud adalah Roh Kudus.
- source_word: χαίρων καὶ βλέπων
  choice: Aku bersukacita melihat
  rationale: Kedua partisipel berlangsung bersamaan dengan kehadiran Paulus ‘dalam roh’. Susunan ini menyampaikan hubungan keduanya secara alami tanpa mengubah isi pujiannya.
- source_word: τὴν τάξιν
  choice: keteraturan
  rationale: Kata ini menyatakan keadaan yang tertib atau tersusun baik. ‘Keteraturan’ mempertahankan pujian Paulus tanpa memasukkan nuansa militer secara berlebihan.
- source_word: τὸ στερέωμα
  choice: keteguhan
  rationale: Kata ini menggambarkan kekokohan atau kestabilan. ‘Keteguhan’ berpadu alami dengan ‘iman’ dan mempertahankan gambaran tentang sesuatu yang mantap.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konstruksi ini, ‘iman’ merupakan padanan paling langsung dan wajar; kemungkinan nuansa ‘kesetiaan’ dipertahankan dalam catatan kaki.
- source_word: εἰς Χριστόν
  choice: kepada Mesias
  rationale: εἰς menandai arah atau sasaran iman, yang alami diterjemahkan ‘kepada’. Χριστός berfungsi sebagai gelar dan karena itu diterjemahkan ‘Mesias’.
theological_decisions:
- issue: Rujukan ‘roh’ dalam pertentangan antara jasmani dan roh
  choice: Paulus hadir bersama mereka dalam rohnya meskipun tidak hadir secara fisik.
  alternative: Paulus hadir bersama mereka dalam Roh Kudus.
  rationale: Pertentangan langsung dengan ketidakhadiran jasmani mendukung rujukan pada roh Paulus, tetapi bentuk Yunani tidak sepenuhnya menutup kemungkinan rujukan pada Roh Kudus; alternatif itu dicatat tanpa dipaksakan ke dalam teks utama.
- issue: Pemaknaan Χριστόν
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap jelas berfungsi sebagai gelar yang menjadi sasaran iman, sehingga ‘Mesias’ mempertahankan daya gelarnya.
- issue: Pemaknaan πίστις
  choice: iman kepada Mesias
  alternative: kesetiaan kepada Mesias
  rationale: ‘Iman’ adalah makna yang paling wajar dalam konstruksi εἰς Χριστόν, sedangkan kemungkinan nuansa kesetiaan tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. ‘Kalian’ dipakai untuk menandai bentuk jamak ὑμεῖς secara jelas. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami dalam bahasa Indonesia, tanpa menghilangkan hubungan antargagasan.
