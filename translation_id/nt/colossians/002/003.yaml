translation:
  language: id
  text: Di dalam Dia tersembunyi semua harta hikmat dan pengetahuan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalamnya”, jika yang dirujuk secara lebih luas adalah rahasia Allah, bukan Kristus secara pribadi.
    reason: alternative_reading
  - marker: b
    text: Atau “tersimpan”; kata sifat Yunani ini dapat menunjuk kepada sesuatu yang tersembunyi atau yang disimpan sebagai persediaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: di dalam Dia
  rationale: Kata ganti relatif datif tunggal ini paling wajar merujuk kepada tokoh personal yang disebut tepat sebelumnya, yaitu Kristus (2:2). Ungkapan ini mempertahankan nuansa lokatif ἐν dan acuan personalnya.
- source_word: πάντες οἱ θησαυροὶ
  choice: semua harta
  rationale: 'Artikel bersama nomina jamak mendukung pengertian kolektif yang definit: seluruh harta. Dalam bahasa Indonesia, ''semua harta'' menyampaikan cakupan menyeluruh secara alami.'
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: hikmat dan pengetahuan
  rationale: σοφία dan γνῶσις merupakan dua istilah yang berkaitan tetapi tetap berbeda; padanan ini mempertahankan keduanya tanpa meleburkan maknanya.
- source_word: ἀπόκρυφοι
  choice: tersembunyi
  rationale: Kata sifat ini dapat berarti tersembunyi atau tersimpan. 'Tersembunyi' adalah padanan langsung dan netral yang tidak menetapkan apakah harta itu tidak terjangkau atau tersimpan dengan aman.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: tersembunyi
  rationale: Konstruksi kopulatif dengan kata sifat predikatif diterjemahkan secara alami dalam bahasa Indonesia sebagai predikat 'tersembunyi'; kopula kala kini tidak perlu dinyatakan tersendiri.
theological_decisions:
- issue: Apakah ἐν ᾧ merujuk secara personal kepada Kristus atau secara lebih luas kepada rahasia Allah
  choice: Di dalam Dia, dengan acuan utama kepada Kristus
  alternative: Di dalamnya, jika antesedennya dipahami sebagai rahasia Allah
  rationale: Acuan personal kepada Kristus adalah yang paling dekat dan paling wajar secara sintaksis, tetapi kemungkinan acuan yang lebih luas tetap dicatat karena bentuk Yunaninya sendiri dapat menampungnya.
- issue: Apakah ἀπόκρυφοι menekankan kerahasiaan esoteris atau penyimpanan yang aman dalam Kristus
  choice: Diterjemahkan secara netral sebagai 'tersembunyi'
  alternative: '''tersimpan'' untuk menekankan bahwa harta itu disimpan atau tersedia di dalam Kristus'
  rationale: Konteks mungkin menentang klaim tentang pengetahuan khusus, tetapi kata sifat itu sendiri tidak mengharuskan satu penafsiran teologis tertentu. Terjemahan mempertahankan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. 'Di dalam Dia' dipilih daripada 'dalam-Nya' agar acuan personal jelas dan ungkapannya tetap alami; kapitalisasi 'Dia' menandai acuan kepada Kristus tanpa menambahkan tafsiran pada isi ayat.
