id: COL.2.9
reference: Colossians 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: id
  text: Sebab di dalam Dia berdiam seluruh kepenuhan ke-Allahan secara jasmani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh kepenuhan ke-Allahan berdiam di dalam Dia dalam wujud jasmani.”
    reason: Alternatif untuk menerjemahkan susunan kalimat dan adverbia σωματικῶς secara lebih eksplisit.
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Mengungkapkan hubungan sebab dengan peringatan atau nasihat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan ungkapan lokatif yang merujuk kepada Kristus tanpa menambahkan penegasan eksklusif yang tidak terdapat dalam bahasa Yunani.
- source_word: κατοικεῖ
  choice: berdiam
  rationale: Menyampaikan makna menetap atau tinggal secara tetap, serta mempertahankan bobot teologis ungkapan ini.
- source_word: πᾶν τὸ πλήρωμα
  choice: seluruh kepenuhan
  rationale: Menyatakan totalitas secara wajar dan ringkas dalam bahasa Indonesia.
- source_word: τῆς θεότητος
  choice: ke-Allahan
  rationale: θεότης menunjuk pada hakikat atau keadaan sebagai Allah, bukan sekadar sifat ilahi; 'ke-Allahan' mempertahankan daya istilah tersebut.
- source_word: σωματικῶς
  choice: secara jasmani
  rationale: Padanan adverbial yang langsung dan ringkas, tanpa membatasi maknanya hanya pada penjelmaan atau menafsirkannya secara sakramental.
theological_decisions:
- issue: Daya kristologis θεότης dan σωματικῶς
  choice: Ayat ini menegaskan bahwa seluruh kepenuhan ke-Allahan berdiam di dalam Kristus secara jasmani.
  alternative: Ayat ini hanya menyatakan bahwa sifat-sifat ilahi atau kehadiran Allah berdiam di dalam Kristus.
  rationale: θεότης merupakan istilah kuat bagi hakikat sebagai Allah, sedangkan σωματικῶς menyatakan keberdiaman itu secara jasmani. Terjemahan mempertahankan klaim kristologis ini tanpa memperlemah atau memperluasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Dia' memperjelas rujukan kepada Kristus. Istilah 'ke-Allahan' dipilih karena lebih tepat daripada 'keilahian', yang dapat dipahami hanya sebagai sifat ilahi.
