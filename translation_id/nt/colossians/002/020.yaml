revisions:
- from: Jika kamu telah mati bersama Kristus terhadap unsur-unsur dasar dunia ini[a], mengapa kamu, seolah-olah masih hidup menurut dunia ini, membiarkan dirimu dikenai berbagai peraturan?[b]
  to: 'Jika kamu telah mati bersama Kristus, terlepas dari unsur-unsur dasar dunia ini[a], mengapa kamu tunduk pada peraturan-peraturan, seolah-olah kamu hidup di dalam dunia?[b]:'
  rationale: Revisi memulihkan makna pemisahan dalam ἀπό, menghindari tambahan interpretatif pada ὡς ζῶντες ἐν κόσμῳ, dan tidak menambahkan “berbagai.” Bentuk “tunduk pada peraturan-peraturan” mempertahankan cakupan makna δογματίζεσθε dengan idiom Indonesia yang wajar. Titik dua mempertahankan hubungan ayat ini dengan kutipan ketetapan yang menyusul.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:04:30Z'
review_pass:
  verdict: revise
  source_fidelity: Perlu revisi. ἀπό terutama menyatakan pemisahan atau pelepasan, sehingga “terhadap” kurang tepat. Frasa “masih hidup menurut dunia ini” juga menambahkan unsur “masih” dan menggeser ἐν κόσμῳ (“di dalam dunia”) menjadi “menurut dunia ini.” Kata “berbagai” tidak ada dalam teks Yunani. Tanda titik dua lebih mencerminkan bahwa isi peraturan menyusul pada ayat 21.
  naturalness: Teks revisi tetap baku dan lancar dalam bahasa Indonesia modern. Susunan “mati bersama Kristus, terlepas dari ...” secara alami menyampaikan hubungan kematian dengan pemisahan yang ditandai ἀπό.
  terminology: “Kristus” adalah padanan yang mapan dan jelas untuk Χριστῷ. “Unsur-unsur dasar dunia” mempertahankan ambiguitas στοιχεῖα; alternatif mengenai roh-roh elemental dipertahankan dalam catatan. “Tunduk pada peraturan-peraturan” merupakan padanan alami untuk δογματίζεσθε tanpa memutuskan secara berlebihan antara nuansa pasif dan refleksif.
  issues:
  - severity: medium
    issue: ἀπό diterjemahkan “terhadap”.
    rationale: Preposisi ini menyatakan pemisahan “dari,” bukan terutama relasi oposisi “terhadap.”
  - severity: medium
    issue: “masih hidup menurut dunia ini” melebihi dan menggeser ὡς ζῶντες ἐν κόσμῳ.
    rationale: Teks Yunani berbunyi “seolah-olah hidup di dalam dunia”; “masih” dan “menurut” merupakan penambahan interpretatif.
  - severity: low
    issue: “berbagai peraturan” menambahkan kuantifikasi.
    rationale: δογματίζεσθε berbicara tentang tunduk pada ketetapan/peraturan, tanpa kata yang berarti “berbagai.”
  - severity: low
    issue: Tanda tanya tidak mengikuti kesinambungan sintaksis dengan ayat 21.
    rationale: Pertanyaan retoris ini memperkenalkan daftar ketetapan pada ayat berikutnya; titik dua lebih sesuai dengan tanda baca sumber dan alur kalimat.
