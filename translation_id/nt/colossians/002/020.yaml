id: COL.2.20
reference: Colossians 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: id
  text: 'Jika kamu telah mati bersama Kristus, terlepas dari unsur-unsur dasar dunia ini[a], mengapa kamu tunduk pada peraturan-peraturan, seolah-olah kamu hidup di dalam dunia?[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “asas-asas dasar dunia ini”; mungkin juga “roh-roh elemental dunia ini.”
    reason: alternative_reading
  - marker: b
    text: Atau “mengapa kamu membiarkan dirimu dikenai peraturan-peraturan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Jika
  rationale: Mempertahankan bentuk syarat dalam bahasa Yunani, meskipun dalam konteksnya Paulus tampaknya menganggap keadaan itu benar bagi para pembaca.
- source_word: ἀπεθάνετε
  choice: kamu telah mati
  rationale: Bentuk ini terdengar alami dalam bahasa Indonesia dan menyatakan peristiwa lampau yang hasilnya tetap berlaku.
- source_word: σὺν Χριστῷ
  choice: bersama Kristus
  rationale: Dalam pemakaian bahasa Indonesia Alkitabiah yang wajar, 'Kristus' mempertahankan gelar Χριστός dengan jelas dan bermartabat.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: terhadap unsur-unsur dasar dunia ini
  rationale: '''Terhadap'' mengungkapkan terputusnya hubungan melalui kematian, sedangkan ''unsur-unsur dasar'' cukup luas untuk tidak memastikan apakah yang dimaksud ialah asas-asas dasar, unsur-unsur, atau kuasa-kuasa roh.'
- source_word: τί
  choice: mengapa
  rationale: Padanan idiomatis bagi kata tanya yang memperkenalkan pertanyaan retoris ini.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: seolah-olah masih hidup menurut dunia ini
  rationale: '''Seolah-olah'' mempertahankan nuansa perbandingan; ''menurut dunia ini'' menyampaikan bahwa persoalannya bukan keberadaan jasmani di bumi, melainkan hidup di bawah tatanan dunia.'
- source_word: δογματίζεσθε
  choice: membiarkan dirimu dikenai berbagai peraturan
  rationale: Menjaga kemungkinan nuansa pasif sekaligus keterlibatan para pembaca tanpa menetapkan bentuk ini sebagai pasif murni atau refleksif murni.
theological_decisions:
- issue: Makna στοιχεῖα dalam pemakaian Paulus
  choice: unsur-unsur dasar dunia ini
  alternative: asas-asas dasar dunia ini; roh-roh penguasa dunia ini
  rationale: Istilah Yunani ini dapat menunjuk pada unsur atau asas dasar dan mungkin juga pada kuasa-kuasa kosmis. Teks utama mempertahankan keluasan maknanya, sedangkan alternatif dicatat tanpa memaksakan kosmologi tertentu.
- issue: Nuansa δογματίζεσθε
  choice: membiarkan dirimu dikenai berbagai peraturan
  alternative: menundukkan dirimu kepada berbagai peraturan; mengapa kamu dikenai berbagai peraturan?
  rationale: Bentuk Yunani dapat dipahami secara pasif atau dengan nuansa refleksif. Pilihan utama mempertahankan ketegangan antara tekanan dari luar dan keterlibatan pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kamu' dipakai secara alami; struktur pertanyaan retoris dipertahankan. Ayat diakhiri dengan tanda tanya sebagai ayat mandiri, meskipun isi peraturan diteruskan pada ayat berikutnya.
