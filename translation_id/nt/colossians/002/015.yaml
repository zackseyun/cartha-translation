- from: Setelah melucuti para penguasa dan para pemegang kuasa, Ia menjadikan mereka tontonan di depan umum dan membawa mereka dalam arak-arakan kemenangan-Nya di dalam Dia.[a]
  to: Ia melucuti para penguasa dan pihak-pihak berwenang, lalu menjadikan mereka tontonan di depan umum dan menang atas mereka di dalam Dia.[a]
  rationale: Revisi menghindari penambahan urutan waktu dan rincian bahwa pihak-pihak itu dibawa sebagai tawanan dalam prosesi, sambil mempertahankan gambaran kemenangan publik. Catatan kaki tetap diperlukan untuk kemungkinan rujukan ἐν αὐτῷ kepada Kristus atau salib.
