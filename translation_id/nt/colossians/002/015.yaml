  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: id
  text: Ia melucuti para penguasa dan pihak-pihak berwenang, lalu menjadikan mereka tontonan di depan umum dan menang atas mereka di dalam Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: melalui salib itu; bentuk Yunani dapat merujuk kepada Kristus atau kepada salib yang disebut dalam ayat sebelumnya.'
    reason: Menjaga ambiguitas rujukan ἐν αὐτῷ, yang secara gramatikal dapat merujuk kepada Kristus atau kepada salib.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: setelah melucuti
  rationale: Kata ini dapat menggambarkan tindakan menanggalkan atau merampasi; dalam konteks kemenangan atas kuasa-kuasa, “melucuti” menyampaikan bahwa kuasa mereka dirampas tanpa menghilangkan citra dasarnya.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: para penguasa dan para pemegang kuasa
  rationale: Mempertahankan dua sebutan yang sejajar bagi kuasa-kuasa personal tanpa memasukkan penafsiran tambahan ke dalam teks utama.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: menjadikan mereka tontonan di depan umum
  rationale: Menyampaikan tindakan mempertontonkan atau mempermalukan secara terbuka, dengan bahasa Indonesia yang jelas dan alami.
- source_word: θριαμβεύσας αὐτούς
  choice: membawa mereka dalam arak-arakan kemenangan-Nya
  rationale: Mempertahankan citra arak-arakan kemenangan Romawi yang terkandung dalam verba, dengan mereka tampil sebagai pihak yang telah dikalahkan.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mengikuti pembacaan pronominal maskulin yang merujuk kepada Kristus, sambil mencatat alternatif rujukan kepada salib dalam catatan kaki.
theological_decisions:
- issue: Subjek tindakan tidak disebutkan ulang dalam ayat Yunani
  choice: “Ia” dengan huruf kapital, mengikuti subjek ilahi dari konteks sebelumnya
  alternative: Kristus sebagai subjek langsung
  rationale: Rangkaian verba sejak konteks sebelumnya paling wajar meneruskan Allah sebagai pelaku, tetapi teks ayat ini sendiri tidak menyebutkan nama subjek; terjemahan tidak menambahkan nama yang akan menutup kemungkinan sintaksis tersebut.
- issue: Rujukan ἐν αὐτῷ
  choice: “di dalam Dia,” merujuk kepada Kristus
  alternative: “melalui salib itu” atau “di atas salib itu”
  rationale: Bentuk pronomina dapat dipahami sebagai rujukan personal kepada Kristus, selaras dengan lapisan konsultasi yang telah diaudit. Namun, karena σταυρός dalam ayat sebelumnya juga maskulin, alternatif rujukan kepada salib tetap merupakan kemungkinan nyata dan dicatat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Arak-arakan kemenangan” mempertahankan gambaran historis verba Yunani, sedangkan “tontonan di depan umum” mudah dipahami pembaca umum. Kapitalisasi “Ia” menandai rujukan ilahi tanpa menambahkan nama subjek yang tidak muncul dalam ayat Yunani.
