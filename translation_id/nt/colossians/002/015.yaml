review_pass:
  verdict: revise
  source_fidelity: Teks utama dengan tepat mempertahankan tindakan melucuti, mempermalukan secara terbuka, dan kemenangan atas para kuasa. Namun, frasa “membawa mereka dalam arak-arakan kemenangan-Nya” lebih spesifik daripada θριαμβεύσας αὐτούς dan menggeser fokus dari “menang atas mereka” kepada membawa tawanan dalam prosesi. Susunan “Setelah ... Ia ...” juga dapat dibaca sebagai urutan waktu yang tidak ditandai oleh partisip Yunani.
  naturalness: Bahasa umumnya jelas dan bermartabat, tetapi “para pemegang kuasa” kurang lazim dalam bahasa Indonesia modern, dan “di dalam Dia” setelah “arak-arakan kemenangan-Nya” terasa berat. Susunan kalimat yang direvisi lebih langsung dan alami.
  terminology: “Penguasa dan pihak-pihak berwenang” mempertahankan dua istilah Yunani yang sejajar tanpa menentukan identitasnya sebagai kuasa manusia atau roh. “Menang atas mereka” menyampaikan θριαμβεύσας αὐτούς secara akurat tanpa memaksakan rincian prosesi tawanan.
  issues:
  - severity: medium
    issue: Makna θριαμβεύσας αὐτούς terlalu diperinci sebagai membawa mereka dalam arak-arakan kemenangan.
    rationale: Verba ini memuat citra kemenangan/triumf dan dapat membangkitkan gambaran prosesi, tetapi dalam konstruksi ini terjemahan “menang atas mereka” secara langsung menyampaikan makna yang juga diikuti audit bahasa Inggris, tanpa menambahkan peran eksplisit mereka sebagai tawanan yang diarak.
  - severity: low
    issue: “Setelah melucuti” dapat memberi kesan urutan waktu yang terlalu tegas.
    rationale: Partisip aoris terutama menyertai verba utama dan tidak dengan sendirinya menuntut urutan temporal. Menghubungkan tindakan-tindakan itu sebagai predikat rangkaian menghindari penambahan ini.
  - severity: low
    issue: “Para pemegang kuasa” tidak idiomatis.
    rationale: “Pihak-pihak berwenang” lebih lazim dalam bahasa Indonesia modern dan tetap membedakan ἐξουσίας dari ἀρχάς.
  revised_text: Ia melucuti para penguasa dan pihak-pihak berwenang, lalu menjadikan mereka tontonan di depan umum dan menang atas mereka di dalam Dia.[a]
