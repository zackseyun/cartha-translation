    reason: Menjaga ambiguitas rujukan ἐν αὐτῷ, yang secara gramatikal dapat merujuk kepada Kristus atau kepada salib.
  revision_rationale: Revisi menghindari penambahan urutan waktu dan rincian bahwa pihak-pihak itu dibawa sebagai tawanan dalam prosesi, sambil mempertahankan gambaran kemenangan publik. Catatan kaki tetap diperlukan untuk kemungkinan rujukan ἐν αὐτῷ kepada Kristus atau salib.
