  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: id
  text: Ia telah menghapus surat utang yang merugikan kita, yang tercantum dalam ketetapan-ketetapan[a] dan menentang kita. Ia telah menyingkirkannya[b] dengan memakukannya pada salib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surat pengakuan utang” atau “catatan tertulis.” Secara harfiah, “dengan/dalam ketetapan-ketetapan”; frasa ini juga dapat dipahami sebagai dokumen yang berupa ketetapan-ketetapan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengambilnya dari tengah,” yaitu meniadakannya sebagai penghalang.
    reason: idiom
lexical_decisions:
- source_word: ἐξαλείψας
  choice: menghapus
  rationale: Kata ini menggambarkan penghapusan sesuatu yang tertulis; 'menghapus' alami dalam bahasa Indonesia dan mempertahankan citra dokumen.
- source_word: χειρόγραφον
  choice: surat utang
  rationale: Istilah ini dapat menunjuk pada dokumen tulisan tangan yang mengakui utang atau kewajiban. 'Surat utang' mempertahankan unsur dokumenter dan tanggungan tanpa menentukan bentuk hukum yang terlalu khusus.
- source_word: καθ’ ἡμῶν
  choice: yang mendakwa kita
  rationale: Secara harfiah berarti 'terhadap kita'. Dalam hubungan dengan surat utang, 'yang mendakwa kita' menyampaikan daya hukum yang merugikan, sementara nuansa pertentangan juga dinyatakan oleh klausa berikutnya.
- source_word: τοῖς δόγμασιν
  choice: dengan ketetapan-ketetapannya
  rationale: Datif ini sulit secara sintaksis dan mungkin menyatakan bahwa dokumen tersebut berisi atau diwujudkan dalam berbagai ketetapan. Terjemahan ini menjaga kaitannya dengan surat utang tanpa mengidentifikasinya secara khusus dengan hukum Musa.
- source_word: ὑπεναντίον
  choice: menentang kita
  rationale: Pilihan ini mempertahankan daya adversatif kata Yunani secara jelas dan wajar.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: telah menyingkirkannya
  rationale: Bentuk perfek menunjukkan tindakan tuntas dengan hasil yang tetap. 'Telah menyingkirkan' menyampaikan idiom penghilangan dari tengah atau peniadaan sebagai penghalang.
- source_word: προσηλώσας
  choice: dengan memakukannya
  rationale: Partisip aoris dapat menyatakan cara; konstruksi 'dengan memakukannya' alami dan menunjukkan bagaimana dokumen itu disingkirkan.
- source_word: τῷ σταυρῷ
  choice: pada salib
  rationale: Padanan baku dan jelas bagi σταυρός dalam konteks ini.
theological_decisions:
- issue: Makna χειρόγραφον τοῖς δόγμασιν
  choice: surat utang yang mendakwa kita dengan ketetapan-ketetapannya
  alternative: hukum Musa itu sendiri; daftar utang dosa; surat dakwaan hukum
  rationale: Ungkapan ini metaforis dan diperdebatkan. Terjemahan mempertahankan citra dokumen utang serta kaitannya dengan ketetapan, tanpa memasukkannya ke dalam satu sistem teologis tertentu.
- issue: Subjek tindakan menghapus dan menyingkirkan
  choice: Ia, yakni Allah dalam konteks kalimat yang lebih luas
  alternative: membiarkan pelaku tetap tersirat
  rationale: Bahasa Indonesia memerlukan konstruksi yang jelas; konteks sebelumnya menunjuk kepada Allah sebagai pelaku. Huruf kapital menandai rujukan pronominal kepada-Nya tanpa menambahkan nama ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibagi menjadi dua kalimat agar rangkaian partisip Yunani tetap mudah dipahami. Ambiguitas hubungan τοῖς δόγμασιν dengan χειρόγραφον dipertahankan melalui catatan kaki.
