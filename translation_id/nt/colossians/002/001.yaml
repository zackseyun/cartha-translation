  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: id
  text: Sebab aku ingin kamu mengetahui betapa besar perjuanganku bagi kamu, bagi mereka yang di Laodikia, dan bagi semua orang yang belum pernah melihat wajahku secara langsung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “wajahku dalam daging”; maksudnya, bertemu denganku secara jasmani atau secara langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: Sebab, aku ingin kamu mengetahui
  rationale: γάρ menghubungkan ayat ini dengan uraian sebelumnya dan wajar diterjemahkan "sebab". Konstruksi θέλω + akusatif + infinitif dinyatakan secara alami sebagai "aku ingin kamu mengetahui".
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: betapa berat perjuanganku
  rationale: ἡλίκον menekankan besarnya atau intensitas, sedangkan ἀγών menunjuk pada pergumulan atau perjuangan yang sungguh-sungguh. "Betapa berat perjuanganku" alami dalam bahasa Indonesia dan mempertahankan tekanannya.
- source_word: ὑπὲρ ὑμῶν
  choice: bagi kamu
  rationale: ὑπέρ di sini menyatakan kepentingan atau manfaat pihak lain. "Bagi kamu" ringkas dan sesuai konteks.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: mereka yang di Laodikia
  rationale: Artikel dengan frasa preposisional berfungsi substantival dan secara alami berarti orang-orang yang berada di Laodikia.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: semua orang yang belum pernah melihat
  rationale: ὅσοι memiliki cakupan inklusif, dipertahankan dengan "semua orang". Bentuk perfektum dan konteks pengalaman personal disampaikan dengan "belum pernah melihat".
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: wajahku secara langsung
  rationale: Secara harfiah frasa ini berbunyi "wajahku dalam daging", tetapi dalam konteks ini menunjuk pada perjumpaan dalam kehadiran jasmani. "Melihat wajahku secara langsung" menyampaikan idiom tersebut dengan jelas tanpa memberi kesan bahwa yang dipersoalkan hanya penglihatan fisik atas wajah.
theological_decisions:
- issue: Makna ἐν σαρκί dalam konteks kehadiran jasmani
  choice: secara langsung
  alternative: dalam keadaan jasmani; secara jasmani
  rationale: Di sini σάρξ tidak menunjuk pada sifat berdosa, melainkan kehadiran fisik Paulus. Terjemahan idiomatis "secara langsung" menjaga maksud konteks, sementara bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal "kamu" dipakai untuk ὑμᾶς sebagai sapaan kepada jemaat secara kolektif, selaras dengan kelaziman terjemahan Alkitab Indonesia. Tanda koma sebelum penanda catatan kaki mengikuti alur ayat yang berlanjut.
