translation:
  language: id
  text: dan di dalam Dia kamu telah dipenuhi[a]. Dia adalah kepala[b] atas setiap penguasa dan otoritas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dijadikan penuh” atau “dibawa kepada kepenuhan.”
    reason: lexical_alternative
  - marker: b
    text: “Kepala” mempertahankan metafora Yunani; maksudnya di sini ialah bahwa Dia berkuasa tertinggi atas setiap penguasa dan otoritas.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini dipertahankan untuk menunjukkan kesinambungan ayat dengan uraian sebelumnya.
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: kamu telah dipenuhi
  rationale: Bentuk perfektif pasif menyatakan tindakan yang telah terjadi dengan hasil yang tetap berlaku sekarang. Pilihan ini mempertahankan citra kepenuhan yang terkait dengan ayat sebelumnya.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Ungkapan ringkas Paulus tentang hubungan dan kesatuan orang percaya dengan Kristus dipertahankan tanpa mempersempit maknanya.
- source_word: ὅς ἐστιν
  choice: Dia adalah
  rationale: Rujukannya kepada Kristus dibuat jelas dan alami dalam bahasa Indonesia; pemisahan menjadi kalimat baru menghindari susunan relatif yang kaku.
- source_word: ἡ κεφαλή
  choice: kepala
  rationale: Metafora Yunani dipertahankan, bukan diganti langsung dengan tafsiran seperti 'penguasa tertinggi'.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: dari setiap pemerintah dan penguasa
  rationale: '''Setiap'' mempertahankan cakupan distributif πάσης. ''Pemerintah dan penguasa'' menyampaikan pasangan kuasa yang memerintah secara jelas bagi pembaca modern, termasuk dalam konteks kuasa-kuasa kosmis.'
theological_decisions:
- issue: Makna kepenuhan orang percaya di dalam Kristus
  choice: Orang percaya telah dipenuhi di dalam Kristus, dengan tetap mempertahankan kaitan pada kepenuhan yang ada dalam diri-Nya.
  alternative: Orang percaya sudah lengkap dan tidak kekurangan apa pun untuk keselamatan; atau telah mengambil bagian dalam kepenuhan ilahi.
  rationale: Terjemahan tidak menetapkan suatu sistem doktrinal tentang kesempurnaan tanpa dosa dan tidak mempersempit ungkapan ini menjadi status hukum semata.
- issue: Makna kepala atas kuasa-kuasa
  choice: Metafora 'kepala' dipertahankan, dengan konteks yang menunjukkan keutamaan Kristus atas semua pemerintah dan penguasa.
  alternative: '''Kepala'' dipahami terutama sebagai sumber atau asal mereka.'
  rationale: Dalam konteks Kolose tentang kuasa-kuasa kosmis, gagasan keutamaan paling kuat, tetapi teks utama tetap mempertahankan metafora asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara citra 'dipenuhi', ungkapan 'di dalam Dia', dan metafora 'kepala' dipertahankan.
