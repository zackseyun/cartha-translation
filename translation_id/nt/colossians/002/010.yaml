  source_fidelity: 'Bagian pertama, "dan di dalam Dia kamu telah dipenuhi," dengan baik menyampaikan καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι: bentuk pasif perfek dan motif kepenuhan tetap terjaga. Namun, "pemerintah dan penguasa" tidak selaras secara semantis maupun idiomatis dengan πάσης ἀρχῆς καὶ ἐξουσίας. ἀρχή dan ἐξουσία adalah dua kategori kuasa/otoritas; "pemerintah" lazim menunjuk institusi pemerintahan, sedangkan "penguasa" menunjuk pelaku, sehingga pasangannya tidak sejajar dan dapat menyempitkan cakupan kosmis konteks Kolose.'
