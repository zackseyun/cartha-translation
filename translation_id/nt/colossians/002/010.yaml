  terminology: '"Di dalam Dia," "dipenuhi," dan "kepala" tepat untuk mempertahankan ungkapan dan metafora Yunani. Mengganti pasangan terakhir dengan "setiap penguasa dan otoritas" menghasilkan pasangan nomina yang sejajar, modern, dan cukup luas tanpa menafsirkan secara denominatif.'
