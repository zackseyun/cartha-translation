  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: id
  text: Semua itu adalah bayangan dari hal-hal yang akan datang, tetapi tubuh itu milik Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara idiomatis dalam pertentangannya dengan “bayangan”: “tetapi wujud” atau “kenyataan itu milik Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: Semua itu
  rationale: Kata ganti relatif netral jamak ini merujuk kembali pada perkara makanan, minuman, hari raya, bulan baru, dan Sabat dalam ayat sebelumnya. “Semua itu” menyampaikan rujukan tersebut secara alami dalam bahasa Indonesia.
- source_word: σκιὰ
  choice: bayangan
  rationale: Pilihan ini mempertahankan gambaran asli dan pertentangannya dengan σῶμα.
- source_word: τῶν μελλόντων
  choice: dari hal-hal yang akan datang
  rationale: Ungkapan ini mempertahankan arah waktu ke masa depan tanpa menentukan secara sempit apakah yang dimaksud adalah penggenapan mesianik, kenyataan eskatologis, atau keduanya.
- source_word: δὲ
  choice: tetapi
  rationale: Kata ini menandai pertentangan antara bayangan dan wujud yang bersesuaian dengannya.
- source_word: σῶμα
  choice: wujudnya
  rationale: Secara harfiah berarti “tubuh”, tetapi dalam pertentangan dengan “bayangan” kata ini menunjuk pada wujud nyata yang menghasilkan atau bersesuaian dengan bayangan. “Wujudnya” menjaga metafora tetap jelas bagi pembaca Indonesia; arti harfiahnya dicatat dalam catatan kaki.
- source_word: τοῦ Χριστοῦ
  choice: adalah milik Mesias
  rationale: Genitif Yunani yang ringkas dipahami sebagai kepunyaan. “Mesias” mempertahankan fungsi Χριστός sebagai gelar, dan konstruksi ini tidak menambahkan klaim teologis yang melampaui teks.
theological_decisions:
- issue: Makna σῶμα dalam pertentangan dengan σκιά
  choice: Diterjemahkan secara metaforis sebagai “wujudnya”, yakni wujud nyata yang dipertentangkan dengan bayangan.
  alternative: “tubuh itu” atau “tubuhnya”, yang lebih harfiah dan membiarkan kemungkinan penafsiran lain lebih terbuka.
  rationale: Pertentangan bayangan–tubuh/wujud mendukung pengertian metaforis, tetapi kata Yunani tetap secara harfiah berarti “tubuh”. Karena itu, pilihan harfiah dipertahankan dalam catatan kaki agar ambiguitas sumber tidak hilang.
- issue: Fungsi Χριστοῦ
  choice: “Mesias” sebagai gelar.
  alternative: “Kristus”, bila dipahami sebagai sebutan yang sudah berfungsi seperti nama.
  rationale: Dalam konteks ini Χριστός dapat dibaca secara titular; “Mesias” menyatakan arti gelar tersebut tanpa memasukkan kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. “Semua itu” menghubungkan ayat ini secara alami dengan daftar pada ayat sebelumnya. Metafora bayangan–wujud dipertahankan, sedangkan bentuk yang lebih harfiah disediakan dalam catatan kaki.
