    rationale: Ungkapan ini menambahkan “segala” dan mengubah fokus dari tubuh yang dipasok/diperlengkapi secara pasif menjadi tubuh yang aktif menerima. “Diperlengkapi” lebih dekat pada bentuk dan cakupan istilah Yunani.
  - severity: low
