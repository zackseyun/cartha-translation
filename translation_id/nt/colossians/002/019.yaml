id: COL.2.19
reference: Colossians 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: id
  text: dan tidak berpegang teguh kepada Kepala[a], yang dari-Nya seluruh tubuh, melalui sendi-sendi dan ligamen-ligamen[b], diperlengkapi dan dipersatukan, lalu bertumbuh dengan pertumbuhan yang berasal dari Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melekat erat kepada Kepala.”
    reason: lexical_alternative
  - marker: b
    text: Atau “diberi asupan dan dirajut menjadi satu melalui sendi-sendi dan ligamen-ligamen.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bertumbuh dengan pertumbuhan Allah”; frasa ini kemungkinan berarti pertumbuhan yang berasal dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: berpegang teguh
  rationale: Partisip ini menyatakan keterikatan atau pegangan yang dipertahankan dengan kuat, bukan sekadar menyentuh atau memegang secara fisik.
- source_word: τὴν κεφαλήν
  choice: Sang Kepala
  rationale: Istilah ini mempertahankan metafora tubuh dan, dalam konteks, merujuk kepada Kristus. 'Sang' secara wajar menandai rujukan personal tanpa mengganti metaforanya.
- source_word: ἐξ οὗ
  choice: Dari Dialah
  rationale: Pronomina relatif maskulin tunggal merujuk kembali kepada Sang Kepala sebagai pribadi dan menyatakan sumber.
- source_word: πᾶν τὸ σῶμα
  choice: seluruh tubuh
  rationale: Ungkapan Indonesia yang alami untuk tubuh sebagai satu kesatuan utuh.
- source_word: διὰ τῶν ἁφῶν καὶ συνδέσμων
  choice: melalui sendi-sendi dan urat-urat pengikat
  rationale: Pilihan ini mempertahankan gambaran anatomis tentang titik-titik pertemuan dan unsur-unsur yang mengikat tubuh. 'Urat-urat pengikat' lebih mudah dipahami pembaca umum daripada istilah teknis 'ligamen'.
- source_word: ἐπιχορηγούμενον
  choice: menerima segala yang diperlukannya
  rationale: Partisip pasif ini menunjuk pada penyediaan atau penopangan bagi tubuh; ungkapan ini alami dalam bahasa Indonesia dan tidak membatasinya hanya pada makanan.
- source_word: συμβιβαζόμενον
  choice: dipersatukan
  rationale: Kata ini menyatakan bahwa bagian-bagian dibawa menjadi satu kesatuan yang padu; bentuk pasif Yunani tetap dipertahankan.
- source_word: αὔξει
  choice: bertumbuh
  rationale: Kata ini melanjutkan metafora tubuh secara alami.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: dengan pertumbuhan yang berasal dari Allah
  rationale: Genitif paling mungkin menyatakan sumber pertumbuhan. Terjemahan utama dibuat jelas dan alami, sementara bentuk harfiah yang tetap ambigu dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna genitif dalam τὴν αὔξησιν τοῦ θεοῦ
  choice: pertumbuhan yang berasal dari Allah
  alternative: pertumbuhan Allah
  rationale: Dalam konteks, tubuh memperoleh pertumbuhannya melalui Sang Kepala, sehingga genitif ini paling wajar dipahami sebagai sumber. Namun, karena bentuk Yunani secara harfiah hanya berbunyi 'pertumbuhan Allah', kemungkinan nuansa lain tidak dihapus dan dicatat dalam catatan kaki.
- issue: Identitas κεφαλή dalam metafora tubuh
  choice: Sang Kepala
  alternative: kepala
  rationale: Konteks Kolose merujuk kepada Kristus sebagai Kepala tubuh. Kapitalisasi dan penggunaan 'Sang' menandai rujukan personal, tanpa menambahkan gelar di luar metafora teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dibagi setelah 'Sang Kepala' agar rangkaian partisip Yunani tetap jelas. Metafora tubuh dipertahankan, sedangkan ungkapan penyediaan dibuat idiomatis tanpa menghilangkan bentuk pasif dan gagasan sumber ilahi.
