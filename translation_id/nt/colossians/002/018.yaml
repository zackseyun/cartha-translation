source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: id
  text: Janganlah seorang pun mendiskualifikasi kamu[a]—orang yang gemar pada kerendahan hati dan penyembahan kepada malaikat[b], yang mendalami apa yang telah dilihatnya[c]—dan yang secara sia-sia menjadi sombong oleh pikiran dagingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memutuskan melawan kamu sehingga kamu kehilangan hadiah”; dapat juga diterjemahkan “merampas hadiahmu.”
    reason: lexical_alternative
  - marker: b
    text: Frasa Yunani ini juga dapat dipahami sebagai “ibadah para malaikat” atau “beribadah bersama malaikat.”
    reason: alternative_reading
  - marker: c
    text: Kata kerja Yunani di sini jarang dan sulit; dapat juga diterjemahkan “berkutat pada” atau “memasuki apa yang telah dilihatnya.” Sebagian naskah berbunyi “apa yang tidak dilihatnya.”
    reason: lexical_and_textual_alternative
lexical_decisions:
- source_word: καταβραβευέτω
  choice: menggugurkan kamu dari hadiah
  rationale: Kata kerja ini menggambarkan keputusan seorang wasit yang merugikan seseorang sehingga ia kehilangan hadiah. Ungkapan ini mempertahankan citra pertandingan dengan bahasa Indonesia yang dapat dipahami.
- source_word: θέλων
  choice: karena ia menyukai
  rationale: Dalam susunan ini, partisip tersebut kemungkinan menunjukkan kesukaan atau kegemaran yang dipilih sendiri, bukan sekadar kehendak.
- source_word: ταπεινοφροσύνῃ
  choice: kerendahan hati
  rationale: Padanan leksikal langsung dipertahankan; konteks polemis membiarkan pembaca menangkap bahwa kerendahan hati tersebut mungkin dibuat-buat atau bersifat asketis.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: penyembahan kepada malaikat
  rationale: Genitif dipahami secara objektif dalam teks utama, yaitu penyembahan yang ditujukan kepada malaikat, sambil mempertahankan kemungkinan lain dalam catatan kaki.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: mendalami apa yang telah dilihatnya
  rationale: ἐμβατεύω jarang dan sulit. 'Mendalami' cukup alami serta mempertahankan gagasan memasuki, menekuni, atau berkutat pada pengalaman penglihatan tanpa terlalu memperinci tafsir.
- source_word: εἰκῇ
  choice: tanpa alasan
  rationale: Adverbia ini menunjukkan bahwa kesombongan tersebut tidak berdasar; padanan ini lebih alami daripada 'dengan sia-sia' dalam konteks ini.
- source_word: φυσιούμενος
  choice: menjadi sombong
  rationale: Metafora harfiah 'menggembung' kurang alami dalam bahasa Indonesia; 'menjadi sombong' menyampaikan maksud metaforis dengan jelas.
- source_word: νοὸς
  choice: pikiran
  rationale: Padanan langsung dan alami yang mempertahankan susunan ringkas sumber.
- source_word: σαρκὸς
  choice: daging
  rationale: Terjemahan harfiah mempertahankan ketegangan antropologis Paulus dan tidak memasukkan parafrasa doktrinal seperti 'natur berdosa'.
theological_decisions:
- issue: Makna θρησκείᾳ τῶν ἀγγέλων
  choice: penyembahan yang ditujukan kepada malaikat
  alternative: ibadah para malaikat; beribadah bersama malaikat
  rationale: Genitif Yunani sungguh ambigu. Teks utama memakai pembacaan objektif yang umum dan sesuai konteks peringatan, sedangkan kemungkinan subjektif dan asosiatif dicatat.
- issue: Makna σάρξ dalam τῆς σαρκὸς αὐτοῦ
  choice: daging
  alternative: natur berdosa; cara berpikir manusiawi
  rationale: Pilihan harfiah tidak mereduksi istilah Paulus menjadi rumusan doktrinal tertentu dan mempertahankan ketegangan dalam ungkapan sumber.
- issue: Varian tekstual ἃ ἑόρακεν / ἃ μὴ ἑόρακεν
  choice: apa yang telah dilihatnya
  alternative: apa yang tidak dilihatnya
  rationale: Teks utama mengikuti SBLGNT, sementara bacaan dengan negasi yang didukung sebagian naskah dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur kalimat dipecah secukupnya demi kejelasan, sementara istilah 'daging' dan ambiguitas tentang ibadah malaikat dipertahankan. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkan.
