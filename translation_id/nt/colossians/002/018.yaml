revisions:
- from: Jangan biarkan seorang pun menggugurkan kamu dari hadiah,[a] karena ia menyukai kerendahan hati dan penyembahan kepada malaikat,[b] serta mendalami apa yang telah dilihatnya.[c] Tanpa alasan ia menjadi sombong oleh pikiran dagingnya.
  to: Janganlah seorang pun mendiskualifikasi kamu[a]—orang yang gemar pada kerendahan hati dan penyembahan kepada malaikat[b], yang mendalami apa yang telah dilihatnya[c]—dan yang secara sia-sia menjadi sombong oleh pikiran dagingnya.
  rationale: Revisi mengganti hubungan kausal yang tidak tepat dengan klausa relatif yang mencerminkan partisip θέλων. Pilihan “mendiskualifikasi” dipertahankan sebagai padanan alami bagi καταβραβευέτω dan catatan kaki menjelaskan implikasi hadiah. Ambiguitas genitif mengenai malaikat, kesulitan ἐμβατεύων, serta varian tekstual tetap didokumentasikan. Tidak ada penafsiran doktrinal tambahan terhadap “daging.”
