  terminology: “Kerendahan hati,” “penyembahan kepada malaikat,” “pikiran,” dan “daging” dipertahankan. “Mendiskualifikasi” adalah serapan baku yang ringkas dan menyampaikan metafora keputusan melawan peserta; catatan kaki menjelaskan nuansa kehilangan hadiah.
