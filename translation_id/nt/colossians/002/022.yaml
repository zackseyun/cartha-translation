id: COL.2.22
reference: Colossians 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: id
  text: Semuanya itu akan binasa karena digunakan[a], sesuai dengan perintah dan ajaran manusia[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang semuanya binasa dalam pemakaian.” Bentuk ini lebih padat dan menekankan bahwa hal-hal yang diatur itu bersifat sementara serta dapat habis dikonsumsi.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “perintah dan ajaran manusia” kemungkinan menggemakan Yesaya 29:13 dan menegaskan bahwa berbagai aturan ini berasal dari manusia.
    reason: cross_reference
  - marker: c
    text: Secara harfiah, “dari manusia”; maksudnya ialah perintah dan ajaran yang bersumber dari manusia, bukan dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: Semuanya itu
  rationale: Kata ganti relatif netral jamak ini menunjuk kembali kepada hal-hal yang dilarang dalam ayat sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan rujukannya.
- source_word: ἐστιν πάντα εἰς φθοράν
  choice: akan binasa
  rationale: Ungkapan ini menyatakan bahwa semuanya menuju kebinasaan atau kelapukan. 'Akan binasa' ringkas, wajar, dan sesuai dengan sifat sementara benda-benda yang dimaksud.
- source_word: τῇ ἀποχρήσει
  choice: ketika digunakan
  rationale: ἀπόχρησις menunjuk pada pemakaian sampai habis atau konsumsi. Terjemahan ini mempertahankan hubungan bahwa benda-benda tersebut binasa dalam proses pemakaiannya tanpa mempersempit makna hanya pada makanan.
- source_word: κατὰ
  choice: sesuai dengan
  rationale: Kata ini memperkenalkan patokan atau dasar yang melandasi berbagai aturan tersebut.
- source_word: ἐντάλματα
  choice: perintah
  rationale: Pilihan ini mempertahankan sifat mengikat dan regulatif dari istilah Yunani serta cocok dengan kemungkinan gema Yesaya 29:13.
- source_word: διδασκαλίας
  choice: ajaran
  rationale: '''Ajaran'' merupakan padanan modern yang alami dan tidak memasukkan nuansa teknis doktrinal yang tidak diperlukan.'
- source_word: τῶν ἀνθρώπων
  choice: manusia
  rationale: Genitif ini menunjukkan sumber manusiawi dari perintah dan ajaran tersebut, sebagai kebalikan tersirat dari sumber ilahi. 'Manusia' bersifat umum dan tepat untuk ἀνθρώπων.
theological_decisions:
- issue: Hubungan klausa penjelas dengan berbagai peraturan asketis
  choice: Ayat ini menyatakan bahwa benda-benda yang dikenai larangan bersifat sementara dan bahwa aturan-aturan itu bersumber dari manusia.
  alternative: Klausa ini dapat dipahami sebagai kritik yang lebih langsung terhadap aturan-aturan itu sendiri karena aturan tersebut hanya mengurusi hal-hal yang habis ketika dipakai.
  rationale: Secara tata bahasa, bentuk netral jamak paling wajar menunjuk kepada benda-benda yang dilarang, sedangkan frasa berikutnya menggambarkan aturan itu sebagai perintah dan ajaran manusia. Terjemahan tidak mempersempit sasaran kritik Paulus lebih jauh daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dibuat ringkas agar berfungsi alami sebagai klausa penjelas yang melanjutkan konteks ayat sebelumnya. Istilah 'manusia' dipilih daripada bentuk bergender karena ἀνθρώπων di sini merujuk kepada umat manusia secara umum.
