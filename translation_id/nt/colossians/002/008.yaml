id: COL.2.8
reference: Colossians 2:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: id
  text: Berhati-hatilah supaya jangan ada seorang pun yang menawan kamu melalui filsafat dan tipu daya kosong, menurut tradisi manusia, menurut unsur-unsur dasar dunia[a], dan bukan menurut Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-roh unsur dunia.” Frasa Yunani ini dapat menunjuk pada unsur atau prinsip dasar, ataupun pada kuasa-kuasa rohani kosmis.
    reason: alternative_reading
  - marker: b
    text: 'Yunani: “Kristus,” yaitu “Yang Diurapi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Berhati-hatilah supaya jangan ada seorang pun
  rationale: Imperatif Βλέπετε menyampaikan peringatan yang berkelanjutan; bentuk ini alami dalam bahasa Indonesia dan μή τις dipertahankan sebagai ancaman yang mungkin muncul.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: yang menawan kamu
  rationale: Ungkapan perifrastis ini menunjuk pada orang yang akan membawa orang lain sebagai rampasan. 'Menawan' mempertahankan metafora penaklukan tanpa menjadi kaku.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: melalui filsafat dan tipu daya kosong
  rationale: διά menyatakan sarana, sedangkan kedua nomina dipertahankan sebagai unsur yang dikoordinasikan, tanpa memutuskan bahwa 'tipu daya kosong' pasti merupakan penjelasan aposisional bagi 'filsafat'.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: menurut tradisi manusia
  rationale: κατά menyatakan ukuran atau norma; 'manusia' bersifat generik dan tidak dibatasi pada laki-laki.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: menurut unsur-unsur dasar dunia
  rationale: στοιχεῖα dapat menunjuk pada unsur atau prinsip dasar, tetapi dalam konteks tertentu juga dapat dipahami sebagai kuasa-kuasa rohani kosmis. Pilihan utama ini tetap cukup luas, dan alternatif penting dicatat dalam catatan kaki.
- source_word: οὐ κατὰ Χριστόν
  choice: dan bukan menurut Mesias
  rationale: Χριστός adalah gelar yang berarti 'Yang Diurapi'. 'Mesias' mempertahankan fungsi gelarnya dalam kontras antara norma manusia/dunia dan Mesias.
theological_decisions:
- issue: Makna στοιχεῖα τοῦ κόσμου
  choice: unsur-unsur dasar dunia
  alternative: roh-roh unsur dunia; kuasa-kuasa rohani dunia
  rationale: Frasa Yunani ini diperdebatkan dan dapat menunjuk pada unsur atau prinsip dasar maupun kuasa kosmis. Teks utama tidak secara tegas mempersonifikasikannya, sedangkan catatan kaki mempertahankan kemungkinan tafsiran rohani.
- issue: Pemaknaan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός menjadi tolok ukur yang dikontraskan dengan tradisi manusia dan unsur-unsur dunia. 'Mesias' menampilkan arti gelarnya; bentuk Yunani yang lazim ditransliterasikan sebagai 'Kristus' dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'menurut ... menurut ... dan bukan menurut ...' dipertahankan untuk mencerminkan pengulangan κατά dalam bahasa Yunani. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
source_grounding:
  english_pob_role: consult_only
