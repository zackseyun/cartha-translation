  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: id
  text: Karena itu, janganlah seorang pun menghakimi kalian[a] dalam hal makanan atau minuman[b], atau berkenaan dengan hari raya, bulan baru, atau hari-hari Sabat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah seorang pun menjatuhkan penilaian atas kalian.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, dalam hal peraturan mengenai makanan dan minuman.
    reason: cultural_note
  - marker: c
    text: 'Urutan “hari raya, bulan baru, atau hari-hari Sabat” menggemakan kalender ibadah Yahudi: perayaan tahunan, bulanan, dan mingguan.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Karena itu, jangan biarkan seorang pun
  rationale: οὖν menyatakan kesimpulan dari uraian sebelumnya, sedangkan μή dengan imperatif orang ketiga membentuk larangan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sasaran larangan.
- source_word: ὑμᾶς κρινέτω
  choice: menghakimi kalian
  rationale: κρίνω di sini berarti menilai atau menjatuhkan penghakiman atas orang lain sehubungan dengan praktik tertentu. 'Kalian' mempertahankan bentuk jamak ὑμᾶς.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: mengenai makanan atau minuman
  rationale: βρῶσις dan πόσις dapat menunjuk pada tindakan makan dan minum atau pada makanan dan minuman. Dalam daftar pokok yang menjadi dasar penghakiman, arti kategori atau objek paling sesuai.
- source_word: ἐν μέρει ἑορτῆς
  choice: mengenai hari raya
  rationale: ἐν μέρει merupakan idiom yang berarti 'berkenaan dengan' atau 'dalam hal', sedangkan ἑορτή menunjuk pada perayaan keagamaan.
- source_word: νουμηνίας
  choice: bulan baru
  rationale: Istilah ini menunjuk pada perayaan bulanan pada bulan baru; bentuk ringkas tersebut juga lazim dalam daftar kalender ibadah Yahudi.
- source_word: σαββάτων
  choice: hari-hari Sabat
  rationale: Bentuk jamak Yunani dipertahankan dan dipahami sebagai berbagai hari Sabat atau perayaan Sabat dalam pola kalender tahunan, bulanan, dan mingguan.
theological_decisions:
- issue: Sifat praktik yang disebutkan
  choice: Ayat ini melarang orang lain menghakimi orang percaya dalam perkara makanan, minuman, dan kalender ibadah.
  alternative: Ayat ini secara mutlak menghapus semua praktik tersebut, atau hanya membahas peraturan asketis dan buatan manusia.
  rationale: Teks Yunani secara langsung berfokus pada tindakan menghakimi sehubungan dengan perkara-perkara ini. Ayat ini sendiri tidak menuntaskan perdebatan teologis yang lebih luas mengenai keberlanjutan atau keabsahan praktik tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa ὑμᾶς berbentuk jamak; 'hari-hari Sabat' mempertahankan jumlah gramatikal Yunani tanpa memaksakan kesimpulan doktrinal.
