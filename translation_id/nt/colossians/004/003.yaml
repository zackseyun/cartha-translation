  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: id
  text: Sambil berdoa, doakanlah juga untuk kami, supaya Allah membukakan bagi kami pintu untuk memberitakan firman, untuk menyampaikan rahasia Mesias. Karena rahasia itulah aku juga terbelenggu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: seraya berdoa juga untuk kami
  rationale: Partisipel kini melanjutkan nasihat pada ayat sebelumnya. “Seraya ... juga” menyampaikan kesinambungan, simultanitas, dan penambahan secara alami dalam bahasa Indonesia.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν
  choice: supaya Allah membukakan bagi kami
  rationale: ἵνα dengan subjungtif menyatakan isi atau tujuan doa; “supaya” mempertahankan nuansa permohonan. Bentuk “membukakan” wajar ketika penerima dinyatakan dengan “bagi kami”.
- source_word: θύραν τοῦ λόγου
  choice: pintu bagi firman
  rationale: Terjemahan ini mempertahankan metafora pintu sebagai jalan atau kesempatan yang dibuka, tanpa langsung menggantinya dengan parafrasa. “Firman” di sini menunjuk pada berita yang diberitakan.
- source_word: λαλῆσαι
  choice: sehingga kami dapat menyampaikan
  rationale: Infinitif ini menjelaskan tujuan atau hasil praktis dari pintu yang dibuka. “Menyampaikan” lebih alami daripada “berbicara” untuk pengungkapan sebuah berita, tanpa mempersempitnya menjadi istilah teknis berkhotbah.
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: rahasia tentang Mesias
  rationale: μυστήριον adalah rencana ilahi yang dahulu tersembunyi lalu dinyatakan; “rahasia” alami dalam bahasa Indonesia. Genitif τοῦ Χριστοῦ dapat menyatakan isi atau pokok, sehingga “tentang Mesias” dipilih sambil menjaga kemungkinan relasi lain dalam catatan.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: Karena rahasia itulah aku juga dipenjarakan
  rationale: διά dengan akusatif menyatakan sebab. Perfek pasif δέδεμαι menggambarkan keadaan terbelenggu yang berlanjut; dalam konteks Paulus, “dipenjarakan” menyampaikan maksud idiomatis dengan jelas.
theological_decisions:
- issue: Makna τοῦ Χριστοῦ
  choice: tentang Mesias
  alternative: milik Mesias / yang berkaitan dengan Mesias
  rationale: Genitif Yunani tidak harus dipersempit menjadi satu hubungan semantis. Dalam konteks pemberitaan, Mesias paling wajar dipahami sebagai pokok rahasia itu, tetapi catatan mempertahankan keluasan bentuk Yunani.
- issue: Rujukan ὃ dalam δι’ ὃ
  choice: rahasia itulah
  alternative: pemberitaan tentang rahasia itu
  rationale: Pronomina relatif netral tunggal paling dekat merujuk kepada μυστήριον. Pengulangan nomina dalam bahasa Indonesia memperjelas rujukan tanpa mengubah sebab pemenjaraan.
- issue: Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός tetap bermakna sebagai gelar bagi pribadi yang menjadi pokok rahasia, sehingga “Mesias” menyatakan nilai gelarnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “pintu” dipertahankan, sedangkan struktur Yunani yang kaku dibuat alami. Ayat ditutup dengan titik karena dapat berdiri sebagai kalimat Indonesia, meski dalam konteks Yunani merupakan kelanjutan nasihat sebelumnya.
