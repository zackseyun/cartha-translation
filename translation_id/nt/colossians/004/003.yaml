  to: Sambil berdoa, doakanlah juga untuk kami, supaya Allah membukakan bagi kami pintu untuk memberitakan firman, untuk menyampaikan rahasia Mesias. Karena rahasia itulah aku juga terbelenggu.
  rationale: Revisi mempertahankan struktur permohonan dan tujuan dalam bahasa Indonesia yang alami. “Pintu untuk memberitakan firman” mempertahankan metafora θύρα sambil membuat fungsi “firman” jelas dalam idiom Indonesia. “Rahasia Mesias” tidak membatasi genitif Yunani pada arti “tentang,” dan “terbelenggu” menerjemahkan δέδεμαι tanpa memperluasnya menjadi pemenjaraan. Catatan kaki dihapus karena makna yang sebelumnya dicatat kini dipertahankan secara langsung dalam teks utama dan catatan itu tidak perlu untuk pembacaan yang setia.
