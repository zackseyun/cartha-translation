id: COL.4.4
reference: Colossians 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/004.yaml
  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: id
  text: supaya aku menyatakannya dengan jelas[a], sebagaimana seharusnya aku berbicara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyingkapkannya” atau “memberitahukannya.” Akhiran “-nya” mengacu pada rahasia yang disebut dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagaimana aku harus berbicara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan dan mempertahankan daya telik frasa Yunani secara alami dalam bahasa Indonesia.
- source_word: φανερώσω
  choice: menyatakannya dengan jelas
  rationale: Mencakup gagasan membuat sesuatu nyata atau diketahui, sekaligus sesuai dengan konteks pemberitaan yang dapat dipahami. Alternatif leksikal dicatat karena verba ini juga dapat diterjemahkan 'menyingkapkannya' atau 'memberitahukannya'.
- source_word: αὐτὸ
  choice: -nya
  rationale: Mempertahankan bentuk pronominal teks Yunani; dalam konteks, acuannya adalah rahasia yang disebut pada ayat sebelumnya.
- source_word: ὡς
  choice: sebagaimana
  rationale: 'Menandai cara atau patokan: Paulus hendak berbicara dengan cara yang sesuai dengan keharusan yang dikenakan kepadanya.'
- source_word: δεῖ
  choice: seharusnya
  rationale: Mengungkapkan keharusan atau kewajiban dengan bahasa Indonesia yang wajar tanpa memperkeras nuansanya secara tidak perlu.
- source_word: με
  choice: aku
  rationale: Walaupun berbentuk akusatif dalam konstruksi Yunani, kata ini berfungsi sebagai subjek infinitif dan secara idiomatis diterjemahkan dengan pronomina subjek Indonesia.
- source_word: λαλῆσαι
  choice: berbicara
  rationale: Padanan langsung dan luas yang tidak menambahkan kekhususan 'memberitakan' yang tidak wajib terkandung dalam verba pada klausa ini.
theological_decisions:
- issue: Acuan pronomina αὐτό
  choice: Mempertahankan pronomina sebagai '-nya' dalam teks utama.
  alternative: Menggantikannya secara eksplisit dengan 'rahasia itu'.
  rationale: Teks Yunani memakai pronomina yang mengacu pada rahasia tentang Kristus dalam ayat sebelumnya; mempertahankan pronomina menjaga kohesi dan tidak membuat yang tersirat menjadi eksplisit.
- issue: Kadar keharusan dalam δεῖ
  choice: seharusnya
  alternative: harus
  rationale: Keduanya mungkin; 'seharusnya' mempertahankan kewajiban sambil membiarkan terbuka apakah tekanannya berupa kepatutan, panggilan, atau keharusan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' mengikuti suara pribadi Paulus. Susunan kalimat dibuat alami tanpa menghilangkan hubungan tujuan dan keharusan dalam bahasa Yunani.
