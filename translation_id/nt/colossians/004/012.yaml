id: COL.4.12
reference: Colossians 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: id
  text: Epafras, yang adalah salah seorang dari kalian, menyampaikan salam kepada kalian. Ia adalah hamba[a] Mesias, yang selalu bergumul bagi kalian dalam doa-doanya, supaya kalian berdiri sebagai orang-orang yang dewasa dan berkeyakinan penuh[b] dalam seluruh kehendak Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak.” Kata Yunani ini menyatakan bahwa seseorang sepenuhnya menjadi milik dan tunduk kepada tuannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “diteguhkan sepenuhnya.” Kata Yunani ini dapat menunjuk pada keyakinan penuh atau keadaan yang benar-benar mantap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: menyampaikan salam kepada
  rationale: Ungkapan surat-menyurat yang alami dalam bahasa Indonesia dan mempertahankan tindakan pribadi Epafras dalam memberi salam.
- source_word: ὁ ἐξ ὑμῶν
  choice: yang berasal dari antara kalian
  rationale: Menunjukkan bahwa Epafras berasal dari komunitas Kolose; frasa ini lebih tepat daripada sekadar menyatakan kesamaan kelompok secara umum.
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam bahasa Indonesia, 'hamba' secara alami mengungkapkan kepemilikan, ketundukan, dan pengabdian penuh dalam relasi religius, tanpa konotasi sosial modern yang dapat mendominasi kata 'budak'.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Menerjemahkan makna gelar Χριστός tanpa menambahkan nama Yesus, yang tidak terdapat dalam teks Yunani ayat ini.
- source_word: ἀγωνιζόμενος
  choice: bergumul
  rationale: Mempertahankan daya metaforis perjuangan dan usaha yang sungguh-sungguh, sekaligus cocok dengan konteks doa syafaat.
- source_word: ἐν ταῖς προσευχαῖς
  choice: dalam doa-doanya
  rationale: Bentuk jamak menyiratkan doa yang berulang, dan pronomina menjelaskan secara alami bahwa doa-doa itu dipanjatkan oleh Epafras.
- source_word: ἵνα σταθῆτε
  choice: supaya kalian berdiri teguh
  rationale: Mempertahankan gambaran 'berdiri'; 'teguh' mengungkapkan nuansa kestabilan yang wajar dari verba dalam konteks ini.
- source_word: τέλειοι
  choice: sebagai orang-orang yang dewasa
  rationale: Dalam konteks Paulus, kata ini menunjuk pada kematangan atau kelengkapan rohani, bukan kesempurnaan tanpa dosa.
- source_word: πεπληροφορημένοι
  choice: berkeyakinan penuh
  rationale: Mengungkapkan keadaan keyakinan yang mantap sebagai nilai leksikal utama bentuk partisip ini, dengan kemungkinan alternatif dicatat dalam catatan kaki.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: dalam seluruh kehendak Allah
  rationale: Terjemahan cukup formal ini mempertahankan keluasan dan ambiguitas hubungan frasa tersebut dengan kematangan serta keyakinan penuh.
theological_decisions:
- issue: Makna dan bentuk Χριστοῦ dalam δοῦλος Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός diterjemahkan sebagai gelar 'Mesias' untuk menyampaikan maknanya, dan nama 'Yesus' tidak ditambahkan karena tidak ada dalam teks Yunani.
- issue: Penerjemahan δοῦλος
  choice: hamba
  alternative: budak
  rationale: '''Hamba'' merupakan istilah Indonesia yang bermartabat dan lazim bagi ketundukan serta kepemilikan total dalam hubungan dengan Allah atau Mesias; alternatif harfiah dicatat karena δοῦλος lebih kuat daripada pelayan biasa.'
- issue: Arti πεπληροφορημένοι
  choice: berkeyakinan penuh
  alternative: diteguhkan sepenuhnya
  rationale: Kata ini dapat menekankan kepastian batin atau keadaan yang telah mantap. Teks utama memilih nuansa keyakinan, sedangkan kemungkinan statif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak diterjemahkan dengan 'kalian' agar jelas dan mudah dipahami. Kalimat Yunani dipecah menjadi dua kalimat untuk keterbacaan tanpa mengubah hubungan maknanya; setiap penanda catatan kaki muncul dalam teks utama.
