  rationale: 'Revisi mempertahankan urutan dan daya perintah Yunani: kondisi waktu (ὅταν), pembacaan komunitas di Kolose (παρ’ ὑμῖν), perintah untuk memastikan dua hasil (ποιήσατε ἵνα ... καὶ ... ἵνα), serta rujukan netral kepada surat "dari Laodikia" (τὴν ἐκ Λαοδικείας). Tidak ada identifikasi historis atau kanonis yang ditambahkan.'
