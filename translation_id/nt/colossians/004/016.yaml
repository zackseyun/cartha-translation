id: COL.4.16
reference: Colossians 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: id
  text: Dan apabila surat ini telah dibacakan di antara kalian, pastikanlah agar surat ini juga dibacakan dalam jemaat Laodikia dan agar kalian juga membaca surat dari Laodikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas surat ini tidak pasti. Ungkapan Yunaninya secara harfiah berarti “yang dari Laodikia” dan dapat menunjuk pada surat yang berasal dari atau diteruskan dari sana, bukan harus surat yang semula ditujukan kepada jemaat Laodikia.
    reason: historical_and_lexical_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: dibacakan / membaca
  rationale: ἀναγινώσκω berarti membaca dan dalam konteks pertemuan jemaat lazim menunjuk pada pembacaan kepada komunitas. Bentuk “dibacakan” menyampaikan konteks komunal secara alami dalam bahasa Indonesia, sedangkan “membaca” mempertahankan bentuk aktif pada perintah terakhir.
- source_word: παρ’ ὑμῖν
  choice: di antara kalian
  rationale: Frasa ini bersifat lokatif-sosial dan menunjuk pada pembacaan surat di tengah komunitas penerima, bukan semata-mata pada pelaku pembacaan.
- source_word: ἡ ἐπιστολή
  choice: surat ini
  rationale: Artikel menunjuk pada surat yang sedang dikirim kepada jemaat Kolose; “surat ini” membuat rujukan deiktis tersebut jelas dan alami.
- source_word: ποιήσατε ἵνα
  choice: pastikanlah agar
  rationale: Gabungan imperatif ποιήσατε dengan ἵνα menyatakan desakan untuk menjamin terlaksananya tindakan berikutnya. “Pastikanlah agar” mempertahankan daya perintah tanpa terjemahan harfiah yang kaku.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: dalam jemaat orang-orang Laodikia
  rationale: ἐκκλησία dalam konteks Paulus diterjemahkan “jemaat,” dan bentuk genitif Λαοδικέων dipertahankan sebagai komunitas yang terdiri dari orang-orang Laodikia.
- source_word: τὴν ἐκ Λαοδικείας
  choice: surat yang datang dari Laodikia
  rationale: Kata “surat” tersirat dari konteks dalam bahasa Yunani dan perlu dinyatakan agar bahasa Indonesia alami. ἐκ dipertahankan dengan arti asal atau pergerakan “dari,” tanpa menganggap surat itu semula ditujukan kepada Laodikia.
theological_decisions:
- issue: Identitas surat yang datang dari Laodikia
  choice: Tidak mengidentifikasinya dengan surat tertentu; diterjemahkan secara netral sebagai “surat yang datang dari Laodikia.”
  alternative: Surat Paulus kepada jemaat Laodikia; surat yang dikirim dari Laodikia; atau surat edaran yang berkaitan dengan Laodikia, mungkin Efesus.
  rationale: Teks Yunani hanya menyebut hubungan surat itu dengan Laodikia melalui ἐκ dan tidak menetapkan identitas, alamat tujuan, atau status kanonisnya. Terjemahan tidak boleh memastikan rekonstruksi sejarah tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. Kata ganti “kalian” dipakai karena bentuk Yunani jamak dan ditujukan kepada seluruh jemaat. “Jemaat” dipilih alih-alih “gereja” untuk menonjolkan komunitas orang percaya yang berkumpul. Tanda catatan kaki ditempatkan langsung pada frasa yang identitasnya tidak pasti.
