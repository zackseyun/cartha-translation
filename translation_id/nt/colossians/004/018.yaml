  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: id
  text: Salam ini kutulis dengan tanganku sendiri—Paulus.[a] Ingatlah belengguku.[b] Anugerah menyertai kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara dekat, “Salam dengan tanganku sendiri—Paulus.” Artinya, salam penutup ini ditulis sendiri oleh Paulus.
    reason: lexical_alternative
  - marker: b
    text: Atau “pemenjaraanku” atau “ikatanku.” Secara harfiah, “belenggu-belengguku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: salam
  rationale: Dalam konteks surat, kata ini menunjuk pada salam penutup. “Salam” alami dalam bahasa Indonesia modern dan tidak seformal “salutasi”.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: kutulis dengan tanganku sendiri—Paulus
  rationale: Frasa datif yang eliptis ini menunjukkan bahwa salam penutup tersebut ditulis langsung dengan tulisan tangan Paulus. Kata kerja “kutulis” disuplai agar wajar dalam bahasa Indonesia, sementara nama “Paulus” tetap berfungsi sebagai penegasan atau tanda tangan.
- source_word: μνημονεύετέ
  choice: Ingatlah
  rationale: Imperatif kini ini dapat menyiratkan tindakan yang terus dilakukan, tetapi “Ingatlah” merupakan bentuk nasihat yang alami dan tidak menerjemahkan aspek secara berlebihan.
- source_word: μου τῶν δεσμῶν
  choice: belengguku
  rationale: δεσμοί secara konkret berarti belenggu atau ikatan dan secara metonimis menunjuk pada pemenjaraan. “Belengguku” mempertahankan gambaran jasmani yang kuat dari teks Yunani.
- source_word: ἡ χάρις
  choice: Anugerah
  rationale: Ini merupakan berkat penutup khas Paulus. “Anugerah” menyampaikan χάρις secara wajar tanpa menambahkan sumber anugerah yang tidak dinyatakan secara eksplisit.
- source_word: μεθ’ ὑμῶν
  choice: menyertai kalian
  rationale: Bahasa Indonesia memerlukan predikat yang wajar untuk ungkapan berkat tanpa verba ini. “Menyertai kalian” menangkap arti ‘bersama kamu sekalian’ dan memperjelas bahwa ὑμῶν berbentuk jamak.
theological_decisions:
- issue: Berkat penutup tanpa verba eksplisit
  choice: Anugerah menyertai kalian
  alternative: Anugerah beserta kalian
  rationale: Teks Yunani tidak memiliki verba. “Menyertai” disuplai untuk menghasilkan berkat yang alami dalam bahasa Indonesia tanpa menambah isi teologis.
- issue: Rujukan konkret atau metonimis dari δεσμοί
  choice: belengguku
  alternative: pemenjaraanku
  rationale: Terjemahan konkret mempertahankan citra asli dan tetap memungkinkan pembaca memahami bahwa Paulus sedang dipenjara, tanpa mereduksi ketegangan antara benda fisik dan keadaan tahanan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. Bentuk “kalian” dipakai untuk menyatakan dengan jelas bahwa kata ganti Yunani berbentuk jamak; “kutulis” mempertahankan suara orang pertama Paulus secara alami.
