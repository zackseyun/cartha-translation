  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: id
  text: Sampaikan salam kepada saudara-saudara seiman di Laodikia, juga kepada Nimfa dan jemaat di rumahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani yang dipakai di sini menyebut Nimfa dan jemaat di rumahnya; kata ganti itu berbentuk feminin tunggal. Sebagian naskah atau bacaan lain mendukung “Nimfas” dan “jemaat di rumahnya” dengan kata ganti maskulin; yang lain mendukung “jemaat di rumah mereka”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Sampaikan salam kepada
  rationale: Imperatif aoristus ini memerintahkan para penerima surat untuk menyampaikan salam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: saudara-saudara seiman di Laodikia
  rationale: ἀδελφοὺς secara gramatikal berbentuk maskulin jamak, tetapi dalam pemakaian Paulus dapat mencakup sesama orang percaya laki-laki dan perempuan. 'Saudara-saudara seiman' mempertahankan metafora kekerabatan sekaligus memperjelas cakupan komunitas iman.
- source_word: Νύμφαν
  choice: Nimfa
  rationale: Teks SBLGNT memakai Νύμφαν, bentuk akusatif yang paling langsung dipahami sebagai nama perempuan, Nympha; bentuk nama diindonesiakan secara wajar menjadi 'Nimfa'.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: jemaat yang ada di rumahnya
  rationale: Ungkapan κατ’ οἶκον menunjuk kepada komunitas yang berhimpun di sebuah rumah. Terjemahan ini jelas dan alami tanpa menambahkan kata 'beribadah' atau rincian lain yang tidak dinyatakan secara eksplisit.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Dalam konteks surat Paulus, ἐκκλησία menunjuk kepada komunitas orang percaya. 'Jemaat' lebih tepat daripada kata yang dapat dipahami terutama sebagai gedung gereja.
theological_decisions:
- issue: Identitas atau gender Νύμφαν dan kata ganti yang menyertainya
  choice: Nimfa ... rumahnya, dengan catatan bahwa kata ganti Yunani dalam teks utama berarti 'rumah perempuan itu'
  alternative: Nimfas ... rumah laki-laki itu; atau rumah mereka
  rationale: Teks cetak SBLGNT memiliki αὐτῆς, kata ganti feminin tunggal, sehingga mendukung 'Nimfa' dan 'rumahnya'. Karena bahasa Indonesia tidak membedakan gender dalam akhiran '-nya', catatan kaki menjelaskan bentuk feminin teks Yunani dan mencatat varian maskulin serta jamak tanpa menyelesaikan ketegangan tekstual secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. 'Sampaikan salam' dipilih sebagai idiom alami, sedangkan 'jemaat' menghindari kesan bahwa yang dimaksud adalah bangunan. Penanda catatan kaki ditempatkan langsung dalam teks utama.
