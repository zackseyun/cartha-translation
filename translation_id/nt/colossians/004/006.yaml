  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: id
  text: Hendaklah perkataan kalian selalu penuh dengan kasih karunia[a], dibumbui dengan garam[b], supaya kalian tahu bagaimana seharusnya menjawab setiap orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ramah” atau “penuh kemurahan”. Ungkapan ini dapat menunjuk pada perkataan yang bercirikan keramahan, kebaikan, atau kemurahan.
    reason: lexical_alternative
  - marker: b
    text: “Dibumbui dengan garam” adalah metafora bagi perkataan yang tepat, menarik, dan bijaksana—tidak hambar ataupun merusak.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: perkataan kalian
  rationale: Dalam konteks nasihat ini, frasa tersebut menunjuk pada cara orang percaya berbicara. “Perkataan kalian” alami dalam bahasa Indonesia dan cukup luas untuk mencakup tutur kata serta percakapan.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan temporal yang langsung dan mempertahankan cakupan menyeluruh dari nasihat ini.
- source_word: ἐν χάριτι
  choice: penuh kasih karunia
  rationale: Ungkapan ini menggambarkan perkataan yang bercirikan kemurahan dan keramahan, sambil tetap mempertahankan gema teologis χάρις sebagai kasih karunia.
- source_word: ἅλατι ἠρτυμένος
  choice: dibumbui dengan garam
  rationale: 'Terjemahan ini mempertahankan metafora kuliner dan hasil keadaan yang dinyatakan oleh bentuk partisip perfek: perkataan itu memiliki mutu seperti makanan yang telah dibumbui.'
- source_word: εἰδέναι
  choice: supaya kalian tahu
  rationale: Infinitif ini memiliki hubungan sintaksis yang tidak sepenuhnya pasti dengan nasihat sebelumnya. Bentuk tujuan “supaya” menghasilkan bahasa Indonesia yang jelas tanpa memutus kaitannya dengan nasihat tersebut.
- source_word: πῶς δεῖ
  choice: bagaimana seharusnya
  rationale: Pilihan ini menyampaikan cara yang patut atau perlu, tanpa memperkeras δεῖ menjadi kewajiban mutlak yang melampaui nada konteks.
- source_word: ἑνὶ ἑκάστῳ
  choice: setiap orang
  rationale: Padanan ini mempertahankan daya distributif ungkapan Yunani, yakni jawaban yang sesuai kepada masing-masing pribadi.
- source_word: ἀποκρίνεσθαι
  choice: menjawab
  rationale: Padanan langsung yang sesuai dengan latar percakapan dan tindakan memberikan jawaban kepada orang lain.
theological_decisions:
- issue: Cakupan makna χάρις dalam ἐν χάριτι
  choice: penuh kasih karunia
  alternative: ramah / penuh kemurahan
  rationale: Pilihan utama mempertahankan kemungkinan makna interpersonal—tutur kata yang baik dan menyenangkan—serta gema khas Paulus tentang kasih karunia, tanpa membatasi frasa itu pada salah satu makna saja.
- issue: Hubungan sintaksis εἰδέναι dengan nasihat sebelumnya
  choice: supaya kalian tahu
  alternative: sehingga kalian tahu / dengan mengetahui
  rationale: Infinitif dapat dipahami bernuansa tujuan atau hasil. Terjemahan utama memakai tujuan karena paling alami dalam bahasa Indonesia, tetapi tidak dimaksudkan untuk meniadakan kemungkinan nuansa hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk menyatakan ὑμῶν dan ὑμᾶς secara jelas. Gaya dijaga alami, bermartabat, dan mudah dipahami. Metafora garam dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
