  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: id
  text: Para tuan, berikanlah kepada budak-budakmu apa yang benar dan adil[a], karena kamu tahu bahwa kamu juga mempunyai Tuhan di surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang benar dan kesetaraan.” Kata Yunani yang diterjemahkan “adil” juga dapat berarti “kesetaraan” atau “perlakuan yang setara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Hai para tuan
  rationale: Dalam konteks aturan rumah tangga ini, κύριοι menunjuk kepada para tuan manusia dalam hubungannya dengan budak. Sapaan “Hai para tuan” jelas dan wajar dalam bahasa Indonesia serta membedakannya dari “Tuhan” di akhir ayat.
- source_word: τὸ δίκαιον
  choice: apa yang benar
  rationale: Adjektiva yang dipakai secara substantival ini berarti sesuatu yang benar atau adil. “Apa yang benar” mempertahankan daya etisnya dan berpasangan secara alami dengan “adil”.
- source_word: τὴν ἰσότητα
  choice: adil
  rationale: ἰσότης dapat berarti kesetaraan, keadilan, atau perlakuan yang setara/wajar. Dalam konteks pemberian perlakuan kepada budak, “adil” menyampaikan tuntutan perlakuan yang patut secara alami, sedangkan kemungkinan harfiah “kesetaraan” dipertahankan dalam catatan kaki.
- source_word: τοῖς δούλοις
  choice: kepada budak-budakmu
  rationale: Relasi dengan para tuan disebut secara eksplisit, sehingga status keterikatan sosial δοῦλοι menonjol. “Budak” tidak memperhalus realitas lembaga tersebut seperti yang dapat terjadi dengan “hamba” atau “pelayan”.
- source_word: παρέχεσθε
  choice: berikanlah
  rationale: Imperatif ini memerintahkan para tuan untuk menyediakan atau memberikan perlakuan tersebut. “Berikanlah” merupakan padanan Indonesia yang langsung, alami, dan sesuai dengan objeknya.
- source_word: εἰδότες
  choice: karena kamu tahu
  rationale: Partisip ini dapat menyatakan keadaan yang menyertai maupun dasar bagi perintah. Dalam bahasa Indonesia, “karena kamu tahu” menyampaikan hubungan alasan yang wajar dalam konteks tanpa menambahkan isi baru.
- source_word: καὶ ὑμεῖς
  choice: kamu juga
  rationale: καί bersama pronomina menekankan bahwa para tuan sendiri pun berada di bawah otoritas. “Kamu juga” mempertahankan penekanan itu.
- source_word: κύριον
  choice: Tuhan
  rationale: Di sini κύριος menunjuk kepada penguasa surgawi para tuan manusia. “Tuhan” mempertahankan bobot teologis gelar itu dan menciptakan kontras yang jelas dengan “para tuan” pada awal ayat.
- source_word: ἐν οὐρανῷ
  choice: di surga
  rationale: Frasa ini secara idiomatis dan jelas diterjemahkan “di surga” dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan δοῦλοι dalam konteks aturan rumah tangga
  choice: budak-budak
  alternative: hamba-hamba; pelayan-pelayan
  rationale: Penyebutan para tuan membuat status sosial terikat dari δοῦλοι sangat menonjol. “Budak-budak” menyampaikan realitas historis tersebut tanpa memperhalusnya.
- issue: Rentang makna ἰσότητα
  choice: adil
  alternative: kesetaraan; perlakuan yang setara; kewajaran
  rationale: Istilah ini dapat menunjuk pada kesetaraan atau keadilan yang setara. “Adil” paling alami dalam rangkaian perintah Indonesia, tetapi kemungkinan “kesetaraan” memiliki arti penafsiran yang penting dan karena itu dicatat, bukan dihapus.
- issue: Kontras antara κύριοι manusia dan κύριον surgawi
  choice: para tuan ... Tuhan
  alternative: para majikan ... seorang Tuan
  rationale: Pilihan ini mempertahankan hubungan leksikal sekaligus membedakan dengan jelas otoritas manusia dari Tuhan di surga. Kapitalisasi menandai rujukan ilahi tanpa menambahkan nama yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk sapaan “Hai para tuan” mempertahankan alamat langsung; “budak-budak” dipilih untuk ketepatan historis; dan catatan kaki menjaga ambiguitas penting pada ἰσότης.
