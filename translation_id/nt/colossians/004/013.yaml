id: COL.4.13
reference: Colossians 4:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: id
  text: Sebab aku bersaksi tentang dia bahwa ia sangat bersusah payah[a] bagi kalian, bagi mereka yang di Laodikia, dan bagi mereka yang di Hierapolis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjerih lelah,” “sangat prihatin,” atau “sangat menderita batin.” Ungkapan Yunani ini dapat menunjuk pada jerih payah yang berat dan, dalam konteks ini, juga dapat menyiratkan keprihatinan yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: aku bersaksi
  rationale: Menerjemahkan bentuk kini aktif orang pertama tunggal secara langsung dan mempertahankan penegasan pribadi Paulus.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai hubungan penjelasan dengan ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: tentang dia
  rationale: Datif bersama μαρτυρέω menunjuk kepada orang yang menjadi pokok kesaksian, yaitu Epafras; ungkapan ini lebih alami daripada bentuk harfiah 'baginya'.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi kesaksian Paulus.
- source_word: ἔχει πολὺν πόνον
  choice: ia sangat bersusah payah
  rationale: Mengungkapkan idiom Yunani 'mempunyai banyak jerih/susah' dalam bahasa Indonesia yang wajar sambil mempertahankan gagasan utama tentang usaha berat; kemungkinan nuansa keprihatinan atau penderitaan batin dicatat dalam catatan kaki.
- source_word: ὑπὲρ
  choice: bagi
  rationale: Menyatakan bahwa jerih payah dan perhatian Epafras diarahkan demi kepentingan para penerima.
- source_word: ὑμῶν
  choice: kalian
  rationale: Menunjukkan dengan jelas bahwa kata ganti Yunani ini berbentuk jamak.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: mereka yang di Laodikia
  rationale: Merujuk secara ringkas dan alami kepada orang-orang percaya yang berada di kota Laodikia.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: mereka yang di Hierapolis
  rationale: Mempertahankan susunan sejajar dengan frasa sebelumnya dan mentransliterasikan nama kota.
theological_decisions:
- issue: Makna πόνος dalam pelayanan Epafras
  choice: sangat bersusah payah
  alternative: berjerih lelah; sangat prihatin; sangat menderita batin
  rationale: Konteks dekat menyoroti pergumulan Epafras dalam doa, sehingga nuansa keprihatinan atau penderitaan batin mungkin ada. Namun, πόνος pada dasarnya menunjuk pada jerih payah, kesusahan, atau kerja berat. Terjemahan utama mempertahankan keluasan makna itu tanpa membatasinya hanya pada emosi atau hanya pada doa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. 'Kalian' dipakai untuk menyatakan bentuk jamak secara jelas. Susunan tiga kelompok dipertahankan, tetapi preposisi 'bagi' diulang agar hubungan sintaksisnya mudah dipahami.
