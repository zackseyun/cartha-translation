  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: id
  text: 'Aristarkhus, teman sepenjaraku, menyampaikan salam kepada kalian. Demikian juga Markus, sepupu Barnabas[a] (tentang dia kalian telah menerima petunjuk: jika ia datang kepada kalian, sambutlah dia[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keponakan Barnabas.” Namun, “sepupu” merupakan arti yang lebih tepat bagi kata Yunani ἀνεψιός dalam bahasa Yunani Koine.
    reason: lexical_alternative
  - marker: b
    text: Atau “terimalah dia.” Dalam konteks ini, kata Yunani tersebut dapat berarti menerima seseorang dengan ramah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: menyampaikan salam kepada
  rationale: Dalam konteks surat, verba ini menyatakan salam dari seseorang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi sapaan tersebut.
- source_word: συναιχμάλωτός
  choice: teman sepenjaraku
  rationale: Kata majemuk ini menunjuk kepada orang yang menjadi tahanan bersama penulis. Terjemahan ini ringkas dan tidak menambahkan keterangan seperti ‘dalam Kristus’ yang tidak tersurat.
- source_word: ἀνεψιὸς
  choice: sepupu
  rationale: Dalam bahasa Yunani Koine, kata ini secara khusus lazim berarti ‘sepupu’, bukan istilah kekerabatan yang lebih umum.
- source_word: ἐλάβετε ἐντολάς
  choice: kalian telah menerima petunjuk
  rationale: ἐντολή dapat berarti perintah atau petunjuk. Dalam konteks kedatangan dan penerimaan seorang utusan, ‘petunjuk’ menyampaikan arahan yang berwibawa tanpa memberi kesan keras yang tidak diwajibkan oleh konteks.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: jika ia datang kepada kalian
  rationale: Konstruksi ἐάν dengan bentuk subjungtif menyatakan kemungkinan pada masa mendatang; bentuk Indonesia ini jelas dan alami.
- source_word: δέξασθε αὐτόν
  choice: sambutlah dia
  rationale: Dalam konteks perjalanan dan keramahtamahan, δέχομαι dapat berarti menerima atau menyambut seseorang. ‘Sambutlah’ mengungkapkan daya interpersonalnya dengan jelas.
theological_decisions:
- issue: Sifat hubungan Paulus dengan Aristarkhus dalam συναιχμάλωτός μου
  choice: teman sepenjaraku
  alternative: rekan tahananku dalam Tuhan; rekanku dalam penderitaan
  rationale: Terjemahan mempertahankan makna leksikal tanpa menentukan apakah pemenjaraan itu harus dipahami secara harfiah atau kiasan, dan tidak menambahkan unsur teologis yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk ‘kalian’ dipakai untuk menandai bahwa ὑμᾶς bersifat jamak. Nama Ἀρίσταρχος ditransliterasikan sebagai ‘Aristarkhus’, sedangkan susunan kalimat dipecah menjadi dua agar alami tanpa mengubah hubungan antarklausa.
