source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: id
  text: Tikhikus, saudara yang terkasih, pelayan yang setia[b], dan sesama hamba dalam Tuhan[c], akan memberitahukan kepada kalian segala sesuatu tentang diriku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “segala hal yang mengenai aku”; ungkapan ini dapat mencakup keadaan atau urusan Paulus.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani διάκονος dapat berarti “pelayan”, “orang yang melayani”, atau, dalam konteks tertentu, “diaken”.
    reason: lexical_alternative
  - marker: c
    text: Atau “sesama budak”. Kata Yunani σύνδουλος menunjuk pada seseorang yang bersama orang lain terikat untuk mengabdi kepada tuan yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: segala sesuatu mengenai keadaanku
  rationale: Ungkapan ini mencakup segala hal yang menyangkut Paulus—keadaan, urusan, dan situasinya. Pilihan ini alami dalam bahasa Indonesia tanpa membatasi maknanya hanya pada satu jenis kabar.
- source_word: γνωρίσει ὑμῖν
  choice: akan memberitahukan kepada kalian
  rationale: Bentuk futur γνωρίζω menyatakan bahwa Tikhikus akan membuat hal-hal itu diketahui oleh para penerima surat. 'Kalian' memperjelas bahwa ὑμῖν berbentuk jamak.
- source_word: Τυχικὸς
  choice: Tikhikus
  rationale: Nama Yunani ditransliterasikan mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: saudara yang terkasih
  rationale: Mempertahankan kehangatan ἀγαπητός dan sebutan maskulin tunggal ἀδελφός bagi Tikhikus.
- source_word: πιστὸς διάκονος
  choice: pelayan yang setia
  rationale: διάκονος di sini menggambarkan pelayanan Tikhikus dan tidak secara pasti menunjuk pada jabatan gerejawi 'diaken'. 'Setia' menyampaikan sifat dapat dipercaya yang terkandung dalam πιστός.
- source_word: σύνδουλος
  choice: sesama hamba
  rationale: Kata ini menyatakan bahwa Tikhikus bersama Paulus berada dalam kedudukan mengabdi dan menjadi milik Tuhan yang sama. 'Sesama hamba' lebih alami dan bermartabat dalam bahasa Indonesia, sedangkan nuansa keterikatan kuat pada unsur δοῦλος dijelaskan dalam catatan kaki.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus yang dapat menyatakan lingkup, hubungan, dan persatuan dengan Tuhan tanpa mempersempitnya menjadi sekadar 'dalam pelayanan Tuhan'.
theological_decisions:
- issue: Makna διάκονος sebagai pelayanan atau jabatan gerejawi
  choice: pelayan yang setia
  alternative: diaken yang setia
  rationale: Konteks ini memuji peran dan kesetiaan Tikhikus, tetapi tidak cukup jelas untuk menetapkan bahwa διάκονος merupakan nama jabatan gerejawi tertentu.
- issue: Bahasa σύνδουλος / δοῦλος
  choice: sesama hamba
  alternative: sesama budak
  rationale: Terjemahan utama menjaga gagasan pengabdian dan kepemilikan di bawah Tuhan dalam ungkapan Indonesia yang wajar. Alternatif 'sesama budak' lebih menonjolkan keterikatan status, tetapi mudah membawa asosiasi perbudakan modern yang mungkin melampaui fokus konteks ini.
- issue: Lingkup frasa ἐν κυρίῳ
  choice: dalam Tuhan
  alternative: dalam pelayanan kepada Tuhan
  rationale: Bentuk Yunani membiarkan hubungan 'dalam Tuhan' tetap luas; parafrasa alternatif akan membatasi frasa itu pada kegiatan pelayanan saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Susunan keterangan tentang Tikhikus dipertahankan sebagai rangkaian pujian. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμῖν secara jelas; 'Tikhikus' mengikuti ejaan nama yang lazim dalam Alkitab bahasa Indonesia.
