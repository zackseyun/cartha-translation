  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: id
  text: Dan katakanlah kepada Arkhipus, “Perhatikan pelayanan yang kamu terima dalam Tuhan[a], supaya kamu menunaikannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “pelayanan yang kamu terima dari Tuhan.”
    reason: Frasa Yunani ἐν κυρίῳ secara harfiah berarti “dalam Tuhan”, tetapi dalam konteks ini mungkin menyiratkan bahwa pelayanan tersebut diterima dari Tuhan.
lexical_decisions:
- source_word: εἴπατε
  choice: Katakanlah kepada
  rationale: Bentuk imperatif aoristus jamak ini ditujukan kepada jemaat. Ungkapan ini mempertahankan daya perintah dan secara alami memperkenalkan perkataan langsung dalam bahasa Indonesia.
- source_word: Ἀρχίππῳ
  choice: Arkhipus
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: Βλέπε
  choice: Perhatikanlah
  rationale: Imperatif kini tunggal ini menyerukan perhatian dan kewaspadaan yang berkelanjutan terhadap tanggung jawab yang dipercayakan.
- source_word: διακονίαν
  choice: pelayanan
  rationale: Kata ini dapat berarti pelayanan, pengabdian, atau tugas yang dipercayakan. 'Pelayanan' mempertahankan konteks pengabdian Kristen tanpa menetapkan jabatan tertentu.
- source_word: παρέλαβες
  choice: telah kauterima
  rationale: Kata kerja ini menyatakan penerimaan suatu tanggung jawab atau amanat; terjemahan ini tidak menyiratkan bahwa tugas tersebut diambil atas prakarsa sendiri.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan formal ini mempertahankan preposisi ἐν serta keterbukaan maknanya, termasuk lingkup, hubungan, atau konteks penerimaan pelayanan tersebut.
- source_word: ἵνα
  choice: supaya
  rationale: Kata penghubung ini menyatakan tujuan secara wajar dan jelas dalam bahasa Indonesia.
- source_word: πληροῖς
  choice: menunaikannya
  rationale: Dalam konteks ini, πληρόω berarti menjalankan tanggung jawab sampai terpenuhi. 'Menunaikannya' mencakup pelaksanaan yang setia tanpa mengharuskan arti sempit 'menyelesaikan'.
theological_decisions:
- issue: Nuansa ἐν κυρίῳ
  choice: dalam Tuhan
  alternative: dari Tuhan
  rationale: Bahasa Yunani memakai ἐν, bukan preposisi yang secara langsung menandai sumber. Teks utama mempertahankan ungkapan relasional dan kemungkinan makna lingkup, sedangkan kemungkinan bahwa Tuhan adalah sumber pelayanan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'kauterima' dan 'menunaikannya' menjaga kelancaran perkataan langsung sekaligus mempertahankan nada nasihat apostolik.
