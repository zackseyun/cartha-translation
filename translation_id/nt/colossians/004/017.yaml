  rationale: Revisi menambahkan 'Dan' untuk καὶ, menghindari nuansa lampau sempurna yang tidak diperlukan pada παρέλαβες, menyeragamkan pronomina dalam ujaran langsung, dan memindahkan jangkar catatan kaki ke frasa ἐν κυρίῳ yang dijelaskannya. Ambiguitas relasional dari 'dalam Tuhan' tetap dipertahankan dalam teks utama.
