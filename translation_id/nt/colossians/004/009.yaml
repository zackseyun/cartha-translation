- from: bersama Onesimus, saudara yang setia dan terkasih, yang termasuk di antara kalian.[a] Mereka akan memberitahukan kepada kalian segala sesuatu yang terjadi di sini.[b]
  to: bersama Onesimus, saudara yang setia dan terkasih, yang adalah salah seorang dari kalian.[a] Mereka akan memberitahukan kepada kalian segala sesuatu di sini.[b]
  rationale: Revisi menghapus penafsiran tambahan ‘yang terjadi’ agar τὰ ὧδε tetap seluas teks sumber, dan mengganti frasa tentang Onesimus dengan padanan Indonesia yang lebih jelas untuk identifikasinya sebagai salah seorang dari para penerima. Catatan kaki dipertahankan pada jangkar yang sesuai dan menyajikan alternatif leksikal tanpa mengubah makna ayat.
