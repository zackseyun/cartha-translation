  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: id
  text: bersama Onesimus, saudara yang setia dan terkasih, yang adalah salah seorang dari kalian.[a] Mereka akan memberitahukan kepada kalian segala sesuatu di sini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang berasal dari antara kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “segala hal di sini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν
  choice: bersama
  rationale: Menandai penyertaan Onesimus dengan Tikhikus yang disebut pada ayat sebelumnya; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: Ὀνησίμῳ
  choice: Onesimus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: πιστῷ
  choice: setia
  rationale: Menyampaikan sifat dapat dipercaya atau teguh dalam konteks pelayanan dan persekutuan Kristen tanpa mempersempit maknanya.
- source_word: ἀγαπητῷ
  choice: terkasih
  rationale: Mempertahankan kehangatan dan nada kekeluargaan dalam surat.
- source_word: ἀδελφῷ
  choice: saudara
  rationale: Merujuk kepada seorang laki-laki sesama orang percaya; bahasa Indonesia lazim memakai 'saudara' untuk hubungan kekeluargaan rohani ini.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: yang termasuk di antara kalian
  rationale: Menyampaikan bahwa Onesimus berasal dari atau merupakan bagian dari komunitas penerima, sambil mempertahankan ruang bagi kedua nuansa itu.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Padanan komprehensif dan alami untuk bentuk jamak netral yang berarti keseluruhan hal.
- source_word: γνωρίσουσιν
  choice: akan memberitahukan
  rationale: Menyampaikan arti membuat sesuatu diketahui atau menginformasikannya secara wajar dalam bahasa Indonesia.
- source_word: τὰ ὧδε
  choice: segala sesuatu yang terjadi di sini
  rationale: Mengungkapkan secara alami hal-hal atau keadaan di tempat Paulus berada; catatan kaki mempertahankan terjemahan yang lebih harfiah.
theological_decisions:
- issue: Makna gerejawi ἀδελφῷ
  choice: saudara
  alternative: saudara seiman
  rationale: Teks hanya mengatakan 'saudara'; pilihan ini mempertahankan bahasa kekeluargaan jemaat tanpa menambahkan penjelasan eksplisit.
- issue: Daya makna ἐξ ὑμῶν
  choice: yang termasuk di antara kalian
  alternative: yang berasal dari antara kalian
  rationale: Pilihan utama menonjolkan keterikatan Onesimus dengan komunitas Kolose tanpa memasukkan kesimpulan sosial atau teologis dari Surat Filemon.
- issue: Cakupan τὰ ὧδε
  choice: segala sesuatu yang terjadi di sini
  alternative: segala hal di sini
  rationale: Ungkapan utama terdengar alami dan menunjuk pada keadaan di tempat Paulus, sedangkan alternatif yang lebih formal dicatat agar unsur ketidakjelasan frasa Yunani tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Kalian' dipakai untuk menandai bahwa ὑμῶν dan ὑμῖν berbentuk jamak. Susunan ayat sengaja dimulai dengan 'bersama' karena ayat ini melanjutkan kalimat dari ayat sebelumnya.
