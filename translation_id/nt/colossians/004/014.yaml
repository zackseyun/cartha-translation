  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: id
  text: Lukas, tabib yang terkasih, dan Demas menyampaikan salam kepada kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: menyampaikan salam
  rationale: Ungkapan ini merupakan formula salam dalam surat. Bentuk Yunani tunggal mendahului dua pengirim salam, Lukas dan Demas; dalam bahasa Indonesia, predikat tidak berubah menurut jumlah subjek.
- source_word: ὑμᾶς
  choice: kepada kalian
  rationale: Pronomina orang kedua jamak menunjuk kepada para penerima surat secara kolektif. 'Kalian' menyatakan jumlah jamak secara jelas dalam bahasa Indonesia modern.
- source_word: Λουκᾶς
  choice: Lukas
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: ἰατρὸς
  choice: tabib
  rationale: '''Tabib'' secara tepat menyatakan profesi penyembuh pada konteks abad pertama dan mempertahankan nada bermartabat tanpa memberi kesan gelar kedokteran modern.'
- source_word: ἀγαπητὸς
  choice: yang terkasih
  rationale: Pilihan ini mempertahankan kehangatan dan penghargaan dalam ἀγαπητός serta secara alami menerangkan Lukas.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif sederhana yang menghubungkan Demas dengan Lukas sebagai penyampai salam.
- source_word: Δημᾶς
  choice: Demas
  rationale: Bentuk transliterasi nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan sebutan ὁ ἰατρὸς ὁ ἀγαπητός
  choice: '''tabib yang terkasih'' menerangkan Lukas saja'
  alternative: Membiarkan tanda baca bahasa Indonesia menimbulkan kesan bahwa 'yang terkasih' mungkin juga menerangkan Demas
  rationale: Susunan Yunani menempatkan rangkaian berartikel itu sebagai aposisi yang langsung menerangkan Λουκᾶς; Demas baru ditambahkan sesudah καὶ.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Menyampaikan salam kepada kalian' mengungkapkan idiom surat dengan jelas; 'tabib' sesuai dengan latar abad pertama.
