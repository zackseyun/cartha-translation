  text: Τῇ προσευχῇ προσκαρτερεῖτε, γρηγοροῦντες ἐν αὐτῇ ἐν εὐχαριστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/002.yaml
  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: id
  text: Tekunlah dalam doa[a], sambil tetap berjaga-jaga di dalamnya dengan ucapan syukur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bertekunlah dalam doa, dengan berjaga-jaga di dalamnya disertai ucapan syukur.”
    reason: Alternatif ini menampilkan secara lebih eksplisit nuansa keberlanjutan dalam προσκαρτερεῖτε dan kemungkinan hubungan frasa-frasa pendamping dalam ayat ini.
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: dalam doa
  rationale: Kata sandang Yunani di sini bersifat idiomatis dan menunjuk pada doa sebagai praktik, bukan pada satu doa tertentu. Bahasa Indonesia secara alami tidak memerlukan kata sandang.
- source_word: προσκαρτερεῖτε
  choice: Tekunlah
  rationale: Imperatif kini ini menyerukan ketekunan yang berlangsung terus-menerus. 'Tekunlah dalam doa' alami, ringkas, dan mempertahankan daya perintahnya.
- source_word: γρηγοροῦντες
  choice: sambil tetap berjaga-jaga
  rationale: Partisip ini menyatakan tindakan atau sikap yang menyertai ketekunan dalam doa. 'Berjaga-jaga' mempertahankan gambaran kewaspadaan tanpa membatasinya pada tetap terjaga secara fisik.
- source_word: ἐν αὐτῇ
  choice: di dalamnya
  rationale: Kata ganti feminin ini paling wajar merujuk kembali kepada doa. Ungkapan ini mempertahankan struktur anaforis teks Yunani.
- source_word: ἐν εὐχαριστίᾳ
  choice: dengan ucapan syukur
  rationale: Frasa ini menyatakan sikap yang menyertai kewaspadaan dalam doa. 'Dengan ucapan syukur' merupakan ungkapan Indonesia yang alami dan mempertahankan unsur syukur yang eksplisit.
