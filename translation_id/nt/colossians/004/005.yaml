id: COL.4.5
reference: Colossians 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: id
  text: Hiduplah dengan bijaksana terhadap orang-orang di luar,[a] dengan memanfaatkan setiap kesempatan sebaik-baiknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, orang-orang di luar komunitas orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menebus waktu”; maksudnya, menggunakan setiap kesempatan sebaik-baiknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: dengan bijaksana
  rationale: Frasa ini menyatakan cara menjalani hidup. Bentuk adverbial ini alami dalam bahasa Indonesia modern, sambil tetap mempertahankan bobot etis σοφία.
- source_word: περιπατεῖτε
  choice: Hiduplah
  rationale: Secara harfiah berarti 'berjalanlah', tetapi di sini merupakan metafora umum bagi cara hidup atau perilaku. 'Hiduplah' menyampaikan maknanya dengan jelas dan wajar.
- source_word: πρὸς τοὺς ἔξω
  choice: terhadap orang-orang di luar
  rationale: πρός menunjukkan arah atau orientasi perilaku terhadap mereka yang berada di luar komunitas orang percaya. Ungkapan ini mempertahankan citra 'di luar' dan diberi penjelasan dalam catatan kaki.
- source_word: τὸν καιρὸν
  choice: setiap kesempatan
  rationale: Dalam konteks ini καιρός menunjuk pada waktu yang tepat atau kesempatan, bukan waktu secara abstrak. 'Setiap kesempatan' membuat nuansa tersebut jelas dalam bahasa Indonesia.
- source_word: ἐξαγοραζόμενοι
  choice: dengan memanfaatkan ... sebaik-baiknya
  rationale: Partisipel ini secara idiomatis berarti menggunakan kesempatan secara penuh. Pilihan ini menghindari kesan penebusan soteriologis yang dapat timbul dari terjemahan harfiah 'menebus'.
theological_decisions:
- issue: Kemungkinan membaca ἐξαγοραζόμενοι sebagai istilah penebusan teologis
  choice: Nasihat untuk memanfaatkan setiap kesempatan dalam perilaku bijaksana terhadap orang yang belum percaya
  alternative: Terjemahan harfiah 'menebus waktu', yang dapat membangkitkan pengertian penebusan teologis
  rationale: Dalam konstruksi ini, kata tersebut berfungsi secara idiomatis dan tidak menyatakan karya penebusan. Terjemahan utama menyampaikan maksud praktisnya, sedangkan metafora harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'Hiduplah' mengutamakan makna metaforis περιπατεῖτε, sedangkan 'orang-orang di luar' mempertahankan ungkapan sumber tanpa terdengar sebagai label yang merendahkan.
