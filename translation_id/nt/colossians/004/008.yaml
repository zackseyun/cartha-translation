  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: id
  text: 'Aku telah mengutus dia kepadamu khusus untuk tujuan ini: supaya kamu mengetahui keadaan kami[a] dan supaya ia menguatkan hati kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “supaya kami mengetahui keadaanmu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: dia
  rationale: Kata ganti relatif akusatif maskulin tunggal ini mengacu kepada Tikhikus pada ayat sebelumnya. Dalam bahasa Indonesia, konstruksi yang alami memakai 'dia' sebagai objek.
- source_word: ἔπεμψα
  choice: Aku mengutus
  rationale: Bentuk aoristus indikatif menyatakan tindakan pengutusan; bentuk lampau tidak perlu ditandai secara gramatikal dalam bahasa Indonesia, dan konteks menjelaskannya.
- source_word: πρὸς ὑμᾶς
  choice: kepadamu
  rationale: Bersama verba pengutusan, πρός dengan akusatif menunjukkan arah kepada orang yang dituju. Bentuk tunggal 'kamu' tetap dapat merujuk secara kolektif kepada jemaat dan selaras dengan pronomina jamak Yunani.
- source_word: εἰς αὐτὸ τοῦτο
  choice: khusus untuk tujuan ini
  rationale: Ungkapan ini menekankan tujuan tertentu. 'Khusus untuk tujuan ini' menyampaikan penekanan αὐτὸ tanpa terasa kaku.
- source_word: ἵνα
  choice: supaya
  rationale: Konjungsi ini memperkenalkan klausa tujuan; 'supaya' jelas dan alami dalam bahasa Indonesia modern.
- source_word: γνῶτε
  choice: kamu mengetahui
  rationale: Subjungtif aoristus di bawah ἵνα menyatakan tujuan yang dimaksudkan. 'Mengetahui' mempertahankan arti luas γινώσκω tanpa mempersempitnya menjadi sekadar menerima kabar.
- source_word: τὰ περὶ ἡμῶν
  choice: keadaan kami
  rationale: Ungkapan ini menunjuk pada kabar atau keadaan Paulus dan rekan-rekannya. 'Keadaan kami' ringkas, alami, dan mempertahankan acuan personalnya.
- source_word: παρακαλέσῃ
  choice: ia menguatkan
  rationale: παρακαλέω dapat berarti menghibur, mendorong, menasihati, atau menguatkan. Dalam konteks kunjungan pembawa kabar dan objek 'hati', 'menguatkan' mencakup dorongan serta penghiburan tanpa mempersempit maknanya secara berlebihan.
- source_word: τὰς καρδίας ὑμῶν
  choice: hatimu
  rationale: Terjemahan langsung ini mempertahankan istilah antropologis Alkitab. Bentuk tunggal Indonesia dapat mengacu secara kolektif kepada para pembaca yang dalam bahasa Yunani berbentuk jamak.
theological_decisions:
- issue: Varian tekstual mengenai subjek dan arah pengetahuan dalam klausa tujuan
  choice: 'Mengikuti teks SBLGNT: ''supaya kamu mengetahui keadaan kami'' (γνῶτε τὰ περὶ ἡμῶν).'
  alternative: '''supaya kami mengetahui keadaanmu'' (γνῶμεν τὰ περὶ ὑμῶν atau varian serupa).'
  rationale: Teks utama mengikuti edisi sumber yang ditetapkan. Karena varian yang membalik arah pengetahuan dikenal luas dan mengubah makna klausa, varian itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. 'Aku' dipakai untuk suara pribadi Paulus, sedangkan 'kamu/hatimu' berfungsi kolektif bagi jemaat. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang memiliki varian tekstual.
