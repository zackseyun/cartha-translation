  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: id
  text: dan Yesus yang disebut Yustus. Di antara mereka yang berasal dari golongan bersunat[a], hanya mereka inilah rekan sekerja bagi Kerajaan Allah, dan mereka menjadi penghiburan bagiku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Yahudi.” Secara harfiah, “yang berasal dari golongan bersunat.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan mereka menjadi dorongan bagiku”; atau, “dan mereka terbukti menjadi penghiburan bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: Yesus yang disebut Yustus
  rationale: Mempertahankan nama Yunani Perjanjian Baru yang lazim dalam bahasa Indonesia dan menyampaikan sebutan alternatif Romawinya secara alami.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: di antara orang-orang bersunat
  rationale: Ungkapan ini merupakan penanda identitas Yahudi. Bentuk ini mempertahankan citra sunat sekaligus membuat hubungan sintaksis dengan οὗτοι μόνοι jelas dalam bahasa Indonesia.
- source_word: οὗτοι μόνοι
  choice: hanya mereka inilah
  rationale: 'Menjaga penekanan eksklusif: di antara kelompok yang disebut sebelumnya, hanya orang-orang inilah yang menjadi rekan sekerja Paulus.'
- source_word: συνεργοὶ
  choice: rekan-rekan sekerjaku
  rationale: Istilah ini menunjuk kepada para mitra pelayanan Paulus; akhiran posesif memperjelas hubungan yang tersirat oleh konteks dan oleh μοι pada klausa berikutnya.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: bagi Kerajaan Allah
  rationale: εἰς bersama συνεργοί menyatakan arah, tujuan, atau kepentingan pekerjaan mereka. 'Bagi' alami dan tidak mempersempitnya menjadi sekadar lokasi.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: mereka telah menjadi penghiburan bagiku
  rationale: Bentuk perfektif ἐγενήθησαν dapat dinyatakan secara alami sebagai 'telah menjadi'; παρηγορία berarti penghiburan atau dorongan yang menguatkan.
theological_decisions:
- issue: Cakupan ungkapan 'orang-orang bersunat'
  choice: Penanda orang Yahudi, dalam konteks ini orang Yahudi yang bekerja bagi Kerajaan Allah
  alternative: Sebutan khusus bagi kelompok atau golongan yang mewajibkan sunat
  rationale: Konteks daftar rekan kerja paling wajar menunjuk pada latar belakang Yahudi mereka. Terjemahan tetap memakai gambaran 'bersunat' agar tidak memutuskan lebih jauh apakah yang dimaksud identitas etnis-keagamaan umum atau suatu kelompok tertentu.
- issue: Letak penekanan μόνοι
  choice: Hanya orang-orang yang baru disebut ini, di antara orang-orang bersunat, yang menjadi rekan sekerja Paulus
  alternative: Mereka adalah satu-satunya rekan sekerja Paulus secara keseluruhan yang kebetulan bersunat
  rationale: Urutan Yunani lebih dahulu menetapkan kelompok 'yang berasal dari sunat', kemudian menyatakan 'mereka ini saja' sebagai rekan sekerja. Susunan Indonesia mempertahankan cakupan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Di antara orang-orang bersunat, hanya mereka inilah' dipilih untuk memperjelas logika Yunani tanpa menghilangkan ungkapan identitas aslinya. Huruf kapital pada 'Kerajaan Allah' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
