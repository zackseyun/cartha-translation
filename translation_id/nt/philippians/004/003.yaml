  naturalness: Bahasa baku, jelas, dan bernada pribadi. Bentuk “memohon kepadamu” dan “bersamaku” membuat kalimat lebih lancar tanpa menaikkan tingkat desakan secara berlebihan.
  terminology: “Rekan sejati,” “Klemens,” “rekan-rekan kerjaku,” dan “kitab kehidupan” dapat dipertahankan. Catatan a dengan tepat menjaga metafora kuk dan kemungkinan nama diri. Catatan b sebaiknya memuat alternatif untuk verba συνήθλησάν (“berjuang”) sebagaimana jangkar catatan ditempatkan pada keseluruhan ungkapan perjuangan dalam Injil.
