id: PHP.4.3
reference: Philippians 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: id
  text: Ya, aku pun memohon kepadamu, rekan sejati[a], bantulah kedua perempuan ini. Mereka telah berjuang bersamaku dalam Injil[b], bersama-sama dengan Klemens dan rekan-rekan kerjaku yang lain, yang nama-namanya tercantum dalam kitab kehidupan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “rekan sesama pemikul kuk yang sejati”; sebagian orang menganggapnya sebagai nama diri, “Sizigus.”
    reason: alternative_reading
  - marker: b
    text: Atau “telah berjuang atau bertanding bersama denganku”; frasa “dalam Injil” juga dapat diterjemahkan “demi Injil” atau “dalam pemberitaan Injil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Ya
  rationale: Mempertahankan penegasan yang membuka permohonan Paulus secara langsung dan wajar dalam bahasa Indonesia.
- source_word: ἐρωτῶ καὶ σέ
  choice: aku juga meminta kepadamu
  rationale: Menyampaikan arti dasar ἐρωτάω sebagai permintaan pribadi tanpa memperkuatnya menjadi desakan.
- source_word: γνήσιε σύζυγε
  choice: rekan sejati
  rationale: Memahami σύζυγος sebagai sapaan deskriptif bagi seorang rekan yang setia; ungkapan ini alami dalam bahasa Indonesia, sedangkan metafora kuk dan kemungkinan nama diri dicatat dalam catatan kaki.
- source_word: συλλαμβάνου αὐταῖς
  choice: tolonglah kedua perempuan ini
  rationale: Imperatifnya meminta bantuan aktif. Bentuk feminin jamak merujuk dalam konteks kepada Euodia dan Sintikhe, sehingga rujukannya dinyatakan dengan jelas.
- source_word: συνήθλησάν μοι
  choice: telah berjuang bersama denganku
  rationale: Mempertahankan gambaran perjuangan atau pertandingan dalam συναθλέω sekaligus menghasilkan ungkapan Indonesia yang mudah dipahami.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: dalam karya Injil
  rationale: Kata 'karya' membuat ungkapan Yunani yang padat dapat dipahami secara alami tanpa membatasinya hanya pada satu kegiatan tertentu, seperti pemberitaan.
- source_word: συνεργῶν
  choice: rekan-rekan kerjaku
  rationale: Padanan alami bagi istilah Paulus tentang orang-orang yang bekerja bersamanya.
- source_word: βίβλῳ ζωῆς
  choice: kitab kehidupan
  rationale: Mempertahankan ungkapan alkitabiah yang mapan dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penafsiran γνήσιε σύζυγε
  choice: 'Sapaan deskriptif kepada seorang rekan yang tidak disebutkan namanya: “rekan sejati”'
  alternative: Kata σύζυγε dapat dipahami secara lebih harfiah sebagai “rekan sesama pemikul kuk” atau sebagai nama diri, “Sizigus.”
  rationale: Adjektiva γνήσιε cocok dengan sapaan deskriptif, dan konteks mendukung pengertian seorang rekan yang diminta menolong. Karena identitas dan status istilah ini tetap diperdebatkan, kemungkinan lain dipertahankan dalam catatan kaki.
- issue: Nuansa ἐν τῷ εὐαγγελίῳ
  choice: “dalam karya Injil”
  alternative: “demi Injil,” “dalam pemberitaan Injil,” atau secara lebih harfiah “dalam Injil”
  rationale: Frasa Yunani ini padat dan dapat menunjuk pada lingkup pelayanan maupun perjuangan bagi Injil. Terjemahan utama menjaga keluasan itu, sementara alternatif dicatat tanpa memaksakan satu kegiatan khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi namun bermartabat. Pronomina “aku” mengikuti suara surat Paulus yang langsung; “kitab kehidupan” mempertahankan istilah alkitabiah yang dikenal. Struktur panjang Yunani dibagi menjadi dua kalimat agar jelas bagi pembaca umum tanpa mengubah hubungan antargagasan.
