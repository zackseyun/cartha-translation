base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: id
  text: Semua orang kudus menyampaikan salam kepada kalian, terutama mereka yang berasal dari rumah tangga Kaisar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka dari lingkungan rumah tangga Kaisar.” Frasa ini menunjuk kepada orang-orang yang terkait dengan rumah tangga kekaisaran, bukan harus berarti anggota keluarga Kaisar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: menyampaikan salam kepada
  rationale: Dalam konteks penutup surat, verba ini secara wajar menyatakan pengiriman salam; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi epistolernya.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina Yunani ini berbentuk jamak. 'Kalian' menyatakan bahwa salam ditujukan kepada seluruh jemaat dengan bahasa modern yang jelas.
- source_word: πάντες οἱ ἅγιοι
  choice: semua orang kudus
  rationale: Ungkapan ini adalah sebutan Paulus yang lazim bagi orang-orang percaya. 'Orang kudus' mempertahankan bentuk leksikal dan muatan teologisnya tanpa mempersempitnya menjadi golongan khusus.
- source_word: μάλιστα δὲ
  choice: terutama
  rationale: Kata ini menonjolkan satu kelompok dalam kelompok yang lebih luas; 'terutama' menyampaikan penekanan itu secara ringkas dan alami.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: mereka yang berasal dari rumah tangga Kaisar
  rationale: Frasa ἐκ τῆς ... οἰκίας menunjuk kepada orang-orang yang berasal dari atau terkait dengan lingkungan rumah tangga kekaisaran. Terjemahan ini menjaga ungkapan sumber tanpa menyatakan bahwa mereka pasti kerabat sedarah Kaisar.
- source_word: Καίσαρος
  choice: Kaisar
  rationale: Bentuk Yunani mempertahankan nama atau gelar historis Καῖσαρ; 'Kaisar' lebih dekat kepada sumber daripada menggantinya secara interpretatif dengan 'kaisar' atau 'sang kaisar' sebagai sebutan umum.
theological_decisions:
- issue: Makna 'orang kudus' dalam penggunaan Paulus
  choice: Mempertahankan sebutan 'orang kudus' bagi orang-orang percaya.
  alternative: umat Allah; orang-orang percaya
  rationale: Di sini istilah tersebut tidak terbatas pada golongan elite yang dianggap sangat suci, tetapi menunjuk kepada komunitas Kristen. Terjemahan leksikal mempertahankan istilah Paulus dan tidak memasukkan penjelasan teologis ke dalam teks.
- issue: Identitas orang-orang dari rumah tangga Kaisar
  choice: Membiarkan cakupannya sebagai orang-orang yang terkait dengan rumah tangga kekaisaran.
  alternative: anggota keluarga Kaisar
  rationale: οἰκία dapat mencakup lingkungan rumah tangga yang lebih luas, termasuk pelayan, orang merdeka, atau pejabat, sehingga teks tidak boleh dipersempit menjadi kerabat Kaisar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμᾶς secara jelas; 'menyampaikan salam' sesuai dengan konteks surat. Istilah kunci 'orang kudus' dipertahankan.
