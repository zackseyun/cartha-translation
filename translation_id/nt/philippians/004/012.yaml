id: PHP.4.12
reference: Philippians 4:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: id
  text: 'Aku tahu bagaimana hidup dalam kekurangan, dan aku tahu bagaimana hidup dalam kelimpahan. Dalam setiap keadaan dan dalam segala hal, aku telah mempelajari rahasia itu[a]: baik kenyang maupun lapar, baik berkelimpahan maupun berkekurangan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “aku telah diinisiasi.” Paulus memakai bahasa inisiasi secara kiasan untuk menyatakan bahwa ia telah mempelajari suatu rahasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Aku tahu bagaimana
  rationale: Dengan infinitif yang mengikutinya, ungkapan ini menyatakan kecakapan praktis yang diperoleh melalui pengalaman, bukan sekadar pengetahuan abstrak.
- source_word: ταπεινοῦσθαι
  choice: hidup dalam kekurangan
  rationale: Bentuk ini menggambarkan keadaan direndahkan atau berada dalam kondisi rendah; dalam konteks kontras dengan kelimpahan, terjemahan ini menyampaikan keadaan serba kurang tanpa mengartikannya sebagai kerendahan hati.
- source_word: περισσεύειν
  choice: hidup dalam kelimpahan / berkelimpahan
  rationale: Pilihan ini mempertahankan arti mempunyai lebih dari cukup serta pengulangan verba Yunani, dengan bentuk Indonesia yang alami.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: Dalam setiap keadaan dan dalam segala hal
  rationale: Terjemahan ini mempertahankan keluasan retoris kedua ungkapan yang berpasangan tanpa meleburkannya.
- source_word: μεμύημαι
  choice: aku telah mempelajari rahasianya
  rationale: Secara harfiah verba ini memakai bahasa inisiasi, tetapi secara metaforis menunjuk pada pengenalan akan rahasia menjalani segala keadaan; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: χορτάζεσθαι
  choice: kenyang
  rationale: Dalam pertentangan langsung dengan lapar, kata ini menunjuk pada keadaan telah mendapat cukup makanan.
- source_word: πεινᾶν
  choice: lapar
  rationale: Pilihan sederhana ini mempertahankan kontras langsung dengan kenyang.
- source_word: ὑστερεῖσθαι
  choice: berkekurangan
  rationale: Kata ini menyatakan kekurangan atau tidak mempunyai cukup, dan cakupannya tidak dibatasi pada masalah keuangan.
theological_decisions:
- issue: Apakah ταπεινοῦσθαι menunjuk pada sikap rendah hati atau keadaan hidup yang rendah
  choice: Keadaan hidup dalam kekurangan
  alternative: direndahkan / hidup dengan rendah hati
  rationale: Konteks rangkaian kenyang-lapar dan berkelimpahan-berkekurangan menunjukkan keadaan lahiriah, sehingga terjemahan tidak mengubahnya menjadi ajaran khusus tentang sikap batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Paralelisme antarkeadaan dipertahankan. Kata “Aku” mengikuti gaya tuturan pribadi Paulus, sedangkan “rahasianya” mempertahankan metafora μεμύημαι dan disertai catatan kaki.
