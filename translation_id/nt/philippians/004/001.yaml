id: PHP.4.1
reference: Philippians 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: id
  text: Karena itu, saudara-saudaraku[a] yang terkasih dan kurindukan, sukacita dan mahkotaku[b], berdirilah teguh dalam Tuhan dengan cara demikian, yang terkasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “saudara-saudaraku” berbentuk maskulin; dalam konteks ini Paulus menyapa sesama orang percaya dalam jemaat, bukan hanya laki-laki.
    reason: cultural_note
  - marker: b
    text: Atau “mahkota kemenangan”; istilah Yunani ini merujuk pada karangan bunga yang dianugerahkan kepada pemenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari nasihat sebelumnya dengan ungkapan bahasa Indonesia yang alami.
- source_word: ἀδελφοί
  choice: saudara-saudaraku
  rationale: Bentuk sapaan ini alami dalam bahasa Indonesia dan mempertahankan kehangatan hubungan Paulus dengan jemaat; cakupan seluruh jemaat dijelaskan dalam catatan kaki.
- source_word: ἀγαπητοὶ
  choice: yang terkasih
  rationale: Mempertahankan nada kasih yang kuat dan pengulangannya pada akhir ayat.
- source_word: ἐπιπόθητοι
  choice: kurindukan
  rationale: Mengungkapkan kerinduan mendalam Paulus secara ringkas dan alami.
- source_word: χαρὰ
  choice: sukacita
  rationale: Padanan lazim yang mempertahankan pernyataan bahwa jemaat itu sendiri adalah sukacita Paulus.
- source_word: στέφανος
  choice: mahkota
  rationale: Padanan yang wajar dan mempertahankan citra penghargaan atau kemenangan; nuansa karangan bunga kemenangan dijelaskan dalam catatan kaki.
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Mempertahankan daya adverbialnya dan kaitannya dengan cara hidup yang telah diuraikan sebelumnya.
- source_word: στήκετε
  choice: berdirilah teguh
  rationale: Menyampaikan perintah untuk tetap kokoh dan bertekun dengan ungkapan Indonesia yang jelas.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan frasa relasional khas Paulus tanpa mempersempit atau memperluas maknanya.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Teks utama memakai “saudara-saudaraku,” dengan catatan bahwa sapaan itu mencakup sesama orang percaya dalam jemaat, bukan hanya laki-laki.
  alternative: saudara-saudari atau semua saudara seiman
  rationale: Bahasa Indonesia memakai “saudara” secara luas, tetapi bentuk Yunani secara gramatikal maskulin; catatan menjaga kedua unsur tersebut tanpa mengaburkan cakupan jemaat.
- issue: Makna relasional ἐν κυρίῳ
  choice: dalam Tuhan
  alternative: dalam persatuan dengan Tuhan
  rationale: Terjemahan ini mempertahankan keluasan ungkapan Paulus dan tidak memaksakan satu penjelasan teologis atas hubungan yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, hangat, dan bermartabat. Pengulangan sapaan “yang terkasih” dipertahankan untuk mencerminkan penekanan afektif Paulus, sedangkan susunan kalimat dibuat alami tanpa menghilangkan unsur-unsur Yunani.
