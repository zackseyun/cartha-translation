  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: id
  text: Kemuliaan bagi Allah dan Bapa kita selama-lamanya[a]! Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk zaman-zaman dari zaman-zaman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini berfungsi sebagai penghubung ringan dalam penutup. Dalam bahasa Indonesia, transisi tersebut sudah alami tanpa menambahkan kata seperti “dan” atau “tetapi,” yang dapat memberi tekanan berlebihan.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: Allah dan Bapa kita
  rationale: Ungkapan ini dipahami sebagai satu sebutan bagi satu pribadi; “kita” secara alami berkaitan dengan keseluruhan ungkapan.
- source_word: ἡ δόξα
  choice: kemuliaan
  rationale: Klausa Yunani tidak memiliki verba. Susunan “Bagi ... kemuliaan” mempertahankan bentuk doksologis dengan elipsis yang tetap wajar dalam bahasa Indonesia.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: sampai selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan keberlangsungan tanpa akhir. Pilihan ini alami dan tetap mempertahankan arah ungkapan Yunani εἰς.
- source_word: ἀμήν
  choice: Amin
  rationale: Bentuk transliterasi yang mapan dalam pemakaian Kristen Indonesia dan berfungsi sebagai penegasan liturgis.
theological_decisions:
- issue: Verba tersirat dalam doksologi
  choice: 'mempertahankan klausa eliptis: “Bagi Allah dan Bapa kita, kemuliaan”'
  alternative: “Bagi Allah dan Bapa kita hendaklah kemuliaan” atau “Milik Allah dan Bapa kita kemuliaan”
  rationale: Teks Yunani tidak menyatakan verba sehingga dapat bernuansa harapan doksologis ataupun pernyataan bahwa kemuliaan adalah milik Allah. Elipsis bahasa Indonesia mempertahankan ketegangan itu tanpa menetapkan salah satu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Struktur doksologis dipertahankan tanpa memakai bentuk yang terlalu arkais.
