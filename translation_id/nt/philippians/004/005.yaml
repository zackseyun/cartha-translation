id: PHP.4.5
reference: Philippians 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: id
  text: Hendaklah sikap penuh tenggang rasa kalian diketahui oleh semua orang.[a] Tuhan dekat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelemahlembutan,” “kesabaran yang memberi kelonggaran,” atau “sikap penuh pengertian.”
    reason: lexical_alternative
  - marker: b
    text: “Tuhan dekat” dapat berarti bahwa Tuhan hadir dekat, bahwa kedatangan-Nya sudah dekat, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: sikap penuh tenggang rasa
  rationale: Ungkapan ini mencakup sikap yang penuh pertimbangan, tidak memaksakan hak sendiri, dan bersedia memberi kelonggaran. Pilihan ini lebih luas daripada sekadar kelembutan watak dan terdengar alami dalam bahasa Indonesia.
- source_word: γνωσθήτω
  choice: hendaklah ... diketahui
  rationale: Bentuk pasif imperatif dipertahankan secara jelas sekaligus wajar dalam bahasa Indonesia.
- source_word: πᾶσιν ἀνθρώποις
  choice: oleh semua orang
  rationale: Ungkapan ini menyampaikan cakupan yang menyeluruh tanpa membatasi rujukannya berdasarkan gender.
- source_word: κύριος
  choice: Tuhan
  rationale: Ini merupakan padanan baku yang mempertahankan bobot gelar κύριος dalam konteks Perjanjian Baru.
- source_word: ἐγγύς
  choice: dekat
  rationale: 'Kata ''dekat'' mempertahankan ambiguitas asli: Tuhan dapat dipahami dekat dalam kehadiran-Nya, dekat dalam arti kedatangan-Nya segera, atau keduanya.'
theological_decisions:
- issue: Makna ὁ κύριος ἐγγύς
  choice: Tuhan dekat
  alternative: Tuhan berada dekat; Tuhan akan segera datang
  rationale: Bahasa Yunani memungkinkan nuansa kedekatan dalam ruang atau kehadiran, kedekatan waktu kedatangan Tuhan, atau keduanya. Teks utama tidak mempersempitnya pada satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai dengan ὑμῶν. Susunan pasif mempertahankan bentuk Yunani, sedangkan 'sikap penuh tenggang rasa' dipilih agar kualitas etis ἐπιεικές tersampaikan secara luas dan alami.
