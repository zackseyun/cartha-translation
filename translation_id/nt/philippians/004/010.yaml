id: PHP.4.10
reference: Philippians 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: id
  text: Aku sangat bersukacita dalam Tuhan karena sekarang, setelah sekian lama, kalian kembali menunjukkan perhatian kepada aku[a]. Memang, kalian tetap memikirkan aku[b], tetapi kalian tidak mendapat kesempatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kalian kembali bersemi dalam hal memikirkan aku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kalian memang tetap memperhatikanku.” Kata Yunani ini dapat berarti memikirkan, menaruh perhatian, atau bersikap peduli kepada seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Aku bersukacita
  rationale: Bentuk aoris χαίρω menyatakan sukacita Paulus secara langsung; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus yang dapat menunjuk pada lingkup sekaligus dasar sukacitanya.
- source_word: μεγάλως
  choice: sangat
  rationale: Secara alami menyampaikan kuatnya sukacita Paulus dalam bahasa Indonesia modern.
- source_word: ἤδη ποτὲ
  choice: sekarang, setelah sekian lama
  rationale: Menyampaikan munculnya kembali tindakan jemaat Filipi sesudah suatu masa jeda tanpa memberi kesan bahwa Paulus sedang mencela mereka.
- source_word: ἀνεθάλετε
  choice: bersemi kembali
  rationale: Mempertahankan metafora tumbuhan dalam verba Yunani—tumbuh atau berbunga kembali—dan tetap wajar untuk perhatian yang kembali terwujud.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: perhatianmu kepadaku
  rationale: Dalam konteks dukungan jemaat Filipi, φρονεῖν mencakup sikap memikirkan dan memedulikan, bukan sekadar kegiatan kognitif.
- source_word: ἐφ’ ᾧ
  choice: Sebenarnya
  rationale: Secara idiomatis memperkenalkan penjelasan Paulus bahwa perhatian mereka tidak pernah lenyap.
- source_word: ἐφρονεῖτε
  choice: kamu memang tetap memikirkan aku
  rationale: Mempertahankan unsur dasar ‘memikirkan’ dalam φρονέω, sedangkan ‘tetap’ menyatakan durasi bentuk imperfek dan memperjelas bahwa kepedulian mereka berlanjut.
- source_word: ἠκαιρεῖσθε
  choice: kamu tidak mendapat kesempatan
  rationale: Menunjukkan ketiadaan kesempatan yang sesuai, bukan kurangnya niat atau kepedulian.
theological_decisions:
- issue: Sumber dan lingkup sukacita Paulus dalam frasa ἐν κυρίῳ
  choice: dalam Tuhan
  alternative: karena Tuhan
  rationale: Terjemahan ‘dalam Tuhan’ mempertahankan keluasan frasa Yunani dan tidak membatasinya hanya pada sebab sukacita.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal ‘Aku’ mengacu kepada Paulus, sedangkan ‘kamu’ bersifat jamak karena ditujukan kepada jemaat Filipi. Metafora ἀνεθάλετε dipertahankan secara alami sebagai ‘bersemi kembali’.
