  to: Aku sangat bersukacita dalam Tuhan karena sekarang, setelah sekian lama, kalian kembali menunjukkan perhatian kepada aku[a]. Memang, kalian tetap memikirkan aku[b], tetapi kalian tidak mendapat kesempatan.
  rationale: Revisi menempatkan jemaat Filipi sebagai subjek tindakan, sebagaimana dalam ἀνεθάλετε, dan memakai ungkapan Indonesia yang lebih alami untuk kepedulian yang kembali tampak. Metafora tumbuhan Yunani tetap dipertahankan secara transparan dalam catatan kaki. «Memang» menjaga fungsi penegasan ἐφ’ ᾧ tanpa menambahkan kesan bahwa Paulus membantah suatu dugaan.
