  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: id
  text: Anugerah Tuhan Yesus Kristus menyertai roh kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memiliki bacaan yang pada dasarnya berarti “menyertai kalian semua,” bukan “menyertai roh kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Dalam salam berkat Paulus, χάρις menunjuk pada pemberian dan kebaikan Allah yang tidak diperoleh berdasarkan jasa. “Anugerah” mempertahankan bobot teologisnya sekaligus merupakan istilah Indonesia yang wajar.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος di sini merupakan gelar kristologis bagi Yesus; “Tuhan” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: Kristus
  rationale: Dalam rangkaian nama dan gelar yang sudah mapan, “Yesus Kristus” terdengar paling alami dalam bahasa Indonesia. Bentuk ini tetap mempertahankan gelar Χριστός tanpa memaksanya menjadi sekadar nama diri.
- source_word: μετὰ
  choice: menyertai
  rationale: μετά dengan genitif menyatakan kebersamaan atau kehadiran. Dalam rumusan berkat bahasa Indonesia, “menyertai” lebih alami daripada terjemahan harfiah “bersama dengan”.
- source_word: πνεύματος
  choice: roh
  rationale: Konteks menunjuk pada roh manusia atau kehidupan batin para penerima, bukan secara eksplisit pada Roh Kudus; karena itu digunakan huruf kecil.
- source_word: ὑμῶν
  choice: kalian
  rationale: ὑμῶν adalah kata ganti orang kedua jamak. “Kalian” menyatakan kejamakan itu secara jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah πνεύματος menunjuk pada roh manusia atau Roh Kudus
  choice: roh kalian
  alternative: Roh yang menyertai kalian
  rationale: Konstruksi genitif ὑμῶν paling langsung berarti “roh kalian,” dan rumusan penutup Paulus mendukung pengertian kolektif tentang kehidupan batin jemaat. Teks tidak secara eksplisit menyebut Roh Kudus.
- issue: Apakah Χριστοῦ diterjemahkan sebagai “Mesias” atau dipertahankan sebagai “Kristus”
  choice: Kristus
  alternative: Mesias
  rationale: Walaupun Χριστός berasal dari gelar yang berarti “Yang Diurapi/Mesias,” dalam formula “Tuhan Yesus Kristus” unsur itu sangat erat dengan nama Yesus. “Kristus” mempertahankan bentuk gelar yang mapan dan alami tanpa meniadakan makna mesianiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Menyertai” dipakai agar bentuk berkat tersirat dalam kalimat Yunani tanpa menambahkan kata kerja modal yang tidak ada. Kata ganti “kalian” dipilih untuk memperlihatkan bahwa ὑμῶν berbentuk jamak.
