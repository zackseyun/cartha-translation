id: PHP.4.7
reference: Philippians 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: id
  text: Dan damai sejahtera Allah, yang melampaui segala pengertian, akan menjaga hati dan pikiran kalian dalam Mesias Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan Indonesia yang alami dalam register Alkitab modern dan mencakup ketenteraman serta keutuhan, tanpa mempersempit makna menjadi perasaan batin saja.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Konstruksi genitif dipertahankan secara langsung sebagai 'damai sejahtera Allah', tanpa menambahkan tafsiran sumber seperti 'dari Allah'.
- source_word: ἡ ὑπερέχουσα
  choice: yang melampaui
  rationale: Menyampaikan gagasan bahwa damai sejahtera Allah berada di atas atau melebihi batas kemampuan memahami.
- source_word: πάντα νοῦν
  choice: segala pengertian
  rationale: Dalam konteks ini νοῦς menunjuk pada daya memahami; 'segala pengertian' mempertahankan keluasan πάντα dan terdengar wajar dalam bahasa Indonesia.
- source_word: φρουρήσει
  choice: akan menjaga
  rationale: Mempertahankan nuansa perlindungan dan penjagaan dari verba yang dapat menggambarkan tugas pengawal, tanpa memperjelas metafora secara berlebihan.
- source_word: τὰς καρδίας ὑμῶν
  choice: hati ... kalian
  rationale: '''Hati'' mempertahankan gambaran alkitabiah tentang pusat kehidupan batin; ''kalian'' menyatakan bahwa ὑμῶν berbentuk jamak.'
- source_word: τὰ νοήματα ὑμῶν
  choice: pikiran kalian
  rationale: '''Pikiran'' merupakan padanan alami bagi νοήματα di sini dan berpasangan jelas dengan ''hati''.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Menerjemahkan Χριστός sebagai gelar 'Mesias' dan mempertahankan ἐν sebagai 'dalam', sehingga relasi atau lingkup keberadaan di dalam Yesus sang Mesias tidak direduksi menjadi sekadar perantaraan.
theological_decisions:
- issue: Makna genitif dalam εἰρήνη τοῦ θεοῦ
  choice: damai sejahtera Allah
  alternative: damai sejahtera dari Allah
  rationale: Bentuk utama mempertahankan genitif Yunani dan tidak memutuskan secara eksplisit apakah tekanannya pada kepunyaan, ciri, atau sumber.
- issue: Penerjemahan Χριστῷ dalam formula Paulus ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  alternative: dalam Kristus Yesus
  rationale: Χριστός tetap diperlakukan sebagai gelar yang bermakna dan diterjemahkan menjadi 'Mesias'; frasa tersebut menyatakan lingkup kehidupan serta keamanan umat dalam Yesus sebagai Mesias.
- issue: Cakupan πάντα νοῦν
  choice: segala pengertian
  alternative: setiap pikiran
  rationale: Konteks mendukung kemampuan memahami, tetapi bentuk terjemahan ini tidak menambahkan kata 'manusia' yang tidak dinyatakan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai pronomina orang kedua jamak secara jelas; struktur kalimat tetap dekat dengan urutan dan ketegangan semantis teks Yunani.
