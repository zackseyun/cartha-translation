  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: id
  text: Dan Allahku akan memenuhi setiap kebutuhan kalian menurut kekayaan-Nya dalam kemuliaan, di dalam Mesias Yesus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di dalam Kristus Yesus.”'
    reason: lexical_alternative
  - marker: b
    text: “Menurut kekayaan-Nya” menunjukkan ukuran atau patokan pemberian Allah, bukan hanya bahwa pemberian itu berasal dari kekayaan-Nya.
    reason: alternative_reading
  - marker: c
    text: “Dalam kemuliaan” juga mungkin dipahami sebagai “dengan mulia.” Hubungan tepat frasa ini dengan “di dalam Mesias Yesus” tidak dinyatakan secara tegas dalam bahasa Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: Dan Allahku
  rationale: δέ berfungsi sebagai penghubung ringan dalam alur ini; “Dan” mempertahankan kesinambungan tanpa menonjolkan pertentangan yang tidak perlu, sedangkan “Allahku” menjaga unsur personal.
- source_word: πληρώσει
  choice: akan memenuhi
  rationale: Dalam konteks kebutuhan, πληρόω berarti mencukupi atau menyediakan apa yang kurang. “Akan memenuhi” alami dalam bahasa Indonesia dan tetap dekat dengan citra leksikal verba Yunani.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: setiap kebutuhan kalian
  rationale: χρεία berarti kebutuhan atau keperluan, dan πᾶσαν memberi daya distributif “setiap”. “Kalian” menyatakan bahwa ὑμῶν berbentuk jamak.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: sesuai dengan kekayaan-Nya
  rationale: κατά dengan akusatif menunjukkan ukuran atau patokan, bukan sekadar sumber. Ungkapan ini menyiratkan pemenuhan yang sepadan dengan kekayaan Allah.
- source_word: ἐν δόξῃ
  choice: dalam kemuliaan
  rationale: Terjemahan formal ini mempertahankan keterbukaan fungsi frasa Yunani, yang dapat dipahami sebagai lingkup, cara, atau kualitas pemenuhan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  rationale: Χριστός di sini tetap merupakan gelar mesianik. “Mesias” menerjemahkan makna gelar tersebut, sementara “di dalam” mempertahankan ungkapan persatuan atau lingkup yang khas dalam surat-surat Paulus.
theological_decisions:
- issue: Penerjemahan Χριστός dalam ἐν Χριστῷ Ἰησοῦ
  choice: di dalam Mesias Yesus
  alternative: di dalam Kristus Yesus
  rationale: Teks memakai gelar Χριστός. “Mesias” menyampaikan arti gelar itu secara langsung; bentuk tradisional “Kristus” dicatat sebagai alternatif agar pembaca mengenali padanan yang lazim.
- issue: Hubungan sintaksis ἐν δόξῃ dan ἐν Χριστῷ Ἰησοῦ
  choice: mempertahankan rangkaian “dalam kemuliaan di dalam Mesias Yesus”
  alternative: “dengan mulia melalui Mesias Yesus” atau mengaitkan “di dalam Mesias Yesus” secara khusus dengan “kemuliaan”
  rationale: Bahasa Yunani tidak menetapkan secara tegas apakah kedua frasa menerangkan cara, lingkup, atau keseluruhan tindakan pemenuhan. Terjemahan utama tidak memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa pronomina Yunani berbentuk jamak. Kapitalisasi pada “-Nya” mengikuti kebiasaan umum penulisan rujukan kepada Allah. Susunan preposisional dipertahankan meskipun agak padat demi menjaga ambiguitas asli.
