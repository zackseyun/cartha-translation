  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: id
  text: Apa yang juga telah kamu pelajari, kamu terima, kamu dengar, dan kamu lihat pada diriku[b], teruslah lakukan semuanya itu[a]. Dan Allah, sumber damai sejahtera, akan menyertai kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “praktikkanlah semuanya itu.”
    reason: lexical_alternative
  - marker: b
    text: “Yang kamu lihat pada diriku” juga dapat diungkapkan sebagai “yang kamu lihat dalam teladanku” atau “yang kamu lihat dalam kehidupanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Apa yang
  rationale: Kata ganti relatif netral jamak ini memperkenalkan seluruh isi nasihat. “Apa yang” wajar dalam bahasa Indonesia, sedangkan kemajemukannya dinyatakan kembali melalui “semuanya itu”.
- source_word: ἐμάθετε
  choice: telah kamu pelajari
  rationale: Bentuk aoris menunjuk pada hal-hal yang sudah dipelajari jemaat Filipi dari Paulus; “telah kamu pelajari” jelas dan alami.
- source_word: παρελάβετε
  choice: terima
  rationale: Kata ini dapat menunjuk pada penerimaan ajaran atau tradisi. “Terima” mempertahankan keluasan maknanya tanpa menambahkan kata “tradisi” yang tidak dinyatakan secara eksplisit.
- source_word: ἠκούσατε
  choice: dengar
  rationale: Padanan langsung ini mempertahankan rangkaian empat verba secara ringkas dan sejajar.
- source_word: εἴδετε ἐν ἐμοί
  choice: lihat dalam diriku
  rationale: Terjemahan ini mempertahankan ungkapan Yunani yang menunjuk pada apa yang dapat diamati dalam diri atau kehidupan Paulus, tanpa langsung menafsirkannya sebagai “teladan”.
- source_word: ταῦτα πράσσετε
  choice: teruslah lakukan semuanya itu
  rationale: Imperatif kini πράσσετε menyerukan tindakan yang dijalankan secara berkelanjutan atau menjadi kebiasaan. “Teruslah lakukan” menyampaikan aspek itu dengan bahasa Indonesia yang alami.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Allah, sumber damai sejahtera
  rationale: Ungkapan genitif Yunani menyatakan hubungan erat Allah dengan damai sejahtera. Bentuk idiomatis Indonesia ini menghindari ungkapan kaku “Allah dari damai sejahtera” sambil mempertahankan gelar Paulus.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: akan menyertai kamu
  rationale: Ungkapan ini menyatakan jaminan tentang kehadiran Allah. “Akan menyertai kamu” merupakan padanan Indonesia yang alami bagi “akan bersama dengan kamu”.
theological_decisions:
- issue: Hubungan antara ketaatan dan kehadiran Allah
  choice: Nasihat diikuti oleh janji dan dihubungkan dengan “Dan”, tanpa diubah menjadi rumusan syarat eksplisit.
  alternative: 'Menerjemahkannya sebagai hubungan sebab-akibat bersyarat: “Jika kamu melakukannya, maka Allah ...”'
  rationale: Teks Yunani menghubungkan kedua klausa dengan καί, bukan dengan konstruksi syarat. Terjemahan mempertahankan daya pastoral serta ketegangan teologis teks tanpa menambahkan kepastian kausal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian verba dibuat ringkas agar mudah dibaca, sementara “teruslah” menyampaikan sifat berkelanjutan dari perintah. Penanda catatan kaki [b] dan [a] ditempatkan langsung sesudah frasa yang diterangkannya.
