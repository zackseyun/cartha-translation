base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: id
  text: Bukan karena aku berkekurangan aku mengatakan ini, sebab aku telah belajar merasa cukup[a] dalam keadaan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkecukupan dalam diri sendiri”; kata sifat Yunani ini dapat menunjuk pada kecukupan dalam diri sendiri, tetapi dalam konteks ini diterjemahkan “merasa cukup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: karena kekurangan
  rationale: Frasa ini menyatakan bahwa perkataan Paulus tidak didorong oleh keadaan berkekurangan atau kebutuhan pribadi. Ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan makna sumber.
- source_word: λέγω
  choice: aku mengatakan hal ini
  rationale: Bentuk kini Yunani merujuk pada pernyataan yang sedang Paulus sampaikan; 'hal ini' membuat acuannya wajar dalam bahasa Indonesia tanpa menambah gagasan baru.
- source_word: ἔμαθον
  choice: aku telah belajar
  rationale: Bentuk aoris menunjuk pada proses belajar yang telah terjadi dan hasilnya tetap berlaku; 'telah belajar' menyampaikan relevansi kini secara alami.
- source_word: ἐν οἷς εἰμι
  choice: dalam keadaan apa pun
  rationale: Frasa relatif ini bersifat idiomatis dan menunjuk pada berbagai keadaan yang Paulus alami, bukan sekadar lokasi.
- source_word: αὐτάρκης
  choice: merasa cukup
  rationale: Pilihan ini menyampaikan ketenteraman karena memiliki kecukupan dalam keadaan apa pun, sambil menghindari kesan bahwa Paulus mengandalkan dirinya secara mutlak.
theological_decisions:
- issue: Nuansa filosofis αὐτάρκης
  choice: merasa cukup
  alternative: mencukupi diri sendiri
  rationale: Dalam konteks ini Paulus menggambarkan sikap berkecukupan yang dipelajari di tengah berbagai keadaan. 'Merasa cukup' sesuai dengan konteks dan tidak secara berlebihan menyiratkan kemandirian mutlak; kemungkinan leksikal lainnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Kata ganti 'aku' mempertahankan suara pribadi Paulus, sedangkan susunan kalimat dibuat alami tanpa menghilangkan hubungan sebab-akibat dalam teks Yunani.
