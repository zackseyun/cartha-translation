  naturalness: “Buah yang semakin menambah keuntungan kalian” adalah bahasa Indonesia modern yang lebih lancar daripada “buah yang terus bertambah dalam perhitungan kalian,” sambil tetap mempertahankan metafora buah dan citra keuntungan/pembukuan. “Pemberian” tanpa “itu” juga lebih idiomatis; artikel Yunani tidak mengharuskan demonstratif Indonesia.
  terminology: “Pemberian” tepat untuk δόμα dan “buah” patut dipertahankan untuk καρπός. “Keuntungan kalian” menyampaikan fungsi komersial λόγος dalam konteks tanpa menetapkan bahwa buah itu adalah pahala atau berkat tertentu. Catatan kaki perlu diselaraskan dengan teks revisi dan mempertahankan alternatif “dikreditkan pada rekening kalian.”
