  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: id
  text: Bukan berarti aku mencari pemberian, melainkan aku mencari buah yang semakin menambah keuntungan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “buah yang berlimpah dan dikreditkan pada rekening kalian.”'
    reason: Alternatif ini mempertahankan kemungkinan πλεονάζοντα berarti “berlimpah” dan menampilkan secara lebih eksplisit citra pembukuan dalam εἰς λόγον ὑμῶν.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: aku mencari
  rationale: Kata kerja ini menyatakan upaya mencari atau menginginkan dengan sungguh-sungguh. Pengulangan “aku mencari” mempertahankan kontras retoris dalam bahasa Yunani.
- source_word: τὸ δόμα
  choice: pemberian itu
  rationale: Istilah ini menunjuk pada pemberian yang dikirim jemaat Filipi. “Pemberian” merupakan padanan langsung dan alami tanpa menambahkan penegasan yang tidak tersurat.
- source_word: τὸν καρπὸν
  choice: buah
  rationale: “Buah” mempertahankan metafora hasil atau panen dan membiarkannya berdampingan dengan bahasa pembukuan yang menyusul.
- source_word: τὸν πλεονάζοντα
  choice: yang terus bertambah
  rationale: Partisipel ini menggambarkan pertambahan atau kelimpahan yang berlangsung. “Terus bertambah” menyampaikan nuansa progresif secara alami.
- source_word: εἰς λόγον ὑμῶν
  choice: dalam perhitungan kalian
  rationale: Dalam konteks ini λόγος memakai citra pembukuan atau perhitungan. Pilihan ini mempertahankan bahasa komersial tanpa mempersempitnya menjadi rekening bank modern.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Bukan berarti ... melainkan
  rationale: Bentuk ini menyatakan klarifikasi melalui kontras. Ungkapan Indonesia tersebut alami dan mempertahankan struktur retoris Paulus.
theological_decisions:
- issue: Hubungan antara buah dan perhitungan jemaat
  choice: Mempertahankan metafora campuran “buah” yang bertambah “dalam perhitungan kalian”
  alternative: Menafsirkannya secara eksplisit sebagai pahala, berkat rohani, atau keuntungan
  rationale: Teks Yunani tidak merinci hakikat buah atau bagaimana hal itu diperhitungkan. Terjemahan tidak boleh menetapkan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “aku” dan “kalian” mengikuti hubungan pribadi Paulus dengan jemaat sebagai kelompok. Metafora pertanian dan pembukuan sengaja dipertahankan.
