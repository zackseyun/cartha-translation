id: PHP.4.6
reference: Philippians 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: id
  text: Jangan khawatir tentang apa pun[a], tetapi dalam segala hal, melalui doa dan permohonan[b] dengan ucapan syukur, sampaikanlah permintaanmu kepada Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan mencemaskan apa pun.”
    reason: lexical_alternative
  - marker: b
    text: Atau “permohonan khusus” untuk “permohonan.”
    reason: lexical_alternative
  - marker: c
    text: Frasa Yunani yang diterjemahkan “kepada Allah” juga dapat dipahami “di hadapan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Jangan khawatir tentang apa pun
  rationale: Larangan dengan μηδέν paling alami dinyatakan demikian dalam bahasa Indonesia; μεριμνάω di sini menunjuk pada kekhawatiran atau kecemasan yang membebani.
- source_word: ἐν παντὶ
  choice: dalam segala hal
  rationale: Mempertahankan cakupan luas frasa Yunani tanpa membatasinya secara eksplisit hanya pada keadaan tertentu.
- source_word: τῇ προσευχῇ καὶ τῇ δεήσει
  choice: melalui doa dan permohonan
  rationale: Membedakan προσευχή sebagai istilah umum untuk doa dan δέησις sebagai permohonan khusus, sekaligus menghasilkan ungkapan Indonesia yang wajar.
- source_word: μετ’ εὐχαριστίας
  choice: yang disertai ucapan syukur
  rationale: Menyatakan bahwa doa dan permohonan dilakukan bersama ucapan syukur; susunan ini alami dan menjaga bobot bentuk nomina εὐχαριστία.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: permintaan-permintaanmu
  rationale: Menyampaikan hal-hal konkret yang diminta dan mempertahankan bentuk jamak; akhiran -mu mewakili ὑμῶν yang jamak dalam konteks jemaat.
- source_word: γνωριζέσθω
  choice: sampaikanlah
  rationale: Imperatif aktif idiomatis dalam bahasa Indonesia menyampaikan daya perintah dari imperatif pasif Yunani tanpa konstruksi pasif yang kaku.
- source_word: πρὸς τὸν θεόν
  choice: kepada Allah
  rationale: Padanan langsung dan alami bagi πρὸς dalam hubungan dengan tindakan menyampaikan permintaan.
theological_decisions:
- issue: Cakupan larangan terhadap kekhawatiran
  choice: Jangan khawatir tentang apa pun
  alternative: Jangan mencemaskan apa pun
  rationale: Terjemahan tidak menambahkan pengecualian ataupun menyamakan larangan ini dengan penolakan terhadap kepedulian yang wajar; ketegangan luas dalam teks dipertahankan.
- issue: Bentuk pasif γνωριζέσθω
  choice: sampaikanlah permintaan-permintaanmu
  alternative: biarlah permintaan-permintaanmu diberitahukan
  rationale: Bentuk aktif dipilih demi bahasa Indonesia yang alami, tanpa menyiratkan bahwa Allah sebelumnya tidak mengetahui kebutuhan mereka; ayat memerintahkan tindakan membawanya dalam doa.
- issue: Arti πρὸς τὸν θεόν
  choice: kepada Allah
  alternative: di hadapan Allah
  rationale: Arah komunikasi merupakan arti paling langsung dalam konteks ini, sedangkan kemungkinan nuansa kehadiran dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lancar untuk pembaca umum. Bentuk orang kedua jamak Yunani diterjemahkan dengan -mu sesuai kebiasaan bahasa Indonesia ketika menyapa jemaat secara kolektif; tidak digunakan bentuk formal yang kaku.
