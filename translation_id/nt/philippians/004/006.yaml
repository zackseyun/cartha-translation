revisions:
- from: Jangan khawatir tentang apa pun[a], tetapi dalam segala hal, melalui doa dan permohonan yang disertai ucapan syukur, sampaikanlah permintaan-permintaanmu kepada Allah.[b]
  to: Jangan khawatir tentang apa pun[a], tetapi dalam segala hal, melalui doa dan permohonan[b] dengan ucapan syukur, sampaikanlah permintaanmu kepada Allah.[c]
  rationale: Revisi ini mempertahankan semua unsur makna Yunani dan daya imperatifnya dalam bahasa Indonesia yang alami. Bentuk aktif “sampaikanlah” tetap merupakan cara idiomatis untuk menyatakan imperatif pasif γνωριζέσθω tanpa menyiratkan bahwa Allah belum mengetahui permintaan umat. Catatan kaki ditata kembali agar alternatif leksikal yang relevan bagi “permohonan” dan “kepada Allah” tersedia pada jangkar yang tepat.
