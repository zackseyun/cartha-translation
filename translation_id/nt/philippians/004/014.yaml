  text: Nevertheless[b][a], you did well by sharing in my affliction.
translation:
  language: id
  text: Namun demikian[a], kalian telah berbuat baik dengan turut ambil bagian dalam penderitaanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Akan tetapi” atau “Namun”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dengan berbagi penderitaan bersamaku.”
