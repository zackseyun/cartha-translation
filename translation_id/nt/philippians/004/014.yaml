lexical_decisions:
- source_word: πλὴν
  choice: Namun demikian
  rationale: Menandai peralihan yang bernuansa kontras dengan pernyataan sebelumnya, tanpa mengurangi pujian Paulus.
- source_word: καλῶς ἐποιήσατε
  choice: kalian telah berbuat baik
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan penilaian positif terhadap tindakan jemaat; bentuk perfek alami dalam konteks ini menggambarkan tindakan lampau yang sedang Paulus apresiasi.
- source_word: συγκοινωνήσαντές
  choice: dengan turut mengambil bagian
  rationale: Menyampaikan keterlibatan aktif dan kebersamaan, bukan sekadar simpati dari kejauhan.
- source_word: μου τῇ θλίψει
  choice: dalam kesusahanku
  rationale: Genitif μου secara alami dipahami berkaitan dengan θλίψει, yakni kesusahan yang dialami Paulus; 'kesusahan' mempertahankan bobot tekanan atau penderitaan tanpa mempersempit jenisnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kalian” dipakai untuk memperjelas bahwa subjek orang kedua berbentuk jamak. Susunan kalimat mempertahankan kontras pembuka, pujian Paulus, serta gagasan partisipasi aktif jemaat dalam kesusahannya.
