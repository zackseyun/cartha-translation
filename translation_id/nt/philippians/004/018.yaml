id: PHP.4.18
reference: Philippians 4:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: id
  text: Namun, aku sudah menerima semuanya[a], dan aku berkelimpahan. Aku sudah tercukupi sepenuhnya karena telah menerima dari Epafroditus apa yang berasal dari kalian—aroma yang harum, kurban yang berkenan kepada Allah dan menyenangkan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “aku sudah menerima sepenuhnya” atau “aku telah menerima pembayaran penuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: aku telah menerima ... dengan penuh
  rationale: Dalam konteks dukungan materi, verba ini dapat berarti menerima secara penuh atau memiliki semuanya dalam tangan. Ungkapan ini mempertahankan kemungkinan nuansa tanda terima/pelunasan tanpa menjadikan bahasa utama terlalu komersial.
- source_word: πάντα
  choice: semuanya
  rationale: Bentuk jamak netral ini mencakup seluruh pemberian jemaat Filipi; 'semuanya' alami dan menyeluruh dalam bahasa Indonesia.
- source_word: περισσεύω
  choice: aku berkelimpahan
  rationale: Verba ini menyatakan keadaan melampaui kecukupan dan mempertahankan pasangan retoris dengan pernyataan berikut tentang tercukupi sepenuhnya.
- source_word: πεπλήρωμαι
  choice: aku telah tercukupi sepenuhnya
  rationale: Bentuk perfektum menekankan keadaan kini sebagai hasil pemberian mereka. Terjemahan ini menyampaikan kecukupan penuh dalam konteks dukungan materi.
- source_word: δεξάμενος
  choice: setelah menerima
  rationale: Partisip ini menjelaskan bagaimana Paulus sampai berada dalam keadaan tercukupi; hubungan temporal-hasil disampaikan secara alami.
- source_word: παρὰ Ἐπαφροδίτου
  choice: dari Epafroditus
  rationale: Epafroditus disebut sebagai sumber langsung atau pembawa yang darinya Paulus menerima pemberian itu, sedangkan frasa selanjutnya menegaskan asalnya dari jemaat.
- source_word: τὰ παρ’ ὑμῶν
  choice: apa yang berasal dari kalian
  rationale: Ungkapan ini menunjuk kepada pemberian yang berasal dari jemaat Filipi tanpa menambahkan secara eksplisit verba 'kirim' yang tidak terdapat dalam teks.
- source_word: ὀσμὴν εὐωδίας
  choice: suatu aroma harum
  rationale: Terjemahan ini mempertahankan gema bahasa persembahan dalam Kitab Suci sekaligus terdengar wajar dan hidup dalam bahasa Indonesia modern.
- source_word: θυσίαν δεκτήν
  choice: suatu kurban yang berkenan
  rationale: '''Kurban'' mempertahankan citra ibadah/persembahan, sedangkan ''yang berkenan'' menyampaikan bahwa kurban itu diterima dengan baik.'
- source_word: εὐάρεστον τῷ θεῷ
  choice: menyenangkan Allah
  rationale: Frasa ini secara langsung menyatakan penilaian positif Allah terhadap pemberian tersebut dengan bahasa modern dan bermartabat.
theological_decisions:
- issue: Citra kurban bagi pemberian materi jemaat Filipi
  choice: 'Mempertahankan rangkaian metafora ibadah: ''suatu aroma harum, suatu kurban yang berkenan dan menyenangkan Allah.'''
  alternative: Meratakan metafora menjadi sekadar ungkapan terima kasih atau menerjemahkannya secara lebih bebas sebagai 'persembahan yang diterima Allah dengan senang hati.'
  rationale: Paulus dengan sengaja menggambarkan pemberian itu memakai bahasa kurban. Mempertahankan aroma, kurban, dan perkenanan Allah menjaga daya teologis teks tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, hangat, dan bermartabat. Kata ganti 'aku/kalian' dipakai untuk mempertahankan nada surat pribadi dan pembedaan tunggal-jamak. Istilah 'kurban' dipertahankan demi gema kultis, sementara susunan kalimat dibuat alami bagi pembaca umum.
