id: PHP.4.4
reference: Philippians 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: id
  text: 'Bersukacitalah senantiasa di dalam Tuhan[a]. Sekali lagi akan kukatakan[b]: Bersukacitalah!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bergembiralah senantiasa di dalam Tuhan.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “lagi aku akan berkata: Bersukacitalah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Bersukacitalah
  rationale: Bentuk ini mempertahankan daya imperatif orang kedua jamak dan menyampaikan makna χαίρω dalam nasihat Paulus secara wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ἐν
  choice: di dalam
  rationale: Ungkapan ini mempertahankan makna lingkup atau relasi—bersukacita dalam persekutuan dengan atau dalam hubungan dengan Tuhan—tanpa mempersempitnya menjadi sekadar ‘karena’.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: Dalam pemakaian Paulus di sini, κύριος merujuk kepada Kristus; ‘Tuhan’ merupakan padanan baku yang tepat.
- source_word: πάντοτε
  choice: senantiasa
  rationale: ‘Senantiasa’ menyampaikan cakupan waktu yang terus-menerus dan sesuai dengan ragam bahasa Alkitab modern yang bermartabat.
- source_word: πάλιν
  choice: sekali lagi
  rationale: Frasa ini secara alami menandai pengulangan yang memberi penegasan.
- source_word: ἐρῶ
  choice: akan kukatakan
  rationale: Padanan ini mempertahankan bentuk futurum dari λέγω dan tetap alami dalam bahasa Indonesia.
- source_word: χαίρετε
  choice: Bersukacitalah
  rationale: Imperatif yang diulang diterjemahkan secara konsisten untuk mempertahankan penekanan retoris Paulus.
theological_decisions:
- issue: Makna ‘di dalam Tuhan’
  choice: 'Mempertahankan pembacaan lingkup/relasi: umat percaya diperintahkan bersukacita dalam hubungan dan persekutuan dengan Tuhan.'
  alternative: Bersukacita oleh kemampuan yang Tuhan berikan, atau bersukacita karena Tuhan.
  rationale: Frasa ἐν κυρίῳ dalam tulisan Paulus lazimnya menandai lingkup atau kedudukan relasional. ‘Di dalam Tuhan’ mempertahankan keluasan teologis itu tanpa menafsirkan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan imperatif yang diulang, bentuk futurum, serta keluasan makna frasa ‘di dalam Tuhan’.
