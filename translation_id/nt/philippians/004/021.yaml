  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: id
  text: Sampaikanlah salam kepada setiap orang kudus dalam Mesias Yesus.[a] Saudara-saudara[b] yang bersama saya menyampaikan salam kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam Kristus Yesus.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “Saudara-saudara” dapat merujuk secara lebih luas kepada sesama orang percaya yang bersama Paulus, termasuk laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Salamilah
  rationale: Bentuk imperatif ini meminta para penerima surat menyampaikan salam; “Salamilah” ringkas, langsung, dan wajar dalam penutup surat.
- source_word: πάντα ἅγιον
  choice: setiap orang kudus
  rationale: Bentuk tunggal dengan πᾶς bersifat distributif. “Setiap orang kudus” mempertahankan makna tiap-tiap anggota umat yang dikhususkan bagi Allah tanpa menyiratkan hanya tokoh tertentu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar yang berarti “Mesias”; frasa “dalam” dipertahankan untuk menjaga bahasa persatuan dan lingkup relasional dalam teks Yunani.
- source_word: ἀσπάζονται ὑμᾶς
  choice: menyampaikan salam kepada kalian
  rationale: Ungkapan ini merupakan rumusan salam surat. “Menyampaikan salam kepada kalian” alami dalam bahasa Indonesia dan menyatakan bahwa ὑμᾶς berbentuk jamak.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Saudara-saudara yang bersama saya
  rationale: “Saudara-saudara” mempertahankan bentuk maskulin jamak ἀδελφοί, sedangkan susunan relatif menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: “Mesias” mengungkapkan arti gelar Yunani Χριστός secara langsung; bentuk tradisional “Kristus” dicatat sebagai alternatif agar pembaca mengenali padanan yang lazim.
- issue: Cakupan ἀδελφοί
  choice: Saudara-saudara
  alternative: saudara-saudari / sesama orang percaya
  rationale: Teks utama mempertahankan bentuk gramatikal maskulin, tetapi catatan mengakui bahwa dalam konteks ini istilah tersebut dapat mencakup kelompok orang percaya yang terdiri dari laki-laki dan perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa ὑμᾶς berbentuk jamak; “saya” dipilih sebagai pronomina surat yang alami dan sopan. Kedua penanda catatan kaki muncul langsung dalam teks utama.
