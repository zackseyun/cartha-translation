id: PHP.4.16
reference: Philippians 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι καὶ ἐν Θεσσαλονίκῃ καὶ ἅπαξ καὶ δὶς εἰς τὴν χρείαν μοι ἐπέμψατε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: id
  text: Sebab bahkan ketika aku berada di Tesalonika, kalian mengirim bantuan untuk memenuhi kebutuhanku lebih dari sekali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sekali dan dua kali.”
    reason: Menunjukkan bentuk ungkapan Yunani yang mendasari terjemahan idiomatis 'lebih dari sekali'.
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan alasan yang menjelaskan pernyataan Paulus dalam konteks sebelumnya.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: bahkan ketika aku berada di Tesalonika
  rationale: καί bersifat penegas, sedangkan frasa lokatif Yunani secara alami diungkapkan dalam bahasa Indonesia sebagai keadaan saat Paulus berada di Tesalonika.
- source_word: ἅπαξ καὶ δὶς
  choice: lebih dari sekali
  rationale: Ungkapan Yunani harfiah 'sekali dan dua kali' menyatakan pengiriman yang berulang. 'Lebih dari sekali' menyampaikan maksudnya secara alami tanpa memakai frasa Indonesia 'sekali dua kali', yang dapat berarti 'kadang-kadang'.
- source_word: εἰς τὴν χρείαν μοι
  choice: untuk memenuhi kebutuhanku
  rationale: Menyatakan tujuan pengiriman yang diarahkan kepada kebutuhan Paulus; bentuk tunggal χρεία dipertahankan sebagai 'kebutuhanku'.
- source_word: ἐπέμψατε
  choice: kalian mengirim bantuan
  rationale: Bentuk orang kedua jamak diterjemahkan 'kalian'. Objek 'bantuan' tersirat dari konteks pemberian dan diperlukan agar kalimat Indonesia jelas serta alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan sapaan jamak 'kalian'. Susunan dibuat alami dan mudah dipahami, sementara penegasan 'bahkan', bentuk tunggal 'kebutuhan', serta sifat berulang dari pemberian dipertahankan.
