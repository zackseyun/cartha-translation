id: PHP.4.2
reference: Philippians 4:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: id
  text: Aku menasihati Euodia dan aku menasihati Sintikhe supaya sehati sepikir dalam Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya memiliki pikiran yang sama dalam Tuhan”; mungkin juga, “supaya bersepakat dalam Tuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Euodia
  rationale: Nama pribadi ini ditransliterasikan ke dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia, bukan diterjemahkan menurut arti etimologisnya.
- source_word: παρακαλῶ
  choice: aku menasihati
  rationale: Dalam konteks ini, παρακαλῶ menyampaikan imbauan pribadi yang sungguh-sungguh. 'Menasihati' terdengar alami dan bermartabat dalam bahasa Indonesia; pengulangan verba dipertahankan untuk menunjukkan bahwa Paulus menyapa kedua perempuan itu secara setara dan langsung.
- source_word: Συντύχην
  choice: Sintikhe
  rationale: Nama Yunani ini ditransliterasikan dengan ejaan Indonesia yang mencerminkan pengucapan sumber dan membedakannya secara jelas sebagai nama pribadi.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: supaya sehati sepikir
  rationale: Ungkapan ini menyatakan kesamaan cara berpikir sekaligus sikap batin. 'Sehati sepikir' merupakan ungkapan Indonesia yang alami dan mempertahankan dimensi relasional serta disposisional, tanpa membatasinya hanya pada persetujuan atas satu perkara.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Terjemahan yang cukup formal ini mempertahankan keterbukaan relasi yang dinyatakan oleh ἐν dan menunjukkan bahwa kesatuan yang diminta berakar serta berlangsung dalam hubungan dengan Tuhan.
theological_decisions:
- issue: Lingkup kesatuan yang diminta dalam τὸ αὐτὸ φρονεῖν ἐν κυρίῳ
  choice: sehati sepikir dalam Tuhan
  alternative: bersepakat dalam Tuhan
  rationale: Teks tidak sekadar menuntut persetujuan mengenai satu pokok, tetapi memakai φρονεῖν, yang dapat mencakup pola pikir dan sikap. Terjemahan utama mempertahankan keluasan itu tanpa menyatakan bahwa kedua perempuan harus seragam dalam segala hal.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina 'aku' sesuai dengan suara surat pribadi Paulus. Pengulangan 'aku menasihati' dipertahankan karena menonjol dalam teks Yunani dan memperlakukan Euodia serta Sintikhe secara sejajar.
