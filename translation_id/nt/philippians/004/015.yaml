id: PHP.4.15
reference: Philippians 4:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: id
  text: Kamu sendiri juga tahu, hai orang-orang Filipi, bahwa pada masa awal pemberitaan Injil, ketika aku meninggalkan Makedonia, tidak ada satu jemaat pun yang turut mengambil bagian denganku dalam urusan memberi dan menerima[a], selain kamu saja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam perhitungan memberi dan menerima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε
  choice: kamu ... tahu
  rationale: Bentuk οἶδα berfungsi sebagai verba statif dengan makna kini; “tahu” merupakan padanan Indonesia yang langsung dan alami.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini melanjutkan alur wacana tanpa pertentangan kuat; hubungan antarkalimat sudah alami dalam bahasa Indonesia tanpa konjungsi eksplisit.
- source_word: καὶ ὑμεῖς
  choice: kamu sendiri juga
  rationale: “Juga” mempertahankan daya aditif καί, sedangkan “sendiri” menyampaikan penekanan pada pronomina ὑμεῖς.
- source_word: Φιλιππήσιοι
  choice: hai orang-orang Filipi
  rationale: Sapaan vokatif diterjemahkan secara jelas dan wajar sebagai sebutan bagi penduduk atau anggota jemaat di Filipi.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: pada masa awal pemberitaan Injil
  rationale: Ungkapan ini menunjuk pada tahap awal karya Injil Paulus dalam hubungan mereka; penambahan “pemberitaan” membuat maksudnya alami dalam bahasa Indonesia tanpa menentukan titik waktu yang lebih khusus.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: aku meninggalkan Makedonia
  rationale: Padanan ini menyampaikan peristiwa keluarnya Paulus dari wilayah Makedonia secara lugas dan idiomatis.
- source_word: οὐδεμία ... ἐκκλησία
  choice: tidak ada satu jemaat pun
  rationale: Bentuk ini mempertahankan penyangkalan menyeluruh dan menggunakan “jemaat” sebagai padanan lazim bagi ἐκκλησία dalam konteks komunitas Kristen setempat.
- source_word: μοι ... ἐκοινώνησεν
  choice: turut mengambil bagian denganku
  rationale: Ungkapan ini mempertahankan gagasan partisipasi atau persekutuan nyata bersama Paulus, yang dalam konteksnya mencakup dukungan materi tanpa menyempitkan verba itu menjadi sekadar transaksi.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: dalam urusan memberi dan menerima
  rationale: “Urusan” menyampaikan makna luas λόγος dalam ungkapan ini secara jelas, sedangkan kemungkinan nuansa pembukuan dipertahankan dalam catatan kaki.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: selain kamu saja
  rationale: Padanan ini mempertahankan pengecualian sekaligus penekanan eksklusif pada jemaat Filipi.
theological_decisions: []
