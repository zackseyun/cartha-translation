  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. Pronomina “aku” dan “kamu” mengikuti relasi personal Paulus dengan para penerima surat; susunan kalimat dijaga cukup dekat dengan teks Yunani, tetapi dibuat alami bagi pembaca umum.
