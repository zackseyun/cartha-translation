  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: id
  text: Dalam segala hal aku sanggup melalui dia yang menguatkan aku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sanggup menghadapi segala keadaan.” Dalam konteksnya, Paulus berbicara tentang kesanggupan dalam setiap keadaan.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani berbunyi “dia yang menguatkan aku” dan tidak secara eksplisit menyebut Kristus dalam ayat ini, meskipun konteks menunjuk kepada-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: dalam segala hal
  rationale: Bentuk jamak akusatif ini secara luas berarti ‘segala sesuatu/segala hal’. Dalam konteks, Paulus berbicara tentang berbagai keadaan hidup; ‘dalam segala hal’ mempertahankan keluasan ungkapan Yunani sekaligus sesuai dengan konteks.
- source_word: ἰσχύω
  choice: aku sanggup
  rationale: Kata kerja ini menyatakan kekuatan atau kemampuan. ‘Aku sanggup’ mengungkapkan kemampuan yang diberikan kepadanya tanpa memberi kesan bahwa Paulus mengklaim dapat melakukan apa saja tanpa batas.
- source_word: ἐν
  choice: karena
  rationale: Walaupun arti dasarnya ‘di dalam’, dalam konstruksi dengan pribadi yang menguatkan, preposisi ini menyatakan dasar atau sarana kemampuan. ‘Karena’ terdengar alami dalam bahasa Indonesia dan menunjukkan bahwa kemampuan Paulus bersumber pada Dia yang menguatkannya.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: Dia yang menguatkan aku
  rationale: 'Partisip berartikel ini berfungsi substantival: ‘Dia yang menguatkan aku’. Terjemahan ini mempertahankan daya verbal yang berlangsung dan tidak menambahkan nama ‘Kristus’, yang tidak tertulis secara eksplisit dalam ayat ini.'
theological_decisions:
- issue: Rujukan tersirat dari ‘Dia yang menguatkan aku’
  choice: Tidak menambahkan ‘Kristus’ dalam teks utama.
  alternative: ‘karena Kristus yang menguatkan aku’
  rationale: Konteks menunjuk kepada Kristus sebagai rujukannya, tetapi teks Yunani ayat ini sendiri hanya mengatakan ‘Dia yang menguatkan aku’. Terjemahan mempertahankan yang eksplisit sambil menjelaskan rujukan kontekstual dalam catatan kaki.
- issue: Cakupan kemampuan Paulus
  choice: ‘Dalam segala hal aku sanggup’ dipahami dalam konteks segala keadaan yang baru disebutkan.
  alternative: ‘Aku dapat melakukan segala sesuatu’ sebagai pernyataan kemampuan tanpa batas.
  rationale: Ayat 11–12 membahas kemampuan menghadapi kekurangan maupun kelimpahan. Pilihan ini mempertahankan keluasan πάντα, tetapi tidak melepaskan pernyataan tersebut dari konteksnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan ‘Dalam segala hal aku sanggup’ menjaga hubungan dengan konteks dan menghindari pembacaan populer yang menjadikannya klaim kemampuan tanpa batas. Kapitalisasi ‘Dia’ dipakai sebagai petunjuk hormat kepada rujukan ilahi tanpa memasukkan nama yang tidak eksplisit dalam teks Yunani.
