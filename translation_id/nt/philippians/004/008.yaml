id: PHP.4.8
reference: Philippians 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: id
  text: Akhirnya, Saudara-saudara[a], semua yang benar, semua yang mulia, semua yang adil, semua yang murni, semua yang patut dicintai, semua yang terpuji—jika ada kebajikan dan jika ada pujian—pikirkanlah semuanya itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Saudara-saudara” secara harfiah berbentuk “saudara-saudara laki-laki”, tetapi dapat dipakai untuk menyapa seluruh komunitas orang percaya, baik laki-laki maupun perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Akhirnya
  rationale: Ungkapan ini berfungsi sebagai penanda peralihan menuju nasihat penutup. “Akhirnya” alami dalam bahasa Indonesia dan tetap mempertahankan daya transisinya.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini mempertahankan bentuk sapaan komunal yang akrab dan bermartabat. Dalam pemakaian bahasa Indonesia, “Saudara-saudara” dapat mencakup seluruh jemaat, sementara bentuk Yunani dan cakupan maksudnya dijelaskan dalam catatan kaki.
- source_word: ὅσα
  choice: semua yang
  rationale: Pengulangan ini mempertahankan pola retoris daftar Yunani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἀληθῆ
  choice: benar
  rationale: “Benar” menyampaikan kategori luas tentang hal yang sesuai dengan kebenaran, baik dalam pikiran maupun perilaku.
- source_word: σεμνά
  choice: mulia
  rationale: “Mulia” menyatakan sesuatu yang berbobot secara moral dan layak dihormati tanpa menjadi terlalu teknis.
- source_word: δίκαια
  choice: adil
  rationale: Dalam daftar etis ini, “adil” menyampaikan apa yang lurus, benar, dan sesuai dengan keadilan.
- source_word: ἁγνά
  choice: murni
  rationale: “Murni” mempertahankan cakupan moral dan batiniah kata Yunani tanpa mempersempitnya hanya pada kesucian seksual.
- source_word: προσφιλῆ
  choice: patut dicintai
  rationale: Ungkapan ini menyampaikan sesuatu yang menimbulkan kasih atau rasa suka; lebih tepat daripada “indah,” yang dapat terlalu berfokus pada estetika.
- source_word: εὔφημα
  choice: terpuji
  rationale: “Terpuji” secara ringkas menyatakan hal yang memiliki nama baik atau dibicarakan dengan baik.
- source_word: εἴ τις ἀρετὴ
  choice: jika ada suatu kebajikan
  rationale: “Kebajikan” mempertahankan bentuk nomina dan merangkum mutu atau keunggulan moral yang dimaksud.
- source_word: εἴ τις ἔπαινος
  choice: jika ada sesuatu yang patut dipuji
  rationale: Ungkapan ini mempertahankan kesejajaran dengan klausa sebelumnya dan menjelaskan bahwa yang dimaksud ialah sesuatu yang layak menerima pujian.
- source_word: ταῦτα λογίζεσθε
  choice: pikirkanlah semuanya itu
  rationale: Bentuk imperatif ini menyampaikan perhatian mental yang sengaja dan berkelanjutan dengan bahasa Indonesia yang jelas dan alami.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara, dengan catatan bahwa sapaan itu mencakup seluruh komunitas orang percaya
  alternative: Saudara-saudari
  rationale: Pilihan utama mempertahankan bentuk sapaan komunal yang dekat dengan bentuk Yunani, sedangkan catatan kaki menjaga kejelasan bahwa perempuan tidak dikecualikan dari sapaan tersebut.
- issue: Cakupan ἁγνά
  choice: murni
  alternative: suci atau tidak bercela
  rationale: “Murni” menjaga keluasan makna moral dan batiniah serta tidak membatasi istilah ini pada satu bidang etika tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “semua yang” mempertahankan irama daftar sumber Yunani. Tanda pisah menandai dua klausa rangkuman sebelum perintah penutup.
