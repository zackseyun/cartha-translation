  text: Sebab ia sangat merindukan kalian semua dan merasa sangat gelisah karena kalian mendengar bahwa ia sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Sebab
  rationale: Memperkenalkan alasan Paulus mengirim Epafroditus kembali dan mempertahankan nuansa kausal.
- source_word: ἐπιποθῶν ἦν
  choice: ia sangat merindukan
  rationale: Bentuk perifrastis ini menunjukkan keadaan yang berlangsung pada masa lampau; dalam bahasa Indonesia, intensitas verba disampaikan secara alami dengan 'sangat merindukan'.
- source_word: πάντας ὑμᾶς
  choice: kalian semua
  rationale: Mempertahankan penekanan πάντας serta menunjukkan dengan jelas bahwa pronomina orang kedua berbentuk jamak.
- source_word: ἀδημονῶν
  choice: merasa sangat gelisah
  rationale: Mengungkapkan tekanan batin yang kuat, bukan sekadar kekhawatiran ringan, dengan bahasa Indonesia yang wajar.
- source_word: διότι
  choice: karena
  rationale: Menyatakan sebab kegelisahan Epafroditus secara langsung.
- source_word: ἠκούσατε
  choice: kalian mendengar
  rationale: Menerjemahkan aoristus secara lugas dan menjaga subjek orang kedua jamak sebagaimana teks SBLGNT.
- source_word: ὅτι ἠσθένησεν
  choice: bahwa ia sakit
  rationale: Dalam konteks ini ἀσθενέω menunjuk pada penyakit jasmani; ungkapan ini alami dan tidak memaksakan nuansa permulaan keadaan.
