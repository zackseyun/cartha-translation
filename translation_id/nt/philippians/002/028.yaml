  to: Karena itu, aku mengutus dia dengan lebih sungguh-sungguh, supaya ketika kalian melihatnya lagi, kalian bersukacita dan aku pun menjadi kurang berdukacita.
  rationale: Revisi hanya memperbaiki klausa terakhir agar predikasi Indonesia gramatikal dan secara tepat mengungkapkan ἀλυπότερος ὦ sebagai keadaan Paulus yang menjadi kurang berdukacita. “Pun” secara wajar mencerminkan unsur koordinatif κἀγώ tanpa memberi penekanan berlebihan.
