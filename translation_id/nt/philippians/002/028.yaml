  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: id
  text: Karena itu, aku mengutus dia dengan lebih sungguh-sungguh, supaya ketika kalian melihatnya lagi, kalian bersukacita dan aku pun menjadi kurang berdukacita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: dengan lebih sungguh-sungguh
  rationale: Bentuk adverbia komparatif ini menyatakan peningkatan kesungguhan atau semangat. Pilihan ini mempertahankan daya komparatif tanpa membatasi maknanya hanya pada kecepatan atau urgensi.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai hubungan kesimpulan atau kelanjutan logis dengan uraian sebelumnya.
- source_word: ἔπεμψα
  choice: aku mengutus
  rationale: Aoristus indikatif diterjemahkan secara wajar sebagai tindakan lampau; 'mengutus' sesuai untuk pengiriman seorang rekan sebagai utusan.
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan tujuan yang mencakup sukacita jemaat dan berkurangnya dukacita Paulus.
- source_word: ἰδόντες
  choice: ketika kalian melihat
  rationale: Partisip aoristus paling alami dinyatakan sebagai keadaan temporal yang mendahului sukacita dalam klausa tujuan.
- source_word: πάλιν
  choice: lagi
  rationale: Menunjukkan bahwa jemaat akan kembali melihat Epafroditus.
- source_word: χαρῆτε
  choice: kalian bersukacita
  rationale: Subjungtif dalam klausa ἵνα menyatakan tujuan; 'bersukacita' mempertahankan kosakata penting yang berulang dalam surat ini.
- source_word: κἀγὼ
  choice: dan aku
  rationale: Crasis dari καὶ ἐγώ; koordinasi sederhana ini tidak menambahkan penekanan yang tidak wajib ada.
- source_word: ἀλυπότερος
  choice: berkurang dukacitanya
  rationale: Adjektiva komparatif ini secara harfiah menyatakan keadaan yang kurang berdukacita. Ungkapan Indonesia ini mempertahankan perbandingan tanpa mengubahnya menjadi ketiadaan dukacita sama sekali.
- source_word: ὦ
  choice: aku ... [berkeadaan]
  rationale: Subjungtif kini dari εἰμί tercakup secara idiomatis dalam predikasi 'aku berkurang dukacitanya' dan tetap berada di bawah cakupan tujuan ἵνα.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa penerima surat bersifat plural; 'aku' mengikuti nada pribadi surat Paulus. Susunan kalimat mempertahankan satu klausa tujuan dengan dua hasil yang terkoordinasi.
