  text: Karena itu, saya berharap dapat mengirim dia segera setelah saya mengetahui bagaimana keadaan saya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: dia
  rationale: Kata tunjuk akusatif ini merujuk kembali kepada Timotius; dalam bahasa Indonesia, pronomina “dia” lebih alami daripada “orang ini”.
- source_word: μὲν οὖν
  choice: Karena itu
  rationale: Gabungan partikel ini menandai peralihan yang bersifat simpulan atau konsekuensi; “Karena itu” menyampaikan hubungan wacananya secara alami.
- source_word: ἐλπίζω πέμψαι
  choice: saya berharap dapat ... mengutus
  rationale: ἐλπίζω menyatakan harapan atau pengharapan, sedangkan infinitif πέμψαι melengkapinya; susunan ini alami dan tetap dekat dengan bentuk sumber.
- source_word: ὡς ἂν ἀφίδω
  choice: begitu saya mengetahui
  rationale: Konstruksi ini menunjuk pada waktu mendatang yang bergantung pada saat Paulus dapat melihat atau memastikan situasinya. “Mengetahui” menyampaikan makna kontekstual dari melihat atau mencermati keadaan.
- source_word: τὰ περὶ ἐμέ
  choice: bagaimana keadaan saya
  rationale: Ungkapan ini berarti hal-hal yang menyangkut Paulus, yaitu perkembangan keadaannya; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἐξαυτῆς
  choice: segera
  rationale: Adverbia ini menyatakan tindakan tanpa penundaan. Ditempatkan sebelum “mengutus” agar secara alami menerangkan pengutusan yang akan dilakukan setelah situasi Paulus diketahui.
