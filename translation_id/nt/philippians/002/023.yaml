review_pass:
  verdict: revise
  source_fidelity: Draf menangkap rujukan kepada Timotius, harapan Paulus untuk mengirimnya, dan ketergantungan pengiriman itu pada kejelasan situasi Paulus. Namun, penempatan “segera” sebelum “mengutus” kurang mencerminkan hubungan temporal dalam ὡς ἂν ἀφίδω … ἐξαυτῆς, yang lebih baik dinyatakan sebagai pengiriman segera setelah Paulus mengetahui dengan jelas keadaannya.
  naturalness: Kalimat draf mudah dipahami dan baku, tetapi “segera ... begitu” terasa agak bertumpuk. “Segera setelah” menghasilkan hubungan waktu yang lebih lancar dan tepat dalam bahasa Indonesia modern.
  terminology: “Dia” tepat dan alami untuk τοῦτον yang merujuk kepada Timotius. “Mengirim” lebih netral dan langsung untuk πέμψαι daripada “mengutus,” yang dalam pemakaian Indonesia dapat menyiratkan penugasan resmi yang tidak perlu dinyatakan oleh verba sumber ini.
  issues:
  - severity: medium
    issue: Cakupan dan posisi “segera” kurang tepat.
    rationale: ἐξαυτῆς menegaskan ketergesaan yang terkait dengan saat Paulus sudah melihat/mengetahui perkara-perkaranya. Dalam draf, “segera mengutus dia begitu ...” dapat dibaca sebagai dua penanda waktu yang bertumpuk. “Mengirim dia segera setelah saya mengetahui ...” menyatakan relasi temporal itu dengan jelas.
  - severity: low
    issue: “Mengutus” lebih bernuansa daripada verba sumber.
    rationale: πέμπω pada konteks ini berarti “mengirim.” “Mengirim” mempertahankan makna tanpa kemungkinan nuansa penugasan resmi tambahan.
  revised_text: Karena itu, saya berharap dapat mengirim dia segera setelah saya mengetahui bagaimana keadaan saya.
