  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: id
  text: Sebab, aku tidak mempunyai siapa pun yang sejiwa denganku[a] dan yang akan sungguh-sungguh memedulikan hal-hal yang menyangkut kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang sehati denganku”; secara lebih harfiah, “berjiwa sama.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang akan sungguh-sungguh memperhatikan kepentingan kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan pernyataan ini dengan konteks sebelumnya.
- source_word: οὐδένα ... ἔχω
  choice: tidak ada seorang pun padaku
  rationale: Mencerminkan ungkapan Yunani secara wajar tanpa menambahkan kata 'lain' yang tidak dinyatakan secara eksplisit.
- source_word: ἰσόψυχον
  choice: sehati denganku
  rationale: Menyampaikan gagasan tentang kesamaan sikap batin atau jiwa dengan Paulus dalam bahasa Indonesia yang alami; unsur pembanding yang tersirat dibuat jelas dari konteks.
- source_word: ὅστις
  choice: dan yang
  rationale: Menghubungkan sifat sehati itu dengan orang yang akan sungguh-sungguh memperhatikan jemaat; 'dan' membantu kelancaran sintaksis Indonesia.
- source_word: γνησίως
  choice: sungguh-sungguh
  rationale: Mengungkapkan ketulusan dan keaslian kepedulian tanpa kesan sekadar intensitas emosional.
- source_word: τὰ περὶ ὑμῶν
  choice: keadaan kalian
  rationale: Mewakili secara idiomatis hal-hal yang menyangkut jemaat, sambil mempertahankan keluasan frasa Yunani.
- source_word: μεριμνήσει
  choice: akan ... memedulikan
  rationale: Dalam konteks ini menunjuk pada perhatian pastoral yang positif, bukan kecemasan yang tercela.
theological_decisions:
- issue: Acuan perbandingan dalam ἰσόψυχον
  choice: sehati denganku
  alternative: tidak ada seorang pun seperti dia
  rationale: Bentuk ἰσόψυχον secara leksikal menunjuk pada kesamaan jiwa atau sikap batin. Konteks paling alami membandingkan Timotius dengan Paulus, tetapi karena objek pembanding tidak dinyatakan eksplisit dalam kata Yunani, alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk menandai bahwa ὑμῶν mengacu kepada seluruh jemaat. Susunan mempertahankan daya penjelas ayat dan ambiguitas terbatas pada ἰσόψυχον serta keluasan τὰ περὶ ὑμῶν.
