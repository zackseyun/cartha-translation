id: PHP.2.10
reference: Philippians 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/010.yaml
  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: id
  text: supaya dalam nama Yesus setiap lutut bertekuk[a], yakni lutut semua yang di surga, di bumi, dan di bawah bumi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap lutut menekuk.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari yang surgawi, yang duniawi, dan yang di bawah bumi.” Ungkapan ini tidak menentukan secara khusus siapa yang termasuk dalam setiap kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang mengalir dari klausa sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: dalam nama Yesus
  rationale: Mempertahankan konstruksi Yunani serta kemungkinan nuansa lingkup, dasar, atau pengakuan yang terkait dengan nama Yesus; ungkapan 'ketika nama Yesus disebut' akan terlalu mempersempit makna.
- source_word: πᾶν γόνυ
  choice: setiap lutut
  rationale: Mempertahankan gambaran jasmani yang kuat tentang ketundukan universal, alih-alih memparafrasakannya sebagai 'setiap orang'.
- source_word: κάμψῃ
  choice: bertekuk
  rationale: Dalam kolokasi 'lutut bertekuk', kata ini secara alami menyampaikan tindakan membungkuk atau berlutut sebagai penghormatan.
- source_word: ἐπουρανίων
  choice: semua yang di surga
  rationale: Mencerminkan adjektiva genitif substantival tanpa menentukan identitas makhluk yang dimaksud lebih jauh daripada teks.
- source_word: ἐπιγείων
  choice: di bumi
  rationale: Membentuk ungkapan tiga ranah yang alami sambil tetap berada dalam cakupan 'semua yang'.
- source_word: καταχθονίων
  choice: di bawah bumi
  rationale: Mempertahankan citra ruang dalam bahasa Yunani tanpa memasukkan istilah interpretatif seperti 'alam maut' atau menyebut kelompok tertentu.
theological_decisions:
- issue: Cakupan ungkapan tiga bagian ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: Menyatakan cakupan kosmis dan universal sebagai 'semua yang di surga, di bumi, dan di bawah bumi' tanpa mengidentifikasi kelompok-kelompok itu secara khusus.
  alternative: Menyebut malaikat, manusia, orang mati, atau roh-roh jahat secara eksplisit.
  rationale: Teks menekankan ketundukan universal kepada Yesus, tetapi tidak merinci identitas setiap kelompok; ambiguitas itu dipertahankan.
- issue: Makna ἐν pada ἐν τῷ ὀνόματι Ἰησοῦ
  choice: dalam nama Yesus
  alternative: pada nama Yesus; ketika nama Yesus disebut
  rationale: Pilihan ini mempertahankan keluasan semantis konstruksi Yunani dan tidak membatasi tindakan hanya sebagai reaksi ketika nama itu diucapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur 'setiap lutut bertekuk' mempertahankan citra puitis teks, sedangkan tanda pisah memperjelas bahwa rangkaian tiga ranah menerangkan cakupan 'setiap lutut'.
