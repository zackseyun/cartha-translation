  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: id
  text: dengan berpegang teguh pada firman kehidupan[a], supaya pada hari Mesias[b] kalian menjadi kebanggaanku, bahwa aku tidak berlari dengan sia-sia dan tidak pula berjerih lelah dengan sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan menyodorkan atau menawarkan firman kehidupan.”
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “hari Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: firman kehidupan
  rationale: 'Mempertahankan ungkapan Yunani yang padat serta kemungkinan makna ganda: firman yang memberi kehidupan dan firman tentang kehidupan.'
- source_word: ἐπέχοντες
  choice: berpegang teguh pada
  rationale: Verba ini dapat berarti memegang teguh atau menyodorkan. Dalam alur nasihat tentang ketaatan dan keteguhan, makna 'berpegang teguh' paling sesuai; kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: καύχημα ἐμοὶ
  choice: aku dapat berbangga
  rationale: Mengungkapkan secara alami bahwa jemaat Filipi menjadi alasan atau dasar Paulus untuk berbangga, tanpa memberi kesan kesombongan kosong.
- source_word: ἡμέραν Χριστοῦ
  choice: hari Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam ungkapan eskatologis ini, sehingga diterjemahkan 'Mesias'; bentuk tradisional dicatat dalam catatan kaki.
- source_word: οὐκ εἰς κενὸν
  choice: tidak ... dengan sia-sia
  rationale: Padanan idiomatis yang jelas untuk usaha yang kosong atau tidak menghasilkan buah, sekaligus mempertahankan pengulangan retoris Yunani.
- source_word: ἔδραμον
  choice: berlari
  rationale: Mempertahankan metafora Paulus tentang perjalanan dan pengerahan diri dalam pelayanan.
- source_word: ἐκοπίασα
  choice: berjerih lelah
  rationale: Menyampaikan kerja keras yang melelahkan dan lebih kuat daripada sekadar 'bekerja'.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam frasa gelar eskatologis
  choice: Mesias
  alternative: Kristus
  rationale: Dalam 'hari Mesias', Χριστός tetap memiliki daya sebagai gelar kerajaan dan eskatologis, bukan semata-mata nama diri. Bentuk yang lazim secara tradisional tetap disediakan dalam catatan kaki.
- issue: Hubungan tujuan/hasil dalam εἰς καύχημα ἐμοὶ
  choice: Dengan demikian, pada hari Mesias aku dapat berbangga
  alternative: menjadi kebanggaanku pada hari Mesias
  rationale: Pilihan ini mempertahankan kaitan antara keteguhan jemaat dan alasan Paulus untuk berbangga pada hari itu, tanpa menentukan secara berlebihan apakah εἰς menyatakan tujuan atau hasil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'dengan sia-sia' dipertahankan demi paralelisme retoris sumber. Tanda [a] dan [b] ditempatkan langsung pada unsur yang diterangkan.
