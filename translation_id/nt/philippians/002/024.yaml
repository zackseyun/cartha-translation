id: PHP.2.24
reference: Philippians 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: id
  text: Namun, dalam Tuhan aku yakin bahwa aku sendiri juga akan segera datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθα
  choice: aku yakin
  rationale: Bentuk perfektanya menyatakan keadaan keyakinan yang telah mantap dan masih berlangsung; 'aku yakin' alami dalam bahasa Indonesia serta mempertahankan daya kini bentuk tersebut.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menghubungkan kalimat dengan uraian sebelumnya dan memberi peralihan ringan; 'Namun' membuat hubungan wacananya jelas tanpa menimbulkan pertentangan yang terlalu keras.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus yang dapat menunjuk pada lingkup sekaligus dasar keyakinannya, tanpa mempersempitnya menjadi sekadar sarana atau objek langsung.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi keyakinan Paulus secara wajar dalam bahasa Indonesia.
- source_word: καὶ αὐτὸς
  choice: aku sendiri juga
  rationale: '''Sendiri'' mempertahankan penekanan pada Paulus secara pribadi, sedangkan ''juga'' mempertahankan unsur aditif καί, dalam kaitannya dengan rencana pengutusan Timotius.'
- source_word: ταχέως
  choice: segera
  rationale: Dalam konteks ini kata tersebut menyatakan kedekatan waktu, bukan kecepatan perjalanan.
- source_word: ἐλεύσομαι
  choice: akan datang
  rationale: Mempertahankan perspektif deiktis verba Yunani sebagaimana Paulus berbicara kepada jemaat di Filipi.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: '''Tuhan'' merupakan padanan baku dan tepat bagi κύριος dalam konteks Paulus ini.'
theological_decisions:
- issue: Sifat keyakinan Paulus dalam hubungannya dengan Tuhan
  choice: dalam Tuhan aku yakin
  alternative: aku percaya kepada Tuhan bahwa aku sendiri juga akan segera datang
  rationale: Pilihan ini mempertahankan bahwa harapan Paulus berakar dalam hubungannya dengan Tuhan dan berada di bawah kehendak-Nya, tanpa mengubahnya menjadi klaim bahwa ia menerima penyataan langsung atau menjadikan Tuhan sekadar objek verba 'percaya'.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pronomina 'aku' dipakai untuk suara pribadi Paulus; susunan 'aku sendiri juga' mempertahankan penekanan ganda dalam teks Yunani dengan tetap alami.
