id: PHP.2.18
reference: Philippians 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: id
  text: Demikian juga, bersukacitalah kamu dan bersukacitalah bersama aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Begitu pula, hendaklah kamu bersukacita dan berbagi sukacita denganku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Demikian juga
  rationale: Ungkapan τὸ αὐτό berfungsi secara adverbial dan mengaitkan perintah ini dengan sukacita yang disebut sebelumnya; “Demikian juga” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan tersebut.
- source_word: χαίρετε
  choice: bersukacitalah
  rationale: Bentuk imperatif aktif kini orang kedua jamak ini diterjemahkan sebagai perintah. “Bersukacitalah” mempertahankan daya verbal serta kosakata sukacita yang berulang dalam Filipi.
- source_word: συγχαίρετέ
  choice: bersukacitalah bersama
  rationale: Kata kerja majemuk ini menyatakan sukacita yang dibagikan dengan orang lain. “Bersukacitalah bersama” menyampaikan unsur kebersamaan secara langsung.
- source_word: μοι
  choice: aku
  rationale: Pronomina datif ini menunjukkan Paulus sebagai orang yang bersama dengannya jemaat diminta bersukacita; setelah “bersama”, bentuk “aku” merupakan ungkapan Indonesia yang jelas dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif jamak Yunani diungkapkan dengan “kamu” sebagai sapaan kolektif; pengulangan “bersukacitalah” dipertahankan untuk mencerminkan pengulangan serta permainan kata χαίρετε/συγχαίρετέ.
