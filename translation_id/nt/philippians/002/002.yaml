  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: id
  text: Sempurnakanlah sukacitaku, agar kamu memikirkan hal yang sama, memiliki kasih yang sama, sejiwa[a], dan memikirkan satu hal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu jiwa”; dapat juga diterjemahkan “sehati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “memusatkan pikiran pada satu tujuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: Sempurnakanlah sukacitaku
  rationale: Bentuk imperatif meminta jemaat membawa sukacita Paulus kepada kepenuhannya. “Sempurnakanlah” mempertahankan gambaran tentang sesuatu yang dibuat penuh sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἵνα
  choice: dengan
  rationale: Dalam konteks ini, ἵνα dapat memperkenalkan isi atau cara jemaat menyempurnakan sukacita Paulus. “Dengan” menghubungkan perintah itu secara alami dengan rangkaian seruan yang mengikutinya tanpa menghilangkan hubungan hasil yang dimaksud.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: memikirkan hal yang sama
  rationale: φρονέω mencakup cara berpikir atau sikap batin, bukan sekadar tindakan intelektual sesaat. Ungkapan ini jelas dalam bahasa Indonesia dan memungkinkan pengulangan akar “pikir” pada akhir ayat tetap terdengar.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: memiliki kasih yang sama
  rationale: Terjemahan ini mempertahankan bentuk partisipial dan ungkapan berulang “yang sama,” yang membangun tema kesatuan.
- source_word: ἀγάπην
  choice: kasih
  rationale: “Kasih” merupakan padanan baku dan alami bagi ἀγάπη dalam konteks hubungan antarumat.
- source_word: σύμψυχοι
  choice: sejiwa
  rationale: Kata majemuk ini menunjuk pada kesatuan kehidupan batin atau jiwa. “Sejiwa” ringkas, alami, dan mempertahankan citra leksikal Yunani tanpa membatasinya pada keseragaman pendapat.
- source_word: τὸ ἓν φρονοῦντες
  choice: memikirkan satu hal
  rationale: Terjemahan yang dekat dengan bentuk Yunani ini mempertahankan pengulangan φρονέω dan membiarkan “satu hal” tetap terbuka, alih-alih menentukannya secara lebih sempit sebagai satu tujuan tertentu.
theological_decisions:
- issue: Cara mempertahankan pengulangan φρονέω dalam seruan Paulus tentang kesatuan
  choice: memikirkan hal yang sama ... memikirkan satu hal
  alternative: sepikir ... bertekad pada satu tujuan
  rationale: Pilihan utama mempertahankan pengulangan leksikal dan variasi retoris teks Yunani. Ini menyampaikan kesatuan pola pikir tanpa menyamakannya secara otomatis dengan keseragaman institusional atau menetapkan bahwa “satu hal” hanya berarti satu tujuan praktis.
- issue: Makna σύμψυχοι
  choice: sejiwa
  alternative: sehati; satu dalam roh
  rationale: “Sejiwa” paling langsung mempertahankan unsur ψυχή dan cakupan kesatuan batin dalam kata tersebut. “Satu dalam roh” dapat disalahpahami sebagai rujukan khusus kepada Roh Kudus, yang tidak dinyatakan secara eksplisit dalam kata Yunani ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang hangat dan bermartabat. Struktur rangkaian Yunani dipertahankan sejauh tetap alami. Pengulangan “memikirkan” disengaja untuk mencerminkan pengulangan φρονέω, sedangkan “sejiwa” menjaga citra kesatuan batin.
