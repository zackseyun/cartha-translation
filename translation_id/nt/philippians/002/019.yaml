review_pass:
  verdict: revise
  source_fidelity: 'Draf secara umum setia pada struktur dan makna ayat: harapan Paulus, frasa relasional "dalam Tuhan Yesus", pengutusan Timotius yang segera, serta tujuan agar Paulus memperoleh semangat melalui informasi tentang jemaat. Namun, "dapat ... mengutus" dapat menyiratkan kemampuan/izin yang tidak dinyatakan oleh infinitif πέμψαι, dan "dikuatkan" berbentuk pasif serta berpotensi menyiratkan agen penguatan yang tidak disebutkan. "Menerima kabar" juga sedikit lebih spesifik daripada γνούς ("setelah/ketika mengetahui").'
  naturalness: Kalimat draf sudah wajar, tetapi revisi membuat hubungan antarfrasa lebih langsung dan menghindari "dapat" yang tidak perlu. Pronomina jamak "kalian" secara eksplisit mencerminkan ὑμῖν yang merujuk kepada jemaat, sambil tetap modern dan alami.
  terminology: '"Tuhan Yesus" dan "Timotius" sudah tepat. "Menjadi bersemangat" menyatakan εὐψυχῶ sebagai keadaan batin positif tanpa menambahkan agen eksternal; "keadaan kalian" menyampaikan τὰ περὶ ὑμῶν secara idiomatis dan cukup luas.'
  issues:
  - severity: medium
    issue: '"dapat segera mengutus" dapat menyiratkan kemampuan atau izin.'
    rationale: πέμψαι melengkapi Ἐλπίζω sebagai tindakan yang diharapkan Paulus lakukan, bukan terutama kemampuan untuk melakukannya. Menghilangkan "dapat" lebih langsung setia pada sumber.
  - severity: medium
    issue: '"dikuatkan" kurang tepat untuk εὐψυχῶ.'
    rationale: εὐψυχῶ berarti berada dalam semangat yang baik/menjadi bersemangat. Bentuk pasif "dikuatkan" dapat mengisyaratkan pelaku penguatan yang tidak disebutkan dalam teks.
  - severity: low
    issue: '"menerima kabar" mempersempit γνούς.'
    rationale: Partisip γνούς menyatakan mengetahui setelah memperoleh informasi, tetapi tidak secara leksikal menyebut cara menerimanya sebagai "kabar". "Mengetahui keadaan" mempertahankan keluasan ungkapan sumber.
  revised_text: Namun, dalam Tuhan Yesus aku berharap segera mengutus Timotius kepada kalian, supaya aku pun menjadi bersemangat ketika mengetahui keadaan kalian.
