id: PHP.2.19
reference: Philippians 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: id
  text: Namun, dalam Tuhan Yesus aku berharap segera mengutus Timotius kepada kalian, supaya aku pun menjadi bersemangat ketika mengetahui keadaan kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: aku berharap
  rationale: Bentuk kini menyatakan harapan Paulus saat ini; 'berharap' merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan ringan dengan nuansa kontras terhadap uraian sebelumnya tanpa membuat pertentangannya terlalu tajam.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  rationale: 'Mempertahankan ungkapan relasional khas Paulus: harapannya berada dalam ketergantungan dan persekutuan dengan Tuhan Yesus.'
- source_word: Τιμόθεον
  choice: Timotius
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: ταχέως
  choice: segera
  rationale: Dalam konteks rencana pengutusan, kata ini terutama menunjukkan waktu yang dekat, bukan kecepatan perjalanan.
- source_word: πέμψαι
  choice: dapat ... mengutus
  rationale: Infinitif yang melengkapi 'berharap' dinyatakan secara alami dalam bahasa Indonesia; 'mengutus' sesuai untuk mengirim seorang rekan dengan suatu tugas.
- source_word: ὑμῖν
  choice: kepadamu
  rationale: Menyatakan pihak yang dituju; bentuk tunggal kolektif 'kamu' merujuk kepada jemaat dan sesuai dengan register Indonesia yang bermartabat.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan pengutusan Timotius secara jelas dan alami.
- source_word: κἀγὼ
  choice: aku pun
  rationale: Mempertahankan unsur tambahan atau penekanan pada Paulus yang terkandung dalam κἀγώ.
- source_word: εὐψυχῶ
  choice: dikuatkan
  rationale: Kata ini berarti berada dalam semangat atau keadaan batin yang baik; 'dikuatkan' menyampaikan dorongan batin secara alami, meskipun 'dihiburkan' atau 'menjadi lega' juga mungkin.
- source_word: γνοὺς
  choice: ketika menerima kabar
  rationale: Partisip aoris menyatakan keadaan temporal yang mendahului atau menyebabkan penguatan; dalam konteks utusan yang kembali, mengetahui keadaan jemaat secara alami diungkapkan sebagai menerima kabar.
- source_word: τὰ περὶ ὑμῶν
  choice: tentang keadaanmu
  rationale: Ungkapan idiomatis ini menunjuk pada hal-hal atau keadaan yang menyangkut jemaat; terjemahan ini jelas tanpa membatasi kabar hanya pada kesehatan atau perasaan mereka.
theological_decisions:
- issue: Makna ἐν κυρίῳ Ἰησοῦ
  choice: dalam Tuhan Yesus
  alternative: dengan pertolongan Tuhan Yesus
  rationale: Bentuk yang lebih harfiah mempertahankan keluasan relasi, ketergantungan, dan lingkup hidup Paulus di dalam Kristus, tanpa mempersempitnya hanya menjadi sarana atau pertolongan.
- issue: Gelar κύριος bagi Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' merupakan padanan kristologis baku untuk κύριος dalam konteks ini dan mempertahankan bobot pengakuan Paulus mengenai Yesus.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'aku' dan '-mu' mengikuti suara pribadi surat Paulus; bentuk '-mu' di sini bersifat kolektif dan merujuk kepada jemaat Filipi. Susunan kalimat mempertahankan hubungan antara harapan Paulus, pengutusan Timotius, dan tujuan agar Paulus dikuatkan oleh kabar mengenai jemaat.
