revisions:
- from: Namun, dalam Tuhan Yesus aku berharap dapat segera mengutus Timotius kepadamu, supaya aku pun dikuatkan ketika menerima kabar tentang keadaanmu.
  to: Namun, dalam Tuhan Yesus aku berharap segera mengutus Timotius kepada kalian, supaya aku pun menjadi bersemangat ketika mengetahui keadaan kalian.
  rationale: Revisi mempertahankan seluruh unsur utama teks Yunani dan register surat yang wajar dalam bahasa Indonesia modern. "Segera mengutus" langsung menerjemahkan ταχέως πέμψαι; "menjadi bersemangat" lebih sesuai dengan εὐψυχῶ daripada bentuk pasif "dikuatkan"; dan "ketika mengetahui keadaan kalian" menyampaikan γνοὺς τὰ περὶ ὑμῶν tanpa membatasi informasi itu hanya sebagai kabar yang diterima.
