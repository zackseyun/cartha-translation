id: PHP.2.17
reference: Philippians 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: id
  text: Namun, sekalipun aku sedang dicurahkan sebagai persembahan minuman[a] di atas[d] kurban dan pelayanan ibadah[b] iman kalian[c], aku bersukacita dan turut bersukacita dengan kalian semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku sedang dicurahkan sebagai kurban curahan.”
    reason: lexical_alternative
  - marker: b
    text: “Pelayanan ibadah” juga dapat diterjemahkan “pelayanan” atau “pelayanan keimaman”; kata Yunaninya tetap bernuansa ibadah dalam konteks ini.
    reason: lexical_alternative
  - marker: c
    text: Atau, “kesetiaan kalian.”
    reason: alternative_reading
  - marker: d
    text: Atau, “sehubungan dengan” atau “sebagai tambahan pada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπένδομαι
  choice: aku sedang dicurahkan sebagai persembahan curahan
  rationale: Bentuk pasif kini mempertahankan gambaran tindakan menuangkan persembahan dalam ibadah. Ungkapan tambahan 'sebagai persembahan curahan' membuat metafora kultisnya jelas dalam bahasa Indonesia.
- source_word: ἐπὶ
  choice: ke atas
  rationale: Dengan datif yang mengikutinya, frasa ini dapat menggambarkan persembahan Paulus dicurahkan ke atas kurban jemaat; pilihan ini mempertahankan citra spasial dan hubungan antarkurban.
- source_word: θυσίᾳ
  choice: kurban
  rationale: '''Kurban'' adalah istilah baku dan wajar untuk persembahan sakrificial serta mempertahankan bahasa ibadah dalam konteks ini.'
- source_word: λειτουργίᾳ
  choice: pelayanan ibadah
  rationale: Pilihan ini mempertahankan arti 'pelayanan' tanpa menetapkan bahwa pelakunya pasti imam, sekaligus menjaga nuansa ibadah yang diperkuat oleh konteks kurban.
- source_word: πίστεως
  choice: iman
  rationale: '''Iman'' merupakan arti utama dalam konteks ini, sedangkan ''kesetiaan'' tetap mungkin dan dicatat dalam catatan kaki.'
- source_word: χαίρω
  choice: aku bersukacita
  rationale: Pilihan ini mempertahankan kosakata sukacita yang menonjol dalam Filipi dan bentuk pernyataan kini.
- source_word: συγχαίρω
  choice: turut bersukacita bersama
  rationale: Ungkapan ini menyampaikan sukacita bersama secara langsung tanpa mengubahnya menjadi tindakan memberi selamat.
- source_word: πᾶσιν ὑμῖν
  choice: bersama kalian semua
  rationale: Bentuk ini mempertahankan penekanan eksplisit bahwa seluruh jemaat disertakan.
theological_decisions:
- issue: Gambaran ibadah bagi kemungkinan kematian Paulus
  choice: Paulus menggambarkan dirinya sebagai persembahan curahan yang dicurahkan ke atas kurban dan pelayanan ibadah jemaat.
  alternative: Paulus hanya dicurahkan sehubungan dengan atau sebagai tambahan pada pelayanan mereka, tanpa gambaran persembahan yang dituangkan secara spasial.
  rationale: Rangkaian σπένδομαι, θυσία, dan λειτουργία kuat mempertahankan metafora kurban dan ibadah; maknanya tidak diratakan menjadi pelayanan biasa.
- issue: Hubungan iman jemaat dengan kurban dan pelayanan
  choice: Mempertahankan frasa yang cukup terbuka, 'kurban dan pelayanan ibadah dari iman kalian'.
  alternative: Iman jemaat sendiri merupakan kurban; atau kurban dan pelayanan itu dihasilkan oleh iman mereka.
  rationale: Genitif τῆς πίστεως ὑμῶν memungkinkan lebih dari satu hubungan semantis, sehingga terjemahan utama tidak menetapkan salah satunya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak 'kalian' dipakai agar bentuk ὑμῶν dan ὑμῖν jelas sebagai jamak. Pengulangan unsur 'bersukacita' dipertahankan untuk mencerminkan χαίρω dan συγχαίρω, tetapi 'turut ... bersama' membuat hubungan komunalnya alami.
