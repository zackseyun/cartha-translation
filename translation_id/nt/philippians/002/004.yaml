  source_fidelity: 'Makna utama terjaga: seruan distributif untuk memberi perhatian bukan hanya pada kepentingan sendiri, melainkan juga pada kepentingan orang lain. Namun, teks Yunani menyusun negasi pada tindakan memperhatikan hal-hal sendiri, lalu menambahkan perhatian pada hal-hal orang lain; terjemahan Indonesia yang ada sudah mengungkapkan maksud kontekstualnya dengan baik.'
