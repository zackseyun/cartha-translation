  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: id
  text: Janganlah masing-masing hanya memperhatikan kepentingannya sendiri,[a] tetapi juga kepentingan orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Masing-masing tidak memperhatikan hal-hal miliknya sendiri, tetapi juga hal-hal milik orang lain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: memperhatikan
  rationale: Kata ini menyatakan tindakan mengarahkan perhatian dan kepedulian kepada sesuatu. “Memperhatikan” alami dalam bahasa Indonesia dan tetap mempertahankan unsur perhatian aktif.
- source_word: τὰ ἑαυτῶν
  choice: kepentingannya sendiri
  rationale: Ungkapan netral jamak ini lebih luas daripada harta milik dan mencakup urusan, kepentingan, atau hal-hal yang menyangkut diri sendiri. Bentuk tunggal distributif selaras dengan “masing-masing”.
- source_word: ἕκαστοι
  choice: masing-masing
  rationale: Bentuk ini bersifat distributif, sehingga menegaskan tanggung jawab setiap orang di dalam komunitas.
- source_word: ἀλλὰ καὶ
  choice: bukan hanya ... tetapi juga
  rationale: 'Susunan ini mengungkapkan kontras sekaligus penambahan: perhatian kepada kepentingan sendiri tidak mutlak dilarang, tetapi harus disertai perhatian kepada orang lain.'
- source_word: τὰ ἑτέρων
  choice: kepentingan orang lain
  rationale: Seperti frasa sebelumnya, ungkapan ini mencakup secara luas urusan, kebutuhan, dan kesejahteraan orang lain, bukan hanya barang milik mereka.
theological_decisions:
- issue: Apakah ayat ini melarang segala perhatian kepada kepentingan sendiri
  choice: “bukan hanya ... tetapi juga”
  alternative: “jangan ... melainkan”
  rationale: Partikel καί mempertahankan unsur penambahan. Ayat ini menuntut perhatian kepada kepentingan orang lain tanpa harus dibaca sebagai pelarangan mutlak atas perhatian kepada urusan sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat imperatif dipakai untuk menyampaikan daya nasihat dari partisipel Yunani yang bergantung pada konteks seruan ayat sebelumnya. “Kepentingan” dipilih sebagai padanan kontekstual yang cukup luas, dengan bentuk lebih harfiah dipertahankan dalam catatan kaki.
