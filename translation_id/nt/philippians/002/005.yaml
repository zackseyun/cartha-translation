translation:
  language: id
  text: Hendaklah kalian memiliki pola pikir ini di antara kalian[a], yang juga ada dalam Mesias Yesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hendaklah kalian memiliki pola pikir ini di antara kalian, yang juga kalian miliki dalam Mesias Yesus.”
    reason: alternative_reading
  - marker: b
    text: 'Yunani: “Kristus”; di sini diterjemahkan “Mesias” karena Χριστός berfungsi sebagai gelar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ini
  rationale: Kata penunjuk ini mengarah pada pola pikir yang dijabarkan melalui teladan Mesias dalam ayat-ayat berikutnya, sambil mempertahankan keringkasan bahasa Yunani.
- source_word: φρονεῖτε
  choice: hendaklah kalian memiliki pola pikir
  rationale: Dalam pemakaian Paulus, φρονέω menunjuk pada sikap atau orientasi pikiran, bukan sekadar kegiatan berpikir. Bentuk ini menyampaikan daya imperatif kini secara wajar dalam bahasa Indonesia.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Pronomina jamak dan konteks komunal Filipi 2:1–4 mendukung pengertian antarsesama dalam jemaat, bukan semata-mata batin setiap individu.
- source_word: ὃ
  choice: yang
  rationale: Kata penghubung relatif ini mempertahankan kaitan ringkas antara pola pikir yang diperintahkan dan pola pikir yang dikaitkan dengan Yesus.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam diri Mesias Yesus
  rationale: Mesias mempertahankan fungsi Χριστός sebagai gelar. Ungkapan 'dalam diri' menyampaikan pembacaan keteladanan secara alami, sementara kemungkinan relasional atau partisipatif dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah klausa itu menunjuk pada pola pikir yang dicontohkan Yesus atau pola pikir yang dimiliki orang percaya dalam persatuan dengan-Nya.
  choice: 'Pembacaan keteladanan: “yang juga ada dalam diri Mesias Yesus.”'
  alternative: 'Pembacaan partisipatif: “yang juga kalian miliki dalam Mesias Yesus.”'
  rationale: Konteks langsung beralih kepada perendahan diri Mesias sebagai teladan bagi orang percaya, sehingga pembacaan keteladanan lebih mungkin. Namun, susunan Yunani sangat padat dan dapat pula dipahami secara partisipatif; karena itu, alternatif tersebut tidak disingkirkan, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk memperjelas sifat komunal nasihat. Nada tetap khidmat namun mudah dipahami. Susunan utama mengutamakan pembacaan keteladanan, sedangkan ambiguitas asli dipertahankan melalui catatan kaki.
