  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: id
  text: Sebab mereka semua mencari kepentingan mereka sendiri, bukan kepentingan Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus Kristus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάντες
  choice: mereka semua
  rationale: Bentuk jamak dengan artikel dipakai secara substantival dan menunjuk kepada seluruh orang yang sedang dibicarakan; ungkapan ini mempertahankan penekanan kolektif.
- source_word: γὰρ
  choice: sebab
  rationale: Partikel ini memberikan alasan bagi pernyataan sebelumnya; “sebab” menyatakan hubungan penjelas itu secara alami.
- source_word: τὰ ἑαυτῶν
  choice: kepentingan mereka sendiri
  rationale: Ungkapan jamak netral ini berarti hal-hal yang menyangkut diri sendiri; “kepentingan” menyampaikan maknanya dengan jelas dan mempertahankan kontras moralnya.
- source_word: ζητοῦσιν
  choice: mencari
  rationale: Pilihan ini mempertahankan arti dasar verba dan dapat dipakai secara alami bagi kepentingan yang diutamakan atau dikejar.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: kepentingan Yesus Sang Mesias
  rationale: Artikel jamak netral mengacu secara eliptis kepada hal-hal atau kepentingan milik Yesus; pengulangan “kepentingan” membuat kontras itu jelas dalam bahasa Indonesia. Χριστοῦ dipertahankan sebagai gelar Mesias.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: “Sang Mesias” mempertahankan nilai Χριστός sebagai gelar dan terdengar wajar serta bermartabat dalam bahasa Indonesia. Bentuk tradisional “Yesus Kristus” dicantumkan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan hubungan alasan serta kontras tegas antara kepentingan diri dan kepentingan Yesus Sang Mesias.
