id: PHP.2.30
reference: Philippians 2:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: id
  text: Sebab, demi pekerjaan Mesias[a], ia nyaris mati[c]. Ia mempertaruhkan nyawanya untuk melengkapi apa yang masih kurang dalam pelayanan kalian kepadaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Kristus”. Yunani: “pekerjaan Kristus/Mesias”.'
    reason: alternative_reading
  - marker: b
    text: “Apa yang masih kurang” menunjuk pada pelayanan yang tidak dapat mereka berikan sendiri karena mereka tidak hadir bersama Paulus, bukan pada keengganan mereka.
    reason: cultural_note
  - marker: c
    text: 'Secara lebih harfiah: “ia mendekati kematian”.'
    reason: translation_note
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: demi pekerjaan Mesias
  rationale: διά dengan akusatif menyatakan alasan atau kepentingan yang mendorong tindakannya. “Demi” alami dalam bahasa Indonesia dan menunjukkan bahwa ia menghadapi bahaya untuk kepentingan pekerjaan Mesias.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός merupakan gelar yang berarti “Yang Diurapi”; “Mesias” mempertahankan daya gelarnya dalam konteks ini.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: ia nyaris mati
  rationale: Ungkapan ini berarti bahwa ia sampai begitu dekat dengan kematian. “Nyaris mati” menyampaikan maknanya secara jelas dan wajar.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: Ia mempertaruhkan nyawanya
  rationale: Partisip ini menggambarkan tindakan sengaja menghadapkan diri pada bahaya. ψυχή di sini berarti kehidupan jasmani, sehingga “nyawa” tepat.
- source_word: ἵνα ἀναπληρώσῃ
  choice: untuk melengkapi
  rationale: Klausa ἵνα menyatakan tujuan, sedangkan ἀναπληρόω berarti memenuhi atau melengkapi sesuatu yang belum tersedia.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: apa yang masih kurang
  rationale: Frasa ini menunjuk pada bantuan yang belum dapat mereka berikan secara langsung, bukan pada kesalahan moral atau kurangnya kemauan.
- source_word: τῆς πρός με λειτουργίας
  choice: dalam pelayanan kalian kepadaku
  rationale: λειτουργία mencakup pelayanan atau bantuan nyata. “Pelayanan” mempertahankan keluasan makna tersebut dalam konteks dukungan jemaat kepada Paulus.
theological_decisions:
- issue: Penerjemahan Χριστοῦ sebagai gelar dalam ungkapan Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa “pekerjaan Mesias”, unsur gelar masih jelas; karena itu makna Χριστός diterjemahkan, bukan sekadar diperlakukan sebagai nama.
- issue: Makna kekurangan dalam pelayanan jemaat Filipi
  choice: keterbatasan praktis yang dilengkapi oleh kehadiran Epafroditus
  alternative: kegagalan atau keengganan jemaat untuk melayani Paulus
  rationale: Konteks menunjukkan penghargaan Paulus atas dukungan mereka. Kekurangan itu ialah ketidakhadiran mereka secara langsung, bukan celaan terhadap kemauan mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipakai untuk menandai bahwa kata ganti Yunani berbentuk jamak. Kalimat Yunani yang panjang dibagi menjadi dua agar alami tanpa mengubah hubungan alasan, tindakan, dan tujuan.
