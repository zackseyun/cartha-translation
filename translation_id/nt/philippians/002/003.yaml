  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: id
  text: Janganlah melakukan apa pun karena ambisi yang mementingkan diri sendiri atau kesombongan kosong[a]. Sebaliknya, dengan rendah hati hendaklah setiap orang menganggap orang lain lebih utama daripada dirinya sendiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keangkuhan yang sia-sia” atau “kemuliaan kosong.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menganggap orang lain lebih tinggi daripada dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Jangan lakukan apa pun
  rationale: Mengungkapkan larangan secara wajar dalam bahasa Indonesia dan mempertahankan cakupan menyeluruh dari μηδὲν.
- source_word: κατ’ ἐριθείαν
  choice: karena ambisi yang mementingkan diri sendiri
  rationale: ἐριθεία menunjuk pada ambisi atau kepentingan diri yang dapat memicu persaingan dan perpecahan; frasa ini mempertahankan nuansa motif dari κατά.
- source_word: μηδὲ κατὰ κενοδοξίαν
  choice: atau kesombongan kosong
  rationale: κενοδοξία secara harfiah berkaitan dengan kemuliaan yang kosong dan menunjuk pada keangkuhan tanpa dasar; 'kesombongan kosong' alami dan mudah dipahami.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: dengan rendah hati
  rationale: Datif menyatakan cara atau sikap; bentuk adverbial ini paling alami dalam bahasa Indonesia.
- source_word: ἀλλήλους ἡγούμενοι
  choice: anggaplah seorang akan yang lain
  rationale: ἡγέομαι di sini berarti menilai atau menganggap, sedangkan ἀλλήλους menyatakan hubungan timbal balik.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: lebih utama daripada diri sendiri
  rationale: ὑπερέχω menyatakan keunggulan atau kedudukan di atas; 'lebih utama' mempertahankan daya bandingnya tanpa secara pasti menyatakan nilai hakiki seseorang.
theological_decisions:
- issue: Makna perbandingan dalam ὑπερέχοντας ἑαυτῶν
  choice: lebih utama daripada diri sendiri
  alternative: lebih tinggi daripada dirimu sendiri; lebih penting daripada dirimu sendiri
  rationale: Terjemahan utama mempertahankan ketegangan antara penilaian dan sikap rendah hati tanpa menafsirkannya sebagai pernyataan tentang nilai hakiki setiap orang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'seorang akan yang lain' dipilih untuk menyatakan timbal balik dengan jelas; 'diri sendiri' menjaga cakupan jamak kolektif tanpa bentuk yang janggal.
