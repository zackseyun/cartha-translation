id: PHP.2.25
reference: Philippians 2:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: id
  text: Namun, saya menganggap perlu untuk mengutus Epafroditus kepada kalian—saudara saya, rekan sekerja saya, dan rekan seperjuangan saya, serta utusan kalian[a] dan pelayan bagi keperluan saya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rasul”—yakni, orang yang diutus oleh kalian.
    reason: alternative_reading
  - marker: b
    text: Atau, “orang yang melayani keperluan saya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: perlu
  rationale: Dalam konstruksi dengan ἡγησάμην, kata ini menyatakan sesuatu yang dinilai sebagai keharusan; “menganggap perlu” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: ἡγησάμην
  choice: saya menganggap
  rationale: Menyampaikan penilaian Paulus, bukan sekadar dugaan atau pendapat sambil lalu.
- source_word: πέμψαι
  choice: untuk mengutus
  rationale: Infinitif ini bergantung pada ἡγησάμην. “Mengutus” mempertahankan gagasan pengiriman seseorang dengan suatu tugas tanpa menambahkan makna “kembali”, yang tidak dinyatakan secara eksplisit.
- source_word: ἀδελφὸν
  choice: saudara
  rationale: Mempertahankan istilah kekeluargaan bagi sesama orang percaya tanpa memperluasnya menjadi parafrasa.
- source_word: συνεργὸν
  choice: rekan sekerja
  rationale: Ungkapan yang jelas dan lazim untuk seseorang yang bekerja bersama Paulus.
- source_word: συστρατιώτην
  choice: rekan seperjuangan
  rationale: Mengungkapkan metafora militer dalam idiom Indonesia yang alami; unsur perjuangan bersama tetap dipertahankan.
- source_word: ἀπόστολον
  choice: utusan
  rationale: Dalam konteks ini Epafroditus adalah wakil yang diutus jemaat Filipi. “Utusan” mempertahankan arti pengutusan tanpa langsung menyiratkan jabatan teknis rasul.
- source_word: λειτουργὸν
  choice: pelayan
  rationale: Menunjuk kepada orang yang menjalankan pelayanan bagi kebutuhan Paulus tanpa menyiratkan jabatan gerejawi modern.
- source_word: τῆς χρείας μου
  choice: bagi keperluan saya
  rationale: Menyatakan sasaran pelayanan Epafroditus secara ringkas dan dekat dengan struktur Yunani.
theological_decisions:
- issue: Apakah ἀπόστολον diterjemahkan dalam arti teknis “rasul” atau arti umum “utusan”
  choice: utusan
  alternative: rasul
  rationale: Konteks langsung menyebut Epafroditus sebagai orang yang diutus oleh jemaat Filipi kepada Paulus. “Utusan” mempertahankan arti wakil yang dikirim tanpa memasukkan Epafroditus ke dalam jabatan kerasulan teknis; alternatif harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. “Saya” dan “kalian” dipakai agar hubungan pribadi Paulus dengan jemaat terdengar alami serta bentuk jamak ὑμῶν/ὑμᾶς tetap jelas. Deretan sebutan dipertahankan untuk menjaga penekanan retoris teks Yunani.
