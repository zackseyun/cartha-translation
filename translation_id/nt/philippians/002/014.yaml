  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πάντα ποιεῖτε χωρὶς γογγυσμῶν καὶ διαλογισμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/014.yaml
  text: Do everything without grumbling or arguing[b][a],
translation:
  language: id
  text: Lakukanlah segala sesuatu tanpa menggerutu ataupun berbantah-bantahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “berbantah-bantahan” juga dapat berarti “pertimbangan”, “keraguan”, atau “sikap mempertanyakan”; dalam konteks ini, kemungkinan besar yang dimaksud ialah perbantahan yang menimbulkan perselisihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: segala sesuatu
  rationale: Bentuk jamak πᾶς dipakai secara menyeluruh. “Segala sesuatu” alami dalam bahasa Indonesia dan mempertahankan cakupan perintah yang universal.
- source_word: ποιεῖτε
  choice: Lakukanlah
  rationale: Imperatif kini aktif ini menyampaikan perintah yang berlaku terus dalam perilaku jemaat. Akhiran “-lah” memberi nada perintah yang jelas tetapi tetap wajar dan bermartabat.
- source_word: χωρὶς
  choice: tanpa
  rationale: Dalam konstruksi dengan bentuk genitif, χωρὶς menyatakan bahwa hal-hal berikut harus tidak menyertai tindakan mereka; “tanpa” adalah padanan Indonesia yang paling langsung.
- source_word: γογγυσμῶν
  choice: menggerutu
  rationale: γογγυσμός menunjuk pada keluhan yang diucapkan dengan mengomel atau bersungut. “Menggerutu” merupakan ungkapan modern yang mudah dipahami dan tetap menangkap nuansa keluhan yang terusik.
- source_word: διαλογισμῶν
  choice: berbantah-bantahan
  rationale: Dalam konteks nasihat mengenai kehidupan bersama, διαλογισμός paling mungkin menunjuk pada perdebatan atau perselisihan yang bersifat menentang. “Berbantah-bantahan” mempertahankan nuansa antarpersonal itu, sementara kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: καὶ
  choice: ataupun
  rationale: Sesudah “tanpa”, “ataupun” menyatakan bahwa masing-masing dari kedua perilaku itu harus tidak ada, sehingga menghindari kemungkinan salah paham bahwa hanya gabungan keduanya yang dilarang.
theological_decisions:
- issue: Apakah διαλογισμῶν menunjuk pada perbantahan lahiriah atau pertimbangan batin
  choice: berbantah-bantahan
  alternative: pertimbangan, keraguan, atau sikap mempertanyakan
  rationale: Konteks nasihat kepada seluruh jemaat dan pasangannya dengan γογγυσμῶν mendukung arti perselisihan yang tampak dalam kehidupan bersama. Namun, rentang makna kata Yunani itu tidak ditutup; alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan mudah dipahami. “Menggerutu” dipilih daripada “bersungut-sungut” karena lebih lazim bagi pembaca masa kini, sedangkan “berbantah-bantahan” menjaga nada serius dan nuansa perselisihan antarpersonal.
