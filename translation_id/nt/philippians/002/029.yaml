  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: id
  text: Karena itu, sambutlah dia di dalam Tuhan dengan penuh sukacita, dan hormatilah orang-orang seperti dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang semacam itu.” Ungkapan Yunaninya memakai bentuk jamak maskulin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: sambutlah
  rationale: Kata kerja imperatif ini menyatakan penerimaan yang hangat, bukan sekadar membiarkan atau mengakui; “sambutlah” sesuai dengan nada pastoral Paulus.
- source_word: οὖν
  choice: Karena itu
  rationale: Mengungkapkan hubungan kesimpulan dengan uraian sebelumnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus yang ringkas serta nuansa relasional dan rohaninya tanpa mempersempit makna melalui parafrasa.
- source_word: μετὰ πάσης χαρᾶς
  choice: dengan penuh sukacita
  rationale: Menyampaikan keluasan atau kepenuhan yang dinyatakan oleh πάσης dalam bahasa Indonesia yang alami.
- source_word: τοὺς τοιούτους
  choice: orang-orang seperti dia
  rationale: Menunjukkan orang-orang yang memiliki sifat atau pengabdian seperti Epafroditus, sambil mempertahankan daya rujuk ungkapan tersebut secara alami.
- source_word: ἐντίμους ἔχετε
  choice: hormatilah
  rationale: Secara idiomatis menyampaikan perintah untuk menganggap dan memperlakukan orang-orang semacam itu sebagai orang yang bernilai dan terhormat.
theological_decisions: []
