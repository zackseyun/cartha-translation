  register: Bahasa Indonesia baku modern dengan nada pastoral yang hangat dan bermartabat. Ungkapan khas Paulus “di dalam Tuhan” dipertahankan, sedangkan konstruksi Yunani yang kurang alami dialihkan secara idiomatis tanpa menghilangkan maknanya.
