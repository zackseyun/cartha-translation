base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: id
  text: melainkan mengosongkan diri-Nya[a] dengan mengambil rupa seorang budak, menjadi dalam keserupaan manusia[b]; dan dalam penampilan-Nya, Ia didapati sebagai manusia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadikan diri-Nya bukan apa-apa.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani memakai bentuk jamak: “manusia.” Secara harfiah, “menjadi dalam keserupaan manusia.”'
    reason: source_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Menandai pertentangan kuat dengan ayat sebelumnya dan secara alami meneruskan struktur kalimat.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: telah mengosongkan diri-Nya
  rationale: Mempertahankan metafora κενόω dan tidak memasukkan teori tentang apa yang dilepaskan; partisipel berikut menerangkan cara pengosongan diri itu.
- source_word: μορφὴν δούλου λαβών
  choice: dengan mengambil rupa seorang hamba
  rationale: “Rupa” mempertahankan hubungan leksikal μορφή dengan ayat 6, sedangkan “hamba” merupakan padanan Indonesia yang wajar dan bermartabat; konteks status rendah tetap terasa.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: menjadi serupa dengan manusia
  rationale: Menerjemahkan γενόμενος secara langsung sebagai “menjadi” dan mempertahankan gagasan ὁμοίωμα tanpa menyiratkan bahwa kemanusiaan-Nya hanya semu. Bentuk jamak Yunani bersifat generik/kolektif.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: ketika didapati dalam keadaan sebagai manusia
  rationale: “Keadaan” membedakan σχῆμα dari μορφή yang diterjemahkan “rupa”; “sebagai manusia” mempertahankan arti generik ἄνθρωπος.
theological_decisions:
- issue: Makna “mengosongkan diri-Nya” dalam konteks kristologis
  choice: Mempertahankan metafora “mengosongkan diri-Nya” dan membiarkan frasa-frasa partisipial berikut menjelaskan caranya.
  alternative: “Meniadakan diri-Nya” atau penjelasan bahwa Ia melepaskan sifat-sifat ilahi.
  rationale: Teks tidak menyebut isi yang dibuang atau dilepaskan. Terjemahan ini menjaga ketegangan teks tanpa memasukkan teori kenosis tertentu.
- issue: Daya ungkap ὁμοίωμα dalam hubungan dengan kemanusiaan Kristus
  choice: “serupa dengan manusia”
  alternative: “hanya tampak seperti manusia” atau “menjadi manusia sepenuhnya” sebagai parafrasa eksplisit.
  rationale: “Serupa” mempertahankan ungkapan Paulus tanpa mengartikannya sebagai kemanusiaan semu dan tanpa memperkuatnya melampaui susunan Yunani.
- issue: Hubungan μορφή dan σχῆμα
  choice: Membedakannya sebagai “rupa” dan “keadaan”.
  alternative: Menerjemahkan keduanya dengan “rupa/bentuk”.
  rationale: Pembedaan kosakata mencerminkan pergantian istilah dalam bahasa Yunani, tetapi tidak memaksakan definisi metafisis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke ayat 8.
