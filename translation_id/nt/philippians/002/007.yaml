review_pass:
  verdict: revise
  source_fidelity: Terjemahan mempertahankan metafora ἐκένωσεν dan urutan umum partisipel. Namun, δούλου lebih tepat diterjemahkan “budak” daripada “hamba” agar status terikat dan kontras penghinaan dalam teks tidak melemah. Untuk σχῆματι εὑρεθεὶς, “keadaan” terlalu umum dan “ketika” memberi nuansa temporal yang tidak diperlukan; istilah itu menunjuk pada penampilan atau wujud lahiriah.
  naturalness: “Ketika didapati dalam keadaan sebagai manusia” terasa kaku dalam bahasa Indonesia modern. “Dalam penampilan-Nya, Ia didapati sebagai manusia” lebih idiomatis, tetap baku, dan mempertahankan fungsi partisipial Yunani. Penghilangan “telah” membuat kalimat lebih luwes tanpa mengubah aspek lampau naratif.
  terminology: “Rupa” untuk μορφή dan “penampilan” untuk σχῆμα membedakan dua istilah Yunani tanpa memaksakan penafsiran metafisis. “Keserupaan manusia” mempertahankan ὁμοίωμα dan plural generik ἀνθρώπων. “Budak” menerjemahkan δοῦλος secara lebih spesifik daripada “hamba.”
  issues:
  - severity: medium
    issue: δούλου diterjemahkan “hamba.”
    rationale: “Hamba” dapat berarti pelayan atau abdi secara umum, sedangkan δοῦλος secara khusus menunjuk pada seorang budak/yang terikat. Dalam kontras ayat ini, status tersebut patut dipertahankan.
  - severity: medium
    issue: σχήματι diterjemahkan “keadaan,” dengan “ketika” untuk εὑρεθείς.
    rationale: σχῆμα menunjuk pada penampilan atau wujud lahiriah, bukan keadaan secara umum. “Ketika” mengubah partisipel menjadi penanda waktu yang tidak diperlukan dan hasilnya kurang alami.
  - severity: low
    issue: Kata “telah” tidak perlu dalam “telah mengosongkan diri-Nya.”
    rationale: Bahasa Indonesia tidak memerlukan penanda kala ini; penghapusannya menghasilkan alur yang lebih langsung sambil tetap sesuai dengan aoris Yunani.
  - severity: low
    issue: Catatan b memakai bentuk harfiah “manusia-manusia.”
    rationale: Plural ἀνθρώπων bersifat generik dan tidak lazim diterjemahkan “manusia-manusia” dalam bahasa Indonesia. Catatan dapat menjelaskan bentuk plural Yunani tanpa bentuk Indonesia yang janggal.
  revised_text: melainkan mengosongkan diri-Nya[a] dengan mengambil rupa seorang budak, menjadi dalam keserupaan manusia[b]; dan dalam penampilan-Nya, Ia didapati sebagai manusia,
