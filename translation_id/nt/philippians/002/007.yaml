revisions:
- from: melainkan telah mengosongkan diri-Nya[a] dengan mengambil rupa seorang hamba, menjadi serupa dengan manusia[b]; dan ketika didapati dalam keadaan sebagai manusia,
  to: melainkan mengosongkan diri-Nya[a] dengan mengambil rupa seorang budak, menjadi dalam keserupaan manusia[b]; dan dalam penampilan-Nya, Ia didapati sebagai manusia,
  rationale: Revisi memperjelas kekuatan δούλος sebagai “budak,” membedakan μορφή (“rupa”) dari σχῆμα (“penampilan”), dan memperbaiki kelancaran sintaksis Indonesia. Metafora “mengosongkan diri-Nya” serta ketegangan yang disengaja dalam “keserupaan manusia” tetap dipertahankan tanpa penjelasan doktrinal tambahan.
