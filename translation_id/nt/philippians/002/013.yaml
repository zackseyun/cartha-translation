  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: id
  text: Sebab Allahlah yang bekerja di dalam kamu, baik dalam hal berkehendak maupun bekerja, demi perkenanan-Nya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “baik kehendak maupun pekerjaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sesuai dengan perkenanan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sebab
  rationale: Menandai alasan yang menjelaskan nasihat pada ayat sebelumnya dan mempertahankan hubungan logis teks.
- source_word: ὁ ἐνεργῶν
  choice: yang bekerja
  rationale: Partisipel kini dengan artikel menunjuk kepada pelaku dan menyiratkan kegiatan yang berlangsung; konstruksi ini wajar dalam bahasa Indonesia.
- source_word: ἐν ὑμῖν
  choice: di dalam kamu
  rationale: Mempertahankan kemungkinan cakupan individual maupun komunal dari bentuk jamak Yunani tanpa mempersempitnya.
- source_word: τὸ θέλειν
  choice: untuk berkehendak
  rationale: Menjaga makna volisional dari infinitif berartikel serta kesejajarannya dengan infinitif berikutnya.
- source_word: τὸ ἐνεργεῖν
  choice: untuk bekerja
  rationale: Mempertahankan kaitan leksikal dengan ἐνεργῶν dan struktur paralel yang ringkas.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: demi perkenanan-Nya
  rationale: Ὑπέρ dengan genitif paling alami menyatakan tujuan atau kepentingan; 'perkenanan' menyampaikan εὐδοκία, sedangkan '-Nya' merujuk secara wajar kepada Allah.
theological_decisions:
- issue: Karya ilahi dan kehendak serta tindakan manusia
  choice: Mempertahankan dua unsur, 'baik untuk berkehendak maupun untuk bekerja,' dengan Allah sebagai pelaku yang bekerja di dalam umat-Nya.
  alternative: baik kehendak maupun pekerjaan; baik keinginan maupun kemampuan untuk bertindak
  rationale: Teks mengaitkan karya Allah dengan kehendak dan tindakan manusia tanpa menjelaskan mekanismenya; terjemahan tidak melunakkan salah satu unsur atau memasukkan penafsiran denominasi tertentu.
- issue: Fungsi ὑπέρ dalam frasa penutup
  choice: demi perkenanan-Nya
  alternative: sesuai dengan perkenanan-Nya
  rationale: Pilihan utama mempertahankan nuansa tujuan atau kepentingan yang lazim bagi ὑπέρ dengan genitif, sementara kemungkinan nuansa kesesuaian dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Allahlah' menegaskan Allah sebagai pelaku sesuai konstruksi Yunani. 'Kamu' dibiarkan tidak ditandai sebagai tunggal atau jamak secara morfologis, tetapi konteks surat memungkinkan pembacaan komunal; 'di dalam' mempertahankan ambiguitas antara karya dalam tiap orang dan dalam komunitas.
