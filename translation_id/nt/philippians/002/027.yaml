id: PHP.2.27
reference: Philippians 2:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: id
  text: Sebab ia memang jatuh sakit dan hampir mati. Namun, Allah berbelas kasih kepadanya—bukan hanya kepadanya, melainkan juga kepadaku—supaya aku tidak mengalami dukacita yang bertumpuk-tumpuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dukacita di atas dukacita,” yaitu dukacita yang bertambah atau bertumpuk.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: jatuh sakit
  rationale: Dalam konteks ini verba tersebut menunjuk pada penyakit jasmani Epafroditus. 'Jatuh sakit' alami dalam bahasa Indonesia dan menangkap peristiwa yang dinyatakan oleh bentuk aoris.
- source_word: παραπλήσιον θανάτῳ
  choice: hampir mati
  rationale: Ungkapan ini menyatakan bahwa keadaannya sangat dekat dengan kematian tanpa mengatakan bahwa ia benar-benar mati. 'Hampir mati' ringkas dan wajar dalam bahasa Indonesia.
- source_word: ἠλέησεν αὐτόν
  choice: mengasihaninya
  rationale: '''Mengasihani'' menyampaikan tindakan belas kasihan Allah terhadapnya dan mempertahankan bobot religius ἐλεάω tanpa menambahkan cara khusus Allah menolongnya.'
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: bukan hanya dia, melainkan juga aku
  rationale: Susunan ini mempertahankan kontras Yunani dan secara alami meneruskan objek dari verba 'mengasihani' dalam bahasa Indonesia.
- source_word: ἵνα μὴ λύπην ἐπὶ λύπην σχῶ
  choice: supaya aku tidak mengalami dukacita bertumpuk-tumpuk
  rationale: '''Supaya'' mempertahankan daya tujuan ἵνα μή; ''mengalami'' sesuai secara idiomatis dengan dukacita, sedangkan ''bertumpuk-tumpuk'' menyampaikan penambahan atau pelipatgandaan kesedihan dari ungkapan berulang Yunani.'
theological_decisions:
- issue: Belas kasihan Allah kepada Paulus melalui kesembuhan Epafroditus
  choice: Menerjemahkan secara langsung bahwa Allah mengasihani Epafroditus dan juga Paulus
  alternative: Menjelaskan bahwa belas kasihan kepada Paulus secara khusus berarti Allah menyembuhkan Epafroditus
  rationale: Teks menghubungkan belas kasihan Allah dengan terhindarnya Paulus dari dukacita tambahan, tetapi tidak menyatakan secara eksplisit mekanisme atau bentuk tindakan Allah; terjemahan tidak boleh mempersempitnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Namun' menandai pertentangan ἀλλά; tanda pisah membantu memperjelas sisipan kontras. Ungkapan Yunani 'dukacita di atas dukacita' dialihkan secara idiomatis dalam teks dan bentuk harfiahnya dipertahankan dalam catatan kaki.
