translation:
  language: id
  text: Ia merendahkan diri-Nya dengan menjadi taat sampai mati[a]—bahkan mati di kayu salib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “taat hingga kematian”; frasa ini berarti bahwa ketaatan-Nya berlangsung sampai pada kematian itu sendiri.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “kematian, tetapi dari salib.” Dalam konteks ini, frasa tersebut menyatakan klimaks: “bahkan mati di kayu salib.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: merendahkan
  rationale: Padanan aktif yang wajar dalam bahasa Indonesia modern dan mempertahankan tindakan merendahkan diri secara sukarela.
- source_word: ἑαυτὸν
  choice: diri-Nya
  rationale: Pronomina refleksif dinyatakan secara eksplisit karena penting bagi penekanan pada tindakan-Nya sendiri.
- source_word: γενόμενος
  choice: dengan menjadi
  rationale: Menyatakan hubungan partisipial sebagai cara Ia merendahkan diri-Nya tanpa menetapkan urutan waktu secara berlebihan.
- source_word: ὑπήκοος
  choice: taat
  rationale: Padanan langsung dan alami yang mempertahankan kekuatan makna ketaatan.
- source_word: μέχρι θανάτου
  choice: sampai mati
  rationale: Ungkapan Indonesia yang ringkas dan alami; mempertahankan kemungkinan nuansa bahwa ketaatan itu berlangsung hingga kematian dan mencapai kematian itu sendiri.
- source_word: δὲ
  choice: bahkan
  rationale: Dalam frasa klimaks ini, kata tersebut menandai peningkatan retoris dari kematian secara umum kepada kematian di kayu salib.
- source_word: σταυροῦ
  choice: di kayu salib
  rationale: Padanan idiomatis dan konkret untuk genitif ringkas yang menunjuk pada kematian melalui penyaliban.
theological_decisions:
- issue: Daya ungkap frasa terakhir θανάτου δὲ σταυροῦ
  choice: bahkan mati di kayu salib
  alternative: sungguh, kematian di kayu salib
  rationale: Terjemahan mempertahankan peningkatan retoris menuju bentuk kematian yang memalukan tanpa menambahkan penafsiran doktrinal.
- issue: Hubungan γενόμενος dengan ἐταπείνωσεν
  choice: dengan menjadi taat
  alternative: setelah menjadi taat
  rationale: Partisipel paling wajar dipahami sebagai cara atau sarana Ia merendahkan diri-Nya; pilihan ini menghindari penetapan urutan waktu yang tidak dituntut teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kapitalisasi pada “-Nya” mengikuti rujukan kepada Kristus dalam konteks, sedangkan susunan kalimat tetap sederhana dan mudah dibaca.
