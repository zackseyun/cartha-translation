  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: id
  text: supaya kamu menjadi tidak bercela dan tulus, anak-anak Allah yang tidak bernoda di tengah-tengah angkatan yang bengkok dan menyimpang,[a] di antara mereka kamu bersinar seperti penerang-penerang di dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “angkatan yang bengkok dan menyimpang” kemungkinan menggemakan Ulangan 32:5 dan membandingkan anak-anak Allah dengan angkatan yang rusak.
    reason: cross_reference
  - marker: b
    text: Atau “kamu tampak seperti penerang-penerang di dunia.” “Penerang-penerang” juga dapat diterjemahkan “benda-benda langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: supaya kamu menjadi
  rationale: Mempertahankan tujuan atau hasil yang dinyatakan ἵνα serta nuansa menjadi pada γένησθε, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ἄμεμπτοι
  choice: tidak bercela
  rationale: Menyampaikan keadaan yang tidak dapat dipersalahkan secara moral dan tetap dapat dibedakan dari ἄμωμα.
- source_word: ἀκέραιοι
  choice: tulus
  rationale: Dalam konteks etis, kata ini menunjuk pada kemurnian dan keutuhan watak; 'tulus' alami bagi pembaca Indonesia dan tidak terutama menyatakan ketidakbersalahan secara hukum.
- source_word: τέκνα θεοῦ
  choice: anak-anak Allah
  rationale: τέκνα bersifat inklusif dan menunjuk kepada anak-anak, bukan khusus anak laki-laki.
- source_word: ἄμωμα
  choice: yang tidak bernoda
  rationale: Mempertahankan citra tanpa noda serta membedakannya dari ἄμεμπτοι yang diterjemahkan 'tidak bercela'.
- source_word: μέσον γενεᾶς
  choice: di tengah-tengah angkatan
  rationale: Mencerminkan posisi umat Allah di dalam kelompok manusia yang mengelilingi mereka; 'angkatan' juga cocok dengan gema bahasa Kitab Suci.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: yang bengkok dan menyimpang
  rationale: Mempertahankan dua gambaran moral yang kuat tanpa memakai istilah modern yang mudah disalahpahami secara sempit.
- source_word: ἐν οἷς
  choice: di antara mereka
  rationale: Kata ganti relatif ini paling wajar dipahami merujuk kepada orang-orang dalam angkatan tersebut.
- source_word: φαίνεσθε
  choice: kamu bersinar
  rationale: Bersama φωστῆρες, verba ini secara alami membawa nuansa memancarkan cahaya, meskipun arti 'tampak' tetap mungkin dan dicatat dalam catatan kaki.
- source_word: φωστῆρες
  choice: benda-benda penerang
  rationale: Istilah ini dapat menunjuk kepada benda langit atau sumber cahaya secara umum; pilihan ini mempertahankan keluasan makna tanpa mempersempitnya menjadi 'bintang-bintang'.
- source_word: ἐν κόσμῳ
  choice: di dunia
  rationale: Dalam konteks ini κόσμος paling alami menunjuk kepada dunia tempat manusia hidup.
theological_decisions:
- issue: Hubungan 'yang tidak bernoda' dengan 'anak-anak Allah' dan kemungkinan gema Ulangan 32:5
  choice: Menempatkan 'yang tidak bernoda' langsung sesudah 'anak-anak Allah' dan membiarkan gema perjanjian tetap tersirat dalam teks utama.
  alternative: Menghubungkan 'tidak bernoda' secara lebih umum dengan seluruh rangkaian sifat, atau membuat rujukan kepada Ulangan 32:5 eksplisit dalam teks utama.
  rationale: Susunan Yunani paling langsung menerangkan anak-anak Allah dengan ἄμωμα, sedangkan kontras dengan angkatan yang bengkok dan menyimpang kemungkinan menggemakan Ulangan 32:5. Catatan kaki menjelaskan gema itu tanpa memasukkan tafsiran ke dalam teks.
- issue: Makna φαίνεσθε
  choice: kamu bersinar
  alternative: kamu tampak
  rationale: Konteks φωστῆρες mendukung makna bercahaya, tetapi bentuk leksikal juga dapat berarti 'tampak'; ambiguitas tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. 'Angkatan' dipilih untuk γενεά karena sesuai konteks kelompok sezaman dan membantu mempertahankan gema antar-teks. Tanda baca menempatkan catatan [a] sesudah frasa yang dijelaskannya dan [b] pada akhir klausa yang memiliki dua alternatif leksikal.
