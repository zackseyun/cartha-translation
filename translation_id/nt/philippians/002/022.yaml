id: PHP.2.22
reference: Philippians 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: id
  text: Namun, kalian tahu wataknya yang telah terbukti, yaitu bahwa seperti seorang anak bersama ayahnya, ia telah melayani bersama saya demi Injil.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wataknya yang teruji.” Istilah Yunani ini menunjuk pada mutu atau watak yang terbukti asli melalui pengujian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti seorang anak dengan seorang ayah.” Kata “anak” tidak menentukan jenis kelamin. Frasa “bersama saya” menerangkan bahwa Timotius melayani bersama Paulus demi Injil, bukan sekadar melayani Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan nuansa kontras ringan secara alami dalam konteks.
- source_word: τὴν δοκιμὴν αὐτοῦ
  choice: bahwa wataknya telah teruji
  rationale: δοκιμή menunjuk pada mutu atau watak yang terbukti asli melalui pengujian, bukan sekadar tindakan menguji.
- source_word: γινώσκετε
  choice: kalian tahu
  rationale: Menyampaikan pengetahuan yang sudah dimiliki jemaat Filipi; bentuk jamak dibuat eksplisit dengan 'kalian'.
- source_word: ὅτι
  choice: sebab
  rationale: Dalam susunan Indonesia, klausa berikut menjelaskan dasar mereka mengenal watak Timotius; 'sebab' menyampaikan hubungan penjelas ini dengan alami, sambil mengakui bahwa ὅτι juga dapat dibaca sebagai pengantar isi.
- source_word: ὡς πατρὶ τέκνον
  choice: seperti seorang anak dengan ayahnya
  rationale: Mempertahankan simile dan istilah τέκνον yang netral terhadap jenis kelamin, tanpa mempersempitnya menjadi 'anak laki-laki'.
- source_word: σὺν ἐμοὶ
  choice: bersama saya
  rationale: Mengungkapkan keterlibatan dekat Timotius bersama Paulus dalam pelayanan.
- source_word: ἐδούλευσεν
  choice: ia telah melayani
  rationale: Dalam konteks pekerjaan Injil, verba ini secara idiomatis menyatakan pengabdian dalam pelayanan; aspek lampau tercermin melalui 'telah'.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: demi Injil
  rationale: Menunjukkan arah dan tujuan pelayanan bersama itu secara ringkas dan alami.
theological_decisions:
- issue: Hubungan Timotius dengan Paulus dalam gambaran keluarga
  choice: seperti seorang anak dengan ayahnya
  alternative: seperti seorang anak melayani ayahnya
  rationale: Teks Yunani menempatkan 'bersama saya' pada verba melayani; terjemahan tidak boleh menyiratkan bahwa Timotius terutama melayani Paulus, sebab keduanya melayani demi Injil.
- issue: Makna ὅτι
  choice: sebab
  alternative: yakni bahwa
  rationale: Dipilih sebagai penjelasan tentang bagaimana watak Timotius terbukti, tetapi alternatif isi tetap mungkin secara gramatikal dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa γινώσκετε berbentuk jamak, sedangkan 'saya' menjaga kelugasan suara surat. Kapitalisasi 'Injil' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
