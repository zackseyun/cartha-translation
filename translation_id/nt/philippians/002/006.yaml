    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: dalam rupa Allah
  rationale: Mempertahankan ungkapan Yunani μορφή sebagai “rupa” tanpa mempersempitnya menjadi parafrasa metafisis; ungkapan ini tetap memberi ruang bagi bobot kristologis konteks.
- source_word: ὑπάρχων
  choice: walaupun berada
  rationale: Partisipel ini dipahami secara konsesif sesuai pertentangan dengan tindakan Kristus dalam ayat 7. Kemungkinan statif tetap dicatat dalam catatan kaki.
- source_word: ἁρπαγμὸν
  choice: sesuatu yang harus direbut
  rationale: Pilihan ini mencerminkan citra dasar ἁρπαγμός secara relatif langsung dan tidak menutup perdebatan apakah yang dimaksud ialah sesuatu yang direbut, dipertahankan erat, atau dimanfaatkan demi keuntungan sendiri.
- source_word: ἡγήσατο
  choice: tidak menganggap
  rationale: Mengungkapkan penilaian atau pertimbangan dengan bahasa Indonesia yang wajar dan dekat dengan arti ἡγέομαι.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: kesetaraan dengan Allah
  rationale: Nominalisasi ini alami dalam bahasa Indonesia dan menyampaikan gagasan berada setara dengan Allah; bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya kristologis ἐν μορφῇ θεοῦ
  choice: Memakai “dalam rupa Allah” dalam teks utama.
  alternative: “dalam hakikat Allah” atau “secara hakiki adalah Allah”
  rationale: Pilihan ini mempertahankan ungkapan Paulus dan kristologi tingginya tanpa menggantikannya dengan rumusan doktrinal yang lebih kemudian.
- issue: Makna ἁρπαγμός dalam hubungan dengan kesetaraan Kristus dengan Allah
  choice: Memakai “sesuatu yang harus direbut” dan mencatat kemungkinan makna lain.
  alternative: “sesuatu yang harus dipertahankan erat” atau “sesuatu yang dimanfaatkan demi keuntungan sendiri”
  rationale: ἁρπαγμός merupakan persoalan tafsir yang sungguh diperdebatkan. Teks utama mempertahankan citra perebutan, sedangkan catatan kaki menjaga alternatif kontekstual tanpa menyelesaikan ketegangan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur anak kalimat dipertahankan karena ayat ini melanjutkan kalimat dari konteks sebelumnya. Semua alternatif penting yang timbul dari ambiguitas partisipel dan ἁρπαγμός disajikan secara ringkas dalam catatan kaki.
