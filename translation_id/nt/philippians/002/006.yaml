  text: yang, walaupun berada dalam rupa Allah,[a] tidak menganggap kesetaraan dengan Allah[b] sebagai sesuatu untuk direbut.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berada dalam rupa Allah.” Kata Yunani ὑπάρχων dapat dipahami secara konsesif (“walaupun berada”) atau statif (“yang berada”).
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menjadi setara dengan Allah.”
    reason: lexical_alternative
  - marker: c
