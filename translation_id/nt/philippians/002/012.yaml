  naturalness: Bahasa yang dipakai baku, jelas, dan bernada pastoral. Susunan 'tetapi sekarang terlebih lagi ketika aku tidak hadir' mencerminkan urutan dan tekanan Yunani dengan lebih langsung daripada 'tetapi terlebih lagi sekarang ketika aku tidak hadir'.
