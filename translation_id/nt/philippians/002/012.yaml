id: PHP.2.12
reference: Philippians 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: id
  text: Karena itu, saudara-saudaraku yang terkasih, sebagaimana kalian selalu taat—bukan hanya ketika aku hadir, tetapi sekarang terlebih lagi ketika aku tidak hadir—kerjakanlah keselamatan kalian sendiri dengan takut dan gentar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mengerjakan” dapat berarti menjalankan atau membawa keselamatan itu terwujud dalam kehidupan.
    reason: alternative_reading
  - marker: b
    text: “Takut dan gentar” menyatakan rasa gentar yang penuh hormat serta kerendahan hati yang sungguh-sungguh di hadapan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari uraian sebelumnya dan menghubungkan nasihat ini dengan konteks secara alami.
- source_word: ἀγαπητοί μου
  choice: saudara-saudaraku yang terkasih
  rationale: Menyampaikan sapaan penuh kasih dalam bentuk jamak; penambahan 'saudara-saudara' wajar dalam bahasa Indonesia dan tidak membatasi sapaan pada laki-laki.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: sebagaimana kalian selalu taat
  rationale: Mempertahankan pola ketaatan yang telah menjadi ciri jemaat dan relevan bagi nasihat sekarang.
- source_word: ἐν τῇ παρουσίᾳ μου / ἐν τῇ ἀπουσίᾳ μου
  choice: ketika aku hadir / ketika aku tidak hadir
  rationale: Ungkapan verbal lebih alami dalam bahasa Indonesia daripada pasangan nomina 'dalam kehadiranku/ketidakhadiranku', sambil mempertahankan kontras Yunani.
- source_word: πολλῷ μᾶλλον
  choice: terlebih lagi sekarang
  rationale: Menyampaikan intensifikasi komparatif dengan jelas dan menghubungkan νῦν secara alami dengan keadaan Paulus yang sedang tidak hadir.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: keselamatan kalian sendiri
  rationale: Mempertahankan bobot teologis σωτηρία dan penekanan refleksif ἑαυτῶν; bentuk jamak 'kalian' juga menjaga bahwa nasihat ditujukan kepada jemaat.
- source_word: κατεργάζεσθε
  choice: teruslah mengerjakan
  rationale: Bentuk imperatif kini menyiratkan tindakan berkelanjutan; 'mengerjakan' mempertahankan dorongan untuk membawa keselamatan itu menjadi nyata tanpa menerjemahkannya sebagai 'memperoleh' atau 'meraih'.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: dengan takut dan gentar
  rationale: Mempertahankan kekuatan dan kekhidmatan ungkapan Yunani tanpa melembutkannya di dalam teks utama.
theological_decisions:
- issue: Makna 'mengerjakan keselamatan kalian sendiri'
  choice: Mempertahankan perintah untuk terus mengerjakan atau mewujudkan keselamatan dalam kehidupan, tanpa menyatakan bahwa keselamatan diperoleh sebagai upah usaha manusia.
  alternative: Menerjemahkan sebagai perintah untuk mendapatkan atau menghasilkan keselamatan dengan usaha sendiri.
  rationale: κατεργάζεσθε dapat menunjuk pada mengerjakan hingga terwujud atau terlaksana; konteks langsung ayat berikutnya menyebut Allah yang bekerja di dalam mereka. Teks utama mempertahankan ketegangan antara tanggung jawab manusia dan karya Allah.
- issue: Arti 'takut dan gentar'
  choice: Mempertahankan ungkapan harfiah yang menyatakan kesungguhan, kerendahan hati, dan rasa gentar di hadapan Allah.
  alternative: Menggantikannya dengan 'hormat' saja atau menafsirkannya semata-mata sebagai teror.
  rationale: φόβος καὶ τρόμος memiliki daya emosional dan kekhidmatan yang tidak sepenuhnya tercakup oleh 'hormat', tetapi konteks juga tidak mengharuskan makna ketakutan yang hina atau putus asa.
- issue: Dimensi 'keselamatan kalian sendiri'
  choice: Menggunakan 'kalian' untuk mempertahankan sapaan jamak dan memungkinkan dimensi pribadi sekaligus komunal.
  alternative: Menggunakan 'masing-masing' sehingga menekankan individualisme, atau menghapus 'sendiri' sehingga penekanan ἑαυτῶν hilang.
  rationale: Semua bentuk terkait bersifat jamak. Terjemahan ini menjaga tanggung jawab para pembaca tanpa memutusnya dari kehidupan jemaat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan khidmat. 'Kalian' dipilih untuk menandai orang kedua jamak secara jelas, sedangkan 'saudara-saudaraku yang terkasih' menjaga kehangatan sapaan Paulus. Tanda pisah mempertahankan sisipan kontras antara kehadiran dan ketidakhadiran Paulus.
