base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: id
  text: dan setiap lidah mengaku bahwa Yesus Sang Mesias[a] adalah Tuhan, untuk kemuliaan Allah Bapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yesus Kristus.”'
    reason: Menampilkan bentuk transliterasi tradisional bagi gelar Χριστός.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: setiap lidah
  rationale: Mempertahankan metafora tubuh dalam bahasa Yunani untuk pengakuan yang universal; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
- source_word: ἐξομολογήσηται
  choice: mengaku
  rationale: Menyampaikan tindakan menyatakan pengakuan secara terbuka tanpa menambahkan keterangan yang tidak tersurat. Bentuk Indonesia tidak menandai modus subjungtif, tetapi hubungan maksud dari konteks ayat sebelumnya tetap terbuka.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku yang mempertahankan bobot kristologis serta gema bahasa Kitab Suci dalam pernyataan ini.
- source_word: Χριστός
  choice: Sang Mesias
  rationale: Menerjemahkan gelar Yunani, bukan sekadar mentransliterasikannya. Kata “Sang” membuat pemakaian gelar itu wajar dan bermartabat dalam bahasa Indonesia; bentuk tradisional “Kristus” dicantumkan dalam catatan kaki.
- source_word: εἰς δόξαν
  choice: bagi kemuliaan
  rationale: Mencerminkan arah atau hasil yang dinyatakan oleh εἰς tanpa mempersempitnya hanya menjadi tujuan kausal.
- source_word: θεοῦ πατρός
  choice: Allah Bapa
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia yang mewakili susunan genitif Yunani secara ringkas.
theological_decisions:
- issue: Penerjemahan Χριστός dalam pengakuan kristologis
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός masih berfungsi sebagai gelar. “Sang Mesias” mempertahankan isi gelar tersebut, sedangkan bentuk gerejawi tradisional “Kristus” tetap diberikan sebagai alternatif.
- issue: Hubungan κύριος dengan Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias adalah Tuhan
  alternative: Tuhan ialah Yesus Sang Mesias
  rationale: Kedua nomina berbentuk nominatif karena kopula tidak dinyatakan dalam bahasa Yunani. Terjemahan utama mengikuti bentuk pengakuan yang paling alami dan sesuai dengan fungsi κύριος sebagai predikat, tanpa mengurangi penegasan bahwa gelar Tuhan dikenakan kepada Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konjungsi awal “dan” dipertahankan karena ayat ini melanjutkan struktur kalimat dari ayat sebelumnya. Metafora “setiap lidah” sengaja dipertahankan alih-alih diubah menjadi “setiap orang”.
