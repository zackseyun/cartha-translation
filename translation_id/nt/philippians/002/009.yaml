  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: id
  text: Karena itu, Allah juga sangat meninggikan Dia dan dengan murah hati menganugerahkan kepada-Nya nama yang di atas segala nama.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengaruniakan kepada-Nya,” untuk “dengan murah hati menganugerahkan kepada-Nya.”
    reason: lexical_alternative
  - marker: b
    text: “Nama” dapat menunjuk bukan hanya pada nama yang diucapkan, tetapi juga pada kedudukan, pangkat, atau gelar; ayat ini sendiri belum menyebutkan nama mana yang dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Karena itu, ... juga
  rationale: Mempertahankan hubungan kesimpulan dari διό dan daya aditif καί dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Subjek dalam bahasa Yunani dinyatakan secara eksplisit dan definit; 'Allah' adalah padanan baku bagi θεός dalam konteks ini.
- source_word: ὑπερύψωσεν
  choice: sangat meninggikan
  rationale: Menyampaikan daya intensif verba majemuk ὑπερυψόω tanpa menambahkan gagasan tempat yang tidak dinyatakan secara eksplisit.
- source_word: ἐχαρίσατο
  choice: dengan murah hati menganugerahkan
  rationale: Mempertahankan nuansa pemberian penuh kemurahan yang berkaitan dengan χάρις; 'menganugerahkan' sendiri juga merupakan padanan yang mungkin.
- source_word: τὸ ὄνομα
  choice: nama
  rationale: Mengikuti kata Yunani secara langsung dan tidak mempersempit maknanya menjadi 'gelar', meskipun nama di sini dapat menyiratkan kedudukan, pangkat, atau gelar.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: nama yang di atas segala nama
  rationale: Mempertahankan struktur perbandingan teks Yunani dalam ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Identitas 'nama'
  choice: Tetap diterjemahkan sebagai 'nama' tanpa menyebut nama tertentu dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai nama 'Yesus' atau gelar ilahi 'Tuhan'.
  rationale: Ayat ini sendiri belum mengidentifikasi nama tersebut; terjemahan mempertahankan keterbukaan teks dan tidak memasukkan kesimpulan dari ayat 10–11 ke dalam ayat 9.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Kristus mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan sesudah klausa terkait dan semuanya muncul dalam teks utama.
