id: PHP.2.1
reference: Philippians 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: id
  text: Jadi, jika ada dorongan dalam Mesias, jika ada penghiburan dari kasih, jika ada persekutuan Roh[a], jika ada kasih sayang dan belas kasihan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keikutsertaan dalam Roh”; kemungkinan lebih kecil, “persekutuan dalam roh.”
    reason: Mempertahankan ambiguitas hubungan genitif dalam κοινωνία πνεύματος dan kemungkinan yang lebih kecil bahwa πνεῦμα merujuk pada roh manusia.
lexical_decisions:
- source_word: οὖν
  choice: Jadi
  rationale: Menyatakan hubungan kesimpulan dengan konteks sebelumnya secara alami dalam bahasa Indonesia modern.
- source_word: παράκλησις
  choice: dorongan
  rationale: Mencakup nuansa penguatan dan penyemangatan dalam konteks ajakan menuju kesatuan, tanpa mempersempitnya menjadi perintah atau sekadar penghiburan emosional.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Mempertahankan preposisi ἐν dan nilai gelar Χριστός sesuai konteks.
- source_word: παραμύθιον
  choice: penghiburan
  rationale: Menunjukkan penghiburan atau perkataan yang menenangkan, sekaligus membedakannya dari παράκλησις yang diterjemahkan 'dorongan'.
- source_word: ἀγάπης
  choice: dari kasih
  rationale: 'Mengungkapkan secara wajar kemungkinan genitif sumber: penghiburan yang berasal dari kasih.'
- source_word: κοινωνία
  choice: persekutuan
  rationale: Menangkap dimensi relasional dan komunal istilah tersebut; kemungkinan arti partisipasi tetap dicatat dalam catatan kaki.
- source_word: πνεύματος
  choice: Roh
  rationale: Kemungkinan besar menunjuk kepada Roh Kudus, tetapi hubungan genitifnya dengan κοινωνία tetap ringkas dan tidak dijelaskan secara berlebihan dalam teks utama.
- source_word: σπλάγχνα
  choice: kasih sayang
  rationale: Menyampaikan idiom tentang perasaan batin yang mendalam dengan ungkapan Indonesia yang alami, tanpa mempertahankan gambaran anatomis harfiah.
- source_word: οἰκτιρμοί
  choice: belas kasihan
  rationale: Padanan modern dan jelas bagi rasa iba atau kemurahan hati yang penuh kepedulian.
theological_decisions:
- issue: Apakah πνεύματος menunjuk kepada Roh Kudus dan bagaimana genitif pada κοινωνία πνεύματος dipahami
  choice: persekutuan Roh
  alternative: keikutsertaan dalam Roh; kemungkinan lebih kecil, persekutuan dalam roh
  rationale: Konteks Paulus paling mungkin menunjuk kepada Roh Kudus. Namun, konstruksi Yunani tidak menentukan secara eksplisit apakah Roh merupakan pihak dalam persekutuan atau lingkup partisipasi; karena itu alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Struktur pengulangan 'jika ada' dipertahankan untuk mencerminkan susunan retoris Yunani. Koma penutup dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
source_grounding:
  english_pob_role: consult_only
