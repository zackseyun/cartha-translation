    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: akan mengubah
  rationale: Kata kerja ini menyatakan perubahan nyata dalam bentuk atau keadaan. “Mengubah” alami dalam bahasa Indonesia dan tetap mempertahankan tindakan masa depan yang tegas.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: tubuh kita yang hina
  rationale: Ungkapan genitif harfiahnya ialah “tubuh kehinaan kita.” Bentuk atributif ini lebih alami dan menyampaikan keadaan tubuh sekarang yang rendah atau mengalami kehinaan tanpa menambahkan gagasan tentang mekanisme kebangkitan.
- source_word: σύμμορφον
  choice: menjadi serupa dengan
  rationale: Adjektiva ini menunjukkan kesesuaian bentuk yang kuat. “Menjadi serupa dengan” jelas dan alami, sedangkan catatan kaki mempertahankan kemungkinan ungkapan yang lebih formal.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: tubuh-Nya yang mulia
  rationale: Konstruksi genitif “tubuh kemuliaan-Nya” secara idiomatis menyatakan tubuh yang bercirikan kemuliaan. Terjemahan atributif ini alami tanpa mengurangi bobot maknanya.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: dengan kuasa
  rationale: ἐνέργεια menunjuk pada daya atau kuasa yang bekerja secara efektif. “Dengan kuasa” menyampaikan sarana tindakan secara alami; bentuk yang lebih harfiah dicatat di catatan kaki.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: yang membuat-Nya sanggup
  rationale: Konstruksi infinitif ini menjelaskan daya kerja tersebut melalui kesanggupan Kristus. Rumusan ini lancar dalam bahasa Indonesia dan mempertahankan fokus pada kemampuan efektif-Nya.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: menundukkan segala sesuatu kepada diri-Nya sendiri
  rationale: “Menundukkan” mempertahankan daya kata kerja ὑποτάσσω, sedangkan “segala sesuatu” menjaga cakupan luas τὰ πάντα. “Diri-Nya sendiri” menampilkan sifat refleksif αὑτῷ secara eksplisit.
theological_decisions:
- issue: Hubungan antara kehinaan tubuh sekarang dan pemuliaan pada masa depan
  choice: Ayat ini menyatakan bahwa Kristus kelak mengubah tubuh orang percaya yang sekarang hina menjadi serupa dengan tubuh-Nya yang mulia.
  alternative: Terjemahan yang lebih interpretatif dapat menyebut kebangkitan secara eksplisit.
  rationale: Teks Yunani dengan jelas berbicara tentang perubahan tubuh dan keserupaannya dengan tubuh Kristus yang mulia, tetapi di sini tidak menjelaskan mekanismenya. Karena itu, istilah tambahan tentang kebangkitan tidak dimasukkan.
- issue: Sifat kuasa Kristus atas segala sesuatu
  choice: Kuasa yang mengubah tubuh orang percaya juga dinyatakan sebagai kuasa yang membuat Kristus sanggup menundukkan segala sesuatu kepada diri-Nya.
  alternative: Ungkapan dapat dibuat lebih harfiah sebagai “menurut daya kerja yang dengannya Dia sanggup.”
  rationale: Terjemahan mempertahankan kaitan langsung antara perubahan tubuh dan kekuasaan universal Kristus tanpa menjelaskan lebih jauh cara kuasa itu bekerja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, khidmat, dan mudah dipahami. Bentuk “-Nya” merujuk kepada Kristus. Konstruksi genitif Yunani dialihkan secara idiomatis dalam teks utama, sementara bentuk yang lebih harfiah disediakan dalam catatan kaki.
