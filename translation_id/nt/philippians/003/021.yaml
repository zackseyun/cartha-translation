  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: id
  text: yang akan mengubah tubuh kita yang hina[a] menjadi serupa dengan tubuh-Nya yang mulia[b], dengan kuasa yang memampukan-Nya bahkan untuk menundukkan segala sesuatu kepada diri-Nya sendiri.[c]
  philosophy: optimal-equivalence
