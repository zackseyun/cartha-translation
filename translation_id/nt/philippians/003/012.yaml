revisions:
- from: Bukan berarti bahwa aku sudah memperolehnya[a] atau sudah dijadikan sempurna[b]. Namun, aku terus mengejarnya, dengan harapan dapat meraih tujuan yang untuknya aku pun telah diraih oleh Kristus[c].
  to: Bukan berarti bahwa aku sudah memperolehnya[a] atau sudah dijadikan sempurna[b]. Namun, aku terus mengejarnya, kalau-kalau aku dapat meraihnya, karena untuk itulah aku pun telah diraih oleh Kristus[c].
  rationale: Revisi hanya menghapus nomina interpretatif “tujuan” dan menyatakan objek kata “meraih” secara eksplisit demi kelancaran bahasa Indonesia serta kesinambungan permainan kata Yunani. Bentuk pasif, unsur usaha yang belum tuntas, dan ambiguitas sintaktis ἐφ’ ᾧ tetap dipertahankan.
