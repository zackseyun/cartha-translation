id: PHP.3.12
reference: Philippians 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: id
  text: Bukan berarti bahwa aku sudah memperolehnya[a] atau sudah dijadikan sempurna[b]. Namun, aku terus mengejarnya, kalau-kalau aku dapat meraihnya, karena untuk itulah aku pun telah diraih oleh Kristus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudah menerimanya”; bahasa Yunani membiarkan objeknya tersirat dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “sudah menjadi sempurna” atau “sudah dijadikan lengkap.”
    reason: lexical_alternative
  - marker: c
    text: Frasa Yunani ini juga dapat dipahami, “karena aku pun telah diraih oleh Kristus.” Yunani Christos juga dapat diterjemahkan “Mesias.”
    reason: textual_ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: sudah memperolehnya
  rationale: Objek verba ini tersirat dari konteks sebelumnya. Akhiran -nya menyediakannya secara wajar dalam bahasa Indonesia, sedangkan 'memperoleh' mempertahankan gagasan mencapai atau mendapatkan apa yang dituju.
- source_word: τετελείωμαι
  choice: sudah dijadikan sempurna
  rationale: Bentuk pasif perfektum dipertahankan dengan 'sudah dijadikan', yang menyatakan keadaan hasil tanpa menentukan kerangka doktrinal tertentu mengenai kesempurnaan.
- source_word: διώκω
  choice: aku terus mengejarnya
  rationale: Kata 'mengejar' mempertahankan citra aktif διώκω, sementara 'terus' mengungkapkan usaha yang masih berlangsung dalam konteks.
- source_word: εἰ καὶ καταλάβω
  choice: dengan harapan dapat meraih
  rationale: Ungkapan ini menyatakan usaha yang hasilnya belum dianggap tercapai. 'Dengan harapan dapat' terdengar alami dan menjaga unsur ketidakpastian, sedangkan 'meraih' cocok dengan citra pengejaran.
- source_word: ἐφ’ ᾧ
  choice: tujuan yang untuknya
  rationale: Frasa ini dipahami sebagai menunjuk kepada maksud atau tujuan Kristus meraih Paulus, tetapi terjemahan tidak merinci apa tujuan itu.
- source_word: κατελήμφθην
  choice: aku pun telah diraih
  rationale: Bentuk pasif dipertahankan, dan pengulangan 'meraih/diraih' mereproduksi permainan kata dengan καταλάβω/κατελήμφθην.
- source_word: Χριστοῦ
  choice: Kristus
  rationale: Dalam pemakaian Paulus, Χριστός dapat berfungsi seperti nama sekaligus tetap membawa nuansa gelar; 'Kristus' merupakan bentuk baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah τετελείωμαι menyiratkan doktrin kesempurnaan tanpa dosa
  choice: sudah dijadikan sempurna
  alternative: sudah menjadi sempurna; sudah dijadikan lengkap
  rationale: Teks menyangkal bahwa Paulus telah mencapai keadaan yang tuntas, tetapi tidak mendefinisikan keadaan itu menurut suatu sistem teologis kemudian. Bentuk pasif dan ketegangan teologisnya dipertahankan.
- issue: Hubungan ἐφ’ ᾧ dengan tindakan Kristus
  choice: tujuan yang untuknya aku pun telah diraih
  alternative: karena aku pun telah diraih; oleh sebab itu aku pun telah diraih
  rationale: Bacaan tujuan paling sesuai dengan alur pengejaran dalam konteks, tetapi konstruksi Yunani memiliki kemungkinan nuansa sebab; alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' mengikuti suara pribadi Paulus. Pengulangan 'meraih/diraih' sengaja dipertahankan untuk mencerminkan permainan kata Yunani, walaupun sedikit lebih menonjol daripada ungkapan prosa sehari-hari.
