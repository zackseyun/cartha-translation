  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: id
  text: disunat pada hari kedelapan, berasal dari bangsa Israel, dari suku Benyamin, seorang Ibrani dari orang-orang Ibrani[a]; dalam hal hukum Taurat, seorang Farisi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang Ibrani keturunan orang Ibrani”; ungkapan ini menekankan asal-usul dan identitas Ibrani Paulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: disunat pada hari kedelapan
  rationale: Mengungkapkan frasa Yunani yang padat secara alami dan tetap mempertahankan penanda perjanjian Yahudi serta waktu pelaksanaannya.
- source_word: ἐκ γένους Ἰσραήλ
  choice: berasal dari bangsa Israel
  rationale: γένος di sini menunjuk pada asal-usul etnis atau garis keturunan; 'bangsa Israel' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: φυλῆς Βενιαμίν
  choice: dari suku Benyamin
  rationale: Frasa ini menyatakan garis kesukuan Paulus secara langsung dan alami.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: seorang Ibrani keturunan orang Ibrani
  rationale: Pilihan ini mempertahankan penekanan pada asal-usul dan identitas Ibrani tanpa memakai ungkapan harfiah yang kaku seperti 'Ibrani dari orang-orang Ibrani'.
- source_word: κατὰ νόμον
  choice: dalam hal hukum Taurat
  rationale: κατά memperkenalkan segi atau tolok ukur yang sedang dibicarakan. 'Dalam hal' menghindari kesan bahwa menjadi Farisi diperintahkan oleh Taurat.
- source_word: Φαρισαῖος
  choice: seorang Farisi
  rationale: '''Farisi'' adalah bentuk baku dan dikenal luas untuk kelompok Yahudi tersebut.'
theological_decisions:
- issue: Hubungan κατὰ νόμον dengan Φαρισαῖος
  choice: dalam hal hukum Taurat, seorang Farisi
  alternative: menurut hukum Taurat, seorang Farisi
  rationale: Pilihan utama menyatakan kategori identitas Paulus dalam kaitannya dengan Taurat, tanpa menyiratkan bahwa Taurat sendiri menetapkan atau memerintahkan seseorang menjadi Farisi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berupa rangkaian identitas dipertahankan sesuai bentuk ayat dan konteks kalimat yang berlanjut.
