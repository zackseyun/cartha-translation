id: PHP.3.20
reference: Philippians 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: id
  text: Karena kewarganegaraan kita ada di surga[a], dan dari sanalah kita juga dengan penuh kerinduan menantikan seorang Penyelamat, yaitu Tuhan Yesus, Sang Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persemakmuran kita.” Secara harfiah, “di surga-surga.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Tuhan Yesus Kristus.”
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: kewargaan
  rationale: Nomina ini menunjuk pada status atau keterikatan sipil-politis. “Kewargaan” mempertahankan daya civic istilah Yunani dan lebih tepat daripada sekadar “tanah air,” sementara cakupannya tidak diperluas menjadi suatu lembaga politik tertentu.
- source_word: ἐν οὐρανοῖς
  choice: di surga
  rationale: Bentuk Yunani secara gramatikal jamak, tetapi “di surga” adalah ungkapan Indonesia yang alami untuk ranah surgawi; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ὑπάρχει
  choice: ada
  rationale: “Ada” menyampaikan keberadaan nyata pada masa kini secara alami dalam bahasa Indonesia, tanpa menambah penekanan yang tidak dinyatakan teks.
- source_word: ἐξ οὗ
  choice: dari sanalah
  rationale: Frasa ini merujuk kembali secara spasial kepada surga. “Dari sanalah” jelas dan idiomatis, dengan partikel -lah yang menegaskan tempat asal tanpa mengubah makna.
- source_word: ἀπεκδεχόμεθα
  choice: dengan penuh kerinduan menantikan
  rationale: Ungkapan ini menangkap penantian yang terus berlangsung dan sarat pengharapan; “menantikan” saja kurang menampilkan unsur kesungguhan pada verba majemuk Yunani.
- source_word: σωτῆρα
  choice: seorang Penyelamat
  rationale: “Penyelamat” adalah padanan kristologis yang lazim dan mempertahankan makna penyelamatan maupun pembebasan. “Seorang” mencerminkan bentuk tak berartikel tanpa menyiratkan bahwa ada banyak penyelamat.
- source_word: κύριον
  choice: Tuhan
  rationale: “Tuhan” merupakan padanan baku dalam pemakaian kristologis Perjanjian Baru dan sesuai dengan rangkaian gelar di sini.
- source_word: Χριστόν
  choice: Sang Mesias
  rationale: Χριστός tetap berdaya sebagai gelar bagi Yesus dalam konteks penantian eskatologis. “Sang Mesias” menerjemahkan arti gelar itu secara alami dan hormat dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan πολίτευμα sebagai identitas individual atau komunitas politik
  choice: kewargaan
  alternative: persemakmuran / negara
  rationale: Konteks menekankan keterikatan sipil orang percaya, tetapi nomina Yunani dapat juga menunjuk pada tatanan atau komunitas politik. Teks utama memakai padanan yang paling wajar tanpa menutup alternatif leksikal itu, yang dicatat di catatan kaki.
- issue: Penerjemahan Χριστόν dalam rangkaian κύριον Ἰησοῦν Χριστόν
  choice: Tuhan Yesus, Sang Mesias
  alternative: Tuhan Yesus Kristus
  rationale: Konteks menyebut Dia sebagai Penyelamat yang dinantikan, sehingga daya gelar Χριστός tetap nyata. Koma penjelas membantu pembaca Indonesia memahami “Sang Mesias” sebagai gelar yang menerangkan Tuhan Yesus, bukan nama keluarga; bentuk gerejawi konvensional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat diperlancar dengan “dan dari sanalah” agar hubungan antara lokasi kewargaan dan asal kedatangan Penyelamat jelas. Huruf kapital pada Penyelamat, Tuhan, dan Mesias mengikuti fungsi gelar kristologis.
