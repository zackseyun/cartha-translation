  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: id
  text: dalam hal semangat, aku menganiaya jemaat; dalam hal kebenaran berdasarkan hukum Taurat, aku tidak bercela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: dalam hal
  rationale: Kata ini memperkenalkan bidang penilaian dan, dengan diulang, membentuk susunan retoris yang sejajar.
- source_word: ζῆλος
  choice: semangat
  rationale: Dalam konteks ini kata tersebut menunjuk pada gairah keagamaan Paulus dahulu; “semangat” alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: διώκων
  choice: aku menganiaya
  rationale: Partisipel ini menyatakan tindakan bermusuhan terhadap umat percaya. Klausa verbal dengan subjek tersirat menghasilkan bahasa Indonesia yang alami dalam rangkaian autobiografis ini.
- source_word: ἐκκλησίαν
  choice: jemaat
  rationale: Yang dimaksud ialah komunitas orang percaya, dan “jemaat” merupakan padanan Indonesia yang jelas dalam konteks Paulus.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: “Kebenaran” mempertahankan gagasan keadaan benar atau kelurusan yang dinilai menurut hukum Taurat, tanpa mempersempitnya hanya menjadi keadilan sosial atau yudisial.
- source_word: ἐν νόμῳ
  choice: yang terdapat dalam hukum Taurat
  rationale: Padanan ini mempertahankan arti harfiah “dalam hukum” sebagai lingkup atau kerangka kebenaran tersebut. “Hukum Taurat” memperjelas bahwa νόμος di sini merujuk pada Taurat.
- source_word: γενόμενος
  choice: aku tidak bercela
  rationale: Dalam bahasa Indonesia, menerjemahkan unsur ini bersama ἄμεμπτος sebagai predikasi verbal menghasilkan ungkapan alami. Nuansa hasil atau keadaan tercapai tersirat dari konteks kehidupan Paulus dahulu.
- source_word: ἄμεμπτος
  choice: tidak bercela
  rationale: Ungkapan ini menyatakan bahwa tidak ada tuduhan yang dapat dikenakan dalam kerangka penilaian yang baru saja disebutkan, bukan bahwa Paulus mengaku sama sekali tanpa dosa.
theological_decisions:
- issue: Cakupan pengakuan Paulus bahwa ia tidak bercela
  choice: Paulus menyatakan dirinya tidak bercela dalam hal kebenaran yang dinilai dalam kerangka hukum Taurat.
  alternative: Paulus mengaku sepenuhnya tanpa dosa di hadapan Allah, atau berbicara semata-mata secara ironis.
  rationale: Secara tata bahasa, ἄμεμπτος dibatasi oleh frasa mengenai δικαιοσύνη yang berada ἐν νόμῳ. Karena itu, pengakuan ini tidak diperluas menjadi kesempurnaan moral mutlak.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “dalam hal” dipertahankan untuk mencerminkan struktur retoris κατὰ ... κατὰ. Kata ganti “aku” mengikuti suara autobiografis Paulus dalam konteks kalimat yang lebih luas.
