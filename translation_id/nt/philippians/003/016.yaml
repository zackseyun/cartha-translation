  text: Only[a], let us keep in step with what we have attained.
translation:
  language: id
  text: Namun, marilah kita tetap hidup selaras dengan apa yang telah kita capai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “marilah kita hidup menurut patokan yang sama” atau “marilah kita mengikuti standar yang sama.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: Namun
  rationale: Di sini πλήν menandai peralihan yang membatasi atau mengoreksi. “Namun” alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan nasihat sebelumnya.
- source_word: εἰς ὃ
  choice: dengan apa yang
  rationale: Ungkapan ini menunjuk pada titik atau taraf yang telah dicapai; bersama στοιχεῖν, “sejalan dengan apa yang” menyampaikan hubungan tersebut secara alami.
- source_word: ἐφθάσαμεν
  choice: telah kita capai
  rationale: Bentuk aoris menunjuk pada titik kemajuan yang sudah dicapai dan tetap relevan bagi nasihat sekarang.
- source_word: τῷ αὐτῷ
  choice: sejalan dengan
  rationale: Dativa ini menyiratkan keselarasan dengan hal atau patokan yang sama tanpa menyebutkan kata benda seperti “patokan”, yang tidak eksplisit dalam teks SBLGNT.
- source_word: στοιχεῖν
  choice: tetap berjalan sejalan
  rationale: στοιχεῖν menggambarkan berjalan dalam barisan atau hidup selaras dengan suatu patokan. Ungkapan ini mempertahankan metafora sekaligus terdengar jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah perlu menambahkan kata benda eksplisit seperti “patokan” atau “aturan” pada τῷ αὐτῷ
  choice: Tidak menambahkannya dalam teks utama; maknanya disampaikan melalui “tetap berjalan sejalan dengan apa yang telah kita capai.”
  alternative: “marilah kita hidup menurut patokan yang sama” / “marilah kita tetap mengikuti aturan yang sama”
  rationale: Teks Yunani pendek dalam SBLGNT membiarkan patokan itu tersirat. Menambahkan “patokan” atau “aturan” akan memperjelas secara berlebihan dan dapat mencerminkan perluasan tekstual atau tradisi terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Marilah kita” menyampaikan hortatory subjunctive; “tetap berjalan sejalan” mempertahankan citra στοιχεῖν tanpa memasukkan kata benda yang tidak eksplisit.
