  to: Selebihnya[a], saudara-saudaraku[b], bersukacitalah dalam Tuhan. Menuliskan hal-hal yang sama kepada kalian tidaklah merepotkan bagiku[c], dan hal itu menjadi pengaman bagi kalian[d].
