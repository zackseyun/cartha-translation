  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: id
  text: Selebihnya[a], saudara-saudaraku[b], bersukacitalah dalam Tuhan. Menuliskan hal-hal yang sama kepada kalian tidaklah merepotkan bagiku[c], dan hal itu menjadi pengaman bagi kalian[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Akhirnya” atau “Selanjutnya.”
    reason: lexical_alternative
  - marker: b
    text: Kata “saudara-saudara” di sini menyapa seluruh jemaat, yakni saudara-saudara laki-laki dan perempuan.
    reason: cultural_note
  - marker: c
    text: Atau “tidaklah menjemukan bagiku” atau “tidak membuatku enggan.”
    reason: lexical_alternative
  - marker: d
    text: Secara lebih harfiah, “aman bagi kalian”; atau “menjadi perlindungan bagi kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Selebihnya
  rationale: Ungkapan ini berfungsi sebagai penanda peralihan wacana. “Selebihnya” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa surat segera berakhir; kemungkinan “Akhirnya” dan “Selanjutnya” dicatat dalam catatan kaki.
- source_word: ἀδελφοί μου
  choice: saudara-saudaraku
  rationale: Sapaan ini mempertahankan kehangatan bentuk posesif dan, dalam pemakaian Indonesia, dapat secara alami mencakup seluruh jemaat tanpa harus menambahkan pembedaan gender ke dalam teks.
- source_word: χαίρετε
  choice: bersukacitalah
  rationale: Bentuk imperatif jamak diterjemahkan sebagai ajakan atau perintah untuk bersukacita, sesuai dengan pemakaian khas Paulus.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Frasa preposisional dipertahankan secara langsung agar landasan sukacita dalam relasi dengan Tuhan tetap terbuka sesuai ungkapan Yunani.
- source_word: τὰ αὐτά
  choice: hal-hal yang sama
  rationale: Terjemahan ini mempertahankan ketidakjelasan rujukan dalam bahasa Yunani, tanpa menentukan apakah yang dimaksud ialah nasihat tertentu atau pengajaran sebelumnya secara umum.
- source_word: γράφειν
  choice: menuliskan
  rationale: Infinitif diterjemahkan secara alami dalam konstruksi kalimat Indonesia dan tetap menyatakan tindakan Paulus menulis kepada jemaat.
- source_word: οὐκ ὀκνηρόν
  choice: tidaklah memberatkan bagiku
  rationale: Pilihan ini menyampaikan bahwa mengulangi tulisan tersebut tidak membuat Paulus enggan atau merasa terbebani, tanpa mempersempit maknanya hanya menjadi kebosanan.
- source_word: ἀσφαλές
  choice: memberi kalian perlindungan
  rationale: Adjektiva ini menyatakan keamanan atau kepastian. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada “aman bagi kalian” dan menyampaikan fungsi protektif tanpa menentukan bentuk perlindungannya.
theological_decisions:
- issue: Sapaan bergender kepada jemaat
  choice: saudara-saudaraku
  alternative: saudara-saudara laki-lakiku; saudara-saudari yang kukasihi
  rationale: ἀδελφοί berbentuk maskulin jamak, tetapi dalam konteks ini menyapa jemaat secara keseluruhan. Kata “saudara-saudara” dalam bahasa Indonesia dapat berfungsi inklusif secara alami; cakupannya dijelaskan dalam catatan kaki tanpa memasukkan tafsiran denominasi.
- issue: Arti pengulangan tulisan Paulus sebagai perlindungan
  choice: memberi kalian perlindungan
  alternative: aman bagi kalian; menjadi pengaman bagi kalian
  rationale: Pilihan utama mengungkapkan daya protektif ἀσφαλές secara idiomatis, tetapi tidak menetapkan apakah perlindungan itu bersifat doktrinal, moral, atau pastoral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat, pastoral, dan bermartabat. Bentuk “kalian” dipakai karena Paulus menyapa jemaat secara jamak; “saudara-saudaraku” mempertahankan kedekatan sapaan. Susunan kalimat dibuat alami tanpa menghapus ambiguitas rujukan “hal-hal yang sama” maupun cakupan jenis perlindungan.
