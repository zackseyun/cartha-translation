id: PHP.3.19
reference: Philippians 3:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: id
  text: Akhir mereka adalah kebinasaan, allah mereka adalah perut mereka[a], dan kemuliaan mereka terletak dalam kehinaan mereka—pikiran mereka tertuju pada hal-hal yang ada di bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “allah mereka adalah selera mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka memikirkan hal-hal yang ada di bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: akhir
  rationale: “Akhir” mempertahankan ungkapan Yunani yang ringkas dan dapat menunjuk pada kesudahan sekaligus hasil akhir mereka.
- source_word: ἀπώλεια
  choice: kebinasaan
  rationale: “Kebinasaan” menyampaikan daya eskatologis yang keras dari istilah Yunani tanpa mempersempitnya menjadi sekadar kerugian atau kemerosotan.
- source_word: κοιλία
  choice: perut mereka
  rationale: Pilihan ini mempertahankan metafora tubuh yang konkret dan tajam; pengulangan “mereka” membuat hubungan kepemilikan jelas dalam bahasa Indonesia.
- source_word: δόξα
  choice: kemuliaan
  rationale: '“Kemuliaan” merupakan padanan langsung yang mempertahankan ironi: mereka menganggap mulia justru apa yang memalukan.'
- source_word: αἰσχύνη
  choice: kehinaan
  rationale: “Kehinaan” mencakup rasa malu dan keadaan yang mendatangkan aib, serta berpasangan secara alami dengan “kemuliaan”.
- source_word: τὰ ἐπίγεια
  choice: hal-hal yang ada di bumi
  rationale: Ungkapan ini dekat dengan bentuk Yunani dan mempertahankan kontras spasial dengan kewargaan di surga pada ayat berikutnya tanpa langsung memberi muatan moral tambahan pada kata “duniawi”.
- source_word: φρονοῦντες
  choice: pikiran mereka tertuju pada
  rationale: Bentuk partisip ini menggambarkan orientasi batin yang berkelanjutan, bukan hanya kegiatan berpikir sesaat.
- source_word: ὧν ... ὧν
  choice: mereka ... mereka
  rationale: Kata ganti relatif genitif yang berulang merujuk kepada orang-orang dalam ayat sebelumnya; bentuk posesif Indonesia menjaga rujukannya tetap jelas dan alami.
theological_decisions:
- issue: Daya metaforis ungkapan “allah mereka adalah perut”
  choice: Metafora konkret “perut” dipertahankan dalam teks utama.
  alternative: allah mereka adalah selera atau nafsu makan mereka
  rationale: Bahasa Yunani memakai citra tubuh yang tajam untuk menggambarkan pengabdian kepada hasrat jasmani. Mempertahankan citra itu menghindari pembatasan makna pada satu jenis nafsu saja.
- issue: Arti orientasi kepada τὰ ἐπίγεια
  choice: “pikiran mereka tertuju pada hal-hal yang ada di bumi”
  alternative: “mereka memikirkan hal-hal duniawi”
  rationale: Pilihan utama mempertahankan orientasi pikiran yang berkelanjutan dan hubungan kontekstual dengan “surga” dalam ayat berikutnya, tanpa menganggap bahwa “duniawi” hanya berarti tidak bermoral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rangkaian retoris Paulus serta metafora dan ironi teks Yunani, tetapi menghindari kekakuan sintaksis.
