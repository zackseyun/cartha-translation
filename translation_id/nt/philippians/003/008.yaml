id: PHP.3.8
reference: Philippians 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: id
  text: Bahkan lebih dari itu, aku menganggap segala sesuatu sebagai kerugian karena nilai yang tak tertandingi dari mengenal Mesias Yesus, Tuhanku. Karena Dialah aku telah mengalami kehilangan segala sesuatu dan menganggapnya sampah[a], supaya aku memperoleh Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sampah” menerjemahkan kata yang keras dan juga dapat berarti “kotoran”, “sisa buangan”, atau “tahi”.
    reason: lexical_alternative
  - marker: b
    text: “Mesias” juga dapat diterjemahkan “Kristus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Bahkan lebih dari itu
  rationale: Rangkaian partikel ini memperkuat dan melanjutkan penilaian Paulus dari ayat sebelumnya; ungkapan ini menyampaikan daya peningkatannya secara alami.
- source_word: ἡγοῦμαι
  choice: aku menganggap
  rationale: Kata kerja ini menyatakan penilaian yang disengaja; bentuk yang sama dipakai secara konsisten pada kedua kemunculannya.
- source_word: πάντα / τὰ πάντα
  choice: segala sesuatu
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari ungkapan Yunani.
- source_word: ζημίαν
  choice: kerugian
  rationale: Istilah ini mempertahankan metafora untung-rugi yang berlanjut sampai kata κερδήσω.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: karena nilai yang tak tertandingi dari mengenal
  rationale: Ungkapan ini menyampaikan keunggulan tertinggi yang dinyatakan ὑπερέχον, sedangkan 'mengenal' mengungkapkan γνώσεως secara alami dan relasional dalam bahasa Indonesia.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός dipahami sebagai gelar yang masih bermakna di sini, bukan sekadar unsur nama.
- source_word: τοῦ κυρίου μου
  choice: Tuhanku
  rationale: Menyatukan bentuk posesif secara wajar sambil mempertahankan bobot kristologis κύριος.
- source_word: δι’ ὃν
  choice: Demi Dia
  rationale: Ungkapan ini menyampaikan orientasi pribadi dan pengorbanan yang terkandung dalam frasa Yunani.
- source_word: ἐζημιώθην
  choice: aku telah kehilangan
  rationale: Bentuk ini menyampaikan kerugian yang benar-benar dialami; bahasa Indonesia tidak perlu memaksakan bentuk pasif Yunani agar maknanya tetap jelas.
- source_word: σκύβαλα
  choice: sampah
  rationale: Kata ini cukup kuat dan mudah dipahami, sambil mempertahankan nuansa penolakan keras; ragam maknanya dijelaskan dalam catatan kaki.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: supaya aku memperoleh Mesias
  rationale: '''Supaya'' mempertahankan makna tujuan ἵνα, sedangkan ''memperoleh'' meneruskan metafora untung-rugi.'
theological_decisions:
- issue: Penerjemahan Χριστός dalam pemakaian Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini Χριστός tetap dapat didengar sebagai gelar. Alternatif tradisional 'Kristus' dipertahankan dalam catatan kaki tanpa menyelesaikan secara sepihak kemungkinan bahwa bentuk itu telah menjadi seperti nama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Kata ganti 'aku' dipilih karena Paulus berbicara dalam orang pertama secara langsung. Kalimat dibagi dua agar mudah dibaca tanpa mengubah hubungan argumentasinya; metafora kerugian dan perolehan dipertahankan.
