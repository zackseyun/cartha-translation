revisions:
- from: Aku terus berlari menuju sasaran untuk memperoleh hadiah dari panggilan Allah ke atas dalam Mesias Yesus.[a][b]
  to: Aku mengejar sasaran untuk memperoleh hadiah yang terkait dengan panggilan ke atas dari Allah dalam Mesias Yesus.[a][b]
  rationale: Revisi mengganti pengkhususan «terus berlari» dengan «mengejar», yang lebih dekat kepada διώκω dan tetap cocok dengan citra atletik. Frasa tentang hadiah dan panggilan disusun ulang agar alami dalam bahasa Indonesia serta tidak menjadikan panggilan secara keliru sebagai sumber hadiah. «Panggilan ke atas dari Allah» mempertahankan urutan dan ambiguitas semantis utama dalam Yunani; catatan kaki mencatat pembacaan ‘surgawi’ dan ‘dari atas’.
