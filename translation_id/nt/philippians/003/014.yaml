  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: id
  text: Aku mengejar sasaran untuk memperoleh hadiah yang terkait dengan panggilan ke atas dari Allah dalam Mesias Yesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panggilan surgawi dari Allah” atau “panggilan dari atas oleh Allah.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “dalam Kristus Yesus”; “Kristus” adalah gelar yang berarti “Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: menuju sasaran
  rationale: Dalam gambaran perlombaan, frasa ini menunjukkan gerak yang terarah kepada tujuan tetap. “Menuju sasaran” alami dalam bahasa Indonesia dan mempertahankan citra atletik.
- source_word: διώκω
  choice: Aku terus berlari
  rationale: Secara dasar verba ini berarti mengejar atau memburu; dalam konteks perlombaan, ungkapan ini menyampaikan usaha maju yang gigih. “Terus” juga menghubungkan ayat ini dengan pemakaian verba yang sama pada ayat 12.
- source_word: εἰς τὸ βραβεῖον
  choice: untuk memperoleh hadiah
  rationale: εἰς menyatakan arah atau tujuan usaha. “Untuk memperoleh hadiah” menyampaikan maksud itu dengan jelas tanpa menyatakan secara pasti bahwa hadiah tersebut sudah diraih.
- source_word: ἄνω
  choice: ke atas
  rationale: Pilihan ini mempertahankan daya spasial ἄνω serta membuka kemungkinan bahwa panggilan itu mengarah ke atas; alternatif “dari atas” juga mungkin secara leksikal.
- source_word: κλήσεως τοῦ θεοῦ
  choice: panggilan Allah
  rationale: Genitif τοῦ θεοῦ dipertahankan secara ringkas dan alami; Allah dipahami sebagai sumber atau pemilik panggilan tanpa memperluas konstruksi Yunani.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Preposisi ἐν diterjemahkan langsung sebagai “dalam”, sedangkan Χριστός dipertahankan sebagai gelar “Mesias” agar makna gelarnya tetap tampak.
theological_decisions:
- issue: Makna ἄνω κλήσεως
  choice: panggilan Allah ke atas
  alternative: panggilan surgawi Allah; panggilan Allah dari atas
  rationale: “Ke atas” paling baik mempertahankan kemungkinan arah panggilan dalam citra perlombaan, sedangkan catatan kaki menjaga kemungkinan bahwa ἄνω menerangkan asal panggilan atau sifat surgawinya.
- issue: Hubungan βραβεῖον dengan κλήσεως
  choice: hadiah dari panggilan Allah ke atas
  alternative: hadiah, yaitu panggilan Allah ke atas; hadiah yang berkaitan dengan panggilan Allah ke atas
  rationale: Genitif dapat menyatakan hubungan erat antara hadiah dan panggilan tanpa memastikan apakah keduanya identik. “Dari” cukup alami, sementara ambiguitas konseptualnya tidak dijabarkan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Aku” mengikuti tuturan pribadi Paulus; citra perlombaan dipertahankan melalui “berlari”, “sasaran”, dan “hadiah”. Semua penanda catatan kaki ditempatkan dalam teks utama.
