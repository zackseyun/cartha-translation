  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: id
  text: Namun, segala sesuatu yang dahulu merupakan keuntungan bagiku telah kuanggap[a] sebagai kerugian karena Sang Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah kuperhitungkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “demi Sang Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan tegas dengan dasar-dasar kepercayaan diri yang baru saja Paulus sebutkan, dengan gaya Indonesia yang wajar dan bermartabat.
- source_word: ἅτινα
  choice: segala sesuatu yang
  rationale: Mencakup seluruh rangkaian keuntungan terdahulu yang disebutkan Paulus, bukan hanya satu hal tertentu.
- source_word: ἦν μοι κέρδη
  choice: dahulu merupakan keuntungan bagiku
  rationale: Keterangan 'dahulu' menyampaikan bentuk lampau ἦν, sedangkan 'keuntungan' mempertahankan metafora pembukuan κέρδη; bentuk tunggal kolektif wajar dalam bahasa Indonesia.
- source_word: ἥγημαι
  choice: telah kuanggap
  rationale: Bentuk perfektum menunjukkan penilaian yang telah dibuat dan tetap berlaku; 'telah kuanggap' menyampaikan hasil yang berlanjut itu secara ringkas.
- source_word: διὰ τὸν Χριστόν
  choice: karena Sang Mesias
  rationale: διά dengan akusatif terutama menyatakan sebab atau alasan di sini. 'Sang Mesias' menerjemahkan Χριστός sebagai gelar dan menghasilkan ungkapan Indonesia yang alami.
- source_word: ζημίαν
  choice: kerugian
  rationale: Mempertahankan kontras pembukuan dengan 'keuntungan' dan menyatukan semua keuntungan terdahulu sebagai satu kerugian.
theological_decisions:
- issue: Penerjemahan Χριστόν
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός dapat dipahami sebagai gelar. 'Sang Mesias' menyatakan makna gelar itu, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Nuansa διὰ dengan akusatif
  choice: karena Sang Mesias
  alternative: demi Sang Mesias
  rationale: '''Karena'' paling langsung menyatakan alasan atau sebab, sedangkan ''demi'' mungkin menonjolkan tujuan atau kepentingan. Alternatif dicatat karena nuansa kontekstual keduanya berdekatan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan kalimat mempertahankan pertentangan keuntungan–kerugian dan nuansa penilaian yang telah dibuat serta masih berlaku.
