revisions:
- from: Sebab, kitalah umat yang bersunat, yaitu kita yang beribadah oleh Roh Allah, bermegah dalam Mesias Yesus, dan tidak menaruh kepercayaan pada hal-hal lahiriah[a].
  to: Sebab, kitalah kaum bersunat, yaitu kita yang beribadah oleh Roh Allah, bermegah dalam Mesias Yesus, dan tidak mengandalkan daging[a].
  rationale: Revisi mengembalikan “daging” sebagai padanan utama σάρξ agar hubungan leksikal dan retoris dengan sunat tetap tampak. Catatan kaki mempertahankan penjelasan kontekstual tanpa menggantikannya dengan parafrasa dalam teks. “Kaum bersunat” memperbaiki kelancaran dan kepadatan ungkapan identitas kolektif.
