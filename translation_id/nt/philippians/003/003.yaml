    issue: σάρξ diterjemahkan “hal-hal lahiriah” dalam teks utama.
    rationale: Ungkapan itu hanya menangkap salah satu implikasi kontekstual σάρξ, tetapi tidak mempertahankan kata dan gema kontrasnya dengan περιτομή. Catatan kaki dapat menjelaskan bahwa yang dimaksud meliputi dasar jasmani dan manusiawi bagi kepercayaan diri.
  - severity: low
    issue: “umat yang bersunat” kurang langsung mencerminkan identitas kolektif περιτομή.
    rationale: “Kaum bersunat” lebih ringkas, lazim dalam register baku, dan lebih dekat dengan pernyataan “kami adalah sunat.”
