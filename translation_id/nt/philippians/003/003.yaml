id: PHP.3.3
reference: Philippians 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: id
  text: Sebab, kitalah kaum bersunat, yaitu kita yang beribadah oleh Roh Allah, bermegah dalam Mesias Yesus, dan tidak mengandalkan daging[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging”. Di sini istilah itu menunjuk pada dasar jasmani atau manusiawi untuk menaruh kepercayaan, seperti sunat, keturunan, atau status keagamaan.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: umat yang bersunat
  rationale: Nomina konkret tetap dipertahankan, tetapi diungkapkan secara alami dalam bahasa Indonesia sebagai identitas umat; ironi Paulus tentang sunat sejati tidak dijabarkan ke dalam teks.
- source_word: πνεύματι θεοῦ
  choice: oleh Roh Allah
  rationale: Dengan bacaan SBLGNT θεοῦ, frasa ini paling wajar menunjuk kepada Roh Allah sebagai sarana atau kuasa dalam beribadah.
- source_word: λατρεύοντες
  choice: beribadah
  rationale: Kata ini menyatakan pelayanan religius kepada Allah; 'beribadah' alami dan cukup luas dalam bahasa Indonesia.
- source_word: καυχώμενοι
  choice: bermegah
  rationale: Pilihan ini mempertahankan gagasan tentang dasar kebanggaan, sekaligus cocok dengan kontras terhadap kepercayaan pada hal-hal lahiriah.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός dipertahankan sebagai gelar 'Mesias', bukan sekadar dialihaksarakan, karena gelarnya masih bermakna dalam argumen Paulus.
- source_word: σαρκί
  choice: hal-hal lahiriah
  rationale: Dalam konteks langsung pasal 3, σάρξ menunjuk terutama pada dasar jasmani dan manusiawi untuk merasa yakin—termasuk sunat, keturunan, dan status—bukan semata-mata 'tabiat berdosa'. Catatan kaki menjaga hubungan dengan metafora harfiah 'daging'.
- source_word: πεποιθότες
  choice: tidak menaruh kepercayaan
  rationale: Bentuk perfektum menyatakan sikap percaya atau bersandar yang menetap; ungkapan ini wajar dalam bahasa Indonesia.
- source_word: γάρ
  choice: Sebab
  rationale: Menjaga hubungan penjelas dengan peringatan dalam ayat sebelumnya.
theological_decisions:
- issue: Makna σάρξ dalam ayat ini
  choice: dasar lahiriah atau manusiawi untuk menaruh kepercayaan
  alternative: '''daging'' sebagai tabiat berdosa'
  rationale: Ayat-ayat berikutnya merinci sunat, garis keturunan, ketaatan pada hukum, dan status sebagai hal-hal yang dahulu menjadi dasar keyakinan Paulus.
- issue: Daya πνεύματι θεοῦ
  choice: Roh Allah sebagai sarana atau kuasa dalam ibadah
  alternative: roh manusia atau beribadah kepada Allah secara rohani
  rationale: Bacaan SBLGNT dengan θεοῦ paling alami dipahami sebagai rujukan kepada Roh ilahi, walaupun fungsi datifnya dapat mencakup nuansa sarana dan lingkup.
- issue: Identitas 'sunat'
  choice: umat yang bersunat sebagai sebutan identitas bagi para pengikut Mesias
  alternative: orang-orang yang benar-benar bersunat
  rationale: Rumusan ini mempertahankan pernyataan identitas Paulus tanpa menambahkan kata 'sejati', yang hanya tersirat dalam pertentangannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga partisipel dipertahankan sebagai tiga ciri sejajar. 'Kitalah' menyampaikan penekanan eksplisit pada ἡμεῖς, sedangkan 'umat yang bersunat' menghindari ungkapan nominal yang kaku.
