  source_fidelity: Revisi diperlukan karena “hal-hal lahiriah” dalam teks utama menafsirkan σάρξ terlalu jauh dan menghapus citra harfiah “daging” yang sengaja dipertahankan Paulus dalam kontras dengan sunat. Istilah itu sebaiknya ada dalam teks, dengan penjelasan kontekstual di catatan kaki.
  naturalness: “Kaum bersunat” merupakan sebutan identitas yang lebih padat dan alami daripada “umat yang bersunat,” sambil mempertahankan bentuk nominatif konkret περιτομή. “Tidak mengandalkan daging” adalah ungkapan Indonesia yang wajar dalam register Alkitabiah modern.
  terminology: “Roh Allah,” “Mesias Yesus,” dan “bermegah” sudah tepat. “Daging” mempertahankan istilah kunci σάρξ dan ambiguitas literal-metaforisnya, tanpa memasukkan tafsiran “tabiat berdosa.”
  issues:
