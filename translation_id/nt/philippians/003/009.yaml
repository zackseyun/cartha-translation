id: PHP.3.9
reference: Philippians 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: id
  text: dan didapati di dalam Dia, tanpa memiliki kebenaranku sendiri[b] yang berasal dari hukum Taurat, melainkan dengan kebenaran melalui iman kepada Mesias[a], yaitu kebenaran dari Allah berdasarkan iman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui kesetiaan Mesias.”
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “kebenaran” dalam kedua kemunculannya juga dapat diterjemahkan “keadilan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: didapati berada
  rationale: Bentuk pasif dipertahankan dengan “didapati”; “berada” membuat ungkapan Indonesia dengan ἐν αὐτῷ terdengar wajar tanpa mempersempit maknanya.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan ungkapan khas Paulus tentang keberadaan atau persatuan dengan Mesias tanpa menguraikannya secara berlebihan.
- source_word: μὴ ἔχων
  choice: bukan dengan memiliki
  rationale: Menyatakan keadaan atau cara Paulus didapati di dalam Dia, sesuai fungsi partisipelnya.
- source_word: δικαιοσύνην
  choice: kebenaran
  rationale: “Kebenaran” merupakan padanan teologis yang lazim dan cukup luas; kemungkinan makna “keadilan” dicatat dalam catatan kaki.
- source_word: τὴν ἐκ νόμου
  choice: yang berasal dari hukum Taurat
  rationale: ἐκ menyatakan sumber. “Hukum Taurat” secara alami menunjuk pada hukum dalam argumen Paulus dan menghindari kesan sekadar hukum umum.
- source_word: διὰ πίστεως Χριστοῦ
  choice: melalui iman kepada Mesias
  rationale: Teks utama memakai pembacaan genitif objektif, sementara pembacaan genitif subjektif yang sungguh diperdebatkan dipertahankan dalam catatan kaki.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Menerjemahkan fungsi gelarnya, bukan sekadar mentransliterasikannya sebagai nama.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: kebenaran dari Allah
  rationale: Mempertahankan susunan ringkas yang menekankan Allah sebagai sumber kebenaran tersebut.
- source_word: ἐπὶ τῇ πίστει
  choice: berdasarkan iman
  rationale: Mengungkapkan dasar yang ditandai oleh ἐπί dengan datif dalam bahasa Indonesia modern dan ringkas.
theological_decisions:
- issue: Makna πίστεως Χριστοῦ
  choice: iman kepada Mesias
  alternative: kesetiaan Mesias
  rationale: Konstruksi genitif ini dapat dipahami secara objektif atau subjektif. Teks utama mengikuti pembacaan “iman kepada Mesias”, tetapi tidak meniadakan pembacaan “kesetiaan Mesias”.
- issue: Makna δικαιοσύνη dalam konteks Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” mempertahankan istilah teologis yang dikenal, sedangkan catatan kaki menunjukkan keluasan semantis yang dapat mencakup “keadilan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat tetap dekat dengan argumentasi Paulus, tetapi hubungan antarbagiannya dibuat cukup alami bagi pembaca umum. Kedua penanda catatan kaki ditempatkan sesudah kalimat yang memuat frasa terkait agar urutannya tetap [a], [b].
