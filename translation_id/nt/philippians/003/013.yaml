  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: id
  text: 'Saudara-saudara[a], saya tidak menganggap diri saya telah meraihnya. Namun, satu hal: melupakan hal-hal yang di belakang dan mengulurkan diri ke arah hal-hal yang di depan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani adelphoi berbentuk jamak maskulin dan secara harfiah berarti “saudara-saudara laki-laki”; Paulus sering memakainya untuk menyapa seluruh komunitas orang percaya, termasuk perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini mempertahankan bentuk sapaan Yunani dan wajar dalam bahasa Indonesia untuk komunitas seiman; cakupannya yang dapat meliputi perempuan dijelaskan dalam catatan kaki.
- source_word: λογίζομαι
  choice: menganggap
  rationale: Menyampaikan penilaian pribadi Paulus secara alami dan tepat dalam bahasa Indonesia modern.
- source_word: κατειληφέναι
  choice: telah meraihnya
  rationale: Mempertahankan gambaran mengambil atau mencapai sesuatu dari konteks ayat 12; akhiran -nya menyatakan objek yang tersirat dalam bahasa Yunani.
- source_word: ἓν δέ
  choice: Namun, satu hal
  rationale: Mempertahankan elipsis dan peralihan mendadak teks Yunani tanpa menambahkan kata kerja yang tidak dinyatakan.
- source_word: τὰ μὲν ὀπίσω
  choice: apa yang di belakang
  rationale: Ungkapan alami yang tetap mempertahankan gambaran spasial tentang hal-hal di belakang.
- source_word: ἐπιλανθανόμενος
  choice: melupakan
  rationale: Merupakan arti leksikal langsung dan tidak menambahkan tafsiran seperti meninggalkan atau mengabaikan.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: apa yang di depan
  rationale: Membentuk kontras yang jelas dan seimbang dengan 'apa yang di belakang'.
- source_word: ἐπεκτεινόμενος
  choice: mengulurkan diri kepada
  rationale: Menangkap gerak aktif meregangkan diri ke depan tanpa memperkuatnya secara berlebihan menjadi perjuangan keras.
