  rationale: Revisi mempertahankan konstruksi konsesif καίπερ, penegasan ἐγώ, dan perbandingan singkat μᾶλλον. 'Dalam hal daging' lebih tepat daripada 'pada daging' karena tidak menjadikan 'daging' objek keyakinan. Catatan kaki tetap menyediakan alternatif kontekstual tanpa menggantikan istilah sumber dalam teks utama.
