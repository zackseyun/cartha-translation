  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: id
  text: Walaupun aku sendiri mempunyai keyakinan bahkan dalam hal daging. Jika orang lain mengira bahwa ia mempunyai keyakinan dalam hal daging[a], aku lebih lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “keyakinan berdasarkan kelayakan manusia” atau “keyakinan berdasarkan kedudukan lahiriah.” Secara harfiah: “dalam daging.”'
    reason: Menjelaskan arti kontekstual σάρξ sambil mempertahankan ungkapan harfiahnya dalam teks utama.
lexical_decisions:
- source_word: καίπερ
  choice: Meskipun
  rationale: Menandai konsesi dengan jelas dan mempertahankan hubungan argumentatif dengan konteks sebelumnya.
- source_word: ἔχων πεποίθησιν
  choice: memiliki keyakinan
  rationale: Mempertahankan gagasan tentang keadaan memiliki keyakinan tanpa mengembangkannya menjadi sekadar 'alasan' atau 'dasar' untuk yakin.
- source_word: σάρξ
  choice: daging
  rationale: Mempertahankan istilah sumber dan ketegangan teologisnya; dalam konteks ini istilah tersebut menunjuk pada kedudukan serta keunggulan manusia yang lahiriah, bukan terutama pada tabiat berdosa.
- source_word: δοκεῖ
  choice: menganggap dirinya
  rationale: Mengungkapkan arti menyangka atau menilai diri sendiri secara alami dalam bahasa Indonesia.
- source_word: πεποιθέναι
  choice: dapat menaruh keyakinan
  rationale: Menyampaikan keadaan keyakinan yang dianggap dimiliki seseorang dan cocok dengan susunan perbandingan retoris.
- source_word: μᾶλλον
  choice: lebih lagi
  rationale: Mempertahankan perbandingan singkat dan tegas dalam klaim Paulus.
theological_decisions:
- issue: Makna σάρξ dalam Filipi 3:4
  choice: Memakai 'daging' dalam teks utama dan menjelaskan nuansa kontekstualnya dalam catatan kaki.
  alternative: hal-hal lahiriah; kedudukan atau prestasi manusia; tabiat berdosa
  rationale: Ayat-ayat berikutnya merinci sunat, garis keturunan, hubungan dengan Taurat, dan semangat keagamaan. Karena itu, 'daging' di sini terutama berarti dasar keyakinan yang bersumber pada identitas, kedudukan, dan prestasi manusia, tetapi istilah sumber tetap dipertahankan agar jangkauan metaforanya tidak dipersempit secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Ungkapan 'pada daging' sengaja dipertahankan sebagai metafora sumber, dengan catatan kaki untuk membantu pembaca memahami maknanya dalam konteks.
