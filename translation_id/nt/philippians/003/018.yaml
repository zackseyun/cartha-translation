source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: id
  text: Sebab banyak orang menjalani hidup sebagai musuh salib Mesias[a]. Tentang mereka sudah sering kukatakan kepada kalian, dan sekarang pun kukatakan sambil menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.”
    reason: Padanan tradisional bagi gelar Yunani Χριστός; teks utama memakai “Mesias” untuk menyatakan arti gelar itu.
lexical_decisions:
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Kata sifat ini dipakai secara substantival dan menunjuk kepada sejumlah besar orang tanpa nuansa tambahan.
- source_word: γὰρ
  choice: sebab
  rationale: Kata penghubung ini memberi dasar bagi nasihat sebelumnya; “sebab” menyampaikan fungsi penjelasannya secara wajar dalam bahasa Indonesia.
- source_word: περιπατοῦσιν
  choice: menjalani hidup
  rationale: Kata ini digunakan secara metaforis untuk cara hidup. Ungkapan “menjalani hidup” mempertahankan makna metaforisnya dengan lebih jelas dan alami daripada terjemahan harfiah “berjalan” dalam bahasa Indonesia modern.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: sudah sering kukatakan kepada kalian
  rationale: Bentuk imperfek bersama πολλάκις menyatakan tindakan yang berulang pada masa lalu; “sudah sering” mempertahankan aspek pengulangan itu, sedangkan “kalian” menandai bentuk jamak ὑμῖν.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: sekarang pun kukatakan lagi sambil menangis
  rationale: Partisipel kini κλαίων menggambarkan Paulus sedang menangis ketika berbicara. “Sambil menangis” mempertahankan keserentakan tindakan, dan “lagi” wajar karena perkataan sekarang dikontraskan dengan pemberitahuan yang berulang sebelumnya.
- source_word: ἐχθροὺς
  choice: sebagai musuh
  rationale: Bentuk ini menerangkan kedudukan atau cara hidup orang-orang tersebut terhadap salib; “sebagai musuh” membuat hubungan predikatifnya jelas dalam bahasa Indonesia.
- source_word: σταυροῦ
  choice: salib
  rationale: Kata ini menunjuk kepada salib dan kematian melalui penyaliban beserta makna teologisnya; “salib” adalah padanan langsung yang mapan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar dalam frasa “salib Mesias”; “Mesias” menyampaikan arti gelar tersebut secara langsung.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam frasa Paulus yang secara tradisional sering diterjemahkan “Kristus”
  choice: Mesias
  alternative: Kristus
  rationale: Konteks ini tidak mengharuskan pemakaian yang menyerupai nama diri. Karena itu, “Mesias” dipilih untuk mempertahankan makna gelar Χριστός, sementara “Kristus” dicatat sebagai padanan tradisional.
- issue: Hubungan ἐχθροὺς dengan περιπατοῦσιν
  choice: menjalani hidup sebagai musuh
  alternative: menjalani hidup; mereka adalah musuh
  rationale: Bentuk akusatif ἐχθρούς paling wajar dipahami secara predikatif atau apositif terhadap orang-orang yang menjalani hidup tersebut. Terjemahan ini menjaga hubungan erat itu tanpa menambahkan alasan atau bentuk permusuhan yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan Yunani yang panjang dipecah menjadi dua kalimat agar mudah dipahami, tetapi alur sebab, tindakan berulang pada masa lalu, tangisan Paulus saat berbicara, dan penilaian bahwa mereka hidup sebagai musuh salib tetap dipertahankan.
