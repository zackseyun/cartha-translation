  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: id
  text: Waspadalah terhadap anjing-anjing itu; waspadalah terhadap para pekerja jahat; waspadalah terhadap pencacatan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pencacatan itu.” Paulus memakai istilah bernada menghina ini sebagai permainan kata yang dikontraskan dengan “sunat” dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Waspadalah terhadap
  rationale: Imperatif kini ini diulang tiga kali sebagai peringatan yang mendesak. Ungkapan yang sama dipertahankan pada setiap klausa untuk menjaga penekanan dan irama teks Yunani.
- source_word: τοὺς κύνας
  choice: anjing-anjing itu
  rationale: Metafora harfiah yang keras dipertahankan tanpa menambahkan kata sifat penjelas yang tidak terdapat dalam teks sumber.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: para pekerja jahat
  rationale: Terjemahan ini mempertahankan makna moral κακούς dan arti biasa ἐργάτας, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: τὴν κατατομήν
  choice: penyunatan yang mencacatkan itu
  rationale: κατατομή adalah istilah peyoratif yang berarti pemotongan atau pencacatan dan sengaja dipertentangkan dengan περιτομή, 'sunat', pada ayat berikutnya. Rumusan ini menjaga konteks penyunatan sekaligus daya cela dan permainan katanya.
theological_decisions:
- issue: Cara menerjemahkan κατατομήν dalam hubungannya dengan περιτομή pada ayat berikutnya
  choice: penyunatan yang mencacatkan itu
  alternative: pencacatan itu; para pencacat; sunat palsu
  rationale: Paulus memakai istilah tandingan yang merendahkan, bukan kata biasa untuk sunat. Terjemahan utama mempertahankan kaitan dengan praktik sunat dan sengat retorisnya tanpa secara diam-diam menyamakannya dengan istilah netral pada ayat berikut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada mendesak dan polemis. Pengulangan “Waspadalah terhadap” dipertahankan tiga kali. Istilah “anjing-anjing” tidak diperhalus karena kekerasan metafora berasal dari teks sumber.
