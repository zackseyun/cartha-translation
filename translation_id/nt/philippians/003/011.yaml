  text: εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν ⸂τὴν ἐκ⸃ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: id
  text: jika sekiranya aku dapat mencapai kebangkitan dari antara orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “kebangkitan keluar dari antara orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: supaya dengan cara apa pun
  rationale: Dalam kesinambungan kalimat, ungkapan ini menyatakan harapan atau tujuan dengan kerendahan hati serta ketidakpastian mengenai caranya, bukan penyangkalan terhadap janji Allah. Frasa Indonesia ini alami dan mempertahankan nuansa tersebut.
- source_word: καταντήσω
  choice: aku dapat mencapai
  rationale: Subjungtif aoris menggambarkan tercapainya suatu tujuan. 'Dapat mencapai' mempertahankan sifat tentatif ungkapan Yunani dan cocok untuk tujuan eskatologis.
- source_word: εἰς
  choice: mencapai
  rationale: Arah menuju sasaran disampaikan secara idiomatis melalui verba 'mencapai'; menerjemahkan preposisi secara terpisah akan terasa kurang alami dalam bahasa Indonesia.
- source_word: ἐξανάστασιν
  choice: kebangkitan
  rationale: Nomina yang tidak lazim ini menunjuk pada kebangkitan. 'Kebangkitan' menyampaikan makna utamanya dengan jelas tanpa menciptakan istilah Indonesia yang janggal, sedangkan bentuk Yunani yang khas diterangkan dalam catatan kaki.
- source_word: τὴν ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: '''Dari antara orang mati'' secara alami mempertahankan gagasan keluar dari kalangan orang-orang mati dan lebih eksplisit daripada sekadar ''dari kematian''.'
theological_decisions:
- issue: Apakah ἐξανάστασις harus diterjemahkan secara khusus sehingga menyiratkan suatu jenis kebangkitan yang berbeda dari ἀνάστασις yang lebih umum.
  choice: kebangkitan dari antara orang mati
  alternative: kebangkitan keluar dari antara orang mati
  rationale: Teks dengan jelas berbicara tentang kebangkitan dari antara orang mati, tetapi bentuk ἐξανάστασις yang tidak lazim tidak dengan sendirinya menuntut istilah teknis atau suatu doktrin tentang kebangkitan khusus. Terjemahan utama tetap jelas, sedangkan kekhasan bentuknya dipertahankan dalam catatan kaki.
- issue: Apakah εἴ πως menyatakan keraguan Paulus bahwa kebangkitan akan terjadi.
  choice: dengan cara apa pun aku dapat mencapai
  alternative: jika sekiranya aku dapat mencapai
  rationale: Konteks sintaksis mengizinkan nuansa tujuan atau harapan yang tentatif. Pilihan ini menjaga kerendahan hati dan ketidakpastian mengenai jalan atau caranya tanpa memastikan ataupun meniadakan keraguan teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern yang wajar, khidmat, dan mudah dipahami. 'Orang mati' dipakai untuk νεκρῶν agar rujukannya kepada mereka yang mati tetap jelas. Penanda catatan kaki ditempatkan langsung sesudah kalimat.
