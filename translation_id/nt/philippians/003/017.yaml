id: PHP.3.17
reference: Philippians 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: id
  text: Saudara-saudara[a], hendaklah kalian bersama-sama meneladani aku dan perhatikanlah mereka yang hidup demikian, sebagaimana kalian memiliki kami sebagai teladan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai berbentuk jamak maskulin dan secara harfiah dapat berarti “saudara-saudara laki-laki”, tetapi di sini kemungkinan besar menyapa seluruh jemaat, baik laki-laki maupun perempuan.
    reason: cultural_note
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: hendaklah kalian bersama-sama meneladani aku
  rationale: Gabungan nomina Συμμιμηταί dan imperatif γίνεσθε menyerukan peneladanan secara bersama. Ungkapan ini mempertahankan daya kolektifnya dalam bahasa Indonesia yang alami.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini lazim, bermartabat, dan dapat menyapa seluruh jemaat tanpa harus menentukan jenis kelamin setiap orang yang dituju; catatan menjelaskan bentuk Yunani.
- source_word: σκοπεῖτε
  choice: perhatikanlah
  rationale: Imperatif ini meminta perhatian yang cermat dan berkelanjutan. 'Perhatikanlah' menyampaikan makna tersebut secara wajar.
- source_word: οὕτω περιπατοῦντας
  choice: mereka yang hidup demikian
  rationale: περιπατέω dipakai secara metaforis untuk cara hidup. Bahasa Indonesia lebih alami memakai 'hidup' di sini, sementara 'demikian' mempertahankan rujukan οὕτω kepada pola yang telah dibicarakan.
- source_word: τύπον
  choice: teladan
  rationale: Dalam konteks ini τύπος berarti pola atau contoh pribadi yang patut diikuti. 'Teladan' paling jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ἡμᾶς
  choice: kami
  rationale: Bentuk jamak dipertahankan agar Paulus dan rekan-rekannya tidak dilebur menjadi bentuk tunggal.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Gunakan 'Saudara-saudara' dalam teks utama dan jelaskan bentuk Yunani serta cakupan jemaat dalam catatan kaki.
  alternative: Saudara-saudara laki-laki; saudara-saudara seiman laki-laki dan perempuan
  rationale: ἀδελφοί berbentuk jamak maskulin, tetapi dalam konteks surat ini kemungkinan besar menyapa seluruh jemaat. Pilihan dan catatan mempertahankan kedua fakta tanpa mempersempit atau memperluasnya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang hangat dan bermartabat. Pronomina 'kalian' dipilih agar pembedaan antara orang kedua jamak dan 'kami' tetap jelas. Metafora 'berjalan' diterjemahkan secara idiomatis sebagai 'hidup', sedangkan unsur kebersamaan dalam Συμμιμηταί dinyatakan secara eksplisit.
