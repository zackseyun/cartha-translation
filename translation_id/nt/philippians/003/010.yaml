id: PHP.3.10
reference: Philippians 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: id
  text: untuk mengenal Dia dan kuasa kebangkitan-Nya, serta turut mengambil bagian dalam penderitaan-Nya[a], sambil menjadi serupa dengan kematian-Nya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persekutuan dalam penderitaan-Nya” atau “keikutsertaan dalam penderitaan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sambil dijadikan serupa dengan kematian-Nya.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: γνῶναι
  choice: untuk mengenal
  rationale: Infinitif aoris ini menyatakan tujuan dalam kaitannya dengan konteks sebelumnya. “Mengenal” mempertahankan cakupan relasional dan pengalaman tanpa mempersempitnya menjadi sekadar pengetahuan tentang Dia.
- source_word: δύναμιν
  choice: kuasa
  rationale: “Kuasa” merupakan padanan baku dan jelas bagi δύναμις serta menunjuk pada daya efektif yang dinyatakan dalam kebangkitan-Nya.
- source_word: ἀναστάσεως
  choice: kebangkitan
  rationale: “Kebangkitan” adalah istilah Indonesia yang tepat dan lazim bagi peristiwa bangkit dari kematian dalam konteks ini.
- source_word: κοινωνίαν
  choice: turut mengambil bagian dalam
  rationale: Ungkapan ini menyampaikan partisipasi nyata dalam penderitaan Kristus dengan bahasa Indonesia modern dan wajar, bukan sekadar rasa simpati atau kebersamaan yang abstrak.
- source_word: παθημάτων
  choice: penderitaan
  rationale: “Penderitaan” secara langsung mewakili bentuk jamak Yunani secara kolektif dan sesuai dengan pemakaian alami bahasa Indonesia.
- source_word: συμμορφιζόμενος
  choice: sambil menjadi serupa
  rationale: “Sambil” mempertahankan hubungan partisipial dengan tujuan mengenal Kristus, sedangkan “menjadi serupa” menjaga gagasan proses yang sedang berlangsung tanpa menentukan secara tegas apakah bentuk Yunani ini harus dipahami sebagai medial atau pasif.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: dengan kematian-Nya
  rationale: Frasa ini mempertahankan kematian Kristus sebagai pola atau bentuk yang dengannya Paulus menjadi serupa.
theological_decisions:
- issue: Makna κοινωνίαν παθημάτων αὐτοῦ
  choice: Partisipasi nyata dalam penderitaan Kristus
  alternative: Persekutuan dengan penderitaan-Nya dalam arti kebersamaan yang lebih abstrak
  rationale: κοινωνία dalam konstruksi ini secara wajar mencakup keikutsertaan atau partisipasi. Terjemahan tidak membatasi bentuk partisipasi itu menurut suatu sistem doktrinal tertentu.
- issue: Nuansa συμμορφιζόμενος
  choice: Proses menjadi serupa dengan kematian Kristus
  alternative: Dijadikan serupa dengan kematian-Nya
  rationale: Bentuk partisipel kini menunjukkan proses yang berlangsung, sementara bentuk medial/pasifnya tidak perlu dipastikan secara berlebihan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Struktur rangkaian Yunani dipertahankan sejauh tetap alami; “turut mengambil bagian” dipilih agar κοινωνία tidak terdengar hanya sebagai istilah kelembagaan atau kebersamaan yang abstrak.
