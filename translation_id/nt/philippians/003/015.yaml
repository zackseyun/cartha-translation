id: PHP.3.15
reference: Philippians 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: id
  text: Karena itu, hendaklah kita semua yang dewasa[a] berpikir demikian. Jika dalam hal apa pun kalian berpikir lain, hal itu juga akan Allah nyatakan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sempurna.” Kata Yunani yang dipakai dapat berarti “sempurna,” tetapi di sini kemungkinan menunjuk pada kedewasaan rohani.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan merupakan penghubung logis yang alami dalam bahasa Indonesia.
- source_word: ὅσοι
  choice: kita semua yang
  rationale: Menyampaikan cakupan kelompok secara inklusif; orang pertama pada φρονῶμεν menunjukkan bahwa Paulus menyertakan dirinya.
- source_word: τέλειοι
  choice: dewasa
  rationale: Dalam konteks ini menunjuk pada kematangan rohani, sambil tetap mencatat arti leksikal alternatif 'sempurna'.
- source_word: τοῦτο φρονῶμεν
  choice: hendaklah ... berpikir demikian
  rationale: Menyampaikan daya ajakan dari bentuk subjungtif serta menunjuk kembali kepada pola pikir yang baru saja diuraikan.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: Jika dalam hal apa pun kalian berpikir lain
  rationale: Mempertahankan syarat, cakupan terbuka τι, dan perbedaan pola pikir tanpa menentukan pokok perbedaannya.
- source_word: ἀποκαλύψει
  choice: akan ... nyatakan
  rationale: Padanan Indonesia yang wajar bagi tindakan penyingkapan oleh Allah dan tetap mempertahankan nuansa penyataan ilahi.
theological_decisions:
- issue: Makna τέλειοι dalam nasihat Paulus
  choice: dewasa
  alternative: sempurna
  rationale: Konteks sebelumnya menyatakan bahwa Paulus sendiri belum mencapai kesempurnaan; karena itu 'dewasa' paling mungkin dimaksudkan di sini. Alternatif leksikal tetap dicatat agar ketegangan dengan pemakaian kata yang sama dalam konteks tidak hilang.
- issue: Acuan τοῦτο dalam klausa penutup
  choice: hal itu juga
  alternative: pola pikir demikian juga
  rationale: Ungkapan Yunani mempertahankan acuan yang agak terbuka. 'Hal itu juga' tidak membatasi apakah yang akan Allah nyatakan ialah pokok perbedaan atau pola pikir yang benar.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῖν/φρονεῖτε dengan jelas; susunan kalimat tetap alami bagi pembaca umum.
