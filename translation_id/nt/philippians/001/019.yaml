    rationale: “Pertolongan yang diberikan oleh Roh” menafsirkan Roh sebagai pelaku yang memberi pertolongan, sedangkan konstruksi Yunani juga dapat menunjuk pada pemberian Roh. “Pertolongan dari Roh” lebih idiomatis dan tidak memasukkan verba pasif yang tidak ada dalam sumber.
