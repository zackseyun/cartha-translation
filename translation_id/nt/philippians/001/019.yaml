id: PHP.1.19
reference: Philippians 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: id
  text: Sebab aku tahu bahwa hal ini akan berujung pada pembebasanku[a] melalui doa kalian dan pertolongan dari Roh Yesus Sang Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keselamatanku” atau “pembenaran bagiku.”
    reason: alternative_reading
  - marker: b
    text: Atau “pemberian Roh Yesus Sang Mesias.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: οἶδα
  choice: aku tahu
  rationale: Bentuk perfek οἶδα memiliki makna kini dan menyatakan keyakinan Paulus secara alami.
- source_word: τοῦτό
  choice: hal ini
  rationale: Kata tunjuk tunggal ini merujuk secara luas pada keadaan Paulus yang sedang dibicarakan tanpa mempersempit acuannya.
- source_word: ἀποβήσεται
  choice: akan berujung pada
  rationale: Ungkapan ini menyampaikan hasil atau akibat yang akan timbul dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: σωτηρίαν
  choice: pembebasanku
  rationale: Dalam konteks pemenjaraan, kata ini kemungkinan menunjuk pada pembebasan atau pemulihan nama baik Paulus, tetapi gema makna keselamatan tetap dipertahankan dalam catatan kaki.
- source_word: δεήσεως
  choice: doa
  rationale: Padanan yang jelas dan alami untuk permohonan yang ditujukan kepada Allah.
- source_word: ἐπιχορηγίας
  choice: pertolongan yang diberikan
  rationale: Kata ini mengandung gagasan persediaan atau bantuan yang dicurahkan; bentuk verbal ini menghindari frasa nominal Indonesia yang kaku dan tetap membiarkan genitif berikutnya memiliki rentang makna.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Roh Yesus Sang Mesias
  rationale: Genitif Yunani dipertahankan secara langsung sebagai hubungan Roh dengan Yesus, sedangkan Χριστός diterjemahkan sebagai gelar 'Sang Mesias'.
theological_decisions:
- issue: Makna σωτηρίαν dalam konteks pemenjaraan Paulus
  choice: pembebasanku
  alternative: keselamatanku; pembenaran atau pemulihan nama baikku
  rationale: Konteks langsung mendukung pembebasan dari keadaan yang dihadapi Paulus, tetapi istilah Yunani mempunyai cakupan lebih luas; kemungkinan lain dicatat agar ketegangan penafsirannya tidak dihapus.
- issue: Hubungan genitif dalam ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ
  choice: pertolongan yang diberikan oleh Roh Yesus Sang Mesias
  alternative: pemberian Roh Yesus Sang Mesias
  rationale: Genitif dapat dipahami sebagai Roh yang memberikan pertolongan atau sebagai Roh yang diberikan. Teks utama memilih pemahaman instrumental yang sesuai dengan alur kalimat, sementara catatan kaki menjaga kemungkinan genitif objektif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Pronomina 'aku' dan 'kalian' mempertahankan sapaan tunggal-jamak dalam surat tanpa menjadi terlalu formal. Semua penanda catatan kaki ditempatkan langsung pada unsur terkait.
