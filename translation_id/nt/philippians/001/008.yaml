    rationale: “Kasih mesra” dapat bernuansa keintiman khusus dalam pemakaian modern. “Kasih sayang” menyampaikan σπλάγχνοις sebagai afeksi atau belas kasih yang mendalam dengan jangkauan makna yang lebih aman.
