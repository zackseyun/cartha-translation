  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: id
  text: Sebab Allah menjadi saksiku betapa aku merindukan kamu semua dengan kasih sayang Mesias Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus Yesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυς
  choice: saksi
  rationale: Dalam ungkapan sumpah yang khidmat ini, “saksi” secara alami menyatakan bahwa Paulus memanggil Allah sebagai penjamin ketulusan perkataannya.
- source_word: γάρ
  choice: Sebab
  rationale: Menyatakan hubungan penjelasan dengan perkataan Paulus sebelumnya dan sesuai dengan gaya bahasa Indonesia yang bermartabat.
- source_word: ὡς
  choice: betapa
  rationale: Memperkenalkan isi sekaligus kuatnya kerinduan Paulus, bukan sekadar fakta bahwa ia merindukan mereka.
- source_word: ἐπιποθῶ
  choice: aku merindukan
  rationale: Mengungkapkan kerinduan pribadi yang kuat dengan bahasa Indonesia modern dan wajar.
- source_word: πάντας ὑμᾶς
  choice: kamu semua
  rationale: Mempertahankan penekanan πάντας bahwa seluruh jemaat tercakup.
- source_word: σπλάγχνοις
  choice: kasih mesra
  rationale: Secara harfiah menunjuk organ-organ dalam sebagai pusat perasaan; dalam konteks ini ungkapan idiomatis tersebut menyatakan kasih sayang yang dalam dan lembut.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Menerjemahkan Χριστός sebagai gelar “Mesias” dan mempertahankan urutan unsur Yunani.
theological_decisions:
- issue: Makna relasional ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ
  choice: dengan kasih mesra Mesias Yesus
  alternative: dengan belas kasih Mesias Yesus
  rationale: “Kasih mesra” mempertahankan nuansa perasaan mendalam tanpa menentukan apakah ungkapan itu terutama berarti kasih yang bersumber dari, dimiliki oleh, atau dibagikan bersama Mesias Yesus; alternatif “belas kasih” lebih menonjolkan unsur kemurahan hati.
- issue: Penerjemahan Χριστοῦ dalam konstruksi gelar-nama Paulus
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός pada dasarnya adalah gelar dan diterjemahkan sebagai “Mesias”; bentuk tradisional “Kristus Yesus” tetap merupakan padanan yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Allah adalah saksiku” mempertahankan bentuk pernyataan Yunani, sedangkan “betapa” membuat hubungan dengan klausa kerinduan tetap alami. Alternatif leksikal untuk σπλάγχνοις dicatat dalam keputusan penerjemahan, tetapi tidak dijadikan catatan kaki agar teks publikasi tetap ringkas.
