  source_fidelity: 'Makna pokok diterjemahkan dengan setia: γάρ sebagai penjelasan, Allah sebagai saksi, intensitas kerinduan kepada seluruh penerima, serta σπλάγχνοις yang dikaitkan dengan Mesias Yesus. Terjemahan “dengan” cukup mewakili ἐν secara idiomatis, tanpa memaksakan penafsiran atas relasi genitifnya.'
  naturalness: Struktur “Allah adalah saksiku betapa ...” dapat dipahami, tetapi kurang lancar dalam bahasa Indonesia modern karena klausa “betapa” lebih alami sesudah verba seperti “menjadi” dalam ungkapan seruan/sumpah. “Kasih mesra” dapat dipahami, tetapi dalam pemakaian Indonesia modern dapat membawa asosiasi keintiman yang terlalu khusus. “Kasih sayang” lebih luas, wajar, dan sesuai konteks afeksi mendalam.
  terminology: “Saksi,” “merindukan,” “kamu semua,” dan “Mesias Yesus” tepat. Catatan alternatif “Kristus Yesus” mempertahankan bentuk tradisional tanpa menggantikan terjemahan gelar “Mesias.”
