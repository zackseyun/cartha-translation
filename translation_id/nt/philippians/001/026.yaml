id: PHP.1.26
reference: Philippians 1:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: id
  text: supaya melalui kedatanganku kembali kepada kalian, alasan kalian untuk bermegah dalam Mesias Yesus semakin berlimpah karena aku.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebanggaan kalian dalam Mesias Yesus semakin berlimpah.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di dalam aku”; maksudnya dapat dipahami sebagai “karena aku” atau “oleh karena aku”.
    reason: lexical_alternative
  - marker: c
    text: “Mesias Yesus” dapat juga diterjemahkan “Kristus Yesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang mengalir dari pernyataan sebelumnya dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: τὸ καύχημα ὑμῶν
  choice: alasan kalian untuk bermegah
  rationale: καύχημα dapat menunjuk pada dasar atau alasan untuk bermegah, bukan hanya tindakan bermegah. Ungkapan ini mempertahankan nuansa nominal tersebut dan tetap mudah dipahami.
- source_word: περισσεύῃ
  choice: semakin berlimpah
  rationale: Mengungkapkan pertambahan atau kelimpahan yang terkandung dalam verba περισσεύω serta sesuai dengan bentuk tujuan setelah ἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dalam Mesias Yesus
  rationale: Mempertahankan preposisi ἐν dan menerjemahkan Χριστός sebagai gelar bermakna 'Mesias', bukan sekadar transliterasi.
- source_word: ἐν ἐμοὶ
  choice: karena aku
  rationale: Dalam konteks ini frasa tersebut paling wajar menyatakan bahwa Paulus menjadi alasan atau kesempatan bagi kemegahan mereka; arti harfiahnya dicatat dalam catatan kaki.
- source_word: διὰ τῆς ἐμῆς παρουσίας
  choice: melalui kedatanganku
  rationale: διά dengan genitif menyatakan sarana, sedangkan παρουσία dalam konteks kunjungan Paulus menunjuk pada kedatangan yang menghasilkan kehadirannya secara pribadi.
- source_word: πάλιν πρὸς ὑμᾶς
  choice: kembali kepada kalian
  rationale: Menyampaikan kunjungan ulang Paulus dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Χριστός tetap memiliki daya sebagai gelar di sini. 'Mesias' menyampaikan makna gelar itu, sementara bentuk tradisional 'Kristus' dicantumkan sebagai alternatif.
- issue: Hubungan καύχημα dengan ἐν Χριστῷ Ἰησοῦ
  choice: alasan kalian untuk bermegah dalam Mesias Yesus
  alternative: kemegahan kalian semakin berlimpah dalam Mesias Yesus
  rationale: Pilihan utama menghubungkan 'dalam Mesias Yesus' dengan tindakan bermegah, sesuai ungkapan Paulus, tanpa meniadakan kemungkinan hubungan sintaksis alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai surat kepada seluruh jemaat. Susunan frasa sarana ditempatkan di depan agar hubungan antara kedatangan Paulus, alasan untuk bermegah, dan frasa 'karena aku' tetap jelas tanpa menghilangkan ambiguitas sumber.
