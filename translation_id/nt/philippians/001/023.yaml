  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: id
  text: Namun, aku terdesak oleh kedua hal itu; aku ingin pergi[a] dan bersama Mesias[b], sebab itu jauh lebih baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam konteks ini, maksudnya meninggal. Secara harfiah: pergi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: Kristus. Kata Yunani Khristos berarti Yang Diurapi atau Mesias.'
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι
  choice: aku terimpit
  rationale: Kata kerja ini menggambarkan keadaan ditekan atau dihimpit oleh dua hal. “Terimpit” menyampaikan tekanan batin Paulus tanpa mengubahnya menjadi sekadar kebingungan.
- source_word: ἐκ τῶν δύο
  choice: di antara keduanya
  rationale: Dalam konteks ini, frasa tersebut menunjuk pada dua kemungkinan yang menghimpit Paulus. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan rujukan kepada kedua hal yang telah disebutkan.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: aku ingin
  rationale: Ungkapan ini menyampaikan bahwa Paulus mempunyai keinginan tersebut. “Aku ingin” merupakan bentuk Indonesia yang langsung dan wajar, tanpa memperkuat kadar keinginannya melampaui teks.
- source_word: ἀναλῦσαι
  choice: pergi
  rationale: Kata ini secara harfiah berarti berangkat atau pergi dan dalam konteks ini menjadi ungkapan halus untuk kematian. “Pergi” mempertahankan metafora sumber; makna kontekstualnya dijelaskan dalam catatan kaki.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Χριστός pada dasarnya adalah gelar yang berarti Yang Diurapi. “Mesias” mempertahankan fungsi gelar tersebut; padanan tradisional “Kristus” dicantumkan dalam catatan kaki.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: sebab itu jauh lebih baik
  rationale: Ungkapan Yunani memperkuat tingkat perbandingan. “Jauh lebih baik” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Implikasi persekutuan dengan Mesias setelah kematian
  choice: pergi dan bersama dengan Mesias
  alternative: mati dan langsung pergi ke surga untuk bersama Mesias
  rationale: Terjemahan mempertahankan apa yang dinyatakan teks—pergi dan bersama dengan Mesias—tanpa menambahkan urutan waktu, tempat, atau rumusan doktrinal yang tidak disebutkan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. “Terimpit” mempertahankan gambaran tekanan dari dua sisi, sedangkan “pergi” menjaga ungkapan halus teks sumber tanpa menjabarkan doktrin tentang keadaan setelah kematian.
