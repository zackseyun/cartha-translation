id: PHP.1.29
reference: Philippians 1:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: id
  text: Sebab, demi Mesias, kepada kalian telah dianugerahkan bukan hanya untuk percaya kepada dia[a], tetapi juga untuk menderita demi dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaruh kepercayaan kepada dia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menderita karena dia” atau “menderita untuk kepentingannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata ini memperkenalkan alasan atau penjelasan bagi sikap teguh tanpa takut pada ayat sebelumnya.
- source_word: ἐχαρίσθη
  choice: telah dianugerahkan
  rationale: Bentuk ini menyampaikan bahwa hal tersebut diberikan dengan kemurahan sebagai anugerah, bukan sekadar diizinkan, sambil mempertahankan bentuk pasif yang tidak menyebut pelaku secara eksplisit.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: hal ini demi Mesias
  rationale: Artikel netral τὸ membuat frasa ini berfungsi secara substantival dan menaungi dua infinitif berikutnya. 'Hal ini' membuat susunan tersebut wajar dalam bahasa Indonesia, sedangkan 'demi Mesias' mempertahankan hubungan kepentingan atau alasan yang dinyatakan ὑπέρ. Χριστός diterjemahkan sebagai gelar 'Mesias'.
- source_word: πιστεύειν εἰς αὐτόν
  choice: percaya kepada dia
  rationale: Ungkapan ini menyatakan iman yang diarahkan dan dipercayakan kepada pribadi Mesias; 'percaya kepada dia' merupakan padanan Indonesia yang lugas dan alami.
- source_word: πάσχειν
  choice: menderita
  rationale: Infinitif ini menyatakan tindakan mengalami penderitaan secara langsung dan tidak perlu diperhalus.
- source_word: ὑπὲρ αὐτοῦ
  choice: demi dia
  rationale: Dalam konteks penderitaan, ὑπέρ terutama menyatakan penderitaan karena kesetiaan kepada atau demi kepentingan Mesias.
theological_decisions:
- issue: Apakah percaya dan menderita sama-sama tercakup sebagai anugerah
  choice: Mempertahankan keduanya sebagai isi dari apa yang dianugerahkan
  alternative: Melemahkan ἐχαρίσθη menjadi 'diizinkan' atau menyusun kalimat sehingga hanya percaya yang tampak sebagai anugerah
  rationale: Struktur Yunani menempatkan baik percaya kepada Mesias maupun menderita demi dia di bawah verba ἐχαρίσθη. Ketegangan teologis bahwa penderitaan juga dianugerahkan dipertahankan tanpa dijelaskan atau diperhalus.
- issue: Cakupan frasa ὑπὲρ Χριστοῦ
  choice: Menempatkan 'demi Mesias' pada keseluruhan hal yang dianugerahkan
  alternative: 'Membacanya terutama sebagai keterangan bagi tindakan penganugerahan: ''Demi Mesias, kepada kalian telah dianugerahkan ...'''
  rationale: Frasa berartikel τὸ ὑπὲρ Χριστοῦ berfungsi sebagai kepala substantival yang kemudian dijabarkan oleh kedua infinitif. Terjemahan utama menyatakan cakupan luas ini, sementara catatan kaki mempertahankan kemungkinan susunan alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar ὑμῖν tetap jelas sebagai bentuk jamak. 'Dianugerahkan' dipilih untuk menyampaikan nuansa pemberian cuma-cuma dalam ἐχαρίσθη. Kata ganti yang merujuk kepada Mesias ditulis dengan huruf kecil sesuai tata bahasa umum dan tanpa menambahkan kapitalisasi penghormatan yang tidak ditandai dalam teks Yunani.
