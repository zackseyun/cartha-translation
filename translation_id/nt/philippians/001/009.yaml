  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: id
  text: 'Dan inilah yang saya doakan: semoga kasih kalian semakin melimpah dalam pengetahuan dan segala daya membedakan,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala pengertian” atau “segala kepekaan moral.” Ungkapan Yunani “dalam pengetahuan” juga dapat dipahami “dengan pengetahuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: Dan inilah
  rationale: Mempertahankan kata penghubung καί dan daya tunjuk τοῦτο, sekaligus membentuk peralihan yang wajar dari ucapan syukur Paulus kepada isi doanya.
- source_word: προσεύχομαι
  choice: yang saya doakan
  rationale: Bentuk kini Yunani menyatakan doa Paulus yang berlangsung; konstruksi relatif ini alami dalam bahasa Indonesia dan terkait langsung dengan ‘inilah’.
- source_word: ἵνα
  choice: semoga
  rationale: Dalam konteks doa, ‘semoga’ secara alami menyampaikan isi sekaligus nuansa kehendak yang dibawa oleh ἵνα dan bentuk subjungtif berikutnya.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: kasih kalian
  rationale: ‘Kasih’ merupakan padanan baku dan luas bagi ἀγάπη; ‘kalian’ menunjukkan bahwa ὑμῶν berbentuk jamak tanpa menambah tingkat formalitas yang tidak ada dalam bahasa sumber.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ
  choice: semakin melimpah
  rationale: Ungkapan Indonesia ini menyampaikan pertambahan yang terus berlangsung dan citra kelimpahan περισσεύῃ tanpa pengulangan yang terasa kaku.
- source_word: ἐν ἐπιγνώσει
  choice: dalam pengetahuan
  rationale: Mempertahankan struktur preposisional ἐν dan makna luas ἐπίγνωσις tanpa mempersempitnya menjadi pengetahuan teknis atau menguatkannya secara berlebihan menjadi ‘pengetahuan penuh’.
- source_word: πάσῃ αἰσθήσει
  choice: segala pengertian
  rationale: ‘Pengertian’ cukup alami bagi pembaca umum dan dalam konteks ini menunjuk pada kemampuan memahami serta menilai secara praktis atau moral; catatan kaki mempertahankan alternatif ‘daya membedakan’ dan ‘kepekaan moral’.
