  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: id
  text: Aku ingin kalian tahu, Saudara-saudara[a], bahwa apa yang terjadi padaku justru telah menghasilkan kemajuan bagi Kabar Baik[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sapaan Yunani secara harfiah berbentuk “saudara-saudara” dan dalam konteks ini dapat mencakup seluruh jemaat, baik laki-laki maupun perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: Injil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Aku ingin kalian tahu
  rationale: Menyampaikan maksud pribadi Paulus secara alami dalam bahasa Indonesia dan mempertahankan bentuk pemberitahuan epistoler.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan; dalam bahasa Indonesia peralihannya cukup terbaca dari susunan kalimat tanpa perlu menambahkan kata temporal seperti 'sekarang'.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan Indonesia ini alami, bermartabat, dan dapat mencakup seluruh jemaat tanpa menghapus bentuk sapaan kekerabatan dalam bahasa sumber.
- source_word: τὰ κατ’ ἐμὲ
  choice: apa yang terjadi padaku
  rationale: Mengungkapkan secara jelas keadaan atau peristiwa yang dialami Paulus tanpa kekakuan ungkapan harfiah 'hal-hal mengenai aku'.
- source_word: μᾶλλον
  choice: justru
  rationale: 'Menandai hasil yang berlawanan dengan dugaan: keadaan Paulus bukannya menghambat, melainkan memajukan Kabar Baik.'
- source_word: εἰς προκοπὴν ... ἐλήλυθεν
  choice: telah membuat ... semakin maju
  rationale: Mencerminkan konstruksi 'telah menghasilkan kemajuan' dan aspek perfektum, yaitu akibat masa lalu yang tetap nyata, dengan bahasa Indonesia yang wajar.
- source_word: τοῦ εὐαγγελίου
  choice: Kabar Baik
  rationale: Menerjemahkan makna leksikal εὐαγγέλιον secara transparan dan mudah dipahami; istilah tradisional 'Injil' dicatat sebagai alternatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan pronomina orang pertama tunggal 'aku' dan orang kedua jamak 'kalian', sesuai nada surat pribadi kepada jemaat. 'Justru' mempertahankan unsur hasil yang tidak terduga, sedangkan 'semakin maju' menghasilkan ungkapan yang alami dan bermartabat.
