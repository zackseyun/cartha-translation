  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: id
  text: Tetapi, jika aku tetap hidup dalam tubuh[a], itu berarti pekerjaanku menghasilkan buah bagiku[b]—mana yang akan kupilih, aku tidak tahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam daging.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “buah pekerjaan”; dapat juga diterjemahkan “pekerjaan yang berbuah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: tetap hidup
  rationale: Infinitif berartikel ini menunjuk pada kelanjutan hidup Paulus dalam keadaan sekarang; “tetap hidup” menyampaikan aspek berkelanjutan itu secara alami.
- source_word: ἐν σαρκί
  choice: secara jasmani
  rationale: Dalam konteks pertentangan dengan pergi dan bersama Kristus, frasa ini menunjuk pada kehidupan fisik di dunia, bukan pada kecenderungan berdosa. “Secara jasmani” alami dalam bahasa Indonesia dan tidak mengaburkan maknanya dengan idiom moral.
- source_word: καρπὸς ἔργου
  choice: pekerjaan yang berbuah
  rationale: Ungkapan Yunani ini padat dan secara harfiah berbunyi “buah pekerjaan.” Pilihan ini mempertahankan gambaran buah sekaligus menyatakan pekerjaan yang menghasilkan sesuatu.
- source_word: αἱρήσομαι
  choice: akan kupilih
  rationale: Bentuk ini menyatakan pilihan di antara dua kemungkinan yang dibicarakan Paulus.
- source_word: οὐ γνωρίζω
  choice: aku tidak tahu
  rationale: Dalam konteks ini γνωρίζω menyatakan ketidakpastian Paulus, bukan tindakan memberitahukan sesuatu.
theological_decisions:
- issue: Makna σάρξ dalam ayat ini
  choice: kehidupan jasmani di dunia
  alternative: tabiat berdosa
  rationale: Konteks membandingkan kelanjutan hidup dengan kepergian untuk bersama Kristus. Karena itu, σάρξ di sini mengacu pada keberadaan fisik, bukan kerusakan moral.
- issue: Hubungan sintaksis antara tetap hidup dan καρπὸς ἔργου
  choice: tetap hidup berarti pekerjaan yang berbuah bagi Paulus
  alternative: tetap hidup merupakan buah atau hasil dari pekerjaan
  rationale: Susunan Yunani sangat padat dan memungkinkan lebih dari satu cara penguraian. Teks utama mengikuti pengertian kontekstual yang paling wajar tanpa menghilangkan ungkapan buah; catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Tanda pisah mempertahankan peralihan mendadak dalam kalimat Yunani, sedangkan susunan “mana yang akan kupilih, aku tidak tahu” menjaga penekanan dan ketegangan teks sumber.
