id: PHP.1.1
reference: Philippians 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: id
  text: 'Paulus dan Timotius, budak-budak[b] Mesias Yesus[a], kepada semua orang kudus dalam Mesias Yesus yang berada di Filipi, bersama para penilik[c] dan diaken:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus Yesus.” Gelar Yunani Χριστός dapat diterjemahkan “Mesias” atau dialihaksarakan menurut bentuk yang sudah lazim, “Kristus.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “hamba-hamba.” Kata Yunaninya menunjuk pada orang yang terikat dan berada di bawah kuasa seorang tuan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “uskup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: budak-budak
  rationale: Kata Yunani ini menyatakan orang yang berada di bawah kepemilikan dan kuasa seorang tuan. “Budak-budak” mempertahankan kuatnya ikatan tersebut, sedangkan “hamba-hamba” dapat terdengar sekadar sebagai pelayan sukarela.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός pada asalnya merupakan gelar, bukan nama diri. “Mesias” mempertahankan makna gelarnya dalam bahasa Indonesia.
- source_word: ἁγίοις
  choice: orang kudus
  rationale: “Orang kudus” merupakan padanan alami dan mapan yang mempertahankan identitas kekudusan umat yang disapa Paulus.
- source_word: ἐν
  choice: dalam
  rationale: “Dalam” mempertahankan ungkapan Paulus tentang keberadaan atau persatuan dalam Mesias, tanpa meleburkannya menjadi parafrasa.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: yang berada di Filipi
  rationale: Klausa relatif ini alami dalam bahasa Indonesia dan tetap menyatakan lokasi para penerima secara eksplisit.
- source_word: σὺν
  choice: bersama
  rationale: “Bersama” menyatakan hubungan penyertaan yang terdapat dalam kata Yunani.
- source_word: ἐπισκόποις
  choice: penilik
  rationale: “Penilik” menerjemahkan fungsi dasar kata Yunani secara transparan tanpa dengan sendirinya memasukkan perkembangan jabatan gerejawi pada masa kemudian.
- source_word: διακόνοις
  choice: diaken
  rationale: Karena dipasangkan dengan para penilik dalam sapaan jemaat, kata ini kemungkinan menunjuk pada peranan pelayanan yang telah dikenal; “diaken” adalah padanan Indonesia yang paling jelas.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: kepada semua orang kudus
  rationale: Padanan ini mempertahankan bentuk sapaan dan cakupan “semua” dengan ringkas dan alami.
theological_decisions:
- issue: Penerjemahan Χριστός dalam rumus sapaan Paulus
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: “Mesias” mempertahankan fungsi Χριστός sebagai gelar. Bentuk tradisional “Kristus Yesus” tetap dicatat sebagai kemungkinan terjemahan.
- issue: Penerjemahan δοῦλοι dalam Filipi 1:1
  choice: budak-budak
  alternative: hamba-hamba
  rationale: Pilihan utama mempertahankan status terikat dan berada di bawah kuasa tuan yang terkandung dalam δοῦλοι. Alternatif yang lebih halus dicatat tanpa menggantikan daya ungkap teks sumber.
- issue: Penerjemahan ἐπισκόποις
  choice: penilik
  alternative: uskup
  rationale: “Penilik” menyampaikan makna kata Yunani tanpa memastikan bahwa struktur jabatan pada masa kemudian sudah sepenuhnya dimaksudkan di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sapaan surat dipertahankan, termasuk tanda titik dua pada akhir ayat. Penanda catatan kaki ditempatkan pada istilah yang diterangkannya; karena itu urutannya dalam kalimat mengikuti letak istilah sumber, bukan urutan alfabet.
