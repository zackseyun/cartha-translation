  text: τὸν αὐτὸν ἀγῶνα ἔχοντες οἷον εἴδετε ἐν ἐμοὶ καὶ νῦν ἀκούετε ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/030.yaml
  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: id
  text: Sebab, kalian menghadapi pergumulan yang sama seperti yang kalian lihat kuhadapi dan yang sekarang kalian dengar masih kuhadapi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: pergumulan
  rationale: Kata ini menunjuk pada perjuangan atau konflik yang berat; “pergumulan” alami dalam bahasa Indonesia dan sesuai dengan konteks penderitaan demi Injil.
- source_word: ἔχοντες
  choice: menghadapi
  rationale: 'Secara harfiah berarti “memiliki,” tetapi bersama ἀγῶνα maknanya idiomatis: sedang menjalani atau menghadapi pergumulan.'
- source_word: ἐν ἐμοί
  choice: kuhadapi
  rationale: Ungkapan ini secara harfiah “dalam diriku/padaku,” tetapi dalam kedua klausa merujuk pada pergumulan yang dialami Paulus; pengulangan “kuhadapi” membuat hubungan itu jelas tanpa mengubah acuannya.
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan kontras waktu antara apa yang dahulu mereka lihat dan apa yang kini mereka dengar.
theological_decisions:
- issue: Keberlanjutan pergumulan Paulus dalam klausa terakhir
  choice: “yang sekarang kalian dengar masih kuhadapi”
  alternative: “yang sekarang kalian dengar ada padaku”
  rationale: Kata “masih” tidak berdiri sebagai leksem tersendiri dalam bahasa Yunani, tetapi secara wajar tersirat oleh kontras antara dahulu melihat dan sekarang mendengar tentang pergumulan yang sama. Pilihan ini mempertahankan keberlanjutan tanpa menentukan secara lebih khusus bentuk penderitaannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” dipakai karena sapaan Yunani berbentuk jamak. Ayat ini merupakan kelanjutan sintaksis dari ayat 29, sehingga “Sebab” menandai hubungannya dengan konteks sebelumnya.
