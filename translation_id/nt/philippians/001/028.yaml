  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: id
  text: dan dalam hal apa pun tidak gentar sedikit pun terhadap orang-orang yang menentang kalian[a]. Hal ini merupakan tanda kebinasaan bagi mereka, tetapi keselamatan bagi kalian[b]—dan hal ini berasal dari Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak takut sedikit pun terhadap orang-orang yang menentang kalian” atau “tidak terintimidasi oleh orang-orang yang menentang kalian.”'
    reason: lexical_alternative
  - marker: b
    text: Kata “tanda” juga dapat diterjemahkan “bukti” atau “petunjuk.”
    reason: lexical_alternative
  - marker: c
    text: “Hal ini” mungkin menunjuk secara khusus kepada keselamatan kalian atau secara lebih luas kepada seluruh tanda yang baru disebutkan.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: gentar
  rationale: Kata kerja ini menyatakan keadaan terkejut, takut, atau terintimidasi. "Tidak gentar" alami dalam bahasa Indonesia dan sesuai dengan konteks keteguhan saat menghadapi perlawanan.
- source_word: ἐν μηδενί
  choice: dalam hal apa pun
  rationale: Ungkapan ini bersifat menyeluruh, yakni "dalam hal apa pun" atau "sama sekali tidak"; pilihan ini dekat dengan bentuk Yunani sekaligus jelas.
- source_word: ὑπὸ τῶν ἀντικειμένων
  choice: menghadapi orang-orang yang menentang kalian
  rationale: Partisip ini menunjuk kepada orang-orang yang sedang menentang jemaat. "Menghadapi" mengungkapkan hubungan dengan sumber ancaman secara alami tanpa mengubah pelakunya.
- source_word: ἔνδειξις
  choice: tanda
  rationale: Kata ini berarti tanda, bukti, atau petunjuk yang menunjukkan suatu kenyataan. "Tanda" ringkas, mudah dipahami, dan mempertahankan daya evidensialnya.
- source_word: ἀπωλείας
  choice: bahwa mereka akan binasa
  rationale: Nomina ini menunjuk kepada kebinasaan atau kehancuran. Bentuk klausa membuat hubungan kontras dengan keselamatan lebih alami dalam bahasa Indonesia tanpa menentukan lebih jauh sifat kebinasaan itu.
- source_word: σωτηρίας
  choice: bahwa kalian akan diselamatkan
  rationale: Istilah ini mengandung bobot keselamatan dari Allah. Bentuk verbal pasif alami dalam konteks ini dan mengimbangi klausa "mereka akan binasa".
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: dan hal ini berasal dari Allah
  rationale: Demonstrativa dipertahankan secara eksplisit, sedangkan "berasal dari" mengungkapkan sumber. Acuan "hal ini" tetap cukup luas agar ambiguitas teks tidak diselesaikan secara paksa.
theological_decisions:
- issue: Acuan τοῦτο ("hal ini")
  choice: 'Dibiarkan luas: "dan hal ini berasal dari Allah."'
  alternative: '"Hal ini" dapat menunjuk khusus kepada keselamatan jemaat atau lebih luas kepada tanda yang tampak dalam keteguhan mereka dan nasib kedua kelompok.'
  rationale: Susunan Yunani memungkinkan lebih dari satu acuan. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan kaki menjelaskannya tanpa menetapkan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak "kalian" dipakai untuk menyatakan bahwa ὑμῶν merujuk kepada jemaat secara kolektif. Struktur nominal Yunani diubah menjadi klausa verbal agar kontras antara kebinasaan dan keselamatan terbaca alami, sementara ambiguitas acuan τοῦτο dipertahankan.
