  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: id
  text: Namun, tetap hidup dalam tubuh ini lebih perlu demi kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tetap tinggal dalam daging”; maksudnya, terus hidup dalam keadaan jasmani.
    reason: Menunjukkan ungkapan Yunani yang harfiah sambil menjelaskan bahwa “daging” di sini menunjuk kehidupan berjasad, bukan sifat berdosa.
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: tetap hidup
  rationale: Infinitif berartikel ini berfungsi sebagai nomina. Dalam konteks pertentangan dengan pergi dan bersama Kristus, ungkapan ini berarti melanjutkan kehidupan sekarang.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan dengan keinginan Paulus untuk pergi dan bersama Kristus pada ayat sebelumnya.
- source_word: ἐν τῇ σαρκὶ
  choice: secara jasmani
  rationale: Frasa ini menunjuk pada keberadaan jasmani dalam kehidupan sekarang, bukan pada makna moral seperti tabiat berdosa. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur jasmani.
- source_word: ἀναγκαιότερον
  choice: lebih perlu
  rationale: Bentuk komparatif Yunani dipertahankan secara langsung dan wajar.
- source_word: δι’ ὑμᾶς
  choice: demi kalian
  rationale: Ungkapan ini menyampaikan bahwa kelanjutan hidup Paulus adalah untuk kepentingan atau manfaat para penerima surat.
theological_decisions:
- issue: Makna σάρξ dalam ayat ini
  choice: kehidupan jasmani sekarang ('secara jasmani')
  alternative: makna moral ('tabiat berdosa') atau parafrasa penuh ('di dunia ini')
  rationale: Konteksnya mempertentangkan pergi untuk bersama Kristus dengan kelanjutan hidup Paulus yang berjasad demi jemaat Filipi. Makna moral tidak didukung oleh konteks langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kalian' dipakai untuk menandai bentuk jamak ὑμᾶς; 'lebih perlu' mempertahankan perbandingan dalam teks Yunani.
