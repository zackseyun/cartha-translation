  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: id
  text: Dan karena aku yakin akan hal ini, aku tahu bahwa aku akan tetap tinggal dan terus bersama kamu semua demi kemajuan dan sukacita kamu dalam iman,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sukacita kamu yang berkaitan dengan iman” atau “sukacita kamu yang berasal dari iman.”
    reason: Frasa genitif Yunani χαρὰν τῆς πίστεως dapat menyatakan sukacita yang berkaitan dengan iman atau sukacita yang berasal dari iman.
lexical_decisions:
- source_word: πεποιθὼς
  choice: yakin
  rationale: Partisip perfek ini menyatakan keadaan keyakinan yang sudah mantap. Ungkapan “yakin” alami dalam bahasa Indonesia dan tidak menambahkan unsur emosional.
- source_word: μενῶ
  choice: akan tetap hidup
  rationale: Dalam konteks pertentangan Paulus antara mati dan tetap berada bersama jemaat (ayat 20–24), ungkapan ini menyampaikan bahwa ia akan terus hidup. Pilihan ini juga membedakannya secara alami dari παραμενῶ.
- source_word: παραμενῶ
  choice: terus bersama
  rationale: Kata kerja majemuk ini menyiratkan kelanjutan keberadaan Paulus di sisi mereka. “Terus bersama” mempertahankan nuansa relasionalnya dan tidak sekadar mengulang μενῶ.
- source_word: πᾶσιν ὑμῖν
  choice: bersama kamu semua
  rationale: Bentuk datifnya menyatakan hubungan dengan παραμενῶ, sedangkan πᾶσιν ditegaskan melalui “semua”.
- source_word: προκοπὴν
  choice: kemajuan
  rationale: Kata ini menunjuk pada gerak maju atau perkembangan. “Kemajuan” jelas, ringkas, dan sesuai untuk pertumbuhan dalam kehidupan beriman.
- source_word: χαρὰν τῆς πίστεως
  choice: sukacita kamu dalam iman
  rationale: Frasa genitif Yunani ini dapat dipahami dengan beberapa nuansa. “Dalam iman” alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi hubungan sebab-akibat saja.
- source_word: πίστεως
  choice: iman
  rationale: Dalam konteks ini πίστις paling wajar menunjuk pada iman atau kehidupan percaya jemaat, bukan terutama kesetiaan.
theological_decisions:
- issue: Makna genitif dalam χαρὰν τῆς πίστεως
  choice: sukacita kamu dalam iman
  alternative: sukacita iman kamu; sukacita kamu yang berasal dari iman
  rationale: Konstruksi Yunani memungkinkan hubungan yang luas antara sukacita dan iman. Teks utama memakai ungkapan Indonesia yang alami tanpa memastikan bahwa iman semata-mata merupakan sumber sukacita; kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi dan bermartabat. Kata ganti “aku” dan “kamu” mempertahankan kedekatan surat Paulus kepada jemaat. Struktur dua verba dipertahankan sebagai “tetap hidup dan terus bersama” agar perbedaan μενῶ dan παραμενῶ tetap terasa tanpa menghasilkan pengulangan yang kaku.
