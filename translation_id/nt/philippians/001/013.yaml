  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: id
  text: Akibatnya, belengguku karena Mesias[a] telah menjadi jelas bagi seluruh pasukan pengawal kekaisaran[b] dan bagi semua orang lainnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belengguku dalam Mesias”.
    reason: alternative_reading
  - marker: b
    text: Atau “di seluruh praetorium”. Istilah ini dapat menunjuk pada pasukan pengawal kekaisaran atau pada markas maupun kediaman kekaisaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Akibatnya
  rationale: Menandai hasil dari hal yang dinyatakan sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: τοὺς δεσμούς μου
  choice: belengguku
  rationale: Mempertahankan gambaran konkret tentang rantai atau belenggu Paulus, yang secara metonimis menunjuk pada pemenjaraannya.
- source_word: φανεροὺς ... γενέσθαι
  choice: telah diketahui
  rationale: Menyampaikan bahwa keadaan dan makna belenggu Paulus telah menjadi pengetahuan umum.
- source_word: ἐν Χριστῷ
  choice: berkaitan dengan Mesias
  rationale: Ungkapan ini mempertahankan hubungan erat antara belenggu Paulus dan Mesias tanpa memaksakan hanya makna sebab atau hanya makna persatuan rohani.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός menurut maknanya, bukan sekadar mentransliterasikannya sebagai nama.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: di seluruh pasukan pengawal kekaisaran
  rationale: Dalam konteks ini πραιτώριον kemungkinan menunjuk pada pasukan atau lingkungan pengawal kekaisaran; alternatif lokasi atau markas dipertahankan dalam catatan kaki.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: di antara semua orang lainnya
  rationale: Mempertahankan perluasan cakupan dari praetorium kepada semua pihak lain.
theological_decisions:
- issue: Hubungan ἐν Χριστῷ dengan belenggu Paulus
  choice: belengguku berkaitan dengan Mesias
  alternative: aku dibelenggu karena Mesias; atau belengguku dalam Mesias
  rationale: Frasa Yunani dapat menandai alasan dan identitas pemenjaraan Paulus atau lingkup persatuannya dengan Mesias. Rumusan utama menjaga hubungan itu tanpa menutup ambiguitas yang asli, sementara catatan kaki menyajikan dua kemungkinan yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan kalimat diatur agar cakupan tempat dan kelompok terdengar alami, sedangkan metafora “belenggu” serta ambiguitas ἐν Χριστῷ tetap dipertahankan.
