  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: id
  text: Namun, yang lain memberitakan Mesias karena ambisi egois, bukan dengan tulus, karena mereka mengira bahwa mereka akan menimbulkan kesusahan bagi saya dalam penahanan saya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagi belenggu-belengguku”; maksudnya, bagi saya dalam keadaan dipenjarakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: ambisi mementingkan diri sendiri
  rationale: Istilah ini menunjuk pada ambisi yang mencari kepentingan sendiri dan bernuansa persaingan atau kepartaian, bukan sekadar sifat egois secara umum.
- source_word: Χριστόν
  choice: Mesias
  rationale: Dalam konteks isi pemberitaan, Χριστός berfungsi jelas sebagai gelar bagi Yesus.
- source_word: καταγγέλλουσιν
  choice: memberitakan
  rationale: Pilihan ini menyampaikan tindakan mengumumkan secara terbuka tanpa membatasinya pada khotbah formal.
- source_word: οὐχ ἁγνῶς
  choice: bukan dengan niat yang murni
  rationale: ἁγνῶς secara harfiah berkaitan dengan kemurnian; dalam konteks ini kemurnian yang dimaksud ialah kemurnian motif.
- source_word: οἰόμενοι
  choice: karena mereka menyangka
  rationale: Partisip ini menyatakan anggapan sekaligus motif yang melatarbelakangi tindakan mereka.
- source_word: θλῖψιν ἐγείρειν
  choice: menambah kesusahan
  rationale: Ungkapan ini secara harfiah berarti membangkitkan atau menimbulkan kesusahan; 'menambah kesusahan' alami dalam konteks upaya memperberat keadaan Paulus.
- source_word: τοῖς δεσμοῖς μου
  choice: dalam pemenjaraanku
  rationale: δεσμοί secara harfiah berarti belenggu atau rantai, tetapi di sini dipakai secara metonimis untuk keadaan dipenjara.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Karena yang dibicarakan ialah pribadi dan identitas yang diberitakan, fungsi gelar 'Mesias' menonjol; 'Kristus' tetap merupakan padanan tradisional yang mungkin.
- issue: Hubungan θλῖψις dengan belenggu Paulus
  choice: menambah kesusahan dalam pemenjaraanku
  alternative: menimbulkan kesusahan bagi belenggu-belengguku
  rationale: Datif τοῖς δεσμοῖς μου dapat dipahami sebagai kesusahan yang ditambahkan kepada keadaan Paulus sebagai tahanan. Terjemahan ini mempertahankan kaitannya dengan pemenjaraan tanpa memakai ungkapan Indonesia yang tidak alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kontras serta motif para pemberita. 'Niat yang murni' dipilih daripada hanya 'tulus' untuk menjaga citra leksikal ἁγνῶς, sedangkan istilah harfiah 'belenggu' dipertahankan dalam catatan kaki.
