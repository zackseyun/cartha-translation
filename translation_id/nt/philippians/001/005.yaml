id: PHP.1.5
reference: Philippians 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: id
  text: karena persekutuan kalian dalam Injil sejak hari pertama sampai sekarang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi Injil.” Frasa Yunani ini dapat menyatakan ranah partisipasi bersama mereka ataupun tujuan partisipasi itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: karena persekutuan kalian
  rationale: ἐπί dengan datif menyatakan dasar atau sebab ucapan syukur Paulus dalam kalimat sekitarnya. κοινωνία menunjuk pada keterlibatan bersama yang nyata; “persekutuan” mempertahankan dimensi relasional dan partisipatifnya, sedangkan “kalian” secara jelas menyatakan bentuk jamak ὑμῶν.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: dalam Injil
  rationale: Frasa ini dapat menunjukkan ranah partisipasi bersama mereka, meskipun arah atau tujuannya juga mungkin. “Dalam Injil” mempertahankan hubungan erat antara κοινωνία dan εὐαγγέλιον tanpa mempersempitnya menjadi dukungan keuangan saja.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: sejak hari pertama
  rationale: Frasa ini menandai titik awal partisipasi jemaat Filipi; “sejak” alami dalam bahasa Indonesia ketika keadaan itu berlanjut hingga kini.
- source_word: ἄχρι τοῦ νῦν
  choice: sampai sekarang
  rationale: Ungkapan ini menyatakan kelanjutan hingga saat Paulus menulis dan diterjemahkan secara alami sebagai “sampai sekarang”.
theological_decisions:
- issue: Makna εἰς dalam εἰς τὸ εὐαγγέλιον
  choice: dalam Injil
  alternative: demi Injil
  rationale: Bahasa Yunani dapat menyatakan ranah partisipasi bersama atau tujuan yang dituju. Teks utama memakai pembacaan ranah, sedangkan catatan kaki mempertahankan kemungkinan tujuan tanpa memutuskan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Kalian” dipakai untuk memperlihatkan bahwa ὑμῶν berbentuk jamak; “Injil” dipertahankan sebagai istilah Paulus yang mapan. Fragmen ayat mengikuti struktur sintaksis ayat 3–5 dan karena itu diawali dengan “karena”.
