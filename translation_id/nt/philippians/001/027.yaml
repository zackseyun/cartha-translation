  to: Hanya, hendaklah kalian hidup dengan cara yang layak bagi Injil Kristus,[a] supaya, baik aku datang dan melihat kalian maupun aku tidak hadir, aku mendengar mengenai kalian bahwa kalian berdiri teguh dalam satu roh,[b] sehati[c] berjuang bersama-sama demi iman yang berkaitan dengan Injil,[d]
