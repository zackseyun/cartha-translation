id: PHP.1.27
reference: Philippians 1:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: id
  text: Hanya, hendaklah kalian hidup dengan cara yang layak bagi Injil Kristus,[a] supaya, baik aku datang dan melihat kalian maupun aku tidak hadir, aku mendengar mengenai kalian bahwa kalian berdiri teguh dalam satu roh,[b] sehati[c] berjuang bersama-sama demi iman yang berkaitan dengan Injil,[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “hidup” memiliki nuansa menjalani kehidupan sebagai warga negara.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam satu Roh”; ini dapat merujuk kepada Roh Kudus.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “dengan satu jiwa.”
    reason: lexical_alternative
  - marker: d
    text: Atau “berjuang bersama-sama demi iman kepada Injil.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Hanya saja
  rationale: Menjaga penekanan pembuka sebagai satu pokok utama, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἀξίως
  choice: dengan cara yang layak bagi
  rationale: Mengungkapkan fungsi adverbialnya sebagai cara hidup yang sepadan dengan tuntutan Injil.
- source_word: πολιτεύεσθε
  choice: hendaklah kalian hidup
  rationale: Ungkapan ini alami dan mencakup perilaku hidup; nuansa kewargaan yang melekat pada verba Yunani dipertahankan dalam catatan kaki.
- source_word: εὐαγγελίου
  choice: Injil
  rationale: Istilah baku dan mudah dipahami untuk kabar baik dalam pemakaian Paulus.
- source_word: Χριστοῦ
  choice: Kristus
  rationale: Padanan Indonesia yang mapan bagi gelar Χριστός dan sesuai dengan konstruksi 'Injil Kristus'.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: aku mendengar tentang kalian
  rationale: Menyampaikan idiom Yunani secara alami tanpa menambah gagasan 'berita' yang tidak dinyatakan secara eksplisit.
- source_word: στήκετε
  choice: kalian berdiri teguh
  rationale: Mempertahankan citra berdiri serta makna ketabahan.
- source_word: ἐν ἑνὶ πνεύματι
  choice: dalam satu roh
  rationale: Menjaga ambiguitas antara kesatuan roh/sikap manusia dan kemungkinan rujukan kepada Roh Kudus.
- source_word: μιᾷ ψυχῇ
  choice: sehati
  rationale: Ungkapan Indonesia yang alami untuk kesatuan batin dan tekad, tanpa membatasinya pada ranah intelektual saja.
- source_word: συναθλοῦντες
  choice: berjuang bersama-sama
  rationale: Mempertahankan unsur perjuangan kolektif dalam verba yang bercitra pertandingan.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: demi iman yang bersumber dari Injil
  rationale: Memberikan bacaan utama yang alami atas konstruksi datif dan genitif, sementara kemungkinan 'iman kepada Injil' dicatat agar hubungan sintaksis tidak dipastikan secara berlebihan.
theological_decisions:
- issue: Apakah πνεύματι menunjuk kepada roh/sikap bersama atau Roh Kudus
  choice: dalam satu roh
  alternative: dalam satu Roh
  rationale: Paralelnya dengan 'sehati' mendukung kesatuan batin komunitas, tetapi bentuk Yunani tetap memungkinkan rujukan kepada Roh Kudus; ambiguitas dinyatakan dalam catatan.
- issue: Hubungan genitif dalam τῇ πίστει τοῦ εὐαγγελίου
  choice: iman yang bersumber dari Injil
  alternative: iman kepada Injil
  rationale: Genitif dapat menggambarkan iman yang dihasilkan atau ditentukan oleh Injil, tetapi dapat pula dipahami sebagai iman kepada berita Injil; catatan mempertahankan pilihan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa nasihat ditujukan kepada seluruh jemaat. Struktur kalimat mempertahankan alur panjang teks Yunani dan koma akhir karena ayat berlanjut ke ayat berikutnya.
