  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: id
  text: 'Aku sangat yakin akan hal ini: Dia yang telah memulai pekerjaan yang baik di antara kalian[a] akan menyelesaikannya sampai pada hari Mesias Yesus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam diri kalian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “Kristus Yesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: Aku yakin akan hal ini
  rationale: Partisipel ini menyatakan keyakinan Paulus dan, dalam konteks kalimat, wajar diungkapkan sebagai klausa orang pertama. αὐτὸ τοῦτο memberi penegasan pada hal yang diyakininya.
- source_word: ὁ ἐναρξάμενος
  choice: Dia yang telah memulai
  rationale: Bentuk partisipel substantival menunjuk kepada pelaku personal, yang dalam konteks dipahami sebagai Allah, tanpa perlu menambahkan nama-Nya ke dalam teks.
- source_word: ἐν ὑμῖν
  choice: di tengah-tengah kalian
  rationale: Pronomina jamak dan konteks surat kepada jemaat mendukung nuansa komunal. Kemungkinan makna 'dalam diri kalian' tetap dicatat dalam catatan kaki.
- source_word: ἔργον ἀγαθὸν
  choice: suatu pekerjaan baik
  rationale: Terjemahan langsung yang tidak menentukan lebih jauh jenis pekerjaan yang dimaksud.
- source_word: ἐπιτελέσει
  choice: akan menyelesaikannya
  rationale: Kata kerja ini menyatakan bahwa pekerjaan tersebut akan dibawa hingga selesai; akhiran -nya mengacu secara alami kepada pekerjaan baik itu.
- source_word: ἄχρι ἡμέρας
  choice: sampai hari
  rationale: ἄχρι menandai batas waktu dan paling langsung diterjemahkan 'sampai', tanpa menggantinya dengan 'pada' yang dapat mempersempit hubungan temporalnya.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan menurut maknanya, 'Mesias'; bentuk tradisional 'Kristus Yesus' dicatat sebagai alternatif.
theological_decisions:
- issue: Apakah pekerjaan Allah digambarkan terutama sebagai pekerjaan dalam individu atau di tengah jemaat secara kolektif
  choice: di tengah-tengah kalian
  alternative: dalam diri kalian
  rationale: Bentuk ὑμῖν adalah jamak dan sapaan surat bersifat komunal. Pilihan utama mempertahankan lingkup jemaat tanpa meniadakan penerapan pada setiap anggotanya.
- issue: Apakah ἄχρι ἡμέρας menyatakan proses yang berlangsung sampai hari itu atau penyelesaian tepat pada hari itu
  choice: sampai hari Mesias Yesus
  alternative: pada hari Mesias Yesus
  rationale: Terjemahan 'sampai' mempertahankan nilai temporal ἄχρι dan tidak secara diam-diam memastikan apakah penyelesaian terjadi secara bertahap hingga hari itu atau mencapai puncaknya pada hari itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena ὑμῖν berbentuk jamak; 'di tengah-tengah kalian' menjaga dimensi komunal. Struktur kalimat dibuat alami tanpa menghilangkan penegasan dan ketegangan temporal dalam teks Yunani.
