  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: id
  text: Sebab bagiku, hidup adalah Kristus[a] dan mati adalah keuntungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: bagiku
  rationale: Bentuk datif ini menyatakan sudut pandang pribadi Paulus. “Bagiku” alami dalam bahasa Indonesia dan mempertahankan penekanan personalnya.
- source_word: γὰρ
  choice: Sebab
  rationale: Partikel ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya. “Sebab” ringkas dan menjaga alur argumentasi.
- source_word: τὸ ζῆν
  choice: hidup
  rationale: Infinitif berartikel ini berfungsi sebagai nomina. “Hidup” paling alami dan tetap mempertahankan kesejajaran padat dengan “mati”.
- source_word: Χριστὸς
  choice: Kristus
  rationale: Χριστός dapat berfungsi sebagai gelar maupun sebutan yang menyerupai nama dalam tulisan Paulus. “Kristus” merupakan padanan baku dan alami dalam bahasa Indonesia; dalam konteks ini tidak diperlukan catatan alternatif karena “Mesias” dan “Kristus” secara leksikal merujuk pada gelar yang sama, tetapi bentuk “Kristus” paling sesuai dengan pemakaian Paulus yang mapan.
- source_word: τὸ ἀποθανεῖν
  choice: mati
  rationale: Seperti τὸ ζῆν, infinitif berartikel ini berfungsi secara substantival. “Mati” menjaga susunan yang ringkas dan sejajar dengan “hidup”.
- source_word: κέρδος
  choice: keuntungan
  rationale: “Keuntungan” menyampaikan arti manfaat atau perolehan positif dengan jelas. Dalam konteks ini kata tersebut mempertahankan daya kejut metafora ekonomis Yunani tanpa membatasi maknanya pada laba materi.
theological_decisions:
- issue: Hubungan predikatif dalam frasa τὸ ζῆν Χριστός
  choice: “hidup adalah Kristus”
  alternative: “hidup berarti Kristus” atau “hidup ialah untuk Kristus”
  rationale: Teks Yunani sangat padat dan tidak menjelaskan hubungan itu lebih lanjut. Terjemahan dengan “adalah” mempertahankan ketegangan serta keluasan maknanya dan tidak menambahkan gagasan “untuk” yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kesejajaran retoris antara “hidup” dan “mati” dipertahankan, demikian juga bentuk aforistis ayat tersebut.
