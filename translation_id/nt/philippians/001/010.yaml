lexical_decisions:
- source_word: δοκιμάζειν
  choice: menguji dan memilih
  rationale: Kata kerja ini mencakup tindakan menguji atau menilai dan kemudian menyetujui hasilnya. Pasangan verba ini menyampaikan proses serta keputusan evaluatifnya dalam bahasa Indonesia yang wajar.
- source_word: τὰ διαφέροντα
  choice: apa yang lebih utama
  rationale: Secara harfiah frasa ini berarti 'hal-hal yang berbeda', tetapi dalam konteks evaluatif dapat menunjuk pada hal-hal yang lebih unggul atau lebih penting. 'Apa yang lebih utama' mempertahankan daya komparatif tanpa mempersempitnya hanya pada satu jenis keunggulan.
- source_word: εἰλικρινεῖς
  choice: murni
  rationale: Adjektiva ini dapat berarti murni, tulus, atau sungguh-sungguh. 'Murni' sesuai dengan konteks etis dan tetap berbeda dari ἀπρόσκοποι.
- source_word: ἀπρόσκοποι
  choice: tak bercela
  rationale: Istilah ini dapat menunjuk pada keadaan tidak tersandung, tidak menyebabkan orang lain tersandung, atau tidak bercela. Dalam pasangan etis ini, 'tak bercela' merupakan padanan ringkas dan alami yang tidak menentukan secara berlebihan siapa yang mungkin tersandung.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: menjelang hari Mesias
  rationale: εἰς mengarahkan pandangan kepada hari eskatologis sebagai sasaran atau titik tujuan. 'Menjelang' terdengar alami dalam bahasa Indonesia dan menyatakan orientasi menuju hari itu; Χριστοῦ diperlakukan sebagai gelar dan diterjemahkan 'Mesias'.
theological_decisions:
- issue: Pemadanan Χριστοῦ dalam ungkapan eskatologis εἰς ἡμέραν Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός di sini tetap membawa makna gelar bagi Dia yang hari-Nya dinantikan. 'Mesias' menyatakan arti gelar tersebut secara langsung, sedangkan bentuk tradisional 'Kristus' dicatat dalam catatan kaki.
- issue: Arah makna ἀπρόσκοποι
  choice: tak bercela
  alternative: tidak tersandung / tidak menyebabkan orang lain tersandung
  rationale: Bentuk Yunani memungkinkan nuansa pasif maupun aktif. Teks utama memakai ungkapan etis yang luas dan tidak memaksakan salah satu arah kausal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur tujuan ganda dipertahankan melalui 'supaya' dan 'sehingga'. Koma akhir dipertahankan karena ayat sumber merupakan bagian dari kalimat yang berlanjut.
