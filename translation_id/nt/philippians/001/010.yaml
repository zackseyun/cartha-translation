  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: id
  text: supaya kamu dapat menilai apa yang lebih utama[a], agar kamu menjadi murni dan tak bercela menjelang hari Mesias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menilai apa yang sungguh bernilai,” “menilai apa yang terbaik,” atau, secara lebih harfiah, “menguji hal-hal yang berbeda.”'
