  source_fidelity: 'Draf umumnya setia: πλείονας diterjemahkan tepat sebagai “sebagian besar,” ἐν κυρίῳ sebagai “dalam Tuhan,” dan “belenggu” mempertahankan citra δεσμοί. Namun, “semakin yakin” menyiratkan peningkatan keyakinan yang tidak secara langsung dinyatakan oleh partisip perfek πεποιθότας; bentuk ini terutama menandai keyakinan yang sudah terbentuk. Selain itu, “menjadi jauh lebih berani” dapat terdengar seolah-olah keberanian itu baru mulai muncul, sedangkan τολμᾶν menyatakan keberanian untuk berbicara, dengan περισσοτέρως sebagai peningkatan tingkat keberanian.'
