  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: id
  text: Dan karena belengguku, sebagian besar saudara seiman[a] yang telah menjadi yakin dalam Tuhan makin berani menyampaikan firman tanpa rasa takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari seiman”; istilah ini kemungkinan merujuk secara luas kepada sesama orang percaya, baik laki-laki maupun perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: sebagian besar
  rationale: Dengan artikel dan genitif partitif, frasa ini menunjuk pada mayoritas, bukan sekadar jumlah yang lebih banyak.
- source_word: ἀδελφῶν
  choice: saudara seiman
  rationale: Istilah ini mempertahankan metafora kekerabatan Kristen secara alami dalam bahasa Indonesia; catatan kaki menjelaskan bahwa cakupannya kemungkinan meliputi laki-laki dan perempuan.
- source_word: ἐν κυρίῳ
  choice: dalam Tuhan
  rationale: Ungkapan khas Paulus ini dipertahankan dan dikaitkan dengan keadaan yakin, sebagai lingkup atau dasar keyakinan mereka.
- source_word: πεποιθότας
  choice: semakin yakin
  rationale: Partisip perfek menyatakan keadaan yakin yang telah terbentuk dan masih berlangsung; bersama konteks kausal belenggu Paulus, 'semakin yakin' menyampaikan perkembangan menuju keyakinan yang menetap secara wajar.
- source_word: τοῖς δεσμοῖς μου
  choice: karena belengguku
  rationale: Terjemahan ini mempertahankan gambaran konkret 'belenggu' dan menyampaikan hubungan kausal yang paling sesuai dengan konteks.
- source_word: περισσοτέρως
  choice: jauh lebih
  rationale: Ungkapan ini menyampaikan daya komparatif adverbia tersebut secara alami dan menegaskan bertambahnya keberanian.
- source_word: τολμᾶν
  choice: menjadi ... berani
  rationale: Dalam bahasa Indonesia, konstruksi ini lebih alami daripada padanan harfiah 'berani mengambil risiko', sambil mempertahankan gagasan tekad yang meningkat.
- source_word: ἀφόβως
  choice: tanpa rasa takut
  rationale: Padanan ini secara tepat menyatakan ketiadaan rasa takut, bukan hanya keberanian secara umum.
- source_word: τὸν λόγον
  choice: firman
  rationale: Dalam konteks pewartaan Kristen, 'firman' merupakan padanan Indonesia yang lazim dan tetap tidak menambahkan 'Allah', yang tidak terdapat dalam teks Yunani.
- source_word: λαλεῖν
  choice: menyampaikan
  rationale: Dalam konteks menyuarakan firman kepada orang lain, 'menyampaikan' terdengar lebih alami daripada sekadar 'berbicara', tanpa memperkuatnya menjadi istilah teknis seperti 'memberitakan'.
theological_decisions:
- issue: Cakupan ἀδελφοί
  choice: saudara seiman dalam teks utama, dengan catatan mengenai kemungkinan cakupan inklusif
  alternative: saudara-saudari seiman; orang-orang percaya
  rationale: Bentuk Yunani adalah jamak maskulin, tetapi dalam pemakaian komunitas dapat mencakup semua rekan percaya. Terjemahan utama mempertahankan metafora kekerabatan tanpa membatasi cakupannya secara eksplisit, sedangkan catatan menjernihkan kemungkinan referennya.
- issue: Hubungan ἐν κυρίῳ dan τοῖς δεσμοῖς μου dengan πεποιθότας
  choice: menjadi yakin dalam Tuhan karena belenggu Paulus
  alternative: menjadi yakin oleh Tuhan dalam kaitannya dengan belenggu Paulus
  rationale: Susunan ini mempertahankan 'dalam Tuhan' sebagai lingkup atau dasar keyakinan dan memahami datif 'belengguku' secara kausal, tanpa menghapus kemungkinan nuansa agensi ilahi dalam ungkapan Paulus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Belenggu' mempertahankan citra konkret penahanan Paulus; 'firman' mempertahankan kekhasan istilah λόγος tanpa menambahkan unsur yang tidak eksplisit.
