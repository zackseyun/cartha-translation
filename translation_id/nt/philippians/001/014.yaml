  terminology: “Saudara seiman” adalah padanan yang wajar untuk ἀδελφοί dalam konteks komunitas Kristen, dan catatan kaki dengan tepat menjaga kemungkinan cakupan inklusif. “Dalam Tuhan,” “belenggu,” dan “firman” sesuai register Alkitab Indonesia modern dan tidak menambahkan unsur teologis yang tidak eksplisit.
