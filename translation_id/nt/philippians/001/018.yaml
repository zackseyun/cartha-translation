  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: id
  text: Jadi, bagaimana? Yang penting ialah bahwa dengan segala cara, entah dengan dalih maupun dengan tulus, Mesias[a] diberitakan. Karena itulah aku bersukacita. Namun, aku juga akan bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Jadi, bagaimana?
  rationale: Mempertahankan pertanyaan retoris singkat yang mengalihkan pembahasan kepada kesimpulan Paulus tanpa memperluasnya menjadi penjelasan.
- source_word: πλὴν ὅτι
  choice: Yang penting ialah bahwa
  rationale: 'Mengungkapkan daya pembatas ungkapan Yunani secara wajar: terlepas dari motif para pemberita, pokok utama berikut inilah yang penting.'
- source_word: παντὶ τρόπῳ
  choice: dengan segala cara
  rationale: Menyampaikan cakupan distributif frasa Yunani dengan ungkapan Indonesia yang alami.
- source_word: εἴτε προφάσει εἴτε ἀληθείᾳ
  choice: entah dengan dalih maupun dengan tulus
  rationale: Menjaga kontras antara motif yang dijadikan kedok dan ketulusan, sambil mengungkapkan arti kontekstual ἀληθείᾳ secara alami dalam bahasa Indonesia.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Memperlakukan Χριστός sebagai gelar yang menjadi isi pemberitaan, bukan sekadar nama diri; padanan tradisional “Kristus” dicatat sebagai alternatif.
- source_word: καταγγέλλεται
  choice: diberitakan
  rationale: Mempertahankan bentuk pasif dan gagasan pengumuman atau pemberitaan kepada umum; kala kini Yunani tidak perlu selalu dinyatakan dengan kata “sedang” dalam bahasa Indonesia.
- source_word: ἐν τούτῳ χαίρω
  choice: Karena itulah aku bersukacita
  rationale: Menghubungkan sukacita Paulus dengan fakta bahwa Mesias diberitakan; “karena itulah” mengungkapkan hubungan idiomatis ἐν τούτῳ tanpa mengubah acuannya.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Bahkan, aku juga akan bersukacita
  rationale: Menjaga unsur penegasan, penambahan, dan orientasi masa depan tanpa menambahkan gagasan durasi yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Padanan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks pemberitaan ini, kata tersebut berfungsi sebagai gelar. “Mesias” menampilkan makna gelarnya, sedangkan “Kristus” tetap sah dan dicatat dalam catatan kaki.
- issue: Sukacita terhadap pemberitaan oleh orang yang bermotif buruk
  choice: Sukacita dikaitkan dengan fakta bahwa Mesias diberitakan, bukan dengan motif buruk mereka
  alternative: Menghaluskan teks seolah-olah Paulus menyetujui semua cara dan motif pemberitaan
  rationale: Teks mempertahankan ketegangan bahwa sebagian orang memberitakan dengan dalih, tetapi Paulus tetap bersukacita atas isi pemberitaan itu; terjemahan tidak menyamakan sukacita tersebut dengan persetujuan terhadap motif mereka.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat dipecah setelah “diberitakan” agar alami bagi pembaca umum, tanpa mengubah hubungan logis teks Yunani.
