  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: id
  text: dipenuhi dengan buah kebenaran[a] yang datang melalui Yesus Sang Mesias[b], untuk kemuliaan dan pujian Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buah keadilan.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Yesus Kristus”; di sini Christos diterjemahkan sebagai gelar, “Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: dipenuhi
  rationale: Partisipel perfekt menyatakan keadaan yang telah dihasilkan dan masih berlangsung; “dipenuhi” mempertahankan bentuk pasif serta kaitannya dengan klausa sebelumnya.
- source_word: καρπὸν
  choice: buah
  rationale: Mempertahankan metafora umum tentang hasil nyata dalam kehidupan etis dan rohani.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: “Kebenaran” merupakan padanan luas dan lazim bagi δικαιοσύνη dalam konteks Paulus, tanpa menutup kemungkinan nuansa keadilan.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: yang datang melalui Yesus Sang Mesias
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan hubungan gramatikal antara buah dan kebenaran.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Menerjemahkan isi gelar Χριστός secara transparan; “Sang” menandai gelar itu secara wajar dan hormat dalam bahasa Indonesia.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: demi kemuliaan dan pujian bagi Allah
  rationale: “Demi” menyampaikan arah, tujuan, atau hasil yang dinyatakan oleh εἰς, sedangkan “bagi Allah” menghasilkan susunan Indonesia yang alami.
theological_decisions:
- issue: Makna frasa “buah kebenaran”
  choice: Mempertahankan konstruksi “buah kebenaran” tanpa menjelaskan apakah buah itu terdiri dari kebenaran, bercirikan kebenaran, atau dihasilkan oleh kebenaran.
  alternative: Menjabarkannya sebagai “buah berupa kehidupan benar” atau “buah yang dihasilkan oleh kebenaran”.
  rationale: Genitif δικαιοσύνης dapat dipahami dengan beberapa cara. Terjemahan harfiah yang tetap alami menjaga ambiguitas dan ketegangan teologis teks.
- issue: Hubungan “melalui Yesus Sang Mesias” dengan buah
  choice: “yang datang melalui” menyatakan bahwa buah tersebut ada melalui perantaraan Yesus Sang Mesias.
  alternative: “yang dihasilkan oleh Yesus Sang Mesias”.
  rationale: Alternatif tersebut lebih tegas menyatakan pelaku dan produksi daripada yang diwajibkan oleh διά dengan genitif; “datang melalui” mempertahankan cakupan makna sarana atau perantaraan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat ini merupakan lanjutan sintaksis dari ayat sebelumnya, sehingga diawali dengan “dipenuhi”. Metafora “buah” dan ambiguitas “buah kebenaran” dipertahankan.
