id: PHP.1.15
reference: Philippians 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: id
  text: Memang, sebagian orang memberitakan Mesias karena iri hati dan persaingan, tetapi yang lain karena niat baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani yang dipakai ialah Χριστός (Christos).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Memang, sebagian orang … tetapi yang lain
  rationale: Ungkapan ini membedakan dua kelompok. Susunan tersebut alami dalam bahasa Indonesia dan mempertahankan pertentangan μέν … δέ.
- source_word: διὰ φθόνον
  choice: karena iri hati
  rationale: διά dengan akusatif menyatakan sebab atau motif di sini; frasa ini menyampaikan motif tersebut secara jelas.
- source_word: ἔριν
  choice: persaingan
  rationale: Dalam konteks motif antarpelaku, kata ini menunjuk pada semangat bersaing yang menimbulkan pertentangan; 'persaingan' lebih alami daripada 'perselisihan' dan tetap mempertahankan nuansa kompetitif.
- source_word: δι’ εὐδοκίαν
  choice: karena niat baik
  rationale: Frasa ini berlawanan dengan iri hati dan persaingan serta menyatakan motif positif. 'Niat baik' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: τὸν Χριστόν
  choice: Mesias
  rationale: Χριστός merupakan gelar bagi Dia yang diurapi. Pemakaian artikel di sini mendukung pembacaan sebagai gelar, dan 'Mesias' menyampaikan fungsi tersebut dengan jelas.
- source_word: κηρύσσουσιν
  choice: memberitakan
  rationale: Pilihan ini mempertahankan gagasan mengumumkan secara terbuka tanpa membatasi tindakan itu pada khotbah institusional.
theological_decisions:
- issue: Χριστός sebagai gelar atau bentuk nama
  choice: Mesias
  alternative: Kristus
  rationale: Konteks dan artikel Yunani memungkinkan fungsi gelar ditampilkan secara eksplisit. Alternatif tradisional 'Kristus' tetap sah dan dicatat agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Memang' mewakili penegasan μέν, sedangkan 'tetapi' menandai kontras δέ. καί tidak diterjemahkan secara mekanis karena dalam kedua klausa berfungsi menambah penekanan dan hasil harfiahnya akan terasa janggal dalam bahasa Indonesia.
