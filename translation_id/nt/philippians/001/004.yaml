translation:
  language: id
  text: selalu, dalam setiap permohonanku bagi kamu semua, aku berdoa dengan sukacita,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: selalu
  rationale: Mempertahankan keterangan frekuensi yang membuka frasa Yunani.
- source_word: ἐν πάσῃ δεήσει μου
  choice: dalam setiap permohonanku
  rationale: Menerjemahkan δέησις sebagai 'permohonan', yaitu doa yang berisi permintaan, sambil mempertahankan bentuk tunggal distributif πάσῃ.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: bagi kamu semua
  rationale: ὑπέρ dalam konteks doa menyatakan pihak yang menjadi kepentingan atau sasaran doa; πάντων dipertahankan secara eksplisit sebagai 'semua'.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Ungkapan ini secara alami menyatakan sikap yang menyertai tindakan berdoa.
- source_word: τὴν δέησιν ποιούμενος
  choice: aku berdoa
  rationale: Idiom harfiah 'membuat/melakukan permohonan' dinaturalkan menjadi 'berdoa'; subjek orang pertama dijelaskan dari μου dan hubungan partisipial dengan konteks kalimat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Teks ini merupakan bagian kalimat yang berlanjut dari ayat sebelumnya dan menuju ayat berikutnya, sehingga tanda koma akhir dipertahankan. 'Kamu' dipilih sebagai bentuk jamak netral yang lazim dalam terjemahan Alkitab modern; cakupan jamaknya ditegaskan oleh 'semua'.
