id: PHP.1.20
reference: Philippians 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: id
  text: sesuai dengan penantianku yang penuh kerinduan dan harapanku bahwa aku sama sekali tidak akan dipermalukan,[a] melainkan bahwa dengan penuh keberanian, seperti selalu, sekarang pun Mesias akan diagungkan dalam tubuhku,[b] baik melalui kehidupan maupun melalui kematian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku sama sekali tidak akan merasa malu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “melalui tubuhku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: sesuai dengan
  rationale: Menandai keselarasan dengan penantian dan harapan Paulus; ungkapan ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi hubungan sebab-akibat.
- source_word: ἀποκαραδοκίαν
  choice: penantianku yang penuh kerinduan
  rationale: Kata benda yang langka dan kuat ini menggambarkan penantian yang sungguh-sungguh serta tertuju ke depan; frasa ini mempertahankan intensitasnya tanpa terasa kaku.
- source_word: ἐλπίδα
  choice: harapanku
  rationale: Mempertahankan arti umum ἐλπίς sebagai harapan yang yakin dan kesejajarannya dengan penantian Paulus.
- source_word: ἐν οὐδενὶ
  choice: sama sekali tidak
  rationale: Menyampaikan penyangkalan menyeluruh secara wajar dalam bahasa Indonesia; cakupannya ialah bahwa dalam hal apa pun Paulus tidak akan dipermalukan.
- source_word: αἰσχυνθήσομαι
  choice: aku ... tidak akan dipermalukan
  rationale: Mempertahankan kemungkinan nuansa pasif dan publik, yakni dibuat mendapat malu atau terbukti gagal, sambil mencatat arti refleksif 'merasa malu' dalam catatan kaki.
- source_word: ἐν πάσῃ παρρησίᾳ
  choice: dengan penuh keberanian
  rationale: Dalam konteks kesaksian Paulus, παρρησία menunjuk pada keberanian dan keterusterangan terbuka; terjemahan ini alami dan menjaga daya ungkap frasa tersebut.
- source_word: μεγαλυνθήσεται
  choice: akan diagungkan
  rationale: Kata kerja ini berarti membuat atau menyatakan besar. 'Diagungkan' mempertahankan gagasan meninggikan kebesaran Mesias tanpa menyamakannya begitu saja dengan δοξάζω.
- source_word: Χριστὸς
  choice: Mesias
  rationale: Di sini Χριστός tetap memiliki daya sebagai gelar bagi Yesus, bukan sekadar unsur nama diri; 'Mesias' menyampaikan makna gelar itu kepada pembaca Indonesia.
- source_word: ἐν τῷ σώματί μου
  choice: dalam tubuhku
  rationale: Mengikuti gambaran lokatif Yunani dan menegaskan bahwa kesaksian itu terwujud dalam keberadaan jasmani Paulus; kemungkinan arti instrumental dicatat dalam catatan kaki.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: baik melalui kehidupan maupun melalui kematian
  rationale: Mempertahankan kesejajaran dan perantaraan atau keadaan yang dinyatakan oleh διά dengan genitif, tanpa menentukan lebih jauh apakah yang dimaksud terutama pengalaman, sarana, atau hasil.
theological_decisions:
- issue: Penerjemahan Χριστός dalam konteks surat Paulus
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός dalam klausa ini masih dapat didengar sebagai gelar yang bermakna, sehingga 'Mesias' dipilih. 'Kristus' tetap mungkin bila kata tersebut dipahami lebih menyerupai nama diri, tetapi pilihan itu tidak dijadikan teks utama.
- issue: Sifat rasa malu dalam αἰσχυνθήσομαι
  choice: tidak akan dipermalukan
  alternative: tidak akan merasa malu
  rationale: Konteks pengharapan, kesaksian terbuka, serta hidup atau mati mendukung nuansa pembenaran atau kehormatan publik, tetapi bentuk Yunani juga dapat menunjuk pada pengalaman merasa malu; ambiguitas ini dipertahankan melalui catatan kaki.
- issue: Cara Mesias diagungkan sehubungan dengan tubuh Paulus
  choice: dalam tubuhku
  alternative: melalui tubuhku
  rationale: ἐν secara langsung mendukung 'dalam', yang menyoroti ranah jasmani tempat Mesias diagungkan. Namun, arti instrumental 'melalui' juga mungkin dalam konteks ini dan dicatat tanpa memaksakan salah satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur argumentasi Yunani, tetapi memakai ungkapan Indonesia yang wajar. 'Mesias' dipakai sebagai gelar yang masih bermakna; 'diagungkan' menjaga metafora kebesaran; dan dua ambiguitas utama dijelaskan dalam catatan kaki.
