id: PHP.1.7
reference: Philippians 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: id
  text: Memang, sudah sepatutnya aku berpikir demikian tentang kamu semua[a], sebab kamu ada di dalam hatiku; kamu semua turut mengambil bagian bersamaku dalam anugerah, baik dalam belengguku maupun dalam pembelaan dan peneguhan Injil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab aku ada di dalam hatimu.” Klausa Yunani ini dapat dipahami dengan kedua cara tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: sudah sepatutnya
  rationale: Menyatakan bahwa sikap Paulus tepat dan patut, dengan ungkapan Indonesia yang alami serta tetap memiliki bobot etis.
- source_word: φρονεῖν
  choice: berpikir demikian
  rationale: Mempertahankan unsur pikiran dan sikap yang terkandung dalam φρονέω tanpa mempersempitnya menjadi perasaan semata.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: tentang kamu semua
  rationale: Dalam konstruksi bersama φρονεῖν, frasa ini paling wajar menyatakan objek perhatian atau pemikiran Paulus.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: sebab kamu ada di dalam hatiku
  rationale: Mengikuti pembacaan bahwa Pauluslah yang menyimpan jemaat Filipi di dalam hatinya, sambil mencatat pembacaan sintaktis alternatif dalam catatan kaki.
- source_word: δεσμοῖς
  choice: ketika aku dipenjarakan
  rationale: δεσμοί secara harfiah menunjuk pada belenggu, tetapi dalam konteks ini merupakan metonimia bagi keadaan Paulus sebagai tahanan; bentuk ini paling jelas dalam bahasa Indonesia modern.
- source_word: ἀπολογίᾳ
  choice: membela
  rationale: Menyampaikan tindakan Paulus memberikan pembelaan bagi Injil secara ringkas dan alami.
- source_word: βεβαιώσει
  choice: meneguhkan
  rationale: Mengungkapkan usaha mengukuhkan kebenaran dan kedudukan Injil, selaras dengan pasangan 'membela dan meneguhkan'.
- source_word: συγκοινωνούς
  choice: turut mengambil bagian bersamaku
  rationale: Mempertahankan gagasan partisipasi bersama dan hubungan dengan Paulus tanpa memakai ungkapan Indonesia yang kaku.
- source_word: χάριτος
  choice: anugerah ini
  rationale: Mempertahankan istilah teologis χάρις; kata 'ini' membuat rujukannya kepada pengalaman pelayanan dan penderitaan yang dibicarakan lebih alami tanpa menentukan cakupannya secara sempit.
theological_decisions:
- issue: Ambiguitas sintaktis dalam klausa tentang hati
  choice: kamu ada di dalam hatiku
  alternative: aku ada di dalam hatimu
  rationale: Dua pronomina berkasus akusatif di sekitar infinitif ἔχειν memungkinkan kedua pemahaman. Bacaan utama selaras dengan ungkapan kasih Paulus dalam konteks dekat, tetapi alternatifnya tetap dicatat karena secara gramatikal sungguh mungkin.
- issue: Cakupan 'anugerah' dalam penderitaan dan pembelaan Injil
  choice: anugerah ini
  alternative: kasih karunia
  rationale: Teks tidak merinci apakah χάρις terutama menunjuk pada keselamatan, panggilan pelayanan, penderitaan demi Kristus, atau keseluruhan pemberian Allah tersebut. Terjemahan tidak mempersempit cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Struktur kalimat diatur agar hubungan antara pemenjaraan, pembelaan Injil, dan partisipasi bersama dalam anugerah mudah dipahami, tanpa menghapus ambiguitas asli pada klausa tentang hati.
