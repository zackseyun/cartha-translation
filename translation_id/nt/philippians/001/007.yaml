    rationale: ἐν τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει adalah rangkaian frasa 'dalam', yang menerangkan lingkup partisipasi bersama dalam anugerah. Bentuk 'ketika aku ...' dan verba aktif menggeser struktur serta nuansanya.
