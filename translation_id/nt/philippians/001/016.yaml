lexical_decisions:
- source_word: οἱ μὲν
  choice: Pihak yang satu berbuat demikian
  rationale: Frasa Yunani ini eliptis dan menandai satu pihak dalam kontras dengan οἱ δέ pada ayat berikutnya. “Berbuat demikian” memasok tindakan dari konteks tanpa menentukan ulang tindakannya di dalam ayat ini.
- source_word: ἐξ ἀγάπης
  choice: karena kasih
  rationale: Preposisi ἐξ dengan nomina abstrak menyatakan sumber atau dorongan tindakan; “karena kasih” alami dalam bahasa Indonesia dan tetap mempertahankan kasih sebagai motif.
- source_word: εἰδότες
  choice: sebab mereka tahu
  rationale: Partisip ini memberikan dasar bagi tindakan yang didorong kasih. Bentuk klausa kausal lebih alami dalam bahasa Indonesia.
- source_word: εἰς ἀπολογίαν
  choice: untuk membela
  rationale: ἀπολογία dapat menunjuk pada pembelaan hukum atau pembelaan dengan alasan. Bentuk verbal ini menyampaikan tujuan εἰς dengan jelas tanpa membatasi pembelaan itu hanya pada ruang sidang.
- source_word: τοῦ εὐαγγελίου
  choice: Kabar Baik
  rationale: Istilah ini menunjuk pada berita Kristen yang diberitakan. “Kabar Baik” menyampaikan makna leksikalnya secara transparan dan wajar bagi pembaca modern.
- source_word: κεῖμαι
  choice: aku ditempatkan di sini
  rationale: Dalam konteks pemenjaraan Paulus, verba ini dapat menggambarkan keadaan atau penempatan yang ditujukan bagi pembelaan Kabar Baik. Pilihan ini mempertahankan citra penempatan dan tidak mempertegas pelaku yang tidak disebutkan.
theological_decisions:
- issue: Makna κεῖμαι dalam konteks pemenjaraan dan tugas Paulus
  choice: aku ditempatkan di sini
  alternative: aku ditetapkan
  rationale: “Ditempatkan di sini” mempertahankan kemungkinan rujukan pada keadaan Paulus saat itu sekaligus tujuan pelayanannya, sedangkan “ditetapkan” lebih tegas menekankan penugasan. Teks Yunani memungkinkan nuansa keduanya dan tidak menyebut pelakunya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pihak yang satu” menjaga struktur kontras antarkelompok; “berbuat demikian” menandai unsur yang dipasok dari konteks. Kapitalisasi “Kabar Baik” menandai berita khusus yang diberitakan Paulus.
