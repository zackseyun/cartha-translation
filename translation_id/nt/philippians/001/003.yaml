  text: Εὐχαριστῶ τῷ θεῷ μου ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/003.yaml
  text: I thank my God at every remembrance of you,[a]
translation:
  language: id
  text: Aku mengucap syukur kepada Allahku setiap kali aku mengingat kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku mengucap syukur kepada Allahku atas setiap ingatan tentang kalian.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa ἐπὶ menunjukkan dasar atau alasan ucapan syukur, bukan hanya kesempatan ketika Paulus mengingat mereka.
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Aku mengucap syukur
  rationale: Bentuk kini aktif indikatif orang pertama tunggal. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan makna tindakan bersyukur.
- source_word: τῷ θεῷ μου
  choice: kepada Allahku
  rationale: Datif bersama εὐχαριστέω menunjukkan pihak yang menerima ucapan syukur; 'kepada Allahku' mempertahankan hubungan gramatikal dan kata ganti posesif.
- source_word: ἐπὶ
  choice: setiap kali
  rationale: Dengan datif, preposisi ini dapat menandai keadaan atau kesempatan terjadinya ucapan syukur. Dalam susunan ini, 'setiap kali' menghasilkan bahasa Indonesia yang alami tanpa memaksakan makna sebab.
- source_word: πάσῃ τῇ μνείᾳ
  choice: aku mengingat
  rationale: Secara harfiah frasa nominal ini berarti 'setiap ingatan/kenangan'. Pengalihannya menjadi klausa verbal lebih alami dalam bahasa Indonesia dan tetap menyampaikan tindakan mengingat yang berulang.
- source_word: ὑμῶν
  choice: kalian
  rationale: Kata ganti ini berbentuk jamak. 'Kalian' menyatakan kejamakan secara jelas dan sesuai dengan sapaan kepada jemaat Filipi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'Aku' dipakai untuk suara pribadi Paulus; 'kalian' memperjelas bahwa ὑμῶν bersifat jamak. Catatan kaki mempertahankan ambiguitas hubungan ἐπὶ dengan μνείᾳ.
