  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: id
  text: Anugerah dan damai sejahtera bagi kalian dari Allah Bapa kita dan Tuhan Yesus Sang Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Istilah ini alami dalam bahasa Indonesia untuk salam khas Paulus dan tetap memuat nuansa kemurahan ilahi, bukan sekadar sapaan biasa.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Bentuk jamak orang kedua dibuat eksplisit; dalam rumusan berkat bahasa Indonesia, “bagi kalian” terdengar alami.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan baku ini menyampaikan bukan hanya ketiadaan konflik, melainkan juga keutuhan dan kesejahteraan yang terkandung dalam εἰρήνη.
- source_word: ἀπὸ
  choice: dari
  rationale: Padanan langsung dan alami yang menandai sumber anugerah dan damai sejahtera.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Allah, Bapa kita
  rationale: 'Koma memperjelas hubungan aposisional: Allah adalah Bapa kita, tanpa mengubah konstruksi Yunani menjadi “Allah dan Bapa kita”.'
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan Indonesia yang mapan dan mempertahankan bobot kristologis κύριος dalam Perjanjian Baru.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός dipertahankan sebagai gelar yang bermakna “Mesias”; “Sang” menjadikan gelar itu idiomatis dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan Χριστοῦ dalam rumusan salam Paulus
  choice: Sang Mesias
  alternative: Kristus
  rationale: Walaupun “Kristus” merupakan bentuk tradisional dan dapat terasa seperti bagian dari nama, kata Yunani tetap dapat dipahami sebagai gelar di sini. Terjemahan utama mempertahankan makna gelar itu, sedangkan bentuk tradisional dicatat sebagai alternatif.
- issue: Hubungan Allah Bapa dengan Tuhan Yesus sebagai sumber salam
  choice: Mengulangi “dari” sebelum “Tuhan Yesus”
  alternative: Satu “dari” yang menaungi kedua unsur
  rationale: Teks Yunani hanya memakai satu ἀπό, tetapi pengulangan “dari” dalam bahasa Indonesia memperjelas bahwa anugerah dan damai sejahtera berasal dari Allah Bapa dan Tuhan Yesus, tanpa menentukan lebih jauh hakikat hubungan keduanya.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam hormat dan mudah dipahami. “Kalian” dipakai untuk menampilkan jamak ὑμῖν secara jelas; kapitalisasi gelar ilahi mengikuti kebiasaan umum bahasa Indonesia. Penambahan koma dan pengulangan “dari” bersifat idiomatis dan tidak menambah klaim teologis baru.
