  to: Namun Mikhael, sang penghulu malaikat, ketika berselisih dengan Iblis dan berdebat tentang tubuh Musa, tidak berani mengucapkan penghakiman yang mencerca terhadap Iblis,[a] melainkan berkata, “Kiranya Tuhan menghardik engkau!”[b]
  rationale: Revisi terbatas pada pelancaran idiom dan penegasan acuan objek dalam frasa yang paling sulit. “Mengucapkan penghakiman yang mencerca terhadap Iblis” mempertahankan κρίσις sebagai penghakiman dan βλασφημίας sebagai sifat mencerca/reviling, tanpa memutuskan apakah nuansa tepatnya adalah penghinaan, tuduhan mencerca, atau penghukuman yang menghujat. Kedua verba konflik tetap dipertahankan, sebagaimana dalam teks Yunani.
