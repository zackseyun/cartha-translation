id: JUD.1.9
reference: Jude 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: id
  text: Namun Mikhael, sang penghulu malaikat, ketika berselisih dengan Iblis dan berdebat tentang tubuh Musa, tidak berani mengucapkan penghakiman yang mencerca terhadap Iblis,[a] melainkan berkata, “Kiranya Tuhan menghardik engkau!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak berani melontarkan tuduhan yang mencerca terhadap Iblis.” Frasa Yunaninya dapat dipahami dengan lebih dari satu cara.'
    reason: lexical_alternative
  - marker: b
    text: Perkataan ini menggemakan Zakharia 3:2, ketika TUHAN menghardik Iblis.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: penghulu malaikat
  rationale: Istilah Indonesia yang mapan untuk malaikat berkedudukan utama; lebih jelas bagi pembaca umum daripada transliterasi teknis.
- source_word: διαβόλῳ
  choice: Iblis
  rationale: Dalam konteks ini διάβολος menunjuk kepada lawan adikodrati sebagai sosok pribadi, bukan sekadar seorang pemfitnah.
- source_word: διακρινόμενος
  choice: berselisih
  rationale: Menyampaikan nuansa pertentangan atau sengketa dan tetap membedakannya dari kata kerja berikutnya.
- source_word: διελέγετο
  choice: berdebat
  rationale: Menggambarkan pertukaran verbal yang berlangsung dan bernada berlawanan.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: tentang tubuh Musa
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan rujukan konkret serta hubungan genetif dalam bahasa Yunani.
- source_word: οὐκ ἐτόλμησεν
  choice: tidak berani
  rationale: Padanan langsung dan wajar bagi gagasan tidak berani atau tidak lancang melakukan sesuatu.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: menjatuhkan penghakiman yang mencerca terhadapnya
  rationale: Mempertahankan unsur forensik κρίσις dan daya penghinaan βλασφημία tanpa menyimpulkan bahwa Mikhael menghujat Allah. Karena konstruksi Yunaninya sulit dan dapat dipahami dengan lebih dari satu cara, alternatif dicatat dalam catatan kaki.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Kiranya Tuhan menghardik engkau!
  rationale: Kata optatif menyatakan harapan atau seruan; 'kiranya' membuat nuansa itu jelas, sedangkan 'menghardik' menyampaikan teguran keras.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan idiomatis untuk κύριος dalam konteks seruan kepada kewenangan ilahi.
theological_decisions:
- issue: Sikap Mikhael ketika menghadapi Iblis
  choice: Mikhael tidak mengeluarkan penghukuman yang mencerca atas wewenangnya sendiri, tetapi menyerahkan hardikan itu kepada Tuhan.
  alternative: Frasa itu dapat dipahami sebagai penolakan untuk melontarkan tuduhan yang mencerca atau sebagai penolakan terhadap penghakiman yang bersifat menghujat.
  rationale: Terjemahan mempertahankan kontras yang jelas dalam teks tanpa membangun ajaran terperinci tentang hierarki atau kewenangan malaikat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Penghulu malaikat' dipilih sebagai istilah yang mapan; 'kiranya' mempertahankan daya optatif tanpa membuat kalimat terasa kuno secara berlebihan.
