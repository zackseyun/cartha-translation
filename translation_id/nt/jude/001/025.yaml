id: JUD.1.25
reference: Jude 1:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: id
  text: Bagi satu-satunya Allah, Juru Selamat kita, melalui Yesus Sang Mesias[a], Tuhan kita, kemuliaan, keagungan, kekuasaan, dan wewenang, sebelum segala zaman, sekarang, dan untuk selama-lamanya[b]. Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gelar Yunani Christos juga lazim dituliskan “Kristus”; artinya “Yang Diurapi” atau “Mesias”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebelum setiap zaman ... sampai kepada segala zaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: satu-satunya Allah
  rationale: Menjaga penegasan keunikan Allah dalam bentuk yang alami dan jelas dalam bahasa Indonesia.
- source_word: σωτῆρι ἡμῶν
  choice: Juru Selamat kita
  rationale: Padanan baku yang mempertahankan makna penyelamatan dalam konteks doksologi.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: melalui Yesus Sang Mesias
  rationale: διά dengan genitif menyatakan sarana atau perantaraan; Χριστός dipertahankan sebagai gelar yang berarti Mesias.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Frasa ini menerangkan Yesus Sang Mesias dan mempertahankan gelar κύριος.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: kemuliaan, keagungan, kekuasaan, dan wewenang
  rationale: 'Membedakan empat istilah doksologis: κράτος sebagai kekuasaan yang berdaulat dan ἐξουσία sebagai hak atau wewenang.'
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: sejak sebelum segala zaman
  rationale: Mengungkapkan cakupan sebelum seluruh zaman secara alami tanpa menghilangkan ungkapan temporal sumber.
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: sampai selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk durasi tanpa akhir, dengan bentuk harfiah dijelaskan dalam catatan.
theological_decisions:
- issue: Frasa perantaraan dalam doksologi
  choice: Pujian diarahkan kepada satu-satunya Allah, Juru Selamat kita, melalui Yesus Sang Mesias, Tuhan kita.
  alternative: Frasa “melalui Yesus Sang Mesias” dapat dipahami melekat secara lebih longgar pada keseluruhan doksologi.
  rationale: Susunan Yunani paling wajar menyatakan bahwa kemuliaan dipersembahkan kepada Allah melalui Yesus, tanpa menyamakan atau memisahkan secara tidak perlu pribadi-pribadi yang disebut.
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap berfungsi sebagai gelar; “Sang Mesias” menyampaikan maknanya secara terbuka dan alami.
- issue: Ketiadaan verba dalam doksologi Yunani
  choice: Mempertahankan konstruksi nominal “Bagi ... kemuliaan ...”
  alternative: Menambahkan “kiranya” atau “terpujilah”.
  rationale: Teks Yunani tidak menyatakan verba secara eksplisit. Konstruksi nominal Indonesia tetap bermartabat dan tidak menentukan secara berlebihan apakah ungkapan ini berupa harapan, pengakuan, atau pemberian pujian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doksologis. Urutan unsur utama dipertahankan sedekat mungkin dengan sumber Yunani, sementara “sejak” ditambahkan secara idiomatis agar frasa waktu terbaca alami. Kapitalisasi gelar mengikuti gaya religius Indonesia yang umum.
