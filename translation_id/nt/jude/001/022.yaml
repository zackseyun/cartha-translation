  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ⸀ἐλεᾶτε ⸂διακρινομένους,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: id
  text: Dan terhadap mereka yang ragu-ragu, tunjukkanlah belas kasihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka yang bimbang”; mungkin juga “mereka yang berselisih” atau “mereka yang membantah.” Partisip Yunani yang dipakai di sini dapat mengandung lebih dari satu nuansa dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung sederhana yang mengaitkan nasihat ini dengan rangkaian nasihat di sekitarnya.
- source_word: οὓς μὲν
  choice: terhadap mereka
  rationale: Frasa ini memperkenalkan kelompok pertama dalam suatu rangkaian. Unsur μέν tidak perlu diterjemahkan secara harfiah dalam bahasa Indonesia, tetapi susunan kalimat tetap membuka rangkaian yang dilanjutkan pada ayat berikutnya.
- source_word: ἐλεᾶτε
  choice: tunjukkanlah belas kasihan
  rationale: Bentuk imperatif ini memerintahkan tindakan berbelas kasihan; pilihan ini alami, jelas, dan mempertahankan daya etis kata kerja Yunani.
- source_word: διακρινομένους
  choice: yang ragu-ragu
  rationale: Dalam konteks ini, partisip tersebut paling mungkin menunjuk kepada orang-orang yang sedang bimbang atau tidak mantap. Namun, kata Yunani ini juga dapat bernuansa berselisih atau membantah, sehingga ambiguitasnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna διακρινομένους dalam nasihat pastoral kepada orang-orang yang terancam oleh pengajaran sesat
  choice: mereka yang ragu-ragu
  alternative: mereka yang bimbang; mereka yang berselisih atau membantah
  rationale: Makna 'ragu-ragu' menggambarkan kelompok yang tidak mantap dan karena itu perlu diperlakukan dengan belas kasihan. Karena bentuk Yunani dapat mengandung lebih dari satu nuansa, alternatifnya tidak dihapus, melainkan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang lugas dan bermartabat. Frasa 'tunjukkanlah belas kasihan' dipilih agar perintahnya jelas dan alami; penempatan 'terhadap mereka' menghindari konstruksi yang kaku.
