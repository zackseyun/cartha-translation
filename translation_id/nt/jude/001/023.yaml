  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: id
  text: Selamatkanlah yang lain dengan merenggut mereka dari api[a]. Tunjukkanlah belas kasihan kepada yang lain dengan rasa takut[b], sambil membenci bahkan pakaian yang telah dicemari oleh daging[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selamatkanlah yang lain dengan merebut mereka keluar dari api.” Gambaran ini dapat menunjuk pada penghakiman yang akan datang atau pada bahaya rohani yang berat.
    reason: alternative_reading
  - marker: b
    text: “Dengan rasa takut” dapat berarti dengan rasa takut yang penuh hormat kepada Allah, atau dengan kewaspadaan agar orang yang menunjukkan belas kasihan tidak ikut tercemar.
    reason: lexical_alternative
  - marker: c
    text: 'Atau, “pakaian yang dicemari oleh tabiat berdosa.” Yunani: “daging.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: selamatkanlah
  rationale: Bentuk imperatif dipertahankan, dan pilihan ini menjaga bobot makna keselamatan sekaligus sesuai dengan gambaran penyelamatan dari api.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: dengan merenggut mereka dari api
  rationale: Partisip ini menerangkan cara menyelamatkan; 'merenggut' menyampaikan tindakan yang kuat dan mendesak, sedangkan 'dari api' mempertahankan gambaran sumber.
- source_word: ἐλεᾶτε
  choice: berbelaskasihanlah
  rationale: Padanan imperatif yang alami dan bermartabat untuk tindakan menunjukkan belas kasihan.
- source_word: ἐν φόβῳ
  choice: dengan rasa takut
  rationale: Ungkapan ini mempertahankan ambiguitas antara takut yang penuh hormat kepada Allah dan kewaspadaan terhadap pencemaran.
- source_word: μισοῦντες
  choice: sambil membenci
  rationale: Menjaga ketajaman sikap moral dalam teks serta menunjukkan tindakan yang menyertai belas kasihan.
- source_word: χιτῶνα
  choice: pakaian dalam
  rationale: χιτών menunjuk pada pakaian yang dikenakan dekat tubuh; 'pakaian dalam' lebih mudah dipahami pembaca Indonesia modern daripada serapan 'tunik', tanpa membatasi secara anakronistis menjadi jenis pakaian modern tertentu.
- source_word: ἐσπιλωμένον
  choice: yang telah dicemari
  rationale: Mencerminkan keadaan yang dihasilkan oleh bentuk partisip perfek pasif dan mempertahankan baik citra noda maupun gagasan kenajisan moral.
- source_word: σάρξ
  choice: daging
  rationale: Padanan harfiah ini mempertahankan metafora sumber dan tidak mengubahnya menjadi tafsiran teologis yang lebih khusus seperti 'tabiat berdosa'.
theological_decisions:
- issue: Makna 'api' dalam gambaran penyelamatan
  choice: Mempertahankan kata 'api' tanpa menentukan rujukannya dalam teks utama.
  alternative: Penghakiman yang akan datang atau bahaya rohani yang berat.
  rationale: Teks memakai gambaran yang kuat tetapi tidak secara eksplisit menjelaskan rujukannya; terjemahan mempertahankan ketegangan tersebut.
- issue: Makna φόβος dalam cara berbelaskasihan
  choice: rasa takut
  alternative: rasa hormat kepada Allah atau kewaspadaan agar tidak ikut tercemar
  rationale: Padanan umum menjaga dua kemungkinan yang wajar dalam konteks dan tidak memilih salah satunya secara diam-diam.
- issue: Makna σάρξ dalam ungkapan tentang pakaian
  choice: daging
  alternative: tabiat berdosa
  rationale: Meskipun ungkapan ini mengarah pada pencemaran moral, 'daging' menjaga metafora Yunani dan menghindari pemaksaan suatu rumusan antropologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Susunan dua kelompok 'yang lain' dipertahankan, sementara tanda baca memisahkan perintah agar mudah dibaca. Metafora api, pakaian, dan daging tetap dijaga; ambiguitas teologis dicatat dalam catatan kaki.
