  source_fidelity: 'Terjemahan mengikuti unsur-unsur utama teks Yunani dengan baik: Henokh disebut sebagai yang ketujuh dari Adam, δράση προεφήτευσεν disampaikan sebagai “bernubuat,” dan τούτοις ditangkap secara wajar sebagai pihak yang menjadi pokok nubuat. “Telah datang” mempertahankan bentuk lampau aoristus ἦλθεν tanpa mengubahnya menjadi masa depan. “Bersama puluhan ribu orang kudus-Nya” menyampaikan ἐν ἁγίαις μυριάσιν αὐτοῦ tanpa menambahkan identifikasi “malaikat.”'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada khidmat. Susunan dua kalimat dengan “Katanya” terdengar alami dalam narasi modern. “Lihatlah” sesuai dengan nada seruan profetis Ἰδού.
