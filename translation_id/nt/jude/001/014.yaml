id: JUD.1.14
reference: Jude 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: id
  text: Henokh, keturunan ketujuh dari Adam, juga bernubuat tentang orang-orang ini[a]. Katanya, “Lihatlah,[b] Tuhan telah datang bersama puluhan ribu orang kudus-Nya.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “terhadap orang-orang ini.” Bentuk datif Yunani τούτοις dapat menunjuk kepada orang-orang yang menjadi sasaran atau pokok nubuat; dalam konteks ini mereka adalah para penyusup fasik.
    reason: lexical_alternative
  - marker: b
    text: Kutipan ini bergaung dengan 1 Henokh 1:9.
    reason: cross_reference
  - marker: c
    text: Secara harfiah, “bersama berlaksa-laksa orang kudus-Nya.” Kata Yunani μυριάσιν dapat berarti “puluhan ribu” atau suatu bala yang amat besar; teks tidak secara eksplisit menyebut mereka malaikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: bernubuat
  rationale: Mempertahankan tindakan menyampaikan nubuat tanpa mempersempit maknanya menjadi sekadar meramalkan.
- source_word: δὲ καὶ
  choice: juga
  rationale: δέ adalah penghubung ringan dan καί bersifat menambahkan; dalam susunan Indonesia, “juga” sudah menyampaikan kemajuan dan tambahan secara alami.
- source_word: τούτοις
  choice: tentang orang-orang ini
  rationale: Datif dapat menunjukkan pihak yang menjadi pokok nubuat. Ungkapan ini alami dalam bahasa Indonesia dan konteks menunjuk kepada para penyusup fasik, tetapi alternatif “terhadap orang-orang ini” tetap mungkin.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: keturunan ketujuh dari Adam
  rationale: Menjelaskan penomoran genealogis secara alami dalam bahasa Indonesia tanpa mengubah hubungannya dengan Adam.
- source_word: Ἑνὼχ
  choice: Henokh
  rationale: Bentuk nama yang baku dan dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: λέγων
  choice: Katanya
  rationale: Memperkenalkan kutipan secara ringkas dan alami, sepadan dengan partisipel “sambil berkata/mengatakan”.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan deiktis dan nada nubuat yang khidmat, namun tetap mudah dipahami pembaca modern.
- source_word: ἦλθεν
  choice: telah datang
  rationale: Mencerminkan bentuk aoristus sebagai tindakan yang dinyatakan telah terjadi, sambil membiarkan kemungkinan fungsi lampau profetis tanpa mengubahnya menjadi bentuk masa depan.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan Indonesia yang baku untuk gelar κύριος dalam konteks ini; identitas rujukannya tidak diperjelas melampaui teks.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: bersama puluhan ribu orang kudus-Nya
  rationale: ἐν dipahami secara asosiatif sebagai “bersama”; μυριάσιν menunjuk jumlah puluhan ribu atau bala besar, sedangkan ἁγίαις tidak secara eksplisit menyebut malaikat.
theological_decisions:
- issue: Identitas “Tuhan” dalam kutipan Henokh
  choice: Diterjemahkan hanya sebagai “Tuhan” tanpa menentukan apakah yang dimaksud adalah Allah secara umum atau Yesus.
  alternative: Menafsirkannya secara eksplisit sebagai Allah dalam konteks kitab Henokh atau sebagai Yesus dalam penerapan Yudas.
  rationale: Teks Yunani hanya memakai κύριος; terjemahan mempertahankan ketegangan referensial tersebut.
- issue: Status kutipan yang bergaung dengan 1 Henokh 1:9
  choice: Disajikan sebagai nubuat Henokh, sebagaimana dinyatakan Yudas, tanpa komentar kanonis dalam teks utama.
  alternative: Menyebutnya secara eksplisit sebagai kutipan kitab 1 Henokh atau sebagai tradisi lisan semata.
  rationale: Ayat ini menyatakan bahwa Henokh bernubuat, tetapi tidak membuat penjelasan eksplisit mengenai status kanonis sumber kutipan.
- issue: Waktu kedatangan Tuhan dalam ἦλθεν
  choice: “telah datang,” mempertahankan bentuk lampau Yunani.
  alternative: “akan datang,” dengan memahami aoristus sebagai lampau profetis.
  rationale: Bentuk sumber adalah aoristus indikatif. Terjemahan tidak diam-diam mengubahnya menjadi masa depan, meskipun konteks nubuat memungkinkan daya profetis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Henokh” mengikuti bentuk nama Alkitab Indonesia. Susunan kalimat dipecah agar wajar dibaca. “Lihatlah” mempertahankan nada profetis; “orang kudus-Nya” menjaga ketidakjelasan sumber mengenai identitas bala kudus itu.
