  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: id
  text: Saya ingin mengingatkan kalian[a], walaupun kalian sudah mengetahui semua ini sekali untuk selamanya, bahwa Yesus, setelah menyelamatkan suatu umat dari tanah Mesir, kemudian membinasakan orang-orang yang tidak percaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Tuhan” atau “Allah”, bukan “Yesus”.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: saya ingin mengingatkan
  rationale: Ungkapan ini menyatakan kehendak penulis untuk mengingatkan pembaca akan hal yang telah mereka ketahui. Susunan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak terdapat dalam sumber.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dan kontras ringan dengan uraian sebelumnya. “Namun” mempertahankan hubungan wacana tersebut tanpa menjadikannya kontras yang terlalu tajam.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: sekalipun kamu sudah mengetahui semuanya untuk seterusnya
  rationale: 'Partisipel dipahami secara konsesif: Yudas mengingatkan pembaca walaupun mereka sudah tahu. πάντα diterjemahkan “semuanya” untuk mempertahankan keluasan ungkapan, sedangkan ἅπαξ dipahami sebagai pengetahuan yang telah diterima secara tuntas dan berlaku seterusnya.'
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Teks sumber SBLGNT berbunyi Ἰησοῦς. Terjemahan langsung “Yesus” mempertahankan daya kristologis pernyataan itu; varian “Tuhan” dan “Allah” dicatat dalam catatan kaki.
- source_word: λαὸν
  choice: suatu umat
  rationale: Nomina ini tidak berartikel dan merujuk secara kolektif kepada Israel. “Suatu umat” mempertahankan bentuk tak tentu tanpa memakai istilah teknis yang tidak perlu.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: dari tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur γῆς serta gema bahasa keluaran, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: σώσας
  choice: setelah menyelamatkan
  rationale: Partisipel aoris menunjukkan tindakan yang mendahului kata kerja utama. “Setelah menyelamatkan” menyatakan urutan tersebut dengan jelas dan alami.
- source_word: τὸ δεύτερον
  choice: kemudian
  rationale: Dalam konteks ini ungkapan tersebut menunjukkan tindakan berikutnya sesudah penyelamatan. “Kemudian” menyampaikan urutan temporal tanpa menghasilkan ungkapan harfiah yang kaku.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: orang-orang yang tidak percaya
  rationale: Terjemahan ini langsung dan mempertahankan kegagalan untuk percaya sebagai ciri kelompok yang dihakimi.
- source_word: ἀπώλεσεν
  choice: membinasakan
  rationale: Kata ini menyatakan penghukuman yang berat. “Membinasakan” mempertahankan kekuatan maknanya dan sesuai dengan ragam Alkitabiah yang tetap dipahami pembaca modern.
theological_decisions:
- issue: Subjek kristologis dalam peristiwa keluaran
  choice: Yesus dalam teks utama
  alternative: Tuhan atau Allah
  rationale: Sumber Yunani yang diberikan membaca Ἰησοῦς. Karena itu, teks utama menyebut “Yesus” dan tidak melemahkan ketegangan teologis yang mengaitkan Yesus dengan tindakan penyelamatan dan penghukuman pada zaman keluaran. Varian naskah yang penting dicantumkan dalam catatan kaki.
- issue: Lingkup πάντα dan hubungan ἅπαξ
  choice: semuanya untuk seterusnya
  alternative: semua ini sekali dahulu
  rationale: Pilihan utama mempertahankan keluasan πάντα dan menghubungkan ἅπαξ dengan pengetahuan yang telah diterima secara tuntas. Alternatif temporal “pernah” tetap mungkin secara gramatikal, sehingga terjemahan tidak boleh dijadikan dasar untuk menghapus ambiguitas sepenuhnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kamu” dipakai sebagai bentuk jamak kontekstual yang lazim dalam terjemahan modern. Tanda pisah membantu pembaca mengikuti sisipan konsesif tanpa mengubah struktur argumen.
