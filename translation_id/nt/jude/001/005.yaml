  to: Saya ingin mengingatkan kalian[a], walaupun kalian sudah mengetahui semua ini sekali untuk selamanya, bahwa Yesus, setelah menyelamatkan suatu umat dari tanah Mesir, kemudian membinasakan orang-orang yang tidak percaya.
