id: JUD.1.6
reference: Jude 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: id
  text: Dan para malaikat yang tidak mempertahankan kedudukan mereka sendiri[a], tetapi meninggalkan kediaman mereka sendiri, telah ditahan-Nya dengan belenggu kekal di bawah kegelapan pekat[b] untuk penghakiman pada hari yang agung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wilayah kekuasaan mereka sendiri” atau “wewenang mereka sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di bawah kegelapan” atau “di bawah kesuraman”; kata Yunani ini menggambarkan kegelapan yang dalam dan pekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: malaikat-malaikat
  rationale: Dalam konteks penghukuman ini, istilah tersebut paling wajar menunjuk kepada makhluk surgawi, bukan utusan manusia.
- source_word: τηρήσαντας / τετήρηκεν
  choice: tidak mempertahankan / telah ditahan-Nya
  rationale: 'Kedua bentuk berasal dari verba yang sama, tetapi padanan Indonesia yang persis sama akan terasa janggal. Pilihan ini tetap menampilkan kontras: mereka tidak mempertahankan kedudukan mereka, sedangkan Allah menahan mereka untuk penghakiman.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: kedudukan mereka sendiri
  rationale: ἀρχή dapat berarti kekuasaan, kedudukan, atau ranah. 'Kedudukan' cukup luas untuk menunjukkan posisi atau lingkup yang ditetapkan tanpa memastikan tafsiran tertentu.
- source_word: ἀπολιπόντας
  choice: meninggalkan
  rationale: Padanan ini jelas dan alami, serta tetap menyampaikan tindakan meninggalkan tempat yang semestinya mereka huni.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: tempat kediaman mereka sendiri
  rationale: οἰκητήριον berarti tempat tinggal atau kediaman, sedangkan ἴδιον menekankan bahwa tempat itu adalah milik atau bagian mereka sendiri.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: untuk penghakiman pada hari yang agung
  rationale: εἰς menyatakan tujuan atau arah menuju penghakiman. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan makna temporal 'sampai' yang tidak dinyatakan secara langsung.
- source_word: δεσμοῖς ἀϊδίοις
  choice: dengan belenggu kekal
  rationale: '''Belenggu'' mempertahankan gambaran penahanan, sedangkan ''kekal'' merupakan padanan baku dan lugas bagi ἀΐδιος.'
- source_word: ὑπὸ ζόφον
  choice: dalam kegelapan pekat
  rationale: ζόφος menunjuk pada kegelapan atau kesuraman yang sangat dalam. 'Dalam' lebih alami daripada terjemahan harfiah 'di bawah' dalam konstruksi Indonesia ini.
- source_word: τε
  choice: Dan
  rationale: Kata penghubung ini mengaitkan contoh para malaikat dengan rangkaian contoh penghukuman sebelumnya.
theological_decisions:
- issue: Makna pelanggaran para malaikat
  choice: Teks menyatakan bahwa para malaikat tidak mempertahankan kedudukan mereka dan meninggalkan tempat kediaman mereka, tanpa menjelaskan lebih jauh hakikat kedudukan atau peristiwa yang dimaksud.
  alternative: Menentukan secara eksplisit bahwa ayat ini merujuk pada Kejadian 6 atau pada suatu pemberontakan purba para malaikat secara umum.
  rationale: Surat Yudas tampaknya mengacu pada tradisi yang dikenal pembacanya, tetapi ayat Yunani ini sendiri tidak menguraikan latarnya. Terjemahan tidak boleh memasukkan satu rekonstruksi tertentu ke dalam teks utama.
- issue: Daya makna ἀΐδιος
  choice: kekal
  alternative: abadi; untuk selama-lamanya
  rationale: '''Kekal'' menyatakan kelanggengan yang dikandung kata Yunani itu dengan istilah Indonesia yang baku, tanpa memperluas pernyataan teologis ayat.'
- issue: Pelaku τετήρηκεν
  choice: telah ditahan-Nya
  alternative: Ia telah menahan
  rationale: Subjek tersirat dipahami sebagai Allah dari konteks. Akhiran '-Nya' menyampaikan hal itu secara alami tanpa menambahkan nama Allah ke dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan nada penghakiman serta ketegangan makna ἀρχή, sambil menghindari penjelasan denominatif. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
