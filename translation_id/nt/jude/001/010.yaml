  to: Namun, orang-orang ini mencela segala sesuatu yang tidak mereka pahami[a]. Sedangkan apa pun yang mereka ketahui secara naluriah, seperti binatang yang tidak berakal[b], dalam hal-hal itulah mereka dibinasakan[c].
