id: JUD.1.10
reference: Jude 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: id
  text: Namun, orang-orang ini mencela segala sesuatu yang tidak mereka pahami[a]. Sedangkan apa pun yang mereka ketahui secara naluriah, seperti binatang yang tidak berakal[b], dalam hal-hal itulah mereka dibinasakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala sesuatu yang tidak mereka ketahui.” Kata yang diterjemahkan “mencela” juga dapat berarti “menghujat” atau “memfitnah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “apa saja yang secara alami mereka ketahui, seperti binatang yang tidak bernalar.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “melalui hal-hal itulah mereka dibinasakan” atau “dalam hal-hal itulah mereka menjadi rusak.”'
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: οὗτοι
  choice: orang-orang ini
  rationale: Menunjuk kepada para penyusup yang sedang dikecam dalam konteks; ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan jenis kelamin yang tidak dinyatakan oleh bentuk Yunani.
- source_word: βλασφημοῦσιν
  choice: menghujat
  rationale: Kata ini berarti berbicara secara menghina atau mencela, baik terhadap pribadi maupun perkara yang sakral. 'Menghujat' mempertahankan bobot ungkapan Yunani, tanpa membatasi objeknya hanya kepada Allah.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: segala sesuatu yang tidak mereka pahami
  rationale: Dalam kontras dengan pengetahuan naluriah pada klausa berikutnya, 'pahami' mengungkapkan kekurangan pengertian, bukan sekadar ketiadaan informasi.
- source_word: φυσικῶς
  choice: secara naluriah
  rationale: Perbandingan dengan binatang menunjukkan pengetahuan yang berasal dari naluri alami, bukan dari penalaran; ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: ἄλογα ζῷα
  choice: binatang yang tidak berakal
  rationale: ἄλογα menekankan tidak adanya kemampuan bernalar; terjemahan ini alami, bermartabat, dan mempertahankan kontras dengan pemahaman sejati.
- source_word: ἐπίστανται
  choice: mereka ketahui
  rationale: Kata ini menunjuk pada pengetahuan atau pengenalan yang mereka miliki secara alami. 'Ketahui' menjaga variasi leksikal terhadap 'pahami' sekaligus mempertahankan kontrasnya.
- source_word: ἐν τούτοις
  choice: melalui hal-hal itulah
  rationale: Frasa ini dapat dipahami secara lokatif ('dalam hal-hal itu') atau instrumental ('melalui hal-hal itu'). Terjemahan utama memakai nuansa instrumental, tetapi ambiguitas dicatat dalam catatan kaki.
- source_word: φθείρονται
  choice: mereka membinasakan diri
  rationale: Bentuk ini dapat menyatakan kebinasaan atau kerusakan, dengan kemungkinan nuansa medial bahwa perilaku mereka membawa kehancuran atas diri sendiri. Terjemahan ini mempertahankan daya penghakimannya tanpa meniadakan alternatif pasif.
theological_decisions:
- issue: Makna βλασφημέω ketika objeknya tidak secara eksplisit ilahi
  choice: menghujat
  alternative: mencela; memfitnah
  rationale: '''Menghujat'' mempertahankan beratnya kecaman dan rentang makna berupa ucapan yang menghina, tetapi catatan kaki mencegah pembaca menganggap bahwa objeknya harus secara khusus Allah.'
- issue: Daya φθείρονται
  choice: mereka membinasakan diri
  alternative: mereka dibinasakan; mereka menjadi rusak
  rationale: Bentuk Yunani dapat dibaca sebagai pasif atau medial dan mencakup gagasan kerusakan serta kebinasaan. Terjemahan utama menampilkan akibat yang menimpa diri mereka melalui apa yang mereka ikuti, sementara alternatif dipertahankan dalam catatan kaki.
- issue: Hubungan ἐν τούτοις dengan φθείρονται
  choice: melalui hal-hal itulah
  alternative: dalam hal-hal itulah
  rationale: Nuansa instrumental sesuai dengan gagasan bahwa pengetahuan naluriah yang mereka ikuti menjadi sarana kehancuran mereka, tetapi konstruksi Yunani juga memungkinkan nuansa lingkup atau ranah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada polemis yang tegas namun tetap bermartabat. Struktur μὲν ... δὲ ditampilkan sebagai kontras antara apa yang tidak mereka pahami dan apa yang hanya mereka ketahui secara naluriah. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
