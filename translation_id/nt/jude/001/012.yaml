id: JUD.1.12
reference: Jude 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: id
  text: Mereka ini adalah batu-batu karang tersembunyi dalam perjamuan kasih kalian[a]. Mereka berpesta bersama tanpa rasa takut sambil menggembalakan diri sendiri[b]. Mereka bagaikan awan tanpa air yang dibawa ke sana kemari oleh angin; pohon-pohon musim gugur yang tidak berbuah, dua kali mati[c], dan tercabut sampai ke akar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “noda-noda” atau “cela-cela” dalam perjamuan kasih kalian. Kata Yunani ini dapat dipahami secara moral, tetapi juga dapat menunjuk pada batu karang berbahaya; arti yang terakhir sesuai dengan rangkaian gambaran hidup dalam ayat ini.
    reason: alternative_reading
  - marker: b
    text: “Menggembalakan diri sendiri” juga dapat diterjemahkan “memberi makan diri sendiri,” yang menonjolkan sikap mereka yang mementingkan diri. Bandingkan Yehezkiel 34 mengenai para gembala yang memberi makan diri sendiri, bukan kawanan domba.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: Ungkapan harfiahnya adalah “dua kali mati.” Teks tidak menjelaskan secara langsung dalam arti apa kematian itu terjadi dua kali.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: σπιλάδες
  choice: batu-batu karang tersembunyi
  rationale: Kata ini dapat menunjuk pada batu karang berbahaya di laut dan membentuk gambaran tentang bahaya yang tidak disadari di tengah perjamuan jemaat. Kemungkinan makna moral ‘noda’ atau ‘cela’ dipertahankan dalam catatan kaki.
- source_word: ἀγάπαις
  choice: perjamuan kasih
  rationale: Bentuk jamak ini dalam konteks tersebut merujuk pada perjamuan bersama umat Kristen yang menjadi ungkapan kasih. ‘Perjamuan kasih’ merupakan istilah Indonesia yang ringkas dan tetap mempertahankan hubungan leksikal dengan kasih.
- source_word: συνευωχούμενοι
  choice: berpesta bersama
  rationale: Partisip ini menyatakan bahwa mereka turut menikmati perjamuan bersama orang lain. Pilihan ini mencerminkan unsur kebersamaan tanpa menambahkan objek yang tidak dinyatakan secara eksplisit.
- source_word: ἀφόβως
  choice: tanpa rasa takut
  rationale: Terjemahan langsung ini mempertahankan kemungkinan nuansa tidak gentar, tidak tahu malu, atau tidak memiliki rasa hormat tanpa memilih salah satunya secara berlebihan.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: menggembalakan diri sendiri
  rationale: Terjemahan ini mempertahankan metafora gembala dalam ποιμαίνω serta gema kemungkinan terhadap Yehezkiel 34, meskipun dalam konteks ini ungkapan tersebut juga dapat berarti ‘memberi makan diri sendiri’.
- source_word: νεφέλαι ἄνυδροι
  choice: awan tanpa air
  rationale: Ungkapan konkret ini mempertahankan gambaran tentang sesuatu yang tampaknya menjanjikan hujan, tetapi tidak memberi apa-apa.
- source_word: παραφερόμεναι
  choice: dibawa ke sana kemari
  rationale: Bentuk pasif ini menggambarkan awan yang digerakkan oleh kekuatan dari luar; ‘ke sana kemari’ menyampaikan gerak yang tidak tetap secara alami dalam bahasa Indonesia.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: pohon-pohon musim gugur yang tidak berbuah
  rationale: Pilihan ini mempertahankan musim dan ketiadaan buah sebagai unsur konkret dalam metafora, tanpa mengubahnya menjadi penjelasan abstrak.
- source_word: δὶς ἀποθανόντα
  choice: dua kali mati
  rationale: Ungkapan retoris yang mencolok ini diterjemahkan secara langsung agar ketegangan dan daya gambarnya tidak dilunakkan menjadi sekadar ‘mati sepenuhnya’.
- source_word: ἐκριζωθέντα
  choice: tercabut sampai ke akar
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menegaskan keadaan mati yang tuntas serta tidak dapat menghasilkan buah lagi.
theological_decisions:
- issue: Makna σπιλάδες sebagai gambaran bagi para pengajar sesat
  choice: batu-batu karang tersembunyi yang membahayakan persekutuan
  alternative: noda atau cela dalam perjamuan kasih
  rationale: Rangkaian gambaran alam dalam ayat ini mendukung arti batu karang berbahaya. Namun, karena makna moral ‘noda/cela’ memiliki dasar leksikal dan tradisi penerjemahan yang panjang, kemungkinan itu tidak dihapus, melainkan dicatat.
- issue: Daya metaforis ποιμαίνοντες dalam ἑαυτοὺς ποιμαίνοντες
  choice: mempertahankan metafora ‘menggembalakan diri sendiri’
  alternative: memberi makan diri sendiri
  rationale: Kata kerja Yunani ini biasanya berarti menggembalakan. Mempertahankan metafora membiarkan pembaca menangkap kritik terhadap pemimpin yang mementingkan diri dan kemungkinan gema Yehezkiel 34, tanpa mempersempitnya hanya pada tindakan makan.
- issue: Arti ungkapan δὶς ἀποθανόντα
  choice: dua kali mati
  alternative: mati sepenuhnya
  rationale: Teks Yunani menggunakan ungkapan paradoks yang kuat. Terjemahan tidak menjelaskan bagaimana kedua kematian itu harus dipahami, sehingga ambiguitas retoris dan ketegangan teologisnya tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan gambaran konkret yang mudah dipahami. Kata ganti jamak ‘kalian’ dipakai untuk memperjelas bahwa ὑμῶν menunjuk kepada komunitas. Tanda baca membagi rangkaian metafora yang panjang tanpa memutus hubungan antargambar.
