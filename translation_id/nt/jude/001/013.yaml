base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: id
  text: ombak-ombak laut yang ganas, yang memuntahkan buih aib mereka sendiri[a]; bintang-bintang yang mengembara, bagi mereka telah disediakan kelamnya kegelapan[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang mengeluarkan aib mereka sendiri” atau “yang memuntahkan buih perbuatan-perbuatan mereka yang memalukan.” Bentuk jamak Yunani dapat menunjuk pada kehinaan itu sendiri atau pada perbuatan memalukan yang menyingkapkan mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pekelnya kegelapan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: ombak-ombak laut yang ganas
  rationale: Mempertahankan metafora yang hidup serta arti κύματα sebagai ombak, ἄγρια sebagai ganas/liar, dan θαλάσσης sebagai laut, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἐπαφρίζοντα
  choice: yang membuihkan
  rationale: Partisipel kini ini menggambarkan tindakan terus-menerus menghasilkan atau memuntahkan buih; 'membuihkan' mempertahankan hubungan langsung dengan objek berikutnya.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: aib mereka sendiri
  rationale: αἰσχύνη dapat berarti rasa malu, kehinaan, atau perbuatan memalukan. 'Aib' cukup luas untuk mempertahankan ketaksaan itu, sedangkan 'mereka sendiri' mencerminkan penekanan ἑαυτῶν. Bentuk tunggal kolektif lebih wajar dalam bahasa Indonesia daripada 'aib-aib'.
- source_word: ἀστέρες πλανῆται
  choice: bintang-bintang yang mengembara
  rationale: Mengungkapkan makna harfiah πλανῆται tanpa memasukkan pengertian astronomis modern dari kata 'planet', serta mempertahankan metafora tentang orang-orang yang menyimpang.
- source_word: οἷς
  choice: yang bagi mereka
  rationale: Pronomina relatif datif ini mengacu kepada orang-orang yang digambarkan sebagai bintang; bentuk personal 'bagi mereka' mempertahankan acuan tersebut.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: kelamnya kegelapan
  rationale: Mempertahankan konstruksi genitif dan daya penguatan gabungan ζόφος dengan σκότος. Ungkapan ini puitis tetapi tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: εἰς αἰῶνα
  choice: untuk selama-lamanya
  rationale: Dalam konteks penghakiman ini, frasa tersebut secara idiomatis menyatakan durasi tanpa akhir; 'untuk selama-lamanya' mempertahankan bobot peringatannya.
- source_word: τετήρηται
  choice: telah disediakan
  rationale: Perfek pasif menunjukkan sesuatu yang sudah disimpan atau diperuntukkan dan tetap tersedia. Dalam konteks hukuman, 'telah disediakan' lebih alami daripada 'telah disimpan' tanpa mengubah citra menjadi keputusan yang lebih spesifik.
theological_decisions:
- issue: Durasi gambaran penghakiman dalam εἰς αἰῶνα
  choice: untuk selama-lamanya
  alternative: untuk zaman itu
  rationale: Dalam konteks penghakiman Surat Yudas, frasa ini paling wajar menyatakan keberlangsungan tanpa akhir. Terjemahan ini menjaga kerasnya peringatan tanpa menambahkan uraian doktrinal di luar teks.
- issue: Acuan personal dalam οἷς
  choice: yang bagi mereka
  alternative: yang baginya
  rationale: Bintang-bintang merupakan metafora bagi para pengajar fasik yang dibicarakan dalam konteks; bentuk personal jamak mempertahankan acuan itu tanpa menghapus metaforanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan citra laut, buih, bintang, dan kegelapan dipertahankan. Bentuk 'aib' dipakai secara kolektif agar alami, sementara catatan kaki mempertahankan ketaksaan dan bentuk jamak sumber Yunani.
