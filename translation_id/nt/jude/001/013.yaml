    rationale: Dalam bahasa Indonesia, membuihkan biasanya berarti menyebabkan sesuatu menjadi berbuih; objek “aib” menghasilkan gambaran yang tidak alami. ἐπαφρίζοντα secara metaforis menggambarkan ombak yang mengeluarkan atau memuntahkan buih berupa aib mereka.
  - severity: low
