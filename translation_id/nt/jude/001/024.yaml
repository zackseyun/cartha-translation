  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: id
  text: Bagi Dia yang sanggup menjaga kalian agar tidak tersandung[a] dan menghadirkan kalian tanpa cela[b] di hadapan kemuliaan-Nya dengan sukacita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “agar tidak jatuh.” Kata Yunani ἀπταίστους mengandung pengertian tidak tersandung atau tidak jatuh.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak bercacat.” Kata Yunani ἀμώμους dapat pula membangkitkan gambaran tentang sesuatu yang tanpa cacat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Bagi Dia yang sanggup
  rationale: Bentuk partisip berartikel dalam datif mengawali tujuan pujian yang berlanjut pada ayat 25. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kemampuan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan menuju doksologi penutup. Dalam bahasa Indonesia, peralihannya sudah jelas dari susunan kalimat sehingga kata penghubung tambahan tidak diperlukan.
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: menjaga kalian agar tidak tersandung
  rationale: Ungkapan ini mempertahankan citra dasar ἀπταίστους, yaitu tidak tersandung atau jatuh, sekaligus membentuk konstruksi Indonesia yang wajar setelah verba 'menjaga'.
- source_word: καὶ στῆσαι
  choice: dan menghadirkan
  rationale: Walaupun arti harfiahnya ialah membuat berdiri, konteks menghadapkan seseorang di hadapan kemuliaan ilahi mendukung makna 'menghadirkan' tanpa menghilangkan hasil berupa berdiri di hadapan-Nya.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: di hadapan kemuliaan-Nya
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan tidak mengembangkan δόξα menjadi frasa interpretatif seperti 'hadirat-Nya yang mulia'.
- source_word: ἀμώμους
  choice: tanpa cela
  rationale: Pilihan ini mudah dipahami dan dapat mencakup baik ketidakbercelaan moral maupun gema persembahan yang tanpa cacat.
- source_word: ἐν ἀγαλλιάσει
  choice: dengan sukacita
  rationale: ἀγαλλίασις menunjuk pada kegembiraan yang meluap. 'Dengan sukacita' alami dan tidak menambahkan penguat yang tidak eksplisit dalam teks.
theological_decisions:
- issue: Makna τῆς δόξης αὐτοῦ
  choice: kemuliaan-Nya
  alternative: hadirat-Nya yang mulia
  rationale: Teks Yunani secara eksplisit menyebut 'kemuliaan-Nya'. Pilihan ini menjaga bobot teologis istilah tersebut dan menghindari perluasan tafsir.
- issue: Cakupan ἀπταίστους
  choice: agar tidak tersandung
  alternative: agar tidak jatuh
  rationale: Citra tersandung dipertahankan tanpa mempersempitnya menjadi kegagalan moral sehari-hari atau kemurtadan akhir.
- issue: Nuansa ἀμώμους
  choice: tanpa cela
  alternative: tidak bercacat
  rationale: Pilihan utama terdengar alami dalam bahasa Indonesia dan tetap membuka nuansa etis maupun kultis dari istilah Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menandai bentuk orang kedua jamak ὑμᾶς. Ayat dibiarkan berakhir dengan koma karena konstruksi doksologinya berlanjut ke ayat 25.
