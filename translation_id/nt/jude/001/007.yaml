id: JUD.1.7
reference: Jude 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: id
  text: Sama seperti Sodom dan Gomora serta kota-kota di sekitarnya, yang melakukan percabulan dengan cara yang sama seperti mereka[a] dan mengejar daging yang lain[b], ditampilkan sebagai contoh dengan menjalani hukuman api kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” dapat merujuk kepada para malaikat yang disebut dalam ayat sebelumnya atau, secara lebih umum, kepada contoh-contoh pemberontakan dan penghakiman yang telah disebutkan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “daging yang berbeda”; secara tradisional, “daging yang asing”. Frasa ini dibiarkan harfiah agar tidak dibatasi pada satu penafsiran tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: sama seperti
  rationale: Menandai perbandingan dengan contoh-contoh sebelumnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sodom dan Gomora
  rationale: Menggunakan bentuk nama tempat yang sudah baku dalam bahasa Indonesia.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: kota-kota di sekitarnya
  rationale: Menyampaikan hubungan geografis yang dinyatakan oleh περὶ dengan akusatif.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: dengan cara serupa dengan mereka
  rationale: Mempertahankan unsur perbandingan dan pronomina τούτοις tanpa menentukan secara paksa siapa rujukannya.
- source_word: ἐκπορνεύσασαι
  choice: melakukan percabulan
  rationale: Mengungkapkan tindakan seksual amoral secara langsung, jelas, dan bermartabat tanpa mempersempit maknanya.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: mengejar
  rationale: Menyampaikan idiom mengikuti atau memburu sesuatu sebagai tujuan keinginan.
- source_word: σαρκὸς ἑτέρας
  choice: daging yang lain
  rationale: Menerjemahkan frasa secara dekat dan mempertahankan ketidakpastian mengenai rujukan tepatnya.
- source_word: πρόκεινται δεῖγμα
  choice: ditampilkan sebagai contoh
  rationale: Menyampaikan gagasan bahwa mereka berada di hadapan umum sebagai contoh atau peringatan.
- source_word: πυρὸς αἰωνίου δίκην ὑπέχουσαι
  choice: dengan menjalani hukuman api kekal
  rationale: Mempertahankan bahasa yudisial δίκη dan ungkapan πυρὸς αἰωνίου tanpa memperluasnya menjadi rumusan doktrinal.
theological_decisions:
- issue: Rujukan τούτοις dalam τὸν ὅμοιον τρόπον τούτοις
  choice: Mempertahankan perbandingan secara eksplisit sebagai “dengan cara serupa dengan mereka”.
  alternative: Menggunakan “demikian pula” tanpa pronomina, atau menetapkan bahwa “mereka” adalah para malaikat pada ayat 6.
  rationale: Bahasa Yunani memuat pronomina, tetapi antesedennya dapat dipahami sebagai para malaikat pada ayat sebelumnya atau secara lebih umum sebagai contoh-contoh pemberontakan dan penghakiman terdahulu.
- issue: Makna σαρκὸς ἑτέρας
  choice: Menerjemahkan secara harfiah sebagai “daging yang lain”.
  alternative: “daging yang berbeda”, atau penjelasan interpretatif yang mengkhususkan jenis pelanggarannya.
  rationale: Frasa Yunani tidak dengan sendirinya menetapkan satu penafsiran khusus; terjemahan literal mempertahankan ketegangan penafsirannya.
- issue: Daya ungkap πυρὸς αἰωνίου
  choice: Mempertahankan ungkapan “api kekal”.
  alternative: “api abadi”.
  rationale: Ini menerjemahkan ungkapan sumber secara langsung tanpa melunakkan atau mengembangkannya melampaui pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap dekat dengan hubungan gramatikal teks Yunani, sedangkan catatan kaki mempertahankan dua ambiguitas penting tanpa memaksakan penafsiran denominasi tertentu.
