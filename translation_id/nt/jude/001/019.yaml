  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: id
  text: Merekalah orang-orang yang menimbulkan perpecahan[a], yang hidup menurut dorongan alamiah[b], dan yang tidak memiliki Roh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memisahkan diri” atau “membuat perpecahan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang alamiah” atau “yang tidak rohani.”
    reason: lexical_alternative
  - marker: c
    text: Atau “roh”; namun, dalam konteks ini kemungkinan besar yang dimaksud adalah Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Merekalah
  rationale: Kata tunjuk ini merujuk kembali kepada para penyusup yang telah dibicarakan. Bentuk “Merekalah” alami dalam bahasa Indonesia dan mempertahankan penekanan identifikasinya.
- source_word: οἱ ἀποδιορίζοντες
  choice: orang-orang yang menimbulkan perpecahan
  rationale: Partisipel ini menggambarkan tindakan mereka sebagai penyebab perpecahan. Makna refleksif, yaitu memisahkan diri, tetap mungkin dan dicatat dalam catatan kaki.
- source_word: ψυχικοί
  choice: yang hidup menurut naluri duniawi
  rationale: ψυχικοί menunjuk kepada orang yang hanya digerakkan oleh kehidupan alamiah manusia, berlawanan dengan kehidupan oleh Roh. Ungkapan ini lebih jelas daripada terjemahan harfiah “alamiah” dan tidak menyiratkan bahwa tubuh atau dunia ciptaan pada dirinya jahat.
- source_word: πνεῦμα
  choice: Roh
  rationale: Dalam pertentangannya dengan ψυχικοί dan dalam konteks nasihat berikutnya, πνεῦμα paling mungkin merujuk kepada Roh Kudus. Huruf kapital menandai pemahaman tersebut, sementara kemungkinan “roh” dipertahankan dalam catatan kaki.
- source_word: μὴ ἔχοντες
  choice: tidak memiliki
  rationale: Terjemahan langsung dan wajar bagi partisipel negatif, dengan subjek yang sama seperti dua gambaran sebelumnya.
theological_decisions:
- issue: Rujukan πνεῦμα
  choice: Roh Kudus, ditampilkan sebagai “Roh”
  alternative: roh, mungkin dalam arti dimensi atau kehidupan rohani
  rationale: Pertentangan langsung dengan ψυχικοί paling wajar dipahami sebagai perbedaan antara orang yang hidup menurut naluri alamiah dan orang yang memiliki Roh Kudus. Namun, karena nomina Yunani tidak memakai artikel dan secara leksikal dapat berarti “roh”, alternatif itu dicatat tanpa dipaksakan ke dalam teks utama.
- issue: Arah tindakan οἱ ἀποδιορίζοντες
  choice: menimbulkan perpecahan
  alternative: memisahkan diri
  rationale: Konteks kecaman terhadap para penyusup mendukung tindakan yang memecah komunitas, tetapi bentuk leksikalnya juga dapat dipahami sebagai tindakan memisahkan diri; ambiguitas ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan tiga ciri dipertahankan, sementara frasa “hidup menurut naluri duniawi” dipakai agar ψυχικοί dapat dipahami pembaca umum tanpa menghilangkan kontrasnya dengan Roh.
