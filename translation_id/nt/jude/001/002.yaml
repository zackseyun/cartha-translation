  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: id
  text: Kiranya belas kasih dan damai dan kasih semakin berlimpah atas kalian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semakin bertambah” atau “dilipatgandakan.”
    reason: Alternatif leksikal untuk πληθυνθείη; “dilipatgandakan” mempertahankan metafora peningkatan secara lebih harfiah.
lexical_decisions:
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Padanan baku dan alami untuk ἔλεος yang mempertahankan unsur kemurahan serta kepedulian kepada pihak yang membutuhkan.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Datif dalam rumusan berkat menyatakan pihak yang menerima berkat; “bagi kalian” alami dalam bahasa Indonesia dan menegaskan bahwa sapaan ditujukan kepada pembaca secara jamak.
- source_word: εἰρήνη
  choice: damai
  rationale: “Damai” mempertahankan keluasan makna εἰρήνη tanpa mempersempitnya menjadi sekadar ketenangan batin atau memperluasnya secara eksplisit menjadi kesejahteraan.
- source_word: ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan yang lazim, bermartabat, dan sesuai dengan pemakaian ἀγάπη dalam konteks Perjanjian Baru.
- source_word: πληθυνθείη
  choice: kiranya ... dilipatgandakan
  rationale: “Kiranya” menyatakan daya optatif berupa harapan atau berkat, sedangkan “dilipatgandakan” mempertahankan gambaran peningkatan yang kuat pada verba sumber.
- source_word: καὶ ... καὶ ... καὶ
  choice: dan ... dan ... dan
  rationale: Pengulangan “dan” dipertahankan untuk mencerminkan susunan retoris dan irama khidmat teks Yunani.
theological_decisions:
- issue: Daya optatif dalam rumusan berkat
  choice: Kiranya ... dilipatgandakan bagi kalian.
  alternative: Semoga ... semakin berlimpah bagi kalian.
  rationale: “Kiranya” secara wajar mengungkapkan harapan berkat tanpa mengubahnya menjadi pernyataan kepastian, sedangkan bentuk pasif mempertahankan keterbukaan teks sumber mengenai pelaku yang melipatgandakannya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti “kalian” dipakai untuk menandai bentuk jamak ὑμῖν. Pengulangan konjungsi sengaja dipertahankan meskipun daftar dengan koma akan terasa lebih lazim dalam prosa Indonesia.
