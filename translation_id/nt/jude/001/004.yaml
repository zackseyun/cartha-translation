  to: Sebab beberapa orang telah menyusup tanpa diketahui[a], yaitu orang-orang fasik yang sejak dahulu telah dituliskan sebelumnya untuk penghakiman ini[b]. Mereka mengubah anugerah Allah kita menjadi kebejatan[c] dan menyangkal satu-satunya Penguasa dan Tuhan kita, Yesus Sang Mesias[d].
