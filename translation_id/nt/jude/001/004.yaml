  naturalness: Bahasa Indonesia baku dan jelas. “Kebejatan” lebih tepat dan lebih alami dalam konteks ini daripada “hidup dalam hawa nafsu,” karena ἀσέλγεια menunjuk pada perilaku tidak terkendali dan tidak tahu malu, bukan sekadar dorongan nafsu.
