id: JUD.1.4
reference: Jude 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: id
  text: Sebab beberapa orang telah menyusup tanpa diketahui[a], yaitu orang-orang fasik yang sejak dahulu telah dituliskan sebelumnya untuk penghakiman ini[b]. Mereka mengubah anugerah Allah kita menjadi kebejatan[c] dan menyangkal satu-satunya Penguasa dan Tuhan kita, Yesus Sang Mesias[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah menyelinap masuk tanpa diketahui.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sejak dahulu telah ditulis sebelumnya untuk penghakiman ini.” Ungkapan ini juga dapat dipahami sebagai “sejak dahulu telah ditandai untuk penghakiman ini.”
    reason: alternative_reading
  - marker: c
    text: Atau “kelakuan tanpa kendali,” “kehidupan bejat,” atau “percabulan.” Kata Yunaninya menunjuk pada perilaku yang tidak tahu malu dan memuaskan hawa nafsu.
    reason: lexical_alternative
  - marker: d
    text: 'Bahasa Yunani: “Yesus Kristus.” Di sini Χριστός diterjemahkan “Sang Mesias” karena dipahami sebagai gelar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: telah menyusup tanpa diketahui
  rationale: Mengungkapkan masuknya orang-orang itu secara diam-diam sehingga kehadiran dan maksud mereka tidak disadari, dengan bentuk lampau yang hasilnya masih menjadi ancaman kini.
- source_word: πάλαι προγεγραμμένοι
  choice: sejak dahulu telah dituliskan sebelumnya
  rationale: Mempertahankan citra dasar 'ditulis sebelumnya' dan acuan waktunya tanpa mempertegasnya menjadi penetapan kekal atau predestinasi individual.
- source_word: κρίμα
  choice: penghakiman
  rationale: Istilah ini cukup luas untuk mencakup keputusan hukum maupun penghukuman yang dihasilkannya tanpa menutup ambiguitas Yunani.
- source_word: ἀσεβεῖς
  choice: orang-orang fasik
  rationale: Padanan Indonesia yang wajar dan berbobot untuk orang yang tidak menghormati Allah, serta merujuk kembali kepada orang-orang yang menyusup.
- source_word: χάριτα
  choice: anugerah
  rationale: Padanan teologis yang lazim dan mudah dipahami untuk kemurahan Allah yang diberikan secara cuma-cuma.
- source_word: μετατιθέντες
  choice: mengubah ... menjadi alasan untuk
  rationale: Mengomunikasikan penyalahgunaan anugerah sebagai pembenaran bagi perilaku bejat; unsur 'alasan untuk' menjadikan hubungan idiomatis dalam bahasa Indonesia.
- source_word: ἀσέλγειαν
  choice: hidup dalam hawa nafsu
  rationale: Mengungkapkan pemuasan diri yang tidak tahu malu, sering kali bersifat seksual, tanpa membatasinya hanya pada satu jenis tindakan.
- source_word: τὸν μόνον δεσπότην καὶ κύριον ἡμῶν
  choice: satu-satunya Penguasa dan Tuhan kita
  rationale: Mewakili kedua gelar yang berbeda; 'Penguasa' menyampaikan kewenangan δεσπότης tanpa membuat rangkaian 'Tuan dan Tuhan' yang janggal.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesus Sang Mesias
  rationale: Χριστός dipahami sebagai gelar dan diterjemahkan 'Mesias'; 'Sang' menandai gelar itu secara idiomatis dan penuh hormat dalam bahasa Indonesia.
- source_word: ἀρνούμενοι
  choice: menyangkal
  rationale: Padanan langsung yang dapat mencakup penolakan melalui pengakuan maupun perilaku.
theological_decisions:
- issue: Daya ungkap προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: dituliskan sebelumnya untuk penghakiman ini
  alternative: ditetapkan sebelumnya untuk penghukuman ini
  rationale: Pilihan utama mempertahankan kemungkinan bahwa Yudas menunjuk pada tulisan atau nubuat terdahulu, sekaligus tidak meniadakan gagasan penandaan sebelumnya. Terjemahan tidak menetapkan doktrin predestinasi individual yang tidak diwajibkan oleh bentuk Yunani.
- issue: Rujukan gelar 'satu-satunya Penguasa dan Tuhan kita'
  choice: kedua gelar merujuk kepada Yesus Sang Mesias
  alternative: '''Penguasa'' merujuk kepada Allah Bapa, sedangkan ''Tuhan'' merujuk kepada Yesus Sang Mesias'
  rationale: Susunan Yunani paling alami menghubungkan kedua gelar dengan nama yang mengikutinya, Ἰησοῦν Χριστόν, namun catatan tekstual-sintaktis tidak perlu dimasukkan ke dalam teks utama.
- issue: Hubungan anugerah Allah dengan ἀσέλγεια
  choice: mereka menjadikan anugerah sebagai alasan untuk hidup dalam hawa nafsu
  alternative: mereka mengubah anugerah itu sendiri menjadi hawa nafsu
  rationale: Secara semantis yang disoroti ialah penyimpangan atau penyalahgunaan anugerah untuk membenarkan perilaku tanpa kendali, bukan perubahan hakikat anugerah Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur kalimat dipecah menjadi dua kalimat agar rangkaian partisipel Yunani tetap jelas. Istilah 'orang-orang fasik', 'anugerah', 'penghakiman', 'Penguasa', dan 'Tuhan' mempertahankan bobot religius tanpa menjadi terlalu arkais.
