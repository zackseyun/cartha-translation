  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: id
  text: Mereka ini orang-orang yang suka menggerutu dan selalu mengeluhkan nasibnya. Mereka hidup menurut keinginan mereka sendiri[a]. Mulut mereka mengucapkan kata-kata yang angkuh[b], dan mereka mengistimewakan orang demi memperoleh keuntungan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengikuti hawa nafsu mereka sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Mulut mereka mengucapkan kata-kata yang muluk.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “mengagumi wajah,” suatu ungkapan untuk memihak atau memberikan perlakuan istimewa kepada orang tertentu.
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: orang-orang yang suka menggerutu
  rationale: Kata ini menggambarkan orang yang dicirikan oleh keluhan yang terus-menerus atau diucapkan dengan mengomel. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: μεμψίμοιροι
  choice: selalu mengeluhkan nasibnya
  rationale: Istilah langka ini secara khusus menunjuk pada ketidakpuasan terhadap bagian atau keadaan hidup seseorang. Terjemahan ini membedakannya dari keluhan umum dalam γογγυσταί.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: hidup menurut keinginan mereka sendiri
  rationale: πορευόμενοι dipakai secara metaforis untuk cara hidup, sedangkan ἐπιθυμίαι dapat berarti berbagai keinginan kuat. Konteks memberi nuansa moral yang negatif tanpa perlu mempersempitnya pada hawa nafsu seksual.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: Mulut mereka mengucapkan kata-kata yang angkuh
  rationale: Bentuk tunggal 'mulut' dipertahankan sebagai gambaran kolektif yang terdapat dalam bahasa Yunani. ὑπέρογκα menunjuk pada ucapan yang membesar-besarkan diri, congkak, atau angkuh.
- source_word: θαυμάζοντες πρόσωπα
  choice: mengistimewakan orang
  rationale: Ungkapan harfiah 'mengagumi wajah' merupakan idiom keberpihakan atau pemberian perlakuan istimewa kepada orang tertentu. Terjemahan idiomatis ini jelas dan tidak mempersempit maknanya hanya menjadi sanjungan.
- source_word: ὠφελείας χάριν
  choice: demi memperoleh keuntungan
  rationale: Frasa ini menyatakan motif mencari manfaat atau keuntungan bagi diri sendiri, tanpa mengharuskan bahwa keuntungan itu semata-mata berupa uang.
- source_word: οὗτοί εἰσιν
  choice: Mereka ini
  rationale: Bentuk ini mempertahankan penunjukan langsung dan bernada tegas dalam teks Yunani serta terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan moral ἐπιθυμίαι
  choice: keinginan dalam teks utama, dengan konteks yang memberi arti negatif
  alternative: hawa nafsu; berbagai hasrat
  rationale: Kata ini dapat menunjuk pada keinginan kuat secara umum. Dalam kecaman Yudas, keinginan tersebut jelas tidak teratur secara moral, tetapi tidak terbatas pada nafsu seksual.
- issue: Daya idiomatis θαυμάζοντες πρόσωπα
  choice: mengistimewakan orang
  alternative: menyanjung orang; mengagumi wajah
  rationale: Idiom Yunani menyatakan keberpihakan kepada orang tertentu, di sini dengan motif keuntungan pribadi. Terjemahan idiomatis menjaga tuduhan etisnya tanpa menerjemahkan gambaran secara kaku.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua jenis keluhan dalam bahasa Yunani dibedakan antara kebiasaan menggerutu dan ketidakpuasan terhadap nasib. Susunan kalimat dibagi agar rangkaian kecaman tetap jelas bagi pembaca umum tanpa mengurangi isinya.
