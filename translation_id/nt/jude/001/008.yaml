  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: id
  text: Namun demikian, dengan cara yang sama, orang-orang ini juga, karena mengandalkan mimpi-mimpi[a], mencemarkan daging, menolak kekuasaan, dan menghujat yang mulia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bermimpi.” Partisipel Yunani ini dapat diterjemahkan secara lebih harfiah demikian, tetapi mungkin menyiratkan bahwa mereka menjadikan mimpi sebagai dasar bagi perilaku mereka.'
    reason: lexical_alternative
  - marker: b
    text: '“Yang mulia” kemungkinan menunjuk kepada makhluk surgawi yang ditinggikan, mungkin para malaikat; secara harfiah: “kemuliaan-kemuliaan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Namun demikian, dengan cara yang sama
  rationale: Mempertahankan unsur perbandingan dari ὁμοίως dan daya kontras ringan dari μέντοι dalam bahasa Indonesia yang wajar.
- source_word: οὗτοι
  choice: orang-orang ini
  rationale: Menunjuk dengan jelas kepada para penyusup dalam konteks tanpa menambahkan penandaan gender yang tidak dinyatakan oleh bentuk Yunani ini.
- source_word: ἐνυπνιαζόμενοι
  choice: mengandalkan mimpi-mimpi
  rationale: Partisipel ini kemungkinan menunjukkan dasar atau pembenaran bagi perilaku mereka, yakni pengalaman mimpi; kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: σάρκα
  choice: tubuh
  rationale: Dalam rangkaian kecaman moral ini, 'tubuh' menyampaikan rujukan konkret σάρκα secara alami tanpa memasukkan pengertian teknis Paulus seperti 'natur berdosa'.
- source_word: μιαίνουσιν
  choice: mencemarkan
  rationale: Menyampaikan daya moral dan ritual verba tersebut serta sesuai dengan nada kecaman Yudas.
- source_word: κυριότητα
  choice: kekuasaan
  rationale: Mempertahankan keluasan κυριότης, yang dapat menunjuk kepada kekuasaan atau kedaulatan, tanpa memastikan apakah yang dimaksud adalah kekuasaan ilahi, surgawi, atau lainnya.
- source_word: ἀθετοῦσιν
  choice: menolak
  rationale: Ungkapan ringkas dan kuat untuk tindakan menyangkal atau tidak mengakui sesuatu yang seharusnya dihormati.
- source_word: δόξας
  choice: makhluk-makhluk mulia
  rationale: Bentuk jamak ini dalam konteks kemungkinan menunjuk kepada pribadi-pribadi surgawi yang mulia; 'makhluk-makhluk mulia' tetap tidak menentukan secara tegas bahwa mereka adalah malaikat.
- source_word: βλασφημοῦσιν
  choice: menghujat
  rationale: Dalam bahasa Indonesia, 'menghujat' dapat berarti mencela atau berkata keji terhadap pihak yang dimuliakan dan mempertahankan kerasnya βλασφημοῦσιν.
theological_decisions:
- issue: Rujukan δόξας
  choice: ungkapan luas bagi makhluk-makhluk mulia yang ditinggikan
  alternative: malaikat; kemuliaan-kemuliaan; para penguasa surgawi
  rationale: Konteks langsung, khususnya ayat 9, mendukung rujukan kepada makhluk surgawi, tetapi kata Yunani itu sendiri tidak secara eksplisit menyebut malaikat. Teks utama mempertahankan keluasan tersebut dan catatan kaki menjelaskan kemungkinan rujukannya.
- issue: Daya ἐνυπνιαζόμενοι
  choice: perbuatan mereka berkaitan dengan tindakan mengandalkan mimpi
  alternative: bermimpi; sebagai pemimpi
  rationale: Partisipel tersebut mungkin menerangkan dasar perilaku mereka, tetapi bentuk Yunani juga dapat diterjemahkan lebih formal sebagai 'bermimpi'; kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Rujukan κυριότητα
  choice: kekuasaan tanpa rujukan yang dipastikan
  alternative: kedaulatan Tuhan; kekuasaan malaikat; segala struktur kekuasaan
  rationale: Bentuk tunggal abstrak dalam bahasa Yunani tidak dengan sendirinya memastikan siapa atau apa pemilik kekuasaan itu, sehingga terjemahan tidak menyelesaikan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kecaman yang tegas dan bermartabat. Struktur tiga verba paralel dipertahankan. Tanda titik dua memperjelas bahwa tiga tindakan berikut menjabarkan perilaku orang-orang tersebut tanpa menghilangkan hubungan partisipial dalam teks Yunani.
