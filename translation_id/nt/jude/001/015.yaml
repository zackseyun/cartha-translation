id: JUD.1.15
reference: Jude 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: id
  text: untuk melaksanakan penghakiman terhadap semua orang dan menyatakan semua orang fasik bersalah[a] atas segala perbuatan kefasikan mereka yang telah mereka lakukan dalam kefasikan, dan atas segala perkataan keras[c] yang telah diucapkan orang-orang berdosa yang fasik terhadap Dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuktikan kesalahan” atau “menyingkapkan kesalahan.” Kata kerja Yunani ini dapat berarti membawa kesalahan ke dalam terang, tetapi di sini dipakai dalam konteks pengadilan bersama dengan “melaksanakan penghakiman.”
    reason: lexical_alternative
  - marker: b
    text: “Dia” menurut konteks mengacu kepada Tuhan yang disebut dalam ayat sebelumnya.
    reason: cross_reference
  - marker: c
    text: Secara harfiah, “hal-hal keras”; kemungkinan besar yang dimaksud ialah perkataan keras, lancang, atau menentang yang diucapkan terhadap Dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: melaksanakan penghakiman
  rationale: Frasa ini menunjuk pada pelaksanaan tindakan pengadilan, bukan sekadar pengambilan keputusan. Pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks penghakiman akhir.
- source_word: κατὰ πάντων
  choice: terhadap semua orang
  rationale: κατά dengan bentuk genitif di sini menyatakan arah tindakan yang bersifat menentang atau yudisial. 'Terhadap' menyampaikan makna itu secara wajar tanpa terdengar janggal.
- source_word: ἐλέγξαι
  choice: menyatakan ... bersalah
  rationale: Dalam konteks yudisial yang berdampingan dengan κρίσιν, verba ini mencakup penyingkapan dan pembuktian kesalahan. 'Menyatakan ... bersalah' mempertahankan daya yudisialnya.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: semua orang fasik
  rationale: Frasa ini bersifat substantival dan jamak. 'Orang fasik' merupakan ungkapan Indonesia yang ringkas dan mempertahankan hubungan leksikal dengan rangkaian kata ἀσεβ- berikutnya.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: atas segala perbuatan kefasikan mereka
  rationale: '''Atas'' cocok dengan dakwaan yang menjadi dasar pernyataan bersalah, sedangkan ''perbuatan kefasikan mereka'' cukup dekat dengan bentuk genitif sumber dan mempertahankan pengulangan tema kefasikan.'
- source_word: ὧν ἠσέβησαν
  choice: yang telah mereka lakukan dalam kefasikan
  rationale: Konstruksi ini mempertahankan gema antara nomina ἀσέβεια dan verba serumpun ἀσεβέω, meskipun pengulangannya tidak dapat ditiru secara persis dan alami dalam bahasa Indonesia.
- source_word: τῶν σκληρῶν
  choice: segala perkataan keras
  rationale: Secara harfiah σκληρός berarti 'keras', tetapi dalam konteks verba 'berbicara' yang dimaksud ialah perkataan keras, lancang, atau menentang. Penambahan 'perkataan' membuat acuannya jelas tanpa mempersempit makna secara berlebihan.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: telah diucapkan ... terhadap Dia
  rationale: Bentuk aoris menunjuk pada tindakan-tindakan yang telah dilakukan. 'Terhadap' mencerminkan daya menentang dari κατά dengan genitif.
- source_word: αὐτοῦ
  choice: Dia
  rationale: Teks sumber memakai pronomina, bukan sebutan eksplisit 'Tuhan' atau 'Allah'. Huruf kapital membantu menunjukkan referen ilahi menurut konteks ayat sebelumnya tanpa mengganti pronomina sumber.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: orang-orang berdosa yang fasik
  rationale: Pilihan ini mempertahankan kedua sebutan yang membentuk penegasan klimaks sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan αὐτοῦ dalam frasa 'berbicara terhadap Dia'
  choice: Mempertahankan pronomina 'Dia' tanpa menggantinya dengan 'Tuhan' atau 'Allah' dalam teks utama.
  alternative: terhadap Tuhan; terhadap Allah
  rationale: Konteks langsung pada ayat 14 menunjuk kepada Tuhan sebagai referennya, tetapi bahasa Yunani memakai pronomina. Mempertahankan pronomina menghindari penafsiran yang lebih eksplisit daripada teks sumber, sementara kapitalisasi selaras dengan acuan kontekstualnya.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam khidmat dan mudah dipahami. Pengulangan ''fasik/kefasikan'' sengaja dipertahankan sejauh masih wajar untuk mencerminkan rangkaian kuat ἀσεβής–ἀσέβεια–ἀσεβέω–ἀσεβής dalam teks Yunani. Struktur kalimat tetap mengikuti gerak yudisial teks sumber: pelaksanaan penghakiman, pernyataan bersalah, lalu dasar-dasar dakwaannya.'
