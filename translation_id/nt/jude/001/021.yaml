  naturalness: Bahasa umumnya modern dan bermartabat. "Diri kalian" secara eksplisit mencerminkan bentuk jamak ἑαυτούς dan lebih jelas bagi pembaca modern daripada "dirimu" dalam seruan kepada komunitas. Susunan "belas kasihan Tuhan kita, Yesus Sang Mesias, untuk hidup kekal" juga alami dalam register Alkitab Indonesia.
  terminology: '"Kasih Allah", "belas kasihan", "Tuhan", "Yesus Sang Mesias", dan "hidup kekal" merupakan padanan yang tepat. "Sang Mesias" dengan tepat mempertahankan fungsi gelar Χριστός.'
