  to: Peliharalah diri kalian dalam kasih Allah[a] sambil menantikan belas kasihan Tuhan kita, Yesus Sang Mesias, untuk hidup kekal.[b]
  rationale: Revisi mengganti pronomina refleksif menjadi bentuk jamak yang eksplisit dan mengganti klausa relatif yang berpotensi salah acuan dengan "untuk hidup kekal". Bentuk terakhir menyampaikan arah/tujuan εἰς secara ringkas tanpa menambahkan hubungan kausal dan tanpa mengalihkan frasa itu kepada Yesus. Catatan kaki disederhanakan agar benar-benar mencatat alternatif, sambil tetap menjaga ambiguitas yang ada pada bahasa Yunani.
