  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: id
  text: Peliharalah diri kalian dalam kasih Allah[a] sambil menantikan belas kasihan Tuhan kita, Yesus Sang Mesias, untuk hidup kekal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani "kasih Allah" dapat juga dipahami sebagai "kasih kepada Allah."
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “menuju hidup kekal”; dapat juga dipahami “sampai pada hidup kekal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: Peliharalah
  rationale: Imperatif aoris aktif orang kedua jamak memberi seruan langsung. Bentuk ini alami dan bermartabat dalam bahasa Indonesia serta mencakup gagasan menjaga diri tetap berada dalam suatu keadaan.
- source_word: ἑαυτούς
  choice: dirimu
  rationale: Pronomina refleksif jamak merujuk kepada para pembaca sebagai satu komunitas. Dalam bahasa Indonesia, 'dirimu' lazim dipakai kepada kelompok dan menghindari bentuk 'diri kalian' yang lebih percakapan.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: dalam kasih Allah
  rationale: Terjemahan ini mempertahankan konstruksi genitif Yunani tanpa menetapkan secara mutlak apakah yang dimaksud ialah kasih Allah kepada umat-Nya atau kasih umat kepada Allah.
- source_word: προσδεχόμενοι
  choice: sambil menantikan
  rationale: Partisipel kini menyatakan sikap berkelanjutan yang menyertai perintah utama. 'Sambil menantikan' menjaga hubungan gramatikal itu tanpa menambahkan kadar antusiasme yang tidak dinyatakan secara eksplisit.
- source_word: ἔλεος
  choice: belas kasihan
  rationale: Padanan Indonesia yang alami untuk kemurahan penuh iba; bentuk ini mempertahankan nuansa tindakan kasih yang diberikan kepada pihak yang membutuhkan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku dan sesuai konteks Perjanjian Baru untuk gelar κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός tetap dibawa sebagai gelar, bukan sekadar ditransliterasikan. 'Sang' menandai gelar tersebut secara idiomatis dan terhormat dalam bahasa Indonesia.
- source_word: εἰς ζωὴν αἰώνιον
  choice: yang membawa kepada hidup kekal
  rationale: εἰς menyatakan arah, tujuan, atau hasil. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gerak menuju hidup kekal, sementara catatan kaki mencatat alternatif hubungan sintaksis.
theological_decisions:
- issue: Makna genitif dalam ἀγάπῃ θεοῦ
  choice: Mempertahankan ungkapan 'kasih Allah' yang terbuka secara semantis.
  alternative: Kasih Allah kepada kamu; kasihmu kepada Allah.
  rationale: Genitif θεοῦ dapat dipahami sebagai Allah yang mengasihi atau Allah sebagai tujuan kasih. Konteks tidak menuntut agar salah satunya dipilih secara eksklusif.
- issue: Fungsi Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: 'Menerjemahkannya sebagai gelar: ''Sang Mesias''.'
  alternative: Kristus.
  rationale: Χριστός berasal dari gelar yang berarti Yang Diurapi. Padanan 'Mesias' mempertahankan fungsi gelarnya dalam bentuk Indonesia yang alami.
- issue: Hubungan εἰς ζωὴν αἰώνιον dengan bagian sebelumnya
  choice: Menghubungkannya dengan belas kasihan Tuhan sebagai sesuatu yang membawa kepada hidup kekal.
  alternative: Menanti sampai hidup kekal; menantikan belas kasihan untuk memperoleh hidup kekal.
  rationale: Preposisi εἰς menyatakan arah atau tujuan, tetapi cakupan tepatnya dapat dipahami dengan beberapa cara. Teks utama memberikan hubungan yang alami tanpa menjadikan satu rincian mekanismenya sebagai pernyataan dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur perintah utama diikuti partisipel penyerta dipertahankan dengan 'sambil'. Ambiguitas teologis pada 'kasih Allah' dan rentang makna εἰς dijaga melalui teks utama dan catatan kaki.
