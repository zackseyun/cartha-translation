id: JUD.1.3
reference: Jude 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: id
  text: Saudara-saudara yang terkasih, meskipun saya berusaha sungguh-sungguh menulis kepada kalian tentang keselamatan yang kita miliki bersama, saya merasa perlu menulis untuk mendesak kalian agar berjuang dengan sungguh-sungguh demi iman[a] yang telah diserahkan[b] sekali untuk selamanya kepada orang-orang kudus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iman” di sini kemungkinan besar berarti isi ajaran atau kepercayaan Kristen yang dipercayakan kepada umat, bukan hanya tindakan percaya secara pribadi.
    reason: alternative_reading
  - marker: b
    text: Atau “diteruskan”; kata ini menekankan bahwa ajaran tersebut diteruskan kepada umat.
    reason: lexical_alternative
  - marker: c
    text: “Orang-orang kudus” berarti umat Allah, yaitu orang-orang percaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Saudara-saudara yang terkasih
  rationale: Sapaan vokatif jamak yang hangat dan pastoral. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan unsur kasih tanpa menentukan jenis kelamin para penerima.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: meskipun saya berusaha sungguh-sungguh
  rationale: Partisipium dipahami secara konsesif karena usaha awal Yudas dikontraskan dengan keperluan yang kemudian timbul. Ungkapan ini mempertahankan nuansa kesungguhan dan ketekunan.
- source_word: γράφειν ... γράψαι
  choice: menulis ... menulis
  rationale: 'Kedua infinitif dipertahankan untuk mencerminkan pengulangan dalam teks Yunani: rencana menulis dan tindakan menulis yang dianggap perlu.'
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: tentang keselamatan yang kita miliki bersama
  rationale: κοινῆς menyatakan sesuatu yang sama-sama dimiliki atau dialami. Susunan ini lebih alami daripada 'keselamatan kita yang umum' dan mempertahankan penekanan komunal.
- source_word: ἀνάγκην ἔσχον
  choice: saya merasa perlu
  rationale: Ungkapan Yunani menyatakan keperluan yang timbul dari keadaan. 'Merasa perlu' alami dan tidak sekuat 'terpaksa', yang dapat memberi kesan paksaan berlebihan.
- source_word: παρακαλῶν
  choice: untuk mendesak
  rationale: Dalam konteks peringatan serius, kata ini menyampaikan permohonan atau dorongan yang kuat. Bentuk tujuan memperjelas hubungan partisipium dengan tindakan menulis tanpa mengubah isinya.
- source_word: ἐπαγωνίζεσθαι
  choice: agar berjuang dengan sungguh-sungguh
  rationale: Verba majemuk ini mengandung intensitas. 'Berjuang dengan sungguh-sungguh' mempertahankan kekuatannya tanpa membatasi tindakan itu pada kekerasan fisik.
- source_word: τῇ ... πίστει
  choice: demi iman
  rationale: Dalam konteks sesuatu yang telah diserahkan kepada umat, πίστις paling mungkin menunjuk pada isi kepercayaan Kristen, bukan semata-mata tindakan percaya. Istilah 'iman' dipertahankan dan dijelaskan dalam catatan.
- source_word: ἅπαξ
  choice: satu kali untuk selamanya
  rationale: Mengungkapkan tindakan yang definitif dan tidak perlu diulang, sesuai dengan daya ἅπαξ dalam konstruksi ini.
- source_word: παραδοθείσῃ
  choice: diserahkan
  rationale: Bentuk pasif παραδίδωμι dapat berarti diserahkan atau diwariskan. 'Diserahkan' dekat dengan bentuk sumber dan tetap membuka nuansa transmisi, sementara alternatif dijelaskan dalam catatan.
- source_word: τοῖς ἁγίοις
  choice: kepada orang-orang kudus
  rationale: Ungkapan ini secara harfiah menunjuk kepada mereka yang kudus dan dalam pemakaian Kristen awal berarti umat Allah atau orang percaya. Bentuk tradisional dipertahankan dengan penjelasan agar tidak dipahami hanya sebagai gelar khusus.
theological_decisions:
- issue: Makna πίστις ('iman')
  choice: Isi iman atau ajaran Kristen yang dipercayakan kepada umat
  alternative: Tindakan percaya atau kepercayaan pribadi orang beriman
  rationale: Keterangan bahwa iman itu telah diserahkan satu kali untuk selamanya kepada umat sangat mendukung pengertian objektif, yakni sesuatu yang diteruskan dan dipertahankan. Catatan memakai bahasa probabilitas agar tidak meniadakan seluruh gema makna 'percaya'.
- issue: Daya ἅπαξ παραδοθείσῃ
  choice: Penyerahan yang definitif, satu kali untuk selamanya
  alternative: Penyerahan yang terjadi satu kali, tanpa penekanan eksplisit pada finalitas
  rationale: ἅπαξ dalam konteks ini paling wajar menekankan tindakan yang tidak diulang. Terjemahan mempertahankan daya tersebut tanpa merinci bentuk atau batas kanon ajaran itu.
- issue: Identitas τοῖς ἁγίοις
  choice: Umat Allah, yaitu orang-orang percaya
  alternative: Kelompok khusus orang saleh atau tokoh yang kemudian secara resmi disebut santo/santa
  rationale: Pemakaian jamak ἅγιοι dalam surat-surat Kristen awal lazim menunjuk kepada komunitas orang percaya secara umum, bukan kelas khusus yang dikanonisasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral yang hangat dan serius. Kata ganti 'saya', 'kalian', dan 'kita' dipilih agar hubungan penulis, penerima, dan keselamatan bersama jelas. Istilah gerejawi 'iman' dan 'orang-orang kudus' dipertahankan, tetapi diberi catatan untuk mencegah salah pengertian. Struktur dibuat alami tanpa menghilangkan pengulangan γράφειν ... γράψαι.
