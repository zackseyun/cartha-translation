id: JUD.1.1
reference: Jude 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: id
  text: 'Yudas, hamba[a] Yesus Sang Mesias dan saudara Yakobus, kepada mereka yang dipanggil, yang dikasihi dalam Allah Bapa[b], dan yang dipelihara bagi Yesus Sang Mesias[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “budak”; istilah Yunani ini menyatakan bahwa Yudas sepenuhnya menjadi milik dan tunduk kepada Yesus Sang Mesias.
    reason: lexical_clarity
  - marker: b
    text: Beberapa manuskrip berbunyi “dikuduskan dalam Allah Bapa”, bukan “dikasihi dalam Allah Bapa”.
    reason: textual_variant
  - marker: c
    text: Atau “dipelihara oleh Yesus Sang Mesias”. Bentuk datif Yunani dapat menyatakan pelaku (“oleh”) atau tujuan/kepentingan (“bagi”).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Yudas
  rationale: Bentuk baku nama Yunani Ἰούδας dalam Alkitab bahasa Indonesia; konteks surat membedakan penulis dari tokoh-tokoh lain yang bernama sama.
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam pengenalan diri seorang utusan, 'hamba' menyampaikan ketundukan dan kepemilikan kepada Yesus secara alami dan bermartabat dalam bahasa Indonesia; catatan kaki mempertahankan nuansa harfiah perbudakan.
- source_word: Χριστοῦ / Χριστῷ
  choice: Sang Mesias
  rationale: Χριστός merupakan gelar yang berarti Mesias; 'Sang Mesias' mempertahankan fungsi gelarnya dan terdengar alami dalam bahasa Indonesia.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: dan saudara Yakobus
  rationale: δέ bersifat penghubung ringan dalam pengenalan diri dan paling wajar diterjemahkan 'dan'; frasa tanpa artikel tidak menuntut 'saudara itu'.
- source_word: κλητοῖς
  choice: mereka yang dipanggil
  rationale: Adjektiva ini berfungsi substantival dan mengacu kepada para penerima; susunan Indonesia ini jelas serta mempertahankan bobot panggilan ilahi.
- source_word: ἐν θεῷ πατρὶ
  choice: dalam Allah Bapa
  rationale: Mempertahankan arti ranah atau lingkup yang paling langsung dari ἐν tanpa mengubahnya menjadi pelaku atau tujuan.
- source_word: ἠγαπημένοις
  choice: yang dikasihi
  rationale: Partisipel pasif perfektum menyatakan keadaan yang terus berlaku sebagai hasil kasih; 'dikasihi' alami dan mempertahankan bentuk pasif.
- source_word: τετηρημένοις
  choice: yang dipelihara bagi
  rationale: Partisipel pasif perfektum menyatakan keadaan terpelihara, sedangkan datif Ἰησοῦ Χριστῷ paling mungkin menyatakan tujuan atau kepentingan; ambiguitas dengan pelaku dipertahankan dalam catatan kaki.
- source_word: Ἰακώβου
  choice: Yakobus
  rationale: Bentuk nama yang mapan dalam tradisi Alkitab bahasa Indonesia untuk Ἰάκωβος dalam konteks ini.
theological_decisions:
- issue: Hubungan τετηρημένοις dengan Ἰησοῦ Χριστῷ
  choice: dipelihara bagi Yesus Sang Mesias
  alternative: dipelihara oleh Yesus Sang Mesias
  rationale: Datif Yunani dapat dipahami sebagai tujuan atau kepentingan ('bagi') maupun sebagai pelaku ('oleh'). Teks utama memilih pembacaan yang kemungkinan besar menunjuk kepada pemeliharaan bagi Mesias, sambil menjaga alternatif yang sungguh mungkin dalam catatan kaki.
- issue: Varian teks pada ἠγαπημένοις
  choice: dikasihi
  alternative: dikuduskan
  rationale: Teks SBLGNT yang diberikan berbunyi ἠγαπημένοις ('dikasihi'). Sejumlah manuskrip memiliki ἡγιασμένοις ('dikuduskan'), sehingga varian bermakna ini dicatat tanpa menggantikan teks dasar.
- issue: Fungsi κλητοῖς dalam sapaan
  choice: kepada mereka yang dipanggil
  alternative: kepada orang-orang yang dipanggil
  rationale: κλητοῖς secara gramatikal menerangkan para penerima bersama kedua partisipel berikutnya. Penempatan di awal deretan sesuai urutan Yunani dan menghasilkan susunan Indonesia yang jelas tanpa menjadikannya sapaan terpisah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sapaan surat yang khidmat dan mudah dipahami. Struktur tiga pemerian penerima—dipanggil, dikasihi, dan dipelihara—dipertahankan, dengan pengulangan 'yang' demi kejernihan. Nama dan gelar mengikuti bentuk Indonesia yang lazim.
