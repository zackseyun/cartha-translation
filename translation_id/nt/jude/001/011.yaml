id: JUD.1.11
reference: Jude 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: id
  text: Celakalah mereka! Sebab mereka telah menempuh jalan Kain, dan demi upah mereka menceburkan diri ke dalam kesesatan Bileam,[a] dan binasa dalam pemberontakan Korah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demi keuntungan mereka menerjunkan diri ke dalam kesesatan Bileam.” Harfiah, “mencurahkan diri.”
    reason: Memberikan alternatif yang lebih formal untuk ἐξεχύθησαν dan mencatat citra leksikal verba Yunani, sementara teks utama memakai idiom Indonesia yang wajar.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: Celakalah mereka!
  rationale: Ungkapan ini menyatakan kecaman dan penghakiman dengan daya profetis; bentuk seru alami dan tegas dalam bahasa Indonesia.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: mereka telah menempuh jalan Kain
  rationale: Menjaga metafora ὁδός sebagai pola hidup, sementara 'menempuh' secara alami menyampaikan tindakan mengikuti jalan tersebut.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: ke dalam kesesatan Bileam
  rationale: πλάνη dapat berarti kekeliruan, penyesatan, atau penyimpangan. 'Kesesatan' mempertahankan dimensi salah arah secara moral dan cocok dengan gerak yang tersirat dalam verba.
- source_word: μισθοῦ
  choice: demi upah
  rationale: Menunjukkan motif keuntungan atau imbalan tanpa membatasi maknanya pada gaji formal.
- source_word: ἐξεχύθησαν
  choice: mencurahkan diri
  rationale: Mempertahankan citra harfiah 'tercurah' serta nuansa penyerahan diri secara nekat; alternatif yang lebih idiomatis dicantumkan dalam catatan kaki.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: dalam pemberontakan Korah
  rationale: ἀντιλογία dapat berarti bantahan, perlawanan, atau pemberontakan. Dalam kiasan kepada Bilangan 16, 'pemberontakan' paling jelas menyampaikan peristiwa yang dimaksud.
- source_word: ἀπώλοντο
  choice: binasa
  rationale: Padanan yang ringkas, khidmat, dan tepat bagi kehancuran yang dinyatakan oleh ἀπόλλυμι.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: Kain / Bileam / Korah
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Cara menerjemahkan frasa padat καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: mencurahkan diri demi upah ke dalam kesesatan Bileam
  alternative: demi keuntungan, mereka menerjunkan diri ke dalam kesesatan Bileam
  rationale: Teks utama mempertahankan metafora mencurah dari ἐξεχύθησαν dan motif imbalan dari μισθοῦ tanpa menghapus kepadatan ungkapan Yunani. Catatan kaki menyediakan bentuk yang lebih idiomatis, tetapi tidak menjadikannya satu-satunya penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan profetis. Struktur tiga bagian dipertahankan, sedangkan bentuk nama mengikuti kelaziman Alkitab bahasa Indonesia.
