  to: Celakalah mereka! Sebab mereka telah menempuh jalan Kain, dan demi upah mereka menceburkan diri ke dalam kesesatan Bileam,[a] dan binasa dalam pemberontakan Korah.
  rationale: Revisi terbatas pada klausa tentang Bileam. “Menceburkan diri” adalah idiom baku yang menyampaikan keterlibatan atau tindakan nekat dan mempertahankan arah “ke dalam” yang tersirat dalam metafora Yunani. Penempatan “demi upah” di depan klausa menegaskan μισθοῦ sebagai motif tanpa mengubah makna. Penanda catatan kaki tetap berada pada frasa yang dipersoalkan.
