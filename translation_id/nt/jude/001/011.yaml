  verdict: revise
  source_fidelity: Struktur tiga serangkai, acuan kepada Kain, Bileam, dan Korah, serta makna penghakiman dalam οὐαί dan ἀπώλοντο telah terwakili dengan baik. Namun, “mencurahkan diri ... ke dalam” bukan kolokasi Indonesia yang wajar untuk metafora ἐξεχύθησαν dan mengaburkan tindakan nekat yang dimaksud. “Menceburkan diri” menyampaikan gerak metaforis itu secara jelas tanpa mengklaim penafsiran teologis tambahan.
  naturalness: “Celakalah mereka!”, “menempuh jalan Kain”, dan “binasa dalam pemberontakan Korah” alami dalam ragam Indonesia baku bernada profetis. Klausa Bileam perlu diperbaiki agar idiomatis dan agar keterangan motif “demi upah” melekat jelas pada tindakan tersebut.
  terminology: Nama Kain, Bileam, dan Korah sesuai kelaziman Alkitab Indonesia. “Kesesatan,” “upah,” “pemberontakan,” dan “binasa” merupakan padanan yang tepat dan berregister sesuai.
