id: JUD.1.18
reference: Jude 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: id
  text: bahwa dahulu mereka berkata kepada kalian, “Pada zaman terakhir[a] akan ada para pengejek[b] yang hidup menuruti keinginan mereka sendiri yang tidak menghormati Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada akhir zaman” atau “Pada waktu terakhir.” Dalam bahasa Yunani, kata “waktu” berbentuk tunggal, bukan “hari-hari.”
    reason: lexical_alternative
  - marker: b
    text: Atau “para pencemooh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: dahulu mereka berkata
  rationale: Bentuk imperfek menunjukkan perkataan pada masa lampau yang berlangsung atau diulang. Kata “dahulu” menyampaikan latar lampau itu secara wajar tanpa memaksakan berapa kali perkataan tersebut diucapkan.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: Pada zaman terakhir
  rationale: Ungkapan ini mempertahankan bentuk tunggal χρόνος dan nuansa eskatologisnya. “Zaman” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “waktu” dalam ungkapan ini.
- source_word: ἐμπαῖκται
  choice: para pengejek
  rationale: “Pengejek” merupakan padanan modern dan mudah dipahami bagi orang-orang yang mengejek atau mencemooh.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: menuruti keinginan mereka sendiri
  rationale: κατά menyatakan kesesuaian atau arah hidup. “Menuruti” menghasilkan bahasa Indonesia yang alami, sedangkan “keinginan” mempertahankan cakupan ἐπιθυμίαι tanpa mempersempitnya menjadi hawa nafsu seksual.
- source_word: πορευόμενοι
  choice: yang hidup menuruti
  rationale: Partisip ini secara harfiah berarti berjalan atau pergi, tetapi di sini menggambarkan cara hidup. “Hidup menuruti” menyampaikan makna metaforis tersebut dengan jelas.
- source_word: τῶν ἀσεβειῶν
  choice: yang tidak menghormati Allah
  rationale: Genitif ini paling wajar dipahami sebagai pencirian terhadap keinginan-keinginan itu. Ungkapan ini mempertahankan unsur penolakan terhadap kesalehan atau penghormatan kepada Allah tanpa membatasinya pada satu jenis dosa.
theological_decisions:
- issue: Ungkapan eskatologis
  choice: Pada zaman terakhir
  alternative: Pada akhir zaman; Pada waktu terakhir
  rationale: Pilihan ini mempertahankan kata χρόνος dalam bentuk tunggal dan tidak menyelaraskannya dengan ungkapan “hari-hari terakhir” yang terdapat di bagian Kitab Suci lain.
- issue: Karakter moral keinginan
  choice: keinginan mereka sendiri yang tidak menghormati Allah
  alternative: keinginan mereka sendiri yang fasik; keinginan-keinginan kefasikan mereka
  rationale: Terjemahan ini mempertahankan penilaian moral dan religius dalam ἀσέβεια, tetapi tidak mempersempit ἐπιθυμίαι menjadi nafsu seksual saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk bentuk jamak ὑμῖν. Susunan kalimat dibuat alami dalam bahasa Indonesia sambil mempertahankan kaitan antara cara hidup para pengejek dan keinginan mereka yang tidak menghormati Allah.
