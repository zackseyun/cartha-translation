  verdict: approve
  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur utama Yunani dengan baik: ὅτι sebagai “bahwa”; imperfek ἔλεγον secara wajar sebagai “dahulu mereka berkata”; penerima jamak ὑμῖν sebagai “kepada kalian”; serta predikasi masa depan mengenai para pengejek. “Pada zaman terakhir” mempertahankan ungkapan tunggal χρόνου dan daya eskatologisnya tanpa mengubahnya menjadi “hari-hari.” Partisip πορευόμενοι diterjemahkan idiomatis sebagai “yang hidup menuruti,” dan genitif τῶν ἀσεβειῶν tetap mencirikan keinginan itu secara religius-moral.'
