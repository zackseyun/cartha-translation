  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: id
  text: Namun kamu, saudara-saudara terkasih, ingatlah perkataan yang sebelumnya telah disampaikan oleh rasul-rasul Tuhan kita Yesus Kristus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Namun kamu
  rationale: Menjaga daya kontras δέ dan penegasan pada Ὑμεῖς, sekaligus mengalihkan perhatian dari orang-orang yang baru saja dibicarakan kepada para pembaca.
- source_word: ἀγαπητοί
  choice: saudara-saudara yang terkasih
  rationale: Sapaan jamak penuh kasih; bentuk ini alami, hangat, dan bermartabat dalam bahasa Indonesia tanpa membatasi pembaca pada jenis kelamin tertentu dalam maknanya.
- source_word: μνήσθητε
  choice: ingatlah
  rationale: Menerjemahkan imperatif secara langsung dan wajar sebagai seruan untuk mengingat kembali pengajaran terdahulu.
- source_word: τῶν ῥημάτων τῶν προειρημένων
  choice: perkataan yang dahulu telah disampaikan
  rationale: Mempertahankan makna ujaran serta prioritas waktunya. 'Disampaikan' lebih alami daripada 'diucapkan sebelumnya' dan tidak mempersempitnya menjadi nubuat ramalan.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: oleh rasul-rasul
  rationale: Menggunakan padanan Perjanjian Baru yang mapan bagi ἀπόστολοι dan mempertahankan pelaku dalam konstruksi pasif.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: Padanan baku dan kontekstual bagi κύριος; bentuk genitif menunjukkan bahwa para rasul itu adalah rasul-rasul milik atau utusan Tuhan kita.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: Dalam bahasa Indonesia modern, 'Yesus Kristus' merupakan bentuk baku, alami, dan tetap mempertahankan gelar Χριστός dalam ungkapan nama-gelar ini.
theological_decisions:
- issue: Cara menerjemahkan Χριστοῦ dalam Ἰησοῦ Χριστοῦ
  choice: Kristus
  alternative: Mesias
  rationale: Keduanya dapat menyampaikan gelar Yunani Χριστός. Dalam konstruksi tetap Ἰησοῦ Χριστοῦ, 'Yesus Kristus' adalah bentuk Indonesia yang paling alami dan dikenal luas, tanpa meniadakan makna mesianik gelar tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan diperluas menjadi 'saudara-saudara yang terkasih' agar jamak dan kehangatan ἀγαπητοί terdengar alami. Susunan kalimat tetap dekat dengan struktur Yunani tanpa terasa kaku.
