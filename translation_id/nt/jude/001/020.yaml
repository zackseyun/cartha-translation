  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: id
  text: Namun kalian, saudara-saudara terkasih, dengan membangun diri kalian sendiri di atas iman kalian yang paling suci[a][b] dan berdoa dalam Roh Kudus[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam iman kalian yang paling suci.” Bentuk Yunani dapat menggambarkan iman sebagai dasar tempat seseorang membangun maupun sebagai lingkup tempat pembangunan itu berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Kata “iman” di sini juga dapat berarti “kepercayaan” atau “kesetiaan”, meskipun dalam konteks Surat Yudas kemungkinan besar yang dimaksud ialah iman Kristen yang dimiliki bersama oleh umat percaya.
    reason: lexical_alternative
  - marker: c
    text: Atau “oleh Roh Kudus.” Frasa Yunani dapat menekankan lingkup doa (“dalam”) atau peranan Roh yang memampukan orang untuk berdoa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Namun kamu
  rationale: δέ menandai pertentangan dengan para penentang yang dibicarakan sebelumnya, sedangkan pronomina ὑμεῖς memberi penekanan pada para pembaca. “Namun kamu” menyampaikan kontras dan sapaan langsung secara wajar.
- source_word: ἀγαπητοί
  choice: saudara-saudara terkasih
  rationale: Bentuk vokatif jamak ini merupakan sapaan penuh kasih kepada sesama orang percaya. Pilihan ini alami, bermartabat, dan mempertahankan nuansa komunal.
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: dengan membangun dirimu
  rationale: Partisipel ini menggambarkan tindakan membangun di atas suatu dasar. Bentuk “dengan membangun” mempertahankan hubungannya dengan perintah utama yang berlanjut pada ayat berikutnya, sementara “dirimu” mempertahankan unsur refleksif dan dipahami secara kolektif karena sapaannya jamak.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: di atas imanmu yang paling suci
  rationale: “Di atas” mempertahankan metafora pembangunan dan menyatakan iman sebagai dasar. Bentuk superlatif ἁγιωτάτῃ diterjemahkan secara eksplisit sebagai “yang paling suci,” dan πίστει diterjemahkan “iman” tanpa mempersempit maknanya secara berlebihan.
- source_word: προσευχόμενοι
  choice: berdoa
  rationale: Partisipel kini ini sejajar dengan ἐποικοδομοῦντες. Dalam konstruksi “dengan ... dan ...”, bentuk “berdoa” menjaga alur partisipial dan membiarkan kalimat berlanjut ke ayat berikutnya.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dalam Roh Kudus
  rationale: “Dalam” mempertahankan ἐν dan tidak secara sepihak membatasi frasa itu pada makna alat. Huruf kapital menunjukkan bahwa frasa ini paling wajar merujuk kepada Roh Kudus.
theological_decisions:
- issue: Makna πίστις dalam frasa “imanmu yang paling suci”
  choice: Iman yang dimiliki bersama oleh komunitas orang percaya
  alternative: Tindakan memercayai secara pribadi atau kesetiaan
  rationale: Pemakaian “iman” dalam konteks Surat Yudas paling mungkin menunjuk pada iman Kristen yang diterima dan diakui bersama, tetapi catatan kaki mempertahankan kemungkinan leksikal “kepercayaan” atau “kesetiaan” tanpa memasukkannya ke dalam teks utama.
- issue: Rujukan πνεύματι ἁγίῳ
  choice: Roh Kudus ilahi
  alternative: Sikap atau keadaan batin yang suci
  rationale: Dalam konteks nasihat Kristen mula-mula, frasa ini paling alami dipahami sebagai rujukan kepada Roh Kudus. Terjemahan tidak menambahkan penjelasan teologis yang melampaui teks.
- issue: Fungsi ἐν pada frasa tentang doa
  choice: 'Lingkup atau suasana doa: “dalam Roh Kudus”'
  alternative: 'Perantaraan atau daya yang memungkinkan doa: “oleh pertolongan Roh Kudus”'
  rationale: Terjemahan “dalam” paling langsung mempertahankan preposisi Yunani dan membiarkan hubungan teologisnya tetap terbuka; alternatif instrumental dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. “Saudara-saudara terkasih” membuat sapaan jamak dan kasih penulis jelas. Struktur partisipial dipertahankan dengan “dengan ... dan ...” serta koma penutup karena kalimat Yunani berlanjut ke ayat berikutnya.
