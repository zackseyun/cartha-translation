  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: id
  text: Karena itu, kami selalu yakin dan tahu bahwa selama kami tinggal dalam tubuh, kami berada jauh dari Tuhan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak hadir di hadapan Tuhan.” Kata kerja Yunani ini merupakan lawan dari kata “tinggal” dan dapat diterjemahkan “berada jauh” atau “tidak hadir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: kami selalu yakin
  rationale: Partisipel kini menyatakan sikap yakin atau berani yang berlangsung. Bentuk verba finit lebih alami dalam bahasa Indonesia dan tetap terkait dengan klausa berikutnya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya mengenai hidup kebangkitan dan tempat kediaman surgawi.
- source_word: πάντοτε
  choice: selalu
  rationale: Menyatakan kesinambungan keyakinan secara langsung dan alami.
- source_word: εἰδότες
  choice: dan tahu
  rationale: Partisipel perfek οἶδα memiliki makna kini dan menyatakan pengetahuan yang mantap.
- source_word: ἐνδημοῦντες
  choice: selama kami tinggal
  rationale: Mempertahankan gambaran menetap atau berada di tempat kediaman, sekaligus menghasilkan ungkapan Indonesia yang alami.
- source_word: ἐν τῷ σώματι
  choice: di dalam tubuh ini
  rationale: Menunjuk keberadaan jasmani sekarang. Kata 'ini' memperjelas rujukan dalam bahasa Indonesia tanpa mengubah gagasan dasarnya.
- source_word: ἐκδημοῦμεν
  choice: kami berada jauh
  rationale: Merupakan lawan metaforis ἐνδημοῦντες. Ungkapan ini mempertahankan gagasan berada jauh atau tidak di tempat kediaman tanpa memakai bahasa yang kaku.
- source_word: ἀπὸ τοῦ κυρίου
  choice: dari Tuhan
  rationale: ἀπό menyatakan pemisahan atau jarak; κύριος diterjemahkan 'Tuhan' sesuai pemakaian baku dalam konteks ini.
theological_decisions:
- issue: Kontras metaforis antara hidup dalam tubuh dan keberadaan bersama Tuhan
  choice: Keberadaan jasmani sekarang digambarkan sebagai tinggal di dalam tubuh dan berada jauh dari Tuhan.
  alternative: Menafsirkan perkataan ini sebagai pemisahan mutlak dari kehadiran Kristus, atau memasukkan rumusan ayat berikutnya tentang meninggalkan tubuh dan tinggal bersama Tuhan.
  rationale: 'Terjemahan mempertahankan ketegangan dalam ayat ini: Paulus berbicara tentang belum hadir bersama Tuhan dalam pengertian yang dituju konteks, tanpa menyatakan bahwa orang percaya sama sekali terpisah dari pemeliharaan atau kehadiran Kristus.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora tempat kediaman dipertahankan sejauh alami, dengan kontras 'tinggal' dan 'berada jauh'. Tanda catatan kaki ditempatkan setelah frasa yang dijelaskan.
