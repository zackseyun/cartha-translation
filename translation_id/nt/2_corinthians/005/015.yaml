id: 2CO.5.15
reference: 2 Corinthians 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: id
  text: Dan Ia telah mati bagi semua orang[a], supaya mereka yang hidup tidak lagi hidup untuk diri sendiri, melainkan untuk Dia yang telah mati dan telah dibangkitkan bagi mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi semua orang” atau “mewakili semua orang.” Kata Yunani yang sama juga dipakai dalam frasa “bagi mereka” pada akhir ayat dan dapat menekankan manfaat atau perwakilan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bentuk Yunaninya pasif: “telah dibangkitkan,” bukan sekadar “telah bangkit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: bagi semua orang
  rationale: ὑπέρ dengan genitif menyatakan manfaat atau perwakilan. Frasa ini alami dalam bahasa Indonesia dan tidak mempersempit cakupan πάντων.
- source_word: ἀπέθανεν
  choice: Ia telah mati
  rationale: Aoristus menunjuk pada peristiwa kematian yang sudah terjadi; bentuk perfektif bahasa Indonesia membantu menandai peristiwa tersebut secara wajar dalam konteks.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan nuansa tujuan atau hasil secara alami tanpa memaksakan pembedaan yang tidak ditegaskan oleh bentuk Yunani.
- source_word: οἱ ζῶντες
  choice: mereka yang hidup
  rationale: Mempertahankan bentuk partisip substantival dan membiarkan konteks menentukan dimensi kehidupan yang dimaksud.
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: tidak lagi hidup untuk diri sendiri
  rationale: Dativus refleksif menyatakan orientasi hidup; bentuk ini idiomatis dan mempertahankan kontras dengan hidup bagi Kristus.
- source_word: ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι
  choice: melainkan untuk Dia yang telah mati dan telah dibangkitkan bagi mereka
  rationale: Melanjutkan dativus orientasi setelah verba 'hidup' yang dipahami, sambil mempertahankan dua partisip dan bentuk pasif ἐγερθέντι.
- source_word: ὑπὲρ αὐτῶν
  choice: bagi mereka
  rationale: Mengulang padanan ὑπέρ secara konsisten serta menjaga makna manfaat atau perwakilan tanpa merumuskan teori penebusan tertentu.
- source_word: ἐγερθέντι
  choice: telah dibangkitkan
  rationale: Mempertahankan bentuk pasif Yunani, yang menampilkan kebangkitan sebagai tindakan yang dikenakan kepada Dia.
theological_decisions:
- issue: Cakupan πάντων dan αὐτῶν
  choice: semua orang / mereka
  alternative: semua manusia tanpa pengecualian; atau semua orang yang diwakili Kristus dalam konteks
  rationale: Ayat memakai bahasa cakupan luas tetapi tidak dengan sendirinya menyelesaikan perdebatan tentang cakupan penebusan. Terjemahan tidak mempersempit referennya.
- issue: Daya makna ὑπέρ
  choice: bagi
  alternative: demi; untuk kepentingan; mewakili
  rationale: '''Bagi'' memungkinkan nuansa manfaat dan perwakilan tetap hadir tanpa menetapkan secara eksplisit satu rumusan teologis tertentu.'
- issue: Bentuk pasif kebangkitan
  choice: telah dibangkitkan
  alternative: telah bangkit
  rationale: Bentuk pasif mencerminkan ἐγερθέντι dan mempertahankan penekanan gramatikal pada tindakan Allah tanpa menyangkal ungkapan aktif yang mungkin dipakai di konteks lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “Ia/Dia” dipakai untuk Kristus sesuai kelaziman penerbitan Alkitab Indonesia. Struktur kontras dipertahankan, sedangkan susunan frasa diatur agar alami bagi pembaca umum.
