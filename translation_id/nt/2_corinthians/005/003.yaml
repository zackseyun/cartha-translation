  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: id
  text: jika memang[a], setelah kita berpakaian, kita tidak akan didapati telanjang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jika memang, setelah kita mengenakan pakaian, kita tidak akan didapati tanpa pakaian.”'
    reason: Alternatif ini memakai ungkapan yang lebih harfiah bagi partisipel ἐνδυσάμενοι dan menerjemahkan γυμνοί sebagai “tanpa pakaian,” tanpa menambahkan objek tertentu pada metafora.
lexical_decisions:
- source_word: εἴ γε
  choice: jika memang
  rationale: Mempertahankan daya syarat εἰ sekaligus penegasan γε secara wajar dalam bahasa Indonesia.
- source_word: καὶ ἐνδυσάμενοι
  choice: sesudah mengenakannya
  rationale: Partisipel aoristus medium paling langsung menyatakan tindakan mengenakan sesuatu yang mendahului verba utama; akhiran -nya mengacu secara kontekstual pada tempat kediaman surgawi dalam ayat sebelumnya tanpa menjelaskan metafora lebih jauh.
- source_word: οὐ γυμνοὶ
  choice: tidak ... telanjang
  rationale: Mempertahankan negasi dan metafora pakaian secara langsung, tanpa menafsirkan arti teologis ketelanjangan.
- source_word: εὑρεθησόμεθα
  choice: kita tidak akan didapati
  rationale: Mencerminkan bentuk pasif futurum dan makna idiomatis 'didapati berada dalam suatu keadaan'.
theological_decisions:
- issue: Makna metafora mengenakan pakaian dan telanjang
  choice: Metafora dipertahankan tanpa menentukan arti teologis khusus bagi 'telanjang'.
  alternative: Menafsirkannya secara eksplisit sebagai keadaan tanpa tubuh, tanpa tubuh kebangkitan, atau sebagai rasa malu di hadapan Allah.
  rationale: Ayat ini sendiri tidak menetapkan secara tegas referen lengkap metafora tersebut.
- issue: Daya syarat εἴ γε
  choice: jika memang
  alternative: karena memang / asalkan
  rationale: Mempertahankan ketegangan gramatikal sebagai syarat yang ditegaskan dan tidak mengubahnya menjadi kepastian atau prasyarat yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat ringkas agar hubungan dengan gambaran tempat kediaman atau pakaian pada konteks sekitarnya tetap terasa.
