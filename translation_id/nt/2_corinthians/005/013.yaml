  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: id
  text: Sebab jika kami tidak waras[a], itu bagi Allah; jika kami berpikiran sehat[b], itu bagi kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di luar diri.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “menguasai diri” atau “berpikiran jernih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: jika ... jika
  rationale: Pengulangan "jika" mempertahankan bentuk retoris yang ringkas sekaligus daya kontras antara kedua kemungkinan.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: ἐξέστημεν
  choice: dianggap tidak waras
  rationale: Kata Yunani ini dapat berarti berada di luar diri atau tidak waras. Tambahan "dianggap" menjaga kemungkinan bahwa Paulus berbicara tentang bagaimana perilakunya dinilai, tanpa menyatakan bahwa ia sungguh kehilangan kewarasan.
- source_word: θεῷ
  choice: bagi Allah
  rationale: Datif yang eliptis ini menyatakan arah kepentingan atau tujuan; ungkapan ringkas ini mempertahankan kepekatan teks sumber.
- source_word: σωφρονοῦμεν
  choice: berpikiran sehat
  rationale: Pilihan ini secara alami menyatakan kewarasan dan pertimbangan yang baik serta mempertahankan kontras langsung dengan "tidak waras".
- source_word: ὑμῖν
  choice: bagi kamu
  rationale: Sejajar dengan "bagi Allah" dan menyampaikan bahwa sikap Paulus ditujukan demi kepentingan jemaat.
theological_decisions:
- issue: Makna kontras dalam gambaran diri Paulus
  choice: Terjemahan mempertahankan kontras antara perilaku yang dianggap tidak waras dan sikap yang berpikiran sehat.
  alternative: Ayat ini dapat dipahami sebagai rujukan kepada pengalaman ekstatis yang nyata atau sebagai bahasa hiperbolis mengenai tuduhan orang lain.
  rationale: Teks Yunani bersifat retoris dan eliptis; terjemahan tidak menetapkan doktrin khusus tentang ekstase ataupun menyatakan adanya kegilaan harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur paralel sumber dipertahankan, sedangkan alternatif leksikal yang nyata dicatat dalam catatan kaki.
