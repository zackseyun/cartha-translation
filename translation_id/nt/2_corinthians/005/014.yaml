id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: id
  text: 'Sebab kasih Mesias mendorong kami[a], karena kami telah menyimpulkan hal ini: satu orang telah mati demi semua orang; dengan demikian, semua orang telah mati.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih yang berasal dari Mesias” atau “kasih kepada Mesias”; bentuk genitif dalam bahasa Yunani dapat dipahami dengan kedua cara itu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan Alkitabiah yang tetap alami dalam bahasa Indonesia modern untuk ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός adalah gelar; “Mesias” menerjemahkan gelar itu. Hubungan genitifnya sengaja tidak diperjelas secara sepihak dan diterangkan dalam catatan kaki.
- source_word: συνέχει
  choice: menguasai
  rationale: Dalam konteks ini kata tersebut menyatakan daya kuat yang mengarahkan atau mengendalikan tindakan. “Menguasai” lebih alami daripada “mendesak” dan tidak menyiratkan paksaan lahiriah semata.
- source_word: κρίναντας τοῦτο
  choice: karena kami telah menyimpulkan hal ini
  rationale: Partisip aoris ini menyatakan dasar bagi klausa utama dan mengandung gagasan penilaian yang menghasilkan kesimpulan.
- source_word: εἷς
  choice: satu orang
  rationale: Bahasa Indonesia memerlukan penanda manusia agar “satu” tidak terdengar sebagai angka yang menggantung; rujukannya tetap tidak diperluas menjadi nama Mesias.
- source_word: ὑπὲρ πάντων
  choice: demi semua orang
  rationale: “Demi” menyampaikan tindakan untuk kepentingan atau atas nama semua orang tanpa mempersempit ὑπέρ menjadi satu teori penggantian tertentu.
- source_word: ἄρα
  choice: dengan demikian
  rationale: Menandai kesimpulan logis dengan lancar dan berbobot dalam bahasa Indonesia.
- source_word: οἱ πάντες ἀπέθανον
  choice: semua orang telah mati
  rationale: Bentuk ringkas sumber dipertahankan tanpa menjelaskan secara tambahan bagaimana semua orang ikut dalam kematian satu orang itu.
theological_decisions:
- issue: Daya genitif dalam ἡ ἀγάπη τοῦ Χριστοῦ
  choice: Teks utama memakai “kasih Mesias”, yang tetap dapat menunjuk kepada kasih yang berasal dari Mesias atau kasih yang tertuju kepada-Nya.
  alternative: “kasih Mesias kepada kami” atau “kasih kami kepada Mesias”
  rationale: Genitif Yunani secara gramatikal memungkinkan pembacaan subjektif maupun objektif; konteks tidak mengharuskan terjemahan menutup salah satu kemungkinan.
- issue: Makna “semua orang telah mati”
  choice: Pernyataan diterjemahkan secara padat tanpa uraian teologis tambahan.
  alternative: Semua orang mati secara representatif dalam Mesias; atau semua orang percaya telah mati bersama Dia.
  rationale: Ayat ini menyatakan kesimpulan Paulus secara ringkas dan tidak secara eksplisit menjelaskan cakupan maupun cara partisipasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kami” dipertahankan sesuai ἡμᾶς; “telah mati” dipakai untuk menonjolkan keadaan yang dihasilkan oleh peristiwa kematian dalam alur argumentasi Paulus.
