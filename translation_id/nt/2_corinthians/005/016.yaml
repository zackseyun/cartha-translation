id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: id
  text: Karena itu, mulai sekarang kami tidak memandang seorang pun menurut daging.[a] Sekalipun kami pernah mengenal Mesias[b] menurut daging, sekarang kami tidak lagi mengenalnya dengan cara demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari sudut pandang manusiawi” atau “menurut ukuran duniawi” untuk “menurut daging.”
    reason: lexical_alternative
  - marker: b
    text: Yunani Christon, yaitu “Yang Diurapi”; secara tradisional diterjemahkan “Kristus.” Di sini diterjemahkan “Mesias” untuk mempertahankan makna gelarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: ἀπὸ τοῦ νῦν
  choice: mulai sekarang
  rationale: Ungkapan temporal alami yang menyatakan perubahan sejak saat ini dan seterusnya.
- source_word: οὐδένα
  choice: seorang pun
  rationale: Dalam konstruksi negatif, bentuk ini menyampaikan cakupan universal ‘tidak seorang pun’ secara alami.
- source_word: οἴδαμεν
  choice: memandang
  rationale: Dalam gabungan dengan κατὰ σάρκα, verba ini menunjuk pada cara mengenali atau menilai seseorang, bukan sekadar memiliki pengetahuan tentangnya.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan istilah teologis Paulus dan ketegangannya; frasa ini dapat menunjuk pada sudut pandang manusiawi atau ukuran duniawi, bukan secara khusus pada ‘tabiat berdosa.’
- source_word: εἰ καὶ
  choice: Sekalipun
  rationale: Menyampaikan daya konsesif sambil tidak memaksakan keputusan tajam antara nuansa ‘meskipun’ dan ‘sekalipun/jika pun.’
- source_word: ἐγνώκαμεν
  choice: pernah mengenal
  rationale: Menunjukkan pengenalan pada masa lampau yang dikontraskan dengan keadaan sekarang; ‘pernah’ alami dalam bahasa Indonesia.
- source_word: Χριστόν
  choice: Mesias
  rationale: Menerjemahkan makna gelar Yunani Χριστός, yaitu Yang Diurapi, alih-alih memperlakukannya semata-mata sebagai nama diri.
- source_word: ἀλλὰ νῦν οὐκέτι
  choice: sekarang ... tidak lagi
  rationale: Mempertahankan pertentangan kuat antara cara mengenal dahulu dan sekarang tanpa membuat susunan Indonesia menjadi kaku.
- source_word: γινώσκομεν
  choice: mengenalnya dengan cara demikian
  rationale: Objeknya dipahami dari ‘Mesias’ dalam klausa sebelumnya, sedangkan tambahan ‘dengan cara demikian’ memperjelas bahwa cara mengenalnya yang berubah.
theological_decisions:
- issue: Makna κατὰ σάρκα ketika dikenakan kepada manusia dan Mesias
  choice: menurut daging
  alternative: dari sudut pandang manusiawi; menurut ukuran duniawi
  rationale: Terjemahan utama mempertahankan istilah khas Paulus serta ketegangan teologisnya. Ayat ini menolak cara mengenali atau menilai Mesias semata-mata berdasarkan kategori manusiawi, bukan menyangkal kemanusiaan Mesias yang sejati.
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap berfungsi sebagai gelar. ‘Mesias’ menyampaikan isi semantis gelar tersebut secara langsung dan tidak memasukkan penafsiran denominasi tertentu.
- issue: Daya konsesif εἰ καὶ
  choice: Sekalipun
  alternative: Meskipun; sekalipun memang
  rationale: ‘Sekalipun’ mempertahankan bentuk konsesif dan memberi ruang bagi nuansa Yunani tanpa memastikan lebih dari yang dinyatakan teks tentang sifat pengenalan terdahulu itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Menurut daging’ sengaja dipertahankan dalam teks utama agar istilah dan ketegangan Paulus tetap terlihat, sementara catatan kaki menyediakan padanan maknawi. Pronomina ‘-nya’ ditulis menurut kaidah umum tanpa kapitalisasi devosional.
