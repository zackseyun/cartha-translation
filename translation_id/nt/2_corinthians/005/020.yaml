  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: id
  text: 'Jadi, kami menjadi utusan bagi Mesias[a], seakan-akan Allah mengimbau melalui kami. Demi Mesias, kami memohon: hendaklah kalian didamaikan dengan Allah[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus” pada kedua kemunculannya dalam ayat ini. Kata Yunani Χριστός adalah gelar yang berarti “Mesias.”
    reason: alternative_reading
  - marker: b
    text: Kata kerja Yunani berbentuk imperatif pasif. Dapat juga diterjemahkan “hendaklah kalian diperdamaikan dengan Allah.”
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: mewakili Mesias / atas nama Mesias
  rationale: Ὑπέρ dengan genetif menyatakan tindakan untuk atau atas nama seseorang. Dalam konteks πρεσβεύομεν, “mewakili Mesias” memperjelas fungsi seorang utusan; pada kemunculan kedua, “atas nama Mesias” menyampaikan permohonan perwakilan secara alami. Χριστός diterjemahkan “Mesias” karena di sini berfungsi sebagai gelar.
- source_word: οὖν
  choice: Jadi
  rationale: Οὖν menandai kesimpulan dari uraian sebelumnya tentang pelayanan pendamaian. “Jadi” jelas dan alami dalam bahasa Indonesia modern.
- source_word: πρεσβεύομεν
  choice: kami adalah utusan-utusan
  rationale: Πρεσβεύω berarti bertugas sebagai duta atau utusan. “Utusan-utusan” terdengar lebih alami bagi pembaca umum daripada “duta-duta” dan, bersama frasa “yang mewakili Mesias,” mempertahankan gagasan perwakilan resmi.
- source_word: ὡς
  choice: seakan-akan
  rationale: 'Ὡς memperkenalkan perbandingan mengenai cara pelayanan para utusan itu dipahami: Allah sendiri seakan-akan menyampaikan permohonan melalui mereka.'
- source_word: παρακαλοῦντος
  choice: menyampaikan permohonan-Nya
  rationale: Παρακαλέω dapat berarti mendesak, mengimbau, atau memohon. Dalam konteks pendamaian, frasa ini mempertahankan nada ajakan yang sungguh-sungguh dan sesuai dengan δεόμεθα berikutnya.
- source_word: δι’ ἡμῶν
  choice: melalui kami
  rationale: Διά dengan genetif menunjukkan sarana atau perantaraan; “melalui kami” merupakan padanan Indonesia yang langsung dan alami.
- source_word: δεόμεθα
  choice: kami memohon
  rationale: Δέομαι menyatakan permohonan yang sungguh-sungguh. “Kami memohon” bermartabat dan mudah dipahami tanpa mengurangi urgensinya.
- source_word: καταλλάγητε
  choice: berdamailah
  rationale: Bentuk imperatif aoristus pasif memerintahkan para pendengar untuk menerima pemulihan hubungan. Dalam bahasa Indonesia, “berdamailah” adalah ungkapan paling alami, meskipun bentuk pasif Yunani tidak dapat dipertahankan secara formal tanpa menghasilkan kalimat yang kaku.
- source_word: τῷ θεῷ
  choice: dengan Allah
  rationale: Dativus sesudah καταλλάσσω menunjuk kepada pihak yang dengannya hubungan dipulihkan. “Dengan Allah” merupakan konstruksi idiomatis dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar, sehingga “Mesias” mempertahankan maknanya. Bentuk tradisional “Kristus” dicantumkan sebagai alternatif dalam catatan kaki.
- issue: Suara dan pelaku dalam pendamaian
  choice: berdamailah dengan Allah
  alternative: biarlah kalian didamaikan dengan Allah
  rationale: Bahasa Indonesia tidak memiliki padanan pasif imperatif yang sekaligus alami dan ringkas. “Berdamailah” mempertahankan perintah serta ketegangan bahwa Allah mengajukan permohonan sementara para pendengar dituntut menanggapinya; catatan kaki menjelaskan bentuk pasif sumber agar agensi tidak diam-diam disederhanakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Utusan-utusan yang mewakili” dipilih agar citra perwakilan resmi dapat dipahami tanpa istilah birokratis yang kaku. Kata ganti objek setelah “memohon” dibiarkan tersirat sebagaimana teks Yunani; seruan langsung sesudah titik dua menunjukkan pihak yang disapa. Semua penanda catatan kaki terdapat dalam teks utama.
