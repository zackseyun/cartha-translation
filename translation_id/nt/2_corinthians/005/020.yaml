  naturalness: “Kami adalah utusan-utusan yang mewakili Mesias” agak berlebihan dan kurang luwes; “kami menjadi utusan bagi Mesias” lebih alami serta tetap menyampaikan peran perwakilan. “Hendaklah kalian didamaikan dengan Allah” adalah bentuk imperatif pasif yang jelas dan cukup alami dalam ragam Indonesia modern yang bermartabat.
  terminology: “Mesias” tepat untuk Χριστός sebagai gelar, dengan “Kristus” sebagai alternatif yang berguna dalam catatan kaki. “Allah” konsisten. “Didamaikan dengan Allah” mempertahankan relasi yang dimaksud tanpa memaksakan alternatif “kepada Allah,” yang tidak idiomatis dalam bahasa Indonesia.
