  - severity: low
    issue: Frasa “utusan-utusan yang mewakili Mesias” berlebihan.
    rationale: Pengulangan nomina dan klausa penjelas menambah beban gaya; πρεσβεύομεν sudah mencakup fungsi sebagai wakil atau utusan.
  - severity: low
