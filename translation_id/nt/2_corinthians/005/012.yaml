source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: id
  text: Kami tidak sedang merekomendasikan diri kami kepada kalian lagi, melainkan memberi kalian alasan untuk berbangga mengenai kami,[a] supaya kalian mempunyai jawaban bagi orang-orang yang berbangga atas apa yang tampak secara lahiriah dan bukan atas apa yang ada dalam hati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberi kalian kesempatan untuk berbangga demi kami” atau “atas nama kami.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “yang berbangga dalam wajah dan bukan dalam hati.” “Wajah” di sini menunjuk pada apa yang tampak secara lahiriah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: merekomendasikan
  rationale: Dalam konteks surat rekomendasi dan pembelaan kerasulan Paulus, kata ini menyatakan tindakan mengemukakan seseorang sebagai layak diterima atau dipercaya. “Merekomendasikan diri” mempertahankan nuansa tersebut tanpa menyamakannya begitu saja dengan memuji diri.
- source_word: ἀφορμὴν
  choice: alasan
  rationale: Kata ini dapat berarti titik tolak, kesempatan, atau dasar. “Alasan” secara wajar menyatakan bahwa Paulus memberi jemaat dasar untuk membanggakan dirinya dan menjawab para penentangnya.
- source_word: καυχήματος
  choice: untuk membanggakan
  rationale: Bentuk nomina ini berkaitan dengan tindakan bermegah atau berbangga. Bentuk verbal Indonesia menghasilkan kalimat yang alami sekaligus mempertahankan kaitannya dengan καυχωμένους pada bagian akhir ayat.
- source_word: ὑπὲρ ἡμῶν
  choice: kami
  rationale: Dalam frasa “membanggakan kami”, objek Indonesia dapat mencakup gagasan berbangga mengenai kami. Kemungkinan nuansa bertindak demi atau membela kami dicatat dalam catatan kaki.
- source_word: ἵνα ἔχητε πρὸς
  choice: supaya kalian mempunyai jawaban bagi
  rationale: Ungkapan Yunani secara harfiah berarti memiliki sesuatu terhadap atau untuk seseorang; konteks mengisyaratkan sesuatu yang dapat dikatakan sebagai tanggapan. “Mempunyai jawaban” mengungkapkan implikasi itu secara alami.
- source_word: ἐν προσώπῳ
  choice: apa yang tampak di luar
  rationale: Secara harfiah frasa ini menunjuk pada “wajah”, tetapi dalam pertentangannya dengan hati, maknanya adalah hal lahiriah atau yang tampak. Pilihan ini mempertahankan kontras luar-dalam tanpa menentukan bentuk lahiriah tertentu.
- source_word: καυχωμένους
  choice: orang-orang yang membanggakan
  rationale: “Membanggakan” mempertahankan pengulangan akar kata yang sama dengan καυχήματος dan menyampaikan sikap bermegah dalam sesuatu.
- source_word: καρδίᾳ
  choice: hati
  rationale: “Hati” adalah padanan langsung dan lazim bagi pusat batin manusia, serta mempertahankan gambaran sumber tanpa menggantinya dengan tafsiran seperti ketulusan atau kenyataan batin.
theological_decisions:
- issue: Pertentangan ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ
  choice: Pertentangan antara yang tampak secara lahiriah dan yang ada dalam hati
  alternative: Pertentangan yang dipersempit menjadi reputasi publik versus ketulusan
  rationale: Teks secara eksplisit mempertentangkan wajah atau tampilan dengan hati. Terjemahan mempertahankan gambaran dan ketegangan moral tersebut tanpa menetapkan apakah yang dimaksud khususnya reputasi, kecakapan retoris, asal-usul, atau tanda lahiriah lainnya.
- issue: Arah makna ὑπὲρ ἡμῶν
  choice: Berbangga mengenai kami, dengan kemungkinan nuansa membela kami
  alternative: Berbangga semata-mata demi atau atas nama kami
  rationale: Preposisi ὑπέρ dapat menunjuk pokok pembicaraan maupun kepentingan yang dibela. Teks utama memakai susunan Indonesia yang alami, sedangkan catatan kaki menjaga nuansa representatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar pembedaan jumlah pada ὑμῖν tetap jelas. Kalimat dibagi dua untuk keterbacaan, sementara hubungan kontras ἀλλά dipertahankan dengan “Sebaliknya”. Diksi dijaga bermartabat tetapi mudah dipahami.
