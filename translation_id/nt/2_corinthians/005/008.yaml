  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: id
  text: Jadi, kami yakin dan lebih suka berada jauh dari tubuh dan berada di rumah bersama Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “meninggalkan tubuh dan tinggal bersama Tuhan.”'
    reason: Alternatif idiomatis untuk pasangan ἐκδημῆσαι dan ἐνδημῆσαι. Teks utama mempertahankan lebih jelas metafora ‘berada jauh dari rumah’ dan ‘berada di rumah’.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: kami tetap yakin
  rationale: Kata kerja kini ini menyatakan keberanian atau keyakinan yang berkelanjutan. Kata “tetap” juga menghubungkannya secara alami dengan keyakinan yang disebut dalam ayat 6.
- source_word: δὲ καὶ
  choice: Namun, ... tetap ... dan
  rationale: Dalam konteks ayat 6–8, δέ melanjutkan pemikiran dengan nuansa kontras ringan, sedangkan καί menghubungkan keyakinan dengan kesukaan atau pilihan yang menyusul.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: lebih suka
  rationale: Gabungan ini menyatakan pilihan atau kerelaan yang lebih besar, bukan sekadar perasaan senang.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: meninggalkan tubuh ini
  rationale: ἐκδημέω berarti berada jauh dari tempat kediaman. Pilihan ini mempertahankan gambaran perpindahan dari tubuh tanpa menambahkan kata “mati”; “ini” membuat rujukan kepada tubuh manusiawi sekarang terasa alami dalam bahasa Indonesia.
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: tinggal bersama Tuhan
  rationale: ἐνδημέω berlawanan dengan ἐκδημέω dan berarti berada atau tinggal di tempat kediaman. πρός di sini menyatakan kehadiran pribadi bersama Tuhan. Terjemahan ini alami dan tetap mempertahankan citra kediaman.
theological_decisions:
- issue: Apakah bahasa Paulus harus dijabarkan sebagai pernyataan eksplisit tentang kematian, surga, atau keadaan antara kematian dan kebangkitan
  choice: Mempertahankan gambaran meninggalkan tubuh dan tinggal bersama Tuhan tanpa menambahkan “mati”, “setelah kematian”, atau “di surga”.
  alternative: “mati dan pergi ke surga untuk bersama Tuhan”
  rationale: Ayat ini mengarah kepada keberadaan bersama Tuhan ketika jauh dari tubuh, tetapi istilah tambahan tersebut tidak terdapat dalam teks Yunani dan akan mempersempit ketegangan teologis yang dibiarkan oleh Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kami” mengikuti suara apostolik dalam konteks. Teks utama mengutamakan kelancaran, sedangkan catatan kaki mempertahankan permainan metaforis dua kata Yunani yang saling berlawanan.
