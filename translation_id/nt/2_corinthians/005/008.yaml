  source_fidelity: Revisi diperlukan agar hubungan δέ sebagai kelanjutan/inferensi lebih tepat, tanpa kontras kuat “Namun”, dan agar pasangan metaforis ἐκδημῆσαι/ἐνδημῆσαι tetap tampak dalam teks utama. “Tubuh ini” serta “tetap” menambahkan penekanan yang tidak dinyatakan secara eksplisit dalam ayat ini.
  naturalness: Teks revisi tetap memakai bahasa Indonesia modern dan baku. “Berada jauh dari tubuh dan berada di rumah bersama Tuhan” sedikit lebih formal, tetapi jelas dan dengan baik mempertahankan metafora kediaman yang disengaja dalam bahasa Yunani.
  terminology: “Tuhan” merupakan padanan yang tepat untuk τὸν κύριον. Revisi tidak menambahkan “mati,” “surga,” atau penjelasan doktrinal mengenai keadaan setelah kematian.
  issues:
