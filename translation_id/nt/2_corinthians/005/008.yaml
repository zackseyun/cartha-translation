    rationale: Kedua verba secara sengaja dipasangkan sebagai ‘berada jauh dari rumah’ dan ‘berada di rumah’. “Meninggalkan” dapat diterima sebagai parafrasa, tetapi kurang mempertahankan permainan metafora; “ini” juga tidak ada dalam teks Yunani.
  - severity: low
    issue: “Tetap” menambahkan penekanan temporal/discourse yang tidak eksplisit dalam ayat ini.
    rationale: Bentuk kini θαρροῦμεν menyatakan keyakinan atau keberanian yang berlangsung, tetapi tidak dengan sendirinya menuntut “tetap”.
