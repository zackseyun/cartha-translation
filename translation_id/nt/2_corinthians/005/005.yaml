  naturalness: “Dia yang mempersiapkan kita untuk hal itu adalah Allah” dapat dipahami, tetapi susunan “Allahlah yang telah mempersiapkan kita justru untuk hal ini” lebih alami, tetap bermartabat, dan mempertahankan penegasan εἰς αὐτὸ τοῦτο.
  terminology: “Allah” dan “Roh” tepat. “Jaminan” adalah padanan Indonesia yang alami untuk ἀρραβών dalam konteks ini; catatan kaki mempertahankan metafora pembayaran awal melalui alternatif “uang muka,” “deposit,” dan “angsuran pertama.”
