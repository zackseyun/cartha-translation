  to: Allahlah yang telah mempersiapkan kita justru untuk hal ini, dan yang telah memberi kita Roh sebagai jaminan[a].
  rationale: Revisi memakai susunan Indonesia yang lebih lancar, mempertahankan penegasan “untuk hal ini,” dan menerjemahkan ἀρραβών τοῦ πνεύματος sebagai “Roh sebagai jaminan.” Ini mencerminkan penggunaan Paulus dan menghindari ketidakjelasan “uang muka Roh,” sambil mempertahankan metafora komersial melalui catatan kaki. Penanda catatan kaki disederhanakan karena satu catatan leksikal yang tepat sudah mencakup informasi yang diperlukan.
