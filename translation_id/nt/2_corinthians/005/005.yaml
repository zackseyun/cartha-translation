  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: id
  text: Allahlah yang telah mempersiapkan kita justru untuk hal ini, dan yang telah memberi kita Roh sebagai jaminan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “uang muka”, “deposit”, atau “angsuran pertama”. Istilah ini menunjuk pada pemberian awal yang menjamin penggenapan yang masih akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεργασάμενος
  choice: mempersiapkan
  rationale: Dalam konteks ayat 1–4, kata ini menyatakan karya Allah yang membentuk dan memperlengkapi orang percaya menuju keadaan mendatang yang dibicarakan Paulus. 'Mempersiapkan' menyampaikan arah dan tujuan tersebut secara alami.
- source_word: εἰς αὐτὸ τοῦτο
  choice: untuk hal itu
  rationale: Ungkapan ini menunjuk dengan penegasan kepada keadaan yang baru saja dibicarakan. Dalam bahasa Indonesia, 'hal itu' cukup jelas dan lebih alami daripada ungkapan yang terlalu harfiah seperti 'hal yang itu juga'.
- source_word: θεός
  choice: Allah
  rationale: Allah adalah subjek yang diidentifikasikan sebagai Dia yang mempersiapkan kita.
- source_word: δοὺς
  choice: yang telah memberikan
  rationale: Partisip aoristus dirender sebagai klausa relatif yang alami; 'telah memberikan' menyatakan pemberian yang sudah dilakukan tanpa menentukan waktu secara lebih sempit.
- source_word: ἀρραβῶνα
  choice: uang muka
  rationale: Istilah ini menunjuk pada pembayaran awal yang sekaligus menjamin bahwa sisanya akan diberikan. 'Uang muka' mempertahankan metafora komersial dan unsur jaminannya.
- source_word: τοῦ πνεύματος
  choice: Roh
  rationale: Konstruksi 'uang muka Roh' mempertahankan hubungan genitif Yunani dan tidak menetapkan dalam teks utama apakah Roh sendiri merupakan uang muka atau uang muka itu berkaitan dengan karya Roh.
- source_word: δὲ
  choice: tidak dinyatakan secara eksplisit
  rationale: δέ hanya menandai perkembangan ringan dalam wacana. Dalam bahasa Indonesia, hubungan ini sudah wajar dari konteks dan tidak memerlukan kata pembuka seperti 'sekarang', yang dapat disalahpahami sebagai keterangan waktu.
theological_decisions:
- issue: Makna 'uang muka Roh'
  choice: Teks utama mempertahankan bentuk yang memungkinkan Roh sendiri dipahami sebagai uang muka bagi penggenapan mendatang.
  alternative: Ungkapan itu dapat dipahami sebagai uang muka atau jaminan yang diberikan oleh Roh mengenai apa yang kelak akan diselesaikan-Nya.
  rationale: Pemakaian Paulus di 2 Korintus 1:22 dan Efesus 1:13–14 mendukung pemahaman bahwa Roh sendiri adalah pemberian awal yang menjamin warisan mendatang. Namun, bentuk genitif Yunani tidak perlu dijelaskan secara mutlak dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'Dia' menghindari konstruksi nominal yang kaku, sedangkan 'uang muka' mempertahankan metafora konkret teks Yunani. Semua penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
