  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: id
  text: Karena itu, kami pun berusaha keras, entah kami tinggal di rumah[a] atau jauh dari rumah, untuk berkenan kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan pelengkap yang tersirat dari konteks: “entah tinggal di dalam tubuh atau jauh dari tubuh.”'
    reason: Menjelaskan pelengkap yang tersirat dari konteks ayat 6–8 tanpa memasukkannya ke dalam teks utama.
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari pembahasan sebelumnya tentang hidup dalam tubuh dan tinggal bersama Tuhan; ungkapan ini alami sekaligus mempertahankan hubungan logisnya.
- source_word: καὶ
  choice: pun
  rationale: Menyatakan kesinambungan dan penambahan penekanan secara wajar dalam bahasa Indonesia.
- source_word: φιλοτιμούμεθα
  choice: kami bertekad
  rationale: Mengungkapkan hasrat sungguh-sungguh dan tujuan yang diupayakan. 'Bertekad' alami bagi pembaca modern dan lebih kuat daripada sekadar 'bertujuan'.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: entah tinggal di rumah atau berada jauh
  rationale: Mempertahankan pasangan metaforis 'berada di rumah/berada jauh' dan tidak menambahkan pelengkap yang dibiarkan tersirat dalam ayat Yunani.
- source_word: εὐάρεστοι
  choice: berkenan
  rationale: Secara alami menyatakan keadaan yang menyenangkan atau dapat diterima oleh Tuhan dalam ragam bahasa Alkitab Indonesia yang tetap mudah dipahami.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Menerjemahkan pronomina Yunani secara langsung; acuannya kepada Tuhan jelas dari konteks dekat.
- source_word: εἶναι
  choice: untuk
  rationale: Dalam konstruksi Indonesia 'untuk berkenan', kata ini menyatakan tujuan yang menjadi pelengkap dari tekad Paulus.
theological_decisions:
- issue: Apakah pelengkap tersirat bagi 'tinggal di rumah' dan 'berada jauh' perlu dinyatakan secara eksplisit
  choice: Mempertahankan ungkapan ringkas 'entah tinggal di rumah atau berada jauh' dalam teks utama
  alternative: entah tinggal di dalam tubuh atau berada jauh dari tubuh
  rationale: Konteks ayat 6–8 menunjukkan bahwa yang dimaksud ialah tinggal di dalam tubuh atau berada jauh dari tubuh, tetapi teks Yunani ayat ini tidak menyebut pelengkap itu. Terjemahan utama mempertahankan keringkasan dan ambiguitas bentuk aslinya, sedangkan catatan kaki menjelaskan makna kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora 'tinggal di rumah/berada jauh' dipertahankan; bentuk 'kepada-Nya' mengikuti kebiasaan ortografis Indonesia untuk pronomina yang mengacu kepada Tuhan.
