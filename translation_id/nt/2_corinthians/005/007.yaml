  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: id
  text: Sebab kita hidup berdasarkan iman, bukan berdasarkan apa yang kelihatan[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukan berdasarkan penglihatan” atau “bukan berdasarkan penampilan.” Kata Yunani ini dapat menunjuk pada bentuk atau penampilan yang terlihat; “apa yang kelihatan” dipilih untuk mempertahankan pertentangannya dengan “iman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: berdasarkan iman
  rationale: διά dengan genetif menyatakan dasar, sarana, atau cara. Dalam pertentangan singkat ini, “berdasarkan iman” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan makna bahwa iman mengarahkan cara hidup.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau penjelasan bagi pernyataan di sekitarnya; “sebab” mempertahankan fungsi penghubung itu tanpa memperberat kalimat.
- source_word: περιπατοῦμεν
  choice: kita hidup
  rationale: Secara harfiah berarti “kita berjalan,” tetapi περιπατέω sering menjadi metafora bagi cara menjalani hidup. “Kita hidup” menyampaikan makna idiomatis secara jelas dalam bahasa Indonesia modern.
- source_word: οὐ διὰ εἴδους
  choice: bukan berdasarkan apa yang kelihatan
  rationale: εἶδος dapat berarti bentuk, penampilan, atau sesuatu yang terlihat. Pilihan ini mempertahankan cakupan ranah yang tampak tanpa membatasinya pada kemampuan indrawi “penglihatan” atau kesan lahiriah semata.
theological_decisions:
- issue: Makna πίστις dalam pertentangan dengan εἶδος
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: Dalam konteks ini, pertentangan dengan apa yang kelihatan menunjuk pada hidup yang bersandar pada iman, bukan terutama sifat setia. “Iman” mempertahankan istilah teologis Paulus tanpa menambahkan penafsiran denominatif.
- issue: Metafora περιπατοῦμεν
  choice: kita hidup
  alternative: kita berjalan
  rationale: “Kita hidup” mengungkapkan arti metaforis yang lazim, yaitu menjalani kehidupan. Alternatif harfiah “kita berjalan” mempertahankan citra Yunani, tetapi dalam bahasa Indonesia dapat lebih mudah dipahami sebagai gerak fisik.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
