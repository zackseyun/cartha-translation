  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: id
  text: Karena itu, karena kami mengetahui takut akan Tuhan,[a] kami meyakinkan orang-orang. Namun, kami telah tersingkap bagi Allah,[b] dan saya berharap bahwa kami juga telah tersingkap dalam hati nurani kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “takut akan Tuhan” juga dapat dipahami mencakup rasa hormat penuh takzim kepada Tuhan, tetapi konteks pengadilan pada ayat sebelumnya turut memberi nuansa kegentaran dan pertanggungjawaban.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kami telah dinyatakan kepada Allah”; demikian pula pada akhir ayat, “telah dinyatakan dalam hati nurani kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Karena itu, karena kami tahu
  rationale: οὖν menyatakan kesimpulan dari konteks sebelumnya, sedangkan partisip Εἰδότες paling wajar dipahami bernuansa sebab dalam bahasa Indonesia. Bentuk ini mempertahankan kedua hubungan tersebut tanpa membuat kalimat kaku.
- source_word: τὸν φόβον τοῦ κυρίου
  choice: apa artinya takut akan Tuhan
  rationale: Ungkapan ini mempertahankan unsur takut, yang penting dalam konteks takhta pengadilan pada ayat sebelumnya, tetapi mengungkapkan konstruksi Yunani secara alami dalam bahasa Indonesia.
- source_word: ἀνθρώπους πείθομεν
  choice: kami meyakinkan orang-orang
  rationale: πείθομεν adalah indikatif kini aktif dan secara langsung berarti membujuk atau meyakinkan. Pilihan ini tidak melemahkannya menjadi sekadar usaha untuk meyakinkan; ἀνθρώπους bersifat umum dan mencakup manusia tanpa membedakan gender.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Namun, kami sudah nyata bagi Allah
  rationale: 'Perfect pasif πεφανερώμεθα menyatakan keadaan kini sebagai hasil penyingkapan: diri Paulus dan rekan-rekannya terbuka serta diketahui sebagaimana adanya oleh Allah. ''Sudah nyata'' alami dan menghindari kesan relasional khusus yang dapat timbul dari ''telah dikenal Allah''.'
- source_word: ἐλπίζω
  choice: saya berharap
  rationale: Bentuk orang pertama tunggal dipertahankan, sesuai peralihan Yunani dari 'kami' kepada harapan pribadi Paulus.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι
  choice: sudah nyata dalam hati nurani kalian
  rationale: Terjemahan ini mempertahankan preposisi 'dalam', bentuk jamak yang merujuk kepada para penerima secara perseorangan, serta aspek hasil dari infinitif perfect pasif.
theological_decisions:
- issue: Makna 'takut akan Tuhan' dalam konteks pengadilan Kristus
  choice: Mempertahankan kata 'takut'
  alternative: hormat atau takzim kepada Tuhan
  rationale: Konteks langsung tentang pengadilan pada 2 Korintus 5:10 mendukung makna yang mencakup rasa gentar, hormat, dan kesadaran akan pertanggungjawaban. Mengganti seluruhnya dengan 'hormat' akan melemahkan ketegangan teks.
- issue: Arti φανερόω sehubungan dengan Allah dan hati nurani jemaat Korintus
  choice: sudah nyata
  alternative: telah dinyatakan; telah dikenal; telah tersingkap
  rationale: Pilihan ini menyampaikan bahwa diri dan pelayanan para rasul terbuka sebagaimana adanya bagi Allah dan, menurut harapan Paulus, juga diakui demikian dalam hati nurani jemaat, tanpa menambahkan klaim teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak dengan jelas dan tetap mudah dipahami. Pengulangan 'sudah nyata' sengaja dipertahankan agar kesejajaran kedua bentuk φανερόω dalam bahasa Yunani tetap terlihat.
