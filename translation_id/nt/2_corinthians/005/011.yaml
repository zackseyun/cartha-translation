revisions:
- from: Karena itu, karena kami tahu apa artinya takut akan Tuhan,[a] kami meyakinkan orang-orang. Namun, kami sudah nyata bagi Allah,[b] dan saya berharap bahwa kami juga sudah nyata dalam hati nurani kalian.
  to: Karena itu, karena kami mengetahui takut akan Tuhan,[a] kami meyakinkan orang-orang. Namun, kami telah tersingkap bagi Allah,[b] dan saya berharap bahwa kami juga telah tersingkap dalam hati nurani kalian.
  rationale: Revisi menghapus tambahan makna metabahasa pada ungkapan “takut akan Tuhan,” merapikan hubungan logis pembuka kalimat, dan mengganti “sudah nyata” dengan “telah tersingkap” untuk menyatakan lebih jelas bentuk perfect pasif φανερόω. Kesepadanan istilah φανερόω pada kedua kemunculannya dipertahankan. Penanda catatan kaki tetap dilekatkan pada unsur yang dijelaskannya dan tidak ada perubahan makna substantif di luar koreksi tersebut.
  reviewer_model: gpt-5.6-terra
