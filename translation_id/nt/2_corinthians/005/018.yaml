  terminology: “Allah,” “Mesias,” dan “pendamaian” konsisten dengan istilah yang dipilih. “Mesias” mempertahankan fungsi gelar Χριστός. Catatan kaki yang ada menjelaskan alternatif cakupan τὰ πάντα dan ambiguitas rujukan “kita” tanpa memaksakan pembacaan apostolik atau universal.
