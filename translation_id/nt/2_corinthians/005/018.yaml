id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: id
  text: Semua ini berasal dari Allah[a], yang telah mendamaikan kita dengan diri-Nya melalui Mesias dan telah mempercayakan kepada kita pelayanan pendamaian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Segala sesuatu berasal dari Allah.” Ungkapan ini dapat menunjuk secara luas pada segala sesuatu atau, lebih khusus, pada hal-hal yang baru saja disebutkan dalam konteks.
    reason: lexical_alternative
  - marker: b
    text: Kata “kita” dapat mencakup orang-orang percaya secara umum, meskipun dalam konteks sekitarnya Paulus terutama menyoroti amanat kerasulan yang dipercayakan kepadanya dan rekan-rekannya.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Semua ini
  rationale: Artikel dengan bentuk jamak netral πάν­ta secara wajar menunjuk kembali pada realitas yang baru disebutkan, sedangkan δέ hanya menandai peralihan ringan dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: ἐκ menyatakan sumber atau asal; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: yang telah mendamaikan kita dengan diri-Nya
  rationale: Partisip aoris dijadikan klausa relatif yang alami. 'Mendamaikan ... dengan' menyampaikan pemulihan hubungan, dan 'diri-Nya' mempertahankan unsur refleksif.
- source_word: διὰ Χριστοῦ
  choice: melalui Mesias
  rationale: διά dengan genitif menyatakan perantaraan; Χριστός berfungsi sebagai gelar dan karena itu diterjemahkan 'Mesias'.
- source_word: καὶ δόντος ἡμῖν
  choice: dan telah mempercayakan kepada kita
  rationale: Secara harfiah berarti 'dan telah memberikan kepada kita'. Dalam hubungan dengan διακονία, 'mempercayakan' secara alami mengungkapkan pemberian suatu tugas tanpa mengubah pelakunya atau isi penugasan.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: pelayanan pendamaian
  rationale: διακονία menunjuk pada pelayanan atau tugas yang dipercayakan, sedangkan genitif καταλλαγῆς mendefinisikan isi atau ciri pelayanan itu.
theological_decisions:
- issue: Cakupan kata ganti ἡμᾶς dan ἡμῖν
  choice: kita
  alternative: kita sebagai orang percaya secara umum; atau Paulus dan rekan-rekan kerasulannya secara khusus
  rationale: Bahasa Yunani tidak menyelesaikan cakupannya. Konteks mencakup realitas orang percaya, tetapi kemudian menonjolkan amanat Paulus dan rekan-rekannya; teks utama mempertahankan ketegangan ini.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini Χριστός menonjol sebagai gelar pribadi yang menjadi perantara pendamaian, sehingga 'Mesias' mempertahankan fungsi gelarnya.
- issue: Nuansa δόντος
  choice: telah mempercayakan
  alternative: telah memberikan
  rationale: Karena objeknya adalah pelayanan, 'mempercayakan' menjelaskan sifat pemberian sebagai amanat. Makna literal 'memberikan' tetap layak, tetapi pilihan utama lebih alami dalam konteks penugasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pendamaian' dipilih untuk istilah relasional καταλλαγή; huruf kapital pada 'diri-Nya' mengikuti kebiasaan hormat yang lazim dalam penerjemahan Alkitab Indonesia. Semua penanda catatan kaki ditempatkan dalam teks utama.
