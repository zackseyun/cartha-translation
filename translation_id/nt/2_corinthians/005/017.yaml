id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: id
  text: Jadi, jika seseorang ada di dalam Mesias—ciptaan baru[a]! Hal-hal yang lama sudah berlalu; lihatlah, hal-hal yang baru sudah datang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “ia adalah ciptaan baru,” atau, “ada ciptaan baru.” Bahasa Yunani berbentuk eliptis, secara harfiah: “jika seseorang di dalam Mesias—ciptaan baru.”'
    reason: alternative_reading
  - marker: b
    text: Banyak terjemahan berbunyi, “segala sesuatu sudah menjadi baru.” Teks SBLGNT di sini hanya menyebut “hal-hal yang baru sudah datang,” tanpa kata eksplisit yang berarti “segala sesuatu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: εἴ τις
  choice: jika seseorang
  rationale: Menyampaikan syarat tak tentu yang berlaku umum tanpa memasukkan kekhususan gender.
- source_word: ἐν Χριστῷ
  choice: ada di dalam Mesias
  rationale: Mempertahankan ungkapan khas Paulus tentang kesatuan dengan Mesias sekaligus menerjemahkan Χριστός sebagai gelar.
- source_word: καινὴ κτίσις
  choice: ciptaan baru
  rationale: Bahasa Yunani tidak memiliki verba dalam klausa ini. Bentuk seruan yang ringkas mempertahankan elipsis serta tidak membatasi maknanya hanya pada individu atau hanya pada tatanan ciptaan yang diperbarui.
- source_word: τὰ ἀρχαῖα
  choice: hal-hal yang lama
  rationale: Mencerminkan adjektiva netral jamak yang dipakai secara substantival dan membiarkan cakupannya tetap luas.
- source_word: παρῆλθεν
  choice: sudah berlalu
  rationale: Menyampaikan tindakan yang telah terjadi dan relevansinya bagi keadaan sekarang secara idiomatis.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi partikel yang menarik perhatian dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: γέγονεν καινά
  choice: hal-hal yang baru sudah datang
  rationale: Mencerminkan bentuk jamak καινά dan keadaan kini yang dihasilkan oleh perubahan dalam verba perfektum, tanpa menambahkan kata 'semua' yang tidak terdapat dalam teks SBLGNT.
theological_decisions:
- issue: Χριστῷ sebagai gelar atau bentuk yang diperlakukan seperti nama
  choice: di dalam Mesias
  alternative: di dalam Kristus
  rationale: Mesias menerjemahkan nilai gelar Χριστός dan mempertahankan makna mesianik dalam rumusan Paulus.
- issue: Cara memahami frasa eliptis καινὴ κτίσις
  choice: ciptaan baru!
  alternative: 'ia adalah ciptaan baru; atau: ada ciptaan baru'
  rationale: Teks Yunani secara harfiah tidak menyatakan subjek maupun verba. Rumusan utama mempertahankan kepadatan dan keterbukaannya, sedangkan kemungkinan pembacaan individual dijelaskan dalam catatan kaki.
- issue: Cakupan καινά dalam teks SBLGNT
  choice: hal-hal yang baru sudah datang
  alternative: segala sesuatu sudah menjadi baru
  rationale: SBLGNT memiliki καινά tanpa kata eksplisit untuk 'segala sesuatu'; terjemahan tidak boleh memasukkan perluasan tradisional itu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Tanda pisah dan tanda seru mempertahankan daya retoris klausa Yunani yang tanpa verba. Semua penanda catatan kaki dicantumkan dalam teks utama.
