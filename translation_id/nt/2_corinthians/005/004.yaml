  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: id
  text: Sebab memang, selama kita berada dalam kemah ini, kita mengerang karena terbebani. Kita tidak ingin menanggalkan pakaian, melainkan mengenakan pakaian tambahan[a], supaya yang fana[b] ditelan oleh kehidupan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenakan pakaian di atas pakaian yang sudah dikenakan.” Kata kerja Yunani menyiratkan tindakan mengenakan pakaian luar di atas pakaian yang telah dipakai.
    reason: lexical_alternative
  - marker: b
    text: Atau “apa yang dapat mati” atau “kefanaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab memang
  rationale: Mempertahankan fungsi penghubung yang menjelaskan ayat sebelumnya sekaligus nuansa penegasan.
- source_word: σκήνει
  choice: kemah
  rationale: Mempertahankan metafora Paulus tentang keberadaan jasmani sekarang dan kaitannya dengan konteks sekitarnya.
- source_word: στενάζομεν
  choice: kita mengerang
  rationale: Mengungkapkan beban dan kerinduan yang kuat; lebih tepat daripada ungkapan yang sekadar berarti menghela napas.
- source_word: βαρούμενοι
  choice: karena terbebani
  rationale: Menyampaikan bentuk pasif serta hubungan keadaan atau sebab dengan tindakan mengerang.
- source_word: ἐφ’ ᾧ
  choice: sebab
  rationale: Dalam konteks ini frasa tersebut paling wajar dipahami sebagai pengantar alasan, tanpa memperberat kalimat Indonesia.
- source_word: ἐκδύσασθαι
  choice: menanggalkan pakaian
  rationale: Mempertahankan metafora pakaian dan tidak menjabarkannya sebagai keadaan teologis tertentu.
- source_word: ἐπενδύσασθαι
  choice: mengenakan pakaian di atas pakaian yang sudah ada
  rationale: Awalan pada verba Yunani menyiratkan mengenakan sesuatu di atas yang telah dikenakan; rumusan ini membuat gambaran tersebut jelas dalam bahasa Indonesia.
- source_word: καταποθῇ
  choice: ditelan
  rationale: Mempertahankan gambaran kuat mengenai sesuatu yang dikalahkan atau dilenyapkan sepenuhnya.
- source_word: τὸ θνητόν
  choice: yang fana
  rationale: Adjektiva netral yang dipakai sebagai nomina menunjuk pada apa yang tunduk kepada kematian; 'yang fana' ringkas, alami, dan tetap cukup luas.
- source_word: ζωῆς
  choice: kehidupan
  rationale: Membentuk kontras alami dengan kefanaan dan berfungsi jelas sebagai pelaku dalam konstruksi pasif bahasa Indonesia.
theological_decisions:
- issue: Metafora pakaian dan keadaan antara kematian dan kebangkitan
  choice: Mempertahankan gambaran menanggalkan pakaian dan mengenakan pakaian di atas pakaian yang sudah ada tanpa menentukan skema doktrinal tertentu.
  alternative: Menafsirkan 'menanggalkan pakaian' secara eksplisit sebagai keberadaan tanpa tubuh, atau 'mengenakan pakaian di atas' hanya sebagai tubuh kebangkitan.
  rationale: Bahasa Yunani memakai metafora mengenai keberadaan jasmani dan transformasi mendatang. Terjemahan sebaiknya mempertahankan ketegangan teologisnya tanpa menetapkan lebih daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Metafora kemah, pakaian, dan tindakan menelan dipertahankan. Struktur kalimat tetap mengikuti alur argumentasi Yunani, tetapi dibuat wajar bagi pembaca Indonesia masa kini.
