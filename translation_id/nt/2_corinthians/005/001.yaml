id: 2CO.5.1
reference: 2 Corinthians 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: id
  text: Sebab kita tahu bahwa jika rumah kemah kita yang di bumi ini dibongkar[a], kita memiliki sebuah bangunan dari Allah, sebuah rumah yang tidak dibuat dengan tangan manusia[b], yang kekal di surga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihancurkan” atau “diruntuhkan.” Kata Yunaninya dapat menggambarkan pembongkaran suatu bangunan, selaras dengan gambaran kemah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak dibuat dengan tangan.” Maksud ungkapan ini ialah bahwa rumah tersebut bukan hasil pekerjaan manusia, melainkan berasal dari Allah.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Yunani memakai bentuk jamak, “di surga-surga.” Dalam bahasa Indonesia, “di surga” merupakan ungkapan yang lazim untuk ranah surgawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: kita tahu
  rationale: Menyatakan pengetahuan yang mantap dan merupakan padanan Indonesia yang alami.
- source_word: γὰρ
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan uraian sebelumnya sebagai alasan atau dasar.
- source_word: ἐὰν ... καταλυθῇ
  choice: jika ... dibongkar
  rationale: Bentuk ini menyatakan kemungkinan pada masa mendatang; 'dibongkar' mempertahankan gambaran sebuah kemah yang dilepas atau bangunan yang diruntuhkan.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: rumah kemah kita yang di bumi ini
  rationale: Mempertahankan kedua unsur metafora, yakni rumah dan kemah, tanpa langsung menafsirkannya sebagai tubuh.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: sebuah bangunan dari Allah
  rationale: Memahami οἰκοδομή secara konkret sebagai bangunan dan mempertahankan gagasan asal ilahi dalam ἐκ θεοῦ.
- source_word: ἔχομεν
  choice: kita memiliki
  rationale: Mempertahankan bentuk kini dalam bahasa Yunani dan tidak mengubahnya menjadi 'akan memiliki'.
- source_word: οἰκίαν ἀχειροποίητον
  choice: sebuah rumah yang tidak dibuat dengan tangan manusia
  rationale: Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan kontras antara karya manusia dan apa yang berasal dari Allah.
- source_word: αἰώνιον
  choice: yang kekal
  rationale: Menunjukkan ketetapan dan keberlangsungan rumah surgawi sebagai lawan dari tempat tinggal duniawi yang sementara.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga-surga
  rationale: Mempertahankan bentuk jamak Yunani dan nuansa ranah surgawi, meskipun bentuk tunggal lebih lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan gambaran tempat tinggal
  choice: Mempertahankan metafora rumah, kemah, dan bangunan dalam teks utama.
  alternative: Menggantikannya secara langsung dengan 'tubuh'.
  rationale: Teks Yunani menumpuk gambaran rumah, kemah, bangunan, dan rumah yang tidak dibuat dengan tangan. Menulis 'tubuh' akan menyelesaikan penafsiran yang dibiarkan tersirat oleh teks.
- issue: Daya waktu ἔχομεν
  choice: Menggunakan bentuk kini 'kita memiliki'.
  alternative: kita akan memiliki
  rationale: Kata kerja Yunani berbentuk kini. Terjemahan ini mempertahankan ketegangan antara kepemilikan sekarang dan perwujudan pada masa mendatang.
- issue: Makna ἀχειροποίητον
  choice: yang tidak dibuat dengan tangan manusia
  alternative: yang bukan buatan manusia
  rationale: Pilihan ini mempertahankan gema ungkapan alkitabiah yang mengontraskan asal ilahi dengan pekerjaan tangan manusia tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'rumah kemah' sengaja dipertahankan untuk membawa dua lapis metafora Yunani. Bentuk 'surga-surga' agak kurang lazim, tetapi dipakai untuk menjaga bentuk jamak sumber; catatan kaki membantu pembaca memahami ungkapan tersebut.
