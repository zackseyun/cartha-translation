id: 2CO.5.2
reference: 2 Corinthians 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: id
  text: Sebab memang, dalam keadaan ini kita mengeluh, sambil sangat merindukan untuk mengenakan[b] tempat kediaman kita yang berasal dari surga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tempat kediaman surgawi kita.” Secara lebih harfiah, teks Yunani berbunyi “tempat kediaman kita yang dari surga,” dengan penekanan pada asalnya.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Yunani ini dapat mengandung arti “mengenakan di atas,” seperti mengenakan sehelai pakaian di atas pakaian lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab memang
  rationale: Gabungan ini menghubungkan ayat dengan penjelasan sebelumnya sekaligus memberi penegasan ringan. Frasa ini lebih wajar dalam bahasa Indonesia daripada mempertahankan καί sebagai "dan" secara mekanis.
- source_word: ἐν τούτῳ
  choice: dalam keadaan ini
  rationale: Ungkapan ini tetap cukup terbuka untuk menunjuk pada keadaan jasmani sekarang yang baru disebutkan, tanpa secara eksplisit menambahkan kata "kemah" yang tidak diulangi dalam teks Yunani.
- source_word: στενάζομεν
  choice: kita mengeluh
  rationale: Kata "mengeluh" mengungkapkan beban batin yang menyertai kerinduan tanpa mempersempitnya menjadi ratapan terbuka.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: tempat kediaman kita yang berasal dari surga
  rationale: Terjemahan ini mempertahankan metafora tempat tinggal serta arti asal dalam ἐξ οὐρανοῦ, dan tidak menggesernya hanya menjadi sifat "surgawi".
- source_word: ἐπενδύσασθαι
  choice: untuk mengenakan
  rationale: Kata ini memakai gambaran mengenakan pakaian dan dapat mengandung nuansa mengenakan sesuatu di atas yang sudah dipakai. Bentuk sederhana "mengenakan" alami dalam teks utama, sedangkan nuansa khususnya dijelaskan dalam catatan kaki.
- source_word: ἐπιποθοῦντες
  choice: sambil sangat merindukan
  rationale: Partisipel ini menyatakan kerinduan kuat yang berlangsung bersamaan dengan keluhan; "sangat merindukan" menyampaikan intensitasnya secara alami.
theological_decisions:
- issue: Hakikat tempat kediaman dari surga
  choice: Mempertahankan perpaduan metafora tempat kediaman dan pakaian tanpa menentukan secara eksplisit apa yang dimaksud.
  alternative: Menafsirkannya langsung sebagai "tubuh kebangkitan" atau "rumah surgawi".
  rationale: Ayat ini sendiri tidak menuntaskan apakah ungkapan tersebut secara khusus menunjuk pada tubuh kebangkitan, keadaan antara, atau tempat kediaman eskatologis. Terjemahan mempertahankan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat menjaga dua metafora yang bertumpang tindih—tempat kediaman dan pakaian—serta mempertahankan rujukan ἐν τούτῳ secara cukup terbuka.
