source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: id
  text: Sebab kita semua harus dinyatakan[a] di hadapan kursi pengadilan Mesias[b], supaya masing-masing menerima balasan yang setimpal dengan perbuatan yang dilakukannya melalui tubuh[c], entah baik atau buruk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harus tampil.” Kata Yunani ini dapat berarti tampil di hadapan seseorang atau dinyatakan secara terbuka.
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Kristus”; gelar itu berarti “Mesias.”'
    reason: alternative_reading
  - marker: c
    text: Atau “dalam tubuh.” Ungkapan Yunani ini dapat menunjuk pada perbuatan yang dilakukan melalui tubuh dalam kehidupan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: dinyatakan apa adanya
  rationale: Bentuk pasif ini dapat berarti tampil atau dibuat nyata. Pilihan ini mempertahankan nuansa penyingkapan terbuka dalam suasana pengadilan, tanpa sekadar menyatakan kehadiran fisik.
- source_word: βήματος
  choice: kursi pengadilan
  rationale: Dalam konteks ini βῆμα menunjuk pada tempat duduk atau panggung pejabat yang menjalankan penilaian hukum. 'Kursi pengadilan' jelas dan tetap mempertahankan gambaran yudisialnya.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini berfungsi sebagai gelar. 'Mesias' menyampaikan arti gelar tersebut secara langsung dalam bahasa Indonesia.
- source_word: κομίσηται
  choice: menerima balasan
  rationale: Kata ini dalam konteks tersebut menyatakan penerimaan kembali sebagai hasil yang sepadan dengan perbuatan. 'Menerima balasan' menyampaikan unsur ganjaran tanpa menentukan lebih jauh apakah hasilnya berupa upah atau hukuman.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: balasan yang sesuai dengan apa yang dilakukannya dalam tubuh
  rationale: Susunan Yunani ini padat dan menghubungkan apa yang diterima dengan perbuatan setiap orang dalam kehidupan jasmaninya. Rumusan Indonesia ini alami, mempertahankan pertanggungjawaban pribadi, dan tidak menghilangkan kemungkinan arti instrumental διά, yang dicatat dalam catatan kaki.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Bentuk distributif tunggal menekankan pertanggungjawaban setiap orang secara pribadi; 'masing-masing' menyampaikan tekanan itu secara wajar.
- source_word: ἀγαθὸν ... φαῦλον
  choice: baik ataupun buruk
  rationale: Pasangan ini membentuk kontras moral yang luas. 'Buruk' mempertahankan keluasan φαῦλον dan tidak mempersempitnya hanya menjadi kejahatan berat.
theological_decisions:
- issue: Sifat dan cakupan peristiwa penilaian di hadapan Mesias
  choice: Mempertahankan bahasa pengadilan, pertanggungjawaban universal, dan balasan pribadi tanpa menjelaskan lebih lanjut siapa tepatnya yang dihakimi atau hasil akhirnya.
  alternative: Menafsirkannya secara khusus sebagai pengadilan upah bagi orang percaya saja, atau sebagai penghakiman terakhir atas seluruh umat manusia.
  rationale: Ayat ini menegaskan bahwa semua harus dinyatakan dan masing-masing menerima balasan menurut perbuatannya, tetapi ayat ini sendiri tidak menyelesaikan perbedaan sistematis mengenai cakupan dan hasil pengadilan tersebut.
- issue: Kekuatan makna φανερωθῆναι
  choice: dinyatakan apa adanya
  alternative: tampil atau menghadap
  rationale: Pilihan utama mempertahankan kemungkinan kuat bahwa pribadi dan perbuatan menjadi nyata di hadapan pengadilan, sedangkan kemungkinan makna yang lebih netral dicatat tanpa dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Dinyatakan apa adanya' dipilih untuk menyampaikan penyingkapan forensik secara alami; 'menerima balasan yang sesuai' menjaga hubungan antara hasil dan perbuatan tanpa memasukkan kerangka doktrinal tertentu.
