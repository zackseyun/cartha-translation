  terminology: “Kursi pengadilan Mesias” mempertahankan citra yudisial βῆμα dan kebijakan menerjemahkan Χριστός sebagai “Mesias.” “Balasan” tidak menentukan hasilnya hanya sebagai upah atau hukuman, karena kontras “baik atau buruk” tetap dibiarkan luas.
