id: 2CO.5.19
reference: 2 Corinthians 5:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: id
  text: yaitu bahwa Allah di dalam Mesias sedang mendamaikan dunia dengan diri-Nya, dengan tidak memperhitungkan pelanggaran-pelanggaran mereka kepada mereka, dan telah memercayakan kepada kami berita pendamaian itu.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di dalam Mesias, Allah sedang mendamaikan dunia dengan diri-Nya.”
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “dan telah menaruh di dalam kami”; dapat juga dipahami “menempatkan di antara kami.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “firman pendamaian itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: yaitu bahwa
  rationale: Ungkapan ini memperkenalkan penjelasan tentang isi pernyataan sebelumnya; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya penjelasnya.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Allah di dalam Mesias sedang mendamaikan
  rationale: Susunan ini mempertahankan ἐν sebagai 'di dalam' dan tidak mengubahnya menjadi ungkapan instrumental 'melalui Mesias'. Bentuk 'sedang mendamaikan' menyampaikan tindakan yang dinyatakan oleh bentuk perifrastik ἦν ... καταλλάσσων.
- source_word: Χριστῷ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan menurut maknanya sebagai 'Mesias'.
- source_word: κόσμον
  choice: dunia
  rationale: Padanan yang alami dan luas, yang dalam konteks ini menunjuk kepada dunia umat manusia tanpa membatasi maknanya melalui parafrasa.
- source_word: καταλλάσσων ... καταλλαγῆς
  choice: mendamaikan ... pendamaian
  rationale: Pasangan ini mempertahankan hubungan leksikal antara kata kerja dan kata benda Yunani.
- source_word: ἑαυτῷ
  choice: dengan diri-Nya
  rationale: Menyatakan arah atau relasi pendamaian kepada Allah dalam idiom Indonesia yang wajar.
- source_word: μὴ λογιζόμενος
  choice: dengan tidak memperhitungkan
  rationale: Mempertahankan metafora perhitungan tanpa memakai istilah teologis yang lebih teknis.
- source_word: παραπτώματα
  choice: pelanggaran-pelanggaran
  rationale: Menunjuk pada perbuatan-perbuatan salah atau penyimpangan dan lebih spesifik daripada istilah umum 'dosa'.
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: dan telah memercayakan kepada kami
  rationale: Secara idiomatis menyampaikan tindakan menempatkan suatu amanat pada para pelayan, sementara bentuk harfiah 'menaruh di dalam kami' dicatat dalam catatan kaki.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: berita pendamaian itu
  rationale: λόγος di sini menunjuk pada isi yang diberitakan; 'berita' jelas dalam bahasa Indonesia masa kini, sedangkan 'firman pendamaian' dicatat sebagai alternatif yang lebih harfiah.
theological_decisions:
- issue: Hubungan Allah dan Mesias dalam θεὸς ἦν ἐν Χριστῷ
  choice: Allah di dalam Mesias sedang mendamaikan dunia dengan diri-Nya
  alternative: Di dalam Mesias, Allah sedang mendamaikan dunia dengan diri-Nya; atau Allah melalui Mesias sedang mendamaikan dunia dengan diri-Nya
  rationale: Pilihan utama mengikuti urutan dan preposisi Yunani sedekat mungkin serta mempertahankan ketegangan antara pengertian lokatif, relasional, dan kemungkinan instrumental tanpa menetapkan salah satunya secara diam-diam.
- issue: Arti ἐν ἡμῖν dalam amanat pendamaian
  choice: memercayakan kepada kami
  alternative: menaruh di dalam kami; menempatkan di antara kami
  rationale: Ungkapan utama dibuat alami sebagai pemberian amanat pelayanan, tetapi kemungkinan nuansa harfiah dan korporat dari ἐν tetap disediakan dalam catatan kaki.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Istilah Yunani ini merupakan gelar yang berarti Yang Diurapi; 'Mesias' mempertahankan fungsi gelarnya dengan jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Diri-Nya' memakai kapital penghormatan yang lazim untuk rujukan kepada Allah. Pengulangan 'kepada mereka' sengaja dipertahankan agar objek αὐτοῖς tidak hilang, walaupun sedikit lebih eksplisit daripada idiom Indonesia sehari-hari.
