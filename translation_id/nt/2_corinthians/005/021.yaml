  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: id
  text: Dia yang tidak mengenal dosa dibuat-Nya menjadi dosa[a] demi kita, supaya di dalam Dia kita menjadi kebenaran Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan penghapus dosa.” Dalam bahasa Yunani, kata yang sama, yaitu “dosa”, dipakai pada kedua tempat; sebagian orang memahami pemakaian kedua dalam arti persembahan korban.
    reason: alternative_reading
  - marker: b
    text: Atau “keadilan Allah” atau “kebenaran yang berasal dari Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὴ γνόντα ἁμαρτίαν
  choice: Dia yang tidak mengenal dosa
  rationale: Ungkapan ini mempertahankan idiom Yunani secara ringkas dan menegaskan bahwa Kristus tidak memiliki keterlibatan pribadi dengan dosa, tanpa memperluasnya secara interpretatif menjadi “tidak pernah berbuat dosa”.
- source_word: ὑπὲρ ἡμῶν
  choice: demi kita
  rationale: “Demi kita” menyampaikan daya benefaktif dan representatif ὑπέρ secara alami dalam bahasa Indonesia tanpa membatasinya pada satu teori pendamaian.
- source_word: ἁμαρτίαν (kemunculan kedua)
  choice: dosa
  rationale: Pengulangan kata Yunani yang sama dipertahankan untuk menjaga rumusan Paulus yang tajam. Tafsiran sakrificial “persembahan penghapus dosa” dicantumkan dalam catatan kaki.
- source_word: ἐποίησεν
  choice: dibuat-Nya menjadi
  rationale: Bentuk ini menyampaikan tindakan Allah dan melengkapi konstruksi bahasa Indonesia secara alami, sambil mempertahankan makna dasar ποιέω dalam konteks ini.
- source_word: γενώμεθα
  choice: kita menjadi
  rationale: “Menjadi” mempertahankan nuansa γίνομαι dan cocok dengan klausa tujuan yang diperkenalkan oleh ἵνα, tanpa mengubahnya menjadi keadaan statis.
- source_word: δικαιοσύνη θεοῦ
  choice: kebenaran Allah
  rationale: Terjemahan ini mempertahankan bentuk genitif yang padat dan terbuka, tanpa memutuskan apakah maksudnya kebenaran milik Allah, yang berasal dari Allah, atau status benar dalam hubungan dengan Allah.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Ungkapan Paulus yang penting ini dipertahankan secara dekat dan wajar, tanpa memperluasnya menjadi “dalam persatuan dengan Dia”.
theological_decisions:
- issue: Arti “dibuat-Nya menjadi dosa”
  choice: Mempertahankan ungkapan Paulus bahwa Allah membuat Dia yang tidak mengenal dosa menjadi “dosa” demi kita, tanpa menyiratkan bahwa Kristus menjadi berdosa secara moral.
  alternative: “Dibuat-Nya menjadi persembahan penghapus dosa.”
  rationale: Klausa pertama secara tegas menjaga ketidakberdosaan Kristus. Teks utama mempertahankan ketegangan ungkapan Yunani, sedangkan pengertian sakrificial yang masuk akal disediakan dalam catatan kaki.
- issue: Makna δικαιοσύνη θεοῦ
  choice: kebenaran Allah
  alternative: keadilan Allah; kebenaran yang berasal dari Allah
  rationale: Frasa ini padat dan diperdebatkan. Bentuk utama tidak menetapkan satu penafsiran teologis tertentu, sementara kemungkinan leksikal dan relasi genitif lainnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “dibuat-Nya” membuat pelaku ilahi yang tersirat tetap jelas tanpa menambahkan nama “Allah” ke dalam teks utama. Kapitalisasi “Dia” mengikuti kebiasaan penghormatan dalam bahasa Indonesia untuk merujuk kepada Kristus.
