id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: id
  text: Kiranya anugerah Tuhan Yesus Mesias[a], kasih Allah, dan persekutuan Roh Kudus[b] menyertai kamu semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut penyebutan tradisional, “Yesus Kristus.”
    reason: alternative_reading
  - marker: b
    text: Atau “persekutuan dengan Roh Kudus” atau “keikutsertaan dalam Roh Kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Istilah yang alami dan bermartabat dalam bahasa Indonesia untuk kemurahan yang diberikan secara cuma-cuma; mempertahankan bobot teologis istilah Paulus.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku bagi gelar κύριος ketika dikenakan kepada Yesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Mesias
  rationale: Χριστός pada dasarnya adalah gelar, bukan nama keluarga; “Mesias” menyampaikan makna gelar itu, sedangkan bentuk tradisional dicatat dalam catatan kaki.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: kasih Allah
  rationale: Mempertahankan konstruksi genitif sumber tanpa mempersempitnya menjadi uraian seperti “kasih Allah kepada kamu.”
- source_word: κοινωνία τοῦ ἁγίου πνεύματος
  choice: persekutuan Roh Kudus
  rationale: Mempertahankan keluasan relasional dan partisipatif κοινωνία serta ambiguitas hubungan genitifnya; kemungkinan penjelasan lain diberikan dalam catatan kaki.
- source_word: μετὰ πάντων ὑμῶν
  choice: menyertai kamu semua
  rationale: Menyampaikan kehadiran atau penyertaan yang dinyatakan μετά dan mempertahankan penekanan eksplisit πάντων, “semua.”
theological_decisions:
- issue: Pemaknaan Χριστοῦ sebagai gelar kristologis
  choice: Mesias
  alternative: Kristus
  rationale: Karena Χριστός berfungsi sebagai gelar bagi Yesus, terjemahan utama menyampaikan arti gelar tersebut. Bentuk “Kristus” yang mapan secara tradisional tetap disediakan sebagai alternatif.
- issue: Makna κοινωνία τοῦ ἁγίου πνεύματος
  choice: persekutuan Roh Kudus
  alternative: persekutuan dengan Roh Kudus; keikutsertaan dalam Roh Kudus
  rationale: Konstruksi ini dapat menunjuk pada persekutuan yang berkaitan dengan, diberikan oleh, atau berupa partisipasi dalam Roh Kudus. Teks utama tidak memaksakan satu penafsiran yang lebih sempit.
- issue: Bentuk berkat tanpa verba eksplisit dalam bahasa Yunani
  choice: Kiranya ... menyertai
  alternative: '... beserta'
  rationale: Bahasa Yunani mengandaikan ungkapan harapan atau berkat. “Kiranya ... menyertai” melengkapinya secara wajar dalam bahasa Indonesia tanpa mengubahnya menjadi pernyataan fakta biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada liturgis tanpa menjadi arkais. “Kamu semua” dipakai untuk mencerminkan bentuk jamak yang inklusif; “kiranya” menandai fungsi kalimat sebagai berkat. Setiap penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
