  terminology: “Tuhan,” “Yesus Mesias,” “Allah,” dan “Roh Kudus” digunakan secara konsisten dan tepat. Penerjemahan Χριστοῦ sebagai “Mesias” sah sebagai gelar; alternatif tradisional “Yesus Kristus” tersedia pada jangkar catatan kaki yang tepat. Catatan untuk κοινωνία menyediakan alternatif yang relevan tanpa mempersempit arti teks utama.
