  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: id
  text: karena kalian mencari bukti bahwa Mesias berbicara di dalam diriku[a]—Ia tidak lemah terhadap kalian, melainkan berkuasa di antara kalian[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahwa Mesias berbicara melalui diriku.” Secara lebih harfiah, bahasa Yunani berbunyi “Mesias yang berbicara di dalam diriku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “berkuasa di dalam kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: karena
  rationale: Mengungkapkan hubungan sebab dengan konteks sebelumnya secara alami dalam bahasa Indonesia.
- source_word: δοκιμὴν ζητεῖτε
  choice: kalian mencari bukti
  rationale: δοκιμή di sini menunjuk pada bukti yang meneguhkan suatu klaim, sedangkan bentuk kini ζητεῖτε menggambarkan tuntutan yang sedang berlangsung.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: bahwa Mesias berbicara di dalam diriku
  rationale: Konstruksi genitif sesudah δοκιμή diungkapkan secara idiomatis sebagai klausa isi. 'Di dalam diriku' mempertahankan ἐν ἐμοί tanpa langsung menafsirkannya sebagai perantaraan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός dipertahankan sebagai gelar yang bermakna 'Yang Diurapi', bukan semata-mata bentuk nama.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: Ia tidak lemah terhadap kalian
  rationale: '''Terhadap kalian'' mempertahankan arah atau relasi εἰς ὑμᾶς, dan ''tidak lemah'' menjaga kontras leksikal dengan δυνατεῖ.'
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: melainkan berkuasa di dalam kalian
  rationale: '''Berkuasa'' menyampaikan daya aktif δυνατεῖ, sedangkan ''di dalam kalian'' mengikuti ἐν ὑμῖν secara langsung dan tetap membuka kemungkinan makna komunal.'
theological_decisions:
- issue: Makna Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam klausa ini istilah tersebut dapat dibaca sebagai gelar; 'Mesias' mempertahankan arti gelarnya tanpa menambahkan kekhasan denominasi.
- issue: Daya ἐν pada ἐν ἐμοί
  choice: di dalam diriku
  alternative: melalui diriku
  rationale: Teks utama mempertahankan preposisi Yunani dan ambiguitas antara kehadiran dalam diri Paulus dan tindakan melalui Paulus; alternatif idiomatis dicatat dalam catatan kaki.
- issue: Daya ἐν pada ἐν ὑμῖν
  choice: di dalam kalian
  alternative: di antara kalian
  rationale: Terjemahan utama mengikuti bentuk Yunani dengan dekat tanpa menentukan apakah kuasa itu bekerja secara batiniah pada tiap orang atau secara komunal di tengah jemaat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' memperjelas bahwa jemaat secara kolektif disapa. Tanda pisah mempertahankan peralihan tegas menuju penjelasan tentang kuasa Mesias; koma akhir mengikuti status ayat ini sebagai bagian dari kalimat yang berlanjut.
