id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: id
  text: Karena itu, selagi tidak bersama kalian, aku menuliskan hal-hal ini supaya ketika bersama kalian nanti, aku tidak perlu bertindak keras[a] dengan wewenang yang Tuhan berikan kepadaku untuk membangun, bukan untuk meruntuhkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menggunakan ketegasan” atau “bertindak dengan tajam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk pembinaan, bukan untuk penghancuran.” Bahasa Yunani memakai metafora bangunan: “untuk membangun, bukan untuk meruntuhkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menjaga hubungan sebab-akibat dengan konteks sebelumnya dalam ungkapan Indonesia yang alami.
- source_word: ταῦτα ἀπὼν γράφω
  choice: selagi tidak bersama kalian, aku menuliskan hal-hal ini
  rationale: Mempertahankan bentuk jamak ταῦτα serta pertentangan antara ketidakhadiran Paulus sekarang dan kehadirannya kelak; 'tidak bersama kalian' lebih alami daripada 'absen'.
- source_word: ἵνα παρὼν
  choice: supaya ketika bersama kalian nanti
  rationale: Menyatakan tujuan ἵνα dan memberi bentuk temporal yang wajar kepada participium παρὼν.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: aku tidak perlu bertindak keras
  rationale: ἀποτόμως menyatakan ketegasan atau kekerasan tindakan, sedangkan χρήσωμαι berarti menggunakan atau bertindak dengan cara demikian; 'tidak perlu' mengungkapkan keharusan yang tersirat dalam konteks tanpa mengubah tujuan kalimat.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: sesuai dengan wewenang
  rationale: κατά menyatakan kesesuaian dengan wewenang yang dipercayakan; 'wewenang' jelas dan lazim dalam bahasa Indonesia.
- source_word: ἣν ὁ κύριος ἔδωκέν μοι
  choice: yang Tuhan berikan kepadaku
  rationale: Menerjemahkan κύριος dengan gelar 'Tuhan' tanpa menentukan referennya lebih jauh daripada teks, dan memakai bentuk lampau Indonesia yang alami untuk aoristus.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: untuk membangun, bukan untuk meruntuhkan
  rationale: Mempertahankan metafora bangunan dan kontras retoris antara membangun dan meruntuhkan dengan bahasa yang mudah dipahami.
theological_decisions:
- issue: Referen ὁ κύριος yang memberikan wewenang kepada Paulus
  choice: Tuhan
  alternative: 'Secara eksplisit: Tuhan Yesus; atau referen ilahi yang lebih umum'
  rationale: Ayat ini hanya memakai gelar ὁ κύριος. Terjemahan tidak menambahkan identifikasi yang tidak dinyatakan secara eksplisit dalam ayat tersebut.
- issue: Tujuan wewenang apostolik
  choice: untuk membangun, bukan untuk meruntuhkan
  alternative: untuk pembinaan, bukan untuk penghancuran
  rationale: Metafora asli dipertahankan agar tujuan positif dan pembatasan penggunaan wewenang tetap terasa tanpa memasukkan pengertian gerejawi yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang lugas dan bermartabat. Pronomina 'aku/kalian' dipakai agar hubungan pribadi Paulus dengan jemaat terdengar alami; metafora bangunan dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
