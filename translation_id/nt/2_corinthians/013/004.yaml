language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: id
  text: Sebab memang, Kristus disalibkan dalam kelemahan[a], tetapi Ia hidup oleh kuasa Allah. Sebab kami juga lemah di dalam Dia, tetapi kami akan hidup bersama dengan Dia[b] oleh kuasa Allah terhadap kamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari kelemahan” atau “karena kelemahan”; kata Yunani ἐξ dapat menyatakan sumber atau dasar.
    reason: lexical_alternative
  - marker: b
    text: Frasa “kami akan hidup bersama dengan Dia” dapat menunjuk pada kehidupan dan kuasa Kristus yang akan nyata dalam pelayanan rasuli kepada jemaat Korintus, dan juga dapat menggemakan tema kehidupan kebangkitan yang lebih luas.
    reason: alternative_reading
  - marker: c
    text: Atau “bagi kamu”, “di antara kamu”, atau “dalam hubungan dengan kamu”; frasa Yunani εἰς ὑμᾶς dapat menyatakan arah, hubungan, atau dampak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: disalibkan
  rationale: Bentuk pasif aoris dari σταυρόω; “disalibkan” merupakan padanan baku, tepat, dan alami dalam bahasa Indonesia.
- source_word: ἐξ ἀσθενείας
  choice: dalam kelemahan
  rationale: Walaupun ἐξ secara dasar dapat menunjukkan sumber atau dasar, dalam konteks ini ungkapan tersebut secara alami menggambarkan keadaan kelemahan yang menyertai penyaliban. Pilihan ini mempertahankan paradoks antara kelemahan dan kuasa Allah tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: ζῇ
  choice: Ia hidup
  rationale: Bentuk kini aktif dipertahankan untuk menyatakan bahwa Kristus hidup, bukan sekadar pernah dihidupkan.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: oleh kuasa Allah
  rationale: Padanan instrumental ini paling alami dalam bahasa Indonesia. Pengulangan frasa yang sama pada kedua klausa tetap mempertahankan kontras sengaja antara kelemahan dan kuasa Allah.
- source_word: ἀσθενοῦμεν
  choice: kami lemah
  rationale: Mempertahankan hubungan leksikal dengan ἀσθένεια serta tidak mempersempitnya menjadi kelemahan fisik, ketidakmampuan, atau penampilan yang tidak mengesankan saja.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan bahasa Paulus yang padat tentang hubungan atau persatuan dengan Kristus tanpa menjelaskannya secara berlebihan.
- source_word: ζήσομεν
  choice: kami akan hidup
  rationale: Bentuk mendatang dipertahankan. Ungkapan ini dibiarkan cukup luas untuk menunjuk pada kehidupan dan kuasa kerasulan yang akan nyata maupun gema kehidupan kebangkitan.
- source_word: σὺν αὐτῷ
  choice: bersama dengan Dia
  rationale: Menyatakan persekutuan atau partisipasi dengan Kristus secara alami dan jelas.
- source_word: εἰς ὑμᾶς
  choice: dalam hubungan kami dengan kamu
  rationale: Frasa Yunani yang ringkas ini dapat menyatakan arah, relasi, atau dampak. Padanan ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan tindakan Paulus terhadap jemaat Korintus tanpa mempersempitnya menjadi hanya “bagi” atau “di antara” mereka.
theological_decisions:
- issue: Makna “kelemahan” Kristus dalam penyaliban
  choice: Teks menyatakan bahwa Kristus disalibkan dalam keadaan kelemahan, sambil mempertahankan kontras dengan kehidupan-Nya oleh kuasa Allah.
  alternative: Ungkapan itu dapat diterjemahkan lebih harfiah sebagai “karena/dari kelemahan” atau dijelaskan sebagai kelemahan yang tampak menurut penilaian manusia.
  rationale: Terjemahan mempertahankan paradoks Paulus tanpa menyiratkan penyangkalan terhadap keilahian, ketidakberdosaan, atau kuasa hakiki Kristus, dan tanpa memasukkan penjelasan teologis yang tidak dinyatakan langsung dalam ayat.
- issue: Rujukan “kami akan hidup bersama dengan Dia”
  choice: Ungkapan dibiarkan mencakup kehidupan dan kuasa dari Kristus yang akan dinyatakan dalam hubungan Paulus dengan jemaat Korintus, sekaligus tetap terbuka terhadap gema kehidupan kebangkitan.
  alternative: Ungkapan dapat dibatasi hanya pada kebangkitan akhir atau hanya pada pelayanan kerasulan Paulus saat menghadapi jemaat Korintus.
  rationale: Konteks langsung mendukung penerapan kerasulan kepada jemaat Korintus, sedangkan bahasa hidup bersama Kristus memiliki cakupan yang lebih luas. Terjemahan tidak menutup salah satu nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sebab memang” mewakili καὶ γὰρ tanpa kekakuan berlebihan; “Demikian juga” menyampaikan hubungan klausa kedua secara alami. Kapitalisasi kata ganti untuk Kristus mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
