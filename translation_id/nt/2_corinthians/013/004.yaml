    issue: Penghubung pada kalimat kedua
    rationale: “Demikian juga” terutama menyatakan perbandingan, sedangkan καὶ γὰρ kembali memberi alasan/penjelasan. “Sebab kami juga” mempertahankan kedua unsur itu.
  - severity: medium
    issue: Padanan εἰς ὑμᾶς terlalu diperluas
    rationale: “Dalam hubungan kami dengan kamu” memasukkan possessive “kami” dan menguraikan frasa yang sengaja padat. “Terhadap kamu” lebih dekat dengan arah atau relasi yang ditandai εἰς dan tetap dapat diberi catatan alternatif.
  - severity: low
    issue: Letak penanda catatan kaki b dan cakupan penjelasannya
    rationale: Penanda b sebaiknya langsung mengikuti frasa “bersama dengan Dia” yang dijelaskannya. Catatan itu tidak seharusnya membatasi subjek jamak menjadi Paulus seorang.
