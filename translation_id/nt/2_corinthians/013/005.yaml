id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: id
  text: Ujilah diri kalian sendiri untuk mengetahui apakah kalian berada dalam iman[a]; periksalah diri kalian sendiri. Atau, tidakkah kalian menyadari bahwa Yesus Sang Mesias ada di dalam kalian[b]? Kecuali jika ternyata kalian tidak tahan uji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “berada dalam iman” dapat berarti berada dalam iman Kristen atau memiliki iman yang sejati.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ada di tengah-tengah kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: Ujilah
  rationale: Dalam konteks ini kata tersebut berarti menguji kesejatian, bukan mencobai agar jatuh ke dalam dosa.
- source_word: ἐν τῇ πίστει
  choice: tetap berada dalam iman
  rationale: Ungkapan ini mempertahankan gagasan berada dalam ranah atau kenyataan iman Kristen; kata 'tetap' membuat idiom Indonesianya alami tanpa menentukan apakah yang terutama dimaksud ialah kesetiaan pada iman Kristen atau iman pribadi yang sejati.
- source_word: δοκιμάζετε
  choice: periksalah
  rationale: Pilihan ini membedakannya dari πειράζετε sambil mempertahankan nuansa penilaian untuk memastikan apa yang terbukti sejati.
- source_word: ἐπιγινώσκετε
  choice: menyadari
  rationale: Dalam pertanyaan retoris ini, kata tersebut menunjuk pada pengenalan atau kesadaran yang penuh; 'menyadari' terdengar alami dalam bahasa Indonesia.
- source_word: ἑαυτούς
  choice: diri kalian sendiri
  rationale: Dua pemakaian pertama diterjemahkan eksplisit sebagai objek perintah. Dalam klausa pertanyaan, daya refleksifnya tersampaikan secara alami melalui konteks pengujian diri tanpa menghasilkan susunan yang janggal.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar pengakuan di sini; 'Sang Mesias' mempertahankan arti gelarnya, bukan sekadar mentransliterasikannya sebagai nama.
- source_word: ἐν ὑμῖν
  choice: ada di dalam kalian
  rationale: Konteks pemeriksaan diri mendukung kehadiran Mesias dalam diri orang-orang Korintus, sementara kemungkinan arti komunal 'di tengah-tengah kalian' dicatat dalam catatan kaki.
- source_word: εἰ μήτι
  choice: Kecuali kalau ... ternyata
  rationale: Ungkapan ini menyampaikan pengecualian dengan sentuhan retoris yang sedikit melunakkan atau menyiratkan ironi.
- source_word: ἀδόκιμοι
  choice: tidak tahan uji
  rationale: Terjemahan ini mempertahankan kaitan langsung dengan dua perintah untuk menguji dan memeriksa, serta menghindari muatan teologis tambahan yang dapat melekat pada istilah seperti 'tertolak'.
theological_decisions:
- issue: Makna ἐν τῇ πίστει
  choice: berada dalam iman, dengan kemungkinan ketekunan tersirat
  alternative: memiliki iman pribadi yang sejati
  rationale: Bahasa Yunani dapat menunjuk pada keberadaan dalam iman Kristen maupun kenyataan iman pribadi. Teks utama tidak menyelesaikan ketegangan itu secara sempit, dan catatan kaki menyatakannya.
- issue: Penerjemahan Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam pernyataan pengakuan ini, Χριστός dapat dipahami sebagai gelar. Terjemahan semantis menjaga arti gelar tersebut.
- issue: Makna ἐν ὑμῖν
  choice: di dalam kalian
  alternative: di tengah-tengah kalian
  rationale: Konteks pengujian diri mendukung kehadiran Mesias dalam diri para pembaca, tetapi bentuk jamak dan preposisinya juga memungkinkan nuansa komunal; alternatif itu dipertahankan dalam catatan kaki.
- issue: Makna ἀδόκιμοι
  choice: tidak tahan uji
  alternative: tidak layak atau ditolak
  rationale: Pilihan utama mempertahankan permainan gagasan dengan kata-kata pengujian sebelumnya tanpa mengimpor doktrin khusus tentang penolakan kekal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai agar bentuk jamak Yunani jelas dan agar pemeriksaan diri bersifat personal sekaligus ditujukan kepada seluruh jemaat. Pengulangan 'diri kalian sendiri' dipertahankan untuk menampilkan penekanan retoris teks Yunani.
