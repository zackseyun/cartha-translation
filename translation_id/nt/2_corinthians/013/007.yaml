  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: id
  text: Kami berdoa kepada Allah supaya kalian tidak berbuat jahat sedikit pun—bukan supaya kami tampak lulus uji,[a] melainkan supaya kalian melakukan apa yang baik, sekalipun kami tampak tidak lulus uji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terbukti layak.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “kami berada sebagai orang-orang yang tidak lulus uji”; dapat juga diterjemahkan “kami tampak tidak memenuhi syarat.” Kata Yunaninya merupakan lawan dari kata yang diterjemahkan “lulus uji” sebelumnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: Kami berdoa kepada Allah
  rationale: εὐχόμεθα dengan πρός + akusatif menyatakan doa yang diarahkan kepada Allah. Partikel δέ tidak perlu diberi padanan tersendiri karena peralihan gagasannya sudah wajar dalam bahasa Indonesia.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: supaya kalian tidak berbuat jahat sedikit pun
  rationale: Konstruksi infinitif menyatakan isi doa; κακὸν μηδέν menegaskan tidak adanya perbuatan jahat sama sekali. 'Sedikit pun' menyampaikan penegasan negasi itu secara alami.
- source_word: οὐχ ἵνα
  choice: bukan supaya
  rationale: Mempertahankan tujuan yang disangkal oleh Paulus secara ringkas dan alami.
- source_word: δόκιμοι φανῶμεν
  choice: kami tampak tahan uji
  rationale: δόκιμος menunjuk pada sesuatu atau seseorang yang setelah diuji terbukti layak, sedangkan φανῶμεν menyatakan tampak atau terbukti. 'Tahan uji' mempertahankan metafora pengujian dan memungkinkan kontras langsung dengan ἀδόκιμοι.
- source_word: τὸ καλὸν ποιῆτε
  choice: kalian melakukan apa yang baik
  rationale: τὸ καλόν dalam konteks etis berarti apa yang baik atau benar. Pilihan ini alami dan tidak mempersempit maknanya menjadi sekadar kepatuhan pada satu aturan.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: sekalipun kami dianggap tidak tahan uji
  rationale: ὡς membuka nuansa keadaan atau penilaian 'sebagai/seakan-akan', dan ἀδόκιμοι berlawanan langsung dengan δόκιμοι. 'Dianggap' menjaga fokus pada penilaian yang tampak tanpa mengubahnya menjadi pernyataan tentang kebinasaan akhir.
theological_decisions:
- issue: Arti ὡς ἀδόκιμοι dalam penilaian terhadap Paulus dan rekan-rekannya
  choice: dianggap tidak tahan uji
  alternative: berada sebagai orang-orang yang tidak tahan uji; tampak tidak memenuhi syarat
  rationale: Konteks dekat membahas bukti, pengujian, dan pengakuan terhadap pelayanan Paulus. Terjemahan ini menjaga kemungkinan penilaian negatif terhadap mereka tanpa memasukkan gagasan teologis tentang penolakan atau kebinasaan kekal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk membedakan ὑμᾶς dari 'kami'. Ungkapan 'tahan uji/tidak tahan uji' mempertahankan permainan istilah Yunani δόκιμοι/ἀδόκιμοι. Tanda baca em dash menampilkan kontras tujuan secara jelas.
