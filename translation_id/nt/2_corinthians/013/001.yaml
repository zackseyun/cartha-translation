id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: id
  text: 'Ini adalah ketiga kalinya aku datang kepada kalian: “Setiap perkara akan diteguhkan berdasarkan kesaksian dua atau tiga orang saksi.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap perkataan akan diteguhkan berdasarkan keterangan dua atau tiga orang saksi.” Bahasa Yunani mengikuti dengan dekat rumusan Ulangan 19:15 dan memakai ungkapan hukum.
    reason: lexical_alternative
  - marker: b
    text: Mengacu kepada Ulangan 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Ini adalah ketiga kalinya
  rationale: Frasa akusatif netral ini berfungsi secara adverbial untuk menyatakan urutan kedatangan Paulus; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: aku datang kepada kalian
  rationale: Bentuk kini ἔρχομαι dapat menyatakan kedatangan yang sedang direncanakan atau segera terjadi. Ungkapan ini mempertahankan kesegeraan tanpa menambahkan bahwa Paulus sudah dalam perjalanan.
- source_word: ἐπὶ στόματος
  choice: berdasarkan kesaksian
  rationale: Ini merupakan ungkapan hukum yang secara harfiah berarti 'atas mulut'; padanan 'berdasarkan kesaksian' menyampaikan fungsi yuridisnya secara wajar dalam bahasa Indonesia modern.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: dua atau tiga orang saksi
  rationale: Dalam rumusan hukum yang dikutip, καί berfungsi dalam pola distributif 'dua atau tiga', bukan sebagai penjumlahan dua dan tiga. Susunan ini paling alami dalam bahasa Indonesia.
- source_word: σταθήσεται
  choice: akan diteguhkan
  rationale: Bentuk pasif mendatang dari ἵστημι dalam konteks hukum berarti dinyatakan berdiri, ditetapkan, atau dikukuhkan sebagai sah. 'Diteguhkan' mempertahankan nuansa konfirmasi yuridis.
- source_word: πᾶν ῥῆμα
  choice: setiap perkara
  rationale: Walaupun ῥῆμα dapat berarti 'perkataan' atau 'pernyataan', dalam kutipan hukum ini cakupannya adalah perkara yang harus dibuktikan. 'Perkara' menyampaikan makna kontekstual tanpa mempersempitnya menjadi 'dakwaan'.
theological_decisions:
- issue: Penerapan kutipan hukum dari Ulangan dalam konteks tindakan disipliner Paulus
  choice: Menerjemahkan rumusan itu sebagai prinsip hukum umum tentang peneguhan setiap perkara
  alternative: Menerjemahkan πᾶν ῥῆμα secara harfiah sebagai 'setiap perkataan' atau secara lebih sempit sebagai 'setiap tuduhan'
  rationale: Teks menggemakan prinsip hukum Kitab Suci, tetapi tidak secara eksplisit membatasi penerapannya hanya pada disiplin jemaat atau tuduhan tertentu. Terjemahan mempertahankan keluasan dan ketegangan konteks tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' dan 'kalian' dipakai agar hubungan Paulus dengan para penerima tetap langsung serta bentuk jamak ὑμᾶς terlihat jelas. Kutipan memakai istilah hukum yang dapat dipahami pembaca umum tanpa mempertahankan idiom harfiah 'atas mulut' yang tidak alami.
