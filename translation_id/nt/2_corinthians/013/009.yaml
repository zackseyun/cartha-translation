    rationale: Teks Yunani memakai ὑμῶν, bentuk genitif jamak. Dalam pemakaian modern, “-mu” paling lazim dipahami sebagai tunggal. “Kalian” menghilangkan ambiguitas jumlah tanpa mengubah makna.
  - severity: low
