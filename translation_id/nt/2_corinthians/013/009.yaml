  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: id
  text: 'Sebab kami bersukacita ketika kami lemah, sedangkan kalian kuat. Inilah juga yang kami doakan: pemulihan kalian.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedewasaan kalian”, “kelengkapan kalian”, atau “kalian menjadi lengkap”. Kata Yunani ini dapat menunjuk pada pemulihan, perlengkapan, atau pembawaan sesuatu kepada keadaan yang semestinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: kami bersukacita
  rationale: Bentuk kini ini menyatakan sikap Paulus yang sedang berlangsung; “bersukacita” mempertahankan kekuatan makna positif verba tersebut.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan hubungan penjelasan dengan konteks sebelumnya dalam bentuk yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ὅταν
  choice: ketika
  rationale: Bersama bentuk subjungtif, kata ini menyatakan waktu secara umum; “ketika” alami dalam bahasa Indonesia tanpa menutup kemungkinan nuansa berulang.
- source_word: ἀσθενῶμεν
  choice: kami lemah
  rationale: Mempertahankan cakupan luas kelemahan—baik daya, kedudukan, maupun kesan lahiriah—tanpa mempersempit maksud Paulus.
- source_word: δυνατοὶ
  choice: kuat
  rationale: Menjaga kontras langsung dan alami dengan “lemah.”
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Dan inilah juga yang kami doakan
  rationale: Menyampaikan penekanan pada τοῦτο sekaligus menerjemahkan εὐχόμεθα sebagai tindakan berdoa dalam susunan Indonesia yang alami.
- source_word: κατάρτισιν
  choice: pemulihanmu
  rationale: Dalam konteks teguran dan pembenahan jemaat, kata ini dapat menunjuk pada dikembalikannya seseorang atau komunitas kepada keadaan yang semestinya; kemungkinan makna kelengkapan atau kedewasaan tetap dicatat.
theological_decisions:
- issue: Makna κατάρτισις sebagai tujuan pastoral Paulus
  choice: pemulihanmu
  alternative: kedewasaanmu; penyempurnaanmu; dijadikannya kamu lengkap
  rationale: “Pemulihanmu” paling sesuai dengan konteks pembetulan pastoral dan penataan kembali jemaat tanpa menjadikannya istilah teknis tentang kesempurnaan. Karena kata Yunaninya juga dapat berarti memperlengkapi atau membawa kepada kondisi yang lengkap, alternatif-alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang lugas dan bermartabat. Pronomina “kami” dan “kamu” mempertahankan pembedaan Paulus beserta rekan-rekannya dari jemaat Korintus. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkan.
