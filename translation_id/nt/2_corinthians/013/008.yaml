  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: id
  text: Sebab kami tidak dapat berbuat apa pun melawan kebenaran, melainkan demi kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab kami tidak dapat berbuat apa pun untuk menentang kebenaran, tetapi hanya untuk mendukung kebenaran.”'
    reason: Alternatif ini memperjelas daya dukung ὑπέρ dan kemungkinan implikasi kontrasnya, sementara teks utama mempertahankan antitesis Yunani yang lebih padat tanpa menambahkan kata “hanya” ke dalam ayat.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sebab ... tidak
  rationale: γάρ memberikan alasan penjelas bagi pernyataan sebelumnya; “Sebab” merupakan penghubung yang alami dan ringkas dalam bahasa Indonesia, sedangkan οὐ menyangkal klausa tersebut.
- source_word: δυνάμεθά
  choice: kami tidak dapat
  rationale: δύναμαι menyatakan kemampuan atau kesanggupan. “Tidak dapat” mempertahankan penekanan pada ketidakmampuan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: τι
  choice: apa pun
  rationale: Dalam klausa negatif, τι paling wajar diterjemahkan “apa pun” dan menyampaikan cakupan luas pernyataan Paulus.
- source_word: κατὰ τῆς ἀληθείας
  choice: melawan kebenaran
  rationale: κατά dengan genetif di sini menyatakan pertentangan. “Melawan kebenaran” mempertahankan gaya antitesis yang padat dan tidak mempersempit cakupan ἀλήθεια.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: ἀλλά menandai kontras kuat setelah penyangkalan. Dalam pola “tidak ... melainkan ...”, pilihan ini lebih alami dan tepat daripada “tetapi”.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: demi kebenaran
  rationale: ὑπέρ di sini menyatakan keberpihakan atau tindakan untuk kepentingan sesuatu. “Demi kebenaran” ringkas, idiomatis, dan mempertahankan kesejajaran dengan “melawan kebenaran”.
theological_decisions:
- issue: Makna “kebenaran” dalam antitesis Paulus
  choice: Mempertahankan istilah luas “kebenaran” tanpa membatasinya pada suatu rumusan doktrinal tertentu.
  alternative: “kebenaran Injil” atau “apa yang benar”
  rationale: Ungkapan Paulus cukup luas untuk mencakup kebenaran Injil dan kenyataan Allah, tetapi teks ini sendiri tidak mempersempitnya. Terjemahan ini mempertahankan keluasan dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Kami” mempertahankan orang pertama jamak Paulus tanpa menentukan apakah cakupannya retoris atau kolektif. Penanda catatan kaki ditempatkan dalam teks utama.
