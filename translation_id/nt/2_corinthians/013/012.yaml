id: 2CO.13.12
reference: 2 Corinthians 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: id
  text: Salamilah satu sama lain dengan ciuman kudus.[a] Semua orang kudus[b] menyampaikan salam kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ciuman suci”. Ungkapan ini merujuk pada bentuk salam yang dikenal dalam budaya mereka dan ditandai oleh kekudusan serta persekutuan Kristen.
    reason: lexical_alternative
  - marker: b
    text: “Orang kudus” di sini berarti orang-orang percaya, yaitu umat Allah yang kudus; sebutan ini tidak hanya merujuk pada golongan khusus orang Kristen yang kemudian dinyatakan sebagai santo atau santa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salamilah
  rationale: Bentuk imperatif ini menyampaikan ajakan langsung kepada seluruh jemaat. “Salamilah” ringkas, wajar, dan mempertahankan kaitannya dengan tindakan memberi salam.
- source_word: ἀλλήλους
  choice: satu sama lain
  rationale: Kata ganti timbal balik ini menunjukkan tindakan yang dilakukan bersama di antara anggota jemaat.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: dengan ciuman kudus
  rationale: Dalam rumusan salam, ἐν secara idiomatis diterjemahkan “dengan”. “Ciuman” mempertahankan makna konkret φίλημα, sedangkan “kudus” mempertahankan sifat ἁγίῳ tanpa mengaburkan tindakan budaya yang dimaksud.
- source_word: ἀσπάζονται
  choice: menyampaikan salam
  rationale: Dalam penutup surat, frasa ini secara alami menyatakan bahwa pihak lain menitipkan atau menyampaikan salam kepada para penerima.
- source_word: ὑμᾶς
  choice: kepada kalian
  rationale: Kata ganti orang kedua jamak dibuat eksplisit dengan “kalian”, sesuai sapaan kepada jemaat sebagai kelompok.
- source_word: οἱ ἅγιοι πάντες
  choice: Semua orang kudus
  rationale: Ungkapan ini mempertahankan sebutan Paulus bagi orang-orang percaya dan cakupan πάντες, sambil tidak membatasi maknanya pada tokoh yang kemudian dinyatakan kudus secara resmi.
theological_decisions:
- issue: Makna ἅγιοι sebagai sebutan komunal Paulus
  choice: orang kudus
  alternative: umat kudus; orang-orang percaya milik Allah
  rationale: “Orang kudus” mempertahankan hubungan leksikal dengan akar kata “kudus” dan identitas umat yang dikuduskan. Catatan kaki menjelaskan bahwa sebutan ini mencakup orang-orang percaya, bukan hanya golongan elite yang dikanonisasi.
- issue: Sifat ciuman dalam persekutuan jemaat
  choice: ciuman kudus
  alternative: ciuman suci
  rationale: “Kudus” mempertahankan nuansa keterpisahan bagi Allah dan karakter persekutuan Kristen, tanpa mengubah tindakan konkret itu menjadi sekadar salam umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa ὑμᾶς berbentuk jamak. Susunan kalimat kedua dibuat idiomatis bagi penutup surat, sementara pengulangan gagasan memberi salam tetap dipertahankan.
