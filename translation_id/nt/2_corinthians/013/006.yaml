  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: id
  text: Namun, saya berharap kalian akan mengetahui bahwa kami tidak gagal dalam ujian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak didiskualifikasi” atau “bukan orang-orang yang tidak terbukti layak.” Kata sifat Yunani yang dinegasikan di sini menunjuk kepada orang yang, setelah diuji, gagal memperoleh pengakuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: saya berharap
  rationale: Bentuk kini orang pertama tunggal ini secara wajar menyatakan harapan Paulus dan tetap mempertahankan arah pengharapan ke depan.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan dengan kontras ringan terhadap kekhawatiran pada ayat sebelumnya; “Namun” alami dan tidak memperkeras kontras.
- source_word: γνώσεσθε
  choice: kalian akan mengetahui
  rationale: Bentuk mendatang ini menunjuk pada pengetahuan atau kesadaran yang kelak dimiliki jemaat Korintus. “Mengetahui” mempertahankan arti luas verba tanpa menambahkan gagasan proses atau pengakuan.
- source_word: ὅτι
  choice: bahwa
  rationale: Kedua kemunculannya memperkenalkan klausa isi; dalam terjemahan ini satu klausa “bahwa” mencakup struktur isi tersebut secara alami dalam bahasa Indonesia.
- source_word: ἡμεῖς
  choice: kami
  rationale: Pronomina eksplisit Yunani menunjuk kepada Paulus dan rekan-rekannya, bukan kepada para pembaca, sehingga “kami” tepat dalam bahasa Indonesia.
- source_word: οὐκ ἐσμὲν
  choice: bukanlah
  rationale: Negasi kopulatif diterjemahkan secara langsung. Partikel “-lah” memberi penegasan ringan yang wajar tanpa memperkuat negasi melampaui teks.
- source_word: ἀδόκιμοι
  choice: orang-orang yang tidak tahan uji
  rationale: Dalam konteks pemeriksaan dan pengujian, adjektiva ini menggambarkan pihak yang tidak terbukti layak setelah diuji. Ungkapan ini mempertahankan citra pengujian dan menghindari muatan doktrinal atau kesan hukuman formal yang dapat ditimbulkan oleh “ditolak” atau “didiskualifikasi”.
theological_decisions:
- issue: Makna ἀδόκιμοι dalam konteks pengujian dan keabsahan pelayanan rasuli
  choice: bukanlah orang-orang yang tidak tahan uji
  alternative: tidak didiskualifikasi; bukan orang-orang yang tidak terbukti layak; bukan orang-orang yang gagal dalam ujian
  rationale: Konteks langsung berbicara tentang menguji dan membuktikan. Terjemahan ini mempertahankan hubungan leksikal dengan pengujian tanpa menyimpulkan bahwa yang dimaksud adalah status keselamatan, penolakan ilahi yang final, atau diskualifikasi formal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas, sedangkan “kami” membedakan Paulus dan rekan-rekannya dari jemaat Korintus. Citra pengujian dipertahankan agar selaras dengan konteks ayat-ayat sekitar.
