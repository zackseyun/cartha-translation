id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: id
  text: Akhirnya[a], Saudara-saudara[b], bersukacitalah, hendaklah kalian dipulihkan[c], terimalah penguatan[d], hendaklah kalian sepikir[e], hiduplah dalam damai; dan Allah, sumber kasih dan damai, akan menyertai kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sebagai penutup.” Kata Yunani ini mengantar bagian akhir surat.
    reason: lexical_alternative
  - marker: b
    text: Sapaan “Saudara-saudara” ditujukan kepada jemaat secara keseluruhan dan mencakup laki-laki maupun perempuan.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “hendaklah kalian dilengkapi,” “dijadikan utuh,” atau “bereskanlah keadaan kalian.”
    reason: lexical_alternative
  - marker: d
    text: Dapat juga berarti “terimalah penghiburan” atau “terimalah nasihat.”
    reason: lexical_alternative
  - marker: e
    text: Secara harfiah, “pikirkanlah hal yang sama,” yaitu bersatulah dalam pikiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Akhirnya
  rationale: Berfungsi sebagai penanda wacana yang mengantar penutup surat; “Akhirnya” alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan ini mempertahankan bentuk kekerabatan dalam bahasa Yunani dan dalam pemakaian Indonesia dapat menyapa seluruh jemaat, baik laki-laki maupun perempuan.
- source_word: χαίρετε
  choice: bersukacitalah
  rationale: Walaupun dapat dipakai sebagai salam perpisahan, di sini kata tersebut berada dalam rangkaian perintah sehingga makna verbal “bersukacitalah” paling sesuai.
- source_word: καταρτίζεσθε
  choice: hendaklah kalian dipulihkan
  rationale: Bentuk ini mempertahankan nuansa pasif atau medial serta gagasan mengembalikan jemaat kepada keadaan yang semestinya, tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: παρακαλεῖσθε
  choice: hendaklah kalian dikuatkan
  rationale: Terjemahan ini mencerminkan bentuk pasif atau medial dan cakupan makna menerima penguatan, penghiburan, atau nasihat; alternatif penting dicatat dalam catatan kaki.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: hendaklah kalian sepikir
  rationale: “Sepikir” menyampaikan arti harfiah “pikirkanlah hal yang sama” secara ringkas dan wajar, dengan penekanan pada kesatuan pikiran.
- source_word: εἰρηνεύετε
  choice: hiduplah dalam damai
  rationale: Imperatif kini menyerukan perilaku damai yang terus berlangsung dalam kehidupan bersama.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: Allah, sumber kasih dan damai
  rationale: Ungkapan ini menyampaikan hubungan genitif secara alami dalam bahasa Indonesia; “sumber” sesuai dengan ungkapan idiomatis yang menunjuk Allah sebagai asal dan pemberi kasih serta damai.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: akan menyertai kalian
  rationale: Ini merupakan ungkapan Indonesia yang alami untuk janji bahwa Allah “akan bersama kalian,” tanpa nada arkais.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί kepada jemaat
  choice: Saudara-saudara
  alternative: saudara-saudara laki-laki; saudara-saudari
  rationale: Bentuk “Saudara-saudara” mempertahankan metafora kekeluargaan dan secara wajar dapat mencakup seluruh jemaat dalam bahasa Indonesia; cakupan tersebut dijelaskan dalam catatan kaki.
- issue: Arti καταρτίζεσθε dalam konteks pemulihan jemaat
  choice: hendaklah kalian dipulihkan
  alternative: hendaklah kalian disempurnakan; bereskanlah keadaan kalian
  rationale: Pilihan ini menjaga kemungkinan pasif atau medial dan tema pemulihan hubungan serta ketertiban jemaat, tanpa memaksakan gagasan kesempurnaan mutlak.
- issue: Hubungan Allah dengan kasih dan damai dalam konstruksi genitif
  choice: Allah, sumber kasih dan damai
  alternative: Allah yang penuh kasih dan damai
  rationale: “Sumber” adalah pengungkapan idiomatis yang cocok dengan janji penyertaan Allah, tetapi alternatif atributif tetap mungkin secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” dipakai karena semua perintah dan janji ditujukan kepada jemaat secara jamak; pengulangan “hendaklah” menjaga kejelasan bentuk perintah pasif tanpa terasa arkais.
