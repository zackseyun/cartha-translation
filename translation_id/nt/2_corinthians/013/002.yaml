source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: id
  text: 'Aku telah mengatakannya sebelumnya dan sekarang, meskipun tidak hadir, kukatakan lebih dahulu—sebagaimana ketika aku hadir untuk kedua kalinya—kepada mereka yang telah berdosa sebelumnya dan kepada semua yang lain: Jika aku datang lagi[a], aku tidak akan bersikap lunak terhadap mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, berdasarkan konteks, “datang untuk ketiga kalinya.” Teks Yunani secara harfiah menyatakan “datang lagi”; konteks kunjungan Paulus memungkinkan pemahaman bahwa ini adalah kunjungan setelah kunjungan keduanya.
    reason: Menjelaskan pemahaman kronologis kontekstual tanpa menggantikan ungkapan Yunani yang lebih umum dalam teks utama.
lexical_decisions:
- source_word: προείρηκα
  choice: Aku sudah memberi peringatan sebelumnya
  rationale: Bentuk perfektum menunjuk pada perkataan terdahulu yang tetap berlaku. Dalam konteks teguran ini, “memberi peringatan” menyampaikan fungsi ujarannya secara alami tanpa menentukan bentuk disiplin yang dimaksud.
- source_word: προλέγω
  choice: aku kembali memberi peringatan
  rationale: Kata ini berarti mengatakan terlebih dahulu atau memperingatkan sebelumnya. “Kembali memberi peringatan” terdengar alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan peringatan yang sudah diberikan.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: sekarang, ketika tidak hadir ... seperti ketika aku hadir untuk kedua kalinya
  rationale: Ungkapan Yunani yang padat ini membandingkan ketidakhadiran Paulus saat ini dengan kehadirannya pada kunjungan kedua. Susunan ini memperjelas hubungan waktunya tanpa menghapus perbandingan tersebut.
- source_word: τοῖς προημαρτηκόσιν
  choice: kepada mereka yang telah berbuat dosa sebelumnya
  rationale: Partisip perfektum mengacu kepada orang-orang yang dosa terdahulunya sudah menjadi pokok pembicaraan, tanpa menyimpulkan apakah mereka sudah bertobat.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: kepada semua yang lain
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh sekaligus membedakan kelompok ini dari mereka yang telah berbuat dosa sebelumnya.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: Jika aku datang lagi
  rationale: Ini merupakan padanan alami bagi ungkapan Yunani yang secara harfiah menunjuk pada kedatangan kembali. Penafsiran bahwa ini adalah kunjungan ketiga dijelaskan dalam catatan kaki.
- source_word: οὐ φείσομαι
  choice: aku tidak akan bersikap lunak terhadap mereka
  rationale: φείδομαι berarti menyayangkan, membiarkan, atau menahan tindakan keras. Ungkapan ini menyampaikan ancaman ketegasan tanpa menetapkan tindakan disipliner tertentu; objek “mereka” diperjelas dari konteks.
theological_decisions:
- issue: Cakupan ketegasan yang diancamkan Paulus
  choice: Peringatan ditujukan kepada mereka yang telah berbuat dosa sebelumnya dan kepada semua anggota lain yang disebut dalam kalimat.
  alternative: Ancaman hanya ditujukan kepada kelompok yang telah berbuat dosa sebelumnya.
  rationale: Struktur kalimat menyebut kedua kelompok sebagai penerima peringatan. Terjemahan mempertahankan cakupan luas ini tanpa menentukan tata cara disiplin jemaat.
- issue: Bentuk tindakan Paulus ketika datang
  choice: Dibiarkan sebagai ancaman untuk tidak bersikap lunak.
  alternative: Dinyatakan secara khusus sebagai penghukuman atau pengucilan jemaat.
  rationale: Teks tidak merinci tindakan yang akan dilakukan. Karena itu, terjemahan tidak memasukkan bentuk disiplin tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Kata ganti orang pertama memakai bentuk “aku” sesuai gaya surat pribadi, sedangkan tanda pisah membantu pembaca mengikuti susunan kalimat Yunani yang padat.
