  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: id
  text: 'Namun, aku memanggil Allah sebagai saksi atas hidupku sendiri: aku tidak datang lagi ke Korintus karena hendak menyayangkan kalian.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “atas jiwaku sendiri.” Ini adalah ungkapan sumpah yang menyatakan bahwa Paulus mempertaruhkan dirinya atau hidupnya sebagai jaminan atas kebenaran perkataannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Namun, aku
  rationale: Mempertahankan kontras ringan dari δέ dan penekanan pada ἐγώ dalam bahasa Indonesia yang wajar.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: aku memanggil Allah sebagai saksi
  rationale: 'Menyampaikan ungkapan sumpah yang khidmat dan bernuansa hukum: Paulus meminta Allah meneguhkan kebenaran perkataannya.'
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: atas hidupku sendiri
  rationale: ψυχή dalam ungkapan sumpah ini menunjuk pada diri atau hidup Paulus yang dipertaruhkan; pilihan ini lebih jelas daripada terjemahan harfiah 'atas jiwaku'.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua secara alami memperkenalkan isi pernyataan yang diteguhkan oleh seruan Paulus kepada Allah sebagai saksi.
- source_word: φειδόμενος ὑμῶν
  choice: karena ingin menghindarkan kalian dari tindakan keras
  rationale: φείδομαι berarti menahan diri agar tidak memperlakukan seseorang dengan keras; perumusan ini menyatakan maksud Paulus secara alami tanpa menentukan secara berlebihan bentuk tindakan tersebut.
- source_word: οὐκέτι ἦλθον
  choice: aku belum datang lagi
  rationale: Dalam konteks kunjungan kembali yang ditangguhkan, ungkapan ini menyampaikan bahwa Paulus tidak jadi atau belum kembali, sambil menghindari kesan bahwa ia tidak akan pernah datang lagi.
- source_word: εἰς Κόρινθον
  choice: ke Korintus
  rationale: Padanan Indonesia yang lazim untuk gerak menuju sebuah kota.
theological_decisions:
- issue: Sifat seruan 'atas hidupku sendiri'
  choice: Mempertahankan bahasa sumpah tanpa menjelaskan akibat ilahi secara eksplisit.
  alternative: Kiranya Allah menghukum aku jika aku berdusta.
  rationale: Teks menyiratkan bahwa diri atau hidup Paulus menjadi jaminan, tetapi tidak mengucapkan rumus kutuk secara lengkap; ambiguitas itu perlu dipertahankan.
- issue: Cara Paulus 'menyayangkan' jemaat
  choice: menghindarkan kalian dari tindakan keras
  alternative: menyayangkan kalian
  rationale: Alternatif harfiah kurang alami dan dapat kabur dalam bahasa Indonesia. Pilihan utama mempertahankan gagasan bahwa Paulus menahan tindakan keras, tanpa menentukan apakah itu teguran, disiplin, atau penghukuman.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kata ganti 'aku/kalian' dipakai agar selaras dengan sapaan surat yang langsung; 'Allah' dipertahankan sebagai sebutan ilahi. Tanda titik dua menghindari konstruksi 'bahwa ... karena' yang terasa kaku.
