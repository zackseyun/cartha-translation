  verdict: revise
  source_fidelity: Draf tepat pada seruan Paulus kepada Allah sebagai saksi dan pada tujuan umum ia tidak kembali ke Korintus. Namun, “menghindarkan kalian dari tindakan keras” memasukkan objek dan jenis tindakan yang tidak dinyatakan oleh φειδόμενος ὑμῶν. Partisip itu berarti ‘menyayangkan/mengampuni/menghemat terhadap kalian’ dalam arti Paulus menahan diri demi mereka; konteks dapat menyiratkan ketegasan, tetapi teks ayat ini tidak menyebutkannya. Selain itu, οὐκέτι lebih tepat dinyatakan dengan “tidak datang lagi” daripada “belum datang lagi,” karena yang terakhir menambahkan nuansa ‘belum’ yang tidak ada secara leksikal.
  naturalness: Revisi memakai bahasa Indonesia modern dan khidmat. “Karena hendak menyayangkan kalian” mempertahankan maksud φειδόμενος tanpa menambahkan tindakan tertentu. Penggunaan “aku/kalian” dan “Allah” konsisten dengan register draf.
  terminology: “Allah sebagai saksi” secara tepat menyampaikan μάρτυρα τὸν θεὸν ἐπικαλοῦμαι. “Atas hidupku sendiri” mempertahankan metafora sumpah ἐπὶ τὴν ἐμὴν ψυχήν secara cukup alami; catatan kaki menyediakan bentuk lebih harfiah dan menjelaskan fungsi sumpahnya tanpa menetapkan rumus kutuk yang tidak diucapkan teks.
  issues:
  - severity: medium
    issue: Frasa “menghindarkan kalian dari tindakan keras” terlalu eksplisit.
    rationale: φειδόμενος ὑμῶν menyatakan bahwa Paulus menyayangkan atau mengampuni mereka, tetapi tidak menyebut ‘tindakan keras’ dalam ayat ini. Tambahan tersebut berasal dari konteks yang mungkin, bukan dari bentuk leksikal ayat.
  - severity: low
    issue: “Belum datang lagi” menambahkan nuansa temporal ‘belum’.
    rationale: οὐκέτι secara langsung berarti ‘tidak lagi/tidak ... lagi’; bentuk “belum” dapat menyiratkan kedatangan yang masih diharapkan secara lebih eksplisit daripada teks Yunani.
  revised_text: 'Namun, aku memanggil Allah sebagai saksi atas hidupku sendiri: aku tidak datang lagi ke Korintus karena hendak menyayangkan kalian.[a]'
