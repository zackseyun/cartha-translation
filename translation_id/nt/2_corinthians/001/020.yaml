revisions:
- from: Sebab, sebanyak apa pun janji Allah, di dalam Dia ada “Ya”[a]. Karena itu, melalui Dia pula, “Amin”[b] itu kami sampaikan kepada Allah demi kemuliaan-Nya.[c]
  to: Sebab, sebanyak apa pun janji Allah, di dalam Dia ada “Ya”[a]. Karena itu, melalui Dia pula ada “Amin”[b] kepada Allah, untuk kemuliaan, melalui kami.[c]
  rationale: Revisi diperlukan untuk menghapus verba “kami sampaikan” yang tidak ada dalam sumber dan untuk tidak menjadikan “kemuliaan” secara eksplisit sebagai milik Allah melalui akhiran -Nya. Terjemahan revisi mengikuti urutan dan elipsis Yunani sedekat mungkin sambil tetap dapat dibaca dalam bahasa Indonesia. Catatan c memberi bantuan pembaca tanpa memaksakan satu analisis sintaktis atau teologis.
  reviewer_model: gpt-5.6-terra
