  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: id
  text: Sebab, sebanyak apa pun janji Allah, di dalam Dia ada “Ya”[a]. Karena itu, melalui Dia pula ada “Amin”[b] kepada Allah, untuk kemuliaan, melalui kami.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan lebih jelas, “di dalam Dia semua janji Allah memiliki ‘Ya’.”
    reason: alternative_reading
  - marker: b
    text: “Amin” adalah kata penegasan yang berarti kira-kira “sungguh benar” atau “jadilah demikian.”
    reason: cultural_note
  - marker: c
    text: 'Atau, dengan hubungan frasa yang dijelaskan: “melalui Dia pula ada ‘Amin’ kepada Allah untuk kemuliaan melalui kami.” Susunan frasa Yunani memungkinkan lebih dari satu cara untuk menghubungkan “kepada Allah,” “untuk kemuliaan,” dan “melalui kami.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: sebanyak apa pun
  rationale: Mengungkapkan keseluruhan yang tidak dibatasi jumlahnya dan mencakup semua janji Allah, tanpa menjadi kaku.
- source_word: ἐπαγγελίαι θεοῦ
  choice: janji Allah
  rationale: Ungkapan genitif ini secara alami menunjuk kepada janji-janji yang berasal dari dan dimiliki Allah; bentuk tunggal kolektif dalam bahasa Indonesia tetap mencakup seluruh janji-Nya.
- source_word: ἐν αὐτῷ
  choice: di dalam Dia
  rationale: Mempertahankan rumusan Paulus yang padat dan berpusat pada Kristus tanpa langsung menggantinya dengan penjelasan seperti 'digenapi oleh Dia'.
- source_word: τὸ Ναί
  choice: “Ya”
  rationale: Mempertahankan kata penegasan dan daya retorisnya. Tanda petik menunjukkan bahwa 'Ya' dipakai sebagai ungkapan substantif.
- source_word: δι’ αὐτοῦ
  choice: melalui Dia
  rationale: Mencerminkan διά dengan genitif dan menonjolkan perantaraan Kristus.
- source_word: τὸ Ἀμὴν
  choice: “Amin” itu
  rationale: Mempertahankan istilah yang sudah lazim dalam bahasa Indonesia sekaligus mencerminkan artikel Yunani dan kesejajarannya dengan 'Ya'.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Menyatakan bahwa 'Amin' diarahkan kepada Allah.
- source_word: πρὸς δόξαν
  choice: demi kemuliaan-Nya
  rationale: Mengungkapkan arah atau tujuan frasa tersebut dengan bahasa Indonesia yang wajar; akhiran '-Nya' merujuk kepada Allah dalam konteks langsung.
- source_word: δι’ ἡμῶν
  choice: kami sampaikan
  rationale: Mengungkapkan secara alami bahwa 'Amin' itu datang melalui Paulus dan rekan-rekan pelayanannya, tanpa menambahkan kata 'pelayanan' yang tidak tersurat.
theological_decisions:
- issue: Apakah pernyataan eliptis Paulus perlu dijelaskan sebagai penggenapan semua janji di dalam Kristus
  choice: Mempertahankan rumusan padat 'di dalam Dia ada “Ya”'.
  alternative: Di dalam Dia semua janji Allah digenapi atau mendapat jawaban 'Ya'.
  rationale: Penggenapan dalam Kristus sangat tersirat, tetapi teks Yunani memakai rumusan retoris yang lebih padat. Terjemahan utama tidak memasukkan penjelasan teologis yang tidak tersurat.
- issue: Hubungan 'Amin', Allah, kemuliaan, dan 'melalui kami'
  choice: Menyatakan bahwa 'Amin' disampaikan melalui kami kepada Allah demi kemuliaan-Nya.
  alternative: Melalui Dia ada 'Amin' kepada Allah, untuk kemuliaan melalui kami.
  rationale: Susunan Indonesia diperlancar agar dapat dipahami, sedangkan catatan kaki mempertahankan bentuk Yunani yang lebih padat dan kemungkinan hubungan sintaksisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi kata ganti 'Dia' dan '-Nya' dipakai bagi Kristus dan Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Rumusan klausa pertama sengaja tetap padat untuk mempertahankan gaya retoris Yunani, sementara klausa kedua dibuat lebih idiomatis.
