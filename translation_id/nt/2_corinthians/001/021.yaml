  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: id
  text: Namun, Allah-lah yang meneguhkan kami bersama kamu di dalam Mesias[a] dan yang telah mengurapi kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam Kristus.” Secara harfiah, frasa Yunani itu dapat bernuansa “ke dalam Mesias.”
    reason: Memberikan padanan tradisional bagi Χριστός dan mencatat nuansa harfiah εἰς tanpa menyarankan ‘kepada Mesias,’ yang tidak cocok dalam konteks ini.
lexical_decisions:
- source_word: βεβαιῶν
  choice: meneguhkan
  rationale: Menyampaikan arti membuat teguh atau kukuh; bentuk partisipel kini menunjukkan tindakan Allah yang berlangsung.
- source_word: σὺν ὑμῖν
  choice: bersama kamu
  rationale: Menjaga penekanan bahwa Paulus dan jemaat Korintus sama-sama mengambil bagian dalam karya Allah ini.
- source_word: εἰς Χριστόν
  choice: di dalam Mesias
  rationale: Dalam konteks Paulus, εἰς dapat menyatakan hubungan atau persatuan dengan Mesias; ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan nuansa inkorporatifnya.
- source_word: χρίσας
  choice: telah mengurapi
  rationale: Mempertahankan hubungan leksikal dengan tindakan pengurapan serta gema mesianiknya; aspek aoristus dibedakan secara wajar dari partisipel kini βεβαιῶν.
- source_word: θεός
  choice: Allah-lah
  rationale: Partikel -lah menandai penekanan pada Allah sebagai pelaku, sejalan dengan posisi θεός yang menonjol pada akhir klausa Yunani.
- source_word: Χριστόν
  choice: Mesias
  rationale: Menerjemahkan gelar Χριστός menurut makna titularnya, bukan sekadar mentransliterasikannya sebagai Kristus.
theological_decisions:
- issue: Daya εἰς dalam εἰς Χριστόν
  choice: di dalam Mesias
  alternative: kepada Mesias; ke dalam Mesias
  rationale: Frasa ini kemungkinan menyatakan hubungan atau persatuan dengan Mesias. Pilihan 'di dalam' menghasilkan bahasa Indonesia yang wajar, sedangkan catatan kaki mempertahankan kemungkinan arah yang terkandung dalam εἰς.
- issue: Penerjemahan gelar Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: ‘Mesias’ mempertahankan arti gelar Yang Diurapi dan kaitannya dengan χρίσας dalam ayat yang sama; bentuk tradisional dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan ‘Allah-lah’ sebagai penanda fokus, sambil mempertahankan kebersamaan ‘kami bersama kamu’ dan perbedaan aspek antara tindakan meneguhkan yang berlangsung dan pengurapan yang telah dilakukan.
