base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: id
  text: 'Allah setia: perkataan kami kepada kalian bukanlah “Ya dan Tidak.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Allah dapat dipercaya: perkataan kami kepada kalian bukanlah ‘Ya dan Tidak.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: setia
  rationale: Dalam konteks ini kata tersebut menyatakan bahwa Allah dapat diandalkan; “setia” merupakan padanan yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak dinyatakan tersendiri
  rationale: Partikel ini menghubungkan pernyataan dengan konteks sebelumnya. Dalam susunan penegasan “Allah setia,” daya penghubungnya dapat tersirat secara alami tanpa harus diterjemahkan secara mekanis sebagai “tetapi.”
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku untuk θεός ketika menunjuk kepada Allah dalam konteks Perjanjian Baru.
- source_word: ὅτι
  choice: ':'
  rationale: Tanda titik dua menyampaikan bahwa klausa berikut merupakan isi pernyataan yang ditegaskan berdasarkan kesetiaan Allah, sekaligus menghindari konstruksi Indonesia yang kaku seperti “Allah setia bahwa.”
- source_word: λόγος
  choice: perkataan
  rationale: Kata ini di sini menunjuk pada apa yang Paulus dan rekan-rekannya katakan kepada jemaat. “Perkataan” mempertahankan hubungan leksikal dengan λόγος tanpa membatasinya secara pasti pada khotbah atau kabar tertentu.
- source_word: ἡμῶν
  choice: kami
  rationale: Genitif posesif yang mengacu kepada Paulus dan rekan-rekan pelayanannya.
- source_word: ὁ πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Frasa atributif ini menunjukkan bahwa perkataan tersebut ditujukan kepada para penerima surat yang jamak; “kalian” membuat kemajemukan itu jelas dalam bahasa Indonesia modern.
- source_word: οὐκ ἔστιν
  choice: bukanlah
  rationale: Mencerminkan bentuk kini dan menyangkal sifat perkataan mereka secara tegas.
- source_word: Ναὶ καὶ Οὔ
  choice: “Ya dan Tidak”
  rationale: Pasangan istilah dipertahankan secara langsung untuk menjaga kontras tajam Paulus mengenai ketidaktetapan atau pertentangan.
theological_decisions:
- issue: Hubungan πιστὸς δὲ ὁ θεὸς dengan klausa yang diawali ὅτι
  choice: “Allah setia:” sebagai dasar penegasan bagi klausa berikut
  alternative: “Tetapi Allah setia, bahwa ...” atau “Demi kesetiaan Allah ...”
  rationale: Susunan ini menjaga kesetiaan Allah sebagai landasan khidmat bagi kebenaran pernyataan Paulus, tanpa mengubahnya menjadi sumpah eksplisit atau memakai sintaksis Indonesia yang tidak wajar.
- issue: Cakupan λόγος dalam pembelaan Paulus
  choice: “perkataan kami”
  alternative: “pesan kami” atau “pemberitaan kami”
  rationale: “Perkataan” mempertahankan keluasan istilah Yunani dan tidak secara diam-diam membatasi rujukannya hanya pada pemberitaan Injil atau pada satu pesan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menandai penerima jamak secara jelas; tanda titik dua menyajikan konstruksi penegasan Yunani secara alami sambil mempertahankan hubungan logisnya.
