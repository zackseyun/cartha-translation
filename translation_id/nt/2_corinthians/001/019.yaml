reference: 2 Corinthians 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: id
  text: Sebab Anak Allah, Yesus Kristus, yang diberitakan di antara kamu melalui kami—melalui aku, Silwanus, dan Timotius—tidak menjadi “Ya” dan “Tidak”; sebaliknya, di dalam Dia yang ada hanyalah “Ya”.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melainkan di dalam Dia telah menjadi ‘Ya’.”'
    reason: Memberikan terjemahan yang lebih dekat pada susunan harfiah Yunani dari bentuk perfektif γέγονεν, sementara teks utama mengungkapkan keadaan hasilnya secara idiomatis dalam bahasa Indonesia.
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: Anak Allah
  rationale: Mempertahankan ungkapan kristologis yang baku dan wajar dalam bahasa Indonesia.
- source_word: Ἰησοῦς Χριστός
  choice: Yesus Kristus
  rationale: Dalam konstruksi ini, Χριστός menyatu sebagai sebutan diri yang bersifat seperti nama; bentuk Indonesia yang lazim dan bermartabat ialah “Yesus Kristus”.
- source_word: κηρυχθείς
  choice: yang telah diberitakan
  rationale: Bentuk pasif ini mempertahankan makna pewartaan publik dari κηρύσσω dan sesuai dengan konteks pemberitaan Injil.
- source_word: δι’ ἡμῶν
  choice: melalui kami
  rationale: Menjaga nuansa perantaraan atau sarana dari διά serta pola pengulangannya pada frasa berikut.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: melalui aku, Silwanus, dan Timotius
  rationale: Mempertahankan pengulangan διά dan menyebut ketiga pemberita secara transparan.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: tidak menjadi “Ya” sekaligus “Tidak”
  rationale: “Menjadi” mencerminkan ἐγένετο, sedangkan “sekaligus” membuat koordinasi yang bersifat kontras dapat dipahami tanpa menggantinya dengan tafsiran seperti tidak konsisten.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: sebaliknya, di dalam Dia telah menjadi “Ya”
  rationale: Mempertahankan ungkapan retoris Paulus dan nuansa perfektif γέγονεν tanpa menjelaskan secara berlebihan apa yang menjadi “Ya”.
theological_decisions:
- issue: Fungsi Χριστός sebagai gelar atau bagian dari sebutan yang menyerupai nama
  choice: Yesus Kristus
  alternative: Yesus Mesias
  rationale: Dalam aposisi kepada “Anak Allah”, gabungan Ἰησοῦς Χριστός berfungsi secara mapan dan menyerupai nama. “Yesus Kristus” merupakan bentuk Indonesia yang paling alami tanpa menghilangkan bobot gelarnya.
- issue: Apakah Ναί dan Οὔ harus ditafsirkan sebagai ketidaktetapan dan keandalan
  choice: Mempertahankan “Ya” dan “Tidak”
  alternative: tidak plin-plan, melainkan dapat diandalkan
  rationale: Bahasa retoris Paulus sengaja dibiarkan transparan agar ketegangan teologis mengenai kesetiaan Allah di dalam Kristus tidak diselesaikan melalui parafrasa.
- issue: Subjek tersirat dalam γέγονεν
  choice: telah menjadi “Ya”
  alternative: jawabannya adalah “Ya”
  rationale: Teks Yunani tidak menyatakan nomina seperti “jawaban” atau “janji”; terjemahan utama mempertahankan ketakterungkapan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda petik pada “Ya” dan “Tidak” menandai bahwa kata-kata tersebut dipakai sebagai ungkapan retoris. Nama Σιλουανός ditulis “Silwanus”, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
