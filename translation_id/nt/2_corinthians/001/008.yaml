id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: id
  text: Sebab, Saudara-saudara, kami ingin agar kalian mengetahui tentang kesusahan yang kami alami di Asia[a]. Kami dibebani sedemikian berat, melampaui kekuatan kami, sehingga kami bahkan putus asa untuk tetap hidup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” di sini adalah provinsi Romawi di bagian barat Asia Kecil, bukan benua Asia modern.
    reason: cultural_note
  - marker: b
    text: Atau, “sehingga kami bahkan putus asa mengenai hidup kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: Sebab ... kami tidak ingin kalian tidak mengetahui
  rationale: Mempertahankan pernyataan kehendak serta bentuk negatif ganda teks Yunani, tetapi tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan baku ini mempertahankan bentuk sapaan kekeluargaan jamak dan dalam pemakaian bahasa Indonesia dapat mencakup seluruh jemaat.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης
  choice: tentang kesusahan yang kami alami
  rationale: Kesusahan menyampaikan tekanan dan penderitaan θλῖψις; 'yang kami alami' merupakan ungkapan Indonesia yang wajar untuk peristiwa yang menimpa Paulus dan rekan-rekannya.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: di Asia
  rationale: Mempertahankan nama geografis sumber; cakupan historisnya dijelaskan dalam catatan kaki.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: Beban yang menindih kami begitu luar biasa dan melampaui kekuatan kami
  rationale: Menyampaikan metafora beban pada ἐβαρήθημεν, intensifikasi καθ’ ὑπερβολὴν, dan batas kemampuan pada ὑπὲρ δύναμιν secara alami.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: sehingga kami bahkan putus asa untuk tetap hidup
  rationale: Menunjukkan akibat dan mempertahankan daya eksistensial ungkapan tersebut; 'tetap hidup' menjelaskan bahwa keputusasaan itu menyangkut kelanjutan hidup.
theological_decisions:
- issue: Cakupan sapaan ἀδελφοί
  choice: Saudara-saudara
  alternative: Saudara-saudari
  rationale: Bahasa Indonesia lazim memakai 'Saudara-saudara' sebagai sapaan kolektif, sehingga bentuk sumber tidak perlu diperluas secara eksplisit; ungkapan ini tidak dimaksudkan untuk mengecualikan perempuan.
- issue: Arti keputusasaan mengenai hidup
  choice: putus asa untuk tetap hidup
  alternative: putus asa bahkan mengenai hidup kami
  rationale: Pilihan ini mempertahankan kemungkinan bahwa Paulus tidak berharap dapat terus hidup, tanpa menambahkan kesimpulan teologis tentang bunuh diri atau kematian yang pasti.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti jamak 'kalian' membedakan penerima surat dari 'kami' dan sesuai dengan sapaan kepada komunitas, sedangkan susunan kalimat dibagi dua agar tekanan retorisnya mudah dipahami.
