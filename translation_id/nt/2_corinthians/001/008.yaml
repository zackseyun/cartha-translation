  to: Sebab, Saudara-saudara, kami ingin agar kalian mengetahui tentang kesusahan yang kami alami di Asia[a]. Kami dibebani sedemikian berat, melampaui kekuatan kami, sehingga kami bahkan putus asa untuk tetap hidup[b].
