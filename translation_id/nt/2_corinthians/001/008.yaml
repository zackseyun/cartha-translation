  naturalness: Sapaan di tengah kalimat dan "kami tidak ingin kalian tidak mengetahui" terasa kaku. Kalimat yang direvisi mempertahankan hubungan sebab dan isi pemberitahuan Paulus dalam register modern yang bermartabat.
  terminology: '"Saudara-saudara," "kesusahan," "Asia," "dibebani," dan "putus asa" sesuai dengan istilah serta register surat ini. Catatan Asia dipertahankan; catatan kedua dirumuskan sebagai alternatif, bukan sebagai klaim harfiah yang terlalu sempit.'
