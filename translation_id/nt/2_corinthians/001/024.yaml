id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: id
  text: Bukan berarti kami berkuasa atas imanmu[a], melainkan kami adalah rekan sekerja untuk sukacitamu[b], sebab oleh iman kamu berdiri teguh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “rekan kerja bagi sukacitamu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kamu berdiri teguh dalam iman.”
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: berkuasa atas
  rationale: Kata kerja ini menyatakan pelaksanaan kekuasaan atau penguasaan. Dalam konstruksi negatif, “berkuasa atas” terdengar alami dan tetap mempertahankan penolakan Paulus terhadap sikap menguasai iman jemaat.
- source_word: ὑμῶν τῆς πίστεως
  choice: imanmu
  rationale: Konstruksi genitif ini secara idiomatis menunjuk pada iman yang dimiliki jemaat. Bentuk tunggal “-mu” menyapa jemaat sebagai satu komunitas, sesuai pemakaian bahasa Indonesia dalam surat.
- source_word: συνεργοί
  choice: rekan sekerja
  rationale: Istilah ini menekankan kerja bersama, bukan wewenang atas jemaat. “Rekan sekerja” jelas, bermartabat, dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: untuk sukacitamu
  rationale: 'Walaupun bentuk Yunaninya genitif, hubungan maknanya paling wajar dipahami sebagai tujuan atau manfaat: pelayanan mereka diarahkan kepada sukacita jemaat.'
- source_word: τῇ γὰρ πίστει
  choice: sebab oleh iman
  rationale: Dativus ini dapat menyatakan sarana atau dasar. “Oleh iman” mempertahankan kemungkinan itu tanpa mengubahnya menjadi sekadar lokasi rohani.
- source_word: ἑστήκατε
  choice: berdiri teguh
  rationale: Bentuk perfek menyatakan keadaan berdiri yang telah terbentuk dan masih berlangsung. “Berdiri teguh” mengungkapkan daya hasil dan ketetapan tersebut secara alami.
theological_decisions:
- issue: Makna πίστις pada kedua kemunculannya
  choice: iman
  alternative: kepercayaan; pada frasa terakhir, dalam iman
  rationale: Konteks berbicara tentang sikap percaya jemaat. “Iman” mempertahankan istilah teologis yang luas tanpa memaksakan arti kesetiaan; alternatif “kepercayaan” dan pembacaan lokatif “dalam iman” dicatat dalam catatan kaki.
- issue: Hubungan para rasul dengan sukacita jemaat
  choice: rekan sekerja untuk sukacitamu
  alternative: rekan sekerja bagi sukacitamu; orang-orang yang bekerja bersamamu demi sukacitamu
  rationale: Genitif τῆς χαρᾶς dapat menyatakan bidang, tujuan, atau kepentingan. Terjemahan utama menyampaikan bahwa pekerjaan mereka mendukung sukacita jemaat, tanpa menyiratkan bahwa sukacita itu sendiri adalah rekan kerja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat apostolik yang bermartabat. Sapaan orang kedua jamak Yunani diterjemahkan dengan bentuk kolektif tunggal “-mu/kamu,” yang alami ketika menyapa satu jemaat. Susunan kalimat mempertahankan kontras antara tidak menguasai iman dan bekerja bagi sukacita.
