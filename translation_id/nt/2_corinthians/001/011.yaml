  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: id
  text: Kamu pun turut menolong kami dengan doa, supaya melalui banyak orang ucapan syukur dapat dipanjatkan oleh banyak orang[b] untuk kami atas karunia[a] yang diberikan kepada kami.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Karunia” juga dapat diterjemahkan “pemberian anugerah,” “berkat,” atau “kemurahan yang ditunjukkan kepada kami.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari banyak wajah,” suatu ungkapan yang berarti “dari banyak orang.”
    reason: lexical_alternative
  - marker: c
    text: Frasa Yunani “melalui banyak orang” sulit ditafsirkan. Frasa ini mungkin berkaitan dengan keterlibatan banyak orang, khususnya melalui doa mereka. Susunan kalimatnya juga dapat dipahami, “supaya melalui banyak orang, banyak orang mengucap syukur untuk kami atas karunia yang diberikan kepada kami.”
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων
  choice: turut menolong
  rationale: Bentuk partisip ini menyatakan bantuan bersama; “turut menolong” mempertahankan daya unsur συν- dan terdengar alami dalam bahasa Indonesia.
- source_word: τῇ δεήσει
  choice: melalui permohonan doamu
  rationale: δέησις menunjuk pada permohonan yang sungguh-sungguh. Bentuk tunggal kolektif diterjemahkan secara alami sebagai “permohonan doamu,” dan datifnya dipahami secara instrumental.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil; “supaya” mempertahankan hubungan antarklausa dengan jelas.
- source_word: ἐκ πολλῶν προσώπων
  choice: dari banyak orang
  rationale: πρόσωπον secara harfiah berarti “wajah,” tetapi di sini merujuk secara idiomatis kepada orang. Preposisi ἐκ tetap dipertahankan sebagai “dari.”
- source_word: χάρισμα
  choice: karunia
  rationale: “Karunia” menyampaikan gagasan pemberian yang berasal dari kemurahan, tanpa menentukan secara berlebihan bentuk pertolongan Allah yang dimaksud.
- source_word: διὰ πολλῶν
  choice: melalui banyak orang
  rationale: Terjemahan ini mempertahankan frasa Yunani yang sulit beserta pengulangan πολλῶν. Hubungan tepat frasa tersebut dengan doa, karunia, atau ucapan syukur tetap terbuka dan dijelaskan dalam catatan kaki.
- source_word: εὐχαριστηθῇ
  choice: terucap syukur
  rationale: Bentuk pasif Yunani diungkapkan secara idiomatis tanpa mengubah tindakan itu menjadi sekadar perasaan berterima kasih.
- source_word: ὑπὲρ ἡμῶν
  choice: atas nama kami
  rationale: Ungkapan ini sesuai dengan konteks orang lain yang mengucap syukur sehubungan dengan pertolongan yang diterima Paulus dan rekan-rekannya.
theological_decisions:
- issue: Perantaraan banyak orang dalam karunia yang diterima Paulus
  choice: Mempertahankan “melalui banyak orang” dalam teks utama
  alternative: Menafsirkan frasa itu secara khusus sebagai “melalui doa banyak orang” atau menghilangkannya demi kelancaran
  rationale: Bahasa Yunani tidak secara eksplisit mengulang kata “doa” dan susunan frasanya sulit. Terjemahan utama mempertahankan ketegangan itu tanpa menetapkan satu mekanisme teologis secara pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan “banyak orang” sengaja dipertahankan karena terdapat dua kali dalam bahasa Yunani, meskipun hasilnya agak tidak biasa; catatan kaki menjelaskan ambiguitas sintaksisnya.
