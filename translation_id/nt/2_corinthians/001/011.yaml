revisions:
- from: Kamu pun turut menolong kami melalui permohonan doamu, supaya dari banyak orang[b] terucap syukur atas nama kami karena karunia[a] yang diberikan kepada kami melalui banyak orang.[c]
  to: Kamu pun turut menolong kami dengan doa, supaya melalui banyak orang ucapan syukur dapat dipanjatkan oleh banyak orang[b] untuk kami atas karunia[a] yang diberikan kepada kami.[c]
  rationale: Revisi mengganti padanan ὑπὲρ ἡμῶν yang secara idiomatis keliru, memperhalus padanan instrumental τῇ δεήσει, dan memindahkan “melalui banyak orang” agar teks utama tidak secara berlebihan menentukan hubungan sintaktis διὰ πολλῶν. Kedua rujukan kepada “banyak orang” tetap dipertahankan, sedangkan catatan kaki terus menandai ambiguitas yang nyata dalam bahasa Yunani.
