  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: id
  text: sebagaimana kamu juga telah memahami kami sampai batas tertentu,[a] yakni bahwa kami adalah kebanggaanmu, sama seperti kamu juga adalah kebanggaan kami,[b] pada hari Tuhan kita Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara sebagian” atau “hingga taraf tertentu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “alasan untuk bermegah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: telah mengenal
  rationale: Dalam konteks hubungan Paulus dengan jemaat Korintus, kata ini menyatakan pengenalan atau pengakuan yang sungguh-sungguh tanpa harus menyiratkan pemahaman yang sempurna.
- source_word: ἀπὸ μέρους
  choice: sampai batas tertentu
  rationale: Ungkapan ini menunjukkan bahwa pengenalan mereka belum utuh; pilihan ini alami dalam bahasa Indonesia dan tetap membiarkan tingkat keterbatasannya terbuka.
- source_word: καύχημα
  choice: kebanggaan
  rationale: Kata ini menunjuk pada sesuatu atau seseorang yang menjadi dasar untuk bermegah. 'Kebanggaan' mempertahankan sifat timbal balik ungkapan Paulus tanpa memberi kesan kesombongan semata.
- source_word: καθάπερ
  choice: sama seperti
  rationale: Pilihan ini mempertahankan perbandingan timbal balik yang tegas antara Paulus dan jemaat Korintus.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: pada hari Tuhan kita Yesus
  rationale: Terjemahan ini mempertahankan ungkapan eskatologis dan hubungan genitif dalam bentuk yang baku serta mudah dipahami.
- source_word: κύριος
  choice: Tuhan
  rationale: Ini merupakan padanan baku bagi gelar kristologis κύριος dalam konteks ini.
- source_word: καθὼς καὶ
  choice: sebagaimana ... juga
  rationale: Bentuk ini menghubungkan ayat dengan pernyataan sebelumnya sekaligus mempertahankan daya aditif καί.
theological_decisions:
- issue: Bahasa καύχημα yang timbal balik
  choice: kami adalah kebanggaanmu, sama seperti kamu juga adalah kebanggaan kami
  alternative: kami adalah alasanmu untuk bermegah, sama seperti kamu juga adalah alasan kami untuk bermegah
  rationale: Pilihan ini mempertahankan gambaran Paulus tentang kebanggaan atau kemegahan timbal balik pada hari Tuhan tanpa mengubahnya menjadi klaim tentang kesombongan pribadi maupun melunakkan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur perbandingan Yunani, sementara 'sampai batas tertentu' memperjelas keterbatasan pengenalan secara alami. Semua penanda catatan kaki ditempatkan langsung dalam teks.
