  source_fidelity: 'Teks Indonesia secara tepat mencerminkan struktur dan isi Yunani: formula doksologis Εὐλογητὸς diterjemahkan “Terpujilah”; satu Allah disebut sekaligus Allah dan Bapa Tuhan kita Yesus Sang Mesias; serta δύο sebutan lanjutan “Bapa segala belas kasihan” dan “Allah segala penghiburan” dipertahankan. “Segala” cukup menyampaikan cakupan πάσης, sementara konstruksi “Bapa segala belas kasihan” mempertahankan metafora dan kelimpahan jamak οἰκτιρμῶν tanpa parafrasa berlebihan.'
