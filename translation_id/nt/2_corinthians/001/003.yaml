  terminology: “Allah,” “Bapa,” dan “Tuhan” merupakan padanan Indonesia yang mapan dan tepat bagi θεός, πατήρ, dan κύριος. “Sang Mesias” dengan baik mempertahankan Χριστός sebagai gelar, dan catatan kaki secara transparan memberi bentuk tradisional “Yesus Kristus.” “Penghiburan” tepat untuk παράκλησις dalam konteks yang segera berbicara tentang penderitaan, dengan alternatif semantis dicatat.
