id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: id
  text: Terpujilah Allah dan Bapa Tuhan kita, Yesus Sang Mesias[a], Bapa segala belas kasihan dan Allah segala penghiburan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus Kristus.”
    reason: Bentuk tradisional 'Kristus' juga dapat mewakili Χριστός, meskipun kata itu pada dasarnya berarti 'Mesias' atau 'Yang Diurapi'.
  - marker: b
    text: Kata yang diterjemahkan “penghiburan” juga dapat berarti “penguatan” atau “dorongan semangat.”
    reason: παράκλησις memiliki rentang makna yang mencakup penghiburan, penguatan, dan dorongan dalam kesusahan.
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Terpujilah
  rationale: Bentuk ini wajar dalam formula doksologi bahasa Indonesia dan menyampaikan seruan pengagungan yang terkandung dalam adjektiva predikatif Yunani.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Allah dan Bapa
  rationale: Satu kata sandang Yunani menaungi kedua nomina dan menunjukkan satu Pribadi yang disebut sekaligus Allah dan Bapa.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam penyebutan Yesus pada konteks Perjanjian Baru, κύριος paling tepat dan lazim diterjemahkan sebagai gelar 'Tuhan'.
- source_word: Χριστοῦ
  choice: Sang Mesias
  rationale: Χριστός masih menyatakan gelar, yaitu Yang Diurapi; 'Sang Mesias' mempertahankan makna gelar itu dalam ungkapan Indonesia yang alami.
- source_word: οἰκτιρμῶν
  choice: segala belas kasihan
  rationale: Pilihan ini mempertahankan konstruksi 'Bapa ...' dan nuansa jamak yang mengisyaratkan kelimpahan belas kasihan, tanpa menghasilkan bentuk jamak Indonesia yang kaku.
- source_word: πάσης παρακλήσεως
  choice: segala penghiburan
  rationale: '''Penghiburan'' paling sesuai dengan konteks penderitaan yang menyusul, sedangkan ''segala'' mencerminkan πάσης; rentang maknanya yang juga mencakup penguatan dicatat dalam catatan kaki.'
theological_decisions:
- issue: Fungsi Χριστός dalam Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  alternative: Yesus Kristus
  rationale: Terjemahan utama menampilkan arti gelar Χριστός dan tidak memperlakukannya sekadar sebagai bagian nama; bentuk tradisional dicatat sebagai alternatif.
- issue: Hubungan θεὸς καὶ πατὴρ dengan τοῦ κυρίου ἡμῶν
  choice: Allah dan Bapa Tuhan kita
  alternative: Allah, yaitu Bapa Tuhan kita
  rationale: Konstruksi Yunani menyebut satu Pribadi sebagai 'Allah dan Bapa' dalam relasi dengan Tuhan kita. Terjemahan mempertahankan pasangan sebutan itu tanpa menambahkan penjelasan identifikatif yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doksologis. Koma setelah 'kita' membantu pembaca mengenali 'Yesus Sang Mesias' sebagai aposisi bagi 'Tuhan kita'. Ungkapan 'Bapa segala belas kasihan' sengaja mempertahankan citra dan ketegangan idiom Yunani, alih-alih mengubahnya menjadi parafrasa seperti 'Bapa yang penuh belas kasihan'.
