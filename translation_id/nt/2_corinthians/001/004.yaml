id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: id
  text: yang menghibur kami dalam segala penderitaan kami[a], supaya kami sanggup menghibur mereka yang mengalami penderitaan apa pun dengan penghiburan yang kami sendiri terima dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menguatkan ... penguatan”; bahasa Yunani memakai keluarga kata yang sama berulang kali di sepanjang ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν
  choice: yang menghibur
  rationale: Dalam konteks θλῖψις, verba ini menunjuk pada penghiburan yang menguatkan di tengah penderitaan; bentuk partisipnya dipertahankan secara alami sebagai klausa relatif.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: dalam segala penderitaan kami
  rationale: Ungkapan ini menyampaikan seluruh keadaan tekanan dan kesusahan yang dialami; 'penderitaan' alami dalam bahasa Indonesia dan tetap memiliki bobot yang kuat.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: supaya kami sanggup
  rationale: Konstruksi ini dapat menyatakan tujuan atau hasil. 'Supaya' mempertahankan keterbukaan itu secara wajar, sedangkan 'sanggup' menyampaikan kemampuan yang diberikan melalui penghiburan Allah.
- source_word: παρακαλεῖν
  choice: menghibur
  rationale: Pilihan ini mempertahankan pengulangan keluarga kata παρακαλέω/παράκλησις dalam seluruh ayat.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: mereka yang mengalami penderitaan apa pun
  rationale: πάσῃ di sini berjangkauan distributif, yaitu orang-orang dalam penderitaan jenis apa pun; rumusan ini lebih alami daripada pengulangan harfiah 'segala penderitaan'.
- source_word: διὰ τῆς παρακλήσεως
  choice: dengan penghiburan
  rationale: διά dengan genitif menyatakan sarana; 'dengan' ringkas dan idiomatis serta menjaga kaitan leksikal dengan 'menghibur'.
- source_word: ἧς παρακαλούμεθα αὐτοὶ
  choice: yang kami sendiri terima
  rationale: Bahasa Indonesia lebih alami mengungkapkan pasif ini sebagai 'penghiburan yang ... terima'; 'kami sendiri' mempertahankan penekanan αὐτοί. Hubungan dengan keluarga kata yang sama tetap terlihat melalui nomina 'penghiburan'.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: dari Allah
  rationale: Walaupun ὑπό menandai pelaku dalam konstruksi pasif, setelah pengubahan idiomatis menjadi 'terima', bahasa Indonesia menandai sumber penghiburan secara alami dengan 'dari Allah'.
theological_decisions:
- issue: Rentang makna παρακαλέω / παράκλησις
  choice: menghibur / penghiburan
  alternative: menguatkan / penguatan; memberi dorongan / dorongan
  rationale: Karena ayat ini dibingkai oleh θλῖψις, nuansa penghiburan di tengah penderitaan paling menonjol. Catatan kaki menjaga nuansa penguatan atau dorongan dan menjelaskan pengulangan keluarga kata Yunani.
- issue: Hubungan εἰς τὸ sebagai tujuan atau hasil
  choice: supaya kami sanggup
  alternative: sehingga kami sanggup
  rationale: '''Supaya'' menyampaikan arah atau maksud penghiburan Allah tanpa meniadakan akibat nyata bahwa penerimanya menjadi mampu menghibur orang lain.'
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bernada pastoral. Pengulangan 'menghibur/penghiburan' dipertahankan untuk mencerminkan pola retoris Yunani; bentuk pasif terakhir diidiomatisasi menjadi 'kami sendiri terima dari Allah' agar lancar tanpa mengubah sumber ilahinya.
