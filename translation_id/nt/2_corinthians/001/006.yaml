reference: 2 Corinthians 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: id
  text: Jika kami mengalami kesesakan, itu demi penghiburan dan keselamatanmu; dan jika kami dihibur, itu demi penghiburanmu[a][b], yang berdaya guna dalam ketekunan menanggung penderitaan yang sama yang juga kami tanggung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah tidak memuat: “dan jika kami dihibur, itu demi penghiburanmu.”'
    reason: textual_variant
  - marker: b
    text: Atau “penguatan” sebagai ganti “penghiburan” di seluruh ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: kami mengalami penindasan
  rationale: Bentuk pasif kini menggambarkan tekanan atau kesusahan yang terus dialami. ‘Mengalami penindasan’ menyampaikan tekanan dari luar dengan bahasa Indonesia yang wajar.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: penghiburan / dihibur
  rationale: Dalam konteks 2 Korintus 1:3–7, kelompok kata ini berulang dan mencakup penghiburan sekaligus penguatan. Pemakaian bentuk yang serumpun menjaga kepaduan leksikal.
- source_word: σωτηρίας
  choice: keselamatan
  rationale: Pilihan ini mempertahankan cakupan makna σωτηρία yang luas tanpa mempersempitnya hanya menjadi kelepasan dari kesulitan saat ini.
- source_word: τῆς ἐνεργουμένης
  choice: yang bekerja
  rationale: Partisipel ini menyatakan daya yang sedang bekerja atau menghasilkan dampak, bukan sekadar keberadaan penghiburan.
- source_word: ἐν ὑπομονῇ
  choice: dalam ketekunanmu menanggung
  rationale: Ungkapan ini menghubungkan bekerjanya penghiburan dengan ketabahan yang nyata ketika jemaat menanggung penderitaan; kata ganti ‘-mu’ tersirat dari hubungan dengan ‘penghiburanmu’.
- source_word: τῶν αὐτῶν παθημάτων
  choice: penderitaan yang sama
  rationale: Terjemahan langsung ini mempertahankan penekanan pada kesamaan penderitaan yang dialami Paulus dan jemaat Korintus.
- source_word: ὑπὲρ
  choice: demi
  rationale: Di kedua klausa, preposisi ini menyatakan manfaat bagi jemaat. ‘Demi’ secara ringkas mempertahankan nuansa ‘untuk kepentingan’.
theological_decisions:
- issue: Cakupan σωτηρία
  choice: keselamatan
  alternative: kelepasan
  rationale: ‘Keselamatan’ membiarkan cakupan teologis istilah itu tetap luas dan tidak membatasinya pada pembebasan sementara dari penderitaan.
- issue: Cara penghiburan bekerja dalam ὑπομονή
  choice: penghiburan bekerja dalam ketekunan menanggung penderitaan
  alternative: penghiburan menghasilkan ketekunan
  rationale: Rumusan ini mempertahankan hubungan yang dinyatakan teks tanpa menentukan secara berlebihan apakah ketekunan merupakan sarana, ranah, atau hasil penghiburan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur paralel kedua klausa dipertahankan, sementara frasa partisipial dibuat alami tanpa menghapus hubungan erat antara penghiburan, ketekunan, dan penderitaan bersama.
