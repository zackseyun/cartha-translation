  terminology: “Penghiburan/di­hibur” mempertahankan pengulangan keluarga kata παράκλησις. “Keselamatan” tepat untuk σωτηρία. “Demi” masih memadai untuk ὑπέρ dalam konteks manfaat bagi pembaca.
