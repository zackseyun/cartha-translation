id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: id
  text: Sebab, sama seperti penderitaan Kristus melimpah kepada kami[a][b], demikian juga melalui Kristus penghiburan kami melimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penderitaan karena Kristus.” Bentuk Yunani dapat menunjuk pada penderitaan yang berkaitan dengan atau menjadi bagian dalam penderitaan Kristus, ataupun penderitaan yang ditanggung demi Dia.
    reason: alternative_reading
  - marker: b
    text: “Kristus” juga dapat diterjemahkan “Mesias” apabila makna gelarnya hendak ditonjolkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan penjelasan bagi pernyataan sebelumnya dan mempertahankan daya kausalnya secara wajar dalam bahasa Indonesia.
- source_word: καθὼς ... οὕτως
  choice: sama seperti ... demikian juga
  rationale: Mempertahankan struktur perbandingan korelatif Yunani dengan ungkapan Indonesia yang jelas dan alami.
- source_word: περισσεύει
  choice: melimpah
  rationale: Menyampaikan kelimpahan yang melampaui ukuran dan mempertahankan pengulangan citra yang sama pada penderitaan dan penghiburan.
- source_word: τὰ παθήματα
  choice: penderitaan
  rationale: Padanan langsung dan lazim yang sesuai dengan konteks pengalaman kesusahan Paulus dan rekan-rekannya.
- source_word: τοῦ Χριστοῦ
  choice: Kristus
  rationale: Genitif dipertahankan secara terbuka sebagai 'penderitaan Kristus' agar hubungan maknanya tidak dipersempit; kemungkinan 'karena Kristus' dicatat dalam catatan kaki.
- source_word: εἰς ἡμᾶς
  choice: kepada kami
  rationale: Mengungkapkan bahwa penderitaan itu datang kepada dan dialami oleh Paulus beserta rekan-rekannya; 'kami' sesuai dengan rujukan penulis dalam konteks.
- source_word: διὰ τοῦ Χριστοῦ
  choice: melalui Kristus
  rationale: Menyatakan perantaraan atau sarana, sesuai dengan διά berkasus genitif.
- source_word: παράκλησις
  choice: penghiburan
  rationale: Dalam konteks langsung, istilah ini berlawanan dengan penderitaan dan terutama menunjuk pada penghiburan, meskipun dapat pula mencakup dorongan atau penguatan.
- source_word: ἡ παράκλησις ἡμῶν
  choice: penghiburan kami
  rationale: Mempertahankan bentuk posesif Yunani tanpa menjelaskan secara berlebihan apakah ini terutama penghiburan yang diterima atau dialami.
theological_decisions:
- issue: Makna 'penderitaan Kristus'
  choice: Mempertahankan ungkapan 'penderitaan Kristus' dalam teks utama sebagai genitif yang terbuka
  alternative: penderitaan karena Kristus; penderitaan yang Kristus sendiri alami dan kini turut dialami umat-Nya
  rationale: Bentuk Yunani dapat menunjukkan penderitaan yang berkaitan atau menjadi bagian dalam penderitaan Kristus, maupun penderitaan yang ditanggung demi Dia. Terjemahan utama tidak menyelesaikan ketegangan ini secara diam-diam.
- issue: Χριστός sebagai nama atau gelar
  choice: Kristus
  alternative: Mesias
  rationale: Dalam pemakaian Paulus di sini, Χριστός berfungsi secara alami seperti sebutan nama, tetapi makna gelarnya tetap sah dan dicatat sebagai alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan 'melimpah' dipertahankan untuk mencerminkan pengulangan περισσεύει, sedangkan 'kami' dipakai karena orang pertama jamak dalam konteks menunjuk kepada Paulus dan rekan-rekannya.
