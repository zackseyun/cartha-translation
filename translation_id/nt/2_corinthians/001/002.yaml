  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: id
  text: Anugerah dan damai sejahtera bagi kamu dari Allah, Bapa kita, dan Tuhan[b] Yesus, Sang Mesias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau menurut bentuk tradisional, “Yesus Kristus.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks tertentu, “Tuhan” juga dapat diterjemahkan “Tuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: anugerah
  rationale: Istilah ini mempertahankan bentuk salam Paulus sekaligus bobot teologis χάρις, dan lebih alami dalam bahasa Indonesia modern daripada ungkapan yang lebih panjang.
- source_word: ὑμῖν
  choice: bagi kamu
  rationale: Dativus penerima dalam rumusan berkat ini diungkapkan secara alami dengan 'bagi kamu'.
- source_word: εἰρήνη
  choice: damai sejahtera
  rationale: Ungkapan ini mempertahankan makna damai serta kesejahteraan yang terkandung dalam pemakaian alkitabiah εἰρήνη.
- source_word: ἀπὸ
  choice: dari
  rationale: Preposisi ini menyatakan sumber dan paling langsung diterjemahkan 'dari'.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Allah, Bapa kita
  rationale: Tanda koma memperjelas bahwa 'Bapa kita' menerangkan Allah, sesuai hubungan aposisional frasa Yunani.
- source_word: κυρίου
  choice: Tuhan
  rationale: '''Tuhan'' merupakan padanan baku dan sesuai bagi gelar κύριος yang dikenakan kepada Yesus dalam rumusan berkat ini.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus, Sang Mesias
  rationale: Χριστός diterjemahkan menurut makna gelarnya, yaitu Mesias; 'Sang' membuat fungsi gelar itu alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστοῦ dalam salam Paulus
  choice: Sang Mesias
  alternative: Kristus
  rationale: Terjemahan ini menampilkan makna gelar Χριστός tanpa menambahkan penafsiran doktrinal; bentuk tradisional 'Kristus' dicatat sebagai alternatif.
- issue: Penerjemahan κυρίου sebagai gelar kristologis
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam rumusan berkat yang menempatkan Yesus bersama Allah, 'Tuhan' paling tepat mempertahankan bobot dan laras pemakaian Perjanjian Baru, sementara kemungkinan leksikal 'Tuan' tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumusan salam dipertahankan sebagai berkat, dengan 'damai sejahtera' untuk gema alkitabiah dan 'Sang Mesias' untuk memperjelas fungsi Χριστός sebagai gelar.
