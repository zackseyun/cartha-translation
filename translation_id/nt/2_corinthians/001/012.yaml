revisions:
- from: 'Sebab inilah yang kami banggakan: kesaksian hati nurani kami, bahwa di dunia ini kami telah hidup dalam kekudusan[a] dan ketulusan yang berasal dari Allah[b], bukan dengan hikmat yang bersifat daging[c], melainkan dengan anugerah Allah—terlebih lagi dalam hubungan kami dengan kamu.'
  to: 'Sebab inilah yang kami banggakan: kesaksian hati nurani kami, bahwa di dunia ini kami hidup dalam kekudusan[a] dan ketulusan yang berasal dari Allah[b], bukan dengan hikmat yang bersifat daging[c], melainkan dengan anugerah Allah—terlebih lagi terhadap kamu.'
  rationale: Revisi diperlukan untuk membetulkan catatan varian tekstual agar sesuai dengan bacaan alternatif ἁπλότητι dan untuk menghapus alternatif catatan yang kurang didukung oleh konstruksi Yunani. Penyempurnaan kecil pada frasa penutup meningkatkan kelangsungan bahasa Indonesia tanpa mengubah makna.
