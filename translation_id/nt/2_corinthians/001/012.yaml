id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: id
  text: 'Sebab inilah yang kami banggakan: kesaksian hati nurani kami, bahwa di dunia ini kami hidup dalam kekudusan[a] dan ketulusan yang berasal dari Allah[b], bukan dengan hikmat yang bersifat daging[c], melainkan dengan anugerah Allah—terlebih lagi terhadap kamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah membaca “kesederhanaan” sebagai ganti “kekudusan.”
    reason: textual_variant
  - marker: b
    text: Atau “ketulusan ilahi.”
    reason: lexical_alternative
  - marker: c
    text: Atau “hikmat manusiawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: yang kami banggakan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan dasar kebanggaan Paulus tanpa harus mengesankan kesombongan.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: kesaksian hati nurani kami
  rationale: Mempertahankan gambaran hati nurani sebagai saksi batin dengan ungkapan baku dan jelas.
- source_word: ἁγιότητι
  choice: kekudusan
  rationale: Mewakili bacaan SBLGNT secara langsung serta mempertahankan bobot moral dan religiusnya.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: ketulusan yang berasal dari Allah
  rationale: Menafsirkan genitif sebagai sumber dengan tetap memberi catatan tentang kemungkinan arti sifat atau kualitas.
- source_word: σοφίᾳ σαρκικῇ
  choice: hikmat yang bersifat daging
  rationale: Mempertahankan istilah teologis σάρξ secara terlihat; 'bersifat daging' lebih dapat dipahami daripada bentuk harfiah 'hikmat daging'.
- source_word: χάριτι θεοῦ
  choice: anugerah Allah
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan bobot teologis χάρις.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: di dunia ini kami telah hidup
  rationale: Kata kerja mengacu pada cara menjalani kehidupan; susunan ini lebih alami daripada 'berperilaku' dan tetap menyampaikan lingkup kehidupan mereka.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: terlebih lagi dalam hubungan kami dengan kamu
  rationale: Menangkap daya komparatif περισσοτέρως dan makna relasional πρὸς secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna τοῦ θεοῦ dalam εἰλικρινείᾳ τοῦ θεοῦ
  choice: ketulusan yang berasal dari Allah
  alternative: ketulusan ilahi; ketulusan di hadapan Allah
  rationale: Genitif dapat menunjukkan sumber atau kualitas. Teks utama memakai sumber sebagai pembacaan yang paling wajar, sedangkan catatan mempertahankan alternatif yang sah.
- issue: Makna teologis σαρκικῇ
  choice: yang bersifat daging
  alternative: manusiawi; duniawi
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan istilah Paulus 'daging' dan tidak mempersempitnya hanya menjadi kebijaksanaan manusia atau dunia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah Paulus “daging” dipertahankan dengan penjelas “yang bersifat” agar dapat dipahami pembaca umum; “kamu” dipakai sebagai sapaan jamak kontekstual kepada jemaat.
