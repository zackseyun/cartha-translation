  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: id
  text: yang juga telah memeteraikan kita dan memberikan uang muka Roh di dalam hati kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jaminan” atau “pemberian awal” Roh.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: telah memeteraikan
  rationale: Mempertahankan metafora meterai yang dapat menyatakan kepemilikan, pengesahan, atau jaminan; bentuk ini wajar dan bermartabat dalam bahasa Indonesia.
- source_word: δοὺς
  choice: memberikan
  rationale: Partisip aoris dikoordinasikan secara alami dengan tindakan sebelumnya, sesuai dengan susunan paralel bahasa Yunani.
- source_word: ἀρραβῶνα
  choice: uang muka
  rationale: Istilah ini menunjuk pada pembayaran pertama yang menjamin pelunasan atau pemenuhan selanjutnya. 'Uang muka' mempertahankan metafora komersial secara konkret.
- source_word: τοῦ πνεύματος
  choice: Roh itu
  rationale: Genitif dipertahankan secara ringkas dalam frasa 'uang muka Roh itu', tanpa memutuskan secara eksplisit apakah Roh merupakan uang muka itu atau sumbernya. Huruf kapital menandai rujukan kepada Roh Allah dalam konteks.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: di dalam hati kita
  rationale: Menerjemahkan ἐν dengan datif sebagai lokasi batiniah dan mempertahankan ungkapan antropologis Paulus.
- source_word: ὁ καὶ ... καὶ
  choice: yang juga ... dan
  rationale: Klausa relatif menghubungkan partisip berartikel ini dengan Allah pada ayat sebelumnya secara alami.
theological_decisions:
- issue: Makna Roh sebagai ἀρραβών
  choice: uang muka Roh itu
  alternative: jaminan Roh itu; pemberian awal Roh itu
  rationale: Pilihan ini mempertahankan gambaran komersial tentang pemberian awal yang menjamin pemenuhan selanjutnya, tanpa mengubahnya menjadi pernyataan doktrinal abstrak.
- issue: Hubungan genitif dalam τοῦ πνεύματος
  choice: Dibiarkan ringkas sebagai 'Roh itu' sesudah 'uang muka'
  alternative: Roh sebagai uang muka; uang muka yang berasal dari Roh
  rationale: Bahasa sumber tidak menjabarkan hubungan genitif tersebut; terjemahan utama menjaga kekompakan dan ambiguitas yang wajar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Metafora meterai dan uang muka dipertahankan; penjelasan alternatif ditempatkan dalam catatan kaki.
