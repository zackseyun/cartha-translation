source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: id
  text: dan dalam perjalanan ke Makedonia melewati tempat kalian, lalu datang lagi kepada kalian dari Makedonia, dan oleh kalian diberangkatkan ke Yudea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: singgah di tempat kalian dalam perjalanan
  rationale: διά dengan genitif menyatakan gerak melalui atau lewat tempat orang-orang Korintus. Ungkapan ini mengungkapkan rencana perjalanan Paulus secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa ia secara harfiah bergerak 'melalui' mereka.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: ke Makedonia
  rationale: διέρχομαι bersama εἰς menggambarkan perjalanan lewat Korintus menuju Makedonia. Karena gagasan melewati Korintus sudah dinyatakan dengan 'singgah di tempat kalian dalam perjalanan', tujuan akhirnya diterjemahkan secara wajar sebagai 'ke Makedonia'.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: lalu datang lagi kepada kalian dari Makedonia
  rationale: πάλιν menandai kunjungan berikutnya kepada jemaat Korintus, sedangkan ἀπό menyatakan tempat asal. Urutan Indonesia ini mempertahankan kedua unsur tersebut dan tetap lancar.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: dengan bantuan kalian melanjutkan perjalanan
  rationale: Dalam konteks perjalanan, προπέμπω lazim berarti membantu membekali, mengantar, atau memberangkatkan seseorang untuk tahap perjalanan berikutnya. Bentuk pasif dengan ὑπό menunjukkan bahwa jemaat Korintus memberikan bantuan itu. Terjemahan ini lebih alami daripada konstruksi pasif harfiah dalam bahasa Indonesia.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ke Yudea
  rationale: εἰς menandai tujuan perjalanan; 'ke Yudea' adalah padanan baku dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti jamak 'kalian' mempertahankan bahwa ὑμῶν/ὑμᾶς merujuk kepada komunitas Korintus. Kalimat ini merupakan lanjutan sintaksis dari ayat sebelumnya, sehingga diawali dengan 'dan'.
