  naturalness: Bahasa Indonesia baku, jelas, dan sesuai untuk register surat rasuli. Frasa “mengenai kamu” agak formal, tetapi wajar dalam register ini dan secara baik menghindari kesan bahwa pengharapan itu semata-mata dilakukan demi kepentingan penerima.
