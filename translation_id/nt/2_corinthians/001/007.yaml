  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: id
  text: Dan pengharapan kami mengenai kamu tetap teguh, sebab kami tahu bahwa sama seperti kamu turut mengambil bagian dalam penderitaan, demikian juga kamu turut mengambil bagian dalam penghiburan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penguatan” untuk “penghiburan” (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: pengharapan
  rationale: Padanan baku dan transparan yang mempertahankan unsur penantian serta keyakinan tanpa mengubahnya menjadi sekadar rasa percaya diri.
- source_word: βεβαία
  choice: tetap teguh
  rationale: Mengungkapkan sifat pengharapan yang kokoh dan dapat diandalkan dengan bahasa Indonesia yang wajar.
- source_word: ὑπὲρ ὑμῶν
  choice: mengenai kamu
  rationale: Dalam konteks ini frasa tersebut menyatakan acuan kepada jemaat Korintus; pilihan ini menghindari kemungkinan bahwa pengharapan itu dilakukan demi kepentingan mereka.
- source_word: εἰδότες
  choice: sebab kami tahu
  rationale: Partisip ini menyatakan dasar bagi keteguhan pengharapan Paulus; hubungan kausal dibuat jelas secara alami.
- source_word: ὡς ... οὕτως καί
  choice: sama seperti ... demikian juga
  rationale: Mempertahankan susunan korelatif Yunani dan kesejajaran antara penderitaan dan penghiburan.
- source_word: κοινωνοί
  choice: turut mengambil bagian dalam
  rationale: Menyampaikan gagasan partisipasi bersama yang terkandung dalam nomina Yunani dan dapat dipakai secara alami pada kedua bagian kalimat.
- source_word: παθημάτων
  choice: penderitaan
  rationale: Padanan luas dan jelas yang sesuai dengan tema penderitaan dalam konteks langsung.
- source_word: παρακλήσεως
  choice: penghiburan
  rationale: Sesuai dengan konteks 2 Korintus 1, ketika tindakan Allah dalam menghadapi penderitaan terutama digambarkan sebagai penghiburan, sambil tetap mengakui kemungkinan nuansa penguatan.
- source_word: '[elliptical second clause]'
  choice: kamu turut mengambil bagian dalam
  rationale: Predikat yang tersirat pada klausa kedua dilengkapi agar kalimat Indonesia utuh, tanpa menambahkan gagasan baru.
theological_decisions:
- issue: Hubungan orang Korintus dengan penderitaan dan penghiburan
  choice: Mempertahankan kesejajaran partisipasi dalam keduanya
  alternative: Menafsirkan penghiburan sebagai ganjaran yang baru akan diterima kemudian
  rationale: Teks menyatakan korelasi langsung melalui ὡς ... οὕτως καί dan tidak menentukan urutan waktu atau mekanisme teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk jamak orang kedua dalam bahasa Yunani diterjemahkan dengan “kamu”, yang dalam konteks surat merujuk kepada jemaat secara kolektif. Pengulangan “turut mengambil bagian dalam” dipertahankan demi kejelasan hubungan paralel.
