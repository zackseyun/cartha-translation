  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: id
  text: Dengan keyakinan ini, aku bermaksud datang kepada kalian lebih dahulu, supaya kalian menerima kebaikan untuk kedua kalinya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manfaat yang kedua”; secara harfiah, “anugerah yang kedua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: keyakinan
  rationale: Kata ini menyatakan keyakinan atau rasa percaya; “keyakinan” alami dalam bahasa Indonesia dan sesuai dengan dasar niat perjalanan Paulus.
- source_word: ἐβουλόμην
  choice: aku bermaksud
  rationale: Bentuk ini menyatakan kehendak atau niat tanpa harus mengesankan rencana resmi yang sudah pasti.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: sebelumnya ... datang kepada kalian lebih dahulu
  rationale: πρότερον dapat menunjuk pada niat terdahulu sekaligus urutan kunjungan. Susunan ini menghubungkan maksud Paulus dengan rencana perjalanan yang diterangkan dalam ayat berikutnya.
- source_word: δευτέραν χάριν
  choice: berkat untuk kedua kalinya
  rationale: χάρις di sini menunjuk pada kebaikan atau manfaat yang mereka alami melalui kunjungan Paulus. “Berkat” mempertahankan nuansa pemberian baik tanpa membatasinya pada manfaat praktis saja.
- source_word: σχῆτε
  choice: kalian memperoleh
  rationale: ἔχω dalam konteks ini dapat bermakna memiliki atau menerima; “memperoleh” menghasilkan ungkapan Indonesia yang wajar bersama “berkat”.
theological_decisions:
- issue: Makna χάρις dalam konteks kunjungan Paulus
  choice: berkat
  alternative: anugerah; kebaikan; manfaat
  rationale: Konteksnya adalah kebaikan yang diperoleh jemaat melalui kunjungan Paulus, tetapi istilah Yunani tetap memiliki warna kemurahan atau karunia. “Berkat” menjaga keluasan ini tanpa secara khusus menjadikannya istilah keselamatan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina jamak “kalian” dipakai untuk memperjelas bahwa ὑμᾶς dan verba terkait menunjuk kepada jemaat secara kolektif.
