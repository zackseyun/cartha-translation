  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: id
  text: Jadi, ketika aku berniat demikian, apakah aku tidak tetap pendirian?[a] Atau, apakah rencana-rencanaku kubuat menurut daging,[b] sehingga dalam perkataanku ada “Ya, ya” dan “Tidak, tidak”?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersikap plin-plan.”
    reason: lexical_alternative
  - marker: b
    text: “Menurut daging” di sini dapat berarti menurut pertimbangan manusia semata atau menurut ukuran duniawi.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, seolah-olah “Ya” dan “Tidak” dapat sama-sama berlaku pada waktu yang sama.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: ketika aku berniat
  rationale: Partisip ini menunjuk pada niat Paulus mengenai rencana perjalanan yang baru saja dibicarakan. “Berniat” mempertahankan unsur kehendak dan pertimbangan tanpa menjadikannya keputusan resmi.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: aku bersikap plin-plan
  rationale: Ungkapan Yunani menggambarkan tindakan yang lahir dari ketidakmantapan atau perubahan pendirian. “Bersikap plin-plan” alami dalam bahasa Indonesia modern dan sesuai dengan tuduhan yang sedang Paulus sangkal.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: rencana-rencanaku kubuat
  rationale: Bentuk ini menyampaikan tindakan merencanakan dengan wajar dalam bahasa Indonesia. Unsur kepemilikan mempertahankan penekanan bahwa Paulus sedang membahas cara ia sendiri membuat rencana.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Terjemahan ini mempertahankan ungkapan khas Paulus dan tidak segera membatasi maknanya pada satu tafsiran. Catatan kaki menjelaskan kemungkinan makna kontekstualnya.
- source_word: παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: bagiku berlaku sekaligus “Ya, ya” dan “Tidak, tidak”
  rationale: “Bagiku berlaku” menyatakan bahwa sikap tersebut menjadi ciri tindakan Paulus, sedangkan “sekaligus” memperjelas pertentangan yang tersirat tanpa menghapus pengulangan Yunani.
theological_decisions:
- issue: Makna κατὰ σάρκα dalam cara Paulus membuat rencana
  choice: menurut daging
  alternative: menurut ukuran manusia semata; secara duniawi
  rationale: “Daging” adalah istilah Paulus yang bermakna luas dan bergantung pada konteks. Mempertahankannya dalam teks utama menjaga tekstur teologis serta ambiguitas yang asli; kemungkinan maknanya diterangkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata “plin-plan” dipakai karena umum dipahami dan tepat menyampaikan tuduhan tentang ketidakmantapan, sementara catatan menawarkan bentuk yang lebih formal. Pengulangan “Ya, ya” dan “Tidak, tidak” dipertahankan sesuai teks Yunani.
