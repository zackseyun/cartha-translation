revisions:
- from: Bahkan, dalam diri kami sendiri kami merasa seolah-olah telah dijatuhi hukuman mati[a]. Hal itu terjadi supaya kami tidak mengandalkan diri sendiri, melainkan Allah yang membangkitkan orang mati.
  to: Namun, kami sendiri telah memiliki vonis mati dalam diri kami, supaya kami tidak mengandalkan diri sendiri, melainkan Allah, yang membangkitkan orang mati.[a]
  rationale: Revisi menghapus penafsiran tambahan bahwa penulis hanya ‘merasa seolah-olah’ dijatuhi hukuman. “Vonis mati” mempertahankan kemungkinan makna ἀπόκριμα sebagai keputusan atau putusan yang menentukan, sedangkan catatan kaki menyediakan padanan yang lebih eksplisit tanpa memaksakan suatu pembacaan yudisial formal. Penanda catatan kaki ditempatkan pada istilah yang diberi alternatif leksikal.
