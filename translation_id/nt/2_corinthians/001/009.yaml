id: 2CO.1.9
reference: 2 Corinthians 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: id
  text: Namun, kami sendiri telah memiliki vonis mati dalam diri kami, supaya kami tidak mengandalkan diri sendiri, melainkan Allah, yang membangkitkan orang mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “putusan yang menetapkan kematian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Bahkan
  rationale: Dalam konteks ini ἀλλά memperkuat sekaligus mempertentangkan pengalaman Paulus dengan pernyataan sebelumnya; “Bahkan” terdengar alami sebagai penanda penegasan dalam bahasa Indonesia.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: dalam diri kami sendiri kami merasa
  rationale: Mempertahankan penekanan αὐτοί dan sifat batiniah ἐν ἑαυτοῖς, sambil menghasilkan susunan Indonesia yang dapat dipahami dengan wajar.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: seolah-olah telah dijatuhi hukuman mati
  rationale: ἀπόκριμα menunjuk pada keputusan atau vonis yang menetapkan kematian. “Hukuman mati” menyampaikan nuansa yudisial, sedangkan “seolah-olah” menandai bahwa hal ini merupakan kepastian yang mereka rasakan dalam diri, bukan keterangan tentang putusan pengadilan formal.
- source_word: ἐσχήκαμεν
  choice: telah ... merasa
  rationale: Bentuk perfektum menyatakan keadaan menetap yang timbul dari pengalaman sebelumnya. Pilihan ini tidak menambahkan gagasan eksplisit bahwa vonis itu ‘diterima’ dari pihak tertentu.
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: supaya kami tidak mengandalkan diri sendiri
  rationale: Menyampaikan tujuan ἵνα dan keyakinan atau ketergantungan yang menetap dalam πεποιθότες secara alami.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: melainkan Allah
  rationale: “Melainkan” mempertahankan pertentangan tegas antara bersandar pada diri dan bersandar pada Allah; verba “mengandalkan” berlaku juga pada unsur kedua.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: yang membangkitkan orang mati
  rationale: Ungkapan ini secara langsung menggambarkan Allah berdasarkan kuasa-Nya untuk membangkitkan orang mati.
theological_decisions:
- issue: Apakah pengalaman batin Paulus harus disajikan sebagai putusan mati objektif atau sebagai kesadaran akan kematian yang sudah pasti
  choice: merasa seolah-olah telah dijatuhi hukuman mati
  alternative: memiliki vonis mati dalam diri kami sendiri
  rationale: Frasa Yunani bersifat metaforis dan dapat dipahami sebagai vonis atau keputusan mati yang dirasakan dalam diri. Terjemahan ini menjaga citra yudisial tanpa menyatakan bahwa pengadilan manusia benar-benar menjatuhkan vonis.
- issue: Cara menerjemahkan τοὺς νεκρούς
  choice: orang mati
  alternative: mereka yang mati
  rationale: “Orang mati” alami dalam bahasa Indonesia, mencakup kelompok secara umum, dan tidak mempersempit cakupan kuasa kebangkitan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Penekanan pada “kami sendiri” dipertahankan, dan klausa tujuan dibuat eksplisit tanpa memasukkan doktrin denominasi tertentu.
