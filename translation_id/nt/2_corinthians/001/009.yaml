  naturalness: “Namun” lebih tepat dan alami untuk fungsi adversatif ἀλλά dalam kesinambungan argumen. Susunan revisi tetap baku dan jelas, walaupun “memiliki vonis mati dalam diri kami” sengaja mempertahankan ungkapan padat dan metaforis dari teks sumber.
  terminology: “Vonis mati” menyampaikan nuansa keputusan yang menentukan kematian dalam ἀπόκριμα τοῦ θανάτου. “Mengandalkan” tepat untuk πεποιθότες ἐπί, dan “Allah, yang membangkitkan orang mati” menerjemahkan partisip deskriptif dengan setia.
