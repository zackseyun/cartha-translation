  source_fidelity: 'Revisi diperlukan karena draf memindahkan nuansa καὶ ἔτι dari klausa futurum kedua ke klausa futurum pertama melalui kata “lagi”. Dalam bahasa Yunani, futurum pertama hanya berbunyi “akan menyelamatkan”, sedangkan καὶ ἔτι memodifikasi futurum terakhir. Revisi mempertahankan tiga tindakan: telah menyelamatkan, akan menyelamatkan, dan akan terus/juga menyelamatkan.'
  naturalness: Teks revisi tetap memakai Bahasa Indonesia baku modern dan alurnya jelas. “Kepada-Nya kami telah menaruh harapan” secara alami menyatakan objek harapan dan aspek perfektum yang hasilnya berlanjut.
  terminology: “Menyelamatkan” secara konsisten mencerminkan bentuk-bentuk ῥύομαι. “Kematian yang begitu dahsyat” mempertahankan θανάτου secara harfiah, sementara alternatif idiomatis “bahaya maut” tetap tersedia dalam catatan kaki. Kapitalisasi pronomina ilahi dipertahankan sesuai konvensi penerbitan yang digunakan draf.
