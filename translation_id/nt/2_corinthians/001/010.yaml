  to: Dialah yang telah menyelamatkan kami dari kematian yang begitu dahsyat dan akan menyelamatkan kami. Kepada-Nya kami telah menaruh harapan bahwa Dia juga akan terus menyelamatkan kami[a].
  rationale: Revisi mengembalikan penempatan penanda kelanjutan καὶ ἔτι pada janji penyelamatan yang terakhir, tanpa menambahkan gagasan “lagi” pada janji sebelumnya. Catatan kaki tetap melekat pada seluruh ungkapan “kematian yang begitu dahsyat” dan menyediakan pembacaan idiomatis tanpa mengganti ungkapan harfiah di teks utama.
