  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: id
  text: Dialah yang telah menyelamatkan kami dari kematian yang begitu dahsyat dan akan menyelamatkan kami. Kepada-Nya kami telah menaruh harapan bahwa Dia juga akan terus menyelamatkan kami[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari bahaya maut yang begitu besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: begitu dahsyat
  rationale: Kata sifat penunjuk ini menegaskan besarnya ancaman; “begitu dahsyat” mempertahankan daya tekan itu secara alami dalam bahasa Indonesia.
- source_word: θανάτου
  choice: kematian
  rationale: Nomina Yunani secara harfiah berarti “kematian”. Ungkapan ini dapat menunjuk pada bahaya maut, tetapi citra teks sumber dipertahankan dalam teks utama dan arti idiomatis dicatat dalam catatan kaki.
- source_word: ἐρρύσατο
  choice: telah menyelamatkan
  rationale: Verba ini menyatakan pembebasan dari bahaya. “Menyelamatkan” jelas, wajar, dan memungkinkan konsistensi dengan bentuk-bentuk verba yang sama selanjutnya.
- source_word: ῥύσεται
  choice: akan menyelamatkan ... lagi / akan terus menyelamatkan
  rationale: Bentuk mendatang dipertahankan. Kemunculan pertama diterjemahkan “akan menyelamatkan ... lagi”, sedangkan kemunculan kedua bersama καὶ ἔτι diterjemahkan “akan terus menyelamatkan” untuk mengungkap kesinambungan pengharapan tanpa menghilangkan gagasan pertolongan mendatang.
- source_word: εἰς ὃν
  choice: Kepada-Nyalah
  rationale: Dalam konstruksi ini, frasa tersebut menunjuk kepada pribadi yang menjadi tumpuan harapan. “Kepada-Nyalah” alami dalam bahasa Indonesia dan memberi penekanan yang sesuai.
- source_word: ἠλπίκαμεν
  choice: kami menaruh harapan
  rationale: Bentuk perfektum menyiratkan tindakan menaruh harapan yang hasilnya tetap berlangsung. Ungkapan Indonesia ini menyampaikan sikap yang telah ditetapkan dan masih berlanjut.
- source_word: καὶ ἔτι
  choice: akan terus
  rationale: Gabungan ini menyatakan kelanjutan dan juga penguatan. Dalam konteks rangkaian penyelamatan lampau dan mendatang, “akan terus” menyampaikan pengharapan akan pertolongan lebih lanjut secara alami.
theological_decisions:
- issue: Apakah θάνατος harus diterjemahkan secara harfiah sebagai “kematian” atau secara idiomatis sebagai “bahaya maut” dalam teks utama
  choice: Mempertahankan “kematian” dalam teks utama
  alternative: Menerjemahkan frasa itu sebagai “bahaya maut yang begitu besar”
  rationale: Teks Yunani secara eksplisit memakai “kematian”. Pilihan ini mempertahankan ungkapan Paulus yang kuat, sedangkan kemungkinan arti idiomatisnya disediakan dalam catatan kaki.
- issue: Cara menyampaikan hubungan antara dua pernyataan penyelamatan pada masa mendatang
  choice: Menerjemahkan yang pertama “akan menyelamatkan kami lagi” dan yang kedua “akan terus menyelamatkan kami”
  alternative: Mengulang secara harfiah “akan menyelamatkan” pada kedua tempat
  rationale: Pilihan ini mempertahankan kedua verba futurum dan menyampaikan daya καὶ ἔτι sebagai kesinambungan, tanpa menentukan bentuk atau waktu khusus dari pertolongan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pengulangan akar “menyelamatkan” dipertahankan untuk mencerminkan pengulangan ῥύομαι. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
