  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: id
  text: Sebab kami tidak menuliskan kepada kamu apa pun selain yang kamu baca dan juga kamu pahami. Aku berharap bahwa kamu akan memahaminya sampai pada akhirnya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ
  choice: Sebab kami tidak menuliskan kepada kamu apa pun selain
  rationale: Bentuk ini menyampaikan penyangkalan bahwa isi tulisan Paulus berbeda atau menyembunyikan maksud lain, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἀναγινώσκετε
  choice: kamu baca
  rationale: Bentuk kini Yunani di sini menyatakan kegiatan membaca surat itu secara lugas; bentuk Indonesia tanpa penanda aspek adalah padanan yang alami.
- source_word: ἢ καὶ ἐπιγινώσκετε
  choice: dan memang kamu pahami
  rationale: Dalam konteks ini ἐπιγινώσκω menunjuk pada menangkap atau mengenali maksud tulisan. 'Pahami' lebih jelas bagi pembaca modern, sedangkan 'memang' memberi tekanan pada καί tanpa membuat kalimat kaku.
- source_word: ἐλπίζω δὲ ὅτι ... ἐπιγνώσεσθε
  choice: Aku berharap bahwa kamu akan terus memahaminya
  rationale: Bentuk orang pertama tunggal dipertahankan sebagai 'Aku', dan bentuk mendatang diterjemahkan secara alami. 'Terus' menghubungkan pemahaman yang sudah disebut dengan harapan untuk masa berikutnya tanpa menambahkan gagasan kepastian mutlak.
- source_word: ἕως τέλους
  choice: sampai pada akhirnya
  rationale: Terjemahan ini mempertahankan bentuk harfiah dan kemungkinan nuansa temporal dari frasa Yunani. Kemungkinan makna idiomatis 'sepenuhnya' dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah ἕως τέλους menyatakan durasi sampai akhir atau tingkat pemahaman yang penuh
  choice: sampai pada akhirnya
  alternative: sepenuhnya
  rationale: Frasa Yunani secara harfiah memiliki arah temporal dan konteks tidak memaksa pembacaan idiomatis. Teks utama mempertahankan ketegangan itu, sedangkan alternatif tingkat kelengkapan diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat apostolik yang lugas dan bermartabat. Pergantian dari 'kami' menjadi 'Aku' dipertahankan sesuai bentuk verba Yunani. Tanda koma pada akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
