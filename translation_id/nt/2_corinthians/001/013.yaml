revisions:
- from: Sebab kami tidak menuliskan kepada kamu apa pun selain yang kamu baca dan memang kamu pahami. Aku berharap bahwa kamu akan terus memahaminya sampai pada akhirnya[a],
  to: Sebab kami tidak menuliskan kepada kamu apa pun selain yang kamu baca dan juga kamu pahami. Aku berharap bahwa kamu akan memahaminya sampai pada akhirnya,
  rationale: Revisi terbatas pada penghilangan tambahan makna «terus» dan penggantian «memang» dengan «juga». Teks utama tetap mempertahankan pembacaan temporal ἕως τέλους, sedangkan catatan kaki tetap menyediakan alternatif idiomatis. Koma akhir dipertahankan karena kalimat Yunani berlanjut ke ayat berikutnya.
