id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: id
  text: 'Paulus, rasul Mesias Yesus atas kehendak Allah, dan Timotius, saudara kita, kepada jemaat Allah yang berada di Korintus, bersama dengan semua orang kudus di seluruh Akhaya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: rasul
  rationale: Istilah baku dan tepat dalam bahasa Indonesia untuk jabatan utusan yang menerima perutusan khusus; lebih sesuai dalam salam Paulus daripada sekadar 'utusan'.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Yesus
  rationale: Urutan Yunani dipertahankan, dan Χριστός diterjemahkan sebagai gelar 'Mesias' agar makna mesianiknya tetap tampak.
- source_word: διὰ θελήματος θεοῦ
  choice: atas kehendak Allah
  rationale: Ungkapan Indonesia yang alami untuk menyatakan bahwa kerasulan Paulus terjadi berdasarkan kehendak Allah.
- source_word: ὁ ἀδελφὸς
  choice: saudara kita
  rationale: Walaupun teks Yunani secara harfiah memakai artikel, 'saudara kita' secara alami mengungkapkan hubungan Timotius dengan Paulus dan para pembaca tanpa mengubah maksud konteks.
- source_word: ἐκκλησίᾳ
  choice: jemaat
  rationale: '''Jemaat'' merupakan padanan Indonesia yang baku dan kontekstual untuk komunitas umat Allah yang disapa dalam surat.'
- source_word: ἁγίοις
  choice: orang kudus
  rationale: Padanan yang mapan bagi sebutan Paulus untuk umat yang dikhususkan bagi Allah, bukan klaim bahwa mereka sempurna secara moral.
- source_word: σὺν
  choice: bersama dengan
  rationale: Menyampaikan dengan jelas bahwa sapaan itu mencakup orang-orang kudus di wilayah Akhaya.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: di seluruh Akhaya
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan cakupan seluruh wilayah tersebut.
theological_decisions:
- issue: Penerjemahan Χριστός dalam gelar pembuka Paulus
  choice: Mesias Yesus
  alternative: Kristus Yesus
  rationale: Di sini Χριστός tetap memiliki daya sebagai gelar; 'Mesias' menampilkan makna gelar itu secara langsung tanpa mengubah pengakuan kristologis.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan wajar untuk pembukaan surat. Tanda titik dua dipertahankan karena kalimat salam berlanjut ke ayat berikutnya. Tidak ada penanda catatan kaki karena tidak diperlukan untuk menyampaikan varian atau ambiguitas penting dalam ayat ini.
