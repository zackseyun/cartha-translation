id: 2CO.4.15
reference: 2 Corinthians 4:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: id
  text: Sebab semuanya itu demi kamu, supaya anugerah yang bertambah melalui semakin banyak orang[a] membuat ucapan syukur melimpah demi kemuliaan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui banyak orang” atau “melalui jumlah orang yang lebih besar.” Ungkapan Yunani dapat menunjuk kepada banyak orang secara umum atau kepada jumlah orang yang semakin besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Sebab semuanya itu
  rationale: Ungkapan ini mencakup segala hal yang baru saja dibicarakan Paulus, sedangkan γάρ menyatakan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: δι’ ὑμᾶς
  choice: demi kamu
  rationale: διά dengan akusatif di sini menunjukkan kepentingan atau manfaat bagi para pembaca; 'demi kamu' menyampaikan maksud itu dengan ringkas dan wajar.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil yang dimaksudkan tanpa memaksa pembedaan tajam antara keduanya.
- source_word: ἡ χάρις
  choice: anugerah
  rationale: '''Anugerah'' merupakan padanan Indonesia yang lazim untuk χάρις dalam konteks karya dan kemurahan Allah, tanpa mempersempit mekanisme teologisnya.'
- source_word: πλεονάσασα
  choice: yang bertambah
  rationale: Partisip ini menggambarkan anugerah yang meningkat atau makin berlimpah. Bentuk klausa relatif menghasilkan bahasa Indonesia yang alami sambil mempertahankan hubungannya dengan 'anugerah'.
- source_word: διὰ τῶν πλειόνων
  choice: melalui semakin banyak orang
  rationale: Ungkapan komparatif substantival ini dapat menunjuk kepada banyak orang atau jumlah orang yang makin besar. Terjemahan utama menampilkan nuansa perkembangan jumlah dalam konteks.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: membuat ucapan syukur melimpah
  rationale: Susunan Yunani menempatkan 'anugerah' sebagai subjek dan 'ucapan syukur' sebagai objek, sehingga bentuk kausatif ini mempertahankan relasi gramatikal sekaligus menyampaikan gagasan kelimpahan.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: demi kemuliaan Allah
  rationale: εἰς menyatakan arah, tujuan, atau hasil. 'Demi kemuliaan Allah' alami dalam bahasa Indonesia dan mempertahankan orientasi akhirnya kepada kemuliaan Allah.
theological_decisions:
- issue: Makna dan cakupan 'anugerah' dalam klausa tujuan
  choice: '''Anugerah'' dipertahankan sebagai kemurahan ilahi yang bekerja dan bertambah melalui pelayanan serta penerimanya, tanpa menentukan mekanisme yang lebih sempit.'
  alternative: '''Anugerah'' secara khusus berarti anugerah keselamatan yang menjangkau lebih banyak penerima, atau kemurahan Allah yang menghasilkan ucapan syukur yang berlipat ganda.'
  rationale: Ayat ini tidak mengharuskan penafsir memilih salah satu pengertian sempit tersebut; terjemahan menjaga keluasan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur kalimat mempertahankan alur sebab–tujuan teks Yunani, sementara bentuk 'membuat ucapan syukur melimpah' menjaga relasi gramatikal tanpa terdengar kaku.
