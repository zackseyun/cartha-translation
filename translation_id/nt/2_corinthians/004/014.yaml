  to: Sebab kami tahu bahwa Dia yang membangkitkan Yesus[a] juga akan membangkitkan kami bersama Yesus dan akan menghadirkan kami bersama kamu.
  rationale: Revisi terbatas pada παραστήσει dan frasa σύν ὑμῖν demi kejelasan serta kewajaran bahasa Indonesia. “Menghadirkan kami bersama kamu” mempertahankan makna luas ‘mempresentasikan/menempatkan dalam kehadiran’ dan tidak menambahkan “kepada diri-Nya” atau lokasi yang tidak dinyatakan dalam teks Yunani. Catatan kaki dipertahankan karena dengan benar mencatat varian “Tuhan Yesus.”
