  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: id
  text: Sebab kami tahu bahwa Dia yang membangkitkan Yesus[a] juga akan membangkitkan kami bersama Yesus dan akan menghadirkan kami bersama kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “Tuhan Yesus” dan bukan “Yesus”.
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: Sebab kami tahu
  rationale: Partisipel ini menyatakan dasar bagi keteguhan yang dibicarakan dalam konteks. Bentuk kausal ini alami dalam bahasa Indonesia dan mempertahankan hubungannya dengan ayat sebelumnya.
- source_word: ὁ ἐγείρας
  choice: Dia yang membangkitkan
  rationale: Menerjemahkan partisipel aoristus berartikel secara alami. Kata ganti berhuruf kapital merujuk kepada Allah tanpa menambahkan nama yang tidak dinyatakan dalam teks Yunani.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Mengikuti teks utama SBLGNT. Bacaan yang menambahkan gelar 'Tuhan' dicatat dalam catatan kaki.
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: juga akan membangkitkan kami
  rationale: Menjaga daya aditif καί dan menghubungkan kebangkitan para rasul atau orang percaya dengan kebangkitan Yesus.
- source_word: σὺν Ἰησοῦ
  choice: bersama Yesus
  rationale: σύν dengan datif menyatakan kebersamaan; terjemahan ini tidak memasukkan makna instrumental seperti 'melalui Yesus'.
- source_word: παραστήσει
  choice: akan menghadapkan
  rationale: Kata kerja ini dapat berarti menempatkan atau menghadirkan seseorang di hadapan pihak lain. 'Menghadapkan' mempertahankan nuansa presentasi eskatologis tanpa menentukan secara berlebihan di hadapan siapa atau dalam latar apa.
- source_word: σὺν ὑμῖν
  choice: bersama-sama dengan kamu
  rationale: Mengungkapkan kebersamaan Paulus dan rekan-rekannya dengan jemaat Korintus dalam kebangkitan dan penghadapan kelak.
theological_decisions:
- issue: Varian tekstual sesudah ἐγείρας
  choice: Teks utama memakai 'Yesus' sesuai SBLGNT, dengan varian 'Tuhan Yesus' dalam catatan kaki.
  alternative: Memakai 'Tuhan Yesus' dalam teks utama.
  rationale: Perbedaannya bersifat tekstual, bukan penyelesaian doktrinal. Catatan kaki mempertahankan keterlacakan bacaan yang lebih panjang.
- issue: Daya eskatologis παραστήσει
  choice: Menerjemahkannya sebagai tindakan Allah kelak 'menghadapkan' Paulus dan jemaat Korintus bersama-sama.
  alternative: Menjelaskannya secara khusus sebagai penghadapan di hadapan takhta pengadilan Kristus atau hanya sebagai pembenaran umum.
  rationale: Konteks mendukung penghadapan eskatologis setelah kebangkitan, tetapi teks ini sendiri tidak menyebut secara tegas tempat, pihak yang dihadapi, atau bentuk peristiwanya. Terjemahan tidak mempersempit ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kami' mempertahankan pembedaan penutur dari para penerima, sedangkan 'kamu' merujuk kepada jemaat Korintus secara kolektif. Pengulangan 'bersama' dipertahankan karena muncul dua kali dalam teks Yunani dengan dua kelompok acuan yang berbeda.
