id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: id
  text: karena kami tidak memusatkan perhatian pada hal-hal yang kelihatan, melainkan pada hal-hal yang tidak kelihatan. Sebab, hal-hal yang kelihatan itu sementara[a], tetapi hal-hal yang tidak kelihatan itu kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang kelihatan ... apa yang tidak kelihatan”; mungkin juga “hal-hal yang terlihat ... hal-hal yang tidak terlihat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: memusatkan perhatian pada
  rationale: Kata kerja σκοπέω di sini menyatakan pengarahan perhatian atau pandangan kepada sesuatu. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada tindakan melihat secara fisik.
- source_word: μὴ
  choice: tidak
  rationale: Menjaga negasi sederhana dalam bahasa Yunani tanpa menambahkan nuansa waktu seperti 'tidak lagi'.
- source_word: τὰ βλεπόμενα
  choice: hal-hal yang kelihatan
  rationale: Partisipel berartikel ini berfungsi sebagai nomina netral jamak. Terjemahan tersebut mempertahankan bahasa konkret dan kesejajaran dengan τὰ μὴ βλεπόμενα.
- source_word: ἀλλὰ
  choice: melainkan
  rationale: Dalam konstruksi 'tidak ... melainkan ...', pilihan ini menyampaikan pertentangan yang kuat dan alami dalam bahasa Indonesia.
- source_word: τὰ μὴ βλεπόμενα
  choice: hal-hal yang tidak kelihatan
  rationale: Mempertahankan struktur negatif dan kesejajaran retoris dengan 'hal-hal yang kelihatan', tanpa menafsirkannya secara khusus sebagai hal-hal rohani.
- source_word: γὰρ
  choice: Sebab
  rationale: Memperkenalkan alasan yang menjelaskan pernyataan sebelumnya dan mempertahankan hubungan argumentatif dalam teks.
- source_word: πρόσκαιρα
  choice: sementara
  rationale: Menyatakan sesuatu yang hanya berlangsung untuk waktu terbatas dan membentuk kontras yang jelas dengan 'kekal'.
- source_word: δέ
  choice: tetapi
  rationale: Menandai bagian kedua dari pertentangan antara yang sementara dan yang kekal.
- source_word: αἰώνια
  choice: kekal
  rationale: Dalam kontras dengan πρόσκαιρα, kata ini menunjuk pada apa yang tidak sementara dan yang bertahan; 'kekal' adalah padanan Indonesia yang alami dan mapan.
- source_word: ἡμῶν
  choice: kami
  rationale: Genitif ini merupakan subjek partisipel dan paling alami dinyatakan sebagai 'kami'. Pemakaian 'kami' mengikuti suara Paulus dan rekan-rekannya dalam konteks, tanpa otomatis memasukkan para pembaca.
theological_decisions:
- issue: Kontras antara yang kelihatan dan yang tidak kelihatan
  choice: Mempertahankan ungkapan konkret 'hal-hal yang kelihatan' dan 'hal-hal yang tidak kelihatan'.
  alternative: hal-hal jasmani ... hal-hal rohani; hal-hal yang tampak ... hal-hal yang tak tampak
  rationale: Teks membedakan realitas yang terlihat dan tidak terlihat, tetapi tidak secara eksplisit menyamakannya dengan kategori filosofis 'jasmani' dan 'rohani'. Terjemahan ini mempertahankan keluasan dan ketegangan makna asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur 'tidak ... melainkan ...' menjaga antitesis teks Yunani. Kata 'kelihatan' dipilih untuk mengungkapkan keadaan dapat dilihat, sedangkan 'memusatkan perhatian' menyampaikan cakupan σκοπέω secara alami. Ayat ini secara sintaksis melanjutkan kalimat sebelumnya, sehingga diawali dengan 'karena'.
