  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: id
  text: Jadi, maut bekerja di dalam kami, tetapi hidup di dalam kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dengan demikian, maut sedang bekerja di dalam kami, sedangkan hidup di dalam kamu.”'
    reason: Alternatif ini menampilkan secara lebih eksplisit daya kesimpulan ὥστε dan aspek kegiatan yang berlangsung dalam ἐνεργεῖται.
lexical_decisions:
- source_word: ὥστε
  choice: Jadi
  rationale: Dalam konteks ini, ὥστε menyatakan hasil atau kesimpulan dari uraian sebelumnya. “Jadi” menyampaikan daya inferensial itu secara alami dan ringkas.
- source_word: ὁ θάνατος
  choice: maut
  rationale: “Maut” mempertahankan bobot teologis dan daya personifikasi dari nomina abstrak Yunani, sekaligus tetap wajar dalam ragam Alkitab Indonesia modern.
- source_word: ἐν ἡμῖν
  choice: di dalam kami
  rationale: Terjemahan langsung ini mempertahankan kontras dengan ἐν ὑμῖν dan membedakan kelompok rasul (“kami”) dari jemaat Korintus (“kamu”).
- source_word: ἐνεργεῖται
  choice: bekerja
  rationale: Bentuk kini ini menggambarkan kegiatan yang sedang berlangsung dan efektif. “Bekerja” alami dalam bahasa Indonesia serta tidak memaksakan apakah bentuk Yunani dipahami sebagai medial atau pasif.
- source_word: ἡ δὲ ζωὴ
  choice: tetapi hidup
  rationale: δέ menandai pertentangan, sehingga “tetapi” tepat. “Hidup” mempertahankan istilah ringkas dan luas tanpa menafsirkannya secara sempit sebagai hanya hidup jasmani atau rohani.
- source_word: ἐν ὑμῖν
  choice: di dalam kamu
  rationale: Terjemahan ini mempertahankan kesejajaran yang padat dengan “di dalam kami” serta membiarkan nuansa personal dan komunal tetap terbuka.
theological_decisions:
- issue: Makna pertentangan maut dan hidup
  choice: Mempertahankan istilah literal “maut” dan “hidup” agar mencakup penderitaan yang menyerupai kematian dalam pelayanan para rasul dan hidup yang bekerja bagi jemaat melalui pelayanan itu.
  alternative: Menafsirkannya secara khusus sebagai kematian jasmani para rasul versus keselamatan rohani jemaat, atau sebagai mati terhadap diri sendiri versus hidup kekal.
  rationale: Konteks langsung berbicara tentang kematian dan hidup Yesus yang dinyatakan dalam tubuh para pelayan, sedangkan argumen yang lebih luas menyangkut pelayanan yang membawa hidup kepada orang lain. Teks tidak perlu mempersempit ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Kami” dan “kamu” mempertahankan pembedaan kelompok serta bentuk jamak dari teks Yunani. Susunan antitesis dijaga sedekat mungkin dengan sumber.
