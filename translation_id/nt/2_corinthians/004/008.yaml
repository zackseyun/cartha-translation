base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: id
  text: Dalam segala hal kami mengalami tekanan[a], tetapi tidak terimpit[b]; kami kebingungan, tetapi tidak sampai putus asa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam segala sesuatu”; frasa ini menyatakan cakupan yang menyeluruh, bukan terutama posisi harfiah di segala sisi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, kata Yunaninya menggambarkan keadaan terkurung atau terdesak dalam ruang sempit.
    reason: lexical_alternative
  - marker: c
    text: Atau “benar-benar kehabisan akal.” Kata Yunani ini memperkuat kata sebelumnya, “kebingungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Frasa ini menyatakan cakupan yang menyeluruh dan secara alami menerangkan tekanan yang dialami, bukan lokasi harfiah di sekeliling.
- source_word: θλιβόμενοι
  choice: mengalami tekanan
  rationale: Bentuk partisip θλίβω menggambarkan tekanan atau kesusahan yang menimpa seseorang. Pilihan ini mempertahankan citra tekanan dan cocok dengan kontras berikutnya.
- source_word: στενοχωρούμενοι
  choice: terimpit
  rationale: Kata ini membangkitkan gambaran berada dalam ruang sempit atau terkekang. “Terimpit” alami dalam bahasa Indonesia dan mempertahankan permainan citra dengan “tekanan” tanpa menyatakan bahwa mereka sama sekali tidak menderita.
- source_word: ἀπορούμενοι
  choice: kebingungan
  rationale: Kata ini menunjukkan keadaan tidak tahu apa yang harus dilakukan atau tidak melihat jalan yang jelas. “Kebingungan” mudah dipahami dan tidak terlalu menafsirkan keadaan itu sebagai hilangnya harapan.
- source_word: ἐξαπορούμενοι
  choice: sampai putus asa
  rationale: Bentuk majemuk ini memperkuat ἀπορούμενοι dan menunjuk pada keadaan kehilangan jalan keluar atau harapan sama sekali. Kata “sampai” menampilkan peningkatan retoris yang disangkal Paulus.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: tetapi tidak ... tetapi tidak
  rationale: Pengulangan ini mempertahankan irama antitesis Paulus dan menyampaikan kontras secara langsung dalam bahasa Indonesia modern.
theological_decisions:
- issue: Tingkat penguatan pada pasangan partisip kedua
  choice: “kebingungan, tetapi tidak sampai putus asa”
  alternative: “kehabisan akal, tetapi tidak sama sekali kehilangan jalan”
  rationale: Terjemahan ini membedakan kedua tingkat keadaan tersebut tanpa menjadikannya pernyataan teknis tentang hilangnya iman. Paulus mengakui kebingungan nyata, tetapi menyangkal bahwa keadaan itu mencapai keputusasaan total.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama antitesis yang ringkas. Pilihan “mengalami tekanan” dan “terimpit” mempertahankan hubungan metaforis pasangan pertama, sedangkan “tidak sampai putus asa” memperjelas peningkatan pada pasangan kedua tanpa menghapus ketegangan antara kebingungan nyata dan ketahanan.
