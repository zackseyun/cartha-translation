  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: id
  text: senantiasa membawa dalam tubuh kematian Yesus[a], supaya kehidupan Yesus juga dinyatakan dalam tubuh kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "proses kematian Yesus." Kata benda Yunani ini dapat menekankan keadaan atau pengalaman kematian yang ditanggung dalam tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: senantiasa
  rationale: Menyatakan keadaan yang terus-menerus dan sesuai dengan ragam bahasa Indonesia yang modern serta bermartabat.
- source_word: νέκρωσιν
  choice: kematian
  rationale: Kata benda ini dapat menunjuk pada keadaan atau pengalaman kematian. 'Kematian' mempertahankan kesejajaran dengan 'kehidupan', sedangkan kemungkinan arti 'proses mengalami kematian' dicatat dalam catatan kaki.
- source_word: τοῦ Ἰησοῦ
  choice: Yesus
  rationale: Konstruksi genetif diterjemahkan secara langsung sebagai 'kematian Yesus' tanpa mempersempit relasinya menjadi hanya kematian yang dialami atau dimiliki-Nya.
- source_word: ἐν τῷ σώματι
  choice: di dalam tubuh
  rationale: Kemunculan pertama tidak memiliki kata ganti kepunyaan yang eksplisit. Terjemahan ini mempertahankan bentuk tersebut dan tidak menyamakannya secara interpretatif dengan frasa kedua.
- source_word: περιφέροντες
  choice: membawa
  rationale: Partisipel kini menggambarkan tindakan yang terus berlangsung; 'membawa' mempertahankan gambaran penderitaan yang ditanggung secara jasmani.
- source_word: ἵνα
  choice: supaya
  rationale: Menyampaikan hubungan tujuan atau hasil secara alami tanpa menentukan salah satunya secara berlebihan.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan kesejajaran tambahan antara kematian Yesus dan kehidupan Yesus.
- source_word: ζωὴ
  choice: kehidupan
  rationale: '''Kehidupan'' alami dalam frasa ini dan menunjuk pada hidup Yesus yang dinyatakan, tanpa menambahkan penjelasan teologis ke dalam teks.'
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: di dalam tubuh kami
  rationale: Mempertahankan kata benda tunggal Yunani dengan pemilik jamak serta kesejajarannya dengan kemunculan pertama.
- source_word: φανερωθῇ
  choice: dinyatakan
  rationale: Bentuk pasif dipertahankan. 'Dinyatakan' jelas dan wajar serta tidak menentukan pelaku yang tidak disebutkan.
theological_decisions:
- issue: Makna νέκρωσις dalam hubungannya dengan Yesus
  choice: kematian Yesus
  alternative: proses mengalami kematian seperti Yesus
  rationale: '''Kematian'' paling baik mempertahankan arti leksikal dan kesejajaran dengan ''kehidupan Yesus''. Catatan kaki menjaga nuansa keadaan atau pengalaman kematian tanpa memasukkan tafsiran mistis tertentu.'
- issue: Bilangan σώμα dalam terjemahan Indonesia
  choice: tubuh dalam bentuk tunggal pada kedua frasa
  alternative: tubuh-tubuh kami pada frasa kedua
  rationale: Bahasa Yunani memakai bentuk tunggal pada kedua tempat. Mempertahankannya menjaga retorika dan kemungkinan makna kolektif dalam pelayanan Paulus.
- issue: Pelaku dalam φανερωθῇ
  choice: bentuk pasif 'dinyatakan' tanpa menyebut pelaku
  alternative: Allah menyatakan
  rationale: Teks Yunani tidak menyebut pelaku; bentuk pasif mempertahankan keterbukaan tersebut dan tidak menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel serta bentuk tunggal 'tubuh' dipertahankan sejauh tetap alami. Ayat ini merupakan kelanjutan sintaksis dari konteks sebelumnya, sehingga diawali dengan huruf kecil.
