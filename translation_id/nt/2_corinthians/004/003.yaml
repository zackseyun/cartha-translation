revisions:
- from: Bahkan jika Injil yang kami beritakan terselubung, Injil itu terselubung di antara mereka yang sedang menuju kebinasaan.[a]
  to: Namun, sekalipun Injil kami terselubung, Injil itu terselubung di kalangan mereka yang sedang binasa.[a]
  rationale: 'Revisi ini mempertahankan makna langsung dan pengulangan retoris teks Yunani: εἰ δὲ καὶ menjadi «Namun, sekalipun»; τὸ εὐαγγέλιον ἡμῶν menjadi «Injil kami»; dan ἀπολλυμένοις diterjemahkan «mereka yang sedang binasa». «Di kalangan» merupakan padanan idiomatis untuk ἐν dalam pembacaan lingkup, sedangkan pembacaan «bagi» dicatat sebagai alternatif.'
