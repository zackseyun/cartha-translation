  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: id
  text: Namun, sekalipun Injil kami terselubung, Injil itu terselubung di kalangan mereka yang sedang binasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi mereka yang sedang binasa” atau “di kalangan orang-orang yang terhilang.”
    reason: Mencatat kemungkinan fungsi ἐν sebagai relasi kepada pihak tertentu dan alternatif leksikal bagi ἀπολλυμένοις, tanpa menggantikan nuansa proses dalam teks utama.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Bahkan jika
  rationale: Menyampaikan daya kondisional-konsesif secara alami; δέ berfungsi sebagai penghubung atau kontras dalam alur wacana dan tidak perlu selalu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: κεκαλυμμένον
  choice: terselubung
  rationale: Mempertahankan metafora selubung dari konteks dekat (3:14–16; 4:4) dan aspek keadaan yang dihasilkan oleh bentuk perfektum pasif.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: Injil yang kami beritakan
  rationale: Genitif ἡμῶν secara harfiah dapat berarti 'Injil kami', tetapi ungkapan ini dalam bahasa Indonesia dapat disalahpahami sebagai Injil milik atau versi pribadi Paulus. Perluasan terbatas ini menyampaikan hubungan pelayanan tanpa mengubah acuannya.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: di antara mereka yang sedang menuju kebinasaan
  rationale: '''Di antara'' mempertahankan kemungkinan makna lingkup atau kelompok dari ἐν dengan datif. Frasa ''sedang menuju kebinasaan'' menyatakan proses yang masih berlangsung dalam participel kini ἀπολλυμένοις tanpa menjadikannya label statis.'
- source_word: ἐστὶν κεκαλυμμένον
  choice: Injil itu terselubung
  rationale: Mengulang predikat sebagaimana teks Yunani untuk mempertahankan penekanan, sambil menyebut kembali subjek agar kalimat Indonesia jelas.
theological_decisions:
- issue: Sifat ἀπολλυμένοις dalam konteks soteriologis Paulus
  choice: mereka yang sedang menuju kebinasaan
  alternative: mereka yang binasa; orang-orang yang terhilang
  rationale: Pilihan ini mempertahankan nuansa proses atau keadaan yang sedang berlangsung dan ketegangan teologisnya, tanpa mengubahnya menjadi label statis 'terhilang'.
- issue: Hubungan ἐν dengan mereka yang menuju kebinasaan
  choice: di antara
  alternative: bagi; pada mereka
  rationale: Teks dapat menunjuk lingkup tempat Injil itu terselubung atau pihak yang mengalaminya. Teks utama mempertahankan bentuk yang paling dekat dengan ἐν, sedangkan kemungkinan relasional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Injil' dipertahankan sebagai istilah yang umum dipahami; 'terselubung' menjaga kaitan metaforis dengan konteks. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
