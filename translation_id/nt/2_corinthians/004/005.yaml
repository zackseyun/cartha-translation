id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: id
  text: Sebab kami tidak memberitakan diri kami sendiri, melainkan Yesus Sang Mesias[a] sebagai Tuhan, sedangkan kami sendiri sebagai budak-budak kalian[b] demi Yesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus Yesus.” Kata Yunani Χριστός dapat diterjemahkan “Kristus” apabila berfungsi lebih menyerupai nama; di sini kata itu dipahami sebagai gelar “Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hamba-hamba kalian.” Kata Yunani δοῦλοι dapat berarti hamba atau budak; “budak-budak” mempertahankan nuansa ketundukan yang lebih kuat dalam kontras dengan Yesus sebagai Tuhan.
    reason: lexical_alternative
  - marker: c
    text: Atau “karena Yesus.”
    reason: translation_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: memberitakan
  rationale: Menyampaikan makna pewartaan di muka umum tanpa membatasinya pada khotbah formal.
- source_word: ἑαυτοὺς
  choice: diri kami sendiri
  rationale: Mempertahankan bentuk refleksif yang diulang untuk menegaskan kontras antara isi pemberitaan dan kedudukan para pemberita.
- source_word: Χριστὸν Ἰησοῦν
  choice: Yesus Sang Mesias
  rationale: Χριστός dipahami sebagai gelar; susunan ini paling wajar dalam bahasa Indonesia sambil tetap menampilkan Yesus sebagai Mesias.
- source_word: κύριον
  choice: sebagai Tuhan
  rationale: κύριον berfungsi predikatif sebagai hal yang diberitakan tentang Yesus, bukan sekadar bagian dari nama.
- source_word: δούλους
  choice: budak-budak
  rationale: Pilihan ini mempertahankan kuatnya ketundukan dalam δοῦλοι dan kontras yang disengaja dengan Yesus sebagai Tuhan.
- source_word: ὑμῶν
  choice: -mu
  rationale: Genitif menyatakan relasi ketundukan atau pelayanan para rasul kepada jemaat Korintus; bentuk tunggal kolektif menyapa jemaat sebagai satu kelompok.
- source_word: διὰ Ἰησοῦν
  choice: demi Yesus
  rationale: 'διά dengan akusatif di sini paling wajar menyatakan alasan atau motivasi: kedudukan mereka terhadap jemaat adalah karena kepentingan Yesus.'
theological_decisions:
- issue: Χριστός sebagai gelar atau unsur nama
  choice: Yesus Sang Mesias
  alternative: Kristus Yesus
  rationale: Dalam konteks isi pemberitaan, daya gelar Χριστός masih terasa; terjemahan ini tidak mengubahnya menjadi sekadar nama diri.
- issue: Fungsi κύριον dalam Χριστὸν Ἰησοῦν κύριον
  choice: Yesus Sang Mesias sebagai Tuhan
  alternative: Kristus Yesus, Tuhan
  rationale: Kata 'sebagai' mempertahankan fungsi predikatif κύριον tanpa menambahkan verba eksplisit seperti 'adalah' ke dalam klausa Yunani.
- issue: Kekuatan metafora δοῦλοι
  choice: budak-budakmu
  alternative: hamba-hambamu
  rationale: Kata 'budak' mempertahankan ketundukan radikal yang dikontraskan dengan ketuhanan Yesus, tanpa mengaburkan kerasnya metafora Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Yesus Sang Mesias” dipilih demi kewajaran bahasa sasaran, “sedangkan” menandai kontras kedua, dan “demi Yesus” menyampaikan alasan atau motivasi secara ringkas.
