id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: id
  text: Dalam hal mereka, ilah zaman ini[b] telah membutakan pikiran orang-orang yang tidak percaya, supaya cahaya Injil tentang kemuliaan Mesias[c], yang adalah gambar Allah, tidak menyinari mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya mereka tidak melihat cahaya Injil tentang kemuliaan Mesias.” Kata kerja Yunani yang langka di sini dapat menekankan cahaya yang bersinar atau orang-orang yang melihatnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ilah dunia ini.” Kata Yunani aiōn biasanya berarti “zaman” atau “era” dan di sini menekankan zaman sekarang yang telah jatuh.
    reason: lexical_alternative
  - marker: c
    text: Yunani Christos, yaitu gelar “Mesias” atau “Yang Diurapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Dalam diri mereka
  rationale: Merujuk kembali kepada orang-orang yang akan binasa dan yang tidak percaya dalam konteks sebelumnya. Ungkapan ini mempertahankan bentuk relasional Yunani tanpa menyiratkan bahwa suatu pribadi secara harfiah berdiam di dalam mereka.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: ilah zaman ini
  rationale: αἰών menunjuk pada zaman atau era sekarang, bukan terutama dunia ciptaan. Huruf kecil pada 'ilah' membedakan penguasa palsu ini dari Allah yang sejati tanpa mengganti ungkapan teks dengan nama tertentu.
- source_word: ἐτύφλωσεν
  choice: telah membutakan
  rationale: Bentuk ini menyampaikan tindakan yang telah terjadi beserta akibatnya yang masih berlangsung.
- source_word: τὰ νοήματα
  choice: pikiran
  rationale: Dalam konteks ini νόημα mengacu pada daya memahami atau persepsi batin, dan 'pikiran' merupakan padanan Indonesia yang alami.
- source_word: τῶν ἀπίστων
  choice: orang-orang yang tidak percaya
  rationale: Menyatakan mereka yang tidak percaya tanpa menambahkan nuansa ketidaksetiaan moral yang tidak harus terkandung dalam kata Yunani.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: supaya ... tidak menyinari mereka
  rationale: Konstruksi ini menyatakan tujuan atau akibat. Kata kerja langka αὐγάζω dapat menonjolkan cahaya yang bersinar atau orang yang melihatnya; teks utama mengikuti gambaran cahaya yang tidak menyinari mereka.
- source_word: τὸν φωτισμὸν
  choice: cahaya
  rationale: '''Cahaya'' menyampaikan metafora φωτισμός secara wajar dan jelas dalam bahasa Indonesia.'
- source_word: τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ
  choice: Injil tentang kemuliaan Mesias
  rationale: Rangkaian genitif dipahami sebagai cahaya dari Injil yang memberitakan atau menyingkapkan kemuliaan Mesias. 'Tentang' menghindari susunan Indonesia yang kaku tanpa mengubah fokus pada kemuliaan Mesias.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar di sini; 'Mesias' menyatakan makna gelar tersebut dalam bahasa Indonesia.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: yang adalah gambar Allah
  rationale: Mempertahankan pernyataan kristologis langsung dan gema antarteks dari εἰκών tanpa perluasan doktrinal.
theological_decisions:
- issue: Rujukan 'ilah zaman ini'
  choice: Ungkapan sumber dipertahankan sebagai 'ilah zaman ini'.
  alternative: Mengganti ungkapan itu dengan 'Iblis' atau menafsirkannya sebagai sistem dunia yang impersonal.
  rationale: Teks menunjuk pada kuasa jahat personal yang secara tradisional dipahami sebagai Iblis, tetapi tidak menyebut namanya. Terjemahan tidak menambahkan identifikasi yang tidak dinyatakan secara eksplisit.
- issue: Fungsi αὐγάσαι bersama φωτισμός
  choice: Cahaya Injil tidak menyinari orang-orang yang tidak percaya.
  alternative: Orang-orang yang tidak percaya tidak melihat cahaya Injil.
  rationale: Kata kerja ini langka dan memungkinkan kedua penekanan. Bacaan utama berkoordinasi secara alami dengan metafora cahaya, sedangkan kemungkinan persepsi manusia dicatat dalam catatan kaki.
- issue: Makna rangkaian genitif τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ
  choice: Injil tentang kemuliaan Mesias.
  alternative: Injil mulia tentang Mesias atau cahaya kemuliaan yang berasal dari Injil Mesias.
  rationale: Pilihan utama menjaga kemuliaan Mesias sebagai isi atau fokus Injil sambil menghasilkan bahasa Indonesia yang alami; hubungan gramatikal tetap memiliki keluwesan semantis.
- issue: Daya kristologis 'gambar Allah'
  choice: Pernyataan langsung dipertahankan tanpa penjelasan tambahan.
  alternative: Menambahkan istilah teologis kemudian untuk menjelaskan hubungan Mesias dengan Allah.
  rationale: Terjemahan menyatakan apa yang dinyatakan teks dan tidak memasukkan rumusan doktrinal yang tidak hadir secara leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Injil', 'Mesias', dan 'gambar Allah' mempertahankan istilah biblis yang dikenal luas. Penanda catatan kaki ditempatkan dalam teks utama sesuai urutan pembahasannya.
