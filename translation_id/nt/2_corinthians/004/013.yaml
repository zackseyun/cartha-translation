  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: id
  text: Namun, karena kami memiliki roh iman yang sama[a], sesuai dengan yang tertulis, “Aku percaya, sebab itu aku berbicara,” kami pun percaya, sebab itu kami pun berbicara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh iman yang sama,” jika πνεῦμα dipahami sebagai sebutan bagi Roh Kudus, bukan sebagai semangat atau kecenderungan batin bersama yang dipenuhi iman.
    reason: alternative_reading
  - marker: b
    text: Paulus mengutip Mazmur 116:10 (115:1 dalam Septuaginta), dan menyejajarkan iman serta perkataannya sendiri dengan kesaksian pemazmur.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Namun, karena kami memiliki
  rationale: Partisip kini ἔχοντες menghubungkan keadaan ini dengan verba utama; dalam bahasa Indonesia, bentuk kausal eksplisit menghasilkan kalimat yang alami dalam konteks tanpa mengubah hubungan argumentatifnya. δέ menyatakan peralihan atau kontras ringan dan diterjemahkan “Namun”.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: roh iman yang sama
  rationale: Ungkapan ini secara paling langsung menunjuk pada semangat atau kecenderungan batin yang sama, yang ditandai oleh iman, selaras dengan kutipan mazmur. Huruf kecil mempertahankan bacaan utama tanpa menutup kemungkinan rujukan kepada Roh Kudus.
- source_word: κατὰ τὸ γεγραμμένον
  choice: sesuai dengan yang tertulis
  rationale: Rumus ini memperkenalkan kutipan Kitab Suci. Pilihan tersebut mempertahankan gagasan kesesuaian dengan teks tertulis dan tetap wajar dalam bahasa Indonesia modern.
- source_word: Ἐπίστευσα
  choice: Aku percaya
  rationale: Aoristus πιστεύω dalam kutipan diterjemahkan secara langsung dengan “percaya”, sekaligus mempertahankan hubungan leksikal dengan πιστεύομεν dalam klausa berikutnya.
- source_word: διὸ ἐλάλησα
  choice: sebab itu aku berbicara
  rationale: διό menyatakan akibat atau kesimpulan, sedangkan λαλέω berarti berbicara. “Sebab itu” terdengar alami dan mempertahankan alur logis kutipan.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: kami pun percaya
  rationale: Pronomina eksplisit ἡμεῖς dan καί menekankan kesejajaran antara Paulus beserta rekan-rekannya dan pemazmur. “Kami pun” menyampaikan penekanan tersebut secara idiomatis.
- source_word: διὸ καὶ λαλοῦμεν
  choice: sebab itu kami pun berbicara
  rationale: 'Terjemahan ini mempertahankan kesejajaran retoris dengan kutipan: percaya menghasilkan berbicara, baik bagi pemazmur maupun bagi Paulus dan rekan-rekannya.'
theological_decisions:
- issue: Apakah πνεῦμα menunjuk kepada Roh Kudus atau kepada semangat/kecenderungan batin yang ditandai oleh iman
  choice: roh iman yang sama
  alternative: Roh iman yang sama, yakni Roh Kudus sebagai sumber atau pemberi iman
  rationale: Konteks langsung mengaitkan ungkapan itu dengan kesaksian pemazmur, “Aku percaya, sebab itu aku berbicara,” sehingga bacaan tentang semangat iman bersama paling alami. Namun, bentuk Yunani tidak meniadakan kemungkinan rujukan kepada Roh Kudus; karena itu kemungkinan tersebut dicatat dalam catatan kaki.
- issue: Hubungan iman dan perkataan dalam kutipan serta penerapannya
  choice: Mempertahankan pola sejajar “percaya—sebab itu berbicara”
  alternative: Memparafrasakan berbicara sebagai pemberitaan Injil secara khusus
  rationale: λαλέω sendiri hanya menyatakan tindakan berbicara. Konteks dapat mengarah pada kesaksian atau pemberitaan Paulus, tetapi terjemahan utama tidak mempersempit makna yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kami” dipertahankan sesuai bentuk jamak Yunani dan konteks Paulus bersama rekan-rekan pelayanannya. “Berbicara” dipilih daripada bentuk yang lebih khusus seperti “memberitakan” agar keluasan makna λαλέω tetap terjaga.
