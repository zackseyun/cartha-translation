  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: id
  text: Sebab Allah, yang berfirman, “Terang akan bersinar dari kegelapan,”[a] telah bersinar di dalam hati kita untuk menerangi kita dengan pengetahuan tentang kemuliaan Allah pada wajah Mesias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perkataan ini menggemakan Kejadian 1:3 dan memakai gambaran terang penciptaan untuk karya Allah yang menyatakan diri-Nya dalam hati manusia.
    reason: cross_reference
  - marker: b
    text: Ungkapan Yunani “pada wajah Mesias” juga dapat dipahami secara lebih idiomatis sebagai “dalam diri Kristus”. Yunani Χριστοῦ secara tradisional diterjemahkan “Kristus”, tetapi berarti “Mesias” atau “Yang Diurapi”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, klausa ini memberikan dasar bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan argumentatif itu secara wajar dalam bahasa Indonesia.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Allah, yang telah berfirman
  rationale: Partisipel berartikel diterjemahkan secara alami sebagai klausa relatif. “Berfirman” sesuai untuk perkataan ilahi dan bentuk perfektif menampilkan tindakan yang telah terjadi.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Dari dalam kegelapan terang akan bersinar
  rationale: Terjemahan ini mempertahankan ἐκ sebagai gerak atau asal dari dalam kegelapan, bentuk futur λάμψει, dan gema bahasa penciptaan.
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: telah bersinar di dalam hati kita
  rationale: λάμπω digunakan secara intransitif, sehingga “bersinar” lebih tepat daripada parafrasa kausatif. “Hati” mempertahankan metafora alkitabiah bagi batin manusia.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: untuk menerangi pengetahuan
  rationale: Ungkapan tujuan πρὸς φωτισμόν disampaikan secara verbal agar alami dalam bahasa Indonesia, sementara hubungan dengan “pengetahuan” tetap dipertahankan tanpa menambah objek yang tidak tersurat.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: tentang kemuliaan Allah
  rationale: 'Genitif ini dipahami sebagai isi pengetahuan: pengetahuan mengenai kemuliaan Allah. Bentuk ini lebih alami daripada rangkaian nomina abstrak yang kaku.'
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: pada wajah Mesias
  rationale: πρόσωπον paling konkret berarti “wajah”, dan citra wajah sesuai dengan konteks terang serta kemuliaan. Χριστός diterjemahkan sebagai gelar “Mesias”.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός secara leksikal berarti Yang Diurapi dan di sini tetap memiliki daya sebagai gelar. “Kristus” dicatat sebagai padanan tradisional.
- issue: Makna ἐν προσώπῳ Χριστοῦ
  choice: pada wajah Mesias
  alternative: dalam diri Kristus
  rationale: Terjemahan konkret mempertahankan citra terang dan kemuliaan yang tampak pada wajah, tanpa menutup kemungkinan bahwa ungkapan itu secara idiomatis menunjuk kepada pribadi Mesias.
- issue: Hubungan φωτισμός dengan γνῶσις
  choice: untuk menerangi pengetahuan
  alternative: untuk memberikan terang pengetahuan
  rationale: Bentuk verbal membuat tujuan tindakan Allah jelas dan tetap menjaga ungkapan Paulus yang padat; alternatif mempertahankan struktur nominal tetapi kurang alami dan dapat menyiratkan bahwa “pengetahuan” sendiri adalah terang.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur argumentatif serta citra kegelapan, terang, hati, kemuliaan, dan wajah dipertahankan. Abstraksi Yunani pada πρὸς φωτισμόν dibuat sedikit lebih verbal agar mudah dipahami tanpa menghilangkan ketegangan semantisnya.
