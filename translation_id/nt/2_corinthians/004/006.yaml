    rationale: Frasa “dari dalam” menambahkan penekanan bahwa terang berasal dari bagian interior kegelapan. Teks Yunani hanya memakai ἐκ σκότους, sehingga “dari kegelapan” lebih dekat dan lebih alami.
  - severity: medium
    issue: “untuk menerangi pengetahuan” untuk πρὸς φωτισμὸν τῆς γνώσεως
    rationale: Secara Indonesia, frasa ini menjadikan “pengetahuan” objek yang diterangi dan mengaburkan fungsi genitif sebagai isi/ranah pengetahuan. “Untuk menerangi kita dengan pengetahuan tentang ...” menyampaikan pencerahan ilahi dalam hati dan isi pengetahuan tanpa mengubah pokok makna.
  - severity: low
    issue: Catatan b menyebut “Secara harfiah, ‘pada wajah Mesias’” meskipun itulah teks utama
    rationale: Keterangan ini redundan dan dapat membingungkan. Catatan sebaiknya langsung menjelaskan kemungkinan idiomatis alternatif serta padanan tradisional bagi Χριστοῦ.
