revisions:
- from: Sebab Allah, yang telah berfirman, “Dari dalam kegelapan terang akan bersinar,”[a] telah bersinar di dalam hati kita untuk menerangi pengetahuan tentang kemuliaan Allah pada wajah Mesias.[b]
  to: Sebab Allah, yang berfirman, “Terang akan bersinar dari kegelapan,”[a] telah bersinar di dalam hati kita untuk menerangi kita dengan pengetahuan tentang kemuliaan Allah pada wajah Mesias.[b]
  rationale: Revisi menghilangkan tambahan nuansa pada ἐκ, memperbaiki hubungan antara φωτισμός dan γνῶσις dalam bahasa Indonesia, serta merapikan catatan tanpa menghapus alternatif yang relevan. Citra konkret kemuliaan Allah pada wajah Mesias dan penggunaan “Mesias” sebagai gelar dipertahankan.
