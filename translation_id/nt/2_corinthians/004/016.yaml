id: 2CO.4.16
reference: 2 Corinthians 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: id
  text: Karena itu, kami tidak tawar hati. Namun, sekalipun manusia lahiriah kami makin merosot[a], manusia batiniah kami diperbarui dari hari ke hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “manusia kami yang di luar” dan “manusia kami yang di dalam.” Kata Yunani yang berarti “manusia” dipakai secara representatif untuk mempertentangkan kehidupan lahiriah dan batiniah.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: οὐκ ἐγκακοῦμεν
  choice: kami tidak tawar hati
  rationale: Ungkapan ini menyampaikan bahwa Paulus dan rekan-rekannya tidak kehilangan keberanian atau menjadi putus asa.
- source_word: ἀλλ’ εἰ καὶ
  choice: Namun, sekalipun
  rationale: Mempertahankan hubungan pertentangan sekaligus nuansa konsesif terhadap kenyataan yang diakui.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: manusia lahiriah kami
  rationale: Mempertahankan bentuk tunggal dan kontras antropologis yang disengaja dengan 'manusia batiniah', tanpa membatasinya secara eksplisit hanya pada tubuh.
- source_word: διαφθείρεται
  choice: makin merosot
  rationale: Mengungkapkan proses kemunduran atau kerusakan yang sedang berlangsung, bukan pemusnahan seketika.
- source_word: ὁ ἔσω ἡμῶν
  choice: manusia batiniah kami
  rationale: Melengkapi elipsis Yunani berdasarkan pasangan yang jelas dengan 'manusia lahiriah' dan mempertahankan kesejajaran istilah Paulus.
- source_word: ἀνακαινοῦται
  choice: diperbarui
  rationale: Bentuk pasif menyatakan bahwa pembaruan dialami oleh manusia batiniah; konteks dan ungkapan waktu menunjukkan proses berkelanjutan.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: dari hari ke hari
  rationale: Padanan idiomatis yang menyatakan pembaruan yang terus berulang setiap hari.
theological_decisions:
- issue: Kontras antara ὁ ἔξω ἄνθρωπος dan ὁ ἔσω
  choice: manusia lahiriah / manusia batiniah
  alternative: diri lahiriah / diri batiniah; manusia yang di luar / manusia yang di dalam
  rationale: Pilihan ini mempertahankan kontras Paulus dan bentuk manusia yang representatif tanpa memasukkan skema dualisme tubuh-jiwa yang tidak dijabarkan oleh ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ungkapan 'tawar hati' tetap umum dipahami serta cocok dengan nada Paulus; pasangan 'manusia lahiriah/batiniah' mempertahankan gema istilah sumber tanpa penjelasan teologis berlebihan.
