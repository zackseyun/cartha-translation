  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: id
  text: Namun, harta ini kami miliki dalam bejana-bejana tanah liat[a], supaya kuasa yang luar biasa itu berasal dari Allah dan bukan dari kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam wadah-wadah tembikar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: Namun, ... kami miliki
  rationale: δὲ menandai kontras atau peralihan dari konteks sebelumnya, sedangkan ἔχομεν adalah pernyataan kini tentang kepemilikan. Susunan ini alami dalam bahasa Indonesia.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: harta ini
  rationale: Mempertahankan metafora dan demonstrativa yang menunjuk kembali kepada terang atau kabar yang dibahas dalam konteks tanpa menjelaskannya secara berlebihan.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: dalam bejana-bejana tanah liat
  rationale: ὀστράκινος berarti terbuat dari tanah liat atau tembikar, dan σκεῦος berarti wadah atau bejana. Pilihan ini mempertahankan citra wadah yang sederhana dan rapuh.
- source_word: ἵνα
  choice: supaya nyata bahwa
  rationale: Mengungkapkan tujuan atau hasil secara alami dalam bahasa Indonesia; kata 'nyata' membuat hubungan predikatif yang tersirat dapat dipahami tanpa mengubah pokok klaim.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: kuasa yang luar biasa itu
  rationale: ὑπερβολή menyatakan taraf yang melampaui ukuran biasa. Bentuk ini alami dan tetap membawa gagasan keunggulan luar biasa dari kuasa tersebut.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: berasal dari Allah, bukan dari kami
  rationale: Genitif τοῦ θεοῦ dalam konteks kontras dengan ἐξ ἡμῶν paling wajar dipahami sebagai kepunyaan atau sumber; 'berasal dari' memperjelas kontras sumber yang dinyatakan secara eksplisit pada bagian kedua.
theological_decisions:
- issue: Makna metafora 'harta' dan 'bejana-bejana tanah liat'
  choice: Metafora dipertahankan tanpa mengidentifikasi harta sebagai Injil atau bejana sebagai tubuh maupun kelemahan manusia dalam teks utama.
  alternative: Memperluasnya menjadi 'harta Injil ini' dan 'tubuh kami yang rapuh'.
  rationale: Konteks membantu menafsirkan metafora, tetapi ayat ini sendiri tidak menjabarkannya; penerjemahan tidak boleh menutup keluasan metafora tersebut.
- issue: Daya klausa ἵνα
  choice: 'Diterjemahkan sebagai tujuan yang sekaligus mengarah pada hasil: ''supaya nyata bahwa''.'
  alternative: 'Murni tujuan: ''supaya ... adalah''; atau murni hasil: ''sehingga terbukti bahwa''.'
  rationale: ἵνα dapat mencakup nuansa tujuan dan hasil. Ungkapan Indonesia yang dipilih menjaga maksud penyingkapan sumber kuasa tanpa menetapkan salah satu nuansa secara terlalu kaku.
- issue: Hubungan kuasa dengan Allah
  choice: Kuasa itu dinyatakan berasal dari Allah dan bukan dari para pelayan manusia.
  alternative: Kuasa itu hanya disebut 'milik Allah'.
  rationale: τοῦ θεοῦ secara formal adalah genitif, tetapi kontras langsung dengan ἐξ ἡμῶν menonjolkan sumber. Catatan kaki menjaga alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bejana' mempertahankan citra metaforis dengan jelas, sedangkan catatan kaki memberi padanan yang lebih konkret. Struktur kalimat dibuat alami bagi pembaca umum tanpa menguraikan metafora secara doktrinal.
