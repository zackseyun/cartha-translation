revisions:
- from: Namun, harta ini kami miliki dalam bejana-bejana tanah liat[a], supaya nyata bahwa kuasa yang luar biasa itu berasal dari Allah, bukan dari kami.[b]
  to: Namun, harta ini kami miliki dalam bejana-bejana tanah liat[a], supaya kuasa yang luar biasa itu berasal dari Allah dan bukan dari kami.
  rationale: The revision removes the added notion of disclosure in “nyata bahwa” and renders the Greek predicate directly. It preserves the metaphor, the purpose/result nuance of ἵνα, and the contrast that the extraordinary power is from God rather than from the human ministers. The remaining footnote supplies a genuine lexical alternative for ὀστρακίνοις σκεύεσιν.
