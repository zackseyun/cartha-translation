  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: id
  text: Sebab penderitaan ringan kita yang hanya sesaat ini sedang menghasilkan bagi kita bobot kemuliaan kekal yang jauh melampaui segala perbandingan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara sangat luar biasa”; secara harfiah, bahasa Yunani berbunyi “menurut kelampauan menuju kelampauan,” suatu ungkapan yang menyatakan ukuran yang luar biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: yang hanya sesaat ini
  rationale: Mengungkapkan bahwa penderitaan itu berlangsung singkat dan bersifat sementara, sekaligus mempertajam kontras dengan αἰώνιον, “kekal”.
- source_word: ἐλαφρὸν
  choice: ringan
  rationale: Mempertahankan antitesis metaforis dengan βάρος, “bobot,” tanpa menyatakan bahwa penderitaan itu mudah atau tidak menyakitkan.
- source_word: θλίψεως
  choice: penderitaan
  rationale: Dalam konteks Paulus, kata ini menunjuk pada tekanan, kesusahan, atau penderitaan. “Penderitaan” alami dalam bahasa Indonesia modern dan cukup luas untuk konteks ini.
- source_word: ἡμῶν
  choice: kita
  rationale: Menandai penderitaan yang dialami Paulus dan rekan-rekannya; bentuk inklusif “kita” sesuai dengan padanan ἡμῖν kemudian dalam ayat.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: jauh melampaui segala perbandingan
  rationale: Ungkapan Yunani yang digandakan ini menyatakan taraf yang luar biasa dan melampaui ukuran. Padanan ini alami sambil mempertahankan daya intensifnya.
- source_word: αἰώνιον
  choice: kekal
  rationale: Menunjukkan keberlangsungan yang tidak berakhir dan membentuk kontras langsung dengan penderitaan yang hanya sesaat.
- source_word: βάρος
  choice: bobot
  rationale: Mempertahankan permainan retoris antara “ringan” dan “bobot.” “Bobot” juga menghindari kesan negatif yang dapat timbul dari kata “beban.”
- source_word: δόξης
  choice: kemuliaan
  rationale: Menerjemahkan bentuk genitif secara alami melalui frasa “kemuliaan ... yang bobotnya,” sambil mempertahankan gagasan “bobot kemuliaan” dalam susunan Indonesia yang lebih mudah dipahami.
- source_word: κατεργάζεται
  choice: sedang menghasilkan
  rationale: Menyampaikan proses yang tengah berlangsung dan hasil efektif yang dinyatakan oleh verba kini tersebut.
- source_word: ἡμῖν
  choice: bagi kita
  rationale: 'Memahami datif sebagai penerima manfaat: kemuliaan itu dihasilkan bagi mereka, bukan secara eksplisit sebagai perubahan batin di dalam mereka.'
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: penderitaan ringan yang hanya sesaat ini
  rationale: Menyusun unsur-unsur frasa Yunani secara alami dalam bahasa Indonesia, dengan tetap mempertahankan sifat ringan, sementara, dan kedekatan deiktisnya.
theological_decisions:
- issue: Hubungan antara penderitaan sekarang dan kemuliaan kekal
  choice: Terjemahan menyatakan bahwa penderitaan sekarang menghasilkan kemuliaan kekal bagi orang percaya, tanpa menjelaskan mekanismenya sebagai jasa yang memperoleh keselamatan.
  alternative: Penderitaan memperoleh kemuliaan berdasarkan jasa manusia, atau hanya menghasilkan kedewasaan rohani pada masa kini.
  rationale: Kontras antara “sesaat” dan “kekal” menunjuk pada hasil eskatologis. Namun, teks sendiri tidak merumuskan teori jasa; karena itu ungkapan kausal yang kuat dipertahankan tanpa tambahan doktrinal.
- issue: Metafora ringan dan bobot
  choice: Mempertahankan pasangan “ringan” dan “bobot.”
  alternative: Menghaluskan pasangan itu menjadi “kecil” dan “kemuliaan besar.”
  rationale: Antitesis metaforis merupakan unsur utama retorika Paulus dan menyampaikan ketidak sebandingan antara penderitaan kini dan kemuliaan kekal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “kemuliaan kekal yang bobotnya” dipilih agar metafora ringan–bobot tetap jelas tanpa menghasilkan frasa Indonesia yang terlalu kaku. Penanda catatan kaki [a] ditempatkan sesudah ungkapan yang dijelaskannya.
