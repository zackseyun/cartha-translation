source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: id
  text: Sebab kami yang hidup ini terus-menerus diserahkan kepada kematian karena Yesus[a], supaya kehidupan Yesus juga dinyatakan dalam daging kami yang fana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi Yesus” atau “oleh karena Yesus.”
    reason: lexical_alternative
  - marker: b
    text: “Daging” di sini menunjuk pada keberadaan jasmani yang dapat mati, bukan pada tabiat berdosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: terus-menerus
  rationale: Menyatakan keadaan berulang atau berkelanjutan; lebih alami dalam konteks penderitaan yang senantiasa dialami daripada 'selalu'.
- source_word: γάρ
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya.
- source_word: οἱ ζῶντες
  choice: kami yang hidup ini
  rationale: Mempertahankan bentuk partisip substantival serta kontras yang disengaja antara mereka yang hidup dan kematian.
- source_word: εἰς θάνατον
  choice: kepada kematian
  rationale: Bersama verba pasif παραδιδόμεθα, frasa ini menunjukkan arah atau akibat penyerahan, yaitu menghadapi kematian.
- source_word: παραδιδόμεθα
  choice: diserahkan
  rationale: Mempertahankan bentuk pasif kini dan nuansa seseorang diserahkan kepada bahaya atau kuasa kematian.
- source_word: διὰ Ἰησοῦν
  choice: karena Yesus
  rationale: διά dengan akusatif terutama menyatakan sebab; ungkapan ini tetap membuka nuansa bahwa penderitaan terjadi karena hubungan dan kesetiaan kepada Yesus.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil tanpa memutuskan secara kaku di antara keduanya.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan kesejajaran dengan pengalaman kematian yang berhubungan dengan Yesus.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: kehidupan Yesus
  rationale: '''Kehidupan'' lebih jelas daripada ''hidup'' sebagai nomina dalam bahasa Indonesia dan mempertahankan konstruksi genitif tanpa menentukan lebih jauh apakah yang terutama dimaksud ialah hidup kebangkitan atau hidup yang tampak dalam pelayanan.'
- source_word: φανερωθῇ
  choice: dinyatakan
  rationale: Mempertahankan bentuk pasif dan gagasan bahwa kehidupan Yesus menjadi nyata atau terlihat, tanpa menambahkan pelaku.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: dalam tubuh kami yang fana
  rationale: Dalam konteks ini σάρξ menunjuk pada keberadaan jasmani yang rentan terhadap kematian. 'Tubuh' menyampaikan makna itu secara alami dalam bahasa Indonesia dan menghindari salah paham etis dari 'daging'.
theological_decisions:
- issue: Makna σάρξ dalam konteks Paulus
  choice: tubuh
  alternative: daging
  rationale: Kata sifat 'fana' dan konteks ancaman kematian menunjukkan keberadaan jasmani yang dapat mati, bukan kecenderungan berdosa. 'Tubuh' merupakan padanan Indonesia yang paling jelas, sedangkan catatan kaki mempertahankan informasi bahwa teks Yunani memakai σάρξ.
- issue: Nuansa διὰ Ἰησοῦν
  choice: karena Yesus
  alternative: demi Yesus
  rationale: διά dengan akusatif secara langsung dapat menandai sebab. Terjemahan utama tidak mengubahnya menjadi tujuan atau jasa, sementara catatan kaki mencatat nuansa idiomatis yang mungkin dalam konteks kesetiaan kepada Yesus.
- issue: Tujuan atau hasil dalam ἵνα
  choice: supaya
  alternative: sehingga
  rationale: '''Supaya'' mempertahankan daya telis ἵνα, tetapi konteks juga memungkinkan hasil; ambiguitas ini tidak dijabarkan secara dogmatis.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Terus-menerus diserahkan' mempertahankan aspek berlangsung dari bentuk kini pasif. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
