source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: id
  text: Sebaliknya, kami telah menolak hal-hal tersembunyi yang memalukan. Kami tidak hidup dengan kelicikan dan tidak memalsukan firman Allah,[a] melainkan melalui penyataan kebenaran secara terbuka, kami memperkenalkan diri kami kepada hati nurani setiap orang di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mencampuradukkan firman Allah secara curang.” Kata Yunaninya dapat menggambarkan tindakan merusak sesuatu dengan mencampur atau mengubahnya demi menipu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: kami telah meninggalkan
  rationale: Mengungkapkan penolakan tegas terhadap praktik-praktik tersebut dalam bahasa Indonesia yang alami; konteks menjadikannya lebih kuat daripada sekadar berhenti.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: hal-hal tersembunyi yang memalukan
  rationale: Mempertahankan gagasan praktik rahasia yang bercirikan aib tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: Kami tidak hidup dengan kelicikan
  rationale: Metafora Yunani 'berjalan' menyatakan cara hidup atau perilaku; 'hidup' menyampaikan maknanya dengan wajar, sementara 'kelicikan' mempertahankan unsur kecerdikan yang tidak jujur.
- source_word: δολοῦντες
  choice: memalsukan
  rationale: Menyatakan tindakan merusak atau mengubah secara curang. Catatan kaki mempertahankan gambaran alternatif tentang mencampur atau mengencerkan sesuatu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Padanan baku dan luas yang tidak mempersempit λόγος hanya menjadi teks tertulis atau hanya pemberitaan lisan.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: dengan menyatakan kebenaran secara terbuka
  rationale: φανέρωσις menunjuk pada penyingkapan atau tindakan membuat sesuatu nyata; pilihan ini tidak membatasinya pada pewartaan verbal saja.
- source_word: συνιστάνοντες ἑαυτούς
  choice: kami menunjukkan ... bahwa kami layak dipercaya
  rationale: Menyampaikan arti memperkenalkan atau membuktikan diri secara baik dalam idiom Indonesia yang alami, tanpa menyiratkan pujian diri yang sombong.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: kepada hati nurani setiap orang
  rationale: Mempertahankan daya distributif πᾶσαν dan gagasan bahwa perilaku Paulus diajukan kepada penilaian moral manusia.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Padanan langsung yang mempertahankan Allah sebagai saksi dan hakim atas pelayanan Paulus.
theological_decisions:
- issue: Ruang lingkup pertentangan antara pelayanan yang menipu dan pelayanan yang benar
  choice: Ayat ini menggambarkan keterbukaan etis dalam perilaku dan penyampaian pelayanan rasuli.
  alternative: Membacanya hanya sebagai larangan manipulasi retoris, atau sebagai rumusan teknis menyeluruh tentang segala penggunaan Kitab Suci.
  rationale: Konteks langsung membahas perilaku serta pelayanan rasuli. Terjemahan mempertahankan cakupan itu tanpa memasukkan doktrin teknis yang tidak dinyatakan secara eksplisit.
- issue: Makna φανέρωσις sebagai bentuk penyataan kebenaran
  choice: Tidak dibatasi pada pemberitaan lisan, tetapi mencakup penyingkapan kebenaran secara terbuka.
  alternative: Menerjemahkannya secara khusus sebagai 'pemberitaan kebenaran'.
  rationale: Nomina Yunani menekankan tindakan membuat nyata atau tampak; bentuk dan sarana penyingkapan tidak dirinci.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur partisipial Yunani dipecah menjadi beberapa klausa agar jelas bagi pembaca umum. Ungkapan metaforis 'berjalan' diterjemahkan sebagai 'hidup', sedangkan ambiguitas φανέρωσις dan nuansa δολοῦντες dijaga melalui pilihan utama dan catatan kaki.
