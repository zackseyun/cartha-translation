  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: id
  text: Karena itu, karena kami memiliki pelayanan ini—sebagaimana kami telah menerima kemurahan—kami tidak tawar hati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Karena itu
  rationale: Menandai kesimpulan yang bertumpu pada uraian sebelumnya dan mempertahankan hubungan logis teks Yunani.
- source_word: τὴν διακονίαν ταύτην
  choice: pelayanan ini
  rationale: Istilah 'pelayanan' wajar dalam bahasa Indonesia dan cukup luas untuk mencakup tugas pelayanan yang dibahas Paulus.
- source_word: καθὼς ἠλεήθημεν
  choice: oleh kemurahan yang telah kami terima
  rationale: Mengungkapkan bahwa kepemilikan pelayanan itu terkait dengan tindakan belas kasih Allah; bentuk pasif Yunani tetap tercermin tanpa menambahkan pelaku yang tidak disebut eksplisit.
- source_word: οὐκ ἐγκακοῦμεν
  choice: kami tidak tawar hati
  rationale: Ungkapan ini secara alami menyampaikan makna tidak menjadi lemah, putus asa, atau menyerah dalam menjalankan pelayanan.
theological_decisions:
- issue: Hubungan καθὼς ἠλεήθημεν dengan kepemilikan pelayanan
  choice: Menempatkan frasa kemurahan sebelum klausa 'kami memiliki pelayanan ini' untuk menyatakan dasar atau cara penerimaan pelayanan tanpa menyebut Allah secara eksplisit.
  alternative: kami memiliki pelayanan ini, sebagaimana kami telah menerima kemurahan
  rationale: Dalam konteks ini καθὼς dapat menunjukkan bahwa pelayanan dimiliki berdasarkan kemurahan yang diterima. Susunan yang dipilih lebih alami dalam bahasa Indonesia sekaligus mempertahankan hubungan tersebut dan tidak memaksakan pelaku bagi verba pasif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan kaitan antara kemurahan, pelayanan, dan keteguhan hati.
