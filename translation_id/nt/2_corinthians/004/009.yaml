translation:
  language: id
  text: dianiaya, tetapi tidak ditinggalkan; dijatuhkan[a], tetapi tidak dibinasakan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dirobohkan” atau “dicampakkan ke bawah.”
