lexical_decisions:
- source_word: διωκόμενοι
  choice: dianiaya
  rationale: Dalam konteks Paulus, kata ini menunjuk pada pengejaran atau penindasan oleh pihak yang memusuhi; “dianiaya” merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἐγκαταλειπόμενοι
  choice: ditinggalkan
  rationale: Padanan ini mempertahankan arti dibiarkan atau ditelantarkan tanpa memakai ungkapan yang kuno atau menambahkan pelaku yang tidak disebutkan dalam teks.
- source_word: καταβαλλόμενοι
  choice: dijatuhkan
  rationale: Kata Yunani ini secara harfiah menggambarkan tindakan menjatuhkan atau merobohkan; bentuk pasif “dijatuhkan” mempertahankan gambaran konflik dan kesejajaran gramatikal.
- source_word: ἀπολλύμενοι
  choice: dibinasakan
  rationale: Dalam kontras dengan “dijatuhkan”, kata ini menunjuk pada kehancuran atau kebinasaan yang tuntas; “dibinasakan” menghasilkan antitesis yang kuat dan wajar.
- source_word: ἀλλ’ οὐκ
  choice: tetapi tidak
  rationale: Ungkapan ini mempertahankan susunan retoris berupa dua kontras yang seimbang.
theological_decisions:
- issue: Apakah ἐγκαταλειπόμενοι perlu diterjemahkan dengan istilah yang lebih sarat resonansi teologis atau dengan bahasa modern yang langsung
  choice: ditinggalkan
  alternative: ditelantarkan
  rationale: “Ditinggalkan” menyampaikan bahwa Paulus dan rekan-rekannya tidak dibiarkan sendirian, tetapi tidak secara eksplisit menambahkan Allah sebagai pelaku ataupun memaksakan suatu alusi teologis tertentu.
- issue: Apakah ἀπολλύμενοι menyatakan proses menuju kebinasaan atau hasil kehancuran
  choice: dibinasakan
  alternative: binasa
  rationale: Bentuk pasif dan kontrasnya dengan “dijatuhkan” mendukung gambaran bahwa mereka dapat dirobohkan, tetapi tidak sampai dihancurkan sepenuhnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama singkat dan seimbang. Partisip pasif Yunani dipertahankan melalui bentuk pasif Indonesia. Tanda baca mengikuti sifat ayat ini sebagai bagian dari rangkaian kalimat.
