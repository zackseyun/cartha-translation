translation:
  language: id
  text: Sebab aku bersaksi bahwa mereka memberi sesuai dengan kemampuan mereka, bahkan melampaui kemampuan mereka, atas kemauan mereka sendiri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dengan sukarela" atau "atas prakarsa sendiri."
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks ini ὅτι memperkenalkan penjelasan yang mendukung pernyataan sebelumnya; "Sebab" menyatakan fungsi wacana itu secara alami.
- source_word: κατὰ δύναμιν
  choice: sesuai dengan kemampuan mereka
  rationale: κατά dengan δύναμις menyatakan ukuran atau batas; pilihan ini mempertahankan gagasan memberi sebanding dengan kapasitas mereka.
- source_word: μαρτυρῶ
  choice: aku bersaksi
  rationale: Bentuk kini ini merupakan sisipan yang tegas dan menyampaikan kesaksian pribadi Paulus secara langsung.
- source_word: καὶ παρὰ δύναμιν
  choice: bahkan melampaui kemampuan mereka
  rationale: παρά dengan akusatif menyatakan tindakan yang melampaui batas; "bahkan" menampilkan penegasan retoris sekaligus kontras dengan frasa sebelumnya.
- source_word: αὐθαίρετοι
  choice: atas kemauan sendiri
  rationale: Adjektiva ini menunjukkan tindakan yang berasal dari prakarsa sendiri dan tanpa paksaan; ungkapan Indonesia ini alami serta mempertahankan nuansa sukarela.
theological_decisions:
- issue: Kata kerja tersirat bersama αὐθαίρετοι
  choice: Memasok "mereka memberi" dari konteks untuk menghasilkan kalimat lengkap tentang pemberian sukarela jemaat-jemaat Makedonia.
  alternative: Menerjemahkan secara lebih harfiah tetapi kurang alami sebagai "dengan sukarela" tanpa mengulangi tindakan memberi.
  rationale: Teks Yunani bersifat eliptis, dan αὐθαίρετοι berdiri secara predikatif setelah sisipan "aku bersaksi". Konteks ayat 2–4 dengan jelas menunjukkan bahwa tindakan yang dimaksud adalah memberi, sehingga pemasokan ini tidak menambahkan gagasan teologis baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina "aku" mempertahankan suara pribadi Paulus. Pengulangan "kemampuan mereka" menjaga kesejajaran retoris sumber; tanda koma menandai "aku bersaksi" sebagai sisipan.
