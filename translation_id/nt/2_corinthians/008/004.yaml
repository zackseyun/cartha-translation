  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: id
  text: Mereka sangat memohon kepada kami untuk memperoleh anugerah dan keikutsertaan dalam pelayanan kepada orang-orang kudus—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hak istimewa untuk turut mengambil bagian dalam pelayanan kepada orang-orang kudus.”
    reason: Alternatif ini mengungkapkan nuansa kontekstual χάρις sebagai hak istimewa dan κοινωνία sebagai partisipasi.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: dengan sangat mendesak
  rationale: μετά dengan genitif menyatakan cara yang menyertai tindakan, sedangkan παράκλησις di sini berarti desakan atau permohonan sungguh-sungguh, bukan penghiburan.
- source_word: δεόμενοι ἡμῶν
  choice: mereka memohon kepada kami
  rationale: δέομαι menyatakan permohonan yang kuat dan rendah hati; bentuk genitif ἡμῶν menunjukkan pihak yang dimintai.
- source_word: τὴν χάριν
  choice: anugerah
  rationale: χάρις dapat berarti anugerah, kemurahan, atau hak istimewa. 'Anugerah' mempertahankan kosakata khas Paulus sekaligus memungkinkan nuansa kesempatan yang dikaruniakan untuk memberi.
- source_word: τὴν κοινωνίαν
  choice: keikutsertaan
  rationale: Dalam konteks pengumpulan bantuan, κοινωνία terutama menunjuk pada partisipasi bersama. 'Keikutsertaan' lebih jelas dalam bahasa Indonesia modern daripada 'persekutuan' untuk tindakan praktis ini, tanpa menghilangkan unsur kebersamaan.
- source_word: τῆς διακονίας
  choice: dalam pelayanan
  rationale: διακονία menunjuk pada pelayanan praktis berupa bantuan. 'Pelayanan' mempertahankan cara Paulus memberi martabat rohani pada tindakan tersebut.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: kepada orang-orang kudus
  rationale: Frasa berpreposisi ini menerangkan arah atau penerima manfaat pelayanan. 'Orang-orang kudus' mempertahankan sebutan Paulus bagi umat percaya dan tidak menyiratkan kelompok elite yang dikanonisasi.
theological_decisions:
- issue: Hubungan antara χάριν dan κοινωνίαν
  choice: anugerah dan keikutsertaan
  alternative: hak istimewa untuk turut mengambil bagian
  rationale: Teks Yunani menghubungkan dua nomina dengan καί. Teks utama mempertahankan keduanya dan tidak secara diam-diam meleburkannya menjadi satu gagasan, sedangkan catatan memberi padanan idiomatis yang mungkin jika keduanya dipahami sebagai gagasan yang erat terkait.
- issue: Penerjemahan ἅγιοι
  choice: orang-orang kudus
  alternative: umat Allah yang kudus
  rationale: Sebutan Paulus bagi umat percaya dipertahankan secara konsisten tanpa membatasi rujukannya pada golongan khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk fragmen yang berlanjut dari ayat sebelumnya serta tanda pisah pada akhir ayat. Penanda catatan kaki [a] dicantumkan dalam teks utama.
