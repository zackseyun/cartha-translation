  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: id
  text: Pada saat ini, kelebihan kalian adalah untuk memenuhi kekurangan mereka, supaya kelebihan mereka juga dapat memenuhi kekurangan kalian, agar ada kesetaraan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan” atau “keseimbangan”; istilah Yunani di sini menunjuk pada pemenuhan kebutuhan secara timbal balik dan seimbang, bukan bahwa setiap orang harus mempunyai milik dalam jumlah yang persis sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Pada waktu sekarang
  rationale: Ungkapan ini menunjuk pada keadaan atau kesempatan yang sedang berlangsung, bukan sekadar waktu kronologis; terjemahan ini alami dan tetap mempertahankan nuansa situasionalnya.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: kelebihan kalian
  rationale: περίσσευμα berarti apa yang dimiliki melampaui kebutuhan, khususnya kecukupan materi dalam konteks pengumpulan bantuan. 'Kelebihan' mempertahankan gagasan surplus tanpa membatasinya hanya pada uang; 'kalian' memperjelas bahwa pronomina Yunani berbentuk jamak.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: untuk memenuhi kekurangan mereka
  rationale: εἰς menyatakan arah atau tujuan, sedangkan ὑστέρημα menunjuk pada apa yang kurang atau dibutuhkan. Penambahan 'memenuhi' membuat hubungan tujuan itu wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: ἵνα καὶ
  choice: supaya ... juga
  rationale: ἵνα memperkenalkan tujuan, dan καί menegaskan hubungan timbal balik; keduanya dipertahankan secara eksplisit.
- source_word: τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: kelebihan mereka juga dapat memenuhi kekurangan kalian
  rationale: Susunan ini mempertahankan kesejajaran timbal balik antara kelebihan dan kekurangan kedua pihak. 'Dapat' mencerminkan nuansa klausa tujuan dengan verba subjungtif tanpa menyatakan bahwa keadaan itu pasti sudah terjadi.
- source_word: ὅπως γένηται ἰσότης
  choice: sehingga tercipta kesetaraan
  rationale: ἰσότης secara langsung berarti kesetaraan atau keadilan yang seimbang. Dalam konteks ini, frasa tersebut menunjuk pada keseimbangan yang lahir dari saling memenuhi kebutuhan, bukan keharusan memiliki jumlah harta yang persis sama.
theological_decisions:
- issue: Makna ἰσότης dalam ajakan Paulus untuk memberi
  choice: kesetaraan melalui pemenuhan kebutuhan secara timbal balik
  alternative: keadilan atau keseimbangan
  rationale: Konteks membahas kelebihan satu pihak yang memenuhi kekurangan pihak lain dan kemungkinan timbal baliknya. 'Kesetaraan' mempertahankan padanan leksikal langsung, sedangkan catatan kaki menjelaskan bahwa yang dimaksud bukan kepemilikan yang seragam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. Pronomina 'kalian' dipakai untuk memperjelas bentuk jamak ὑμῶν. Kesejajaran 'kelebihan—kekurangan' dipertahankan untuk menampilkan struktur timbal balik ayat.
