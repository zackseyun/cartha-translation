  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: id
  text: Saudara-saudara[a], kami memberitahukan kepada kalian tentang anugerah Allah[b] yang telah diberikan di dalam jemaat-jemaat di Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saudara-saudari”; bahasa Yunani memakai bentuk maskulin “saudara-saudara”, yang sering digunakan untuk menyapa seluruh jemaat.
    reason: lexical_alternative
  - marker: b
    text: “Anugerah Allah” dapat menunjuk sekaligus pada kemurahan Allah dan pada kemurahan hati yang dihasilkan oleh anugerah itu di tengah jemaat-jemaat Makedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: kami memberitahukan
  rationale: Bentuk ini mempertahankan makna ‘membuat diketahui’ atau ‘menyampaikan’ serta nuansa surat yang agak formal, tanpa memperluasnya menjadi ‘kami ingin agar kalian tahu’.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan ringan, bukan pertentangan kuat. Dalam bahasa Indonesia, peralihan tersebut dapat dipahami dari awal pokok baru tanpa menambahkan kata temporal seperti ‘sekarang’.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Kata ganti orang kedua jamak ini menunjuk seluruh jemaat; ‘kalian’ menyatakan bentuk jamaknya dengan jelas dalam bahasa Indonesia modern.
- source_word: ἀδελφοί
  choice: Saudara-saudara
  rationale: Sapaan maskulin jamak dipertahankan dalam bentuk sapaan Indonesia yang lazim. Dalam pemakaian Paulus, sapaan ini sering mencakup seluruh anggota jemaat, sebagaimana dijelaskan dalam catatan kaki.
- source_word: χάριν
  choice: anugerah
  rationale: '‘Anugerah’ mempertahankan keluasan istilah teologis χάρις: kemurahan Allah sekaligus karya nyata yang dihasilkan oleh kemurahan itu, tanpa mempersempitnya menjadi ‘sumbangan’.'
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Frasa genitif diterjemahkan secara wajar sebagai ‘anugerah Allah’, dengan tetap membiarkan hubungan kepunyaan atau sumber tersirat sebagaimana dalam bahasa Yunani.
- source_word: τὴν δεδομένην
  choice: yang telah diberikan
  rationale: Bentuk pasif perfek diterjemahkan dengan ‘telah diberikan’, yang menyatakan tindakan yang sudah terjadi dan hasilnya tetap nyata.
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: di tengah jemaat-jemaat
  rationale: ‘Di tengah’ menyampaikan lingkup tempat anugerah Allah bekerja di antara komunitas-komunitas tersebut; ‘jemaat-jemaat’ merupakan padanan kontekstual yang wajar bagi ἐκκλησίαις.
- source_word: τῆς Μακεδονίας
  choice: di Makedonia
  rationale: Dalam bahasa Indonesia, lokasi ‘di Makedonia’ secara alami menjelaskan jemaat-jemaat yang berada di wilayah tersebut.
theological_decisions:
- issue: Makna ‘anugerah Allah’ dalam konteks
  choice: Karya kemurahan Allah yang aktif di tengah jemaat-jemaat Makedonia dan terwujud dalam kemurahan hati mereka
  alternative: Anugerah ilahi secara umum, atau secara lebih sempit sumbangan kasih itu sendiri
  rationale: Terjemahan ‘anugerah Allah’ mempertahankan ketegangan makna antara sumber ilahi dan hasil konkretnya dalam pemberian yang murah hati, tanpa menyamakan istilah itu hanya dengan sumbangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang bermartabat dan mudah dipahami. ‘Kalian’ dipakai untuk memperjelas bahwa ὑμῖν berbentuk jamak; ‘Saudara-saudara’ dipertahankan sebagai sapaan utama dengan cakupan inklusif dijelaskan dalam catatan kaki.
