id: 2CO.8.2
reference: 2 Corinthians 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: id
  text: Sebab, di tengah ujian berat berupa kesusahan, sukacita mereka yang melimpah dan kemiskinan mereka yang amat dalam[a] telah meluap menjadi kekayaan kemurahan hati mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemiskinan mereka sampai ke dasarnya” atau “kemiskinan mereka yang sangat parah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kekayaan ketulusan mereka.” Kata Yunani yang dipakai juga dapat berarti “kesederhanaan” atau “kebulatan hati”, tetapi di sini kemungkinan besar menunjuk pada kemurahan dalam memberi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: di tengah ujian berat berupa kesusahan
  rationale: Ungkapan ini mempertahankan gagasan δοκιμή sebagai ujian dan θλῖψις sebagai kesusahan atau tekanan berat. Kata “berupa” menyampaikan hubungan genitif tanpa menentukan secara berlebihan apakah kesusahan itu isi, keadaan, atau penyebab ujian.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: sukacita mereka yang melimpah
  rationale: Pilihan ini menyampaikan περισσεία sebagai kelimpahan dan sekaligus membentuk kaitan alami dengan ἐπερίσσευσεν, “telah meluap”.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: kemiskinan mereka yang amat dalam
  rationale: κατὰ βάθους memperkuat πτωχεία dengan citra kedalaman. “Amat dalam” mempertahankan metafora itu dalam bahasa Indonesia yang wajar.
- source_word: ἐπερίσσευσεν
  choice: telah meluap
  rationale: Kata kerja ini menggambarkan kelimpahan yang menghasilkan sesuatu, bukan sekadar keadaan berlimpah. “Meluap menjadi” juga mempertahankan daya gerak menuju frasa εἰς.
- source_word: εἰς τὸ πλοῦτος
  choice: menjadi kekayaan
  rationale: εἰς di sini menyatakan hasil. “Menjadi kekayaan” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “ke dalam kekayaan”, sambil tetap mempertahankan hasil paradoksal dari sukacita dan kemiskinan mereka.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: kemurahan hati mereka
  rationale: Dalam konteks pengumpulan bantuan materi, ἁπλότης menunjuk pada pemberian yang tulus dan tanpa pamrih, sehingga “kemurahan hati” menyampaikan maksud kontekstualnya dengan jelas.
theological_decisions:
- issue: Makna ἁπλότης dalam konteks pemberian materi
  choice: kemurahan hati
  alternative: ketulusan, kesederhanaan, atau kebulatan hati
  rationale: Konteks langsungnya membahas pemberian bagi orang-orang kudus, sehingga nuansa kemurahan dalam memberi paling mungkin. Catatan kaki tetap mempertahankan rentang makna kata Yunani itu agar unsur ketulusan dan kebulatan hati tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur paradoks antara sukacita yang melimpah, kemiskinan yang dalam, dan kekayaan kemurahan hati dipertahankan. Konjungsi “Sebab” menerjemahkan ὅτι dan menjaga hubungan ayat ini dengan konteks sebelumnya.
