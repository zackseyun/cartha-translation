  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: id
  text: 'Dalam hal ini aku memberikan pendapatku: hal ini bermanfaat bagi kamu, yang sejak tahun lalu telah mulai bukan hanya melakukannya, tetapi juga menghendakinya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersedia melakukannya.” Kata Yunani membedakan kemauan dari pelaksanaan nyata.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: pendapatku
  rationale: Dalam konteks ini kata tersebut menunjuk pada pertimbangan atau anjuran yang dipikirkan dengan matang, bukan perintah langsung. 'Pendapatku' alami dalam bahasa Indonesia dan mempertahankan perbedaan itu.
- source_word: ἐν τούτῳ
  choice: dalam hal ini
  rationale: Frasa ini menunjuk pada perkara yang sedang dibahas, yakni pengumpulan bantuan, tanpa menambahkan keterangan yang tidak tersurat dalam ayat.
- source_word: συμφέρει
  choice: bermanfaat
  rationale: Kata kerja ini menyatakan apa yang berguna atau menguntungkan bagi penerima; 'bermanfaat' jelas dan tidak memberi kesan keuntungan komersial.
- source_word: οἵτινες
  choice: yang
  rationale: Kata penghubung relatif ini memperkenalkan ciri jemaat Korintus sebagai pihak yang sudah memulai sebelumnya.
- source_word: τὸ ποιῆσαι
  choice: melakukannya
  rationale: Infinitif ini menunjuk pada pelaksanaan nyata dari usaha pengumpulan yang sudah diketahui dari konteks.
- source_word: τὸ θέλειν
  choice: menghendakinya
  rationale: '''Menghendaki'' mempertahankan unsur kemauan atau kehendak batin dan paralelnya dengan tindakan nyata, tanpa menyamakannya dengan sekadar perasaan ingin.'
- source_word: προενήρξασθε
  choice: telah lebih dahulu memulai
  rationale: Bentuk majemuk ini mengandung gagasan memulai sebelumnya; ungkapan ini mempertahankan nuansa tersebut meskipun keterangan waktu juga disebutkan.
- source_word: ἀπὸ πέρυσι
  choice: sejak tahun lalu
  rationale: Terjemahan ini mencerminkan titik awal pada tahun sebelumnya. Dalam bahasa Indonesia, 'sejak tahun lalu' paling alami bersama kata 'memulai', tanpa harus menegaskan bahwa tindakannya berlangsung tanpa putus.
theological_decisions:
- issue: Daya perkataan Paulus dalam kaitannya dengan kewenangan rasuli
  choice: Paulus memberikan pendapat atau anjuran yang telah dipertimbangkan, bukan merumuskannya sebagai perintah langsung.
  alternative: Paulus mengeluarkan perintah yang mengikat secara langsung.
  rationale: Konteks dekat membedakan perintah dari γνώμη (2Kor. 8:8, 10). 'Pendapatku' mempertahankan kesungguhan nasihat pastoral Paulus tanpa mengubahnya menjadi perintah eksplisit.
- issue: Urutan kehendak dan tindakan
  choice: 'Mempertahankan urutan teks Yunani: bukan hanya melakukan, tetapi juga menghendaki.'
  alternative: Membalik urutannya menjadi bukan hanya menghendaki, tetapi juga melakukan demi urutan yang dianggap lebih logis.
  rationale: Urutan Yunani sengaja dipertahankan karena dapat menonjolkan keistimewaan bahwa jemaat bukan saja mulai bertindak, melainkan juga memiliki kemauan. Ketegangan retorisnya tidak perlu diselaraskan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pastoral dan bermartabat. Kata ganti 'aku' dan 'kamu' mengikuti gaya wacana surat yang langsung; susunan kalimat dipertahankan cukup dekat dengan teks Yunani sambil tetap wajar dibaca.
