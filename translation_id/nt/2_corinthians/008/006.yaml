  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: id
  text: Karena itu, kami mendorong Titus agar, sebagaimana ia telah memulainya sebelumnya, ia juga menyelesaikan tindakan kemurahan hati ini di tengah kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayanan kemurahan hati ini”; secara lebih harfiah, “anugerah ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: mendesak
  rationale: Dalam konteks ini Paulus mendorong Titus untuk bertindak. 'Mendesak' menyampaikan daya dorong παρακαλέω secara alami tanpa terdengar terlalu formal.
- source_word: καθὼς προενήρξατο
  choice: sebagaimana sebelumnya ia telah memulainya
  rationale: Bentuk majemuk προενήρξατο menyatakan bahwa tindakan itu telah dimulai lebih dahulu; susunan ini mempertahankan nuansa waktunya.
- source_word: ἐπιτελέσῃ
  choice: ia juga menyelesaikan
  rationale: Subjungtif sesudah ἵνα menyatakan tujuan dari desakan tersebut, sedangkan ἐπιτελέω berarti membawa pekerjaan yang telah dimulai sampai selesai.
- source_word: εἰς ὑμᾶς
  choice: di antara kalian
  rationale: Frasa ini menunjuk pada pekerjaan Titus yang dilaksanakan di tengah jemaat Korintus. 'Di antara kalian' mempertahankan arah dan lingkup kegiatannya.
- source_word: τὴν χάριν ταύτην
  choice: karya anugerah ini
  rationale: Dalam konteks pengumpulan bantuan, χάρις menunjuk pada suatu tindakan atau pelayanan konkret yang dipandang sebagai ungkapan anugerah. Pilihan ini mempertahankan bahasa anugerah sekaligus memperjelas wujud praktisnya.
theological_decisions:
- issue: Makna χάρις dalam konteks pengumpulan bantuan
  choice: karya anugerah
  alternative: anugerah ini; pemberian ini
  rationale: Konteks 2 Korintus 8 menunjukkan pengumpulan bantuan yang sedang diselesaikan. 'Karya anugerah' mempertahankan ketegangan antara anugerah sebagai konsep teologis dan tindakan kemurahan hati yang konkret, tanpa menyamakannya hanya dengan uang atau pemberian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai agar bentuk jamak ὑμᾶς terlihat jelas. Susunan kalimat mengikuti hubungan tujuan dalam bahasa Yunani tetapi tetap alami dalam bahasa Indonesia.
