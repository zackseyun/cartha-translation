  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: id
  text: Bukan hanya itu, ia juga dipilih oleh jemaat-jemaat[a] sebagai rekan seperjalanan kami dalam pelayanan pemberian ini[b], yang kami kelola demi kemuliaan Tuhan sendiri[c] dan untuk menyatakan kerelaan kami—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditunjuk oleh jemaat-jemaat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama kasih karunia ini”; dalam konteks ini, ungkapan tersebut mengacu pada suatu pemberian yang ditangani dalam pelayanan.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Yunani ini juga dapat dipahami sebagai “kemuliaan Tuhannya” atau “kemuliaan Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: dipilih
  rationale: Partisip ini menyatakan bahwa jemaat-jemaat menunjuk atau memilih orang tersebut. 'Dipilih' alami dalam bahasa Indonesia dan tidak memastikan tata cara pemungutan suara tertentu.
- source_word: ἐκκλησιῶν
  choice: jemaat-jemaat
  rationale: Dalam pemakaian Paulus, kata ini merujuk pada persekutuan-persekutuan umat Kristen; 'jemaat-jemaat' merupakan padanan Indonesia yang lazim.
- source_word: συνέκδημος
  choice: rekan seperjalanan
  rationale: Istilah ini menunjuk kepada orang yang bepergian bersama orang lain dan secara alami diterjemahkan 'rekan seperjalanan'.
- source_word: χάριτι
  choice: pemberian kasih karunia
  rationale: Dalam konteks pengumpulan bantuan, χάρις menunjuk pada pemberian nyata yang lahir dari kasih karunia. Ungkapan ini mempertahankan baik aspek konkret maupun nuansa anugerahnya.
- source_word: διακονουμένῃ
  choice: kami layani
  rationale: Bentuk pasif Yunani menggambarkan pemberian yang pelayanannya dilaksanakan oleh Paulus dan rekan-rekannya. Bentuk aktif alami dalam bahasa Indonesia dengan pelaku yang sama.
- source_word: πρὸς
  choice: demi ... dan untuk menunjukkan
  rationale: Di sini πρὸς menyatakan tujuan atau hasil yang diarahkan, sehingga 'demi' dan 'untuk menunjukkan' mengungkapkan hubungan tujuan secara alami.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: Tuhan sendiri
  rationale: αὐτοῦ dipahami secara intensif bersama τοῦ κυρίου, memberi penekanan pada Tuhan, sambil mencatat kemungkinan lain dalam catatan kaki.
- source_word: δόξαν
  choice: kemuliaan
  rationale: '''Kemuliaan'' adalah padanan baku dan sesuai dengan bobot teologis δόξα.'
- source_word: προθυμίαν
  choice: kesungguhan
  rationale: Kata ini menyatakan kerelaan, kesiapan, atau semangat yang sungguh-sungguh. 'Kesungguhan' sesuai dengan konteks tanpa menambahkan objek tindakan yang tidak dinyatakan.
theological_decisions:
- issue: Fungsi αὐτοῦ dalam πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: kemuliaan Tuhan sendiri
  alternative: kemuliaan Tuhannya; kemuliaan Tuhan
  rationale: Susunan Yunani ringkas dan dapat dipahami dengan lebih dari satu cara. Pembacaan intensif menghasilkan bahasa Indonesia yang alami dan mempertahankan penekanan pada Tuhan, sementara kemungkinan posesif dicatat agar ambiguitas asli tidak disembunyikan.
- issue: Hubungan προθυμίαν ἡμῶν dengan tujuan pelayanan pemberian
  choice: untuk menunjukkan kesungguhan kami
  alternative: demi kesungguhan kami; dan kesungguhan kami
  rationale: Frasa tersebut berada di bawah cakupan πρὸς dan menyatakan tujuan yang sejajar dengan kemuliaan Tuhan. Penambahan 'menunjukkan' membuat maksud hubungan itu wajar dalam bahasa Indonesia tanpa menentukan bentuk tindakan lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan tanda pisah penutup karena ayat ini berlanjut secara sintaksis ke ayat berikutnya. 'Jemaat-jemaat' dipilih daripada 'gereja-gereja' agar jelas menunjuk komunitas umat, dan semua alternatif yang benar-benar penting ditempatkan dalam catatan kaki.
