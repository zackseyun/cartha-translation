revisions:
- from: Bukan hanya itu, ia juga dipilih oleh jemaat-jemaat[a] untuk menjadi rekan seperjalanan kami dalam mengurus pemberian kasih karunia ini[b], yang kami layani demi kemuliaan Tuhan sendiri[c] dan untuk menunjukkan kesungguhan kami—
  to: Bukan hanya itu, ia juga dipilih oleh jemaat-jemaat[a] sebagai rekan seperjalanan kami dalam pelayanan pemberian ini[b], yang kami kelola demi kemuliaan Tuhan sendiri[c] dan untuk menyatakan kerelaan kami—
  rationale: Revisi mengganti ungkapan yang membuat pemberian tampak sebagai objek yang “dilayani” dengan konstruksi yang menyatakan bahwa pemberian itu dikelola dalam suatu pelayanan. Kata “kerelaan” menggantikan “kesungguhan” agar lebih dekat dengan προθυμία, dan “menyatakan” mempertahankan relasi tujuan secara idiomatis tanpa memperluas makna secara material. Catatan kaki b dibatasi pada informasi yang didukung oleh ayat dan konteks langsung.
