  - severity: low
    issue: «Berdasarkan apa yang kamu miliki» kurang dekat dengan fungsi ἐκ.
    rationale: ἐκ τοῦ ἔχειν secara harfiah menunjuk pada apa yang dimiliki sebagai sumber atau sarana yang tersedia. «Dari apa yang kamu miliki» memelihara arah ini, sementara catatan kaki dapat menjelaskan implikasi kesepadanan dengan kemampuan saat ini.
