- from: Namun sekarang, selesaikanlah juga pelaksanaannya[a], supaya sebagaimana ada kesungguhan untuk berkehendak, demikian juga ada penyelesaian berdasarkan apa yang kamu miliki[b].
  to: Namun sekarang, selesaikanlah juga pelaksanaannya[a], supaya sebagaimana ada kerelaan hati untuk melakukannya, demikian juga ada penyelesaian dari apa yang kamu miliki[b].
  rationale: Revisi mengganti ungkapan yang tidak lazim «kesungguhan untuk berkehendak» dengan «kerelaan hati untuk melakukannya», yang menyampaikan προθυμία dan tetap membedakan kesediaan dari penyelesaian. Frasa akhir diubah menjadi «dari apa yang kamu miliki» untuk mencerminkan ἐκ τοῦ ἔχειν secara lebih langsung. Kesejajaran «sebagaimana ... demikian juga ...», imperatif, dan catatan kaki tetap dipertahankan.
