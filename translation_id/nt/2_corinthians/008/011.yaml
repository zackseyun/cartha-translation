  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: id
  text: Namun sekarang, selesaikanlah juga pelaksanaannya[a], supaya sebagaimana ada kerelaan hati untuk melakukannya, demikian juga ada penyelesaian dari apa yang kamu miliki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tuntaskanlah juga pelaksanaannya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari apa yang kamu miliki”; maksudnya, sesuai dengan kemampuanmu sekarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Namun sekarang
  rationale: Ungkapan ini menandai peralihan dari niat sebelumnya kepada tindakan pada masa kini, sambil mempertahankan nuansa pertentangan ringan dari δέ.
- source_word: τὸ ποιῆσαι
  choice: pelaksanaannya
  rationale: Infinitif berartikel menunjuk pada tindakan konkret yang sebelumnya telah direncanakan, yaitu pelaksanaan pengumpulan bantuan.
- source_word: ἐπιτελέσατε
  choice: selesaikanlah
  rationale: Bentuk imperatif ini memerintahkan agar tindakan yang telah dimulai dibawa sampai tuntas.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: kesungguhan untuk berkehendak
  rationale: Ungkapan ini mempertahankan baik kesiapan atau kesungguhan hati (προθυμία) maupun unsur kehendak (θέλειν), tanpa menggantinya dengan tindakan itu sendiri.
- source_word: τὸ ἐπιτελέσαι
  choice: ada penyelesaian
  rationale: Bentuk nominal dipertahankan untuk mencerminkan kesejajaran antara kesungguhan kehendak dan tuntasnya pelaksanaan.
- source_word: ἐκ τοῦ ἔχειν
  choice: berdasarkan apa yang kamu miliki
  rationale: Terjemahan ini menyampaikan bahwa penyelesaian pemberian harus berasal dari dan sepadan dengan sumber daya yang tersedia, tanpa menyiratkan tuntutan melampaui kemampuan.
theological_decisions:
- issue: Pemberian menurut sumber daya yang tersedia
  choice: Nas ini menyerukan agar jemaat menuntaskan pengumpulan bantuan berdasarkan apa yang mereka miliki sekarang.
  alternative: Seruan umum untuk menuntaskan setiap niat baik tanpa mempertimbangkan kemampuan yang tersedia.
  rationale: Konteks langsung membahas sumbangan yang telah dijanjikan jemaat Korintus, sedangkan ἐκ τοῦ ἔχειν membatasi pelaksanaannya pada apa yang tersedia bagi mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perbandingan “sebagaimana … demikian juga …” dipertahankan untuk mencerminkan kesejajaran dalam teks Yunani; frasa “kesungguhan untuk berkehendak” sengaja agak formal agar perbedaan antara niat dan pelaksanaan tidak hilang.
