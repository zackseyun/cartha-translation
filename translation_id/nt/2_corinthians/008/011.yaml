  source_fidelity: 'Struktur utama dan makna sumber telah dipertahankan: imperatif untuk menuntaskan tindakan, perbandingan antara kesediaan sebelumnya dan penyelesaian, serta batasan oleh apa yang tersedia. Namun, «kesungguhan untuk berkehendak» tidak idiomatis dalam bahasa Indonesia modern dan mengaburkan προθυμία sebagai kesiapsediaan/kerelaan yang positif. «Berdasarkan» juga sedikit menggeser ἐκ dari sumber yang tersedia ke dasar atau kriteria.'
  naturalness: Perlu perbaikan terbatas. «Kerelaan hati untuk melakukannya» adalah ungkapan baku dan alami yang menyampaikan kesiapsediaan yang dimaksud tanpa mengidentikkan niat dengan pelaksanaannya. «Dari apa yang kamu miliki» mempertahankan ungkapan sumber secara dekat dan jelas.
  terminology: «Pelaksanaan», «kerelaan hati», dan «penyelesaian» sesuai dengan ragam Indonesia baku dan konteks pengumpulan bantuan. Tidak ada istilah teologis yang memerlukan penyeragaman khusus.
  issues:
