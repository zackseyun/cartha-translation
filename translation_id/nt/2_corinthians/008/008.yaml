  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: id
  text: Aku mengatakan ini bukan sebagai perintah, melainkan dengan kesungguhan orang lain aku juga menguji ketulusan kasihmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menguji” juga dapat diterjemahkan “membuktikan” atau “menguji keaslian”; “kesungguhan” juga dapat berarti “semangat” atau “kerajinan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: perintah
  rationale: Dalam frasa οὐ κατ’ ἐπιταγὴν λέγω, kata ini menunjuk pada perintah yang berwenang; “perintah” alami dalam bahasa Indonesia dan mempertahankan kontras dengan pemberian sukarela.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: melalui kesungguhan orang-orang lain
  rationale: διά dengan genitif menyatakan sarana atau perantaraan, sedangkan ἑτέρων tidak diperjelas menjadi orang Makedonia agar cakupan teks sumber tetap terpelihara.
- source_word: σπουδή
  choice: kesungguhan
  rationale: Dalam konteks kemurahan hati, kata ini menyatakan semangat yang serius atau kegairahan; “kesungguhan” menjaga unsur ketekunan dan ketulusan tanpa mereduksinya menjadi sekadar kecepatan.
- source_word: ἀγάπη
  choice: kasih
  rationale: “Kasih” merupakan padanan baku dan tepat bagi ἀγάπη; di sini kasih itu dinyatakan melalui kesediaan memberi.
- source_word: γνήσιον
  choice: ketulusan
  rationale: Adjektiva yang disubstantifkan ini menunjuk pada sifat yang sejati atau autentik. “Ketulusan kasihmu” terdengar alami dan mempertahankan fokus pada keaslian kasih.
- source_word: δοκιμάζων
  choice: aku juga menguji
  rationale: Partisipel kini menyatakan tindakan atau tujuan yang menyertai λέγω. Bentuk verba finit alami dalam bahasa Indonesia, sedangkan “menguji” mempertahankan gagasan penilaian untuk mengetahui atau membuktikan keaslian.
- source_word: καί
  choice: juga
  rationale: 'Kata ini paling wajar dipahami secara aditif: melalui kesungguhan orang lain, Paulus juga menguji ketulusan kasih jemaat Korintus.'
- source_word: ὑμετέρας
  choice: -mu dalam kasihmu
  rationale: Bentuk posesif ini menunjuk kepada jemaat Korintus secara kolektif; akhiran “-mu” mengikuti sapaan tunggal kolektif yang lazim dalam terjemahan Alkitab Indonesia.
theological_decisions:
- issue: Sikap retoris Paulus terhadap pemberian
  choice: Paulus secara jelas mengatakan bahwa ia tidak berbicara sebagai pemberi perintah, tetapi menguji ketulusan kasih jemaat melalui kesungguhan orang lain.
  alternative: Menganggap Paulus hanya memperhalus sebuah perintah tanpa sungguh-sungguh meniadakan daya perintahnya.
  rationale: Frasa οὐ κατ’ ἐπιταγὴν λέγω secara langsung menyangkal bahwa perkataan ini disampaikan sebagai perintah. Terjemahan mempertahankan ketegangan antara kewenangan rasuli dan tanggapan sukarela yang digerakkan oleh kasih.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kontras “bukan ... melainkan ...” serta ambiguitas wajar pada σπουδή dan δοκιμάζων. Pronomina “Aku” dan “-mu” mengikuti gaya sapaan langsung yang lazim dalam teks Alkitab Indonesia.
