review_pass:
  verdict: revise
  source_fidelity: Struktur pencegahan dalam στελλόμενοι ... μή serta sasaran celaan dalam μωμήσηται dipertahankan dengan baik. Namun, ἁδρότης dalam konteks pengumpulan bantuan lebih tepat dan jelas diterjemahkan sebagai “sumbangan besar” daripada “persembahan berlimpah”; yang terakhir terdengar seperti persembahan ritual dan kurang lazim untuk dana bantuan yang sedang dikelola.
  naturalness: Kalimat revisi tetap baku dan mengalir. “Sumbangan besar ini, yang kami kelola” jelas menghubungkan sifat besar sumbangan itu dengan frasa relatif Yunani tanpa ambiguitas yang tidak perlu.
  terminology: “Sumbangan” netral dan sesuai untuk kontribusi bantuan; tidak menambahkan konotasi ibadah pada “persembahan.” “Kelola” secara wajar menyampaikan διακονουμένῃ dalam konteks administrasi koleksi.
  issues:
  - severity: medium
    issue: “Persembahan berlimpah” kurang tepat dan kurang idiomatis untuk ἁδρότης dalam konteks dana bantuan.
    rationale: Ἁδρότης mengacu pada kelimpahan/besarnya kontribusi, bukan pada tindakan atau objek persembahan liturgis. “Sumbangan besar” mempertahankan kemungkinan makna ‘bounty/abundant contribution’ dan lebih natural dalam bahasa Indonesia modern.
  revised_text: Kami mengambil tindakan pencegahan ini agar tidak seorang pun menyalahkan kami sehubungan dengan sumbangan besar[a] ini, yang kami kelola.
