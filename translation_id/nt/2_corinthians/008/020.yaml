translation:
  language: id
  text: Kami mengambil tindakan pencegahan ini agar tidak seorang pun menyalahkan kami sehubungan dengan sumbangan besar[a] ini, yang kami kelola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sumbangan yang murah hati” atau “sumbangan yang berlimpah.” Kata Yunani ini dapat menunjuk pada sumbangan yang besar atau diberikan dengan murah hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Kami mengambil tindakan pencegahan ini
  rationale: Bentuk partisipel medial στελλόμενοι menyatakan langkah berjaga-jaga untuk menghindari masalah; ungkapan ini menyampaikan nuansa preventif secara alami dalam bahasa Indonesia.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: supaya jangan ada seorang pun yang menyalahkan kami
  rationale: μή dengan bentuk subjungtif menyatakan tujuan pencegahan, sedangkan μωμάομαι berarti menyalahkan atau mencari kesalahan.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: sehubungan dengan persembahan berlimpah yang ... ini
  rationale: ἐν menunjukkan perkara yang dapat menimbulkan tuduhan, dan ἁδρότης menunjuk pada kelimpahan atau kemurahan sumbangan dalam konteks pengumpulan bantuan.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: yang kami kelola
  rationale: Dalam konteks dana bantuan, διακονέω mengacu pada pelayanan berupa pengurusan atau penatalaksanaan sumbangan; 'kelola' jelas dan wajar tanpa memberi warna gerejawi yang tidak perlu.
theological_decisions:
- issue: Sifat kekhawatiran Paulus dalam menangani pengumpulan bantuan
  choice: Menonjolkan tindakan pencegahan agar tidak ada tuduhan dalam pengelolaan persembahan.
  alternative: Memahaminya hanya sebagai pengaturan perjalanan tanpa penekanan pada pertanggungjawaban.
  rationale: Teks Yunani secara langsung menghubungkan tindakan Paulus dengan pencegahan celaan mengenai sumbangan yang mereka kelola, sehingga dimensi pertanggungjawaban praktis perlu dipertahankan tanpa memperluasnya menjadi pernyataan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Persembahan' dipakai sesuai konteks sumbangan bantuan, sedangkan 'kelola' menyampaikan administrasi dana secara lugas.
