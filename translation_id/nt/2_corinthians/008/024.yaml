revisions:
- from: Karena itu, tunjukkanlah kepada mereka, di hadapan jemaat-jemaat[b], bukti[a] kasih kalian dan bukti bahwa kebanggaan kami atas kalian memang beralasan.
  to: Karena itu, tunjukkanlah kepada mereka, di hadapan jemaat-jemaat[b], bukti[a] kasih kalian dan kebanggaan kami atas kalian.
  rationale: Revisi mempertahankan satu “bukti” yang secara sintaktis mencakup “kasih kalian” dan “kebanggaan kami atas kalian,” sebagaimana ἔνδειξιν tunggal dalam teks Yunani. Ini menghindari tambahan interpretatif sambil tetap menghasilkan kalimat Indonesia yang jelas dan wajar. Posisi penanda catatan kaki dipertahankan pada istilah yang diterangkannya, dan catatan kaki diperbaiki agar benar-benar menawarkan alternatif leksikal.
