id: 2CO.8.24
reference: 2 Corinthians 8:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: id
  text: Karena itu, tunjukkanlah kepada mereka, di hadapan jemaat-jemaat[b], bukti[a] kasih kalian dan kebanggaan kami atas kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demonstrasi” atau “tanda nyata” kasih kalian dan kebanggaan kami atas kalian.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menunjuk pada tindakan terbuka di hadapan para wakil jemaat-jemaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau dorongan yang bertolak dari uraian sebelumnya, dengan ragam bahasa yang wajar dan bermartabat.
- source_word: ἔνδειξιν
  choice: bukti
  rationale: ἔνδειξις menunjuk pada sesuatu yang memperlihatkan atau menjadikan suatu kenyataan nyata. 'Bukti' ringkas dan alami dalam konteks tindakan konkret jemaat Korintus.
- source_word: ἀγάπης
  choice: kasih
  rationale: Padanan baku bagi ἀγάπη; di sini kasih bersifat praktis dan dinyatakan melalui tindakan.
- source_word: καυχήσεως
  choice: kebanggaan
  rationale: καύχησις dapat berarti tindakan atau dasar untuk berbangga. 'Kebanggaan' mempertahankan daya retorisnya tanpa memberi kesan menyombongkan diri yang selalu negatif.
- source_word: ὑπὲρ ὑμῶν
  choice: atas kalian
  rationale: Dalam kaitannya dengan καύχησις, frasa ini menyatakan bahwa orang-orang Korintus adalah pokok kebanggaan Paulus dan rekan-rekannya.
- source_word: εἰς αὐτοὺς
  choice: kepada mereka
  rationale: Mengacu kepada saudara-saudara atau para utusan jemaat dalam konteks dekat dan mempertahankan arah tindakan kepada mereka.
- source_word: ἐνδεικνύμενοι
  choice: tunjukkanlah
  rationale: Partisip ini berfungsi sebagai desakan atau perintah dalam konteks. 'Tunjukkanlah' menyampaikan tindakan membuat sesuatu nyata.
- source_word: εἰς πρόσωπον
  choice: di hadapan
  rationale: Ungkapan ini berarti dalam kehadiran atau secara terbuka di depan pihak lain, bukan secara harfiah 'ke wajah'.
- source_word: τῶν ἐκκλησιῶν
  choice: jemaat-jemaat
  rationale: Dalam pemakaian Paulus, ἐκκλησίαι menunjuk pada komunitas-komunitas orang percaya setempat. Bentuk jamak sumber dipertahankan.
theological_decisions:
- issue: Makna 'bukti ... kebanggaan kami' (ἔνδειξιν ... ἡμῶν καυχήσεως)
  choice: bukti bahwa kebanggaan kami atas kalian memang beralasan
  alternative: bukti kasih kalian dan kebanggaan kami atas kalian
  rationale: Susunan genitif Yunani sangat padat. Ungkapan Indonesia yang lebih eksplisit menjelaskan bahwa tindakan jemaat Korintus akan membuktikan dasar kebanggaan Paulus, bukan bahwa kebanggaan itu sendiri merupakan benda yang diperlihatkan. Ini mempertahankan maksud retoris tanpa menambahkan pokok ajaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada nasihat apostolik yang tegas tetapi wajar. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; 'jemaat-jemaat' mempertahankan bentuk jamak dan istilah gerejawi yang umum.
