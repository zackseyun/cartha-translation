  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: id
  text: Namun, syukur kepada Allah yang menaruh kepedulian yang sama terhadap kalian dalam hati Titus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Namun, syukur kepada Allah
  rationale: Dalam rumusan ini, χάρις dengan datif τῷ θεῷ menyatakan ucapan syukur, bukan 'anugerah'. δέ menandai peralihan ringan; 'namun' mempertahankan nuansa tersebut tanpa memberi pertentangan yang terlalu tajam.
- source_word: τῷ διδόντι
  choice: yang menaruh
  rationale: δίδωμι secara harfiah berarti 'memberi', tetapi bersama gambaran hati, 'menaruh ... dalam hati' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan tindakan Allah sebagai sumber sikap Titus.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: kesungguhan yang sama
  rationale: σπουδή di sini menunjuk pada kesungguhan atau perhatian yang penuh semangat. 'Kesungguhan' alami dalam bahasa Indonesia dan αὐτήν diterjemahkan secara eksplisit sebagai 'yang sama'.
- source_word: ὑπὲρ ὑμῶν
  choice: terhadap kalian
  rationale: ὑπέρ menyatakan arah perhatian atau kepedulian kepada jemaat Korintus. 'Terhadap kalian' menyatu secara alami dengan 'kesungguhan' dan tidak menambahkan gagasan tindakan penggantian.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: dalam hati Titus
  rationale: Terjemahan ini mempertahankan ἐν ('dalam') serta metafora hati sebagai pusat sikap batin, sambil tetap alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pronomina 'kalian' dipakai karena ὑμῶν berbentuk jamak dan menunjuk kepada jemaat. Tanda koma akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
