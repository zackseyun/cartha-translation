  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: id
  text: Dan bukan seperti yang kami harapkan, melainkan mereka terlebih dahulu menyerahkan diri mereka kepada Tuhan dan kepada kami oleh kehendak Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “oleh kehendak Allah” dapat diterjemahkan “melalui kehendak Allah” atau “sesuai dengan kehendak Allah.” Secara lebih harfiah, bagian awal berbunyi: “dan bukan seperti yang kami harapkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ καθὼς ἠλπίσαμεν
  choice: Bahkan, mereka melakukan lebih daripada yang kami harapkan
  rationale: Secara harfiah, frasa ini berbunyi 'dan bukan seperti yang kami harapkan.' Dalam konteks tindakan jemaat-jemaat Makedonia yang melampaui harapan Paulus, ungkapan alami ini menyampaikan kontras eliptis bahasa Yunani tanpa menghilangkan kemungkinan nuansa 'harapkan' atau 'duga'.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: mereka ... menyerahkan diri
  rationale: Mempertahankan unsur refleksif dan makna persembahan diri secara pribadi, bukan sekadar sumbangan materi. 'Menyerahkan diri' lebih alami dalam bahasa Indonesia daripada 'memberikan diri' dalam konstruksi ini.
- source_word: πρῶτον
  choice: pertama-tama
  rationale: Menandai prioritas, baik urutan maupun kepentingan, tanpa menentukan salah satunya secara mutlak.
- source_word: τῷ κυρίῳ
  choice: kepada Tuhan
  rationale: Menerjemahkan κύριος dengan padanan baku dan bermartabat; datif dinyatakan dengan 'kepada'.
- source_word: καὶ ἡμῖν
  choice: lalu kepada kami
  rationale: Mempertahankan datif kedua yang sejajar, sedangkan 'lalu' membuat urutannya alami dalam bahasa Indonesia dan tetap menempatkannya sesudah penyerahan kepada Tuhan.
- source_word: διὰ θελήματος θεοῦ
  choice: melalui kehendak Allah
  rationale: Mempertahankan bentuk διά dengan genitif dan membiarkan terbuka nuansa sarana, perantaraan, atau kesesuaian dengan kehendak Allah.
theological_decisions:
- issue: Hubungan antara penyerahan diri kepada Tuhan dan kepada para rasul
  choice: Teks menyatakan penyerahan kepada Tuhan terlebih dahulu, kemudian kepada Paulus dan rekan-rekannya.
  alternative: Frasa itu dapat dipahami sebagai pengabdian rangkap tanpa hierarki tegas selain urutan yang ditandai oleh 'pertama-tama'.
  rationale: Urutan datif dan πρῶτον dipertahankan tanpa menambahkan klaim eklesiologis yang tidak dinyatakan teks.
- issue: Makna διὰ θελήματος θεοῦ
  choice: melalui kehendak Allah
  alternative: oleh kehendak Allah; sesuai dengan kehendak Allah
  rationale: Pilihan utama mempertahankan ambiguitas mengenai apakah yang ditekankan ialah perantaraan, daya penggerak, otorisasi, atau kesesuaian dengan kehendak Allah.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kalimat pertama mengungkapkan kontras eliptis Yunani secara idiomatis. Penanda 'lalu' memperjelas alur tanpa menyamakan kedudukan Tuhan dengan para pelayan apostolik. Semua alternatif penting dipertahankan dalam catatan kaki.
