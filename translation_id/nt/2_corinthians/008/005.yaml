  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan penyerahan diri, prioritas kepada Tuhan, penerima kedua ('kami'), dan frasa tentang kehendak Allah. Namun, 'Bahkan, mereka melakukan lebih daripada' menambahkan kata kerja umum ('melakukan') dan menyatakan secara eksplisit gagasan 'lebih daripada' yang hanya tersirat dari kontras Yunani dan konteksnya. Struktur adversatif ἀλλὰ ('melainkan') sebaiknya ditampilkan.
  naturalness: 'Versi revisi memakai struktur Indonesia baku dan alami: ''bukan seperti yang kami harapkan, melainkan ...''. ''Menyerahkan diri mereka'' jelas dan tetap mempertahankan refleksivitas ἑαυτούς.'
  terminology: '''Tuhan'' untuk κύριος dan ''Allah'' untuk θεός sudah tepat. ''Oleh kehendak Allah'' merupakan padanan Indonesia yang lebih idiomatis untuk διὰ θελήματος θεοῦ, sambil membiarkan nuansa sarana, tindakan ilahi, dan kesesuaian tetap terbuka melalui catatan kaki.'
  issues:
  - severity: medium
    issue: Ungkapan pembuka menambahkan 'Bahkan, mereka melakukan lebih daripada'.
    rationale: Teks Yunani berbunyi secara eliptis 'dan bukan seperti yang kami harapkan, melainkan mereka menyerahkan diri mereka ...'. Walaupun konteks mendukung tindakan yang melampaui harapan, kata kerja 'melakukan' dan perbandingan eksplisit 'lebih daripada' tidak dinyatakan secara langsung. Revisi mempertahankan kontras dan verba utama dari sumber.
  - severity: low
    issue: Penanda adversatif ἀλλά tidak diterjemahkan secara eksplisit.
    rationale: '''Melainkan'' diperlukan untuk menyatakan pertentangan yang ditandai ἀλλά dan untuk membuat struktur kalimat Indonesia lebih jelas.'
  - severity: low
    issue: '''Melalui kehendak Allah'' kurang idiomatis dalam posisi akhir kalimat Indonesia.'
    rationale: '''Oleh kehendak Allah'' lebih lazim dan tetap layak bagi διά dengan genitif; alternatif yang menonjolkan kesesuaian dipertahankan dalam catatan kaki.'
  revised_text: Dan bukan seperti yang kami harapkan, melainkan mereka terlebih dahulu menyerahkan diri mereka kepada Tuhan dan kepada kami oleh kehendak Allah.[a]
