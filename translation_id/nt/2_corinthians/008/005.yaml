revisions:
- from: Bahkan, mereka melakukan lebih daripada yang kami harapkan.[a] Mereka pertama-tama menyerahkan diri kepada Tuhan, lalu kepada kami, melalui kehendak Allah.[b]
  to: Dan bukan seperti yang kami harapkan, melainkan mereka terlebih dahulu menyerahkan diri mereka kepada Tuhan dan kepada kami oleh kehendak Allah.[a]
  rationale: 'Revisi menghilangkan perluasan kontekstual yang tidak dinyatakan secara eksplisit, memulihkan kontras ἀλλά dengan ''melainkan'', dan mempertahankan semua unsur sintaksis penting: penyerahan diri, prioritas kepada Tuhan, keterlibatan ''kami'', serta ambiguitas yang terkandung dalam διὰ θελήματος θεοῦ. Catatan kaki digabungkan karena hanya tersisa satu jangkar yang diperlukan.'
