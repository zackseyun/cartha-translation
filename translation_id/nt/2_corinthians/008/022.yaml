  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: id
  text: Kami juga telah mengutus bersama mereka saudara kita, yang sudah berkali-kali kami uji dalam banyak hal dan yang kami dapati bersungguh-sungguh. Namun, sekarang ia jauh lebih bersungguh-sungguh karena kepercayaannya yang besar kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini juga dapat diterjemahkan, “melalui” atau “dengan kepercayaan yang besar kepada kalian.” Pemilik kepercayaan itu tidak dinyatakan secara eksplisit dalam bahasa Yunani. Frasa ini paling wajar menunjuk pada saudara tersebut, tetapi dapat juga dipahami sebagai kepercayaan Paulus dan rekan-rekannya kepada kalian.
    reason: ambiguity
lexical_decisions:
- source_word: συνεπέμψαμεν δὲ αὐτοῖς
  choice: Bersama mereka kami juga telah mengutus
  rationale: Bentuk aoristus menyatakan tindakan pengutusan, sementara unsur σύν- dipertahankan melalui “bersama mereka”. “Telah mengutus” wajar dalam konteks surat dan menunjukkan tindakan yang sudah dilakukan dengan relevansi kini.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: saudara kita
  rationale: Mempertahankan sapaan kekeluargaan komunitas Kristen dan rujukan maskulin tunggal kepada seorang rekan pelayanan yang tidak disebut namanya.
- source_word: ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις
  choice: yang telah berkali-kali kami uji dalam banyak hal
  rationale: “Berkali-kali” menyampaikan πολλάκις dan “dalam banyak hal” menyampaikan keluasan ἐν πολλοῖς; “kami uji” mempertahankan makna pemeriksaan yang membuktikan mutu seseorang.
- source_word: σπουδαῖον ὄντα
  choice: dan terbukti bersungguh-sungguh
  rationale: Konstruksi ini menyatakan hasil pengujian. “Bersungguh-sungguh” mencakup kesungguhan, kerajinan, dan kegairahan tanpa mempersempitnya hanya pada emosi atau kecakapan administratif.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: Sekarang ia jauh lebih bersungguh-sungguh lagi
  rationale: “Jauh lebih” membawa daya penguat πολὺ pada bentuk komparatif σπουδαιότερον, sekaligus mempertahankan perbandingan dengan kesungguhan yang telah terbukti sebelumnya.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: karena kepercayaannya yang besar kepada kalian
  rationale: Datif dipahami secara kausal sebagai alasan meningkatnya kesungguhan saudara itu. “Kepercayaan ... kepada kalian” mengungkapkan arah εἰς ὑμᾶς, sedangkan “kalian” menandai bentuk jamak orang kedua.
theological_decisions:
- issue: Rujukan dan fungsi πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: Kesungguhan saudara yang tidak disebut namanya meningkat karena kepercayaannya yang besar kepada jemaat Korintus.
  alternative: Frasa itu dapat dipahami secara instrumental (“melalui/oleh kepercayaan yang besar”) atau, karena pemilik kepercayaan tidak dinyatakan secara eksplisit, sebagai kepercayaan Paulus dan rekan-rekannya kepada jemaat Korintus.
  rationale: Alur sintaksis paling wajar menghubungkan frasa ini dengan saudara yang sedang dipuji, tetapi bahasa Yunani tidak menyatakan kata ganti kepunyaan secara eksplisit. Catatan kaki mempertahankan ruang bagi nuansa dan kemungkinan rujukan lain tanpa menjadikannya pembacaan utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang hangat dan bermartabat. “Saudara kita” mempertahankan idiom kekeluargaan Kristen; “kalian” dipakai untuk menandai bahwa ὑμᾶς berbentuk jamak. Kalimat dipecah menjadi dua agar hubungan pembuktian dan peningkatan kesungguhan mudah dipahami tanpa mengubah alur gagasan.
