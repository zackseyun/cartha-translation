revisions:
- from: Bersama mereka kami juga telah mengutus saudara kita, yang telah berkali-kali kami uji dalam banyak hal dan terbukti bersungguh-sungguh. Sekarang ia jauh lebih bersungguh-sungguh lagi karena kepercayaannya yang besar kepada kalian.[a]
  to: Kami juga telah mengutus bersama mereka saudara kita, yang sudah berkali-kali kami uji dalam banyak hal dan yang kami dapati bersungguh-sungguh. Namun, sekarang ia jauh lebih bersungguh-sungguh karena kepercayaannya yang besar kepada kalian.[a]
  rationale: Revisi mempertahankan semua unsur leksikal dan hubungan sintaksis ayat, sambil memperbaiki ketepatan representasi partisip 'didapati bersungguh-sungguh' dan menghapus klaim harfiah yang terlalu kuat dari catatan kaki. Catatan tetap menjaga ambiguitas yang relevan mengenai fungsi frasa datif dan pemilik kepercayaan.
