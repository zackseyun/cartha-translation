    issue: Catatan kaki memakai label 'Secara harfiah' untuk 'oleh kepercayaan yang besar kepada kalian.'
    rationale: Bahasa Yunani memakai datif πεποιθήσει, yang dapat bernuansa kausal atau instrumental menurut konteks; 'oleh' bukan terjemahan harfiah yang tunggal. Catatan perlu menyatakan alternatif itu sebagai kemungkinan fungsi frasa, sambil mempertahankan ketidakjelasan pemilik kepercayaan.
  - severity: low
    issue: Frasa 'dan terbukti bersungguh-sungguh' dapat terdengar seolah-olah merupakan simpulan eksplisit yang ditambahkan.
    rationale: Partisip σπουδαῖον ὄντα secara langsung menyatakan bahwa saudara itu didapati sebagai orang yang sungguh-sungguh. Bentuk 'yang kami dapati bersungguh-sungguh' lebih dekat pada konstruksi sumber dan tetap alami.
