base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: id
  text: Sebab kami mengupayakan apa yang baik[a], bukan hanya di hadapan Tuhan, tetapi juga di hadapan manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang terhormat” atau “apa yang patut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: kami memikirkan dengan sungguh-sungguh
  rationale: Kata προνοέω menyatakan tindakan memikirkan sebelumnya, menaruh perhatian, atau mengusahakan sesuatu dengan pertimbangan. Dalam konteks pengelolaan bantuan secara berintegritas, frasa ini menyampaikan perhatian yang disengaja tanpa membatasi maknanya hanya pada penyediaan.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan argumentatif itu secara wajar dalam bahasa Indonesia.
- source_word: καλὰ
  choice: apa yang baik
  rationale: Bentuk netral jamak καλὰ dapat menunjuk pada hal atau tindakan yang baik, terhormat, atau patut. “Apa yang baik” mempertahankan keluasan maknanya, sedangkan nuansa kehormatan publik dicantumkan dalam catatan kaki.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: bukan hanya ... tetapi juga
  rationale: Ungkapan korelatif ini mempertahankan keseimbangan penekanan antara penilaian Tuhan dan penilaian manusia.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: ἐνώπιον berarti di depan atau dalam pandangan seseorang. “Di hadapan” alami, ringkas, dan dapat memuat baik gagasan kehadiran maupun penilaian.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος dalam konteks ini diterjemahkan dengan sebutan baku “Tuhan.”
- source_word: ἀνθρώπων
  choice: manusia
  rationale: ἄνθρωποι merujuk secara umum kepada sesama manusia sebagai pengamat, bukan khusus kepada laki-laki. “Manusia” mempertahankan cakupan generiknya dan sejajar secara alami dengan “Tuhan.”
theological_decisions:
- issue: Nuansa etis καλὰ dalam konteks pertanggungjawaban keuangan
  choice: apa yang baik
  alternative: apa yang terhormat; apa yang patut
  rationale: Ayat ini menyangkut perilaku yang baik di hadapan Tuhan sekaligus dapat dipandang terhormat oleh manusia. Teks Yunani memungkinkan makna moral yang luas maupun penekanan pada kelayakan publik; terjemahan utama mempertahankan keluasan itu, dan catatan kaki menjaga alternatif kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan alasan serta kesejajaran retoris teks Yunani. Frasa “memikirkan dengan sungguh-sungguh” dipilih untuk mengungkapkan pertimbangan yang disengaja dan berorientasi ke depan tanpa terdengar kuno.
