  naturalness: Susunan “Bersama dia kami mengutus” adalah bahasa Indonesia baku dan jelas. “Yang pujiannya dalam Injil tersiar di semua jemaat” juga wajar dalam register Alkitab modern, sekalipun agak lebih formal, dan menyampaikan cakupan pujian itu dengan baik.
  terminology: “Saudara” tepat untuk τὸν ἀδελφόν dalam konteks seorang rekan seiman laki-laki tertentu. “Jemaat” tepat untuk ἐκκλησίαι. “Injil” perlu dipertahankan tanpa menambahkan bentuk pelayanan atau keterlibatan tertentu.
