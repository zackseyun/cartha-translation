  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: id
  text: Bersama dia kami mengutus saudara yang pujiannya dalam Injil tersiar di semua jemaat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bersama dia kami mengutus saudara yang dipuji di semua jemaat dalam Injil.”'
    reason: Alternatif ini mengungkapkan konstruksi nominal οὗ ὁ ἔπαινος dengan bentuk pasif bahasa Indonesia, sambil mempertahankan kaitan yang tidak diperinci dari ἐν τῷ εὐαγγελίῳ.
lexical_decisions:
- source_word: συνεπέμψαμεν δὲ μετ’ αὐτοῦ
  choice: Bersama dia kami mengutus
  rationale: Aoristus menyatakan tindakan pengutusan, sedangkan unsur σύν dan frasa μετά dengan genitif menyatakan penyertaan. Susunan ini alami dalam bahasa Indonesia dan δέ sebagai penghubung ringan tidak perlu dinyatakan tersendiri.
- source_word: τὸν ἀδελφόν
  choice: saudara
  rationale: Menunjuk kepada seorang saudara seiman laki-laki tertentu. Bahasa Indonesia tidak memerlukan kata sandang tertentu untuk mempertahankan rujukan tersebut.
- source_word: οὗ ὁ ἔπαινος
  choice: yang dipuji
  rationale: Bentuk pasif ini mengungkapkan makna idiomatis konstruksi harfiah 'yang pujiannya' tanpa mengubah pujian menjadi sekadar reputasi.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: karena keterlibatannya dalam Injil
  rationale: ἐν menandai lingkup atau kaitan pujian itu dengan Injil. 'Keterlibatannya' menghasilkan bahasa Indonesia yang jelas tanpa mempersempitnya menjadi pemberitaan atau jabatan pelayanan tertentu.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: di semua jemaat
  rationale: διά dengan genitif menunjukkan bahwa pujian itu tersebar di seluruh kumpulan jemaat. 'Di semua jemaat' wajar dalam bahasa Indonesia; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: ἐκκλησιῶν
  choice: jemaat
  rationale: Dalam konteks Paulus, kata ini menunjuk kepada komunitas-komunitas Kristen setempat; 'jemaat' jelas dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas dan status ἀδελφός
  choice: Diterjemahkan 'saudara', yakni seorang rekan seiman laki-laki tertentu yang dikenal oleh para pembaca.
  alternative: sesama orang percaya
  rationale: Bentuk maskulin tunggal dengan kata sandang dan konteks perjalanan menunjuk kepada seorang laki-laki tertentu; pilihan ini tidak mengaburkan rujukan personalnya.
- issue: Nuansa ἐν τῷ εὐαγγελίῳ
  choice: Diterjemahkan 'karena keterlibatannya dalam Injil' tanpa menetapkan bentuk pelayanan tertentu.
  alternative: dalam memberitakan Injil; karena pelayanannya bagi Injil
  rationale: Bahasa Yunani hanya mengaitkan pujian terhadap orang itu dengan Injil dan tidak secara eksplisit menyebut pemberitaan, jabatan, atau bentuk pelayanan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Teks utama mengutamakan kejelasan idiomatis, sedangkan catatan kaki mempertahankan kemungkinan susunan yang lebih formal dan ambigu.
