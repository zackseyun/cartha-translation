  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: id
  text: 'Sebab kamu mengenal anugerah Tuhan kita Yesus Kristus[a]: sekalipun Ia kaya, demi kamu Ia menjadi miskin[b], supaya melalui kemiskinan-Nya kamu menjadi kaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kristus berarti “Mesias” atau “Yang Diurapi”.
    reason: alternative_reading
  - marker: b
    text: “Kaya” dan “miskin” kemungkinan dipakai sebagai kiasan untuk mengontraskan keadaan Kristus sebelumnya dengan perendahan diri-Nya demi orang lain. Paulus tidak merinci arti kiasan itu di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: kamu mengenal
  rationale: Bentuk kini aktif orang kedua jamak menunjuk pada pengetahuan yang telah dimiliki jemaat. Dalam bahasa Indonesia, 'mengenal anugerah' lebih alami daripada 'mengetahui anugerah' dan dapat mencakup pengenalan berdasarkan pengalaman.
- source_word: χάριν
  choice: anugerah
  rationale: χάρις mencakup anugerah, kemurahan, dan tindakan murah hati. 'Anugerah' mempertahankan kedalaman teologis sekaligus tetap membuka kaitannya dengan kemurahan hati dalam konteks pengumpulan bantuan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Gelar baku bagi κύριος yang mempertahankan bobot kewibawaan dan kristologisnya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Kristus
  rationale: '''Kristus'' merupakan bentuk yang mapan dan mudah dipahami dalam bahasa Indonesia; catatan kaki menjelaskan arti gelarnya tanpa memperlakukannya sekadar sebagai nama keluarga.'
- source_word: δι’ ὑμᾶς
  choice: demi kamu
  rationale: διά dengan akusatif di sini menyatakan kepentingan atau manfaat; 'demi kamu' ringkas dan idiomatis.
- source_word: πλούσιος ὤν
  choice: sekalipun kaya
  rationale: Partisip ini paling wajar dipahami secara konsesif dalam kontras kalimat. Bahasa sumber tidak memakai verba finit 'adalah', sehingga ungkapan ringkas ini dekat dengan bentuk Yunani.
- source_word: ἐπτώχευσεν
  choice: Ia menjadi miskin
  rationale: Aorist aktif menyatakan peralihan menjadi miskin tanpa menjelaskan caranya; pilihan ini mempertahankan kontras langsung dengan menjadi kaya.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: melalui kemiskinan-Nya
  rationale: Dativus menyatakan sarana. 'Melalui' alami dalam bahasa Indonesia dan ἐκείνου secara idiomatis diwakili oleh '-Nya'.
- source_word: πλουτήσητε
  choice: kamu menjadi kaya
  rationale: Subjungtif aorist setelah ἵνα menyatakan tujuan atau hasil. 'Menjadi kaya' menjaga kesejajaran verbal dengan 'menjadi miskin' tanpa menentukan jenis kekayaan.
theological_decisions:
- issue: Arti Kristus kaya dan menjadi miskin serta orang percaya menjadi kaya
  choice: Mempertahankan antitesis kaya–miskin sebagai bahasa yang terbuka tanpa merinci rujukannya.
  alternative: Menafsirkannya secara khusus sebagai kemuliaan praeksistensi Kristus, keadaan inkarnasi atau kematian-Nya, kemiskinan material, berkat keselamatan rohani, atau dimensi etis-komunal kemurahan hati.
  rationale: Ayat ini tidak menjelaskan secara eksplisit isi kekayaan dan kemiskinan tersebut. Konteksnya mendukung tindakan pengorbanan Kristus sebagai teladan kemurahan hati, tetapi terjemahan tidak boleh mempersempit ketegangan teologisnya menjadi satu tafsiran.
- issue: Fungsi ὅτι sesudah 'anugerah'
  choice: Memakai titik dua untuk memperkenalkan penjelasan tentang anugerah Kristus.
  alternative: Memakai 'yaitu bahwa' atau koma diikuti 'bahwa'.
  rationale: Dalam bahasa Indonesia, titik dua secara alami menyatakan bahwa tindakan Kristus berikutnya menjelaskan anugerah yang dikenal pembaca, tanpa memaksakan ὅτι sebagai kutipan proposisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' dipakai sebagai orang kedua jamak sesuai bentuk Yunani dan konteks jemaat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa mengubah makna gramatikal.
