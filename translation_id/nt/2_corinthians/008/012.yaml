id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: id
  text: Sebab jika ada kerelaan[a], pemberian itu diterima berdasarkan apa yang dimiliki seseorang[b], bukan berdasarkan apa yang tidak dimilikinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesediaan” atau “semangat.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “menurut apa pun yang mungkin dimilikinya ... bukan menurut apa yang tidak dimilikinya.” Teks Yunani tidak menyebut kata “pemberian” secara tersurat.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: kerelaan
  rationale: Kata ini menunjuk pada sikap yang rela dan bersemangat. Dalam konteks memberi, “kerelaan” terdengar alami dalam bahasa Indonesia dan menekankan kesediaan tanpa menjadikannya sekadar kesiapan praktis.
- source_word: πρόκειται
  choice: ada
  rationale: Dalam konstruksi ini, kata tersebut menyatakan bahwa kerelaan itu hadir atau tersedia. “Ada” menyampaikan idiom Yunani secara alami dan ringkas.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: berdasarkan apa yang dimiliki seseorang
  rationale: Frasa ini menyatakan ukuran atau patokan menurut kemampuan yang sungguh ada. “Seseorang” mempertahankan sifat umum dari bentuk tunggal Yunani.
- source_word: εὐπρόσδεκτος
  choice: diterima
  rationale: Kata ini berarti dapat diterima atau disambut baik. Bentuk “diterima” alami dalam konteks pemberian dan tidak menentukan secara eksplisit siapa yang menerimanya.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: bukan berdasarkan apa yang tidak dimilikinya
  rationale: 'Rumusan ini mempertahankan kesejajaran dan kontras dengan klausa sebelumnya: ukurannya ialah apa yang ada, bukan apa yang tidak ada.'
- source_word: εἰ γὰρ
  choice: Sebab jika
  rationale: “Sebab” mempertahankan hubungan penjelasan dengan konteks, sedangkan “jika” mempertahankan bentuk kondisional Yunani.
theological_decisions:
- issue: Pihak yang menerima atau menilai pemberian
  choice: Tidak menyebut secara eksplisit apakah pemberian itu diterima oleh Allah, jemaat, atau keduanya.
  alternative: “diterima oleh Allah” atau “diterima oleh jemaat”
  rationale: Teks Yunani memakai εὐπρόσδεκτος tanpa menyatakan pihak yang menerima. Terjemahan mempertahankan keterbukaan referen tersebut.
- issue: Subjek tersirat dari εὐπρόσδεκτος
  choice: Menjadikan “pemberian itu” sebagai subjek tersurat demi kejelasan bahasa Indonesia.
  alternative: “kerelaan itu diterima” atau bentuk tanpa subjek tersurat
  rationale: Dalam konteks pengumpulan bantuan, yang dinilai menurut apa yang dimiliki seseorang adalah pemberiannya. Penambahan ini memperjelas struktur kalimat tanpa menentukan pihak penerima; catatan kaki mempertahankan kemungkinan bentuk Yunani yang lebih eliptis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kerelaan” sesuai dengan konteks pemberian sukarela; “berdasarkan” mempertahankan gagasan ukuran atau patokan. Pronomina umum “seseorang” menghindari pembatasan gender.
