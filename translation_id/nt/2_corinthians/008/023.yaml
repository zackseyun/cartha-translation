source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: id
  text: Mengenai Titus, ia adalah mitra saya dan rekan sekerja bagi kalian; mengenai saudara-saudara kita, mereka adalah utusan jemaat-jemaat[a], kemuliaan Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rasul-rasul jemaat-jemaat.” Kata Yunani yang dipakai dapat berarti utusan atau delegasi yang diberi tugas, ataupun rasul dalam arti yang lebih luas; dalam konteks ini, yang dimaksud kemungkinan besar ialah para wakil jemaat.
    reason: alternative_reading
  - marker: b
    text: Atau, “kemuliaan Kristus.” Di sini “Mesias” dipakai karena Χριστός berfungsi sebagai gelar.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: mengenai Titus
  rationale: Ungkapan eliptis ini memperkenalkan dua pihak secara sejajar. “Mengenai Titus” menyampaikan fungsi wacananya secara alami, dengan ὑπέρ bermakna “tentang/berkenaan dengan”.
- source_word: κοινωνὸς ἐμὸς
  choice: mitra saya
  rationale: κοινωνός menunjuk kepada seseorang yang mengambil bagian bersama orang lain; “mitra saya” mempertahankan nuansa hubungan dan pelayanan bersama.
- source_word: εἰς ὑμᾶς συνεργός
  choice: rekan sekerja saya untuk kalian
  rationale: συνεργός berarti rekan yang bekerja bersama, sedangkan εἰς ὑμᾶς mengarahkan pekerjaan itu kepada jemaat Korintus. “Untuk kalian” dekat dengan bentuk Yunani tanpa menambahkan gagasan “demi kebaikan kalian” secara eksplisit.
- source_word: ἀδελφοὶ ἡμῶν
  choice: saudara-saudara kita
  rationale: Bentuk Yunani adalah jamak maskulin dan dalam konteks ini mengacu kepada para utusan laki-laki; terjemahan ini mempertahankan rujukan tersebut.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: utusan jemaat-jemaat
  rationale: ἀπόστολοι dapat berarti para rasul atau orang-orang yang diutus sebagai delegasi. Konteks pengumpulan bantuan dan frasa “jemaat-jemaat” mendukung arti wakil yang diutus oleh jemaat, tanpa menetapkan jabatan kerasulan teknis.
- source_word: δόξα Χριστοῦ
  choice: kemuliaan Mesias
  rationale: Frasa tanpa verba ini menjelaskan para saudara tersebut secara aposisional. “Kemuliaan Mesias” menerjemahkan δόξα secara langsung dan memperlakukan Χριστός sebagai gelar.
theological_decisions:
- issue: Makna ἀπόστολοι bagi saudara-saudara yang tidak disebut namanya
  choice: utusan jemaat-jemaat dalam arti nonteknis
  alternative: rasul-rasul jemaat-jemaat
  rationale: Konteks menggambarkan para wakil yang berkaitan dengan pengumpulan bantuan, dan genitif “jemaat-jemaat” menunjuk kepada pihak yang mengutus mereka. Pilihan ini tidak memasukkan klaim yang tidak perlu tentang jabatan gerejawi mereka, sementara alternatifnya tetap dicatat.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan “Mesias”; padanan tradisional “Kristus” dicatat sebagai alternatif leksikal.
- issue: Hubungan δόξα Χριστοῦ dengan para utusan
  choice: 'aposisi langsung: “kemuliaan Mesias”'
  alternative: “yang memuliakan Mesias” atau “kehormatan bagi Mesias”
  rationale: Teks Yunani tidak memiliki verba dan mempertahankan ungkapan yang padat. Terjemahan langsung menjaga ketegangan apakah mereka merupakan perwujudan, pancaran, atau kehormatan bagi kemuliaan Mesias tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Kalian” dipakai agar rujukan jamak ὑμᾶς jelas. Struktur paralel “mengenai ...; mengenai ...” mempertahankan bentuk eliptis dan kesejajaran retoris sumber, sedangkan titik koma menjaga kedua bagian tetap sebagai satu kesatuan.
