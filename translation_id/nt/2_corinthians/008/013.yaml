  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: id
  text: Sebab, maksud saya bukanlah agar orang lain mendapat kelegaan dan kamu mengalami kesusahan, melainkan demi kesetaraan[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan”; kata Yunani ini menunjuk pada keseimbangan yang adil, bukan selalu kesamaan jumlah harta secara mutlak.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: Sebab, yang saya maksudkan bukanlah supaya
  rationale: γάρ memberi alasan atau penjelasan bagi seruan sebelumnya. Sesudah maksud yang tersirat, ἵνα menyatakan hasil yang tidak Paulus kehendaki; ungkapan ini membuat elipsis Yunani wajar dalam bahasa Indonesia tanpa mengubah daya korektifnya.
- source_word: ἄλλοις ἄνεσις
  choice: orang lain mendapat kelegaan
  rationale: ἄνεσις dalam konteks pengumpulan bantuan menunjuk pada keringanan dari tekanan atau beban. Bentuk verbal 'mendapat kelegaan' menghasilkan bahasa Indonesia yang alami sambil mempertahankan pihak yang menerima manfaat.
- source_word: ὑμῖν θλῖψις
  choice: kamu mengalami kesusahan
  rationale: θλῖψις secara harfiah berkaitan dengan tekanan atau penderitaan; dalam konteks pemberian materi, 'kesusahan' menyampaikan beban nyata yang tidak Paulus kehendaki bagi jemaat Korintus.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: melainkan supaya ada kesetaraan
  rationale: ἀλλά menandai kontras, sedangkan ἰσότης menunjuk pada kesetaraan atau keseimbangan yang adil. Unsur ἐξ diungkapkan secara idiomatis sebagai keadaan yang dituju dalam konstruksi bahasa Indonesia.
theological_decisions:
- issue: Makna ἰσότης dalam konteks berbagi materi
  choice: kesetaraan
  alternative: keadilan; keseimbangan yang adil
  rationale: '''Kesetaraan'' merupakan padanan leksikal yang langsung dan mempertahankan retorika Paulus. Catatan kaki mencegah istilah itu dipahami sebagai tuntutan agar semua orang memiliki jumlah harta yang persis sama.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Sebab' mempertahankan hubungan penjelas dengan konteks sebelumnya; 'sedangkan' memperjelas kontras internal tanpa menambah gagasan baru. Tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
