  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: id
  text: Sebab ia menerima permintaan itu, tetapi dengan kesungguhan yang lebih besar, atas kemauannya sendiri ia berangkat menemui kalian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan semangat yang lebih besar,” “lebih giat,” atau “lebih ingin.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ia datang menemui kalian.” Bentuk Yunani secara harfiah menggambarkan keberangkatan dari tempat pengirim, tetapi dari sudut pandang penerima dapat dinyatakan sebagai kedatangan.
    reason: translation_perspective
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi ucapan syukur pada ayat sebelumnya; “Sebab” mempertahankan daya kausal itu secara alami.
- source_word: τὴν ... παράκλησιν
  choice: permintaan itu
  rationale: Dalam konteks ini παράκλησις menunjuk pada desakan atau permintaan yang disampaikan kepada Titus, bukan terutama penghiburan. Artikel Yunani dipertahankan secara anaforis dengan “itu” tanpa menambahkan pemilik yang tidak dinyatakan.
- source_word: ἐδέξατο
  choice: menerima
  rationale: “Menerima” menyatakan sambutan positif Titus terhadap permintaan tersebut tanpa melebihkan makna verba Yunani.
- source_word: σπουδαιότερος
  choice: lebih bersemangat
  rationale: Pilihan ini mempertahankan bentuk komparatif dan menyampaikan kesungguhan serta semangat Titus dalam melaksanakan tugas.
- source_word: ὑπάρχων
  choice: karena ia
  rationale: Partisip ini dipahami secara kausal dalam hubungan dengan tindakan berikutnya dan dialihkan ke susunan Indonesia yang wajar.
- source_word: αὐθαίρετος
  choice: atas kemauannya sendiri
  rationale: Frasa ini menegaskan bahwa tindakan Titus bersifat sukarela dan timbul dari prakarsanya sendiri.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: ia berangkat menemui kalian
  rationale: “Berangkat” mempertahankan arah gerak dari tempat Paulus, sedangkan “menemui kalian” menyampaikan tujuan πρὸς ὑμᾶς dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Hubungan antara permintaan Paulus dan prakarsa Titus
  choice: 'Mempertahankan keduanya: Titus menerima permintaan itu, namun juga bertindak atas kemauannya sendiri.'
  alternative: Menggambarkan perjalanan Titus semata-mata sebagai ketaatan kepada perintah Paulus atau semata-mata sebagai prakarsa tanpa permintaan sebelumnya.
  rationale: Konstruksi μὲν ... δὲ dan αὐθαίρετος sengaja menempatkan penerimaan permintaan Paulus berdampingan dengan semangat serta kesukarelaan Titus; ketegangan ini tidak boleh dihapus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk bentuk jamak ὑμᾶς. Susunan kalimat mempertahankan kontras μὲν ... δὲ sekaligus menghindari gaya yang terlalu harfiah.
