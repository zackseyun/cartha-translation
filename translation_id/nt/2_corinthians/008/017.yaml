  source_fidelity: 'Draf secara umum menangkap unsur-unsur utama: Titus menerima permintaan, memiliki kesungguhan/semangat yang lebih besar, dan pergi atas prakarsanya sendiri. Namun, penerjemahan ὑπάρχων sebagai “karena ia” secara tidak perlu menjadikan kesungguhannya alasan kausal eksplisit, padahal partisip tersebut lebih aman diterjemahkan secara deskriptif atau sebagai keadaan yang menyertai tindakan.'
  naturalness: Kalimatnya pada dasarnya alami, tetapi rangkaian “tetapi karena ia lebih bersemangat” terasa kurang tepat setelah “Sebab ia memang menerima ...” dan mengaburkan kontras Yunani μὲν ... δέ. Susunan revisi lebih lancar dalam bahasa Indonesia modern.
  terminology: “Permintaan itu,” “atas kemauannya sendiri,” dan “berangkat menemui kalian” sesuai konteks dan register. “Lebih bersungguh-sungguh” mengekspresikan σπουδαιότερος dengan baik tanpa mengubahnya menjadi sebab yang eksplisit.
