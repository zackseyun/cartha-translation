  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: id
  text: seperti yang tertulis, “Orang yang mempunyai banyak tidak kelebihan, dan orang yang mempunyai sedikit tidak kekurangan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: seperti yang tertulis
  rationale: Formula baku untuk memperkenalkan kutipan Kitab Suci; bentuk 'tertulis' mencerminkan kesaksian tertulis yang tetap berlaku dalam bentuk perfektum Yunani.
- source_word: Ὁ τὸ πολὺ
  choice: Orang yang mempunyai banyak
  rationale: Artikel dengan adjektiva netral berfungsi secara substantival, yakni 'orang yang [mempunyai] banyak'. Kata kerja 'mengumpulkan' tidak dinyatakan secara eksplisit dalam kutipan Paulus.
- source_word: ἐπλεόνασεν
  choice: tidak kelebihan
  rationale: Dalam konteks ini πλεονάζω menunjuk pada adanya kelebihan atau surplus. 'Tidak kelebihan' alami, ringkas, dan mempertahankan kesejajaran dengan 'tidak kekurangan'.
- source_word: ὁ τὸ ὀλίγον
  choice: orang yang mempunyai sedikit
  rationale: Sejajar dengan ὁ τὸ πολὺ dan mempertahankan gagasan jumlah yang dimiliki tanpa memasukkan kata kerja 'mengumpulkan' dari konteks Keluaran.
- source_word: ἠλαττόνησεν
  choice: tidak kekurangan
  rationale: ἐλαττονέω di sini berarti tidak mengalami kekurangan atau tidak jatuh di bawah kebutuhan; pilihan ini merupakan ungkapan Indonesia yang wajar dan tepat.
theological_decisions:
- issue: Penggunaan kutipan Keluaran 16:18 dalam konteks kemurahan hati dan keseimbangan pemenuhan kebutuhan
  choice: Mengungkapkan hasil kepemilikan atau pembagian tanpa menambahkan tindakan 'mengumpulkan'.
  alternative: “Orang yang mengumpulkan banyak tidak mempunyai kelebihan, dan orang yang mengumpulkan sedikit tidak mengalami kekurangan.”
  rationale: Teks Yunani yang dikutip Paulus tidak menyebut kata kerja 'mengumpulkan' secara eksplisit. Terjemahan utama mempertahankan bentuk Paulus sekaligus menyampaikan hasil berupa tidak adanya kelebihan maupun kekurangan, tanpa mempersempit penerapannya hanya pada pengumpulan manna.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur antitetis 'mempunyai banyak ... tidak kelebihan / mempunyai sedikit ... tidak kekurangan' dipertahankan agar kesejajaran retoris teks jelas.
