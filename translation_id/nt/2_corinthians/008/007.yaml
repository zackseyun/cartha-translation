revisions:
- from: Namun, sebagaimana kamu berlimpah dalam segala hal—dalam iman, perkataan, pengetahuan, segala kesungguhan, dan kasih yang berasal dari kami dan ada di antara kamu[a]—hendaklah kamu juga berlimpah dalam anugerah ini[b].
  to: Tetapi, sebagaimana kamu berlimpah dalam segala hal—dalam iman, perkataan, pengetahuan, segala kesungguhan, dan kasih dari kami yang ada di dalam kamu[a]—hendaklah kamu juga berlimpah dalam anugerah ini[b].
  rationale: Mengganti “kasih yang berasal dari kami dan ada di antara kamu” dengan “kasih dari kami yang ada di dalam kamu” agar unsur ἐξ ἡμῶν dan ἐν ὑμῖν tetap terlihat tanpa menambahkan penafsiran “di antara.” Catatan kaki dipertahankan karena secara memadai mencatat alternatif penafsiran dan varian naskah. Perubahan “Namun” menjadi “Tetapi” merupakan penyelarasan ringan dengan daya kontras ἀλλά.
