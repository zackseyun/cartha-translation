  naturalness: Bahasa Indonesia baku dan jelas. “Kasih dari kami yang ada di dalam kamu” tetap cukup alami, walaupun agak tidak biasa; ketidakbiasaan ini tepat karena frasa Yunani yang diterjemahkan memang sulit dan diperdebatkan. “Tetapi” mencerminkan ἀλλά lebih langsung daripada “Namun.”
  terminology: “Iman,” “perkataan,” “pengetahuan,” “segala kesungguhan,” dan “anugerah” sesuai konteks. “Anugerah” mempertahankan bobot χάρις, sedangkan catatan kaki dengan tepat menjelaskan acuannya pada karya pemberian.
