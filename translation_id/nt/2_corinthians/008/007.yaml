source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: id
  text: Tetapi, sebagaimana kamu berlimpah dalam segala hal—dalam iman, perkataan, pengetahuan, segala kesungguhan, dan kasih dari kami yang ada di dalam kamu[a]—hendaklah kamu juga berlimpah dalam anugerah ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “kasihmu kepada kami.” Frasa Yunani ini sulit, dan beberapa naskah berbunyi “kasih yang berasal dari kamu dan ada di dalam kami.”
    reason: alternative_reading
  - marker: b
    text: Maksudnya, karya anugerah berupa pemberian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: berlimpah
  rationale: Mempertahankan gambaran kelimpahan pada kedua kemunculan kata kerja itu dan menghubungkan keunggulan jemaat yang sudah ada dengan dorongan mengenai pemberian.
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Ungkapan luas ini merangkum daftar yang mengikutinya tanpa membatasi maknanya pada cara atau bidang tertentu.
- source_word: πίστει
  choice: iman
  rationale: Makna yang paling wajar dalam daftar kualitas rohani ini, tanpa menutup kemungkinan nuansa kepercayaan.
- source_word: λόγῳ
  choice: perkataan
  rationale: Dalam daftar ini kemungkinan menunjuk pada kemampuan atau karunia bertutur; 'perkataan' alami dan tidak mempersempitnya menjadi satu ucapan tertentu.
- source_word: γνώσει
  choice: pengetahuan
  rationale: Padanan baku yang sesuai dengan daftar kekuatan rohani jemaat.
- source_word: πάσῃ σπουδῇ
  choice: segala kesungguhan
  rationale: Menangkap semangat, keseriusan, dan ketekunan aktif yang dapat dinyatakan oleh σπουδή.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: kasih yang berasal dari kami dan ada di antara kamu
  rationale: Mengikuti bentuk teks SBLGNT dengan mempertahankan unsur 'berasal dari kami' dan 'di antara kamu', sambil memakai susunan bahasa Indonesia yang dapat dipahami. Kesulitan sintaksis dan varian naskah dijelaskan dalam catatan kaki.
- source_word: χάριτι
  choice: anugerah
  rationale: Mempertahankan bobot teologis χάρις, sedangkan catatan kaki menjelaskan bahwa dalam konteks ini kata tersebut menunjuk pada karya pemberian yang lahir dari anugerah.
theological_decisions:
- issue: Makna χάρις dalam konteks pengumpulan bantuan bagi orang-orang kudus
  choice: anugerah
  alternative: karya anugerah; pemberian; tindakan kemurahan
  rationale: Paulus memakai istilah yang memiliki kedalaman teologis sekaligus menunjuk secara konkret pada pelayanan memberi. Teks utama mempertahankan istilah teologis itu, dan catatan kaki menerangkan acuannya.
- issue: Penafsiran τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: kasih yang berasal dari kami dan ada di antara kamu
  alternative: kasihmu kepada kami; kasih kami di dalam kamu
  rationale: Frasa Yunani ini sulit secara sintaksis dan memiliki varian tekstual. Terjemahan utama mengikuti bacaan SBLGNT tanpa diam-diam menyelesaikan ketegangannya, sementara catatan kaki mencatat kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'berlimpah' dipertahankan untuk mencerminkan bingkai retoris Yunani. 'Hendaklah' menyampaikan daya dorong klausa ἵνα yang berfungsi sebagai ajakan dalam konteks ini.
