id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: id
  text: Aku khawatir[a] bahwa ketika aku datang lagi, Allahku mungkin merendahkan aku di hadapan kalian[b][c], dan aku akan berdukacita atas banyak orang yang telah berbuat dosa sebelumnya[d] dan belum bertobat dari kenajisan, percabulan, dan kecabulan[e] yang mereka lakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani meneruskan ungkapan “aku khawatir” dari ayat 20; secara harfiah susunannya dapat diterjemahkan, “jangan-jangan ketika aku datang lagi ….”
    reason: syntactic_clarification
  - marker: b
    text: Atau “mempermalukan aku” atau “membuat aku rendah.” Kata Yunani yang dipakai dapat mengandung salah satu nuansa tersebut sesuai konteks.
    reason: lexical_alternative
  - marker: c
    text: Atau “di antara kalian.”
    reason: lexical_alternative
  - marker: d
    text: Secara lebih harfiah, “banyak dari antara mereka yang telah berbuat dosa sebelumnya.”
    reason: structural_alternative
  - marker: e
    text: Atau “perilaku tak terkendali” atau “kelakuan tanpa rasa malu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: bahwa ketika aku datang lagi
  rationale: μή meneruskan ungkapan kekhawatiran dari ayat sebelumnya, sedangkan πάλιν menerangkan kedatangan Paulus sebagai kedatangan kembali. Klausa waktu ini menyampaikan hubungan sintaksisnya secara alami dalam bahasa Indonesia.
- source_word: ταπεινώσῃ με
  choice: mungkin merendahkan aku
  rationale: ταπεινόω dapat berarti merendahkan, membuat rendah, atau mempermalukan. 'Merendahkan aku' mempertahankan cakupan maknanya, sementara 'mungkin' menyampaikan sifat hal yang dikhawatirkan tanpa menjadikannya kepastian.
- source_word: ὁ θεός μου
  choice: Allahku
  rationale: Ungkapan posesif ini diterjemahkan langsung untuk mempertahankan hubungan pribadi yang dinyatakan Paulus.
- source_word: πρὸς ὑμᾶς
  choice: di hadapan kalian
  rationale: Dalam konteks kunjungan Paulus, frasa ini menunjuk pada perendahan yang terjadi dalam kehadiran jemaat Korintus. Kemungkinan 'di antara kalian' dipertahankan dalam catatan kaki.
- source_word: πενθήσω
  choice: aku akan berdukacita
  rationale: πενθέω menyatakan perkabungan atau dukacita yang mendalam; 'berdukacita' mempertahankan bobot emosionalnya.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: banyak orang yang telah berbuat dosa sebelumnya
  rationale: Bentuk perfek προημαρτηκότων menunjuk pada perbuatan dosa terdahulu yang tetap relevan pada saat kunjungan Paulus. Susunan ini alami dalam bahasa Indonesia, sedangkan struktur partitifnya dicatat sebagai alternatif.
- source_word: μὴ μετανοησάντων
  choice: belum bertobat
  rationale: Walaupun partiselnya berbentuk aoris, konteks menyoroti keadaan mereka yang masih belum bertobat. 'Belum bertobat' menyampaikan keadaan yang berlanjut itu secara alami.
- source_word: ἐπὶ τῇ ἀκαθαρσίᾳ
  choice: dari kenajisan
  rationale: ἐπί menyatakan perkara yang darinya pertobatan diperlukan. 'Dari' merupakan pasangan yang alami dengan 'bertobat' dalam bahasa Indonesia.
- source_word: ἀκαθαρσίᾳ
  choice: kenajisan
  rationale: Istilah ini mempertahankan arti luas kecemaran moral tanpa membatasinya pada satu tindakan tertentu.
- source_word: πορνείᾳ
  choice: percabulan
  rationale: πορνεία menunjuk secara luas pada perbuatan seksual yang tidak bermoral. 'Percabulan' ringkas, mapan, dan cukup luas dalam bahasa Indonesia.
- source_word: ἀσελγείᾳ
  choice: perbuatan tidak senonoh
  rationale: ἀσέλγεια menunjuk pada perilaku tanpa kendali dan tanpa rasa malu, sering kali bersifat seksual. Pilihan ini alami dan membedakannya dari πορνεία, sementara nuansa alternatif dijelaskan dalam catatan kaki.
- source_word: ᾗ ἔπραξαν
  choice: yang mereka lakukan
  rationale: Kata ganti relatif merujuk secara kolektif pada tiga keburukan yang disebutkan. πράσσω menyatakan perilaku yang dilakukan atau dipraktikkan.
theological_decisions:
- issue: Daya sintaksis μή yang meneruskan pernyataan takut dari ayat sebelumnya
  choice: Aku khawatir bahwa ketika aku datang lagi ... Allahku mungkin merendahkan aku
  alternative: Jangan-jangan ketika aku datang lagi, Allahku merendahkan aku
  rationale: Bahasa Yunani bergantung pada φοβοῦμαι dalam ayat 20. Menghadirkan kembali 'Aku khawatir' membuat ayat mandiri ini jelas tanpa mengubah kekhawatiran Paulus menjadi pernyataan pasti.
- issue: Hubungan perendahan Paulus dengan jemaat Korintus
  choice: di hadapan kalian
  alternative: di antara kalian
  rationale: πρὸς ὑμᾶς dapat menggambarkan perendahan dalam kehadiran mereka ataupun dalam lingkup hubungannya dengan mereka. Teks utama memakai ungkapan yang alami sambil mempertahankan alternatif asli dalam catatan kaki.
- issue: Pembedaan tiga istilah keburukan moral
  choice: kenajisan, percabulan, dan perbuatan tidak senonoh
  alternative: kecemaran, perbuatan seksual yang tidak bermoral, dan perilaku tak terkendali
  rationale: Ketiga istilah Yunani saling tumpang tindih tetapi tidak identik. Terjemahan mempertahankan tiga unsur daftar itu tanpa memberikan batas doktrinal yang lebih sempit daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai konteks Paulus berbicara kepada jemaat. Diksi dijaga khidmat tetapi tetap mudah dipahami; istilah moral dibedakan tanpa dibuat lebih sempit daripada bahasa Yunani.
