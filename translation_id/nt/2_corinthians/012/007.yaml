id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: id
  text: Dan karena penyataan-penyataan itu begitu luar biasa—supaya aku tidak meninggikan diri—kepadaku diberikan suatu duri dalam daging[a], yaitu utusan Iblis[b], untuk terus menghantam aku[c], supaya aku tidak meninggikan diri.[d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebatang pasak dalam daging.” Kata Yunani σκόλοψ dapat menunjuk pada pasak tajam, serpihan, atau duri; gambaran tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “malaikat Iblis.” Kata Yunani ἄγγελος dapat berarti “utusan” atau “malaikat.”
    reason: alternative_reading
  - marker: c
    text: Atau “untuk terus menyiksa aku” atau “untuk terus memukuli aku.” Kata kerjanya secara harfiah menggambarkan tindakan menghantam atau memukul.
    reason: lexical_alternative
  - marker: d
    text: Ungkapan “supaya aku tidak meninggikan diri” muncul dua kali dalam teks Yunani dan dipertahankan di sini.
    reason: textual_transparency
  - marker: e
    text: 'Strukturnya juga dapat diterjemahkan: “Dan karena penyataan-penyataan itu begitu luar biasa, maka supaya aku tidak meninggikan diri, kepadaku diberikan suatu duri dalam daging.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: karena penyataan-penyataan itu begitu luar biasa
  rationale: Ungkapan ini menyatakan kadar penyataan yang melampaui ukuran biasa. Bentuk Indonesia ini alami, mempertahankan penekanan, dan menghubungkannya secara kausal dengan klausa berikutnya.
- source_word: ὑπεραίρωμαι
  choice: aku tidak meninggikan diri
  rationale: Pilihan ini mempertahankan citra meninggikan diri dan tidak mempersempit maknanya hanya menjadi kesombongan batin. Pengulangan ungkapan Yunani dipertahankan.
- source_word: ἐδόθη μοι
  choice: kepadaku diberikan
  rationale: Bentuk pasif dipertahankan agar identitas pemberi tidak ditambahkan oleh terjemahan.
- source_word: σκόλοψ τῇ σαρκί
  choice: suatu duri dalam daging
  rationale: Metafora tradisional dan kuat ini tetap membiarkan bentuk tepat benda tajam serta sifat penderitaan Paulus tidak ditentukan.
- source_word: ἄγγελος Σατανᾶ
  choice: utusan Iblis
  rationale: Utusan mencakup rentang makna ἄγγελος tanpa memastikan apakah yang dimaksud adalah malaikat atau agen lain. Iblis merupakan padanan Indonesia yang lazim bagi Σατανᾶ.
- source_word: κολαφίζῃ
  choice: terus menghantam aku
  rationale: Menghantam mempertahankan citra pukulan dalam verba Yunani, sedangkan terus mencerminkan aspek kini yang dapat menyiratkan tindakan berulang.
theological_decisions:
- issue: Hakikat 'duri dalam daging'
  choice: Metafora dipertahankan tanpa mengidentifikasi penderitaan itu.
  alternative: Penyakit jasmani, penganiayaan atau lawan manusia, maupun gangguan roh jahat.
  rationale: Ayat ini tidak menjelaskan secara tegas apa yang dilambangkan oleh duri tersebut.
- issue: Pelaku dalam 'kepadaku diberikan'
  choice: Bentuk pasif dipertahankan tanpa menyebut pemberi.
  alternative: Allah memberikannya atau Allah mengizinkannya.
  rationale: Teks tidak menyebut pelaku secara eksplisit, sehingga ketegangan antara izin ilahi dan sarana Iblis tetap terpelihara.
- issue: Identitas ἄγγελος Σατανᾶ
  choice: utusan Iblis
  alternative: malaikat Iblis
  rationale: Ἄγγελος dapat berarti utusan ataupun malaikat; teks utama tidak memastikan hakikat agen tersebut.
- issue: Pengulangan tujuan supaya aku tidak meninggikan diri
  choice: Kedua kemunculan dipertahankan.
  alternative: Menghapus salah satunya demi kelancaran gaya.
  rationale: Keduanya terdapat dalam teks sumber yang diberikan dan membingkai keterangan tentang duri serta utusan Iblis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Tanda pisah membantu pembaca mengikuti susunan Yunani yang bertumpuk tanpa menghilangkan klausa tujuan pertama; metafora dan ketidakjelasan pelaku sengaja dipertahankan.
