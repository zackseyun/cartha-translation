revisions:
- from: Aku sendiri akan dengan sangat senang hati mengeluarkan segala yang kupunya, bahkan mengorbankan diriku, demi hidupmu.[a] Jika aku mengasihi kamu dengan lebih besar, apakah aku akan kurang dikasihi?
  to: Aku sendiri akan dengan sangat senang hati mengeluarkan milikku dan menghabiskan diriku demi hidupmu.[a] Jika aku semakin besar mengasihi kamu, apakah aku kurang dikasihi?
  rationale: Revisi menghapus penambahan “segala,” mempertahankan pasangan δαπανήσω–ἐκδαπανηθήσομαι sebagai pengeluaran milik dan penghabisan diri, serta mengembalikan pertanyaan terakhir kepada keadaan kini yang tersirat dalam bentuk pasif present. Catatan kaki tetap menunjukkan keluasan ψυχή tanpa memaksakan pembacaan antropologis tertentu.
