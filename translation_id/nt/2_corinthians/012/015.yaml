review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan. “Segala yang kupunya” menambahkan cakupan total yang tidak dinyatakan oleh δαπανήσω, sedangkan “mengorbankan diriku” menggeser metafora pengeluaran/kehabisan diri menjadi bahasa pengorbanan. Kata “akan” pada “apakah aku akan kurang dikasihi?” juga tidak mencerminkan present passive ἀγαπῶμαι dengan baik.
  naturalness: Teks revisi mempertahankan gaya baku modern, hangat, dan retoris. “Mengeluarkan milikku dan menghabiskan diriku” menyampaikan pasangan metaforis Yunani secara cukup alami tanpa memperluas makna.
  terminology: “Hidupmu” dapat dipertahankan sebagai padanan kontekstual ψυχῶν ὑμῶν, dengan catatan alternatif yang lebih tepat secara jumlah dan makna. “Semakin besar” adalah ungkapan Indonesia yang wajar untuk περισσοτέρως dalam konteks kasih.
  issues:
  - severity: medium
    issue: “Segala yang kupunya” menambahkan makna totalitas.
    rationale: δαπανήσω berarti membelanjakan atau mengeluarkan sumber daya, tetapi tidak secara eksplisit mengatakan “segala” milik Paulus.
  - severity: medium
    issue: “Mengorbankan diriku” tidak mempertahankan metafora utama verba kedua.
    rationale: ἐκδαπανηθήσομαι melanjutkan dan mengintensifkan gagasan “dibelanjakan/dihabiskan,” bukan secara khusus tindakan pengorbanan.
  - severity: low
    issue: “Akan” dalam pertanyaan terakhir mengubah nuansa waktu/aspek.
    rationale: ἀγαπῶμαι adalah present passive; pertanyaan retoris Indonesia yang paling langsung ialah “apakah aku kurang dikasihi?”
  - severity: low
    issue: Catatan kaki “dirimu sendiri” tidak selaras dengan sasaran jamak dalam teks Yunani.
    rationale: ὑμῶν dan ψυχῶν sama-sama berbentuk jamak. Alternatif “kamu sendiri” lebih netral secara kolektif dalam bahasa Indonesia.
  revised_text: Aku sendiri akan dengan sangat senang hati mengeluarkan milikku dan menghabiskan diriku demi hidupmu.[a] Jika aku semakin besar mengasihi kamu, apakah aku kurang dikasihi?
  revised_footnotes:
