source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: id
  text: Aku sendiri akan dengan sangat senang hati mengeluarkan milikku dan menghabiskan diriku demi hidupmu.[a] Jika aku semakin besar mengasihi kamu, apakah aku kurang dikasihi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwa-jiwamu” atau “kamu sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: dengan sangat senang hati
  rationale: Bentuk superlatif ini menyatakan kesediaan Paulus yang sungguh-sungguh dan penuh sukacita, bukan sekadar persetujuan.
- source_word: δαπανήσω
  choice: mengeluarkan segala yang kupunya
  rationale: Kata ini memakai gambaran pengeluaran harta atau sumber daya. Ungkapan ini mempertahankan metafora tersebut sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἐκδαπανηθήσομαι
  choice: bahkan mengorbankan diriku
  rationale: 'Bentuk yang diperkuat ini melanjutkan metafora sebelumnya: Paulus bukan hanya rela mengeluarkan miliknya, tetapi juga menyerahkan dirinya sampai habis. Terjemahan harfiah ''dihabiskan'' kurang alami dan dapat kabur dalam bahasa Indonesia.'
- source_word: ὑπὲρ
  choice: demi
  rationale: Dalam konteks ini kata tersebut menyatakan tindakan bagi kepentingan atau kebaikan orang lain.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: hidupmu
  rationale: ψυχή di sini dapat menunjuk pada hidup, diri, atau pribadi seutuhnya. 'Hidupmu' mempertahankan bobot personal tanpa memaksakan pembagian teknis antara jiwa dan tubuh. Bentuk tunggal kolektif 'hidupmu' wajar karena 'kamu' dapat merujuk jamak dalam bahasa Indonesia.
- source_word: εἰ
  choice: Jika
  rationale: Mempertahankan bentuk syarat dalam pertanyaan retoris dan tidak mengubahnya secara interpretatif menjadi 'karena'.
- source_word: περισσοτέρως
  choice: dengan lebih besar
  rationale: Mengungkapkan derajat kasih yang lebih tinggi. Dalam kaitannya dengan 'mengasihi', ungkapan ini lebih alami daripada 'lebih berlimpah'.
- source_word: ἀγαπῶν
  choice: aku mengasihi
  rationale: Partisip Yunani dialihkan menjadi verba finit agar pertanyaan bersyarat mengalir secara alami dalam bahasa Indonesia.
- source_word: ἧσσον
  choice: kurang
  rationale: Padanan komparatif yang ringkas dan alami, berlawanan dengan περισσοτέρως.
- source_word: ἀγαπῶμαι
  choice: aku akan kurang dikasihi
  rationale: Di dalam konstruksi pertanyaan bersyarat bahasa Indonesia, 'akan' membuat akibat retorisnya jelas tanpa menyatakan bahwa verba Yunani itu berbentuk futurum.
theological_decisions:
- issue: Cakupan makna ψυχή dalam konteks pengabdian pastoral Paulus
  choice: hidupmu
  alternative: jiwamu; dirimu sendiri
  rationale: Kata ψυχή dapat berarti jiwa, hidup, atau pribadi. 'Hidupmu' menjaga keluasan makna personal dan pengorbanan Paulus tanpa mengimpor antropologi teknis yang tidak ditegaskan oleh ayat ini.
- issue: Hubungan logis εἰ dalam pertanyaan retoris
  choice: Jika
  alternative: Karena; Meskipun
  rationale: 'Mempertahankan bentuk kondisional Yunani menjaga ketegangan retoris: kasih Paulus yang lebih besar justru berhadapan dengan kasih yang lebih kecil kepadanya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Metafora pengeluaran dipertahankan pada klausa pertama, lalu intensifikasinya diungkapkan secara idiomatis sebagai pengorbanan diri. Pronomina 'aku' dan 'kamu' mengikuti keakraban dan daya emosional tuturan Paulus.
