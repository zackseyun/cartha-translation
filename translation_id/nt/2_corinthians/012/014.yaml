id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: id
  text: Lihat, untuk ketiga kalinya ini aku siap datang kepada kalian,[a] dan aku tidak akan membebani kalian.[b] Sebab, yang kucari bukanlah milik kalian, melainkan kalian sendiri. Karena bukan anak-anak yang wajib mengumpulkan harta bagi orang tua mereka, melainkan orang tualah yang wajib melakukannya bagi anak-anak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk ketiga kalinya ini aku dalam keadaan siap untuk datang kepada kalian.”'
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Yunani yang diterjemahkan “membebani” di sini dapat berarti menjadi beban secara materi atau keuangan bagi seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Dipakai sebagai seruan penarik perhatian yang alami dalam bahasa Indonesia modern dan tetap mempertahankan daya wacana teks Yunani.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: untuk ketiga kalinya ini aku siap datang
  rationale: Mengikuti susunan dan fokus Yunani pada kesiapan Paulus untuk datang untuk ketiga kalinya, tanpa memastikan secara berlebihan bahwa dua kunjungan sebelumnya pasti telah terlaksana.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Dalam konteks perjalanan dan kunjungan, bentuk ini alami serta menunjukkan bahwa jemaat Korintus adalah tujuan kedatangan Paulus.
- source_word: καταναρκήσω
  choice: membebani kalian
  rationale: Menyampaikan gagasan menjadi beban, terutama secara materi atau keuangan, dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: yang kucari bukanlah milik kalian, melainkan kalian sendiri
  rationale: Mempertahankan kontras retoris antara kepunyaan jemaat dan diri mereka; 'sendiri' menegaskan kontras tanpa membatasi 'milik' hanya pada uang.
- source_word: ὀφείλει
  choice: wajib
  rationale: Mengungkapkan kewajiban normatif secara jelas dan langsung.
- source_word: θησαυρίζειν
  choice: mengumpulkan harta
  rationale: Mempertahankan citra dasar menimbun atau menyediakan kekayaan, yang dalam konteks merujuk pada penyediaan materi bagi keluarga.
- source_word: γονεῦσιν / γονεῖς
  choice: orang tua
  rationale: Istilah Yunani mencakup ayah dan ibu secara umum.
- source_word: τέκνα / τέκνοις
  choice: anak-anak
  rationale: Istilah Yunani bersifat umum dan tidak dibatasi pada anak laki-laki.
theological_decisions:
- issue: Makna ungkapan 'ketiga kalinya'
  choice: Dihubungkan dengan kesiapan Paulus untuk datang untuk ketiga kalinya.
  alternative: Menafsirkan ungkapan itu sebagai pernyataan tegas bahwa ini pasti merupakan kunjungan Paulus yang ketiga setelah dua kunjungan yang telah terlaksana.
  rationale: Susunan Yunani menempatkan 'ketiga kalinya ini' bersama keadaan siap untuk datang. Terjemahan mempertahankan kemungkinan tentang riwayat perjalanan Paulus tanpa menyelesaikannya secara dogmatis.
- issue: Kewajiban orang tua dan anak dalam perbandingan Paulus
  choice: 'Kedua klausa menyatakan pola kewajiban umum: orang tua menyediakan bagi anak-anak, bukan sebaliknya.'
  alternative: Membaca pernyataan tersebut sebagai larangan mutlak bagi anak untuk menolong orang tua dalam segala keadaan.
  rationale: Konteksnya adalah analogi pelayanan Paulus dan dukungan materi, bukan rumusan lengkap mengenai setiap kewajiban keluarga.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti jamak 'kalian' dipakai agar pembedaan jumlah dalam bahasa Yunani tetap terlihat. Bentuk 'kucari' menjaga kelancaran retoris, sedangkan pengulangan 'wajib melakukannya' memperjelas verba yang tersirat pada klausa kedua.
