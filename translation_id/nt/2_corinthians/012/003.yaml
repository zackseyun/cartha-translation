  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: id
  text: Dan aku mengenal orang semacam itu—entah di dalam tubuh atau terpisah dari tubuh, aku tidak tahu[a]; Allah tahu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di luar tubuh” untuk “terpisah dari tubuh”. Paulus tidak mengatakan apakah pengalaman itu berlangsung secara jasmani atau tidak.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: aku mengenal / aku tidak tahu / Allah yang tahu
  rationale: Dalam kaitannya dengan seseorang, bentuk pertama paling alami diterjemahkan "aku mengenal"; pada dua pemakaian berikutnya, "tahu" mempertahankan kontras retoris antara ketidaktahuan Paulus dan pengetahuan Allah.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: orang semacam itu
  rationale: Ungkapan ini menunjuk kepada orang tertentu yang berciri seperti dalam konteks sebelumnya, sambil mempertahankan cara Paulus merujuk secara tidak langsung tanpa menyisipkan identitasnya ke dalam terjemahan.
- source_word: εἴτε ... εἴτε
  choice: entah ... atau
  rationale: Pasangan ini secara alami menyatakan dua kemungkinan alternatif dalam bahasa Indonesia.
- source_word: ἐν σώματι
  choice: di dalam tubuh
  rationale: Terjemahan langsung dan wajar yang mempertahankan kontras spasial-konseptual dengan χωρὶς τοῦ σώματος.
- source_word: χωρὶς τοῦ σώματος
  choice: terpisah dari tubuh
  rationale: χωρίς menyatakan keterpisahan. Pilihan ini alami dalam bahasa Indonesia dan tidak memastikan hakikat metafisik pengalaman tersebut.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: aku tidak tahu; Allah yang tahu
  rationale: Susunan ini menegaskan kontras antara ketidaktahuan Paulus dan pengetahuan Allah; kata "yang" memberi penekanan idiomatis tanpa menambah isi.
- source_word: θεὸς
  choice: Allah
  rationale: Padanan baku dan jelas bagi θεός dalam bahasa Indonesia Alkitabiah modern.
theological_decisions:
- issue: Rujukan diri Paulus secara tidak langsung dan hakikat pengalaman itu
  choice: Mempertahankan ungkapan orang ketiga "orang semacam itu" serta membiarkan terbuka apakah pengalaman itu berlangsung di dalam tubuh atau terpisah dari tubuh.
  alternative: Mengidentifikasi orang itu secara eksplisit sebagai Paulus atau menerjemahkannya sedemikian rupa sehingga memastikan pengalaman keluar dari tubuh.
  rationale: Teks Yunani mempertahankan jarak retoris dan secara eksplisit menyatakan ketidakpastian mengenai keadaan tubuh. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti "aku" mengikuti suara pribadi Paulus dan kesinambungan konteks; tanda pisah mempertahankan sisipan serta struktur kalimat Yunani.
