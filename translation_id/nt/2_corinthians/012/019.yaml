  to: Apakah selama ini kalian mengira bahwa kami sedang membela diri kepada kalian? Di hadapan Allah, dalam Mesias, kami berbicara. Dan segala sesuatu, Saudara-saudara yang terkasih, adalah untuk membangun kalian.
