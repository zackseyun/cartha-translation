  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: id
  text: Apakah selama ini kalian mengira bahwa kami sedang membela diri kepada kalian? Di hadapan Allah, dalam Mesias, kami berbicara. Dan segala sesuatu, Saudara-saudara yang terkasih, adalah untuk membangun kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: selama ini
  rationale: Dalam pertanyaan retoris ini, kata tersebut menunjuk pada anggapan yang berlangsung hingga saat sekarang, bukan sekadar waktu lampau yang jauh.
- source_word: δοκεῖτε
  choice: kalian mengira
  rationale: Mengungkapkan anggapan para pembaca secara alami; unsur keberlangsungannya sudah dibawa oleh “selama ini”.
- source_word: ὑμῖν ἀπολογούμεθα
  choice: kami sedang membela diri di hadapan kalian
  rationale: Mempertahankan nuansa pembelaan diri dan menjadikan pihak yang mendengar pembelaan itu jelas dalam bahasa Indonesia.
- source_word: κατέναντι θεοῦ
  choice: Di hadapan Allah
  rationale: Menyampaikan gagasan bahwa perkataan itu disampaikan dalam kehadiran dan di bawah penilaian Allah.
- source_word: ἐν Χριστῷ
  choice: dalam Kristus
  rationale: Mempertahankan ungkapan relasional yang padat dan khas Paulus tanpa mempersempit maknanya menjadi sekadar “oleh” atau “atas nama”.
- source_word: λαλοῦμεν
  choice: kami berbicara
  rationale: Padanan langsung dan wajar untuk tindakan berbicara yang sedang Paulus lakukan.
- source_word: τὰ δὲ πάντα
  choice: Namun semuanya
  rationale: “Semuanya” mempertahankan cakupan luas yang tidak dirinci, sedangkan “namun” menyatakan peralihan dari dugaan pembelaan diri kepada tujuan sebenarnya.
- source_word: ἀγαπητοί
  choice: Saudara-saudara terkasih
  rationale: Sapaan jemaat yang hangat, bermartabat, dan lazim dipahami, tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: untuk membangun kalian
  rationale: Mempertahankan metafora pembangunan rohani dalam bentuk yang alami dan mudah dipahami.
theological_decisions:
- issue: Makna ἐν Χριστῷ
  choice: dalam Kristus
  alternative: dalam Mesias
  rationale: “Kristus” paling alami dalam frasa Paulus yang mapan “dalam Kristus”, sementara preposisi ἐν tetap dipertahankan agar gagasan kesatuan, lingkup, atau hubungan dengan Kristus tidak dipersempit.
- issue: Tujuan “semuanya”
  choice: untuk membangun kalian
  alternative: demi pertumbuhan rohani kalian
  rationale: Metafora οἰκοδομή dipertahankan daripada dijelaskan secara teologis, sehingga keluasan makna penguatan dan pembangunan jemaat tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak ὑμεῖς secara terang; sapaan “Saudara-saudara terkasih” menjaga kehangatan pastoral. Struktur tiga kalimat mempertahankan daya retoris teks Yunani.
