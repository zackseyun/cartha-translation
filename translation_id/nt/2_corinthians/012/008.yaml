  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: id
  text: Mengenai hal ini[a], tiga kali aku memohon[b] kepada Tuhan[c] agar itu menjauh dariku[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan ‘Tentang hal ini’ atau ‘Karena hal ini.’
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan ‘meminta dengan sangat’ atau ‘memohon dengan sungguh-sungguh.’
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani hanya mengatakan ‘Tuhan’; Paulus tidak secara eksplisit menyebut nama Yesus di sini.
    reason: alternative_reading
  - marker: d
    text: Dapat juga diterjemahkan ‘itu pergi dariku’ atau ‘itu meninggalkan aku.’ Dalam teks Yunani, subjek verba ini tersirat dan merujuk kembali kepada penderitaan yang disebut pada ayat sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Mengenai hal ini
  rationale: ὑπέρ dengan bentuk genitif di sini memperkenalkan perkara yang sedang dibicarakan dan merujuk kembali kepada penderitaan pada ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia tanpa memberi arti ‘demi’ atau ‘untuk kepentingan.’
- source_word: τρὶς
  choice: tiga kali
  rationale: Kata keterangan ini menunjukkan tiga kesempatan atau tiga kali permohonan; padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: κύριος diterjemahkan dengan padanan baku ‘Tuhan.’ Dalam konteks ini kemungkinan besar yang dimaksud ialah Yesus, tetapi teks Yunani tidak menyebut nama-Nya secara eksplisit.
- source_word: παρεκάλεσα
  choice: aku memohon kepada
  rationale: Dalam konteks doa untuk memperoleh kelegaan, παρακαλέω menyatakan permohonan yang sungguh-sungguh. ‘Memohon kepada’ alami dan tidak melebih-lebihkan intensitas kata Yunani.
- source_word: ἵνα
  choice: agar
  rationale: ἵνα memperkenalkan isi atau tujuan permohonan; ‘agar’ menyampaikan hubungan tersebut secara ringkas dan idiomatis.
- source_word: ἀποστῇ
  choice: itu pergi
  rationale: Bentuk verba ini berarti pergi, menjauh, atau meninggalkan. Subjeknya tersirat dalam bahasa Yunani; kata ‘itu’ mempertahankan rujukan umum kepada penderitaan yang disebut sebelumnya tanpa menentukan apakah yang dimaksud duri atau utusan.
- source_word: ἀπ’ ἐμοῦ
  choice: dariku
  rationale: Ungkapan ini menyatakan pemisahan dari Paulus. ‘Dariku’ merupakan padanan langsung, ringkas, dan alami.
theological_decisions:
- issue: Rujukan kata ‘Tuhan’
  choice: Tetap diterjemahkan ‘Tuhan’ tanpa menambahkan nama Yesus.
  alternative: Tuhan Yesus
  rationale: Konteks Paulus sangat mungkin menunjuk kepada Yesus, tetapi teks hanya mengatakan κύριον. Terjemahan tidak menambahkan kekhususan yang tidak dinyatakan secara eksplisit.
- issue: Subjek tersirat dari ἀποστῇ
  choice: Menggunakan ‘itu’ sebagai subjek netral.
  alternative: dia; utusan itu; duri itu
  rationale: Konteks sebelumnya menyebut ‘duri dalam daging’ sekaligus ‘utusan Iblis.’ ‘Itu’ menjaga ketidakjelasan rujukan dalam teks dan tidak memutuskan apakah Paulus terutama memaksudkan duri atau utusan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina ‘aku’ mengikuti suara pribadi Paulus; susunan kalimat tetap dekat dengan teks Yunani, sedangkan ‘itu’ sengaja mempertahankan ambiguitas rujukan.
