translation:
  language: id
  text: Pernahkah aku mengambil keuntungan dari kalian melalui seorang pun dari mereka yang kuutus kepada kalian?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memanfaatkan kalian” atau “menipu kalian”. Kata kerja Yunani ini mengandung arti memperoleh keuntungan dengan merugikan orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: Apakah aku pernah ...?
  rationale: μή memperkenalkan pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk ini alami dalam bahasa Indonesia, sedangkan konteks menunjukkan bahwa Paulus menyangkal tuduhan tersebut.
- source_word: τινα ὧν
  choice: salah seorang yang
  rationale: Ungkapan ini menunjuk kepada seorang mana pun dari kelompok orang yang pernah Paulus utus; 'salah seorang yang' mempertahankan nuansa partitif secara alami.
- source_word: ἀπέσταλκα
  choice: kuutus
  rationale: Perfek Yunani merujuk pada orang-orang yang telah Paulus utus. Bentuk lampau tersirat secara wajar oleh konteks tanpa perlu ungkapan yang lebih berat seperti 'telah kuutus'.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Ini menyampaikan arah pengutusan kepada jemaat Korintus dan menjelaskan bahwa pronomina jamak Yunani merujuk kepada mereka secara kolektif.
- source_word: δι’ αὐτοῦ
  choice: melalui salah seorang
  rationale: Secara harfiah frasa ini berbentuk tunggal, 'melalui dia'. Dalam konstruksi distributif bersama τινα ὧν, bahasa Indonesia paling alami menyatukannya sebagai 'melalui salah seorang yang kuutus'.
- source_word: ἐπλεονέκτησα
  choice: mengambil keuntungan dari
  rationale: Kata kerja ini menyatakan pencarian keuntungan dengan mengorbankan atau merugikan pihak lain. Pilihan ini mempertahankan cakupan makna yang dapat mencakup eksploitasi maupun penipuan tanpa mempersempitnya secara tidak perlu.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina orang kedua jamak ditujukan kepada jemaat Korintus; 'kalian' membedakan bentuk jamak itu dengan jelas dan tetap alami.
