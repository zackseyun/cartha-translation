  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: id
  text: Aku meminta Titus untuk pergi dan mengutus saudara itu bersamanya. Titus tidak memanfaatkan kalian, bukan? Bukankah kami berjalan dalam semangat yang sama[a]? Bukankah kami mengikuti jejak yang sama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh Roh yang sama,” mungkin menunjuk kepada Roh Kudus, bukan sekadar sikap atau watak yang sama.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: Aku meminta Titus untuk pergi
  rationale: Dalam konteks penugasan praktis, παρακαλέω menyatakan permintaan yang sungguh-sungguh. Frasa “untuk pergi” tersirat oleh konteks dan diperlukan agar kalimat alami dalam bahasa Indonesia.
- source_word: συναπέστειλα
  choice: mengutus ... bersamanya
  rationale: Kata kerja majemuk ini menyatakan bahwa seseorang diutus bersama Titus; “bersamanya” mengungkapkan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: τὸν ἀδελφόν
  choice: saudara itu
  rationale: Artikel tertentu dipertahankan dengan “itu”, tanpa menambahkan kata milik seperti “saudara kami”; yang dimaksud tampaknya seorang saudara seiman yang dikenal para pembaca.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: Titus tidak mengambil keuntungan dari kalian, bukan?
  rationale: μήτι memperkenalkan pertanyaan yang mengharapkan jawaban negatif. “Mengambil keuntungan dari” mempertahankan cakupan makna tindakan mencari keuntungan dengan merugikan orang lain tanpa mempersempitnya hanya pada penipuan keuangan.
- source_word: τῷ αὐτῷ πνεύματι
  choice: dalam semangat yang sama
  rationale: Bentuk datif dapat menyatakan lingkup atau cara. “Semangat” secara alami menunjuk pada sikap atau dorongan batin yang sama, sementara catatan kaki mempertahankan kemungkinan bahwa yang dimaksud adalah Roh Kudus.
- source_word: περιεπατήσαμεν
  choice: kami berjalan
  rationale: Metafora “berjalan” dipertahankan karena dapat dipahami sebagai cara hidup atau perilaku dan menjaga corak ungkapan Paulus.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: mengikuti jejak yang sama
  rationale: ἴχνος berarti jejak atau bekas langkah dan secara metaforis menunjuk pada pola perilaku. “Mengikuti jejak” alami dalam bahasa Indonesia serta mempertahankan gambaran aslinya.
theological_decisions:
- issue: Makna τῷ αὐτῷ πνεύματι
  choice: “dalam semangat yang sama,” terutama dipahami sebagai sikap atau dorongan batin yang sama
  alternative: “oleh Roh yang sama,” dengan rujukan kepada Roh Kudus
  rationale: Konteks langsung menekankan keselarasan integritas dan perilaku Paulus dengan Titus. Namun, bentuk Yunani juga memungkinkan rujukan kepada Roh Kudus, sehingga kemungkinan itu tidak ditutup dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan “kalian” dipakai untuk menunjukkan bahwa ὑμᾶς berbentuk jamak. Dua pertanyaan retoris terakhir dipertahankan sebagai dua kalimat untuk mengikuti struktur Yunani.
