reference: 2 Corinthians 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: id
  text: Aku telah menjadi orang bodoh; kalianlah yang memaksaku berbuat demikian. Sebab, seharusnya aku mendapat pujian dari kalian. Sebab, aku sedikit pun tidak kalah dibandingkan dengan rasul-rasul yang luar biasa hebat itu[a], sekalipun aku bukan apa-apa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rasul-rasul yang paling terkemuka.” Ungkapan Yunani ini sangat kuat dan dalam konteksnya mungkin bernada ironis.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα ἄφρων
  choice: Aku telah menjadi orang bodoh
  rationale: Bentuk perfek Γέγονα menyatakan keadaan kini sebagai hasil dari tindakan sebelumnya; frasa ini mempertahankan gambaran Paulus tentang dirinya sebagai ‘orang bodoh’ dalam konteks pembelaan yang ironis.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: kalianlah yang memaksaku berbuat demikian
  rationale: Partikel -lah menandai penekanan pada ὑμεῖς, sedangkan ‘berbuat demikian’ menyatakan tindakan membanggakan diri yang tersirat dari konteks tanpa memasukkannya secara berlebihan ke dalam teks.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: mendapat pujian dari kalian
  rationale: Bentuk pasif dan pelaku yang dinyatakan dengan ὑπό dipertahankan. Dalam konteks ini συνίστημι berarti berbicara untuk mendukung atau memuji kelayakan seseorang.
- source_word: οὐδὲν ... ὑστέρησα
  choice: aku sedikit pun tidak kalah
  rationale: Ungkapan ini menyatakan bahwa Paulus tidak berada di bawah atau tidak lebih rendah daripada pihak yang dibandingkan; ‘sedikit pun tidak kalah’ alami dan mempertahankan daya perbandingannya.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: rasul-rasul yang luar biasa hebat itu
  rationale: ὑπερλίαν merupakan penguat yang sangat kuat. Pilihan ini dapat dibaca secara harfiah ataupun ironis sesuai konteks, tanpa menambahkan kata ‘yang disebut’ atau penanda ironi lain yang tidak eksplisit dalam bahasa Yunani.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: sekalipun aku bukan apa-apa
  rationale: ‘Sekalipun’ mempertahankan hubungan konsesif, dan ‘bukan apa-apa’ menyampaikan perendahan diri Paulus secara dekat dengan οὐδέν tanpa mengubahnya menjadi ‘bukan siapa-siapa.’
theological_decisions:
- issue: Daya dan kemungkinan ironi dalam τῶν ὑπερλίαν ἀποστόλων
  choice: rasul-rasul yang luar biasa hebat itu
  alternative: rasul-rasul yang paling terkemuka; rasul-rasul super
  rationale: Konteks 2 Korintus memungkinkan ungkapan ini bersifat ironis atau polemis, tetapi teks Yunani tidak menandainya secara eksplisit sebagai ‘yang disebut.’ Terjemahan utama mempertahankan hiperbola dan membiarkan pembaca menangkap kemungkinan ironi tersebut.
- issue: Hubungan antara keunggulan kerasulan dan pengakuan bahwa Paulus ‘bukan apa-apa’
  choice: sekalipun aku bukan apa-apa
  alternative: meskipun aku bukan apa-apa
  rationale: Rumusan ini mempertahankan ketegangan antara pembelaan Paulus bahwa ia tidak kalah dan pengakuan dirinya sebagai bukan apa-apa, tanpa menjelaskan atau menyelaraskan kedua pernyataan itu secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’ agar penekanan pada ὑμεῖς terdengar jelas. Nada dibuat lugas dan bermartabat, sambil mempertahankan pengulangan ‘Sebab’ untuk dua kemunculan γάρ dan menjaga alur argumentasi Paulus.
