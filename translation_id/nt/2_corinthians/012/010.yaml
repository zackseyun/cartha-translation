id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: id
  text: Karena itu, aku menerima dengan senang hati kelemahan, penghinaan, kesukaran, penganiayaan, dan kesesakan demi Mesias[a]. Sebab ketika aku lemah, saat itulah aku kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara tradisional, “Kristus.”
    reason: Mencatat padanan tradisional bagi gelar Yunani Χριστός.
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: εὐδοκῶ
  choice: aku menerima dengan senang hati
  rationale: Menyampaikan sikap positif berupa kesenangan atau kerelaan yang sungguh-sungguh, bukan sekadar kepasrahan, sambil tetap alami dalam bahasa Indonesia ketika diikuti daftar penderitaan.
- source_word: ἐν ἀσθενείαις
  choice: kelemahan
  rationale: Mempertahankan arti luas yang mencakup berbagai bentuk kerapuhan dan tidak mempersempitnya menjadi penyakit jasmani.
- source_word: ἐν ὕβρεσιν
  choice: penghinaan
  rationale: Mengungkapkan perlakuan kasar yang merendahkan atau mempermalukan.
- source_word: ἐν ἀνάγκαις
  choice: kesukaran
  rationale: Dalam konteks ini menunjuk pada keadaan sulit dan keterpaksaan yang menekan; pilihan ini membedakannya dari στενοχωρίαις.
- source_word: ἐν διωγμοῖς
  choice: penganiayaan
  rationale: Istilah baku dan jelas untuk penderitaan akibat pengejaran atau permusuhan karena kesetiaan kepada Mesias.
- source_word: καὶ στενοχωρίαις
  choice: dan kesesakan
  rationale: Mempertahankan gambaran tekanan berat atau keadaan yang menghimpit.
- source_word: ὑπὲρ Χριστοῦ
  choice: demi Mesias
  rationale: ὑπέρ menyatakan bahwa penderitaan itu dialami karena dan demi kesetiaan kepada Χριστός; 'Mesias' mempertahankan fungsi gelarnya.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: Sebab ketika aku lemah
  rationale: Mengungkapkan hubungan alasan dan keadaan umum yang diperkenalkan oleh ὅταν dengan bentuk Indonesia yang wajar.
- source_word: τότε δυνατός εἰμι
  choice: saat itulah aku kuat
  rationale: Mempertahankan pertentangan langsung antara lemah dan kuat serta memberi penekanan pada τότε.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός tetap dapat dipahami sebagai gelar. 'Mesias' mempertahankan latar dan daya titularnya, sedangkan bentuk tradisional 'Kristus' dicantumkan dalam catatan kaki tanpa menghapus kemungkinan tersebut.
- issue: Paradoks kelemahan dan kekuatan
  choice: ketika aku lemah, saat itulah aku kuat
  alternative: ketika aku lemah, kuasa bekerja di dalam diriku
  rationale: Terjemahan utama mempertahankan bentuk paradoks eksplisit teks Yunani dan tidak menambahkan penjelasan teologis yang tidak dinyatakan langsung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti orang pertama 'aku' mengikuti suara pribadi Paulus. Daftar penderitaan disusun tanpa mengulang preposisi agar alami dalam bahasa Indonesia, sementara urutan unsur sumber dipertahankan.
