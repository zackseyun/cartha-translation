id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: id
  text: bahwa ia diangkat ke Firdaus dan mendengar kata-kata yang tak terucapkan, yang tidak boleh diucapkan manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: diangkat
  rationale: Bentuk pasif aoristus ini menyatakan bahwa ia dibawa atau direnggut oleh kuasa di luar dirinya; “diangkat” alami dalam konteks ini tanpa menentukan pelakunya secara eksplisit.
- source_word: παράδεισον
  choice: Firdaus
  rationale: Padanan baku dan bermartabat untuk παράδεισος dalam konteks surgawi.
- source_word: ἄρρητα ῥήματα
  choice: kata-kata yang tak terucapkan
  rationale: Mempertahankan kemungkinan bahwa kata-kata itu tidak dapat diungkapkan, tanpa menghapus kaitannya dengan larangan pada klausa berikut.
- source_word: οὐκ ἐξὸν
  choice: tidak boleh
  rationale: Menyampaikan makna tidak diizinkan atau tidak patut menurut batas yang berlaku, bukan sekadar ketidakmampuan.
- source_word: ἀνθρώπῳ
  choice: manusia
  rationale: Nomina tunggal generik menunjuk manusia sebagai manusia, bukan khusus laki-laki.
- source_word: λαλῆσαι
  choice: diucapkan
  rationale: Padanan alami bagi tindakan menyuarakan atau menuturkan kata-kata tersebut.
theological_decisions:
- issue: 'Sifat kata-kata yang didengar: tidak dapat diungkapkan atau tidak boleh diucapkan'
  choice: kata-kata yang tak terucapkan, yang tidak boleh diucapkan manusia
  alternative: kata-kata yang tak terkatakan, yang tidak diizinkan untuk diucapkan manusia
  rationale: 'Terjemahan mempertahankan ketegangan antara ἄρρητα dan οὐκ ἐξὸν: deskripsi pertama tidak dipersempit hanya menjadi larangan, sedangkan klausa kedua secara jelas menyatakan ketidakbolehan.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat mengikuti hubungan antarklausa Yunani sambil tetap alami; “ia” mempertahankan rujukan orang ketiga dari konteks sebelumnya.
