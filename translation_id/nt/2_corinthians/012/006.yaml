source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: id
  text: Sebab, jika saya ingin bermegah, saya tidak akan menjadi orang bodoh, karena saya akan mengatakan kebenaran. Namun, saya menahan diri supaya tidak seorang pun menilai saya lebih tinggi daripada apa yang ia lihat pada diri saya atau yang ia dengar dari saya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendengar sesuatu dari saya.” Teks Yunani secara eksplisit memuat unsur tak tentu setelah “mendengar,” yang dapat dibiarkan tersirat dalam bahasa Indonesia yang idiomatis.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήσω
  choice: seandainya saya ingin
  rationale: Konstruksi ἐὰν dengan aoristus subjungtif menyatakan kemungkinan hipotesis; “seandainya saya ingin” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: καυχήσασθαι
  choice: bermegah
  rationale: “Bermegah” mempertahankan istilah penting yang berulang dalam konteks Paulus dan dapat memuat nuansa ironi maupun pembelaan diri.
- source_word: ἄφρων
  choice: bodoh
  rationale: Kata sifat predikatif ini menyatakan bahwa Paulus tidak akan bertindak atau terbukti bodoh dalam keadaan yang dibayangkan.
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: karena saya akan mengatakan kebenaran
  rationale: Bentuk futurum dipertahankan dalam lingkup kondisi, sedangkan “mengatakan kebenaran” mencerminkan ungkapan Yunani secara jelas dan wajar.
- source_word: φείδομαι
  choice: saya menahan diri
  rationale: Dalam konteks ini verba tersebut menunjukkan bahwa Paulus sengaja tidak melanjutkan kemegahannya.
- source_word: λογίσηται
  choice: menilai
  rationale: “Menilai” menangkap tindakan membentuk penaksiran tentang Paulus, bukan sekadar memikirkan dirinya.
- source_word: ὑπὲρ ὃ
  choice: lebih tinggi daripada apa yang
  rationale: Ungkapan ini menunjukkan penilaian yang melampaui dasar yang dapat diamati atau didengar.
- source_word: βλέπει με
  choice: dilihatnya pada diri saya
  rationale: Pilihan ini menyampaikan bahwa penilaian itu harus didasarkan pada apa yang nyata dan dapat diamati dalam diri Paulus.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: apa yang didengarnya dari saya
  rationale: “Apa yang” mewakili unsur tak tentu τι secara alami, sementara “dari saya” mempertahankan ἐξ ἐμοῦ sebagai sumber perkataan yang didengar.
theological_decisions:
- issue: Kemegahan Paulus dan tindakannya menahan diri
  choice: 'Pernyataan dipertahankan sebagai kondisi hipotetis: Paulus dapat mengatakan hal yang benar tanpa menjadi bodoh, tetapi tetap memilih menahan diri.'
  alternative: Menafsirkan ayat ini sebagai pembenaran umum atas kemegahan, atau sebaliknya sebagai pernyataan bahwa segala kemegahan pasti dusta atau berdosa.
  rationale: Teks Yunani menempatkan kebenaran klaim Paulus berdampingan dengan keputusannya untuk menahan diri agar orang lain tidak menilainya secara berlebihan. Terjemahan tidak menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan mudah dipahami, dengan nada bermartabat. Kata ganti “saya” dipakai untuk suara personal Paulus yang alami; “bermegah” dipertahankan demi kesinambungan istilah dalam bagian ini.
