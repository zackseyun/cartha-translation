source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: id
  text: Dan Ia telah berkata kepadaku, “Anugerah-Ku cukup bagimu, sebab kuasa menjadi sempurna dalam kelemahan.”[a] Karena itu, aku akan dengan sangat senang hati bermegah lebih lagi dalam kelemahan-kelemahanku, supaya kuasa Mesias menaungi aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “kuasa-Ku menjadi sempurna dalam kelemahan.”
    reason: textual_variant
  - marker: b
    text: Secara lebih harfiah, “supaya kuasa Mesias mendirikan kemah di atasku”; dapat juga diterjemahkan, “berdiam di atasku” atau “bernaung atasku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: telah berkata
  rationale: Bentuk perfektum menunjuk pada perkataan yang telah disampaikan dan tetap berlaku; “telah berkata” mempertahankan aspek lampau tanpa menambahkan penafsiran.
- source_word: Ἀρκεῖ
  choice: cukup
  rationale: Ungkapan “cukup bagimu” alami dalam bahasa Indonesia dan menyampaikan kecukupan anugerah.
- source_word: χάρις
  choice: anugerah
  rationale: “Anugerah” mempertahankan bobot teologis χάρις dalam pemakaian Paulus sekaligus mudah dipahami pembaca modern.
- source_word: δύναμις
  choice: kuasa
  rationale: “Kuasa” cocok pada kedua kemunculan gagasan ini dan mempertahankan hubungan antara kuasa ilahi dan kuasa Mesias.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: kelemahan / kelemahan-kelemahanku
  rationale: Bentuk tunggal generik dan bentuk jamak yang merujuk pada pengalaman Paulus dibedakan sebagaimana dalam bahasa Yunani.
- source_word: τελεῖται
  choice: menjadi sempurna
  rationale: Terjemahan ini mempertahankan bentuk pasif-konseptual dan ketegangan ungkapan bahwa kuasa mencapai penyempurnaannya dalam kelemahan, tanpa menjabarkan bagaimana hal itu terjadi.
- source_word: ἥδιστα … μᾶλλον
  choice: justru akan bermegah dengan sangat senang hati
  rationale: “Dengan sangat senang hati” membawa daya superlatif ἥδιστα, sedangkan “justru” menyampaikan kontras μᾶλλον secara alami tanpa tumpang tindih adverbial.
- source_word: καυχήσομαι
  choice: akan bermegah
  rationale: '“Bermegah” mempertahankan paradoks retoris Paulus: ia bermegah bukan dalam kekuatan, melainkan dalam kelemahan.'
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: menaungi aku
  rationale: Pilihan ini menyampaikan gambaran mendirikan kemah atau berdiam di atas seseorang dalam bahasa Indonesia yang wajar; gambaran harfiahnya dijelaskan dalam catatan.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam frasa “kuasa Mesias”; “Mesias” mempertahankan arti gelar tersebut.
theological_decisions:
- issue: Ada atau tidaknya kata ganti milik pada δύναμις
  choice: sebab kuasa menjadi sempurna dalam kelemahan
  alternative: sebab kuasa-Ku menjadi sempurna dalam kelemahan
  rationale: Teks utama SBLGNT yang diberikan tidak memuat μου setelah δύναμις. Kata ganti milik tidak ditambahkan secara diam-diam; varian yang memuatnya dicatat.
- issue: Makna τελεῖται sehubungan dengan kuasa ilahi
  choice: menjadi sempurna
  alternative: mencapai kepenuhannya
  rationale: Terjemahan utama mempertahankan paradoks dan ketegangan teologis dalam ungkapan Yunani, alih-alih menguraikannya sebagai sekadar “dinyatakan sepenuhnya”.
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός dapat dipahami sebagai gelar; “Mesias” mengungkapkan nilai gelarnya secara langsung tanpa menyangkal bahwa “Kristus” adalah padanan tradisional.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. “Dia” merujuk kepada Tuhan dalam konteks dan ditulis dengan huruf kapital. Susunan kalimat menjaga paradoks kelemahan dan kuasa serta tidak memasukkan kata ganti milik yang tidak terdapat dalam teks utama SBLGNT.
