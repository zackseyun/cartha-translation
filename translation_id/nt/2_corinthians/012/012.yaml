  to: Sesungguhnya, tanda-tanda seorang rasul telah dikerjakan di tengah-tengah kalian dengan segala ketabahan, disertai tanda-tanda, keajaiban, dan tindakan-tindakan penuh kuasa.[a]
  rationale: Revisi terbatas pada padanan ὑπομονή yang lebih tepat secara semantis dan pelicinan bentuk jamak “keajaiban” agar lebih wajar dalam bahasa Indonesia modern. Struktur pasif, ambiguitas mengenai pelaku, arti generik “seorang rasul,” serta tiga serangkai tanda, keajaiban, dan kuasa tetap dipertahankan.
