  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: id
  text: Sesungguhnya, tanda-tanda seorang rasul telah dikerjakan di tengah-tengah kalian dengan segala ketabahan, disertai tanda-tanda, keajaiban, dan tindakan-tindakan penuh kuasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tindakan-tindakan penuh kuasa” juga dapat diterjemahkan “mukjizat-mukjizat”; istilah Yunaninya menekankan tindakan yang memperlihatkan kuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Sesungguhnya, tanda-tanda
  rationale: μέν tanpa pasangan δέ yang dinyatakan memberi penegasan; “sesungguhnya” menyampaikan tekanan itu secara wajar, sedangkan σημεῖα dipertahankan sebagai “tanda-tanda”.
- source_word: τοῦ ἀποστόλου
  choice: seorang rasul
  rationale: Genitif ini paling wajar dipahami secara kualitatif atau generik, yakni tanda-tanda yang mencirikan seorang rasul, tanpa menutup kemungkinan bahwa dalam konteksnya Paulus sedang menunjuk pada kerasulannya sendiri.
- source_word: κατειργάσθη
  choice: telah dikerjakan
  rationale: Bentuk pasif aoristus menyatakan bahwa tanda-tanda itu telah diwujudkan atau dihasilkan. Bentuk pasif dipertahankan tanpa menentukan pelakunya secara eksplisit.
- source_word: ἐν ὑμῖν
  choice: di tengah-tengah kalian
  rationale: Konteks menunjuk pada apa yang terjadi dalam komunitas dan di hadapan jemaat Korintus, bukan terutama di dalam batin mereka.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: dengan segala ketekunan
  rationale: ὑπομονή menunjuk pada ketabahan yang terus bertahan di tengah kesulitan; “ketekunan” merupakan padanan Indonesia yang alami dan sesuai konteks pelayanan.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: disertai tanda-tanda, keajaiban-keajaiban, dan perbuatan-perbuatan penuh kuasa
  rationale: Rangkaian tiga istilah dipertahankan secara berbeda. δυνάμεις diterjemahkan secara idiomatis sebagai tindakan yang memperlihatkan kuasa, sementara hubungan frasa dipahami sebagai penjelasan yang menyertai klaim utama.
theological_decisions:
- issue: Makna “tanda-tanda seorang rasul”
  choice: Ungkapan ini menyatakan bukti atau ciri yang mengesahkan pelayanan kerasulan, yang dalam ayat ini berkaitan dengan ketekunan serta karya-karya ajaib.
  alternative: Ungkapan ini hanya menunjuk pada mukjizat sebagai tanda khas kerasulan.
  rationale: Susunan kalimat menempatkan “tanda-tanda seorang rasul” sebagai klaim utama, lalu menyebut ketekunan dan fenomena ajaib. Terjemahan tidak menetapkan daftar ciri kerasulan atau mempersempitnya hanya pada mukjizat.
- issue: Hubungan tanda-tanda dengan pelakunya
  choice: Mempertahankan bentuk pasif “telah dikerjakan” tanpa menyebut pelaku.
  alternative: Menyatakan secara eksplisit bahwa Paulus atau Allah mengerjakan tanda-tanda itu.
  rationale: Teks Yunani menggunakan bentuk pasif dan tidak menyebut pelaku; ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak ὑμῖν dengan jelas. Pengulangan “tanda-tanda” dipertahankan karena terdapat dalam teks Yunani; “disertai” membuat hubungan penjelas pada rangkaian terakhir terbaca alami.
