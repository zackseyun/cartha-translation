  terminology: “Membebani,” “licik,” dan “tipu daya” adalah padanan baku yang tepat. “Menangkap kalian” dapat dipertahankan sebagai pengungkapan yang relatif dekat dengan ἔλαβον dalam konteks tuduhan; catatan alternatif secara memadai menjelaskan kemungkinan “menjerat” atau “memanfaatkan.”
