source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: id
  text: 'Baiklah, anggap saja demikian: aku tidak membebani kalian.[a] Tetapi, sebagai orang licik, aku menangkap kalian dengan tipu daya.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kalaupun demikian” atau “Baiklah, anggap saja begitu.” Paulus tampaknya menerima pokok ini untuk sementara demi argumentasi.
    reason: lexical_alternative
  - marker: b
    text: Perkataan “sebagai orang licik, aku menangkap kalian dengan tipu daya” kemungkinan besar merupakan pengulangan ironis Paulus atas tuduhan terhadap dirinya, bukan pengakuan bahwa ia benar-benar berbuat demikian.
    reason: alternative_reading
  - marker: c
    text: Atau “aku menjerat kalian dengan kelicikan” atau “aku memanfaatkan kalian dengan tipu daya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Namun, baiklah, anggap saja demikian
  rationale: Ungkapan konsesif-retoris ini menunjukkan bahwa Paulus menerima suatu pokok untuk sementara demi argumentasi, tanpa mengakuinya sebagai benar.
- source_word: κατεβάρησα
  choice: membebani
  rationale: Mempertahankan metafora Yunani dan, dalam konteks 2 Korintus, mencakup beban material atau keuangan.
- source_word: ὑπάρχων
  choice: karena aku ini
  rationale: Menyampaikan keadaan yang dinyatakan partisip tanpa menambahkan penjelasan panjang; hubungan logisnya tetap cukup terbuka dalam konteks ujaran ironis.
- source_word: πανοῦργος
  choice: licik
  rationale: Kata ini bernada negatif dan menunjuk pada kecerdikan yang tidak jujur; 'licik' alami dan tepat dalam tuduhan yang sedang digaungkan Paulus.
- source_word: δόλῳ
  choice: dengan tipu daya
  rationale: Menerjemahkan datif instrumental secara langsung dan mempertahankan nada tuduhan tentang cara yang menipu.
- source_word: ἔλαβον
  choice: menangkap
  rationale: Dalam konteks siasat, verba ini dapat berarti menangkap atau menjerat. 'Menangkap' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'mengambil kalian' dan tidak seinterpretatif 'memanfaatkan kalian'.
theological_decisions:
- issue: Apakah perkataan sesudah ἀλλὰ merupakan pengakuan Paulus atau pengulangan ironis atas tuduhan terhadapnya
  choice: Klausa diterjemahkan secara langsung—'karena aku ini licik, aku menangkap kalian dengan tipu daya'—sementara catatan menjelaskan kemungkinan kuat bahwa ini adalah ironi.
  alternative: Tetapi, sebagai orang licik, aku memperdaya kalian.
  rationale: Konteks selanjutnya menolak bahwa Paulus mengeksploitasi jemaat. Terjemahan utama mempertahankan bentuk tuduhan dan ketegangan retoris, tanpa mengubahnya menjadi pengakuan literal ataupun menjelaskan ironi di dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan pronomina jamak 'kalian' untuk membedakan ὑμᾶς dari bentuk tunggal. Nada dibuat bermartabat tetapi tetap lisan dan tajam, sesuai retorika Paulus. Penanda catatan kaki [a], [b], dan [c] semuanya dicantumkan dalam teks utama.
