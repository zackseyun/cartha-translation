  to: Bermegah itu perlu. Memang, hal itu tidak bermanfaat, tetapi aku akan beralih kepada penglihatan dan penyataan Tuhan.[a]
  rationale: Revisi mempertahankan kontras μέν ... δέ dan arah wacana ἐλεύσομαι δὲ εἰς, sambil menghindari penambahan subjek eksplisit pada infinitif Καυχᾶσθαι. Nomina jamak dirender tanpa reduplikasi demi kelancaran bahasa Indonesia; pluralitas sumber tetap tercakup. Catatan kaki tetap ditambatkan pada “Tuhan” dan menyatakan, tanpa menjadikannya teks utama, kemungkinan bahwa genitif κυρίου bermakna sumber.
