source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: id
  text: Bermegah itu perlu. Memang, hal itu tidak bermanfaat, tetapi aku akan beralih kepada penglihatan dan penyataan Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penglihatan dan penyataan yang berasal dari Tuhan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι δεῖ
  choice: Aku harus bermegah
  rationale: Infinitif Καυχᾶσθαι dengan δεῖ menyatakan keharusan. Dalam konteks Paulus sedang berbicara tentang dirinya sendiri, sehingga bentuk personal ini alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: οὐ συμφέρον μέν
  choice: Memang, hal itu tidak bermanfaat
  rationale: συμφέρον menunjuk pada sesuatu yang berguna atau membawa manfaat. μέν menyiapkan pertentangan dengan δέ dan secara alami dicerminkan oleh pasangan 'memang ... tetapi'.
- source_word: ἐλεύσομαι δὲ εἰς
  choice: tetapi aku akan beralih kepada
  rationale: Dalam konteks ini, ἔρχομαι εἰς menandai perpindahan ke pokok pembicaraan berikutnya. 'Beralih kepada' lebih alami daripada terjemahan harfiah 'datang kepada'.
- source_word: ὀπτασίας
  choice: penglihatan-penglihatan
  rationale: ὀπτασία mengacu pada sesuatu yang dilihat dalam pengalaman visioner. Bentuk ulang mempertahankan jamak Yunani secara jelas.
- source_word: ἀποκαλύψεις
  choice: penyataan-penyataan
  rationale: ἀποκάλυψις berarti penyingkapan atau penyataan. 'Penyataan' merupakan padanan yang wajar dan dapat dipahami dalam konteks pewahyuan ilahi.
- source_word: κυρίου
  choice: Tuhan
  rationale: Genitif Yunani menerangkan baik 'penglihatan-penglihatan' maupun 'penyataan-penyataan'. Susunan '... Tuhan' mempertahankan relasi yang tidak dirinci oleh teks sumber, alih-alih langsung menentukannya sebagai sumber.
theological_decisions:
- issue: Hubungan κυρίου dengan penglihatan dan penyataan
  choice: penglihatan-penglihatan dan penyataan-penyataan Tuhan
  alternative: penglihatan-penglihatan dan penyataan-penyataan yang berasal dari Tuhan
  rationale: Genitif dapat menyatakan sumber atau hubungan lain. Terjemahan utama mempertahankan ungkapan yang ringkas dan ambiguitas asli, sedangkan catatan kaki menyebutkan pemahaman sumber yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pasangan 'memang ... tetapi' mencerminkan struktur μέν ... δέ dengan alami; istilah 'bermegah', 'penglihatan', 'penyataan', dan 'Tuhan' menjaga kesinambungan kosakata teologis tanpa mempersempit ambiguitas sumber.
