  - severity: low
    issue: Pengulangan nomina untuk bentuk jamak terasa kurang alami.
    rationale: “Penglihatan-penglihatan dan penyataan-penyataan” dapat dipahami, tetapi bahasa Indonesia baku lazim memakai nomina tanpa reduplikasi ketika pluralitas sudah jelas dari konteks. Bentuk tanpa pengulangan lebih lancar tanpa mengubah makna.
