source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: id
  text: Sebab, dalam hal apa kalian diperlakukan sebagai lebih rendah daripada jemaat-jemaat lain,[a] selain bahwa aku sendiri tidak menjadi beban bagi kalian?[b] Maafkanlah aku atas kesalahan ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibuat lebih rendah daripada jemaat-jemaat lain.” Kata kerja Yunani ini dapat berarti ditempatkan pada posisi yang kurang menguntungkan atau diperlakukan sebagai pihak yang lebih rendah.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, Paulus tidak membebani mereka secara keuangan dengan menerima sokongan dari mereka.
    reason: cultural_note
  - marker: c
    text: 'Paulus berbicara secara ironis: “kesalahan” yang dimaksud ialah bahwa ia tidak mau menjadi beban bagi mereka.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: kalian diperlakukan lebih rendah
  rationale: Bentuk pasif ini menyatakan bahwa jemaat Korintus ditempatkan pada posisi yang kurang menguntungkan atau lebih rendah dalam perbandingan, bukan bahwa mereka pada hakikatnya lebih rendah.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: daripada jemaat-jemaat lain
  rationale: Dalam konstruksi ini ὑπέρ menyatakan perbandingan; 'daripada' merupakan padanan Indonesia yang alami dan jelas.
- source_word: λοιπὰς ἐκκλησίας
  choice: jemaat-jemaat lain
  rationale: λοιπός di sini menunjuk pada jemaat-jemaat selebihnya yang dibandingkan dengan jemaat Korintus.
- source_word: αὐτὸς ἐγὼ
  choice: aku sendiri
  rationale: Gabungan kata ganti penegas dan subjek eksplisit menonjolkan tindakan Paulus secara pribadi serta mempertahankan tekanan retorisnya.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: tidak menjadi beban bagi kalian
  rationale: Dalam konteks 2 Korintus, verba ini menunjuk pada membebani orang lain secara materi atau keuangan. Ungkapan ini mempertahankan metafora tanpa mempersempit makna di dalam teks utama.
- source_word: χαρίσασθέ μοι
  choice: Maafkanlah aku
  rationale: χαρίζομαι dapat berarti memberi dengan murah hati atau mengampuni. Dalam perintah penutup yang ironis ini, makna 'maafkanlah' paling sesuai.
- source_word: τὴν ἀδικίαν ταύτην
  choice: atas ketidakadilan ini
  rationale: ἀδικία berarti ketidakadilan atau kesalahan. 'Ketidakadilan ini' mempertahankan daya retoris kata sumber dan ironi Paulus tanpa melunakkannya.
- source_word: τί γάρ ἐστιν ὃ
  choice: Sebab, dalam hal apa
  rationale: Ungkapan ini membuka pertanyaan retoris tentang dalam hal apa jemaat Korintus dirugikan, sedangkan 'sebab' mempertahankan hubungan argumentatif γάρ.
theological_decisions:
- issue: Pembelaan diri Paulus yang ironis mengenai dukungan keuangan
  choice: Menyampaikan pernyataan secara langsung dan mempertahankan ironi melalui 'Maafkanlah aku atas ketidakadilan ini.'
  alternative: Menambahkan penanda eksplisit seperti 'secara ironis' atau memperkuatnya menjadi 'kesalahan besar ini'.
  rationale: Ironi timbul dari konteks dan pertentangan antara tidak membebani mereka dan menyebutnya sebagai ketidakadilan. Teks utama tidak perlu menyisipkan penafsiran yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku/kalian' dipakai agar selaras dengan sapaan langsung Paulus kepada jemaat dan tetap wajar bagi pembaca umum. Susunan pertanyaan mempertahankan hubungan argumentatif, penekanan pada 'aku sendiri', dan ironi kalimat penutup.
