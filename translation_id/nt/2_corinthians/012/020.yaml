id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: id
  text: Sebab aku khawatir kalau-kalau, ketika aku datang, aku mendapati kalian tidak seperti yang kuinginkan, dan kalian mendapati aku tidak seperti yang kalian inginkan; kalau-kalau ada perselisihan, kecemburuan, ledakan-ledakan amarah, ambisi yang mementingkan diri, fitnah, gunjingan[a], kesombongan, dan kekacauan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bisik-bisik.”
    reason: Alternatif leksikal untuk ψιθυρισμοί, yang secara harfiah dapat menunjuk pada pembicaraan berbisik dan dalam konteks ini pada gunjingan tersembunyi.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: aku khawatir
  rationale: Bentuk kini menyatakan kekhawatiran Paulus yang sedang berlangsung. “Khawatir” alami dalam bahasa Indonesia dan tidak mengurangi keseriusan konteks.
- source_word: μή πως
  choice: bahwa ... mungkin / mungkin
  rationale: Kedua kemunculannya memperkenalkan kemungkinan yang dikhawatirkan Paulus. Susunan ini mempertahankan unsur ketidakpastian tanpa terdengar kaku.
- source_word: ἐλθὼν
  choice: ketika aku datang
  rationale: Partisip aoris berfungsi temporal dalam konteks dan paling wajar diterjemahkan sebagai anak kalimat waktu.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: aku mendapati kalian tidak seperti yang kuinginkan
  rationale: Ungkapan ini menunjuk pada keadaan atau watak jemaat yang mungkin tidak sesuai dengan harapan Paulus.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: kalian mendapati aku tidak seperti yang kalian inginkan
  rationale: Perubahan menjadi konstruksi aktif menghasilkan bahasa Indonesia yang alami sekaligus mempertahankan kesejajaran timbal balik dengan klausa sebelumnya.
- source_word: ἔρις
  choice: perselisihan
  rationale: Menunjuk pada pertengkaran atau pertentangan dalam komunitas.
- source_word: ζῆλος
  choice: kecemburuan
  rationale: Dalam daftar keburukan ini kata tersebut mempunyai arti negatif, bukan semangat yang terpuji.
- source_word: θυμοί
  choice: ledakan amarah
  rationale: Bentuk jamak menggambarkan kejadian-kejadian amarah yang meletus, bukan sekadar sikap marah yang menetap.
- source_word: ἐριθεῖαι
  choice: ambisi yang mementingkan diri
  rationale: Mengungkapkan usaha memajukan kepentingan diri atau kelompok secara egoistis.
- source_word: καταλαλιαί
  choice: fitnah
  rationale: Menunjuk pada perkataan yang memburukkan atau mencemarkan orang lain.
- source_word: ψιθυρισμοί
  choice: bisik-bisik
  rationale: Secara harfiah menunjuk pada pembicaraan berbisik dan dalam konteks ini menyiratkan pembicaraan tersembunyi yang merugikan orang lain; alternatif “gunjingan” dicatat.
- source_word: φυσιώσεις
  choice: kesombongan
  rationale: Gambaran harfiahnya adalah keadaan membusungkan diri; “kesombongan” menyampaikan makna sikap angkuh secara jelas.
- source_word: ἀκαταστασίαι
  choice: kekacauan
  rationale: Mencakup keadaan tidak tertib atau gangguan dalam kehidupan jemaat.
theological_decisions:
- issue: Nada pertemuan yang dikhawatirkan Paulus
  choice: Ayat menyatakan ketidaksenangan timbal balik yang mungkin terjadi serta berbagai keburukan dalam jemaat.
  alternative: Menegaskan secara eksplisit bahwa Paulus terutama takut harus bertindak keras sebagai rasul atau bahwa pengajar palsu merupakan penyebab utamanya.
  rationale: Konteks yang lebih luas memungkinkan kesimpulan tersebut, tetapi ayat ini sendiri tidak menyebutkannya. Terjemahan mempertahankan ketegangan tanpa memasukkan penafsiran doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti “kalian” dipakai karena ὑμᾶς dan ὑμῖν berbentuk jamak serta menyapa jemaat secara kolektif. Pengulangan “aku khawatir” memperjelas hubungan sintaksis yang panjang dalam bahasa Indonesia.
