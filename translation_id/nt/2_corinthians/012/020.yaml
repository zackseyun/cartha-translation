  to: Sebab aku khawatir kalau-kalau, ketika aku datang, aku mendapati kalian tidak seperti yang kuinginkan, dan kalian mendapati aku tidak seperti yang kalian inginkan; kalau-kalau ada perselisihan, kecemburuan, ledakan-ledakan amarah, ambisi yang mementingkan diri, fitnah, gunjingan[a], kesombongan, dan kekacauan.
