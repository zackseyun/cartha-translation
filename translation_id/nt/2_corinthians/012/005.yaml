source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: id
  text: Tentang orang seperti itu aku akan bermegah[a], tetapi tentang diriku sendiri aku tidak akan bermegah, kecuali dalam kelemahan-kelemahan-ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengenai orang seperti itu.” Kata depan Yunani dapat menyatakan orang yang menjadi pokok atau acuan kemegahan; “tentang” mempertahankan jarak retoris Paulus secara alami dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam kelemahan-kelemahan.” Dalam tulisan Paulus, “kelemahan” dapat menunjuk pada kerapuhan manusia, penderitaan, atau keadaan yang memperlihatkan kuasa Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: tentang
  rationale: Dengan bentuk genetif, ὑπέρ di sini menyatakan orang yang menjadi pokok atau acuan kemegahan. 'Tentang' alami dalam bahasa Indonesia dan tetap mempertahankan jarak retoris Paulus.
- source_word: τοῦ τοιούτου
  choice: orang seperti itu
  rationale: Ungkapan ini sengaja tidak langsung dan berjarak. 'Orang seperti itu' mempertahankan daya demonstratifnya tanpa menentukan bahwa orang tersebut benar-benar berbeda dari Paulus.
- source_word: καυχήσομαι
  choice: aku akan bermegah
  rationale: '''Bermegah'' merupakan padanan yang jelas dan lazim dalam konteks surat-surat Paulus, serta dapat mencakup tindakan membanggakan sesuatu maupun menjadikannya dasar kemegahan.'
- source_word: ἐμαυτοῦ
  choice: diriku sendiri
  rationale: Kata ganti refleksif ini menegaskan kontras dengan 'orang seperti itu'; 'diriku sendiri' menyampaikan penekanan tersebut secara alami.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Dalam susunan ini εἰ μή memperkenalkan pengecualian, bukan syarat.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: dalam kelemahan-kelemahanku
  rationale: Bentuk jamak ἀσθενείαις dipertahankan. Akhiran posesif '-ku' dibuat eksplisit karena kontras dengan 'diriku sendiri' menunjukkan bahwa yang dimaksud ialah kelemahan Paulus sendiri.
theological_decisions:
- issue: Hakikat kemegahan yang Paulus izinkan
  choice: Paulus membedakan kemegahan tentang 'orang seperti itu' dari kemegahan tentang dirinya sendiri, lalu hanya mengizinkan kemegahan dalam kelemahan-kelemahannya.
  alternative: Paulus berbicara tentang orang lain yang secara harfiah berbeda dari dirinya; atau ia hanya mengemukakan prinsip umum tentang bermegah dalam kelemahan.
  rationale: Teks mempertahankan jarak retoris Paulus terhadap pengalaman luar biasa itu sambil mengarahkan perhatian kepada kelemahan. Terjemahan tidak memutuskan apakah 'orang seperti itu' secara autobiografis adalah Paulus sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang bermartabat. Kata ganti 'aku' dipakai sesuai tuturan pribadi Paulus. Susunan paralel 'tentang ... tentang ...' mempertahankan kontras retoris sumber, sedangkan bentuk jamak 'kelemahan-kelemahanku' mempertahankan bentuk Yunani.
