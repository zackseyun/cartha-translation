id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: id
  text: Aku mengenal seorang laki-laki dalam Mesias[a] yang, empat belas tahun yang lalu—entah di dalam tubuh, aku tidak tahu, entah di luar tubuh, aku tidak tahu, Allah tahu[b]—diangkat sampai ke surga ketiga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut bentuk tradisional, “dalam Kristus”. Kata Yunani Χριστῷ adalah gelar yang berarti “Mesias”.
    reason: alternative_reading
  - marker: b
    text: Paulus tidak mengetahui apakah hal itu terjadi di dalam tubuh atau di luar tubuh; teks menyerahkan pengetahuan itu kepada Allah dan tidak menjelaskan cara pengalaman tersebut terjadi.
    reason: theological_tension
  - marker: c
    text: “Surga ketiga” mempertahankan ungkapan kosmologis kuno dalam teks Yunani; konteks berikutnya menghubungkan pengalaman ini dengan Firdaus (ayat 4).
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Aku mengenal
  rationale: Bentuk perfek οἶδα memiliki arti kini dalam bahasa Yunani Koine. Dalam bahasa Indonesia, “mengenal” paling alami untuk pengetahuan tentang seseorang.
- source_word: ἄνθρωπον
  choice: seorang laki-laki
  rationale: Nomina ini berbentuk maskulin tunggal dan dalam konteks menunjuk kepada seorang pria tertentu; terjemahan mempertahankan rujukan gender tersebut.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός berfungsi sebagai gelar. “Dalam Mesias” mempertahankan makna gelar sekaligus ungkapan relasional khas Paulus tanpa menguraikannya lebih jauh.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: empat belas tahun yang lalu
  rationale: Ini adalah padanan waktu yang wajar dan tepat dalam bahasa Indonesia.
- source_word: εἴτε ἐν σώματι ... εἴτε ἐκτὸς τοῦ σώματος
  choice: entah di dalam tubuh ... entah di luar tubuh
  rationale: Susunan sejajar ini mempertahankan kontras sumber dan pengulangan ketidaktahuan Paulus.
- source_word: ὁ θεὸς οἶδεν
  choice: Allah tahu
  rationale: Terjemahan langsung tanpa menambahkan “hanya”, yang tidak tersurat dalam bahasa Yunani.
- source_word: ἁρπαγέντα
  choice: diangkat
  rationale: Bentuk pasif dipertahankan, sementara “diangkat” menyampaikan perpindahan ke atas secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: sampai ke surga ketiga
  rationale: Padanan ini mempertahankan ungkapan tujuan dan bilangan urutan tanpa menjelaskan kosmologinya di dalam teks.
theological_decisions:
- issue: Terjemahan Χριστῷ dalam ἐν Χριστῷ
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Bentuk Yunani adalah gelar yang berarti Mesias. Teks utama menerjemahkan makna gelarnya, sedangkan bentuk tradisional dicatat dalam catatan kaki.
- issue: Cara terjadinya pengalaman Paulus
  choice: 'Ketidaktahuan Paulus dipertahankan: entah di dalam tubuh atau di luar tubuh'
  alternative: Menetapkannya sebagai kenaikan jasmani atau pengalaman nonjasmani
  rationale: Teks Yunani mengulang οὐκ οἶδα dan menyerahkan pengetahuan itu kepada Allah; terjemahan tidak menyelesaikan ketegangan yang sengaja dibiarkan terbuka.
- issue: Makna “surga ketiga”
  choice: Ungkapan sumber dipertahankan secara harfiah
  alternative: Menggantikannya dengan “surga tertinggi” atau “Firdaus”
  rationale: “Surga ketiga” adalah ungkapan kosmologis kuno, dan ayat ini sendiri tidak menggantinya dengan penjelasan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan sisipan panjang dalam sumber, sedangkan titik koma membantu keterbacaan. Ungkapan “dalam Mesias” dipertahankan meskipun tidak biasa dalam percakapan sehari-hari karena merupakan rumusan teologis-relasional yang penting dalam tulisan Paulus.
