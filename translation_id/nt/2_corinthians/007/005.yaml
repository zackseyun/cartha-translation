base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: id
  text: Sebab, ketika kami tiba di Makedonia, kami[a] tidak mendapat kelegaan sedikit pun, melainkan kami tertekan dalam segala hal—pertikaian di luar, ketakutan di dalam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging kami.” Ungkapan Yunani ini menunjuk pada keadaan manusia yang lemah dan menderita sebagai makhluk berjasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Sebab, bahkan
  rationale: Gabungan ini menghubungkan ayat dengan uraian sebelumnya sekaligus memberi penekanan. Pilihan ini mempertahankan fungsi penjelas dan penegasnya dalam bahasa Indonesia yang wajar.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: ketika kami tiba di Makedonia
  rationale: Konstruksi genitif absolut dipahami secara temporal. 'Tiba di' mengungkapkan gerak menuju Makedonia dengan alami.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: tidak mendapat kelegaan sedikit pun
  rationale: ἄνεσις menunjuk pada kelonggaran, kelegaan, atau istirahat dari tekanan. 'Kelegaan' paling sesuai dengan tekanan lahir dan batin dalam konteks ini, sedangkan 'sedikit pun' menyampaikan penyangkalan tegas οὐδεμίαν.
- source_word: ἡ σὰρξ ἡμῶν
  choice: daging kami
  rationale: Terjemahan harfiah ini mempertahankan gambaran tentang keberadaan manusia yang berjasmani, lemah, dan mengalami kesusahan. Karena ungkapan tersebut dapat terdengar tidak lazim dalam bahasa Indonesia, makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: Sebaliknya, kami terimpit dalam segala hal
  rationale: Partisipel pasif θλιβόμενοι menggambarkan keadaan ditekan atau dihimpit. 'Terimpit' mempertahankan daya gambar kata sumber, dan 'dalam segala hal' mempertahankan keluasan ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: pertikaian di luar
  rationale: μάχαι dapat berarti perkelahian, perselisihan, atau pertikaian. Dalam konteks ini, 'pertikaian' cukup luas untuk mencakup perlawanan dan konflik eksternal tanpa mengharuskan makna pertempuran fisik.
- source_word: ἔσωθεν φόβοι
  choice: ketakutan di dalam
  rationale: Pilihan ini mempertahankan φόβοι sebagai bentuk jamak kolektif secara semantis dan membentuk pasangan kontras yang ringkas dengan 'pertikaian di luar'.
theological_decisions:
- issue: Makna σάρξ dalam ungkapan ἡ σὰρξ ἡμῶν
  choice: daging kami
  alternative: diri kami sendiri; tubuh kami
  rationale: Di sini σάρξ tidak menunjuk pada watak berdosa atau berdiri dalam pertentangan teknis dengan Roh, melainkan pada manusia dalam kelemahan dan kesusahannya sebagai makhluk berjasmani. Terjemahan harfiah dipertahankan agar tekstur dan ketegangan ungkapan sumber tidak hilang, sementara padanan idiomatis diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur akhir dibuat ringkas untuk mempertahankan kesejajaran retoris antara tekanan dari luar dan ketakutan dari dalam. Tanda pisah mempertahankan hentakan penjelasan dalam teks Yunani.
