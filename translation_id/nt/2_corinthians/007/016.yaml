  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: id
  text: Aku bersukacita bahwa dalam segala hal aku yakin akan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku bersukacita karena dalam segala hal aku yakin akan kalian.”
    reason: ὅτι dapat dipahami sebagai pengantar isi sukacita Paulus (“bahwa”) atau secara kausal (“karena”). Ungkapan “yakin akan kalian” mencakup keyakinan terhadap atau berkenaan dengan mereka.
lexical_decisions:
- source_word: χαίρω
  choice: Aku bersukacita
  rationale: Bentuk kini aktif orang pertama tunggal menyatakan sukacita Paulus; “bersukacita” mempertahankan daya verbal dan ragam yang bermartabat.
- source_word: ὅτι
  choice: karena
  rationale: Dalam bahasa Indonesia, “karena” menghasilkan kalimat yang lebih alami dan dapat menyatakan dasar sukacita Paulus. Nuansa bahwa ὅτι mungkin memperkenalkan isi sukacitanya dicatat dalam catatan kaki.
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Ungkapan netral tunggal ini berfungsi secara adverbial dan menunjukkan cakupan yang menyeluruh tanpa membatasi hal-hal yang dimaksud.
- source_word: θαρρῶ
  choice: aku menaruh keyakinan
  rationale: Dalam konteks ini θαρρέω menyatakan keyakinan atau keberanian yang mantap. “Menaruh keyakinan” sesuai dengan konstruksi yang mengarah kepada jemaat Korintus dan lebih tepat daripada ungkapan yang sekadar menyatakan keberanian pribadi.
- source_word: ἐν ὑμῖν
  choice: kepada kalian
  rationale: Preposisi ἐν bersama orang sesudah θαρρέω dapat menyatakan pihak yang menjadi sasaran keyakinan. “Kepada kalian” mempertahankan daya relasionalnya, sedangkan kemungkinan arti “mengenai kalian” dicatat sebagai alternatif.
