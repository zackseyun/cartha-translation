  naturalness: Teks pada umumnya baku dan jelas. “Lihatlah” lebih alami sebagai padanan seruan ἰδού dalam rangkaian “Sebab, lihatlah”. “Diri kalian” juga lebih selaras dengan subjek jamak “kamu” daripada “dirimu”.
  terminology: “Dukacita yang sesuai dengan kehendak Allah” dapat dipertahankan sebagai penjelasan alami untuk κατὰ θεόν, dengan catatan yang menyajikan bentuk harfiahnya. “Kemarahan” lebih tepat daripada “kejengkelan”; “penegakan keadilan” mempertahankan keluasan ἐκδίκησις tanpa memasukkan motif atau pelaku yang tidak dinyatakan.
