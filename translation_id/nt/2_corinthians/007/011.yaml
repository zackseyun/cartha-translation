id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: id
  text: 'Sebab, lihatlah betapa besar kesungguhan yang telah dihasilkan dalam diri kamu oleh dukacita yang sesuai dengan kehendak Allah itu[a]: bahkan pembelaan diri[b], bahkan kemarahan, bahkan ketakutan, bahkan kerinduan, bahkan semangat, bahkan penegakan keadilan[c]. Dalam segala hal, kamu telah membuktikan diri kalian bersih dalam perkara itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dukacita menurut Allah”; dapat juga dipahami sebagai dukacita yang berkenan kepada Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pembelaan” atau “tindakan membersihkan diri dari tuduhan”.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “penghukuman”, “pembalasan atas kesalahan”, atau “tindakan membereskan perkara”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Sebab, perhatikanlah
  rationale: “Sebab” menyampaikan fungsi penjelas γάρ, sedangkan “perhatikanlah” mempertahankan seruan penunjuk ἰδού secara alami dalam bahasa Indonesia modern.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: dukacita yang sesuai dengan kehendak Allah itu
  rationale: Infinitif berartikel diterjemahkan sebagai nomina “dukacita”. Ungkapan κατὰ θεόν menunjukkan kesesuaian dengan Allah atau kehendak-Nya; pilihan ini alami tanpa mengubahnya menjadi sekadar sifat kesalehan.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: betapa besarnya kesungguhan yang dihasilkan dalam diri kamu
  rationale: κατεργάζομαι menyatakan dihasilkannya suatu akibat, dan σπουδή menunjuk pada kesungguhan atau keseriusan yang giat.
- source_word: ἀλλὰ
  choice: bahkan
  rationale: Pengulangan ἀλλά dalam daftar ini bersifat menanjak dan menambahkan bukti, bukan terutama menyatakan pertentangan. Pengulangan “bahkan” mempertahankan daya retorisnya.
- source_word: ἀπολογίαν
  choice: pembelaan diri
  rationale: Istilah ini menunjuk pada jawaban atau pembelaan yang membersihkan diri dari keterlibatan atau tuduhan; “pembelaan diri” ringkas dan jelas.
- source_word: ἀγανάκτησιν
  choice: kejengkelan
  rationale: Kata ini menyatakan ketidaksenangan moral yang kuat. “Kejengkelan” mempertahankan kekuatannya tanpa menentukan objek yang tidak disebutkan dalam bahasa Yunani.
- source_word: φόβον
  choice: ketakutan
  rationale: Objek rasa takut tidak dinyatakan. Terjemahan umum ini menjaga keterbukaan apakah yang dimaksud ialah ketakutan terhadap Allah, terhadap teguran rasuli, atau kegentaran atas keadaan tersebut.
- source_word: ἐπιπόθησιν
  choice: kerinduan
  rationale: Menunjukkan keinginan yang kuat, kemungkinan besar untuk pemulihan hubungan, tetapi terjemahan tidak menyebutkan objek yang dibiarkan tersirat.
- source_word: ζῆλον
  choice: semangat
  rationale: “Semangat” menyampaikan gairah dan kesungguhan yang kuat serta tetap dapat dibedakan dari σπουδή sebelumnya.
- source_word: ἐκδίκησιν
  choice: kesediaan menegakkan keadilan
  rationale: Istilah ini dapat menunjuk pada penghukuman, pembalasan atas kesalahan, atau tindakan mendatangkan keadilan. Dalam konteks tanggapan pertobatan, frasa ini menyampaikan tekad untuk membereskan pelanggaran tanpa menyiratkan balas dendam pribadi.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: Dalam segala hal, kamu telah membuktikan bahwa dirimu bersih dalam perkara itu
  rationale: συνίστημι di sini berarti menunjukkan atau membuktikan, sedangkan ἁγνούς menyatakan kebersihan atau kemurnian dalam hubungan dengan perkara yang dibicarakan.
theological_decisions:
- issue: Makna κατὰ θεόν
  choice: yang sesuai dengan kehendak Allah
  alternative: menurut Allah; yang berasal dari Allah; yang berkenan kepada Allah
  rationale: Ungkapan tersebut dapat menunjuk pada dukacita yang selaras dengan ukuran atau kehendak Allah. Pilihan utama alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk yang lebih harfiah dan kemungkinan nuansa lain.
- issue: Nuansa ἐκδίκησις dalam konteks pertobatan
  choice: kesediaan menegakkan keadilan
  alternative: penghukuman; pembalasan atas kesalahan; tindakan membereskan perkara
  rationale: Konteks menunjukkan tindakan tegas sebagai buah pertobatan. Terjemahan ini tidak menyempitkan makna menjadi balas dendam pribadi ataupun hanya pembuktian ketidakbersalahan.
- issue: Arti ἁγνούς dalam kaitannya dengan perkara tersebut
  choice: bersih dalam perkara itu
  alternative: tidak bersalah dalam perkara itu; murni dalam perkara itu
  rationale: “Bersih” mempertahankan gambaran kemurnian ἁγνός dan menghindari penegasan legal yang mungkin terlalu sempit, sambil tetap menyatakan bahwa tanggapan mereka membuktikan posisi mereka terhadap perkara itu.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada khidmat tetapi mudah dipahami. Pengulangan “bahkan” dipertahankan untuk meniru susunan retoris Paulus. Pronomina jamak “kamu” dipakai secara konsisten; objek beberapa nomina emosional tidak ditambahkan karena teks Yunani membiarkannya tersirat.
