id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: id
  text: Tetapi Allah, yang menghibur orang-orang yang terpuruk[a], menghibur kami melalui kedatangan Titus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang rendah hati” atau “orang-orang yang rendah kedudukannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kehadiran Titus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Tetapi
  rationale: Menandai pertentangan dengan kesusahan yang baru saja Paulus uraikan, dengan penghubung adversatif yang alami dalam bahasa Indonesia.
- source_word: ὁ παρακαλῶν
  choice: yang menghibur
  rationale: Partisipel kini ini menggambarkan tindakan khas Allah. Pilihan 'menghibur' sesuai dengan konteks penderitaan dan mempertahankan kaitan leksikal dengan παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: orang-orang yang terpuruk
  rationale: Dalam konteks penderitaan Paulus, kata ini menunjuk kepada orang yang telah dibawa ke keadaan rendah atau susah. 'Terpuruk' menyampaikan keadaan itu secara alami tanpa membatasinya hanya pada kerendahan hati sebagai kebajikan; cakupan alternatif dicatat dalam catatan kaki.
- source_word: παρεκάλεσεν
  choice: menghibur
  rationale: Mengulang padanan bagi akar παρακαλέω agar hubungan antara sifat Allah dan tindakan-Nya terhadap Paulus beserta rekan-rekannya tetap jelas.
- source_word: ἐν τῇ παρουσίᾳ
  choice: melalui kedatangan
  rationale: παρουσία dapat berarti kehadiran maupun kedatangan. Di sini konteks menyoroti tibanya Titus sebagai sarana penghiburan, sehingga 'melalui kedatangan' merupakan ungkapan Indonesia yang wajar.
- source_word: Τίτου
  choice: Titus
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku bagi θεός dalam konteks ini dan subjek eksplisit dari tindakan menghibur.
theological_decisions:
- issue: Makna τοὺς ταπεινοὺς dalam konteks
  choice: orang-orang yang terpuruk
  alternative: orang-orang yang rendah hati; orang-orang yang rendah kedudukannya
  rationale: Konteks langsung berbicara tentang tekanan dan penghiburan, sehingga makna keadaan terpuruk paling mungkin. Namun, istilah Yunani juga dapat menunjuk pada kerendahan hati atau kerendahan kedudukan; catatan kaki mempertahankan keluasan dan ketegangan makna tersebut.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pengulangan 'menghibur' dipertahankan untuk mencerminkan pengulangan akar παρακαλέω dalam teks Yunani. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
