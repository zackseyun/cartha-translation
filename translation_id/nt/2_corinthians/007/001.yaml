id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: id
  text: Karena itu, Saudara-saudara terkasih, karena kita memiliki janji-janji ini, marilah kita menyucikan diri dari segala pencemaran jasmani dan rohani,[a] dengan menyempurnakan kekudusan dalam takut akan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari segala pencemaran daging dan roh.”'
    reason: lexical_alternative
  - marker: b
    text: “Takut akan Allah” mencakup rasa hormat, kagum, dan gentar di hadapan-Nya, bukan sekadar kengerian.
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: janji-janji ini
  rationale: Menunjuk kembali pada jaminan-jaminan ilahi sebelumnya; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian dan kutipan sebelumnya.
- source_word: ἀγαπητοί
  choice: saudara-saudara yang terkasih
  rationale: Sapaan ini mempertahankan kehangatan pastoral dan keluhuran surat tanpa membatasi kelompok berdasarkan gender biologis.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: marilah kita menyucikan diri
  rationale: Subjungtif hortatoris orang pertama jamak menyatakan ajakan yang mencakup Paulus dan para pembaca; 'menyucikan' sesuai dengan konteks pencemaran dan kekudusan.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: dari segala pencemaran
  rationale: μολυσμός mengandung nuansa noda atau pencemaran moral-religius; 'segala' menyatakan keseluruhan setiap jenis pencemaran.
- source_word: σαρκὸς καὶ πνεύματος
  choice: jasmani dan rohani
  rationale: Dalam pasangan kontras ini, istilah tersebut menunjuk pada dimensi lahiriah dan batiniah manusia. Ungkapan Indonesia ini lebih alami daripada 'daging dan roh' tanpa memasukkan gagasan 'tabiat berdosa'.
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: sambil menyempurnakan kekudusan
  rationale: Partisipel menerangkan tindakan yang menyertai ajakan utama, sedangkan ἐπιτελέω menyatakan membawa sesuatu menuju kepenuhannya.
- source_word: ἐν φόβῳ θεοῦ
  choice: dalam takut akan Allah
  rationale: Mempertahankan idiom Alkitab dan bobot φόβος, yang mencakup rasa gentar serta hormat di hadapan Allah.
theological_decisions:
- issue: Makna σαρκὸς dalam pasangan σαρκὸς καὶ πνεύματος
  choice: Diterjemahkan secara kontekstual sebagai 'jasmani', bukan 'tabiat berdosa'.
  alternative: '''daging''; ''tubuh''; ''tabiat berdosa'''
  rationale: Kontras dengan πνεύματος menggambarkan keseluruhan pribadi dalam dimensi jasmani dan rohani, bukan pemakaian khusus σάρξ sebagai orientasi manusia yang berdosa.
- issue: Daya ajakan καθαρίσωμεν
  choice: '''marilah kita menyucikan diri'' sebagai ajakan inklusif'
  alternative: '''kita harus menyucikan diri'''
  rationale: Bentuk subjungtif orang pertama jamak paling langsung menyatakan ajakan yang mencakup penulis bersama pembaca.
- issue: Makna φόβος dalam hubungan dengan Allah
  choice: Mempertahankan 'takut akan Allah'.
  alternative: '''hormat kepada Allah''; ''rasa kagum kepada Allah'''
  rationale: Ungkapan itu mencakup hormat dan kegentaran yang penuh kesadaran akan kekudusan Allah; menerjemahkannya hanya sebagai 'hormat' dapat mengurangi ketegangan semantisnya.
- issue: Hubungan ἐπιτελοῦντες dengan ajakan utama
  choice: Diterjemahkan 'sambil menyempurnakan', sebagai tindakan yang menyertai proses penyucian.
  alternative: '''dengan menyempurnakan''; ''sehingga kekudusan menjadi sempurna'''
  rationale: Partisipel dapat menyatakan cara atau tindakan penyerta; 'sambil' mempertahankan keluwesan hubungan tersebut tanpa menjadikannya akibat yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'saudara-saudara yang terkasih' dipilih sebagai bentuk pastoral yang lazim. Susunan kalimat mempertahankan hubungan dengan konteks sebelumnya dan ajakan inklusif Paulus.
