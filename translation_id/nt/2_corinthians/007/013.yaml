source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: id
  text: Karena itu, kami telah terhibur.[a] Selain penghiburan yang kami terima, kami jauh lebih bersukacita lagi karena sukacita Titus, sebab batinnya telah disegarkan[b] oleh kamu semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dikuatkan. Kata Yunani yang diterjemahkan “terhibur” dan “penghiburan” dapat mencakup kedua makna itu dalam konteks ini.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: rohnya telah mendapat kelegaan; atau: batinnya telah mendapat ketenangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Mengungkapkan hubungan sebab-akibat atau kesimpulan dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: παρακεκλήμεθα
  choice: kami telah terhibur
  rationale: Bentuk perfektum pasif menunjukkan tindakan yang telah terjadi dengan keadaan yang masih berlangsung; 'terhibur' sesuai dengan konteks emosional dan dipertahankan selaras dengan παράκλησις.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Selain penghiburan yang kami terima
  rationale: Mengungkapkan bahwa sukacita berikutnya menyertai dan melampaui penghiburan yang sudah mereka alami, tanpa mempertahankan susunan Yunani yang kaku.
- source_word: περισσοτέρως μᾶλλον
  choice: jauh lebih ... lagi
  rationale: Mencerminkan penumpukan bentuk pembanding yang menegaskan besarnya sukacita Paulus dan rekan-rekannya secara alami dalam bahasa Indonesia.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: kami ... bersukacita ... karena sukacita Titus
  rationale: Menjaga pengulangan akar kata 'bersukacita/sukacita' dan menyatakan dasar sukacita itu secara idiomatis.
- source_word: ἀναπέπαυται
  choice: telah disegarkan
  rationale: Menyampaikan hasil yang tetap terasa dari tindakan sebelumnya, yakni kelegaan dan pemulihan batin Titus.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: batinnya
  rationale: Dalam konteks ini πνεῦμα menunjuk pada keadaan batin Titus, bukan Roh Kudus. 'Batinnya' alami dalam bahasa Indonesia, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: oleh kamu semua
  rationale: Menyatakan sumber atau perantaraan penyegaran itu dengan jelas serta mempertahankan cakupan πάντων, yaitu seluruh jemaat.
theological_decisions:
- issue: Arti πνεῦμα yang merujuk kepada Titus
  choice: batin atau keadaan batin Titus
  alternative: roh Titus; Roh Kudus
  rationale: Kata ganti posesif αὐτοῦ ('-nya') dan konteks tentang tanggapan emosional Titus menunjuk pada diri batin Titus, bukan pada Roh Kudus. Catatan kaki mempertahankan bentuk harfiah 'rohnya'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Pengulangan 'terhibur/penghiburan' serta 'bersukacita/sukacita' dipertahankan untuk mencerminkan kaitan leksikal dalam teks Yunani. Bentuk 'kamu semua' dipilih agar πάντων tetap eksplisit.
