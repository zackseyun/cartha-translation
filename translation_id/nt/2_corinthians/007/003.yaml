id: 2CO.7.3
reference: 2 Corinthians 7:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: id
  text: Aku mengatakan ini bukan untuk menghukum kalian[a], sebab sebelumnya sudah kukatakan bahwa kalian ada di dalam hati kami, untuk mati bersama dan hidup bersama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk penghukuman” atau “dengan maksud menghukum kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sehingga kita mati bersama dan hidup bersama.” Bahasa Yunani menekankan solidaritas bersama baik dalam kematian maupun dalam kehidupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν οὐ λέγω
  choice: Aku mengatakan ini bukan untuk menghukum kalian
  rationale: Frasa πρός dengan κατάκρισιν menyatakan arah atau tujuan. Bentuk verbal 'untuk menghukum' alami dalam bahasa Indonesia dan tetap menyampaikan bahwa perkataan Paulus tidak bertujuan menjatuhkan hukuman atas jemaat Korintus. Kata 'ini' ditambahkan secara kontekstual sebagai objek λέγω.
- source_word: προείρηκα
  choice: sebelumnya sudah kukatakan
  rationale: Bentuk perfek menunjuk kepada perkataan terdahulu yang tetap relevan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan nuansa tersebut.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: kalian ada di dalam hati kami
  rationale: Terjemahan ini mempertahankan bentuk jamak 'hati kami' secara kolektif serta mengungkapkan kasih dan keterikatan batin yang mendalam.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: untuk mati bersama dan hidup bersama
  rationale: Kata depan εἰς dengan infinitif artikular dapat menyatakan arah, maksud, atau hasil. Pengulangan 'bersama' mempertahankan unsur συν- pada kedua verba dan kesejajaran retorisnya.
theological_decisions:
- issue: Apakah ungkapan 'mati bersama dan hidup bersama' harus dijelaskan sebagai persatuan perjanjian, perkawinan, atau persatuan di dalam Kristus
  choice: Mempertahankan bahasa solidaritas relasional tanpa menambahkan kategori teologis tertentu
  alternative: Menafsirkannya secara eksplisit sebagai kesetiaan perjanjian atau partisipasi di dalam Kristus
  rationale: Teks menyatakan kasih dan solidaritas Paulus yang sangat mendalam dengan jemaat Korintus, tetapi tidak menetapkan satu kategori teologis teknis. Terjemahan membiarkan keluasan dan ketegangan maknanya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan pronomina 'aku/kalian' yang alami bagi surat pribadi dan jelas bagi pembaca umum. Gaya tetap hangat dan bermartabat; susunan pasangan 'mati bersama dan hidup bersama' dipertahankan demi daya retoris sumber.
