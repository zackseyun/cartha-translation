id: 2CO.7.4
reference: 2 Corinthians 7:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: id
  text: Aku sangat berani berterus terang kepada kalian[a], dan aku sangat bermegah mengenai kalian. Aku dipenuhi penghiburan[b]; sukacitaku meluap-luap di tengah segala kesusahan kami[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sangat yakin terhadap kalian.” Kata Yunani παρρησία juga dapat menyatakan keterbukaan dan kebebasan untuk berbicara terus terang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “penguatan” atau “dorongan.” Kata Yunani παράκλησις mencakup penghiburan sekaligus penguatan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “meskipun kami mengalami segala kesusahan.” Ungkapan Yunaninya dapat dipahami sebagai sukacita yang meluap sementara kesusahan terus berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: berani berterus terang
  rationale: Kata ini dapat menyatakan keberanian, keterbukaan, atau kebebasan untuk berbicara terus terang. Ungkapan ini mempertahankan unsur keberanian sekaligus keterbukaan Paulus kepada jemaat Korintus.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Frasa ini menyatakan arah atau hubungan. 'Kepada kalian' wajar dalam bahasa Indonesia dan cocok dengan tindakan berterus terang.
- source_word: καύχησις
  choice: bermegah
  rationale: Kata ini mempertahankan bahasa khas Paulus tentang bermegah tanpa otomatis memberi kesan kesombongan berdosa.
- source_word: ὑπὲρ ὑμῶν
  choice: mengenai kalian
  rationale: Dalam konteks ini, Paulus bermegah dengan merujuk kepada jemaat Korintus. 'Mengenai kalian' mempertahankan cakupan makna tanpa memaksakan nuansa perwakilan.
- source_word: πεπλήρωμαι
  choice: Aku dipenuhi
  rationale: Bentuk perfek pasif menggambarkan keadaan kini sebagai hasil dari tindakan yang telah terjadi. 'Aku dipenuhi' menyampaikan keadaan hasil tersebut secara alami.
- source_word: παρακλήσει
  choice: penghiburan
  rationale: παράκλησις mencakup penghiburan, penguatan, dan dorongan. Dalam konteks kesusahan serta kedatangan Titus, 'penghiburan' paling alami, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: ὑπερπερισσεύομαι
  choice: meluap-luap
  rationale: Kata kerja intensif ini menyatakan kelimpahan yang luar biasa. Pengulangan 'meluap-luap' mengungkapkan intensitas itu secara idiomatis.
- source_word: χαρᾷ
  choice: sukacitaku
  rationale: χαρά berarti sukacita. Bentuk posesif diperlukan agar kalimat Indonesia mengalir alami bersama verba 'meluap-luap'.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: di tengah segala kesusahan kami
  rationale: Frasa ini menggambarkan sukacita yang melimpah sementara kesusahan tetap berlangsung. 'Di tengah' mempertahankan kebersamaan sukacita dan penderitaan, bukan meniadakan salah satunya.
- source_word: πολλή ... πολλή
  choice: sangat ... sangat
  rationale: Pengulangan ini mempertahankan penekanan pada besarnya keterusterangan dan kemegahan Paulus dalam susunan Indonesia yang alami.
theological_decisions:
- issue: Bahasa positif Paulus tentang καύχησις
  choice: bermegah
  alternative: bangga
  rationale: '''Bermegah'' mempertahankan retorika khas Paulus dan tidak melunakkannya menjadi sekadar rasa bangga. Konteks menunjukkan bahwa ini bukan kesombongan yang meninggikan diri.'
- issue: Hubungan antara sukacita dan penderitaan
  choice: di tengah segala kesusahan kami
  alternative: meskipun kami mengalami segala kesusahan
  rationale: Teks Yunani menempatkan sukacita yang melimpah dalam keadaan kesusahan. Pilihan ini mempertahankan ketegangan teologis tersebut tanpa mengubahnya menjadi hubungan pertentangan yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa modern, bermartabat, dan komunikatif. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa penerimanya adalah seluruh jemaat. Ungkapan 'berani berterus terang' dipilih agar makna keberanian dan keterbukaan dalam παρρησία tetap terdengar tanpa menghasilkan konstruksi nominal yang kaku.
