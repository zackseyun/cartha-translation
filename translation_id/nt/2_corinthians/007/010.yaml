  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: id
  text: Sebab dukacita menurut Allah[a] menghasilkan pertobatan yang tidak disesalkan, yang membawa kepada keselamatan[b], sedangkan dukacita duniawi menghasilkan kematian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “dukacita yang sesuai dengan Allah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, urutannya: “menghasilkan pertobatan menuju keselamatan yang tidak disesalkan.” Kata “tidak disesalkan” paling langsung menerangkan “pertobatan”; dalam bahasa Indonesia, kata itu ditempatkan di dekat “pertobatan” untuk memperjelas hubungan tersebut.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: yang sesuai dengan kehendak Allah
  rationale: Ungkapan ini secara harfiah berarti 'menurut Allah' dan menunjuk pada dukacita yang selaras dengan Allah. Penyebutan 'kehendak' membuat maksudnya alami dalam bahasa Indonesia tanpa mengubahnya menjadi sekadar kesalehan manusia.
- source_word: λύπη
  choice: dukacita
  rationale: Kata ini menyatakan kesedihan atau dukacita; 'dukacita' sesuai dengan konteks moral-rohani dan dapat digunakan secara sejajar dalam kedua klausa.
- source_word: μετάνοιαν
  choice: pertobatan
  rationale: Dalam konteks ini μετάνοια bukan hanya perubahan pikiran, melainkan perubahan hati dan arah hidup; 'pertobatan' merupakan padanan Indonesia yang mapan dan tepat.
- source_word: εἰς σωτηρίαν
  choice: yang membawa kepada keselamatan
  rationale: εἰς menyatakan arah, tujuan, atau hasil. Rumusan ini mempertahankan daya arah tersebut tanpa menetapkan mekanisme kausal yang lebih rinci daripada teks.
- source_word: ἀμεταμέλητον
  choice: tidak akan disesali
  rationale: Adjektiva ini berarti tidak menimbulkan penyesalan atau tidak patut disesali. Penempatannya mengikuti 'pertobatan yang membawa kepada keselamatan', sambil mengakui melalui catatan kaki bahwa hubungan sintaksisnya dapat dipahami dengan lebih dari satu cara.
- source_word: ἐργάζεται
  choice: menghasilkan
  rationale: Verba ini berarti mengerjakan atau mendatangkan suatu hasil; 'menghasilkan' alami dan menjaga hubungan sebab-hasil.
- source_word: τοῦ κόσμου
  choice: duniawi
  rationale: Genitif ini menerangkan dukacita sebagai dukacita yang berasal dari atau berciri dunia, dan membentuk kontras yang jelas dengan dukacita yang sesuai dengan Allah.
- source_word: θάνατον
  choice: kematian
  rationale: Padanan langsung ini mempertahankan keluasan makna teks tanpa menentukan apakah yang dimaksud khususnya kematian jasmani, rohani, atau eskatologis.
- source_word: κατεργάζεται
  choice: menghasilkan
  rationale: Walaupun bentuknya sedikit lebih kuat daripada ἐργάζεται, dalam konteks ini kedua verba berfungsi paralel. Padanan yang sama mempertahankan keseimbangan retoris kedua klausa.
theological_decisions:
- issue: Kontras antara dua macam dukacita
  choice: Dukacita yang sesuai dengan kehendak Allah dikontraskan dengan dukacita duniawi, tanpa mempersempit arti 'kematian'.
  alternative: Menafsirkan dukacita duniawi sebagai sekadar kesedihan manusiawi atau kematian sebagai khusus kematian rohani.
  rationale: Paulus membedakan dukacita yang selaras dengan Allah dari dukacita milik dunia, tetapi tidak menjelaskan secara sempit jenis kematian yang dimaksud.
- issue: Hubungan pertobatan dengan keselamatan
  choice: εἰς σωτηρίαν diterjemahkan 'yang membawa kepada keselamatan'.
  alternative: '''untuk keselamatan'' atau ''yang menghasilkan keselamatan''.'
  rationale: Terjemahan ini menyatakan arah atau hasil sebagaimana ditandai εἰς, tanpa menjadikan pertobatan sebagai sebab berjasa yang mekanis.
- issue: Hubungan sintaksis ἀμεταμέλητον
  choice: '''Tidak akan disesali'' dibaca terutama sebagai keterangan bagi pertobatan yang membawa kepada keselamatan.'
  alternative: Memahami frasa itu sebagai keterangan bagi keselamatan atau bagi keseluruhan proses pertobatan menuju keselamatan.
  rationale: Jenis kelamin dan kasus ἀμεταμέλητον paling langsung selaras dengan μετάνοιαν, tetapi urutan kata Yunani memungkinkan pembaca mengaitkannya dengan keseluruhan ungkapan; ambiguitas ini dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dukacita' dipilih untuk mempertahankan pengulangan dan kontras, sedangkan 'pertobatan' digunakan sebagai istilah umum yang mudah dipahami. Semua penanda catatan kaki dicantumkan dalam teks utama.
