revisions:
- from: Sebab dukacita yang sesuai dengan kehendak Allah[a] menghasilkan pertobatan yang membawa kepada keselamatan dan tidak akan disesali[b], sedangkan dukacita duniawi menghasilkan kematian.
  to: Sebab dukacita menurut Allah[a] menghasilkan pertobatan yang tidak disesalkan, yang membawa kepada keselamatan[b], sedangkan dukacita duniawi menghasilkan kematian.
  rationale: 'Revisi menghilangkan penambahan “kehendak,” memakai padanan langsung dan wajar “menurut Allah,” serta menerjemahkan ἀμεταμέλητον sebagai “tidak disesalkan,” bukan sebagai pernyataan masa depan. Susunan klausa juga menautkan sifat “tidak disesalkan” secara jelas kepada “pertobatan,” sebagaimana paling kuat ditunjukkan oleh konstruksi Yunani, sambil mempertahankan εἰς σωτηρίαν sebagai arah/tujuan: “yang membawa kepada keselamatan.”'
