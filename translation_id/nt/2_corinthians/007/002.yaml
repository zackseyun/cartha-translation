- from: Berilah kami tempat di hati kalian.[a] Kami tidak pernah berbuat salah terhadap siapa pun, tidak pernah merusak siapa pun,[b] dan tidak pernah mengambil keuntungan dari siapa pun.
  to: Berilah tempat bagi kami.[a] Kami tidak berbuat salah terhadap siapa pun, tidak merusak siapa pun,[b] dan tidak mengambil keuntungan dari siapa pun.
  rationale: Revisi memindahkan penafsiran “di hati kalian” dari teks utama ke catatan kaki agar metafora Yunani tetap terbuka sebagaimana sumbernya, sambil tetap menyediakan pembacaan yang didukung konteks. Bentuk penyangkalan juga dibuat lebih dekat pada aspek yang tidak ditandai secara khusus dalam bahasa Yunani. Tidak ada masalah struktural pada penanda catatan kaki.
