  naturalness: “Berilah tempat bagi kami” adalah bahasa Indonesia baku yang alami dan tetap dapat berfungsi secara relasional dalam konteksnya. “Kami tidak berbuat salah terhadap siapa pun, tidak merusak siapa pun, dan tidak mengambil keuntungan dari siapa pun” jelas dan mempertahankan paralelisme Yunani. Penghilangan “pernah” menghindari penambahan aspek duratif/selalu yang tidak dinyatakan secara eksplisit.
  terminology: “Merusak” secara tepat membiarkan ἐφθείραμεν tetap luas, tanpa membatasi pada kerusakan moral, rohani, fisik, atau ekonomi. “Mengambil keuntungan dari” sesuai dengan ἐπλεονεκτήσαμεν dalam konteks penolakan terhadap pemanfaatan yang tidak patut. Catatan kaki pada χωρήσατε menyajikan alternatif relasional tanpa memasukkannya secara interpretatif ke teks utama.
