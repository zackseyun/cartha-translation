reference: 2 Corinthians 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Χωρήσατε ἡμᾶς· οὐδένα ἠδικήσαμεν, οὐδένα ἐφθείραμεν, οὐδένα ἐπλεονεκτήσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: id
  text: Berilah tempat bagi kami.[a] Kami tidak berbuat salah terhadap siapa pun, tidak merusak siapa pun,[b] dan tidak mengambil keuntungan dari siapa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Berilah tempat bagi kami.” Dapat juga diterjemahkan “Terimalah kami” atau “Bukalah hati kalian bagi kami.” Ungkapan ini tampaknya melanjutkan gambaran relasional dalam 6:11–13.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini dapat juga berarti “mencemarkan” atau “membinasakan.” Dalam konteks ini, jenis kerusakan yang dimaksud tidak dinyatakan secara khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Berilah ... tempat
  rationale: Bentuk imperatif ini secara harfiah meminta para pembaca menyediakan ruang. Dalam konteks 6:11–13, ungkapan itu merupakan permohonan relasional, bukan perpindahan fisik. Tambahan idiomatis 'di hati kalian' membuat maksud metaforisnya jelas dalam bahasa Indonesia modern, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: ἡμᾶς
  choice: kami
  rationale: Kata ganti ini menjadi objek langsung dari perintah dan merujuk kepada Paulus beserta rekan-rekannya.
- source_word: οὐδένα
  choice: siapa pun
  rationale: Bersama penyangkalan, pilihan ini membentuk ungkapan Indonesia yang alami. Pengulangannya tiga kali dipertahankan untuk menjaga penekanan retoris.
- source_word: ἠδικήσαμεν
  choice: berbuat salah terhadap
  rationale: ἀδικέω berarti memperlakukan secara tidak adil atau merugikan. Ungkapan ini cukup luas dan tidak menentukan bentuk kesalahan yang tidak disebutkan dalam teks.
- source_word: ἐφθείραμεν
  choice: merusak
  rationale: φθείρω dapat berarti merusak, membinasakan, atau mencemarkan. 'Merusak' mempertahankan keluasan makna tanpa membatasi kerusakan itu hanya pada ranah moral atau jasmani.
- source_word: ἐπλεονεκτήσαμεν
  choice: mengambil keuntungan dari
  rationale: πλεονεκτέω menunjuk pada mengambil keuntungan secara tidak patut atau mengeksploitasi seseorang. Pilihan ini alami dalam bahasa Indonesia dan cukup luas untuk mencakup penyalahgunaan finansial maupun relasional.
theological_decisions:
- issue: Sifat permohonan Χωρήσατε ἡμᾶς
  choice: Permohonan agar jemaat memberi Paulus dan rekan-rekannya tempat dalam hati mereka
  alternative: Ajakan yang lebih umum untuk menerima atau menyambut mereka
  rationale: Konteks dekat 6:11–13 berbicara tentang kelapangan hati dan kasih sayang. Karena bahasa Indonesia memerlukan idiom yang jelas, 'di hati kalian' menyampaikan metafora relasional tersebut; catatan kaki tetap menunjukkan bentuk yang lebih harfiah dan alternatifnya.
- issue: Cakupan ἐφθείραμεν
  choice: Tidak pernah merusak siapa pun, dengan jenis kerusakan dibiarkan terbuka
  alternative: Tidak pernah mencemarkan, menyesatkan, mengeksploitasi, atau membinasakan siapa pun
  rationale: Kata Yunani memiliki rentang makna yang luas. Terjemahan utama tidak membatasi tuduhan Paulus pada kerusakan moral, rohani, jasmani, atau ekonomi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada mendesak tetapi hangat. Kata ganti 'kalian' dipakai untuk menandai orang kedua jamak secara jelas. Pengulangan 'tidak pernah ... siapa pun' mempertahankan pola tiga penyangkalan Paulus dan menghasilkan irama yang wajar.
