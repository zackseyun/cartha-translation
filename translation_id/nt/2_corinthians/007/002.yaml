    rationale: Bentuk aoris Yunani menyatakan tindakan yang dipandang sebagai keseluruhan, bukan secara eksplisit “tidak pernah.” Dalam bahasa Indonesia penyangkalan sederhana sudah menyampaikan pembelaan Paulus tanpa menambah nuansa temporal.
