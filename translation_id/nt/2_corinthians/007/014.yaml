    rationale: Konstruksi ini dapat berarti Paulus merasa bangga terhadap jemaat, atau bahkan membuat jemaat bangga. Konteks dan frasa ὑπὲρ ὑμῶν menuntut bahwa Paulus bermegah kepada lawan bicara tentang mereka.
