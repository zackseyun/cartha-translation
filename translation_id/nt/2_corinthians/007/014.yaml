id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: id
  text: Sebab jika aku pernah bermegah kepadanya tentang kalian, aku tidak dipermalukan. Sebaliknya, sama seperti segala sesuatu yang kami katakan kepada kalian kami katakan dengan benar, demikian juga kemegahan kami kepada Titus terbukti benar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demikian juga kemegahan kami di hadapan Titus terbukti benar.” Frasa Yunani ini dapat diterjemahkan “kepada” atau “di hadapan Titus”; konteksnya menunjukkan bahwa kemegahan itu berkaitan dengan apa yang Paulus katakan kepada Titus tentang jemaat Korintus.
    reason: Menjaga alternatif terjemahan untuk ἡ ἐπὶ Τίτου serta menjelaskan objek yang tersirat dari konteks.
lexical_decisions:
- source_word: κεκαύχημαι
  choice: pernah membanggakan
  rationale: Mempertahankan daya retoris καυχάομαι dan kaitan leksikalnya dengan καύχησις, sementara bentuk perfektum menyatakan tindakan yang telah dilakukan dan tetap relevan.
- source_word: οὐ κατῃσχύνθην
  choice: aku tidak dipermalukan
  rationale: Bentuk pasif menunjukkan bahwa Paulus tidak dibuat malu karena perkataannya terbukti keliru, bukan sekadar tidak merasa malu.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: segala sesuatu yang kami katakan kepada kalian adalah benar
  rationale: Mengungkapkan cakupan πάντα dan makna ἐν ἀληθείᾳ secara alami dalam bahasa Indonesia tanpa mengurangi klaim kebenarannya.
- source_word: ἡ καύχησις ἡμῶν
  choice: kebanggaan kami
  rationale: Dalam bahasa Indonesia, nomina 'kebanggaan' lebih alami daripada 'pembanggaan' dan sesuai dengan konteks kebanggaan yang beralasan, meski hubungan dengan verba sebelumnya menjadi kurang eksplisit.
- source_word: ἡ ἐπὶ Τίτου
  choice: di hadapan Titus
  rationale: Mencerminkan secara cukup formal frasa ἐπί dengan genitif dan mempertahankan kemungkinan bahwa yang dimaksud ialah kebanggaan yang Paulus nyatakan di hadapan atau kepada Titus.
- source_word: ἀλήθεια ἐγενήθη
  choice: terbukti benar
  rationale: Ungkapan ini menyatakan bahwa kebanggaan Paulus ternyata sesuai dengan kenyataan.
- source_word: ὅτι
  choice: Sebab
  rationale: ὅτι memperkenalkan penjelasan yang berhubungan dengan ayat sebelumnya.
theological_decisions:
- issue: Sifat tindakan Paulus membanggakan jemaat Korintus
  choice: Diterjemahkan dengan 'membanggakan' dan 'kebanggaan' sebagai pujian atau rasa bangga yang dibenarkan oleh kenyataan.
  alternative: Menggunakan 'bermegah' atau 'keyakinan' untuk menghindari kesan kesombongan.
  rationale: καυχάομαι dan καύχησις memiliki daya retoris yang lebih kuat daripada sekadar 'yakin'; konteks, bukan pelemahan istilah, menunjukkan bahwa tindakan Paulus bukan kesombongan berdosa.
- issue: Hubungan frasa ἡ ἐπὶ Τίτου dengan kebanggaan Paulus
  choice: Diterjemahkan 'di hadapan Titus', dengan rujukan kepada apa yang Paulus katakan mengenai jemaat Korintus dibiarkan dipahami dari klausa pertama.
  alternative: '''kepada Titus'' atau ''tentang kalian kepada Titus''.'
  rationale: Bentuk ini dekat dengan konstruksi Yunani dan tidak menambahkan objek tersirat ke dalam teks utama, sambil tetap masuk akal dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk membedakan ὑμῶν/ὑμῖν dari bentuk tunggal. Struktur perbandingan Yunani dipertahankan dengan 'sama seperti ... demikian juga'.
