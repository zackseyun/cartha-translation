id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: id
  text: Bukan hanya karena kedatangannya,[a] melainkan juga karena penghiburan yang dialaminya karena kamu.[b] Ketika ia memberitahukan kepada kami tentang kerinduanmu, dukacitamu,[c] dan semangatmu terhadap aku, aku semakin bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehadirannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dorongan yang dialaminya karena kamu.” Kata benda dan kata kerja Yunani di sini berasal dari kata yang sama, yang juga dapat berarti “menghibur” atau “mendorong.”
    reason: lexical_alternative
  - marker: c
    text: Atau “ratapanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: kedatangannya
  rationale: Dalam konteks perjalanan Titus, kata ini menunjuk pada kedatangan, bukan sekadar keadaan hadir; bentuk ini alami dalam bahasa Indonesia.
- source_word: παρακλήσει ᾗ παρεκλήθη
  choice: penghiburan yang diterimanya
  rationale: Konteks menekankan kelegaan emosional Titus. Ungkapan ini menyampaikan hubungan antara nomina dan verba serumpun tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
- source_word: ἐφ’ ὑμῖν
  choice: karena kamu
  rationale: ἐπί dengan datif di sini paling wajar menyatakan dasar atau sebab penghiburan Titus, yakni tanggapan jemaat Korintus, meskipun arti 'mengenai kamu' tetap mungkin.
- source_word: ἀναγγέλλων
  choice: Ia memberi tahu kami
  rationale: Partisipel ini menerangkan cara Paulus mengetahui keadaan jemaat; dijadikan kalimat tersendiri agar jelas dan alami.
- source_word: ἐπιπόθησιν
  choice: kerinduanmu
  rationale: Kata ini menyatakan hasrat atau kerinduan yang kuat dan tetap mempertahankan intensitas emosionalnya.
- source_word: ὀδυρμόν
  choice: dukacitamu
  rationale: Kata ini menunjuk pada kesedihan yang mendalam, bahkan ratapan; 'dukacita' terdengar alami dan bermartabat.
- source_word: ζῆλον ὑπὲρ ἐμοῦ
  choice: semangatmu untuk membela aku
  rationale: ζῆλος menyatakan semangat yang sungguh-sungguh, sedangkan ὑπέρ dapat menunjukkan keberpihakan atau tindakan demi Paulus. Konteks ayat 11 mendukung nuansa pembelaan, tanpa meniadakan kemungkinan arti yang lebih umum, 'perhatianmu terhadap aku'.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: sehingga aku semakin bersukacita
  rationale: Menyatakan hasil dan mempertahankan daya komparatif μᾶλλον.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kalimat Yunani yang panjang dibagi untuk kelancaran, sementara hubungan logisnya dipertahankan. Pronomina jamak Yunani diterjemahkan dengan 'kamu' sesuai pemakaian Indonesia modern; semuanya merujuk kepada jemaat Korintus.
