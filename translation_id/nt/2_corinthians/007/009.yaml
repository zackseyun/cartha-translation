source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: id
  text: Sekarang aku bersukacita, bukan karena kamu dibuat berdukacita, melainkan karena kamu dibuat berdukacita sehingga bertobat. Sebab kamu dibuat berdukacita menurut Allah[a], supaya kamu tidak mengalami kerugian apa pun dari kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan kehendak Allah” atau “dengan cara yang berkenan kepada Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “karena kami” atau “oleh kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Sekarang aku bersukacita
  rationale: Mempertahankan penanda waktu νῦν dan daya verbal χαίρω dengan ragam yang wajar serta bermartabat.
- source_word: ἐλυπήθητε
  choice: kamu dibuat berdukacita
  rationale: Bentuk pasif mempertahankan bentuk verba Yunani dan pengulangannya, tanpa menetapkan secara eksplisit siapa pelakunya.
- source_word: εἰς μετάνοιαν
  choice: dukacita itu membawa kamu kepada pertobatan
  rationale: Ungkapan ini menyampaikan arah atau hasil yang dinyatakan oleh εἰς, sedangkan 'pertobatan' mempertahankan bobot moral-rohani μετάνοια dalam konteks ini.
- source_word: κατὰ θεόν
  choice: menurut Allah
  rationale: Terjemahan yang relatif formal ini mempertahankan keluasan hubungan dukacita tersebut dengan ukuran, kehendak, atau maksud Allah, tanpa memilih hanya satu nuansa.
- source_word: ἵνα ἐν μηδενὶ ζημιωθῆτε
  choice: supaya kamu tidak mengalami kerugian apa pun
  rationale: Menyampaikan tujuan atau hasil yang dimaksud oleh ἵνα dengan bentuk pasif ζημιωθῆτε dan cakupan penuh ἐν μηδενί.
- source_word: ἐξ ἡμῶν
  choice: dari kami
  rationale: Mempertahankan secara langsung gagasan sumber dalam ἐξ, sambil mencatat kemungkinan nuansa sebab dalam catatan kaki.
theological_decisions:
- issue: Sifat dukacita dalam κατὰ θεόν
  choice: menurut Allah
  alternative: sesuai dengan kehendak Allah; dengan cara yang berkenan kepada Allah
  rationale: Pilihan utama menjaga ketegangan semantis ungkapan Yunani, yang dapat menunjuk pada ukuran, kehendak, atau maksud Allah, tanpa mengubahnya menjadi istilah teologis yang lebih sempit.
- issue: Makna μετάνοια dalam konteks ini
  choice: pertobatan
  alternative: perubahan hati dan pikiran
  rationale: Dalam konteks tanggapan moral terhadap teguran Paulus, 'pertobatan' secara alami mencakup perubahan batin yang menghasilkan perubahan arah, tanpa mereduksinya menjadi perubahan pendapat belaka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan bentuk pasif dipertahankan untuk mencerminkan pola retoris teks Yunani; ungkapan yang kurang lazim 'menurut Allah' sengaja dipertahankan dan dijelaskan melalui catatan kaki agar ambiguitas aslinya tidak dihapus.
