  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur utama teks SBLGNT: hubungan inferensial dan konsesif (ἄρα εἰ καὶ), tindakan menulis Paulus, dua pihak yang secara retoris disisihkan sebagai tujuan utama, serta tujuan agar kesungguhan jemaat bagi Paulus dan rekan-rekannya menjadi nyata di hadapan Allah. “Di antara kamu” merupakan pemecahan Indonesia yang wajar bagi frasa πρὸς ὑμᾶς yang secara sintaksis sulit, tanpa menghilangkan ketidaklaziman bacaan yang dicetak.'
