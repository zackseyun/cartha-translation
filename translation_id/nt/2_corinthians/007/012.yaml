language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: id
  text: Jadi, sekalipun aku telah menulis kepada kamu, itu bukan karena orang yang berbuat salah ataupun karena orang yang diperlakukan tidak adil, melainkan supaya kesungguhanmu bagi kami menjadi nyata di antara kamu di hadapan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “supaya kesungguhan kami bagi kamu menjadi nyata di antara kamu di hadapan Allah.”
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Jadi, sekalipun
  rationale: “Jadi” mempertahankan hubungan kesimpulan dengan konteks sebelumnya, sedangkan “sekalipun” menyampaikan daya konsesif εἰ καὶ secara alami.
- source_word: ἔγραψα
  choice: aku telah menulis
  rationale: Mengacu pada surat Paulus sebelumnya; bentuk perfektif bahasa Indonesia memberi hubungan yang wajar dengan keadaan yang sedang dibicarakan.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: bukan karena orang yang berbuat salah
  rationale: Menyampaikan ἕνεκεν sebagai alasan dan mempertahankan unsur verbal dalam partisip substantival ἀδικήσαντος tanpa mempersempit identitas pelakunya.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: ataupun karena orang yang diperlakukan tidak adil
  rationale: Mempertahankan kesejajaran dengan frasa sebelumnya serta makna pasif ἀδικηθέντος.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: melainkan supaya ... menjadi nyata
  rationale: Konstruksi infinitif berartikel dengan ἕνεκεν menyatakan tujuan; “menjadi nyata” mempertahankan nuansa pasif tanpa terasa kaku.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: kesungguhanmu
  rationale: σπουδή menunjuk pada kesungguhan, perhatian, atau semangat yang sungguh-sungguh. “Kesungguhan” cukup luas dan alami dalam konteks ini.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: bagi kami
  rationale: Mengungkapkan arah perhatian atau kepedulian jemaat kepada Paulus dan rekan-rekannya.
- source_word: πρὸς ὑμᾶς
  choice: di antara kamu
  rationale: Dalam klausa yang sulit ini, pilihan tersebut menyampaikan bahwa kesungguhan itu menjadi nyata dalam lingkungan jemaat, seraya tidak memaksakan makna arah harfiah yang terasa janggal dalam bahasa Indonesia.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan baku dan khidmat yang mempertahankan gagasan kehadiran serta kesaksian ilahi.
theological_decisions:
- issue: Rujukan dan hubungan sintaksis dalam frasa τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς
  choice: kesungguhanmu bagi kami menjadi nyata di antara kamu
  alternative: kesungguhan kami bagi kamu menjadi nyata di antara kamu
  rationale: Teks utama SBLGNT mendukung “kesungguhanmu bagi kami.” Karena susunan Yunaninya sulit dan terdapat varian naskah penting yang membaca “kesungguhan kami bagi kamu,” alternatif itu dicatat tanpa menggantikan bacaan teks utama.
- issue: Tujuan Paulus menulis
  choice: bukan terutama demi pelaku atau pihak yang dirugikan, melainkan agar kesungguhan jemaat menjadi nyata
  alternative: Pernyataan ini meniadakan segala kepedulian Paulus terhadap kedua pihak
  rationale: Struktur retoris οὐχ ... οὐδὲ ... ἀλλά menyoroti tujuan utama surat dalam konteks ini; terjemahan tidak memperluasnya menjadi penyangkalan mutlak terhadap kepedulian Paulus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Pronomina tunggal “aku” merujuk kepada Paulus, sedangkan “kamu” bersifat jamak secara konteks karena ditujukan kepada jemaat Korintus. Penanda catatan kaki [a] ditempatkan setelah kalimat yang mengandung varian tekstual.
