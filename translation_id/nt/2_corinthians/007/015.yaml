source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: id
  text: Kasih sayangnya terhadap kamu semakin besar lagi ketika ia mengingat ketaatan kamu semua dan bagaimana kamu menyambut dia dengan takut dan gentar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan rasa hormat dan gentar”; ungkapan “takut dan gentar” merupakan ungkapan khas Paulus yang menyatakan tanggapan yang sungguh-sungguh dan rendah hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: kasih sayang
  rationale: Secara harfiah menunjuk pada bagian dalam tubuh, tetapi secara idiomatis menyatakan perasaan kasih yang mendalam. “Kasih sayang” alami dalam bahasa Indonesia modern dan mempertahankan daya emosional ungkapan itu.
- source_word: περισσοτέρως
  choice: bahkan semakin besar
  rationale: Adverbia komparatif ini menegaskan bertambahnya kasih sayang Titus kepada jemaat Korintus.
- source_word: εἰς ὑμᾶς
  choice: kepada kamu
  rationale: Preposisi εἰς menunjukkan arah kasih sayang Titus kepada orang-orang Korintus. Bentuk jamaknya diperjelas kemudian oleh “kamu semua”.
- source_word: ἀναμιμνῃσκομένου
  choice: ketika ia mengingat
  rationale: Partisip ini menyatakan keadaan yang menyertai bertambahnya kasih sayang Titus dan tetap alami dalam bahasa Indonesia.
- source_word: ὑπακοήν
  choice: ketaatan
  rationale: Ini merupakan padanan langsung yang mempertahankan gagasan bahwa jemaat menanggapi petunjuk rasuli dengan taat.
- source_word: πάντων ὑμῶν
  choice: kamu semua
  rationale: Ungkapan ini menekankan seluruh komunitas tanpa terkecuali.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: dengan takut dan gentar
  rationale: Terjemahan ini mempertahankan ungkapan khas Paulus beserta ketegangan maknanya, yang dalam konteks dapat menunjuk pada kesungguhan, kerendahan hati, dan rasa hormat, bukan semata-mata kengerian.
- source_word: ἐδέξασθε
  choice: kamu menyambut
  rationale: Dalam konteks kedatangan Titus, “menyambut” secara alami mencakup tindakan menerima dirinya dengan sikap tertentu tanpa menjadikannya sekadar persetujuan terhadap sebuah gagasan.
- source_word: αὐτόν
  choice: dia
  rationale: Kata ganti dipertahankan seperti dalam teks Yunani; konteks langsung menunjukkan bahwa yang dimaksud ialah Titus.
theological_decisions:
- issue: Makna “takut dan gentar” dalam cara jemaat Korintus menyambut Titus
  choice: Ungkapan dipertahankan secara langsung dalam teks utama sebagai “takut dan gentar”, dengan catatan bahwa ungkapan itu dapat menyatakan kesungguhan penuh hormat dan kerendahan hati.
  alternative: “Dengan rasa hormat dan gentar” atau pemahaman sebagai ketakutan harfiah.
  rationale: Ungkapan Paulus ini memiliki daya idiomatis, tetapi teks tidak perlu dipersempit menjadi satu penafsiran saja. Terjemahan utama mempertahankan ketegangan tersebut, sedangkan catatan kaki memberi alternatif yang wajar dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu semua” mempertahankan penekanan jamak pada seluruh jemaat, sedangkan “kasih sayang” menyampaikan makna idiomatis σπλάγχνα tanpa kekakuan harfiah.
