revisions:
- from: Sebab, jika pelayanan yang mendatangkan penghukuman datang dengan kemuliaan, terlebih lagi pelayanan yang mendatangkan kebenaran berlimpah dalam kemuliaan.[a]
  to: Sebab, jika pelayanan penghukuman disertai kemuliaan, terlebih lagi pelayanan kebenaran[a] berlimpah dalam kemuliaan.
  rationale: Revisi menghilangkan tambahan makna kausatif pada kedua genitif, mengganti ungkapan yang tidak idiomatis dengan predikasi Indonesia yang alami, dan memindahkan jangkar catatan kaki agar langsung merujuk pada “kebenaran.” Kontras Paulus antara kemuliaan yang menyertai pelayanan pertama dan kelimpahan kemuliaan pada pelayanan kedua tetap dipertahankan.
