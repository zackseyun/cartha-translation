review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena genitif τῆς κατακρίσεως dan τῆς δικαιοσύνης dalam bahasa sumber adalah konstruksi ringkas yang tidak secara eksplisit menyatakan hubungan kausatif. Frasa draft “yang mendatangkan” menambahkan bahwa masing-masing pelayanan menghasilkan penghukuman atau kebenaran. Mempertahankan “pelayanan penghukuman” dan “pelayanan kebenaran” menjaga keluasan hubungan genitif tersebut. Klausa pertama yang tanpa verba paling alami dalam bahasa Indonesia sebagai “disertai kemuliaan”; ini menyatakan hadirnya kemuliaan tanpa menyamakan intensitasnya dengan “berlimpah dalam kemuliaan” pada klausa kedua.
  naturalness: “Pelayanan ... datang dengan kemuliaan” kurang idiomatis dalam bahasa Indonesia karena pelayanan bukan pelaku yang lazim “datang”. “Pelayanan penghukuman disertai kemuliaan” modern, jelas, dan tetap bernada formal. Penempatan penanda catatan kaki langsung sesudah “kebenaran” membuat acuannya tegas.
  terminology: “Pelayanan,” “penghukuman,” “kemuliaan,” dan “kebenaran” merupakan padanan yang baik dan konsisten dengan istilah Paulus. Catatan “Atau ‘keadilan’” layak dipertahankan sebagai alternatif leksikal bagi δικαιοσύνη, tanpa menjadikan salah satu nuansa itu sebagai pembatasan tafsir dalam teks utama.
  issues:
  - severity: medium
    issue: “yang mendatangkan penghukuman / yang mendatangkan kebenaran” menafsirkan genitif sebagai hasil kausatif.
    rationale: Teks Yunani hanya menyatakan “pelayanan penghukuman” dan “pelayanan kebenaran.” Hubungan genitif itu dapat dipahami dalam beberapa cara terkait, tetapi tidak perlu dipersempit menjadi “mendatangkan.”
  - severity: low
    issue: “pelayanan ... datang dengan kemuliaan” tidak alami dalam bahasa Indonesia.
    rationale: Verba “datang” lebih lazim untuk orang, peristiwa, atau benda yang bergerak. “Disertai kemuliaan” menyampaikan predikasi nominal Yunani secara idiomatis.
  revised_text: Sebab, jika pelayanan penghukuman disertai kemuliaan, terlebih lagi pelayanan kebenaran[a] berlimpah dalam kemuliaan.
  revised_footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
  revision_rationale: Revisi menghilangkan tambahan makna kausatif pada kedua genitif, mengganti ungkapan yang tidak idiomatis dengan predikasi Indonesia yang alami, dan memindahkan jangkar catatan kaki agar langsung merujuk pada “kebenaran.” Kontras Paulus antara kemuliaan yang menyertai pelayanan pertama dan kelimpahan kemuliaan pada pelayanan kedua tetap dipertahankan.
