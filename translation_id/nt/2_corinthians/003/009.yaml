  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: id
  text: Sebab, jika pelayanan penghukuman disertai kemuliaan, terlebih lagi pelayanan kebenaran[a] berlimpah dalam kemuliaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: pelayanan
  rationale: Kata ini menunjuk pada pelayanan atau penyelenggaraan yang dikontraskan Paulus; “pelayanan” alami dalam bahasa Indonesia dan cukup luas untuk konteks perjanjian.
- source_word: κατάκρισις
  choice: penghukuman
  rationale: Mempertahankan arti forensik berupa putusan yang menyatakan bersalah, serta kontrasnya dengan δικαιοσύνη.
- source_word: δόξα
  choice: kemuliaan
  rationale: Padanan baku yang mempertahankan tema kemuliaan dalam rangkaian argumen Paulus.
- source_word: πολλῷ μᾶλλον
  choice: terlebih lagi
  rationale: Ungkapan Indonesia yang alami untuk menyampaikan peningkatan perbandingan yang kuat.
- source_word: περισσεύω
  choice: berlimpah
  rationale: Menyampaikan gagasan kelimpahan yang melampaui, tanpa mengurangi daya perbandingan Paulus.
- source_word: δικαιοσύνη
  choice: kebenaran
  rationale: Padanan Indonesia yang lazim bagi istilah Paulus dan tetap dapat mencakup keadaan benar di hadapan Allah; nuansa “keadilan” dipertahankan dalam catatan kaki.
- source_word: εἰ γὰρ τῇ διακονίᾳ ... δόξα
  choice: sebab, jika ... datang dengan kemuliaan
  rationale: Klausa Yunani tidak memiliki verba; “datang dengan” melengkapinya secara alami dan menyatakan bahwa pelayanan itu disertai kemuliaan tanpa menyamakan tingkatnya dengan kelimpahan kemuliaan pada klausa kedua.
theological_decisions:
- issue: Arti δικαιοσύνη dalam kontras antara kedua pelayanan
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” mempertahankan istilah teologis Paulus yang luas dan kontrasnya dengan penghukuman, sementara kemungkinan nuansa keadilan tidak dihapus dan dicatat sebagai alternatif.
- issue: Hubungan genitif pada pelayanan penghukuman dan pelayanan kebenaran
  choice: yang mendatangkan penghukuman / yang mendatangkan kebenaran
  alternative: pelayanan penghukuman / pelayanan kebenaran
  rationale: Ungkapan “yang mendatangkan” membuat hubungan hasil atau dampaknya jelas dan alami dalam bahasa Indonesia, tetapi tidak menentukan secara lebih sempit bagaimana setiap pelayanan beroperasi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur perbandingan Paulus dipertahankan, termasuk ketimpangan antara pelayanan pertama yang datang dengan kemuliaan dan pelayanan kedua yang berlimpah dalam kemuliaan. Penanda catatan kaki ditempatkan sesudah klausa yang memuat “kebenaran” agar tetap hadir dalam teks utama.
