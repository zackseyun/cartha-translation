reference: 2 Corinthians 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: id
  text: Dialah juga yang membuat kami sanggup menjadi pelayan-pelayan suatu perjanjian baru, bukan pelayan huruf, melainkan pelayan Roh[a]. Sebab huruf mematikan[b], tetapi Roh menghidupkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh”, di kedua tempat.
    reason: alternative_reading
  - marker: b
    text: “Huruf” juga dapat dipahami sebagai “ketentuan tertulis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: membuat kami sanggup
  rationale: Mengungkapkan tindakan Allah yang memperlengkapi atau menjadikan layak, tanpa menyiratkan sekadar kecakapan alami ataupun sertifikasi resmi.
- source_word: διακόνους
  choice: pelayan-pelayan
  rationale: Mempertahankan gagasan pelayanan dalam διάκονος dan tidak memasukkan pengertian jabatan gerejawi yang lebih belakangan.
- source_word: καινῆς διαθήκης
  choice: suatu perjanjian baru
  rationale: Mencerminkan frasa Yunani tanpa artikel sambil tetap mempertahankan kategori perjanjian yang penting dalam argumentasi Paulus.
- source_word: γράμματος / γράμμα
  choice: huruf
  rationale: Mempertahankan metafora ringkas dan kontras langsung Paulus dengan πνεῦμα; kemungkinan makna 'ketentuan tertulis' dicatat dalam catatan kaki.
- source_word: πνεύματος / πνεῦμα
  choice: Roh
  rationale: Dalam konteks perjanjian baru, rujukannya paling mungkin Roh Kudus; kapitalisasi menyatakan penilaian ini, sementara kemungkinan 'roh' dipertahankan dalam catatan kaki.
- source_word: ἀποκτέννει
  choice: mematikan
  rationale: Padanan langsung dan kuat yang mempertahankan daya ungkap serta bentuk kini dari kontras tersebut.
- source_word: ζῳοποιεῖ
  choice: menghidupkan
  rationale: Padanan Indonesia yang alami dan tepat untuk tindakan memberi atau menjadikan hidup.
theological_decisions:
- issue: Apakah πνεῦμα merujuk kepada 'Roh' atau 'roh'
  choice: Roh
  alternative: roh
  rationale: Konteks perjanjian baru paling kuat menunjuk kepada Roh Kudus sebagai pemberi hidup. Namun, naskah Yunani tidak membedakannya melalui huruf kapital, sehingga alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kontras 'bukan ... melainkan ...' mempertahankan struktur retoris Yunani. 'Pelayan-pelayan' dipilih daripada istilah yang dapat terdengar sebagai jabatan gerejawi tertentu.
