  naturalness: '"Kamu" tidak mencerminkan subjek jamak ἐστὲ; "kalian" diperlukan. "Kalian terbukti sebagai" dan "yang kami sampaikan" merupakan bahasa Indonesia modern yang jelas, sambil mempertahankan metafora surat dan peran para pelayan. "Loh-loh, yaitu hati-hati yang berdaging" secara eksplisit dan alami menyampaikan aposisi Yunani.'
  terminology: '"Mesias", "Roh Allah yang hidup", dan "loh-loh batu" tepat. "Hati-hati yang berdaging" mempertahankan citra καρδίαις σαρκίναις serta gaung Yehezkiel tanpa menyiratkan bahwa hati-hati itu terbuat dari daging sebagai bahan fisik.'
