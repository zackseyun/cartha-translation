reference: 2 Corinthians 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: id
  text: Kalian terbukti sebagai surat dari Mesias[a], yang kami sampaikan, yang ditulis bukan dengan tinta, melainkan dengan Roh Allah yang hidup, bukan pada loh-loh batu, melainkan pada loh-loh, yaitu hati-hati yang berdaging.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surat Mesias” atau “surat milik Mesias.” Bentuk genitif Yunani dapat menunjukkan sumber atau kepengarangan, tetapi juga dapat menyatakan hubungan secara lebih umum. “Mesias” menerjemahkan gelar Χριστός, yang secara tradisional diterjemahkan “Kristus.”
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “pada loh-loh, yaitu hati-hati yang berdaging.” Ungkapan ini menggemakan gambaran perjanjian baru dalam Yehezkiel 11:19 dan 36:26.
    reason: translation_and_cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: Kamu menunjukkan dengan nyata
  rationale: Partisipel ini menyatakan bahwa jati diri jemaat sebagai surat tampak atau terbukti secara terbuka. Ungkapan ini mempertahankan nuansa evidensialnya dalam bahasa Indonesia yang wajar.
- source_word: ἐπιστολὴ
  choice: surat
  rationale: Padanan modern dan langsung yang mempertahankan metafora Paulus tanpa diksi gerejawi yang kuno.
- source_word: Χριστοῦ
  choice: dari Mesias
  rationale: Χριστός berfungsi sebagai gelar. Kata depan 'dari' menyampaikan kemungkinan kuat bahwa Mesias adalah sumber atau pengarang surat tersebut, sementara catatan kaki mempertahankan ambiguitas genitif Yunani.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: yang dilayani oleh kami
  rationale: Bentuk pasif διακονηθεῖσα menggambarkan Paulus dan rekan-rekannya sebagai pelayan atau perantara surat itu. Terjemahan ini lebih dekat pada verba sumber daripada 'disampaikan', meskipun metaforanya sengaja tetap tidak biasa.
- source_word: ἐγγεγραμμένη
  choice: ditulis
  rationale: Padanan alami yang cocok dengan pertentangan antara tinta dan Roh.
- source_word: μέλανι
  choice: tinta
  rationale: Padanan leksikal langsung dalam metafora penulisan.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: Roh Allah yang hidup
  rationale: Konteks perjanjian dan pertentangan dengan tinta menunjuk kepada Roh Allah; kapitalisasi menandai rujukan pribadi tersebut tanpa menambahkan kata 'Kudus' yang tidak terdapat dalam teks.
- source_word: πλαξὶν λιθίναις
  choice: loh-loh batu
  rationale: Ungkapan ini alami dalam bahasa Alkitab Indonesia dan mempertahankan alusi kepada loh hukum di Sinai.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: loh-loh berupa hati dari daging
  rationale: Konstruksi 'berupa' menjelaskan hubungan aposisional bahwa loh-loh itu adalah hati, sementara 'hati dari daging' mempertahankan citra perjanjian baru yang berakar dalam Yehezkiel.
theological_decisions:
- issue: Makna genitif Χριστοῦ
  choice: surat dari Mesias
  alternative: surat milik Mesias; surat Mesias
  rationale: 'Dalam metafora ini genitif kemungkinan besar menunjukkan sumber atau kepengarangan: jemaat merupakan surat yang berasal dari Mesias. Catatan kaki mempertahankan kemungkinan hubungan genitif yang lebih umum.'
- issue: Identitas πνεύματι
  choice: Roh Allah yang hidup
  alternative: roh Allah yang hidup
  rationale: Pertentangan antara tinta dan karya ilahi pada hati dalam konteks perjanjian sangat mendukung rujukan kepada Roh Allah, bukan sekadar sikap batin atau napas.
- issue: Hubungan πλαξὶν dengan καρδίαις σαρκίναις
  choice: loh-loh berupa hati dari daging
  alternative: loh-loh hati yang berdaging
  rationale: Terjemahan utama membaca καρδίαις σαρκίναις secara aposisional terhadap πλαξὶν, sehingga hati itu sendiri menjadi loh. Rumusan ini juga mempertahankan gema tentang hati dari daging tanpa mengubahnya menjadi sekadar 'hati manusia'.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan cukup dekat dengan susunan Yunani. Metafora surat, pelayanan, penulisan, dan loh dipertahankan. Frasa 'hati dari daging' sengaja mempertahankan gema Perjanjian Lama meskipun bukan ungkapan percakapan sehari-hari.
