revisions:
- from: Kamu menunjukkan dengan nyata bahwa kamu adalah surat dari Mesias[a], yang dilayani oleh kami, ditulis bukan dengan tinta, melainkan dengan Roh Allah yang hidup, bukan pada loh-loh batu, melainkan pada loh-loh berupa hati dari daging.[b]
  to: Kalian terbukti sebagai surat dari Mesias[a], yang kami sampaikan, yang ditulis bukan dengan tinta, melainkan dengan Roh Allah yang hidup, bukan pada loh-loh batu, melainkan pada loh-loh, yaitu hati-hati yang berdaging.[b]
  rationale: Revisi membetulkan subjek jamak dan daya pasif φανερούμενοι, mengganti ungkapan pelayanan yang tidak alami dengan padanan kontekstual bagi peran para pelayan sebagai perantara surat, serta memperjelas bahwa hati-hati yang berdaging itu sendiri adalah loh-loh. Catatan kaki mempertahankan ambiguitas genitif Χριστοῦ dan menjelaskan konstruksi aposisional akhir.
  reviewer_model: gpt-5.6-terra
