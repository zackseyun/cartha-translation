lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: Bukankah
  rationale: Gabungan ini membentuk pertanyaan retoris yang mengharapkan jawaban positif. “Bukankah” menyampaikan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: μᾶλλον
  choice: lebih besar lagi
  rationale: Menandai peningkatan dalam perbandingan dari pelayanan pada ayat sebelumnya; “lagi” menegaskan gerak dari yang lebih kecil kepada yang lebih besar.
- source_word: ἡ διακονία
  choice: pelayanan
  rationale: Dalam konteks ini menunjuk pada pelayanan yang dipercayakan dalam tatanan perjanjian, sehingga “pelayanan” lebih tepat daripada istilah yang hanya berarti bantuan atau pengabdian umum.
- source_word: τοῦ πνεύματος
  choice: Roh
  rationale: Konteks langsung, khususnya kontras dengan huruf dan penyebutan Roh yang menghidupkan dalam ayat 6, paling wajar menunjuk kepada Roh Kudus. Huruf kapital menandai referen tersebut tanpa menambahkan sebutan yang tidak eksplisit dalam teks.
- source_word: ἔσται
  choice: akan berlangsung
  rationale: Bentuk futurum dipertahankan dengan “akan”. Kata “berlangsung” membuat hubungan dengan frasa ἐν δόξῃ alami tanpa mengubah pelayanan menjadi sekadar sifat abstrak.
- source_word: ἐν δόξῃ
  choice: dalam kemuliaan
  rationale: Mempertahankan bentuk preposisional Yunani dan kaitan tematis dengan kemuliaan dalam paragraf ini. Kemungkinan nuansa penyertaan dicatat dalam catatan kaki.
theological_decisions:
- issue: Referen πνεύματος
  choice: Roh, yakni Roh Kudus
  alternative: roh dalam arti abstrak atau nonpersonal
  rationale: Kontras antara huruf dan Roh dalam 2 Korintus 3:6 serta argumen tentang pelayanan perjanjian mendukung referen kepada Roh Kudus.
- issue: Hubungan genitif τοῦ πνεύματος dengan διακονία
  choice: pelayanan Roh
  alternative: pelayanan yang dikerjakan atau diberikan oleh Roh
  rationale: Bentuk ringkas ini mempertahankan keluasan genitif Yunani dan tidak membatasi hubungannya hanya kepada pelaku, sumber, atau ciri pelayanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan retoris dialihkan secara idiomatis dengan “Bukankah”, sedangkan frasa “dalam kemuliaan” dipertahankan untuk menjaga gema leksikal dengan konteks sekitarnya.
