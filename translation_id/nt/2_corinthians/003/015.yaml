source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: id
  text: Namun, sampai hari ini, setiap kali Musa dibacakan[a], selubung menutupi hati mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Musa”; maksudnya ialah tulisan-tulisan Musa, khususnya hukum Taurat.
    reason: cultural_note
  - marker: b
    text: Kata “hati” berbentuk tunggal dalam bahasa Yunani dan kemungkinan digunakan secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: ἕως σήμερον
  choice: sampai hari ini
  rationale: Mengungkapkan bahwa keadaan tersebut terus berlangsung hingga masa kini.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: setiap kali ... dibacakan
  rationale: ἡνίκα dengan ἄν dan bentuk subjungtif kini menunjukkan keadaan berulang yang tidak tertentu; bentuk pasif 'dibacakan' juga sesuai dengan konteks pembacaan Kitab Suci di hadapan umat.
- source_word: Μωϋσῆς
  choice: tulisan Musa
  rationale: Nama 'Musa' dipakai secara metonimis untuk tulisan-tulisan yang dikaitkan dengannya. Penambahan 'tulisan' diperlukan agar ungkapan 'dibacakan' alami dan langsung dipahami dalam bahasa Indonesia, sementara nama Musa tetap dipertahankan.
- source_word: κάλυμμα
  choice: selubung
  rationale: Mempertahankan gambaran penutup dalam konteks pasal ini dan terdengar alami serta bermartabat dalam bahasa Indonesia.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: menutupi hati mereka
  rationale: Menyampaikan letak selubung di atas hati secara idiomatis, sekaligus mempertahankan bentuk tunggal kolektif 'hati' dari teks Yunani.
- source_word: κεῖται
  choice: menutupi
  rationale: Secara harfiah berarti 'terletak' atau 'berada', tetapi dalam gambaran selubung di atas hati, 'menutupi' merupakan padanan Indonesia yang jelas dan alami tanpa mengubah metaforanya.
theological_decisions:
- issue: Apakah Μωϋσῆς harus diterjemahkan hanya sebagai nama 'Musa' atau dijelaskan sebagai tulisan Musa
  choice: tulisan Musa
  alternative: Musa; hukum Musa
  rationale: Dalam konteks pembacaan, 'Musa' merupakan metonimi bagi tulisan-tulisannya. 'Tulisan Musa' membuat maksud itu jelas tanpa mempersempitnya hanya pada hukum atau memasukkan penafsiran denominasi tertentu.
- issue: Apakah καρδίαν tunggal harus dibuat jamak dalam bahasa Indonesia
  choice: hati mereka
  alternative: hati masing-masing
  rationale: Bentuk tunggal kolektif dalam teks Yunani dipertahankan karena bahasa Indonesia dapat memakai 'hati mereka' secara alami dan tidak perlu menentukan apakah tekanannya kolektif atau individual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan dibuat alami bagi pembaca umum, sambil mempertahankan metafora selubung dan bentuk tunggal kolektif 'hati'.
