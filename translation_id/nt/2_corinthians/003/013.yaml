id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: id
  text: dan tidak seperti Musa, yang biasa menutupi wajahnya dengan selubung agar orang-orang Israel[a] tidak menatap akhir dari apa yang sedang berlalu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “anak-anak lelaki Israel”; maksudnya, orang-orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tujuan/hasil dari apa yang sedang diakhiri.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: seperti
  rationale: Menandai perbandingan dengan pernyataan sebelumnya secara alami dan tepat dalam bahasa Indonesia.
- source_word: ἐτίθει
  choice: biasa menutupi
  rationale: Bentuk imperfek menunjukkan tindakan yang dilakukan secara berulang atau menjadi kebiasaan; frasa ini menyampaikan aspek tersebut dengan wajar.
- source_word: κάλυμμα
  choice: selubung
  rationale: Istilah ini tepat untuk kain penutup wajah dalam latar kisah Musa dan tetap cocok dengan metafora Paulus dalam konteks ini.
- source_word: ἐπὶ τὸ πρόσωπον αὐτοῦ
  choice: wajahnya dengan
  rationale: 'Dalam susunan Indonesia yang alami, objek yang ditutupi disebut sebelum alat penutup: ''menutupi wajahnya dengan selubung''.'
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: agar ... tidak menatap
  rationale: Menyampaikan tujuan dan mempertahankan nuansa memandang dengan sungguh-sungguh dari ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: orang-orang Israel
  rationale: Ungkapan Yunani harfiah 'anak-anak lelaki Israel' merupakan idiom bagi umat Israel; padanan ini jelas, alami, dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: εἰς τὸ τέλος
  choice: akhir
  rationale: τέλος dapat berarti akhir, tujuan, atau hasil. Dalam kontras antara yang sementara dan yang tetap, 'akhir' paling langsung, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: τοῦ καταργουμένου
  choice: dari apa yang sedang berlalu
  rationale: Partisipel kini menunjukkan sesuatu yang tengah kehilangan daya atau lenyap. 'Sedang berlalu' mempertahankan proses itu tanpa memaksakan apakah sesuatu tersebut memudar dengan sendirinya atau sedang ditiadakan.
theological_decisions:
- issue: Makna εἰς τὸ τέλος τοῦ καταργουμένου
  choice: akhir dari apa yang sedang berlalu
  alternative: tujuan/hasil dari apa yang sedang diakhiri
  rationale: Konteks membandingkan yang sementara dengan yang tetap, sehingga 'akhir' dan 'sedang berlalu' sesuai dengan alur argumen. Namun, karena τέλος juga dapat berarti tujuan atau hasil dan καταργουμένου dapat bernuansa sedang diakhiri atau ditiadakan, alternatif itu dipertahankan dalam catatan kaki agar ketegangan tafsir tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Susunan 'menutupi wajahnya dengan selubung' dipilih demi kealamian. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
source_grounding:
  english_pob_role: consult_only
