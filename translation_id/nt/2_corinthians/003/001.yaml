base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: id
  text: Apakah kami mulai lagi merekomendasikan diri kami sendiri? Ataukah kami, seperti orang-orang tertentu, memerlukan surat-surat rekomendasi kepada kamu atau dari kamu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα
  choice: Apakah kami mulai
  rationale: Bentuk kini dalam pertanyaan retoris dipadankan secara alami dengan “apakah kami mulai”; konteks menyampaikan nuansa tindakan yang mulai dilakukan.
- source_word: πάλιν
  choice: lagi
  rationale: Menandai pengulangan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: memuji diri sendiri
  rationale: Dalam konteks ini, verba tersebut berarti menampilkan atau menyatakan diri secara menguntungkan. “Memuji diri sendiri” menyampaikan daya retorisnya secara jelas tanpa menyiratkan rekomendasi formal.
- source_word: μὴ χρῄζομεν
  choice: apakah kami memerlukan
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif; bentuk pertanyaan bahasa Indonesia mempertahankan fungsi retoris itu tanpa menambahkan penyangkalan eksplisit.
- source_word: ὥς τινες
  choice: seperti orang-orang tertentu
  rationale: Mempertahankan rujukan yang tidak ditentukan, dengan ungkapan yang jelas dan wajar.
- source_word: συστατικῶν ἐπιστολῶν
  choice: surat rekomendasi
  rationale: Merujuk pada surat yang memperkenalkan dan mendukung kelayakan seseorang; istilah ini lazim dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: πρὸς ὑμᾶς
  choice: kepada kamu
  rationale: πρός dengan akusatif menunjukkan arah surat kepada jemaat Korintus.
- source_word: ἢ ἐξ ὑμῶν
  choice: atau dari kamu
  rationale: ἐξ menunjukkan sumber; frasa ini mempertahankan kontras antara surat yang ditujukan kepada jemaat dan surat yang berasal dari mereka.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “kami” dan “kamu” mempertahankan pembedaan jumlah pada teks Yunani: Paulus dan rekan-rekannya berbicara kepada jemaat secara kolektif. Dua pertanyaan retoris serta kontras “kepada kamu atau dari kamu” dipertahankan.'
