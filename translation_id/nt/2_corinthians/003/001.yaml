  terminology: '''Surat-surat rekomendasi'' secara jelas menyampaikan fungsi συστατικῶν ἐπιστολῶν sebagai surat pengantar atau pengesahan. Tidak diperlukan istilah teologis khusus maupun catatan kaki leksikal.'
