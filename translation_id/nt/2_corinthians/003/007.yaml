source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: id
  text: Namun, jika pelayanan kematian yang terukir pada batu dalam huruf-huruf itu terjadi dalam kemuliaan, sehingga orang Israel[a] tidak sanggup menatap wajah Musa karena kemuliaan pada wajahnya, yang sedang memudar[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki Israel”; ungkapan ini dapat diterjemahkan “orang-orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang sedang ditiadakan” atau “yang sedang berlalu.”
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία τοῦ θανάτου
  choice: pelayanan yang membawa kematian
  rationale: Ungkapan ini mempertahankan gambaran pelayanan yang dipercayakan sekaligus mengungkapkan secara alami hubungan genitif dengan kematian, tanpa memperlunak kontras tajam Paulus.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: yang terukir dengan huruf-huruf pada batu
  rationale: Terjemahan ini mempertahankan unsur huruf, tindakan mengukir, dan bentuk jamak harfiah 'batu'; 'loh batu' tidak dimasukkan ke teks utama karena kata 'loh' tidak dinyatakan secara eksplisit.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: datang dengan kemuliaan
  rationale: Pilihan ini menyampaikan sifat peristiwa dari ἐγενήθη dan kemuliaan yang menyertai pelayanan itu dalam bahasa Indonesia yang wajar.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: sehingga ... tidak sanggup menatap
  rationale: Klausa akibat dipertahankan, sedangkan 'menatap' menyampaikan pandangan yang tetap atau sungguh-sungguh.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: orang Israel
  rationale: Ini merupakan sebutan kolektif yang alami bagi bangsa Israel dalam bahasa Indonesia; bentuk Yunani yang lebih harfiah dicatat dalam catatan kaki.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: menatap wajah Musa
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan fokus konkret pada wajah Musa.
- source_word: καταργουμένην
  choice: yang sedang memudar
  rationale: Dalam konteks langsung, partisip ini menerangkan kemuliaan yang tampak pada wajah Musa. 'Memudar' menyampaikan berkurangnya kemuliaan itu, sementara cakupan makna lain dicatat agar ketegangan teologis tidak ditutup.
theological_decisions:
- issue: Apakah καταργουμένην menggambarkan kemuliaan yang tampak makin pudar atau sesuatu yang sedang ditiadakan atau berlalu.
  choice: kemuliaan yang sedang memudar
  alternative: kemuliaan yang sedang ditiadakan; kemuliaan yang sedang berlalu
  rationale: Rujukan langsungnya adalah kemuliaan pada wajah Musa, sehingga 'memudar' cocok dengan gambaran yang dapat dilihat. Namun, kata Yunani juga dapat menekankan penghentian atau berlalunya sesuatu; kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Cara menyampaikan διακονία τοῦ θανάτου tanpa menentukan secara berlebihan jenis hubungan genitifnya.
  choice: pelayanan yang membawa kematian
  alternative: pelayanan kematian; pelayanan yang menghasilkan kematian
  rationale: '''Membawa kematian'' wajar dalam bahasa Indonesia dan mempertahankan daya kontras Paulus, tetapi tidak menjabarkan mekanisme teologis hubungan antara pelayanan tersebut dan kematian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibiarkan berlanjut dengan tanda koma karena ayat ini merupakan bagian awal dari konstruksi bersyarat yang diteruskan dalam konteks berikutnya. Tanda pisah membantu memperjelas bahwa frasa terakhir menerangkan kemuliaan pada wajah Musa.
