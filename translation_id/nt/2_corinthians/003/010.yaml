  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: id
  text: Sebab memang, dalam hal ini, apa yang telah dimuliakan itu tidak dimuliakan karena kemuliaan yang melampauinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena kemuliaan yang jauh lebih besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sebab ... pun
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ, sedangkan “pun” menyampaikan daya penegas καί secara wajar dalam bahasa Indonesia.
- source_word: οὐ δεδόξασται
  choice: tidak lagi dianggap mulia
  rationale: Ungkapan ini mempertahankan bentuk pasif dan paradoks perbandingan Paulus dalam bahasa Indonesia yang alami; “lagi” menunjukkan bahwa kemuliaan terdahulu kini tersisihkan dalam kerangka perbandingan ini, bukan bahwa kemuliaan itu tidak pernah ada.
- source_word: τὸ δεδοξασμένον
  choice: apa yang dahulu dimuliakan
  rationale: Bentuk partisip substantival diterjemahkan tanpa menambahkan kata benda tertentu. “Dahulu” menandai keadaan yang mendahului kemuliaan yang kini dibandingkan dengannya.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: dalam hal ini
  rationale: Frasa ini membatasi penyangkalan pada segi perbandingan yang sedang dibahas dan tidak menyangkal seluruh kemuliaan yang terdahulu.
- source_word: εἵνεκεν
  choice: karena
  rationale: Pilihan ini menyatakan hubungan sebab secara ringkas dan alami.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: kemuliaan yang melampauinya
  rationale: Partisip ὑπερβαλλούσης diterjemahkan secara verbal. Akhiran “-nya” memperjelas objek perbandingan yang tersirat dalam konteks, yaitu kemuliaan terdahulu.
- source_word: δόξα / δεδοξασμένον
  choice: dimuliakan ... mulia ... kemuliaan
  rationale: Pengulangan akar “mulia” mempertahankan permainan kata dari kelompok δοξ- sekaligus tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah Paulus menyangkal secara mutlak bahwa pelayanan terdahulu memiliki kemuliaan, atau menyatakannya secara perbandingan.
  choice: 'Penyangkalan komparatif yang dibatasi oleh frasa “dalam hal ini”: kemuliaan terdahulu diperlakukan seolah-olah tidak mulia bila dibandingkan dengan kemuliaan yang melampauinya.'
  alternative: Penyangkalan mutlak bahwa pelayanan terdahulu pernah memiliki kemuliaan sejati.
  rationale: Frasa ἐν τούτῳ τῷ μέρει membatasi penyangkalan, sementara konteks 2 Korintus 3 sendiri mengakui bahwa pelayanan terdahulu datang dengan kemuliaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan kalimat dibuat alami, tetapi pengulangan akar “mulia” dipertahankan untuk mencerminkan retorika Yunani. Penanda catatan kaki ditempatkan langsung setelah frasa yang memiliki alternatif terjemahan.
