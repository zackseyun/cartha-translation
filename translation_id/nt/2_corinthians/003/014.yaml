id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: id
  text: Namun, pikiran mereka menjadi keras. Sebab sampai hari ini, ketika perjanjian lama[a] dibacakan, selubung yang sama tetap ada dan tidak diangkat, karena di dalam Mesias selubung itu disingkirkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perjanjian Lama,” yakni tulisan-tulisan yang memuat perjanjian lama. Kata Yunani yang dipakai berarti “perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir juga dapat dipahami, “karena di dalam Mesias perjanjian itu ditiadakan.” Teks Yunani dapat mengacu kepada selubung atau kepada perjanjian lama.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη τὰ νοήματα αὐτῶν
  choice: pikiran mereka menjadi keras
  rationale: Mempertahankan gambaran pengerasan dan makna bahwa daya pengertian mereka menjadi tidak peka, tanpa menambahkan gagasan tentang pemberontakan yang disengaja.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Sebab sampai hari ini
  rationale: Mengungkapkan penekanan waktu dalam bahasa Indonesia modern yang alami.
- source_word: κάλυμμα
  choice: selubung
  rationale: Mempertahankan metafora yang menghubungkan ayat ini dengan selubung Musa dalam konteks sekitar.
- source_word: ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης
  choice: ketika perjanjian lama dibacakan
  rationale: Menyampaikan peristiwa pembacaan secara jelas dan menerjemahkan διαθήκη sebagai 'perjanjian', bukan langsung sebagai nama kumpulan kitab.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: tetap ada dan tidak diangkat
  rationale: Menjaga aspek keberlanjutan serta gambaran selubung yang belum diangkat.
- source_word: ἐν Χριστῷ
  choice: di dalam Mesias
  rationale: Menerjemahkan Χριστός sebagai gelar 'Mesias' dan mempertahankan ungkapan relasional ἐν.
- source_word: καταργεῖται
  choice: disingkirkan
  rationale: Dengan selubung sebagai anteseden terdekat, pilihan ini alami dalam bahasa Indonesia dan menyampaikan bahwa selubung itu dibuat tidak berlaku atau tidak lagi menghalangi.
theological_decisions:
- issue: Acuan subjek tersirat dalam καταργεῖται
  choice: 'Subjeknya dipahami sebagai selubung: ''di dalam Mesias selubung itu disingkirkan.'''
  alternative: 'Klausa itu dapat dipahami dengan perjanjian lama sebagai subjek: ''karena di dalam Mesias perjanjian itu ditiadakan.'''
  rationale: τὸ ... κάλυμμα adalah anteseden terdekat dan sesuai dengan rangkaian metafora selubung. Namun, susunan Yunani memungkinkan pembaca mengaitkannya dengan 'perjanjian lama', sehingga kemungkinan penting itu dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Selubung' dipilih untuk mempertahankan metafora konteks; 'menjadi keras' cukup alami bagi pembaca umum sambil tetap dekat dengan bentuk sumber.
