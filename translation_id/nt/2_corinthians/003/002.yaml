  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: id
  text: Kamulah surat kami, yang tertulis dalam hati kami, yang dikenal dan dibaca oleh semua orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: surat kami
  rationale: ἐπιστολή berarti komunikasi tertulis; “surat” merupakan padanan Indonesia modern yang jelas. Genitif ἡμῶν menyatakan hubungan kepunyaan dalam metafora Paulus.
- source_word: ὑμεῖς ἐστε
  choice: Kamulah
  rationale: Pronomina eksplisit ὑμεῖς mendapat penekanan. Bentuk “Kamulah” menyampaikan penegasan itu secara alami tanpa menambah unsur makna.
- source_word: ἐγγεγραμμένη
  choice: yang tertulis
  rationale: Partisipel perfek pasif menunjukkan keadaan yang tetap sebagai sesuatu yang telah ditulis; “tertulis” alami dan mempertahankan metafora surat.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: dalam hati kami
  rationale: ἐν secara langsung berarti “dalam” di sini; bentuk ini juga wajar dalam bahasa Indonesia dan tidak mengubah citra sumber.
- source_word: γινωσκομένη
  choice: yang dikenal
  rationale: γινώσκω dalam bentuk ini dapat berarti diketahui atau dikenali. “Dikenal” mempertahankan keluasan maknanya dan berpasangan secara alami dengan “dibaca”.
- source_word: ἀναγινωσκομένη
  choice: dibaca
  rationale: Kata ini menunjuk pada tindakan membaca dan secara langsung mempertahankan metafora surat.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: oleh semua orang
  rationale: ἄνθρωποι bersifat generik bagi manusia, bukan khusus laki-laki; “semua orang” adalah ungkapan Indonesia yang alami dan inklusif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan relatif “yang tertulis ... yang dikenal dan dibaca” menjaga hubungan gramatikal partisipel-partisipel Yunani serta metafora surat. Tidak diperlukan catatan kaki karena alternatif “dikenali” tidak menghasilkan perbedaan makna yang cukup penting untuk edisi pembaca umum.
