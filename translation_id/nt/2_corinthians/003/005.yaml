id: 2CO.3.5
reference: 2 Corinthians 3:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: id
  text: Bukan berarti bahwa dari diri kami sendiri kami sanggup[a] menganggap[b] sesuatu seolah-olah berasal dari diri kami sendiri, melainkan kesanggupan kami berasal dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memadai”; demikian pula “kemampuan” untuk “kesanggupan” pada bagian akhir ayat.
    reason: lexical_alternative
  - marker: b
    text: Atau “memperhitungkan” atau “menilai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Bukan berarti bahwa
  rationale: Ungkapan ini memperkenalkan penjelasan atau pembatasan atas pernyataan sebelumnya, bukan alasan sebab-akibat.
- source_word: ἀφ’ ἑαυτῶν
  choice: dari diri kami sendiri
  rationale: Frasa ini menyatakan bahwa kesanggupan tersebut tidak bersumber pada diri Paulus dan rekan-rekannya sendiri.
- source_word: ἱκανοί ... ἡ ἱκανότης
  choice: sanggup ... kesanggupan
  rationale: Pasangan kata ini alami dalam bahasa Indonesia dan mempertahankan hubungan leksikal antara bentuk adjektiva dan nomina dalam teks Yunani.
- source_word: λογίσασθαί
  choice: menganggap
  rationale: Kata ini menyampaikan tindakan mental berupa menilai atau memperhitungkan sesuatu, tanpa mempersempitnya menjadi keterampilan pelayanan semata.
- source_word: τι
  choice: sesuatu
  rationale: Kata tak tentu ini mempertahankan cakupan luas teks Yunani dalam konstruksi negatif.
- source_word: ὡς ἐξ αὑτῶν
  choice: seolah-olah berasal dari diri kami sendiri
  rationale: Terjemahan ini mempertahankan gagasan asal atau sumber serta nuansa ὡς, sambil tetap jelas dan alami dalam bahasa Indonesia.
- source_word: ἐκ τοῦ θεοῦ
  choice: berasal dari Allah
  rationale: Pilihan ini menegaskan Allah sebagai sumber kesanggupan tanpa menambahkan penafsiran yang tidak dinyatakan langsung.
theological_decisions:
- issue: Cakupan pernyataan Paulus tentang kemampuan manusia
  choice: Mempertahankan pernyataan luas bahwa kesanggupan itu tidak berasal dari diri sendiri.
  alternative: Membatasi maknanya secara eksplisit pada kecakapan untuk pelayanan kerasulan.
  rationale: Konteksnya memang mengenai pelayanan, tetapi susunan bahasa Yunani dalam ayat ini lebih luas; terjemahan tidak seharusnya menambahkan pembatasan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “dari diri kami sendiri” dipertahankan untuk mencerminkan penekanan sumber dalam teks Yunani, sedangkan “sanggup ... kesanggupan” menjaga kaitan leksikal ἱκανοί ... ἱκανότης.
