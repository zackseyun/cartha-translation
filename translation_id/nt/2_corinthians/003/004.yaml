  text: Πεποίθησιν δὲ τοιαύτην ἔχομεν διὰ τοῦ Χριστοῦ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: id
  text: Keyakinan seperti itu kami miliki melalui Mesias di hadapan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: keyakinan
  rationale: Dalam konteks ini, “keyakinan” menyampaikan rasa percaya yang teguh tanpa mengubahnya menjadi iman dengan objek yang dinyatakan secara eksplisit.
- source_word: δὲ τοιαύτην
  choice: seperti itu
  rationale: Frasa ini merujuk kembali pada uraian sebelumnya; dalam bahasa Indonesia, “seperti itu” mempertahankan daya kualitatif τοιαύτην, sedangkan δέ cukup tercermin melalui kesinambungan kalimat.
- source_word: ἔχομεν
  choice: kami miliki
  rationale: Padanan langsung dan wajar bagi verba “mempunyai”; “kami” dipilih karena Paulus berbicara mengenai dirinya dan rekan-rekan pelayanannya, bukan menyertakan para pembaca.
- source_word: διὰ τοῦ Χριστοῦ
  choice: melalui Mesias
  rationale: διά dengan genitif menyatakan perantaraan atau sarana. Χριστός dipertahankan sebagai gelar, yaitu “Mesias”.
- source_word: πρὸς τὸν θεόν
  choice: di hadapan Allah
  rationale: Secara harfiah πρός menunjuk arah atau orientasi “kepada”; dalam konteks keyakinan yang berhubungan dengan Allah, “di hadapan Allah” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan orientasi relasional tersebut.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός dapat dipahami sebagai gelar. “Mesias” menyatakan arti gelar itu secara transparan tanpa memasukkan kekhasan denominasi.
- issue: Hubungan keyakinan dengan Allah dalam πρὸς τὸν θεόν
  choice: di hadapan Allah
  alternative: kepada Allah
  rationale: “Di hadapan Allah” sesuai dengan konteks pertanggungjawaban dan kecukupan pelayanan, tetapi catatan mempertahankan bentuk yang lebih dekat dengan arah leksikal πρός agar ambiguitas relasionalnya tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan rujukan “seperti itu” kepada konteks sebelumnya. “Kami” membedakan kelompok Paulus dari para pembaca.
