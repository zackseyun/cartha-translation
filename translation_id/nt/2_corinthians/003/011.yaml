base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: id
  text: Sebab, jika yang sedang ditiadakan[a] datang dengan kemuliaan[b], terlebih lagi yang tetap ada[c] berada dalam kemuliaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang sedang diakhiri”, “yang sedang disisihkan”, atau “yang sedang dibuat tidak berlaku”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melalui kemuliaan”.'
    reason: lexical_alternative
  - marker: c
    text: “Yang tetap ada” dapat juga diterjemahkan “yang bertahan” atau “yang terus ada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: yang sedang ditiadakan
  rationale: Partisipel kini pasif ini menyatakan sesuatu yang sedang dibuat tidak berlaku atau diakhiri. Pilihan ini lebih langsung daripada 'yang sedang memudar', tetapi tidak menambahkan identifikasi eksplisit yang tidak terdapat dalam ayat.
- source_word: διὰ δόξης
  choice: datang dengan kemuliaan
  rationale: Secara harfiah frasa ini berarti 'melalui kemuliaan'. Dalam bahasa Indonesia, 'datang dengan kemuliaan' secara wajar menyampaikan bahwa hal yang sementara itu disertai kemuliaan.
- source_word: πολλῷ μᾶλλον
  choice: terlebih lagi
  rationale: Ungkapan perbandingan ini menegaskan bahwa kemuliaan hal yang tetap ada jauh melampaui kemuliaan hal yang ditiadakan.
- source_word: μένον
  choice: yang tetap ada
  rationale: Mempertahankan bentuk partisipel substantival netral dan kontras antara sesuatu yang ditiadakan dengan sesuatu yang terus ada.
- source_word: ἐν δόξῃ
  choice: berada dalam kemuliaan
  rationale: Terjemahan dekat ini mempertahankan preposisi ἐν dan perbedaan retoris dengan διὰ δόξης.
theological_decisions:
- issue: Hakikat hal-hal yang dikontraskan
  choice: Mempertahankan ungkapan umum 'yang sedang ditiadakan' dan 'yang tetap ada'.
  alternative: Mengidentifikasikannya secara eksplisit sebagai perjanjian lama dan perjanjian baru atau pelayanan masing-masing.
  rationale: Teks Yunani ayat ini memakai partisipel substantival netral tanpa menyebut perjanjian atau pelayanan secara eksplisit; identifikasinya disediakan oleh konteks.
- issue: Nuansa καταργούμενον
  choice: yang sedang ditiadakan
  alternative: yang sedang memudar; yang sedang diakhiri; yang sedang dibuat tidak berlaku
  rationale: Pilihan ini mempertahankan gagasan tindakan yang sedang berlangsung dan makna pasif tanpa mereduksinya menjadi sekadar pudarnya cahaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan untuk menonjolkan kontras Paulus antara yang sedang ditiadakan dan yang tetap ada.
