  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: id
  text: Namun, setiap kali seseorang berbalik kepada Tuhan, selubung itu disingkirkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “selubung itu diambil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Namun, setiap kali
  rationale: Gabungan ini memperkenalkan klausa waktu tak tentu dan mempertahankan hubungan kontras δέ; “setiap kali” menyampaikan nuansa berulang atau tidak tertentu secara alami.
- source_word: ἐπιστρέψῃ
  choice: seseorang berbalik
  rationale: Bentuk verba Yunani tidak menyebut subjek secara eksplisit. “Seseorang” diperlukan agar wajar dalam bahasa Indonesia, sedangkan “berbalik” mempertahankan metafora arah tanpa mempersempitnya menjadi istilah teknis pertobatan.
- source_word: πρὸς κύριον
  choice: kepada Tuhan
  rationale: πρός dengan akusatif menyatakan arah kepada pribadi; “kepada Tuhan” alami dalam bahasa Indonesia dan tidak menentukan lebih jauh identitas Tuhan dalam ayat ini.
- source_word: περιαιρεῖται
  choice: disingkirkan
  rationale: Bentuk pasif kini menyatakan apa yang terjadi pada selubung tanpa menyebut pelaku. “Disingkirkan” mempertahankan bentuk pasif dan makna pengambilan atau peniadaan.
- source_word: τὸ κάλυμμα
  choice: selubung itu
  rationale: Dalam konteks kiasan tentang Musa, “selubung” menyampaikan benda yang menutupi wajah sekaligus mempertahankan kaitan antarayat; kata penunjuk “itu” menandai rujukan yang sudah dikenal dalam konteks.
theological_decisions:
- issue: Subjek tak tentu dari ἐπιστρέψῃ
  choice: Menyediakan subjek umum “seseorang”
  alternative: Membaca subjeknya sebagai Israel secara khusus atau sebagai kelompok tertentu
  rationale: Bahasa Yunani tidak memiliki nomina subjek eksplisit. “Seseorang” menghasilkan bahasa Indonesia yang gramatikal sambil mempertahankan cakupan umum dan tidak memasukkan klaim yang lebih sempit.
- issue: Identitas “Tuhan” dalam konteks
  choice: Menerjemahkan hanya “Tuhan”
  alternative: “Tuhan Kristus” atau “Tuhan, yaitu Roh”
  rationale: Ayat ini sendiri hanya memakai κύριον. Terjemahan tidak menyelesaikan ketegangan kontekstual mengenai hubungan Tuhan, Kristus, dan Roh.
- issue: Pelaku yang menyingkirkan selubung
  choice: Mempertahankan bentuk pasif tanpa menyebut pelaku
  alternative: “Tuhan menyingkirkan selubung itu”
  rationale: Teks Yunani tidak menyatakan pelaku secara eksplisit; bentuk pasif menghindari penambahan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Namun” mempertahankan kontras, “setiap kali” menjaga nuansa waktu tak tentu, dan susunan kalimat tetap dekat dengan struktur serta ambiguitas sumber Yunani.
