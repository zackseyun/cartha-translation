  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: id
  text: Tuhan adalah Roh[a], dan di mana Roh Tuhan ada, di situ ada kebebasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “Tuhan adalah Roh” dapat dipahami sebagai identifikasi yang erat dalam konteks ini tanpa menentukan bagaimana hubungan tersebut harus didefinisikan secara teologis.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar bagi κύριος dalam konteks teologis Paulus; tidak dipersempit menjadi sekadar 'tuan'.
- source_word: πνεῦμα
  choice: Roh
  rationale: Huruf kapital dipakai karena kedua kemunculannya dalam konteks ini merujuk kepada Roh Kudus.
- source_word: δὲ
  choice: dan
  rationale: Partikel pertama tidak diberi padanan tersendiri agar bahasa Indonesia tetap alami; perkembangan argumennya ditopang konteks. Partikel kedua dinyatakan dengan 'dan' untuk menghubungkan kedua klausa secara lancar.
- source_word: οὗ
  choice: di mana
  rationale: Mempertahankan arti lokatif dari pernyataan umum Yunani tanpa memperluasnya menjadi 'di mana pun'.
- source_word: ἐλευθερία
  choice: kemerdekaan
  rationale: Kata ini alami dalam bahasa Indonesia, bermakna keadaan bebas, dan mempertahankan bobot teologis istilah Yunani.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Tuhan adalah Roh
  rationale: Mempertahankan klausa ekuatif secara langsung tanpa menjelaskan atau melunakkan hubungan tersebut.
- source_word: τὸ πνεῦμα κυρίου
  choice: Roh Tuhan
  rationale: Mempertahankan konstruksi genitif Yunani secara ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pernyataan identitas 'Tuhan adalah Roh' dapat dipahami secara teologis dengan beberapa cara.
  choice: Tuhan adalah Roh
  alternative: Tuhan di sini dapat dipahami sebagai Kristus dalam konteks terdekat, dan identifikasi ini dapat dipandang bersifat kontekstual atau fungsional, bukan penjelasan menyeluruh tentang relasi pribadi ilahi.
  rationale: Teks Yunani menyatakan hubungan itu secara langsung. Terjemahan mempertahankan ketegangan tersebut tanpa memasukkan definisi teologis tertentu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan 'di mana ... di situ ...' dipakai agar hubungan lokatif dan hasilnya jelas serta alami.
