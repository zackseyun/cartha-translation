  yaml_path: translation/nt/2_corinthians/003/012.yaml
  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: id
  text: Karena itu, dengan pengharapan seperti ini, kami bertindak dengan keberanian besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami bertindak dengan sangat terbuka” atau “kami berbicara dengan sangat terus terang.”
    reason: παρρησία dapat berarti keberanian, keterbukaan, atau keterusterangan; dalam konteks tertentu ungkapan ini dapat secara khusus merujuk pada berbicara dengan terus terang.
lexical_decisions:
- source_word: Ἔχοντες
  choice: dengan memiliki
  rationale: Partisip ini menyatakan keadaan atau dasar bagi tindakan utama; bentuk ini mempertahankan hubungannya dengan klausa utama secara alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan menyampaikan daya inferensialnya dengan jelas.
- source_word: τοιαύτην
  choice: seperti ini
  rationale: Menyatakan jenis pengharapan yang baru saja dijelaskan dalam konteks sebelumnya.
- source_word: ἐλπίδα
  choice: pengharapan
  rationale: Padanan baku yang sesuai dengan keyakinan berorientasi ke depan dalam konteks Paulus.
- source_word: πολλῇ
  choice: penuh
  rationale: Menguatkan kualitas παρρησία; 'penuh keberanian' merupakan ungkapan Indonesia yang wajar.
- source_word: παρρησίᾳ
  choice: keberanian
  rationale: Dalam konteks pertentangan dengan selubung, kata ini terutama menunjuk pada sikap berani, tetapi nuansa keterbukaan dan keterusterangan tetap dicatat.
- source_word: χρώμεθα
  choice: kami bertindak dengan
  rationale: Verba tengah dengan datif berarti memakai atau menjalankan sesuatu; terjemahan ini alami dan tidak membatasi maknanya hanya pada tindakan berbicara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kami” dipakai karena Paulus mengacu kepada dirinya dan rekan-rekan pelayanannya, bukan langsung mencakup para pembaca.
