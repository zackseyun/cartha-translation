revisions:
- from: Kita semua, dengan wajah yang tidak berselubung, memandang kemuliaan Tuhan seperti dalam cermin[a] dan sedang diubah menjadi gambar yang sama, dari kemuliaan kepada kemuliaan. Perubahan ini berasal dari Tuhan, yaitu Roh[b].
  to: Kita semua, dengan wajah tanpa selubung, memandang kemuliaan Tuhan seperti dalam cermin[a] dan sedang diubah menjadi gambar yang sama, dari kemuliaan kepada kemuliaan—sebagaimana dari Tuhan, yaitu Roh[b].
  rationale: Revisi mengganti ungkapan yang kurang alami untuk wajah yang tersingkap dan terutama memulihkan καθάπερ melalui “sebagaimana.” Frasa “sebagaimana dari Tuhan, yaitu Roh” sengaja dipertahankan padat, dengan tanda pisah, agar tidak memaksakan analisis sintaksis atau doktrinal atas ἀπὸ κυρίου πνεύματος. Catatan kaki tetap tertambat pada frasa yang diperselisihkan dan mempertahankan kedua alternatif yang relevan.
