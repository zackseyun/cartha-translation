  naturalness: “Wajah tanpa selubung” lebih lazim dan ringkas daripada “wajah yang tidak berselubung.” Kalimat revisi tetap dapat dibaca secara alami dalam register Alkitab standar, sementara tanda pisah membantu mempertahankan bentuk eliptis frasa penutup yang memang padat dalam bahasa sumber.
  terminology: “Kemuliaan Tuhan,” “gambar yang sama,” “diubah,” dan “Roh” merupakan padanan yang sesuai. “Tuhan, yaitu Roh” secara hati-hati mempertahankan pembacaan aposisional dalam teks utama; catatan kaki tetap menyajikan kemungkinan konstrual lain tanpa memutuskan persoalan teologis.
  issues:
  - severity: medium
    issue: Daya καθάπερ tidak terwakili dalam frasa penutup.
