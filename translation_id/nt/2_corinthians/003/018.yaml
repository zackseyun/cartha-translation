  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: id
  text: Kita semua, dengan wajah tanpa selubung, memandang kemuliaan Tuhan seperti dalam cermin[a] dan sedang diubah menjadi gambar yang sama, dari kemuliaan kepada kemuliaan—sebagaimana dari Tuhan, yaitu Roh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memantulkan kemuliaan Tuhan seperti cermin.”
    reason: alternative_reading
  - marker: b
    text: Atau, “dari Tuhan yang adalah Roh”; kemungkinan lain, “dari Roh Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: dengan wajah yang tidak berselubung
  rationale: Mengungkapkan keadaan kini sebagai hasil penyingkapan selubung, sekaligus mempertahankan bentuk kolektif tunggal πρόσωπον.
- source_word: τὴν δόξαν κυρίου
  choice: kemuliaan Tuhan
  rationale: Menerjemahkan konstruksi genitif secara lugas dan alami dalam bahasa Indonesia.
- source_word: κατοπτριζόμενοι
  choice: memandang ... seperti dalam cermin
  rationale: Makna melihat melalui atau di dalam cermin sesuai dengan alur dari memandang kemuliaan menuju perubahan; makna alternatif 'memantulkan' dipertahankan dalam catatan kaki.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: gambar yang sama
  rationale: Terjemahan langsung yang mempertahankan kaitan dengan kemuliaan Tuhan yang baru disebutkan.
- source_word: μεταμορφούμεθα
  choice: sedang diubah
  rationale: Bentuk kini pasif menunjukkan proses perubahan yang berlangsung dan diterima oleh subjek.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: dari kemuliaan kepada kemuliaan
  rationale: Mempertahankan ungkapan Yunani yang ringkas tanpa menambahkan gagasan eksplisit tentang derajat atau tingkat.
- source_word: καθάπερ ἀπὸ κυρίου πνεύματος
  choice: Perubahan ini berasal dari Tuhan, yaitu Roh
  rationale: καθάπερ dalam konteks ini memperkenalkan sumber atau cara yang selaras dengan pernyataan sebelumnya; pemecahan menjadi kalimat baru menghasilkan bahasa Indonesia yang wajar, sedangkan aposisi 'Tuhan, yaitu Roh' menjaga kepadatan dan ketaksaan hubungan κυρίου dan πνεύματος.
- source_word: κύριος
  choice: Tuhan
  rationale: Padanan baku dan bermartabat untuk κύριος dalam konteks ini.
theological_decisions:
- issue: Makna κατοπτριζόμενοι
  choice: memandang kemuliaan Tuhan seperti dalam cermin
  alternative: memantulkan kemuliaan Tuhan seperti cermin
  rationale: Alur ayat mendukung tindakan memandang yang menghasilkan perubahan, tetapi verba Yunani memang dapat dipahami sebagai 'memantulkan'; karena itu alternatifnya tidak dihapus, melainkan dicatat.
- issue: Hubungan κυρίου dan πνεύματος dalam frasa penutup
  choice: dari Tuhan, yaitu Roh
  alternative: dari Tuhan yang adalah Roh; dari Roh Tuhan
  rationale: Frasa Yunani sangat padat dan memungkinkan hubungan aposisional maupun genitif. Teks utama mempertahankan aposisi tanpa memperluasnya menjadi rumusan doktrinal yang lebih tegas, sedangkan kemungkinan lain dicantumkan dalam catatan.
- issue: Daya καθάπερ dalam frasa penutup
  choice: diungkapkan secara kontekstual melalui kalimat 'Perubahan ini berasal ...'
  alternative: sebagaimana dari Tuhan, yaitu Roh
  rationale: Padanan harfiah 'sebagaimana dari' tidak idiomatis dalam bahasa Indonesia. Rumusan kontekstual mempertahankan gagasan bahwa perubahan tersebut sesuai dengan dan bersumber dari Tuhan/Roh tanpa menambah pelaku yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia standar modern, jelas, dan bermartabat. 'Berselubung' menjaga hubungan dengan gambaran selubung dalam konteks sebelumnya. Struktur kalimat dipecah pada frasa penutup agar alami, sambil mempertahankan ambiguitas utama melalui catatan kaki.
