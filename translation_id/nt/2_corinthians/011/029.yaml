id: 2CO.11.29
reference: 2 Corinthians 11:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: id
  text: Siapakah yang lemah, dan aku tidak ikut lemah? Siapakah yang dibuat tersandung, dan aku tidak terbakar di dalam batin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “terbakar.” Ungkapan Yunani ini dapat menyatakan dukacita, semangat, kemarahan, atau gejolak batin yang hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: lemah / ikut lemah
  rationale: Kata ἀσθενέω dapat menunjuk pada kelemahan jasmani, sosial, atau rohani. 'Lemah' mempertahankan keluasan maknanya, sedangkan 'ikut lemah' mengungkapkan solidaritas empatik Paulus secara alami dalam bahasa Indonesia.
- source_word: σκανδαλίζεται
  choice: dibuat tersandung
  rationale: Bentuk pasif ini mempertahankan gambaran seseorang yang dijerat atau dibawa ke dalam bahaya moral dan rohani, tanpa mempersempit hasilnya menjadi sekadar rasa tersinggung atau satu tindakan dosa tertentu.
- source_word: πυροῦμαι
  choice: terbakar di dalam batin
  rationale: Kata ini secara harfiah berarti terbakar atau dinyalakan dan di sini dipakai sebagai metafora untuk gejolak batin yang kuat. Ungkapan ini mempertahankan metaforanya tanpa menentukan secara berlebihan apakah yang terutama dimaksud ialah dukacita, semangat, atau kemarahan.
- source_word: τίς
  choice: Siapakah
  rationale: Kata tanya ini memperkenalkan pertanyaan retoris tentang orang; 'siapakah' sesuai dengan ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: καὶ οὐκ ἐγὼ
  choice: dan aku tidak
  rationale: Susunan ini mempertahankan penekanan pada keterlibatan pribadi Paulus dalam kedua pertanyaan retoris tersebut.
theological_decisions:
- issue: Sifat tanggapan Paulus dalam πυροῦμαι
  choice: Mempertahankan metafora sebagai 'terbakar di dalam batin' tanpa menetapkan satu emosi tertentu dalam teks utama.
  alternative: terbakar oleh kemarahan; berkobar karena dukacita; sangat gelisah
  rationale: Bahasa Yunani menyatakan keterlibatan batin Paulus yang sangat kuat, tetapi tidak dengan sendirinya menentukan apakah emosi dominannya ialah kemarahan, dukacita, atau semangat. Terjemahan ini mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada retoris dan pastoral. Pengulangan struktur pertanyaan dipertahankan. 'Ikut lemah' dipakai agar solidaritas Paulus terdengar alami, dan 'di dalam batin' menandai penggunaan metaforis tanpa menghapus citra api.
