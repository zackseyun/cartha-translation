review_pass:
  verdict: approve
  source_fidelity: Teks Indonesia dengan setia mempertahankan dua pertanyaan retoris, cakupan luas ἀσθενεῖ/ἀσθενῶ melalui “lemah,” nuansa pasif-metaforis σκανδαλίζεται melalui “dibuat tersandung,” dan citra metaforis πυροῦμαι melalui “terbakar di dalam batin.” Tambahan “ikut” secara wajar menyampaikan solidaritas yang tersirat dalam konteks dan struktur retoris, tanpa mengubah makna dasar. Berbeda dari audit bahasa Inggris yang membatasi emosi menjadi “indignation,” teks ini dengan tepat tidak mengkhususkan emosi yang tidak ditentukan oleh bahasa Yunani.
  naturalness: “Siapakah yang lemah, dan aku tidak ikut lemah?” adalah bahasa Indonesia baku yang alami dan retoris. “Dibuat tersandung” cukup wajar serta mempertahankan bentuk pasif; “terbakar di dalam batin” jelas sebagai ungkapan metaforis dalam register pastoral-baku.
  terminology: Istilah “lemah,” “tersandung,” dan “terbakar” konsisten dengan citra serta keluasan istilah Yunani. Catatan kaki secara tepat menjelaskan bahwa “terbakar” bersifat metaforis dan mencantumkan beberapa kemungkinan nuansa tanpa memaksakan satu pembacaan teologis atau psikologis.
