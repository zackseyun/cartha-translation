id: 2CO.11.21
reference: 2 Corinthians 11:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: id
  text: 'Dengan rasa malu saya mengatakannya: seolah-olah kami ini lemah.[a] Namun, dalam hal apa pun orang lain berani membanggakan diri—saya berbicara seperti orang bodoh—saya pun berani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Yunaninya dapat juga diterjemahkan, “Saya mengatakannya sebagai sesuatu yang memalukan: seolah-olah kami lemah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: Dengan rasa malu
  rationale: Ungkapan Yunani ini sulit dan idiomatis. Pilihan ini mempertahankan unsur kehinaan atau rasa malu dalam pengakuan ironis Paulus, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: λέγω
  choice: saya mengatakannya
  rationale: Bentuk ini alami untuk sisipan retoris Paulus dan merujuk pada pernyataan yang langsung menyusul.
- source_word: ὡς ὅτι
  choice: seolah-olah
  rationale: Gabungan ini menyatakan penampilan atau konsesi ironis, bukan penegasan lugas bahwa Paulus dan rekan-rekannya benar-benar lemah.
- source_word: ἠσθενήκαμεν
  choice: kami ini lemah
  rationale: Kata ini menunjuk pada kelemahan atau kurangnya keberanian dan kedudukan dalam perbandingan retoris dengan para lawan, bukan terutama penyakit fisik. Partikel 'ini' membantu menyampaikan nada ironis tanpa menambah tafsiran doktrinal.
- source_word: ἐν ᾧ
  choice: dalam hal apa pun
  rationale: Menyatakan ranah atau perkara yang di dalamnya seseorang menunjukkan keberanian.
- source_word: τολμᾷ
  choice: berani membanggakan diri
  rationale: Secara harfiah berarti 'berani', tetapi objek membanggakan diri tersirat jelas dari konteks pembicaraan mengenai kebanggaan dalam ayat-ayat sekitar; penjelasan ini menghasilkan bahasa Indonesia yang lebih terang.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: saya berbicara seperti orang bodoh
  rationale: Mempertahankan penyangkalan retoris Paulus dengan ungkapan Indonesia yang alami, tanpa menyatakan bahwa ia sungguh-sungguh bodoh.
- source_word: τολμῶ κἀγώ
  choice: saya pun berani
  rationale: Menjaga pengulangan kata kerja 'berani' dari klausa sebelumnya dan membiarkan objek membanggakan diri tetap tersirat sebagaimana dalam bahasa Yunani.
theological_decisions:
- issue: Ironi retoris mengenai 'kelemahan' Paulus
  choice: 'Menerjemahkannya sebagai konsesi ironis: ''seolah-olah kami ini lemah'''
  alternative: 'Menerjemahkannya secara datar sebagai pengakuan langsung: ''seolah-olah kami lemah'' atau ''bahwa kami lemah'''
  rationale: Konteks 'perkataan orang bodoh' Paulus membandingkan dirinya dengan para lawan yang suka membanggakan diri. Terjemahan ini mempertahankan ironi dan tidak mengubahnya menjadi pengakuan bahwa kerasulannya sungguh tidak berdaya atau tidak sah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur retoris serta pengulangan 'berani' dipertahankan; 'membanggakan diri' ditambahkan hanya pada kemunculan pertama karena tersirat kuat oleh konteks.
