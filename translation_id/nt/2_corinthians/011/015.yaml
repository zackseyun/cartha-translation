id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: id
  text: Jadi, tidak mengherankan jika para pelayannya juga menyamar sebagai pelayan kebenaran[a]. Kesudahan mereka akan sesuai dengan perbuatan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan keadilan.” Kata Yunani yang dipakai dapat berarti “kebenaran” atau “keadilan”; di sini maksudnya ialah penampilan seolah-olah mereka berpihak pada apa yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: tidak mengherankan
  rationale: Ungkapan ini menyatakan bahwa hal tersebut bukan sesuatu yang luar biasa atau mengejutkan. Pilihan ini alami dalam bahasa Indonesia modern.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan dari ayat sebelumnya dengan penghubung yang ringkas dan alami.
- source_word: διάκονοι
  choice: pelayan
  rationale: Dalam konteks ini menunjuk kepada orang-orang yang mengabdi kepada Iblis; 'pelayan' menghindari kesan jabatan gerejawi yang dapat timbul dari 'diaken' atau 'pelayan rohani'.
- source_word: μετασχηματίζονται
  choice: menyamar
  rationale: Menunjuk pada perubahan penampilan atau cara menampilkan diri demi menipu, bukan perubahan batin atau hakikat.
- source_word: ὡς
  choice: sebagai
  rationale: Memperkenalkan peran atau identitas semu yang mereka tampilkan.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam konteks ini menunjuk pada kesan bahwa mereka berada di pihak yang benar atau hidup secara benar. 'Keadilan' tetap dicatat sebagai kemungkinan leksikal.
- source_word: τὸ τέλος
  choice: kesudahan mereka
  rationale: Mengungkapkan hasil atau nasib akhir mereka dalam konteks penghakiman.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: sesuai dengan perbuatan mereka
  rationale: Mempertahankan gagasan kesepadanan antara kesudahan dan tindakan mereka; 'perbuatan' lebih alami daripada 'pekerjaan' dalam rumusan penghakiman ini.
theological_decisions:
- issue: Makna δικαιοσύνη dalam frasa Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Di sini para pelayan palsu menampilkan diri seolah-olah mengabdi kepada apa yang benar. 'Kebenaran' paling alami untuk nuansa moral tersebut, sementara kemungkinan makna 'keadilan' dipertahankan dalam catatan kaki.
- issue: Rumusan penghakiman κατὰ τὰ ἔργα αὐτῶν
  choice: sesuai dengan perbuatan mereka
  alternative: menurut perbuatan mereka
  rationale: Pilihan ini mempertahankan hubungan antara penghakiman dan perbuatan tanpa menjelaskan lebih jauh mekanisme teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur dibagi menjadi dua kalimat agar alurnya jelas bagi pembaca umum, tanpa menghilangkan hubungan logis dan nada penghakiman teks Yunani.
