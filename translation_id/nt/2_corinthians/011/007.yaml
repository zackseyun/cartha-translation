base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: id
  text: Atau apakah saya berbuat dosa dengan merendahkan diri supaya kalian ditinggikan, karena saya memberitakan Injil Allah kepada kalian tanpa dibayar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara cuma-cuma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Atau
  rationale: Membuka alternatif retoris yang terkait erat dengan argumen sebelumnya dan mempertahankan gaya tajam Paulus.
- source_word: ἁμαρτίαν ἐποίησα
  choice: apakah saya berbuat dosa
  rationale: Ungkapan Yunani harfiahnya berarti 'melakukan/membuat dosa'; 'berbuat dosa' alami dalam bahasa Indonesia dan tetap mempertahankan kategori moralnya.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: dengan merendahkan diri
  rationale: Menyatakan tindakan yang menyertai pertanyaan utama serta mempertahankan unsur refleksif.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: supaya kalian ditinggikan
  rationale: Mempertahankan klausa tujuan, bentuk pasif, dan kontras status antara Paulus yang merendahkan diri dan jemaat yang ditinggikan.
- source_word: ὅτι
  choice: karena
  rationale: Menunjukkan dasar atau isi tindakan yang secara retoris dipertanyakan sebagai dosa.
- source_word: δωρεὰν
  choice: tanpa meminta bayaran
  rationale: Menyampaikan bahwa Paulus memberitakan Injil tanpa menuntut pembayaran; bentuk ini jelas dan wajar dalam konteks dukungan finansial.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: Injil Allah
  rationale: Mempertahankan konstruksi genitif dan ungkapan Paulus yang lazim, tanpa menentukan secara berlebihan apakah genitif itu sumber atau kepunyaan.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: saya memberitakan ... kepada kalian
  rationale: Mengungkapkan tindakan mengumumkan kabar baik secara alami dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat pertanyaan retoris Paulus mengenai dukungan finansial dan perendahan dirinya
  choice: Pertanyaan diterjemahkan secara langsung dengan mempertahankan ironi bahwa tindakannya seolah-olah dapat disebut dosa.
  alternative: Memparafrasakan ayat sehingga secara eksplisit menyatakan bahwa Paulus melepaskan hak kerasulannya, atau melunakkan ironi menjadi sekadar permintaan maaf.
  rationale: Teks Yunani sendiri mempertanyakan apakah perendahan diri dan pemberitaan tanpa bayaran merupakan dosa; terjemahan tidak menambahkan kesimpulan doktrinal tentang upah pelayanan.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada retoris dan bermartabat. Pronomina 'saya/kalian' dipilih agar jelas dan alami bagi pembaca umum; 'ditinggikan' mempertahankan kontras verbal dengan 'merendahkan diri'. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
