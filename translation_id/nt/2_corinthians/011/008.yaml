  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur-unsur utama Yunani: ἄλλας ἐκκλησίας sebagai “jemaat-jemaat lain,” verba kuat dan ironis ἐσύλησα sebagai “merampok,” partisip instrumental λαβών sebagai “dengan menerima,” serta tujuan pelayanan dalam πρὸς τὴν ὑμῶν διακονίαν sebagai “untuk melayani kalian.” Tidak ada pelunakan yang menghapus daya retoris Paulus atau tambahan makna yang tidak dituntut teks.'
