  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: id
  text: Aku merampok jemaat-jemaat lain dengan menerima tunjangan[a] untuk melayani kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “upah” atau “bayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: jemaat-jemaat lain
  rationale: Dalam pemakaian Paulus, ἐκκλησία di sini menunjuk pada komunitas-komunitas Kristen setempat. 'Jemaat-jemaat' alami dalam bahasa Indonesia dan mempertahankan bentuk jamak.
- source_word: ἐσύλησα
  choice: merampok
  rationale: Kata συλάω adalah kata kuat yang berarti merampas atau merampok. 'Merampok' mempertahankan ironi dan ketajaman retoris Paulus tanpa melunakkannya.
- source_word: λαβὼν
  choice: dengan menerima
  rationale: Partisip aoris ini menerangkan cara Paulus secara kiasan 'merampok' jemaat lain. 'Dengan menerima' menyatakan hubungan instrumental itu secara wajar.
- source_word: ὀψώνιον
  choice: tunjangan
  rationale: ὀψώνιον dapat berarti upah, bayaran, atau perbekalan. Dalam konteks pelayanan, 'tunjangan' menyampaikan bantuan materi bagi kebutuhan Paulus tanpa terlalu menyiratkan hubungan kerja komersial; arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: untuk melayani kalian
  rationale: Frasa ini menyatakan tujuan bantuan yang diterima Paulus, yaitu agar ia dapat melayani orang-orang Korintus. Terjemahan ini alami dan memperjelas pelaku pelayanan sesuai konteks.
theological_decisions:
- issue: Daya retoris pernyataan Paulus mengenai bantuan dari jemaat-jemaat lain
  choice: Mempertahankan metafora tajam 'Aku merampok jemaat-jemaat lain' sebagai ironi atau hiperbola.
  alternative: Melunakkannya menjadi 'Aku membebani jemaat-jemaat lain' atau 'Aku menerima bantuan dari jemaat-jemaat lain.'
  rationale: Kata Yunani yang dipakai sengaja kuat. Konteks menunjukkan bahwa ini bukan pengakuan pencurian secara harfiah, melainkan ironi Paulus ketika membela cara ia menjalankan pelayanan kerasulannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti 'Aku' dan 'kalian' sesuai dengan tuturan pribadi Paulus kepada jemaat majemuk; 'merampok' sengaja dipertahankan untuk menjaga ketajaman retoris teks sumber.
