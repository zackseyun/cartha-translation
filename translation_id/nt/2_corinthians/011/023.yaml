revisions:
- from: 'Apakah mereka pelayan Mesias[a]? Aku berbicara seperti orang yang tidak waras: aku lebih lagi—jauh lebih banyak berjerih lelah, jauh lebih sering dipenjarakan, dipukuli tak terhitung banyaknya, dan sering kali menghadapi maut.[b]'
  to: 'Apakah mereka pelayan Mesias[a]? Aku berbicara seperti orang yang tidak waras: aku lebih daripada mereka—lebih banyak berjerih lelah, lebih sering dipenjarakan, dipukuli melampaui batas, dan sering kali menghadapi maut.[b]'
  rationale: Revisi menghilangkan penguatan komparatif yang tidak ditandai dalam teks sumber, menerjemahkan ὑπερβαλλόντως dengan “melampaui batas” yang lebih dekat pada maknanya, dan memperjelas elipsis “aku lebih” secara alami tanpa menambahkan klaim teologis. Catatan kaki dipertahankan karena dengan tepat menandai alternatif untuk Χριστός dan kejamakan θανάτοις.
