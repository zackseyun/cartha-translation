  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: id
  text: 'Apakah mereka pelayan Mesias[a]? Aku berbicara seperti orang yang tidak waras: aku lebih daripada mereka—lebih banyak berjerih lelah, lebih sering dipenjarakan, dipukuli melampaui batas, dan sering kali menghadapi maut.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Kristus”: “Apakah mereka pelayan Kristus?”'
    reason: Alternatif tradisional untuk menerjemahkan gelar Χριστός.
  - marker: b
    text: Secara harfiah, “sering kali dalam kematian-kematian”; maksudnya mungkin berulang kali berada di ambang kematian atau menghadapi bahaya yang mematikan.
    reason: Teks Yunani memakai bentuk jamak yang mencolok dan dapat dipahami secara idiomatis.
lexical_decisions:
- source_word: διάκονοι
  choice: pelayan
  rationale: Kata ini menunjuk kepada orang yang melayani. “Pelayan” jelas bagi pembaca modern dan tidak terlalu dibebani makna jabatan gerejawi.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar; “Mesias” menyampaikan arti gelar itu secara langsung.
- source_word: παραφρονῶν λαλῶ
  choice: Aku berbicara seperti orang yang tidak waras
  rationale: Ungkapan ini mempertahankan pengakuan Paulus bahwa perkataannya terdengar seperti ucapan orang yang kehilangan kewarasan, tanpa menjadikannya diagnosis harfiah.
- source_word: ὑπὲρ ἐγώ
  choice: aku lebih lagi
  rationale: Ungkapan Yunani ini sangat ringkas dan eliptis. Terjemahan ini mempertahankan klaim perbandingan Paulus bahwa ia lebih layak disebut pelayan Mesias.
- source_word: ἐν κόποις περισσοτέρως
  choice: jauh lebih banyak berjerih lelah
  rationale: “Berjerih lelah” menyampaikan kerja keras yang menguras tenaga, sedangkan “jauh lebih banyak” membawa daya komparatif περισσοτέρως.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: jauh lebih sering dipenjarakan
  rationale: Bentuk jamak menunjuk kepada pengalaman pemenjaraan yang berulang; “lebih sering” merupakan ungkapan Indonesia yang alami untuk perbandingan frekuensi.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: dipukuli tak terhitung banyaknya
  rationale: πληγαῖς merujuk pada pukulan atau tindakan pemukulan, dan ὑπερβαλλόντως menekankan jumlah atau tingkat yang luar biasa, melampaui ukuran biasa.
- source_word: ἐν θανάτοις πολλάκις
  choice: sering kali menghadapi maut
  rationale: Secara harfiah frasa ini berbunyi “sering kali dalam kematian-kematian,” kemungkinan menunjuk kepada pengalaman berulang kali berada di ambang kematian atau dalam bahaya mematikan. Terjemahan utama dibuat alami, sementara bentuk Yunani yang mencolok dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Dalam konteks ini istilah tersebut berfungsi sebagai gelar. “Mesias” menerjemahkan arti gelar itu, sedangkan bentuk tradisional “Kristus” tetap dicatat sebagai alternatif.
- issue: Makna ὑπὲρ ἐγώ
  choice: aku lebih lagi
  alternative: aku bahkan lebih layak disebut demikian
  rationale: Terjemahan utama mempertahankan keringkasan dan elipsis teks Yunani, tanpa memperluas secara teologis dasar klaim kerasulan Paulus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian penderitaan dipertahankan dalam satu kalimat untuk menjaga dorongan retoris teks; ungkapan yang terlalu harfiah tetapi tidak alami dijelaskan melalui catatan kaki.
