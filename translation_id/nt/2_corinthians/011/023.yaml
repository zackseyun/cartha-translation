  naturalness: Bahasa draf umumnya baku dan jelas. “Aku lebih lagi” dapat dipahami, tetapi “Aku lebih daripada mereka” lebih idiomatis dalam bahasa Indonesia dan menjelaskan elipsis perbandingan yang sudah ditentukan oleh pertanyaan sebelumnya. Rangkaian sesudah tanda pisah dibuat lebih sejajar.
  terminology: “Pelayan Mesias” tepat untuk διάκονοι Χριστοῦ dan konsisten dengan kebijakan menerjemahkan gelar. Catatan alternatif “Kristus” sesuai. “Maut” merupakan padanan yang baik untuk θανάτοις dalam terjemahan idiomatis, dengan kejamakan yang ditandai dalam catatan kaki.
