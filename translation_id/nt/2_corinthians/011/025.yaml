  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: id
  text: Tiga kali aku dipukuli dengan tongkat, satu kali aku dilempari batu, tiga kali aku mengalami kapal karam; selama semalam dan sehari aku berada di laut dalam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di laut lepas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: tiga kali
  rationale: Padanan adverbial yang langsung dan alami; digunakan secara konsisten pada kedua kemunculannya.
- source_word: ἐραβδίσθην
  choice: aku dipukuli dengan tongkat
  rationale: Bentuk pasif ῥαβδίζω secara khusus menyatakan pemukulan dengan tongkat; alat pemukul dipertahankan secara eksplisit.
- source_word: ἅπαξ
  choice: satu kali
  rationale: Padanan alami untuk satu kejadian dan sejajar dengan ungkapan 'tiga kali'.
- source_word: ἐλιθάσθην
  choice: aku dilempari batu
  rationale: Menyampaikan tindakan kekerasan λιθάζω secara tepat dan wajar dalam bahasa Indonesia tanpa menentukan lebih jauh hasil tindakan itu.
- source_word: ἐναυάγησα
  choice: aku mengalami kapal karam
  rationale: Padanan idiomatis yang mempertahankan fokus pada pengalaman karamnya kapal tanpa menambahkan rincian yang tidak disebutkan.
- source_word: νυχθήμερον
  choice: semalam dan sehari
  rationale: Mempertahankan urutan malam-lalu-siang dari istilah Yunani dan menghindari modernisasi yang terlalu presisi seperti 'dua puluh empat jam'.
- source_word: ἐν τῷ βυθῷ
  choice: di tengah laut
  rationale: Dalam konteks ini βυθός menunjuk pada laut yang dalam atau terbuka; 'di tengah laut' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Paulus berada di bawah permukaan air.
- source_word: πεποίηκα
  choice: aku berada
  rationale: Dengan ungkapan waktu dan lokasi, bentuk perfektum ini menyatakan bahwa Paulus telah melewatkan masa tersebut di laut; 'berada' menghasilkan kalimat Indonesia yang alami, sementara durasinya sudah dinyatakan oleh 'semalam dan sehari'.
