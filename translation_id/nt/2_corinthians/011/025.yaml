  rationale: Revisi terbatas pada frasa ἐν τῷ βυθῷ dan penandaan durasi. 'Laut dalam' mempertahankan makna dasar βυθός, sedangkan catatan kaki mempertahankan kemungkinan pemahaman kontekstual 'laut lepas' tanpa menjadikannya pembacaan utama. Tidak ada perubahan makna pada klausa-klausa lainnya.
