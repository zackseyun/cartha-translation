  naturalness: “Kamu tahan saja” merupakan ungkapan Indonesia modern yang lebih langsung bagi ἀνέχεσθε dalam konteks teguran ironis ini. “Memukulmu di wajah” lebih idiomatis dan jelas daripada “memukul wajahmu.” Penghapusan “atau” mempertahankan deret lima kondisi paralel dalam bahasa Yunani.
  terminology: “Memperbudakmu,” “melahapmu,” dan “meninggikan diri” mempertahankan kekuatan metaforis dan refleksif teks sumber. “Mengambil darimu” menjaga keluasan λαμβάνει tanpa menentukan barang atau bentuk eksploitasi tertentu.
