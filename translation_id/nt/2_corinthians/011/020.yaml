  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: id
  text: Sebab kamu tahan saja jika seseorang memperbudakmu, jika seseorang melahapmu, jika seseorang mengambil darimu[a], jika seseorang meninggikan diri, jika seseorang memukulmu di wajah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambil”; dalam konteks ini kemungkinan besar tindakan itu bersifat eksploitatif atau berarti memanfaatkan kamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: kamu membiarkannya saja
  rationale: Mengungkapkan bahwa jemaat benar-benar menoleransi perlakuan buruk tersebut dan mempertahankan nada teguran ironis; kata ganti objek ditambahkan secara wajar dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan hubungan penjelasan dengan pernyataan ironis Paulus sebelumnya.
- source_word: καταδουλοῖ
  choice: memperbudakmu
  rationale: Mempertahankan daya kata yang secara langsung menunjuk pada tindakan menjadikan orang budak atau menundukkannya sebagai budak, tanpa memperhalusnya.
- source_word: κατεσθίει
  choice: melahapmu
  rationale: Mempertahankan gambaran metaforis yang tajam tentang eksploitasi seperti pemangsa yang menghabiskan mangsanya.
- source_word: λαμβάνει
  choice: mengambil sesuatu darimu
  rationale: Kata Yunani ini luas dan tidak menyebut objeknya. Ungkapan ini tetap cukup terbuka sambil terdengar alami dalam bahasa Indonesia; konteks mengisyaratkan pengambilan yang eksploitatif.
- source_word: ἐπαίρεται
  choice: meninggikan diri
  rationale: Mempertahankan nuansa refleksif tentang orang yang mengangkat atau membesarkan dirinya sendiri, bukan sekadar menyebutnya sombong.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: memukul wajahmu
  rationale: Menyampaikan tindakan konkret dan penghinaan yang terkandung dalam ungkapan Yunani tanpa mempersempitnya menjadi tamparan saja.
- source_word: εἴ τις
  choice: jika ada orang yang
  rationale: Pengulangan struktur bersyarat dipertahankan demi kekuatan retoris, dengan bentuk yang alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Nada retoris pernyataan Paulus
  choice: Diterjemahkan sebagai teguran ironis mengenai kesediaan jemaat menoleransi para pelaku yang menindas, tanpa menyebut mereka secara eksplisit sebagai rasul palsu dalam teks ayat.
  alternative: Menambahkan sebutan seperti “rasul palsu” atau “pengajar palsu” bagi para pelaku.
  rationale: Konteks mendukung pembacaan ironis dan mengidentifikasi lawan-lawan Paulus, tetapi ayat Yunani ini sendiri hanya menyusun daftar tindakan mereka. Terjemahan tidak memasukkan identifikasi yang tidak dinyatakan dalam ayat.
- issue: Cakupan tindakan λαμβάνει
  choice: Mempertahankan arti umum “mengambil sesuatu darimu” dengan catatan bahwa konteks menunjukkan eksploitasi.
  alternative: Menerjemahkannya secara langsung sebagai “memanfaatkanmu” atau secara khusus sebagai mengambil uang atau harta.
  rationale: Objek tindakan tidak disebutkan dalam bahasa Yunani. Terjemahan utama menjaga ketaktertentuan itu dan tidak membatasi penyalahgunaan pada satu bentuk tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “jika ada orang yang” dipertahankan untuk menampilkan tekanan retoris daftar Paulus, sedangkan bentuk pronomina terikat (-mu) menjaga kelancaran dan kealamian kalimat.
