  source_fidelity: Draf menyampaikan lokasi, tujuan penangkapan, dan frasa khas "kota orang-orang Damaskus" dengan baik. Namun, ἐφρούρει berarti menjaga/mengawal, bukan sekadar mengawasi, khususnya karena tindakan itu bertujuan menangkap Paulus. Selain itu, "di bawah Raja Aretas" merupakan penjelasan relasional yang mungkin, tetapi genitif Yunani lebih langsung menyebut etnark itu sebagai pejabat milik/yang melayani Raja Aretas.
