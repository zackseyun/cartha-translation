  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: id
  text: Di Damaskus, penguasa wilayah Raja Aretas menjaga kota orang-orang Damaskus[a] untuk menangkap saya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kota Damaskus.” Secara lebih harfiah, teks Yunani berbunyi “kota orang-orang Damaskus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Di Damaskus
  rationale: Kata depan ἐν dengan datif menyatakan lokasi; bentuk ini alami dalam bahasa Indonesia.
- source_word: ἐθνάρχης
  choice: penguasa wilayah
  rationale: Istilah ini menunjuk pejabat yang memerintah suatu kelompok masyarakat atau wilayah. Padanan deskriptif ini lebih mudah dipahami daripada transliterasi gelar historis “etnark”, tanpa menyamakannya secara khusus dengan gubernur.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: di bawah Raja Aretas
  rationale: Genitif tersebut menunjukkan bahwa penguasa itu berada dalam lingkup kekuasaan atau pelayanan Raja Aretas; susunan ini alami dan menghindari kesan bahwa pejabat itu milik pribadi raja.
- source_word: ἐφρούρει
  choice: mengawasi
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung pada masa lampau; dalam konteks kota yang diawasi demi penangkapan, “mengawasi” menyampaikan penjagaan berkelanjutan secara alami.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: kota orang Damaskus
  rationale: Mempertahankan bentuk genitif jamak substantival Δαμασκηνῶν, secara harfiah kota milik atau yang dihuni orang-orang Damaskus, sekaligus tetap dapat dipahami dalam bahasa Indonesia.
- source_word: πιάσαι με
  choice: untuk menangkap saya
  rationale: Infinitif aoris menyatakan tujuan. “Menangkap” cukup luas untuk tindakan membekuk tanpa secara khusus memasukkan prosedur hukum yang tersirat dalam “menahan” atau “menangkap secara resmi”.
