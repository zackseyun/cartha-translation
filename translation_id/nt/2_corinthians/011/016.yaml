  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: id
  text: 'Sekali lagi saya berkata: Jangan ada seorang pun yang menganggap saya bodoh. Namun, jika tidak, terimalah saya sekalipun sebagai orang bodoh, supaya saya juga dapat sedikit bermegah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἄφρων dapat diterjemahkan sebagai kata sifat, “bodoh,” atau sebagai kata benda, “orang bodoh.” Karena itu, bagian ini juga dapat diterjemahkan, “Jangan ada seorang pun yang menganggap saya orang bodoh ... terimalah saya sekalipun sebagai orang bodoh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Sekali lagi saya berkata
  rationale: Menyatakan pengulangan seruan Paulus dengan bahasa Indonesia yang alami dan tetap dekat dengan susunan Yunani.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: Jangan ada seorang pun yang menganggap saya bodoh
  rationale: μή dengan subjungtif menyampaikan larangan atau permohonan negatif; konstruksi ini alami dalam bahasa Indonesia dan mempertahankan penilaian tentang Paulus sebagai bodoh.
- source_word: εἰ δὲ μή γε
  choice: Namun, jika tidak
  rationale: Mempertahankan bentuk pengandaian ringkas yang mengacu pada kemungkinan bahwa permintaan sebelumnya tidak dipenuhi, tanpa memperjelas rujukannya secara berlebihan.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: terimalah saya sekalipun sebagai orang bodoh
  rationale: Imperatif δέξασθέ diterjemahkan langsung sebagai 'terimalah'; 'sekalipun' membawa nuansa konsesif κἂν, sedangkan 'sebagai orang bodoh' alami dalam bahasa Indonesia.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: supaya saya juga dapat sedikit bermegah
  rationale: ἵνα menyatakan tujuan; κἀγώ dipertahankan sebagai 'saya juga', dan καυχάομαι tetap diterjemahkan dengan bahasa bermegah agar ironi Paulus tidak dilunakkan.
theological_decisions:
- issue: Penggambaran diri Paulus secara ironis dengan ἄφρων dan tindakannya bermegah
  choice: Mempertahankan kata 'bodoh' dan 'bermegah'
  alternative: Memparafrasakan sebagai 'berbicara tanpa pertimbangan' atau melunakkan 'bermegah' menjadi 'menceritakan kelebihan saya'
  rationale: Konteks sengaja mempertahankan ketegangan antara penolakan Paulus untuk dianggap bodoh dan kesediaannya diterima dalam peran itu demi bermegah sedikit; terjemahan tidak boleh menghapus ironi tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Saya' dipakai sesuai wacana surat; 'bermegah' mempertahankan istilah retoris-teologis dalam konteks tanpa melunakkannya.
