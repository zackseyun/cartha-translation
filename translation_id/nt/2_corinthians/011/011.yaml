  text: Why? Because I do not love you? God knows I do.
translation:
  language: id
  text: Mengapa? Karena aku tidak mengasihi kalian? Allah tahu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maksud yang tersirat: Allah tahu bahwa aku mengasihi kalian.'
    reason: Menjelaskan jawaban positif yang dipahami dari pertanyaan retoris, sementara teks utama tetap mengikuti bentuk ringkas bahasa Yunani.
lexical_decisions:
- source_word: διὰ τί
  choice: Mengapa?
  rationale: Ungkapan tanya yang ringkas dan alami, dengan daya retoris yang sama.
- source_word: ὅτι
  choice: Karena
  rationale: Dalam alur ini ὅτι memperkenalkan alasan yang diajukan sebagai pertanyaan retoris.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: aku tidak mengasihi kalian
  rationale: Menjaga negasi, verba kasih, dan objek jamak secara langsung; 'kalian' menandai bentuk jamak dengan jelas dalam bahasa Indonesia modern.
- source_word: ὁ θεὸς
  choice: Allah
  rationale: Padanan baku dan wajar untuk θεός dalam konteks Perjanjian Baru.
- source_word: οἶδεν
  choice: tahu
  rationale: Menerjemahkan klausa Yunani secara langsung tanpa menambahkan jawaban positif yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Apakah jawaban positif yang tersirat harus dinyatakan sesudah 'Allah tahu'
  choice: Allah tahu.
  alternative: Allah tahu bahwa aku mengasihi kalian.
  rationale: Teks Yunani hanya menyatakan ὁ θεὸς οἶδεν. Membiarkan objek pengetahuan tidak disebutkan mempertahankan elipsis, ambiguitas formal, dan daya retoris teks sumber; catatan kaki menjelaskan implikasinya tanpa memasukkannya ke teks utama.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina 'aku' sesuai dengan suara pribadi Paulus, sedangkan 'kalian' menyatakan objek jamak secara jelas dan alami.
