revisions:
- from: Sebab aku cemburu terhadap kamu dengan kecemburuan Allah[a], karena aku telah mempertunangkan kamu dengan satu suami, untuk mempersembahkan kamu sebagai perawan yang suci kepada Mesias[b].
  to: Sebab aku cemburu demi kamu dengan kecemburuan Allah[a], karena aku telah mempertunangkan kamu dengan satu suami, untuk mempersembahkan kamu sebagai perawan yang murni kepada Mesias[b].
  rationale: Revisi memperjelas bahwa kecemburuan Paulus ditujukan demi kesetiaan jemaat, bukan kecemburuan iri kepada mereka; menerjemahkan ἁγνήν dengan “murni”; dan menyesuaikan catatan kaki agar alternatifnya dekat dengan ambiguitas genitif Yunani. Makna, metafora pertunangan, dan pilihan “Mesias” tetap dipertahankan.
