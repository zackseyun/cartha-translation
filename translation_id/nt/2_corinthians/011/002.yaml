  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: id
  text: Sebab aku cemburu demi kamu dengan kecemburuan Allah[a], karena aku telah mempertunangkan kamu dengan satu suami, untuk mempersembahkan kamu sebagai perawan yang murni kepada Mesias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kecemburuan ilahi.” Frasa Yunani ini dapat berarti kecemburuan yang berasal dari Allah atau yang menjadi ciri Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kepada Kristus.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ζηλῶ
  choice: aku cemburu terhadap
  rationale: Kata kerja ini dapat menyatakan semangat yang kuat atau kecemburuan yang melindungi. Dalam kiasan pertunangan, “cemburu terhadap” mempertahankan nuansa kepedulian yang menuntut kesetiaan, bukan iri hati.
- source_word: θεοῦ ζήλῳ
  choice: dengan kecemburuan Allah
  rationale: Genitif θεοῦ dipertahankan secara langsung sehingga frasa ini dapat menunjuk pada kecemburuan yang berasal dari atau menjadi ciri Allah; kemungkinan arti “kecemburuan yang sesuai dengan kehendak Allah” dicatat dalam catatan kaki.
- source_word: ἡρμοσάμην
  choice: aku telah mempertunangkan
  rationale: Dalam konteks perkawinan, kata ini menunjuk pada tindakan mengikat atau menjanjikan seseorang dalam pertunangan. Pilihan ini mempertahankan kiasan perkawinan dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: ἑνὶ ἀνδρὶ
  choice: dengan satu suami
  rationale: ἀνήρ dapat berarti “laki-laki” atau “suami”; gambaran pengantin dan pertunangan membuat “suami” menjadi arti kontekstual yang paling jelas.
- source_word: παρθένον ἁγνήν
  choice: perawan yang suci
  rationale: “Perawan” mempertahankan gambaran pengantin, sedangkan “suci” menyampaikan kemurnian moral yang dinyatakan oleh ἁγνήν dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: παραστῆσαι
  choice: untuk mempersembahkan
  rationale: Infinitif ini menyatakan tujuan pertunangan itu, yakni membawa jemaat ke hadapan Mesias. “Mempersembahkan” mempertahankan nada resmi dan seremonial tanpa mempersempit maknanya.
- source_word: τῷ Χριστῷ
  choice: kepada Mesias
  rationale: Dengan artikel dan dalam peran khusus sebagai mempelai laki-laki, Χριστός berfungsi sebagai gelar; karena itu diterjemahkan “Mesias,” sementara padanan tradisional “Kristus” dicatat sebagai alternatif.
theological_decisions:
- issue: Sifat kecemburuan Paulus
  choice: Frasa diterjemahkan secara langsung sebagai “kecemburuan Allah,” sehingga dapat dipahami sebagai kecemburuan yang berasal dari atau mencerminkan Allah.
  alternative: “kecemburuan yang sesuai dengan kehendak Allah” atau “kecemburuan ilahi”
  rationale: Konstruksi genitif Yunani tidak menetapkan secara mutlak apakah kecemburuan itu milik Allah, bersumber dari Allah, atau bercirikan Allah. Terjemahan utama mempertahankan ketegangan ini dan catatan kaki menyebutkan alternatifnya.
- issue: Fungsi Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam gambaran pertunangan ini, Χριστός menunjuk kepada sosok bergelar yang menjadi satu-satunya mempelai laki-laki. “Mesias” menampilkan daya gelar tersebut tanpa menolak padanan tradisional “Kristus.”
- issue: Jemaat sebagai perawan yang suci
  choice: Kiasan kolektif dipertahankan tanpa menjelaskan lebih lanjut apakah penyajiannya terutama bersifat seremonial, moral, atau eskatologis.
  alternative: Memperluasnya menjadi “jemaat yang tetap murni sampai kedatangan Kristus”
  rationale: Teks menyebut tujuan mempersembahkan jemaat sebagai perawan yang suci, tetapi tidak menguraikan waktu atau seluruh implikasi teologisnya; karena itu terjemahan tidak menambahkan penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan kalimat mempertahankan hubungan sebab dan tujuan dalam teks Yunani, sementara istilah pertunangan dan pengantin dijaga agar kiasan perjanjian tetap jelas bagi pembaca umum.
