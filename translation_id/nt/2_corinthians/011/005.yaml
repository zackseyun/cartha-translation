  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: id
  text: Sebab aku menganggap diriku sama sekali tidak lebih rendah daripada para “rasul yang luar biasa” itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rasul-rasul yang paling terkemuka.” Ungkapan Yunani ini dapat dipahami secara ironis (“rasul yang luar biasa”) atau sebagai rujukan lugas kepada rasul-rasul yang sangat dihormati.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: menurut penilaianku
  rationale: Ungkapan ini menyampaikan tindakan menimbang atau menilai secara reflektif dan wajar dalam bahasa Indonesia modern.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan uraian sebelumnya sebagai alasan atau penjelasan.
- source_word: μηδὲν
  choice: sama sekali tidak
  rationale: Dalam hubungannya dengan infinitif ὑστερηκέναι, kata ini berfungsi secara adverbial dan menegaskan bahwa Paulus tidak kalah dalam hal apa pun.
- source_word: ὑστερηκέναι
  choice: tidak lebih rendah
  rationale: Bentuk ini menyatakan keadaan berkekurangan atau tertinggal dibandingkan dengan orang lain; ungkapan komparatif ini paling alami dalam konteks tersebut.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: para “rasul yang luar biasa” itu
  rationale: Frasa ini mempertahankan kemungkinan nada ironis dalam konteks polemik Paulus. Tanda petik membantu mengisyaratkan ironi tanpa menambahkan kata seperti 'yang mengaku diri', yang tidak terdapat dalam teks sumber.
theological_decisions:
- issue: Apakah τῶν ὑπερλίαν ἀποστόλων merupakan sebutan ironis bagi para lawan Paulus atau rujukan lugas kepada rasul-rasul yang sangat terkemuka
  choice: para “rasul yang luar biasa” itu
  alternative: rasul-rasul yang paling terkemuka
  rationale: Konteks 2 Korintus 11 mendukung kemungkinan kuat bahwa Paulus sedang menyindir para pelayan saingan. Namun, karena frasa Yunani juga dapat dipahami secara lugas, alternatif itu dipertahankan dalam catatan kaki dan tidak ditutup secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan penegasan μηδὲν atau ketegangan penafsiran dalam sebutan ὑπερλίαν ἀποστόλων.
