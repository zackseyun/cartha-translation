id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: id
  text: Namun, apa yang sedang kulakukan akan terus kulakukan, supaya aku menutup kesempatan bagi mereka yang menginginkan kesempatan[a], agar dalam hal yang mereka banggakan, mereka didapati sama seperti kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “dalih” atau “alasan”, untuk kedua kemunculan kata “kesempatan” (Yunani: ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Namun, apa yang sedang kulakukan akan terus kulakukan
  rationale: Gabungan bentuk kini ποιῶ dan bentuk mendatang ποιήσω menyatakan tindakan Paulus sekarang serta tekadnya untuk melanjutkannya. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambah isi pada teks Yunani.
- source_word: ἐκκόψω
  choice: aku memutus
  rationale: ἐκκόπτω secara harfiah berarti memotong atau memutus, dan di sini dipakai secara metaforis untuk meniadakan sesuatu bagi lawan. 'Memutus' mempertahankan gambaran metaforis sambil terdengar wajar.
- source_word: ἀφορμή
  choice: kesempatan
  rationale: ἀφορμή dapat berarti kesempatan, alasan, dalih, atau titik tolak. 'Kesempatan' mempertahankan cakupan yang relatif netral, sedangkan kemungkinan nuansa 'dalih' dicatat dalam catatan kaki.
- source_word: τῶν θελόντων ἀφορμήν
  choice: mereka yang menginginkan kesempatan
  rationale: Terjemahan ini mempertahankan pengulangan ἀφορμή yang sengaja dipakai dalam bahasa Yunani dan tidak menetapkan secara berlebihan sifat kesempatan yang dicari.
- source_word: ἐν ᾧ καυχῶνται
  choice: dalam hal yang mereka banggakan
  rationale: Frasa ini menyatakan ranah atau perkara yang menjadi dasar kebanggaan mereka. 'Dalam hal yang mereka banggakan' jelas, alami, dan mempertahankan hubungan preposisional teks Yunani.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: mereka didapati sama seperti kami
  rationale: Bentuk pasif εὑρεθῶσιν dipertahankan dengan 'didapati', sementara καθὼς καὶ ἡμεῖς diterjemahkan secara langsung tanpa menjelaskan terlebih dahulu aspek perbandingan yang dibiarkan tersirat dalam ayat.
theological_decisions:
- issue: Sifat ἀφορμή yang dicari para lawan Paulus
  choice: kesempatan
  alternative: dalih; alasan
  rationale: Walaupun konteksnya polemis dan 'dalih' mungkin dimaksudkan, kata bendanya sendiri tidak mengharuskan nuansa moral itu. Terjemahan utama yang netral mempertahankan ambiguitas, dan alternatifnya disediakan dalam catatan kaki.
- issue: Maksud perbandingan 'sama seperti kami'
  choice: Mempertahankan perbandingan tanpa menjelaskan aspek spesifiknya
  alternative: Menambahkan bahwa mereka ingin dianggap setara dengan Paulus dalam pelayanan tanpa upah
  rationale: Konteks yang lebih luas dapat menerangkan pokok perbandingan, tetapi ayat ini sendiri mengungkapkannya secara ringkas. Penjelasan tafsir tidak dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Bentuk pronominal 'kulakukan' dan 'aku' mengikuti suara pribadi Paulus; 'kami' mempertahankan peralihan ke Paulus bersama rekan-rekannya. Pengulangan 'kesempatan' dipertahankan karena menonjol dalam teks Yunani.
