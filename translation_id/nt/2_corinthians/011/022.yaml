id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: id
  text: Apakah mereka orang Ibrani? Aku juga. Apakah mereka orang Israel? Aku juga. Apakah mereka keturunan Abraham[a]? Aku juga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih Abraham”. Bahasa Yunani memakai bentuk tunggal dengan makna kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: orang Ibrani
  rationale: Istilah baku dan alami dalam bahasa Indonesia untuk sebutan etnis-keagamaan ini; mempertahankan perbedaannya dari 'orang Israel'.
- source_word: κἀγώ
  choice: Aku juga
  rationale: Bentuk ringkas καί + ἐγώ menegaskan bahwa klaim yang sama berlaku bagi Paulus. Pengulangan singkat ini mempertahankan daya retoris teks Yunani.
- source_word: Ἰσραηλῖται
  choice: orang Israel
  rationale: Menyatakan keanggotaan dalam Israel sebagai umat perjanjian dan tetap membedakannya dari 'orang Ibrani' serta 'keturunan Abraham'.
- source_word: σπέρμα Ἀβραάμ
  choice: keturunan Abraham
  rationale: Ungkapan Indonesia yang alami dan kolektif untuk menyatakan garis keturunan Abraham; catatan kaki memberi padanan lebih harfiah dari nomina tunggal kolektif Yunani.
- source_word: εἰσιν
  choice: Apakah mereka ...? / Aku juga.
  rationale: Kopula Yunani diwujudkan secara idiomatis dalam rangkaian pertanyaan dan jawaban eliptis bahasa Indonesia, sambil mempertahankan struktur retorisnya.
theological_decisions:
- issue: Perbedaan bernuansa antara tiga sebutan identitas Yahudi
  choice: 'Mempertahankan tiga sebutan berbeda: ''orang Ibrani'', ''orang Israel'', dan ''keturunan Abraham''.'
  alternative: Menyamakan semuanya sebagai 'orang Yahudi' atau memakai satu sebutan keturunan untuk ketiganya.
  rationale: Teks Yunani sengaja menumpuk tiga klaim identitas yang saling berkaitan tetapi tidak sama. Mempertahankan ketiganya menghindari perataan nuansa teologis dan retoris.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk 'Aku juga' dipilih untuk menjaga pengulangan yang tajam dan emfatis; 'orang Ibrani' dan 'orang Israel' lebih alami daripada bentuk nominal tanpa 'orang'.
