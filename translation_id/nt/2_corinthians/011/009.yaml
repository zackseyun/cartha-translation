reference: 2 Corinthians 11:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: id
  text: Ketika aku berada bersama kalian dan mengalami kekurangan, aku tidak membebani siapa pun. Sebab, saudara-saudara[a] yang datang dari Makedonia memenuhi kekuranganku. Dalam segala hal aku menjaga diriku agar tidak menjadi beban[b] bagi kalian, dan aku akan terus berbuat demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Yunani yang diterjemahkan “saudara-saudara” adalah jamak maskulin. Dalam tulisan Paulus, istilah ini kadang dapat dipakai lebih luas untuk sesama orang percaya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menjadi beban” terutama dapat menunjuk pada beban keuangan.
    reason: lexical_clarification
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: ketika aku berada bersama kalian
  rationale: Partisipel ini paling wajar dipahami secara temporal. Ungkapan tersebut menyatakan kehadiran pribadi Paulus di tengah jemaat Korintus.
- source_word: ὑστερηθεὶς
  choice: mengalami kekurangan
  rationale: Bentuk pasif ini menunjuk pada keadaan berkekurangan atau membutuhkan sesuatu; konteksnya terutama menyangkut kebutuhan materi.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: aku tidak membebani siapa pun
  rationale: Kata kerja καταναρκάω di sini berarti menjadi beban bagi seseorang, khususnya secara keuangan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan cakupan οὐθενός, 'siapa pun'.
- source_word: τὸ ὑστέρημά μου
  choice: apa yang kurang padaku
  rationale: Nomina ini menyatakan kekurangan atau sesuatu yang dibutuhkan Paulus. Bentuk klausa ini lebih alami daripada nomina abstrak, tanpa mempersempit jenis kebutuhannya.
- source_word: προσανεπλήρωσαν
  choice: mencukupi
  rationale: Kata kerja ini berarti memenuhi atau menutupi kekurangan. 'Mencukupi apa yang kurang padaku' menyampaikan maknanya dengan jelas dan alami.
- source_word: οἱ ἀδελφοὶ
  choice: saudara-saudara
  rationale: Bentuk Yunani ini adalah jamak maskulin. 'Saudara-saudara' merupakan padanan Indonesia yang alami; catatan kaki menjelaskan bentuk gramatikal dan kemungkinan rujukannya.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: yang datang dari Makedonia
  rationale: Partisipel aoris dialihkan menjadi klausa relatif agar lancar dalam bahasa Indonesia, sambil mempertahankan asal geografis mereka.
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Frasa adverbial ini menyatakan cakupan yang menyeluruh tanpa menentukan satu bidang tertentu.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: aku menjaga diriku agar tidak menjadi beban bagi kalian
  rationale: Adjektiva ἀβαρής berarti 'tidak membebani'. Perluasan sintaksis ini diperlukan agar ungkapannya alami dalam bahasa Indonesia dan tetap menunjukkan bahwa Paulus sengaja mempertahankan keadaan tersebut.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: aku menjaga ... dan aku akan terus berbuat demikian
  rationale: τηρέω berarti menjaga atau mempertahankan. Frasa 'akan terus berbuat demikian' menyatakan kelanjutan pada masa mendatang yang tersirat oleh bentuk futurum.
theological_decisions:
- issue: Cakupan gender οἱ ἀδελφοὶ
  choice: saudara-saudara, dengan catatan bahwa bentuk Yunaninya maskulin jamak
  alternative: saudara-saudara seiman, yang dapat secara eksplisit mencakup laki-laki dan perempuan
  rationale: Bentuk sumber adalah maskulin jamak dan dalam konteks ini kemungkinan menunjuk kepada rekan-rekan laki-laki tertentu yang datang dari Makedonia. Terjemahan utama tidak memperluasnya secara eksplisit menjadi kelompok campuran, tetapi juga tidak memaksakan kata 'laki-laki' yang terasa tidak alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan pronomina 'aku' dan 'kalian' untuk mempertahankan nada surat pribadi serta membedakan orang pertama tunggal dari orang kedua jamak. Diksi dibuat lugas dan bermartabat; struktur kalimat Yunani dipecah secukupnya agar mudah dibaca tanpa menghilangkan pengulangan gagasan tentang tidak membebani jemaat.
