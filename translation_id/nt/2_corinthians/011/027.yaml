  verdict: revise
  source_fidelity: Terjemahan utama pada umumnya setia pada rangkaian datif Yunani dan dengan baik membedakan κόπῳ/μόχθῳ, λιμῷ/νηστείαις, serta ψύχει/γυμνότητι. Namun, catatan a menyajikan “sering tidak mendapat makanan” sebagai alternatif, padahal itu bukan padanan leksikal langsung untuk νηστείαις (“puasa-puasa”), melainkan kemungkinan keadaan yang melatarinya. Catatan perlu dirumuskan ulang agar ambiguitas mengenai sifat puasa dipertahankan tanpa menggeser makna katanya.
  naturalness: Bahasa utama baku, ringkas, dan alami. “Sering tidak tidur” adalah ungkapan modern yang baik untuk ἐν ἀγρυπνίαις πολλάκις. “Dalam kedinginan dan tanpa pakaian yang memadai” dapat dipahami, tetapi “kekurangan pakaian” lebih paralel dengan daftar keadaan yang sedang dialami dan tetap alami.
  terminology: '“Jerih payah,” “kesukaran,” “kelaparan,” “kehausan,” dan “berpuasa” tepat dan mempertahankan retorika kumulatif. Untuk γυμνότητι, “kekurangan pakaian” menyampaikan pengertian kontekstual tanpa menetapkan ketelanjangan harfiah; alternatif harfiahnya tetap harus dicatat. Audit trail bahasa Inggris tampak memiliki jangkar catatan yang tertukar: [a] ditempatkan sesudah “hardship” tetapi membahas fastings, sedangkan [b] ditempatkan sesudah “fastings” tetapi membahas nakedness. Ini tidak mengubah jangkar dalam draf Indonesia, yang sudah ditempatkan dengan benar.'
