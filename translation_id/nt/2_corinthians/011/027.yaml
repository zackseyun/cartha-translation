  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: id
  text: dalam jerih payah dan kesukaran, sering tidak tidur, dalam kelaparan dan kehausan, sering berpuasa[a], dalam kedinginan dan kekurangan pakaian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini berarti “puasa-puasa.” Teks tidak menjelaskan apakah puasa itu dilakukan dengan sukarela atau disebabkan oleh keadaan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam ketelanjangan.” Dalam konteks ini, maksudnya mungkin kekurangan pakaian dan keterpaparan terhadap cuaca.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: jerih payah
  rationale: Istilah ini menunjuk pada kerja keras yang melelahkan. 'Jerih payah' alami dalam bahasa Indonesia dan mempertahankan tekanan pada pengerahan tenaga.
- source_word: μόχθῳ
  choice: kesukaran
  rationale: Istilah ini bertumpang tindih dengan κόπος, tetapi menambahkan nuansa penderitaan atau kesulitan yang menyertai kerja berat. 'Kesukaran' mempertahankan pasangan kumulatif tanpa menyamakan kedua kata.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: sering tidak tidur
  rationale: ἀγρυπνία berarti keadaan terjaga atau tidak tidur. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan apakah penyebabnya berjaga dengan sengaja atau keadaan yang menghalangi tidur.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: dalam kelaparan dan kehausan
  rationale: Pasangan ini menyatakan keadaan kekurangan yang dialami. Pengulangan 'dalam' mempertahankan pola retoris daftar Yunani.
- source_word: ἐν νηστείαις πολλάκις
  choice: sering berpuasa
  rationale: νηστεία berarti puasa atau keadaan tidak makan. Terjemahan ini mempertahankan perbedaannya dari λιμός 'kelaparan', sedangkan catatan kaki membiarkan terbuka apakah hal itu disengaja atau dipaksakan keadaan.
- source_word: ἐν ψύχει
  choice: dalam kedinginan
  rationale: ψῦχος menunjuk pada dingin sebagai keadaan yang ditanggung. 'Dalam kedinginan' merupakan ungkapan Indonesia yang wajar dan sesuai dengan susunan daftar.
- source_word: γυμνότητι
  choice: tanpa pakaian yang memadai
  rationale: γυμνότης dapat berarti ketelanjangan, tetapi dalam daftar penderitaan ini dapat menunjuk pada kekurangan pakaian dan keterpaparan terhadap cuaca. Pilihan ini menyampaikan makna kontekstual tanpa memastikan ketelanjangan harfiah.
theological_decisions:
- issue: Makna νηστείαις dalam daftar penderitaan Paulus
  choice: sering berpuasa
  alternative: sering tidak mendapat makanan atau mengalami kekurangan makanan
  rationale: Kata Yunani membedakan keadaan ini dari λιμός, 'kelaparan', yang baru saja disebut. Namun, teks tidak menjelaskan apakah puasa tersebut sukarela atau akibat keadaan; ambiguitas itu dipertahankan melalui catatan kaki.
- issue: Makna γυμνότητι
  choice: tanpa pakaian yang memadai
  alternative: dalam ketelanjangan
  rationale: Dalam konteks dingin dan penderitaan, ungkapan ini mungkin menunjuk pada kekurangan pakaian serta keterpaparan terhadap cuaca. Terjemahan utama menyampaikan makna kontekstual, sementara arti yang lebih harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan susunan daftar yang ringkas. Pengulangan preposisi dipertahankan sebagian untuk mencerminkan irama kumulatif teks Yunani, tetapi ungkapan dibuat alami bagi pembaca umum.
