  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: id
  text: Jika aku harus bermegah, aku akan bermegah atas hal-hal yang berkaitan dengan kelemahanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “aku akan bermegah atas hal-hal dari kelemahanku.” Ungkapan Yunani ini dapat juga diterjemahkan lebih idiomatis: “aku akan bermegah tentang kelemahan-kelemahanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Jika
  rationale: Mempertahankan bentuk syarat dalam bahasa Yunani tanpa mengubahnya menjadi hubungan sebab akibat seperti 'karena'.
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: bermegah / aku akan bermegah
  rationale: '''Bermegah'' merupakan padanan yang wajar dalam konteks retorika Paulus dan mempertahankan pengulangan verba yang sama.'
- source_word: δεῖ
  choice: harus
  rationale: Menyampaikan keharusan atau keterpaksaan retoris secara ringkas dan alami.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: hal-hal yang menunjukkan kelemahanku
  rationale: Mengungkapkan konstruksi Yunani yang tidak biasa secara jelas, sambil mempertahankan bentuk jamak dan kaitannya dengan kelemahan Paulus.
- source_word: ἀσθενείας
  choice: kelemahanku
  rationale: '''Kelemahan'' mencakup keadaan lemah dan memalukan yang sedang dibicarakan, tanpa membatasinya pada penyakit fisik.'
theological_decisions:
- issue: Sifat kemegahan Paulus
  choice: Mempertahankan pernyataan paradoks bahwa Paulus bermegah atas hal-hal yang menunjukkan kelemahannya.
  alternative: aku akan bermegah tentang kelemahan-kelemahanku
  rationale: Rumusan ini menjaga ketegangan retoris antara bermegah dan kelemahan tanpa memasukkan penjelasan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bermegah' dipilih untuk mempertahankan istilah retoris Paulus; susunan 'hal-hal yang menunjukkan kelemahanku' membuat ungkapan Yunani dapat dipahami pembaca umum tanpa menghilangkan cakupan jamaknya.
