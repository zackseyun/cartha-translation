translation:
  language: id
  text: Lima kali saya menerima empat puluh cambukan kurang satu[a] dari orang-orang Yahudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “empat puluh kurang satu”; yaitu tiga puluh sembilan cambukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “oleh orang-orang Yahudi.” Bahasa Yunani menunjukkan pelaku atau sumber hukuman tanpa menyebut badan penguasa tertentu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: dari orang-orang Yahudi
  rationale: Ὑπό dengan genitif menandai pelaku atau sumber tindakan. Ungkapan ini mempertahankan penyebutan umum dalam teks tanpa mempersempitnya menjadi badan penguasa tertentu.
- source_word: πεντάκις
  choice: Lima kali
  rationale: Padanan langsung dan alami yang mempertahankan penekanan pada berulangnya pengalaman Paulus.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: empat puluh cambukan kurang satu
  rationale: Mempertahankan bentuk ungkapan Yunani, yaitu 'empat puluh kurang satu', sambil menyatakan secara wajar objek hukuman yang tersirat dalam konteks.
- source_word: ἔλαβον
  choice: saya menerima
  rationale: Mencerminkan makna dasar λαμβάνω dalam arti mengalami atau dikenai hukuman, tanpa menggantinya dengan kata yang lebih interpretatif seperti 'menanggung'.
theological_decisions:
- issue: Identitas pelaku hukuman
  choice: orang-orang Yahudi
  alternative: para penguasa Yahudi
  rationale: Teks Yunani menyebut orang-orang Yahudi secara umum sebagai pelaku atau sumber hukuman dan tidak secara eksplisit menunjuk badan pemerintahan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata 'saya' dipilih agar alami dalam tuturan Paulus; 'hukuman' ditambahkan untuk memperjelas bahwa 'cambukan' merupakan hukuman, sedangkan jumlahnya tetap mengikuti bentuk ungkapan Yunani.
