id: 2CO.11.18
reference: 2 Corinthians 11:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: id
  text: Karena banyak orang bermegah menurut daging[a], aku pun akan bermegah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut ukuran manusia” atau “secara manusiawi belaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Karena
  rationale: Memperkenalkan alasan bagi tekad ironis Paulus pada klausa berikutnya dan mempertahankan daya kausal ungkapan Yunani secara alami dalam bahasa Indonesia.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Menyatakan jumlah secara langsung; penambahan 'orang' diperlukan agar bentuk adjektival Yunani terdengar lengkap dan alami dalam bahasa Indonesia.
- source_word: καυχῶνται / καυχήσομαι
  choice: bermegah / akan bermegah
  rationale: Mempertahankan pengulangan verba Yunani dan nada retoris-polemis Paulus. 'Bermegah' lebih bermartabat dan sesuai dengan register Alkitab daripada 'membual' atau 'menyombongkan diri'.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan bentuk dan tekstur teologis ungkapan Paulus tanpa menyempitkannya menjadi satu tafsiran. Makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: κἀγὼ
  choice: aku pun
  rationale: Menyampaikan gabungan καί + ἐγώ dengan penekanan bahwa Paulus juga akan melakukan hal yang sama secara retoris.
theological_decisions:
- issue: Makna σάρξ dalam ungkapan κατὰ σάρκα
  choice: menurut daging
  alternative: menurut ukuran manusia; secara manusiawi belaka
  rationale: Terjemahan utama mempertahankan istilah Paulus serta ambiguitas dan ketegangan teologisnya. Dalam konteks ini ungkapan itu menunjuk pada dasar atau cara bermegah yang bersifat manusiawi, tetapi memasukkan tafsiran tersebut langsung ke teks akan terlalu cepat menyelesaikan idiom Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' mengikuti bentuk tunggal orang pertama Paulus dan terdengar wajar dalam wacana pribadi; pengulangan 'bermegah' sengaja dipertahankan untuk mencerminkan retorika teks sumber.
