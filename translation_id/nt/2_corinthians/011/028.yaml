  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: id
  text: 'Di samping hal-hal lain[a], setiap hari ada tekanan yang menimpaku[b]: keprihatinan terhadap semua jemaat[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Terlepas dari hal-hal di luar itu” atau “Di samping hal-hal yang tidak disebutkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ada beban yang menimpaku setiap hari” atau “setiap hari ada desakan terhadapku.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “perhatianku kepada semua jemaat” atau “kekhawatiran terhadap semua jemaat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Di samping hal-hal lain
  rationale: Ungkapan ini menunjuk pada perkara-perkara selain atau di luar daftar penderitaan yang baru disebutkan. Pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan apakah yang dimaksud ialah penderitaan lahiriah atau hal-hal yang tidak disebutkan.
- source_word: ἐπίστασίς μοι
  choice: ada tekanan atas diriku
  rationale: ἐπίστασις dapat menunjuk pada desakan atau tekanan. Dalam konteks ini maknanya paling wajar dipahami sebagai beban yang menekan Paulus, sementara datif μοι dipertahankan secara idiomatis sebagai 'atas diriku'.
- source_word: ἡ καθ’ ἡμέραν
  choice: setiap hari
  rationale: Frasa ini menyatakan tekanan yang datang atau dialami dari hari ke hari; 'setiap hari' ringkas dan alami dalam bahasa Indonesia.
- source_word: ἡ μέριμνα
  choice: kekhawatiranku
  rationale: μέριμνα dapat berarti perhatian, keprihatinan, atau kekhawatiran. 'Kekhawatiran' mempertahankan bobot emosional yang kuat tanpa menentukan bahwa perasaan itu secara moral keliru.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: terhadap semua jemaat
  rationale: Dalam pemakaian Paulus, ἐκκλησία lazimnya menunjuk pada komunitas orang percaya setempat. 'Jemaat' merupakan padanan Indonesia yang jelas dan mapan; 'terhadap' mengungkapkan hubungan genitif dengan μέριμνα secara alami.
theological_decisions:
- issue: Nuansa beban pastoral Paulus dalam μέριμνα
  choice: kekhawatiranku terhadap semua jemaat
  alternative: perhatianku kepada semua jemaat; keprihatinanku terhadap semua jemaat
  rationale: Pilihan ini mempertahankan ketegangan emosional dari istilah Yunani tanpa menyatakan bahwa kekhawatiran Paulus adalah dosa atau gangguan psikologis.
- issue: Hubungan ἐπίστασις dan μέριμνα
  choice: Klausa 'yaitu kekhawatiranku' dipahami sebagai penjelasan atas tekanan harian
  alternative: 'Memahaminya sebagai dua beban yang terpisah: tekanan harian dan kekhawatiran'
  rationale: Pengulangan artikel dan susunan frasa memungkinkan μέριμνα menjelaskan isi tekanan tersebut. 'Yaitu' menghasilkan hubungan yang alami, tetapi alternatif koordinatif tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Jemaat' dipilih daripada 'gereja-gereja' untuk menekankan komunitas orang percaya. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
