id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: id
  text: sering dalam perjalanan, dalam bahaya dari sungai-sungai, dalam bahaya dari para perampok, dalam bahaya dari kaumku sendiri[a], dalam bahaya dari orang-orang bukan Yahudi, dalam bahaya di kota, dalam bahaya di padang belantara, dalam bahaya di laut, dalam bahaya di antara saudara-saudara palsu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari bangsaku sendiri” atau “dari kaum sebangsaku.” Secara harfiah, bahasa Yunani mengatakan “dari kaumku/kerabatku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di antara orang-orang percaya palsu.” Secara harfiah, bahasa Yunani mengatakan “di antara saudara-saudara palsu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: sering dalam perjalanan
  rationale: Ungkapan ini mempertahankan bentuk daftar kesukaran Paulus dan menyatakan perjalanan yang berulang kali tanpa mempersempitnya menjadi jenis perjalanan tertentu.
- source_word: κινδύνοις
  choice: dalam bahaya
  rationale: Pengulangan frasa ini mempertahankan irama retoris dan penumpukan bahaya dalam teks Yunani.
- source_word: ποταμῶν
  choice: karena sungai-sungai
  rationale: Bentuk genitif menunjukkan sumber atau jenis bahaya. Terjemahan ini tidak menentukan apakah bahaya itu berupa banjir, arus deras, atau penyeberangan sungai.
- source_word: λῃστῶν
  choice: karena para perampok
  rationale: Istilah ini menunjuk kepada perampok atau penyamun; 'para perampok' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: ἐκ γένους
  choice: dari kaumku sendiri
  rationale: γένος di sini menunjuk kepada kelompok etnis atau bangsa Paulus sendiri. Bentuk orang pertama tersirat oleh konteks dan membuat kontras dengan bangsa-bangsa lain jelas tanpa secara eksplisit menambahkan 'orang Yahudi'.
- source_word: ἐξ ἐθνῶν
  choice: dari bangsa-bangsa lain
  rationale: Dalam kontras dengan kaum Paulus sendiri, ἔθνη menunjuk kepada bangsa-bangsa bukan Yahudi. Pilihan ini lebih mudah dipahami pembaca umum daripada istilah khusus 'bangsa-bangsa bukan Yahudi', sambil mempertahankan kontras etnis.
- source_word: ἐν πόλει
  choice: di kota
  rationale: Bentuk tunggal generik dipertahankan dan berpasangan secara retoris dengan padang belantara dan laut.
- source_word: ἐν ἐρημίᾳ
  choice: di padang belantara
  rationale: ἐρημία dapat berarti gurun, belantara, atau daerah sunyi. 'Padang belantara' cukup luas dan tidak membatasi maknanya pada gurun pasir.
- source_word: ἐν θαλάσσῃ
  choice: di laut
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan lokasi bahaya tanpa menjelaskan lebih jauh sifatnya.
- source_word: ἐν ψευδαδέλφοις
  choice: di antara saudara-saudara palsu
  rationale: Terjemahan ini mempertahankan makna harfiah ψευδάδελφοι, yaitu orang yang tampil sebagai saudara tetapi palsu, tanpa memutuskan secara eksplisit status rohani mereka.
theological_decisions:
- issue: Makna ψευδαδέλφοις dan status orang-orang yang dimaksud
  choice: di antara saudara-saudara palsu
  alternative: di antara orang-orang percaya palsu
  rationale: Bahasa Yunani secara harfiah menyebut 'saudara-saudara palsu'. Pilihan utama mempertahankan ketegangan apakah mereka benar-benar orang percaya atau hanya mengaku demikian, sedangkan alternatif dapat terdengar seolah-olah status mereka sudah ditafsirkan secara tegas.
- issue: Kontras antara ἐκ γένους dan ἐξ ἐθνῶν
  choice: dari kaumku sendiri ... dari bangsa-bangsa lain
  alternative: dari orang-orang Yahudi ... dari orang-orang bukan Yahudi
  rationale: Konteks mendukung kontras Yahudi dan bukan Yahudi, tetapi teks pertama-tama mengatakan 'kaum/kerabat sendiri' dan 'bangsa-bangsa'. Pilihan utama menjaga bentuk ungkapan Paulus serta kontrasnya tanpa mengganti kedua istilah dengan identifikasi yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pengulangan 'dalam bahaya' sengaja dipertahankan untuk mencerminkan irama retoris teks sumber. Ayat ini berupa kelanjutan daftar dari konteks sebelumnya, sehingga pembukaannya tetap berbentuk frasa, bukan kalimat mandiri penuh.
