id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: id
  text: Namun, aku takut kalau-kalau, sebagaimana ular memperdaya Hawa dengan kelicikannya, pikiran kalian dirusak sehingga menyimpang dari ketulusan[b] dan kemurnian[a] yang tertuju kepada Mesias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat kata-kata “dan kemurnian”.
    reason: textual_variant
  - marker: b
    text: Atau “kesederhanaan”; dalam konteks ini dapat berarti ketulusan hati yang tidak terbagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Namun, aku takut kalau-kalau
  rationale: Ungkapan ini menyatakan kekhawatiran Paulus akan sesuatu yang mungkin terjadi. “Kalau-kalau” alami dalam bahasa Indonesia dan mempertahankan nuansa kekhawatiran.
- source_word: ὁ ὄφις
  choice: ular
  rationale: “Ular” adalah padanan baku yang mempertahankan rujukan kepada kisah Hawa dalam Kejadian.
- source_word: ἐξηπάτησεν
  choice: memperdaya
  rationale: Kata ini menyatakan penipuan yang menyesatkan; “memperdaya” sesuai dengan konteks kelicikan ular.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: dengan kelicikannya
  rationale: Frasa ini menyatakan sarana yang dipakai ular; “kelicikan” menyampaikan kecerdikan yang jahat dan menipu.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: pikiran kalian dirusak
  rationale: Terjemahan ini mempertahankan bentuk pasif dan mencakup kerusakan pada cara berpikir atau pertimbangan jemaat.
- source_word: ἀπὸ
  choice: sehingga menyimpang dari
  rationale: Dalam konstruksi ini, preposisi tersebut menandai pemisahan dari keadaan semula. Penambahan “sehingga menyimpang” membuat hubungan itu jelas dan alami dalam bahasa Indonesia tanpa menghilangkan gagasan kerusakan.
- source_word: τῆς ἁπλότητος
  choice: ketulusan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada sikap yang tulus, tidak bercabang, atau sepenuh hati, bukan sekadar keadaan yang sederhana.
- source_word: καὶ τῆς ἁγνότητος
  choice: dan kemurnian
  rationale: “Kemurnian” mempertahankan cakupan moral kata Yunani serta kaitannya dengan gambaran pertunangan dalam konteks dekat.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: yang tertuju kepada Mesias
  rationale: Frasa ini menerangkan ketulusan dan kemurnian sebagai sikap yang diarahkan kepada Mesias. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi Χριστός sebagai gelar.
theological_decisions:
- issue: Makna ἁπλότης dalam hubungan dengan Mesias
  choice: ketulusan
  alternative: kesederhanaan; ketulusan hati yang tidak terbagi
  rationale: Konteksnya adalah kesetiaan yang tidak bercabang kepada Mesias. “Ketulusan” menyampaikan kualitas moral itu, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
- issue: Penerjemahan Χριστόν
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός dapat dipahami sebagai gelar bagi Yesus; “Mesias” menerjemahkan makna gelar tersebut tanpa menjadikannya sekadar nama diri.
- issue: Keberadaan καὶ τῆς ἁγνότητος
  choice: memuat “dan kemurnian” dalam teks utama
  alternative: menghilangkannya menurut varian naskah yang lebih pendek
  rationale: SBLGNT memuat frasa ini, sehingga diterjemahkan dalam teks utama; varian yang menghilangkannya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” dan “kalian” mempertahankan suara pribadi Paulus serta bentuk jamak sapaan kepada jemaat. Susunan kalimat mempertahankan perbandingan dengan ular sambil menghindari ungkapan yang kaku.
