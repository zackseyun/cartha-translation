id: 2CO.11.31
reference: 2 Corinthians 11:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: id
  text: Allah dan Bapa Tuhan Yesus, Dia yang terpuji selama-lamanya[a], mengetahui bahwa aku tidak berdusta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk zaman-zaman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Allah dan Bapa
  rationale: Satu kata sandang menaungi kedua nomina dalam ungkapan tetap ini. Keduanya dipertahankan untuk mencerminkan bentuk pernyataan Paulus yang khidmat.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Tuhan Yesus
  rationale: Genitif diterjemahkan secara alami sebagai hubungan kepunyaan dalam frasa Indonesia “Allah dan Bapa Tuhan Yesus”. Kata “kita” tidak ditambahkan karena tidak terdapat dalam teks Yunani.
- source_word: οἶδεν
  choice: mengetahui
  rationale: Makna leksikal langsung verba ini adalah “mengetahui”. Walaupun berfungsi dalam pernyataan yang menyerupai sumpah, ungkapan ini tidak diperluas menjadi “menjadi saksi”.
- source_word: ὁ ὢν εὐλογητὸς
  choice: Dia yang terpuji
  rationale: Partisipel berartikel dengan adjektiva predikatif menggambarkan Allah secara doksologis. “Dia yang terpuji” alami, jelas, dan mempertahankan fungsi deskriptifnya.
- source_word: εἰς τοὺς αἰῶνας
  choice: selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan pujian yang tidak berakhir. “Selama-lamanya” wajar dalam bahasa Indonesia dan mempertahankan nuansa doksologis.
- source_word: ὅτι
  choice: bahwa
  rationale: Di sini ὅτι memperkenalkan isi yang diketahui Allah, bukan alasan atau klausa sebab.
- source_word: οὐ ψεύδομαι
  choice: aku tidak berdusta
  rationale: Bentuk kini diterjemahkan dengan pernyataan langsung yang alami. “Berdusta” sesuai dengan ragam bahasa yang bermartabat tanpa menjadi kuno.
theological_decisions:
- issue: Hubungan “Allah dan Bapa” dengan “Tuhan Yesus”
  choice: Frasa diterjemahkan langsung sebagai “Allah dan Bapa Tuhan Yesus”, tanpa mengaburkan pembedaan relasional yang dinyatakan teks.
  alternative: Memparafrasakan frasa untuk menghindari ketegangan teologis yang dipersepsikan.
  rationale: Teks membedakan Allah dan Bapa dari Tuhan Yesus. Terjemahan mempertahankan susunan relasional tersebut tanpa menambahkan penjelasan doktrinal.
- issue: Fungsi dan pelekatan klausa doksologis
  choice: “Dia yang terpuji selama-lamanya” diperlakukan sebagai keterangan apositif tentang Allah dan diapit koma.
  alternative: Menggabungkannya sebagai klausa pembatas tanpa jeda.
  rationale: Klausa itu paling alami dipahami sebagai sisipan pujian dalam pernyataan Paulus. Tanda koma menjaga alur kalimat dan tidak mengubah rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “aku” mempertahankan suara pribadi Paulus, sedangkan “mengetahui” dan “berdusta” menjaga martabat ungkapan. Penanda catatan kaki ditempatkan tepat setelah “selama-lamanya”, yaitu unsur yang dijelaskan oleh catatan tersebut.
