  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: id
  text: Melalui sebuah jendela di tembok itu, saya diturunkan dalam sebuah keranjang, lalu lolos dari tangannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saya diturunkan melalui sebuah jendela di tembok itu dalam keranjang anyaman tali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: jendela
  rationale: θυρίς menunjuk pada jendela atau bukaan kecil. 'Jendela' merupakan padanan Indonesia yang paling alami dan cukup spesifik dalam konteks ini.
- source_word: σαργάνῃ
  choice: keranjang
  rationale: σαργάνη adalah wadah anyaman, kemungkinan terbuat dari tali atau bahan sejenis. 'Keranjang' jelas dan alami; nuansa bahannya dipertahankan dalam catatan kaki.
- source_word: ἐχαλάσθην
  choice: saya diturunkan
  rationale: Bentuk pasif χαλάω di sini menyatakan tindakan menurunkan seseorang, kemungkinan dengan tali. 'Saya diturunkan' alami serta mempertahankan bentuk pasif teks Yunani.
- source_word: διὰ τοῦ τείχους
  choice: melewati tembok itu
  rationale: Ungkapan ini menggambarkan gerak melalui atau melintasi tembok melalui bukaan yang disebut sebelumnya. 'Melewati tembok itu' menghindari kesan bahwa tubuh menembus bahan tembok, tanpa menambahkan kata 'kota' yang tidak eksplisit.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: saya lolos dari tangannya
  rationale: Ungkapan ini mempertahankan gambaran hidup tentang lolos dari genggaman atau kuasa seseorang dan terdengar wajar dalam bahasa Indonesia.
