translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Susunan klausa mempertahankan rangkaian tindakan dalam bahasa Yunani, sementara 'lalu' memperjelas urutan secara alami. Penanda catatan kaki ditempatkan dalam teks utama.
