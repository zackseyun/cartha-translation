translation:
  language: id
  text: Sebab kamu dengan senang hati bersabar terhadap orang-orang bodoh[a], padahal kamu sendiri bijaksana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menoleransi orang-orang bodoh.”
    reason: lexical_alternative
  - marker: b
    text: 'Paulus berbicara secara ironis: kontras antara “orang-orang bodoh” dan “bijaksana” menyindir sikap para pembacanya.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡδέως
  choice: dengan senang hati
  rationale: Mengungkapkan kesediaan atau rasa senang dan, dalam konteks ini, mempertahankan nada ironis Paulus.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: ἀνέχεσθε
  choice: tahan terhadap
  rationale: Menyampaikan arti menanggung atau menoleransi seseorang; ungkapan ini cukup tajam dan wajar dalam bahasa Indonesia.
- source_word: τῶν ἀφρόνων
  choice: orang-orang bodoh
  rationale: Merujuk kepada orang-orang yang bodoh dan mempertahankan kontras langsung dengan 'bijaksana'.
- source_word: φρόνιμοι
  choice: bijaksana
  rationale: Mempertahankan pasangan retoris yang ironis dengan 'orang-orang bodoh'.
- source_word: ὄντες
  choice: padahal kamu sendiri
  rationale: Mengungkapkan keadaan subjek secara alami sambil mempertahankan ketegangan ironis; nuansa partisipel tidak dijabarkan sebagai sebab yang pasti.
theological_decisions:
- issue: Nada ironis Paulus terhadap jemaat Korintus
  choice: Ironi dipertahankan melalui pertentangan antara 'orang-orang bodoh' dan 'kamu sendiri bijaksana', tanpa memasukkan penanda seperti 'begitu bijaksana'.
  alternative: Mengeksplisitkan sindiran dengan 'karena kamu merasa begitu bijaksana'.
  rationale: Teks Yunani menciptakan ironi lewat penjajaran istilah, bukan lewat pernyataan eksplisit bahwa mereka hanya menganggap diri bijaksana.
- issue: Hubungan partisipel φρόνιμοι ὄντες dengan klausa utama
  choice: padahal kamu sendiri bijaksana
  alternative: karena kamu sendiri bijaksana
  rationale: Partisipel Yunani dapat dipahami secara keadaan, kausal, atau bernuansa konsesif/ironis. 'Padahal' sesuai konteks retoris tetapi tidak menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara kontras dan ironi teks sumber tetap dipertahankan.
