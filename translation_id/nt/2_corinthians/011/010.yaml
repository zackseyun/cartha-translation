base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: id
  text: Demi kebenaran Mesias yang ada di dalam diriku, hal yang kubanggakan ini tidak akan dibungkam di wilayah-wilayah Akhaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ ἐν ἐμοὶ
  choice: Demi kebenaran Mesias yang ada di dalam diriku
  rationale: Ungkapan ini merupakan penegasan khidmat yang menyerupai sumpah. “Demi” menyampaikan daya idiomatisnya dalam bahasa Indonesia, sedangkan “yang ada di dalam diriku” mempertahankan ἐν ἐμοί tanpa menafsirkan lebih jauh hubungan antara Paulus dan kebenaran Mesias.
- source_word: καύχησις αὕτη ... εἰς ἐμὲ
  choice: kebanggaanku ini
  rationale: καύχησις menunjuk pada tindakan atau isi berbangga. Frasa sulit εἰς ἐμέ dinyatakan secara alami sebagai kepunyaan atau hal yang berkenaan dengan Paulus, tanpa mengubah pokok pernyataannya.
- source_word: οὐ φραγήσεται
  choice: tidak akan dibungkam
  rationale: Bentuk pasif φραγήσεται secara harfiah menggambarkan sesuatu yang ditutup atau disumbat. Dalam konteks perkataan Paulus, “dibungkam” mempertahankan metafora dan menyampaikan bahwa kebanggaannya tidak akan dihentikan.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: di wilayah-wilayah Akhaya
  rationale: κλίμασι berbentuk jamak dan menunjuk pada wilayah atau daerah. Bentuk jamak dipertahankan, dan Ἀχαΐα ditransliterasikan menurut bentuk Indonesia yang lazim, “Akhaya”.
theological_decisions:
- issue: Pemaknaan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός tetap memiliki daya gelar dalam ungkapan ini, sehingga “Mesias” dipakai dalam teks utama. Bentuk tradisional “Kristus” dicatat sebagai alternatif agar pembaca mengetahui kemungkinan penyajiannya.
- issue: Daya ungkapan ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι
  choice: 'rumusan penegasan khidmat: “Demi kebenaran Mesias yang ada di dalam diriku”'
  alternative: 'pernyataan langsung: “Kebenaran Kristus ada di dalam diriku: ...”'
  rationale: ὅτι memperkenalkan isi penegasan Paulus. Terjemahan utama menyampaikan fungsi idiomatisnya, sementara catatan kaki mempertahankan kemungkinan membaca susunannya secara lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan utama dibuat alami sebagai penegasan yang menyerupai sumpah, sementara catatan kaki mempertahankan susunan yang lebih harfiah dan ketidakpastian idiom εἰς ἐμέ.
