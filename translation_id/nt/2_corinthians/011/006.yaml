  source_fidelity: 'Klausa pertama diterjemahkan dengan baik: ἰδιώτης τῷ λόγῳ menunjuk pada keterbatasan dalam keterampilan berbicara/retorika, bukan kekurangan pengetahuan. Namun, teks utama menafsirkan ἐν πᾶσιν secara terlalu khusus sebagai “di hadapan semua orang”, padahal bentuk itu ambigu dan lebih aman dipertahankan sebagai cakupan netral “dalam segala hal”. Susunan “dalam segala hal dan di hadapan semua orang” juga mengaburkan dua frasa cakupan yang paralel dalam bahasa Yunani.'
