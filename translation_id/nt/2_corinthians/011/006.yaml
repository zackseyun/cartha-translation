  to: Namun, sekalipun aku tidak terampil dalam berbicara[a], aku tidak kekurangan pengetahuan. Bahkan, dengan segala cara dan dalam segala hal, kami telah menyatakannya dengan jelas kepada kamu.[b]
  rationale: Revisi mempertahankan makna utama dan gaya bahasa modern, tetapi mengganti pembacaan personal yang terlalu spesifik pada ἐν πᾶσιν dengan “dalam segala hal”, yang lebih aman dan tetap mencerminkan cakupan luas serta ambiguitas konstruksi Yunani. Kemungkinan pembacaan personal dipelihara dalam catatan kaki. Frasa tentang γνῶσις dibuat lebih idiomatis tanpa mengubah makna.
