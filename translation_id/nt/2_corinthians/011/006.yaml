  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: id
  text: Namun, sekalipun aku tidak terampil dalam berbicara[a], aku tidak kekurangan pengetahuan. Bahkan, dengan segala cara dan dalam segala hal, kami telah menyatakannya dengan jelas kepada kamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak terlatih dalam berbicara,” yaitu tidak memiliki kemahiran retoris yang terasah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Yunani pada bagian akhir ayat ini padat dan susunannya tidak sepenuhnya pasti. Dapat juga diterjemahkan, “Bahkan, dalam segala hal kami telah menyatakannya dengan jelas kepada kamu,” atau dipahami dengan arti personal, “kami telah membuatnya nyata kepada kamu di antara semua orang.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: tidak terampil dalam berbicara
  rationale: Dalam konteks ini Paulus membandingkan kecakapan atau kemahiran retoris dengan pengetahuan. Ungkapan ini menyampaikan kurangnya keterampilan berbicara yang terlatih tanpa menyiratkan bahwa ia tidak berpendidikan atau tidak berwenang.
- source_word: γνώσει
  choice: pengetahuan
  rationale: Padanan langsung ini mempertahankan kontras Paulus antara cara berbicara dan penguasaan isi.
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Ungkapan ini menunjukkan keluasan atau kelengkapan cara Paulus dan rekan-rekannya memperlihatkan pengetahuan mereka.
- source_word: φανερώσαντες
  choice: kami telah menyatakannya dengan jelas
  rationale: Partisip aoris ini secara idiomatis menegaskan bahwa mereka telah membuat kenyataan tersebut nyata atau jelas; bentuk orang pertama jamak mengikuti subjek tersirat dalam partisip tersebut.
- source_word: ἐν πᾶσιν
  choice: di hadapan semua orang
  rationale: Bentuk jamak ini dapat dipahami secara maskulin sebagai rujukan kepada orang-orang. Karena ungkapannya padat dan juga dapat dipahami secara netral sebagai 'dalam segala hal', kemungkinan lain dicatat dalam catatan kaki.
- source_word: εἰς ὑμᾶς
  choice: kepada kamu
  rationale: Frasa ini menunjukkan arah penyataan tersebut kepada jemaat Korintus. 'Kamu' dipakai sebagai bentuk jamak yang lazim dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna pengakuan Paulus tentang kemampuan berbicaranya
  choice: Paulus mengakui bahwa ia tidak terampil atau tidak terlatih dalam seni berbicara, tetapi bukan bahwa ia kekurangan pengetahuan.
  alternative: Paulus mengaku tidak berpendidikan secara umum, atau seluruh pernyataannya semata-mata ironi tanpa pengakuan apa pun.
  rationale: Kontras eksplisit antara λόγος dan γνῶσις membatasi kekurangan yang diakui pada ranah berbicara atau retorika, bukan pada kebenaran, pengetahuan, atau kewenangannya.
- issue: Rujukan ἐν πᾶσιν
  choice: Dipahami sebagai 'di hadapan semua orang' dalam teks utama.
  alternative: Dipahami secara netral sebagai 'dalam segala hal', 'dalam setiap keadaan', atau sebagai bagian dari ungkapan luas 'dengan segala cara'.
  rationale: Bahasa Yunani pada akhir ayat sangat padat dan memungkinkan rujukan kepada orang maupun perkara. Teks utama memilih pembacaan personal yang wajar, sedangkan catatan kaki mempertahankan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk 'aku/kami/kamu' mengikuti peralihan jumlah dalam teks Yunani dan menjaga sapaan kepada jemaat tetap langsung. Pengulangan cakupan pada klausa terakhir dipertahankan sejauh mungkin, sementara ketidakpastian sintaksis dijelaskan dalam catatan kaki.
