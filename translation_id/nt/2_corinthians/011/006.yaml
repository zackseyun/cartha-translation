  terminology: “Tidak terampil dalam berbicara” merupakan padanan yang baik untuk ἰδιώτης τῷ λόγῳ dalam konteks ini. “Pengetahuan” tepat untuk γνῶσις. Catatan a berguna. Catatan b sebaiknya tidak mengutamakan parafrasa personal “di antara semua orang” sebagai pembacaan teks utama; catatan itu perlu menegaskan ketidakpastian konstruksi akhir tanpa menghilangkan pembacaan netral.
