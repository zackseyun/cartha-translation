revisions:
- from: Sebab, jika seseorang datang dan memberitakan Yesus yang lain, yang tidak pernah kami beritakan, atau jika kamu menerima roh yang berbeda, yang tidak pernah kamu terima, atau menerima injil yang berbeda, yang tidak pernah kamu terima, kamu dengan senang hati menanggungnya.[a]
  to: Sebab, jika seseorang datang dan memberitakan Yesus yang lain, yang tidak kami beritakan, atau jika kamu menerima roh yang berbeda, yang tidak kamu terima, atau injil yang berbeda, yang tidak kamu sambut, kamu menoleransinya dengan baik.[a]
  rationale: Revisi menghapus penegasan temporal "pernah" yang tidak tersurat, membedakan secara idiomatis "menerima" (λαμβάνω) dari "menyambut" (δέχομαι), dan mengganti "dengan senang hati" dengan padanan yang lebih dekat untuk καλῶς. Ambiguitas tentang roh yang berbeda dan objek tersirat dari "menoleransinya" tetap dipertahankan.
