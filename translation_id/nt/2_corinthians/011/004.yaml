id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: id
  text: Sebab, jika seseorang datang dan memberitakan Yesus yang lain, yang tidak kami beritakan, atau jika kamu menerima roh yang berbeda, yang tidak kamu terima, atau injil yang berbeda, yang tidak kamu sambut, kamu menoleransinya dengan baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan ini bernada sindiran: jemaat Korintus terlalu siap menoleransi orang atau pemberitaan semacam itu. Objek yang ditoleransi tidak dinyatakan secara eksplisit dalam bahasa Yunani.'
    reason: Menjelaskan nada ironis καλῶς ἀνέχεσθε dan mempertahankan ketidakjelasan objek tersiratnya.
lexical_decisions:
- source_word: εἰ μὲν γὰρ
  choice: Sebab, jika
  rationale: Menjaga hubungan penjelasan dengan konteks sebelumnya dan memperkenalkan kondisi secara alami dalam bahasa Indonesia.
- source_word: ὁ ἐρχόμενος
  choice: seseorang datang
  rationale: Partisipel kini berartikel ini dipakai secara substantival dan dalam konteks merujuk secara umum kepada orang yang datang kepada jemaat.
- source_word: ἄλλον Ἰησοῦν
  choice: Yesus yang lain
  rationale: Mempertahankan ungkapan tajam Paulus tentang sosok tandingan yang diberitakan dengan nama Yesus, tanpa menjelaskan lebih jauh daripada teks.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: memberitakan / tidak pernah kami beritakan
  rationale: Memberitakan cocok untuk pewartaan terbuka; kata 'pernah' membuat kontras aorisnya wajar dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: πνεῦμα ἕτερον
  choice: roh yang berbeda
  rationale: ἕτερος menonjolkan perbedaan; 'roh' dibiarkan tanpa penentuan khusus agar ambiguitas rujukannya tetap terpelihara.
- source_word: λαμβάνετε / ἐλάβετε
  choice: menerima / tidak pernah kamu terima
  rationale: Mengikuti makna dasar menerima sesuatu yang diberikan atau dialami.
- source_word: εὐαγγέλιον ἕτερον
  choice: injil yang berbeda
  rationale: '''Injil'' adalah padanan baku εὐαγγέλιον, sedangkan ''berbeda'' menyampaikan daya kontras ἕτερον.'
- source_word: ἐδέξασθε
  choice: kamu terima
  rationale: Dalam bahasa Indonesia, 'terima' paling alami di sini. Perbedaan nuansa dari λαμβάνω tidak dapat dipertahankan dengan jelas tanpa menghasilkan ungkapan yang kaku atau terlalu menafsirkan.
- source_word: καλῶς ἀνέχεσθε
  choice: kamu dengan senang hati menanggungnya
  rationale: Secara leksikal dapat berarti menanggung atau mentoleransi dengan baik/senang; dalam konteks ungkapan ini bernada sindiran terhadap kesiapan jemaat menerima pemberitaan tandingan.
theological_decisions:
- issue: Rujukan πνεῦμα ἕτερον
  choice: roh yang berbeda
  alternative: Roh Kudus yang disalahgambarkan, roh jahat, atau pengaruh/sikap rohani yang berbeda
  rationale: Teks Yunani tidak memastikan rujukannya, sehingga terjemahan mempertahankan keluasan dan ketegangan teologis tersebut.
- issue: Nada καλῶς ἀνέχεσθε
  choice: kamu dengan senang hati menanggungnya, dipahami sebagai sindiran
  alternative: pujian harfiah atau pengamatan netral
  rationale: Alur argumen Paulus menegur kesiapan jemaat menoleransi guru dan pemberitaan tandingan; catatan kaki menandai nada yang tidak selalu tampak dalam kalimat tersendiri.
- issue: Objek tersirat pada ἀνέχεσθε
  choice: menanggungnya
  alternative: menanggung orang itu atau menoleransi hal-hal tersebut
  rationale: Bentuk Yunani tidak menyatakan objek secara eksplisit. Pronomina netral '-nya' mempertahankan kelonggaran apakah yang ditanggung adalah orang atau pemberitaannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga unsur paralel dipertahankan. Pengulangan 'menerima' dipilih demi kejelasan, sementara ambiguitas mengenai 'roh yang berbeda' dan objek ungkapan terakhir tidak diselesaikan secara dogmatis.
