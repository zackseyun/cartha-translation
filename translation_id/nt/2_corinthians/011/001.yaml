    text: 'Secara harfiah: “bersabar terhadapku dalam sedikit kebodohan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Namun, kalian memang bersabar terhadapku.” Bentuk Yunani dapat dipahami sebagai perintah atau sebagai pernyataan.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ὄφελον
  choice: Kiranya
  rationale: Partikel ini menyatakan keinginan yang kuat. “Kiranya” mempertahankan nuansa harapan tanpa memakai ungkapan yang usang atau terlalu panjang.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: mau bersabar terhadap / bersabarlah terhadap
  rationale: Dalam konteks ini ἀνέχομαι berarti dengan sabar menanggung atau menerima seseorang. “Bersabar terhadap” alami dalam bahasa Indonesia dan menghindari kesan penderitaan berat yang dapat timbul dari “menanggung”.
- source_word: μου
  choice: kebodohanku / terhadapku
  rationale: Pada klausa pertama, hubungan Paulus dengan kebodohan dinyatakan secara alami melalui bentuk posesif; pada klausa kedua, μου menjadi pelengkap idiomatis bagi “bersabarlah terhadap”.
- source_word: μικρόν τι ἀφροσύνης
  choice: sedikit kebodohanku
  rationale: Ungkapan ini menyatakan sejumlah kecil kebodohan sebagai perendahan diri yang retoris. Susunan Indonesia ini ringkas dan mempertahankan kata benda abstrak sumber.
- source_word: ἀλλὰ καὶ
  choice: Namun sungguh
  rationale: Gabungan ini melanjutkan sekaligus menegaskan permohonan Paulus. “Namun sungguh” mempertahankan daya adversatif dan penegasannya.
theological_decisions:
- issue: Paulus menyebut sikapnya sebagai “kebodohan”
  choice: Mempertahankan “kebodohan” sebagai perendahan diri yang retoris
  alternative: Memparafrasakannya sebagai “tindakan yang tampaknya bodoh”
  rationale: Bagian ini mengawali pembicaraan Paulus yang ironis tentang bermegah. Teks tidak dilunakkan agar ketegangan retoris dan teologisnya tetap tampak.
- issue: Bentuk ἀνέχεσθέ pada klausa kedua dapat dipahami sebagai perintah atau pernyataan
  choice: bersabarlah terhadapku
  alternative: kalian memang bersabar terhadapku
  rationale: Bentuk Yunani tersebut secara morfologis dapat dibaca sebagai imperatif atau indikatif. Alur permohonan mendukung imperatif dalam teks utama, tetapi kemungkinan indikatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” menyatakan bentuk orang kedua jamak dalam bahasa Yunani secara jelas. Pengulangan “bersabar terhadap” dipertahankan untuk mencerminkan pengulangan retoris dalam sumber.
