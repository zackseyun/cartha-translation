  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: id
  text: Aku harap kalian mau bersabar terhadapku ketika aku sedikit berlaku bodoh.[a] Namun, memang bersabarlah terhadapku.[b]
  philosophy: optimal-equivalence
  footnotes:
