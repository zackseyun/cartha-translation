    reason: Menjaga kemungkinan bahwa Χριστός dalam konteks ini dapat dipahami sebagai gelar atau sebagai sebutan yang sudah bersifat seperti nama.
  revision_rationale: Revisi memperjelas δόλιοι sebagai karakter yang penuh tipu daya dan merapikan bentuk jamak agar sesuai dengan pemakaian modern Bahasa Indonesia, tanpa mengubah rujukan jamak atau hubungan sintaksis teks Yunani. 'Mesias' dan catatan alternatif 'Kristus' dipertahankan.
