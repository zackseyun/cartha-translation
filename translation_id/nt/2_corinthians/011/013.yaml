reference: 2 Corinthians 11:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: id
  text: Sebab orang-orang seperti itu adalah rasul palsu, pekerja yang penuh tipu daya, yang menyamar sebagai rasul Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rasul Kristus.” Kata Yunani Χριστός adalah gelar yang berarti “Mesias” atau “Yang Diurapi,” tetapi juga dapat digunakan seperti nama dan diterjemahkan “Kristus.”
    reason: Menjaga kemungkinan bahwa Χριστός dalam konteks ini dapat dipahami sebagai gelar atau sebagai sebutan yang sudah bersifat seperti nama.
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” alami dan ringkas dalam konteks argumentatif.
- source_word: οἱ τοιοῦτοι
  choice: orang-orang seperti itu
  rationale: Merujuk kepada golongan tertentu yang baru saja digambarkan, tanpa menambahkan identitas yang tidak dinyatakan dalam teks.
- source_word: ψευδαπόστολοι
  choice: rasul-rasul palsu
  rationale: Menyampaikan makna kata majemuk Yunani, yaitu orang-orang yang secara palsu mengaku atau tampil sebagai rasul.
- source_word: ἐργάται δόλιοι
  choice: pekerja-pekerja licik
  rationale: Mempertahankan gambaran mereka sebagai pekerja yang tindakannya ditandai kelicikan dan tipu daya.
- source_word: μετασχηματιζόμενοι
  choice: yang menyamar
  rationale: Dalam konteks ini partisip tersebut menunjuk pada perubahan penampilan atau pembawaan lahiriah yang menipu, bukan perubahan batin yang sejati.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: sebagai rasul-rasul Mesias
  rationale: Bersama μετασχηματιζόμενοι, εἰς menyatakan peran atau identitas yang mereka kenakan. “Sebagai” merupakan ungkapan Indonesia yang alami, sedangkan “Mesias” mempertahankan nilai gelar Χριστός.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός secara leksikal adalah gelar yang berarti Mesias atau Yang Diurapi. Dalam frasa kepunyaan/perwakilan ini nilai gelarnya tetap dapat didengar, sehingga “Mesias” dipakai; “Kristus” dicatat sebagai padanan tradisional yang juga mungkin.
- issue: Nuansa μετασχηματιζόμενοι
  choice: menyamar sebagai
  alternative: mengubah rupa menjadi
  rationale: Konteks mengecam penampilan diri yang menipu. “Menyamar sebagai” menyatakan perubahan lahiriah tanpa menyiratkan bahwa mereka sungguh-sungguh menjadi rasul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan bentuk jamak dipertahankan agar deretan tuduhan Yunani tetap jelas, sedangkan “menyamar sebagai” dipilih demi kealamian dan ketepatan konteks.
