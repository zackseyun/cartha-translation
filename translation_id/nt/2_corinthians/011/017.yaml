- from: Apa yang kukatakan ini tidak kukatakan menurut Tuhan[a], melainkan seperti dalam kebodohan[b], dengan keyakinan dalam hal bermegah ini.[c]
  to: Apa yang kukatakan, tidak kukatakan menurut Tuhan[a], melainkan seakan-akan dalam kebodohan[b], dalam keyakinan untuk bermegah ini.[c]
  rationale: Revisi ini hanya memperbaiki kelancaran bahasa Indonesia dan memperjelas hubungan sintaksis pada frasa penutup. Ambiguitas κατὰ κύριον dan ὑπόστασις dipertahankan, demikian pula jarak retoris Paulus dari cara berbicara yang bercorak kebodohan.
