  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: id
  text: Apa yang kukatakan, tidak kukatakan menurut Tuhan[a], melainkan seakan-akan dalam kebodohan[b], dalam keyakinan untuk bermegah ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak kukatakan sebagai sesuatu yang berasal dari Tuhan,” atau “berdasarkan patokan Tuhan.”
    reason: alternative_reading
  - marker: b
    text: Atau, “melainkan seperti dalam kebodohan”; secara lebih idiomatis, “melainkan seperti orang bodoh.”
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani yang diterjemahkan “keyakinan” juga dapat berarti “perkara,” “dasar,” atau “upaya” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Apa yang kukatakan ini
  rationale: Ungkapan ini secara alami memperkenalkan isi perkataan Paulus yang sedang berlangsung, sambil mempertahankan penekanan pada apa yang kini ia katakan.
- source_word: κατὰ κύριον
  choice: menurut Tuhan
  rationale: Kata κατά dengan akusatif menyatakan patokan atau kesesuaian. Pilihan ini mempertahankan kemungkinan makna menurut cara, kewibawaan, atau patokan Tuhan tanpa mempersempitnya.
- source_word: κύριον
  choice: Tuhan
  rationale: Dalam konteks ini κύριος paling wajar merujuk kepada Tuhan Yesus; terjemahan tidak menambahkan nama yang tidak disebutkan dalam teks.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: melainkan seperti dalam kebodohan
  rationale: Terjemahan ini mempertahankan unsur perbandingan ὡς dan gambaran berbicara dalam ranah atau cara kebodohan, tanpa langsung menyatakan bahwa Paulus adalah orang bodoh.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: dengan keyakinan ... ini
  rationale: ὑπόστασις dapat menunjuk pada keyakinan, dasar, perkara, atau sikap yang mantap. 'Keyakinan' sesuai dengan konteks keberanian Paulus untuk bermegah, sedangkan catatan kaki mempertahankan pilihan leksikal lainnya.
- source_word: τῆς καυχήσεως
  choice: dalam hal bermegah
  rationale: Ungkapan ini menyatakan bidang atau isi keyakinan tersebut dan mempertahankan daya verbal καύχησις sebagai tindakan bermegah.
theological_decisions:
- issue: Acuan dan daya ungkapan κατὰ κύριον
  choice: Paulus menyatakan bahwa cara bermegah yang segera dipakainya bukanlah menurut patokan atau cara Tuhan.
  alternative: Paulus dapat berarti bahwa perkataan ini bukan kutipan atau perintah langsung dari Tuhan, atau bukan berasal dari Tuhan.
  rationale: Teks Yunani membiarkan hubungan itu terbuka. Terjemahan 'menurut Tuhan' mempertahankan ketegangan tersebut dan tidak mengubah perkataan Paulus menjadi penyangkalan terhadap kebenaran atau ilham perkataannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat. Bentuk orang pertama terikat 'ku-' menjaga kelancaran dan kedekatan retoris Paulus. Susunan kalimat tetap cukup dekat dengan teks Yunani, sementara catatan kaki menampung ambiguitas utama.
