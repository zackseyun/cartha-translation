id: 2CO.11.14
reference: 2 Corinthians 11:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: id
  text: Dan tidak mengherankan, sebab Iblis sendiri menyamar sebagai malaikat terang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengubah rupa menjadi malaikat terang.” Kata Yunani yang digunakan dapat secara lebih harfiah berarti “berubah bentuk,” tetapi dalam konteks ini kemungkinan menunjuk pada penampilan yang menipu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan hubungan dengan ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: οὐ θαῦμα
  choice: tidak mengherankan
  rationale: Ungkapan idiomatis ini berarti bahwa hal tersebut bukan sesuatu yang mengejutkan; pilihan ini alami sekaligus cukup dekat dengan bentuk Yunani.
- source_word: γὰρ
  choice: sebab
  rationale: Menandai alasan yang menjelaskan pernyataan sebelumnya.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: Iblis sendiri
  rationale: Kata αὐτός bersifat intensif dan perlu dinyatakan dengan 'sendiri'. 'Iblis' adalah sebutan baku dan mudah dipahami untuk Satan dalam bahasa Indonesia.
- source_word: μετασχηματίζεται εἰς
  choice: menyamar sebagai
  rationale: Dalam konteks penipuan pada bagian ini, frasa tersebut menunjuk pada perubahan rupa atau penampilan untuk tampil sebagai sesuatu yang lain, bukan dengan sendirinya perubahan hakikat.
- source_word: ἄγγελον φωτός
  choice: malaikat terang
  rationale: Mempertahankan gambaran genitif Yunani secara ringkas dan alami; konteks adikodrati mendukung 'malaikat', bukan sekadar 'utusan'.
theological_decisions:
- issue: Sifat perubahan penampilan Iblis
  choice: Ayat ini menggambarkan penyamaran atau penampilan lahiriah yang menipu.
  alternative: Iblis benar-benar berubah menjadi malaikat terang.
  rationale: Konteks langsung membahas penipuan oleh rasul-rasul palsu, sedangkan μετασχηματίζεται dapat menunjuk pada perubahan bentuk atau penampilan. Terjemahan utama menyampaikan konteks itu, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Tidak mengherankan' dipilih daripada ungkapan yang lebih percakapan, sedangkan 'menyamar sebagai' menjelaskan daya tipu konteks tanpa meniadakan alternatif harfiah yang dicatat dalam catatan kaki.
