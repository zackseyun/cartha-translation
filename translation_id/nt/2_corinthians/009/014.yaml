id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: id
  text: dan dalam doa mereka untuk kalian[a], mereka merindukan kalian karena anugerah Allah yang luar biasa pada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan dalam doa permohonan mereka untuk kalian, sambil merindukan kalian.”
    reason: Menampilkan padanan lebih khusus bagi δέησις serta mempertahankan bentuk partisipel dan kepadatan sintaksis bahasa Yunani.
lexical_decisions:
- source_word: δέησις
  choice: doa
  rationale: Dalam konteks ini δεήσει menunjuk pada doa permohonan atau syafaat. 'Doa' merupakan padanan alami dan luas dalam bahasa Indonesia modern, sedangkan nuansa permohonan dicatat dalam catatan kaki.
- source_word: αὐτῶν
  choice: mereka
  rationale: Genitif jamak ini merujuk pada para penerima bantuan dan berfungsi posesif dalam frasa 'doa mereka'.
- source_word: ὑπὲρ ὑμῶν
  choice: untuk kalian
  rationale: ὑπέρ dengan genitif dalam konteks doa berarti 'untuk' atau 'demi'; 'untuk kalian' paling alami dan jelas.
- source_word: ἐπιποθούντων
  choice: mereka merindukan
  rationale: Partisipel kini ini mengungkapkan kerinduan yang mendalam dan berkelanjutan. Klausa finit membuat susunan yang padat dalam bahasa Yunani menjadi jelas dalam bahasa Indonesia.
- source_word: διὰ
  choice: karena
  rationale: 'διά dengan akusatif menyatakan alasan: kerinduan mereka timbul karena anugerah Allah atas jemaat Korintus.'
- source_word: ὑπερβάλλουσαν
  choice: begitu melimpah
  rationale: Kata ini menyatakan sesuatu yang melampaui ukuran biasa. 'Begitu melimpah' alami dalam bahasa Indonesia serta mempertahankan daya intensifnya.
- source_word: χάριν
  choice: anugerah
  rationale: χάρις di sini menunjuk pada kemurahan Allah yang bekerja dalam diri mereka; 'anugerah' mempertahankan bobot teologis Paulus tanpa mempersempitnya menjadi pemberian materi saja.
- source_word: ἐφ’ ὑμῖν
  choice: atas kalian
  rationale: ἐπί dengan datif dapat berarti 'atas' atau, secara lebih luas, 'pada/di antara'. 'Atas kalian' mempertahankan gambaran anugerah yang tercurah atau berada atas mereka.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini mengaitkan ayat dengan rangkaian pemikiran sebelumnya; 'dan' mempertahankan hubungan tersebut.
theological_decisions:
- issue: Hubungan antara doa dan kerinduan dalam sintaksis
  choice: Ayat ini menggambarkan para penerima bantuan yang berdoa untuk jemaat Korintus dan merindukan mereka karena anugerah Allah atas mereka.
  alternative: Frasa tersebut dapat dipahami lebih harfiah sebagai 'dan melalui permohonan mereka untuk kalian, sambil merindukan kalian', dengan doa sebagai sarana pengungkapan kerinduan.
  rationale: 'Bahasa Yunani padat: partisipel genitif ἐπιποθούντων berkaitan dengan αὐτῶν. Terjemahan memakai dua klausa agar kedua tindakan tetap tampak tanpa menetapkan hubungan logis yang lebih rinci daripada teks.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'kalian' dipakai karena semua pronomina orang kedua dalam ayat ini berbentuk jamak. Struktur dibuka dengan huruf kecil karena καὶ menghubungkan ayat ini langsung dengan kalimat sebelumnya.
