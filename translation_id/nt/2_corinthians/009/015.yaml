  text: Thanks be to God for his indescribable gift[a].
translation:
  language: id
  text: Syukur kepada Allah atas karunia-Nya yang tak terungkapkan[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tak terkatakan.” Kata sifat Yunani ini dapat menunjuk pada sesuatu yang tidak dapat diuraikan atau diceritakan sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Syukur
  rationale: Dalam ungkapan seruan dengan datif τῷ θεῷ, kata ini menyatakan ucapan syukur atau pujian, bukan terutama konsep 'anugerah'.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Bentuk datif menunjukkan pihak yang menerima ucapan syukur; 'kepada Allah' wajar dan tepat dalam bahasa Indonesia.
- source_word: ἐπὶ
  choice: atas
  rationale: Dengan bentuk datif, preposisi ini menyatakan dasar atau alasan ucapan syukur. 'Atas' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: ἀνεκδιηγήτῳ
  choice: yang tak terlukiskan
  rationale: Kata sifat ini menunjuk pada sesuatu yang tidak dapat diceritakan atau diuraikan sepenuhnya. Pilihan ini jelas, modern, dan mempertahankan gagasan bahwa karunia itu melampaui kemampuan bahasa.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Kata ganti ini secara paling alami merujuk kepada Allah. Bentuk '-Nya' mempertahankan rujukan pronominal Yunani tanpa mengulang nama Allah.
- source_word: δωρεᾷ
  choice: karunia
  rationale: δωρεά berarti pemberian yang diberikan dengan cuma-cuma. 'Karunia' alami dalam konteks ucapan syukur kepada Allah dan tidak perlu ditambah kata 'cuma-cuma'.
theological_decisions:
- issue: Rujukan 'karunia-Nya yang tak terlukiskan'
  choice: Dibiarkan tersirat sebagai karunia Allah tanpa menentukan secara khusus apa karunia itu.
  alternative: Menafsirkannya secara khusus sebagai Kristus, keselamatan dalam Kristus, atau karya anugerah Allah yang mencakup kemurahan hati jemaat Korintus.
  rationale: Ayat ini sendiri hanya menyebut 'karunia-Nya', sedangkan konteks dekat membahas anugerah Allah yang menghasilkan kemurahan hati. Membiarkan rujukannya terbuka mempertahankan keluasan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada pujian. Tanda seru mencerminkan daya seruan doksologis dalam ungkapan Yunani. Bentuk 'karunia-Nya' tetap cukup umum agar rujukan teologisnya tidak dipersempit.
