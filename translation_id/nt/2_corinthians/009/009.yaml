  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: id
  text: 'seperti yang tertulis:


    “Ia membagi-bagikan, Ia memberi kepada orang-orang miskin;

    kebenarannya[a] tetap untuk selama-lamanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilannya”. Kata Yunani ini dapat berarti kebenaran atau keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: seperti yang tertulis
  rationale: Rumus kutipan Kitab Suci yang baku, alami, dan tetap mempertahankan nuansa formal.
- source_word: Ἐσκόρπισεν
  choice: Ia membagi-bagikan pemberiannya dengan murah hati
  rationale: Secara harfiah berarti 'ia menyebarkan'. Dalam konteks pemberian kepada orang miskin, ungkapan ini menggambarkan pembagian yang luas dan murah hati; penambahan 'pemberiannya' memperjelas objek tersirat tanpa menghilangkan citra dasarnya.
- source_word: ἔδωκεν τοῖς πένησιν
  choice: kepada orang-orang miskin
  rationale: Bersama verba sebelumnya membentuk gambaran paralel tentang pemberian kepada mereka yang berkekurangan; 'orang-orang miskin' merupakan padanan langsung dan wajar untuk πένησιν.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: kebenarannya
  rationale: Dalam bahasa Indonesia Alkitabiah, 'kebenaran' dapat menunjuk pada sifat atau tindakan yang benar. Namun, karena δικαιοσύνη di sini juga dapat bernuansa keadilan atau kebajikan, kemungkinan tersebut dipertahankan dalam catatan kaki.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: tetap untuk selama-lamanya
  rationale: '''Tetap'' menyampaikan makna μένει, sedangkan ''untuk selama-lamanya'' merupakan padanan Indonesia yang alami bagi εἰς τὸν αἰῶνα.'
theological_decisions:
- issue: Makna δικαιοσύνη dalam kutipan Mazmur pada konteks Paulus
  choice: kebenarannya
  alternative: keadilannya; kebajikannya
  rationale: Terjemahan utama mempertahankan kesinambungan istilah teologis δικαιοσύνη tanpa membatasi maknanya hanya pada status atau hanya pada tindakan. Catatan kaki menjaga nuansa etis berupa keadilan dan kebajikan dermawan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Susunan puitis dipertahankan sebagai kutipan Kitab Suci, dengan ungkapan idiomatis yang menjelaskan citra 'menyebarkan' sebagai pemberian yang dibagikan secara luas.
