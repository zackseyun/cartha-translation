  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: id
  text: Melalui bukti yang diberikan oleh pelayanan ini, mereka memuliakan Allah atas ketaatan yang nyata dalam pengakuan kalian akan Injil Mesias[a], dan atas kemurahan hati kalian dalam berbagi kepada mereka dan kepada semua orang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Injil tentang Mesias” atau “Injil Kristus.” Kata Yunani Χριστός adalah gelar yang berarti “Mesias”; bentuk genitifnya dapat menunjuk pada Injil tentang Mesias atau Injil yang berasal dari-Nya.
    reason: alternative_reading
  - marker: b
    text: “Berbagi” di sini terutama menunjuk pada keikutsertaan nyata melalui pemberian bantuan, bukan hanya persekutuan dalam arti umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς τῆς διακονίας ταύτης
  choice: pelayanan ini telah terbukti melalui ujian
  rationale: δοκιμή dapat menunjuk pada ujian maupun bukti atau mutu yang dihasilkan olehnya. Ungkapan ini mempertahankan kedua sisi tersebut dan mengaitkannya dengan pelayanan pengumpulan bantuan.
- source_word: δοξάζοντες τὸν θεόν
  choice: mereka memuliakan Allah
  rationale: Partisipel Yunani dibuat menjadi verba berpelaku eksplisit agar kalimat alami dalam bahasa Indonesia; 'memuliakan' dekat dengan makna δοξάζω.
- source_word: τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: atas ketaatan yang nyata dalam pengakuan kalian
  rationale: Genitif Yunani dapat dipahami sebagai ketaatan yang menjadi ciri atau terwujud dalam pengakuan mereka. Rumusan ini alami tanpa menghilangkan hubungan erat antara pengakuan dan ketaatan.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: kepada Injil tentang Mesias
  rationale: εἰς menyatakan arah atau hubungan ketaatan kepada Injil. Genitif τοῦ Χριστοῦ dapat bersifat objektif atau berkenaan dengan isi; 'tentang Mesias' alami dalam bahasa Indonesia, sementara alternatif tradisional dicatat.
- source_word: ἁπλότητι τῆς κοινωνίας
  choice: kemurahan hati kalian dalam berbagi
  rationale: Dalam konteks pengumpulan bantuan, ἁπλότης menunjuk pada kemurahan hati, sedangkan κοινωνία adalah partisipasi nyata melalui pemberian, bukan sekadar persekutuan umum.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: dengan mereka dan dengan semua orang
  rationale: Dengan 'berbagi', preposisi 'dengan' paling alami untuk menyatakan pihak-pihak yang menerima manfaat atau turut mengambil bagian.
theological_decisions:
- issue: Makna Χριστοῦ dalam εὐαγγέλιον τοῦ Χριστοῦ
  choice: Injil tentang Mesias
  alternative: Injil Mesias; Injil Kristus
  rationale: Χριστός diterjemahkan sebagai gelar 'Mesias'. Genitif dapat menyatakan Injil yang berasal dari atau milik Mesias, maupun Injil yang memberitakan Mesias; catatan kaki mempertahankan kemungkinan ini.
- issue: Hubungan ὑποταγή dengan ὁμολογία
  choice: ketaatan yang nyata dalam pengakuan kalian
  alternative: ketundukan pengakuan kalian
  rationale: Konstruksi genitif padat dan secara harfiah terdengar janggal dalam bahasa Indonesia. Terjemahan utama menyatakan bahwa ketaatan terwujud dalam pengakuan tanpa menentukan secara berlebihan hubungan gramatikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῶν secara jelas. Struktur kalimat panjang Paulus dipertahankan, tetapi hubungan antargagasan dibuat alami dalam bahasa Indonesia.
