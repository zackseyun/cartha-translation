  to: Melalui bukti yang diberikan oleh pelayanan ini, mereka memuliakan Allah atas ketaatan yang nyata dalam pengakuan kalian akan Injil Mesias[a], dan atas kemurahan hati kalian dalam berbagi kepada mereka dan kepada semua orang[b].
