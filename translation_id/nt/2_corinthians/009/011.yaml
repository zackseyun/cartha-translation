- from: Dalam segala hal kamu diperkaya untuk menunjukkan segala kemurahan hati[a], yang melalui kami menghasilkan ucapan syukur kepada Allah—
  to: Dalam segala hal kamu diperkaya agar kamu dapat bermurah hati dengan segala cara, yang melalui kami menghasilkan ucapan syukur kepada Allah—
  rationale: Revisi menerjemahkan εἰς sebagai tujuan dengan “agar kamu dapat” tanpa menambahkan gagasan ‘menunjukkan.’ Ungkapan “bermurah hati dengan segala cara” menyampaikan πᾶσαν ἁπλότητα secara idiomatis dan tetap mempertahankan penekanan konteks pada kemurahan hati dalam memberi. Klausa relatif tetap mengacu kepada kemurahan hati tersebut, dan tanda pisah dipertahankan karena kalimat berlanjut.
