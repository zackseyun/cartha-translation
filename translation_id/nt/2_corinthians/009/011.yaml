  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: id
  text: Dalam segala hal kamu diperkaya agar kamu dapat bermurah hati dengan segala cara, yang melalui kami menghasilkan ucapan syukur kepada Allah—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: Dalam segala hal
  rationale: Ungkapan ini menyampaikan cakupan yang menyeluruh secara wajar dalam bahasa Indonesia dan sesuai dengan konteks bahwa Allah menyediakan segala sesuatu yang diperlukan untuk memberi.
- source_word: πλουτιζόμενοι
  choice: kamu diperkaya
  rationale: Bentuk pasif kini dipertahankan; Allah tetap tersirat sebagai pelaku, tanpa memberi kesan bahwa kekayaan materi merupakan tujuan pada dirinya sendiri.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: untuk menunjukkan segala kemurahan hati
  rationale: εἰς menyatakan tujuan atau hasil, sedangkan ἁπλότης dalam konteks pengumpulan pemberian menunjuk pada kemurahan hati yang nyata. Penambahan 'menunjukkan' membuat hubungan tujuan itu alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: ἥτις
  choice: yang
  rationale: Kata ganti relatif ini mengacu pada kemurahan hati yang baru disebutkan dan memperkenalkan dampaknya.
- source_word: κατεργάζεται
  choice: menghasilkan
  rationale: Kata kerja ini menyatakan bahwa sesuatu menimbulkan atau mewujudkan suatu hasil.
- source_word: δι’ ἡμῶν
  choice: melalui kami
  rationale: Terjemahan ini mempertahankan fungsi perantaraan Paulus dan rekan-rekannya dalam menyalurkan pemberian tanpa memperjelasnya melampaui teks.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: ucapan syukur kepada Allah
  rationale: Frasa nominal Yunani dipertahankan secara alami dan jelas sebagai tanggapan yang ditujukan kepada Allah.
theological_decisions:
- issue: Makna ἁπλότης dalam konteks pengumpulan pemberian
  choice: kemurahan hati dalam memberi
  alternative: kesederhanaan, ketulusan, atau kebulatan hati
  rationale: Walaupun ἁπλότης dapat berarti kesederhanaan atau ketulusan dalam konteks lain, pembicaraan tentang penyediaan materi, pemberian, dan ucapan syukur di sini paling kuat mendukung makna kemurahan hati. Catatan kaki tetap mengakui rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur partisipial Yunani dijadikan klausa dengan subjek tersurat 'kamu' agar alami dalam bahasa Indonesia; tanda pisah dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
