  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: id
  text: Dia yang menyediakan benih bagi penabur dan roti sebagai makanan akan menyediakan dan melipatgandakan benih kalian serta meningkatkan hasil kebenaran kalian[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperbanyak buah/hasil dari kebenaran kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hasil keadilan kalian.” Kata Yunani δικαιοσύνη dapat berarti “kebenaran” atau, dalam konteks tertentu, “keadilan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: yang menyediakan
  rationale: Partisipel substantival dengan artikel ὁ diterjemahkan secara alami sebagai “Dia yang menyediakan.” Kata ini menyatakan pemberian atau penyediaan, dengan kemungkinan nuansa kemurahan hati tanpa harus menambah kata yang tidak tersurat.
- source_word: σπόρον
  choice: benih
  rationale: Makna pertanian yang biasa; mempertahankan gambaran menabur dan kaitannya dengan kemampuan untuk bermurah hati.
- source_word: τῷ σπείροντι
  choice: bagi penabur
  rationale: Partisipel substantival ini menunjuk kepada orang yang menabur; “penabur” ringkas dan alami.
- source_word: ἄρτον εἰς βρῶσιν
  choice: roti untuk dimakan
  rationale: Mengungkapkan tujuan secara alami serta mempertahankan perbedaan antara benih untuk ditabur dan roti untuk dikonsumsi.
- source_word: χορηγήσει
  choice: akan menyediakan
  rationale: Bentuk masa depan ini mempertahankan hubungan makna dengan ἐπιχορηγῶν dan menyatakan tindakan penyediaan.
- source_word: πληθυνεῖ
  choice: melipatgandakan
  rationale: Menyatakan membuat sesuatu menjadi banyak atau berlimpah dan cocok dengan gambaran benih.
- source_word: τὸν σπόρον ὑμῶν
  choice: benih kalian
  rationale: Terjemahan langsung mempertahankan tumpang tindih metaforis antara persediaan materi dan kemampuan jemaat untuk memberi; “kalian” menyatakan bahwa ὑμῶν berbentuk jamak.
- source_word: αὐξήσει
  choice: memperbesar
  rationale: Menyatakan pertumbuhan atau peningkatan dan berpadu secara alami dengan “hasil.”
- source_word: τὰ γενήματα
  choice: hasil
  rationale: Kata ini menunjuk pada hasil bumi, panen, atau buah. “Hasil” alami dalam bahasa Indonesia dan tetap cukup luas untuk mencakup akibat atau buah dari kemurahan hati.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: “Kebenaran” mempertahankan istilah teologis Paulus dan keluasan maknanya. Kemungkinan arti “keadilan” dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna “hasil kebenaran kalian”
  choice: Metafora bagi buah atau akibat yang timbul dari kemurahan hati mereka yang benar, tanpa membatasinya pada keuntungan materi atau status forensik.
  alternative: Berkat materi sebagai hasil kemurahan hati; buah kesetiaan atau keadilan; bukti perilaku benar.
  rationale: Konteksnya membahas pemberian yang murah hati dengan memakai gambaran pertanian. Terjemahan mempertahankan keluasan dan ketegangan teologis ungkapan itu, bukan mempersempitnya menjadi ajaran kemakmuran, keadilan sosial saja, atau status kebenaran saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. “Kalian” dipakai untuk menyatakan secara jelas bentuk jamak ὑμῶν. Tidak ditambahkan penanda waktu seperti “sekarang”; δέ tidak perlu dinyatakan dengan penghubung tersendiri dalam kalimat Indonesia ini.
