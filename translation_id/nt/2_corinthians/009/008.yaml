  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: id
  text: Dan Allah sanggup melimpahkan segala anugerah kepada kamu, supaya dalam segala hal dan setiap saat kamu memiliki segala kecukupan[a] dan dapat berlimpah-limpah dalam setiap pekerjaan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala yang diperlukan.” Istilah Yunani ini dapat berarti kecukupan, keadaan memadai, atau rasa cukup. Di sini maksudnya ialah pemeliharaan yang memadai dari Allah, bukan kemampuan untuk mencukupi diri sendiri tanpa bergantung kepada-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: sanggup
  rationale: Bentuk kini ini menyatakan kemampuan atau kuasa Allah. “Sanggup” alami dalam bahasa Indonesia dan mempertahankan penekanan pada kemampuan ilahi.
- source_word: δὲ
  choice: Dan
  rationale: Di sini δέ bersifat penghubung ringan, bukan pertentangan kuat, sehingga “Dan” sesuai dengan alur dari ayat sebelumnya.
- source_word: πᾶσαν χάριν
  choice: segala anugerah
  rationale: χάρις dalam konteks ini mencakup kemurahan dan pemeliharaan Allah yang memampukan umat-Nya bermurah hati. “Segala anugerah” mempertahankan keluasan istilah dan penekanan πᾶσαν.
- source_word: περισσεῦσαι
  choice: melimpahkan
  rationale: Infinitif ini menyatakan bahwa Allah menyebabkan anugerah berlimpah kepada para penerima. “Melimpahkan” menyampaikan nuansa kausatif itu secara alami.
- source_word: εἰς ὑμᾶς
  choice: kepada kamu
  rationale: εἰς menunjukkan arah anugerah Allah kepada jemaat. “Kepada kamu” merupakan ungkapan Indonesia yang wajar.
- source_word: ἵνα
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil yang dimaksudkan; “supaya” mempertahankan daya teleologisnya.
- source_word: ἐν παντὶ πάντοτε
  choice: dalam segala hal dan setiap saat
  rationale: Terjemahan ini menyatakan kedua unsur secara eksplisit dan mempertahankan penumpukan kata berunsur παν- yang menekankan keluasan.
- source_word: πᾶσαν αὐτάρκειαν
  choice: segala kecukupan
  rationale: αὐτάρκεια dapat berarti kecukupan, kemampuan memenuhi kebutuhan, atau rasa cukup. Dalam konteks ini, frasa tersebut menunjuk pada pemeliharaan memadai dari Allah, bukan kemandirian mutlak.
- source_word: ἔχοντες
  choice: dengan memiliki
  rationale: Partisipel ini berlangsung bersamaan dengan kata kerja utama. “Dengan memiliki” mempertahankan hubungan bahwa mereka berkelimpahan dalam pekerjaan baik sementara berkecukupan.
- source_word: περισσεύητε
  choice: kamu berkelimpahan
  rationale: Pilihan ini melanjutkan motif kelimpahan dari περισσεῦσαι dan menjaga kesejajaran retoris ayat tersebut.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: dalam setiap pekerjaan baik
  rationale: Sesudah “berkelimpahan”, preposisi εἰς secara wajar dinyatakan dengan “dalam”; frasa ini mencakup setiap tindakan yang baik dan bermanfaat.
theological_decisions:
- issue: Makna χάρις dalam konteks kemurahan hati
  choice: anugerah sebagai pemeliharaan Allah yang luas, termasuk kemampuan material untuk bermurah hati
  alternative: sekadar perkenanan; pemberian material saja
  rationale: Konteksnya membahas pemberian, tetapi χάρις tetap lebih luas daripada uang. “Segala anugerah” tidak mempersempit tindakan Allah menjadi persediaan material semata.
- issue: Makna αὐτάρκεια
  choice: kecukupan atau keadaan mempunyai yang diperlukan karena pemeliharaan Allah
  alternative: rasa puas; kemandirian atau swasembada
  rationale: Konteks menampilkan Allah sebagai sumber yang mencukupi agar orang percaya dapat bermurah hati. Pilihan ini menghindari gagasan bahwa mereka tidak bergantung pada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Pengulangan “segala/setiap” dan motif “melimpahkan/berkelimpahan” dipertahankan untuk mencerminkan tekanan retoris teks Yunani.
