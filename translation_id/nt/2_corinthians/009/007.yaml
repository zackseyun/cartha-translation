  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: id
  text: Hendaklah masing-masing memberi sesuai dengan apa yang telah diputuskannya dalam hati, bukan dengan berat hati[a] atau karena terpaksa, sebab Allah mengasihi orang yang memberi dengan sukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bukan dari kesedihan” atau “bukan dari dukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Mempertahankan fokus distributif pada setiap individu tanpa menyiratkan bahwa yang dimaksud hanya laki-laki.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: sesuai dengan apa yang telah diputuskannya dalam hati
  rationale: Menyatakan keputusan pribadi yang telah dibuat dengan sengaja, sekaligus mempertahankan istilah antropologis Alkitabiah 'hati'.
- source_word: μὴ ἐκ λύπης
  choice: bukan dengan berat hati[a]
  rationale: Ungkapan ini menyampaikan secara alami maksud kontekstual bahwa pemberian tidak dilakukan dengan rasa sedih atau penyesalan; arti harfiah λύπη dicatat dalam catatan kaki.
- source_word: ἢ ἐξ ἀνάγκης
  choice: atau karena terpaksa
  rationale: Menangkap gagasan tekanan, keharusan, atau paksaan dalam konteks memberi dan merupakan ungkapan Indonesia yang wajar.
- source_word: ἱλαρὸν ... δότην
  choice: orang yang memberi dengan sukacita
  rationale: Menyampaikan watak gembira dan rela dari si pemberi dalam bahasa Indonesia yang alami; 'dengan sukacita' mempertahankan nuansa positif yang kuat dari ἱλαρός.
- source_word: ἀγαπᾷ ὁ θεός
  choice: Allah mengasihi
  rationale: Mempertahankan makna langsung verba ἀγαπάω dan susunan klausa yang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tunggal representatif
  choice: masing-masing ... diputuskannya
  alternative: setiap orang ... mereka putuskan
  rationale: Bahasa Indonesia memungkinkan bentuk tunggal yang inklusif tanpa memasukkan rujukan khusus kepada laki-laki; bentuk '-nya' menjaga fokus individual teks Yunani.
- issue: Makna λύπη dalam konteks pemberian
  choice: bukan dengan berat hati[a]
  alternative: bukan karena dukacita
  rationale: Terjemahan utama memakai ungkapan Indonesia yang alami untuk keengganan yang disertai kesedihan atau penyesalan, sedangkan arti leksikal harfiahnya dipertahankan dalam catatan kaki agar ketegangan makna tidak hilang.
- issue: Verba memberi yang tersirat
  choice: Hendaklah ... memberi
  alternative: Masing-masing, sesuai dengan apa yang telah diputuskannya dalam hati
  rationale: Teks Yunani tidak mengulang verba 'memberi', tetapi konteks langsung dan sebutan 'pemberi' membuatnya tersirat. Penambahannya diperlukan agar kalimat Indonesia lengkap dan jelas tanpa mengubah maksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan fokus pada keputusan pribadi dalam hati, menghindari bentuk yang eksklusif gender, serta memakai ungkapan yang lazim dipahami untuk pemberian yang tidak dilakukan dengan enggan.
