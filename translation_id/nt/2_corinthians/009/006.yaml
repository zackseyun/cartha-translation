    rationale: Bahasa Indonesia biasanya memahami “menabur berkat” sebagai menyebarkan berkat kepada orang lain, bukan sebagai menabur secara murah hati atau berlimpah. Terjemahan ini karena itu tidak menyampaikan perbandingan takaran dalam peribahasa secara cukup jelas.
  - severity: low
    issue: “Perhatikanlah ini” menambahkan seruan imperatif.
    rationale: Τοῦτο δέ memperkenalkan atau menandai pokok yang ditekankan, tetapi bukan perintah kepada pembaca. Pengantar deklaratif mempertahankan fungsi wacananya tanpa tambahan pragmatis.
