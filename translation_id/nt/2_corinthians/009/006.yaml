  rationale: Revisi menghilangkan imperatif yang tidak tersurat dan mengganti kolokasi yang tidak wajar “menabur berkat” dengan padanan idiomatis yang menyampaikan makna kontekstual εὐλογίαις. Catatan kaki mempertahankan informasi bahwa kata Yunani yang mendasarinya adalah “berkat-berkat,” sehingga resonansi leksikalnya tetap tersedia tanpa menghasilkan bahasa Indonesia yang rancu.
