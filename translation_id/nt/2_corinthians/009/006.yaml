base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: id
  text: 'Inilah maksudnya: Siapa yang menabur sedikit akan menuai sedikit juga, dan siapa yang menabur dengan murah hati akan menuai dengan murah hati juga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan berlimpah.” Secara harfiah, frasa Yunani ini memakai kata “berkat-berkat”; dalam konteks memberi, ungkapan itu dapat menyatakan kemurahan hati atau kelimpahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Perhatikanlah ini:'
  rationale: Ungkapan ini memperkenalkan prinsip yang hendak ditekankan. Bentuk imperatif merupakan padanan wacana yang alami dalam bahasa Indonesia, tanpa memaksakan δέ menjadi pertentangan yang kuat.
- source_word: ὁ σπείρων
  choice: orang yang menabur
  rationale: Partisipel bersubstantiva ini bersifat umum dan bernada peribahasa; bentuk ini mempertahankan gambaran tindakan menabur.
- source_word: φειδομένως
  choice: sedikit
  rationale: Dalam peribahasa tentang menabur dan memberi, kata ini menunjukkan takaran yang terbatas. 'Sedikit' alami dan mempertahankan kesejajaran dengan hasil tuaian tanpa menambahkan kecaman moral seperti 'dengan kikir'.
- source_word: καὶ θερίσει
  choice: akan menuai ... juga
  rationale: Susunan ini menyatakan hasil yang sepadan dengan cara menabur serta mempertahankan fungsi καί.
- source_word: ἐπ’ εὐλογίαις
  choice: menabur berkat ... menuai berkat
  rationale: εὐλογία secara leksikal berarti 'berkat' dan di sini juga mengandung makna pemberian yang murah hati. Ungkapan Indonesia ini mempertahankan pengulangan dan permainan kata Paulus, sedangkan catatan kaki menjelaskan makna idiomatisnya.
theological_decisions:
- issue: Makna εὐλογίαις dalam peribahasa menabur dan menuai
  choice: Mempertahankan kata benda 'berkat' dalam kedua anak kalimat.
  alternative: dengan murah hati; dengan limpah
  rationale: Konteks mendukung makna kemurahan hati atau kelimpahan, tetapi penggunaan 'berkat' mempertahankan kaitan leksikal dan teologis dalam bahasa Yunani. Ayat ini tetap menyatakan kesepadanan secara peribahasa, bukan jaminan mekanis akan kekayaan materi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bernada khidmat. 'Perhatikanlah ini' menghindari pembukaan yang kaku, sedangkan 'menabur berkat ... menuai berkat' mempertahankan pengulangan sumber meski makna idiomatisnya dijelaskan dalam catatan kaki.
