base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: id
  text: Sebab, mengenai pelayanan bagi orang-orang kudus[a], tidak perlu aku menulis kepada kalian,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada orang-orang kudus.” Kata depan Yunani di sini dapat menunjukkan arah pelayanan atau pihak yang menerima manfaatnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Mengenai ... sebenarnya
  rationale: Περὶ memperkenalkan pokok bahasan, sedangkan μὲν γὰρ menghubungkannya dengan konteks sebelumnya. Susunan ini menyampaikan peralihan dan nuansa penjelasan secara wajar dalam bahasa Indonesia tanpa menerjemahkan setiap partikel secara kaku.
- source_word: διακονίας
  choice: pelayanan
  rationale: διακονία menunjuk pada pelayanan praktis berupa pengumpulan bantuan. 'Pelayanan' mempertahankan cara Paulus memberi martabat rohani pada bantuan tersebut tanpa mempersempitnya menjadi sekadar 'sumbangan'.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: bagi orang-orang kudus
  rationale: εἰς dalam konteks ini dapat menandai penerima manfaat atau arah pelayanan. 'Bagi' paling alami dalam bahasa Indonesia, sementara kemungkinan 'kepada' dipertahankan dalam catatan kaki.
- source_word: ἁγίους
  choice: orang-orang kudus
  rationale: ἅγιοι adalah sebutan Paulus bagi umat yang dikhususkan bagi Allah. 'Orang-orang kudus' merupakan padanan yang ringkas, dikenal luas, dan tidak menghapus muatan kekudusannya.
- source_word: περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: sebenarnya tidak perlu aku menulis kepada kalian
  rationale: περισσόν di sini menyatakan bahwa tindakan menulis itu berlebih atau tidak diperlukan. 'Tidak perlu' lebih alami dan mudah dipahami daripada 'berlebihan' dalam konstruksi bahasa Indonesia ini; 'sebenarnya' membantu menyampaikan daya retoris pernyataan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku' dan 'kalian' dipakai agar hubungan penulis dengan para penerima tetap langsung dan jelas. Tanda koma pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
