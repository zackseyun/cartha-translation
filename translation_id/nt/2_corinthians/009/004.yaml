  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: id
  text: Jangan sampai, jika beberapa orang Makedonia datang bersama saya dan mendapati kalian belum siap, kami—belum lagi kalian[b]—dipermalukan dalam hal keyakinan ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam keyakinan ini.” Kata Yunani yang dipakai juga dapat berarti “usaha” atau “keadaan” dalam konteks ini, tetapi kemungkinan besar menunjuk pada keyakinan Paulus mengenai mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak usah disebut kalian.” Paulus secara tersirat menunjukkan bahwa jemaat Korintus juga akan turut menanggung malu jika didapati belum siap.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Jangan sampai, jika
  rationale: Ungkapan ini menyatakan kekhawatiran Paulus terhadap suatu kemungkinan pada masa mendatang, sambil mempertahankan unsur kondisional ἐάν.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: beberapa orang Makedonia datang bersama saya
  rationale: Μακεδόνες tanpa artikel bersifat tidak tentu; 'beberapa orang Makedonia' alami dalam bahasa Indonesia dan tidak menunjuk kelompok tertentu.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: mendapati kalian belum siap
  rationale: ἀπαρασκευάστους berarti tidak atau belum dipersiapkan; 'belum siap' jelas dan wajar dalam konteks pengumpulan bantuan.
- source_word: καταισχυνθῶμεν
  choice: kami ... dipermalukan
  rationale: Bentuk pasifnya menunjuk pada rasa malu atau aib di hadapan orang lain, bukan hanya perasaan malu dalam batin.
- source_word: ἡμεῖς
  choice: kami
  rationale: Pronomina eksplisit ini bersifat emfatis; penempatannya sebelum sisipan bertanda pisah mempertahankan penekanan tersebut.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: belum lagi kalian
  rationale: Sisipan ini menghaluskan ucapan Paulus sekaligus menyiratkan bahwa jemaat Korintus juga akan menanggung malu.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: karena keyakinan ini
  rationale: Dalam konteks ini ὑπόστασις paling mungkin menunjuk pada keyakinan Paulus mengenai kesiapan jemaat; preposisi ἐν menyatakan lingkup atau dasar rasa malu tersebut.
theological_decisions:
- issue: Makna ὑπόστασις dalam konteks Paulus yang nonteknis
  choice: keyakinan
  alternative: usaha ini; keadaan ini
  rationale: Konteks langsung membahas keyakinan Paulus bahwa jemaat telah siap. Pilihan ini menghindari pemuatan arti filosofis atau teologis yang muncul dalam konteks lain, sambil mencatat kemungkinan leksikal lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. 'Saya/kami' dan 'kalian' membedakan bentuk tunggal serta jamak dalam teks Yunani. Tanda pisah mempertahankan sisipan retoris Paulus. Penanda catatan kaki ditempatkan langsung pada ungkapan yang dijelaskannya.
