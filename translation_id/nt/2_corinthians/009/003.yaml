  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: id
  text: Namun, aku mengutus saudara-saudara itu supaya apa yang kami banggakan tentang kalian tidak menjadi sia-sia dalam hal ini, supaya kalian siap, seperti yang selalu kukatakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: aku telah mengutus
  rationale: Aoristus dapat menunjuk pada tindakan pengutusan yang telah dilakukan dan masih relevan bagi pembaca; bentuk ini wajar dalam konteks penjelasan Paulus.
- source_word: τοὺς ἀδελφούς
  choice: saudara-saudara itu
  rationale: Bentuk maskulin jamak ini merujuk pada para utusan laki-laki tertentu dalam konteks; kata penentu 'itu' menandai bahwa mereka sudah dikenal.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: kebanggaan kami tentang kalian
  rationale: καύχημα menyatakan kebanggaan atau dasar untuk berbangga; 'tentang kalian' menerjemahkan ὑπὲρ ὑμῶν secara alami tanpa melemahkannya menjadi sekadar keyakinan.
- source_word: κενωθῇ
  choice: tidak menjadi sia-sia
  rationale: Dalam konteks ini verba pasif tersebut berarti dibuat kosong atau terbukti tanpa dasar; 'menjadi sia-sia' menyampaikan maksudnya secara alami dalam bahasa Indonesia.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: dalam hal ini
  rationale: μέρος dipakai secara idiomatis untuk suatu segi atau perkara tertentu, bukan bagian fisik.
- source_word: καθὼς ἔλεγον
  choice: seperti yang selama ini kukatakan
  rationale: Imperfek ἔλεγον menyiratkan perkataan yang berlangsung atau berulang; 'selama ini' menjaga nuansa tersebut.
- source_word: παρεσκευασμένοι ἦτε
  choice: kalian sudah siap
  rationale: Konstruksi perifrastik ini menekankan keadaan siap sebagai hasil yang diharapkan ketika para utusan tiba; 'sudah siap' alami dan mempertahankan aspek keadaan yang telah tercapai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'aku/kalian' dipakai untuk mempertahankan komunikasi pribadi Paulus kepada jemaat. Dua klausa tujuan dirangkai dengan 'dan supaya' agar hubungan sintaksisnya jelas dan alami.
