    rationale: τὰ ὑστερήματα τῶν ἁγίων secara alami dinyatakan sebagai “kekurangan orang-orang kudus”; maknanya tetap mencakup kebutuhan yang belum terpenuhi.
  - severity: low
    issue: “Pelayanan dalam tugas ini” berpotensi menyiratkan pelayanan yang berlangsung di dalam suatu tugas, bukan hubungan genitif antara διακονία dan λειτουργία.
    rationale: Kedua nomina memiliki bidang makna yang dekat dan sulit dibedakan secara lancar dalam bahasa Indonesia. “Pelayanan ini” menyampaikan rujukan konkret kepada pelayanan pengumpulan bantuan tanpa memaksakan konstruksi yang tidak alami.
