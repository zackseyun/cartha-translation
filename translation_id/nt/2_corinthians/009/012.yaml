  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: id
  text: Sebab pelayanan ini bukan hanya memenuhi kekurangan orang-orang kudus[a], melainkan juga menghasilkan banyak ucapan syukur kepada Allah—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencukupi apa yang masih kurang pada orang-orang kudus.” Frasa selanjutnya juga dapat diterjemahkan, “melimpah melalui banyak ucapan syukur kepada Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan penjelas itu secara wajar.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: pelayanan dalam tugas ini
  rationale: “Pelayanan” mempertahankan makna διακονία, sedangkan “tugas” membedakannya dari λειτουργία dan menunjuk pada pelayanan konkret berupa pengumpulan serta penyaluran bantuan.
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: mencukupi apa yang masih kurang
  rationale: Ungkapan ini mempertahankan gambaran mengisi atau menyediakan kekurangan tanpa membatasinya secara eksplisit hanya pada kebutuhan tertentu.
- source_word: τῶν ἁγίων
  choice: pada orang-orang kudus
  rationale: Sebutan Paulus bagi umat percaya dipertahankan, tetapi preposisi “pada” dipakai agar hubungan dengan “apa yang masih kurang” jelas dan alami dalam bahasa Indonesia.
- source_word: περισσεύουσα
  choice: melimpah
  rationale: Pilihan ini mempertahankan gagasan kelimpahan yang melampaui sekadar kecukupan.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: menjadi banyak ucapan syukur kepada Allah
  rationale: Dalam konteks, pelayanan itu menghasilkan banyak ucapan syukur yang diarahkan kepada Allah; “menjadi” menyampaikan akibat secara alami, sambil tetap mengakui kemungkinan nuansa sarana pada διά.
theological_decisions:
- issue: Sebutan ἅγιοι bagi para penerima bantuan
  choice: orang-orang kudus
  alternative: umat Allah; orang-orang yang dikhususkan bagi Allah
  rationale: Pilihan ini mempertahankan istilah khas Paulus bagi umat percaya tanpa mengaitkannya dengan pengertian kanonisasi pada masa kemudian.
- issue: Hubungan διά dengan banyak ucapan syukur
  choice: menjadi banyak ucapan syukur kepada Allah
  alternative: melalui banyak ucapan syukur kepada Allah
  rationale: Konteks mendukung nuansa hasil—pelayanan itu menimbulkan ucapan syukur—namun bentuk Yunani juga dapat dipahami secara lebih harfiah sebagai sarana atau saluran; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitesis “bukan hanya ... melainkan juga” mengikuti susunan Yunani. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
