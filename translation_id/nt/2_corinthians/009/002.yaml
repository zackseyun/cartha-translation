reference: 2 Corinthians 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: id
  text: 'Sebab aku tahu kesediaanmu[a], yang kubanggakan kepada orang-orang Makedonia tentang kamu: bahwa Akhaya[b] telah siap sejak tahun lalu, dan semangatmu telah menggugah sebagian besar dari mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesiapanmu” atau “kesungguhanmu”.
    reason: lexical_alternative
  - marker: b
    text: Akhaya adalah provinsi Romawi yang mencakup Korintus; di sini nama wilayah itu menunjuk kepada orang-orang percaya di sana.
    reason: cultural_note
lexical_decisions:
- source_word: προθυμίαν
  choice: kesediaan
  rationale: Kata ini menyatakan kesiapan batin yang rela dan bersemangat; 'kesediaan' alami dalam konteks pemberian dan tetap membuka nuansa 'kesiapan' atau 'kesungguhan'.
- source_word: καυχῶμαι
  choice: kubanggakan
  rationale: Mempertahankan kekuatan retoris καυχάομαι tanpa melunakkannya menjadi sekadar memuji.
- source_word: ὑπὲρ ὑμῶν
  choice: demi kamu
  rationale: Dalam kaitannya dengan καυχῶμαι, frasa ini menunjukkan bahwa Paulus membanggakan mereka untuk kepentingan atau atas nama mereka; 'demi kamu' lebih alami daripada 'atas nama kamu' dalam kalimat ini.
- source_word: Μακεδόσιν
  choice: orang-orang Makedonia
  rationale: Bentuk datif jamak menunjuk kepada orang-orang dari Makedonia; terjemahan ini tidak menambahkan identitas mereka secara eksplisit sebagai orang percaya.
- source_word: Ἀχαΐα
  choice: Akhaya
  rationale: Nama provinsi dipertahankan sebagaimana dalam teks Yunani, dengan metonimia yang menunjuk kepada orang-orang percaya di wilayah itu.
- source_word: παρεσκεύασται
  choice: sudah siap
  rationale: Bentuk perfek menyatakan keadaan siap sebagai hasil persiapan sebelumnya; 'sudah siap' wajar bersama keterangan waktu berikutnya.
- source_word: ἀπὸ πέρυσι
  choice: sejak tahun lalu
  rationale: Ungkapan ini menunjukkan keadaan yang berlangsung mulai tahun sebelumnya hingga waktu pembicaraan.
- source_word: τὸ ὑμῶν ζῆλος
  choice: semangatmu
  rationale: Dalam konteks positif, ζῆλος berarti semangat atau kegairahan yang sungguh-sungguh; 'semangat' jelas dan alami bagi pembaca Indonesia modern.
- source_word: ἠρέθισε
  choice: telah menggugah
  rationale: ἐρεθίζω di sini berarti merangsang atau menggerakkan secara positif; 'menggugah' menghindari konotasi negatif dari 'memprovokasi'.
- source_word: τοὺς πλείονας
  choice: sebagian besar dari mereka
  rationale: Frasa ini berarti mayoritas dari kelompok yang baru disebut, yaitu orang-orang Makedonia; acuan implisit dibuat jelas secara alami.
theological_decisions:
- issue: Acuan 'Akhaya'
  choice: Nama wilayah dipertahankan dan dipahami secara metonimis untuk orang-orang percaya di sana.
  alternative: Kamu sudah siap sejak tahun lalu; orang-orang percaya di Akhaya sudah siap sejak tahun lalu.
  rationale: Teks Yunani secara eksplisit menyebut Ἀχαΐα. Mempertahankan nama itu menjaga cakupan regional dan ketegangan antara tempat dan penduduknya.
- issue: Kekuatan ungkapan Paulus tentang membanggakan
  choice: Diterjemahkan langsung sebagai 'kubanggakan'.
  alternative: Kupuji; kubicarakan dengan bangga.
  rationale: καυχῶμαι adalah istilah retoris yang kuat dan tidak perlu diperhalus karena alasan teologis.
- issue: Isi perkataan yang dibanggakan
  choice: 'Ditampilkan sebagai kalimat langsung secara semantis: ''Aku mengatakan bahwa Akhaya ...'''
  alternative: Dengan tanda titik dua langsung sesudah 'demi kamu'.
  rationale: ὅτι memperkenalkan isi dari pembanggaan Paulus dan dapat dipahami sebagai 'bahwa'; penambahan 'Aku mengatakan' membuat hubungan sintaksis jelas tanpa mengubah isinya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk enklitik '-mu' dan 'ku-' dipakai untuk kelancaran. Nama Ἀχαΐα ditransliterasikan sebagai 'Akhaya'. Semua penanda catatan kaki muncul dalam teks utama.
