  terminology: “Kesediaan,” “orang-orang Makedonia,” “Akhaya,” “siap,” dan “semangat” sesuai konteks dan ragam bahasa Indonesia modern. “Akhaya” dipertahankan sebagai nama wilayah, dengan catatan yang memadai tentang penggunaan metonimisnya.
