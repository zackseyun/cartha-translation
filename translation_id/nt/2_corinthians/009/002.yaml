revisions:
- from: Sebab aku tahu kesediaanmu[a], yang kubanggakan kepada orang-orang Makedonia demi kamu. Aku mengatakan bahwa Akhaya[b] sudah siap sejak tahun lalu, dan semangatmu telah menggugah sebagian besar dari mereka.
  to: 'Sebab aku tahu kesediaanmu[a], yang kubanggakan kepada orang-orang Makedonia tentang kamu: bahwa Akhaya[b] telah siap sejak tahun lalu, dan semangatmu telah menggugah sebagian besar dari mereka.'
  rationale: Revisi menghapus penambahan “Aku mengatakan,” lalu memakai titik dua untuk mempertahankan fungsi ὅτι sebagai isi dari pembanggaan Paulus. Frasa “tentang kamu” menggantikan “demi kamu” agar hubungan dengan tindakan membanggakan lebih alami dalam bahasa Indonesia, sambil mempertahankan maksud dasar ὑπὲρ ὑμῶν. Tidak ada perubahan pada makna pokok atau catatan kaki yang ada.
