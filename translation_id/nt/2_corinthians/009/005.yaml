id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: id
  text: Karena itu, saya menganggap perlu mendesak saudara-saudara[a] itu agar pergi lebih dahulu kepada kalian dan mengatur lebih dahulu pemberian murah hati[b] yang telah kalian janjikan, supaya pemberian itu sudah siap sebagai pemberian yang murah hati, bukan sebagai ketamakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara-saudari,” jika sebutan bagi rombongan itu dipahami secara inklusif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berkat.” Di sini kata itu mengacu pada sumbangan yang telah dijanjikan jemaat Korintus sebagai pemberian yang murah hati.
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani pleonexia biasanya berarti “ketamakan,” “keserakahan,” atau “kerakusan.” Dalam konteks ini, kata itu mengontraskan pemberian yang murah hati dengan kesan meminta atau mengumpulkan secara tamak, seolah-olah memeras pemberi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον
  choice: perlu
  rationale: Menyatakan penilaian Paulus tentang kebutuhan praktis tanpa memberi kesan paksaan mutlak.
- source_word: ἡγησάμην
  choice: saya menganggap
  rationale: Mencerminkan tindakan menilai atau mempertimbangkan yang dinyatakan oleh bentuk aoristus ἡγέομαι.
- source_word: παρακαλέσαι
  choice: mendesak
  rationale: Konteksnya menunjukkan permintaan sungguh-sungguh agar utusan bertindak lebih dahulu.
- source_word: τοὺς ἀδελφοὺς
  choice: saudara-saudara itu
  rationale: Mempertahankan bentuk jamak maskulin Yunani dan menunjuk kepada anggota delegasi yang sudah dikenal dalam konteks.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: pergi mendahului kami kepada kalian
  rationale: Mengungkapkan bahwa delegasi pergi sebelum Paulus dan rombongannya; unsur 'kami' dipahami dari konteks perjalanan.
- source_word: προκαταρτίσωσι
  choice: mengatur lebih dahulu
  rationale: Menunjukkan pengorganisasian dan penyelesaian persiapan sumbangan sebelum Paulus tiba.
- source_word: προεπηγγελμένην
  choice: yang telah kalian janjikan
  rationale: Menyatakan bahwa pemberian itu telah dijanjikan sebelumnya oleh jemaat Korintus.
- source_word: εὐλογίαν
  choice: pemberian murah hati
  rationale: Dalam konteks pengumpulan dana, kata ini merujuk pada sumbangan yang diberikan dengan kemurahan hati; arti harfiahnya dicatat dalam catatan kaki.
- source_word: οὕτως ὡς εὐλογίαν
  choice: sebagai pemberian yang murah hati
  rationale: Mempertahankan pengulangan retoris εὐλογία secara wajar dalam bahasa Indonesia; οὕτως berfungsi mengarahkan pada sifat pemberian yang dijelaskan berikutnya.
- source_word: πλεονεξίαν
  choice: sesuatu yang dipaksakan
  rationale: Walaupun biasanya berarti ketamakan atau keserakahan, dalam kontras ini kata tersebut menggambarkan sumbangan yang seolah-olah ditarik secara paksa.
theological_decisions:
- issue: Cakupan gender τοὺς ἀδελφοὺς
  choice: saudara-saudara itu
  alternative: saudara-saudari itu
  rationale: Bentuk Yunani secara gramatikal maskulin jamak, sehingga teks utama tidak menetralkannya; kemungkinan pemakaian inklusif tetap dijelaskan dalam catatan kaki.
- issue: Makna εὐλογία dalam konteks pengumpulan sumbangan
  choice: pemberian murah hati
  alternative: berkat
  rationale: Padanan kontekstual membuat rujukan kepada sumbangan dapat dipahami dan mempertahankan kontras dengan πλεονεξία, sedangkan citra harfiah 'berkat' dilestarikan dalam catatan kaki.
- issue: Nuansa πλεονεξία dalam kontras etis
  choice: sesuatu yang dipaksakan
  alternative: ketamakan atau keserakahan
  rationale: Konteks mempertentangkan pemberian sukarela dan murah hati dengan pungutan yang tampak diperas dari pemberi, tanpa menghapus arti leksikal lazim yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada surat yang bermartabat dan mudah dipahami. Pronomina “saya” dan “kalian” dipakai agar relasi penutur-jamaah jelas; pengulangan “pemberian murah hati” dipertahankan untuk mencerminkan pengulangan εὐλογία.
