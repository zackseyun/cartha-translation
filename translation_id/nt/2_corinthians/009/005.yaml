  to: Karena itu, saya menganggap perlu mendesak saudara-saudara[a] itu agar pergi lebih dahulu kepada kalian dan mengatur lebih dahulu pemberian murah hati[b] yang telah kalian janjikan, supaya pemberian itu sudah siap sebagai pemberian yang murah hati, bukan sebagai ketamakan[c].
