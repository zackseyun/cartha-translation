    rationale: δóκιμος berarti yang telah/berdiri sebagai pihak yang disetujui atau diakui setelah evaluasi. “Berk enan” dapat mengarahkan pembaca pada konsep perkenanan religius, sedangkan “terbukti” terlalu menonjolkan proses pembuktian yang tidak dinyatakan secara eksplisit.
