  rationale: Revisi memakai “merekomendasikan” pada kedua kemunculan συνίστημι untuk menjaga pengulangan dan makna kontekstualnya. “Diakui” menyampaikan δόκιμος sebagai status penerimaan atau pengesahan tanpa memasukkan penjelasan teologis maupun proses pengujian secara berlebihan. Rujukan “Tuhan” dipertahankan sebagaimana teks Yunani.
