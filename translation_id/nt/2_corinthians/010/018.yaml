  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: id
  text: Sebab, bukan orang yang merekomendasikan dirinya sendiri yang diakui,[a] melainkan orang yang direkomendasikan oleh Tuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang teruji” atau “yang dapat diterima”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: memuji ... dipuji
  rationale: Dalam konteks pembelaan, kebanggaan, dan penilaian ini, συνίστημι berarti mengemukakan seseorang secara positif atau memberi pujian sebagai dasar penerimaan. Pengulangan kata yang sama dipertahankan dalam bahasa Indonesia.
- source_word: δόκιμος
  choice: terbukti berkenan
  rationale: δόκιμος menunjuk kepada seseorang yang, setelah dinilai atau diuji, didapati layak dan diterima. Ungkapan ini mempertahankan unsur pembuktian sekaligus penerimaan, yang kurang lengkap bila hanya diterjemahkan 'disetujui'.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar κύριος diterjemahkan dengan bentuk baku 'Tuhan', tanpa memperjelas referennya melampaui bunyi ayat.
- source_word: ἑαυτὸν
  choice: dirinya sendiri
  rationale: Bentuk refleksif ini secara alami diterjemahkan 'dirinya sendiri' dan tetap merujuk kepada orang representatif yang sedang dibicarakan.
- source_word: ὃν
  choice: orang yang
  rationale: Nomina tersirat dibuat eksplisit agar kontras antarkedua orang terbaca alami dalam bahasa Indonesia.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ memberikan alasan atau penjelasan bagi pernyataan sebelumnya; 'Sebab' mempertahankan hubungan argumentatif itu.
theological_decisions:
- issue: Referen ὁ κύριος
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Dalam pemakaian Paulus, gelar ini sering menunjuk kepada Yesus, tetapi ayat hanya menyebut ὁ κύριος. Terjemahan tidak menentukan referen secara lebih spesifik daripada teks sumber.
- issue: Dasar penilaian yang sah
  choice: Kontras antara pujian diri dan pujian Tuhan dipertahankan
  alternative: Menjelaskannya sebagai pembenaran, keselamatan, atau pengesahan jabatan tertentu
  rationale: Ayat menegaskan bahwa penilaian Tuhan, bukan rekomendasi diri, menentukan siapa yang terbukti berkenan, tetapi tidak secara eksplisit membatasi penilaian itu pada suatu kategori doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kontras Yunani dipertahankan, sedangkan 'terbukti berkenan' dipilih untuk menyampaikan nuansa evaluasi dan penerimaan dalam δόκιμος.
