  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: id
  text: dan setiap hal yang menjulang tinggi menentang pengenalan akan Allah[a], dan menawan setiap pikiran untuk membawanya kepada ketaatan kepada Mesias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengetahuan tentang Allah.” “Setiap hal yang menjulang tinggi” juga dapat diterjemahkan “setiap hal yang tinggi” atau “setiap keangkuhan.”
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Mesias”; secara tradisional diterjemahkan “Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: setiap hal yang menjulang tinggi
  rationale: Ungkapan ini mempertahankan gambaran sesuatu yang tinggi atau ditinggikan tanpa mempersempit acuannya menjadi kesombongan, dalih, atau argumen semata. “Setiap” mencerminkan pemakaian distributif πᾶν.
- source_word: ἐπαιρόμενον
  choice: yang menjulang tinggi
  rationale: Partisipel ini menggambarkan sesuatu yang diangkat atau berada dalam keadaan meninggi. Dalam bahasa Indonesia, “menjulang tinggi” menyampaikan gambaran tersebut secara alami tanpa mengharuskan nuansa refleksif “meninggikan diri”.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: menentang pengenalan akan Allah
  rationale: “Menentang” menyampaikan daya lawan κατά. “Pengenalan akan Allah” mempertahankan aspek pengetahuan yang bersifat relasional tanpa membatasinya hanya pada informasi tentang Allah.
- source_word: αἰχμαλωτίζοντες
  choice: menawan
  rationale: Kata kerja ini berarti menangkap sebagai tawanan dan mempertahankan metafora militer dalam konteks sekitarnya.
- source_word: πᾶν νόημα
  choice: setiap pikiran
  rationale: νόημα dapat berarti pikiran, maksud, atau pola pikir. “Setiap pikiran” merupakan padanan Indonesia yang luas dan alami serta mempertahankan daya distributif πᾶν.
- source_word: εἰς τὴν ὑπακοὴν
  choice: untuk membawanya kepada ketaatan
  rationale: Ungkapan ini menyatakan gerak menuju keadaan atau hasil berupa ketaatan. Penambahan “membawanya” membuat arah εἰς jelas dan alami dalam bahasa Indonesia, sambil mempertahankan metafora tawanan yang digiring.
- source_word: τοῦ Χριστοῦ
  choice: kepada Mesias
  rationale: Χριστός berfungsi sebagai gelar di sini. “Mesias” menerjemahkan makna gelar tersebut, sedangkan konstruksi genitifnya dalam konteks ketaatan paling alami dipahami sebagai ketaatan yang diarahkan kepada Mesias.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini diperlakukan sebagai gelar yang menyatakan peran Yesus sebagai Yang Diurapi, bukan sekadar unsur nama diri. Catatan kaki mempertahankan padanan tradisional.
- issue: Sifat πᾶν ὕψωμα ἐπαιρόμενον
  choice: setiap hal yang menjulang tinggi
  alternative: setiap keangkuhan yang meninggikan diri
  rationale: Bahasa Yunani memakai gambaran luas tentang sesuatu yang ditinggikan dan menentang pengenalan akan Allah. Terjemahan utama tidak membatasi gambaran itu hanya pada sikap angkuh, dalih, atau argumen manusia.
- issue: Makna γνώσεως τοῦ θεοῦ
  choice: pengenalan akan Allah
  alternative: pengetahuan tentang Allah
  rationale: Genitif Yunani dapat memuat nuansa pengetahuan tentang Allah maupun pengenalan relasional akan Dia. “Pengenalan akan Allah” dipilih sebagai ungkapan Indonesia yang wajar, sementara catatan kaki mempertahankan kemungkinan padanan yang lebih konseptual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tetap berupa kelanjutan kalimat sesuai teks Yunani yang diawali dengan καί dan memakai partisipel, sehingga draf mempertahankan awal “dan” serta tanda koma penutup. Metafora ketinggian dan penawanan dipertahankan, tetapi susunannya dibuat alami bagi pembaca Indonesia.
