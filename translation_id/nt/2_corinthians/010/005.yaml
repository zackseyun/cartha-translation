  terminology: “Allah” dan “Mesias” konsisten dengan register Alkitab Indonesia dan keputusan proyek untuk menerjemahkan Χριστός sebagai gelar. Catatan kaki a dan b relevan, akurat, dan berlabuh pada unsur yang tepat.
