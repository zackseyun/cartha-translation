  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: id
  text: 'Hendaklah orang seperti itu mempertimbangkan hal ini: sebagaimana kami dalam perkataan melalui surat-surat ketika kami tidak hadir, demikian jugalah kami dalam perbuatan ketika kami hadir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagaimana kami berbicara melalui surat-surat ketika kami tidak hadir, demikian jugalah kami bertindak ketika kami hadir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: hendaklah ... mempertimbangkan
  rationale: Imperatif orang ketiga tunggal ini meminta orang tersebut memperhitungkan atau memikirkan fakta yang dinyatakan; bentuk ini wajar dan tetap mempertahankan daya deliberatifnya.
- source_word: ὁ τοιοῦτος
  choice: orang seperti itu
  rationale: Menunjuk secara tunggal kepada orang dengan sifat atau sikap yang baru disebutkan; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: sebagaimana kami ... demikian jugalah kami
  rationale: Pasangan korelatif ini mempertahankan perbandingan mengenai kualitas atau karakter antara keadaan ketika tidak hadir dan ketika hadir.
- source_word: τῷ λόγῳ
  choice: dalam perkataan
  rationale: Datif lingkup atau segi; pilihan ini mempertahankan kontras retoris dengan 'dalam perbuatan' tanpa membatasi λόγος hanya pada gaya bicara lisan.
- source_word: δι’ ἐπιστολῶν
  choice: melalui surat-surat
  rationale: διά dengan genetif menyatakan sarana atau perantaraan; bentuk jamak surat-surat dipertahankan.
- source_word: ἀπόντες
  choice: ketika tidak hadir
  rationale: Partisip kini dipahami secara sirkumstansial dan dibuat sejajar dengan 'ketika hadir'.
- source_word: παρόντες
  choice: ketika hadir
  rationale: Mempertahankan kontras langsung dengan ἀπόντες dalam bahasa Indonesia yang alami.
- source_word: τῷ ἔργῳ
  choice: dalam perbuatan
  rationale: Datif lingkup atau segi yang sengaja dikontraskan dengan τῷ λόγῳ; 'perbuatan' menjaga antitesis perkataan–perbuatan.
theological_decisions:
- issue: Perbandingan antara perkataan dalam surat dan tindakan saat hadir
  choice: Diterjemahkan sebagai penegasan bahwa tindakan Paulus dan rekan-rekannya ketika hadir akan sepadan dengan perkataan mereka dalam surat ketika tidak hadir.
  alternative: Menjadikannya ancaman eksplisit mengenai hukuman tertentu atau sekadar kontras antara gaya dan kuasa.
  rationale: Teks Yunani menyatakan perbandingan langsung antara λόγος dan ἔργον serta antara tidak hadir dan hadir, tetapi tidak merinci tindakan tertentu; terjemahan mempertahankan ketegangan retoris tanpa menambah klaim.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan korelatif 'sebagaimana ... demikian jugalah ...' dipakai untuk memperjelas struktur Yunani dan menjaga kesejajaran retoris. Penanda catatan kaki [a] dicantumkan pada akhir ayat.
