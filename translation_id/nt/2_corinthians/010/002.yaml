  to: Namun, aku memohon agar ketika aku hadir, aku tidak perlu bersikap berani dengan keyakinan yang dengannya aku bermaksud berani bertindak terhadap beberapa orang yang menganggap bahwa kami hidup menurut daging[a].
  rationale: Revisi memulihkan fungsi instrumental/asosiatif τῇ πεποιθήσει beserta klausa relatif ᾗ, sambil mempertahankan nuansa tindakan yang ditujukan terhadap orang-orang tertentu dalam ἐπί τινας. Istilah «daging» dan catatan alternatif dipertahankan.
