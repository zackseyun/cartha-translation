id: 2CO.10.2
reference: 2 Corinthians 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: id
  text: Namun, aku memohon agar ketika aku hadir, aku tidak perlu bersikap berani dengan keyakinan yang dengannya aku bermaksud berani bertindak terhadap beberapa orang yang menganggap bahwa kami hidup menurut daging[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup menurut ukuran manusia.”
    reason: Alternatif leksikal yang menjelaskan kemungkinan makna idiom κατὰ σάρκα.
lexical_decisions:
- source_word: δέομαι
  choice: aku memohon
  rationale: Menyampaikan permohonan Paulus yang sungguh-sungguh, lebih kuat daripada sekadar 'meminta', dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: agar ketika hadir nanti aku tidak perlu bertindak berani
  rationale: Mengungkapkan isi permohonan dan keadaan yang ingin Paulus hindari; 'tidak perlu' memperjelas keharusan yang tersirat tanpa mengubah maksud.
- source_word: τῇ πεποιθήσει
  choice: dengan keyakinan
  rationale: Mempertahankan arti keyakinan atau keteguhan hati dan memahami datif secara instrumental/asosiatif.
- source_word: ᾗ λογίζομαι τολμῆσαι
  choice: yang membuatku berniat bertindak tegas
  rationale: λογίζομαι menunjukkan pertimbangan atau niat yang telah dipikirkan, sedangkan τολμάω menunjukkan keberanian untuk mengambil tindakan; susunan ini alami dalam bahasa Indonesia.
- source_word: ἐπί τινας
  choice: terhadap beberapa orang
  rationale: Menjaga arah tindakan kepada orang-orang tertentu dan nuansa adversatifnya tanpa menambahkan gambaran tindakan yang tidak dinyatakan secara eksplisit.
- source_word: τοὺς λογιζομένους
  choice: yang menganggap
  rationale: Menggambarkan penilaian para pengkritik terhadap Paulus dan rekan-rekannya.
- source_word: κατὰ σάρκα
  choice: menurut daging
  rationale: Mempertahankan istilah Paulus yang penting dan ambiguitas antara orientasi kedagingan dan ukuran manusiawi.
- source_word: περιπατοῦντας
  choice: hidup
  rationale: Metafora 'berjalan' di sini menunjuk pada cara hidup; 'hidup' menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna σάρξ dalam κατὰ σάρκα
  choice: menurut daging
  alternative: menurut ukuran manusia
  rationale: Terjemahan utama mempertahankan tekstur teologis dan keluasan makna istilah Paulus. Alternatif yang lebih interpretatif dicatat tanpa mempersempit tuduhan itu menjadi semata-mata 'tabiat berdosa'.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina tunggal 'aku' dan jamak 'kami' mengikuti pergantian orang dalam teks Yunani. Ungkapan 'ketika hadir nanti' mempertahankan kontras kontekstual dengan ketidakhadiran Paulus.
