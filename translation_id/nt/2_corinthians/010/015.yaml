revisions:
- from: Kami tidak bermegah melampaui batas dengan mengakui jerih payah orang lain sebagai hasil kerja kami. Sebaliknya, kami berharap bahwa, seiring bertumbuhnya iman kalian, pelayanan kami akan semakin diperluas di antara kalian sesuai dengan wilayah yang ditetapkan bagi kami,[a][b] hingga menjangkau daerah yang jauh lebih luas.[c]
  to: Kami tidak bermegah melampaui batas atas jerih payah orang lain. Sebaliknya, kami berharap bahwa, seiring iman kalian bertumbuh di antara kalian, pelayanan kami akan semakin diperluas sesuai dengan lingkup pelayanan kami, hingga berkelimpahan.[a][b][c]
  rationale: Revisi menghapus perluasan geografis yang diambil dari ayat 16, memulihkan makna nongeografis εἰς περισσείαν, dan menempatkan “di antara kalian” bersama pertumbuhan iman sebagai pembacaan sintaktis terdekat. Ambiguitas hubungan frasa itu serta nuansa μεγαλυνθῆναι tetap dicatat. Istilah “lingkup pelayanan” menyampaikan konteks κανών tanpa mengubahnya menjadi aturan atau kanon gerejawi.
  reviewer_model: gpt-5.6-terra
