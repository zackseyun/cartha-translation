  verdict: revise
  source_fidelity: Revisi diperlukan karena teks utama menambahkan gagasan yang tidak ada dalam ayat ini, yakni jangkauan ke “daerah yang jauh lebih luas.” Gagasan itu berkaitan dengan ayat berikutnya (2Kor 10:16), sedangkan εἰς περισσείαν pada ayat ini menyatakan kelimpahan/perluasan lebih lanjut. Posisi paling langsung ἐν ὑμῖν adalah dengan pertumbuhan iman, walaupun keterkaitan dengan infinitif berikutnya dapat dicatat sebagai kemungkinan.
  naturalness: Bahasa draft pada umumnya baku dan jelas. “Dengan mengakui jerih payah orang lain sebagai hasil kerja kami” terlalu menjelaskan makna ἐν ἀλλοτρίοις κόποις. “Hingga menjangkau daerah yang jauh lebih luas” lancar, tetapi tidak setia kepada batas ayat.
  terminology: “Bermegah,” “iman,” dan “jerih payah” sesuai register Paulus. “Lingkup pelayanan kami” menyampaikan κανών secara idiomatis dalam konteks ini tanpa menggunakan istilah anakronistis “kanon”; catatan kaki mempertahankan alternatif yang lebih literal. “Pelayanan kami akan semakin diperluas” merupakan penjelasan kontekstual yang aman untuk μεγαλυνθῆναι, dengan bentuk harfiahnya dicatat.
