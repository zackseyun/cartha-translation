    issue: Teks utama menerjemahkan εἰς περισσείαν sebagai “hingga menjangkau daerah yang jauh lebih luas.”
    rationale: Frasa tersebut tidak menyebut daerah; perluasan ke daerah-daerah di luar Korintus dinyatakan pada ayat 16. Terjemahan ini mengimpor isi ayat berikutnya dan mempersempit makna frasa menjadi geografis.
  - severity: medium
    issue: ἐν ὑμῖν dalam teks utama dilekatkan pada perluasan pelayanan tanpa menampilkan pembacaan yang paling dekat secara sintaktis.
    rationale: Frasa itu langsung mengikuti “iman kalian” dan secara alami dapat berarti iman kalian bertumbuh di antara kalian. Karena hubungan tepatnya diperdebatkan, teks utama memakai hubungan dekat ini dan catatan kaki mencatat alternatifnya.
  - severity: low
    issue: “Dengan mengakui jerih payah orang lain sebagai hasil kerja kami” menambahkan penjelasan ke dalam teks utama.
    rationale: Konteks memang mendukung penolakan mengambil kredit atas pekerjaan orang lain, tetapi Yunani hanya menyatakan bermegah dalam jerih payah orang lain. “Atas jerih payah orang lain” lebih ringkas dan dekat.
