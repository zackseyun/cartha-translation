  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: id
  text: Kami tidak bermegah melampaui batas atas jerih payah orang lain. Sebaliknya, kami berharap bahwa, seiring iman kalian bertumbuh di antara kalian, pelayanan kami akan semakin diperluas sesuai dengan lingkup pelayanan kami, hingga berkelimpahan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan ukuran kami” atau “sesuai dengan patokan kami.” Kata Yunani κανών di sini menunjuk pada ukuran atau lingkup kerja yang terukur.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kami akan semakin dibesarkan” atau “diperluas.” Dalam konteks ini frasa tersebut dapat menunjuk pada perluasan karya kerasulan Paulus; kemungkinan bahwa Paulus semakin dihargai juga dipertahankan.
    reason: alternative_reading
  - marker: c
    text: 'Secara lebih harfiah, “sampai berkelimpahan”; dapat juga diterjemahkan “secara melimpah” atau “untuk perluasan lebih lanjut.” Frasa ini tidak dengan sendirinya menyebut daerah yang lebih luas; gagasan pemberitaan ke wilayah-wilayah di luar Korintus muncul pada ayat berikutnya. Frasa “di antara kalian” dapat pula dikaitkan dengan klausa berikutnya: “kami akan semakin diperluas di antara kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: tidak bermegah melampaui batas
  rationale: Ungkapan ini berarti tidak melampaui batas yang semestinya dalam bermegah; terjemahan ini mempertahankan gambaran tentang ukuran atau batas.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: dengan mengakui jerih payah orang lain sebagai hasil kerja kami
  rationale: Secara harfiah berarti ‘dalam jerih payah orang lain’; konteks menunjukkan bahwa Paulus menolak mengambil pujian atas pekerjaan yang dilakukan orang lain.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Sebaliknya, kami berharap
  rationale: Bentuk partisipial Yunani disampaikan sebagai verba alami dalam bahasa Indonesia tanpa menghilangkan pertentangannya dengan klausa sebelumnya.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: seiring bertumbuhnya iman kalian
  rationale: Genitif absolut diterjemahkan secara alami sebagai keadaan yang menyertai; πίστις dipertahankan sebagai ‘iman’.
- source_word: ἐν ὑμῖν
  choice: di antara kalian
  rationale: Frasa ini dapat dikaitkan dengan pertumbuhan iman atau dengan perluasan karya Paulus. Teks utama mengaitkannya dengan pelayanan Paulus sambil mencatat ambiguitas tersebut dalam catatan kaki.
- source_word: μεγαλυνθῆναι
  choice: pelayanan kami akan semakin diperluas
  rationale: Secara leksikal berarti ‘dibesarkan’ atau ‘diagungkan’, tetapi dalam konteks wilayah kerasulan, maksud utamanya adalah perluasan karya Paulus; penyebutan ‘pelayanan’ membuat metafora itu alami dalam bahasa Indonesia.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: sesuai dengan wilayah yang ditetapkan bagi kami
  rationale: κανών di sini menunjuk pada bidang atau wilayah kerja yang terukur dan dipercayakan kepada Paulus, bukan ‘kanon’ dalam pengertian gerejawi yang lebih kemudian.
- source_word: εἰς περισσείαν
  choice: hingga menjangkau daerah yang jauh lebih luas
  rationale: Ungkapan ini menyatakan gerak menuju keluasan atau kelimpahan yang lebih besar; konteks ayat berikutnya mendukung nuansa perluasan jangkauan.
theological_decisions:
- issue: Makna μεγαλυνθῆναι dalam kaitannya dengan kerasulan Paulus
  choice: Perluasan pelayanan Paulus di dalam wilayah yang dipercayakan kepadanya
  alternative: Paulus sendiri semakin dihormati atau diagungkan oleh jemaat Korintus
  rationale: Konteks 2 Korintus 10:13–16 membahas batas wilayah kerja dan penolakan untuk bermegah atas pekerjaan orang lain. Namun kemungkinan nuansa penghormatan terhadap Paulus tetap dicatat.
- issue: Makna κανών
  choice: wilayah yang ditetapkan bagi kami
  alternative: ukuran, patokan, atau lingkup kami
  rationale: Dalam konteks ini kata tersebut menunjuk pada wilayah kerja yang diukur atau ditetapkan, bukan pada daftar kitab suci maupun aturan doktrinal.
- issue: Keterkaitan sintaksis ἐν ὑμῖν
  choice: Dikaitkan dengan perluasan pelayanan Paulus ‘di antara kalian’
  alternative: Dikaitkan dengan iman yang ‘bertumbuh di antara kalian’
  rationale: Urutan Yunani memungkinkan kedua hubungan tersebut. Teks utama memilih hubungan yang selaras dengan perluasan pelayanan, sedangkan catatan kaki mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’ untuk membedakan ὑμῶν/ὑμῖν dari bentuk tunggal. Gaya dijaga lugas dan bermartabat; ungkapan Yunani yang sangat metaforis dijelaskan secara optimal-ekuivalen, sementara ambiguitas sintaksis dan alternatif leksikal dipertahankan dalam catatan kaki.
