  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: id
  text: Sebab kami tidak berani menempatkan diri kami dalam golongan yang sama dengan atau membandingkan diri kami dengan beberapa orang yang memuji diri sendiri.[a] Tetapi mereka sendiri, yang mengukur diri mereka berdasarkan diri mereka sendiri dan membandingkan diri mereka dengan diri mereka sendiri,[b] tidak mengerti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempatkan diri kami di antara” atau “menyejajarkan diri kami dengan”; kata Yunani ini mengandung gagasan menempatkan diri dalam golongan yang sama dengan orang lain.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengukur diri mereka di dalam diri mereka sendiri dan membandingkan diri mereka dengan diri mereka sendiri.” Frasa pertama dapat menyatakan bahwa mereka menjadikan diri sendiri sebagai tolok ukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: kami tidak berani
  rationale: Ungkapan ini mempertahankan arti keberanian atau kenekatan untuk bertindak, sekaligus nada ironi Paulus.
- source_word: ἐγκρῖναι
  choice: menggolongkan
  rationale: Dalam konteks ini, verba tersebut berarti menempatkan seseorang dalam golongan atau kategori yang sama, bukan sekadar menilai.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: membandingkan / membandingkan
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mempertahankan pengulangan retoris teks Yunani.
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: diri dengan beberapa orang yang memuji diri sendiri
  rationale: συνιστάνω di sini menunjuk pada tindakan mengajukan atau memuji kelayakan diri sendiri, tema utama dalam konteks ini.
- source_word: ἀλλὰ αὐτοὶ
  choice: Namun, ketika mereka
  rationale: Kata penghubung mempertahankan pertentangan dengan kelompok Paulus, sedangkan susunan ini menghasilkan bahasa Indonesia yang alami dalam hubungan dengan kedua partisipel berikutnya.
- source_word: ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες
  choice: mengukur diri dengan diri mereka sendiri
  rationale: Terjemahan ini mempertahankan metafora pengukuran dan menyatakan bahwa diri mereka sendiri dijadikan tolok ukur.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: diri dengan diri mereka sendiri
  rationale: Pengulangan unsur refleksif dipertahankan karena menjadi inti kritik Paulus terhadap penilaian yang berpusat pada diri.
- source_word: οὐ συνιᾶσιν
  choice: mereka tidak mengerti
  rationale: Padanan ini jelas dan alami serta tidak menambahkan objek pemahaman yang tidak dinyatakan dalam teks Yunani.
