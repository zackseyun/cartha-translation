id: 2CO.10.8
reference: 2 Corinthians 10:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: id
  text: Sebab, sekalipun aku bermegah sedikit lebih banyak tentang wewenang kami, yang Tuhan berikan untuk membangun kalian dan bukan untuk meruntuhkan kalian[a], aku tidak akan dipermalukan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan bukan untuk menghancurkan kalian.” Kata Yunaninya mempertentangkan pembangunan dengan peruntuhan atau penghancuran.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku tidak akan merasa malu.” Bentuk Yunaninya pasif, sehingga “dipermalukan” lebih langsung mencerminkan bentuk tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Sebab, sekalipun
  rationale: γάρ memberi alasan atau penjelasan bagi konteks sebelumnya, sedangkan ἐάν dengan subjungtif menyatakan keadaan bersyarat. Dalam susunan ini, τε turut menguatkan nuansa yang wajar diungkapkan dengan 'sekalipun'.
- source_word: περισσότερόν τι
  choice: sedikit lebih banyak
  rationale: Ungkapan adverbial ini menyatakan kadar bermegah yang lebih besar, sementara τι melunakkan atau membatasi perbandingan itu secara tak tentu.
- source_word: καυχήσωμαι
  choice: aku bermegah
  rationale: Bentuk subjungtif aoris berada dalam klausa bersyarat; nuansa hipotesisnya sudah dinyatakan secara alami oleh 'sekalipun'.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: tentang wewenang kami
  rationale: ἐξουσία menunjuk pada wewenang atau hak yang diberikan, bukan sekadar kekuatan. 'Wewenang' alami dan tepat dalam konteks pelayanan rasuli.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: yang Tuhan berikan
  rationale: Kata ganti relatif merujuk kepada wewenang tersebut. Aoris Yunani dapat diterjemahkan dengan bentuk lampau kontekstual Indonesia tanpa penanda waktu tambahan; 'Tuhan' mempertahankan gelar κύριος.
- source_word: εἰς οἰκοδομὴν
  choice: untuk membangun kalian
  rationale: οἰκοδομή memakai metafora pembangunan bagi penguatan jemaat. Objek 'kalian' tersirat dari konteks dan dari ὑμῶν pada pasangan kontrasnya.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: dan bukan untuk meruntuhkan kalian
  rationale: καθαίρεσις dapat berarti peruntuhan atau penghancuran. 'Meruntuhkan' mempertahankan metafora konstruksi yang berlawanan dengan 'membangun' tanpa menghilangkan daya keras istilahnya.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: aku tidak akan dipermalukan
  rationale: Bentuk pasif masa depan paling langsung tercermin dalam 'akan dipermalukan', yakni bahwa pengakuan Paulus tidak akan terbukti kosong dan mendatangkan malu.
theological_decisions:
- issue: Sifat dan tujuan wewenang rasuli
  choice: Wewenang Paulus berasal dari Tuhan dan bertujuan membangun jemaat, bukan meruntuhkan mereka.
  alternative: Wewenang itu terutama dipahami sebagai kuasa disipliner untuk menghancurkan atau membinasakan.
  rationale: Kontras eksplisit antara οἰκοδομή dan καθαίρεσις menampilkan tujuan konstruktif wewenang tersebut, tetapi kata 'meruntuhkan' tetap mempertahankan ketegangan dengan konteks tindakan tegas Paulus.
- issue: Makna akhir αἰσχυνθήσομαι
  choice: Paulus tidak akan dipermalukan, yakni klaimnya tentang wewenang tidak akan terbukti kosong.
  alternative: Paulus secara batin tidak akan merasa malu.
  rationale: Bentuk pasif mendukung 'dipermalukan', tetapi alternatif refleksif atau keadaan batin tetap mungkin secara idiomatis dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; pasangan 'membangun–meruntuhkan' mempertahankan metafora sumber. Penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkannya.
