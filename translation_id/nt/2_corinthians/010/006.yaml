base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: id
  text: Kami juga siap menghukum setiap ketidaktaatan[a], ketika ketaatan kalian sudah lengkap[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menuntut pembalasan atas setiap ketidaktaatan.” Kata kerja Yunani ini dapat berarti menegakkan keadilan atau membalas, tetapi dalam konteks ini kemungkinan menunjuk pada hukuman disipliner.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika ketaatan kalian telah dipenuhi” atau “ketika ketaatan kalian telah digenapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: kami juga siap
  rationale: Ungkapan ini berarti berada dalam keadaan siap. Subjek orang pertama jamak yang tersirat dari konteks dinyatakan sebagai “kami” agar kalimat Indonesia utuh dan alami; καί diterjemahkan “juga” sebagai penghubung dengan ayat sebelumnya.
- source_word: ἐκδικῆσαι
  choice: menghukum
  rationale: Dalam konteks penggunaan wewenang rasuli untuk menghadapi perlawanan, kata ini menunjuk pada tindakan menjatuhkan hukuman atau menegakkan keadilan, bukan pembalasan dendam pribadi.
- source_word: πᾶσαν παρακοήν
  choice: setiap ketidaktaatan
  rationale: “Setiap” mempertahankan daya distributif πᾶσαν, sedangkan “ketidaktaatan” menerjemahkan penolakan untuk taat tanpa menambahkan pelaku atau bentuk pelanggaran tertentu.
- source_word: ὅταν
  choice: ketika
  rationale: Konjungsi ini dengan bentuk subjungtif menyatakan keadaan waktu yang masih akan terpenuhi. “Ketika” alami dalam bahasa Indonesia dan tetap membuka nuansa temporal-kondisional dari konteks.
- source_word: πληρωθῇ
  choice: sudah penuh
  rationale: Bentuk pasif ini menggambarkan ketaatan yang mencapai kepenuhan atau kelengkapannya. “Sudah penuh” mempertahankan metafora kepenuhan tanpa mengesankan kesempurnaan moral mutlak.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: ketaatan kalian
  rationale: Kata ganti ὑμῶν berbentuk jamak. “Kalian” menyatakannya dengan jelas dalam bahasa Indonesia modern dan menunjuk kepada jemaat Korintus secara kolektif.
theological_decisions:
- issue: Sifat tindakan Paulus terhadap ketidaktaatan
  choice: hukuman atau tindakan disipliner terhadap ketidaktaatan
  alternative: pembalasan atas setiap ketidaktaatan
  rationale: Konteks membahas wewenang rasuli untuk menangani perlawanan dalam jemaat. “Menghukum” sesuai dengan konteks tersebut dan tidak mengubah tindakan itu menjadi pembalasan dendam pribadi; kemungkinan makna menuntut pembalasan tetap dicatat dalam catatan kaki.
- issue: Makna kepenuhan ketaatan jemaat
  choice: ketaatan mencapai kepenuhannya
  alternative: ketaatan diselesaikan atau digenapi
  rationale: πληρωθῇ dapat menggambarkan sesuatu yang dipenuhi, digenapi, atau dibuat lengkap. Terjemahan utama mempertahankan citra kepenuhan, sedangkan alternatif leksikal dicatat tanpa menetapkan bahwa jemaat mencapai kesempurnaan tanpa cela.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” dipakai untuk mempertahankan bentuk jamak orang kedua secara jelas. Susunan kalimat mempertahankan hubungan ayat ini dengan konteks sebelumnya sambil tetap dapat dibaca sebagai satu ayat.
