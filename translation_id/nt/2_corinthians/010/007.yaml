reference: 2 Corinthians 10:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: id
  text: Kalian memandang apa yang tampak dari luar.[a] Jika seseorang merasa yakin bahwa dirinya adalah milik Mesias,[b] hendaklah ia kembali mempertimbangkan dalam dirinya sendiri bahwa sebagaimana ia adalah milik Mesias, demikian juga kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Kalian memandang hal-hal menurut apa yang tampak.” Bentuk Yunaninya juga mungkin dipahami sebagai perintah, “Pandanglah apa yang ada di depan mata kalian,” atau sebagai pertanyaan, “Apakah kalian memandang apa yang tampak dari luar?”
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: Secara harfiah, “adalah milik Mesias”; maksudnya menjadi kepunyaan atau pengikut Mesias.
    reason: clarification
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: apa yang tampak dari luar
  rationale: Ungkapan ini menunjuk pada hal-hal yang terlihat secara lahiriah atau di permukaan. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan makna harfiahnya melalui catatan kaki.
- source_word: βλέπετε
  choice: Kalian memandang
  rationale: 'Bentuk ini dapat dipahami sebagai indikatif atau imperatif. Dalam konteks teguran Paulus, indikatif paling mungkin: ia menyatakan bahwa mereka menilai berdasarkan apa yang tampak.'
- source_word: πέποιθεν ἑαυτῷ
  choice: merasa yakin bahwa dirinya
  rationale: Bentuk perfek πέποιθεν menyatakan keyakinan yang telah menetap, sedangkan unsur refleksif ἑαυτῷ diungkapkan secara alami dengan 'dirinya'.
- source_word: Χριστοῦ εἶναι
  choice: adalah milik Mesias
  rationale: Genitif bersama εἶναι menyatakan kepunyaan atau keterikatan. 'Mesias' mempertahankan Χριστός sebagai gelar.
- source_word: λογιζέσθω πάλιν
  choice: hendaklah ia kembali mempertimbangkan
  rationale: Imperatif ini menyerukan penilaian ulang yang sungguh-sungguh; 'kembali mempertimbangkan' menyampaikan unsur refleksi dan arti πάλιν.
- source_word: ἐφ’ ἑαυτοῦ
  choice: dalam dirinya sendiri
  rationale: Frasa ini paling wajar dipahami sebagai pertimbangan batin dalam pikirannya sendiri, tanpa menutup sepenuhnya nuansa 'bagi dirinya sendiri'.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: sebagaimana ia adalah milik Mesias, demikian juga kami
  rationale: Terjemahan ini mempertahankan perbandingan langsung dan melengkapi elipsis pada bagian kedua secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi. 'Mesias' mempertahankan fungsi gelar itu, sedangkan 'Kristus' dapat dipahami pembaca modern terutama sebagai nama diri.
- issue: Klaim sebagai milik Mesias
  choice: Paulus mengakui bahwa orang tersebut adalah milik Mesias dan menegaskan bahwa pihaknya juga demikian
  alternative: Paulus hanya menyebut klaim orang tersebut tanpa mengakuinya
  rationale: Susunan καθὼς ... οὕτως καί secara paling langsung menyatakan kesetaraan klaim kepunyaan. Terjemahan tidak menambahkan penilaian mengenai keabsahan pelayanan pihak lawan di luar yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk memperjelas bahwa βλέπετε berbentuk jamak. Diksi dibuat lugas dan bermartabat; pengulangan 'milik Mesias' dipertahankan karena merupakan inti perbandingan retoris ayat.
