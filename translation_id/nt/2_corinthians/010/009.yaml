  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: id
  text: supaya aku tidak tampak seolah-olah menakut-nakuti kalian melalui surat-suratku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya aku tidak tampak seakan-akan hendak mengintimidasi kalian melalui surat-surat itu.”
    reason: Alternatif ini mempertahankan nuansa komparatif ὡς ἂν, memakai ‘mengintimidasi’ sebagai kemungkinan padanan yang lebih kuat untuk ἐκφοβεῖν, dan mencerminkan artikel Yunani pada ‘surat-surat itu’.
lexical_decisions:
- source_word: ἵνα μὴ
  choice: supaya jangan sampai
  rationale: Mengungkapkan hubungan tujuan/hasil dengan konteks sebelumnya sekaligus mempertahankan negasi dalam bentuk yang alami dalam bahasa Indonesia.
- source_word: δόξω
  choice: aku dianggap
  rationale: Dalam konteks ini δοκέω berarti ‘tampak’ atau ‘dianggap’, bukan ‘berpikir’. Bentuk ‘aku dianggap’ mengalir alami dengan klausa berikutnya.
- source_word: ὡς ἂν
  choice: hendak
  rationale: Gabungan ini memberi nuansa seolah-olah atau kesan mengenai tindakan yang disebut berikutnya. Dalam susunan Indonesia, ‘dianggap hendak’ menyampaikan gagasan itu secara ringkas dan alami.
- source_word: ἐκφοβεῖν
  choice: menakut-nakuti
  rationale: Kata ini berarti membuat takut atau gentar. ‘Menakut-nakuti’ menyampaikan tindakan yang disengaja tanpa memperkuatnya secara berlebihan menjadi ‘meneror’.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Pronomina orang kedua jamak diterjemahkan secara eksplisit sebagai ‘kalian’, sesuai sasaran kepada jemaat.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: melalui surat-suratku
  rationale: διά dengan genitif menyatakan sarana. Bentuk jamak ‘surat-surat’ mempertahankan bentuk Yunani, sedangkan ‘-ku’ memperjelas pemilik yang sudah nyata dari konteks.
