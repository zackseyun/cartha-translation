  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: id
  text: Sebab, walaupun kami hidup dalam daging[a], kami tidak berperang menurut daging—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daging” pada kemunculan pertama dapat berarti tubuh atau keberadaan manusiawi; pada kemunculan kedua dapat menunjuk pada ukuran atau cara yang semata-mata manusiawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: sebagai manusia
  rationale: Dalam konteks ini frasa tersebut menunjuk pada kehidupan manusia yang berjasmani, bukan secara jelas pada ‘tabiat berdosa’. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan kontras dengan cara berperang yang semata-mata manusiawi.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan sebelumnya dan menjaga alur argumentasi.
- source_word: περιπατοῦντες
  choice: meskipun kami hidup
  rationale: Secara harfiah berarti ‘berjalan’, tetapi kerap menjadi ungkapan untuk menjalani hidup. Hubungan konsesif ‘meskipun’ sesuai dengan pertentangan terhadap klausa berikutnya.
- source_word: οὐ κατὰ σάρκα
  choice: tidak ... menurut cara manusia
  rationale: κατά dengan σάρκα menyatakan norma atau cara. Ungkapan ini menyampaikan bahwa peperangan Paulus tidak dijalankan berdasarkan cara atau sumber daya manusia semata, tanpa mengartikannya sebagai ‘tabiat berdosa’.
- source_word: στρατευόμεθα
  choice: kami tidak berperang
  rationale: Kata ini mempertahankan gambaran militer yang dipakai Paulus bagi perjuangan kerasulannya.
theological_decisions:
- issue: Makna σάρξ dalam kedua kemunculannya
  choice: Menerjemahkannya secara kontekstual sebagai ‘manusia’ sambil mempertahankan hubungan antara kehidupan manusiawi dan cara manusiawi.
  alternative: ‘dalam daging ... menurut daging’; ‘dalam tubuh ... menurut ukuran manusia’
  rationale: Kemunculan pertama menunjuk pada keberadaan manusia yang berjasmani, sedangkan yang kedua menunjuk pada cara atau norma manusiawi. Terjemahan utama menghindari kesan bahwa σάρξ di sini pasti berarti ‘tabiat berdosa’, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Sebagai manusia’ dipilih agar makna dapat dipahami pembaca umum; metafora militer dipertahankan dalam ‘berperang’. Tanda pisah pada akhir ayat menjaga kesinambungan kalimat dengan ayat berikutnya.
