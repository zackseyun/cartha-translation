  source_fidelity: Draf menangkap struktur konsesif dan metafora militer, tetapi menerjemahkan kedua kemunculan σάρξ secara berbeda (“sebagai manusia” dan “cara manusia”). Hal ini menghilangkan pengulangan retoris yang disengaja dalam bahasa Yunani dan mempersempit nuansa istilah tersebut lebih daripada yang diperlukan.
  naturalness: “Walaupun kami hidup dalam daging, kami tidak berperang menurut daging” merupakan bahasa Indonesia modern yang jelas dalam register Alkitabiah dan mempertahankan ketegangan retoris Paulus. Istilah “daging” dapat dipahami secara kiasan dalam konteks ini tanpa harus ditafsirkan sebagai ‘tabiat berdosa’.
  terminology: Gunakan “daging” untuk kedua kemunculan σάρξ agar istilah kunci dan ambiguitasnya tetap terjaga. “Sebab,”, “walaupun kami hidup,” dan “berperang” secara memadai menerjemahkan γάρ, περιπατοῦντες, dan στρατευόμεθα.
