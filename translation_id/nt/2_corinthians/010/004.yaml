  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: id
  text: Sebab senjata-senjata peperangan kami tidak bersifat kedagingan[a], melainkan ampuh di hadapan Allah[b] untuk meruntuhkan benteng-benteng—sambil meruntuhkan argumen-argumen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukan dari daging” atau “tidak bersifat duniawi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sangat berkuasa oleh Allah” atau “berkuasa melalui Allah.”
    reason: alternative_reading
  - marker: c
    text: Atau “penalaran-penalaran,” “pemikiran-pemikiran,” atau “spekulasi-spekulasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: senjata-senjata
  rationale: Mempertahankan metafora militer yang konkret dan merupakan padanan Indonesia yang wajar.
- source_word: στρατείας
  choice: peperangan
  rationale: Menyampaikan perjuangan militer yang sedang berlangsung dalam konteks metaforis.
- source_word: σαρκικὰ
  choice: yang berasal dari daging
  rationale: Menjaga hubungan leksikal dengan σάρξ dan pertentangan antara sarana manusiawi dan kuasa Allah tanpa mempersempitnya menjadi sekadar 'berdosa' atau 'duniawi'.
- source_word: δυνατὰ τῷ θεῷ
  choice: berkuasa di hadapan Allah
  rationale: Mencerminkan datif τῷ θεῷ tanpa memastikan nuansa instrumental yang tidak dinyatakan secara eksplisit; kemungkinan 'melalui Allah' dicatat dalam catatan kaki.
- source_word: καθαίρεσιν
  choice: meruntuhkan
  rationale: Mempertahankan gambaran pengepungan dan tindakan menjatuhkan bangunan pertahanan.
- source_word: ὀχυρωμάτων
  choice: benteng-benteng
  rationale: Padanan alami bagi posisi pertahanan yang kukuh dan cocok dengan metafora militer.
- source_word: λογισμοὺς
  choice: berbagai pemikiran
  rationale: Cakupannya dapat meliputi penalaran, perhitungan, atau argumen; pilihan ini mempertahankan keluasan makna, sedangkan alternatif dijelaskan dalam catatan kaki.
- source_word: καθαιροῦντες
  choice: kami meruntuhkan
  rationale: Mengulang akar verba yang sama dengan καθαίρεσιν dan memperjelas subjek partisipel dalam bahasa Indonesia.
theological_decisions:
- issue: Makna σαρκικὰ dalam pertentangan Paulus antara sarana manusia dan kuasa Allah
  choice: yang berasal dari daging
  alternative: bersifat duniawi; bersifat kedagingan
  rationale: Pilihan ini mempertahankan tekstur teologis istilah 'daging' dan tidak diam-diam menyamakannya hanya dengan dosa atau keduniawian.
- issue: Fungsi datif τῷ θεῷ dalam δυνατὰ τῷ θεῷ
  choice: berkuasa di hadapan Allah
  alternative: berkuasa melalui Allah; sangat berkuasa oleh Allah
  rationale: Bahasa Yunani bersifat padat dan dapat dipahami secara relasional atau instrumental. Teks utama mempertahankan nuansa relasional, sementara kemungkinan instrumental dicatat tanpa menetapkannya sebagai satu-satunya arti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pengulangan 'meruntuhkan' sengaja dipertahankan untuk mencerminkan hubungan καθαίρεσιν–καθαιροῦντες dan daya retoris teks. Tanda pisah mempertahankan peralihan dari benteng metaforis kepada pemikiran yang diruntuhkan.
