revisions:
- from: Sebab senjata-senjata dalam peperangan kami bukanlah senjata yang berasal dari daging[a], melainkan berkuasa di hadapan Allah[b] untuk meruntuhkan benteng-benteng—kami meruntuhkan berbagai pemikiran[c].
  to: Sebab senjata-senjata peperangan kami tidak bersifat kedagingan[a], melainkan ampuh di hadapan Allah[b] untuk meruntuhkan benteng-benteng—sambil meruntuhkan argumen-argumen[c].
  rationale: Revisi menghilangkan pengulangan yang tidak perlu, menerjemahkan σαρκικά sebagai sifat alih-alih asal-usul, dan memakai “argumen-argumen” untuk λογισμούς sesuai konteks. “Ampuh di hadapan Allah” mempertahankan pembacaan relasional dari τῷ θεῷ yang dicerminkan dalam jejak audit Inggris, sementara pembacaan instrumental dicatat. Pengulangan akar ‘runtuh’ tetap menyampaikan hubungan retoris καθαίρεσιν–καθαιροῦντες.
