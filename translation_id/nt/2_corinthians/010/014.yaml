  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: id
  text: Sebab kami tidak melampaui batas, seolah-olah kami belum menjangkau kalian, karena kami telah sampai bahkan kepada kalian dengan Injil Mesias[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Injil Kristus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: mengulurkan diri terlalu jauh
  rationale: Ungkapan ini mempertahankan gambaran harfiah tentang merentangkan diri melampaui batas, tetapi tetap alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: seolah-olah kami belum menjangkau kalian
  rationale: Frasa partisipial ini menyatakan keadaan hipotetis yang dapat membuat Paulus tampak melampaui batas. Bentuk 'belum menjangkau' menyampaikan bahwa pelayanan mereka sebenarnya sudah mencapai jemaat Korintus.
- source_word: ἄχρι ... καὶ ὑμῶν ἐφθάσαμεν
  choice: kami memang telah sampai bahkan kepada kalian
  rationale: '''Telah sampai'' menyatakan tindakan yang sudah terjadi, sedangkan ''bahkan'' mempertahankan penekanan καί. ''Memang'' menegaskan sanggahan Paulus secara alami.'
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: dengan Injil
  rationale: Dalam konteks perjalanan dan pelayanan Paulus, ἐν dapat menyatakan sarana atau hal yang menyertai kedatangannya. 'Dengan Injil' ringkas dan tidak menutup kemungkinan nuansa lingkup pelayanan.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός di sini tetap berfungsi sebagai gelar dalam frasa 'Injil Mesias'; 'Mesias' mempertahankan kandungan gelar tersebut, sementara bentuk tradisional dicatat sebagai alternatif.
theological_decisions:
- issue: Pemaknaan genitif τοῦ Χριστοῦ
  choice: Injil Mesias
  alternative: Injil Kristus
  rationale: Genitif Yunani dapat menunjuk pada Injil yang berasal dari, dimiliki oleh, atau mengenai Mesias. Terjemahan ringkas 'Injil Mesias' mempertahankan keluasan hubungan itu tanpa menentukannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'kalian' dipakai untuk menandai bahwa ὑμᾶς dan ὑμῶν berbentuk jamak. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
