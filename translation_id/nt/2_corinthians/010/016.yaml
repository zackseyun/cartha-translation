  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: id
  text: untuk memberitakan Kabar Baik di wilayah-wilayah yang melampaui daerah kalian, dan bukan untuk bermegah dalam wilayah pelayanan orang lain mengenai hal-hal yang telah tersedia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal-hal yang telah siap.” Dalam konteks ini, ungkapan tersebut mungkin mencakup pekerjaan atau hasil pelayanan yang telah dilakukan pihak lain.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: daerah-daerah yang terletak lebih jauh daripada tempat kalian
  rationale: Ungkapan ini menunjuk pada wilayah geografis di seberang atau lebih jauh dari lokasi jemaat Korintus. Penambahan 'tempat' membuat hubungan lokatifnya wajar dalam bahasa Indonesia tanpa menentukan wilayah tertentu.
- source_word: εὐαγγελίσασθαι
  choice: untuk memberitakan Kabar Baik
  rationale: Bentuk infinitif ini menyatakan tujuan pelayanan Paulus. 'Memberitakan Kabar Baik' jelas, alami, dan mempertahankan daya verbal istilah Yunani.
- source_word: ἀλλοτρίῳ κανόνι
  choice: dalam wilayah pelayanan orang lain
  rationale: Dalam konteks ini κανών berarti lingkup atau bidang pelayanan yang diberikan, bukan kaidah moral atau kanon Kitab Suci. Kata 'pelayanan' memperjelas metafora sesuai konteks ayat 13–15.
- source_word: ἕτοιμα
  choice: hal-hal yang sudah dipersiapkan
  rationale: Adjektiva ini dipakai secara substantival dan secara harfiah menunjuk pada hal-hal yang telah tersedia atau dipersiapkan. Terjemahan ini menjaga ungkapan Yunani tetap terbuka tanpa langsung menggantinya dengan 'hasil pekerjaan'.
- source_word: καυχήσασθαι
  choice: untuk bermegah
  rationale: '''Bermegah'' mempertahankan hubungan leksikal dengan tema καυχάομαι dalam bagian ini dan cocok dengan ragam bahasa Alkitab Indonesia yang tetap dapat dipahami.'
theological_decisions:
- issue: Makna κανών dalam konteks pelayanan Paulus
  choice: wilayah pelayanan yang menjadi lingkup pekerjaan seseorang
  alternative: kaidah, ukuran, atau kanon
  rationale: Konteks langsung membahas batas dan jangkauan pekerjaan rasuli. Terjemahan ini menghindari masuknya arti moral atau arti teknis 'kanon' yang berkembang kemudian.
- issue: Acuan τὰ ἕτοιμα
  choice: hal-hal yang sudah dipersiapkan
  alternative: pekerjaan atau hasil yang sudah diselesaikan orang lain
  rationale: Konteks memungkinkan acuan kepada pekerjaan yang telah dipersiapkan oleh pihak lain, tetapi teks Yunani sendiri berbentuk lebih umum. Teks utama mempertahankan keluasan itu, sedangkan catatan menjelaskan kemungkinan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Kalian' dipakai untuk menandai bentuk jamak ὑμῶν; 'Kabar Baik' dipilih sebagai ungkapan yang mudah dipahami; dan 'wilayah pelayanan' menjelaskan metafora κανών tanpa memakai istilah teknis yang berpotensi menyesatkan.
