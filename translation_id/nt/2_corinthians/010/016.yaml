  verdict: revise
  source_fidelity: 'Makna pokok sudah tepat: tujuan Paulus ialah memberitakan Injil di wilayah yang melampaui orang-orang Korintus, bukan bermegah dalam lingkup pelayanan milik orang lain mengenai hal-hal yang telah siap. Namun, “lebih jauh daripada tempat kalian” terlalu harfiah dan kurang tepat secara idiomatis untuk relasi lokatif ὑπερέκεινα ὑμῶν. “Atas hal-hal” juga bukan kolokasi yang paling alami dengan “bermegah” dalam konteks εἰς τὰ ἕτοιμα.'
  naturalness: “Wilayah-wilayah yang melampaui daerah kalian” lebih alami dan tetap berhati-hati daripada memaksakan bentuk “daripada tempat kalian.” Mengganti “atas” dengan “mengenai” membuat hubungan dengan “bermegah” jelas dalam bahasa Indonesia baku modern.
  terminology: “Memberitakan Kabar Baik,” “bermegah,” dan “wilayah pelayanan orang lain” menyampaikan εὐαγγελίσασθαι, καυχήσασθαι, dan ἀλλοτρίῳ κανόνι dengan baik. “Hal-hal yang telah tersedia” mempertahankan keluasan substantival τὰ ἕτοιμα tanpa menetapkan secara berlebihan bahwa semuanya adalah pekerjaan yang telah selesai.
  issues:
  - severity: medium
    issue: Ungkapan lokasi “lebih jauh daripada tempat kalian”
    rationale: Konstruksi ini terdengar kaku dalam bahasa Indonesia dan dapat menggeser relasi “wilayah di seberang/melampaui kalian” menjadi perbandingan jarak dengan suatu tempat yang tidak disebut dalam bahasa Yunani.
  - severity: low
    issue: Preposisi “atas” setelah “bermegah”
    rationale: Dalam ragam Indonesia modern, “bermegah mengenai/dalam hal” lebih idiomatis untuk menyatakan εἰς τὰ ἕτοιμα.
  - severity: low
    issue: Catatan kaki menyamakan kemungkinan makna dengan “pekerjaan yang sudah selesai” terlalu langsung
    rationale: Konteks memang dapat mengarah pada pekerjaan pihak lain, tetapi τὰ ἕτοιμα sendiri secara lebih terbuka berarti hal-hal yang telah siap/tersedia. Catatan sebaiknya membedakan makna leksikal dari kemungkinan kontekstual.
