reference: 2 Corinthians 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: id
  text: Aku sendiri, Paulus, memohon kepada kalian demi kelemahlembutan dan kemurahan Mesias—aku yang, ketika hadir di tengah kalian, rendah hati,[a] tetapi ketika tidak hadir berani terhadap kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut muka”; maksudnya, ketika hadir secara langsung. “Rendah hati” mungkin secara ironis menggemakan penilaian sebagian orang tentang Paulus; dapat juga diterjemahkan “rendah” atau, secara lebih interpretatif, “tidak berani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Aku sendiri, Paulus
  rationale: Kata ganti intensif dan penyebutan nama menegaskan bahwa Paulus mengajukan permohonan ini secara pribadi. δέ menandai peralihan ringan dan tidak perlu diterjemahkan dengan penghubung yang kuat.
- source_word: παρακαλῶ ὑμᾶς
  choice: memohon kepadamu
  rationale: Dalam konteks ini παρακαλῶ menyampaikan permohonan pribadi yang sungguh-sungguh, bukan perintah.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: demi kelemahlembutan dan kelapangan hati
  rationale: διά dengan genitif menyatakan dasar permohonan. 'Kelemahlembutan' mempertahankan mutu πραΰτης, sedangkan 'kelapangan hati' menyampaikan sikap tenggang, tidak keras, dan penuh pertimbangan dalam ἐπιείκεια tanpa sekadar mengulang kata 'lembut'.
- source_word: τοῦ Χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Mesias' menerjemahkan makna gelar itu dalam bahasa Indonesia.
- source_word: κατὰ πρόσωπον
  choice: ketika berhadapan muka dengan muka
  rationale: Ungkapan harfiahnya berkaitan dengan muka dan dalam konteks berarti saat hadir secara langsung, berlawanan dengan ἀπών.
- source_word: ταπεινὸς ἐν ὑμῖν
  choice: rendah hati di tengah-tengah kamu
  rationale: '''Rendah hati'' mempertahankan cakupan leksikal ταπεινός dan membiarkan kemungkinan bahwa Paulus sedang menggemakan penilaian ironis lawan-lawannya.'
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: tetapi ketika tidak hadir bersikap berani terhadap kamu
  rationale: Partisip ἀπών dibaca secara temporal; θαρρῶ menyatakan keberanian atau keyakinan, dan 'terhadap kamu' menjaga arah εἰς tanpa menambahkan nuansa permusuhan.
theological_decisions:
- issue: Penerjemahan Χριστοῦ
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini berfungsi sebagai gelar. Menerjemahkannya sebagai 'Mesias' mempertahankan arti dan gema mesianiknya.
- issue: Nada ταπεινός dalam gambaran diri Paulus
  choice: rendah hati
  alternative: rendah; takut-takut
  rationale: Bahasa Yunani dapat mengandung ironi dan mungkin menggemakan tuduhan terhadap Paulus, tetapi tidak menandainya sebagai kutipan. Pilihan ini tidak memastikan apakah Paulus menerima atau menyindir penilaian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi, bermartabat, dan cukup langsung. Pronomina 'aku/kamu' dipakai untuk mempertahankan kedekatan retoris surat tanpa menjadi kasar. Tanda pisah mempertahankan sisipan tajam dalam argumentasi Paulus.
