  to: Aku sendiri, Paulus, memohon kepada kalian demi kelemahlembutan dan kemurahan Mesias—aku yang, ketika hadir di tengah kalian, rendah hati,[a] tetapi ketika tidak hadir berani terhadap kalian.
  rationale: Revisi mengganti idiom yang tidak alami dengan padanan kontekstual untuk κατὰ πρόσωπον, memperjelas penerima jamak, dan memilih padanan yang lebih tepat serta alami bagi ἐπιείκεια. Ketegangan ironis yang mungkin pada ταπεινός tetap dipertahankan dalam teks utama dan dijelaskan secara terbatas dalam catatan kaki.
