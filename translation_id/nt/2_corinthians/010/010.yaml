source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: id
  text: Sebab, katanya[a], “Surat-suratnya berbobot dan kuat, tetapi kehadiran fisiknya lemah, dan perkataannya dipandang hina[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “katanya” (bentuk tunggal). Dalam konteks ini, ungkapan itu melaporkan pendapat para pengkritik Paulus; dapat juga diterjemahkan, “kata mereka” atau “kata orang”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dianggap remeh” atau “dianggap tidak berarti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks ini, ὅτι memperkenalkan alasan atau isi yang mendukung pernyataan sebelumnya; “Sebab” mempertahankan hubungan argumentatif itu secara wajar dalam bahasa Indonesia.
- source_word: ἐπιστολαὶ
  choice: surat-surat
  rationale: Kata ini menunjuk pada surat-menyurat Paulus; bentuk jamak dipertahankan secara langsung dan alami.
- source_word: μέν ... δὲ
  choice: '... tetapi ...'
  rationale: Pasangan ini menandai kontras antara kesan yang diberikan surat-surat Paulus dan kehadiran serta perkataannya secara langsung.
- source_word: φησίν
  choice: katanya
  rationale: Bentuk Yunani secara gramatikal tunggal, “katanya,” dan dapat berfungsi sebagai formula kutipan parentetis yang menyuarakan kritik yang sedang dilaporkan. Bentuk tunggal dipertahankan agar ambiguitas sumber tetap terlihat.
- source_word: βαρεῖαι
  choice: berbobot
  rationale: “Berbobot” mempertahankan metafora berat sekaligus menyampaikan kesan serius dan berpengaruh dalam bahasa Indonesia modern.
- source_word: ἰσχυραί
  choice: kuat
  rationale: Padanan langsung ini mempertahankan daya retoris surat-surat tersebut tanpa penafsiran tambahan.
- source_word: παρουσία τοῦ σώματος
  choice: kehadiran fisiknya
  rationale: Frasa ini mengacu pada kehadiran Paulus secara langsung dan jasmani, sebagai lawan dari surat-suratnya. “Kehadiran fisiknya” alami dan jelas.
- source_word: ἀσθενὴς
  choice: lemah
  rationale: Padanan ini mempertahankan penilaian para pengkritik tanpa menentukan apakah yang dimaksud ialah penampilan, kesehatan, atau daya kesan.
- source_word: λόγος
  choice: perkataannya
  rationale: Dalam kontras dengan surat tertulis dan kehadiran langsung, kata ini menunjuk pada ujaran atau cara Paulus berbicara. “Perkataannya” cukup luas untuk tidak mempersempitnya menjadi gaya pidato saja.
- source_word: ἐξουθενημένος
  choice: dipandang hina
  rationale: Bentuk pasif ini menyatakan bahwa perkataannya dinilai rendah atau dianggap tidak berarti. “Dipandang hina” mempertahankan unsur penilaian pihak lain dan tidak menyatakan bahwa perkataan itu pada hakikatnya hina.
theological_decisions:
- issue: Apakah kritik terhadap Paulus dinyatakan sebagai penilaian narator atau sebagai kutipan lawan-lawannya
  choice: Kritik disajikan sebagai pendapat yang dikutip melalui “katanya”.
  alternative: Menerjemahkannya secara impersonal sebagai “kata orang” atau dalam bentuk jamak “kata mereka”.
  rationale: Teks Yunani memakai φησίν dalam bentuk tunggal, sedangkan konteks menunjukkan pendapat para pengkritik Paulus. Terjemahan utama mempertahankan bentuk tunggal dan menandai bahwa ini adalah ucapan yang dilaporkan, bukan pengesahan narator.
- issue: Sifat kelemahan kehadiran Paulus
  choice: “lemah” dibiarkan tanpa penjelasan tambahan.
  alternative: “tidak mengesankan” atau “tampak lemah”.
  rationale: Teks tidak menjelaskan apakah kelemahan itu bersifat fisik, retoris, atau sekadar kesan para pengkritik; terjemahan tidak boleh menyelesaikan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Berbobot dan kuat” mempertahankan kesejajaran retoris teks Yunani, sedangkan “dipandang hina” menjaga nuansa pasif berupa penilaian pihak lain.
