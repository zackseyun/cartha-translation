id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: id
  text: Namun, kami tidak akan bermegah melampaui batas, melainkan sesuai dengan ukuran wilayah[a] yang Allah tetapkan bagi kami—ukuran yang menjangkau bahkan sampai kepada kalian—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “wilayah” juga dapat berarti “batas”, “patokan”, atau “kaidah”; dalam konteks ini kata tersebut menunjuk pada lingkup yang diukur dan ditetapkan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: melampaui batas
  rationale: Dalam ungkapan ini, kata tersebut menunjuk pada tindakan melewati batas yang semestinya. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan gambaran tentang ukuran dan batas.
- source_word: καυχησόμεθα
  choice: kami tidak akan bermegah
  rationale: Kata kerja ini menyatakan bermegah atau membanggakan klaim tertentu dalam konteks polemis. Bentuk mendatang dipertahankan dengan 'akan'.
- source_word: κατὰ τὸ μέτρον
  choice: sesuai dengan ukuran
  rationale: Pilihan ini mempertahankan metafora pengukuran dan menyatakan kesesuaian dengan batas yang telah diberikan.
- source_word: κανόνος
  choice: wilayah
  rationale: Dalam konteks ini, kata tersebut terutama menunjuk pada lingkup atau wilayah pelayanan yang diukur dan ditetapkan, bukan semata-mata kaidah moral.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: yang Allah tetapkan bagi kami
  rationale: μερίζω di sini menyatakan pembagian atau penetapan suatu porsi. 'Tetapkan bagi kami' alami dalam bahasa Indonesia dan menyampaikan bahwa lingkup itu berasal dari Allah.
- source_word: μέτρου
  choice: ukuran
  rationale: Pengulangan kata 'ukuran' dipertahankan karena teks Yunani mengulangi μέτρον, walaupun hubungan sintaksisnya bersifat menjelaskan atau menegaskan.
- source_word: ἐφικέσθαι
  choice: yang menjangkau
  rationale: Infinitif ini menerangkan luasnya ukuran atau wilayah yang ditetapkan. 'Menjangkau' mempertahankan nuansa ruang dan mengalir alami menuju frasa berikutnya.
- source_word: ἄχρι καὶ ὑμῶν
  choice: bahkan sampai kepada kalian
  rationale: ἄχρι menandai jangkauan, sedangkan καί memberi penekanan. 'Kalian' memperjelas bahwa kata ganti Yunani berbentuk jamak.
theological_decisions:
- issue: Makna κανών dalam klaim Paulus mengenai pelayanannya
  choice: Wilayah pelayanan yang ditetapkan Allah dan mencakup jemaat Korintus
  alternative: Kaidah atau patokan yang menjadi tolok ukur kemegahan Paulus
  rationale: Konteks langsung menekankan ukuran, batas, pembagian, dan jangkauan sampai kepada jemaat Korintus. Karena itu, makna spasial berupa lingkup pelayanan lebih menonjol, tetapi kemungkinan makna 'patokan' tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. 'Bermegah' dipertahankan sebagai istilah yang tepat bagi konteks argumentasi Paulus. 'Kalian' digunakan untuk menunjukkan bentuk jamak ὑμῶν. Tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
