  text: Ὁ δὲ καυχώμενος ἐν κυρίῳ καυχάσθω·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: id
  text: Namun, “Siapa yang bermegah, hendaklah ia bermegah di dalam Tuhan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan susunan yang lebih harfiah, “Orang yang bermegah, hendaklah bermegah di dalam Tuhan.” Paulus tampaknya menggemakan Yeremia 9:24 (dalam Septuaginta: 9:23).'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: Siapa yang bermegah
  rationale: Artikel dengan partisipel kini berfungsi secara substantival dan merujuk secara umum kepada orang yang bermegah. Bentuk “siapa yang” alami dalam bahasa Indonesia dan mempertahankan cakupan generiknya.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kontras ringan dengan argumen sebelumnya. “Namun” menyampaikan peralihan adversatif itu secara wajar dan bermartabat.
- source_word: καυχώμενος / καυχάσθω
  choice: bermegah / hendaklah ia bermegah
  rationale: καυχάομαι berarti bermegah atau membanggakan diri. “Bermegah” mempertahankan pengulangan retoris serta dapat mencakup kebanggaan yang salah maupun yang diarahkan dengan benar; “hendaklah” menyampaikan daya imperatif orang ketiga.
- source_word: ἐν
  choice: di dalam
  rationale: Dengan καυχάομαι, ἐν menunjukkan lingkup atau dasar kemegahan. “Di dalam Tuhan” mempertahankan konstruksi Yunani dan gema ungkapan Kitab Suci.
- source_word: κυρίῳ
  choice: Tuhan
  rationale: κύριος diterjemahkan “Tuhan”. Teks tidak memperjelas lebih jauh apakah rujukan langsungnya adalah Allah dalam gema Yeremia atau Tuhan Yesus dalam pemakaian Paulus, sehingga terjemahan tidak menentukannya secara berlebihan.
theological_decisions:
- issue: Rujukan κυρίῳ dalam konteks kutipan atau alusi
  choice: Tuhan
  alternative: Tuhan Yesus; Allah
  rationale: Paulus tampaknya menggemakan Yeremia 9:24, tetapi hanya memakai κυρίῳ. “Tuhan” menjaga resonansi Kitab Suci dan ketegangan rujukan dalam pemakaian Paulus tanpa menambahkan identifikasi yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Bermegah” dipilih untuk menjaga pengulangan kata Yunani dan nuansa teologisnya; bentuk imperatif “hendaklah” sesuai untuk kutipan bernada pepatah atau nas Kitab Suci.
