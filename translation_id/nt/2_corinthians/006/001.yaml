  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: id
  text: Sambil bekerja bersama dengan Allah[a], kami juga mendesak kamu agar tidak menerima anugerah Allah dengan sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sambil bekerja bersama, kami juga mendesak kamu.” Dalam bahasa Yunani, pihak yang bekerja bersama Paulus tidak disebutkan secara eksplisit, meskipun konteks kuat menunjuk kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Sebagai rekan sekerja Allah
  rationale: Partisipel ini menggambarkan Paulus dan rekan-rekannya sebagai orang yang bekerja bersama pihak lain. Konteks 5:18–20 paling mungkin menunjuk kepada Allah; bahasa Indonesia memerlukan ungkapan yang lebih lengkap agar alami. Catatan kaki mempertahankan kemungkinan bahwa mitra kerja itu tidak disebutkan secara eksplisit dalam bahasa Yunani.
- source_word: δὲ καὶ
  choice: juga
  rationale: δέ berfungsi sebagai penghubung ringan yang dapat diserap dalam alur kalimat, sedangkan καί menyatakan penambahan tindakan mendesak.
- source_word: παρακαλοῦμεν
  choice: kami ... mendesak
  rationale: Kata ini menyatakan permohonan atau dorongan yang sungguh-sungguh. 'Mendesak' jelas, kuat, dan wajar dalam bahasa Indonesia modern.
- source_word: μὴ εἰς κενὸν
  choice: agar tidak ... dengan sia-sia
  rationale: εἰς κενόν merupakan idiom yang berarti tanpa hasil atau tanpa mencapai tujuannya. 'Dengan sia-sia' mempertahankan daya retoris ungkapan itu.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: anugerah Allah
  rationale: '''Anugerah'' merupakan padanan Indonesia yang lazim dan bermartabat bagi χάρις dalam pemakaian teologis Paulus, sementara konstruksi genitif diterjemahkan secara langsung.'
- source_word: δέξασθαι ὑμᾶς
  choice: kamu ... menerima
  rationale: Konstruksi akusatif dan infinitif sesudah παρακαλοῦμεν secara alami menjadi 'mendesak kamu agar ... menerima' dalam bahasa Indonesia.
theological_decisions:
- issue: Mitra yang tersirat dalam Συνεργοῦντες
  choice: Allah disebut sebagai mitra kerja Paulus dan rekan-rekannya.
  alternative: 'Terjemahkan tanpa menyebut mitra: ''Sebagai rekan-rekan sekerja'' atau ''Sambil bekerja bersama-sama''.'
  rationale: Konteks terdekat menekankan karya pendamaian Allah dan pelayanan para utusan-Nya (5:18–20), sehingga Allah adalah rujukan yang paling mungkin. Karena teks Yunani tidak menyebut objeknya secara eksplisit, alternatif yang lebih harfiah dicantumkan dalam catatan kaki.
- issue: Makna menerima anugerah 'dengan sia-sia'
  choice: Ungkapan dibiarkan terbuka sebagai peringatan agar penerimaan anugerah Allah tidak menjadi tanpa hasil atau tujuan.
  alternative: Menjelaskannya secara khusus sebagai kehilangan keselamatan, kurangnya buah etis, atau penolakan terhadap pelayanan Paulus.
  rationale: Ayat ini sendiri tidak merinci akibat atau bentuk kesia-siaan tersebut. Terjemahan tidak boleh menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'kami' mencerminkan penutur jamak, sedangkan 'kamu' mewakili penerima jamak tanpa menambahkan penanda yang terasa berat. Bentuk 'rekan sekerja Allah' dipilih agar alami, dengan ambiguitas sumber dijaga melalui catatan kaki.
