source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: id
  text: dalam kemurnian, dalam pengetahuan, dalam kesabaran, dalam kebaikan hati, dalam Roh Kudus[a], dalam kasih yang tulus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam roh yang kudus,” jika frasa ini dipahami sebagai gambaran tentang sikap batin yang kudus, bukan tentang Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: kemurnian
  rationale: ἁγνότης menunjuk pada kemurnian atau kebersihan moral secara luas. “Kemurnian” mempertahankan keluasan makna itu tanpa membatasinya pada kesucian seksual.
- source_word: γνώσει
  choice: pengetahuan
  rationale: γνῶσις berarti pengetahuan dan dalam konteks pelayanan dapat mencakup pengertian praktis serta rohani. “Pengetahuan” merupakan padanan Indonesia yang langsung dan cukup luas.
- source_word: μακροθυμίᾳ
  choice: kesabaran
  rationale: μακροθυμία menyatakan ketabahan dan kesabaran yang panjang dalam menghadapi orang atau keadaan sulit. “Kesabaran” paling wajar dalam bahasa Indonesia modern.
- source_word: χρηστότητι
  choice: kebaikan hati
  rationale: χρηστότης menunjuk pada sikap baik, ramah, dan penuh kemurahan terhadap orang lain. “Kebaikan hati” menyampaikan sifat relasional ini tanpa menyempitkannya menjadi pemberian materi.
- source_word: πνεύματι ἁγίῳ
  choice: Roh Kudus
  rationale: Dalam pemakaian Paulus, frasa ini paling mungkin menunjuk kepada Roh ilahi. Huruf kapital menandai rujukan tersebut, sementara kemungkinan bahwa frasa ini menggambarkan roh atau sikap manusia dipertahankan dalam catatan kaki.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: kasih yang tulus
  rationale: ἀγάπη berarti kasih, sedangkan ἀνυπόκριτος berarti tanpa kemunafikan atau kepura-puraan. “Kasih yang tulus” alami dan tepat dalam bahasa Indonesia.
- source_word: ἐν
  choice: dalam
  rationale: Pengulangan ἐν dapat menyatakan lingkup, cara, atau sarana. Pengulangan “dalam” mempertahankan irama retoris dan ketaksaan hubungan sintaksis dalam daftar Yunani.
theological_decisions:
- issue: Rujukan πνεύματι ἁγίῳ
  choice: “Roh Kudus” sebagai Roh ilahi
  alternative: “roh yang kudus” sebagai watak atau sikap manusia yang kudus
  rationale: Pemakaian Paulus dan konteks pelayanan membuat rujukan kepada Roh ilahi lebih mungkin. Namun, karena bentuk Yunani juga dapat dipahami sebagai gambaran tentang roh atau sikap manusia, alternatif itu dicatat tanpa menghapus ketaksaan yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “dalam” sengaja dipertahankan untuk mencerminkan susunan anaforis teks Yunani. “Kebaikan hati” dipilih daripada “kemurahan hati” agar χρηστότης tidak disalahpahami terutama sebagai kedermawanan materi.
