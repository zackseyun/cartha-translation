language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: id
  text: Sebab Dia berfirman, “Pada waktu yang berkenan Aku telah mendengarkan engkau[a], dan pada hari keselamatan Aku telah menolong engkau.” Lihatlah, sekarang adalah waktu yang sangat berkenan; lihatlah, sekarang adalah hari keselamatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku mendengar engkau dengan berkenan.” Kata kerja ini dapat menyiratkan bahwa seseorang didengar dengan penerimaan atau tanggapan yang baik.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, kedua frasa penutup ini tidak memakai artikel tentu. Dapat juga diterjemahkan, “sekarang adalah waktu yang sangat berkenan; ... sekarang adalah hari keselamatan.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Sebab Dia berfirman
  rationale: γάρ memberi alasan bagi seruan sebelumnya, sedangkan λέγει memperkenalkan kutipan Kitab Suci sebagai perkataan ilahi yang tetap berlaku. “Berfirman” wajar dalam bahasa Indonesia ketika subjeknya Allah.
- source_word: Καιρῷ δεκτῷ
  choice: Pada waktu yang berkenan
  rationale: καιρός menunjuk pada waktu atau kesempatan yang tepat, dan δεκτός pada sesuatu yang diterima atau diperkenan. Ungkapan ini mempertahankan nuansa perkenanan ilahi secara alami.
- source_word: ἐπήκουσά σου
  choice: Aku mendengarkan engkau
  rationale: ἐπακούω berarti mendengar atau mendengarkan, sering dengan nuansa menerima secara baik atau menanggapi. “Mendengarkan” mempertahankan nuansa respons tanpa mempersempitnya menjadi “menjawab”.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: pada hari keselamatan
  rationale: Frasa tanpa artikel ini paling alami dalam bahasa Indonesia tanpa kata sandang; bentuk tersebut tidak memaksa pembacaan tentu ataupun tak tentu.
- source_word: ἐβοήθησά σοι
  choice: Aku menolong engkau
  rationale: βοηθέω berarti menolong atau datang memberi bantuan. “Menolong” jelas, langsung, dan sesuai dengan register kutipan.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: ἰδού merupakan partikel penarik perhatian yang kuat. “Lihatlah” menjaga tekanan retoris dan kekhidmatan tanpa memakai bentuk yang usang.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: waktu yang sungguh berkenan itu
  rationale: εὐπρόσδεκτος menyatakan sesuatu yang sangat diterima atau diperkenan dan lebih kuat daripada δεκτός. “Sungguh berkenan” mempertahankan penguatan tersebut; “itu” membuat klausa predikatif ini alami dan menghubungkannya dengan waktu dalam kutipan tanpa mengandaikan adanya artikel Yunani.
- source_word: ἡμέρα σωτηρίας
  choice: hari keselamatan itu
  rationale: Bahasa Indonesia tidak memiliki artikel tentu yang sepadan dengan bahasa Inggris. “Itu” di sini bersifat anaforis, mengaitkan penerapan Paulus dengan “hari keselamatan” dalam kutipan, bukan menyatakan bahwa teks Yunani memakai artikel.
theological_decisions:
- issue: Ketentuan atau ketaktentuan ungkapan waktu yang berkenan dan hari keselamatan
  choice: Gunakan frasa Indonesia tanpa artikel dalam kutipan, lalu partikel anaforis “itu” dalam penerapan Paulus.
  alternative: “suatu waktu yang berkenan” / “suatu hari keselamatan,” atau semuanya tanpa “itu”
  rationale: Semua frasa Yunani terkait tidak memakai artikel, tetapi bahasa Indonesia tidak wajib menandai ketaktentuan dengan “suatu.” Dalam penerapan Paulus, “itu” menghasilkan kalimat predikatif yang alami sekaligus merujuk kembali pada istilah kutipan, tanpa menetapkan skema eskatologis yang lebih sempit daripada teks.
- issue: Subjek λέγει dalam rumus pengutipan
  choice: “Dia berfirman,” dengan rujukan kepada Allah.
  alternative: “Kitab Suci berkata” atau “tertulis”
  rationale: Pembicara dalam kutipan adalah Allah. Bentuk personal mempertahankan tekstur teologis rumus pengutipan Paulus tanpa menambahkan penjelasan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kapitalisasi “Dia/Aku” mengikuti rujukan kepada Allah. “Engkau” dipertahankan dalam kutipan ilahi karena tetap mudah dipahami dan sesuai dengan register Alkitab; “Lihatlah” mempertahankan desakan ganda ἰδού.
