  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: id
  text: Kalian tidak dibatasi oleh kami,[a] tetapi kasih sayang kalian sendirilah yang terbatas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Kalian tidak terhimpit di dalam kami, tetapi terhimpit di dalam perasaan batin kalian sendiri.”
    reason: Mempertahankan preposisi ἐν, metafora ruang sempit dalam στενοχωρεῖσθε, serta nuansa kiasan σπλάγχνα.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: dibatasi
  rationale: Kata kerja ini menggambarkan keadaan berada di ruang sempit dan, secara kiasan, berada di bawah pembatasan. Pengulangan pilihan yang sama pada kedua klausa mempertahankan kontras retoris Paulus.
- source_word: ἐν ἡμῖν
  choice: oleh kami
  rationale: Walaupun ἐν secara harfiah dapat berarti “di dalam”, dalam konteks relasional ini frasa tersebut menyatakan bahwa Paulus dan rekan-rekannya bukan pihak yang menyebabkan pembatasan itu. “Oleh kami” paling alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai pertentangan langsung antara kedua klausa.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: oleh kasih sayang kalian sendiri
  rationale: σπλάγχνα secara harfiah menunjuk organ-organ dalam, tetapi secara kiasan berarti perasaan batin atau kasih sayang. Bentuk “oleh” membuat sumber pembatasan jelas dalam bahasa Indonesia, sedangkan “sendiri” menegaskan bahwa hambatan itu terletak pada pihak jemaat Korintus.
- source_word: οὐ
  choice: tidak
  rationale: Negasi langsung terhadap klausa pertama.
theological_decisions:
- issue: Makna kiasan σπλάγχνα
  choice: Kasih sayang atau kapasitas afektif batin jemaat Korintus
  alternative: Organ-organ dalam atau hati
  rationale: 'Konteksnya adalah hubungan Paulus dengan jemaat Korintus: keterbatasan respons mereka bersumber dari batin mereka, bukan dari Paulus. Terjemahan kiasan menyampaikan maksud tersebut tanpa mengubahnya menjadi sekadar persoalan intelektual.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”, sesuai bentuk orang kedua jamak dan nada langsung Paulus. Diksi dibuat ringkas, wajar, dan bermartabat; catatan kaki mempertahankan metafora serta susunan Yunani yang lebih harfiah.
