id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: id
  text: Lalu, keselarasan apa yang ada antara Mesias dan Beliar[a]? Atau bagian apa yang dimiliki bersama oleh orang percaya dan orang yang tidak percaya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliar: Yunani Βελιάρ; bentuk alternatif nama ini adalah “Belial”.'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: keselarasan
  rationale: Kata ini menyatakan kesesuaian atau keharmonisan. “Keselarasan” alami dalam bahasa Indonesia dan mempertahankan daya retoris pertentangan tersebut.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Di sini Χριστός tampil sebagai gelar dalam pertentangan konseptual dengan Beliar; “Mesias” mempertahankan fungsi gelarnya.
- source_word: Βελιάρ
  choice: Beliar
  rationale: Nama diri ini ditransliterasikan langsung dari bentuk Yunani Βελιάρ. Bentuk alternatif yang lebih dikenal, “Belial”, dicantumkan dalam catatan kaki.
- source_word: μερίς
  choice: bagian yang dimiliki bersama
  rationale: μερίς berarti bagian atau porsi. Dalam konstruksi ini, ungkapan tersebut menyampaikan gagasan tentang bagian atau kepentingan bersama dengan jelas dan wajar.
- source_word: πιστῷ
  choice: orang percaya
  rationale: Adjektiva ini dipakai secara substantival untuk menunjuk seseorang yang percaya; “orang percaya” merupakan padanan Indonesia yang lazim dan jelas.
- source_word: ἀπίστου
  choice: orang yang tidak percaya
  rationale: Dalam pertentangannya dengan πιστῷ, kata ini menunjuk orang yang tidak percaya. Pilihan ini menghindari kemungkinan arti “tidak setia” yang kurang sesuai dalam konteks ini.
- source_word: πρὸς
  choice: antara
  rationale: Bersama συμφώνησις, preposisi ini secara idiomatis menyatakan hubungan antara kedua pihak.
- source_word: μετὰ
  choice: dimiliki bersama oleh
  rationale: Preposisi ini menyatakan persekutuan atau keterkaitan. Susunan Indonesia ini membuat gagasan memiliki bagian bersama terdengar alami.
- source_word: δὲ
  choice: Lalu
  rationale: δέ meneruskan rangkaian pertanyaan retoris. “Lalu” menandai kelanjutan tanpa memberi tekanan pertentangan yang berlebihan.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pasangan antitetis dengan Beliar, Χριστός berfungsi terutama sebagai gelar. “Mesias” mempertahankan fungsi tersebut tanpa mengubahnya menjadi bentuk yang lebih menyerupai nama diri.
- issue: Identitas Βελιάρ
  choice: Beliar sebagai nama diri
  alternative: Belial
  rationale: Teks utama mempertahankan bentuk nama dalam sumber Yunani tanpa menambahkan identifikasi teologis yang tidak dinyatakan secara eksplisit. Bentuk alternatif “Belial” diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Dua pertanyaan retoris serta kesejajaran antitetis teks sumber dipertahankan.
