  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: id
  text: dalam pemberitaan kebenaran[a], dalam kuasa Allah; dengan senjata-senjata kebenaran[b] di tangan kanan dan di tangan kiri[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dalam perkataan yang benar” atau “dalam berita kebenaran”.
    reason: lexical_alternative
  - marker: b
    text: Atau “senjata-senjata keadilan”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang kanan dan yang kiri”. Kemungkinan besar gambarannya ialah senjata atau perlengkapan di tangan kanan dan di tangan kiri, yang menyiratkan kesiapan penuh untuk menyerang maupun bertahan.
