lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: perkataan kebenaran
  rationale: Ungkapan ini mempertahankan bentuk genitif Yunani dan tetap membuka kemungkinan makna perkataan yang benar maupun berita atau pemberitaan kebenaran.
- source_word: δυνάμει θεοῦ
  choice: kuasa Allah
  rationale: Padanan langsung dan alami untuk konstruksi genitif ini, sekaligus mempertahankan kesejajaran dengan frasa sebelumnya.
- source_word: διὰ
  choice: dengan
  rationale: Dengan kasus genitif, διά menyatakan sarana. Dalam konteks senjata, 'dengan' lebih alami dalam bahasa Indonesia daripada 'melalui' tanpa menghilangkan makna instrumental.
- source_word: ὅπλων
  choice: senjata-senjata
  rationale: ὅπλον dapat menunjuk perlengkapan perang untuk menyerang maupun bertahan. 'Senjata-senjata' mempertahankan bentuk jamak dan tidak mempersempitnya hanya menjadi perlengkapan pelindung.
- source_word: δικαιοσύνης
  choice: kebenaran
  rationale: Dalam pemakaian Paulus, δικαιοσύνη mencakup keadaan atau tindakan yang benar dan dapat pula bernuansa keadilan. 'Kebenaran' merupakan padanan utama yang lazim, sementara 'keadilan' dicatat sebagai alternatif.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: di tangan kanan dan di tangan kiri
  rationale: Kata sifat kanan dan kiri dipakai secara substantival; 'tangan' dilengkapi agar gambaran militer jelas dan alami dalam bahasa Indonesia. Pengulangan 'di tangan' menegaskan kedua sisi.
theological_decisions:
- issue: Cakupan makna δικαιοσύνη dalam ungkapan Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Teks utama memakai padanan yang luas dan lazim tanpa menentukan secara sempit apakah yang dimaksud ialah status benar, perilaku benar, atau sarana yang benar dari Allah. Kemungkinan nuansa keadilan tetap dipertahankan dalam catatan kaki.
- issue: Makna λόγῳ ἀληθείας
  choice: perkataan kebenaran
  alternative: perkataan yang benar; berita kebenaran
  rationale: Bentuk yang dipilih tidak memutuskan apakah Paulus terutama berbicara tentang tutur kata yang benar atau pemberitaan berita kebenaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'dalam' serta 'di tangan' dipertahankan untuk mengikuti ritme daftar Yunani dan memperjelas kesejajaran. Tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari rangkaian kalimat yang berlanjut.
