    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: sebagai orang yang
  rationale: Mengawali setiap gambaran paradoks secara alami dalam bahasa Indonesia sambil mempertahankan pengulangan retoris Yunani.
- source_word: ἀγνοούμενοι
  choice: tidak dikenal
  rationale: Menyatakan bahwa mereka tidak dikenal atau tidak diakui orang lain dan membentuk kontras langsung dengan ἐπιγινωσκόμενοι.
- source_word: ἐπιγινωσκόμενοι
  choice: diakui
  rationale: Kata kerja ini dapat menekankan pengenalan atau pengakuan yang jelas; 'diakui' mempertahankan kontras tanpa membatasinya pada ketenaran.
- source_word: ἀποθνῄσκοντες
  choice: sedang menghadapi maut
  rationale: Mengungkapkan keadaan terus-menerus berada di ambang kematian tanpa menyamakannya dengan θανατούμενοι pada bagian akhir.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan seruan mendadak yang mengarahkan perhatian dan tetap wajar dalam ragam Indonesia yang bermartabat.
- source_word: ζῶμεν
  choice: kami hidup
  rationale: Mencerminkan bentuk kini yang sederhana dan mempertahankan paradoks tajam dengan keadaan menghadapi maut.
- source_word: παιδευόμενοι
  choice: didisiplinkan
  rationale: Mencakup disiplin korektif maupun pembentukan tanpa memastikan bahwa penderitaan tersebut merupakan hukuman.
- source_word: μὴ θανατούμενοι
  choice: tidak dihukum mati
  rationale: Mempertahankan bentuk pasif dan membedakannya dari gagasan sedang menghadapi maut, meski frasa ini juga dapat dipahami secara lebih umum sebagai tidak dibunuh.
theological_decisions:
- issue: Makna παιδευόμενοι dalam kaitannya dengan penderitaan
  choice: didisiplinkan
  alternative: dididik atau dihajar
  rationale: Pilihan ini mempertahankan kemungkinan pembentukan maupun koreksi melalui penderitaan tanpa menetapkan teologi hukuman tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'sebagai orang yang ... tetapi ...' mempertahankan susunan paradoks Paulus; 'lihatlah' mempertahankan daya seru ἰδοὺ.
