  text: sebagai orang yang tidak dikenal, namun diakui[a]; sebagai orang yang sedang sekarat dan, lihatlah, kami hidup; sebagai orang yang didisiplinkan, namun tidak dibunuh[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikenali dengan jelas.” Kata Yunaninya dapat menekankan pengenalan atau pengakuan penuh, bukan sekadar dikenal luas.
    reason: lexical_alternative
