  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk ἀφορίσθητε, yang merupakan imperatif pasif jamak. Draf “pisahkanlah dirimu” menggesernya menjadi perintah refleksif/aktif dan menggunakan bentuk singular. “Hendaklah kamu terpisah” menyampaikan keadaan pemisahan yang diperintahkan tanpa memaksakan pelaku tindakan. Klausa terakhir sebaiknya memakai “dan”, sesuai καὶ, bukan “maka”, yang menambahkan hubungan konsekuensial eksplisit.
  naturalness: Teks revisi tetap baku dan bernada kenabian. “Firman Tuhan” wajar sebagai formula kutipan kenabian; penghubung “dan” membuat rangkaian perintah dan janji lebih dekat dengan susunan Yunani.
  terminology: “Tuhan,” “najis,” dan “menerima kamu” tepat untuk κύριος, ἀκάθαρτος, dan εἰσδέξομαι ὑμᾶς. Kapitalisasi “Aku” dipertahankan sebagai konvensi penerbitan bagi ujaran ilahi.
  issues:
