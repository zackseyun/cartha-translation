    issue: “pisahkanlah dirimu” untuk ἀφορίσθητε
    rationale: Bentuk Yunani adalah imperatif pasif jamak, sedangkan “pisahkanlah dirimu” bernuansa aktif-refleksif dan bentuk “dirimu” singular. Terjemahan perlu mempertahankan perintah untuk berada dalam keadaan terpisah tanpa menghilangkan ambiguitas diatesis.
  - severity: low
    issue: “maka Aku akan menerima kamu” untuk καὶ ἐγὼ εἰσδέξομαι ὑμᾶς
    rationale: καί secara langsung berarti “dan”. “Maka” dapat terdengar sebagai konsekuensi yang lebih eksplisit daripada yang dinyatakan teks, sehingga “dan” lebih setia.
