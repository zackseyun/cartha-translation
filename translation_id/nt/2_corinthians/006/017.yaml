language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: id
  text: Karena itu, keluarlah dari tengah-tengah mereka dan hendaklah kamu terpisah[a], firman Tuhan, dan janganlah menyentuh apa pun yang najis[b][c]; dan Aku akan menerima kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pisahkanlah diri kalian” atau “biarlah kamu dipisahkan.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “jangan menyentuh yang najis.”'
    reason: lexical_alternative
  - marker: c
    text: Paulus menggemakan bahasa kenabian Perjanjian Lama, terutama Yesaya 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari argumen sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: keluarlah dari tengah-tengah mereka
  rationale: Mempertahankan perintah tegas untuk meninggalkan lingkungan atau persekutuan yang dimaksud, sekaligus mengikuti ungkapan spasial-sosial teks Yunani.
- source_word: ἀφορίσθητε
  choice: pisahkanlah dirimu
  rationale: Menyampaikan perintah jamak berbentuk pasif dengan idiom Indonesia yang wajar; alternatif yang lebih eksplisit tentang keadaan 'terpisah' dicatat dalam catatan kaki.
- source_word: λέγει κύριος
  choice: firman Tuhan
  rationale: Merupakan rumusan kenabian yang baku, alami, dan bermartabat dalam bahasa Indonesia; κύριος diterjemahkan 'Tuhan' tanpa mengimpor bentuk khusus nama ilahi.
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: Jangan menyentuh apa pun yang najis
  rationale: Mempertahankan citra kenajisan dan larangan menyentuh, sementara 'apa pun' secara alami menyubstantifkan bentuk netral tunggal Yunani tanpa menentukan benda tertentu.
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: maka Aku akan menerima kamu
  rationale: Mengungkapkan tanggapan ilahi yang mengikuti perintah sebelumnya; 'menerima' mempertahankan nuansa penerimaan yang baik dan bernada perjanjian.
theological_decisions:
- issue: Penerjemahan κύριος dalam gema kutipan Perjanjian Lama
  choice: Tuhan
  alternative: TUHAN; Tuan
  rationale: Teks Yunani Perjanjian Baru memakai κύριος. 'Tuhan' mempertahankan bentuk teks tanpa memasukkan secara eksplisit nama ilahi Ibrani.
- issue: Daya perintah pemisahan
  choice: pisahkanlah dirimu
  alternative: hendaklah kamu terpisah; biarlah kamu dipisahkan
  rationale: Menyatakan tuntutan untuk memisahkan diri tanpa menafsirkan perintah itu sebagai penarikan diri dari semua orang di luar komunitas iman. Ambiguitas bentuk pasif dan kemungkinan nuansa 'dikhususkan' dicatat.
- issue: Hubungan klausa terakhir dengan perintah
  choice: maka Aku akan menerima kamu
  alternative: dan Aku akan menerima kamu
  rationale: καί dapat sekadar berarti 'dan', tetapi dalam rangkaian nasihat dan janji ini bahasa Indonesia secara alami dapat menyatakan hubungan konsekuensial dengan 'maka' tanpa menjadikannya formula keselamatan berdasarkan perbuatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang bermartabat. Bentuk jamak Yunani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat merujuk kepada jamak. Kapitalisasi 'Aku' menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia.
