id: 2CO.6.10
reference: 2 Corinthians 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: id
  text: sebagai orang yang berdukacita, tetapi selalu bersukacita; sebagai orang miskin, tetapi membuat banyak orang menjadi kaya[a]; sebagai orang yang tidak mempunyai apa-apa, tetapi memiliki segala sesuatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kekayaan yang dimaksud dalam konteks ini kemungkinan bukan kekayaan materi, melainkan kekayaan rohani.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, meskipun secara lahiriah tidak mempunyai apa-apa, Paulus menyatakan bahwa dalam arti yang lebih dalam ia memiliki segala sesuatu.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: sebagai orang yang
  rationale: Mempertahankan pembingkaian komparatif yang berulang sambil menghasilkan ungkapan Indonesia yang alami dalam rangkaian paradoks ini.
- source_word: λυπούμενοι
  choice: berdukacita
  rationale: Menyatakan keadaan dukacita tanpa menentukan penyebab atau pelakunya dan tetap sejajar dengan bentuk partisipial lain.
- source_word: ἀεὶ δὲ χαίροντες
  choice: tetapi selalu bersukacita
  rationale: Kata 'tetapi' menampilkan kontras δέ, sedangkan 'selalu bersukacita' mempertahankan aspek kegembiraan yang terus berlangsung.
- source_word: πτωχοὶ
  choice: orang miskin
  rationale: Padanan langsung yang tidak melebihkan makna menjadi sangat melarat dan tetap memungkinkan nuansa kekurangan lahiriah.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: tetapi membuat banyak orang menjadi kaya
  rationale: Menyampaikan arti kausatif πλουτίζω secara transparan tanpa menambahkan bahwa kekayaan itu bersifat material atau rohani.
- source_word: μηδὲν ἔχοντες
  choice: orang yang tidak mempunyai apa-apa
  rationale: Ungkapan Indonesia yang wajar dan mempertahankan kontras langsung antara tidak mempunyai dan memiliki.
- source_word: πάντα κατέχοντες
  choice: memiliki segala sesuatu
  rationale: Κατέχω di sini paling tepat menyatakan kepemilikan nyata; 'segala sesuatu' mempertahankan cakupan menyeluruh πάντα.
theological_decisions:
- issue: Sifat kekayaan dan kepemilikan dalam paradoks Paulus
  choice: Bahasa kekayaan dan kepemilikan diterjemahkan secara langsung tanpa diberi penjelas 'rohani' dalam teks utama.
  alternative: Menafsirkan secara eksplisit sebagai membuat banyak orang kaya secara rohani dan memiliki segala sesuatu dalam Kristus.
  rationale: Konteks mendukung pemahaman yang lebih dalam daripada kekayaan material, tetapi bahasa Yunani tidak menyebutkan pembatas tersebut. Terjemahan mempertahankan ketegangan retoris dan membiarkan sifat kekayaan itu ditafsirkan dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga paradoks dipertahankan dengan pengulangan 'sebagai orang yang/orang' dan kontras 'tetapi'. Semua penjelasan interpretatif ditempatkan dalam catatan kaki, bukan dimasukkan ke teks utama.
