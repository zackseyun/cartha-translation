lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: tidak memberikan alasan untuk tersandung
  rationale: Ungkapan ini mempertahankan metafora tersandung dalam προσκοπή sekaligus menyampaikan bahwa yang dimaksud ialah memberi kesempatan atau penyebab yang menghalangi orang lain.
- source_word: ἐν μηδενί
  choice: dalam hal apa pun
  rationale: Frasa ini menyatakan cakupan yang menyeluruh dan lebih wajar dalam bahasa Indonesia modern daripada terjemahan harfiah 'dalam apa pun'.
- source_word: διδόντες
  choice: kami ... memberikan
  rationale: Partisipel Yunani diterjemahkan sebagai klausa dengan subjek tersirat 'kami' sesuai konteks Paulus dan rekan-rekannya, sambil mempertahankan arti dasar 'memberikan'.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Bentuk ini secara alami mempertahankan nuansa tujuan atau hasil yang terkandung dalam klausa Yunani.
- source_word: μωμηθῇ
  choice: tidak dicela
  rationale: Verba pasif ini berarti dicela, dipersalahkan, atau didiskreditkan. 'Dicela' ringkas, alami, dan mempertahankan bentuk pasif.
- source_word: ἡ διακονία
  choice: pelayanan ini
  rationale: Dalam konteks ini istilah tersebut menunjuk pada pelayanan yang dijalankan Paulus dan rekan-rekannya. Kata 'ini' membuat rujukan kontekstualnya alami tanpa memasukkan gagasan jabatan gerejawi yang lebih kemudian.
theological_decisions:
- issue: Makna διακονία dalam gambaran Paulus tentang pekerjaannya
  choice: pelayanan ini
  alternative: pengabdian ini
  rationale: Konteks membicarakan pelaksanaan tugas Paulus dan rekan-rekannya sebagai pelayan Allah. 'Pelayanan' menangkap pemakaian Paulus tanpa membatasinya pada jabatan gerejawi formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, dengan metafora 'tersandung' dipertahankan dan alternatif makna leksikal dicatat dalam catatan kaki.
