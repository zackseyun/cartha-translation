base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: id
  text: “Aku akan menjadi Bapa bagimu,[a] dan kamu akan menjadi putra-putri bagi-Ku,” firman Tuhan Yang Mahakuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku akan menjadi bagimu sebagai Bapa, dan kamu akan menjadi bagi-Ku sebagai putra-putri.” Bahasa Yunani memakai ungkapan yang menyatakan hubungan perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι
  choice: Aku akan menjadi
  rationale: Bentuk futurum εἰμί diterjemahkan dengan bentuk masa depan yang alami dalam bahasa Indonesia.
- source_word: ὑμῖν εἰς πατέρα
  choice: Bapa bagimu
  rationale: Ungkapan relasional perjanjian ini paling alami diterjemahkan demikian, dengan tetap mempertahankan citra kebapaan ilahi.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: kamu akan menjadi anak-anak-Ku
  rationale: Ungkapan ini menyatakan hubungan timbal balik dengan Allah; bentuk posesif alami dalam bahasa Indonesia menyampaikan arti μοι tanpa terjemahan kaku.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: anak-anak-Ku, laki-laki dan perempuan
  rationale: Terjemahan ini secara eksplisit mempertahankan penyebutan keturunan laki-laki dan perempuan, sekaligus menghindari kesan bahwa pembaca dewasa disebut 'anak laki-laki dan anak perempuan' secara harfiah.
- source_word: λέγει
  choice: firman
  rationale: Dalam rumusan kutipan ilahi, 'firman' merupakan padanan bahasa Indonesia yang wajar, khidmat, dan menyatakan ujaran Allah.
- source_word: κύριος παντοκράτωρ
  choice: Tuhan Yang Mahakuasa
  rationale: Padanan baku dan bermartabat untuk gelar ilahi ini; tidak mencampurkannya dengan gelar berbeda seperti 'Tuhan Semesta Alam'.
theological_decisions:
- issue: Hubungan sebagai putra dan putri
  choice: anak-anak-Ku, laki-laki dan perempuan
  alternative: putra-putri bagi-Ku
  rationale: Pilihan utama mempertahankan inklusi eksplisit υἱοὺς καὶ θυγατέρας dan menyampaikan hubungan kekeluargaan dengan wajar, tanpa menghapus pembedaan laki-laki dan perempuan.
- issue: Gelar κύριος παντοκράτωρ
  choice: Tuhan Yang Mahakuasa
  alternative: Tuhan, Sang Mahakuasa
  rationale: Pilihan ini mengikuti bentuk gelar ilahi yang lazim dalam bahasa Indonesia dan tidak mengimpor gelar Perjanjian Lama lain yang tidak terdapat dalam teks Yunani ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital menurut kebiasaan umum bahasa Indonesia. Tanda [a] ditempatkan sesudah klausa pertama yang dijelaskannya.
