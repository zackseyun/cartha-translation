  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: id
  text: 'Namun, dalam segala hal[a] kami membuktikan diri sebagai pelayan-pelayan Allah[b]: dengan ketekunan yang besar[c], dalam penderitaan, dalam kesukaran, dan dalam keadaan terjepit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam setiap keadaan” atau “dalam segala segi.” Frasa Yunani ini luas dan dapat menunjuk pada setiap keadaan maupun setiap segi di mana mereka membuktikan diri.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai orang-orang yang melayani Allah.” Kata Yunaninya menekankan pelayanan dan tidak dengan sendirinya menunjuk pada jabatan resmi.
    reason: lexical_alternative
  - marker: c
    text: Atau “dalam ketekunan yang besar.” Dalam bahasa Yunani, kata depan “dalam” diulang pada setiap unsur dalam daftar ini.
    reason: structural_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan negatif sebelumnya sekaligus mengantar uraian positif tentang pelayanan; “namun” alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐν παντί
  choice: dalam segala hal
  rationale: Mempertahankan cakupan luas frasa Yunani, yang dapat menunjuk pada setiap keadaan maupun setiap segi kehidupan dan pelayanan.
- source_word: συνιστάνοντες ἑαυτούς
  choice: kami menunjukkan diri
  rationale: Dalam konteks ini συνίστημι mengandung gagasan memperlihatkan atau membuktikan jati diri melalui perilaku, bukan sekadar memuji atau merekomendasikan diri.
- source_word: ὡς θεοῦ διάκονοι
  choice: sebagai para pelayan Allah
  rationale: διάκονοι menekankan orang-orang yang melayani. “Pelayan” mudah dipahami dan tidak menjadikan istilah ini jabatan gerejawi formal yang tidak dituntut oleh teks.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: dengan ketekunan yang besar
  rationale: ὑπομονή adalah ketabahan yang terus bertahan di bawah tekanan. “Dengan” lebih alami untuk menyatakan cara dalam bahasa Indonesia, sementara catatan kaki mencatat struktur harfiahnya.
- source_word: θλίψεσιν
  choice: dalam penderitaan
  rationale: Menunjuk pada tekanan atau kesengsaraan yang dialami; “penderitaan” jelas, berbobot, dan alami dalam daftar ini.
- source_word: ἀνάγκαις
  choice: dalam kesukaran
  rationale: Dalam konteks ini menunjuk pada keadaan sulit atau kebutuhan yang mendesak, bukan hanya keperluan biasa.
- source_word: στενοχωρίαις
  choice: dalam keadaan terjepit
  rationale: Istilah ini menggambarkan keadaan seakan-akan terhimpit tanpa ruang gerak; frasa ini mempertahankan citra dan intensitasnya serta membedakannya dari dua istilah sebelumnya.
theological_decisions:
- issue: Makna διάκονοι dalam konteks pelayanan
  choice: para pelayan Allah
  alternative: para pelayan Tuhan; para minister Allah
  rationale: Ungkapan ini mengenali Paulus dan rekan-rekannya melalui pelayanan mereka kepada Allah, tanpa memastikan bahwa yang dimaksud ialah jabatan gerejawi formal. “Pelayan Allah” mempertahankan hubungan genitif dan penekanan pada tindakan melayani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur daftar Yunani dipertahankan sejauh alami; “dengan” dipakai pada unsur pertama untuk kelancaran idiomatis, lalu pengulangan “dalam” menjaga irama dan hubungan dengan teks sumber.
