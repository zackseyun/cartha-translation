  naturalness: Ragamnya pada umumnya baku dan alami. “Kami membuktikan diri sebagai pelayan-pelayan Allah” lebih idiomatis dan tegas dalam konteks pembelaan pelayanan daripada “kami menunjukkan diri sebagai para pelayan Allah.” Pengulangan “dalam” mempertahankan irama daftar Yunani secara alami.
