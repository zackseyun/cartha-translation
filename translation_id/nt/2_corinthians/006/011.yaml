- from: Mulut kami telah terbuka kepada kalian[a], hai orang-orang Korintus; hati kami telah dilapangkan[b].
  to: Mulut kami terbuka bagi kalian[a], hai orang-orang Korintus; hati kami telah dilapangkan[b].
  rationale: Revisi hanya mengganti preposisi dan menghilangkan ‘telah’ pada klausa pertama untuk menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah metafora, sapaan langsung, atau makna keterbukaan yang berlanjut dari bentuk perfek Yunani. Bentuk perfek pada kedua metafora tidak harus selalu diwujudkan dengan ‘telah’ dalam bahasa Indonesia; konteks dan bentuk ‘terbuka’ memadai, sedangkan ‘telah dilapangkan’ tetap mempertahankan hasil yang berlaku pada klausa kedua. Catatan kaki tetap ditempatkan tepat pada unsur yang dijelaskan.
