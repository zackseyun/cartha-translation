base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: id
  text: Mulut kami terbuka bagi kalian[a], hai orang-orang Korintus; hati kami telah dilapangkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Kami telah berbicara dengan terbuka kepada kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hati kami telah diperluas” atau “hati kami terbuka lebar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: mulut
  rationale: Mempertahankan metafora tubuh yang sejajar dengan “hati” pada klausa berikutnya; maknanya ialah Paulus telah berbicara dengan terbuka.
- source_word: ἀνέῳγεν
  choice: telah terbuka
  rationale: Mencerminkan bentuk perfek Yunani, yaitu keadaan terbuka yang merupakan hasil tindakan sebelumnya, sekaligus mempertahankan metaforanya.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Secara alami menyatakan arah perkataan kepada para penerima surat. “Kalian” sesuai dengan sapaan kepada komunitas dan jelas membedakannya dari bentuk tunggal.
- source_word: Κορίνθιοι
  choice: hai orang-orang Korintus
  rationale: Mempertahankan bentuk sapaan langsung tanpa menambahkan sebutan kekerabatan yang tidak terdapat dalam teks Yunani.
- source_word: καρδία
  choice: hati
  rationale: Padanan baku dan mudah dipahami untuk pusat kasih sayang serta sikap batin, sekaligus mempertahankan pasangan metaforis dengan “mulut”.
- source_word: πεπλάτυνται
  choice: telah dilapangkan
  rationale: Mempertahankan gambaran tentang hati yang dibuat luas serta nuansa keadaan kini sebagai hasil tindakan sebelumnya. Dalam konteks ini metafora tersebut menyatakan kasih dan keterbukaan yang luas.
theological_decisions:
- issue: Bahasa metaforis tentang keterbukaan dan kasih Paulus
  choice: 'Mempertahankan metafora tubuh secara langsung: “mulut ... terbuka” dan “hati ... dilapangkan.”'
  alternative: “Kami telah berbicara terus terang kepada kalian, hai orang-orang Korintus; hati kami terbuka lebar bagi kalian.”
  rationale: Teks Yunani menyandingkan mulut dan hati secara retoris. Terjemahan utama mempertahankan citra itu dan tidak menggantinya dengan penafsiran, sedangkan makna idiomatis dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “hai” dipakai untuk menandai vokatif Yunani secara jelas; “kalian” menyatakan penerima jamak. Metafora asli sengaja dipertahankan meskipun sedikit tidak lazim dalam bahasa Indonesia, dengan ungkapan yang lebih idiomatis diberikan dalam catatan kaki.
