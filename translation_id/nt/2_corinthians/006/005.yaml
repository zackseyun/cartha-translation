id: 2CO.6.5
reference: 2 Corinthians 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: id
  text: dalam pukulan, dalam pemenjaraan, dalam kerusuhan, dalam jerih payah, dalam malam-malam tanpa tidur, dalam puasa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: pukulan
  rationale: Menunjuk pada tindakan atau pengalaman dipukuli; bentuk jamak dipertahankan secara idiomatis sebagai nomina kolektif Indonesia.
- source_word: φυλακαῖς
  choice: pemenjaraan
  rationale: Dalam konteks daftar penderitaan Paulus, kata ini menunjuk pada pengalaman dipenjarakan, bukan sekadar bangunan penjara.
- source_word: ἀκαταστασίαις
  choice: kerusuhan
  rationale: Dalam konteks penderitaan pelayanan dan bentuk jamaknya, istilah ini paling wajar menunjuk pada berbagai kerusuhan atau huru-hara yang dihadapi Paulus, sambil tetap mengakui rentang makna 'kekacauan/gangguan'.
- source_word: κόποις
  choice: jerih payah
  rationale: Menyampaikan kerja berat yang melelahkan, lebih penuh daripada sekadar 'pekerjaan'.
- source_word: ἀγρυπνίαις
  choice: malam-malam tanpa tidur
  rationale: Mengungkapkan keadaan berjaga atau tidak tidur secara alami dalam bahasa Indonesia dan mempertahankan gagasan kejadian berulang.
- source_word: νηστείαις
  choice: puasa
  rationale: Padanan langsung yang mempertahankan kemungkinan puasa sukarela; konteks juga dapat memungkinkan kekurangan makanan, sehingga ambiguitas dicatat.
theological_decisions:
- issue: Makna νηστείαις dalam daftar penderitaan kerasulan
  choice: puasa
  alternative: kelaparan / tidak makan
  rationale: Makna leksikal utama adalah puasa. Namun, karena konteksnya adalah kesusahan dan kata terkait kadang dapat menggambarkan tidak makan, terjemahan tidak menambahkan alasan atau sifat puasanya.
- issue: Makna ἀκαταστασίαις
  choice: kerusuhan
  alternative: kekacauan / gangguan
  rationale: Konteks penderitaan fisik dan sosial mendukung peristiwa kerusuhan, tetapi terjemahan tidak mengaitkannya dengan kelompok atau penyebab tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ἐν diterjemahkan dengan pengulangan 'dalam' untuk mempertahankan irama retoris daftar Yunani. Ayat ini merupakan lanjutan kalimat, sehingga diawali huruf kecil dan diakhiri koma.
