  to: Janganlah kamu dipasangkan dalam satu kuk yang tidak sepadan dengan orang-orang yang tidak percaya.[b] Sebab, apa bagian bersama yang dimiliki kebenaran[a] dengan pelanggaran hukum? Atau, apa persekutuan antara terang dan kegelapan?
  rationale: Revisi memperjelas dan mempertahankan metafora kuk dalam ἑτεροζυγοῦντες, memperbaiki kelancaran bahasa Indonesia, dan menerjemahkan μετοχή dengan istilah yang lebih dekat pada gagasan partisipasi bersama. Struktur, kontras etis, istilah teologis utama, dan jangkar catatan kaki tetap dipertahankan.
