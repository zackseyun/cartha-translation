  source_fidelity: 'Larangan dan rangkaian dua pertanyaan retoris telah dipertahankan. Namun, “terikat dalam kuk yang tidak seimbang” kurang tepat secara idiomatis dan kurang langsung mencerminkan citra partisipial ἑτεροζυγοῦντες: dipasangkan di bawah satu kuk dengan pihak yang tidak sepadan. “Hubungan” untuk μετοχή juga terlalu umum; “bagian bersama” lebih dekat pada gagasan memiliki/berbagi sesuatu bersama.'
  naturalness: Teks umumnya baku dan jelas. “Dipasangkan dalam satu kuk yang tidak sepadan” lebih alami dan lebih jelas daripada “terikat dalam kuk yang tidak seimbang,” tanpa menghilangkan metafora. “Apa bagian bersama yang dimiliki ...?” mempertahankan bentuk pertanyaan retoris dengan alur Indonesia modern yang wajar.
  terminology: “Kebenaran” dapat dipakai untuk δικαιοσύνη dalam konteks ini, dengan “keadilan” tetap dicatat sebagai alternatif. “Pelanggaran hukum” mempertahankan unsur νόμος dalam ἀνομία, meski menunjuk pada keadaan/sikap tanpa hukum, bukan hanya satu pelanggaran. “Persekutuan,” “terang,” dan “kegelapan” tepat dan konsisten dengan register khidmat modern.
  issues:
