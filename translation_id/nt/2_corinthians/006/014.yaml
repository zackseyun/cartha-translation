  - severity: low
    issue: “Hubungan” terlalu luas untuk μετοχή.
    rationale: μετοχή mengandung gagasan berbagi atau mengambil bagian bersama. “Bagian bersama” menjaga perbedaan leksikal dari κοινωνία (“persekutuan”) pada pertanyaan berikutnya.
