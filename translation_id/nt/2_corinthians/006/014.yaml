id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: id
  text: Janganlah kamu dipasangkan dalam satu kuk yang tidak sepadan dengan orang-orang yang tidak percaya.[b] Sebab, apa bagian bersama yang dimiliki kebenaran[a] dengan pelanggaran hukum? Atau, apa persekutuan antara terang dan kegelapan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan” untuk “kebenaran” (δικαιοσύνῃ).
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “kuk yang tidak sepadan” menggambarkan binatang yang tidak sejenis atau tidak sepadan dipasangkan di bawah satu kuk; bandingkan Ulangan 22:10.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Janganlah kamu terikat
  rationale: Larangan dengan μή dan bentuk imperatif kini dipadukan secara alami dengan metafora kuk dalam bahasa Indonesia. Pilihan ini mempertahankan daya larangan dan gagasan memasuki atau berada dalam ikatan tersebut.
- source_word: ἑτεροζυγοῦντες
  choice: dalam kuk yang tidak seimbang
  rationale: Mempertahankan gambaran dua pihak yang dipasangkan di bawah satu kuk meskipun tidak sejenis atau tidak sepadan; gambaran ini kemungkinan menggemakan Ulangan 22:10.
- source_word: ἀπίστοις
  choice: dengan orang-orang yang tidak percaya
  rationale: Menunjuk kepada mereka yang tidak percaya; bentuk ini jelas, wajar, dan tidak menambahkan penilaian di luar istilah sumber.
- source_word: μετοχὴ
  choice: hubungan
  rationale: Dalam pertanyaan retoris ini, 'hubungan' menyampaikan gagasan mengambil bagian atau memiliki sesuatu bersama dan terdengar alami dalam bahasa Indonesia, sambil dibedakan dari κοινωνία pada klausa berikutnya.
- source_word: δικαιοσύνῃ
  choice: kebenaran
  rationale: Dalam pertentangan etis dengan ἀνομία, 'kebenaran' mempertahankan cakupan moral δικαιοσύνη. Kemungkinan arti 'keadilan' dicatat dalam catatan kaki.
- source_word: ἀνομίᾳ
  choice: pelanggaran hukum
  rationale: Menyatakan keadaan atau sikap yang menentang hukum secara lebih langsung daripada istilah umum seperti 'kejahatan', serta menjaga pertentangannya dengan δικαιοσύνη.
- source_word: κοινωνία
  choice: persekutuan
  rationale: Menyampaikan kebersamaan dan partisipasi erat yang dimaksud oleh κοινωνία serta cocok dengan pertanyaan retoris Paulus.
- source_word: φωτὶ
  choice: terang
  rationale: Terjemahan harfiah mempertahankan metafora dan pertentangan yang jelas.
- source_word: πρὸς σκότος
  choice: antara terang dan kegelapan
  rationale: Dalam susunan pertentangan ini, πρός menyatakan relasi. Ungkapan 'antara ... dan ...' merupakan bentuk Indonesia yang alami tanpa menghapus pertentangan metaforisnya.
theological_decisions:
- issue: Makna δικαιοσύνη dalam pertentangan Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Pertentangan etis dengan ἀνομία mendukung 'kebenaran' dalam teks utama, tetapi rentang makna yang mencakup 'keadilan' tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Metafora kuk dipertahankan dalam teks utama dan dijelaskan secara ringkas dalam catatan kaki; paralelisme dua pertanyaan retoris juga dipertahankan.
