  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: id
  text: Sebagai balasan yang setimpal—aku berbicara seperti kepada anak-anak—hendaklah kalian juga membuka diri seluas-luasnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebagai tanggapan timbal balik yang sepadan,” “sebagai imbalan,” atau “sebagai balasan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “hendaklah kalian diperlebar.” Dalam konteks, ini mengacu pada keterbukaan dalam kasih dan penerimaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: Sebagai balasan yang sepadan
  rationale: Frasa ini meminta tanggapan timbal balik yang setara. 'Balasan yang sepadan' mempertahankan gagasan pertukaran yang sesuai tanpa memberi kesan pembayaran komersial; δέ dipahami sebagai penghubung ringan yang tidak perlu diterjemahkan tersendiri.
- source_word: ὡς τέκνοις λέγω
  choice: aku berbicara seperti kepada anak-anak
  rationale: Terjemahan ini mempertahankan sapaan kekeluargaan tanpa menambahkan kata milik 'anakku', yang tidak dinyatakan dalam teks Yunani.
- source_word: πλατύνθητε
  choice: bukalah dirimu lebar-lebar
  rationale: Imperatif ini secara harfiah berarti 'hendaklah kalian diperlebar'. Dalam konteks, ungkapan tersebut menggambarkan keterbukaan kasih dan penerimaan; 'dirimu' menghindari penambahan eksplisit 'hati' sambil tetap alami dalam bahasa Indonesia.
- source_word: καὶ ὑμεῖς
  choice: juga
  rationale: 'καί menyatakan tanggapan timbal balik: jemaat Korintus juga harus membuka diri sebagaimana Paulus dan rekan-rekannya telah membuka diri.'
theological_decisions:
- issue: Apakah sapaan Paulus perlu dibuat posesif
  choice: seperti kepada anak-anak
  alternative: seperti kepada anak-anakku
  rationale: Nada kebapakan Paulus jelas dalam konteks, tetapi pronomina posesif tidak terdapat dalam teks Yunani. Terjemahan tidak menambahkannya.
- issue: Apakah objek 'hati' perlu dinyatakan dalam perintah
  choice: bukalah dirimu lebar-lebar
  alternative: bukalah hatimu lebar-lebar
  rationale: Konteks ayat 11–12 mengarahkan metafora ini kepada kasih dan penerimaan, tetapi ayat 13 sendiri tidak mengulangi kata 'hati'. Pilihan utama menjaga implikasi itu tanpa menjadikannya unsur eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan berwibawa. Bentuk tunggal 'dirimu' merujuk secara kolektif kepada jemaat; susunan kalimat dibuat alami tanpa menghilangkan tekanan timbal balik dalam teks Yunani.
