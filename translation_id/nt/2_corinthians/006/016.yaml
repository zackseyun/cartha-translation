reference: 2 Corinthians 6:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: id
  text: Apa kesepakatan antara bait Allah dan berhala-berhala? Sebab, kitalah bait Allah yang hidup, seperti yang telah Allah firmankan, “Aku akan tinggal di tengah-tengah mereka[a] dan berjalan di tengah-tengah mereka. Aku akan menjadi Allah mereka, dan mereka akan menjadi umat-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam mereka.” Kata depan Yunani yang dipakai dapat berarti “di dalam” atau “di tengah-tengah”; konteks perjanjian yang bersifat komunal mendukung terjemahan “di tengah-tengah mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: kesepakatan
  rationale: Kata ini menyatakan persetujuan atau keselarasan. “Kesepakatan” jelas dalam bahasa Indonesia modern dan mempertahankan pertanyaan retoris tentang ketidakcocokan bait Allah dengan berhala.
- source_word: ναῷ / ναὸς
  choice: bait
  rationale: ναός menunjuk pada bait atau tempat suci, bukan seluruh kompleks pelatarannya. “Bait Allah” merupakan padanan Indonesia yang alami dan mempertahankan daya metafora kultisnya.
- source_word: εἰδώλων
  choice: berhala-berhala
  rationale: Dalam konteks ini yang dimaksud adalah objek pemujaan kafir, bukan gambar yang netral. Bentuk ulang menyatakan jamak sumber.
- source_word: ζῶντος
  choice: yang hidup
  rationale: Partisip genitif ini menerangkan Allah dan membentuk ungkapan “Allah yang hidup,” yang mengontraskan Allah dengan berhala yang tidak bernyawa.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: seperti yang telah Allah firmankan
  rationale: “Seperti” mempertahankan hubungan pembuktian dengan kutipan Kitab Suci. “Firmankan” wajar untuk perkataan ilahi, sedangkan “telah” menyampaikan tindakan lampau yang tetap relevan tanpa menuntut aspek yang berlebihan.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Aku akan tinggal di tengah-tengah mereka
  rationale: ἐν dengan pronomina jamak dapat berarti “di dalam” atau “di antara.” Konteks umat secara komunal serta paralelnya dengan “berjalan di tengah-tengah mereka” mendukung padanan komunal ini.
- source_word: ἐμπεριπατήσω
  choice: berjalan di tengah-tengah mereka
  rationale: Padanan ini mempertahankan gambaran antropomorfis tentang kehadiran Allah bersama umat-Nya dan selaras dengan gema perjanjian dalam Perjanjian Lama.
- source_word: ἔσομαι αὐτῶν θεός
  choice: Aku akan menjadi Allah mereka
  rationale: Ini adalah rumusan perjanjian yang alami dalam bahasa Indonesia dan mempertahankan hubungan yang dinyatakan oleh bentuk genitif.
- source_word: λαός
  choice: umat
  rationale: Dalam rumusan perjanjian, λαός menunjuk secara kolektif kepada umat milik Allah. “Umat” lebih tepat daripada “rakyat” dalam konteks religius ini.
theological_decisions:
- issue: Gambaran bait secara korporat
  choice: kitalah bait Allah yang hidup
  alternative: kita adalah sebuah bait Allah yang hidup
  rationale: ναὸς yang tanpa artikel berfungsi sebagai predikat dan di sini bersifat kualitatif/definitif. Partikel penegas “-lah” secara alami menyampaikan identitas kolektif jemaat sebagai bait Allah, bukan sekadar salah satu bait di antara banyak bait.
- issue: Ungkapan tentang kediaman ilahi
  choice: Aku akan tinggal di tengah-tengah mereka
  alternative: Aku akan tinggal di dalam mereka
  rationale: Kutipan ini diarahkan kepada komunitas secara kolektif dan berparalel dengan “berjalan di tengah-tengah mereka.” Pilihan utama mempertahankan motif kehadiran Allah di tengah umat tanpa meniadakan kemungkinan leksikal “di dalam,” yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bait Allah,” “Allah yang hidup,” serta “umat-Ku” mempertahankan register alkitabiah yang mudah dipahami. Tanda baca membagi kutipan menjadi kalimat-kalimat alami tanpa mengubah hubungan antarklausanya.
