  text: διὰ δόξης καὶ ἀτιμίας, διὰ δυσφημίας καὶ εὐφημίας· ὡς πλάνοι καὶ ἀληθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/008.yaml
  text: through honor and dishonor[a], through slander and praise; regarded as deceivers and yet true[c][b],
translation:
  language: id
  text: di tengah kehormatan maupun kehinaan[a], di tengah celaan maupun pujian[b]; dianggap sebagai penyesat, padahal kami benar[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah kemuliaan maupun kehinaan.” Kata Yunani yang diterjemahkan “kehormatan” juga dapat berarti “kemuliaan”, tetapi di sini kemungkinan besar menunjuk pada kehormatan di mata masyarakat.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tengah nama buruk maupun nama baik.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sebagai penyesat dan benar.” Susunan ini mempertentangkan anggapan orang tentang Paulus dan rekan-rekannya dengan keadaan mereka yang sebenarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: di tengah
  rationale: Dengan bentuk genitif yang menyebut keadaan-keadaan berlawanan, διά menunjukkan keadaan yang dilalui dalam pelayanan. “Di tengah” alami dalam bahasa Indonesia dan mempertahankan pengulangan retoris.
- source_word: δόξης
  choice: kehormatan
  rationale: Dalam pertentangannya dengan ἀτιμία, kata ini terutama menunjuk pada penghargaan atau kehormatan di mata masyarakat, bukan kemuliaan dalam arti teologis.
- source_word: ἀτιμίας
  choice: kehinaan
  rationale: Pilihan ini membentuk pasangan antonim yang ringkas dengan “kehormatan” dan mempertahankan dimensi sosialnya.
- source_word: δυσφημίας
  choice: celaan
  rationale: Kata ini menunjuk pada perkataan atau laporan buruk tentang seseorang. “Celaan” tidak memastikan bahwa semua laporan itu palsu, sehingga tidak mempersempit makna menjadi fitnah saja.
- source_word: εὐφημίας
  choice: pujian
  rationale: Sebagai lawan δυσφημία, kata ini menunjuk pada perkataan atau penilaian yang baik; “pujian” jelas dan alami bagi pembaca modern.
- source_word: ὡς
  choice: dianggap sebagai
  rationale: Dalam rangkaian paradoks ini, ὡς memperkenalkan penilaian orang terhadap Paulus dan rekan-rekannya. “Dianggap sebagai” membuat sudut pandang itu jelas tanpa menerima tuduhannya sebagai kenyataan.
- source_word: πλάνοι
  choice: penyesat
  rationale: Dalam konteks ini kata tersebut berarti orang yang dituduh menyesatkan orang lain, bukan sekadar pengembara.
- source_word: ἀληθεῖς
  choice: benar
  rationale: “Benar” mempertahankan bentuk adjektival yang ringkas serta kemungkinan nuansa benar, tulus, atau dapat dipercaya, tanpa mempersempitnya menjadi satu nuansa saja.
theological_decisions:
- issue: Apakah pertentangan terakhir perlu dijelaskan sebagai perbedaan antara penilaian orang dan kenyataan
  choice: “dianggap sebagai penyesat, padahal kami benar”
  alternative: “sebagai penyesat, namun benar”
  rationale: Ungkapan ini menunjukkan bahwa “penyesat” adalah penilaian atau tuduhan terhadap para pelayan, sedangkan “benar” menyatakan kenyataan yang berlawanan. Kata “padahal” mempertahankan ketegangan retoris tanpa mengubahnya menjadi uraian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pengulangan “di tengah” mempertahankan kesejajaran sumber, sedangkan “padahal” menyampaikan pertentangan yang tersirat dalam susunan Yunani. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke pasangan-pasangan berikutnya.
