  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: id
  text: Ketika aku tiba di Troas untuk Injil Mesias[a], dan sebuah pintu telah dibukakan bagiku di dalam Tuhan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk Injil Mesias”; dapat juga dipahami, “untuk Injil tentang Mesias” atau “untuk Injil milik Mesias.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan sebuah pintu telah terbuka bagiku di dalam Tuhan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Ketika aku tiba
  rationale: Partisip aoris dipahami secara temporal, sedangkan δέ menandai peralihan ringan yang tidak perlu dinyatakan dengan kata tersendiri dalam bahasa Indonesia.
- source_word: εἰς τὴν Τρῳάδα
  choice: di Troas
  rationale: Dengan verba gerak 'tiba', bahasa Indonesia secara alami memakai 'di' untuk tempat tujuan.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: untuk memberitakan Injil
  rationale: εἰς menyatakan tujuan. Penambahan 'memberitakan' membuat maksud eliptisnya alami dalam bahasa Indonesia, tanpa mengubah isi pokok frasa.
- source_word: τοῦ Χριστοῦ
  choice: tentang Mesias
  rationale: Genitif ini secara wajar dapat menyatakan isi Injil; 'Mesias' mempertahankan fungsi Χριστός sebagai gelar.
- source_word: θύρας
  choice: sebuah pintu
  rationale: Metafora pintu dipertahankan dan tidak diratakan menjadi 'kesempatan'.
- source_word: ἀνεῳγμένης
  choice: terbukalah
  rationale: Bentuk ini menyampaikan keadaan pintu yang telah dibuka dan tetap terbuka, sambil menghasilkan susunan Indonesia yang lancar.
- source_word: ἐν κυρίῳ
  choice: di dalam Tuhan
  rationale: Mempertahankan ungkapan khas Paulus dan ambiguitas ἐν, tanpa memaksanya menjadi pembacaan instrumental 'oleh Tuhan'.
theological_decisions:
- issue: Makna τοῦ Χριστοῦ
  choice: tentang Mesias
  alternative: milik Mesias; tentang Kristus
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan 'Mesias'. Genitifnya dipahami sebagai genitif isi secara kontekstual, tetapi alternatif yang lebih formal tetap dicatat.
- issue: Makna ἐν κυρίῳ
  choice: di dalam Tuhan
  alternative: oleh Tuhan
  rationale: Terjemahan mempertahankan cakupan teologis ungkapan Paulus dan tidak diam-diam menentukan Tuhan sebagai pelaku pembukaan pintu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat sengaja diakhiri koma karena kalimat Yunani berlanjut ke ayat 13.
