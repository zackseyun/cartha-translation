  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: id
  text: Sebab bagi Allah kami adalah keharuman Kristus di antara mereka yang sedang diselamatkan dan di antara mereka yang sedang binasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan daya kausal-eksplanatorisnya secara wajar dalam bahasa Indonesia.
- source_word: Χριστοῦ
  choice: Kristus
  rationale: Dalam bahasa Indonesia, “Kristus” merupakan padanan baku dan alami bagi gelar Χριστός dalam konteks surat ini; bentuk genitif menyatakan bahwa keharuman itu berasal dari atau bercirikan Kristus.
- source_word: εὐωδία
  choice: keharuman
  rationale: “Keharuman” mempertahankan metafora penciuman dan konotasi menyenangkan kata Yunani tanpa menambahkan unsur yang tidak dinyatakan secara terpisah.
- source_word: τῷ θεῷ
  choice: bagi Allah
  rationale: Dativus ini menyatakan arah atau penilaian dalam metafora tersebut. “Bagi Allah” alami dalam bahasa Indonesia dan menunjukkan bahwa keharuman itu dipersembahkan kepada atau tercium oleh Allah.
- source_word: ἐν τοῖς σῳζομένοις
  choice: di antara mereka yang sedang diselamatkan
  rationale: Partisipel kini mempertahankan gambaran proses yang sedang berlangsung; “di antara” paling alami untuk lingkungan manusia yang dimaksud.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: di antara mereka yang sedang binasa
  rationale: Partisipel kini juga menggambarkan keadaan atau proses yang berlangsung. “Sedang binasa” mempertahankan ketegangan aspek tanpa mempersempitnya menjadi cara kebinasaan tertentu.
theological_decisions:
- issue: Aspek proses dalam σῳζομένοις dan ἀπολλυμένοις
  choice: “mereka yang sedang diselamatkan” dan “mereka yang sedang binasa”
  alternative: “orang-orang yang selamat” dan “orang-orang yang terhilang/binasa”
  rationale: Kedua partisipel berbentuk kini dan menyajikan keselamatan serta kebinasaan sebagai proses atau keadaan yang berlangsung. Terjemahan tidak meratakannya menjadi label yang sepenuhnya statis atau hasil yang sudah selesai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “di antara” dipertahankan untuk mencerminkan dua frasa ἐν yang sejajar dan tetap terdengar alami.
