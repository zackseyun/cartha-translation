    issue: «hal itu justru» untuk τοῦτο αὐτό
    rationale: '«Justru» lazimnya menyatakan kontras atau koreksi terhadap harapan, sedangkan τοῦτο αὐτό terutama menegaskan objek: “hal ini sendiri/hal inilah.” Terjemahan perlu mempertahankan penegasan tanpa menambahkan kontras.'
  - severity: low
    issue: «yakin mengenai kamu semua»
    rationale: Kolokasi ini kurang alami dalam bahasa Indonesia baku. «Yakin akan kamu semua» menyampaikan πεποιθὼς ἐπὶ πάντας ὑμᾶς secara lebih idiomatis.
  - severity: low
