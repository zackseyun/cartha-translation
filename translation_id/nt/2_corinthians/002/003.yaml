    rationale: Pemisahan tidak mengubah isi secara besar, tetapi mengaburkan keterkaitan dengan tindakan menulis. Frasa pendamping «dengan keyakinan ...» mempertahankan hubungan yang terbuka tanpa menjadikannya kausal.
  revised_text: Dan aku menulis hal ini sendiri supaya, ketika aku datang, aku tidak berdukacita karena orang-orang yang seharusnya menjadi sumber sukacitaku,[a] dengan keyakinan akan kamu semua bahwa sukacitaku adalah sukacita kamu semua.
