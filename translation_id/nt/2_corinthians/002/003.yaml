reference: 2 Corinthians 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: id
  text: Dan aku menulis hal ini sendiri supaya, ketika aku datang, aku tidak berdukacita karena orang-orang yang seharusnya menjadi sumber sukacitaku,[a] dengan keyakinan akan kamu semua bahwa sukacitaku adalah sukacita kamu semua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “dari orang-orang yang darinya aku seharusnya bersukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Aku menulis
  rationale: Aoristus indikatif paling wajar dipahami sebagai tindakan lampau yang merujuk pada tulisan Paulus sebelumnya.
- source_word: τοῦτο αὐτό
  choice: hal itu justru
  rationale: Ungkapan ini bersifat menegaskan; susunan ini alami dalam bahasa Indonesia dan mempertahankan tekanannya.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: supaya ketika aku datang, aku tidak mendapat kesedihan
  rationale: Mempertahankan makna tujuan ἵνα dan hubungan temporal partisip ἐλθών, dengan bahasa Indonesia yang jelas.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: dari orang-orang yang seharusnya membuatku bersukacita
  rationale: Menyampaikan bahwa orang-orang itu seharusnya menjadi sumber sukacita Paulus; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: Aku yakin mengenai kamu semua
  rationale: Partisip perfektum menyatakan keyakinan yang telah menetap. Dibuat sebagai kalimat tersendiri agar alami tanpa memaksakan hubungan sebab yang lebih tegas daripada bahasa Yunani.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: sukacitaku adalah sukacita kamu semua
  rationale: Mempertahankan struktur dan ambiguitas ringkas teks mengenai sukacita yang dimiliki atau dialami bersama.
theological_decisions:
- issue: Hubungan partisip πεποιθώς dengan pernyataan sebelumnya
  choice: 'Diterjemahkan sebagai pernyataan pendamping: “Aku yakin ...”'
  alternative: “karena aku yakin ...” atau “dengan yakin ...”
  rationale: Bahasa Yunani memakai partisip dan tidak menetapkan hubungan kausal secara eksplisit; pilihan ini menghindari penafsiran berlebihan.
- issue: Makna sukacita bersama dalam πάντων ὑμῶν
  choice: “sukacitaku adalah sukacita kamu semua”
  alternative: “sukacitaku dimiliki bersama oleh kamu semua”
  rationale: Terjemahan ini mempertahankan ketegangan dan keluasan ungkapan asli tanpa menentukan apakah yang ditekankan ialah kepemilikan, partisipasi, atau keselarasan sukacita.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal “aku” mengikuti suara pribadi Paulus, sedangkan “kamu semua” menegaskan bentuk jamak tanpa memakai bentuk regional.
