revisions:
- from: Aku menulis hal itu justru supaya ketika aku datang, aku tidak mendapat kesedihan dari orang-orang yang seharusnya membuatku bersukacita.[a] Aku yakin mengenai kamu semua bahwa sukacitaku adalah sukacita kamu semua.
  to: Dan aku menulis hal ini sendiri supaya, ketika aku datang, aku tidak berdukacita karena orang-orang yang seharusnya menjadi sumber sukacitaku,[a] dengan keyakinan akan kamu semua bahwa sukacitaku adalah sukacita kamu semua.
  rationale: Revisi mengganti «hal itu justru» dengan «hal ini sendiri» untuk menyampaikan penegasan τοῦτο αὐτό tanpa nuansa kontras tambahan. «Yakin akan» adalah ungkapan Indonesia yang lebih alami, dan «dengan keyakinan» mempertahankan fungsi pendamping partisip πεποιθώς tanpa menetapkan hubungan kausal. Catatan kaki tetap berjangkar pada frasa yang relevan dan mempertahankan alternatif harfiahnya.
