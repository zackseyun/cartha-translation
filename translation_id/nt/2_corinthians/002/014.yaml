id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: id
  text: Namun, syukur kepada Allah, yang selalu mengarak kami dalam prosesi kemenangan di dalam Mesias[a] dan yang melalui kami menyatakan keharuman pengenalan akan Dia di setiap tempat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang selalu menang atas kami di dalam Mesias.”
    reason: alternative_reading
  - marker: b
    text: Atau, “aroma” untuk “keharuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: syukur
  rationale: Dalam ungkapan Τῷ δὲ θεῷ χάρις, “syukur kepada Allah” merupakan ungkapan Indonesia yang alami dan mempertahankan daya doksologisnya.
- source_word: θριαμβεύοντι
  choice: membawa kami dalam arak-arakan kemenangan
  rationale: Pilihan ini mempertahankan gambaran konkret prosesi kemenangan dan tetap memperlakukan ἡμᾶς sebagai objek langsung; kemungkinan makna “menang atas kami” dicatat dalam catatan kaki.
- source_word: ἐν τῷ Χριστῷ
  choice: di dalam Mesias
  rationale: Χριστός dipahami sebagai gelar, dan ἐν menyatakan lingkup atau persekutuan dengan Mesias tanpa mempersempit relasinya secara berlebihan.
- source_word: ὀσμὴν
  choice: keharuman
  rationale: Dalam konteks metaforis ini, “keharuman” menyampaikan nuansa positif dan berhubungan secara alami dengan tindakan menyebarkan bau harum.
- source_word: γνώσεως
  choice: pengenalan
  rationale: “Pengenalan akan Dia” secara alami menyatakan pengetahuan relasional tentang Allah, sambil tetap mewakili arti γνώσις.
- source_word: φανεροῦντι
  choice: menyebarkan
  rationale: Dengan objek metaforis “keharuman”, “menyebarkan” lebih wajar dalam bahasa Indonesia dan menyampaikan bahwa Allah membuat pengenalan akan diri-Nya tercium atau nyata melalui para rasul.
- source_word: δι’ ἡμῶν
  choice: melalui kami
  rationale: διά dengan genitif menyatakan perantaraan atau sarana; “melalui kami” mempertahankan Allah sebagai pelaku utama.
- source_word: ἐν παντὶ τόπῳ
  choice: di setiap tempat
  rationale: Terjemahan ini dekat dengan susunan Yunani, alami dalam bahasa Indonesia, dan mempertahankan cakupan luas pelayanan tersebut.
theological_decisions:
- issue: Makna θριαμβεύω dengan ἡμᾶς sebagai objek
  choice: Allah membawa kami dalam arak-arakan kemenangan di dalam Mesias.
  alternative: Allah menang atas kami di dalam Mesias.
  rationale: Teks utama mempertahankan gambaran prosesi kemenangan dan kesinambungannya dengan metafora keharuman. Karena verba tersebut juga dapat menggambarkan pihak yang ditaklukkan sebagai tawanan dalam prosesi, alternatif itu dipertahankan dalam catatan kaki.
- issue: Rujukan kata ganti αὐτοῦ
  choice: “Dia” dipertahankan tanpa menambahkan nama rujukannya.
  alternative: “Allah” atau “Mesias” disebut secara eksplisit.
  rationale: Bentuk Yunani αὐτοῦ secara gramatikal dapat dikaitkan dengan rujukan maskulin terdekat, tetapi konteks juga memungkinkan pengenalan akan Allah. Terjemahan tidak memutuskan ambiguitas ini secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang khidmat namun mudah dipahami. “Arak-arakan kemenangan” mempertahankan citra historis tanpa istilah teknis yang asing; “keharuman” dan “menyebarkan” membentuk metafora yang alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
