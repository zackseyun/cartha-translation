lexical_decisions:
- source_word: διό
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari nasihat pada ayat-ayat sebelumnya.
- source_word: παρακαλῶ
  choice: saya mendesak
  rationale: Dalam konteks ini menyampaikan permohonan yang kuat dari Paulus, bukan sekadar penghiburan.
- source_word: κυρῶσαι
  choice: meneguhkan
  rationale: Mengungkapkan tindakan mengesahkan atau membuktikan secara nyata kasih jemaat kepada orang tersebut.
- source_word: ἀγάπην
  choice: kasihmu
  rationale: Bentuk Yunani memakai nomina 'kasih'; akhiran posesif disampaikan secara alami dari konstruksi 'kalian ... kepada dia'.
- source_word: εἰς αὐτόν
  choice: kepadanya
  rationale: Menunjukkan orang yang menjadi sasaran kasih jemaat.
theological_decisions:
- issue: Cara jemaat menyatakan kasih kepada orang yang telah didisiplinkan
  choice: meneguhkan kasihmu kepadanya
  alternative: menyatakan kembali kasihmu kepadanya
  rationale: Kata kerja κυρόω menekankan pengesahan atau peneguhan kasih melalui tindakan jemaat; terjemahan ini tidak menentukan tindakan khusus yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kata ganti 'kamu' dipahami secara kolektif karena ὑμᾶς berbentuk jamak; konteks surat menunjukkan Paulus berbicara kepada jemaat.
