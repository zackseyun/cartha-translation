  source_fidelity: 'Makna pokok dipertahankan: γάρ diterjemahkan sebagai penghubung penjelas, keputusan pribadi Paulus dinyatakan, dan πάλιν serta ἐν λύπῃ tercakup. Namun, bentuk masa depan “aku tidak akan datang” sedikit menggeser infinitif isi keputusan; “untuk tidak datang” lebih dekat pada konstruksi Yunani tanpa mengurangi kelancaran Indonesia.'
  naturalness: “Aku telah menetapkan bagi diriku sendiri hal ini” terasa kaku dan kurang idiomatis dalam bahasa Indonesia modern. Susunan “Aku telah memutuskan dalam diriku sendiri untuk tidak datang lagi ...” lebih alami, sambil tetap menyampaikan refleksivitas ἐμαυτῷ.
  terminology: “Kesedihan” merupakan padanan netral dan tepat untuk λύπη. Catatan kaki “dengan membawa kesedihan” tidak setara secara ketat karena menambahkan gagasan bahwa Paulus membawa atau menyebabkan kesedihan; alternatif yang aman ialah “dengan kesedihan.”
  issues:
