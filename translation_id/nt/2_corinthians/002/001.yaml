  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: id
  text: Sebab, aku telah memutuskan dalam diriku sendiri untuk tidak datang lagi kepadamu dalam kesedihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kesedihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: aku telah menetapkan
  rationale: Aoristus κρίνω dalam konteks ini menyatakan keputusan pribadi yang sudah diambil dengan mantap. 'Telah menetapkan' terdengar wajar dan mempertahankan daya deliberatifnya.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menghubungkan ayat ini secara menjelaskan dengan konteks sebelumnya. 'Sebab' mempertahankan fungsi penghubung tersebut dalam bahasa Indonesia baku.
- source_word: ἐμαυτῷ
  choice: bagi diriku sendiri
  rationale: Datif refleksif menekankan bahwa Paulus mengambil keputusan ini secara pribadi. Ungkapan ini mempertahankan penekanan yang ada dalam bahasa Yunani.
- source_word: τοῦτο
  choice: hal ini
  rationale: Kata penunjuk ini mengarah ke depan, kepada isi keputusan yang dijelaskan sesudah titik dua.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: aku tidak akan datang
  rationale: Infinitif berartikel menyatakan isi keputusan. Bentuk klausa dengan subjek tersurat lebih alami dalam bahasa Indonesia daripada konstruksi infinitif, sementara maknanya tetap terjaga.
- source_word: πάλιν
  choice: lagi
  rationale: πάλιν menandai pengulangan; 'lagi' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: ἐν λύπῃ
  choice: dalam kesedihan
  rationale: λύπη mencakup kesedihan, dukacita, atau kepedihan. 'Dalam kesedihan' mempertahankan bentuk preposisional dan membiarkan terbuka apakah kesedihan itu terutama keadaan Paulus atau suasana yang menyertai kunjungannya.
- source_word: πρὸς ὑμᾶς
  choice: kepadamu
  rationale: Dengan verba datang, πρός + akusatif menyatakan gerak menuju orang-orang yang dituju. 'Kepadamu' alami dan sesuai konteks sapaan jemaat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina tunggal 'aku' mewakili Paulus, sedangkan '-mu' bersifat kolektif untuk jemaat Korintus. Tanda titik dua mempertahankan hubungan antara 'hal ini' dan isi keputusan yang mengikutinya.
