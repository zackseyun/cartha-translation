base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: id
  text: Siapa pun yang kalian ampuni dalam hal apa pun, aku pun mengampuninya. Sebab, apa yang telah kuampuni—kalau aku telah mengampuni sesuatu—telah kuampuni demi kalian di hadapan Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam pribadi Mesias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ δέ τι χαρίζεσθε
  choice: Siapa pun yang kalian ampuni dalam hal apa pun
  rationale: Bentuk relatif datif ᾧ menunjuk kepada penerima pengampunan, sedangkan τι membiarkan perkara yang diampuni tetap terbuka. Ungkapan ini alami dalam bahasa Indonesia tanpa mempersempit τι menjadi jenis kesalahan tertentu.
- source_word: κἀγώ
  choice: aku pun mengampuninya
  rationale: κἀγώ berarti ‘aku juga/aku pun’. Kata kerja yang tersirat diulangi dalam bahasa Indonesia agar hubungan dengan klausa sebelumnya jelas.
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: ampuni / telah kuampuni
  rationale: Dalam konteks penanganan dan pemulihan orang yang bersalah, χαρίζομαι berarti melepaskan kesalahan atau mengampuni, meskipun secara lebih luas dapat berarti menganugerahkan dengan murah hati.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: apa yang telah kuampuni—kalau memang aku telah mengampuni sesuatu—
  rationale: Susunan ini mempertahankan pengulangan serta sisipan bersyarat Paulus, tanpa menghilangkan nada penegasan diri yang tertahan dalam teks Yunani.
- source_word: δι’ ὑμᾶς
  choice: demi kalian
  rationale: διά dengan akusatif di sini menyatakan tindakan yang dilakukan bagi kepentingan jemaat Korintus.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: di hadapan Mesias
  rationale: πρόσωπον dapat berarti wajah, kehadiran, atau pribadi. ‘Di hadapan’ secara alami menyampaikan tindakan yang dilakukan dalam kehadiran dan pengawasan Mesias, sementara alternatif ‘dalam pribadi’ dicatat karena ambiguitas aslinya.
- source_word: Χριστοῦ
  choice: Mesias
  rationale: Χριστός dipertahankan sebagai gelar kristologis dan diterjemahkan ‘Mesias’, bukan diperlakukan semata-mata sebagai nama diri.
theological_decisions:
- issue: Apakah Χριστοῦ diterjemahkan sebagai gelar atau bentuk nama tradisional
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ayat ini tidak ada alasan kontekstual yang mengharuskan Χριστός diperlakukan sebagai nama diri; terjemahan ‘Mesias’ mempertahankan daya gelarnya.
- issue: Makna ἐν προσώπῳ Χριστοῦ
  choice: di hadapan Mesias
  alternative: dalam pribadi Mesias
  rationale: Pilihan utama menekankan tindakan Paulus dalam kehadiran Mesias. Karena frasa Yunani juga dapat menunjuk kepada pribadi atau kapasitas perwakilan, kemungkinan itu tidak disingkirkan dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’ untuk ὑμᾶς. Nada dijaga lugas dan bermartabat; tanda pisah mempertahankan sisipan bersyarat Paulus.
