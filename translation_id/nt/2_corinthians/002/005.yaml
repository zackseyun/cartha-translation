  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: id
  text: Namun, jika seseorang telah menyebabkan kesedihan, ia tidak membuat aku sedih, melainkan, sampai taraf tertentu, kalian semua—agar aku tidak memberatkan kalian semua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melainkan sebagian dari kalian, agar aku tidak memberatkan kalian semua.” Ungkapan Yunani ἀπὸ μέρους dapat dipahami sebagai “sampai taraf tertentu” atau sebagai pembatas jumlah orang yang dimaksud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: telah menyebabkan kesedihan / telah dibuatnya sedih
  rationale: Bentuk perfektum diterjemahkan dengan “telah” untuk menunjukkan tindakan lampau yang dampaknya masih terasa. Pengulangan akar makna λυπέω dipertahankan secara alami dalam bahasa Indonesia.
- source_word: οὐκ ἐμὲ
  choice: bukan aku
  rationale: Terjemahan langsung ini mempertahankan kontras Paulus tanpa menambahkan penekanan seperti “bukan aku secara pribadi” yang tidak dinyatakan secara eksplisit.
- source_word: ἀπὸ μέρους
  choice: sedikit banyak
  rationale: Ungkapan ini membatasi cakupan pernyataan Paulus. “Sedikit banyak” terdengar alami dan tetap memelihara arti “sebagian” atau “sampai taraf tertentu” tanpa menentukan secara berlebihan apa tepatnya yang dibatasi.
- source_word: ἐπιβαρῶ
  choice: melebih-lebihkannya
  rationale: Secara harfiah verba ini berarti membebani atau memberatkan. Dalam konstruksi parentetis ini, maknanya kemungkinan adalah tidak menyatakan perkara itu secara terlalu berat; terjemahan utama menyampaikan fungsi retoris tersebut, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: πάντας ὑμᾶς
  choice: kalian semua
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh πάντας dan bentuk sapaan jamak ὑμᾶς dengan jelas.
theological_decisions:
- issue: Hubungan sintaksis πάντας ὑμᾶς dengan λελύπηκεν atau ἐπιβαρῶ
  choice: “kalian semua” dipahami sebagai pihak yang sedikit banyak dibuat sedih
  alternative: 'Frasa itu dapat dipahami sebagai objek ἐπιβαρῶ: “supaya aku tidak membebani kalian semua.”'
  rationale: Urutan gagasan dan kontras “bukan aku, melainkan ... kalian semua” mendukung pilihan utama, tetapi bahasa Yunani memungkinkan πάντας ὑμᾶς dikaitkan dengan verba “membebani”; ambiguitas ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Sedikit banyak” dipilih untuk menjaga keluwesan ἀπὸ μέρους, sedangkan tanda pisah menandai penjelasan parentetis Paulus. Penanda catatan kaki [a] hadir dalam teks utama.
