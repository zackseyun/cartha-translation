revisions:
- from: Sebab aku menulis kepada kalian dari tengah banyak penderitaan dan kesesakan hati, dengan bercucuran air mata, bukan supaya kalian bersedih, melainkan supaya kalian mengetahui betapa besar kasih yang kumiliki secara khusus bagi kalian.[a]
  to: Sebab, dari banyak penderitaan dan kesesakan hati, aku telah menulis kepada kalian dengan banyak air mata, bukan supaya kalian bersedih, melainkan supaya kalian mengetahui kasih yang kumiliki dengan lebih berlimpah kepada kalian.[a]
  rationale: Revisi ini mempertahankan urutan dan kontras klausa Yunani, memperjelas aoristus sebagai tindakan lampau, serta menggunakan ungkapan Indonesia yang lebih idiomatis untuk «melalui/dengan banyak air mata». Terjemahan utama kini menyampaikan περισσοτέρως dengan «lebih berlimpah», sementara catatan kaki memelihara pembacaan intensif yang lebih bebas tanpa menetapkan pembanding tertentu.
