  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: id
  text: Sebab, dari banyak penderitaan dan kesesakan hati, aku telah menulis kepada kalian dengan banyak air mata, bukan supaya kalian bersedih, melainkan supaya kalian mengetahui kasih yang kumiliki dengan lebih berlimpah kepada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “betapa besar kasih yang kumiliki secara khusus bagi kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ πολλῆς θλίψεως
  choice: Sebab ... dari tengah banyak penderitaan
  rationale: ἐκ menandai keadaan batin yang menjadi sumber penulisan; 'dari tengah' menyampaikan asal itu secara alami, sedangkan θλῖψις tetap cukup luas untuk tekanan, kesusahan, atau penderitaan.
- source_word: συνοχῆς καρδίας
  choice: kesesakan hati
  rationale: Ungkapan ini mempertahankan gambaran tekanan atau himpitan batin dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ἔγραψα ὑμῖν
  choice: aku menulis kepada kalian
  rationale: Aoristus diterjemahkan sebagai tindakan lampau sederhana tanpa menambahkan 'sebelumnya', yang berasal dari konteks dan bukan dari verba itu sendiri.
- source_word: διὰ πολλῶν δακρύων
  choice: dengan bercucuran air mata
  rationale: διὰ di sini secara idiomatis menggambarkan keadaan atau cara Paulus menulis; pilihan ini mempertahankan intensitas πολλῶν dan gambaran penulisan yang penuh air mata.
- source_word: οὐχ ἵνα λυπηθῆτε
  choice: bukan supaya kalian bersedih
  rationale: Mempertahankan klausa tujuan negatif serta makna pasif/intransitif kontekstual λυπηθῆτε tanpa membuatnya terlalu teknis.
- source_word: τὴν ἀγάπην ἵνα γνῶτε
  choice: melainkan supaya kalian mengetahui ... kasih
  rationale: Susunan Indonesia dibuat alami sambil mempertahankan tujuan positif yang dikontraskan dengan tujuan negatif sebelumnya.
- source_word: ἣν ἔχω περισσοτέρως εἰς ὑμᾶς
  choice: betapa besar kasih yang kumiliki secara khusus bagi kalian
  rationale: περισσοτέρως bersifat intensif sekaligus dapat mengandung nuansa komparatif; 'betapa besar ... secara khusus' menyampaikan kelimpahan dan arah kasih kepada jemaat tanpa menetapkan pembanding yang tidak disebutkan.
theological_decisions:
- issue: 'Nuansa περισσοτέρως: intensif atau komparatif'
  choice: betapa besar ... secara khusus bagi kalian
  alternative: kasih yang kumiliki dengan lebih berlimpah kepada kalian
  rationale: Teks Yunani dapat menekankan kasih yang sangat besar atau kasih yang lebih besar secara relatif. Terjemahan utama dibuat alami tetapi tidak menyebut pembanding tertentu; catatan kaki mempertahankan kemungkinan komparatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, hangat, dan bermartabat. Pronomina 'aku/kalian' mempertahankan kedekatan pastoral Paulus dengan jemaat. Penanda catatan kaki ditempatkan setelah bagian yang dijelaskannya.
