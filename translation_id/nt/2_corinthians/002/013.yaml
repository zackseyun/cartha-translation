  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: id
  text: Aku tidak mendapat ketenangan dalam batinku karena aku tidak menemukan Titus, saudaraku[a]. Namun, setelah berpamitan kepada mereka, aku berangkat ke Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudaraku” adalah sebutan bagi sesama orang percaya, bukan berarti Titus adalah saudara kandung Paulus.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: Aku tidak mendapat ketenangan
  rationale: Bentuk perfektum Yunani dalam konteks naratif ini menyatakan keadaan Paulus sebelum keberangkatannya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tidak adanya kelegaan atau ketenteraman.
- source_word: τῷ πνεύματί μου
  choice: dalam batinku
  rationale: Dativus ini dapat menunjukkan lingkup atau acuan. 'Dalam batinku' menyampaikan dimensi pribadi dan terdalam tanpa mengharuskan pembaca memahami πνεῦμα sebagai Roh Kudus atau sebagai istilah psikologis teknis.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: karena tidak menemukan Titus
  rationale: Infinitif berartikel dengan μή menyatakan sebab tidak adanya ketenangan. Terjemahan ini dekat dengan struktur makna Yunani dan tidak menambahkan bahwa Paulus sama sekali tidak mampu menemukan Titus.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: Titus, saudaraku
  rationale: Mempertahankan metafora kekerabatan Paulus serta kehangatan relasinya dengan Titus; catatan kaki menjelaskan bahwa yang dimaksud bukan saudara kandung.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: setelah berpamitan kepada mereka
  rationale: Partisip aoris ini menunjuk pada tindakan mengucapkan selamat tinggal sebelum berangkat. 'Berpamitan' merupakan padanan Indonesia yang alami, ringkas, dan sesuai konteks.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: aku berangkat ke Makedonia
  rationale: Ungkapan ini menyampaikan gerak meninggalkan Troas menuju Makedonia secara alami dalam bahasa Indonesia tanpa menerjemahkan ἐξέρχομαι secara kaku sebagai 'keluar'.
theological_decisions:
- issue: Makna πνεῦμα dalam frasa τῷ πνεύματί μου
  choice: batinku
  alternative: rohku
  rationale: Konteks berbicara tentang kegelisahan pribadi Paulus. 'Batinku' mempertahankan makna manusia batiniah dan menghindari kesan bahwa Roh Kudus tidak memperoleh ketenangan, sementara kemungkinan antropologis dari πνεῦμα tetap terwakili.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'aku' dipakai sebagai suara surat pribadi Paulus; susunan kalimat mengikuti alur sebab lalu tindakan dalam teks Yunani.
