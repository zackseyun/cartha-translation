lexical_decisions:
- source_word: τοὐναντίον
  choice: sebaliknya
  rationale: Menandai pembalikan tindakan yang diharapkan dengan jelas dan alami.
- source_word: μᾶλλον
  choice: harus
  rationale: Dalam konstruksi bersama τοὐναντίον dan infinitif, unsur ini mengarahkan pembaca kepada tindakan yang justru patut dilakukan; daya kontrasnya terutama dibawa oleh 'sebaliknya'.
- source_word: χαρίσασθαι
  choice: mengampuni
  rationale: Dalam konteks pemulihan sesudah tindakan disiplin, verba ini paling wajar berarti memberikan pengampunan, sambil tetap memiliki nuansa anugerah yang dicatat dalam catatan kaki.
- source_word: παρακαλέσαι
  choice: menghibur
  rationale: Konteks kesedihan mendukung arti menghibur atau meneguhkan secara emosional.
- source_word: καταποθῇ
  choice: ditelan
  rationale: Mempertahankan metafora Yunani yang kuat dan tetap mudah dimengerti dalam bahasa Indonesia.
- source_word: ὁ τοιοῦτος
  choice: orang seperti itu
  rationale: Mempertahankan rujukan yang tidak menyebut identitas atau jenis kelamin secara lebih khusus daripada teks Yunani.
- source_word: περισσοτέρᾳ λύπῃ
  choice: kesedihan yang terlampau berat
  rationale: Mengungkapkan kesedihan yang melebihi batas atau berlebihan secara alami tanpa menghilangkan bobot emosionalnya.
theological_decisions:
- issue: Sifat tindakan terhadap orang yang telah dikenai disiplin
  choice: mengampuni dan menghibur
  alternative: menunjukkan kemurahan dan menasihati
  rationale: Konteks langsung menekankan pemulihan orang yang bersedih; terjemahan ini tidak menentukan lebih jauh status gerejawi atau bentuk disiplin yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Metafora 'ditelan' dipertahankan dalam teks utama karena alami serta kuat dalam bahasa Indonesia; kedua penanda catatan kaki muncul langsung pada unsur yang dijelaskan.
