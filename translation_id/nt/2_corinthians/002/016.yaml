  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: id
  text: Bagi sebagian orang, bau[a] dari kematian menuju kematian; bagi yang lain, bau dari kehidupan menuju kehidupan.[b] Dan siapakah yang sanggup untuk semua ini?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aroma”; demikian juga untuk kemunculan kedua kata “bau”.
    reason: lexical_alternative
  - marker: b
    text: Frasa “dari kematian menuju kematian” dan “dari kehidupan menuju kehidupan” dapat menyatakan asal dan hasil (“berasal dari kematian dan membawa kepada kematian” / “berasal dari kehidupan dan membawa kepada kehidupan”) atau merupakan ungkapan yang menegaskan sifat kematian dan kehidupan.
    reason: alternative_reading
  - marker: c
    text: Atau “memadai” atau “mampu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: aroma
  rationale: “Aroma” mempertahankan gambaran indrawi dan cukup luwes untuk dipakai pada kedua sisi kontras. Kata ini juga sesuai dengan konteks gambaran arak-arakan kemenangan, tanpa menetapkan bahwa baunya selalu menyenangkan atau tidak menyenangkan.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: dari kematian menuju kematian
  rationale: Terjemahan yang dekat dengan susunan Yunani mempertahankan kesejajaran yang padat serta tidak memutuskan apakah frasa ini menyatakan asal dan hasil atau penegasan sifat.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: dari kehidupan menuju kehidupan
  rationale: Pilihan ini mempertahankan pola yang sejajar dengan frasa tentang kematian dan membiarkan keterbukaan makna teks sumber tetap terasa.
- source_word: πρὸς ταῦτα
  choice: untuk semua ini
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan hubungan antara kesanggupan seseorang dan seluruh hal berat yang baru saja dibicarakan.
- source_word: ἱκανός
  choice: sanggup
  rationale: “Sanggup” secara alami menyatakan kemampuan atau kecukupan untuk menghadapi tugas yang dimaksud, sekaligus mempertahankan daya retoris pertanyaannya.
theological_decisions:
- issue: Daya makna frasa berpasangan “dari kematian menuju kematian” dan “dari kehidupan menuju kehidupan”
  choice: Mempertahankan ungkapan sumber yang padat dan sejajar tanpa menjelaskan satu tafsiran tertentu dalam teks utama.
  alternative: Menafsirkannya sebagai aroma yang berasal dari kematian dan berakhir pada kematian, atau sebagai aroma yang bercirikan kematian; demikian juga untuk kehidupan.
  rationale: Teks Yunani tidak mewajibkan satu penjelasan saja. Bentuk yang relatif harfiah menjaga kemungkinan makna asal-hasil maupun penegasan sifat tanpa meredakan ketegangan teologisnya.
- issue: Elipsis predikat yang bergantung pada ayat sebelumnya
  choice: 'Mempertahankan bentuk eliptis: “Bagi sebagian orang, aroma ...”'
  alternative: Melengkapinya menjadi “Bagi sebagian orang, kami adalah aroma ...” berdasarkan 2 Korintus 2:15.
  rationale: Ayat Yunani ini tidak mengulang verba atau subjek dari ayat sebelumnya. Bentuk eliptis mempertahankan struktur sumber dan tetap dapat dipahami sebagai kelanjutan langsung dari ayat 15.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran retoris serta elipsis teks Yunani dipertahankan; “menuju” dipakai agar pola ἐκ ... εἰς ... terdengar jelas dan wajar.
