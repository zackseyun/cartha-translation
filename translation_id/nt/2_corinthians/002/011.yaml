  - severity: medium
    issue: “kita bukannya tidak mengetahui” tidak alami dan berpotensi rancu.
    rationale: Konstruksi ini dalam Indonesia biasanya bernuansa “bukan berarti kita tidak tahu,” sementara teks Yunani secara langsung menyatakan bahwa kita tidak tidak mengetahui/ tidak berada dalam ketidaktahuan.
  - severity: low
