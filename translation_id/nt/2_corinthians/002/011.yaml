  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: id
  text: supaya kita tidak dirugikan[a] oleh Satan, sebab kita tidak asing dengan siasat-siasatnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diperdaya” atau “dieksploitasi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pikiran-pikirannya,” “maksud-maksudnya,” atau “rancangan-rancangannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menandai tujuan yang hendak dicegah dan menghubungkan ayat ini dengan tindakan pada konteks sebelumnya.
- source_word: πλεονεκτηθῶμεν
  choice: kita tidak dimanfaatkan
  rationale: Bentuk pasif ini mengandung gagasan dieksploitasi atau diambil keuntungan darinya; pilihan ini mempertahankan cakupan makna tanpa membatasinya pada kecerdikan atau penipuan intelektual saja.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: oleh Satan
  rationale: ὑπό dengan genitif menandai pelaku dalam konstruksi pasif; nama Σατανᾶ ditransliterasikan sebagai Satan.
- source_word: γὰρ
  choice: sebab
  rationale: Memperkenalkan alasan yang menjelaskan mengapa Satan tidak boleh mendapat keuntungan.
- source_word: νοήματα
  choice: siasat-siasat
  rationale: Dalam konteks permusuhan ini, kata tersebut menunjuk pada pemikiran, maksud, atau rancangan strategis; 'siasat-siasat' menyampaikan nuansa tersebut secara alami.
- source_word: οὐ ... ἀγνοοῦμεν
  choice: kita bukannya tidak mengetahui
  rationale: Mempertahankan penyangkalan atas ketidaktahuan dalam bahasa Yunani, termasuk penekanannya, alih-alih meratakannya menjadi pernyataan positif biasa.
theological_decisions:
- issue: Sifat νοήματα Satan
  choice: siasat-siasat
  alternative: pikiran-pikiran; maksud-maksud; rancangan-rancangan
  rationale: Konteks mendukung nuansa strategis yang bermusuhan, tetapi catatan kaki mempertahankan keluasan leksikal kata itu dan tidak menjadikannya istilah doktrinal yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Susunan 'bukannya tidak mengetahui' sengaja mempertahankan litotes Yunani. Semua penanda catatan kaki ditempatkan setelah unsur yang diterangkan.
