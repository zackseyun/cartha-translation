  source_fidelity: Makna dasar πλεονεκτηθῶμεν sebagai mengalami kerugian/diambil keuntungan oleh pihak lain lebih jelas disampaikan dengan “dirugikan” daripada “dimanfaatkan,” yang dalam bahasa Indonesia terutama berarti “digunakan.” Klausa penjelas οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν diterjemahkan secara idiomatis tanpa mengubahnya menjadi penyangkalan ganda yang rancu.
  naturalness: “Kita bukannya tidak mengetahui” terdengar sebagai koreksi atau pembatasan terhadap pernyataan lain dan kurang alami sebagai terjemahan langsung οὐ ... ἀγνοοῦμεν. “Kita tidak asing dengan siasat-siasatnya” adalah ungkapan Indonesia baku yang jelas menyatakan bahwa mereka mengetahui/menyadari siasat itu.
  terminology: “Satan” dipertahankan sebagai nama diri sesuai kebijakan transliterasi draf. “Siasat-siasat” cocok untuk νοήματα dalam konteks ini, dengan alternatif yang mempertahankan rentang makna pada catatan kaki.
  issues:
