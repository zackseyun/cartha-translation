  text: Bagi orang semacam itu, hukuman yang dijatuhkan oleh mayoritas sudah cukup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hukuman ini, yang dijatuhkan oleh mayoritas, sudah cukup bagi orang semacam itu.”
    reason: Alternatif ini mengikuti susunan Yunani dengan lebih dekat, sambil mempertahankan makna τῶν πλειόνων sebagai “mayoritas.”
lexical_decisions:
- source_word: ἱκανὸν
  choice: sudah cukup
  rationale: Berfungsi sebagai gagasan predikatif dan menyatakan bahwa tindakan disipliner tersebut telah mencapai kadar yang memadai. Ungkapan “sudah cukup” alami dalam bahasa Indonesia serta sesuai dengan konteks tindakan yang telah dijatuhkan.
- source_word: τῷ τοιούτῳ
  choice: kepada orang semacam itu
  rationale: Menunjuk kepada pelanggar tertentu dalam konteks. “Orang semacam itu” mempertahankan sifat rujukannya tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἐπιτιμία
  choice: hukuman
  rationale: Mengacu pada sanksi korektif yang nyata, bukan sekadar teguran lisan. “Hukuman” merupakan padanan Indonesia yang jelas dan wajar dalam konteks disiplin komunitas.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: yang dijatuhkan oleh sebagian besar dari kalian
  rationale: Bentuk pasif ὑπό menyatakan pelaku tindakan, sedangkan τῶν πλειόνων berarti bagian yang lebih besar atau mayoritas. “Sebagian besar dari kalian” membuat acuan kepada anggota jemaat tersurat secara alami; unsur “dijatuhkan” melengkapi kolokasi Indonesia dengan “hukuman”.
