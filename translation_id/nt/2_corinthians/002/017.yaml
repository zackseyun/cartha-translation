id: 2CO.2.17
reference: 2 Corinthians 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: id
  text: Sebab kami tidak seperti banyak orang[a] yang menjajakan firman Allah demi keuntungan[b]. Sebaliknya, kami berbicara dengan ketulusan[c], sebagai orang yang berasal dari Allah, di hadapan Allah, dalam Mesias[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “begitu banyak orang lain”; ungkapan Yunaninya tidak harus berarti “kebanyakan orang.”
    reason: lexical_alternative
  - marker: b
    text: Kata ini menggambarkan orang yang menjajakan sesuatu demi keuntungan dan juga dapat menyiratkan pencampuran atau pemalsuan barang dagangan.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih dekat dengan susunan Yunani, “sebagai dari ketulusan”; frasa ini sejajar dengan “sebagai dari Allah.”
    reason: source_structure
  - marker: d
    text: Secara tradisional, “dalam Kristus.”
    reason: alternative_rendering
lexical_decisions:
- source_word: οἱ πολλοί
  choice: banyak orang
  rationale: Ungkapan ini mempertahankan kontras Paulus dengan kelompok besar yang dimaksud tanpa menyimpulkan secara statistik bahwa mereka adalah mayoritas.
- source_word: καπηλεύοντες
  choice: memperdagangkan
  rationale: Pilihan ini mempertahankan gambaran kegiatan jual-beli yang mementingkan keuntungan diri sendiri; kemungkinan nuansa mencampur atau merusak barang dagangan dicatat dalam catatan kaki.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Ini adalah padanan langsung dan wajar dalam bahasa Indonesia bagi ungkapan genitif tersebut serta mempertahankan corak khas Paulus.
- source_word: ἐξ εἰλικρινείας
  choice: dengan ketulusan
  rationale: Bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'dari ketulusan', sambil tetap menyatakan kemurnian sikap atau motif.
- source_word: ἐκ θεοῦ
  choice: sebagai orang-orang yang berasal dari Allah
  rationale: Ungkapan ini mempertahankan gagasan sumber ilahi dan daya komparatif ὡς, tanpa mempersempitnya menjadi 'diutus Allah'.
- source_word: κατέναντι θεοῦ
  choice: di hadapan Allah
  rationale: Padanan ini menyampaikan baik kehadiran Allah maupun pertanggungjawaban kepada-Nya.
- source_word: ἐν Χριστῷ
  choice: dalam Mesias
  rationale: Χριστός diperlakukan sebagai gelar yang bermakna, dan frasa ini mempertahankan gagasan bahwa perkataan para rasul berlangsung dalam hubungan atau lingkup Mesias.
- source_word: λαλοῦμεν
  choice: kami berbicara
  rationale: Padanan sederhana ini mencerminkan verba umum Yunani tanpa memperkuatnya secara interpretatif menjadi 'memberitakan'.
theological_decisions:
- issue: Makna ἐκ θεοῦ sebagai sumber pelayanan
  choice: sebagai orang-orang yang berasal dari Allah
  alternative: sebagai orang-orang yang diutus Allah
  rationale: Teks menyatakan sumber 'dari Allah', tetapi tidak memakai verba 'mengutus'; karena itu terjemahan utama tidak menambahkan gagasan pengutusan secara eksplisit.
- issue: Penerjemahan Χριστῷ dalam ἐν Χριστῷ
  choice: dalam Mesias
  alternative: dalam Kristus
  rationale: Di sini Χριστός tetap dapat dipahami sebagai gelar 'Yang Diurapi'; pilihan utama menerjemahkan makna gelar, sedangkan bentuk tradisional dicatat sebagai alternatif.
- issue: Hubungan frasa di hadapan Allah dan dalam Mesias dengan tindakan berbicara
  choice: keduanya menerangkan 'kami berbicara'
  alternative: menghubungkan salah satunya secara lebih khusus dengan ketulusan atau asal ilahi
  rationale: Susunan Yunani paling wajar membiarkan kedua frasa tersebut menerangkan tindakan berbicara tanpa menetapkan hubungan teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar kontrasnya mudah dipahami. Susunan unsur pada klausa kedua disesuaikan dengan kelaziman bahasa Indonesia, tetapi pengulangan gagasan sumber dalam ἐξ/ἐκ dan daya komparatif ὡς tetap dijaga melalui teks serta catatan kaki.
