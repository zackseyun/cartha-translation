  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: id
  text: Sebab, untuk itulah aku juga menulis, supaya aku mengetahui mutu kalian yang telah terbukti[a], apakah kalian taat dalam segala hal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengujian kalian,” “bukti tentang kalian,” atau “watak kalian yang terbukti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: Sebab, justru untuk inilah aku menulis
  rationale: Menyampaikan γάρ sebagai alasan, εἰς τοῦτο sebagai tujuan yang ditunjuk, dan καί secara alami sebagai penegasan dalam konteks ini; bentuk lampau Yunani diterjemahkan dengan bentuk Indonesia yang tidak menandai kala.
- source_word: ἵνα γνῶ
  choice: supaya aku mengetahui
  rationale: Mempertahankan klausa tujuan dan gagasan bahwa Paulus hendak memperoleh pengetahuan melalui tanggapan jemaat.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: keterujian kalian
  rationale: δοκιμή dapat menunjuk pada pengujian maupun mutu yang terbukti melalui pengujian. 'Keterujian' mempertahankan hubungan itu tanpa langsung mempersempitnya menjadi 'karakter yang terbukti'.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: apakah kalian taat dalam segala hal
  rationale: Menerjemahkan εἰ sebagai penanda pertanyaan tidak langsung setelah 'mengetahui', dan mempertahankan cakupan menyeluruh εἰς πάντα.
theological_decisions:
- issue: Apakah δοκιμή menunjuk pada proses pengujian atau hasil yang terbukti
  choice: keterujian kalian
  alternative: bukti tentang kalian; watak kalian yang terbukti; hasil pengujian kalian
  rationale: Teks Yunani memungkinkan nuansa pengujian dan bukti hasil pengujian. Terjemahan utama mempertahankan ketegangan leksikal tersebut, sedangkan catatan kaki menyajikan padanan alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku/kalian' mengikuti hubungan pribadi Paulus dengan jemaat sekaligus membedakan orang kedua jamak. Susunan kalimat mempertahankan hubungan alasan, tujuan, dan pertanyaan tidak langsung dalam teks Yunani.
