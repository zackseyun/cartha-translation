id: LUK.23.56
reference: Luke 23:56
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: id
  text: Setelah kembali, mereka menyiapkan rempah-rempah dan minyak wangi.[a] Pada hari Sabat mereka beristirahat sesuai dengan perintah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Minyak wangi'' dapat juga diterjemahkan ''salep wangi'' atau ''minyak beraroma''.'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah perintah dalam Taurat untuk beristirahat pada hari Sabat.
    reason: contextual_clarification
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: setelah kembali
  rationale: Partisip aoris aktif feminin jamak menyatakan tindakan para perempuan yang terjadi sebelum verba utama; frasa ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai kelanjutan ringan dalam narasi; hubungan tersebut sudah tersampaikan secara alami melalui susunan kalimat Indonesia.
- source_word: ἡτοίμασαν
  choice: mereka menyiapkan
  rationale: Padanan modern dan langsung untuk tindakan mempersiapkan bahan-bahan bagi pemakaman.
- source_word: ἀρώματα
  choice: rempah-rempah
  rationale: Dalam konteks pemakaman, kata ini menunjuk pada bahan-bahan aromatik; pilihan ini jelas dan lazim dipahami.
- source_word: μύρα
  choice: minyak wangi
  rationale: Kata ini menunjuk pada minyak atau salep beraroma. 'Minyak wangi' membedakannya dari rempah-rempah dan lebih alami daripada 'salep wangi' dalam konteks ini.
- source_word: τὸ μὲν σάββατον
  choice: pada hari Sabat
  rationale: Ungkapan temporal yang alami; μέν bersifat transisional ringan dan tidak perlu diberi padanan tersendiri.
- source_word: ἡσύχασαν
  choice: mereka beristirahat
  rationale: Dalam konteks Sabat, verba ini berarti berhenti dari kegiatan atau beristirahat.
- source_word: κατὰ τὴν ἐντολήν
  choice: sesuai dengan perintah itu
  rationale: Mempertahankan bentuk tunggal dan acuan tertentu dari kata sandang Yunani tanpa memperluas isi perintah dalam teks utama.
theological_decisions:
- issue: Acuan 'perintah itu'
  choice: dipertahankan sebagai perintah tertentu yang diketahui dari konteks
  alternative: dijelaskan langsung sebagai perintah Musa tentang hari Sabat
  rationale: Konteks mengarah pada perintah Taurat mengenai Sabat, tetapi teks Yunani hanya mengatakan 'perintah itu'. Terjemahan utama tidak menambahkan penjelasan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat dibagi dua mengikuti peralihan tindakan dalam teks Yunani. 'Perintah itu' dipilih alih-alih 'perintah tersebut' agar mudah dipahami tanpa kehilangan kekhususan acuannya.
