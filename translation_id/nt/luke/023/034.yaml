  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: id
  text: Namun, Yesus terus berkata[a], “Bapa, ampunilah mereka, sebab mereka tidak tahu apa yang mereka lakukan.” Lalu mereka membagi-bagi pakaian-Nya dengan membuang undi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah tidak memuat: “Bapa, ampunilah mereka, sebab mereka tidak tahu apa yang mereka lakukan.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: terus berkata
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau diulangi; frasa ini mempertahankan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: Πάτερ
  choice: Bapa
  rationale: Bentuk vokatif sapaan langsung kepada Allah; 'Bapa' alami dan tidak menambahkan unsur kepunyaan yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ἄφες
  choice: ampunilah
  rationale: Dalam doa kepada Allah mengenai orang-orang yang bersalah, ἀφίημι paling tepat bermakna memaafkan atau mengampuni; bentuk 'ampunilah' sesuai dengan ragam doa yang bermartabat.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina ini tidak merinci kelompok yang dimaksud; 'mereka' mempertahankan ketidakspesifikan tersebut.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: sebab mereka tidak tahu apa yang mereka lakukan
  rationale: Terjemahan langsung dan alami yang mempertahankan makna pengetahuan tanpa memperluasnya menjadi 'tidak memahami'.
- source_word: διαμεριζόμενοι
  choice: membagi-bagi
  rationale: Partisipel ini menggambarkan pembagian pakaian Yesus di antara para pelaku; reduplikasi membuat tindakan pembagian terdengar alami dalam bahasa Indonesia.
- source_word: ἱμάτια
  choice: pakaian-Nya
  rationale: ἱμάτια menunjuk pada pakaian; 'pakaian' merupakan istilah modern, wajar, dan tetap bermartabat. Akhiran '-Nya' mengungkapkan αὐτοῦ dan mengikuti kebiasaan penulisan rujukan kepada Yesus.
- source_word: ἔβαλον κλήρους
  choice: dengan membuang undi
  rationale: Ungkapan idiomatis Indonesia untuk praktik menentukan pembagian melalui undian; 'dengan' secara alami menghubungkannya dengan tindakan membagi pakaian.
- source_word: δὲ
  choice: Namun / Lalu
  rationale: Kemunculan pertama menandai peralihan dengan sedikit kontras, sedangkan yang kedua melanjutkan alur narasi; variasi kontekstual ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Keaslian ucapan “Bapa, ampunilah mereka, sebab mereka tidak tahu apa yang mereka lakukan”
  choice: Dicantumkan dalam teks utama dengan penanda catatan kaki
  alternative: Sejumlah naskah tidak memuat seluruh ucapan tersebut
  rationale: SBLGNT mencetak bagian ini dalam teks dengan tanda yang menunjukkan variasi tekstual. Terjemahan mengikuti teks sumber yang diberikan sambil mengungkapkan bukti naskah alternatif dalam catatan kaki, tanpa memutuskan persoalan itu secara dogmatis.
- issue: Kelompok yang dirujuk oleh “mereka”
  choice: Dibiarkan tidak ditentukan
  alternative: Menafsirkannya secara khusus sebagai prajurit Romawi, para pemimpin, atau semua orang yang terlibat
  rationale: Bahasa Yunani hanya memakai pronomina αὐτοῖς dan tidak mengidentifikasi kelompok itu dalam ucapan tersebut; terjemahan mempertahankan ambiguitas ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Terus berkata' mempertahankan aspek imperfek tanpa terasa kaku; 'membuang undi' memakai ungkapan Indonesia yang umum. Penanda catatan kaki [a] ditempatkan segera setelah verba yang memperkenalkan ucapan yang dipersoalkan secara tekstual.
