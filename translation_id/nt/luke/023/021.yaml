  text: οἱ δὲ ἐπεφώνουν λέγοντες· ⸂Σταύρου σταύρου⸃ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: id
  text: Namun, mereka terus berteriak, “Salibkan dia! Salibkan dia!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “Hukum mati dia di kayu salib! Hukum mati dia di kayu salib!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: οἱ dipakai secara substantival dan menunjuk kembali kepada orang banyak dalam konteks; δέ menandai pertentangan ringan dengan perkataan Pilatus sebelumnya.
- source_word: ἐπεφώνουν
  choice: terus berteriak
  rationale: Bentuk imperfek menggambarkan seruan yang berlangsung atau diulang, sedangkan ἐπιφωνέω menyatakan tindakan berseru dengan suara keras.
- source_word: λέγοντες
  choice: tidak diterjemahkan secara terpisah
  rationale: Partisipel ini memperkenalkan isi teriakan. Dalam bahasa Indonesia, kutipan langsung sesudah 'terus berteriak' sudah menyampaikan fungsi tersebut secara alami tanpa menambahkan 'dengan berkata' yang kaku.
- source_word: Σταύρου σταύρου
  choice: Salibkan dia! Salibkan dia!
  rationale: Imperatif yang diulang menyatakan desakan kuat. Objek αὐτόν diulang dalam bahasa Indonesia agar setiap seruan terdengar utuh dan alami, tanpa mengubah acuannya.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina akusatif ini adalah objek perintah dan secara alami diterjemahkan 'dia'.
theological_decisions:
- issue: Makna tuntutan σταύρου
  choice: Salibkan
  alternative: Hukum mati di kayu salib
  rationale: σταυρόω secara khusus berarti menyalibkan atau mengeksekusi pada salib. 'Salibkan' mempertahankan ketepatan leksikal dan bentuk perintah tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Repetisi dipertahankan untuk menyampaikan desakan orang banyak; tanda seru dipakai agar daya seruan imperatif terdengar alami.
