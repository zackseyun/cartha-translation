  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: id
  text: Dan imam-imam kepala dan para ahli Taurat berdiri di sana sambil menuduh Dia dengan sengit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan keras menuduh Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: berdiri di sana
  rationale: Bentuk lampau statif ini menggambarkan mereka berada di tempat itu dalam posisi berdiri; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi penggambaran adegan.
- source_word: δὲ
  choice: Sementara itu
  rationale: Partikel ini merupakan penghubung ringan yang mengalihkan perhatian kepada tindakan para pemimpin agama tanpa menandai pertentangan yang kuat.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah baku untuk para pemimpin kalangan imam, bukan pernyataan bahwa beberapa orang sekaligus memegang jabatan tunggal imam besar.
- source_word: γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk para pakar dan penafsir hukum Taurat; padanan ini lebih jelas bagi pembaca Indonesia masa kini daripada 'juru tulis'.
- source_word: εὐτόνως
  choice: dengan keras
  rationale: Adverbia ini menyatakan intensitas dan kegigihan yang kuat; 'dengan keras' menyampaikan sifat tuduhan mereka secara alami tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: κατηγοροῦντες
  choice: sambil ... menuduh
  rationale: Partisipel kini menunjukkan tindakan yang sedang berlangsung bersamaan dengan keberadaan mereka di sana; 'sambil' mempertahankan hubungan itu.
- source_word: αὐτοῦ
  choice: Dia
  rationale: Genitif sebagai pelengkap κατηγορέω secara idiomatis berarti orang yang dituduh. 'Menuduh Dia' menyampaikan hubungan tersebut secara langsung.
theological_decisions: []
