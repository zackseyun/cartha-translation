  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: id
  text: Hari itu adalah hari Persiapan, dan Sabat hampir mulai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Sabat mulai menyingsing.” Kata kerja Yunani ini secara dasar dapat berarti “mulai menyingsing” atau “mulai”; dalam konteks ini, yang dimaksud ialah Sabat yang segera dimulai pada petang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: hari Persiapan
  rationale: Dalam pemakaian Yunani-Yahudi, παρασκευή lazim menunjuk pada hari persiapan sebelum Sabat. Huruf kapital mempertahankannya sebagai sebutan hari tanpa menggantinya dengan padanan kontekstual “Jumat”.
- source_word: σάββατον
  choice: hari Sabat
  rationale: Walaupun tanpa kata sandang dalam bahasa Yunani, konteks dengan jelas menunjuk pada hari Sabat mingguan tertentu; bentuk “hari Sabat” alami dan jelas dalam bahasa Indonesia.
- source_word: ἐπέφωσκεν
  choice: mulai tiba
  rationale: Kata kerja ini secara harfiah dapat menggambarkan fajar yang mulai menyingsing, tetapi di sini menunjuk pada mulainya Sabat pada petang hari. “Mulai tiba” menyampaikan peralihan waktu itu tanpa memberi kesan keliru bahwa saatnya pagi.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Hari itu adalah hari Persiapan
  rationale: Susunan ini mempertahankan pengertian konstruksi genitif Yunani sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Kata hubung dipertahankan untuk mencerminkan koordinasi naratif Lukas tanpa menambahkan penafsiran mengenai urutan peristiwa.
theological_decisions:
- issue: Makna ἐπέφωσκεν sehubungan dengan awal hari Sabat
  choice: Ayat ini menunjuk pada hari Sabat yang mulai tiba pada petang hari.
  alternative: hari Sabat mulai menyingsing
  rationale: Dalam perhitungan waktu Yahudi, hari Sabat dimulai pada petang hari. Terjemahan “mulai tiba” menjaga maksud temporal dalam konteks penguburan, sedangkan gambaran harfiah kata Yunani dipertahankan dalam catatan kaki agar ketegangan leksikal tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah “hari Persiapan” dipertahankan sebagai sebutan kalender Yahudi, sedangkan “mulai tiba” menghindari kesan bahwa Sabat dimulai pada pagi hari.
