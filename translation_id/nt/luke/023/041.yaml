id: LUK.23.41
reference: Luke 23:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: id
  text: Dan kami memang dihukum dengan adil, sebab kami sedang menerima apa yang setimpal dengan perbuatan kami; tetapi orang ini tidak melakukan apa pun yang salah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίως
  choice: dihukum dengan adil
  rationale: Adverbia ini menyatakan bahwa hukuman mereka memang layak dan adil. Kata kerja 'dihukum' dibuat eksplisit dari konteks penyaliban agar kalimat alami dan jelas dalam bahasa Indonesia.
- source_word: ἄξια ὧν ἐπράξαμεν
  choice: apa yang setimpal dengan perbuatan kami
  rationale: Ungkapan ini menyatakan akibat yang sepadan dengan tindakan mereka. 'Setimpal' mempertahankan gagasan proporsionalitas tanpa terdengar kaku.
- source_word: ἀπολαμβάνομεν
  choice: kami sedang menerima
  rationale: Bentuk kini menggambarkan akibat yang sedang mereka alami pada saat berbicara.
- source_word: οὗτος
  choice: orang ini
  rationale: Menjaga daya tunjuk demonstratif dan kontras antara kedua penjahat dengan Yesus.
- source_word: οὐδὲν ἄτοπον
  choice: tidak melakukan apa pun yang salah
  rationale: Dalam konteks pengadilan, ἄτοπον berarti sesuatu yang tidak patut atau salah. Pilihan ini jelas dan alami tanpa mempersempit makna menjadi tindak pidana saja.
- source_word: ἔπραξεν
  choice: melakukan
  rationale: Padanan alami bagi tindakan yang telah dilakukan; bersama 'apa pun yang salah' menghasilkan ungkapan Indonesia yang idiomatis.
theological_decisions:
- issue: Pernyataan penjahat mengenai ketidakbersalahan Yesus
  choice: tetapi orang ini tidak melakukan apa pun yang salah
  alternative: tetapi orang ini tidak melakukan sesuatu pun yang tidak patut
  rationale: Terjemahan menyampaikan kesaksian tentang ketidakbersalahan Yesus dalam konteks penghukuman, tanpa menambahkan kesimpulan doktrinal yang melampaui perkataan Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kontras μὲν ... δὲ dipertahankan melalui 'memang ... tetapi'. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting yang harus dipertahankan bagi pembaca.
