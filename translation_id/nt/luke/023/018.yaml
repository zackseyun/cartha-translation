  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: id
  text: Namun mereka semua berseru serentak, “Singkirkan orang ini! Bebaskan Barabas bagi kami!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: berseru
  rationale: Kata kerja ini menyatakan seruan keras; “berseru” alami dan bermartabat dalam narasi Indonesia serta mempertahankan intensitasnya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai perkembangan yang berlawanan dengan perkataan Pilatus sebelumnya; “Namun” menyampaikan kontras tersebut secara wajar.
- source_word: παμπληθεὶ
  choice: semua ... serentak
  rationale: Adverbia ini menggambarkan tindakan kolektif seluruh kelompok. Susunan “mereka semua berseru serentak” menyampaikan baik cakupan maupun kebersamaan tindakan tanpa menambahkan gagasan ‘dengan satu suara’.
- source_word: λέγοντες
  choice: (diungkapkan langsung melalui kutipan)
  rationale: Partisip ini memperkenalkan isi seruan. Dalam bahasa Indonesia, kutipan langsung setelah “berseru” sudah menjalankan fungsi tersebut, sehingga “dengan berkata” tidak diperlukan.
- source_word: Αἶρε
  choice: Singkirkan
  rationale: Imperatif αἴρω di sini menuntut agar Yesus disingkirkan. “Singkirkan” ringkas, kuat, dan tetap mempertahankan ketidakjelasan apakah maksud langsungnya sekadar membawa pergi atau membinasakan.
- source_word: τοῦτον
  choice: orang ini
  rationale: Demonstrativa maskulin ini menunjuk langsung kepada Yesus. “Orang ini” alami dalam bahasa Indonesia dan mempertahankan daya tunjuk yang dapat bernada merendahkan.
- source_word: ἀπόλυσον
  choice: Bebaskan
  rationale: Imperatif ini berarti melepaskan dari tahanan; “bebaskan” jelas dan sesuai dengan konteks hukum.
- source_word: ἡμῖν
  choice: bagi kami
  rationale: Dativa ini dapat menandai pihak penerima atau penerima manfaat. “Bagi kami” alami sesudah “bebaskan” dan tidak menyiratkan bahwa Barabas diserahkan secara fisik kepada mereka.
- source_word: τὸν Βαραββᾶν
  choice: Barabas
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim.
theological_decisions:
- issue: Daya makna perintah Αἶρε
  choice: Diterjemahkan “Singkirkan” tanpa menyebut eksekusi secara eksplisit.
  alternative: “Bawa pergi” atau “Binasakan”
  rationale: Konteks mengarah kepada tuntutan agar Yesus dihukum mati, tetapi verba itu sendiri berarti mengangkat atau menyingkirkan. Terjemahan tidak boleh mempersempitnya menjadi ‘bunuh’ secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda seru memisahkan dua imperatif dan mempertahankan desakan seruan massa. Tidak ada catatan kaki karena alternatif leksikal utama dapat terwakili dengan baik dalam teks tanpa perlu penjelasan tambahan.
