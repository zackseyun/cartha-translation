  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan Ἀνέκραγον δὲ παμπληθεὶ sebagai “Namun mereka semua berseru serentak.” Kedua imperatif dipertahankan: Αἶρε τοῦτον sebagai “Singkirkan orang ini” dan ἀπόλυσον δὲ ἡμῖν τὸν Βαραββᾶν sebagai “Bebaskan Barabas bagi kami.” “Singkirkan” dengan tepat tidak mempersempit αἴρω menjadi tuntutan eksplisit untuk membunuh, sementara tetap menyampaikan penolakan keras terhadap Yesus.'
  naturalness: Bahasanya modern, jelas, dan sesuai register naratif. Susunan “mereka semua berseru serentak” terdengar alami dan menyampaikan tindakan kolektif. Pemisahan dua perintah dengan tanda seru wajar dalam kutipan langsung Indonesia dan mempertahankan daya desaknya.
  terminology: “Barabas” adalah bentuk nama yang lazim dalam Alkitab bahasa Indonesia. “Bebaskan” tepat bagi ἀπόλυσον dalam konteks penahanan dan peradilan. Tidak ada istilah teologis teknis yang memerlukan penyeragaman tambahan.
