id: LUK.23.4
reference: Luke 23:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: id
  text: Lalu Pilatus berkata kepada para imam kepala dan orang banyak, “Aku tidak menemukan dasar untuk mendakwa orang ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Aku tidak menemukan kesalahan pada orang ini.” Kata Yunani αἴτιον dapat berarti “kesalahan”, tetapi dalam konteks ini bernuansa hukum: tidak ada dasar yang sah untuk mengajukan dakwaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Partikel penghubung ringan ini paling alami menyatakan kelanjutan alur narasi tanpa menambahkan pertentangan yang kuat.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Mengikuti bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: εἶπεν πρὸς
  choice: berkata kepada
  rationale: Menyampaikan tindakan berbicara yang ditujukan kepada para pendengar secara alami dan tepat.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Merujuk pada kalangan pimpinan imam; bentuk ini tidak menyiratkan adanya beberapa pemegang tunggal jabatan imam besar.
- source_word: ὄχλους
  choice: orang banyak
  rationale: Ungkapan Indonesia yang alami bagi kelompok-kelompok khalayak; meskipun nomina Yunani berbentuk jamak, bahasa Indonesia tidak perlu menandai jamak secara eksplisit di sini.
- source_word: Οὐδὲν εὑρίσκω
  choice: Aku tidak menemukan
  rationale: Mempertahankan penilaian Pilatus dalam kala kini dan menyampaikan negasi secara wajar dalam bahasa Indonesia.
- source_word: αἴτιον
  choice: dasar untuk mendakwa
  rationale: Dalam konteks pengadilan, kata ini menunjuk pada alasan atau dasar yang sah bagi suatu dakwaan, bukan sekadar kesalahan moral yang umum.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: orang ini
  rationale: Bersama ungkapan yudisial sebelumnya, relasinya secara idiomatis tercakup dalam 'mendakwa orang ini', sambil mempertahankan demonstratif sumber.
theological_decisions: []
