id: LUK.23.8
reference: Luke 23:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: id
  text: Ketika Herodes melihat Yesus, ia sangat gembira, sebab sudah lama ia ingin melihat-Nya karena terus mendengar kabar tentang Dia.[a] Ia juga berharap dapat melihat suatu tanda[b] yang dilakukan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “karena telah mendengar tentang Dia.” Bentuk infinitif kini dalam bahasa Yunani dapat memberi kesan bahwa Herodes berulang kali atau terus-menerus menerima kabar tentang Yesus.
    reason: lexical_alternative
  - marker: b
    text: Atau “mukjizat.” Kata Yunani yang digunakan berarti “tanda” dan dapat menunjuk pada perbuatan ajaib yang dipandang memiliki makna khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν
  choice: Ketika Herodes melihat Yesus
  rationale: Partisip aoris ἰδών paling wajar menyatakan hubungan waktu dengan verba utama. δέ menandai kelanjutan narasi dan tidak perlu diterjemahkan dengan kata waktu tersendiri.
- source_word: ἐχάρη λίαν
  choice: ia sangat gembira
  rationale: Ungkapan ini berarti bahwa Herodes merasa sangat senang. Pilihan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan penguat λίαν.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: sebab sudah lama ia ingin melihat-Nya
  rationale: ἐξ ἱκανῶν χρόνων menunjukkan jangka waktu yang panjang tanpa menentukan jumlah tahun, sedangkan konstruksi ἦν ... θέλων menyatakan keinginan yang telah berlangsung.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: karena terus mendengar kabar tentang Dia
  rationale: διά dengan infinitif artikular menyatakan sebab. Bentuk kini ἀκούειν memungkinkan nuansa mendengar secara berulang atau berkelanjutan; 'mendengar kabar' merupakan ungkapan Indonesia yang alami.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: Ia juga berharap dapat melihat suatu tanda
  rationale: ἤλπιζεν menyatakan harapan yang sedang ada, dan σημεῖον diterjemahkan 'tanda' agar makna tindakan ajaib sebagai tanda yang bermakna tidak dipersempit menjadi sekadar mukjizat.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: yang dilakukan-Nya
  rationale: Frasa ini mempertahankan Yesus sebagai pelaku tanda sebagaimana ditandai oleh ὑπό. Klausa relatif menghasilkan bahasa Indonesia yang lebih alami daripada bentuk pasif harfiah yang kaku.
theological_decisions:
- issue: Makna σημεῖον
  choice: tanda
  alternative: mukjizat
  rationale: '''Tanda'' mempertahankan istilah Yunani dan kemungkinan bahwa tindakan ajaib itu dipandang memiliki arti atau fungsi penunjuk, tanpa menyangkal bahwa mukjizat memang dimaksudkan dalam konteks ini.'
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Ayat dibagi menjadi dua kalimat agar rangkaian alasan dan harapan Herodes mudah dipahami. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia dan membantu memperjelas rujukan tanpa menambahkan penafsiran denominasi.
