base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: id
  text: Jadi, Pilatus membebaskan orang yang telah dijebloskan ke dalam penjara[a] karena pemberontakan dan pembunuhan, yaitu orang yang mereka minta; tetapi ia menyerahkan Yesus kepada kehendak mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “telah dilemparkan ke dalam penjara”; dapat juga diterjemahkan “telah dimasukkan ke dalam penjara.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sesuai dengan apa yang mereka kehendaki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: membebaskan
  rationale: Dalam konteks tahanan, ἀπολύω berarti melepaskan atau membebaskan. “Membebaskan” tepat, alami, dan mempertahankan nuansa tindakan resmi Pilatus.
- source_word: διὰ στάσιν καὶ φόνον
  choice: karena pemberontakan dan pembunuhan
  rationale: διά dengan akusatif menyatakan sebab. Dalam konteks politik ini, στάσις menunjuk pada pemberontakan atau pergolakan melawan penguasa, bukan sekadar perselisihan.
- source_word: βεβλημένον εἰς φυλακήν
  choice: telah dijebloskan ke dalam penjara
  rationale: Partisip perfek pasif βάλλω secara hidup menggambarkan orang itu sebagai telah “dilemparkan” ke penjara. “Dijebloskan” mempertahankan daya ungkap tersebut dan tetap wajar dalam bahasa Indonesia.
- source_word: ὃν ᾐτοῦντο
  choice: yaitu orang yang mereka minta
  rationale: Bentuk imperfek ᾐτοῦντο menunjukkan permintaan yang sedang atau terus berlangsung. “Mereka minta” terdengar alami dan tidak memperkuatnya menjadi “tuntut” tanpa keharusan leksikal.
- source_word: παρέδωκεν
  choice: menyerahkan
  rationale: παραδίδωμι di sini menyatakan penyerahan Yesus ke dalam kuasa pihak lain untuk menjalankan kehendak mereka; “menyerahkan” menjaga nuansa yudisial sekaligus menjadi bahasa Indonesia yang alami.
- source_word: τῷ θελήματι αὐτῶν
  choice: kepada kemauan mereka
  rationale: θέλημα dapat berarti kehendak, keinginan, atau apa yang dikehendaki. “Kemauan mereka” mempertahankan unsur volisional tanpa membuat objek penyerahan menjadi terlalu eksplisit.
- source_word: δὲ ... δὲ
  choice: Jadi ... tetapi
  rationale: δέ pertama melanjutkan hasil dari adegan sebelumnya, sehingga “Jadi” sesuai; δέ kedua menandai kontras tajam antara pembebasan tahanan itu dan penyerahan Yesus, sehingga diterjemahkan “tetapi”.
theological_decisions:
- issue: Kontras antara pembebasan pemberontak dan penyerahan Yesus tanpa memasukkan tafsiran pendamaian
  choice: Kontras naratif dipertahankan secara jelas, tetapi tidak ditambahkan ungkapan seperti “sebagai gantinya” atau “menggantikan Yesus.”
  alternative: Menjelaskan bahwa orang itu dibebaskan sebagai pengganti Yesus.
  rationale: Ayat ini melaporkan keputusan Pilatus dan kemauan orang banyak. Makna substitusi dapat ditarik dari kisah sengsara yang lebih luas, tetapi tidak dinyatakan secara eksplisit dalam ayat ini.
- issue: Makna τῷ θελήματι αὐτῶν
  choice: “menyerahkan Yesus kepada kemauan mereka” dipertahankan sebagai ungkapan yang agak padat dan terbuka.
  alternative: “menyerahkan Yesus untuk diperlakukan sesuai dengan keinginan mereka.”
  rationale: Alternatif tersebut menjelaskan maksud kalimat, tetapi juga menambahkan unsur “diperlakukan” yang tidak dinyatakan langsung. Terjemahan utama mempertahankan ketegangan dan kepadatan ungkapan Yunani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Dijebloskan” dipilih untuk mempertahankan gambaran hidup dari βάλλω, sedangkan struktur “kepada kemauan mereka” sengaja mempertahankan kepadatan dan ambiguitas terbatas teks Yunani. Semua penanda catatan kaki dicantumkan dalam teks utama.
