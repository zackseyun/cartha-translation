id: LUK.23.51
reference: Luke 23:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: id
  text: Ia tidak turut menyetujui rencana dan tindakan mereka.[a] Ia berasal dari Arimatea, sebuah kota orang Yahudi, dan sedang menantikan Kerajaan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia tidak turut menyetujui keputusan dan perbuatan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: tidak turut menyetujui
  rationale: Ungkapan ini menyatakan bahwa Yusuf tidak memberikan persetujuan bersama terhadap sikap para pemimpin lainnya. Kata “turut” mempertahankan unsur kebersamaan dalam verba Yunani tanpa menyiratkan prosedur pemungutan suara tertentu.
- source_word: βουλῇ
  choice: rencana
  rationale: Dalam pasangan dengan πρᾶξις, kata ini menunjuk pada maksud atau rancangan yang kemudian diwujudkan, bukan pada lembaga dewan itu sendiri.
- source_word: πράξει
  choice: tindakan
  rationale: Pilihan ini membedakan pelaksanaan nyata dari rencana yang mendahuluinya.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: berasal dari Arimatea, sebuah kota orang Yahudi
  rationale: Terjemahan ini mengikuti susunan aposisional bahasa Yunani dan mempertahankan ungkapan τῶν Ἰουδαίων tanpa mempersempitnya menjadi keterangan geografis yang lebih khusus.
- source_word: προσεδέχετο
  choice: sedang menantikan
  rationale: Bentuk imperfek menggambarkan sikap menanti yang berlangsung dan penuh pengharapan; “sedang menantikan” mempertahankan aspek duratif itu.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini merupakan padanan Indonesia yang baku dan jelas bagi ungkapan khas Lukas tersebut, serta mempertahankan bobot teologisnya.
- source_word: οὗτος
  choice: Ia
  rationale: Karena Yusuf telah disebut pada ayat sebelumnya, pronomina “Ia” menjadi rujukan yang paling alami dalam bahasa Indonesia; pemisahan menjadi dua kalimat tetap menjaga fokus pada orang yang sama.
theological_decisions:
- issue: Bentuk ketidakikutsertaan Yusuf dalam keputusan dan tindakan para pemimpin
  choice: Menyatakan bahwa Yusuf tidak turut menyetujui rencana dan tindakan mereka tanpa menyebut pemungutan suara.
  alternative: Yusuf tidak memberikan suara untuk keputusan mereka.
  rationale: Teks Yunani menegaskan ketidaksetujuan Yusuf terhadap βουλή dan πρᾶξις mereka, tetapi tidak menjelaskan mekanisme pengambilan keputusan. Terjemahan tidak memasukkan rekonstruksi historis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ayat dibagi menjadi dua kalimat agar struktur informasi alami tanpa mengubah hubungan antarklausanya. Kapitalisasi “Kerajaan Allah” mengikuti pemakaian umum untuk istilah teologis ini.
