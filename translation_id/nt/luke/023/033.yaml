  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: id
  text: Ketika mereka sampai di tempat yang disebut Tengkorak[a], di sana mereka menyalibkan dia dan kedua penjahat itu, yang seorang di sebelah kanan dan yang lain di sebelah kiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani Κρανίον berarti “tengkorak.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang seorang dari sebelah kanan dan yang lain dari sebelah kiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: sampai di tempat
  rationale: Dalam konteks gerak menuju suatu lokasi, ungkapan ini secara alami menyatakan tibanya mereka di tempat itu; 'sampai di' lebih wajar dalam narasi Indonesia daripada terjemahan yang terlalu harfiah.
- source_word: τὸν καλούμενον Κρανίον
  choice: yang disebut Tengkorak
  rationale: Κρανίον secara harfiah berarti 'tengkorak'. Menerjemahkan maknanya mempertahankan arti sebutan tempat itu tanpa memasukkan bentuk tradisional dari bahasa lain.
- source_word: ἐσταύρωσαν
  choice: menyalibkan
  rationale: '''Menyalibkan'' adalah padanan Indonesia yang baku dan tepat bagi σταυρόω, tanpa menambahkan rincian cara pelaksanaan yang tidak dinyatakan oleh verba tersebut.'
- source_word: κακούργους
  choice: kedua penjahat itu
  rationale: κακοῦργος menunjuk kepada orang yang melakukan kejahatan. 'Penjahat' jelas dan modern; 'kedua' tersirat oleh konstruksi berikutnya yang membagi mereka menjadi seorang di kanan dan seorang di kiri.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: yang seorang di sebelah kanan dan yang lain di sebelah kiri
  rationale: Konstruksi korelatif Yunani membagi kedua penjahat berdasarkan posisi. Rumusan ini alami dalam bahasa Indonesia dan tidak menambahkan kata 'dia-Nya', yang hanya tersirat dalam konteks.
theological_decisions:
- issue: Penerjemahan Κρανίον
  choice: Tengkorak
  alternative: tempat yang disebut Tengkorak itu; Kranion
  rationale: Sebutan tempat ini dibentuk dari kata benda umum yang berarti 'tengkorak'. Menerjemahkan maknanya mempertahankan informasi leksikal dan tidak mengimpor nama tradisional dari kisah paralel.
- issue: Sebutan bagi dua orang yang disalibkan bersama Yesus
  choice: penjahat
  alternative: pelaku kejahatan; orang-orang jahat
  rationale: κακοῦργοι lebih umum daripada 'perampok' atau 'pemberontak'. 'Penjahat' mempertahankan keluasan istilah Lukas dan menghindari penyelarasan dengan istilah dalam Injil lain.
- issue: Acuan posisi kanan dan kiri
  choice: tidak menyebut secara eksplisit 'di sebelah kanan-Nya' dan 'di sebelah kiri-Nya'
  alternative: yang seorang di sebelah kanan-Nya dan yang lain di sebelah kiri-Nya
  rationale: Acuan kepada Yesus jelas dari konteks, tetapi pronomina posesif tidak dinyatakan secara eksplisit dalam teks Yunani. Teks utama mempertahankan bentuk yang tidak menambahkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kecil pada 'dia' mengikuti kaidah narasi umum dan tidak dimaksudkan sebagai pernyataan teologis. Susunan kalimat dijaga dekat dengan alur Yunani sambil tetap alami bagi pembaca Indonesia.
