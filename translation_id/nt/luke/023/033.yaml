revisions:
- from: Ketika mereka sampai di tempat yang disebut Tengkorak[a], di sana mereka menyalibkan dia bersama kedua penjahat itu, yang seorang di sebelah kanan dan yang lain di sebelah kiri.[b]
  to: Ketika mereka sampai di tempat yang disebut Tengkorak[a], di sana mereka menyalibkan dia dan kedua penjahat itu, yang seorang di sebelah kanan dan yang lain di sebelah kiri[b].
  rationale: Revisi menghilangkan “bersama” agar koordinasi antara Yesus dan dua penjahat mengikuti teks Yunani secara lebih langsung. Penanda catatan b dipindahkan ke frasa posisi yang menjadi acuannya, dan kedua catatan diringkaskan agar hanya menjelaskan informasi leksikal yang relevan tanpa menambahkan acuan eksplisit kepada Yesus.
