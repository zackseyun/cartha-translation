  to: Ketika perwira itu melihat apa yang telah terjadi, ia memuliakan Allah dengan berkata, “Sungguh, orang ini adalah orang benar.”[a]
  rationale: Mengganti “orang ini benar” dengan “orang ini adalah orang benar” agar δίκαιος diterjemahkan secara jelas sebagai kualitas orang tersebut, bukan sebagai penilaian bahwa ia benar dalam suatu perkara. Catatan kaki mempertahankan ambiguitas yang relevan antara kebenaran moral, keadilan, dan ketidakbersalahan hukum.
