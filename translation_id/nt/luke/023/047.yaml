    issue: “orang ini benar” untuk δίκαιος
    rationale: Dalam pemakaian Indonesia kini, frasa tersebut lazimnya menyatakan bahwa seseorang benar dalam pendapat atau tindakannya. Frasa itu tidak secara jelas menyatakan bahwa orang tersebut saleh/benar secara moral atau adil, dan karena itu mengaburkan pengakuan yang dimaksud teks.
