  source_fidelity: Klausa temporal, tindakan memuliakan Allah, dan pengakuan perwira diterjemahkan dengan setia. Namun, predikat “orang ini benar” dalam bahasa Indonesia modern terutama berarti bahwa ia tepat atau tidak keliru, sehingga tidak menyampaikan makna δίκαιος secara memadai.
  naturalness: Susunan kalimat pada umumnya alami. “Orang ini adalah orang benar” adalah ungkapan Indonesia yang jelas dan lazim dalam register Alkitabiah-modern untuk seseorang yang righteous, tanpa menghapus kemungkinan nuansa ketidakbersalahan melalui catatan kaki.
  terminology: “Memuliakan Allah” tepat untuk ἐδόξαζεν τὸν θεόν. “Orang benar” mempertahankan istilah utama δίκαιος dengan lebih baik daripada “benar”; alternatif “tidak bersalah” dan “adil” tetap layak dicatat.
  issues:
