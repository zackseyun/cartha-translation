  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: id
  text: Ketika perwira itu melihat apa yang telah terjadi, ia memuliakan Allah dengan berkata, “Sungguh, orang ini adalah orang benar.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak bersalah” atau “adil.” Kata Yunani ini dapat menunjuk pada kebenaran moral atau ketidakbersalahan secara hukum dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Ketika ... melihat
  rationale: Partisip aoris diberi makna temporal secara alami dalam bahasa Indonesia dan tetap mempertahankan hubungannya dengan verba utama.
- source_word: δὲ
  choice: tidak dinyatakan secara eksplisit
  rationale: Partikel penghubung ringan ini tidak perlu diterjemahkan tersendiri; alur narasi sudah tersampaikan secara alami oleh klausa temporal.
- source_word: ὁ ἑκατοντάρχης
  choice: perwira itu
  rationale: Dalam konteks Romawi, istilah ini menunjuk komandan seratus prajurit. 'Perwira' merupakan padanan Indonesia yang alami; penanda definit diteruskan dengan 'itu'.
- source_word: τὸ γενόμενον
  choice: apa yang telah terjadi
  rationale: Partisip berartikel menunjuk pada kejadian yang baru disaksikan; bentuk ini alami dan menyatakan bahwa peristiwa tersebut telah berlangsung.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: ia memuliakan Allah
  rationale: Imperfek Yunani tidak harus diperluas menjadi 'mulai memuliakan' dalam konteks ini. 'Memuliakan' mempertahankan bobot kata δοξάζω.
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisip ini memperkenalkan perkataan yang menjadi cara atau wujud ia memuliakan Allah.
- source_word: Ὄντως
  choice: Sungguh
  rationale: Ungkapan penegasan yang alami, kuat, dan bermartabat dalam bahasa Indonesia.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: orang ini
  rationale: Padanan langsung dan alami yang merujuk kepada Yesus tanpa menambahkan gelar atau identifikasi yang tidak ada dalam teks.
- source_word: δίκαιος
  choice: benar
  rationale: Kata ini dapat menyatakan kebenaran moral maupun ketidakbersalahan dalam konteks hukum. 'Benar' mempertahankan keluasan makna tersebut, sementara alternatif yang lebih spesifik dicatat dalam catatan kaki.
- source_word: ἦν
  choice: adalah (tersirat dalam klausa nominal lampau)
  rationale: Bahasa Indonesia tidak memerlukan kopula eksplisit. Konteks naratif sudah menempatkan penilaian itu pada orang yang baru saja meninggal.
theological_decisions:
- issue: Makna δίκαιος dalam pengakuan perwira
  choice: benar
  alternative: tidak bersalah; adil
  rationale: ‘Benar’ mempertahankan kemungkinan makna moral-teologis tanpa meniadakan gema hukum dalam kisah penghukuman Yesus. Catatan kaki menyajikan alternatif yang sah agar ketegangan teks tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur dibuat lancar bagi pembaca umum tanpa menambahkan penanda wacana yang tidak diperlukan atau memperluas aspek verba secara berlebihan.
