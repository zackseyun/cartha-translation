  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: id
  text: Setelah mendengar hal itu, Pilatus kemudian bertanya apakah orang itu seorang Galilea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab serta bahasa Indonesia.
- source_word: δὲ
  choice: Ketika
  rationale: Partikel ini menandai perkembangan ringan dalam narasi. Dalam susunan bahasa Indonesia, hubungan naratifnya tersampaikan secara alami melalui anak kalimat waktu tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: ἀκούσας
  choice: mendengar hal itu
  rationale: Partisip aoris ini menerangkan tindakan Pilatus sebelum ia bertanya. 'Hal itu' dipasok dari konteks wacana karena objek verba dibiarkan tersirat dalam bahasa Yunani.
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: Padanan langsung dan alami untuk tindakan meminta keterangan dalam konteks ini.
- source_word: εἰ
  choice: apakah
  rationale: Memperkenalkan pertanyaan tidak langsung secara idiomatis dalam bahasa Indonesia.
- source_word: ὁ ἄνθρωπος
  choice: orang itu
  rationale: Mempertahankan rujukan tertentu kepada orang yang sedang dibicarakan tanpa menggantinya secara eksplisit dengan nama Yesus.
- source_word: Γαλιλαῖός
  choice: seorang Galilea
  rationale: Adjektiva predikatif ini menyatakan identitas kedaerahan; bentuk nominal 'seorang Galilea' wajar dan tepat dalam bahasa Indonesia.
- source_word: ἐστιν
  choice: seorang Galilea
  rationale: Kopula Yunani tersampaikan secara alami oleh predikat nominal tanpa kata 'adalah'; bahasa Indonesia tidak memerlukan penyesuaian kala dalam pertanyaan tidak langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan anak kalimat waktu dipilih agar hubungan partisip Yunani terbaca alami; 'adalah' dihilangkan dari teks utama karena kopula tidak diperlukan dalam predikat nominal bahasa Indonesia.
