id: LUK.23.5
reference: Luke 23:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: id
  text: Namun, mereka terus mendesak dengan berkata, “Ia menghasut rakyat[a] dengan mengajar di seluruh Yudea[b], mulai dari Galilea sampai ke sini[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggerakkan rakyat.” Kata Yunani yang dipakai dapat berarti membangkitkan atau menggerakkan orang dalam arti yang menimbulkan kekacauan.
    reason: lexical_alternative
  - marker: b
    text: “Yudea” dapat menunjuk secara khusus pada wilayah Yudea atau, dalam beberapa konteks, secara lebih luas pada negeri orang Yahudi yang sedang dibicarakan. Di sini ungkapan tersebut menekankan luasnya kegiatan yang dituduhkan kepada Yesus.
    reason: cultural_note
  - marker: c
    text: Atau “sampai ke tempat ini.” Ungkapan ini menunjukkan bahwa kegiatan tersebut dituduhkan meluas dari Galilea hingga lokasi mereka saat itu di hadapan Pilatus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: terus mendesak
  rationale: Bentuk imperfek menyatakan tindakan yang berlangsung atau berulang dengan tekanan yang kuat; frasa ini wajar dalam bahasa Indonesia dan sesuai dengan suasana desakan terhadap Pilatus.
- source_word: λέγοντες
  choice: dengan berkata
  rationale: Partisip ini memperkenalkan isi desakan mereka dan dapat dinyatakan secara alami sebagai keterangan cara.
- source_word: Ἀνασείει
  choice: menghasut
  rationale: Kata kerja ini menunjuk pada tindakan membangkitkan atau menggerakkan orang dalam arti yang mengacaukan. “Menghasut” menyampaikan sifat tuduhan tersebut tanpa menjadikannya istilah teknis untuk pemberontakan.
- source_word: τὸν λαὸν
  choice: rakyat
  rationale: λαός di sini mengacu pada masyarakat luas, bukan hanya kerumunan tertentu; “rakyat” juga sesuai dengan konteks tuduhan di hadapan penguasa.
- source_word: διδάσκων
  choice: dengan mengajar
  rationale: Partisip kini dapat menerangkan cara atau sarana yang menurut para penuduh dipakai Yesus untuk menggerakkan rakyat.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: di seluruh Yudea
  rationale: κατά dengan genitif menyatakan jangkauan wilayah; terjemahan ini mempertahankan penekanan pada luasnya kegiatan yang dituduhkan.
- source_word: Ἰουδαίας
  choice: Yudea
  rationale: Nama wilayah ini mengikuti bentuk baku bahasa Indonesia. Dalam konteks ini cakupannya dapat dipahami secara sempit atau lebih luas.
- source_word: ἀρξάμενος
  choice: mulai
  rationale: Partisip aoris menandai titik awal kegiatan yang sedang digambarkan.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: dari Galilea
  rationale: ἀπό menunjukkan titik asal atau awal geografis.
- source_word: ἕως ὧδε
  choice: sampai ke sini
  rationale: Ungkapan ini mempertahankan daya tunjuk ὧδε kepada lokasi mereka saat itu di hadapan Pilatus.
theological_decisions:
- issue: Sifat tuduhan terhadap Yesus
  choice: menghasut rakyat
  alternative: menggerakkan rakyat; mengobarkan rakyat
  rationale: Terjemahan mempertahankan tuduhan tentang agitasi sosial yang diajukan kepada Pilatus, tetapi tidak mempersempit maknanya menjadi dakwaan teknis pemberontakan yang tidak dinyatakan secara eksplisit oleh kata Yunani.
- issue: Cakupan geografis Ἰουδαία
  choice: Yudea, dengan catatan tentang kemungkinan cakupan yang lebih luas
  alternative: seluruh negeri orang Yahudi
  rationale: Nama wilayah dipertahankan secara formal, sementara ambiguitas apakah istilah itu menunjuk wilayah Yudea secara khusus atau tanah Yahudi secara lebih luas tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Terus mendesak” menangkap aspek berkelanjutan serta tekanan tuduhan; “rakyat” lebih luas daripada “orang banyak”; susunan geografis dibuat alami tanpa menghilangkan gerak dari Galilea menuju lokasi persidangan.
