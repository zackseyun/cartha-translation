  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: id
  text: Lalu Pilatus memutuskan bahwa tuntutan mereka harus dikabulkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “Pilatus menjatuhkan putusan agar permintaan mereka dilaksanakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Penghubung naratif yang wajar dalam bahasa Indonesia; menyambungkan putusan Pilatus dengan desakan orang banyak pada ayat sebelumnya tanpa memberi hubungan sebab-akibat yang terlalu tegas.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἐπέκρινεν
  choice: memutuskan
  rationale: Dalam konteks ini verba tersebut menunjuk pada pengambilan keputusan yang bersifat yudisial. 'Memutuskan' alami dalam bahasa Indonesia modern, sedangkan nuansa formalnya dijelaskan dalam catatan kaki.
- source_word: γενέσθαι
  choice: harus dikabulkan
  rationale: Infinitif ini menyatakan bahwa hal yang diminta mereka ditetapkan untuk terlaksana. Dalam konteks keputusan atas suatu tuntutan, 'harus dikabulkan' menyampaikan maksud itu secara idiomatis tanpa merinci cara pelaksanaannya.
- source_word: τὸ αἴτημα
  choice: tuntutan
  rationale: Kata ini dapat berarti permintaan, permohonan, atau tuntutan. Konteks desakan keras orang banyak mendukung 'tuntutan', tetapi alternatif yang lebih netral tetap dipertahankan dalam catatan kaki.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina genitif jamak ini merujuk pada pihak-pihak yang mendesak Pilatus agar memenuhi permintaan mereka.
theological_decisions:
- issue: Nuansa yudisial dalam tindakan Pilatus
  choice: Pilatus memutuskan bahwa tuntutan mereka harus dikabulkan
  alternative: Pilatus menjatuhkan putusan agar permintaan mereka dilaksanakan
  rationale: Terjemahan utama mempertahankan tindakan Pilatus sebagai keputusan resmi sambil tetap alami bagi pembaca modern. Alternatif formal dicatat tanpa menambahkan klaim teologis atau historis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Lalu' menjaga alur narasi; 'tuntutan' mencerminkan tekanan konteks, sementara catatan kaki mempertahankan padanan yang lebih netral dan formal.
