  text: Πιλᾶτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: id
  text: Lalu Pilatus memanggil para imam kepala, para pemimpin, dan rakyat untuk berkumpul,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Menggunakan bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Menandai peralihan ringan dan kelanjutan alur cerita tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: συγκαλεσάμενος
  choice: memanggil ... untuk berkumpul
  rationale: Mengungkapkan tindakan memanggil sejumlah pihak agar berkumpul; susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan yang mendahului perkataan Pilatus pada ayat berikutnya.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Menunjuk para pemuka kalangan imam, bukan beberapa orang yang masing-masing sedang menjabat sebagai imam besar.
- source_word: ἄρχοντας
  choice: para pemimpin
  rationale: Menunjuk orang-orang yang memiliki kedudukan kepemimpinan atau pemerintahan; 'pemimpin' lebih alami dalam bahasa Indonesia modern daripada 'penguasa' dalam daftar ini.
- source_word: λαὸν
  choice: rakyat
  rationale: Mempertahankan arti kolektif λαός tanpa mempersempitnya menjadi sekadar kerumunan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Koma penutup dipertahankan karena kalimat berlanjut ke ayat berikutnya.
