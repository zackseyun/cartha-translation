  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: id
  text: Ia wajib melepaskan seorang tahanan bagi mereka pada hari raya itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seluruh ayat ini tidak terdapat dalam beberapa naskah Yunani tertua, termasuk Papirus 75 dari abad ke-3 dan Kodeks Vaticanus dari abad ke-4, serta dalam terjemahan-terjemahan Koptik awal. Ayat ini terdapat dalam naskah-naskah awal penting lainnya, seperti Kodeks Sinaiticus dari abad ke-4, juga dalam tradisi Latin dan mayoritas naskah Bizantin yang lebih kemudian. Kemungkinan ayat ini ditambahkan oleh para penyalin untuk menyelaraskan kisah Lukas dengan kebiasaan pembebasan tahanan yang disebutkan dalam Matius 27:15 dan Markus 15:6. Beberapa naskah menempatkan kalimat ini sesudah ayat 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: ia wajib
  rationale: Ungkapan idiomatis ini berarti bahwa ia berada di bawah keharusan atau kewajiban. 'Wajib' menyampaikan tekanan adat atau kewajiban tersebut secara alami dalam bahasa Indonesia.
- source_word: ἀπολύειν
  choice: melepaskan seorang tahanan
  rationale: Dalam konteks hukum dan penahanan, kata kerja ini berarti membebaskan atau melepaskan seseorang dari tahanan. Kata 'tahanan' ditambahkan secara kontekstual agar maksud hukumnya jelas, tanpa menyiratkan pengampunan.
- source_word: αὐτοῖς
  choice: bagi mereka
  rationale: Menyatakan bahwa pelepasan itu dilakukan untuk kepentingan atau atas permintaan orang banyak; bentuk ini lebih alami daripada 'kepada mereka' dalam konteks pembebasan tahanan.
- source_word: κατὰ ἑορτήν
  choice: pada setiap perayaan
  rationale: Konstruksi κατά dengan bentuk tunggal tanpa kata sandang menyatakan kebiasaan yang berlaku pada tiap perayaan. 'Perayaan' adalah padanan modern dan luas untuk perayaan keagamaan.
- source_word: ἕνα
  choice: seorang
  rationale: Bentuk maskulin tunggal ini menunjuk kepada satu orang; konteks menunjukkan bahwa orang itu adalah tahanan.
- source_word: δέ
  choice: Namun
  rationale: Partikel δέ memberi hubungan lanjutan yang bernuansa kontras dengan konteks. 'Namun' mempertahankan fungsi wacananya tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
theological_decisions:
- issue: Status Pilatus di bawah keharusan pelepasan
  choice: ia wajib
  alternative: ia harus
  rationale: '''Wajib'' mempertahankan gagasan kewajiban yang melekat pada ἀνάγκην εἶχεν, tetapi tidak menentukan apakah kewajiban itu bersumber dari hukum resmi, adat, atau tekanan keadaan.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Terjemahan mempertahankan hubungan wacana δέ dengan 'Namun' dan mengungkapkan idiom kewajiban secara ringkas. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan tersebut menyangkut keseluruhan ayat.
