  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: id
  text: Saat itu sudah kira-kira jam keenam[a], dan terjadi kegelapan di seluruh negeri[b] sampai jam kesembilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jam keenam kira-kira tengah hari, dan jam kesembilan kira-kira pukul tiga sore.
    reason: cultural_note
  - marker: b
    text: Atau “seluruh bumi.” Kata Yunani γῆ dapat berarti “negeri” atau “bumi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: sudah
  rationale: Menandai bahwa tahap waktu tersebut telah tiba dalam alur cerita; 'sudah' merupakan padanan alami dalam bahasa Indonesia.
- source_word: ὡσεὶ
  choice: kira-kira
  rationale: Mempertahankan sifat perkiraan waktu, bukan ketepatan jam secara mutlak.
- source_word: ὥρα ἕκτη
  choice: jam keenam
  rationale: Mempertahankan cara penghitungan waktu dalam teks sumber; padanan waktu modern dijelaskan dalam catatan kaki.
- source_word: σκότος
  choice: kegelapan
  rationale: Padanan baku dan lugas bagi keadaan gelap dalam konteks ini.
- source_word: ἐγένετο
  choice: meliputi
  rationale: Dalam konstruksi Indonesia, 'kegelapan meliputi' menyampaikan terjadinya dan meluasnya kegelapan secara alami tanpa menambahkan sebab.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: meliputi seluruh negeri
  rationale: γῆ dapat berarti wilayah daratan/negeri atau bumi. 'Negeri' mempertahankan kemungkinan cakupan regional tanpa menutup kemungkinan yang lebih luas, yang dicantumkan dalam catatan kaki.
- source_word: ἕως ὥρας ἐνάτης
  choice: sampai jam kesembilan
  rationale: Mempertahankan ungkapan waktu sumber secara konsisten dengan 'jam keenam'; padanan jam modern diberikan dalam catatan kaki.
theological_decisions:
- issue: Cakupan γῆ dalam pernyataan tentang kegelapan
  choice: negeri
  alternative: bumi
  rationale: Kata Yunani γῆ memungkinkan arti regional maupun universal. Teks utama memakai 'negeri' agar tidak memastikan cakupan global, sedangkan 'bumi' dicatat sebagai kemungkinan leksikal yang sah.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Ungkapan jam kuno dipertahankan dalam teks utama demi kedekatan dengan bentuk sumber, dengan penjelasan waktu modern dalam catatan kaki. Penanda catatan ditempatkan langsung sesudah unsur yang dijelaskan.
