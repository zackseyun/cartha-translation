  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: id
  text: Herodes juga tidak mendapati-Nya bersalah, sebab ia mengirimkan-Nya kembali kepada kami. Lihatlah, Ia tidak melakukan apa pun yang layak dijatuhi hukuman mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak ada apa pun yang layak dijatuhi hukuman mati telah dilakukan oleh-Nya.”'
    reason: Mempertahankan alternatif yang lebih dekat dengan konstruksi pasif Yunani, sementara teks utama memakai bentuk aktif yang lebih alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Herodes juga tidak mendapatinya bersalah
  rationale: Ungkapan ini melanjutkan pernyataan Pilatus pada ayat sebelumnya bahwa baik dirinya maupun Herodes tidak mendapati dasar dakwaan. Unsur elipsis dilengkapi secara wajar dalam bahasa Indonesia dari konteks pengadilan.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: sebab ia mengirimkan-Nya kembali kepada kami
  rationale: ἀναπέμπω dalam alur narasi berarti mengirim kembali; γάρ memberi alasan bagi kesimpulan Pilatus, sedangkan πρὸς ἡμᾶς berarti kepada kami.
- source_word: καὶ ἰδοὺ
  choice: Lihatlah
  rationale: ἰδού menarik perhatian pendengar kepada kesimpulan Pilatus. 'Lihatlah' mempertahankan daya retorisnya dalam ragam Indonesia yang bermartabat dan tetap mudah dipahami.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: apa pun yang pantas dihukum mati
  rationale: Frasa ini menyatakan bahwa tidak ada tindakan yang layak dikenai hukuman mati, sesuai konteks hukum.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: Ia tidak melakukan
  rationale: Konstruksi perfektum perifrastik menyatakan tindakan yang telah dilakukan dan masih relevan bagi putusan sekarang. Dativa αὐτῷ dipahami sebagai pelaku; bentuk aktif menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah makna.
theological_decisions:
- issue: Makna αὐτῷ dalam ἐστὶν πεπραγμένον αὐτῷ
  choice: 'pelaku: ''Ia tidak melakukan'''
  alternative: 'acuan/relasi: ''tidak ditemukan pada-Nya'' atau ''telah dilakukan terhadap-Nya'''
  rationale: Dalam konteks ini Pilatus menyatakan bahwa Yesus tidak melakukan tindak pidana yang layak dihukum mati. Penafsiran sebagai pelaku paling langsung menyampaikan putusan ketidakbersalahan itu, sedangkan 'dilakukan terhadap-Nya' bertentangan dengan arah argumen.
- issue: Elipsis sesudah 'Herodes juga tidak'
  choice: dilengkapi menjadi 'tidak mendapatinya bersalah'
  alternative: dipertahankan secara harfiah sebagai 'Herodes juga tidak'
  rationale: Bahasa Yunani mengandalkan isi ayat sebelumnya, yakni tidak menemukan kesalahan. Pelengkapan ini diperlukan agar kalimat Indonesia utuh dan tidak menambahkan kesimpulan yang melampaui konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Nama Ἡρῴδης ditulis 'Herodes' sesuai konvensi Alkitab bahasa Indonesia. Pronomina yang merujuk kepada Yesus menggunakan huruf kapital mengikuti kebiasaan penerbitan Alkitab Indonesia, tanpa menambahkan gelar yang tidak terdapat dalam teks.
