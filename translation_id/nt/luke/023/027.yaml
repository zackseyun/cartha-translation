  verdict: approve
  source_fidelity: Teks Indonesia dengan setia menyampaikan kerumunan besar yang mengikuti Yesus serta secara tepat membatasi tindakan memukul dada dan meratap kepada para perempuan. Ungkapan "orang banyak" lazim mencakup gagasan πολὺ πλῆθος, dan "termasuk para perempuan" menyampaikan hubungan mereka dengan kerumunan tanpa memaksakan susunan genitif Yunani secara kaku. "Memukul-mukul dada" secara tepat mengungkapkan tindakan berkabung ἐκόπτοντο, sedangkan "meratapi Dia" menyampaikan ἐθρήνουν αὐτόν dengan alami.
  naturalness: Kalimat ini alami, jelas, dan bermartabat dalam bahasa Indonesia modern. Pengulangan pada "memukul-mukul" dengan baik memberi nuansa tindakan yang sedang/berulang dalam konteks naratif, tanpa memerlukan penanda progresif yang tidak alami.
  terminology: '"Yesus," "para perempuan," dan "meratapi Dia" sesuai dengan register Alkitab Indonesia yang modern dan hormat. Kapitalisasi "Dia" konsisten dengan register tersebut dan tidak menambahkan penafsiran teologis. Tidak diperlukan catatan kaki.'
