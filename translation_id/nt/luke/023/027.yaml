  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: id
  text: Orang banyak mengikuti Yesus, termasuk para perempuan yang memukul-mukul dada dan meratapi Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam alur cerita; bentuk Indonesia ini alami dan tidak perlu diberi penanda progresif secara eksplisit.
- source_word: δὲ
  choice: kelanjutan narasi tanpa padanan tersendiri
  rationale: Kata penghubung ini meneruskan narasi, tetapi tidak harus diterjemahkan secara eksplisit dalam bahasa Indonesia.
- source_word: αὐτῷ
  choice: Yesus
  rationale: Pronomina ini menunjuk kepada Yesus; penyebutan nama memperjelas rujukan dalam ayat yang berdiri sendiri tanpa mengubah makna.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: orang banyak
  rationale: Ungkapan ini secara alami merujuk kepada kerumunan besar; 'orang banyak' merupakan ungkapan Indonesia yang jelas dan lazim, sedangkan gagasan besarnya kerumunan sudah melekat dalam idiom tersebut.
- source_word: καὶ γυναικῶν
  choice: termasuk para perempuan
  rationale: Dalam susunan ini, para perempuan dipahami sebagai bagian yang disoroti dari orang banyak, dan terjemahan ini menyiapkan rujukan khusus kepada mereka dalam klausa berikutnya.
- source_word: αἳ
  choice: yang
  rationale: Pronomina relatif feminin jamak secara khusus merujuk kepada para perempuan; struktur Indonesia mempertahankan rujukan tersebut.
- source_word: ἐκόπτοντο
  choice: memukul-mukul dada
  rationale: Dalam konteks perkabungan, verba ini menggambarkan tindakan memukul diri, khususnya dada, sebagai tanda dukacita; bentuk ulang menyampaikan tindakan yang terus dilakukan.
- source_word: ἐθρήνουν
  choice: meratapi
  rationale: Verba ini menyatakan ratapan atau perkabungan yang diungkapkan; 'meratapi' alami dalam bahasa Indonesia dan dapat mengambil objek langsung.
- source_word: αὐτόν
  choice: Dia
  rationale: Objek ratapan adalah Yesus; 'meratapi Dia' menyampaikan hubungan gramatikal dan makna secara idiomatis.
theological_decisions: []
