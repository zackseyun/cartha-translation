id: LUK.23.2
reference: Luke 23:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: id
  text: Lalu mereka mulai menuduh Dia[a] dengan berkata, “Kami mendapati orang ini menyesatkan bangsa kami dan melarang kami membayar pajak kepada Kaisar[b]. Ia juga mengatakan bahwa dirinya sendiri adalah Mesias, seorang raja.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendakwa Dia.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani φόρους menunjuk pada pajak atau upeti yang dibayarkan kepada penguasa Romawi.
    reason: cultural_note
  - marker: c
    text: Atau “mengaku bahwa dirinya sendiri adalah Kristus, seorang raja.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Lalu mereka mulai menuduh Dia
  rationale: Mempertahankan aspek ingresif ἤρξαντο dan makna forensik κατηγορεῖν; δέ secara alami diterjemahkan “lalu” dalam kesinambungan narasi.
- source_word: Τοῦτον εὕραμεν
  choice: Kami mendapati orang ini
  rationale: “Mendapati” sesuai dengan rumusan tuduhan, sedangkan “orang ini” mempertahankan daya deiktik Τοῦτον.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: menyesatkan bangsa kami
  rationale: “Menyesatkan” mempertahankan gagasan membelokkan atau membawa ke arah yang salah tanpa mempersempitnya hanya menjadi subversi politik; “bangsa” cocok dengan konteks publik-politis ἔθνος.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: melarang kami membayar pajak kepada Kaisar
  rationale: “Melarang” menyampaikan daya κωλύω dalam tuduhan ini. Subjek tersirat dari διδόναι dibuat eksplisit sebagai “kami” agar alami dalam bahasa Indonesia; φόρους adalah pajak atau upeti kepada penguasa Romawi.
- source_word: λέγοντα αὑτὸν χριστὸν βασιλέα εἶναι
  choice: Ia juga mengatakan bahwa dirinya sendiri adalah Mesias, seorang raja
  rationale: “Dirinya sendiri” mempertahankan penekanan αὑτόν; “Mesias” mempertahankan fungsi Χριστός sebagai gelar kerajaan Yahudi, dan “seorang raja” menjaga βασιλέα sebagai unsur predikatif tersendiri.
theological_decisions:
- issue: Terjemahan χριστόν dalam tuduhan bermuatan politik
  choice: Mesias
  alternative: Kristus
  rationale: Di sini Χριστός berfungsi sebagai gelar bagi tokoh yang diurapi dan dikaitkan dengan kerajaan, bukan terutama sebagai nama diri. “Mesias” mempertahankan latar Yahudi dan daya politis tuduhan itu.
- issue: Hubungan χριστόν dan βασιλέα
  choice: Mesias, seorang raja
  alternative: Mesias Raja; Kristus, Raja
  rationale: Bahasa Yunani menyajikan kedua unsur sebagai komplemen dalam ujaran tak langsung. Bentuk ini tidak meleburkannya menjadi satu gelar baku dan tetap mempertahankan ketegangan sintaksis serta teologisnya.
- issue: Status tuduhan para pemimpin
  choice: Dirumuskan sebagai perkataan para penuduh, bukan sebagai penegasan narator
  alternative: Mengubahnya menjadi pernyataan faktual langsung
  rationale: Pengantar “mereka mulai menuduh” dan “katanya” mempertahankan bahwa isi berikut merupakan dakwaan mereka; terjemahan tidak mengesahkan kebenaran setiap butir tuduhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register naratif yang bermartabat dan mudah dipahami. “Dia” dikapitalisasi sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia, tanpa menambahkan unsur yang tidak terdapat dalam sumber. Semua penanda catatan kaki muncul dalam teks utama.
