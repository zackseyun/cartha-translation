  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: id
  text: Lalu seluruh kumpulan mereka bangkit dan membawa Yesus kepada Pilatus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Kemudian
  rationale: Kata penghubung ini melanjutkan urutan peristiwa. Dalam narasi Indonesia, “Kemudian” lebih alami daripada “Dan” pada awal ayat tanpa menambahkan hubungan sebab-akibat.
- source_word: ἀναστὰν
  choice: bangkit
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. “Bangkit” mempertahankan urutan tindakan secara ringkas dan bermartabat.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: mereka semua
  rationale: Ungkapan ini merujuk pada keseluruhan kelompok yang hadir. “Mereka semua” menyampaikan cakupan menyeluruh secara alami dalam bahasa Indonesia, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki agar nuansa kolektif πλῆθος tetap terlihat.
- source_word: ἤγαγον
  choice: membawa
  rationale: Dalam konteks mengantar seorang tahanan kepada penguasa, “membawa” merupakan padanan Indonesia yang alami bagi ἄγω dan tidak mengharuskan gambaran bahwa Yesus berjalan paling depan.
- source_word: αὐτὸν
  choice: Yesus
  rationale: Nama “Yesus” dipakai untuk memperjelas acuan pronomina lintas batas perikop; ini tidak mengubah identitas rujukannya.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: kepada Pilatus
  rationale: ἐπί dengan akusatif setelah verba gerak menyatakan arah menuju seseorang. “Kepada Pilatus” mempertahankan makna gerak tanpa menambahkan gagasan eksplisit “menghadap” yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Penyajian subjek kolektif dalam konteks pengadilan
  choice: mereka semua
  alternative: seluruh kumpulan mereka; seluruh sidang mereka
  rationale: “Mereka semua” mempertahankan cakupan total ἅπαν dan rujukan αὐτῶν tanpa menetapkan bahwa πλῆθος adalah lembaga resmi tertentu. Pilihan ini menghindari penafsiran berlebihan atas status formal kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan catatan kaki untuk mempertahankan nuansa leksikal yang tidak sepenuhnya tampak dalam teks utama.
