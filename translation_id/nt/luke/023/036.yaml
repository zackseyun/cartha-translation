lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: mengolok-olok
  rationale: Kata kerja ini menyatakan ejekan atau penghinaan yang bermusuhan. “Mengolok-olok” alami dalam bahasa Indonesia modern dan tetap memperlihatkan sikap merendahkan.
- source_word: δὲ … καὶ
  choice: juga
  rationale: Gabungan ini melanjutkan kisah sekaligus menunjukkan bahwa para prajurit turut mengejek Yesus bersama pihak-pihak yang telah disebut sebelumnya.
- source_word: οἱ στρατιῶται
  choice: para prajurit
  rationale: Padanan langsung dan wajar bagi prajurit-prajurit yang terlibat dalam pelaksanaan hukuman Romawi.
- source_word: προσερχόμενοι
  choice: mereka mendekat
  rationale: Partisip ini menggambarkan gerakan para prajurit ke arah Yesus. Diubah menjadi klausa tersendiri agar alami dan mudah dipahami tanpa menghilangkan urutan tindakan.
- source_word: ὄξος
  choice: anggur asam
  rationale: ὄξος menunjuk pada minuman anggur yang asam dan murah, bukan terutama cuka sebagai bumbu dalam pemahaman pembaca modern.
- source_word: προσφέροντες
  choice: menawarkan
  rationale: Kata ini menyatakan tindakan menyodorkan atau menawarkan minuman kepada Yesus; pilihan ini juga tidak menentukan motif mereka lebih jauh daripada yang dinyatakan teks.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Bentuk datif ini merujuk kepada Yesus sebagai penerima tindakan tersebut; “kepada-Nya” merupakan bentuk Indonesia yang jelas dan alami.
theological_decisions:
- issue: Sifat tindakan para prajurit ketika menawarkan ὄξος
  choice: Tindakan itu diterjemahkan secara netral di dalam adegan pengolokan, tanpa menetapkan motif yang lebih khusus.
  alternative: Menafsirkannya secara eksplisit sebagai tindakan belas kasihan atau semata-mata sebagai siksaan tambahan.
  rationale: Konteks langsung menempatkan tindakan para prajurit dalam adegan ejekan, tetapi ayat ini tidak menjelaskan lebih lanjut maksud mereka saat menawarkan minuman itu. Terjemahan membiarkan konteks memberikan nadanya dan tidak menambahkan penilaian psikologis atau teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Dua partisip Yunani diungkapkan sebagai klausa kedua agar alurnya alami. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
