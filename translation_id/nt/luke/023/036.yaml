  text: Para prajurit juga mengolok-olok Dia; mereka mendekat sambil menawarkan anggur asam[a] kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “cuka”. Kata Yunani ὄξος menunjuk pada anggur asam, yaitu minuman murah yang umum pada masa itu; secara tradisional kata ini sering diterjemahkan “cuka”.'
