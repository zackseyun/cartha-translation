id: LUK.23.37
reference: Luke 23:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: id
  text: dan berkata, “Jika Engkau adalah Raja orang Yahudi,[a] selamatkanlah diri-Mu sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Raja orang Yudea.” Kata Yunani Ἰουδαίων dapat merujuk kepada orang Yahudi atau orang Yudea, tergantung konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Konjungsi koordinatif yang menghubungkan tindakan berkata ini dengan tindakan pada ayat sebelumnya.
- source_word: λέγοντες
  choice: berkata
  rationale: Partisipel kini aktif yang menerangkan subjek jamak dari ayat sebelumnya. Pilihan ini tidak memasukkan unsur ejekan ke dalam verba karena nuansa itu sudah tampak dari konteks.
- source_word: Εἰ
  choice: Jika
  rationale: Memperkenalkan tantangan bersyarat bernada mengejek tanpa menyiratkan bahwa para penutur mengakui klaim tersebut sebagai fakta.
- source_word: σὺ εἶ
  choice: Engkau adalah
  rationale: Kata ganti eksplisit memberi penekanan. Penggunaan 'Engkau' wajar dalam sapaan langsung yang bermartabat dan tetap menunjukkan tekanan pada lawan bicara.
- source_word: ὁ βασιλεὺς
  choice: Raja
  rationale: Menunjukkan gelar kerajaan tertentu. Dalam konstruksi Indonesia, gelar definitif ini tidak memerlukan kata sandang tersendiri.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam kisah sengsara, frasa ini berfungsi sebagai gelar politis-mesianis yang dipakai dalam tuduhan dan ejekan terhadap Yesus. Alternatif geografis-etnis 'orang Yudea' dipertahankan dalam catatan kaki.
- source_word: σῶσον
  choice: selamatkanlah
  rationale: Imperatif aoris orang kedua tunggal. Pilihan ini alami dalam bahasa Indonesia serta mempertahankan hubungan leksikal dengan pemakaian σῴζω di bagian lain Injil Lukas.
- source_word: σεαυτόν
  choice: diri-Mu sendiri
  rationale: Objek refleksif langsung yang menegaskan bahwa Yesus ditantang untuk menyelamatkan diri-Nya.
theological_decisions:
- issue: Penerjemahan gelar kerajaan βασιλεὺς τῶν Ἰουδαίων
  choice: Raja orang Yahudi
  alternative: Raja orang Yudea
  rationale: Frasa ini merupakan gelar sarat muatan dalam konteks penyaliban, terkait dengan tuduhan terhadap Yesus dan ironi tentang kedudukan-Nya sebagai Raja. 'Orang Yahudi' paling sesuai dengan fungsi gelar tersebut dalam kisah sengsara, sedangkan kemungkinan nuansa regional atau etnis 'orang Yudea' tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada sapaan dan pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Struktur langsung mempertahankan tantangan bersyarat dan ironi konteks tanpa menambahkan kata 'mengejek' ke dalam teks.
