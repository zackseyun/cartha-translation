source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: id
  text: Tetapi yang seorang lagi menjawab dengan menegurnya, “Apakah kamu bahkan tidak takut kepada Allah, karena kamu berada di bawah hukuman yang sama[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghukuman yang sama,” “penghakiman yang sama,” atau “vonis yang sama.” Kata Yunani κρίμα dapat berarti penghakiman, putusan, vonis, atau hukuman; di sini yang ditekankan ialah akibat hukuman yang mereka alami bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Tetapi yang seorang lagi menjawab
  rationale: δέ menandai kontras dengan penjahat sebelumnya, sedangkan ἀποκριθείς memperkenalkan tanggapan langsung. Ungkapan ini mempertahankan hubungan sintaksis Yunani dengan bahasa Indonesia yang wajar.
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: dengan menegurnya
  rationale: Partisipel kini ἐπιτιμῶν menyatakan tindakan yang menyertai ucapannya. 'Menegur' mempertahankan nada keras tanpa menambahkan tafsiran.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Apakah kamu bahkan tidak takut kepada Allah
  rationale: οὐδέ memberi penekanan 'bahkan tidak', dan pronomina σὺ menyoroti lawan bicara. 'Takut kepada Allah' mempertahankan ungkapan moral-keagamaan sumber tanpa melunakkannya menjadi sekadar rasa hormat.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan bagi teguran tersebut; 'karena' menyatakan hubungan kausal secara jelas dan alami.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: kamu berada di bawah hukuman yang sama
  rationale: Dalam konteks penyaliban, κρίμα menunjuk pada keputusan atau vonis yang menghasilkan hukuman bersama. 'Di bawah hukuman yang sama' alami dalam bahasa Indonesia serta tetap cukup luas untuk mencakup nuansa putusan dan penghukuman.
theological_decisions:
- issue: Makna takut kepada Allah dalam teguran
  choice: takut kepada Allah
  alternative: hormat kepada Allah; gentar kepada Allah
  rationale: Terjemahan ini mempertahankan daya ungkapan φοβῇ dan gagasan pertanggungjawaban di hadapan Allah, tanpa mempersempitnya menjadi emosi belaka atau mengembangkannya menjadi rumusan doktrinal.
- issue: Cakupan κρίμα
  choice: hukuman
  alternative: penghukuman; penghakiman; vonis
  rationale: Konteks hukuman mati mendukung arti penal, tetapi istilah Yunani dapat mencakup penghakiman, putusan, atau vonis. Teks utama memakai padanan yang paling mudah dipahami, sedangkan catatan mempertahankan keluasan leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'kamu' dipilih agar mudah dipahami pembaca umum; susunan pertanyaan mempertahankan penekanan retoris pada ketiadaan takut kepada Allah.
