  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: id
  text: Lalu ia berkata, “Yesus, ingatlah aku ketika Engkau datang dalam kerajaan-Mu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah manuskrip berbunyi lebih tegas, “ketika Engkau masuk ke dalam kerajaan-Mu,” sedangkan teks SBLGNT berbunyi “dalam kerajaan-Mu.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung naratif ini secara alami menyambungkan ucapan tersebut dengan peristiwa sebelumnya tanpa menambahkan hubungan sebab-akibat.
- source_word: ἔλεγεν
  choice: ia berkata
  rationale: Bentuk imperfek dapat berarti ‘sedang berkata’, tetapi dalam narasi Yunani bentuk ini lazim diperikan dengan bentuk lampau sederhana yang alami dalam bahasa Indonesia.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk vokatif nama pribadi Ἰησοῦς diterjemahkan dengan bentuk baku bahasa Indonesia.
- source_word: μνήσθητί μου
  choice: ingatlah aku
  rationale: Ungkapan ini merupakan permohonan langsung. Dalam konteks permohonan, ‘mengingat’ dapat menyiratkan tindakan yang menguntungkan orang tersebut, tetapi implikasi itu tidak diperjelas secara berlebihan dalam teks utama.
- source_word: ὅταν ἔλθῃς
  choice: ketika Engkau datang
  rationale: ὅταν dengan bentuk subjungtif menunjuk pada keadaan yang akan datang; ‘ketika’ merupakan padanan yang alami dan mempertahankan harapan masa depan dalam ucapan itu.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: dalam kerajaan-Mu
  rationale: Pilihan ini mempertahankan preposisi ἐν (‘dalam’) dalam teks SBLGNT dan βασιλεία sebagai ‘kerajaan’, tanpa memutuskan apakah tekanannya terutama pada wilayah kerajaan atau pemerintahan rajawi.
theological_decisions:
- issue: Nuansa eskatologis permohonan kepada Yesus
  choice: Permohonan itu mengacu pada kedatangan Yesus kelak dalam kerajaan-Nya, tanpa menentukan waktu atau skema eskatologis lebih lanjut.
  alternative: Permohonan itu dapat dipahami sebagai permintaan untuk diingat ketika Yesus datang dengan kuasa sebagai Raja atau ketika kerajaan itu mencapai kepenuhannya.
  rationale: Ayat ini menghubungkan Yesus dengan kerajaan yang akan datang, tetapi tidak menjelaskan kronologi atau kerangka teologis lengkapnya. Terjemahan mempertahankan ketegangan tersebut.
- issue: Arah atau keadaan dalam frasa ἐν τῇ βασιλείᾳ σου
  choice: dalam kerajaan-Mu
  alternative: masuk ke dalam kerajaan-Mu
  rationale: SBLGNT memakai ἐν, yang secara langsung berarti ‘dalam’, sedangkan sejumlah manuskrip memakai bacaan yang lebih tegas menyatakan arah masuk. Teks utama mengikuti SBLGNT dan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada ‘Engkau’ dan akhiran ‘-Mu’ mengikuti kebiasaan penulisan rujukan kepada Yesus. Susunan kalimat dibuat langsung dan mudah dipahami, sambil mempertahankan ambiguitas frasa Yunani tentang kedatangan dalam kerajaan.
