  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: id
  text: yang telah dimasukkan ke dalam penjara karena suatu pemberontakan yang terjadi di kota itu[a] dan karena pembunuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerusuhan” atau “pemberontakan bersenjata.” Kata Yunani στάσις dapat menunjuk pada kerusuhan, pemberontakan, atau pergolakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: yang
  rationale: Dalam konteks, pronomina relatif ini merujuk khusus kepada Barabas; “yang” merupakan padanan alami dalam bahasa Indonesia.
- source_word: διὰ
  choice: karena
  rationale: Dengan kasus akusatif, kata depan ini menyatakan sebab atau alasan; “karena” mempertahankan hubungan kausal dengan jelas dan berlaku bagi kedua tuduhan.
- source_word: στάσιν τινὰ
  choice: suatu pemberontakan
  rationale: “Pemberontakan” mempertahankan nuansa pergolakan atau perlawanan politis, sedangkan “suatu” menyampaikan ketidakspesifikan τινά.
- source_word: γενομένην ἐν τῇ πόλει
  choice: yang terjadi di kota itu
  rationale: Klausa relatif alami dalam bahasa Indonesia dan tetap tidak menyebut Yerusalem secara eksplisit karena teks Yunani hanya mengatakan “kota itu” dalam konteks.
- source_word: φόνον
  choice: pembunuhan
  rationale: φόνος menunjuk pada pembunuhan sebagai tindak pidana, bukan sekadar tindakan membunuh secara umum.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: telah dijebloskan ke dalam penjara
  rationale: “Dijebloskan” menyampaikan daya verba βάλλω sekaligus tetap alami untuk tindakan memasukkan seseorang ke penjara.
