  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: id
  text: Namun, mereka terus mendesak dengan seruan keras[a], meminta agar Ia disalibkan, dan seruan mereka menang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan suara keras”; kata Yunani yang sama dipakai kembali untuk “seruan” pada akhir ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: terus mendesak
  rationale: Bentuk imperfek menyatakan desakan yang berlangsung terus-menerus; frasa ini alami dalam bahasa Indonesia dan mempertahankan kegigihan yang agresif dalam konteks.
- source_word: φωναῖς μεγάλαις
  choice: dengan suara keras
  rationale: Frasa datif ini menerangkan cara mereka mendesak. Pilihan ini mempertahankan makna dasar φωνή dan tidak mempersempitnya menjadi jenis teriakan tertentu.
- source_word: αἰτούμενοι
  choice: meminta
  rationale: Pilihan ini mempertahankan makna leksikal dasar αἰτέω; kerasnya tuntutan sudah tampak dari 'terus mendesak' dan 'suara keras'.
- source_word: αὐτὸν σταυρωθῆναι
  choice: agar Dia disalibkan
  rationale: Klausa ini alami dalam bahasa Indonesia serta mempertahankan bentuk pasif infinitif σταυρωθῆναι.
- source_word: κατίσχυον
  choice: semakin kuat
  rationale: Bentuk imperfek menggambarkan suara mereka sedang memperoleh keunggulan. 'Semakin kuat' mengungkapkan proses tersebut tanpa menyisipkan objek yang tidak dinyatakan.
- source_word: αἱ φωναὶ αὐτῶν
  choice: suara mereka
  rationale: Pengulangan 'suara' mempertahankan pengulangan φωνή dalam kedua klausa dan menonjolkan bahwa desakan vokal merekalah yang kian menguasai keadaan.
