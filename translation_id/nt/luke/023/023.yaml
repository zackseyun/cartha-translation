- from: Namun, mereka terus mendesak dengan suara keras[a], meminta agar Dia disalibkan, dan suara mereka semakin kuat.
  to: Namun, mereka terus mendesak dengan seruan keras[a], meminta agar Ia disalibkan, dan seruan mereka menang.
  rationale: Revisi mengganti “suara mereka semakin kuat” dengan “seruan mereka menang” untuk menerjemahkan κατίσχυον sebagai keberhasilan atau keunggulan seruan mereka. “Seruan” juga dipakai pada kedua kemunculan φωνή, sehingga pengulangan leksikal sumber tetap terlihat dalam bahasa Indonesia yang alami.
