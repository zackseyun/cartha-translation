id: LUK.23.11
reference: Luke 23:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: id
  text: Herodes pun, bersama para prajuritnya, memperlakukan Dia dengan hina dan mengolok-olok-Nya. Sesudah mengenakan pakaian indah[a] pada-Nya, Herodes mengirim Dia kembali kepada Pilatus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah yang gemerlap”; kata yang diterjemahkan “indah” juga dapat berarti “cerah”. Pakaian ini tampaknya menjadi bagian dari olok-olok Herodes dengan memberi Yesus penampilan seolah-olah dihormati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: memperlakukan Dia dengan hina
  rationale: Ungkapan ini menyampaikan tindakan menganggap seseorang tidak berarti dan memperlakukannya dengan penghinaan, bukan sekadar sikap batin.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: bersama para prajuritnya
  rationale: Dalam konteks narasi ini, στράτευμα paling jelas dan alami merujuk kepada para prajurit yang menyertai Herodes.
- source_word: ἐμπαίξας
  choice: mengolok-olok-Nya
  rationale: Pilihan ini secara alami menyatakan ejekan yang merendahkan dan sesuai dengan ragam bahasa kisah sengsara.
- source_word: περιβαλὼν
  choice: mengenakan ... kepada-Nya
  rationale: Partisip ini berarti menaruh atau mengenakan pakaian pada seseorang; susunan ini alami dalam bahasa Indonesia.
- source_word: ἐσθῆτα λαμπρὰν
  choice: pakaian indah
  rationale: ἐσθής menyatakan pakaian atau busana, sedangkan λαμπρός dapat berarti indah, gemerlap, atau cerah. Pilihan ini tidak mempersempitnya menjadi jenis jubah tertentu dan tetap memungkinkan nuansa kehormatan semu dalam ejekan tersebut.
- source_word: ἀνέπεμψεν
  choice: mengirim Dia kembali
  rationale: Dalam konteks proses pengadilan, kata ini menyatakan pengiriman kembali kepada penguasa sebelumnya.
- source_word: τῷ Πιλάτῳ
  choice: kepada Pilatus
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia dan tepat bagi penerima tindakan mengirim.
- source_word: δὲ ... καὶ ὁ Ἡρῴδης
  choice: Herodes pun
  rationale: Partikel “pun” mencerminkan unsur tambahan καί secara alami, sementara hubungan δέ dengan konteks dipertahankan tanpa membuat kalimat kaku.
theological_decisions:
- issue: Makna pakaian dalam ejekan Herodes
  choice: Memakai ungkapan umum “pakaian indah” yang mempertahankan kemungkinan adanya kehormatan semu dan ironi.
  alternative: Menafsirkannya secara khusus sebagai jubah kerajaan atau sebagai lambang kegilaan.
  rationale: Teks menyebut pakaian yang λαμπρά dan menempatkannya dalam konteks penghinaan serta olok-olok, tetapi tidak menjelaskan jenis pakaian atau simbolismenya secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan nama “Herodes” pada klausa terakhir menghindari ketidakjelasan pelaku setelah penyebutan para prajurit. Penanda catatan kaki ditempatkan langsung setelah frasa pakaian yang dijelaskannya.
