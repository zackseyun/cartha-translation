base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: id
  text: Kemudian mereka akan mulai berkata kepada gunung-gunung[a], “Runtuhlah menimpa kami!” dan kepada bukit-bukit[b], “Tutupilah kami!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini menggemakan bahasa penghakiman dalam nubuat, khususnya Hosea 10:8.
    reason: cross_reference
  - marker: b
    text: Atau “Sembunyikanlah kami.” Kata ini secara harfiah berarti “menutupi”, tetapi dalam konteks ini juga mengandung makna menyembunyikan dari penghakiman yang akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Menandai urutan waktu dari konteks sebelumnya dan tetap alami dalam bahasa Indonesia; ungkapan ini juga mempertahankan arah pandang ke peristiwa yang akan datang.
- source_word: ἄρξονται λέγειν
  choice: mereka akan mulai berkata
  rationale: Mempertahankan bentuk futur dan nuansa ingresif ἄρξονται dengan infinitif λέγειν, bukan menyederhanakannya menjadi sekadar 'mereka akan berkata'.
- source_word: τοῖς ὄρεσιν
  choice: kepada gunung-gunung
  rationale: ὄρος dapat berarti gunung atau bukit, tetapi 'gunung-gunung' mempertahankan perbedaannya dengan βουνοῖς yang diterjemahkan 'bukit-bukit'.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Runtuhlah menimpa kami
  rationale: Imperatif aoris Πέσετε menyatakan seruan mendesak kepada gunung-gunung. 'Runtuhlah menimpa kami' menyampaikan gerak jatuh ke atas mereka secara alami dalam bahasa Indonesia.
- source_word: τοῖς βουνοῖς
  choice: kepada bukit-bukit
  rationale: βουνός lazimnya menunjuk bukit; pilihan ini menjaga kontras leksikal dengan ὄρεσιν.
- source_word: Καλύψατε ἡμᾶς
  choice: Tutupilah kami
  rationale: καλύπτω secara langsung berarti menutupi dan dalam konteks juga dapat menyiratkan menyembunyikan. Terjemahan literal mempertahankan gambaran konkret dan ambiguitas kontekstualnya.
theological_decisions:
- issue: Bahasa kenabian tentang penghakiman
  choice: Mempertahankan seruan konkret kepada gunung dan bukit tanpa penjelasan interpretatif dalam teks utama.
  alternative: Mengungkapkannya secara dinamis sebagai permohonan agar disembunyikan dari penghakiman.
  rationale: Ayat ini menggemakan bahasa penghakiman dalam nubuat, khususnya Hosea 10:8. Gambaran literal menjaga ketegangan teologis dan tidak menambahkan objek atau penjelasan yang tidak dinyatakan dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk jamak ulang mempertahankan rujukan kolektif kepada gunung dan bukit, sedangkan imperatif berakhiran -lah menyampaikan seruan langsung tanpa terdengar kasar.
