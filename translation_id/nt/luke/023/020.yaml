lexical_decisions:
- source_word: πάλιν
  choice: lagi
  rationale: Adverbia ini menyatakan pengulangan; “lagi” merupakan padanan yang ringkas dan alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan dengan tuntutan orang banyak dalam konteks sebelumnya.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: προσεφώνησεν
  choice: berseru ... kepada mereka
  rationale: Kata kerja προσφωνέω dapat berarti menyapa atau berseru kepada seseorang. Dalam suasana publik ini, “berseru kepada mereka” menyampaikan unsur vokal sekaligus sasaran ujaran; objek tersirat dijelaskan secara alami.
- source_word: θέλων
  choice: karena ia ingin
  rationale: Partisipel kini menyatakan kehendak atau maksud Pilatus yang menyertai tindakan utama. “Karena ia ingin” menghasilkan hubungan yang alami tanpa mengubah isi kehendaknya.
- source_word: ἀπολῦσαι
  choice: membebaskan
  rationale: Dalam konteks tahanan dan pengadilan, “membebaskan” secara alami menyatakan pelepasan dari tahanan.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia; artikel Yunani tidak perlu diterjemahkan.
