  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: id
  text: Namun, Pilatus kembali berbicara kepada mereka dengan maksud membebaskan Yesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berseru lagi kepada mereka.”
