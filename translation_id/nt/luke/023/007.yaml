id: LUK.23.7
reference: Luke 23:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: id
  text: Ketika Pilatus mengetahui bahwa Yesus berada di bawah yurisdiksi Herodes[a], ia mengirim-Nya kepada Herodes, yang pada waktu itu juga sedang berada di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bawah kewenangan Herodes.” Ungkapan Yunani ini menunjuk pada wilayah pemerintahan atau kewenangan hukum Herodes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Ketika Pilatus mengetahui
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Nama Pilatus diperjelas dari konteks agar rujukan pronomina alami dan tidak rancu dalam bahasa Indonesia.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Yesus berada di bawah yurisdiksi Herodes
  rationale: Ungkapan ini dalam konteks peradilan menunjuk pada lingkup pemerintahan atau kewenangan hukum Herodes. 'Di bawah yurisdiksi' mempertahankan nuansa administratif-legal tersebut.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: ia mengirim-Nya kepada Herodes
  rationale: Verba dapat mengandung nuansa meneruskan seseorang atau perkaranya kepada pejabat lain, tetapi 'mengirim ... kepada' akurat, wajar, dan cukup jelas karena konteks yurisdiksi sudah dinyatakan.
- source_word: ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις
  choice: yang ... juga sedang berada di Yerusalem
  rationale: Frasa partisipial menerangkan Herodes; καὶ αὐτόν menekankan bahwa Herodes juga berada di sana. 'Sedang berada' menyampaikan keadaan pada waktu itu secara alami.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: pada waktu itu
  rationale: Secara harfiah berarti 'pada hari-hari ini', tetapi dalam narasi lampau ungkapan temporal ini lebih alami diterjemahkan 'pada waktu itu' tanpa mengubah acuannya.
theological_decisions:
- issue: Makna politis-legal ἐξουσία dalam hubungan dengan Herodes
  choice: yurisdiksi
  alternative: kewenangan; wilayah kekuasaan
  rationale: Konteksnya adalah pengakuan Pilatus atas kewenangan pemerintahan Herodes terhadap daerah asal Yesus. 'Yurisdiksi' menyampaikan lingkup wewenang hukum-administratif dan tidak memasukkan pengertian teologis yang tidak dimaksudkan di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Pilatus dan Yesus digunakan untuk memperjelas subjek serta objek yang dalam bahasa Yunani dinyatakan dengan pronomina; kapitalisasi '-Nya' mengikuti kebiasaan umum penerbitan Alkitab Indonesia tanpa menambah isi teologis pada ayat.
