  naturalness: 'Versi revisi memakai susunan kalimat Indonesia baku yang lancar: klausa keadaan diawali “ketika”, dan “pun” memberikan sambungan ringan yang sesuai dengan δέ. “Terkoyak di tengahnya” juga lebih idiomatis bagi sebuah tirai.'
  terminology: “Tirai Bait Allah” adalah padanan modern yang baik untuk τὸ καταπέτασμα τοῦ ναοῦ; “tabir Bait Allah” layak dipertahankan sebagai alternatif leksikal. Istilah ini tidak memaksakan penafsiran teologis atau astronomis.
