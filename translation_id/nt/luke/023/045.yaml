  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: id
  text: ketika matahari tidak lagi bercahaya[a], tirai[b] Bait Allah pun terkoyak di tengahnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “matahari menjadi gelap.” Sebagian terjemahan menerjemahkannya secara lebih khusus sebagai “terjadi gerhana matahari,” tetapi kata Yunani yang dipakai tidak mengharuskan penafsiran astronomis itu.
    reason: alternative_reading
  - marker: b
    text: Atau, “tabir Bait Allah.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “terkoyak dari tengah” atau “terbelah menjadi dua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: matahari tidak lagi bercahaya
  rationale: Ungkapan partisipial ini menyatakan bahwa cahaya matahari berhenti atau gagal bersinar tanpa menentukan mekanisme astronomisnya. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan sifat nonteknis ἐκλείπω.
- source_word: ἐσχίσθη
  choice: terbelah
  rationale: Bentuk pasif σχίζω menggambarkan kain yang terkoyak atau terbelah. 'Terbelah' jelas dan alami bersama keterangan 'di tengahnya'.
- source_word: δὲ
  choice: dan
  rationale: δέ merupakan penghubung ringan di sini; 'dan' menghubungkan kedua peristiwa tanpa menambahkan pertentangan yang kuat.
- source_word: τὸ καταπέτασμα
  choice: tirai
  rationale: καταπέτασμα menunjuk pada tirai pemisah di Bait Allah. 'Tirai' adalah istilah modern dan mudah dipahami; 'tabir' dipertahankan sebagai alternatif tradisional dalam catatan kaki.
- source_word: τοῦ ναοῦ
  choice: Bait Allah
  rationale: ναός di sini menunjuk pada bangunan suci atau ruang kudus, bukan seluruh kompleks. 'Bait Allah' merupakan ungkapan Indonesia yang alami dan dikenal luas dalam konteks ini.
- source_word: μέσον
  choice: di tengahnya
  rationale: μέσον menyatakan letak belahan secara langsung. Ungkapan ini tidak secara eksplisit menambahkan hasil 'menjadi dua', walaupun hal itu mungkin tersirat.
theological_decisions:
- issue: Makna ἐκλιπόντος ketika digunakan untuk matahari
  choice: Diterjemahkan secara nonteknis sebagai 'matahari tidak lagi bercahaya'.
  alternative: '''matahari menjadi gelap'' atau ''terjadi gerhana matahari'''
  rationale: Teks menggambarkan terhentinya cahaya matahari, tetapi tidak mengharuskan penjelasan astronomis tertentu. Terjemahan utama mempertahankan ketegangan itu dan tidak menetapkannya sebagai gerhana.
- issue: Terjemahan καταπέτασμα
  choice: Diterjemahkan sebagai 'tirai' dalam teks utama.
  alternative: '''tabir'''
  rationale: '''Tirai'' menyampaikan benda yang dimaksud dengan bahasa modern tanpa mengurangi makna teologis peristiwa tersebut; istilah tradisional dicantumkan sebagai alternatif.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ayat mempertahankan klausa keadaan yang padat, sementara pilihan kata tetap mudah dipahami. Huruf kecil pada awal kutipan mengikuti bentuk fragmen ayat yang diberikan.
