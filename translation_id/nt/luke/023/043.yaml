  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya[a], “Sesungguhnya Aku berkata kepadamu, hari ini engkau akan bersama-Ku di firdaus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, meskipun kurang mungkin: “Sesungguhnya Aku berkata kepadamu hari ini, engkau akan bersama-Ku di firdaus.” Teks Yunani mula-mula tidak memakai tanda baca modern; alternatif ini mengaitkan “hari ini” dengan “Aku berkata kepadamu,” bukan dengan “engkau akan bersama-Ku.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Sesungguhnya
  rationale: Dalam perkataan Yesus, ἀμήν merupakan penegasan khidmat yang mengawali pernyataan berwibawa. “Sesungguhnya” alami dalam ragam Alkitab bahasa Indonesia modern dan mempertahankan daya penegasannya.
- source_word: σοι λέγω
  choice: Aku berkata kepadamu
  rationale: Terjemahan ini dekat dengan susunan Yunani, jelas, dan tetap wajar dalam ragam bahasa yang bermartabat.
- source_word: σήμερον
  choice: hari ini
  rationale: Kata keterangan ini paling wajar menerangkan ἔσῃ (“engkau akan”), sehingga janji tersebut berlaku pada hari itu juga. Karena teks Yunani mula-mula tidak memakai tanda baca modern, kemungkinan pengaitan lain dicantumkan dalam catatan kaki.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Menyampaikan secara langsung kebersamaan pribadi dengan Yesus yang dinyatakan oleh frasa Yunani.
- source_word: ἔσῃ
  choice: engkau akan
  rationale: Bentuk futur dari εἰμί diterjemahkan dengan bentuk masa depan Indonesia yang lugas; kata “berada” tidak perlu karena predikat pelengkapnya sudah jelas.
- source_word: παραδείσῳ
  choice: firdaus
  rationale: “Firdaus” adalah padanan Indonesia yang mapan untuk παράδεισος dalam konteks eskatologis ini, tanpa menambahkan rincian mengenai sifat atau lokasinya.
theological_decisions:
- issue: Hubungan σήμερον (“hari ini”) dalam perkataan yang maknanya bergantung pada tanda baca dan berimplikasi bagi pemahaman tentang keadaan sesudah kematian
  choice: Mengaitkan “hari ini” dengan “engkau akan bersama-Ku di firdaus”
  alternative: Mengaitkan “hari ini” dengan “Aku berkata kepadamu”
  rationale: Naskah Yunani kuno tidak memiliki tanda baca modern, tetapi urutan dan pemakaian bahasa Yunani Koine lebih alami bila σήμερον menerangkan janji “engkau akan bersama-Ku.” Alternatif yang pernah diperdebatkan tetap dicatat agar ketegangan penafsirannya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina “Aku,” “-Ku,” dan “engkau” mempertahankan kelugasan dialog serta pembedaan orang. Nama “Yesus” ditambahkan sebagai subjek eksplisit untuk membuat rujukan pronomina Yunani lebih jelas dan alami dalam ayat yang berdiri sendiri.
