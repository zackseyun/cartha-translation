  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: id
  text: Namun, semua orang yang mengenal Dia[a] dan para perempuan yang mengikuti Dia dari Galilea berdiri dari jauh sambil menyaksikan semua itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua kenalan-Nya.” Kata Yunani γνωστοί dapat berarti orang-orang yang dikenal seseorang, yaitu para kenalan atau rekan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: berdiri
  rationale: Bentuk ini menggambarkan keadaan atau sikap tubuh yang berlangsung dalam adegan tersebut; dalam bahasa Indonesia, 'berdiri' secara alami menyampaikan hal itu tanpa perlu penanda progresif tambahan.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan dari adegan sebelumnya.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: semua orang yang mengenal Dia
  rationale: Menyampaikan γνωστοί secara luas sebagai orang-orang yang mengenal Yesus, tanpa mempersempitnya menjadi sahabat dekat.
- source_word: μακρόθεν
  choice: dari jauh
  rationale: Ungkapan Indonesia yang alami untuk keterangan jarak spasial.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: para perempuan yang telah mengikuti Dia
  rationale: Artikel dan partisipel menunjuk pada kelompok perempuan tertentu yang telah menyertai atau mengikuti Yesus; bentuk 'telah mengikuti' menunjukkan hubungan tindakan itu dengan adegan kini.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: dari Galilea
  rationale: Mempertahankan keterangan asal atau titik awal mereka mengikuti Yesus.
- source_word: ὁρῶσαι ταῦτα
  choice: sambil menyaksikan semua itu
  rationale: '''Menyaksikan'' mengungkapkan pengamatan langsung yang sedang berlangsung, sedangkan ''semua itu'' mempertahankan cakupan jamak ταῦτα secara alami.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Dia' ditulis dengan huruf kapital sebagai rujukan kepada Yesus sesuai kebiasaan penerbitan Alkitab bahasa Indonesia; kapitalisasi ini tidak menambah unsur yang tidak ada dalam tata bahasa Yunani.
