id: LUK.23.39
reference: Luke 23:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: id
  text: Salah seorang penjahat yang tergantung di situ terus menghina Dia dengan berkata, “Bukankah Engkau Mesias? Selamatkanlah diri-Mu dan kami!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Salah seorang
  rationale: δέ menandai perkembangan atau kontras ringan; dalam bahasa Indonesia alur ini cukup alami tanpa konjungsi eksplisit.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: penjahat yang tergantung di situ
  rationale: κακούργων berarti para penjahat atau pelaku kejahatan, sedangkan κρεμασθέντων secara harfiah menunjuk pada keadaan tergantung; frasa ini mempertahankan gambaran sumber tanpa menggantinya dengan verba yang lebih khusus.
- source_word: ἐβλασφήμει
  choice: terus menghina
  rationale: Dalam konteks ini verba tersebut menunjuk pada ucapan yang mencela Yesus. Kata 'terus' menyampaikan aspek imperfek, yaitu tindakan yang sedang atau berulang berlangsung.
- source_word: αὐτόν
  choice: Dia
  rationale: Pronomina objek ini merujuk kepada Yesus; kapitalisasi mengikuti kelaziman bahasa Indonesia untuk pronomina yang merujuk kepada Allah atau Yesus.
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisip ini memperkenalkan isi ucapan dan menyatakan cara penghinaan itu dilakukan.
- source_word: Οὐχὶ σὺ εἶ
  choice: Bukankah Engkau
  rationale: οὐχί memperkenalkan pertanyaan yang mengharapkan jawaban ya, tetapi di sini bernada ejekan atau tantangan.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar; 'Mesias' mempertahankan makna dan latar Yahudinya secara alami.
- source_word: σῶσον
  choice: Selamatkanlah
  rationale: Imperatif ini meminta pembebasan dari kematian yang sedang dihadapi sekaligus mempertahankan kaitan leksikal dengan gagasan keselamatan.
- source_word: σεαυτὸν καὶ ἡμᾶς
  choice: diri-Mu dan kami
  rationale: Terjemahan langsung dan wajar yang mempertahankan ejekan serta kepentingan diri si penjahat.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam ejekan ini Χριστός jelas berfungsi sebagai gelar, bukan sebutan yang menyerupai nama diri. 'Mesias' mempertahankan arti gelar dan konteks pengharapan Yahudi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'terus menghina' mewakili tindakan berkelanjutan dalam bentuk imperfek Yunani. Tidak diperlukan catatan kaki karena alternatif 'Kristus' tidak menimbulkan ambiguitas tekstual yang harus ditampilkan kepada pembaca pada ayat ini.
