  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: id
  text: Lalu Herodes menanyai Yesus dengan panjang lebar[a], tetapi Yesus sama sekali tidak menjawabnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan banyak perkataan” atau “dengan banyak pertanyaan.” Ungkapan Yunani menekankan bahwa Herodes menanyai Yesus secara panjang dan berlarut-larut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: mengajukan ... pertanyaan
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; bersama frasa berikutnya, terjemahan ini menyampaikan bahwa Herodes terus bertanya secara panjang lebar.
- source_word: δὲ
  choice: Lalu / tetapi
  rationale: Partikel pertama diterjemahkan sebagai penghubung naratif yang ringan, sedangkan yang kedua menandai kontras antara pertanyaan Herodes dan kebisuan Yesus.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: banyak pertanyaan
  rationale: Secara harfiah frasa ini berkaitan dengan banyak atau panjangnya ucapan. Dalam konteks ἐπηρώτα, 'banyak pertanyaan' merupakan ungkapan Indonesia yang alami, meskipun sedikit mempersempit λόγοις; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: αὐτὸν / αὐτός
  choice: Yesus
  rationale: Nama yang tersirat dari konteks diulang agar kedua pelaku jelas dalam bahasa Indonesia dan kontrasnya tetap kuat.
- source_word: οὐδὲν
  choice: sama sekali tidak
  rationale: Dalam konstruksi dengan kata kerja 'menjawab', ungkapan ini secara alami menyampaikan bahwa tidak ada jawaban apa pun.
- source_word: ἀπεκρίνατο αὐτῷ
  choice: menjawabnya
  rationale: Terjemahan ringkas dan idiomatis untuk kata kerja menjawab beserta objek tak langsungnya.
