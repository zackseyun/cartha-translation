id: LUK.23.14
reference: Luke 23:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Kalian membawa orang ini kepadaku dengan tuduhan bahwa ia menyesatkan rakyat[a]. Lihatlah, setelah memeriksanya di hadapan kalian, aku tidak menemukan pada orang ini alasan apa pun yang mendukung tuduhan yang kalian ajukan terhadapnya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memalingkan rakyat.” Kata kerja Yunani dapat berarti memalingkan atau menyesatkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku tidak menemukan kesalahan pada orang ini sehubungan dengan hal-hal yang kalian tuduhkan kepadanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Kalian membawa ... kepadaku
  rationale: Bentuk aoris menunjuk pada tindakan yang telah selesai, yaitu membawa Yesus kepada Pilatus; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sapaan langsung.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: orang ini
  rationale: Merujuk kepada seorang laki-laki tertentu dalam konteks ini; 'orang ini' adalah padanan Indonesia yang alami tanpa mengubah nada ucapan Pilatus.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: dengan tuduhan bahwa ia menyesatkan rakyat
  rationale: ὡς memperkenalkan kapasitas atau tuduhan yang menjadi alasan mereka membawanya. 'Menyesatkan' menyampaikan makna kontekstual ἀποστρέφω tanpa memperkuatnya menjadi 'menghasut'.
- source_word: τὸν λαόν
  choice: rakyat
  rationale: λαός di sini menunjuk kepada masyarakat secara kolektif. 'Rakyat' sesuai dengan konteks tuduhan yang bersifat publik dan politis.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian pendengar pada hasil pemeriksaan Pilatus; 'Lihatlah' mempertahankan daya retorisnya dalam bahasa Indonesia modern yang bermartabat.
- source_word: ἐνώπιον ὑμῶν
  choice: di hadapan kalian
  rationale: Menegaskan bahwa pemeriksaan berlangsung secara terbuka dalam kehadiran para penuduh.
- source_word: ἀνακρίνας
  choice: setelah memeriksanya
  rationale: Dalam konteks hukum, ἀνακρίνω berarti memeriksa atau menginterogasi. Hubungan partisip dengan kata kerja utama disampaikan secara alami dengan 'setelah'.
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: aku tidak menemukan dasar apa pun
  rationale: Mengungkapkan temuan negatif secara yudisial dan mempertahankan αἴτιον sebagai dasar suatu tuduhan, bukan sebagai penilaian moral mutlak.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: bagi tuduhan yang kalian ajukan terhadapnya
  rationale: κατηγορέω adalah istilah hukum untuk menuduh; susunan ini mempertahankan nuansa ruang pengadilan dan hubungan langsung dengan tuduhan mereka.
theological_decisions:
- issue: Sifat pernyataan Pilatus
  choice: Diterjemahkan sebagai temuan hukum bahwa tidak ada dasar bagi tuduhan yang diajukan.
  alternative: aku tidak menemukan kesalahan pada orang ini sehubungan dengan hal-hal yang kalian tuduhkan kepadanya
  rationale: Kosakata ayat ini bersifat yudisial (ἀνακρίνω, αἴτιον, κατηγορέω). Terjemahan utama mempertahankan konteks hukum tanpa menjadikan ucapan Pilatus sebagai putusan moral mutlak yang melampaui konteks langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-yudisial yang bermartabat. 'Kalian' dipakai untuk membuat bentuk jamak ὑμῶν jelas; huruf kecil pada 'aku' mengikuti kaidah umum karena penuturnya adalah Pilatus.
