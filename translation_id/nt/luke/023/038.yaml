id: LUK.23.38
reference: Luke 23:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: id
  text: 'Di atas-Nya juga ada tulisan: “Inilah Raja orang Yahudi.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “prasasti,” “papan pemberitahuan,” atau “dakwaan tertulis.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pada-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Yunani secara harfiah berbunyi, “Raja orang Yahudi, orang ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: tulisan
  rationale: Dalam konteks ini menunjuk pada kata-kata tertulis yang dipasang pada atau di atas orang yang disalibkan. “Tulisan” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi dakwaan resmi.
- source_word: ἐπ’ αὐτῷ
  choice: di atas-Nya
  rationale: Dalam konteks penyaliban, frasa ini menyatakan letak tulisan itu relatif terhadap Yesus; “di atas-Nya” jelas dan wajar.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Inilah Raja orang Yahudi
  rationale: Bahasa Yunani tidak memakai kopula dan secara harfiah menempatkan demonstrativa pada akhir frasa. “Inilah” mempertahankan penunjukan yang tegas dalam susunan Indonesia yang alami.
- source_word: Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam gelar tetap pada kisah penyaliban, “Raja orang Yahudi” merupakan padanan tradisional dan sesuai konteks; “orang Yudea” mungkin dalam konteks lain, tetapi kurang tepat di sini.
- source_word: δὲ καὶ
  choice: juga ada
  rationale: Gabungan ini menambahkan rincian pada narasi. “Juga ada” menyampaikan daya aditifnya dengan lancar; daya penghubung δέ tidak perlu dinyatakan tersendiri dalam susunan Indonesia ini.
theological_decisions:
- issue: Sifat tulisan pada penyaliban
  choice: Menyajikan tulisan itu secara langsung sebagai identifikasi “Raja orang Yahudi,” tanpa menjelaskan apakah itu dakwaan, ironi, atau pengakuan mesianik.
  alternative: Menerjemahkannya secara khusus sebagai dakwaan resmi atau memperjelas nada ironis dan politisnya.
  rationale: Ayat ini hanya melaporkan keberadaan dan bunyi tulisan tersebut. Terjemahan sebaiknya tidak memasukkan penafsiran yang tidak dinyatakan oleh teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Huruf kapital pada pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Yesus. Urutan kalimat dibuat alami tanpa menghilangkan unsur tambahan “juga” atau penekanan demonstratif οὗτος.
