  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: id
  text: Pada hari itu juga, Herodes dan Pilatus menjadi sahabat[a], sebab sebelumnya mereka saling bermusuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjalin hubungan baik.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berada dalam permusuhan satu terhadap yang lain.”
    reason: literal_rendering
lexical_decisions:
- source_word: ἐγένοντο
  choice: menjadi
  rationale: Bentuk aoris dari γίνομαι menandai perubahan keadaan hubungan; “menjadi” menyampaikan perubahan itu secara langsung dan alami.
- source_word: φίλοι
  choice: sahabat
  rationale: Nomina predikatif jamak ini menyatakan persahabatan atau persekutuan; “sahabat” mempertahankan bentuk substantival dan tidak melemahkannya menjadi sekadar sikap ramah.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Herodes dan Pilatus
  rationale: Konstruksi korelatif menggabungkan kedua pihak; dalam bahasa Indonesia, “Herodes dan Pilatus” sudah menyatakannya secara wajar tanpa perlu menambahkan “baik ... maupun”.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: Pada hari itu juga
  rationale: Ungkapan “itu juga” mempertahankan penekanan pada tepat hari yang sama dengan gaya Indonesia yang alami.
- source_word: μετ’ ἀλλήλων
  choice: menjadi sahabat
  rationale: Makna timbal balik sudah tersirat secara alami karena Herodes dan Pilatus menjadi sahabat satu sama lain; penambahan “satu sama lain” akan terasa berlebihan dalam bahasa Indonesia.
- source_word: προϋπῆρχον
  choice: sebelumnya
  rationale: Imperfek προϋπάρχω menunjukkan keadaan yang telah berlangsung sebelum perubahan pada hari itu; “sebelumnya” menangkap kontras waktunya dengan ringkas.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: mereka saling bermusuhan
  rationale: Ungkapan ini menyatakan keadaan permusuhan timbal balik. “Saling bermusuhan” merupakan padanan Indonesia modern yang alami serta mempertahankan sifat relasionalnya.
theological_decisions:
- issue: Sifat perubahan hubungan antara Herodes dan Pilatus
  choice: Mereka “menjadi sahabat,” tanpa menjelaskan apakah ini persahabatan pribadi atau persekutuan politis.
  alternative: Mereka “menjadi akrab” atau “menjalin hubungan baik.”
  rationale: φίλοι secara langsung mendukung “sahabat,” tetapi konteks tidak menentukan kedalaman atau motif hubungan tersebut. Terjemahan tidak menambahkan penilaian teologis ataupun motif politis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mendahulukan keterangan waktu agar penekanan ἐν αὐτῇ τῇ ἡμέρᾳ terdengar alami. “Saling bermusuhan” dipilih daripada ungkapan nominal yang kaku, sedangkan catatan kaki mempertahankan bentuk sumber yang lebih harfiah.
