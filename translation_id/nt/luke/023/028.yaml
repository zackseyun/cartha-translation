  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: id
  text: Namun, Yesus berpaling kepada mereka dan berkata, “Putri-putri Yerusalem,[a] janganlah menangisi Aku. Sebaliknya, tangisilah diri kalian sendiri dan anak-anak kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perempuan-perempuan Yerusalem.” Secara harfiah bahasa Yunani berbunyi “Putri-putri Yerusalem,” suatu sapaan bergaya kenabian yang dipertahankan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Namun, Yesus berpaling kepada mereka
  rationale: Partisip aoristus στραφείς menyatakan tindakan Yesus mengarahkan diri kepada para perempuan sebelum berbicara. Bentuk finit “berpaling” alami dalam bahasa Indonesia, sedangkan “Namun” menyampaikan peralihan atau kontras ringan dari δέ.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Putri-putri Yerusalem
  rationale: Sapaan harfiah ini mempertahankan idiom kolektif bernuansa kenabian. Catatan kaki menyediakan padanan komunikatif “perempuan-perempuan Yerusalem” tanpa menghilangkan gaung teks sumber dari teks utama.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: janganlah menangisi Aku
  rationale: Konstruksi κλαίω dengan ἐπί menunjuk kepada objek atau alasan tangisan. “Menangisi Aku” idiomatis dan mempertahankan larangan tanpa memastikan apakah maksudnya larangan umum atau perintah menghentikan tindakan yang sedang berlangsung.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: Sebaliknya, tangisilah dirimu sendiri
  rationale: 'πλήν memperkenalkan koreksi yang berlawanan: bukan menangisi Yesus, melainkan diri mereka. “Sebaliknya” membuat kontras itu jelas, dan “dirimu sendiri” mempertahankan unsur refleksif.'
- source_word: καὶ ἐπὶ τὰ τέκνα ὑμῶν
  choice: dan anak-anakmu
  rationale: τέκνα berarti anak-anak dalam hubungan keluarga. Akhiran orang kedua jamak Yunani diterjemahkan dengan bentuk sapaan kolektif bahasa Indonesia yang wajar.
theological_decisions:
- issue: Sapaan Θυγατέρες Ἰερουσαλήμ
  choice: Putri-putri Yerusalem
  alternative: Perempuan-perempuan Yerusalem
  rationale: Pilihan utama mempertahankan citra kekeluargaan-kolektif serta gaung kenabian ungkapan Yunani, tanpa menambahkan penafsiran doktrinal. Alternatif yang lebih langsung dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menangisi” dipilih daripada “menangis untuk” agar hubungan antara κλαίω dan objek tangisan terdengar alami. Huruf kapital pada “Aku” mengikuti konvensi umum teks Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
