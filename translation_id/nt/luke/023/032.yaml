base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: id
  text: Dua orang lain, keduanya penjahat[a], juga sedang digiring bersama dia untuk dihukum mati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pelaku kejahatan.” Istilah Yunani menunjuk kepada orang yang melakukan kejahatan dan di sini berada di bawah hukuman pidana.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk dieksekusi.” Kata Yunani berarti “dibunuh” dan tidak menyebutkan caranya, meskipun konteks menunjukkan penyaliban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: sedang digiring
  rationale: Bentuk imperfek pasif menggambarkan tindakan yang sedang berlangsung pada waktu lampau; frasa ini mempertahankan nuansa proses tersebut secara alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan. Dalam susunan kalimat Indonesia, kelanjutan narasi sudah tersampaikan tanpa perlu menambahkan kata yang dapat memberi kesan pertentangan.
- source_word: καὶ
  choice: juga
  rationale: Kata ini menyatakan bahwa kedua orang tersebut dibawa sebagai tambahan bersama Yesus.
- source_word: ἕτεροι
  choice: orang lain
  rationale: Ungkapan ini menunjuk kepada orang-orang selain Yesus tanpa menyiratkan bahwa Yesus termasuk golongan penjahat.
- source_word: κακοῦργοι
  choice: penjahat
  rationale: Istilah ini menunjuk kepada orang yang melakukan kejahatan dan, dalam konteks ini, telah dijatuhi hukuman. 'Penjahat' jelas, ringkas, dan lazim dalam bahasa Indonesia modern.
- source_word: δύο
  choice: dua
  rationale: Bilangan ini diterjemahkan secara langsung; frasa 'keduanya penjahat' memperjelas bahwa kedua orang lain itulah yang disebut penjahat.
- source_word: σὺν αὐτῷ
  choice: bersama dia
  rationale: Preposisi σύν menyatakan penyertaan. 'Bersama dia' alami dan tidak menambahkan makna yang tidak terdapat dalam teks.
- source_word: ἀναιρεθῆναι
  choice: untuk dihukum mati
  rationale: Dalam konteks tindakan resmi terhadap terpidana, bentuk pasif ini menyatakan bahwa mereka akan dibunuh melalui pelaksanaan hukuman. Pilihan ini mempertahankan cakupan verba tanpa menyebutkan metode kematian secara eksplisit.
theological_decisions:
- issue: Apakah ἀναιρεθῆναι harus diterjemahkan secara khusus sebagai penyaliban
  choice: untuk dihukum mati
  alternative: untuk disalibkan
  rationale: Konteks selanjutnya menunjukkan penyaliban, tetapi verba pada ayat ini sendiri hanya menyatakan tindakan membuat seseorang mati. Terjemahan tidak mempersempit maknanya melampaui yang dinyatakan teks Yunani.
- issue: Apakah susunan kalimat dapat menyiratkan bahwa Yesus juga seorang penjahat
  choice: keduanya penjahat
  alternative: dua penjahat lain
  rationale: Ungkapan 'dua penjahat lain' dalam bahasa Indonesia dapat disalahpahami seolah-olah Yesus adalah penjahat yang pertama. Susunan yang dipilih menyatakan dengan jelas bahwa hanya kedua orang lain itu yang disebut penjahat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan khidmat. Kata ganti 'dia' ditulis dengan huruf kecil sesuai kaidah umum dan untuk menghindari penambahan penandaan teologis yang tidak ada dalam teks Yunani.
