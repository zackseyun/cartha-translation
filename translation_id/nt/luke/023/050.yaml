id: LUK.23.50
reference: Luke 23:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: id
  text: Dan lihatlah, ada seorang laki-laki bernama Yusuf, yang merupakan anggota Dewan, seorang yang baik dan benar[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “baik dan adil.”
    reason: Alternatif leksikal bagi δίκαιος, yang dapat berarti 'benar' atau 'adil' menurut konteks.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Dan lihatlah
  rationale: Mempertahankan penanda wacana sekaligus seruan yang mengarahkan perhatian pembaca, tanpa menghaluskannya menjadi sekadar penghubung narasi.
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Menunjuk kepada seorang laki-laki dewasa tertentu dan memperkenalkan tokoh baru dalam narasi.
- source_word: ὀνόματι Ἰωσὴφ
  choice: bernama Yusuf
  rationale: Ungkapan Indonesia yang alami untuk bentuk datif ὀνόματι, dengan tetap mempertahankan formula pengenalan tokoh.
- source_word: βουλευτὴς ὑπάρχων
  choice: yang merupakan anggota Dewan
  rationale: βουλευτής berarti anggota suatu dewan pemerintahan. 'Anggota Dewan' jelas bagi pembaca modern dan tidak secara berlebihan memasukkan identifikasi kelembagaan yang tidak dinyatakan dalam frasa ini sendiri.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: seorang yang baik dan benar
  rationale: Pengulangan ἀνήρ tercermin melalui 'seorang', sementara ἀγαθός diterjemahkan 'baik' dan δίκαιος sebagai 'benar' untuk menyatakan kelurusan moral dengan nuansa alkitabiah yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan δίκαιος sebagai gambaran watak Yusuf
  choice: benar
  alternative: adil
  rationale: δίκαιος dapat menunjuk pada kelurusan moral maupun keadilan. Dalam gambaran watak ini, 'benar' mempertahankan cakupan moral dan relasional di hadapan Allah serta sesama, tanpa menjadikannya istilah hukum yang terlalu sempit. Alternatif 'adil' dicatat karena tetap mungkin secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Lihatlah' mempertahankan daya seru ἰδού; 'Dewan' ditulis dengan huruf kapital sebagai sebutan kontekstual bagi badan resmi tersebut. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
