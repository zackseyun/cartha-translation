  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: id
  text: Orang ini pergi menghadap Pilatus dan meminta jenazah Yesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Orang ini
  rationale: Kata penunjuk ini merujuk kembali kepada Yusuf dari Arimatea pada ayat sebelumnya. “Orang ini” mempertahankan daya tunjuknya dan terdengar wajar dalam narasi Indonesia.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: pergi menghadap Pilatus
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului permintaan. “Pergi menghadap” secara alami menyampaikan bahwa Yusuf datang kepada Pilatus sebagai penguasa yang berwenang, tanpa menambahkan nama atau gelar yang tidak terdapat dalam ayat.
- source_word: ᾐτήσατο
  choice: meminta
  rationale: Bentuk medium αἰτέω di sini berarti meminta sesuatu. “Meminta” tepat, ringkas, dan secara alami mengambil objek langsung dalam bahasa Indonesia.
- source_word: τὸ σῶμα
  choice: jenazah
  rationale: σῶμα secara leksikal berarti tubuh atau badan, tetapi dalam konteks sesudah kematian, “jenazah” merupakan ungkapan Indonesia yang alami, hormat, dan tidak sekeras “mayat”.
- source_word: τοῦ Ἰησοῦ
  choice: Yesus
  rationale: Genitif ini menyatakan hubungan kepunyaan atau identitas. Dalam konstruksi Indonesia “jenazah Yesus,” hubungan tersebut sudah tersampaikan secara langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan urutan tindakan Yunani—datang menghadap, lalu meminta—dengan mengubah partisip menjadi verba berurutan yang alami dalam bahasa Indonesia.
