    issue: ‘Bahkan’ untuk δὲ καὶ
    rationale: Kata ini dapat memberi kesan intensifikasi (‘bahkan’) yang tidak secara khusus dituntut oleh teks. ‘Pun’ menyampaikan unsur tambahan καὶ dengan lebih netral.
  - severity: low
    issue: ‘Dia ini’ dalam klausa bersyarat
    rationale: Bentuk ini terasa janggal dalam dialog baku. ‘Orang ini’ lebih alami sambil mempertahankan demonstratif οὗτός dan nada penghinaan konteksnya.
  - severity: low
    issue: ‘Mesias dari Allah’
    rationale: Walaupun dapat diterima, ‘Mesias Allah’ adalah bentuk gelar yang lebih ringkas dan lazim dalam Bahasa Indonesia, serta memadai untuk genitif τοῦ θεοῦ.
