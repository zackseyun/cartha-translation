revisions:
- from: Orang banyak berdiri menyaksikan. Bahkan para pemimpin mengejek Dia dengan berkata, “Orang lain Dia selamatkan; biarlah Dia menyelamatkan diri-Nya sendiri, jika Dia ini Mesias dari Allah, Yang Terpilih.”
  to: Orang banyak berdiri sambil menyaksikan. Para pemimpin pun mengejek-Nya sambil berkata, “Orang lain Ia selamatkan; biarlah Ia menyelamatkan diri-Nya sendiri, jika orang ini adalah Mesias Allah, Yang Terpilih.”
  rationale: Revisi memperbaiki kelancaran Bahasa Indonesia dan kesepadanan unsur penghubung Yunani tanpa mengubah makna. ‘Pun’ menggantikan ‘Bahkan’ untuk menghindari penambahan intensitas; ‘orang ini’ mempertahankan demonstratif dalam ejekan; dan ‘Mesias Allah’ memberikan bentuk gelar yang lebih alami. Tidak diperlukan catatan kaki karena teks sumber yang diberikan tidak memuat varian tekstual atau ambiguitas yang perlu ditandai dalam terjemahan ini.
