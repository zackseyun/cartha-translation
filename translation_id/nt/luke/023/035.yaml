  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: id
  text: Orang banyak berdiri sambil menyaksikan. Para pemimpin pun mengejek-Nya sambil berkata, “Orang lain Ia selamatkan; biarlah Ia menyelamatkan diri-Nya sendiri, jika orang ini adalah Mesias Allah, Yang Terpilih.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: berdiri
  rationale: Bentuk verba ini memberi latar keadaan yang sedang berlangsung; “berdiri” mempertahankan postur orang banyak secara alami dalam bahasa Indonesia.
- source_word: θεωρῶν
  choice: menyaksikan
  rationale: Partisipel ini menggambarkan perhatian visual yang terus berlangsung. “Menyaksikan” alami dalam konteks orang banyak yang melihat peristiwa tersebut.
- source_word: ἐξεμυκτήριζον
  choice: mengejek Dia
  rationale: Verba ini menyatakan ejekan penuh penghinaan. Objek “Dia” disediakan dari konteks agar kalimat Indonesia jelas.
- source_word: ἄρχοντες
  choice: para pemimpin
  rationale: Dalam konteks Lukas, istilah ini menunjuk kepada kalangan pemimpin atau penguasa. “Para pemimpin” jelas dan alami tanpa mempersempit rujukannya secara berlebihan.
- source_word: Ἄλλους ἔσωσεν
  choice: Orang lain Dia selamatkan
  rationale: “Selamatkan” mempertahankan pengulangan verbal dengan σωσάτω dan ironi ejekan itu; susunan ini juga memberi penekanan pada “orang lain” sebagaimana dalam bahasa Yunani.
- source_word: σωσάτω ἑαυτόν
  choice: biarlah Dia menyelamatkan diri-Nya sendiri
  rationale: Ungkapan ini mewakili imperatif orang ketiga dan mempertahankan pengulangan akar kata “selamat” serta tekanan refleksif pada diri-Nya sendiri.
- source_word: εἰ οὗτός ἐστιν
  choice: jika Dia ini
  rationale: “Dia ini” mempertahankan daya demonstratif οὗτός, yang dalam ejekan tersebut dapat bernada merendahkan, sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: Mesias dari Allah
  rationale: Χριστός berfungsi sebagai gelar, sehingga diterjemahkan “Mesias.” Frasa “dari Allah” mempertahankan bentuk relasi genitif tanpa menentukan lebih jauh apakah nuansanya kepunyaan, pengutusan, atau penetapan.
- source_word: ὁ ἐκλεκτός
  choice: Yang Terpilih
  rationale: Frasa ini berfungsi sebagai gelar kristologis. “Yang Terpilih” mempertahankan bobot gelarnya dalam bahasa Indonesia yang mudah dimengerti.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ini Χριστός jelas berfungsi sebagai gelar. “Mesias” mengungkapkan fungsi tersebut tanpa memperlakukannya sebagai nama diri.
- issue: Relasi genitif dalam ὁ χριστὸς τοῦ θεοῦ
  choice: Mesias dari Allah
  alternative: Mesias Allah
  rationale: “Dari Allah” alami dalam bahasa Indonesia dan menjaga keterbukaan relasi genitif tanpa menambahkan tafsiran teologis yang tidak dinyatakan secara eksplisit.
- issue: Daya gelar ὁ ἐκλεκτός
  choice: Yang Terpilih
  alternative: Orang Pilihan
  rationale: “Yang Terpilih” mempertahankan bentuk gelar dan bobot kristologisnya, sekaligus tetap mudah dipahami pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Ejekan para pemimpin dipertahankan tanpa menjelaskan atau melunakkan ironi teologisnya.
