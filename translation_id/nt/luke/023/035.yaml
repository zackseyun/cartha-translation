  verdict: revise
  source_fidelity: 'Draf pada dasarnya setia kepada teks Yunani: postur orang banyak, tindakan mengejek oleh para pemimpin, pengulangan kata kerja ‘menyelamatkan,’ serta gelar Mesianik semuanya dipertahankan. Namun, ‘Bahkan’ untuk δὲ καὶ kurang tepat karena mudah menyiratkan peningkatan atau penegasan yang tidak diperlukan; ‘pun/juga’ lebih langsung mencerminkan καὶ. ‘Dia ini’ juga kurang alami dalam tuturan Indonesia; ‘orang ini’ mempertahankan daya demonstratif yang bernada merendahkan.'
  naturalness: ‘Orang banyak berdiri menyaksikan’ dapat dipahami, tetapi ‘berdiri sambil menyaksikan’ lebih lancar dan memperlihatkan hubungan partisipial θεωρῶν. ‘Para pemimpin pun mengejek-Nya sambil berkata’ merupakan Bahasa Indonesia baku yang alami. ‘Mesias Allah’ lebih idiomatis sebagai gelar daripada ‘Mesias dari Allah.’
  terminology: ‘Mesias’ tepat untuk ὁ χριστός sebagai gelar, dan ‘Yang Terpilih’ mempertahankan fungsi titulernya. ‘Mesias Allah’ menerjemahkan τοῦ θεοῦ secara padat dan alami tanpa menambahkan penafsiran teologis. Kapitalisasi pronomina rujukan kepada Yesus konsisten dengan konvensi penerbitan Alkitab Indonesia.
  issues:
