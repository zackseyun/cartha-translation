- from: Semua orang banyak yang telah berkumpul untuk menyaksikan pemandangan itu[a], setelah melihat apa yang telah terjadi, pulang sambil menepuk-nepuk dada[b].
  to: Semua orang yang telah berkumpul untuk menyaksikan pemandangan itu[a], setelah melihat apa yang telah terjadi, pulang sambil memukul-mukul dada[b].
  rationale: Revisi menghilangkan frasa yang tidak idiomatis, "semua orang banyak," dan mengganti "menepuk-nepuk" dengan "memukul-mukul" agar tindakan fisik dalam bahasa Yunani tersampaikan lebih tepat. Terjemahan tetap mempertahankan ambiguitas mengenai respons batin orang banyak.
