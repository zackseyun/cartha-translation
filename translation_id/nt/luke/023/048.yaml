  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: id
  text: Semua orang yang telah berkumpul untuk menyaksikan pemandangan itu[a], setelah melihat apa yang telah terjadi, pulang sambil memukul-mukul dada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tontonan itu.”
    reason: lexical_alternative
  - marker: b
    text: Tindakan ini merupakan tanda dukacita, ratapan, atau keterkejutan.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: telah berkumpul
  rationale: Menyatakan bahwa orang-orang itu telah datang dan berkumpul di tempat kejadian; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna kolektifnya.
- source_word: ὄχλοι
  choice: semua orang banyak
  rationale: Menjaga nuansa jamak Yunani melalui gambaran seluruh kelompok orang yang hadir, tanpa memakai ungkapan yang kaku.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: untuk menyaksikan pemandangan itu
  rationale: θεωρία menunjuk pada sesuatu yang dilihat sebagai tontonan atau pemandangan umum. Ungkapan ini mempertahankan unsur melihat tanpa memberi kesan hiburan yang dapat timbul dari kata 'tontonan'.
- source_word: θεωρήσαντες
  choice: setelah melihat
  rationale: 'Partisip aoris menunjukkan tindakan yang mendahului tindakan utama: mereka pulang setelah melihat kejadian tersebut.'
- source_word: τὰ γενόμενα
  choice: apa yang telah terjadi
  rationale: Padanan idiomatis dan jelas bagi ungkapan substantival yang berarti segala peristiwa yang baru berlangsung.
- source_word: τύπτοντες τὰ στήθη
  choice: sambil menepuk-nepuk dada
  rationale: Menggambarkan tindakan fisik yang berulang sebagai tanda dukacita, ratapan, atau keterkejutan, tanpa menentukan keadaan batin mereka.
- source_word: ὑπέστρεφον
  choice: pulang
  rationale: Dalam konteks ini berarti kembali dari tempat kejadian. Hubungan dengan tindakan yang sedang menyertai dipertahankan oleh 'sambil', sedangkan bentuk adegannya tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna batin dari tindakan orang banyak
  choice: Teks hanya menggambarkan mereka menepuk-nepuk dada, tanpa menyatakan bahwa mereka bertobat.
  alternative: Menafsirkan tindakan itu secara khusus sebagai pertobatan, rasa bersalah, dukacita, atau keterkejutan.
  rationale: Bahasa Yunani menyebut tindakan lahiriah tetapi tidak secara eksplisit menetapkan keadaan rohani atau emosi tertentu; terjemahan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Pemandangan' dipilih daripada 'tontonan' dalam teks utama agar tidak memberi kesan hiburan, sedangkan alternatif leksikalnya dicatat dalam catatan kaki. Pengulangan pada 'menepuk-nepuk' menyampaikan tindakan yang berlangsung tanpa menafsirkan motivasi batinnya.
