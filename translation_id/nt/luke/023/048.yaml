review_pass:
  verdict: revise
  source_fidelity: 'Makna pokoknya setia: orang-orang yang berkumpul untuk melihat kejadian itu menyaksikan apa yang terjadi lalu pulang dengan suatu gerak ratapan. Namun, "menepuk-nepuk dada" dapat terdengar sebagai tepukan ringan, sedangkan τύπτοντες menunjukkan memukul atau menghantam dada. "Semua orang banyak" juga tidak wajar dalam bahasa Indonesia modern.'
  naturalness: '"Semua orang banyak" merupakan gabungan yang janggal dan redundan. "Semua orang yang telah berkumpul" alami serta menyampaikan cakupan kolektif dari πάντες ... ὄχλοι. Susunan lainnya dapat dipertahankan dengan sedikit perapian.'
  terminology: '"Pemandangan itu" merupakan padanan yang aman untuk θεωρία dan tidak memaksakan makna hiburan; alternatif "tontonan itu" layak dicatat. "Memukul-mukul dada" lebih tepat bagi gestur τύπτοντες τὰ στήθη dan tetap tidak menafsirkan keadaan batin orang banyak.'
