    rationale: Frasa tersebut redundan dan mengganggu kelancaran. Bentuk "Semua orang yang telah berkumpul" menyampaikan fungsi kolektif subjek Yunani secara idiomatis.
  - severity: medium
    issue: '"Menepuk-nepuk dada" melemahkan tindakan τύπτοντες.'
    rationale: Kata Yunani ini mengacu pada tindakan memukul/menampar dada dalam gestur ratapan. "Memukul-mukul dada" lebih setia tanpa menambahkan tafsiran tentang motifnya.
