  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: id
  text: Karena itu, setelah menghukumnya[a], aku akan membebaskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah mendisiplinkannya”. Kata ini dapat menunjuk pada hukuman yang dimaksudkan sebagai tindakan korektif. Sebagian orang memahaminya secara lebih khusus sebagai pencambukan, tetapi kata Yunaninya sendiri memiliki arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: setelah menghukumnya
  rationale: Partisip aoris dipahami secara temporal. Dalam konteks pengadilan Pilatus, παιδεύω menunjuk pada tindakan hukuman, tetapi kata Yunaninya tidak menentukan bentuk hukuman secara khusus.
- source_word: οὖν
  choice: Karena itu
  rationale: Mengungkapkan hubungan kesimpulan atau akibat dalam ucapan Pilatus dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: αὐτόν
  choice: -nya
  rationale: Pronomina akusatif ini merujuk kepada Yesus; bentuk enklitik Indonesia menghasilkan kalimat yang alami tanpa mengubah acuannya.
- source_word: ἀπολύσω
  choice: aku akan membebaskannya
  rationale: Dalam konteks tahanan dan pengadilan, ἀπολύω berarti membebaskan atau melepaskan seseorang. 'Membebaskan' paling jelas menyampaikan tindakan hukum yang dimaksud.
theological_decisions:
- issue: Cakupan makna παιδεύω dalam usul Pilatus
  choice: Diterjemahkan dalam arti penghukuman sebagai 'menghukum', tanpa menentukan caranya.
  alternative: '''mendisiplinkan'', ''menghajar'', atau secara lebih khusus ''mencambuk'''
  rationale: Konteks pengadilan menuntut arti hukuman, bukan pendidikan. Namun, terjemahan tidak mempersempit kata tersebut menjadi pencambukan, sebab bentuk hukuman itu tidak dinyatakan secara khusus oleh verba Yunaninya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan ringkas. Kata ganti orang pertama 'aku' sesuai dengan ucapan langsung seorang penguasa dalam narasi, sedangkan bentuk '-nya' mempertahankan acuan kepada Yesus tanpa menambahkan kapitalisasi penghormatan yang tidak ditandai dalam teks Yunani.
