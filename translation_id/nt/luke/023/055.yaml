  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: id
  text: Para perempuan yang telah datang bersama-Nya dari Galilea[a] mengikuti, lalu mengamati makam itu dan bagaimana jenazah-Nya dibaringkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: telah menyertai-Nya dari Galilea.'
    reason: Alternatif ini menonjolkan makna kebersamaan/penyertaan dalam συνεληλυθυῖαι ... αὐτῷ, sedangkan teks utama mempertahankan gambaran ‘datang bersama-Nya’.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: mengikuti dari belakang
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului atau mengiringi tindakan utama. Bentuk verba finit dengan «lalu» menghasilkan urutan narasi yang alami dalam bahasa Indonesia, sedangkan «dari belakang» mempertahankan nuansa κατα- dalam konteks mengikuti rombongan menuju makam.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ hanya menandai peralihan narasi yang ringan. Dalam bahasa Indonesia, kesinambungan itu sudah jelas dari konteks sehingga penambahan «adapun» atau «kemudian» akan terasa lebih menonjol daripada teks sumber.
- source_word: αἱ γυναῖκες
  choice: perempuan-perempuan
  rationale: Bentuk ulang menyatakan kelompok perempuan tertentu yang telah dikenal dalam narasi; konteks menyediakan ketertentuannya tanpa perlu kata tambahan.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: yang telah datang bersama-Nya dari Galilea
  rationale: Ungkapan ini mempertahankan tindakan yang telah terjadi sebelumnya, tempat asal mereka, dan hubungan kebersamaan dengan Yesus. Kapitalisasi pronomina mengikuti register Alkitab bahasa Indonesia dan memperjelas rujukannya tanpa mengganti pronomina dengan nama diri.
- source_word: ἐθεάσαντο
  choice: mengamati
  rationale: θεάομαι di sini menyiratkan penglihatan yang disengaja dan saksama, sebab para perempuan memperhatikan makam serta cara jenazah ditempatkan. «Mengamati» lebih utuh daripada sekadar «melihat» tanpa menjadi terlalu teknis.
- source_word: τὸ μνημεῖον
  choice: makam itu
  rationale: «Makam» adalah padanan yang tepat dan lazim untuk tempat penguburan dalam konteks ini; «itu» mencerminkan artikel tertentu dan menunjuk pada makam yang baru disebut dalam narasi.
- source_word: ὡς ἐτέθη
  choice: bagaimana ... dibaringkan
  rationale: ὡς menyatakan cara, dan bentuk pasif ἐτέθη dipertahankan. «Dibaringkan» alami dan bermartabat untuk penempatan jenazah di dalam makam.
- source_word: τὸ σῶμα αὐτοῦ
  choice: jenazah-Nya
  rationale: Dalam konteks sesudah kematian, «jenazah» adalah padanan alami bagi σῶμα dan lebih idiomatis daripada «tubuh-Nya», sambil tetap menyatakan bahwa yang dimaksud ialah tubuh Yesus.
theological_decisions:
- issue: Hubungan partisip κατακολουθήσασαι dengan verba utama ἐθεάσαντο
  choice: 'Dinyatakan sebagai tindakan berurutan: «mengikuti dari belakang, lalu mengamati»'
  alternative: «Setelah mengikuti dari belakang, mereka mengamati»
  rationale: Keduanya dimungkinkan secara gramatikal. Bentuk koordinatif dengan «lalu» mempertahankan urutan peristiwa dan menghasilkan narasi Indonesia yang lancar tanpa mengubah makna teologis.
- issue: Rujukan αὐτῷ dan αὐτοῦ
  choice: Diterjemahkan dengan pronomina «-Nya» yang merujuk kepada Yesus
  alternative: Menyebut nama «Yesus» secara eksplisit
  rationale: Pronomina mempertahankan bentuk teks sumber dan kesinambungan dengan konteks. Kapitalisasi membantu pembaca mengenali rujukannya tanpa memasukkan nama yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur kalimat dibuat lancar untuk pembaca umum, dengan nuansa pengamatan yang saksama dan urutan narasi tetap dipertahankan.
