review_pass:
  verdict: revise
  source_fidelity: 'Teks ini pada dasarnya menyampaikan unsur-unsur Yunani dengan tepat: para perempuan itu berasal dari Galilea bersama Yesus, melihat makam, dan memperhatikan cara jenazah-Nya ditempatkan. Namun, «dari belakang» menambahkan rincian arah/posisi yang tidak dinyatakan secara eksplisit oleh κατακολουθήσασαι. Verba itu cukup berarti ‘mengikuti’ atau ‘mengikuti terus’; konteks dapat menyiratkan mereka mengikuti rombongan, tetapi tidak menuntut frasa tersebut.'
  naturalness: «Para perempuan» lebih alami dalam bahasa Indonesia modern daripada pengulangan «perempuan-perempuan» untuk kelompok tertentu. Susunan kalimat revisi tetap lancar dan mempertahankan urutan naratif tanpa menjadikan partisip Yunani terlalu harfiah.
  terminology: «Makam», «jenazah-Nya», dan «dibaringkan» sesuai konteks penguburan serta register yang bermartabat. Pronomina kapital «-Nya» dapat dipertahankan sebagai konvensi register Alkitab Indonesia. Catatan kaki dipertahankan, dengan perumusan yang lebih langsung dan tanpa «sejak», yang dapat memberi nuansa durasi yang tidak diperlukan oleh ἐκ.
  issues:
  - severity: medium
    issue: Frasa «dari belakang» dalam terjemahan κατακολουθήσασαι
    rationale: Kata κατακολουθέω menyatakan mengikuti dengan dekat/terus, tetapi tidak secara leksikal menyatakan posisi fisik ‘dari belakang’. Frasa itu berisiko menambahkan detail yang tidak tegas dalam teks sumber.
  - severity: low
    issue: «Perempuan-perempuan» kurang idiomatis untuk kelompok tertentu
    rationale: Dalam bahasa Indonesia modern, «para perempuan» lebih lazim dan jelas menyatakan kelompok yang telah dikenal dalam narasi.
  - severity: low
    issue: «sejak dari Galilea» pada catatan kaki
    rationale: ἐκ τῆς Γαλιλαίας berarti ‘dari Galilea’; ‘sejak’ dapat menyiratkan penekanan temporal/duratif yang tidak perlu.
  revised_text: Para perempuan yang telah datang bersama-Nya dari Galilea[a] mengikuti, lalu mengamati makam itu dan bagaimana jenazah-Nya dibaringkan.
