revisions:
- from: Perempuan-perempuan yang telah datang bersama-Nya dari Galilea[a] mengikuti dari belakang, lalu mengamati makam itu dan bagaimana jenazah-Nya dibaringkan.
  to: Para perempuan yang telah datang bersama-Nya dari Galilea[a] mengikuti, lalu mengamati makam itu dan bagaimana jenazah-Nya dibaringkan.
  rationale: Revisi menghapus tambahan arah «dari belakang» demi kesetiaan yang lebih ketat kepada κατακολουθήσασαι, mengganti bentuk kelompok dengan idiom Indonesia modern «para perempuan», dan menyesuaikan catatan kaki agar hanya menyatakan alternatif leksikal yang didukung teks Yunani. Makna, urutan peristiwa, dan ambiguitas yang relevan tetap terpelihara.
