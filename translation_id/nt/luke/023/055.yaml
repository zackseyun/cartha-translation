  revision_rationale: Revisi menghapus tambahan arah «dari belakang» demi kesetiaan yang lebih ketat kepada κατακολουθήσασαι, mengganti bentuk kelompok dengan idiom Indonesia modern «para perempuan», dan menyesuaikan catatan kaki agar hanya menyatakan alternatif leksikal yang didukung teks Yunani. Makna, urutan peristiwa, dan ambiguitas yang relevan tetap terpelihara.
