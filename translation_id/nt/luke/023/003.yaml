id: LUK.23.3
reference: Luke 23:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: id
  text: Lalu Pilatus bertanya kepada-Nya, “Apakah Engkau Raja orang Yahudi[a]?” Dia menjawab, “Engkau sendiri yang mengatakannya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yudea.” Istilah Yunani ini dapat berarti orang Yahudi atau orang Yudea, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “Engkau mengatakannya.” Ungkapan Yunani ini ringkas dan dapat dipahami sebagai penegasan berkualifikasi: “Ya, seperti yang engkau katakan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Penghubung ringan ini melanjutkan urutan narasi; “Lalu” alami dalam bahasa Indonesia dan tidak memberi kesan pertentangan yang kuat.
- source_word: ἠρώτησεν
  choice: bertanya
  rationale: Bentuk aoristus ἐρωτάω memperkenalkan pertanyaan langsung Pilatus; “bertanya” merupakan padanan netral dan alami.
- source_word: λέγων
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partisipel ini memperkenalkan ujaran langsung, tetapi jika diterjemahkan harfiah sebagai “dengan berkata” akan terasa berlebihan dalam bahasa Indonesia; fungsinya sudah terwakili oleh tanda baca dan kutipan.
- source_word: Σὺ εἶ
  choice: Apakah Engkau
  rationale: Konteks dan tanda tanya menunjukkan kalimat interogatif; bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan penekanan pada lawan bicara.
- source_word: βασιλεὺς
  choice: Raja
  rationale: βασιλεύς secara langsung berarti raja; huruf kapital dipakai sebagai bagian dari gelar yang sedang ditanyakan kepada Yesus.
- source_word: τῶν Ἰουδαίων
  choice: orang Yahudi
  rationale: Dalam konteks dakwaan sengsara, ungkapan ini secara konvensional dan tepat berarti “Raja orang Yahudi”; kemungkinan geografis-etnis “orang Yudea” dicatat dalam catatan kaki.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Dia menjawab
  rationale: Ungkapan Yunani secara harfiah menyatakan bahwa Yesus menjawab Pilatus dan berkata. “Dia menjawab” menyampaikan fungsi responsif secara alami tanpa pengulangan verba tutur yang kaku.
- source_word: Σὺ λέγεις
  choice: Engkau sendiri yang mengatakannya
  rationale: Jawaban singkat ini menggemakan rumusan Pilatus dan dapat berfungsi sebagai penegasan berkualifikasi. Padanan ini tidak mengubahnya menjadi jawaban “ya” yang tegas dan tetap mempertahankan sifat tidak langsungnya.
theological_decisions:
- issue: Daya ungkapan jawaban Yesus, Σὺ λέγεις
  choice: 'Penegasan berkualifikasi: “Engkau sendiri yang mengatakannya.”'
  alternative: “Ya, seperti yang engkau katakan” atau “Engkau mengatakannya.”
  rationale: Bahasa Yunani yang ringkas tidak menyangkal gelar itu, tetapi menempatkan rumusannya pada Pilatus. Terjemahan utama mempertahankan ketegangan retoris dan kristologis ini tanpa menjadikannya persetujuan “ya” yang sepenuhnya eksplisit ataupun penolakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Kata ganti bagi Yesus menggunakan kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Partisipel λέγων dan rangkaian ἀποκριθεὶς ... ἔφη diterjemahkan secara idiomatis agar tidak menghasilkan pengulangan yang kaku, sementara ambiguitas jawaban Yesus dipertahankan.
