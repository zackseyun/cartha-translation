revisions:
- from: Ketika mereka membawa Yesus pergi, mereka menangkap seorang bernama Simon dari Kirene yang sedang datang dari luar kota[a]. Mereka menaruh salib itu di atas bahunya supaya ia memikulnya sambil berjalan di belakang Yesus.[b]
  to: Ketika mereka membawa Yesus pergi, mereka memegang paksa seorang bernama Simon dari Kirene yang datang dari daerah pedesaan[a], lalu membebankan salib[b] itu kepadanya untuk dipikul di belakang Yesus.
  rationale: Revisi menghapus rincian “bahunya” yang tidak terdapat dalam sumber, memilih “memegang paksa” untuk mempertahankan daya tindakan ἐπιλαβόμενοι tanpa konotasi penangkapan resmi, dan menempatkan penanda catatan kaki tepat pada istilah yang dibahas. Terjemahan tetap mempertahankan “salib,” asal Simon dari Kirene, serta posisi “di belakang Yesus.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:16:32Z'
review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya mencerminkan urutan dan tindakan dalam teks Yunani dengan baik. Namun, frasa “di atas bahunya” menambahkan rincian fisik yang tidak dinyatakan oleh ἐπέθηκαν αὐτῷ (“mereka meletakkan/membebankan kepadanya”). Selain itu, penanda catatan tentang σταυρός sebaiknya ditempatkan langsung pada kata “salib”, bukan di akhir kalimat setelah beberapa unsur lain.
  naturalness: Bahasa draf baku dan jelas. “Mereka menangkap” dapat dipahami sebagai penahanan resmi, sedangkan ἐπιλαβόμενοι terutama berarti mengambil atau memegang secara paksa. “Mereka memegang paksa” lebih dekat dengan sumber dan tetap alami dalam konteks ini. Susunan revisi lebih ringkas tanpa kehilangan kelancaran naratif.
  terminology: “Yesus,” “Simon dari Kirene,” dan “salib” tepat. “Salib” sebaiknya dipertahankan, tanpa mempersempitnya menjadi “balok salib.” “Dari luar kota” merupakan pemaknaan yang mungkin bagi ἀπ’ ἀγροῦ, tetapi “dari daerah pedesaan” lebih langsung menyatakan rentang makna ἀγρός dan tidak mengandaikan secara eksplisit batas kota.
  issues:
  - severity: medium
    issue: Tambahan “di atas bahunya”
    rationale: Teks Yunani hanya menyatakan bahwa salib itu diletakkan atau dibebankan kepada Simon; teks tidak menyebut bahu.
  - severity: low
    issue: “Menangkap” berpotensi terlalu khusus
    rationale: Dalam bahasa Indonesia modern, “menangkap” lazim berkonotasi menangkap atau menahan seseorang. “Memegang paksa” menyatakan tindakan ἐπιλαβόμενοι tanpa menambahkan nuansa prosedural.
  - severity: low
    issue: Letak penanda catatan kaki b kurang tepat
    rationale: Catatan b membahas istilah “salib”, sehingga penandanya perlu langsung mengikuti kata tersebut.
  revised_text: Ketika mereka membawa Yesus pergi, mereka memegang paksa seorang bernama Simon dari Kirene yang datang dari daerah pedesaan[a], lalu membebankan salib[b] itu kepadanya untuk dipikul di belakang Yesus.
  revised_footnotes:
