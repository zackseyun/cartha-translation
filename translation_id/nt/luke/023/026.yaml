id: LUK.23.26
reference: Luke 23:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: id
  text: Ketika mereka membawa Yesus pergi, mereka memegang paksa seorang bernama Simon dari Kirene yang datang dari daerah pedesaan[a], lalu membebankan salib[b] itu kepadanya untuk dipikul di belakang Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari ladang.” Kata Yunani yang dipakai dapat menunjuk pada sebuah ladang secara khusus atau pada daerah pedesaan di luar kota secara umum.
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang memahami “salib” di sini secara lebih khusus sebagai “balok salib”, tetapi teks Yunani hanya menyebut “salib”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον αὐτόν
  choice: mereka membawa Yesus pergi
  rationale: Verba ἀπάγω menyatakan membawa atau menggiring seseorang pergi. Nama Yesus dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: ἐπιλαβόμενοι
  choice: mereka menangkap
  rationale: Partisipel ἐπιλαμβάνομαι di sini menggambarkan tindakan memegang seseorang secara paksa; 'menangkap' alami dalam bahasa Indonesia dan mempertahankan unsur paksaan.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: seorang bernama Simon dari Kirene
  rationale: Ungkapan ini memperkenalkan seorang yang sebelumnya tidak dikenal. Bentuk Indonesia ini lebih alami daripada 'seorang Simon tertentu' serta tetap menyatakan nama dan asalnya.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: yang sedang datang dari luar kota
  rationale: ἀγρός dapat berarti ladang atau daerah pedesaan. Dalam konteks gerak menuju tempat di kota, 'dari luar kota' menyampaikan cakupan geografisnya secara alami sambil mempertahankan kemungkinan 'dari ladang' dalam catatan kaki.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: Mereka menaruh salib itu di atas bahunya
  rationale: ἐπιτίθημι berarti menaruh di atas. 'Di atas bahunya' mengungkapkan secara alami bahwa salib itu dibebankan kepadanya untuk dipikul, tanpa mengubah objek menjadi 'balok salib'.
- source_word: φέρειν
  choice: supaya ia memikulnya
  rationale: φέρω di sini menunjuk pada membawa suatu beban. 'Memikul' adalah ungkapan Indonesia yang tepat untuk membawa beban berat pada tubuh.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: sambil berjalan di belakang Yesus
  rationale: ὄπισθεν terutama menyatakan posisi ruang di belakang. Tambahan 'sambil berjalan' membuat hubungan dengan tindakan memikul alami dalam bahasa Indonesia tanpa menambahkan gagasan teologis.
theological_decisions:
- issue: Apakah σταυρός perlu diterjemahkan secara lebih khusus sebagai balok salib
  choice: salib
  alternative: balok salib
  rationale: Teks Yunani memakai σταυρός, bukan istilah khusus untuk salah satu bagian salib. 'Salib' mempertahankan makna leksikal yang dinyatakan teks dan tidak memasukkan rekonstruksi sejarah yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dibagi dua agar mudah dipahami. Semua penanda catatan kaki dicantumkan dalam teks utama.
