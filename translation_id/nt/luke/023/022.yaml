id: LUK.23.22
reference: Luke 23:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: id
  text: Lalu, untuk ketiga kalinya ia berkata kepada mereka, “Mengapa? Kejahatan apa yang telah dilakukan orang ini?[a] Aku tidak menemukan pada orang ini dasar apa pun untuk menjatuhkan hukuman mati.[b] Karena itu, setelah menghukumnya[c], aku akan membebaskannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab kejahatan apa yang telah dilakukan orang ini?” Kata pembuka Τί dapat dipahami sebagai protes eliptis yang mengantar pertanyaan lengkap.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “tidak menemukan padanya alasan bagi kematian”; dapat juga diterjemahkan “tidak menemukan alasan untuk hukuman mati” atau “tidak menemukan sesuatu yang layak dihukum mati.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “setelah mendisiplinkannya”; mungkin lebih khusus, “setelah mencambuknya.” Kata Yunani παιδεύσας menunjuk pada hukuman yang bersifat disipliner, tetapi kata itu sendiri tidak menyebutkan bentuk hukumannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: untuk ketiga kalinya
  rationale: Bentuk ini berfungsi secara adverbial dan menegaskan bahwa Pilatus kembali berbicara untuk kali ketiga.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Mengapa? Kejahatan apa yang telah dilakukan orang ini?
  rationale: Τί dapat dipahami sebagai protes eliptis sebelum pertanyaan lengkap. Terjemahan ini mempertahankan alur retoris dan daya moral κακόν tanpa menghilangkan kejanggalan yang disengaja.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: tidak menemukan kesalahan apa pun padanya yang layak dihukum mati
  rationale: Dalam konteks pengadilan, αἴτιον menunjuk pada kesalahan atau dasar yang dapat membenarkan hukuman mati. Ungkapan ini jelas dalam bahasa Indonesia modern dan tidak menyatakan bahwa kematian itu sekadar akibat alami.
- source_word: εὗρον ἐν αὐτῷ
  choice: Aku tidak menemukan ... padanya
  rationale: Terjemahan ini mengikuti ungkapan Yunani secara dekat, sementara konteks membuat relevansi putusan Pilatus pada saat itu tetap jelas.
- source_word: παιδεύσας
  choice: setelah menghukumnya
  rationale: Dalam konteks ini kata tersebut mengacu pada tindakan disipliner yang bersifat menghukum, bukan pengajaran. Pilihan ini tidak menentukan bentuk hukuman yang tidak disebutkan secara eksplisit oleh kata Yunani itu.
- source_word: ἀπολύσω
  choice: aku akan melepaskannya
  rationale: Dalam konteks hukum, kata ini berarti membebaskan atau melepaskan seorang tahanan; 'melepaskannya' merupakan ungkapan Indonesia yang alami dan tetap sesuai dengan latar pengadilan.
theological_decisions:
- issue: Bentuk tindakan yang diusulkan Pilatus melalui παιδεύσας
  choice: Diterjemahkan secara umum sebagai hukuman tanpa menyebut bentuknya.
  alternative: setelah mendisiplinkannya; setelah mencambuknya
  rationale: Ayat ini mempertahankan ketegangan bahwa Pilatus menyatakan Yesus tidak layak dihukum mati, tetapi tetap mengusulkan hukuman yang lebih ringan. Kata Yunani tersebut tidak dengan sendirinya menetapkan bahwa bentuknya pasti pencambukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif dan yudisial yang tetap mudah dipahami. Bentuk sapaan dan pronomina dibuat alami, sedangkan protes eliptis serta ketegangan antara pernyataan tidak bersalah dan usulan hukuman dipertahankan.
