  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: id
  text: Sebab lihatlah, hari-hari akan datang ketika orang akan berkata, “Berbahagialah perempuan-perempuan mandul, rahim-rahim yang tidak pernah melahirkan, dan buah dada yang tidak pernah memberi susu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan seruan yang mengarahkan perhatian secara langsung, dengan bentuk Indonesia yang wajar dan bermartabat.
- source_word: ἔρχονται ἡμέραι
  choice: akan tiba saatnya
  rationale: Ungkapan idiomatis Indonesia untuk hari-hari yang akan datang; bentuk tunggal kolektif 'saatnya' menyampaikan masa yang dinubuatkan tanpa kekakuan.
- source_word: Μακάριαι
  choice: Berbahagialah
  rationale: Padanan baku untuk ucapan makarios yang menyatakan keadaan yang dianggap berbahagia atau beruntung dalam konteks pembalikan tragis ini.
- source_word: αἱ στεῖραι
  choice: perempuan yang mandul
  rationale: Nomina feminin tersirat dibuat eksplisit agar alami dan jelas dalam bahasa Indonesia.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: rahim yang tidak pernah melahirkan
  rationale: Menjaga citra tubuh dan paralelisme sumber; 'tidak pernah' secara alami menyatakan negasi pengalaman melahirkan.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: buah dada yang tidak pernah menyusui
  rationale: Mempertahankan metonimia tubuh dan fungsi memberi susu; 'buah dada' bernada alkitabiah namun tetap dipahami luas.
theological_decisions:
- issue: Makna ucapan berbahagia atas kemandulan
  choice: Mempertahankan ucapan paradoksal tanpa penjelasan tambahan
  alternative: Menjelaskannya sebagai lebih beruntung karena terhindar dari penderitaan anak pada masa penghakiman
  rationale: Ayat itu sendiri menyampaikan pembalikan tragis secara ringkas; penjelasan sebab-akibat tidak boleh dimasukkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Paralelisme antara perempuan, rahim, dan buah dada dipertahankan, demikian pula nada nubuat dan ironi tragisnya.
