  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: id
  text: Setelah menurunkan jenazah Yesus, ia membungkusnya dengan kain linen dan membaringkannya di dalam makam yang dipahat di dalam batu, tempat belum ada seorang pun yang dibaringkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθελὼν
  choice: ia menurunkan jenazah Yesus
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului verba utama. Objek pronominal merujuk kepada Yesus; 'jenazah Yesus' memperjelas konteks penurunan dari salib tanpa menyebut salib secara eksplisit.
- source_word: ἐνετύλιξεν
  choice: membungkusnya
  rationale: Verba ini berarti membungkus atau menggulung dalam kain; pilihan ini alami dan tidak menambahkan rincian cara pembungkusan.
- source_word: σινδόνι
  choice: dengan kain linen
  rationale: Bentuk datif menyatakan sarana. σινδών menunjuk pada sehelai kain linen, dalam konteks ini untuk penguburan; 'kain linen' jelas dan tidak seinterpretatif 'kain kafan'.
- source_word: ἔθηκεν
  choice: membaringkannya
  rationale: τίθημι berarti menaruh atau menempatkan. Dalam konteks jenazah dan makam, 'membaringkan' merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: μνήματι
  choice: di dalam makam
  rationale: μνῆμα adalah makam atau tempat penguburan. 'Makam' merupakan padanan Indonesia modern yang tepat.
- source_word: λαξευτῷ
  choice: yang dipahat pada batu
  rationale: Adjektiva ini berarti dipahat atau dipotong pada bahan batu. Frasa tersebut menyampaikan bahwa makam dibuat dengan memahat batu tanpa menentukan lebih jauh bentuk atau jenis batunya.
- source_word: οὗ
  choice: tempat
  rationale: Adverbia relatif ini mengacu pada makam; 'tempat' menghubungkan klausa relatif secara alami dalam bahasa Indonesia.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: belum pernah seorang pun dibaringkan
  rationale: Gabungan negasi dan οὔπω menegaskan bahwa makam itu belum digunakan untuk siapa pun. Bentuk pasif kontekstual 'dibaringkan' menyampaikan maksud penguburan secara alami.
theological_decisions:
- issue: Deskripsi penguburan dan jenis makam
  choice: Yusuf membaringkan jenazah Yesus di sebuah makam pahatan batu yang belum pernah digunakan untuk siapa pun.
  alternative: Yusuf menempatkan Yesus di sebuah makam yang dipahat, tempat belum ada seorang pun yang terbaring.
  rationale: Ayat ini bersifat naratif. Terjemahan mempertahankan rincian historis tentang makam yang belum pernah digunakan tanpa memasukkan harmonisasi dari Injil lain atau klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, alami, dan bermartabat. Nama 'Yesus' diulang sebagai pengganti pronomina demi kejelasan, sedangkan 'jenazah' ditambahkan secara kontekstual karena tindakan menurunkan dan menguburkan jelas berkenaan dengan tubuh-Nya setelah kematian. Tidak digunakan penanda catatan kaki karena tidak ada alternatif yang perlu ditampilkan untuk menjaga ambiguitas penting pada ayat ini.
