review_pass:
  verdict: revise
  source_fidelity: 'Draf pada umumnya menyampaikan urutan tindakan dalam bahasa Yunani: tubuh Yesus diturunkan, dibungkus dengan kain linen, lalu ditempatkan dalam makam yang belum dipakai. Namun, "dipahat pada batu" tidak tepat dan kurang alami untuk λαξευτῷ, yang menunjuk pada makam yang dipahat/dipotong di dalam batu. Klausa terakhir juga perlu memakai "belum" untuk οὔπω (''belum''), bukan "belum pernah" yang dapat menggeser nuansa temporalnya.'
  naturalness: Bahasa draf umumnya baku dan bernada sesuai. Akan tetapi, "tempat belum pernah seorang pun dibaringkan" terdengar tidak lazim dan kurang lengkap secara sintaksis dalam bahasa Indonesia modern. "yang dipahat di dalam batu" serta "tempat belum ada seorang pun yang dibaringkan" lebih alami.
  terminology: '"Kain linen" dan "makam" merupakan pilihan yang tepat. "Jenazah Yesus" dapat diterima sebagai penjelasan kontekstual bagi pronomina Yunani dalam narasi penguburan, tanpa menambahkan rincian historis baru. "Dibaringkan" dapat dipertahankan dalam klausa terakhir untuk menyatakan bahwa makam itu belum digunakan bagi penguburan siapa pun.'
  issues:
  - severity: medium
    issue: Frasa "makam yang dipahat pada batu" tidak menyatakan dengan tepat makam yang dipahat/dipotong di dalam batu.
    rationale: λαξευτῷ menerangkan μνήματι sebagai makam rock-cut/hewn. Dalam bahasa Indonesia, sesuatu yang "dipahat pada batu" cenderung berarti ukiran pada permukaan batu, bukan ruang makam yang dipahat di dalam batu.
  - severity: medium
    issue: Klausa "tempat belum pernah seorang pun dibaringkan" kurang alami dan "belum pernah" tidak sepadan secara paling langsung dengan οὔπω.
    rationale: 'οὔπω berarti "belum" pada titik waktu narasi. Penambahan "ada" menghasilkan konstruksi Indonesia yang wajar: "tempat belum ada seorang pun yang dibaringkan."'
  revised_text: Setelah menurunkan jenazah Yesus, ia membungkusnya dengan kain linen dan membaringkannya di dalam makam yang dipahat di dalam batu, tempat belum ada seorang pun yang dibaringkan.
