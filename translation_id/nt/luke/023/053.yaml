- from: Lalu ia menurunkan jenazah Yesus, membungkusnya dengan kain linen, dan membaringkannya di dalam makam yang dipahat pada batu, tempat belum pernah seorang pun dibaringkan.
  to: Setelah menurunkan jenazah Yesus, ia membungkusnya dengan kain linen dan membaringkannya di dalam makam yang dipahat di dalam batu, tempat belum ada seorang pun yang dibaringkan.
  rationale: Revisi memperbaiki penggambaran makam sebagai makam yang dipahat di dalam batu dan menyesuaikan klausa terakhir dengan nilai temporal οὔπω, sambil mempertahankan urutan tindakan, register naratif, dan keterangan bahwa makam itu belum dipakai.
