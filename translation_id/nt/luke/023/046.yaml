  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: id
  text: Lalu Yesus berseru dengan suara nyaring, “Bapa, ke dalam tangan-Mu Kuserahkan roh-Ku.”[a] Sesudah mengatakan itu, Ia mengembuskan napas terakhir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Kuserahkan” juga dapat diterjemahkan “Kupercayakan,” yakni menempatkan sesuatu dalam pemeliharaan pihak lain. Perkataan ini menggemakan Mazmur 31:6 (Mazmur 30:6 dalam penomoran Septuaginta): “Ke dalam tangan-Mu kuserahkan rohku.”'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: Atau “Ia wafat” atau, secara sederhana, “Ia meninggal.” Kata Yunaninya secara harfiah berkaitan dengan mengembuskan napas.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: berseru dengan suara nyaring
  rationale: Ungkapan ini menyampaikan seruan yang kuat dan terdengar jelas dengan bahasa Indonesia yang alami serta bermartabat.
- source_word: Πάτερ
  choice: Bapa
  rationale: Bentuk vokatif langsung tanpa menambahkan kata milik yang tidak terdapat dalam teks Yunani.
- source_word: εἰς χεῖράς σου
  choice: ke dalam tangan-Mu
  rationale: Mempertahankan bentuk jamak idiomatis Yunani dan gema Mazmur 31:5 dalam Kitab Suci Yunani.
- source_word: παρατίθεμαι
  choice: Kuserahkan
  rationale: Bentuk kini medial menyatakan tindakan mempercayakan sesuatu ke dalam pemeliharaan pihak lain. 'Kuserahkan' alami sebagai pernyataan performatif yang khidmat; alternatif leksikal dijelaskan dalam catatan.
- source_word: τὸ πνεῦμά μου
  choice: roh-Ku
  rationale: Dalam doa yang ditujukan secara sadar kepada Bapa, 'roh-Ku' mempertahankan keluasan makna dan bobot teologis πνεῦμα tanpa menyempitkannya menjadi napas fisiologis.
- source_word: τοῦτο δὲ εἰπών
  choice: Sesudah mengatakan itu
  rationale: Menyatakan bahwa ucapan tersebut mendahului tindakan pada verba utama dengan susunan Indonesia yang jelas.
- source_word: ἐξέπνευσεν
  choice: Ia mengembuskan napas terakhir
  rationale: Mengungkapkan kematian secara idiomatis sambil mempertahankan citra harfiah verba Yunani yang berkaitan dengan mengembuskan napas.
theological_decisions:
- issue: Makna πνεῦμά μου dalam perkataan terakhir Yesus
  choice: roh-Ku
  alternative: napas-Ku
  rationale: Konteks doa dan tindakan mempercayakan diri kepada Bapa mendukung 'roh-Ku', tetapi terjemahan ini tidak merinci hakikat roh dengan rumusan doktrinal tambahan.
- issue: Aspek verbal παρατίθεμαι
  choice: Kuserahkan
  alternative: Kupercayakan
  rationale: Bentuk kini Yunani berfungsi sebagai pernyataan tindakan yang sedang dilakukan melalui ucapan. Bentuk Indonesia ini menyampaikan daya performatifnya secara alami.
- issue: Hubungan dengan Mazmur 31:5
  choice: Gema teks dipertahankan dalam terjemahan dan disebutkan dalam catatan
  alternative: Tidak menyebut hubungan tersebut
  rationale: Susunan ucapan jelas menggema Mazmur 31:5 LXX; menyatakannya sebagai gema, bukan kutipan berformula, tidak melampaui bukti teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab Indonesia. Penanda catatan ditempatkan tepat sesudah bagian yang diterangkannya.
