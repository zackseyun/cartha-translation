id: LUK.23.31
reference: Luke 23:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: id
  text: Sebab, jika orang berbuat demikian terhadap kayu yang masih hijau,[a][b] apa yang akan terjadi terhadap kayu yang sudah kering?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada kayu yang hijau ... pada kayu yang kering.” Bahasa Yunani mempertahankan gambaran itu secara lebih harfiah.
    reason: lexical_alternative
  - marker: b
    text: 'Gambaran ini tampaknya bergerak dari yang lebih ringan menuju yang lebih berat: jika hal seperti ini dilakukan terhadap kayu yang masih hijau, apa yang akan terjadi terhadap kayu yang sudah kering? Rujukan tepat kedua jenis kayu itu tidak dinyatakan.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Mempertahankan fungsi kausal yang menghubungkan perkataan ini dengan ratapan dan peringatan sebelumnya.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: terhadap kayu yang masih hijau
  rationale: Preposisi ἐν dalam ungkapan ini dipahami sebagai penanda keadaan atau perkara yang dikenai tindakan. 'Kayu yang masih hijau' merupakan ungkapan Indonesia yang wajar untuk kayu segar dan mempertahankan citranya.
- source_word: ὑγρῷ
  choice: masih hijau
  rationale: Secara harfiah berarti basah atau lembap; dalam pertentangan dengan kayu kering, 'masih hijau' secara alami menunjuk pada kayu segar yang sukar terbakar.
- source_word: ξύλῳ
  choice: kayu
  rationale: ξύλον dapat berarti kayu atau pohon. Dalam perbandingan antara yang hijau dan yang kering, 'kayu' mempertahankan gambaran bahan yang dapat terbakar tanpa menentukan rujukan metaforisnya.
- source_word: ταῦτα ποιοῦσιν
  choice: orang berbuat demikian
  rationale: Subjek verba Yunani tidak disebutkan secara eksplisit. 'Orang' mempertahankan sifat tak tentu itu, sedangkan 'demikian' secara alami mewakili demonstrativa jamak dalam bahasa Indonesia.
- source_word: ἐν τῷ ξηρῷ
  choice: terhadap kayu yang sudah kering
  rationale: Mengulang 'kayu' agar pasangan metaforisnya jelas dalam bahasa Indonesia dan memakai 'sudah' untuk menegaskan kontras keadaan dengan kayu yang masih hijau.
- source_word: τί γένηται
  choice: apa yang akan terjadi
  rationale: Pertanyaan retoris ini menanyakan hasil yang diperkirakan; bentuk Indonesia ini menyampaikan daya futurisnya secara alami tanpa menjelaskan hasil tersebut.
theological_decisions:
- issue: Rujukan metafora kayu hijau dan kayu kering
  choice: Mempertahankan metafora tanpa menetapkan siapa atau apa yang dilambangkan oleh masing-masing kayu.
  alternative: Menjelaskan kayu hijau sebagai Yesus dan kayu kering sebagai Yerusalem atau rakyatnya, atau menjadikannya semata-mata pepatah dari perkara yang lebih ringan menuju yang lebih berat.
  rationale: Teks mengisyaratkan peningkatan menuju keadaan yang lebih buruk, tetapi tidak menyatakan rujukan metaforanya secara eksplisit. Terjemahan tidak boleh menyelesaikan ketegangan tafsir itu di dalam teks utama.
- issue: Subjek ποιοῦσιν yang tersirat
  choice: Menggunakan subjek tak tentu 'orang'.
  alternative: Menggunakan 'mereka' dan mengaitkannya secara lebih langsung dengan penguasa Romawi atau pihak tertentu.
  rationale: Bentuk Yunani orang ketiga jamak tidak menyebut kelompok tertentu. 'Orang' menjaga keterbukaan rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Berbuat demikian' menghindari pengulangan kaku 'melakukan hal-hal ini'; metafora kayu tetap terbuka dan tidak ditafsirkan secara denominatif.
