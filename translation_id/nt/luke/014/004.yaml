id: LUK.14.4
reference: Luke 14:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: id
  text: Namun, mereka tetap diam[a]. Lalu Yesus memegang orang itu, menyembuhkannya, dan menyuruhnya pergi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak berkata apa-apa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “membiarkannya pergi” atau “melepaskannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: οἱ merujuk kepada para ahli Taurat dan orang Farisi dalam ayat sebelumnya, sedangkan δέ menandai kontras ringan dengan pertanyaan Yesus yang tidak mereka jawab.
- source_word: ἡσύχασαν
  choice: tetap diam
  rationale: Dalam konteks ini, bentuk aoris ἡσυχάζω menyatakan bahwa mereka tidak memberikan jawaban. 'Tetap diam' alami dalam bahasa Indonesia dan mempertahankan nuansa sikap mereka sesudah ditanya.
- source_word: ἐπιλαβόμενος
  choice: memegang orang itu
  rationale: Partisip ἐπιλαμβάνομαι menyatakan tindakan memegang atau menyentuh dengan pegangan nyata. Bentuk klausa berurutan lebih alami dalam bahasa Indonesia daripada konstruksi partisipial yang kaku.
- source_word: ἰάσατο αὐτόν
  choice: menyembuhkannya
  rationale: ἰάομαι lazim berarti menyembuhkan penyakit fisik, dan akhiran '-nya' merujuk kepada orang yang sakit itu.
- source_word: ἀπέλυσεν
  choice: menyuruhnya pergi
  rationale: ἀπολύω dapat berarti melepaskan, membiarkan pergi, atau menyuruh pergi. Dalam adegan ini, 'menyuruhnya pergi' sesuai dengan tindakan Yesus sesudah penyembuhan tanpa menyiratkan bahwa orang itu sebelumnya dipenjarakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama 'Yesus' dinyatakan kembali untuk memperjelas subjek rangkaian tindakan, karena bentuk Yunani hanya mengandalkan subjek yang tersirat. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
