  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: id
  text: Namun, jika tidak, sementara raja yang lain itu masih jauh, raja itu mengirim rombongan utusan dan meminta syarat-syarat perdamaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal-hal yang berkenaan dengan perdamaian,” yakni syarat-syarat yang dapat menghasilkan perdamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Namun, jika tidak
  rationale: Mempertahankan bentuk adversatif-kondisional Yunani dan kaitannya dengan pertanyaan pada ayat sebelumnya, tanpa menambahkan penjelasan yang tidak tersurat.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: sementara raja yang lain itu masih jauh
  rationale: Konstruksi genitif absolut menyatakan keadaan yang berlangsung bersamaan. Penyebutan 'raja yang lain itu' memperjelas bahwa αὐτοῦ menunjuk kepada raja lawan dalam perumpamaan.
- source_word: πρεσβείαν
  choice: rombongan utusan
  rationale: Kata ini menunjuk kepada suatu delegasi atau rombongan duta. 'Rombongan utusan' alami dalam bahasa Indonesia dan mempertahankan nuansa kolektifnya.
- source_word: ἀποστείλας
  choice: ia mengirim
  rationale: Partisip aoris dialihkan menjadi verba finit yang dirangkaikan dengan tindakan utama agar urutan tindakannya jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐρωτᾷ
  choice: meminta
  rationale: Dalam konteks ini verba tersebut berarti mengajukan permintaan, bukan sekadar bertanya.
- source_word: τὰ πρὸς εἰρήνην
  choice: syarat-syarat perdamaian
  rationale: Ungkapan Yunani secara harfiah berarti 'hal-hal yang menuju/berkenaan dengan perdamaian'; dalam konteks dua raja yang hendak berperang, maksud idiomatisnya ialah syarat-syarat untuk mencapai perdamaian.
