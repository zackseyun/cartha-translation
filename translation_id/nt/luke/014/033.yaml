id: LUK.14.33
reference: Luke 14:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: id
  text: Demikianlah, setiap orang di antara kalian yang tidak melepaskan segala miliknya[a] tidak dapat menjadi murid-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani dapat juga diterjemahkan “meninggalkan” atau, secara lebih harfiah, “mengucapkan selamat tinggal kepada” segala miliknya. Dalam konteks ini, kata itu menyatakan pelepasan yang tegas terhadap milik atau klaim atasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Demikianlah
  rationale: Menyampaikan hubungan kesimpulan dengan perumpamaan-perumpamaan sebelumnya secara ringkas dan alami dalam bahasa Indonesia.
- source_word: πᾶς ἐξ ὑμῶν
  choice: setiap orang di antara kalian
  rationale: 'Mempertahankan daya distributif frasa Yunani: tuntutan ini berlaku secara pribadi kepada tiap pendengar.'
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: yang tidak melepaskan
  rationale: Kata kerja Yunani dapat berarti berpamitan atau mengucapkan selamat tinggal, dan dalam konteks ini menunjuk pada tindakan melepaskan atau merelakan milik. Pilihan ini mempertahankan tuntutan yang tegas tanpa secara diam-diam membatasi maknanya hanya pada penjualan fisik.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: segala miliknya
  rationale: Ungkapan Yunani merujuk pada semua harta atau kepunyaan seseorang. Bentuk Indonesia ini alami, menyeluruh, dan tidak memerlukan penandaan gender.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: tidak dapat menjadi murid-Ku
  rationale: Mempertahankan pernyataan ketidakmungkinan yang tegas, bukan sekadar ketidaklayakan atau larangan.
- source_word: μαθητής
  choice: murid
  rationale: Istilah baku dalam konteks Injil yang mencakup belajar dari dan mengikuti Yesus.
theological_decisions:
- issue: Sifat tuntutan mengenai segala milik
  choice: Menggunakan “melepaskan segala miliknya” dan memberi catatan tentang rentang makna kata kerjanya.
  alternative: “meninggalkan segala miliknya” atau “mengucapkan selamat tinggal kepada segala miliknya”
  rationale: Terjemahan utama mempertahankan kerasnya tuntutan Yesus, sedangkan catatan menjaga ambiguitas asli antara berpamitan, meninggalkan, dan melepaskan klaim atas milik tanpa menetapkan suatu program ekonomi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” menyatakan orang kedua jamak secara jelas; “miliknya” bersifat netral gender dalam bahasa Indonesia. Kapitalisasi dan tanda hubung pada “murid-Ku” mengikuti kebiasaan umum teks Alkitab bahasa Indonesia.
