id: LUK.14.31
reference: Luke 14:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: id
  text: Atau, raja mana yang hendak berperang melawan raja lain tidak akan duduk lebih dahulu dan mempertimbangkan apakah dengan sepuluh ribu tentaranya ia sanggup menghadapi[a] raja yang datang menyerangnya dengan dua puluh ribu tentara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menemui”; dalam konteks ini, kata Yunaninya merujuk pada tindakan menghadapi pasukan yang sedang maju dalam pertempuran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Atau
  rationale: Menghubungkan perumpamaan kedua dengan alur retoris sebelumnya secara sederhana dan alami.
- source_word: τίς βασιλεὺς
  choice: raja mana
  rationale: Ungkapan yang wajar untuk pertanyaan retoris generik yang mengharapkan jawaban bahwa setiap raja akan mempertimbangkannya.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: yang hendak berperang melawan raja lain
  rationale: Merangkum gerak yang bertujuan menuju pertempuran dengan bahasa Indonesia yang alami, tanpa menghilangkan konteks konflik bersenjata.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: tidak akan duduk lebih dahulu dan mempertimbangkan
  rationale: Mempertahankan bentuk pertanyaan retoris, urutan tindakan, dan gagasan pertimbangan yang disengaja.
- source_word: εἰ δυνατός ἐστιν
  choice: apakah ... ia sanggup
  rationale: Menyatakan kemampuan nyata untuk menghadapi kekuatan lawan, bukan sekadar izin atau kemungkinan.
- source_word: ἐν δέκα χιλιάσιν
  choice: dengan sepuluh ribu tentaranya
  rationale: Preposisi bersifat instrumental/asosiatif; penambahan 'tentara' memperjelas satuan pasukan yang tersirat dalam konteks militer.
- source_word: ὑπαντῆσαι
  choice: menghadapi
  rationale: Kata ini secara dasar berarti menemui, tetapi dalam konteks dua pasukan yang berperang menunjuk pada pertemuan sebagai lawan; 'menghadapi' mempertahankan kedua nuansa itu.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: raja yang datang menyerangnya dengan dua puluh ribu tentara
  rationale: Menampilkan raja lawan sebagai pihak yang maju dengan maksud bermusuhan dan memperjelas bahwa jumlah tersebut adalah pasukannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan pertanyaan retoris dipertahankan, sedangkan unsur militer yang tersirat dijelaskan secara ringan dengan kata 'tentara'.
