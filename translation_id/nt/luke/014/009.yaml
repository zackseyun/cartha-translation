  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: id
  text: Lalu orang yang mengundang kamu dan dia akan datang dan berkata kepadamu, “Berikan tempatmu kepada orang ini.” Maka, dengan malu kamu akan mulai menempati tempat terakhir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat yang paling rendah.” Ungkapan Yunani τὸν ἔσχατον τόπον dapat menunjuk pada posisi terakhir dalam suatu urutan dan, dalam konteks perjamuan ini, pada tempat duduk dengan kehormatan paling rendah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: orang yang mengundang kamu dan dia
  rationale: Konstruksi partisip berartikel berfungsi sebagai nomina dan menunjuk kepada pengundang atau tuan rumah; terjemahan ini mempertahankan pembedaan antara kedua tamu.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: akan datang dan berkata kepadamu
  rationale: Partisip aoris yang diikuti verba masa depan secara alami menyatakan tindakan berurutan; koordinasi ini jelas dan wajar dalam bahasa Indonesia.
- source_word: Δὸς τούτῳ τόπον
  choice: Berikan tempatmu kepada orang ini
  rationale: Dalam konteks perjamuan, ungkapan ini berarti menyerahkan tempat duduk sendiri kepada tamu lain. Pronomina posesif dibuat eksplisit agar maknanya alami dalam bahasa Indonesia.
- source_word: μετὰ αἰσχύνης
  choice: dengan malu
  rationale: Ungkapan ini mempertahankan daya sosial αἰσχύνη sebagai rasa malu atau kehinaan, bukan sekadar rasa canggung.
- source_word: τὸν ἔσχατον τόπον
  choice: tempat yang paling belakang
  rationale: ἔσχατος dapat berarti terakhir atau terendah. Dalam urutan tempat duduk, 'paling belakang' mempertahankan gambaran posisi terakhir tanpa menghilangkan implikasi rendahnya kehormatan.
- source_word: κατέχειν
  choice: menempati
  rationale: Dalam konteks tempat duduk, κατέχω paling tepat berarti mengambil atau menduduki suatu posisi; 'menempati' alami setelah 'mulai'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Tempat' dipertahankan agar dekat dengan τόπος, sedangkan konteks perjamuan menjelaskan bahwa yang dimaksud ialah posisi tempat duduk.
