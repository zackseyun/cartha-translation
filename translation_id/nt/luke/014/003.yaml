  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: id
  text: Lalu Yesus menjawab dan berkata kepada para ahli Taurat dan orang-orang Farisi, “Apakah diperbolehkan menyembuhkan pada hari Sabat atau tidak?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: menanggapi mereka dan berkata
  rationale: Gabungan ini mempertahankan ungkapan ganda Yunani, tetapi memakai bentuk Indonesia yang alami. Kata 'mereka' menjelaskan sasaran tanggapan yang tersirat dalam konteks tanpa mengubah isi pertanyaan.
- source_word: νομικοὺς
  choice: para ahli Taurat
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada orang-orang yang ahli dalam hukum Yahudi, bukan pengacara sipil modern. 'Ahli Taurat' merupakan sebutan Indonesia yang dikenal dan sesuai konteks.
- source_word: Φαρισαίους
  choice: orang-orang Farisi
  rationale: Bentuk baku dan mudah dipahami untuk nama kelompok ini.
- source_word: Ἔξεστιν
  choice: Apakah diperbolehkan
  rationale: Menyampaikan arti legal-normatif tentang apa yang diizinkan, dengan bahasa Indonesia modern dan wajar.
- source_word: τῷ σαββάτῳ
  choice: pada hari Sabat
  rationale: Menyatakan fungsi temporal dari bentuk datif dan memakai ungkapan Indonesia yang lazim.
- source_word: θεραπεῦσαι
  choice: menyembuhkan orang
  rationale: Kata kerja ini berarti menyembuhkan; objek 'orang' dibuat eksplisit secara wajar dalam bahasa Indonesia karena konteks langsung berbicara tentang seorang yang sakit.
- source_word: ἢ οὔ
  choice: atau tidak
  rationale: Mempertahankan bentuk pertanyaan alternatif secara langsung dan alami.
theological_decisions:
- issue: Pertanyaan mengenai hukum Sabat tanpa mendahului kesimpulan Yesus
  choice: Apakah diperbolehkan menyembuhkan orang pada hari Sabat atau tidak?
  alternative: Apakah menurut hukum boleh menyembuhkan orang pada hari Sabat atau tidak?
  rationale: Rumusan yang dipilih mempertahankan daya legal-teologis pertanyaan tanpa menambahkan alasan mengenai belas kasihan, kebutuhan, atau kewenangan Yesus yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para ahli Taurat' dipilih daripada 'para pengacara' agar pembaca tidak mengaitkannya dengan profesi hukum sipil modern. Tidak diperlukan catatan kaki karena pilihan istilah tersebut sudah cukup jelas dalam bahasa sasaran.
