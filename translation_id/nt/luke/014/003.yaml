    rationale: Teks menyatakan bahwa Yesus menjawab lalu berkata kepada para ahli Taurat dan orang-orang Farisi. Rumusan "menanggapi mereka dan berkata kepada ..." kurang langsung dan membuat sasaran yang sama disebut dua kali.
