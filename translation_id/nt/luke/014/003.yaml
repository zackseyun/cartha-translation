  verdict: revise
  source_fidelity: Draf secara umum mengikuti teks Yunani dan mempertahankan pertanyaan hukum tentang Sabat. Namun, "mereka" sebagai objek bagi "menanggapi" dan terutama "orang" sebagai objek dari "menyembuhkan" tidak dinyatakan dalam ayat ini. Walaupun konteks dekat menyebut seorang yang sakit, penambahan itu tidak perlu untuk bahasa Indonesia dan mengurangi ketelitian pada teks ayat.
  naturalness: '"Yesus menjawab dan berkata kepada ..." adalah bentuk Indonesia baku dan alami untuk ungkapan ganda ἀποκριθεὶς ... εἶπεν. Menghapus "menanggapi mereka" juga menghindari pengulangan sasaran, karena para ahli Taurat dan orang-orang Farisi sudah disebut sesudahnya.'
  terminology: '"Para ahli Taurat" dapat dipakai sebagai padanan lazim untuk νομικοί dalam konteks Yahudi; "orang-orang Farisi" dan "hari Sabat" juga tepat. "Diperbolehkan" menyampaikan daya normatif ἔξεστιν tanpa menambahkan penafsiran.'
