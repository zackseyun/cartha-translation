  naturalness: Bahasa draf umumnya modern dan jelas. “Jangan sampai ... dan hal itu menjadi balasan bagimu” menyampaikan peringatan μήποτε secara alami dan lebih dekat dengan susunan Yunani. “Teman-temanmu” dipilih sebagai padanan yang lebih luas dan lazim untuk φίλους daripada “sahabat-sahabatmu”.
  terminology: Istilah “saudara-saudaramu,” “kaum kerabatmu,” dan “tetangga-tetanggamu yang kaya” memadai. Kontras antara ἄριστον dan δεῖπνον dipertahankan melalui “jamuan makan siang” dan “makan malam.” Tidak ada istilah teologis yang memerlukan penyesuaian.
