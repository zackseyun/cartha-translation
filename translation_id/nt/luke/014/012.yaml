id: LUK.14.12
reference: Luke 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: id
  text: Ia juga berkata kepada orang yang telah mengundang-Nya, “Apabila engkau mengadakan jamuan makan siang[a] atau makan malam, janganlah mengundang teman-temanmu, saudara-saudaramu, kaum kerabatmu, ataupun tetangga-tetanggamu yang kaya, jangan sampai mereka juga mengundangmu sebagai balasan[b] dan hal itu menjadi balasan bagimu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄριστον adalah santapan pada bagian awal hari, sering kali sekitar tengah hari; dalam konteks tertentu dapat diterjemahkan “sarapan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengundangmu kembali”; kata Yunani ini berarti mengundang sebagai tindakan timbal balik.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “dan hal itu menjadi balasan bagimu”.
    reason: literal_rendering
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Ia juga berkata
  rationale: Imperfek Yunani dapat menggambarkan tindakan yang sedang berlangsung, tetapi dalam narasi Indonesia bentuk sederhana “berkata” lebih alami; καὶ tetap dinyatakan dengan “juga”, sedangkan δὲ berfungsi sebagai penghubung ringan.
- source_word: τῷ κεκληκότι αὐτόν
  choice: kepada orang yang telah mengundang-Nya
  rationale: Partisipel perfektum menunjuk kepada orang yang sebelumnya telah mengundang Yesus. Ungkapan ini transparan dan tidak menambahkan tafsiran di luar teks.
- source_word: Ὅταν ποιῇς
  choice: Apabila engkau mengadakan
  rationale: Dalam gabungan dengan istilah makanan, ποιέω berarti menyelenggarakan atau mengadakan jamuan; “apabila” juga mempertahankan sifat umum atau berulang dari ὅταν.
- source_word: ἄριστον
  choice: jamuan makan siang
  rationale: ἄριστον adalah santapan pada bagian awal hari, kerap sekitar tengah hari, bukan selalu sarapan pagi dalam pengertian modern. “Jamuan makan siang” alami dalam konteks mengundang tamu.
- source_word: δεῖπνον
  choice: makan malam
  rationale: δεῖπνον menunjuk pada santapan utama yang biasanya disantap lebih kemudian; “makan malam” menjaga kontras dengan ἄριστον.
- source_word: μὴ φώνει
  choice: janganlah mengundang
  rationale: Walaupun φωνέω secara harfiah berarti memanggil, dalam konteks jamuan maknanya adalah mengundang.
- source_word: τοὺς φίλους σου
  choice: sahabat-sahabatmu
  rationale: “Sahabat” merupakan padanan modern dan jelas bagi φίλος dalam daftar hubungan sosial ini.
- source_word: τοὺς ἀδελφούς σου
  choice: saudara-saudaramu
  rationale: Bentuk Yunani secara gramatikal maskulin dan dapat berarti saudara laki-laki; bentuk ulang “saudara-saudara” dalam bahasa Indonesia tetap dapat mempertahankan kemungkinan itu tanpa memaksakan perluasan eksplisit menjadi saudara laki-laki dan perempuan.
- source_word: τοὺς συγγενεῖς σου
  choice: kaum kerabatmu
  rationale: συγγενεῖς berarti sanak keluarga atau kerabat; “kaum kerabat” jelas, alami, dan membedakannya dari ἀδελφούς.
- source_word: γείτονας πλουσίους
  choice: tetangga-tetanggamu yang kaya
  rationale: πλουσίους langsung menerangkan γείτονας. Klausa relatif terdengar alami dalam bahasa Indonesia dan mempertahankan batasan bahwa yang dimaksud ialah tetangga kaya.
- source_word: μήποτε
  choice: Jangan-jangan
  rationale: μήποτε menyatakan kemungkinan yang hendak dihindari atau diperingatkan. “Jangan-jangan” mempertahankan nuansa tersebut secara wajar dalam bahasa Indonesia.
- source_word: ἀντικαλέσωσίν σε
  choice: mereka pun mengundangmu sebagai balasan
  rationale: Kata kerja majemuk ini menyatakan tindakan mengundang kembali sebagai timbal balik; “sebagai balasan” membuat unsur resiprokalnya eksplisit.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: sehingga engkau mendapat balasannya
  rationale: Ungkapan ini secara harfiah berarti “dan hal itu menjadi balasan bagimu.” Rumusan Indonesia yang dipilih alami sambil mempertahankan gagasan bahwa undangan balik menjadi imbalan yang diterima.
theological_decisions:
- issue: Sifat larangan mengundang kelompok dekat atau kaya
  choice: Dipertahankan sebagai larangan langsung dalam perkataan Yesus tanpa diberi pembatas penafsiran di dalam teks.
  alternative: Menjelaskannya sebagai larangan hanya terhadap motif mencari imbalan atau sebagai gaya hiperbola.
  rationale: Ayat Yunani sendiri memakai imperatif negatif langsung dan mengaitkannya dengan kemungkinan balasan. Penjelasan lebih jauh mengenai cakupan etis atau retorisnya sebaiknya tidak disisipkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “engkau” dipakai untuk sapaan tunggal dalam perkataan Yesus; “-Nya” dikapitalisasi menurut kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus. Struktur daftar dan peringatan timbal balik dipertahankan.
