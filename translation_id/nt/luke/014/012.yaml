  to: Ia juga berkata kepada orang yang telah mengundang-Nya, “Apabila engkau mengadakan jamuan makan siang[a] atau makan malam, janganlah mengundang teman-temanmu, saudara-saudaramu, kaum kerabatmu, ataupun tetangga-tetanggamu yang kaya, jangan sampai mereka juga mengundangmu sebagai balasan[b] dan hal itu menjadi balasan bagimu[c].”
