id: LUK.14.15
reference: Luke 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: id
  text: Namun, ketika salah seorang yang duduk makan bersama Yesus mendengar hal-hal itu, ia berkata kepada-Nya, “Berbahagialah orang yang akan makan roti[a] dalam Kerajaan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “makan roti” dapat berarti ikut makan atau menikmati perjamuan; terjemahan ini mempertahankan gambaran harfiah dalam teks Yunani.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: ketika ... mendengar
  rationale: Partisip aoristus ini memiliki nuansa temporal; klausa dengan “ketika” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: δέ
  choice: Namun
  rationale: Menandai peralihan ringan sekaligus tanggapan terhadap perkataan Yesus sebelumnya.
- source_word: τις τῶν συνανακειμένων
  choice: salah seorang yang duduk makan bersama Yesus
  rationale: Menunjuk seorang tamu tak bernama yang sedang makan bersama Yesus. Pilihan ini mempertahankan latar perjamuan tanpa memaksakan gambaran harfiah postur bersandar yang kurang alami dalam bahasa Indonesia.
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Mempertahankan bentuk jamak yang merujuk pada perkataan Yesus sebelumnya.
- source_word: εἶπεν αὐτῷ
  choice: ia berkata kepada-Nya
  rationale: Menerjemahkan formula naratif secara langsung; huruf kapital memperjelas bahwa pronomina itu mengacu kepada Yesus.
- source_word: Μακάριος
  choice: Berbahagialah
  rationale: Ungkapan yang wajar dalam bentuk ucapan bahagia bahasa Indonesia dan tetap memuat gagasan keadaan yang berkenan atau diberkati, bukan sekadar emosi sesaat.
- source_word: ὅστις
  choice: orang yang
  rationale: Menyampaikan daya generik dari kata ganti relatif tak tentu secara alami; rujukannya tidak dibatasi pada orang tertentu.
- source_word: φάγεται ἄρτον
  choice: akan makan roti
  rationale: Bentuk mendatang dipertahankan, demikian pula citra harfiah “roti”; dalam konteks Yunani ungkapan ini juga dapat berarti ikut makan dalam suatu perjamuan.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dalam Kerajaan Allah
  rationale: Terjemahan langsung yang tidak menambahkan kata “perjamuan”, meskipun konteks makan tersirat.
theological_decisions:
- issue: Daya ucapan bahagia dari Μακάριος dalam perkataan eskatologis
  choice: Berbahagialah orang yang akan makan roti dalam Kerajaan Allah
  alternative: Diberkatilah orang yang akan makan roti dalam Kerajaan Allah
  rationale: “Berbahagialah” merupakan bentuk ucapan bahagia yang mapan dan alami dalam bahasa Indonesia. Kata ini mempertahankan bobot penilaian ilahi dalam konteks Kerajaan Allah tanpa membatasi makna pada tindakan menerima berkat tertentu.
- issue: Citra perjamuan dalam Kerajaan Allah
  choice: makan roti dalam Kerajaan Allah
  alternative: ikut makan dalam perjamuan di Kerajaan Allah
  rationale: Teks Yunani menyebut “roti” dan tidak secara eksplisit menyebut “perjamuan”. Citra konkret serta kemungkinan idiomatisnya dipertahankan, sementara penjelasan diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Duduk makan bersama” dipilih sebagai ungkapan alami untuk suasana makan bersama; nama “Yesus” dipakai untuk memperjelas anteseden yang dalam konteks Yunani dinyatakan dengan pronomina.
