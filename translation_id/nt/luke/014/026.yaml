id: LUK.14.26
reference: Luke 14:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: id
  text: “Jika seseorang datang kepada-Ku dan tidak membenci ayahnya sendiri, ibunya, istrinya, anak-anaknya, saudara laki-laki dan saudara perempuannya, bahkan hidupnya sendiri, ia tidak dapat menjadi murid-Ku.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mengasihi ... lebih daripada Aku.” Kata kerjanya secara harfiah berarti “membenci”, tetapi dalam konteks ini ungkapan tersebut menyatakan tuntutan agar kesetiaan kepada Yesus didahulukan bahkan di atas ikatan keluarga yang paling dekat; bandingkan Matius 10:37.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jiwanya sendiri” atau “nyawanya sendiri”. Di sini “hidup” mencerminkan kemungkinan besar makna ψυχή dalam konteks tuntutan pemuridan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: membenci
  rationale: Mempertahankan arti leksikal yang lugas dan daya kejut perkataan Yesus. Dalam konteks ini ungkapan tersebut menuntut kesetiaan kepada Yesus di atas ikatan terdekat; kemungkinan nuansa komparatif dijelaskan dalam catatan kaki.
- source_word: ἔρχεται πρός με
  choice: datang kepada-Ku
  rationale: Menerjemahkan frasa Yunani secara langsung dan alami tanpa menggantinya dengan ungkapan pemuridan lain seperti 'mengikut Aku'.
- source_word: πατέρα ἑαυτοῦ
  choice: ayahnya sendiri
  rationale: Kata 'sendiri' mewakili daya personal dari pronomina refleksif ἑαυτοῦ.
- source_word: γυναῖκα
  choice: istrinya
  rationale: Dalam daftar anggota rumah tangga ini, γυνή secara kontekstual berarti istri.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: saudara-saudaranya laki-laki dan perempuan
  rationale: Menyatakan secara eksplisit kedua istilah Yunani untuk saudara laki-laki dan saudara perempuan, sekaligus menjaga hubungan kepemilikan dalam daftar.
- source_word: ἔτι τε καὶ
  choice: bahkan
  rationale: Menandai peningkatan klimaks pada unsur terakhir secara wajar dalam bahasa Indonesia.
- source_word: ψυχὴν ἑαυτοῦ
  choice: nyawanya sendiri
  rationale: Dalam konteks harga pemuridan, ψυχή menunjuk pada hidup atau nyawa seseorang, bukan secara khusus pada jiwa sebagai unsur tak berjasad. 'Nyawa' juga mempertahankan tekanan pada kesediaan melepaskan hidup sendiri.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ia tidak dapat menjadi murid-Ku
  rationale: Mengungkapkan ketidakmampuan atau ketidakselarasan yang dinyatakan teks, bukan sekadar larangan.
theological_decisions:
- issue: Apakah μισεῖ perlu diperhalus menjadi ungkapan komparatif dalam teks utama
  choice: Memakai 'membenci' dalam teks utama dan menjelaskan kemungkinan makna komparatif dalam catatan kaki.
  alternative: Menerjemahkannya sebagai 'tidak mengasihi ... lebih daripada Aku' atau 'kurang mengasihi'.
  rationale: Bunyi Yunani sengaja tajam. Mempertahankan 'membenci' menjaga ketegangan perkataan itu, sedangkan catatan kaki membantu pembaca memahami tuntutan akan kesetiaan yang terutama tanpa menghapus bentuk aslinya.
- issue: Makna ψυχή dalam ayat ini
  choice: Menerjemahkannya sebagai 'nyawa'.
  alternative: Jiwa; hidup; diri.
  rationale: Konteksnya adalah harga pemuridan dan penyerahan tuntutan atas hidup sendiri. 'Nyawa' menyampaikan makna kontekstual itu tanpa menetapkan pandangan antropologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia. Struktur daftar dipertahankan, sementara pronomina disesuaikan agar alami dan jelas.
