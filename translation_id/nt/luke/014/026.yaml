    rationale: “Tidak kurang mengasihi ... daripada Aku” secara harfiah berarti keluarga tidak dikasihi lebih rendah daripada Yesus, bukan bahwa Yesus harus dikasihi melebihi keluarga. Alternatif yang sesuai ialah “tidak mengasihi ... lebih daripada Aku.”
  - severity: low
    issue: Frasa untuk saudara kandung kurang alami.
    rationale: “Saudara laki-laki dan saudara perempuannya” mempertahankan pembedaan eksplisit ἀδελφοὺς καὶ ἀδελφάς dan lebih lancar daripada “saudara-saudaranya laki-laki dan perempuan.”
