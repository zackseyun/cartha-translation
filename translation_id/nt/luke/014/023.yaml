  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: id
  text: Lalu tuan itu berkata kepada budak itu, “Keluarlah ke jalan-jalan dan pagar-pagar, lalu paksa[a] mereka untuk masuk, supaya rumahku menjadi penuh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “desaklah mereka dengan kuat agar masuk.” Kata kerja Yunani yang dipakai di sini kuat, tetapi dalam perumpamaan ini tidak harus berarti menggunakan kekerasan fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: tuan
  rationale: Dalam dunia cerita perumpamaan ini, kata tersebut menunjuk kepada pemilik rumah, bukan secara langsung menjadi gelar ilahi. “Tuan” menyampaikan peran sosial itu secara wajar.
- source_word: δοῦλον
  choice: budaknya
  rationale: δοῦλος menunjukkan orang yang berstatus terikat dan berada di bawah kuasa tuannya. “Budak” mempertahankan status tersebut lebih jelas daripada “pelayan,” sedangkan bentuk posesif sesuai dengan relasi dalam cerita.
- source_word: Ἔξελθε
  choice: Pergilah
  rationale: Konteks dan tujuan yang diperkenalkan dengan εἰς sudah menyampaikan gerakan keluar menuju tempat-tempat di luar; “pergilah” merupakan perintah yang alami dalam bahasa Indonesia.
- source_word: ὁδοὺς
  choice: jalan-jalan
  rationale: Kata ini menunjuk kepada jalur perjalanan di luar lingkungan rumah; “jalan-jalan” alami dan tidak membatasi maknanya pada jalan raya besar.
- source_word: φραγμοὺς
  choice: pagar-pagar tanaman
  rationale: φραγμός dapat berarti pagar atau pagar tanaman. Dalam pasangan dengan jalan-jalan, “pagar-pagar tanaman” menggambarkan batas-batas di daerah luar tempat orang mungkin dijumpai.
- source_word: ἀνάγκασον
  choice: paksa
  rationale: Kata kerja ini kuat dan dapat berarti memaksa atau mendesak. “Paksa” mempertahankan daya perintah Yunani, sementara catatan kaki mencegah pembaca langsung menyimpulkan penggunaan kekerasan fisik.
- source_word: εἰσελθεῖν
  choice: datang masuk
  rationale: Ungkapan ini mempertahankan gagasan masuk ke rumah dari sudut pandang tuan rumah dan terdengar wajar setelah perintah kepada budak.
- source_word: ἵνα γεμισθῇ
  choice: supaya ... penuh
  rationale: “Supaya” menyampaikan tujuan, sedangkan “penuh” secara alami mengungkapkan bentuk pasif Yunani dalam bahasa Indonesia.
- source_word: μου ὁ οἶκος
  choice: rumahku
  rationale: οἶκος di sini adalah rumah tempat perjamuan berlangsung; “rumahku” merupakan padanan langsung dan kontekstual.
theological_decisions:
- issue: Pemaknaan κύριος dalam perumpamaan
  choice: tuan
  alternative: Tuhan
  rationale: Di dalam alur perumpamaan, κύριος berfungsi sebagai sebutan bagi pemilik rumah manusia. “Tuan” tidak memaksakan gelar ilahi secara langsung, tetapi tetap membiarkan makna teologis perumpamaan muncul dari konteks.
- issue: Kekuatan ἀνάγκασον
  choice: paksa orang-orang datang masuk
  alternative: desaklah orang-orang dengan kuat agar masuk
  rationale: Teks utama mempertahankan kekuatan kata kerja Yunani dan tidak melunakkannya. Catatan kaki tetap menjaga kemungkinan bahwa dalam konteks perumpamaan tekanan yang dimaksud tidak harus berupa kekerasan fisik.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Budak” dipakai untuk mempertahankan realitas status sosial δοῦλος; “pagar-pagar tanaman” dipilih agar citra daerah pinggiran tetap konkret. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
