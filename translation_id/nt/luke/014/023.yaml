  to: Lalu tuan itu berkata kepada budak itu, “Keluarlah ke jalan-jalan dan pagar-pagar, lalu paksa[a] mereka untuk masuk, supaya rumahku menjadi penuh.”
  rationale: Revisi ini memulihkan daya arah 'keluarlah' bagi ἔξελθε, mengganti konstruksi yang tidak idiomatis dengan 'paksa mereka untuk masuk' bagi ἀνάγκασον εἰσελθεῖν, dan memakai 'pagar-pagar' agar φραγμοί tidak dibatasi hanya pada pagar tanaman. Catatan kaki tetap ditempatkan pada kata yang dijelaskan dan mempertahankan ambiguitas konteks tanpa meniadakan kekuatan kata kerja Yunani.
