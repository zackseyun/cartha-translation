  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: id
  text: 'Sebab Aku berkata kepadamu: Tidak seorang pun dari antara laki-laki itu yang telah diundang akan mencicipi perjamuan-Ku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jamuan makan-Ku”; secara tradisional, “perjamuan malam-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab Aku berkata kepadamu
  rationale: Mempertahankan fungsi γάρ sebagai penjelas dan bentuk sapaan langsung ὑμῖν. Ungkapan ini alami dan tetap dekat dengan susunan Yunani.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: Tidak seorang pun dari antara orang-orang ... itu
  rationale: οὐδείς menyatakan penyangkalan menyeluruh. Walaupun ἀνήρ secara leksikal dapat berarti laki-laki, dalam konteks para undangan dalam perumpamaan ini, 'orang-orang' merupakan ungkapan Indonesia yang alami tanpa meniadakan rujukan kepada kelompok yang disebut sebelumnya.
- source_word: τῶν κεκλημένων
  choice: yang telah diundang
  rationale: Partisipel perfek pasif menunjukkan orang-orang yang sudah menerima undangan; 'diundang' lebih tepat dalam konteks perjamuan daripada 'dipanggil'.
- source_word: γεύσεταί
  choice: akan mencicipi
  rationale: Mempertahankan citra harfiah γεύομαι, yang dalam konteks ini juga menyiratkan menikmati atau turut makan.
- source_word: μου τοῦ δείπνου
  choice: perjamuan-Ku
  rationale: δεῖπνον adalah jamuan utama, kerap pada waktu malam. Dalam konteks perumpamaan tentang jamuan besar, 'perjamuan' terdengar alami dan cukup luas; enklitik '-Ku' mempertahankan penekanan kepemilikan orang pertama.
theological_decisions:
- issue: Hubungan ucapan tuan rumah dengan makna teologis perumpamaan
  choice: Mempertahankan suara orang pertama, 'perjamuan-Ku', tanpa menjelaskan identitas tuan rumah atau makna perjamuan secara alegoris.
  alternative: Menafsirkan secara eksplisit sebagai perjamuan Allah atau keselamatan.
  rationale: Teks Yunani tetap berada dalam suara naratif perumpamaan. Terjemahan perlu mempertahankan daya dan ketegangan gambaran itu tanpa memasukkan penafsiran teologis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Huruf kapital pada 'Aku', 'kepada-Mu' tidak muncul, dan '-Ku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ujaran yang dalam konteks Injil disampaikan oleh Yesus, tanpa menambahkan identifikasi alegoris.
