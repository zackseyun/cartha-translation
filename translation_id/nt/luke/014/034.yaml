  source_fidelity: Teks utama secara umum setia pada Yunani. “Jadi,” menangkap οὖν; “garam itu baik” menangkap καλὸν τὸ ἅλας; dan “jika garam pun menjadi tawar” secara baik mencerminkan ἐὰν δὲ καὶ τὸ ἅλας μωρανθῇ. Namun, “kembali” dalam “akan diasinkan kembali” menambahkan gagasan pemulihan/restorasi yang tidak dinyatakan oleh ἀρτυθήσεται, yang hanya berarti ‘akan dibumbui/diasinkan’.
