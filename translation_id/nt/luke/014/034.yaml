  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: id
  text: Jadi, garam itu baik. Namun, jika garam pun menjadi tawar[a], dengan apakah garam itu akan diasinkan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Yunaninya dapat berarti “menjadi bodoh”; dalam konteks ini, maksudnya ialah garam menjadi hambar atau kehilangan rasanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: baik
  rationale: Menilai garam secara positif dalam arti umum; “baik” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi sekadar berguna.
- source_word: οὖν
  choice: Jadi
  rationale: Mempertahankan hubungan kesimpulan dengan ajaran sebelumnya dalam bentuk yang wajar dan mudah dipahami.
- source_word: ἅλας
  choice: garam
  rationale: Padanan harfiah yang mempertahankan gambaran peribahasa.
- source_word: ἐὰν δὲ καὶ
  choice: Namun, jika ... pun
  rationale: “Namun” menyatakan kontras, sedangkan “pun” mempertahankan penekanan bahwa bahkan garam dapat kehilangan sifat khasnya.
- source_word: μωρανθῇ
  choice: menjadi tawar
  rationale: Dalam konteks garam, verba ini secara idiomatis berarti menjadi hambar atau kehilangan rasa; “menjadi tawar” ringkas, alami, dan mempertahankan nuansa perubahan keadaan.
- source_word: ἐν τίνι
  choice: dengan apakah
  rationale: Menyatakan sarana dalam pertanyaan retoris dan tetap terdengar wajar dalam ragam bahasa yang bermartabat.
- source_word: ἀρτυθήσεται
  choice: akan diasinkan kembali
  rationale: Mempertahankan metafora kuliner dan mengungkapkan bahwa garam yang tawar perlu dibuat asin lagi, tanpa memperluasnya secara teologis menjadi “dipulihkan”.
theological_decisions:
- issue: Daya metaforis perkataan tentang garam
  choice: Mempertahankan gambaran garam secara harfiah tanpa menjelaskan penerapannya kepada kemuridan di dalam teks utama.
  alternative: Memperluas secara interpretatif, misalnya dengan menyebut murid yang kehilangan kekhasannya.
  rationale: Penerapan metafora diberikan oleh konteks sekitarnya; terjemahan sebaiknya mempertahankan ketegangan dan keterbukaan peribahasa itu.
translation_notes:
  register: Bahasa Indonesia modern standar dengan ragam yang natural dan bermartabat. Susunan “jika garam pun” mempertahankan penekanan καί, sedangkan pengulangan “garam itu” dalam pertanyaan menghindari ambiguitas rujukan.
