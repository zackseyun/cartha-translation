  terminology: “Garam,” “baik,” dan “tawar” tepat serta konsisten dengan metafora kuliner. Catatan kaki secara akurat menjelaskan arti literal μωρανθῇ (‘menjadi bodoh’) dan arti kontekstualnya.
  issues:
