  terminology: “Meninggikan dirinya,” “merendahkan dirinya,” “direndahkan,” dan “ditinggikan” merupakan pilihan istilah yang lazim, sejajar, dan tepat untuk konteks metaforis ini. “Dirinya” secara idiomatis menyampaikan fungsi generik bentuk maskulin tunggal Yunani tanpa menandai gender secara tidak wajar dalam bahasa Indonesia.
