  source_fidelity: Teks Indonesia dengan tepat menerjemahkan ὅτι sebagai alasan (“Sebab”), mempertahankan cakupan generik πᾶς, makna refleksif ἑαυτόν, serta bentuk pasif futur pada kedua verba. Pelaku pasif tidak ditambahkan, sesuai dengan teks Yunani. Kontras dan paralelisme ὑψῶν/ταπεινῶν serta ταπεινωθήσεται/ὑψωθήσεται tersampaikan dengan baik.
