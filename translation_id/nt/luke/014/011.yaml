id: LUK.14.11
reference: Luke 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: id
  text: Sebab setiap orang yang meninggikan dirinya akan direndahkan, dan orang yang merendahkan dirinya akan ditinggikan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks, kata ini memperkenalkan alasan bagi perkataan sebelumnya. “Sebab” mempertahankan fungsi penjelas tersebut dan terdengar wajar dalam bahasa Indonesia.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: setiap orang yang meninggikan dirinya
  rationale: Partisipel berartikel ini bersifat substantival dan umum. Ungkapan ini mempertahankan cakupan universal serta makna kiasan berupa peninggian diri.
- source_word: ταπεινωθήσεται
  choice: akan direndahkan
  rationale: Bentuk pasif futur dipertahankan tanpa menyebut pelakunya, sekaligus menjaga pertentangan yang sejajar dengan “akan ditinggikan”.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini mengoordinasikan kedua bagian pepatah. Pertentangannya sudah jelas dari pasangan “meninggikan/direndahkan” dan “merendahkan/ditinggikan”.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: orang yang merendahkan dirinya
  rationale: Partisipel berartikel ini menunjuk secara umum kepada siapa pun yang dengan sengaja merendahkan diri. Bentuk ini alami dan mempertahankan kesejajaran antarklausa.
- source_word: ὑψωθήσεται
  choice: akan ditinggikan
  rationale: Bentuk pasif futur dan hubungan leksikal dengan “meninggikan dirinya” dipertahankan, tanpa memperjelas pelaku yang tidak disebutkan dalam teks Yunani.
theological_decisions:
- issue: Pelaku tersirat dalam kedua bentuk pasif futur
  choice: Mempertahankan bentuk pasif tanpa menambahkan “oleh Allah”
  alternative: akan direndahkan oleh Allah; akan ditinggikan oleh Allah
  rationale: Walaupun konteks dan motif alkitabiah dapat menyiratkan tindakan Allah, teks Yunani tidak menyebutkan pelakunya. Terjemahan tidak mengubah implikasi itu menjadi pernyataan eksplisit.
- issue: Bentuk maskulin tunggal yang berfungsi generik
  choice: Menerjemahkannya secara alami sebagai “setiap orang” dan “dirinya”
  alternative: Memakai kata ganti maskulin yang ditandai secara khusus
  rationale: Dalam bahasa Indonesia, “orang” dan “dirinya” tidak menandai gender. Keduanya secara tepat menyampaikan fungsi generik bentuk Yunani tanpa mengubah cakupan universalnya atau memasukkan gender yang tidak lazim dinyatakan dalam tata bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan bernada pepatah. Kesejajaran retoris antara meninggikan/direndahkan dan merendahkan/ditinggikan dipertahankan.
