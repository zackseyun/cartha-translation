  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: id
  text: supaya jangan sampai, setelah ia meletakkan fondasi dan tidak sanggup menyelesaikannya, semua orang yang melihatnya mulai mengejeknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: supaya jangan sampai
  rationale: Ungkapan ini secara alami menyampaikan hasil buruk yang hendak dihindari, sekaligus mempertahankan nuansa kemungkinan atau kekhawatiran.
- source_word: θέντος αὐτοῦ
  choice: setelah ia meletakkan
  rationale: Genetif absolut menunjukkan tindakan yang mendahului tindakan utama; bentuk temporal ini jelas dan wajar dalam bahasa Indonesia.
- source_word: θεμέλιον
  choice: fondasi
  rationale: Dalam konteks pembangunan, 'fondasi' merupakan padanan modern dan lazim untuk dasar bangunan.
- source_word: μὴ ἰσχύοντος
  choice: tidak sanggup
  rationale: Di sini ἰσχύω menunjuk pada kemampuan untuk menuntaskan pekerjaan, bukan semata-mata kekuatan fisik.
- source_word: ἐκτελέσαι
  choice: menyelesaikannya
  rationale: Kata ini menyatakan membawa pekerjaan sampai tuntas; sufiks '-nya' secara alami merujuk pada proyek pembangunan yang telah dimulai.
- source_word: πάντες οἱ θεωροῦντες
  choice: semua orang yang melihatnya
  rationale: θεωρέω berarti melihat atau mengamati; '-nya' merujuk secara wajar pada keadaan atau bangunan yang tampak tanpa mempersempitnya secara berlebihan.
- source_word: ἄρξωνται
  choice: mulai
  rationale: Dalam konstruksi tujuan negatif ini, bentuk subjungtif menyatakan akibat yang mungkin terjadi; 'supaya jangan sampai' sudah memuat nuansa tersebut sehingga modal tambahan tidak diperlukan.
- source_word: αὐτῷ ἐμπαίζειν
  choice: mengejek dia
  rationale: Padanan ini mempertahankan arti memperolok atau mencemooh seseorang dan tetap mudah dipahami serta bermartabat.
