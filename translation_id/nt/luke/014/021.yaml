  naturalness: Bahasa draf lancar dan modern. “Keluarlah segera” lebih langsung dan alami untuk perintah mendesak daripada “Cepatlah pergi.” Frasa orang-pertama “orang-orang yang cacat anggota tubuhnya” menyampaikan makna leksikal yang lebih khusus, walaupun catatan kaki diperlukan untuk mengakui rentang makna yang lebih luas.
  terminology: “Pelayan,” “tuan,” “tuan rumah,” “jalan-jalan besar,” “gang-gang,” “orang buta,” dan “orang lumpuh” cocok dalam konteks perumpamaan ini. Untuk ἀναπείρους, terjemahan utama perlu membedakan gangguan/kerusakan anggota tubuh dari kebutaan dan kelumpuhan yang kemudian disebut tersendiri.
