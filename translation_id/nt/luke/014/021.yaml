revisions:
- from: Ketika pelayan itu kembali, ia melaporkan semuanya kepada tuannya. Lalu tuan rumah itu menjadi marah dan berkata kepada pelayannya, “Cepatlah pergi ke jalan-jalan besar dan gang-gang kota, lalu bawalah ke sini orang-orang miskin, penyandang disabilitas,[a] orang buta, dan orang lumpuh.”
  to: Ketika pelayan itu kembali, ia melaporkan semuanya kepada tuannya. Lalu tuan rumah itu menjadi marah dan berkata kepada pelayannya, “Keluarlah segera ke jalan-jalan besar dan gang-gang kota, lalu bawalah ke sini orang-orang miskin, orang-orang yang cacat anggota tubuhnya,[a] orang buta, dan orang lumpuh.”
  rationale: Revisi memperjelas gerak keluar yang terkandung dalam ἔξελθε dan mempersempit padanan ἀναπείρους agar tidak melebur dengan kategori orang buta dan orang lumpuh yang terpisah dalam teks. Catatan kaki tetap mempertahankan kemungkinan cakupan makna yang lebih luas tanpa memaksakan satu penafsiran leksikal yang diperselisihkan.
