id: LUK.14.21
reference: Luke 14:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: id
  text: Ketika pelayan itu kembali, ia melaporkan semuanya kepada tuannya. Lalu tuan rumah itu menjadi marah dan berkata kepada pelayannya, “Keluarlah segera ke jalan-jalan besar dan gang-gang kota, lalu bawalah ke sini orang-orang miskin, orang-orang yang cacat anggota tubuhnya,[a] orang buta, dan orang lumpuh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang dengan disabilitas fisik.” Kata Yunani ini dapat menunjuk kepada keterbatasan fisik secara umum atau, lebih khusus, kepada kerusakan atau cacat anggota tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: kembali
  rationale: Dalam alur cerita, pelayan itu datang kembali setelah menyampaikan undangan; “kembali” menyatakan konteks kepulangan yang tersirat secara alami.
- source_word: δοῦλος
  choice: pelayan
  rationale: Dalam konteks rumah tangga perumpamaan ini, fungsi orang tersebut sebagai bawahan dan utusan lebih menonjol; “pelayan” wajar dalam bahasa Indonesia tanpa menyangkal kemungkinan status sosial yang dicakup kata Yunani itu.
- source_word: ἀπήγγειλεν
  choice: melaporkan
  rationale: Kata ini menggambarkan penyampaian kembali informasi kepada seorang atasan.
- source_word: κύριος
  choice: tuan
  rationale: Rujukannya adalah atasan manusia dalam perumpamaan, bukan gelar ilahi; “tuan” mempertahankan hubungan kuasa tersebut.
- source_word: ταῦτα
  choice: semuanya
  rationale: Secara alami merujuk kepada semua jawaban atau alasan yang baru saja disampaikan, walaupun bentuk Yunani secara harfiah berarti “hal-hal ini”.
- source_word: ὀργισθείς
  choice: menjadi marah
  rationale: Mempertahankan nuansa ingresif partisip, yaitu kemarahan yang timbul sebagai reaksi terhadap laporan.
- source_word: οἰκοδεσπότης
  choice: tuan rumah
  rationale: Sebutan ini menunjuk kepada kepala atau penguasa rumah tangga; “tuan rumah” ringkas, alami, dan sesuai dengan latar perjamuan.
- source_word: Ἔξελθε ταχέως
  choice: Cepatlah pergi
  rationale: Menyampaikan perintah untuk bergerak keluar beserta urgensinya dalam ungkapan Indonesia yang alami.
- source_word: πλατείας
  choice: jalan-jalan besar
  rationale: Menunjuk kepada jalan yang lebar atau ruang jalan umum dan mempertahankan kontras dengan gang-gang.
- source_word: ῥύμας
  choice: gang-gang
  rationale: Menggambarkan jalan-jalan yang lebih kecil atau sempit di dalam kota.
- source_word: πτωχούς
  choice: orang-orang miskin
  rationale: Padanan substantival yang jelas dan alami.
- source_word: ἀναπείρους
  choice: penyandang disabilitas
  rationale: Istilah modern dan hormat bagi orang dengan keterbatasan fisik; catatan kaki mempertahankan kemungkinan arti yang lebih spesifik, “orang cacat anggota tubuh”.
- source_word: τυφλούς
  choice: orang buta
  rationale: Padanan langsung dan lazim.
- source_word: χωλούς
  choice: orang lumpuh
  rationale: Padanan umum bagi orang yang mengalami gangguan berjalan atau ketimpangan anggota gerak.
- source_word: εἰσάγαγε ὧδε
  choice: bawalah ke sini
  rationale: Mempertahankan gerak masuk menuju tempat sang tuan berada.
theological_decisions:
- issue: Status sosial δοῦλος dalam perumpamaan
  choice: pelayan
  alternative: budak
  rationale: Teks menonjolkan tugasnya sebagai utusan rumah tangga. “Pelayan” menjaga fokus naratif, sementara status perbudakan yang mungkin terkandung dalam istilah Yunani tidak dijadikan pokok teologis ayat ini.
- issue: κύριος dengan rujukan manusia
  choice: tuan
  alternative: Tuhan; majikan
  rationale: Rujukannya adalah pemilik atau atasan manusia di dalam perumpamaan. “Tuan” menghindari kesan bahwa kata tersebut secara langsung merupakan gelar ilahi dan tetap membedakannya secara leksikal dari οἰκοδεσπότης, meski keduanya tampil sebagai “tuan” dalam ungkapan Indonesia yang berbeda.
- issue: Cakupan ἀνάπηρος
  choice: penyandang disabilitas
  alternative: orang cacat anggota tubuh; orang buntung
  rationale: Kata Yunani dapat menunjuk secara umum kepada orang dengan keterbatasan fisik atau secara lebih khusus kepada kerusakan anggota tubuh. Terjemahan utama memakai istilah modern yang luas dan bermartabat, sedangkan kemungkinan makna yang lebih khusus dicatat tanpa dipastikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk jamak diungkapkan seperlunya untuk kejelasan. “Jalan-jalan besar dan gang-gang” mempertahankan kontras antara πλατεῖαι dan ῥῦμαι. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
