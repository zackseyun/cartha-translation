  - severity: low
    issue: Unsur gerak keluar dalam ἔξελθε kurang eksplisit dalam “Cepatlah pergi.”
    rationale: “Keluarlah segera” menerjemahkan baik ἐξ- pada verba maupun ταχέως, tanpa menambah makna.
