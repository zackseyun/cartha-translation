  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Berbondong-bondong' dipakai secara idiomatis untuk menggambarkan banyak orang yang bergerak bersama; 'Ia' menggunakan kapitalisasi penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia.
