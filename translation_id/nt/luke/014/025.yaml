  text: Συνεπορεύοντο δὲ αὐτῷ ὄχλοι πολλοί, καὶ στραφεὶς εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: id
  text: 'Sejumlah besar orang sedang berjalan bersama Yesus, dan Ia berpaling lalu berkata kepada mereka:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: menyertai Yesus dalam perjalanan
  rationale: 'Bentuk imperfek menggambarkan tindakan yang sedang berlangsung: orang banyak terus ikut menempuh perjalanan bersama Yesus. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan perjalanan serta penyertaan.'
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai peralihan naratif ringan. Dalam susunan Indonesia, nuansanya paling alami disampaikan pada awal kalimat kedua dengan 'Lalu', tanpa memberi kesan pertentangan kuat.
- source_word: αὐτῷ
  choice: Yesus
  rationale: Secara harfiah berarti 'dia/ -Nya', tetapi nama 'Yesus' dipakai agar rujukannya jelas dan kalimat Indonesia tidak canggung, tanpa mengubah referen.
- source_word: ὄχλοι πολλοί
  choice: Banyak orang berbondong-bondong
  rationale: Ungkapan Yunani menunjuk pada banyak rombongan atau kerumunan. Pilihan ini menyampaikan jumlah besar dan gerak bersama secara alami, meski bentuk jamak 'kerumunan-kerumunan' tidak dinyatakan secara harfiah.
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini mengaitkan keadaan orang banyak dengan tindakan Yesus berikutnya; 'Lalu' menyampaikan urutan naratif secara wajar.
- source_word: στραφεὶς
  choice: Ia berpaling
  rationale: Partisip aoris menyatakan tindakan yang mendahului atau menyertai perkataan berikutnya. 'Berpaling' cukup tepat tanpa menambahkan arah gerakan yang tidak dinyatakan.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan naratif baku dan alami untuk verba Yunani yang berarti mengatakan.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Frasa ini menunjukkan pihak yang disapa, yakni orang banyak, dan mempertahankan bentuk pronominal sumber.
