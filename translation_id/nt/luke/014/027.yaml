  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: id
  text: Siapa pun yang tidak memikul salibnya sendiri[a] dan datang di belakang-Ku[b] tidak dapat menjadi murid-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa salibnya sendiri” atau “menanggung salibnya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “datang mengikuti Aku.” Secara harfiah, ungkapan ini menyatakan datang “di belakang-Ku”; bandingkan ungkapan pemuridan yang umum, “mengikut Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Siapa pun yang
  rationale: Kata ganti relatif tak tentu ini menyatakan syarat umum yang berlaku bagi siapa saja; ungkapan ini alami dan mempertahankan cakupan universalnya.
- source_word: βαστάζει
  choice: memikul
  rationale: Kata ini dapat berarti membawa atau menanggung. “Memikul” cocok dengan gambaran konkret membawa salib sekaligus tetap membuka makna kiasan tentang harga pemuridan.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: salibnya sendiri
  rationale: “Salib” adalah padanan baku bagi σταυρός dan mempertahankan bayangan alat hukuman mati, kehinaan, serta harga pemuridan. “-nya sendiri” mempertahankan penekanan refleksif bentuk tunggal tanpa memasukkan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: ἔρχεται ὀπίσω μου
  choice: datang mengikuti Aku
  rationale: Ungkapan ini mempertahankan unsur gerak dalam ἔρχεται dan menyampaikan hubungan berada di belakang Yesus sebagai pengikut. Catatan kaki mencantumkan bentuk yang lebih harfiah agar citra aslinya tetap terlihat.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: tidak dapat menjadi murid-Ku
  rationale: Susunan ini menyatakan ketidakmampuan atau ketidakcocokan, bukan sekadar larangan. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan daya tegas pernyataan tersebut.
- source_word: μαθητής
  choice: murid
  rationale: “Murid” merupakan padanan baku dalam konteks Injil dan mencakup gagasan orang yang belajar serta mengikut seorang guru.
theological_decisions:
- issue: Daya generik kata ganti refleksif tunggal ἑαυτοῦ
  choice: Menggunakan “salibnya sendiri”
  alternative: “salib mereka sendiri” atau bentuk yang menyebut gender tertentu
  rationale: Bahasa Indonesia dapat mempertahankan bentuk tunggal dan penekanan refleksif tanpa menentukan gender. Dengan demikian, daya universal “siapa pun” tetap jelas dan bentuk sumber tidak perlu dijamakkan.
- issue: Hubungan antara citra spasial dan makna pemuridan dalam ἔρχεται ὀπίσω μου
  choice: Menggunakan “datang mengikuti Aku” dengan catatan harfiah
  alternative: “datang di belakang-Ku” atau hanya “mengikut Aku”
  rationale: Pilihan ini mempertahankan unsur datang/gerak sekaligus terdengar alami sebagai bahasa pemuridan, tanpa menghapus citra harfiah yang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pada “Aku” dan akhiran “-Ku” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
