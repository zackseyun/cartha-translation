  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: id
  text: Sebab, siapakah di antara kalian yang hendak membangun sebuah menara tidak terlebih dahulu duduk dan menghitung biayanya, apakah ia memiliki cukup dana untuk menyelesaikannya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “apakah ia mempunyai untuk penyelesaian.” Maksudnya ialah apakah ia memiliki sumber daya yang cukup untuk menyelesaikan pembangunan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Sebab, siapakah di antara kalian
  rationale: Bentuk ini mempertahankan hubungan γάρ dengan ajaran sebelumnya dan menyampaikan pertanyaan retoris yang ditujukan langsung kepada para pendengar.
- source_word: θέλων
  choice: yang hendak
  rationale: Hendak secara alami menyatakan niat orang tersebut dalam konteks merencanakan pembangunan.
- source_word: πύργον οἰκοδομῆσαι
  choice: membangun sebuah menara
  rationale: Terjemahan langsung dan wajar yang mempertahankan gambaran konkret dalam teks sumber.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: tidak terlebih dahulu duduk
  rationale: Pertanyaan negatif mempertahankan daya retoris yang mengharapkan jawaban positif, sedangkan terlebih dahulu menyatakan urutan tindakan.
- source_word: ψηφίζει τὴν δαπάνην
  choice: menghitung biayanya
  rationale: Menghitung biaya merupakan ungkapan Indonesia yang alami untuk memperkirakan seluruh pengeluaran proyek.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: untuk melihat apakah ia memiliki cukup dana untuk menyelesaikannya
  rationale: Ungkapan ini menyampaikan maksud idiomatis bahwa orang itu memeriksa apakah sumber dayanya memadai sampai pembangunan selesai; unsur melihat dijadikan eksplisit agar hubungan dengan perhitungan biaya jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “kalian” dipakai untuk menandai bentuk jamak ὑμῶν secara jelas. Struktur pertanyaan retoris dan gambaran menara dipertahankan.
