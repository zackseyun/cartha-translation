  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: id
  text: Lalu hamba itu berkata, “Tuan, apa yang Tuan perintahkan sudah dilaksanakan, dan masih ada tempat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: hamba
  rationale: Dalam latar rumah tangga pada perumpamaan ini, “hamba” secara alami menyatakan orang yang berada di bawah wewenang tuannya dan tetap mencerminkan kuatnya hubungan pengabdian dalam δοῦλος.
- source_word: Κύριε
  choice: Tuan
  rationale: Bentuk vokatif ini ditujukan kepada kepala rumah dalam perumpamaan, bukan secara eksplisit sebagai gelar ilahi. “Tuan” paling alami dalam dialog bahasa Indonesia dan mempertahankan hubungan tuan-hamba.
- source_word: γέγονεν
  choice: sudah dilaksanakan
  rationale: Bentuk perfek γίνομαι menyatakan bahwa perintah tersebut telah dituntaskan dengan hasil yang masih berlaku. Dalam kaitannya dengan ὃ ἐπέταξας, “sudah dilaksanakan” terdengar alami dan tepat.
- source_word: ὃ ἐπέταξας
  choice: apa yang Tuan perintahkan
  rationale: Frasa ini merujuk pada isi instruksi sebelumnya dan mempertahankan daya kewenangan verba ἐπιτάσσω.
- source_word: ἔτι
  choice: masih
  rationale: “Masih” secara alami menunjukkan bahwa tempat tetap tersedia setelah perintah dilaksanakan.
- source_word: τόπος
  choice: tempat
  rationale: Dalam konteks perjamuan, τόπος menunjuk pada tempat atau kapasitas yang masih tersedia. “Tempat” jelas dan idiomatis dalam bahasa Indonesia.
- source_word: καί (sebelum ἔτι τόπος ἐστίν)
  choice: tetapi
  rationale: Walaupun secara leksikal berarti “dan”, dalam konteks ini konjungsi tersebut menghubungkan pelaksanaan undangan dengan kenyataan kontras bahwa tempat masih tersedia; “tetapi” menyampaikan hubungan wacana itu secara alami.
theological_decisions:
- issue: Sapaan κύριε kepada kepala rumah
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks langsungnya adalah dialog antara hamba dan kepala rumah dalam sebuah perumpamaan. “Tuan” menjaga makna sosial κύριε tanpa mengharuskan pembaca memahami sapaan itu sebagai gelar ilahi, meskipun perumpamaan dapat memiliki makna teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi “Tuan” dipakai dalam sapaan langsung. Susunan kalimat mempertahankan urutan laporan hamba dalam teks Yunani.
