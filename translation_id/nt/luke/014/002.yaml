id: LUK.14.2
reference: Luke 14:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνθρωπός τις ἦν ὑδρωπικὸς ἔμπροσθεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: id
  text: Dan lihatlah, ada seorang yang menderita edema[a] di hadapan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menderita busung air.” Istilah Yunani ini menunjuk kepada orang yang mengalami pembengkakan karena penumpukan cairan dalam tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan hubungan naratif tanpa menambahkan nuansa waktu yang tidak dinyatakan oleh konjungsi Yunani.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Menyampaikan fungsi penarik perhatian secara jelas dan wajar dalam bahasa Indonesia modern, sekaligus mempertahankan kejelasan dramatis narasi Lukas.
- source_word: ἄνθρωπός τις
  choice: ada seorang
  rationale: Menyatakan keberadaan seorang laki-laki tertentu yang tidak disebutkan namanya; susunan ini lebih alami daripada 'seorang tertentu' dalam bahasa Indonesia.
- source_word: ἦν
  choice: ada
  rationale: Dalam konstruksi Indonesia, 'ada seorang ... di hadapan-Nya' secara alami menyampaikan bentuk imperfek εἰμί tanpa memaksakan padanan harfiah 'adalah'.
- source_word: ὑδρωπικὸς
  choice: yang menderita edema
  rationale: Adjektiva ini menunjuk kepada orang yang mengalami pembengkakan akibat penumpukan cairan. 'Menderita edema' akurat, mutakhir, dan lebih mudah dipahami daripada istilah lama 'busung air' sebagai teks utama.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: di hadapan-Nya
  rationale: Mempertahankan kemungkinan makna posisi ruang maupun keberadaan dalam hadirat Yesus. Huruf kapital memperjelas bahwa pronomina itu merujuk kepada Yesus menurut konteks.
theological_decisions:
- issue: Rujukan αὐτοῦ
  choice: -Nya, merujuk kepada Yesus
  alternative: -nya tanpa kapital
  rationale: Konteks langsung mengidentifikasi Yesus sebagai rujukannya. Kapitalisasi mengikuti kebiasaan hormat dalam penerbitan Alkitab bahasa Indonesia dan tidak mengubah isi teologis ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Penanda perhatian ἰδοὺ dipertahankan sebagai 'lihatlah'; istilah medis 'edema' dijelaskan melalui alternatif yang lebih umum dalam catatan kaki.
