id: LUK.14.10
reference: Luke 14:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: id
  text: Namun, apabila kamu diundang, pergilah dan ambillah tempat yang paling rendah[a]. Dengan demikian, ketika orang yang mengundangmu datang, ia akan berkata kepadamu, ‘Sahabat, pindahlah ke tempat yang lebih tinggi[b].’ Maka kamu akan mendapat kehormatan di hadapan semua orang yang makan bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaringlah di tempat yang paling rendah.” Pada masa itu orang biasanya makan dalam posisi berbaring di sisi meja.
    reason: Menjelaskan makna khusus ἀνάπεσε dan latar budaya perjamuan tanpa membuat teks utama terasa janggal dalam bahasa Indonesia modern.
  - marker: b
    text: Secara harfiah, “naiklah lebih tinggi.”
    reason: Mempertahankan ungkapan arah dalam bahasa Yunani sebagai alternatif yang lebih harfiah.
lexical_decisions:
- source_word: κληθῇς
  choice: kamu diundang
  rationale: Dalam konteks perjamuan, καλέω berarti mengundang, bukan sekadar memanggil.
- source_word: πορευθεὶς ἀνάπεσε
  choice: pergilah dan ambillah tempat
  rationale: Partisipel πορευθείς menyertai imperatif utama dan wajar diterjemahkan sebagai dua tindakan berurutan. Ungkapan 'ambillah tempat' menyampaikan tindakan menempati posisi makan secara alami dalam bahasa Indonesia.
- source_word: ἔσχατον τόπον
  choice: tempat yang paling rendah
  rationale: ἔσχατος menunjuk pada posisi dengan kehormatan paling rendah dalam tata tempat perjamuan; terjemahan ini mempertahankan gambaran tingkatan sosial.
- source_word: ὁ κεκληκώς σε
  choice: orang yang mengundangmu
  rationale: Terjemahan ini transparan terhadap partisipel Yunani dan tidak menggantinya dengan istilah yang sedikit lebih interpretatif seperti 'tuan rumah'.
- source_word: Φίλε
  choice: Sahabat
  rationale: Sapaan ini mempertahankan nada ramah dan sopan tanpa menambahkan unsur kepunyaan yang tidak terdapat dalam teks.
- source_word: προσανάβηθι ἀνώτερον
  choice: pindahlah ke tempat yang lebih tinggi
  rationale: Ungkapan ini merujuk pada perpindahan ke posisi yang lebih terhormat; pilihan ini alami sekaligus mempertahankan citra naik.
- source_word: δόξα
  choice: kehormatan
  rationale: Dalam konteks sosial ini, δόξα berarti penghormatan atau penghargaan di depan umum, bukan terutama kemuliaan ilahi.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: di hadapan semua orang yang makan bersamamu
  rationale: Pilihan ini mempertahankan sifat publik dari kehormatan tersebut dan menyampaikan konteks perjamuan secara wajar, tanpa mengharuskan pembaca memahami kebiasaan makan sambil berbaring.
theological_decisions:
- issue: Sifat ajaran dalam perkataan ini
  choice: Menerjemahkannya sebagai petunjuk dalam ajaran perumpamaan tentang kerendahan hati dan kehormatan, tanpa mempersempitnya menjadi nasihat tata krama semata atau pahala eskatologis semata.
  alternative: Menafsirkannya hanya sebagai etiket perjamuan, atau secara eksklusif sebagai gambaran pahala pada akhir zaman.
  rationale: Teks memakai suasana perjamuan dan pembalikan kedudukan untuk mengajarkan kerendahan hati, tetapi ayat ini sendiri tidak memaksa salah satu pembacaan tersebut secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Sapaan 'Sahabat' menjaga martabat dan keramahan. 'Orang yang makan bersamamu' dipilih daripada gambaran harfiah 'berbaring bersamamu' agar tidak menimbulkan salah pengertian, sedangkan latar budaya dipertahankan dalam catatan kaki.
