  to: Apabila seseorang mengundangmu ke pesta pernikahan,[a] janganlah mengambil tempat paling terhormat,[b] jangan-jangan orang yang lebih terhormat daripadamu telah diundang olehnya.
  rationale: Revisi menyatakan sifat superlatif dari tempat utama di meja dan mengganti penghubung kausal-kemungkinan dengan peringatan "jangan-jangan," yang secara alami menyampaikan μήποτε. Klausa pasif "telah diundang olehnya" mempertahankan relasi undangan yang telah terjadi serta rujukan kepada orang yang mula-mula mengundang.
