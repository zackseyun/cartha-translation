  - severity: low
    issue: Klausa "sebab mungkin ia telah mengundang..." memakai rujukan pronominal yang kurang eksplisit dan "sebab mungkin" kurang idiomatis sebagai peringatan.
    rationale: μήποτε memperingatkan tentang kemungkinan yang perlu dihindari. "Jangan-jangan ... telah diundang olehnya" mempertahankan kemungkinan itu, memperjelas pelaku undangan, dan lebih alami.
