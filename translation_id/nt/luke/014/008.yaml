  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: id
  text: Apabila seseorang mengundangmu ke pesta pernikahan,[a] janganlah mengambil tempat paling terhormat,[b] jangan-jangan orang yang lebih terhormat daripadamu telah diundang olehnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke sebuah pernikahan.” Bentuk jamak dalam bahasa Yunani dapat menunjuk pada perayaan pernikahan, khususnya jamuannya.
    reason: lexical_alternative
  - marker: b
    text: Yaitu, tempat yang paling terhormat di meja. Dalam jamuan resmi pada zaman itu, para tamu biasanya makan sambil berbaring, bukan duduk tegak.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Apabila seseorang mengundangmu
  rationale: Mengungkapkan keadaan umum yang bersyarat secara alami dalam bahasa Indonesia; bentuk pasif Yunani dialihkan menjadi aktif tanpa mengubah pelaku yang tak tentu.
- source_word: εἰς γάμους
  choice: ke pesta pernikahan
  rationale: Bentuk jamak Yunani dapat menunjuk pada rangkaian perayaan pernikahan, khususnya jamuan yang menjadi latar ayat ini.
- source_word: μὴ κατακλιθῇς
  choice: janganlah mengambil tempat
  rationale: Dalam budaya jamuan kuno kata ini secara harfiah berarti berbaring untuk makan, tetapi ungkapan ini menyampaikan tindakan menempatkan diri di meja secara wajar dalam bahasa Indonesia; latar budaya dijelaskan dalam catatan.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: tempat kehormatan
  rationale: Menunjuk pada tempat utama dengan status kehormatan tertinggi dalam sebuah jamuan.
- source_word: μήποτε
  choice: sebab mungkin
  rationale: Mempertahankan unsur kemungkinan dan alasan yang mendasari larangan, tanpa menyatakan akibat itu sebagai kepastian.
- source_word: ἐντιμότερός σου
  choice: orang yang lebih terhormat daripadamu
  rationale: Menjaga perbandingan status atau kehormatan yang dinyatakan oleh bentuk komparatif Yunani.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: ia telah mengundang
  rationale: Menyampaikan undangan yang sudah diberikan dan masih relevan; pronomina merujuk kembali kepada orang yang mengundang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang santun dan mudah dipahami. Bentuk aktif pada klausa undangan dipilih demi keluwesan, sedangkan nuansa jamuan kuno dipertahankan melalui catatan kaki.
