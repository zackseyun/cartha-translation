  text: And they were not able to reply to these things[a].
translation:
  language: id
  text: Mereka tidak sanggup menanggapi hal-hal itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberikan jawaban atas hal-hal itu” atau “menanggapi semua itu.” Dalam bahasa Yunani, ungkapan ini berbentuk jamak, secara harfiah “hal-hal itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya sudah jelas tanpa kata penghubung; menambahkan “dan” akan terasa kurang alami pada awal kalimat ini.
- source_word: οὐκ ἴσχυσαν
  choice: tidak sanggup
  rationale: Ungkapan ini menyatakan ketidakmampuan, bukan kekurangan kekuatan fisik. “Tidak sanggup” alami dan tetap mempertahankan tekanan pada ketidakmampuan mereka.
- source_word: ἀνταποκριθῆναι
  choice: menjawab
  rationale: Dalam konteks percakapan, kata ini berarti memberikan jawaban atau tanggapan balik. “Menjawab” jelas dan tidak menyiratkan sikap membantah dengan kurang ajar.
- source_word: πρὸς ταῦτα
  choice: hal-hal itu
  rationale: Pilihan ini mempertahankan bentuk jamak ταῦτα, sambil menyampaikan makna tanggapan terhadap apa yang baru saja dikatakan atau dilakukan.
