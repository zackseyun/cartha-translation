id: LUK.14.17
reference: Luke 14:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: id
  text: Ketika waktu perjamuan tiba, ia mengutus hambanya untuk berkata kepada orang-orang yang telah diundang, “Datanglah, sebab semuanya sudah siap.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: menyuruh
  rationale: Dalam konteks pengutusan seorang hamba untuk menyampaikan pesan, 'menyuruh' secara alami mencakup tindakan mengutus dengan suatu tugas; 'mengutus' juga mungkin, tetapi terdengar lebih resmi dalam bahasa Indonesia.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: hambanya
  rationale: '''Hamba'' mempertahankan hubungan ketergantungan dalam rumah tangga kuno sekaligus sesuai dengan fungsi tokoh sebagai pembawa pesan. ''Budaknya'' lebih tegas menandai status hukum, tetapi dapat mengalihkan perhatian dalam konteks perumpamaan ini.'
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: ketika tiba waktu perjamuan
  rationale: Frasa ini menunjuk waktu yang telah ditetapkan untuk jamuan. 'Perjamuan' sesuai dengan konteks pesta makan besar, sedangkan 'makan malam' terlalu mudah dipahami sebagai santapan keluarga biasa.
- source_word: εἰπεῖν τοῖς κεκλημένοις
  choice: mengatakan kepada orang-orang yang telah diundang
  rationale: Infinitif menyatakan tujuan pengutusan, dan bentuk partisip perfek pasif menunjukkan bahwa undangan telah diberikan sebelumnya.
- source_word: Ἔρχεσθε
  choice: Datanglah
  rationale: Imperatif ini merupakan panggilan langsung. 'Datanglah' alami dan mempertahankan daya perintah tanpa menambahkan unsur waktu yang tidak dinyatakan.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi panggilan tersebut. 'Sebab' jelas, ringkas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἤδη
  choice: sudah
  rationale: '''Sudah'' secara alami menyatakan bahwa persiapan telah selesai pada saat itu.'
- source_word: ἕτοιμά ἐστιν
  choice: semuanya sudah siap
  rationale: Adjektiva netral jamak dengan verba tunggal dipakai secara kolektif dan subjeknya tersirat. Bahasa Indonesia secara idiomatis mengungkapkannya sebagai 'semuanya sudah siap', yakni seluruh keperluan perjamuan telah tersedia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan dan keadaan undangan sebelumnya.
