review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the appointed time of the meal, the prior invitation, the summons, and the collective sense of ἕτοιμά ἐστιν. However, “menyuruh” primarily means commanding someone to act, whereas ἀπέστειλεν explicitly states that he sent the servant. The purpose infinitive can be retained with “untuk berkata.”
  naturalness: The Indonesian is generally natural and appropriately dignified. “Ketika waktu perjamuan tiba” is fluent, and “semuanya sudah siap” idiomatically represents the implicit collective neuter-plural subject.
  terminology: “Hamba” is a defensible rendering of δοῦλος in this parabolic household context, retaining the dependent household role without importing a doctrinal interpretation. “Perjamuan” appropriately fits δείπνον in the context of a large meal.
  issues:
  - severity: medium
    issue: “menyuruh hambanya mengatakan” does not explicitly render ἀπέστειλεν.
    rationale: The Greek says that he sent his servant; “menyuruh” can imply merely ordering the servant rather than dispatching him. Replacing it with “mengutus” preserves the stated action and still reads naturally in standard Indonesian.
  revised_text: Ketika waktu perjamuan tiba, ia mengutus hambanya untuk berkata kepada orang-orang yang telah diundang, “Datanglah, sebab semuanya sudah siap.”
