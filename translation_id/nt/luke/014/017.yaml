- from: Ketika tiba waktu perjamuan, ia menyuruh hambanya mengatakan kepada orang-orang yang telah diundang, “Datanglah, sebab semuanya sudah siap.”
  to: Ketika waktu perjamuan tiba, ia mengutus hambanya untuk berkata kepada orang-orang yang telah diundang, “Datanglah, sebab semuanya sudah siap.”
  rationale: The revision changes only the verb governing the servant, from “menyuruh” to “mengutus,” in order to represent ἀπέστειλεν directly. All other wording faithfully and naturally conveys the Greek, including the prior completed invitation and the implicit collective subject of “sudah siap.”
