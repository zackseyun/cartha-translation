id: LUK.14.14
reference: Luke 14:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: id
  text: Dan kamu akan berbahagia, karena mereka tidak mampu membalas kebaikanmu; sebab kamu akan mendapat balasan pada kebangkitan orang-orang benar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: berbahagia
  rationale: Dalam ucapan bahagia Yesus, 'berbahagia' menyatakan keadaan yang diperkenan dan diberkati Allah, bukan sekadar perasaan senang; ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἔσῃ
  choice: kamu akan
  rationale: Bentuk mendatang dari εἰμί dipadukan secara alami dengan predikat 'berbahagia'.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi keadaan berbahagia tersebut.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: mereka tidak mampu membalas kebaikanmu
  rationale: Secara idiomatis, konstruksi ini menyatakan bahwa mereka tidak mempunyai kemampuan atau sarana untuk memberikan balasan. 'Membalas kebaikanmu' memperjelas bahwa yang dimaksud bukan pembalasan buruk.
- source_word: ἀνταποδοθήσεται ... σοι
  choice: kamu akan mendapat balasan
  rationale: Ungkapan ini menyampaikan bentuk pasif mendatang secara alami sekaligus mempertahankan kaitan timbal balik dengan tindakan membalas pada klausa sebelumnya.
- source_word: γάρ
  choice: sebab
  rationale: '''Sebab'' secara alami memperkenalkan dasar penjelasan bagi pernyataan sebelumnya.'
- source_word: ἐν τῇ ἀναστάσει
  choice: pada kebangkitan
  rationale: Preposisi ἐν digunakan secara temporal; 'pada' merupakan padanan Indonesia yang alami untuk waktu terjadinya balasan.
- source_word: τῶν δικαίων
  choice: orang-orang benar
  rationale: Bentuk ini jelas menyatakan kelompok manusia yang dicirikan sebagai benar tanpa menambahkan rincian tentang skema kebangkitan.
theological_decisions:
- issue: Makna 'kebangkitan orang-orang benar'
  choice: Diterjemahkan langsung sebagai kebangkitan mendatang yang berkaitan dengan orang-orang benar.
  alternative: Kebangkitan umum dengan penekanan pada orang benar, atau kebangkitan tersendiri bagi orang benar.
  rationale: Ayat ini menghubungkan balasan ilahi dengan kebangkitan orang-orang benar, tetapi tidak menetapkan urutan atau struktur seluruh peristiwa kebangkitan. Terjemahan mempertahankan ketegangan tersebut.
- issue: Sumber balasan
  choice: Tidak menambahkan subjek 'Allah' dalam teks utama.
  alternative: Allah akan membalas kebaikanmu.
  rationale: Bentuk pasif Yunani tidak menyebut pelaku secara eksplisit. Konteks mengisyaratkan balasan ilahi, tetapi terjemahan tidak perlu membuat yang tersirat menjadi tersurat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan tunggal dipertahankan dengan 'kamu'. 'Berbahagia' dipilih dalam corak ucapan bahagia, sedangkan 'mendapat balasan' menghindari kesan negatif yang dapat timbul dari verba 'dibalas' jika berdiri sendiri.
