  source_fidelity: 'Teks Indonesia dengan setia mencerminkan urutan dan hubungan kausal Yunani: keadaan berbahagia, ketidakmampuan penerima untuk membalas, dan balasan mendatang pada kebangkitan orang-orang benar. “Tidak mampu membalas kebaikanmu” menyampaikan idiom οὐκ ἔχουσιν ... ἀνταποδοῦναί σοι sebagai ketidakmampuan, bukan ketiadaan kewajiban. “Kamu akan mendapat balasan” secara alami menyampaikan pasif futurum tanpa menambahkan pelaku ilahi secara eksplisit.'
