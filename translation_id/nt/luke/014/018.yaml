  - severity: medium
    issue: “Anggaplah aku sudah meminta diri” tidak alami dan kurang jelas untuk ἔχε με παρῃτημένον.
    rationale: Ungkapan Yunani meminta tuan rumah menerima pembicara sebagai orang yang dimaafkan/diberi izin tidak hadir. Formula “maafkanlah aku” menyampaikan fungsi tutur tersebut dengan jelas dan lazim.
