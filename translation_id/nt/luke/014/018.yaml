  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: id
  text: Namun, mereka semua serentak mulai mengemukakan alasan untuk menolak.[a] Orang pertama berkata kepadanya, ‘Aku telah membeli sebidang tanah dan harus pergi untuk melihatnya. Aku mohon kepadamu, maafkanlah aku.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai membuat alasan.” Kata kerja Yunani ini dapat berarti menolak undangan dengan mengemukakan alasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: mulai meminta diri
  rationale: Bentuk ini menyatakan awal tindakan menolak undangan secara sopan, sebagaimana diperjelas oleh alasan-alasan sesudahnya. ‘Meminta diri’ alami dalam bahasa Indonesia dan dapat menyampaikan penolakan tanpa menambahkan penilaian bahwa alasannya dibuat-buat.
- source_word: ἀπὸ μιᾶς
  choice: serentak
  rationale: Ungkapan idiomatis ini berarti bertindak bersama-sama atau dengan tanggapan yang sama; ‘serentak’ mempertahankan daya kolektifnya secara ringkas.
- source_word: πάντες
  choice: mereka semua
  rationale: Menyatakan secara eksplisit cakupan menyeluruh yang ditekankan oleh πάντες.
- source_word: Ἀγρόν
  choice: sebidang tanah
  rationale: ἀγρός dapat menunjuk pada ladang atau bidang tanah. Dalam konteks transaksi pembelian, ‘sebidang tanah’ tepat tanpa secara tidak perlu menyiratkan bahwa tanah itu sudah diusahakan.
- source_word: ἠγόρασα
  choice: aku telah membeli
  rationale: Bentuk perfektum Indonesia menyampaikan pembelian yang telah selesai dan masih relevan dengan alasan yang diajukan.
- source_word: ἔχω ἀνάγκην
  choice: harus
  rationale: Ungkapan ini menyatakan keharusan. ‘Harus’ jelas, alami, dan mempertahankan kuatnya klaim pembicara.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: pergi melihatnya
  rationale: Menyampaikan tindakan penyerta atau tujuan secara alami tanpa memperkuat ἰδεῖν menjadi ‘memeriksa’.
- source_word: ἐρωτῶ σε
  choice: aku mohon kepadamu
  rationale: Dalam permintaan sopan ini, ‘mohon’ menyampaikan daya pragmatis ἐρωτῶ dengan tetap mempertahankan objek eksplisit ‘kepadamu’.
- source_word: ἔχε με παρῃτημένον
  choice: anggaplah aku sudah meminta diri
  rationale: Ungkapan ini meminta tuan rumah menerima penolakannya sebagai keadaan yang sudah berlaku. Terjemahan tersebut mempertahankan hasil dari partisipel perfektum dan berkaitan secara leksikal dengan παραιτεῖσθαι sebelumnya.
- source_word: καὶ
  choice: Namun
  rationale: Walaupun καί pada dasarnya menghubungkan kalimat, konteks menunjukkan peralihan yang berlawanan dari undangan kepada penolakan; ‘Namun’ menyatakannya secara alami.
- source_word: ὁ πρῶτος
  choice: orang yang pertama
  rationale: Menerjemahkan ordinal substantival dengan jelas dan memperkenalkan alasan pertama dalam rangkaian.
