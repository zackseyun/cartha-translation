  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan orang pertama ‘aku’ sesuai dengan dialog perumpamaan. Ambiguitas mengenai ketulusan alasan tidak diputuskan dalam teks utama; catatan kaki menjelaskan cakupan kata kerja Yunani.
