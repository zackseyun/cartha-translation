  to: Namun, mereka semua serentak mulai mengemukakan alasan untuk menolak.[a] Orang pertama berkata kepadanya, ‘Aku telah membeli sebidang tanah dan harus pergi untuk melihatnya. Aku mohon kepadamu, maafkanlah aku.’
