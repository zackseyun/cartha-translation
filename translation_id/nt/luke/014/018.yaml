  source_fidelity: Revisi diperlukan karena “meminta diri” terutama berarti berpamitan atau meninggalkan suatu pertemuan dalam pemakaian Indonesia modern, sedangkan παραιτεῖσθαι di sini berarti menolak undangan dengan mengajukan alasan. Pada permohonan penutup, “anggaplah aku sudah meminta diri” juga terdengar tidak lazim dan tidak menyampaikan secara jelas permintaan agar penolakan itu diterima.
  naturalness: “Mereka semua serentak” dan dialog dengan “aku” alami dalam bahasa Indonesia baku. “Mulai mengemukakan alasan untuk menolak” secara idiomatis menyatakan tindakan yang dimulai, tanpa memutuskan apakah alasan-alasan itu tulus atau hanya dalih. “Maafkanlah aku” merupakan formula sopan yang lazim untuk memohon dimaafkan/dianggap berhalangan dalam konteks penolakan undangan.
  terminology: “Sebidang tanah” cocok untuk ἀγρός dan tidak mempersempit maknanya menjadi ladang yang telah diusahakan. “Harus pergi untuk melihatnya” mempertahankan unsur keharusan serta tindakan pergi dan melihat. Tidak ada istilah teologis khusus dalam ayat ini.
