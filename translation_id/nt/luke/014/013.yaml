  source_fidelity: Teks dengan tepat mempertahankan kontras ἀλλά, nilai iteratif/tak tentu ὅταν melalui “setiap kali”, idiom δοχὴν ποιῇς, dan perintah κάλει. Keempat kelompok dalam daftar Yunani dipertahankan secara terpisah. “Penyandang disabilitas” adalah padanan modern yang sedikit lebih luas daripada ἀναπείρους, tetapi catatan kaki dengan tepat membatasi maknanya pada gangguan jasmani/anggota tubuh; pembedaan dari χωλούς (“orang lumpuh”) tetap jelas.
