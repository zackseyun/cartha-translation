id: LUK.14.13
reference: Luke 14:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: id
  text: Tetapi setiap kali kamu mengadakan jamuan[a], undanglah orang miskin, penyandang disabilitas[b], orang lumpuh, dan orang buta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perjamuan”, “pesta”, atau “acara penerimaan tamu”.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani menunjuk kepada orang yang memiliki keterbatasan jasmani atau anggota tubuh yang tidak berfungsi sebagaimana mestinya; secara tradisional juga diterjemahkan “orang cacat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Tetapi
  rationale: Kata penghubung ini menyatakan pertentangan dengan petunjuk sebelumnya tentang siapa yang tidak perlu diundang; “Tetapi” merupakan padanan yang ringkas dan wajar.
- source_word: ὅταν
  choice: setiap kali
  rationale: Bersama bentuk subjungtif, kata ini menunjuk pada waktu yang tidak tertentu dan dapat berulang, bukan hanya satu peristiwa tertentu.
- source_word: δοχὴν ποιῇς
  choice: kamu mengadakan jamuan
  rationale: Ungkapan Yunani ini berarti menyelenggarakan jamuan atau penerimaan. “Mengadakan jamuan” alami dalam bahasa Indonesia dan cukup luas untuk konteks keramahtamahan.
- source_word: κάλει
  choice: undanglah
  rationale: Dalam konteks jamuan, καλέω berarti mengundang, dan bentuknya adalah perintah.
- source_word: πτωχούς
  choice: orang miskin
  rationale: Kata sifat yang dipakai sebagai kata benda ini menunjuk kepada orang-orang miskin. Bentuk ini jelas, alami, dan menghormati pribadi yang dimaksud.
- source_word: ἀναπείρους
  choice: penyandang disabilitas
  rationale: Istilah ini menunjuk kepada orang dengan keterbatasan atau kerusakan jasmani. Pilihan modern ini menghindari sebutan yang merendahkan, sementara catatan kaki menjelaskan cakupan istilah sumber.
- source_word: χωλούς
  choice: orang lumpuh
  rationale: Istilah ini secara khusus menunjuk kepada orang yang mengalami gangguan berjalan. “Orang lumpuh” mempertahankan pembedaan dari istilah yang lebih luas sebelumnya.
- source_word: τυφλούς
  choice: orang buta
  rationale: Padanan langsung dan mudah dipahami bagi kata yang menunjuk kepada orang yang tidak dapat melihat.
theological_decisions:
- issue: Penyajian kelompok-kelompok dengan keterbatasan fisik secara setia dan bermartabat
  choice: Memakai “penyandang disabilitas” dan “orang lumpuh” sebagai dua unsur tersendiri dalam daftar.
  alternative: Memakai istilah tradisional seperti “orang cacat” dan “orang timpang”, atau melebur keduanya menjadi satu kelompok umum.
  rationale: Teks Yunani menyebut dua kelompok yang berbeda, yakni ἀναπείρους dan χωλούς. Terjemahan mempertahankan struktur dan ketegangan leksikal daftar itu tanpa memakai bahasa yang tidak perlu merendahkan atau menyatukan dua istilah sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan “orang” dan pemakaian “penyandang disabilitas” menjaga kejelasan serta menghindari pelabelan yang terasa merendahkan, sedangkan susunan daftar Yunani tetap dipertahankan.
