id: LUK.14.1
reference: Luke 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: id
  text: Pada suatu hari Sabat, ketika Yesus masuk ke rumah salah seorang pemimpin orang Farisi untuk makan, mereka terus mengamati-Nya dengan saksama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka terus mengawasi-Nya dengan ketat.” Kata Yunaninya dapat menyiratkan pengamatan yang mencurigai atau bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Pada suatu hari
  rationale: Formula naratif Lukas ini diperpadukan secara alami dengan keterangan waktu σαββάτῳ; fungsi pembuka peristiwa dipertahankan tanpa ungkapan Indonesia yang kaku seperti 'terjadilah'.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: ketika Yesus masuk
  rationale: Infinitif artikular dengan ἐν menyatakan waktu. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam ayat yang berdiri sendiri.
- source_word: οἶκόν
  choice: rumah
  rationale: Padanan langsung dan alami untuk tempat berlangsungnya jamuan.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: salah seorang pemimpin orang Farisi
  rationale: Menyampaikan bahwa orang itu termasuk kalangan pemimpin Farisi, tanpa menyiratkan jabatan resmi tertentu yang tidak dinyatakan teks.
- source_word: σαββάτῳ
  choice: pada suatu hari Sabat
  rationale: Datif berfungsi temporal. Bentuk ini alami dalam bahasa Indonesia dan tidak memaksakan definiteness yang tidak ditandai dalam bahasa Yunani.
- source_word: φαγεῖν ἄρτον
  choice: untuk makan
  rationale: Ungkapan harfiah 'makan roti' merupakan idiom Semitis/Yunani untuk makan atau menghadiri jamuan; 'untuk makan' menyampaikan makna idiomatis secara wajar.
- source_word: παρατηρούμενοι
  choice: terus mengamat-amati Dia dengan saksama
  rationale: Menangkap pengamatan yang tekun dan intens, serta membiarkan kemungkinan nuansa curiga atau bermusuhan tetap tersirat tanpa menegaskannya.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Subjek jamak dipertahankan secara alami; konteks berikutnya dapat menjelaskan kelompok yang dimaksud tanpa menambahkan identitas yang tidak disebutkan secara eksplisit di sini.
theological_decisions:
- issue: Nuansa permusuhan dalam tindakan mengamati Yesus
  choice: mereka terus mengamat-amati Dia dengan saksama
  alternative: mereka memata-matai Dia
  rationale: παρατηρέω dapat bernuansa pengawasan yang mencurigai atau bermusuhan, tetapi ayat ini tidak menyatakan motif itu secara eksplisit. Terjemahan utama mempertahankan ketegangan naratif tanpa memperkeras tuduhan.
- issue: Identitas subjek αὐτοὶ
  choice: mereka
  alternative: orang-orang Farisi itu
  rationale: Teks Yunani hanya memakai pronomina jamak yang merujuk kepada para hadirin dalam konteks. Menyebut semuanya sebagai orang Farisi akan menambahkan identifikasi yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat menghindari formula naratif yang kaku, sedangkan 'hari Sabat' dan 'orang Farisi' mempertahankan istilah Alkitab yang umum dipahami. Penanda catatan kaki ditempatkan langsung setelah klausa yang diterangkannya.
