  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: id
  text: Yang lain berkata, “Aku telah menikah, dan karena itu aku tidak dapat datang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: yang lain
  rationale: Dalam rangkaian alasan para undangan, ἕτερος memperkenalkan orang berikutnya; “yang lain” alami dan tepat dalam narasi Indonesia.
- source_word: Γυναῖκα ἔγημα
  choice: Aku baru saja menikah
  rationale: Secara harfiah berarti “aku menikahi seorang perempuan/istri.” Dalam bahasa Indonesia, “menikah” sudah menyatakan terbentuknya hubungan perkawinan, sedangkan “baru saja” menyampaikan kemungkinan kuat bahwa peristiwa lampau itu masih sangat relevan sebagai alasan saat ini.
- source_word: διὰ τοῦτο
  choice: karena itu
  rationale: Ungkapan ini menyatakan hubungan sebab-akibat antara pernikahan dan ketidakhadiran yang diklaim; “karena itu” ringkas dan alami.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: aku tidak dapat datang
  rationale: Terjemahan ini mempertahankan pernyataan ketidakmampuan dari δύναμαι + infinitif dan memakai ragam Indonesia yang wajar serta bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ungkapan idiomatis “baru saja menikah” menghindari bentuk janggal “menikahi seorang istri” tanpa mengubah fungsi alasan dalam perumpamaan.
