id: LUK.14.35
reference: Luke 14:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: id
  text: Tidak cocok untuk tanah ataupun untuk timbunan pupuk kandang[a]; orang membuangnya ke luar. Orang yang mempunyai telinga untuk mendengar[b], hendaklah dia mendengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “timbunan kotoran.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Siapa yang mempunyai telinga untuk mendengar, hendaklah dia mendengar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: tanah
  rationale: Dalam gambaran pertanian ini, γῆ menunjuk pada tanah sebagai media tanam, bukan bumi dalam arti kosmis.
- source_word: κοπρίαν
  choice: timbunan pupuk kandang
  rationale: κοπρία menunjuk pada kotoran atau pupuk kandang. Pilihan ini jelas dalam bahasa Indonesia modern dan mempertahankan latar pertanian.
- source_word: εὔθετόν
  choice: cocok
  rationale: εὔθετος berarti layak atau sesuai untuk suatu penggunaan. 'Cocok' mempertahankan penilaian tersebut tanpa mempersempitnya menjadi sekadar 'berguna'.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: orang membuangnya ke luar
  rationale: Bentuk aktif jamak dengan subjek tak tentu dipertahankan secara alami melalui 'orang', sedangkan 'ke luar' menerjemahkan ἔξω secara konkret.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Orang yang mempunyai telinga untuk mendengar, hendaklah dia mendengar
  rationale: '''Orang yang mempunyai'' mencerminkan partisipel berartikel ὁ ἔχων, dan ''hendaklah dia mendengar'' mempertahankan daya imperatif ἀκουέτω. Kata ganti Indonesia tidak menandai gender.'
theological_decisions:
- issue: Bentuk tunggal representatif dalam seruan penutup
  choice: Orang yang mempunyai telinga untuk mendengar, hendaklah dia mendengar
  alternative: Siapa yang mempunyai telinga untuk mendengar, hendaklah dia mendengar
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin yang berfungsi secara umum. Bahasa Indonesia tidak membedakan gender pada bentuk ini; susunan tunggal tetap dipertahankan tanpa menambahkan pembatasan gender yang tidak dapat dinyatakan secara alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Citra pertanian dipertahankan secara konkret; konstruksi 'orang membuangnya' menyampaikan subjek jamak tak tentu secara alami.
source_grounding:
  english_pob_role: consult_only
