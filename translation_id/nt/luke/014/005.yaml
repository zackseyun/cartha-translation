  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka[a], “Siapa di antara kalian yang, jika anak laki-lakinya atau lembunya jatuh ke dalam sumur, tidak akan segera menariknya keluar pada hari Sabat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi “keledai” sebagai ganti “anak laki-laki.”
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Siapakah di antara kalian
  rationale: Ungkapan interogatif ini membentuk pertanyaan retoris tentang siapa di antara para pendengar yang akan bertindak berbeda; bentuk ini alami dalam bahasa Indonesia.
- source_word: υἱὸς
  choice: anaknya
  rationale: υἱός secara leksikal berarti 'anak laki-laki', tetapi dalam konstruksi Τίνος ὑμῶν menyatakan hubungan kepunyaan ('anak siapa di antara kalian'). 'Anaknya' menyampaikan hubungan itu secara alami, meski jenis kelaminnya tidak dinyatakan secara eksplisit dalam bahasa Indonesia.
- source_word: βοῦς
  choice: lembunya
  rationale: βοῦς menunjuk pada seekor sapi, khususnya hewan bovina yang dapat dipakai bekerja. 'Lembu' merupakan padanan Indonesia yang jelas dan sesuai dengan latar agraris.
- source_word: φρέαρ
  choice: sumur
  rationale: φρέαρ paling wajar berarti sumur; pilihan ini mempertahankan kata sumber dan tidak menyelaraskannya dengan ayat paralel yang memakai gambaran lubang.
- source_word: πεσεῖται
  choice: jatuh
  rationale: Bentuk futur dalam pertanyaan bersyarat retoris ini secara alami dinyatakan dengan bentuk tak bertanda waktu setelah 'jika' dalam bahasa Indonesia.
- source_word: εὐθέως
  choice: segera
  rationale: '''Segera'' mempertahankan unsur urgensi temporal dalam teks Yunani.'
- source_word: ἀνασπάσει
  choice: menariknya keluar
  rationale: Kata kerja ini menggambarkan tindakan menarik atau mengangkat sesuatu dari bawah; frasa ini alami untuk penyelamatan dari sumur.
- source_word: αὐτὸν
  choice: -nya
  rationale: Pronomina tunggal maskulin Yunani merujuk kembali baik kepada anak maupun lembu. Enklitik '-nya' mempertahankan rujukan tunggal tanpa membuat bahasa Indonesia janggal.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: pada hari Sabat
  rationale: Padanan ini mencerminkan unsur ἡμέρᾳ ('hari') dan merupakan ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Varian tekstual mengenai pihak yang jatuh ke dalam sumur
  choice: anaknya atau lembunya
  alternative: keledainya atau lembunya
  rationale: Teks SBLGNT yang diberikan membaca υἱός ('anak/anak laki-laki'), sehingga bacaan itu dipertahankan dalam teks utama. Bacaan ὄνος ('keledai') dalam sebagian naskah dicatat dalam catatan kaki, bukan dimasukkan atau diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pertanyaan langsung kepada kelompok tetap jelas. Nama 'Yesus' dipakai untuk memperjelas subjek pronominal dari konteks, sementara gaya pertanyaan retoris dan ketegangan mengenai tindakan pada hari Sabat dipertahankan.
