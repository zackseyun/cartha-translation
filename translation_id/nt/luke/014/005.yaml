  to: Lalu Yesus berkata kepada mereka[a], “Siapa di antara kalian yang, jika anak laki-lakinya atau lembunya jatuh ke dalam sumur, tidak akan segera menariknya keluar pada hari Sabat?”
  rationale: Revisi terbatas pada penerjemahan υἱός sebagai “anak laki-laki” dan penyesuaian paralel pada catatan varian. Unsur-unsur lain dalam draf—termasuk “sumur,” “lembu,” “segera,” dan “hari Sabat”—sudah setia kepada teks Yunani dan alami dalam bahasa Indonesia modern.
