    rationale: Teks SBLGNT memakai nomina maskulin tunggal υἱός, “anak laki-laki.” Bahasa Indonesia dapat menyatakan pembedaan ini secara wajar dengan “anak laki-lakinya”; karena itu, pembedaan sumber tidak perlu dihilangkan.
