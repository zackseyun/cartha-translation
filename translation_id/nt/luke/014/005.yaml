  naturalness: Kalimatnya sudah jelas dan baku. “Siapa di antara kalian” sedikit lebih alami daripada “Siapakah di antara kalian” dalam pertanyaan retoris ini, sementara susunan bersyaratnya tetap lancar.
  terminology: “Lembu,” “sumur,” dan “hari Sabat” sesuai dengan makna sumber dan register modern baku. Catatan varian perlu menyebut “anak laki-laki” agar kontras dengan bacaan “keledai” tepat.
