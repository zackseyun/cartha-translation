  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: id
  text: Seorang lain berkata, “Aku telah membeli lima pasang lembu dan aku akan pergi mengujinya. Aku mohon kepadamu, maafkanlah aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: Yang lain
  rationale: Dalam rangkaian orang yang diundang dan menyampaikan alasan, frasa ini secara alami menunjuk kepada orang lain berikutnya.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: lima pasang lembu
  rationale: ζεῦγος berarti sepasang hewan yang dipasangkan untuk bekerja. 'Lima pasang lembu' jelas dan alami dalam bahasa Indonesia serta mempertahankan gambaran agrarisnya.
- source_word: ἠγόρασα
  choice: Aku telah membeli
  rationale: Bentuk aoris menyatakan pembelian yang sudah terjadi dan kini dijadikan alasan; 'telah membeli' menonjolkan relevansi hasil tindakan itu.
- source_word: πορεύομαι δοκιμάσαι αὐτά
  choice: hendak pergi mengujinya
  rationale: πορεύομαι dalam konteks ini mengungkapkan gerak atau maksud yang segera, sedangkan δοκιμάσαι berarti menguji atau mencoba untuk menilai mutu hewan yang dibeli.
- source_word: ἐρωτῶ σε
  choice: Aku mohon kepadamu
  rationale: ἐρωτάω di sini merupakan permintaan langsung yang sopan; 'mohon' lebih alami daripada 'bertanya' dalam konstruksi permohonan ini.
- source_word: ἔχε με παρῃτημένον
  choice: anggaplah aku sudah berhalangan
  rationale: Ungkapan ini secara harfiah meminta tuan rumah menganggap dirinya telah dibebaskan dari kewajiban hadir. Dalam konteks undangan, 'sudah berhalangan' menyampaikan alasan ketidakhadiran secara idiomatis tanpa menyiratkan pengampunan dosa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata ganti 'Aku' dan '-mu' mengikuti tuturan langsung antarindividu; 'lembu' mempertahankan latar agraris. Tidak diperlukan catatan kaki karena 'lima pasang lembu' menyampaikan ζεύγη βοῶν secara jelas, sedangkan idiom penutup dapat diterjemahkan alami tanpa kehilangan fungsi pragmatisnya.
