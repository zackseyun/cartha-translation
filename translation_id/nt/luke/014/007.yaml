translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan partisip Yunani diurai menjadi dua kalimat agar pengantar ucapan langsung jelas. Kata “Ia” mempertahankan rujukan pronominal dari konteks tanpa menambahkan nama yang tidak muncul dalam ayat ini.
