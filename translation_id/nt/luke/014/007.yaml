  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: id
  text: 'Ia menyampaikan sebuah perumpamaan kepada orang-orang yang diundang itu ketika memperhatikan bagaimana mereka memilih tempat-tempat terhormat[a]. Ia berkata kepada mereka:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat-tempat utama.” Dalam konteks jamuan, istilah Yunani ini menunjuk pada tempat-tempat yang paling terhormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ia menyampaikan
  rationale: Bentuk imperfek memberi latar bagi perkataan yang menyusul. Dalam bahasa Indonesia, “menyampaikan” secara alami dapat memperkenalkan perumpamaan tanpa harus menambahkan penanda aspek yang kaku.
- source_word: δὲ
  choice: tidak dinyatakan dengan kata penghubung tersendiri
  rationale: δέ di sini merupakan penghubung naratif ringan. Alur bahasa Indonesia sudah cukup menandai peralihan, sehingga penambahan “sekarang,” “tetapi,” atau “lalu” dapat memberi tekanan yang tidak ada dalam sumber.
- source_word: τοὺς κεκλημένους
  choice: orang-orang yang diundang itu
  rationale: Partisip perfek menekankan keadaan mereka sebagai orang yang telah diundang. Bentuk ini mempertahankan penekanan tersebut tanpa menambahkan kata “tamu” yang hanya tersirat.
- source_word: παραβολήν
  choice: sebuah perumpamaan
  rationale: “Perumpamaan” adalah padanan baku dan jelas bagi istilah Injil παραβολή.
- source_word: ἐπέχων
  choice: ketika memperhatikan
  rationale: 'Partisip ini menyatakan keadaan yang melatarbelakangi perumpamaan: Ia mengamati perilaku para undangan. “Ketika memperhatikan” alami dan tidak memaksakan hubungan sebab-akibat.'
- source_word: πῶς
  choice: bagaimana
  rationale: Padanan langsung yang mempertahankan fokus pada cara mereka bertindak.
- source_word: τὰς πρωτοκλισίας
  choice: tempat-tempat terhormat
  rationale: Istilah ini menunjuk pada tempat berbaring atau duduk yang paling bergengsi dalam jamuan. Padanan ini menyampaikan makna sosialnya dengan jelas bagi pembaca masa kini.
- source_word: ἐξελέγοντο
  choice: mereka memilih
  rationale: Konteks bersama konstruksi kalimat menyampaikan tindakan yang sedang diamati. Bahasa Indonesia tidak perlu menandai aspek imperfek secara eksplisit, dan nuansa medial “bagi diri mereka sendiri” sudah tersirat.
- source_word: λέγων πρὸς αὐτούς
  choice: Ia berkata kepada mereka
  rationale: Klausa tersendiri lebih alami dalam bahasa Indonesia untuk memperkenalkan ucapan langsung, sambil tetap mempertahankan hubungan dengan perumpamaan yang akan disampaikan.
