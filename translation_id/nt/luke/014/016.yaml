  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: id
  text: Lalu Ia berkata kepadanya, “Seorang mengadakan suatu perjamuan besar[a] dan mengundang banyak orang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jamuan makan besar” atau “makan malam besar”. Kata Yunani δεῖπνον menunjuk pada hidangan utama; dalam konteks ini, kata itu merujuk pada jamuan resmi yang diadakan oleh seorang tuan rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Namun, Yesus berkata kepadanya
  rationale: δέ menandai peralihan tanggapan dan secara wajar diterjemahkan “Namun”. Subjek Yunani hanya memakai artikel sebagai pronomina (“ia”), tetapi “Yesus” dipakai untuk memperjelas rujukan dalam bahasa Indonesia tanpa mengubah identitas pembicara.
- source_word: Ἄνθρωπός τις
  choice: Ada seseorang
  rationale: Ungkapan ini merupakan pembukaan naratif yang tidak tentu. “Ada seseorang” alami dalam perumpamaan bahasa Indonesia dan mempertahankan ketidaktentuan τις.
- source_word: ἐποίει
  choice: sedang mempersiapkan
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung. Dalam konteks menjamu, “mempersiapkan” lebih alami daripada terjemahan harfiah “membuat”.
- source_word: δεῖπνον μέγα
  choice: sebuah perjamuan besar
  rationale: δεῖπνον menunjuk pada jamuan utama, lazimnya pada petang hari; konteks undangan resmi mendukung “perjamuan”, sedangkan μέγα diterjemahkan “besar”.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: dan mengundang banyak orang
  rationale: Dalam konteks jamuan, καλέω berarti “mengundang”. “Orang” dinyatakan agar bentuk substantival πολλούς terdengar lengkap dan alami dalam bahasa Indonesia.
