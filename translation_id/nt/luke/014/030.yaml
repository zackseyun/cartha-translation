    issue: «katanya» tidak secara jelas mewakili partisipel jamak λέγοντες.
    rationale: Bentuk ini dapat dibaca sebagai ‘konon/menurut katanya’ dan tidak menunjukkan hubungan tindakan dengan para pengejek pada ayat sebelumnya. «Sambil berkata» lebih jelas dan tetap tidak menambahkan penafsiran.
  - severity: low
    issue: «tetapi» memperkuat hubungan adversatif untuk καί.
    rationale: Teks Yunani memakai καί (‘dan’). Kegagalan menyelesaikan bangunan sudah membentuk kontras naratif, sehingga «dan» lebih dekat pada sumber tanpa mengurangi kelancaran.
