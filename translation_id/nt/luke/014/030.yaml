  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: id
  text: sambil berkata, ‘Orang ini mulai membangun dan tidak mampu menyelesaikannya.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: katanya, ‘…’
  rationale: Partisipel kini jamak merujuk kepada orang-orang dalam ayat sebelumnya dan memperkenalkan isi ejekan. Dalam bahasa Indonesia, “katanya” secara alami menghubungkan ujaran itu dengan konteks sebelumnya, sedangkan tanda petik menyampaikan fungsi ὅτι sebagai pengantar ujaran langsung.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Orang ini
  rationale: Ungkapan ini mempertahankan demonstratif yang menunjuk secara terang-terangan kepada orang tersebut tanpa menambahkan nada merendahkan yang tidak wajib ada dalam teks.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: mulai membangun
  rationale: Terjemahan langsung dan wajar bagi verba yang berarti mulai, diikuti infinitif “membangun”; objek tidak ditambahkan karena tidak dinyatakan dalam frasa Yunani ini.
- source_word: οὐκ ἴσχυσεν
  choice: tidak sanggup
  rationale: Dalam konteks ini ἰσχύω menyatakan kemampuan atau kecukupan untuk menuntaskan pekerjaan, bukan semata-mata kekuatan fisik. “Tidak sanggup” alami dan tetap mempertahankan nuansa ketidakmampuan.
- source_word: ἐκτελέσαι
  choice: menyelesaikannya
  rationale: Verba ini berarti membawa pekerjaan sampai tuntas. Akhiran “-nya” secara alami merujuk kepada bangunan atau pekerjaan membangun yang telah disebut, tanpa menentukan lebih jauh jenis bangunannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk “katanya” dipilih agar fragmen partisipial ayat ini tetap mengalir dari ayat sebelumnya. Kontras καί dalam konteks hasil yang berlawanan diterjemahkan secara idiomatis sebagai “tetapi”.
