id: LUK.6.33
reference: Luke 6:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: id
  text: Dan jika kamu berbuat baik kepada orang-orang yang berbuat baik kepadamu, penghargaan apa yang layak kamu terima?[a] Orang-orang berdosa pun melakukan hal yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anugerah apa yang ada bagimu?” Kata Yunani yang diterjemahkan “penghargaan” juga dapat berarti “anugerah”, “perkenanan”, atau “ucapan terima kasih”; di sini maksudnya adalah penghargaan atas kebaikan yang dilakukan secara timbal balik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: berbuat baik
  rationale: Ungkapan ini secara langsung menyatakan tindakan melakukan kebaikan atau memberi manfaat dan terdengar alami dalam bahasa Indonesia.
- source_word: τοὺς ἀγαθοποιοῦντας ὑμᾶς
  choice: orang-orang yang berbuat baik kepadamu
  rationale: Pilihan ini mempertahankan pengulangan akar kata yang sama dengan ἀγαθοποιῆτε serta menyampaikan bahwa kebaikan itu ditujukan kepada para pendengar.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: penghargaan apa yang layak kamu terima?
  rationale: Dalam konteks ajaran etis ini, χάρις menunjuk pada penghargaan, pujian, atau pengakuan atas tindakan, bukan secara khusus pada anugerah keselamatan. Bentuk ini alami sebagai pertanyaan retoris dalam bahasa Indonesia.
- source_word: οἱ ἁμαρτωλοὶ
  choice: orang-orang berdosa
  rationale: Ini merupakan padanan langsung yang mempertahankan kategori moral dan sosial-religius dalam Injil Lukas.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: melakukan hal yang sama
  rationale: Padanan idiomatis ini menyampaikan perbandingan secara jelas tanpa menambahkan makna.
- source_word: καὶ
  choice: Dan / pun
  rationale: καὶ pertama mempertahankan kesinambungan dengan rangkaian perkataan sebelumnya; καὶ kedua dipahami secara asensif dan diterjemahkan dengan 'pun' untuk menekankan bahwa orang berdosa juga bertindak demikian.
theological_decisions:
- issue: Makna χάρις dalam konteks ajaran etis
  choice: penghargaan yang layak diterima
  alternative: anugerah; perkenanan; ucapan terima kasih
  rationale: Pertanyaan retoris ini membahas pengakuan atau penghargaan atas kebaikan yang hanya bersifat timbal balik. Terjemahan ini menghindari pemaksaan makna soteriologis, sedangkan catatan kaki mempertahankan rentang makna kata Yunaninya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'berbuat baik' dipertahankan untuk mencerminkan hubungan leksikal dalam teks Yunani. Kata ganti tunggal kolektif 'kamu' mengikuti gaya tutur langsung yang mudah dipahami; 'pun' menyampaikan daya tekan καὶ kedua.
