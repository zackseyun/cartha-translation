  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: id
  text: Pada hari Sabat yang lain, ia masuk ke rumah ibadat dan sedang mengajar. Di situ ada seorang laki-laki yang tangan kanannya layu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengering.” Kata Yunani yang dipakai dapat menggambarkan sesuatu yang kering atau layu; dalam konteks ini, kata itu merujuk kepada tangan kanan laki-laki tersebut yang tidak berfungsi normal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Pada ... yang lain
  rationale: Ungkapan ini berfungsi sebagai peralihan naratif khas Lukas. Dalam bahasa Indonesia, daya pengantarnya tersampaikan secara alami melalui keterangan waktu di awal kalimat tanpa terjemahan harfiah yang kaku seperti “terjadilah.”
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: pada hari Sabat yang lain
  rationale: Menunjukkan kesempatan lain dari jenis yang sama dan mempertahankan latar waktu dengan bahasa Indonesia yang wajar.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: ia masuk ke rumah ibadat
  rationale: Infinitif sesudah ἐγένετο dialihkan menjadi klausa finit yang alami. “Rumah ibadat” menyampaikan συναγωγή sebagai tempat pertemuan dan ibadah Yahudi.
- source_word: καὶ διδάσκειν
  choice: dan sedang mengajar
  rationale: Bentuk kini infinitif menampilkan kegiatan yang sedang berlangsung; “sedang mengajar” mempertahankan aspek itu.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Nomina ini dalam konteks tersebut merujuk kepada seorang individu laki-laki tertentu.
- source_word: ἐκεῖ
  choice: Di situ ada
  rationale: Menyampaikan klausa keberadaan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: yang tangan kanannya
  rationale: Klausa relatif alami dalam bahasa Indonesia dan tetap menegaskan bahwa yang dimaksud ialah tangan kanan orang itu.
- source_word: ξηρά
  choice: layu
  rationale: Mempertahankan gambaran dasar sesuatu yang mengering atau layu sekaligus dapat dipahami sebagai keadaan tangan yang tidak berfungsi normal, tanpa menetapkan diagnosis medis yang tidak disebutkan teks.
