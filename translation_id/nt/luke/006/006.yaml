translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “ia” mempertahankan rujukan pronominal sumber tanpa menambahkan nama yang tidak terdapat dalam ayat ini. Penanda catatan kaki ditempatkan sesudah “layu,” yaitu kata yang dijelaskan oleh catatan.
