  source_fidelity: Teks Indonesia secara akurat menyampaikan latar waktu “pada hari Sabat yang lain,” masuknya ia ke sinagoge/rumah ibadat, kegiatan mengajar yang sedang berlangsung, serta seorang laki-laki yang tangan kanannya ξηρά. Pengalihan formula naratif Ἐγένετο δὲ ke pembukaan keterangan waktu adalah wajar dalam bahasa Indonesia dan tidak mengubah peristiwa.
  naturalness: Kalimatnya jelas, modern, dan bernada hormat tanpa menjadi kaku. “Rumah ibadat,” “Di situ ada,” dan “tangan kanannya layu” dapat dipahami secara alami dalam register Alkitab bahasa Indonesia. Pemakaian “sedang mengajar” dengan tepat mengomunikasikan aspek berlangsung dari διδάσκειν.
  terminology: “Hari Sabat,” “rumah ibadat,” dan “layu” konsisten dengan register Alkitab Indonesia yang mapan. “Laki-laki” secara tepat mempertahankan rujukan maskulin ἄνθρωπος dalam konteks ini. Catatan kaki menjelaskan alternatif leksikal tanpa memaksakan diagnosis medis atau penafsiran teologis.
