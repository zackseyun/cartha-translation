id: LUK.6.13
reference: Luke 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: id
  text: Ketika hari sudah terang, ia memanggil murid-muridnya[a], lalu memilih dua belas orang dari antara mereka, yang juga ia beri nama rasul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengumpulkan murid-muridnya.” Kata Yunani ini dapat berarti “memanggil kepada diri sendiri” atau “berbicara kepada,” tetapi konteksnya menunjuk pada tindakan mengumpulkan mereka untuk memilih dua belas orang.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang juga ia sebut rasul.” Kata kerjanya dapat berarti “memberi nama” atau “menyebut.” Ungkapan “memberi nama” dipakai dalam teks utama untuk membedakannya dari tindakan memanggil para murid sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: ketika hari sudah terang
  rationale: Ungkapan ini menyampaikan datangnya waktu siang setelah malam dengan bahasa Indonesia yang alami, tanpa membatasi maknanya secara khusus pada fajar atau pagi.
- source_word: προσεφώνησεν
  choice: memanggil
  rationale: Dalam konteks ini, Yesus memanggil para murid untuk berkumpul sebelum memilih dua belas orang. Pilihan ini lebih sesuai daripada makna leksikal lain, yaitu 'menyapa' atau 'berbicara kepada'.
- source_word: μαθητὰς
  choice: murid-murid
  rationale: '''Murid'' adalah istilah baku dan jelas dalam konteks Injil serta mempertahankan hubungan belajar dan mengikuti seorang guru.'
- source_word: ἐκλεξάμενος
  choice: memilih
  rationale: '''Memilih'' ringkas, alami, dan mempertahankan tindakan penetapan dua belas orang dari kelompok yang lebih besar.'
- source_word: ἀπ’ αὐτῶν
  choice: dari antara mereka
  rationale: Frasa ini memperjelas bahwa kedua belas orang itu dipilih dari kelompok murid yang lebih luas.
- source_word: δώδεκα
  choice: dua belas orang
  rationale: Kata 'orang' ditambahkan secara wajar dalam bahasa Indonesia karena angka ini merujuk kepada manusia, tanpa menambah isi baru.
- source_word: ἀποστόλους
  choice: rasul
  rationale: '''Rasul'' adalah istilah Indonesia yang mapan untuk gelar khusus ini dan lebih tepat dalam konteks daripada ungkapan umum seperti ''utusan''.'
- source_word: ὠνόμασεν
  choice: memberi nama
  rationale: Ungkapan ini menyatakan pemberian sebutan atau gelar dan membedakannya dengan tindakan 'memanggil' pada bagian sebelumnya.
theological_decisions:
- issue: Apakah ἀποστόλους diterjemahkan sebagai gelar yang mapan atau menurut arti dasarnya sebagai orang-orang yang diutus
  choice: rasul
  alternative: utusan; orang-orang yang diutus
  rationale: Dalam ayat ini, kata tersebut merupakan sebutan yang diberikan Yesus kepada kedua belas orang itu, bukan sekadar gambaran umum tentang tugas mengantar pesan. 'Rasul' mempertahankan fungsi naratif dan bobot istilahnya tanpa menambahkan klaim doktrinal.
translation_notes:
  register: 'Bahasa Indonesia modern, alami, dan bermartabat. Pronomina ilahi ditulis dengan huruf kecil sesuai kaidah umum karena kapitalisasi semacam itu tidak terdapat dalam teks Yunani. Susunan kalimat mempertahankan urutan tindakan: hari menjadi terang, para murid dipanggil, dua belas dipilih, lalu diberi sebutan rasul.'
