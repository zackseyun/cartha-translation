id: LUK.6.4
reference: Luke 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: id
  text: bagaimana ia masuk ke rumah Allah, lalu mengambil dan memakan roti sajian[a] serta memberikannya kepada orang-orang yang bersamanya, yang tidak boleh dimakan kecuali oleh para imam saja?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roti yang diletakkan di hadapan Allah”; secara tradisional disebut “roti sajian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: bagaimana
  rationale: Dalam konteks pertanyaan tidak langsung tentang tindakan Daud, kata ini memperkenalkan uraian tentang apa yang dilakukannya.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: masuk ke rumah Allah
  rationale: Mempertahankan istilah οἶκος sebagai 'rumah', bukan menafsirkannya sebagai 'Bait Allah', sekaligus menyampaikan gerak masuk secara alami dalam bahasa Indonesia.
- source_word: ἄρτους τῆς προθέσεως
  choice: roti sajian
  rationale: Istilah Indonesia yang ringkas dan dikenal untuk roti kudus yang ditempatkan di hadapan Allah; catatan kaki menjelaskan makna kultisnya.
- source_word: λαβὼν ἔφαγεν
  choice: mengambil dan memakan
  rationale: Mengubah konstruksi partisip dan verba utama menjadi rangkaian tindakan yang alami tanpa menghilangkan urutannya.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: memberikannya kepada orang-orang yang bersamanya
  rationale: Mencerminkan rujukan kepada roti melalui akhiran '-nya' dan menerjemahkan τοῖς μετ’ αὐτοῦ secara dekat tanpa menambahkan identitas mereka.
- source_word: οὓς
  choice: roti itu
  rationale: Pronomina relatif Yunani merujuk kepada roti; pengulangan nomina dalam bahasa Indonesia menghindari ketaksaan.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: tidak boleh dimakan
  rationale: Menyampaikan ketidakbolehan menurut ketentuan hukum-keagamaan secara alami dalam bahasa Indonesia.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: kecuali oleh para imam saja
  rationale: Mempertahankan pembatasan tegas bahwa hanya para imam yang diperbolehkan memakannya.
theological_decisions:
- issue: Pembatasan hukum-kultis atas roti kudus
  choice: tidak boleh dimakan kecuali oleh para imam saja
  alternative: tidak diizinkan untuk dimakan selain oleh para imam
  rationale: Pilihan ini mempertahankan bahwa larangan tersebut berasal dari ketentuan keagamaan Israel, bukan sekadar kebiasaan sosial, tanpa menambahkan penjelasan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' merujuk kepada Daud dan ditulis dengan huruf kecil karena bukan sapaan ilahi. 'Padahal' membuat hubungan kontras dengan larangan berikutnya jelas dan alami tanpa menyelesaikan ketegangan yang sengaja dipertahankan oleh teks.
