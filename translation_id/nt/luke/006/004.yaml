  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada Yunani: urutan tindakan dan pembatasan khusus bagi para imam terpelihara. Namun, «padahal» memberi hubungan konsesif/kontrastif yang tidak dinyatakan oleh klausa relatif Yunani οὓς οὐκ ἔξεστιν..., yang hanya menerangkan roti tersebut.'
  naturalness: Bahasa baku dan alami. Mengganti «padahal roti itu» dengan klausa relatif langsung membuat hubungan antarklausa lebih dekat dengan sumber dan tetap lancar dalam bahasa Indonesia modern.
  terminology: «Rumah Allah», «roti sajian», dan «para imam» sesuai register serta istilah yang lazim. Catatan kaki perlu diperbaiki karena «roti penempatan» bukan padanan Indonesia yang wajar; keterangan yang lebih idiomatis dapat menjelaskan roti itu sebagai roti yang diletakkan di hadapan Allah.
