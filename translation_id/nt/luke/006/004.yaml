    rationale: Klausa οὓς οὐκ ἔξεστιν φαγεῖν... merupakan keterangan relatif tentang roti, bukan klausa yang secara eksplisit memakai penghubung ‘padahal/meskipun’. Klausa relatif Indonesia mempertahankan relasi sumber tanpa tambahan penafsiran.
  - severity: low
    issue: Catatan kaki memakai frasa «roti penempatan» yang tidak alami.
    rationale: Catatan dapat menjelaskan makna ἄρτους τῆς προθέσεως dengan ungkapan Indonesia yang jelas tanpa mengesankan bahwa frasa teknis yang janggal itu adalah padanan harfiah yang diperlukan.
