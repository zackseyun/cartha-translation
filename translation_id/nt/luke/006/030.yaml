  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: id
  text: Berilah kepada setiap orang yang meminta kepadamu, dan dari orang yang mengambil milikmu, janganlah menuntutnya kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan dari orang yang mengambil milikmu, janganlah meminta milikmu kembali.”
    reason: Alternatif ini mencerminkan kemungkinan arti ἀπαιτέω sebagai “meminta kembali”, alih-alih “menuntut kembali”.
lexical_decisions:
- source_word: παντὶ
  choice: kepada setiap orang
  rationale: Bentuk datif tunggal πᾶς dipakai secara distributif bersama partisipel αἰτοῦντί. Pilihan ini wajar dalam bahasa Indonesia dan mempertahankan cakupan universal perintah.
- source_word: αἰτοῦντί σε
  choice: yang meminta kepadamu
  rationale: αἰτέω menyatakan tindakan meminta tanpa dengan sendirinya menyiratkan bahwa orang itu pengemis; kepadamu menyatakan pihak yang dimintai.
- source_word: δίδου
  choice: Berilah
  rationale: Imperatif kini δίδωμι diterjemahkan sebagai perintah langsung. Akhiran -lah memberi nada tegas dan bermartabat tanpa harus mengungkapkan aspek berkelanjutan secara berlebihan.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: dari orang yang mengambilnya
  rationale: Partisipel berartikel ini menunjuk orang yang mengambil atau membawa pergi sesuatu. 'Mengambilnya' tetap luas dan tidak memaksakan kategori hukum seperti pencurian.
- source_word: τὰ σὰ
  choice: milikmu
  rationale: Ungkapan harfiahnya berarti 'hal-hal yang adalah milikmu'. 'Milikmu' alami, ringkas, dan tidak membatasi rujukannya hanya pada jenis harta tertentu.
- source_word: μὴ ἀπαίτει
  choice: janganlah menuntut kembali
  rationale: ἀπαιτέω dapat berarti meminta atau menuntut kembali. 'Menuntut kembali' mempertahankan daya verba dan gagasan mengambil kembali sesuatu yang menjadi milik orang tersebut.
theological_decisions:
- issue: Cakupan dan daya perintah etis Yesus
  choice: Perintah diterjemahkan secara langsung dan luas tanpa diperlunak atau dibatasi dalam teks.
  alternative: Menafsirkannya sebagai hiperbola, membatasinya pada sedekah, atau membatasi klausa kedua pada perkara hukum tentang pencurian.
  rationale: Bahasa Yunani memakai imperatif langsung dan cakupan universal ('setiap orang'). Terjemahan mempertahankan ketegangan etis dan tidak menyelesaikan perdebatan mengenai penerapannya melalui pemilihan kata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Berilah' dan 'janganlah' mempertahankan gaya perintah langsung, sedangkan susunan klausa dibuat alami bagi pembaca umum.
