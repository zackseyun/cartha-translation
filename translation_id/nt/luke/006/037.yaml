review_pass:
  verdict: revise
  source_fidelity: Dua larangan pertama dan penegasan οὐ μή pada dasarnya tersampaikan, tetapi pengulangan “maka” mengubah koordinasi καί menjadi hubungan hasil yang lebih eksplisit. Untuk ἀπολύετε/ἀπολυθήσεσθε, “bebaskanlah/dibebaskan” mempertahankan kemungkinan leksikal yang luas, namun dalam bahasa Indonesia tanpa objek terdengar seperti pembebasan tawanan dan tidak menyampaikan konteks relasional ujaran ini dengan baik. Dalam konteks paralel tentang penghakiman dan penghukuman, “ampunilah/diampuni” adalah padanan kontekstual yang paling tepat; keluasan leksikal dapat dipertahankan dalam catatan kaki.
  naturalness: Teks revisi memakai koordinasi “dan” yang mencerminkan ritme Yunani secara alami. “Menjatuhkan hukuman” membedakan καταδικάζω dari “menghakimi,” sedangkan “sekali-kali tidak akan” menyampaikan penegasan secara baku dan wajar. “Ampunilah” idiomatis dalam konteks ini.
  terminology: “Menghakimi” untuk κρίνω dan “menjatuhkan hukuman” untuk καταδικάζω mempertahankan eskalasi makna. “Ampunilah” untuk ἀπολύετε mengikuti makna kontekstual tanpa meniadakan alternatif “melepaskan/membebaskan” dalam catatan kaki.
  issues:
  - severity: medium
    issue: “Bebaskanlah” tidak alami dan kurang tepat secara kontekstual sebagai terjemahan utama ἀπολύετε.
    rationale: Dalam bahasa Indonesia, “membebaskan” lazimnya mengandaikan pembebasan dari penahanan atau ikatan tertentu. Dalam rangkaian tentang menghakimi dan menjatuhkan hukuman, ἀπολύω paling wajar dipahami sebagai mengampuni atau melepaskan dari tuntutan. Catatan kaki dapat menyatakan rentang leksikalnya.
  - severity: low
    issue: “Maka” ditambahkan sebagai penanda akibat untuk setiap καί.
    rationale: καί secara harfiah mengoordinasikan klausa-klausa paralel. Hubungan timbal balik memang tersirat, tetapi “dan” lebih dekat pada bentuk sumber dan tetap alami dalam bahasa Indonesia.
  - severity: low
    issue: “Menghukum” kurang eksplisit membedakan καταδικάζω dari κρίνω.
    rationale: “Menjatuhkan hukuman” lebih jelas menyatakan tindakan memvonis atau menghukum dan mempertahankan peningkatan dari larangan menghakimi.
  revised_text: Jangan menghakimi, dan kamu sekali-kali tidak akan dihakimi; jangan menjatuhkan hukuman, dan kamu sekali-kali tidak akan dijatuhi hukuman. Ampunilah[a], dan kamu akan diampuni.
