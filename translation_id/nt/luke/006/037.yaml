revisions:
- from: Janganlah menghakimi, maka kamu sama sekali tidak akan dihakimi; janganlah menghukum, maka kamu sama sekali tidak akan dihukum. Bebaskanlah[a], maka kamu akan dibebaskan.
  to: Jangan menghakimi, dan kamu sekali-kali tidak akan dihakimi; jangan menjatuhkan hukuman, dan kamu sekali-kali tidak akan dijatuhi hukuman. Ampunilah[a], dan kamu akan diampuni.
  rationale: Revisi ini mengikuti koordinasi dan paralelisme teks Yunani, menyampaikan daya tegas οὐ μή dengan “sekali-kali tidak akan,” dan membedakan penghakiman dari tindakan menjatuhkan hukuman. Terjemahan utama untuk ἀπολύετε memakai padanan kontekstual Indonesia yang idiomatis, sementara alternatif leksikal yang lebih luas tetap dicatat tanpa memaksakan penafsiran denominasi.
