  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: id
  text: Jangan menghakimi, dan kamu sekali-kali tidak akan dihakimi; jangan menjatuhkan hukuman, dan kamu sekali-kali tidak akan dijatuhi hukuman. Ampunilah[a], dan kamu akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani ini juga dapat berarti “melepaskan” atau “membebaskan”; dalam konteks ini dapat dipahami sebagai “mengampuni”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: menghakimi
  rationale: Kata ini secara umum berarti menilai atau menghakimi. “Menghakimi” mempertahankan bentuk perintah yang ringkas serta kesejajarannya dengan bentuk pasif “dihakimi”.
- source_word: οὐ μὴ κριθῆτε
  choice: kamu sama sekali tidak akan dihakimi
  rationale: Gabungan οὐ μή menyatakan penyangkalan yang tegas; “sama sekali tidak akan” menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: καταδικάζετε
  choice: menghukum
  rationale: Kata ini lebih kuat daripada κρίνω dan berarti menyatakan bersalah atau menjatuhkan hukuman. “Menghukum” mempertahankan peningkatan makna dari menghakimi ke putusan yang merugikan.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: kamu sama sekali tidak akan dihukum
  rationale: Terjemahan ini menyampaikan penyangkalan tegas οὐ μή sekaligus menjaga kesejajaran dengan klausa sebelumnya.
- source_word: ἀπολύετε
  choice: bebaskanlah
  rationale: ἀπολύω dapat berarti melepaskan, membebaskan, atau—dalam konteks ini—mengampuni. “Bebaskanlah” menjaga keluasan makna dan korespondensi verbal dengan bentuk pasif berikutnya.
- source_word: ἀπολυθήσεσθε
  choice: kamu akan dibebaskan
  rationale: “Dibebaskan” mempertahankan pengulangan akar verba dan sifat timbal balik perkataan ini; “diampuni” tetap merupakan tafsiran kontekstual yang wajar.
- source_word: καὶ
  choice: maka
  rationale: Walaupun secara dasar berarti “dan”, dalam rangkaian perintah dan akibat ini “maka” mengungkapkan hubungan hasil secara alami tanpa mengubah susunan paralelnya.
theological_decisions:
- issue: Apakah ἀπολύετε diterjemahkan secara sempit sebagai “ampunilah” atau lebih luas sebagai “bebaskanlah”
  choice: Bebaskanlah dalam teks utama
  alternative: Ampunilah; lepaskanlah
  rationale: Konteksnya menyangkut penghakiman dan penghukuman, sedangkan ἀπολύω dapat menunjuk pada pembebasan atau pelepasan dari tuntutan. Pilihan ini mempertahankan keluasan leksikal dan ambiguitas asli; makna “mengampuni” dicantumkan sebagai kemungkinan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan bentuk aktif-pasif dipertahankan untuk mencerminkan paralelisme Yunani; “sama sekali tidak” menyampaikan penyangkalan yang tegas.
