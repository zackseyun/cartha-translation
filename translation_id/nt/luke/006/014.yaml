  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: id
  text: Simon, yang juga dinamai-Nya Petrus, Andreas, saudaranya, Yakobus, Yohanes, Filipus, dan Bartolomeus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Simon
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk rasul ini.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: yang juga dinamai-Nya Petrus
  rationale: Kata ὀνομάζω menyatakan tindakan memberi nama; bentuk ini mempertahankan unsur καί ('juga') dan secara alami menunjukkan bahwa Yesus adalah pelakunya.
- source_word: Πέτρον
  choice: Petrus
  rationale: Bentuk baku nama Πέτρος dalam tradisi Alkitab bahasa Indonesia.
- source_word: Ἀνδρέαν
  choice: Andreas
  rationale: Transliterasi baku bahasa Indonesia untuk nama Ἀνδρέας.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: saudaranya
  rationale: Dalam konteks ini ἀδελφός merujuk kepada saudara laki-laki Simon; 'saudaranya' merupakan ungkapan Indonesia yang alami dan ringkas.
- source_word: Ἰάκωβον
  choice: Yakobus
  rationale: Bentuk nama Perjanjian Baru yang mapan dalam bahasa Indonesia.
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Bentuk baku bahasa Indonesia untuk nama Ἰωάννης.
- source_word: Φίλιππον
  choice: Filipus
  rationale: Bentuk baku bahasa Indonesia untuk nama Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Bartolomeus
  rationale: Bentuk baku bahasa Indonesia untuk nama Βαρθολομαῖος.
- source_word: καὶ
  choice: dan / tanda koma
  rationale: Dalam daftar nama, καί berfungsi sebagai penghubung. Bahasa Indonesia modern lebih alami memakai koma di antara unsur-unsur daftar dan 'dan' sebelum unsur terakhir, tanpa mengubah hubungan koordinatifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk yang telah mapan dalam Alkitab bahasa Indonesia. Akhiran -Nya pada 'dinamai-Nya' menunjuk kepada Yesus dan ditulis dengan huruf kapital menurut kebiasaan ortografi religius Indonesia.
