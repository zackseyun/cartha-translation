  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: id
  text: Setelah memandang sekeliling ke arah mereka semua, Yesus berkata kepada orang itu, “Ulurkanlah tanganmu.” Ia pun melakukannya, lalu tangannya dipulihkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tangannya disembuhkan.” Secara lebih harfiah, kata Yunani itu berarti “dipulihkan,” dengan penekanan bahwa tangan tersebut kembali kepada keadaan yang semestinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος πάντας αὐτούς
  choice: Setelah memandang mereka semua di sekeliling-Nya
  rationale: Partisip aoris menunjukkan bahwa Yesus terlebih dahulu mengarahkan pandangan kepada semua orang yang hadir. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan memandang ke sekeliling serta cakupan ‘mereka semua’.
- source_word: εἶπεν αὐτῷ
  choice: Yesus berkata kepada orang itu
  rationale: Nama dan rujukan orang tersebut dibuat eksplisit berdasarkan konteks dekat agar pergantian pelaku tidak rancu dalam bahasa Indonesia, tanpa mengubah isi ujaran.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Ulurkanlah tanganmu
  rationale: ‘Ulurkanlah’ menyampaikan imperatif langsung untuk mengedangkan atau mengulurkan tangan. χείρ diterjemahkan secara biasa sebagai ‘tangan’, bukan ‘lengan’.
- source_word: ὁ δὲ ἐποίησεν
  choice: Ia pun melakukannya
  rationale: ποιέω merujuk kembali pada tindakan yang baru diperintahkan. Partikel ‘pun’ memberi alur naratif ringan bagi δέ dan menandai tanggapan orang itu.
- source_word: ἀπεκατεστάθη ἡ χεὶρ αὐτοῦ
  choice: tangannya dipulihkan
  rationale: Bentuk pasif ἀποκαθίστημι menekankan kembalinya tangan itu kepada keadaan yang semestinya. ‘Dipulihkan’ mempertahankan nuansa restorasi dan tidak mempersempitnya menjadi istilah medis semata.
theological_decisions:
- issue: Cara menyatakan mukjizat dalam ἀπεκατεστάθη
  choice: tangannya dipulihkan
  alternative: tangannya menjadi sembuh
  rationale: Bahasa pemulihan paling dekat dengan makna verba Yunani, yakni dikembalikan kepada kondisi yang semestinya, sekaligus tetap menyampaikan hasil mukjizat tanpa menambahkan penafsiran medis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dibaca. ‘Yesus’ dan ‘orang itu’ dieksplisitkan untuk menghindari kerancuan rujukan pronomina; sapaan dan perintah tetap ringkas serta langsung. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
