  source_fidelity: Frasa Yunani περιβλεψάμενος πάντας αὐτούς menyatakan bahwa Yesus memandang sekeliling kepada semua orang tersebut sebelum berbicara. Terjemahan inti perintah, tanggapan orang itu, dan pemulihan tangannya sudah setia pada teks sumber. Namun, susunan “memandang mereka semua di sekeliling-Nya” dapat berarti bahwa mereka berada di sekeliling Yesus, bukan bahwa Yesus memandang sekeliling kepada mereka semua.
  naturalness: “Setelah memandang sekeliling ke arah mereka semua” adalah bahasa Indonesia baku dan jelas, sekaligus mempertahankan urutan tindakan dalam narasi. Selebihnya, “Ulurkanlah tanganmu,” “Ia pun melakukannya,” dan “tangannya dipulihkan” alami dalam register modern-baku.
  terminology: “Tangan” tepat untuk χείρ. “Dipulihkan” merupakan padanan yang baik untuk ἀπεκατεστάθη dan mempertahankan bahasa restorasi tanpa memaksakan istilah medis. Nama Yesus dan “orang itu” boleh dieksplisitkan dari konteks dekat demi kejelasan rujukan.
