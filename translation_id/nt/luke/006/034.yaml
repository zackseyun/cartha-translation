revisions:
- from: Dan jika kamu meminjamkan kepada orang-orang yang darinya kamu berharap menerima kembali, apa jasamu[a]? Orang-orang berdosa pun meminjamkan kepada sesama orang berdosa supaya mereka menerima kembali jumlah yang sama.
  to: Dan jika kamu meminjamkan kepada orang-orang yang kamu harapkan akan mengembalikannya, apakah jasamu[a]? Orang-orang berdosa pun meminjamkan kepada sesama orang berdosa supaya mereka menerima kembali jumlah yang sama.
  rationale: Revisi hanya mengganti susunan yang tidak alami “yang darinya kamu berharap menerima kembali” dengan bentuk Indonesia baku yang menyatakan relasi pengembalian secara jelas. Makna sumber—meminjamkan kepada pihak yang diharapkan memberi pengembalian—tetap utuh. Catatan kaki dipertahankan karena dengan layak menandai alternatif makna χάρις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:01Z'
