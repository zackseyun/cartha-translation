  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: id
  text: Dan jika kamu meminjamkan kepada orang-orang yang kamu harapkan akan mengembalikannya, apakah jasamu[a]? Orang-orang berdosa pun meminjamkan kepada sesama orang berdosa supaya mereka menerima kembali jumlah yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan terima kasih apa yang kamu peroleh?” Kata Yunani yang diterjemahkan “jasa” juga dapat berarti “terima kasih” atau “penghargaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: meminjamkan
  rationale: Kata kerja ini berarti memberikan uang atau barang sebagai pinjaman. 'Meminjamkan' adalah padanan bahasa Indonesia yang alami dan mempertahankan makna finansialnya.
- source_word: παρ’ ὧν
  choice: kepada orang-orang yang darinya
  rationale: Ungkapan ini menunjuk kepada pihak penerima pinjaman yang kemudian menjadi sumber pengembalian. Susunan ini mempertahankan kedua hubungan tersebut tanpa menambahkan gagasan bunga atau keuntungan.
- source_word: ἐλπίζετε λαβεῖν
  choice: kamu berharap menerima kembali
  rationale: ἐλπίζω dapat berarti 'berharap' maupun 'mengharapkan'. Dalam konteks pinjaman timbal balik, frasa ini menyatakan harapan akan penerimaan kembali; 'kembali' diperjelas oleh konteks dan verba ἀπολαμβάνω pada klausa berikutnya.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: apa jasamu?
  rationale: '''Jasa'' secara alami menyampaikan nilai terpuji atau penghargaan yang patut diperoleh dalam pertanyaan retoris ini, tanpa menafsirkan χάρις sebagai anugerah keselamatan. Kemungkinan makna ''terima kasih'' dipertahankan dalam catatan kaki.'
- source_word: ἁμαρτωλοὶ
  choice: orang-orang berdosa
  rationale: Bentuk adjektiva yang dipakai sebagai nomina ini menunjuk kepada golongan orang yang disebut berdosa. Bentuk lengkap ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἵνα ἀπολάβωσιν
  choice: supaya mereka menerima kembali
  rationale: ἀπολαμβάνω di sini berarti menerima sebagai balasan atau memperoleh kembali apa yang dipinjamkan.
- source_word: τὰ ἴσα
  choice: jumlah yang sama
  rationale: Frasa ini menyatakan pengembalian yang setara. 'Jumlah yang sama' jelas dalam konteks pinjaman dan tidak menyiratkan bunga.
theological_decisions:
- issue: Makna χάρις dalam pertanyaan retoris Yesus
  choice: Diterjemahkan 'jasa', yaitu sesuatu yang patut dipandang baik atau dihargai, bukan anugerah keselamatan.
  alternative: '''Ucapan terima kasih'', ''penghargaan'', atau ''anugerah''.'
  rationale: Konteks membandingkan perilaku para murid dengan perilaku orang-orang berdosa. Pokoknya ialah apakah tindakan itu memiliki nilai terpuji yang membedakan mereka, sementara ambiguitas leksikal mengenai rasa terima kasih tetap dicatat.
- issue: Sifat pengembalian pinjaman yang diharapkan
  choice: Dinyatakan secara netral sebagai menerima kembali jumlah yang sama.
  alternative: Menerima bunga, keuntungan, atau pembayaran lebih.
  rationale: τὰ ἴσα menunjukkan pengembalian yang setara, bukan keuntungan. Terjemahan tidak memasukkan klaim ekonomi atau etis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'kamu' mempertahankan sapaan langsung kepada para pendengar tanpa membedakan tunggal dan jamak secara tidak alami. Ungkapan 'sesama orang berdosa' menjaga hubungan timbal balik dalam kalimat kedua.
