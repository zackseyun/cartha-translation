  terminology: “Meminjamkan,” “orang-orang berdosa,” dan “jumlah yang sama” tepat dan berregister modern-baku. “Jasa” dapat dipertahankan sebagai padanan kontekstual untuk χάρις; catatan kaki dengan tepat mencatat alternatif leksikal “terima kasih” dan “penghargaan.”
