    issue: Catatan kaki mencantumkan “Guru, Guru” sebagai alternatif untuk κύριε.
    rationale: “Guru” biasanya menerjemahkan διδάσκαλος dan terlalu jauh sebagai alternatif leksikal langsung di sini. “Tuan” memadai sebagai alternatif bagi “Tuhan,” sejalan dengan audit Inggris (“Master”).
  - severity: low
    issue: Catatan kaki menulis “Kyrios, kyrios” sebagai bentuk Yunani.
    rationale: Bentuk yang muncul dalam ayat adalah vokatif Κύριε, κύριε, yang secara transliterasi adalah “kyrie, kyrie.”
