review_pass:
  verdict: revise
  source_fidelity: Teks utama menyampaikan pertanyaan retoris, pengulangan sapaan, dan kontras antara menyapa Yesus sebagai Tuhan serta tidak melakukan perkataan-Nya dengan setia. “Mengapa,” “kalian,” “Tuhan, Tuhan,” dan “apa yang Kukatakan” semuanya sesuai dengan fungsi unsur-unsur Yunani. Namun, “Guru” bukan alternatif leksikal langsung yang memadai untuk κύριε dalam catatan kaki ini; padanan yang didukung audit Inggris adalah “Tuan.”
  naturalness: Kalimatnya alami, lugas, dan bernada teguran dalam bahasa Indonesia modern. Pemakaian “kalian” dengan tepat mempertahankan bentuk jamak orang kedua tanpa menjadi kaku. Kapitalisasi Aku/Kukatakan merupakan konvensi editorial Alkitab Indonesia yang lazim dan tidak mengubah makna.
  terminology: “Tuhan” tepat sebagai terjemahan utama untuk κύριε dalam konteks ini dan mempertahankan bobot sapaan kepada Yesus. Catatan kaki perlu membatasi alternatif pada “Tuan” dan memperbaiki transliterasi bentuk vokatif Yunani menjadi “kyrie, kyrie.”
  issues:
