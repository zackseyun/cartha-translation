  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: id
  text: Mengapa kalian memanggil Aku, ‘Tuhan, Tuhan,’[a] tetapi tidak melakukan apa yang Kukatakan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Tuan, Tuan.” Yunani: kyrie, kyrie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Mengapa
  rationale: Dalam ungkapan Τί ... καλεῖτε, τί berfungsi untuk menanyakan alasan, sehingga padanan alami dalam bahasa Indonesia ialah “Mengapa”.
- source_word: δέ
  choice: tetapi
  rationale: δέ merupakan penghubung ringan; di sini diterjemahkan “tetapi” untuk mengungkapkan daya kontras dalam teguran tersebut secara alami.
- source_word: με
  choice: Aku
  rationale: Objek langsung καλεῖτε. Huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia saat kata ganti merujuk kepada Yesus.
- source_word: καλεῖτε
  choice: kalian memanggil
  rationale: Bentuk kini aktif indikatif orang kedua jamak. “Kalian” menyatakan kemajemukan subjek yang tersurat dalam bentuk Yunani, dan “memanggil” cocok untuk sapaan dengan gelar.
- source_word: Κύριε κύριε
  choice: Tuhan, Tuhan
  rationale: “Tuhan” mempertahankan bobot gelar κύριος ketika ditujukan langsung kepada Yesus; pengulangannya dipertahankan untuk menonjolkan pertentangan antara pengakuan lisan dan tindakan.
- source_word: καὶ οὐ
  choice: tetapi tidak
  rationale: Walaupun secara bentuk dapat diterjemahkan “dan tidak”, dalam konteks ini gabungan tersebut menyatakan kontras; “tetapi tidak” lebih alami dalam bahasa Indonesia.
- source_word: ποιεῖτε
  choice: melakukan
  rationale: ποιέω di sini berarti menjalankan atau menaati perkataan Yesus. “Melakukan” sederhana dan langsung, serta cocok dengan objek “apa yang Kukatakan”.
- source_word: ἃ
  choice: apa yang
  rationale: Kata ganti relatif netral jamak ini merujuk secara kolektif pada isi perkataan Yesus; “apa yang” merupakan padanan Indonesia yang alami.
- source_word: λέγω
  choice: Kukatakan
  rationale: Bentuk “Kukatakan” menerjemahkan “Aku mengatakan” secara ringkas dan alami tanpa menambahkan objek tidak langsung yang tidak tersurat.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar kristologis
  choice: Tuhan
  alternative: Guru; Tuan
  rationale: Dalam konteks sapaan langsung kepada Yesus, “Tuhan” mempertahankan baik makna kewibawaan maupun bobot kristologisnya. “Guru” atau “Tuan” mungkin dalam konteks tertentu, tetapi lebih sempit atau lebih lemah; alternatif itu dicatat agar rentang leksikalnya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan berwibawa. “Kalian” dipakai untuk menyatakan orang kedua jamak dalam bahasa sumber. Susunan pertanyaan mempertahankan nada teguran dan kontras antara sapaan kepada Yesus dan kegagalan melakukan perkataan-Nya.
