id: LUK.6.23
reference: Luke 6:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: id
  text: Bersukacitalah pada hari itu dan melompatlah kegirangan, sebab lihatlah, upahmu besar di surga; karena dengan cara yang sama nenek moyang mereka memperlakukan para nabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρητε
  choice: Bersukacitalah
  rationale: Imperatif aoris jamak ini menyerukan sukacita secara aktif; bentuk ini alami, tegas, dan bermartabat dalam bahasa Indonesia.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: pada hari itu
  rationale: Terjemahan langsung dan alami yang mempertahankan acuan waktu tanpa menafsirkannya lebih jauh.
- source_word: σκιρτήσατε
  choice: melompatlah kegirangan
  rationale: Kata kerja ini menggambarkan luapan sukacita secara jasmani; frasa ini menyampaikan tindakan dan emosinya secara idiomatis.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dalam ungkapan Indonesia yang lebih mutakhir daripada 'sesungguhnya'.
- source_word: μισθὸς
  choice: upah
  rationale: Mempertahankan citra dasar μισθός sebagai balasan atau ganjaran, sekaligus membiarkan ketegangan metaforisnya tetap terdengar.
- source_word: πολὺς
  choice: besar
  rationale: Padanan predikatif yang alami bagi besarnya upah.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Menunjukkan ranah surgawi secara ringkas dan lazim tanpa menambahkan penjelasan teologis.
- source_word: κατὰ τὰ αὐτά
  choice: dengan cara yang sama
  rationale: Menyampaikan idiom yang berarti 'secara serupa' dengan jelas.
- source_word: ἐποίουν
  choice: memperlakukan
  rationale: Dalam konstruksi ini, terjemahan harfiah 'melakukan kepada' terasa tidak wajar dalam bahasa Indonesia; 'memperlakukan' menyampaikan hubungan tindakan terhadap para nabi tanpa merinci bentuk perlakuannya.
- source_word: τοῖς προφήταις
  choice: para nabi
  rationale: Bentuk jamak tertentu diterjemahkan secara alami sebagai kelompok yang dikenal dalam sejarah Israel.
- source_word: οἱ πατέρες αὐτῶν
  choice: nenek moyang mereka
  rationale: Dalam konteks antargenerasi, πατέρες merujuk kepada leluhur; pilihan ini jelas dan alami, tanpa mengaburkan tuduhan historis.
theological_decisions:
- issue: Hakikat dan tempat balasan yang dijanjikan
  choice: upahmu besar di surga
  alternative: upahmu besar bersama Allah di surga
  rationale: Teks hanya menyatakan bahwa upah itu besar 'di surga'; terjemahan tidak menambahkan siapa yang menyimpan atau memberikannya.
- issue: Rujukan οἱ πατέρες αὐτῶν
  choice: nenek moyang mereka
  alternative: bapak-bapak mereka
  rationale: Yang dimaksud kemungkinan besar adalah para leluhur dari pihak yang menolak murid-murid, bukan hanya ayah biologis mereka; 'nenek moyang' menyampaikan rujukan historis itu secara alami.
- issue: Sifat perlakuan terhadap para nabi
  choice: memperlakukan para nabi
  alternative: menganiaya para nabi
  rationale: Konteks mengisyaratkan perlakuan yang bermusuhan, tetapi verba Yunani sendiri tidak secara eksplisit berkata 'menganiaya'; terjemahan mempertahankan implikasi tanpa mempertegasnya menjadi pernyataan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Paralelisme dua imperatif dipertahankan, sedangkan susunan klausa dibuat alami tanpa menghilangkan pengulangan alasan yang ditandai oleh γάρ.
source_grounding:
  english_pob_role: consult_only
