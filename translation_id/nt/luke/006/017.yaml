id: LUK.6.17
reference: Luke 6:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: id
  text: Lalu Yesus turun bersama mereka dan berdiri di suatu tempat yang datar.[a] Di situ ada sekumpulan besar murid-Nya dan sejumlah besar orang dari seluruh Yudea, Yerusalem, serta daerah pesisir Tirus dan Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di suatu dataran.” Secara harfiah, frasa Yunani ini berarti “di suatu tempat yang datar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: turun bersama mereka
  rationale: Partisip aoris καταβάς menyatakan gerak turun yang mendahului tindakan utama; bentuk naratif “lalu ... turun” alami dalam bahasa Indonesia, sementara μετ’ αὐτῶν diterjemahkan langsung sebagai “bersama mereka”.
- source_word: ἔστη
  choice: berdiri
  rationale: Aoris dari ἵστημι di sini menyatakan bahwa Yesus mengambil posisi berdiri; “berdiri” menyampaikan makna dasarnya secara wajar.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: di suatu tempat yang datar
  rationale: τόπος berarti “tempat” dan πεδινός berarti “datar/rata”; pilihan ini mempertahankan ungkapan Yunani tanpa memastikan bahwa lokasi itu merupakan dataran luas.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: sekumpulan besar murid-Nya
  rationale: ὄχλος πολύς menunjuk kumpulan besar, sedangkan genitif μαθητῶν αὐτοῦ menunjukkan bahwa kumpulan tersebut terdiri atas murid-murid-Nya.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: sejumlah besar orang
  rationale: πλῆθος πολύ menekankan jumlah yang besar. Dalam bahasa Indonesia, “sejumlah besar orang” membedakan kelompok khalayak luas ini dari para murid tanpa menghasilkan ungkapan kaku seperti “banyak sekali dari rakyat itu”.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: dari seluruh Yudea
  rationale: πάσης menyatakan cakupan wilayah secara menyeluruh; “seluruh Yudea” merupakan padanan Indonesia yang langsung dan alami.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: daerah pesisir Tirus dan Sidon
  rationale: παράλιος menunjuk wilayah di tepi laut; “daerah pesisir” menyampaikan arti geografisnya dengan jelas, sedangkan Tirus dan Sidon memakai bentuk nama Indonesia yang lazim.
theological_decisions:
- issue: Ungkapan topografis dan kaitannya dengan latar khotbah
  choice: di suatu tempat yang datar
  alternative: di suatu dataran
  rationale: Terjemahan mengikuti arti leksikal frasa Yunani dan tidak menyelaraskannya dengan latar gunung dalam Matius ataupun menciptakan pertentangan yang tidak dinyatakan Lukas. “Tempat yang datar” juga tidak memastikan bahwa lokasi itu adalah dataran luas.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat dibagi dua agar daftar dua kelompok orang tetap jelas. Kata ganti hormat “-Nya” mengikuti kebiasaan umum teks Alkitab bahasa Indonesia tanpa menambahkan penafsiran pada isi ayat.
