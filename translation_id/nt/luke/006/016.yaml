  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: id
  text: dan Yudas anak Yakobus[a], serta Yudas Iskariot, yang menjadi pengkhianat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yudas saudara Yakobus”; teks Yunani hanya mengatakan “Yudas dari Yakobus.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Yudas anak Yakobus
  rationale: Bentuk genitif Ἰακώβου hanya menyatakan hubungan secara eliptis. Dalam daftar nama, bahasa Indonesia perlu menyebutkan hubungan itu agar alami; “anak Yakobus” merupakan pilihan yang paling mungkin, sementara kemungkinan “saudara Yakobus” dicatat dalam catatan kaki.
- source_word: Ἰσκαριὼθ
  choice: Iskariot
  rationale: Nama atau sebutan diri ini ditransliterasikan sesuai bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: ὃς ἐγένετο
  choice: yang kemudian menjadi
  rationale: ἐγένετο mempertahankan makna perubahan atau perkembangan, bukan sekadar keadaan. Kata “kemudian” membuat urutan waktunya alami dalam bahasa Indonesia tanpa menyatakan lebih dari konteks.
- source_word: προδότης
  choice: pengkhianat
  rationale: προδότης menunjuk kepada orang yang berkhianat. “Pengkhianat” merupakan padanan nomina yang ringkas, alami, dan tepat dalam konteks ini.
- source_word: καὶ
  choice: dan; serta
  rationale: Pengulangan konjungsi menghubungkan dua nama terakhir dalam daftar. Variasi “dan” dan “serta” menjaga koordinasi sekaligus menghasilkan susunan bahasa Indonesia yang alami.
theological_decisions:
- issue: Hubungan yang tersirat dalam Ἰούδαν Ἰακώβου (“Yudas dari Yakobus”)
  choice: Yudas anak Yakobus
  alternative: Yudas saudara Yakobus
  rationale: Bahasa Yunani tidak menyebutkan jenis hubungan itu secara eksplisit. “Anak Yakobus” dipakai sebagai kemungkinan yang paling umum dalam daftar nama, tetapi ketidakpastian asli dipertahankan melalui catatan kaki dan tidak diselesaikan berdasarkan harmonisasi atau tradisi.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Iskariot” mengikuti bentuk nama yang mapan; “yang kemudian menjadi pengkhianat” mempertahankan daya verbal ἐγένετο dan membedakannya dari pernyataan statis.
