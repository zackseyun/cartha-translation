base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: id
  text: Namun, mereka dipenuhi kegilaan[a], lalu berunding satu sama lain tentang apa yang mungkin akan mereka lakukan kepada Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipenuhi kebodohan” atau “dipenuhi hilangnya akal sehat.” Istilah Yunani ini dapat menunjuk pada ketidakbernalaran, kebodohan, atau keadaan kehilangan akal sehat.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Namun, mereka
  rationale: “Namun” menyampaikan pertentangan dengan tindakan Yesus dalam konteks sebelumnya. Kata ganti Yunani bersifat menegaskan, tetapi penambahan “sendiri” akan terasa kaku dan dapat menimbulkan penekanan yang tidak wajar dalam bahasa Indonesia.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: dipenuhi amarah yang tidak masuk akal[a]
  rationale: Ungkapan pasif “dipenuhi” dipertahankan. ἄνοια pada dasarnya menunjuk pada hilangnya akal sehat, kebodohan, atau kegilaan; dalam konteks reaksi bermusuhan ini, frasa tersebut menyampaikan kemarahan yang irasional tanpa memberi kesan diagnosis gangguan jiwa modern.
- source_word: καὶ διελάλουν πρὸς ἀλλήλους
  choice: lalu berunding satu sama lain
  rationale: Bentuk imperfek menggambarkan pembicaraan atau pertimbangan yang berlangsung timbal balik. “Berunding” secara alami menyampaikan bahwa mereka membicarakan rencana bersama; “lalu” menghubungkan reaksi mereka dengan tindakan berikutnya tanpa memaksakan hubungan sebab-akibat yang lebih kuat.
- source_word: τί ἂν ποιήσαιεν
  choice: tentang apa yang mungkin mereka lakukan
  rationale: τί dengan ἄν dan optatif menyatakan kemungkinan dalam pertimbangan tidak langsung. “Mungkin” mempertahankan sifat tentatifnya dan tidak mengubahnya menjadi kewajiban atau keputusan yang sudah pasti.
- source_word: τῷ Ἰησοῦ
  choice: terhadap Yesus
  rationale: Datif menyatakan sasaran tindakan yang sedang mereka pertimbangkan. “Terhadap Yesus” tetap netral secara gramatikal sehingga sifat bermusuhan tindakan itu dibiarkan tersirat oleh konteks, bukan ditambahkan sebagai “melawan Yesus”.
theological_decisions:
- issue: Apakah ἀνοίας harus diterjemahkan sebagai kegilaan, kebodohan, atau kemarahan irasional
  choice: amarah yang tidak masuk akal
  alternative: kegilaan; kebodohan; hilangnya akal sehat
  rationale: Pilihan ini mempertahankan ketegangan antara arti leksikal berupa ketidakbernalaran dan daya emosional reaksi mereka dalam konteks. Terjemahan ini tidak menganggap mereka mengalami penyakit mental dan tidak mengurangi istilah itu menjadi sekadar kekeliruan intelektual.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan citra “dipenuhi” serta ketidakpastian dalam pertimbangan mereka. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
