  terminology: “Kegilaan” di sini tidak dimaksudkan sebagai diagnosis klinis, melainkan sebagai padanan utama yang mempertahankan rentang makna ἄνοια. Catatan kaki menyediakan “kebodohan” dan “hilangnya akal sehat” sebagai alternatif yang relevan.
