id: LUK.6.44
reference: Luke 6:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: id
  text: Sebab setiap pohon dikenali dari buahnya sendiri. Sebab orang tidak memetik buah ara dari duri-duri[a], dan tidak memanen buah anggur dari semak brambel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumbuhan berduri”; kata Yunani ini secara luas menunjuk pada duri atau tumbuhan berduri.
    reason: lexical_alternative
  - marker: b
    text: Atau “semak berduri”; kata Yunani ini menunjuk pada semak brambel berduri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: setiap pohon
  rationale: Bentuk tunggal dengan ἕκαστον menyatakan makna distributif; “setiap pohon” alami dalam bahasa Indonesia dan mempertahankan penekanan pada masing-masing pohon.
- source_word: γὰρ
  choice: sebab
  rationale: γάρ pertama menyatakan hubungan penjelasan dengan konteks sebelumnya. γάρ kedua tidak diterjemahkan secara terpisah karena hubungan alasannya sudah jelas dalam kelanjutan peribahasa dan pengulangannya akan terasa kaku dalam bahasa Indonesia.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: dari buahnya sendiri
  rationale: “Dari” mempertahankan gambaran sumber atau dasar pengenalan dalam ἐκ, sedangkan “sendiri” menerjemahkan ἰδίου dan menegaskan kesesuaian antara pohon dan buahnya.
- source_word: γινώσκεται
  choice: dikenal
  rationale: Bentuk pasif kini menyatakan kenyataan yang berlaku secara umum; “dikenal” ringkas dan wajar untuk ungkapan peribahasa.
- source_word: ἀκανθῶν
  choice: semak-semak berduri
  rationale: Kata jamak ini menunjuk secara luas pada tumbuhan berduri. Pilihan ini menyampaikan bahwa yang dimaksud bukan sekadar duri yang terlepas, tanpa menentukan spesies tertentu.
- source_word: συλλέγουσιν
  choice: memetik
  rationale: Dalam konteks hasil tanaman, “memetik” merupakan ungkapan Indonesia yang alami untuk tindakan mengumpulkan buah ara.
- source_word: σῦκα
  choice: buah ara
  rationale: Padanan baku bahasa Indonesia bagi bentuk jamak σῦκα.
- source_word: βάτου
  choice: semak duri
  rationale: βάτος menunjuk pada semak berduri atau brambel, bukan sekadar semak biasa; “semak duri” jelas tanpa menetapkan spesies yang tidak dinyatakan teks.
- source_word: σταφυλήν
  choice: buah anggur
  rationale: Walaupun berbentuk tunggal dalam bahasa Yunani, ungkapan ini secara idiomatis menunjuk pada buah atau tandan anggur; “buah anggur” alami dalam bahasa Indonesia.
- source_word: τρυγῶσιν
  choice: memanen
  rationale: τρυγάω secara khusus dapat berarti memanen hasil yang matang, terutama anggur. “Memanen” mempertahankan nuansa itu dan membedakannya dari συλλέγουσιν.
theological_decisions:
- issue: Daya metaforis gambaran pohon dan buah
  choice: Mempertahankan peribahasa pertanian tanpa menjelaskan penerapan moralnya di dalam terjemahan.
  alternative: Memperluas terjemahan dengan menyebut watak, perkataan, atau perbuatan manusia.
  rationale: Teks Yunani mempertahankan gambaran pohon dan buah. Konteks menjelaskan penerapannya, sehingga ayat ini tidak perlu diparafrasakan dengan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan bentuk peribahasa serta kesejajaran antara buah ara dan buah anggur. Kata penghubung γάρ kedua dibiarkan tersirat agar alur alasan tetap alami dalam bahasa Indonesia.
