  terminology: ‘Buah ara’, ‘buah anggur’, ‘memetik’, dan ‘memanen’ tepat. ‘Semak brambel’ mempertahankan jenis tumbuhan berduri pada βάτος tanpa mengidentifikasikannya sebagai spesies tertentu. Tidak ada isu teologis atau nama diri.
