  to: Sebab setiap pohon dikenali dari buahnya sendiri. Sebab orang tidak memetik buah ara dari duri-duri[a], dan tidak memanen buah anggur dari semak brambel[b].
  rationale: 'Revisi mempertahankan dua γάρ sebagai ‘Sebab’, sesuai fungsi penjelasannya dalam kedua klausa dan masih wajar dalam gaya peribahasa Indonesia. Istilah bagi ἀκανθῶν dan βάτου dibedakan agar kontras leksikal sumber tetap terlihat: ‘duri-duri’ untuk istilah umum dan ‘semak brambel’ untuk semak berduri. Tidak ada perluasan tafsir atas metafora pohon dan buah.'
