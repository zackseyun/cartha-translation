  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: id
  text: Bagaimana mungkin kamu berkata kepada saudaramu,[a] ‘Saudara, biarkan aku mengeluarkan serpihan yang ada di matamu,’ padahal kamu sendiri tidak melihat balok[b] yang ada di matamu sendiri? Hai orang munafik, keluarkanlah dahulu balok itu dari matamu sendiri, lalu kamu akan melihat dengan jelas, sehingga dapat mengeluarkan serpihan yang ada di mata saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara” menerjemahkan kata Yunani ἀδελφός, istilah kekerabatan maskulin tunggal. Ajaran ini dapat diterapkan lebih luas, tetapi bentuk Yunani yang dipakai di sini bersifat maskulin.
    reason: cultural_note
  - marker: b
    text: Atau “kayu besar”; kata Yunani δοκός menunjuk pada sepotong kayu besar, khususnya balok bangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι
  choice: Bagaimana mungkin kamu
  rationale: Mengungkapkan pertanyaan retoris yang menggugat kepantasan atau kemungkinan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: saudaramu / Saudara / saudaramu
  rationale: Mempertahankan istilah kekerabatan maskulin tunggal dalam bahasa Yunani tanpa mempersempit penerapannya melalui tambahan penafsiran.
- source_word: ἄφες ἐκβάλω
  choice: biarkan aku mengeluarkan
  rationale: ἄφες berfungsi sebagai permintaan izin, sedangkan mengeluarkan cocok dengan tindakan menyingkirkan benda dari mata.
- source_word: κάρφος
  choice: serpihan
  rationale: Menunjuk pada potongan kecil bahan kering; 'serpihan' mempertahankan citra benda kecil yang masuk ke mata dan kontras dengan balok.
- source_word: δοκός
  choice: balok
  rationale: Menunjuk pada kayu besar yang dipakai sebagai balok; padanan ini mempertahankan hiperbola dan kontras ukurannya dengan serpihan.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: padahal kamu sendiri tidak melihat
  rationale: '''Kamu sendiri'' mempertahankan penekanan αὐτός, sementara ''padahal'' menyampaikan kontras partisipial secara wajar.'
- source_word: ὑποκριτά
  choice: Hai orang munafik
  rationale: Bentuk sapaan langsung tunggal diterjemahkan dengan seruan yang tegas dan alami.
- source_word: διαβλέψεις
  choice: kamu akan dapat melihat dengan jelas
  rationale: Menyampaikan makna melihat secara jelas atau tajam setelah penghalang disingkirkan, tanpa menghilangkan orientasi mendatang dari bentuk verba.
theological_decisions:
- issue: Cakupan istilah kekerabatan ἀδελφός
  choice: saudara
  alternative: sesama / saudara atau saudari
  rationale: Teks sumber memakai bentuk maskulin tunggal dan sapaan langsung. 'Saudara' mempertahankan bentuk itu, meskipun ajaran etisnya dapat berlaku lebih luas.
- issue: Kontras metaforis κάρφος dan δοκός
  choice: serpihan ... balok
  alternative: selumbar ... gelondongan / debu ... balok
  rationale: Pilihan ini menjaga perbandingan hiperbolis antara kekurangan kecil orang lain dan kekurangan besar diri sendiri tanpa menjelaskan metafora di dalam teks.
- issue: Nuansa πῶς δύνασαι
  choice: Bagaimana mungkin kamu
  alternative: Bagaimana kamu dapat
  rationale: Ungkapan ini mempertahankan ketegangan antara ketidakmampuan dan ketidakpantasan yang terkandung dalam pertanyaan retoris, tanpa menetapkan hanya salah satunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lisan yang tegas dan bermartabat. Pengulangan 'mata', 'serpihan', dan 'balok' dipertahankan untuk menjaga struktur serta daya retoris perkataan sumber.
