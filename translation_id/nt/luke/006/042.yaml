  to: Bagaimana mungkin kamu berkata kepada saudaramu,[a] ‘Saudara, biarkan aku mengeluarkan serpihan yang ada di matamu,’ padahal kamu sendiri tidak melihat balok[b] yang ada di matamu sendiri? Hai orang munafik, keluarkanlah dahulu balok itu dari matamu sendiri, lalu kamu akan melihat dengan jelas, sehingga dapat mengeluarkan serpihan yang ada di mata saudaramu.
