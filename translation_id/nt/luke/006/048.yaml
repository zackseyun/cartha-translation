id: LUK.6.48
reference: Luke 6:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: id
  text: Ia seperti seorang laki-laki[a] yang membangun rumah. Ia menggali lalu memperdalam galiannya dan meletakkan fondasi di atas batu. Ketika banjir datang, sungai menghantam rumah itu, tetapi tidak sanggup menggoyahkannya karena rumah itu telah dibangun dengan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seseorang.” Kata Yunani yang dipakai berbentuk maskulin tunggal dan merujuk kepada seorang laki-laki sebagai tokoh yang mewakili dalam perbandingan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: Ia seperti
  rationale: Rumus perbandingan langsung ini wajar dalam bahasa Indonesia dan mempertahankan bentuk perumpamaan.
- source_word: ἀνθρώπῳ
  choice: seorang laki-laki
  rationale: Bentuk tunggal maskulin dalam gambaran dipertahankan secara jelas; catatan kaki menyebutkan alternatif representatif yang lebih umum.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: yang membangun rumah
  rationale: Ungkapan alami dan langsung untuk frasa partisipial tentang pembangunan rumah.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: menggali dalam-dalam
  rationale: Dua verba Yunani menekankan penggalian yang mencapai kedalaman; pengulangan 'dalam-dalam' menyampaikan intensitas itu secara alami.
- source_word: ἔθηκεν θεμέλιον
  choice: meletakkan fondasi
  rationale: Kolokasi konstruksi yang lazim dalam bahasa Indonesia dan sesuai dengan tindakan menaruh dasar bangunan.
- source_word: ἐπὶ τὴν πέτραν
  choice: di atas batu
  rationale: Mempertahankan citra umum 'batu' tanpa mempersempitnya secara interpretatif menjadi batuan dasar.
- source_word: πλημμύρης δὲ γενομένης
  choice: Ketika banjir datang
  rationale: Menyampaikan fungsi temporal konstruksi genitif absolut dengan bahasa Indonesia yang alami.
- source_word: προσέρηξεν ὁ ποταμὸς
  choice: sungai menghantam
  rationale: Kata 'menghantam' menyampaikan benturan kuat dari aliran sungai dengan jelas dan idiomatis.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν
  choice: tidak sanggup menggoyahkannya
  rationale: Mempertahankan nuansa ketidakmampuan sekaligus arti mengguncang atau membuat bangunan tidak stabil.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: karena rumah itu telah dibangun dengan baik
  rationale: Mempertahankan hubungan sebab, aspek tindakan yang sudah selesai, dan bentuk pasif yang mengacu pada rumah.
theological_decisions:
- issue: Pengungkapan gender pada ἀνθρώπῳ dalam perbandingan representatif
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Tokoh tunggal dalam gambaran dinyatakan secara maskulin dalam sumber Yunani. Terjemahan utama mempertahankan hal itu tanpa menyangkal fungsi representatifnya; alternatif dicatat agar jangkauan leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar alur tindakan konstruksi dan datangnya banjir mudah diikuti. 'Fondasi' dipilih sebagai istilah umum kontemporer; 'menggoyahkan' menjaga citra fisik sekaligus tidak menutup daya kiasannya.
