  source_fidelity: 'Makna pokok dan urutan tiga tindakan pada draf sesuai dengan Yunani: semua orang yang datang kepada Yesus, mendengar perkataan-Nya, dan melakukannya. Namun, ὑμῖν adalah jamak dan sebaiknya dinyatakan sebagai "kalian" dalam bahasa Indonesia. Klausa perbandingan τίνι ἐστὶν ὅμοιος juga lebih setia bila mempertahankan pembandingan personal, "dengan siapa orang itu serupa," daripada mengalihkannya menjadi "seperti apakah."'
  naturalness: '"Perkataan-perkataan-Ku" terdengar berlebihan dalam bahasa Indonesia modern; "perkataan-Ku" dapat berfungsi secara kolektif dan tetap mencakup bentuk jamak λόγων. "Aku akan menunjukkan kepada kalian dengan siapa orang itu serupa" jelas, baku, dan tetap alami dalam register Alkitab modern.'
  terminology: Kapitalisasi pronomina bagi Yesus dipertahankan sesuai kebiasaan penerbitan yang dinyatakan. "Orang itu" mempertahankan rujukan generik tunggal tanpa menambahkan penandaan gender yang tidak ada dalam bahasa Indonesia.
