base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: id
  text: 'Setiap orang yang datang kepada-Ku, mendengar perkataan-Ku, dan melakukannya—Aku akan menunjukkan kepada kalian dengan siapa orang itu serupa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Setiap orang yang datang kepada-Ku
  rationale: Konstruksi partisip berartikel dengan πᾶς bersifat umum dan mencakup siapa pun; bentuk ini alami dalam bahasa Indonesia serta mempertahankan gerak menuju Yesus yang dinyatakan oleh πρός.
- source_word: ἀκούων μου τῶν λόγων
  choice: mendengar perkataan-perkataan-Ku
  rationale: μου paling wajar dipahami sebagai kepunyaan atau sumber dalam konteks ini. 'Mendengar' mempertahankan kesejajaran verbal dengan 'melakukannya', sedangkan bentuk jamak 'perkataan-perkataan' mencerminkan λόγων.
- source_word: ποιῶν αὐτούς
  choice: dan melakukannya
  rationale: Dalam kaitan dengan perkataan atau perintah, ποιέω berarti melakukan atau menaati. 'Melakukannya' ringkas, alami, dan mempertahankan gambaran konkret dari teks sumber.
- source_word: ὑποδείξω ὑμῖν
  choice: Aku akan menunjukkan kepadamu
  rationale: Bentuk futur ini memperkenalkan perbandingan yang segera diberikan Yesus. 'Menunjukkan' merupakan padanan langsung dan wajar bagi ὑποδείκνυμι.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: seperti siapakah orang itu
  rationale: τίνι secara formal adalah datif dan menanyakan kepada siapa orang tersebut serupa. Susunan ini tetap alami dalam bahasa Indonesia dan mempertahankan orientasi personal dari perumpamaan berikutnya tanpa mengubahnya menjadi pertanyaan tentang sifat.
theological_decisions:
- issue: Bentuk maskulin tunggal yang dipakai secara umum
  choice: orang itu
  alternative: dia; ia; mereka
  rationale: Bahasa Indonesia tidak menandai gender pada kata ganti orang ketiga. 'Orang itu' mempertahankan acuan tunggal dan fungsi generik teks Yunani tanpa memasukkan gender yang tidak perlu ataupun mengubahnya menjadi bentuk jamak.
- issue: Mendengar dan melakukan perkataan Yesus
  choice: mempertahankan kedua tindakan sebagai rangkaian yang sejajar
  alternative: menerjemahkan 'mendengar' sebagai 'menaati' atau melebur keduanya menjadi satu tindakan
  rationale: Teks Yunani membedakan ἀκούων dari ποιῶν. Terjemahan mempertahankan ketegangan antara mendengar dan melakukan, tanpa menyamakan keduanya secara tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda pisah mempertahankan jeda retoris sebelum Yesus memperkenalkan perbandingan.
