  - severity: medium
    issue: '"Kepadamu" tidak menandai penerima jamak ὑμῖν.'
    rationale: Walaupun bentuk Indonesia dapat ambigu, "kepada kalian" dengan aman menyatakan bahwa Yesus berbicara kepada lebih dari satu orang.
  - severity: low
