  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: id
  text: Namun, mengapa kamu melihat serpihan kecil di mata saudaramu[a], tetapi tidak memperhatikan balok[b] di matamu sendiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “serpihan kecil” juga dapat berarti serpihan jerami atau partikel kecil yang kering. “Saudara” menerjemahkan istilah Yunani berbentuk maskulin tunggal, yang dalam konteks ini dapat digunakan secara umum.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Atau “kayu gelondongan” atau “papan besar”; kata Yunaninya menunjuk pada sepotong besar kayu, sangat kontras dengan serpihan kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: mengapa
  rationale: 'Dalam pertanyaan retoris ini, τί berfungsi secara kausal dan menantang: “mengapa,” bukan sekadar “apa.”'
- source_word: δὲ
  choice: Namun
  rationale: δέ melanjutkan ajaran sebelumnya sekaligus menandai pertentangan ringan; “namun” terdengar wajar dan bermartabat.
- source_word: βλέπεις
  choice: melihat
  rationale: Mempertahankan metafora penglihatan yang konkret dan kontras dengan κατανοεῖς.
- source_word: κάρφος
  choice: serpihan kecil
  rationale: κάρφος adalah partikel kecil dan kering, seperti serpihan atau potongan jerami; “serpihan kecil” jelas serta mempertahankan kontras ukurannya dengan balok.
- source_word: ἀδελφοῦ
  choice: saudaramu
  rationale: “Saudara” mempertahankan bentuk tunggal maskulin sumber dan dapat dipahami sebagai relasi konkret dalam perumpamaan moral ini.
- source_word: δοκόν
  choice: balok
  rationale: δοκός menunjuk pada sepotong besar kayu bangunan; “balok” merupakan padanan Indonesia yang langsung dan menjaga hiperbola.
- source_word: ἰδίῳ
  choice: sendiri
  rationale: “Sendiri” mempertahankan penekanan kepunyaan dalam ἰδίῳ dan kontras dengan mata saudara.
- source_word: κατανοεῖς
  choice: memperhatikan
  rationale: κατανοέω dapat berarti mengamati atau menyadari dengan saksama; “memperhatikan” membedakannya dari sekadar “melihat” tanpa menghilangkan ironi.
theological_decisions:
- issue: Cakupan istilah relasional ἀδελφοῦ
  choice: saudaramu
  alternative: saudara seimanmu; sesamamu; saudara laki-lakimu
  rationale: Teks memakai nomina maskulin tunggal dalam ilustrasi moral. “Saudaramu” mempertahankan bentuk sumber tanpa membatasi penerapan ajaran hanya pada saudara laki-laki kandung.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan pertanyaan retoris dipertahankan; “melihat” dan “memperhatikan” membawakan perbedaan verba sumber, sedangkan “serpihan kecil” dan “balok” menjaga kontras hiperbolis.
