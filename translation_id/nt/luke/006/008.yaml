  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: id
  text: Tetapi, ia mengetahui pikiran[a] mereka, lalu berkata kepada laki-laki yang tangannya layu[b], “Bangunlah dan berdirilah di tengah[c].” Laki-laki itu bangun lalu berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertimbangan” atau “penalaran batin.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tangannya mengisut atau mengering.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ke tengah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: mengetahui
  rationale: Bentuk verba ini menyatakan bahwa ia mengetahui apa yang ada dalam batin mereka. “Mengetahui” wajar dalam narasi Indonesia dan tidak menjelaskan bagaimana pengetahuan itu diperoleh.
- source_word: διαλογισμοὺς
  choice: pikiran
  rationale: Kata ini dapat menunjuk pada pikiran, pertimbangan, atau penalaran batin. “Pikiran” jelas dan tetap cukup luas untuk mempertahankan ambiguitas leksikalnya.
- source_word: ἀνδρὶ
  choice: laki-laki
  rationale: ἀνήρ secara khusus merujuk kepada seorang laki-laki dewasa; pilihan ini mempertahankan rujukan gender teks sumber.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: tangannya layu
  rationale: ξηρός pada anggota tubuh menggambarkan keadaan mengering, mengisut, atau kehilangan daya. “Layu” mempertahankan gambaran sumber tanpa menggantinya dengan diagnosis medis tertentu.
- source_word: Ἔγειρε
  choice: Bangunlah
  rationale: Perintah ini meminta laki-laki itu bangkit dari tempatnya. “Bangunlah” alami dan tetap dibedakan dari perintah berikutnya untuk berdiri.
- source_word: στῆθι
  choice: berdirilah
  rationale: Pilihan ini mempertahankan perintah kedua sebagai tindakan tersendiri setelah bangun.
- source_word: εἰς τὸ μέσον
  choice: di tengah-tengah
  rationale: Dalam bahasa Indonesia, “berdirilah di tengah-tengah” secara alami menyampaikan gerak menuju dan posisi di tengah kelompok, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀναστὰς ἔστη
  choice: bangun dan berdiri di sana
  rationale: Terjemahan ini mempertahankan urutan tindakan dalam partisipel dan verba utama serta menghindari peleburan keduanya menjadi satu tindakan.
theological_decisions:
- issue: Pengetahuan Yesus tentang pikiran batin orang lain
  choice: Menyatakan secara langsung bahwa ia mengetahui pikiran mereka tanpa menjelaskan caranya.
  alternative: “Ia memahami maksud mereka” atau “secara adikodrati ia mengetahui pertimbangan mereka.”
  rationale: Teks menegaskan pengetahuan tersebut, tetapi tidak menerangkan mekanismenya. Terjemahan mempertahankan pernyataan itu tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang alami dan bermartabat. Dua perintah serta dua tindakan tanggapan dipertahankan secara terpisah. Kata ganti “ia” mengikuti rujukan dalam konteks tanpa menambahkan nama yang tidak muncul dalam ayat ini.
