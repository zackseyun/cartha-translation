  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: id
  text: Namun, kasihilah musuh-musuhmu, berbuatlah baik, dan berilah pinjaman tanpa mengharapkan apa pun kembali.[a] Dan upahmu akan besar, dan kamu akan menjadi putra-putra Yang Mahatinggi,[b] sebab Ia baik hati terhadap orang-orang yang tidak tahu berterima kasih dan orang-orang jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meski kemungkinannya lebih kecil, “tanpa berputus asa terhadap siapa pun” atau “tanpa pernah kehilangan harapan.” Frasa Yunani μηδὲν ἀπελπίζοντες sulit ditafsirkan; dalam konteks ini frasa tersebut dipahami sebagai tidak mengharapkan pengembalian atau balasan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang diterjemahkan “putra-putra” berbentuk maskulin jamak dan dalam konteks ini dapat memiliki cakupan representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai pertentangan kuat dengan pola timbal balik dalam konteks sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: kasihilah musuh-musuhmu
  rationale: Mempertahankan bentuk perintah dan daya kejut sebutan 'musuh' tanpa memperhalusnya menjadi lawan atau penentang.
- source_word: ἀγαθοποιεῖτε
  choice: berbuatlah baik kepada mereka
  rationale: Mengungkapkan tindakan aktif untuk mendatangkan kebaikan; 'kepada mereka' memperjelas sasaran yang tersirat dari rangkaian perintah tanpa mengubah acuannya.
- source_word: δανίζετε
  choice: berilah pinjaman
  rationale: Padanan Indonesia yang alami untuk tindakan meminjamkan, tanpa membatasi objeknya hanya pada uang.
- source_word: μηδὲν ἀπελπίζοντες
  choice: tanpa mengharapkan apa pun kembali
  rationale: Dalam konteks memberi pinjaman dan tindakan tanpa pamrih, frasa ini paling mungkin menyatakan tidak mengharapkan pengembalian. Kemungkinan arti lain dipertahankan dalam catatan kaki.
- source_word: μισθὸς ὑμῶν πολύς
  choice: upahmu akan besar
  rationale: '''Upah'' mempertahankan gagasan balasan atau ganjaran, sedangkan ''besar'' merupakan predikat yang alami bagi πολύς.'
- source_word: υἱοὶ Ὑψίστου
  choice: anak-anak Yang Mahatinggi
  rationale: Dalam ungkapan relasional ini, bentuk jamak υἱοί dapat bersifat representatif bagi para murid secara keseluruhan; 'anak-anak' mengomunikasikan cakupan tersebut secara alami dalam bahasa Indonesia. Bentuk harfiahnya dicatat.
- source_word: χρηστός
  choice: baik hati
  rationale: Menangkap kemurahan dan kebajikan Allah kepada orang yang tidak layak menerimanya, bukan sekadar sifat 'baik' secara umum.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: orang-orang yang tidak tahu berterima kasih dan orang-orang jahat
  rationale: Padanan jelas dan modern yang mempertahankan kedua kelompok atau sifat yang disebutkan dalam bahasa Yunani.
theological_decisions:
- issue: Cakupan dan bentuk υἱοὶ Ὑψίστου
  choice: anak-anak Yang Mahatinggi
  alternative: putra-putra Yang Mahatinggi
  rationale: Bahasa Yunani memakai nomina maskulin jamak υἱοί, tetapi dalam konteks sapaan kepada para murid ungkapan itu dapat mencakup laki-laki dan perempuan secara representatif. Teks utama memakai bahasa Indonesia yang alami dan inklusif, sementara bentuk leksikal maskulinnya dijelaskan dalam catatan.
- issue: Penafsiran μηδὲν ἀπελπίζοντες
  choice: tanpa mengharapkan apa pun kembali
  alternative: tanpa berputus asa terhadap siapa pun; tidak pernah kehilangan harapan
  rationale: Konteks langsung membahas pemberian pinjaman serta pelepasan pola timbal balik, sehingga tidak mengharapkan pengembalian paling sesuai. Karena konstruksi Yunani ini sulit dan pernah dipahami secara berbeda, alternatifnya dicatat tanpa dihapus.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk perintah memakai akhiran -lah untuk ketegasan yang tetap alami. Pronomina 'Ia' mempertahankan register hormat bagi Allah; bentuk jamak orang kedua diterjemahkan dengan 'kamu' sesuai kebiasaan bahasa Indonesia, karena jumlahnya dipahami dari konteks.
