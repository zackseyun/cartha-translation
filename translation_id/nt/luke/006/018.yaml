  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: id
  text: yang datang untuk mendengarkan Dia dan untuk disembuhkan dari penyakit-penyakit mereka; dan mereka yang diganggu oleh roh-roh najis[a] disembuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan mereka yang ditindas oleh roh-roh najis disembuhkan.” Kata Yunani yang diterjemahkan “diganggu” juga dapat berarti “disiksa”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: yang datang
  rationale: Kata ganti relatif menghubungkan ayat ini dengan orang banyak pada ayat sebelumnya; bentuk ini menjadi kelanjutan yang alami dalam bahasa Indonesia.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: untuk mendengarkan Dia
  rationale: Infinitif menyatakan tujuan kedatangan mereka. 'Mendengarkan' secara alami menunjukkan bahwa mereka datang untuk menyimak pengajaran Yesus.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: disembuhkan dari penyakit-penyakit mereka
  rationale: Bentuk pasif ἰαθῆναι diterjemahkan 'disembuhkan', sedangkan ἀπό mempertahankan gagasan dilepaskan dari penyakit. Bentuk jamak dipertahankan.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: yang diganggu oleh roh-roh najis
  rationale: ἐνοχλούμενοι menyatakan orang-orang yang mengalami gangguan atau penderitaan; 'diganggu' tidak melebihkan kadar intensitasnya. 'Roh-roh najis' mempertahankan ungkapan khas Injil dan bentuk jamaknya.
- source_word: ἐθεραπεύοντο
  choice: sedang disembuhkan
  rationale: Bentuk imperfek pasif menggambarkan tindakan penyembuhan yang sedang berlangsung atau berulang dalam adegan tersebut.
theological_decisions:
- issue: Makna πνευμάτων ἀκαθάρτων dalam konteks gangguan rohani
  choice: roh-roh najis
  alternative: roh-roh tidak murni; setan-setan
  rationale: '''Roh-roh najis'' mempertahankan istilah sumber dan resonansi biblisnya tanpa menggantinya dengan ''setan-setan'', yang lebih interpretatif.'
- issue: Aspek imperfek ἐθεραπεύοντο
  choice: sedang disembuhkan
  alternative: disembuhkan
  rationale: Kata 'sedang' mempertahankan aspek tindakan yang berlangsung dalam adegan, meskipun terjemahan sederhana 'disembuhkan' juga mungkin dalam bahasa Indonesia.
- issue: Hubungan καί sebelum οἱ ἐνοχλούμενοι
  choice: pun
  alternative: dan
  rationale: '''Pun'' secara alami menghubungkan kelompok orang yang diganggu roh najis dengan kegiatan penyembuhan, tanpa memastikan apakah mereka kelompok terpisah sepenuhnya atau bagian dari kerumunan yang sama.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang mengalir dari ayat sebelumnya. Huruf kapital pada 'Dia' mengikuti kebiasaan penghormatan dalam penerjemahan Alkitab bahasa Indonesia. Istilah 'roh-roh najis' dipertahankan sebagai idiom biblis yang sudah dikenal.
