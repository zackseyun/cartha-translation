  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: id
  text: Berkatilah orang-orang yang mengutuk kamu; berdoalah bagi orang-orang yang memperlakukan kamu dengan buruk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Berkatilah
  rationale: Bentuk perintah jamak ini paling wajar diterjemahkan dengan “Berkatilah”; pilihan tersebut mempertahankan daya perintah dan pertentangannya dengan tindakan mengutuk.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: orang-orang yang mengutuk kamu
  rationale: Partisip dengan artikel berfungsi sebagai nomina, yakni orang-orang yang melakukan tindakan mengutuk. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur perkataan bermusuhan.
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Bentuk perintah kini diterjemahkan secara langsung dan alami. Aspek kini dapat menyiratkan sikap yang terus dilakukan, tetapi tidak perlu dibuat eksplisit dalam terjemahan.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: bagi orang-orang yang memperlakukan kamu dengan buruk
  rationale: περί bersama προσεύχομαι bermakna “bagi/untuk.” ἐπηρεάζω mencakup perlakuan bermusuhan seperti menghina, menyalahgunakan, atau memperlakukan dengan buruk; rumusan ini mempertahankan cakupan makna tanpa membatasinya pada hinaan verbal.
theological_decisions:
- issue: Cakupan perintah untuk mengasihi musuh
  choice: Menyampaikan kedua perintah secara langsung sebagai tuntutan etis tanpa penjelasan doktrinal tambahan.
  alternative: Menambahkan batasan atau uraian tentang bentuk berkat dan doa yang dimaksud.
  rationale: Teks memberikan perintah langsung tentang tanggapan terhadap permusuhan. Ketegangan etisnya perlu dipertahankan tanpa memasukkan batasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kamu” mempertahankan sapaan orang kedua jamak dari konteks tanpa memakai bentuk yang terlalu formal. Frasa “memperlakukan kamu dengan buruk” dipilih agar cakupan ἐπηρεάζω tetap luas dan mudah dipahami.
