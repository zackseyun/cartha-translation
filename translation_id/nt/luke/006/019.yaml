  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: id
  text: Semua orang dalam kerumunan itu berusaha menyentuh-Nya, karena kuasa keluar dari-Nya dan menyembuhkan mereka semua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: seluruh orang banyak itu
  rationale: Mempertahankan cakupan menyeluruh dari πᾶς dan nomina kolektif ὄχλος dalam ungkapan Indonesia yang lazim dalam ragam Alkitab modern.
- source_word: ἐζήτουν
  choice: berusaha
  rationale: Imperfek menunjukkan tindakan yang sedang berlangsung atau berulang; dalam bahasa Indonesia aspek ini cukup jelas dari konteks tanpa harus selalu menambahkan 'terus'.
- source_word: ἅπτεσθαι
  choice: menyentuh
  rationale: Dalam konteks penyembuhan, ἅπτομαι secara alami berarti melakukan sentuhan atau kontak dengan seseorang.
- source_word: δύναμις
  choice: kuasa
  rationale: Menyampaikan daya efektif yang menghasilkan penyembuhan tanpa menambahkan kata 'mukjizat', yang hanya tersirat oleh konteks.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: keluar dari diri-Nya
  rationale: Menyatakan gerak yang berasal dari Yesus dan mempertahankan gambaran hidup tentang kuasa yang keluar dari-Nya.
- source_word: ἰᾶτο
  choice: menyembuhkan
  rationale: Imperfek menggambarkan kegiatan penyembuhan yang berlangsung; koordinasi dengan 'keluar' terasa alami dalam bahasa Indonesia.
- source_word: πάντας
  choice: mereka semua
  rationale: Membuat objek jamak yang tersirat menjadi jelas dan mempertahankan cakupan penuh πάντας.
theological_decisions:
- issue: Sifat δύναμις yang keluar dari Yesus
  choice: kuasa keluar dari diri-Nya
  alternative: kuasa mukjizat keluar dari diri-Nya
  rationale: Teks menyatakan bahwa Yesus adalah sumber kuasa penyembuhan, tetapi tidak secara eksplisit memakai kata yang berarti 'mukjizat'; karena itu terjemahan tidak memperluas klaim teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerjemahan Alkitab Indonesia. Tidak diperlukan catatan kaki karena perbedaan 'keluar/pergi keluar' tidak menghasilkan alternatif bermakna dalam bahasa Indonesia.
