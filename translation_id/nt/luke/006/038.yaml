source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: id
  text: 'Berilah, maka akan diberikan kepadamu: takaran yang baik—dipadatkan, diguncang hingga isinya merapat, dan meluber[a]—akan mereka berikan ke dalam lipatan jubahmu[b]. Sebab, dengan takaran yang kamu gunakan untuk menakar, akan ditakar kembali kepadamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengalir melampaui tepinya.” Gambarannya ialah wadah yang diisi begitu penuh sehingga isinya tumpah melewati tepinya.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke pangkuanmu.” Kata ini dapat menunjuk lipatan bagian depan jubah yang digunakan untuk menampung barang yang ditakar.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Berilah
  rationale: Imperatif kini aktif jamak. Bentuk “Berilah” menyampaikan perintah umum secara wajar tanpa mempertegas aspek berulang yang tidak harus dinyatakan.
- source_word: δοθήσεται ὑμῖν
  choice: akan diberikan kepadamu
  rationale: Bentuk pasif futur dengan datif penerima dipertahankan, termasuk agen yang tidak disebutkan.
- source_word: μέτρον καλὸν
  choice: suatu takaran yang baik
  rationale: “Takaran” mempertahankan gambaran jumlah yang diukur atau wadah pengukur; “baik” tidak mempersempit καλόν menjadi tafsiran “murah hati”.
- source_word: πεπιεσμένον
  choice: dipadatkan
  rationale: Menggambarkan isi wadah yang ditekan agar lebih banyak dapat dimuat; bentuk ringkas ini alami dalam bahasa Indonesia.
- source_word: σεσαλευμένον
  choice: diguncang hingga isinya merapat
  rationale: Dalam konteks bahan curah, wadah diguncang agar isinya turun dan merapat. Ungkapan ini memperjelas gambaran konkret tanpa mengubah maknanya.
- source_word: ὑπερεκχυννόμενον
  choice: melimpah
  rationale: Partisip kini ini menggambarkan isi yang begitu penuh sehingga meluber; “melimpah” mempertahankan kelimpahan serta cocok dengan rangkaian adjektival.
- source_word: δώσουσιν
  choice: akan mereka tuangkan
  rationale: Bentuk aktif orang ketiga jamak dengan subjek tak tentu dipertahankan sebagai “mereka”; “tuangkan” sesuai dengan gerakan memasukkan barang terukur ke lipatan pakaian dalam gambaran ini.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: ke lipatan pakaianmu
  rationale: κόλπος di sini menunjuk bagian depan jubah yang dilipat dan digunakan untuk menampung barang. Terjemahan ini lebih jelas secara budaya daripada “pangkuan” dalam bahasa Indonesia modern.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Sebab, dengan takaran yang kamu gunakan untuk menakar
  rationale: Mempertahankan metafora takaran dan hubungan relatifnya dengan ungkapan Indonesia yang alami.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: akan ditakar kembali kepadamu
  rationale: Bentuk pasif futur dan unsur timbal balik dalam ἀντί dipertahankan melalui kata “kembali”, tanpa menentukan agennya.
theological_decisions:
- issue: Apakah pemberian dalam ayat ini dibatasi pada uang atau sedekah
  choice: Mempertahankan perintah memberi dan prinsip takaran timbal balik dalam arti luas.
  alternative: Menafsirkannya secara khusus sebagai pemberian uang atau sedekah.
  rationale: Bahasa Yunani tidak menyebut uang, sedangkan konteks dekatnya mencakup belas kasihan, tidak menghakimi, pengampunan, dan kemurahan. Terjemahan tidak membatasi cakupannya atau memasukkan gagasan kemakmuran materi.
- issue: Identitas pihak yang memberi sebagai balasan
  choice: Mempertahankan subjek jamak tak tentu “mereka” pada δώσουσιν dan bentuk pasif tanpa agen pada klausa terakhir.
  alternative: Menentukan Allah atau manusia sebagai agen pemberian balasan.
  rationale: Teks beralih dari pasif tanpa agen ke bentuk orang ketiga jamak tak tentu, lalu kembali ke pasif. Menentukan satu agen akan menyelesaikan ambiguitas yang dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti tunggal “kamu” mengikuti bentuk jamak Yunani secara kolektif dalam pepatah umum; bentuk Indonesia tidak menandai jumlah. Semua penanda catatan kaki ditempatkan langsung dalam teks.
