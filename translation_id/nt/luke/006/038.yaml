  to: 'Berilah, maka akan diberikan kepadamu: takaran yang baik—dipadatkan, diguncang hingga isinya merapat, dan meluber[a]—akan mereka berikan ke dalam lipatan jubahmu[b]. Sebab, dengan takaran yang kamu gunakan untuk menakar, akan ditakar kembali kepadamu.'
