id: LUK.6.2
reference: Luke 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: id
  text: Namun, beberapa orang Farisi berkata, “Mengapa kalian melakukan sesuatu yang tidak diperbolehkan pada hari Sabat?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: beberapa orang
  rationale: Menunjukkan sebagian dari kelompok orang Farisi, bukan seluruhnya, dan terdengar alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan bernuansa pertentangan dari tindakan para murid pada ayat sebelumnya menuju keberatan orang Farisi.
- source_word: τῶν Φαρισαίων
  choice: orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok Yahudi ini; konstruksi partitifnya tercermin dalam frasa 'beberapa orang Farisi'.
- source_word: εἶπαν
  choice: berkata
  rationale: Bentuk aoris menyajikan peristiwa ujaran secara sederhana.
- source_word: Τί ποιεῖτε
  choice: Mengapa kalian melakukan
  rationale: Τί secara harfiah dapat berarti 'apa', tetapi dalam pertanyaan yang menggugat tindakan ini berfungsi idiomatis sebagai 'mengapa'. Bentuk jamak ποιεῖτε dinyatakan jelas dengan 'kalian'.
- source_word: ὃ
  choice: sesuatu yang
  rationale: Merujuk pada tindakan yang sedang dipersoalkan dan menghasilkan konstruksi Indonesia yang alami.
- source_word: οὐκ ἔξεστιν
  choice: tidak diperbolehkan
  rationale: Menyatakan bahwa tindakan itu dianggap tidak diizinkan menurut ketentuan yang berlaku, tanpa menambahkan penilaian bahwa tuduhan tersebut benar.
- source_word: τοῖς σάββασιν
  choice: pada hari Sabat
  rationale: Walaupun bentuk Yunaninya jamak, ungkapan ini lazim dipakai secara idiomatis untuk hari Sabat. Bentuk tunggal merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Status larangan yang dikemukakan orang Farisi
  choice: tidak diperbolehkan
  alternative: melanggar hukum
  rationale: Terjemahan mempertahankan isi tuduhan sebagai perkataan orang Farisi dan tidak memperkuatnya menjadi pernyataan narator bahwa tindakan itu sungguh melanggar hukum.
- issue: Bentuk jamak ungkapan Sabat
  choice: pada hari Sabat
  alternative: pada hari-hari Sabat
  rationale: τοῖς σάββασιν berbentuk jamak, tetapi merupakan idiom umum yang merujuk pada hari Sabat. Terjemahan tunggal lebih alami dalam bahasa Indonesia dan tidak mengubah pokok perselisihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' mempertahankan orang kedua jamak dalam ποιεῖτε. 'Namun' menyampaikan kontras ringan, sedangkan 'tidak diperbolehkan' menjaga nuansa hukum-keagamaan tanpa terdengar kaku.
source_grounding:
  english_pob_role: consult_only
