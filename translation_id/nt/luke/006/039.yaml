id: LUK.6.39
reference: Luke 6:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: id
  text: Ia juga menyampaikan sebuah perumpamaan kepada mereka, “Dapatkah orang buta menuntun orang buta? Bukankah keduanya akan jatuh ke dalam lubang?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “parit” untuk “lubang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: juga
  rationale: Bersama δὲ, kata ini memberi nuansa tambahan; 'juga' mempertahankannya secara alami dalam bahasa Indonesia.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: Istilah baku dan mudah dipahami untuk perkataan atau perbandingan figuratif dalam Injil.
- source_word: Μήτι δύναται
  choice: Dapatkah
  rationale: Bentuk tanya retoris ini mengharapkan jawaban negatif; 'Dapatkah' mempertahankan bentuk pertanyaan tanpa memperberat ungkapan.
- source_word: τυφλὸς ... τυφλὸν
  choice: orang buta ... orang buta
  rationale: Adjektiva maskulin tunggal Yunani dipakai secara substantival dan representatif. Bahasa Indonesia secara wajar memakai 'orang buta', yang tidak menambahkan gender yang tidak perlu dan tetap mempertahankan makna umum.
- source_word: ὁδηγεῖν
  choice: menuntun
  rationale: '''Menuntun'' cocok dengan gambaran seseorang mengarahkan langkah orang lain di jalan.'
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban positif dan terdengar alami dalam bahasa Indonesia.
- source_word: ἀμφότεροι
  choice: keduanya
  rationale: Menyatakan dengan ringkas bahwa dua orang tersebut mengalami akibat yang sama.
- source_word: βόθυνον
  choice: lubang
  rationale: Kata Yunani ini dapat menunjuk lubang atau parit; 'lubang' merupakan padanan luas dan alami, sementara 'parit' dicatat sebagai alternatif.
- source_word: ἐμπεσοῦνται
  choice: akan jatuh ke dalam
  rationale: Mempertahankan aspek futur dan arah yang dinyatakan oleh εἰς.
theological_decisions:
- issue: Bentuk maskulin substantival τυφλός
  choice: orang buta ... orang buta
  alternative: seorang laki-laki buta ... seorang laki-laki buta
  rationale: Walaupun bentuk Yunani secara gramatikal maskulin tunggal, daya ungkapnya representatif dalam pepatah. 'Orang buta' adalah bentuk Indonesia yang alami dan tidak membatasi penerapannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, baku, lugas, dan bermartabat. 'Ia' menghindari kerancuan bentuk hormat, sedangkan pola dua pertanyaan mempertahankan daya retoris teks Yunani.
