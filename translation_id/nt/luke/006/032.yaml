  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: id
  text: Jika kalian mengasihi orang-orang yang mengasihi kalian, penghargaan apa bagi kalian?[a] Sebab, orang-orang berdosa pun mengasihi orang-orang yang mengasihi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anugerah apa bagi kalian?” Kata Yunani yang dipakai dapat berarti “anugerah”, “perkenanan”, “terima kasih”, atau “penghargaan”; di sini maksudnya ialah apa yang patut dipuji atau dihargai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: mengasihi
  rationale: Dipakai secara konsisten pada ketiga kemunculan untuk mempertahankan pengulangan dan kaitan leksikal dalam bahasa Yunani.
- source_word: ποία
  choice: apa
  rationale: Secara alami membentuk pertanyaan retoris tentang penghargaan atau kelayakan yang diperoleh.
- source_word: χάρις
  choice: penghargaan yang layak diterima
  rationale: Dalam konteks ini menunjuk pada pengakuan atau pujian atas tindakan yang patut dihargai, bukan terutama anugerah keselamatan. Ungkapan ini lebih jelas bagi pembaca Indonesia modern daripada terjemahan harfiah 'anugerah'.
- source_word: ἁμαρτωλοὶ
  choice: orang-orang berdosa
  rationale: Menerjemahkan adjektiva substantival secara alami sambil mempertahankan kategori moral dalam teks sumber.
- source_word: καὶ γὰρ
  choice: Sebab ... pun
  rationale: ‘Sebab’ menyatakan alasan pendukung, sedangkan ‘pun’ mempertahankan penekanan inklusif καί.
- source_word: ὑμῖν
  choice: kalian ... terima
  rationale: Makna datif dinyatakan secara idiomatis melalui konstruksi ‘yang layak kalian terima’.
theological_decisions:
- issue: Makna χάρις dalam perkataan Yesus
  choice: penghargaan atau pujian yang layak diterima, bukan istilah teknis tentang anugerah keselamatan
  alternative: anugerah; terima kasih; jasa
  rationale: Konteks membandingkan perilaku yang patut dipuji dengan kasih timbal balik yang juga dilakukan orang berdosa. Catatan kaki mempertahankan keluasan makna kata Yunani tanpa memasukkan pengertian soteriologis yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia standar modern dengan sapaan jamak ‘kalian’, sesuai bentuk jamak Yunani. Susunan dibuat alami dan bermartabat, sementara pengulangan ‘mengasihi’ dipertahankan demi daya retoris.
