  source_fidelity: Pengulangan ἀγαπάω diterjemahkan dengan baik dan konsisten sebagai “mengasihi”; “orang-orang berdosa pun” juga menyampaikan οἱ ἁμαρτωλοὶ serta penekanan καί dengan tepat. Namun, “penghargaan apa yang layak kalian terima?” menambahkan gagasan kelayakan dan penerimaan yang tidak dinyatakan secara eksplisit dalam ποία ὑμῖν χάρις ἐστίν. Bentuk yang lebih langsung mempertahankan pertanyaan tentang ‘penghargaan/kredit’ bagi pendengar.
  naturalness: Bahasa draft umumnya modern dan jelas. “Penghargaan apa bagi kalian?” lebih ringkas dan idiomatis dalam pertanyaan retoris ini daripada konstruksi “yang layak kalian terima,” tanpa mengurangi daya retorisnya.
  terminology: “Mengasihi” sesuai register Alkitab Indonesia modern dan menjaga keterkaitan leksikal. “Penghargaan” merupakan pilihan yang aman untuk χάρις dalam konteks ini, yang menunjuk pada pengakuan atau pujian, bukan anugerah keselamatan. Catatan kaki mempertahankan alternatif leksikal tanpa memaksakan pembacaan teologis.
