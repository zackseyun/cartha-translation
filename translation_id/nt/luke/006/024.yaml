  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: id
  text: Namun, celakalah kalian yang kaya, karena kalian telah menerima penghiburan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalian telah menerima penghiburan kalian sepenuhnya.” Kata kerja Yunaninya dapat mengandung arti menerima secara penuh apa yang menjadi hak seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai pertentangan kuat dengan ucapan-ucapan bahagia sebelumnya dalam bahasa Indonesia modern dan wajar.
- source_word: οὐαὶ
  choice: celakalah
  rationale: Mempertahankan daya ungkapan profetis yang menyatakan peringatan dan penghukuman, bukan sekadar keluhan sedih.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: kamu yang kaya
  rationale: Menyampaikan sapaan langsung kepada kelompok orang kaya tanpa menambahkan alasan atau pembatas yang tidak terdapat dalam teks Yunani.
- source_word: ὅτι
  choice: karena
  rationale: Menunjukkan bahwa klausa berikutnya memberikan alasan bagi ucapan celaka tersebut.
- source_word: ἀπέχετε
  choice: telah menerima
  rationale: Dalam konteks penerimaan balasan, verba ini dapat berarti menerima atau memiliki apa yang menjadi bagian seseorang, bahkan menerimanya secara penuh. Bentuk ini alami dalam bahasa Indonesia, sedangkan nuansa 'sepenuhnya' dicatat dalam catatan kaki.
- source_word: παράκλησιν
  choice: penghiburan
  rationale: Mencakup gagasan comfort atau consolation dan cocok dengan kontras antara keadaan nyaman sekarang dan pembalikan yang tersirat dalam konteks.
- source_word: ὑμῶν
  choice: -mu
  rationale: Mempertahankan bentuk posesif orang kedua jamak secara ringkas; dalam bahasa Indonesia, bentuk 'kamu' dan '-mu' dapat merujuk kepada lebih dari satu orang berdasarkan konteks.
theological_decisions:
- issue: Sifat peringatan kepada orang kaya
  choice: Ucapan ini diterjemahkan sebagai pernyataan celaka yang langsung ditujukan kepada orang kaya.
  alternative: Melunakkannya menjadi ungkapan penyesalan, atau memperluasnya menjadi 'orang yang mengandalkan kekayaan'.
  rationale: Teks Yunani secara langsung menyapa orang kaya dan tidak menyebut sikap batin atau syarat tambahan tertentu.
- issue: Nuansa waktu dan kelengkapan pada ἀπέχετε
  choice: Teks utama memakai 'telah menerima', dengan kemungkinan arti 'telah menerima sepenuhnya' dalam catatan kaki.
  alternative: Memakai bentuk progresif 'sedang menerima' atau memasukkan 'sepenuhnya' langsung ke dalam teks utama.
  rationale: Walaupun berbentuk kini, ἀπέχετε dapat menjadi ungkapan idiomatis tentang penerimaan yang sudah diperoleh atau diterima penuh. Penyajian ini menjaga nuansa tersebut tanpa menutup ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Namun' menjaga peralihan kontras, sedangkan 'celakalah' mempertahankan bobot profetis ucapan tersebut.
