  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: id
  text: 'Lalu Yesus menjawab mereka, “Belum pernahkah kalian membaca ini: apa yang dilakukan Daud ketika ia dan orang-orang yang bersamanya lapar?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν
  choice: Lalu Yesus menjawab mereka
  rationale: Ungkapan partisip + verba finit ini merupakan idiom Koine yang secara alami berarti ‘menjawab’. ‘Lalu’ menghubungkannya dengan konteks, sedangkan ‘mereka’ mempertahankan πρὸς αὐτούς.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: Belum pernahkah kalian membaca
  rationale: Pertanyaan retoris ini menegur para pendengar karena tidak menerapkan kisah Kitab Suci yang semestinya mereka ketahui. ‘Belum pernahkah’ menyampaikan daya retoris οὐδέ secara alami dalam bahasa Indonesia, tanpa ungkapan kaku ‘bahkan ini tidak’.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: apa yang dilakukan Daud
  rationale: Terjemahan langsung dan alami bagi klausa relatif Yunani, dengan bentuk baku nama Daud dalam bahasa Indonesia.
- source_word: ὁπότε ἐπείνασεν
  choice: ketika ... lapar
  rationale: ‘Ketika’ menyampaikan hubungan waktu, dan ‘lapar’ merupakan padanan naratif yang wajar untuk aoristus ἐπείνασεν.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: ia dan orang-orang yang menyertainya
  rationale: Mempertahankan penyebutan eksplisit Daud beserta orang-orang yang berada bersamanya tanpa mempersempit hubungan mereka menjadi kategori tertentu seperti ‘sahabat’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan luwes. Sapaan ‘kalian’ dipakai karena αὐτούς berbentuk jamak dan Yesus sedang berbicara kepada sekelompok penentang. Susunan klausa lapar dirapikan agar subjek gabungan berlaku jelas bagi Daud dan orang-orang yang menyertainya.
