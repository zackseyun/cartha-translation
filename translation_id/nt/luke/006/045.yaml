id: LUK.6.45
reference: Luke 6:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: id
  text: Orang yang baik mengeluarkan yang baik dari perbendaharaan yang baik dalam hatinya, dan orang yang jahat mengeluarkan yang jahat dari perbendaharaan yang jahat; sebab mulutnya berbicara dari kelimpahan hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari luapan hati, mulutnya berbicara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: orang yang baik
  rationale: Dalam bahasa Indonesia, 'orang' secara wajar mewakili manusia tanpa menghilangkan bentuk tunggal atau sifat umum pepatah ini; 'yang baik' mempertahankan kategori moral ἀγαθός.
- source_word: θησαυροῦ
  choice: perbendaharaan
  rationale: Mempertahankan metafora tentang simpanan batin yang menjadi sumber perkataan dan perbuatan, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: καρδίας
  choice: hati
  rationale: Padanan baku bagi pusat batin, kehendak, dan perasaan manusia, tanpa mempersempit maknanya.
- source_word: προφέρει
  choice: mengeluarkan
  rationale: Menyampaikan gambaran sesuatu yang dibawa keluar dari sumber batin dan dapat dipakai secara alami dalam kedua klausa yang sejajar.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: jahat / yang jahat
  rationale: Mempertahankan bobot moral πονηρός dan kesejajarannya dengan 'baik'; 'buruk' berpotensi terdengar sekadar menilai mutu.
- source_word: περισσεύματος
  choice: kelimpahan
  rationale: Menyatakan isi hati yang berlimpah dan menjadi sumber ucapan; kemungkinan nuansa 'luapan' dipertahankan dalam catatan kaki.
- source_word: λαλεῖ
  choice: berbicara
  rationale: Padanan Indonesia yang alami dan cukup khidmat untuk ucapan pepatah ini.
- source_word: τὸ στόμα αὐτοῦ
  choice: mulutnya
  rationale: Mempertahankan penyebutan eksplisit 'mulut' sebagai ungkapan lahiriah dari isi hati.
theological_decisions:
- issue: Kontras antropologis dan etis dalam ἀγαθός/πονηρός
  choice: Mempertahankan kategori moral 'baik' dan 'jahat'.
  alternative: orang yang baik ... orang yang buruk
  rationale: Ayat ini membahas watak moral dan hasil lahiriahnya; 'jahat' mempertahankan daya etis πονηρός dan kontrasnya dengan ἀγαθός.
- issue: Hubungan kelimpahan hati dengan perkataan
  choice: Mempertahankan metafora bahwa mulut berbicara dari kelimpahan hati.
  alternative: mulut mengucapkan apa yang meluap dari hati
  rationale: Susunan ini dekat dengan bahasa Yunani dan tidak secara berlebihan menentukan apakah περισσεύματος terutama berarti kelimpahan, kelebihan, atau luapan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'baik' dan 'jahat' dipertahankan untuk menampilkan simetri retoris teks Yunani. Tanda catatan kaki ditempatkan sesudah kalimat yang memuat istilah terkait.
