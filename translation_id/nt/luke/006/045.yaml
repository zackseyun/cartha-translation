  - severity: low
    issue: Posesif pada "perbendaharaannya yang jahat" lebih eksplisit daripada teks SBLGNT.
    rationale: Klausa kedua dalam SBLGNT memakai elipsis "dari yang jahat"; melengkapi nomina "perbendaharaan" dapat dibenarkan, tetapi posesif tidak perlu ditambahkan.
