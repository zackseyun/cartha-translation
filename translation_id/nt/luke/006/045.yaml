revisions:
- from: Orang yang baik mengeluarkan apa yang baik dari perbendaharaan hatinya yang baik, dan orang yang jahat mengeluarkan apa yang jahat dari perbendaharaannya yang jahat. Sebab, dari kelimpahan hati, mulutnya berbicara.[a]
  to: Orang yang baik mengeluarkan yang baik dari perbendaharaan yang baik dalam hatinya, dan orang yang jahat mengeluarkan yang jahat dari perbendaharaan yang jahat; sebab mulutnya berbicara dari kelimpahan hati.[a]
  rationale: Revisi memindahkan "yang baik" agar tanpa ragu menerangkan "perbendaharaan", bukan "hati". Klausa kedua mempertahankan elipsis sumber dengan menyebut "perbendaharaan yang jahat" secara paralel, tetapi tidak memaksakan posesif. Tidak ada perubahan pada makna etis, metafora hati, atau ambiguitas leksikal περισσεύματος.
