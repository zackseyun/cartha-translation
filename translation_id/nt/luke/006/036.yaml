  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: id
  text: Hendaklah kalian berbelas kasih[a], sama seperti Bapa kalian berbelas kasih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuh belas kasih.” Kata sifat Yunani ini menggambarkan orang yang tergerak oleh rasa iba dan menunjukkan belas kasihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Hendaklah kalian
  rationale: Imperatif kini orang kedua jamak ini menyampaikan ajakan yang terus berlaku. Bentuk “hendaklah kalian” alami dan bermartabat dalam bahasa Indonesia serta menandai bahwa perintah ditujukan kepada lebih dari satu orang.
- source_word: οἰκτίρμονες
  choice: berbelas kasih
  rationale: Adjektiva ini menunjuk pada orang yang tergerak oleh belas kasihan dan menunjukkan kemurahan hati. Frasa “berbelas kasih” jelas bagi pembaca modern dan dapat dipakai secara konsisten pada kedua kemunculannya.
- source_word: καθὼς
  choice: sama seperti
  rationale: Kata ini memperkenalkan perbandingan atau teladan; “sama seperti” mempertahankan karakter Bapa sebagai pola bagi perilaku para murid, bukan mengubahnya menjadi alasan sebab-akibat.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Bapa kalian
  rationale: Teks Yunani hanya menyebut “Bapa kalian”, tanpa kata “surgawi”. Huruf kapital menandai sapaan bagi Allah tanpa menambahkan unsur yang tidak terdapat dalam sumber.
- source_word: οἰκτίρμων
  choice: berbelas kasih
  rationale: Pilihan yang sama mempertahankan kaitan leksikal antara perintah kepada para murid dan sifat Bapa yang menjadi teladan.
theological_decisions:
- issue: Hubungan perintah dengan karakter Bapa
  choice: 'Karakter Bapa disajikan sebagai pola: “sama seperti Bapa kalian berbelas kasih.”'
  alternative: “Berbelas kasihlah karena Bapa kalian berbelas kasih.”
  rationale: καθὼς paling wajar menyatakan perbandingan, bukan sebab. Terjemahan ini mempertahankan motif peneladanan etis tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk menyatakan orang kedua jamak yang eksplisit dalam bahasa Yunani; susunan paralel dipertahankan agar hubungan antara tindakan para murid dan karakter Bapa tetap jelas.
