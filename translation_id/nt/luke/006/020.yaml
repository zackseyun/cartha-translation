id: LUK.6.20
reference: Luke 6:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: id
  text: Lalu Ia mengangkat pandangan-Nya ke arah murid-murid-Nya dan berkata, “Berbahagialah kalian yang miskin,[a][b] karena Kerajaan Allah adalah milik kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “orang-orang miskin.” Bentuk Yunaninya memakai orang ketiga, tetapi frasa berikutnya, “milik kalian,” menunjukkan sapaan langsung.'
    reason: lexical_alternative
  - marker: b
    text: Lukas menyebut “yang miskin,” bukan “yang miskin dalam roh” (bandingkan Mat. 5:3).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: mengangkat pandangan-Nya
  rationale: Mempertahankan gambaran konkret tentang mengarahkan mata ke atas, tetapi memakai ungkapan Indonesia yang alami.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: ke arah murid-murid-Nya
  rationale: εἰς menyatakan arah tatapan; “ke arah” menyampaikan gerak pandangan dengan jelas.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek memperkenalkan tuturan yang berlanjut, tetapi dalam narasi Indonesia “berkata” merupakan pembuka kutipan yang paling alami tanpa menambahkan makna “mulai” yang tidak dinyatakan.
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku dan bermartabat untuk ucapan bahagia; tidak membatasi maknanya pada perasaan senang sesaat.
- source_word: οἱ πτωχοί
  choice: kalian yang miskin
  rationale: Secara bentuk berarti “orang-orang miskin,” tetapi ὑμετέρα segera mengarahkan ucapan ini langsung kepada para murid. Rumusan ini mempertahankan kemiskinan tanpa menambah penafsiran rohani.
- source_word: ὅτι
  choice: karena
  rationale: Menyatakan alasan bagi ucapan bahagia secara jelas dalam bahasa Indonesia modern.
- source_word: ὑμετέρα ἐστὶν
  choice: adalah milik kalian
  rationale: Menyampaikan bentuk predikatif “adalah kepunyaan kalian” dengan susunan Indonesia yang alami dan mempertahankan penekanan orang kedua jamak.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan mapan yang tetap mencakup pemerintahan dan ranah kekuasaan Allah tanpa mempersempit cakupan semantisnya.
theological_decisions:
- issue: Apakah πτωχοί perlu diperluas menjadi “miskin dalam roh”
  choice: miskin
  alternative: miskin dalam roh
  rationale: Teks Lukas hanya menyebut “orang-orang miskin.” Terjemahan tidak menyelaraskannya secara diam-diam dengan Matius 5:3.
- issue: Apakah ucapan bahagia berbentuk orang ketiga atau sapaan langsung
  choice: kalian yang miskin
  alternative: orang-orang miskin
  rationale: οἱ πτωχοί secara gramatikal berbentuk orang ketiga, tetapi ὑμετέρα (“milik kalian”) menunjukkan bahwa Yesus menyapa para murid secara langsung. Catatan kaki mempertahankan bentuk formal Yunani.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat dan mudah dipahami. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas; kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
