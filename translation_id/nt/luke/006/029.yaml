  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: id
  text: Kepada orang yang memukulmu di pipi[a], sodorkan juga pipi yang lain[b]. Dan jangan menghalangi orang yang mengambil jubahmu[c] untuk mengambil baju dalammu juga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rahangmu.”
    reason: lexical_alternative
  - marker: b
    text: Terjemahan tradisional sering berbunyi “putarlah pipi yang lain,” tetapi kata Yunani di sini lebih harfiah berarti “sodorkan” atau “berikan.”
    reason: alternative_reading
  - marker: c
    text: “Jubah” adalah pakaian luar (ἱμάτιον), sedangkan “baju dalam” adalah pakaian yang dikenakan di sebelah dalam (χιτών).
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: kepada orang yang memukulmu
  rationale: Partisipel berartikel ini menunjuk secara umum kepada orang yang melakukan tindakan tersebut. Bentuk “kepada orang yang memukul” alami dalam bahasa Indonesia dan mempertahankan arah perintah dalam bahasa Yunani.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: pipi
  rationale: σιαγών dapat berarti rahang atau pipi. Dalam konteks pukulan pada wajah, “pipi” merupakan padanan Indonesia yang alami, sementara kemungkinan “rahang” dicatat dalam catatan kaki.
- source_word: πάρεχε
  choice: sodorkan
  rationale: παρέχω berarti menyediakan, memberikan, atau menghadirkan. “Sodorkan” menyampaikan tindakan menghadirkan pipi yang lain tanpa menyelaraskannya dengan kata “berikan/putar” dari tradisi atau Injil paralel.
- source_word: καὶ τὴν ἄλλην
  choice: juga pipi yang lain
  rationale: Nomina “pipi” dijelaskan kembali agar rujukan ἄλλην jelas dalam bahasa Indonesia, sedangkan καί diterjemahkan “juga” untuk mempertahankan penekanannya.
- source_word: ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον
  choice: dari orang yang mengambil jubahmu
  rationale: Terjemahan ini mempertahankan konstruksi ἀπό dan arti αἴρω sebagai mengambil atau membawa pergi. “Jubah” menandai pakaian luar dan membedakannya dari χιτών.
- source_word: τὸν χιτῶνα
  choice: baju dalammu
  rationale: χιτών adalah pakaian yang dikenakan di sebelah dalam. “Baju dalam” lebih mudah dipahami pembaca Indonesia masa kini daripada istilah historis “tunik”, sekaligus mempertahankan perbedaannya dari jubah luar.
- source_word: μὴ κωλύσῃς
  choice: jangan pula menahan
  rationale: κωλύω berarti menghalangi, mencegah, atau melarang. Dalam konteks penyerahan pakaian, “jangan menahan” secara alami menyatakan agar pakaian dalam itu pun tidak ditahan darinya.
theological_decisions:
- issue: Apakah perkataan Lukas harus diselaraskan dengan rumusan yang lebih dikenal dari Matius, “berikanlah/putarlah pipi yang lain”
  choice: Mempertahankan kata khas Lukas dengan “sodorkan juga pipi yang lain”
  alternative: “Berikanlah/putarlah pipi yang lain”
  rationale: Teks Lukas memakai πάρεχε, yaitu “sediakan/hadirkan/sodorkan”, bukan verba στρέφω yang berarti memutar. Pilihan ini menjaga kekhasan redaksi Lukas.
- issue: Apakah perintah ini perlu diberi batasan penafsiran dalam teks utama
  choice: Menerjemahkan kedua imperatif secara langsung tanpa pelunakan atau penjelasan doktrinal
  alternative: Menambahkan pembatas seperti “jangan membalas” atau menyebutnya sebagai hiperbola
  rationale: Teks sumber menyampaikan perintah langsung dan tidak memberikan pembatas tersebut. Terjemahan mempertahankan ketegangan etis dan teologisnya agar tidak memutuskan perdebatan tafsir di dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel dipertahankan sejauh tetap alami. “Sodorkan” dipilih untuk menjaga tindakan konkret dalam πάρεχε, dan “baju dalam” dipakai agar perbedaan kedua jenis pakaian langsung dipahami pembaca umum.
