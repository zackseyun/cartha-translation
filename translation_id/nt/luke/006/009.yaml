reference: Luke 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: id
  text: 'Tetapi Yesus berkata kepada mereka, “Aku bertanya kepada kalian: Apakah pada hari Sabat diperbolehkan berbuat baik atau berbuat jahat[a], menyelamatkan nyawa atau membinasakannya[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencelakakan.” Kata Yunani ini membentuk pertentangan etis antara berbuat baik dan melakukan sesuatu yang jahat atau merugikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyelamatkan jiwa atau membinasakannya.” Dalam konteks ini, “nyawa” dipilih karena yang dibicarakan ialah mempertahankan atau membinasakan hidup seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Tetapi
  rationale: Menandai peralihan yang mengandung pertentangan ringan ketika Yesus menanggapi sikap orang-orang yang mengawasi-Nya.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Aku bertanya kepada kalian
  rationale: Menyampaikan tantangan langsung Yesus dengan ungkapan Indonesia yang alami dan tetap tegas.
- source_word: εἰ ἔξεστιν
  choice: Apakah ... diperbolehkan
  rationale: Mempertahankan unsur izin menurut hukum atau kebiasaan keagamaan dalam perdebatan mengenai hari Sabat.
- source_word: τῷ σαββάτῳ
  choice: pada hari Sabat
  rationale: Padanan Indonesia yang lazim untuk keterangan waktu dan jelas menunjuk pada hari khusus yang dipersoalkan.
- source_word: ἀγαθοποιῆσαι
  choice: berbuat baik
  rationale: Mempertahankan tindakan etis yang positif serta kesejajarannya dengan kata kerja lawannya.
- source_word: κακοποιῆσαι
  choice: berbuat jahat
  rationale: Mempertahankan pertentangan etis langsung dengan 'berbuat baik'; kemungkinan makna konkret berupa tindakan yang mencelakakan dicatat dalam catatan kaki.
- source_word: ψυχὴν
  choice: nyawa
  rationale: Dalam konteks penyembuhan ini, kata tersebut menunjuk secara konkret pada hidup seseorang, bukan secara khusus pada unsur tak berjasad.
- source_word: σῶσαι
  choice: menyelamatkan
  rationale: Mempertahankan arti dasar dan kaitan leksikalnya dengan pemakaian yang lebih luas dalam Kitab Suci, sekaligus sesuai dengan gagasan mempertahankan hidup.
- source_word: ἀπολέσαι
  choice: membinasakannya
  rationale: Mempertahankan pertentangan kuat dengan 'menyelamatkan' dan tidak mempersempit maknanya menjadi 'membunuh'.
theological_decisions:
- issue: Makna ψυχή dalam frasa ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: Diterjemahkan secara konkret sebagai 'menyelamatkan nyawa atau membinasakannya'.
  alternative: '''menyelamatkan jiwa atau membinasakannya''; ''menyelamatkan seseorang atau membinasakannya'''
  rationale: Konteks langsungnya ialah perdebatan tentang penyembuhan pada hari Sabat dan tindakan yang mempertahankan atau merusak hidup manusia. Pilihan ini tidak menjadikan ayat tersebut pernyataan khusus tentang susunan hakikat manusia, sementara alternatif harfiahnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk 'Aku' dan 'kalian' membuat tuturan langsung alami serta memperjelas bahwa Yesus berbicara kepada sekelompok orang. Susunan dua pasang tindakan yang berlawanan dipertahankan.
