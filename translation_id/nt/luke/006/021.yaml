  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: id
  text: Berbahagialah kamu yang sekarang lapar[a], karena kamu akan dikenyangkan[b]. Berbahagialah kamu yang sekarang menangis, karena kamu akan tertawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berbahagialah orang-orang yang sekarang lapar ... Berbahagialah orang-orang yang sekarang menangis.” Bahasa Yunani memakai partisipel berartikel, tetapi konteks langsung dan verba orang kedua jamak mendukung sapaan langsung.
    reason: alternative_reading
  - marker: b
    text: Atau, “kamu akan dipuaskan.” Kata Yunaninya dapat berarti dibuat kenyang oleh makanan dan, dalam arti yang lebih luas, dibuat puas sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Berbahagialah
  rationale: Bentuk ini alami dalam ucapan bahagia bahasa Indonesia dan mempertahankan bobot perkenanan ilahi, bukan sekadar perasaan senang atau keadaan mujur.
- source_word: οἱ πεινῶντες νῦν
  choice: kamu yang sekarang lapar
  rationale: Partisipel berartikel secara harfiah menunjuk kepada 'orang-orang yang lapar', tetapi verba orang kedua jamak dan konteks langsung mendukung sapaan kepada para pendengar. 'Sekarang' mempertahankan kontras waktu dengan pembalikan yang akan datang.
- source_word: χορτασθήσεσθε
  choice: kamu akan dikenyangkan
  rationale: Bentuk pasif futurum dipertahankan. 'Dikenyangkan' menjaga gambaran konkret tentang rasa lapar dan makanan tanpa membatasi penggenapannya pada arti jasmani, rohani, atau eskatologis tertentu.
- source_word: οἱ κλαίοντες νῦν
  choice: kamu yang sekarang menangis
  rationale: '''Menangis'' mempertahankan arti luas κλαίω dan tidak mempersempitnya menjadi perkabungan karena kematian. Sapaan orang kedua selaras dengan verba janji yang mengikutinya.'
- source_word: γελάσετε
  choice: kamu akan tertawa
  rationale: '''Tertawa'' mempertahankan gambaran konkret dan kuat tentang pembalikan keadaan; ''bersukacita'' akan lebih interpretatif.'
theological_decisions:
- issue: Sapaan langsung atau rumusan umum orang ketiga
  choice: Menggunakan 'kamu yang ...'
  alternative: Menggunakan 'orang yang ...' atau 'mereka yang ...'
  rationale: Bahasa Yunani memakai partisipel berartikel, tetapi kedua verba janji berbentuk orang kedua jamak dan konteks ucapan bahagia Lukas merupakan sapaan langsung. Catatan kaki mempertahankan kemungkinan bentuk umum yang lebih harfiah secara gramatikal.
- issue: Sifat dan waktu pembalikan yang dijanjikan
  choice: Mempertahankan gambaran konkret 'dikenyangkan' dan 'tertawa' tanpa menentukan cara atau waktu penggenapannya
  alternative: Menafsirkannya khusus sebagai kepuasan rohani atau semata-mata pembalikan pada akhir zaman
  rationale: Ayat ini sendiri tidak menjelaskan apakah penggenapan itu bersifat jasmani, rohani, temporal, atau eskatologis; terjemahan tidak menutup ketegangan tersebut.
- issue: Pelaku dalam bentuk pasif χορτασθήσεσθε
  choice: Mempertahankan bentuk pasif 'akan dikenyangkan' tanpa menyebut pelaku
  alternative: Menambahkan 'Allah akan mengenyangkan kamu'
  rationale: Allah mungkin dipahami sebagai pelaku, tetapi teks Yunani tidak menyebutkannya secara eksplisit. Bentuk pasif menghindari penambahan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan khidmat. Susunan 'Berbahagialah kamu' mempertahankan bentuk ucapan bahagia yang dikenal luas, sedangkan 'sekarang' ditempatkan dekat dengan keadaan lapar dan menangis untuk menonjolkan kontras antara keadaan kini dan pembalikan mendatang.
