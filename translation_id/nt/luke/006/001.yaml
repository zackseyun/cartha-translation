  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: id
  text: Pada suatu hari Sabat, ketika Yesus sedang berjalan melalui ladang-ladang yang ditanami biji-bijian, murid-murid-Nya memetik dan memakan bulir-bulirnya[a] sambil menggosoknya dengan tangan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani στάχυας dapat berarti bulir atau kepala tanaman biji-bijian.
    reason: lexical_alternative
  - marker: b
    text: Mereka menggosok bulir itu dengan tangan untuk memisahkan bagian biji yang dapat dimakan.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Pada suatu
  rationale: Ungkapan peralihan naratif ini diperpadukan dengan keterangan waktu berikutnya agar alami dalam bahasa Indonesia, tanpa menambahkan kata temporal seperti “kemudian” yang tidak dinyatakan secara eksplisit.
- source_word: ἐν σαββάτῳ
  choice: hari Sabat
  rationale: Bentuk tanpa artikel menunjuk pada salah satu hari Sabat; gabungan “Pada suatu hari Sabat” menyampaikan makna tak tentu itu secara alami.
- source_word: διαπορεύεσθαι αὐτὸν
  choice: Yesus sedang berjalan melewati
  rationale: Infinitif beraspek belum selesai dinyatakan dengan “sedang”; nama “Yesus” dipakai sebagai pengganti pronomina agar rujukannya jelas dan alami dalam ayat yang berdiri sendiri.
- source_word: διὰ σπορίμων
  choice: ladang-ladang gandum
  rationale: σπόριμα adalah ladang yang ditanami biji-bijian. “Gandum” merupakan sebutan umum yang mudah dipahami dalam konteks ini, meskipun sumber tidak menetapkan jenis serealia tertentu.
- source_word: ἔτιλλον
  choice: memetik
  rationale: Menggambarkan tindakan para murid yang berlangsung ketika mereka melewati ladang; aspek progresif sudah ditopang oleh konteks “sedang berjalan”.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Murid-murid-Nya
  rationale: Padanan Indonesia yang ringkas dan lazim bagi konstruksi posesif Yunani.
- source_word: καὶ ἤσθιον
  choice: dan memakannya
  rationale: Menyatakan tindakan makan yang berlangsung bersamaan dalam rangkaian tindakan para murid.
- source_word: τοὺς στάχυας
  choice: bulir-bulir gandum
  rationale: στάχυς menunjuk pada kepala atau bulir tanaman biji-bijian; “bulir” jelas dan alami dalam bahasa Indonesia.
- source_word: ψώχοντες ταῖς χερσίν
  choice: lalu menggosok-gosoknya dengan tangan
  rationale: Partisip ini menerangkan tindakan menggosok bulir dengan tangan sebelum dimakan. “Menggosok-gosok” mempertahankan tindakan konkret dan berulang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat dipecah menjadi dua agar mudah dibaca. Urutan “menggosok ... dan memakannya” dibuat eksplisit sesuai hubungan logis tindakan, tanpa mengubah isi sumber.
