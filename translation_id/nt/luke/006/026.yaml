  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: id
  text: Celakalah kamu ketika semua orang berkata baik tentangmu, sebab nenek moyang mereka[a] biasa memperlakukan nabi-nabi palsu dengan cara yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "ayah-ayah mereka"; yang dimaksud ialah generasi-generasi terdahulu di antara mereka.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Celakalah kamu
  rationale: Mempertahankan daya seru peringatan dan kecaman profetis; penambahan 'kamu' membuat sasaran seruan jelas dan wajar dalam bahasa Indonesia.
- source_word: ὅταν
  choice: ketika
  rationale: Menyatakan keadaan umum yang mungkin terjadi dan mempertahankan bentuk peringatan yang langsung.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: berkata baik tentang kamu
  rationale: Mengungkapkan idiom berbicara secara positif mengenai seseorang tanpa menyiratkan bahwa perkataannya sekadar benar secara faktual.
- source_word: πάντες οἱ ἄνθρωποι
  choice: semua orang
  rationale: Padanan alami dan inklusif bagi sebutan umum untuk manusia.
- source_word: γάρ
  choice: sebab
  rationale: Menandai alasan yang menjelaskan seruan celaka sebelumnya.
- source_word: κατὰ τὰ αὐτά
  choice: dengan cara yang sama
  rationale: Menyatakan kesamaan pola perlakuan secara jelas dan idiomatis.
- source_word: ἐποίουν
  choice: dahulu memperlakukan
  rationale: Konteks menuntut tindakan terhadap orang, sehingga 'memperlakukan' lebih alami daripada 'melakukan'; 'dahulu' menyampaikan tindakan kebiasaan pada masa lampau yang ditandai bentuk imperfek.
- source_word: τοῖς ψευδοπροφήταις
  choice: nabi-nabi palsu
  rationale: Padanan langsung yang mempertahankan penilaian sumber terhadap para nabi tersebut.
- source_word: οἱ πατέρες αὐτῶν
  choice: nenek moyang mereka
  rationale: Dalam konteks antargenerasi, frasa ini merujuk generasi terdahulu, bukan hanya ayah biologis; 'nenek moyang' alami dalam bahasa Indonesia dan mempertahankan daya polemis historisnya.
theological_decisions:
- issue: Arti perbandingan dengan nabi-nabi palsu
  choice: Ayat ini memperingatkan bahwa pujian universal menyerupai pola penerimaan yang dahulu diberikan kepada nabi-nabi palsu.
  alternative: Ayat ini mengecam setiap perkataan positif dari orang lain tanpa pengecualian.
  rationale: γάρ dan κατὰ τὰ αὐτά menghubungkan seruan celaka dengan pola historis perlakuan terhadap nabi-nabi palsu. Terjemahan mempertahankan peringatan itu tanpa memperluasnya menjadi penolakan terhadap segala bentuk pujian.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Struktur kalimat dibuat langsung. Tidak diperlukan catatan kaki karena 'nenek moyang' sudah menyampaikan referen budaya οἱ πατέρες αὐτῶν secara tepat, sedangkan alternatif leksikal untuk καλῶς tidak menambah perbedaan makna yang cukup penting bagi edisi pembaca umum.
