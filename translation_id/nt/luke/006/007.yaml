  verdict: revise
  source_fidelity: Revisi diperlukan karena θεραπεύει tidak menyebut objek dalam ayat ini; tambahan “orang” tidak diperlukan dan sedikit mempersempit bentuk sumber. Selain itu, ἵνα εὕρωσιν menyatakan tujuan, bukan sekadar harapan atau akibat.
  naturalness: Bahasa draf pada umumnya baku dan jelas. “Agar mereka dapat menemukan” menyatakan relasi tujuan secara lebih langsung dan alami daripada “Dengan demikian, mereka berharap menemukan.”
  terminology: “Para ahli Taurat,” “orang-orang Farisi,” dan “hari Sabat” tepat serta lazim dalam bahasa Indonesia modern. Istilah “alasan untuk menuduhnya” cukup menangkap implikasi εὕρωσιν + infinitif tanpa mengubahnya menjadi tuduhan yang sudah ada.
  issues:
  - severity: medium
    issue: Tambahan objek “orang” pada “akan menyembuhkan orang”
    rationale: Verba θεραπεύει dalam teks sumber tidak memiliki objek yang dinyatakan. Konteks dekat memang memuat seorang yang sakit, tetapi ayat ini sendiri membiarkan objeknya tersirat; bahasa Indonesia dapat mempertahankan hal itu dengan “akan menyembuhkan.”
  - severity: medium
    issue: Klausa tujuan diterjemahkan sebagai “Dengan demikian, mereka berharap menemukan”
    rationale: ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ menyatakan maksud atau tujuan pengawasan mereka. “Dengan demikian” cenderung menyatakan akibat, sedangkan “berharap” melemahkan maksud yang disengaja. “Agar mereka dapat menemukan” mempertahankan fungsi purposifnya.
