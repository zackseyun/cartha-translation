revisions:
- from: Para ahli Taurat dan orang-orang Farisi mengawasi Yesus dengan saksama[a] untuk melihat apakah ia akan menyembuhkan orang pada hari Sabat. Dengan demikian, mereka berharap menemukan alasan untuk menuduhnya[b].
  to: Para ahli Taurat dan orang-orang Farisi mengawasi Yesus dengan saksama[a] untuk melihat apakah ia akan menyembuhkan pada hari Sabat, agar mereka dapat menemukan alasan untuk menuduhnya[b].
  rationale: Revisi menghapus objek yang tidak dinyatakan dalam θεραπεύει dan mengganti penghubung serta verba yang menyatakan akibat/harapan dengan klausa tujuan yang secara langsung mencerminkan ἵνα. Susunan, register, nama kelompok, dan penanda catatan kaki dipertahankan.
