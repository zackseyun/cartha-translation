source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: id
  text: Para ahli Taurat dan orang-orang Farisi mengawasi Yesus dengan saksama[a] untuk melihat apakah ia akan menyembuhkan pada hari Sabat, agar mereka dapat menemukan alasan untuk menuduhnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memperhatikan dengan teliti.” Kata Yunani ini dapat berarti pengamatan yang saksama, bahkan bernada curiga atau bermusuhan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menemukan sesuatu untuk menuduhnya,” atau cukup, “menuduhnya.” Ungkapan Yunani menyiratkan bahwa mereka mencari dasar bagi suatu tuduhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: mengawasi Yesus dengan saksama
  rationale: Bentuk imperfek menunjukkan pengamatan yang berlangsung, sedangkan konteks klausa tujuan memberi nuansa curiga dan bermusuhan. Nama Yesus disuplai dari konteks sebagai objek yang tersirat.
- source_word: γραμματεῖς
  choice: para ahli Taurat
  rationale: Istilah ini alami dan umum dalam bahasa Indonesia modern serta menjelaskan fungsi mereka sebagai orang yang memahami dan mengajarkan hukum Taurat.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok ini.
- source_word: εἰ
  choice: untuk melihat apakah
  rationale: Dalam konteks tindakan mengawasi, ungkapan ini menyampaikan pertanyaan tak langsung secara alami.
- source_word: ἐν τῷ σαββάτῳ
  choice: pada hari Sabat
  rationale: Padanan waktu yang idiomatis dalam bahasa Indonesia dan mempertahankan bentuk tunggal sumber.
- source_word: θεραπεύει
  choice: ia akan menyembuhkan orang
  rationale: Bentuk kini Yunani dalam pertanyaan tak langsung ini secara alami menjadi tindakan yang diantisipasi dari sudut pandang narasi. Kata 'orang' membuat verba transitif ini alami tanpa menentukan identitas pasien.
- source_word: ἵνα εὕρωσιν
  choice: Dengan demikian, mereka berharap menemukan
  rationale: Mengungkapkan tujuan mereka dengan bahasa Indonesia yang lancar; 'berharap' menyampaikan hasil yang mereka inginkan tanpa menyatakan bahwa mereka pasti berhasil.
- source_word: κατηγορεῖν αὐτοῦ
  choice: alasan untuk menuduhnya
  rationale: Dengan verba 'menemukan', ungkapan Yunani menyiratkan pencarian dasar atau kesempatan untuk mengajukan tuduhan.
theological_decisions:
- issue: Maksud para penentang
  choice: Pengawasan digambarkan sebagai pengamatan saksama yang bertujuan mencari alasan untuk menuduh Yesus.
  alternative: Pengamatan dapat diterjemahkan lebih netral sebagai sekadar memperhatikan apakah Yesus menyembuhkan.
  rationale: Kombinasi παρατηρέω dengan klausa tujuan ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ menunjukkan pengamatan yang diarahkan pada tuduhan, tetapi terjemahan tidak memperluasnya menjadi penilaian terhadap seluruh kelompok.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para ahli Taurat' dipilih karena lebih mudah dipahami pembaca umum daripada 'para ahli kitab'. Klausa panjang dibagi menjadi dua kalimat agar tujuan para penentang tetap jelas dan alami.
