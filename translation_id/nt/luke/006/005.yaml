id: LUK.6.5
reference: Luke 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: id
  text: Dan Dia berkata kepada mereka, “Anak Manusia adalah Tuhan atas hari Sabat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung naratif sederhana tanpa menambahkan nuansa waktu yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek dapat menggambarkan tuturan yang sedang berlangsung, tetapi dalam narasi Indonesia bentuk lampau tidak ditandai secara gramatikal; 'berkata' paling alami dan konteks tetap menunjukkan tindakan lampau.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Menerjemahkan pronomina datif jamak secara langsung tanpa mempersempit identitas para lawan bicara.
- source_word: Κύριος
  choice: Tuhan
  rationale: Dalam pernyataan kristologis ini, κύριος menyatakan otoritas, bukan sekadar sapaan sopan. 'Tuhan' mempertahankan bobot gelarnya dalam pemakaian Alkitab bahasa Indonesia.
- source_word: τοῦ σαββάτου
  choice: atas hari Sabat
  rationale: Genitif sesudah κύριος menyatakan lingkup kekuasaan. Dalam bahasa Indonesia, 'Tuhan atas hari Sabat' lebih jelas dan alami daripada bentuk harfiah 'Tuhan dari hari Sabat'.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar yang mapan, latar Semitisnya, dan kemungkinan kaitannya dengan Daniel 7.
theological_decisions:
- issue: Daya kristologis pernyataan tentang hari Sabat
  choice: “Anak Manusia adalah Tuhan atas hari Sabat.”
  alternative: “Anak Manusia adalah penguasa atas hari Sabat.”
  rationale: Pilihan 'Tuhan' mempertahankan gelar κύριος dan klaim kuat mengenai kewenangan Anak Manusia. Kata 'atas' menjelaskan relasi otoritas tanpa menambahkan kata seperti 'bahkan' yang tidak terdapat dalam teks ini.
translation_notes:
  register: Bahasa Indonesia baku, alami, ringkas, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis 'Dia' sesuai kebiasaan modern yang mudah dibaca; 'hari Sabat' dipakai sebagai nama hari/lembaga keagamaan yang dikenal.
