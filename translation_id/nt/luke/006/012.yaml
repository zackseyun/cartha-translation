  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: id
  text: Pada hari-hari itu, Yesus pergi ke gunung untuk berdoa, dan semalaman Ia berdoa kepada Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις
  choice: Pada hari-hari itu
  rationale: Ungkapan waktu dan peralihan naratif Lukas disampaikan secara alami dalam bahasa Indonesia. Formula Ἐγένετο δὲ tidak perlu diterjemahkan secara kaku sebagai 'terjadilah', karena fungsi pengantar peristiwanya sudah tercakup oleh pembukaan kalimat.
- source_word: ἐξελθεῖν αὐτὸν
  choice: Yesus pergi
  rationale: Infinitif dengan subjek akusatif setelah ἐγένετο dialihkan menjadi klausa finite yang wajar. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam ayat tunggal tanpa mengubah identitas tokoh dalam konteks.
- source_word: εἰς τὸ ὄρος
  choice: ke gunung
  rationale: Menerjemahkan ὄρος secara langsung sebagai 'gunung'. Artikel Yunani tidak harus direproduksi dengan 'gunung itu' karena bahasa Indonesia dapat memakai nomina tanpa penentu ketika tempat tertentu belum perlu ditegaskan.
- source_word: προσεύξασθαι
  choice: untuk berdoa
  rationale: Infinitif aoris menyatakan tujuan gerak secara lugas.
- source_word: ἦν διανυκτερεύων
  choice: menghabiskan sepanjang malam
  rationale: Konstruksi perifrastis imperfek menyatakan kegiatan yang berlangsung semalaman; ungkapan ini alami dan mempertahankan aspek duratifnya.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: dalam doa kepada Allah
  rationale: 'Genitif τοῦ θεοῦ dipahami secara objektif atau terarah: doa ditujukan kepada Allah. Bentuk ini menghindari kesan keliru bahwa doa tersebut berasal dari atau dilakukan oleh Allah.'
theological_decisions:
- issue: Hubungan τοῦ θεοῦ dengan προσευχῇ dalam doa Yesus
  choice: doa kepada Allah
  alternative: doa Allah / doa dari Allah
  rationale: Konteks menggambarkan Yesus sebagai pihak yang berdoa dan Allah sebagai tujuan doa. Terjemahan ini mempertahankan pembedaan yang terdapat dalam teks tanpa menambahkan penjelasan kristologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur naratif dibuat lancar tanpa menerjemahkan formula Ἐγένετο δὲ secara harfiah dan kaku. Tidak ada catatan kaki karena alternatif pada lapisan konsultasi Inggris sebenarnya menjelaskan ἦν διανυκτερεύων, sedangkan kedua nuansanya sudah tercakup jelas dalam 'menghabiskan sepanjang malam'.
