  terminology: '"Orang lain" tepat untuk οἱ ἄνθρωποι dalam pepatah timbal balik ini. Pengulangan "berbuat" mempertahankan keluasan dan gema ποιέω pada kedua klausa. Tidak ada istilah teologis atau nama yang memerlukan penyeragaman khusus.'
