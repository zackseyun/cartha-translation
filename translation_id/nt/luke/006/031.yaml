id: LUK.6.31
reference: Luke 6:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: id
  text: Dan sebagaimana kamu ingin orang lain berbuat kepadamu, berbuatlah demikian juga kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menandai tolok ukur perbandingan dan mempertahankan hubungan langsung antara tindakan yang diharapkan dan tindakan yang diperintahkan.
- source_word: θέλετε
  choice: kamu ingin
  rationale: Menyatakan keinginan atau harapan biasa dengan bahasa Indonesia modern dan alami.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: orang lain berbuat kepadamu
  rationale: Konstruksi ἵνα setelah θέλετε menyatakan isi keinginan. 'Berbuat kepadamu' mempertahankan keluasan ποιέω dan relasi datif tanpa mempersempitnya menjadi sekadar 'memperlakukan'.
- source_word: οἱ ἄνθρωποι
  choice: orang lain
  rationale: Istilah ini merujuk secara umum kepada manusia selain para pendengar dalam hubungan timbal balik; 'orang lain' alami dalam konteks pepatah ini dan tidak bersifat khusus laki-laki.
- source_word: ποιεῖτε
  choice: berbuatlah
  rationale: Bentuk imperatif diterjemahkan sebagai perintah langsung. Kata yang sama dipertahankan untuk mencerminkan pengulangan ποιέω.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Mempertahankan kesejajaran dengan 'kepadamu' dan arah tindakan terhadap pihak lain.
- source_word: ὁμοίως
  choice: demikian juga
  rationale: Menyatakan tindakan yang sepadan atau sesuai dengan apa yang diinginkan dari orang lain dalam ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Cakupan οἱ ἄνθρωποι
  choice: orang lain
  alternative: orang-orang; manusia
  rationale: Rujukannya generik, bukan khusus laki-laki. 'Orang lain' memperjelas hubungan timbal balik yang tersirat tanpa menambahkan batasan teologis.
- issue: Keluasan makna ποιέω
  choice: berbuat
  alternative: memperlakukan
  rationale: '''Berbuat'' menjaga rumusan etis tetap luas dan mencerminkan pengulangan verba Yunani; ''memperlakukan'' dapat menyempitkan makna menjadi sikap atau perlakuan saja.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk tunggal atau jamak pada 'kamu' dibiarkan tidak ditandai sebagaimana lazim dalam bahasa Indonesia, sementara teks Yunani memakai bentuk jamak.
