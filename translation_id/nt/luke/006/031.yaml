  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan makna Yunani: καθὼς diterjemahkan "sebagaimana"; θέλετε ἵνα ποιῶσιν ὑμῖν tersampaikan secara alami dalam "kamu ingin orang lain berbuat kepadamu"; dan imperatif plural ποιεῖτε ... ὁμοίως diterjemahkan "berbuatlah demikian juga kepada mereka." Cakupan generik οἱ ἄνθρωποι terjaga melalui "orang lain," tanpa pembatasan gender. Penggunaan "kepada" untuk datif αὐτοῖς dapat diterima dalam konstruksi "berbuat kepada," dan paralelisme dengan "kepadamu" tetap jelas.'
