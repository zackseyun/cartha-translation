id: LUK.6.15
reference: Luke 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: id
  text: juga Matius dan Tomas, Yakobus anak Alfeus, dan Simon yang disebut orang Zelot[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang bersemangat.” Sebutan Yunani ini dapat berfungsi sebagai julukan dan tidak dengan sendirinya berarti bahwa Simon secara resmi menjadi anggota suatu gerakan politik yang muncul kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: juga / dan
  rationale: Konjungsi pertama menghubungkan ayat ini dengan daftar pada ayat sebelumnya, sehingga diterjemahkan “juga”; pengulangan berikutnya disampaikan dengan “dan” serta tanda baca agar daftar itu alami dalam bahasa Indonesia.
- source_word: Μαθθαῖον
  choice: Matius
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia untuk Μαθθαῖος.
- source_word: Θωμᾶν
  choice: Tomas
  rationale: Bentuk nama yang baku dalam bahasa Indonesia untuk Θωμᾶς.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Yakobus anak Alfeus
  rationale: Dalam rumus penamaan ini, bentuk genitif Ἁλφαίου paling wajar menunjukkan hubungan anak dengan ayah dan membedakan Yakobus ini dari orang lain yang bernama sama.
- source_word: Σίμωνα
  choice: Simon
  rationale: Bentuk nama yang baku dalam bahasa Indonesia untuk Σίμων.
- source_word: τὸν καλούμενον
  choice: yang disebut
  rationale: Menyampaikan fungsi atributif dari artikel dan partisip pasif tanpa membuat susunan daftar terasa kaku.
- source_word: Ζηλωτὴν
  choice: orang Zelot
  rationale: Ungkapan ini mempertahankan gelar pembeda bagi Simon dan merupakan sebutan yang dikenal dalam bahasa Indonesia, tanpa memperluasnya menjadi pernyataan tegas tentang keanggotaan dalam suatu partai politik tertentu.
theological_decisions:
- issue: Apakah Ζηλωτής merupakan label keanggotaan politik resmi atau julukan yang menggambarkan semangat
  choice: Diterjemahkan “orang Zelot” sebagai gelar pembeda, dengan catatan kaki yang mempertahankan kemungkinan makna deskriptif.
  alternative: “orang yang bersemangat” atau “seorang anggota gerakan Zelot”
  rationale: Kata Yunani itu dapat berfungsi sebagai julukan dan tidak dengan sendirinya memastikan keanggotaan resmi dalam gerakan politik yang kemudian dikenal dengan nama tersebut. Terjemahan utama mempertahankan sebutan tradisional, sedangkan catatan menjelaskan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ayat diperlakukan sebagai kelanjutan daftar pada ayat sebelumnya; “juga” menjaga hubungan tersebut, sedangkan tanda baca menghindari pengulangan “dan” yang terasa kaku. Penanda catatan ditempatkan langsung sesudah istilah yang dijelaskannya.
