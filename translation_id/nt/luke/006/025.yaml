id: LUK.6.25
reference: Luke 6:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: id
  text: Celakalah kalian yang sekarang kenyang, karena kalian akan lapar. Celakalah kalian yang sekarang tertawa, karena kalian akan berdukacita dan menangis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: Celakalah
  rationale: Mempertahankan daya peringatan dan penghukuman profetis, bukan sekadar ungkapan belas kasihan.
- source_word: ἐμπεπλησμένοι
  choice: yang sekarang kenyang
  rationale: Partisipel perfek menyatakan keadaan kini sebagai hasil telah dipuaskan; 'kenyang' konkret, alami, dan mempertahankan kontras dengan kelaparan mendatang.
- source_word: νῦν
  choice: sekarang
  rationale: Mempertahankan kontras waktu antara keadaan sekarang dan pembalikan yang akan datang.
- source_word: πεινάσετε
  choice: kalian akan lapar
  rationale: Bentuk futur menyatakan kekurangan yang akan datang; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: γελῶντες
  choice: yang sekarang tertawa
  rationale: Mencerminkan partisipel kini dan tindakan yang sedang berlangsung tanpa memperluas artinya menjadi 'bersukacita'.
- source_word: πενθήσετε
  choice: kalian akan berdukacita
  rationale: Menyampaikan perkabungan atau kesedihan yang berat serta tetap dibedakan dari tangisan pada verba berikutnya.
- source_word: κλαύσετε
  choice: menangis
  rationale: Mempertahankan unsur tangisan nyata dan penguatan retoris dalam pasangan 'berdukacita dan menangis'.
- source_word: ὅτι
  choice: karena
  rationale: Menandai alasan bagi seruan celaka secara jelas dan alami.
theological_decisions:
- issue: Sifat seruan celaka
  choice: Peringatan profetis tentang pembalikan dan penghakiman yang akan datang atas mereka yang sekarang kenyang dan tertawa
  alternative: Pengamatan sosiologis semata tentang perubahan nasib
  rationale: Pengulangan οὐαί, bentuk-bentuk futur, dan kesejajarannya dengan ucapan bahagia di sekitar ayat ini menunjukkan peringatan yang lebih dari sekadar pengamatan netral. Terjemahan tidak menentukan mekanisme atau waktu pembalikan melebihi yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan khidmat. 'Kalian' dipakai untuk menandai bahwa ὑμῖν bersifat jamak dan agar sapaan langsung tetap jelas. Tidak diperlukan catatan kaki karena alternatif leksikal yang ada tidak menghasilkan ambiguitas penting dalam bahasa sasaran.
