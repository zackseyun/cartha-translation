id: LUK.6.49
reference: Luke 6:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: id
  text: Namun, orang yang mendengar tetapi tidak melakukannya[a] sama seperti seorang yang membangun rumah di atas tanah tanpa fondasi. Ketika sungai menerjang rumah itu, rumah itu segera roboh, dan kerusakan rumah itu sangat parah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak berbuat”; maksudnya, tidak melakukan perkataan Yesus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “keretakan/kehancuran rumah itu besar.” Kata Yunani ini dapat menunjuk pada retakan, keruntuhan, atau kerusakan yang diakibatkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Namun, orang yang mendengar tetapi tidak melakukannya
  rationale: Partisipel berartikel menyatakan sosok perwakilan. 'Melakukannya' mempertahankan arti dasar ποιέω dan, melalui konteks sebelumnya, menunjuk pada melakukan perkataan Yesus.
- source_word: ἀνθρώπῳ
  choice: seorang
  rationale: Dalam bahasa Indonesia, 'seorang' secara alami memperkenalkan tokoh manusia tunggal tanpa harus menambahkan 'laki-laki', yang tidak menjadi pokok perbandingan.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: yang membangun rumah di atas tanah tanpa fondasi
  rationale: 'Ungkapan ini langsung, alami, dan mempertahankan unsur utama gambaran: rumah didirikan pada tanah tanpa dasar penopang.'
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Ketika sungai menerjang rumah itu
  rationale: προσρήγνυμι menyiratkan benturan keras. Klausa relatif Yunani diubah menjadi klausa waktu yang wajar dalam bahasa Indonesia, sedangkan rujukan ᾗ kepada rumah dibuat eksplisit.
- source_word: εὐθὺς συνέπεσεν
  choice: rumah itu segera roboh
  rationale: συμπίπτω dalam konteks bangunan berarti ambruk atau roboh; subjek diulang agar jelas dan alami dalam bahasa Indonesia.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: kerusakan rumah itu sangat parah
  rationale: ῥῆγμα dapat menunjuk pada retakan, kehancuran, atau kerusakan akibat robohnya bangunan. 'Kerusakan ... sangat parah' menyampaikan akibat besar secara alami tanpa mempersempitnya hanya menjadi retakan.
theological_decisions:
- issue: Bahasa maskulin representatif dalam perumpamaan
  choice: seorang
  alternative: seorang laki-laki
  rationale: ἀνθρώπῳ secara leksikal berarti manusia atau orang dan di sini berbentuk gramatikal maskulin karena tokoh tunggal dalam perbandingan. Bahasa Indonesia tidak perlu menandai jenis kelamin untuk mempertahankan bentuk tunggal representatif.
- issue: Rujukan tindakan yang tidak dilakukan
  choice: tidak melakukannya
  alternative: tidak mempraktikkannya
  rationale: Terjemahan mempertahankan kesederhanaan ποιέω sambil membiarkan konteks menentukan bahwa yang dimaksud ialah melakukan perkataan Yesus, tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Fondasi', 'menerjang', dan 'roboh' mudah dipahami pembaca umum. Susunan kalimat mengikuti alur gambaran Yunani sambil menghindari konstruksi relatif yang kaku.
