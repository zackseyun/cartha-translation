  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: id
  text: Sebab, tidak ada pohon yang baik yang menghasilkan buah busuk[a], dan tidak ada pula pohon yang busuk yang menghasilkan buah baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buah buruk” dan “pohon yang buruk.” Kata Yunani yang sama dapat berarti busuk, rusak, atau buruk.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Sebab tidak ada
  rationale: “Sebab” mempertahankan fungsi penjelas γάρ dan menghubungkan peribahasa ini dengan konteks sebelumnya; “tidak ada” menyampaikan negasi keberadaan secara alami.
- source_word: δένδρον καλὸν
  choice: pohon yang baik
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang pohon sekaligus kemungkinan gaung moral dari καλός.
- source_word: ποιοῦν καρπὸν
  choice: yang menghasilkan buah
  rationale: Dalam konteks pohon dan buah, “menghasilkan” merupakan padanan idiomatis bagi ποιέω tanpa menghilangkan hubungan tindakan dalam bentuk partisipel.
- source_word: σαπρόν
  choice: busuk
  rationale: “Busuk” mempertahankan gambaran pertanian yang konkret dan dapat menggambarkan buah maupun pohon yang rusak atau membusuk; makna moralnya dibiarkan muncul dari perumpamaan.
- source_word: οὐδὲ πάλιν
  choice: demikian pula, tidak ada
  rationale: Ungkapan ini menyampaikan koordinasi negatif οὐδέ dan peralihan timbal balik πάλιν secara alami dalam bahasa Indonesia.
- source_word: καρπὸν καλόν
  choice: buah baik
  rationale: Pilihan ini mempertahankan kesejajaran antitesis dengan “pohon yang baik” dan tetap ringkas serta jelas.
theological_decisions:
- issue: Kekuatan gambaran pertanian dan moral pada σαπρός
  choice: Menerjemahkan σαπρός sebagai “busuk” pada buah dan pohon
  alternative: “buruk” atau “rusak”
  rationale: “Busuk” menjaga kekonkretan gambaran asli dan konsistensi istilah, sehingga penerapan moral tidak dimasukkan secara eksplisit oleh penerjemah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bernada peribahasa. “Demikian pula” dipilih agar hubungan antitesis terdengar alami tanpa menghilangkan unsur πάλιν.
