  terminology: “Berbahagialah,” “mengucilkan,” dan “Anak Manusia” tepat. “Menolak namamu karena dianggap jahat” adalah pemulusan yang dapat diterima untuk idiom ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν, asalkan catatan kaki mempertahankan ungkapan konkret dan tidak memastikan satu penafsiran sosial saja.
