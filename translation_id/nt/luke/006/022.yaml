source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: id
  text: Berbahagialah kamu ketika orang-orang membenci kamu, dan ketika mereka, oleh karena Anak Manusia, mengucilkan kamu, menghina kamu, serta menolak namamu karena dianggap jahat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuang namamu sebagai sesuatu yang jahat.” Ungkapan ini dapat merujuk pada pencelaan atau penolakan publik terhadap kamu atau reputasimu sebagai sesuatu yang jahat.
    reason: Menjelaskan idiom Yunani ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν sambil mempertahankan keterbukaan maknanya.
lexical_decisions:
- source_word: Μακάριοί
  choice: Berbahagialah
  rationale: Bentuk ini mempertahankan corak ucapan bahagia dan bobot teologis μακάριοι, tanpa membatasinya pada perasaan senang sesaat.
- source_word: ὅταν
  choice: ketika
  rationale: Dengan verba-verba subjungtif, kata ini menunjuk pada keadaan yang dapat terjadi; 'ketika' alami dalam bahasa Indonesia dan sesuai dengan gaya ucapan bahagia.
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: orang-orang membenci kamu
  rationale: οἱ ἄνθρωποι bersifat umum, bukan khusus laki-laki; 'orang-orang' menyampaikan cakupan sosial tersebut secara alami.
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: mengucilkan kamu
  rationale: Dalam konteks penganiayaan sosial, verba ini menyatakan pemisahan atau penyingkiran dari pergaulan kelompok; 'mengucilkan' tepat dan mudah dipahami.
- source_word: ὀνειδίσωσιν
  choice: menghina kamu
  rationale: Pilihan ini menyampaikan celaan atau serangan verbal dengan bahasa Indonesia modern yang lugas.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: menolak namamu karena dianggap jahat
  rationale: Ungkapan ini mempertahankan unsur 'nama' sambil menyampaikan tindakan penolakan sosial secara alami. Bentuk pasif 'dianggap' mencerminkan penilaian para penentang tanpa menyatakan bahwa penilaian itu benar.
- source_word: ἕνεκα
  choice: oleh karena
  rationale: Frasa ini menandai sebab dengan register yang wajar dan cukup khidmat bagi teks Alkitab.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar baku ini mempertahankan bentuk Yunani, pemakaiannya dalam Injil, dan gema intertekstualnya.
theological_decisions:
- issue: Makna idiom ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: menolak namamu karena dianggap jahat
  alternative: mencampakkan namamu sebagai sesuatu yang jahat
  rationale: Pilihan utama mempertahankan metonimia 'nama' dan gagasan penolakan, tetapi menghindari ungkapan Indonesia yang terlalu harfiah dan janggal. Catatan kaki menjaga kemungkinan bahwa frasa ini menunjuk pada pencelaan atau penolakan publik terhadap diri dan reputasi para murid.
- issue: Cakupan οἱ ἄνθρωποι
  choice: orang-orang
  alternative: manusia
  rationale: Rujukannya bersifat generik dan sosial, bukan khusus laki-laki.
- issue: Gelar τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: Gelar tradisional 'Anak Manusia' paling baik mempertahankan kesinambungan pemakaian Injil dan kemungkinan gema Daniel tanpa menambahkan tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'ketika' mengikuti struktur Yunani dan membagi kebencian dari rangkaian pengucilan, penghinaan, serta penolakan. 'Berbahagialah' mempertahankan register ucapan bahagia; 'kamu' mengikuti sapaan jamak konteks tanpa menambahkan penanda yang tidak diperlukan.
