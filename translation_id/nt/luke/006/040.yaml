base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: id
  text: Seorang murid tidak lebih tinggi daripada gurunya, tetapi setiap orang yang telah terlatih sepenuhnya[a] akan menjadi seperti gurunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah diperlengkapi sepenuhnya” atau “yang telah dipersiapkan sepenuhnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: murid
  rationale: “Murid” mempertahankan makna seorang pelajar yang dibentuk oleh guru dan sesuai dengan konteks relasional, bukan sekadar akademis.
- source_word: ὑπὲρ
  choice: lebih tinggi daripada
  rationale: Dalam perbandingan ini, ὑπέρ menunjukkan kedudukan atau tingkat; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: διδάσκαλον / διδάσκαλος
  choice: guru
  rationale: “Guru” adalah padanan langsung dan wajar bagi διδάσκαλος dalam bahasa Indonesia modern.
- source_word: κατηρτισμένος
  choice: yang telah diperlengkapi sepenuhnya
  rationale: Bentuk partisip perfek pasif menyatakan seseorang yang telah dibuat lengkap, siap, atau cakap. Pilihan ini mempertahankan keluasan makna kata sumber, sementara konteks guru-murid memberi nuansa pembentukan atau pelatihan.
- source_word: πᾶς
  choice: setiap orang
  rationale: Bentuk tunggal maskulin ini digunakan secara generik; “setiap orang” menyampaikan cakupan universal secara alami.
- source_word: ὡς
  choice: seperti
  rationale: ὡς menandai perbandingan, dan “seperti” merupakan padanan Indonesia yang paling alami.
- source_word: αὐτοῦ
  choice: gurunya
  rationale: Akhiran -nya mempertahankan hubungan tunggal dengan orang yang sedang dibicarakan tanpa memaksakan penandaan gender yang tidak dituntut tata bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna κατηρτισμένος dalam hubungan murid dan guru
  choice: dipertahankan sebagai “telah diperlengkapi sepenuhnya”
  alternative: “telah terlatih sepenuhnya” atau “telah disempurnakan”
  rationale: Kata Yunani dapat mencakup tindakan melengkapi, mempersiapkan, membentuk, atau memulihkan. Konteks pedagogis mendukung “terlatih,” tetapi terjemahan utama mempertahankan keluasan makna dan mencatat alternatif kontekstual.
- issue: Rujukan maskulin generik
  choice: “setiap orang ... gurunya”
  alternative: “setiap murid ... guru mereka”
  rationale: Bahasa Indonesia tidak memerlukan kata ganti bergender. Bentuk tunggal dan hubungan rujukannya tetap terpelihara secara alami melalui “-nya” tanpa menambahkan pembedaan gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Susunan pepatah dipertahankan, dan istilah teknis dihindari dalam teks utama.
