  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: id
  text: 'Namun, aku berkata kepada kalian yang mendengarkan: Kasihilah musuh-musuh kalian; berbuatlah baik kepada orang-orang yang membenci kalian.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan kuat dengan perkataan sebelumnya dan tetap alami dalam bahasa Indonesia modern.
- source_word: ὑμῖν λέγω
  choice: kepada kalian ... Aku berkata
  rationale: Mempertahankan sapaan langsung serta rumusan ujaran, dengan susunan yang wajar bagi kalimat Indonesia.
- source_word: τοῖς ἀκούουσιν
  choice: yang mendengarkan
  rationale: Partisipel kini menunjuk kepada orang-orang yang sedang menyimak; 'mendengarkan' secara alami menyampaikan perhatian aktif tanpa menambahkan gagasan ketaatan.
- source_word: ἀγαπᾶτε
  choice: Kasihilah
  rationale: Menyampaikan bentuk imperatif secara langsung dan mempertahankan padanan lazim bagi verba ἀγαπάω dalam konteks etis ini.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: musuh-musuh kalian
  rationale: Padanan langsung dan alami untuk objek jamak beserta pronomina orang kedua jamak.
- source_word: καλῶς ποιεῖτε
  choice: berbuatlah baik
  rationale: Mengungkapkan perintah untuk melakukan kebaikan secara ringkas dan idiomatis.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: kepada orang-orang yang membenci kalian
  rationale: Mempertahankan makna lugas μισέω tanpa memperhalusnya, sedangkan datif penerima dinyatakan secara alami dengan 'kepada'.
theological_decisions:
- issue: Perintah etis terhadap para lawan
  choice: Perintah diterjemahkan secara lugas dan umum tanpa membatasi cakupannya.
  alternative: Membatasinya hanya pada musuh pribadi atau memahaminya sebagai hiperbola retoris.
  rationale: Teks Yunani memakai dua imperatif orang kedua jamak tanpa batasan eksplisit; daya tuntutan etisnya perlu dipertahankan tanpa menyelesaikan perdebatan penafsiran di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak dengan jelas. Huruf kapital pada 'Aku' mengikuti kebiasaan penulisan rujukan kepada Yesus, tanpa mengubah makna gramatikal.
