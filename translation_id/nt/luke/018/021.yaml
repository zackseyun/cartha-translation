  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: id
  text: Lalu ia berkata, “Semua itu telah kuturuti sejak masa mudaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Lalu ia berkata
  rationale: δέ merupakan penghubung ringan dalam alur narasi. “Lalu” mengalir alami dalam bahasa Indonesia tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: Ταῦτα πάντα
  choice: Semua itu
  rationale: Ungkapan ini secara langsung berarti “semua itu.” Yang dimaksud dalam konteks ialah perintah-perintah pada ayat sebelumnya, tetapi kata “perintah” tidak dinyatakan dalam teks Yunani.
- source_word: ἐφύλαξα
  choice: telah kuturuti
  rationale: φυλάσσω dalam konteks perintah berarti menjaga, menaati, atau menuruti. “Telah kuturuti” menyampaikan klaim bahwa ia menaati semuanya sampai saat ia berbicara.
- source_word: ἐκ νεότητος μου
  choice: sejak masa mudaku
  rationale: ἐκ dengan bentuk genitif menandai titik awal dalam waktu. “Sejak masa mudaku” merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat “kuturuti” dan “mudaku” mempertahankan tuturan langsung yang alami serta ringkas. Tidak ditambahkan “perintah-perintah” karena kata itu hanya tersirat dari konteks, bukan hadir dalam ayat ini.
