  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: id
  text: Sesungguhnya Aku berkata kepada kalian, siapa pun yang tidak menerima Kerajaan Allah seperti seorang anak[a] pasti tidak akan masuk ke dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai seorang anak.” Ungkapan ini dapat menekankan sikap menerima, kepercayaan, kerendahan hati, atau ketergantungan seorang anak; bahasa Yunani tidak menyebutkan sifat yang tepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam rumusan pembuka perkataan Yesus, kata ini menyatakan penegasan yang khidmat. “Sesungguhnya” alami dalam ragam Alkitab Indonesia dan tidak seburam transliterasi “Amin” pada posisi ini.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Menyampaikan sapaan langsung dengan jelas dan bermartabat; bentuk tunggal “kepadamu” dapat merujuk secara kolektif kepada para pendengar, sesuai ὑμῖν yang jamak.
- source_word: ὃς ἂν
  choice: siapa pun yang
  rationale: Gabungan pronomina relatif dan partikel ἄν membentuk syarat umum tak tentu; “siapa pun yang” merupakan padanan Indonesia yang tepat dan alami.
- source_word: μὴ δέξηται
  choice: tidak menerima
  rationale: δέχομαι dapat berarti menerima, menyambut, atau menerima dengan baik. “Menerima” cocok dengan objek Kerajaan Allah dan mempertahankan gagasan penerimaan tanpa mempersempit metaforanya.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku dan mudah dipahami yang dapat mencakup pemerintahan maupun ranah kerajaan Allah tanpa memaksakan salah satu nuansa.
- source_word: ὡς παιδίον
  choice: seperti seorang anak
  rationale: Mempertahankan perbandingan yang dinyatakan oleh ὡς serta tidak menentukan apakah sifat yang dimaksud ialah kerendahan hati, kepercayaan, ketergantungan, atau sikap menerima.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: pasti tidak akan masuk
  rationale: Gabungan οὐ μή dengan aoristus subjungtif merupakan penyangkalan yang tegas. “Pasti tidak akan” menyampaikan tekanan itu dalam bahasa Indonesia modern.
- source_word: εἰς αὐτήν
  choice: ke dalamnya
  rationale: Pronomina tersebut merujuk kembali kepada Kerajaan Allah; “ke dalamnya” mempertahankan unsur gerak masuk yang dinyatakan oleh εἰς.
theological_decisions:
- issue: Makna menerima Kerajaan Allah “seperti seorang anak”
  choice: Perumpamaan dipertahankan tanpa menetapkan sifat tertentu pada anak.
  alternative: Dengan kerendahan hati seperti anak; dengan kepercayaan seperti anak; sebagai seorang anak.
  rationale: Bahasa Yunani menyatakan perbandingan, tetapi tidak menjelaskan apakah titik tekannya adalah sikap menerima, kepercayaan, kerendahan hati, ketergantungan, atau status sebagai anak. Terjemahan tidak boleh diam-diam menyelesaikan ketaksaan ini.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Kapitalisasi “Aku” mengikuti rujukan kepada Yesus dan “Kerajaan Allah” mengikuti kelaziman penerbitan Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkan.
