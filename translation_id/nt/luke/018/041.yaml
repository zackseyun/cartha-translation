id: LUK.18.41
reference: Luke 18:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: id
  text: “Apa yang kamu ingin Aku lakukan bagimu?” Ia menjawab, “Tuhan[a], kiranya aku dapat melihat kembali[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan”; kata Yunani κύριε dapat dipakai sebagai sapaan hormat, meskipun “Tuhan” merupakan terjemahan utama untuk κύριος.
    reason: alternative_reading
  - marker: b
    text: Atau “memperoleh kembali penglihatanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: Apa yang kamu ingin Aku lakukan bagimu?
  rationale: Susunan ini menyampaikan pertanyaan tentang tindakan tertentu yang diinginkan orang itu. Dativus σοι diterjemahkan secara wajar sebagai benefaktif “bagimu”.
- source_word: ὁ δὲ εἶπεν
  choice: Ia menjawab
  rationale: Dalam konteks dialog, εἶπεν secara alami menjadi “menjawab”; δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan secara tersendiri.
- source_word: Κύριε
  choice: Tuhan
  rationale: “Tuhan” mempertahankan sapaan hormat sekaligus kemungkinan makna kristologis; bahasa Yunani juga dapat dipahami sekadar sebagai sapaan hormat.
- source_word: ἵνα ἀναβλέψω
  choice: kiranya aku dapat melihat kembali
  rationale: ἵνα memperkenalkan isi permohonan, sedangkan ἀναβλέψω dalam konteks penyembuhan berarti memperoleh kembali kemampuan melihat. “Kiranya” menghasilkan permohonan yang alami dan bermartabat.
theological_decisions:
- issue: Makna κύριος sebagai sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: “Tuhan” mempertahankan keterbukaan antara sapaan hormat dan pengakuan yang lebih dalam terhadap Yesus, tanpa membatasi istilah itu hanya pada kesopanan biasa.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat. “Kamu” cocok dengan percakapan langsung, sedangkan “kiranya” menandai permohonan tanpa membuatnya berlebihan. Huruf kapital pada “Aku” mengikuti kebiasaan penghormatan ketika Yesus berbicara.
