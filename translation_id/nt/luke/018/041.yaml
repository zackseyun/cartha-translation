  source_fidelity: Terjemahan menyampaikan pertanyaan Τί σοι θέλεις ποιήσω dengan tepat sebagai permintaan tentang apa yang dikehendaki orang itu dilakukan baginya. “Ia menjawab” wajar untuk ὁ δὲ εἶπεν dalam konteks tanya-jawab. “Tuhan” mempertahankan cakupan sapaan Κύριε, dan “kiranya aku dapat melihat kembali” secara tepat mengungkapkan permohonan ἵνα ἀναβλέψω dalam konteks pemulihan penglihatan.
  naturalness: Bahasa Indonesia modern, jelas, dan bernada hormat. Penggunaan “kamu” dalam pertanyaan langsung dan “bagimu” terdengar wajar. “Kiranya aku dapat melihat kembali” cocok sebagai jawaban berupa permohonan, tanpa menambah penafsiran.
