  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: id
  text: Lalu Yesus berhenti dan memerintahkan agar orang itu dibawa[a] kepada-Nya. Ketika orang itu mendekat, Yesus bertanya kepadanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dituntun." Kata Yunani yang digunakan dapat berarti dibawa atau dituntun.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: berhenti
  rationale: Partisip aoristus pasif dari ἵστημι dipakai secara intransitif dan dalam konteks ini menyatakan bahwa Yesus menghentikan langkah-Nya.
- source_word: δὲ
  choice: Lalu
  rationale: Penghubung ringan δέ melanjutkan alur narasi secara alami tanpa menandakan pertentangan kuat.
- source_word: ἐκέλευσεν
  choice: memerintahkan
  rationale: κελεύω menyatakan pemberian perintah; 'memerintahkan' mempertahankan daya otoritatifnya dalam bahasa Indonesia baku.
- source_word: ἀχθῆναι
  choice: dibawa
  rationale: Infinitif pasif aoristus dari ἄγω dapat berarti dibawa atau dituntun. 'Dibawa' cukup luas dan alami dalam adegan ini.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: πρός dengan akusatif menunjukkan gerak menuju Yesus; 'kepada-Nya' menyampaikan arah tersebut secara idiomatis.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Ketika orang itu sudah dekat
  rationale: Konstruksi genitif absolut menyatakan waktu. Penyebutan 'orang itu' memperjelas bahwa subjeknya ialah orang buta tersebut, bukan Yesus.
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: ἐπερωτάω di sini bermakna mengajukan pertanyaan; 'bertanya' adalah padanan modern yang paling langsung.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Nama diri ditransliterasikan sesuai bentuk Indonesia yang baku.
theological_decisions: []
