  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: id
  text: Aku berpuasa dua kali seminggu[a]; aku memberikan persepuluhan dari segala yang kuperoleh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua kali dari Sabat,” sebuah ungkapan yang berarti “dua kali seminggu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Aku berpuasa
  rationale: Bentuk kini menunjukkan kebiasaan yang diklaim oleh pembicara, bukan tindakan yang hanya sedang berlangsung saat itu.
- source_word: δὶς τοῦ σαββάτου
  choice: dua kali seminggu
  rationale: Ungkapan Yunani ini secara idiomatis menyatakan frekuensi dalam satu pekan; terjemahan harfiah akan mudah disalahpahami.
- source_word: ἀποδεκατῶ
  choice: aku memberikan persepuluhan
  rationale: Kata kerja ini berarti memberikan sepersepuluh; bentuk ini jelas dan alami dalam bahasa Indonesia serta mempertahankan istilah yang dikenal pembaca Alkitab.
- source_word: πάντα ὅσα
  choice: dari segala yang
  rationale: Gabungan ini menyatakan cakupan menyeluruh atas hal-hal yang diperoleh pembicara.
- source_word: κτῶμαι
  choice: kuperoleh
  rationale: Bentuk tengah ini paling wajar dipahami sebagai memperoleh atau mendapatkan bagi diri sendiri, bukan sekadar memiliki secara statis.
theological_decisions:
- issue: Makna τοῦ σαββάτου dalam pernyataan tentang puasa
  choice: 'makna temporal idiomatis: seminggu'
  alternative: 'terjemahan lebih harfiah: dari Sabat'
  rationale: Ungkapan tersebut menyatakan frekuensi mingguan, bukan bahwa puasa dilakukan dua kali pada hari Sabat. Terjemahan idiomatis mencegah kesan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang pertama “Aku” sesuai dengan tuturan langsung dalam perumpamaan. “Memberikan persepuluhan” dipilih agar makna tindakan lebih jelas daripada bentuk verbal yang kurang lazim.
