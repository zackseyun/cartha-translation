revisions:
- from: Tidakkah Allah akan membela orang-orang pilihan-Nya yang berseru kepada-Nya siang dan malam? Akankah Ia lama menunda pertolongan bagi mereka?[a]
  to: Tidakkah Allah akan menegakkan keadilan bagi orang-orang pilihan-Nya yang berseru kepada-Nya siang dan malam? Akankah Ia lama menunda bertindak bagi mereka?[a]
  rationale: Revisi memperjelas arti yudisial ἐκδίκησις sebagai tindakan menegakkan keadilan, dan menghapus penambahan spesifik 'pertolongan' dari pertanyaan kedua. Ambiguitas sintaktis dan semantis μακροθυμεῖ ἐπ’ αὐτοῖς tetap dipelihara melalui catatan kaki tanpa memutuskan pembacaan kesabaran secara teologis.
  reviewer_model: gpt-5.6-terra
