  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: id
  text: Tidakkah Allah akan menegakkan keadilan bagi orang-orang pilihan-Nya yang berseru kepada-Nya siang dan malam? Akankah Ia lama menunda bertindak bagi mereka?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sekalipun Ia bersabar terhadap mereka” atau “dan apakah Ia bersabar terhadap mereka?” Frasa Yunani ini juga dapat dipahami dalam arti kesabaran atau panjang sabar, bukan penundaan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: membela
  rationale: Dalam konteks perumpamaan tentang hakim dan permohonan yang terus-menerus, kata ini menunjuk pada pemberian keadilan, pembelaan, atau pemulihan hak, bukan pembalasan dendam pribadi. 'Membela' alami dalam bahasa Indonesia dan tetap membawa nuansa tindakan hukum demi pihak yang dirugikan.
- source_word: ἐκλεκτῶν
  choice: orang-orang pilihan
  rationale: Adjektiva ini dipakai secara substantival dan menunjuk kepada mereka yang dipilih Allah. Ungkapan ini jelas bagi pembaca modern tanpa mempersempitnya menurut kerangka denominasi tertentu.
- source_word: βοώντων
  choice: yang berseru
  rationale: Partisip ini menyatakan permohonan yang kuat dan mendesak. 'Berseru' sesuai dengan konteks doa dan lebih bermartabat daripada 'berteriak'.
- source_word: ἡμέρας καὶ νυκτός
  choice: siang dan malam
  rationale: Terjemahan harfiah dan idiomatis ini mempertahankan penekanan pada seruan yang terus-menerus.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Akankah Ia lama menunda pertolongan bagi mereka?
  rationale: Frasa Yunani ini sulit dan dapat berbicara tentang kesabaran atau tentang lamanya waktu sebelum Allah bertindak. Dalam alur menuju ayat 8, pertanyaan tentang penundaan paling alami, sedangkan unsur 'pertolongan' menyatakan tindakan demi mereka tanpa mengulang 'membela'. Ambiguitas mengenai kesabaran dipertahankan dalam catatan kaki.
- source_word: οὐ μὴ ποιήσῃ
  choice: Tidakkah ... akan
  rationale: οὐ μή dengan subjungtif aoris memberi negasi kuat dalam pertanyaan retoris yang mengharapkan jawaban positif. Bentuk 'Tidakkah ... akan' menyampaikan daya retoris itu secara alami.
- source_word: θεὸς
  choice: Allah
  rationale: '''Allah'' adalah padanan baku θεός dalam terjemahan Alkitab berbahasa Indonesia dan dalam bahasa Indonesia modern.'
theological_decisions:
- issue: Makna μακροθυμεῖ ἐπ’ αὐτοῖς dalam kaitannya dengan tindakan dan kesabaran Allah
  choice: 'Diterjemahkan sebagai pertanyaan mengenai penundaan tindakan: ''Akankah Ia lama menunda pertolongan bagi mereka?'''
  alternative: Frasa itu juga dapat dimengerti sebagai 'sekalipun Ia bersabar terhadap mereka' atau 'dan apakah Ia bersabar terhadap mereka?'
  rationale: Konteks langsung menekankan bahwa Allah akan segera membela umat-Nya (ayat 8), sehingga makna penundaan cocok dengan alur retoris. Namun, arti leksikal 'bersabar/menahan diri dengan panjang sabar' tetap mungkin dan karena itu dicatat, bukan disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua pertanyaan dipertahankan untuk mengikuti retorika Yunani. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan luas dalam teks keagamaan Indonesia.
