review_pass:
  verdict: revise
  source_fidelity: Draf pada dasarnya mengikuti struktur dua pertanyaan dan menangkap ἐκλεκτῶν, βοώντων, serta idiom 'siang dan malam' dengan baik. Namun, 'membela' dapat terdengar terutama sebagai tindakan membela, sedangkan ἐκδίκησις dalam konteks pengadilan berarti pemberian keadilan atau pemulihan hak. Selain itu, 'pertolongan' pada pertanyaan kedua bukan unsur yang dinyatakan dalam bahasa Yunani. Revisi memakai 'menegakkan keadilan bagi' untuk arti yudisial dan 'menunda bertindak bagi' untuk pembacaan penundaan, sambil mempertahankan alternatif kesabaran dalam catatan kaki.
  naturalness: Bahasa draf sudah baku dan alami. 'Menegakkan keadilan bagi orang-orang pilihan-Nya' merupakan ungkapan Indonesia modern yang lebih tepat dalam konteks hukum. 'Akankah Ia lama menunda bertindak bagi mereka?' tetap idiomatis dan tidak menambahkan jenis pertolongan tertentu.
  terminology: '''Allah'', ''orang-orang pilihan-Nya'', ''berseru'', dan kapitalisasi pronomina ilahi konsisten dengan register Alkitab Indonesia modern. ''Keadilan'' lebih transparan daripada ''membela'' untuk istilah ἐκδίκησις tanpa menggesernya menjadi pembalasan pribadi.'
  issues:
  - severity: medium
    issue: Padanan 'membela' untuk ἐκδίκησιν kurang eksplisit menyatakan keadilan/pemulihan hak.
    rationale: Dalam bingkai perumpamaan hakim, ἐκδίκησις menunjuk pada keadilan atau ganti rugi yang diberikan oleh pengadilan. 'Membela' dapat mencakup makna itu, tetapi juga dapat dipahami hanya sebagai pembelaan tanpa keputusan yang adil.
  - severity: low
    issue: '''Pertolongan'' ditambahkan pada terjemahan μακροθυμεῖ ἐπ’ αὐτοῖς.'
    rationale: Pembacaan 'menunda' dapat dipertahankan dalam teks utama sesuai alur retoris, tetapi bahasa Yunani tidak menyebut pertolongan secara khusus. 'Menunda bertindak bagi mereka' menjaga cakupan tindakan ilahi tetap lebih umum.
  revised_text: Tidakkah Allah akan menegakkan keadilan bagi orang-orang pilihan-Nya yang berseru kepada-Nya siang dan malam? Akankah Ia lama menunda bertindak bagi mereka?[a]
  revised_footnotes:
