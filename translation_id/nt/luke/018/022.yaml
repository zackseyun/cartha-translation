source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: id
  text: Ketika Yesus mendengar hal itu, Ia berkata kepadanya, “Masih ada satu hal yang kurang padamu:[a] juallah segala yang kamu miliki dan bagikanlah hasilnya kepada orang-orang miskin, maka engkau akan mempunyai harta di surga;[b] lalu datanglah dan ikutlah Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau masih kekurangan satu hal.” Secara lebih harfiah, bahasa Yunani berbunyi, “Masih ada satu hal yang kurang padamu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di surga-surga.” Bahasa Yunani memakai bentuk jamak, sedangkan bahasa Indonesia lazim memakai bentuk tunggal “surga” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Ketika Yesus mendengar hal itu
  rationale: Partisip aoristus bersama δέ secara alami menyatakan urutan waktu. 'Hal itu' merujuk pada perkataan sebelumnya tanpa membuat hubungan yang tidak dinyatakan.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Masih ada satu hal yang kurang padamu
  rationale: Mempertahankan struktur Yunani, yaitu 'satu hal' sebagai hal yang kurang, sekaligus tetap wajar dalam bahasa Indonesia. Catatan kaki mencantumkan susunan alternatif yang menjadikan orang itu sebagai subjek.
- source_word: πάντα ὅσα ἔχεις
  choice: segala yang kaumiliki
  rationale: Menyampaikan cakupan menyeluruh ungkapan Yunani secara ringkas dan alami.
- source_word: πώλησον
  choice: juallah
  rationale: Bentuk imperatif menyampaikan perintah langsung dan tegas; partikel -lah sesuai dengan ragam Alkitab Indonesia yang bermartabat tanpa mengurangi daya perintah.
- source_word: διάδος πτωχοῖς
  choice: bagikanlah kepada orang-orang miskin
  rationale: διαδίδωμι berarti membagikan atau mendistribusikan. Terjemahan ini mempertahankan nuansa pembagian dan tidak menambahkan objek yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: engkau akan mempunyai harta di surga
  rationale: Menyampaikan janji kepemilikan harta dengan jelas. Bentuk tunggal 'surga' merupakan idiom Indonesia yang lazim; bentuk jamak Yunani dicatat dalam catatan kaki.
- source_word: δεῦρο
  choice: datanglah
  rationale: Adverbia yang berfungsi sebagai imperatif diterjemahkan sebagai ajakan untuk datang kepada Yesus.
- source_word: ἀκολούθει μοι
  choice: ikutlah Aku
  rationale: Dalam konteks panggilan menjadi murid, 'ikutlah Aku' alami dalam bahasa Indonesia dan dapat memuat daya berkelanjutan dari imperatif kini tanpa penjelasan berlebihan.
theological_decisions:
- issue: Implikasi pelepasan milik dan pemuridan
  choice: Mempertahankan perintah konkret kepada orang yang sedang diajak bicara, yang memuncak pada panggilan untuk mengikuti Yesus.
  alternative: Menjadikannya perintah universal agar setiap murid menjual seluruh miliknya, atau menganggapnya semata-mata simbolis tanpa tuntutan ekonomi nyata.
  rationale: Ayat Yunani menyampaikan tuntutan nyata kepada individu ini, tetapi ayat tersebut sendiri tidak merumuskan cakupan universal maupun membatalkan makna konkretnya. Terjemahan membiarkan ketegangan itu tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Tanda titik sebelum 'Maka' menghindari rangkaian klausa yang terlalu panjang, sementara titik koma mempertahankan hubungan erat antara janji harta di surga dan panggilan mengikuti Yesus.
