id: LUK.18.13
reference: Luke 18:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: id
  text: Namun, pemungut pajak itu berdiri dari kejauhan; ia bahkan tidak mau mengangkat matanya ke langit, melainkan terus memukul dadanya sambil berkata, “Ya Allah, kasihanilah aku, orang berdosa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkenanlah kepadaku”; kata yang diterjemahkan “kasihanilah” berkaitan dengan istilah pendamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: pemungut pajak
  rationale: Padanan modern yang jelas bagi petugas pemungut pajak dan tetap membawa stigma sosial peran tersebut dalam konteks Injil.
- source_word: μακρόθεν ἑστὼς
  choice: berdiri jauh-jauh
  rationale: Ungkapan Indonesia yang alami untuk posisi berdiri pada jarak tertentu; konteks menyiratkan kerendahan hati tanpa memasukkannya secara eksplisit.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: bahkan tidak mau
  rationale: Menjaga unsur kehendak atau keengganan dalam θέλω, bukan menyiratkan ketidakmampuan.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: menengadah ke langit
  rationale: Ungkapan Indonesia yang alami bagi tindakan mengangkat mata ke arah langit; objek 'mata' dapat dipahami secara idiomatis.
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: terus memukul dadanya
  rationale: Kata 'terus' menyampaikan aspek imperfektif, yakni tindakan yang berlangsung atau dilakukan berulang kali.
- source_word: ἱλάσθητί μοι
  choice: kasihanilah aku
  rationale: Permohonan langsung yang alami dan mudah dipahami dalam bahasa Indonesia, sambil nuansa pendamaian dari kelompok kata ἱλάσκομαι dijelaskan dalam catatan kaki.
- source_word: τῷ ἁμαρτωλῷ
  choice: orang berdosa ini
  rationale: Mempertahankan daya penegasan artikel Yunani dan pengakuan diri yang khusus tanpa menghasilkan frasa Indonesia yang janggal seperti 'si orang berdosa'.
theological_decisions:
- issue: Makna ἱλάσθητί μοι dalam permohonan kepada Allah
  choice: kasihanilah aku
  alternative: berkenanlah menerima pendamaian bagiku; berdamailah denganku
  rationale: Bentuk ini paling alami sebagai doa dalam bahasa Indonesia. Kata kerjanya berkaitan dengan pendamaian dan penghapusan murka, tetapi ayat ini tidak perlu dipersempit menjadi satu rumusan doktrinal; nuansa tersebut dipertahankan dalam catatan kaki.
- issue: Daya artikel pada τῷ ἁμαρτωλῷ
  choice: orang berdosa ini
  alternative: seorang berdosa
  rationale: Pilihan utama mempertahankan bentuk bertanda dan nada pengakuan diri yang kuat. Alternatif lebih lancar, tetapi meratakan penekanan artikel Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang sederhana dan khidmat. 'Namun' dan 'sebaliknya' memperjelas pertentangan wacana; 'Ya Allah' wajar untuk sapaan langsung. Semua nuansa tindakan, kehendak, dan pengakuan diri dipertahankan tanpa bahasa teologis teknis dalam teks utama.
