  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: id
  text: Ketika Yesus sedang mendekati Yerikho, seorang laki-laki buta sedang duduk di pinggir jalan sambil mengemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ketika
  rationale: Ungkapan ini terutama berfungsi sebagai peralihan naratif. Dalam bahasa Indonesia, tidak perlu diterjemahkan secara harfiah sebagai 'terjadilah'; hubungan waktunya disampaikan secara alami oleh 'ketika' bersama konstruksi berikutnya.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Ketika Yesus mendekati Yerikho
  rationale: Infinitif berartikel dengan ἐν menyatakan waktu yang bersamaan dan tindakan yang sedang berlangsung. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah referennya; εἰς dengan ἐγγίζω menunjukkan gerak menuju kota.
- source_word: τυφλός τις
  choice: ada seorang buta
  rationale: τις memberi nuansa tak tentu dan memperkenalkan seorang tokoh. Konstruksi 'ada seorang buta' menyampaikan fungsi itu secara alami; 'seorang buta tertentu' akan terdengar kaku dalam bahasa Indonesia.
- source_word: ἐκάθητο
  choice: sedang duduk
  rationale: Bentuk imperfek menggambarkan keadaan yang tengah berlangsung sebagai latar adegan.
- source_word: παρὰ τὴν ὁδὸν
  choice: di pinggir jalan
  rationale: παρά dengan akusatif di sini menunjukkan posisi di sisi jalan. 'Di pinggir jalan' adalah ungkapan Indonesia yang alami dan jelas.
- source_word: ἐπαιτῶν
  choice: sambil mengemis
  rationale: Partisipel ini menerangkan kegiatan yang dilakukan bersamaan dengan duduk. 'Sambil mengemis' mempertahankan hubungan tersebut secara wajar.
