  to: Mereka tidak memahami satu pun dari semua itu. Perkataan ini tersembunyi dari mereka,[a] dan mereka tidak mengerti hal-hal yang dikatakan.
  rationale: Revisi menghapus kontras yang tidak dinyatakan dalam teks Yunani, memperjelas bahwa para murid tidak memahami satu pun dari hal-hal tersebut, memakai preposisi Indonesia yang lebih alami untuk pasif ἀπ’ αὐτῶν, dan mempertahankan bentuk jamak pada τὰ λεγόμενα. Catatan kaki tetap ditambatkan pada klausa pasif dan menjaga ketidakjelasan pelakunya.
