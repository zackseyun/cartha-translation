  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: id
  text: Mereka tidak memahami satu pun dari semua itu. Perkataan ini tersembunyi dari mereka,[a] dan mereka tidak mengerti hal-hal yang dikatakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk pasif “tersembunyi dari mereka” tidak menyatakan siapa atau apa yang menyembunyikannya.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: memahami
  rationale: Dalam konteks ini συνίημι menunjuk pada pemahaman intelektual atas pemberitahuan Yesus sebelumnya. 'Memahami' alami dalam bahasa Indonesia dan tidak menambahkan gagasan penerimaan rohani.
- source_word: οὐδὲν τούτων
  choice: sama sekali tidak memahami semua itu
  rationale: Ungkapan ini merujuk kembali pada keseluruhan hal yang baru saja disampaikan. Susunan ini lebih alami daripada terjemahan harfiah 'tidak satu pun dari hal-hal ini', sambil mempertahankan penyangkalan yang menyeluruh.
- source_word: τὸ ῥῆμα τοῦτο
  choice: perkataan itu
  rationale: ῥῆμα di sini berarti ucapan atau hal yang disampaikan. 'Perkataan itu' sesuai dengan konteks ujaran dan tetap cukup dekat dengan bentuk Yunani.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: tersembunyi bagi mereka
  rationale: Konstruksi perifrastis dengan partisipel pasif perfek menyatakan keadaan sebagai hasil penyembunyian. Bentuk pasif dipertahankan tanpa menyebut pelaku.
- source_word: ἐγίνωσκον
  choice: mengerti
  rationale: Walaupun γινώσκω secara leksikal dapat berarti 'mengetahui', dalam konteks ini maknanya adalah menangkap arti ucapan tersebut. 'Mengerti' alami dan tetap sedikit membedakannya dari 'memahami' pada klausa pertama.
- source_word: τὰ λεγόμενα
  choice: apa yang dikatakan
  rationale: Ungkapan ini menyatakan isi yang sedang disampaikan. 'Apa yang dikatakan' merupakan padanan Indonesia yang alami tanpa mengubah acuan isinya.
theological_decisions:
- issue: Sifat ketidakpahaman para murid dan pelaku penyembunyian
  choice: Mempertahankan gambaran tiga lapis tentang ketidakpahaman serta bentuk pasif tanpa menyebut siapa atau apa yang menyembunyikan perkataan itu.
  alternative: Menafsirkan penyembunyian itu secara eksplisit sebagai tindakan Allah, atau sekadar sebagai kebingungan psikologis para murid.
  rationale: Teks Yunani tidak menyatakan pelaku κεκρυμμένον. Terjemahan tidak seharusnya menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Namun' mengungkapkan fungsi καί yang bersifat kontras dalam konteks ini; pengulangan pemahaman dipertahankan untuk mencerminkan penekanan tiga lapis dalam teks.
