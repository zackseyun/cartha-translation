  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: id
  text: Namun, ketika mendengar semuanya itu, ia menjadi sangat sedih[a], karena ia amat kaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sangat berduka.” Kata sifat Yunani yang dipakai menunjukkan kesedihan atau tekanan batin yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras antara tuntutan Yesus sebelumnya dan tanggapan orang itu; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: ἀκούσας
  choice: ketika mendengar
  rationale: Partisip aoris ini berfungsi temporal dan menunjukkan bahwa kesedihannya timbul ketika ia mendengar perkataan tersebut.
- source_word: ταῦτα
  choice: semuanya itu
  rationale: Merujuk secara jamak pada hal-hal yang baru saja dikatakan Yesus; pilihan ini alami tanpa mengubah acuannya menjadi tunggal.
- source_word: περίλυπος
  choice: sangat sedih
  rationale: Menyampaikan kesedihan atau tekanan batin yang mendalam dengan bahasa Indonesia yang jelas dan wajar.
- source_word: ἐγενήθη
  choice: menjadi
  rationale: Mempertahankan nuansa ingresif γίνομαι, yaitu masuk ke dalam keadaan sedih, bukan sekadar berada dalam keadaan itu.
- source_word: γὰρ
  choice: karena
  rationale: Menunjukkan bahwa kekayaannya menjadi alasan bagi kesedihannya.
- source_word: πλούσιος σφόδρα
  choice: amat kaya
  rationale: Mengungkapkan kuatnya intensifikasi σφόδρα secara ringkas, alami, dan bermartabat.
