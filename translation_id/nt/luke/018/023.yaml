  register: Bahasa Indonesia baku modern dengan susunan yang alami dan tetap dekat pada relasi gramatikal teks Yunani. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar diterangkannya, yaitu “sangat sedih”.
