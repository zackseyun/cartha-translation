base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: id
  text: kata-Nya, “Di sebuah kota ada seorang hakim yang tidak takut kepada Allah dan tidak menghormati siapa pun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini memperkenalkan isi perumpamaan dan terkait dengan tindakan Yesus pada ayat sebelumnya. Bentuk “kata-Nya” alami dalam narasi Indonesia dan menjelaskan pelaku yang tersirat.
- source_word: Κριτής τις
  choice: seorang hakim
  rationale: τις menandai tokoh yang tidak disebutkan namanya. Dalam bahasa Indonesia, “seorang hakim” menyampaikan ketakrifan naratif itu secara alami tanpa ungkapan kaku “seorang hakim tertentu”.
- source_word: ἦν
  choice: ada
  rationale: Pemakaian eksistensial memperkenalkan tokoh cerita secara idiomatis.
- source_word: ἔν τινι πόλει
  choice: di sebuah kota
  rationale: τινι menunjukkan kota yang tidak disebutkan secara khusus; “sebuah kota” merupakan padanan Indonesia yang alami.
- source_word: τὸν θεὸν
  choice: Allah
  rationale: Dalam konteks Yahudi dan pengajaran Yesus, ungkapan ini mengacu kepada Allah; artikel Yunani tidak perlu direproduksi dalam bahasa Indonesia.
- source_word: μὴ φοβούμενος
  choice: tidak takut kepada
  rationale: Partisipel menggambarkan sikap khas hakim itu. “Takut kepada Allah” mempertahankan nuansa moral-keagamaan verba φοβέομαι.
- source_word: ἄνθρωπον
  choice: siapa pun
  rationale: Nomina tunggal ini digunakan secara generik dan berlawanan dengan Allah. “Siapa pun” menyampaikan bahwa hakim itu tidak menaruh hormat kepada manusia mana pun, tanpa menimbulkan kesan bahwa yang dimaksud hanya laki-laki.
- source_word: μὴ ἐντρεπόμενος
  choice: tidak menghormati
  rationale: Dalam konteks ini verba tersebut menyatakan tidak mengindahkan, menghormati, atau memedulikan pandangan orang lain. “Tidak menghormati” jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna generik ἄνθρωπον dalam kontras dengan Allah
  choice: siapa pun
  alternative: manusia / orang
  rationale: Bentuk tunggal Yunani bersifat generik, bukan penegasan jenis kelamin. “Siapa pun” mempertahankan cakupan universalnya dan kontras etis antara takut kepada Allah dan menghormati sesama, tanpa memasukkan kekhususan doktrinal.
- issue: Nuansa takut kepada Allah
  choice: tidak takut kepada Allah
  alternative: tidak menghormati Allah
  rationale: Terjemahan literal dan idiomatis ini mempertahankan ungkapan teologis sumber serta ketegangan antara kewajiban kepada Allah dan kepada manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami untuk pembukaan perumpamaan. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus.
