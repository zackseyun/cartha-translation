  text: καὶ οὐκ ⸀ἤθελεν ἐπὶ χρόνον, μετὰ ⸂ταῦτα δὲ⸃ εἶπεν ἐν ἑαυτῷ· Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι ⸂οὐδὲ ἄνθρωπον⸃ ἐντρέπομαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: id
  text: Selama beberapa waktu ia tidak mau. Namun kemudian ia berkata dalam hatinya, ‘Meskipun aku tidak takut kepada Allah dan tidak menghormati siapa pun,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: ia tidak mau
  rationale: Bentuk imperfek menunjukkan bahwa ketidakmauannya berlangsung selama suatu waktu; ungkapan ini mempertahankan unsur kehendak tanpa memberi kesan penolakan yang mutlak.
- source_word: ἐπὶ χρόνον
  choice: selama beberapa waktu
  rationale: Ungkapan ini menyatakan rentang waktu yang tidak ditentukan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: μετὰ ταῦτα δὲ
  choice: Namun kemudian
  rationale: Terjemahan ini menyampaikan urutan waktu sekaligus peralihan yang bersifat kontras.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: ia berkata dalam hatinya
  rationale: Ungkapan ini mempertahankan bentuk percakapan batin dan merupakan idiom Indonesia yang wajar.
- source_word: Εἰ καὶ
  choice: Meskipun
  rationale: Dalam konteks ini konstruksi tersebut bersifat konsesif, bukan menyatakan syarat yang belum pasti.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: aku tidak takut kepada Allah
  rationale: Terjemahan ini mempertahankan ungkapan sumber dan nada pengakuan moral sang hakim; maknanya dapat mencakup tiadanya rasa gentar maupun hormat kepada Allah.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: dan tidak menghormati siapa pun
  rationale: ἐντρέπομαι di sini berarti menaruh hormat atau mengindahkan. Kata ἄνθρωπον berbentuk tunggal tetapi dipakai secara generik; 'siapa pun' menyampaikan cakupan itu secara alami tanpa membatasi rujukannya menurut gender.
theological_decisions:
- issue: Makna takut kepada Allah
  choice: tidak takut kepada Allah
  alternative: tidak menghormati Allah
  rationale: Kata φοβέομαι dapat mencakup rasa takut dan hormat, tetapi ungkapan langsung 'takut kepada Allah' mempertahankan ketegangan semantis dan gema ungkapan Alkitab tanpa mempersempitnya menjadi sekadar penghormatan.
- issue: Bentuk tunggal generik ἄνθρωπον
  choice: siapa pun
  alternative: seorang manusia
  rationale: Dalam konteks negasi, bentuk tunggal anarthrous ini menyatakan tidak adanya seorang pun yang ia hormati. 'Siapa pun' merupakan padanan Indonesia yang alami dan tetap mencakup manusia secara umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa pertama dibuat sebagai kalimat tersendiri agar alurnya jelas, sedangkan tanda koma akhir dipertahankan karena ucapan berlanjut ke ayat berikutnya.
