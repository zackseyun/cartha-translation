id: LUK.18.1
reference: Luke 18:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: id
  text: Ia menyampaikan kepada mereka sebuah perumpamaan tentang perlunya mereka selalu berdoa dan tidak menjadi tawar hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menunjukkan bahwa mereka harus selalu berdoa dan tidak menjadi putus asa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ia menyampaikan
  rationale: Bentuk imperfek memberi latar tindakan yang sedang atau berulang berlangsung. Dalam bahasa Indonesia, bentuk lampau tidak wajib ditandai secara gramatikal; konteks narasi memadai, sedangkan 'menyampaikan' terdengar wajar untuk pengajaran melalui perumpamaan.
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: δέ merupakan penghubung ringan. Dalam bahasa Indonesia, peralihan ini dapat dibiarkan tersirat agar tidak menambahkan penanda waktu seperti 'kemudian' yang tidak dinyatakan oleh teks.
- source_word: παραβολὴν
  choice: sebuah perumpamaan
  rationale: Istilah baku dan tepat bagi παραβολή dalam konteks Injil Sinoptik.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Mencerminkan objek tak langsung dari Ἔλεγεν dan menunjuk kepada para pendengar Yesus.
- source_word: πρὸς τὸ δεῖν ... αὐτοὺς
  choice: tentang perlunya mereka
  rationale: Mengungkapkan acuan atau tujuan konstruksi πρὸς τὸ dengan infinitif sekaligus mempertahankan unsur keharusan dalam δεῖν secara alami.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan langsung dan alami yang menekankan ketekunan tanpa harus berarti ucapan doa tanpa jeda.
- source_word: προσεύχεσθαι
  choice: berdoa
  rationale: Padanan Indonesia yang lazim dan tepat.
- source_word: μὴ ἐγκακεῖν
  choice: tidak menjadi tawar hati
  rationale: '''Tawar hati'' mempertahankan nuansa kehilangan keberanian atau semangat dalam konteks ketekunan berdoa, bukan sekadar berhenti melakukan sesuatu.'
theological_decisions:
- issue: Daya keharusan dalam ajaran Yesus tentang ketekunan berdoa
  choice: '''perlunya mereka'' mempertahankan keharusan untuk selalu berdoa dan tidak tawar hati'
  alternative: '''untuk menunjukkan bahwa mereka harus selalu berdoa dan tidak menjadi putus asa'''
  rationale: δεῖν menyatakan keharusan, tetapi ayat ini tidak menjabarkan suatu sistem teologis tentang kemanjuran doa. Rumusan ini mempertahankan daya nasihat dan ketegangan teologis teks tanpa menambah ajaran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Ia' dipakai untuk rujukan naratif kepada Yesus; 'tawar hati' dipilih sebagai ungkapan yang masih umum dan sesuai dengan konteks ketekunan.
