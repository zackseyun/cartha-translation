id: LUK.18.8
reference: Luke 18:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: id
  text: 'Aku berkata kepadamu: Ia akan segera menegakkan keadilan bagi mereka.[a] Namun, ketika Anak Manusia datang, akankah Ia benar-benar mendapati iman[b] di bumi?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberikan keadilan kepada mereka” atau “membela hak mereka.” Istilah Yunani ini dapat menunjuk pada pembelaan hukum atau keadilan yang dilaksanakan demi seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepercayaan” atau “kesetiaan.” Kata Yunani ini dapat bermakna iman, kepercayaan, atau kesetiaan; teks utama mempertahankan padanan yang lebih luas, “iman.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: Ia akan menegakkan keadilan bagi mereka
  rationale: Ungkapan ini menyatakan tindakan memberikan keadilan atau pembelaan hukum kepada pihak yang diperlakukan tidak adil. Dalam konteks janda yang memohon keadilan, 'menegakkan keadilan bagi mereka' jelas dan alami serta tidak terlalu menonjolkan nuansa pembalasan.
- source_word: ἐν τάχει
  choice: segera
  rationale: Frasa ini dapat menunjukkan tindakan yang dilakukan dengan cepat atau tanpa penundaan. 'Segera' mempertahankan daya temporalnya tanpa menetapkan jadwal eskatologis yang terlalu spesifik.
- source_word: πλὴν
  choice: Namun
  rationale: Kata ini menandai peralihan kontras yang kuat dari kepastian keadilan Allah kepada pertanyaan tajam yang menyusul.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini merupakan padanan baku bagi gelar yang digunakan Yesus tentang diri-Nya dan mempertahankan kaitannya dengan Daniel 7.
- source_word: ἐλθὼν
  choice: ketika ... datang
  rationale: 'Partisip aoris ini secara wajar dipahami secara temporal dalam hubungannya dengan kata kerja utama: ''ketika Anak Manusia datang''.'
- source_word: ἆρα
  choice: benar-benar
  rationale: Partikel ini memberi pertanyaan tersebut nada merenung dan menyelidik; 'benar-benar' mengungkapkan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: τὴν πίστιν
  choice: iman
  rationale: '''Iman'' mempertahankan keluasan makna πίστις tanpa mempersempitnya hanya menjadi kepercayaan batin atau kesetiaan yang tampak dalam tindakan.'
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Padanan ini alami dalam bahasa Indonesia dan sesuai dengan cakupan luas perkataan eskatologis tersebut.
theological_decisions:
- issue: Makna πίστις dalam konteks ketekunan berdoa
  choice: iman
  alternative: kepercayaan atau kesetiaan
  rationale: '''Iman'' dipertahankan dalam teks utama karena paling luas dan lazim, sedangkan kemungkinan nuansa kepercayaan yang bertahan atau kesetiaan tidak diselesaikan secara dogmatis dan dicantumkan dalam catatan.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur retoris dipertahankan dengan titik dua dan pertanyaan langsung. Kapitalisasi pronomina 'Ia' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan ilahi.
