  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: id
  text: 'Engkau tahu perintah-perintah itu: Jangan berzina[a], jangan membunuh, jangan mencuri, jangan bersaksi dusta, hormatilah ayah dan ibumu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan rumusan yang lebih tradisional: “Janganlah engkau berzina ... Janganlah engkau membunuh ... Janganlah engkau mencuri ... Janganlah engkau bersaksi dusta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: perintah-perintah itu
  rationale: Bentuk jamak ἐντολάς menunjuk pada perintah yang sudah dikenal, yakni perintah-perintah dalam Sepuluh Perintah Allah; kata 'itu' secara alami menyampaikan keberterimaan bentuk definit dalam bahasa Indonesia.
- source_word: οἶδας
  choice: Engkau tahu
  rationale: Walaupun οἶδα berbentuk perfektum, dalam bahasa Yunani Koine kata ini berfungsi dengan makna kini. 'Engkau tahu' mempertahankan sapaan tunggal dan sesuai dengan register Alkitab modern yang bermartabat.
- source_word: Μὴ μοιχεύσῃς
  choice: Jangan berzina
  rationale: μοιχεύω berarti melakukan perzinaan. Larangan 'Jangan berzina' ringkas, jelas, dan lazim dalam bahasa Indonesia modern.
- source_word: Μὴ φονεύσῃς
  choice: jangan membunuh
  rationale: φονεύω menunjuk pada tindakan membunuh manusia secara melawan hukum atau pembunuhan, bukan setiap tindakan menghilangkan nyawa. Dalam rumusan perintah yang sudah dikenal, 'jangan membunuh' merupakan padanan Indonesia yang alami; cakupan leksikalnya dijaga dalam pemahaman konteks.
- source_word: Μὴ κλέψῃς
  choice: jangan mencuri
  rationale: κλέπτω secara langsung berarti mencuri; padanan ini tepat dan alami.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: jangan bersaksi dusta
  rationale: ψευδομαρτυρέω berarti memberikan kesaksian palsu. 'Bersaksi dusta' mempertahankan unsur kesaksian dan gema rumusan hukum, tanpa menjadi terlalu teknis.
- source_word: Τίμα
  choice: hormatilah
  rationale: τιμάω di sini berarti menghormati atau menjunjung orang tua. Bentuk '-lah' menyatakan daya imperatif positif secara wajar dan bermartabat.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ayah dan ibumu
  rationale: Frasa Yunani menyebut kedua orang tua, dengan kepunyaan yang secara makna berlaku bagi keduanya. Dalam bahasa Indonesia, 'ayah dan ibumu' alami dan tidak perlu mengulang akhiran posesif.
theological_decisions:
- issue: Bentuk larangan dalam kutipan Sepuluh Perintah Allah
  choice: Menggunakan bentuk imperatif modern 'Jangan ...'.
  alternative: Menggunakan bentuk yang lebih tradisional, misalnya 'Janganlah engkau ...'.
  rationale: Larangan Yunani memakai μή dengan subjungtif aoris dan berfungsi sebagai perintah langsung. 'Jangan ...' menyampaikan daya larang dengan jelas dalam bahasa Indonesia modern tanpa mengubah bobot moral atau statusnya sebagai perintah.
- issue: Cakupan φονεύω
  choice: Menerjemahkan 'jangan membunuh'.
  alternative: Menerjemahkan secara lebih eksplisit 'jangan melakukan pembunuhan'.
  rationale: φονεύω lebih sempit daripada tindakan membunuh dalam arti seluas-luasnya dan lazim menunjuk pembunuhan manusia. Rumusan 'jangan membunuh' paling alami serta dikenal dalam bahasa Indonesia, tanpa memasukkan penjelasan doktrinal mengenai semua kemungkinan penghilangan nyawa.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat. Sapaan tunggal 'Engkau' dipakai untuk mempertahankan bentuk orang kedua tunggal dan kesinambungan register naratif Alkitab; deretan larangan dibuat ringkas, sedangkan imperatif positif memakai '-lah' agar alami.
