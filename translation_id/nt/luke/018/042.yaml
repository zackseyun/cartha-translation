  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Terimalah kembali penglihatanmu[a]; imanmu telah menyelamatkanmu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lihatlah kembali.” Kata Yunani yang digunakan dapat berarti “melihat kembali” dalam konteks penyembuhan.
    reason: lexical_alternative
  - marker: b
    text: Atau “imanmu telah menyembuhkanmu” atau “imanmu telah membuatmu pulih.” Kata kerja Yunani ini dapat merujuk pada penyembuhan maupun keselamatan.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Sebagai penghubung narasi, καί di sini secara alami diterjemahkan “Lalu” tanpa menambahkan hubungan sebab-akibat.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Terjemahan langsung dan wajar untuk pengantar perkataan, dengan tetap menyatakan objek tidak langsung.
- source_word: Ἀνάβλεψον
  choice: Melihatlah kembali
  rationale: Dalam konteks penyembuhan orang buta, verba ini berarti memperoleh kembali penglihatan, bukan sekadar menengadah. Bentuk perintah dipertahankan.
- source_word: πίστις
  choice: iman
  rationale: Dalam konteks ini menunjuk pada kepercayaan orang itu kepada Yesus; “iman” mempertahankan istilah teologis yang lazim sekaligus alami dalam bahasa Indonesia.
- source_word: σέσωκέν
  choice: telah menyelamatkan
  rationale: Bentuk perfektum menyatakan hasil yang telah terjadi dan tetap berlaku. “Menyelamatkan” mempertahankan keluasan makna σῴζω, yang dalam konteks ini dapat mencakup kesembuhan jasmani sekaligus keselamatan dalam arti yang lebih luas.
theological_decisions:
- issue: Cakupan makna σῴζω dalam kisah penyembuhan
  choice: telah menyelamatkanmu
  alternative: telah menyembuhkanmu; telah membuatmu pulih
  rationale: Konteks jelas melibatkan pemulihan penglihatan, tetapi σῴζω juga dapat menyatakan keselamatan. Terjemahan utama mempertahankan ketegangan dan keluasan teologis itu, sedangkan catatan kaki menjelaskan makna penyembuhannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ambiguitas asli pada ἀναβλέπω dan σῴζω dipertahankan serta dijelaskan melalui catatan kaki.
