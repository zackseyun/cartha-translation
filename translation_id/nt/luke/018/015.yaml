id: LUK.18.15
reference: Luke 18:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: id
  text: Orang-orang bahkan membawa bayi-bayi kepada Yesus supaya Ia menyentuh mereka[a]. Namun, ketika murid-murid melihat hal itu[c], mereka menegur orang-orang itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kisah-kisah sejajar, sentuhan Yesus dikaitkan dengan pemberkatan dan penumpangan tangan atas anak-anak (lih. Mat. 19:13; Mrk. 10:13, 16).
    reason: cross_reference
  - marker: b
    text: Maksudnya, orang-orang yang membawa bayi-bayi itu kepada Yesus.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, ketika mereka melihat orang-orang membawa bayi-bayi itu kepada Yesus.
    reason: clarification
lexical_decisions:
- source_word: Προσέφερον
  choice: membawa
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang atau berulang kali berlangsung. Dalam bahasa Indonesia, aspek itu cukup wajar disampaikan oleh konteks jamak dan alur narasi tanpa harus menambahkan 'terus-menerus'.
- source_word: δὲ
  choice: Namun
  rationale: Kemunculan pertama berfungsi sebagai penghubung naratif ringan dan tidak perlu diterjemahkan tersendiri; kemunculan kedua menandai kontras antara tindakan orang-orang dan tanggapan para murid, sehingga diterjemahkan 'Namun'.
- source_word: αὐτῷ
  choice: kepada Yesus
  rationale: Rujukan pronomina adalah Yesus. Penyebutan nama membuat kalimat Indonesia jelas dan alami tanpa mengubah acuannya.
- source_word: καὶ
  choice: bahkan
  rationale: Dalam konteks ini kata tersebut memberi penekanan bahwa bayi-bayi pun dibawa kepada Yesus.
- source_word: τὰ βρέφη
  choice: bayi-bayi
  rationale: βρέφη menunjuk kepada anak-anak yang masih sangat kecil, khususnya bayi. 'Bayi-bayi' tepat, alami, dan mudah dipahami.
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan orang-orang membawa bayi-bayi itu.
- source_word: αὐτῶν ἅπτηται
  choice: Ia menyentuh mereka
  rationale: ἅπτομαι berarti 'menyentuh'. Terjemahan tidak memasukkan gagasan 'memberkati' atau 'menumpangkan tangan' ke dalam teks utama meskipun konteks paralelnya mengaitkan sentuhan itu dengan berkat.
- source_word: ἰδόντες
  choice: ketika ... melihat hal itu
  rationale: Partisip aoris diterjemahkan sebagai klausa waktu yang alami dalam bahasa Indonesia. 'Hal itu' merujuk pada peristiwa membawa bayi-bayi kepada Yesus.
- source_word: οἱ μαθηταὶ
  choice: murid-murid
  rationale: Menerjemahkan nomina jamak definit secara langsung; konteks menjelaskan bahwa mereka adalah murid-murid Yesus.
- source_word: ἐπετίμων
  choice: menegur
  rationale: ἐπιτιμάω menyatakan teguran atau kecaman. 'Menegur' mempertahankan kekuatan tindakan itu dalam bahasa Indonesia yang wajar; konteks menunjukkan bahwa teguran tersebut ditujukan kepada para pembawa bayi.
- source_word: αὐτοῖς
  choice: orang-orang itu
  rationale: Pronomina ini paling wajar merujuk kepada orang-orang yang membawa bayi-bayi, bukan kepada bayi-bayi itu sendiri. Ungkapan ini memperjelas acuan tanpa menyebut identitas yang tidak diberikan teks.
theological_decisions:
- issue: Sifat tindakan Yesus terhadap bayi-bayi
  choice: menyentuh mereka
  alternative: memberkati mereka; menumpangkan tangan atas mereka
  rationale: Teks Lukas memakai ἅπτηται, 'menyentuh'. Catatan paralel menghubungkannya dengan berkat dan penumpangan tangan, tetapi terjemahan utama mempertahankan kata Lukas dan tidak menyelesaikan implikasi teologisnya secara diam-diam.
- issue: Sasaran teguran para murid
  choice: orang-orang yang membawa bayi-bayi
  alternative: bayi-bayi itu
  rationale: Bentuk αὐτοῖς secara tata bahasa dapat berarti 'kepada mereka', tetapi alur tindakan paling alami menunjukkan para pembawa bayi sebagai sasaran teguran. Acuan tersebut dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. 'Bayi-bayi' dipilih daripada istilah yang lebih teknis atau lebih luas. Susunan penanda catatan dibuat berurutan dalam teks Indonesia, dan setiap penanda muncul pada bagian yang dijelaskannya.
