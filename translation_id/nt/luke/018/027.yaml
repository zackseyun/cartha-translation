base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: id
  text: Namun, Yesus berkata, “Apa yang mustahil bagi manusia adalah mungkin bagi Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: apa yang mustahil
  rationale: Adjektiva netral jamak yang dipakai secara substantival. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan hal-hal yang berada di luar kemampuan manusia.
- source_word: παρὰ ἀνθρώποις
  choice: bagi manusia
  rationale: παρά dengan datif menyatakan ranah atau acuan. “Bagi manusia” secara idiomatis menunjukkan apa yang mustahil dalam ranah kemampuan manusia; ἀνθρώποις merujuk kepada manusia secara umum.
- source_word: δυνατά
  choice: mungkin
  rationale: Sebagai lawan langsung dari ἀδύνατα dan juga dipakai secara substantival, kata ini paling tepat dan alami diterjemahkan “mungkin” dalam susunan kalimat ini.
- source_word: παρὰ τῷ θεῷ
  choice: bagi Allah
  rationale: Sejajar dengan παρὰ ἀνθρώποις, frasa ini menyatakan acuan atau ranah kemampuan. “Bagi Allah” mempertahankan kontras yang jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ὁ δὲ εἶπεν
  choice: Namun, Yesus berkata
  rationale: δέ bersifat transisional dengan nuansa pertentangan terhadap pernyataan sebelumnya. Subjek tersirat diperjelas sebagai “Yesus” agar alami dan tidak rancu dalam kutipan ayat tunggal.
theological_decisions:
- issue: Cakupan kemungkinan ilahi
  choice: Ayat ini menyatakan bahwa apa yang mustahil dalam ranah manusia adalah mungkin bagi Allah, dalam konteks keselamatan.
  alternative: Memahaminya sebagai kaidah filosofis mutlak tentang setiap tindakan yang dapat dibayangkan.
  rationale: Bahasa Yunani mengontraskan ketidakmampuan manusia dengan kemampuan Allah dalam konteks orang kaya memasuki Kerajaan Allah. Terjemahan mempertahankan pernyataan luas itu tanpa menambahkan batasan ataupun klaim filosofis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Namun” mengalir alami sebagai tanggapan yang berlawanan dengan ayat sebelumnya; “manusia” bersifat generik dan inklusif. Tidak diperlukan catatan kaki karena alternatif “di hadapan/di sisi” akan kurang idiomatis dan tidak menambah ambiguitas bermakna dalam bahasa sasaran.
