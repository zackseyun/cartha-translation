  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: id
  text: Ia juga menyampaikan perumpamaan ini kepada beberapa orang yang yakin bahwa mereka sendiri adalah orang benar dan yang memandang rendah orang-orang lain:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghina orang-orang lain” atau “menganggap orang-orang lain tidak berarti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ καὶ
  choice: Ia juga menyampaikan
  rationale: δέ berfungsi sebagai penghubung ringan yang tidak perlu dinyatakan tersendiri dalam bahasa Indonesia, sedangkan καί dipertahankan dengan “juga”. Karena objeknya adalah perumpamaan, “menyampaikan” terdengar alami dan bermartabat.
- source_word: πρός τινας
  choice: kepada beberapa orang
  rationale: πρός dengan orang sesudah verba ujaran menandai pihak yang dituju.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: yang mengandalkan diri sendiri
  rationale: Bentuk perfektum partisip menunjukkan keyakinan yang telah menetap; frasa ini menekankan bahwa dasar keyakinan mereka adalah diri sendiri.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: karena menganggap diri mereka benar
  rationale: ὅτι di sini dapat menyatakan isi atau dasar keyakinan. “Menganggap diri mereka benar” mengungkapkan penilaian diri mereka tanpa menyatakan bahwa penilaian itu benar secara objektif, sekaligus mempertahankan istilah kunci δίκαιοι dengan “benar”.
- source_word: ἐξουθενοῦντας
  choice: memandang rendah
  rationale: Ungkapan Indonesia ini secara alami menyampaikan arti menganggap orang lain tidak bernilai atau hina.
- source_word: τοὺς λοιπούς
  choice: semua orang lain
  rationale: Secara harfiah berarti “orang-orang yang selebihnya”; dalam konteks sikap kelompok ini, “semua orang lain” menyampaikan cakupan kontras secara alami.
- source_word: τὴν παραβολὴν ταύτην
  choice: perumpamaan ini
  rationale: “Perumpamaan” adalah padanan baku dan tepat bagi παραβολή dalam tradisi Injil Sinoptik.
theological_decisions:
- issue: Makna δίκαιοι dalam konteks sikap membenarkan diri
  choice: benar
  alternative: saleh; dibenarkan; berada di pihak yang benar
  rationale: Teks memakai δίκαιοι tanpa bentuk yang secara leksikal bernada mencela. “Benar” mempertahankan kosakata moral-teologis dan membiarkan konteks menunjukkan bahwa penilaian tersebut berasal dari diri mereka sendiri.
- issue: Hubungan ὅτι dengan kepercayaan kepada diri sendiri
  choice: karena menganggap diri mereka benar
  alternative: bahwa mereka benar
  rationale: ὅτι dapat dibaca sebagai penjelas isi keyakinan maupun sebabnya. Rumusan ini alami dalam bahasa Indonesia namun tidak menambahkan klaim objektif tentang kebenaran mereka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Ia” menghindari kekakuan, sementara “mengandalkan diri sendiri” dan “memandang rendah” mudah dipahami pembaca umum. Penanda catatan kaki dicantumkan dalam teks utama.
