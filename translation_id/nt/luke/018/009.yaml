  naturalness: Teksnya pada umumnya jelas dan modern. “Yakin bahwa mereka sendiri adalah orang benar” terdengar alami dalam bahasa Indonesia dan menyampaikan kepercayaan diri mereka tanpa konstruksi literal yang kaku.
  terminology: “Perumpamaan” tepat untuk παραβολή. “Orang benar” lebih jelas memelihara nuansa moral-keagamaan δίκαιοι daripada “benar” saja, yang dalam bahasa Indonesia dapat terutama dipahami sebagai ‘tidak keliru’. “Memandang rendah” tepat untuk ἐξουθενοῦντας.
