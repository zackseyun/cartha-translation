id: LUK.18.31
reference: Luke 18:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: id
  text: Kemudian Yesus mengajak kedua belas orang itu dan berkata kepada mereka, “Lihatlah, kita sedang naik ke Yerusalem, dan segala sesuatu yang ditulis melalui para nabi mengenai Anak Manusia[a] akan digenapi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi Anak Manusia.” Susunan bahasa Yunani dapat diterjemahkan lebih harfiah demikian, tetapi kemungkinan besar mengacu pada apa yang ditulis para nabi mengenai Dia.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: mengajak
  rationale: Bentuk partisip ini menggambarkan Yesus membawa kedua belas orang itu bersama-Nya untuk menyampaikan sesuatu kepada mereka. “Mengajak” alami dalam bahasa Indonesia dan tidak menambahkan secara tegas gagasan “menyendiri,” yang tidak dinyatakan langsung oleh kata Yunani.
- source_word: τοὺς δώδεκα
  choice: kedua belas orang itu
  rationale: Teks Yunani hanya menyebut “kedua belas.” Bentuk ini mempertahankan sebutan bagi kelompok inti pengikut Yesus tanpa menambahkan kata “murid.”
- source_word: Ἰδοὺ
  choice: Perhatikanlah
  rationale: Kata ini berfungsi menarik perhatian pendengar kepada pernyataan penting berikutnya. “Perhatikanlah” jelas, wajar, dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἀναβαίνομεν
  choice: kita sedang pergi
  rationale: Bentuk kini memberi kesan perjalanan yang sedang berlangsung. Unsur harfiah “naik” tidak dinyatakan dalam teks utama karena “pergi ke Yerusalem” lebih alami bagi pembaca Indonesia, sementara tujuan geografisnya tetap jelas.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: τελεσθήσεται
  choice: akan digenapi
  rationale: Bentuk pasif mendatang menunjukkan bahwa semua yang tertulis akan mencapai penggenapannya. “Digenapi” sesuai dengan konteks nubuat dan mempertahankan tema penggenapan Kitab Suci.
- source_word: πάντα τὰ γεγραμμένα
  choice: segala sesuatu yang ditulis
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari πάντα dan hasil tetap dari tindakan menulis yang tersirat dalam partisip perfek γεγραμμένα.
- source_word: διὰ τῶν προφητῶν
  choice: melalui para nabi
  rationale: διά dengan genitif dapat menyatakan perantaraan atau sarana. “Melalui para nabi” mempertahankan kemungkinan bahwa Allah menyampaikan firman dengan perantaraan mereka.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: mengenai Anak Manusia
  rationale: Datif ini paling wajar dipahami sebagai rujukan kepada hal-hal yang ditulis mengenai Anak Manusia. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah, “bagi Anak Manusia.”
theological_decisions:
- issue: Penerjemahan gelar kristologis ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan bentuk ungkapan Yunani, pemakaiannya sebagai gelar, dan kemungkinan gema Daniel tanpa mengubahnya menjadi sebutan generik.
- issue: Hubungan datif τῷ υἱῷ τοῦ ἀνθρώπου dengan πάντα τὰ γεγραμμένα
  choice: yang ditulis ... mengenai Anak Manusia
  alternative: yang ditulis ... bagi Anak Manusia
  rationale: Konteks mendukung pengertian bahwa tulisan para nabi berkenaan dengan Anak Manusia, tetapi bentuk datif Yunani memungkinkan nuansa “bagi,” sehingga alternatif itu dicatat dan ambiguitasnya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur Yunani tanpa terasa kaku. Nama Yesus disebut untuk memperjelas subjek yang hanya tersirat dalam bentuk partisip Yunani; rujukannya tidak ambigu dari konteks.
