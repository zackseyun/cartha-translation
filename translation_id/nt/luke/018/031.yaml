  naturalness: Kalimat revisi tetap alami dalam bahasa Indonesia modern. ‘Kita sedang naik ke Yerusalem’ adalah ungkapan yang jelas dan mempertahankan arah gerak yang ada dalam bahasa Yunani. ‘Mengajak kedua belas orang itu’ dapat dipertahankan tanpa menambahkan ‘murid’ atau secara pasti menyatakan bahwa mereka dibawa menyendiri.
  terminology: ‘Anak Manusia’ adalah padanan yang tepat dan mapan untuk gelar tersebut. ‘Akan digenapi’ tepat dalam konteks kenabian. Catatan kaki secara memadai memelihara kemungkinan relasi datif yang lebih harfiah (‘bagi Anak Manusia’) tanpa memaksakannya sebagai makna utama.
