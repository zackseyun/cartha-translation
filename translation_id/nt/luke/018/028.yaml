  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: id
  text: Lalu Petrus berkata, “Lihat, kami telah meninggalkan milik kami[a] dan mengikut Engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal-hal yang menjadi milik kami.” Ungkapan Yunani ini luas dan tidak menjelaskan secara khusus apa saja yang telah mereka tinggalkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: berkata
  rationale: Bentuk aoris λέγω paling wajar diterjemahkan dengan verba naratif netral “berkata”; konteks tidak menuntut “menjawab”.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan atau peralihan ringan dalam narasi. “Lalu” menghasilkan alur bahasa Indonesia yang alami tanpa memberi kesan pertentangan yang kuat.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: ἰδού berfungsi menarik perhatian. “Lihat” mempertahankan daya serunya dalam bahasa Indonesia modern dan lebih langsung daripada menghilangkannya.
- source_word: ἡμεῖς
  choice: kami
  rationale: Kata ganti eksplisit ini memberi penekanan dan, karena Petrus berbicara kepada Yesus, bentuk eksklusif “kami” tepat. Penekanan turut disampaikan oleh “Lihat” dan susunan kalimat.
- source_word: ἀφέντες
  choice: telah meninggalkan
  rationale: 'Partisip aoris ini secara idiomatis dapat dirangkai dengan verba utama sebagai tindakan yang telah dilakukan: “telah meninggalkan ... dan mengikut.” “Meninggalkan” tidak menambahkan intensitas yang mungkin tersirat dalam “menelantarkan” atau “menyangkal.”'
- source_word: τὰ ἴδια
  choice: semua yang kami miliki
  rationale: Ungkapan substantival ini secara luas menunjuk pada apa yang menjadi milik mereka. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasinya hanya pada rumah atau harta benda tertentu; “semua” menyatakan keseluruhan yang tersirat oleh bentuk jamak berartikel dalam konteks ini.
- source_word: ἠκολουθήσαμέν σοι
  choice: mengikut Engkau
  rationale: ἀκολουθέω dengan datif adalah verba baku untuk mengikuti seseorang, termasuk sebagai murid. “Mengikut Engkau” mempertahankan nuansa pemuridan tanpa parafrasa tambahan; kapitalisasi mengikuti register penghormatan dalam teks Alkitab Indonesia.
theological_decisions:
- issue: Cakupan τὰ ἴδια
  choice: semua yang kami miliki
  alternative: milik kami sendiri; kepunyaan kami
  rationale: Teks Yunani sengaja luas dan tidak menentukan apakah yang ditinggalkan adalah harta, rumah, keluarga, pekerjaan, atau seluruh ranah kepunyaan pribadi. Terjemahan utama dibuat alami, sedangkan catatan kaki menjaga keluasan dan ketidakpastian acuannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lihat” mempertahankan seruan Petrus, sedangkan “kami” membedakan kelompok para murid dari Yesus sebagai lawan bicara. Frasa “semua yang kami miliki” dipakai agar alami, dengan catatan kaki untuk mempertahankan keluasan ungkapan Yunani.
