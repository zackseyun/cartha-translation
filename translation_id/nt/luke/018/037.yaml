  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: id
  text: Lalu mereka memberitahukan kepadanya[a], “Yesus orang Nazaret sedang lewat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus dari Nazaret sedang lewat.” Teks Yunani menyebut-Nya “Yesus orang Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: orang-orang memberi tahu
  rationale: Kata kerja ini berarti menyampaikan atau memberitahukan suatu informasi. Dalam konteks percakapan ini, “memberi tahu” alami dalam bahasa Indonesia dan tetap mencerminkan tindakan menyampaikan kabar.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini merupakan penghubung ringan yang melanjutkan alur cerita, bukan menyatakan pertentangan yang kuat.
- source_word: αὐτῷ
  choice: dia
  rationale: Bentuk datif ini menyatakan penerima informasi dan secara alami diungkapkan sebagai objek setelah “memberi tahu”.
- source_word: ὅτι
  choice: kutipan langsung
  rationale: ὅτι memperkenalkan isi pemberitahuan. Kutipan langsung menghasilkan kalimat Indonesia yang hidup dan alami tanpa mengubah isi.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ὁ Ναζωραῖος
  choice: orang Nazaret
  rationale: Ungkapan Yunani berbentuk sebutan substantival yang mengidentifikasi Yesus berdasarkan Nazaret. “Orang Nazaret” mempertahankan bentuk sebutan itu secara alami; alternatif “Yesus dari Nazaret” dicatat dalam catatan kaki.
- source_word: παρέρχεται
  choice: sedang lewat
  rationale: Bentuk kini dalam konteks ini menggambarkan tindakan yang tengah berlangsung ketika Yesus melewati tempat tersebut.
theological_decisions:
- issue: Penerjemahan sebutan Ναζωραῖος bagi Yesus
  choice: orang Nazaret
  alternative: dari Nazaret; orang Nazorean
  rationale: Sebutan ini terutama merupakan penanda geografis atau identitas, bukan gelar kristologis yang perlu diperluas secara doktrinal. Pilihan ini dekat dengan bentuk Yunani sekaligus wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, sederhana, dan bermartabat. Subjek jamak tersirat dalam verba Yunani dinyatakan sebagai “orang-orang” karena identitas maupun jumlah pastinya tidak dijelaskan dalam ayat ini.
