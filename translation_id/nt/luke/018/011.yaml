id: LUK.18.11
reference: Luke 18:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: id
  text: 'Orang Farisi itu berdiri terpisah[a] dan berdoa demikian: ‘Ya Allah, aku bersyukur kepada-Mu karena aku tidak seperti orang-orang lain—pemeras, orang-orang yang tidak benar, pezina—atau bahkan seperti pemungut pajak ini.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berdiri, ia berdoa kepada dirinya sendiri demikian.” Frasa Yunani πρὸς ἑαυτόν dapat berarti bahwa ia berdiri terpisah atau, secara ironis, bahwa doanya diarahkan kepada dirinya sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: berdiri
  rationale: Partisip aoris dari ἵστημι menyatakan postur atau tindakan pendahulu dalam adegan; ‘berdiri’ alami dan tepat dalam bahasa Indonesia.
- source_word: πρὸς ἑαυτὸν
  choice: menyendiri
  rationale: Frasa ini dapat dipahami secara spasial, ‘tersendiri/menyendiri’, atau secara refleksif, ‘kepada dirinya sendiri’. Teks utama memakai pengertian spasial yang sesuai dengan adegan, sedangkan kemungkinan refleksif dipertahankan dalam catatan kaki.
- source_word: ταῦτα
  choice: demikian
  rationale: Secara harfiah berarti ‘hal-hal ini’ dan menunjuk pada isi doa berikutnya. Dalam konstruksi Indonesia, ‘berdoa demikian’ lebih wajar tanpa menghilangkan fungsi deiktiknya.
- source_word: προσηύχετο
  choice: berdoa
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung, tetapi bahasa Indonesia tidak wajib menandai aspek tersebut secara verbal; konteks naratif sudah menyampaikannya.
- source_word: εὐχαριστῶ σοι
  choice: aku bersyukur kepada-Mu
  rationale: Ungkapan Indonesia yang alami untuk menyampaikan tindakan mengucap syukur kepada Allah.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: seperti orang-orang lain
  rationale: Mengungkapkan perbandingan dengan manusia lain secara generik dan alami. Bentuk ‘orang-orang lain’ mempertahankan luasnya rujukan tanpa memakai bahasa bergender yang tidak diperlukan dalam bahasa Indonesia.
- source_word: ἅρπαγες
  choice: pemeras
  rationale: ἅρπαξ menunjuk orang yang merampas atau mengeksploitasi dengan rakus; ‘pemeras’ cocok dengan daftar keburukan moral dan lebih spesifik daripada ‘perampok’.
- source_word: ἄδικοι
  choice: orang tidak benar
  rationale: Pilihan ini mempertahankan dimensi moral-religius ἄδικος dan lebih mudah dipahami pembaca umum daripada bentuk abstrak atau istilah yang terlalu teknis.
- source_word: μοιχοί
  choice: pezina
  rationale: Padanan substantival yang ringkas, baku, dan lazim bagi orang yang melakukan perzinaan.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: atau bahkan seperti pemungut pajak ini
  rationale: ‘Bahkan’ menangkap penajaman καί dalam perbandingan yang merendahkan, sedangkan ‘pemungut pajak’ adalah padanan standar τελώνης.
theological_decisions:
- issue: Makna πρὸς ἑαυτόν dalam gambaran doa orang Farisi
  choice: Dipahami secara spasial sebagai ‘menyendiri’ dalam teks utama.
  alternative: 'Dipahami secara refleksif: ‘berdoa kepada dirinya sendiri’ atau ‘berdoa dalam hati’.'
  rationale: Bahasa Yunani memungkinkan kedua pengertian. Teks utama mempertahankan gambaran naratif bahwa ia berdiri terpisah, sementara catatan kaki menjaga kemungkinan ironi bahwa doanya diarahkan kepada dirinya sendiri, tanpa menetapkan salah satu tafsiran teologis secara mutlak.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina doa memakai ‘aku’ dan ‘kepada-Mu’, sesuai tuturan langsung kepada Allah. Tanda pisah mempertahankan bentuk daftar dan penekanan klimaks pada pemungut pajak.
