  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: id
  text: Lalu Tuhan berkata, “Dengarkanlah apa yang dikatakan oleh hakim yang tidak adil itu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hakim ketidakadilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Lalu ... berkata
  rationale: δέ melanjutkan alur narasi, sedangkan aoristus εἶπεν secara wajar diterjemahkan dengan bentuk naratif sederhana “berkata.” “Lalu” menyatakan kelanjutan tanpa menekankan urutan waktu secara berlebihan.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Dalam narasi Lukas, sebutan ini merujuk kepada Yesus dan memiliki bobot gelar; “Tuhan” mempertahankan hal itu tanpa menambahkan penafsiran.
- source_word: Ἀκούσατε
  choice: Dengarkanlah
  rationale: Imperatif ini meminta pendengar menyimak dengan perhatian. “Dengarkanlah” alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: τί ... λέγει
  choice: apa yang dikatakan
  rationale: τί menunjuk pada isi perkataan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menggeser maknanya menjadi cara hakim itu berbicara.
- source_word: ὁ κριτὴς τῆς ἀδικίας
  choice: hakim yang tidak adil itu
  rationale: Genitif τῆς ἀδικίας bersifat kualitatif dan menggambarkan watak hakim. “Yang tidak adil” adalah padanan Indonesia yang jelas dan idiomatis; “itu” menandai hakim yang telah disebut dalam perumpamaan.
theological_decisions:
- issue: Penerjemahan κύριος sebagai sebutan bagi Yesus
  choice: Tuhan
  alternative: tuan
  rationale: “Tuhan” mempertahankan bobot kristologis gelar κύριος dalam narasi Lukas, sedangkan “tuan” dapat menyempitkannya menjadi sapaan sosial biasa.
- issue: Makna τῆς ἀδικίας
  choice: yang tidak adil
  alternative: ketidakadilan
  rationale: Bentuk Yunani harfiahnya “hakim ketidakadilan,” tetapi secara alami berfungsi sebagai gambaran kualitatif. Terjemahan utama menyampaikan sifat moral hakim tanpa menentukan lebih jauh apakah ketidakadilannya hanya bersifat yuridis atau lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Partikel “-lah” mempertahankan ketegasan imperatif dengan nada yang tetap wajar dan bermartabat.
source_grounding:
