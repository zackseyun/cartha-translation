  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: id
  text: yang pasti akan menerima berlipat-lipat lebih banyak pada masa ini, dan pada zaman yang akan datang, hidup kekal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “zaman mendatang.”
    reason: Padanan alternatif yang lebih ringkas untuk αἰῶνι τῷ ἐρχομένῳ.
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: pasti akan
  rationale: Gabungan negasi yang sangat tegas dengan bentuk subjungtif menyatakan kepastian. Dalam bahasa Indonesia, bentuk positif “pasti akan” menyampaikan daya penegasannya secara alami tanpa menghasilkan negasi ganda yang janggal.
- source_word: ἀπολάβῃ
  choice: menerima
  rationale: Kata ini dapat berarti “menerima kembali” atau “menerima.” Dalam konteks balasan atas segala sesuatu yang telah ditinggalkan, “menerima” terdengar alami, sedangkan gagasan balasan sudah tersirat oleh konteks.
- source_word: πολλαπλασίονα
  choice: berlipat-lipat lebih banyak
  rationale: Ungkapan ini menunjukkan balasan dalam jumlah berkali-kali lipat. Pilihan ini mempertahankan unsur perbandingan sekaligus kelimpahannya dalam bahasa Indonesia modern.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: pada masa ini
  rationale: καιρός menunjuk pada waktu atau masa tertentu; bersama τούτῳ, frasa ini secara alami berarti “pada masa ini” dan berlawanan dengan zaman yang akan datang.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: pada zaman yang akan datang
  rationale: Terjemahan ini mempertahankan gagasan dua zaman dalam eskatologi Perjanjian Baru dan mengikuti bentuk partisipial “yang akan datang” tanpa mereduksinya menjadi sekadar waktu di masa depan.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini adalah padanan baku dan wajar dalam bahasa Indonesia untuk ungkapan Injil yang menunjuk pada kehidupan eskatologis yang tidak berkesudahan.
- source_word: ὃς
  choice: yang
  rationale: Pronomina relatif ini meneruskan keterangan mengenai orang yang disebut dalam ayat sebelumnya; “yang” paling sesuai dengan sifat ayat ini sebagai kelanjutan sintaksis.
theological_decisions:
- issue: Ungkapan eskatologis αἰῶνι τῷ ἐρχομένῳ
  choice: zaman yang akan datang
  alternative: zaman mendatang
  rationale: “Zaman yang akan datang” menjaga kontras teologis antara masa kini dan tatanan eskatologis kelak, tanpa mengubahnya menjadi sekadar “masa depan.”
- issue: Hubungan balasan masa kini dengan hidup kekal
  choice: mempertahankan urutan bahwa balasan berlipat-lipat diterima pada masa ini, sedangkan hidup kekal berkaitan dengan zaman yang akan datang
  alternative: menggabungkan semua yang diterima tanpa membedakan kerangka waktunya
  rationale: Tanda baca dan susunan mempertahankan hubungan yang paling alami dalam teks Yunani, tetapi tidak menjelaskan lebih jauh bentuk konkret balasan masa kini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan akhir sengaja sedikit ditandai dengan koma agar urutan Yunani dan kaitan “hidup kekal” dengan “zaman yang akan datang” tetap tampak.
