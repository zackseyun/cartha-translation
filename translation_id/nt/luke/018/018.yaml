id: LUK.18.18
reference: Luke 18:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: id
  text: Seorang pemimpin bertanya kepada-Nya, “Guru yang baik, apa yang harus kulakukan untuk mewarisi hidup kekal?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: bertanya
  rationale: Kata kerja ini secara wajar berarti bertanya atau mengajukan pertanyaan; “bertanya” paling alami dalam narasi Indonesia modern.
- source_word: τις ἄρχων
  choice: seorang pemimpin
  rationale: Kata ganti tak tentu memperkenalkan orang yang tidak disebut namanya, sedangkan ἄρχων menunjukkan seseorang yang memiliki kedudukan atau wewenang. “Seorang pemimpin” mempertahankan keluasan maknanya tanpa menetapkan jabatan tertentu.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Guru yang baik
  rationale: Sapaan ini secara langsung memadukan διδάσκαλος, “guru”, dan ἀγαθός, “baik”; susunan tersebut juga mempertahankan ungkapan yang ditanggapi Yesus pada ayat berikutnya.
- source_word: τί ποιήσας
  choice: apa yang harus kulakukan
  rationale: Partisip aoris bersama kata kerja masa depan menyatakan tindakan yang dipandang sebagai syarat atau sarana. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyajikan kerangka pertanyaan sang pemimpin.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Ini adalah padanan Indonesia yang baku, jelas, dan sesuai konteks untuk kehidupan yang bersifat kekal.
- source_word: κληρονομήσω
  choice: mewarisi
  rationale: Pilihan ini mempertahankan gambaran warisan yang terkandung dalam kata Yunani, alih-alih meratakannya menjadi sekadar “memperoleh” atau “menerima”.
theological_decisions:
- issue: Pertanyaan tentang hidup kekal dirumuskan dalam kaitannya dengan tindakan manusia
  choice: apa yang harus kulakukan untuk mewarisi hidup kekal
  alternative: apa yang akan kulakukan supaya aku mewarisi hidup kekal; setelah melakukan apa aku akan mewarisi hidup kekal
  rationale: Terjemahan mempertahankan cara sang pemimpin merumuskan pertanyaannya sebagai tindakan yang diperlukan, tanpa menyatakan bahwa Lukas sendiri sedang mengesahkan kerangka keselamatan berdasarkan perbuatan atau menyisipkan penjelasan doktrinal dari luar teks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina enklitik “-Nya” dan “ku-” menjaga kelancaran dialog. Tidak diperlukan catatan kaki karena konstruksi Yunani τί ποιήσας dapat disampaikan secara setia dan idiomatis sebagai “apa yang harus kulakukan” tanpa kehilangan ambiguitas teologis yang relevan.
