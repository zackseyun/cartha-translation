base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: id
  text: Lalu ia berseru, “Yesus, Anak Daud[a], kasihanilah aku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak Daud” adalah gelar mesianik yang membangkitkan gagasan tentang raja dari keturunan Daud yang dijanjikan; atau, dalam arti yang lebih umum, “keturunan Daud.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: berseru
  rationale: Kata kerja ini menyatakan seruan yang keras dan mendesak. “Berseru” alami dalam narasi Indonesia dan mempertahankan kesungguhan permohonan.
- source_word: λέγων
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, isi ucapan dapat langsung mengikuti “berseru”; menerjemahkannya sebagai “dengan berkata” akan terasa kaku tanpa menambah makna.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Bentuk vokatif nama Ἰησοῦς diterjemahkan menurut bentuk baku bahasa Indonesia.
- source_word: υἱὲ Δαυίδ
  choice: Anak Daud
  rationale: Ungkapan ini dipertahankan sebagai gelar yang bernuansa kerajaan dan mesianik, bukan dijelaskan langsung sebagai sekadar hubungan keturunan.
- source_word: ἐλέησόν με
  choice: kasihanilah aku
  rationale: Imperatif aoris ini merupakan permohonan langsung agar Yesus bertindak dengan belas kasihan. “Kasihanilah aku” ringkas, mendesak, dan memiliki bobot religius yang sesuai.
theological_decisions:
- issue: Daya mesianik gelar υἱὲ Δαυίδ
  choice: Diterjemahkan “Anak Daud.”
  alternative: “Keturunan Daud.”
  rationale: Dalam konteks Injil Lukas, sapaan ini mengandung makna kerajaan dan mesianik. Bentuk “Anak Daud” mempertahankan gelarnya serta tidak membatasi ungkapan itu pada keterangan silsilah semata.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Penghilangan padanan tersendiri untuk λέγων menghindari konstruksi naratif yang kaku. Tanda catatan ditempatkan setelah seluruh seruan karena catatan menerangkan gelar di dalam kutipan.
