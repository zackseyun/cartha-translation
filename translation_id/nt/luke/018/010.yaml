  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: id
  text: Dua orang naik ke Bait Allah untuk berdoa.[a] Yang seorang adalah orang Farisi dan yang lain pemungut pajak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν menunjuk pada kompleks atau pelataran Bait Allah, bukan khusus ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Dua orang
  rationale: Dalam bahasa Indonesia, “dua orang” secara alami menyatakan dua individu; konteks berikutnya menunjukkan bahwa keduanya laki-laki tanpa perlu memakai ungkapan yang kurang alami seperti “dua laki-laki”.
- source_word: ἀνέβησαν
  choice: pergi
  rationale: Kata ini secara harfiah berarti “naik/pergi ke tempat yang lebih tinggi”. Dalam bahasa Indonesia, “pergi ke Bait Allah” lebih alami; nuansa gerak naik tidak diperlukan untuk memahami adegan dan “naik ke Bait Allah” dapat terdengar janggal.
- source_word: εἰς τὸ ἱερὸν
  choice: ke Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau pelataran Bait Allah, bukan khusus ruang suci bagian dalam. “Bait Allah” merupakan istilah baku dan mudah dipahami, sedangkan cakupan tepatnya dijelaskan dalam catatan kaki.
- source_word: προσεύξασθαι
  choice: untuk berdoa
  rationale: Infinitif aoris ini menyatakan tujuan; “untuk berdoa” adalah padanan langsung dan alami.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: Yang seorang ... dan yang lain
  rationale: Ungkapan ini mempertahankan kontras distributif antara kedua tokoh dengan susunan Indonesia yang wajar.
- source_word: Φαρισαῖος
  choice: orang Farisi
  rationale: “Orang Farisi” adalah sebutan baku dalam bahasa Indonesia untuk anggota kelompok Yahudi tersebut.
- source_word: τελώνης
  choice: pemungut pajak
  rationale: Istilah ini menyatakan petugas yang memungut pajak atau bea dan merupakan padanan modern yang jelas.
theological_decisions:
- issue: Pembedaan ἱερόν dari ναός
  choice: Bait Allah, dengan catatan bahwa yang dimaksud ialah kompleks atau pelatarannya
  alternative: kompleks Bait Allah / pelataran Bait Allah
  rationale: Teks menunjuk pada kawasan Bait Allah secara luas, bukan khusus tempat suci bagian dalam. Bentuk utama yang lazim dipertahankan untuk kelancaran, sementara catatan mencegah pembacaan yang terlalu sempit.
- issue: Jenis kelamin dalam ἄνθρωποι
  choice: dua orang
  alternative: dua laki-laki
  rationale: Konteks Yunani menggambarkan dua tokoh laki-laki, tetapi bahasa Indonesia lazim memakai penggolong netral “orang” bahkan ketika jenis kelamin diketahui. Pilihan ini tidak meniadakan informasi kontekstual dan menghindari ungkapan yang kaku.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah “Bait Allah”, “orang Farisi”, dan “pemungut pajak” mengikuti pemakaian Alkitabiah Indonesia yang umum tanpa menjadi arkais.
