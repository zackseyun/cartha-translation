  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: id
  text: Ketika Yesus melihat dia, Ia berkata, “Betapa sulitnya bagi orang-orang yang memiliki kekayaan untuk masuk ke dalam Kerajaan Allah!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Ketika Yesus melihat dia
  rationale: Partisip aoris ἰδών diungkapkan sebagai anak kalimat waktu agar alami dalam bahasa Indonesia, sedangkan δέ berfungsi sebagai penghubung naratif ringan yang tidak perlu selalu diterjemahkan tersendiri.
- source_word: Πῶς δυσκόλως
  choice: Betapa sulitnya
  rationale: Ungkapan ini menyatakan seruan tentang tingkat kesulitan; “Betapa sulitnya” mempertahankan daya serunya secara alami dan bermartabat.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: orang-orang yang memiliki kekayaan
  rationale: Terjemahan ini mempertahankan bentuk deskriptif ‘mereka yang memiliki harta/kekayaan’ dan cakupan χρήματα yang lebih luas daripada uang tunai saja.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: masuk ke dalam Kerajaan Allah
  rationale: Ungkapan baku ini mempertahankan gambaran gerak memasuki βασιλεία serta istilah Alkitabiah yang lazim dalam bahasa Indonesia.
- source_word: εἰσπορεύονται
  choice: masuk
  rationale: Bentuk kini εἰσπορεύονται menyatakan tindakan umum dalam pernyataan ini; struktur Indonesia yang alami menempatkan “masuk” sesudah subjek.
theological_decisions:
- issue: Kekuatan perkataan Yesus mengenai orang kaya dan Kerajaan Allah
  choice: Pernyataan umum bahwa orang yang memiliki kekayaan sangat sulit masuk ke dalam Kerajaan Allah
  alternative: Kemustahilan mutlak bagi semua orang kaya untuk masuk
  rationale: Teks memakai δυσκόλως, ‘dengan sulit’, bukan istilah yang dengan sendirinya berarti mustahil. Terjemahan mempertahankan ketegangan tersebut tanpa menguatkannya melampaui ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang wajar, jelas, dan bermartabat. “Ia” dipakai sebagai pronomina rujukan kepada Yesus menurut kebiasaan penulisan Alkitab bahasa Indonesia; “Kerajaan Allah” dipertahankan sebagai istilah yang mapan. Tidak diperlukan catatan kaki karena alternatif ‘uang/harta’ tidak mengubah makna utama secara cukup berarti untuk ayat ini.
