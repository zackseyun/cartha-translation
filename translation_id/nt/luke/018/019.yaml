  terminology: ‘Yesus,’ ‘Allah,’ dan ‘baik’ sudah tepat dan konsisten. Kapitalisasi ‘Aku’ sesuai kelaziman editorial Alkitab Indonesia dan tidak mengubah makna. ‘Kamu’ wajar untuk dialog langsung modern, meskipun tingkat keformalan interpersonal Yunani tidak ditandai secara khusus.
