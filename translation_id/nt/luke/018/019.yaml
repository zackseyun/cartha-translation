  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: id
  text: Namun Yesus berkata kepadanya, “Mengapa kamu menyebut Aku baik? Tidak seorang pun yang baik, kecuali satu, yaitu Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai daya tanggapan yang agak kontras dan korektif dalam konteks, tanpa membuat pertentangannya terlalu tajam.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Yesus berkata
  rationale: Menerjemahkan λέγω secara langsung sebagai ‘berkata’; konteks sudah menunjukkan bahwa ucapan ini merupakan tanggapan.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Mempertahankan pronomina eksplisit dalam bahasa Yunani tanpa menambahkan identitas ‘orang itu’.
- source_word: Τί
  choice: Mengapa
  rationale: 'Dalam konstruksi τί με λέγεις ἀγαθόν, kata tanya ini secara idiomatis menanyakan alasan: ‘Mengapa kamu menyebut Aku baik?’'
- source_word: με λέγεις ἀγαθόν
  choice: kamu menyebut Aku baik
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bentuk langsung λέγεις dengan ἀγαθόν sebagai predikat.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: baik
  rationale: Kedua kemunculan diterjemahkan secara konsisten dan tidak diperinci menjadi ‘baik secara moral’, sebab kontekslah yang membawa bobot moral-teologisnya.
- source_word: οὐδεὶς
  choice: Tidak seorang pun
  rationale: Menyampaikan penyangkalan universal dengan bahasa Indonesia baku, jelas, dan wajar.
- source_word: εἰ μὴ εἷς
  choice: selain satu
  rationale: Mempertahankan unsur εἷς (‘satu’) dan penekanan konstruksi pengecualian, meskipun ungkapan Indonesia yang lebih ringkas ‘selain Allah’ juga mungkin.
- source_word: ὁ θεός
  choice: yaitu Allah
  rationale: ‘Yaitu’ menghubungkan ‘satu’ dengan Allah secara alami dalam bahasa Indonesia dan menghindari ungkapan kaku ‘satu, Allah’.
theological_decisions:
- issue: Implikasi kristologis pertanyaan Yesus
  choice: Pertanyaan Yesus dipertahankan tanpa diparafrasakan sebagai penyangkalan bahwa diri-Nya baik ataupun sebagai pernyataan langsung bahwa diri-Nya adalah Allah.
  alternative: Membuat Yesus secara eksplisit menyangkal kebaikan mutlak-Nya, atau membuat-Nya secara eksplisit menyatakan keilahian-Nya melalui sapaan tersebut.
  rationale: Teks Yunani menimbulkan ketegangan teologis tetapi tidak menjabarkan kesimpulannya dalam ayat ini. Terjemahan tidak boleh menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, bermartabat, dan mudah dipahami. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia; ‘kamu’ dipilih agar percakapan langsung terdengar alami tanpa menjadi kasar.
