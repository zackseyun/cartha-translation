  text: Then those who heard it said, “And who can be saved?”
translation:
  language: id
  text: Lalu orang-orang yang mendengarnya berkata, “Dan siapa yang dapat diselamatkan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: berkata
  rationale: Bentuk aoris indikatif paling wajar diterjemahkan sebagai tindakan lampau sederhana dalam alur narasi; bahasa Indonesia tidak wajib menandai kala pada verba.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai perkembangan atau peralihan dalam narasi; “Lalu” mempertahankan fungsi penghubung itu secara alami.
- source_word: οἱ ἀκούσαντες
  choice: orang-orang yang mendengarnya
  rationale: Partisip aoris substantival menunjuk kepada orang-orang yang mendengar perkataan Yesus sebelumnya; akhiran “-nya” memasok objek yang jelas dari konteks.
- source_word: Καὶ
  choice: Kalau begitu
  rationale: Dalam pertanyaan reaktif ini, καί menghubungkan ucapan dengan pernyataan sebelumnya dan mengungkapkan implikasi yang mengejutkan. “Kalau begitu” menyampaikan hubungan wacana tersebut secara idiomatis tanpa mengubah isi pertanyaannya.
- source_word: τίς
  choice: siapa
  rationale: Kata tanya ini menanyakan orang mana yang mungkin diselamatkan; “siapa” merupakan padanan langsung dan alami.
- source_word: δύναται
  choice: dapat
  rationale: Verba ini menyatakan kemampuan atau kemungkinan; “dapat” sesuai dengan ragam modern yang bermartabat.
- source_word: σωθῆναι
  choice: diselamatkan
  rationale: Infinitif aoris pasif ini, dalam konteks masuk ke dalam Kerajaan Allah, terutama mengacu pada keselamatan, bukan sekadar pertolongan dari bahaya jasmani.
theological_decisions:
- issue: Makna σωθῆναι dalam konteks
  choice: diselamatkan dalam pengertian keselamatan
  alternative: ditolong atau dibebaskan
  rationale: Konteks sekitarnya membahas masuk ke dalam Kerajaan Allah dan sulitnya orang kaya masuk ke sana. Karena itu, makna keselamatan menjadi yang utama, tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Orang-orang yang mendengarnya” cukup jelas tanpa menentukan kelompok pendengar lebih lanjut. “Kalau begitu” menangkap daya reaktif καί dalam konteks percakapan.
