  terminology: “Janda,” “membela haknya,” dan “membuat aku kewalahan” dipilih dengan baik. “Membela haknya” menyampaikan keadilan hukum/vindikasi, sementara catatan kaki secara memadai mencatat alternatif “memberinya keadilan,” “membenarkan perkaranya,” serta kemungkinan leksikal “membalaskan.” Catatan b dengan tepat mempertahankan literalitas idiom “memukul ... di bawah mata” dan arti kiasannya.
