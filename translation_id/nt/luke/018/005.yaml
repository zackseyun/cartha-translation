id: LUK.18.5
reference: Luke 18:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: id
  text: Namun, karena janda ini terus menyusahkan aku, aku akan membela haknya[a], supaya ia tidak terus-menerus datang dan membuat aku kewalahan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberinya keadilan” atau “membenarkan perkaranya.” Kata Yunani ini dalam konteks lain dapat berarti “membalaskan,” tetapi di sini menunjuk pada pemberian keadilan dalam perkara hukum.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “memukul aku di bawah mata”; secara kiasan, “membuat aku kewalahan” atau “melelahkan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: Namun, karena ... terus menyusahkan aku
  rationale: διά dengan infinitif berartikel menyatakan sebab, sedangkan γε memberi penegasan. Infinitif kini παρέχειν dan ungkapan παρέχειν κόπον menyiratkan gangguan yang berlangsung; ‘terus menyusahkan aku’ menyampaikannya secara alami.
- source_word: τὴν χήραν ταύτην
  choice: janda ini
  rationale: Terjemahan langsung yang mempertahankan status sosial tokoh tersebut, yang penting dalam perumpamaan.
- source_word: ἐκδικήσω αὐτήν
  choice: aku akan membela haknya
  rationale: Dalam konteks pengadilan, verba ini menunjuk pada pemberian keadilan atau pemulihan hak, bukan pembalasan dendam pribadi. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa pembenaran hukum.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menyatakan maksud hakim dengan konstruksi Indonesia yang jelas dan alami.
- source_word: εἰς τέλος ἐρχομένη
  choice: terus-menerus datang
  rationale: Dalam konteks ini, εἰς τέλος memberi nuansa keberlanjutan tanpa akhir pada tindakan datang. ‘Terus-menerus datang’ mempertahankan daya iteratifnya tanpa memaksakan arti temporal ‘pada akhirnya’.
- source_word: ὑπωπιάζῃ με
  choice: membuat aku kewalahan
  rationale: Secara harfiah verba ini dapat berarti memukul di bawah mata, tetapi di sini digunakan secara figuratif untuk tekanan yang melelahkan atau mengalahkan. ‘Membuat aku kewalahan’ wajar dan tetap menyampaikan kuatnya desakan berulang.
theological_decisions:
- issue: Makna ἐκδικήσω dalam perumpamaan tentang doa dan keadilan
  choice: aku akan membela haknya
  alternative: aku akan membalaskan perkaranya; aku akan memberinya keadilan
  rationale: Konteksnya ialah pemulihan hak melalui putusan hakim, bukan tindakan balas dendam pribadi. Pilihan ini mempertahankan kaitannya dengan tema keadilan dalam ayat-ayat berikut tanpa memasukkan nada pembalasan yang tidak harus ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti ‘aku’ sesuai dengan ucapan langsung hakim. Dua catatan kaki mempertahankan keluasan makna hukum ἐκδικέω dan daya ungkapan ὑπωπιάζω.
