  revised_text: 'Lalu Yesus berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu: Tidak seorang pun yang telah meninggalkan rumah, istri, saudara-saudara, orang tua, atau anak-anak demi Kerajaan Allah,”'
