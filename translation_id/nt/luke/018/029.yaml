id: LUK.18.29
reference: Luke 18:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: id
  text: 'Lalu Yesus berkata kepada mereka, “Sesungguhnya Aku berkata kepadamu: Tidak seorang pun yang telah meninggalkan rumah, istri, saudara-saudara, orang tua, atau anak-anak demi Kerajaan Allah,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Mempertahankan formula penegasan khidmat Yesus dalam ungkapan Indonesia yang alami dan bermartabat.
- source_word: ἀφῆκεν
  choice: telah meninggalkan
  rationale: Menyampaikan tindakan meninggalkan atau melepaskan sesuatu tanpa menambahkan alasan maupun sifat permanen yang tidak dinyatakan teks.
- source_word: οἰκίαν
  choice: rumah
  rationale: Padanan langsung yang mempertahankan cakupan kata Yunani tanpa mempersempitnya menjadi harta atau rumah tangga.
- source_word: ἀδελφοὺς
  choice: saudara-saudara
  rationale: Padanan jamak yang wajar; dalam daftar keluarga ini terutama menunjuk saudara kandung, tetapi terjemahan tidak perlu mempersempit secara eksplisit.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: demi Kerajaan Allah
  rationale: Ungkapan tujuan atau alasan diterjemahkan secara ringkas dan alami, sambil mempertahankan istilah teologis utama.
theological_decisions:
- issue: Identitas subjek ὁ δέ
  choice: Yesus
  alternative: Ia
  rationale: Konteks langsung mengidentifikasi pembicara sebagai Yesus; penyebutan nama memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
- issue: Makna meninggalkan keluarga demi Kerajaan Allah
  choice: Dibiarkan sebagai pernyataan tekstual tanpa penjelasan tambahan
  alternative: Menafsirkannya secara eksplisit sebagai penelantaran permanen atau sebagai prioritas batin semata
  rationale: Ayat ini tidak merinci bentuk atau lamanya tindakan tersebut; ketegangan etis dan teologisnya perlu dipertahankan dan tidak diselesaikan di dalam terjemahan.
- issue: Kala perfektum ἀφῆκεν
  choice: telah meninggalkan
  alternative: meninggalkan
  rationale: Bentuk perfektum menyoroti tindakan yang sudah dilakukan dengan keadaan atau konsekuensi yang tetap relevan.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan khidmat. Kata ganti ilahi “Aku” ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Tanda koma penutup dipertahankan karena kalimat berlanjut ke ayat 30.
