review_pass:
  verdict: approve
  source_fidelity: Terjemahan setia pada teks Yunani SBLGNT. Daftar yang mencakup rumah, istri, saudara-saudara, orang tua, dan anak-anak dipertahankan, demikian pula tujuan “demi Kerajaan Allah.” “Yesus” secara kontekstual jelas sebagai rujukan bagi ὁ δέ, dan tanda koma akhir tepat karena ujaran berlanjut pada ayat 30.
  naturalness: Bahasa Indonesia baku, modern, dan khidmat. “Sesungguhnya Aku berkata kepadamu” serta “Tidak seorang pun yang telah meninggalkan ...” terdengar alami dalam register Alkitab. Pengulangan “saudara-saudara” dan “anak-anak” sesuai dengan bentuk jamak serta jelas dalam daftar keluarga.
  terminology: “Kerajaan Allah” adalah padanan mapan dan tepat untuk τῆς βασιλείας τοῦ θεοῦ. “Demi” secara baik menyampaikan ἕνεκεν. “Telah meninggalkan” dapat diterima untuk aoristus ἀφῆκεν sebagai tindakan yang telah terjadi, tanpa memaksakan sifat permanen.
  issues:
