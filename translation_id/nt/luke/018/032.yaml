base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: id
  text: Sebab ia akan diserahkan kepada orang-orang bukan Yahudi[a], diolok-olok, dihina[b], dan diludahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: bangsa-bangsa lain. Dalam konteks ini, yang dimaksud ialah orang-orang bukan Yahudi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: diperlakukan dengan keji; kata Yunaninya dapat mencakup penghinaan dan perlakuan yang sewenang-wenang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: akan diserahkan
  rationale: Bentuk pasif futurum παραδίδωμι dipertahankan tanpa mempersempit maknanya menjadi 'dikhianati' atau menyebut pelaku yang tidak dinyatakan dalam ayat ini.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menjelaskan pernyataan sebelumnya; 'Sebab' menyatakan hubungan penjelasan itu secara ringkas dan wajar.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa bukan Yahudi
  rationale: Dalam konteks kisah sengsara, ἔθνη menunjuk kepada orang atau bangsa non-Yahudi, khususnya pihak berkuasa non-Yahudi. Rumusan ini jelas bagi pembaca umum sekaligus tetap mempertahankan unsur 'bangsa-bangsa' dalam istilah Yunani.
- source_word: ἐμπαιχθήσεται
  choice: diolok-olok
  rationale: Padanan ini menyampaikan tindakan mengejek dan mempermainkan seseorang dengan maksud merendahkannya.
- source_word: ὑβρισθήσεται
  choice: dihina
  rationale: ὑβρίζω dapat mencakup penghinaan maupun perlakuan keji. 'Dihina' tepat dalam rangkaian tindakan yang merendahkan, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: ἐμπτυσθήσεται
  choice: diludahi
  rationale: Padanan pasif yang konkret dan alami ini mempertahankan tindakan penghinaan fisik yang dinyatakan oleh ἐμπτύω.
theological_decisions:
- issue: Subjek tersirat pada kata-kata kerja pasif
  choice: Menggunakan 'ia', yang merujuk kepada Anak Manusia dalam konteks sebelumnya
  alternative: Mengulang 'Anak Manusia'
  rationale: Bahasa Yunani tidak menyebutkan subjek secara eksplisit dalam ayat ini, tetapi bentuk orang ketiga tunggal meneruskan rujukan kepada Anak Manusia dari Lukas 18:31. Kata ganti diperlukan agar kalimat Indonesia alami tanpa menambahkan penafsiran baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan bentuk pasif dipertahankan untuk mencerminkan susunan tindakan dalam teks Yunani, tetapi penanda futurum 'akan' hanya dinyatakan sekali agar kalimat tetap alami. Kata ganti 'ia' ditulis dengan huruf kecil sesuai kaidah umum dan karena kapitalisasi penghormatan bukan unsur yang dinyatakan dalam teks Yunani.
