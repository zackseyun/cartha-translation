id: LUK.18.16
reference: Luke 18:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: id
  text: Tetapi Yesus memanggil anak-anak itu untuk datang kepada-Nya dan berkata, “Biarkan anak-anak itu datang kepada-Ku dan jangan menghalangi mereka, sebab Kerajaan Allah adalah milik orang-orang seperti mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sebab dari orang-orang seperti merekalah Kerajaan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: memanggil anak-anak itu untuk datang kepada-Nya
  rationale: Bentuk medium προσεκαλέσατο menyatakan memanggil atau menyuruh datang mendekat kepada diri-Nya. Referen pronomina αὐτά dibuat eksplisit sebagai 'anak-anak itu' agar alurnya jelas dan alami dalam bahasa Indonesia.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Biarkan anak-anak itu datang kepada-Ku
  rationale: Ἄφετε dalam konstruksi ini berarti mengizinkan atau membiarkan; terjemahan ini mempertahankan ketegasan perintah sekaligus terdengar alami.
- source_word: μὴ κωλύετε αὐτά
  choice: jangan menghalangi mereka
  rationale: κωλύω mencakup tindakan menghalangi atau mencegah. 'Menghalangi' mempertahankan cakupan luas tanpa menyatakan bahwa pencegahan telah berhasil.
- source_word: τῶν ... τοιούτων
  choice: orang-orang seperti mereka
  rationale: Ungkapan ini menunjuk pada suatu kelompok yang dicontohkan oleh anak-anak tersebut, bukan dengan pasti hanya pada anak-anak yang hadir. Penambahan 'orang-orang' membuatnya idiomatis tanpa menentukan sifat apa yang dimaksud.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku, jelas, dan bermartabat bagi frasa Yunani tersebut.
theological_decisions:
- issue: Cakupan τῶν τοιούτων
  choice: orang-orang seperti mereka
  alternative: anak-anak itu saja
  rationale: 'Bentuk ''orang-orang seperti mereka'' mempertahankan daya perwakilan τοιούτων: anak-anak yang hadir menjadi contoh bagi suatu kelompok yang lebih luas. Ayat ini sendiri tidak menjelaskan sifat atau kualitas apa yang dimaksud, sehingga terjemahan tidak menentukannya.'
- issue: Relasi genitif dalam τῶν τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah adalah milik orang-orang seperti mereka
  alternative: dari orang-orang seperti merekalah Kerajaan Allah
  rationale: Terjemahan utama menyampaikan hubungan kepunyaan atau keterkaitan secara alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah dan ambiguitas konstruksi Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan ilahi memakai kapital pada pronomina yang merujuk kepada Yesus sesuai kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
