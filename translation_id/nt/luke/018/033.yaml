  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: id
  text: Sesudah mencambuk Dia, mereka akan membunuh-Nya, dan pada hari ketiga Dia akan bangkit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia akan dibangkitkan.” Bahasa Yunani di sini lebih langsung berarti “Dia akan bangkit.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: sesudah mencambuk
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului kata kerja utama. 'Mencambuk' alami dalam bahasa Indonesia modern dan mempertahankan kekerasan tindakan tersebut tanpa memakai istilah yang kurang umum.
- source_word: ἀποκτενοῦσιν
  choice: mereka akan membunuh
  rationale: Bentuk futur aktif jamak dengan pelaku tersirat dari konteks. 'Membunuh' menyampaikan makna leksikal secara lugas tanpa menambahkan nuansa hukum atau penilaian moral yang tidak dinyatakan oleh verba itu sendiri.
- source_word: αὐτόν
  choice: Dia/-Nya
  rationale: Pronomina objek ini merujuk kepada Yesus, Sang Anak Manusia. Kapitalisasi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia untuk pronomina yang mengacu kepada-Nya.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: pada hari ketiga
  rationale: Dativus waktu diterjemahkan secara idiomatis dengan 'pada'; ungkapan ini alami dan mempertahankan penanda waktunya tanpa penambahan tafsir.
- source_word: ἀναστήσεται
  choice: Dia akan bangkit
  rationale: Bentuk futur medium dari ἀνίστημι di sini paling langsung dipahami secara intransitif. 'Akan bangkit' dekat dengan bentuk Yunani dan tidak mengubahnya menjadi pasif secara eksplisit.
theological_decisions:
- issue: Rumusan kebangkitan
  choice: Dia akan bangkit
  alternative: Dia akan dibangkitkan
  rationale: Bentuk Yunani adalah futur medium dan paling langsung diterjemahkan 'akan bangkit'. Alternatif pasif selaras dengan pernyataan bagian-bagian lain, tetapi tidak perlu dimasukkan ke dalam teks utama di sini; catatan mempertahankan kemungkinan pemahaman tersebut tanpa menghilangkan ketegangan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kalimat Yunani dibagi menjadi dua kalimat Indonesia agar alur tindakan dan penanda waktu terbaca alami. Sebutan bagi Yesus dikapitalisasi sesuai konvensi umum Alkitab Indonesia.
