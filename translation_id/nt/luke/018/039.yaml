id: LUK.18.39
reference: Luke 18:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: id
  text: Orang-orang yang berjalan di depan menegurnya supaya ia diam. Namun, ia justru semakin keras berseru, “Anak Daud, kasihanilah aku!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: orang-orang yang berjalan di depan
  rationale: Partisipel kini yang dipakai sebagai nomina menunjuk pada orang-orang yang berada dan bergerak di bagian depan; terjemahan ini mempertahankan makna spasial tanpa menganggap mereka sebagai pemimpin.
- source_word: ἐπετίμων αὐτῷ
  choice: menegurnya
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau berulang, sedangkan ἐπιτιμάω menyatakan teguran keras. Dalam bahasa Indonesia, aspek berkelanjutan cukup terbaca dari konteks dan kelanjutan adegan.
- source_word: ἵνα σιγήσῃ
  choice: supaya ia diam
  rationale: ἵνα dengan subjungtif aoris menyatakan tujuan yang dikehendaki; 'supaya ia diam' alami dan tetap mempertahankan daya teliknya.
- source_word: αὐτὸς δὲ
  choice: Namun, ia justru
  rationale: Gabungan 'namun' dan 'justru' menyampaikan kontras serta penekanan pada respons orang itu tanpa terjemahan kaku 'ia sendiri'.
- source_word: πολλῷ μᾶλλον
  choice: semakin keras
  rationale: Secara harfiah berarti 'jauh lebih lagi'. Bersama verba 'berseru', ungkapan idiomatis Indonesia 'semakin keras' menyampaikan intensifikasi seruan secara alami, meski unsur kerasnya tersirat dari konteks.
- source_word: ἔκραζεν
  choice: berseru
  rationale: κράζω menyatakan seruan kuat. Imperfek menunjukkan tindakan yang terus atau berulang; dalam susunan 'semakin keras berseru', keberlanjutan dan peningkatannya terbaca secara alami.
- source_word: Υἱὲ Δαυίδ
  choice: Anak Daud
  rationale: Gelar vokatif Davidik ini diterjemahkan agar makna keturunan dan bobot mesianiknya tetap dapat dipahami, tanpa tambahan tafsiran.
- source_word: ἐλέησόν με
  choice: kasihanilah aku
  rationale: Imperatif aoris menyampaikan permohonan langsung dan mendesak. 'Kasihanilah aku' merupakan ungkapan Indonesia yang jelas, bermartabat, dan mempertahankan resonansi belas kasihan.
theological_decisions:
- issue: Makna mesianik Υἱὲ Δαυίδ
  choice: Diterjemahkan sebagai gelar 'Anak Daud' dalam teks utama.
  alternative: Memahaminya hanya sebagai sapaan kehormatan biasa atau menambahkan penjelasan 'Mesias'.
  rationale: Dalam narasi Lukas, sapaan ini mengandung makna kerajaan dan mesianik yang berakar pada Daud. Terjemahan langsung mempertahankan bobot kristologisnya tanpa mempersempit atau memperluas teks melalui penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. 'Menegurnya' mempertahankan kerasnya tindakan tanpa menjadi terlalu kasar; 'namun, ia justru' menonjolkan kontras; tanda seru mencerminkan desakan seruan.
