  rationale: 'Revisi ini memperhalus idiom bahasa Indonesia dan mempertahankan seluruh unsur semantis sumber: kesegeraan tindakan, kemampuan melihat yang diperoleh tanpa menetapkan riwayat penglihatan, tindakan mengikuti yang dapat berkelanjutan, pemuliaan Allah, serta respons semua orang yang menyaksikan peristiwa itu. Kedua jangkar catatan kaki tetap melekat pada unsur yang dijelaskan.'
