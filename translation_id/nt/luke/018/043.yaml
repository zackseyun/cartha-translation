id: LUK.18.43
reference: Luke 18:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: id
  text: Seketika itu juga ia dapat melihat[a], dan ia mengikuti Yesus[b] sambil memuliakan Allah. Semua orang yang melihat hal itu memuji Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dapat melihat kembali” atau “penglihatannya pulih.” Verba Yunani ini dapat berarti memperoleh kembali kemampuan melihat.
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk imperfek verba Yunani dapat menekankan tindakan yang berkelanjutan: “ia terus mengikuti Yesus.”'
    reason: aspectual_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: saat itu juga
  rationale: Mengungkapkan bahwa peristiwa itu terjadi tanpa penundaan dan terdengar alami dalam narasi bahasa Indonesia.
- source_word: ἀνέβλεψεν
  choice: dapat melihat
  rationale: Dalam konteks penyembuhan orang buta, verba ini berarti memperoleh atau memulihkan kemampuan melihat. Pilihan ini alami dan tidak memastikan bahwa ia pernah dapat melihat sebelumnya.
- source_word: ἠκολούθει
  choice: mengikuti Yesus
  rationale: Bahasa Indonesia tidak wajib menandai aspek imperfektif pada verba. Bentuk sederhana ini alami, sedangkan nama “Yesus” memperjelas acuan αὐτῷ dari konteks tanpa mengubah pelakunya.
- source_word: δοξάζων
  choice: sambil memuliakan
  rationale: “Sambil” menyatakan tindakan yang berlangsung bersamaan dengan mengikuti, sedangkan “memuliakan” mempertahankan bahasa penghormatan yang diarahkan kepada Allah.
- source_word: πᾶς ὁ λαός
  choice: seluruh orang banyak itu
  rationale: Menunjuk secara kolektif kepada semua orang yang menyaksikan peristiwa tersebut, tanpa memberi kesan politis atau kebangsaan seperti yang mungkin timbul dari kata “rakyat”.
- source_word: ἰδὼν
  choice: ketika melihat hal itu
  rationale: Menjadikan hubungan waktunya jelas dan memasok objek yang tersirat dari konteks, yakni penyembuhan serta tanggapan orang tersebut.
- source_word: ἔδωκεν αἶνον
  choice: memberikan pujian
  rationale: Mempertahankan konstruksi harfiah “memberikan pujian” sambil tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: θεόν / θεῷ
  choice: Allah
  rationale: Padanan baku untuk θεός; pengulangannya dipertahankan agar penekanan sumber pada Allah sebagai penerima kemuliaan dan pujian tetap tampak.
theological_decisions:
- issue: Aspek tindakan orang yang telah disembuhkan ketika mengikuti Yesus
  choice: ia mengikuti Yesus
  alternative: ia terus mengikuti Yesus
  rationale: Imperfek ἠκολούθει dapat menggambarkan tindakan yang sedang atau terus berlangsung, tetapi penambahan “terus” dapat memberi tekanan lebih kuat daripada yang diperlukan. Catatan kaki mempertahankan kemungkinan aspek tersebut.
- issue: Makna ἀνέβλεψεν dan riwayat penglihatannya
  choice: dapat melihat
  alternative: dapat melihat kembali / penglihatannya pulih
  rationale: Terjemahan utama menyatakan pemulihan kemampuan melihat tanpa menentukan apakah ia pernah melihat sebelumnya; alternatif leksikal dicatat agar ambiguitas verba Yunani tetap tersedia.
- issue: Bentuk kolektif tunggal πᾶς ὁ λαός
  choice: seluruh orang banyak itu
  alternative: semua orang itu
  rationale: Pilihan ini mempertahankan sifat kolektif ungkapan Yunani dan tetap wajar dalam bahasa Indonesia; tidak ada kesimpulan teologis tambahan yang dimasukkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur Yunani, tetapi memakai penghubung dan konstruksi simultan yang alami. Nama “Yesus” digunakan untuk memperjelas pronomina Yunani dalam konteks; istilah denominatif dan ungkapan liturgis khusus dihindari.
