  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: id
  text: Di kota itu ada pula seorang janda. Ia terus datang kepada hakim itu dan berkata, “Berikanlah aku keadilan terhadap lawanku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Belalah hakku terhadap lawanku” atau “Berilah aku keputusan yang adil terhadap pihak lawanku.” Kata Yunani yang digunakan dapat berarti memperoleh keadilan atau pembenaran secara hukum, bukan selalu membalas dendam secara pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: seorang janda
  rationale: Padanan baku dan tepat untuk perempuan yang suaminya telah meninggal; penyebutan ini juga mempertahankan kedudukan sosial tokoh dalam perumpamaan.
- source_word: δὲ
  choice: pula
  rationale: Partikel ini melanjutkan narasi dan memperkenalkan tokoh lain tanpa mengharuskan nuansa pertentangan yang kuat.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: Di kota itu ada
  rationale: Menyampaikan pemakaian eksistensial ἦν dan keterangan tempat secara alami dalam bahasa Indonesia.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: Ia terus datang kepada hakim itu
  rationale: Bentuk imperfek menunjukkan tindakan berulang atau berkepanjangan. Penyebutan kembali 'hakim itu' lebih jelas dan alami daripada pronomina yang berpotensi kabur dalam bahasa Indonesia.
- source_word: λέγουσα
  choice: dan berkata
  rationale: Partisipel ini menyatakan ucapan yang menyertai kedatangannya; bentuk koordinatif menghasilkan bahasa Indonesia yang wajar.
- source_word: Ἐκδίκησόν με
  choice: Berikanlah keadilan kepadaku
  rationale: Dalam konteks pengadilan, verba ini menunjuk pada pemberian keadilan atau pembelaan hak, bukan terutama pembalasan dendam.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: dalam menghadapi lawanku
  rationale: ἀντίδικος adalah pihak lawan, khususnya dalam sengketa hukum. Frasa ini alami bersama permohonan untuk memperoleh keadilan dan tidak membatasi lawan itu sebagai penuduh.
theological_decisions:
- issue: Apakah permohonan janda itu berarti pembalasan atau penegakan keadilan
  choice: Penegakan keadilan dalam sengketa
  alternative: Balaskanlah aku terhadap lawanku
  rationale: Latar hakim dan makna yudisial ἐκδικέω mendukung permohonan akan putusan atau pemulihan hak. Catatan kaki tetap mengakui ragam nuansa leksikal tanpa memasukkan gagasan balas dendam pribadi ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kalimat dipecah menjadi dua agar alur narasi dan kegigihan sang janda terdengar alami. 'Hakim itu' mengacu jelas kepada tokoh yang disebut pada ayat sebelumnya.
