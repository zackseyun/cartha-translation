  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: id
  text: Sebab lebih mudah seekor unta masuk melalui lubang jarum daripada seorang kaya masuk ke dalam Kerajaan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ada yang mengusulkan penjelasan bahwa “lubang jarum” adalah nama sebuah pintu sempit, atau bahwa yang dimaksud ialah “tali,” bukan “unta.” Namun, teks Yunani di sini berbunyi “unta.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: lebih mudah
  rationale: Bentuk komparatif predikatif ini secara alami diterjemahkan sebagai “lebih mudah” dalam bahasa Indonesia.
- source_word: γάρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan perkataan ini dengan konteks sebelumnya.
- source_word: κάμηλον
  choice: seekor unta
  rationale: Arti lazim κάμηλος adalah “unta”; penggolong “seekor” wajar untuk hewan dalam bahasa Indonesia.
- source_word: διὰ τρήματος βελόνης
  choice: melalui lubang jarum
  rationale: Secara akurat dan alami menyatakan lubang pada jarum yang dimaksud oleh konstruksi Yunani.
- source_word: εἰσελθεῖν
  choice: masuk
  rationale: Padanan ringkas dan alami bagi infinitif εἰσέρχομαι, digunakan untuk kedua sisi perbandingan.
- source_word: πλούσιον
  choice: seorang kaya
  rationale: Adjektiva maskulin tunggal yang dipakai secara substantival; “seorang kaya” mempertahankan bentuk tunggal representatif tanpa menambahkan unsur yang tidak diperlukan.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ke dalam Kerajaan Allah
  rationale: “Ke dalam” mempertahankan arah yang dinyatakan εἰς, sedangkan “Kerajaan Allah” merupakan padanan yang jelas dan mapan bagi βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Penafsiran gambaran unta dan lubang jarum
  choice: 'Mempertahankan gambaran harfiah yang hiperbolis: “seekor unta masuk melalui lubang jarum.”'
  alternative: Menafsirkannya sebagai pintu sempit bernama “Lubang Jarum” atau mengganti “unta” dengan “tali.”
  rationale: Teks Yunani yang diberikan berbunyi κάμηλον, “unta,” dan tidak memberi dasar tekstual bagi penjelasan tentang sebuah pintu atau pembacaan “tali.” Gambaran yang mencolok itu tidak boleh dilunakkan dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan bermartabat. Koma setelah “Sebab” membantu pembacaan klausa perbandingan yang panjang. “Lubang jarum” adalah ungkapan Indonesia yang alami dan cukup harfiah, sehingga catatan alternatif leksikal terpisah tidak diperlukan.
