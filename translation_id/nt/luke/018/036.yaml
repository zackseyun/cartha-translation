    rationale: Verba Yunani ini menunjuk pada tindakan bertanya atau mencari informasi. “Bertanya-tanya” dapat dibaca sebagai bertanya dalam hati, sehingga mengaburkan tindakan komunikatif yang dinyatakan teks.
  - severity: medium
    issue: “apa yang sedang terjadi” terlalu interpretatif untuk τί εἴη τοῦτο.
    rationale: Frasa sumber secara langsung menanyakan identitas atau hakikat “ini/itu.” Walaupun konteksnya memungkinkan pertanyaan tentang keramaian tersebut, terjemahan itu menambahkan gagasan “sedang terjadi.”
  - severity: low
    issue: Teks catatan kaki alternatif tidak gramatikal/utuh.
    rationale: “ia terus bertanya apakah gerangan hal itu” tidak membentuk pertanyaan tidak langsung yang lengkap dalam bahasa Indonesia.
