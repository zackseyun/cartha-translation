  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: id
  text: Ketika ia mendengar orang banyak lewat, ia bertanya apa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia terus bertanya apa gerangan itu.” Bentuk imperfek dapat menyiratkan pertanyaan yang berulang, dan bentuk optatif dalam pertanyaan tidak langsung dapat memberi nuansa yang sedikit lebih tentatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Ketika mendengar
  rationale: Partisip aoris ini menyatakan keadaan yang berhubungan secara temporal dengan tindakan utama; klausa temporal alami dalam bahasa Indonesia dan mempertahankan alur narasi.
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: δέ merupakan penghubung naratif ringan; hubungan kelanjutan sudah alami dalam bahasa Indonesia tanpa kata penghubung tambahan.
- source_word: ὄχλου
  choice: orang banyak
  rationale: Nomina anarthrous ini menunjuk kepada sekumpulan orang; 'orang banyak' merupakan padanan Alkitabiah yang tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: διαπορευομένου
  choice: lewat
  rationale: Partisip kini menggambarkan gerakan yang sedang berlangsung melewati tempat orang buta itu berada; 'lewat' ringkas dan idiomatis.
- source_word: ἐπυνθάνετο
  choice: ia bertanya-tanya
  rationale: Imperfek medium menyatakan kegiatan bertanya yang sedang berlangsung atau berulang; 'bertanya-tanya' mengungkapkan usaha mencari tahu tanpa memastikan apakah tindakan itu baru dimulai.
- source_word: τί εἴη τοῦτο
  choice: apa yang sedang terjadi
  rationale: Secara harfiah berarti 'apa ini/hal ini adanya'; dalam konteks suara kerumunan, ungkapan Indonesia ini alami dan tidak mengubah pertanyaan menjadi pertanyaan tentang makna abstrak.
