  verdict: revise
  source_fidelity: Draf menangkap hubungan temporal ἀκούσας dan gerakan orang banyak yang lewat. Namun, “bertanya-tanya” dalam bahasa Indonesia lazimnya dapat menyatakan rasa heran atau perenungan batin, bukan tindakan mengajukan pertanyaan/informasi sebagaimana ἐπυνθάνετο. “Apa yang sedang terjadi” juga menggeser τί εἴη τοῦτο (“apa ini/apa itu”) menjadi penjelasan peristiwa yang sedang berlangsung.
  naturalness: “Ketika ia mendengar orang banyak lewat, ia bertanya apa itu” adalah bahasa Indonesia baku, ringkas, dan jelas. Bentuk “bertanya” cukup alami untuk imperfek dalam narasi tanpa secara berlebihan memastikan nuansa inceptif atau repetitif.
  terminology: “Orang banyak” merupakan padanan yang wajar dan mapan untuk ὄχλος. Tidak ada istilah teologis atau nama yang perlu ditangani.
  issues:
