  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: id
  text: Aku berkata kepadamu, orang ini pulang ke rumahnya sebagai orang yang sudah dibenarkan, tidak seperti orang yang satunya itu[a]. Sebab setiap orang yang meninggikan dirinya akan direndahkan, tetapi orang yang merendahkan dirinya akan ditinggikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai orang yang dibenarkan dibandingkan dengan orang yang satunya itu”; frasa ini membandingkan orang ini dengan orang Farisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: sebagai orang yang dibenarkan
  rationale: Partisipel perfekt pasif ini menyatakan hasil yang tetap dari keputusan Allah yang berkenan. Ungkapan ini mempertahankan nuansa forensik sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: παρ’ ἐκεῖνον
  choice: bukan orang yang satunya itu
  rationale: παρά dengan akusatif di sini menandai perbandingan atau kontras antara pemungut cukai dan orang Farisi. Pilihan ini menyampaikan kontras secara alami tanpa mengubahnya menjadi pernyataan teknis.
- source_word: κατέβη
  choice: pulang
  rationale: Secara harfiah berarti 'turun', kemungkinan dari kawasan Bait Allah. Dalam bahasa Indonesia, 'pulang ke rumahnya' paling alami; unsur gerak turun bukan pokok pernyataan.
- source_word: οἶκον αὐτοῦ
  choice: ke rumahnya
  rationale: οἶκος berarti rumah atau tempat tinggal; 'ke rumahnya' alami dalam konstruksi pulang.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: setiap orang yang meninggikan dirinya
  rationale: Partisipel berartikel menyatakan prinsip umum. Bentuk tunggal dan unsur refleksif dipertahankan secara alami.
- source_word: ταπεινωθήσεται
  choice: akan direndahkan
  rationale: Menerjemahkan bentuk futur pasif secara langsung dan membiarkan pelakunya tersirat sebagaimana dalam bahasa Yunani.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: tetapi orang yang merendahkan dirinya
  rationale: Mempertahankan kesejajaran dengan klausa pertama dan daya kontras δέ.
- source_word: ὑψωθήσεται
  choice: akan ditinggikan
  rationale: Menerjemahkan futur pasif dan mempertahankan pembalikan yang sejajar dengan 'meninggikan dirinya'.
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan dasar penjelasan bagi keputusan yang dinyatakan sebelumnya.
- source_word: οὗτος
  choice: orang ini
  rationale: Merujuk kembali kepada pemungut cukai dan membedakannya dari orang Farisi.
theological_decisions:
- issue: Makna δικαιόω pada kesimpulan perumpamaan
  choice: Keputusan ilahi yang menyatakan orang itu benar, diterjemahkan 'sebagai orang yang dibenarkan'
  alternative: Dinyatakan benar; memperoleh pembenaran; dibenarkan dalam arti pembelaan sosial
  rationale: Konteksnya membandingkan orang Farisi yang menganggap dirinya benar dengan pemungut cukai yang memohon belas kasihan di hadapan Allah. Terjemahan ini mempertahankan bobot keputusan Allah tanpa memasukkan rumusan teologis sistematis yang lebih luas daripada ayat tersebut.
- issue: Hubungan perbandingan dalam παρ’ ἐκεῖνον
  choice: 'Kontras eksklusif yang alami: ''bukan orang yang satunya itu'''
  alternative: Lebih dibenarkan daripada orang itu; dibenarkan dibandingkan dengan orang itu
  rationale: Frasa Yunani dapat dibaca sebagai kontras atau perbandingan. Teks utama menyampaikan kontras kontekstual, sedangkan catatan kaki menjaga kemungkinan rumusan perbandingan agar ambiguitas yang nyata tidak dihapus.
- issue: Bentuk tunggal representatif dalam pepatah
  choice: Memakai 'setiap orang' dan 'orang yang' dengan 'dirinya'
  alternative: Bentuk jamak yang netral
  rationale: Bahasa Indonesia memungkinkan bentuk tunggal generik yang inklusif tanpa penandaan gender, sambil tetap mengikuti struktur tunggal Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku berkata kepadamu' mempertahankan bentuk tunggal Yesus kepada para pendengar secara kolektif. 'Pulang ke rumahnya' dipilih demi kealamian Indonesia, sementara struktur pasif pada 'dibenarkan', 'direndahkan', dan 'ditinggikan' mempertahankan agen ilahi yang tersirat.
