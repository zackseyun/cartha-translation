  to: Aku berkata kepadamu, orang ini pulang ke rumahnya sebagai orang yang sudah dibenarkan, tidak seperti orang yang satunya itu[a]. Sebab setiap orang yang meninggikan dirinya akan direndahkan, tetapi orang yang merendahkan dirinya akan ditinggikan.
