    issue: Konstruksi “sebagai orang yang dibenarkan, bukan orang yang satunya itu” tidak menyatakan kontras predikatif dengan jelas.
    rationale: Dalam bahasa Indonesia, “bukan orang yang satunya itu” paling langsung memodifikasi identitas “orang ini,” bukan menyatakan bahwa orang lain itu tidak dibenarkan. Kontras παρ’ ἐκεῖνον perlu diungkapkan secara gramatikal.
