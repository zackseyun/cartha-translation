  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: id
  text: Namun, setelah ia menghabiskan semuanya, terjadilah kelaparan yang parah di seluruh negeri itu[a], dan ia mulai mengalami kekurangan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di daerah itu.”
    reason: χώρα dapat berarti negeri, wilayah, atau daerah; κατά juga dapat dipahami secara lebih umum sebagai penunjuk lokasi.
  - marker: b
    text: Atau, “mulai berkekurangan.”
    reason: ὑστερεῖσθαι menyatakan keadaan kekurangan tanpa menyebut secara khusus apa yang tidak dimilikinya.
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: setelah ia menghabiskan semuanya
  rationale: Genetivus absolutus dengan partisip aoris paling wajar dinyatakan sebagai anak kalimat waktu. Kata “menghabiskan” menerjemahkan δαπανάω tanpa menambahkan penilaian “menghambur-hamburkan” yang tidak harus terkandung dalam kata ini.
- source_word: δέ
  choice: Namun
  rationale: δέ menandai peralihan yang berkontras, dari habisnya harta kepada datangnya krisis. “Namun” alami dalam narasi Indonesia dan tidak terlalu tajam.
- source_word: ἐγένετο λιμὸς ἰσχυρά
  choice: terjadilah kelaparan yang parah
  rationale: ἐγένετο menyatakan timbulnya suatu keadaan, sedangkan ἰσχυρά memperkuat tingkat kelaparan. “Kelaparan yang parah” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: di seluruh negeri itu
  rationale: κατά dengan akusatif dapat menyatakan penyebaran meliputi suatu wilayah. “Negeri” mempertahankan kaitan dengan latar negeri jauh dalam perumpamaan, sedangkan “seluruh” mengungkapkan cakupan κατά.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: dan ia mulai berkekurangan
  rationale: ἤρξατο dengan infinitif menyatakan awal keadaan, dan ὑστερεῖσθαι di sini berarti berada dalam kekurangan atau kebutuhan. “Mulai berkekurangan” ringkas, alami, dan mempertahankan sifat umum objek kekurangan yang tidak disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan naratif dipertahankan, sementara istilah yang terlalu harfiah atau yang menambahkan penilaian moral yang tidak eksplisit dalam ayat ini dihindari.
