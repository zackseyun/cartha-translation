base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: id
  text: Lalu ayah itu berkata kepadanya[a], “Nak, engkau selalu bersama aku, dan segala milikku adalah milikmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Anak.” Yunani: “anak,” suatu sapaan kekeluargaan yang penuh kasih.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Anakku
  rationale: Sapaan vokatif ini menyatakan hubungan keluarga yang penuh kasih. Dalam bahasa Indonesia, “Anakku” merupakan sapaan alami dan bermartabat kepada anak sendiri; akhiran -ku mengungkapkan hubungan yang sudah melekat dalam bentuk sapaan, bukan menambahkan klaim teologis.
- source_word: πάντοτε
  choice: selalu
  rationale: Padanan langsung dan alami yang menyatakan keberlangsungan hubungan sang anak dengan ayahnya.
- source_word: μετ’ ἐμοῦ
  choice: bersama aku
  rationale: Mempertahankan makna persekutuan atau penyertaan dari μετά dengan genitif dalam ungkapan Indonesia yang wajar.
- source_word: πάντα τὰ ἐμὰ
  choice: segala milikku
  rationale: Menyampaikan cakupan menyeluruh atas kepunyaan sang ayah tanpa membatasi rujukannya hanya pada harta atau warisan secara hukum.
- source_word: σά ἐστιν
  choice: adalah milikmu
  rationale: Mengikuti struktur predikatif Yunani dan membiarkan nuansa kepemilikan—baik relasional maupun menyangkut harta dalam perumpamaan—tetap luas.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Namun, ayahnya berkata kepadanya
  rationale: δέ menandai tanggapan yang berkontras lembut dengan keluhan anak sulung. Subjek diperjelas sebagai “ayahnya” sesuai konteks agar rujukan pronominal alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan kekeluargaan dalam jawaban sang ayah
  choice: Menerjemahkan τέκνον sebagai “Anakku”
  alternative: “Nak” atau “Anak”
  rationale: τέκνον menekankan hubungan dan kelembutan, bukan istilah khusus laki-laki seperti υἱός. “Anakku” terdengar alami sebagai sapaan orang tua dalam bahasa Indonesia dan tidak mempertajamnya menjadi “putraku”; jenis kelamin penerima tetap diketahui dari konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Bentuk “aku” dipakai dalam dialog keluarga untuk mencerminkan kedekatan tanpa menjadi kasar; kalimat tetap ringkas dan mudah dipahami.
