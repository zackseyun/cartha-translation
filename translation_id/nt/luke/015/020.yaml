  terminology: “Belas kasihan” tepat untuk ἐσπλαγχνίσθη. “Menciumnya dengan hangat” menyampaikan nuansa afektif/intensif καταφιλέω secara alami tanpa memastikan bahwa ciuman itu berulang kali.
