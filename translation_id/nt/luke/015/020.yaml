  - severity: low
    issue: Nuansa καταφιλέω dapat dibuat lebih idiomatis
    rationale: “Dengan penuh kasih” dapat diterima, tetapi “dengan hangat” lebih langsung menyatakan ciuman penuh afeksi/intensitas, sambil tetap tidak memaksakan makna ‘berulang kali’.
