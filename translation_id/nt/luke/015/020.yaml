  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: id
  text: Lalu ia bangkit dan pergi kepada ayahnya. Ketika ia masih jauh, ayahnya melihat dia dan tergerak oleh belas kasihan. Ayahnya pun berlari, memeluk leher anak itu erat-erat,[a] dan menciumnya dengan hangat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jatuh pada lehernya,” sebuah ungkapan untuk pelukan yang erat.'
    reason: idiom
  - marker: b
    text: Kata kerja Yunani dapat menyiratkan ciuman yang sangat hangat, mungkin dilakukan berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: bangkit
  rationale: Partisip aoris ini menandai tindakan tegas si anak sebelum ia pergi kepada ayahnya; "bangkit" mempertahankan urutan dan daya naratif teks.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: pergi kepada ayahnya
  rationale: ἔρχομαι dapat berarti datang atau pergi menurut sudut pandang. Dalam narasi bahasa Indonesia, "pergi kepada ayahnya" paling wajar dari sudut pandang si anak, sedangkan ἑαυτοῦ secara alami diterjemahkan "-nya".
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: ketika ia masih jauh
  rationale: Konstruksi genitif absolut menyatakan keadaan yang berlangsung bersamaan. Terjemahan ini ringkas, alami, dan mempertahankan jarak yang belum ditentukan secara tepat.
- source_word: ἐσπλαγχνίσθη
  choice: tergerak oleh belas kasihan
  rationale: Kata kerja ini menyatakan belas kasihan mendalam yang menggugah batin; pilihan ini mempertahankan kekuatan emosionalnya tanpa menambahkan penafsiran alegoris.
- source_word: δραμὼν
  choice: berlari
  rationale: Terjemahan langsung partisip aoris dari τρέχω, yang mempertahankan gerak cepat sang ayah.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: memeluk lehernya erat-erat
  rationale: Ungkapan Yunani harfiahnya berarti "jatuh pada lehernya" dan secara idiomatis menggambarkan pelukan yang penuh perasaan. Bentuk Indonesia ini mempertahankan gambaran leher serta intensitas tindakan tanpa terdengar janggal.
- source_word: κατεφίλησεν
  choice: menciumnya dengan penuh kasih
  rationale: Bentuk majemuk καταφιλέω dapat menyatakan ciuman yang hangat atau intens, dan mungkin berulang. Pilihan ini menyampaikan kasih sayang tanpa memastikan pengulangan yang tidak mutlak tersurat.
theological_decisions:
- issue: Penggambaran belas kasihan sang ayah dalam perumpamaan
  choice: Mempertahankan prakarsa dan emosi sang ayah secara hidup tanpa menjelaskan tokoh ayah sebagai lambang teologis tertentu.
  alternative: Meredam unsur emosional, atau memperluas teks dengan menyatakan secara langsung bahwa sang ayah menggambarkan Allah.
  rationale: Rangkaian kata kerja dalam teks menonjolkan belas kasihan dan tindakan aktif sang ayah. Terjemahan perlu mempertahankan kekuatan itu, tetapi tidak memasukkan penafsiran doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hangat dan bermartabat. "Ayah" dipilih karena alami dalam hubungan keluarga dan sesuai dengan suasana perumpamaan; susunan kalimat dibuat jelas bagi pembaca umum.
