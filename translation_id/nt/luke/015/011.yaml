  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: id
  text: Lalu Yesus berkata, “Ada seorang laki-laki yang mempunyai dua anak laki-laki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Lalu Yesus berkata
  rationale: δέ menandai kelanjutan atau peralihan ringan dalam wacana, yang secara alami dinyatakan dengan “Lalu”. Subjek tersirat dari konteks adalah Yesus; penyebutan namanya membuat bahasa Indonesia jelas dan wajar tanpa mengubah rujukan.
- source_word: Ἄνθρωπός τις
  choice: Ada seorang
  rationale: Pola “Ada seorang” merupakan cara alami dalam bahasa Indonesia untuk memperkenalkan tokoh yang belum dikenal dan mempertahankan nuansa tak tentu dari τις. Kata “seorang” juga menunjukkan bahwa yang dimaksud ialah manusia tunggal.
- source_word: εἶχεν
  choice: mempunyai
  rationale: Bentuk imperfek di sini menyatakan keadaan latar dalam perumpamaan; “mempunyai” adalah padanan Indonesia yang alami.
- source_word: δύο
  choice: dua
  rationale: Padanan langsung bagi bilangan kardinal.
- source_word: υἱούς
  choice: anak laki-laki
  rationale: υἱούς secara khusus berarti anak-anak berjenis kelamin laki-laki; pilihan ini mempertahankan rincian keluarga yang penting dalam perumpamaan.
theological_decisions:
- issue: Daya tak tentu atau agak spesifik dari Ἄνθρωπός τις
  choice: Ada seorang
  alternative: Seorang tertentu
  rationale: “Ada seorang” mempertahankan fungsi τις sebagai pengenal tokoh parabel yang tidak disebut namanya, sekaligus menghindari ungkapan “seorang tertentu” yang kaku dan berpotensi memberi kesan bahwa identitas khusus tokoh itu penting.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan “Ada seorang yang mempunyai ...” sesuai dengan gaya pembukaan cerita; “anak laki-laki” dipilih daripada “putra” agar mudah dipahami pembaca umum tanpa kehilangan ketepatan gender.
