id: LUK.15.4
reference: Luke 15:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: id
  text: Siapakah di antara kalian yang mempunyai seratus ekor domba, lalu kehilangan seekor, tidak meninggalkan yang sembilan puluh sembilan di padang terbuka[a] dan pergi mencari yang hilang itu sampai ia menemukannya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di tempat sunyi” atau “di padang belantara.” Istilah Yunani ini dapat menunjuk pada kawasan terbuka, tempat penggembalaan, atau tempat yang sepi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Siapakah di antara kalian
  rationale: Pertanyaan retoris ini secara alami diterjemahkan demikian dalam bahasa Indonesia. Unsur ἄνθρωπος tidak perlu dinyatakan secara terpisah karena bentuk 'siapakah' sudah menunjuk kepada orang dari antara para pendengar tanpa mengubah cakupan contoh.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: yang mempunyai seratus ekor domba
  rationale: Klausa relatif lebih alami daripada konstruksi partisipial dalam bahasa Indonesia; kata penggolong 'ekor' lazim untuk hewan.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: lalu kehilangan seekor
  rationale: Partisip aoris menyatakan peristiwa kehilangan satu dari kawanan itu. 'Lalu' menjaga urutan wacana, dan 'seekor' cukup jelas merujuk kepada domba.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: tidak meninggalkan yang sembilan puluh sembilan
  rationale: Negasi dipertahankan dalam pertanyaan retoris yang mengharapkan jawaban positif; rujukan kepada domba tetap jelas dari konteks.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang terbuka
  rationale: ἔρημος dapat menunjuk tempat yang sepi, tidak dihuni, atau terbuka. Dalam konteks penggembalaan, 'padang terbuka' terdengar alami dan tidak secara tidak perlu menyiratkan gurun tandus; alternatif leksikal dicatat dalam catatan kaki.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: pergi mencari yang hilang itu
  rationale: Ungkapan ini menyatakan gerak menuju domba yang hilang dalam rangka mencarinya. 'Mencari' membuat maksud tindakan jelas dan alami dalam bahasa Indonesia.
- source_word: ἕως εὕρῃ αὐτό
  choice: sampai ia menemukannya
  rationale: Menerjemahkan klausa batas waktu secara langsung; sufiks '-nya' merujuk kepada domba yang hilang.
theological_decisions:
- issue: Bahasa maskulin representatif dalam pertanyaan perumpamaan
  choice: Menerjemahkan Τίς ἄνθρωπος ἐξ ὑμῶν sebagai 'Siapakah di antara kalian'
  alternative: '''Laki-laki manakah di antara kalian'' atau ''Orang manakah di antara kalian'''
  rationale: Dalam bahasa Indonesia, 'siapakah' secara idiomatis sudah menyatakan seorang manusia dan tidak menandai gender. Terjemahan ini tidak meniadakan unsur maskulin yang bermakna, sebab ἄνθρωπος di sini bersifat generik dan bukan ἀνήρ yang secara khusus berarti laki-laki.
- issue: Keadaan sembilan puluh sembilan domba
  choice: Tidak menambahkan bahwa domba-domba itu aman, dijaga, atau ditinggalkan sendirian
  alternative: Menjelaskan keadaan atau perlindungan kawanan
  rationale: Teks hanya menyatakan bahwa sang gembala meninggalkan mereka di ἐρήμῳ. Menambahkan rincian tersebut akan menyelesaikan ketegangan naratif yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada wajar dan bermartabat. 'Kalian' dipakai untuk bentuk jamak ὑμῶν dan cocok dengan sapaan langsung kepada sekelompok pendengar. Susunan pertanyaan retoris dipertahankan, tetapi partisip-partisip Yunani diubah menjadi klausa yang alami dalam bahasa Indonesia.
