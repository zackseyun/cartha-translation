  terminology: “Domba,” “padang terbuka,” dan “yang hilang itu” tepat untuk konteks ini. “Padang terbuka” merupakan pilihan yang wajar bagi ἐρήμῳ dalam latar penggembalaan; catatan kaki secara memadai mencatat rentang alternatif tanpa memaksakan satu arti sempit. Penghilangan penandaan maskulin pada ἄνθρωπος tidak mengurangi makna, karena istilah Yunani tersebut generik dalam contoh retoris ini.
