  source_fidelity: Teks Indonesia dengan setia mencerminkan pertanyaan retoris Yunani, kepemilikan seratus domba, kehilangan satu, meninggalkan sembilan puluh sembilan di ἐρήμῳ, pencarian domba yang hilang, dan batas tindakan “sampai ia menemukannya.” Tidak ada tambahan mengenai keamanan atau penjagaan kawanan yang ditinggalkan.
