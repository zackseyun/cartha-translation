id: LUK.15.23
reference: Luke 15:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: id
  text: Bawalah anak sapi yang sudah digemukkan itu, sembelihlah[a], lalu marilah kita makan dan bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahkanlah sebagai kurban”; kata Yunani ini dapat berarti menyembelih seekor hewan dan dalam konteks tertentu mengandung nuansa pengurbanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: Bawalah
  rationale: Imperatif jamak ini secara alami diterjemahkan sebagai perintah untuk membawa sesuatu kepada pembicara; unsur 'kemari' sudah tersirat dan tidak perlu ditambahkan.
- source_word: μόσχον τὸν σιτευτόν
  choice: anak sapi yang sudah digemukkan itu
  rationale: μόσχος menunjuk pada sapi muda atau anak sapi, sedangkan σιτευτός berarti dipelihara dan digemukkan untuk suatu kesempatan. Bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: θύσατε
  choice: sembelihlah
  rationale: Dalam konteks jamuan, kata ini paling langsung menunjuk pada penyembelihan hewan untuk dimakan. Pilihan ini tidak memaksakan pengertian kurban ritual, tetapi kemungkinan nuansa tersebut dicatat dalam catatan kaki.
- source_word: φαγόντες
  choice: lalu marilah kita makan
  rationale: 'Partisip aoris ini secara harfiah dapat berarti ''setelah makan'', tetapi bersama subjunktif ajakan berikutnya berfungsi alami sebagai rangkaian tindakan: makan dan bersukacita. ''Lalu'' menjaga gerak urutan tanpa membuatnya terlalu kaku.'
- source_word: εὐφρανθῶμεν
  choice: bersukacita
  rationale: Subjunktif ajakan orang pertama jamak ini menyatakan kegembiraan atau perayaan bersama. 'Bersukacita' bermartabat, mudah dipahami, dan tidak membatasi maknanya hanya pada kegiatan pesta.
- source_word: καὶ ... καὶ
  choice: lalu ... dan
  rationale: Rangkaian penghubung Yunani menyatukan perintah dengan ajakan. Bahasa Indonesia alami memakai 'lalu' untuk urutan tindakan dan 'dan' untuk menghubungkan makan dengan bersukacita.
theological_decisions:
- issue: Kemungkinan nuansa pengurbanan dalam θύσατε
  choice: Diterjemahkan 'sembelihlah' sebagai persiapan jamuan.
  alternative: Persembahkanlah sebagai kurban.
  rationale: Konteks naratif berpusat pada persiapan perjamuan keluarga, bukan upacara kultis. Namun, karena θύω dalam konteks lain dapat berarti menyembelih sebagai kurban, kemungkinan nuansa itu tidak dihapus dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk ajakan 'marilah kita' mempertahankan daya hortatif εὐφρανθῶμεν, sedangkan 'bersukacita' menjaga cakupan makna yang lebih luas daripada sekadar berpesta.
