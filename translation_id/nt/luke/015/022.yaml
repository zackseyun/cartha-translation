  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: id
  text: Namun, ayah itu berkata kepada hamba-hambanya[a], “Cepat, bawalah keluar jubah yang terbaik[b] dan pakaikanlah jubah itu kepadanya. Pasangkan cincin[c] pada tangannya dan sandal pada kakinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani doulous menunjuk pada budak atau hamba terikat dalam rumah tangga, bukan pekerja bebas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jubah yang pertama”; maksudnya mungkin jubah yang paling utama atau terbaik.
    reason: lexical_alternative
  - marker: c
    text: Teks Yunani hanya mengatakan “cincin”; sebagian penafsir memahaminya sebagai cincin meterai yang menandakan pemulihan kedudukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: hamba-hamba
  rationale: Dalam latar rumah tangga kuno, δοῦλος menunjuk pada orang yang terikat sebagai milik tuannya. ‘Hamba’ merupakan padanan Indonesia yang wajar dan bermartabat; catatan kaki menjelaskan realitas perbudakannya agar makna sosial sumber tidak dilunakkan.
- source_word: Ταχὺ
  choice: Cepat!
  rationale: Kata ini dipakai secara adverbial untuk mendesak tindakan segera. Seruan singkat ‘Cepat!’ menyampaikan urgensi dengan alami dalam bahasa Indonesia.
- source_word: ἐξενέγκατε
  choice: Ambilkan
  rationale: Bentuk perintah jamak dari ἐκφέρω menyuruh para hamba membawa jubah keluar dari tempat penyimpanannya. ‘Ambilkan’ alami dalam konteks perintah rumah tangga dan mengimplikasikan membawanya kepada sang ayah.
- source_word: στολὴν τὴν πρώτην
  choice: jubah yang terbaik
  rationale: Secara harfiah ‘jubah yang pertama’; dalam konteks ini πρῶτος kemungkinan besar menyatakan kedudukan atau mutu utama. ‘Yang terbaik’ menyampaikan makna idiomatis tanpa menambahkan simbolisme.
- source_word: ἐνδύσατε αὐτόν
  choice: kenakanlah kepadanya
  rationale: Ungkapan ini berarti mengenakan pakaian pada seseorang. Bentuk Indonesia ini mempertahankan tindakan para hamba terhadap anak itu dan berhubungan jelas dengan jubah yang disebut sebelumnya.
- source_word: δακτύλιον
  choice: cincin
  rationale: Kata Yunani hanya menyebut sebuah cincin dan tidak secara eksplisit menentukan bahwa itu cincin meterai.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: pada tangannya
  rationale: Dalam konteks mengenakan perhiasan, εἰς secara idiomatis diterjemahkan ‘pada’ dalam bahasa Indonesia.
- source_word: ὑποδήματα
  choice: sandal
  rationale: Istilah ini menunjuk alas kaki, terutama sandal dalam konteks Mediterania kuno; ‘sandal’ lebih tepat secara budaya daripada ‘sepatu’.
- source_word: εἰς τοὺς πόδας
  choice: pada kakinya
  rationale: ‘Pada kakinya’ merupakan ungkapan Indonesia yang alami untuk mengenakan alas kaki.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan yang bernuansa kontras dari perkataan anak kepada tanggapan ayah. ‘Namun’ mempertahankan peralihan naratif itu tanpa membuat pertentangannya terlalu keras.
theological_decisions:
- issue: Apakah δούλους diterjemahkan ‘budak-budak’ atau ‘hamba-hamba’
  choice: hamba-hamba, dengan catatan bahwa mereka adalah budak/hamba terikat
  alternative: budak-budak
  rationale: ‘Hamba-hamba’ lebih alami dalam narasi Indonesia dan tidak sekasar nuansa modern ‘budak’, tetapi catatan kaki diperlukan supaya status sosial sebagai orang yang tidak merdeka tidak hilang.
- issue: Apakah πρῶτην dalam στολὴν τὴν πρώτην diterjemahkan secara harfiah ‘pertama’ atau idiomatis ‘terbaik’
  choice: jubah yang terbaik
  alternative: jubah yang pertama/utama
  rationale: Dalam frasa ini πρῶτος kemungkinan menunjukkan jubah paling utama dalam mutu atau kedudukan, bukan urutan waktu. Catatan mempertahankan bentuk harfiahnya dan ambiguitas yang relevan.
- issue: Apakah δακτύλιον diperluas menjadi ‘cincin meterai’
  choice: cincin
  alternative: cincin meterai
  rationale: Teks hanya mengatakan ‘cincin’. Penafsiran bahwa cincin itu merupakan cincin meterai atau lambang pemulihan status tidak boleh dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Seruan ‘Cepat!’ mempertahankan urgensi, sementara bentuk perintah ‘ambilkan’, ‘kenakanlah’, dan ‘pasangkan’ sesuai dengan adegan rumah tangga. Semua penjelasan sosial dan kemungkinan simbolis yang melampaui bunyi eksplisit teks ditempatkan dalam catatan kaki.
