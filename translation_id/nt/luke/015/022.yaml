  to: Namun, ayah itu berkata kepada hamba-hambanya[a], “Cepat, bawalah keluar jubah yang terbaik[b] dan pakaikanlah jubah itu kepadanya. Pasangkan cincin[c] pada tangannya dan sandal pada kakinya.”
  rationale: Revisi terbatas pada ketepatan ἐξενέγκατε dan kelancaran konstruksi untuk ἐνδύσατε αὐτόν. “Bawalah keluar” mempertahankan tindakan membawa dari dalam, sedangkan “pakaikanlah jubah itu kepadanya” menyatakan secara eksplisit objek dan penerima tindakan. Catatan kaki mempertahankan ambiguitas serta informasi sosial dan interpretatif tanpa menambahkannya ke teks utama.
