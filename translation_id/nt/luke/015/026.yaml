  text: καὶ προσκαλεσάμενος ἕνα τῶν παίδων ἐπυνθάνετο τί ⸀ἂν εἴη ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: id
  text: Lalu ia memanggil salah seorang pelayan dan bertanya apa gerangan semua itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa arti semua itu.” Secara lebih harfiah, bahasa Yunani berbunyi, “apa gerangan semua itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Bentuk partisip aoristus medium menunjukkan bahwa ia memanggil seseorang datang kepadanya sebelum bertanya. "Memanggil" alami dalam bahasa Indonesia dan mempertahankan urutan tindakan tanpa menambahkan rincian.
- source_word: παίδων
  choice: pelayan
  rationale: παῖς dapat berarti "anak" atau "pelayan". Dalam konteks rumah tangga ini, orang yang dipanggil untuk menjelaskan perayaan paling wajar dipahami sebagai pelayan; "anak" dapat menyesatkan.
- source_word: ἐπυνθάνετο
  choice: bertanya
  rationale: Imperfek medium dari πυνθάνομαι menyatakan tindakan mencari keterangan. "Bertanya" merupakan padanan Indonesia yang alami; aspek imperfek tidak perlu ditonjolkan karena konteks tidak menekankan berlangsungnya tindakan itu.
- source_word: τί ἂν εἴη ταῦτα
  choice: apa gerangan semua itu
  rationale: Ungkapan ini adalah pertanyaan tak langsung dengan nuansa kemungkinan atau ketidakpastian. "Apa gerangan semua itu" mempertahankan bentuk harfiah dan rasa ingin tahu tanpa langsung menafsirkannya sebagai pertanyaan tentang arti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada naratif. Kata "gerangan" dipakai secara terbatas untuk mempertahankan nuansa pertanyaan tak langsung dan ketidakpastian dalam konstruksi Yunani.
