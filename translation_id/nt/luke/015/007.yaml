id: LUK.15.7
reference: Luke 15:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: id
  text: 'Aku berkata kepada kalian: Demikian juga[a], akan ada sukacita di surga atas satu orang berdosa yang bertobat, lebih daripada atas sembilan puluh sembilan orang benar[b] yang tidak memerlukan pertobatan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demikian” atau “begitulah.” Ungkapan ini menghubungkan sukacita di surga dengan pokok perumpamaan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani menyebut mereka “orang benar.” Dalam konteksnya, sebutan ini dapat dipahami secara langsung atau sebagai ironi; terjemahan tidak memutuskan salah satu penafsiran.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Mempertahankan sapaan langsung dan bentuk jamak ὑμῖν dalam bahasa Indonesia modern yang alami.
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menghubungkan pernyataan ini dengan gambaran sukacita dalam perumpamaan sebelumnya dan menyampaikan arti 'demikian/ dengan cara yang sama'.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: akan ada sukacita di surga
  rationale: Mempertahankan makna futur dan lokasi sukacita tanpa menambahkan siapa yang bersukacita.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: karena satu orang berdosa
  rationale: Dalam hubungannya dengan χαρά, ἐπί menyatakan dasar atau alasan sukacita; 'karena' alami dalam bahasa Indonesia.
- source_word: μετανοοῦντι
  choice: yang bertobat
  rationale: Partisipel kini aktif ini menggambarkan orang berdosa yang bertobat; klausa relatif terdengar alami dan tetap mempertahankan tindakan aktifnya.
- source_word: ἢ
  choice: lebih daripada
  rationale: Dalam susunan perbandingan ini, ungkapan tersebut menyampaikan perbandingan tingkat sukacita dengan jelas, bukan pilihan sederhana 'atau'.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: sembilan puluh sembilan orang benar
  rationale: δίκαιοις adalah kata sifat substantival yang menunjuk kepada orang; 'orang benar' mempertahankan sebutan Yunani tanpa menafsirkannya sebagai ironi.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: yang tidak memerlukan pertobatan
  rationale: Menyampaikan klausa deskriptif dan ungkapan nominal Yunani secara jelas serta alami.
theological_decisions:
- issue: Apakah 'orang benar' menunjuk kepada orang yang sungguh benar atau digunakan secara ironis bagi orang yang menganggap dirinya benar
  choice: Mempertahankan ungkapan 'orang benar' tanpa menandai ironi dalam teks utama.
  alternative: Menerjemahkan sebagai 'orang yang menganggap dirinya benar' atau memakai tanda kutip pada kata 'benar'.
  rationale: Teks Yunani hanya mengatakan δικαίοις ('orang benar') dan tidak secara eksplisit menandai ironi. Terjemahan mempertahankan ketegangan penafsiran tersebut.
- issue: Siapa yang mengalami sukacita di surga
  choice: Menyatakan tempatnya sebagai 'di surga' tanpa menentukan pelaku sukacita.
  alternative: Menambahkan 'Allah' atau 'para malaikat' sebagai pihak yang bersukacita.
  rationale: Ayat ini menyebut lokasi sukacita, tetapi tidak menyebut pelakunya secara eksplisit; penambahan subjek akan melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk jamak sapaan Yunani. Istilah teologis umum 'bertobat' dan 'pertobatan' dipilih karena alami dan tepat dalam konteks, tanpa mempersempit maknanya menjadi perubahan pikiran saja.
