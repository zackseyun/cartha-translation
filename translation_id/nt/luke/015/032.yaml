id: LUK.15.32
reference: Luke 15:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: id
  text: Namun, kita harus berpesta dan bersukacita, sebab saudaramu ini sudah mati dan hidup kembali; ia telah hilang dan ditemukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: berpesta
  rationale: Dalam konteks perjamuan penyambutan, kata ini menunjuk pada perayaan penuh kegembiraan. “Berpesta” alami dalam bahasa Indonesia dan tetap mempertahankan suasana perayaan.
- source_word: χαρῆναι
  choice: bersukacita
  rationale: Mempertahankan ungkapan sukacita kedua yang berpasangan dengan εὐφρανθῆναι, tanpa meleburkan keduanya menjadi satu kata.
- source_word: ἔδει
  choice: kita harus
  rationale: Bentuk imperfek impersonal menyatakan keharusan yang timbul dari keadaan atau kepatutan moral. Bahasa Indonesia secara alami memerlukan subjek; “kita” mencakup sang ayah dan seisi rumah tanpa mengubah inti pernyataan.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: saudaramu ini
  rationale: Susunan ini alami dalam bahasa Indonesia serta mempertahankan demonstratif οὗτος dan hubungan kekeluargaan yang ditekankan oleh σου.
- source_word: νεκρὸς ἦν
  choice: sudah mati
  rationale: Mempertahankan gambaran harfiah mati yang dalam perumpamaan berfungsi secara metaforis; “sudah” menyatakan keadaan sebelumnya secara alami.
- source_word: ἔζησεν
  choice: hidup kembali
  rationale: Aoristus ini secara harfiah dapat berarti “hidup”, tetapi dalam pertentangannya dengan “mati” menyatakan peralihan kembali kepada hidup. Pilihan ini mempertahankan metafora pemulihan tanpa menjelaskannya secara doktrinal.
- source_word: ἀπολωλὼς
  choice: telah hilang
  rationale: Partisip perfek menggambarkan keadaan sebagai orang yang hilang. “Telah hilang” mempertahankan aspek keadaan sebelumnya dan cocok dengan pola perumpamaan.
- source_word: εὑρέθη
  choice: ditemukan
  rationale: Mempertahankan bentuk pasif aoristus secara langsung dan berpasangan alami dengan “telah hilang”.
theological_decisions:
- issue: Daya metaforis pertentangan mati dan hidup
  choice: Mempertahankan ungkapan “sudah mati dan hidup kembali”
  alternative: Menjelaskannya sebagai “terasing lalu dipulihkan”
  rationale: Teks perumpamaan memakai citra mati dan hidup. Terjemahan mempertahankan citra serta ketegangan teologis itu, tanpa mengubahnya menjadi penjelasan eksplisit tentang pemulihan ataupun kebangkitan jasmani.
- issue: Nuansa keharusan dalam ἔδει
  choice: “kita harus”
  alternative: “sudah sepatutnya kita”
  rationale: “Harus” mempertahankan kekuatan keharusan, sedangkan alternatif “sepatutnya” lebih menonjolkan kepantasan. Subjek “kita” dipakai demi bahasa Indonesia yang alami dan sesuai dengan perayaan bersama dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur paralel “sudah mati dan hidup kembali; ia telah hilang dan ditemukan” mempertahankan dua pasangan kontras sumber Yunani. Tidak diperlukan catatan kaki karena alternatif utama dapat dicatat dalam keputusan leksikal tanpa membebani teks publikasi.
