  source_fidelity: 'Teks Indonesia dengan setia mempertahankan dua pasangan kontras dalam Yunani: mati/hidup kembali dan hilang/ditemukan. “Kita harus” merupakan pengungkapan Indonesia yang wajar bagi ἔδει yang impersonal dalam ujaran sang ayah, tanpa menambahkan makna teologis. “Hidup kembali” secara tepat mempertahankan citra metaforis pemulihan dalam perumpamaan tanpa memaksakan makna kebangkitan jasmani.'
