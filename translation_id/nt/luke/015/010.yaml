  source_fidelity: 'Teks Indonesia secara akurat mencerminkan unsur-unsur utama Yunani: οὕτως sebagai penghubung komparatif, λέγω ὑμῖν sebagai ujaran langsung, γίνεται χαρά tanpa menetapkan pelaku sukacita, ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ sebagai ''di hadapan malaikat-malaikat Allah'', dan partisipel kini μετανοοῦντι sebagai ''yang bertobat''. ''Karena satu orang berdosa'' dengan wajar menyatakan sukacita yang ditimbulkan oleh orang berdosa itu dan pertobatannya.'
