id: LUK.15.10
reference: Luke 15:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: id
  text: Demikian juga,[a] Aku berkata kepadamu, ada sukacita di hadapan malaikat-malaikat Allah karena satu orang berdosa yang bertobat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Begitulah” atau “Dengan cara demikian”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, sukacita itu ada “di hadapan malaikat-malaikat Allah”. Kalimat ini tidak secara eksplisit menyatakan bahwa para malaikat itu sendiri yang bersukacita.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menghubungkan pernyataan ini dengan perumpamaan sebelumnya dan mempertahankan daya komparatifnya dalam bahasa Indonesia yang wajar.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung serta bentuk tunggal pembicara dan jamak penerima dalam rumusan yang lugas dan bermartabat.
- source_word: γίνεται χαρά
  choice: ada sukacita
  rationale: Mengungkapkan terjadinya atau hadirnya sukacita secara alami tanpa membuat subjek pelaku yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Secara dekat mempertahankan makna kehadiran atau lingkungan di depan pihak tertentu, tanpa menafsirkan para malaikat sebagai pelaku sukacita.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: malaikat-malaikat Allah
  rationale: Menyampaikan konstruksi genitif secara jelas dan mempertahankan ungkapan alkitabiah yang lazim.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: karena satu orang berdosa
  rationale: ἐπί dengan datif menunjukkan dasar atau peristiwa yang menimbulkan sukacita; 'karena' alami dalam bahasa Indonesia dan tetap menonjolkan satu orang.
- source_word: μετανοοῦντι
  choice: yang bertobat
  rationale: Partisipel kini menerangkan orang berdosa tersebut; klausa relatif ini alami dan mempertahankan keluasan makna teologis pertobatan tanpa menguraikannya.
theological_decisions:
- issue: Makna bahasa pertobatan
  choice: yang bertobat
  alternative: yang berubah pikiran; yang berbalik
  rationale: Ayat ini menyatakan sukacita atas pertobatan seorang berdosa, tetapi tidak mendefinisikan pertobatan secara lebih rinci. Istilah 'bertobat' mempertahankan konsep dan keluasan teologisnya.
- issue: Lokasi atau pelaku sukacita
  choice: ada sukacita di hadapan malaikat-malaikat Allah
  alternative: ada sukacita di antara malaikat-malaikat Allah; malaikat-malaikat Allah bersukacita
  rationale: Bahasa Yunani menyatakan bahwa sukacita terjadi 'di hadapan' para malaikat Allah, bukan secara eksplisit bahwa merekalah yang bersukacita. Rumusan ini mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata ganti ilahi tidak terlibat; 'Aku' mengikuti kebiasaan penerjemahan ujaran Yesus. Penanda catatan ditempatkan tepat pada unsur yang dijelaskan.
