  source_fidelity: Teks Yunani menyatakan bahwa Ia berbicara kepada mereka dan memperkenalkan “perumpamaan ini.” Terjemahan mempertahankan para penerima, demonstrativa, dan istilah παραβολή dengan tepat. Namun, gabungan “menyampaikan ... kata-Nya” tidak merepresentasikan pengulangan εἶπεν ... λέγων secara idiomatis dalam bahasa Indonesia dan terdengar seperti dua predikat yang kurang padu.
