  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum, sementara semua unsur semantis utama teks Yunani dipertahankan. Huruf kapital pada “Ia” dan bentuk “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia tanpa menambahkan penafsiran pada isi ayat.
