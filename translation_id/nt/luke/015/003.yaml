  text: 'So he told them this parable[a], saying:'
translation:
  language: id
  text: 'Lalu Ia mengatakan perumpamaan ini kepada mereka:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: menyampaikan
  rationale: Bentuk aoris dari λέγω menyatakan tindakan berbicara. Dengan objek “perumpamaan ini”, “menyampaikan” terdengar alami dalam bahasa Indonesia tanpa mengubahnya menjadi verba yang berarti sekadar bercerita.
- source_word: δὲ
  choice: Lalu
  rationale: δέ merupakan penghubung ringan. “Lalu” memberi peralihan naratif yang alami dari keluhan pada ayat sebelumnya menuju tanggapan Yesus, tanpa menambahkan pertentangan yang kuat.
- source_word: πρὸς αὐτοὺς
  choice: kepada mereka
  rationale: πρός dengan akusatif menandai pihak yang menjadi sasaran perkataan; “kepada mereka” mempertahankan hubungan itu secara jelas dan wajar.
- source_word: τὴν παραβολὴν ταύτην
  choice: perumpamaan ini
  rationale: παραβολή dalam konteks Injil Sinoptik lazim dan tepat diterjemahkan “perumpamaan”; ταύτην dipertahankan dengan demonstrativa “ini”.
- source_word: λέγων
  choice: 'kata-Nya:'
  rationale: Partisipel ini memperkenalkan isi perkataan berikutnya. “Kata-Nya:” merupakan rumusan Indonesia yang alami dan bermartabat untuk membuka kutipan langsung, sekaligus merepresentasikan fungsi λέγων.
