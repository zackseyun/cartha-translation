  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: id
  text: Beberapa hari kemudian[a], anak yang lebih muda itu mengumpulkan segala miliknya, lalu berangkat ke negeri yang jauh. Di sana ia menghambur-hamburkan hartanya[b] dengan menjalani hidup yang tak terkendali[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sesudah tidak banyak hari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “harta miliknya” atau “kekayaannya.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “hidup secara boros” atau “hidup secara sembrono.” Teks ini tidak menyebut dosa tertentu, tetapi menggambarkan cara hidup yang tidak terkendali dan menghamburkan harta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Beberapa hari kemudian
  rationale: Ungkapan Yunani secara harfiah berarti 'sesudah tidak banyak hari'. Bentuk idiomatis ini menyampaikan selang waktu singkat dengan alami dalam bahasa Indonesia modern; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: συναγαγὼν πάντα
  choice: mengumpulkan segala miliknya
  rationale: Partisipel ini menyatakan tindakan yang mendahului keberangkatan. Dalam konteks pembagian harta, πάντα menunjuk pada semua yang menjadi bagian atau miliknya; 'mengumpulkan' mempertahankan gagasan συνάγω tanpa menentukan apakah semuanya diuangkan.
- source_word: ὁ νεώτερος υἱός
  choice: anak yang lebih muda itu
  rationale: Terjemahan alami dari bentuk komparatif yang membedakan anak ini dari kakaknya dalam narasi.
- source_word: ἀπεδήμησεν
  choice: berangkat
  rationale: Kata kerja ini berarti pergi meninggalkan tempat kediaman menuju daerah lain. 'Berangkat' alami dan tidak menambahkan gagasan bahwa ia pasti pergi ke luar negeri, sedangkan tujuan jauhnya dinyatakan oleh frasa berikut.
- source_word: εἰς χώραν μακράν
  choice: ke negeri yang jauh
  rationale: χώρα dapat berarti negeri atau wilayah. 'Negeri yang jauh' merupakan ungkapan Indonesia yang alami dan mempertahankan ketidakpastian mengenai lokasi serta batas politiknya.
- source_word: διεσκόρπισεν
  choice: menghambur-hamburkan
  rationale: Secara dasar berarti mencerai-beraikan, tetapi ketika objeknya harta, maknanya adalah memboroskan atau menyia-nyiakan. 'Menghambur-hamburkan' menangkap metafora dan daya ungkapnya.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: hartanya
  rationale: οὐσία di sini menunjuk pada kekayaan, harta milik, atau bagian warisan yang dimilikinya. 'Harta' cukup luas dan alami tanpa mempersempitnya menjadi uang atau tanah saja.
- source_word: ζῶν ἀσώτως
  choice: dengan hidup secara boros
  rationale: Partisipel dan adverbia ini menerangkan cara ia menghabiskan hartanya. 'Secara boros' mempertahankan fokus kontekstual pada kehidupan yang tidak terkendali dan menghamburkan sumber daya, tanpa memasukkan dosa tertentu yang tidak disebut dalam ayat ini.
theological_decisions:
- issue: Cakupan moral ἀσώτως
  choice: dengan hidup secara boros
  alternative: dengan hidup dalam pesta pora / dengan hidup bejat
  rationale: Ayat ini menggambarkan cara hidup yang boros atau tidak terkendali, tetapi tidak menyebut dosa seksual atau bentuk kebejatan tertentu. Terjemahan tidak boleh mengimpor rincian dari tuduhan kakaknya dalam ayat 30 ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur kalimat Yunani yang panjang dibagi menjadi dua kalimat agar jelas bagi pembaca umum. Penanda wacana καί diterjemahkan secara selektif sebagai 'lalu' dan 'Di sana' agar alurnya lancar. Semua penanda catatan kaki muncul dalam teks utama.
