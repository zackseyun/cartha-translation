  naturalness: Bahasa keseluruhan jelas dan modern. Pemecahan kalimat panjang menjadi dua kalimat juga wajar. Frasa “dengan hidup secara boros” kurang alami karena susunannya berlebih dan maknanya tumpang tindih dengan “menghambur-hamburkan hartanya.” “Dengan menjalani hidup yang tak terkendali” lebih idiomatis dan mempertahankan cakupan makna yang lebih luas.
  terminology: “Anak yang lebih muda itu” tepat, karena tidak mengubah komparatif Yunani menjadi klaim bahwa ia pasti anak paling bungsu. “Negeri yang jauh” dan “harta” juga sesuai register Indonesia modern dan tidak terlalu mempersempit χώρα atau οὐσία.
