id: LUK.15.29
reference: Luke 15:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: id
  text: Namun, ia menjawab ayahnya, ‘Lihatlah, sudah bertahun-tahun aku melayani Ayah seperti seorang budak[a] dan tidak pernah melanggar perintah Ayah. Tetapi Ayah tidak pernah memberiku seekor anak kambing pun agar aku dapat bersukaria bersama teman-temanku.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melayani Ayah.” Kata Yunani δουλεύω dapat berarti “melayani” atau, dalam arti yang lebih kuat, “menjadi budak; bekerja sebagai budak.” Di sini ungkapan yang lebih kuat mencerminkan nada pahit anak sulung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: ia menjawab ayahnya
  rationale: Ungkapan Yunani yang secara harfiah berarti ‘menjawab dan berkata kepada ayahnya’ disampaikan secara wajar dan ringkas dalam bahasa Indonesia tanpa kehilangan makna.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian dan menegaskan keluhan anak sulung; ‘Lihatlah’ mempertahankan daya serunya dalam bahasa Indonesia modern.
- source_word: τοσαῦτα ἔτη
  choice: selama bertahun-tahun ini
  rationale: Ungkapan ini menyatakan lamanya masa yang ditekankan oleh pembicara dan terdengar alami dalam keluhan langsung.
- source_word: δουλεύω σοι
  choice: aku sudah bekerja seperti budak untuk Ayah
  rationale: δουλεύω termasuk rumpun kata yang berkaitan dengan perbudakan atau pengabdian yang sangat tunduk. Dalam keluhan pahit anak sulung, ungkapan ini mempertahankan nada keras tanpa menyatakan bahwa hubungan itu secara harfiah adalah perbudakan.
- source_word: ἐντολήν σου παρῆλθον
  choice: melanggar perintah Ayah
  rationale: Dalam konstruksi ini, παρέρχομαι berarti melewati dalam arti melanggar atau mengabaikan; ‘melanggar’ jelas dan tepat dalam bahasa Indonesia.
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: Ayah tidak pernah memberiku seekor anak kambing pun
  rationale: ἔριφος adalah anak kambing. Partikel ‘pun’ secara alami menyampaikan penekanan keluhan bahwa pemberian sekecil itu sekalipun tidak pernah diterimanya.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: agar aku dapat bersukaria bersama teman-temanku
  rationale: Klausa tujuan ini menggambarkan kegembiraan dalam suasana perjamuan; ‘bersukaria’ mempertahankan nuansa perayaan dengan bahasa yang bermartabat.
theological_decisions:
- issue: Kekuatan makna δουλεύω dalam ucapan anak sulung
  choice: bekerja seperti budak untuk Ayah
  alternative: melayani Ayah
  rationale: Konteksnya menampilkan cara anak sulung memandang pengabdiannya dengan pahit, bukan menetapkan bahwa ia secara harfiah budak ayahnya. Terjemahan utama mempertahankan kekuatan rumpun kata δουλεύω, sedangkan alternatif yang lebih lunak dicatat agar rentang makna asli tetap terbuka.
translation_notes:
  register: Bahasa dialog dibuat alami dan hormat dengan memakai ‘Ayah’ sebagai sapaan orang kedua. Nada keluhan dipertahankan melalui ‘Lihatlah’, pengulangan ‘tidak pernah’, dan ungkapan ‘seekor anak kambing pun’.
