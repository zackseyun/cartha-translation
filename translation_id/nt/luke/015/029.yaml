revisions:
- from: Namun, ia menjawab ayahnya, ‘Lihatlah, selama bertahun-tahun ini aku sudah bekerja seperti budak untuk Ayah[a] dan tidak pernah melanggar perintah Ayah. Namun, Ayah tidak pernah memberiku seekor anak kambing pun agar aku dapat bersukaria bersama teman-temanku.’
  to: Namun, ia menjawab ayahnya, ‘Lihatlah, sudah bertahun-tahun aku melayani Ayah seperti seorang budak[a] dan tidak pernah melanggar perintah Ayah. Tetapi Ayah tidak pernah memberiku seekor anak kambing pun agar aku dapat bersukaria bersama teman-temanku.’
  rationale: Revisi memindahkan penanda catatan kaki ke frasa yang menerjemahkan δουλεύω dan memperbaiki kelancaran dialog. Frasa “melayani Ayah seperti seorang budak” mempertahankan pembedaan antara pelayanan kepada ayah dan nada pahit yang membandingkannya dengan penghambaan, sambil catatan kaki memberi alternatif yang lebih kuat. Kontras pada bagian kedua dibuat lebih jelas dengan “Tetapi”.
