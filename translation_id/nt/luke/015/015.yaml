  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: id
  text: Lalu ia pergi dan mengikatkan diri kepada salah seorang warga negeri itu,[a] lalu orang itu mengirimnya ke ladang-ladangnya untuk memberi makan babi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melekatkan diri kepada” atau “bergabung dengan”; kata Yunani yang dipakai menyiratkan bahwa ia mengaitkan dirinya erat-erat, bahkan dengan bergantung, kepada orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: pergi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama; 'pergi' alami dan tidak menambahkan nuansa yang tidak ada dalam teks.
- source_word: ἐκολλήθη
  choice: mengikatkan diri kepada
  rationale: Verba ini secara harfiah menyiratkan melekat atau bergabung erat; pilihan ini mempertahankan unsur ketergantungan dan tindakan mengaitkan diri kepada seseorang.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: kepada salah seorang warga
  rationale: πολίτης menunjuk anggota atau warga suatu komunitas politik; 'warga' merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: τῆς χώρας ἐκείνης
  choice: negeri itu
  rationale: χώρα dapat berarti negeri, wilayah, atau daerah; 'negeri itu' selaras dengan latar negeri jauh dalam perumpamaan ini.
- source_word: ἔπεμψεν αὐτὸν
  choice: yang menyuruhnya pergi
  rationale: Secara harfiah berarti 'ia mengutusnya'; dalam konteks pemberian pekerjaan, 'menyuruhnya pergi' lebih alami sambil mempertahankan tindakan orang tersebut sebagai subjek.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: ke ladang-ladangnya
  rationale: ἀγρός berarti ladang atau tanah pertanian; bentuk ulang mempertahankan nomina jamak dan sufiks -nya menyatakan kepemilikan.
- source_word: βόσκειν
  choice: untuk menjaga
  rationale: βόσκω mencakup memberi makan atau menggembalakan ternak. 'Menjaga' alami untuk tugas mengurus babi tanpa membatasi makna hanya pada pemberian makanan.
- source_word: χοίρους
  choice: babi
  rationale: '''Babi'' adalah padanan modern dan langsung bagi χοῖρος; dalam bahasa Indonesia bentuknya tidak perlu berubah untuk menyatakan jamak setelah konteks tugas pemeliharaan.'
