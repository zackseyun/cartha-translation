  to: Setelah ia masuk ke rumah,[a] ia memanggil teman-temannya dan tetangga-tetangganya untuk berkumpul, lalu berkata kepada mereka, ‘Bersukacitalah bersama aku,[b] karena aku telah menemukan dombaku yang tadinya hilang.’[c]
  rationale: Revisi mengembalikan unsur “masuk ke rumah” dari teks Yunani ke teks utama dan menjadikan “tiba di rumah” sebagai alternatif idiomatis dalam catatan kaki. Selain itu, kepemilikan teman dan tetangga dibuat paralel. Makna, register, serta gambaran perumpamaan tetap dipertahankan.
