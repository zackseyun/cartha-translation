  terminology: “Bersukacitalah bersama aku” merupakan padanan yang baik bagi Συγχάρητέ μοι. “Dombaku yang tadinya hilang” dengan wajar mengungkapkan partisip perfek ἀπολωλός dalam konteks domba yang sekarang sudah ditemukan, tanpa memasukkan penafsiran teologis.
