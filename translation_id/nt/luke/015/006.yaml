reference: Luke 15:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: id
  text: Setelah ia masuk ke rumah,[a] ia memanggil teman-temannya dan tetangga-tetangganya untuk berkumpul, lalu berkata kepada mereka, ‘Bersukacitalah bersama aku,[b] karena aku telah menemukan dombaku yang tadinya hilang.’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah ia tiba di rumah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Rayakanlah bersama aku.” Kata Yunani yang dipakai berarti bersukacita bersama seseorang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dombaku yang hilang.” Secara harfiah, “dombaku, yang telah hilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: setelah tiba di rumah
  rationale: Partisip aoris menyatakan tindakan yang mendahului tindakan utama. Dalam bahasa Indonesia, ‘tiba di rumah’ alami dan tetap mencerminkan gerak masuk menuju rumah.
- source_word: συγκαλεῖ
  choice: memanggil ... untuk berkumpul
  rationale: Ungkapan ini menyampaikan arti memanggil sejumlah orang agar berkumpul, tanpa kesan keras yang dapat timbul dari ‘memanggil menghadap’.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: sahabat-sahabat dan tetangga-tetangganya
  rationale: Padanan langsung dan wajar bagi kedua kelompok; akhiran -nya secara alami menunjukkan hubungan mereka dengan tokoh dalam perumpamaan.
- source_word: λέγων αὐτοῖς
  choice: lalu berkata kepada mereka
  rationale: Partisip kini diungkapkan sebagai verba berurutan agar kalimat Indonesia mengalir alami.
- source_word: Συγχάρητέ μοι
  choice: Bersukacitalah bersama aku
  rationale: Mempertahankan unsur sukacita bersama yang terkandung dalam συγχαίρω serta bentuk perintahnya.
- source_word: ὅτι εὗρον
  choice: karena aku telah menemukan
  rationale: ὅτι menyatakan alasan, sedangkan ‘telah menemukan’ menampilkan tindakan selesai dengan hasil yang masih relevan.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: dombaku yang tadinya hilang
  rationale: Konstruksi nomina diikuti partisip berartikel dipertahankan sebagai klausa relatif. ‘Tadinya’ secara alami menunjukkan keadaan hilang yang telah berakhir karena domba itu ditemukan.
theological_decisions:
- issue: Gambaran perumpamaan tentang penemuan kembali
  choice: Mempertahankan gambaran konkret ‘dombaku yang tadinya hilang’
  alternative: Menggantikannya dengan bahasa penafsiran tentang orang berdosa atau keselamatan
  rationale: Ayat ini masih menyampaikan gambaran perumpamaan. Makna teologisnya tidak dimasukkan ke dalam terjemahan ayat sebelum dijelaskan oleh konteks.
- issue: Hubungan antara kepemilikan dan keadaan hilang
  choice: dombaku yang tadinya hilang
  alternative: dombaku yang hilang
  rationale: Klausa relatif mencerminkan τὸ πρόβατόν μου τὸ ἀπολωλός dan ‘tadinya’ menandai bahwa keadaan hilang itu kini telah berubah, tanpa mengurangi kepemilikan sang gembala.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan bentuk jamak dipakai untuk memperjelas bahwa kedua nomina berbentuk jamak, sedangkan susunan klausa dibuat mengalir tanpa menghapus urutan tindakan dalam teks Yunani.
