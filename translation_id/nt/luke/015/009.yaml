id: LUK.15.9
reference: Luke 15:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: id
  text: Sesudah menemukan uang itu, ia memanggil sahabat-sahabat perempuannya dan para tetangganya, lalu berkata, ‘Bersukacitalah bersamaku, sebab aku telah menemukan uang drakhma[a] yang telah kukehilangan.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu drakhma adalah uang perak Yunani yang dalam banyak konteks kira-kira senilai upah harian seorang pekerja.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: Sesudah menemukan uang itu
  rationale: Partisip aoris feminin menunjukkan tindakan yang mendahului pemanggilan. Objek yang tersirat diperjelas secara alami sebagai uang yang sedang dicari.
- source_word: συγκαλεῖ
  choice: ia memanggil
  rationale: Bentuk kini historis menghidupkan narasi; dalam bahasa Indonesia, 'memanggil' secara alami menyampaikan tindakan mengundang mereka datang berkumpul.
- source_word: φίλας
  choice: sahabat-sahabat perempuannya
  rationale: Bentuk feminin jamak dipertahankan secara eksplisit karena merujuk kepada para sahabat perempuan dari tokoh perempuan tersebut.
- source_word: γείτονας
  choice: para tetangganya
  rationale: Kata ini berarti para tetangga; bentuk Yunaninya sendiri tidak perlu dibuat lebih spesifik gendernya dalam bahasa Indonesia.
- source_word: λέγουσα
  choice: lalu berkata
  rationale: Partisip kini yang memperkenalkan ujaran langsung diterjemahkan sebagai rangkaian tindakan yang wajar dalam bahasa Indonesia.
- source_word: Συγχάρητέ μοι
  choice: Bersukacitalah bersamaku
  rationale: Imperatif jamak menyatakan ajakan agar orang-orang lain turut merasakan sukacitanya; terjemahan ini dekat dengan bentuk dan makna Yunani.
- source_word: ὅτι
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan untuk bersukacita.
- source_word: εὗρον
  choice: aku telah menemukan
  rationale: Aoris menyatakan penemuan yang sudah terjadi dan menjadi alasan sukacita; 'telah' membuat hubungan waktunya jelas dan alami dalam ujaran langsung.
- source_word: δραχμὴν
  choice: uang drakhma
  rationale: Nama mata uang tertentu dipertahankan sebagai 'drakhma', dengan kata 'uang' untuk membantu pembaca mengenali acuannya sebagai keping uang.
- source_word: ἣν ἀπώλεσα
  choice: yang hilang itu
  rationale: Secara harfiah berarti 'yang telah aku hilangkan'. Ungkapan Indonesia ini alami dan, dalam konteks pencarian perempuan tersebut, tetap menunjukkan bahwa uang itulah yang sebelumnya hilang tanpa menonjolkan nuansa bahwa ia sengaja menghilangkannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk feminin φίλας dibuat eksplisit, sedangkan γείτονας dibiarkan sebagai 'tetangga' karena tidak secara leksikal menuntut penandaan gender. Istilah budaya 'drakhma' dipertahankan dan dijelaskan dalam catatan kaki.
