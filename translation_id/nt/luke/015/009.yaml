review_pass:
  verdict: revise
  source_fidelity: Frasa relatif ἣν ἀπώλεσα menyatakan bahwa perempuan itu telah kehilangan drakhma tersebut. Terjemahan "yang hilang itu" menghilangkan subjek orang pertama dan karena itu tidak sepenuhnya menyampaikan makna sumber. Unsur-unsur lain—urutan temporal partisip aoris, tindakan memanggil para sahabat dan tetangga, serta ajakan imperatif jamak—tersampaikan dengan baik.
  naturalness: Bahasa keseluruhan baku dan lancar. "Yang telah kukehilangan" adalah ungkapan modern yang alami dan secara tepat menyatakan hubungan perempuan itu dengan uang yang sebelumnya hilang.
  terminology: '"Drakhma" tepat untuk δραχμή dan catatan budaya akurat serta proporsional. "Sahabat-sahabat perempuannya" mempertahankan rujukan feminin φίλας; "para tetangganya" wajar tanpa menambahkan penandaan gender yang tidak dinyatakan secara eksplisit oleh γείτονας.'
  issues:
  - severity: medium
    issue: '"yang hilang itu" tidak menerjemahkan ἀπώλεσα sebagai tindakan orang pertama.'
    rationale: Klausa Yunani berarti "yang telah/aku hilangkan [kehilangan]". Bentuk pasif/intransitif "yang hilang" hanya menyatakan keadaan uang dan menghapus rujukan kepada perempuan sebagai pihak yang kehilangan uang itu.
  revised_text: Sesudah menemukan uang itu, ia memanggil sahabat-sahabat perempuannya dan para tetangganya, lalu berkata, ‘Bersukacitalah bersamaku, sebab aku telah menemukan uang drakhma[a] yang telah kukehilangan.’
