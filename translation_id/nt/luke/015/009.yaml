  to: Sesudah menemukan uang itu, ia memanggil sahabat-sahabat perempuannya dan para tetangganya, lalu berkata, ‘Bersukacitalah bersamaku, sebab aku telah menemukan uang drakhma[a] yang telah kukehilangan.’
