  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: id
  text: Lalu anak yang lebih muda berkata kepada ayahnya, “Ayah, berikanlah kepadaku bagian harta yang menjadi hakku.” Maka ayah itu membagikan harta miliknya[a] kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kehidupannya” atau “sarana penghidupannya”; kata Yunani βίος di sini merujuk pada harta atau milik yang menopang kehidupan sang ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: anak yang lebih muda
  rationale: Adjektiva komparatif ini dipakai secara substantival, tetapi konteks langsung menunjukkan bahwa yang dimaksud ialah salah satu anak laki-laki sang ayah. Penambahan 'anak' diperlukan agar wajar dan jelas dalam bahasa Indonesia tanpa menambah identitas yang tidak tersirat konteks.
- source_word: δός μοι
  choice: berikanlah kepadaku
  rationale: Imperatif aoris δίδωμι dengan pronomina datif menyatakan permintaan langsung. Bentuk '-lah' mempertahankan nada permintaan yang tegas namun tetap wajar ketika seorang anak menyapa ayahnya.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: bagian ... yang menjadi hakku
  rationale: ἐπιβάλλον menunjuk pada bagian yang jatuh kepada atau menjadi jatah seseorang. Ungkapan 'menjadi hakku' menyampaikan tuntutan atas bagian tersebut secara alami dalam konteks pembagian warisan.
- source_word: οὐσία
  choice: harta
  rationale: Dalam konteks keluarga dan warisan, οὐσία berarti kekayaan atau milik. 'Harta' lebih alami daripada istilah hukum 'harta warisan', sebab sang ayah masih hidup dan teks tidak secara eksplisit menyebut warisan.
- source_word: διεῖλεν
  choice: membagi
  rationale: Kata kerja ini secara langsung berarti membagi atau membagikan; 'membagi' cocok dengan objek berupa harta dan penerima jamak.
- source_word: αὐτοῖς
  choice: di antara kedua anaknya
  rationale: Secara formal berarti 'kepada mereka'. Karena konteks menyebut dua anak, ungkapan ini secara alami menjelaskan bahwa pembagian dilakukan di antara keduanya.
- source_word: βίον
  choice: harta penghidupannya
  rationale: βίος dapat berarti kehidupan, nafkah, atau sarana hidup. Dalam konteks ini kata tersebut menunjuk pada milik yang menopang kehidupan sang ayah; frasa ini mempertahankan nuansa 'sarana hidup' sekaligus memperjelas bahwa yang dibagi adalah harta.
theological_decisions:
- issue: Apakah bagian yang diminta harus disebut 'warisan'
  choice: bagian harta yang menjadi hakku
  alternative: bagian warisan yang menjadi hakku
  rationale: Teks memakai οὐσία, bukan istilah khusus untuk warisan, dan ayah masih hidup. Terjemahan tidak mengunci tindakan itu ke dalam kategori hukum atau adat tertentu yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan 'Ayah' terasa alami; 'berikanlah' mempertahankan ketegasan imperatif tanpa terdengar kasar. Frasa 'harta penghidupannya' sengaja mempertahankan nuansa βίος dan dijelaskan melalui catatan kaki.
