  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: id
  text: Anak laki-lakinya yang lebih tua berada di ladang; ketika ia datang dan mendekati rumah, ia mendengar musik dan tari-tarian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “musik instrumental dan para penari.” Istilah-istilah Yunani itu dapat secara lebih khusus menunjuk pada pertunjukan musik dan kelompok penari.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: sedang berada
  rationale: Bentuk ini menyatakan keadaan dalam latar cerita. Daya penghubung δέ dipahami sebagai peralihan naratif dan tidak perlu diberi kata temporal atau pertentangan yang lebih tegas dalam bahasa Indonesia.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: anaknya yang lebih tua
  rationale: πρεσβύτερος berbentuk komparatif, sehingga berarti anak yang lebih tua, bukan dengan sendirinya anak sulung.
- source_word: ἐν ἀγρῷ
  choice: di ladang
  rationale: ἀγρός di sini menunjuk pada ladang atau lahan pertanian; terjemahan langsung ini wajar dalam bahasa Indonesia.
- source_word: ὡς ἐρχόμενος
  choice: ketika ia datang
  rationale: Ungkapan ini menggambarkan keadaan saat ia sedang datang. Pilihan ini mempertahankan hubungan waktunya tanpa menambahkan secara eksplisit bahwa ia sedang pulang.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: mendekati rumah
  rationale: ἐγγίζω berarti datang dekat atau mendekati; bentuk ini alami dan langsung dalam narasi Indonesia.
- source_word: ἤκουσεν
  choice: ia mendengar
  rationale: Aoristus sederhana ini paling tepat diterjemahkan sebagai tindakan naratif biasa tanpa menambahkan arti 'mulai'.
- source_word: συμφωνίας
  choice: musik
  rationale: συμφωνία dapat menunjuk pada bunyi atau pertunjukan musik, khususnya musik instrumental. 'Musik' jelas dan tidak menimbulkan kesan anakronistis seperti 'simfoni'.
- source_word: χορῶν
  choice: tari-tarian
  rationale: χορός dapat berarti tarian atau kelompok penari. 'Tari-tarian' alami ketika dipasangkan dengan 'musik', sedangkan kemungkinan rujukan kepada kelompok penari dicatat dalam catatan kaki.
