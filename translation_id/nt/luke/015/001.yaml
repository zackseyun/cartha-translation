base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: id
  text: Semua pemungut pajak dan orang berdosa sedang mendekati Yesus untuk mendengarkan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terus mendekati Yesus.” Bentuk Yunani menunjukkan tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: terus berdatangan
  rationale: Konstruksi perifrastis dengan bentuk lampau εἰμί dan partisipel kini menggambarkan tindakan yang sedang berlangsung atau berulang. Partikel δέ berfungsi sebagai peralihan wacana dan tidak perlu diterjemahkan dengan kata temporal tersendiri.
- source_word: αὐτῷ ἐγγίζοντες
  choice: berdatangan mendekati Yesus
  rationale: Ungkapan ini mempertahankan gagasan datang mendekat, sedangkan 'terus berdatangan' menyampaikan aspek berlangsung atau berulang. Nama 'Yesus' dipakai agar rujukan pronominal alami dan jelas dalam bahasa Indonesia.
- source_word: πάντες
  choice: semua
  rationale: πάντες mencakup kedua kelompok yang disebut dan menekankan luasnya orang-orang yang datang.
- source_word: οἱ τελῶναι
  choice: pemungut pajak
  rationale: Istilah ini jelas dan lazim dalam bahasa Indonesia untuk orang yang memungut pajak atau pendapatan bagi pemerintahan.
- source_word: οἱ ἁμαρτωλοὶ
  choice: orang berdosa
  rationale: Terjemahan substantival ini mempertahankan sebutan kelompok dalam teks tanpa menambahkan penilaian seperti 'terkenal' atau kategori sosial seperti 'kaum tersisih'.
- source_word: ἀκούειν αὐτοῦ
  choice: untuk mendengarkan-Nya
  rationale: Infinitif menyatakan tujuan. 'Mendengarkan' secara alami menyampaikan bahwa mereka datang untuk menyimak perkataan atau pengajaran Yesus.
theological_decisions:
- issue: Daya sosial-keagamaan pasangan 'pemungut pajak dan orang berdosa'
  choice: Kedua kategori dipertahankan tanpa perluasan tafsiran.
  alternative: pemungut pajak dan kaum tersisih lainnya; pemungut pajak dan orang yang terkenal berdosa
  rationale: Teks Yunani menyebut dua kelompok yang dikenali dalam konteks Injil. Penambahan keterangan sosial atau moral akan melampaui sumber dan dapat mengurangi ketegangan naratifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Terus berdatangan' dipilih untuk menyampaikan aspek berkelanjutan atau berulang tanpa membuat kalimat terasa kaku; 'mendekati Yesus' menjaga makna harfiah verba gerak.
