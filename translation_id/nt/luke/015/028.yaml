  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: id
  text: Namun ia menjadi marah dan tidak mau masuk[a]. Lalu ayahnya keluar dan terus membujuknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ingin masuk” atau “menolak masuk.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “terus membujuknya” juga dapat diterjemahkan “terus mendesaknya” atau “terus memohon kepadanya”; bentuk imperfek dapat menunjukkan tindakan yang berlangsung terus atau berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: menjadi marah
  rationale: Bentuk aoris ὀργίζομαι dalam konteks ini dapat menyatakan timbulnya kemarahan. “Menjadi marah” menangkap nuansa tersebut tanpa memperkuatnya menjadi “murka”.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan ringan antara sukacita perayaan sebelumnya dan reaksi anak yang lebih tua.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: tidak mau masuk
  rationale: θέλω dengan infinitif menyatakan kehendak. “Tidak mau masuk” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan unsur kemauan tanpa memastikan adanya penolakan yang dinyatakan secara eksplisit.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Lalu ayahnya
  rationale: δέ kedua memperkenalkan tindakan sang ayah sebagai tanggapan dan paling alami diterjemahkan dengan penanda kelanjutan naratif “Lalu”.
- source_word: ἐξελθὼν
  choice: keluar
  rationale: Partisip ἐξέρχομαι menunjukkan bahwa ayah bergerak ke luar dari tempat perayaan untuk menemui anaknya.
- source_word: παρεκάλει
  choice: terus memohon kepadanya
  rationale: παρακαλέω di sini menyampaikan permohonan yang sungguh-sungguh. Bentuk imperfek mendukung tindakan yang sedang berlangsung atau berulang, yang dinyatakan dengan “terus”.
- source_word: αὐτόν
  choice: kepadanya
  rationale: Pronomina ini merujuk kepada anak yang lebih tua dan menjadi pelengkap alami bagi verba “memohon” dalam bahasa Indonesia.
theological_decisions:
- issue: Nada permohonan sang ayah dalam perumpamaan
  choice: terus memohon kepadanya
  alternative: terus membujuknya; mendesaknya
  rationale: Pilihan ini mempertahankan prakarsa sang ayah yang sungguh-sungguh dan penuh perhatian, tanpa memasukkan penafsiran doktrinal tambahan. Kata “terus” juga menyampaikan kemungkinan aspek berkelanjutan dari bentuk imperfek.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. “Dia” dipakai karena rujukannya jelas dari konteks, sedangkan “tidak mau” lebih wajar bagi pembaca umum daripada bentuk yang lebih formal seperti “tidak bersedia”.
