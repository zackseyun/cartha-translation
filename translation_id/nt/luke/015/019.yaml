  source_fidelity: Terjemahan dengan tepat menyampaikan οὐκέτι, ἄξιος, κληθῆναι, dan permintaan ποίησόν με ὡς. Namun, υἱός secara eksplisit maskulin tunggal (“son”), sedangkan “anakmu” tidak menandai bahwa yang dimaksud adalah anak laki-laki. Dalam konteks ini, “putramu” mempertahankan spesifikasi sumber dengan tetap wajar dalam register Alkitab Indonesia.
