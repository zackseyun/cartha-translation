  terminology: “Layak,” “disebut,” “Jadikanlah,” dan “pekerja upahan” adalah padanan yang baik. “Putramu” diperlukan untuk mempertahankan gender maskulin υἱός. Catatan kaki sebaiknya mempertahankan nuansa pekerja bergaji secara konsisten pada semua alternatif.
