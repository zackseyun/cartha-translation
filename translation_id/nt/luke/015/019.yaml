base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: id
  text: Aku tidak layak lagi disebut putramu. Jadikanlah aku seperti salah seorang pekerja upahanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “salah seorang pelayan upahanmu” atau “salah seorang buruh upahanmu.” Kata Yunani yang digunakan menunjuk kepada pekerja yang menerima upah, bukan budak rumah tangga.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: tidak ... lagi
  rationale: 'Ungkapan ini secara alami menyatakan perubahan keadaan: ia memandang dirinya tidak lagi memiliki kelayakan yang dahulu melekat pada statusnya.'
- source_word: ἄξιος
  choice: layak
  rationale: Kata ini mempertahankan dimensi kepantasan, kehormatan, dan status sosial dalam pengakuan sang anak.
- source_word: κληθῆναι
  choice: disebut
  rationale: Bentuk pasif ini menunjuk pada penamaan atau pengakuan seseorang dalam suatu status; 'disebut' ringkas dan alami.
- source_word: υἱός
  choice: anak
  rationale: Dalam konteks sapaan langsung kepada ayah, 'anakmu' secara wajar menyatakan hubungan sebagai anak laki-laki tanpa perlu memakai bentuk yang lebih kaku 'putramu'.
- source_word: ποίησόν
  choice: Jadikanlah
  rationale: Imperatif ini meminta sang ayah menempatkannya dalam kedudukan baru; 'Jadikanlah' lebih dekat dengan daya kausatif Yunani daripada 'perlakukanlah'.
- source_word: ὡς
  choice: seperti
  rationale: Kata ini mempertahankan nuansa perbandingan dan tidak memaksakan tafsiran bahwa ia secara resmi sudah dijadikan pekerja upahan.
- source_word: ἕνα τῶν μισθίων σου
  choice: salah seorang pekerja upahanmu
  rationale: μίσθιος adalah orang yang bekerja dengan menerima upah, berbeda dari budak rumah tangga. 'Pekerja upahan' jelas, bermartabat, dan mudah dipahami.
theological_decisions:
- issue: Bahasa status dalam pengakuan sang anak
  choice: Mempertahankan 'layak' dan hubungan 'anakmu' tanpa memperlunak dimensi kekeluargaan serta kehormatan sosial.
  alternative: Aku tidak pantas lagi disebut sebagai anakmu.
  rationale: Teks menyatakan penilaian sang anak terhadap kelayakannya menyandang status keluarga, bukan sekadar perasaan malu. Terjemahan ini tidak menetapkan apakah sang ayah menerima penilaian tersebut.
- issue: Daya permintaan ποίησόν με ὡς
  choice: Jadikanlah aku seperti
  alternative: Perlakukanlah aku sebagai
  rationale: '''Jadikanlah'' mempertahankan unsur perubahan kedudukan, sedangkan ''seperti'' menjaga bentuk perbandingan dan ambiguitas hubungan tepat yang diminta.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pengakuan yang lugas dan bermartabat. Susunan 'tidak layak lagi' dipilih karena alami dalam bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
