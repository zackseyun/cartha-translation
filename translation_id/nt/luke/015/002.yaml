  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: id
  text: Baik orang-orang Farisi maupun para ahli Taurat terus menggerutu, “Orang ini menyambut orang-orang berdosa dan makan bersama mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: terus menggerutu
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang. ‘Menggerutu’ mempertahankan nuansa keluhan negatif yang diucapkan dengan tidak puas.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: baik orang-orang Farisi maupun para ahli Taurat
  rationale: Pola korelatif τε ... καί dinyatakan dengan ‘baik ... maupun ...’. ‘Ahli Taurat’ adalah istilah Indonesia yang alami dan lazim untuk γραμματεῖς dalam konteks Injil.
- source_word: λέγοντες
  choice: dengan berkata
  rationale: Partisipel ini berlangsung bersamaan dengan kata kerja utama; ‘dengan berkata’ menghubungkan isi gerutuan secara alami.
- source_word: Οὗτος
  choice: Orang ini
  rationale: Ungkapan ini mempertahankan daya demonstratif yang dapat bernada menjaga jarak atau meremehkan, tanpa memperkuatnya secara berlebihan.
- source_word: ἁμαρτωλοὺς
  choice: orang-orang berdosa
  rationale: Terjemahan ini mempertahankan pemakaian adjektiva substantival sebagai kategori sosial-keagamaan dalam tuduhan tersebut.
- source_word: προσδέχεται
  choice: menyambut
  rationale: ‘Menyambut’ secara alami menyampaikan tindakan menerima dengan baik, tanpa konotasi psikologis tambahan yang dapat muncul pada ‘menerima’ dalam pemakaian tertentu.
- source_word: συνεσθίει αὐτοῖς
  choice: makan bersama mereka
  rationale: Terjemahan langsung ini jelas dan mempertahankan makna persekutuan meja tanpa menambahkan tafsiran.
theological_decisions:
- issue: Daya sosial dan teologis pergaulan Yesus dengan orang-orang berdosa
  choice: Tuduhan diterjemahkan secara lugas, dengan ‘menyambut’ dan ‘makan bersama mereka’.
  alternative: ‘Menerima orang-orang berdosa dan makan bersama mereka.’
  rationale: Teks menyoroti keberatan terhadap penerimaan dan persekutuan meja Yesus dengan kelompok yang dicap sebagai orang berdosa. Terjemahan mempertahankan ketegangan itu tanpa melunakkan atau memperluas tuduhannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan ‘orang-orang’ dipertahankan demi kejelasan kelompok yang dibicarakan; susunan kalimat mengungkapkan aspek berkelanjutan dari bentuk imperfek Yunani.
