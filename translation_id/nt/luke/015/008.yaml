id: LUK.15.8
reference: Luke 15:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: id
  text: Atau, perempuan manakah yang mempunyai sepuluh drakhma[a] dan, jika kehilangan satu drakhma, tidak menyalakan pelita, menyapu rumahnya, dan mencarinya dengan cermat[b] sampai menemukannya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Drakhma adalah uang logam perak Yunani.
    reason: cultural_note
  - marker: b
    text: Atau, “dengan tekun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Atau
  rationale: Mempertahankan fungsi penghubung yang memperkenalkan perumpamaan sejajar dengan perumpamaan sebelumnya.
- source_word: τίς γυνὴ
  choice: perempuan mana
  rationale: Ungkapan tanya retoris yang alami dalam bahasa Indonesia tanpa menambahkan unsur 'di antara kalian' yang tidak terdapat dalam teks Yunani.
- source_word: δραχμὰς ... δραχμὴν μίαν
  choice: sepuluh keping uang drakhma ... satu keping uang drakhma
  rationale: Mempertahankan jenis mata uang kuno yang khusus, sementara 'keping uang' membuat acuannya jelas dan alami bagi pembaca Indonesia.
- source_word: ἐὰν ἀπολέσῃ
  choice: lalu kehilangan
  rationale: Dalam rangkaian pertanyaan retoris bahasa Indonesia, 'lalu' menyajikan keadaan andaian dengan alami; makna bersyarat tetap terungkap melalui keseluruhan konstruksi 'perempuan mana yang ... lalu kehilangan ... tidak ...?'.
- source_word: οὐχὶ
  choice: tidak
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban positif.
- source_word: ἅπτει λύχνον
  choice: menyalakan pelita
  rationale: Secara tepat menyampaikan tindakan menyalakan lampu minyak dalam latar rumah tangga kuno dengan istilah Indonesia yang jelas.
- source_word: σαροῖ τὴν οἰκίαν
  choice: menyapu rumahnya
  rationale: Mengungkapkan tindakan konkret secara alami; akhiran '-nya' memperjelas bahwa rumah itu adalah rumah perempuan tersebut tanpa mengubah adegan.
- source_word: ζητεῖ ἐπιμελῶς
  choice: mencarinya dengan cermat
  rationale: Menangkap makna pencarian yang teliti dan sungguh-sungguh dalam bahasa Indonesia modern; objek pronominal diperjelas dari konteks.
- source_word: ἕως οὗ εὕρῃ
  choice: sampai menemukannya
  rationale: Menyatakan titik akhir pencarian secara jelas dan alami, dengan objek yang dipahami dari konteks.
