- from: Atau, perempuan mana yang mempunyai sepuluh keping uang drakhma[a], lalu kehilangan satu keping uang drakhma, tidak menyalakan pelita, menyapu rumahnya, dan mencarinya dengan cermat[b] sampai menemukannya?
  to: Atau, perempuan manakah yang mempunyai sepuluh drakhma[a] dan, jika kehilangan satu drakhma, tidak menyalakan pelita, menyapu rumahnya, dan mencarinya dengan cermat[b] sampai menemukannya?
  rationale: Revisi menandai secara eksplisit kondisi "jika kehilangan" dan membakukan bentuk tanya retoris menjadi "perempuan manakah yang". Istilah drakhma, tindakan domestik, objek pencarian yang dipahami dari konteks, serta ambiguitas yang tidak dipersoalkan dalam teks sumber tetap dipertahankan.
