    rationale: ἐὰν ἀπολέσῃ adalah kondisi umum, "jika ia kehilangan". Penghubung "lalu" terutama menunjukkan urutan, sehingga dapat mengaburkan unsur pengandaian dalam pertanyaan retoris Yunani.
  - severity: low
    issue: '"Perempuan mana yang" kurang baku dibandingkan "perempuan manakah yang" dalam register terjemahan ini.'
    rationale: Bentuk "manakah" lebih alami dan mantap untuk pertanyaan retoris bahasa Indonesia baku.
