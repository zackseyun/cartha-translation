review_pass:
  verdict: revise
  source_fidelity: 'Draf pada umumnya setia pada teks Yunani: mempertahankan pertanyaan retoris, sepuluh drakhma, tindakan menyalakan pelita dan menyapu rumah, serta pencarian sampai benda itu ditemukan. Namun, "lalu kehilangan" menyatakan urutan peristiwa dan tidak cukup jelas menyampaikan kondisi ἐὰν ἀπολέσῃ ("jika kehilangan").'
  naturalness: '"Perempuan mana yang" dapat dipahami, tetapi "perempuan manakah yang" lebih baku dan lancar dalam pertanyaan retoris. Susunan dengan "jika kehilangan" juga lebih jelas dalam bahasa Indonesia modern.'
  terminology: '"Drakhma" tepat sebagai nama mata uang khusus, dengan penjelasan budaya di catatan kaki. "Pelita" sesuai untuk λύχνος dalam latar rumah tangga kuno. "Dengan cermat" merupakan padanan yang baik bagi ἐπιμελῶς; alternatif "dengan tekun" layak dipertahankan dalam catatan kaki.'
  issues:
