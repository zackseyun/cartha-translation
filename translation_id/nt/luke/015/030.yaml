  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: id
  text: Namun, ketika anakmu yang ini datang—yang telah melahap harta milikmu[a] bersama para pelacur—engkau menyembelih anak sapi yang digemukkan untuknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sumber penghidupanmu” atau “harta pusakamu.” Kata Yunaninya secara harfiah berarti “kehidupan,” dan dalam konteks ini dapat menunjuk pada harta atau sumber penghidupan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Namun, ketika
  rationale: Menggabungkan nilai temporal ὅτε dengan nuansa kontras δέ dalam keluhan sang kakak.
- source_word: ὁ υἱός σου οὗτος
  choice: anakmu yang ini
  rationale: Mempertahankan daya tunjuk οὗτος dan nada menjaga jarak; sang kakak tidak menyebutnya sebagai saudaranya.
- source_word: ὁ καταφαγών
  choice: dia yang telah melahap
  rationale: Melahap mempertahankan metafora keras dan hidup dari κατεσθίω, bukan langsung menafsirkannya sebagai sekadar menghamburkan.
- source_word: σου τὸν βίον
  choice: harta kekayaanmu
  rationale: Dalam konteks ini βίος menunjuk pada sumber penghidupan atau milik, bukan kehidupan biologis; ungkapan ini alami dan mencakup substansi kekayaan sang ayah.
- source_word: μετὰ πορνῶν
  choice: bersama pelacur-pelacur
  rationale: Terjemahan langsung, jelas, dan modern yang mempertahankan kerasnya tuduhan sang kakak.
- source_word: ἦλθεν
  choice: datang
  rationale: Mengikuti kata Yunani tanpa menambahkan gagasan 'kembali' yang hanya tersirat oleh konteks.
- source_word: ἔθυσας
  choice: menyembelih
  rationale: Di sini θύω berarti menyembelih hewan untuk perjamuan, tanpa harus memberi kesan korban ritual.
- source_word: τὸν σιτευτὸν μόσχον
  choice: anak sapi yang digemukkan
  rationale: Padanan Indonesia yang tepat dan mudah dipahami untuk anak sapi yang dipelihara khusus bagi jamuan.
- source_word: αὐτῷ
  choice: untuk dia
  rationale: Datif menyatakan penerima manfaat atau orang yang dihormati melalui perjamuan itu.
theological_decisions:
- issue: Apakah tuduhan sang kakak harus disajikan sebagai fakta yang diteguhkan narator atau sebagai tuduhan dalam tuturannya
  choice: Tuduhan diterjemahkan secara langsung di dalam ucapan sang kakak tanpa penjelas tambahan.
  alternative: Menambahkan 'konon' atau mengubahnya menjadi rumusan umum seperti 'hidup bejat'.
  rationale: Teks Yunani menyajikannya sebagai perkataan sang kakak, bukan sebagai penegasan tersendiri oleh narator. Terjemahan langsung menjaga ketegangan naratif tanpa mengesahkan ataupun menyangkal tuduhan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat namun tetap alami. Sapaan 'Ayah' dipakai dalam klausa langsung kepada ayah agar hubungan pembicara dan lawan bicara jelas; bentuk ulang 'pelacur-pelacur' menyatakan jamak secara eksplisit. Tanda pisah menata partisip panjang tanpa menghilangkan tekanan emosional.
