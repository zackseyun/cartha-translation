  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: id
  text: Ketika ia menemukannya[a], ia meletakkannya di atas kedua bahunya sambil bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu domba yang hilang dalam konteks sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: ketika ia menemukannya
  rationale: Partisip aoris aktif menyatakan tindakan yang mendahului tindakan utama. Klausa waktu ini alami dalam bahasa Indonesia; akhiran -nya memasok objek yang tersirat dari konteks, yaitu domba yang hilang.
- source_word: ἐπιτίθησιν
  choice: ia meletakkannya
  rationale: Indikatif kini aktif menggambarkan tindakan utama secara hidup. 'Meletakkannya' secara alami menyatakan tindakan menaruh domba itu pada bahu.
- source_word: ἐπὶ τοὺς ὤμους
  choice: di atas bahunya
  rationale: ἐπί dengan akusatif menunjukkan gerakan atau penempatan ke atas. Bentuk Yunani 'bahu-bahu' bersifat jamak, tetapi bahasa Indonesia lazim memakai bentuk tunggal kolektif 'bahunya' dalam ungkapan ini.
- source_word: αὐτοῦ
  choice: -nya pada 'bahunya'
  rationale: Pronomina genitif ini merujuk kepada gembala sebagai pemilik bahu, bukan kepada domba.
- source_word: χαίρων
  choice: dengan gembira
  rationale: Partisip kini aktif menyatakan keadaan atau cara yang menyertai tindakan. 'Dengan gembira' mempertahankan penekanan pada sukacita dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Objek langsung yang tersirat setelah εὑρὼν dan pada tindakan meletakkan
  choice: Objek domba dinyatakan dengan akhiran '-nya' pada 'menemukannya' dan 'meletakkannya'.
  alternative: Ketika ia menemukan, ia meletakkan di atas bahunya dengan gembira.
  rationale: Bahasa Yunani dapat membiarkan objek tersirat karena jelas dari konteks ayat sebelumnya. Bahasa Indonesia memerlukan objek yang dinyatakan agar kalimat jelas dan alami; penambahan pronomina tidak mengubah muatan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Urutan klausa mengikuti hubungan tindakan dalam Yunani, sementara partisip diterjemahkan sebagai klausa waktu dan frasa cara agar mudah dipahami.
