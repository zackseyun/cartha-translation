base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: id
  text: Namun anak itu berkata kepadanya, “Ayah, aku telah berdosa terhadap surga[a] dan di hadapanmu. Aku tidak layak lagi disebut anakmu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani “terhadap surga” memakai “surga” sebagai cara penuh hormat untuk merujuk kepada Allah. Beberapa terjemahan mengalihbahasakannya secara interpretatif sebagai “terhadap Allah”.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah melanjutkan ucapan anak itu dengan kata-kata yang sepadan dengan “Jadikanlah aku sebagai salah seorang pekerja upahanmu”, selaras dengan ayat 19. Teks SBLGNT mengakhiri kalimat ini pada “anakmu”.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Namun ... berkata
  rationale: δέ adalah penghubung ringan; “Namun” menandai peralihan yang kontras dengan tindakan sang ayah sebelumnya tanpa membuat pertentangannya terlalu kuat.
- source_word: ὁ υἱὸς αὐτῷ
  choice: anak itu berkata kepadanya
  rationale: Artikel pada υἱός wajar diterjemahkan “anak itu” dalam konteks cerita, sedangkan αὐτῷ dipertahankan sebagai “kepadanya” tanpa menggantinya secara interpretatif dengan “kepada ayahnya”.
- source_word: Πάτερ
  choice: Ayah
  rationale: Bentuk sapaan Πάτερ diterjemahkan langsung dan alami sebagai “Ayah”; kata “-ku” tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἥμαρτον
  choice: aku telah berdosa
  rationale: Aoristus ini secara idiomatis menyatakan pengakuan atas dosa yang telah dilakukan dan masih relevan pada saat berbicara.
- source_word: εἰς τὸν οὐρανὸν
  choice: terhadap surga
  rationale: Terjemahan ini mempertahankan ungkapan Yunani yang memakai “surga” sebagai cara penuh hormat untuk merujuk kepada Allah, tanpa langsung menggantinya dengan tafsiran “terhadap Allah”.
- source_word: καὶ ἐνώπιόν σου
  choice: dan di hadapanmu
  rationale: ἐνώπιον secara harfiah berarti “di hadapan” atau “dalam kehadiran”; pilihan ini mempertahankan nuansa relasionalnya dan tidak menyamakan frasa tersebut begitu saja dengan “terhadapmu”.
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: aku tidak layak lagi
  rationale: Susunan ini alami dalam bahasa Indonesia dan menyampaikan bahwa si anak kini menganggap dirinya tidak lagi pantas menyandang kedudukan tersebut.
- source_word: κληθῆναι υἱός σου
  choice: disebut anakmu
  rationale: Bentuk pasif κληθῆναι diterjemahkan “disebut”, dan υἱός σου secara alami menjadi “anakmu”, sehingga hubungan keluarga yang ia rasa tidak layak disandang tetap jelas.
theological_decisions:
- issue: Makna “surga” dalam pengakuan dosa
  choice: Mempertahankan “terhadap surga” sebagai ungkapan hormat yang merujuk kepada dosa terhadap Allah.
  alternative: Menerjemahkannya secara interpretatif sebagai “terhadap Allah”.
  rationale: Teks Yunani menyebut “surga”. Mempertahankan ungkapan itu menjaga bentuk sumber dan ketegangan idiomatisnya, sementara catatan kaki menerangkan maknanya.
- issue: Batas ucapan anak dalam ayat ini
  choice: Mengakhiri ucapannya pada “anakmu”, sesuai teks SBLGNT yang diberikan.
  alternative: Menambahkan “Jadikanlah aku sebagai salah seorang pekerja upahanmu”, seperti dalam bentuk bacaan yang lebih panjang dan Lukas 15:19.
  rationale: Teks sumber yang ditetapkan berakhir pada υἱός σου. Bacaan yang lebih panjang tidak dimasukkan ke teks utama, tetapi diberitahukan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Sapaan “Ayah” terdengar alami dalam pengakuan pribadi; “aku” sesuai dengan tuturan langsung dalam relasi keluarga. Ejaan “surga” dipakai sesuai bentuk baku kontemporer.
