  source_fidelity: Terjemahan dengan tepat menyampaikan ἐπεθύμει sebagai keinginan kuat yang berkelanjutan, γεμίσαι τὴν κοιλίαν sebagai gambaran konkret ‘mengisi perutnya’, κεράτια sebagai ‘polong karob’, tindakan imperfek babi yang sedang makan, dan penolakan/ketiadaan pemberian yang berkelanjutan dalam οὐδεὶς ἐδίδου αὐτῷ. ‘Dengan’ merupakan padanan idiomatis yang tepat untuk ἀπό dalam konstruksi ini.
  naturalness: Bahasa Indonesia modern, jelas, dan wajar. ‘Ia ingin sekali mengisi perutnya’ mempertahankan tekanan kelaparan tanpa menjadi kasar atau terlalu idiomatis. ‘Tidak seorang pun memberinya apa-apa’ juga alami dan jelas.
