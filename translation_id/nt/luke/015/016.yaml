id: LUK.15.16
reference: Luke 15:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: id
  text: Ia ingin sekali mengisi perutnya dengan polong karob yang dimakan babi-babi itu,[a] tetapi tidak seorang pun memberinya apa-apa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "polong"; istilah Yunani ini secara khusus menunjuk pada polong karob, yang lazim digunakan sebagai pakan ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: ingin sekali
  rationale: Bentuk imperfek menggambarkan keinginan kuat yang terus berlangsung; frasa ini alami dalam bahasa Indonesia dan tidak melebih-lebihkan maknanya.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: mengisi perutnya
  rationale: Mempertahankan gambaran jasmani yang konkret tentang kelaparan, alih-alih menafsirkannya sebagai sekadar 'memuaskan rasa lapar'.
- source_word: ἀπὸ τῶν κερατίων
  choice: dengan polong karob
  rationale: Dalam konstruksi dengan 'mengisi', kata 'dengan' merupakan padanan Indonesia yang wajar bagi bahan yang dipakai untuk mengisi; κεράτια secara khusus menunjuk pada polong pohon karob.
- source_word: ὧν ἤσθιον οἱ χοῖροι
  choice: yang dimakan babi-babi itu
  rationale: Menyampaikan tindakan yang sedang atau lazim berlangsung dalam adegan tersebut. Bentuk ulang 'babi-babi' secara alami menunjukkan jamak.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: tidak seorang pun memberinya apa-apa
  rationale: Imperfek menyiratkan bahwa pertolongan terus tidak diberikan; 'apa-apa' mengungkapkan objek yang tersirat secara idiomatis tanpa menentukan apa yang tidak diberikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Karob' dipertahankan demi ketepatan botanis, sedangkan catatan kaki membantu pembaca yang belum mengenal tanaman tersebut.
