  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: id
  text: Aku akan bangkit dan pergi kepada ayahku, dan aku akan berkata kepadanya, ‘Ayah, aku telah berdosa terhadap surga[a] dan di hadapanmu[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terhadap Allah”; di sini “surga” kemungkinan merupakan cara penuh hormat untuk merujuk kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam pandanganmu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Aku akan bangkit
  rationale: Partisip aoris ini menyatakan tindakan pertama dalam tekad si anak sebelum ia pergi. Bentuk finit dengan kala mendatang menghasilkan bahasa Indonesia yang alami sekaligus mempertahankan urutan tindakan.
- source_word: πορεύσομαι
  choice: pergi
  rationale: Verba ini menyatakan gerak menuju ayahnya; “pergi” paling jelas dan wajar tanpa menambahkan gagasan perjalanan panjang.
- source_word: πρὸς τὸν πατέρα μου
  choice: kepada ayahku
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang. “Kepada ayahku” sesuai dengan konteks kedatangan untuk berbicara langsung dengannya.
- source_word: ἐρῶ αὐτῷ
  choice: lalu berkata kepadanya
  rationale: Bentuk mendatang dari λέγω dengan objek tak langsung diterjemahkan secara alami. “Lalu” menandai urutan tindakan tanpa mengubah hubungan antarklausa.
- source_word: Πάτερ
  choice: Ayah
  rationale: Vokatif ini merupakan sapaan langsung kepada ayah kandung. “Ayah” alami dalam bahasa Indonesia modern dan tidak menambahkan kata milik yang tidak terdapat dalam bentuk Yunani ini.
- source_word: ἥμαρτον
  choice: aku telah berdosa
  rationale: Aoris menyatakan pengakuan atas dosa yang telah dilakukan dan masih relevan pada saat ia berbicara. “Telah berdosa” cocok dengan rumusan pengakuan dalam bahasa Indonesia.
- source_word: εἰς τὸν οὐρανὸν
  choice: terhadap surga
  rationale: Terjemahan ini mempertahankan kata sumber “surga”, yang kemungkinan berfungsi sebagai ungkapan hormat untuk Allah, tanpa menggantinya secara interpretatif dalam teks utama.
- source_word: ἐνώπιόν σου
  choice: di hadapanmu
  rationale: ἐνώπιον dengan genitif berarti “di hadapan” atau “dalam pandangan”. Pilihan ini mempertahankan ungkapan sumber dan tidak menyamakannya begitu saja dengan frasa sebelumnya.
theological_decisions:
- issue: Apakah “surga” harus dijelaskan langsung sebagai “Allah” dalam teks utama
  choice: 'Mempertahankan “surga”: “aku telah berdosa terhadap surga”'
  alternative: “aku telah berdosa terhadap Allah”
  rationale: οὐρανός kemungkinan merupakan ungkapan hormat yang merujuk kepada Allah, tetapi mempertahankan “surga” menjaga bentuk ungkapan Yunani dan ambiguitasnya. Maknanya dijelaskan dalam catatan kaki.
- issue: Hubungan frasa ἐνώπιόν σου dengan pengakuan dosa
  choice: “dan di hadapanmu”
  alternative: “dan terhadapmu”
  rationale: Teks Yunani membedakan εἰς pada frasa pertama dari ἐνώπιον pada frasa kedua. Terjemahan “di hadapanmu” mempertahankan perbedaan itu dan tidak memaksakan kedua frasa menjadi objek dosa yang identik.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Bangkit” mempertahankan gerak konkret sekaligus tekad untuk bertindak; “ayah” dipakai untuk orang tua manusia, sedangkan “surga” mengikuti ejaan baku modern. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskan.
