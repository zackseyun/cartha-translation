  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: id
  text: Namun, ketika ia sadar[a], ia berkata, “Berapa banyak pekerja upahan ayahku yang mempunyai roti lebih dari cukup[b], sedangkan aku di sini binasa karena kelaparan[c]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ketika ia datang kepada dirinya sendiri”; atau “ketika ia sadar kembali.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mempunyai roti berlimpah-limpah” atau “mempunyai roti lebih dari yang mereka perlukan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “mati karena kelaparan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: ketika ia sadar akan keadaannya
  rationale: Ungkapan Yunani ini secara harfiah berarti ‘datang kepada dirinya sendiri’ dan menunjuk pada kembalinya kesadaran diri atau munculnya kesadaran yang jernih. Ungkapan Indonesia yang dipilih menyampaikan idiom itu secara alami tanpa menambahkan gagasan pertobatan yang tidak dinyatakan secara eksplisit.
- source_word: ἔφη
  choice: ia berkata
  rationale: Bentuk aoristus berfungsi sebagai verba naratif dan wajar diterjemahkan dengan bentuk sederhana ‘ia berkata’.
- source_word: μίσθιοι
  choice: pekerja upahan
  rationale: Kata ini menunjuk kepada orang yang bekerja untuk mendapat upah, bukan budak atau hamba rumah tangga.
- source_word: περισσεύονται ἄρτων
  choice: mempunyai roti lebih dari cukup
  rationale: περισσεύονται menyatakan kelimpahan atau kelebihan, sedangkan ἄρτων mempertahankan gambaran konkret tentang roti.
- source_word: ἄρτων
  choice: roti
  rationale: Istilah konkret dalam bahasa Yunani dipertahankan dan tidak digeneralisasi menjadi ‘makanan’.
- source_word: λιμῷ
  choice: karena kelaparan
  rationale: Dalam konteks ini λιμός menunjuk pada keadaan lapar berat atau kelaparan sebagai penyebab kebinasaannya, bukan terutama pada bencana kelaparan secara umum.
- source_word: ὧδε
  choice: di sini
  rationale: Keterangan ini menegaskan kontras antara keadaan si anak sekarang dan kelimpahan di rumah ayahnya.
- source_word: ἀπόλλυμαι
  choice: binasa
  rationale: Pilihan ini mempertahankan keluasan makna verba yang dapat menyatakan kehancuran atau kematian, sekaligus mencerminkan keadaan yang sedang berlangsung dalam konteks.
theological_decisions:
- issue: Apakah kesadaran si anak harus dinyatakan sebagai pertobatan?
  choice: Tidak menambahkan istilah ‘bertobat’; menerjemahkan idiom sebagai kesadaran akan keadaannya.
  alternative: ketika ia bertobat
  rationale: Ayat ini menggambarkan perubahan kesadaran, tetapi tidak memakai istilah Yunani khusus untuk pertobatan. Terjemahan tidak boleh menyelesaikan implikasi teologis narasi secara lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Pekerja upahan’ membedakan μίσθιοι dari budak atau hamba, sedangkan ‘binasa’ mempertahankan bobot dan keluasan ἀπόλλυμαι meskipun sedikit lebih tinggi ragamnya daripada bahasa percakapan.
