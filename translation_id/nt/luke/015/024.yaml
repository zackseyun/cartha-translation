id: LUK.15.24
reference: Luke 15:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: id
  text: sebab anakku ini tadinya mati dan hidup kembali[a]; ia tadinya hilang dan telah ditemukan[b]. Lalu mulailah mereka bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi hidup kembali.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ditemukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan sang ayah bagi perayaan itu; bentuk ini alami dan bermartabat dalam konteks ujaran langsung.
- source_word: οὗτος ὁ υἱός μου
  choice: anakku ini
  rationale: Mempertahankan penekanan demonstratif οὗτος sekaligus memakai susunan kata Indonesia yang alami.
- source_word: νεκρὸς ἦν
  choice: tadinya mati
  rationale: Menunjukkan keadaan sebelumnya yang kini telah berubah tanpa melunakkan gambaran tajam tentang kematian.
- source_word: ἀνέζησεν
  choice: hidup kembali
  rationale: Menyampaikan arti hidup lagi secara ringkas dan alami serta mempertahankan pasangan mati/hidup.
- source_word: ἦν ἀπολωλὼς
  choice: tadinya hilang
  rationale: Mempertahankan motif hilang/ditemukan yang berulang dalam pasal ini dan menunjukkan keadaan lampau.
- source_word: εὑρέθη
  choice: telah ditemukan
  rationale: Mempertahankan bentuk pasif dan hasil yang masih relevan bagi perayaan, tanpa menentukan siapa pelakunya.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: mulailah mereka bersukacita
  rationale: Menjaga aspek ingresif ἤρξαντο dan menyatakan kegembiraan meriah dalam register Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Daya metaforis bahasa mati dan hidup kembali dalam perumpamaan
  choice: Mempertahankan istilah mati dan hidup kembali tanpa parafrasa penjelas.
  alternative: Mengalihkannya menjadi ungkapan eksplisit tentang keterasingan dan pemulihan rohani atau sosial.
  rationale: Teks sengaja memakai bahasa kematian dan kehidupan yang kuat untuk pemulihan sang anak. Terjemahan tidak boleh menuntaskan ketegangan metaforis itu secara diam-diam.
- issue: Pelaku dalam εὑρέθη
  choice: 'Mempertahankan bentuk pasif: telah ditemukan.'
  alternative: Menentukan pelaku, misalnya ditemukan oleh ayahnya atau ditemukan oleh Allah.
  rationale: Bahasa Yunani tidak menyebutkan pelaku; bentuk pasif mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pengulangan “tadinya” memperjelas kontras keadaan dahulu dengan keadaan kini; “bersukacita” mempertahankan nuansa kegembiraan perayaan tanpa menjadi terlalu sehari-hari.
