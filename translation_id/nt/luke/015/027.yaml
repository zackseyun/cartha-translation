  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: id
  text: Ia menjawab, “Saudaramu sudah pulang, dan ayahmu telah menyembelih anak sapi yang digemukkan itu, karena ia menerima dia kembali dengan selamat dan sehat.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam keadaan sehat.” Kata Yunani ὑγιαίνοντα dapat berarti “sehat” atau, dalam konteks ini, secara lebih luas “selamat dan sehat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: sudah pulang
  rationale: 'Dalam konteks kepulangan anak kepada keluarganya, ungkapan ini menyampaikan kedatangan yang telah terjadi dengan hasil kini: adiknya sudah berada di rumah.'
- source_word: ἔθυσεν
  choice: telah menyembelih
  rationale: Kata ini menunjuk pada penyembelihan hewan untuk jamuan; pilihan ini tepat tanpa menyiratkan bahwa tindakan tersebut merupakan kurban ritual.
- source_word: τὸν μόσχον τὸν σιτευτόν
  choice: anak sapi yang digemukkan itu
  rationale: Frasa ini menunjuk pada anak sapi tertentu yang sengaja digemukkan dan disiapkan untuk perayaan.
- source_word: ὑγιαίνοντα
  choice: dalam keadaan sehat dan selamat
  rationale: Partisip ini secara harfiah dapat berarti sehat atau berada dalam keadaan baik; dalam konteks kepulangan, frasa ini secara alami mencakup keadaan sehat dan selamat tanpa menghapus arti yang lebih sempit.
- source_word: ἀπέλαβεν
  choice: mendapatkannya kembali
  rationale: Kata ini membawa nuansa memperoleh atau menerima kembali seseorang yang sebelumnya pergi.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: Ia menjawab,
  rationale: δέ bersifat penghubung ringan, sedangkan ὅτι memperkenalkan ucapan langsung; bentuk ini alami dalam bahasa Indonesia dan sesuai dengan alur dialog.
