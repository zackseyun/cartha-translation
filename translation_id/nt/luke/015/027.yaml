  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Pronomina “ia” dipertahankan; konteks menunjukkan bahwa pelayanlah yang berbicara dan ayahlah yang mendapatkan anaknya kembali.
