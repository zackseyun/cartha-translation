id: LUK.9.4
reference: Luke 9:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν οἰκίαν εἰσέλθητε, ἐκεῖ μένετε καὶ ἐκεῖθεν ἐξέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: id
  text: Rumah mana pun yang kalian masuki, tinggallah di sana sampai kalian berangkat dari tempat itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: Rumah mana pun yang
  rationale: Mengungkapkan konstruksi relatif tak tentu secara alami dalam bahasa Indonesia tanpa mengubah cakupannya.
- source_word: ἐκεῖ μένετε
  choice: tinggallah di sana
  rationale: Imperatif μένετε menyatakan perintah untuk tetap tinggal; bentuk ini wajar dan jelas dalam bahasa Indonesia.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: sampai kalian berangkat dari tempat itu
  rationale: ἐκεῖθεν berarti 'dari sana/tempat itu' dan ἐξέρχεσθε berarti 'keluar/pergi'. Penambahan 'sampai' memperjelas hubungan idiomatis bahwa rumah tersebut menjadi tempat tinggal tetap hingga keberangkatan, tanpa mengubah maksud perintah.
theological_decisions:
- issue: Apakah perintah ini melarang berpindah-pindah rumah selama berada di suatu tempat
  choice: Terjemahan mempertahankan implikasi untuk tinggal di rumah yang pertama hingga berangkat dari tempat itu.
  alternative: 'Terjemahan harfiah: ''tinggallah di sana dan keluarlah dari sana.'''
  rationale: Dalam konteks pengutusan, pengulangan ἐκεῖ/ἐκεῖθεν mengarahkan para murid agar menjadikan rumah yang dimasuki sebagai pangkalan sampai keberangkatan; rumusan Indonesia dibuat alami tanpa menambahkan alasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'kalian' dipakai karena verba Yunani berbentuk jamak dan Yesus sedang berbicara kepada kedua belas murid.
