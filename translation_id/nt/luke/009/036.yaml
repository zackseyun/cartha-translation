  naturalness: '"Ketika suara itu terdengar" dan "Yesus didapati seorang diri" wajar dalam bahasa Indonesia baku bernada naratif. Pada bagian akhir, "tidak memberitahukan kepada siapa pun apa pun yang telah mereka lihat" lebih jelas dan lengkap daripada "tidak menceritakan kepada siapa pun apa yang telah mereka lihat," sambil tetap lancar.'
  terminology: Nama "Yesus," istilah "suara," dan ungkapan deskriptif "seorang diri" sudah tepat. Catatan kaki mempertahankan alternatif yang sah tanpa memaksakan penafsiran teologis.
