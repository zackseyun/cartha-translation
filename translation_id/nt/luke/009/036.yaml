  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: id
  text: Ketika suara itu terdengar, Yesus didapati seorang diri.[a] Mereka pun tetap diam dan pada hari-hari itu tidak memberitahukan kepada siapa pun apa pun yang telah mereka lihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus saja yang tinggal” atau “hanya Yesus yang terlihat.” Secara harfiah, teks Yunani berbunyi, “Yesus didapati seorang diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Ketika suara itu terdengar
  rationale: Konstruksi ἐν dengan infinitif artikular menyatakan waktu. Secara harfiah suara itu 'terjadi'; dalam bahasa Indonesia, 'terdengar' secara alami menyatakan munculnya suara surgawi tersebut tanpa mengaburkan hubungan waktunya.
- source_word: φωνή
  choice: suara
  rationale: Dalam konteks ini φωνή menunjuk pada ucapan dari surga; 'suara' merupakan padanan langsung dan wajar.
- source_word: εὑρέθη
  choice: didapati
  rationale: Bentuk pasif aoris εὑρίσκω dipertahankan secara dekat dengan 'didapati', sehingga hasil adegan disampaikan tanpa menggantinya dengan tafsiran seperti 'terlihat' atau 'tinggal'.
- source_word: μόνος
  choice: seorang diri
  rationale: Ungkapan ini secara alami menyatakan bahwa Yesus berada tanpa Musa dan Elia, sekaligus mempertahankan fungsi predikatif μόνος.
- source_word: ἐσίγησαν
  choice: tetap diam
  rationale: Padanan ini menyampaikan bahwa para murid tidak berbicara mengenai pengalaman tersebut sesudah kejadian itu.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: tidak menceritakan kepada siapa pun
  rationale: ἀπαγγέλλω berarti memberitahukan atau melaporkan; 'menceritakan' sesuai dengan objek berupa apa yang mereka lihat dan terdengar alami dalam narasi Indonesia.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: pada hari-hari itu
  rationale: Terjemahan langsung dan idiomatis bagi keterangan waktu Yunani tersebut.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: apa yang telah mereka lihat
  rationale: Dalam kalimat negatif bahasa Indonesia, 'tidak ... apa yang telah mereka lihat' menyampaikan keseluruhan daya negatif Yunani tanpa susunan negatif ganda yang janggal.
theological_decisions:
- issue: Implikasi naratif kehadiran Yesus seorang diri setelah suara surgawi
  choice: Menerjemahkan secara deskriptif sebagai 'Yesus didapati seorang diri'
  alternative: Yesus saja yang tinggal / hanya Yesus yang terlihat
  rationale: Bunyi ayat melaporkan hasil kejadian tanpa menjelaskan makna teologisnya. Terjemahan deskriptif mempertahankan bentuk pasif dan tidak memasukkan penafsiran bahwa Yesus 'tinggal' atau bahwa sudut pandang visual para murid merupakan pokok utamanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Didapati' dipilih untuk menjaga kedekatan dengan bentuk pasif Yunani; catatan kaki memberi alternatif yang lebih interpretatif. Penanda catatan kaki ditempatkan langsung setelah klausa terkait.
