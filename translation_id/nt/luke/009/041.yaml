    issue: “harus bersama” menambahkan modalitas keharusan
    rationale: Kata ἔσομαι adalah bentuk masa depan dari “menjadi/berada,” bukan ungkapan kewajiban. Terjemahan perlu mempertahankan pertanyaan tentang berapa lama Yesus akan bersama mereka, tanpa menyiratkan bahwa Ia terpaksa harus bersama mereka.
