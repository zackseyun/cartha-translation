  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia pada teks Yunani. Bentuk jamak ὑμᾶς/ὑμῶν dipertahankan dengan “kalian,” dan bentuk tunggal υἱόν σου dengan “anakmu.” Namun, “harus bersama” menambahkan nuansa keharusan yang tidak dinyatakan oleh ἔσομαι (“Aku akan berada/bersama”).
  naturalness: Bahasa Indonesia modernnya jelas, lugas, dan bernada teguran. “Sampai kapan Aku akan bersama kalian” lebih langsung dan setia daripada “sampai kapan Aku harus bersama kalian.”
  terminology: “Generasi yang tidak percaya dan menyimpang” merupakan padanan yang dapat diterima bagi γενεὰ ἄπιστος καὶ διεστραμμένη. “Bersabar terhadap kalian” secara alami menyampaikan ἀνέξομαι ὑμῶν tanpa memaksakan penafsiran tambahan.
  issues:
