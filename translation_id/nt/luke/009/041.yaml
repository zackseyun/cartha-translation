id: LUK.9.41
reference: Luke 9:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: id
  text: Namun Yesus menjawab, “Hai generasi yang tidak percaya dan menyimpang, sampai kapan Aku akan bersama kalian dan bersabar terhadap kalian? Bawalah anakmu ke sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ ἄπιστος
  choice: generasi yang tidak percaya
  rationale: Menyampaikan arti langsung ἄπιστος sebagai tidak beriman atau tidak percaya, dengan 'generasi' sebagai padanan alami γενεά dalam teguran kepada orang-orang sezaman.
- source_word: διεστραμμένη
  choice: menyimpang
  rationale: Kata ini secara harfiah menggambarkan sesuatu yang telah dibengkokkan dan secara moral berarti sesat atau menyimpang; 'menyimpang' mempertahankan daya tegur tanpa terdengar janggal.
- source_word: ἀνέξομαι ὑμῶν
  choice: bersabar terhadap kalian
  rationale: Ungkapan ini berarti menanggung atau bersabar menghadapi seseorang. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan nada keluhan Yesus.
- source_word: προσάγαγε ὧδε
  choice: Bawalah ... ke sini
  rationale: Imperatif aoristus tunggal meminta sang ayah membawa anaknya mendekat kepada Yesus.
theological_decisions:
- issue: Cakupan teguran 'generasi yang tidak percaya dan menyimpang'
  choice: Tidak menentukan secara eksplisit apakah teguran hanya ditujukan kepada para murid, orang banyak, atau seluruh generasi itu.
  alternative: Menambahkan sasaran tertentu seperti 'kalian, murid-murid yang tidak percaya'.
  rationale: Bentuk sapaan Yunani bersifat luas dan konteks memungkinkan beberapa lapisan sasaran; terjemahan sebaiknya mempertahankan ketegangan tersebut.
- issue: Nuansa pertanyaan retoris Yesus
  choice: Mempertahankan dua pertanyaan/keluhan tentang kebersamaan dan kesabaran tanpa menjelaskan motifnya.
  alternative: Memparafrasakan sebagai pernyataan bahwa kesabaran Yesus hampir habis.
  rationale: Teks menyuarakan ratapan dan teguran, tetapi tidak menyatakan bahwa kesabaran Yesus benar-benar berakhir.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Hai' mempertahankan seruan Ὦ; 'kalian' dipakai karena ὑμᾶς/ὑμῶν berbentuk jamak, sedangkan 'anakmu' tetap tunggal karena perintah ditujukan kepada ayah anak itu.
