  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: id
  text: 'Semua orang takjub atas kebesaran Allah.[a] Namun, sementara semua orang kagum akan segala sesuatu yang sedang dilakukan Yesus, Ia berkata kepada murid-murid-Nya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keagungan Allah.” Kata Yunani μεγαλειότης dapat berarti kebesaran, keagungan, atau kemegahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: takjub
  rationale: Mengungkapkan rasa heran yang kuat dan berkelanjutan dalam bentuk Indonesia yang alami; dibedakan dari θαυμαζόντων dengan pilihan 'kagum' pada klausa berikutnya.
- source_word: πάντες
  choice: semua orang
  rationale: Mempertahankan cakupan universal subjek secara jelas dan wajar dalam bahasa Indonesia.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: melihat kebesaran Allah
  rationale: ἐπί dengan datif menyatakan dasar atau objek ketakjuban. 'Kebesaran' mencakup makna μεγαλειότης berupa keagungan, kemegahan, atau kebesaran; 'melihat' membuat hubungan itu alami tanpa menyatakan bahwa kata tersebut ada secara eksplisit dalam bahasa Yunani.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Namun, sementara mereka semua kagum
  rationale: Genitif absolut diterjemahkan sebagai klausa temporal. 'Kagum' menjaga perbedaan nuansa dari ἐξεπλήσσοντο yang diterjemahkan 'takjub'.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: akan segala sesuatu yang sedang dilakukan Yesus
  rationale: Mempertahankan objek kekaguman dan aspek imperfektif ἐποίει melalui 'sedang dilakukan'. Nama 'Yesus' dipakai untuk memperjelas rujukan pelaku dalam bahasa Indonesia.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ia berkata kepada murid-muridnya
  rationale: Ungkapan naratif yang langsung, alami, dan setia pada struktur sumber.
theological_decisions:
- issue: Rujukan subjek tersirat dalam οἷς ἐποίει dan εἶπεν
  choice: Pelaku tindakan adalah Yesus; pada klausa pertama namanya dinyatakan, lalu digunakan 'ia'.
  alternative: Memakai 'ia' pada kedua klausa dan membiarkan rujukannya sepenuhnya tersirat.
  rationale: Konteks naratif menunjuk kepada Yesus sebagai pelaku dan pembicara, sedangkan tindakan-tindakannya menampilkan kebesaran Allah. Terjemahan tidak menyamakan Allah dan Yesus ataupun memisahkan karya Yesus dari kuasa Allah.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. 'Takjub' dan 'kagum' dipakai untuk mencerminkan dua verba Yunani yang berbeda. Bentuk 'Allah' mengikuti register Alkitab bahasa Indonesia. Tanda koma penutup mempertahankan kesinambungan menuju perkataan Yesus pada ayat berikutnya.
