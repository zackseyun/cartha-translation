  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Tetapi menurut kalian, siapakah aku ini?” Petrus menjawab, “Mesias dari Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kristus dari Allah.”'
    reason: Alternatif leksikal tradisional untuk χριστός.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kalian
  rationale: Kata ganti orang kedua jamak ini dinyatakan secara eksplisit dan bersifat kontras. “Kalian” menunjukkan bentuk jamak secara alami dalam bahasa Indonesia modern, sedangkan “tetapi” menyampaikan kontrasnya.
- source_word: τίνα με λέγετε εἶναι
  choice: menurut kalian, siapakah aku ini?
  rationale: Ungkapan ini menyampaikan pertanyaan tentang siapa Yesus menurut pengakuan para murid. Susunan tersebut alami dalam bahasa Indonesia dan mempertahankan fokus pada identitasnya.
- source_word: ἀποκριθεὶς εἶπεν
  choice: menjawab
  rationale: Gabungan partisip aoris dan verba finit ini secara idiomatis dinyatakan dengan satu verba, “menjawab”, tanpa menghilangkan maknanya.
- source_word: χριστόν
  choice: Mesias
  rationale: Di sini χριστός berfungsi sebagai gelar, bukan nama diri. “Mesias” menyampaikan gelar yang diharapkan dalam kerangka Israel dan lebih mudah dipahami pembaca umum daripada sekadar transliterasi Yunani.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: Terjemahan ini mempertahankan hubungan genitif dalam frasa Yunani tanpa menentukan lebih jauh jenis hubungannya.
- source_word: δέ
  choice: Lalu / Tetapi
  rationale: δέ pertama berfungsi sebagai penghubung wacana dan diterjemahkan “Lalu”; δέ kedua menandai kontras antara pendapat orang banyak dan pengakuan para murid sehingga diterjemahkan “Tetapi”.
theological_decisions:
- issue: Penerjemahan χριστός dalam pengakuan Petrus
  choice: Mesias
  alternative: Kristus
  rationale: χριστός merupakan gelar yang mengidentifikasi Yesus sebagai tokoh yang diurapi dan dinantikan. Gelar itu diterjemahkan sebagai “Mesias”, sementara bentuk tradisional “Kristus” dicantumkan sebagai alternatif dalam catatan kaki.
- issue: Hubungan genitif dalam τοῦ θεοῦ
  choice: dari Allah
  alternative: milik Allah
  rationale: “Dari Allah” mempertahankan rumusan ringkas dan ketegangan frasa sumber tanpa mempersempitnya menjadi kepemilikan, pengutusan, atau pengurapan secara eksklusif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menunjukkan bahwa sapaan itu jamak; kata ganti “aku” tidak diberi kapitalisasi khusus agar mengikuti ejaan umum dan tidak memasukkan konvensi teologis editorial ke dalam teks.
