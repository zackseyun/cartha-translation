  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: id
  text: Herodes, sang tetrark, mendengar tentang semua yang sedang terjadi, dan ia bingung karena beberapa orang mengatakan bahwa Yohanes telah dibangkitkan dari antara orang mati,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤκουσεν
  choice: mendengar tentang
  rationale: Objeknya adalah seluruh peristiwa yang sedang berlangsung; ‘mendengar tentang’ secara alami menyatakan bahwa Herodes menerima kabar mengenai peristiwa-peristiwa itu.
- source_word: δὲ
  choice: pun
  rationale: δέ merupakan penghubung naratif ringan. ‘Pun’ menjaga kesinambungan cerita tanpa memberi kesan pertentangan yang kuat atau menambahkan penanda waktu yang tidak ada.
- source_word: ὁ τετραάρχης
  choice: sang tetrark
  rationale: ‘Tetrark’ mempertahankan gelar politik-historis yang khusus, sedangkan ‘sang’ menandai gelar Herodes secara wajar dalam bahasa Indonesia.
- source_word: τὰ γινόμενα πάντα
  choice: segala sesuatu yang sedang terjadi
  rationale: Ungkapan ini mempertahankan cakupan πάντα dan aspek berlangsung dari γινόμενα dalam bahasa Indonesia yang alami.
- source_word: διηπόρει
  choice: bingung
  rationale: Kata ini menyatakan keadaan bimbang atau tidak tahu harus menyimpulkan apa; ‘bingung’ jelas dan alami bagi pembaca modern.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: karena beberapa orang mengatakan
  rationale: Konstruksi ini menyatakan sebab. Bentuk aktif alami dalam bahasa Indonesia tetap mempertahankan pelaku yang tidak ditentukan secara khusus, yaitu ‘beberapa orang’.
- source_word: ἠγέρθη
  choice: telah dibangkitkan
  rationale: Bentuk pasif dipertahankan, dan ‘telah’ menunjukkan bahwa kebangkitan yang dilaporkan dipandang sudah terjadi sebelum kebingungan Herodes.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Terjemahan ini mempertahankan nuansa harfiah bahwa Yohanes dikatakan dibangkitkan keluar dari kumpulan orang mati dan tetap dapat dipahami secara alami.
theological_decisions:
- issue: Rumusan kebangkitan dalam laporan tentang Yohanes
  choice: telah dibangkitkan dari antara orang mati
  alternative: telah bangkit dari antara orang mati
  rationale: Bahasa Yunani memakai bentuk pasif ἠγέρθη. Terjemahan mempertahankan bentuk pasif tersebut tanpa mengubahnya menjadi ungkapan intransitif aktif atau menentukan pelaku yang membangkitkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Gelar historis ‘tetrark’ dipertahankan; struktur kalimat dipecah menjadi dua agar alami tanpa menghilangkan hubungan naratif dan kausal.
