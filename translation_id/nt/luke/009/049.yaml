  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: id
  text: Lalu Yohanes berkata, “Guru, kami melihat seseorang mengusir setan-setan dalam nama-Mu, dan kami berusaha mencegahnya karena ia tidak berjalan bersama kami.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena ia tidak mengikuti kami.” Secara lebih harfiah, teks Yunani berbunyi “bersama kami,” yang dapat menekankan bahwa orang itu tidak termasuk dalam rombongan para murid.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Lalu Yohanes berkata
  rationale: Ungkapan ini berfungsi sebagai peralihan naratif dan tanggapan dalam percakapan. Dalam bahasa Indonesia alami, “Lalu ... berkata” menyampaikan alur tersebut tanpa terjemahan kaku “menjawab dan berkata.”
- source_word: Ἐπιστάτα
  choice: Guru
  rationale: Dalam Injil Lukas, sapaan ini mengakui kewibawaan dan kepemimpinan Yesus. “Guru” merupakan sapaan Indonesia yang alami dan bermartabat, meski tidak membatasi peran Yesus pada kegiatan mengajar saja dalam konteksnya.
- source_word: εἴδομέν τινα
  choice: kami melihat seseorang
  rationale: τινα bersifat tak tentu; “seseorang” mempertahankan ketidaktentuan itu secara alami.
- source_word: ἐν τῷ ὀνόματί σου
  choice: dalam nama-Mu
  rationale: Ungkapan ini mempertahankan idiom sumber tentang tindakan yang dilakukan dengan bersandar pada nama atau kewibawaan Yesus, tanpa menjabarkan maknanya secara berlebihan.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: mengusir setan-setan
  rationale: “Mengusir” adalah padanan Indonesia yang jelas dan lazim untuk ἐκβάλλω dalam konteks pengusiran roh jahat; bentuk jamak δαιμόνια dipertahankan.
- source_word: ἐκωλύομεν αὐτόν
  choice: kami berusaha mencegahnya
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang berlangsung atau berupa upaya. “Berusaha mencegahnya” menyampaikan nuansa konatif yang sesuai dengan konteks, tanpa menyatakan bahwa upaya itu pasti berhasil.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: karena ia tidak mengikut bersama kami
  rationale: μεθ’ ἡμῶν secara eksplisit berarti “bersama kami.” Rumusan ini mempertahankan fokus keluhan pada ketidakikutsertaan orang itu dalam rombongan para murid, dan tidak mengubahnya menjadi pernyataan pasti bahwa ia menolak mengikuti Yesus.
theological_decisions:
- issue: Ambiguitas mengenai kesetiaan dan keanggotaan kelompok dalam keluhan Yohanes
  choice: karena ia tidak mengikut bersama kami
  alternative: karena ia tidak mengikuti kami
  rationale: Teks Yunani memakai μετά dengan bentuk genitif, “bersama kami.” Terjemahan utama mempertahankan unsur kebersamaan itu agar tidak menyiratkan secara berlebihan bahwa orang tersebut menolak Yesus atau bahwa para murid sendiri merupakan objek utama yang wajib diikuti.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti ilahi “-Mu” ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Rumusan “mengikut bersama kami” sengaja sedikit lebih formal daripada percakapan sehari-hari untuk mempertahankan unsur “bersama” dalam teks Yunani; catatan kaki menyediakan alternatif yang lebih idiomatis.
