id: LUK.9.35
reference: Luke 9:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: id
  text: Lalu terdengarlah suara dari awan itu[a] yang berkata, “Inilah Anak-Ku, Yang Terpilih; dengarkanlah Dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “Anak-Ku yang Kukasihi” dan bukan “Anak-Ku, Yang Terpilih.”
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: terdengarlah suara
  rationale: Ungkapan Yunani ini menyatakan munculnya suara dalam peristiwa tersebut. “Terdengarlah suara” alami dalam narasi Indonesia dan menghindari terjemahan harfiah yang kaku seperti “suara menjadi ada”.
- source_word: ἐκ τῆς νεφέλης
  choice: dari awan itu
  rationale: ἐκ menunjukkan sumber atau asal. Kata penunjuk “itu” secara alami mencerminkan artikel Yunani dan menunjuk kepada awan yang sudah hadir dalam konteks.
- source_word: λέγουσα
  choice: yang berkata
  rationale: Partisipel ini memperkenalkan isi suara. Klausa relatif merupakan bentuk yang alami dalam bahasa Indonesia.
- source_word: Οὗτός ἐστιν
  choice: Inilah
  rationale: “Inilah” menyampaikan fungsi identifikasi dari demonstrativa dan kopula secara ringkas serta idiomatis.
- source_word: ὁ υἱός μου
  choice: Anak-Ku
  rationale: Menyampaikan nomina dengan pronomina posesif secara langsung. Huruf kapital menandai pemakaiannya sebagai gelar kristologis dalam konteks ini.
- source_word: ὁ ἐκλελεγμένος
  choice: Yang Terpilih
  rationale: Partisipel pasif perfek dari ἐκλέγομαι menyatakan pribadi yang telah dipilih dan tetap berstatus sebagai yang dipilih. “Yang Terpilih” mempertahankan bentuk gelar dan tidak mencampurkannya dengan varian tekstual “yang Kukasihi”.
- source_word: αὐτοῦ ἀκούετε
  choice: dengarkanlah Dia
  rationale: Dalam konteks perintah, ἀκούω berarti mendengarkan dengan perhatian dan mengindahkan. Bentuk “dengarkanlah” menyampaikan daya imperatif secara alami.
theological_decisions:
- issue: Sebutan kristologis dalam suara dari awan memiliki varian tekstual
  choice: Mengikuti ἐκλελεγμένος sebagai “Yang Terpilih”
  alternative: “Anak-Ku yang Kukasihi” berdasarkan bacaan ἀγαπητός dalam sejumlah naskah
  rationale: Teks SBLGNT yang diberikan memakai ἐκλελεγμένος. Terjemahan utama mempertahankan kekhasan redaksi Lukas dan tidak menyelaraskannya dengan ungkapan yang lebih dikenal dari Injil-Injil Sinoptik lainnya; varian penting tetap dicatat dalam catatan kaki.
- issue: Hubungan antara “Anak-Ku” dan “Yang Terpilih”
  choice: 'Mempertahankan kedua sebutan dalam aposisi: “Anak-Ku, Yang Terpilih”'
  alternative: “Anak-Ku yang terpilih”
  rationale: Aposisi mempertahankan bobot kedua sebutan dalam teks Yunani tanpa menambahkan pronomina posesif kedua yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel “-lah” dipakai untuk menjaga kelancaran narasi dan ketegasan perintah tanpa menghasilkan gaya yang terlalu arkais.
