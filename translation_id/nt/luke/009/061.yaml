id: LUK.9.61
reference: Luke 9:61
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: id
  text: Seorang lain juga berkata, “Aku akan mengikut Engkau, Tuhan, tetapi izinkanlah aku lebih dahulu berpamitan kepada orang-orang di rumahku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: Seorang lain juga berkata
  rationale: Ungkapan ini menambahkan seorang pembicara lain dalam rangkaian percakapan. Susunan ini mempertahankan daya penghubung dan penambahnya secara wajar dalam bahasa Indonesia.
- source_word: Ἀκολουθήσω σοι
  choice: Aku akan mengikut Engkau
  rationale: Bentuk futur menyatakan niat pembicara. “Akan mengikut” merupakan ungkapan alami dan tetap mempertahankan sifat pernyataan tekadnya.
- source_word: κύριε
  choice: Tuhan
  rationale: Dalam sapaan kepada Yesus, “Tuhan” mempertahankan baik unsur penghormatan maupun kemungkinan bobot teologisnya tanpa membatasinya menjadi sekadar “Tuan” atau “Guru”.
- source_word: πρῶτον
  choice: lebih dahulu
  rationale: Keterangan ini menyatakan prioritas. “Lebih dahulu” alami dalam permintaan berbahasa Indonesia dan sepadan dengan “pertama-tama” dalam konteks ini.
- source_word: ἐπίτρεψόν μοι
  choice: izinkanlah aku
  rationale: Imperatif aoris ini berupa permohonan izin. “Izinkanlah aku” jelas, sopan, dan sesuai dengan sapaan kepada Yesus.
- source_word: ἀποτάξασθαι
  choice: berpamitan
  rationale: Infinitif medial ini berarti meminta diri atau mengucapkan selamat tinggal. “Berpamitan” ringkas dan idiomatis dalam bahasa Indonesia.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: kepada orang-orang di rumahku
  rationale: Frasa yang secara tidak biasa memakai εἰς merujuk kepada orang-orang yang berada di atau terkait dengan rumah pembicara. Terjemahan ini mempertahankan rujukan kepada orang, tanpa mempersempitnya secara pasti menjadi keluarga atau seisi rumah.
theological_decisions:
- issue: Terjemahan κύριε sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: “Tuhan” mempertahankan rentang makna sapaan ini dalam Injil Lukas, dari penghormatan sampai pengakuan yang berbobot teologis, tanpa menyelesaikan ketegangan itu ke arah sapaan yang semata-mata sosial.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina “Aku” dan “Engkau” memakai kapital untuk sapaan kepada Yesus sesuai kebiasaan umum penerbitan Alkitab Indonesia; kapitalisasi ini tidak dimaksudkan untuk menambahkan penafsiran yang tidak terdapat dalam bahasa Yunani.
