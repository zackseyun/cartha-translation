id: LUK.9.58
reference: Luke 9:58
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: id
  text: Yesus berkata kepadanya, “Rubah mempunyai liang, dan burung-burung di langit mempunyai sarang, tetapi Anak Manusia tidak mempunyai tempat untuk meletakkan kepala-Nya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “Anak Manusia” yang dipakai Yesus untuk diri-Nya mungkin menggemakan Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: rubah
  rationale: Istilah hewan ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: φωλεοὺς
  choice: liang
  rationale: Menunjuk pada tempat berlindung atau kediaman hewan; “liang” merupakan padanan alami bagi tempat tinggal rubah.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: Menyampaikan gambaran harfiah burung-burung yang berada di langit dengan ungkapan Indonesia yang alami.
- source_word: κατασκηνώσεις
  choice: sarang
  rationale: Secara umum berarti tempat menetap atau bernaung; dalam konteks burung, “sarang” adalah padanan yang paling alami.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan sebutan diri Yesus yang telah dikenal serta kemungkinan gaung Daniel 7 tanpa memparafrasekan atau mempersempit maknanya.
- source_word: οὐκ ἔχει ποῦ
  choice: tidak mempunyai tempat
  rationale: Menyatakan idiom negatif Yunani secara jelas dan alami tanpa mengubah maksudnya.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: untuk meletakkan kepala-Nya
  rationale: Mempertahankan gambaran konkret Yunani tentang tidak adanya tempat untuk beristirahat.
- source_word: δὲ
  choice: tetapi
  rationale: Menandai kontras antara tempat bernaung yang dimiliki hewan dan ketiadaan tempat bagi Anak Manusia.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Yesus berkata kepadanya
  rationale: Terjemahan langsung dan alami untuk pengantar perkataan dalam narasi.
theological_decisions:
- issue: Penerjemahan sebutan diri Yesus υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: “Anak Manusia” mempertahankan bentuk ungkapan sumber, tradisi istilah Indonesia, dan kemungkinan resonansi mesianik-apokaliptik tanpa menetapkan satu penafsiran saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan kontras dan gambaran konkret teks Yunani. Penanda catatan kaki ditempatkan setelah kalimat yang memuat sebutan terkait.
