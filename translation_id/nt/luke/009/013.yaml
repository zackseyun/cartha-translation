  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: id
  text: Tetapi Yesus berkata kepada mereka, “Kalian sendiri, beri mereka makan.” Mereka menjawab, “Kami hanya punya lima roti dan dua ikan—kecuali kalau kami sendiri pergi membeli makanan untuk seluruh orang banyak ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Kalianlah yang harus memberi mereka makan
  rationale: Susunan ini mengungkapkan perintah secara wajar dalam bahasa Indonesia sekaligus mempertahankan penekanan pada ὑμεῖς melalui partikel -lah. 'Memberi mereka makan' menyampaikan idiom Yunani tanpa terjemahan kaku.
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: Kami hanya punya
  rationale: Dalam klausa negatif ini, πλεῖον ἢ membatasi jumlah yang tersedia. 'Hanya punya' merupakan ungkapan Indonesia yang alami dan setara dengan makna 'tidak mempunyai lebih dari'.
- source_word: ἄρτοι πέντε
  choice: lima roti
  rationale: ἄρτοι menunjuk pada unit-unit roti. Dalam bahasa Indonesia, angka sudah menyatakan jumlah sehingga 'lima roti' alami dan cukup jelas.
- source_word: ἰχθύες δύο
  choice: dua ikan
  rationale: Padanan langsung dan alami bagi bentuk jamak Yunani dalam konteks ini.
- source_word: εἰ μήτι
  choice: kecuali kalau
  rationale: Mengungkapkan pengecualian bersyarat dan tetap membuka nuansa kemungkinan atau keberatan retoris dalam jawaban para murid.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: kami sendiri pergi membeli
  rationale: Partisip πορευθέντες secara alami dijadikan verba berurutan dalam bahasa Indonesia. 'Sendiri' mempertahankan penekanan pada ἡμεῖς.
- source_word: εἰς πάντα τὸν λαὸν τοῦτον
  choice: untuk seluruh orang banyak ini
  rationale: Dalam konteks kumpulan orang, λαός secara alami berarti 'orang banyak'; πάντα dan τοῦτον dipertahankan sebagai 'seluruh' dan 'ini'.
- source_word: βρώματα
  choice: makanan
  rationale: Padanan modern dan alami untuk bahan atau barang yang dimakan.
theological_decisions:
- issue: Nada perintah Yesus dan jawaban para murid
  choice: Pertukaran diterjemahkan secara langsung, dengan penekanan gramatikal pada pihak yang harus bertindak tetapi tanpa menambahkan teguran atau kejengkelan.
  alternative: Menerjemahkan perintah dengan nada lebih tajam atau jawaban murid sebagai keluhan yang jelas.
  rationale: Teks Yunani menekankan ὑμεῖς dan ἡμεῖς, tetapi tidak secara eksplisit menetapkan nada emosi yang lebih keras.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai karena Yesus berbicara kepada sekelompok murid; bentuk ini membedakan jamak secara alami. Tidak diperlukan catatan kaki karena penekanan pronominal dan makna λαός dapat disampaikan langsung dalam teks.
