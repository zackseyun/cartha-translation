  to: Tetapi Yesus berkata kepada mereka, “Kalian sendiri, beri mereka makan.” Mereka menjawab, “Kami hanya punya lima roti dan dua ikan—kecuali kalau kami sendiri pergi membeli makanan untuk seluruh orang banyak ini.”
