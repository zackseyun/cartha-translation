- from: Namun, Yesus berkata, “Tidak seorang pun yang sudah meletakkan tangannya pada bajak lalu menoleh ke belakang layak bagi Kerajaan Allah.”[a]
  to: Namun, Yesus berkata, “Tidak seorang pun yang telah memegang bajak dan menoleh ke belakang cocok bagi Kerajaan Allah.”[a]
  rationale: Revisi menghilangkan kesan urutan temporal yang tidak perlu, memakai ungkapan pertanian yang lebih alami, dan menerjemahkan εὔθετος dengan “cocok” agar makna kesesuaian dipertahankan tanpa mengimpor penilaian kelayakan moral atau kesimpulan tertentu tentang keselamatan. Catatan kaki tetap menyediakan alternatif “berguna.”
