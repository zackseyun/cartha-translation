    issue: Kata penghubung “lalu” memberi kesan urutan tindakan yang terlalu tegas.
    rationale: ἐπιβαλών adalah tindakan yang telah dilakukan, sedangkan βλέπων adalah tindakan/pola memandang ke belakang; teks tidak secara khusus menekankan bahwa menoleh baru terjadi sesudah tindakan itu selesai. “Dan” mempertahankan hubungan yang lebih netral.
  - severity: low
    issue: “Layak bagi” berpotensi dipahami terutama sebagai kelayakan moral.
    rationale: εὔθετος terutama menyatakan kesesuaian atau kegunaan bagi suatu tujuan. “Cocok bagi” lebih idiomatis dan mengurangi pengkhususan teologis yang tidak dinyatakan teks.
  - severity: low
    issue: “Meletakkan tangannya pada bajak” kurang alami sebagai gambaran kerja membajak.
    rationale: “Memegang bajak” merupakan ungkapan Indonesia yang lazim dan tetap menyampaikan tindakan mengambil kendali bajak untuk mulai membajak.
  revised_text: Namun, Yesus berkata, “Tidak seorang pun yang telah memegang bajak dan menoleh ke belakang cocok bagi Kerajaan Allah.”[a]
