  source_fidelity: 'Draf mempertahankan unsur-unsur utama teks Yunani: penyangkalan universal, tindakan awal pada bajak, perhatian ke belakang, dan kecocokan bagi Kerajaan Allah. Namun, “lalu menoleh” dapat menyiratkan urutan waktu yang lebih tegas daripada koordinasi partisip aoris dan partisip kini dalam bahasa Yunani. Penggantian dengan “dan menoleh” lebih dekat dengan gambaran seseorang yang telah mulai membajak tetapi mengarahkan pandangannya ke belakang.'
  naturalness: Bahasa draf umumnya modern dan jelas. “Memegang bajak” lebih wajar dalam bahasa Indonesia daripada “meletakkan tangannya pada bajak,” sambil tetap menyampaikan tindakan mengambil alat untuk membajak. “Cocok bagi” juga lebih langsung untuk εὔθετος daripada “layak bagi,” yang dalam bahasa Indonesia lebih mudah terdengar sebagai penilaian kelayakan moral.
  terminology: “Yesus,” “bajak,” dan “Kerajaan Allah” tepat dan sesuai register Alkitab Indonesia modern. “Cocok bagi Kerajaan Allah” mempertahankan makna kesesuaian tanpa menetapkan apakah yang dimaksud adalah masuk ke dalam kerajaan, pelayanan, atau keselamatan akhir.
  issues:
