base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: id
  text: Namun, Yesus berkata, “Tidak seorang pun yang telah memegang bajak dan menoleh ke belakang cocok bagi Kerajaan Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berguna bagi Kerajaan Allah.” Kata Yunaninya menyatakan kesesuaian atau kegunaan bagi suatu tujuan.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan yang bernuansa kontras dengan perkataan sebelumnya; ‘Namun’ alami dan bermartabat dalam bahasa Indonesia.
- source_word: Οὐδεὶς
  choice: Tidak seorang pun
  rationale: Mempertahankan cakupan universal dari pronomina negatif tanpa pembatasan gender.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: yang sudah meletakkan tangannya pada bajak
  rationale: Menggambarkan tindakan awal memegang atau menempatkan tangan pada bajak untuk mulai membajak. ‘Sudah’ menyatakan tindakan yang mendahului kegiatan menoleh, tanpa menghilangkan citra pertanian.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: lalu menoleh ke belakang
  rationale: Mengungkapkan perhatian yang diarahkan ke belakang dalam citra orang yang sedang membajak. ‘Menoleh’ lebih konkret daripada ‘melihat’ dan tidak sekuat ‘berbalik’, sehingga tidak menambahkan gagasan meninggalkan pekerjaan sepenuhnya.
- source_word: εὔθετός
  choice: layak
  rationale: Dalam konteks ini berarti sesuai, cocok, atau berguna bagi suatu tujuan. ‘Layak bagi’ alami dalam bahasa Indonesia, tetapi dapat disalahpahami sebagai kelayakan moral; karena itu alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: bagi Kerajaan Allah
  rationale: Dativus bersama εὔθετος menyatakan kecocokan bagi suatu tujuan. ‘Kerajaan Allah’ adalah ungkapan baku yang tetap dapat mencakup pemerintahan atau kedaulatan Allah.
theological_decisions:
- issue: Makna εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: layak bagi Kerajaan Allah
  alternative: cocok bagi Kerajaan Allah; berguna bagi Kerajaan Allah
  rationale: Terjemahan mempertahankan peringatan tentang komitmen yang tidak terbagi tanpa menentukan apakah ungkapan itu secara khusus berbicara tentang keselamatan akhir, kelayakan untuk masuk, atau kegunaan dalam pelayanan kerajaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Citra membajak dipertahankan. Susunan ‘sudah ... lalu ...’ membuat urutan tindakan mudah dipahami, sedangkan catatan kaki menjaga rentang makna εὔθετος dan mencegah penafsiran teologis yang terlalu sempit.
