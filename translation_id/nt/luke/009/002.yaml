lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Kata kerja ini berarti mengirim atau mengutus. Dalam konteks pemberian tugas kepada kedua belas murid, “mengutus” secara alami menyampaikan nuansa penugasan tanpa menambah unsur yang tidak dinyatakan.
- source_word: κηρύσσειν
  choice: memberitakan
  rationale: Kata ini menunjuk pada penyampaian berita secara terbuka. “Memberitakan” wajar dalam bahasa Indonesia modern dan mempertahankan daya proklamasi tanpa membatasinya pada khotbah formal.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku ini mempertahankan keluasan makna yang dapat mencakup pemerintahan, kekuasaan, dan ranah kerajaan Allah. Huruf kapital dipakai sebagai istilah teologis yang sudah mapan.
- source_word: ἰᾶσθαι
  choice: menyembuhkan
  rationale: Dalam konteks ini kata tersebut menyatakan pemulihan dari penyakit; “menyembuhkan” adalah padanan Indonesia yang langsung dan alami.
- source_word: τοὺς ἀσθενεῖς
  choice: orang-orang sakit
  rationale: Walaupun ἀσθενής dapat berarti lemah, hubungannya dengan tindakan menyembuhkan menunjukkan bahwa yang dimaksud ialah orang yang sakit.
theological_decisions:
- issue: Cakupan makna βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: “Kerajaan Allah” mempertahankan istilah utama Alkitab dan tidak mempersempit ungkapan hanya pada tindakan memerintah. Alternatif dicatat karena frasa Yunani juga dapat menekankan pemerintahan atau kekuasaan Allah.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Lalu” menghubungkan ayat ini dengan tindakan sebelumnya; “Dia” merujuk kepada Yesus. Struktur dua tujuan pengutusan dipertahankan secara langsung.
