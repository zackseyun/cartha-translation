  verdict: approve
  source_fidelity: Teks Indonesia dengan tepat menyatakan bahwa dua tokoh itu berpisah/berangkat dari Yesus, lalu Petrus mengusulkan tiga pondok. Ajakan “Marilah kita membuat” mencerminkan subjungtif hortatoris ποιήσωμεν, dan penjelasan bahwa Petrus tidak memahami ucapannya mempertahankan fungsi μὴ εἰδὼς ὃ λέγει.
  naturalness: Bahasanya baku, jelas, dan wajar untuk narasi Alkitab modern. “Ketika keduanya berpisah dari Yesus” dapat dipahami dengan baik dari konteks sebagai Musa dan Elia; kalimat penutup mandiri juga tetap alami dan jelas.
  terminology: “Guru” merupakan padanan Indonesia yang lazim dan hormat bagi Ἐπιστάτα, tanpa mengklaim kesamaan leksikal dengan διδάσκαλος. “Pondok” sesuai untuk σκηνάς sebagai tempat berlindung sementara. Catatan kaki secara tepat menyediakan “kemah,” “pondok daun,” dan “tabernakel” sebagai alternatif tanpa memaksakan kaitan hari raya.
