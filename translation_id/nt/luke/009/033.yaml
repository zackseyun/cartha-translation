id: LUK.9.33
reference: Luke 9:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: id
  text: 'Ketika keduanya berpisah dari Yesus, Petrus berkata kepada-Nya, “Guru, alangkah baiknya kita berada di sini. Marilah kita membuat tiga pondok[a]: satu untuk Engkau, satu untuk Musa, dan satu untuk Elia.” Petrus tidak tahu apa yang sedang dikatakannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemah” atau “pondok daun”; secara tradisional juga diterjemahkan “tabernakel”. Kata Yunani yang digunakan menunjuk pada tempat berteduh sementara dan mungkin menggemakan gambaran hari raya dalam Alkitab.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Ketika keduanya berpisah dari Yesus
  rationale: Konstruksi naratif ἐγένετο ἐν τῷ dengan infinitif menyatakan tindakan yang berlangsung bersamaan. “Ketika” mengungkapkannya secara alami, sedangkan “keduanya” memperjelas bahwa Musa dan Elialah yang berpisah dari Yesus.
- source_word: Ἐπιστάτα
  choice: Guru
  rationale: Sapaan ini mengakui kewibawaan Yesus. “Guru” merupakan sapaan hormat yang alami dan mudah dipahami dalam bahasa Indonesia, walaupun istilah Yunani ini tidak sama dengan διδάσκαλος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: alangkah baiknya kita berada di sini
  rationale: Ungkapan ini mempertahankan penilaian positif καλόν sekaligus menghasilkan seruan yang alami dalam konteks ucapan Petrus.
- source_word: ποιήσωμεν
  choice: Marilah kita membuat
  rationale: Subjungtif orang pertama jamak bersifat ajakan. “Marilah kita membuat” menyampaikan usul Petrus tanpa menambahkan gagasan membangun yang tidak dinyatakan secara eksplisit oleh ποιέω.
- source_word: σκηνὰς
  choice: pondok
  rationale: σκηνή menunjuk pada tempat berteduh atau hunian sementara. “Pondok” jelas dalam bahasa Indonesia modern dan tidak terlalu dini menetapkan kaitan khusus dengan Kemah Suci atau hari raya tertentu.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Petrus tidak tahu apa yang sedang dikatakannya
  rationale: Klausa ini menjelaskan ketidaktahuan Petrus pada saat berbicara. “Sedang dikatakannya” mempertahankan aspek ujaran yang tengah berlangsung.
theological_decisions:
- issue: Kemungkinan gema Hari Raya Pondok Daun atau tradisi Kemah Suci dalam σκηνάς
  choice: pondok
  alternative: kemah; pondok daun; tabernakel
  rationale: Ayat ini sendiri tidak secara tegas menghubungkan usul Petrus dengan Hari Raya Pondok Daun atau Kemah Suci. Karena itu, teks utama memakai istilah netral untuk tempat berteduh sementara, sementara kemungkinan gema alkitabiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan khidmat. Sapaan serta kata ganti untuk Yesus memakai kapitalisasi hormat yang lazim. Penjelasan terakhir diubah menjadi kalimat mandiri agar jelas dan alami tanpa mengubah fungsi penjelasnya.
