  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: id
  text: Ada pula yang mengatakan bahwa Elia telah menampakkan diri, dan yang lain mengatakan bahwa salah seorang nabi zaman dahulu telah bangkit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: sebagian orang mengatakan ... yang lain mengatakan
  rationale: Ungkapan berpreposisi ini menyatakan sumber laporan dan bersifat eliptis, meneruskan gagasan ‘ada yang mengatakan’ dari ayat sebelumnya. Dalam bahasa Indonesia, pengulangan ‘mengatakan’ membuat hubungan itu jelas dan alami.
- source_word: δὲ ... δὲ
  choice: sedangkan ... dan
  rationale: Kedua partikel menghubungkan dua pendapat tambahan dalam sebuah daftar; ‘sedangkan’ menandai peralihan dari ayat sebelumnya, sementara ‘dan’ menambahkan pendapat berikutnya tanpa memperkeras pertentangan.
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk nama yang sudah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἐφάνη
  choice: telah menampakkan diri
  rationale: Menyampaikan makna ‘muncul/menjadi terlihat’ dan membedakannya dari bahasa kebangkitan pada klausa berikutnya.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: seorang nabi zaman dahulu
  rationale: Mencerminkan ketakrifan τις dan hubungan genitif dengan orang-orang dahulu secara wajar dalam bahasa Indonesia, tanpa menentukan nabi tertentu.
- source_word: ἀνέστη
  choice: telah bangkit
  rationale: Mempertahankan makna ‘bangkit’ yang dalam konteks ini menyiratkan bangkit dari kematian, tanpa mengubahnya menjadi bentuk pasif.
theological_decisions:
- issue: Sifat pendapat orang banyak tentang nabi zaman dahulu
  choice: telah bangkit
  alternative: telah muncul kembali / telah dibangkitkan
  rationale: Kata ἀνέστη secara alami berarti ‘bangkit’ dan dalam konteks ini mengacu pada anggapan bahwa seorang nabi dari masa lampau hidup kembali. Terjemahan ini melaporkan pendapat tersebut tanpa membenarkan atau merincinya.
- issue: Identitas nabi zaman dahulu
  choice: seorang nabi zaman dahulu
  alternative: salah seorang dari antara nabi-nabi zaman dahulu
  rationale: Susunan Yunani dapat dipahami secara tidak spesifik sebagai ‘seorang nabi zaman dahulu’; terjemahan utama tidak menentukan nabi tertentu atau secara berlebihan mengubah frasa itu menjadi konstruksi partitif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Karena ayat ini melanjutkan laporan dalam ayat sebelumnya, ‘mengatakan’ ditambahkan untuk melengkapi elipsis Yunani secara alami. Istilah ‘menampakkan diri’ dan ‘bangkit’ dipertahankan berbeda agar dua klaim yang dilaporkan tidak dilebur.
