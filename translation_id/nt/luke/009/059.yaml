  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: id
  text: Lalu Yesus berkata kepada seorang lainnya, “Ikutlah Aku.” Tetapi orang itu berkata, “Tuhan, izinkan aku pergi terlebih dahulu untuk menguburkan ayahku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: seorang lain
  rationale: Mengungkapkan orang lain yang berbeda dalam rangkaian narasi tanpa menambahkan identitas yang tidak disebutkan.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Padanan idiomatis dan langsung bagi perintah untuk mengikuti Yesus; bentuk kini Yunani tidak perlu diperjelas menjadi tindakan berkelanjutan dalam konteks ini.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan hormat sekaligus kemungkinan bobot kristologisnya, tanpa membatasinya hanya pada arti sosial seperti 'Tuan'.
- source_word: ἐπίτρεψόν μοι
  choice: izinkanlah aku
  rationale: Menyampaikan permohonan izin dengan bahasa Indonesia yang alami dan tetap hormat.
- source_word: ἀπελθόντι πρῶτον
  choice: pergi dahulu
  rationale: 'Menjaga urutan tindakan yang diminta: pergi lebih dahulu, lalu menguburkan ayahnya.'
- source_word: θάψαι τὸν πατέρα μου
  choice: untuk menguburkan ayahku
  rationale: Terjemahan lugas yang tidak menentukan apakah sang ayah baru saja meninggal atau permintaan itu menunjuk pada kewajiban keluarga yang lebih luas.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks memungkinkan sapaan hormat sekaligus gema teologis. 'Tuhan' mempertahankan ketegangan itu, sedangkan 'Tuan' cenderung membatasinya pada kesopanan sosial.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Subjek 'Yesus' dinyatakan untuk memperjelas rujukan pronominal Yunani dalam ayat yang berdiri sendiri. 'Namun' menandai tanggapan yang menunda perintah tanpa melebih-lebihkan pertentangannya.
