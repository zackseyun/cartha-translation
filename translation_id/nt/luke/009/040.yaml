  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: id
  text: Aku sudah memohon kepada murid-murid-Mu supaya mereka mengusirnya[a], tetapi mereka tidak sanggup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “-nya” mungkin mengacu pada roh itu, atau pada anak tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: Aku sudah memohon
  rationale: Kata δέομαι menyatakan permintaan yang sungguh-sungguh. 'Memohon' menyampaikan urgensi sang ayah secara alami tanpa terdengar berlebihan.
- source_word: τῶν μαθητῶν σου
  choice: murid-murid-Mu
  rationale: Dalam konteks Injil, μαθητής menunjuk pada orang yang belajar dan mengikuti seorang guru; 'murid' mempertahankan hubungan tersebut dan merupakan istilah Perjanjian Baru yang lazim.
- source_word: ἵνα ἐκβάλωσιν
  choice: supaya mereka mengusirnya
  rationale: ἵνα dengan bentuk subjungtif menyatakan isi atau tujuan permohonan. Dalam konteks pengusiran roh, ἐκβάλλω secara wajar diterjemahkan 'mengusir'.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina netral ini kemungkinan besar mengacu pada roh dalam konteks sebelumnya. Bentuk Indonesia '-nya' secara alami tetap dapat mengacu pada roh ataupun anak itu, sehingga ambiguitas asli tidak dihilangkan.
- source_word: οὐκ ἠδυνήθησαν
  choice: mereka tidak sanggup
  rationale: δύναμαι menyatakan kemampuan. 'Tidak sanggup' jelas dan alami dalam bahasa Indonesia serta sesuai dengan kegagalan para murid untuk melakukan tindakan yang diminta.
theological_decisions:
- issue: Acuan αὐτό dalam konteks pengusiran roh
  choice: Menggunakan pronomina '-nya' tanpa menyebut acuan secara eksplisit; dalam konteks, kemungkinan utama adalah roh itu.
  alternative: Pronomina tersebut dapat dipahami mengacu pada anak itu.
  rationale: Dalam kisah pengusiran roh, ἐκβάλλω lazimnya menjadikan roh sebagai objek, tetapi αὐτό juga secara gramatikal dapat mengacu pada anak laki-laki yang disebut sebelumnya. Bahasa Indonesia memungkinkan ambiguitas ini dipertahankan dengan '-nya', dan catatan kaki menjelaskan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'Aku' dan 'murid-murid-Mu' mengikuti tuturan langsung kepada Yesus; huruf kapital pada pronomina sapaan mencerminkan kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan hubungan permohonan, tujuan, dan ketidakmampuan dalam teks Yunani.
