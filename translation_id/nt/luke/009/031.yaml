  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: id
  text: Mereka tampak dalam kemuliaan dan berbicara tentang kepergian Yesus[a], yang akan segera digenapi-Nya di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kepergian” secara harfiah berarti “keluaran” dan dapat menggemakan peristiwa Eksodus; di sini kata itu menunjuk pada kepergian Yesus yang akan terjadi di Yerusalem.
    reason: Menjelaskan jangkauan makna ἔξοδος dan gema biblisnya tanpa memasukkan seluruh penjelasan ke dalam teks utama.
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: tampak dalam kemuliaan
  rationale: Menyampaikan bentuk pasif partisipial dan keadaan mereka ketika terlihat tanpa menambahkan siapa yang membuat mereka tampak.
- source_word: ἔλεγον
  choice: berbicara tentang
  rationale: Bentuk imperfek menunjukkan percakapan yang sedang berlangsung; frasa Indonesia ini wajar dengan objek pembicaraan.
- source_word: ἔξοδον
  choice: kepergian
  rationale: Menjaga arti dasar ‘keluarnya/kepergiannya’ dalam konteks kematian dan rangkaian peristiwa akhir Yesus, sekaligus tidak menghapus kemungkinan gema peristiwa Eksodus.
- source_word: πληροῦν
  choice: digenapi-Nya
  rationale: Mencerminkan makna ‘memenuhi/menggenapi’ dan mempertahankan nuansa bahwa kepergian itu merupakan penggenapan, bukan sekadar sesuatu yang dilakukan atau diselesaikan.
- source_word: ἐν Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Padanan lokatif yang langsung dan alami.
theological_decisions:
- issue: Makna ἔξοδος dalam kaitannya dengan akhir pelayanan Yesus
  choice: kepergian
  alternative: kematian / keluaran
  rationale: ‘Kepergian’ mempertahankan keluasan rujukan yang dapat mencakup kematian serta peristiwa-peristiwa sesudahnya, sambil membiarkan gema Eksodus tetap terdengar melalui catatan kaki.
- issue: Nuansa πληροῦν
  choice: digenapi-Nya
  alternative: diselesaikan-Nya / dilaksanakan-Nya
  rationale: Pilihan ini mempertahankan bahasa penggenapan dalam teks sumber tanpa menentukan secara lebih sempit bagaimana rangkaian peristiwa itu dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama ‘Yesus’ dipakai untuk memperjelas rujukan pronomina Yunani αὐτοῦ; bentuk ‘-Nya’ pada ‘digenapi-Nya’ menunjukkan bahwa Yesus adalah subjek tersirat dari πληροῦν. Struktur kalimat tetap dekat dengan teks Yunani namun alami bagi pembaca umum.
