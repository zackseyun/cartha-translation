  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: id
  text: Petrus dan orang-orang yang bersamanya terbebani oleh kantuk; namun, setelah benar-benar terjaga[a], mereka melihat kemuliaan Yesus dan kedua orang yang berdiri bersama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah bangun” atau “ketika sudah sepenuhnya terjaga.” Kata kerja Yunani yang dipakai di sini jarang ditemukan dan mungkin menekankan bahwa mereka menjadi sepenuhnya terjaga, bukan bahwa mereka tetap berjaga sepanjang waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: diliputi rasa kantuk yang berat
  rationale: Ungkapan ini mempertahankan kuatnya keadaan yang ditimbulkan oleh tidur atau kantuk, bukan sekadar menyatakan bahwa mereka mengantuk, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: διαγρηγορήσαντες
  choice: setelah benar-benar terjaga
  rationale: Partisip aoris dari verba yang langka ini, dalam konteks pertentangan dengan rasa kantuk yang berat, paling wajar dipahami sebagai mencapai keadaan sadar dan waspada sepenuhnya. Catatan kaki mempertahankan kemungkinan bahwa mereka tetap terjaga.
- source_word: δόξαν αὐτοῦ
  choice: kemuliaan Yesus
  rationale: Kemuliaan mempertahankan resonansi teologis δόξα. Nama Yesus dipakai untuk memperjelas acuan pronomina secara alami dalam ayat yang berdiri sendiri tanpa menambah identitas baru.
- source_word: τοὺς δύο ἄνδρας
  choice: kedua orang
  rationale: Dalam konteks ini ἄνδρας menunjuk kepada dua laki-laki dewasa, Musa dan Elia. 'Kedua orang' adalah ungkapan Indonesia yang alami dan cukup tepat tanpa penekanan gender yang tidak diperlukan.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: yang berdiri bersama-Nya
  rationale: Bentuk perfektum partisip aktif ini menggambarkan kedua orang itu dalam keadaan berdiri atau hadir bersama Yesus; terjemahan ini mempertahankan gambaran visual adegan tersebut.
- source_word: δὲ ... δὲ
  choice: '[tanpa penghubung pembuka] ... Namun'
  rationale: δέ pertama menandai perkembangan wacana dan tidak perlu diterjemahkan dengan kata pembuka tersendiri dalam bahasa Indonesia. δέ kedua menyatakan kontras antara kantuk berat dan penglihatan mereka, sehingga diterjemahkan 'Namun'.
theological_decisions:
- issue: Makna δόξα dalam peristiwa pemuliaan Yesus
  choice: kemuliaan Yesus
  alternative: keagungan-Nya; semarak-Nya
  rationale: '''Kemuliaan'' mempertahankan hubungan leksikal dan teologis dengan pemakaian δόξα di bagian-bagian Alkitab lain tanpa menjelaskan secara berlebihan hakikat penampakan tersebut.'
- issue: Penafsiran διαγρηγορήσαντες
  choice: setelah benar-benar terjaga
  alternative: setelah tetap berjaga; ketika sudah sepenuhnya terjaga
  rationale: Pilihan utama sesuai dengan kontras terhadap keadaan diliputi kantuk berat dan tidak menyiratkan bahwa mereka berhasil berjaga sepanjang waktu. Karena verba Yunani ini langka dan dapat dipahami secara lain, alternatifnya dicatat dalam catatan kaki.
- issue: Acuan pronomina αὐτοῦ dan αὐτῷ
  choice: Yesus ... -Nya
  alternative: kemuliaan-Nya ... bersama-Nya
  rationale: Menyebut Yesus sekali membuat acuan jelas bagi pembaca ayat mandiri, sedangkan bentuk '-Nya' selanjutnya menjaga kelancaran. Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk pronomina yang mengacu kepada Tuhan tanpa menambahkan klaim di luar konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat mempertahankan kontras naratif tanpa penghubung pembuka yang tidak diperlukan. Ungkapan 'diliputi rasa kantuk yang berat' dipilih agar kuatnya metafora sumber tetap terasa namun tetap alami bagi pembaca umum.
