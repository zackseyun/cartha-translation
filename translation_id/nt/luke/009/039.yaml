revisions:
- from: Lihatlah, suatu roh merasukinya, lalu tiba-tiba anak itu berteriak. Roh itu mengguncang-guncangkan tubuhnya hingga mulutnya berbusa. Roh itu hampir tidak pernah meninggalkannya dan terus menyiksanya.[a]
  to: Dan lihatlah, suatu roh[a] mencengkeramnya; tiba-tiba anak itu berteriak, dan roh itu membuatnya kejang-kejang sambil berbusa. Dengan susah payah roh itu pergi darinya sambil meremukkannya.
  rationale: 'Revisi ini mempertahankan urutan dan kekuatan ungkapan Yunani: roh itu mencengkeram anak tersebut, anak itu mendadak berteriak, mengalami kejang-kejang disertai busa, dan roh itu sulit pergi sambil meremukkannya. Istilah ''roh'' dipertahankan di teks utama sesuai tingkat kekhususan πνεῦμα, sementara kemungkinan kontekstual dicatat tanpa dipaksakan ke dalam terjemahan.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:56Z'
review_pass:
  verdict: revise
  source_fidelity: Draf secara umum mengikuti rangkaian tindakan dalam teks Yunani, tetapi beberapa unsur penting perlu diperbaiki. λαμβάνει berarti roh itu 'mencengkeram/menguasai' anak itu, bukan secara khusus 'merasuki'. μόγις menerangkan bahwa roh itu pergi 'dengan susah payah' atau 'sulit' pergi, bukan bahwa ia 'hampir tidak pernah' pergi. Partisipel συντρῖβον menunjuk pada tindakan meremukkan yang menyertai kepergian roh itu; 'terus menyiksa' mengubah hubungan waktunya dan melemahkan citra fisiknya.
  naturalness: Bahasa draf mudah dipahami, tetapi pengulangan 'Roh itu' dan ungkapan 'mengguncang-guncangkan tubuhnya hingga mulutnya berbusa' kurang langsung. 'Membuatnya kejang-kejang sambil berbusa' adalah bahasa Indonesia baku dan alami untuk σπαράσσει ... μετὰ ἀφροῦ.
  terminology: '''Roh'' tepat untuk πνεῦμα dan sebaiknya dipertahankan tanpa menambahkan ''jahat'' atau ''setan'' dalam teks utama. Catatan kaki dapat menjelaskan kemungkinan pemahaman kontekstual itu. ''Meremukkannya'' mempertahankan daya keras συντρῖβον tanpa menentukan diagnosis atau jenis cedera.'
  issues:
  - severity: high
    issue: μόγις diterjemahkan 'hampir tidak pernah'.
    rationale: Adverbia ini dalam konstruksi ini menyatakan bahwa roh itu sulit atau dengan susah payah pergi. Terjemahan frekuentatif 'hampir tidak pernah' menambahkan gagasan kebiasaan/jarang yang tidak dinyatakan oleh teks.
  - severity: medium
    issue: λαμβάνει diterjemahkan 'merasuki'.
    rationale: Kata Yunani ini secara harfiah menyatakan tindakan mencengkeram atau menguasai. 'Merasuki' lebih spesifik secara teologis/konseptual daripada yang dikatakan verba ini.
  - severity: medium
    issue: συντρῖβον diterjemahkan 'terus menyiksanya'.
    rationale: Partisipel present ini melekat pada tindakan roh itu pergi dan berarti meremukkan atau menghancurkan secara keras. Kata 'terus' mengubah relasi aspek/waktu, sedangkan 'menyiksa' terlalu umum.
  - severity: low
    issue: Catatan kaki mempertahankan pembacaan utama yang tidak setia untuk μόγις.
    rationale: Catatan tidak seharusnya menjadikan 'hampir tidak pernah' sebagai terjemahan utama ketika arti 'dengan susah payah' adalah pembacaan yang diperlukan oleh konteks dan sintaks.
  revised_text: Dan lihatlah, suatu roh[a] mencengkeramnya; tiba-tiba anak itu berteriak, dan roh itu membuatnya kejang-kejang sambil berbusa. Dengan susah payah roh itu pergi darinya sambil meremukkannya.
  revised_footnotes:
  - marker: a
    text: Dalam konteks ini, roh itu dapat dipahami sebagai roh jahat atau setan; tetapi bahasa Yunani di sini hanya mengatakan “roh.”
    reason: alternative_reading
  revision_rationale: 'Revisi ini mempertahankan urutan dan kekuatan ungkapan Yunani: roh itu mencengkeram anak tersebut, anak itu mendadak berteriak, mengalami kejang-kejang disertai busa, dan roh itu sulit pergi sambil meremukkannya. Istilah ''roh'' dipertahankan di teks utama sesuai tingkat kekhususan πνεῦμα, sementara kemungkinan kontekstual dicatat tanpa dipaksakan ke dalam terjemahan.'
