  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: id
  text: Dan lihatlah, suatu roh[a] mencengkeramnya; tiba-tiba anak itu berteriak, dan roh itu membuatnya kejang-kejang sambil berbusa. Dengan susah payah roh itu pergi darinya sambil meremukkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, roh itu dapat dipahami sebagai roh jahat atau setan; tetapi bahasa Yunani di sini hanya mengatakan “roh.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang menghidupkan laporan sang ayah dengan bahasa Indonesia modern dan wajar.
- source_word: πνεῦμα
  choice: suatu roh
  rationale: Teks Yunani hanya menyebut 'roh' tanpa kata sifat 'jahat' atau nomina 'setan'; konteks menunjukkan sifatnya yang bermusuhan, tetapi terjemahan utama mempertahankan ketidakspesifikan leksikal itu.
- source_word: λαμβάνει
  choice: merasuki
  rationale: Dalam konteks serangan dan penguasaan oleh roh, 'merasuki' alami dalam bahasa Indonesia serta menyampaikan penguasaan atas anak itu, meskipun makna dasarnya adalah menangkap atau menguasai.
- source_word: ἐξαίφνης
  choice: tiba-tiba
  rationale: Padanan adverbial yang langsung dan alami untuk terjadinya serangan secara mendadak.
- source_word: κράζει
  choice: anak itu berteriak
  rationale: Bentuk aktif dipertahankan dengan anak sebagai subjek tersirat; penyebutan 'anak itu' menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: σπαράσσει αὐτὸν μετὰ ἀφροῦ
  choice: mengguncang-guncangkan tubuhnya hingga mulutnya berbusa
  rationale: Mengungkapkan kejang tubuh dan busa secara jelas bagi pembaca modern; 'tubuhnya' dan 'mulutnya' ditambahkan secara idiomatis untuk menjelaskan efek jasmani tanpa mengubah pelakunya.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: hampir tidak pernah meninggalkannya
  rationale: μόγις dapat menyatakan 'dengan susah payah' atau 'hampir tidak'; dalam konteks serangan berulang, ungkapan ini secara alami mempertahankan kemungkinan bahwa roh itu jarang melepaskan anak tersebut.
- source_word: συντρῖβον αὐτόν
  choice: terus menyiksanya
  rationale: Partisipel menyatakan tindakan merusak berat yang menyertai keadaan itu. 'Menyiksa' menyampaikan kekerasan dan penderitaan tanpa menetapkan jenis luka fisik yang tidak disebutkan.
theological_decisions:
- issue: Apakah πνεῦμα harus diidentifikasi secara eksplisit sebagai roh jahat atau setan
  choice: suatu roh
  alternative: roh jahat; setan
  rationale: Walaupun konteks luas menunjukkan makhluk rohani yang bermusuhan, ayat ini sendiri hanya memakai πνεῦμα. Terjemahan mempertahankan tingkat kekhususan teks sumber.
- issue: Apakah μόγις berarti roh pergi dengan susah payah atau hampir tidak pernah pergi
  choice: hampir tidak pernah meninggalkannya
  alternative: dengan susah payah meninggalkannya
  rationale: Kedua nuansa dimungkinkan. Dalam laporan tentang serangan yang berulang, pembacaan frekuentatif terasa wajar, tetapi alternatif dicatat agar ambiguitas sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hidup dan bermartabat. Struktur dipecah menjadi beberapa kalimat agar rangkaian serangan mudah dipahami. Penanda catatan kaki [a] ditempatkan pada akhir bagian yang dijelaskan.
