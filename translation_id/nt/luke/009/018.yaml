id: LUK.9.18
reference: Luke 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: id
  text: Pada suatu ketika, ketika Yesus sedang berdoa seorang diri[a], murid-murid-Nya ada bersama-Nya. Ia bertanya kepada mereka, “Menurut orang banyak, siapakah Aku ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara tersendiri.” Ungkapan Yunani ini dapat menunjuk pada keadaan menyendiri, bukan berarti sama sekali tidak ada orang lain di sekitar-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Pada suatu waktu
  rationale: Menandai peralihan narasi khas Lukas secara wajar dalam bahasa Indonesia modern tanpa memakai ungkapan harfiah yang kaku seperti 'terjadilah'.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: ketika Yesus sedang berdoa
  rationale: Konstruksi infinitif artikular dengan ἐν menyatakan keadaan yang berlangsung bersamaan; 'ketika ... sedang' menyampaikan hubungan waktu itu secara alami.
- source_word: κατὰ μόνας
  choice: seorang diri
  rationale: Ungkapan ini dapat berarti sendirian atau secara tersendiri. 'Seorang diri' ringkas dan mempertahankan ketegangan dengan kehadiran murid-murid, sementara catatan kaki mencatat alternatif leksikalnya.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: murid-murid-Nya ada bersama-Nya
  rationale: Mempertahankan makna relasional sederhana bahwa para murid hadir bersama Yesus, tanpa menambahkan bahwa mereka datang kemudian atau hanya berada di dekat-Nya.
- source_word: ἐπηρώτησεν αὐτοὺς
  choice: Ia bertanya kepada mereka
  rationale: Padanan langsung dan alami untuk tindakan mengajukan pertanyaan.
- source_word: λέγων
  choice: tidak diterjemahkan tersendiri
  rationale: Partisip pengantar ujaran diserap secara idiomatis ke dalam tanda baca dan kutipan langsung; menerjemahkannya sebagai 'dengan berkata' akan terasa kaku dan berlebihan dalam bahasa Indonesia.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Menurut orang banyak, siapakah Aku ini?
  rationale: Menyampaikan pertanyaan tidak langsung Yunani dalam bentuk Indonesia yang alami, sekaligus mempertahankan fokus pada identitas Yesus.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Padanan lazim bagi kerumunan atau massa; lebih alami dalam konteks ini daripada 'kerumunan-kerumunan' dan tidak terlalu umum seperti 'orang-orang'.
theological_decisions:
- issue: Ketegangan antara Yesus berdoa 'seorang diri' dan murid-murid berada bersama-Nya
  choice: 'Kedua pernyataan diterjemahkan secara langsung tanpa diselaraskan: Yesus berdoa seorang diri, sementara murid-murid-Nya ada bersama-Nya.'
  alternative: Menerjemahkan κατὰ μόνας sebagai 'secara pribadi' atau menambahkan bahwa para murid berada di dekat-Nya untuk menghilangkan kesan pertentangan.
  rationale: Teks Yunani membiarkan nuansa antara kesendirian dalam doa dan kehadiran para murid. Terjemahan tidak menentukan apakah kesendirian itu mutlak, bersifat relatif, atau menunjuk pada cara Yesus berdoa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' digunakan untuk memperjelas rujukan pronomina pada awal unit ayat. Bentuk hormat pronominal '-Nya' dan 'Aku' mengikuti konvensi umum teks Alkitab bahasa Indonesia tanpa menambahkan tafsiran doktrinal.
