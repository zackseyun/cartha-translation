  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: id
  text: Ketika mereka sedang berjalan di jalan, seseorang berkata kepada-Nya, “Aku akan mengikuti Engkau ke mana pun Engkau pergi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “ke mana pun Engkau mungkin pergi” atau “ke mana pun Engkau berangkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: ketika mereka sedang berjalan
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung dan bersamaan dengan perkataan berikutnya.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Mempertahankan latar perjalanan yang konkret dengan ungkapan Indonesia yang wajar, tanpa meniadakan gema motif perjalanan dalam Injil Lukas.
- source_word: εἶπέν τις
  choice: seseorang berkata
  rationale: Kata τις bersifat tak tentu dan tidak menyatakan jenis kelamin, sehingga 'seseorang' lebih tepat daripada 'seorang laki-laki'.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: Padanan Indonesia yang alami untuk πρός bersama verba berbicara; bentuk pronomina merujuk kepada Yesus dalam konteks.
- source_word: Ἀκολουθήσω σοι
  choice: Aku akan mengikuti Engkau
  rationale: Bentuk futur menyatakan niat atau komitmen. 'Mengikuti' mempertahankan sekaligus arti gerak harfiah dan nuansa kemuridan tanpa memperluasnya menjadi parafrasa.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: ke mana pun Engkau pergi
  rationale: ὅπου dengan ἐάν dan subjunktif menyatakan tempat yang tidak dibatasi, yakni 'ke mana pun'. Dalam konteks ini, 'pergi' alami dalam bahasa Indonesia, sedangkan nuansa lebih harfiah ἀπέρχομαι dicatat dalam catatan kaki.
theological_decisions:
- issue: Nuansa kemuridan yang kuat dalam ἀκολουθέω
  choice: mengikuti
  alternative: menjadi murid-Mu
  rationale: Dalam Lukas, verba ini memang berkonotasi kemuridan, tetapi 'mengikuti' mempertahankan arti leksikal, gerak nyata, dan makna teologisnya tanpa menambahkan penafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat menjaga gerak narasi, sedangkan pilihan 'di jalan' tetap konkret. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
