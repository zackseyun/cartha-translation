id: LUK.9.23
reference: Luke 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: id
  text: Ia berkata kepada semua orang, “Jika seseorang mau datang mengikut Aku[a], hendaklah ia menyangkal dirinya, memikul salibnya setiap hari, dan mengikuti Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “datang di belakang-Ku.” Ungkapan ini berarti datang sebagai pengikut-Nya.'
    reason: Menjelaskan bentuk harfiah idiom Yunani sambil mempertahankan bacaan utama yang lebih alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek menunjukkan tindakan berkata yang sedang berlangsung atau berulang, tetapi bahasa Indonesia umumnya tidak menandai aspek itu secara wajib. “Ia berkata” paling alami dan tidak menambahkan penekanan yang tidak pasti.
- source_word: πρὸς πάντας
  choice: kepada semua orang
  rationale: Menyatakan dengan jelas bahwa perkataan ini ditujukan kepada seluruh orang yang hadir, bukan hanya kepada murid tertentu.
- source_word: Εἴ τις θέλει
  choice: Jika seseorang mau
  rationale: “Seseorang” mempertahankan bentuk tunggal yang bersifat umum, sedangkan “mau” menyampaikan kehendak tanpa terdengar terlalu formal.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: datang mengikut Aku
  rationale: Ungkapan ini menyampaikan idiom pemuridan secara wajar dalam bahasa Indonesia, sambil tetap mempertahankan unsur “datang” dan tidak sepenuhnya menyamakannya dengan kata kerja ἀκολουθέω pada akhir ayat.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: hendaklah ia menyangkal dirinya
  rationale: “Hendaklah” menyampaikan imperatif orang ketiga, dan “menyangkal dirinya” mempertahankan ungkapan sumber tanpa menjabarkannya sebagai penolakan terhadap keinginan atau kepentingan tertentu.
- source_word: ἀράτω
  choice: memikul
  rationale: Dalam hubungan dengan salib, “memikul” merupakan ungkapan Indonesia yang alami dan mencakup tindakan mengambil serta menanggungnya, tanpa mengganti gambaran konkret salib dengan gagasan abstrak.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: salibnya
  rationale: Mempertahankan istilah konkret “salib” dan pronomina milik tunggal tanpa menambahkan penafsiran seperti beban, penderitaan, atau pengorbanan.
- source_word: καθ’ ἡμέραν
  choice: setiap hari
  rationale: Menyatakan dengan lugas penekanan khas Lukas bahwa tindakan ini berlangsung hari demi hari.
- source_word: ἀκολουθείτω μοι
  choice: dan mengikuti Aku
  rationale: Bentuk ini melanjutkan daya imperatif dari “hendaklah” dan menerjemahkan kata kerja mengikuti secara langsung.
theological_decisions:
- issue: Makna gambaran salib dalam pemuridan
  choice: Mempertahankan kata harfiah “salib”.
  alternative: bebannya; penderitaan atau pengorbanan yang harus ditanggungnya
  rationale: σταυρός adalah benda konkret dengan daya simbolis yang sengaja tidak dijabarkan. Terjemahan tidak boleh mempersempit ketegangan maknanya menjadi penderitaan, beban, atau pengorbanan saja.
- issue: Bentuk tunggal umum dalam perintah
  choice: “seseorang ... ia ... dirinya ... salibnya”
  alternative: “orang-orang ... mereka ... diri mereka ... salib mereka”
  rationale: Teks Yunani memakai bentuk tunggal yang mewakili siapa saja. Bahasa Indonesia dapat mempertahankan ketunggalan ini tanpa memasukkan jenis kelamin, sebab “ia” bersifat netral gender.
- issue: Hubungan antara datang di belakang Yesus dan mengikuti-Nya
  choice: “datang mengikut Aku” pada klausa pertama dan “mengikuti Aku” pada klausa terakhir
  alternative: memakai “mengikuti Aku” pada kedua tempat
  rationale: Pilihan ini menjaga hubungan idiomatis keduanya sekaligus mempertahankan perbedaan antara ὀπίσω μου ἔρχεσθαι dan ἀκολουθείτω μοι.
translation_notes:
  register: Bahasa modern, lugas, dan khidmat. Bentuk “Aku” mengikuti cara tutur langsung Yesus yang lazim dalam bahasa Indonesia. “Hendaklah” dipakai untuk mempertahankan daya perintah tanpa membuat kalimat terasa kasar. Tidak ada penanda gender dalam “seseorang” dan “ia”.
