  verdict: approve
  source_fidelity: 'Teks Indonesia secara setia menerjemahkan unsur utama Yunani: alamat kepada semua orang, kondisi umum tunggal, tiga perintah, “salibnya,” penanda “setiap hari,” dan objek “Aku.” “Ia berkata” merupakan cara Indonesia yang wajar untuk imperfek ἔλεγεν dalam narasi dan tidak mengubah makna. “Memikul salibnya” adalah idiom Indonesia yang mapan dalam konteks ini serta mempertahankan gambaran konkret salib.'
  naturalness: Kalimatnya lancar, modern, lugas, dan tetap bernada khidmat. Rangkaian “hendaklah ia menyangkal dirinya, memikul salibnya setiap hari, dan mengikuti Aku” dipahami secara alami sebagai tiga unsur yang berada di bawah daya perintah “hendaklah.”
  terminology: “Salib,” “menyangkal dirinya,” dan “mengikuti Aku” adalah padanan yang tepat dan tidak menambahkan penafsiran doktrinal. Bentuk “seseorang ... ia ... dirinya ... salibnya” mempertahankan tunggal generik Yunani tanpa menandai gender. Catatan kaki berjangkar tepat pada “Aku” dalam idiom klausa pertama dan secara akurat menjelaskan bentuk harfiahnya.
