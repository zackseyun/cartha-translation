base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: id
  text: Mereka menjawab, “Yohanes Pembaptis; yang lain mengatakan Elia; dan yang lain lagi mengatakan bahwa salah seorang dari nabi-nabi zaman dahulu telah bangkit[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang nabi dari zaman dahulu telah bangkit.” Ungkapan Yunani ini juga dapat dipahami secara idiomatis sebagai “salah seorang dari nabi-nabi zaman dahulu telah bangkit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Mereka menjawab
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani yang dipengaruhi gaya Semitis. ‘Mereka menjawab’ menyampaikan maknanya secara wajar dalam bahasa Indonesia tanpa pengulangan yang kaku.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Yohanes Pembaptis
  rationale: Ini adalah sebutan baku dalam bahasa Indonesia dan mencerminkan gelar pengenal βαπτιστής.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: yang lain mengatakan ... dan yang lain lagi mengatakan
  rationale: Pengulangan ini mempertahankan susunan jawaban dari kelompok-kelompok berbeda, sedangkan ‘mengatakan’ ditambahkan secara wajar dari verba utama yang tersirat.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Bentuk nama nabi yang baku dalam Alkitab bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Memperkenalkan isi pernyataan kelompok terakhir secara langsung dan alami.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: salah seorang nabi zaman dahulu
  rationale: Ungkapan ini mempertahankan sifat tak tentu dari τις dan memahami genitif τῶν ἀρχαίων sebagai kelompok para nabi dari masa lampau; bentuk ini lebih alami daripada ‘seorang nabi dari orang-orang dahulu’.
- source_word: ἀνέστη
  choice: telah bangkit
  rationale: ‘Telah bangkit’ mempertahankan kemungkinan gema kebangkitan dalam ἀνέστη tanpa memperjelasnya menjadi pernyataan doktrinal yang lebih tegas daripada teks.
theological_decisions:
- issue: Apakah ἀνέστη harus diterjemahkan dengan kata yang secara eksplisit menyatakan kebangkitan dari kematian
  choice: telah bangkit
  alternative: telah muncul kembali
  rationale: Kata ἀνίστημι dapat berarti bangkit atau muncul, dan dalam konteks tertentu menunjuk pada kebangkitan. ‘Telah bangkit’ menjaga ketegangan makna tersebut tanpa menafsirkan secara berlebihan bagaimana nabi itu dianggap hadir kembali.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami bagi pembaca umum, sementara ungkapan ‘telah bangkit’ mempertahankan ambiguitas teologis teks sumber.
