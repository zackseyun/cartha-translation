  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: id
  text: Keesokan harinya[a], ketika mereka telah turun dari gunung, sebuah kerumunan besar datang menemui Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pada hari berikutnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (tidak diterjemahkan secara tersendiri)
  rationale: Ungkapan ini berfungsi sebagai peralihan naratif. Dalam bahasa Indonesia modern, peralihan tersebut sudah tersampaikan secara alami oleh keterangan waktu di awal kalimat; menerjemahkannya sebagai “Dan terjadilah” akan terasa kaku.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Keesokan harinya
  rationale: Ungkapan datif waktu ini menunjuk pada hari berikutnya. “Keesokan harinya” alami, jelas, dan sesuai dengan urutan narasi.
- source_word: κατελθόντων αὐτῶν
  choice: ketika mereka telah turun
  rationale: Konstruksi genitif absolut memberi latar keadaan. Bentuk “telah turun” menyampaikan tindakan yang sudah selesai sehubungan dengan pertemuan itu tanpa memperinci urutan secara berlebihan.
- source_word: ἀπὸ τοῦ ὄρους
  choice: dari gunung
  rationale: ὄρος dalam konteks ini paling tepat diterjemahkan “gunung,” bukan “bukit.”
- source_word: συνήντησεν αὐτῷ
  choice: datang menemui Yesus
  rationale: Kata kerja ini dapat berarti bertemu atau pergi menyongsong seseorang. “Datang menemui” alami dalam bahasa Indonesia dan menyampaikan bahwa orang banyak itu menghampiri tokoh yang dirujuk oleh αὐτῷ.
- source_word: ὄχλος πολύς
  choice: orang banyak
  rationale: “Orang banyak” merupakan padanan Alkitabiah yang tetap mudah dipahami untuk kerumunan besar. Besarnya kelompok tersirat secara idiomatis, meskipun alternatif lebih eksplisit ialah “kerumunan besar.”
theological_decisions:
- issue: Acuan kata ganti αὐτῷ
  choice: Yesus
  alternative: dia-Nya / Dia
  rationale: Dalam konteks narasi, αὐτῷ mengacu kepada Yesus. Penyebutan nama menghindari bentuk kata ganti Indonesia yang janggal atau ambigu tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat mempertahankan keterangan waktu serta latar tindakan sebelum klausa utama. Marker [a] dicantumkan tepat setelah frasa yang diberi alternatif.
