  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan latar waktu, genitif absolut κατελθόντων αὐτῶν, asal dari gunung, dan tindakan orang banyak yang menemui Yesus. Namun, πολύς ('besar/banyak') perlu diterjemahkan secara eksplisit. Frasa 'orang banyak' dapat berarti kerumunan secara umum, tetapi tidak secara andal mempertahankan penegasan ukuran dalam teks Yunani.
  naturalness: '''Keesokan harinya'' dan ''ketika mereka telah turun dari gunung'' wajar dalam bahasa Indonesia modern. ''Sebuah kerumunan besar'' secara jelas dan alami menyatakan ὄχλος πολύς. ''Datang menemui Yesus'' merupakan padanan yang idiomatis bagi συνήντησεν αὐτῷ dalam konteks ini.'
  terminology: '''Gunung,'' ''kerumunan besar,'' dan ''Yesus'' sesuai dengan register Alkitab bahasa Indonesia modern. Penyebutan ''Yesus'' memperjelas rujukan αὐτῷ tanpa menambah makna teologis.'
  issues:
