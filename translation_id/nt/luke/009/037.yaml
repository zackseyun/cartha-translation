    issue: Ukuran kerumunan tidak dinyatakan secara eksplisit.
    rationale: ὄχλος πολύς secara eksplisit berarti 'kerumunan besar' atau 'orang banyak yang besar.' Padanan 'orang banyak' saja dapat menghilangkan kontribusi πολύς; makna ukuran perlu dipertahankan dalam teks terjemahan.
  revised_text: Keesokan harinya[a], ketika mereka telah turun dari gunung, sebuah kerumunan besar datang menemui Yesus.
