  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Siapa pun yang menerima anak ini dalam nama-Ku[a], menerima Aku; dan siapa pun yang menerima Aku, menerima Dia yang mengutus Aku. Sebab, orang yang paling kecil di antara kalian semua—dialah yang besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dalam nama-Ku” juga dapat dipahami sebagai “atas dasar nama-Ku” atau “karena nama-Ku”; maksudnya, anak itu diterima dalam kaitan dengan nama, kewenangan, atau perwakilan Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Lalu Yesus berkata kepada mereka
  rationale: καί melanjutkan alur narasi dan secara alami dapat diterjemahkan “Lalu”. Subjek tersirat diperjelas sebagai “Yesus” agar rujukannya jelas dalam kutipan ayat tunggal tanpa mengubah makna.
- source_word: δέξηται / δέχεται
  choice: menerima
  rationale: “Menerima” mempertahankan pengulangan verba Yunani serta dapat mencakup penerimaan pribadi, penyambutan, dan pengakuan terhadap wakil seseorang.
- source_word: τοῦτο τὸ παιδίον
  choice: anak ini
  rationale: παιδίον berarti anak; demonstratif τοῦτο dipertahankan dengan “ini”. Tidak perlu menambahkan “kecil” karena nuansa diminutif bukan keharusan dalam konteks ini.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dalam nama-Ku
  rationale: Ungkapan ini mempertahankan kaitan dengan nama, kewenangan, dan perwakilan Yesus tanpa mempersempitnya hanya menjadi motif atau sebab.
- source_word: τὸν ἀποστείλαντά με
  choice: Dia yang mengutus Aku
  rationale: Partisipel substantival diterjemahkan secara wajar sebagai klausa relatif. Huruf kapital mengikuti register Alkitab Indonesia untuk rujukan implisit kepada Allah, tanpa menambahkan sebutan “Bapa” atau “Allah” yang tidak eksplisit dalam teks.
- source_word: ὁ ... μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων
  choice: orang yang paling kecil di antara kalian semua
  rationale: Bentuk komparatif μικρότερος berfungsi secara elatif dalam konteks kedudukan sosial. “Paling kecil” mempertahankan metafora status dan lebih alami daripada “lebih kecil” dalam bahasa Indonesia.
- source_word: οὗτός ἐστιν μέγας
  choice: dialah yang besar
  rationale: “Dialah” mempertahankan penekanan demonstratif οὗτος, sedangkan “besar” menjaga paradoks leksikal kecil-besar tanpa menafsirkannya menjadi “terbesar”.
theological_decisions:
- issue: Rujukan “Dia yang mengutus Aku”
  choice: Rujukan implisit kepada Allah/Bapa dipertahankan tanpa menyebut gelar secara eksplisit.
  alternative: Bapa yang mengutus Aku; Allah yang mengutus Aku
  rationale: Teks Yunani memakai partisipel berartikel dan tidak menyebut “Bapa” atau “Allah”. Terjemahan mempertahankan klaim relasional tentang pengutusan Yesus tanpa memperluas teks.
- issue: Makna menerima anak “dalam nama-Ku”
  choice: Frasa luas “dalam nama-Ku” dipertahankan.
  alternative: karena nama-Ku; atas dasar nama-Ku; demi Aku
  rationale: Ungkapan ini dapat menunjuk pada hubungan dengan nama, kewenangan, atau perwakilan Yesus. Terjemahan tidak membatasinya pada satu nuansa saja.
- issue: Paradoks kebesaran
  choice: Yang paling kecil dalam komunitas dinyatakan besar.
  alternative: yang termuda di antara kalian adalah besar
  rationale: μικρότερος dalam konteks ini lebih mungkin menyangkut kerendahan kedudukan daripada usia. Bentuk “dialah yang besar” mempertahankan pembalikan nilai tanpa menaikkannya menjadi klaim “yang terbesar”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipilih untuk menandai bahwa ὑμῖν berbentuk jamak dengan jelas dan wajar. Pengulangan “menerima” serta pasangan “paling kecil—besar” sengaja dipertahankan. Hanya satu catatan kaki dipakai; alternatif “menyambut” tidak dicatat karena “menerima” sudah alami dan penting untuk menjaga rantai verbal dalam ayat.
