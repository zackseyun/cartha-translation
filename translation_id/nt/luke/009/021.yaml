  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: id
  text: Namun, Yesus menegur mereka dengan keras dan memerintahkan agar mereka tidak memberitahukan hal itu kepada siapa pun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, Yesus memperingatkan mereka dengan keras dan memerintahkan agar mereka tidak memberitahukan hal itu kepada siapa pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai kontras ringan antara pengakuan Petrus pada ayat sebelumnya dan tanggapan Yesus; “Namun” alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἐπιτιμήσας
  choice: menegur mereka dengan keras
  rationale: Partisip aoris ini menyatakan teguran atau peringatan yang tegas. Ungkapan ini mempertahankan daya verbalnya sekaligus sesuai dengan konteks larangan yang kuat.
- source_word: παρήγγειλεν
  choice: memerintahkan
  rationale: Verba ini menunjuk pada pemberian arahan yang berwibawa, bukan sekadar saran atau permintaan.
- source_word: μηδενὶ
  choice: kepada siapa pun
  rationale: Bersama bentuk negatif “tidak memberitahukan,” frasa ini secara alami menyampaikan makna bahwa tidak seorang pun boleh menjadi penerima berita tersebut.
- source_word: λέγειν
  choice: memberitahukan
  rationale: Dalam konstruksi dengan objek penerima dan τοῦτο sebagai isi perkataan, “memberitahukan” lebih idiomatis daripada terjemahan harfiah “mengatakan.”
- source_word: τοῦτο
  choice: hal itu
  rationale: Mempertahankan sifat penunjukan kepada pengakuan Petrus dalam konteks sebelumnya tanpa menjelaskan rujukannya secara berlebihan.
theological_decisions:
- issue: Kekuatan larangan Yesus setelah pengakuan Petrus
  choice: Larangan tegas untuk tidak memberitahukan hal itu kepada siapa pun pada tahap ini dalam kisah
  alternative: Peringatan yang lebih lunak agar mereka tidak menyebutkannya
  rationale: Gabungan ἐπιτιμήσας dan παρήγγειλεν menunjukkan tindakan yang lebih kuat daripada permintaan biasa. Terjemahan mempertahankan ketegangan naratif tanpa memasukkan teori teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Subjek “Yesus” dinyatakan agar rujukan pronomina alami dan tidak rancu dalam ayat yang berdiri sendiri; makna sumber tidak berubah.
