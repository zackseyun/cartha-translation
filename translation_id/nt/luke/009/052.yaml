  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: id
  text: Ia mengutus utusan-utusan mendahului-Nya.[a] Mereka pergi dan masuk ke sebuah desa orang Samaria[b] untuk membuat persiapan bagi-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “di depan wajah-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebuah desa Samaria.” Teks Yunani secara lebih harfiah berbunyi “sebuah desa orang-orang Samaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Bentuk aoristus aktif ἀποστέλλω menyatakan tindakan mengirim atau mengutus; 'mengutus' alami untuk orang yang diberi tugas.
- source_word: ἀγγέλους
  choice: beberapa utusan
  rationale: Dalam konteks ini ἄγγελοι adalah manusia yang diutus lebih dahulu, bukan makhluk surgawi. 'Beberapa utusan' juga menyatakan bentuk jamak secara alami.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: mendahului-Nya
  rationale: Ungkapan ini secara harfiah berarti 'di depan wajah-Nya', tetapi dalam konteks perjalanan berarti pergi lebih dahulu daripada Yesus.
- source_word: πορευθέντες
  choice: Mereka pergi
  rationale: Partisip aoristus menunjukkan tindakan pergi yang mendahului tindakan masuk; klausa berverba penuh lebih alami dalam bahasa Indonesia.
- source_word: εἰσῆλθον
  choice: masuk
  rationale: Padanan langsung dan alami untuk aoristus εἰσέρχομαι.
- source_word: κώμην
  choice: desa
  rationale: κώμη umumnya menunjuk permukiman kecil, sehingga 'desa' lebih tepat daripada 'kota'.
- source_word: Σαμαριτῶν
  choice: orang Samaria
  rationale: Genitif jamak secara formal berarti 'milik/dihuni orang-orang Samaria'; frasa 'desa orang Samaria' mempertahankan bentuk relasional tersebut.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: untuk membuat persiapan bagi-Nya
  rationale: ὡς dengan infinitif menyatakan tujuan. Terjemahan ini mempertahankan objek persiapan yang tidak disebutkan dalam teks Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pronomina hormat untuk Yesus ditulis dengan huruf kapital. Pengulangan penghubung Yunani καί tidak dipaksakan menjadi dua kalimat yang sama-sama diawali 'Dan', karena hubungan urutannya sudah jelas dalam bahasa Indonesia.
