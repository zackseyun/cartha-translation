  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: id
  text: Namun Herodes berkata, “Yohanes—akulah yang memenggal kepalanya. Tetapi siapakah orang ini, yang tentangnya kudengar hal-hal semacam itu?” Dan ia terus berusaha melihatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia berusaha melihatnya.” Bentuk imperfek Yunani dapat menunjukkan tindakan yang sedang berlangsung atau dilakukan berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun / Tetapi
  rationale: Partikel ini menghubungkan ucapan Herodes dengan laporan sebelumnya sekaligus memberi nuansa pertentangan. Dalam bahasa Indonesia, “Namun” membuka tanggapannya secara alami, sedangkan “Tetapi” menandai kontras di dalam ucapannya.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: ἐγὼ
  choice: Aku sendiri
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Yunani memberi penekanan pada Herodes sebagai pelaku; “Aku sendiri” mempertahankan penekanan itu secara alami.
- source_word: ἀπεκεφάλισα
  choice: telah memenggal kepala
  rationale: Kata kerja ini secara khusus berarti membunuh dengan memenggal kepala. “Telah” menyatakan tindakan lampau tanpa memaksakan konstruksi waktu yang lebih terperinci.
- source_word: τίς ... ἐστιν οὗτος
  choice: siapakah orang ini
  rationale: Mempertahankan pertanyaan langsung dan unsur penunjuk “ini”; kata “orang” ditambahkan demi kelancaran ungkapan Indonesia tanpa menentukan identitasnya.
- source_word: περὶ οὗ
  choice: tentangnya
  rationale: Menyampaikan relasi ‘mengenai/tentang dia’ secara ringkas dan wajar dalam konteks kabar yang didengar.
- source_word: ἀκούω
  choice: kudengar
  rationale: Bentuk kini diterjemahkan dengan bentuk Indonesia yang alami dan tetap mempertahankan Herodes sebagai subjek orang pertama.
- source_word: τοιαῦτα
  choice: hal-hal semacam itu
  rationale: Menjaga sifat umum ungkapan Yunani tanpa menafsirkannya secara lebih khusus sebagai laporan atau mukjizat.
- source_word: ἐζήτει
  choice: terus berusaha
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang berlangsung atau berulang; “terus” mengungkapkan nuansa duratif itu tanpa menyatakan bahwa upayanya berhasil.
- source_word: ἰδεῖν
  choice: melihat
  rationale: Padanan langsung yang tidak mempersempit makna menjadi ‘bertemu’.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina ini merujuk kepada Yesus dalam konteks, tetapi nama Yesus tidak ditambahkan ke dalam ayat.
theological_decisions:
- issue: Pernyataan Herodes tentang Yohanes dan rasa ingin tahunya mengenai Yesus
  choice: Diterjemahkan sebagai pernyataan historis dan pertanyaan langsung, tanpa menambahkan dugaan bahwa Herodes menganggap Yohanes telah bangkit.
  alternative: Membuat ketakutan atau keyakinan Herodes tentang kebangkitan Yohanes menjadi eksplisit.
  rationale: Ayat ini sendiri hanya menyatakan bahwa Herodes telah memenggal kepala Yohanes, mempertanyakan identitas orang yang sedang dibicarakan, dan berusaha melihatnya. Ketegangan identitas dalam konteks dipertahankan tanpa diselesaikan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ucapan langsung memakai “aku” sesuai ujaran pribadi seorang penguasa; bentuk “Aku sendiri” menjaga penekanan pronomina Yunani. Pronomina “dia” ditulis dengan huruf kecil agar penerjemahan tidak memasukkan konvensi tipografis teologis yang tidak ditandai dalam teks Yunani.
