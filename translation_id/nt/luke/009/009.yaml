  naturalness: “Yohanes—akulah yang memenggal kepalanya” merupakan ujaran langsung yang lebih alami dan tegas dalam bahasa Indonesia baku. “Dan ia terus berusaha melihatnya” mengalir lebih baik daripada “Ia pun terus berusaha melihat dia,” sambil tetap menyampaikan aspek imperfek.
  terminology: Herodes dan Yohanes adalah bentuk nama yang baku. Istilah “memenggal kepalanya” mempertahankan makna khusus ἀπεκεφάλισα. Tidak ada istilah teologis yang perlu diselaraskan atau ditafsirkan lebih jauh.
