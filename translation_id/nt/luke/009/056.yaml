  yaml_path: translation/nt/luke/009/056.yaml
  text: And they went on to another village[a].
translation:
  language: id
  text: Dan mereka pergi ke desa lain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “desa yang berbeda.” Kata sifat Yunani yang dipakai dapat menekankan perbedaan, bukan sekadar penambahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur naratif ini, καὶ menghubungkan tindakan berikutnya secara wajar. “Lalu” menghasilkan bahasa Indonesia yang alami tanpa menambahkan hubungan sebab-akibat.
- source_word: ἐπορεύθησαν
  choice: mereka pergi
  rationale: Bentuk aoris deponen dari πορεύομαι menyatakan tindakan pergi atau melanjutkan perjalanan. “Mereka pergi” mempertahankan arti dasar gerak dan cocok dengan tujuan yang disebut sesudahnya.
- source_word: εἰς
  choice: ke
  rationale: Dengan verba gerak, εἰς menandai arah atau tujuan; “ke” adalah padanan Indonesia yang alami.
- source_word: ἑτέραν
  choice: lain
  rationale: ἕτερος dapat berarti “lain” atau “berbeda”. Dalam frasa ini, “desa lain” bersifat alami serta tetap memungkinkan nuansa bahwa desa itu berbeda dari desa sebelumnya.
- source_word: κώμην
  choice: desa
  rationale: κώμη menunjuk pada permukiman yang lebih kecil daripada kota; “desa” adalah padanan yang tepat dan mudah dipahami.
