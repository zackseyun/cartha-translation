id: LUK.9.29
reference: Luke 9:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: id
  text: Ketika Ia sedang berdoa, rupa wajah-Nya berubah[a], dan pakaian-Nya menjadi putih, berkilau seperti kilat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penampilan wajah-Nya menjadi berbeda.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pakaian-Nya putih dan menyilaukan”; partisip Yunani ini menggambarkan kilatan seperti petir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Ketika Ia sedang berdoa
  rationale: Konstruksi khas Lukas ini menyatakan bahwa peristiwa berikut terjadi sementara Yesus berdoa. Terjemahan ini mempertahankan hubungan waktunya secara alami tanpa ungkapan kaku ‘terjadilah ketika’.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: rupa wajah-Nya
  rationale: εἶδος menunjuk pada penampilan yang terlihat, sedangkan πρόσωπον berarti ‘wajah’. ‘Rupa wajah-Nya’ ringkas, alami, dan tidak menyiratkan perubahan hakikat.
- source_word: ἕτερον
  choice: menjadi lain
  rationale: ἕτερον secara harfiah berarti ‘lain/berbeda’. Ungkapan ini mempertahankan pilihan kata Lukas yang bersahaja dan tidak mengimpor gambaran ‘bersinar’ dari Injil sejajar.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: pakaian-Nya
  rationale: ἱματισμός berarti pakaian atau busana. ‘Pakaian-Nya’ merupakan padanan modern yang jelas dan tetap pantas bagi gaya naratif.
- source_word: λευκὸς
  choice: putih
  rationale: λευκός berarti ‘putih’; unsur kecemerlangan dinyatakan tersendiri oleh ἐξαστράπτων, sehingga tidak perlu dimasukkan ke dalam kata ini.
- source_word: ἐξαστράπτων
  choice: berkilau seperti kilat
  rationale: Partisip ini berkaitan dengan kilatan petir. Padanan tersebut mempertahankan citra cahaya yang tajam dan hidup, bukan sekadar menyatakan bahwa pakaian itu cerah.
theological_decisions:
- issue: Gambaran perubahan rupa Yesus
  choice: Menyatakan perubahan yang tampak dengan ‘rupa wajah-Nya menjadi lain’.
  alternative: ‘Wajah-Nya berubah’ atau ‘wajah-Nya bersinar’.
  rationale: Teks menggambarkan perubahan nyata yang terlihat, tetapi pilihan kata Lukas lebih bersahaja daripada ungkapan dalam Injil sejajar. Terjemahan tidak menyelaraskannya dengan menyisipkan gagasan ‘bersinar’, dan juga tidak menentukan lebih jauh sifat perubahan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Citra kilat dipertahankan tanpa melebihkan uraian Lukas.
