source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: id
  text: Camkanlah baik-baik kata-kata ini, sebab Anak Manusia akan diserahkan ke tangan manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikhianati.” Kata Yunani ini dapat berarti “menyerahkan,” “menyerahkan ke tangan orang lain,” atau, dalam konteks tertentu, “mengkhianati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Camkanlah baik-baik
  rationale: Ungkapan harfiah Yunani, 'taruhlah ... ke dalam telingamu,' merupakan idiom yang mendesak para pendengar untuk menyimak dan mengingat. 'Camkanlah baik-baik' menyampaikan daya imperatif dan penekanan ὑμεῖς secara alami dalam bahasa Indonesia modern.
- source_word: τοὺς λόγους τούτους
  choice: perkataan ini
  rationale: λόγους menunjuk pada pernyataan yang segera disampaikan Yesus; 'perkataan ini' langsung, wajar, dan tetap dekat dengan bentuk sumber.
- source_word: ὁ γὰρ
  choice: ':'
  rationale: γάρ memperkenalkan isi atau alasan yang harus dicamkan. Dalam bahasa Indonesia, tanda titik dua menghubungkan perintah dengan pernyataan berikutnya secara lebih alami daripada 'sebab' dalam susunan ini.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Terjemahan gelar yang mapan ini mempertahankan bentuk harfiah, ambiguitas, dan gema Daniel 7.
- source_word: μέλλει
  choice: akan
  rationale: Dalam konteks nubuat penderitaan, 'akan' menyampaikan tindakan yang segera/siap terjadi tanpa memasukkan gagasan takdir secara berlebihan.
- source_word: παραδίδοσθαι
  choice: diserahkan
  rationale: Bentuk pasif ini menunjuk pada pemindahan ke dalam kuasa pihak lain. 'Diserahkan' mempertahankan cakupan yang lebih luas daripada 'dikhianati'.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: ke dalam tangan manusia
  rationale: Ungkapan 'ke dalam tangan' mempertahankan metafora berada di bawah kuasa orang lain. 'Manusia' secara alami dapat berfungsi kolektif dalam bahasa Indonesia dan mempertahankan permainan kata dengan gelar 'Anak Manusia'.
theological_decisions:
- issue: Penerjemahan gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Insan
  rationale: Bentuk tradisional dan harfiah mempertahankan statusnya sebagai gelar, ambiguitasnya, serta kemungkinan kaitannya dengan Daniel 7.
- issue: Cakupan παραδίδοσθαι
  choice: diserahkan
  alternative: dikhianati
  rationale: '''Diserahkan'' tidak membatasi nubuat ini hanya pada pengkhianatan Yudas, tetapi mencakup penyerahan Yesus ke dalam kuasa manusia.'
- issue: Cakupan ἀνθρώπων
  choice: manusia
  alternative: orang-orang
  rationale: '''Manusia'' mencakup manusia secara umum dan sekaligus mempertahankan kontras verbal yang menonjol dengan ''Anak Manusia''.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Idiom Yunani 'taruhlah ke dalam telingamu' dialihkan menjadi 'camkanlah baik-baik' agar dorongan untuk mendengar serta mengingat dapat dipahami tanpa ungkapan Indonesia yang janggal. Penempatan catatan [a] sesudah klausa penyerahan menandai alternatif bagi 'diserahkan'.
