  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: id
  text: Ia berkata, “Anak Manusia harus menderita banyak hal, ditolak oleh para tua-tua, imam-imam kepala, dan ahli-ahli Taurat, dibunuh, dan pada hari ketiga dibangkitkan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Yunani, kata ini berbentuk pasif: “dibangkitkan”; dapat juga diterjemahkan “bangkit.”'
    reason: Menjelaskan bentuk pasif ἐγερθῆναι dan mencatat alternatif idiomatis tanpa menghilangkan nuansa pasifnya.
lexical_decisions:
- source_word: εἰπὼν
  choice: Ia berkata
  rationale: Partisip aoristis ini memperkenalkan isi perkataan Yesus dan menghubungkannya dengan konteks sebelumnya. Karena ayat disajikan tersendiri, bentuk finit ini lebih alami dalam bahasa Indonesia tanpa mengubah fungsi naratifnya.
- source_word: Δεῖ
  choice: harus
  rationale: Menyatakan keniscayaan, dalam konteks ini keniscayaan dalam rencana Allah. Bentuk 'harus' alami dan kuat dalam bahasa Indonesia tanpa menambahkan pelaku atau penjelasan yang tidak dinyatakan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar khas yang dipakai Yesus tentang diri-Nya serta kaitan antarteksnya, tanpa mengubahnya menjadi parafrasa umum.
- source_word: πολλὰ παθεῖν
  choice: mengalami banyak penderitaan
  rationale: Mengungkapkan keluasan penderitaan yang terkandung dalam πολλὰ dengan bahasa Indonesia yang alami dan jelas.
- source_word: ἀποδοκιμασθῆναι
  choice: ditolak
  rationale: Bentuk pasif ini menyatakan penolakan resmi setelah penilaian; 'ditolak' merupakan padanan modern yang langsung dan jelas.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: oleh para tua-tua, imam-imam kepala, dan ahli-ahli Taurat
  rationale: Dalam konstruksi pasif, ἀπό menandai pihak yang melakukan penolakan. Istilah-istilah ini mempertahankan kelompok kepemimpinan Yahudi yang disebut dalam teks.
- source_word: ἀποκτανθῆναι
  choice: dibunuh
  rationale: Mempertahankan bentuk pasif dan menyampaikan tindakan itu secara langsung tanpa memberi nuansa yuridis tambahan.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: pada hari ketiga
  rationale: Padanan alami bagi datif temporal dan mempertahankan rumusan waktu dalam teks.
- source_word: ἐγερθῆναι
  choice: dibangkitkan
  rationale: Mempertahankan bentuk pasif verba Yunani serta mengisyaratkan tindakan ilahi tanpa menyebutkan pelaku yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Bentuk pasif verba kebangkitan
  choice: dibangkitkan
  alternative: bangkit
  rationale: ἐγερθῆναι adalah infinitif pasif. 'Dibangkitkan' mempertahankan bentuk dan nuansa tindakan ilahi tanpa menetapkan pelaku secara eksplisit.
- issue: Daya keniscayaan Δεῖ
  choice: Anak Manusia harus
  alternative: Perlu bagi Anak Manusia untuk
  rationale: '''Harus'' menyampaikan keniscayaan seluruh rangkaian penderitaan, penolakan, kematian, dan kebangkitan dengan bahasa Indonesia yang wajar, tanpa menjelaskan lebih jauh sumber keniscayaan itu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel mempertahankan rangkaian infinitif Yunani, sementara 'mengalami banyak penderitaan' dipilih agar alami bagi pembaca umum. Istilah kelembagaan Injil dipertahankan dalam bentuk yang lazim.
