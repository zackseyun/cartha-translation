  naturalness: “Lihatlah,”, “berseru,” dan “aku memohon kepadamu” sesuai dengan ragam Indonesia modern yang bermartabat. “Perhatikanlah anak laki-lakiku” alami dan menyampaikan permohonan untuk memberi perhatian/pertolongan, bukan sekadar melihat.
  terminology: “Guru” tepat untuk Διδάσκαλε. “Anak laki-lakiku” mempertahankan υἱός, sementara “satu-satunya anakku” secara wajar menyampaikan μονογενής μοι ἐστιν tanpa menghapus kemungkinan bahwa yang dimaksud adalah satu-satunya anak laki-laki.
