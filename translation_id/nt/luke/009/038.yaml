id: LUK.9.38
reference: Luke 9:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: id
  text: Lihatlah, seorang laki-laki dari antara orang banyak itu berseru, “Guru, aku memohon kepadamu, perhatikanlah anak laki-lakiku, karena ia satu-satunya anakku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena ia satu-satunya anak laki-lakiku.” Secara harfiah, bahasa Yunani menyatakan bahwa ia adalah “satu-satunya” bagi saya; karena sebelumnya ia disebut anak laki-laki, kedua terjemahan itu dimungkinkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dalam alur narasi Lukas tanpa menghilangkannya.
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Menjaga acuan gender yang dinyatakan secara khusus oleh nomina Yunani.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: dari antara orang banyak itu
  rationale: Menggambarkan laki-laki tersebut sebagai salah seorang di tengah kumpulan orang dengan bahasa Indonesia yang wajar.
- source_word: ἐβόησεν
  choice: berseru
  rationale: Menyampaikan suara keras dan permohonan mendesak tanpa menambahkan emosi yang tidak dinyatakan secara eksplisit.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Padanan langsung dan alami bagi sapaan kepada seorang pengajar.
- source_word: δέομαί σου
  choice: aku memohon kepadamu
  rationale: Menangkap kesungguhan permohonan yang lebih kuat daripada sekadar meminta.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: agar engkau memperhatikan
  rationale: Ungkapan ini menunjuk pada perhatian yang sungguh-sungguh, bukan sekadar memandang secara visual, dan dalam konteks menyiratkan harapan akan pertolongan tanpa menyatakannya secara berlebihan.
- source_word: τὸν υἱόν μου
  choice: anakku
  rationale: Dalam bahasa Indonesia, 'anakku' alami dalam konteks ini; jenis kelamin anak telah tersirat dalam konteks sumber, sedangkan catatan kaki mempertahankan kemungkinan penekanan pada anak laki-laki.
- source_word: μονογενής μοί ἐστιν
  choice: dia anak tunggalku
  rationale: Menyampaikan bahwa anak itu adalah satu-satunya anak laki-laki tersebut, sambil mempertahankan kemungkinan terjemahan 'satu-satunya anak laki-lakiku' dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna μονογενής dalam hubungannya dengan υἱός
  choice: anak tunggalku
  alternative: satu-satunya anak laki-lakiku
  rationale: μονογενής menekankan bahwa anak itu satu-satunya atau unik bagi ayahnya. Karena sebelumnya ia disebut υἱός, kedua pemahaman—anak tunggal dan satu-satunya anak laki-laki—dimungkinkan; teks utama memakai ungkapan Indonesia yang paling alami dan catatan kaki menjaga alternatifnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'aku' dan 'engkau' mempertahankan kesungguhan dialog langsung tanpa memakai ragam yang terlalu arkais. Pronomina ilahi tidak dikapitalisasi karena lawan bicara di sini disapa sebagai 'Guru' dan teks Yunani tidak menandai kapitalisasi teologis.
