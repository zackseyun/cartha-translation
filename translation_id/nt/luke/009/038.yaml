  rationale: Revisi mempertahankan informasi gender yang eksplisit dalam υἱός dengan “anak laki-lakiku” dan menerjemahkan μονογενής μοι ἐστιν sebagai “ia satu-satunya anakku.” Catatan kaki menjaga alternatif “satu-satunya anak laki-lakiku” tanpa menambahkan penjelasan leksikal yang tidak perlu. Struktur permohonan dan penanda perhatian ἰδού tetap dipertahankan.
