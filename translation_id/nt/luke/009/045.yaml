id: LUK.9.45
reference: Luke 9:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: id
  text: Namun, mereka tidak memahami perkataan itu[a]. Perkataan itu tersembunyi dari mereka agar mereka tidak menangkapnya[b], dan mereka takut bertanya kepada Yesus tentang perkataan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan”, “pernyataan”, atau “hal” untuk kata Yunani ῥῆμα.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani mengatakan bahwa perkataan itu “tersembunyi dari mereka” tanpa menyebut siapa yang menyembunyikannya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: tidak memahami
  rationale: Dalam konteks ini, kata kerja tersebut menyatakan kegagalan murid-murid menangkap maksud ucapan Yesus, bukan sekadar tidak mengetahui informasi.
- source_word: ῥῆμα
  choice: perkataan
  rationale: Kata ini menunjuk pada ucapan tertentu yang baru saja disampaikan Yesus. “Perkataan” alami dalam bahasa Indonesia dan tetap berfokus pada sesuatu yang diucapkan.
- source_word: παρακεκαλυμμένον
  choice: tersembunyi
  rationale: Bentuk pasif menyatakan keadaan tertutup atau tersembunyi tanpa menyebut pelakunya. Pilihan ini mempertahankan kepasifan dan tidak menambahkan agen.
- source_word: ἀπ’ αὐτῶν
  choice: dari mereka
  rationale: Frasa ini secara wajar menyatakan bahwa perkataan tersebut tersembunyi dari mereka.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: sehingga mereka tidak menangkap maknanya
  rationale: αἰσθάνομαι mengandung gagasan menyadari atau menangkap. Ungkapan ini alami dalam bahasa Indonesia dan membedakannya dari ἠγνόουν, sambil menjelaskan bahwa yang tidak mereka tangkap ialah makna perkataan itu.
- source_word: ἐφοβοῦντο
  choice: mereka takut
  rationale: Pilihan ini secara alami menyatakan keadaan takut yang sedang berlangsung.
- source_word: ἐρωτῆσαι αὐτόν
  choice: bertanya kepada Yesus
  rationale: Kata “bertanya” merupakan padanan paling alami dalam konteks meminta penjelasan. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku yang menyembunyikan perkataan itu
  choice: Mempertahankan konstruksi pasif tanpa menyebut pelaku
  alternative: Menyatakan bahwa Allah menyembunyikannya, atau bahwa perkataan itu sekadar tetap tidak jelas bagi mereka
  rationale: Teks Yunani tidak menyebut siapa yang menyebabkan perkataan itu tersembunyi. Bentuk pasif dipertahankan agar ketegangan teologis tidak diselesaikan secara diam-diam.
- issue: Nuansa ἵνα dalam hubungan dengan ketidakmengertian para murid
  choice: “sehingga”
  alternative: “supaya” atau “agar”
  rationale: ἵνα dapat menyatakan tujuan atau hasil dalam konteks ini. “Sehingga” mempertahankan hubungan erat dengan keadaan tersembunyi tanpa terlalu tegas menetapkan adanya maksud dari pelaku tertentu yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan bentuk pasif dan ketidakjelasan pelaku dalam teks sumber tetap dipertahankan.
