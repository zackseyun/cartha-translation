  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: id
  text: Ketika Petrus sedang mengatakan hal-hal itu, muncullah awan yang mulai menaungi mereka.[a] Mereka menjadi takut ketika masuk ke dalam awan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “muncullah awan yang menaungi mereka.” Bentuk kata Yunani dapat diterjemahkan tanpa menonjolkan awal berlangsungnya tindakan.
    reason: lexical_alternative
  - marker: b
    text: Awan ini tampaknya menggemakan berbagai peristiwa dalam Perjanjian Lama ketika kehadiran Allah dinyatakan, meskipun ayat ini tidak menyatakannya secara eksplisit.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: Ketika Petrus masih mengatakan hal-hal itu
  rationale: Konstruksi genitif absolut dengan partisipel kini menyatakan tindakan yang sedang berlangsung. Nama Petrus dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia, berdasarkan konteks langsung ayat sebelumnya; bentuk jamak ταῦτα dipertahankan sebagai 'hal-hal itu'.
- source_word: ἐγένετο νεφέλη
  choice: muncullah awan
  rationale: ἐγένετο memperkenalkan kemunculan atau hadirnya awan. 'Muncullah' alami dalam narasi Indonesia dan tidak menentukan dari mana awan itu berasal.
- source_word: ἐπεσκίαζεν
  choice: mulai menaungi
  rationale: Imperfek dapat menggambarkan tindakan yang mulai atau sedang berlangsung. 'Menaungi' mempertahankan citra awan yang meliputi mereka tanpa menambahkan identifikasi teologis eksplisit.
- source_word: ἐφοβήθησαν
  choice: mereka menjadi takut
  rationale: Aoristus ini secara wajar menyatakan timbulnya rasa takut; 'menjadi takut' mempertahankan nuansa perubahan keadaan.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς εἰς τὴν νεφέλην
  choice: ketika masuk ke dalam awan itu
  rationale: Infinitif artikular dengan ἐν menyatakan waktu yang bersamaan. εἰς menunjukkan gerak masuk ke dalam awan, bukan sekadar berada di bawahnya. Subjek tersirat dalam bahasa Indonesia tetap 'mereka' dari klausa utama.
theological_decisions:
- issue: Hakikat awan dan tindakannya
  choice: Awan dan tindakannya digambarkan tanpa secara eksplisit menyebutnya sebagai kehadiran Allah.
  alternative: Menjelaskannya dalam teks utama sebagai awan kemuliaan atau manifestasi kehadiran Allah.
  rationale: Konteksnya kuat menggemakan adegan Perjanjian Lama tentang kehadiran Allah, tetapi ayat ini sendiri hanya menyebut awan yang menaungi mereka. Terjemahan mempertahankan gema teologis itu tanpa menjadikannya penjelasan eksplisit.
- issue: Acuan αὐτούς dalam frasa masuk ke dalam awan
  choice: Diterjemahkan sebagai 'mereka', selaras dengan subjek rasa takut dan pembacaan teks utama SBLGNT.
  alternative: Memahami acuan itu secara lebih terbatas sebagai orang-orang tertentu dalam adegan tersebut.
  rationale: Bentuk Yunani memungkinkan pembaca mengikuti acuan pronominal dari konteks, sehingga terjemahan tidak mempersempit kelompok itu lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Petrus' memperjelas subjek yang dalam bahasa Yunani dinyatakan dengan pronomina, sedangkan 'hal-hal itu' mempertahankan bentuk jamak. Penanda catatan kaki [a] dan [b] ditempatkan pada bagian teks yang masing-masing dijelaskan.
