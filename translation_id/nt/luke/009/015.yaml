  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: id
  text: Mereka pun melakukannya dan menyuruh semua orang duduk[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “membaringkan semua orang” atau “menyuruh semua orang berbaring.” Kata Yunani ini menunjuk pada pengaturan orang-orang untuk makan, sering kali dalam posisi berbaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: pun
  rationale: Dalam klausa pertama, καὶ menghubungkan tindakan ini dengan perintah sebelumnya; partikel «pun» menyampaikan kelanjutan naratif secara alami dalam bahasa Indonesia.
- source_word: ἐποίησαν
  choice: melakukannya
  rationale: Bentuk aoris ini merujuk kembali pada perintah Yesus dalam ayat sebelumnya. Akhiran «-nya» membuat rujukan tersebut wajar tanpa mengulang isi perintah.
- source_word: οὕτως
  choice: (tercakup dalam «melakukannya»)
  rationale: οὕτως berarti «demikian» atau «seperti itu». Dalam bahasa Indonesia, gabungan ἐποίησαν οὕτως paling alami diterjemahkan «melakukannya»; makna rujukannya tetap terpelihara tanpa ungkapan kaku «berbuat demikian».
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini mengoordinasikan tindakan kedua dengan tindakan pertama dan mempertahankan urutan naratif sederhana.
- source_word: κατέκλιναν
  choice: menyuruh ... duduk
  rationale: κατακλίνω di sini bersifat kausatif dan menggambarkan pengaturan orang-orang untuk makan, yang pada masa itu lazimnya dalam posisi berbaring. «Menyuruh ... duduk» menyampaikan tindakan kausatif dengan jelas dan wajar bagi pembaca Indonesia modern.
- source_word: ἅπαντας
  choice: semua orang
  rationale: Bentuk akusatif maskulin jamak ini mencakup seluruh orang banyak. «Semua orang» menyatakan totalitas secara jelas dalam konstruksi Indonesia.
