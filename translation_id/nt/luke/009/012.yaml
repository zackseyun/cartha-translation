translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat langsung dibuat alami bagi pembaca umum. Sebutan 'Kedua Belas' dipertahankan sebagai gelar kelompok, dan ambiguitas ἔρημος serta keluasan makna ἐπισιτισμός dijelaskan dalam catatan kaki.
