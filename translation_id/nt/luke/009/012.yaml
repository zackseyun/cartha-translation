source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: id
  text: Hari mulai beranjak senja. Kedua Belas datang kepada Yesus dan berkata, “Suruhlah orang banyak itu pergi supaya mereka dapat menuju desa-desa dan daerah pedesaan di sekitar sini untuk mendapatkan tempat menginap dan memperoleh bekal makanan[a], sebab kita berada di tempat yang sepi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendapatkan makanan.” Kata Yunani ἐπισιτισμός berarti makanan, bekal, atau persediaan makanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat yang terpencil” atau “tempat yang tidak berpenghuni.” Kata Yunani ἔρημος dapat menunjuk daerah yang sepi atau jarang dihuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Hari mulai beranjak senja
  rationale: Ungkapan κλίνειν bersama ἡμέρα secara idiomatis menyatakan bahwa hari bergerak menuju petang. 'Beranjak senja' mempertahankan gambaran peralihan waktu dalam bahasa Indonesia yang alami.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: Kedua Belas datang kepada Yesus
  rationale: προσέρχομαι berarti datang atau mendekat kepada seseorang. 'Kedua Belas' mempertahankan sebutan οἱ δώδεκα tanpa menambahkan 'rasul' atau 'murid'; nama Yesus dipakai sebagai pengganti rujukan pronominal agar jelas dan alami dalam bahasa Indonesia.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Suruhlah orang banyak itu pergi
  rationale: Dalam konteks ini ἀπολύω berarti menyuruh pergi atau membubarkan. Pilihan ini menyampaikan perintah secara alami tanpa kesan bahwa mereka sedang ditahan.
- source_word: ἵνα πορευθέντες
  choice: supaya mereka dapat menuju
  rationale: Partisip πορευθέντες berada dalam klausa tujuan dengan ἵνα. Bentuk ini dialihkan secara wajar sebagai tindakan yang dimaksudkan, tanpa terjemahan kaku 'setelah pergi'.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: desa-desa dan daerah pedesaan di sekitar sini
  rationale: κώμαι adalah desa-desa, sedangkan ἀγροί di sini menunjuk kawasan pedesaan atau tempat-tempat di luar permukiman. κύκλῳ menyatakan kawasan sekeliling.
- source_word: καταλύσωσιν
  choice: mencari tempat menginap
  rationale: καταλύω dalam konteks perjalanan berarti memperoleh atau memakai tempat bermalam. Ungkapan ini membuat maksudnya jelas dalam bahasa Indonesia.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: memperoleh bekal makanan
  rationale: ἐπισιτισμός menunjuk persediaan atau bekal untuk dimakan. 'Bekal makanan' mempertahankan nuansa persediaan, bukan sekadar satu hidangan.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: sebab kita berada di tempat yang sepi
  rationale: ἔρημος dapat menggambarkan tempat yang sepi, terpencil, atau minim penghuni dan sumber daya. 'Tempat yang sepi' alami dalam konteks ini dan tidak mengimpor gambaran gurun pasir yang tidak dituntut teks.
