  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: id
  text: Ia memanggil kedua belas orang itu untuk berkumpul, lalu memberi mereka kuasa dan wewenang atas semua setan serta untuk menyembuhkan penyakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: memanggil ... untuk berkumpul
  rationale: Bentuk partisip aoris ini mengiringi verba utama dan menyatakan tindakan yang mendahului pemberian kuasa. Ungkapan ini juga mempertahankan unsur συν-, yaitu memanggil mereka bersama-sama.
- source_word: δὲ
  choice: Kemudian
  rationale: Partikel ini merupakan penghubung naratif ringan, bukan penanda pertentangan yang kuat.
- source_word: τοὺς δώδεκα
  choice: kedua belas orang itu
  rationale: Teks Yunani hanya menyebut 'kedua belas'; kata 'murid' atau 'rasul' tidak ditambahkan. Kata 'orang' dipakai sebagai penggolong alami dalam bahasa Indonesia.
- source_word: ἔδωκεν
  choice: memberi
  rationale: Padanan langsung dan wajar bagi bentuk aoris δίδωμι.
- source_word: δύναμιν
  choice: kuasa
  rationale: Menunjukkan daya atau kemampuan untuk bertindak, khususnya dalam pelayanan mukjizat.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menunjukkan hak atau otoritas yang diberikan untuk menggunakan kuasa; dibedakan dari δύναμις.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: atas semua setan
  rationale: ἐπί dengan akusatif di sini menyatakan lingkup kekuasaan. 'Semua setan' merupakan ungkapan Indonesia yang alami dan tidak mengganti δαιμόνια dengan istilah lain yang lebih interpretatif.
- source_word: νόσους
  choice: penyakit
  rationale: Padanan umum dan konkret bagi νόσος; bentuk tanpa pengulangan tetap dapat bermakna jamak secara generik dalam bahasa Indonesia.
- source_word: θεραπεύειν
  choice: untuk menyembuhkan
  rationale: Infinitif kini menyatakan tindakan yang dimungkinkan oleh kuasa dan wewenang yang diberikan.
theological_decisions:
- issue: Pembedaan δύναμις dan ἐξουσία
  choice: kuasa dan wewenang
  alternative: kekuasaan; kuasa dan hak
  rationale: Kedua istilah dipertahankan agar kemampuan dan otoritas yang diberikan tidak dilebur menjadi satu gagasan.
- issue: Sebutan bagi τοὺς δώδεκα
  choice: kedua belas orang itu
  alternative: kedua belas murid; kedua belas rasul
  rationale: Teks ayat ini tidak menyebut mereka sebagai murid atau rasul, sehingga terjemahan tidak memasukkan sebutan dari konteks lain.
- issue: Identitas subjek tersirat
  choice: Ia
  alternative: Yesus
  rationale: Bahasa Yunani hanya menyiratkan subjek melalui bentuk verba. Kata ganti mempertahankan kesinambungan konteks tanpa menambahkan nama yang tidak tertulis dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan urutan tindakan serta pasangan 'kuasa dan wewenang'. Huruf kapital pada 'Ia' mengikuti kebiasaan hormat dalam penulisan Kristen Indonesia tanpa mengubah isi leksikal.
