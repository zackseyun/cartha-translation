  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: id
  text: Sebab, apa untungnya bagi seseorang jika ia memperoleh seluruh dunia, tetapi kehilangan dirinya sendiri[a] atau mengalami kerugian pada dirinya sendiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “dirinya sendiri.” Ungkapan ini dapat pula dipahami sebagai “hidupnya” atau “nyawanya,” tetapi teks memakai kata ganti refleksif, bukan kata yang lazim untuk “jiwa” atau “hidup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Sebab, apa untungnya bagi
  rationale: Mempertahankan daya penjelas γάρ dan mengungkapkan pertanyaan retoris tentang manfaat atau keuntungan dengan idiom Indonesia yang wajar.
- source_word: ἄνθρωπος
  choice: seseorang
  rationale: Ἄνθρωπος di sini bersifat generik dan menunjuk kepada siapa pun; “seseorang” menyampaikan cakupan itu secara alami dalam bahasa Indonesia.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: jika ia memperoleh seluruh dunia
  rationale: Partisip aoris menyatakan keadaan hipotetis dalam pertanyaan ini. “Memperoleh” menghindari pengulangan kata “untung” dan mencakup gagasan mendapatkan segala keuntungan duniawi.
- source_word: ἑαυτὸν δὲ ἀπολέσας
  choice: tetapi kehilangan dirinya sendiri
  rationale: Menerjemahkan kata ganti refleksif ἑαυτόν secara langsung tanpa mempersempitnya menjadi “jiwa” atau “nyawa”; δέ menyatakan kontras.
- source_word: ἢ ζημιωθείς
  choice: atau menderita kerugian
  rationale: Mempertahankan hubungan alternatif yang ditandai ἤ dan bentuk pasif ζημιωθείς. Ungkapan ini menjaga perbedaan nuansa dari “kehilangan” tanpa menambahkan objek yang tidak dinyatakan secara eksplisit pada partisip kedua.
theological_decisions:
- issue: Arti ἑαυτόν dalam kaitannya dengan nasib manusia
  choice: dirinya sendiri
  alternative: jiwanya; nyawanya; hidupnya
  rationale: Teks Yunani memakai kata ganti refleksif, bukan ψυχή. Pilihan ini mempertahankan cakupan antropologis yang luas dan tidak membatasi perkataan itu hanya pada jiwa tak berwujud atau kehidupan jasmani.
- issue: Hubungan antara ἀπολέσας dan ζημιωθείς
  choice: kehilangan dirinya sendiri atau menderita kerugian
  alternative: kehilangan atau mengorbankan dirinya sendiri
  rationale: Susunan Yunani secara eksplisit menempatkan ἑαυτόν sebagai objek “kehilangan”, sedangkan ζημιωθείς berbentuk pasif dan berarti mengalami atau menderita kerugian. Terjemahan ini mempertahankan ketegangan dan sedikit ketaksaan sintaksis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk “apa untungnya bagi seseorang” menyampaikan pertanyaan retoris dengan alami, sedangkan “menderita kerugian” mempertahankan nuansa pasif pada kata Yunani terakhir.
