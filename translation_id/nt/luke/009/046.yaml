    issue: Ungkapan “yang kiranya paling besar” tidak alami dan kurang tegas menyatakan potensi ἂν εἴη.
    rationale: Dalam pemakaian Indonesia modern, “kiranya” dapat terdengar arkais atau berfungsi sebagai penanda dugaan/harapan yang tidak jelas dalam klausa relatif ini. “Yang mungkin menjadi yang terbesar” menyampaikan pertanyaan terbuka mengenai siapa yang dapat/akan menjadi terbesar tanpa mengubah makna.
  revised_text: Kemudian timbullah perdebatan di antara mereka tentang siapa di antara mereka yang mungkin menjadi yang terbesar.[a]
