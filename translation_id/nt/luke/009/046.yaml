  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: id
  text: Kemudian timbullah perdebatan di antara mereka tentang siapa di antara mereka yang mungkin menjadi yang terbesar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “muncullah suatu pemikiran” atau “timbullah pembicaraan di antara mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: timbullah
  rationale: Secara harfiah berarti 'masuk', tetapi bersama διαλογισμός bentuk idiomatis ini menyatakan bahwa suatu pemikiran atau perdebatan mulai muncul. 'Timbullah' alami dalam bahasa Indonesia dan mempertahankan aspek peristiwa.
- source_word: δὲ
  choice: Kemudian
  rationale: Penghubung ringan yang meneruskan alur cerita; 'Kemudian' sesuai dengan perkembangan narasi tanpa memberi tekanan berlebihan.
- source_word: διαλογισμὸς
  choice: perdebatan
  rationale: Kata ini dapat menunjuk pada pemikiran, pertimbangan, atau pembicaraan yang mengandung perdebatan. Isi pertanyaan tentang kedudukan terbesar mendukung nuansa persaingan, tetapi alternatif yang lebih netral tetap dicatat.
- source_word: ἐν αὐτοῖς
  choice: di antara mereka
  rationale: Walaupun secara bentuk dapat berarti 'di dalam mereka', dengan acuan jamak ungkapan ini secara wajar dipahami sebagai sesuatu yang terjadi di tengah kelompok mereka.
- source_word: τὸ τίς ἂν εἴη
  choice: tentang siapa ... yang kiranya
  rationale: Konstruksi ini memperkenalkan isi perdebatan. 'Kiranya' mempertahankan nuansa kemungkinan dari ἄν dengan optatif tanpa membuat kalimat Indonesia terasa kaku.
- source_word: μείζων
  choice: paling besar
  rationale: Bentuk Yunani adalah komparatif, 'lebih besar', tetapi dalam perbandingan seluruh anggota suatu kelompok maksud idiomatisnya adalah siapa yang berkedudukan tertinggi; bahasa Indonesia alami memakai 'paling besar'.
- source_word: αὐτῶν
  choice: di antara mereka
  rationale: Genitif ini menentukan kelompok yang dibandingkan. Pengulangan 'di antara mereka' jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat interaksi para murid
  choice: perdebatan
  alternative: pemikiran atau pembicaraan
  rationale: Konteks pertanyaan kompetitif mengenai siapa yang paling besar mendukung adanya perdebatan, tetapi kata Yunani juga dapat menggambarkan penalaran atau pembicaraan; catatan kaki mempertahankan keluasan maknanya.
- issue: Tingkat kebesaran yang dipersoalkan
  choice: paling besar
  alternative: lebih besar
  rationale: Terjemahan superlatif menyampaikan perbandingan kedudukan dalam seluruh kelompok secara idiomatis, tanpa menentukan secara teologis jenis kebesaran yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. 'Kiranya' dipakai untuk mempertahankan nuansa kemungkinan tanpa menjadi terlalu arkais; 'paling besar' mempertahankan ungkapan kebesaran yang sengaja tidak diperjelas menjadi kuasa, status, atau keutamaan tertentu.
