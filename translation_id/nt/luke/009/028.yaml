  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: id
  text: Kira-kira delapan hari setelah perkataan ini[a], Yesus membawa serta Petrus, Yohanes, dan Yakobus, lalu naik ke gunung untuk berdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setelah kata-kata ini.” Kata Yunani λόγους dapat diterjemahkan sebagai “perkataan” atau “kata-kata” di sini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Ungkapan ini berfungsi sebagai peralihan naratif. Dalam bahasa Indonesia modern, alur sudah tersampaikan secara alami oleh keterangan waktu di awal kalimat tanpa perlu menambahkan 'Kemudian' atau 'Terjadilah'.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: setelah perkataan-perkataan ini
  rationale: λόγους menunjuk pada ucapan yang mendahului ayat ini. 'Perkataan-perkataan' mempertahankan rujukan pada materi yang diucapkan dan lebih wajar daripada 'kata-kata' dalam konteks ini.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: kira-kira delapan hari
  rationale: ὡσεὶ menyatakan perkiraan, sehingga unsur ketidakpastian kronologis perlu dipertahankan.
- source_word: παραλαβὼν
  choice: Yesus mengajak
  rationale: Kata ini menyatakan bahwa ia membawa ketiga murid itu bersamanya. 'Mengajak' alami dalam bahasa Indonesia dan menyampaikan bahwa mereka ikut bersama Yesus; nama 'Yesus' dipakai untuk memperjelas subjek yang tersirat dari konteks.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Petrus, Yohanes, dan Yakobus
  rationale: Nama-nama memakai bentuk Indonesia yang mapan. Daftar dengan koma lebih alami daripada mengulang 'dan' tanpa mengubah makna.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: naik ke gunung
  rationale: Terjemahan ini mempertahankan gerak mendaki dan tujuan ke kawasan gunung. Artikel Yunani tidak harus menunjukkan sebuah gunung yang sebelumnya telah diidentifikasi, sehingga tidak ditambahkan 'gunung itu'.
- source_word: προσεύξασθαι
  choice: untuk berdoa
  rationale: Infinitif ini menyatakan tujuan pendakian secara langsung dan alami.
theological_decisions:
- issue: Perkiraan waktu dalam kaitannya dengan kisah-kisah paralel
  choice: kira-kira delapan hari
  alternative: delapan hari; sekitar delapan hari
  rationale: Kata ὡσεὶ secara eksplisit menandai perkiraan. Terjemahan tidak menyelaraskan angka ini dengan catatan Injil lain dan tidak menjadikannya angka yang persis.
- issue: Subjek tersirat dari παραλαβὼν dan ἀνέβη
  choice: Yesus disebut secara eksplisit
  alternative: ia
  rationale: Bahasa Yunani membiarkan subjek dipahami dari konteks. Menyebut 'Yesus' menghindari ketidakjelasan bagi pembaca Indonesia tanpa menambah klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan perkiraan waktu di depan, memakai nama-nama Alkitab yang lazim dalam bahasa Indonesia, serta menghindari ungkapan harfiah yang kaku.
