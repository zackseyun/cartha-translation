  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: id
  text: Ketika para rasul kembali, mereka menceritakan kepada Yesus segala sesuatu yang telah mereka lakukan. Lalu Yesus mengajak mereka dan menyingkir secara tersendiri[a] ke sebuah kota bernama Betsaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara pribadi” atau “menyendiri.” Ungkapan ini menunjukkan bahwa Yesus dan para rasul menyingkir dari orang banyak, bukan bahwa Yesus pergi seorang diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: ketika ... kembali
  rationale: Partisip aoris menyatakan tindakan yang mendahului pelaporan; bentuk temporal ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: οἱ ἀπόστολοι
  choice: para rasul
  rationale: Dalam konteks pengutusan di Lukas, istilah ini merupakan sebutan yang sudah dikenal bagi kedua belas murid yang diutus.
- source_word: διηγήσαντο αὐτῷ
  choice: mereka menceritakan kepada Yesus
  rationale: Kata kerja ini berarti menuturkan atau melaporkan kembali. Nama Yesus dipakai untuk memperjelas acuan pronomina secara alami tanpa mengubah makna.
- source_word: ὅσα ἐποίησαν
  choice: segala sesuatu yang telah mereka lakukan
  rationale: ὅσα mencakup semua hal yang mereka lakukan; 'telah' menandai bahwa tindakan itu mendahului penceritaan.
- source_word: παραλαβὼν αὐτούς
  choice: membawa mereka serta
  rationale: παραλαμβάνω di sini menyatakan membawa orang lain bersama sebagai pendamping.
- source_word: ὑπεχώρησεν
  choice: menyingkir
  rationale: Pilihan ini mempertahankan nuansa menarik diri dari kegiatan umum atau orang banyak, bukan sekadar berangkat.
- source_word: κατ’ ἰδίαν
  choice: bersama mereka
  rationale: Dalam konteks ini frasa tersebut menunjukkan penarikan diri secara tersendiri dari orang banyak. Karena Yesus membawa para rasul, ungkapan ini tidak boleh menyiratkan bahwa Ia sendirian.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: ke sebuah kota bernama Betsaida
  rationale: πόλις menunjuk tempat permukiman dan secara formal diterjemahkan 'kota'; καλουμένην disampaikan secara alami dengan 'bernama', sedangkan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
theological_decisions:
- issue: Makna κατ’ ἰδίαν ketika para rasul menyertai Yesus
  choice: menyingkir bersama mereka
  alternative: menyingkir secara tersendiri; pergi diam-diam; menyendiri
  rationale: Teks menyatakan bahwa Yesus membawa para rasul. Karena itu, frasa tersebut dipahami sebagai pemisahan kelompok Yesus dan para rasul dari khalayak, bukan kesendirian mutlak. Catatan kaki mempertahankan alternatif leksikal dan batas maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum. Pengulangan nama Yesus memperjelas pelaku dan penerima laporan, sementara catatan kaki menjaga ambiguitas κατ’ ἰδίαν tanpa menimbulkan kesan bahwa Yesus sendirian.
