translation:
  language: id
  text: Namun, Yesus berpaling lalu menegur mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah yang lebih kemudian menambahkan: “dan berkata, ‘Kalian tidak tahu, roh macam apa yang ada pada kalian; sebab Anak Manusia datang bukan untuk membinasakan nyawa manusia, melainkan untuk menyelamatkannya.’”'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: berpaling
  rationale: Partisip aoristus ini menggambarkan Yesus mengalihkan tubuh atau pandangan-Nya kepada para murid. “Berpaling” alami dalam narasi Indonesia dan tidak menambahkan arah yang tidak dinyatakan teks.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai perkembangan narasi dengan kontras ringan terhadap permintaan para murid sebelumnya. “Namun” menyampaikan kontras itu dengan wajar dan bermartabat.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: Kata kerja ini menyatakan teguran atau kecaman yang tegas. “Menegur” merupakan padanan Indonesia yang alami dan cukup kuat tanpa memperluas isi teguran yang tidak dicatat dalam bacaan pendek.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif jamak ini mengacu kepada Yakobus dan Yohanes, atau kepada para murid dalam konteks. Dalam bahasa Indonesia, “menegur mereka” adalah konstruksi langsung yang idiomatis.
theological_decisions:
- issue: Tambahan panjang yang terdapat dalam sejumlah naskah kemudian
  choice: 'Teks utama hanya menerjemahkan bacaan SBLGNT: “Namun, Yesus berpaling lalu menegur mereka.”'
  alternative: “Namun, Yesus berpaling lalu menegur mereka dan berkata, ‘Kalian tidak tahu roh macam apa yang menguasai kalian; sebab Anak Manusia datang bukan untuk membinasakan nyawa manusia, melainkan untuk menyelamatkannya.’”
  rationale: Sumber Yunani yang diberikan memuat bacaan pendek. Tambahan panjang tidak dimasukkan ke dalam teks utama, tetapi dicatat karena dikenal dalam tradisi naskah dan sejarah penerjemahan. Rumusan catatan mempertahankan isi varian tanpa menjadikannya bagian dari bacaan utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama “Yesus” dinyatakan untuk memperjelas subjek yang tersirat dalam bentuk verba Yunani dan sudah jelas dari konteks. Penanda catatan kaki [a] dicantumkan tepat setelah kalimat utama.
