  source_fidelity: Draf secara umum setia pada larangan membawa perlengkapan perjalanan dan dengan tepat menerjemahkan ἀργύριον secara kontekstual sebagai “uang.” Namun, konstruksi “masing-masing juga jangan mempunyai” tidak tertata secara idiomatis dalam bahasa Indonesia. Frasa terakhir perlu dirumuskan ulang agar daya distributif ἀνά (“masing-masing”) tetap jelas tanpa mengubah ἔχειν menjadi “membawa.”
  naturalness: Deretan “jangan tongkat, jangan tas bekal, jangan roti, dan jangan uang” terasa eliptis dan kurang alami dalam bahasa Indonesia modern. Struktur “baik … maupun …” memberikan larangan yang jelas dan tetap mempertahankan cakupan daftar Yunani. “Janganlah setiap orang memiliki dua helai tunik” adalah bentuk yang lugas dan alami.
  terminology: “Tongkat,” “tas bekal,” “roti,” “uang,” dan “tunik” sesuai dengan konteks dan register. Catatan untuk tunik berguna; “seorang” dalam kutipan alternatif sebaiknya dihindari karena tidak lazim dalam bahasa Indonesia modern.
