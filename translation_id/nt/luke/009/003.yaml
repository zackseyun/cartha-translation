  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Jangan membawa apa pun untuk perjalanan—baik tongkat, tas bekal, roti, maupun uang[a]—dan janganlah setiap orang memiliki dua helai tunik[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perak”; di sini maksudnya uang.'
    reason: lexical_alternative
  - marker: b
    text: Tunik adalah pakaian yang dikenakan langsung pada tubuh pada zaman itu. Ungkapan Yunaninya berarti “masing-masing dua tunik” atau “dua tunik untuk setiap orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Jangan membawa apa pun untuk perjalanan
  rationale: Ungkapan ini menyampaikan larangan menyiapkan atau membawa perlengkapan perjalanan secara alami dalam bahasa Indonesia, dengan tetap mempertahankan cakupan tegas Μηδὲν.
- source_word: ῥάβδον
  choice: tongkat
  rationale: Dalam konteks perjalanan, kata ini menunjuk pada tongkat yang dibawa pejalan kaki; 'tongkat' ringkas, wajar, dan tidak mempersempit maknanya secara berlebihan.
- source_word: πήραν
  choice: tas bekal
  rationale: πήρα adalah tas untuk membawa bekal atau perlengkapan perjalanan. 'Tas bekal' lebih informatif daripada sekadar 'tas' dan tetap mudah dipahami.
- source_word: ἄρτον
  choice: roti
  rationale: Terjemahan konkret ini mempertahankan benda yang disebut dalam teks tanpa menggeneralisasikannya menjadi makanan.
- source_word: ἀργύριον
  choice: uang
  rationale: Secara harfiah berarti 'perak', tetapi dalam konteks ini perak berfungsi sebagai uang; padanan fungsional 'uang' paling alami bagi pembaca modern.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: masing-masing juga jangan mempunyai dua helai tunik
  rationale: ἀνά bersama angka menyatakan pembagian, yaitu dua untuk setiap orang. 'Masing-masing' mempertahankan unsur distributif, sedangkan 'mempunyai' mengikuti ἔχειν tanpa menyamainya secara diam-diam dengan 'membawa'.
- source_word: χιτῶνας
  choice: tunik
  rationale: '''Tunik'' mempertahankan jenis pakaian kuno yang dimaksud dan lebih tepat daripada padanan modern seperti ''kemeja''.'
theological_decisions:
- issue: Apakah perintah terakhir berarti tidak membawa tunik cadangan atau secara mutlak tidak memiliki dua tunik
  choice: mempunyai dua helai tunik
  alternative: membawa dua helai tunik
  rationale: Teks Yunani memakai ἔχειν ('mempunyai'), bukan mengulang αἴρετε ('membawa'). Terjemahan mempertahankan bentuk sumber dan tidak mempersempit larangan menjadi tindakan membawa saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'jangan' mempertahankan tekanan deretan μήτε dalam bahasa Yunani. Istilah historis 'tunik' dipertahankan dan dijelaskan dalam catatan kaki.
