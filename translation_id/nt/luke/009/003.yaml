    rationale: Pengulangan “jangan” sebelum setiap nomina dapat dipahami, tetapi “jangan tongkat” dan “jangan uang” kurang wajar. “Baik … maupun …” menyampaikan deretan μήτε dengan bahasa Indonesia yang lebih lancar.
