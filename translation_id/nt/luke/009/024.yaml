  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: id
  text: Sebab siapa pun yang ingin menyelamatkan nyawanya akan kehilangan nyawanya[a], tetapi siapa pun yang kehilangan nyawanya demi Aku akan menyelamatkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupnya,” “jiwanya,” atau “dirinya”; kata Yunani yang digunakan dapat berarti nyawa, hidup, jiwa, atau diri, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Sebab siapa pun yang ingin
  rationale: ὃς ... ἂν dengan bentuk subjungtif menyatakan kondisi umum, sehingga 'siapa pun' paling wajar. γάρ mempertahankan hubungan penjelas dengan perkataan sebelumnya melalui 'Sebab', dan θέλῃ diterjemahkan 'ingin'.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nyawanya
  rationale: Dalam paradoks tentang menyelamatkan dan kehilangan keberadaan seseorang, ψυχή terutama menunjuk pada nyawa atau hidup. 'Nyawa' memungkinkan rujukan pronominal yang alami dan tidak membatasi makna pada jiwa sebagai unsur nonjasmani; keluasan maknanya dicatat dalam catatan kaki.
- source_word: σῶσαι / σώσει
  choice: menyelamatkan / akan menyelamatkan
  rationale: Pemakaian akar kata yang sama dipertahankan untuk menjaga kesejajaran dan paradoks teks Yunani, meskipun dalam konteks ini kata tersebut juga dapat bernuansa mempertahankan.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: akan kehilangan / kehilangan
  rationale: '''Kehilangan'' paling tepat bagi ἀπόλλυμι dalam konteks ini dan mempertahankan simetri retoris tanpa memberi kesan bahwa orang itu secara langsung membinasakan dirinya.'
- source_word: ἕνεκεν ἐμοῦ
  choice: karena Aku
  rationale: ἕνεκεν dengan genitif menyatakan sebab atau alasan. 'Karena Aku' alami dalam bahasa Indonesia dan mempertahankan pusat personal dari tuntutan kemuridan ini.
- source_word: οὗτος σώσει αὐτήν
  choice: akan menyelamatkannya
  rationale: Kata tunjuk οὗτος memberi penegasan pada orang yang baru disebut. Dalam bahasa Indonesia, subjek klausa 'siapa pun yang...' secara alami berlanjut ke predikat ini; menerjemahkan οὗτος secara kaku sebagai 'orang inilah' akan terasa berat. Akhiran '-nya' merujuk kembali kepada 'nyawanya'.
theological_decisions:
- issue: Makna ψυχή dalam paradoks Yesus
  choice: nyawa
  alternative: hidup; jiwa; diri
  rationale: Konteks berbicara tentang kemuridan, penyangkalan diri, serta paradoks mempertahankan atau kehilangan kehidupan karena Yesus. 'Nyawa' menyampaikan arti langsung tanpa menyempitkan ψυχή menjadi jiwa nonjasmani saja. Kemungkinan makna lain dipertahankan dalam catatan kaki.
- issue: Rujukan maskulin generik
  choice: siapa pun ... nyawanya
  alternative: barang siapa ... hidupnya sendiri
  rationale: Bahasa Indonesia tidak perlu menandai gender pada ungkapan generik ini. Bentuk tunggal dan cakupan universal teks Yunani dipertahankan melalui 'siapa pun' dan '-nya'.
- issue: Daya penegas οὗτος
  choice: disampaikan melalui struktur kontras alami tanpa kata tunjuk eksplisit
  alternative: orang itulah yang akan menyelamatkannya
  rationale: οὗτος menyoroti orang yang memenuhi kondisi kedua, tetapi bentuk eksplisit 'orang itulah' terasa berlebihan dalam kalimat Indonesia ini. Kontras 'tetapi siapa pun...' tetap menyampaikan fokus tersebut tanpa menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Sebab' mempertahankan kaitan penjelas γάρ; 'siapa pun' dipilih daripada 'barang siapa' agar lebih modern. Huruf kapital pada 'Aku' mengikuti kebiasaan penulisan pronomina yang merujuk kepada Yesus dalam terjemahan Alkitab Indonesia.
