  terminology: “Roti,” “ikan,” “murid-murid,” dan “orang banyak” tepat untuk register Indonesia modern. “Memberkati” mempertahankan εὐλόγησεν dan tidak menyelaraskannya secara diam-diam dengan εὐχαριστέω dalam kisah-kisah sejajar.
