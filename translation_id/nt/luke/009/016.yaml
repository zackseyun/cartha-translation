  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: id
  text: Lalu Yesus mengambil lima roti dan dua ikan itu. Ia menengadah ke langit, memberkati roti dan ikan itu[a], lalu memecah-mecahkannya. Ia terus memberikannya kepada murid-murid untuk dihidangkan kepada orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengucap syukur atas roti dan ikan itu.” Kata kerja Yunani di sini berarti “memberkati”, sedangkan beberapa kisah sejajar memakai ungkapan “mengucap syukur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: Lalu Yesus mengambil
  rationale: Partisip aoris dan penghubung δέ menyatakan urutan tindakan dalam narasi. Nama 'Yesus' dibuat eksplisit karena bahasa Indonesia memerlukan subjek yang jelas dan konteks ayat menunjuk kepadanya.
- source_word: τοὺς πέντε ἄρτους
  choice: lima roti
  rationale: Dalam bahasa Indonesia, 'roti' wajar dipakai sebagai nomina hitung setelah angka tanpa penanda jamak tambahan.
- source_word: τοὺς δύο ἰχθύας
  choice: dua ikan
  rationale: Padanan langsung dan alami dalam bahasa Indonesia modern.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: Ia menengadah ke langit
  rationale: '''Menengadah'' secara alami menyampaikan gerakan memandang ke atas; ''langit'' mempertahankan cakupan οὐρανός dan dalam konteks doa tetap dapat mengandung dimensi ilahi tanpa penjelasan berlebih.'
- source_word: εὐλόγησεν αὐτοὺς
  choice: memberkati semuanya
  rationale: Mempertahankan verba εὐλογέω sebagai 'memberkati', bukan menyamakannya dengan 'mengucap syukur'. 'Semuanya' mewakili objek maskulin jamak αὐτούς yang merujuk pada roti dan ikan bersama-sama.
- source_word: κατέκλασεν
  choice: memecah-mecahkannya
  rationale: Verba ini menunjuk pada pemecahan makanan untuk dibagikan. Bentuk ulang menyiratkan tindakan terhadap beberapa roti, sedangkan '-nya' merujuk pada makanan tersebut.
- source_word: ἐδίδου
  choice: Ia terus memberikannya
  rationale: Imperfek Yunani menunjukkan tindakan yang berlangsung atau berulang; 'terus memberikannya' mempertahankan aspek tersebut.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: Padanan alami bagi bentuk jamak tertentu; kepunyaan tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam Yunani.
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: untuk dihidangkan kepada orang banyak
  rationale: Infinitif menyatakan tujuan. 'Dihidangkan kepada' menyampaikan tindakan menaruh atau menyajikan makanan di hadapan orang banyak secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna οὐρανός dalam konteks doa
  choice: langit
  alternative: surga
  rationale: Bahasa Indonesia lazim mengatakan 'menengadah ke langit'; ungkapan ini mempertahankan gambaran fisik sekaligus memungkinkan rujukan ke ranah ilahi, tanpa memaksa pembedaan yang tidak ditentukan oleh kata Yunani.
- issue: Penerjemahan εὐλόγησεν
  choice: memberkati semuanya
  alternative: mengucap syukur atas semuanya
  rationale: Teks Yunani memakai εὐλογέω ('memberkati'), bukan εὐχαριστέω ('mengucap syukur'). Pilihan ini mempertahankan kekhasan Lukas dan tidak mengharmoniskannya secara diam-diam dengan kisah sejajar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi beberapa kalimat agar alami bagi pembaca umum, sementara urutan tindakan dan aspek berulang pada ἐδίδου tetap dipertahankan.
