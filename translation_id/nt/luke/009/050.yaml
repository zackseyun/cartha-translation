  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: id
  text: Namun, Yesus berkata kepadanya, “Jangan kalian menghalangi dia, sebab siapa pun yang tidak melawan kalian, ia berada di pihak kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Namun, ... berkata
  rationale: δέ menghubungkan jawaban Yesus dengan keberatan pada ayat sebelumnya dan mengandung kontras ringan; “Namun” menyatakannya secara wajar tanpa memperkeras pertentangan.
- source_word: πρὸς αὐτόν
  choice: kepadanya
  rationale: Kata ganti ini merujuk kepada pembicara sebelumnya. Terjemahan mempertahankan kata ganti sumber dan tidak menggantinya dengan nama Yohanes.
- source_word: ὁ Ἰησοῦς
  choice: Yesus
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: Μὴ κωλύετε
  choice: Jangan kalian menghalangi dia
  rationale: κωλύω dapat berarti menghalangi, mencegah, atau melarang. “Menghalangi” mencakup usaha para murid untuk menghentikan tindakan orang itu, sedangkan “kalian” memperjelas bahwa bentuk perintah Yunani ditujukan kepada lebih dari satu orang.
- source_word: ὃς γὰρ
  choice: sebab siapa pun
  rationale: γάρ memberi alasan, sedangkan ὃς dalam konteks ini menyatakan prinsip yang dapat berlaku umum. “Siapa pun” menyampaikan daya ungkap tersebut secara alami.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: yang tidak melawan kalian
  rationale: κατά dengan genitif menyatakan pertentangan atau perlawanan. “Kalian” mempertahankan orang kedua jamak dalam teks Yunani.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: ia berada di pihak kalian
  rationale: ὑπέρ di sini menyatakan dukungan atau keberpihakan. Ungkapan ini terdengar alami dalam bahasa Indonesia dan mempertahankan kontras dengan “melawan kalian”.
theological_decisions:
- issue: Cakupan perkataan Yesus
  choice: Pernyataan diterjemahkan sebagai prinsip umum dengan “siapa pun”.
  alternative: “Orang yang tidak melawan kalian berada di pihak kalian,” yang dapat terdengar lebih khusus menunjuk kepada orang yang baru dibicarakan.
  rationale: Kata ganti relatif ὃς dapat merujuk kepada kasus langsung sekaligus mengungkapkan prinsip yang lebih luas. “Siapa pun” mempertahankan keluasan itu tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kalian” dipakai untuk memperlihatkan bentuk jamak ὑμῶν dan perintah jamak κωλύετε. Tidak diperlukan catatan kaki karena pilihan “menghalangi” cukup mewakili rentang makna utama dalam konteks ini.
