id: LUK.9.27
reference: Luke 9:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: id
  text: 'Namun, sesungguhnya Aku berkata kepadamu: Di antara orang-orang yang berdiri di sini ada beberapa yang sama sekali tidak akan mengecap kematian sebelum mereka melihat Kerajaan Allah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mengecap kematian” berarti mengalami kematian atau mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Namun, sesungguhnya Aku berkata kepadamu
  rationale: “Namun” mempertahankan fungsi penghubung δέ, sedangkan “sesungguhnya” menerjemahkan ἀληθῶς secara alami dan khidmat. Susunan ini tetap dekat dengan penekanan Yunani.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: Di antara orang-orang yang berdiri di sini ada beberapa
  rationale: Ungkapan “di antara” menyatakan konstruksi partitif Yunani secara wajar. “Di sini” memperjelas daya deiktis αὐτοῦ, yaitu orang-orang yang hadir di tempat itu, sementara bentuk perfektum ἑστηκότων menunjukkan keadaan sedang berdiri.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: yang sama sekali tidak akan mengecap kematian
  rationale: “Sama sekali tidak akan” menyampaikan penyangkalan tegas οὐ μή. Metafora “mengecap kematian” dipertahankan karena dapat dipahami dalam bahasa Indonesia dan tidak meratakan ungkapan sumber menjadi sekadar “mati”.
- source_word: ἕως ἂν ἴδωσιν
  choice: sebelum mereka melihat
  rationale: Dalam kalimat negatif ini, “sebelum” menyampaikan batas waktu ἕως ἄν secara alami dalam bahasa Indonesia tanpa mengubah orientasi masa depannya.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Istilah ini merupakan padanan baku dan luas bagi βασιλεία τοῦ θεοῦ, tanpa mempersempit maknanya hanya menjadi pemerintahan atau wilayah.
theological_decisions:
- issue: Makna “melihat Kerajaan Allah” dalam konteks
  choice: Frasa dipertahankan tanpa penjelasan interpretatif.
  alternative: Menafsirkannya secara eksplisit sebagai pemuliaan Yesus, kebangkitan/kenaikan, kehancuran Yerusalem, atau penyebaran gereja.
  rationale: Teks tidak menyebut rujukannya secara eksplisit, dan beberapa penafsiran tetap mungkin. Terjemahan mempertahankan ketegangan eskatologis dan tidak memasukkan skema teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “Aku” memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Yesus. Tanda titik dua membantu keterbacaan ujaran, sedangkan metafora sumber dipertahankan dan dijelaskan singkat dalam catatan kaki.
