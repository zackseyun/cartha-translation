  source_fidelity: Terjemahan dengan tepat menyampaikan δέ sebagai penghubung kontras ringan (“Namun”), ἀληθῶς (“sesungguhnya”), konstruksi partitif εἰσίν τινες τῶν ... ἑστηκότων (“Di antara ... ada beberapa”), dan penyangkalan tegas οὐ μή (“sama sekali tidak akan”). “Sebelum mereka melihat” mempertahankan batas temporal ἕως ἄν tanpa menentukan secara tafsir apa yang dimaksud dengan melihat Kerajaan Allah.
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register khidmat Alkitab. Susunan “Di antara orang-orang yang berdiri di sini ada beberapa” alami serta mempertahankan nuansa partitif sumber. Kapitalisasi “Aku” dan “Kerajaan Allah” konsisten dengan konvensi penerbitan Alkitab Indonesia.
  terminology: “Mengecap kematian” secara baik mempertahankan metafora γεύσωνται θανάτου, sementara catatan kaki memberi penjelasan idiomatis yang memadai. “Kerajaan Allah” adalah padanan Indonesia yang mapan dan tidak memaksakan penafsiran sempit atas βασιλεία.
