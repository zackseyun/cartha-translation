base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: id
  text: Dan mereka tidak menyambut Dia,[a] karena wajah-Nya tertuju ke Yerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerima Dia.” Kata Yunaninya dapat berarti menerima, menyambut, atau menerima dengan ramah; dalam konteks ini kemungkinan besar yang dimaksud adalah penolakan untuk memberi sambutan atau tumpangan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “wajah-Nya sedang menuju ke Yerusalem.” Ini merupakan ungkapan yang menunjukkan arah perjalanan dan dapat pula menyiratkan ketetapan hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: menyambut
  rationale: Dalam konteks perjalanan dan kemungkinan pemberian tumpangan, δέχομαι berarti menerima atau menyambut. “Menyambut” menyampaikan penolakan terhadap penerimaan dan keramahtamahan secara alami dalam bahasa Indonesia.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: wajah-Nya
  rationale: πρόσωπον secara harfiah berarti “wajah”. Unsur ini dipertahankan agar ungkapan yang hidup dan bernuansa Semitis dalam teks Lukas tidak diratakan menjadi sekadar kata ganti.
- source_word: ἦν πορευόμενον
  choice: tertuju
  rationale: Konstruksi ini secara harfiah menggambarkan wajah-Nya sebagai sedang pergi atau mengarah. Dalam ungkapan tersebut, “tertuju” menyampaikan arah perjalanan sekaligus ketetapan orientasi tanpa menambahkan penjelasan teologis ke dalam teks utama.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: εἰς menyatakan arah atau tujuan. “Ke Yerusalem” merupakan padanan Indonesia yang langsung dan alami.
- source_word: ὅτι
  choice: karena
  rationale: ὅτι memperkenalkan alasan mereka tidak menyambut Yesus; “karena” menyatakan hubungan sebab secara jelas.
theological_decisions:
- issue: Daya ungkapan “wajah-Nya ... ke Yerusalem”
  choice: Mempertahankan gambaran wajah yang tertuju ke Yerusalem
  alternative: Meratakan ungkapan menjadi “karena Ia sedang menuju Yerusalem” atau mempertegasnya menjadi “karena Ia bertekad pergi ke Yerusalem”
  rationale: Ungkapan sumber memuat arah perjalanan dan dapat menyiratkan ketetapan hati, tetapi tidak menjelaskan implikasinya secara eksplisit. Terjemahan ini mempertahankan gambaran dan ketegangannya tanpa mengubahnya menjadi pernyataan psikologis atau teologis yang lebih tegas daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menghubungkan ayat ini dengan konteks sebelumnya secara alami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Ungkapan “wajah-Nya tertuju” sengaja mempertahankan citra teks Yunani sambil tetap dapat dipahami pembaca umum.
