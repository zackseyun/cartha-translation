  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: id
  text: Namun, Yesus berkata kepadanya, “Biarkanlah orang mati menguburkan orang mati mereka sendiri, tetapi engkau, pergilah dan beritakanlah Kerajaan Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mati” yang pertama kemungkinan dipakai secara kiasan untuk orang-orang yang tidak tanggap secara rohani, sedangkan yang kedua mengacu pada orang-orang yang mati secara jasmani. Bahasa Yunani memakai kata yang sama pada kedua tempat, dan terjemahan ini mempertahankan efek tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Biarkanlah
  rationale: Imperatif aoris ini menyampaikan perintah tegas agar orang itu menyerahkan urusan tersebut kepada pihak lain. “Biarkanlah” alami dalam bahasa Indonesia dan tetap mempertahankan konstruksi kausatif yang diikuti infinitif.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: orang-orang mati ... orang-orang mati mereka sendiri
  rationale: Pengulangan kata νεκρούς dipertahankan agar paradoks yang mencolok dalam bahasa Yunani tidak dihilangkan atau ditafsirkan secara eksplisit dalam teks utama.
- source_word: θάψαι
  choice: menguburkan
  rationale: Infinitif ini menyatakan tindakan yang dibiarkan untuk dilakukan oleh orang-orang mati.
- source_word: ἑαυτῶν
  choice: mereka sendiri
  rationale: Kata ganti refleksif ini memberi penekanan; “mereka sendiri” mempertahankan daya tersebut.
- source_word: ἀπελθὼν
  choice: pergilah dan
  rationale: Partisip aoris yang mendahului imperatif utama diterjemahkan sebagai rangkaian tindakan yang alami dalam bahasa Indonesia. Bentuk “pergilah dan” menyampaikan gerak mendahului pemberitaan tanpa kekakuan harfiah.
- source_word: διάγγελλε
  choice: beritakanlah
  rationale: Imperatif kini menunjuk pada pemberitaan terbuka dan berkelanjutan. “Beritakanlah” jelas, wajar, dan sesuai dengan konteks pewartaan Kerajaan Allah.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku Alkitab bahasa Indonesia ini mencakup pemerintahan atau kekuasaan Allah tanpa mempersempit maknanya.
theological_decisions:
- issue: Makna dua kemunculan “orang-orang mati”
  choice: Mempertahankan kata “mati” pada kedua kemunculan tanpa menambahkan “secara rohani” dalam teks utama.
  alternative: “Biarkanlah orang-orang yang mati secara rohani menguburkan orang-orang mati mereka sendiri.”
  rationale: Kemunculan pertama kemungkinan bersifat metaforis, sedangkan yang kedua mengacu pada kematian jasmani. Namun, bahasa Yunani memakai kata yang sama pada keduanya; pengulangan dipertahankan agar ketegangan dan paradoks ucapan Yesus tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Namun” menerjemahkan δέ secara alami; subjek tersirat diperjelas menjadi “Yesus” berdasarkan konteks. Kata “engkau” mempertahankan penekanan eksplisit pada σύ dan memberi kontras dengan “orang-orang mati”. Penanda catatan kaki ditempatkan setelah seluruh ucapan yang dijelaskannya.
