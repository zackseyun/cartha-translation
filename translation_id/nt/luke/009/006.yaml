  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: id
  text: Maka mereka pun berangkat dan pergi dari desa ke desa[a]. Di mana-mana mereka memberitakan kabar baik[b] dan menyembuhkan orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menjelajahi desa-desa." Ungkapan Yunani dapat menekankan pergerakan secara berurutan di antara berbagai desa.
    reason: lexical_alternative
  - marker: b
    text: Atau "memberitakan Injil."
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: berangkat
  rationale: Partisip aoris ini mendahului tindakan utama dan menunjukkan bahwa para murid mulai pergi sesudah menerima penugasan; 'berangkat' alami dalam narasi Indonesia.
- source_word: δὲ
  choice: Maka ... pun
  rationale: δέ melanjutkan narasi dengan nuansa perkembangan atau akibat ringan dari perintah sebelumnya; konstruksi ini menyampaikan alur tersebut secara wajar.
- source_word: διήρχοντο
  choice: pergi
  rationale: Bentuk imperfek menunjukkan perjalanan yang berlangsung dari satu tempat ke tempat lain; bersama frasa 'dari desa ke desa', kata 'pergi' menyampaikan gerak berulang tanpa menjadi kaku.
- source_word: κατὰ τὰς κώμας
  choice: dari desa ke desa
  rationale: κατά dengan akusatif di sini bersifat distributif dan menunjukkan pergerakan di antara sejumlah desa. Ungkapan Indonesia ini jelas dan idiomatis.
- source_word: εὐαγγελιζόμενοι
  choice: memberitakan kabar baik
  rationale: Partisip ini menyatakan penyampaian berita baik. Pilihan ini mudah dipahami pembaca modern dan tidak menjadikannya istilah teknis yang lebih sempit daripada konteks.
- source_word: θεραπεύοντες
  choice: menyembuhkan orang
  rationale: Dalam konteks pelayanan para murid, verba ini mengacu pada tindakan menyembuhkan. Objek 'orang' dibuat tersurat secara wajar dalam bahasa Indonesia meskipun tersirat dalam bahasa Yunani.
- source_word: πανταχοῦ
  choice: di mana-mana
  rationale: Adverbia ini menekankan luasnya tempat mereka memberitakan dan menyembuhkan; 'di mana-mana' langsung dan idiomatis.
theological_decisions:
- issue: Makna εὐαγγελιζόμενοι dalam misi para murid
  choice: memberitakan kabar baik
  alternative: memberitakan Injil
  rationale: Ayat ini menampilkan tindakan para murid menyampaikan berita baik tanpa mengharuskan pembaca memahami kata itu sebagai istilah teologis teknis yang telah dirumuskan kemudian. Pilihan utama mempertahankan isi evangelistik sekaligus tetap mudah dipahami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Susunan partisip Yunani dialihkan menjadi rangkaian tindakan yang lancar, sementara sifat distributif perjalanan dan cakupan pelayanan tetap dipertahankan.
