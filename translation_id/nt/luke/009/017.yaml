  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: id
  text: Mereka semua makan sampai kenyang. Lalu potongan-potongan[a] sisa makanan mereka dikumpulkan sebanyak dua belas keranjang.[b]
  philosophy: optimal-equivalence
