lexical_decisions:
- source_word: ἔφαγον
  choice: makan
  rationale: Aoristus indikatif menyampaikan peristiwa lampau secara sederhana; dalam narasi bahasa Indonesia, bentuk verba tanpa penanda kala sudah alami.
- source_word: ἐχορτάσθησαν
  choice: sampai kenyang
  rationale: Ungkapan ini secara alami menyatakan bahwa mereka makan hingga puas dan tetap mempertahankan gagasan dipenuhi oleh makanan.
- source_word: πάντες
  choice: semua
  rationale: Mempertahankan penekanan bahwa setiap orang yang hadir ikut makan.
- source_word: ἤρθη
  choice: dikumpulkan
  rationale: Bentuk pasif αἴρω dalam konteks sisa makanan bermakna bahwa potongan-potongan itu diambil dan dihimpun; 'dikumpulkan' paling jelas dalam bahasa Indonesia modern.
- source_word: τὸ περισσεῦσαν
  choice: yang tersisa
  rationale: Partisip berartikel ini berfungsi sebagai nomina dan dengan alami merujuk kepada apa yang masih tinggal.
- source_word: αὐτοῖς
  choice: setelah mereka makan
  rationale: Dativus ini menyatakan hubungan sisa tersebut dengan orang-orang yang baru makan. Ungkapan ini menyampaikan hubungan kontekstual itu secara wajar tanpa memaksakan padanan 'bagi mereka' yang dapat menyiratkan bahwa sisa itu disediakan untuk mereka.
- source_word: κλασμάτων
  choice: potongan-potongan
  rationale: κλάσματα menunjuk pada bagian-bagian yang telah dipatahkan; 'potongan-potongan' konkret, jelas, dan sesuai konteks pembagian makanan.
- source_word: κόφινοι δώδεκα
  choice: dua belas keranjang
  rationale: Menyampaikan jumlah dan jenis wadah secara langsung; rincian bahan keranjang tidak perlu ditambahkan karena tidak dinyatakan secara eksplisit dalam konteks ini.
