  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: id
  text: Dan semua orang yang tidak menerima kalian, ketika kalian meninggalkan kota itu, kebaskanlah debu dari kaki kalian sebagai kesaksian terhadap mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: siapa pun yang tidak menerima kamu
  rationale: ὅσοι dengan ἄν menyatakan cakupan umum dan tak tentu. “Menerima” mempertahankan keluasan makna δέχομαι, yang dalam konteks ini mencakup menerima serta menyambut para utusan.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: ketika kamu meninggalkan kota itu
  rationale: Partisipel ἐξερχόμενοι berlangsung bersamaan dengan perintah utama. “Ketika kamu meninggalkan” alami dalam bahasa Indonesia, sedangkan “kota” cukup luas untuk πόλις tanpa harus menyiratkan pusat urban yang besar.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: debu dari kakimu
  rationale: κονιορτός menunjuk pada debu lepas dari tanah. Bentuk “-mu” dalam bahasa Indonesia dapat merujuk kepada para murid secara kolektif sesuai konteks.
- source_word: ἀποτινάσσετε
  choice: kebaskanlah
  rationale: Kata kerja ini memerintahkan tindakan menyingkirkan debu dengan gerakan mengguncang atau mengibaskan. “Kebaskanlah” mempertahankan gambaran fisik dan daya imperatifnya.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: sebagai kesaksian terhadap mereka
  rationale: “Sebagai kesaksian” menyampaikan fungsi pembuktian atau kesaksian dari tindakan itu. “Terhadap mereka” mempertahankan nuansa adversatif/peringatan tanpa memperkerasnya menjadi pernyataan penghukuman akhir.
theological_decisions:
- issue: Daya simbolis tindakan mengebaskan debu
  choice: sebagai kesaksian terhadap mereka
  alternative: sebagai tanda bagi mereka; sebagai pernyataan penghukuman atas mereka
  rationale: Ungkapan Yunani εἰς μαρτύριον ἐπ’ αὐτούς lebih kuat daripada tanda yang netral, tetapi ayat ini tidak menjabarkan penghukuman akhir. Terjemahan mempertahankan ketegangan berupa kesaksian yang bersifat memperingatkan atau menentang tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. “Kamu” dipertahankan karena konteks menunjukkan sapaan kepada lebih dari satu murid, meskipun bahasa Indonesia tidak menandai jumlah pada pronomina tersebut. “Kota” digunakan dalam arti luas sebagai padanan alami πόλις.
