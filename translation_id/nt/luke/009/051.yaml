id: LUK.9.51
reference: Luke 9:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: id
  text: Ketika saat pengangkatan-Nya hampir tiba[a], Ia dengan teguh mengarahkan wajah-Nya[b] untuk pergi ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saat kenaikan-Nya ke surga hampir tiba.” Secara harfiah, bahasa Yunani berbicara tentang “hari-hari pengangkatan-Nya” yang sedang menuju penggenapannya.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “mengarahkan wajah-Nya” menyatakan tekad yang bulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ketika ...
  rationale: Formula peralihan naratif ini diserap ke dalam susunan kalimat waktu yang alami dalam bahasa Indonesia. Terjemahan harfiah seperti “terjadilah” akan terasa kaku dan tidak menambah makna peristiwa dalam konteks ini.
- source_word: ἐν τῷ συμπληροῦσθαι
  choice: sedang mencapai kegenapannya
  rationale: Bentuk ini menyatakan waktu sekaligus proses menuju penyelesaian. “Sedang mencapai kegenapannya” mempertahankan aspek prosesif tanpa menyiratkan bahwa waktunya sudah sepenuhnya berakhir.
- source_word: τὰς ἡμέρας
  choice: hari-hari
  rationale: Diterjemahkan secara konkret untuk mempertahankan gambaran Lukas tentang suatu masa tertentu yang bergerak menuju penggenapannya.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: menjelang Ia diangkat
  rationale: ἀνάλημψις secara dasar berarti pengangkatan atau tindakan diangkat. Ungkapan ini tidak dipersempit menjadi “kenaikan ke surga,” sehingga cakupan rangkaian penderitaan, kebangkitan, dan pemuliaan tetap terbuka.
- source_word: καὶ αὐτὸς
  choice: Ia pun
  rationale: “Pun” membawa peralihan dan sedikit penekanan pada tindakan Yesus tanpa menghasilkan ungkapan “Ia sendiri” yang kurang alami dalam konteks ini.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: dengan teguh mengarahkan wajah-Nya
  rationale: Terjemahan ini mempertahankan metafora wajah sekaligus menjelaskan daya idiomatisnya, yaitu ketetapan hati dan tekad yang kukuh.
- source_word: τοῦ πορεύεσθαι
  choice: untuk pergi
  rationale: Infinitif ini menyatakan tujuan sesudah idiom tersebut; “untuk pergi” merupakan padanan yang alami dan cukup luas.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Mempertahankan makna arah menuju kota tujuan.
theological_decisions:
- issue: Cakupan ἀναλήμψεως αὐτοῦ
  choice: Ia diangkat
  alternative: kenaikan-Nya ke surga
  rationale: Kata Yunani menyatakan bahwa Yesus “diangkat” dan mungkin memandang kematian, kebangkitan, serta kenaikan-Nya sebagai satu gerak menuju pemuliaan. Terjemahan utama mempertahankan keluasan ini; pengertian tradisional tentang kenaikan dicatat sebagai kemungkinan.
- issue: Daya idiomatis τὸ πρόσωπον ἐστήρισεν
  choice: dengan teguh mengarahkan wajah-Nya
  alternative: membulatkan tekad
  rationale: Metafora sumber dipertahankan bersama penanda keteguhan agar dapat dipahami pembaca Indonesia, tanpa meratakan ungkapan itu menjadi pernyataan abstrak semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara gambaran “wajah” dan ketegangan makna “diangkat” tetap dipertahankan.
