  naturalness: '"Setan" lebih lazim dalam bahasa Indonesia baku modern daripada "demon" untuk δαιμόνιον. "Ketika ... masih mendekat" dan rangkaian verba dengan "dan" menghasilkan alur naratif yang lugas.'
  terminology: '"Setan" untuk δαιμόνιον dan "roh najis" untuk πνεῦμα τὸ ἀκάθαρτον mempertahankan dua ungkapan Yunani yang berbeda tanpa mengurangi keduanya menjadi gangguan impersonal. "Anak" tetap tepat untuk παῖς dalam konteks ini.'
