revisions:
- from: Sementara anak itu masih mendekat, demon itu membantingnya ke tanah dan membuatnya kejang-kejang. Namun, Yesus menegur roh najis itu, menyembuhkan anak itu, lalu menyerahkannya kembali kepada ayahnya.[a]
  to: Ketika anak itu masih mendekat, setan itu menjatuhkannya dan membuatnya kejang-kejang. Lalu Yesus menegur roh najis itu, menyembuhkan anak itu, dan mengembalikannya kepada ayahnya.[a]
  rationale: Revisi ini menghilangkan penambahan "ke tanah", memakai istilah Indonesia yang lebih lazim untuk δαιμόνιον, dan menerjemahkan ἀπέδωκεν secara lebih langsung. Catatan kaki tetap ditempatkan pada verba "mengembalikannya", yaitu unsur yang memiliki alternatif leksikal. Tidak ada perubahan makna atau penafsiran doktrinal tambahan.
