  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: id
  text: Ketika anak itu masih mendekat, setan itu menjatuhkannya dan membuatnya kejang-kejang. Lalu Yesus menegur roh najis itu, menyembuhkan anak itu, dan mengembalikannya kepada ayahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyerahkannya kembali kepada ayahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Sementara anak itu masih mendekat
  rationale: Konstruksi genitif absolut dengan partisipel kini menyatakan tindakan yang sedang berlangsung bersamaan dengan peristiwa utama. Kata ἔτι dipertahankan dengan 'masih', sedangkan rujukan pronomina diperjelas sebagai 'anak itu' agar alami dan tidak rancu dalam bahasa Indonesia.
- source_word: ἔρρηξεν αὐτὸν
  choice: membantingnya ke tanah
  rationale: Dalam konteks ini, ῥήγνυμι menggambarkan tindakan keras yang menjatuhkan anak itu. 'Membantingnya ke tanah' menyampaikan kekerasan tindakan dan arah jatuhnya secara alami.
- source_word: τὸ δαιμόνιον
  choice: demon itu
  rationale: '''Demon'' merupakan padanan langsung bagi δαιμόνιον dan mempertahankan pembedaan ungkapan dari πνεῦμα τὸ ἀκάθαρτον yang muncul kemudian.'
- source_word: συνεσπάραξεν
  choice: membuatnya kejang-kejang
  rationale: Bentuk kausatif ini menggambarkan demon sebagai penyebab kejang hebat. Ungkapan tersebut jelas dan wajar bagi pembaca Indonesia modern.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: '''Menegur'' mempertahankan tindakan verbal berwibawa yang lazim dinyatakan oleh verba ini dalam kisah pengusiran roh.'
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: roh najis itu
  rationale: '''Roh najis'' mempertahankan istilah personal-spiritual dan nuansa kenajisan yang terkandung dalam ἀκάθαρτος.'
- source_word: ἰάσατο τὸν παῖδα
  choice: menyembuhkan anak itu
  rationale: ἰάομαι secara langsung menyatakan penyembuhan. παῖς diterjemahkan 'anak' karena konteks menunjukkan seorang anak dalam hubungannya dengan ayahnya tanpa mengharuskan penentuan usia yang lebih sempit.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: menyerahkannya kembali kepada ayahnya
  rationale: ἀποδίδωμι di sini menyatakan penyerahan kembali atau pemulangan kepada ayahnya. Pilihan ini alami dan mempertahankan gambaran pemulihan relasi setelah anak itu dibebaskan dan disembuhkan.
theological_decisions:
- issue: Bahasa mengenai penderitaan akibat demon
  choice: Menerjemahkan δαιμόνιον dan πνεῦμα ἀκάθαρτον sebagai pelaku rohani personal, yakni 'demon' dan 'roh najis'.
  alternative: Menafsirkannya secara umum sebagai kekuatan jahat impersonal atau semata-mata sebagai gangguan jasmani atau mental.
  rationale: Teks Yunani menggambarkan pelaku yang bertindak terhadap anak itu dan ditegur oleh Yesus. Pada saat yang sama, pernyataan bahwa Yesus 'menyembuhkan' anak itu dipertahankan sehingga dimensi pengusiran demon dan penyembuhan sama-sama hadir tanpa dileburkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'demon' dipakai untuk membedakannya dari 'roh najis' dalam klausa berikutnya. Penanda catatan kaki ditempatkan pada frasa yang benar-benar memiliki alternatif leksikal, yaitu penyerahan kembali kepada ayahnya.
