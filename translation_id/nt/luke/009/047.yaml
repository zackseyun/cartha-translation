source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: id
  text: Namun, Yesus, yang mengetahui pertimbangan dalam hati mereka, mengambil seorang anak dan menempatkannya di samping-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaruhnya di sisi-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: mengetahui
  rationale: Partisip ini menyatakan kesadaran atau pengetahuan Yesus mengenai sesuatu yang batiniah. Pilihan ini tidak menjelaskan bagaimana Ia mengetahuinya.
- source_word: διαλογισμὸν
  choice: pertimbangan
  rationale: Kata ini menunjuk pada proses berpikir atau penalaran batin, dan dalam konteks dapat berkaitan dengan perdebatan para murid.
- source_word: τῆς καρδίας αὐτῶν
  choice: dalam hati mereka
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hati sebagai pusat pikiran batin. Bentuk Indonesia tidak perlu memaksakan pembedaan jumlah pada kata 'hati'.
- source_word: ἐπιλαβόμενος
  choice: memegang
  rationale: Kata kerja ini secara konkret berarti memegang atau meraih. 'Memegang' lebih dekat kepada tindakan sumber daripada sekadar 'mengambil', tanpa menentukan bagian tubuh yang dipegang.
- source_word: παιδίον
  choice: seorang anak
  rationale: Terjemahan ini jelas dan tidak menambahkan penekanan usia yang tidak dinyatakan secara khusus oleh bentuk tersebut.
- source_word: ἔστησεν
  choice: menyuruh ... berdiri
  rationale: Bentuk kausatif ἵστημι berarti membuat seseorang berdiri. Ungkapan ini alami dan tetap mempertahankan gambaran berdiri yang terdapat dalam teks Yunani.
- source_word: παρ’ ἑαυτῷ
  choice: di samping-Nya
  rationale: Ungkapan ini menyatakan bahwa anak itu ditempatkan dekat di sisi Yesus. Huruf kapital pada enklitik membantu memperjelas bahwa acuannya ialah Yesus.
theological_decisions:
- issue: Pengetahuan Yesus tentang pertimbangan batin para murid
  choice: Ayat menyatakan bahwa Yesus mengetahuinya tanpa menjelaskan caranya.
  alternative: Menafsirkannya secara khusus sebagai kemahatahuan ilahi atau sebagai ketajaman pengamatan manusiawi.
  rationale: Terjemahan mempertahankan pernyataan Lukas sekaligus tidak memasukkan penjelasan teologis yang tidak diberikan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kalimat Yunani dipecah menjadi dua agar alurnya alami tanpa menghilangkan urutan tindakan. Sapaan pronominal untuk Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
