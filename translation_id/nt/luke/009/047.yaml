review_pass:
  verdict: revise
  source_fidelity: Terjemahan menangkap pengetahuan Yesus tentang penalaran batin mereka dan urutan tindakan terhadap seorang anak. Namun, “memegang ... lalu menyuruh ... berdiri” dapat menyiratkan bahwa Yesus sekadar memegang anak itu lalu memberikan perintah lisan kepadanya. Partisip ἐπιλαβόμενος menyatakan tindakan mengambil/memegang anak itu, sedangkan ἔστησεν secara kausatif menyatakan bahwa Yesus menempatkan atau membuatnya berdiri di sisi-Nya.
  naturalness: Bahasa Indonesia baku dan mudah dipahami. Susunan revisi dengan anak kalimat “yang mengetahui” lebih lancar dan mempertahankan keterkaitan partisip Yunani dengan subjek Yesus tanpa memecah tindakan menjadi dua kalimat.
  terminology: “Pertimbangan dalam hati mereka” merupakan padanan yang wajar untuk διαλογισμὸν τῆς καρδίας αὐτῶν dan tidak memaksakan penjelasan tentang cara Yesus mengetahui isi batin mereka. “Di samping-Nya” tepat untuk παρ’ ἑαυτῷ. Kapitalisasi -Nya konsisten dengan gaya penerbitan yang dipakai draf.
  issues:
  - severity: medium
    issue: “Menyuruh anak itu berdiri” berpotensi menyatakan perintah lisan, bukan tindakan kausatif Yesus.
    rationale: ἔστησεν berarti Yesus membuat anak itu berdiri atau menempatkannya; bersama ἐπιλαβόμενος, konteksnya menggambarkan tindakan Yesus terhadap anak tersebut. “Mengambil ... dan menempatkannya” menghindari tambahan implikasi perintah lisan dan tetap alami.
  revised_text: Namun, Yesus, yang mengetahui pertimbangan dalam hati mereka, mengambil seorang anak dan menempatkannya di samping-Nya.[a]
