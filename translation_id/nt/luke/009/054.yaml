id: LUK.9.54
reference: Luke 9:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: id
  text: Ketika murid-murid itu, yaitu Yakobus dan Yohanes, melihat hal itu, mereka berkata, “Tuhan, apakah Engkau mau supaya kami menyuruh[a] api turun dari langit dan menghanguskan mereka?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengatakan agar api turun dari langit dan menghanguskan mereka”; dapat juga diterjemahkan, “memanggil turun api dari langit untuk membinasakan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat hal itu
  rationale: Partisip aoris dipahami secara temporal. Kata “hal itu” disuplai secara wajar untuk menunjuk pada penolakan orang Samaria dalam ayat sebelumnya, tanpa menambahkan gagasan baru.
- source_word: δὲ
  choice: diserap ke dalam susunan kalimat temporal
  rationale: Partikel ini menandai kelanjutan narasi; dalam bahasa Indonesia fungsinya sudah terwakili oleh klausa “Ketika ...”, sehingga terjemahan eksplisit seperti “tetapi” akan memberi kontras yang berlebihan.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: murid-murid itu, yaitu Yakobus dan Yohanes
  rationale: Susunan ini mempertahankan konstruksi aposisional yang mengidentifikasi murid-murid yang dimaksud dan menghindari kesan bahwa Yakobus dan Yohanes mempunyai murid.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus ini secara baku dan tepat diterjemahkan “Tuhan”.
- source_word: θέλεις
  choice: apakah Engkau mau
  rationale: θέλω di sini menyatakan kehendak atau keinginan dan memperkenalkan permintaan izin dari para murid.
- source_word: εἴπωμεν
  choice: supaya kami menyuruh
  rationale: Secara leksikal berarti “kami mengatakan”, tetapi dengan klausa infinitif yang menyusul, bentuk ini secara idiomatis menyatakan menyuruh atau memerintahkan sesuatu terjadi. “Menyuruh” tetap dekat dengan λέγω sekaligus alami dalam bahasa Indonesia.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: api turun dari langit
  rationale: Terjemahan ini mempertahankan gambaran konkret serta gema bahasa penghukuman profetis.
- source_word: ἀναλῶσαι
  choice: menghanguskan
  rationale: Kata ini dapat berarti menghabiskan atau membinasakan. “Menghanguskan” mempertahankan hubungan langsung dengan api dan menyampaikan akibat yang mematikan.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina jamak ini mengacu kepada orang-orang Samaria yang menolak menerima Yesus dalam konteks sebelumnya.
theological_decisions:
- issue: Objek tersirat dari “melihat”
  choice: Menambahkan “hal itu” sebagai rujukan kepada penolakan pada ayat sebelumnya.
  alternative: “Ketika ... melihatnya” atau “Setelah melihat” tanpa objek eksplisit.
  rationale: Bahasa Yunani tidak menyatakan objek, tetapi konteks menentukannya. “Hal itu” membuat hubungan naratif jelas tanpa memaksakan penafsiran teologis tambahan.
- issue: Daya ujar usulan para murid
  choice: Menerjemahkan εἴπωμεν sebagai “menyuruh” dan menjelaskan bentuk harfiahnya dalam catatan kaki.
  alternative: “memerintahkan”, “memanggil turun”, atau secara harfiah “mengatakan agar”.
  rationale: λέγω sendiri berarti “berkata/mengatakan”, sedangkan konstruksi dengan api sebagai subjek infinitif memberi ujaran itu daya perintah. “Menyuruh” alami dalam bahasa Indonesia dan tidak lebih kuat daripada yang diperlukan.
- issue: Makna ἀναλῶσαι
  choice: “menghanguskan mereka”
  alternative: “membinasakan mereka” atau “menghabiskan mereka”.
  rationale: Pilihan ini mempertahankan citra api dan juga akibat penghukuman, tanpa mengurangi kekerasan usulan para murid.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Engkau” dipakai untuk Yesus sesuai register Alkitab Indonesia yang lazim. Konstruksi “murid-murid itu, yaitu Yakobus dan Yohanes” dipilih demi kejelasan aposisi; “menghanguskan” menjaga citra api dalam teks sumber.
