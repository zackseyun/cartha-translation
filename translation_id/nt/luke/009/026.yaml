revisions:
- from: Sebab siapa pun yang merasa malu terhadap Aku dan perkataan-perkataan-Ku, Anak Manusia akan merasa malu terhadap orang itu[a] ketika Ia datang dalam kemuliaan-Nya, kemuliaan Bapa, dan kemuliaan para malaikat kudus.[b]
  to: Sebab siapa pun yang merasa malu terhadap Aku dan perkataan-Ku, Anak Manusia akan merasa malu terhadap orang itu[a] ketika Ia datang dalam kemuliaan-Nya dan kemuliaan Bapa serta para malaikat kudus.[b]
  rationale: Revisi mengganti reduplikasi yang tidak idiomatis dengan «perkataan-Ku» dan menyusun kembali frasa kemuliaan agar satu «kemuliaan» yang diekspresikan dalam bahasa Indonesia tetap menaungi Bapa serta para malaikat kudus, tanpa menambahkan penjelasan doktrinal mengenai relasi kemuliaan tersebut. Penanda dan isi catatan kaki dipertahankan serta diselaraskan dengan teks revisi.
