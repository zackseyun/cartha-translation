  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: id
  text: Sebab siapa pun yang merasa malu terhadap Aku dan perkataan-Ku, Anak Manusia akan merasa malu terhadap orang itu[a] ketika Ia datang dalam kemuliaan-Nya dan kemuliaan Bapa serta para malaikat kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang ini.”'
    reason: lexical_alternative
  - marker: b
    text: 'Konstruksi Yunani juga dapat diungkapkan: “ketika Ia datang dalam kemuliaan-Nya, dan dalam kemuliaan Bapa dan para malaikat kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Sebab siapa pun yang
  rationale: γάρ memberi hubungan penjelasan dengan konteks sebelumnya, sedangkan konstruksi relatif tak tentu ὃς ... ἄν menyatakan cakupan umum, yaitu “siapa pun”.
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: merasa malu terhadap ... akan merasa malu terhadap
  rationale: Pilihan yang sama pada kedua kemunculan mempertahankan timbal balik yang disengaja dalam bahasa Yunani. “Merasa malu terhadap” alami dalam bahasa Indonesia dan tidak memperkuat maknanya menjadi “menolak” atau “menyangkal”.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: Aku dan perkataan-perkataan-Ku
  rationale: “Perkataan-perkataan” mempertahankan bentuk jamak λόγους dan mengacu pada apa yang Yesus ucapkan tanpa mempersempitnya menjadi ajaran tertentu.
- source_word: τοῦτον
  choice: orang itu
  rationale: Pronomina penunjuk ini merujuk kembali kepada “siapa pun.” “Orang itu” jelas, alami, dan mempertahankan bentuk tunggal tanpa menimbulkan kesan bahwa peringatan hanya berlaku bagi laki-laki.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan gelar yang mapan ini mempertahankan bentuk Yunani dan gema antarteksnya tanpa parafrasa teologis.
- source_word: ὅταν ἔλθῃ
  choice: ketika Ia datang
  rationale: ὅταν dengan subjungtif aoris di sini menunjuk pada peristiwa mendatang; “ketika Ia datang” merupakan padanan Indonesia yang wajar.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: dalam kemuliaan-Nya, kemuliaan Bapa, dan kemuliaan para malaikat kudus
  rationale: Pengulangan “kemuliaan” yang diperlukan dalam bahasa Indonesia memperjelas rangkaian genitif yang bergantung pada δόξῃ, sambil tetap mengaitkan kedatangan itu dengan kemuliaan Anak Manusia, Bapa, dan para malaikat kudus.
theological_decisions:
- issue: Rujukan tunggal maskulin dalam peringatan yang berlaku umum
  choice: orang itu
  alternative: dia / laki-laki itu
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin dengan fungsi representatif. “Orang itu” mempertahankan ketunggalan dan rujukan baliknya tanpa secara keliru membatasi cakupan peringatan kepada laki-laki.
- issue: Hubungan kemuliaan Anak Manusia, Bapa, dan para malaikat kudus
  choice: dalam kemuliaan-Nya, kemuliaan Bapa, dan kemuliaan para malaikat kudus
  alternative: dalam kemuliaan-Nya serta dalam kemuliaan Bapa dan para malaikat kudus
  rationale: Teks menyandingkan ketiganya dalam satu konstruksi tanpa menjelaskan secara sistematis bagaimana kemuliaan itu dimiliki atau dibagikan. Terjemahan mempertahankan keagungan dan ketegangan tersebut tanpa menambahkan rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Yesus dipakai sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan “merasa malu terhadap” menjaga kesejajaran retoris sumber.
