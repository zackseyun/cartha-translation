id: LUK.9.11
reference: Luke 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: id
  text: Namun, ketika orang banyak mengetahui hal itu, mereka mengikuti Yesus. Ia menyambut mereka dan berbicara kepada mereka tentang Kerajaan Allah serta menyembuhkan orang-orang yang memerlukan pengobatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang memerlukan penyembuhan.” Kata Yunani θεραπεία dapat berarti “penyembuhan” atau “pengobatan/perawatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Namun, ... orang banyak
  rationale: δέ menandai peralihan dengan sedikit kontras terhadap usaha Yesus untuk menyendiri sebelumnya. Bentuk jamak Yunani diterjemahkan dengan ungkapan kolektif Indonesia yang paling alami, yaitu 'orang banyak'.
- source_word: γνόντες
  choice: ketika ... mengetahui hal itu
  rationale: Partisip aoris ini berfungsi secara temporal. Klausa 'ketika ... mengetahui hal itu' alami dalam bahasa Indonesia dan mempertahankan hubungan waktu tanpa menentukan secara eksplisit hal apa yang mereka ketahui.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mereka mengikuti Yesus
  rationale: '''Mengikuti'' merupakan padanan lazim ἀκολουθέω dan tetap memungkinkan resonansi naratif kemuridan tanpa memaksakannya. Nama ''Yesus'' dipakai untuk menjernihkan rujukan pronomina secara alami dalam bahasa Indonesia.'
- source_word: ἀποδεξάμενος αὐτούς
  choice: Ia menyambut mereka
  rationale: ἀποδέχομαι di sini menyatakan penerimaan yang baik atau ramah; 'menyambut' menangkap nuansa tersebut lebih tepat daripada sekadar 'menerima'.
- source_word: ἐλάλει αὐτοῖς
  choice: berbicara kepada mereka
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung. Dalam rangkaian predikat Indonesia, 'berbicara' menyampaikan kegiatan berkelanjutan secara alami tanpa bentuk progresif yang kaku.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: tentang Kerajaan Allah
  rationale: Ini adalah padanan baku, jelas, dan konsisten bagi ungkapan kunci Injil tersebut. Huruf kapital menandai istilah khusus teologis dalam register Alkitab bahasa Indonesia.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: orang-orang yang memerlukan pengobatan
  rationale: θεραπεία dapat berarti penyembuhan maupun perawatan/pengobatan. 'Memerlukan pengobatan' mempertahankan konstruksi nominal serta menghindari pengulangan janggal dengan verba 'menyembuhkan', sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: ἰᾶτο
  choice: menyembuhkan
  rationale: Verba imperfek menggambarkan kegiatan penyembuhan yang sedang berlangsung. Koordinasi 'berbicara ... serta menyembuhkan' merupakan bentuk Indonesia yang lancar dan tetap mencerminkan dua kegiatan Yesus.
theological_decisions:
- issue: Padanan βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: '''Kerajaan Allah'' adalah ungkapan yang mapan dan cukup luas untuk mencakup pemerintahan Allah, tanpa mempersempitnya hanya menjadi wilayah atau secara sepihak menyelesaikan cakupan maknanya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Susunan kalimat dibuat alami, sementara aspek tindakan yang berlangsung dan ambiguitas θεραπεία dipertahankan sejauh memungkinkan.
