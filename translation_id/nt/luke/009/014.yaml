  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: id
  text: Sebab, ada kira-kira lima ribu laki-laki.[a] Lalu Yesus berkata kepada murid-murid-Nya, “Suruhlah mereka berbaring untuk makan dalam kelompok-kelompok, masing-masing kira-kira lima puluh orang.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai kata yang secara khusus berarti “laki-laki”, bukan seluruh orang banyak; perempuan dan anak-anak tidak termasuk dalam jumlah ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “Suruhlah mereka duduk dalam kelompok-kelompok, masing-masing kira-kira lima puluh orang.” Kata kerja Yunaninya secara khusus menggambarkan posisi berbaring atau bersandar ketika makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: kira-kira
  rationale: Menandai jumlah perkiraan, bukan angka pasti, dan dipakai secara alami pada kedua kemunculannya dalam ayat ini.
- source_word: ἄνδρες
  choice: laki-laki
  rationale: ἀνήρ di sini secara khusus menunjuk laki-laki, bukan orang pada umumnya; pilihan ini mempertahankan kekhususan sumber.
- source_word: πεντακισχίλιοι
  choice: lima ribu orang
  rationale: Menyampaikan bilangan kardinal secara langsung; 'orang' melengkapi ungkapan bilangan dalam bahasa Indonesia tanpa menghapus penanda 'laki-laki'.
- source_word: Κατακλίνατε
  choice: Suruhlah mereka duduk
  rationale: Bentuk kausatif imperatif berarti menyuruh orang mengambil posisi untuk makan. 'Duduk' lebih alami dalam bahasa Indonesia modern, sementara nuansa bersantap dijelaskan dalam catatan kaki.
- source_word: κλισίας
  choice: berkelompok-kelompok
  rationale: Menyatakan pembagian orang-orang ke dalam kelompok-kelompok yang tertata dengan bentuk Indonesia yang alami.
- source_word: ἀνὰ πεντήκοντα
  choice: masing-masing kira-kira lima puluh orang
  rationale: ἀνά bersama angka menyatakan pembagian distributif; 'masing-masing' membuat hubungan itu jelas.
- source_word: γὰρ ... δὲ
  choice: Sebab ... Lalu
  rationale: '''Sebab'' mempertahankan fungsi penjelas γάρ, sedangkan ''lalu'' mengalirkan δέ secara alami dalam narasi Indonesia.'
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: kepada murid-murid-Nya
  rationale: Mempertahankan pronomina posesif yang dinyatakan secara eksplisit dalam bahasa Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Nama 'Yesus' dinyatakan untuk memperjelas subjek tersirat dalam bahasa Yunani sesuai konteks, tanpa mengubah rujukannya. Ungkapan 'duduk' dipilih demi kewajaran bagi pembaca Indonesia, dengan nuansa posisi makan kuno dipertahankan dalam catatan kaki.
