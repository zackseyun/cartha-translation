id: LUK.9.30
reference: Luke 9:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: id
  text: Dan lihatlah, dua orang sedang berbicara dengan-Nya. Mereka adalah Musa dan Elia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda wacana Lukas yang mengarahkan perhatian pada kemunculan yang mendadak dan menghidupkan adegan; bentuk ini wajar dan tetap bermartabat dalam bahasa Indonesia.
- source_word: ἄνδρες δύο
  choice: dua orang
  rationale: Dalam konteks ini ἀνήρ menunjuk kepada dua tokoh laki-laki, yaitu Musa dan Elia. 'Dua orang' merupakan ungkapan Indonesia yang paling alami tanpa mengaburkan identitas mereka.
- source_word: συνελάλουν
  choice: sedang berbicara
  rationale: Bentuk imperfek menyatakan tindakan yang sedang berlangsung, sedangkan verba berawalan συν- menunjukkan percakapan bersama.
- source_word: αὐτῷ
  choice: dengan-Nya
  rationale: Bersama συλλαλέω, datif menunjukkan pihak yang diajak berbicara. 'Dengan-Nya' mempertahankan sifat timbal balik percakapan dan merujuk kepada Yesus dari konteks.
- source_word: οἵτινες
  choice: Mereka adalah
  rationale: Mengungkapkan fungsi pengenal dari pronomina relatif secara alami dalam bahasa Indonesia tanpa memberi tekanan tambahan yang tidak dituntut konteks.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam tradisi dan bahasa Indonesia modern.
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk baku nama nabi ini dalam bahasa Indonesia modern.
theological_decisions:
- issue: Identitas kedua tokoh dalam peristiwa transfigurasi
  choice: Teks secara langsung menyatakan bahwa kedua orang itu adalah Musa dan Elia.
  alternative: Menambahkan penjelasan mengenai makna simbolis atau eskatologis Musa dan Elia.
  rationale: Bahasa sumber hanya mengidentifikasi kedua tokoh tersebut. Terjemahan tidak menambahkan tafsiran mengenai peranan atau makna teologis mereka.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Lihatlah' mempertahankan daya naratif ἰδοὺ, sedangkan pemisahan menjadi dua kalimat menghindari konstruksi relatif yang kaku. Huruf kapital pada '-Nya' mengikuti konvensi umum penulisan rujukan kepada Yesus dalam teks Alkitab bahasa Indonesia.
source_grounding:
  english_pob_role: consult_only
