  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: id
  text: Ia berkata, “Waspadalah supaya kalian tidak disesatkan. Sebab banyak orang akan datang atas nama-Ku sambil berkata, ‘Akulah dia,’[a] dan, ‘Saatnya sudah dekat.’ Jangan mengikuti mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku ada.” Dalam konteks ini, perkataan itu merupakan klaim palsu bahwa dirinya adalah tokoh yang dinantikan, mungkin Mesias.
    reason: Menjaga kemungkinan terjemahan harfiah Ἐγώ εἰμι dan ketidakjelasan identitas yang diklaim.
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Waspadalah supaya kalian tidak disesatkan
  rationale: Ungkapan ini menyampaikan perintah untuk berjaga-jaga dan mempertahankan bentuk pasif πλανηθῆτε, yaitu bahaya disesatkan oleh pihak lain.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: akan datang atas nama-Ku
  rationale: Frasa ini secara alami menyatakan bahwa para pendatang memakai atau mengajukan nama dan kewenangan Yesus bagi klaim mereka.
- source_word: Ἐγώ εἰμι
  choice: Akulah Dia
  rationale: Bahasa Indonesia memerlukan pelengkap tersirat agar klaim identitas ini terbaca alami. 'Dia' tetap tidak menentukan secara eksplisit apakah yang dimaksud ialah Mesias atau tokoh yang dinantikan.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Waktunya sudah dekat
  rationale: καιρός menunjuk pada waktu yang menentukan atau ditetapkan, sedangkan bentuk perfekt ἤγγικεν menyatakan keadaan dekat yang kini berlaku.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Jangan mengikuti mereka
  rationale: Dalam konteks ini, gambaran pergi di belakang seseorang secara idiomatis berarti menjadi pengikutnya; terjemahan ini jelas dan alami.
theological_decisions:
- issue: Klaim Ἐγώ εἰμι oleh para penyesat
  choice: Akulah Dia
  alternative: 'Aku ada; atau: Akulah Mesias'
  rationale: Teks Yunani tidak menyebut predikat secara eksplisit. 'Akulah Dia' mempertahankan sifat eliptis klaim itu tanpa langsung menentukannya sebagai gelar Mesias ataupun sebagai gema mutlak dari penyataan diri ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan komunikatif. 'Kalian' dipakai untuk menandai bentuk jamak orang kedua dalam bahasa sumber. Kapitalisasi kata ganti yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
