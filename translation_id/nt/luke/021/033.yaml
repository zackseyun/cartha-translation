id: LUK.21.33
reference: Luke 21:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: id
  text: Langit dan bumi akan berlalu, tetapi perkataan-Ku sama sekali tidak akan berlalu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak akan pernah berlalu.” Bahasa Yunani memakai bentuk penyangkalan yang sangat tegas (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: langit
  rationale: Dalam pasangan kosmis ὁ οὐρανὸς καὶ ἡ γῆ, kata ini menunjuk pada langit sebagai bagian dari seluruh ciptaan, bukan sekadar angkasa yang terlihat.
- source_word: ἡ γῆ
  choice: bumi
  rationale: Dalam ungkapan berpasangan 'langit dan bumi', γῆ merujuk pada bumi, bukan suatu negeri atau wilayah tertentu.
- source_word: παρελεύσονται
  choice: akan berlalu
  rationale: παρέρχομαι di sini berarti berlalu atau berakhir. Pilihan ini mempertahankan bentuk masa depan serta pengulangan verba dalam kedua klausa.
- source_word: δὲ
  choice: tetapi
  rationale: δέ menandai pertentangan antara kefanaan langit dan bumi dengan ketetapan perkataan Yesus.
- source_word: οἱ λόγοι μου
  choice: perkataan-Ku
  rationale: λόγοι menunjuk pada kata-kata atau ucapan Yesus. Bentuk tunggal kolektif 'perkataan-Ku' alami dan khidmat dalam bahasa Indonesia.
- source_word: οὐ μὴ
  choice: sama sekali tidak
  rationale: Gabungan οὐ μή dengan verba masa depan merupakan negasi yang sangat tegas. 'Sama sekali tidak' menyampaikan penekanan itu dalam bahasa Indonesia modern tanpa mengurangi kekuatannya.
theological_decisions:
- issue: Kekuatan pernyataan Yesus mengenai kekalnya perkataan-Nya
  choice: Negasi tegas diterjemahkan 'sama sekali tidak akan berlalu'.
  alternative: '''tidak akan pernah berlalu'''
  rationale: Teks Yunani memakai οὐ μή, bukan negasi biasa. Terjemahan mempertahankan kontras mutlak antara berlalunya langit dan bumi dan tidak berlalunya perkataan Yesus, tanpa menambahkan penafsiran tentang cara atau waktunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Berlalu' dipertahankan pada kedua klausa untuk menjaga kesejajaran retoris teks sumber; huruf kapital pada '-Ku' mengikuti kebiasaan penulisan rujukan kepada Yesus.
