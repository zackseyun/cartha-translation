id: LUK.21.20
reference: Luke 21:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: id
  text: Namun, ketika kalian melihat Yerusalem dikepung oleh pasukan[a], ketahuilah bahwa kehancurannya[b] sudah dekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikelilingi perkemahan-perkemahan militer.” Istilah Yunani dapat menunjuk pada perkemahan atau pasukan yang berkemah; di sini yang dimaksud ialah kekuatan militer yang mengepung Yerusalem.
    reason: lexical_alternative
  - marker: b
    text: “Kehancuran” menggemakan bahasa penghukuman dalam kitab para nabi; bandingkan ungkapan yang berkaitan dalam Matius 24:15 dan Markus 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Namun, ketika
  rationale: Ὅταν memperkenalkan keadaan yang akan terjadi, sedangkan δὲ menandai peralihan atau pertentangan ringan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan wacananya.
- source_word: ἴδητε
  choice: kalian melihat
  rationale: Bentuk orang kedua jamak dibuat eksplisit dengan “kalian”; “melihat” sesuai dengan makna langsung ὁράω dalam konteks tanda yang tampak.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: dikepung oleh pasukan
  rationale: Partisipel pasif kini menggambarkan Yerusalem dalam keadaan dikelilingi. στρατόπεδον dapat berarti perkemahan militer atau pasukan yang berkemah; dalam konteks pengepungan, “pasukan” menyampaikan acuannya secara jelas.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: τότε γνῶτε
  choice: ketahuilah
  rationale: τότε tersirat secara alami dalam susunan “ketika ... ketahuilah”; bentuk imperatif “ketahuilah” mempertahankan daya perintah γνῶτε tanpa menambahkan penafsiran.
- source_word: ἤγγικεν
  choice: sudah dekat
  rationale: Bentuk perfektum menyatakan bahwa sesuatu telah mendekat dan kini berada dekat. “Sudah dekat” merupakan padanan Indonesia yang alami untuk keadaan hasil tersebut.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: kehancurannya
  rationale: ἐρήμωσις menunjuk pada keadaan menjadi sunyi, telantar, atau hancur akibat penghukuman. “Kehancuran” jelas bagi pembaca modern, sementara nuansa alternatif dan gema kenabiannya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Acuan penghukuman yang akan menimpa Yerusalem
  choice: Menerjemahkan ἐρήμωσις sebagai “kehancuran” tanpa menetapkan kerangka eskatologis tertentu.
  alternative: “Pembinasaan” atau “keadaan telantar”, atau menghubungkannya secara eksplisit dalam teks utama dengan “Pembinasa Keji”.
  rationale: Ayat ini sendiri menyatakan bahwa kehancuran Yerusalem sudah dekat ketika kota itu dikepung. Pilihan ini mempertahankan bobot penghukuman tanpa memasukkan skema penafsiran yang tidak dinyatakan oleh ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” menyatakan orang kedua jamak dalam bahasa sumber. Susunan ringkas mempertahankan nada peringatan dan perintah. Semua penanda catatan kaki ditempatkan pada unsur teks yang dijelaskannya.
