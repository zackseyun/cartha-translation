  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: id
  text: seperti jerat; sebab hari itu akan datang menimpa semua orang yang tinggal di seluruh muka bumi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti perangkap.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “semua orang yang duduk di muka seluruh bumi.” Dalam ungkapan ini, kata Yunani yang secara harfiah berarti “duduk” mengacu pada orang-orang yang tinggal atau berdiam. Kata yang diterjemahkan “bumi” juga dapat berarti “negeri”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς παγίς
  choice: seperti jerat
  rationale: παγίς berarti jerat atau perangkap. “Jerat” mempertahankan gambaran sesuatu yang datang secara tiba-tiba dan menawan korbannya, serta cocok dengan ragam bahasa yang bermartabat.
- source_word: ἐπεισελεύσεται
  choice: hari itu akan mendatangi
  rationale: Bentuk ini menyatakan bahwa sesuatu akan datang menimpa atau mendatangi orang. Subjek tersiratnya adalah “hari itu” dari ayat sebelumnya; subjek tersebut dinyatakan agar kalimat Indonesia jelas tanpa mengubah acuannya.
- source_word: γὰρ
  choice: Sebab
  rationale: γάρ menjelaskan alasan bagi peringatan sebelumnya. “Sebab” mempertahankan hubungan logis itu secara alami.
- source_word: ἐπὶ πάντας
  choice: semua orang
  rationale: Preposisi ἐπί bersama verba tersebut menyatakan sasaran datangnya hari itu. Dalam bahasa Indonesia, makna relasionalnya sudah tercakup secara alami dalam “mendatangi semua orang”.
- source_word: τοὺς καθημένους
  choice: yang tinggal
  rationale: Walaupun κάθημαι secara harfiah dapat berarti “duduk”, dalam ungkapan ini partisip tersebut menunjuk kepada orang-orang yang berdiam atau tinggal di bumi.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: di seluruh muka bumi
  rationale: Ungkapan ini secara harfiah menunjuk pada muka atau permukaan seluruh bumi. Susunan “di seluruh muka bumi” alami dalam bahasa Indonesia dan mempertahankan idiom serta cakupan universal yang paling sesuai dengan konteks.
theological_decisions:
- issue: Cakupan γῆ dalam peringatan eskatologis
  choice: seluruh muka bumi
  alternative: seluruh negeri
  rationale: γῆ dapat berarti “bumi” atau “negeri”. Namun, gabungan dengan πάντας dan ungkapan “di muka seluruh γῆ” paling wajar menyatakan cakupan universal. Catatan kaki mempertahankan kemungkinan leksikal yang lebih sempit tanpa memasukkannya ke teks utama.
- issue: Subjek tersirat ἐπεισελεύσεται
  choice: hari itu
  alternative: hal itu
  rationale: Verba Yunani tidak menyebut ulang subjek, tetapi konteks langsung pada ayat sebelumnya adalah “hari itu”. Menyatakan “hari itu” diperlukan demi kejelasan bahasa Indonesia dan tidak menambahkan identifikasi teologis baru.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada khidmat dan jelas. “Jerat” mempertahankan citra teks, sedangkan “tinggal” menyampaikan arti idiomatis καθημένους. Teks merupakan kelanjutan sintaksis dari ayat sebelumnya, sehingga dimulai dengan huruf kecil.
