  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: id
  text: Dan kamu akan dibenci oleh semua orang karena nama-Ku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Aku.” Ungkapan “nama-Ku” dapat merujuk pada identitas dan kewibawaan Yesus serta pengakuan kesetiaan kepada-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini mempertahankan kesinambungan dengan perkataan sebelumnya.
- source_word: ἔσεσθε μισούμενοι
  choice: kamu akan dibenci
  rationale: Gabungan kopula futur dan partisip pasif paling alami dinyatakan sebagai konstruksi pasif futur dalam bahasa Indonesia. Kata 'kamu' dapat menunjuk kelompok murid sesuai bentuk jamak Yunani.
- source_word: ὑπὸ πάντων
  choice: oleh semua orang
  rationale: ὑπό dengan genitif menandai pelaku, sedangkan πάντων bersifat luas. Penambahan 'orang' diperlukan agar ungkapan Indonesia jelas dan alami tanpa mengubah cakupannya.
- source_word: διὰ τὸ ὄνομά μου
  choice: karena nama-Ku
  rationale: διά dengan akusatif menyatakan sebab. Terjemahan harfiah 'nama-Ku' mempertahankan keluasan makna yang mencakup identitas, kewibawaan, dan pengakuan kepada Yesus.
theological_decisions:
- issue: Makna 'nama-Ku' dalam konteks penganiayaan para murid
  choice: Mempertahankan ungkapan 'karena nama-Ku'.
  alternative: karena Aku; karena kamu mengikut Aku
  rationale: Teks Yunani secara eksplisit menyebut 'nama-Ku'. Mempertahankannya menghindari penyempitan makna dan menjaga kaitannya dengan identitas, kewibawaan, serta kesetiaan kepada Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Semua orang' lebih alami daripada 'semua' untuk pelaku manusia; kapital pada enklitik '-Ku' mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab bahasa Indonesia.
