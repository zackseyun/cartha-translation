  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: id
  text: Pada siang hari Yesus mengajar di kompleks Bait Allah[a], tetapi pada malam hari Ia keluar dan bermalam[b] di bukit yang disebut Bukit Zaitun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai menunjuk seluruh kompleks atau pelataran Bait Allah, bukan khusus ruang kudus di bagian dalam.
    reason: lexical_alternative
  - marker: b
    text: Atau "menghabiskan malam"; kata ini juga dapat menyiratkan bermalam di tempat terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: Yesus mengajar
  rationale: Konstruksi imperfek perifrastis menyatakan kegiatan yang berlangsung secara kebiasaan; bersama keterangan waktu berulang, bentuk ini wajar diterjemahkan sebagai kegiatan rutin. Nama Yesus dipakai untuk memperjelas subjek tersirat dalam bahasa Indonesia.
- source_word: τὰς ἡμέρας
  choice: Pada siang hari
  rationale: Akusatif waktu menunjukkan waktu berlangsungnya kegiatan dan membentuk kontras alami dengan malam hari.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kawasan atau kompleks Bait Allah, bukan khusus ruang kudus bagian dalam.
- source_word: τὰς δὲ νύκτας
  choice: tetapi pada malam hari
  rationale: Ungkapan ini menyatakan pola berulang dan δέ menandai kontras dengan kegiatan pada siang hari.
- source_word: ἐξερχόμενος
  choice: Ia keluar
  rationale: Partisip tersebut menyertai tindakan utama dan dalam konteks imperfek menggambarkan kebiasaan berulang.
- source_word: ηὐλίζετο
  choice: bermalam
  rationale: Kata ini berarti menghabiskan malam atau menginap, mungkin juga di tempat terbuka; 'bermalam' alami dan tidak menentukan caranya secara berlebihan.
- source_word: εἰς τὸ ὄρος
  choice: di bukit
  rationale: Walaupun εἰς biasanya menyatakan arah, dengan verba bermalam frasa ini menunjukkan tujuan yang menjadi lokasi bermalam. 'Di bukit' alami dalam bahasa Indonesia.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: yang disebut Bukit Zaitun
  rationale: Ini mempertahankan bentuk penamaan dalam teks Yunani sekaligus memakai nama tempat Indonesia yang lazim dan jelas.
theological_decisions: []
