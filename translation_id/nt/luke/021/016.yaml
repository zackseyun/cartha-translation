  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: id
  text: Namun, kalian akan diserahkan bahkan oleh orang tua, saudara laki-laki[a], sanak saudara, dan teman-teman, dan mereka akan membunuh sebagian dari kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudari” atau “saudara kandung”; bentuk jamak maskulin dalam bahasa Yunani kadang dapat merujuk kepada kelompok saudara yang mencakup laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: kalian akan diserahkan
  rationale: Bentuk pasif futurum παραδίδωμι menyatakan bahwa para murid akan diserahkan kepada pihak yang memusuhi mereka. "Diserahkan" mempertahankan arti dasarnya tanpa secara eksplisit membatasi makna menjadi "dikhianati".
- source_word: δὲ
  choice: Namun
  rationale: δέ melanjutkan perkataan dengan peralihan yang agak kontras terhadap jaminan dalam konteks sebelumnya. "Namun" menyampaikan kontras ringan itu secara wajar.
- source_word: καὶ
  choice: bahkan
  rationale: 'καί pertama setelah δέ bersifat menanjak atau menegaskan: bukan hanya oleh orang luar, melainkan bahkan oleh orang-orang terdekat.'
- source_word: ὑπὸ
  choice: oleh
  rationale: Dengan verba pasif, ὑπό menandai pelaku personal; "oleh" merupakan padanan baku dalam bahasa Indonesia.
- source_word: γονέων
  choice: orang tua
  rationale: Bentuk jamak γονεύς menunjuk secara kolektif kepada ayah dan ibu; "orang tua" adalah ungkapan Indonesia yang alami dan inklusif.
- source_word: ἀδελφῶν
  choice: saudara laki-laki
  rationale: Bentuk jamak maskulin diterjemahkan sesuai bentuk eksplisit sumber. Karena dalam daftar kekerabatan kata ini juga dapat mencakup saudara perempuan, kemungkinan tersebut dipertahankan dalam catatan kaki.
- source_word: συγγενῶν
  choice: sanak saudara
  rationale: συγγενής menunjuk anggota keluarga atau kaum kerabat. "Sanak saudara" jelas, alami, dan membedakannya dari saudara kandung yang disebut sebelumnya.
- source_word: φίλων
  choice: sahabat
  rationale: φίλος dalam bentuk jamak menunjuk orang-orang yang memiliki hubungan pertemanan dekat. "Sahabat" sesuai dengan konteks pengkhianatan oleh relasi intim dan tetap merupakan padanan alami.
- source_word: θανατώσουσιν
  choice: mereka akan membunuh
  rationale: θανατόω berarti menyebabkan seseorang mati atau menjatuhkan hukuman mati. "Membunuh" alami dalam bahasa Indonesia dan tidak mempersempit caranya menjadi eksekusi resmi saja.
- source_word: ἐξ ὑμῶν
  choice: sebagian dari kalian
  rationale: Ungkapan partitif ini berarti bahwa hanya sebagian dari kelompok yang akan dibunuh; "sebagian dari kalian" menyampaikan hal itu dengan jelas.
theological_decisions:
- issue: Cakupan ἀδελφῶν dalam daftar hubungan keluarga
  choice: saudara laki-laki
  alternative: saudara-saudari; saudara kandung
  rationale: Bentuk Yunani adalah jamak maskulin, sehingga teks utama mempertahankan rujukan eksplisit kepada saudara laki-laki. Namun, pemakaian jamak maskulin Yunani kadang dapat mencakup kelompok saudara yang terdiri dari laki-laki dan perempuan; ambiguitas ini dicatat tanpa diputuskan secara diam-diam.
- issue: Nuansa παραδοθήσεσθε ketika pelakunya orang-orang terdekat
  choice: diserahkan
  alternative: dikhianati
  rationale: Konteks jelas mengandung unsur pengkhianatan, tetapi verba itu sendiri lebih mendasar berarti menyerahkan seseorang. "Diserahkan" menjaga perbedaan antara arti leksikal dan nuansa yang timbul dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina "kalian" dipakai untuk menandai orang kedua jamak secara jelas. Deretan hubungan keluarga dipertahankan, dan catatan kaki menjaga kemungkinan cakupan gender pada ἀδελφῶν.
