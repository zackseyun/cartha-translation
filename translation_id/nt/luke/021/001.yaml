  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: id
  text: Lalu Yesus menengadah dan melihat orang-orang kaya memasukkan persembahan mereka ke dalam perbendaharaan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemberian mereka”.'
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang diterjemahkan “perbendaharaan” dapat menunjuk pada ruang perbendaharaan Bait Allah atau pada wadah-wadah untuk menerima persembahan.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: menengadah
  rationale: Partisip aoris ini menggambarkan tindakan mengangkat pandangan. "Menengadah" ringkas dan alami dalam narasi Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel penghubung ringan ini melanjutkan alur narasi tanpa menyiratkan pertentangan kuat.
- source_word: εἶδεν
  choice: melihat
  rationale: Padanan langsung yang mempertahankan tindakan persepsi tanpa menambahkan nuansa seperti memperhatikan secara khusus.
- source_word: τοὺς βάλλοντας
  choice: orang-orang ... memasukkan
  rationale: Partisip berartikel berfungsi sebagai nomina jamak, sedangkan βάλλω dalam konteks pemberian lebih alami diterjemahkan "memasukkan" daripada "melemparkan".
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: ke dalam tempat persembahan
  rationale: Istilah Yunani dapat menunjuk pada ruang perbendaharaan Bait Allah atau wadah-wadah penerimaan persembahan. Padanan ini alami dan cukup luas untuk tidak menentukan salah satunya.
- source_word: τὰ δῶρα αὐτῶν
  choice: persembahan mereka
  rationale: Walaupun δῶρα secara leksikal berarti "pemberian", dalam konteks ibadah ini "persembahan" lebih alami dan jelas bagi pembaca Indonesia.
- source_word: πλουσίους
  choice: orang-orang kaya
  rationale: Adjektiva ini berfungsi substantival dan menerangkan orang-orang yang dilihat; bentuk ini alami dalam bahasa Indonesia serta tidak mengubahnya menjadi label golongan abstrak.
theological_decisions:
- issue: Subjek tersirat pada verba orang ketiga tunggal
  choice: Yesus
  alternative: dia
  rationale: Bahasa Yunani tidak mengulang nama subjek, tetapi konteks sebelumnya menunjukkan Yesus. Penyebutan nama menghindari ambiguitas pronomina dalam bahasa Indonesia tanpa menambahkan tafsir teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara cakupan makna γαζοφυλάκιον dipertahankan melalui pilihan umum dan catatan kaki.
