translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Kalian’ dipakai untuk memperjelas bahwa kata ganti Yunani berbentuk jamak. Idiom ‘dalam hati’ dipertahankan, sedangkan susunan infinitif Yunani dialihkan menjadi konstruksi Indonesia yang alami.
