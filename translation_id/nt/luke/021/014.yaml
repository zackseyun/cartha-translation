  text: ⸀θέτε οὖν ⸂ἐν ταῖς καρδίαις⸃ ὑμῶν μὴ προμελετᾶν ἀπολογηθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: id
  text: Karena itu, tetapkanlah dalam hati kalian[a] untuk tidak mempersiapkan pembelaan kalian terlebih dahulu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bulatkanlah tekad dalam hati kalian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk tidak terlebih dahulu melatih apa yang akan kalian katakan dalam membela diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: tetapkanlah
  rationale: Bentuk perintah aoris dari τίθημι, bersama ungkapan ‘dalam hati kalian’, menyatakan keputusan batin yang tegas. ‘Tetapkanlah’ mempertahankan bentuk perintah sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari konteks sebelumnya. ‘Karena itu’ menyatakan hubungan logis tersebut dengan jelas.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dalam hati kalian
  rationale: Mempertahankan idiom antropologis Yunani tentang pusat tekad batin serta bentuk jamak karena Yesus berbicara kepada lebih dari satu orang.
- source_word: μὴ προμελετᾶν
  choice: untuk tidak mempersiapkan ... terlebih dahulu
  rationale: προμελετάω menunjuk pada memikirkan, menyiapkan, atau melatih sesuatu sebelumnya. Susunan ini jelas dan alami dalam bahasa Indonesia serta tidak mempersempit maknanya hanya pada latihan lisan.
- source_word: ἀπολογηθῆναι
  choice: pembelaan kalian
  rationale: Kata kerja ini lazim menunjuk pada penyampaian pembelaan, khususnya dalam suasana hukum atau pemeriksaan. Bentuk nominal menghasilkan kalimat Indonesia yang ringkas dan tetap membawa makna membela diri.
