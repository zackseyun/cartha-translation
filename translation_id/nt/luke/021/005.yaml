  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: id
  text: 'Ketika beberapa orang berbicara tentang Bait Allah yang dihiasi dengan batu-batu indah dan persembahan yang dibaktikan kepada Allah,[a] Dia berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani untuk «Bait Allah» menunjuk pada seluruh kawasan Bait Allah, bukan hanya ruang kudus di bagian dalam. «Persembahan yang dibaktikan kepada Allah» dapat juga diterjemahkan «pemberian yang dipersembahkan kepada Allah».
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Ketika beberapa orang berbicara
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu yang alami dalam bahasa Indonesia, sambil mempertahankan aspek kegiatan yang sedang berlangsung.
- source_word: τοῦ ἱεροῦ
  choice: Bait Allah
  rationale: ἱερόν menunjuk pada kompleks atau kawasan Bait Allah secara umum, bukan hanya ruang kudus bagian dalam; 'Bait Allah' merupakan padanan Indonesia yang baku dan mudah dipahami.
- source_word: λίθοις καλοῖς
  choice: dengan batu-batu indah
  rationale: καλοῖς menyatakan keindahan atau mutu mengesankan dari batu-batu tersebut; 'indah' mempertahankan penilaian itu secara lugas.
- source_word: ἀναθήμασιν
  choice: persembahan-persembahan khusus
  rationale: Istilah ini menunjuk pada benda-benda yang dipersembahkan atau dibaktikan kepada Allah dan dipajang di Bait Allah. 'Persembahan khusus' lebih mudah dipahami pembaca umum daripada istilah teknis 'persembahan nazar'.
- source_word: κεκόσμηται
  choice: yang dihiasi
  rationale: Bentuk perfektum pasif menggambarkan Bait Allah dalam keadaan telah dihiasi. Dalam bahasa Indonesia, 'yang dihiasi' menyampaikan keadaan hasil tersebut dengan alami tanpa memaksakan urutan waktu yang tidak perlu.
- source_word: εἶπεν
  choice: berkatalah Dia
  rationale: Subjek tersirat dipertahankan sebagai pronomina dan tidak diperjelas menjadi nama 'Yesus', sehingga mengikuti bentuk serta alur teks Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan pengantar naratif yang belum selesai karena perkataan Yesus baru muncul pada ayat berikutnya. Istilah teknis yang kurang umum dihindari dalam teks utama dan cakupan ἱερόν dijelaskan dalam catatan kaki.
