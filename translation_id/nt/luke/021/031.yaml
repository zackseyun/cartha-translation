  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: id
  text: 'Demikian juga, kalian: ketika kalian melihat hal-hal ini terjadi[a], ketahuilah bahwa Kerajaan Allah[b] sudah dekat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal ini berlangsung.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pemerintahan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Demikian juga kalian
  rationale: Ungkapan ini menerapkan perumpamaan sebelumnya kepada para murid. “Kalian” menyatakan bentuk jamak dari ὑμεῖς secara wajar dalam bahasa Indonesia modern.
- source_word: ὅταν ἴδητε
  choice: apabila kalian melihat
  rationale: ὅταν dengan bentuk subjungtif menyatakan keadaan yang akan terjadi. “Apabila” mempertahankan unsur waktu sekaligus kemungkinan tanpa membuatnya terdengar berulang.
- source_word: ταῦτα γινόμενα
  choice: hal-hal ini terjadi
  rationale: Frasa ini menunjuk pada berbagai peristiwa yang baru saja digambarkan. “Terjadi” merupakan padanan modern dan langsung bagi γινόμενα dalam konteks ini.
- source_word: γινώσκετε
  choice: ketahuilah
  rationale: 'Dalam konteks ini bentuk tersebut dipahami sebagai imperatif: para murid diperintahkan mengenali makna tanda-tanda itu. “Ketahuilah” mempertahankan daya perintahnya.'
- source_word: ἐγγύς ἐστιν
  choice: sudah dekat
  rationale: Ungkapan ini menyatakan kedekatan. “Sudah dekat” alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah kedekatan itu terutama bersifat waktu atau manifestasi.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini adalah padanan baku yang dapat mencakup pemerintahan maupun ranah kerajaan Allah, sehingga tidak mempersempit makna sumber.
theological_decisions:
- issue: Makna “Kerajaan Allah” dalam konteks eskatologis
  choice: Mempertahankan ungkapan “Kerajaan Allah” tanpa penjelasan interpretatif di dalam teks.
  alternative: “pemerintahan Allah” atau “pemerintahan rajawi Allah mendekati penggenapannya”
  rationale: Ayat ini menghubungkan kedekatan Kerajaan Allah dengan tanda-tanda yang disebutkan, tetapi tidak menjelaskan apakah yang terutama dimaksud ialah penampakan, penggenapan, atau pembenaran. Ungkapan sumber dipertahankan agar ketegangan teologis itu tidak diselesaikan oleh terjemahan.
- issue: Fungsi γινώσκετε
  choice: Menerjemahkannya sebagai perintah, “ketahuilah”.
  alternative: “kalian tahu” sebagai bentuk indikatif
  rationale: Bentuk Yunani dapat sama secara morfologis untuk indikatif dan imperatif orang kedua jamak, tetapi susunan perbandingan dan penerapan dalam konteks ini paling wajar dibaca sebagai perintah. Alternatif gramatikal dicatat tanpa mengubah teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipilih untuk menyatakan sapaan jamak dengan jelas; struktur kalimat tetap dekat dengan urutan dan daya retoris teks Yunani.
