  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: id
  text: 'Lalu Ia menyampaikan sebuah perumpamaan kepada mereka: “Perhatikanlah pohon ara dan semua pohon.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Dalam alur narasi bahasa Indonesia, “Lalu” secara alami melanjutkan tindakan berikutnya tanpa memberi penekanan berlebihan.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: Dia menyampaikan sebuah perumpamaan kepada mereka
  rationale: Ungkapan ini menyatakan bahwa Yesus mengemukakan perumpamaan kepada para pendengar. “Menyampaikan” lebih wajar daripada terjemahan harfiah “mengatakan sebuah perumpamaan” dan tetap mempertahankan unsur αὐτοῖς.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: “Perumpamaan” merupakan padanan baku dan tepat bagi παραβολή dalam konteks pengajaran Injil.
- source_word: Ἴδετε
  choice: Perhatikanlah
  rationale: Bentuk imperatif ini mengarahkan perhatian pendengar kepada contoh yang disebutkan; “Perhatikanlah” alami dan mencakup nuansa melihat serta mencermati.
- source_word: τὴν συκῆν
  choice: pohon ara
  rationale: συκῆ merujuk pada pohonnya, sehingga “pohon ara” lebih tepat daripada hanya nama buahnya.
- source_word: πάντα τὰ δένδρα
  choice: semua pohon lainnya
  rationale: Secara idiomatis, pohon ara termasuk dalam kelompok pohon yang disebut; “lainnya” membuat hubungan itu jelas dalam bahasa Indonesia, walaupun kata tersebut tersirat dan tidak dinyatakan tersendiri dalam bahasa Yunani.
