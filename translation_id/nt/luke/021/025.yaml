id: LUK.21.25
reference: Luke 21:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: id
  text: Dan akan ada tanda-tanda pada matahari, bulan, dan bintang-bintang, dan di bumi bangsa-bangsa akan mengalami kesesakan dalam kebingungan karena bunyi gemuruh laut dan geloranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada bunyi laut dan geloranya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Padanan yang luas dan lazim, yang menyampaikan fenomena luar biasa tanpa mempersempitnya menjadi pertanda buruk.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: pada matahari, bulan, dan bintang-bintang
  rationale: Dalam bahasa Indonesia, 'pada' secara alami menunjukkan tempat munculnya tanda-tanda; artikel Yunani yang tidak hadir tidak perlu direproduksi.
- source_word: συνοχὴ ἐθνῶν
  choice: bangsa-bangsa akan dilanda kesesakan
  rationale: συνοχή menunjuk pada tekanan atau kesesakan yang menghimpit. Susunan verbal ini lebih alami daripada nominalisasi kaku, sambil mempertahankan bangsa-bangsa sebagai pihak yang mengalaminya.
- source_word: ἐν ἀπορίᾳ
  choice: dan kebingungan
  rationale: ἀπορία menggambarkan keadaan kehilangan jalan keluar atau tidak tahu harus berbuat apa; 'kebingungan' jelas dan wajar bagi pembaca modern.
- source_word: ἤχους θαλάσσης
  choice: karena gemuruh laut
  rationale: ἦχος berarti bunyi atau suara; dalam konteks laut yang bergolak, 'gemuruh' menyampaikan bunyi dahsyat secara alami. 'Karena' mengungkapkan hubungan kontekstual antara keadaan bangsa-bangsa dan gejolak laut.
- source_word: σάλου
  choice: gelombangnya yang bergelora
  rationale: σάλος menunjuk pada guncangan, gelora, atau gerakan laut. Ungkapan ini alami dalam bahasa Indonesia dan menjadikan acuannya kepada laut jelas tanpa mereduksi kata tersebut menjadi sekadar bunyi.
theological_decisions:
- issue: Sifat tanda-tanda kosmis
  choice: Bahasa apokaliptik diterjemahkan secara langsung tanpa menentukan apakah fenomena itu harfiah, simbolis, atau keduanya.
  alternative: Menafsirkannya secara eksplisit sebagai gangguan astronomis harfiah atau sebagai simbol pergolakan politik.
  rationale: Ayat menyebut tanda-tanda pada benda-benda langit dan kesesakan di bumi, tetapi tidak menyelesaikan perdebatan tentang cara penggenapannya.
- issue: Hubungan ἤχους θαλάσσης καὶ σάλου dengan kesesakan dan kebingungan
  choice: Dinyatakan dengan 'karena' sebagai pemicu kesesakan dan kebingungan.
  alternative: Menggunakan 'oleh/terhadap bunyi laut dan geloranya' untuk mempertahankan hubungan yang lebih terbuka.
  rationale: Konstruksi Yunani ringkas dan agak sukar, tetapi konteks paling alami menunjukkan bahwa gemuruh dan gelora laut menyebabkan atau memicu keadaan bangsa-bangsa; catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum tanpa menghilangkan kesejajaran antara tanda-tanda di langit dan kesesakan di bumi.
