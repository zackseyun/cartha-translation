  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: id
  text: Sebab Aku akan memberi kamu kata-kata dan hikmat yang tidak akan dapat dilawan atau dibantah oleh semua orang yang menentang kamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: kata-kata
  rationale: Secara harfiah berarti “mulut”, tetapi dalam konteks pembelaan lisan merupakan metonimia untuk perkataan yang akan diucapkan. “Kata-kata” menyampaikan maksudnya secara alami dalam bahasa Indonesia.
- source_word: σοφίαν
  choice: hikmat
  rationale: Padanan baku dan bermartabat untuk σοφία, yang di sini menunjuk pada kecakapan atau pengertian ilahi dalam memberi jawaban.
- source_word: ἀντιστῆναι
  choice: dilawan
  rationale: Mempertahankan arti menentang atau bertahan menghadapi perkataan dan hikmat yang diberikan.
- source_word: ἀντειπεῖν
  choice: dibantah
  rationale: Menunjuk pada tindakan menyanggah atau berbicara menentang, dan membedakannya dari ἀντιστῆναι.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: semua orang yang menentang kamu
  rationale: Menyampaikan acuan personal dan sikap permusuhan frasa Yunani secara jelas dan alami.
theological_decisions:
- issue: Cakupan janji ketidakmampuan para penentang
  choice: Mempertahankan pernyataan bahwa semua penentang tidak akan sanggup melawan atau membantah kata-kata dan hikmat yang diberikan.
  alternative: Menafsirkan janji sebagai jaminan bahwa para murid tidak akan dihukum atau bahwa semua lawan akan bertobat.
  rationale: Ayat ini secara khusus menjanjikan kemampuan bersaksi yang tidak dapat diatasi atau disanggah; ayat tidak mengatakan bahwa para murid akan terhindar dari penganiayaan atau kematian.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “Aku” memakai huruf kapital karena merujuk kepada Yesus; “kamu” mempertahankan bentuk orang kedua jamak dari konteks tanpa menambahkan penafsiran. Susunan klausa dibuat alami sambil mempertahankan hubungan kata-kata dan hikmat dengan kedua verba, “dilawan” dan “dibantah”.
