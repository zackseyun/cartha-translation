id: LUK.21.27
reference: Luke 21:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: id
  text: Dan pada waktu itu mereka akan melihat Anak Manusia datang dalam awan dengan kuasa dan kemuliaan yang besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di atas awan.” Teks Yunani memakai bentuk tunggal, “dalam awan,” sedangkan gambaran ini menggemakan Daniel 7 dan bagian-bagian terkait tentang Anak Manusia yang datang bersama awan-awan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: mereka akan melihat
  rationale: Bentuk futur dari ὁράω menyatakan persepsi visual yang akan terjadi. Ungkapan ini lugas dan alami dalam bahasa Indonesia modern.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ini adalah padanan baku bagi gelar tersebut dan mempertahankan kaitannya dengan gambaran dalam Daniel 7.
- source_word: ἐρχόμενον
  choice: datang
  rationale: Partisipel kini ini menggambarkan tindakan yang terlihat sedang berlangsung; 'datang' merupakan padanan yang alami dan tepat dalam konteks ini.
- source_word: ἐν νεφέλῃ
  choice: dalam awan
  rationale: Teks Yunani memakai ἐν dengan bentuk datif dan kata benda tunggal, sehingga secara langsung berarti 'dalam awan'. Pilihan ini mempertahankan bentuk khas Lukas tanpa menyelaraskannya dengan ayat-ayat lain.
- source_word: μετὰ δυνάμεως
  choice: dengan kuasa
  rationale: μετά dengan bentuk genitif menunjukkan penyertaan; 'dengan kuasa' jelas, alami, dan sesuai dengan konteks kedatangan yang agung.
- source_word: δόξης πολλῆς
  choice: kemuliaan yang besar
  rationale: Ungkapan ini menyampaikan besarnya kemuliaan secara alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan gelar kristologis τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: '''Anak Manusia'' mempertahankan gelar yang dikenal luas serta hubungan sastra dan teologisnya dengan Daniel 7, tanpa mereduksinya menjadi sekadar sebutan umum bagi manusia.'
- issue: Gambaran awan dan gaung Danielis/teofanis
  choice: dalam awan
  alternative: di atas awan
  rationale: Terjemahan mengikuti kata tunggal νεφέλῃ dan konstruksi ἐν dalam teks Lukas. Catatan kaki mempertahankan kemungkinan padanan idiomatis lain serta menjelaskan gaung Daniel 7 tanpa memasukkannya secara berlebihan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan urutan gagasan Yunani, sementara frasa 'kemuliaan yang besar' dipilih agar alami bagi pembaca umum.
