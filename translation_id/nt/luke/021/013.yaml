  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: id
  text: Hal ini akan menjadi kesempatan bagi kalian untuk memberi kesaksian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hal ini akan menjadi kesaksian bagi kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: akan menjadi
  rationale: Bentuk futur ini menyatakan hasil atau akibat dari peristiwa yang disebut sebelumnya, bukan sekadar bahwa sesuatu akan terjadi.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Bentuk datif menunjukkan bahwa hasil tersebut berlaku bagi para murid; ‘bagi kalian’ alami dalam bahasa Indonesia dan tetap dekat dengan konstruksi Yunani.
- source_word: εἰς
  choice: menjadi
  rationale: Dalam frasa εἰς μαρτύριον, preposisi ini dapat menandai hasil atau tujuan. Gabungan ‘akan menjadi kesaksian’ mengungkapkan fungsi resultatifnya secara alami.
- source_word: μαρτύριον
  choice: kesaksian
  rationale: Kata ini dapat menunjuk pada kesaksian, tindakan bersaksi, atau bukti. ‘Kesaksian’ mempertahankan nuansa hukum dan publik dalam konteks para murid dibawa menghadap penguasa.
theological_decisions:
- issue: Makna penderitaan para murid di hadapan para penguasa
  choice: Peristiwa yang dinubuatkan Yesus akan menjadi kesempatan atau sarana kesaksian bagi para murid.
  alternative: Peristiwa itu akan menjadi bukti yang memberatkan para penentang mereka.
  rationale: Dalam konteks penangkapan dan pemeriksaan di hadapan para penguasa, μαρτύριον paling wajar berkaitan dengan kesaksian para murid tentang Yesus. Namun, teks utama tidak menambahkan objek atau tujuan kesaksian sehingga keluasan dan ketegangan maknanya tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. ‘Kalian’ dipakai untuk menyatakan bentuk jamak ὑμῖν dengan jelas. Susunan ‘akan menjadi kesaksian bagi kalian’ mempertahankan ambiguitas antara hasil, fungsi, dan kesempatan untuk bersaksi; catatan kaki menyajikan pembacaan yang lebih eksplisit.
