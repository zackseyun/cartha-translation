id: LUK.21.12
reference: Luke 21:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: id
  text: Namun, sebelum semuanya itu terjadi, mereka akan menangkap kamu[a] dan menganiaya kamu. Mereka akan menyerahkan kamu kepada rumah-rumah ibadat dan penjara-penjara, dan kamu akan dibawa menghadap raja-raja dan para gubernur karena nama-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “meletakkan tangan mereka atas kamu,” yaitu menangkap atau memperlakukan kamu dengan kasar.'
    reason: lexical_alternative
  - marker: b
    text: “Karena nama-Ku” juga dapat diterjemahkan “demi nama-Ku” atau, secara lebih interpretatif, “karena Aku.” Ungkapan “nama-Ku” menunjuk kepada pribadi dan otoritas Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Namun, sebelum semuanya itu terjadi
  rationale: πρό dengan genitif menyatakan waktu yang mendahului; πάντων mempertahankan cakupan 'semuanya'. Kata 'terjadi' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas rujukan kepada peristiwa-peristiwa sebelumnya, sedangkan δέ diterjemahkan 'Namun' sebagai peralihan yang bersifat kontras.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: mereka akan menangkap kamu
  rationale: Ungkapan harfiah 'menumpangkan tangan atas kamu' di sini merupakan idiom tindakan bermusuhan berupa penangkapan atau penguasaan paksa. 'Menangkap kamu' menyampaikan maknanya secara alami dan tidak menimbulkan kesan tindakan pemberkatan.
- source_word: διώξουσιν
  choice: menganiaya kamu
  rationale: Dalam konteks permusuhan terhadap para murid, διώκω berarti menganiaya, bukan sekadar mengejar.
- source_word: παραδιδόντες
  choice: menyerahkan kamu
  rationale: Partisipel ini menjelaskan salah satu bentuk penganiayaan, dengan nuansa menyerahkan seseorang kepada lembaga atau pihak yang berwenang.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: kepada rumah-rumah ibadat dan penjara-penjara
  rationale: εἰς bersama παραδιδόντες secara alami diterjemahkan 'kepada'. 'Rumah ibadat' merupakan istilah Indonesia yang mudah dipahami untuk συναγωγή dan tetap mempertahankan lembaganya tanpa menambahkan tafsiran mengenai pejabat atau persidangannya.
- source_word: ἀπαγομένους
  choice: membawa kamu
  rationale: Bentuk akusatif pasif secara gramatikal menggambarkan para murid sebagai orang yang dibawa. Karena subjek pelaku telah dinyatakan sebagai 'mereka', konstruksi aktif Indonesia 'mereka ... membawa kamu' menyampaikan relasi itu secara alami.
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: menghadap raja-raja dan para gubernur
  rationale: Dalam konteks hukum, ἐπί menunjukkan bahwa para murid dibawa ke hadapan para penguasa. 'Menghadap' menyampaikan nuansa kemunculan di depan otoritas.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: karena nama-Ku
  rationale: Terjemahan ini mempertahankan ungkapan alkitabiah yang menghubungkan nama Yesus dengan pribadi dan otoritas-Nya, tanpa mempersempitnya menjadi satu penafsiran.
theological_decisions:
- issue: Makna 'nama-Ku' dalam konteks penganiayaan
  choice: Mempertahankan ungkapan 'karena nama-Ku'.
  alternative: karena Aku; demi nama-Ku; karena kamu adalah pengikut-Ku
  rationale: τοῦ ὀνόματός μου memiliki bobot teologis dan dapat menunjuk kepada pribadi, otoritas, serta pengakuan akan Yesus. Mempertahankan 'nama-Ku' menjaga keluasan makna itu.
- issue: Sifat tindakan 'meletakkan tangan'
  choice: Menerjemahkannya secara idiomatis sebagai 'menangkap kamu'.
  alternative: mereka akan meletakkan tangan mereka atas kamu
  rationale: Dalam konteks ini ungkapan tersebut jelas bermusuhan. Terjemahan harfiah dalam bahasa Indonesia berisiko dipahami sebagai penumpangan tangan dalam tindakan keagamaan, sehingga makna penangkapan dipakai dalam teks utama dan bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami. Bentuk jamak dipertahankan pada rumah ibadat, penjara, raja, dan gubernur. Kapitalisasi 'nama-Ku' mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
