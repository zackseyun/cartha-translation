  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: id
  text: Namun, jagalah diri kalian agar hati kalian tidak terbebani oleh pesta pora[a], kemabukan, dan kekhawatiran hidup, dan hari itu tidak tiba-tiba menimpa kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ini dapat menunjuk pada perilaku berlebihan dalam minum atau pada akibat buruk sesudahnya, seperti pening dan mual.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Namun, jagalah diri kalian
  rationale: Bentuk perintah ini menyerukan kewaspadaan terhadap diri sendiri. “Jagalah diri kalian” alami dalam bahasa Indonesia dan mempertahankan daya peringatannya; “namun” menandai hubungan kontras δέ dengan konteks sebelumnya.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: supaya hati kalian jangan dibebani
  rationale: Mempertahankan gambaran hati yang menjadi berat atau terbebani serta daya pencegahan μήποτε. “Hati” di sini menunjuk kehidupan batin dan kepekaan moral-rohani, bukan hanya perasaan.
- source_word: κραιπάλῃ
  choice: pesta pora
  rationale: Kata ini berkaitan dengan minum secara berlebihan dan dapat mencakup perilaku tak terkendali maupun akibat buruk sesudahnya. “Pesta pora” merupakan padanan Indonesia yang jelas, sedangkan keluasan maknanya diterangkan dalam catatan kaki.
- source_word: μέθῃ
  choice: kemabukan
  rationale: Padanan langsung bagi keadaan mabuk dan tetap membedakannya dari κραιπάλῃ.
- source_word: μερίμναις βιωτικαῖς
  choice: kekhawatiran hidup
  rationale: Mengungkapkan berbagai kecemasan yang berkaitan dengan kehidupan biasa tanpa menambahkan penilaian bahwa semua urusan duniawi pada dirinya salah.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: datang secara tiba-tiba menimpa kalian
  rationale: Mengungkapkan kedatangan mendadak yang mengenai seseorang. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan unsur “menimpa” dari konstruksi Yunani.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: hari itu
  rationale: Mempertahankan ungkapan sumber tanpa menambahkan keterangan “penghakiman” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan eskatologis “hari itu”
  choice: hari itu
  alternative: hari penghakiman itu
  rationale: Dalam konteks wejangan Yesus, frasa ini mengarah kepada hari yang menentukan pada masa depan, tetapi terjemahan mempertahankan rumusan teks dan tidak memperluasnya menjadi label doktrinal yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan sapaan jamak “kalian” untuk memperjelas bahwa perintah ditujukan kepada para pendengar secara kolektif. Diksi dijaga lugas dan bermartabat; metafora hati yang dibebani tetap dipertahankan.
