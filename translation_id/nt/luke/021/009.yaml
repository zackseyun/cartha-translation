  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: id
  text: Tetapi ketika kamu mendengar tentang peperangan dan kekacauan[a], janganlah gentar. Sebab hal-hal itu harus terjadi terlebih dahulu, tetapi kesudahan tidak segera tiba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pergolakan,” “kerusuhan,” atau “ketidaktertiban.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “tetapi tidak segera kesudahan”; kata kerja “tiba” tersirat dalam bahasa Yunani.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Namun, apabila
  rationale: ὅταν menyatakan waktu pada masa mendatang yang tidak ditentukan, sedangkan δέ menjadi penghubung ringan. “Namun, apabila” menandai perkembangan dan kontras secukupnya tanpa membuatnya terlalu tajam.
- source_word: ἀκούσητε
  choice: kamu mendengar tentang
  rationale: Bentuk ini berada dalam anak kalimat temporal. “Mendengar tentang” alami dalam bahasa Indonesia untuk kabar mengenai berbagai peristiwa.
- source_word: πολέμους
  choice: peperangan
  rationale: Padanan langsung untuk bentuk jamak πόλεμος, yang menunjuk kepada konflik-konflik bersenjata.
- source_word: ἀκαταστασίας
  choice: kekacauan
  rationale: ἀκαταστασία dapat berarti keadaan tidak tertib, kerusuhan, atau pergolakan. “Kekacauan” mempertahankan cakupan makna yang luas dan tidak mempersempitnya menjadi pemberontakan tertentu.
- source_word: μὴ πτοηθῆτε
  choice: janganlah gentar
  rationale: Ungkapan ini melarang rasa takut yang mengguncangkan atau kepanikan. “Janganlah gentar” kuat, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: δεῖ γὰρ
  choice: Sebab ... harus
  rationale: δεῖ menyatakan keharusan, sedangkan γάρ memberikan alasan atau penjelasan.
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: hal-hal itu harus terjadi terlebih dahulu
  rationale: γίνομαι di sini berarti peristiwa-peristiwa itu berlangsung atau terjadi, dan πρῶτον menunjukkan urutan sebelumnya.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: tetapi kesudahannya tidak segera tiba
  rationale: Klausa Yunani ini tidak memiliki verba tersurat. “Tidak segera tiba” menyatakan implikasi temporal secara alami, sambil mempertahankan bahwa kesudahan tidak langsung menyusul.
theological_decisions:
- issue: Waktu kesudahan dalam konteks eskatologis
  choice: Peperangan dan kekacauan harus terjadi lebih dahulu, tetapi kesudahan tidak segera tiba.
  alternative: Peristiwa-peristiwa itu mendahului kesudahan, tetapi bukan berarti kesudahan langsung datang sesudahnya.
  rationale: Terjemahan mempertahankan peringatan Yesus agar kabar tentang pergolakan tidak disamakan dengan tibanya kesudahan secara langsung, tanpa memasukkan sistem eskatologi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kamu” mengikuti sapaan jamak dalam konteks kepada para murid; bahasa Indonesia tidak menandai kejamakan ini secara morfologis. “Kesudahan” dipilih untuk τὸ τέλος karena sesuai dengan konteks eskatologis dan tetap alami dalam ragam Alkitab yang bermartabat.
