  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: id
  text: Lalu Ia berkata, “Sesungguhnya Aku berkata kepada kalian, janda miskin ini memasukkan lebih banyak daripada mereka semua.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “melemparkan lebih banyak daripada mereka semua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Sesungguhnya
  rationale: Menandai pernyataan yang sungguh-sungguh dan tegas; bentuk ini tetap wajar dalam tuturan Yesus serta mempertahankan bobot ungkapan Yunani.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Mempertahankan sapaan langsung dan daya pernyataan Yesus. Pronomina tunggal “-mu” dipakai secara kolektif sesuai bentuk jamak Yunani dan kebiasaan bahasa Indonesia.
- source_word: χήρα
  choice: janda
  rationale: Padanan baku dan tepat bagi seorang perempuan yang suaminya telah meninggal.
- source_word: πτωχή
  choice: miskin
  rationale: Menyatakan kemiskinan tanpa mempersempit maknanya menjadi tingkat kemelaratan tertentu yang tidak dinyatakan langsung oleh kata ini.
- source_word: αὕτη
  choice: ini
  rationale: Mempertahankan fungsi penunjuk kepada janda tertentu yang sedang diamati.
- source_word: πλεῖον
  choice: lebih banyak
  rationale: Mengungkapkan perbandingan kuantitatif secara langsung dan alami.
- source_word: πάντων
  choice: daripada mereka semua
  rationale: Menyatakan genitif perbandingan dan merujuk secara alami kepada para pemberi persembahan lain dalam konteks.
- source_word: ἔβαλεν
  choice: memasukkan
  rationale: Dalam konteks peti persembahan, kata ini menyatakan tindakan menaruh atau memasukkan persembahan. “Memasukkan” mempertahankan gambaran tindakannya tanpa kesan kasual dari “melemparkan”.
theological_decisions:
- issue: Perbandingan nilai persembahan janda
  choice: “memasukkan lebih banyak daripada mereka semua”
  alternative: “memasukkan lebih banyak daripada siapa pun di antara mereka”
  rationale: Ungkapan Yunani πλεῖον πάντων memungkinkan perbandingan yang kuat dengan para pemberi lain dan secara harfiah dapat terdengar kolektif. Terjemahan utama mempertahankan ketegangan itu tanpa lebih dahulu menjelaskan bahwa penilaiannya didasarkan pada proporsi atau pengorbanan; penjelasan tersebut baru muncul dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “janda miskin ini” mengikuti penekanan frasa Yunani, sedangkan “Lalu” mengalirkan καί secara alami. Penanda catatan kaki ditempatkan sesudah klausa yang menjelaskan pilihan bagi ἔβαλεν.
