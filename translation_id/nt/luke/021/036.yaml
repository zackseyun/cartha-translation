  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: id
  text: Namun, tetaplah berjaga-jaga setiap saat sambil berdoa agar kalian sanggup[a] luput dari semua hal ini yang akan terjadi[b] dan berdiri di hadapan Anak Manusia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “agar kalian dianggap layak untuk luput dari semua hal ini yang akan terjadi dan berdiri di hadapan Anak Manusia” sebagai ganti “agar kalian sanggup luput dari semua hal ini yang akan terjadi dan berdiri di hadapan Anak Manusia.”
    reason: textual_variant
  - marker: b
    text: Atau “semua hal ini yang akan berlangsung.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “berdiri di hadapan Anak Manusia” mungkin menyiratkan berdiri sebagai orang yang diterima atau dibenarkan di hadapan-Nya, tetapi bahasa Yunani membiarkan hal itu tersirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: tetaplah berjaga-jaga
  rationale: Bentuk imperatif ini menyerukan kewaspadaan yang terus-menerus. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang tetap terjaga.
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan pertentangan ringan dari peringatan sebelumnya; “Namun” sesuai dengan alur wacana.
- source_word: ἐν παντὶ καιρῷ
  choice: setiap saat
  rationale: Menyampaikan cakupan waktu yang menyeluruh secara alami dan ringkas.
- source_word: δεόμενοι
  choice: sambil berdoa
  rationale: Partisipel ini menunjukkan doa permohonan yang menyertai sikap berjaga-jaga.
- source_word: ἵνα κατισχύσητε
  choice: agar kalian sanggup
  rationale: κατισχύω berarti memiliki kekuatan yang cukup atau mampu bertahan/berhasil. “Sanggup” menyatakan kemampuan itu secara alami tanpa memasukkan gagasan kelayakan dari varian tekstual.
- source_word: ἐκφυγεῖν
  choice: luput dari
  rationale: Menyatakan berhasil lolos dari hal-hal yang akan terjadi; “luput dari” jelas dan idiomatis dalam konteks ini.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: semua hal yang akan segera terjadi ini
  rationale: μέλλω dengan infinitif dapat menyatakan masa depan yang dekat. Susunan ini mempertahankan rujukan pada “semua hal ini” sekaligus nuansa kesegeraan.
- source_word: σταθῆναι
  choice: berdiri
  rationale: Mempertahankan gambaran Yunani tanpa secara eksplisit menambahkan makna diterima, dibenarkan, atau berdiri teguh.
- source_word: ἔμπροσθεν
  choice: di hadapan
  rationale: Padanan relasional yang alami dan bermartabat untuk berada di depan atau dalam hadirat seseorang.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Padanan baku bagi gelar ini yang mempertahankan latar Semitik dan penggunaannya sebagai sebutan kristologis dalam Injil.
theological_decisions:
- issue: Makna κατισχύσητε dalam kaitannya dengan ketekunan pada akhir zaman
  choice: Diterjemahkan “agar kalian sanggup,” sesuai dengan teks SBLGNT yang berbicara tentang kekuatan atau kemampuan untuk berhasil.
  alternative: agar kalian dianggap layak
  rationale: Bacaan “dianggap layak” berasal dari varian tekstual dan dapat menggeser penekanan teologis dari kemampuan untuk bertahan kepada kelayakan. Karena bukan bacaan teks sumber yang dipakai, varian itu dicatat dalam catatan kaki.
- issue: Makna σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Dipertahankan sebagai “berdiri di hadapan Anak Manusia.”
  alternative: berdiri sebagai orang yang diterima di hadapan Anak Manusia; menghadap Anak Manusia
  rationale: Ungkapan ini mungkin menyiratkan penerimaan atau pembenaran pada penghakiman, tetapi bahasa Yunani tidak menyatakannya secara eksplisit. Terjemahan utama mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipakai untuk menandai bahwa perintah dan doa ini ditujukan kepada bentuk orang kedua jamak. Susunan kalimat mempertahankan satu tujuan doa yang mencakup baik luput dari peristiwa-peristiwa itu maupun berdiri di hadapan Anak Manusia.
