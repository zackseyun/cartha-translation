source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: id
  text: Namun, ketika semuanya itu mulai terjadi[a], tegakkanlah diri kalian[b] dan angkatlah kepala kalian, sebab penebusan kalian[c] kian mendekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sementara semuanya itu mulai berlangsung.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pandanglah ke atas.” Kata Yunaninya terutama dapat berarti menegakkan diri setelah membungkuk.
    reason: lexical_alternative
  - marker: c
    text: “Penebusan” juga dapat diterjemahkan “pembebasan”; dalam konteks ini, istilah tersebut dapat menunjuk pada pembebasan akhir yang sedang mendekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: ketika semuanya itu mulai terjadi
  rationale: Konstruksi genitif absolut menyatakan keadaan waktu. Ungkapan ini mempertahankan unsur ‘mulai’ dan ‘terjadi’ dalam bahasa Indonesia yang alami.
- source_word: δέ
  choice: Namun
  rationale: Kata ini menandai peralihan dengan kontras ringan dari kesesakan sebelumnya menuju dorongan yang penuh harapan.
- source_word: ἀνακύψατε
  choice: tegakkanlah tubuh kalian
  rationale: Kata kerja ini menggambarkan tindakan menegakkan diri dari posisi membungkuk dan secara kiasan menyiratkan keberanian yang dipulihkan.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: angkatlah kepala kalian
  rationale: Terjemahan ini mempertahankan gambaran idiomatis tentang keyakinan dan pengharapan serta memperjelas bahwa perintah ditujukan kepada orang banyak.
- source_word: διότι
  choice: sebab
  rationale: ‘Sebab’ menyampaikan hubungan alasan secara jelas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: ἐγγίζει
  choice: kian mendekat
  rationale: Pilihan ini menyampaikan gerak menuju kedekatan yang terkandung dalam bentuk kini, bukan hanya keadaan statis ‘sudah dekat’.
- source_word: ἀπολύτρωσις
  choice: penebusan
  rationale: ‘Penebusan’ mempertahankan bobot keselamatan dan pembebasan dalam istilah Yunani tanpa membatasinya menjadi sekadar pertolongan dari bahaya langsung.
theological_decisions:
- issue: Makna ‘penebusan kalian’ dalam khotbah eskatologis
  choice: Mempertahankan ‘penebusan kalian’ sebagai pembebasan dan pemulihan akhir yang sedang mendekat bagi para pengikut Yesus.
  alternative: Pembebasan hanya dari krisis sejarah yang langsung, atau penebusan yang sepenuhnya dirohanikan dan tidak bersifat eskatologis.
  rationale: Konteksnya berorientasi pada peristiwa mendatang dan penggenapan akhir. Istilah ‘penebusan’ mempertahankan kedalaman teologis dan ketegangan konteks tanpa menentukan secara berlebihan cara penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wibawa tetapi mudah dipahami. ‘Kalian’ digunakan untuk memperjelas bentuk jamak dalam sapaan Yesus; bentuk imperatif dengan -lah menjaga nada ajakan yang tegas dan bermartabat.
