id: LUK.21.21
reference: Luke 21:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: id
  text: Pada waktu itu, mereka yang berada di Yudea harus melarikan diri ke pegunungan; mereka yang berada di dalam kota itu[a] harus keluar; dan mereka yang berada di daerah pedesaan jangan masuk ke kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kota itu” merujuk kepada Yerusalem. Dalam bahasa Yunani, pronomina yang merujuk kepadanya berbentuk feminin.
    reason: Menjelaskan rujukan pronomina feminin Yunani, yang tidak dapat dipertahankan secara alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: τότε
  choice: Pada waktu itu
  rationale: Menandai urutan waktu dari tanda-tanda yang disebut sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: orang-orang yang berada di Yudea
  rationale: Mengungkapkan dengan jelas bahwa frasa tersebut menunjuk kepada orang-orang yang sedang berada di wilayah Yudea.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: harus melarikan diri ke pegunungan
  rationale: Imperatif orang ketiga membawa desakan yang kuat; 'harus' menyampaikan daya perintah secara wajar, sedangkan 'pegunungan' menerjemahkan bentuk jamak ὄρη.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: orang-orang yang berada di tengah kota itu
  rationale: Secara kontekstual αὐτῆς menunjuk kepada Yerusalem. Menyebut 'kota itu' lebih alami daripada mempertahankan pronomina feminin yang tidak tersedia dalam bahasa Indonesia, tanpa menambahkan nama Yerusalem ke teks utama.
- source_word: ἐκχωρείτωσαν
  choice: harus keluar
  rationale: Dalam konteks evakuasi, verba ini menyatakan meninggalkan atau menarik diri dari tempat tersebut; 'keluar' jelas dan langsung.
- source_word: οἱ ἐν ταῖς χώραις
  choice: orang-orang yang berada di daerah pedesaan
  rationale: χῶραι di sini menunjuk kepada kawasan luar atau pedesaan, bukan khusus kepada ladang yang sedang digarap.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: jangan masuk ke kota itu
  rationale: Menyampaikan larangan imperatif secara alami; αὐτήν kembali menunjuk kepada Yerusalem.
theological_decisions:
- issue: Rujukan pronomina αὐτῆς dan αὐτήν
  choice: Menerjemahkannya sebagai 'kota itu' dan menjelaskan rujukannya dalam catatan kaki.
  alternative: Memakai 'daerah itu' dengan anggapan bahwa pronomina merujuk kepada Yudea.
  rationale: Konteks terdekat, khususnya pengepungan Yerusalem pada ayat 20, mendukung Yerusalem sebagai rujukannya. Bentuk feminin Yunani juga selaras dengan personifikasi sebuah kota, tetapi bahasa Indonesia tidak memiliki pronomina feminin gramatikal yang sepadan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur tiga perintah paralel dipertahankan. 'Harus' dipakai untuk menyampaikan imperatif orang ketiga secara alami, sedangkan 'jangan' menyampaikan larangan langsung.
