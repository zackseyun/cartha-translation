  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: id
  text: Mereka akan tewas oleh mata pedang dan dibawa sebagai tawanan ke antara semua bangsa[a]. Yerusalem akan diinjak-injak oleh bangsa-bangsa[b] sampai masa-masa bangsa-bangsa itu digenapi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ke antara semua bangsa bukan Yahudi"; kata Yunani yang diterjemahkan "bangsa" juga dapat berarti "bangsa bukan Yahudi", bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau "Yerusalem akan diinjak-injak oleh bangsa-bangsa bukan Yahudi."
    reason: alternative_reading
  - marker: c
    text: Atau "sampai masa-masa bangsa-bangsa bukan Yahudi itu digenapi."
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: akan tewas
  rationale: Dalam konteks peperangan, πίπτω berarti gugur atau tewas. Pilihan ini menyampaikan idiom tersebut secara alami dalam bahasa Indonesia tanpa mengaburkan akibat yang dimaksud.
- source_word: στόματι μαχαίρης
  choice: oleh mata pedang
  rationale: Ungkapan harfiahnya adalah 'oleh mulut pedang'. 'Mata pedang' merupakan padanan idiomatis Indonesia yang mempertahankan gambaran konkret senjata tajam.
- source_word: αἰχμαλωτισθήσονται
  choice: dibawa sebagai tawanan
  rationale: Bentuk pasif ini menunjuk pada orang-orang yang ditawan lalu dibawa pergi; terjemahan ini mempertahankan unsur penawanan dan pemindahan.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: ke antara segala bangsa
  rationale: εἰς menyatakan gerak menuju atau masuk ke lingkungan bangsa-bangsa. 'Ke antara' terdengar alami untuk penyebaran tawanan di berbagai bangsa, sedangkan 'segala' mencerminkan πάντα.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: πατουμένη
  choice: akan diinjak-injak
  rationale: Konstruksi perifrastis ἔσται πατουμένη menyatakan keadaan yang berlangsung pada masa mendatang. 'Diinjak-injak' mempertahankan citra penaklukan dan penghinaan.
- source_word: ὑπὸ ἐθνῶν
  choice: oleh bangsa-bangsa
  rationale: Pilihan ini mempertahankan kohesi dengan pemakaian ἔθνη sebelumnya dan tidak membatasi maknanya secara prematur pada kategori non-Yahudi.
- source_word: ἄχρι οὗ
  choice: sampai
  rationale: Padanan temporal yang ringkas dan alami untuk batas waktu yang dinyatakan konstruksi Yunani ini.
- source_word: πληρωθῶσιν
  choice: digenapi
  rationale: Bentuk pasif dipertahankan. 'Digenapi' memungkinkan nuansa terpenuhinya masa yang telah ditetapkan tanpa menentukan skema eskatologis tertentu.
- source_word: καιροὶ ἐθνῶν
  choice: masa bangsa-bangsa
  rationale: 'καιροί menunjuk pada masa atau waktu bermakna/tertentu. Bentuk Indonesia ini mempertahankan ketidakjelasan hubungan genitif: masa yang dimiliki, diberikan kepada, atau berkaitan dengan bangsa-bangsa.'
theological_decisions:
- issue: Makna ἔθνη dalam seluruh ayat
  choice: bangsa-bangsa
  alternative: orang-orang bukan Yahudi
  rationale: Kata Yunani yang sama muncul tiga kali. Menerjemahkannya secara konsisten sebagai 'bangsa-bangsa' mempertahankan kohesi leksikal serta ambiguitas antara bangsa-bangsa secara umum dan bangsa-bangsa non-Yahudi. Alternatif kontekstual dicatat dalam catatan kaki.
- issue: Makna καιροὶ ἐθνῶν
  choice: masa bangsa-bangsa itu digenapi
  alternative: masa orang-orang bukan Yahudi itu berakhir
  rationale: Terjemahan utama mempertahankan bentuk pasif dan bobot gagasan pemenuhan tanpa memasukkan kerangka akhir zaman tertentu. 'Digenapi' juga tidak menyederhanakan πληρόω menjadi sekadar 'berakhir'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tewas oleh mata pedang' mempertahankan warna perang tanpa kekakuan harfiah 'jatuh oleh mulut pedang'. Pengulangan 'bangsa-bangsa' disengaja untuk mencerminkan pengulangan ἔθνη dan menjaga ambiguitas sumber.
