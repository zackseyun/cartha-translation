  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: id
  text: Sebab semua orang itu memberikan persembahan[a] dari kelimpahan mereka, tetapi perempuan ini, dari kekurangannya[b], memasukkan seluruh sarana hidup yang dimilikinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pemberian-pemberian”; dalam konteks ini, pemberian yang dipersembahkan di Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari kemiskinannya” atau “dari kebutuhannya”.
    reason: lexical_alternative
  - marker: c
    text: Atau “seluruh penghidupannya” atau “segala yang dimilikinya untuk hidup”; bukan “seluruh hidupnya” dalam arti seluruh keberadaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Sebab mereka semua
  rationale: γάρ mempertahankan hubungan penjelasan dengan ayat sebelumnya melalui “Sebab”; οὗτοι merujuk kepada para pemberi yang baru disebut dan secara alami diterjemahkan dengan pronomina “mereka”.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: dari kelimpahan mereka
  rationale: περισσεύοντος menunjuk pada apa yang berlebih atau berlimpah dan membentuk kontras langsung dengan kekurangan perempuan itu.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: memberi persembahan
  rationale: Dalam konteks pemberian di Bait Allah, ungkapan ini secara alami menyatakan tindakan menyumbangkan pemberian. “Persembahan” menyampaikan fungsi τὰ δῶρα dengan lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah “pemberian-pemberian”.
- source_word: αὕτη δὲ
  choice: tetapi perempuan ini
  rationale: Demonstratif feminin menunjuk kembali kepada janda dalam konteks; penyebutan “perempuan ini” mempertahankan unsur demonstratif dan kontras δέ.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: dari kekurangannya
  rationale: ὑστέρημα berarti keadaan kekurangan atau kebutuhan. Pilihan ini mempertahankan kontras leksikal dengan “kelimpahan” tanpa mempersempit makna hanya menjadi kategori sosial kemiskinan.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: seluruh nafkah yang dimilikinya
  rationale: βίος di sini menunjuk pada sumber penghidupan atau bekal hidup, bukan seluruh keberadaan biologisnya. “Nafkah” ringkas, konkret, dan sesuai dengan konteks uang.
- source_word: ἔβαλεν
  choice: memasukkan
  rationale: Kata ini mempertahankan gambaran fisik tindakan memasukkan uang ke tempat persembahan dan terdengar wajar dalam konteks.
theological_decisions:
- issue: Makna βίος dalam pemberian janda
  choice: seluruh nafkah yang dimilikinya
  alternative: seluruh hidupnya; seluruh biaya hidupnya; segala yang dimilikinya untuk hidup
  rationale: Konteksnya adalah pemberian uang, dan βίος menunjuk pada sarana penghidupan. Terjemahan “seluruh hidupnya” berisiko memberi kesan bahwa ia secara harfiah menyerahkan nyawanya.
- issue: Rujukan τὰ δῶρα
  choice: persembahan
  alternative: pemberian-pemberian; peti persembahan; perbendaharaan Bait Allah
  rationale: Konteks Bait Allah menunjukkan bahwa yang dimaksud ialah pemberian yang dipersembahkan. “Persembahan” alami dan tidak menambahkan benda atau lokasi khusus seperti peti maupun perbendaharaan yang tidak disebut dalam frasa ini.
- issue: Kekuatan ὑστέρημα
  choice: kekurangan
  alternative: kemiskinan; kebutuhan
  rationale: “Kekurangan” mempertahankan keluasan makna dan kesejajaran retoris dengan “kelimpahan”; catatan kaki menjaga alternatif kontekstual yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kontras kelimpahan–kekurangan dipertahankan. “Nafkah” dipilih untuk mengungkapkan sarana hidup secara ringkas, sedangkan catatan kaki menjelaskan cakupan maknanya.
