  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: id
  text: Kemudian ia berkata kepada mereka, “Bangsa akan bangkit melawan bangsa, dan kerajaan melawan kerajaan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan wacana dan menghubungkan perkataan ini dengan konteks sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἔλεγεν
  choice: ia berkata
  rationale: Bentuk imperfek dapat menyatakan tindakan yang sedang berlangsung atau berulang, tetapi dalam pengantar ujaran langsung, bentuk sederhana ini paling wajar tanpa memaksakan nuansa aspek.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Menyampaikan objek tak langsung datif secara langsung dan alami.
- source_word: Ἐγερθήσεται
  choice: akan bangkit
  rationale: Bentuk futur pasif/medial ini dalam rumusan konflik berarti bangkit atau bergerak untuk melawan; 'akan bangkit' alami dan tidak menyiratkan pelaku luar secara tidak perlu.
- source_word: ἔθνος ἐπ’ ἔθνος
  choice: bangsa melawan bangsa
  rationale: ἔθνος menunjuk pada bangsa atau kelompok masyarakat sebagai kesatuan kolektif, sedangkan ἐπί dengan akusatif dalam ungkapan ini menyatakan pertentangan.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: kerajaan melawan kerajaan
  rationale: βασιλεία di sini adalah kerajaan atau wilayah kekuasaan politis; pengulangan 'melawan' dipahami secara alami dari susunan paralelnya.
theological_decisions:
- issue: Rumusan konflik apokaliptik
  choice: Menerjemahkannya sebagai nubuat langsung tentang pergolakan antarbangsa dan antarkerajaan tanpa menambahkan sistem akhir zaman tertentu.
  alternative: Membatasinya hanya pada kejatuhan Yerusalem atau menjadikannya jadwal terperinci tentang akhir zaman.
  rationale: Ayat ini sendiri hanya menyatakan bahwa bangsa dan kerajaan akan saling bangkit melawan; perdebatan eskatologis yang lebih luas tidak diselesaikan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'ia' tidak diberi kapital khusus agar terjemahan tidak memasukkan konvensi penghormatan yang tidak ditandai dalam teks Yunani. Elipsis pada klausa kedua dipertahankan karena alami dan mencerminkan kesejajaran sumber.
