id: LUK.21.11
reference: Luke 21:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: id
  text: Akan terjadi gempa bumi dahsyat, dan di berbagai tempat akan terjadi kelaparan dan wabah penyakit. Akan ada pula berbagai hal yang mengerikan dan tanda-tanda besar dari langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari surga.” Kata Yunani οὐρανός dapat berarti langit ataupun surga; frasa ini juga dapat menggambarkan gejala yang terlihat di langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί ... μεγάλοι
  choice: gempa bumi dahsyat
  rationale: σεισμοί secara langsung berarti gempa bumi, sedangkan μεγάλοι dalam konteks ini menyatakan besarnya atau parahnya gempa. “Dahsyat” alami dalam bahasa Indonesia dan menyampaikan tingkat keparahannya.
- source_word: κατὰ τόπους
  choice: di berbagai tempat
  rationale: Ungkapan ini menyatakan bahwa peristiwa-peristiwa tersebut tersebar menurut lokasi; “di berbagai tempat” merupakan padanan Indonesia yang wajar dan tepat.
- source_word: λιμοὶ
  choice: kelaparan
  rationale: Kata ini menunjuk pada bencana kelaparan, bukan sekadar kekurangan makanan biasa.
- source_word: λοιμοὶ
  choice: wabah penyakit
  rationale: λοιμός menunjuk pada wabah atau penyakit menular yang merebak. “Wabah penyakit” jelas bagi pembaca modern dan mempertahankan bobot maknanya.
- source_word: φόβητρα
  choice: berbagai hal yang mengerikan
  rationale: Bentuk jamak yang langka ini menunjuk pada hal atau kejadian yang menimbulkan ketakutan. Padanan ini lebih alami daripada nomina abstrak “kengerian” dan tidak menentukan secara berlebihan jenis kejadiannya.
- source_word: σημεῖα ... μεγάλα
  choice: tanda-tanda besar
  rationale: “Tanda-tanda” mempertahankan cakupan luas σημεῖα, sedangkan “besar” menerjemahkan μεγάλα tanpa menambahkan penafsiran tentang mekanisme atau sifat khusus tanda itu.
- source_word: ἀπ’ οὐρανοῦ
  choice: dari langit
  rationale: Dalam bahasa Indonesia, “langit” paling alami untuk fenomena yang tampak di atas dan tetap dapat memiliki resonansi teologis. Kemungkinan arti “surga” dicatat tanpa dipaksakan ke dalam teks utama.
- source_word: ἔσονται / ἔσται
  choice: akan terjadi / akan ada
  rationale: Kedua bentuk futur εἰμί berfungsi secara eksistensial. Variasi Indonesia ini menghasilkan alur alami sekaligus mempertahankan pernyataan tentang peristiwa-peristiwa yang akan datang.
theological_decisions:
- issue: Makna οὐρανός dalam konteks apokaliptik
  choice: dari langit
  alternative: dari surga
  rationale: οὐρανός dapat menunjuk pada langit yang terlihat ataupun ranah surgawi. Teks utama memakai ungkapan Indonesia yang paling alami bagi tanda-tanda yang tampak, sedangkan catatan kaki mempertahankan kemungkinan makna surgawi tanpa menetapkan mekanisme tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “akan terjadi” diatur agar daftar panjang tetap mudah dibaca, sementara “akan ada pula” mencerminkan hubungan kumulatif τε ... καὶ. Bentuk jamak Yunani diterjemahkan secara alami tanpa menambahkan rincian yang tidak dinyatakan teks.
