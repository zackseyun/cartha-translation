revisions:
- from: Celakalah perempuan-perempuan yang sedang mengandung dan yang menyusui pada hari-hari itu! Sebab akan terjadi kesesakan besar di negeri ini[a] dan murka terhadap bangsa ini[b].
  to: Celakalah perempuan yang sedang mengandung dan yang menyusui pada hari-hari itu! Sebab akan ada kesengsaraan besar di negeri[a] dan murka terhadap bangsa ini[b].
  rationale: Revisi mengganti "kesesakan besar" dengan "kesengsaraan besar" agar ἀνάγκη μεγάλη dipahami sebagai penderitaan atau malapetaka yang berat, bukan kepadatan. Demonstratif yang tidak ada pada γῆ dihapus, sedangkan demonstratif pada λαῷ τούτῳ tetap dipertahankan dalam "bangsa ini". Reduplikasi yang kurang idiomatis juga disederhanakan tanpa mengubah jumlah atau makna referen.
