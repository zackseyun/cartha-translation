id: LUK.21.23
reference: Luke 21:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: id
  text: Celakalah perempuan yang sedang mengandung dan yang menyusui pada hari-hari itu! Sebab akan ada kesengsaraan besar di negeri[a] dan murka terhadap bangsa ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bumi.” Kata Yunani γῆ dapat berarti “negeri/tanah” atau “bumi”; “negeri” dipilih karena konteks sekitarnya berpusat pada Yerusalem dan Yudea.
    reason: lexical_alternative
  - marker: b
    text: Atau “murka atas bangsa ini” atau “murka bagi bangsa ini.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Celakalah
  rationale: Mempertahankan seruan profetis yang mengandung ratapan sekaligus ancaman hukuman; lebih kuat dan sesuai konteks daripada sekadar 'Aduh'.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: perempuan-perempuan yang sedang mengandung
  rationale: Ungkapan Indonesia modern dan jelas untuk bentuk harfiah 'mereka yang mempunyai dalam rahim'; penyebutan perempuan wajar karena referennya memang perempuan hamil.
- source_word: ταῖς θηλαζούσαις
  choice: yang menyusui
  rationale: Dalam bahasa Indonesia, objek bayi dapat dipahami secara alami dari verba 'menyusui', sehingga tidak perlu ditambahkan ke dalam teks utama.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: pada hari-hari itu
  rationale: Padanan temporal yang alami serta dekat dengan susunan Yunani.
- source_word: ἀνάγκη μεγάλη
  choice: kesesakan besar
  rationale: Dalam konteks bencana dan pengepungan, frasa ini menunjuk pada tekanan, penderitaan, atau keadaan darurat yang berat, bukan sekadar keharusan.
- source_word: ἐπὶ τῆς γῆς
  choice: di negeri ini
  rationale: γῆ dapat berarti 'negeri/tanah' atau 'bumi'. Konteks terdekat berpusat pada Yerusalem dan Yudea, sehingga 'negeri ini' menyampaikan cakupan lokal yang paling mungkin; catatan kaki mempertahankan kemungkinan 'bumi'.
- source_word: ὀργὴ
  choice: murka
  rationale: Mempertahankan bobot kemarahan penghukuman tanpa menggantinya dengan istilah interpretatif 'penghakiman' atau menambahkan pelaku yang tidak disebutkan.
- source_word: τῷ λαῷ τούτῳ
  choice: terhadap bangsa ini
  rationale: Dativus menunjukkan pihak yang terkena murka. 'Bangsa ini' alami dalam konteks kolektif dan mempertahankan unsur penunjuk τούτῳ.
theological_decisions:
- issue: Cakupan γῆ dan referen 'bangsa ini'
  choice: Teks utama memakai 'negeri ini' dan 'bangsa ini', yang paling langsung menunjuk kepada negeri serta masyarakat Israel/Yudea dalam konteks kehancuran Yerusalem.
  alternative: γῆ dapat dipahami secara universal sebagai 'bumi', dengan cakupan seluruh umat manusia.
  rationale: Konteks langsung Lukas 21 membahas Yerusalem yang dikepung, kehancurannya, dan nasib penduduknya. Catatan kaki menjaga ambiguitas leksikal tanpa meniadakan kemungkinan cakupan yang lebih luas.
- issue: Sumber atau sifat ὀργή
  choice: Diterjemahkan 'murka' tanpa menambahkan 'Allah'.
  alternative: Dapat ditafsirkan sebagai 'murka Allah' atau diterjemahkan lebih interpretatif sebagai 'penghakiman'.
  rationale: Walaupun konteks sangat mungkin menyiratkan murka ilahi, teks Yunani tidak menyebutkan pemilik atau pelakunya. Terjemahan menjaga ketegangan teologis itu.
- issue: Relasi dativus τῷ λαῷ τούτῳ dengan ὀργή
  choice: Diterjemahkan 'murka terhadap bangsa ini'.
  alternative: '''Murka atas bangsa ini'' atau secara lebih harfiah namun ambigu ''murka bagi bangsa ini''.'
  rationale: '''Terhadap'' secara alami menyatakan bangsa itu sebagai pihak yang menjadi sasaran atau mengalami murka, tanpa menentukan lebih jauh mekanismenya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Celakalah' mempertahankan nada profetis; 'kesesakan besar' menghindari bahasa teknis; tidak ditambahkan 'Allah' sebagai sumber murka karena tidak dinyatakan secara eksplisit dalam teks Yunani.
