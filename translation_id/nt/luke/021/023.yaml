review_pass:
  verdict: revise
  source_fidelity: Teks Yunani menyatakan ἀνάγκη μεγάλη, yaitu keadaan penderitaan/tekanan yang berat. "Kesesakan besar" dalam pemakaian Indonesia modern lebih lazim berarti kepadatan atau keadaan sesak, sehingga kurang tepat untuk makna ini. Selain itu, γῆ hanya memakai artikel tentu, bukan demonstratif; "negeri ini" menambahkan daya tunjuk "ini" yang tidak terdapat dalam frasa tersebut.
  naturalness: '"Perempuan-perempuan" terdengar tidak alami dalam ragam Indonesia modern untuk kelas orang yang disebut secara umum. Bentuk tunggal generik "perempuan" dalam koordinasi ini tetap jelas mencakup bentuk jamak Yunani. "Kesengsaraan besar" lebih idiomatis dan sesuai konteks bencana.'
  terminology: '"Celakalah", "mengandung", "menyusui", dan "murka" merupakan padanan baku yang baik. "Bangsa ini" dapat dipertahankan untuk λαῷ τούτῳ, tanpa menyempitkan referennya lebih jauh atau menambahkan "Allah" pada murka.'
  issues:
  - severity: medium
    issue: '"kesesakan besar" kurang mencerminkan ἀνάγκη μεγάλη.'
    rationale: Dalam bahasa Indonesia modern, "kesesakan" terutama menunjuk keadaan penuh/sesak. Dalam konteks ini ἀνάγκη menunjuk malapetaka atau penderitaan yang mendesak; "kesengsaraan besar" menyampaikan makna itu dengan lebih jelas.
  - severity: low
    issue: '"negeri ini" menambahkan demonstratif pada γῆ.'
    rationale: Teks hanya berbunyi ἐπὶ τῆς γῆς; unsur "ini" secara eksplisit hadir pada λαῷ τούτῳ, bukan pada γῆ. "Di negeri" mempertahankan pilihan cakupan lokal tanpa menambah penunjuk.
  - severity: low
    issue: Reduplikasi "perempuan-perempuan" kurang alami.
    rationale: Dalam pernyataan generik seperti ini, "perempuan yang sedang mengandung" secara idiomatis sudah mencakup pluralitas yang ditandai partisip Yunani.
  revised_text: Celakalah perempuan yang sedang mengandung dan yang menyusui pada hari-hari itu! Sebab akan ada kesengsaraan besar di negeri[a] dan murka terhadap bangsa ini[b].
  revised_footnotes:
