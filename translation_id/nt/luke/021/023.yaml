    text: Atau “di bumi.” Kata Yunani γῆ dapat berarti “negeri/tanah” atau “bumi”; “negeri” dipilih karena konteks sekitarnya berpusat pada Yerusalem dan Yudea.
    reason: lexical_alternative
  - marker: b
    text: Atau “murka atas bangsa ini” atau “murka bagi bangsa ini.”
    reason: alternative_reading
