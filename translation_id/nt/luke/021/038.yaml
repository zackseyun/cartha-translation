- from: Dan setiap pagi, seluruh rakyat datang lebih awal kepada-Nya di pelataran Bait Allah untuk mendengarkan Dia.[a]
  to: Setiap pagi, semua orang datang pagi-pagi sekali kepada-Nya di Bait Allah untuk mendengarkan Dia.[a]
  rationale: Revisi mengganti istilah yang bernuansa politis dan ungkapan waktu yang komparatif dengan padanan Indonesia yang lebih tepat bagi makna kolektif πᾶς ὁ λαός dan kebiasaan datang pada dini hari dalam ὤρθριζεν. Catatan mengenai ἱερόν dipertahankan dan penanda catatan tetap ditempatkan pada akhir ayat.
