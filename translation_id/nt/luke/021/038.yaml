review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “seluruh rakyat” memberi nuansa politis/nasional yang tidak diperlukan oleh πᾶς ὁ λαός, dan “datang lebih awal” terdengar komparatif tanpa titik pembanding. “Semua orang” serta “pagi-pagi sekali” menyampaikan cakupan kolektif dan tindakan kebiasaan pada waktu dini hari, sesuai imperfek ὤρθριζεν.
  naturalness: Teks revisi memakai Bahasa Indonesia baku modern yang lebih idiomatis. Susunan “datang pagi-pagi sekali kepada-Nya” dengan jelas menerangkan waktu kedatangan tanpa mengubah fokus tujuan, yaitu mendengarkan Yesus.
  terminology: “Bait Allah” tepat untuk ἱερόν dalam konteks Yerusalem. Terjemahan utama mempertahankannya secara umum, sementara catatan menjelaskan bahwa istilah Yunani itu menunjuk kompleks atau pelataran, bukan ruang suci bagian dalam. “Mendengarkan Dia” tepat untuk ἀκούειν αὐτοῦ.
  issues:
  - severity: medium
    issue: “Seluruh rakyat” untuk πᾶς ὁ λαός
    rationale: Dalam bahasa Indonesia modern, “rakyat” lazim bernuansa penduduk suatu negara dalam relasi dengan pemerintah. Frasa Yunani di sini merujuk luas kepada orang-orang yang datang mendengarkan Yesus; “semua orang” lebih netral dan alami.
  - severity: low
    issue: “Datang lebih awal” untuk ὤρθριζεν
    rationale: “Lebih awal” biasanya menuntut pembanding tersurat atau tersirat. “Datang pagi-pagi sekali” langsung menyatakan nuansa dini hari dari verba Yunani dan, dengan “setiap pagi,” mempertahankan nilai kebiasaan imperfek.
  revised_text: Setiap pagi, semua orang datang pagi-pagi sekali kepada-Nya di Bait Allah untuk mendengarkan Dia.[a]
