  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: id
  text: Setiap pagi, semua orang datang pagi-pagi sekali kepada-Nya di Bait Allah untuk mendengarkan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἱερόν merujuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang suci bagian dalam.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: seluruh rakyat
  rationale: Menyampaikan cakupan kolektif frasa Yunani secara alami tanpa harus menyiratkan setiap orang tanpa pengecualian.
- source_word: ὤρθριζεν
  choice: setiap pagi ... datang lebih awal
  rationale: Bentuk imperfek menunjukkan kebiasaan yang berulang, sedangkan verba ὀρθρίζω menyatakan tindakan yang dilakukan pagi-pagi sekali.
- source_word: πρὸς αὐτόν
  choice: kepada-Nya
  rationale: Menunjukkan gerak mendatangi Yesus dan mempertahankan rujukan pronominal teks sumber.
- source_word: ἐν τῷ ἱερῷ
  choice: di pelataran Bait Allah
  rationale: ἱερόν merujuk pada kompleks atau pelataran Bait Allah, bukan secara khusus ruang suci bagian dalam; pilihan ini memperjelas lokasi secara wajar dalam bahasa Indonesia.
- source_word: ἀκούειν αὐτοῦ
  choice: untuk mendengarkan Dia
  rationale: Infinitif menyatakan tujuan kedatangan orang banyak; 'mendengarkan' secara alami menyampaikan perhatian kepada pengajaran Yesus.
