source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: id
  text: Lalu mereka bertanya kepada-Nya, “Guru, kalau begitu, kapan semua itu akan terjadi, dan apa tandanya ketika semua itu hendak terjadi?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika semua itu akan terjadi.” Kata kerja Yunani yang diterjemahkan “hendak” juga dapat dipahami secara lebih umum tanpa menekankan bahwa peristiwa itu sedang menjelang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: mereka bertanya
  rationale: Bentuk aoristus indikatif menceritakan tindakan lampau yang sederhana; “bertanya” merupakan padanan Indonesia yang alami dalam konteks pertanyaan langsung.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menjadi penghubung ringan yang melanjutkan alur cerita tanpa menyiratkan pertentangan kuat.
- source_word: λέγοντες
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, isi ujaran dapat langsung mengikuti verba “bertanya”; menerjemahkannya sebagai “dengan berkata” akan terasa kaku dan berlebihan.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini menunjuk kepada pengajar; “Guru” mempertahankan arti dasarnya tanpa memasukkan nuansa kekuasaan yang lebih kuat.
- source_word: πότε οὖν
  choice: kalau begitu, kapan
  rationale: “Kapan” menyatakan pertanyaan mengenai waktu, sedangkan “kalau begitu” mempertahankan daya inferensial οὖν berdasarkan perkataan sebelumnya.
- source_word: ταῦτα ἔσται
  choice: hal-hal itu akan terjadi
  rationale: Walaupun secara harfiah memakai verba “ada/menjadi”, frasa Yunani ini secara idiomatis merujuk pada terjadinya peristiwa; padanan ini alami dan jelas dalam bahasa Indonesia.
- source_word: σημεῖον
  choice: tandanya
  rationale: “Tanda” adalah padanan baku untuk sesuatu yang menunjukkan bahwa suatu peristiwa penting akan berlangsung; bentuk definit “-nya” sesuai dengan konstruksi Yunani.
- source_word: ὅταν
  choice: ketika
  rationale: Bersama bentuk subjunktif, kata ini memperkenalkan klausa waktu yang berorientasi ke masa depan; “ketika” adalah padanan yang alami.
- source_word: μέλλῃ
  choice: akan segera
  rationale: Pilihan ini menyampaikan nuansa peristiwa yang menjelang atau hampir berlangsung, tanpa menetapkan skema kronologis tertentu.
- source_word: γίνεσθαι
  choice: terjadi
  rationale: Dalam konteks ini verba tersebut menunjuk pada berlangsungnya berbagai peristiwa; “terjadi” merupakan ungkapan Indonesia modern yang jelas.
theological_decisions:
- issue: Ungkapan eskatologis dan nuansa waktu
  choice: Mempertahankan permintaan akan “tanda” serta menerjemahkan μέλλῃ dengan nuansa kedekatan sebagai “akan segera terjadi”.
  alternative: “akan terjadi” atau “akan berlangsung” tanpa nuansa kedekatan waktu.
  rationale: Teks menanyakan waktu dan tanda dari peristiwa mendatang. Nuansa menjelang pada μέλλῃ patut dipertahankan, tetapi tidak boleh dipakai untuk memaksakan penafsiran eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “kalau begitu, kapan” mempertahankan hubungan logis dengan konteks sebelumnya sekaligus terdengar alami. Pengulangan “terjadi” dipertahankan karena jelas dan mencerminkan dua ungkapan berbeda dalam teks Yunani.
