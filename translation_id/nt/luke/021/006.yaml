lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Mengenai semua yang sedang kalian pandang ini
  rationale: Ταῦτα ditempatkan di depan sebagai topik yang ditekankan. θεωρεῖτε menyatakan tindakan melihat atau mengamati yang sedang berlangsung; ‘sedang kalian pandang’ mempertahankan fokus visual dan aspek duratifnya.
- source_word: ἐλεύσονται ἡμέραι ἐν αἷς
  choice: akan datang waktunya ketika
  rationale: Ungkapan Yunani harfiahnya ‘akan datang hari-hari ketika’. Dalam bahasa Indonesia, bentuk tunggal kolektif ‘akan datang waktunya ketika’ lebih alami dan tetap menyampaikan masa mendatang tanpa menentukan tanggal atau kerangka eskatologis tertentu.
- source_word: οὐκ ἀφεθήσεται λίθος ἐπὶ λίθῳ
  choice: tidak satu batu pun akan dibiarkan tetap tersusun di atas batu yang lain
  rationale: Bentuk pasif ἀφεθήσεται dipertahankan dengan ‘akan dibiarkan’, sedangkan λίθος ἐπὶ λίθῳ diterjemahkan sebagai gambaran bangunan yang masih tersusun. ‘Tidak ... pun’ menyampaikan penyangkalan menyeluruh.
- source_word: ὃς οὐ καταλυθήσεται
  choice: semuanya akan dirobohkan
  rationale: καταλύω dalam konteks bangunan berarti membongkar atau merobohkan. Klausa relatif Yunani menegaskan kehancuran total; ‘semuanya akan dirobohkan’ menyampaikan daya idiomatis itu secara jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan dan daya nubuat Yesus mengenai bangunan Bait Allah
  choice: Ucapan ini diterjemahkan sebagai nubuat konkret tentang kehancuran menyeluruh bangunan yang sedang dipandang.
  alternative: Memaknainya terutama sebagai penghakiman simbolis atau mengikatnya pada suatu sistem eskatologis tertentu.
  rationale: Bahasa Yunani menggambarkan batu-batu bangunan yang dibongkar secara nyata. Terjemahan mempertahankan daya konkret itu tanpa menambahkan penafsiran doktrinal atau kerangka waktu yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. ‘Kalian’ dipakai untuk menandai orang kedua jamak; ‘sedang ... pandang’ mempertahankan nuansa pengamatan yang sedang berlangsung. Susunan klausa dibuat alami tanpa menghilangkan penekanan pada kehancuran total.
