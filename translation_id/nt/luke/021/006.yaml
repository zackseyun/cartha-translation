  naturalness: “Sedang kalian pandang” dapat dipahami, tetapi “kalian lihat” lebih alami dalam bahasa Indonesia baku modern. “Akan datang hari-hari ketika” juga merupakan bentuk yang alami dan lebih dekat dengan idiom Yunani. Klausa penutup sebaiknya tetap jelas bahwa tidak ada batu yang dibiarkan tanpa dirobohkan.
  terminology: “Batu,” “dibiarkan,” dan “dirobohkan” sesuai untuk gambaran bangunan dalam teks sumber. “Kalian” mempertahankan orang kedua jamak dan register baku yang lugas.
