lexical_decisions:
- source_word: εἶδεν
  choice: Ia melihat
  rationale: Bentuk aoristus dari ὁράω menyatakan tindakan melihat secara langsung. 'Melihat' alami dalam narasi dan tidak menambahkan nuansa pengamatan yang lebih disengaja.
- source_word: δέ
  choice: juga
  rationale: δέ adalah penghubung ringan. Dalam konteks peralihan dari orang-orang kaya pada ayat sebelumnya kepada janda ini, 'juga' menjaga kesinambungan tanpa menciptakan pertentangan yang terlalu kuat.
- source_word: τινα
  choice: seorang
  rationale: Kata tak tentu τις memperkenalkan orang yang tidak disebut namanya; dalam bahasa Indonesia, hal ini secara alami dinyatakan dengan 'seorang'.
- source_word: χήραν
  choice: janda
  rationale: χήρα secara langsung berarti perempuan yang suaminya telah meninggal dan mempertahankan unsur kerentanan sosial yang penting dalam konteks.
- source_word: πενιχράν
  choice: miskin
  rationale: πενιχρός menunjuk pada kemiskinan atau keterbatasan harta. 'Miskin' merupakan padanan Indonesia yang alami tanpa melebihkan maknanya menjadi sama sekali melarat.
- source_word: βάλλουσαν
  choice: memasukkan
  rationale: Dalam konteks menyetorkan uang ke peti persembahan, 'memasukkan' lebih idiomatis daripada terjemahan harfiah seperti 'melemparkan'.
- source_word: ἐκεῖ
  choice: di situ
  rationale: ἐκεῖ adalah keterangan tempat yang berarti 'di sana/di situ'. 'Di situ' merujuk secara alami pada tempat persembahan yang telah disebut dalam konteks sebelumnya.
- source_word: λεπτὰ δύο
  choice: dua keping uang logam kecil
  rationale: λεπτά adalah bentuk jamak dari λεπτόν, uang logam tembaga bernilai sangat kecil. Terjemahan ini menyampaikan jumlah dan bentuk uang secara mudah dipahami, sementara nama satuan aslinya dijelaskan dalam catatan kaki.
