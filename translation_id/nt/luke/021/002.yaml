translation:
  language: id
  text: Ia juga melihat seorang janda miskin memasukkan dua keping uang logam kecil di situ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “dua lepton,” yaitu dua keping uang logam tembaga yang nilainya sangat kecil.'
