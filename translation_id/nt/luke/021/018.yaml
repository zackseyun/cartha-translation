revisions:
- from: Bahkan sehelai rambut pun dari kepalamu tidak akan binasa.[a]
  to: Dan tidak sehelai rambut pun dari kepala kalian akan binasa.[a]
  rationale: Mengganti “Bahkan” dengan “Dan” untuk mencerminkan καί secara netral, mengganti bentuk tunggal “kepalamu” dengan bentuk jamak “kepala kalian” untuk mencerminkan ὑμῶν, dan memperjelas catatan kaki tentang daya tegas οὐ μή tanpa mengklaim parafrasa idiomatis sebagai bentuk yang lebih harfiah. Makna dan ambiguitas kontekstual tentang sifat perlindungan tetap dipertahankan.
