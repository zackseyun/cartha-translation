review_pass:
  verdict: revise
  source_fidelity: Teks Yunani diawali καί, yang paling netral diterjemahkan “Dan,” bukan “Bahkan.” Penyangkalan tegas οὐ μή dengan ἀπόληται tersampaikan dengan baik melalui “tidak ... akan binasa,” dan ungkapan “sehelai rambut pun” adalah idiom Indonesia yang wajar untuk cakupan menyeluruh. Namun, ὑμῶν adalah orang kedua jamak; “kepalamu” dapat dibaca sebagai sapaan tunggal dan tidak mempertahankan jumlah sumber secara memadai.
  naturalness: “Tidak sehelai rambut pun dari kepala kalian akan binasa” adalah bahasa Indonesia modern yang alami dan tetap bernada khidmat. Susunan ini juga menghindari penegasan tambahan “Bahkan,” yang tidak diperlukan.
  terminology: '“Binasa” merupakan padanan yang baik untuk ἀπόληται: cukup khidmat, tidak membatasi janji ini pada luka fisik, dan mempertahankan ketegangan dengan konteks penganiayaan serta kematian. Catatan kaki perlu disesuaikan dengan bentuk jamak dan tidak menyebut parafrasa Indonesia sebagai “lebih harfiah” bila unsur “pun” telah ditambahkan secara idiomatis.'
  issues:
  - severity: medium
    issue: “kepalamu” memakai bentuk orang kedua tunggal, sedangkan ὑμῶν adalah orang kedua jamak.
    rationale: Walaupun bentuk tunggal distributif kadang dimungkinkan, dalam bahasa Indonesia modern bentuk ini mudah dipahami sebagai sapaan kepada satu orang. “Kepala kalian” secara jelas mempertahankan jumlah dalam teks Yunani.
  - severity: low
    issue: “Bahkan” memberi daya fokus/eskalasi yang tidak dinyatakan secara eksplisit oleh καί.
    rationale: Penegasan sudah tersedia dalam konstruksi “tidak sehelai rambut pun” dan οὐ μή. “Dan” mempertahankan fungsi penghubung sumber tanpa tambahan nuansa.
  - severity: low
    issue: Catatan kaki menyebut bentuk Indonesia yang memakai “pun” sebagai “secara lebih harfiah.”
    rationale: “Pun” adalah sarana idiomatis Indonesia untuk menyampaikan cakupan penyangkalan, bukan unsur leksikal eksplisit dalam teks Yunani. Catatan sebaiknya menjelaskan fungsi οὐ μή secara langsung.
