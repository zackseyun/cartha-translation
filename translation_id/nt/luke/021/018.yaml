  text: And not a hair from your head will perish[a].
translation:
  language: id
  text: Dan tidak sehelai rambut pun dari kepala kalian akan binasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai penyangkalan ganda yang tegas, yang menyatakan jaminan yang sangat kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Bahkan
  rationale: 'Dalam konteks janji ini, καί secara alami dapat menandai penegasan: bahkan sesuatu sekecil sehelai rambut. Pilihan ini menyampaikan alur dan daya ungkap kalimat tanpa menambahkan pertentangan.'
- source_word: θρὶξ
  choice: sehelai rambut pun
  rationale: Nomina tunggal dipadankan dengan penggolong alami bahasa Indonesia, sedangkan 'pun' mendukung ungkapan menyeluruh dan selaras dengan penyangkalan tegas.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: dari kepalamu
  rationale: Frasa partitif ini berarti rambut yang berasal dari kepala para pendengar. Bentuk tunggal distributif 'kepalamu' terdengar alami ketika menyapa banyak orang secara kolektif.
- source_word: οὐ μὴ
  choice: tidak akan
  rationale: Gabungan οὐ μή dengan aoristus subjungtif merupakan penyangkalan yang sangat tegas. Dalam bahasa Indonesia, kepastian itu disampaikan secara alami melalui 'pun' bersama 'tidak akan', sementara nuansa penegasannya dijelaskan dalam catatan kaki.
- source_word: ἀπόληται
  choice: binasa
  rationale: '''Binasa'' mempertahankan bobot khidmat ἀπόλλυμι dan tidak membatasi maknanya hanya pada cedera jasmani atau kehilangan secara harfiah.'
theological_decisions:
- issue: Ketegangan dengan nubuat terdekat bahwa sebagian murid akan dibunuh dan dianiaya
  choice: Mempertahankan pernyataan sebagai jaminan tegas tanpa menjelaskan dalam teks utama apakah perlindungan itu bersifat jasmani atau hakiki.
  alternative: Menafsirkannya secara eksplisit sebagai janji bahwa tidak akan ada cedera jasmani sama sekali, atau secara eksplisit sebagai keselamatan kekal.
  rationale: Konteks langsung menyebut penganiayaan dan kematian sebagian murid. Terjemahan harus mempertahankan ketegangan dan sifat peribahasa pernyataan Yesus, bukan menyelesaikannya dengan tambahan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Sehelai rambut pun' merupakan ungkapan alami bagi perlindungan yang menyeluruh; 'binasa' menjaga bobot verba Yunani dan ambiguitas kontekstualnya.
