  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: id
  text: ketika pohon-pohon itu sudah bertunas[a], dengan melihatnya, kalian tahu sendiri bahwa musim panas sudah dekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ketika pohon-pohon itu sudah mengeluarkan [pertumbuhan baru].” Teks Yunani tidak secara eksplisit menyebut daun, tetapi konteks pepohonan menunjukkan pertumbuhan baru.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Memperkenalkan anak kalimat waktu yang bersifat kontingen; “ketika” alami dalam perumpamaan ini tanpa menekankan kejadian berulang.
- source_word: προβάλωσιν
  choice: mulai bertunas
  rationale: Dalam konteks pohon ara dan semua pohon pada ayat 29, kata ini menyatakan munculnya pertumbuhan baru. “Bertunas” alami dalam bahasa Indonesia dan tidak mengharuskan penambahan kata “daun” yang tidak eksplisit dalam teks Yunani.
- source_word: ἤδη
  choice: mulai / sudah
  rationale: Kemunculan pertama menyertai tindakan bertunas dan secara alami diungkapkan dengan “mulai”; kemunculan kedua diterjemahkan “sudah,” sehingga nuansa bahwa tanda musim telah tampak tetap terpelihara.
- source_word: βλέποντες ἀφ’ ἑαυτῶν
  choice: dengan melihatnya sendiri
  rationale: Mengungkapkan sarana pengenalan sekaligus gagasan bahwa para pendengar menyimpulkan berdasarkan pengamatan mereka sendiri.
- source_word: γινώσκετε
  choice: kalian tahu
  rationale: Menyatakan pengenalan biasa berdasarkan pengamatan. “Kalian” memperjelas bentuk orang kedua jamak dan sesuai dengan bahasa Indonesia modern yang tetap wajar.
- source_word: ἐγγὺς
  choice: dekat
  rationale: Mempertahankan makna dasar kedekatan waktu secara lugas.
- source_word: θέρος
  choice: musim panas
  rationale: Padanan langsung dan alami bagi musim yang dimaksud.
