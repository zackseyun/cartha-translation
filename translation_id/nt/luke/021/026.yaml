source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: id
  text: Orang-orang akan pingsan karena ketakutan dan penantian akan hal-hal yang akan menimpa dunia yang dihuni manusia[a], sebab kuasa-kuasa langit[b] akan diguncangkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dunia” atau “bumi”; secara harfiah, “dunia berpenghuni.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kuasa-kuasa surgawi” atau “kuasa-kuasa di langit.” Ungkapan ini dapat menunjuk secara luas kepada kuasa kosmis atau surgawi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: akan pingsan
  rationale: Partisipel kini ini menggambarkan orang yang kehilangan kekuatan atau jatuh pingsan akibat rasa takut. Bentuk futur diperlukan secara wajar dalam bahasa Indonesia karena kalimat ini menggambarkan peristiwa yang akan datang.
- source_word: ἀνθρώπων
  choice: orang-orang
  rationale: Kata ini mengacu secara umum kepada manusia, bukan hanya laki-laki.
- source_word: ἀπὸ φόβου
  choice: karena ketakutan
  rationale: ἀπό dengan genitif menyatakan sebab atau sumber; frasa ini menyampaikan hubungan sebab secara alami dalam bahasa Indonesia.
- source_word: προσδοκίας
  choice: karena menantikan
  rationale: Kata benda Yunani ini menyatakan penantian atau pengharapan terhadap sesuatu yang akan terjadi. Ungkapan verbal lebih alami dalam bahasa Indonesia, sementara konteks ketakutan mempertahankan nuansa buruk tanpa menambahkan arti 'firasat buruk' secara eksplisit.
- source_word: τῶν ἐπερχομένων
  choice: hal-hal yang akan menimpa
  rationale: Partisipel substantival netral jamak menunjuk kepada berbagai kejadian yang mendatang. 'Hal-hal' mempertahankan unsur jamak, sedangkan 'menimpa' sesuai dengan gambaran kejadian yang datang atas dunia.
- source_word: τῇ οἰκουμένῃ
  choice: dunia yang berpenghuni
  rationale: οἰκουμένη menunjuk kepada dunia tempat manusia hidup atau masyarakat manusia, bukan semata-mata planet secara fisik. Terjemahan ini mempertahankan nuansa tersebut.
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: kuasa-kuasa langit
  rationale: Ungkapan ini tetap cukup luas untuk dapat menunjuk kepada kuasa kosmis, benda-benda langit, atau kuasa surgawi tanpa menetapkan satu tafsiran saja.
- source_word: σαλευθήσονται
  choice: akan diguncangkan
  rationale: Bentuk pasif futur ini menggambarkan gangguan kosmis yang kuat dan mempertahankan daya gambaran apokaliptiknya.
theological_decisions:
- issue: Makna 'kuasa-kuasa langit' dalam konteks apokaliptik
  choice: Mempertahankan ungkapan kosmis yang ambigu, 'kuasa-kuasa langit'.
  alternative: benda-benda langit; kuasa-kuasa surgawi
  rationale: Bahasa Yunani dapat membangkitkan gambaran tatanan kosmis, benda-benda langit, atau kuasa surgawi. Terjemahan tidak mempersempitnya menjadi makhluk malaikat atau benda astronomis saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan sebab-akibat dibuat alami, unsur jamak pada kejadian dan kuasa dipertahankan, dan ambiguitas gambaran apokaliptik tidak diselesaikan secara tafsiran.
