base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: id
  text: Sesungguhnya Aku berkata kepadamu, generasi ini[a] pasti tidak akan berlalu sampai segala sesuatu[b] terjadi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa ini” atau “zaman ini”; kata Yunani yang dipakai dapat dipahami dengan lebih dari satu cara, meskipun “generasi” merupakan terjemahan yang paling langsung.
    reason: alternative_reading
  - marker: b
    text: Sejumlah terjemahan memakai “semua hal ini”, dengan memasukkan kata “ini” berdasarkan konteks sekitarnya; teks Yunani di sini hanya menyatakan “segala sesuatu”.
    reason: lexical_alternative
  - marker: c
    text: Atau “terwujud” atau “menjadi kenyataan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam perkataan Yesus, kata ini memperkenalkan penegasan yang khidmat dan berwibawa. “Sesungguhnya” alami dalam ragam Alkitab Indonesia modern dan mempertahankan daya penegasannya.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Menerjemahkan formula ujaran langsung secara dekat dan tetap wajar dalam bahasa Indonesia.
- source_word: οὐ μὴ παρέλθῃ
  choice: pasti tidak akan berlalu
  rationale: Gabungan οὐ μή dengan aoristus subjungtif menyatakan penyangkalan yang sangat tegas. “Pasti tidak akan” menyampaikan penekanan itu dengan jelas.
- source_word: ἡ γενεὰ αὕτη
  choice: generasi ini
  rationale: “Generasi” merupakan padanan leksikal yang paling langsung bagi γενεά. Acuan frasa tersebut tetap dibiarkan terbuka dan tidak ditentukan melalui tafsiran di dalam teks utama.
- source_word: ἕως ἂν
  choice: sebelum
  rationale: Dalam konstruksi negatif ini, “sebelum” secara alami menyatakan batas waktu sampai terjadinya peristiwa yang disebut berikutnya; maknanya setara dengan “sampai ... terjadi” tetapi lebih lancar dalam bahasa Indonesia.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Mencerminkan bentuk netral jamak “semuanya/segala sesuatu” tanpa menambahkan kata penunjuk “ini” yang tidak terdapat dalam teks Yunani.
- source_word: γένηται
  choice: terjadi
  rationale: Dalam konteks ini γίνομαι menunjuk pada sesuatu yang berlangsung atau menjadi kenyataan. “Terjadi” alami dan tidak menambahkan nuansa “digenapi” yang lebih khusus.
theological_decisions:
- issue: Makna “generasi ini” dalam perkataan eskatologis
  choice: Menerjemahkan secara leksikal sebagai “generasi ini” tanpa menetapkan siapa tepatnya yang dimaksud.
  alternative: “bangsa ini”, “zaman ini”, atau generasi yang menyaksikan tanda-tanda tersebut
  rationale: Walaupun “generasi ini” adalah terjemahan paling langsung, acuannya diperdebatkan. Teks utama mempertahankan ungkapan Yunani tanpa menyelesaikan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Aku” mengikuti kebiasaan penulisan rujukan kepada Yesus dalam terjemahan Alkitab Indonesia. Susunan penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan agar hubungannya jelas.
