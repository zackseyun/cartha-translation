translation:
  language: id
  text: Dengan ketekunan kalian, perolehlah hidup kalian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sebagian naskah memakai bentuk futur: “Dengan ketekunan kalian, kalian akan memperoleh hidup kalian.”'
    reason: textual_variant
  - marker: b
    text: Atau “jiwa kalian”; kata Yunani ini juga dapat berarti “nyawa” atau “diri”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: dengan
  rationale: 'Dengan datif, ἐν di sini paling wajar dipahami sebagai penanda sarana: ketekunan merupakan jalan atau sarana untuk meraih hidup.'
- source_word: ὑπομονῇ
  choice: ketekunan
  rationale: ὑπομονή menunjuk pada ketabahan yang terus bertahan di bawah tekanan. Dalam konteks penganiayaan, “ketekunan” lebih alami dan aktif daripada sekadar “kesabaran”.
- source_word: κτήσασθε
  choice: raihlah
  rationale: Bentuk dalam teks SBLGNT adalah imperatif aoris medial. “Raihlah” mempertahankan daya perintahnya dan menyampaikan gagasan memperoleh atau mendapatkan tanpa menafsirkannya secara sempit sebagai sekadar mempertahankan diri.
- source_word: ψυχὰς
  choice: hidup
  rationale: Dalam konteks ancaman, kematian, dan pemeliharaan terakhir, ψυχή secara wajar menunjuk pada hidup atau diri seseorang secara utuh. “Hidup” menghindari pembatasan makna pada unsur nonjasmani saja.
- source_word: ὑμῶν
  choice: kalian
  rationale: Kata ganti Yunani ini berbentuk jamak. “Kalian” menyatakannya dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna ψυχή dalam konteks penganiayaan dan akhir zaman
  choice: hidup secara utuh
  alternative: jiwa atau diri
  rationale: “Hidup” mempertahankan cakupan menyeluruh dari ψυχή dan ketegangan antara bahaya jasmani yang nyata dengan keselamatan atau pemeliharaan terakhir, tanpa menetapkan antropologi tubuh-jiwa tertentu.
- issue: Daya imperatif κτήσασθε dan varian bentuk futur
  choice: 'menerjemahkan bentuk SBLGNT sebagai perintah: “raihlah”'
  alternative: “kalian akan memperoleh” berdasarkan varian futur atau pemahaman resultatif
  rationale: Karena sumber utama yang diberikan berbunyi κτήσασθε, bentuk imperatif dipertahankan dalam teks utama. Bacaan futur dicatat agar varian tekstual dan nuansa hasil tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menunjukkan bahwa semua kata ganti orang kedua dalam ayat ini berbentuk jamak. Susunan kalimat tetap dekat dengan teks Yunani, tetapi “dengan” dan “raihlah” menjaga kealamian ungkapan Indonesia.
