  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: id
  text: Sebab, inilah hari-hari pembalasan[a], supaya semua yang telah tertulis digenapi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghukuman setimpal.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sehingga semua yang telah tertulis digenapi.” Konstruksi Yunani dapat menyatakan tujuan atau hasil.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Kata ini menjelaskan alasan bagi peringatan sebelumnya dan mempertahankan daya kausal atau eksplanatorisnya.
- source_word: ἡμέραι ἐκδικήσεως
  choice: hari-hari pembalasan
  rationale: Ungkapan ini dipertahankan secara dekat dengan teks Yunani. “Pembalasan” menyampaikan tindakan penghukuman atau penuntutan keadilan, bukan sekadar gagasan umum tentang keadilan.
- source_word: αὗταί εἰσιν
  choice: inilah
  rationale: Bentuk ini alami dalam bahasa Indonesia serta mempertahankan penunjukan tegas kepada hari-hari yang sedang dibicarakan.
- source_word: τοῦ πλησθῆναι
  choice: supaya ... digenapi
  rationale: Konstruksi infinitif ini dapat menyatakan tujuan atau hasil. “Supaya” memberikan susunan Indonesia yang jelas, sedangkan kemungkinan nuansa hasil dicatat dalam catatan kaki.
- source_word: πάντα τὰ γεγραμμένα
  choice: semua yang telah tertulis
  rationale: Partisipel perfek pasif diterjemahkan tanpa mempersempit acuannya secara eksplisit menjadi “Kitab Suci”; bentuk perfek tercermin dalam “telah tertulis”.
theological_decisions:
- issue: Sifat ἐκδίκησις dalam nubuat Yesus
  choice: pembalasan
  alternative: penghukuman setimpal
  rationale: “Pembalasan” mempertahankan bobot penghakiman yang keras dalam teks, sementara konteks pemenuhan hal-hal tertulis menempatkannya dalam kerangka penghakiman ilahi, bukan dendam manusia.
- issue: Daya τοῦ dengan infinitif
  choice: supaya semua yang telah tertulis digenapi
  alternative: sehingga semua yang telah tertulis digenapi
  rationale: Konstruksi Yunani dapat bernuansa tujuan maupun hasil. Teks utama memakai bentuk tujuan yang alami, dan catatan kaki mempertahankan kemungkinan nuansa hasil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Inilah” menghindari susunan kaku “hari-hari ini adalah,” sedangkan “hari-hari pembalasan” mempertahankan citra dan ketegasan teks sumber.
