review_pass:
  verdict: revise
  source_fidelity: 'Makna utama terjaga: pertanyaan retoris, pakaian halus/mewah, kemewahan, dan istana kerajaan diterjemahkan sesuai teks Yunani. Namun, «hendak ... ketika ... pergi ke luar» menggeser aoristus ἐξήλθατε dari tindakan lampau langsung menjadi maksud dan anak kalimat waktu, serta «ke luar» kurang tepat untuk ‘pergi keluar’ dalam konteks orang banyak yang pergi melihat Yohanes.'
  naturalness: Sebagian besar baku dan jelas, tetapi pembukaan lebih alami dan setia sebagai «Tetapi, apa yang kalian pergi untuk melihat?» atau «Tetapi, apa yang kalian keluar untuk melihat?» Dalam bahasa Indonesia modern, «Apa yang kalian pergi untuk melihat?» masih kurang luwes; «Apa yang kalian pergi lihat?» adalah bentuk retoris yang alami. «Lihatlah» lebih langsung dan idiomatis daripada «Ketahuilah» untuk ἰδού.
  terminology: '«Pakaian halus», «berpakaian mewah», «hidup dalam kemewahan», dan «istana-istana raja» sesuai konteks sosial-ekonomi dan tidak memasukkan penilaian moral pada μαλακοῖς. Catatan a tepat. Catatan b perlu diselaraskan: alternatif yang paling langsung ialah «istana-istana kerajaan/raja» atau «istana raja-raja», bukan «di lingkungan istana», karena βασίλεια terutama menunjuk kediaman kerajaan.'
