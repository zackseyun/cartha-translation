  to: Tetapi, apa yang kalian pergi lihat? Seorang yang mengenakan pakaian halus[a]? Lihatlah, orang-orang yang mengenakan pakaian mewah dan hidup dalam kemewahan berada di istana-istana raja[b].
  rationale: Revisi memulihkan pertanyaan retrospektif dan hubungan tujuan dalam ἐξήλθατε ἰδεῖν dengan ungkapan Indonesia yang ringkas dan alami, «apa yang kalian pergi lihat?». «Lihatlah» menerjemahkan ἰδού secara langsung. Selebihnya dipertahankan karena menyampaikan kontras antara pakaian halus, kemewahan, dan kediaman kerajaan tanpa menambahkan penilaian moral atau doktrinal.
