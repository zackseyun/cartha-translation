  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: id
  text: Tetapi, apa yang kalian pergi lihat? Seorang yang mengenakan pakaian halus[a]? Lihatlah, orang-orang yang mengenakan pakaian mewah dan hidup dalam kemewahan berada di istana-istana raja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pakaian yang lembut.” Ungkapan ini menunjuk pada pakaian halus dan mahal yang berkaitan dengan kemewahan, bukan pada kelemahan moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “istana-istana kerajaan.” Kata Yunani ini menunjuk pada kediaman kerajaan atau istana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai peralihan yang bersifat kontras dalam rangkaian pertanyaan retoris Yesus.
- source_word: ἐξήλθατε ἰδεῖν
  choice: yang hendak kalian lihat ketika kalian pergi ke luar
  rationale: Menyatakan tujuan tindakan lampau secara alami dalam bahasa Indonesia sambil mempertahankan bentuk pertanyaan retoris.
- source_word: ἄνθρωπον
  choice: Seorang
  rationale: Mengacu kepada seorang laki-laki dalam konteks, tetapi 'seorang' sudah alami dan jelas tanpa pengulangan kata 'laki-laki'.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: yang mengenakan pakaian halus
  rationale: Mempertahankan gambaran konkret tentang pakaian yang lembut, halus, dan mahal, bukan sifat moral pemakainya.
- source_word: ἰδοὺ
  choice: Ketahuilah
  rationale: Seruan ini mengarahkan perhatian pendengar kepada penjelasan berikutnya; 'Ketahuilah' sesuai dengan ragam Alkitab modern yang bermartabat.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: berpakaian mewah
  rationale: Dalam konteks status sosial dan lingkungan istana, ἔνδοξος menunjuk pada pakaian yang megah atau indah; 'mewah' mengungkapkannya secara alami.
- source_word: τρυφῇ ὑπάρχοντες
  choice: hidup dalam kemewahan
  rationale: Mengungkapkan keadaan hidup serba nikmat atau mewah, bukan sekadar berada secara statis di dalam 'kemewahan'.
- source_word: ἐν τοῖς βασιλείοις
  choice: di istana-istana raja
  rationale: Menjaga bentuk jamak dan menyampaikan tempat kediaman atau lingkungan kerajaan secara jelas.
theological_decisions:
- issue: Makna μαλακοῖς dalam konteks
  choice: Pakaian halus yang berkaitan dengan kemewahan
  alternative: Pakaian yang lembut; pakaian kewanita-wanitaan
  rationale: Konteks langsung membandingkan kehidupan keras di padang gurun dengan pakaian mewah dan kehidupan istana; tidak ada dasar untuk memasukkan penilaian moral mengenai kewanita-wanitaan.
- issue: Cakupan βασιλείοις
  choice: Istana-istana raja
  alternative: Lingkungan istana; kediaman-kediaman kerajaan
  rationale: Kata Yunani ini dapat menunjuk pada kediaman atau lingkungan kerajaan. Terjemahan utama memilih tempat tinggal kerajaan, sedangkan catatan kaki mempertahankan kemungkinan nuansa lingkungan istana.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lisan-retoris yang bermartabat. Kata ganti 'kalian' dipakai karena verba Yunani berbentuk jamak dan Yesus berbicara kepada orang banyak. Struktur pertanyaan dipertahankan, sedangkan ungkapan partisipial disesuaikan agar alami dalam bahasa Indonesia.
