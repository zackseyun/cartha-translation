base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: id
  text: Yesus menjawab dan berkata kepadanya, “Simon, ada sesuatu yang hendak Kukatakan kepadamu.” Simon berkata, “Guru, katakanlah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Guru, berbicaralah.” Kata Yunani Διδάσκαλε berarti “Guru”, dan εἰπέ secara sederhana berarti “katakanlah” atau “berbicaralah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menjawab
  rationale: Partisip aoris ini membentuk ungkapan naratif bersama verba berikutnya. “Menjawab” mempertahankan pola wacana Yunani, meskipun tanggapan Yesus tidak harus merupakan jawaban atas pertanyaan lisan.
- source_word: εἶπεν πρὸς αὐτόν
  choice: berkata kepadanya
  rationale: Ini merupakan padanan langsung dan wajar bagi λέγω dengan πρὸς + akusatif.
- source_word: Σίμων
  choice: Simon
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: ada sesuatu yang hendak Kukatakan kepadamu
  rationale: Ungkapan ini menyatakan bahwa Yesus mempunyai sesuatu untuk disampaikan kepada Simon. “Hendak Kukatakan” alami dalam bahasa Indonesia dan tetap mencerminkan σοί, “kepadamu”.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini adalah arti leksikal langsung διδάσκαλος dan tidak menambahkan nuansa kewenangan yang lebih kuat seperti “Tuan” atau “Majikan”.
- source_word: εἰπέ
  choice: katakanlah
  rationale: Imperatif aoris ini mempersilakan Yesus menyampaikan hal yang baru saja disebut-Nya. Bentuk tanpa objek eksplisit mempertahankan kelugasan bahasa Yunani.
- source_word: φησίν
  choice: Jawab Simon
  rationale: Present historis Yunani dialihkan ke bentuk naratif Indonesia. Nama “Simon” dipakai untuk memperjelas rujukan subjek tanpa mengubah pelaku.
theological_decisions:
- issue: Fungsi ἀποκριθεὶς ketika tidak ada pertanyaan lisan sebelumnya
  choice: mempertahankan “menjawab”
  alternative: “menanggapi” atau menghilangkannya dan hanya memakai “berkata”
  rationale: Verba Yunani dapat memperkenalkan tanggapan terhadap keadaan atau pikiran, bukan hanya jawaban atas pertanyaan. “Menjawab” menjaga bentuk sumber dan membiarkan ketegangan naratif itu tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan “menjawab dan berkata” sengaja dipertahankan agar pola naratif sumber tetap tampak, sedangkan “Jawab Simon” memberi alur dialog yang alami dan jelas.
