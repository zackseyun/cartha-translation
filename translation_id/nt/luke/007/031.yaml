id: LUK.7.31
reference: Luke 7:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: id
  text: “Jadi, dengan apakah Aku akan membandingkan orang-orang dari generasi ini? Seperti apakah mereka?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι
  choice: dengan apakah
  rationale: Mempertahankan bentuk pertanyaan mengenai hal yang dipakai sebagai pembanding, sambil terdengar wajar dalam bahasa Indonesia.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan atau peralihan yang bertolak dari konteks sebelumnya.
- source_word: τοὺς ἀνθρώπους
  choice: orang-orang
  rationale: ἄνθρωποι di sini merujuk secara umum kepada manusia atau orang, bukan khusus laki-laki; bentuk ulang menandai kelompok yang dimaksud.
- source_word: τῆς γενεᾶς ταύτης
  choice: dari generasi ini
  rationale: Menerjemahkan frasa genitif secara langsung dan mempertahankan istilah 'generasi' yang dapat mencakup orang-orang sezaman beserta ciri kolektif mereka.
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: Seperti apakah mereka?
  rationale: Ungkapan Indonesia alami yang mempertahankan pertanyaan kedua tanpa menambahkan penafsiran.
theological_decisions:
- issue: Cakupan τοὺς ἀνθρώπους
  choice: orang-orang
  alternative: laki-laki
  rationale: Kata Yunani ἀνθρώπους bersifat generik dalam konteks ini dan tidak mengharuskan pembatasan berdasarkan jenis kelamin.
- issue: Makna γενεά
  choice: generasi
  alternative: angkatan
  rationale: ‘Generasi’ mempertahankan keluasan makna sumber—orang-orang sezaman dan kelompok yang dicirikan oleh sikap tertentu—tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Dua pertanyaan dipertahankan untuk mencerminkan struktur retoris Yunani. Huruf kapital pada ‘Aku’ mengikuti kebiasaan penerbitan Alkitab Indonesia ketika pembicara adalah Yesus, tanpa mengubah makna gramatikal sumber.
