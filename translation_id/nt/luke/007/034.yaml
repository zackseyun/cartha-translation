  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: id
  text: Anak Manusia telah datang sambil makan dan minum, lalu kalian berkata, ‘Lihat, ia seorang pelahap dan pemabuk, sahabat para pemungut pajak dan orang-orang berdosa!’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: telah datang
  rationale: Bentuk perfektum menyatakan kedatangan yang sudah terjadi dan relevan bagi keadaan kini; ‘telah datang’ merupakan padanan Indonesia yang alami.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar khas yang dipakai Yesus bagi diri-Nya serta kemungkinan gema Daniel tanpa memparafrasakannya.
- source_word: ἐσθίων καὶ πίνων
  choice: dengan makan dan minum
  rationale: Partisipel kini menerangkan cara atau keadaan yang menyertai kedatangan-Nya; bentuk ini alami dan mempertahankan kontras dengan Yohanes.
- source_word: λέγετε
  choice: kalian berkata
  rationale: Kata ganti ‘kalian’ memperjelas bahwa verba Yunani ini berbentuk orang kedua jamak, sedangkan kala kini diterjemahkan secara alami dengan ‘berkata’.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Menjaga daya seru dan penunjukan ungkapan Yunani dalam bahasa Indonesia modern tanpa memakai diksi arkais.
- source_word: ἄνθρωπος
  choice: ia seorang
  rationale: Unsur ‘orang/manusia’ dinyatakan secara idiomatis melalui konstruksi ‘ia seorang’, sehingga tuduhan nominal berikutnya terbaca alami.
- source_word: φάγος
  choice: pelahap
  rationale: Nomina ini adalah cercaan bagi orang yang makan berlebihan; ‘pelahap’ mempertahankan ketajaman tuduhan.
- source_word: οἰνοπότης
  choice: pemabuk
  rationale: Secara harfiah menunjuk peminum anggur, tetapi dalam rangkaian tuduhan ini bernada mencela; ‘pemabuk’ menyampaikan daya peyoratifnya secara alami.
- source_word: φίλος
  choice: sahabat
  rationale: ‘Sahabat’ secara ringkas dan alami menyatakan hubungan yang dituduhkan oleh para penentang Yesus.
- source_word: τελωνῶν
  choice: para pemungut pajak
  rationale: Padanan modern yang lazim dan jelas untuk petugas pemungut pajak pada masa itu.
- source_word: ἁμαρτωλῶν
  choice: orang-orang berdosa
  rationale: Mempertahankan label sosial-keagamaan yang dipakai para penentang Yesus tanpa mengurangi atau menambah penilaiannya.
theological_decisions:
- issue: Penerjemahan gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia
  rationale: ‘Anak Manusia’ mempertahankan bentuk gelar kristologis yang dikenal luas dan kemungkinan resonansi antarteksnya, tanpa menutup ambiguitas maknanya.
- issue: Daya tuduhan terhadap Yesus
  choice: pelahap dan pemabuk
  alternative: orang yang rakus dan peminum anggur
  rationale: Ucapan ini merupakan fitnah bermuatan keras dari para penentang, bukan penilaian narator. Padanan yang dipilih mempertahankan nada cercaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk menyatakan orang kedua jamak secara jelas. Tanda baca mempertahankan ucapan langsung dan daya serunya.
