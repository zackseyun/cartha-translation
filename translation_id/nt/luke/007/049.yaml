  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: id
  text: Orang-orang yang makan bersama Yesus mulai berkata di antara mereka sendiri[a], “Siapakah dia ini, yang bahkan mengampuni dosa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkata dalam hati mereka.” Ungkapan Yunani ini dapat menunjuk pada percakapan di antara para tamu atau perkataan dalam batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: mulai
  rationale: Konstruksi ἤρξαντο dengan infinitif menandai awal suatu tindakan; “mulai” mempertahankan daya aspektualnya secara alami dalam bahasa Indonesia.
- source_word: οἱ συνανακείμενοι
  choice: orang-orang yang makan bersama Yesus
  rationale: Partisip ini secara harfiah menggambarkan orang-orang yang berbaring bersama saat makan menurut kebiasaan kuno. Ungkapan “makan bersama Yesus” mempertahankan konteks perjamuan dan unsur kebersamaan tanpa menghasilkan gambaran yang janggal bagi pembaca Indonesia modern.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: berkata di antara mereka
  rationale: Ungkapan Yunani ini dapat menunjuk pada percakapan antartamu atau perkataan dalam batin. Dalam konteks subjek jamak, “di antara mereka” wajar dan tetap memungkinkan pembicaraan yang terbatas di kalangan para tamu; alternatif refleksi batin dicatat dalam catatan kaki.
- source_word: Τίς οὗτός ἐστιν
  choice: Siapakah dia ini
  rationale: Teks Yunani tidak memuat kata “orang” atau “laki-laki”. Bentuk ini mempertahankan pertanyaan yang ringkas dan bernada heran, sedangkan “siapakah” memberi register yang bermartabat.
- source_word: καὶ
  choice: bahkan
  rationale: καί di sini bersifat askensif dan menyoroti keterkejutan terhadap tindakan yang dipersoalkan; “bahkan” lebih tepat daripada “juga” untuk menyampaikan daya retoris tersebut.
- source_word: ἁμαρτίας ἀφίησιν
  choice: mengampuni dosa
  rationale: Dalam konteks ini, ἀφίημι merupakan ungkapan lazim untuk pengampunan dosa. “Mengampuni dosa” jelas, alami, dan mempertahankan bobot teologis pernyataan itu.
theological_decisions:
- issue: Implikasi wewenang Yesus untuk mengampuni dosa
  choice: 'Mempertahankan pertanyaan para tamu tanpa tambahan penafsiran: “Siapakah dia ini, yang bahkan mengampuni dosa?”'
  alternative: Menjelaskan di dalam teks bahwa pengampunan dosa merupakan wewenang ilahi atau secara eksplisit mengidentifikasi jati diri Yesus.
  rationale: Ayat ini menampilkan keheranan para tamu dan menimbulkan pertanyaan kristologis secara implisit, tetapi tidak memberikan jawabannya di sini. Terjemahan mempertahankan ketegangan teologis tersebut tanpa memasukkan kesimpulan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Makan bersama” dipilih alih-alih terjemahan harfiah “berbaring bersama” agar latar perjamuan dapat dipahami secara alami, sementara nama “Yesus” memperjelas rujukan implisit dari unsur συν- dan konteks narasi. Kata “dia” tidak dikapitalisasi sesuai kaidah umum bahasa Indonesia dan agar kapitalisasi tidak menjadi penafsiran teologis tambahan.
