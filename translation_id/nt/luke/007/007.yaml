  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: id
  text: Karena itu, aku bahkan tidak menganggap diriku layak datang kepada-Mu. Tetapi ucapkanlah sepatah kata, dan biarlah hambaku[a] disembuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anakku” atau “anak laki-lakiku”; kata Yunani ini dapat merujuk kepada seorang anak, anak laki-laki, atau hamba, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Karena itu
  rationale: Menandai kesimpulan dari pernyataan sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: οὐδὲ
  choice: bahkan tidak
  rationale: 'Memperkuat penyangkalan: perwira itu tidak sampai menganggap dirinya layak datang sendiri.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: aku ... tidak menganggap diriku layak
  rationale: ἀξιόω berarti menilai atau menganggap layak; bentuk refleksif dipertahankan dengan 'diriku'.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: datang kepada-Mu
  rationale: Mengungkapkan gerak mendatangi Yesus secara langsung; huruf kapital pada pronomina mengikuti kebiasaan hormat dalam bahasa Indonesia.
- source_word: ἀλλὰ
  choice: Tetapi
  rationale: Memperkenalkan permintaan yang berlawanan dengan gagasan bahwa ia harus datang sendiri.
- source_word: εἰπὲ λόγῳ
  choice: katakanlah sepatah kata saja
  rationale: Ungkapan datif ini menunjuk pada ucapan yang berkuasa. 'Sepatah kata saja' alami dalam bahasa Indonesia dan menonjolkan keyakinan bahwa ucapan Yesus sudah cukup, tanpa mengubahnya menjadi perintah eksplisit.
- source_word: ἰαθήτω
  choice: hendaklah ... disembuhkan
  rationale: Mempertahankan bentuk imperatif pasif orang ketiga dari bahasa Yunani, alih-alih melicinkannya menjadi pernyataan masa depan.
- source_word: ὁ παῖς μου
  choice: hambaku
  rationale: παῖς dapat berarti anak, pemuda, atau hamba. Konteks perwira dan hubungan kewenangan mendukung 'hamba', sementara keluasan maknanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna παῖς dalam kisah perwira
  choice: hambaku
  alternative: anakku atau anak muda yang berada dalam tanggunganku
  rationale: Konteks rumah tangga perwira dan orang yang berada di bawah kewenangannya mendukung arti 'hamba', tetapi istilah Yunani itu sendiri tetap memiliki nuansa usia atau kedekatan yang tidak boleh dihapus; karena itu alternatifnya dipertahankan dalam catatan kaki.
- issue: Daya ujar Yesus dan bentuk ἰαθήτω
  choice: hendaklah ... disembuhkan
  alternative: maka hambaku akan sembuh
  rationale: Bentuk sumber adalah imperatif pasif, bukan indikatif masa depan. Terjemahan mempertahankan bentuk permohonan agar kesembuhan terjadi, tanpa mengubahnya menjadi ramalan atau merinci pelaku pasif yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' sesuai dengan tuturan pribadi dalam narasi, sedangkan '-Mu' menyatakan sapaan hormat kepada Yesus. Susunan 'sepatah kata saja' dipilih agar alami dan tetap menekankan kecukupan ucapan Yesus. Penanda catatan kaki [a] ditempatkan langsung setelah 'hambaku'.
