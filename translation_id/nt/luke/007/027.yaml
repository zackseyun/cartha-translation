id: LUK.7.27
reference: Luke 7:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: id
  text: 'Dialah orang yang tentangnya tertulis: “Lihat, Aku mengutus utusan-Ku[a] mendahului-Mu[b]. Ia akan mempersiapkan jalan-Mu di hadapan-Mu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “utusan” juga dapat berarti “malaikat”; di sini kata itu menunjuk kepada Yohanes sebagai utusan manusia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di depan wajah-Mu,” yakni “di depan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: Dialah orang yang tentangnya tertulis
  rationale: Mempertahankan penunjukan yang tegas kepada Yohanes dan rumusan pengutipan Kitab Suci, sekaligus tetap wajar dalam bahasa Indonesia modern.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Menyampaikan seruan untuk memperhatikan dengan jelas dan khidmat tanpa memakai bentuk yang terlalu arkais.
- source_word: ἀποστέλλω
  choice: Aku mengutus
  rationale: Bentuk kini dalam kutipan nubuat disampaikan sebagai tindakan yang hidup dan langsung; bentuk Indonesia ini juga sesuai dengan gaya deklaratif kutipan.
- source_word: ἄγγελόν μου
  choice: utusan-Ku
  rationale: ἄγγελος dapat berarti utusan atau malaikat. Dalam konteks ini yang dimaksud ialah Yohanes sebagai utusan manusia, sehingga 'utusan' paling tepat tanpa meniadakan cakupan leksikalnya.
- source_word: πρὸ προσώπου σου
  choice: mendahului-Mu
  rationale: Ungkapan ini secara idiomatis berarti berada atau diutus di depan seseorang. 'Mendahului-Mu' alami dalam bahasa Indonesia dan menyatakan fungsi sang utusan; gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: κατασκευάσει τὴν ὁδόν σου
  choice: akan mempersiapkan jalan-Mu
  rationale: Mempertahankan kala mendatang, tindakan membuat siap, dan metafora 'jalan' dalam kutipan nubuat.
- source_word: ἔμπροσθέν σου
  choice: di hadapan-Mu
  rationale: Membedakan frasa penutup ini dari πρὸ προσώπου σου sambil mempertahankan makna posisi di depan dan gaya yang khidmat.
theological_decisions:
- issue: Penerapan bahasa kutipan Kitab Suci tentang utusan dan jalan kepada Yohanes dalam hubungannya dengan Yesus
  choice: Mempertahankan semua kata ganti orang kedua tanpa menambahkan identitas atau gelar penafsir
  alternative: Menjelaskan dalam teks bahwa Yohanes mempersiapkan jalan bagi Tuhan atau Mesias
  rationale: Teks Yunani membiarkan daya teologis penerapan itu hadir melalui kata ganti orang kedua. Penambahan gelar akan menafsirkan lebih jauh daripada bunyi ayat.
- issue: Kapitalisasi kata ganti dalam kutipan
  choice: Menggunakan 'Aku', '-Ku', dan '-Mu' sesuai kebiasaan hormat bahasa Indonesia untuk rujukan ilahi
  alternative: Menulis seluruh kata ganti dengan huruf kecil untuk meniru ketiadaan pembedaan kapitalisasi dalam naskah Yunani
  rationale: Kapitalisasi merupakan konvensi ejaan Indonesia, bukan tambahan gelar dalam teks. Rujukan orang kedua tetap tidak diperluas atau dijelaskan secara parafrastis.
translation_notes:
  register: Bahasa modern, jelas, dan khidmat. Rumusan kutipan dipertahankan tanpa menjadi arkais; pengulangan kata ganti orang kedua dijaga karena penting bagi bentuk dan daya teologis kutipan.
