  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina sapaan 'engkau' sesuai dialog langsung, sedangkan kapitalisasi pada bentuk yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
