  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: id
  text: Lalu Yesus berpaling kepada perempuan itu dan berkata kepada Simon, “Apakah engkau melihat perempuan ini? Aku masuk ke rumahmu, tetapi engkau tidak memberi-Ku air untuk kaki-Ku.[a] Namun, ia membasahi kaki-Ku dengan air matanya dan menyeka kaki-Ku dengan rambutnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “engkau tidak memberi-Ku air pada kaki-Ku.” Maksudnya ialah menyediakan air bagi kaki tamu, sesuai kebiasaan menerima tamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: berpaling kepada perempuan itu
  rationale: Menyampaikan perubahan arah tubuh Yesus kepada perempuan tersebut secara alami dan tetap dekat dengan konstruksi Yunani.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Apakah engkau melihat perempuan ini?
  rationale: Mempertahankan pertanyaan langsung dan demonstratif ταύτην, yang menyoroti perempuan itu dalam perbandingan dengan tindakan Simon.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Aku masuk ke rumahmu
  rationale: Padanan langsung dan wajar bagi pernyataan aoris mengenai kedatangan Yesus ke rumah Simon.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: engkau tidak memberi-Ku air untuk membasuh kaki-Ku
  rationale: Dalam bahasa Indonesia, tujuan air perlu dinyatakan agar maksud ungkapan ἐπὶ πόδας jelas dan alami; catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: ia membasahi kaki-Ku dengan air matanya
  rationale: Menerjemahkan βρέχω sebagai 'membasahi' dan mempertahankan air mata sebagai sarana tindakan.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: menyekanya dengan rambutnya
  rationale: Padanan Indonesia yang alami untuk tindakan menyeka kaki dengan rambut; objek tersirat jelas merujuk kepada kaki Yesus.
