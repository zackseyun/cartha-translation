  terminology: ‘Yesus,’ ‘Simon,’ ‘perempuan,’ ‘air mata,’ dan ‘rambut’ tepat serta konsisten dengan penggunaan Indonesia modern. Kapitalisasi pronomina yang merujuk kepada Yesus dipertahankan sesuai konvensi penerbitan yang dinyatakan oleh draft.
