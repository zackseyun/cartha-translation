base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: id
  text: Setelah para utusan Yohanes pergi, Yesus mulai berbicara kepada orang banyak tentang Yohanes, “Untuk melihat apa kalian pergi ke padang belantara? Sebatang buluh yang digoyangkan angin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Setelah ... pergi
  rationale: 'Partisip aoris dalam konstruksi genitif absolut menyatakan urutan waktu: para utusan pergi sebelum Yesus mulai berbicara.'
- source_word: ἀγγέλων
  choice: para utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada manusia yang diutus Yohanes, bukan makhluk surgawi.
- source_word: Ἰωάννου
  choice: Yohanes
  rationale: Bentuk genitif pertama menyatakan hubungan kepunyaan ('utusan Yohanes'), sedangkan pemakaian berikutnya berarti 'tentang Yohanes'.
- source_word: ἤρξατο λέγειν
  choice: mulai berbicara
  rationale: Mempertahankan aspek inkoatif, yaitu permulaan suatu tuturan kepada orang banyak.
- source_word: πρὸς τοὺς ὄχλους
  choice: kepada orang banyak
  rationale: Ungkapan Indonesia yang alami untuk kelompok pendengar jamak; 'orang banyak' dapat berfungsi kolektif tanpa harus memakai bentuk 'kerumunan-kerumunan'.
- source_word: περὶ Ἰωάννου
  choice: tentang Yohanes
  rationale: Padanan langsung dan alami bagi περί dengan genitif dalam konteks pembicaraan.
- source_word: Τί ἐξήλθατε
  choice: Apa yang hendak kalian lihat ketika kalian pergi
  rationale: τί menanyakan objek yang dilihat, bukan terutama alasan atau motif. Susunan kalimat disesuaikan agar pertanyaan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: εἰς τὴν ἔρημον
  choice: ke padang belantara
  rationale: Menunjuk wilayah sepi dan jarang dihuni tempat pelayanan Yohanes; 'padang belantara' lebih tepat daripada 'gurun' yang dapat menyiratkan hamparan pasir.
- source_word: θεάσασθαι
  choice: hendak ... lihat
  rationale: Infinitif tujuan menyatakan maksud mereka pergi; 'lihat' alami dalam bahasa Indonesia dan tidak menambahkan gagasan yang tidak ada dalam teks.
- source_word: κάλαμον
  choice: sebatang buluh
  rationale: Mempertahankan gambaran harfiah tumbuhan buluh yang lentur dan mudah bergerak oleh angin.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: yang digoyang-goyangkan angin
  rationale: Bentuk pasif dan tindakan berkelanjutan pada partisip dipertahankan secara idiomatis; pengulangan 'goyang' memberi gambaran gerak akibat angin.
theological_decisions:
- issue: Daya metaforis pertanyaan retoris mengenai Yohanes
  choice: Mempertahankan gambaran harfiah 'Sebatang buluh yang digoyang-goyangkan angin?'
  alternative: Seorang yang lemah atau mudah berubah pendirian?
  rationale: Teks menyajikan citra tersebut tanpa menjelaskan maknanya. Terjemahan tidak menutup kemungkinan nuansa ketidakstabilan atau kelemahan dengan parafrasa penafsiran.
- issue: Subjek tersirat pada ἤρξατο
  choice: Yesus
  alternative: ia
  rationale: Bahasa Yunani membiarkan subjek tersirat dari konteks. Menyebut 'Yesus' membuat rujukan jelas bagi pembaca Indonesia tanpa mengubah identitas tokoh.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan 'kalian' dipakai karena verba Yunani berbentuk orang kedua jamak dan Yesus berbicara kepada orang banyak. Tidak ada penanda catatan kaki karena tidak ada catatan yang diperlukan dalam draf Indonesia ini; catatan Inggris yang diberikan tampaknya salah tempat, sebab penandanya mengikuti 'gone away' sementara isinya membahas θεάσασθαι.
