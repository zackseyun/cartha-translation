id: LUK.7.30
reference: Luke 7:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: id
  text: Tetapi orang-orang Farisi dan para ahli hukum Taurat menolak maksud Allah bagi diri mereka sendiri[a] dengan tidak dibaptis olehnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menolak maksud Allah terhadap diri mereka sendiri” atau “menolak rencana Allah mengenai diri mereka sendiri.”
    reason: alternative_reading
  - marker: b
    text: Maksudnya, oleh Yohanes Pembaptis.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: para ahli hukum Taurat
  rationale: Istilah ini menunjuk kepada orang-orang yang ahli dalam hukum Musa. Pilihan ini lebih tepat daripada sekadar “ahli Taurat,” yang dapat disamakan dengan kelompok ahli kitab (γραμματεῖς), dan lebih jelas daripada “pengacara” dalam konteks Indonesia modern.
- source_word: βουλὴν
  choice: maksud
  rationale: βουλή dapat berarti maksud, rencana, atau ketetapan. “Maksud” terdengar alami dan tetap menyatakan kehendak atau rancangan Allah tanpa menyelesaikan ketegangan teologis tentang bagaimana maksud itu ditolak.
- source_word: ἠθέτησαν
  choice: menolak
  rationale: ἀθετέω di sini menyatakan tindakan menampik atau mengesampingkan. “Menolak” merupakan padanan yang langsung, jelas, dan sesuai konteks.
- source_word: εἰς ἑαυτούς
  choice: bagi diri mereka sendiri
  rationale: Frasa ini paling wajar dipahami sebagai maksud Allah yang berkenaan dengan mereka secara pribadi. Catatan kaki mempertahankan kemungkinan arti “terhadap diri mereka sendiri.”
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: dengan tidak dibaptis olehnya
  rationale: Bentuk ini mempertahankan konstruksi partisip pasif Yunani dan tidak secara tegas mengubahnya menjadi hubungan sebab-akibat. Kata “dengan” menghubungkan tindakan mereka dengan penolakan yang disebut sebelumnya tanpa menambahkan unsur kemauan yang tidak dinyatakan secara eksplisit.
- source_word: αὐτοῦ
  choice: olehnya
  rationale: Pronomina Yunani dipertahankan dalam teks utama. Rujukannya kepada Yohanes Pembaptis dijelaskan dalam catatan kaki berdasarkan konteks ayat sebelumnya.
- source_word: δὲ
  choice: Tetapi
  rationale: δέ menandai kontras dengan orang-orang pada ayat sebelumnya yang menerima baptisan Yohanes; “Tetapi” menyatakan kontras itu dengan jelas.
theological_decisions:
- issue: Arti βουλή Allah dalam hubungannya dengan orang Farisi dan para ahli hukum Taurat
  choice: maksud Allah bagi diri mereka sendiri
  alternative: maksud Allah terhadap diri mereka sendiri; rencana Allah mengenai diri mereka sendiri
  rationale: Terjemahan ini menyatakan bahwa mereka menolak apa yang Allah maksudkan bagi mereka tanpa membuat klaim lebih jauh bahwa kehendak Allah dalam pengertian mutlak dapat digagalkan. Alternatifnya dicatat untuk mempertahankan ambiguitas εἰς ἑαυτούς.
- issue: Hubungan partisip μὴ βαπτισθέντες dengan kata kerja utama
  choice: dengan tidak dibaptis olehnya
  alternative: karena mereka tidak dibaptis olehnya; mereka tidak dibaptis olehnya
  rationale: Konstruksi Yunani dapat menyatakan cara, keadaan yang menyertai, atau sebab tersirat. Terjemahan utama tidak menetapkan hubungan sebab-akibat secara lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Para ahli hukum Taurat” dipakai untuk ketepatan istilah dan agar mudah dipahami pembaca umum. Struktur kalimat dibuat ringkas sambil mempertahankan ambiguitas penting dalam frasa εἰς ἑαυτούς dan konstruksi partisip.
