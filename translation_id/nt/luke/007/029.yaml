id: LUK.7.29
reference: Luke 7:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: id
  text: Dan seluruh rakyat yang mendengar hal itu, termasuk para pemungut pajak, mengakui bahwa Allah benar[a], sesudah dibaptis dengan baptisan Yohanes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membenarkan Allah”; maksudnya, mereka mengakui bahwa Allah berada di pihak yang benar.
    reason: lexical_alternative
  - marker: b
    text: 'Partisip ini juga dapat dipahami secara kausal: “karena mereka telah dibaptis dengan baptisan Yohanes.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: seluruh rakyat
  rationale: Ungkapan kolektif tunggal ini mencakup rakyat secara luas. Pilihan ini mempertahankan cakupan πᾶς dan sifat kolektif λαός tanpa mengubahnya menjadi sekadar ‘orang banyak’.
- source_word: ἀκούσας
  choice: yang mendengar hal itu
  rationale: Partisip aoris ini dipahami secara temporal. ‘Hal itu’ memasok objek yang tersirat dari konteks dan menghasilkan bahasa Indonesia yang wajar.
- source_word: οἱ τελῶναι
  choice: para pemungut pajak
  rationale: Padanan modern yang baku, jelas, dan tidak menambahkan penilaian moral yang tidak dinyatakan oleh istilah Yunani.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: mengakui bahwa Allah benar
  rationale: Dengan Allah sebagai objek, δικαιόω di sini berarti mengakui atau menegaskan bahwa Allah benar dan berada di pihak yang benar, bukan membuat Allah menjadi benar. Pilihan ini menjaga makna forensik secara dapat dipahami.
- source_word: βαπτισθέντες
  choice: sebagai orang-orang yang telah menerima baptisan
  rationale: Rumusan ini mempertahankan partisip sebagai keterangan keadaan atau latar belakang dan tidak memaksakan hubungan sebab-akibat, meskipun kemungkinan kausal tetap dicatat.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: baptisan Yohanes
  rationale: Padanan ringkas dan alami bagi konstruksi Yunani yang merujuk pada baptisan yang dilayankan atau diberitakan oleh Yohanes.
theological_decisions:
- issue: Makna ‘membenarkan Allah’
  choice: Ungkapan ini diterjemahkan sebagai pengakuan bahwa Allah benar.
  alternative: 'Secara lebih harfiah: ‘membenarkan Allah’.'
  rationale: Ayat ini berbicara tentang tanggapan manusia yang mengakui kebenaran Allah, bukan tentang manusia yang menjadikan Allah benar. Terjemahan utama menghindari kesan keliru itu sambil mempertahankan nuansa penghakiman atau penilaian.
- issue: Hubungan partisip βαπτισθέντες dengan klausa utama
  choice: Partisip dipertahankan sebagai keterangan keadaan atau latar belakang.
  alternative: 'Partisip dapat dipahami secara kausal: ‘karena mereka telah menerima baptisan Yohanes’.'
  rationale: Bentuk Yunani memungkinkan nuansa sebab dalam konteks, tetapi tidak menuntutnya. Teks utama sengaja tidak memastikan hubungan kausal yang masih ambigu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Mengakui bahwa Allah benar’ dipilih agar dapat dipahami pembaca umum tanpa menghilangkan nuansa forensik; ‘sebagai orang-orang yang telah menerima baptisan’ mempertahankan ketidakpastian sintaksis mengenai apakah baptisan itu sekadar latar keadaan atau alasan bagi tanggapan mereka.
