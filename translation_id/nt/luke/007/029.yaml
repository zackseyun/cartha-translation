  rationale: Revisi mengganti konstruksi nominal yang kaku dengan klausa pasif yang secara langsung mencerminkan βαπτισθέντες. “Sesudah dibaptis” mempertahankan urutan peristiwa yang lazim tersirat dalam partisip aoris dan tidak memasukkan hubungan sebab-akibat sebagai makna utama; kemungkinan kausal tetap tersedia dalam catatan kaki.
