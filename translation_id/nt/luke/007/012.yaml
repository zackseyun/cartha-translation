  source_fidelity: 'Terjemahan dengan setia mencakup seluruh unsur Yunani: pendekatan Yesus ke gerbang kota, penanda perhatian ἰδού, tindakan imperfek pasif orang mati yang sedang diusung ke luar, statusnya sebagai satu-satunya anak laki-laki ibunya, keadaan ibu sebagai janda, dan kehadiran banyak orang dari kota itu bersama sang ibu. “Menyertainya” secara wajar mengacu kepada ibu, sebagaimana σύν αὐτῇ dalam sumber.'
