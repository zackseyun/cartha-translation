  terminology: “Anak laki-laki satu-satunya” membedakan secara tepat υἱός dari istilah netral “anak” dan menyampaikan μονογενής dalam arti kekeluargaan, tanpa memaksakan makna Kristologis. “Janda” dan “gerbang kota” juga tepat.
