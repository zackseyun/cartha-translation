id: LUK.7.12
reference: Luke 7:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: id
  text: Ketika Ia mendekati gerbang kota, lihatlah, seorang yang telah meninggal sedang diusung ke luar. Ia adalah anak laki-laki satu-satunya[a] dari ibunya, dan ibunya itu seorang janda. Banyak orang dari kota itu menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “putra tunggal ibunya.”'
    reason: Alternatif yang lebih padat untuk μονογενὴς υἱός; keduanya menyatakan bahwa ia adalah anak laki-laki tunggal sang ibu.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Ketika Ia mendekati
  rationale: Mengungkapkan hubungan waktu dan gerak mendekat secara alami dalam bahasa Indonesia; daya sambung ringan δέ terserap dalam alur narasi.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: gerbang kota
  rationale: Padanan ringkas dan alami untuk gerbang pada akses keluar-masuk kota.
- source_word: καὶ ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi ἰδού sebagai penanda wacana yang mengarahkan perhatian pembaca kepada adegan mendadak.
- source_word: ἐξεκομίζετο
  choice: sedang diusung ke luar
  rationale: Bentuk imperfek pasif menunjukkan tindakan yang sedang berlangsung; 'diusung' sesuai dengan konteks iring-iringan pemakaman.
- source_word: τεθνηκώς
  choice: seorang yang telah meninggal
  rationale: Partisip perfek menggambarkan seseorang dalam keadaan sudah mati; ungkapan ini jelas dan bermartabat.
- source_word: μονογενὴς υἱός
  choice: anak laki-laki satu-satunya
  rationale: Dalam konteks keluarga ini, μονογενής menyatakan bahwa dia satu-satunya atau tunggal, sedangkan υἱός menyatakan bahwa dia anak laki-laki.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: dari ibunya
  rationale: 'Datifnya menyatakan hubungan: orang yang diusung itu adalah anak laki-laki satu-satunya milik ibunya.'
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: dan ibunya itu seorang janda
  rationale: Menyebut ulang 'ibunya' memperjelas rujukan αὐτή serta mempertahankan penekanan pada keadaan sang ibu.
- source_word: ὄχλος τῆς πόλεως ἱκανὸς
  choice: Banyak orang dari kota itu
  rationale: Mengungkapkan secara alami bahwa ada kumpulan orang dalam jumlah cukup besar dari kota tersebut tanpa melebih-lebihkan ukurannya.
- source_word: ἦν σὺν αὐτῇ
  choice: menyertainya
  rationale: Menyatakan pendampingan dalam konteks iring-iringan secara lebih jelas daripada sekadar 'bersamanya'.
theological_decisions:
- issue: Makna μονογενής dalam konteks non-Kristologis
  choice: anak laki-laki satu-satunya
  alternative: putra tunggalnya
  rationale: Di sini μονογενής menggambarkan hubungan keluarga sang janda, bukan gelar Kristologis. Terjemahan mempertahankan arti kontekstual 'satu-satunya' tanpa memasukkan muatan doktrinal dari konteks lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Ia' merujuk kepada Yesus sesuai konteks. 'Diusung' mempertahankan suasana pemakaman, sedangkan 'lihatlah' menjaga daya penarik perhatian dari ἰδού.
