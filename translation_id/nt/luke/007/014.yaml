  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: id
  text: Lalu Yesus mendekat dan menyentuh usungan jenazah[a] itu. Orang-orang yang mengusungnya pun berhenti. Kemudian Ia berkata, “Hai anak muda, Aku berkata kepadamu, bangunlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tandu jenazah” atau “keranda.” Istilah Yunani ini menunjuk pada usungan atau rangka tempat jenazah dibawa dalam prosesi pemakaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: mendekat
  rationale: Partisip aoristus ini menunjukkan gerakan Yesus mendekati usungan sebelum menyentuhnya. 'Mendekat' alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: ἥψατο
  choice: menyentuh
  rationale: Dalam konstruksi ini bentuk medium ἅπτω lazim berarti menyentuh. Pilihan ini tidak melebihkan tindakan menjadi memegang erat.
- source_word: σοροῦ
  choice: usungan jenazah
  rationale: σορός dalam konteks prosesi pemakaman menunjuk pada tandu atau kerangka terbuka untuk membawa jenazah, bukan dengan pasti peti mati tertutup. 'Usungan jenazah' jelas bagi pembaca modern dan sesuai dengan latar sejarah.
- source_word: οἱ δὲ βαστάζοντες
  choice: Orang-orang yang mengusungnya
  rationale: Frasa ini menunjuk kepada mereka yang membawa usungan. 'Orang-orang' tidak menambahkan jenis kelamin yang tidak dinyatakan secara eksplisit oleh bentuk Yunani, sedangkan pronomina '-nya' merujuk kepada usungan.
- source_word: ἔστησαν
  choice: berhenti
  rationale: Aoristus ἵστημι di sini berarti para pengusung berhenti bergerak. 'Berhenti' merupakan ungkapan Indonesia yang paling alami dalam konteks prosesi.
- source_word: Νεανίσκε
  choice: Hai anak muda
  rationale: Vokatif νεανίσκος adalah sapaan langsung kepada seorang laki-laki muda. Partikel 'Hai' menandai sapaan dengan jelas dan tetap bermartabat.
- source_word: σοὶ λέγω
  choice: Aku berkata kepadamu
  rationale: Dativus eksplisit σοὶ memberi penekanan langsung. Susunan ini mempertahankan kesungguhan dan otoritas ucapan tanpa menambah penafsiran.
- source_word: ἐγέρθητι
  choice: bangunlah
  rationale: Imperatif aoristus pasif/deponen ἐγείρω memerintahkan pemuda itu untuk bangkit. 'Bangunlah' alami sebagai ujaran langsung dalam bahasa Indonesia dan, dalam konteks orang mati, tetap membawa bobot mukjizat tanpa harus memperjelasnya menjadi 'bangkitlah dari kematian'.
theological_decisions:
- issue: Nada dan bentuk perintah Yesus kepada orang mati
  choice: bangunlah
  alternative: bangkitlah; hendaklah engkau dibangkitkan
  rationale: '''Bangunlah'' mempertahankan bentuk perintah langsung serta otoritas ucapan Yesus. Bentuk ini tidak mengubah imperatif menjadi penjelasan teologis tentang pelaku kebangkitan, sehingga ambiguitas bentuk pasif/deponen Yunani tidak diselesaikan secara berlebihan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan tindakan dipertahankan dengan 'Lalu' dan 'Kemudian'; 'pun' menandai respons para pengusung secara alami. Kapitalisasi pronomina bagi Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia tanpa menambahkan isi doktrinal.
