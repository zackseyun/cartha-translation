id: LUK.7.22
reference: Luke 7:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: id
  text: 'Lalu ia menjawab mereka, “Pergilah dan laporkan kepada Yohanes apa yang telah kamu lihat dan dengar: orang buta memperoleh penglihatan[a], orang lumpuh berjalan, orang yang berpenyakit kusta ditahirkan[b], orang tuli mendengar, orang mati dibangkitkan, dan kepada orang miskin diberitakan kabar baik[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melihat kembali.” Kata kerja Yunani dapat berarti memperoleh atau mendapatkan kembali kemampuan melihat; di sini maksudnya ialah menerima penglihatan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang secara tradisional diterjemahkan “kusta” dapat mencakup berbagai penyakit kulit, tidak hanya penyakit Hansen yang kini disebut kusta.
    reason: historical_semantic_range
  - marker: c
    text: 'Atau, “kabar baik diberitakan kepada orang miskin.” Bentuk Yunaninya pasif: orang miskin menerima pemberitaan kabar baik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menjawab
  rationale: Partisip aoristus ini memperkenalkan tanggapan Yesus. Bentuk verbal sederhana paling alami dalam bahasa Indonesia dan tetap mempertahankan daya responsifnya.
- source_word: Πορευθέντες
  choice: Pergilah
  rationale: Partisip yang menyertai imperatif utama berfungsi sebagai perintah pendahuluan; bentuk imperatif Indonesia menyampaikan maksudnya secara alami.
- source_word: ἀπαγγείλατε
  choice: laporkan
  rationale: Kata ini menyatakan penyampaian kembali hal-hal yang disaksikan kepada Yohanes; “laporkan” mempertahankan nuansa laporan berdasarkan bukti.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: apa yang telah kamu lihat dan dengar
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyatakan pengamatan yang sudah terjadi serta kini harus disampaikan.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: orang buta memperoleh penglihatan
  rationale: ἀναβλέπω dalam konteks ini menunjuk pada diterimanya kemampuan melihat. Pilihan ini tidak memastikan apakah mereka sebelumnya pernah dapat melihat.
- source_word: χωλοὶ περιπατοῦσιν
  choice: orang lumpuh berjalan
  rationale: Terjemahan langsung dan wajar dari subjek adjektival jamak beserta verba yang menyertainya.
- source_word: λεπροὶ καθαρίζονται
  choice: orang yang berpenyakit kusta ditahirkan
  rationale: “Ditahirkan” mempertahankan dimensi kemurnian ritual dalam καθαρίζονται, bukan sekadar kesembuhan medis; istilah penyakit diberi catatan karena cakupan λέπρα kuno lebih luas daripada kusta modern.
- source_word: κωφοὶ ἀκούουσιν
  choice: orang tuli mendengar
  rationale: Dengan verba “mendengar”, κωφοί jelas merujuk kepada orang tuli, bukan orang bisu.
- source_word: νεκροὶ ἐγείρονται
  choice: orang mati dibangkitkan
  rationale: Bentuk pasif mempertahankan pelaku yang tidak disebutkan dalam teks Yunani.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: kepada orang miskin diberitakan kabar baik
  rationale: Susunan ini mempertahankan makna pasif bahwa orang miskin menjadi penerima pemberitaan kabar baik tanpa memakai jargon gerejawi.
theological_decisions:
- issue: Daftar mukjizat sebagai bukti identitas dan misi Yesus
  choice: Menyajikan tindakan-tindakan pemulihan sebagai hal yang dapat dilihat dan didengar tanpa menambahkan penjelasan mesianik yang eksplisit.
  alternative: Menambahkan bahasa penggenapan untuk menonjolkan kaitan dengan nubuat Yesaya.
  rationale: Ayat ini sendiri menjadikan karya-karya tersebut sebagai jawaban yang harus dilaporkan kepada Yohanes. Diksi terjemahan membiarkan gaung nubuat tetap terdengar tanpa memasukkan kesimpulan tafsir ke dalam teks utama.
- issue: Pelaku dalam bentuk-bentuk pasif
  choice: Mempertahankan bentuk pasif pada “ditahirkan”, “dibangkitkan”, dan “diberitakan”.
  alternative: Menyebut Allah atau Yesus secara eksplisit sebagai pelaku.
  rationale: Teks Yunani tidak menyatakan pelakunya dalam klausa-klausa tersebut; mempertahankan bentuk pasif menjaga ketegangan dan kehati-hatian teologis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat ringkas dan paralel. Kata ganti “ia” tidak dikapitalisasi karena bahasa sumber tidak menandai penghormatan secara tipografis; hal ini menghindari penambahan konvensi teologis ke dalam terjemahan.
