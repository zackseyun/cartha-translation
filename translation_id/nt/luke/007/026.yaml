  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: id
  text: Namun, untuk melihat apa kalian pergi ke luar? Seorang nabi? Ya, Aku berkata kepada kalian, bahkan lebih daripada seorang nabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "sesuatu yang lebih daripada seorang nabi." Ungkapan perbandingan Yunani ini dapat diterjemahkan lebih harfiah demikian; "lebih daripada seorang nabi" adalah ungkapan Indonesia yang lebih alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan pertanyaan retoris sebelumnya dan terdengar wajar serta bermartabat dalam bahasa Indonesia modern.
- source_word: τί
  choice: apa
  rationale: Pronomina tanya ini menjadi objek dari tindakan melihat, sehingga berarti 'apa', bukan 'mengapa'.
- source_word: ἐξήλθατε ἰδεῖν
  choice: apa yang hendak kalian lihat ketika pergi ke luar
  rationale: Infinitif ἰδεῖν menyatakan tujuan dari tindakan pergi ke luar; susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan lampau dari konteks.
- source_word: προφήτην
  choice: Seorang nabi
  rationale: Nomina umum tunggal yang digunakan secara eliptis dalam pertanyaan retoris.
- source_word: ναί
  choice: Ya
  rationale: Jawaban afirmatif langsung yang mempertahankan kekuatan retoris teks.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Menerjemahkan formula ujaran secara langsung; 'kalian' menyatakan bentuk jamak ὑμῖν dengan jelas.
- source_word: καὶ περισσότερον προφήτου
  choice: bahkan lebih daripada seorang nabi
  rationale: καὶ di sini secara alami dapat memberi penegasan klimaks, sedangkan bentuk komparatif dengan genitif menyatakan bahwa status yang dimaksud melampaui seorang nabi tanpa menjelaskan caranya.
theological_decisions:
- issue: Identitas dan kedudukan Yohanes dalam pernyataan Yesus
  choice: Yesus menegaskan bahwa Yohanes adalah nabi, bahkan lebih daripada seorang nabi, tanpa merinci dalam ayat ini sifat kelebihannya.
  alternative: Menjelaskan Yohanes sebagai nabi terbesar atau secara eksplisit sebagai utusan akhir zaman.
  rationale: Ungkapan ringkas Yunani dipertahankan agar ketegangan teologisnya tidak diselesaikan melalui tambahan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk memperlihatkan bahwa Yesus berbicara kepada banyak orang; 'Aku' dikapitalisasi sesuai konvensi penerbitan Alkitab bahasa Indonesia untuk ujaran Yesus.
