review_pass:
  verdict: revise
  source_fidelity: Draf menangkap kedatangan para utusan, permohonan yang sungguh-sungguh, dan penilaian bahwa perwira itu layak. Namun, “pertolongan” menambahkan objek yang tidak disebutkan oleh τοῦτο (“hal ini”), dan “menerima pertolongan” menggeser konstruksi παρέξῃ dari tindakan Yesus menyediakan/melakukan sesuatu menjadi tindakan perwira menerima pertolongan tertentu. Teks sumber tetap menunjuk secara umum kepada hal yang dimohonkan dalam konteks.
  naturalness: Susunan “kata mereka” dapat dipahami, tetapi “sambil berkata” lebih alami sebagai padanan partisip λέγοντες setelah verba utama. Kalimat revisi tetap menggunakan bahasa Indonesia modern dan hormat.
  terminology: “Layak,” “memohon,” dan “dengan sungguh-sungguh” sesuai dengan ἄξιος, παρεκάλουν, dan σπουδαίως. “Hal ini” mempertahankan keluasan τοῦτο tanpa menafsirkan tindakan itu sebagai “pertolongan.” Kapitalisasi “-Nya” dan “-Mu” konsisten untuk sapaan kepada Yesus dalam register draf.
  issues:
  - severity: medium
    issue: Penambahan “pertolongan” dalam teks utama
    rationale: τοῦτο hanya berarti “hal ini/ini” dan tidak menyebut “pertolongan.” Selain itu, “Ia layak menerima pertolongan ini” memusatkan kalimat pada penerimaan oleh perwira, sedangkan παρέξῃ menyatakan tindakan yang Yesus akan lakukan/sediakan baginya.
  - severity: low
    issue: “kata mereka” kurang mencerminkan hubungan partisipial λέγοντες
    rationale: “Sambil berkata” menyatakan hubungan yang lebih langsung dan alami dengan permohonan mereka.
  revised_text: Ketika mereka datang kepada Yesus, mereka memohon kepada-Nya dengan sungguh-sungguh sambil berkata, “Ia layak untuk menerima hal ini dari-Mu.”[a]
