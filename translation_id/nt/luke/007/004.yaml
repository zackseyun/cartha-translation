revisions:
- from: Ketika mereka datang kepada Yesus, mereka memohon dengan sungguh-sungguh kepada-Nya, kata mereka, “Ia layak menerima pertolongan ini dari-Mu.”[a]
  to: Ketika mereka datang kepada Yesus, mereka memohon kepada-Nya dengan sungguh-sungguh sambil berkata, “Ia layak untuk menerima hal ini dari-Mu.”[a]
  rationale: Revisi menghapus tambahan makna “pertolongan” dan mempertahankan τοῦτο sebagai “hal ini.” Teks utama menyampaikan secara alami kemungkinan bahwa Yesus akan memberikan hal itu kepada perwira, sedangkan catatan kaki mempertahankan kemungkinan konstruksi yang menekankan tindakan Yesus baginya. Kedua bentuk tidak menentukan secara lebih rinci tindakan yang dimaksud.
