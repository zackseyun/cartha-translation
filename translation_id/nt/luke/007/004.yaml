  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: id
  text: Ketika mereka datang kepada Yesus, mereka memohon kepada-Nya dengan sungguh-sungguh sambil berkata, “Ia layak untuk menerima hal ini dari-Mu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia layak Engkau melakukan hal ini baginya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: datang
  rationale: Partisip ini menyatakan bahwa mereka tiba dan hadir di hadapan Yesus; bentuk temporal “ketika mereka datang” wajar dalam bahasa Indonesia.
- source_word: παρεκάλουν
  choice: memohon
  rationale: Dalam konteks ini, kata tersebut menunjuk pada permintaan yang hormat tetapi kuat; “memohon” mempertahankan nada permintaan tanpa menambah kesan putus asa.
- source_word: σπουδαίως
  choice: dengan sungguh-sungguh
  rationale: Ungkapan ini menyampaikan keseriusan dan kegigihan permohonan mereka secara alami.
- source_word: Ἄξιός
  choice: layak
  rationale: “Layak” secara langsung mempertahankan penilaian para tua-tua terhadap perwira itu.
- source_word: ᾧ
  choice: menerima ... dari-Mu
  rationale: Pronomina relatif datif merujuk kepada perwira; susunan Indonesia ini membuat hubungan penerima dengan tindakan Yesus jelas dan alami.
- source_word: παρέξῃ
  choice: pertolongan ... dari-Mu
  rationale: παρέχω dapat berarti menyediakan, memberikan, atau melakukan sesuatu bagi seseorang. Dalam konteks permintaan kesembuhan, “menerima pertolongan ini dari-Mu” mengungkapkan maksudnya tanpa menentukan bentuk pertolongan lebih jauh.
- source_word: τοῦτο
  choice: ini
  rationale: Kata penunjuk ini merujuk pada tindakan yang baru saja diminta dalam konteks dan dipertahankan tanpa penjelasan tambahan.
theological_decisions:
- issue: Makna konstruksi ᾧ παρέξῃ τοῦτο
  choice: “Ia layak menerima pertolongan ini dari-Mu”
  alternative: “Ia layak Engkau lakukan hal ini baginya”
  rationale: Bahasa Yunani dapat dipahami sebagai memberikan sesuatu kepadanya atau melakukan hal ini baginya. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia modern, hormat, dan mudah dipahami. Bentuk “kepada-Nya” dan “dari-Mu” mempertahankan rujukan kepada Yesus secara jelas; ujaran langsung dibuat alami tanpa menghilangkan nada penghormatan dan kesungguhan.
