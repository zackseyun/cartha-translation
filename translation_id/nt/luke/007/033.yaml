  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: id
  text: Sebab Yohanes Pembaptis telah datang tanpa makan roti ataupun minum anggur, dan kalian berkata, “Dia kerasukan setan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dia mempunyai setan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: telah datang
  rationale: Bentuk perfek mempertahankan relevansi kedatangan Yohanes dalam pembahasan ini; “telah datang” wajar dalam bahasa Indonesia dan tidak meratakannya menjadi sekadar peristiwa lampau.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” alami dan bermartabat dalam konteks ini.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Yohanes Pembaptis
  rationale: Sebutan baku dalam bahasa Indonesia dan tetap memperlihatkan peran Yohanes sebagai orang yang membaptis.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: tanpa makan roti dan tanpa minum anggur
  rationale: Mengungkapkan pola hidup asketis Yohanes secara alami sambil mempertahankan kata konkret ἄρτον sebagai “roti”, bukan memperluasnya menjadi “makanan”.
- source_word: λέγετε
  choice: kalian berkata
  rationale: Bentuk kini menggambarkan tanggapan khas para pendengar. “Kalian” memperjelas bahwa orang kedua yang disapa berbentuk jamak.
- source_word: Δαιμόνιον ἔχει
  choice: Dia kerasukan setan
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan tuduhan bahwa Yohanes berada di bawah kuasa setan; catatan kaki mempertahankan bentuk yang lebih harfiah.
theological_decisions:
- issue: Penerjemahan δαιμόνιον dalam tuduhan terhadap Yohanes
  choice: setan
  alternative: roh najis
  rationale: δαιμόνιον menunjuk pada makhluk roh jahat dan tidak boleh diselaraskan dengan ungkapan berbeda, πνεῦμα ἀκάθαρτον (“roh najis”), yang tidak dipakai dalam ayat ini.
- issue: Bentuk ungkapan Δαιμόνιον ἔχει
  choice: Dia kerasukan setan
  alternative: Dia mempunyai setan
  rationale: Pilihan utama memakai idiom Indonesia yang jelas tanpa mengubah isi tuduhan. Alternatif harfiah dicatat agar bentuk ungkapan Yunani tetap terlihat dan ketegangan konseptualnya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang wajar dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas. Pengulangan “tanpa” mempertahankan kesejajaran makan dan minum dalam sumber.
