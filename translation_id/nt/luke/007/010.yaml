id: LUK.7.10
reference: Luke 7:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: id
  text: Ketika orang-orang yang diutus itu kembali ke rumah, mereka mendapati budak[a] itu dalam keadaan sehat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hamba." Kata Yunani doulos dapat berarti "budak" atau "hamba," bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: ketika ... kembali
  rationale: Partisip aoris ini berfungsi secara temporal dan menunjukkan tindakan yang mendahului kata kerja utama; bentuk ini alami dalam bahasa Indonesia.
- source_word: εἰς τὸν οἶκον
  choice: ke rumah
  rationale: εἰς dengan akusatif menyatakan gerak menuju suatu tempat. 'Ke rumah' mempertahankan lokasi konkret tanpa harus menafsirkannya sebagai rumah mereka sendiri.
- source_word: οἱ πεμφθέντες
  choice: orang-orang yang diutus itu
  rationale: Mempertahankan bentuk pasif partisip dan tidak menambahkan sebutan tafsiran seperti 'utusan'.
- source_word: εὗρον
  choice: mereka mendapati
  rationale: Dalam konteks narasi, 'mendapati' secara alami menyatakan bahwa mereka menemukan budak itu berada dalam keadaan tertentu.
- source_word: τὸν δοῦλον
  choice: budak
  rationale: δοῦλος dapat berarti budak atau hamba sesuai konteks. Dalam rumah tangga perwira ini, 'budak' lebih jelas mempertahankan status sosial orang yang berada di bawah kepemilikan dan wewenang tuannya.
- source_word: ὑγιαίνοντα
  choice: dalam keadaan sehat
  rationale: Partisip kini dari ὑγιαίνω berarti berada dalam keadaan sehat. Ungkapan ini tidak menggantinya dengan 'telah sembuh', yang akan membuat hasil penyembuhan lebih eksplisit daripada bentuk Yunani.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam kisah penyembuhan
  choice: budak
  alternative: hamba
  rationale: Konteks tidak menghapus status terikat orang tersebut, sehingga 'budak' dipilih demi ketepatan sosial-historis. 'Hamba' tetap dicantumkan sebagai kemungkinan terjemahan karena kata Yunani itu memiliki rentang makna tersebut dan istilah itu lazim dalam tradisi Alkitab bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan narasi Yunani sambil terdengar alami. Penanda catatan kaki ditempatkan sesudah kata yang dijelaskannya, bukan sesudah 'rumah'.
