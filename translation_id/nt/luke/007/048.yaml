  source_fidelity: Terjemahan setia pada εἶπεν δὲ αὐτῇ dan pada deklarasi perfektum pasif Ἀφέωνταί σου αἱ ἁμαρτίαι. “Lalu” menyampaikan fungsi penghubung δέ secara wajar, dan “sudah diampuni” dengan tepat mengungkapkan pengampunan yang telah terjadi serta hasilnya yang tetap berlaku, tanpa menambahkan pelaku atau waktu yang tidak dinyatakan teks.
  naturalness: Bahasa Indonesia modern, jelas, dan bermartabat. “Lalu Yesus berkata kepada perempuan itu” merupakan penjelasan rujukan yang alami berdasarkan konteks dekat; “Dosa-dosamu sudah diampuni” juga idiomatis dalam ujaran langsung.
