  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: id
  text: Lalu Yesus berkata kepada perempuan itu, “Dosa-dosamu sudah diampuni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Dosa-dosamu telah diampuni.” Bentuk perfektum pasif dalam bahasa Yunani dapat menekankan tindakan yang sudah selesai beserta hasilnya yang tetap berlaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk aoris dari λέγω paling wajar diterjemahkan sebagai tindakan bertutur langsung, yaitu “berkata”.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel δέ di sini merupakan penghubung ringan yang melanjutkan alur cerita, bukan pertentangan yang tegas.
- source_word: αὐτῇ
  choice: kepada perempuan itu
  rationale: Pronomina datif feminin tunggal menunjuk kepada perempuan dalam konteks sebelumnya. Penyebutan “perempuan itu” menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: Ἀφέωνταί
  choice: sudah diampuni
  rationale: Bentuk perfektum pasif ἀφίημι menyatakan tindakan pengampunan yang telah terlaksana dengan hasil yang tetap berlaku. “Sudah diampuni” alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: σου
  choice: -mu
  rationale: Pronomina genitif orang kedua tunggal dinyatakan secara alami dengan akhiran posesif “-mu”.
- source_word: αἱ ἁμαρτίαι
  choice: Dosa-dosa
  rationale: Bentuk jamak ἁμαρτίαι merujuk pada pelanggaran-pelanggaran moral di hadapan Allah; pengulangan “dosa-dosa” menyatakan jamak secara jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Daya perfektum pasif Ἀφέωνταί dalam pernyataan pengampunan
  choice: “Dosa-dosamu sudah diampuni.”
  alternative: “Dosa-dosamu telah diampuni.” atau “Dosa-dosamu diampuni.”
  rationale: “Sudah diampuni” menyampaikan tindakan yang telah selesai beserta keadaan pengampunan yang masih berlaku, tanpa menentukan waktu atau pelaku pengampunan lebih jauh daripada teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Subjek tersirat pada εἶπεν dijelaskan sebagai “Yesus” berdasarkan konteks dekat, sedangkan αὐτῇ diterjemahkan “kepada perempuan itu” agar rujukannya jelas.
