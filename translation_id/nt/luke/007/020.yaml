id: LUK.7.20
reference: Luke 7:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: id
  text: Ketika orang-orang itu datang kepada-Nya, mereka berkata, “Yohanes Pembaptis mengutus kami kepada-Mu dengan pesan, ‘Apakah Engkau Dia yang akan datang itu[a], atau haruskah kami menantikan orang lain?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia yang Akan Datang.”
    reason: Menunjukkan bahwa ungkapan Yunani dapat dipahami dan ditampilkan sebagai sebuah gelar.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Ketika orang-orang itu datang kepada-Nya
  rationale: Partisip aoristus menyatakan keadaan yang mendahului ujaran. Bentuk ini alami dalam narasi Indonesia dan mempertahankan arah gerak kepada Yesus.
- source_word: οἱ ἄνδρες
  choice: orang-orang itu
  rationale: Konteks menunjuk kepada para utusan laki-laki yang telah disebutkan; bahasa Indonesia lazim memakai 'orang-orang itu' tanpa menambahkan keterangan yang tidak terdapat dalam ayat ini.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Yohanes Pembaptis
  rationale: Gelar baku, jelas, dan luas dipahami dalam bahasa Indonesia.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: mengutus kami kepada-Mu dengan pesan
  rationale: Menyampaikan tindakan pengutusan dan fungsi partisip λέγων sebagai pengantar isi pesan dengan susunan Indonesia yang alami.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang akan datang itu
  rationale: Mempertahankan bentuk sebutan tertentu dan gema pengharapan mesianik tanpa secara eksplisit menggantinya dengan istilah 'Mesias'.
- source_word: ἄλλον προσδοκῶμεν
  choice: haruskah kami menantikan orang lain
  rationale: προσδοκάω mencakup menunggu dengan penuh harap; 'menantikan' mempertahankan kedua nuansa itu, sedangkan ἄλλον diterjemahkan secara jelas sebagai 'orang lain'.
theological_decisions:
- issue: Daya mesianik ὁ ἐρχόμενος
  choice: Dia yang akan datang itu
  alternative: Dia yang Akan Datang
  rationale: Terjemahan utama mempertahankan ungkapan Yunani sebagai sebutan tertentu yang bernuansa mesianik, tetapi tidak menyelesaikan ketegangan dengan langsung menuliskan 'Mesias'. Alternatif dalam catatan menonjolkan kemungkinan pembacaan sebagai gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia; bentuk sapaan langsung dipertahankan tanpa menambah penjelasan doktrinal.
