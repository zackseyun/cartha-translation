  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: id
  text: Lalu orang yang tadinya mati itu duduk dan mulai berbicara, lalu Yesus menyerahkannya kepada ibunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “mengembalikannya kepada ibunya” atau “menyerahkannya kembali kepada ibunya.” Teks Yunani hanya mengatakan “menyerahkannya kepada ibunya”; makna pemulihan tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: bangun dan duduk
  rationale: Kata kerja ἀνακαθίζω menggambarkan gerakan dari posisi berbaring menjadi duduk. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa ia berdiri.
- source_word: ὁ νεκρός
  choice: orang yang tadinya mati itu
  rationale: Secara harfiah berarti 'orang mati itu'. Penambahan 'tadinya' memperjelas dalam bahasa Indonesia bahwa orang tersebut kini telah hidup, tanpa menghilangkan rujukan pada keadaan sebelumnya.
- source_word: ἤρξατο λαλεῖν
  choice: mulai berbicara
  rationale: Konstruksi ἄρχομαι dengan infinitif menyatakan awal tindakan; 'mulai berbicara' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Yesus menyerahkannya kepada ibunya
  rationale: Subjek tersirat dijelaskan sebagai Yesus agar rujukannya alami dan jelas dalam bahasa Indonesia. 'Menyerahkan' mempertahankan arti dasar δίδωμι dalam konteks penyerahan seorang anak kepada ibunya tanpa secara eksplisit menambahkan makna 'kembali'.
theological_decisions:
- issue: Apakah makna pemulihan kepada sang ibu perlu dibuat eksplisit dengan 'mengembalikan' atau 'menyerahkan kembali'
  choice: menyerahkannya kepada ibunya
  alternative: mengembalikannya kepada ibunya / menyerahkannya kembali kepada ibunya
  rationale: Konteks menyiratkan pemulihan anak kepada ibunya, tetapi teks Yunani hanya memakai δίδωμι, 'memberikan/menyerahkan', tanpa unsur eksplisit yang berarti 'kembali'. Terjemahan utama mempertahankan ketegangan ini, sedangkan kemungkinan makna restoratif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang alami dan bermartabat. Pengulangan καί divariasikan menjadi 'lalu' dan 'kemudian' agar alurnya lancar. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
