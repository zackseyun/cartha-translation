source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: id
  text: Ketika orang Farisi yang telah mengundang Yesus melihat hal itu, ia berkata dalam hatinya, “Seandainya orang ini seorang nabi, tentu ia tahu siapa perempuan yang sedang menyentuhnya itu dan perempuan macam apa dia[a], sebab perempuan itu seorang berdosa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “siapa dan macam apa perempuan yang menyentuhnya itu.” Ungkapan Yunani menekankan baik identitas maupun watak atau reputasinya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bahwa perempuan itu seorang berdosa.” Klausa ini dapat dipahami sebagai alasan bagi penilaian tersebut atau sebagai isi dari apa yang menurut orang Farisi seharusnya diketahui Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Ketika ... melihat hal itu
  rationale: Partisip aoris menyatakan keadaan waktu bagi verba utama. “Hal itu” merujuk secara wajar pada tindakan dalam konteks sebelumnya, sedangkan δέ cukup tercermin dalam perkembangan narasi tanpa penanda tambahan.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: orang Farisi yang telah mengundang Yesus
  rationale: Dalam konteks perjamuan, καλέω berarti “mengundang”. Bentuk “telah mengundang” menunjukkan bahwa undangan mendahului peristiwa ini; nama “Yesus” memperjelas rujukan pronomina tanpa mengubah referennya.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: ia berkata dalam hatinya
  rationale: Ungkapan Yunani ini menunjukkan perkataan batin. Terjemahan Indonesia tidak perlu mengulang verba “berkata” dan “mengatakan” secara harfiah.
- source_word: Οὗτος
  choice: orang ini
  rationale: Demonstrativa ini merujuk kepada Yesus dan dapat mengandung nada menjaga jarak atau meremehkan.
- source_word: εἰ ἦν προφήτης ... ἐγίνωσκεν ἂν
  choice: Seandainya orang ini seorang nabi, tentu ia tahu
  rationale: Konstruksi εἰ dengan bentuk lampau dan apodosis ber-ἄν menyatakan kondisi yang dianggap tidak nyata oleh si pembicara. “Seandainya ... tentu” menyampaikan sikap skeptis itu secara alami dalam bahasa Indonesia.
- source_word: τίς καὶ ποταπὴ
  choice: siapa ... dan perempuan macam apa dia
  rationale: 'Kedua unsur interogatif dipertahankan: yang pertama menyangkut identitas, sedangkan yang kedua menyangkut jenis, watak, atau reputasi perempuan itu.'
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: yang sedang menyentuhnya itu
  rationale: Bentuk kini ἅπτεται menggambarkan sentuhan yang sedang berlangsung dalam adegan tersebut.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: sebab perempuan itu orang berdosa
  rationale: ὅτι dapat dipahami secara kausal dalam alur pikiran orang Farisi. “Orang berdosa” mempertahankan penilaian kategoris yang terdapat dalam teks.
theological_decisions:
- issue: Daya kondisi tentang Yesus sebagai nabi
  choice: 'Kondisi skeptis atau berlawanan dengan anggapan pembicara: “Seandainya orang ini seorang nabi, tentu ia tahu ...”'
  alternative: 'Kondisi lebih netral: “Jika orang ini seorang nabi, ia tentu tahu ...”'
  rationale: Konstruksi Yunani secara alami menunjukkan bahwa orang Farisi menganggap syarat itu tidak terpenuhi. Terjemahan menyajikan penilaiannya sebagai pikiran tokoh, bukan sebagai penilaian narator.
- issue: Hubungan ὅτι ἁμαρτωλός ἐστιν dengan klausa sebelumnya
  choice: 'Kausal: “sebab perempuan itu orang berdosa”'
  alternative: 'Isi pengetahuan: “bahwa perempuan itu orang berdosa”'
  rationale: Kedua hubungan sintaksis mungkin. Teks utama memakai hubungan kausal yang sesuai dengan penalaran orang Farisi, sementara catatan kaki mempertahankan kemungkinan bahwa klausa itu merupakan isi dari apa yang semestinya diketahui Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dalam hatinya” merupakan ungkapan alami untuk perkataan batin; “sedang menyentuh” mempertahankan aspek tindakan yang berlangsung. Nama “Yesus” dipakai sekali untuk menghindari kerancuan pronomina.
