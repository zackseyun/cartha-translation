  register: Bahasa Indonesia modern yang jelas dan bermartabat. Susunan 'yang seorang ... dan yang lain ...' mempertahankan kontras naratif Yunani, sedangkan pengulangan 'dinar' pada jumlah kedua memperjelas makna dalam bahasa Indonesia.
