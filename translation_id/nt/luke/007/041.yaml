  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: id
  text: “Ada dua orang yang berutang kepada seorang pemberi pinjaman uang. Yang seorang berutang lima ratus dinar[a], dan yang lain lima puluh dinar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu dinar adalah uang logam perak Romawi yang lazim dikaitkan dengan upah seorang pekerja untuk kira-kira satu hari kerja.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: orang yang berutang
  rationale: Ungkapan ini langsung menyatakan orang-orang yang mempunyai utang dan lebih alami dalam bahasa Indonesia modern daripada bentuk nominal yang kaku.
- source_word: δανιστῇ τινι
  choice: kepada seorang pemberi pinjaman uang
  rationale: δανιστής menunjuk pada orang yang meminjamkan uang, sedangkan τινι memperkenalkannya sebagai tokoh tertentu yang tidak disebutkan namanya.
- source_word: ὤφειλεν
  choice: berutang
  rationale: Bentuk imperfek menyatakan keadaan utang dalam latar cerita; 'berutang' menyampaikannya secara alami tanpa menambahkan aspek yang tidak diperlukan.
- source_word: δηνάρια
  choice: dinar
  rationale: Mempertahankan nama satuan mata uang kuno tersebut menjaga latar historis; nilainya dijelaskan dalam catatan kaki.
- source_word: πεντακόσια
  choice: lima ratus
  rationale: Padanan langsung bagi bilangan kardinal yang menerangkan jumlah dinar.
- source_word: ἕτερος
  choice: yang lain
  rationale: Secara alami membentuk pasangan kontras dengan 'yang seorang'.
- source_word: πεντήκοντα
  choice: lima puluh dinar
  rationale: Kata 'dinar' yang tersirat dalam bahasa Yunani diulangi dalam bahasa Indonesia agar jumlah utang terdengar jelas dan alami.
theological_decisions: []
