- from: Simon menjawab, “Menurut saya[a], orang yang dibebaskan dari utang yang lebih besar[b].” Lalu Yesus berkata kepadanya, “Penilaianmu tepat.”
  to: Simon menjawab, “Saya kira[a], orang yang utangnya dihapuskan lebih banyak[b].” Ia berkata kepadanya, “Engkau telah menilai dengan tepat.”
  rationale: Revisi memakai «Saya kira» untuk merepresentasikan inferensi tentatif Simon, mempertahankan metafora utang dalam teks utama, dan mengembalikan respons kedua ke bentuk ujaran langsung orang kedua. Pronomina «Ia» mengikuti bentuk sumber tanpa menambahkan nama atau penghubung yang tidak diperlukan. Penanda catatan kaki ditempatkan pada unsur yang dijelaskan dan kedua catatan konsisten dengan makna leksikal serta konteks perumpamaan.
