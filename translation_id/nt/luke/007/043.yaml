  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: id
  text: Simon menjawab, “Saya kira[a], orang yang utangnya dihapuskan lebih banyak[b].” Ia berkata kepadanya, “Engkau telah menilai dengan tepat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saya menganggap” atau “Saya menduga”; kata Yunaninya menyatakan inferensi yang tentatif.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang kepadanya ia menghapuskan utang yang lebih besar”; kata kerja Yunaninya dapat berarti membatalkan atau mengampunkan utang dengan murah hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: menjawab
  rationale: Gabungan partisip aoris dan verba ‘berkata’ berfungsi secara idiomatis untuk memperkenalkan jawaban; ‘menjawab’ alami dalam bahasa Indonesia tanpa kehilangan makna.
- source_word: Ὑπολαμβάνω
  choice: Menurut saya
  rationale: Ungkapan ini menyampaikan kesimpulan yang tentatif. ‘Menurut saya’ terdengar alami dan mempertahankan kehati-hatian jawaban Simon.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: orang yang dibebaskan dari utang yang lebih besar
  rationale: Dalam perumpamaan tentang dua orang berutang, χαρίζομαι menunjuk pada tindakan bermurah hati dengan menghapus atau membebaskan utang. Rumusan ini mempertahankan citra utang dan perbandingan jumlah yang tersirat dalam τὸ πλεῖον.
- source_word: Ὀρθῶς ἔκρινας
  choice: Penilaianmu tepat
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur penilaian dari κρίνω serta penegasan ‘tepat’ dari ὀρθῶς.
theological_decisions:
- issue: Makna bahasa pengampunan dalam perumpamaan
  choice: Menerjemahkan ἐχαρίσατο dengan ‘dibebaskan dari utang’ sesuai citra konkret perumpamaan.
  alternative: ‘lebih banyak diampuni’
  rationale: Konteks langsung berbicara tentang utang yang dilepaskan, sedangkan konteks lebih luas menghubungkannya dengan pengampunan dosa. Terjemahan utama mempertahankan metafora utang dan catatan kaki menyatakan kaitannya dengan pengampunan tanpa menyamakan keduanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. ‘Penilaianmu tepat’ dipilih sebagai ungkapan bermartabat dan alami. Nama ‘Yesus’ dipakai untuk memperjelas rujukan pronomina Yunani tanpa menambah klaim penafsiran.
