  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: id
  text: Dan berbahagialah orang yang tidak tersandung karena Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak tersinggung oleh Aku” atau “tidak jatuh karena Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: berbahagialah
  rationale: Bentuk ini alami dalam ucapan bahagia dan mempertahankan bobot religius μακάριος, bukan sekadar perasaan senang atau keberuntungan.
- source_word: ὃς
  choice: orang yang
  rationale: Ungkapan ini menerjemahkan kata relatif substantival secara wajar dalam bahasa Indonesia modern dan tetap mempertahankan acuan tunggal yang mewakili siapa saja.
- source_word: ἐὰν μὴ
  choice: tidak
  rationale: Dalam konstruksi ini, ἐὰν μή dengan bentuk subjungtif menyatakan syarat umum; bahasa Indonesia dapat menyampaikannya secara alami dengan negasi langsung.
- source_word: σκανδαλισθῇ
  choice: tersandung
  rationale: Pilihan ini mempertahankan metafora tersandung dalam verba pasif Yunani tanpa membatasinya pada rasa tersinggung; dalam bahasa Indonesia, bentuk ini secara idiomatis dapat menyatakan bahwa seseorang menemui batu sandungan.
- source_word: ἐν ἐμοί
  choice: karena Aku
  rationale: Dalam idiom ini, ἐν ἐμοί menunjukkan Yesus sebagai sebab atau alasan seseorang tersandung. 'Karena Aku' lebih jelas dan alami daripada 'di dalam Aku'.
theological_decisions:
- issue: Cakupan makna σκανδαλισθῇ dalam kaitannya dengan Yesus
  choice: Mempertahankan gambaran 'tersandung' dan membiarkan cakupannya mencakup penolakan atau kemunduran iman
  alternative: tidak tersinggung oleh Aku; tidak meninggalkan iman karena Aku
  rationale: Teks memperingatkan tentang respons negatif terhadap Yesus yang lebih dalam daripada sekadar perasaan tersinggung, tetapi tidak secara eksplisit membatasi akibatnya pada kemurtadan. Metafora 'tersandung' menjaga ketegangan itu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan 'berbahagialah orang yang' mengikuti corak ucapan bahagia yang sudah alami bagi pembaca Alkitab Indonesia, sedangkan 'karena Aku' menjelaskan hubungan sebab tanpa menghapus metafora utama.
