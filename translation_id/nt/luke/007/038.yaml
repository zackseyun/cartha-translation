id: LUK.7.38
reference: Luke 7:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: id
  text: Lalu, sambil menangis, perempuan itu berdiri di belakang Yesus dekat kaki-Nya. Ia mulai membasahi kaki Yesus dengan air matanya dan menyekanya dengan rambut kepalanya. Ia terus menciumi kaki Yesus[a] dan mengurapi kaki-Nya dengan minyak wangi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berulang kali mencium kaki Yesus”; kata kerja Yunani dan bentuk imperfeknya mengisyaratkan tindakan yang kuat atau berulang.
    reason: lexical_alternative
  - marker: b
    text: Atau “minyak harum” atau “salep wangi”; kata Yunani ini menunjuk pada minyak atau salep beraroma.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: berdiri
  rationale: Partisip aoris ini menjadi latar bagi tindakan berikutnya; bentuk sederhana "berdiri" alami dalam bahasa Indonesia.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: di belakang Yesus dekat kaki-Nya
  rationale: Mempertahankan unsur "di belakang" dan kedekatan pada kaki, serta sesuai dengan posisi Yesus yang sedang berbaring ketika makan.
- source_word: κλαίουσα
  choice: sambil menangis
  rationale: Partisip kini menunjukkan tangisan yang berlangsung bersamaan dengan tindakannya.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: mulai membasahi ... dengan air matanya
  rationale: Menjaga aspek permulaan dari ἤρξατο dan arti konkret βρέχειν tanpa melebihkan menjadi "mengguyur".
- source_word: ἐξέμασσεν
  choice: menyekanya
  rationale: Kata ini berarti menyeka atau mengeringkan dengan menyeka; "menyeka" mempertahankan tindakan tanpa terlalu menekankan hasil akhirnya.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: dengan rambut kepalanya
  rationale: Mengikuti ungkapan Yunani secara dekat dan tetap wajar dalam bahasa Indonesia.
- source_word: κατεφίλει
  choice: terus menciumi
  rationale: Bentuk imperfek dan verba majemuk ini menyiratkan tindakan yang berlangsung atau berulang; "terus menciumi" menyampaikan nuansa itu tanpa menambahkan penafsiran emosional.
- source_word: ἤλειφεν
  choice: mengurapinya
  rationale: Menunjukkan tindakan mengoleskan minyak yang sedang berlangsung dan mempertahankan istilah naratif-budaya yang lazim.
- source_word: τῷ μύρῳ
  choice: dengan minyak wangi
  rationale: μύρον menunjuk pada minyak atau salep beraroma; "minyak wangi" jelas, alami, dan tidak menyamakan bahannya dengan parfum modern berbasis alkohol.
theological_decisions:
- issue: Penggambaran tindakan perempuan terhadap kaki Yesus
  choice: Mempertahankan tindakan jasmani yang konkret dan berulang tanpa menambahkan penilaian rohani.
  alternative: Merangkum tindakannya sebagai ungkapan pengabdian atau melunakkan unsur menciumi kaki.
  rationale: Teks menggambarkan tindakan yang rendah hati dan sarat emosi, tetapi tidak secara eksplisit memberi tafsiran teologis dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam rangkaian tindakan yang panjang; penanda kaki-Nya tetap dihormati tanpa membuat struktur kalimat kaku.
