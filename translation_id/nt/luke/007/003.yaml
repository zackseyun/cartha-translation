  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: id
  text: Ketika mendengar tentang Yesus, ia mengutus para tua-tua orang Yahudi kepada-Nya untuk meminta agar Ia datang dan menyelamatkan budaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hambanya” atau “pelayannya.” Kata Yunani doulos dapat menunjuk kepada seorang budak atau hamba, bergantung pada konteks. Di sini “budak” dipilih untuk mempertahankan status terikat orang itu di bawah kuasa perwira.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Ketika mendengar
  rationale: Partisip aoris menyatakan keadaan yang mendahului tindakan utama. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: δὲ
  choice: —
  rationale: δέ merupakan penghubung ringan di sini; alur kalimat bahasa Indonesia sudah menyampaikan kaitannya tanpa perlu kata penghubung tersendiri.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: tentang Yesus
  rationale: περί dengan genitif berarti ‘tentang’ atau ‘mengenai’; ‘tentang Yesus’ merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: ia mengutus ... kepada-Nya
  rationale: ἀποστέλλω berarti mengutus, sedangkan orang-orang yang diutus disebut langsung sesudahnya. ‘Kepada-Nya’ merujuk kepada Yesus sesuai struktur wacana.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: beberapa tua-tua Yahudi
  rationale: πρεσβύτεροι menunjuk kepada para pemimpin yang diakui dalam masyarakat, bukan sekadar orang-orang lanjut usia. ‘Tua-tua Yahudi’ mempertahankan sebutan sosial-historis itu; ‘beberapa’ wajar karena nomina Yunani ini tidak memakai artikel.
- source_word: ἐρωτῶν αὐτὸν
  choice: untuk memohon
  rationale: Partisip ini menerangkan tujuan pengutusan dan dalam konteksnya menyatakan permintaan dengan hormat; ‘memohon’ lebih sesuai daripada sekadar ‘bertanya’.
- source_word: ὅπως ἐλθὼν
  choice: agar Yesus datang
  rationale: ὅπως dengan bentuk pengandaian menyatakan isi atau tujuan permohonan. Nama ‘Yesus’ diulangi agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: διασώσῃ
  choice: menyelamatkan
  rationale: διασῴζω dapat berarti menyelamatkan, melepaskan dari bahaya, mempertahankan hidup, atau dalam konteks tertentu menyembuhkan. ‘Menyelamatkan’ mempertahankan keluasan makna kata Yunani, sementara konteks penyakit menjelaskan jenis pertolongan yang dimaksud.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: budaknya
  rationale: δοῦλος dalam rumah tangga perwira ini menunjuk kepada orang yang berada dalam status perbudakan dan di bawah kuasanya. ‘Budak’ mempertahankan kenyataan sosial tersebut; alternatif tradisional dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks rumah tangga perwira
  choice: budak
  alternative: hamba; pelayan
  rationale: Konteks menunjukkan seorang anggota rumah tangga yang berada di bawah kuasa perwira, sehingga ‘budak’ paling jelas mempertahankan status terikat yang tersirat. ‘Hamba’ dapat dipahami lebih luas dan merupakan padanan tradisional, sedangkan ‘pelayan’ berisiko mengaburkan status sosialnya; karena itu alternatif dicatat tanpa meniadakan ambiguitas rentang makna δοῦλος.
- issue: Makna διασώσῃ dalam konteks penyakit
  choice: menyelamatkan
  alternative: menyembuhkan
  rationale: Walaupun konteks menunjukkan penyelamatan dari penyakit, verba Yunani lebih luas daripada istilah khusus untuk menyembuhkan. Pilihan ini mempertahankan keluasan leksikal dan tidak menambahkan makna keselamatan rohani yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Tua-tua Yahudi’ dipertahankan sebagai sebutan sosial-historis yang lazim dalam konteks Alkitab, sedangkan susunan kalimat dibuat alami. Huruf kapital pada ‘-Nya’ mengikuti konvensi hormat yang umum untuk rujukan kepada Yesus, tanpa menambahkan penafsiran pada isi ayat.
