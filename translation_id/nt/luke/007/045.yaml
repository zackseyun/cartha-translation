  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: id
  text: Engkau tidak memberi Aku ciuman[a], tetapi sejak Aku masuk, perempuan ini tidak berhenti menciumi kaki-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ciuman salam”; ciuman merupakan bentuk salam dan penerimaan tamu yang lazim.
    reason: cultural_note
  - marker: b
    text: 'Kata Yunaninya dapat menyiratkan ciuman yang penuh kasih atau berulang-ulang: “terus menciumi kaki-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: ciuman salam
  rationale: Dalam konteks penerimaan tamu, φίλημα menunjuk pada ciuman sebagai salam. Ungkapan ini alami dalam bahasa Indonesia dan memperjelas fungsi tindakan tanpa memasukkan penjelasan budaya yang panjang.
- source_word: μοι
  choice: Aku
  rationale: Pronomina datif menandai penerima tindakan. Susunan Indonesia yang alami ialah 'memberi Aku ciuman salam'.
- source_word: ἔδωκας
  choice: memberi
  rationale: δίδωμι secara langsung berarti 'memberi'; pilihan ini mempertahankan gambaran Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: αὕτη δὲ
  choice: tetapi ... perempuan ini
  rationale: αὕτη menunjuk secara kontras kepada perempuan yang hadir. 'Perempuan ini' mempertahankan daya tunjuk yang lebih eksplisit daripada sekadar 'dia'.
- source_word: ἀφ’ ἧς
  choice: sejak
  rationale: Gabungan preposisi dan pronomina relatif ini berfungsi temporal, yaitu 'sejak waktu ketika'; 'sejak' menyampaikannya secara ringkas dan alami.
- source_word: εἰσῆλθον
  choice: Aku masuk
  rationale: εἰσέρχομαι berarti masuk. Bentuk ini lugas dan cocok dengan konteks memasuki rumah.
- source_word: οὐ διέλιπεν
  choice: tidak berhenti
  rationale: διαλείπω berarti berhenti atau tidak melanjutkan. Dalam konteks ini, bentuk tersebut menggambarkan tindakan yang terus berlangsung sejak Yesus masuk hingga saat Ia berbicara.
- source_word: καταφιλοῦσά
  choice: menciumi
  rationale: καταφιλέω dapat menyiratkan ciuman yang penuh kasih atau berulang-ulang. Verba Indonesia 'menciumi' secara alami menyampaikan tindakan berulang itu.
- source_word: μου τοὺς πόδας
  choice: kaki-Ku
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal kolektif 'kaki' untuk sepasang kaki; sufiks '-Ku' mempertahankan pemilik orang pertama.
theological_decisions:
- issue: Makna budaya ciuman dalam penerimaan tamu
  choice: Memakai 'ciuman salam' dalam teks utama dan menjelaskan kebiasaan penerimaan tamu dalam catatan kaki.
  alternative: Memakai hanya 'ciuman' tanpa menyebut fungsi salam.
  rationale: Konteks dan idiom tindakan mendukung pengertian ciuman salam. Pilihan ini membuat kontras keramahan dapat dipahami pembaca Indonesia, sementara catatan kaki menjaga agar keterangan budaya tidak dibebankan seluruhnya pada teks.
- issue: Intensitas atau pengulangan pada καταφιλέω
  choice: Menerjemahkan dengan 'menciumi' dan memberi catatan tentang nuansa kasih atau pengulangan.
  alternative: Menerjemahkan secara lebih eksplisit sebagai 'terus-menerus mencium' atau 'melimpahi kaki-Ku dengan ciuman'.
  rationale: '''Menciumi'' mempertahankan nuansa berulang secara alami tanpa melebih-lebihkan intensitas yang dapat tersirat, tetapi tidak harus selalu dinyatakan secara maksimal.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal 'Engkau' dan kapitalisasi pronomina yang merujuk kepada Yesus. Diksi dibuat lugas dan bermartabat; 'menciumi' mempertahankan aspek berulang secara idiomatis.
