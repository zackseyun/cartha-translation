  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: id
  text: Namun, hikmat dibuktikan benar oleh semua anak-anaknya.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinyatakan benar” atau “terbukti benar.”
    reason: lexical_alternative
  - marker: b
    text: “Anak-anak” adalah metafora bagi orang-orang yang memperlihatkan kebenaran hikmat melalui tanggapan atau cara hidup mereka.
    reason: lexical_alternative
  - marker: c
    text: Matius 11:19 berbunyi, “hikmat dibuktikan benar oleh perbuatan-perbuatannya.”
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Dalam konteks ini καί mengantar kontras ringan dengan penolakan generasi yang sedang ditegur; 'Namun' menyampaikan fungsi wacananya secara alami tanpa memperkuat kontras secara berlebihan.
- source_word: ἐδικαιώθη
  choice: dibuktikan benar
  rationale: Bentuk pasif aoristus δικαιόω di sini menyatakan bahwa hikmat ditunjukkan atau diakui benar, bukan pembenaran forensik dalam arti khas Paulus. Ungkapan ini mempertahankan bentuk pasif dan jelas bagi pembaca modern.
- source_word: ἡ σοφία
  choice: hikmat
  rationale: '''Hikmat'' adalah padanan baku dan bermartabat untuk σοφία serta dapat mempertahankan penggambarannya sebagai sosok yang mempunyai anak.'
- source_word: ἀπὸ πάντων
  choice: oleh semua
  rationale: Dengan verba pasif, ἀπό dapat menyatakan pelaku atau sumber pembuktian. 'Oleh semua' paling alami dalam bahasa Indonesia dan mempertahankan cakupan πάντων.
- source_word: τῶν τέκνων αὐτῆς
  choice: anaknya
  rationale: τέκνα secara langsung berarti 'anak-anak'. Bentuk 'anaknya' mempertahankan metafora serta hubungan dengan hikmat tanpa menafsirkannya sebagai perbuatan atau hasil di dalam teks utama.
theological_decisions:
- issue: Makna 'anak-anak' hikmat
  choice: Metafora dipertahankan secara harfiah sebagai 'anaknya', yakni mereka yang melalui tanggapan atau cara hidupnya memperlihatkan kebenaran hikmat.
  alternative: Hasil atau buah hikmat; atau penyelarasan dengan 'perbuatan-perbuatannya' dalam Matius 11:19.
  rationale: Teks Yunani Lukas berbunyi τέκνων ('anak-anak'). Mempertahankan gambaran itu menghindari penyelesaian diam-diam atas ketegangan teologis dan tidak menyelaraskan Lukas dengan bacaan paralel dalam Matius.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Dibuktikan benar' dipilih karena lebih mudah dipahami daripada 'dibenarkan' dan menghindari kesan teknis tentang pembenaran, sedangkan 'anaknya' menjaga metafora asli. Semua penanda catatan kaki ditempatkan dalam teks utama.
