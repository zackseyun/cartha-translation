  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama “Yesus” dinyatakan pada klausa utama untuk memperjelas subjek yang tersirat dalam bentuk verba Yunani; kapitalisasi “-Nya” mengikuti kebiasaan umum penulisan rujukan kepada Yesus.
