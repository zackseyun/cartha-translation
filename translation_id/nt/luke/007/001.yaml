id: LUK.7.1
reference: Luke 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: id
  text: Setelah selesai menyampaikan semua perkataan-Nya kepada orang banyak,[a] Yesus masuk ke Kapernaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam pendengaran orang banyak,” yaitu agar orang banyak mendengarnya.
    reason: Ungkapan Yunani εἰς τὰς ἀκοὰς bersifat lebih konkret daripada terjemahan alami “kepada orang banyak.”
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Setelah
  rationale: Kata ini memperkenalkan urutan waktu dalam narasi. “Setelah” secara alami menunjukkan bahwa tindakan berbicara telah selesai sebelum Yesus masuk ke Kapernaum.
- source_word: ἐπλήρωσεν
  choice: selesai menyampaikan
  rationale: Dalam konstruksi dengan ῥήματα, verba ini berarti menuntaskan atau menyelesaikan perkataan. “Selesai menyampaikan” lebih wajar dalam bahasa Indonesia daripada padanan harfiah “memenuhi”.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: semua perkataan-Nya
  rationale: Pilihan ini mempertahankan unsur πάντα (“semua”), ῥήματα (“perkataan”), dan αὐτοῦ (“-Nya”) tanpa menggantinya dengan rujukan yang lebih umum seperti “semua hal itu”.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: kepada orang banyak
  rationale: Ungkapan harfiahnya berkaitan dengan pendengaran atau telinga orang-orang. Dalam bahasa Indonesia, “menyampaikan ... kepada orang banyak” secara alami menyatakan bahwa mereka mendengarnya, sementara catatan kaki mempertahankan bentuk ungkapan sumber.
- source_word: λαοῦ
  choice: orang banyak
  rationale: Dalam konteks ini λαός menunjuk secara kolektif kepada khalayak yang mendengarkan Yesus. “Orang banyak” lebih alami daripada “rakyat” dan tidak harus menyiratkan kerumunan yang gaduh.
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Padanan langsung dan alami untuk tindakan memasuki suatu tempat.
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang sudah baku dan dikenal dalam bahasa Indonesia.
theological_decisions: []
