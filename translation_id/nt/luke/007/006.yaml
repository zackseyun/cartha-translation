id: LUK.7.6
reference: Luke 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: id
  text: Lalu Yesus pergi bersama mereka. Ketika Ia sudah tidak jauh dari rumah itu, perwira itu mengutus sahabat-sahabatnya untuk berkata kepada-Nya, “Tuhan[a], janganlah bersusah payah, sebab aku tidak layak[b] untuk Engkau masuk ke bawah atap rumahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Kata Yunani κύριε dapat menjadi sapaan hormat dan juga dapat menyiratkan pengakuan atas kewibawaan Yesus.
    reason: alternative_reading
  - marker: b
    text: Atau “pantas” maupun “cukup cakap.” Kata Yunani ἱκανός dapat menyatakan kelayakan, kecakapan, atau kecukupan; di sini perkataan itu mengungkapkan kerendahan hati perwira di hadapan Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: pergi
  rationale: Bentuk imperfek menggambarkan Yesus yang sedang bergerak bersama mereka; “pergi” merupakan ungkapan naratif yang wajar dalam bahasa Indonesia.
- source_word: σὺν αὐτοῖς
  choice: bersama mereka
  rationale: Menyampaikan secara langsung makna penyertaan dalam frasa Yunani.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: ketika Ia sudah tidak jauh dari rumah itu
  rationale: Mempertahankan penanda waktu serta ungkapan negatif “tidak jauh” dari teks sumber tanpa mengubahnya menjadi sekadar “dekat”.
- source_word: ἔπεμψεν φίλους
  choice: mengutus sahabat-sahabatnya
  rationale: φίλους berarti orang-orang yang memiliki hubungan persahabatan; bentuk ulang menyatakan jamak secara alami, sedangkan akhiran -nya memperjelas hubungan mereka dengan perwira dari konteks sintaksis.
- source_word: ὁ ἑκατοντάρχης
  choice: perwira
  rationale: Dalam konteks Injil, istilah ini secara lazim menunjuk perwira yang mengepalai kira-kira seratus prajurit. “Perwira” alami bagi pembaca Indonesia dan tidak membebani kalimat utama dengan penjelasan pangkat.
- source_word: Κύριε
  choice: Tuhan
  rationale: Mempertahankan kemungkinan bahwa sapaan ini lebih dari sekadar kesopanan dan mengakui kewibawaan Yesus, tanpa meniadakan fungsi sapaan hormatnya.
- source_word: μὴ σκύλλου
  choice: janganlah merepotkan diri
  rationale: Ungkapan ini secara idiomatis meminta Yesus agar tidak bersusah payah; pilihan tersebut mempertahankan nada hormat perwira.
- source_word: ἱκανός εἰμι
  choice: aku tidak layak
  rationale: Dalam konteks kerendahan hati perwira, ἱκανός menyatakan kelayakan atau kepatutan, meskipun secara leksikal juga dapat berarti kecakapan atau kecukupan.
- source_word: ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς
  choice: menerima-Mu di bawah atap rumahku
  rationale: Menghasilkan bahasa Indonesia yang alami sambil mempertahankan citra “di bawah atap”; “menerima-Mu” menyatakan masuknya Yesus ke kediaman perwira sebagai tamu.
theological_decisions:
- issue: Makna κύριος sebagai sapaan langsung kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Sapaan Yunani dapat berfungsi sebagai penghormatan biasa, tetapi juga dapat menyiratkan pengakuan atas kewibawaan Yesus. “Tuhan” mempertahankan kemungkinan teologis itu, sementara catatan kaki menjaga ambiguitas pragmatisnya.
- issue: Nuansa ἱκανός dalam pernyataan perwira
  choice: tidak layak
  alternative: tidak pantas / tidak cukup cakap
  rationale: Konteks menonjolkan kerendahan hati dan ketidakpatutan sosial di hadapan Yesus. Namun, catatan kaki mengakui rentang makna kecukupan atau kecakapan agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital menurut kebiasaan luas penerbitan Alkitab Indonesia. “Di bawah atap rumahku” mempertahankan citra konkret teks sumber, sedangkan “menerima-Mu” menghindari susunan Indonesia yang kaku seperti “masuk ke bawah atapku.”
