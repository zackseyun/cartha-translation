base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: id
  text: Seorang budak milik seorang perwira[a] sedang sakit dan hampir mati; budak itu sangat dihargai oleh perwira itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan” atau “hamba”. Kata Yunani doulos dapat berarti “budak” atau “pelayan”, bergantung pada konteks. Di sini “budak” dipilih untuk mempertahankan hubungan terikat dan kepemilikan yang tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: seorang perwira memiliki
  rationale: Mengungkapkan hubungan kepemilikan dalam frasa genitif secara alami dalam bahasa Indonesia sekaligus mempertahankan ketidakpastian τινος melalui 'seorang'.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai peralihan naratif ringan; dalam bahasa Indonesia hubungan dengan konteks tetap alami tanpa kata penghubung eksplisit.
- source_word: δοῦλος
  choice: budak
  rationale: Dalam konteks rumah tangga abad pertama, kata ini menyatakan status terikat dan hubungan kepemilikan; 'pelayan' dapat mengaburkan unsur tersebut.
- source_word: κακῶς ἔχων
  choice: sedang sakit parah
  rationale: Ungkapan idiomatis ini berarti berada dalam keadaan buruk. Kedekatan dengan kematian mendukung 'sakit parah', yang alami dan jelas dalam bahasa Indonesia.
- source_word: ἤμελλεν τελευτᾶν
  choice: hampir mati
  rationale: Menyampaikan kematian yang sudah dekat secara ringkas dan idiomatis.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: Budak itu sangat berharga baginya
  rationale: ἔντιμος di sini menunjukkan bahwa sang perwira sangat menghargainya, tanpa harus menentukan apakah tekanannya terutama pada kasih sayang atau kehormatan.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks perbudakan rumah tangga
  choice: budak
  alternative: pelayan; hamba
  rationale: '''Budak'' mempertahankan status sosial terikat yang terkandung dalam konteks, sedangkan alternatif dicatat karena δοῦλος kadang dapat dipakai lebih luas untuk seorang pelayan.'
- issue: Makna ἔντιμος bagi hubungan sang perwira dengan budaknya
  choice: sangat berharga baginya
  alternative: sangat dihargainya; disayanginya
  rationale: Pilihan ini mempertahankan cakupan makna penghargaan atau keberhargaan tanpa mempersempitnya menjadi kasih sayang emosional semata.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kalimat Yunani dipecah menjadi dua agar rujukan pronomina jelas dan mudah dipahami pembaca umum.
