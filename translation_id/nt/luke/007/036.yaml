  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: id
  text: Salah seorang dari antara orang Farisi meminta kepada Yesus agar Ia makan bersamanya.[a] Setelah Yesus masuk ke rumah orang Farisi itu, Ia berbaring untuk makan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Yunani berbentuk imperfek dan dapat menyiratkan bahwa ia sedang atau berulang kali meminta kepada Yesus.
    reason: lexical_alternative
  - marker: b
    text: Pada jamuan resmi waktu itu, orang biasanya makan sambil berbaring menyamping dan bertumpu pada siku, bukan duduk tegak di kursi.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: mengundang
  rationale: Bentuk imperfek menunjukkan permintaan yang berlangsung dalam latar narasi, tetapi dalam konteks makan bersama, fungsi pragmatisnya adalah undangan. Bahasa Indonesia alami tidak lazim memakai bentuk progresif di sini.
- source_word: δέ
  choice: pun
  rationale: Partikel penghubung ringan ini diterjemahkan secara alami dalam alur narasi tanpa menambahkan penanda waktu seperti 'sekarang'.
- source_word: τις ... τῶν Φαρισαίων
  choice: seorang dari kalangan orang Farisi
  rationale: Menyampaikan konstruksi partitif, yakni satu orang yang termasuk kelompok orang Farisi.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: untuk makan bersamanya
  rationale: Menyampaikan tujuan permintaan secara langsung dan alami.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: masuk ke rumah orang Farisi itu
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; urutannya dipertahankan melalui susunan klausa.
- source_word: κατεκλίθη
  choice: berbaring untuk makan
  rationale: Menunjukkan posisi bersandar atau berbaring yang lazim pada jamuan resmi, bukan duduk tegak; frasa tujuan mencegah kesan bahwa Yesus sekadar berbaring untuk beristirahat.
