  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' digunakan sebagai pengganti pronomina yang rujukannya jelas agar alur ayat tetap mudah dipahami. 'Orang Farisi' mengikuti istilah baku Indonesia. Penanda catatan kaki ditempatkan tepat setelah klausa terkait.
