  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: id
  text: Karena itu, Aku berkata kepadamu, dosa-dosanya yang banyak itu sudah diampuni, karena ia sangat mengasihi.[a] Namun, orang yang sedikit diampuni, sedikit pula mengasihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "Karena itu, Aku berkata kepadamu, dosa-dosanya yang banyak itu sudah diampuni; karena itu ia sangat mengasihi." Kata Yunani yang diterjemahkan "karena" dapat dipahami sebagai penanda bahwa kasihnya menjadi bukti atau akibat dari keadaannya yang sudah diampuni, bukan sebagai penyebab ia memperoleh pengampunan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Karena itu
  rationale: Ungkapan penghubung kausal-inferensial ini diterjemahkan secara alami dan ringkas, dengan tetap menghubungkan pernyataan ini pada tindakan perempuan tersebut dan perumpamaan sebelumnya.
- source_word: ἀφέωνται
  choice: sudah diampuni
  rationale: Bentuk perfektif pasif menyatakan tindakan pengampunan yang telah terjadi dengan hasil yang tetap berlaku; 'sudah diampuni' menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: dosa-dosanya yang banyak itu
  rationale: Susunan ini mempertahankan penekanan Yunani pada banyaknya dosa perempuan tersebut serta rujukan kontekstual yang tertentu.
- source_word: ὅτι
  choice: karena
  rationale: Terjemahan kausal langsung mempertahankan ketegangan dalam ungkapan Yunani dan tidak diam-diam menggantinya dengan kesimpulan teologis tertentu.
- source_word: ἠγάπησεν πολύ
  choice: ia sangat mengasihi
  rationale: '''Sangat mengasihi'' merupakan ungkapan Indonesia yang alami bagi intensitas πολύ dan tetap memakai kosakata kasih. Pronomina ''ia'' sesuai dengan register bermartabat.'
- source_word: ᾧ δὲ
  choice: Namun, orang yang
  rationale: Konstruksi relatif tunggal ini bersifat umum dan tidak perlu diberi kekhususan gender; 'Namun' menandai kontras dengan jelas.
- source_word: ὀλίγον ἀφίεται
  choice: sedikit diampuni
  rationale: Mempertahankan nilai kuantitatif-adverbial ὀλίγον dan bentuk pasif kini dalam ungkapan Indonesia yang ringkas.
- source_word: ὀλίγον ἀγαπᾷ
  choice: sedikit pula mengasihi
  rationale: Menjaga kesejajaran dengan 'sedikit diampuni'; 'pula' memperjelas hubungan paralel dan bernada pepatah.
theological_decisions:
- issue: Apakah ὅτι ('karena') menjadikan kasih perempuan itu penyebab yang menghasilkan atau memperoleh pengampunan
  choice: Mempertahankan 'karena' dalam teks utama sambil memberi catatan bahwa kasih dapat dipahami sebagai bukti keadaan telah diampuni
  alternative: Menerjemahkan secara lebih interpretatif sebagai 'maka terbukti bahwa ia sangat mengasihi' atau mengubah hubungan itu menjadi akibat
  rationale: Bentuk Yunani menyatakan hubungan secara padat dan secara alami dapat dibaca kausal, sedangkan perumpamaan sebelumnya dan ayat 50 mendukung pemahaman bahwa pengampunan menghasilkan kasih. Terjemahan utama mempertahankan ketegangan tersebut, sementara catatan menunjukkan pembacaan evidensial tanpa menjadikannya satu-satunya tafsir.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Aku' mengikuti ujaran langsung Yesus; 'kepadamu' mempertahankan bentuk tunggal. Pengulangan 'sedikit ... sedikit pula' menjaga kesejajaran dan daya ungkap pepatah dalam teks Yunani.
