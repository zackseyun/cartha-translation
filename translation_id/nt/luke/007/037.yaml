revisions:
- from: Lihatlah, ada seorang perempuan di kota itu yang dikenal sebagai orang berdosa.[a] Ketika ia mengetahui bahwa Yesus sedang berbaring makan di rumah orang Farisi itu,[b] ia datang membawa sebuah buli-buli pualam berisi minyak wangi.[c]
  to: Lihatlah, ada seorang perempuan di kota itu yang adalah seorang berdosa.[a] Ketika ia mengetahui bahwa Yesus sedang makan sambil berbaring di rumah orang Farisi itu,[b] ia datang membawa sebuah botol alabaster berisi minyak wangi.[c]
  rationale: Revisi menghapus tambahan makna “dikenal sebagai,” mengganti bahan yang keliru “pualam” dengan “alabaster,” dan memperlancar pengungkapan postur makan tanpa mengubah makna. Penamaan Yesus dapat dipertahankan karena rujukan subjek tersirat jelas dari konteks langsung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:18Z'
review_pass:
  verdict: revise
  source_fidelity: Draf menambahkan nuansa reputasi melalui “yang dikenal sebagai,” padahal ἁμαρτωλός hanya menyatakan bahwa perempuan itu adalah seorang berdosa, tanpa menyatakan bahwa ia dikenal demikian. “Pualam” juga bukan padanan yang tepat untuk ἀλάβαστρον, yang menunjuk wadah alabaster. Terjemahan revisi mempertahankan ketidakjelasan mengenai jenis dosanya dan memperbaiki istilah wadah.
  naturalness: “Sedang berbaring makan” tidak lazim dalam bahasa Indonesia modern. “Sedang makan sambil berbaring” lebih alami serta tetap menyampaikan postur makan kuno. Susunan “seorang perempuan di kota itu yang adalah seorang berdosa” cukup jelas dan tidak menambahkan gagasan bahwa ia terkenal di kota itu.
  terminology: “Orang berdosa” tepat dan tidak mengidentifikasi perempuan itu sebagai pelacur. “Orang Farisi” dan “minyak wangi” sesuai. “Botol alabaster” adalah padanan modern yang jelas untuk wadah alabaster; catatan kaki menyediakan alternatif yang lebih dekat dengan istilah wadah kuno.
  issues:
  - severity: medium
    issue: “yang dikenal sebagai orang berdosa” menambahkan gagasan reputasi.
    rationale: Frasa Yunani ἁμαρτωλός menyebut perempuan itu “seorang berdosa,” tetapi tidak menyatakan bahwa ia dikenal atau bereputasi demikian.
  - severity: medium
    issue: “buli-buli pualam” menerjemahkan alabaster sebagai pualam.
    rationale: Alabaster dan pualam/marmer adalah bahan yang berbeda. Istilah “alabaster” sebaiknya dipertahankan.
  - severity: low
    issue: “sedang berbaring makan” kurang idiomatis.
    rationale: Ungkapan “sedang makan sambil berbaring” lebih alami sambil tetap mempertahankan makna κατάκειται dalam konteks jamuan.
  revised_text: Lihatlah, ada seorang perempuan di kota itu yang adalah seorang berdosa.[a] Ketika ia mengetahui bahwa Yesus sedang makan sambil berbaring di rumah orang Farisi itu,[b] ia datang membawa sebuah botol alabaster berisi minyak wangi.[c]
  revised_footnotes:
