id: LUK.7.37
reference: Luke 7:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: id
  text: Lihatlah, ada seorang perempuan di kota itu yang adalah seorang berdosa.[a] Ketika ia mengetahui bahwa Yesus sedang makan sambil berbaring di rumah orang Farisi itu,[b] ia datang membawa sebuah botol alabaster berisi minyak wangi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang adalah seorang berdosa.” Teks Yunani tidak menyebutkan dosa tertentu.
    reason: lexical_alternative
  - marker: b
    text: Orang biasanya makan sambil berbaring menyamping pada jamuan resmi pada masa itu.
    reason: cultural_note
  - marker: c
    text: Atau “sebuah buli-buli alabaster berisi minyak harum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang memperkenalkan tokoh secara hidup dan menarik perhatian pembaca.
- source_word: ἥτις ἦν ἐν τῇ πόλει ἁμαρτωλός
  choice: seorang perempuan di kota itu yang dikenal sebagai orang berdosa
  rationale: Mengungkapkan bahwa perempuan itu memiliki reputasi sebagai orang berdosa di kota tersebut, tanpa menentukan jenis dosanya.
- source_word: ἐπιγνοῦσα
  choice: ketika ia mengetahui
  rationale: Menyampaikan tindakan mengetahui yang mendahului tindakan utama dalam susunan yang alami dalam bahasa Indonesia.
- source_word: κατάκειται
  choice: sedang berbaring makan
  rationale: Menggambarkan posisi bersandar atau berbaring yang lazim dalam jamuan resmi pada masa itu, bukan sekadar duduk.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: rumah orang Farisi itu
  rationale: Bentuk posesif yang alami dan mempertahankan rujukan tentu kepada orang Farisi dalam konteks.
- source_word: κομίσασα
  choice: ia datang membawa
  rationale: Partisip ini menunjukkan bahwa benda tersebut dibawa serta ketika perempuan itu datang; ungkapan ini alami dan jelas.
- source_word: ἀλάβαστρον μύρου
  choice: sebuah buli-buli pualam berisi minyak wangi
  rationale: ἀλάβαστρον menunjuk wadah yang lazimnya dibuat dari alabaster, sedangkan μύρον adalah minyak atau salep harum. 'Buli-buli pualam' mempertahankan ciri wadah dalam bahasa Indonesia yang bermartabat.
theological_decisions:
- issue: Karakterisasi moral perempuan itu
  choice: orang berdosa
  alternative: perempuan sundal / perempuan yang hidup tidak bermoral
  rationale: Teks Yunani menyebutnya ἁμαρτωλός tanpa menjelaskan dosa tertentu. Terjemahan tidak menyisipkan anggapan tradisional bahwa ia seorang pelacur.
- issue: Identitas subjek tersirat dalam κατάκειται
  choice: Yesus
  alternative: ia/dia
  rationale: Bahasa Yunani memakai subjek tersirat yang dari konteks merujuk kepada Yesus. Penyebutan nama memperjelas rujukan secara alami dalam bahasa Indonesia tanpa mengubah identitas kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hidup dan bermartabat. 'Lihatlah' mempertahankan penekanan naratif; 'buli-buli pualam' mempertahankan warna historis, dengan padanan yang lebih transparan dalam catatan kaki.
