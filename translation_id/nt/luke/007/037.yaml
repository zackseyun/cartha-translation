    text: Orang biasanya makan sambil berbaring menyamping pada jamuan resmi pada masa itu.
    reason: cultural_note
  - marker: c
    text: Atau “sebuah buli-buli alabaster berisi minyak harum.”
    reason: lexical_alternative
  revision_rationale: Revisi menghapus tambahan makna “dikenal sebagai,” mengganti bahan yang keliru “pualam” dengan “alabaster,” dan memperlancar pengungkapan postur makan tanpa mengubah makna. Penamaan Yesus dapat dipertahankan karena rujukan subjek tersirat jelas dari konteks langsung.
