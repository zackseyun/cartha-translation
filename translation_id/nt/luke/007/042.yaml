  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: id
  text: Karena mereka tidak sanggup membayar, ia dengan murah hati menghapuskan utang kedua orang itu.[a] Jadi, siapakah di antara mereka yang akan lebih mengasihi dia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia mengampuni keduanya dengan murah hati.” Kata kerja Yunani ini dapat berarti memberikan dengan cuma-cuma atau menghapuskan apa yang wajib dibayar.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Karena mereka tidak mempunyai apa-apa untuk membayar kembali
  rationale: Genitivus absolutus menyatakan keadaan yang menjadi alasan tindakan berikutnya. Ungkapan ini secara alami menyampaikan bahwa kedua orang itu tidak memiliki sumber daya untuk melunasi utang.
- source_word: ἀμφοτέροις
  choice: keduanya
  rationale: Kata ini merujuk secara jelas kepada kedua orang yang berutang.
- source_word: ἐχαρίσατο
  choice: dengan murah hati membebaskan utang
  rationale: Dalam konteks utang, verba ini berarti merelakan atau menghapus kewajiban pembayaran, sekaligus mengandung nuansa pemberian cuma-cuma atau kemurahan hati.
- source_word: τίς οὖν αὐτῶν
  choice: Jadi, siapakah di antara mereka
  rationale: οὖν menandai kesimpulan dari tindakan sang pemberi pinjaman; 'Jadi' menyampaikan hubungan logis itu dengan wajar.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: yang akan lebih mengasihi dia
  rationale: Terjemahan ini mempertahankan bentuk futurum dan perbandingan kadar kasih dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna χαρίζομαι dalam perumpamaan tentang utang dan pengampunan
  choice: dengan murah hati membebaskan utang keduanya
  alternative: mengampuni keduanya dengan murah hati
  rationale: Konteks langsungnya adalah kewajiban finansial, sehingga 'membebaskan utang' memperjelas objek tersirat tanpa menghilangkan nuansa kemurahan hati. Catatan kaki mempertahankan alternatif 'mengampuni', yang menghubungkan perumpamaan ini dengan tema pengampunan dalam konteks yang lebih luas tanpa memaksakannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Mengasihi' dipilih untuk mempertahankan hubungan leksikal dengan ἀγαπάω, sedangkan 'membebaskan utang' menjaga gambaran finansial perumpamaan.
