  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: id
  text: Lalu mereka semua dicekam ketakutan[a], dan mereka memuliakan Allah sambil berkata, “Seorang nabi besar telah bangkit di tengah kita[b], dan Allah telah melawat umat-Nya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipenuhi rasa gentar.” Kata Yunaninya dapat mencakup ketakutan yang disertai kekaguman.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah dibangkitkan di tengah kita,” yang dapat menonjolkan tindakan Allah menghadirkan seorang nabi.
    reason: lexical_alternative
  - marker: c
    text: “Melawat” merupakan bahasa alkitabiah untuk Allah yang datang kepada umat-Nya dengan perhatian dan kepedulian yang nyata.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν δὲ φόβος πάντας
  choice: Lalu mereka semua dicekam ketakutan
  rationale: Ungkapan ini mempertahankan φόβος sebagai ketakutan yang tiba-tiba menguasai semua orang. “Lalu” menghubungkan respons ini secara wajar dengan peristiwa sebelumnya tanpa memberi tekanan berlebihan pada δέ.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: terus memuliakan Allah
  rationale: “Terus” menyampaikan aspek imperfektum, sedangkan “memuliakan” mempertahankan hubungan leksikal dengan δοξάζω tanpa mempersempitnya menjadi sekadar memuji.
- source_word: λέγοντες
  choice: Mereka berkata
  rationale: Kalimat baru menghasilkan bahasa Indonesia yang alami sambil tetap memperkenalkan isi tindakan mereka memuliakan Allah.
- source_word: Προφήτης μέγας
  choice: Seorang nabi besar
  rationale: Padanan langsung, alami, dan mempertahankan penilaian μέγας.
- source_word: ἠγέρθη
  choice: telah bangkit
  rationale: Pilihan ini mempertahankan citra ἐγείρω dan dapat dipahami sebagai tampilnya seorang nabi, tanpa secara eksplisit menetapkan pelaku pasif yang tidak disebutkan dalam teks.
- source_word: ἐν ἡμῖν
  choice: di tengah-tengah kita
  rationale: Padanan komunal yang alami dan sedikit lebih jelas daripada “di dalam kita”.
- source_word: Ἐπεσκέψατο
  choice: telah melawat
  rationale: “Melawat” mempertahankan bahasa alkitabiah tentang Allah yang datang dengan perhatian dan tindakan, tanpa langsung mempersempit maknanya menjadi “menolong” atau “menyelamatkan”.
- source_word: τὸν λαὸν αὐτοῦ
  choice: umat-Nya
  rationale: “Umat-Nya” alami dalam konteks hubungan Allah dengan umat milik-Nya dan mempertahankan gema perjanjian.
theological_decisions:
- issue: Makna φόβος sesudah mukjizat
  choice: ketakutan
  alternative: rasa takjub
  rationale: “Ketakutan” mempertahankan kekuatan kata φόβος dan ketegangan antara rasa takut dan kekaguman yang khidmat; konteks membiarkan pembaca memahami nuansanya.
- issue: Makna ἠγέρθη mengenai seorang nabi
  choice: telah bangkit
  alternative: telah dibangkitkan
  rationale: “Telah bangkit” alami dalam bahasa Indonesia dan tidak memaksakan penyebutan pelaku, sedangkan bentuk pasif yang mungkin menyiratkan tindakan Allah dicatat sebagai alternatif.
- issue: Makna Ἐπεσκέψατο sebagai tindakan Allah
  choice: telah melawat umat-Nya
  alternative: telah datang menolong umat-Nya
  rationale: Bahasa “melawat” mempertahankan keluasan makna kunjungan ilahi yang penuh perhatian dan dapat mencakup pertolongan serta tindakan penyelamatan tanpa membatasi teks pada satu penjelasan.
- issue: Hubungan dua klausa ὅτι ... καὶ ὅτι
  choice: satu kutipan yang terdiri atas dua pernyataan sejajar
  alternative: dua kutipan terpisah
  rationale: Kedua klausa merupakan isi dari λέγοντες dan paling alami dibaca sebagai satu ucapan berkesinambungan, sementara pengulangan ὅτι tetap tercermin melalui penghubung “dan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Dicekam ketakutan” mempertahankan daya ungkapan Yunani; “terus memuliakan” menyampaikan aspek berlangsung; “melawat” sengaja dipertahankan sebagai istilah alkitabiah dan dijelaskan melalui catatan kaki.
