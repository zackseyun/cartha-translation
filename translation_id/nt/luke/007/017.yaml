  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: id
  text: Lalu kabar tentang Dia ini tersebar di seluruh Yudea dan di seluruh daerah sekitarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berita tentang Dia” atau “perkataan tentang Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: tersebar
  rationale: Secara harfiah berarti “keluar”, tetapi bersama ὁ λόγος οὗτος ungkapan ini secara alami menyatakan bahwa suatu kabar beredar atau tersebar.
- source_word: ὁ λόγος οὗτος
  choice: kabar ... ini
  rationale: Dalam konteks ini λόγος menunjuk pada kabar atau laporan mengenai Yesus dan perbuatan-Nya, bukan satu kata atau ucapan tertentu.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: ke seluruh Yudea
  rationale: Kata depan ἐν dalam konteks penyebaran dapat menyatakan jangkauan; “ke seluruh Yudea” alami dalam bahasa Indonesia dan selaras dengan verba “tersebar”.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: περί dengan genitif berarti “tentang” atau “mengenai”; huruf kapital pada “Dia” mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: seluruh daerah sekitarnya
  rationale: περίχωρος sebagai nomina menunjuk kepada wilayah atau daerah di sekitar Yudea; pilihan ini jelas dan wajar bagi pembaca modern.
- source_word: καὶ ... καὶ
  choice: dan ... dan
  rationale: Pengulangan καί menghubungkan dua cakupan geografis secara kumulatif dan dipertahankan dengan koordinasi sederhana.
