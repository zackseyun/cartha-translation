  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' menjaga kelancaran narasi; 'rumah ibadat' dipilih agar langsung dipahami pembaca umum tanpa menghilangkan latar Yahudinya. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
