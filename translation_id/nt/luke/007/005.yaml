base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: id
  text: Sebab ia mengasihi bangsa kita dan ia sendiri telah membangun sinagoge itu bagi kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyuruh membangun sinagoge itu bagi kita.” Bahasa Yunani hanya mengatakan “membangun”; ini dapat berarti bahwa ia terlibat langsung atau bahwa ia membiayai pembangunan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: mengasihi
  rationale: Menyampaikan kekuatan makna ἀγαπάω secara lugas dan bermartabat, bukan sekadar menyukai atau bersimpati.
- source_word: γὰρ
  choice: Sebab
  rationale: Menandai bahwa kalimat ini memberikan alasan bagi permohonan para tua-tua dalam ayat sebelumnya.
- source_word: τὸ ἔθνος ἡμῶν
  choice: bangsa kita
  rationale: Mencerminkan acuan kepada komunitas Yahudi sebagai suatu bangsa atau kelompok etnis, sekaligus mempertahankan bentuk posesif.
- source_word: τὴν συναγωγήν
  choice: rumah ibadat itu
  rationale: Dalam konteks Yahudi, 'rumah ibadat' merupakan padanan Indonesia yang alami dan mudah dipahami untuk συναγωγή; kata 'itu' mencerminkan artikel tertentu dan menunjuk pada rumah ibadat setempat yang sudah dikenal.
- source_word: αὐτός
  choice: ia sendiri
  rationale: Mempertahankan penekanan eksplisit pada subjek, yaitu perwira itu sendiri sebagai pihak yang bertanggung jawab atas pembangunan atau pembiayaannya.
- source_word: ᾠκοδόμησεν
  choice: membangun
  rationale: Menerjemahkan verba Yunani secara langsung tanpa memastikan apakah ia mengerjakannya secara pribadi atau menjadi penyandang dana/pelindung pembangunan.
- source_word: ἡμῖν
  choice: bagi kita
  rationale: 'Menampilkan datif keuntungan: rumah ibadat tersebut dibangun untuk kepentingan komunitas mereka.'
