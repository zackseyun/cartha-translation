  naturalness: Bahasanya modern, jelas, dan wajar. “Murid-murid Yohanes memberi tahu dia” dapat dipahami tanpa ketaksaan dalam konteks langsung, sedangkan “dua orang dari antara murid-muridnya” jelas dan sesuai register naratif.
  terminology: “Yohanes” dan “murid-murid” merupakan istilah baku dan konsisten untuk nama serta μαθηταί dalam konteks Injil. Tidak ada istilah teologis yang memerlukan penyesuaian.
