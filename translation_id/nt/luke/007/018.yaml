lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: memberi tahu
  rationale: Verba ini berarti menyampaikan kabar atau melaporkan. Dalam konteks narasi ini, 'memberi tahu' alami dan tetap menyatakan bahwa para murid meneruskan informasi kepada Yohanes.
- source_word: Ἰωάννῃ
  choice: Yohanes
  rationale: Bentuk datif menandai penerima laporan. Nama Ἰωάννης secara baku ditransliterasikan sebagai 'Yohanes' dalam bahasa Indonesia.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid Yohanes
  rationale: Acuan pronomina diperjelas secara alami sebagai Yohanes untuk menghindari ketaksaan dalam bahasa Indonesia; μαθηταί mempertahankan relasi guru-pengikut melalui istilah baku 'murid-murid'.
- source_word: περὶ πάντων τούτων
  choice: tentang semua hal itu
  rationale: Pilihan ini mempertahankan preposisi περὶ, cakupan menyeluruh πάντων, dan daya tunjuk τούτων.
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Partisip aoristus medium menunjukkan tindakan Yohanes memanggil orang-orang yang dipilihnya; 'memanggil' alami tanpa menambahkan arah 'datang kepadanya' yang tidak dinyatakan eksplisit.
- source_word: δύο τινὰς
  choice: dua orang
  rationale: τινάς memberi nuansa tidak tentu pada dua orang yang dipilih. Dalam bahasa Indonesia, 'dua orang dari antara' menyampaikan pilihan dari kelompok tanpa ungkapan kaku 'dua orang tertentu'.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: dari antara murid-muridnya
  rationale: 'Genitif ini bersifat partitif: dua orang dipilih dari kelompok murid Yohanes. ''Dari antara'' menyatakan hubungan itu secara jelas.'
- source_word: ὁ Ἰωάννης
  choice: Yohanes
  rationale: Subjek yang diulang dalam bahasa Yunani dipertahankan sebagai nama Yohanes pada awal klausa kedua demi kejelasan.
