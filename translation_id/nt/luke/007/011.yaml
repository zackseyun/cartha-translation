  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: id
  text: Keesokan harinya[a], Yesus pergi ke sebuah kota bernama Nain. Murid-murid-Nya dan kerumunan besar ikut berjalan bersama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Tidak lama kemudian” sebagai ganti “Keesokan harinya”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: tidak diterjemahkan sebagai ungkapan tersendiri
  rationale: Dalam konstruksi Καὶ ἐγένετο ἐν τῷ ἑξῆς, ἐγένετο berfungsi sebagai pembuka narasi khas Lukas. Menerjemahkannya secara harfiah sebagai “terjadilah” akan terasa kaku; fungsi naratifnya sudah tersampaikan oleh “Tidak lama kemudian”.
- source_word: ἐν τῷ ἑξῆς
  choice: tidak lama kemudian
  rationale: Dalam bentuk yang tercantum pada SBLGNT, ungkapan ini menunjuk pada waktu sesudah peristiwa sebelumnya tanpa memastikan bahwa itu tepat keesokan harinya. Pilihan ini mempertahankan ketidakpastian waktunya dan sesuai dengan idiom Indonesia modern.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: Bentuk ini menyatakan gerak menuju suatu tempat; “pergi” merupakan padanan naratif Indonesia yang paling wajar.
- source_word: εἰς πόλιν
  choice: ke sebuah kota
  rationale: εἰς menyatakan arah menuju, sedangkan πόλις dapat menunjuk pada kota atau permukiman. “Kota” mempertahankan kategori umum dalam teks tanpa menambahkan penilaian modern tentang ukuran Nain.
- source_word: καλουμένην Ναΐν
  choice: bernama Nain
  rationale: “Bernama” adalah ungkapan Indonesia yang alami untuk partisip pasif καλουμένην, dan Nain dipertahankan sebagai transliterasi nama tempat.
- source_word: συνεπορεύοντο
  choice: ikut berjalan bersama-Nya
  rationale: Bentuk imperfek menggambarkan tindakan menyertai yang sedang berlangsung. “Ikut berjalan bersama” mempertahankan unsur gerak dan penyertaan.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Ini adalah padanan baku dan alami bagi frasa posesif tersebut. Huruf kapital pada enklitik -Nya mengikuti kebiasaan bahasa Indonesia dalam teks Kitab Suci ketika mengacu kepada Yesus.
- source_word: ὄχλος πολύς
  choice: kerumunan besar
  rationale: ὄχλος menunjuk pada kerumunan orang, dan πολύς menyatakan besarnya kerumunan itu. Pilihan ini ringkas dan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Subjek tersirat pada ἐπορεύθη
  choice: Yesus
  alternative: Ia
  rationale: Bahasa Yunani membiarkan subjek tersirat karena jelas dari konteks sebelumnya. Menyebut “Yesus” menghasilkan bahasa Indonesia yang alami dan jelas tanpa mengubah rujukannya.
- issue: Penentuan waktu peristiwa
  choice: tidak lama kemudian
  alternative: keesokan harinya
  rationale: Teks SBLGNT memakai ἐν τῷ ἑξῆς, yang tidak mewajibkan arti “keesokan harinya”. Bacaan naskah lain yang lebih tegas menunjuk pada hari berikutnya dicatat dalam catatan kaki agar varian tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur naratif Yunani dilancarkan tanpa menghilangkan urutan waktu, gerak menuju Nain, atau besarnya kerumunan. Kapitalisasi “-Nya” mengikuti konvensi umum penerjemahan Alkitab bahasa Indonesia.
