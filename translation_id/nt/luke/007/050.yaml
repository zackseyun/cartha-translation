  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani dengan akurat: δέ sebagai kelanjutan naratif (“Lalu”), alamat kepada perempuan itu, πίστις sebagai “iman,” perfek σέσωκέν σε sebagai “telah menyelamatkanmu,” serta idiom pelepasan εἰς εἰρήνην sebagai “dalam damai.” Penambahan nama “Yesus” memperjelas subjek yang tersirat dari konteks tanpa mengubah makna.'
