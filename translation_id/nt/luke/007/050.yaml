base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: id
  text: Lalu Yesus berkata kepada perempuan itu, “Imanmu telah menyelamatkanmu; pergilah dalam damai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk aoristus dari λέγω paling wajar diterjemahkan sebagai tindakan ujaran sederhana, yaitu “berkata”.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan narasi tanpa pertentangan yang kuat; “lalu” alami dalam bahasa Indonesia dan mempertahankan alur peristiwa.
- source_word: πρὸς τὴν γυναῖκα
  choice: kepada perempuan itu
  rationale: γυνή di sini menunjuk kepada perempuan yang hadir dalam adegan, bukan kepada seorang istri; artikel tertentu tercermin dalam “itu”.
- source_word: Ἡ πίστις σου
  choice: Imanmu
  rationale: πίστις dalam konteks ini menunjuk pada kepercayaan perempuan itu kepada Yesus. “Imanmu” merupakan ungkapan Indonesia yang alami dan lazim tanpa mengubahnya menjadi kesetiaan.
- source_word: σέσωκέν σε
  choice: telah menyelamatkanmu
  rationale: Bentuk perfek σῴζω menyatakan tindakan yang telah terjadi dengan hasil yang tetap. Dalam konteks pengampunan dosa, “menyelamatkanmu” lebih tepat daripada pengertian penyembuhan jasmani.
- source_word: πορεύου
  choice: pergilah
  rationale: Imperatif πορεύομαι secara alami diterjemahkan “pergilah”, dengan partikel -lah yang sesuai bagi perintah atau pelepasan yang bermartabat.
- source_word: εἰς εἰρήνην
  choice: dalam damai
  rationale: Walaupun εἰς secara harfiah dapat berarti “ke dalam”, frasa ini merupakan ungkapan idiomatis pelepasan; “dalam damai” alami dan mempertahankan gagasan keadaan damai yang menyertai kepergiannya.
theological_decisions:
- issue: Makna σῴζω dalam kaitannya dengan pengampunan dan keselamatan
  choice: telah menyelamatkanmu
  alternative: telah menyembuhkanmu; telah membuatmu pulih
  rationale: Konteks Lukas 7:36–50 berpusat pada pengampunan dosa dan tanggapan iman perempuan itu, bukan pada kesembuhan jasmani. Pilihan ini mempertahankan bobot keselamatan dari ungkapan tersebut tanpa menjelaskan mekanismenya melampaui teks.
- issue: Makna πίστις
  choice: Imanmu
  alternative: Kepercayaanmu; kesetiaanmu
  rationale: Dalam konteks ini πίστις paling wajar menunjuk pada kepercayaan kepada Yesus. “Kesetiaan” secara leksikal mungkin dalam konteks lain, tetapi kurang mungkin di sini.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, bermartabat, dan mudah dipahami. Nama “Yesus” dipakai untuk memperjelas subjek tersirat dalam verba Yunani sesuai konteks, sementara kalimat langsung tetap padat dan dekat dengan susunan sumber.
