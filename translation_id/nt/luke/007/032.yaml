  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: id
  text: 'Mereka seperti anak-anak yang duduk di pasar dan saling berseru[a]: ‘Kami memainkan seruling untuk kalian, tetapi kalian tidak menari; kami menyanyikan ratapan[b], tetapi kalian tidak menangis.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “saling memanggil.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “meratap.” Kata Yunani ini dapat berarti melantunkan ratapan, termasuk ratapan kematian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Mereka seperti
  rationale: Ungkapan perbandingan yang alami dalam bahasa Indonesia dan langsung memperkenalkan perumpamaan.
- source_word: παιδίοις
  choice: anak-anak
  rationale: Menunjuk secara umum kepada anak-anak tanpa membatasi jenis kelamin atau usia secara berlebihan.
- source_word: ἐν ἀγορᾷ
  choice: di pasar
  rationale: ἀγορά adalah ruang pasar atau lapangan umum; 'di pasar' paling wajar dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: καθημένοις
  choice: yang duduk
  rationale: Mempertahankan keterangan postur dalam bentuk yang alami.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: saling berseru
  rationale: Menyampaikan tindakan memanggil dengan suara kepada satu sama lain dan mempertahankan makna timbal balik ἀλλήλοις.
- source_word: ἃ λέγει
  choice: '[dilanjutkan langsung dengan perkataan yang dikutip]'
  rationale: Konstruksi Yunani memiliki varian atau kejanggalan gramatikal kolektif; tanda titik dua memperkenalkan ucapan secara alami tanpa membebani teks Indonesia dengan frasa yang kaku.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Kami meniup seruling untuk kalian
  rationale: αὐλέω secara khusus berarti memainkan alat tiup seperti seruling; ungkapan ini jelas dan konkret bagi pembaca modern.
- source_word: οὐκ ὠρχήσασθε
  choice: kalian tidak menari
  rationale: Padanan langsung dan alami yang mempertahankan tindakan konkret dalam gambaran perumpamaan.
- source_word: ἐθρηνήσαμεν
  choice: kami menyanyikan ratapan
  rationale: θρηνέω dapat menunjuk pada melantunkan nyanyian ratapan; pilihan ini mempertahankan unsur pertunjukan yang berlawanan dengan permainan seruling.
- source_word: οὐκ ἐκλαύσατε
  choice: kalian tidak menangis
  rationale: κλαίω berarti menangis atau meratap; 'menangis' jelas, umum, dan tidak menyamakan kata ini dengan θρηνέω sebelumnya.
theological_decisions:
- issue: Mempertahankan daya perumpamaan dari dua permainan anak yang berlawanan tanpa menafsirkan penerapannya
  choice: 'Menggunakan tindakan konkret: meniup seruling, menari, menyanyikan ratapan, dan menangis'
  alternative: Menggunakan istilah interpretatif seperti bersukacita dan berkabung
  rationale: Ayat ini menyajikan gambaran analogis. Bahasa konkret menjaga ketegangan dan membiarkan penerapannya dijelaskan oleh konteks, bukan dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata ganti 'kalian' dipakai karena ὑμῖν dan bentuk-bentuk verba yang menyertainya jamak; pilihan ini juga cocok dengan percakapan antarkelompok anak.
