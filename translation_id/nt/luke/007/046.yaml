  verdict: approve
  source_fidelity: Terjemahan mempertahankan kontras eksplisit antara “engkau” dan “perempuan ini,” serta membedakan ἐλαίῳ (“minyak”) dari μύρῳ (“minyak wangi”). Kedua bentuk aoris ἤλειψας dan ἤλειψεν diterjemahkan secara wajar dengan “mengurapi”; bahasa Indonesia tidak menuntut penandaan waktu lampau dalam bentuk verba ini. “Kepala-Ku” dan “kaki-Ku” menerjemahkan objek dan posesif Yunani dengan tepat.
  naturalness: Kalimat ini baku, jelas, dan bernada wajar untuk ujaran langsung Yesus dalam bahasa Indonesia modern. “Tetapi perempuan ini” secara alami mempertahankan penunjukan tegas αὕτη dan kontrasnya dengan “Engkau.”
  terminology: “Mengurapi” sesuai dengan ἀλείφω dalam konteks pemberian minyak sebagai penghormatan kepada tamu, tanpa harus menyatakan penahbisan ritual. “Minyak wangi” merupakan padanan yang lazim dan cukup luas untuk μύρον. Kapitalisasi pronomina “-Ku” konsisten dengan konvensi Alkitab bahasa Indonesia dan tidak mengubah makna sumber.
