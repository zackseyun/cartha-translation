id: LUK.7.46
reference: Luke 7:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: id
  text: Engkau tidak mengurapi kepala-Ku dengan minyak, tetapi perempuan ini mengurapi kaki-Ku dengan minyak wangi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “minyak harum” atau “salep wangi” untuk “minyak wangi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: dengan minyak
  rationale: Bentuk datif menyatakan sarana. 'Minyak' merupakan padanan alami dan tidak menambahkan kekhususan 'minyak zaitun' yang tidak diperlukan dalam konteks.
- source_word: ἤλειψας / ἤλειψεν
  choice: mengurapi
  rationale: Kata ἀλείφω berarti mengoleskan atau mengurapi dengan minyak maupun minyak wangi. 'Mengurapi' mempertahankan kesejajaran kedua klausa dan cocok dengan tindakan penghormatan kepada tamu tanpa menyatakan bahwa ini upacara penahbisan.
- source_word: κεφαλήν μου
  choice: kepala-Ku
  rationale: Padanan langsung untuk objek akusatif beserta pronomina posesif; huruf kapital mengikuti konvensi bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: αὕτη δὲ
  choice: tetapi perempuan ini
  rationale: αὕτη menunjuk secara tegas kepada perempuan yang hadir. 'Perempuan ini' mempertahankan daya tunjuk dan memperjelas kontras dengan 'engkau'.
- source_word: μύρῳ
  choice: dengan minyak wangi
  rationale: μύρον menunjuk pada minyak atau salep beraroma. 'Minyak wangi' alami dalam bahasa Indonesia dan mempertahankan kontras dengan minyak biasa pada klausa pertama.
- source_word: τοὺς πόδας μου
  choice: kaki-Ku
  rationale: Padanan langsung dan idiomatis dalam bahasa Indonesia; kata 'kaki' tidak perlu diberi penanda jamak karena konteks tubuh sudah memadai.
theological_decisions:
- issue: Kontras penghormatan sosial dalam teguran Yesus
  choice: Kontras antara kelalaian tuan rumah dan penghormatan luar biasa dari perempuan itu dinyatakan secara lugas.
  alternative: Memakai ungkapan yang lebih seremonial sehingga menyiratkan penahbisan resmi atau makna sakramental.
  rationale: Konteks terdekat menyoroti keramahtamahan dan penghormatan. Kata 'mengurapi' tepat secara leksikal, tetapi susunan kalimat tidak menambahkan penafsiran teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk 'Engkau' mempertahankan sapaan tunggal yang tegas dalam kontras antara Simon dan perempuan itu. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
