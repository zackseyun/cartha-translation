id: LUK.7.8
reference: Luke 7:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: id
  text: Sebab aku pun seorang yang ditempatkan di bawah wewenang, dengan prajurit di bawahku. Aku berkata kepada yang seorang, ‘Pergilah!’ dan ia pergi; kepada yang lain, ‘Datanglah!’ dan ia datang; dan kepada budakku[a], ‘Lakukan ini!’ dan ia melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayanku”. Kata Yunani doulos menunjuk kepada orang yang berada dalam status terikat atau dimiliki sebagai budak, meskipun dalam beberapa konteks dapat diterjemahkan lebih umum sebagai “pelayan”.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ ἐγὼ
  choice: Sebab aku sendiri juga
  rationale: γάρ memperkenalkan alasan bagi perkataan sebelumnya, sedangkan καί dan pronomina eksplisit ἐγώ memberi tekanan komparatif pada diri perwira itu. Ungkapan ini mempertahankan hubungan penjelas dan penekanannya secara wajar dalam bahasa Indonesia.
- source_word: ἄνθρωπός εἰμι
  choice: adalah orang
  rationale: ἄνθρωπος menunjuk kepada manusia dalam kedudukan biasa. 'Orang' alami dalam bahasa Indonesia dan tidak perlu menambahkan unsur yang tidak dinyatakan oleh teks.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: ditempatkan di bawah wewenang
  rationale: Bentuk pasif τασσόμενος menyatakan bahwa ia ditempatkan atau ditetapkan dalam suatu susunan hierarkis. 'Wewenang' menyampaikan ἐξουσία sebagai otoritas yang sah, khususnya dalam rantai komando.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: aku mempunyai prajurit-prajurit di bawahku
  rationale: Terjemahan ini mempertahankan partisip ἔχων dan gambaran hierarkis ὑπ’ ἐμαυτόν tanpa mempersempitnya menjadi parafrasa 'di bawah komandoku'.
- source_word: λέγω τούτῳ
  choice: Aku berkata kepada yang seorang
  rationale: τούτῳ bersifat demonstratif. 'Yang seorang' terdengar alami dalam pasangan bahasa Indonesia 'yang seorang ... yang lain' dan tetap mempertahankan pola contoh yang kontras.
- source_word: Πορεύθητι ... πορεύεται
  choice: ‘Pergilah!’ dan ia pergi
  rationale: Perintah dan respons diterjemahkan secara langsung, dengan paralelisme Yunani tetap terjaga.
- source_word: ἄλλῳ· Ἔρχου ... ἔρχεται
  choice: kepada yang lain, ‘Datanglah!’ dan ia datang
  rationale: '''Yang lain'' menerjemahkan ἄλλῳ secara idiomatis, sedangkan bentuk perintah dan pelaksanaannya dipertahankan sejajar.'
- source_word: τῷ δούλῳ μου
  choice: kepada budakku
  rationale: δοῦλος pada konteks rumah tangga kuno menunjuk orang dalam status terikat atau dimiliki. Karena hubungan ketundukan penting dalam ilustrasi ini, 'budak' lebih tepat daripada istilah yang lebih umum 'pelayan'; alternatif itu dicatat dalam catatan kaki.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘Lakukan ini!’ dan ia melakukannya
  rationale: Pilihan ini mempertahankan perintah langsung serta respons langsung dalam bentuk Indonesia yang alami.
theological_decisions:
- issue: Makna δοῦλος dalam gambaran rantai wewenang
  choice: budak
  alternative: pelayan
  rationale: Ayat ini tidak mengajarkan pembenaran teologis atas perbudakan, tetapi status bawahan dalam analogi perwira memang penting. 'Budak' mempertahankan realitas sosial dan kekuatan istilah Yunani, sementara 'pelayan' tetap dicatat sebagai kemungkinan yang lebih umum menurut konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan pola perintah dan pelaksanaan dipertahankan untuk menjaga ritme retoris ayat serta penekanan pada wewenang yang diterima dan dijalankan.
