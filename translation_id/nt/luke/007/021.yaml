id: LUK.7.21
reference: Luke 7:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: id
  text: Pada saat itu[a] Ia menyembuhkan banyak orang dari penyakit, penderitaan berat[b], dan roh-roh jahat. Ia juga mengaruniakan penglihatan kepada banyak orang buta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Pada saat itu juga.” Ungkapan Yunani ini dapat menekankan bahwa tindakan tersebut berlangsung tepat pada waktu itu.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “penderitaan berat” secara harfiah dapat berarti “cambuk”, dan secara kiasan dapat menunjuk pada siksaan atau penyakit yang berat.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “mengaruniakan untuk melihat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Pada saat itu
  rationale: Mempertahankan keterangan waktu yang khusus dalam bahasa Indonesia yang alami; kemungkinan penekanan pada saat yang persis sama dicatat dalam catatan kaki.
- source_word: ἐθεράπευσεν
  choice: Ia menyembuhkan
  rationale: Padanan langsung dan alami bagi tindakan penyembuhan dalam konteks pelayanan Yesus.
- source_word: πολλοὺς
  choice: banyak orang
  rationale: Nomina yang tersirat dinyatakan agar kalimat Indonesia jelas dan alami tanpa membatasi jenis kelamin.
- source_word: ἀπὸ νόσων
  choice: dari penyakit
  rationale: ἀπό menyatakan pelepasan dari keadaan yang diderita; bentuk ini alami sesudah 'menyembuhkan'.
- source_word: μαστίγων
  choice: penderitaan berat
  rationale: Kata ini secara harfiah dapat berarti cambuk, tetapi secara kiasan menunjuk pada penderitaan jasmani yang parah; pilihan ini menyampaikan maknanya tanpa menimbulkan kesan bahwa yang dimaksud selalu hukuman cambuk secara harfiah.
- source_word: πνευμάτων πονηρῶν
  choice: roh-roh jahat
  rationale: Menerjemahkan πονηρῶν secara langsung sebagai 'jahat' dan mempertahankan rujukan teks kepada roh-roh sebagai realitas spiritual.
- source_word: τυφλοῖς πολλοῖς
  choice: kepada banyak orang buta
  rationale: Menunjukkan penerima tindakan dan tidak menambahkan pembatasan jenis kelamin yang tidak terdapat dalam bahasa Yunani.
- source_word: ἐχαρίσατο
  choice: mengaruniakan
  rationale: Menjaga nuansa pemberian yang murah hati atau penuh anugerah dalam χαρίζομαι.
- source_word: βλέπειν
  choice: penglihatan
  rationale: Ungkapan nominal ini alami setelah 'mengaruniakan' dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hakikat tindakan Yesus terhadap orang-orang yang mengalami πνεύματα πονηρά
  choice: Mempertahankan ungkapan 'roh-roh jahat' sebagai rujukan spiritual yang nyata dalam narasi.
  alternative: Menafsirkan roh-roh jahat hanya sebagai kiasan bagi penyakit jasmani atau gangguan mental.
  rationale: Bahasa Yunani secara langsung menyebut roh-roh jahat. Terjemahan tidak mereduksinya menjadi penyakit, tetapi juga tidak menambahkan rincian seperti kerasukan atau tata cara pengusiran yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pronomina 'Ia' dipakai untuk Yesus sesuai konteks, dan struktur Yunani dipertahankan sejauh tetap wajar dalam bahasa Indonesia.
