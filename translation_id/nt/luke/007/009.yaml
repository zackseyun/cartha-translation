source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: id
  text: Ketika Yesus mendengar semua itu, Ia takjub kepada orang itu. Ia berpaling kepada orang banyak yang mengikuti-Nya, lalu berkata, “Aku berkata kepadamu, bahkan di Israel pun Aku belum pernah menemukan iman sebesar ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Ketika Yesus mendengar hal-hal itu
  rationale: Partisip aoris menyatakan keadaan yang mendahului verba utama; δέ berfungsi sebagai peralihan naratif ringan dan tidak perlu diterjemahkan secara tersendiri.
- source_word: ἐθαύμασεν αὐτόν
  choice: Ia kagum kepada orang itu
  rationale: θαυμάζω menyatakan rasa kagum atau takjub; pronomina αὐτόν merujuk kepada perwira itu, yang hadir dalam kisah melalui para utusannya.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: Lalu Ia berpaling kepada orang banyak yang mengikuti-Nya
  rationale: Partisip aoris στραφείς diterjemahkan sebagai tindakan berikutnya dalam alur narasi, sedangkan partisip kini ἀκολουθοῦντι mempertahankan tindakan yang sedang berlangsung.
- source_word: Λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Rumusan wacana langsung ini dipertahankan secara dekat dan tetap wajar dalam bahasa Indonesia yang bermartabat.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: bahkan di Israel pun belum pernah
  rationale: οὐδέ memberi penekanan ‘bahkan ... pun tidak’; bersama εὗρον, bentuk ‘belum pernah’ menyampaikan pengalaman sampai saat pernyataan itu.
- source_word: τοσαύτην πίστιν
  choice: iman sebesar ini
  rationale: τοσαύτην menunjukkan tingkat atau besarnya iman; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan teks Yunani.
- source_word: εὗρον
  choice: Aku menemukan
  rationale: Aoris menyatakan tindakan menemukan; dalam konstruksi negatif dengan penekanan pengalaman hingga saat itu, maknanya disampaikan secara alami melalui ‘belum pernah ... menemukan’.
theological_decisions:
- issue: Terjemahan πίστις
  choice: iman
  alternative: kepercayaan; keyakinan
  rationale: Dalam konteks ini πίστις menunjuk pada keyakinan penuh sang perwira terhadap kewenangan Yesus. ‘Iman’ adalah padanan baku dan tidak mempersempit makna menjadi kesetiaan sebagai sifat.
- issue: Yesus kagum kepada αὐτόν meskipun perwira tidak hadir langsung
  choice: orang itu
  alternative: perwira itu
  rationale: Pronomina Yunani dipertahankan tanpa menjelaskan mekanisme perwakilan para utusan; referennya jelas dari konteks dan ketegangan naratif tidak perlu diselaraskan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Tidak ada catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini dan catatan kaki Inggris yang diberikan tampaknya tidak selaras penempatannya dengan teks.
