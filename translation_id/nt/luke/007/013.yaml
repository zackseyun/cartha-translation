id: LUK.7.13
reference: Luke 7:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: id
  text: Ketika Tuhan melihat perempuan itu, Ia tergerak oleh belas kasihan kepadanya lalu berkata, “Jangan menangis.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami sebagai “Berhentilah menangis.” Bahasa Yunani dapat menyatakan larangan secara umum atau menyuruh perempuan itu menghentikan ratapannya yang sedang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika ... melihat
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Klausa waktu dengan “ketika” alami dalam bahasa Indonesia dan tetap menunjukkan urutan tindakan.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Dalam narasi Lukas, κύριος berfungsi sebagai gelar bagi Yesus. “Tuhan” mempertahankan bobot kristologisnya tanpa mereduksinya menjadi sekadar “tuan” atau “majikan”.
- source_word: ἐσπλαγχνίσθη
  choice: tergerak oleh belas kasihan
  rationale: Verba ini menyatakan belas kasihan yang mendalam dan menggugah batin. Ungkapan ini mempertahankan daya afektifnya serta terdengar alami dan bermartabat.
- source_word: ἐπ’ αὐτῇ
  choice: kepadanya
  rationale: Dengan σπλαγχνίζομαι, ἐπί dengan datif menunjuk kepada orang yang menjadi sasaran belas kasihan. “Kepadanya” menyampaikan arah belas kasihan itu secara ringkas.
- source_word: εἶπεν αὐτῇ
  choice: berkata ... kepadanya
  rationale: Terjemahan ini dekat dengan makna biasa λέγω dan tidak menambahkan kesan perintah yang lebih luas daripada ucapan yang dicatat.
- source_word: Μὴ κλαῖε
  choice: Jangan menangis
  rationale: Bentuk imperatif kini dengan μή dapat berupa larangan umum ataupun perintah untuk menghentikan tindakan yang sedang berlangsung. “Jangan menangis” mempertahankan kedua kemungkinan itu lebih baik daripada “Berhentilah menangis.”
theological_decisions:
- issue: κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: tuan
  rationale: Pemakaian narator dalam Lukas mendukung pembacaan κύριος sebagai gelar kristologis. “Tuhan” mempertahankan hal itu tanpa menambahkan klaim di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Perempuan itu” memperjelas rujukan pronomina αὐτήν berdasarkan konteks langsung. Pronomina “Ia” mengikuti konvensi hormat bahasa Indonesia untuk Yesus; susunan kalimat tetap mengalir tanpa menghilangkan hubungan antarklausa dalam teks Yunani.
