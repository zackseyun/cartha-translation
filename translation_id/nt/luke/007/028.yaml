id: LUK.7.28
reference: Luke 7:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: id
  text: Aku berkata kepadamu[a], di antara semua orang yang dilahirkan oleh perempuan[b], tidak ada seorang pun yang lebih besar daripada Yohanes. Namun, yang paling kecil dalam Kerajaan Allah[c] lebih besar daripada dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku mengatakan kepadamu.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dilahirkan oleh perempuan” merujuk kepada manusia pada umumnya.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan, “orang yang paling kecil dalam Kerajaan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Menerjemahkan formula wacana ini secara langsung dan wajar, sekaligus mempertahankan bentuk kala kini serta nada pernyataan yang tegas.
- source_word: μείζων
  choice: lebih besar
  rationale: Mempertahankan makna komparatif tanpa menentukan apakah kebesaran itu menyangkut kedudukan, hak istimewa, atau kualitas tertentu.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: di antara mereka yang dilahirkan oleh perempuan
  rationale: Mempertahankan ungkapan sumber yang merujuk kepada manusia pada umumnya dengan bentuk yang jelas dalam bahasa Indonesia.
- source_word: Ἰωάννου
  choice: Yohanes
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: οὐδείς ἐστιν
  choice: tidak ada seorang pun
  rationale: Ungkapan eksistensial yang alami dalam bahasa Indonesia dan sesuai dengan cakupan negatif teks Yunani.
- source_word: ὁ δὲ μικρότερος
  choice: Namun, yang paling kecil
  rationale: Artikel dan bentuk komparatif berfungsi sebagai nomina. Dalam konteks perbandingan kelompok, 'yang paling kecil' menyampaikan nilai superlatif idiomatis tanpa menjelaskan dasar peringkat tersebut.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dalam Kerajaan Allah
  rationale: Mempertahankan frasa alkitabiah yang lazim dan nuansa lokatif ἐν.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: lebih besar daripada dia
  rationale: Menyatakan perbandingan dengan Yohanes secara alami sambil tetap tidak menentukan segi kebesaran yang dimaksud.
theological_decisions:
- issue: Dasar perbandingan antara Yohanes dan yang paling kecil dalam Kerajaan Allah
  choice: Mempertahankan perbandingan paradoksal tanpa menjelaskan dasar 'lebih besar'.
  alternative: Menafsirkannya secara khusus sebagai kedudukan sejarah penebusan, hak istimewa perjanjian, kualitas moral-rohani, atau retorika kehormatan.
  rationale: Teks Yunani menyatakan perbandingan tetapi tidak menerangkan dalam segi apa orang tersebut lebih besar; terjemahan tidak boleh memaksakan penyelesaian teologis tertentu.
- issue: Rujukan ὁ μικρότερος
  choice: yang paling kecil dalam Kerajaan Allah
  alternative: orang yang lebih kecil/lebih muda dalam Kerajaan Allah
  rationale: Konstruksi berartikel ini menunjuk kepada seseorang dalam kelompok dan secara idiomatis dapat menyatakan anggota yang paling kecil; makna ukuran, status, atau kepentingannya tetap tidak diperinci.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kata ganti 'Aku' dan 'kepadamu' mempertahankan tuturan langsung; kapitalisasi 'Kerajaan Allah' mengikuti kelaziman istilah alkitabiah Indonesia. Semua penanda catatan kaki ditempatkan pada unsur teks yang dijelaskan.
