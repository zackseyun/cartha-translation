  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: id
  text: Ia mengutus mereka kepada Tuhan dengan pesan ini, “Apakah Engkau Dia yang akan datang[a], atau haruskah kami menantikan orang lain?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia yang datang.” Ungkapan Yunani ini dapat dibaca secara lebih deskriptif, tetapi dalam konteks ini kemungkinan berfungsi sebagai sebutan mesianik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Ia mengutus mereka
  rationale: Bentuk aoristus πέμπω menyatakan tindakan lampau dalam narasi. Bahasa Indonesia lazim memerlukan objek; konteks ayat sebelumnya menunjukkan bahwa yang diutus ialah dua murid Yohanes.
- source_word: πρὸς τὸν κύριον
  choice: kepada Tuhan
  rationale: πρός dengan akusatif menyatakan arah kepada seseorang. κύριος diterjemahkan “Tuhan,” mempertahankan gelar naratif bagi Yesus beserta bobot kristologisnya.
- source_word: λέγων
  choice: untuk bertanya
  rationale: Partisipium ini memperkenalkan isi pesan. Karena isi berikutnya berupa pertanyaan, “untuk bertanya” merupakan ungkapan Indonesia yang alami tanpa mengubah fungsi pesannya.
- source_word: Σὺ εἶ
  choice: Apakah Engkau
  rationale: Walaupun secara bentuk berarti “Engkau adalah,” konteks disjungtif menjadikannya pertanyaan. “Engkau” mempertahankan sapaan langsung yang hormat.
- source_word: ὁ ἐρχόμενος
  choice: Dia yang akan datang
  rationale: Partisipium substantival berartikel ini dapat bersifat deskriptif sekaligus berfungsi sebagai sebutan mesianik. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan kedua nuansa itu.
- source_word: ἢ
  choice: atau
  rationale: Konjungsi disjungtif yang memperkenalkan pilihan kedua.
- source_word: ἄλλον
  choice: orang lain
  rationale: Kata sifat substantival ini menunjuk kepada pribadi lain; “orang lain” lebih alami dan jelas daripada hanya “yang lain.”
- source_word: προσδοκῶμεν
  choice: haruskah kami menantikan
  rationale: Bentuk kini orang pertama jamak menyatakan pengharapan yang berkelanjutan dalam pertanyaan deliberatif. “Menantikan” mencakup unsur menunggu dengan harapan.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: tuan
  rationale: Dalam narasi Lukas, κύριος adalah gelar hormat yang juga memiliki bobot kristologis. “Tuan” akan melemahkan kemungkinan makna tersebut.
- issue: Apakah ὁ ἐρχόμενος harus diperlakukan sebagai gelar mesianik atau deskripsi
  choice: Dia yang akan datang
  alternative: Sang Datang
  rationale: Ungkapan ini kemungkinan berfungsi sebagai sebutan mesianik, tetapi bentuk Yunaninya juga tetap deskriptif. “Dia yang akan datang” menjaga ketegangan itu dan terdengar lebih alami daripada gelar nominal yang dipaksakan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi “Engkau” dan “Dia” menandai sapaan serta sebutan khusus bagi Yesus tanpa menjadikan ungkapan Yunani itu lebih eksplisit daripada sumbernya.
