  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: id
  text: 'Herodes menambahkan juga kejahatan ini[a] kepada segala kejahatannya yang lain: ia mengurung Yohanes di penjara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Ia menambahkan juga hal ini pada semuanya.” Maksudnya, Herodes menambahkan tindakan ini kepada segala kejahatannya yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: menambahkan
  rationale: Kata kerja ini menyatakan bahwa Herodes menambah satu tindakan lagi pada rangkaian tindakan sebelumnya; bentuk ini mempertahankan gambaran kumulatif teks Yunani.
- source_word: τοῦτο
  choice: kejahatan ini
  rationale: Secara harfiah berarti 'ini', tetapi konteks langsung menyebut segala kejahatan Herodes. Penambahan 'kejahatan' membuat acuannya jelas dan tetap mengikuti konteks sumber.
- source_word: ἐπὶ πᾶσιν
  choice: pada semua kejahatannya yang lain
  rationale: Ungkapan ini bermakna 'di atas/di samping semuanya', yakni sebagai tambahan pada semua kejahatan yang baru disebutkan. Terjemahan ini menyampaikan daya kumulatifnya secara alami dalam bahasa Indonesia.
- source_word: κατέκλεισεν
  choice: mengurung
  rationale: Kata ini berarti menutup atau menahan seseorang di dalam suatu tempat. 'Mengurung' mempertahankan nuansa konkret tanpa mengulang makna 'penjara'.
- source_word: Ἰωάννην
  choice: Yohanes
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: ἐν φυλακῇ
  choice: di dalam penjara
  rationale: Dalam konteks ini φυλακή menunjuk pada tempat penahanan; frasa Indonesia ini alami dan tepat.
theological_decisions:
- issue: Acuan dan daya ungkapan ἐπὶ πᾶσιν
  choice: Tindakan memenjarakan Yohanes ditambahkan pada semua kejahatan Herodes yang lain.
  alternative: 'Terjemahan yang lebih harfiah: ''Ia menambahkan juga hal ini pada semuanya.'''
  rationale: Konteks ayat 19–20 membicarakan segala kejahatan Herodes, lalu menyebut pemenjaraan Yohanes sebagai tambahan. Teks utama memperjelas hubungan itu tanpa menambahkan penilaian teologis di luar konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kumulatif teks Yunani dipertahankan, sementara acuan implisitnya diperjelas berdasarkan konteks langsung.
