  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: id
  text: Dan semua manusia[a] akan melihat keselamatan Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua daging.” Ungkapan ini menggemakan Yesaya 40:5 dan di sini berarti seluruh umat manusia.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “keselamatan dari Allah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: akan melihat
  rationale: Bentuk mendatang dari ὁράω ini menyatakan tindakan melihat secara lugas. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan gambaran konkret dalam bahasa Yunani.
- source_word: πᾶσα σὰρξ
  choice: semua manusia
  rationale: Secara harfiah frasa ini berarti 'semua daging', tetapi sebagai ungkapan Semitis-profetis yang menggemakan Yesaya 40:5, maksudnya ialah seluruh umat manusia. 'Semua manusia' menyampaikan maknanya secara alami; bentuk harfiahnya dicatat dalam catatan kaki untuk mempertahankan kaitan antarteks.
- source_word: σωτήριον
  choice: keselamatan
  rationale: Kata ini dipakai sebagai nomina dengan artikel. 'Keselamatan' merupakan padanan langsung dan lazim yang tetap mencakup keluasan karya penyelamatan Allah.
- source_word: τοῦ θεοῦ
  choice: dari Allah
  rationale: Genitif Yunani dapat menyatakan sumber atau kepunyaan. Dalam bahasa Indonesia, 'keselamatan dari Allah' paling alami dan dengan jelas menyatakan bahwa Allah adalah sumbernya, sementara kemungkinan 'keselamatan Allah' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Cakupan ungkapan πᾶσα σὰρξ
  choice: Seluruh umat manusia akan melihat keselamatan dari Allah.
  alternative: Mempertahankan ungkapan harfiah 'semua daging', yang dapat terdengar mengacu pada makhluk jasmani secara lebih luas.
  rationale: Dalam konteks kutipan Yesaya, ungkapan ini menunjuk secara universal kepada manusia. Terjemahan utama menyampaikan maksud itu tanpa membatasi cakupan universalnya, sedangkan catatan kaki mempertahankan bentuk dan gema profetisnya.
- issue: Hubungan genitif dalam τοῦ θεοῦ
  choice: 'Allah dipahami sebagai sumber keselamatan: ''keselamatan dari Allah''.'
  alternative: '''Keselamatan Allah'', yang dapat menyatakan kepunyaan atau hubungan yang lebih umum.'
  rationale: Konstruksi Yunani tidak memerinci hubungan genitif secara mutlak. Teks utama memakai ungkapan Indonesia yang alami, dan catatan kaki menjaga alternatif yang lebih formal agar ambiguitas sumber/kepunyaan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Semua manusia' dipilih daripada bentuk harfiah 'semua daging' karena bentuk harfiah tidak idiomatis dalam bahasa Indonesia; gema teks sumber dipertahankan melalui catatan kaki.
