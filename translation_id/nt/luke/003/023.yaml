revisions:
- from: Yesus sendiri, ketika mulai berkarya,[a] berumur kira-kira tiga puluh tahun. Menurut anggapan orang, ia adalah anak Yusuf,[b] anak Eli.[c]
  to: Yesus sendiri, ketika ia mulai, berumur kira-kira tiga puluh tahun. Menurut anggapan orang, ia adalah anak Yusuf. Yusuf adalah anak Eli.[a]
  rationale: Revisi menghapus tambahan “berkarya,” tetapi mempertahankan elipsis sumber melalui “ketika ia mulai.” Susunan silsilah dipecah menjadi kalimat yang jelas supaya “Eli” dipahami sebagai mata silsilah setelah Yusuf, bukan sebagai ayah Yesus. Kualifikasi “Menurut anggapan orang” tetap membatasi pernyataan tentang Yesus sebagai anak Yusuf sesuai ὡς ἐνομίζετο. Catatan yang tersisa menjelaskan bentuk eliptis Yunani tanpa mengusulkan harmonisasi genealogis.
