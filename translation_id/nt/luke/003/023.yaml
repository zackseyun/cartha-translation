id: LUK.3.23
reference: Luke 3:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: id
  text: Yesus sendiri, ketika ia mulai, berumur kira-kira tiga puluh tahun. Menurut anggapan orang, ia adalah anak Yusuf. Yusuf adalah anak Eli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Yunani berbunyi, “Yusuf, dari Eli.” Dalam bentuk ringkas silsilah ini, rangkaian tersebut meneruskan garis dari Yusuf kepada Eli.
    reason: source_syntax
lexical_decisions:
- source_word: Καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, pembukaan dengan 'dan' di sini terasa kurang alami. Kesinambungan narasi tetap jelas tanpa konjungsi eksplisit.
- source_word: αὐτὸς Ἰησοῦς
  choice: Yesus sendiri
  rationale: Mempertahankan penekanan pada Yesus yang dinyatakan oleh αὐτός.
- source_word: ἀρχόμενος
  choice: ketika mulai berkarya
  rationale: Konteks menunjuk pada awal kegiatan Yesus di muka umum. 'Berkarya' membuat ungkapan eliptis ini wajar dalam bahasa Indonesia tanpa secara sempit menambahkan kata 'pelayanan'; catatan kaki menjaga ketidaktersuratan objek verba dalam bahasa Yunani.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: berumur kira-kira tiga puluh tahun
  rationale: Ungkapan usia Indonesia yang alami dan tetap mempertahankan unsur perkiraan dari ὡσεὶ.
- source_word: ὡς ἐνομίζετο
  choice: Menurut anggapan orang
  rationale: Menunjukkan bahwa hubungan anak dengan Yusuf merupakan pandangan umum, bukan penegasan biologis oleh narator.
- source_word: υἱός ... Ἰωσὴφ τοῦ Ἠλὶ
  choice: anak Yusuf, anak Eli
  rationale: Mengungkapkan rantai silsilah genitif secara alami dalam bahasa Indonesia. 'Anak Eli' secara konvensional menerangkan Yusuf, tetapi sintaksis Yunani yang ringkas diberi catatan.
theological_decisions:
- issue: Hubungan frasa ὡς ἐνομίζετο dengan status Yesus sebagai anak Yusuf
  choice: Menurut anggapan orang, ia adalah anak Yusuf
  alternative: ia adalah anak Yusuf, sebagaimana disangka orang
  rationale: Susunan ini menjelaskan bahwa yang dianggap orang ialah status Yesus sebagai anak Yusuf, sambil tidak menentukan lebih jauh sifat sosial, hukum, atau biologis hubungan itu.
- issue: Apakah objek ἀρχόμενος perlu dinyatakan
  choice: ketika mulai berkarya, dengan catatan bahwa objek tidak disebutkan
  alternative: ketika memulai pelayanan-Nya
  rationale: Konteks mengarah pada awal karya Yesus di muka umum, tetapi teks Yunani tidak menyebut 'pelayanan'. Pilihan utama dibuat alami, sedangkan catatan mempertahankan batas bukti sumber.
- issue: Relasi Yusuf dan Eli dalam rantai silsilah
  choice: anak Eli, sebagai kelanjutan silsilah yang secara wajar menerangkan Yusuf
  alternative: keturunan Eli / dari Eli
  rationale: τοῦ Ἠλί merupakan mata berikutnya dalam rantai genitif silsilah. Terjemahan tidak mencoba menyelesaikan pertanyaan harmonisasi genealogis yang tidak dijelaskan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kalimat dipecah menjadi dua untuk keterbacaan. Huruf kecil pada pronomina 'ia' mengikuti kaidah umum bahasa Indonesia dan tidak menambahkan penandaan devosional yang tidak terdapat dalam sumber.
