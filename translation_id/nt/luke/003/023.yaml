review_pass:
  verdict: revise
  source_fidelity: Terjemahan usia dan kualifikasi bahwa Yesus dianggap sebagai anak Yusuf pada dasarnya tepat. Namun, “ketika mulai berkarya” menambahkan objek/kegiatan yang tidak dinyatakan oleh ἀρχόμενος. Selain itu, “ia adalah anak Yusuf, anak Eli” dalam bahasa Indonesia dapat terbaca seolah-olah Yesus adalah anak dari kedua nama itu, sedangkan rantai genitif Yunani meneruskan dari Yusuf kepada Eli.
  naturalness: Bahasa draft umumnya baku dan alami. “Ketika ia mulai” tetap eliptis seperti bahasa Yunani, tetapi lebih lengkap dan wajar daripada “ketika mulai”; catatan kaki dapat menjelaskan bahwa objek verba tidak disebutkan. Kalimat silsilah perlu diperjelas agar relasi Yusuf dan Eli tidak rancu.
  terminology: “Yesus sendiri,” “berumur kira-kira tiga puluh tahun,” dan “menurut anggapan orang” sesuai dengan penekanan, perkiraan usia, dan jarak naratorial dalam teks Yunani. Istilah “anak” cocok untuk bentuk silsilah, asalkan hubungan Yusuf dengan Eli dinyatakan dengan jelas.
  issues:
  - severity: medium
    issue: “ketika mulai berkarya” menambahkan “berkarya.”
    rationale: Partisip ἀρχόμενος berarti “mulai/sedang memulai” dan tidak menyebutkan objeknya. Konteks memang menunjuk pada awal kegiatan publik Yesus, tetapi teks utama sebaiknya tidak memasukkan kegiatan tersebut.
  - severity: medium
    issue: “ia adalah anak Yusuf, anak Eli” berpotensi salah melekatkan “anak Eli.”
    rationale: Dalam bahasa Indonesia, dua frasa “anak” yang berurutan dapat dipahami sebagai predikasi bagi Yesus. Dalam rantai silsilah Yunani, τοῦ Ἠλί meneruskan identifikasi Yusuf; teks Indonesia perlu menandai hal ini tanpa menafsirkan persoalan genealogis di luar ayat.
  revised_text: Yesus sendiri, ketika ia mulai, berumur kira-kira tiga puluh tahun. Menurut anggapan orang, ia adalah anak Yusuf. Yusuf adalah anak Eli.[a]
  revised_footnotes:
  - marker: a
    text: Secara harfiah, teks Yunani berbunyi, “Yusuf, dari Eli.” Dalam bentuk ringkas silsilah ini, rangkaian tersebut meneruskan garis dari Yusuf kepada Eli.
    reason: source_syntax
  revision_rationale: Revisi menghapus tambahan “berkarya,” tetapi mempertahankan elipsis sumber melalui “ketika ia mulai.” Susunan silsilah dipecah menjadi kalimat yang jelas supaya “Eli” dipahami sebagai mata silsilah setelah Yusuf, bukan sebagai ayah Yesus. Kualifikasi “Menurut anggapan orang” tetap membatasi pernyataan tentang Yesus sebagai anak Yusuf sesuai ὡς ἐνομίζετο. Catatan yang tersisa menjelaskan bentuk eliptis Yunani tanpa mengusulkan harmonisasi genealogis.
