id: LUK.3.21
reference: Luke 3:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: id
  text: Ketika seluruh rakyat dibaptis dan Yesus juga telah dibaptis serta sedang berdoa, langit terbuka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: terjadilah bahwa
  rationale: Mempertahankan rumusan naratif Lukas dan gerak wacana δέ secara alami tanpa menambahkan kata waktu seperti “sekarang”.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: Ketika seluruh rakyat dibaptis
  rationale: Konstruksi infinitif berartikel dengan ἐν berfungsi temporal; “ketika” alami dalam bahasa Indonesia. “Seluruh rakyat” menggambarkan λαός sebagai keseluruhan komunitas, bukan sekadar kerumunan.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: dan Yesus juga sudah dibaptis
  rationale: “Juga” menyatakan daya aditif καί, sedangkan “sudah” menunjukkan bahwa pembaptisan Yesus mendahului tindakan-Nya yang sedang berdoa dan terbukanya langit.
- source_word: καὶ προσευχομένου
  choice: dan sedang berdoa
  rationale: “Sedang” menyampaikan tindakan berkelanjutan yang berlangsung ketika peristiwa utama terjadi.
- source_word: ἀνεῳχθῆναι
  choice: terbuka
  rationale: Menyampaikan bentuk pasif tanpa memperkuatnya menjadi “terbelah,” yang merupakan gambaran lebih keras daripada kata sumber di sini.
- source_word: τὸν οὐρανὸν
  choice: langit
  rationale: Bahasa Indonesia memakai “langit” secara alami baik untuk cakrawala maupun ranah surgawi; konteks pewahyuan mempertahankan nuansa ilahi tanpa harus memakai ungkapan yang kurang idiomatis.
theological_decisions:
- issue: Makna οὐρανός dalam peristiwa baptisan
  choice: langit
  alternative: surga
  rationale: “Langit” merupakan padanan Indonesia yang alami dan tetap dapat menunjuk pada ranah ilahi dalam konteks turunnya Roh dan suara dari atas. Pilihan ini mempertahankan keluasan makna οὐρανός dan tidak memaksakan pembedaan antara langit yang terlihat dan surga.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa dibuat wajar bagi pembaca umum sambil mempertahankan hubungan temporal: pembaptisan telah berlangsung, Yesus sedang berdoa, lalu langit terbuka. Tanda koma akhir dipertahankan karena ayat berlanjut ke kalimat berikutnya.'
