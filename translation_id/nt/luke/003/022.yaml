  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: id
  text: 'dan Roh Kudus turun ke atas-Nya dalam wujud jasmani seperti burung merpati, dan terdengarlah suara dari surga: “Engkaulah Anak-Ku yang Kukasihi; kepada-Mulah Aku berkenan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menandai bentuk aoristus Yunani secara lebih eksplisit, “kepada-Mulah Aku telah berkenan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: turun
  rationale: Menjaga gerak ke bawah yang dinyatakan verba Yunani dan cocok dengan rangkaian naratif ayat ini.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roh Kudus
  rationale: Padanan baku, jelas, dan alami dalam bahasa Indonesia modern.
- source_word: σωματικῷ εἴδει
  choice: dalam wujud jasmani
  rationale: Menyatakan bahwa penampakan itu memiliki bentuk yang dapat terlihat, tanpa menjelaskan lebih jauh hakikat manifestasinya.
- source_word: ὡς περιστερὰν
  choice: seperti burung merpati
  rationale: ὡς menandai perbandingan; padanan ini mempertahankan simile dan tidak menyatakan bahwa Roh Kudus secara harfiah berubah menjadi seekor merpati.
- source_word: ἐπ’ αὐτόν
  choice: ke atas-Nya
  rationale: Menyampaikan arah turunnya Roh menuju dan berada pada Yesus; bentuk ini wajar dalam konteks gerakan.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: terdengarlah suara dari surga
  rationale: Mengungkapkan secara alami terjadinya suara dari surga, yang dalam bahasa Yunani dinyatakan dengan ungkapan peristiwa φωνὴ γενέσθαι.
- source_word: Σὺ εἶ
  choice: Engkaulah
  rationale: Partikel -lah mencerminkan penekanan dari pronomina eksplisit Σὺ dalam sapaan langsung.
- source_word: ὁ υἱός μου
  choice: Anak-Ku
  rationale: Padanan posesif yang alami dan tepat untuk frasa Yunani tersebut.
- source_word: ὁ ἀγαπητός
  choice: yang Kukasihi
  rationale: Mengungkapkan kasih terhadap Sang Anak dalam bahasa Indonesia yang alami dan bermartabat; maknanya sepadan dengan 'yang terkasih'.
- source_word: ἐν σοὶ
  choice: kepada-Mulah
  rationale: Walaupun ἐν secara bentuk berarti 'di dalam', ungkapan berkenan yang idiomatis dalam bahasa Indonesia menuntut 'kepada'; -lah mempertahankan fokus pada Sang Anak.
- source_word: εὐδόκησα
  choice: Aku berkenan
  rationale: Bahasa Indonesia tidak wajib menandai kala pada verba. Padanan ini alami dan menyampaikan perkenanan ilahi tanpa memaksakan aspek waktu; nuansa aoristus dicatat dalam catatan kaki.
theological_decisions:
- issue: Hakikat penampakan Roh Kudus
  choice: Roh Kudus turun dalam wujud jasmani yang dibandingkan dengan burung merpati.
  alternative: Roh Kudus turun sebagai burung merpati secara harfiah.
  rationale: Gabungan σωματικῷ εἴδει dan ὡς περιστερὰν menyatakan manifestasi yang terlihat sekaligus perbandingan. Kata 'seperti' tidak melampaui pernyataan teks mengenai hakikat wujud tersebut.
- issue: Daya waktu dan aspek εὐδόκησα
  choice: Aku berkenan
  alternative: Aku telah berkenan
  rationale: Aoristus Yunani dapat diwakili secara lebih eksplisit dengan bentuk selesai, tetapi verba bahasa Indonesia tidak secara inheren menandai kala. Teks utama mempertahankan pernyataan yang alami, sedangkan kemungkinan nuansa lampau atau perfektif disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan ejaan teks Alkitab bahasa Indonesia. Tanda [a] ditempatkan sesudah klausa yang diterangkannya, bukan sesudah perbandingan dengan burung merpati.
