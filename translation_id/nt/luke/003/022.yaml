  naturalness: Bahasanya modern, khidmat, dan jelas. Namun, 'lalu' dapat memberi kesan urutan atau kelanjutan yang lebih kuat daripada dua καί Yunani yang sederhana. 'Dan terdengarlah' tetap alami serta lebih dekat pada struktur sumber. Tanda titik dua sebelum ujaran langsung juga memperjelas hubungan dengan 'suara dari surga'.
