  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: id
  text: Yohanes menjawab mereka semua, “Aku membaptis kamu dengan air, tetapi yang lebih kuat daripada aku sedang datang. Aku tidak layak membuka tali sandalnya. Dia akan membaptis kamu dalam Roh Kudus dan api[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Api” dapat dipahami sebagai pemurnian, penghakiman, atau sebagai bagian dari satu gambaran baptisan dalam Roh Kudus dan api; terjemahan mempertahankan ungkapan teks tanpa menentukan salah satu tafsiran.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: Yohanes menjawab mereka semua
  rationale: Ungkapan ἀπεκρίνατο λέγων merupakan formula naratif yang secara alami dapat diterjemahkan dengan satu verba dalam bahasa Indonesia. πᾶσιν dipertahankan sebagai 'mereka semua'.
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: Aku membaptis kamu dengan air
  rationale: μέν mempersiapkan kontras dengan δέ; dalam bahasa Indonesia kontras itu cukup jelas melalui 'tetapi' pada klausa berikutnya. Dativus ὕδατι diterjemahkan 'dengan air', yang alami dan dapat menyatakan sarana atau unsur.
- source_word: βαπτίζω / βαπτίσει
  choice: membaptis / akan membaptis
  rationale: '''Membaptis'' merupakan padanan baku dalam narasi Injil dan tidak mempersempit makna menjadi cara pelaksanaan tertentu.'
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: tetapi Dia yang lebih kuat daripada aku sedang datang
  rationale: Bentuk komparatif ἰσχυρότερος diterjemahkan secara eksplisit sebagai 'lebih kuat'. 'Sedang datang' menyampaikan aspek berlangsung atau kedekatan peristiwa dari bentuk kini ἔρχεται.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: aku tidak layak
  rationale: Dalam ungkapan kerendahan diri ini, ἱκανός menyatakan kelayakan atau kepantasan, sehingga 'tidak layak' merupakan padanan idiomatis yang tepat.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: membuka tali sandal-Nya
  rationale: Frasa ini menggambarkan tugas rendah membuka atau melepaskan tali alas kaki. 'Membuka tali sandal' jelas, wajar, dan dekat dengan gambaran sumber.
- source_word: αὐτὸς
  choice: Dia
  rationale: Kata ganti ini bersifat emfatis dan mengontraskan tokoh yang akan datang dengan Yohanes. Huruf kapital dipakai sesuai konvensi bahasa Indonesia untuk rujukan pronominal kepada tokoh ilahi.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: dalam Roh Kudus dan api
  rationale: '''Dalam'' mempertahankan ἐν tanpa memutuskan secara sempit apakah nuansanya sarana, ranah, atau unsur. ''Api'' dibiarkan tanpa penjelasan di dalam teks agar ambiguitas teologis sumber tetap terpelihara.'
theological_decisions:
- issue: Makna baptisan dalam Roh Kudus dan api
  choice: Mempertahankan ungkapan 'dalam Roh Kudus dan api' tanpa menentukan fungsi api.
  alternative: Menafsirkan api secara eksplisit sebagai pemurnian, atau membedakan baptisan Roh bagi sebagian orang dan penghakiman api bagi yang lain.
  rationale: Klausa Yunani ringkas dan konteks memungkinkan lebih dari satu penafsiran. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
- issue: Identitas tokoh yang datang
  choice: Menggunakan 'Dia' tanpa menambahkan gelar seperti Mesias.
  alternative: Menyebut 'Mesias' atau gelar kristologis lain secara eksplisit.
  rationale: Ayat ini menggambarkan tokoh itu sebagai yang lebih kuat, tetapi tidak menyebut gelarnya dalam klausa tersebut; penambahan gelar akan melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur kalimat dipecah agar tuturan terdengar alami, sementara kontras Yohanes dengan Dia yang akan datang tetap kuat. Pronomina 'Aku' dan 'Dia/-Nya' mengikuti gaya teks Alkitab Indonesia yang bermartabat.
