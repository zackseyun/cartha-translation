  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: id
  text: anak Yakub, anak Ishak, anak Abraham, anak Terah, anak Nahor
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang diulang dengan setiap nama meneruskan pola eliptis dari konteks sebelumnya. Bahasa Indonesia secara wajar menyatakan hubungan yang tersirat itu dengan “anak”.
- source_word: Ἰακώβ
  choice: Yakub
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk leluhur Israel ini.
- source_word: Ἰσαάκ
  choice: Ishak
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan dikenali sebagai tokoh Perjanjian Lama yang sama.
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: Θάρα
  choice: Terah
  rationale: Mengikuti bentuk nama Perjanjian Lama yang sudah dikenal dalam bahasa Indonesia, bukan mentransliterasikan bentuk Yunani secara langsung sebagai “Thara”.
- source_word: Ναχώρ
  choice: Nahor
  rationale: Mengikuti bentuk nama Perjanjian Lama yang sudah dikenal dalam bahasa Indonesia, bukan transliterasi Yunani yang lebih langsung, “Nakhor”.
theological_decisions:
- issue: Penyebutan hubungan anak dalam silsilah yang secara sintaksis eliptis
  choice: Menyatakan setiap hubungan dengan kata “anak”
  alternative: Mempertahankan rangkaian genitif secara harfiah dengan “dari”
  rationale: Teks Yunani hanya mengulang artikel genitif dan nama karena hubungan silsilah sudah ditetapkan oleh konteks. “Anak” membuat hubungan itu jelas dan alami dalam bahasa Indonesia tanpa menambahkan muatan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “anak” mempertahankan irama serta struktur silsilah. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
