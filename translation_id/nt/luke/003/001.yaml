id: LUK.3.1
reference: Luke 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: id
  text: Pada tahun kelima belas pemerintahan Kaisar Tiberius, ketika Pontius Pilatus memerintah Yudea, Herodes memerintah sebagai tetrark atas Galilea, Filipus, saudaranya, memerintah sebagai tetrark atas wilayah Iturea dan Trakhonitis, dan Lisanias memerintah sebagai tetrark atas Abilene,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: Pada tahun kelima belas
  rationale: Ungkapan waktu ini diterjemahkan secara alami dalam bahasa Indonesia. Partikel δέ menandai peralihan narasi dan tidak memerlukan kata penghubung tersendiri di sini.
- source_word: τῆς ἡγεμονίας Τιβερίου Καίσαρος
  choice: pemerintahan Kaisar Tiberius
  rationale: “Pemerintahan” menyampaikan masa kekuasaan kaisar secara wajar tanpa mengesankan bahwa ἡγεμονία adalah gelar jabatan khusus.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: ketika Pontius Pilatus memerintah Yudea
  rationale: Konstruksi partisipial diterjemahkan sebagai keterangan keadaan yang berlangsung bersamaan; bentuk verbal sumber dipertahankan, bukan diubah menjadi pernyataan gelar.
- source_word: τετρααρχοῦντος
  choice: menjadi tetrark di
  rationale: Istilah historis khusus “tetrark” dipertahankan, sedangkan “menjadi” dalam konteks ini menyatakan bahwa orang tersebut sedang menjabat, bukan baru mulai menjabat.
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: Filipus, saudaranya
  rationale: Bentuk aposisi dan rujukan kata ganti kepada Herodes dipertahankan secara ringkas dan alami.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: di wilayah Iturea dan Trakhonitis
  rationale: χώρας dinyatakan dengan “wilayah” agar unsur teritorial tidak hilang; kedua nama tempat mengikuti ejaan Indonesia yang wajar.
- source_word: τῆς Ἀβιληνῆς
  choice: di Abilene
  rationale: Preposisi “di” sesuai dengan konstruksi Indonesia untuk jabatan yang terkait dengan suatu daerah.
theological_decisions:
- issue: Penerjemahan gelar politik τετρααρχοῦντος
  choice: Mempertahankan istilah “tetrark” dan menjelaskannya dalam catatan kaki.
  alternative: Menerjemahkannya secara umum sebagai “penguasa wilayah” atau “memerintah”.
  rationale: Istilah khusus ini menyimpan ketepatan historis teks. Catatan kaki memungkinkan pembaca umum memahaminya tanpa menghapus kekhususan gelar tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan naratif. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Koma pada akhir dipertahankan karena ayat ini merupakan bagian awal dari satu kalimat yang berlanjut ke ayat berikutnya.
