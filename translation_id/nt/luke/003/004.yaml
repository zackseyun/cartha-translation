reference: Luke 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: id
  text: 'seperti yang tertulis dalam kitab yang memuat perkataan Nabi Yesaya: “Ada suara orang yang berseru di padang belantara: ‘Siapkanlah jalan bagi Tuhan[a]; luruskanlah jalan-jalan-Nya.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “TUHAN.” Kutipan ini menggemakan Yesaya 40:3, yang dalam teks Ibraninya memakai nama ilahi YHWH.
    reason: alternative_reading
  - marker: b
    text: 'Frasa “di padang belantara” dapat dipahami berhubungan dengan “berseru”, seperti dalam teks utama, atau dengan perintah sesudahnya: “Ada suara orang yang berseru, ‘Di padang belantara, siapkanlah jalan bagi Tuhan; luruskanlah jalan-jalan-Nya.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: seperti yang tertulis
  rationale: Ungkapan baku dan alami untuk formula pasif perfektif yang memperkenalkan kutipan Kitab Suci serta menyiratkan bahwa tulisan itu tetap berlaku.
- source_word: ἐν βίβλῳ λόγων
  choice: dalam kitab yang memuat perkataan
  rationale: Mempertahankan kedua unsur, βίβλος dan λόγοι, tanpa memakai susunan harfiah 'kitab perkataan' yang kurang alami dalam bahasa Indonesia.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: Nabi Yesaya
  rationale: Bentuk idiomatis bahasa Indonesia untuk nama yang dijelaskan oleh gelar 'nabi'.
- source_word: Φωνὴ βοῶντος
  choice: Ada suara orang yang berseru
  rationale: Menyampaikan nomina tanpa artikel dan partisip genitif personal secara alami; 'ada' memperkenalkan suara yang dinubuatkan tanpa menjadikannya definit secara berlebihan.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: Menggambarkan daerah liar dan sepi secara lebih luas daripada 'gurun', yang dalam bahasa Indonesia sering dibayangkan khusus sebagai hamparan pasir.
- source_word: Ἑτοιμάσατε
  choice: Siapkanlah
  rationale: Mempertahankan daya imperatif jamak dengan bentuk yang alami dan bermartabat.
- source_word: τὴν ὁδὸν κυρίου
  choice: jalan bagi Tuhan
  rationale: Dalam metafora persiapan jalan untuk kedatangan seseorang, 'jalan bagi Tuhan' lebih jelas dan alami daripada 'jalan Tuhan', yang dapat berarti cara Tuhan bertindak.
- source_word: εὐθείας ποιεῖτε
  choice: luruskanlah
  rationale: Mengungkapkan konstruksi 'buat menjadi lurus' secara ringkas sambil mempertahankan perintah jamak.
- source_word: τὰς τρίβους αὐτοῦ
  choice: jalan-jalan-Nya
  rationale: Menggunakan padanan umum bagi jalur-jalur yang disejajarkan dengan ὁδός; akhiran hormat '-Nya' merujuk kepada Tuhan.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Yesaya yang teks Ibraninya memakai nama ilahi YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Lukas berbunyi κύριος, sehingga teks utama menerjemahkannya 'Tuhan'. Catatan kaki mempertahankan hubungan dengan Yesaya 40:3 dan nama ilahi YHWH tanpa memaksakan identifikasi lebih jauh dalam terjemahan.
- issue: Keterikatan frasa ἐν τῇ ἐρήμῳ
  choice: dihubungkan dengan 'berseru'
  alternative: dihubungkan dengan perintah 'siapkanlah'
  rationale: Tanda baca dan pembacaan yang lazim dalam konteks Lukas menghubungkannya dengan suara yang berseru, tetapi secara sintaksis frasa itu juga dapat menerangkan tempat menyiapkan jalan; ambiguitas ini dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Padang belantara' dipilih daripada 'gurun' agar cakupan ἔρημος tidak dipersempit menjadi gurun pasir. Penanda catatan [a] ditempatkan langsung setelah 'Tuhan', sedangkan [b] ditempatkan setelah seluruh kutipan karena membahas struktur kalimat kutipan.
