  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: id
  text: Ia datang ke seluruh daerah di sekitar Sungai Yordan[a] dan memberitakan[b] baptisan pertobatan untuk pengampunan dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seluruh daerah di sekitar Sungai Yordan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menyerukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: pergi
  rationale: Dalam konteks narasi ini, bentuk aoris ἔρχομαι menyatakan pergerakan Yohanes menuju wilayah Yordan. Bahasa Indonesia secara idiomatis memakai “pergi” karena titik pandang narator tidak menuntut “datang”.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: ke seluruh daerah sekitar Sungai Yordan
  rationale: “Seluruh” mencerminkan πᾶσαν, sedangkan περίχωρος menunjuk pada daerah di sekitar suatu tempat. Penambahan “Sungai” memperjelas bahwa Yordan di sini adalah sungai dan alami dalam bahasa Indonesia.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: κηρύσσω menunjuk pada penyampaian suatu pengumuman secara terbuka. “Memberitakan” mempertahankan daya publik tersebut dalam bahasa Indonesia yang wajar tanpa membatasinya pada khotbah formal.
- source_word: βάπτισμα
  choice: baptisan
  rationale: “Baptisan” merupakan padanan baku dan jelas untuk tindakan pembaptisan atau pembasuhan ritual yang dimaksud.
- source_word: μετανοίας
  choice: pertobatan
  rationale: Genitif ini dipertahankan secara ringkas dalam frasa “baptisan pertobatan”, sehingga hubungan erat antara baptisan dan pertobatan tidak dijelaskan secara berlebihan.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: untuk pengampunan dosa
  rationale: ἄφεσις dalam konteks ini berarti pengampunan atau pelepasan. “Untuk pengampunan dosa” alami dalam bahasa Indonesia dan mempertahankan arah atau tujuan yang dinyatakan oleh εἰς tanpa menetapkan mekanisme teologisnya.
theological_decisions:
- issue: Hubungan antara baptisan, pertobatan, dan pengampunan
  choice: baptisan pertobatan untuk pengampunan dosa
  alternative: baptisan sebagai tanda pertobatan yang membawa kepada pengampunan dosa
  rationale: Susunan Yunani βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν diterjemahkan secara transparan. Terjemahan ini tidak menentukan apakah baptisan bersifat instrumental, menjadi tanda, atau menjadi pernyataan sehubungan dengan pengampunan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Ia” menjaga kesinambungan dengan tokoh Yohanes pada ayat sebelumnya; “baptisan pertobatan” sengaja dipertahankan agar hubungan gramatikal dan ketegangan teologis teks sumber tidak diperjelas secara sepihak.
