  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Yunani berbentuk elipsis: artikel genitif τοῦ diulang pada setiap nama, sedangkan hubungan “anak” dipahami dari pola silsilah dalam konteks. Kata “anak” ditambahkan untuk memperjelas hubungan itu dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang diulang dipakai secara eliptis dan meneruskan hubungan genealogis dari konteks. Bahasa Indonesia secara alami menyatakan hubungan itu dengan mengulang 'anak'.
- source_word: Μάαθ
  choice: Maat
  rationale: Nama pribadi ditransliterasikan dari bentuk Yunani dengan ejaan Indonesia; huruf theta akhir diwakili oleh 't'.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Bentuk genitif dari nama Ματταθίας ditransliterasikan menurut ejaan Indonesia, dengan theta diwakili oleh 't'.
- source_word: Σεμεῒν
  choice: Semein
  rationale: Nama pribadi ditransliterasikan langsung dari bentuk Yunani sambil mempertahankan urutan vokalnya.
- source_word: Ἰωσὴχ
  choice: Yosekh
  rationale: 'Transliterasi mengikuti bunyi bentuk Yunani dan konvensi Indonesia: iota awal menjadi ''Y'', sedangkan khi akhir menjadi ''kh''.'
- source_word: Ἰωδὰ
  choice: Yoda
  rationale: Nama ditransliterasikan langsung dari bentuk Yunani Ἰωδά; iota awal bernilai konsonantal dinyatakan dengan 'Y'.
