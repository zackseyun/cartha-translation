  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: id
  text: Setiap lembah akan ditimbun,[a] dan setiap gunung dan bukit akan direndahkan. Yang berkelok-kelok akan menjadi lurus, dan jalan-jalan yang kasar akan menjadi jalan-jalan yang mulus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap jurang akan ditimbun.”
    reason: lexical_alternative
  - marker: b
    text: Baris ini menggemakan Yesaya 40:4 dan memakai gambaran pembangunan jalan untuk mempersiapkan jalan Tuhan.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Setiap lembah
  rationale: φάραγξ dapat berarti lembah, jurang, atau ngarai. “Lembah” alami dalam bahasa Indonesia dan sesuai dengan gambaran perataan medan dalam kutipan nubuat ini; alternatif yang lebih sempit dicatat dalam catatan kaki.
- source_word: πληρωθήσεται
  choice: akan ditimbun
  rationale: Bentuk pasif futur dari πληρόω menyatakan bahwa cekungan akan diisi. Dalam konteks penyiapan jalan, “ditimbun” lebih idiomatis dan konkret daripada “dipenuhi”.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: setiap gunung dan bukit
  rationale: Kedua kata yang berdekatan maknanya tetap dibedakan untuk mempertahankan kepenuhan puitis teks sumber.
- source_word: ταπεινωθήσεται
  choice: akan direndahkan
  rationale: Dalam konteks topografis, ταπεινόω berarti membuat tanah tinggi menjadi rendah. “Direndahkan” mempertahankan gambaran fisik sekaligus gema profetisnya tanpa mengubahnya menjadi tafsiran moral.
- source_word: τὰ σκολιά
  choice: Yang berkelok-kelok
  rationale: Adjektiva netral jamak ini dipakai secara substantival. Ungkapan ini mempertahankan ketidakspesifikan bahasa Yunani sambil tetap jelas dalam rangkaian gambaran jalan.
- source_word: εἰς εὐθείαν
  choice: akan menjadi lurus
  rationale: Konstruksi εἰς menyatakan hasil atau perubahan; bentuk Indonesia ini alami dan tepat.
- source_word: αἱ τραχεῖαι
  choice: jalan-jalan yang kasar
  rationale: Adjektiva feminin jamak ini kemungkinan mengandaikan jalan atau lintasan. Menyebut “jalan-jalan” membuat hubungan dengan ὁδοὺς yang menyusul menjadi jelas dalam bahasa Indonesia.
- source_word: εἰς ὁδοὺς λείας
  choice: akan menjadi rata
  rationale: ὁδοὺς λείας secara harfiah menunjuk jalan-jalan yang halus atau rata. Karena subjek “jalan-jalan” sudah dinyatakan, “menjadi rata” menghindari pengulangan yang kaku dan sesuai dengan gambaran pembangunan jalan.
theological_decisions:
- issue: Gambaran nubuat/topografi dari Yesaya 40:4 yang dikutip dalam Lukas
  choice: Mempertahankan gambaran konkret tentang perataan medan dan penyiapan jalan.
  alternative: Memparafrasakannya secara moral atau rohani, misalnya orang sombong direndahkan.
  rationale: Teks Lukas memakai bahasa bentang alam yang konkret. Mempertahankannya menjaga daya puitis dan ketegangan teologis teks tanpa memasukkan penafsiran ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Susunan puitis dipertahankan dengan paralelisme yang jelas; istilah konkret dipilih agar mudah dipahami pembaca umum.
