lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam rangkaian silsilah Lukas, artikel genetif yang berulang bersifat eliptis dan meneruskan hubungan 'anak' dari rumus silsilah dalam konteks. Penggunaan 'anak' membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
- source_word: Μελεὰ
  choice: Melea
  rationale: Nama ini ditransliterasikan langsung dari bentuk Yunani Μελεά.
- source_word: Μεννὰ
  choice: Menna
  rationale: Bentuk 'Menna' mencerminkan secara langsung teks SBLGNT, Μεννά; bentuk lain seperti 'Menan' tidak dipakai dalam teks sumber yang diberikan.
- source_word: Ματταθὰ
  choice: Matata
  rationale: Transliterasi 'Matata' mengikuti bentuk Yunani Ματταθά sekaligus memakai ejaan Indonesia, yang umumnya tidak mempertahankan penggandaan konsonan Yunani.
- source_word: Ναθὰμ
  choice: Natan
  rationale: Nama yang dikenal dalam tradisi Alkitab Indonesia ini ditulis 'Natan', sesuai bentuk Indonesia yang lazim bagi Ναθάμ.
- source_word: Δαυὶδ
  choice: Daud
  rationale: Nama Δαυίδ diterjemahkan dengan bentuk baku dan umum dalam Alkitab bahasa Indonesia, yaitu 'Daud'.
theological_decisions:
- issue: Elipsis dalam silsilah
  choice: Menggunakan 'anak' sebelum setiap nama.
  alternative: Menerjemahkan secara harfiah sebagai 'dari Melea, dari Menna, dari Matata, dari Natan, dari Daud'.
  rationale: Teks Yunani berupa rangkaian genetif yang bergantung pada rumus silsilah di konteks sekitarnya. Menyisipkan 'anak' menyatakan hubungan yang jelas tersirat tanpa menambahkan klaim teologis baru.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama yang telah mapan diindonesiakan sebagai Natan dan Daud; nama yang kurang dikenal ditransliterasikan dengan ejaan Indonesia. Penanda catatan kaki ditempatkan sesudah Melea dan pada akhir rangkaian agar keduanya hadir dalam teks utama.
