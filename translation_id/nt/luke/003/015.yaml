id: LUK.3.15
reference: Luke 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: id
  text: Ketika orang banyak sedang menanti dengan penuh harap dan mereka semua bertanya-tanya dalam hati tentang Yohanes, apakah mungkin dialah Mesias[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Kristus.” Yunani: ho christos.'
    reason: Memberikan padanan tradisional bagi gelar Yunani ὁ χριστός tanpa mengaburkan fungsi mesianiknya dalam teks utama.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: sedang menanti dengan penuh harap
  rationale: Partisipel kini dalam konstruksi genitif absolut membentuk latar kejadian dan menyatakan penantian yang disertai pengharapan, bukan sekadar menunggu.
- source_word: δὲ
  choice: tidak dinyatakan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan. Dalam bahasa Indonesia, peralihannya sudah terbawa secara alami oleh klausa pembuka “Ketika”, sehingga penambahan “lalu”, “adapun”, atau “sekarang” tidak diperlukan.
- source_word: τοῦ λαοῦ
  choice: orang banyak
  rationale: λαός menunjuk kepada orang-orang sebagai kelompok. Dalam konteks kerumunan yang mendengarkan Yohanes, “orang banyak” terdengar alami dan tidak memberi nuansa politis seperti “rakyat”.
- source_word: διαλογιζομένων πάντων
  choice: mereka semua bertanya-tanya
  rationale: Kata kerja ini menyatakan pertimbangan atau pergumulan batin. Bersama frasa “dalam hati”, “bertanya-tanya” menyampaikan perenungan internal secara wajar dalam bahasa Indonesia, sedangkan “bernalar” terdengar terlalu teknis.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: dalam hati
  rationale: Terjemahan langsung ini alami dalam bahasa Indonesia dan mempertahankan cakupan biblis “hati” sebagai pusat pikiran serta pertimbangan batin.
- source_word: περὶ τοῦ Ἰωάννου
  choice: tentang Yohanes
  rationale: περί dengan genitif berarti “tentang” atau “mengenai”; pilihan ini merupakan ungkapan Indonesia yang paling langsung.
- source_word: μήποτε ... εἴη
  choice: apakah mungkin ...
  rationale: Gabungan μήποτε dan optatif εἴη menyatakan pertanyaan batin yang tentatif. “Apakah mungkin” mempertahankan unsur pertanyaan dan kemungkinan tanpa mengubahnya menjadi kepastian.
- source_word: αὐτὸς
  choice: dialah
  rationale: Bentuk pronomina yang eksplisit dan bertekanan menunjuk kembali kepada Yohanes. “Dialah” mempertahankan penekanan identitas itu secara ringkas.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Di sini Χριστός berfungsi sebagai gelar tokoh yang dinantikan, bukan sebagai unsur nama. “Mesias” mempertahankan latar pengharapan Yahudi dalam perikop ini.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Pertanyaan orang banyak menyangkut apakah Yohanes adalah tokoh mesianik yang dinantikan. Karena itu, “Mesias” menyatakan fungsi gelarnya dengan jelas, sementara “Kristus” dicantumkan sebagai padanan tradisional dalam catatan kaki.
- issue: Tingkat kepastian dugaan orang banyak
  choice: apakah mungkin dialah
  alternative: apakah dialah
  rationale: μήποτε bersama optatif εἴη menandai dugaan yang tentatif. Kata “mungkin” mempertahankan ketidakpastian teologis dan naratif dalam pertanyaan batin mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Orang banyak” dipilih alih-alih “rakyat” agar konteks kerumunan tetap jelas; “bertanya-tanya dalam hati” mempertahankan sifat perenungan batin tanpa terdengar kaku. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke jawaban Yohanes pada ayat berikutnya.
