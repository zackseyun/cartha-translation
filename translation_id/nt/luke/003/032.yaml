  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: id
  text: anak Isai, anak Jobel[a], anak Boas, anak Sala, anak Nahason,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: Jobel. Bentuk nama ini berbeda dari Obed dalam silsilah Rut 4:21–22.'
    reason: Menandai bentuk nama tidak lazim yang terdapat dalam teks Yunani sumber dan menjaga transparansi terhadap persoalan tekstual tanpa menggantinya dengan harmonisasi.
lexical_decisions:
- source_word: Ἰεσσαί
  choice: Isai
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk Jesse.
- source_word: Ἰωβήλ
  choice: Obed
  rationale: SBLGNT membaca Ἰωβήλ, sebuah bentuk tekstual yang tidak biasa; berdasarkan konteks silsilah dan padanan nama Rut 4:21–22, digunakan bentuk Indonesia yang dikenal, Obed, tanpa menambahkan catatan karena ayat ini berupa daftar nama.
- source_word: Βόος
  choice: Boas
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk Boaz.
- source_word: Σαλά
  choice: Sala
  rationale: Transliterasi langsung bentuk Yunani Σαλά, yang dipertahankan dalam sumber yang diberikan.
- source_word: Ναασσών
  choice: Nahason
  rationale: Bentuk Indonesia yang wajar dan lazim untuk Nahshon.
- source_word: τοῦ
  choice: anak
  rationale: Dalam rangkaian silsilah Lukas, bentuk genitif berulang menyatakan hubungan keturunan; 'anak' merupakan pengungkapan alami dalam bahasa Indonesia, meskipun kata υἱός tersirat dari ayat 23.
theological_decisions:
- issue: Cakupan istilah 'anak' dalam silsilah
  choice: Memakai 'anak' pada setiap mata rantai
  alternative: Memakai 'keturunan' atau hanya menyusun nama
  rationale: Mengikuti struktur silsilah yang dimulai dengan υἱός pada Lukas 3:23 dan dipahami berlanjut melalui genitif; 'anak' mempertahankan bentuk tradisional tanpa menegaskan bahwa setiap hubungan harus selalu satu generasi biologis langsung.
- issue: Varian/nama Ἰωβήλ
  choice: Obed
  alternative: Jobel atau Yobel sebagai transliterasi ketat SBLGNT
  rationale: Konteks silsilah Isai–Obed–Boas dan tradisi nama Perjanjian Lama sangat kuat menunjuk kepada Obed. Pilihan ini menghindari nama yang tidak dikenal, tetapi mengakui bahwa bentuk cetak SBLGNT sendiri adalah Ἰωβήλ.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama memakai bentuk yang umum dikenal pembaca Alkitab Indonesia; struktur daftar dan tanda koma dipertahankan karena ayat berlanjut ke mata rantai berikutnya.
