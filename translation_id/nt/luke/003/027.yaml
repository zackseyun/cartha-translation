lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah ini, artikel genitif yang diulang mengandung hubungan anak–ayah berdasarkan pola yang sudah ditetapkan oleh konteks. Pengulangan “anak” menghasilkan bahasa Indonesia yang jelas dan wajar.
- source_word: Ἰωανὰν
  choice: Yohanan
  rationale: Nama ini dialihaksarakan dalam bentuk yang alami dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Ῥησὰ
  choice: Resa
  rationale: Alih aksara langsung yang sesuai dengan ejaan bahasa Indonesia; tanda aspirasi Yunani pada rho awal tidak perlu ditampilkan.
- source_word: Ζοροβαβὲλ
  choice: Zerubabel
  rationale: Bentuk baku bahasa Indonesia yang mempertahankan pengenalan tokoh yang sama dalam Perjanjian Lama.
- source_word: Σαλαθιὴλ
  choice: Sealtiel
  rationale: Bentuk yang dikenal dalam Alkitab bahasa Indonesia untuk nama yang bersesuaian dengan nama Ibrani שְׁאַלְתִּיאֵל, meskipun bentuk Yunaninya dapat dialihaksarakan sebagai Salatiel.
- source_word: Νηρὶ
  choice: Neri
  rationale: Alih aksara langsung dan alami ke dalam bahasa Indonesia.
theological_decisions:
- issue: Elipsis dalam silsilah
  choice: Mengulang kata “anak” di depan setiap nama.
  alternative: Memakai rangkaian “dari” atau hanya mencantumkan nama-nama.
  rationale: Bahasa Yunani hanya mengulang artikel genitif, tetapi hubungan sebagai anak tersirat dari rumus silsilah dalam konteks. Menyatakannya secara eksplisit menjaga makna tanpa menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama memakai bentuk yang lazim dalam tradisi Alkitab Indonesia bila tersedia; tanda baca mempertahankan kesinambungan ayat ini dengan rangkaian silsilah di ayat-ayat sekitarnya.
