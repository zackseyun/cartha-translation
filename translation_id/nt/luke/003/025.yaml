lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang berulang dipakai secara eliptis dan meneruskan rumus hubungan keturunan dari konteks sebelumnya. Pengulangan “anak” menyatakan hubungan itu secara alami dalam bahasa Indonesia tanpa menambahkan unsur yang tidak tersirat.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Nama pribadi ini ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; konsonan rangkap Yunani disederhanakan sesuai kebiasaan penulisan nama Alkitab dalam bahasa Indonesia.
- source_word: Ἀμὼς
  choice: Amos
  rationale: Nama pribadi ditransliterasikan sebagai “Amos”, bentuk yang sudah dikenal dalam bahasa Indonesia. Dalam ayat ini nama tersebut hanya menunjuk seorang leluhur, tanpa memastikan bahwa ia adalah nabi Amos.
- source_word: Ναοὺμ
  choice: Nahum
  rationale: Dipilih bentuk “Nahum”, transliterasi yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: Ἑσλὶ
  choice: Esli
  rationale: Nama pribadi ditransliterasikan “Esli”; naskah Yunani tidak memerlukan penambahan bunyi awal h dalam bahasa Indonesia.
- source_word: Ναγγαὶ
  choice: Nagai
  rationale: Nama pribadi ditransliterasikan “Nagai”; satu huruf g sudah cukup untuk mewakili pengucapan secara alami dalam ejaan Indonesia.
