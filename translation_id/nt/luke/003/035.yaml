  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: id
  text: anak Serug, anak Rehu, anak Peleg, anak Eber, anak Selah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Yunani berbunyi, “dari Serukh, dari Ragau, dari Phalek, dari Eber, dari Sala.” Dalam silsilah Lukas, hubungan “anak” tersirat dari konteks. Nama-nama dalam teks utama memakai bentuk yang lazim dalam Perjanjian Lama bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Rangkaian artikel berkasus genitif meneruskan rumus silsilah yang tersirat dari konteks. Dalam bahasa Indonesia, pengulangan “anak” menyampaikan hubungan keturunan itu secara jelas dan alami.
- source_word: Σεροὺχ
  choice: Serug
  rationale: Bentuk ini mengikuti nama baku tokoh tersebut dalam tradisi Perjanjian Lama bahasa Indonesia dan tetap dekat dengan nama Semit yang mendasarinya.
- source_word: Ῥαγαὺ
  choice: Rehu
  rationale: Bentuk Yunani Ragau merujuk kepada tokoh yang dikenal sebagai Rehu dalam silsilah Kejadian; bentuk baku Indonesia membantu pembaca mengenali kesinambungan antarkitab.
- source_word: Φάλεκ
  choice: Peleg
  rationale: Nama baku Indonesia bagi tokoh dalam silsilah Kejadian digunakan untuk menjaga keterkenalan kanonis.
- source_word: Ἔβερ
  choice: Eber
  rationale: Bentuk Eber adalah nama baku Indonesia bagi leluhur ini dan mencerminkan dengan baik bentuk Yunani serta nama yang mendasarinya.
- source_word: Σαλὰ
  choice: Selah
  rationale: Bentuk Yunani Sala merujuk kepada tokoh yang lazim disebut Selah dalam Perjanjian Lama bahasa Indonesia; pilihan ini menjaga hubungan silsilah lintas Perjanjian.
