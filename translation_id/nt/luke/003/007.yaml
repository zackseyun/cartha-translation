  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: id
  text: Lalu ia berkata kepada orang banyak yang datang untuk dibaptis olehnya, “Keturunan ular beludak![a] Siapa yang memperingatkan kalian untuk melarikan diri dari murka yang akan datang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Anak-anak ular beludak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ia berkata
  rationale: Bentuk imperfek menggambarkan ujaran yang berlangsung atau berulang dalam adegan tersebut. Bahasa Indonesia biasanya cukup menyatakannya dengan “berkata” tanpa memaksakan arti bahwa ia terus-menerus mengulanginya.
- source_word: οὖν
  choice: Karena itu
  rationale: Kata ini menghubungkan perkataan Yohanes dengan konteks sebelumnya dan dapat menandai kelanjutan yang bersifat naratif sekaligus logis.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: kepada orang banyak yang datang
  rationale: Partisipel ini menggambarkan orang banyak yang keluar menuju Yohanes; “yang datang” menyampaikan gerak menuju tempat pelayanan Yohanes secara alami dalam bahasa Indonesia.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: untuk dibaptis olehnya
  rationale: Terjemahan ini mempertahankan bentuk pasif, hubungan tujuan, dan kata ganti yang terdapat dalam teks Yunani tanpa menambahkan nama Yohanes.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Keturunan ular beludak
  rationale: “Keturunan” mencerminkan sesuatu yang dilahirkan atau dihasilkan, sedangkan “ular beludak” menyampaikan jenis ular berbisa yang dimaksud.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Siapa yang memperingatkan kalian
  rationale: Dalam konteks bahaya penghakiman, ὑποδείκνυμι membawa daya makna menunjukkan atau memberi tahu sebagai peringatan; “memperingatkan” paling alami dan tepat.
- source_word: φυγεῖν
  choice: untuk melarikan diri
  rationale: Pilihan ini mempertahankan gambaran tindakan lari menjauhi bahaya, bukan sekadar hasil berupa lolos.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: dari murka yang akan datang
  rationale: Ungkapan ini mempertahankan makna murka yang mendatang tanpa menentukan waktu atau bentuk penghakiman itu secara lebih sempit.
theological_decisions:
- issue: Hakikat murka dalam peringatan Yohanes
  choice: “murka” dibiarkan menunjuk pada penghakiman ilahi yang akan datang tanpa dipersempit pada suatu skema doktrinal tertentu
  alternative: menafsirkannya secara khusus sebagai penghakiman eskatologis terakhir atau sebagai penghukuman historis yang segera terjadi
  rationale: Konteks menekankan pertobatan menghadapi penghakiman Allah, tetapi ayat ini sendiri tidak menentukan secara rinci waktu atau bentuknya. Terjemahan mempertahankan keluasan dan ketegangan teologis istilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. “Kalian” dipakai karena ὑμῖν berbentuk jamak dan ditujukan kepada orang banyak. Penanda catatan kaki ditempatkan tepat setelah frasa yang memiliki alternatif leksikal.
