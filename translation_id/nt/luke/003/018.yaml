id: LUK.3.18
reference: Luke 3:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: id
  text: Jadi, sambil menyampaikan banyak nasihat lain juga[a], Yohanes memberitakan kabar baik kepada orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sambil menasihati mereka tentang banyak hal lain.” Dalam bahasa Yunani, hal yang dimaksud dengan “banyak” tidak disebutkan secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: banyak nasihat lain juga
  rationale: Bentuk netral jamak Πολλὰ dengan ἕτερα menunjuk pada banyak hal tambahan yang disampaikan Yohanes. Dalam bahasa Indonesia, objek tersirat itu secara wajar dikaitkan dengan tindakan menasihati, tetapi alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: μὲν οὖν
  choice: Jadi
  rationale: Gabungan partikel ini menandai kelanjutan sekaligus peralihan atau simpulan dalam alur pembahasan. 'Jadi' menyampaikan fungsi wacananya tanpa menerjemahkan setiap partikel secara kaku.
- source_word: παρακαλῶν
  choice: sambil menyampaikan ... nasihat
  rationale: Partisipel kini παρακαλῶν dapat berarti menasihati, mendorong, atau mendesak. Dalam konteks pemberitaan profetis Yohanes, 'menyampaikan ... nasihat' mencakup dorongan dan teguran dengan bahasa Indonesia yang alami.
- source_word: εὐηγγελίζετο
  choice: memberitakan kabar baik
  rationale: Bentuk imperfek menyatakan kegiatan yang berlangsung atau berulang pada masa lampau. Bahasa Indonesia tidak harus menandai aspek itu dengan kata bantu; konteks naratif dan verba 'memberitakan' menyampaikan tindakan pelayanan yang berkelanjutan.
- source_word: τὸν λαόν
  choice: kepada orang banyak
  rationale: λαός merujuk kepada khalayak yang dilayani Yohanes. 'Orang banyak' alami dalam konteks ini dan tidak menambahkan pembatasan eksplisit seperti 'Israel'.
theological_decisions:
- issue: Daya εὐηγγελίζετο dalam pelayanan Yohanes
  choice: memberitakan kabar baik
  alternative: berkhotbah; menyampaikan berita
  rationale: Teks Yunani sendiri mencirikan pemberitaan Yohanes—termasuk nasihat dan desakannya—sebagai penyampaian kabar baik. Ketegangan teologis ini dipertahankan dan tidak diratakan menjadi kegiatan berbicara secara umum.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yohanes' dipakai untuk memperjelas subjek yang tersirat dalam verba Yunani, sesuai konteks langsung; catatan kaki mempertahankan ketidakjelasan objek Πολλὰ.
