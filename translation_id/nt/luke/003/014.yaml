  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: id
  text: Para prajurit juga bertanya kepadanya, “Kalau kami juga, apa yang harus kami lakukan?” Ia berkata kepada mereka, “Jangan memeras siapa pun[a] dan jangan menuduh siapa pun secara palsu[b]. Puaslah dengan gaji kalian[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “memeras” secara harfiah dapat menyiratkan tindakan mengguncang atau mengintimidasi seseorang; di sini maksudnya ialah memperoleh sesuatu melalui paksaan atau penyalahgunaan kuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengajukan tuduhan palsu terhadap siapa pun.” Dalam konteks ini, tindakan tersebut dapat dilakukan untuk mendapat keuntungan atau merugikan orang lain.
    reason: lexical_alternative
  - marker: c
    text: “Gaji” juga dapat diterjemahkan “bayaran”; istilah Yunaninya sering digunakan untuk bayaran atau perbekalan prajurit.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: para prajurit
  rationale: Partisipel ini menunjuk kepada orang-orang yang sedang menjalani dinas militer. “Para prajurit” merupakan padanan Indonesia yang alami dan tepat dalam konteks ini.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Kalau kami juga, apa yang harus kami lakukan?
  rationale: Bentuk subjungtif menyatakan pertanyaan pertimbangan, sedangkan καὶ ἡμεῖς secara eksplisit menekankan bahwa kelompok ini pun menanyakan kewajibannya. Susunan ini mempertahankan penekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: διασείσητε
  choice: memeras
  rationale: Kata ini secara harfiah dapat menggambarkan tindakan mengguncang atau mengintimidasi, tetapi dalam konteks ini mengacu pada pemaksaan dengan menyalahgunakan kuasa demi memperoleh keuntungan. “Memeras” menyampaikan makna itu dengan ringkas dan jelas.
- source_word: συκοφαντήσητε
  choice: menuduh siapa pun secara palsu
  rationale: Dalam konteks penyalahgunaan kuasa, verba ini menunjuk pada pengajuan tuduhan yang tidak benar, mungkin demi keuntungan atau untuk merugikan orang lain. Terjemahan ini tidak mempersempit maknanya menjadi pemerasan melalui ancaman saja.
- source_word: ἀρκεῖσθε
  choice: puaslah
  rationale: Imperatif kini ini menuntut sikap berkelanjutan untuk menerima apa yang mencukupi. “Puaslah” menyampaikan dorongan etis itu secara wajar.
- source_word: ὀψωνίοις
  choice: gaji
  rationale: Istilah ini digunakan untuk bayaran atau perbekalan prajurit dan kemudian juga untuk upah. Dalam konteks para prajurit, “gaji” adalah padanan modern yang paling langsung, sementara kemungkinan nuansa perbekalan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Nasihat etis kepada para prajurit
  choice: Terjemahan menyampaikan bahwa Yohanes memberi para prajurit larangan menyalahgunakan kuasa dan perintah untuk puas dengan gaji mereka, tanpa menyuruh mereka meninggalkan dinas militer.
  alternative: Membaca ayat ini sebagai kecaman tersirat terhadap dinas militer itu sendiri.
  rationale: Teks menyapa mereka dalam kedudukan mereka sebagai prajurit dan memberi petunjuk etis khusus, tetapi tidak secara eksplisit membahas seluruh persoalan moral mengenai dinas militer. Terjemahan tidak menambahkan kesimpulan doktrinal di luar pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Ungkapan “Kalau kami juga” mempertahankan penekanan eksplisit καὶ ἡμεῖς tanpa menghasilkan susunan yang kaku. Pronomina “kalian” dipakai dalam ucapan langsung kepada kelompok prajurit dan tetap jelas bagi pembaca masa kini.
