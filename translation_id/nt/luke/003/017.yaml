id: LUK.3.17
reference: Luke 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: id
  text: Alat penampi ada di tangan-Nya untuk membersihkan tempat pengirikan-Nya sampai tuntas dan mengumpulkan gandum ke dalam lumbung-Nya. Namun, sekam akan dibakar-Nya sampai habis dengan api yang tidak dapat dipadamkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dengan api yang tak terpadamkan."
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: alat penampi
  rationale: Istilah ini menunjuk pada alat pertanian untuk melontarkan atau menampi hasil panen agar biji-bijian terpisah dari sekam. 'Alat penampi' jelas dalam bahasa Indonesia modern tanpa menentukan bentuk alat secara berlebihan.
- source_word: διακαθᾶραι
  choice: membersihkan ... sampai tuntas
  rationale: Ungkapan ini mempertahankan daya intensif verba majemuk, yaitu membersihkan seluruh tempat pengirikan secara menyeluruh.
- source_word: ἅλωνα
  choice: tempat pengirikan
  rationale: Padanan baku bagi lokasi tempat hasil panen diirik dan ditampi; citra pertaniannya tetap terpelihara.
- source_word: συναγαγεῖν
  choice: mengumpulkan
  rationale: Padanan langsung dan alami untuk tindakan menghimpun gandum setelah pemisahan.
- source_word: σῖτον
  choice: gandum
  rationale: Dalam konteks pertentangannya dengan sekam, 'gandum' merupakan padanan alami dan lazim, meskipun kata Yunani ini dapat berarti biji-bijian secara lebih luas.
- source_word: ἀποθήκην
  choice: lumbung
  rationale: '''Lumbung'' secara alami menyatakan tempat penyimpanan hasil panen dalam bahasa Indonesia dan sesuai dengan citra pertanian ayat ini.'
- source_word: ἄχυρον
  choice: sekam
  rationale: Dalam konteks penampian, 'sekam' menyatakan bagian tidak berguna yang dipisahkan dari biji-bijian dengan lebih tepat daripada 'jerami'.
- source_word: κατακαύσει
  choice: akan dibakar-Nya sampai habis
  rationale: Bentuk majemuk ini menyiratkan pembakaran hingga tuntas; susunan Indonesia ini mempertahankan nuansa tersebut.
- source_word: πυρὶ ἀσβέστῳ
  choice: dengan api yang tidak dapat dipadamkan
  rationale: Padanan ini menyatakan bahwa api tersebut tidak bisa dipadamkan, tanpa menambahkan perincian doktrinal di luar teks.
- source_word: οὗ
  choice: -Nya
  rationale: Pronomina relatif genitif mengacu pada tokoh yang akan datang. Dalam bahasa Indonesia, kepemilikan paling alami dinyatakan melalui akhiran '-Nya' pada 'tangan', 'tempat pengirikan', dan 'lumbung'.
theological_decisions:
- issue: Gambaran penghakiman dalam metafora pertanian
  choice: 'Mempertahankan gambaran pemisahan yang tegas: gandum dikumpulkan, sedangkan sekam dibakar sampai habis dengan api yang tidak dapat dipadamkan.'
  alternative: Menafsirkannya secara khusus sebagai penghakiman sementara atas Israel, atau menjadikannya rumusan lengkap tentang doktrin hukuman akhir.
  rationale: Teks jelas menyampaikan pemisahan, keselamatan, dan penghakiman, tetapi tidak menerangkan seluruh cakupan atau cara penggenapannya. Terjemahan tidak melunakkan gambaran itu dan juga tidak memasukkan sistem teologis yang lebih terperinci daripada ayatnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Alat penampi' menghindari istilah tradisional yang dapat tidak dipahami pembaca umum; 'tempat pengirikan', 'lumbung', dan 'sekam' mempertahankan citra pertanian. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
