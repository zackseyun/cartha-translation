  yaml_path: translation/nt/luke/003/029.yaml
  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: id
  text: anak Yesua, anak Eliezer, anak Yorim, anak Matat, anak Lewi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah ini, bentuk genitif berulang menyatakan hubungan keturunan; bahasa Indonesia secara alami mengungkapkannya dengan “anak” tanpa artikel.
- source_word: Ἰησοῦ
  choice: Yesua
  rationale: Nama dalam silsilah ini ditransliterasikan sebagai Yesua, sejalan dengan bentuk Semitik yang melatarinya dan untuk membedakannya dari penyebutan Yesus Kristus dalam konteks biasa.
- source_word: Ἐλιέζερ
  choice: Eliezer
  rationale: Transliterasi Indonesia yang lazim dan dekat dengan bentuk Yunani.
- source_word: Ἰωρὶμ
  choice: Yorim
  rationale: Huruf awal iota yang berfungsi sebagai konsonan dialihkan menjadi Y dalam ejaan Indonesia.
- source_word: Μαθθὰτ
  choice: Matat
  rationale: Konsonan rangkap Yunani tidak perlu dipertahankan dalam ejaan Indonesia; bentuk Matat jelas dan mudah dibaca.
- source_word: Λευὶ
  choice: Lewi
  rationale: Mengikuti bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pola “anak …” dipertahankan berulang untuk mencerminkan struktur silsilah Yunani dan kesinambungan dengan ayat-ayat sekitarnya.
