  - marker: b
    text: Sebagian naskah atau tradisi terjemahan memakai bentuk nama “Yonan”, bukan “Yonam”.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang diulang di depan setiap nama secara eliptis meneruskan hubungan keturunan dari ayat-ayat sekitarnya. Pengulangan “anak” menyatakan hubungan yang tersirat itu secara alami dalam bahasa Indonesia.
- source_word: Συμεὼν
  choice: Simeon
  rationale: Bentuk nama yang sudah lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: Ἰούδα
  choice: Yehuda
  rationale: Bentuk Yunani ini dapat merujuk pada nama yang dalam bahasa Indonesia ditulis “Yehuda” atau “Yudas”. Dalam konteks silsilah dan nama Semitik, “Yehuda” lebih sesuai serta tidak menimbulkan kaitan yang tidak dimaksudkan dengan Yudas Iskariot.
- source_word: Ἰωσὴφ
  choice: Yusuf
  rationale: Bentuk baku dan lazim nama ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: Ἰωνὰμ
  choice: Yonam
  rationale: Mentransliterasikan bentuk SBLGNT Ἰωνάμ secara wajar ke dalam ejaan Indonesia; bentuk “Yonan” tercermin dalam sebagian tradisi naskah atau terjemahan.
- source_word: Ἐλιακὶμ
  choice: Elyakim
  rationale: Bentuk Indonesia yang lazim untuk nama Semitik ini dan mudah dibaca.
