  text: the son of Simeon[a], the son of Judah, the son of Joseph, the son of Jonam, the son of Eliakim[b],
translation:
  language: id
  text: anak Simeon, anak Yehuda[a], anak Yusuf, anak Yonam[b], anak Elyakim,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yunani yang sama juga dapat ditulis “Yudas”; “Yehuda” lebih sesuai dalam konteks silsilah ini.
