id: LUK.3.8
reference: Luke 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: id
  text: 'Karena itu, hasilkanlah buah-buah yang sesuai dengan pertobatan[a], dan jangan mulai berkata di antara kalian[b], ‘Abraham adalah bapak kami,’ sebab aku berkata kepada kalian: Allah sanggup membangkitkan anak-anak bagi Abraham dari batu-batu ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan ‘buah-buah yang layak bagi pertobatan’ atau ‘buah yang sepadan dengan pertobatan’. Bahasa Yunani memakai bentuk jamak dan menekankan perilaku yang sesuai dengan pertobatan sejati.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan ‘dalam hati kalian’ atau ‘kepada diri kalian sendiri’. Frasa ini dapat menunjuk pada perkataan batin ataupun perkataan di kalangan kelompok mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: hasilkanlah
  rationale: Imperatif aoris menuntut tindakan tegas. Bersama objek metaforis ‘buah-buah’, ‘hasilkanlah’ mempertahankan makna membuat atau menghasilkan tanpa menjadi terlalu harfiah.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari peringatan sebelumnya dan mempertahankan hubungan logis secara jelas.
- source_word: καρποὺς
  choice: buah-buah
  rationale: Bentuk Yunani adalah jamak; bentuk ulang mempertahankan nuansa berbagai bukti nyata atau hasil pertobatan.
- source_word: ἀξίους τῆς μετανοίας
  choice: yang sesuai dengan pertobatan
  rationale: ἀξίους menyatakan kesepadanan atau kepatutan. Ungkapan ini alami dalam bahasa Indonesia dan menunjukkan bahwa perilaku harus selaras dengan pertobatan, bukan bahwa perilaku memperoleh pengampunan.
- source_word: μὴ ἄρξησθε λέγειν
  choice: jangan mulai berkata
  rationale: Mempertahankan unsur ‘mulai’ dalam konstruksi Yunani dan daya larangannya.
- source_word: ἐν ἑαυτοῖς
  choice: di antara kalian
  rationale: Frasa refleksif jamak dapat menunjuk pada perkataan dalam kelompok mereka; ambiguitas dengan perkataan batin dijelaskan dalam catatan kaki.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Abraham adalah bapak kami
  rationale: Mengungkapkan klaim keturunan Abraham secara alami dalam bahasa Indonesia tanpa kehilangan penekanannya.
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab aku berkata kepada kalian
  rationale: Mempertahankan rumusan penegasan yang dekat dengan teks Yunani dan hubungan kausal γάρ.
- source_word: δύναται
  choice: sanggup
  rationale: Menyatakan kemampuan atau kuasa Allah dengan ungkapan Indonesia yang ringkas dan berbobot.
- source_word: ἐκ τῶν λίθων τούτων
  choice: dari batu-batu ini
  rationale: Mempertahankan ἐκ sebagai asal atau sumber serta bentuk jamak λίθων.
- source_word: ἐγεῖραι
  choice: membangkitkan
  rationale: Padanan dekat untuk ἐγείρω yang di sini berarti membuat tampil atau menghadirkan anak-anak bagi Abraham, seraya mempertahankan gambaran kuat teks sumber.
theological_decisions:
- issue: Makna ‘buah-buah yang sesuai dengan pertobatan’
  choice: Tindakan nyata harus selaras dengan dan memperlihatkan pertobatan yang sungguh-sungguh.
  alternative: ‘Buah-buah yang layak bagi pertobatan’ atau bentuk kolektif ‘buah yang sepadan dengan pertobatan’.
  rationale: Teks menekankan kesesuaian antara perilaku dan pertobatan tanpa menyatakan bahwa tindakan tersebut memperoleh pengampunan.
- issue: Kedudukan keturunan Abraham
  choice: Yohanes menolak anggapan bahwa hubungan jasmani dengan Abraham dengan sendirinya memberi jaminan di hadapan Allah.
  alternative: Memperluas ‘anak-anak bagi Abraham’ menjadi ‘keturunan sejati Abraham’.
  rationale: Terjemahan mempertahankan ungkapan sumber dan kuasa Allah tanpa menambahkan definisi teologis yang tidak dinyatakan langsung.
- issue: Makna ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: ‘membangkitkan anak-anak bagi Abraham’
  alternative: ‘menjadikan batu-batu ini anak-anak Abraham’ atau ‘memunculkan keturunan bagi Abraham’.
  rationale: Pilihan ini mempertahankan metafora dan cakupan semantis verba Yunani tanpa menentukan mekanisme secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Pronomina jamak ‘kalian’ dipakai agar pembedaan jumlah dalam sapaan Yunani tetap jelas. ‘Bapak’ dipilih untuk relasi leluhur, sedangkan susunan kalimat dijaga alami bagi pembaca umum.
