  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: id
  text: Orang banyak terus bertanya kepadanya, “Jadi, apa yang harus kami lakukan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: terus bertanya
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; ‘terus bertanya’ menyampaikan aspek itu secara alami dalam bahasa Indonesia.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Bentuk jamak ini menunjuk kepada kelompok-kelompok orang yang berkumpul. ‘Orang banyak’ merupakan ungkapan Indonesia yang alami tanpa menyiratkan bahwa setiap orang berbicara serentak.
- source_word: λέγοντες
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam bahasa Indonesia, isi pertanyaan dapat langsung mengikuti verba ‘bertanya’; menerjemahkannya sebagai ‘dengan berkata’ akan terasa kaku dan berlebihan.
- source_word: Τί οὖν
  choice: Jadi, apa
  rationale: ‘Jadi’ mempertahankan hubungan kesimpulan dengan nasihat Yohanes sebelumnya dan terdengar alami dalam pertanyaan bahasa Indonesia.
- source_word: ποιήσωμεν
  choice: yang harus kami lakukan
  rationale: Subjungtif aoris dalam pertanyaan deliberatif secara wajar menyatakan permintaan arahan praktis; ‘harus kami lakukan’ mempertahankan nuansa tersebut.
