  text: τοῦ Μαθθὰτ τοῦ Λευὶ τοῦ Μελχὶ τοῦ Ἰανναὶ τοῦ Ἰωσὴφ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/024.yaml
  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: id
  text: anak Matat[a], anak Lewi, anak Melki, anak Yanai, anak Yusuf,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari Matat, dari Lewi, dari Melki, dari Yanai, dari Yusuf.” Bahasa Yunani melanjutkan silsilah dengan bentuk genitif yang diulang-ulang; hubungan “anak” tersirat dari konteks sekitarnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang diulang di depan setiap nama meneruskan hubungan anak yang sudah ditetapkan oleh konteks. Penggunaan “anak” membuat hubungan itu jelas dan wajar dalam bahasa Indonesia.
- source_word: Μαθθὰτ
  choice: Matat
  rationale: Nama pribadi ditransliterasikan ke bentuk Indonesia yang lazim dan mudah dibaca.
- source_word: Λευὶ
  choice: Lewi
  rationale: Bentuk baku bahasa Indonesia untuk nama Λευί.
- source_word: Μελχὶ
  choice: Melki
  rationale: Transliterasi yang dekat dengan bentuk Yunani Μελχί serta alami dalam ejaan Indonesia.
- source_word: Ἰανναὶ
  choice: Yanai
  rationale: Transliterasi ini mempertahankan bunyi awal dan akhiran nama Yunani Ἰανναί dalam ejaan Indonesia.
- source_word: Ἰωσὴφ
  choice: Yusuf
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia untuk Ἰωσήφ.
theological_decisions:
- issue: Elipsis dalam silsilah
  choice: Menyatakan “anak” sebelum setiap nama
  alternative: 'Mempertahankan rangkaian genitif secara lebih harfiah: “dari Matat, dari Lewi, dari Melki, dari Yanai, dari Yusuf”'
  rationale: Teks Yunani hanya mengulang bentuk genitif, tetapi konteks silsilah menyiratkan hubungan “anak”. Menyatakannya secara eksplisit menghasilkan bahasa Indonesia yang jelas tanpa menambahkan hubungan yang tidak terdapat dalam konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama disesuaikan dengan ejaan Indonesia, sedangkan pengulangan “anak” mempertahankan kejelasan pola silsilah.
