source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: id
  text: Namun Herodes, penguasa wilayah, ditegur[a] olehnya mengenai Herodias, istri saudaranya, dan mengenai semua perbuatan jahat yang dilakukan Herodes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dicela” atau “disingkapkan kesalahannya.” Kata Yunani ini dapat menyatakan teguran moral maupun penyingkapan perbuatan salah.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: penguasa wilayah
  rationale: Istilah ini menyatakan jabatan politik Herodes sebagai penguasa suatu wilayah. Padanan deskriptif ini lebih mudah dipahami pembaca Indonesia modern daripada transliterasi teknis “tetrark”, tanpa menyiratkan bahwa pada masa itu ia harus memerintah tepat seperempat kerajaan.
- source_word: ἐλεγχόμενος
  choice: ditegur
  rationale: Bentuk partisip pasif ini menggambarkan Herodes yang menerima teguran moral dari Yohanes. “Ditegur” mempertahankan daya kecaman etisnya, sementara kemungkinan nuansa penyingkapan kesalahan dicatat dalam catatan kaki.
- source_word: ὑπ’ αὐτοῦ
  choice: olehnya
  rationale: Teks Yunani memakai kata ganti yang dalam konteks merujuk kepada Yohanes. Kata ganti dipertahankan agar bentuk sumber tidak diperjelas secara berlebihan.
- source_word: περὶ Ἡρῳδιάδος
  choice: mengenai Herodias
  rationale: “Mengenai” mempertahankan hubungan formal yang juga diulang dalam frasa berikutnya dengan περὶ.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: istri saudaranya
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan hubungan yang menjadi pokok teguran, tanpa menentukan apakah saudara itu kakak atau adik karena bahasa Yunani tidak menentukannya.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: dan mengenai segala kejahatan yang telah dilakukan Herodes
  rationale: Susunan ini menyampaikan seluruh perbuatan jahat Herodes secara idiomatis. Nama Herodes diulang seperti dalam teks Yunani untuk menegaskan pelakunya.
- source_word: δὲ
  choice: Namun
  rationale: Kata penghubung ini menandai peralihan yang berkontras dengan uraian sebelumnya dan alami pada awal kalimat bahasa Indonesia.
theological_decisions:
- issue: Daya moral teguran Yohanes terhadap Herodes
  choice: ἐλεγχόμενος diterjemahkan “ditegur”
  alternative: “dicela”, “diperingatkan”, atau “disingkapkan kesalahannya”
  rationale: “Ditegur” mempertahankan tindakan korektif dan kecaman moral yang terdapat dalam konteks tanpa mengubahnya menjadi putusan hukum atau menambahkan penafsiran teologis.
- issue: Hubungan Herodias dengan saudara Herodes
  choice: “istri saudaranya”
  alternative: Memperinci identitas saudara atau status perkawinannya berdasarkan ayat paralel dan data sejarah
  rationale: Terjemahan membatasi diri pada informasi dalam frasa Yunani ini dan tidak memasukkan rincian dari sumber lain.
translation_notes:
  register: Bahasa dibuat modern, lugas, dan bermartabat. “Penguasa wilayah” dipilih sebagai padanan fungsional bagi gelar politik τετραάρχης. Tanda koma di akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat 20.
