id: LUK.3.38
reference: Luke 3:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: id
  text: anak Enos[a], anak Set, anak Adam, anak Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Yunani hanya mengulang pola genitif: “dari Enos, dari Set, dari Adam, dari Allah”; kata “anak” ditambahkan berdasarkan pola silsilah yang sudah terbentuk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: anak Enos
  rationale: Pola berulang artikel genitif dan nama diri meneruskan rumusan silsilah Lukas; kata hubungan ‘anak’ tersirat dan perlu dinyatakan agar alami serta jelas dalam bahasa Indonesia. Bentuk ‘Enos’ mengikuti nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: τοῦ Σὴθ
  choice: anak Set
  rationale: Konstruksi genitif eliptis yang sama menunjukkan hubungan keturunan. ‘Set’ ialah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: τοῦ Ἀδὰμ
  choice: anak Adam
  rationale: Pola silsilah tetap menyiratkan hubungan anak dengan leluhur sebelumnya. ‘Adam’ dipertahankan sebagai nama diri, bukan diterjemahkan sebagai ‘manusia’.
- source_word: τοῦ θεοῦ
  choice: anak Allah
  rationale: Genitif terakhir mengikuti pola silsilah yang sama, sehingga ‘anak’ tetap dinyatakan. ‘Allah’ merupakan padanan baku θεός dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan frasa terakhir τοῦ θεοῦ dalam silsilah Adam
  choice: anak Allah
  alternative: milik Allah; berasal dari Allah
  rationale: Secara formal, bahasa Yunani hanya memakai frasa genitif, tetapi pola silsilah yang berulang menyiratkan hubungan ‘anak’ pada setiap mata rantai. Terjemahan ini mempertahankan pola sastra dan daya teologis pernyataan bahwa Adam berasal langsung dari Allah, tanpa menyamakan jenis keanakannya dengan kategori kristologis.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk nama mengikuti kelaziman Alkitab Indonesia. Penanda catatan kaki ditempatkan setelah nama pertama agar menjelaskan pola eliptis yang berlaku bagi seluruh rangkaian.
