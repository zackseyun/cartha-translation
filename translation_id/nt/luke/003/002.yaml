  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: id
  text: pada masa jabatan imam besar Hanas dan Kayafas[a], firman Allah datang kepada Yohanes, anak Zakharia, di padang belantara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “pada masa imam besar Hanas dan Kayafas.” Teks Yunani menyebut kedua orang itu, meskipun kata “imam besar” berbentuk tunggal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: pada masa jabatan imam besar Hanas dan Kayafas
  rationale: ἐπί dengan genitif berfungsi secara temporal, yaitu ‘pada masa’. Frasa ‘jabatan imam besar’ mempertahankan bentuk tunggal ἀρχιερέως sekaligus tetap menyebut kedua tokoh sebagaimana teks Yunani.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: firman Allah datang
  rationale: Ini adalah ungkapan profetik yang menyatakan bahwa Allah menyampaikan firman-Nya. ‘Datang’ mengungkapkan daya peristiwa dari ἐγένετο secara wajar tanpa menerjemahkannya secara kaku sebagai ‘terjadi’.
- source_word: ἐπὶ Ἰωάννην
  choice: kepada Yohanes
  rationale: ἐπί dengan akusatif di sini menunjukkan bahwa firman itu datang kepada Yohanes; ‘kepada’ alami dalam bahasa Indonesia dan sesuai dengan ungkapan pewahyuan.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: anak Zakharia
  rationale: Frasa aposisional ini mengenali Yohanes melalui nama ayahnya. Bentuk ‘anak Zakharia’ ringkas, alami, dan tetap bermartabat.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: ἔρημος menunjuk wilayah sepi dan jarang dihuni, bukan mesti gurun berpasir. ‘Padang belantara’ mempertahankan nuansa tempat sunyi yang terkait dengan pelayanan Yohanes.
theological_decisions:
- issue: Penyebutan Hanas dan Kayafas bersama bentuk tunggal ἀρχιερέως
  choice: 'Mempertahankan jabatan secara tunggal: ‘pada masa jabatan imam besar Hanas dan Kayafas’'
  alternative: ketika Hanas dan Kayafas menjadi imam-imam besar
  rationale: Teks Yunani memakai bentuk tunggal ἀρχιερέως tetapi menyebut dua orang. Terjemahan mempertahankan ketegangan historis dan sastrawi ini tanpa menyelaraskan atau menjelaskannya di dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. ‘Hanas’, ‘Kayafas’, ‘Yohanes’, dan ‘Zakharia’ mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. ‘Padang belantara’ dipilih untuk menghindari kesan bahwa tempat itu harus berupa gurun pasir.
