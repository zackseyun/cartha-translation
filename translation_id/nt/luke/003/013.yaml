  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Jangan memungut lebih daripada yang telah ditetapkan bagimu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Jawabnya
  rationale: Dalam alur dialog, δέ merupakan penghubung ringan, sedangkan εἶπεν menanggapi pertanyaan pada ayat sebelumnya. “Jawabnya” menyampaikan kesinambungan dan fungsi respons itu secara alami tanpa menonjolkan pertentangan.
- source_word: εἶπεν πρὸς αὐτούς
  choice: kepada mereka
  rationale: Bersama “Jawabnya,” frasa ini secara alami menjadi “Jawabnya kepada mereka,” yang mempertahankan sasaran ujaran tanpa ungkapan yang kaku.
- source_word: Μηδὲν πλέον
  choice: Jangan ... lebih
  rationale: Bentuk ini menyampaikan larangan terhadap tindakan yang melampaui jumlah semestinya dan cocok dengan aktivitas pemungutan dalam konteks.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: daripada yang telah ditetapkan bagimu
  rationale: “Telah ditetapkan” mempertahankan aspek perfektif dan bentuk pasif διατεταγμένον serta nuansa ketentuan resmi; “bagimu” mengacu secara kolektif kepada para pemungut pajak yang disapa.
- source_word: πράσσετε
  choice: memungut
  rationale: Walaupun πράσσω secara umum berarti “melakukan,” dalam konteks langsung para pemungut pajak, kata ini menunjuk pada kegiatan memungut pajak. “Memungut” membuat objek tersirat itu jelas secara wajar tanpa menambahkan gagasan baru.
theological_decisions:
- issue: Pengkhususan kontekstual dari tindakan yang tersirat dalam πράσσετε
  choice: 'Menjadikan kegiatan pemungutan tersurat: “Jangan memungut lebih ...”'
  alternative: “Jangan melakukan apa pun melebihi yang telah ditetapkan bagimu.”
  rationale: Ayat sebelumnya secara langsung menyebut para pemungut pajak. Karena itu, “memungut” merupakan pengungkapan kontekstual yang wajar, bukan penafsiran doktrinal, dan menghindarkan kalimat Indonesia yang terlalu umum atau kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Bagimu” dipertahankan karena alami dalam register Kitab Suci dan menyatakan sapaan jamak secara kolektif; “ditetapkan” membawa nuansa resmi tanpa mempersempit pihak yang menetapkannya.
