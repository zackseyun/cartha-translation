id: LUK.3.11
reference: Luke 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: id
  text: Ia menjawab mereka, “Orang yang mempunyai dua helai tunik[a] harus berbagi dengan orang yang tidak mempunyainya, dan orang yang mempunyai makanan harus berbuat demikian juga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baju” atau “pakaian”; kata Yunani ini menunjuk pada tunik, yaitu pakaian dasar yang dikenakan dekat tubuh.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Ia menjawab mereka
  rationale: Ungkapan ini memperkenalkan tanggapan Yohanes. Bahasa Indonesia alami tidak perlu mempertahankan bentuk partisipial dan imperfek secara kaku; bentuk ini menyampaikan tindakan menjawab dengan jelas, sementara δέ sebagai penghubung ringan tidak perlu dinyatakan tersendiri.
- source_word: Ὁ ἔχων
  choice: Orang yang mempunyai
  rationale: Partisipel substantival tunggal ini bersifat umum. Pilihan ini mempertahankan cakupan generiknya secara alami tanpa memasukkan penanda gender yang tidak diperlukan dalam bahasa Indonesia.
- source_word: δύο χιτῶνας
  choice: dua helai tunik
  rationale: χιτών menunjuk pada pakaian dasar yang dikenakan dekat tubuh, bukan secara khusus kemeja modern atau pakaian luar. Kata penggolong 'helai' membuat frasa tersebut alami dalam bahasa Indonesia.
- source_word: μεταδότω
  choice: harus berbagi
  rationale: Imperatif orang ketiga menyatakan perintah atau desakan etis. 'Harus berbagi' menyampaikan kekuatan itu dengan jelas dan tetap mempertahankan gagasan memberi bagian kepada orang lain.
- source_word: τῷ μὴ ἔχοντι
  choice: dengan orang yang tidak mempunyainya
  rationale: Frasa datif ini menunjuk kepada orang yang tidak memiliki benda yang sedang dibicarakan. Akhiran '-nya' menjadikan rujukan kepada tunik eksplisit dan alami.
- source_word: βρώματα
  choice: makanan
  rationale: Bentuk jamak ini mencakup berbagai bahan atau barang makanan; 'makanan' adalah padanan umum yang paling jelas dalam bahasa Indonesia.
- source_word: ὁμοίως ποιείτω
  choice: harus berbuat demikian juga
  rationale: Frasa ini memperluas perintah yang sama kepada orang yang memiliki makanan. Pilihan tersebut mempertahankan kesejajaran dan daya imperatifnya.
theological_decisions:
- issue: Bentuk tunggal representatif dan ungkapan gender
  choice: Orang yang mempunyai ... orang yang mempunyai ...
  alternative: Barang siapa mempunyai ... barang siapa mempunyai ...
  rationale: Partisipel maskulin tunggal dalam bahasa Yunani dipakai secara generik. Bahasa Indonesia tidak menandai gender dalam ungkapan ini, sehingga cakupan umum dapat dipertahankan tanpa menambahkan pembatasan gender.
- issue: Kekuatan perintah untuk berbagi
  choice: harus berbagi ... harus berbuat demikian juga
  alternative: hendaklah berbagi ... hendaklah berbuat demikian juga
  rationale: Kedua verba Yunani berbentuk imperatif orang ketiga. 'Harus' menyampaikan tuntutan etis yang tegas dalam bahasa Indonesia modern tanpa mengubahnya menjadi sekadar saran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Tunik' dipertahankan demi ketepatan budaya, lalu dijelaskan dalam catatan kaki. Susunan kalimat dibuat alami tanpa menghilangkan kesejajaran kedua perintah.
