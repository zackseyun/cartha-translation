lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam rangkaian silsilah Lukas, artikel genitif yang berulang bersifat eliptis dan menyatakan hubungan keturunan. Kata “anak” menyampaikan hubungan itu secara alami dalam bahasa Indonesia tanpa mengulang “dari”.
- source_word: Καϊνὰμ
  choice: Kainan
  rationale: Nama ini dialihaksarakan sesuai bentuk Yunani dan kebiasaan penamaan Alkitab bahasa Indonesia.
- source_word: Ἀρφαξὰδ
  choice: Arfaksad
  rationale: Bentuk ini mengikuti nama Yunani dalam Lukas dan tetap mudah dikenali oleh pembaca Indonesia; bentuk Perjanjian Lama yang bersumber dari bahasa Ibrani dapat berbeda.
- source_word: Σὴμ
  choice: Sem
  rationale: Bentuk baku dan dikenal luas dalam Alkitab bahasa Indonesia untuk nama ini.
- source_word: Νῶε
  choice: Nuh
  rationale: Bentuk nama yang mapan dan mudah dikenali dalam bahasa Indonesia, meskipun bentuk Yunani lebih langsung dapat dialihaksarakan sebagai Noe.
- source_word: Λάμεχ
  choice: Lamekh
  rationale: Alih aksara yang mempertahankan bunyi konsonan akhir nama Yunani dan selaras dengan bentuk yang dikenal dalam tradisi Alkitab Indonesia.
theological_decisions:
- issue: Pencantuman Kainan dalam silsilah Lukas di antara Arfaksad dan Sem
  choice: Kainan dipertahankan dalam teks utama sesuai SBLGNT.
  alternative: Sebagian tradisi menghilangkan Kainan agar silsilah ini lebih selaras dengan bentuk tertentu dalam Perjanjian Lama.
  rationale: Teks Yunani SBLGNT memuat Καϊνὰμ. Karena itu, terjemahan mempertahankan nama tersebut dan tidak menyelaraskan Lukas secara diam-diam dengan silsilah lain.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan alami untuk rangkaian silsilah. Nama-nama menggunakan bentuk yang mudah dikenali pembaca modern, sedangkan catatan kaki menjaga transparansi mengenai alih aksara dan variasi tradisi teks.
