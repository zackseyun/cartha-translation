  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: id
  text: Para pemungut pajak juga datang untuk dibaptis dan berkata kepadanya, “Guru, apa yang harus kami lakukan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: datang
  rationale: Bentuk aoristus indikatif paling wajar diterjemahkan sebagai peristiwa lampau sederhana; konteks narasi Indonesia sudah menandai waktu lampau tanpa perlu penanda khusus.
- source_word: δὲ καὶ τελῶναι
  choice: Para pemungut pajak juga
  rationale: δέ mengembangkan narasi, sedangkan καί menyatakan penambahan. Susunan ini mempertahankan arti bahwa kelompok tersebut turut datang tanpa memperkuatnya secara berlebihan menjadi 'bahkan'.
- source_word: βαπτισθῆναι
  choice: untuk dibaptis
  rationale: Infinitif pasif aoristus sesudah ἦλθον menyatakan tujuan kedatangan mereka.
- source_word: εἶπαν πρὸς αὐτόν
  choice: berkata kepadanya
  rationale: Terjemahan ini mempertahankan verba umum λέγω dan konstruksi πρὸς dengan objek, meskipun isi perkataannya berupa pertanyaan.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini menerjemahkan peran διδάσκαλος secara langsung, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: τί ποιήσωμεν
  choice: apa yang harus kami lakukan?
  rationale: Subjungtif deliberatif menanyakan tindakan yang patut dilakukan; 'harus' menyampaikan daya praktisnya secara alami tanpa mengubahnya menjadi perintah.
theological_decisions:
- issue: Keikutsertaan kelompok pemungut pajak dalam tanggapan terhadap seruan Yohanes
  choice: Memakai 'juga' untuk mempertahankan daya aditif καί.
  alternative: Memakai 'bahkan' untuk menonjolkan sifat mengejutkan dari keikutsertaan mereka.
  rationale: Teks Yunani dengan δὲ καὶ secara aman mendukung arti aditif. 'Juga' mempertahankan keikutsertaan kelompok yang dipandang buruk secara sosial tanpa memasukkan penilaian retoris yang lebih kuat daripada yang diwajibkan bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan mudah dipahami. 'Pemungut pajak' merupakan padanan umum dan tepat bagi τελῶναι; 'kami' sesuai karena para pemungut pajak bertanya sebagai kelompok kepada Yohanes.
