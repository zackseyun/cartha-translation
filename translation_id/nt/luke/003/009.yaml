  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: id
  text: Bahkan sekarang, kapak itu sudah terletak di akar pohon-pohon[a]. Karena itu, setiap pohon yang tidak menghasilkan buah yang baik[b] ditebang dan dilemparkan ke dalam api[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kapak itu sudah diletakkan di akar pohon-pohon.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang tidak berbuah baik.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dicampakkan ke dalam api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Bahkan, ... sudah
  rationale: Menjaga penekanan tambahan dari δὲ καὶ serta makna waktu ἤδη, yaitu bahwa penghakiman sudah dekat dan siap dilaksanakan, dalam susunan bahasa Indonesia yang alami.
- source_word: ἡ ἀξίνη
  choice: kapak
  rationale: Istilah umum dan jelas untuk alat penebang yang menjadi gambaran penghakiman.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: sudah tersedia pada akar pohon-pohon
  rationale: Kata κεῖται secara harfiah menyatakan bahwa kapak itu berada atau terletak di sana. 'Sudah tersedia' secara alami menyampaikan posisi sekaligus kesiapan untuk menebang tanpa mengubah metaforanya.
- source_word: πᾶν οὖν δένδρον
  choice: Karena itu, setiap pohon
  rationale: Οὖν menyatakan kesimpulan atau akibat dari peringatan sebelumnya; 'Karena itu' membuat hubungan logis tersebut jelas.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: yang tidak menghasilkan buah yang baik
  rationale: Dalam hubungan dengan buah, ποιέω secara idiomatis berarti menghasilkan. Susunan ini mempertahankan gambaran hasil moral atau rohani tanpa menjelaskannya lebih jauh daripada teks.
- source_word: ἐκκόπτεται
  choice: ditebang
  rationale: Padanan alami dalam konteks pohon dan tetap mempertahankan bentuk pasif kala kini bahasa Yunani.
- source_word: εἰς πῦρ βάλλεται
  choice: dilemparkan ke dalam api
  rationale: Padanan langsung dan wajar yang mempertahankan bentuk pasif serta kerasnya gambaran penghakiman.
theological_decisions:
- issue: Gambaran metaforis tentang penghakiman
  choice: Mempertahankan gambaran kapak, pohon yang tidak berbuah baik, penebangan, dan api sebagai peringatan tentang penghakiman yang sudah dekat.
  alternative: Menafsirkan api secara khusus sebagai neraka, atau membatasi seluruh gambaran hanya pada penghakiman historis atas Israel.
  rationale: Ayat ini dengan jelas menyatakan penghakiman yang berat dan dekat, tetapi tidak menentukan secara sempit apakah api itu menunjuk pada penghakiman sementara, penghakiman akhir, atau keduanya. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur kalimat dibuat lugas bagi pembaca umum, sementara metafora pertanian, bentuk pasif, ketegangan waktu, dan ketidakjelasan rujukan teologis api tetap dipertahankan.
