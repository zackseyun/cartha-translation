  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: id
  text: anak Aminadab[a], anak Admin, anak Arni, anak Hezron, anak Peres, anak Yehuda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “anak Aminadab, anak Admin, anak Aram,” sedangkan naskah-naskah lain tidak memuat “Admin” dan berbunyi “anak Aminadab, anak Aram.”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang berulang bersifat eliptis dan meneruskan hubungan silsilah dari ayat sebelumnya. Ungkapan “anak” menyatakan hubungan itu secara alami dan ringkas dalam bahasa Indonesia.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan tetap dekat dengan nama Yunani serta bentuk Semit yang mendasarinya.
- source_word: Ἀδμίν
  choice: Admin
  rationale: Transliterasi langsung nama Yunani sesuai teks SBLGNT yang diberikan.
- source_word: Ἀρνί
  choice: Arni
  rationale: Transliterasi pembacaan yang tercetak dalam SBLGNT; varian “Aram” dicatat dalam catatan kaki.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Bentuk yang selaras dengan nama tokoh Perjanjian Lama dan mudah dikenali pembaca Indonesia.
- source_word: Φαρές
  choice: Peres
  rationale: Bentuk nama Perjanjian Lama yang lazim dalam bahasa Indonesia, alih-alih transliterasi yang lebih mengikuti bentuk Yunani.
- source_word: Ἰούδα
  choice: Yehuda
  rationale: Bentuk yang lazim untuk leluhur dan suku Israel dalam konteks Perjanjian Lama serta menghindari kerancuan dengan tokoh Perjanjian Baru yang biasa disebut Yudas.
