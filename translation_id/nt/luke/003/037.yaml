  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: id
  text: anak Metusalah, anak Henokh, anak Yared, anak Mahalaleel, anak Kenan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memuat Καϊνάμ (dapat dialihaksarakan Kainam atau Kainan); dalam silsilah Perjanjian Lama, nama ini lazim ditulis Kenan.
    reason: Menjelaskan bentuk Yunani serta bentuk nama Indonesia yang lazim, sambil menegaskan bahwa nama itu terdapat dalam teks Yunani.
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Artikel genetif yang berulang meneruskan rumus silsilah secara eliptis. Dalam bahasa Indonesia, “anak” menyatakan hubungan yang dipahami dari konteks dengan wajar dan jelas.
- source_word: Μαθουσαλά
  choice: Metusalah
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam Alkitab bahasa Indonesia.
- source_word: Ἑνώχ
  choice: Henokh
  rationale: Bentuk nama baku dalam tradisi Alkitab bahasa Indonesia untuk tokoh yang bersangkutan.
- source_word: Ἰάρετ
  choice: Yared
  rationale: Bentuk Indonesia yang lazim bagi nama tokoh dalam silsilah Kejadian.
- source_word: Μαλελεήλ
  choice: Mahalaleel
  rationale: Bentuk yang dikenal dalam Alkitab bahasa Indonesia dan tetap cukup dekat dengan nama Yunani.
- source_word: Καϊνάμ
  choice: Kenan
  rationale: Dipilih sebagai bentuk nama yang lazim bagi tokoh Perjanjian Lama yang dimaksud; bentuk Yunani Καϊνάμ juga dapat dialihaksarakan lebih langsung sebagai Kainam atau Kainan.
theological_decisions:
- issue: Elipsis hubungan keturunan dalam rangkaian bentuk genetif
  choice: Mengulang “anak” sebelum setiap nama
  alternative: Memakai rangkaian harfiah dengan “dari”
  rationale: Konteks silsilah menunjukkan bahwa setiap bentuk genetif menyatakan hubungan keturunan. Penggunaan “anak” membuat maksud itu jelas tanpa menambahkan penafsiran doktrinal.
- issue: Bentuk nama Καϊνάμ
  choice: Kenan dalam teks utama
  alternative: Kainam atau Kainan
  rationale: Nama yang terdapat dalam teks Yunani tetap dicantumkan dan tidak dihilangkan. Bentuk “Kenan” dipakai agar tokohnya mudah dikenali oleh pembaca Indonesia, sedangkan alih aksara yang lebih langsung dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan “anak” mempertahankan irama silsilah sekaligus membuat hubungan antarnama jelas. Penanda catatan kaki ditempatkan sesudah nama yang dibahas.
