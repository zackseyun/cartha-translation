  yaml_path: translation/nt/luke/003/028.yaml
  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: id
  text: anak Malkhi[a], anak Adi, anak Kosam, anak Elmadam, anak Er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani mengulang artikel bentuk genitif di depan setiap nama. Hubungan “anak (dari)” dipahami secara eliptis dari pola silsilah dalam konteks; kata “anak” ditambahkan untuk memperjelasnya dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: anak
  rationale: Dalam silsilah Lukas, artikel genitif yang diulang di depan setiap nama dipakai secara eliptis untuk melanjutkan hubungan ‘anak dari’ yang sudah jelas dari konteks. Bahasa Indonesia secara alami cukup mengulang ‘anak’ tanpa ‘dari’.
- source_word: Μελχὶ
  choice: Malkhi
  rationale: Nama pribadi ditransliterasikan ke dalam ejaan Indonesia; bentuk Malkhi mencerminkan bunyi Yunani dan membedakannya dengan wajar sebagai nama.
- source_word: Ἀδδὶ
  choice: Adi
  rationale: Nama pribadi ditransliterasikan secara wajar dalam ejaan Indonesia; konsonan rangkap Yunani tidak perlu dipertahankan sebagai huruf rangkap dalam bentuk Indonesia.
- source_word: Κωσὰμ
  choice: Kosam
  rationale: Nama pribadi ditransliterasikan langsung dengan K, sesuai nilai huruf Yunani kappa dan kebiasaan ejaan Indonesia.
- source_word: Ἐλμαδὰμ
  choice: Elmadam
  rationale: Nama pribadi ditransliterasikan langsung ke dalam ejaan Indonesia.
- source_word: Ἢρ
  choice: Er
  rationale: Nama pribadi ditransliterasikan sebagai Er; tidak ada tanda dalam teks Yunani yang menuntut penambahan bunyi h.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan ‘anak’ mempertahankan irama silsilah sekaligus menjelaskan hubungan antarnama. Tanda catatan kaki ditempatkan setelah nama pertama sebagai penjelasan yang berlaku bagi seluruh rangkaian.
