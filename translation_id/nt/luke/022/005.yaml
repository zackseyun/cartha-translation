  text: And they rejoiced and agreed to give him money[a].
translation:
  language: id
  text: Mereka pun bersukacita dan sepakat untuk memberinya uang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perak.” Kata Yunani ini dapat berarti perak secara harfiah atau uang secara lebih umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: bersukacita
  rationale: Bentuk aoris dari χαίρω menyatakan tanggapan kegembiraan yang kuat. “Bersukacita” alami dan bermartabat, serta mempertahankan kekuatan ungkapan Yunani.
- source_word: συνέθεντο
  choice: sepakat
  rationale: Bentuk medial συντίθεμαι di sini berarti mencapai persetujuan. “Sepakat” ringkas dan lazim dalam bahasa Indonesia tanpa menambahkan gagasan janji yang tidak dinyatakan secara langsung.
- source_word: αὐτῷ
  choice: -nya dalam “memberinya”
  rationale: Pronomina datif ini menjadi objek tak langsung dari δοῦναι. Bentuk “memberinya uang” menyampaikan hubungan gramatikal itu secara alami.
- source_word: ἀργύριον
  choice: uang
  rationale: Walaupun secara harfiah dapat berarti “perak,” dalam konteks transaksi kata ini lazim menunjuk pada uang. Alternatif harfiahnya dipertahankan dalam catatan kaki.
- source_word: δοῦναι
  choice: untuk memberi
  rationale: Infinitif ini menyatakan isi kesepakatan. “Memberi” merupakan padanan langsung dan tidak menambahkan nuansa “membayar,” meskipun konteks memungkinkan pemahaman tersebut.
theological_decisions: []
