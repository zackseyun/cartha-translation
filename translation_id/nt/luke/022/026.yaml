id: LUK.22.26
reference: Luke 22:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: id
  text: Namun, kalian tidak boleh seperti itu.[a] Sebaliknya, hendaklah orang yang lebih tinggi kedudukannya di antara kalian menjadi seperti orang yang lebih muda,[b] dan orang yang memimpin seperti orang yang melayani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, tidak demikian dengan kalian.” Ungkapan Yunani ini eliptis dan dengan tajam membedakan para murid Yesus dari pola mengejar kedudukan yang baru saja disebutkan.
    reason: alternative_reading
  - marker: b
    text: “Orang yang lebih muda” menunjuk pada orang yang secara sosial berkedudukan lebih rendah, bukan hanya orang yang usianya lebih muda.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Namun, janganlah demikian di antara kalian
  rationale: Ungkapan Yunani ini eliptis dan menegaskan pertentangan dengan pola mengejar kedudukan pada ayat sebelumnya. Bentuk larangan yang tersirat dinyatakan secara alami tanpa mempersempit maksudnya.
- source_word: ἀλλ’
  choice: Sebaliknya
  rationale: Menandai peralihan adversatif yang kuat menuju petunjuk positif Yesus.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: orang yang lebih besar di antara kalian
  rationale: Mempertahankan bentuk komparatif μείζων dan nuansa kedudukan atau status dalam komunitas, bukan mengubahnya menjadi superlatif.
- source_word: γινέσθω
  choice: hendaklah ... menjadi
  rationale: Mempertahankan daya imperatif serta gagasan menjadi atau mengambil sikap tertentu, bukan sekadar keadaan statis.
- source_word: ὡς ὁ νεώτερος
  choice: seperti orang yang lebih muda
  rationale: Mempertahankan bentuk komparatif νεώτερος; dalam konteks sosial, orang yang lebih muda juga berkedudukan lebih rendah.
- source_word: ὁ ἡγούμενος
  choice: orang yang memimpin
  rationale: Menerjemahkan partisip secara verbal dan alami tanpa memasukkan pengertian jabatan gerejawi tertentu.
- source_word: ὡς ὁ διακονῶν
  choice: seperti orang yang melayani
  rationale: Mempertahankan arti aktif dari διακονῶν, yakni melakukan pelayanan kepada orang lain.
theological_decisions:
- issue: Sifat ajaran Yesus tentang kedudukan dan kepemimpinan
  choice: Ayat diterjemahkan sebagai pembalikan etis atas kedudukan sosial di kalangan para murid, dengan kepemimpinan disamakan dengan pelayanan.
  alternative: Menggunakan bahasa kelembagaan yang lebih tegas mengenai jabatan atau kekuasaan.
  rationale: Teks Yunani mempertentangkan orang yang lebih besar dan orang yang memimpin dengan orang yang lebih muda dan orang yang melayani. Terjemahan mempertahankan tuntutan kerendahan hati tanpa memasukkan struktur gerejawi yang muncul kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina “kalian” dipakai untuk memperjelas bentuk jamak ὑμεῖς. Susunan paralel teks sumber dipertahankan, sedangkan kedua catatan kaki menjaga sifat eliptis dan latar sosial ungkapan Yunani.
