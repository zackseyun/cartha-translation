source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: id
  text: Lalu Tuhan berpaling dan memandang Petrus[a]. Petrus pun teringat akan perkataan Tuhan yang telah dikatakan-Nya kepadanya, “Sebelum ayam berkokok hari ini, engkau akan menyangkal Aku tiga kali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menatap Petrus”; kata Yunani yang dipakai dapat menyiratkan pandangan yang langsung atau sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: berpaling
  rationale: Partisip aoris ini menyatakan tindakan Tuhan yang mendahului pandangan-Nya kepada Petrus. “Berpaling” alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar ini merujuk kepada Yesus dan mempertahankan bobot pemakaian κύριος dalam Perjanjian Baru.
- source_word: ἐνέβλεψεν
  choice: memandang
  rationale: ἐμβλέπω dapat menyiratkan tatapan langsung atau sungguh-sungguh. “Memandang” cocok untuk konteks dan tidak melebih-lebihkan nuansa intensitas; kemungkinan nuansa yang lebih kuat dicatat dalam catatan kaki.
- source_word: ὑπεμνήσθη
  choice: teringat
  rationale: Bentuk ini dapat dipahami sebagai “diingatkan” atau “teringat”. Dalam konteks, hasilnya ialah Petrus mengingat perkataan Tuhan; “teringat” idiomatis dan tetap memungkinkan bahwa pandangan Tuhan memicu ingatan itu.
- source_word: λόγου
  choice: perkataan
  rationale: λόγος di sini menunjuk pada ucapan tertentu yang sebelumnya disampaikan Yesus. “Perkataan” lebih alami daripada “firman” dalam narasi percakapan ini tanpa mengurangi wibawa ucapan tersebut.
- source_word: ὡς εἶπεν αὐτῷ
  choice: kepadanya
  rationale: Konstruksi ini memperkenalkan isi perkataan yang diingat Petrus. Dalam bahasa Indonesia, hubungan tersebut dapat disampaikan secara alami melalui “perkataan Tuhan kepadanya” sebelum kutipan langsung.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Sebelum ayam berkokok
  rationale: πρίν dengan infinitif menyatakan waktu yang mendahului suatu peristiwa. Nomina tanpa artikel diterjemahkan secara alami sebagai “ayam”; dalam konteks Indonesia, “ayam berkokok” jelas merujuk pada ayam jantan.
- source_word: σήμερον
  choice: hari ini
  rationale: Terjemahan langsung yang mempertahankan kesegeraan waktu dalam nubuat Yesus.
- source_word: ἀπαρνήσῃ
  choice: engkau akan menyangkal
  rationale: Kata ini menyatakan penyangkalan terhadap hubungan atau pengenalan akan Yesus. “Menyangkal” adalah padanan baku dan tepat dalam konteks kisah sengsara.
- source_word: τρίς
  choice: tiga kali
  rationale: Padanan modern dan jelas yang mempertahankan jumlah pengulangan secara tepat.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: Guru
  rationale: “Tuhan” mempertahankan gelar naratif dan bobot kristologis κύριος, sedangkan “Guru” akan mempersempit maknanya.
- issue: Makna ὑπεμνήσθη
  choice: teringat
  alternative: diingatkan
  rationale: “Teringat” menyampaikan pengalaman Petrus secara alami, tetapi tidak menutup kemungkinan bahwa pandangan Tuhan menjadi pemicunya. Bentuk pasif “diingatkan” dapat terlalu menentukan bagaimana tindakan itu terjadi.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Engkau” dan “Aku” dipakai dalam kutipan langsung untuk mempertahankan ragam Alkitab yang akrab tanpa menjadi arkais. Susunan kalimat diatur agar hubungan antara ingatan Petrus dan kutipan perkataan Tuhan jelas.
