  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: id
  text: Ia menyetujuinya, lalu mulai mencari kesempatan untuk menyerahkan Yesus kepada mereka tanpa kehadiran orang banyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: menyetujuinya
  rationale: Dalam konteks tanggapan Yudas terhadap rencana para imam kepala dan kepala pengawal Bait Allah (ay. 4–5), verba ini berarti menyatakan persetujuan. Bentuk dengan akhiran -nya wajar dalam bahasa Indonesia dan merujuk pada kesepakatan tersebut.
- source_word: ἐζήτει
  choice: mulai mencari
  rationale: Bentuk imperfek menggambarkan tindakan yang mulai berlangsung atau berlanjut. 'Mulai mencari' menandai perkembangan cerita setelah Yudas menyetujui rencana itu.
- source_word: εὐκαιρίαν
  choice: kesempatan
  rationale: Kata ini menunjuk pada waktu atau keadaan yang cocok untuk bertindak; 'kesempatan' merupakan padanan Indonesia yang alami dan tepat.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: untuk menyerahkan Yesus
  rationale: '''Menyerahkan'' mempertahankan arti dasar παραδίδωμι dan konsistensi leksikal dalam kisah sengsara. Nama ''Yesus'' dipakai untuk memperjelas rujukan pronomina Yunani tanpa mengubah makna.'
- source_word: ἄτερ ὄχλου
  choice: tanpa diketahui orang banyak
  rationale: Ungkapan Yunani secara harfiah berarti 'tanpa/terpisah dari orang banyak'. Dalam konteks penangkapan rahasia, rumusan ini mengungkapkan bahwa penyerahan dicari saat orang banyak tidak hadir atau tidak mengetahuinya, meski mengandung sedikit eksplisitasi kontekstual.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Datif ini menunjukkan penerima penyerahan, yaitu para imam kepala dan kepala pengawal Bait Allah yang disebut dalam konteks sebelumnya.
theological_decisions:
- issue: Makna παραδοῦναι dalam tindakan Yudas
  choice: menyerahkan
  alternative: mengkhianati
  rationale: '''Menyerahkan'' mengikuti arti leksikal verba Yunani dan menjaga kaitannya dengan pemakaian verba yang sama sepanjang kisah sengsara, sedangkan ''mengkhianati'' merupakan penafsiran yang sah berdasarkan peran Yudas.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat mengikuti alur naratif Yunani dengan mempertahankan makna dasar 'menyerahkan' serta memperjelas pronomina 'dia' sebagai 'Yesus'. Marker catatan kaki [a] ditempatkan dalam teks utama.
