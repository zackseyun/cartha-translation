  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: id
  text: Sebab Anak Manusia memang pergi sesuai dengan apa yang telah ditetapkan. Namun, celakalah orang itu yang melaluinya Anak Manusia diserahkan![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikhianati.” Kata Yunani ini dapat berarti “diserahkan” atau “dikhianati,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteksnya, kata ini memperkenalkan alasan bagi pernyataan sebelumnya dan menghubungkan ayat secara alami.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan gelar yang lazim bagi sebutan diri Yesus serta gema antarteksnya.
- source_word: μέν … πλὴν
  choice: memang … Namun
  rationale: Menyatakan kontras antara jalan Anak Manusia yang telah ditetapkan dan pertanggungjawaban orang yang menyerahkan-Nya.
- source_word: κατὰ τὸ ὡρισμένον
  choice: sesuai dengan apa yang telah ditetapkan
  rationale: Mempertahankan makna penetapan sebelumnya dan bentuk pasif tanpa menyebutkan pelaku yang tidak dinyatakan dalam teks Yunani.
- source_word: πορεύεται
  choice: pergi
  rationale: Padanan langsung yang dalam konteks ini menunjuk kepada perjalanan Anak Manusia menuju kematian-Nya tanpa memperjelasnya secara berlebihan.
- source_word: οὐαὶ
  choice: celakalah
  rationale: Mempertahankan daya profetis ungkapan yang dapat menyatakan ratapan sekaligus ancaman hukuman.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: orang yang
  rationale: Merujuk kepada individu tertentu yang menjadi perantara penyerahan; susunan relatif ini lebih alami dalam bahasa Indonesia daripada padanan harfiah 'orang itu' dalam klausa ini.
- source_word: δι’ οὗ
  choice: oleh dia
  rationale: διά dengan genitif menyatakan perantaraan atau agensi; 'oleh dia' mempertahankan konstruksi pasif dengan bahasa Indonesia yang cukup alami.
- source_word: παραδίδοται
  choice: diserahkan
  rationale: Mempertahankan arti dasar dan kemungkinan gema penyerahan Yesus kepada pihak berwenang; arti kontekstual 'dikhianati' dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara penetapan ilahi dan tanggung jawab manusia
  choice: Mempertahankan baik kenyataan bahwa jalan Anak Manusia sesuai dengan apa yang telah ditetapkan maupun ucapan celaka atas orang yang menyerahkan-Nya.
  alternative: Melunakkan penetapan ilahi atau, sebaliknya, mengurangi tanggung jawab orang yang menyerahkan Yesus.
  rationale: Teks Yunani dengan sengaja menyandingkan kedua hal tersebut; terjemahan tidak boleh menyelesaikan ketegangan ini menurut suatu sistem teologis tertentu.
- issue: Pelaku yang menetapkan
  choice: Menggunakan bentuk pasif 'telah ditetapkan' tanpa menyebut pelakunya.
  alternative: Menambahkan 'oleh Allah'.
  rationale: Konteks dapat menyiratkan penetapan ilahi, tetapi teks Yunani sendiri tidak menyebutkan pelaku secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Memang … Namun' menjaga kontras wacana, sedangkan bentuk pasif mempertahankan ketidaktersuratan pelaku penetapan dalam teks sumber.
