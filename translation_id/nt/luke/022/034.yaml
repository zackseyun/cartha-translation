  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: id
  text: Tetapi Ia berkata, “Aku berkata kepadamu, Petrus, hari ini ayam jantan tidak akan berkokok sampai[a] engkau tiga kali menyangkal bahwa engkau mengenal Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebelum engkau tiga kali menyangkal bahwa engkau mengenal Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Namun, Ia berkata
  rationale: δέ menandai peralihan yang bernuansa kontras dalam percakapan; “Namun” wajar dalam bahasa Indonesia dan tidak melebih-lebihkan pertentangannya.
- source_word: Λέγω σοι
  choice: Aku berkata kepadamu
  rationale: Mempertahankan rumusan ujaran langsung dan bentuk kini λέγω dengan ungkapan Indonesia yang jelas serta khidmat.
- source_word: Πέτρε
  choice: Petrus
  rationale: Menggunakan bentuk nama yang mapan dalam bahasa Indonesia.
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: hari ini ayam jantan tidak akan berkokok
  rationale: Dengan ἀλέκτωρ sebagai subjek, φωνήσει secara idiomatis berarti “berkokok”; bentuk tanpa artikel tidak menuntut penambahan kata sandang tertentu dalam bahasa Indonesia.
- source_word: ἕως
  choice: sampai
  rationale: Mempertahankan hubungan temporal dari tindakan yang dinegasikan hingga tercapainya peristiwa dalam anak kalimat; kemungkinan ungkapan “sebelum” dicatat sebagai alternatif.
- source_word: τρίς
  choice: tiga kali
  rationale: Padanan modern dan langsung bagi adverbia yang menyatakan frekuensi.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: engkau ... menyangkal bahwa engkau mengenal Aku
  rationale: εἰδέναι menyatakan isi penyangkalan, yakni bahwa Petrus mengenal Yesus; terjemahan ini tidak memperluasnya menjadi penolakan terhadap seluruh hubungan atau kesetiaan.
theological_decisions:
- issue: Sifat penyangkalan Petrus yang dinubuatkan
  choice: menyangkal bahwa engkau mengenal Aku
  alternative: menyangkal Aku tiga kali
  rationale: Teks Yunani secara eksplisit memuat εἰδέναι (“mengenal”), sehingga isi penyangkalan perlu dipertahankan tanpa memperluas atau mempersempit maknanya secara teologis.
- issue: Hubungan waktu antara kokok ayam dan tiga penyangkalan
  choice: tidak akan berkokok sampai
  alternative: tidak akan berkokok sebelum
  rationale: “Sampai” mengikuti ἕως dan struktur Yunani secara lebih dekat, sementara “sebelum” merupakan ungkapan Indonesia yang juga mungkin untuk menyatakan batas waktu dalam konteks ini; alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. “Engkau” dipakai karena sesuai untuk sapaan tunggal langsung dalam konteks Alkitab, sedangkan pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital menurut kebiasaan luas penerbitan Alkitab bahasa Indonesia.
