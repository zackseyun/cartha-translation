  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: id
  text: Setelah kira-kira satu jam berlalu, orang lain bersikeras berkata, “Sungguh, orang ini juga bersama dia, sebab dia pun orang Galilea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Kira-kira satu jam kemudian
  rationale: Ungkapan genitif absolut ini menandai selang waktu sekitar satu jam. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan perkiraan yang dinyatakan oleh ὡσεὶ.
- source_word: ἄλλος τις
  choice: seorang lain
  rationale: Ungkapan Yunani ini tidak menentukan gender dan berarti seseorang yang lain. Pilihan ini mempertahankan ketidakpastian tersebut tanpa menghalangi pembaca memahami bahwa konteks mungkin menunjuk kepada seorang laki-laki.
- source_word: διϊσχυρίζετο
  choice: menegaskan
  rationale: Kata kerja ini menyatakan penegasan yang kuat. Dalam konteks naratif, 'menegaskan' menyampaikan daya desaknya secara alami tanpa harus menambahkan aspek berulang yang tidak wajib dinyatakan dalam bahasa Indonesia.
- source_word: Ἐπ’ ἀληθείας
  choice: Sungguh
  rationale: Ungkapan ini memperkenalkan pernyataan yang ditegaskan sebagai benar. 'Sungguh' ringkas, alami, dan cukup kuat.
- source_word: οὗτος
  choice: orang ini
  rationale: Demonstrativa ini menunjuk langsung kepada Petrus dan bernada menuding. 'Orang ini' mempertahankan daya deiktis itu lebih baik daripada sekadar 'dia'.
- source_word: μετ’ αὐτοῦ ἦν
  choice: bersama-sama dengan Dia
  rationale: Terjemahan ini mempertahankan klaim bahwa Petrus berada dalam kebersamaan dengan Yesus tanpa memperluasnya menjadi status khusus seperti murid atau pengikut.
- source_word: καὶ γὰρ
  choice: sebab dia pun
  rationale: '''Sebab'' menyampaikan fungsi γάρ sebagai alasan, sedangkan ''pun'' mempertahankan unsur tambahan dari καί.'
- source_word: Γαλιλαῖός ἐστιν
  choice: orang Galilea
  rationale: Predikat ini mengidentifikasi Petrus menurut asal daerahnya. 'Orang Galilea' merupakan ungkapan Indonesia yang langsung dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada 'Dia' dipakai untuk memperjelas bahwa rujukannya adalah Yesus, sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia; hal ini tidak mengubah bentuk pronomina sumber.
