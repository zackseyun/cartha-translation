id: LUK.22.53
reference: Luke 22:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: id
  text: Setiap hari, ketika Aku bersama kalian di kompleks Bait Allah, kalian tidak mengulurkan tangan terhadap Aku.[a] Namun, inilah saat bagi kalian, dan inilah kuasa kegelapan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengulurkan tangan terhadap Aku”; ungkapan ini menunjuk pada tindakan memusuhi dan, dalam konteks ini, berkaitan dengan penangkapan.
    reason: lexical_alternative
  - marker: b
    text: Atau “wewenang kegelapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Setiap hari
  rationale: Ungkapan distributif ini menyatakan kejadian yang berulang dari hari ke hari; “setiap hari” alami dan jelas dalam bahasa Indonesia.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: ketika Aku bersama kalian
  rationale: Konstruksi genitif absolut dialihkan menjadi klausa temporal yang alami sambil mempertahankan keadaan yang menyertai.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kawasan atau kompleks Bait Allah, bukan hanya ruang kudus bagian dalam.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: kalian tidak mengulurkan tangan untuk menangkap Aku
  rationale: Terjemahan ini mempertahankan gambaran harfiah tindakan mengulurkan tangan sekaligus memperjelas maksudnya dalam konteks penangkapan.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Namun, inilah saat kalian
  rationale: “Saat kalian” mempertahankan gagasan tentang waktu atau kesempatan yang menjadi bagian mereka tanpa menjadikannya sekadar waktu menurut jam.
- source_word: ἐξουσία
  choice: kuasa
  rationale: Dalam konteks ini, “kuasa” dapat mencakup wewenang atau kekuasaan yang sedang bekerja dan membentuk pasangan alami dengan “kegelapan” dalam bahasa Indonesia.
- source_word: τοῦ σκότους
  choice: kegelapan
  rationale: Metafora sumber dipertahankan tanpa secara eksplisit menyamakannya dengan Iblis atau kejahatan.
theological_decisions:
- issue: Apakah “kuasa kegelapan” harus dijelaskan sebagai kuasa Iblis atau kekuasaan kejahatan
  choice: Mempertahankan ungkapan metaforis “kuasa kegelapan”
  alternative: wewenang Iblis; kekuasaan kejahatan
  rationale: Teks menyebut “kegelapan” dan tidak secara langsung menyebut Iblis. Metafora ini dipertahankan agar ketegangan teologisnya tidak diselesaikan melalui penafsiran tambahan.
- issue: Hubungan antara “saat kalian” dan “kuasa kegelapan”
  choice: 'Mempertahankan koordinasi: “saat kalian dan kuasa kegelapan”'
  alternative: saat bagi kalian, yaitu saat kuasa kegelapan; saat kalian berada di bawah kuasa kegelapan
  rationale: Struktur Yunani menghubungkan keduanya dengan καί. Terjemahan tidak menjelaskan secara berlebihan apakah kedua frasa itu identik atau memiliki hubungan lain.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. “Kalian” dipakai karena pronomina Yunani berbentuk jamak; “Aku” ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. “Kompleks Bait Allah” membedakan ἱερόν dari bangunan ruang kudus saja.
