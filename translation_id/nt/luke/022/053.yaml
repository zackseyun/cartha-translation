  naturalness: “Setiap hari,”, “di kompleks Bait Allah,” dan “kuasa kegelapan” wajar dalam bahasa Indonesia modern yang khidmat. “Inilah saat kalian dan kuasa kegelapan” terdengar eliptis dan dapat keliru mengaitkan “kalian” juga dengan “kuasa kegelapan.” Pengulangan kopula dalam bahasa Indonesia membuat relasi sintaksisnya jelas tanpa menambahkan tafsiran teologis.
  terminology: “Bait Allah” tepat untuk ἱερόν, dengan “kompleks” yang secara tepat menunjukkan kawasan Bait Allah. “Kuasa kegelapan” merupakan padanan yang baik bagi ἡ ἐξουσία τοῦ σκότους dan mempertahankan metafora tanpa menyebut Iblis atau kejahatan secara eksplisit. Kapitalisasi “Aku” konsisten dengan register Alkitab Indonesia.
