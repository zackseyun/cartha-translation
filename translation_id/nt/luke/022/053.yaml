revisions:
- from: Setiap hari, ketika Aku bersama kalian di kompleks Bait Allah, kalian tidak mengulurkan tangan untuk menangkap Aku.[a] Namun, inilah saat kalian dan kuasa kegelapan.[b]
  to: Setiap hari, ketika Aku bersama kalian di kompleks Bait Allah, kalian tidak mengulurkan tangan terhadap Aku.[a] Namun, inilah saat bagi kalian, dan inilah kuasa kegelapan.[b]
  rationale: Revisi mempertahankan idiom Yunani di teks utama sambil menjelaskan konteks penangkapan dalam catatan kaki. Klausa terakhir disusun ulang agar kepemilikan “bagi kalian” hanya melekat pada “saat,” seperti dalam sumber Yunani, dan agar koordinasi dengan “kuasa kegelapan” tetap jelas serta alami dalam bahasa Indonesia.
