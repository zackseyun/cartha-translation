  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: id
  text: Namun sekarang, siapa yang mempunyai kantong uang, hendaklah membawanya, demikian juga tas bekal. Siapa yang tidak mempunyai pedang[a], hendaklah menjual pakaian luarnya dan membeli sebilah pedang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani hanya berbunyi “siapa yang tidak mempunyai” tanpa menyebutkan objeknya. “Pedang” dipahami dari perintah yang langsung menyusul.
    reason: textual_ellipsis
  - marker: b
    text: Kata Yunani μάχαιρα dapat menunjuk pedang, khususnya pedang pendek, atau senjata tajam sejenis seperti belati.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Namun sekarang
  rationale: Mengungkapkan pertentangan kuat dengan petunjuk sebelumnya sekaligus mempertahankan penanda waktu νῦν dalam bahasa Indonesia yang wajar.
- source_word: ὁ ἔχων
  choice: siapa yang mempunyai
  rationale: Menyampaikan partisipel berartikel sebagai sebutan umum tanpa menambahkan penandaan gender.
- source_word: βαλλάντιον
  choice: kantong uang
  rationale: Menunjuk pada kantong untuk membawa uang; ungkapan ini jelas dan alami bagi pembaca Indonesia masa kini.
- source_word: ἀράτω
  choice: hendaklah membawanya
  rationale: Dalam konteks persiapan perjalanan, αἴρω bermakna mengambil untuk dibawa; bentuk 'hendaklah' mempertahankan daya imperatifnya.
- source_word: ὁμοίως καὶ πήραν
  choice: demikian juga tas bekal
  rationale: πήρα adalah tas yang dibawa dalam perjalanan. 'Tas bekal' menyatakan fungsi itu secara ringkas, sedangkan 'demikian juga' mempertahankan ὁμοίως.
- source_word: ὁ μὴ ἔχων
  choice: siapa yang tidak mempunyai pedang
  rationale: Teks Yunani tidak menyebut objek sesudah 'tidak mempunyai'. 'Pedang' dipasok dari perintah berikutnya agar kalimat Indonesia dapat dipahami, dan sifat elipsis tersebut dinyatakan dalam catatan kaki.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: hendaklah menjual jubahnya
  rationale: ἱμάτιον lazimnya menunjuk pakaian luar atau jubah; 'jubah' ringkas, bermartabat, dan mudah dipahami.
- source_word: ἀγορασάτω μάχαιραν
  choice: membeli sebilah pedang
  rationale: Mempertahankan perintah langsung dan istilah senjata konkret tanpa melemahkannya menjadi ungkapan kiasan; 'sebilah' merupakan penggolong alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah perintah untuk membeli μάχαιρα perlu dilunakkan atau ditafsirkan sebagai kiasan dalam terjemahan.
  choice: Menerjemahkannya secara langsung sebagai 'membeli sebilah pedang'.
  alternative: Mengalihkannya menjadi 'mempersiapkan diri menghadapi bahaya' atau memakai istilah umum 'senjata'.
  rationale: Bahasa Yunani memakai nama senjata tertentu dan bentuk perintah langsung. Terjemahan mempertahankan ketegangan teks serta tidak memutuskan apakah penerapannya harfiah, simbolis, atau terbatas pada konteks tertentu.
- issue: Objek yang tidak dinyatakan dalam ὁ μὴ ἔχων.
  choice: Memasok 'pedang' dalam teks dan menjelaskan elipsis Yunani dalam catatan kaki.
  alternative: Menerjemahkan secara sangat harfiah sebagai 'siapa yang tidak mempunyai' tanpa objek, atau menghubungkannya dengan tas bekal.
  rationale: Perintah segera sesudahnya, 'membeli pedang', paling alami menyediakan objek yang tersirat, tetapi catatan kaki menjaga agar pembaca mengetahui bahwa kata itu tidak tertulis secara eksplisit dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur perintah dipertahankan melalui 'hendaklah'; istilah konkret tidak dilunakkan secara teologis. Tanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
