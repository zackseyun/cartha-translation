  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: id
  text: Maka mereka pergi dan mendapati keadaan itu seperti yang telah dikatakan Yesus kepada mereka. Lalu mereka menyiapkan Paskah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jamuan Paskah" atau "anak domba Paskah". Istilah Yunani ini dapat menunjuk secara luas pada perayaan Paskah atau, lebih khusus, pada jamuan atau unsur kurbannya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: Maka pergilah mereka
  rationale: Partisip aoris diikuti penghubung ringan δέ melanjutkan alur sebagai tindakan yang mendahului verba utama. Bentuk ini alami dalam narasi Indonesia dan menunjukkan bahwa mereka pergi sebagai tanggapan atas petunjuk sebelumnya.
- source_word: εὗρον
  choice: mendapati semuanya
  rationale: Verba berarti menemukan atau mendapati. Bahasa Indonesia memerlukan pelengkap yang wajar; 'semuanya' merujuk pada keadaan yang telah Yesus gambarkan tanpa menentukan satu benda tertentu.
- source_word: καθὼς
  choice: tepat seperti
  rationale: Menandai kesesuaian antara apa yang mereka dapati dan perkataan Yesus sebelumnya.
- source_word: εἰρήκει αὐτοῖς
  choice: yang telah dikatakan Yesus kepada mereka
  rationale: Bentuk pluskuamperfek menunjuk pada perkataan yang sudah disampaikan sebelumnya. Nama 'Yesus' dipakai untuk memperjelas subjek pronominal dalam bahasa Indonesia sesuai konteks.
- source_word: ἡτοίμασαν
  choice: mereka mempersiapkan
  rationale: Menyampaikan tindakan membuat segala sesuatu siap secara ringkas dan alami.
- source_word: τὸ πάσχα
  choice: Paskah
  rationale: πάσχα dapat menunjuk secara luas pada perayaan Paskah maupun secara lebih khusus pada jamuan atau kurban Paskah. 'Paskah' mempertahankan keluasan istilah sumber.
theological_decisions:
- issue: Cakupan makna πάσχα dalam konteks
  choice: Paskah
  alternative: jamuan Paskah; anak domba Paskah
  rationale: Konteks membicarakan persiapan untuk makan Paskah, tetapi istilah Yunani itu sendiri tetap luas. Terjemahan utama tidak mempersempitnya pada jamuan atau hewan kurban saja.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan tindakan dipertahankan, sedangkan rujukan pronominal diperjelas secara alami. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
