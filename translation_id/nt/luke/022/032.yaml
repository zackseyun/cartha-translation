  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: id
  text: Namun, Aku telah berdoa untukmu supaya imanmu tidak gugur[a]. Dan engkau, setelah engkau kembali[b], kuatkanlah saudara-saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya kepercayaanmu tidak gugur” atau “supaya kesetiaanmu tidak gugur.” Kata Yunani ini dapat mencakup beberapa nuansa yang bertumpang tindih.
    reason: alternative_reading
  - marker: b
    text: Atau “ketika engkau telah kembali” atau “ketika engkau berbalik lagi.” Ungkapan ini mengisyaratkan pemulihan sesudah kegagalan Petrus yang akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: telah berdoa
  rationale: Kata ini menyatakan permohonan yang sungguh-sungguh. Dalam konteks ucapan Yesus, “telah berdoa” secara alami menunjukkan tindakan yang sudah dilakukan dan tetap relevan.
- source_word: περὶ σοῦ
  choice: untukmu
  rationale: Dengan verba berdoa, περί + genitif menyatakan doa syafaat bagi seseorang; “untukmu” adalah padanan Indonesia yang paling alami.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: supaya ... tidak gagal
  rationale: ἐκλείπω dapat berarti gagal, berhenti, atau habis. “Tidak gagal” mempertahankan keluasan makna tanpa menyatakan bahwa iman Petrus sama sekali tidak akan terguncang.
- source_word: πίστις
  choice: iman
  rationale: “Iman” mempertahankan cakupan makna πίστις, termasuk kepercayaan dan kesetiaan, tanpa mempersempitnya pada salah satu nuansa.
- source_word: ποτε
  choice: setelah
  rationale: Dalam rangkaian dengan partisip ἐπιστρέψας dan perintah berikutnya, ungkapan Indonesia “setelah berbalik kembali” menyampaikan titik waktu mendatang dengan wajar.
- source_word: ἐπιστρέψας
  choice: berbalik kembali
  rationale: Pilihan ini mempertahankan metafora berbalik atau kembali serta membuka nuansa pertobatan dan pemulihan tanpa menjadikannya istilah teknis.
- source_word: στήρισον
  choice: kuatkanlah
  rationale: Bentuk perintah ini meminta Petrus membuat saudara-saudaranya teguh; “kuatkanlah” jelas, alami, dan sesuai konteks rohani serta relasional.
- source_word: ἀδελφούς
  choice: saudara-saudaramu
  rationale: Dalam konteks langsung, bentuk maskulin jamak ini menunjuk kepada para murid laki-laki. “Saudara-saudaramu” alami dalam bahasa Indonesia dan tetap sesuai dengan rujukannya.
theological_decisions:
- issue: Makna πίστις ketika iman, kepercayaan, dan kesetiaan bertumpang tindih
  choice: iman
  alternative: kepercayaan; kesetiaan
  rationale: “Iman” menjaga keluasan teologis kata Yunani. Nuansa kepercayaan dan kesetiaan tetap dicatat tanpa membatasi makna utama.
- issue: Makna ἐπιστρέψας terkait kegagalan Petrus yang akan datang
  choice: setelah berbalik kembali
  alternative: setelah kembali; ketika engkau berbalik lagi; setelah bertobat
  rationale: Pilihan utama menunjukkan pemulihan sesudah kegagalan Petrus, tetapi tidak memaksakan istilah “bertobat” sebagai satu-satunya tafsiran.
- issue: Rujukan ἀδελφούς dalam konteks
  choice: saudara-saudaramu
  alternative: saudara-saudari seimanmu
  rationale: Rujukan terdekatnya adalah kelompok murid laki-laki, sehingga bentuk yang tidak memperluasnya menjadi kelompok campuran dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti untuk Yesus dan Petrus memakai kapitalisasi hormat yang lazim dalam penerbitan Alkitab Indonesia. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
