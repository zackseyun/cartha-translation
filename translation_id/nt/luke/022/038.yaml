  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: id
  text: Lalu mereka berkata, “Tuhan, lihat, di sini ada dua pedang.” Ia berkata kepada mereka, “Itu sudah cukup.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Cukup sampai di sini,” mungkin berarti bahwa pembicaraan itu harus diakhiri, bukan bahwa dua pedang sudah mencukupi.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Lalu mereka berkata
  rationale: δέ merupakan penghubung ringan; “lalu” menyampaikan kelanjutan alur secara alami tanpa memberi kesan pertentangan yang kuat.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan ini sesuai dengan penggunaan κύριος bagi Yesus dan mempertahankan bobotnya sebagai sapaan sekaligus gelar.
- source_word: ἰδοὺ
  choice: lihat
  rationale: “Lihat” menyampaikan daya penunjuk ἰδού dalam bahasa Indonesia modern dan wajar dalam percakapan langsung.
- source_word: μάχαιραι
  choice: pedang
  rationale: μάχαιρα menunjuk pada senjata tajam; “pedang” adalah padanan umum yang tidak mempersempitnya secara berlebihan menjadi belati atau pedang pendek.
- source_word: ὧδε δύο
  choice: di sini ada dua
  rationale: Ungkapan ini menyampaikan adverbia tempat ὧδε dan angka δύο dalam susunan bahasa Indonesia yang alami.
- source_word: Ἱκανόν ἐστιν
  choice: Itu sudah cukup
  rationale: Ungkapan ini tetap dapat dipahami sebagai penilaian bahwa dua pedang mencukupi ataupun sebagai cara mengakhiri pembicaraan; “sudah” membuat ujaran Indonesia alami tanpa memaksakan salah satu tafsiran.
theological_decisions:
- issue: Ambiguitas jawaban Yesus, Ἱκανόν ἐστιν
  choice: Itu sudah cukup
  alternative: Cukuplah; Cukup sampai di sini
  rationale: Bahasa Yunani dapat merujuk pada kecukupan dua pedang atau menjadi ungkapan untuk menghentikan pembicaraan. Teks utama mempertahankan ketegangan tersebut, dan catatan kaki menjelaskan kemungkinan kedua.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Dialog dibuat langsung dan mudah dipahami, sementara ambiguitas penting dalam jawaban Yesus tetap dipertahankan.
