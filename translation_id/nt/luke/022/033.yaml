  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: id
  text: Namun, Petrus berkata kepada-Nya, “Tuhan, aku siap pergi bersama-Mu, baik ke penjara maupun sampai mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Namun, Petrus
  rationale: Artikel berfungsi sebagai kata ganti yang merujuk kepada Petrus, sedangkan δέ menandai kontras ringan dengan perkataan Yesus sebelumnya. Nama Petrus dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepada-Nya
  rationale: Terjemahan ini mempertahankan tindakan berbicara dan objek tak langsungnya; huruf kapital pada -Nya mengikuti kebiasaan bahasa Indonesia ketika merujuk kepada Yesus.
- source_word: Κύριε
  choice: Tuhan
  rationale: Dalam sapaan langsung kepada Yesus, 'Tuhan' mempertahankan nuansa penghormatan sekaligus bobot gelarnya tanpa mempersempitnya menjadi sekadar 'Guru'.
- source_word: μετὰ σοῦ
  choice: bersama-Mu
  rationale: μετά dengan genitif menyatakan penyertaan; 'bersama-Mu' merupakan padanan Indonesia yang alami dan tepat.
- source_word: ἕτοιμός εἰμι
  choice: aku siap
  rationale: Ungkapan ini menyatakan kesiapan dan kesediaan Petrus. 'Aku siap' ringkas, alami, dan mempertahankan keyakinan dirinya yang kuat.
- source_word: καὶ ... καὶ
  choice: baik ... maupun
  rationale: Pasangan ini menghubungkan dua tujuan secara sejajar dan tegas; konstruksi 'baik ... maupun' menyampaikan kesejajaran itu secara idiomatis.
- source_word: εἰς φυλακὴν
  choice: ke penjara
  rationale: φυλακή dalam konteks ini berarti tempat pemenjaraan atau penahanan, sementara εἰς memberi arah; 'ke penjara' adalah padanan yang jelas dan alami.
- source_word: εἰς θάνατον
  choice: menuju kematian
  rationale: Frasa ini menyatakan kesediaan menempuh jalan sampai pada kematian. 'Menuju kematian' menjaga unsur arah dan membedakannya dari ungkapan Indonesia 'pergi ke kematian' yang kurang alami.
- source_word: πορεύεσθαι
  choice: pergi
  rationale: Infinitif ini melengkapi pernyataan kesiapan dan menggambarkan tindakan menyertai Yesus dalam jalan yang akan ditempuh; 'pergi' paling alami dalam konteks ini.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: Guru
  rationale: '''Tuhan'' mempertahankan fungsi sapaan penuh hormat dan kemungkinan bobot kristologis gelar κύριος, tanpa memaksakan penafsiran yang melampaui teks.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lisan yang bermartabat. Kata ganti orang pertama 'aku' sesuai dengan percakapan langsung yang dekat, sedangkan bentuk penghormatan ilahi 'kepada-Nya' dan 'bersama-Mu' digunakan secara konsisten. Struktur dibuat alami tanpa menghilangkan kesejajaran antara penjara dan kematian.
