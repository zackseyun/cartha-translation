  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: id
  text: Lalu mereka berkata[a], “Untuk apa lagi kita memerlukan kesaksian? Sebab kita sendiri telah mendengarnya langsung dari mulut-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa lagi perlunya kesaksian bagi kita?”
    reason: Alternatif ini mengikuti susunan τί ἔτι ... χρείαν secara lebih harfiah.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Lalu mereka berkata
  rationale: δέ merupakan penghubung ringan yang melanjutkan alur; “Lalu” menyampaikan urutan secara alami tanpa memperkuat unsur pertentangan.
- source_word: Τί ἔτι
  choice: Untuk apa lagi
  rationale: Dalam pertanyaan retoris ini, τί ἔτι bersama ungkapan kebutuhan secara alami berarti “untuk apa lagi,” dengan ἔτι tercermin dalam “lagi.”
- source_word: ἔχομεν μαρτυρίας χρείαν
  choice: kita memerlukan kesaksian
  rationale: Ungkapan χρείαν ἔχειν berarti “memerlukan,” sedangkan μαρτυρίας menjadi pelengkap genitif yang menunjuk pada kesaksian dalam konteks pemeriksaan hukum.
- source_word: μαρτυρίας
  choice: kesaksian
  rationale: “Kesaksian” paling tepat mempertahankan nuansa yudisial μαρτυρία dan lebih sesuai daripada “saksi,” yang dapat menunjuk kepada orangnya.
- source_word: αὐτοὶ γὰρ
  choice: Sebab kita sendiri
  rationale: “Sendiri” mempertahankan penekanan αὐτοί bahwa mereka mendengarnya secara pribadi; “Sebab” menyampaikan fungsi penjelasan γάρ.
- source_word: ἠκούσαμεν
  choice: telah mendengarnya
  rationale: “Telah mendengar” menyampaikan tindakan lampau dengan hasil yang kini mereka anggap menentukan. Akhiran objek “-nya” tetap netral dan tidak mengidentifikasi secara eksplisit isi ucapan itu.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: langsung dari mulut-Nya
  rationale: Ungkapan ini menunjukkan bahwa mereka mendengar ucapan itu secara langsung dari Yesus. “Langsung” mengungkapkan daya idiomatis konteks tanpa menambahkan isi ucapan.
theological_decisions:
- issue: Apakah isi yang didengar perlu dijelaskan sebagai pengakuan atau kesaksian Yesus
  choice: 'Objek tetap tidak dijelaskan secara khusus: “telah mendengarnya langsung dari mulut-Nya”'
  alternative: “telah mendengar pengakuan-Nya” atau “telah mendengar kesaksian itu dari mulut-Nya”
  rationale: Teks Yunani tidak menyebut objek sesudah ἠκούσαμεν. Menambahkan “pengakuan” atau “kesaksian” akan menafsirkan sifat ucapan yang mereka dengar dan mengurangi ketegangan dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Untuk apa lagi” menjaga daya retoris pertanyaan, sementara “kesaksian” mempertahankan konteks hukum. Huruf kapital pada “-Nya” mengikuti kebiasaan penulisan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
