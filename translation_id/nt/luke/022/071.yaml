  source_fidelity: Teks Indonesia dengan setia menerjemahkan οἱ δὲ εἶπαν sebagai kelanjutan naratif (“Lalu mereka berkata”), mempertahankan pertanyaan retoris Τί ἔτι ... χρείαν (“Untuk apa lagi kita memerlukan kesaksian?”), dan menyampaikan penekanan αὐτοὶ γὰρ melalui “Sebab kita sendiri.” Frasa “telah mendengarnya langsung dari mulut-Nya” mempertahankan objek yang tidak dinyatakan dalam bahasa Yunani serta gagasan bahwa mereka mendengarnya dari Yesus sendiri.
