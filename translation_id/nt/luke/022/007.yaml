  naturalness: “Kemudian tibalah” dan “ketika” alami serta baku. “hari raya Roti Tidak Beragi” merupakan penyebutan yang wajar. Menggunakan “kurban Paskah harus disembelih” menghasilkan kalimat yang lebih idiomatis dan menyampaikan tindakan ritual secara langsung.
  terminology: “Roti Tidak Beragi,” “Paskah,” dan “kurban Paskah” adalah istilah yang lazim dan netral. Catatan kaki direvisi agar alternatif yang lebih luas, “Paskah,” tetap tersedia, tanpa menyatakan bahwa perayaan itu sendiri disembelih.
