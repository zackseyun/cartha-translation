  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: id
  text: Kemudian tibalah hari raya Roti Tidak Beragi, ketika kurban Paskah[a] harus disembelih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Paskah”. Istilah Yunani dapat merujuk pada perayaan Paskah atau, dalam konteks ini, pada kurban Paskah.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: tibalah
  rationale: Bentuk aoris ἔρχομαι dipakai secara idiomatis untuk menyatakan datang atau tibanya suatu hari. “Tibalah” alami dalam narasi Indonesia dan mempertahankan fokus temporalnya.
- source_word: δὲ
  choice: Kemudian
  rationale: δέ menandai kelanjutan dan perkembangan narasi; “kemudian” menyampaikan urutan peristiwa dengan jelas tanpa memberi tekanan berlebihan.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: hari Raya Roti Tidak Beragi
  rationale: Konstruksi genitif ini menunjuk pada hari perayaan yang berkaitan dengan roti tidak beragi. Bentuk tunggal “hari” dipertahankan, sedangkan “Raya” memperjelas bahwa yang dimaksud ialah perayaan Yahudi.
- source_word: ᾗ
  choice: ketika
  rationale: Kata ganti relatif datif ini merujuk pada “hari” dan berfungsi secara temporal. “Ketika” lebih alami dalam bahasa Indonesia modern daripada konstruksi harfiah “pada hari yang padanya”.
- source_word: ἔδει
  choice: harus
  rationale: Bentuk imperfek impersonal ini menyatakan keharusan menurut ketentuan waktu perayaan. “Harus” menyampaikan kewajiban itu secara lugas.
- source_word: θύεσθαι
  choice: dikurbankan
  rationale: Dalam konteks ritual, θύω menunjuk pada penyembelihan sebagai kurban. “Dikurbankan” mempertahankan dimensi persembahan ritual, bukan sekadar tindakan membunuh.
- source_word: τὸ πάσχα
  choice: Paskah
  rationale: πάσχα dapat menunjuk pada perayaan, jamuan, atau korban Paskah. Pemakaian “Paskah” dalam teks utama mempertahankan keluasan istilah Yunani, sementara verba “dikurbankan” mengarahkan pembaca pada korban Paskah dalam konteks ini.
theological_decisions:
- issue: Acuan τὸ πάσχα dalam konteks pengurbanan
  choice: Memakai “Paskah” dalam teks utama dan membiarkan “dikurbankan” menyampaikan bahwa yang dimaksud dalam konteks ini ialah korban Paskah.
  alternative: “anak domba Paskah” atau “kurban Paskah”
  rationale: Istilah Yunani lebih luas daripada “anak domba” dan secara metonimis dapat menunjuk pada perayaan maupun hewan korbannya. Terjemahan utama tidak mempersempit acuan secara diam-diam; tafsiran yang lebih eksplisit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah perayaan yang lazim serta ambiguitas leksikal πάσχα tetap terlihat melalui catatan kaki.
