  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: id
  text: Lalu mereka semua berkata, “Jadi, Engkau adalah Anak Allah?” Ia berkata kepada mereka, “Kalian sendiri mengatakan bahwa Akulah Dia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Kalian sendiri yang mengatakannya” atau “Benar, seperti yang kalian katakan.” Jawaban Yesus bernada afirmatif, tetapi bahasa Yunaninya secara lebih harfiah berbunyi, “Kalian sendiri mengatakan bahwa Akulah Dia.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: mereka semua
  rationale: Adjektiva jamak ini dipakai secara substantival dan menekankan seluruh kelompok; “mereka semua” alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: jadi
  rationale: Dalam pertanyaan ini, kata tersebut menarik kesimpulan dari percakapan sebelumnya; “jadi” mempertahankan daya inferensialnya.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Ini merupakan gelar kristologis; bentuk baku “Anak Allah” mempertahankan bobot formal pertanyaan tersebut.
- source_word: ἔφη
  choice: berkata
  rationale: Kata kerja ini paling wajar diterjemahkan secara netral sebagai “berkata”; aspek imperfeknya tidak perlu ditandai khusus dalam konteks ini.
- source_word: Ὑμεῖς λέγετε
  choice: Kalian sendiri mengatakan
  rationale: Pronomina eksplisit Ὑμεῖς bersifat emfatis. “Kalian sendiri” mempertahankan penekanan pada para penanya, sedangkan “mengatakan” menyampaikan bentuk kini secara alami.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι paling wajar memperkenalkan isi perkataan mereka dan mempertahankan susunan Yunani tanpa mengubahnya menjadi parafrasa.
- source_word: ἐγώ εἰμι
  choice: Akulah Dia
  rationale: Dalam konteks predikat “Anak Allah” yang telah disebut, “Akulah Dia” merupakan padanan Indonesia yang alami bagi ungkapan eliptis ἐγώ εἰμι, sambil mempertahankan penekanan pada ἐγώ.
theological_decisions:
- issue: Apakah jawaban Yesus harus diterjemahkan sebagai pengakuan langsung atau sebagai jawaban tidak langsung yang bernuansa
  choice: Pertahankan bentuk, “Kalian sendiri mengatakan bahwa Akulah Dia”
  alternative: “Benar, seperti yang kalian katakan” atau “Kalian sendiri yang mengatakannya”
  rationale: Susunan Yunani berfungsi sebagai jawaban afirmatif dalam konteks, tetapi secara harfiah mengembalikan rumusan itu kepada para penanya. Teks utama mempertahankan ketegangan tersebut tanpa menjadikannya pengakuan langsung yang diperluas maupun penyangkalan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam pertanyaan kepada Yesus, sedangkan “kalian” menyatakan orang kedua jamak secara jelas. Penanda catatan kaki ditempatkan sesudah jawaban yang dijelaskannya.
