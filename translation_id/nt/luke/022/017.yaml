id: LUK.22.17
reference: Luke 22:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: id
  text: Lalu, setelah menerima sebuah cawan[a] dan mengucap syukur, Ia berkata, “Ambillah ini dan bagikanlah di antara kalian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cawan itu.” Dalam bahasa Yunani, kata “cawan” tidak memakai artikel, meskipun konteks perjamuan mungkin menyiratkan cawan tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagilah di antara kalian.” Kata kerjanya dapat berarti “membagi” atau “membagikan” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: setelah menerima
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului kata kerja utama. Pilihan ini mempertahankan urutan tindakan secara wajar dalam bahasa Indonesia.
- source_word: ποτήριον
  choice: sebuah cawan
  rationale: Kata benda Yunani ini tidak memakai artikel. “Sebuah cawan” mencerminkan bentuk tersebut tanpa menutup kemungkinan bahwa konteks perjamuan menunjuk kepada cawan tertentu.
- source_word: εὐχαριστήσας
  choice: mengucap syukur
  rationale: Ungkapan ini menyampaikan tindakan bersyukur sebelum Ia berbicara dan menghindari pemakaian istilah liturgis teknis yang tidak dinyatakan oleh teks.
- source_word: εἶπεν
  choice: Ia berkata
  rationale: Teks Yunani hanya menyatakan “Ia berkata” tanpa objek tak langsung; karena itu “kepada mereka” tidak ditambahkan.
- source_word: Λάβετε
  choice: Ambillah
  rationale: Bentuk imperatif ini paling alami diterjemahkan sebagai perintah untuk mengambil dalam konteks perjamuan.
- source_word: τοῦτο
  choice: ini
  rationale: Kata penunjuk ini merujuk kepada cawan yang baru disebut, tetapi teks Yunani tidak mengulangi kata “cawan”.
- source_word: διαμερίσατε
  choice: bagikanlah
  rationale: Kata kerja ini dapat berarti membagi atau membagikan. Dalam konteks cawan yang diedarkan di antara para murid, “bagikanlah” terdengar alami sekaligus mempertahankan gagasan distribusi.
- source_word: εἰς ἑαυτούς
  choice: di antara kalian
  rationale: Frasa ini menunjukkan pembagian di dalam kelompok itu sendiri. “Di antara kalian” menyampaikan makna timbal balik secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah εὐχαριστήσας dan ποτήριον perlu diterjemahkan dengan bahasa liturgis Ekaristi
  choice: 'Menggunakan bahasa naratif biasa: “sebuah cawan” dan “mengucap syukur”'
  alternative: Menggunakan “cawan itu” atau istilah yang bernuansa sakramental lebih kuat
  rationale: Ayat ini menceritakan tindakan Yesus dalam perjamuan tanpa secara eksplisit memakai istilah teknis gerejawi. Pilihan ini tidak memasukkan rumusan doktrinal yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk subjek yang tersirat tanpa menambahkan nama Yesus, sedangkan “kalian” membuat perintah jamak Yunani terbaca jelas dan alami.
