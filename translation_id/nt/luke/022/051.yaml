  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: id
  text: Namun Yesus menjawab, “Cukup sampai di sini!” Lalu ia menyentuh telinga orang itu dan menyembuhkannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Sudah, hentikan!
  rationale: Ungkapan ini secara harfiah dapat berarti ‘biarkan sampai sejauh ini’, tetapi dalam konteks tindakan kekerasan yang sedang berlangsung berfungsi sebagai perintah tegas agar para murid berhenti. ‘Sudah, hentikan!’ mempertahankan ketegasan dan kealamian tanpa menentukan secara berlebihan siapa tepatnya yang disapa.
- source_word: ὠτίου
  choice: telinga
  rationale: Bentuk diminutif dapat merujuk pada telinga atau bagian telinga; ‘telinga’ adalah padanan Indonesia yang wajar dan sesuai konteks.
- source_word: ἰάσατο αὐτόν
  choice: menyembuhkannya
  rationale: Pronomina Yunani maskulin merujuk kepada orang itu, bukan kepada telinga; akhiran ‘-nya’ secara alami mempertahankan rujukan tersebut dalam bahasa Indonesia.
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Namun Yesus menjawab
  rationale: Merangkum idiom partisip + verba ujar secara alami. ‘Namun’ menyampaikan δέ sebagai peralihan yang berkontras dengan tindakan para murid.
theological_decisions:
- issue: Ruang lingkup perintah Ἐᾶτε ἕως τούτου
  choice: Diterjemahkan sebagai seruan untuk menghentikan tindakan yang sedang berlangsung tanpa menambahkan objek eksplisit.
  alternative: ‘Biarkanlah sampai di sini’ atau ‘Cukuplah sampai di sini.’
  rationale: Teks dapat dipahami sebagai ditujukan kepada para murid atau pihak yang menangkap Yesus. Terjemahan ini mempertahankan ketidakjelasan penerima perintah sambil mengungkapkan fungsi pragmatisnya dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku-modern, ringkas, bermartabat, dan mudah dipahami. Kapitalisasi pronomina ilahi tidak digunakan karena bukan tuntutan teks sumber.
