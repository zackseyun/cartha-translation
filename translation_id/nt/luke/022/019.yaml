  naturalness: “Teruslah lakukan ini” kurang idiomatis dalam bahasa Indonesia baku; “Teruslah melakukan ini” adalah bentuk yang alami. Rangkaian verba dalam satu kalimat juga lebih lancar dan dekat dengan alur naratif sumber.
  terminology: “Inilah tubuh-Ku,” “yang diberikan bagi kamu,” dan “untuk mengenang Aku” dapat dipertahankan. Istilah-istilah ini tidak memaksakan pembacaan sakramental atau teori pendamaian tertentu. Catatan varian dan alternatif leksikal telah ditempatkan pada bagian yang tepat.
