  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: id
  text: Kemudian Ia mengambil roti, mengucap syukur, memecahkannya, dan memberikannya kepada mereka sambil berkata, “Inilah tubuh-Ku, yang diberikan bagi kamu.[a][b] Teruslah melakukan ini untuk mengenang Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sejumlah naskah tidak memuat: “yang diberikan bagi kamu. Teruslah melakukan ini untuk mengenang Aku.”'
    reason: textual_variant
  - marker: b
    text: 'Atau: “yang sedang diberikan bagi kamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: mengambil roti
  rationale: Partisip aoristus dirangkai secara alami dengan tindakan berikutnya dalam narasi Indonesia; ἄρτος dalam konteks perjamuan berarti roti.
- source_word: εὐχαριστήσας
  choice: mengucap syukur
  rationale: Ungkapan Indonesia yang wajar dan bermartabat, serta mempertahankan tindakan pengucapan syukur tanpa menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: ἔκλασεν
  choice: memecah-mecahkannya
  rationale: Mengungkapkan tindakan memecahkan roti; akhiran -nya menjelaskan objek tersirat, sedangkan bentuk ulang memberi nuansa pembagian roti secara alami dalam bahasa Indonesia.
- source_word: ἔδωκεν αὐτοῖς
  choice: memberikannya kepada mereka
  rationale: Objek yang tersirat dalam bahasa Yunani dinyatakan sebagai -nya agar jelas dan alami dalam bahasa Indonesia.
- source_word: λέγων
  choice: sambil berkata
  rationale: Mempertahankan hubungan partisipial dengan tindakan pemberian dan menghasilkan alur naratif Indonesia yang lancar.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Inilah tubuh-Ku
  rationale: Mempertahankan pernyataan kopulatif langsung dan tidak mengubahnya menjadi 'melambangkan' atau 'berarti', sehingga ketegangan teologis teks tetap terbuka.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: yang diberikan bagi kamu
  rationale: Konstruksi artikel-partisip diterjemahkan sebagai klausa relatif. 'Bagi kamu' mempertahankan cakupan benefaktif ὑπέρ tanpa menentukan lebih jauh teori pendamaian tertentu.
- source_word: τοῦτο ποιεῖτε
  choice: Teruslah lakukan ini
  rationale: Imperatif kini dapat menyatakan tindakan yang berkelanjutan atau berulang; 'teruslah' menampilkan daya kebiasaan itu secara alami.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: untuk mengenang Aku
  rationale: Menyampaikan tindakan mengingat atau memperingati Yesus dalam bahasa Indonesia modern tanpa konotasi sempit tentang ingatan pribadi semata.
theological_decisions:
- issue: Makna 'Inilah tubuh-Ku' dalam konteks perjamuan
  choice: Mempertahankan bentuk langsung 'Inilah tubuh-Ku'.
  alternative: '''Ini melambangkan tubuh-Ku'' atau ''Ini berarti tubuh-Ku''.'
  rationale: ἐστιν adalah kopula 'adalah'; terjemahan tidak boleh menyelesaikan perdebatan sakramental dengan memasukkan penafsiran tertentu.
- issue: Status tekstual bagian panjang Lukas 22:19
  choice: Memasukkan bagian yang dipersoalkan ke dalam teks utama dan menandainya dengan catatan kaki.
  alternative: Mengakhiri ayat sesudah 'Inilah tubuh-Ku.'
  rationale: SBLGNT menyajikan bagian panjang sebagai teks kerja dengan tanda yang menunjukkan persoalan tekstual; varian pendek perlu dicatat agar bukti naskah tetap terlihat.
- issue: Nuansa ὑπέρ dalam 'yang diberikan bagi kamu'
  choice: bagi kamu
  alternative: menggantikan kamu atau demi kamu
  rationale: '''Bagi'' mempertahankan makna luas demi kepentingan atau atas nama mereka tanpa memaksakan satu formulasi khusus mengenai hakikat pengorbanan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang sederhana dan bermartabat. Kapital pada pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia. Struktur Yunani dipertahankan sejauh tetap alami; ambiguitas sakramental dan nuansa ὑπέρ tidak dipersempit.
