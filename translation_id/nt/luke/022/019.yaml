revisions:
- from: Lalu Yesus mengambil roti dan mengucap syukur. Ia memecah-mecahkannya dan memberikannya kepada mereka sambil berkata, “Inilah tubuh-Ku, yang diberikan bagi kamu.[a][b] Teruslah lakukan ini untuk mengenang Aku.”
  to: Kemudian Ia mengambil roti, mengucap syukur, memecahkannya, dan memberikannya kepada mereka sambil berkata, “Inilah tubuh-Ku, yang diberikan bagi kamu.[a][b] Teruslah melakukan ini untuk mengenang Aku.”
  rationale: Revisi menghapus subjek eksplisit yang tidak ada dalam teks Yunani, menghindari nuansa iteratif tambahan pada tindakan memecahkan roti, dan membetulkan bentuk imperatif berkelanjutan agar idiomatis. Klausa utama, ambiguitas sakramental, nuansa luas ὑπέρ, serta jangkar catatan varian dipertahankan.
