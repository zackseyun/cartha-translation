  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: id
  text: Tidak lama kemudian, seorang yang lain melihat Petrus dan berkata, “Kamu juga salah seorang dari mereka.” Namun Petrus berkata, “Saudara, saya bukan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lengkap, “Saya bukan salah seorang dari mereka.” Teks Yunani hanya mengatakan, “Saya bukan,” dengan pelengkap yang tersirat dari tuduhan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Tidak lama kemudian
  rationale: Ungkapan waktu ini menunjukkan selang waktu yang singkat; pilihan ini alami dalam narasi bahasa Indonesia modern.
- source_word: ἕτερος
  choice: seorang lain
  rationale: Bentuk maskulin tunggal menunjuk kepada orang lain; frasa ini mempertahankan acuannya tanpa mengulang kata 'laki-laki' secara kaku.
- source_word: ἰδὼν αὐτὸν
  choice: melihat Petrus
  rationale: Partisip aoris menyatakan keadaan yang menyertai tindakan berbicara. Nama 'Petrus' digunakan untuk menghindari rangkaian pronomina yang kurang jelas dalam bahasa Indonesia.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Kamu juga salah seorang dari mereka
  rationale: ἐξ αὐτῶν secara idiomatis menyatakan keanggotaan atau keterkaitan dengan kelompok tersebut.
- source_word: Ἄνθρωπε
  choice: Saudara
  rationale: Vokatif ini merupakan sapaan langsung kepada seorang laki-laki. 'Saudara' terdengar alami dan cukup tegas dalam bahasa Indonesia, tanpa kesan biologis dari terjemahan harfiah 'manusia'.
- source_word: οὐκ εἰμί
  choice: bukan
  rationale: Jawaban eliptis Yunani secara harfiah berarti 'aku bukan'. Dalam bahasa Indonesia, 'bukan' menjadi penyangkalan eliptis yang ringkas dan alami serta membiarkan pelengkapnya tersirat.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Sapaan 'Saudara' menjaga nada penyangkalan langsung tanpa terdengar kuno atau kasar. Penyangkalan eliptis dipertahankan dalam bentuk Indonesia yang alami.
