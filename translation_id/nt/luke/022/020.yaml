base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: id
  text: Demikian juga, sesudah makan, Ia mengambil cawan itu dan berkata, “Cawan ini adalah perjanjian baru[a] dalam darah-Ku, yang dicurahkan bagi kalian.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wasiat baru dalam darah-Ku.” Namun, “perjanjian” lebih sesuai dengan latar ungkapan tentang darah perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, frasa “yang dicurahkan bagi kalian” ditempatkan sesudah seluruh pernyataan. Bentuknya secara gramatikal dapat dikaitkan dengan “cawan”, tetapi maknanya paling wajar menunjuk pada darah Yesus.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καὶ τὸ ποτήριον ὡσαύτως
  choice: Demikian juga ... Ia mengambil cawan itu
  rationale: Ungkapan ini bergantung pada tindakan dalam ayat sebelumnya. Kata kerja “mengambil” disiratkan oleh konteks dan dilengkapi agar kalimat Indonesia utuh, sedangkan “demikian juga” mempertahankan kaitannya dengan tindakan sebelumnya.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: setelah mereka makan
  rationale: Menyatakan urutan waktu secara alami tanpa membatasi δειπνῆσαι pada istilah budaya atau liturgis tertentu.
- source_word: λέγων
  choice: dan berkata
  rationale: Mengubah partisip Yunani menjadi verba koordinatif yang lebih wajar dalam bahasa Indonesia.
- source_word: ποτήριον
  choice: cawan
  rationale: “Cawan” merupakan istilah Indonesia yang ringkas dan bermartabat untuk wadah minum dalam konteks ini; pilihan ini tidak mengharuskan bentuk liturgis tertentu.
- source_word: ἡ καινὴ διαθήκη
  choice: perjanjian baru
  rationale: διαθήκη dalam konteks darah dan latar Kitab Suci menunjuk pada ikatan perjanjian, bukan terutama surat wasiat.
- source_word: ἐν τῷ αἵματί μου
  choice: dalam darah-Ku
  rationale: Mempertahankan preposisi dan ungkapan perjanjian Yunani tanpa mempersempitnya menjadi satu penjelasan teologis tertentu.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: yang dicurahkan bagi kalian
  rationale: “Dicurahkan” sesuai dengan gambaran darah yang mengalir, sedangkan “bagi kalian” menyampaikan ὑπὲρ dan memperjelas bahwa ὑμῶν berbentuk jamak tanpa merumuskan teori pendamaian tertentu.
theological_decisions:
- issue: Makna διαθήκη dalam rumusan mengenai cawan
  choice: perjanjian baru
  alternative: wasiat baru
  rationale: Latar bahasa darah perjanjian mendukung “perjanjian”. “Wasiat” dapat mencerminkan salah satu jangkauan leksikal διαθήκη, tetapi kurang tepat dalam konteks Yahudi dan alusi Kitab Suci ini.
- issue: Acuan frasa τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: Secara makna dipahami mengacu pada darah Yesus
  alternative: Secara gramatikal dapat dihubungkan dengan cawan karena bentuknya netral dan posisinya mengikuti seluruh klausa
  rationale: Bentuk partisip netral dapat selaras dengan ποτήριον, tetapi sesuatu yang dicurahkan bagi para murid secara alamiah adalah darah yang disebut tepat sebelumnya. Teks utama mempertahankan urutan klausa Yunani, dan catatan menjelaskan ketegangan sintaksisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan dengan jelas bahwa ὑμῶν berbentuk jamak. Kapital pada pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
