  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: id
  text: Sebab Aku berkata kepadamu, mulai sekarang Aku pasti tidak akan lagi minum dari hasil tanaman anggur[a] sampai Kerajaan Allah datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anggur” (minuman). Teks Yunani secara harfiah berbunyi “hasil tanaman anggur,” ungkapan yang lebih luas dan kemungkinan besar menunjuk pada isi cawan tanpa memakai kata yang lazim untuk minuman anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab Aku berkata kepadamu
  rationale: λέγω dengan datif ὑμῖν merupakan rumusan sapaan langsung. Terjemahan ini mempertahankan verba 'berkata' dan hubungan penjelas yang ditandai γάρ ('sebab').
- source_word: οὐ μὴ πίω
  choice: Aku pasti tidak akan minum lagi
  rationale: οὐ μή dengan subjungtif aoris menyatakan penyangkalan masa depan yang tegas. 'Pasti tidak akan' mempertahankan penekanannya, sedangkan 'lagi' secara wajar menyatakan penghentian mulai saat ini tanpa mengubah batas waktu yang disebutkan sesudahnya.
- source_word: ἀπὸ τοῦ νῦν
  choice: mulai sekarang
  rationale: Ungkapan ini menandai titik awal pada saat sekarang; 'mulai sekarang' alami dan tepat dalam bahasa Indonesia modern.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: dari hasil pokok anggur
  rationale: γένημα berarti sesuatu yang dihasilkan atau hasil/buah. 'Hasil pokok anggur' mempertahankan keluasan ungkapan Yunani dan tidak langsung mempersempitnya menjadi 'anggur' sebagai minuman.
- source_word: ἕως οὗ
  choice: sampai
  rationale: Frasa ini menetapkan batas waktu bagi pernyataan negatif; 'sampai' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: βασιλεία dapat menunjuk pada kerajaan maupun pemerintahan rajawi. 'Kerajaan Allah' adalah ungkapan yang mapan dan tetap memungkinkan kedua dimensi itu hadir.
- source_word: ἔλθῃ
  choice: datang
  rationale: Subjungtif aoris setelah ἕως οὗ berorientasi ke masa depan dan secara alami diterjemahkan 'sampai ... datang', tanpa menentukan tahap atau cara kedatangannya.
theological_decisions:
- issue: Apakah γενήματος τῆς ἀμπέλου diterjemahkan sebagai 'anggur' atau dengan ungkapan yang lebih luas
  choice: hasil pokok anggur
  alternative: anggur (minuman)
  rationale: Teks Yunani memakai ungkapan yang secara harfiah lebih luas daripada kata biasa untuk minuman anggur. Mempertahankan ungkapan itu menghindari penyempitan yang tidak dinyatakan langsung oleh teks, sementara catatan menjelaskan rujukan kontekstualnya.
- issue: Makna eskatologis kedatangan Kerajaan Allah
  choice: sampai Kerajaan Allah datang
  alternative: sampai Kerajaan Allah datang sepenuhnya
  rationale: Teks menetapkan batas waktu yang berorientasi ke masa depan, tetapi tidak menjelaskan cara atau tahap kedatangan Kerajaan Allah. Terjemahan tidak menambahkan sistem eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Huruf kapital pada 'Aku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk ucapan Yesus; 'Kerajaan Allah' dipertahankan sebagai istilah Alkitab yang mapan. Susunan kalimat menjaga hubungan penjelas γάρ dan penegasan kuat οὐ μή tanpa menjadi arkais.
