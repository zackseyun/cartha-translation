  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: id
  text: Dan para pria yang menahan Yesus mengolok-olok Dia sambil memukuli-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pria yang menahan-Nya sebagai tahanan.”
    reason: Alternatif ini menonjolkan bahwa συνέχω di sini dapat mengacu pada tindakan menahan seseorang dalam tahanan, bukan hanya memegang atau mengekangnya secara fisik.
lexical_decisions:
- source_word: Καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, pembukaan dengan 'dan' pada ayat ini terasa kurang alami. Alur narasi tetap jelas tanpa penghubung eksplisit.
- source_word: οἱ ἄνδρες
  choice: Orang-orang
  rationale: Mengungkapkan sekelompok laki-laki tanpa mempersempit identitas mereka menjadi penjaga atau prajurit, yang tidak disebutkan secara eksplisit oleh bahasa Yunani.
- source_word: οἱ συνέχοντες αὐτόν
  choice: yang menahan Yesus
  rationale: Kata kerja συνέχω dalam konteks ini menunjukkan bahwa mereka menahan atau menguasai Yesus secara fisik. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐνέπαιζον αὐτῷ
  choice: mengolok-olok Dia
  rationale: ἐμπαίζω menyatakan ejekan yang menghina dan bermusuhan; 'mengolok-olok' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: δέροντες
  choice: sambil memukuli-Nya
  rationale: Partisipel ini menyatakan tindakan memukul yang berlangsung bersamaan dengan ejekan. Bentuk iteratif 'memukuli' menangkap nuansa pukulan berulang tanpa mempersempitnya menjadi pencambukan.
theological_decisions:
- issue: Identitas orang-orang yang menganiaya Yesus
  choice: orang-orang yang menahan Yesus
  alternative: para penjaga yang menahan Yesus
  rationale: Teks Yunani memakai istilah umum ἄνδρες, bukan sebutan jabatan. Terjemahan tidak mengidentifikasi mereka secara lebih khusus daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur kalimat mempertahankan hubungan serentak antara ejekan dan pemukulan.
