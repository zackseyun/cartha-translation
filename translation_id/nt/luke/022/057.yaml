  text: Namun ia menyangkalnya[a] sambil berkata, “Aku tidak mengenal dia, hai perempuan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Namun ia menyangkal sambil berkata …” Teks Yunani tidak menyebutkan objek dari “menyangkal”; akhiran “-nya” merujuk pada tuduhan yang baru disampaikan.'
    reason: lexical_alternative
  - marker: b
    text: “Hai perempuan” menerjemahkan bentuk sapaan langsung γύναι. Pilihan seperti “Ibu” atau “Nyonya” akan memperhalus ungkapan secara interpretatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: menyangkalnya
  rationale: Verba ἀρνέομαι berarti menyangkal atau menolak. Bahasa Indonesia secara alami dapat memakai akhiran -nya untuk menyatakan hal yang disangkal, yakni tuduhan perempuan itu, tanpa menjadikan Yesus sebagai objek eksplisit.
- source_word: λέγων
  choice: katanya
  rationale: Partisipel ini memperkenalkan isi penyangkalan. 'Katanya' menyampaikan hubungan itu secara alami dan ringkas dalam narasi Indonesia.
- source_word: Οὐκ οἶδα
  choice: Aku tidak mengenal
  rationale: Dalam konteks hubungan pribadi dengan seseorang, οἶδα wajar diterjemahkan 'mengenal', bukan sekadar 'tahu'. Bentuk lengkap 'tidak mengenal' mempertahankan nada serius.
- source_word: αὐτόν
  choice: dia
  rationale: Pronomina ini merujuk langsung kepada Yesus. 'Dia' alami dalam bahasa Indonesia dan tidak menambahkan unsur seperti 'orang itu' yang tidak terdapat dalam teks Yunani.
- source_word: γύναι
  choice: hai perempuan
  rationale: Bentuk vokatif γύναι merupakan sapaan langsung kepada seorang perempuan. Partikel 'hai' menandai sapaan dan mempertahankan kelugasan teks tanpa pelunakan interpretatif seperti 'Ibu' atau 'Nyonya'.
theological_decisions:
- issue: Apakah objek penyangkalan Petrus perlu dinyatakan secara eksplisit
  choice: Memakai 'menyangkalnya' dengan -nya yang merujuk pada tuduhan atau pernyataan sebelumnya.
  alternative: 'Namun Petrus menyangkal dan berkata; atau: Namun Petrus menyangkal dia.'
  rationale: Teks Yunani tidak menyatakan objek ἠρνήσατο. Bentuk Indonesia 'menyangkalnya' alami dan menunjuk pada tuduhan dalam konteks, sedangkan 'menyangkal dia' akan terlalu menentukan bahwa Yesus adalah objek gramatikal langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama 'Petrus' dipakai untuk memperjelas subjek pronominal Yunani ὁ δὲ berdasarkan konteks dekat; sapaan 'hai perempuan' dipertahankan agar bentuk vokatif dan kelugasan ujaran tetap tampak.
