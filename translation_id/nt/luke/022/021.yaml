  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: id
  text: Namun lihatlah, tangan orang yang menyerahkan Aku ada bersama-Ku di meja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai kontras kuat dengan perkataan sebelumnya tanpa membuat hubungan yang lebih khusus daripada teks sumber.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan seruan yang menarik perhatian secara langsung dan wajar dalam bahasa Indonesia.
- source_word: τοῦ παραδιδόντος με
  choice: orang yang menyerahkan Aku
  rationale: Partisipel kini dipertahankan sebagai penggambaran pelaku; 'menyerahkan' mencakup tindakan menyerahkan Yesus kepada pihak berwenang tanpa membatasi maknanya hanya pada motif pengkhianatan.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Menerjemahkan ungkapan penyertaan secara langsung.
- source_word: ἐπὶ τῆς τραπέζης
  choice: di atas meja
  rationale: Mengikuti gambaran konkret teks Yunani bahwa tangan itu berada pada atau di atas meja.
theological_decisions:
- issue: Makna παραδίδωμι dalam konteks penangkapan Yesus
  choice: menyerahkan
  alternative: mengkhianati
  rationale: Kata Yunani secara harfiah menunjuk pada tindakan menyerahkan; pilihan ini mempertahankan keluasan makna dan tetap memungkinkan nuansa pengkhianatan dari konteks.
translation_notes:
  register: Bahasa modern, lugas, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan metafora 'tangan' dan kedekatan pelaku di meja.
