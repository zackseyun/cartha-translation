revisions:
- from: Ketika Yesus masih berbicara, lihatlah, datanglah serombongan orang. Orang yang disebut Yudas, salah seorang dari kedua belas murid, berjalan di depan mereka[a]. Ia mendekati Yesus untuk mencium-Nya.
  to: Ketika Yesus masih berbicara, lihatlah, datanglah sekumpulan orang. Orang yang disebut Yudas, salah seorang dari kedua belas, berjalan di depan mereka[a]. Ia mendekati Yesus untuk mencium-Nya.
  rationale: Revisi terbatas pada penghapusan “murid,” yang tidak terdapat dalam teks Yunani ayat ini, dan penggantian “serombongan orang” dengan “sekumpulan orang” untuk mencerminkan ὄχλος secara lebih netral. Penanda catatan kaki tetap ditempatkan pada terjemahan προήρχετο αὐτούς, dan pilihan alternatifnya tetap mempertahankan ambiguitas antara berjalan di depan dan memimpin.
