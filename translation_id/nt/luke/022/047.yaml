  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: id
  text: Ketika Yesus masih berbicara, lihatlah, datanglah sekumpulan orang. Orang yang disebut Yudas, salah seorang dari kedua belas, berjalan di depan mereka[a]. Ia mendekati Yesus untuk mencium-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memimpin mereka” atau “berjalan mendahului mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Ketika Yesus masih berbicara
  rationale: Konstruksi genitif absolut menyatakan tindakan yang sedang berlangsung bersamaan dengan peristiwa berikutnya. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang menarik perhatian pada kemunculan rombongan secara mendadak dan memberi kejelasan naratif.
- source_word: ὄχλος
  choice: datanglah serombongan orang
  rationale: ὄχλος berarti kerumunan atau rombongan orang. Kata kerja “datanglah” disuplai secara wajar karena kedatangan tersirat oleh konteks dan diperlukan agar klausa alami dalam bahasa Indonesia.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: Orang yang disebut Yudas
  rationale: Menerjemahkan ungkapan partisipial identifikasi secara dekat tanpa memasukkan nada meremehkan yang tidak terdapat dalam teks.
- source_word: εἷς τῶν δώδεκα
  choice: salah seorang dari kedua belas murid
  rationale: “Murid” ditambahkan untuk membuat rujukan kelompok yang sudah dikenal itu jelas bagi pembaca Indonesia, sambil mempertahankan ironi naratif bahwa Yudas termasuk kelompok kedua belas.
- source_word: προήρχετο αὐτούς
  choice: berjalan di depan mereka
  rationale: Mempertahankan aspek imperfek dan arti dasar bergerak di depan rombongan tanpa memastikan bahwa Yudas secara formal memimpin mereka; kemungkinan nuansa itu dicatat dalam catatan kaki.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Ia mendekati Yesus
  rationale: Ungkapan Indonesia yang alami untuk tindakan mendekat yang dinyatakan oleh aoristus ἐγγίζω.
- source_word: φιλῆσαι αὐτόν
  choice: untuk mencium-Nya
  rationale: Menyampaikan arti lugas φιλέω dalam konteks ini tanpa menambahkan penjelasan bahwa ciuman tersebut merupakan salam atau sarana pengkhianatan.
theological_decisions:
- issue: Penggambaran tindakan Yudas dalam narasi
  choice: Pendekatan dan ciuman Yudas diterjemahkan secara lugas tanpa menambahkan kata “mengkhianati”.
  alternative: “untuk mengkhianati-Nya dengan ciuman”
  rationale: Konteks bagian ini menunjukkan pengkhianatan, tetapi ayat ini sendiri hanya menggambarkan Yudas mendekati Yesus untuk mencium-Nya. Terjemahan tidak boleh menjelaskan ketegangan moral dan teologis dengan memasukkan unsur yang tidak dinyatakan.
- issue: Nuansa προήρχετο αὐτούς
  choice: berjalan di depan mereka
  alternative: memimpin mereka
  rationale: Bentuk Yunani dapat menyiratkan bahwa Yudas menuntun rombongan, tetapi arti yang lebih netral adalah bergerak di depan mereka. Teks utama mempertahankan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibagi agar mudah dipahami. “Lihatlah” mempertahankan daya tarik naratif ἰδοὺ, sedangkan bentuk hormat “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambah informasi leksikal.
