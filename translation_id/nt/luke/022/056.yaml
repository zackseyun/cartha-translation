    text: Atau, “dalam cahaya.” Frasa Yunani ini dapat menunjuk posisi dekat sumber cahaya maupun berada di area yang diterangi.
    reason: lexical_alternative
  revision_rationale: Revisi mempertahankan urutan dan fungsi dua partisip Yunani—pelayan itu melihat Petrus, menatapnya dengan saksama, lalu berbicara—dalam satu kalimat Indonesia yang jelas. Diksi dimodernkan, pengulangan yang tidak perlu dihilangkan, dan kapitalisasi pronomina yang tidak ditandai sumber tidak dipaksakan. Catatan kaki mempertahankan ambiguitas yang relevan mengenai πρὸς τὸ φῶς.
