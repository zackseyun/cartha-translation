  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: id
  text: Kemudian, ketika melihat Petrus sedang duduk di dekat cahaya[a], seorang pelayan perempuan menatapnya dengan saksama lalu berkata, “Orang ini juga bersama dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam cahaya.” Frasa Yunani ini dapat menunjuk posisi dekat sumber cahaya maupun berada di area yang diterangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: melihat
  rationale: Partisip aoris ini menyatakan bahwa hamba perempuan itu melihat Petrus; bentuk verba finit lebih alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Kemudian
  rationale: Di sini δέ terutama melanjutkan alur narasi, bukan menyatakan pertentangan kuat.
- source_word: παιδίσκη τις
  choice: seorang hamba perempuan
  rationale: παιδίσκη menunjuk perempuan muda berstatus pelayan atau budak. 'Hamba perempuan' mempertahankan unsur status tanpa menambahkan penekanan yang tidak dituntut konteks; τις terwakili oleh 'seorang'.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: Petrus duduk di dekat cahaya
  rationale: καθήμενον menyatakan posisi duduk, sedangkan πρὸς τὸ φῶς paling langsung menunjukkan posisi relatif terhadap sumber cahaya. Nama Petrus dipakai untuk menghindari rangkaian pronomina yang kabur dalam bahasa Indonesia.
- source_word: ἀτενίσασα αὐτῷ
  choice: Setelah menatapnya dengan saksama
  rationale: ἀτενίζω menyatakan tatapan yang terarah dan sungguh-sungguh; konstruksi temporal alami dalam bahasa Indonesia mempertahankan urutan tindakan.
- source_word: Καὶ οὗτος
  choice: Orang ini juga
  rationale: Ungkapan ini mempertahankan daya tunjuk οὗτος dan makna tambahan καί secara wajar.
- source_word: σὺν αὐτῷ ἦν
  choice: bersama-sama dengan Dia
  rationale: Terjemahan langsung ini mempertahankan makna persekutuan atau keberadaan bersama. Huruf kapital membedakan rujukan kepada Yesus dari Petrus dalam kalimat Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur partisip Yunani dipecah menjadi dua kalimat agar hubungan pelaku dan urutan tindakan jelas bagi pembaca umum. 'Cahaya' dipertahankan tanpa menambahkan 'api', sebab τὸ φῶς sendiri tidak menyebut sumbernya.
