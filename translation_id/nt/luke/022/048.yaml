id: LUK.22.48
reference: Luke 22:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: id
  text: Namun, Yesus berkata kepadanya, “Yudas, apakah dengan ciuman engkau menyerahkan Anak Manusia?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yudas, apakah engkau mengkhianati Anak Manusia dengan ciuman?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: δέ adalah penghubung ringan yang dalam konteks ini bernuansa pertentangan, menandai tanggapan Yesus terhadap tindakan Yudas.
- source_word: εἶπεν αὐτῷ
  choice: berkata kepadanya
  rationale: Pronomina datif αὐτῷ dinyatakan secara eksplisit dalam bahasa Yunani dan wajar dipertahankan dalam bahasa Indonesia.
- source_word: Ἰούδα
  choice: Yudas
  rationale: Bentuk vokatif nama diri ini diterjemahkan menurut bentuk baku yang dikenal dalam bahasa Indonesia.
- source_word: φιλήματι
  choice: dengan ciuman
  rationale: Bentuk datif ini menyatakan sarana; frasa tersebut konkret, alami, dan tidak menambahkan penafsiran.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Ungkapan ini merupakan sebutan khas yang digunakan Yesus bagi diri-Nya dan mempertahankan kaitan antarteksnya, termasuk gema Daniel 7.
- source_word: παραδίδως
  choice: engkau menyerahkan
  rationale: Kata kerja kini orang kedua tunggal ini menggambarkan tindakan yang sedang berlangsung. 'Menyerahkan' mempertahankan cakupan leksikal kata Yunani, termasuk ketegangan antara tindakan penyerahan dan pengkhianatan dalam konteks.
theological_decisions:
- issue: Terjemahan τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Manusia itu
  rationale: Bentuk tradisional ini mempertahankan struktur ungkapan Yunani, fungsi kristologisnya sebagai rujukan diri Yesus, dan bobot antarteksnya tanpa mereduksinya menjadi ungkapan generik.
- issue: Nuansa παραδίδως
  choice: menyerahkan
  alternative: mengkhianati
  rationale: '''Menyerahkan'' lebih dekat pada bentuk leksikal sumber dan membiarkan konteks menunjukkan bahwa tindakan itu merupakan pengkhianatan, sehingga ketegangan semantis tidak diselesaikan secara diam-diam.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat alami, sedangkan 'engkau' dipakai untuk sapaan langsung yang jelas dan bernada khidmat tanpa menjadi arkais.
