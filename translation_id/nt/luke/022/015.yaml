id: LUK.22.15
reference: Luke 22:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Aku sangat rindu[a] makan Paskah ini[b] bersama kalian sebelum Aku menderita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Dengan kerinduan Aku telah merindukan”; bahasa Yunani memakai konstruksi penegasan untuk menunjukkan betapa kuat kerinduan Yesus.
    reason: lexical_alternative
  - marker: b
    text: “Paskah ini” di sini dapat secara khusus menunjuk pada perjamuan Paskah.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: Ia berkata kepada mereka
  rationale: Ungkapan naratif langsung yang secara wajar menerjemahkan λέγω dengan πρός dan akusatif.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Aku sangat rindu
  rationale: Konstruksi serumpun antara nomina dan verba memberi penekanan kuat. Ungkapan ini menyampaikan kerinduan mendalam secara alami tanpa meniru susunan Yunani secara kaku.
- source_word: τοῦτο τὸ πάσχα
  choice: Paskah ini
  rationale: πάσχα dapat menunjuk pada perayaan atau perjamuan Paskah. Dalam konteks makan, perjamuan dimaksudkan, tetapi bentuk ringkas ini mempertahankan keluasan istilah sumber.
- source_word: φαγεῖν
  choice: makan
  rationale: Padanan langsung dan lazim bagi infinitif aoris dari ἐσθίω; tidak perlu diperhalus menjadi ‘menyantap’ atau diperluas.
- source_word: μεθ’ ὑμῶν
  choice: bersama kalian
  rationale: Menyatakan kebersamaan secara langsung; ‘kalian’ merupakan bentuk jamak orang kedua yang jelas dan alami dalam bahasa Indonesia modern.
- source_word: πρὸ τοῦ με παθεῖν
  choice: sebelum Aku menderita
  rationale: Infinitif berartikel dengan πρό menyatakan waktu yang mendahului, sedangkan πάσχω menunjuk pada penderitaan Yesus yang segera terjadi tanpa merinci bentuknya.
theological_decisions:
- issue: Makna πάσχα dalam konteks
  choice: Paskah ini
  alternative: perjamuan Paskah ini
  rationale: Konteks makan menunjukkan bahwa perjamuan Paskah berada dalam pandangan, tetapi teks Yunani tetap memakai istilah πάσχα. Terjemahan utama mempertahankan istilah itu dan menjelaskan kemungkinan acuannya dalam catatan kaki.
- issue: Daya tekan Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Aku sangat rindu
  alternative: Dengan kerinduan Aku telah merindukan
  rationale: Bentuk Yunani yang menegaskan kerinduan diterjemahkan secara idiomatis, sambil mempertahankan intensitas dan ketegangan emosional menjelang penderitaan Yesus.
- issue: Cakupan πάσχω
  choice: Aku menderita
  alternative: Aku mengalami sengsara
  rationale: ‘Menderita’ mempertahankan keluasan verba Yunani dan tidak memasukkan istilah teologis atau rincian peristiwa yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. ‘Kalian’ dipakai untuk memperjelas bentuk jamak tanpa ungkapan yang kaku. Kapitalisasi ‘Ia’ dan ‘Aku’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
