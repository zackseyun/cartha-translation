  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: id
  text: Ia akan menunjukkan kepada kalian sebuah ruangan di lantai atas yang besar dan sudah ditata[a]. Siapkanlah di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah ruangan di lantai atas yang besar dan sudah dipersiapkan” atau “sebuah ruangan di lantai atas yang besar dengan perlengkapan yang sudah ditata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Ia
  rationale: Gabungan καί dan ἐκεῖνος melanjutkan rangkaian petunjuk dan menunjuk kepada pemilik rumah yang disebut sebelumnya. Dalam bahasa Indonesia, subjek “ia” sudah alami; hubungan kelanjutan tidak perlu selalu dinyatakan dengan “dan” pada awal kalimat.
- source_word: ὑμῖν δείξει
  choice: akan menunjukkan kepada kalian
  rationale: Bentuk futur δείξει berarti “akan menunjukkan,” sedangkan datif jamak ὑμῖν diterjemahkan secara alami sebagai “kepada kalian,” yang juga memperjelas bahwa lebih dari satu murid disapa.
- source_word: ἀνάγαιον μέγα
  choice: sebuah ruangan atas yang besar
  rationale: ἀνάγαιον adalah ruangan di lantai atas, dan μέγα menerangkan ukurannya. “Ruangan atas” mempertahankan istilah naratif yang ringkas tanpa menambahkan fungsi khusus yang tidak dinyatakan teks.
- source_word: ἐστρωμένον
  choice: sudah ditata
  rationale: Partisipel perfekt pasif ini menggambarkan keadaan ruangan yang telah diatur, kemungkinan dengan perlengkapan atau tempat berbaring untuk perjamuan. “Sudah ditata” mempertahankan keadaan hasil tanpa memastikan apakah maksudnya “berperabot” atau “sepenuhnya siap.”
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: Siapkanlah di sana
  rationale: ἐκεῖ adalah penunjuk tempat “di sana,” dan imperatif jamak ἑτοιμάσατε memerintahkan para murid untuk melakukan persiapan. Akhiran “-lah” menyampaikan perintah secara wajar dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk jamak ὑμῖν secara eksplisit. Ambiguitas ἐστρωμένον dipertahankan melalui “sudah ditata” dan dijelaskan dalam catatan kaki.
