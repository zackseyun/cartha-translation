id: LUK.22.60
reference: Luke 22:60
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: id
  text: Namun Petrus berkata, “Saudara, aku tidak tahu apa yang kamu katakan.” Seketika itu juga, sementara ia masih berbicara, berkokoklah seekor ayam jantan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai pertentangan dengan tuduhan sebelumnya dan kelanjutan rangkaian penyangkalan secara wajar dalam narasi Indonesia.
- source_word: Ἄνθρωπε
  choice: Saudara
  rationale: Sapaan langsung kepada seorang laki-laki; “Saudara” mempertahankan fungsi vokatif tanpa kekakuan atau nuansa kasar yang dapat timbul dari terjemahan harfiah “Manusia”.
- source_word: οὐκ οἶδα
  choice: aku tidak tahu
  rationale: Menyampaikan verba οἶδα yang berbentuk perfek tetapi bermakna keadaan kini, dengan penyangkalan langsung.
- source_word: ὃ λέγεις
  choice: apa yang kamu katakan
  rationale: Terjemahan langsung yang mempertahankan fokus pada perkataan lawan bicara tanpa menafsirkannya sebagai maksud atau pokok pembicaraan.
- source_word: παραχρῆμα
  choice: Seketika itu juga
  rationale: Mengungkapkan kejadian tanpa jeda secara alami dan tegas dalam bahasa Indonesia.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: sementara ia masih berbicara
  rationale: Mempertahankan hubungan waktu serentak dalam konstruksi genitif absolut serta penekanan ἔτι, “masih”.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: berkokoklah seekor ayam jantan
  rationale: Dalam konteks ini ἀλέκτωρ adalah ayam jantan, dan ἐφώνησεν secara idiomatis dinyatakan dengan “berkokok”; inversi menjaga alur naratif yang wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina “aku–kamu” cocok untuk dialog langsung dan ketegangan adegan; sapaan “Saudara” menghindari terjemahan kaku “Manusia” serta tidak menambahkan gelar kehormatan yang tidak pasti.
