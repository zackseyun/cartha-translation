  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: id
  text: Hari Raya Roti Tidak Beragi[a], yang disebut Paskah, sedang mendekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paskah dan Hari Raya Roti Tidak Beragi merupakan perayaan yang berkaitan erat. Dalam penggunaan Yahudi, keduanya dapat disebut bersama-sama atau dengan nama yang saling bertumpang tindih.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: sudah semakin dekat
  rationale: Bentuk imperfek menggambarkan hari raya itu sedang mendekat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa proses serta kedekatan waktunya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini berfungsi sebagai penghubung wacana ringan. Dalam bahasa Indonesia, peralihan narasi sudah jelas tanpa menambahkan kata seperti “adapun” atau “lalu” yang dapat memberi tekanan berlebihan.
- source_word: ἡ ἑορτὴ
  choice: Hari Raya
  rationale: Kata ini menunjuk pada perayaan keagamaan; “Hari Raya” merupakan padanan Indonesia yang lazim dan bermartabat dalam nama perayaan ini.
- source_word: τῶν ἀζύμων
  choice: Roti Tidak Beragi
  rationale: Frasa genitif ini merupakan nama perayaan Yahudi. Padanan tersebut jelas dan mapan dalam bahasa Indonesia.
- source_word: ἡ λεγομένη
  choice: yang disebut
  rationale: Bentuk partisipial ini memberi penjelasan berupa nama lain bagi perayaan tersebut; “yang disebut” mempertahankan fungsi penjelasannya secara alami.
- source_word: Πάσχα
  choice: Paskah
  rationale: Dalam konteks ini kata tersebut menunjuk pada perayaan Paskah Yahudi. “Paskah” adalah padanan yang sudah dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara Hari Raya Roti Tidak Beragi dan Paskah
  choice: 'Mempertahankan identifikasi penjelas Lukas: “Hari Raya Roti Tidak Beragi, yang disebut Paskah.”'
  alternative: Membedakan keduanya secara tegas melalui terjemahan yang menonjolkan perbedaan kronologis atau teknis.
  rationale: Susunan Yunani menyajikan “Paskah” sebagai sebutan penjelas bagi masa perayaan itu. Terjemahan ini mempertahankan cara Lukas mengungkapkannya tanpa memaksakan penyelarasan ataupun pembedaan teknis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan mudah dipahami. Nama perayaan memakai bentuk yang telah dikenal luas. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
