  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Ketika Aku mengutus kalian tanpa kantong uang, tas perjalanan[a], dan sandal, apakah kalian kekurangan sesuatu?” Mereka menjawab, “Tidak ada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ransel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: mengutus kalian
  rationale: Dalam konteks pengutusan untuk pelayanan, verba ini menyatakan bahwa mereka diutus menjalankan tugas; 'mengutus' menyampaikan makna itu secara alami tanpa perlu menambahkan 'pergi'.
- source_word: ἄτερ
  choice: tanpa
  rationale: Preposisi ini menunjukkan ketiadaan; 'tanpa' adalah padanan Indonesia yang paling langsung dan wajar.
- source_word: βαλλαντίου
  choice: kantong uang
  rationale: Istilah ini menunjuk pada kantong tempat membawa uang; pilihan ini konkret dan mudah dipahami pembaca modern.
- source_word: πήρας
  choice: tas perjalanan
  rationale: Kata ini menunjuk pada tas atau ransel untuk membawa bekal dalam perjalanan. 'Tas perjalanan' menyatakan fungsinya secara jelas, sedangkan alternatif yang lebih spesifik dipertahankan dalam catatan kaki.
- source_word: ὑποδημάτων
  choice: sandal
  rationale: Dalam konteks perjalanan pada zaman Injil, 'sandal' merupakan padanan yang tepat secara budaya dan lazim dalam bahasa Indonesia.
- source_word: μή τινος ὑστερήσατε
  choice: apakah kalian kekurangan sesuatu?
  rationale: Bentuk pertanyaan Yunani mengharapkan jawaban negatif, sementara ὑστερέω berarti mengalami kekurangan. Terjemahan ini mempertahankan bentuk pertanyaan dan maknanya dengan wajar.
- source_word: Οὐθενός
  choice: Tidak ada
  rationale: Jawaban genitif yang sangat ringkas ini berarti bahwa tidak ada sesuatu pun yang kurang. 'Tidak ada' mempertahankan keringkasan dan merupakan jawaban alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'Ia/Aku' mengikuti konvensi penghormatan yang lazim bagi Yesus, sedangkan 'kalian' secara alami menandai bahwa orang kedua dalam teks Yunani berbentuk jamak.
