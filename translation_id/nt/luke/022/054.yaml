id: LUK.22.54
reference: Luke 22:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: id
  text: Setelah menangkap Yesus, mereka membawa-Nya pergi dan memasukkan-Nya ke rumah Imam Besar. Namun, Petrus terus mengikuti dari jauh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dari kejauhan.'
    reason: Alternatif idiomatis bagi μακρόθεν yang mempertahankan makna jarak ruang.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Setelah menangkap
  rationale: Partisip aoris ini menyatakan tindakan yang terjadi sebelum kata kerja utama. “Menangkap” wajar dalam konteks penahanan dan lebih tepat daripada kata umum seperti “meraih” atau “memegang.”
- source_word: αὐτόν
  choice: Yesus / -Nya
  rationale: Rujukannya adalah Yesus. Penyebutan nama pada awal ayat memperjelas acuan dalam bahasa Indonesia, sedangkan bentuk “-Nya” selanjutnya menghindari pengulangan yang kaku.
- source_word: ἤγαγον
  choice: membawa-Nya pergi
  rationale: ἄγω menyatakan tindakan membawa atau menuntun seseorang. Tambahan “pergi” menyampaikan perpindahan di bawah pengawalan tanpa memperberat kalimat.
- source_word: εἰσήγαγον
  choice: memasukkan-Nya ke
  rationale: εἰσάγω menekankan gerak masuk ke suatu tempat. Pilihan ini mempertahankan arah gerak dan menghindari pengulangan “membawa.”
- source_word: οἰκίαν
  choice: rumah
  rationale: Dalam konteks ini οἰκία menunjuk bangunan atau kediaman fisik; “rumah” merupakan padanan Indonesia yang paling langsung dan alami.
- source_word: ἀρχιερέως
  choice: Imam Besar
  rationale: ἀρχιερεύς adalah istilah baku Perjanjian Baru bagi pemimpin keimaman tertinggi. Huruf kapital dipakai sebagai sebutan jabatan tertentu dalam narasi ini.
- source_word: ἠκολούθει
  choice: terus mengikuti
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung. “Terus mengikuti” menyampaikan aspek duratif secara alami tanpa menambahkan penilaian tentang motif Petrus.
- source_word: μακρόθεν
  choice: dari jauh
  rationale: Adverbia ini menunjukkan jarak secara ruang. “Dari jauh” jelas dan alami dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: Namun
  rationale: δέ kedua menandai kontras ringan antara Yesus yang dibawa masuk dan Petrus yang tetap mengikuti secara terpisah pada jarak tertentu.
theological_decisions:
- issue: Gambaran hubungan Petrus dengan Yesus ketika Yesus ditangkap
  choice: “Petrus terus mengikuti dari jauh”
  alternative: “Petrus mengikuti dari kejauhan”
  rationale: Terjemahan mempertahankan tindakan yang berlangsung dan jarak fisik yang disebut teks, tanpa menambahkan penilaian bahwa Petrus mengikuti secara sembunyi-sembunyi, takut, atau tidak setia.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan verba dibuat alami sambil mempertahankan urutan penangkapan, pembawaan pergi, dan masuk ke rumah Imam Besar. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia, tanpa menambahkan isi teologis pada teks.
