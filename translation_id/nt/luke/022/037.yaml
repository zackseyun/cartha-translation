id: LUK.22.37
reference: Luke 22:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: id
  text: 'Sebab Aku berkata kepadamu bahwa apa yang tertulis ini harus digenapi dalam diri-Ku: “Dan Ia terhitung di antara para pelanggar hukum.”[a] Sebab apa yang mengenai Aku sedang mencapai kesudahannya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan yang lebih tradisional, “Dan Ia terbilang di antara orang-orang durhaka” (Yes. 53:12).
    reason: alternative_reading
  - marker: b
    text: Atau “apa yang mengenai Aku mencapai penggenapannya” atau “sedang menuju penyelesaian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab Aku berkata kepadamu
  rationale: Mempertahankan γάρ sebagai penghubung penjelas dan menerjemahkan konstruksi λέγω ... ὑμῖν secara wajar serta cukup formal dalam bahasa Indonesia.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: apa yang tertulis ini
  rationale: Mempertahankan unsur demonstratif dan partisipel perfektum tanpa menambahkan kata 'Kitab Suci', yang tidak dinyatakan secara eksplisit dalam frasa Yunani.
- source_word: δεῖ τελεσθῆναι
  choice: harus digenapi
  rationale: Kata 'harus' mempertahankan daya keharusan δεῖ, sedangkan 'digenapi' sesuai dengan konteks perkataan tertulis yang menjadi kenyataan.
- source_word: ἐν ἐμοί
  choice: dalam diri-Ku
  rationale: Mempertahankan gambaran ἐν sekaligus terdengar alami dalam bahasa Indonesia dan tidak mempersempit artinya hanya menjadi 'mengenai Aku'.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: Dan Ia terhitung di antara para pelanggar hukum
  rationale: '''Pelanggar hukum'' menyampaikan ἀνόμων secara langsung, sedangkan bentuk pasif ''terhitung'' mencerminkan ἐλογίσθη. Kata ''di antara'' mengungkapkan pengelompokan yang dimaksud oleh μετά.'
- source_word: τὸ περὶ ἐμοῦ
  choice: apa yang mengenai Aku
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan keluasan frasa Yunani tentang segala sesuatu yang berkaitan dengan Yesus.
- source_word: τέλος ἔχει
  choice: sedang mencapai kesudahannya
  rationale: Pilihan ini mempertahankan nuansa gerak menuju akhir, penyelesaian, atau penggenapan tanpa memutuskan secara terlalu sempit di antara kemungkinan-kemungkinan tersebut.
theological_decisions:
- issue: Perumusan kutipan Yesaya 53:12
  choice: Ia terhitung di antara para pelanggar hukum
  alternative: Ia terbilang di antara orang-orang durhaka / pemberontak
  rationale: Teks utama mengikuti arti ἀνόμων secara lebih langsung. Padanan tradisional yang menonjolkan kedurhakaan atau pemberontakan dicatat sebagai alternatif karena kaitannya dengan bunyi Yesaya 53:12 dalam tradisi penerjemahan.
- issue: Makna τέλος ἔχει
  choice: sedang mencapai kesudahannya
  alternative: mencapai penggenapannya / sedang menuju penyelesaian
  rationale: Frasa Yunani dapat menunjuk pada akhir, penyelesaian, atau penggenapan. Terjemahan utama sengaja mempertahankan ketegangan makna itu dalam konteks penderitaan Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti yang merujuk kepada Yesus dipakai sesuai kebiasaan luas dalam penerbitan Alkitab berbahasa Indonesia. Struktur sebab-akibat dan bentuk kutipan dipertahankan, sementara klausa terakhir dibiarkan memiliki nuansa akhir sekaligus penyelesaian.
