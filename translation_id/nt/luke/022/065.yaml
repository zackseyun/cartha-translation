  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: id
  text: Dan mereka terus melontarkan banyak cercaan lain terhadap-Nya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak hujatan lain” atau “banyak perkataan kasar lain.” Kata Yunani yang dipakai dapat menunjuk pada perkataan yang mencerca, menghina, atau menghujat.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kepada-Nya.” Dalam konteks ini, “terhadap-Nya” lebih jelas menyampaikan bahwa perkataan itu bersifat menyerang.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: juga
  rationale: Menghubungkan tindakan ini dengan perlakuan sebelumnya dan secara alami menyatakan tambahan dalam bahasa Indonesia.
- source_word: ἕτερα πολλὰ
  choice: banyak ... lain
  rationale: Mempertahankan gagasan jumlah yang besar sekaligus tambahan pada penghinaan yang sudah disebutkan.
- source_word: βλασφημοῦντες
  choice: hujatan
  rationale: βλασφημέω dapat menunjuk pada penghinaan, cercaan, atau hujatan. 'Hujatan' mempertahankan daya dan keseriusan istilah Yunani tanpa membatasi catatan kaki pada satu nuansa saja.
- source_word: ἔλεγον
  choice: terus melontarkan
  rationale: Bentuk imperfek menggambarkan ujaran yang sedang berlangsung atau berulang; 'terus' menyampaikan aspek itu, sedangkan 'melontarkan' merupakan ungkapan Indonesia yang wajar untuk perkataan bermusuhan.
- source_word: εἰς αὐτόν
  choice: terhadap-Nya
  rationale: Dalam konteks ujaran yang bermusuhan, frasa ini secara alami berarti bahwa hujatan tersebut diarahkan terhadap Yesus.
theological_decisions:
- issue: Apakah βλασφημοῦντες diterjemahkan sebagai penghinaan umum atau dengan istilah yang lebih kuat
  choice: hujatan
  alternative: cercaan atau perkataan yang menghina
  rationale: Istilah Yunani mencakup cercaan yang berat dan dapat bermakna hujatan. Terjemahan utama mempertahankan bobot katanya, sedangkan catatan kaki mengakui cakupan leksikal yang lebih luas tanpa mendasarkan pilihan pada doktrin denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan 'terus melontarkan' menyampaikan tindakan ujaran yang berulang, sedangkan kapitalisasi pronomina 'Nya' mengikuti kebiasaan hormat dalam penerjemahan Alkitab bahasa Indonesia.
