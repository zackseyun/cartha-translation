id: LUK.22.39
reference: Luke 22:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: id
  text: Lalu Yesus keluar dan pergi ke Bukit Zaitun seperti kebiasaan-Nya, dan murid-murid juga mengikuti Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: keluar
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Dalam bahasa Indonesia, rangkaian 'keluar dan pergi' mempertahankan alur naratif secara alami tanpa konstruksi partisipial yang kaku.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: Verba naratif umum πορεύομαι paling wajar diterjemahkan 'pergi'.
- source_word: κατὰ τὸ ἔθος
  choice: seperti kebiasaan-Nya
  rationale: Frasa ini menunjukkan tindakan yang biasa dilakukan. Bentuk ini alami dalam bahasa Indonesia; akhiran '-Nya' menjadikan rujukan kepada Yesus eksplisit sesuai konteks, meskipun kata ganti posesif tidak dinyatakan tersendiri dalam bahasa Yunani.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ke Bukit Zaitun
  rationale: Ini adalah bentuk baku dan mudah dikenali bagi nama tempat tersebut dalam bahasa Indonesia.
- source_word: ἠκολούθησαν
  choice: mengikuti
  rationale: ἀκολουθέω secara langsung berarti 'mengikuti' dan di sini cocok bagi gerakan fisik para murid sekaligus relasi mereka sebagai murid.
- source_word: οἱ μαθηταί
  choice: Murid-murid
  rationale: Artikel Yunani diterapkan secara kontekstual tanpa menambahkan kata posesif 'Nya', yang tidak eksplisit dalam teks sumber.
- source_word: καὶ ... δὲ καὶ
  choice: Lalu ... juga
  rationale: καί awal menghubungkan ayat ini dengan narasi sebelumnya, sedangkan δὲ καί meneruskan cerita dengan daya tambah; 'lalu' dan 'juga' menghasilkan bahasa Indonesia yang mengalir.
theological_decisions:
- issue: Apakah Yesus perlu dijadikan subjek eksplisit dan pemilik kebiasaan tersebut
  choice: Menyebut 'Yesus' dan menerjemahkan 'seperti kebiasaan-Nya'
  alternative: '''Ia keluar dan pergi menurut kebiasaan'''
  rationale: Subjek verba tersirat dalam bentuk Yunani dan jelas menunjuk kepada Yesus dari konteks. Bahasa Indonesia memerlukan subjek yang lebih eksplisit agar tidak janggal. 'Seperti kebiasaan-Nya' menyampaikan makna κατὰ τὸ ἔθος secara idiomatis, sambil mengakui bahwa unsur posesif berasal dari konteks, bukan kata tersendiri dalam frasa Yunani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas subjek tersirat; 'Bukit Zaitun' mengikuti bentuk nama tempat yang lazim. Tidak diperlukan catatan kaki karena tidak ada varian tekstual atau ambiguitas penting yang perlu ditampilkan kepada pembaca pada ayat ini.
