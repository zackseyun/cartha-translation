base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: id
  text: Lalu mereka mulai berdiskusi satu sama lain tentang siapa di antara mereka yang mungkin akan melakukan hal itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “siapa gerangan di antara mereka yang akan melakukan hal itu.” Konteks menunjukkan bahwa “hal itu” adalah tindakan pengkhianatan yang diumumkan dalam ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: mulai
  rationale: Bentuk aoristus ingresif bersama infinitif menandai dimulainya suatu tindakan; “mulai” mempertahankan daya aspektual itu secara alami.
- source_word: συζητεῖν
  choice: membicarakan
  rationale: Kata ini dapat berarti berdiskusi atau berdebat bersama. “Membicarakan” sesuai dengan upaya para murid mengenali pelakunya tanpa melebih-lebihkan nadanya sebagai pertengkaran.
- source_word: πρὸς ἑαυτούς
  choice: di antara mereka
  rationale: Ungkapan ini menunjukkan interaksi timbal balik di dalam kelompok tersebut.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: siapa di antara mereka yang mungkin
  rationale: Pertanyaan tak langsung itu menanyakan identitas seseorang dari kelompok yang sudah diketahui. “Mungkin” menyampaikan ketidakpastian deliberatif dari ἄρα dan bentuk optatif εἴη tanpa membuat bahasa Indonesia terasa kaku.
- source_word: μέλλων πράσσειν
  choice: akan melakukan
  rationale: μέλλω dengan infinitif menunjukkan tindakan yang akan terjadi atau sudah dekat. Dalam bahasa Indonesia, “akan melakukan” paling alami; unsur kedekatannya cukup ditopang oleh konteks pengumuman Yesus.
- source_word: τοῦτο
  choice: hal itu
  rationale: Kata tunjuk ini merujuk kembali kepada perbuatan yang baru disebutkan, tanpa menyebut pengkhianatan secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Apakah tindakan itu perlu disebut secara eksplisit sebagai pengkhianatan
  choice: Mempertahankan ungkapan umum “melakukan hal itu” dalam teks utama.
  alternative: “mengkhianati Dia”
  rationale: Walaupun konteks ayat sebelumnya menjelaskan bahwa yang dimaksud ialah pengkhianatan, bahasa Yunani ayat ini hanya mengatakan τοῦτο μέλλων πράσσειν. Terjemahan tidak menambahkan objek atau tindakan yang tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pengulangan “mereka” dipertahankan karena memperjelas bahwa pelakunya dicari dari kelompok itu sendiri; partikel “gerangan” ditempatkan sebagai alternatif catatan kaki karena lebih formal dan dapat mencerminkan nuansa deliberatif ἄρα.
