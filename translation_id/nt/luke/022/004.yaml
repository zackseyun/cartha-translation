  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: id
  text: Lalu Yudas pergi dan berunding dengan imam-imam kepala dan para perwira[a] tentang bagaimana ia dapat menyerahkan Yesus kepada mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Para “perwira” ini kemungkinan besar adalah pejabat atau komandan penjaga Bait Allah, bukan prajurit Romawi.
    reason: cultural_note
  - marker: b
    text: Atau “mengkhianati Yesus.” Verba Yunani yang dipakai dapat berarti “menyerahkan,” “menyerahkan kepada pihak lain,” atau, dalam konteks ini, “mengkhianati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθὼν
  choice: pergi
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului atau menyertai verba utama. Dalam bahasa Indonesia, rangkaian alami “Lalu ... pergi dan berunding” mempertahankan urutan narasi tanpa terasa kaku.
- source_word: συνελάλησεν
  choice: berunding
  rationale: Verba ini menunjuk pada pembicaraan bersama atau perembukan, bukan sekadar berbicara; “berunding” menyampaikan nuansa deliberatif dengan wajar.
- source_word: ἀρχιερεῦσιν
  choice: imam-imam kepala
  rationale: Bentuk jamak ini mengacu pada kalangan pemimpin keimaman, bukan pada beberapa orang yang sekaligus memegang jabatan imam besar.
- source_word: στρατηγοῖς
  choice: para perwira
  rationale: Istilah ini menyebut pejabat atau komandan yang dalam konteks ini berkaitan dengan penjagaan Bait Allah. “Para perwira” ringkas dan alami, sedangkan kekhususan konteks dijelaskan dalam catatan kaki.
- source_word: τὸ πῶς
  choice: tentang bagaimana
  rationale: Ungkapan ini memperkenalkan isi perundingan. “Tentang bagaimana” menghasilkan hubungan sintaksis yang jelas setelah “berunding”.
- source_word: παραδῷ
  choice: dapat menyerahkan
  rationale: παραδίδωμι secara dasar berarti menyerahkan atau menyerahkan kepada pihak lain. Pilihan ini mempertahankan keluasan leksikalnya, sedangkan makna pengkhianatan yang nyata dalam konteks dicatat sebagai alternatif.
- source_word: αὐτοῖς ... αὐτόν
  choice: Yesus kepada mereka
  rationale: Bahasa Yunani memakai pronomina “dia” dan “kepada mereka”. Nama “Yesus” dipakai untuk kejernihan rujukan dalam bahasa Indonesia tanpa mengubah referen, sementara “mereka” tetap merujuk pada kedua kelompok sebelumnya.
theological_decisions:
- issue: Makna παραδῷ dalam tindakan Yudas
  choice: menyerahkan Yesus kepada mereka
  alternative: mengkhianati Yesus / menyerahkan Dia kepada mereka
  rationale: Konteks jelas menggambarkan tindakan pengkhianatan Yudas, tetapi verba Yunani itu sendiri lebih luas daripada “mengkhianati”. Teks utama mempertahankan arti konkret “menyerahkan”, dan catatan kaki menyajikan alternatif kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama “Yudas” dan “Yesus” dieksplisitkan demi kejernihan karena ayat ini berdiri sendiri; referennya berasal dari konteks langsung. Urutan penanda catatan disesuaikan dengan letaknya dalam teks utama.
