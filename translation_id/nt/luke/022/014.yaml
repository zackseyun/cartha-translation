  terminology: '"Para rasul" adalah istilah yang baku dan alami untuk οἱ ἀπόστολοι. Penyebutan "Yesus" sah karena subjek tersirat dalam konteks langsung merujuk kepada Yesus. Tidak ada istilah teologis yang perlu diubah.'
