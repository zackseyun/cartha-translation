  source_fidelity: Frasa "Ketika saatnya tiba" secara wajar menyampaikan ὅτε ἐγένετο ἡ ὥρα. Namun, "rasul-rasul menyertai-Nya" hanya menyatakan bahwa mereka menemani Yesus dan tidak cukup mengaitkan mereka dengan tindakan/perjamuan yang dinyatakan oleh σὺν αὐτῷ. Terjemahan perlu menyatakan bahwa Yesus makan dalam kebersamaan dengan para rasul, sambil mempertahankan sikap makan berbaring yang tersirat dalam ἀνέπεσεν.
