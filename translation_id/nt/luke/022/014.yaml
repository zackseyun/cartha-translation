  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: id
  text: Ketika waktunya tiba, Yesus berbaring untuk makan bersama para rasul[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pada zaman itu, orang biasanya makan sambil berbaring menyamping dan bersandar di dekat meja.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ὅτε ἐγένετο ἡ ὥρα
  choice: Ketika saatnya tiba
  rationale: Ungkapan ini secara alami menyatakan tibanya waktu yang telah ditentukan. 'Saatnya' mempertahankan kekhususan frasa Yunani tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: ἀνέπεσεν
  choice: berbaring untuk makan
  rationale: Verba ini menunjuk pada kebiasaan bersandar atau berbaring ketika makan pada zaman itu. Terjemahan ini mempertahankan gambaran historis dan tetap mudah dipahami.
- source_word: οἱ ἀπόστολοι
  choice: rasul-rasul
  rationale: Menerjemahkan nomina berartikel yang menunjuk pada kelompok rasul yang sudah dikenal dalam konteks, tanpa menambahkan kata milik seperti 'rasul-rasul-Nya'.
- source_word: σὺν αὐτῷ
  choice: menyertai-Nya
  rationale: Menyampaikan bahwa para rasul berada bersama Yesus dalam perjamuan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan yang dinyatakan oleh σύν.
- source_word: Καὶ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia modern, pembukaan dengan 'dan' di sini terasa kurang alami. Kesinambungan naratif tetap tersampaikan melalui anak kalimat waktu.
theological_decisions:
- issue: Sikap tubuh dalam perjamuan
  choice: berbaring untuk makan
  alternative: duduk untuk makan
  rationale: Pilihan ini mempertahankan sikap makan historis yang dinyatakan oleh ἀναπίπτω dan tidak meratakannya menjadi kebiasaan duduk modern. Ini merupakan keputusan leksikal-budaya, bukan penambahan doktrinal.
- issue: Subjek tersirat pada ἀνέπεσεν
  choice: Yesus
  alternative: Ia
  rationale: Bahasa Yunani memakai subjek tersirat yang dalam konteks merujuk kepada Yesus. Penyebutan nama membuat kalimat Indonesia mandiri dan jelas tanpa mengubah rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur dibuat jelas bagi pembaca umum, sementara gambaran budaya mengenai posisi makan tetap dipertahankan.
