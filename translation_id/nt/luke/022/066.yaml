revisions:
- from: Ketika hari mulai terang[a], majelis para tua-tua bangsa itu berkumpul, baik imam-imam kepala maupun ahli-ahli Taurat. Lalu mereka membawa Dia ke hadapan mahkamah mereka[b].
  to: Ketika hari mulai terang[a], majelis para tua-tua bangsa itu berkumpul, baik imam-imam kepala maupun ahli-ahli Taurat. Lalu mereka membawa Dia ke sidang mereka[b].
  rationale: Revisi terbatas pada penerjemahan συνέδριον dan arah εἰς. “Ke sidang mereka” mempertahankan gerak yang dinyatakan oleh bahasa Yunani dan membiarkan rujukannya—badan dewan, sidang formal, atau tempatnya—tetap terbuka melalui catatan kaki. Semua unsur makna lain serta penanda catatan kaki dipertahankan.
