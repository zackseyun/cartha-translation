source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: id
  text: Ketika hari mulai terang[a], majelis para tua-tua bangsa itu berkumpul, baik imam-imam kepala maupun ahli-ahli Taurat. Lalu mereka membawa Dia ke sidang mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika hari tiba” atau “saat fajar menyingsing.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ke dalam majelis mereka” atau “ke dalam ruang sidang mereka.” Kata Yunani συνέδριον dapat menunjuk pada dewan itu sendiri maupun sidang resmi atau tempat persidangannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: ketika hari mulai terang
  rationale: Ungkapan ini menyampaikan datangnya waktu siang secara alami dalam bahasa Indonesia tanpa mempersempitnya secara mutlak menjadi satu titik waktu tertentu.
- source_word: συνήχθη
  choice: berkumpul
  rationale: Bentuk pasif Yunani menyatakan bahwa kelompok itu berhimpun atau dihimpunkan; 'berkumpul' alami dan tetap mempertahankan makna kolektifnya.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: majelis para tua-tua bangsa itu
  rationale: πρεσβυτέριον menunjuk pada badan yang terdiri atas para tua-tua, bukan sekadar jabatan atau sifat ketuaan. 'Majelis' menyatakan badan kelembagaan dengan jelas.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: baik imam-imam kepala maupun ahli-ahli Taurat
  rationale: Pasangan τε καί diwakili secara wajar oleh 'baik ... maupun ...'. Istilah jabatan tersebut sudah jelas dan lazim bagi pembaca Alkitab bahasa Indonesia.
- source_word: ἀπήγαγον αὐτόν
  choice: mereka membawa Dia
  rationale: ἀπάγω berarti membawa atau menggiring pergi. 'Membawa Dia' mempertahankan gerak terarah dalam konteks peradilan tanpa menyiratkan kekerasan yang tidak dinyatakan.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: ke hadapan mahkamah mereka
  rationale: Dalam konteks ini συνέδριον dapat menunjuk pada badan pengadilan atau sidang resminya. 'Ke hadapan mahkamah mereka' alami dalam bahasa Indonesia dan membedakannya dari πρεσβυτέριον, sementara catatan kaki mempertahankan kemungkinan makna lain.
theological_decisions:
- issue: Istilah kelembagaan bagi badan pemerintahan Yahudi
  choice: Membedakan πρεσβυτέριον sebagai 'majelis para tua-tua' dan συνέδριον sebagai 'mahkamah mereka'
  alternative: Menerjemahkan keduanya sebagai 'majelis', atau memakai istilah serapan 'Sanhedrin'
  rationale: Teks Yunani memakai dua istilah yang berkaitan tetapi berbeda. Pembedaan ini mempertahankan variasi leksikal Lukas dan menghindari memasukkan nama kelembagaan serapan sebagai satu-satunya penafsiran.
- issue: Acuan εἰς τὸ συνέδριον
  choice: ke hadapan mahkamah mereka
  alternative: ke dalam ruang sidang mereka; ke dalam majelis mereka
  rationale: Konstruksi tersebut dapat dipahami sebagai dibawa menghadap badan peradilan, memasuki sidang resminya, atau menuju tempat sidangnya. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki menjaga ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar daftar kelompok dan tindakan berikutnya mudah dipahami. Huruf kapital pada 'Dia' mengikuti kelaziman gaya Alkitab bahasa Indonesia untuk rujukan kepada Yesus, tanpa menambah isi leksikal.
