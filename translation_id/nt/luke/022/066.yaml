    issue: “Ke hadapan mahkamah mereka” terlalu mempersempit εἰς τὸ συνέδριον αὐτῶν.
    rationale: εἰς terutama menyatakan arah ‘ke/dalam’, bukan secara eksplisit ‘ke hadapan’; συνέδριον dapat menunjuk pada dewan, persidangan, atau tempat persidangan. “Mahkamah” juga mempertegas fungsi pengadilan yang tidak perlu ditetapkan oleh terjemahan utama.
  - severity: low
    issue: Catatan kaki b menyebut ‘kata Yunani’ tanpa menyebut istilah yang dimaksud.
    rationale: Penyebutan συνέδριον meningkatkan kejelasan audit tanpa mengubah makna atau membebani pembaca.
