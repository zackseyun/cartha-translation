id: LUK.22.16
reference: Luke 22:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: id
  text: Sebab Aku berkata kepadamu bahwa Aku pasti tidak akan memakannya sampai hal itu digenapi dalam Kerajaan Allah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku tidak akan pernah memakannya lagi sampai hal itu digenapi dalam Kerajaan Allah.” Bahasa Yunani dengan tegas menyangkal tindakan makan pada masa depan. Sejumlah terjemahan menyatakan kata “lagi” yang tersirat dari konteks, tetapi kata itu tidak terdapat dalam teks Yunani.
    reason: lexical_alternative
  - marker: b
    text: Akhiran “-nya” dan frasa “hal itu” merujuk kepada Paskah yang disebut dalam ayat sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab Aku berkata kepadamu
  rationale: Ungkapan ini mempertahankan hubungan penjelas yang ditandai γάρ dengan ayat sebelumnya. 'Berkata kepadamu' alami dan cukup formal dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: Kata 'bahwa' secara wajar memperkenalkan isi perkataan Yesus dan mempertahankan struktur eksplisit bahasa Yunani.
- source_word: οὐ μὴ φάγω
  choice: Aku pasti tidak akan memakannya
  rationale: Gabungan οὐ μή dengan subjungtif aoris menyatakan penyangkalan masa depan yang tegas. 'Pasti tidak akan' menyampaikan penekanan itu tanpa memakai bahasa yang usang.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina ini menunjuk kembali kepada Paskah yang disebut dalam ayat sebelumnya. Bentuk '-nya' mempertahankan kekompakan teks tanpa menambahkan kata 'Paskah' ke dalam ayat.
- source_word: ἕως ὅτου
  choice: sampai
  rationale: Ungkapan ini menandai batas waktu; 'sampai' merupakan padanan Indonesia yang langsung dan alami.
- source_word: πληρωθῇ
  choice: hal itu digenapi
  rationale: Bentuk pasif πληρωθῇ mengandung arti mencapai penggenapan atau kepenuhan. 'Digenapi' mempertahankan gaung sejarah keselamatan; 'hal itu' membuat subjek klausa pasif jelas dan tetap merujuk kepada Paskah.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dalam Kerajaan Allah
  rationale: '''Kerajaan Allah'' adalah istilah biblis yang lazim dan tetap dapat mencakup pemerintahan maupun ranah kekuasaan Allah. Preposisi ''dalam'' mempertahankan ἐν tanpa mempersempit hubungan yang dimaksud.'
theological_decisions:
- issue: Acuan αὐτό dan subjek tersirat πληρωθῇ
  choice: Acuannya adalah Paskah yang baru disebut dalam ayat sebelumnya, tetapi teks utama tidak mempersempitnya menjadi makanan saja.
  alternative: Menuliskan 'perjamuan Paskah itu' atau memahami acuannya secara lebih luas sebagai perayaan/peristiwa Paskah.
  rationale: Konteks terdekat menunjuk kepada 'Paskah ini' dalam ayat 15. Pemakaian '-nya' dan 'hal itu' menjaga acuan kontekstual serta keluwesan cakupan pronomina Yunani.
- issue: Makna penggenapan dalam Kerajaan Allah
  choice: Mempertahankan bahasa eskatologis 'digenapi dalam Kerajaan Allah' tanpa menjelaskan cara atau peristiwa penggenapannya.
  alternative: Menafsirkannya secara khusus sebagai penggenapan melalui kedatangan Kerajaan Allah atau dalam perjamuan Mesias.
  rationale: Bahasa Yunani menunjukkan penggenapan eskatologis, tetapi tidak menyebut mekanisme atau peristiwa tertentu. Terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut secara diam-diam.
- issue: Apakah 'lagi' tersirat dalam penyangkalan
  choice: Tidak menambahkan 'lagi' dalam teks utama.
  alternative: Aku tidak akan pernah memakannya lagi sampai hal itu digenapi dalam Kerajaan Allah.
  rationale: Konteks dapat menyiratkan tindakan makan kembali pada masa depan, tetapi kata yang berarti 'lagi' tidak terdapat dalam teks Yunani. Kemungkinan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang wajar, khidmat, dan mudah dipahami. Kapitalisasi pronomina 'Aku' mengikuti kebiasaan teks Alkitab Indonesia ketika merujuk kepada Yesus. Istilah kunci 'Kerajaan Allah' dipertahankan dalam bentuk yang mapan.
