  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: id
  text: Kemudian Iblis masuk ke dalam diri Yudas yang disebut Iskariot, salah seorang dari kedua belas orang itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Kemudian ... masuk
  rationale: δέ menandai kelanjutan narasi, sedangkan bentuk aoristus εἰσῆλθεν menyatakan tindakan masuk yang terjadi. Susunan ini alami dalam bahasa Indonesia.
- source_word: Σατανᾶς
  choice: Iblis
  rationale: Dalam bahasa Indonesia, 'Iblis' merupakan sebutan baku dan mudah dipahami untuk Satan sebagai tokoh pribadi dalam Perjanjian Baru.
- source_word: εἰς Ἰούδαν
  choice: ke dalam diri Yudas
  rationale: Ungkapan ini mempertahankan makna eksplisit εἰς, yaitu masuk ke dalam seseorang, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: yang disebut Iskariot
  rationale: Klausa relatif ini secara alami menyampaikan fungsi partisipel καλούμενον yang mengidentifikasi Yudas.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: seorang dari kedua belas murid itu
  rationale: Ungkapan ini menyampaikan bahwa Yudas termasuk dalam kelompok yang berjumlah dua belas. Kata 'murid' ditambahkan secara kontekstual agar rujukannya jelas bagi pembaca Indonesia, dan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hakikat tindakan Iblis terhadap Yudas
  choice: Iblis masuk ke dalam diri Yudas
  alternative: Iblis memengaruhi atau menguasai Yudas
  rationale: Bahasa Yunani memakai εἰσῆλθεν ... εἰς dan secara tegas menggambarkan tindakan masuk. Terjemahan tidak memperlemahnya menjadi pengaruh belaka, tetapi juga tidak menambahkan penjelasan doktrinal mengenai kerasukan atau tanggung jawab manusia.
- issue: Identitas kelompok kedua belas
  choice: kedua belas murid itu
  alternative: kedua belas rasul itu; kelompok dua belas orang itu
  rationale: Konteks Injil dengan jelas menunjuk pada kelompok inti murid Yesus. 'Murid' membantu kejelasan tanpa mengimpor gelar 'rasul' yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ke dalam diri' mempertahankan kuatnya gambaran teks sumber; 'seorang dari kedua belas murid itu' mengutamakan kejelasan alami sambil mempertahankan bentuk harfiah melalui catatan kaki.
