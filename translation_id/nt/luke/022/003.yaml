    rationale: Teks sumber hanya menyebut bahwa Yudas termasuk dalam bilangan dua belas; ayat ini tidak memakai kata “murid” maupun “rasul”. Kejelasan kontekstual tidak memerlukan tambahan tersebut dalam terjemahan utama.
  revised_text: Kemudian Iblis masuk ke dalam diri Yudas yang disebut Iskariot, salah seorang dari kedua belas orang itu.
