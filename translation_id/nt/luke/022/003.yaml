review_pass:
  verdict: revise
  source_fidelity: Terjemahan “Iblis masuk ke dalam diri Yudas” dengan tepat mempertahankan kekuatan εἰσῆλθεν … εἰς dan tidak mereduksinya menjadi sekadar pengaruh. “Yang disebut Iskariot” juga setia pada τὸν καλούμενον Ἰσκαριώτην. Namun, penambahan “murid” dalam “kedua belas murid itu” tidak ada dalam ayat Yunani ini. Walaupun referennya jelas secara konteks, terjemahan optimal-ekuivalen sebaiknya tidak menambahkan kategori tersebut ke dalam teks ayat.
  naturalness: “Kemudian Iblis masuk ke dalam diri Yudas yang disebut Iskariot, salah seorang dari kedua belas orang itu” adalah bahasa Indonesia baku, alami, dan cukup lugas. Frasa “kedua belas orang itu” menyampaikan kelompok yang dimaksud tanpa menambahkan jabatan atau kategori yang tidak dinyatakan.
  terminology: “Iblis” merupakan istilah baku Indonesia yang sesuai untuk Σατανᾶς dalam konteks ini. “Iskariot” dipertahankan. “Salah seorang dari kedua belas orang itu” menyampaikan ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα tanpa memaksakan kapitalisasi atau istilah “rasul/murid”.
  issues:
