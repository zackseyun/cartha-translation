  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: id
  text: Perselisihan juga timbul di antara mereka tentang siapa di antara mereka yang dianggap lebih besar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tampaknya lebih besar.” Kata kerja Yunani yang dipakai dapat berarti “tampak” atau “dianggap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: timbul
  rationale: Dalam konteks ini, γίνομαι menyatakan munculnya suatu keadaan. “Timbul” merupakan ungkapan Indonesia yang wajar untuk awal suatu perselisihan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai perkembangan dalam narasi, tetapi dalam bahasa Indonesia hubungan itu sudah wajar tanpa kata penghubung tambahan. Ini menghindari penambahan penanda waktu atau pertentangan yang tidak tersurat.
- source_word: καὶ
  choice: juga
  rationale: 'Kata ini mempertahankan daya tambah καί: perselisihan tersebut terjadi sebagai perkembangan lain dalam rangkaian peristiwa.'
- source_word: φιλονεικία
  choice: perselisihan
  rationale: φιλονεικία menunjuk pada pertikaian atau persaingan yang mengandung perbantahan. “Perselisihan” jelas, alami, dan sesuai dengan perdebatan mengenai kedudukan.
- source_word: ἐν αὐτοῖς
  choice: di antara mereka
  rationale: Frasa ini menunjukkan bahwa perselisihan terjadi dalam kelompok para murid.
- source_word: τὸ τίς αὐτῶν
  choice: tentang siapa di antara mereka
  rationale: Artikel τὸ menominalkan pertanyaan tidak langsung dan memperkenalkan pokok perselisihan. Bentuk Indonesia ini alami dan tetap dekat dengan struktur maknanya.
- source_word: δοκεῖ
  choice: dianggap
  rationale: δοκέω dapat berarti “tampak” atau “dianggap”. Dalam konteks penilaian kedudukan dalam kelompok, “dianggap” menyampaikan nuansa penilaian sosial dengan baik, sementara kemungkinan “tampak” dipertahankan dalam catatan kaki.
- source_word: εἶναι
  choice: (tercakup dalam konstruksi) dianggap lebih besar
  rationale: Infinitif “menjadi/berada sebagai” tidak perlu diterjemahkan dengan kata tersendiri setelah bentuk pasif “dianggap” dalam bahasa Indonesia.
- source_word: μείζων
  choice: lebih besar
  rationale: μείζων berbentuk komparatif, bukan superlatif. “Lebih besar” mempertahankan bentuk perbandingan itu tanpa mengubahnya menjadi “yang terbesar” atau menafsirkan secara sempit sebagai “lebih penting”.
theological_decisions:
- issue: Bahasa kedudukan di antara para murid
  choice: lebih besar
  alternative: yang terbesar; lebih penting
  rationale: Teks Yunani memakai bentuk komparatif μείζων. Terjemahan mempertahankan perbandingan dan tidak memperkuatnya menjadi superlatif atau membatasi maknanya pada satu jenis kepentingan.
- issue: Makna δοκεῖ
  choice: dianggap
  alternative: tampaknya
  rationale: Konteks mendukung gagasan penilaian kedudukan oleh kelompok, tetapi verba Yunani juga dapat menyatakan kesan atau penampakan. Ambiguitas leksikal tersebut dicatat tanpa dipaksakan ke dalam satu penafsiran mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Perselisihan” mudah dipahami pembaca umum, sedangkan susunan “siapa di antara mereka yang dianggap lebih besar” menjaga perbandingan dan ambiguitas sumber.
