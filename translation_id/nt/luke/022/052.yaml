id: LUK.22.52
reference: Luke 22:52
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: id
  text: Namun, Yesus berkata kepada imam-imam kepala, kepala-kepala pengawal Bait Allah, dan tua-tua yang telah datang menghadapi-Nya, “Apakah kalian keluar menghadapi Aku seperti menghadapi seorang perampok[a], dengan pedang dan pentung?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyamun.” Kata Yunani λῃστής dapat menunjuk kepada perampok, penyamun, atau pelaku perlawanan bersenjata yang dipandang sebagai penjahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan pertentangan ringan dari tindakan penangkapan kepada tanggapan Yesus.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: yang datang untuk menangkap-Nya
  rationale: Dalam konteks penangkapan, frasa ini menyatakan kedatangan yang ditujukan untuk melawan Yesus. Pilihan ini menyampaikan maksud permusuhan secara alami tanpa menggambarkannya sekadar sebagai kedatangan di dekat-Nya.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah baku bagi kelompok pemimpin utama dari kalangan imam, bukan sejumlah imam besar yang sedang menjabat bersamaan.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: para kepala pengawal Bait Allah
  rationale: Mengacu kepada para pejabat yang memimpin keamanan kawasan Bait Allah; ungkapan ini jelas bagi pembaca Indonesia masa kini.
- source_word: πρεσβυτέρους
  choice: para tua-tua
  rationale: Di sini berarti para pemimpin Yahudi yang diakui, bukan sekadar laki-laki lanjut usia.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: seolah-olah hendak menangkap seorang perampok
  rationale: Mengungkapkan idiom gerak melawan seseorang secara alami dalam konteks penangkapan, sambil mempertahankan daya retoris pertanyaan Yesus. Makna luas λῃστής dijelaskan dalam catatan kaki.
- source_word: ἐξήλθατε
  choice: Apakah kalian datang
  rationale: Bentuk lampau Yunani menunjuk pada tindakan yang baru saja dilakukan; dalam pertanyaan langsung bahasa Indonesia, 'datang' sudah menyampaikan hal itu dengan wajar.
- source_word: μαχαιρῶν
  choice: pedang
  rationale: Padanan umum dan sesuai konteks untuk senjata tajam yang dibawa dalam penangkapan.
- source_word: ξύλων
  choice: pentung
  rationale: Walaupun secara harfiah berkaitan dengan benda kayu, konteks menunjukkan tongkat pemukul yang dipakai sebagai senjata; 'pentung' menyatakan fungsi itu secara ringkas.
theological_decisions:
- issue: Daya retoris pertanyaan Yesus
  choice: Dipertahankan sebagai pertanyaan langsung tanpa menambahkan penjelasan bahwa Yesus menyangkal diri-Nya sebagai penjahat.
  alternative: Mengubahnya menjadi pernyataan tegas bahwa Yesus bukan perampok.
  rationale: Teks Yunani menyampaikan kontras melalui pertanyaan retoris; terjemahan tidak sepatutnya menuntaskan implikasinya menjadi proposisi tambahan.
translation_notes:
  register: Bahasa dibuat modern, wajar, dan bermartabat. Sapaan jamak “kalian” memperjelas bahwa Yesus berbicara kepada sejumlah pemimpin. Istilah kelembagaan “imam-imam kepala,” “kepala pengawal Bait Allah,” dan “tua-tua” dipertahankan agar peran kelompok-kelompok dalam narasi tetap terlihat.
