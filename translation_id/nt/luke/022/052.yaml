  to: Namun, Yesus berkata kepada imam-imam kepala, kepala-kepala pengawal Bait Allah, dan tua-tua yang telah datang menghadapi-Nya, “Apakah kalian keluar menghadapi Aku seperti menghadapi seorang perampok[a], dengan pedang dan pentung?”
