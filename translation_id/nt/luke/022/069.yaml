  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: id
  text: Namun, mulai sekarang Anak Manusia akan duduk di sebelah kanan kuasa Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: mulai sekarang
  rationale: Ungkapan waktu ini secara idiomatis menunjukkan titik awal berlakunya keadaan yang dinyatakan dan tetap mempertahankan orientasi ke depan.
- source_word: δὲ
  choice: Namun
  rationale: Dalam konteks jawaban Yesus, partikel ini menandai peralihan yang bernuansa kontras; “Namun” terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἔσται ... καθήμενος
  choice: akan duduk
  rationale: Gabungan verba futurum dan partisip ini menyatakan keadaan Anak Manusia yang akan berada dalam posisi duduk. “Akan duduk” alami dalam bahasa Indonesia dan tetap mempertahankan gambaran penobatan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar khas yang digunakan Yesus ini diterjemahkan secara harfiah untuk mempertahankan gema Daniel dan ambiguitas gelarnya.
- source_word: ἐκ δεξιῶν
  choice: di sebelah kanan
  rationale: Ungkapan ini mempertahankan citra tempat kehormatan dan wewenang tertinggi serta gema antarteksnya, tanpa memakai idiom Indonesia yang kaku seperti “di tangan kanan”.
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: kuasa Allah
  rationale: Susunan ini menyatakan kuasa yang berasal dari atau dimiliki Allah. Bentuk ringkas ini alami dalam bahasa Indonesia dan tidak mengaburkan rujukan eksplisit kepada Allah.
theological_decisions:
- issue: Perumusan pengagungan Anak Manusia dan klaim atas otoritas ilahi
  choice: Anak Manusia akan duduk di sebelah kanan kuasa Allah
  alternative: Anak Manusia akan duduk di sebelah kanan Yang Mahakuasa
  rationale: Terjemahan utama mengikuti susunan Yunani secara dekat dan mempertahankan gambaran Mazmur 110 serta Daniel 7 tanpa menjelaskannya secara berlebihan. Alternatif mencerminkan kemungkinan bahwa “Kuasa” berfungsi sebagai sebutan penuh hormat bagi Allah, tetapi tidak dijadikan teks utama karena Yunani juga secara eksplisit memuat “Allah”.
translation_notes:
  register: Bahasa Indonesia modern yang wajar, ringkas, dan bermartabat. “Namun” mempertahankan kontras; “akan duduk” lebih alami daripada bentuk pasif “akan didudukkan” dan tetap menyampaikan keadaan pengagungan. Penanda catatan kaki ditempatkan setelah kalimat.
