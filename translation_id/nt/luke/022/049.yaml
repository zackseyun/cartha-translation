  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: id
  text: Ketika orang-orang di sekeliling-Nya melihat apa yang akan segera terjadi, mereka berkata, “Tuhan, haruskah kami menyerang dengan pedang[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “pedang” juga dapat merujuk pada pedang pendek atau belati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoris dipahami secara temporal dan diterjemahkan secara alami dalam bahasa Indonesia tanpa menghilangkan hubungannya dengan verba utama.
- source_word: οἱ περὶ αὐτὸν
  choice: orang-orang di sekeliling-Nya
  rationale: Ungkapan ini menunjuk kepada orang-orang yang berada bersama dan mengelilingi Yesus; pilihan ini tidak mempersempit mereka secara eksplisit menjadi murid-murid.
- source_word: τὸ ἐσόμενον
  choice: apa yang akan terjadi
  rationale: Partisip futur substantival ini menunjuk pada peristiwa yang segera akan berlangsung.
- source_word: εἶπαν
  choice: mereka berkata
  rationale: Mempertahankan arti biasa λέγω; bentuk pertanyaan dalam kutipan sudah menyatakan bahwa ucapan itu merupakan pertanyaan.
- source_word: Κύριε
  choice: Tuhan
  rationale: Sapaan kepada Yesus ini mempertahankan bobot gelar κύριος sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: εἰ πατάξομεν
  choice: haruskah kami menyerang
  rationale: εἰ memperkenalkan pertanyaan deliberatif, sedangkan πατάξομεν menyatakan tindakan menyerang atau menghantam. Bentuk ini menyampaikan permintaan keputusan sebelum bertindak.
- source_word: ἐν μαχαίρῃ
  choice: dengan pedang
  rationale: ἐν berfungsi instrumental. μάχαιρα dapat menunjuk pada pedang atau senjata berbilah yang lebih pendek; 'pedang' merupakan padanan utama yang alami dalam konteks ini.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Guru
  rationale: ‘Tuhan’ mempertahankan fungsi sapaan hormat dan kemungkinan bobot kristologis gelar tersebut tanpa mereduksinya menjadi sebutan sosial semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk “-Nya” mengikuti kebiasaan penulisan sapaan dan pronomina yang merujuk kepada Yesus. Pertanyaan deliberatif diterjemahkan dengan “haruskah” agar alami dan jelas.
