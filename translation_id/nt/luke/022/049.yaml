  verdict: revise
  source_fidelity: Draf secara umum setia kepada teks Yunani. Namun, τὸ ἐσόμενον mengacu pada peristiwa yang sedang mengancam/akan segera terjadi; “apa yang akan terjadi” benar secara dasar, tetapi tidak menangkap nuansa kedekatannya sejelas “apa yang akan segera terjadi.” “Menyerang dengan pedang” merupakan padanan yang wajar untuk pertanyaan deliberatif εἰ πατάξομεν ἐν μαχαίρῃ, meskipun πατάσσω secara harfiah lebih khusus daripada sekadar memulai serangan.
  naturalness: Kalimatnya baku, jelas, dan alami dalam bahasa Indonesia modern. “Haruskah kami menyerang dengan pedang?” adalah pertanyaan deliberatif yang lancar. “Orang-orang di sekeliling-Nya” tidak canggung dan tidak membatasi rujukan menjadi murid-murid.
  terminology: “Tuhan” tepat untuk Κύριε dalam sapaan kepada Yesus dan konsisten dengan bobot gelar tersebut. “Pedang” adalah padanan utama yang tepat untuk μάχαιρα; catatan kaki secara tepat mempertahankan kemungkinan senjata berbilah lebih pendek.
