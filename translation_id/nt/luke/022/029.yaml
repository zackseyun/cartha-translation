  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: id
  text: Dan Aku menganugerahkan kepada kalian sebuah kerajaan[a], sama seperti Bapa-Ku menganugerahkannya kepada-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku mengikat perjanjian dengan kalian mengenai sebuah kerajaan.” Verba Yunani ini dapat berarti mengikat perjanjian, menetapkan, atau menganugerahkan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “Dan Aku menganugerahkan kepada kalian, sama seperti Bapa-Ku menganugerahkan kepada-Ku, sebuah kerajaan.” Dalam bahasa Yunani, “sebuah kerajaan” ditempatkan di akhir dan menjadi objek bagi kedua verba.
    reason: alternative_rendering
lexical_decisions:
- source_word: κἀγὼ
  choice: Dan Aku
  rationale: Bentuk gabungan καί + ἐγώ menyambungkan perkataan ini dengan konteks sebelumnya sekaligus memberi penekanan pada pribadi Yesus.
- source_word: διατίθεμαι / διέθετό
  choice: menganugerahkan / menganugerahkan
  rationale: Dalam konteks ini verba tersebut menyatakan tindakan menyerahkan atau memberikan sesuatu dengan kewenangan. Pilihan yang sama pada kedua kemunculannya mempertahankan kesejajaran tindakan Yesus dan Bapa, sedangkan kemungkinan nuansa perjanjian dicatat dalam catatan kaki.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina datif ini menunjuk kepada para murid sebagai penerima dan berbentuk jamak; 'kalian' menyatakannya dengan jelas dalam bahasa Indonesia modern.
- source_word: καθὼς
  choice: sama seperti
  rationale: Ungkapan ini memperjelas perbandingan langsung antara tindakan Yesus dan tindakan Bapa.
- source_word: μοι
  choice: kepada-Ku
  rationale: Menyatakan Yesus sebagai penerima tindakan Bapa dan mempertahankan kesejajaran dengan 'kepada kalian'.
- source_word: ὁ πατήρ μου
  choice: Bapa-Ku
  rationale: Ungkapan Indonesia yang alami dan baku untuk hubungan filial yang dinyatakan teks.
- source_word: βασιλείαν
  choice: sebuah kerajaan
  rationale: Dalam konteks ayat berikutnya—makan di meja dan duduk di atas takhta—makna kerajaan atau wilayah kekuasaan kerajaan lebih sesuai daripada sekadar tindakan memerintah. Posisi pada akhir kalimat dipertahankan agar dapat dipahami sebagai objek kedua verba.
theological_decisions:
- issue: Apakah διατίθεμαι harus diterjemahkan dengan bahasa perjanjian secara eksplisit
  choice: menganugerahkan
  alternative: mengikat perjanjian untuk memberikan
  rationale: Verba Yunani dapat memiliki daya perjanjian, tetapi dengan βασιλείαν sebagai objek, makna penganugerahan atau penyerahan kerajaan sesuai dengan sintaksis dan konteks. Kemungkinan nuansa perjanjian tetap dipertahankan dalam catatan kaki tanpa menjadikannya satu-satunya tafsiran dalam teks utama.
- issue: Hubungan βασιλείαν dengan kedua verba
  choice: menempatkan 'sebuah kerajaan' pada akhir kalimat sebagai objek yang dipahami bersama
  alternative: 'mengulang objek dengan bentuk pengganti: ''...sebuah kerajaan, sama seperti Bapa-Ku menganugerahkannya kepada-Ku'''
  rationale: Susunan ini mengikuti struktur Yunani dan mempertahankan efek retoris bahwa kerajaan yang sama-sama disebut itu menjadi objek tindakan Yesus maupun Bapa, tanpa memaksakan penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Kalian' dipakai untuk menyatakan bentuk jamak ὑμῖν secara jelas. Kapitalisasi pronomina yang merujuk kepada Yesus dan Bapa mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan objek di akhir sengaja mempertahankan struktur dan ambiguitas relasional teks Yunani.
