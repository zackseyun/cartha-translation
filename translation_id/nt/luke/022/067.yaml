  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: id
  text: mereka berkata, “Jika Engkau adalah Mesias[a], katakanlah kepada kami.” Namun, Dia berkata kepada mereka, “Jika Aku mengatakannya kepada kalian, kalian pasti tidak akan percaya;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.”
    reason: Padanan tradisional alternatif bagi gelar Yunani Χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: kata mereka
  rationale: Partisipel kini ini melanjutkan narasi sebelumnya dan memperkenalkan isi ucapan majelis; bentuk ini alami dalam bahasa Indonesia tanpa melepaskan kaitannya dengan konteks.
- source_word: Εἰ σὺ εἶ
  choice: Jika Engkau adalah
  rationale: Mempertahankan bentuk syarat yang eksplisit dalam bahasa Yunani, bukan mengubahnya menjadi pertanyaan langsung.
- source_word: ὁ χριστός
  choice: Mesias
  rationale: Χριστός digunakan sebagai gelar yang merujuk pada sosok yang diurapi dan dinantikan dalam konteks Yahudi; 'Mesias' menyampaikan makna gelar itu secara wajar.
- source_word: εἰπὸν ἡμῖν
  choice: katakanlah kepada kami
  rationale: Menyampaikan imperatif dan objek datif secara alami sekaligus mempertahankan nada tuntutan mereka.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Namun, Dia berkata kepada mereka
  rationale: δέ menandai peralihan dengan nuansa kontras antara tuntutan mereka dan jawaban Yesus.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Jika Aku mengatakannya kepada kalian
  rationale: Mempertahankan konstruksi bersyarat; pronomina '-nya' secara alami menunjuk pada jawaban mengenai apakah Dia Mesias.
- source_word: οὐ μὴ πιστεύσητε
  choice: kalian pasti tidak akan percaya
  rationale: Gabungan οὐ μή dengan subjungtif merupakan negasi tegas; 'pasti tidak akan' menyampaikan penekanannya dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam pemeriksaan ini istilah tersebut adalah gelar yang terkait dengan pengharapan mesianik Yahudi. 'Mesias' menerjemahkan nilai gelarnya, sedangkan 'Kristus' dicantumkan sebagai padanan tradisional dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau/Aku/Dia' dipakai untuk Yesus, sedangkan 'kalian' menandai bahwa jawaban ditujukan kepada sekelompok orang. Tanda titik koma dipertahankan karena ayat ini berlanjut ke kalimat berikutnya.
