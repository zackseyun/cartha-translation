  text: Lalu, setelah keluar, ia menangis dengan getir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Penghubung naratif ini diterjemahkan secara alami sebagai “Lalu”; pilihan tersebut mempertahankan kesinambungan kisah tanpa memberi penafsiran tambahan.
- source_word: ἐξελθὼν
  choice: setelah pergi
  rationale: Partisip aoristus ini menyatakan tindakan yang mendahului verba utama. “Setelah pergi” menyampaikan hubungan tersebut dengan wajar dalam bahasa Indonesia.
- source_word: ἔξω
  choice: ke luar
  rationale: Adverbia ini menunjukkan arah atau tempat di luar; “ke luar” sesuai dengan verba gerak yang mendahuluinya.
- source_word: ἔκλαυσεν
  choice: ia menangis
  rationale: κλαίω berarti menangis atau meratap. “Menangis” tepat, jelas, dan sesuai dengan nada khidmat konteks ini.
- source_word: πικρῶς
  choice: dengan pilu
  rationale: Adverbia ini menggambarkan tangisan yang sangat menyakitkan atau penuh kepedihan. “Dengan pilu” lebih alami daripada terjemahan harfiah “dengan pahit” dalam bahasa Indonesia.
