  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Perhatikan, ketika kalian masuk ke kota, seorang laki-laki yang membawa tempayan berisi air akan menemui kalian. Ikutilah dia ke dalam rumah yang dimasukinya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ketahuilah
  rationale: Kata ini berfungsi menarik perhatian kepada tanda yang akan mereka jumpai. 'Ketahuilah' terdengar wajar dan bermartabat dalam bahasa Indonesia, tanpa keusangan 'lihatlah' dalam konteks pemberitahuan ini.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: ketika kalian masuk ke kota
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu; 'ketika' mempertahankan kaitan peristiwa itu dengan saat mereka memasuki kota.
- source_word: συναντήσει ὑμῖν
  choice: akan menemui kalian
  rationale: Bentuk futurum dengan objek datif secara alami menyatakan bahwa laki-laki itu akan berjumpa dengan mereka; 'menemui' lancar dalam narasi Indonesia.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Acuannya adalah individu laki-laki tertentu, sehingga terjemahan ini lebih tepat daripada istilah netral 'seseorang'.
- source_word: κεράμιον ὕδατος
  choice: tempayan berisi air
  rationale: '''Tempayan'' menggambarkan wadah yang dibawa, dan ''berisi air'' menyatakan isi wadah secara alami. Nuansa bahwa wadah itu mungkin terbuat dari tanah liat tidak perlu diperinci karena tidak menentukan maksud ayat.'
- source_word: βαστάζων
  choice: yang membawa
  rationale: Partisipel ini menggambarkan tindakan yang sedang dilakukan laki-laki tersebut; bentuk relatif ini alami dalam bahasa Indonesia.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Ikutilah dia
  rationale: Imperatif langsung dipertahankan dengan akhiran '-lah', yang memberi nada perintah tegas tetapi wajar.
- source_word: οἰκίαν
  choice: rumah
  rationale: '''Rumah'' merupakan padanan konkret dan langsung dalam konteks tujuan gerak.'
- source_word: εἰς ἣν εἰσπορεύεται
  choice: yang dimasukinya
  rationale: Klausa relatif ini mengidentifikasi rumah tertentu dan mempertahankan gagasan masuk ke dalamnya secara ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk membedakan ὑμῶν/ὑμῖν dari bentuk tunggal; 'Ia' mengacu kepada Yesus sesuai konteks dekat.
