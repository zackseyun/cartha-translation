source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: id
  text: Lalu ia mengutus Petrus dan Yohanes dan berkata, “Pergilah dan siapkanlah Paskah[a] bagi kita supaya kita memakannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perjamuan Paskah”; kata Yunani yang dipakai dapat menunjuk pada Paskah secara lebih luas, meskipun konteks persiapan dan tindakan makan di sini mengarah pada perjamuannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Kata ini menyatakan bahwa ia mengirim Petrus dan Yohanes untuk menjalankan tugas tertentu. “Mengutus” alami dalam konteks penugasan dan mempertahankan daya makna verba Yunani.
- source_word: εἰπών
  choice: dengan pesan
  rationale: Partisipel ini mengantar isi perkataan yang menyertai tindakan mengutus. “Dengan pesan” menghasilkan hubungan yang alami dalam bahasa Indonesia tanpa menjadikannya tindakan utama yang terpisah.
- source_word: Πορευθέντες
  choice: Pergilah
  rationale: 'Walaupun bentuk Yunaninya secara formal adalah partisipel aoris, dalam rangkaian perintah ini fungsinya bersifat imperatif: mereka harus pergi lalu melakukan persiapan.'
- source_word: ἑτοιμάσατε
  choice: siapkanlah
  rationale: Imperatif ini menunjuk pada persiapan praktis yang harus dilakukan. “Siapkanlah” jelas, langsung, dan wajar dalam bahasa Indonesia modern.
- source_word: ἡμῖν
  choice: bagi kita
  rationale: Datif ini menyatakan pihak yang menerima manfaat dari persiapan tersebut. “Bagi kita” mempertahankan makna itu tanpa menambahkan cakupan seperti “kita semua”.
- source_word: τὸ πάσχα
  choice: Paskah
  rationale: πάσχα dapat menunjuk pada perayaan Paskah secara luas, perjamuan Paskah, atau unsur korbannya. Konteks menyiapkan dan memakannya mengarah pada perjamuan, tetapi “Paskah” mempertahankan keluasan istilah sumber.
- source_word: ἵνα φάγωμεν
  choice: supaya kita dapat memakannya
  rationale: ἵνα dengan subjungtif menyatakan tujuan. Akhiran “-nya” menyatakan objek yang tersirat, yaitu Paskah yang baru disebut, dan membuat kalimat Indonesia jelas serta alami.
theological_decisions:
- issue: Cakupan makna “Paskah”
  choice: Istilah diterjemahkan sebagai “Paskah” tanpa mempersempitnya dalam teks utama.
  alternative: “perjamuan Paskah” atau “anak domba Paskah”
  rationale: Konteks persiapan dan tindakan makan sangat mendukung pengertian perjamuan Paskah, tetapi istilah Yunani sendiri memiliki cakupan yang lebih luas. Terjemahan utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan kemungkinan yang paling kuat dalam konteks.
- issue: Subjek tersirat dari ἀπέστειλεν
  choice: Diterjemahkan dengan pronomina “ia”.
  alternative: Menambahkan nama “Yesus” berdasarkan konteks sebelumnya.
  rationale: Teks Yunani ayat ini tidak menyebut nama subjek secara eksplisit. Pronomina mempertahankan struktur wacana sumber dan menghindari penambahan nama di dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Pergilah” dan “siapkanlah” mempertahankan ketegasan perintah tanpa terdengar kasar. Pronomina “ia” ditulis dengan huruf kecil karena kapitalisasi teologis tidak terdapat dalam naskah Yunani dan bukan keharusan tata bahasa Indonesia.
