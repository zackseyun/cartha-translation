  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Mengapa kalian tidur? Bangunlah dan berdoalah supaya kalian tidak masuk ke dalam pencobaan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “pencobaan” juga dapat berarti “ujian.”
    reason: Menjaga keluasan makna πειρασμός tanpa memaksakan satu penafsiran.
lexical_decisions:
- source_word: ἀναστάντες
  choice: Bangunlah
  rationale: Partisip aoris ini berfungsi sebagai ajakan atau perintah yang menyertai προσεύχεσθε; “Bangunlah” alami dalam bahasa Indonesia dan sesuai dengan konteks para murid yang sedang tidur.
- source_word: προσεύχεσθε
  choice: berdoalah
  rationale: Bentuk imperatif kini diterjemahkan sebagai perintah langsung yang wajar dalam bahasa Indonesia.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: masuk ke dalam pencobaan
  rationale: Mempertahankan metafora sumber, yaitu “masuk ke dalam,” tanpa menambahkan gagasan “jatuh” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna πειρασμός
  choice: pencobaan
  alternative: ujian
  rationale: Dalam konteks perintah untuk berjaga dan berdoa, “pencobaan” merupakan padanan yang alami, tetapi istilah Yunani dapat pula menunjuk pada ujian atau masa pencobaan; ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena αὐτοῖς dan verba-verba terkait berbentuk jamak; “Ia” merujuk kepada Yesus sesuai konteks, dengan kapitalisasi pronomina yang lazim dalam terjemahan Alkitab bahasa Indonesia.
