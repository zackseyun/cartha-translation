  source_fidelity: Terjemahan setia pada teks Yunani. Καὶ εἶπεν αὐτοῖς diterjemahkan tepat sebagai “Lalu Ia berkata kepada mereka”; pertanyaan Τί καθεύδετε tersampaikan jelas. “Bangunlah dan berdoalah” menangkap fungsi imperatif dari ἀναστάντες ... προσεύχεσθε, dan “supaya kalian tidak masuk ke dalam pencobaan” mempertahankan metafora εἰσέλθητε εἰς πειρασμόν tanpa menambahkan gagasan seperti “jatuh.”
