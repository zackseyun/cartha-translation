id: LUK.22.30
reference: Luke 22:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: id
  text: supaya kamu makan dan minum di meja-Ku dalam kerajaan-Ku, dan kamu akan duduk di atas takhta-takhta untuk menghakimi[a] kedua belas suku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memerintah atas” atau “menjalankan pemerintahan atas” kedua belas suku Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Menandai tujuan atau hasil yang mengalir dari janji sebelumnya dengan bentuk yang alami dalam bahasa Indonesia modern.
- source_word: ἔσθητε καὶ πίνητε
  choice: kamu makan dan minum
  rationale: Kedua bentuk subjungtif berada di bawah ἵνα; kata “supaya” sudah menyampaikan nuansa tujuan sehingga modalitas tidak perlu diulang.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: di meja-Ku
  rationale: Ungkapan alami untuk persekutuan makan bersama, tanpa mengikuti preposisi Yunani secara kaku.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: dalam kerajaan-Ku
  rationale: Konteks perjamuan dan takhta mendukung pengertian ranah kerajaan, sambil tetap menyiratkan pemerintahan raja.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: kamu akan duduk di atas takhta-takhta
  rationale: Mempertahankan bentuk masa depan serta gambaran penobatan dan kewenangan; bentuk ulang menyatakan jamak θρόνων.
- source_word: κρίνοντες
  choice: untuk menghakimi
  rationale: Menyampaikan fungsi yang menyertai kedudukan di takhta. “Menghakimi” merupakan padanan leksikal paling langsung, sedangkan cakupan maknanya dapat mencakup pemerintahan.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: kedua belas suku Israel
  rationale: Padanan baku dan transparan yang mempertahankan rujukan perjanjian kepada Israel sebagai dua belas suku.
theological_decisions:
- issue: Sifat peran para murid kelak terhadap kedua belas suku Israel
  choice: menghakimi
  alternative: memerintah atau menjalankan pemerintahan atas
  rationale: κρίνω dapat memuat nuansa yudisial sekaligus pemerintahan. Teks utama mempertahankan makna yudisial yang paling langsung tanpa membatasinya pada penghukuman saja; kemungkinan nuansa pemerintahan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Huruf kapital pada pronomina posesif yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan hubungan tujuan dari konteks sebelumnya serta gambaran perjamuan, kerajaan, takhta, dan penghakiman.
