  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: id
  text: Mereka berkata kepada-Nya, “Di mana Engkau ingin kami menyiapkannya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih formal, “Di mana Engkau ingin kami membuat persiapan?” Objek yang tersirat ialah perjamuan Paskah yang disebut dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mereka
  rationale: Artikel nominatif dipakai secara substantival dan dalam konteks menunjuk kepada para murid. δέ hanya berfungsi sebagai penghubung ringan, sehingga tidak perlu dinyatakan tersendiri dalam bahasa Indonesia yang alami.
- source_word: εἶπαν
  choice: berkata
  rationale: Bentuk aoris dari λέγω paling langsung berarti “berkata”. Walaupun ujaran langsungnya berupa pertanyaan dan dapat diterjemahkan “bertanya”, pilihan ini mempertahankan bentuk Yunani tanpa menjadi tidak alami.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Pronomina datif ini secara alami diterjemahkan “kepada-Nya” setelah “berkata”; rujukannya adalah Yesus.
- source_word: Ποῦ
  choice: Di mana
  rationale: Adverbia interogatif ini menanyakan tempat; “Di mana” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: θέλεις
  choice: Engkau ingin
  rationale: θέλω menyatakan kehendak atau keinginan. “Engkau ingin” alami dalam pertanyaan langsung dan mempertahankan sapaan tunggal kepada Yesus.
- source_word: ἑτοιμάσωμεν
  choice: kami menyiapkannya
  rationale: Subjungtif aoris orang pertama jamak setelah θέλεις paling alami diungkapkan sebagai “ingin kami menyiapkan”. Akhiran “-nya” memasok objek yang tersirat dari konteks sebelumnya, yaitu perjamuan Paskah.
