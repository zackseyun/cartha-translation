  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: id
  text: Setelah tiba di tempat itu, Ia berkata kepada mereka, “Berdoalah supaya kalian tidak masuk ke dalam pencobaan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ujian” atau “masa pengujian”. Kata Yunani ini dapat berarti pencobaan dalam arti moral ataupun suatu keadaan pengujian yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: setelah tiba
  rationale: Partisip aoris γίνομαι bersama frasa lokasi menyatakan tibanya seseorang di suatu tempat sebelum tindakan utama. “Setelah tiba” alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel δέ hanya menghubungkan alur secara ringan; dalam bahasa Indonesia hubungan naratifnya sudah tersampaikan secara alami melalui “setelah”.
- source_word: ἐπὶ τοῦ τόπου
  choice: di tempat itu
  rationale: Frasa ini menunjuk pada lokasi tertentu yang sudah dikenal dari konteks. Dengan verba “tiba”, preposisi Indonesia yang alami ialah “di”.
- source_word: εἶπεν αὐτοῖς
  choice: Ia berkata kepada mereka
  rationale: Terjemahan ini langsung mencerminkan verba λέγω dan objek tidak langsungnya tanpa menambahkan nuansa perintah pada verba pengantar.
- source_word: Προσεύχεσθε
  choice: Berdoalah
  rationale: Imperatif kini ini memerintahkan doa sebagai tindakan yang harus dilakukan; bentuk “Berdoalah” alami dan cukup menyampaikan seruan tersebut tanpa parafrasa berlebihan.
- source_word: μὴ εἰσελθεῖν
  choice: supaya kalian tidak masuk ke dalam
  rationale: Konstruksi ini menyatakan isi atau tujuan doa. “Masuk ke dalam” mempertahankan gambaran verba εἰσέρχομαι dan tidak menafsirkannya sebagai “jatuh”.
- source_word: πειρασμόν
  choice: pencobaan
  rationale: Dalam konteks ancaman kegagalan rohani para murid, “pencobaan” paling sesuai. Namun, kata Yunani ini juga dapat berarti ujian atau pengujian, sehingga keluasan maknanya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna πειρασμός dalam peringatan Yesus
  choice: pencobaan
  alternative: ujian atau masa pengujian
  rationale: Konteks langsung menyoroti bahaya kegagalan rohani, sehingga “pencobaan” merupakan pilihan utama yang wajar. Karena πειρασμός juga dapat menunjuk pada ujian yang lebih luas, kemungkinan itu tidak dihilangkan, melainkan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” memperjelas bahwa perintah ditujukan kepada beberapa murid. Susunan “setelah tiba” mengalir alami sekaligus mempertahankan urutan tindakan dalam teks Yunani.
