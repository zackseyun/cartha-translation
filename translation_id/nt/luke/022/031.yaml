  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: id
  text: “Simon, Simon, lihat! Setan telah menuntut untuk menampi kalian seperti gandum.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: lihat!
  rationale: Kata seru ini menarik perhatian Simon kepada peringatan yang mendesak; bentuk ini alami dan langsung dalam bahasa Indonesia.
- source_word: ἐξῃτήσατο
  choice: telah menuntut
  rationale: Bentuk ini menyatakan tuntutan atau permintaan yang kuat, bukan sekadar permohonan biasa, tanpa menambahkan objek yang tidak dinyatakan dalam teks Yunani.
- source_word: ὑμᾶς
  choice: kalian
  rationale: 'Pronomina ini berbentuk jamak: Yesus menyapa Simon secara khusus, tetapi tuntutan Setan mencakup kelompok para murid.'
- source_word: σινιάσαι
  choice: menampi
  rationale: Istilah pertanian ini mempertahankan metafora pemisahan dan pengguncangan biji-bijian.
- source_word: ὡς τὸν σῖτον
  choice: seperti gandum
  rationale: Terjemahan langsung mempertahankan perbandingan yang digunakan dalam sumber.
theological_decisions:
- issue: Cakupan ὑμᾶς
  choice: kalian
  alternative: kamu
  rationale: Bentuk Yunani jamak perlu tampak dalam terjemahan agar peringatan tidak dibatasi hanya kepada Simon.
- issue: Makna ἐξῃτήσατο
  choice: telah menuntut
  alternative: telah meminta izin untuk menguasai kalian
  rationale: Pilihan utama menjaga kekuatan verba sekaligus menghindari penambahan konsep izin atau penguasaan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan nama dipertahankan untuk menunjukkan penekanan, sedangkan tanda seru sesudah “lihat” menyampaikan daya seru ἰδού.
