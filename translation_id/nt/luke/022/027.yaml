    rationale: ἀνάκειμαι dalam konteks jamuan berarti bersandar atau berbaring saat makan menurut kebiasaan perjamuan kuno. “Duduk” mengganti gambaran budaya sumber dengan postur yang berbeda. Karena postur itu sukar diungkapkan secara idiomatis dalam teks utama Indonesia, “orang yang sedang bersantap” aman bila penjelasan tentang berbaring dipertahankan dalam catatan kaki.
  - severity: low
    issue: Koma setelah “Sebab”
    rationale: Dalam konstruksi “Sebab siapakah ...?”, koma tidak diperlukan dan sedikit mengganggu kelancaran kalimat Indonesia.
