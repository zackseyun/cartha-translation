  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: id
  text: 'Sebab siapakah yang lebih besar: orang yang sedang bersantap[a] atau orang yang melayani? Bukankah orang yang sedang bersantap? Namun Aku ada di tengah-tengah kalian sebagai orang yang melayani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang berbaring (saat makan).” Dalam kebiasaan perjamuan pada masa itu, para tamu makan sambil berbaring atau bersandar, sedangkan para pelayan melayani mereka.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Sebab, siapakah yang lebih besar
  rationale: “Sebab” mempertahankan hubungan penjelasan dengan perkataan sebelumnya, sedangkan “lebih besar” mempertahankan perbandingan mengenai kedudukan tanpa mempersempitnya menjadi sekadar ‘lebih penting’.
- source_word: ὁ ἀνακείμενος
  choice: orang yang duduk bersantap
  rationale: Dalam konteks perjamuan, ungkapan ini menunjuk kepada tamu yang makan sambil berbaring menurut kebiasaan masa itu. “Duduk bersantap” menyampaikan peran tamu secara wajar dalam bahasa Indonesia modern, sementara rincian budayanya dijelaskan dalam catatan kaki.
- source_word: ὁ διακονῶν
  choice: orang yang melayani
  rationale: Partisipel ini menekankan tindakan melayani dan dalam konteks ini berlawanan dengan peran orang yang sedang bersantap. Pilihan ini menghindari konotasi jabatan gerejawi maupun status budak.
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Bentuk ini merupakan pertanyaan retoris yang mengharapkan jawaban ya; “Bukankah” mempertahankan dorongan retoris itu secara alami.
- source_word: ἐγὼ δὲ
  choice: Namun Aku
  rationale: “Namun” menandai pertentangan antara tata nilai sosial yang lazim dan teladan Yesus.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: Aku ada di tengah-tengah kalian
  rationale: Terjemahan ini mempertahankan gambaran kehadiran di tengah kelompok, dan “kalian” menyatakan dengan jelas bahwa kata ganti Yunani tersebut berbentuk jamak.
- source_word: ὡς ὁ διακονῶν
  choice: sebagai orang yang melayani
  rationale: “Sebagai” menyatakan peran atau cara Yesus hadir, sementara bentuk verbal “yang melayani” mempertahankan penekanan pada tindakan.
theological_decisions:
- issue: Penggambaran diri Yesus dengan bahasa pelayanan
  choice: Namun Aku ada di tengah-tengah kalian sebagai orang yang melayani.
  alternative: Namun Aku ada di tengah-tengah kalian sebagai seorang pelayan.
  rationale: Teks Yunani memakai partisipel διακονῶν, bukan kata benda yang secara langsung berarti ‘pelayan’ atau ‘budak’. Terjemahan verbal mempertahankan kerendahan hati dan tindakan pelayanan Yesus tanpa menambahkan nuansa status yang tidak dinyatakan secara eksplisit.
- issue: Makna “lebih besar” dalam perbandingan
  choice: lebih besar
  alternative: lebih penting
  rationale: “Lebih besar” mempertahankan keluasan μείζων, yang dalam konteks dapat menyangkut kedudukan, kehormatan, atau keutamaan. Terjemahan tidak memilih salah satu aspek itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. “Bersantap” dipilih untuk konteks perjamuan, “kalian” memperjelas bentuk jamak, dan huruf kapital pada “Aku” mengikuti kebiasaan penghormatan dalam penerbitan Alkitab bahasa Indonesia.
