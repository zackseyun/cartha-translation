  naturalness: Kalimatnya pada dasarnya alami dan register-nya sesuai. “Sebab siapakah” lebih lancar tanpa koma sesudah “Sebab”. “Orang yang sedang bersantap” lebih alami daripada “orang yang duduk bersantap” serta tidak menyatakan postur yang keliru.
  terminology: “Lebih besar”, “melayani”, “Bukankah”, dan “sebagai orang yang melayani” menangkap kontras status dan tindakan pelayanan dalam bahasa Yunani tanpa memasukkan nuansa jabatan atau status budak. “Aku” dan “kalian” cocok untuk register modern yang hormat namun tetap wajar.
