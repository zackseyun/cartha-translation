  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: id
  text: Namun, kalianlah yang tetap bersama-Ku dalam berbagai pencobaan yang Kualami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "berbagai cobaan yang Kualami" atau "berbagai pengujian yang Kualami". Kata Yunani yang dipakai dapat berarti pencobaan, cobaan, atau pengujian; di sini kemungkinan besar yang dimaksud ialah berbagai kesukaran yang dialami Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kalianlah
  rationale: Kata ganti orang kedua jamak ditempatkan di awal untuk penekanan; bentuk 'kalianlah' menyampaikan baik jumlah jamak maupun tekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: δέ
  choice: Namun
  rationale: Menandai kontras dengan perkataan Yesus dalam konteks sebelumnya; 'Namun' mempertahankan nuansa adversatif dengan register yang wajar dan bermartabat.
- source_word: οἱ διαμεμενηκότες
  choice: yang tetap
  rationale: Partisip aktif perfektum substantival ini menunjuk pada kelompok yang terus bertahan sampai saat pembicaraan. 'Yang tetap' secara ringkas menyampaikan ketekunan berkelanjutan itu.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Menyatakan kebersamaan atau penyertaan dengan Yesus.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: dalam berbagai pencobaan yang Kualami
  rationale: πειρασμός dapat berarti pencobaan, pengujian, atau cobaan. 'Pencobaan' mempertahankan keluasan makna istilah Yunani, sedangkan 'yang Kualami' menjelaskan genitif μου secara alami tanpa mengartikan bahwa Yesus adalah sumber pencobaan itu.
theological_decisions:
- issue: Makna πειρασμοῖς ketika merujuk kepada Yesus
  choice: pencobaan yang dialami Yesus
  alternative: cobaan atau berbagai ujian yang dihadapi Yesus
  rationale: Istilah Yunani dapat mencakup godaan untuk berbuat dosa maupun ujian dan kesukaran. Teks Indonesia mempertahankan ketegangan makna itu dengan 'pencobaan', sementara catatan kaki menyajikan alternatif kontekstual tanpa menyangkal bahwa Yesus juga mengalami pencobaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar jumlah pada Ὑμεῖς tetap jelas. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kelaziman penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami sekaligus mempertahankan penekanan pada para murid.
