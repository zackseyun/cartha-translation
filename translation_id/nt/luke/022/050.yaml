id: LUK.22.50
reference: Luke 22:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: id
  text: Lalu salah seorang dari mereka memukul budak imam besar itu dan memotong telinga kanannya sampai putus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan imam besar itu”. Kata Yunani doulos dapat berarti budak atau pelayan, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: memukul
  rationale: Kata kerja ini menyatakan pukulan keras. “Memukul” menyampaikan tindakan konkret itu dengan bahasa Indonesia modern tanpa menambahkan senjata atau cara menyerang yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: salah seorang dari mereka
  rationale: Ungkapan ini menunjuk kepada seorang yang tidak disebutkan namanya dari kelompok tersebut. “Salah seorang dari mereka” alami dalam bahasa Indonesia dan mempertahankan anonimitas dalam narasi Lukas.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: budak imam besar itu
  rationale: Dalam konteks sosial harfiah ini, δοῦλος menunjuk kepada orang yang berada dalam status perbudakan dan menjadi bagian dari rumah tangga imam besar. “Budak” mempertahankan status tersebut, sedangkan kemungkinan padanan yang lebih umum, “pelayan”, dicatat dalam catatan kaki.
- source_word: ἀφεῖλεν
  choice: memotong ... sampai putus
  rationale: Secara leksikal kata ini berarti mengambil atau menyingkirkan, tetapi dengan telinga sebagai objek dalam konteks luka, ungkapan “memotong ... sampai putus” menyatakan hasil tindakannya secara jelas dan alami tanpa menentukan alat yang dipakai.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: telinga kanannya
  rationale: Padanan ini alami dalam bahasa Indonesia serta mempertahankan keterangan bahwa bagian tubuh yang terluka adalah telinga sebelah kanan.
theological_decisions:
- issue: Padanan δοῦλος dalam arti sosial harfiah
  choice: budak
  alternative: pelayan
  rationale: “Budak” dipilih karena konteksnya menunjuk pada status sosial yang terikat, bukan sekadar fungsi pelayanan. Namun, karena δοῦλος dapat diterjemahkan “pelayan” dalam konteks tertentu dan rincian status orang ini tidak dijelaskan lebih jauh dalam ayat tersebut, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa dibuat lugas, modern, dan bermartabat. Susunan “memotong ... sampai putus” dipakai agar hasil tindakan jelas dalam bahasa Indonesia, sementara “memukul” tidak memasukkan pedang atau alat lain yang tidak disebutkan secara eksplisit dalam ayat ini.
