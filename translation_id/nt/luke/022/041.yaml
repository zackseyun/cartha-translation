  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: id
  text: Lalu Ia menjauh dari mereka kira-kira sepelemparan batu[a]. Ia berlutut[b] dan terus berdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kira-kira sejauh lemparan batu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setelah menekukkan lutut,” yaitu berlutut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: menjauh
  rationale: Bentuk pasif Yunani secara harfiah dapat berarti ‘ditarik menjauh’, tetapi dalam konteks ini secara idiomatis menggambarkan Yesus memisahkan diri dari para murid. ‘Menjauh’ alami dalam bahasa Indonesia tanpa menghilangkan gerak menjauhi mereka.
- source_word: ὡσεὶ λίθου βολήν
  choice: kira-kira sepelemparan batu
  rationale: Ungkapan ini menyatakan perkiraan jarak sejauh batu dapat dilempar. ‘Kira-kira sepelemparan batu’ mempertahankan gambaran konkret dan unsur perkiraan dari ὡσεὶ.
- source_word: θεὶς τὰ γόνατα
  choice: berlutut
  rationale: Secara harfiah berarti ‘menempatkan lutut’, sebuah ungkapan untuk mengambil sikap berlutut. ‘Berlutut’ menyampaikan postur itu dengan jelas dan wajar.
- source_word: προσηύχετο
  choice: terus berdoa
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang atau berlanjut. ‘Terus berdoa’ mempertahankan aspek duratifnya tanpa menyiratkan kapan doa itu dimulai.
- source_word: αὐτὸς
  choice: Ia
  rationale: Pronomina ini menunjuk kembali kepada Yesus dan memiliki sedikit penekanan. Dalam bahasa Indonesia, ‘Ia’ cukup jelas dan sesuai dengan ragam Alkitab yang bermartabat; penambahan ‘sendiri’ tidak diperlukan.
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur naratif, ‘Lalu’ menghubungkan tindakan ini dengan peristiwa sebelumnya secara alami tanpa menambahkan hubungan sebab-akibat.
theological_decisions:
- issue: Postur doa dan penggambaran Kristologis
  choice: Menerjemahkan secara langsung bahwa Yesus menjauh, berlutut, dan berdoa
  alternative: Menambahkan penjelasan devosional atau doktrinal tentang makna tindakan-Nya
  rationale: Ayat ini menarasikan tindakan dan postur Yesus ketika berdoa. Terjemahan mempertahankan kesungguhan adegan tanpa memasukkan penafsiran teologis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, alami, dan bermartabat. ‘Sepelemparan batu’ mempertahankan citra sumber, sedangkan catatan kaki memberi bentuk penjelas yang lebih biasa. Semua penanda catatan kaki dicantumkan dalam teks utama.
