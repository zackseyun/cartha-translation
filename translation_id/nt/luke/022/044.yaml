base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: id
  text: Ketika Ia berada dalam pergumulan yang sangat berat, Ia berdoa semakin sungguh-sungguh;[a][b] dan keringat-Nya menjadi seperti tetes-tetes darah yang jatuh ke tanah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lebih tekun” atau “lebih bersungguh-sungguh.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah tidak memuat Lukas 22:43–44, sedangkan naskah-naskah lain memuatnya. SBLGNT mencetak kedua ayat ini dalam tanda kurung untuk menunjukkan ketidakpastian tekstual tersebut.
    reason: textual_variant
  - marker: c
    text: Secara harfiah, “seperti tetes-tetes/gumpalan-gumpalan darah.” Kata “seperti” mempertahankan perbandingan dan tidak dengan sendirinya menyatakan bahwa keringat itu adalah darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: Dalam penderitaan yang berat
  rationale: Ungkapan ini memperkenalkan keadaan Yesus dalam pergumulan atau kesengsaraan yang sangat hebat. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa ἀγωνία sekadar rasa sakit jasmani.
- source_word: ἐκτενέστερον
  choice: dengan semakin sungguh-sungguh
  rationale: Bentuk komparatif menunjukkan peningkatan kesungguhan atau intensitas; 'semakin sungguh-sungguh' mempertahankan daya komparatifnya dalam bahasa Indonesia yang alami.
- source_word: προσηύχετο
  choice: Ia berdoa
  rationale: Konteks dan susunan kalimat menyampaikan tindakan doa yang sedang berlangsung. Bahasa Indonesia umumnya tidak perlu menandai aspek progresif dengan bentuk khusus.
- source_word: ἐγένετο
  choice: menjadi
  rationale: Mempertahankan gagasan perubahan atau keadaan yang timbul, bukan sekadar menyatakan 'adalah'.
- source_word: ἱδρὼς αὐτοῦ
  choice: keringat-Nya
  rationale: Padanan langsung dan alami; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Yesus.
- source_word: ὡσεὶ
  choice: seperti
  rationale: Partikel ini menandai perbandingan, sehingga terjemahan tidak menyatakan secara pasti bahwa keringat itu sendiri adalah darah.
- source_word: θρόμβοι αἵματος
  choice: tetes-tetes darah
  rationale: θρόμβοι dapat menunjuk pada gumpalan atau tetesan yang kental. Dalam gambaran sesuatu yang jatuh ke tanah, 'tetes-tetes darah' paling alami, sementara kemungkinan 'gumpalan' dicatat dalam catatan kaki.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: yang jatuh ke tanah
  rationale: Menyampaikan gerak turun secara jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat perbandingan antara keringat dan darah
  choice: 'Mempertahankan simile: keringat-Nya menjadi seperti tetes-tetes darah.'
  alternative: Keringat-Nya adalah darah atau bercampur darah.
  rationale: ὡσεὶ secara eksplisit menandai kemiripan. Terjemahan tidak menutup kemungkinan pembacaan fisiologis, tetapi tidak mengubah perbandingan dalam teks Yunani menjadi pernyataan identitas.
- issue: Ketidakpastian tekstual Lukas 22:43–44
  choice: Ayat diterjemahkan dalam teks utama dengan catatan varian naskah.
  alternative: Menghilangkan ayat dari teks utama.
  rationale: SBLGNT mencetak bagian ini dengan tanda kurung kritis. Memuatnya sambil memberi catatan menjadikan isi dan ketidakpastian bukti naskah sama-sama terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat lancar bagi pembaca umum sambil mempertahankan bentuk komparatif pada doa, perbandingan eksplisit pada keringat, serta ketidakpastian tekstual ayat.
