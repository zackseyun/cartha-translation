  source_fidelity: Terjemahan mempertahankan intensitas komparatif ἐκτενέστερον, aspek perbandingan ὡσεὶ, serta gerak turun dalam καταβαίνοντες ἐπὶ τὴν γῆν. Namun, “Dalam penderitaan yang berat” kurang jelas menyatakan keadaan yang diperkenalkan oleh γενόμενος dan dapat mempersempit ἀγωνία menjadi penderitaan belaka. “Ketika Ia berada dalam pergumulan yang sangat berat” menyampaikan keadaan itu dengan lebih lengkap tanpa membatasi pergumulan pada penderitaan fisik.
  naturalness: Kalimat revisi tetap baku, modern, dan lancar. “Pergumulan yang sangat berat” adalah padanan yang wajar untuk keadaan tekanan atau kecemasan hebat, sedangkan “Ia berdoa semakin sungguh-sungguh” idiomatis dan mempertahankan daya komparatif.
  terminology: “Keringat-Nya menjadi seperti tetes-tetes darah” dengan tepat mempertahankan simile Yunani dan tidak menyatakan identitas antara keringat dan darah. Catatan tekstual dan catatan mengenai θρόμβοι dipertahankan; alternatif “lebih kuat” dihapus karena kurang tepat sebagai padanan langsung bagi intensitas doa.
