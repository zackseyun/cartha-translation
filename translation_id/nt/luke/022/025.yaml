  to: Namun, Yesus berkata kepada mereka, “Raja-raja bangsa-bangsa lain berkuasa atas bangsa-bangsa itu, dan orang-orang yang menjalankan kekuasaan atas bangsa-bangsa itu disebut ‘Dermawan.’[a]”
