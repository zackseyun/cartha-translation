  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: id
  text: Namun, Yesus berkata kepada mereka, “Raja-raja bangsa-bangsa lain berkuasa atas bangsa-bangsa itu, dan orang-orang yang menjalankan kekuasaan atas bangsa-bangsa itu disebut ‘Dermawan.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dermawan” merupakan gelar kehormatan bagi penguasa atau patron berkuasa yang dianggap berjasa bagi masyarakat.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: raja-raja
  rationale: Kata ini secara khusus menunjuk kepada para raja, bukan sekadar penguasa pada umumnya.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Dalam konteks Lukas-Kisah Para Rasul, ungkapan ini lazim menunjuk kepada bangsa-bangsa non-Yahudi; pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kelompok bangsa.
- source_word: κυριεύουσιν
  choice: memerintah ... dengan sewenang-wenang
  rationale: Ungkapan ini menyampaikan penggunaan kekuasaan secara mendominasi, sesuai dengan kontras yang dibuat Yesus tentang kepemimpinan.
- source_word: ἐξουσιάζοντες
  choice: orang-orang yang menjalankan kekuasaan
  rationale: Bentuk verbal dipertahankan untuk menekankan tindakan menggunakan kekuasaan, bukan hanya kedudukan resmi.
- source_word: εὐεργέται
  choice: Dermawan
  rationale: Kata ini berfungsi sebagai gelar kehormatan bagi penguasa atau patron yang dipandang memberi manfaat kepada masyarakat; huruf kapital dan tanda petik menandai pemakaiannya sebagai gelar.
- source_word: καλοῦνται
  choice: disebut
  rationale: Bentuk pasif ini secara langsung menyatakan gelar yang disematkan kepada para pemegang kekuasaan tersebut.
- source_word: δὲ
  choice: Namun
  rationale: Kata penghubung ini menandai kontras ringan dengan perdebatan para murid dalam konteks sebelumnya.
theological_decisions:
- issue: Makna τῶν ἐθνῶν dalam konteks
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa
  rationale: Pilihan ini mencerminkan pemakaian umum istilah tersebut bagi bangsa-bangsa non-Yahudi tanpa memasukkan klaim teologis tambahan; alternatif yang lebih umum tetap mungkin secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Nama Yesus digunakan untuk memperjelas subjek pronominal dalam kutipan ayat tunggal. Frasa “dengan sewenang-wenang” menangkap daya dominatif κυριεύουσιν tanpa terdengar kaku; “Dermawan” dipertahankan sebagai gelar budaya dan dijelaskan dalam catatan kaki.
