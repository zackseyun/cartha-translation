  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: id
  text: Setelah mereka menutupi-Nya[a], mereka terus bertanya kepada-Nya, “Bernubuatlah! Siapakah yang telah memukul Engkau?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menutup mata-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: sesudah menutupi wajah-Nya
  rationale: Partisip ini menyatakan tindakan menutupi atau menyelubungi. Penyebutan 'wajah-Nya' membuat ungkapan itu wajar dalam bahasa Indonesia dan sesuai konteks, tanpa menetapkan alat atau cara khusus seperti kain penutup mata.
- source_word: ἐπηρώτων
  choice: mereka terus bertanya kepada-Nya
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; 'terus bertanya' mempertahankan nuansa tersebut.
- source_word: λέγοντες
  choice: (diungkapkan melalui kutipan langsung)
  rationale: Dalam bahasa Indonesia, λέγοντες dapat disampaikan secara alami dengan langsung memperkenalkan isi pertanyaan tanpa menambahkan 'dengan berkata' yang terasa kaku dan berulang.
- source_word: Προφήτευσον
  choice: Bernubuatlah!
  rationale: Imperatif aoris ini merupakan perintah bernada ejekan. 'Bernubuatlah!' langsung, alami, dan mempertahankan ironi terhadap identitas kenabian Yesus.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Siapa yang memukul Engkau?
  rationale: Partisip berartikel ὁ παίσας berfungsi substantival, yaitu orang yang telah memukul. Susunan Indonesia ini alami dan mempertahankan maksud pertanyaannya.
theological_decisions:
- issue: Apakah harus dinyatakan secara eksplisit bahwa Yesus ditutup matanya
  choice: Memakai ungkapan yang lebih luas, 'menutupi wajah-Nya', dalam teks utama
  alternative: menutup mata-Nya / menutupi mata-Nya dengan kain
  rationale: Konteks menyiratkan bahwa penglihatan Yesus dihalangi, tetapi verba Yunani hanya menyatakan tindakan menutupi atau menyelubungi. Terjemahan utama tidak menentukan cara yang tidak disebutkan sumber; tafsiran lazim dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Engkau' dipertahankan untuk ujaran langsung kepada Yesus, sedangkan pronomina yang merujuk kepada-Nya ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
