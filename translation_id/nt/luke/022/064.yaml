  naturalness: '"Setelah mereka menutupi-Nya" adalah bahasa Indonesia baku dan alami, sekaligus mempertahankan keluasan verba sumber. "Siapakah" dan "yang telah memukul Engkau" sesuai dengan register naratif Alkitab Indonesia modern yang bermartabat.'
  terminology: '"Bernubuatlah" tepat dan tidak menambahkan penafsiran. Kapitalisasi rujukan kepada Yesus serta sapaan "Engkau" konsisten dengan gaya draf. Catatan kaki mempertahankan alternatif kontekstual "menutup mata-Nya" tanpa memasukkannya ke teks utama.'
