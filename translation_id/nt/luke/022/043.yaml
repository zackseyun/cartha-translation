  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: id
  text: Lalu seorang malaikat dari surga menampakkan diri kepadanya[a] dan menguatkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat ayat 43–44.
