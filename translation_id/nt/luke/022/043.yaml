lexical_decisions:
- source_word: ὤφθη
  choice: menampakkan diri
  rationale: Bentuk pasif aoristis dari ὁράω di sini berfungsi sebagai ungkapan penampakan. 'Menampakkan diri' alami dalam bahasa Indonesia dan tidak menggeser fokus kepada orang yang melihat.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan alur narasi; 'Lalu' menyampaikan perkembangan adegan tanpa memberi kesan pertentangan yang tidak ada.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Dativus ini menyatakan orang yang mengalami penampakan; 'menampakkan diri kepadanya' merupakan ungkapan Indonesia yang wajar.
- source_word: ἄγγελος
  choice: seorang malaikat
  rationale: Dalam konteks asal surgawi, ἄγγελος jelas berarti malaikat, bukan sekadar utusan. Nomina tanpa artikel diterjemahkan secara tak tentu dengan 'seorang'.
- source_word: ἀπ’ οὐρανοῦ
  choice: dari surga
  rationale: Frasa ini menyatakan asal malaikat. 'Dari surga' adalah padanan modern dan langsung.
- source_word: ἐνισχύων
  choice: dan menguatkannya
  rationale: Partisipel kini menyatakan tindakan penyerta yang berlangsung sehubungan dengan penampakan. Klausa berkoordinasi lebih alami dalam bahasa Indonesia, sedangkan 'menguatkan' mempertahankan makna dasarnya tanpa mempersempitnya menjadi sekadar memberi semangat.
- source_word: αὐτόν
  choice: -nya
  rationale: Objek ini merujuk kepada Yesus; bentuk enklitik '-nya' menghasilkan kalimat Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Status tekstual Lukas 22:43
  choice: Ayat diterjemahkan dalam teks utama sesuai teks SBLGNT yang diberikan.
  alternative: Sejumlah naskah tidak memuat ayat 43–44.
  rationale: Terjemahan mengikuti sumber Yunani yang disediakan, tetapi varian penghilangan dua ayat ini cukup penting untuk dicatat agar ketidakpastian tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pilihan 'menampakkan diri' mempertahankan corak formula penampakan, sedangkan 'dan menguatkannya' membuat hubungan partisipial jelas serta alami tanpa menambah penafsiran.
