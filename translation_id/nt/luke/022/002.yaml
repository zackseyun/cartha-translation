  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: id
  text: Para imam kepala dan para ahli Taurat terus mencari cara untuk membunuh Dia[a], sebab mereka takut kepada orang banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghukum mati Dia.”
    reason: Alternatif leksikal yang mungkin bagi ἀνέλωσιν; ungkapan ini lebih menonjolkan kematian melalui tindakan resmi.
lexical_decisions:
- source_word: ἐζήτουν
  choice: terus mencari
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung atau berulang pada masa lampau; “terus mencari” menyampaikan aspek itu secara alami dalam bahasa Indonesia.
- source_word: ἀρχιερεῖς
  choice: para imam kepala
  rationale: Ungkapan ini lazim menunjuk kepada kalangan pemimpin keimaman di Yerusalem dan tidak menyiratkan adanya beberapa pemegang jabatan Imam Besar.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Padanan yang mapan dan mudah dipahami untuk para pakar serta penafsir hukum Taurat dalam konteks Injil.
- source_word: τὸ πῶς
  choice: cara untuk
  rationale: Ungkapan berartikel ini idiomatis berarti “bagaimana” atau “cara”; susunan “mencari cara untuk” paling alami dalam bahasa Indonesia.
- source_word: ἀνέλωσιν
  choice: membunuh
  rationale: Dalam konteks ini verba tersebut menyatakan menghilangkan nyawa. “Membunuh” mempertahankan ketegasan maksud para pemimpin tanpa menambahkan proses hukum tertentu.
- source_word: ἐφοβοῦντο
  choice: mereka takut
  rationale: Menyatakan keadaan takut yang berlangsung; dalam bahasa Indonesia, bentuk sederhana ini sudah alami dan konteks menerangkan keberlangsungannya.
- source_word: τὸν λαόν
  choice: rakyat
  rationale: λαός menunjuk secara kolektif kepada orang banyak atau rakyat, bukan semata-mata kerumunan yang sedang berkumpul. “Rakyat” mempertahankan cakupan kolektif tersebut.
theological_decisions:
- issue: Kekuatan makna ἀνέλωσιν dalam menggambarkan niat para pemimpin
  choice: membunuh Dia
  alternative: melenyapkan Dia; menghukum mati Dia
  rationale: Pilihan ini mempertahankan jelasnya niat untuk menghilangkan nyawa tanpa memperhalus permusuhan mereka atau secara prematur menentukan bahwa caranya harus berupa pelaksanaan hukuman resmi.
- issue: Cakupan rujukan λαός
  choice: rakyat
  alternative: orang banyak; kerumunan
  rationale: “Rakyat” mempertahankan rujukan kolektif dan ketegangan naratif bahwa para pemimpin menahan diri karena takut terhadap reaksi publik, tanpa mempersempitnya menjadi satu kerumunan tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Terus mencari cara” menyampaikan aspek imperfek secara wajar; “Dia” memakai kapitalisasi penghormatan yang lazim dalam terjemahan Alkitab bahasa Indonesia.
