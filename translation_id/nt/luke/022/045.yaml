  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: id
  text: Setelah bangkit dari doa, Yesus datang kepada para murid dan mendapati mereka sedang tidur karena dukacita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Sesudah bangkit dari berdoa
  rationale: Partisipel aoris ἀναστὰς menunjukkan tindakan yang mendahului kedatangan Yesus kepada para murid. Ungkapan ini mempertahankan gambaran bahwa Ia bangkit dari posisi berdoa tanpa menjadi kaku dalam bahasa Indonesia.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: Yesus mendatangi murid-murid-Nya
  rationale: Partisipel ἐλθὼν dan πρός menyatakan gerak menuju para murid. Bentuk verba finit lebih alami dalam bahasa Indonesia; nama Yesus dinyatakan agar subjek tetap jelas.
- source_word: μαθητὰς
  choice: murid-murid-Nya
  rationale: ‘Murid’ merupakan padanan baku dan tepat untuk μαθητής dalam Injil. Akhiran ‘-Nya’ memperjelas hubungan mereka dengan Yesus yang tersirat oleh konteks dan artikel Yunani.
- source_word: εὗρεν
  choice: mendapati
  rationale: Dalam konteks menemukan seseorang sedang berada dalam suatu keadaan, ‘mendapati’ secara alami menyampaikan makna εὗρεν.
- source_word: κοιμωμένους αὐτοὺς
  choice: mereka tertidur
  rationale: Partisipel kini menggambarkan keadaan mereka ketika ditemukan. ‘Tertidur’ alami dalam bahasa Indonesia dan mempertahankan fakta bahwa mereka sedang tidur.
- source_word: ἀπὸ τῆς λύπης
  choice: karena dukacita
  rationale: ἀπό dengan bentuk genitif di sini paling wajar menyatakan sebab. ‘Dukacita’ menyampaikan λύπη dengan register yang bermartabat dan sesuai dengan tekanan batin dalam konteks.
theological_decisions:
- issue: Hubungan dukacita dengan tidur para murid
  choice: Tidur mereka dinyatakan sebagai akibat dukacita.
  alternative: Mereka sedang tidur dalam keadaan berdukacita, tanpa penekanan sebab yang kuat.
  rationale: Frasa ἀπὸ τῆς λύπης paling alami menyatakan sebab, sehingga diterjemahkan ‘karena dukacita’; terjemahan ini tidak menambahkan penjelasan psikologis di luar teks.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Susunan tindakan dipertahankan: Yesus bangkit dari berdoa, mendatangi para murid, lalu mendapati mereka tertidur. Tidak diperlukan catatan kaki karena makna kausal ἀπὸ τῆς λύπης dapat disampaikan secara langsung dan alami.'
