base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: id
  text: kata-Nya, “Bapa, jika Engkau berkenan, ambillah cawan ini[a] dari-Ku. Namun, bukan kehendak-Ku, melainkan kehendak-Mulah yang terjadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cawan” adalah metafora Alkitabiah untuk bagian yang ditetapkan bagi seseorang, dan sering kali khususnya untuk penderitaan atau penghakiman.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel kini ini memperkenalkan isi doa Yesus dan terkait dengan konteks sebelumnya. Dalam bahasa Indonesia, “kata-Nya” merupakan ungkapan yang alami tanpa memperluas makna.
- source_word: Πάτερ
  choice: Bapa
  rationale: Bentuk vokatif ini adalah sapaan langsung kepada Allah. “Bapa” merupakan padanan yang alami, khidmat, dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: εἰ βούλει
  choice: jika Engkau berkenan
  rationale: βούλομαι menyatakan kemauan atau kesediaan. “Berkenan” menyampaikan permohonan bersyarat secara alami dan hormat tanpa menjadikannya sekadar izin.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: ambillah ... dari-Ku
  rationale: Imperatif aoris παραφέρω bersama ἀπ’ ἐμοῦ meminta agar cawan itu disingkirkan dari Yesus. “Ambillah ... dari-Ku” mempertahankan bentuk permohonan langsung dan alami.
- source_word: τοῦτο τὸ ποτήριον
  choice: cawan ini
  rationale: Metafora “cawan” dipertahankan karena memiliki gema alkitabiah penting tentang bagian yang ditetapkan, khususnya penderitaan atau penghakiman, dan tidak sepatutnya diratakan menjadi tafsiran.
- source_word: πλὴν
  choice: Namun
  rationale: Kata ini menandai peralihan konsesif yang kuat dari permohonan kepada penyerahan diri. “Namun” jelas, wajar, dan tetap khidmat.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: janganlah kehendak-Ku, melainkan kehendak-Mu
  rationale: Ungkapan nominal Yunani dipertahankan sebagai “kehendak-Ku ... kehendak-Mu”; pengulangan nomina dalam bahasa Indonesia menghindari ketidakjelasan pronomina dan menjaga kontrasnya.
- source_word: γινέσθω
  choice: yang terjadi
  rationale: Imperatif orang ketiga dari γίνομαι mengungkapkan agar kehendak Bapa berlaku atau terlaksana. Konstruksi “kehendak-Mu yang terjadi” alami dalam kalimat ini dan mempertahankan daya imperatif melalui “janganlah ... melainkan ... yang terjadi”.
theological_decisions:
- issue: Hubungan kehendak Yesus dengan kehendak Bapa
  choice: Kontras diterjemahkan langsung sebagai “janganlah kehendak-Ku, melainkan kehendak-Mu yang terjadi.”
  alternative: “bukan apa yang Kukehendaki, melainkan apa yang Engkau kehendaki”
  rationale: Teks membedakan kehendak Yesus dari kehendak Bapa sekaligus menyatakan penyerahan kepada kehendak Bapa. Terjemahan mempertahankan ketegangan teologis itu tanpa menambahkan penjelasan doktrinal atau melunakkan perbedaannya.
- issue: Daya metaforis ‘cawan’
  choice: Mempertahankan “cawan” dalam teks utama.
  alternative: “penderitaan ini” atau “cobaan berat ini”
  rationale: Menafsirkan metafora langsung sebagai penderitaan akan mempersempit citra yang sengaja dipakai teks dan mengurangi gema antarteks mengenai bagian yang ditetapkan, penderitaan, dan penghakiman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Kapitalisasi pada kata ganti yang merujuk kepada Yesus dan Bapa mengikuti konvensi penerbitan Alkitab bahasa Indonesia. Metafora utama dan kontras kehendak dipertahankan tanpa parafrasa teologis.
