  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: id
  text: Mereka menyalakan api di tengah halaman dan duduk bersama-sama. Petrus sedang duduk di antara mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Petrus duduk di tengah-tengah mereka.” Bentuk imperfek Yunani menggambarkan keadaan yang sedang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: menyalakan
  rationale: Partisip aoris menunjukkan tindakan yang mendahului adegan utama. Dalam bahasa Indonesia, bentuk aktif ini secara alami menyatakan tindakan membuat api menyala.
- source_word: πῦρ
  choice: api
  rationale: Nomina ini merujuk pada api yang dinyalakan di halaman; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: di tengah halaman
  rationale: Ungkapan ini bersifat spasial. 'Halaman' dalam konteks ini adalah pelataran terbuka kediaman imam besar, dan terjemahan ringkas ini wajar dalam bahasa Indonesia.
- source_word: συγκαθισάντων
  choice: lalu duduk bersama-sama
  rationale: Partisip aoris yang sejajar dengan περιαψάντων menyatakan tindakan berikutnya, sedangkan unsur σύν dipertahankan melalui 'bersama-sama'.
- source_word: ἐκάθητο
  choice: duduk
  rationale: Bentuk imperfek menggambarkan Petrus dalam keadaan sedang duduk. Dalam narasi Indonesia, 'duduk' lebih alami daripada 'sedang duduk', sementara nuansa adegan yang berlangsung dijelaskan dalam catatan kaki.
- source_word: μέσος αὐτῶν
  choice: di antara mereka
  rationale: Pemakaian predikatif μέσος dengan genetif menunjukkan posisi Petrus di dalam kelompok itu; 'di antara mereka' alami dan tepat.
- source_word: δὲ
  choice: pun
  rationale: δέ adalah penghubung naratif ringan. Penempatan 'pun' pada klausa utama menghubungkan tindakan Petrus dengan adegan sebelumnya secara alami tanpa memberi pertentangan yang berlebihan.
