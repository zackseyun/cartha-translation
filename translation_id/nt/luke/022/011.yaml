id: LUK.22.11
reference: Luke 22:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: id
  text: Katakanlah kepada tuan rumah itu, ‘Sang Guru berkata kepadamu, “Di manakah kamar tamu[a] tempat Aku dapat makan perjamuan Paskah bersama murid-murid-Ku?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat menginap.” Kata Yunani κατάλυμα menunjuk pada tempat untuk menginap atau kamar bagi tamu; di sini kata itu tidak secara khusus berarti “penginapan,” dan “ruang atas” baru disebutkan dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖτε
  choice: Katakanlah
  rationale: Bentuk futur dapat berfungsi sebagai instruksi dalam konteks ini. Imperatif alami dalam bahasa Indonesia menyampaikan fungsi tersebut dengan jelas.
- source_word: τῷ οἰκοδεσπότῃ τῆς οἰκίας
  choice: kepada kepala rumah itu
  rationale: οἰκοδεσπότης menunjuk kepada orang yang mengepalai atau berwenang atas rumah tangga. 'Kepala rumah' mempertahankan nuansa kewenangan tanpa memastikan bahwa ia pemilik bangunan.
- source_word: ὁ διδάσκαλος
  choice: Sang Guru
  rationale: διδάσκαλος dipakai sebagai gelar yang dikenali. 'Sang Guru' terdengar alami dan terhormat serta menerjemahkan gelar itu tanpa mengubahnya menjadi sebutan lain.
- source_word: κατάλυμα
  choice: ruang tamu
  rationale: Dalam latar rumah ini, κατάλυμα menunjuk pada tempat menginap atau ruangan bagi tamu. 'Ruang tamu' dipahami sebagai kamar/ruang untuk tamu dalam konteks ini, bukan penginapan umum atau ruang atas.
- source_word: τὸ πάσχα
  choice: perjamuan Paskah
  rationale: πάσχα dapat menunjuk pada perayaan atau jamuan Paskah. Karena verba 'makan' mengarahkan perhatian pada jamuan, 'perjamuan Paskah' membuat maksudnya jelas dalam bahasa Indonesia.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: bersama murid-murid-Ku
  rationale: μαθητής dalam Injil menunjuk para pengikut yang belajar dari guru mereka; 'murid' merupakan padanan Indonesia yang baku dan alami.
- source_word: φάγω
  choice: Aku dapat makan
  rationale: Subjungtif aoristus dalam klausa dengan ὅπου menyatakan tindakan yang dimaksudkan atau dimungkinkan. 'Dapat makan' mempertahankan nuansa itu secara alami.
theological_decisions:
- issue: Gelar yang dipakai Yesus untuk menyebut diri-Nya, ὁ διδάσκαλος
  choice: Sang Guru
  alternative: Guru itu; Tuan
  rationale: Teks menyajikannya sebagai gelar yang sudah dikenali. 'Sang Guru' menerjemahkan arti leksikalnya dan menandai fungsi gelarnya tanpa memasukkan gelar teologis lain.
- issue: Cakupan makna τὸ πάσχα
  choice: perjamuan Paskah
  alternative: Paskah
  rationale: Konteks 'makan' terutama menunjuk pada jamuan Paskah, meskipun kata Yunani itu sendiri juga dapat mencakup perayaan Paskah. Pilihan ini memperjelas rujukan kontekstual tanpa mengubah identitas perayaannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan ilahi memakai kapital pada pronomina yang merujuk kepada Yesus sesuai kebiasaan penerbitan Alkitab Indonesia. Tanda petik bertingkat mempertahankan ujaran di dalam ujaran.
