  to: Katakanlah kepada tuan rumah itu, ‘Sang Guru berkata kepadamu, “Di manakah kamar tamu[a] tempat Aku dapat makan perjamuan Paskah bersama murid-murid-Ku?”’
  rationale: 'Revisi mengganti "ruang tamu" dengan "kamar tamu" agar makna κατάλυμα tidak disalahpahami sebagai ruang duduk. "Tuan rumah" meningkatkan kealamian bagi οἰκοδεσπότῃ τῆς οἰκίας. Selebihnya dipertahankan: bentuk instruksional "Katakanlah," gelar "Sang Guru," dan "dapat makan" secara wajar menyampaikan tindakan makan yang dimaksudkan dalam pertanyaan tentang tempat.'
