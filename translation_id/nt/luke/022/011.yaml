    rationale: Dalam pemakaian Indonesia modern, "ruang tamu" lazimnya adalah ruang menerima atau duduk bersama tamu, bukan kamar/akomodasi tamu. Ini dapat menggeser rujukan κατάλυμα, yang di sini menunjuk tempat menginap atau kamar bagi tamu.
  - severity: low
