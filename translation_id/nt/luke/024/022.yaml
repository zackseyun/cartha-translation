base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: id
  text: Namun, beberapa perempuan dari antara kami juga membuat kami tercengang[a] setelah mereka pergi ke makam pagi-pagi sekali[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat kami takjub” atau “membuat kami bingung.” Kata Yunani yang dipakai dapat menyatakan keterkejutan kuat atau kebingungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada waktu fajar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Namun ... juga
  rationale: 'Mempertahankan daya adversatif sekaligus aditif: laporan ini berlawanan dengan kekecewaan sebelumnya dan menambahkan perkembangan yang mengejutkan.'
- source_word: γυναῖκές τινες
  choice: beberapa perempuan
  rationale: Padanan Indonesia modern dan alami untuk bentuk jamak tak tentu.
- source_word: ἐξ ἡμῶν
  choice: dari antara kami
  rationale: Menunjukkan bahwa para perempuan itu berasal dari lingkaran para murid, bukan sekadar datang dari tempat mereka berada.
- source_word: ἐξέστησαν ἡμᾶς
  choice: membuat kami tercengang
  rationale: Mengungkapkan keterkejutan kuat dan tetap membuka kemungkinan adanya rasa bingung, tanpa menyatakan bahwa mereka sudah percaya atau menolak laporan para perempuan.
- source_word: γενόμεναι
  choice: mereka pergi
  rationale: Dalam kaitannya dengan ὀρθριναὶ dan frasa yang menunjuk ke makam, partisip ini secara idiomatis menggambarkan mereka datang atau berada di sana pagi-pagi; bahasa Indonesia alami mengungkapkan gerak itu secara eksplisit.
- source_word: ὀρθριναὶ
  choice: pagi-pagi sekali
  rationale: Ungkapan Indonesia yang alami untuk waktu sangat pagi atau sekitar fajar.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ke makam
  rationale: ἐπί dengan akusatif secara alami menyatakan gerak menuju tempat itu; 'makam' sesuai dengan konteks penguburan Yesus.
theological_decisions:
- issue: Daya ἐξέστησαν dalam laporan tentang kebangkitan
  choice: membuat kami tercengang
  alternative: membuat kami takjub; membuat kami bingung
  rationale: 'Pilihan ini mempertahankan ketegangan naratif: reaksi para murid kuat, tetapi ayat ini sendiri belum memastikan apakah mereka percaya atau tidak percaya kepada laporan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. Kalimat dipecah setelah reaksi para murid agar jelas, sedangkan koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
