  text: But their eyes were kept from recognizing him[a].
translation:
  language: id
  text: Namun, mata mereka terhalang untuk mengenali-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mata mereka ditahan agar tidak mengenali-Nya” atau “mata mereka dihalangi untuk mengenali-Nya.” Bahasa Yunani tidak menyebut siapa atau apa yang menghalangi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: 'Kata penghubung ini menandai perkembangan dengan kontras ringan: Yesus mendekat dan berjalan bersama mereka, tetapi mereka tidak mengenali-Nya.'
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: mata mereka
  rationale: Mempertahankan gambaran jasmani yang konkret dalam teks Yunani dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐκρατοῦντο
  choice: tertahan
  rationale: Bentuk pasif ini menyatakan bahwa mata mereka berada dalam keadaan ditahan tanpa menyebut pelakunya; pilihan ini mempertahankan ketidakjelasan agen dalam bahasa Yunani.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: sehingga tidak mengenali
  rationale: Dalam konteks perjalanan ke Emaus, ἐπιγινώσκω berarti mengenali atau mengetahui identitas seseorang. Susunan ini menyampaikan akibat tanpa memaksakan pembedaan tegas antara tujuan dan hasil.
- source_word: αὐτόν
  choice: Dia
  rationale: Pronomina ini menunjuk kepada Yesus dalam konteks. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada pribadi ilahi.
theological_decisions:
- issue: Siapa yang menyebabkan mereka tidak mengenali Yesus
  choice: 'Mempertahankan bentuk pasif tanpa menyebut pelaku: “mata mereka tertahan”.'
  alternative: Menyebut Allah sebagai pelaku secara eksplisit, atau mengubahnya menjadi “mereka tidak dapat mengenali Dia”.
  rationale: Teks Yunani tidak menyebut agen. Bentuk pasif dipertahankan agar terjemahan tidak menetapkan bahwa Allah secara langsung menjadi pelakunya ataupun menghapus kesan adanya faktor yang menahan.
- issue: Hubungan τοῦ μή dengan verba pasif
  choice: Menerjemahkannya “sehingga tidak mengenali” agar nuansa hasil tetap terbuka.
  alternative: “supaya tidak mengenali” atau “dari mengenali”.
  rationale: Konstruksi infinitif artikular dapat dipahami dengan nuansa hasil atau tujuan. Pilihan ini alami dalam bahasa Indonesia dan tidak secara tegas menetapkan tujuan yang disengaja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Frasa “mata mereka tertahan” sengaja mempertahankan citraan serta bentuk pasif teks sumber; catatan kaki menjelaskan beberapa padanan yang lebih eksplisit tanpa menentukan agennya.
