  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: id
  text: Sementara mereka sedang membicarakan hal-hal itu,[a] Ia sendiri berdiri di tengah-tengah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah menambahkan, “dan berkata kepada mereka, ‘Damai sejahtera bagi kalian.’”
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: hal-hal itu
  rationale: Demonstrativa netral jamak ini merujuk kembali kepada berbagai hal yang baru saja dibicarakan. Bentuk 'hal-hal itu' mempertahankan kemajemukan dan kaitan wacananya.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Sementara mereka sedang membicarakan
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan berbicara yang sedang berlangsung bersamaan dengan peristiwa utama. 'Sementara ... sedang' menyampaikan hubungan temporal itu secara alami dalam bahasa Indonesia.
- source_word: αὐτῶν λαλούντων
  choice: mereka sedang membicarakan
  rationale: Dalam konteks ini, λαλούντων mengacu pada percakapan tentang hal-hal yang baru diceritakan. 'Membicarakan' lebih alami daripada 'mengatakan' ketika objeknya adalah 'hal-hal itu', tanpa menghilangkan gagasan ujaran yang berlangsung.
- source_word: αὐτὸς
  choice: Ia sendiri
  rationale: Pronomina eksplisit ini bersifat menegaskan. 'Ia sendiri' mempertahankan penekanan bahwa Yesus secara pribadi hadir di antara mereka.
- source_word: ἔστη
  choice: berdiri
  rationale: Aoristus ἵστημι menyatakan bahwa Ia mengambil atau berada dalam posisi berdiri. 'Berdiri' menerjemahkan bentuk itu secara langsung tanpa menambahkan gagasan 'muncul' atau gerak yang tidak dinyatakan.
- source_word: ἐν μέσῳ αὐτῶν
  choice: di tengah-tengah mereka
  rationale: Ungkapan ini menyatakan kehadiran di tengah kelompok. 'Di tengah-tengah mereka' alami, jelas, dan sedikit lebih dekat kepada bentuk Yunani daripada sekadar 'di antara mereka'.
theological_decisions:
- issue: Apakah bacaan yang lebih panjang, 'dan berkata kepada mereka, “Damai sejahtera bagi kalian,”' dimasukkan
  choice: Tidak dimasukkan dalam teks utama, sesuai teks SBLGNT yang diberikan.
  alternative: Memasukkan 'dan berkata kepada mereka, “Damai sejahtera bagi kalian.”'
  rationale: Teks Yunani sumber yang diberikan berakhir pada 'di tengah-tengah mereka'. Terjemahan tidak menyelaraskannya secara diam-diam dengan tradisi naskah lain; varian yang penting tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Huruf kapital pada 'Ia' mengikuti kebiasaan penghormatan dalam penerjemahan Alkitab bahasa Indonesia, tanpa menambah informasi yang tidak terdapat dalam teks sumber.
