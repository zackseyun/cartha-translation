    issue: “Lalu” for καί
    rationale: “Lalu” can imply a more explicit temporal or consequential sequence than the Greek coordinating καί. “Dan” is the closer optimal-equivalence rendering.
  - severity: low
    issue: Reduplicated “perkataan-perkataan”
    rationale: Although defensible, it is less idiomatic here. Indonesian collective singular “perkataan-Nya” naturally represents the Greek plural without loss of meaning.
