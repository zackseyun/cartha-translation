  text: καὶ ἐμνήσθησαν τῶν ῥημάτων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/008.yaml
  text: And they remembered his words,[a]
translation:
  language: id
  text: Dan mereka teringat akan perkataan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan-Nya” atau “hal-hal yang dikatakan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Dalam alur naratif, καὶ menghubungkan tanggapan para perempuan dengan perkataan sebelumnya. “Lalu” terdengar alami dalam bahasa Indonesia dan menyatakan kelanjutan tanpa menambahkan rincian waktu yang khusus.
- source_word: ἐμνήσθησαν
  choice: mereka teringat akan
  rationale: Bentuk aoris dari μιμνῄσκομαι di sini bermakna aktif. “Teringat akan” merupakan ungkapan Indonesia yang alami untuk ingatan yang muncul kembali setelah mendengar pengingat.
- source_word: τῶν ῥημάτων
  choice: perkataan-perkataan
  rationale: ῥῆμα dalam konteks ini menunjuk pada hal-hal yang pernah diucapkan. Bentuk ulang mempertahankan nuansa jamak Yunani dan tetap dapat dipahami secara wajar.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina genitif ini merujuk kepada Yesus. Bentuk “-Nya” mempertahankan pronomina sumber tanpa menggantinya secara eksplisit dengan nama Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada naratif. Kapitalisasi “-Nya” mengikuti kebiasaan umum terjemahan Alkitab Indonesia ketika pronomina merujuk kepada Yesus; hal itu tidak mengubah bentuk pronominal teks Yunani.
