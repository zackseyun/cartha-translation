  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: id
  text: dan bagaimana imam-imam kepala serta para pemimpin kami menyerahkan Dia untuk dijatuhi hukuman mati, lalu menyalibkan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyuruh menyalibkan Dia,” yang memperjelas bahwa para pemimpin itu bertanggung jawab atas pelaksanaan hukuman tersebut meskipun pihak Romawi yang melaksanakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: dan bagaimana
  rationale: ὅπως memperkenalkan isi lanjutan dari penuturan pada ayat sebelumnya, sedangkan τε menghubungkannya; “dan bagaimana” wajar dalam alur narasi Indonesia.
- source_word: παρέδωκαν
  choice: menyerahkan
  rationale: παραδίδωμι di sini berarti menyerahkan kepada pihak berwenang untuk proses penghukuman, bukan secara khusus “mengkhianati”.
- source_word: οἱ ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Istilah ini menunjuk golongan kepemimpinan imam pada masa Bait Allah, bukan beberapa imam besar yang menjabat secara bersamaan.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: para pemimpin kami
  rationale: ἄρχοντες menunjuk orang-orang yang memegang kewenangan; “para pemimpin” alami dan tetap mempertahankan ἡμῶν sebagai “kami”.
- source_word: εἰς κρίμα θανάτου
  choice: untuk dijatuhi hukuman mati
  rationale: κρίμα dapat berarti putusan atau vonis. Ungkapan ini menyampaikan hasil yudisial berupa hukuman mati secara jelas dan alami, tanpa mengubahnya menjadi sekadar tujuan umum.
- source_word: ἐσταύρωσαν αὐτόν
  choice: lalu menyalibkan Dia
  rationale: Bentuk aktif Yunani secara langsung menisbatkan tindakan dan tanggung jawab kepada imam-imam kepala serta para pemimpin. “Lalu” membuat urutan tindakan alami dalam bahasa Indonesia tanpa mengurangi daya pernyataan tersebut.
theological_decisions:
- issue: Pelaku dan tanggung jawab dalam penyaliban Yesus
  choice: menyalibkan Dia
  alternative: menyuruh menyalibkan Dia
  rationale: Teks Yunani memakai verba aktif jamak dengan imam-imam kepala dan para pemimpin sebagai subjek. Terjemahan langsung mempertahankan penekanan pada tanggung jawab mereka, meskipun pelaksanaan fisiknya dilakukan oleh penguasa Romawi. Alternatif kausatif memperjelas perantaraan historis, tetapi menambahkan unsur yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Imam-imam kepala” mempertahankan istilah historis yang lazim; “dijatuhi hukuman mati” menyampaikan nuansa hukum secara alami; kapitalisasi “Dia” mengikuti kelaziman teks Alkitab Indonesia.
