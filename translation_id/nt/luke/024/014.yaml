  text: καὶ αὐτοὶ ὡμίλουν πρὸς ἀλλήλους περὶ πάντων τῶν συμβεβηκότων τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: id
  text: Mereka sedang berbicara satu sama lain tentang semua hal yang telah terjadi itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka sedang bercakap-cakap satu sama lain tentang semua peristiwa yang telah berlangsung itu.”
    reason: Alternatif leksikal yang menampilkan ὡμίλουν sebagai 'bercakap-cakap' dan τῶν συμβεβηκότων sebagai 'peristiwa yang telah berlangsung'.
lexical_decisions:
- source_word: καὶ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Indonesia, penghubung naratif ini dapat dibiarkan tersirat agar kalimat tetap alami tanpa menambahkan nuansa waktu yang tidak dinyatakan oleh teks Yunani.
- source_word: αὐτοὶ
  choice: Mereka
  rationale: Pronomina Yunani yang eksplisit diterjemahkan sebagai subjek biasa; penekanan ringan pada αὐτοὶ tidak perlu dibuat menjadi 'mereka sendiri' dalam konteks ini.
- source_word: ὡμίλουν
  choice: sedang berbicara
  rationale: Bentuk imperfek menunjukkan percakapan yang tengah berlangsung pada masa lampau; frasa ini alami dan tidak memberi kesan pembicaraan formal.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Ungkapan ini menyatakan percakapan timbal balik dan sesuai dengan idiom Indonesia bersama verba 'berbicara'.
- source_word: περὶ
  choice: tentang
  rationale: Preposisi ini memperkenalkan pokok percakapan; 'tentang' merupakan padanan modern yang jelas.
- source_word: πάντων
  choice: semua
  rationale: Kata ini mencakup keseluruhan rangkaian hal atau peristiwa yang sedang mereka bicarakan.
- source_word: τῶν συμβεβηκότων τούτων
  choice: hal yang telah terjadi itu
  rationale: Partisip perfek menyatakan hal-hal yang sudah berlangsung dan tetap relevan dalam situasi narasi; bentuk Indonesia ini mempertahankan makna tersebut secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk progresif 'sedang berbicara' mempertahankan aspek imperfek, sedangkan 'telah terjadi' menyampaikan keadaan yang dihasilkan oleh bentuk perfek.
