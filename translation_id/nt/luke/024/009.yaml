  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: id
  text: Setelah kembali dari makam itu, mereka melaporkan semua itu kepada kesebelas orang itu dan kepada semua yang lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Setelah kembali
  rationale: Partisip aoris aktif feminin jamak menunjukkan tindakan yang mendahului verba utama dan merujuk kepada para perempuan. Bentuk ini alami dalam bahasa Indonesia dan menjaga urutan tindakan.
- source_word: μνημείου
  choice: makam
  rationale: Dalam konteks penguburan dan kebangkitan Yesus, 'makam' merupakan padanan Indonesia yang wajar dan tepat untuk tempat jenazah diletakkan.
- source_word: ἀπήγγειλαν
  choice: menyampaikan
  rationale: Verba ini berarti melaporkan atau memberitakan sesuatu kepada pihak lain. 'Menyampaikan' cocok dengan konteks naratif tanpa memberi kesan pengumuman publik yang berlebihan.
- source_word: ταῦτα πάντα
  choice: semua hal itu
  rationale: Padanan ini mempertahankan unsur penunjuk ταῦτα dan cakupan menyeluruh πάντα dalam ungkapan Indonesia yang alami.
- source_word: τοῖς ἕνδεκα
  choice: kesebelas murid
  rationale: '''Kesebelas'' saja terasa kurang lengkap dan kurang alami bagi banyak pembaca Indonesia; ''murid'' menjelaskan kelompok yang dimaksud berdasarkan konteks, tanpa memakai sebutan teknis ''rasul'' yang tidak terdapat dalam frasa Yunani ini.'
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: semua orang lainnya
  rationale: Ungkapan ini membedakan kesebelas murid dari kelompok lebih luas yang juga menerima laporan tersebut dan mempertahankan cakupan πᾶσιν.
theological_decisions:
- issue: Rujukan subjek feminin jamak
  choice: Memakai 'mereka', dengan rujukan kepada para perempuan dari konteks sebelumnya.
  alternative: Mengulang secara eksplisit 'perempuan-perempuan itu'.
  rationale: Bahasa Yunani menandai subjek feminin jamak melalui partisip, sedangkan bahasa Indonesia tidak menandai gender pada pronomina. 'Mereka' menjaga kesinambungan wacana tanpa menambahkan nomina yang tidak dinyatakan dalam ayat ini.
- issue: Sebutan bagi kelompok sebelas orang
  choice: kesebelas murid
  alternative: kesebelas; kesebelas rasul
  rationale: Teks Yunani secara harfiah hanya menyebut 'kesebelas'. Penambahan 'murid' dipilih demi kejelasan dan kelancaran bahasa Indonesia berdasarkan konteks, sedangkan 'rasul' dihindari karena lebih teknis dan tidak dinyatakan di sini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur partisip Yunani dialihkan menjadi anak kalimat waktu agar alami. Tidak diperlukan catatan kaki untuk ayat ini.
