  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: id
  text: Dan, setelah mengambilnya, ia memakannya di hadapan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani hanya mengatakan “mengambil” dan “makan”; objeknya tersirat dari ayat sebelumnya, yaitu potongan ikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, καί mengaitkan tindakan ini dengan pemberian ikan pada ayat sebelumnya. “Lalu” menghasilkan alur Indonesia yang alami tanpa menambahkan penjelasan.
- source_word: λαβὼν
  choice: setelah mengambilnya
  rationale: Partisip aoris aktif dari λαμβάνω menyatakan tindakan yang mendahului verba utama. “Setelah mengambilnya” menyampaikan urutan tersebut secara alami; akhiran -nya merujuk pada potongan ikan dalam ayat sebelumnya.
- source_word: ἐνώπιον αὐτῶν
  choice: di hadapan mereka
  rationale: Ungkapan ini berarti tindakan tersebut dilakukan dalam kehadiran dan penglihatan mereka. “Di hadapan mereka” ringkas, wajar, dan mempertahankan bobot kesaksian dalam adegan itu.
- source_word: ἔφαγεν
  choice: ia memakannya
  rationale: Aoris indikatif dari ἐσθίω menuturkan tindakan makan yang selesai. Objek yang tersirat dibuat eksplisit melalui -nya agar kalimat Indonesia jelas dan alami.
theological_decisions:
- issue: Apakah objek yang tersirat perlu dinyatakan secara eksplisit
  choice: Objek dinyatakan dengan akhiran “-nya” pada “mengambilnya” dan “memakannya”.
  alternative: “Lalu, setelah mengambil, ia makan di hadapan mereka.”
  rationale: Teks Yunani tidak menyebut objek secara eksplisit karena objeknya dapat dipahami dari ayat sebelumnya, yaitu potongan ikan. Bahasa Indonesia lebih alami dengan objek eksplisit di sini. Pilihan ini tidak menambah isi baru dan tetap mempertahankan penekanan naratif bahwa Yesus makan di hadapan mereka, tanpa memperluasnya menjadi penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Ia” dipakai sebagai pronomina naratif yang wajar; struktur partisip Yunani disampaikan dengan “setelah” agar hubungan antartindakan jelas.
