  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: id
  text: Pada saat itu juga, mereka bangkit lalu kembali ke Yerusalem dan mendapati Kesebelas serta orang-orang yang bersama mereka sudah berkumpul[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: telah berhimpun. Bentuk partisip Yunani menggambarkan mereka sebagai orang-orang yang sudah berada dalam keadaan berkumpul ketika didapati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: mereka bangkit
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama. “Bangkit” mempertahankan tindakan fisik tanpa mempersempitnya menjadi sekadar berdiri.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: pada saat itu juga
  rationale: Ungkapan ini menunjuk pada waktu yang sama dengan penekanan pada kesegeraan. “Pada saat itu juga” alami dalam bahasa Indonesia dan tidak menghilangkan acuan waktunya seperti “segera”.
- source_word: ὑπέστρεψαν
  choice: kembali
  rationale: Dalam konteks perjalanan, kata kerja ini berarti kembali ke tempat sebelumnya, yaitu Yerusalem.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Mengikuti bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: εὗρον
  choice: mendapati
  rationale: “Mendapati” secara alami menggambarkan bahwa ketika tiba, mereka menemukan orang-orang itu dalam keadaan sudah berkumpul.
- source_word: ἠθροισμένους
  choice: sudah berkumpul
  rationale: 'Partisip perfek pasif menggambarkan keadaan yang telah dihasilkan: kelompok itu sudah berada dalam keadaan berkumpul ketika didapati.'
- source_word: τοὺς ἕνδεκα
  choice: kesebelas murid
  rationale: Dalam bahasa Indonesia, bilangan ini memerlukan acuan nomina agar wajar. “Murid” menyatakan identitas kelompok yang tersirat dalam sebutan Yunani tanpa menggantinya dengan istilah yang lebih khusus seperti “rasul”.
- source_word: τοὺς σὺν αὐτοῖς
  choice: orang-orang yang bersama mereka
  rationale: Terjemahan ini mempertahankan acuan umum kepada orang lain yang hadir bersama kesebelas murid tanpa menentukan identitas mereka.
theological_decisions:
- issue: Sebutan “kesebelas murid” meskipun jumlah orang yang hadir pada saat itu mungkin tidak tepat sebelas
  choice: Mempertahankan “kesebelas murid” sebagai sebutan kelompok
  alternative: para murid yang masih tersisa
  rationale: Teks Yunani memakai sebutan konvensional τοὺς ἕνδεκα. Terjemahan tidak menyelaraskan jumlah kehadiran atau menjelaskan keanggotaan kelompok melampaui yang dinyatakan Lukas.
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Ayat dibagi menjadi dua kalimat agar struktur panjang Yunani terbaca alami dalam bahasa Indonesia. “Pada saat itu juga” mempertahankan penekanan temporal, sedangkan “sudah berkumpul” memperjelas keadaan yang telah berlangsung tanpa menambahkan penjelasan teologis.
