  source_fidelity: 'Terjemahan ini dengan tepat menyampaikan urutan tindakan: mereka bangkit, kembali ke Yerusalem, lalu mendapati suatu kelompok yang telah berada dalam keadaan berkumpul. “Pada saat itu juga,” “kembali,” “mendapati,” dan “sudah berkumpul” merepresentasikan unsur-unsur Yunani dengan baik. Namun, τοὺς ἕνδεκα adalah sebutan kelompok yang dipakai teks, bukan nomina “murid” yang dinyatakan secara eksplisit. Sebutan itu sebaiknya dipertahankan sebagai gelar kolektif “Kesebelas,” tanpa penambahan identitas.'
