  terminology: “Yerusalem” sudah baku. “Kesebelas” dipertahankan sebagai sebutan konvensional bagi kelompok itu, tanpa menggantinya dengan “murid” atau “rasul”; hal ini menghindari penambahan spesifikasi yang tidak diucapkan dalam ayat. “Sudah berkumpul” dengan tepat menyatakan keadaan hasil dari partisip perfek pasif ἠθροισμένους.
