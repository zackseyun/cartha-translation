reference: Luke 24:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: id
  text: 'Lalu Ia berkata kepada mereka, “Inilah perkataan-Ku yang telah Kusampaikan kepada kalian ketika Aku masih bersama kalian: segala sesuatu yang tertulis[a] tentang Aku[c] dalam Taurat Musa, kitab para nabi, dan Mazmur[b] harus digenapi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua hal yang tertulis.”
    reason: lexical_alternative
  - marker: b
    text: “Taurat Musa, kitab para nabi, dan Mazmur” kemungkinan menunjuk pada pembagian utama Kitab Suci Israel. “Mazmur” dapat menunjuk secara khusus pada Kitab Mazmur atau, secara lebih luas, pada kelompok Tulisan.
    reason: cultural_note
  - marker: c
    text: Atau “mengenai Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Lalu Ia berkata kepada mereka
  rationale: δέ merupakan penghubung naratif ringan; “lalu” mengalir alami tanpa memberi kesan pertentangan yang kuat. πρός dengan verba berbicara diterjemahkan secara wajar sebagai “kepada”.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Inilah perkataan-perkataan-Ku
  rationale: Bentuk demonstratif dengan artikel menunjuk pada perkataan yang sedang dijelaskan. Bentuk jamak “perkataan-perkataan” mempertahankan λόγοι dan sesuai dengan ragam Indonesia yang bermartabat.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: yang telah Kusampaikan kepada kalian
  rationale: λαλέω berarti berbicara atau menyampaikan perkataan. “Kusampaikan” alami dalam bahasa Indonesia dan kala lampau dijelaskan oleh “telah”; “kalian” membedakan ὑμᾶς yang jamak.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: ketika Aku masih bersama kalian
  rationale: Partisipium dipahami secara temporal; “masih” mewakili ἔτι dan mempertahankan kontras tersirat dengan keadaan sesudah kebangkitan.
- source_word: δεῖ πληρωθῆναι
  choice: harus digenapi
  rationale: δεῖ menyatakan keharusan, sedangkan bentuk pasif πληρωθῆναι dipertahankan. Ungkapan ini lazim dan tepat bagi penggenapan Kitab Suci tanpa menjelaskan mekanismenya.
- source_word: πάντα τὰ γεγραμμένα
  choice: segala sesuatu yang tertulis
  rationale: Mewakili daya cakup πάντα dan konstruksi partisipium pasif secara alami. Catatan kaki mencantumkan alternatif yang lebih dekat pada bentuk jamak Yunani.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: dalam Taurat Musa, Kitab Para Nabi, dan Mazmur
  rationale: Nama-nama ini diperlakukan sebagai kelompok Kitab Suci. “Taurat Musa” transparan bagi νόμος Μωϋσέως; “Kitab Para Nabi” memperjelas bahwa προφήταις menunjuk pada tulisan, bukan sekadar orang; “Mazmur” mempertahankan kemungkinan rujukan khusus maupun lebih luas.
- source_word: περὶ ἐμοῦ
  choice: tentang Aku
  rationale: περί dengan genitif menyatakan pokok atau rujukan. “Tentang Aku” merupakan padanan modern yang langsung; alternatif lebih formal dicatat.
theological_decisions:
- issue: Daya keharusan dalam δεῖ πληρωθῆναι
  choice: harus digenapi
  alternative: akan digenapi; harus menjadi kenyataan
  rationale: Terjemahan ini mempertahankan klaim teks tentang keharusan ilahi tanpa menambahkan teori mengenai cara nubuat atau Kitab Suci digenapi.
- issue: Identitas Taurat Musa, Para Nabi, dan Mazmur
  choice: Memperlakukan ketiganya sebagai nama kelompok Kitab Suci, dengan penjelasan terbatas dalam catatan kaki
  alternative: Memahami “Mazmur” hanya sebagai kitab Mazmur, atau secara pasti sebagai sebutan bagi seluruh kelompok Tulisan
  rationale: Susunan ini kemungkinan menunjuk pada pembagian utama Kitab Suci Israel, tetapi cakupan tepat ψαλμοῖς tidak sepenuhnya pasti; ambiguitas itu dipertahankan.
- issue: Hubungan περὶ ἐμοῦ dengan tulisan-tulisan Kitab Suci
  choice: tentang Aku
  alternative: mengenai Aku
  rationale: Teks menghubungkan tulisan-tulisan tersebut dengan Yesus, tetapi ayat ini tidak merinci bentuk, jumlah, atau metode hubungan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia. “Kalian” digunakan untuk menandai bentuk jamak ὑμᾶς secara jelas. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
