  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: id
  text: Kamulah saksi atas hal-hal ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kamulah saksi tentang hal-hal ini.” Kata penunjuk dalam bahasa Yunani merujuk kepada hal-hal atau peristiwa yang baru saja Yesus bicarakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kamulah
  rationale: Pronomina orang kedua jamak ini dinyatakan secara eksplisit dan bersifat menegaskan. Akhiran -lah menyampaikan penekanan itu secara alami dalam bahasa Indonesia; dalam konteks, 'kamu' menunjuk kepada para murid sebagai kelompok.
- source_word: ἐστε
  choice: '[tercakup dalam konstruksi predikatif ''Kamulah'']'
  rationale: Kopula kala kini bahasa Yunani tidak perlu diterjemahkan dengan kata tersendiri dalam kalimat nominal bahasa Indonesia. Konstruksi 'Kamulah saksi-saksi' secara alami menyampaikan makna 'kamu adalah'.
- source_word: μάρτυρες
  choice: saksi-saksi
  rationale: Kata ini menunjuk kepada orang-orang yang memberikan kesaksian tentang apa yang mereka lihat dan dengar. Bentuk ulang menyatakan jamak dengan jelas dan tidak memasukkan pengertian teknis kemudian tentang kemartiran.
- source_word: τούτων
  choice: tentang semuanya itu
  rationale: Demonstrativa genitif jamak ini merujuk kembali kepada seluruh peristiwa dan hal yang baru saja Yesus bicarakan. 'Tentang semuanya itu' alami dalam bahasa Indonesia dan mempertahankan hubungan kesaksian dengan hal-hal tersebut.
theological_decisions:
- issue: Makna peran para murid sebagai μάρτυρες
  choice: Ayat ini menyatakan bahwa para murid adalah saksi yang memberi kesaksian tentang semua peristiwa yang baru disebutkan.
  alternative: Istilah ini dapat dibaca dengan gema makna Kristen yang kemudian, yaitu martir.
  rationale: Dalam konteks langsung, yang dimaksud ialah kesaksian mengenai penderitaan dan kebangkitan Mesias serta pemberitaan pertobatan untuk pengampunan dosa. Terjemahan tidak memasukkan perkembangan makna kemudian tentang kemartiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kamulah' mempertahankan penekanan pada ὑμεῖς, sedangkan kopula Yunani diungkapkan secara alami melalui kalimat nominal. Bentuk 'saksi-saksi' memperjelas bahwa subjeknya jamak.
