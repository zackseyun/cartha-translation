  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: id
  text: Mereka mendapati batu itu sudah terguling dari makam,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: mendapati
  rationale: Bentuk aoristus aktif indikatif orang ketiga jamak ini menyatakan bahwa para perempuan menemukan keadaan yang ada ketika tiba. “Mendapati” alami dalam narasi Indonesia dan cocok dengan pelengkap yang menggambarkan keadaan batu.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan. Dalam bahasa Indonesia modern, kesinambungan dengan ayat sebelumnya sudah jelas tanpa kata penghubung; menambahkan “dan” tidak diperlukan.
- source_word: τὸν λίθον
  choice: batu itu
  rationale: Dalam konteks pemakaman, λίθος menunjuk pada batu tertentu yang menutup makam. Kata “itu” menandai bahwa batu tersebut sudah dikenal dari konteks.
- source_word: ἀποκεκυλισμένον
  choice: sudah terguling
  rationale: 'Partisipel perfek pasif menggambarkan keadaan hasil: batu itu telah digulingkan dan berada dalam keadaan tersingkir. “Sudah terguling” mempertahankan keadaan hasil serta menyiratkan tindakan pasif tanpa ungkapan yang kaku.'
- source_word: ἀπὸ τοῦ μνημείου
  choice: dari makam
  rationale: μνημεῖον dalam kisah penguburan berarti makam, sedangkan ἀπό menyatakan bahwa batu itu telah bergeser menjauh darinya.
theological_decisions:
- issue: Subjek jamak tersirat dalam klausa Yunani
  choice: Mereka mendapati
  alternative: Para perempuan mendapati
  rationale: Kata kerja Yunani merujuk kembali kepada para perempuan pada ayat sebelumnya. “Mereka” membuat kalimat Indonesia lengkap tanpa mengulang informasi atau menambahkan penafsiran teologis.
- issue: Keadaan hasil dalam bentuk perfek pasif
  choice: sudah terguling
  alternative: telah digulingkan
  rationale: Pilihan utama mempertahankan fokus teks pada keadaan batu ketika ditemukan, tanpa menentukan siapa yang menggulingkannya. Alternatif lebih menonjolkan tindakan oleh pelaku yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan naratif. “Makam” dipilih daripada “kubur” untuk ungkapan yang alami dan bermartabat. Tanda koma dipertahankan karena ayat ini berlanjut ke kalimat berikutnya.
