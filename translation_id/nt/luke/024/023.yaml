    rationale: Partisip aoris negatif μὴ εὑροῦσαι terutama menyatakan keadaan atau waktu yang mendahului tindakan utama; teks tidak secara eksplisit menyatakan bahwa kegagalan menemukan tubuh itu adalah sebab mereka datang.
  - severity: low
