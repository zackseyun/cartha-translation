  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: id
  text: dan ketika mereka tidak menemukan tubuh-Nya, mereka datang dan berkata bahwa mereka juga telah melihat suatu penglihatan akan malaikat-malaikat, yang mengatakan bahwa Dia hidup.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, yang kurang mungkin, “mereka datang dan berkata bahwa mereka telah melihat suatu penglihatan akan malaikat-malaikat dan bahwa mereka sendiri mengatakan bahwa Dia hidup,” jika “yang mengatakan” dipahami mengacu kepada para perempuan, bukan kepada malaikat-malaikat.
    reason: alternative_reading
  - marker: b
    text: Atau, “bahkan telah melihat.”
    reason: translation_alternative
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: karena tidak menemukan
  rationale: Partisip aoris aktif feminin jamak ini menerangkan para perempuan. Hubungan dengan tindakan utama dinyatakan secara wajar sebagai keadaan penyebab, tanpa menghilangkan negasi μή.
- source_word: τὸ σῶμα αὐτοῦ
  choice: jenazah-Nya
  rationale: Dalam konteks makam, σῶμα menunjuk pada tubuh Yesus yang telah dikuburkan; 'jenazah' merupakan ungkapan Indonesia yang alami untuk tubuh orang yang dianggap telah meninggal.
- source_word: ἦλθον λέγουσαι
  choice: mereka datang dan berkata
  rationale: ἦλθον dipertahankan sebagai 'datang', bukan diperjelas menjadi 'kembali'. Partisip λέγουσαι dialihkan menjadi verba koordinatif agar alami dalam bahasa Indonesia.
- source_word: καὶ ὀπτασίαν
  choice: juga ... suatu penglihatan
  rationale: καί menambahkan laporan luar biasa tentang penglihatan kepada laporan bahwa jenazah tidak ditemukan. 'Juga' mempertahankan fungsi aditifnya tanpa memaksakan penekanan berlebih.
- source_word: ὀπτασίαν ἀγγέλων
  choice: suatu penglihatan tentang malaikat-malaikat
  rationale: ὀπτασία menyatakan penglihatan atau penampakan luar biasa. 'Tentang' mempertahankan keluwesan relasi genitif ἀγγέλων, yakni malaikat sebagai isi atau sosok yang tampak dalam penglihatan.
- source_word: ἑωρακέναι
  choice: telah melihat
  rationale: Infinitif perfek dalam wacana tidak langsung dinyatakan dengan 'telah melihat', sehingga tindakan melihat mendahului laporan mereka.
- source_word: οἳ λέγουσιν
  choice: yang mengatakan
  rationale: Pronomina relatif maskulin jamak paling wajar mengacu kepada ἀγγέλων. Bentuk kini λέγουσιν diterjemahkan secara netral dengan 'mengatakan'.
- source_word: αὐτὸν ζῆν
  choice: bahwa Dia hidup
  rationale: Konstruksi infinitif dialihkan menjadi klausa Indonesia yang alami. 'Hidup' mempertahankan pernyataan teks tanpa menambahkan rumusan teologis lain.
theological_decisions:
- issue: Acuan pronomina relatif οἳ dalam οἳ λέγουσιν
  choice: 'Dipahami mengacu kepada malaikat-malaikat: ''yang mengatakan bahwa Dia hidup''.'
  alternative: 'Secara kurang mungkin, dapat dipahami mengacu kepada para perempuan: mereka datang dengan mengatakan bahwa mereka melihat penglihatan tentang malaikat dan bahwa mereka mengatakan Dia hidup.'
  rationale: ἀγγέλων adalah anteseden maskulin jamak yang terdekat dan paling alami secara sintaksis. Alternatif tetap dicatat karena struktur wacana tidak langsung memungkinkan pembacaan lain, meskipun kurang kuat.
- issue: Daya καί sebelum ὀπτασίαν
  choice: juga
  alternative: bahkan
  rationale: '''Juga'' menyampaikan penambahan laporan mengenai penglihatan; ''bahkan'' mungkin menangkap daya menaikkan atau menegaskan, tetapi dapat memberi penekanan yang lebih kuat daripada yang pasti dituntut teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Jenazah-Nya' dipilih karena konteks makam, sedangkan 'datang' mempertahankan bentuk Yunani tanpa menambahkan gagasan 'kembali'. Penanda catatan ditempatkan setelah kalimat agar keduanya tetap hadir dalam teks utama tanpa memutus alur klausa.
