  source_fidelity: Revisi diperlukan karena “karena” menjadikan partisip μὴ εὑροῦσαι sebagai sebab, sedangkan bentuk Yunani lebih netral dan paling baik diterjemahkan secara temporal/sirkumstansial. “Tubuh-Nya” juga lebih langsung mencerminkan τὸ σῶμα αὐτοῦ daripada “jenazah-Nya,” yang menambahkan nuansa ‘mayat’.
  naturalness: 'Teks revisi memakai susunan Indonesia baku yang lancar: “ketika mereka tidak menemukan ... mereka datang dan berkata.” “Penglihatan tentang malaikat-malaikat” tetap dapat dipahami, tetapi “penglihatan akan malaikat-malaikat” lebih jelas menyatakan bahwa para malaikat itulah yang dilihat.'
  terminology: “Tubuh-Nya” mempertahankan istilah umum σῶμα dalam konteks naratif ini. “Malaikat-malaikat” dan “Dia hidup” dipertahankan. Klausa relatif tetap terutama merujuk kepada malaikat, tanpa menghilangkan alternatif sintaktis melalui catatan kaki.
