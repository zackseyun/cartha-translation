  - severity: low
    issue: Frasa “penglihatan tentang malaikat-malaikat” dapat terdengar sebagai penglihatan yang membahas malaikat.
    rationale: Genitif ἀγγέλων paling wajar menyatakan para malaikat sebagai sosok yang tampak. “Penglihatan akan malaikat-malaikat” lebih jelas dalam bahasa Indonesia tanpa menambah makna.
