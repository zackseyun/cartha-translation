  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: id
  text: Dan lihatlah, pada hari itu juga, dua orang dari antara mereka sedang dalam perjalanan menuju sebuah desa yang berjarak enam puluh stadia[a] dari Yerusalem, yang bernama Emaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Stadion adalah satuan jarak pada zaman kuno; enam puluh stadia kira-kira sama dengan 11 kilometer.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Dan lihatlah
  rationale: Mempertahankan penanda naratif yang mengarahkan perhatian pembaca tanpa menghilangkan daya ungkap teks Yunani.
- source_word: δύο ἐξ αὐτῶν
  choice: dua orang dari antara mereka
  rationale: Menyatakan hubungan partitif dengan kelompok yang disebut sebelumnya tanpa mempersempit identitas mereka melebihi teks sumber.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: pada hari itu juga
  rationale: Menangkap penekanan pada hari yang sama dengan peristiwa-peristiwa sebelumnya.
- source_word: ἦσαν πορευόμενοι
  choice: sedang berjalan menuju
  rationale: Mencerminkan tindakan yang sedang berlangsung dalam konstruksi imperfek perifrastik; konteks perjalanan darat mendukung kata 'berjalan'.
- source_word: εἰς κώμην
  choice: menuju sebuah desa
  rationale: κώμη secara khusus menunjuk pada desa, dan 'menuju' menyampaikan arah gerak secara alami.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: yang berjarak enam puluh stadia dari Yerusalem
  rationale: Mempertahankan satuan jarak kuno dalam teks utama demi kedekatan dengan dunia sumber, disertai padanan modern dalam catatan kaki.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: yang bernama Emaus
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan keterangan eksplisit mengenai nama desa tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Bentuk 'lihatlah' dipertahankan untuk membawa daya penarik perhatian dari ἰδοὺ, sedangkan satuan kuno dijelaskan melalui catatan kaki.
