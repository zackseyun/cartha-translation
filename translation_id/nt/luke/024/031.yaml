  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: id
  text: Lalu mata mereka terbuka dan mereka mengenali dia; dan dia menjadi tidak terlihat[a] oleh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dia lenyap dari hadapan mereka” atau “dia menghilang dari pandangan mereka.”
    reason: Alternatif leksikal untuk ἄφαντος ἐγένετο ἀπ’ αὐτῶν yang menyampaikan hasil peristiwa dengan bahasa Indonesia yang lebih idiomatis.
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: terbuka
  rationale: Bentuk aoris pasif dari διανοίγω. Ungkapan “mata mereka terbuka” alami dalam bahasa Indonesia dan mempertahankan kesan bahwa kemampuan mereka untuk memahami atau mengenali dimungkinkan, bukan semata-mata timbul dari diri sendiri.
- source_word: οἱ ὀφθαλμοὶ
  choice: mata mereka
  rationale: Susunan ini mengungkapkan subjek Yunani “mata” beserta pronomina posesifnya secara wajar dalam bahasa Indonesia.
- source_word: ἐπέγνωσαν
  choice: mengenali
  rationale: Dalam konteks perjalanan ke Emaus, ἐπιγινώσκω menunjuk pada tindakan mengenali seseorang yang sebelumnya belum diketahui identitasnya; “mengenali” lebih tepat daripada sekadar “mengetahui”.
- source_word: ἄφαντος
  choice: tidak terlihat
  rationale: ἄφαντος berarti tidak tampak atau tidak terlihat. Pilihan ini mempertahankan peristiwa yang diceritakan tanpa menentukan bagaimana tepatnya dia tidak lagi terlihat.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: menjadi tidak terlihat oleh mereka
  rationale: Terjemahan ini mempertahankan unsur perubahan dalam ἐγένετο dan hubungan dengan para murid dalam ἀπ’ αὐτῶν, sambil tetap alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai perkembangan berikutnya dalam alur cerita; “Lalu” menyampaikan peralihan naratif itu secara alami.
theological_decisions:
- issue: Sifat hilangnya Yesus dari penglihatan kedua murid
  choice: dia menjadi tidak terlihat oleh mereka
  alternative: dia lenyap dari hadapan mereka; dia menghilang dari pandangan mereka
  rationale: Ungkapan Yunani ἄφαντος ἐγένετο secara langsung menyatakan bahwa dia menjadi tidak terlihat. Terjemahan utama tidak menetapkan mekanisme kejadian itu dan dengan demikian mempertahankan ketegangan serta misteri naratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pronomina “dia” ditulis dengan huruf kecil sesuai teks sumber dan kaidah umum, tanpa menambahkan penandaan teologis yang tidak terdapat dalam bahasa Yunani. Tanda titik koma mempertahankan kaitan erat sekaligus membedakan pengenalan para murid dari keadaan Yesus sesudahnya.
