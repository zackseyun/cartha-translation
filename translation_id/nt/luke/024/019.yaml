  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Perkara-perkara apa?” Mereka menjawab-Nya, “Perkara-perkara tentang Yesus orang Nazaret,[a] yang adalah seorang pria, seorang nabi yang berkuasa dalam perbuatan dan perkataan di hadapan Allah dan seluruh rakyat,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus dari Nazaret”; secara harfiah, “Yesus, orang Nazaret itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Tentang apa?
  rationale: Bentuk Yunani ini secara harfiah menanyakan ‘hal-hal apa’, tetapi dalam dialog bahasa Indonesia pertanyaan “Tentang apa?” secara alami merujuk pada perkara-perkara yang baru disebut tanpa menghilangkan maksud jamaknya.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Tentang Yesus
  rationale: Frasa berartikel dengan περί menunjuk pada perkara-perkara mengenai Yesus. Dalam jawaban langsung, bahasa Indonesia cukup memakai “Tentang Yesus” tanpa menambahkan kata ‘peristiwa’ yang tidak dinyatakan secara eksplisit.
- source_word: Ναζαρηνοῦ
  choice: orang Nazaret
  rationale: Sebutan asal ini merupakan padanan Indonesia yang alami bagi Ναζαρηνός dan tetap mengaitkan Yesus dengan Nazaret. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἐγένετο ἀνὴρ προφήτης
  choice: yang adalah seorang nabi
  rationale: Dalam konteks ini ἐγένετο berfungsi idiomatis untuk menyatakan keberadaan atau tampilnya seseorang, sedangkan ἀνὴρ προφήτης membentuk keterangan bahwa ia seorang nabi. Terjemahan utama menghindari kesan keliru bahwa Yesus baru berubah menjadi manusia; bentuk Yunani yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: yang berkuasa dalam perbuatan dan perkataan
  rationale: “Berkuasa” menyampaikan kekuatan atau kemampuan yang nyata, sedangkan pasangan “perbuatan dan perkataan” mempertahankan susunan dan register luhur teks sumber.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: di hadapan Allah dan seluruh rakyat
  rationale: ἐναντίον di sini berarti dalam pandangan atau kehadiran. “Seluruh rakyat” mempertahankan sifat kolektif παντὸς τοῦ λαοῦ, bukan sekadar sejumlah orang.
theological_decisions:
- issue: Makna ἐγένετο ἀνὴρ προφήτης dalam gambaran tentang Yesus
  choice: yang adalah seorang nabi
  alternative: yang menjadi seorang laki-laki, seorang nabi; yang tampil sebagai seorang nabi
  rationale: Terjemahan utama memperlakukan ungkapan itu secara idiomatis dan tidak menyiratkan bahwa pada suatu saat Yesus berubah menjadi manusia. Catatan kaki tetap memperlihatkan bentuk Yunani yang lebih harfiah, termasuk adanya kata ἀνήρ, sehingga ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Dialog dibuat ringkas, sedangkan pasangan “perbuatan dan perkataan” serta ungkapan “di hadapan Allah” mempertahankan nuansa luhur teks. Tanda koma penutup dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
