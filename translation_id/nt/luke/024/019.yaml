revisions:
- from: Lalu Ia berkata kepada mereka, “Tentang apa?” Mereka menjawab-Nya, “Tentang Yesus orang Nazaret,[a] yang adalah seorang nabi[b] yang berkuasa dalam perbuatan dan perkataan di hadapan Allah dan seluruh rakyat,”
  to: Lalu Ia berkata kepada mereka, “Perkara-perkara apa?” Mereka menjawab-Nya, “Perkara-perkara tentang Yesus orang Nazaret,[a] yang adalah seorang pria, seorang nabi yang berkuasa dalam perbuatan dan perkataan di hadapan Allah dan seluruh rakyat,”
  rationale: Revisi mempertahankan bentuk jamak pertanyaan dan frasa “perkara-perkara tentang Yesus,” serta secara eksplisit menerjemahkan ἀνήρ dan προφήτης sebagai aposisi (“seorang pria, seorang nabi”). Kata “adalah” mencerminkan penggunaan ἐγένετο yang idiomatis dalam konteks ini tanpa memaksakan arti bahwa Yesus baru kemudian menjadi manusia. Catatan kaki b dihapus karena setelah unsur-unsur sumber diterjemahkan dalam teks utama, catatan itu tidak lagi diperlukan; catatan kaki a diperbaiki agar benar-benar menyediakan alternatif leksikal.
