  source_fidelity: 'Makna pokok tersampaikan: teguran itu mencakup kurangnya pengertian dan kelambanan batin untuk percaya kepada seluruh kesaksian para nabi. Namun, bentuk pasif “telah dikatakan oleh para nabi” kurang langsung dibandingkan verba aktif ἐλάλησαν (“para nabi telah berbicara/menyampaikan”), dan idiom “lamban hati” patut diberi penjelasan singkat agar tidak dipahami secara fisik.'
  naturalness: “Betapa lambannya hati kalian untuk memercayai” dapat dipahami, tetapi “lamban hati untuk percaya” lebih ringkas dan lebih alami sebagai teguran bernada kitab suci dalam bahasa Indonesia modern. “Dan” lebih dekat dengan καί daripada “Lalu,” tanpa mengubah alur narasi.
  terminology: “Hai,” “tidak mengerti,” “hati,” “percaya,” dan “para nabi” sesuai dengan register modern yang bermartabat serta mempertahankan cakupan pengertian dan kepercayaan. Catatan untuk “lamban hati” diperlukan untuk menjelaskan idiom tanpa menafsirkan secara doktrinal.
