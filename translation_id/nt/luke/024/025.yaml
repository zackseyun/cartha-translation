  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: id
  text: Dan Ia berkata kepada mereka, “Hai orang-orang yang tidak mengerti,[a] betapa lamban hati kalian[b] untuk percaya kepada segala sesuatu yang telah disampaikan para nabi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak berpengertian” atau “bodoh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “lamban hati”; sebuah ungkapan tentang kelambanan batin untuk percaya dan menerima apa yang telah disampaikan Allah.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: Lalu Ia berkata kepada mereka
  rationale: Dalam alur narasi, καί secara alami diterjemahkan “Lalu”; αὐτός tidak perlu diberi penekanan khusus dalam bahasa Indonesia.
- source_word: Ὦ
  choice: Hai
  rationale: Mempertahankan daya sapaan langsung dan nada teguran tanpa terdengar usang atau berlebihan dalam bahasa Indonesia modern.
- source_word: ἀνόητοι
  choice: orang-orang yang tidak mengerti
  rationale: Menunjukkan kurangnya pemahaman, bukan semata-mata keburukan moral; bentuk jamak sapaan tetap jelas.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: betapa lambannya hati kalian
  rationale: Mempertahankan ungkapan καρδία sebagai pusat batin manusia, sekaligus menghasilkan teguran yang alami dalam bahasa Indonesia.
- source_word: τοῦ πιστεύειν
  choice: untuk memercayai
  rationale: Infinitif ini menerangkan dalam hal apa hati mereka lamban; “memercayai” mencakup penerimaan penuh terhadap kesaksian para nabi.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: segala sesuatu yang
  rationale: Mempertahankan cakupan menyeluruh dari πᾶσιν secara idiomatis.
- source_word: ἐλάλησαν
  choice: telah dikatakan
  rationale: Bentuk pasif Indonesia terasa alami bersama “segala sesuatu,” sementara aspek “telah” menyatakan kesaksian kenabian yang sudah disampaikan dan tetap relevan.
- source_word: οἱ προφῆται
  choice: para nabi
  rationale: Padanan baku dan tepat untuk kelompok nabi yang kesaksiannya menjadi pokok teguran.
theological_decisions:
- issue: Sifat teguran Yesus
  choice: Teguran menyasar kurangnya pemahaman sekaligus kelambanan batin untuk percaya kepada seluruh kesaksian para nabi.
  alternative: Teguran yang semata-mata berupa kecaman moral atau hanya menunjuk kekurangan intelektual.
  rationale: Gabungan ἀνόητοι, βραδεῖς τῇ καρδίᾳ, dan πιστεύειν melibatkan pengertian serta kepercayaan. Terjemahan mempertahankan “hati” dan “memercayai” agar ketegangan itu tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “Hai” mempertahankan kekuatan vokatif; “kalian” memperjelas bahwa teguran ditujukan kepada lebih dari satu orang tanpa memakai bentuk yang kaku.
