    rationale: ἐλάλησαν secara langsung menyatakan bahwa para nabi berbicara. Konstruksi pasif dengan “oleh para nabi” tetap dapat dimengerti, tetapi “telah disampaikan para nabi” lebih dekat dan lebih lancar.
  - severity: low
    issue: Idiom “lambannya hati” belum memiliki catatan penjelas.
    rationale: τῇ καρδίᾳ menunjuk batin atau diri terdalam, bukan organ fisik; catatan singkat membantu pembaca mempertahankan daya idiomnya.
