  rationale: Revisi mempertahankan sapaan dan teguran langsung, memperjelas bahwa para nabi adalah pelaku penyampaian pesan, serta menambahkan catatan bagi idiom “lamban hati.” “Dan” dipilih untuk mencerminkan καί secara lebih langsung, sementara “percaya kepada” secara idiomatis menyatakan objek kepercayaan yang mencakup seluruh kesaksian para nabi.
