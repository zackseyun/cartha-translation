  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: id
  text: Ia tidak ada di sini, tetapi telah dibangkitkan.[a] Ingatlah bagaimana Ia berbicara kepada kalian ketika Ia masih di Galilea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah bangkit.” Kata kerja Yunani berbentuk pasif (“telah dibangkitkan”), meskipun peristiwa kebangkitan juga lazim diungkapkan dengan bentuk “telah bangkit.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ia tidak ada di sini
  rationale: Bahasa Yunani tidak menyebutkan subjek secara eksplisit, tetapi konteks jelas merujuk kepada Yesus. “Ia tidak ada di sini” merupakan ungkapan lokatif yang alami dan jelas dalam bahasa Indonesia.
- source_word: ἀλλὰ
  choice: tetapi
  rationale: Konjungsi ini menyatakan pertentangan langsung antara ketidakberadaan Yesus di makam dan kenyataan bahwa Ia telah dibangkitkan.
- source_word: ἠγέρθη
  choice: telah dibangkitkan
  rationale: Bentuk pasif aoristus dari ἐγείρω dipertahankan untuk mencerminkan bentuk sumber dan menyiratkan tindakan Allah tanpa menjadikannya lebih eksplisit daripada teks Yunani.
- source_word: μνήσθητε
  choice: Ingatlah
  rationale: Imperatif ini paling alami diterjemahkan sebagai seruan langsung untuk mengingat kembali perkataan Yesus.
- source_word: ὡς
  choice: bagaimana
  rationale: Dalam konteks ini, ὡς memperkenalkan perkataan yang harus mereka ingat; “bagaimana” mempertahankan bentuk ungkapannya tanpa mengganti langsung dengan “apa yang”.
- source_word: ἐλάλησεν ὑμῖν
  choice: Ia berbicara kepada kalian
  rationale: Terjemahan ini mempertahankan tindakan berbicara dan memakai “kalian” untuk menandai dengan jelas bahwa ὑμῖν berbentuk jamak.
- source_word: ἔτι ὢν
  choice: ketika Ia masih berada
  rationale: Frasa partisipial diterjemahkan sebagai anak kalimat waktu yang alami, sedangkan ἔτι dipertahankan melalui kata “masih”.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: di Galilea
  rationale: Terjemahan lokatif langsung dan nama tempat baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan kata kerja kebangkitan ἠγέρθη
  choice: telah dibangkitkan
  alternative: telah bangkit
  rationale: Bentuk pasif dalam teks Yunani dipertahankan agar nuansa tindakan ilahi tetap tersirat dan ketegangan bentuk sumber tidak diselesaikan secara diam-diam. Bentuk “telah bangkit” dicantumkan sebagai alternatif yang alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Kalian” dipilih untuk menyampaikan bentuk jamak ὑμῖν secara jelas. Huruf kapital pada “Ia” mengikuti kebiasaan umum teks Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
