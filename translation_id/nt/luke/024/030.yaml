revisions:
- from: Ketika Ia duduk makan bersama mereka,[a] Ia mengambil roti itu, mengucapkan berkat atasnya, lalu memecah-mecahkannya dan mulai memberikannya kepada mereka.[b]
  to: Ketika Ia duduk makan bersama mereka,[a] Ia mengambil roti itu, mengucapkan berkat atas roti itu, lalu memecahkan roti itu dan mulai membagikannya kepada mereka.[b]
  rationale: Revisi hanya memperjelas objek roti dan mengganti bentuk reduplikatif “memecah-mecahkannya” dengan “memecahkan roti itu,” agar tidak menambahkan nuansa tindakan berulang. Catatan kaki diperbarui agar sejalan dengan verba utama yang direvisi. Ambiguitas aspek imperfek tetap tersedia dalam catatan kaki.
