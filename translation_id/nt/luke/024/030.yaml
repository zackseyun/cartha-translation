    rationale: κλάσας adalah partisip aoris yang menyatakan tindakan memecahkan roti sebelum tindakan memberi/membagikan; teks tidak secara eksplisit menandai tindakan berulang. “Memecahkan roti itu” menyampaikan tindakan tersebut tanpa nuansa tambahan.
  - severity: low
    issue: Rujukan “-nya” dalam “mulai memberikannya” kurang eksplisit.
    rationale: Walaupun konteksnya jelas merujuk kepada roti, “mulai membagikan roti itu” lebih idiomatis dan jelas dalam bahasa Indonesia, serta sesuai dengan tindakan distribusi yang diungkapkan ἐπεδίδου.
