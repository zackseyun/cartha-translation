id: LUK.24.30
reference: Luke 24:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: id
  text: Ketika Ia duduk makan bersama mereka,[a] Ia mengambil roti itu, mengucapkan berkat atas roti itu, lalu memecahkan roti itu dan mulai membagikannya kepada mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersandar untuk makan bersama mereka,” sesuai dengan kebiasaan makan pada zaman itu.
    reason: cultural_note
  - marker: b
    text: Atau, “sedang membagikannya kepada mereka.” Bentuk verba Yunani dapat menekankan tindakan yang sedang berlangsung; “mulai membagikannya” menampilkan awal tindakan itu dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ketika
  rationale: Formula naratif καὶ ἐγένετο bersama konstruksi temporal berikutnya dialihkan secara alami menjadi klausa waktu dalam bahasa Indonesia; makna transisinya terpelihara tanpa ungkapan kaku seperti 'terjadilah bahwa'.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: ketika Ia duduk makan bersama mereka
  rationale: Konstruksi infinitif artikular dengan ἐν bersifat temporal. κατακλίνω dalam konteks jamuan secara khusus menggambarkan berbaring bersandar untuk makan; 'duduk makan' menjadi padanan Indonesia yang alami, sedangkan rincian budaya dipertahankan dalam catatan kaki.
- source_word: λαβὼν τὸν ἄρτον
  choice: Ia mengambil roti itu
  rationale: Partisip aoris diungkapkan sebagai verba berurutan yang alami. Artikel menunjuk pada roti yang tersedia dalam perjamuan itu.
- source_word: εὐλόγησεν
  choice: mengucapkan berkat atasnya
  rationale: Dalam konteks makan, εὐλογέω menunjuk pada pengucapan berkat atas roti. Pilihan ini lebih jelas daripada 'memberkatinya' dan tidak menggantinya dengan verba 'mengucap syukur'.
- source_word: κλάσας
  choice: lalu memecah-mecahkannya
  rationale: Partisip aoris menandai tindakan yang mendahului pembagian. Reduplikasi 'memecah-mecahkan' secara idiomatis menggambarkan roti yang dipecah menjadi bagian-bagian untuk dibagikan.
- source_word: ἐπεδίδου
  choice: mulai memberikannya kepada mereka
  rationale: Imperfek dapat menampilkan tindakan yang sedang berlangsung atau bersifat inkoatif. 'Mulai memberikan' cocok dengan awal pembagian dalam alur cerita, sementara kemungkinan aspek progresif dicatat di kaki halaman.
theological_decisions:
- issue: Kemungkinan gema ekaristis atau sakramental dalam rangkaian tindakan makan
  choice: Memakai bahasa perjamuan biasa tanpa menambahkan tafsir sakramental
  alternative: Merumuskan tindakan tersebut dengan istilah yang secara lebih kuat mengacu pada Perjamuan Tuhan
  rationale: Urutan mengambil, mengucapkan berkat, memecah-mecahkan, dan memberikan dapat menggemakan adegan perjamuan lain, tetapi ayat ini sendiri tidak secara eksplisit menyebut suatu ritus sakramental. Terjemahan mempertahankan rangkaian tindakan tanpa memasukkan ciri doktrinal denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Duduk makan' dipilih agar alami bagi pembaca masa kini, dengan latar kebiasaan bersandar saat makan dijelaskan dalam catatan. Kapitalisasi pronomina 'Ia' mengikuti register Alkitab Indonesia yang lazim.
