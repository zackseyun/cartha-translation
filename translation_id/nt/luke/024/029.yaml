revisions:
- from: Namun, mereka mendesak Dia dengan sungguh-sungguh[a], katanya, “Tinggallah bersama kami, sebab hari sudah menjelang malam dan matahari hampir terbenam[b].” Lalu Dia masuk untuk tinggal bersama mereka.
