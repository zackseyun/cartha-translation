  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: id
  text: Tetapi mereka sangat mendesak Dia[a] dengan berkata, “Tinggallah bersama kami, karena sudah menjelang petang dan hari sudah condong[b].” Dan Dia masuk untuk tinggal bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka menekan Dia” atau “mereka mendesak Dia dengan kuat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hari sudah hampir berlalu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: mendesak Dia dengan sungguh-sungguh
  rationale: Kata kerja bentuk medial ini menyatakan desakan yang kuat dan sungguh-sungguh, bukan paksaan fisik. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan intensitasnya.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Tinggallah bersama kami
  rationale: Imperatif ini merupakan permintaan agar Dia tetap bersama mereka sebagai tamu; “tinggallah” dan “bersama kami” menyampaikan konteks keramahtamahan secara alami.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: sebab hari sudah menjelang malam
  rationale: πρὸς ἑσπέραν menunjukkan bahwa waktu bergerak mendekati malam, bukan bahwa malam telah sepenuhnya tiba.
- source_word: καὶ κέκλικεν ἤδη ἡ ἡμέρα
  choice: dan matahari hampir terbenam
  rationale: Secara harfiah frasa ini menggambarkan hari yang sudah condong. Dalam bahasa Indonesia, “matahari hampir terbenam” menyampaikan berkurangnya siang secara jelas dan idiomatis, tanpa memakai ungkapan kaku “hari telah condong.”
- source_word: εἰσῆλθεν
  choice: Dia masuk
  rationale: Mengungkapkan tindakan memasuki tempat tinggal yang tersirat dalam konteks narasi.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: untuk tinggal bersama mereka
  rationale: Infinitif berartikula menyatakan tujuan atau hasil; pilihan ini juga mempertahankan pengulangan akar μένω dari permintaan sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Dia” mengikuti kebiasaan penghormatan bagi rujukan kepada Yesus. Struktur naratif dipertahankan, sedangkan metafora waktu dialihkan secara idiomatis dan makna harfiahnya dicatat dalam catatan kaki.
