  rationale: Revisi memulihkan metafora sumber tentang hari yang sudah condong, memperbaiki ketidakselarasan subjek jamak pada 'katanya,' dan memakai 'Dan' untuk mencerminkan καὶ. Catatan kaki diperbarui agar menawarkan alternatif leksikal tanpa penambahan kontekstual yang tidak eksplisit.
