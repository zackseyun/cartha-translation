  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: id
  text: 'Lalu Ia berkata kepada mereka, “Demikianlah tertulis: Mesias[a] akan menderita dan bangkit dari antara orang mati pada hari ketiga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Keduanya menerjemahkan gelar Yunani Χριστός, yang berarti Yang Diurapi.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Lalu Ia berkata kepada mereka
  rationale: Καί melanjutkan alur narasi dan secara alami diterjemahkan “Lalu”; bentuk tunggal εἶπεν mengacu kepada Yesus dalam konteks.
- source_word: οὕτως γέγραπται
  choice: Demikianlah tertulis
  rationale: Bentuk perfek pasif γέγραπται merupakan rumusan yang menyatakan apa yang tetap tertulis dalam Kitab Suci; “Demikianlah tertulis” mempertahankan nada pengantar naskah suci dan daya berkelanjutan bentuk perfek.
- source_word: παθεῖν
  choice: akan menderita
  rationale: Infinitif ini menyatakan isi dari apa yang tertulis. “Akan menderita” wajar dalam bahasa Indonesia dan tidak menambahkan modalitas kewajiban secara eksplisit seperti “harus menderita.”
- source_word: τὸν χριστόν
  choice: Mesias
  rationale: Dengan artikel, Χριστός berfungsi jelas sebagai gelar bagi Yang Diurapi. “Mesias” mempertahankan latar Yahudi dan hubungan dengan Kitab Suci.
- source_word: ἀναστῆναι
  choice: bangkit
  rationale: Infinitif aktif aoris ini paling tepat dipertahankan sebagai verba intransitif aktif, bukan diubah menjadi pasif “dibangkitkan.”
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Ungkapan ini secara harfiah menunjuk pada kebangkitan keluar dari antara mereka yang mati. Terjemahan ini alami dalam bahasa Indonesia sekaligus mempertahankan unsur ἐκ.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: pada hari ketiga
  rationale: Datif ini menyatakan waktu; “pada hari ketiga” adalah padanan bahasa Indonesia yang langsung dan alami.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar
  choice: Mesias
  alternative: Kristus
  rationale: Dalam klausa ini kata tersebut memakai artikel dan berfungsi sebagai gelar dalam rangkuman penggenapan Kitab Suci. “Mesias” menampilkan makna gelarnya tanpa menolak bentuk tradisional “Kristus,” yang dicatat sebagai alternatif.
- issue: Bentuk suara verba kebangkitan ἀναστῆναι
  choice: bangkit
  alternative: dibangkitkan
  rationale: Teks Yunani memakai bentuk aktif. Terjemahan utama mempertahankan bentuk itu dan tidak menggantinya dengan bentuk pasif, meskipun bagian-bagian Perjanjian Baru lainnya juga berbicara tentang Yesus yang dibangkitkan.
- issue: Modalitas penderitaan Mesias
  choice: akan menderita
  alternative: harus menderita
  rationale: Infinitif παθεῖν menyatakan isi tulisan, tetapi klausa ini tidak memiliki kata modal yang secara eksplisit berarti “harus.” Pilihan utama menghindari penambahan modalitas sambil tetap menyampaikan nubuat dalam Kitab Suci.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Demikianlah tertulis” mempertahankan corak rumusan Kitab Suci tanpa menjadi usang; pilihan “akan menderita” menjaga kelancaran bahasa sekaligus tidak memasukkan kata “harus” yang tidak dinyatakan secara eksplisit dalam klausa Yunani.
