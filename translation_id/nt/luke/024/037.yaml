  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: id
  text: Namun, mereka terkejut dan menjadi takut; mereka mengira sedang melihat roh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hantu". Kata Yunaninya adalah πνεῦμα, yang secara lebih harfiah berarti "roh".
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: karena terkejut
  rationale: Partisip aoris pasif ini menyatakan keterkejutan mendadak. Bentuk kausal menghasilkan bahasa Indonesia yang alami dalam hubungannya dengan verba utama tanpa melebihkan maknanya menjadi ketakutan yang sudah dinyatakan berikutnya.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai perkembangan yang agak berlawanan dengan penampakan Yesus pada ayat sebelumnya; 'Namun' menyampaikan peralihan tersebut secara wajar.
- source_word: ἔμφοβοι γενόμενοι
  choice: menjadi takut
  rationale: Gabungan adjektiva dengan γενόμενοι menunjukkan masuknya mereka ke dalam keadaan takut; 'menjadi takut' mempertahankan nuansa ingresif itu.
- source_word: ἐδόκουν
  choice: mengira
  rationale: Imperfek δοκέω menunjuk pada anggapan atau kesan mereka. 'Mengira' alami dalam bahasa Indonesia dan menegaskan bahwa persepsi tersebut keliru tanpa menambahkan isi di luar konteks.
- source_word: πνεῦμα
  choice: suatu roh
  rationale: '''Roh'' merupakan padanan langsung πνεῦμα dan mempertahankan istilah sumber tanpa memasukkan konotasi folkloris yang dapat melekat pada ''hantu.'' Kata ''suatu'' menandai acuan tak tentu secara alami.'
- source_word: θεωρεῖν
  choice: sedang melihat
  rationale: Infinitif kini sesudah ἐδόκουν menyajikan penglihatan yang sedang berlangsung; 'sedang melihat' mempertahankan aspek tersebut.
theological_decisions:
- issue: Makna πνεῦμα dalam konteks penampakan sesudah kebangkitan
  choice: suatu roh
  alternative: hantu
  rationale: '''Suatu roh'' lebih dekat dengan bentuk Yunani dan membiarkan narasi sendiri menjelaskan bahwa Yesus yang bangkit bukan makhluk tanpa tubuh. Alternatif ''hantu'' dicatat tanpa menjadikannya penafsiran utama.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan partisip diterjemahkan secara alami, sedangkan peralihan wacana, timbulnya rasa takut, dan aspek penglihatan tetap dipertahankan.
