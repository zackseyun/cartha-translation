  source_fidelity: Draf dengan tepat membedakan keterkejutan mendadak (πτοηθέντες), timbulnya ketakutan (ἔμφοβοι γενόμενοι), anggapan mereka (ἐδόκουν), dan πνεῦμα sebagai "roh." Namun, "karena terkejut" mengubah dua partisip Yunani menjadi alasan kausal bagi "mengira," padahal teks hanya menyajikan keadaan/reaksi yang menyertai. Koreksi menghindari hubungan sebab-akibat yang tidak dinyatakan.
  naturalness: '"Suatu roh" dapat dipahami, tetapi tidak diperlukan dan terasa agak kaku dalam narasi Indonesia modern. "Mereka mengira sedang melihat roh" alami dan tetap mempertahankan acuan tak tentu melalui konteks. Pemisahan dengan titik koma membuat dua unsur reaksi dan anggapan mereka jelas tanpa menambahkan urutan atau sebab-akibat.'
  terminology: '"Roh" adalah padanan langsung dan sesuai register untuk πνεῦμα. Catatan "hantu" sebagai alternatif leksikal membantu pembaca tanpa menggantikan istilah utama atau memaksakan penafsiran teologis.'
