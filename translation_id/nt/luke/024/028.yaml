id: LUK.24.28
reference: Luke 24:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: id
  text: Ketika mereka mendekati desa yang mereka tuju, ia bersikap seolah-olah hendak meneruskan perjalanan lebih jauh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia berpura-pura hendak pergi lebih jauh” atau “ia berbuat seakan-akan hendak pergi lebih jauh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: mendekati
  rationale: Aoristus ἐγγίζω menyatakan bahwa mereka tiba dekat suatu tempat. Dalam konteks gerak menuju desa, “mendekati” alami dan tepat.
- source_word: κώμην
  choice: desa
  rationale: κώμη lazimnya menunjuk pada permukiman kecil, bukan kota; “desa” merupakan padanan Indonesia yang paling langsung.
- source_word: οὗ ἐπορεύοντο
  choice: yang mereka tuju
  rationale: Kata keterangan relatif οὗ bersama bentuk imperfek ἐπορεύοντο menunjukkan tujuan perjalanan mereka yang sedang berlangsung. “Yang mereka tuju” ringkas dan wajar dalam bahasa Indonesia.
- source_word: προσεποιήσατο
  choice: bersikap seolah-olah
  rationale: προσποιέομαι menyatakan tindakan yang memberi kesan tertentu. Ungkapan ini mempertahankan nuansa penampakan lahiriah tanpa memperkerasnya menjadi tuduhan dusta.
- source_word: πορρώτερον
  choice: lebih jauh
  rationale: Adverbia komparatif ini menyatakan jarak yang lebih jauh dalam perjalanan.
- source_word: πορεύεσθαι
  choice: hendak meneruskan perjalanan
  rationale: Infinitif ini melengkapi προσεποιήσατο dan mengacu pada perjalanan yang tampaknya akan diteruskan; “hendak meneruskan perjalanan” alami dalam konstruksi Indonesia ini.
theological_decisions:
- issue: Penggambaran tindakan Yesus dalam προσεποιήσατο
  choice: ia bersikap seolah-olah hendak meneruskan perjalanan lebih jauh
  alternative: ia berpura-pura hendak pergi lebih jauh; ia berbuat seakan-akan hendak pergi lebih jauh
  rationale: Pilihan ini mempertahankan ketegangan naratif bahwa ia memberi kesan akan terus berjalan, tanpa menetapkan lebih jauh apakah tindakan itu harus dinilai sebagai penipuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina “ia” dipakai sesuai konteks ayat tanpa menambahkan nama yang tidak terdapat dalam teks Yunani.
