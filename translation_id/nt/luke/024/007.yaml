id: LUK.24.7
reference: Luke 24:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: id
  text: ketika Ia berkata, “Anak Manusia harus diserahkan ke tangan orang-orang berdosa, disalibkan, dan pada hari ketiga bangkit.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Yunani aktif, bukan pasif (“dibangkitkan”).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisipel kini ini meneruskan rumusan tentang mengingat perkataan pada ayat sebelumnya; frasa ini mempertahankan kaitan sintaksis tersebut.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Sebutan baku ini mempertahankan daya ungkap sebagai gelar serta kaitannya dengan pemakaian dalam kitab Daniel dan Injil.
- source_word: ὅτι δεῖ
  choice: harus
  rationale: δεῖ menyatakan keharusan dalam rencana ilahi, bukan sekadar ramalan tentang apa yang akan terjadi.
- source_word: παραδοθῆναι
  choice: diserahkan
  rationale: Bentuk pasif ini berarti diserahkan kepada kuasa pihak lain; pilihan ini tidak mempersempit maknanya hanya pada tindakan pengkhianatan Yudas.
- source_word: εἰς χεῖρας
  choice: ke tangan
  rationale: Ungkapan ini mempertahankan gambaran sumber dan alami dalam bahasa Indonesia untuk penyerahan ke dalam kuasa seseorang.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: orang-orang berdosa
  rationale: ἀνθρώπων dapat berarti manusia atau orang; konteks tidak menuntut penandaan gender dalam terjemahan Indonesia, sedangkan frasa ini mempertahankan unsur nomina dan sifatnya.
- source_word: σταυρωθῆναι
  choice: disalibkan
  rationale: Padanan langsung dan lazim bagi infinitif pasif yang menunjuk pada hukuman salib.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: pada hari ketiga
  rationale: Datif waktu ini secara alami diterjemahkan demikian tanpa penambahan penjelasan kronologis.
- source_word: ἀναστῆναι
  choice: bangkit
  rationale: Infinitif aoris aktif ini menyatakan bangkit; bentuk aktif dipertahankan dan tidak diubah menjadi pasif 'dibangkitkan'.
theological_decisions:
- issue: Daya keharusan dalam δεῖ
  choice: harus, yang menyatakan keharusan dalam rencana Allah
  alternative: akan, sebagai ramalan sederhana
  rationale: Dalam Lukas, δεῖ kerap menandai keharusan penggenapan rencana Allah. Terjemahan 'harus' mempertahankan bobot itu tanpa menambahkan tafsiran ke dalam teks.
- issue: Diatesis ἀναστῆναι
  choice: bangkit
  alternative: dibangkitkan
  rationale: Bentuk Yunani di sini aktif. 'Bangkit' mempertahankan bentuk tersebut tanpa menyangkal ungkapan pasif tentang kebangkitan Yesus di bagian lain.
- issue: Cakupan ἀνθρώπων ἁμαρτωλῶν
  choice: orang-orang berdosa
  alternative: laki-laki berdosa
  rationale: Bahasa Yunani memakai ἄνθρωπος, bukan ἀνήρ yang secara khusus berarti laki-laki. Walaupun pelaku historisnya mencakup laki-laki, terjemahan tidak mempersempit nomina sumber secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ringkas mengikuti rangkaian tiga infinitif Yunani. Tanda kutip dipakai karena ayat ini melanjutkan ajakan untuk mengingat perkataan Yesus pada ayat sebelumnya.
