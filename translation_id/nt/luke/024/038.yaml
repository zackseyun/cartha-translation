  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Mengapa kalian gelisah, dan mengapa keraguan[a] muncul dalam hati kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pikiran-pikiran” atau “berbagai pertimbangan” untuk “keraguan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini, τί menanyakan sebab keadaan mereka; “Mengapa” merupakan padanan idiomatis yang tepat.
- source_word: τεταραγμένοι
  choice: gelisah
  rationale: Partisipel perfekt pasif ini menggambarkan keadaan batin yang terusik; “gelisah” alami dalam bahasa Indonesia dan mempertahankan daya emosionalnya.
- source_word: διαλογισμοὶ
  choice: keraguan
  rationale: Dalam konteks penampakan Yesus, kata ini menunjuk pada pergumulan pikiran yang bernada ragu, meskipun secara leksikal dapat pula berarti pikiran atau pertimbangan.
- source_word: ἀναβαίνουσιν
  choice: muncul
  rationale: Secara harfiah berarti “naik,” tetapi untuk aktivitas batin, “muncul” adalah ungkapan Indonesia yang alami.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: dalam hati kalian
  rationale: Bentuk tunggal καρδίᾳ dengan kata ganti jamak bersifat distributif. Bahasa Indonesia secara alami dapat mempertahankan “hati” dalam bentuk tunggal kolektif dengan “kalian.”
- source_word: καρδία
  choice: hati
  rationale: “Hati” mempertahankan gambaran antropologis Alkitab tentang pusat batin yang mencakup pikiran, sikap, dan perasaan; “pikiran” akan mempersempit maknanya.
theological_decisions:
- issue: Istilah antropologis καρδία
  choice: hati
  alternative: pikiran; batin
  rationale: Pemakaian “hati” mempertahankan cakupan antropologi biblis, tempat pemikiran dan penalaran juga berlangsung, tanpa mereduksinya menjadi kategori psikologis modern.
- issue: Nuansa διαλογισμοί
  choice: keraguan
  alternative: pikiran; pertimbangan; perbantahan batin
  rationale: Konteks menunjukkan ketidakpastian para murid terhadap penampakan Yesus. Namun, karena kata sumber lebih luas daripada “keraguan,” alternatif leksikal dicatat dalam catatan kaki agar ambiguitasnya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” yang jelas dan mudah dipahami. Susunan kalimat dibuat alami namun tetap dekat dengan struktur dan citra teks Yunani.
