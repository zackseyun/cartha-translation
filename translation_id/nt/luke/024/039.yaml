  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: id
  text: 'Lihatlah tangan-Ku dan kaki-Ku: ini benar-benar Aku sendiri.[a] Rabalah Aku[b] dan lihatlah, karena roh[c] tidak mempunyai daging dan tulang seperti yang kalian lihat ada pada-Ku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Akulah orangnya.” Ungkapan Yunani ini sangat menekankan identitas Yesus dan juga dapat dipahami sebagai isi dari apa yang harus mereka kenali.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sentuhlah Aku.” Kata Yunaninya menyiratkan pemeriksaan dengan meraba.
    reason: lexical_alternative
  - marker: c
    text: Atau, “hantu.” Kata Yunaninya secara langsung berarti “roh”; “hantu” adalah pilihan yang mungkin dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: lihatlah
  rationale: Imperatif ini mengajak para murid melakukan pemeriksaan langsung dengan penglihatan. “Lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya perintahnya.
- source_word: χεῖράς ... πόδας
  choice: tangan ... kaki
  rationale: Istilah anggota tubuh diterjemahkan secara konkret dan langsung; pasangan ini menegaskan identitas jasmani Yesus.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: ini benar-benar Aku sendiri
  rationale: ἐγώ dan αὐτός bersama-sama memberi penekanan kuat pada identitas pribadi. Ungkapan Indonesia ini menyampaikan penekanan tersebut tanpa memberi muatan teologis tambahan kepada ἐγώ εἰμι.
- source_word: ψηλαφήσατέ
  choice: rabalah
  rationale: Kata kerja ini menunjuk pada menyentuh atau meraba untuk memastikan secara fisik. “Rabalah” lebih tepat daripada sekadar “sentuhlah” karena menyiratkan pemeriksaan dengan tangan.
- source_word: πνεῦμα
  choice: roh
  rationale: “Roh” adalah padanan leksikal langsung dan mempertahankan istilah sumber; “hantu” lebih interpretatif dan dapat menimbulkan gambaran budaya yang tidak dimaksudkan.
- source_word: σάρκα καὶ ὀστέα
  choice: daging dan tulang
  rationale: Ungkapan jasmani ini diterjemahkan secara langsung dan alami. Di sini σάρξ berarti daging secara harfiah, bukan sifat manusia atau kecenderungan moral.
- source_word: θεωρεῖτε
  choice: kalian lihat
  rationale: Kata kerja ini dapat menyiratkan pengamatan saksama, tetapi “lihat” paling alami dalam konteks ajakan untuk memeriksa kenyataan jasmani Yesus.
- source_word: ἔχοντα
  choice: ada pada-Ku
  rationale: Partisip yang menerangkan ἐμέ diungkapkan sebagai klausa Indonesia yang alami dan tetap menyatakan bahwa daging dan tulang itu dimiliki Yesus.
theological_decisions:
- issue: Pernyataan tentang kenyataan jasmani Yesus setelah kebangkitan
  choice: 'Kontras jasmani dipertahankan secara eksplisit: roh tidak mempunyai daging dan tulang seperti yang terlihat ada pada Yesus.'
  alternative: Menghaluskan kontras itu atau menjelaskannya dengan rumusan doktrinal tambahan.
  rationale: Teks Yunani menekankan kenyataan tubuh yang dapat dilihat dan diraba. Terjemahan mempertahankan penegasan tersebut tanpa menambahkan penjelasan mengenai sifat tubuh kebangkitan yang tidak dinyatakan dalam ayat ini.
- issue: Hubungan ὅτι dengan perintah untuk melihat tangan dan kaki
  choice: Tanda titik dua menyajikan klausa berikut sebagai isi atau penjelasan dari apa yang harus mereka kenali.
  alternative: 'Menerjemahkannya secara kausal: “sebab Akulah ini.”'
  rationale: ὅτι dapat memperkenalkan isi pengenalan maupun alasan. Tanda titik dua menghasilkan bahasa Indonesia yang alami sambil tidak menutup salah satu nuansa secara tegas; kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk jamak “kalian” dipakai karena semua imperatif Yunani ditujukan kepada lebih dari satu orang. “Rabalah” mempertahankan unsur pemeriksaan fisik, sedangkan susunan dengan titik dua menghindari klausa “bahwa” yang kaku tanpa menghapus ambiguitas hubungan ὅτι.
