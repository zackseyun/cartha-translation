review_pass:
  verdict: revise
  source_fidelity: Teks utama pada dasarnya setia kepada Yunani. “Lihatlah,” “Rabalah,” “roh,” dan “daging dan tulang” menyampaikan imperatif, kontras jasmani, serta penekanan pada pemeriksaan fisik. Titik dua dapat menyampaikan fungsi ὅτι tanpa memaksakan pilihan kausal atau isi secara berlebihan. Namun, catatan a keliru menyebut “Akulah ini” sebagai terjemahan harfiah; ἐγώ εἰμι αὐτός secara idiomatis menegaskan “akulah orangnya/aku sendiri,” bukan frasa Indonesia tersebut secara harfiah.
  naturalness: Bahasa teks utama modern dan jelas. “Ini benar-benar Aku sendiri” secara wajar menyampaikan penekanan identitas, dan “seperti yang kalian lihat ada pada-Ku” mempertahankan makna partisip ἔχοντα dengan susunan yang dapat dipahami. Catatan b perlu diperbaiki karena alternatifnya memecah satu kata kerja Yunani menjadi dua perintah yang tidak diperlukan.
  terminology: “Roh” adalah padanan utama yang tepat untuk πνεῦμα dalam ayat ini; “hantu” layak dicatat sebagai alternatif kontekstual, bukan dipakai sebagai teks utama. “Daging dan tulang” tepat dan tidak boleh dilemahkan. Istilah ilahi dan kapitalisasi “Aku/-Ku” konsisten dengan register naskah.
  issues:
  - severity: medium
    issue: Catatan kaki a menyatakan parafrasa yang tidak tepat sebagai terjemahan harfiah.
    rationale: “Secara harfiah, ‘bahwa Akulah ini’” tidak merepresentasikan susunan maupun idiom ὅτι ἐγώ εἰμι αὐτός dengan baik. Catatan perlu membedakan alternatif idiomatis dari penjelasan tentang penekanan identitas.
  - severity: low
    issue: Catatan kaki b memberi alternatif yang berlebihan.
    rationale: ψηλαφήσατέ adalah satu imperatif yang berarti menyentuh/meraba untuk memeriksa; “sentuhlah Aku dan rasakanlah” menambahkan imperatif kedua. Alternatif yang lebih tepat ialah “sentuhlah Aku” atau penjelasan pemeriksaan dengan meraba.
  - severity: low
    issue: Catatan kaki c memakai rumusan yang kurang langsung.
    rationale: Alternatif “hantu” dapat disajikan secara ringkas sebagai kemungkinan kontekstual, tanpa frasa “sebagian orang dapat memahaminya,” yang tidak menjelaskan pilihan terjemahan secara spesifik.
