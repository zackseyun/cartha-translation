  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: id
  text: Sesudah mengatakan hal itu,[a] ia memperlihatkan kepada mereka tangan dan kakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat kalimat ini.
