lexical_decisions:
- source_word: καὶ
  choice: Sesudah
  rationale: Hubungan naratif καὶ dipadukan secara alami dengan konstruksi partisipial berikutnya; bahasa Indonesia cukup menyatakan urutan tindakan melalui “Sesudah” tanpa perlu menambahkan “dan” yang terasa kaku.
- source_word: τοῦτο εἰπὼν
  choice: Sesudah mengatakan hal itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. Ungkapan ini jelas, alami, dan mempertahankan urutan tindakan.
- source_word: ἔδειξεν
  choice: memperlihatkan
  rationale: Dalam konteks ini, δείκνυμι berarti membuat sesuatu terlihat atau menunjukkannya kepada orang lain; “memperlihatkan” sesuai dengan konstruksi penerima “kepada mereka”.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Datif penerima dinyatakan secara wajar dalam bahasa Indonesia dengan frasa “kepada mereka”.
- source_word: τὰς χεῖρας καὶ τοὺς πόδας
  choice: tangan dan kakinya
  rationale: Artikel Yunani dalam konteks anggota tubuh secara alami diterjemahkan dengan enklitik posesif bahasa Indonesia. Bentuk “tangan dan kakinya” ringkas dan jelas merujuk kepada tubuh Yesus sendiri.
theological_decisions:
- issue: Status tekstual seluruh ayat
  choice: Dicantumkan dalam teks utama dengan catatan varian tekstual
  alternative: Kalimat ini tidak dicantumkan karena tidak terdapat dalam sejumlah naskah
  rationale: SBLGNT mengapit seluruh kalimat dengan tanda kurung siku, yang menandakan keraguan tekstual yang berarti. Karena teks sumber yang diberikan memuat kalimat tersebut, terjemahan mempertahankannya dalam teks utama sambil menyatakan ketidakpastian naskah dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. “Ia” dipakai sebagai pronomina naratif, dan catatan kaki mempertahankan transparansi mengenai varian tekstual.
