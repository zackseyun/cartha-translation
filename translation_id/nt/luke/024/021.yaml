  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: id
  text: Tetapi kami tadinya berharap bahwa dialah yang akan menebus Israel[a]. Namun, di samping semua itu[b], sekarang sudah hari ketiga sejak semua itu terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “bahwa dialah orang yang akan menebus Israel.” Dalam bahasa Yunani, isi harapan itu memakai kata kerja bentuk kini (“adalah”).
    reason: alternative_reading
  - marker: b
    text: “Menebus Israel” dapat menunjuk secara luas pada pembebasan mesianik yang diharapkan. Teks tidak menentukan apakah yang dimaksud ialah pembebasan politik, keselamatan rohani, atau keduanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Namun, kami
  rationale: δέ menandai kontras dengan laporan sebelumnya, sedangkan pronomina eksplisit ἡμεῖς memberi penekanan pada harapan para pembicara.
- source_word: ἠλπίζομεν
  choice: kami tadinya berharap
  rationale: Bentuk imperfek menggambarkan harapan yang berlangsung pada masa lalu dan kini tampak kandas. Kata 'tadinya' menyampaikan nuansa itu secara alami dalam bahasa Indonesia.
- source_word: ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι
  choice: bahwa Dialah yang akan menebus
  rationale: Konstruksi 'Dialah' mempertahankan penekanan pada αὐτός, sedangkan 'akan menebus' menyampaikan isi harapan yang berorientasi ke depan tanpa memaksakan pembedaan kala yang tidak gramatikal dalam bahasa Indonesia.
- source_word: λυτροῦσθαι
  choice: menebus
  rationale: '''Menebus'' mempertahankan citra pembebasan melalui penebusan serta gema perjanjian dan mesianiknya; cakupannya tidak dipersempit menjadi pembebasan politik ataupun keselamatan rohani saja.'
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Objeknya adalah Israel sebagai umat secara keseluruhan; bentuk langsung ini setia dan lazim.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Di samping semua itu
  rationale: Ungkapan ini menambahkan satu pertimbangan mengecewakan lagi. 'Di samping semua itu' menyampaikan daya kumulatifnya dengan wajar; kontras keseluruhan telah ditandai oleh 'Namun' pada awal tuturan.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: sekarang sudah hari ketiga
  rationale: ἄγει dipakai secara idiomatis tentang berjalannya waktu. Terjemahan ini alami dan mempertahankan penekanan bahwa hari ketiga telah tiba.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: sejak hal-hal itu terjadi
  rationale: Frasa ini menyatakan titik awal penghitungan waktu; 'sejak' menyampaikan hubungan temporal tersebut dengan jelas.
theological_decisions:
- issue: Cakupan harapan mesianik dalam ungkapan λυτροῦσθαι τὸν Ἰσραήλ
  choice: menebus Israel
  alternative: membebaskan Israel secara politik; menyelamatkan Israel secara rohani
  rationale: Teks tidak menentukan apakah penebusan yang mereka harapkan terutama bersifat nasional-politik, rohani, atau mencakup keduanya. Terjemahan mempertahankan keluasan dan ketegangan itu.
- issue: Daya temporal ἐστιν dan μέλλων sesudah ἠλπίζομεν
  choice: Dialah yang akan menebus
  alternative: Dialah yang tadinya akan menebus; dia adalah orang yang akan menebus
  rationale: Bahasa Indonesia tidak mewajibkan penyesuaian kala seperti bahasa Inggris. Bentuk ini mempertahankan isi harapan mereka yang berorientasi ke depan, sementara 'tadinya berharap' dan konteks menunjukkan bahwa harapan tersebut kini kecewa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Tadinya berharap' mudah dipahami serta mengungkapkan harapan masa lalu yang kecewa. Kapitalisasi pada 'Dialah' mengikuti awal unsur sesudah 'bahwa' hanya karena bentuk penghormatan tidak diperlukan; huruf kapital dipakai di sini untuk penekanan pronominal dalam konstruksi tersebut.
