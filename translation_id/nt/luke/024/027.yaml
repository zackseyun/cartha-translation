  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: id
  text: Lalu, mulai dari Musa dan semua nabi[b], Ia menjelaskan[a] kepada mereka segala sesuatu dalam seluruh Kitab Suci yang berkaitan dengan diri-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menafsirkan” atau “menguraikan.” Kata kerja Yunani ini dapat menunjuk pada penjelasan makna secara terperinci.
    reason: lexical_alternative
  - marker: b
    text: “Musa dan semua nabi” menunjuk pada tulisan-tulisan Kitab Suci yang dikaitkan dengan Musa serta kitab-kitab para nabi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: mulai dari Musa
  rationale: Bentuk partisipel ini menunjukkan titik awal penjelasan. Ungkapan Indonesia ini alami dan tetap mempertahankan acuan kepada Musa sebagai bagian awal rangkaian Kitab Suci.
- source_word: πάντων τῶν προφητῶν
  choice: semua kitab para nabi
  rationale: Dalam konteks ini, frasa tersebut menunjuk pada bagian Kitab Suci yang berkaitan dengan para nabi. Penambahan 'kitab' memperjelas acuan tulisannya tanpa mengubah makna.
- source_word: διερμήνευσεν
  choice: menafsirkan
  rationale: Kata kerja ini berarti menerangkan atau menguraikan makna secara interpretatif; 'menafsirkan' mempertahankan nuansa penjelasan Kitab Suci.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Menyampaikan objek tak langsung datif secara lugas.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: dalam seluruh Kitab Suci
  rationale: γραφή dalam konteks ini mengacu pada tulisan suci. Bentuk tunggal kolektif 'Kitab Suci' lazim dalam bahasa Indonesia, sedangkan 'seluruh' menyampaikan cakupan πάσαις tanpa menyatakan bahwa setiap ayat secara tersendiri membahas Yesus.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: hal-hal mengenai dirinya
  rationale: Ungkapan ini mempertahankan keluasan konstruksi Yunani dan tidak membatasi acuannya hanya pada nubuat langsung, tipologi, atau kategori tertentu.
theological_decisions:
- issue: Cakupan penjelasan Yesus atas Kitab Suci
  choice: Yesus menafsirkan dalam seluruh Kitab Suci hal-hal yang mengenai dirinya, tanpa menentukan satu kategori penafsiran saja
  alternative: Hanya nubuat-nubuat mesianik langsung, atau setiap bagian Perjanjian Lama secara individual dan menyeluruh
  rationale: Teks mendukung pembacaan Kitab Suci yang berpusat pada Kristus, tetapi tidak mengatakan bahwa yang dimaksud hanya nubuat langsung ataupun bahwa setiap nas secara individual mengacu kepadanya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan unsur disusun agar alami dalam bahasa Indonesia sambil mempertahankan titik awal penjelasan, cakupan Kitab Suci, serta keluasan frasa tentang diri Yesus.
