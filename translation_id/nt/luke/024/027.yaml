  verdict: revise
  source_fidelity: 'Makna pokok sudah tepat: Yesus memulai dengan Musa dan para nabi, lalu menerangkan kepada mereka hal-hal yang berkaitan dengan diri-Nya di seluruh Kitab Suci. Namun, "semua kitab para nabi" menambahkan kata "kitab" ke dalam teks utama, padahal Yunani berbunyi "semua nabi"; acuan pada korpus tulisan dapat dijelaskan melalui konteks dan catatan kaki. Susunan revisi juga menempatkan keterangan "dalam seluruh Kitab Suci" lebih jelas pada cakupan penjelasan.'
  naturalness: '"Menafsirkan kepada mereka hal-hal mengenai dirinya" dapat dipahami, tetapi "menjelaskan kepada mereka segala sesuatu ... yang berkaitan dengan diri-Nya" lebih alami dalam Bahasa Indonesia modern dan dengan baik mencerminkan daya jelaskan dari διερμήνευσεν.'
  terminology: '"Musa," "para nabi," dan "Kitab Suci" merupakan istilah yang sesuai. "Semua nabi" mempertahankan bentuk sumber tanpa menghilangkan pembacaan kanonisnya; catatan budaya menerangkan bahwa frasa itu berfungsi dalam konteks tulisan-tulisan suci.'
