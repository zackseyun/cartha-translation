translation:
  language: id
  text: Lalu mereka memberikan kepada-Nya sepotong ikan panggang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah yang lebih kemudian menambahkan, “dan dari sarang madu.”
