lexical_decisions:
- source_word: οἱ δὲ
  choice: Lalu mereka
  rationale: οἱ dipakai secara substantival dan menunjuk kepada orang-orang yang berkumpul; δέ adalah penghubung ringan. “Lalu mereka” menyampaikan kelanjutan narasi secara alami tanpa memberi kesan pertentangan yang kuat.
- source_word: ἐπέδωκαν
  choice: memberikan
  rationale: Bentuk aoris aktif indikatif dari ἐπιδίδωμι, yang dalam konteks ini berarti memberi atau menyerahkan. “Memberikan” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: αὐτῷ
  choice: kepada-Nya
  rationale: Dativus ini menandai penerima tindakan, yaitu Yesus. Bentuk “kepada-Nya” jelas dan alami dalam bahasa Indonesia; huruf kapital mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: sepotong ikan panggang
  rationale: μέρος adalah nomina utama yang berarti “bagian/potong”, sedangkan ἰχθύος ὀπτοῦ menjelaskan bahwa potongan itu berasal dari ikan yang dipanggang. “Sepotong ikan panggang” ringkas, jelas, dan alami.
- source_word: ὀπτοῦ
  choice: panggang
  rationale: ὀπτός menunjuk pada makanan yang dimasak dengan dipanggang atau dibakar. “Panggang” cukup tepat tanpa menetapkan teknik memasak modern yang terlalu khusus.
theological_decisions:
- issue: Bentuk teks Lukas 24:42
  choice: 'Menerjemahkan hanya teks SBLGNT: “sepotong ikan panggang.”'
  alternative: Sejumlah naskah yang lebih kemudian menambahkan “dan madu dari sarang lebah.”
  rationale: Teks sumber kritis yang diberikan berakhir pada μέρος dan tidak memuat bacaan yang lebih panjang. Varian tersebut dicatat dalam catatan kaki demi transparansi tanpa memasukkannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan alur naratif sederhana dari bahasa Yunani. Istilah “ikan panggang” dipilih sebagai ungkapan kuliner yang umum dan tidak terlalu teknis.
