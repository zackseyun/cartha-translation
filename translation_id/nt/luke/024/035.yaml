review_pass:
  verdict: revise
  source_fidelity: Terjemahan ini menangkap penegasan αὐτοὶ, isi laporan tentang peristiwa di jalan, dan hubungan dengan pemecahan roti. Namun, “Dia menyatakan diri kepada mereka” mengubah bentuk pasif ἐγνώσθη menjadi tindakan aktif-refleksif dan lebih tegas daripada yang dinyatakan teks. Selain itu, “ketika memecah-mecahkan roti” memberi bentuk verbal dan dapat menyiratkan subjek pelaku, sedangkan Yunani memakai frasa nomina yang lebih netral.
  naturalness: “Mereka sendiri menceritakan apa yang terjadi di jalan” alami dalam bahasa Indonesia modern. “Dia dikenal oleh mereka dalam pemecahan roti” tetap dapat dipahami dan lebih dekat pada struktur serta ambiguitas sumber. “Pemecahan roti” juga wajar dalam register naratif Alkitab tanpa memaksakan makna teknis.
  terminology: “Dia” dan “roti” konsisten. “Pemecahan roti” mempertahankan τῇ κλάσει τοῦ ἄρτου secara netral. Catatan kaki perlu menyajikan alternatif aktif-refleksif sebagai kemungkinan penafsiran, bukan sebagai parafrasa harfiah dari bentuk pasif.
  issues:
  - severity: medium
    issue: ἐγνώσθη diterjemahkan “Dia menyatakan diri kepada mereka.”
    rationale: Verba Yunani berbentuk pasif (“ia dikenal/dikenali oleh mereka”). Terjemahan aktif-refleksif dapat menjadi penafsiran yang mungkin dalam konteks, tetapi tidak secara langsung mempertahankan bentuk maupun ambiguitas pasif sumber.
  - severity: low
    issue: ἐν τῇ κλάσει τοῦ ἄρτου diterjemahkan “ketika memecah-mecahkan roti.”
    rationale: Frasa sumber adalah frasa nomina, “dalam/pada pemecahan roti,” bukan klausa verbal. Bentuk sekarang dapat memberi kesan tindakan berulang dan menyisakan subjek yang tidak disebutkan.
  - severity: low
    issue: Catatan kaki menyebut “Secara harfiah” tetapi kemudian memberi parafrasa aktif-refleksif.
    rationale: Bagian harfiah sebaiknya mencerminkan pasif Yunani, sedangkan “Dia menyatakan diri kepada mereka” sebaiknya ditempatkan sebagai alternatif pemaknaan.
  revised_text: Lalu mereka sendiri menceritakan apa yang terjadi di jalan dan bagaimana Dia dikenal oleh mereka dalam pemecahan roti.[a]
  revised_footnotes:
