base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: id
  text: Lalu mereka sendiri menceritakan apa yang terjadi di jalan dan bagaimana Dia dikenal oleh mereka dalam pemecahan roti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia menyatakan diri kepada mereka.” Kata kerja Yunani berbentuk pasif dan dapat menekankan baik bahwa mereka mengenali-Nya maupun bahwa Dia dibuat dikenal oleh mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: mereka sendiri
  rationale: Kata ganti eksplisit ini bersifat menegaskan dan membedakan kedua murid itu sebagai pihak yang kini menyampaikan pengalaman mereka sendiri.
- source_word: ἐξηγοῦντο
  choice: menceritakan
  rationale: Bentuk imperfek menggambarkan laporan yang sedang berlangsung; 'menceritakan' alami dalam bahasa Indonesia dan sesuai dengan makna menguraikan kejadian.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: apa yang terjadi di jalan
  rationale: Ungkapan Yunani bersifat eliptis. Penambahan 'yang terjadi' mengungkapkan makna tersirat secara wajar tanpa menambahkan isi baru.
- source_word: ὡς
  choice: bagaimana
  rationale: Di sini ὡς memperkenalkan isi laporan mengenai cara atau keadaan pengenalan itu terjadi.
- source_word: ἐγνώσθη αὐτοῖς
  choice: Dia menyatakan diri kepada mereka
  rationale: Ungkapan ini mempertahankan arah pasif—bahwa Yesus menjadi dikenal oleh mereka—dalam bentuk Indonesia yang alami, sekaligus tidak menjadikannya semata-mata tindakan pengenalan manusia.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: ketika memecah-mecahkan roti
  rationale: Preposisi ἐν dapat menyatakan keadaan atau waktu. Dalam konteks adegan makan tertentu, ungkapan verbal ini paling alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ἐγνώσθη menyatakan pengenalan manusia semata atau bahwa Yesus dibuat menjadi dikenal bagi mereka
  choice: Dia menyatakan diri kepada mereka
  alternative: Dia dikenali oleh mereka
  rationale: Pilihan utama menjaga nuansa bahwa pengenalan itu tidak semata-mata berasal dari kemampuan para murid, selaras dengan konteks 24:31, tanpa menetapkan secara berlebihan siapa pelaku tersirat dalam bentuk pasif Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Memecah-mecahkan roti' mempertahankan ungkapan khas narasi tanpa menjadikannya istilah teknis denominasi.
