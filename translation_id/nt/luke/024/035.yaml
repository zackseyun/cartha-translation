    text: Atau, “Dia menyatakan diri kepada mereka.” Kata kerja Yunani berbentuk pasif dan dapat menekankan baik bahwa mereka mengenali-Nya maupun bahwa Dia dibuat dikenal oleh mereka.
    reason: alternative_reading
  revision_rationale: Revisi mempertahankan penegasan “mereka sendiri” dan perluasan eliptis “apa yang terjadi,” tetapi mengembalikan ἐγνώσθη kepada bentuk pasif yang tidak memutuskan apakah tekanan utamanya pada pengenalan para murid atau pada Dia yang dibuat dikenal. “Dalam pemecahan roti” mempertahankan frasa nomina sumber dan konteks hidangan tertentu tanpa menambahkan subjek atau aspek tindakan berulang.
