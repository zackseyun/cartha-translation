revisions:
- from: Lalu mereka sendiri menceritakan apa yang terjadi di jalan dan bagaimana Dia menyatakan diri kepada mereka ketika memecah-mecahkan roti.[a]
  to: Lalu mereka sendiri menceritakan apa yang terjadi di jalan dan bagaimana Dia dikenal oleh mereka dalam pemecahan roti.[a]
  rationale: Revisi mempertahankan penegasan “mereka sendiri” dan perluasan eliptis “apa yang terjadi,” tetapi mengembalikan ἐγνώσθη kepada bentuk pasif yang tidak memutuskan apakah tekanan utamanya pada pengenalan para murid atau pada Dia yang dibuat dikenal. “Dalam pemecahan roti” mempertahankan frasa nomina sumber dan konteks hidangan tertentu tanpa menambahkan subjek atau aspek tindakan berulang.
