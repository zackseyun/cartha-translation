  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: id
  text: Ketika mereka sedang bercakap-cakap dan berdiskusi[a], Yesus sendiri datang mendekat dan berjalan bersama mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdebat”; kata Yunaninya dapat menyiratkan diskusi yang lebih intens.
    reason: lexical_alternative
  - marker: b
    text: Atau “datang mendekat dan turut berjalan bersama mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Ketika
  rationale: Formula naratif ini digabungkan secara wajar dengan konstruksi temporal berikutnya; bahasa Indonesia tidak memerlukan padanan harfiah seperti 'terjadilah' agar peralihan adegan tetap terasa.
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: ketika mereka sedang bercakap-cakap
  rationale: Konstruksi infinitif artikular dengan ἐν menyatakan waktu. Bentuk 'sedang' mempertahankan sifat tindakan yang tengah berlangsung, sedangkan 'bercakap-cakap' cocok untuk percakapan timbal balik.
- source_word: συζητεῖν
  choice: membahasnya dengan sungguh-sungguh
  rationale: Kata ini menunjuk pada pembahasan bersama yang dapat bernuansa perdebatan. Pilihan ini menyampaikan intensitas tanpa memastikan adanya pertengkaran; objek '-nya' merujuk secara alami pada hal-hal yang dibicarakan dalam konteks sebelumnya.
- source_word: αὐτὸς Ἰησοῦς
  choice: Yesus sendiri
  rationale: Kata ganti intensif αὐτός menekankan identitas sosok yang mendekat, sehingga 'sendiri' perlu dipertahankan.
- source_word: ἐγγίσας
  choice: mendekat
  rationale: Partisip aoris menggambarkan tindakan mendekati yang menyertai atau mendahului tindakan utama. 'Mendekat' ringkas dan alami.
- source_word: συνεπορεύετο αὐτοῖς
  choice: berjalan bersama mereka
  rationale: Imperfek menggambarkan tindakan menyertai yang berlangsung. Dalam konteks perjalanan darat, 'berjalan bersama mereka' lebih alami daripada terjemahan mekanis dan tetap mempertahankan makna menemani dalam perjalanan.
- source_word: καὶ ... καὶ ... καὶ
  choice: dan ... lalu ...
  rationale: Rangkaian καί disajikan dengan penghubung Indonesia yang alami; 'lalu' menandai perkembangan tindakan tanpa menjadikannya urutan yang terlalu kaku.
theological_decisions:
- issue: Penekanan naratif pada identitas sosok yang mendekat
  choice: Yesus sendiri mendekat
  alternative: Yesus mendekat
  rationale: Teks Yunani secara gramatikal menonjolkan bahwa Yesuslah yang secara pribadi mendekati mereka. Terjemahan mempertahankan penekanan itu tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Ungkapan 'bercakap-cakap' membedakan percakapan biasa dari pembahasan yang lebih intens, sedangkan 'Yesus sendiri' menjaga penekanan teks sumber.
