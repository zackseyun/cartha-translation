  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: id
  text: dan dalam nama-Nya pertobatan untuk pengampunan dosa[a] harus diberitakan kepada segala bangsa[b], mulai dari Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertobatan dan pengampunan dosa”; bahasa Yunani dapat dipahami sebagai dua unsur sejajar dalam berita yang harus disampaikan.
    reason: alternative_reading
  - marker: b
    text: Atau “kepada semua orang bukan Yahudi.” Dalam konteks tertentu, kata Yunani yang sama dapat berarti “orang-orang bukan Yahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: harus diberitakan
  rationale: Infinitif pasif aoris ini bergantung pada konteks penggenapan Kitab Suci sebelumnya. “Diberitakan” menyampaikan tindakan pengumuman kepada umum secara wajar dalam bahasa Indonesia tanpa membatasinya pada khotbah formal.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: dalam nama-Nya
  rationale: Ungkapan ini menunjuk pada dasar dan kewenangan yang melekat pada pribadi Yesus. “Dalam nama-Nya” alami dalam bahasa Indonesia dan mempertahankan daya teologis ungkapan tersebut.
- source_word: μετάνοιαν
  choice: pertobatan
  rationale: Kata ini menyatakan perubahan arah batin dan hidup. “Pertobatan” adalah istilah Indonesia yang ringkas, dikenal luas, dan cocok dengan struktur nominal teks Yunani.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: untuk pengampunan dosa
  rationale: ἄφεσις dalam konteks ini berarti pelepasan atau pengampunan. Terjemahan utama menghubungkan pertobatan dengan pengampunan secara dekat, tetapi catatan kaki mempertahankan kemungkinan bahwa keduanya merupakan dua unsur sejajar yang diberitakan.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: kepada segala bangsa
  rationale: ἔθνη dapat berarti bangsa-bangsa atau orang bukan Yahudi. Dalam amanat pascakebangkitan ini cakupannya mendunia; “segala bangsa” mempertahankan keluasan itu tanpa mempersempitnya hanya kepada orang bukan Yahudi.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: mulai dari Yerusalem
  rationale: Partisipel ini menunjukkan titik awal pemberitaan. “Mulai dari Yerusalem” alami dan mempertahankan nuansa arah dari ἀπό.
theological_decisions:
- issue: Hubungan pertobatan dan pengampunan dalam isi pemberitaan
  choice: “pertobatan untuk pengampunan dosa”
  alternative: “pertobatan dan pengampunan dosa” sebagai dua unsur sejajar yang diberitakan
  rationale: Susunan Yunani memungkinkan kedua nomina dipahami sebagai isi pemberitaan yang sejajar, tetapi juga memungkinkan hubungan erat antara pertobatan dan pengampunan. Teks utama mempertahankan hubungan itu tanpa merumuskan urutan keselamatan yang lebih terperinci daripada yang dinyatakan ayat ini; catatan kaki menjaga kemungkinan koordinatif.
- issue: Makna ἔθνη
  choice: “segala bangsa”
  alternative: “semua orang bukan Yahudi”
  rationale: Konteks menunjuk pada cakupan pemberitaan ke seluruh dunia. Pilihan “segala bangsa” menjaga bentuk leksikal serta tidak mempersempit sasaran hanya pada orang bukan Yahudi, walaupun mereka jelas tercakup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk “nama-Nya” mempertahankan rujukan hormat kepada Yesus. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya; urutan [b][a] mengikuti cakupan masing-masing catatan pada frasa penutup.
