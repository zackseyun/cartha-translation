  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: id
  text: yang berkata[a], “Tuhan benar-benar telah dibangkitkan dan telah menampakkan diri kepada Simon!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Tuhan sungguh telah bangkit” atau “Tuhan memang telah dibangkitkan.” Kata keterangan dan kata kerja Yunaninya memungkinkan beberapa terjemahan yang berdekatan; teks utama mempertahankan bentuk pasif kata kerja Yunani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: sambil berkata
  rationale: Partisipel kini akusatif maskulin jamak ini bergantung pada kalimat yang lebih luas. “Sambil berkata” mempertahankan kaitan partisipial tanpa menjadikan ayat ini kalimat mandiri atau menambahkan subjek yang tidak dinyatakan di dalam ayat.
- source_word: ὅτι
  choice: tanda petik pembuka
  rationale: ὅτι memperkenalkan isi ucapan langsung; tanda petik menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: ὄντως
  choice: benar-benar
  rationale: Ungkapan ini menegaskan kenyataan berita kebangkitan dengan bahasa Indonesia modern dan alami.
- source_word: ἠγέρθη
  choice: telah dibangkitkan
  rationale: Bentuk aoris pasif dari ἐγείρω diterjemahkan secara pasif. “Telah” menyatakan tindakan yang sudah terjadi dan hasilnya relevan dalam konteks laporan tersebut.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Di sini κύριος merupakan gelar kristologis bagi Yesus. “Tuhan” mempertahankan bobot gelar itu dalam pemakaian Alkitab bahasa Indonesia.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana ini mengaitkan penegasan kebangkitan dengan penampakan kepada Simon.
- source_word: ὤφθη
  choice: telah menampakkan diri
  rationale: Walaupun bentuk Yunaninya pasif, kata ini lazim dipakai secara idiomatis untuk penampakan. “Menampakkan diri” menyampaikan bahwa Tuhan hadir dan terlihat oleh Simon secara alami dalam bahasa Indonesia.
- source_word: Σίμωνι
  choice: kepada Simon
  rationale: Bentuk datif menunjukkan orang yang menerima penampakan. Teks hanya menyebut Simon, sehingga “Petrus” tidak ditambahkan.
theological_decisions:
- issue: Bentuk verba kebangkitan
  choice: telah dibangkitkan
  alternative: telah bangkit
  rationale: Bahasa Yunani memakai bentuk pasif ἠγέρθη. Mempertahankan bentuk pasif menjaga nuansa teks tanpa secara eksplisit menambahkan pelaku yang tidak disebutkan.
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks kebangkitan ini, κύριος berfungsi sebagai gelar bagi Yesus; “Tuhan” mempertahankan bobot kristologisnya dan sesuai dengan bahasa Indonesia Alkitabiah yang wajar.
- issue: Bentuk verba penampakan
  choice: telah menampakkan diri kepada Simon
  alternative: telah terlihat oleh Simon
  rationale: ὤφθη berbentuk pasif, tetapi dalam laporan penampakan kebangkitan bermakna idiomatis “menampakkan diri.” Pilihan utama menghindari susunan Indonesia yang kaku tanpa menambahkan isi teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Sambil berkata” sengaja mempertahankan hubungan sintaksis dengan ayat sebelumnya; tanda seru mencerminkan sifat berita yang penuh penegasan.
