id: LUK.24.53
reference: Luke 24:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: id
  text: Dan mereka terus-menerus berada di kompleks Bait Allah sambil memuji[a] Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberkati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Konjungsi sederhana ini mempertahankan alur narasi yang terhubung dengan ayat sebelumnya.
- source_word: ἦσαν
  choice: mereka ... berada
  rationale: Bentuk imperfek menyatakan keadaan yang berlangsung; nuansa duratifnya diperjelas oleh terjemahan διὰ παντός.
- source_word: διὰ παντός
  choice: terus-menerus
  rationale: Ungkapan ini berarti terus atau senantiasa; 'terus-menerus' menyampaikan keberlangsungan atau keteraturan yang berulang secara alami dalam bahasa Indonesia.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν merujuk pada seluruh kawasan Bait Allah, bukan hanya ruang kudus bagian dalam. Penambahan 'kompleks' mencegah kesan bahwa para murid berada di ruang suci yang aksesnya terbatas.
- source_word: εὐλογοῦντες
  choice: memuji
  rationale: Secara harfiah verba ini berarti 'memberkati' atau 'berkata baik tentang'. Ketika Allah menjadi objeknya, 'memuji Allah' adalah ungkapan Indonesia yang alami; makna harfiahnya dipertahankan dalam catatan kaki.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Objek langsung εὐλογοῦντες diterjemahkan secara lugas sebagai 'Allah'.
theological_decisions:
- issue: Bahasa ibadah kepada Allah dalam εὐλογοῦντες τὸν θεόν
  choice: memuji Allah
  alternative: memberkati Allah
  rationale: '''Memuji Allah'' menyampaikan fungsi ungkapan tersebut dengan alami dalam bahasa Indonesia, sedangkan ''memberkati Allah'' lebih dekat dengan bentuk leksikal Yunani tetapi mudah disalahpahami seolah-olah manusia memberikan berkat kepada Allah. Catatan kaki menjaga keterlihatan bentuk asli dan alternatif yang sah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'sambil memuji' menyatakan tindakan yang berlangsung bersamaan dengan keberadaan mereka di kompleks Bait Allah. Istilah 'kompleks Bait Allah' dipakai untuk memperjelas cakupan ἱερόν.
