  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: id
  text: Bukankah Mesias harus menderita semuanya itu dan masuk ke dalam kemuliaan-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini untuk mempertahankan maknanya dalam konteks penggenapan Kitab Suci.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Bukankah
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan jawaban ya secara alami dalam bahasa Indonesia.
- source_word: ταῦτα
  choice: semuanya itu
  rationale: Menunjuk kembali pada berbagai penderitaan yang baru dibicarakan; bentuk ini alami dan mempertahankan daya tunjuk demonstratif.
- source_word: ἔδει
  choice: harus
  rationale: Dalam konteks ini menyatakan keniscayaan yang berkaitan dengan rencana Allah dan penggenapan Kitab Suci, bukan sekadar paksaan dari luar.
- source_word: παθεῖν
  choice: menderita
  rationale: Padanan langsung, ringkas, dan wajar untuk infinitif πάσχω.
- source_word: τὸν χριστὸν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar bagi Yang Diurapi dalam konteks penggenapan Kitab Suci.
- source_word: καὶ
  choice: dan
  rationale: Mempertahankan koordinasi sederhana antara kedua infinitif tanpa menambahkan urutan waktu yang tidak dinyatakan secara eksplisit.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: masuk ke dalam kemuliaan-Nya
  rationale: Mempertahankan gambaran memasuki kemuliaan serta pronomina posesif yang merujuk kepada Mesias.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Padanan baku dan sesuai konteks kebangkitan serta peninggian.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Menerjemahkan pronomina posesif secara langsung tanpa mempersempit secara tafsiran sifat kemuliaan tersebut.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Istilah ini merupakan gelar, dan 'Mesias' mempertahankan arti 'Yang Diurapi' serta kaitannya dengan penggenapan Kitab Suci. Alternatif yang lazim dicatat dalam catatan kaki.
- issue: Daya ἔδει
  choice: harus, sebagai keniscayaan ilahi atau berdasarkan Kitab Suci
  alternative: sekadar tidak terelakkan atau berkewajiban
  rationale: Konteks wacana kebangkitan dalam Lukas mengaitkannya dengan rencana penebusan Allah dan penggenapan Kitab Suci; terjemahan tetap ringkas tanpa menjelaskan sumber keniscayaan itu di dalam teks.
- issue: Makna kemuliaan-Nya
  choice: mempertahankan ungkapan posesif tanpa penjelasan tambahan
  alternative: kemuliaan yang ditetapkan bagi-Nya
  rationale: Bahasa Yunani menyatakan αὐτοῦ tetapi tidak menguraikan apakah tekanannya pada kemuliaan yang menjadi milik-Nya, diterima-Nya, atau menjadi ranah yang dimasuki-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris dibuat alami dengan 'Bukankah'. Kapital pada pronomina '-Nya' mengikuti konvensi bahasa Indonesia untuk rujukan ilahi atau kepada Mesias.
