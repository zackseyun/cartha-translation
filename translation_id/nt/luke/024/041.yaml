id: LUK.24.41
reference: Luke 24:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: id
  text: Sementara mereka masih belum percaya karena sukacita dan masih merasa takjub[a], Ia berkata kepada mereka, “Adakah sesuatu untuk dimakan di sini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sementara mereka masih tidak percaya karena sukacita dan merasa heran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Sementara ... masih
  rationale: ἔτι menyatakan keadaan yang berlanjut (‘masih’), sedangkan δέ menghubungkan kalimat secara ringan; dalam bahasa Indonesia, konstruksi partisipialnya paling wajar disampaikan dengan ‘Sementara’.
- source_word: ἀπιστούντων
  choice: belum percaya
  rationale: Partisipel kini menunjukkan keadaan yang masih berlangsung. ‘Belum percaya’ mengungkapkan keraguan sementara tanpa menyiratkan ketidakpercayaan yang menetap.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: karena sukacita
  rationale: ἀπό di sini menyatakan sebab atau sumber, sehingga ‘karena sukacita’ mempertahankan paradoks bahwa sukacita mereka turut membuat kenyataan itu sulit dipercaya.
- source_word: θαυμαζόντων
  choice: masih merasa takjub
  rationale: Partisipel ini sejajar dengan ἀπιστούντων dan menyatakan ketakjuban yang sedang berlangsung; ‘merasa takjub’ alami dalam bahasa Indonesia dan tetap memuat nuansa heran penuh kekaguman.
- source_word: Ἔχετέ τι βρώσιμον
  choice: Adakah sesuatu untuk dimakan
  rationale: Pertanyaan ini meminta makanan secara terbuka. ‘Sesuatu untuk dimakan’ merupakan padanan Indonesia yang alami bagi τι βρώσιμον tanpa menghilangkan makna ‘yang dapat dimakan’.
- source_word: ἐνθάδε
  choice: di sini
  rationale: Adverbia ini secara langsung menunjukkan tempat dan paling ringkas serta alami diterjemahkan ‘di sini’.
theological_decisions:
- issue: Sifat tanggapan para murid terhadap Yesus yang bangkit
  choice: Mereka masih belum percaya karena diliputi sukacita dan ketakjuban.
  alternative: Mereka tetap tidak percaya dalam arti penolakan atau ketidakpercayaan yang mengeras.
  rationale: 'Rangkaian ἀπιστούντων ... ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων menggambarkan reaksi emosional yang kompleks: kenyataan itu begitu menggembirakan dan menakjubkan sehingga mereka belum sanggup memercayainya sepenuhnya. Terjemahan mempertahankan ketegangan ini tanpa mengubahnya menjadi penolakan yang menetap.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. ‘Belum percaya’ dipilih daripada ‘tidak percaya’ dalam teks utama untuk menyampaikan keadaan sementara, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki. Pronomina ‘Ia’ mengikuti ragam penerbitan Alkitab Indonesia yang hormat tanpa menambahkan gelar yang tidak terdapat dalam ayat.
