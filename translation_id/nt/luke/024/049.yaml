source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: id
  text: Dan lihatlah, Aku akan mengirimkan janji Bapa-Ku kepada kalian. Namun, tinggallah di kota itu sampai kalian diperlengkapi dengan kuasa dari tempat tinggi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang kuat dalam bentuk Indonesia yang wajar dan bermartabat.
- source_word: ἐξαποστέλλω
  choice: akan mengirimkan
  rationale: Kala kini Yunani dapat menyatakan tindakan yang sudah pasti dan segera terjadi; bentuk Indonesia dengan 'akan' paling alami dalam konteks janji tentang pencurahan yang masih akan berlangsung.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: apa yang dijanjikan Bapa-Ku
  rationale: Secara idiomatis menyampaikan metonimia 'janji' sebagai hal yang dijanjikan, tanpa secara eksplisit menambahkan identitasnya.
- source_word: ἐφ’ ὑμᾶς
  choice: kepada kalian
  rationale: Mengungkapkan arah datangnya pemberian kepada para murid; 'kalian' memperjelas bahwa pronomina Yunani berbentuk jamak.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: tinggallah di kota ini
  rationale: Dalam konteks ini καθίζω bermakna menetap atau menunggu, bukan sekadar duduk. 'Ini' membuat rujukan kontekstual pada Yerusalem alami dalam bahasa Indonesia tanpa menyebut nama yang tidak ada dalam ayat.
- source_word: ἐνδύσησθε
  choice: diperlengkapi
  rationale: Metafora harfiahnya adalah 'dikenakan/dipakaikan', tetapi dalam bahasa Indonesia 'diperlengkapi dengan kuasa' lebih alami dan tetap menyatakan kuasa yang diberikan dari luar diri mereka.
- source_word: ἐξ ὕψους
  choice: dari tempat tinggi
  rationale: Mempertahankan ungkapan spasial-metaforis Yunani dan tidak mempersempitnya secara eksplisit menjadi 'surga'.
theological_decisions:
- issue: Identitas 'janji Bapa'
  choice: Tidak menambahkan 'Roh Kudus' dalam teks utama
  alternative: Menuliskan 'Roh Kudus yang dijanjikan Bapa-Ku'
  rationale: Konteks Lukas-Kisah Para Rasul mengaitkannya dengan Roh Kudus, tetapi ayat ini sendiri memakai ungkapan 'janji Bapa-Ku'; mempertahankannya menghindari penjelasan tafsiran di dalam teks.
- issue: Aspek waktu ἐξαποστέλλω
  choice: akan mengirimkan
  alternative: sedang mengirimkan
  rationale: Peristiwa yang dimaksud masih dinantikan sampai para murid menerima kuasa; bentuk futuratif Indonesia menjaga hubungan itu tanpa menyangkal kepastian tindakan Yesus.
- issue: Metafora mengenakan kuasa
  choice: diperlengkapi dengan kuasa
  alternative: dikenakan kuasa
  rationale: Pilihan utama lebih mudah dipahami dalam bahasa Indonesia modern, sedangkan bentuk pasif tetap menjaga bahwa kuasa itu diterima, bukan dihasilkan sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Aku' dan 'Bapa-Ku' mengikuti kebiasaan penerjemahan tuturan Yesus; 'kalian' dipakai untuk menandai bentuk jamak ὑμᾶς secara jelas.
