review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk τὴν ἐπαγγελίαν τοῦ πατρός μου. Draf mengalihkannya menjadi "apa yang dijanjikan Bapa-Ku," yang secara umum dapat dipahami, tetapi menggeser nomina "janji" menjadi uraian tentang objek yang dijanjikan. "Janji Bapa-Ku" lebih langsung mencerminkan teks Yunani dan jejak audit bahasa Inggris. Bentuk futuratif "akan mengirimkan" dapat diterima dalam konteks tindakan yang segera dan pasti akan terjadi. "Diperlengkapi dengan kuasa" merupakan pengalihan idiomatis yang baik atas metafora "dikenakan"; asal kuasa "dari tempat tinggi" tetap dipertahankan tanpa penafsiran tambahan.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan modern. "Lihatlah," "Bapa-Ku," dan "kalian" sesuai dengan register tuturan Yesus dalam draf. "Tinggallah di kota itu" menyampaikan artikel definit dalam ἐν τῇ πόλει tanpa menambahkan nama kota atau deiksis "ini" yang tidak dinyatakan dalam ayat.
  terminology: '"Janji Bapa-Ku" mempertahankan istilah penting ἐπαγγελία tanpa mengidentifikasikannya secara eksplisit sebagai Roh Kudus. "Kuasa dari tempat tinggi" mempertahankan ambiguitas dan citra spasial ἐξ ὕψους, tanpa menggantinya dengan "surga."'
  issues:
  - severity: medium
    issue: '"apa yang dijanjikan Bapa-Ku" menggantikan "janji Bapa-Ku."'
    rationale: Yunani memakai nomina ἐπαγγελίαν ("janji"), bukan frasa yang berfokus pada isi atau objek janji. Penggantian langsung mempertahankan bentuk dan istilah sumber dengan lebih baik.
  - severity: low
    issue: '"di kota ini" menambahkan deiksis yang tidak eksplisit dalam teks sumber.'
    rationale: Artikel definit τῇ menunjuk pada kota yang dikenal dalam konteks, bukan secara khusus demonstratif "ini." "Di kota itu" lebih netral dalam bahasa Indonesia.
  revised_text: Dan lihatlah, Aku akan mengirimkan janji Bapa-Ku kepada kalian. Namun, tinggallah di kota itu sampai kalian diperlengkapi dengan kuasa dari tempat tinggi.
