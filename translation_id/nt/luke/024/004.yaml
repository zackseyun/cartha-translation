  source_fidelity: Teks Indonesia dengan setia menyampaikan fungsi temporal ἐν τῷ ἀπορεῖσθαι, keadaan bingung yang dinyatakan ἀπορεῖσθαι, rujukan περὶ τούτου, serta kehadiran dekat dari ἐπέστησαν αὐταῖς. “Tiba-tiba” secara wajar menyampaikan penanda perhatian ἰδού dalam narasi Indonesia, sedangkan formula ἐγένετο terserap secara idiomatis dalam konstruksi peristiwa yang diperkenalkan oleh “Ketika …, tiba-tiba …”. “Dua orang laki-laki” mempertahankan ἄνδρες δύο tanpa mengidentifikasi mereka lebih jauh. Terjemahan utama untuk pakaian yang bercahaya setia, dan catatan kaki mempertahankan citra kilat eksplisit dari ἀστραπτούσῃ.
  naturalness: Kalimatnya jelas, modern, dan mengalir alami dalam bahasa Indonesia standar. “Sedang kebingungan mengenai hal itu,” “berdiri di dekat mereka,” dan “pakaian yang berkilau menyilaukan” sesuai dengan register naratif yang bermartabat tanpa terasa kuno.
  terminology: Istilah yang dipilih tepat dan tidak memaksakan penafsiran teologis. “Dua orang laki-laki” mengikuti penyajian naratif Yunani, bukan “dua malaikat.” Catatan kaki berjangkar tepat pada [a] dan memberi alternatif literal yang relevan.
