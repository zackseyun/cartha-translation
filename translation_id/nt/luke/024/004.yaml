id: LUK.24.4
reference: Luke 24:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: id
  text: Ketika mereka sedang kebingungan mengenai hal itu, tiba-tiba dua orang laki-laki berdiri di dekat mereka dengan pakaian yang berkilau menyilaukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dengan pakaian yang berkilat seperti kilat.”'
    reason: Mempertahankan citra eksplisit dari ἀστραπτούσῃ, yang dalam teks utama diterjemahkan secara lebih alami sebagai kilauan yang menyilaukan.
lexical_decisions:
- source_word: ἐγένετο
  choice: Ketika …, tiba-tiba …
  rationale: Formula naratif Lukas ini dipadukan secara alami dengan penanda perhatian καὶ ἰδού. Susunan tersebut memperkenalkan kejadian baru tanpa memakai ungkapan Indonesia yang kaku atau kuno seperti “terjadilah.”
- source_word: ἐν τῷ ἀπορεῖσθαι
  choice: ketika mereka sedang kebingungan
  rationale: Konstruksi infinitif artikular dengan ἐν menyatakan waktu, sedangkan ἀπορέω menunjukkan keadaan bingung atau tidak tahu harus memahami keadaan itu bagaimana, bukan sekadar merasa heran.
- source_word: αὐτὰς
  choice: mereka
  rationale: Kata ganti ini merujuk kepada para perempuan dalam konteks sebelumnya. Bahasa Indonesia dapat mempertahankan kata ganti tanpa mengulang antesedennya.
- source_word: περὶ τούτου
  choice: mengenai hal itu
  rationale: Ungkapan ini secara langsung menunjuk kepada keadaan yang baru saja diceritakan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἰδού
  choice: tiba-tiba
  rationale: Dalam konteks naratif ini, ἰδού menarik perhatian kepada kemunculan yang mendadak. “Tiba-tiba” menyampaikan fungsi wacananya secara alami, meskipun bukan padanan leksikal harfiah.
- source_word: ἄνδρες δύο
  choice: dua orang laki-laki
  rationale: ἀνήρ secara khusus berarti laki-laki. Terjemahan ini mengikuti cara narasi memperkenalkan kedua sosok tersebut tanpa lebih dahulu menyebut mereka malaikat.
- source_word: ἐπέστησαν αὐταῖς
  choice: berdiri di dekat mereka
  rationale: ἐφίστημι di sini menggambarkan kehadiran dekat atau berdiri di sisi seseorang. Pilihan ini mempertahankan unsur ruang dan tidak menambahkan penafsiran “menampakkan diri.”
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: dengan pakaian yang berkilau menyilaukan
  rationale: ἐσθής berarti pakaian, sedangkan ἀστράπτω menggambarkan kilauan terang seperti kilat. Ungkapan utama dibuat alami dalam bahasa Indonesia, sementara citra kilat yang lebih harfiah dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Identitas kedua sosok
  choice: dua orang laki-laki
  alternative: dua malaikat
  rationale: Ayat ini sendiri menyebut mereka ἄνδρες δύο, “dua orang laki-laki.” Meskipun konteks yang lebih luas menunjukkan bahwa mereka adalah utusan surgawi, terjemahan tidak memasukkan identifikasi itu sebelum narasi menyatakannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat menghindari formula naratif yang terasa kuno, tetapi tetap mempertahankan kebingungan para perempuan, kemunculan mendadak kedua laki-laki, kedekatan posisi mereka, dan kecemerlangan pakaiannya.
