revisions:
- from: Lalu salah seorang dari mereka, yang bernama Kleopas, menjawab Dia, “Apakah Engkau satu-satunya pendatang di Yerusalem yang tidak mengetahui apa yang terjadi di sana selama beberapa hari ini?”
  to: Lalu salah seorang dari mereka, yang bernama Kleopas, menjawab dan berkata kepada-Nya, “Apakah Engkau satu-satunya orang asing yang tinggal di Yerusalem dan tidak mengetahui apa yang telah terjadi di sana pada hari-hari ini?”
  rationale: Revisi menghilangkan tambahan makna “beberapa,” memperbaiki kelancaran sintaksis Indonesia, dan menyatakan nuansa παροικεῖς dengan lebih tepat. Bentuk “telah terjadi” sesuai dengan peristiwa-peristiwa yang baru berlangsung dan hasil ketidaktahuan yang sedang dipersoalkan.
