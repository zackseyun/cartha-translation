source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: id
  text: Lalu salah seorang dari mereka, yang bernama Kleopas, menjawab dan berkata kepada-Nya, “Apakah Engkau satu-satunya orang asing yang tinggal di Yerusalem dan tidak mengetahui apa yang telah terjadi di sana pada hari-hari ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Lalu ... menjawab
  rationale: Partisip aoris dan penghubung δέ dialihkan menjadi urutan naratif yang wajar dalam bahasa Indonesia tanpa memberi kesan pertentangan yang kuat.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: salah seorang dari mereka, yang bernama Kleopas
  rationale: Konteks menunjukkan bahwa εἷς adalah seorang dari kedua murid itu; ὀνόματι memperkenalkan namanya.
- source_word: εἶπεν πρὸς αὐτόν
  choice: menjawab Dia
  rationale: Dalam bahasa Indonesia, unsur 'berkata kepada-Nya' dapat dipadukan secara alami dengan ἀποκριθείς menjadi 'menjawab Dia', tetap mempertahankan acuan kepada Yesus tanpa menyebut nama yang tidak eksplisit dalam ayat.
- source_word: Σὺ μόνος
  choice: Engkau satu-satunya
  rationale: Menjaga penekanan eksklusif μόνος dalam bentuk pertanyaan yang alami.
- source_word: παροικεῖς
  choice: pendatang di
  rationale: Kata ini menunjuk pada tinggal atau berada di suatu tempat sebagai orang luar atau penghuni sementara. 'Pendatang' mempertahankan nuansa orang luar lebih baik daripada sekadar 'tinggal' atau 'berkunjung'.
- source_word: οὐκ ἔγνως
  choice: tidak mengetahui
  rationale: Aoris di sini menyatakan ketidaktahuan terhadap peristiwa yang baru terjadi; bentuk Indonesia ini menyampaikan keadaan tersebut secara wajar.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: apa yang terjadi di sana
  rationale: Ungkapan substantival diterjemahkan secara idiomatis, dengan 'di sana' merujuk kembali kepada Yerusalem.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: selama beberapa hari ini
  rationale: Menyampaikan rujukan pada hari-hari yang baru saja berlangsung secara alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan kepada Yesus memakai 'Engkau' dan acuan naratif memakai 'Dia'. Nuansa παροικεῖς sebagai keberadaan orang luar atau penghuni sementara dipertahankan melalui 'pendatang'.
