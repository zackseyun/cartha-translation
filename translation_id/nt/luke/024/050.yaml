review_pass:
  verdict: revise
  source_fidelity: Teks draf dengan tepat menerjemahkan ἐξήγαγεν sebagai tindakan membawa keluar, mempertahankan nama Betania, dan menerjemahkan εὐλόγησεν secara langsung sebagai “memberkati.” Namun, “sampai ke arah Betania” terlalu harfiah dan kurang idiomatis sebagai teks utama bahasa Indonesia. Gabungan ἕως πρὸς Βηθανίαν menunjukkan batas perjalanan ke arah/sekitar Betania, tanpa perlu memastikan bahwa mereka tiba di dalam desa itu.
  naturalness: “Sampai ke arah Betania” tidak lazim dalam narasi Indonesia modern. “Hingga dekat Betania” alami dan menyampaikan nuansa lokasi yang tidak terlalu pasti; alternatif yang lebih harfiah dipelihara dalam catatan kaki. Menggabungkan tindakan mengangkat tangan dengan pemberkatan dalam satu kalimat juga lebih mengalir dan tetap setia kepada partisip ἐπάρας.
  terminology: “Betania” dan “memberkati” sudah tepat, baku, dan sesuai dengan penggunaan Alkitab bahasa Indonesia. “Kedua tangannya” dengan tepat mempertahankan bentuk jamak χεῖρας tanpa menambah makna teologis.
  issues:
  - severity: medium
    issue: Ungkapan lokasi “sampai ke arah Betania” terdengar tidak alami dalam bahasa Indonesia modern.
    rationale: Walaupun mencerminkan πρός secara harfiah, frasa ini tidak lazim sebagai tujuan perjalanan dalam bahasa Indonesia. “Hingga dekat Betania” menyampaikan kemungkinan bahwa lokasi itu berada di sekitar Betania, sedangkan catatan kaki dapat menjaga alternatif “hingga ke Betania” dan bentuk harfiah Yunani.
  revised_text: Lalu ia membawa mereka keluar hingga dekat Betania[a]. Sambil mengangkat kedua tangannya, ia memberkati mereka.
  revised_footnotes:
