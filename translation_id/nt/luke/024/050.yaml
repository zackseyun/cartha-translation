  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: id
  text: Lalu ia membawa mereka keluar hingga dekat Betania[a]. Sambil mengangkat kedua tangannya, ia memberkati mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hingga ke Betania”; secara harfiah, “hingga ke arah Betania.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: membawa ... keluar
  rationale: Kata kerja ἐξάγω menyatakan tindakan membawa atau menuntun keluar. Dalam konteks ini, “membawa mereka keluar” alami dalam bahasa Indonesia dan tetap mempertahankan unsur gerak ke luar.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan alur cerita, bukan pertentangan yang kuat. “Lalu” menyampaikan peralihan naratif itu secara wajar.
- source_word: ἕως πρὸς Βηθανίαν
  choice: sampai ke arah Betania
  rationale: Gabungan ἕως πρός menyatakan batas gerak menuju atau sampai di sekitar Betania. Terjemahan ini mempertahankan ungkapan sumber yang agak lebih lengkap tanpa memastikan apakah mereka masuk ke desa itu.
- source_word: Βηθανίαν
  choice: Betania
  rationale: Bentuk nama tempat yang sudah lazim dalam bahasa Indonesia.
- source_word: ἐπάρας
  choice: mengangkat
  rationale: Partisip aoris ini menggambarkan tindakan yang mendahului atau menyertai pemberkatan. Bentuk verbal koordinatif menghasilkan bahasa Indonesia yang alami.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: kedua tangannya
  rationale: Bentuk jamak χεῖρας menunjuk pada tangan-tangannya; “kedua tangannya” merupakan ungkapan Indonesia yang alami untuk gestur mengangkat tangan saat memberkati.
- source_word: εὐλόγησεν
  choice: memberkati
  rationale: εὐλογέω di sini menyatakan tindakan Yesus memberikan atau mengucapkan berkat kepada para murid. “Memberkati” adalah padanan langsung dan tidak menambahkan rumusan liturgis tertentu.
- source_word: αὐτούς
  choice: mereka
  rationale: Pronomina objek ini merujuk kepada para murid dalam konteks.
theological_decisions:
- issue: Sifat tindakan Yesus ketika memberkati para murid
  choice: ia ... memberkati mereka
  alternative: ia mengucapkan berkat atas mereka
  rationale: Ungkapan sederhana ini mempertahankan tindakan pemberkatan beserta gestur tangan yang terangkat, tanpa memasukkan kategori jabatan atau rumusan liturgis yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pronomina untuk Yesus ditulis dengan huruf kecil sesuai kaidah umum, tanpa menjadikannya penanda teologis. Susunan kalimat dibuat alami sambil mempertahankan ketidakpastian ungkapan lokasi Yunani melalui teks utama dan catatan kaki.
