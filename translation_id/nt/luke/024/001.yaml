  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: id
  text: Namun, pada hari pertama minggu itu[a], pagi-pagi sekali ketika fajar menyingsing, mereka datang ke makam dengan membawa rempah-rempah yang telah mereka siapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pada hari pertama dari sabat-sabat”; ini adalah ungkapan idiomatis yang berarti hari pertama minggu itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Namun, pada hari pertama minggu itu
  rationale: Ungkapan Semitis/Yunani Koine ini secara idiomatis berarti hari pertama dalam sepekan. Bentuk ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan adanya beberapa hari Sabat.
- source_word: ὄρθρου βαθέως
  choice: pagi-pagi sekali saat fajar menyingsing
  rationale: ὄρθρου menunjuk waktu fajar, sedangkan βαθέως memperkuat arti sangat dini. Ungkapan Indonesia ini mempertahankan kedua unsur tersebut secara alami.
- source_word: ἐπὶ τὸ μνῆμα
  choice: ke makam
  rationale: Dengan verba gerak, ἐπί menyatakan arah menuju tempat tersebut; μνῆμα dalam konteks penguburan paling tepat diterjemahkan sebagai 'makam'.
- source_word: ἦλθον
  choice: mereka datang
  rationale: Aoris ini melaporkan gerakan atau kedatangan mereka ke makam secara lugas.
- source_word: φέρουσαι
  choice: dengan membawa
  rationale: Partisipel ini menyatakan tindakan yang berlangsung bersamaan dengan kedatangan mereka.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: rempah-rempah yang telah mereka siapkan
  rationale: ἀρώματα merujuk pada bahan-bahan harum untuk pengurusan jenazah. Susunan ini alami dalam bahasa Indonesia dan bentuk 'telah ... siapkan' menunjukkan persiapan yang sudah dilakukan sebelumnya.
theological_decisions:
- issue: Idiom waktu τῇ μιᾷ τῶν σαββάτων dalam konteks kebangkitan
  choice: pada hari pertama minggu itu
  alternative: pada hari pertama dari Sabat-Sabat
  rationale: Terjemahan utama menyampaikan makna idiomatis normal tanpa memasukkan klaim kronologis atau kalender sektarian. Bentuk harfiah dicatat dalam catatan kaki agar ciri bahasa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Makam' dipilih daripada 'kubur' untuk μνῆμα, sedangkan 'pagi-pagi sekali saat fajar menyingsing' menyampaikan intensitas ὄρθρου βαθέως tanpa ungkapan harfiah yang janggal.
