  language: id
  text: Namun, ketika mereka masuk, mereka tidak menemukan tubuh itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “tubuh Tuhan Yesus.”
