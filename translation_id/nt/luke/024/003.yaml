lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: ketika masuk
  rationale: Partisip aoris aktif feminin jamak ini merujuk kepada para perempuan dan secara alami menyatakan waktu dalam bahasa Indonesia. Subjek 'mereka' tersirat dan dinyatakan pada klausa utama.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini melanjutkan narasi sekaligus memberi kontras ringan dengan harapan mereka ketika tiba di makam.
- source_word: οὐχ εὗρον
  choice: mereka tidak menemukan
  rationale: Terjemahan langsung dan wajar untuk verba aoris yang dinegasikan, dengan daya naratif sederhana.
- source_word: τὸ σῶμα
  choice: jenazah itu
  rationale: Dalam konteks makam, 'jenazah' merupakan padanan Indonesia yang alami bagi tubuh orang yang telah meninggal; kata tunjuk 'itu' menyampaikan artikel tertentu Yunani tanpa menambahkan identitas yang tidak terdapat dalam teks utama.
theological_decisions:
- issue: Apakah identitas jenazah perlu disebutkan secara eksplisit
  choice: jenazah itu
  alternative: jenazah Tuhan Yesus
  rationale: Teks SBLGNT yang diberikan hanya memuat τὸ σῶμα. Bacaan yang lebih panjang tidak dimasukkan ke dalam teks utama, tetapi dicatat sebagai varian agar bukti naskah tetap transparan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Namun' menjaga kontras naratif, sedangkan 'jenazah' sesuai dengan konteks makam dan mudah dipahami pembaca umum.
