  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Omong kosong' dipakai sebagai ungkapan umum yang tegas tetapi tidak kasar; pengulangan 'perkataan-perkataan' mempertahankan bentuk jamak sumber.
