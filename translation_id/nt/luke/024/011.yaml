  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: id
  text: Perkataan itu tampak seperti omong kosong bagi mereka,[a] dan mereka tidak percaya kepada para perempuan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti cerita yang tidak masuk akal” atau “seperti igauan.” Kata Yunani λῆρος menunjuk pada perkataan yang dianggap tidak masuk akal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: tampak
  rationale: Dalam konstruksi evaluatif dengan ὡσεὶ λῆρος, verba ini menyatakan penilaian—'tampak' atau 'terasa'—bukan penampakan visual.
- source_word: ἐνώπιον αὐτῶν
  choice: bagi mereka
  rationale: Secara harfiah berarti 'di hadapan mereka', tetapi dalam konteks penilaian, 'bagi mereka' menyampaikan sudut pandang secara wajar dalam bahasa Indonesia.
- source_word: ὡσεὶ λῆρος
  choice: seperti omong kosong
  rationale: λῆρος menunjuk pada perkataan yang dianggap tidak masuk akal, absurd, atau seperti igauan; 'omong kosong' jelas dan alami, sedangkan ὡσεὶ dipertahankan dengan 'seperti'.
- source_word: τὰ ῥήματα ταῦτα
  choice: perkataan-perkataan itu
  rationale: Terjemahan langsung yang tetap alami bagi frasa demonstratif ini dan tidak mengubahnya menjadi istilah yang lebih interpretatif seperti 'laporan'.
- source_word: ἠπίστουν
  choice: tidak memercayai
  rationale: Menyampaikan ketidakpercayaan yang berlangsung pada masa lampau tanpa menambahkan unsur kehendak seperti dalam 'menolak untuk percaya'.
- source_word: αὐταῖς
  choice: perempuan-perempuan itu
  rationale: Pronomina feminin jamak ini merujuk kepada para perempuan dalam konteks sebelumnya; penyebutan eksplisit menjaga rujukannya jelas dalam bahasa Indonesia.
