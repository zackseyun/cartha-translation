revisions:
- from: Lalu beberapa orang dari antara kami pergi ke makam itu dan mendapati keadaannya tepat seperti yang telah dikatakan para perempuan itu, tetapi mereka tidak melihat Dia.
  to: Lalu, beberapa orang yang bersama kami pergi ke makam itu dan mendapati keadaan di sana seperti yang dikatakan para perempuan itu, tetapi mereka tidak melihat Dia.
  rationale: Revisi membetulkan acuan partitif agar selaras dengan τῶν σὺν ἡμῖν. Penyesuaian "keadaan di sana" mempertahankan rujukan umum οὕτως ("demikian/seperti itu") tanpa menguraikan atau mengharmoniskan unsur-unsur laporan para perempuan. Kontras δέ dan objek αὐτόν tetap dipertahankan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:23:22Z'
review_pass:
  verdict: revise
  source_fidelity: Frasa "beberapa orang dari antara kami" tidak sepenuhnya mencerminkan τινες τῶν σὺν ἡμῖν, yang secara khusus menunjuk kepada sebagian orang yang bersama para penutur, bukan niscaya sebagian dari para penutur sendiri. Selebihnya, hubungan antara keadaan makam yang didapati dan laporan para perempuan, serta kontras bahwa mereka tidak melihat Yesus, tersampaikan dengan setia.
  naturalness: Kalimat draf secara umum baku dan mengalir. Namun, "beberapa orang yang bersama kami" lebih alami sekaligus lebih tepat daripada "beberapa orang dari antara kami." "Keadaan di sana" membuat objek dari "mendapati" jelas dalam bahasa Indonesia tanpa menentukan secara berlebihan rincian keadaan makam.
  terminology: '"Makam" tepat untuk μνημεῖον dalam konteks ini. "Para perempuan" sesuai dengan αἱ γυναῖκες, dan "Dia" secara jelas mempertahankan rujukan pronominal kepada Yesus tanpa menambahkan nama. Tidak diperlukan catatan kaki.'
  issues:
  - severity: medium
    issue: '"dari antara kami" menggeser kelompok yang dirujuk'
    rationale: τινες τῶν σὺν ἡμῖν berarti "beberapa orang yang bersama kami" atau "beberapa dari orang-orang yang bersama kami." Terjemahan "beberapa orang dari antara kami" lazimnya berarti "beberapa dari kami," sehingga dapat memasukkan para penutur sebagai kelompok acuan, bukan kelompok pendamping yang disebut teks Yunani.
  revised_text: Lalu, beberapa orang yang bersama kami pergi ke makam itu dan mendapati keadaan di sana seperti yang dikatakan para perempuan itu, tetapi mereka tidak melihat Dia.
