  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: id
  text: Lalu, beberapa orang yang bersama kami pergi ke makam itu dan mendapati keadaan di sana seperti yang dikatakan para perempuan itu, tetapi mereka tidak melihat Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: pergi
  rationale: Bentuk aoris ini menuturkan gerak menuju makam secara lugas; “pergi” alami dalam bahasa Indonesia dan tidak terlalu menekankan tindakan meninggalkan tempat asal.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: beberapa orang dari antara kami
  rationale: Ungkapan ini menyatakan sebagian dari kelompok yang bersama para penutur, dengan tetap mempertahankan struktur partitif bahasa Yunani.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ke makam itu
  rationale: Dalam konteks pemakaman dan kebangkitan Yesus, μνημεῖον menunjuk pada tempat jenazah-Nya dibaringkan; “makam” adalah padanan Indonesia yang tepat dan lazim.
- source_word: εὗρον
  choice: mendapati
  rationale: Kata ini berarti menemukan atau mendapati. “Mendapati” sesuai karena yang dijumpai ialah suatu keadaan yang cocok dengan laporan sebelumnya.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: keadaannya tepat seperti yang telah dikatakan para perempuan itu
  rationale: οὕτως καθὼς menyatakan kesesuaian antara keadaan di makam dan laporan para perempuan. “Telah dikatakan” memperjelas urutan peristiwa tanpa mengubah isinya; καί tidak perlu diterjemahkan tersendiri karena unsur perbandingannya sudah jelas.
- source_word: αὐτὸν
  choice: Dia
  rationale: Pronomina ini merujuk kepada Yesus. Pronomina dipertahankan agar kohesi teks Yunani tidak diganti dengan penyebutan nama secara eksplisit.
- source_word: δὲ
  choice: tetapi
  rationale: Partikel ini menandai kontras antara kesesuaian keadaan makam dengan laporan para perempuan dan kenyataan bahwa Yesus sendiri tidak terlihat.
- source_word: οὐκ εἶδον
  choice: mereka tidak melihat
  rationale: Kata kerjanya adalah ὁράω, “melihat,” bukan “menemukan.” Subjek tersiratnya tetap beberapa orang yang pergi ke makam.
theological_decisions:
- issue: Penyampaian kisah kebangkitan
  choice: Ayat ini menyatakan bahwa orang-orang yang pergi ke makam mendapati keadaan sesuai dengan laporan para perempuan, tetapi tidak melihat Yesus sendiri.
  alternative: Menjelaskan secara khusus unsur mana dari laporan para perempuan yang mereka pastikan atau menyelaraskannya dengan rincian kisah lain.
  rationale: Terjemahan mempertahankan pembedaan naratif dalam bahasa Yunani tanpa memasukkan rincian atau harmonisasi dari bagian lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lalu” menjaga alur narasi; “dari antara kami” mempertahankan nuansa partitif; kapitalisasi “Dia” mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Yesus tanpa menambahkan nama yang tidak terdapat dalam teks.
