  naturalness: “Perempuan-perempuan itu ialah” dan “Mereka memberitahukan hal-hal itu” adalah bahasa Indonesia standar modern yang lebih lancar dalam narasi daripada “adalah” dan “terus menyampaikan”. Koma pada “Maria, ibu Yakobus” memperjelas aposisi nama dan hubungan.
  terminology: Maria Magdalena, Yohana, Yakobus, dan rasul konsisten dengan penggunaan Alkitab bahasa Indonesia yang lazim. Catatan kaki mempertahankan ketidakjelasan genitif Yunani tanpa memastikan hubungan yang tidak dinyatakan teks.
