id: LUK.24.10
reference: Luke 24:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: id
  text: Perempuan-perempuan itu ialah Maria Magdalena, Yohana, Maria, ibu Yakobus[a], dan perempuan-perempuan lain yang bersama mereka. Mereka memberitahukan hal-hal itu kepada para rasul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi “Maria dari Yakobus”. Kemungkinan besar maksudnya “Maria, ibu Yakobus”, tetapi dapat juga berarti “Maria, istri Yakobus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Perempuan-perempuan itu adalah
  rationale: Bentuk jamak imperfek memperkenalkan identitas para perempuan yang disebut dalam konteks. Kata δέ merupakan penghubung naratif ringan dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia karena kesinambungan wacananya sudah jelas.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Maria Magdalena
  rationale: Bentuk nama yang baku dan alami dalam bahasa Indonesia.
- source_word: Ἰωάννα
  choice: Yohana
  rationale: Transliterasi nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Maria ibu Yakobus[a]
  rationale: Genitif Yunani ini bersifat eliptis, secara harfiah 'Maria milik/dari Yakobus'. Hubungan sebagai ibu paling mungkin menurut pola penamaan dalam Injil, tetapi ambiguitas sumber dipertahankan dalam catatan kaki.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: perempuan-perempuan lain yang bersama mereka
  rationale: Artikel dan adjektiva berbentuk feminin jamak; penambahan nomina 'perempuan-perempuan' membuat rujukannya jelas dan alami.
- source_word: ἔλεγον
  choice: terus menyampaikan
  rationale: Imperfek menggambarkan tindakan yang sedang berlangsung atau berulang; 'terus menyampaikan' mempertahankan nuansa aspek itu.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: kepada para rasul
  rationale: '''Rasul'' adalah padanan baku dan tepat bagi ἀπόστολος dalam konteks kelompok utusan Yesus.'
- source_word: ταῦτα
  choice: semuanya itu
  rationale: Ungkapan ini merujuk secara jamak kepada berbagai kejadian dan pesan yang baru dilaporkan; 'semuanya itu' alami dalam bahasa Indonesia dan mempertahankan cakupan jamaknya.
theological_decisions:
- issue: Identitas hubungan dalam Μαρία ἡ Ἰακώβου
  choice: Maria ibu Yakobus
  alternative: Maria dari Yakobus; Maria istri Yakobus
  rationale: Bahasa Yunani hanya menyatakan hubungan dengan Yakobus tanpa menyebut jenis hubungannya. Berdasarkan pola penyebutan tokoh dalam Injil, 'ibu Yakobus' paling mungkin dan paling jelas dalam bahasa Indonesia, sedangkan kemungkinan 'istri Yakobus' tetap dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang jelas dan bermartabat. Pengulangan 'perempuan-perempuan' dipertahankan demi kejelasan rujukan, sedangkan aspek imperfek pada verba pelaporan dinyatakan dengan 'terus menyampaikan'.
