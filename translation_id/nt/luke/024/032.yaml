  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: id
  text: Mereka berkata satu sama lain, “Bukankah hati kita berkobar-kobar ketika Ia berbicara kepada kita di jalan, ketika Ia membukakan Kitab Suci kepada kita?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: seorang kepada yang lain
  rationale: Ungkapan timbal balik yang alami dalam bahasa Indonesia dan sesuai dengan percakapan kedua murid.
- source_word: Οὐχὶ
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban ya.
- source_word: ἡ καρδία ἡμῶν
  choice: hati kita
  rationale: Mempertahankan bentuk tunggal kolektif dalam bahasa Yunani, yang juga wajar dalam bahasa Indonesia.
- source_word: καιομένη
  choice: berkobar-kobar
  rationale: Mempertahankan metafora api dan menyampaikan keadaan yang berlangsung tanpa membatasinya pada emosi atau pencerahan tertentu.
- source_word: ἐν ἡμῖν
  choice: di dalam diri kita
  rationale: Mengungkapkan pengalaman batin secara alami sekaligus mempertahankan makna lokatif internal.
- source_word: ἐλάλει
  choice: berbicara
  rationale: Dalam konstruksi dengan ketika, bahasa Indonesia secara alami menyampaikan tindakan yang sedang berlangsung tanpa penanda aspek tambahan.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Padanan konkret dan alami yang sesuai dengan konteks perjalanan menuju Emaus.
- source_word: διήνοιγεν
  choice: membukakan
  rationale: Mempertahankan metafora διανοίγω, yakni membuka sehingga dapat dipahami, tanpa menggantinya dengan tafsiran eksplisit dalam teks utama.
- source_word: τὰς γραφάς
  choice: Kitab Suci
  rationale: Istilah baku bahasa Indonesia untuk kumpulan tulisan suci yang dimaksud dalam konteks ini.
theological_decisions:
- issue: Daya metaforis hati yang terbakar
  choice: hati kita berkobar-kobar
  alternative: hati kita sangat tersentuh; kita merasa tercerahkan
  rationale: Teks tidak menentukan apakah pengalaman itu terutama bersifat emosional, rohani, atau kognitif; metafora api dipertahankan agar ketegangan maknanya tidak diselesaikan secara sepihak.
- issue: Makna membukakan Kitab Suci
  choice: mempertahankan metafora “membukakan”
  alternative: menjelaskan arti Kitab Suci
  rationale: διανοίγω menggambarkan tindakan membuka; konteks menyiratkan penjelasan atau penyingkapan makna, tetapi terjemahan utama tidak perlu mempersempit metafora itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pertanyaan retoris, bentuk tunggal kolektif “hati kita,” serta metafora “berkobar-kobar” dan “membukakan.”
