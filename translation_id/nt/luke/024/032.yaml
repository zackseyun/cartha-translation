  terminology: “Hati kita,” “berkobar-kobar,” dan “Kitab Suci” merupakan pilihan yang baik dan baku. “Membukakan Kitab Suci” mempertahankan metafora διανοίγω tanpa memaksakan penafsiran mengenai jenis pengalaman batin itu.
