  text: τότε διήνοιξεν αὐτῶν τὸν νοῦν τοῦ συνιέναι τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/045.yaml
  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: id
  text: Lalu Ia membuka pikiran mereka supaya mereka memahami Kitab Suci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Lalu
  rationale: Menandai urutan dalam narasi secara ringkas dan alami dalam bahasa Indonesia.
- source_word: διήνοιξεν
  choice: membuka
  rationale: Mempertahankan metafora konkret verba διανοίγω tanpa menguraikannya menjadi sekadar 'memampukan' atau 'menjelaskan'.
- source_word: αὐτῶν τὸν νοῦν
  choice: pikiran mereka
  rationale: νοῦς menunjuk pada kemampuan memahami atau mempersepsi; 'pikiran mereka' alami dalam bahasa Indonesia dan tetap menjadi objek konkret dari 'membuka'.
- source_word: τοῦ συνιέναι
  choice: supaya mereka memahami
  rationale: Infinitif berartikel ini dapat menyatakan tujuan atau hasil. Bentuk ini alami serta mempertahankan nuansa tujuan tanpa memastikan secara berlebihan batas antara tujuan dan hasil.
- source_word: τὰς γραφάς
  choice: Kitab Suci
  rationale: Dalam konteks Lukas-Kisah Para Rasul, bentuk jamak ini merujuk pada tulisan-tulisan suci Israel; ungkapan baku Indonesia 'Kitab Suci' menyampaikan referen kolektif tersebut.
theological_decisions:
- issue: Sifat tindakan Yesus dalam membuka pemahaman
  choice: Ia membuka pikiran mereka
  alternative: Ia memampukan mereka untuk memahami; Ia menjelaskan Kitab Suci kepada mereka
  rationale: Teks Yunani secara langsung menyatakan bahwa Ia membuka pikiran mereka untuk memahami Kitab Suci. Terjemahan mempertahankan pernyataan itu tanpa menambahkan penjelasan doktrinal tentang iluminasi atau mereduksinya menjadi tindakan mengajar semata.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Lalu' menjaga alur naratif, sedangkan 'supaya mereka memahami' terdengar alami bagi pembaca umum.
