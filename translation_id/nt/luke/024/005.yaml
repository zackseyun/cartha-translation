  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: id
  text: Ketika para perempuan itu menjadi sangat takut dan menundukkan wajah mereka ke tanah, kedua orang itu berkata kepada mereka, “Mengapa[a] kalian mencari Dia yang hidup di antara orang-orang mati?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, pertanyaan ini berbunyi, “Apa yang kalian cari: Dia yang hidup bersama orang-orang mati?” Dalam bahasa Yunani, bentuk pertanyaan ini secara idiomatis mempertanyakan alasan pencarian itu; karena itu terjemahan utama berbunyi, “Mengapa kalian mencari Dia yang hidup di antara orang-orang mati?”'
    reason: Menjelaskan kemungkinan arti harfiah τί (“apa”) dan μετά (“bersama”), serta alasan terjemahan idiomatis dalam teks utama.
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: menjadi sangat ketakutan
  rationale: Ungkapan ini menyatakan perubahan keadaan menuju rasa takut yang kuat; kata “sangat” menyampaikan intensitas ἔμφοβος secara wajar dalam bahasa Indonesia.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: menundukkan wajah ke tanah
  rationale: Terjemahan ini mempertahankan gambaran jasmani yang konkret serta menyampaikan gerakan karena takut atau hormat dengan bahasa Indonesia yang alami.
- source_word: εἶπαν πρὸς αὐτάς
  choice: kedua orang itu berkata kepada mereka
  rationale: Konteks ayat sebelumnya menunjukkan bahwa subjeknya adalah dua orang dan objeknya perempuan-perempuan itu. Penyebutan “kedua orang itu” mencegah kerancuan rujukan kata ganti dalam bahasa Indonesia tanpa menambahkan identitas yang tidak dinyatakan teks.
- source_word: Τί ζητεῖτε
  choice: Mengapa kalian mencari
  rationale: Dalam konteks ini τί berfungsi mempertanyakan alasan atau kepantasan tindakan mereka, sehingga “mengapa” paling alami. Bentuk “kalian” menandai orang kedua jamak yang tersirat dalam ζητεῖτε.
- source_word: τὸν ζῶντα
  choice: Dia yang hidup
  rationale: Partisipel dengan artikel ini bersifat substantival, tunggal, dan menunjuk kepada pribadi tertentu. “Dia yang hidup” mempertahankan kontras personal dengan orang-orang mati.
- source_word: μετὰ τῶν νεκρῶν
  choice: di antara orang-orang mati
  rationale: μετά dengan genitif dapat berarti “bersama” atau “di antara.” Dalam konteks pencarian di makam, “di antara” merupakan ungkapan Indonesia yang paling jelas dan alami.
theological_decisions:
- issue: Implikasi kebangkitan dalam τὸν ζῶντα
  choice: Dia yang hidup
  alternative: orang yang hidup
  rationale: Pilihan ini menunjuk kepada Yesus sebagai pribadi yang hidup dalam kontras dengan orang-orang mati, tetapi tidak menambahkan penjelasan eksplisit tentang cara atau hakikat kebangkitan yang tidak terdapat dalam ayat.
- issue: Identitas dua pembicara
  choice: kedua orang itu
  alternative: mereka
  rationale: Konteks langsung menyebut dua orang, sedangkan pengulangan “mereka” dalam bahasa Indonesia akan membuat pembicara dan penerima perkataan sulit dibedakan. Pilihan ini hanya memperjelas rujukan kontekstual dan tidak menyebut mereka sebagai malaikat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perempuan-perempuan itu” dan “kedua orang itu” dipakai untuk memperjelas dua kelompok yang dalam bahasa Yunani dibedakan oleh konteks dan bentuk gramatikal. Kapitalisasi “Dia” mengikuti rujukan personal kepada Yesus tanpa menambahkan gelar kristologis.
