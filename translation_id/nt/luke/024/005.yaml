  naturalness: “Para perempuan itu” lebih alami daripada “perempuan-perempuan itu” dalam prosa Indonesia modern. “Menjadi sangat takut” juga lebih idiomatis daripada “menjadi sangat ketakutan,” sambil tetap menyampaikan intensitas ἔμφοβων. Penambahan “mereka” pada “wajah mereka” membuat objek jamak Yunani terdengar wajar dalam bahasa Indonesia.
  terminology: “Dia yang hidup” secara tepat menjaga kontras personal dengan “orang-orang mati” tanpa menguraikan doktrin di luar ayat. Kapitalisasi “Dia” konsisten dengan rujukan kontekstual kepada Yesus dan tidak mengubah makna leksikal.
