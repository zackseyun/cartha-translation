  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: id
  text: Ketika ia sedang memberkati mereka, ia berpisah dari mereka dan diangkat ke surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah tidak memuat “dan diangkat ke surga.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: terjadilah bahwa
  rationale: Mempertahankan fungsi formula naratif khas Lukas dengan bentuk Indonesia yang wajar dan bermartabat.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς
  choice: ketika ia sedang memberkati mereka
  rationale: Menyampaikan tindakan yang sedang berlangsung dan bersamaan dengan perpisahan.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: ia berpisah dari mereka
  rationale: Mengungkapkan pemisahan atau kepergian secara ringkas tanpa menambahkan cara atau jarak.
- source_word: ἀνεφέρετο
  choice: terangkat
  rationale: Menyampaikan gerak ke atas dengan nuansa pasif tanpa menentukan pelaku yang tidak disebutkan dalam teks.
- source_word: εἰς τὸν οὐρανόν
  choice: ke surga
  rationale: Dalam konteks kenaikan Yesus, οὐρανός menunjuk pada surga, bukan sekadar langit yang terlihat.
theological_decisions:
- issue: Klausa dalam kurung kritis καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Dimasukkan dalam teks utama dengan catatan varian tekstual.
  alternative: Menghilangkan klausa “dan terangkat ke surga”.
  rationale: SBLGNT menandai klausa ini sebagai tidak pasti. Klausa diterjemahkan karena terdapat dalam teks sumber yang diberikan, sementara bukti varian tetap dinyatakan agar ketidakpastian tekstual tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat mempertahankan penanda peristiwa Lukas tanpa memakai ungkapan arkais; huruf kecil pada pronomina mengikuti gaya bahasa Indonesia umum.
