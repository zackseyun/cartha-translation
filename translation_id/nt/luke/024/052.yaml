    issue: Nuansa penghubung καί
    rationale: «Lalu» dapat dibaca sebagai penanda urutan temporal yang lebih kuat, sedangkan καί terutama merupakan penghubung sederhana. «Dan» lebih dekat pada bentuk dan fungsi sumber.
  - severity: medium
    issue: Penanda catatan varian tidak melekat pada frasa yang dipersoalkan
    rationale: Catatan a menjelaskan «setelah menyembah Dia», tetapi penandanya ditempatkan setelah «mereka». Penanda perlu ditempatkan langsung sesudah frasa tersebut agar jangkar catatan jelas.
  - severity: low
    issue: Alternatif leksikal kedua kurang idiomatis
    rationale: Dalam bahasa Indonesia baku, orang «memberi penghormatan kepada-Nya», bukan «memberi-Nya penghormatan».
  revised_text: Dan mereka, setelah menyembah Dia[a][b], kembali ke Yerusalem dengan sukacita yang besar.
