  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: para murid menyembah Yesus, lalu kembali ke Yerusalem dengan sukacita besar. Namun, «Lalu» memberi nuansa urutan waktu yang lebih tegas daripada καί; «Dan» lebih langsung mempertahankan penghubung naratif Yunani. Frasa tekstual yang diperselisihkan tetap perlu dipertahankan dengan catatan varian.'
  naturalness: Kalimatnya pada dasarnya baku dan alami. Penempatan penanda catatan varian setelah «mereka» kurang tepat karena catatan itu mengenai frasa «setelah menyembah Dia». Selain itu, alternatif «memberi-Nya penghormatan» kurang idiomatis; bentuk yang wajar ialah «memberi penghormatan kepada-Nya».
  terminology: «Menyembah Dia» merupakan padanan yang layak bagi προσκυνήσαντες αὐτόν dalam konteks pascakebangkitan, tanpa menghapus kemungkinan rentang makna yang dicatat dalam catatan kaki. «Sukacita» sesuai dengan register Alkitab Indonesia yang baku dan modern.
  issues:
