  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: id
  text: Dan mereka, setelah menyembah Dia[a][b], kembali ke Yerusalem dengan sukacita yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah tidak memuat frasa “setelah menyembah Dia”.
    reason: textual_variant
  - marker: b
    text: Atau “setelah bersujud kepada-Nya” atau “setelah memberi penghormatan kepada-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Sebagai penghubung naratif, καί di sini secara alami menyambungkan tindakan berikutnya tanpa menambahkan hubungan sebab-akibat.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Pronomina eksplisit ini cukup diwakili oleh “mereka”; bentuk “mereka sendiri” akan terasa terlalu ditandai dalam bahasa Indonesia modern.
- source_word: προσκυνήσαντες αὐτόν
  choice: setelah menyembah Dia
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama. Dalam konteks Yesus yang bangkit dan terangkat, “menyembah” paling sesuai, sementara kemungkinan makna bersujud atau memberi penghormatan dicatat dalam catatan kaki.
- source_word: ὑπέστρεψαν
  choice: kembali
  rationale: Secara langsung menyampaikan tindakan kembali dan alami dalam narasi Indonesia.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Preposisi arah εἰς dengan nama kota paling wajar diterjemahkan “ke” dalam bahasa Indonesia.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: dengan sukacita yang besar
  rationale: Mempertahankan nomina χαρά dan penguatan melalui adjektiva μεγάλη dalam ungkapan Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Makna προσκυνέω yang diarahkan kepada Yesus yang bangkit
  choice: menyembah Dia
  alternative: bersujud kepada-Nya / memberi-Nya penghormatan
  rationale: Konteks pascakebangkitan dan kenaikan mendukung makna “menyembah”, tetapi rentang leksikal yang juga dapat menunjuk pada tindakan bersujud atau memberi penghormatan tetap dinyatakan dalam catatan kaki.
- issue: Frasa yang diberi tanda ketidakpastian tekstual [προσκυνήσαντες αὐτόν]
  choice: dipertahankan dalam teks utama dengan catatan varian tekstual
  alternative: dihilangkan
  rationale: Frasa terdapat dalam teks SBLGNT yang diberikan tetapi ditandai tidak pasti; mempertahankannya sambil mencatat varian menjaga transparansi bukti naskah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Sukacita” dipilih karena alami dalam register Alkitab Indonesia, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
