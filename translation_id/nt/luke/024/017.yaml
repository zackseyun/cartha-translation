  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Apakah yang sedang kalian perbincangkan di antara kalian sambil berjalan?”[a] Mereka pun berhenti,[b] dengan wajah muram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kata-kata apakah ini yang sedang kalian saling pertukarkan sambil berjalan?”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka berdiri diam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Mempertahankan verba umum λέγω tanpa mengubahnya menjadi verba yang lebih interpretatif seperti ‘bertanya’, meskipun ujarannya berbentuk pertanyaan.
- source_word: δὲ
  choice: Lalu
  rationale: Di sini δέ merupakan penghubung ringan yang melanjutkan alur narasi, bukan penanda pertentangan kuat.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: Apa yang sedang kalian bicarakan
  rationale: Ungkapan ini secara harfiah menunjuk pada ‘kata-kata’ yang dipertukarkan, tetapi dalam bahasa Indonesia alami merujuk pada isi percakapan mereka.
- source_word: ἀντιβάλλετε
  choice: sedang ... bicarakan
  rationale: Verba ini menggambarkan pertukaran perkataan secara timbal balik. Bentuk ‘bicarakan satu sama lain’ menyampaikan percakapan dua arah tanpa memberi kesan bahwa mereka pasti sedang berdebat.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Menjaga makna timbal balik dalam percakapan kedua murid.
- source_word: περιπατοῦντες
  choice: sambil berjalan
  rationale: Partisipel ini menyatakan tindakan yang berlangsung bersamaan dengan percakapan.
- source_word: ἐστάθησαν
  choice: berhenti
  rationale: Bentuk ἵστημι ini dalam konteks perjalanan berarti mereka menghentikan langkah; ‘berhenti’ paling alami dalam bahasa Indonesia.
- source_word: σκυθρωποί
  choice: dengan wajah muram
  rationale: Adjektiva ini menggambarkan kesedihan atau kemuraman yang tampak pada raut wajah, bukan hanya keadaan batin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. ‘Kalian’ dipakai karena Yesus berbicara kepada lebih dari satu orang. Susunan kalimat menjaga nuansa pertukaran percakapan dan kemuraman yang terlihat pada wajah tanpa menambahkan bahwa pembicaraan itu merupakan perdebatan.
