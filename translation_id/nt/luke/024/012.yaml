revisions:
- from: Namun Petrus bangkit lalu berlari ke makam itu. Ia membungkuk untuk melihat ke dalam dan melihat hanya kain-kain linen. Lalu ia pergi dari situ sambil bertanya-tanya sendiri tentang apa yang telah terjadi.[a][b]
  to: Tetapi Petrus bangkit dan berlari ke makam itu. Setelah membungkuk untuk melihat ke dalam, ia hanya melihat kain-kain linen. Lalu ia pergi sambil merasa heran dalam hatinya tentang apa yang telah terjadi.[a][b]
  rationale: Revisi menghapus tambahan “dari situ,” yang tidak ada dalam sumber, dan menggantinya dengan terjemahan yang mencerminkan salah satu pembacaan wajar atas πρὸς ἑαυτόν. Catatan kaki mempertahankan pembacaan alternatif tanpa menentukan secara berlebihan hubungan sintaksis yang diperdebatkan. Catatan varian tekstual tetap dipertahankan karena ayat ini ditandai sebagai unit variasi dalam SBLGNT.
