  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: id
  text: Tetapi Petrus bangkit dan berlari ke makam itu. Setelah membungkuk untuk melihat ke dalam, ia hanya melihat kain-kain linen. Lalu ia pergi sambil merasa heran dalam hatinya tentang apa yang telah terjadi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah kuno tidak memuat seluruh ayat ini.
    reason: SBLGNT menandai seluruh Lukas 24:12 sebagai unit variasi tekstual yang tidak terdapat dalam sebagian saksi.
  - marker: b
    text: 'Frasa Yunani yang diterjemahkan “dalam hatinya” juga dapat dipahami sebagai keterangan arah: “Lalu ia pergi ke tempatnya sendiri sambil merasa heran.”'
    reason: Hubungan sintaksis πρὸς ἑαυτόν dengan ἀπῆλθεν atau θαυμάζων memungkinkan lebih dari satu pemahaman yang wajar.
lexical_decisions:
- source_word: μνημεῖον
  choice: makam
  rationale: Istilah ini menunjuk pada tempat jenazah diletakkan; “makam” alami dalam bahasa Indonesia modern dan sesuai dengan konteks makam batu.
- source_word: παρακύψας
  choice: membungkuk untuk melihat ke dalam
  rationale: Kata ini menggambarkan tindakan membungkuk atau mencondongkan badan agar dapat melihat ke dalam makam.
- source_word: βλέπει
  choice: melihat
  rationale: Bentuk kini historis Yunani dipertahankan secara semantis tanpa memaksakan kala kini yang terasa janggal dalam narasi Indonesia; rangkaian verba tetap jelas sebagai peristiwa lampau dari konteks.
- source_word: ὀθόνια
  choice: kain-kain linen
  rationale: Bentuk jamak menunjuk pada kain-kain linen yang berkaitan dengan pembungkusan jenazah; “kain-kain linen” mempertahankan bahan dan jumlahnya.
- source_word: πρὸς αὑτὸν
  choice: sambil bertanya-tanya sendiri
  rationale: Dalam hubungannya dengan θαυμάζων, frasa ini dapat menyatakan reaksi batin Petrus, yakni merasa heran atau bertanya-tanya dalam dirinya; alternatif sintaksis dipertahankan dalam catatan kaki.
- source_word: θαυμάζων
  choice: bertanya-tanya
  rationale: Dalam konteks ini kata tersebut menyatakan keheranan yang terus berlangsung, bukan sekadar kekaguman positif.
theological_decisions:
- issue: Makna kain-kain linen yang tertinggal
  choice: 'Dinyatakan secara observasional: Petrus melihat hanya kain-kain linen.'
  alternative: Menambahkan kesimpulan eksplisit bahwa tubuh Yesus telah bangkit atau lenyap.
  rationale: Ayat ini melaporkan apa yang Petrus lihat dan keheranannya, tetapi belum merumuskan kesimpulan teologisnya; terjemahan tidak boleh mendahului narasi.
- issue: Status tekstual ayat
  choice: Ayat diterjemahkan dalam teks utama dengan catatan varian.
  alternative: Menghapus ayat dari teks utama.
  rationale: SBLGNT mencetak ayat ini sebagai bagian teks tetapi menandainya sebagai unit variasi; catatan kaki menyampaikan bahwa sejumlah saksi tekstual tidak memuatnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Makam” dipilih daripada “kubur” untuk tempat pemakaman, sedangkan “bertanya-tanya sendiri” menyampaikan keheranan batin tanpa menambahkan kesimpulan yang tidak dinyatakan teks.
