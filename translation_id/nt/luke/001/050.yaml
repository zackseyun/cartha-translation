lexical_decisions:
- source_word: ἔλεος
  choice: rahmat
  rationale: Kata ἔλεος menunjuk pada belas kasihan atau kebaikan yang diberikan kepada orang yang membutuhkan. “Rahmat” alami dalam konteks Kidung Maria dan mempertahankan nuansa kemurahan Allah tanpa mempersempit maknanya.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: turun-temurun
  rationale: Ungkapan ini secara harfiah berbicara tentang “generasi-generasi dan generasi-generasi” serta menyatakan keberlangsungan rahmat Allah sepanjang generasi yang silih berganti. “Turun-temurun” menyampaikan makna itu secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: bagi orang-orang yang takut akan Dia
  rationale: Bentuk datif menunjukkan pihak yang menerima atau mengalami rahmat itu. Ketika Allah menjadi objeknya, φοβέομαι mencakup rasa takut yang penuh hormat; ungkapan “takut akan Dia” mempertahankan bobot dan keluasan ungkapan Yunani.
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung ini mengaitkan baris tersebut dengan pernyataan sebelumnya dalam Kidung Maria dan mempertahankan alur kumulatifnya.
- source_word: αὐτοῦ / αὐτόν
  choice: -Nya / Dia
  rationale: Kedua kata ganti mengacu kepada Allah dalam konteks langsung. Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk kata ganti yang merujuk kepada Allah.
theological_decisions:
- issue: Makna “takut” dalam hubungan dengan Allah
  choice: takut akan Dia
  alternative: menghormati Dia; gentar kepada-Nya
  rationale: φοβουμένοις dapat menyatakan ketakutan yang mencakup rasa hormat, ketundukan, dan kesalehan ketika Allah menjadi objeknya. Terjemahan utama mempertahankan ungkapan alkitabiah beserta ketegangan maknanya, tanpa mereduksinya menjadi rasa ngeri belaka ataupun hanya rasa hormat.
- issue: Jangkauan rahmat sepanjang generasi
  choice: turun-temurun
  alternative: dari generasi ke generasi; kepada generasi-generasi dan generasi-generasi
  rationale: εἰς γενεὰς καὶ γενεὰς menekankan kelanjutan rahmat Allah melintasi generasi-generasi berturut-turut. Terjemahan ini tidak menyatakan bahwa setiap individu otomatis menerima rahmat tersebut, sebab frasa berikutnya tetap menyebut penerimanya sebagai orang-orang yang takut akan Dia.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Rahmat” sesuai dengan corak puitis Kidung Maria, sedangkan “turun-temurun” menghindari susunan yang kaku. Ungkapan tradisional “takut akan Dia” dipertahankan karena tetap lazim dan membawa cakupan makna Yunani yang lebih utuh.
