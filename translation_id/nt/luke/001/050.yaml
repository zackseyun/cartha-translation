  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: id
  text: Dan rahmat-Nya berlangsung dari generasi ke generasi[a] bagi orang-orang yang takut akan Dia[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada generasi-generasi dan generasi-generasi”; dapat juga diterjemahkan “turun-temurun.”
    reason: lexical_alternative
  - marker: b
    text: “Takut akan Dia” menunjuk pada sikap takut yang penuh hormat kepada Allah; dapat juga diterjemahkan “menghormati Dia.”
    reason: lexical_alternative
