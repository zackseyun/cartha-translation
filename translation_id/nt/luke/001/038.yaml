id: LUK.1.38
reference: Luke 1:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: id
  text: Maria berkata, “Sesungguhnya, aku ini hamba Tuhan.[a] Biarlah terjadi padaku sesuai dengan perkataanmu.”[b] Lalu malaikat itu pergi meninggalkan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “budak perempuan milik Tuhan.” Kata Yunani δούλη dapat berarti budak atau pelayan perempuan; di sini “hamba” menekankan penyerahan diri Maria yang rendah hati kepada Tuhan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “Semoga terjadi padaku sesuai dengan perkataanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Maria berkata
  rationale: Partikel penghubung yang ringan ini tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia; alur narasi tetap tersambung tanpa menambahkan urutan waktu yang lebih tegas.
- source_word: Ἰδοὺ
  choice: Sesungguhnya
  rationale: Ungkapan ini mempertahankan penekanan khidmat dalam pernyataan Maria dan lebih wajar dalam konteks ini daripada seruan harfiah seperti “Lihatlah”.
- source_word: δούλη
  choice: hamba
  rationale: Bentuk feminin ini dapat berarti budak atau pelayan perempuan. “Hamba” menyampaikan kerendahan hati dan penyerahan diri Maria kepada Tuhan, sedangkan nuansa kepemilikan yang lebih kuat dicatat dalam catatan kaki.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος berfungsi sebagai sebutan ilahi dalam konteks ini; konstruksi “hamba Tuhan” merupakan bentuk kepunyaan yang alami dalam bahasa Indonesia.
- source_word: γένοιτό μοι
  choice: Biarlah terjadi padaku
  rationale: Optatif aoris ini menyatakan persetujuan yang rela atau harapan, bukan sekadar ramalan tentang masa depan. Pilihan ini alami dan mempertahankan keterlibatan pribadi Maria.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: sesuai dengan perkataanmu
  rationale: Frasa ini menyatakan bahwa peristiwa itu terjadi selaras dengan pernyataan khusus yang baru disampaikan malaikat.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: pergi meninggalkan dia
  rationale: Ungkapan ini menyampaikan gerak menjauh dari Maria dengan bahasa naratif Indonesia yang jelas dan alami.
- source_word: ὁ ἄγγελος
  choice: malaikat itu
  rationale: Dalam konteks kisah ini, ἄγγελος jelas menunjuk kepada makhluk surgawi yang telah berbicara dengan Maria; “itu” menandai rujukan yang sudah dikenal.
theological_decisions:
- issue: Sebutan Maria bagi dirinya sendiri (δούλη)
  choice: hamba Tuhan
  alternative: budak perempuan milik Tuhan
  rationale: Kata Yunani tersebut dapat menunjukkan status seorang budak perempuan, tetapi dalam konteks ini penekanan utamanya ialah kerendahan hati dan penyerahan Maria kepada kehendak Allah. Alternatif yang lebih kuat dipertahankan dalam catatan kaki agar cakupan maknanya tetap terlihat.
- issue: Daya ungkap γένοιτό μοι
  choice: Biarlah terjadi padaku
  alternative: Semoga terjadi padaku
  rationale: Bentuk optatif menyatakan penerimaan dan harapan Maria secara sukarela. “Biarlah” menjaga unsur persetujuan itu tanpa mengubahnya menjadi pernyataan kepastian atau perintah kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. “Sesungguhnya” mempertahankan penekanan Ἰδοὺ, sedangkan “biarlah terjadi” menyampaikan persetujuan rela Maria secara alami.
