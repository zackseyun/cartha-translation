  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: id
  text: Setelah hari-hari itu, Elisabet, istri Zakharia, mengandung. Ia terus menyembunyikan diri selama lima bulan dan berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Sesudah hari-hari itu
  rationale: μετά dengan akusatif menyatakan urutan waktu. Dalam narasi lampau bahasa Indonesia, demonstrativa ταύτας paling alami diungkapkan dengan 'itu'; δέ hanya merupakan penghubung ringan dan tidak perlu diterjemahkan tersendiri.
- source_word: συνέλαβεν
  choice: mengandung
  rationale: Dalam konteks ini συλλαμβάνω berarti mulai mengandung seorang anak. 'Mengandung' merupakan ungkapan Indonesia yang langsung, wajar, dan cukup dekat dengan makna verba Yunani.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Bentuk nama yang lazim digunakan dalam Alkitab bahasa Indonesia.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: istrinya
  rationale: γυνή dapat berarti 'perempuan' atau 'istri'; dengan pronomina posesif dalam konteks ini maknanya jelas 'istrinya', yakni istri Zakharia.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: Ia menyembunyikan diri
  rationale: Ungkapan ini mempertahankan makna refleksif verba. Bentuk imperfek menunjukkan tindakan yang berlangsung dalam rentang lima bulan, dan durasinya sudah dinyatakan oleh frasa berikutnya.
- source_word: μῆνας πέντε
  choice: selama lima bulan
  rationale: Akusatif menyatakan durasi; 'selama' mengungkapkan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: λέγουσα
  choice: dan berkata,
  rationale: Partisip kini mengantar langsung kepada isi ucapan pada ayat berikutnya. Karena bahasa Indonesia tidak memiliki padanan partisip yang sama alaminya, klausa koordinatif 'dan berkata' menghasilkan kalimat yang lancar tanpa mengubah hubungan naratif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan nama lalu aposisi 'Elisabet, istrinya' mempertahankan fokus teks Yunani sambil tetap alami. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa Indonesia.
