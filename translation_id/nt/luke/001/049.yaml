id: LUK.1.49
reference: Luke 1:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: id
  text: sebab Yang Mahakuasa telah melakukan hal-hal besar bagiku, dan kuduslah nama-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan nama-Nya kudus.” Dalam bahasa Yunani, kata “kudus” ditempatkan sebelum “nama-Nya” untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Maria memuliakan Tuhan pada ayat sebelumnya. “Sebab” mempertahankan hubungan kausal dan sesuai dengan ragam pujian yang bermartabat.
- source_word: ἐποίησέν
  choice: telah melakukan
  rationale: Aoristus ποιέω menunjuk pada tindakan Allah yang sudah terlaksana bagi Maria; “telah melakukan” menyampaikan tindakan selesai yang tetap penting dalam konteks pujian ini.
- source_word: μοι
  choice: bagiku
  rationale: 'Dativus ini paling wajar dipahami sebagai benefaktif: tindakan itu dilakukan demi atau untuk Maria.'
- source_word: μεγάλα
  choice: hal-hal besar
  rationale: Adjektiva netral jamak ini dipakai sebagai nomina. “Hal-hal besar” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi hanya mukjizat atau perbuatan tertentu.
- source_word: ὁ δυνατός
  choice: Yang Mahakuasa
  rationale: Adjektiva berartikel ini berfungsi sebagai sebutan bagi Allah. “Yang Mahakuasa” merupakan gelar ilahi yang ringkas, wajar, dan khidmat dalam bahasa Indonesia.
- source_word: ἅγιον
  choice: kuduslah
  rationale: “Kudus” adalah padanan baku yang mempertahankan gagasan kekudusan. Bentuk “kuduslah” menjaga penempatan predikat di depan dan memberi penekanan yang sesuai dengan susunan Yunani.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: nama-Nya
  rationale: Padanan ini alami dan mempertahankan kata “nama” sebagaimana terdapat dalam teks, tanpa menguraikannya menjadi karakter atau reputasi Allah.
theological_decisions:
- issue: ὁ δυνατός sebagai gelar ilahi
  choice: Yang Mahakuasa
  alternative: Dia yang berkuasa
  rationale: Pemakaian artikel dengan adjektiva menjadikannya sebutan substantival bagi Allah. Pilihan ini mempertahankan fungsi gelarnya tanpa menambahkan uraian doktrinal.
- issue: Susunan kata καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: dan kuduslah nama-Nya
  alternative: dan nama-Nya kudus
  rationale: Teks Yunani mendahulukan “kudus” sehingga kata itu mendapat penekanan. Susunan “kuduslah nama-Nya” mempertahankan penekanan tersebut serta tetap alami dalam bahasa pujian Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pujian yang khidmat. Ungkapan dibuat mudah dipahami pembaca umum tanpa memakai bahasa yang terlalu kuno; kapitalisasi dan bentuk “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah.
