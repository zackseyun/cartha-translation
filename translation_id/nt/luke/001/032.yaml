  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: id
  text: Dia[a] akan menjadi besar dan akan disebut[b] Anak Sang Mahatinggi, dan Tuhan Allah akan memberikan kepadanya takhta Daud, bapaknya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yang ini”; kata Yunani οὗτος menunjuk kepada anak yang baru saja diberitakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan dinamai.”
    reason: lexical_alternative
  - marker: c
    text: “Bapaknya” berarti Daud adalah leluhur kerajaan Yesus dalam garis keturunan Daud.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Dia
  rationale: Kata ganti penunjuk ini merujuk kepada anak yang baru saja diberitakan. “Dia” wajar dalam bahasa Indonesia modern, sedangkan nuansa harfiah “yang ini” dicatat dalam catatan kaki.
- source_word: ἔσται μέγας
  choice: akan menjadi besar
  rationale: Bentuk mendatang ἔσται dipertahankan, dan μέγας diterjemahkan “besar” agar cakupan maknanya—keagungan dan kedudukan penting—tidak dipersempit menjadi kuasa saja.
- source_word: υἱὸς Ὑψίστου
  choice: Anak Sang Mahatinggi
  rationale: “Sang Mahatinggi” mempertahankan Ὑψίστου sebagai gelar ilahi substantival tanpa menyisipkan kata “Allah” yang tidak muncul secara eksplisit dalam frasa Yunani ini. “Anak” dikapitalisasi karena berfungsi sebagai gelar.
- source_word: κληθήσεται
  choice: akan disebut
  rationale: Pasif mendatang dari καλέω di sini menyatakan sebutan atau gelar. “Akan disebut” merupakan padanan yang langsung dan alami.
- source_word: κύριος ὁ θεὸς
  choice: Tuhan Allah
  rationale: Frasa ini secara alami diterjemahkan “Tuhan Allah”; kapitalisasi menandai rujukan kepada Allah, tanpa mengubah κύριος menjadi bentuk “TUHAN” yang akan mengandaikan tetragramaton.
- source_word: δώσει αὐτῷ
  choice: akan memberikan kepadanya
  rationale: Terjemahan ini mempertahankan bentuk mendatang dan objek tak langsung αὐτῷ dengan jelas serta wajar.
- source_word: τὸν θρόνον Δαυὶδ
  choice: takhta Daud
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan gema janji kerajaan Daud.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: bapaknya
  rationale: Padanan langsung πατήρ dipertahankan. Dalam konteks silsilah dan dinasti, “bapak” dapat menunjuk kepada leluhur, sebagaimana dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Gelar kristologis υἱὸς Ὑψίστου
  choice: Anak Sang Mahatinggi
  alternative: seorang anak dari Yang Mahatinggi; Anak Allah Yang Mahatinggi
  rationale: Pilihan ini mempertahankan daya gelar dan hubungan keanakan yang dinyatakan teks, tanpa melemahkannya dengan “seorang” dan tanpa menambahkan “Allah” ke dalam frasa tersebut.
- issue: Terjemahan κύριος dalam κύριος ὁ θεὸς
  choice: Tuhan Allah
  alternative: TUHAN Allah; Penguasa Allah
  rationale: “Tuhan” adalah padanan yang tepat untuk κύριος. Bentuk “TUHAN” akan terlalu menentukan hubungan langsung dengan tetragramaton, yang tidak tertulis dalam teks Yunani ini.
- issue: Hubungan Daud sebagai τοῦ πατρὸς αὐτοῦ
  choice: Daud, bapaknya
  alternative: Daud, leluhurnya
  rationale: Terjemahan formal “bapaknya” menjaga bahasa dinasti dan perjanjian dalam teks. Makna Daud sebagai leluhur kerajaan diterangkan tanpa mengganti istilah sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Dia” dipilih daripada “Ia” untuk keterbacaan umum; “Sang Mahatinggi” menjaga gelar ilahi tetap jelas sekaligus menghindari penambahan unsur yang tidak eksplisit dalam bahasa Yunani.
