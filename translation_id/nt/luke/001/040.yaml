  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: id
  text: lalu masuk ke rumah Zakharia dan memberi salam kepada Elisabet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: lalu / dan
  rationale: Kata penghubung pertama diterjemahkan “lalu” untuk menyatakan urutan tindakan secara alami dalam narasi Indonesia; kata penghubung kedua diterjemahkan “dan” untuk mengoordinasikan kedua tindakan.
- source_word: εἰσῆλθεν
  choice: masuk
  rationale: Bentuk aoristus aktif indikatif dari εἰσέρχομαι menyatakan tindakan memasuki suatu tempat; “masuk” tepat, ringkas, dan alami.
- source_word: οἶκον
  choice: rumah
  rationale: Dengan preposisi εἰς, kata ini menunjuk pada tempat tinggal sebagai lokasi fisik; “rumah” merupakan padanan langsung dan wajar.
- source_word: Ζαχαρίου
  choice: Zakharia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia dan tetap mencerminkan nama Yunani Ζαχαρίας dalam bentuk genitif.
- source_word: ἠσπάσατο
  choice: memberi salam kepada
  rationale: ἀσπάζομαι di sini berarti menyapa atau memberi salam. Ungkapan “memberi salam kepada” alami dalam bahasa Indonesia dan tidak menambahkan kadar kehangatan atau upacara yang tidak dinyatakan teks.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Transliterasi yang lazim dan mudah dikenali dalam bahasa Indonesia.
