id: LUK.1.74
reference: Luke 1:74
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀφόβως ἐκ χειρὸς ⸀ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: id
  text: agar kita, setelah dibebaskan dari tangan musuh-musuh kita[b], dapat melayani Dia[c] tanpa takut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tidak gentar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari kuasa musuh-musuh kita.”
    reason: lexical_alternative
  - marker: c
    text: Atau “beribadah kepada-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: tanpa takut
  rationale: Ungkapan ini menyampaikan makna adverbial ‘tanpa rasa takut’ secara alami dan tetap membiarkan frasa tersebut menerangkan tindakan melayani Allah.
- source_word: ἐκ χειρὸς
  choice: dari tangan
  rationale: Ungkapan ini mempertahankan gambaran idiomatis Yunani tentang pembebasan dari kuasa atau kendali seseorang dan masih mudah dipahami dalam bahasa Indonesia.
- source_word: ἐχθρῶν
  choice: musuh-musuh kita
  rationale: Teks Yunani secara harfiah hanya menyebut ‘musuh-musuh’, tetapi konteks nubuat Zakharia menunjukkan musuh-musuh umat Allah; kata ‘kita’ membuat rujukan tersirat itu wajar dalam bahasa Indonesia.
- source_word: ῥυσθέντας
  choice: setelah dibebaskan
  rationale: Partisip aoris pasif menunjukkan pembebasan yang mendahului dan menjadi dasar bagi pelayanan; ‘setelah dibebaskan’ mengungkapkan hubungan waktu itu dengan jelas.
- source_word: λατρεύειν
  choice: melayani
  rationale: Kata ini menunjuk pada pelayanan yang dipersembahkan kepada Allah dan dapat mencakup ibadah maupun ketaatan; ‘melayani’ mempertahankan cakupan yang lebih luas itu.
- source_word: αὐτῷ
  choice: Dia
  rationale: Pronomina datif ini merujuk kepada Allah dalam konteks sebelumnya. Sesudah ‘melayani’, bahasa Indonesia secara alami memakai objek langsung ‘Dia’.
theological_decisions:
- issue: Cakupan λατρεύειν ketika diarahkan kepada Allah
  choice: melayani Dia
  alternative: beribadah kepada-Nya
  rationale: ‘Melayani Dia’ mencakup pengabdian, ketaatan, dan ibadah kepada Allah tanpa membatasi maknanya hanya pada tindakan ibadah dalam arti sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang alami dan bermartabat. Susunan kalimat mempertahankan hubungan antara pembebasan, pelayanan kepada Allah, dan keadaan tanpa takut; kapitalisasi ‘Dia’ menandai rujukan kepada Allah sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
