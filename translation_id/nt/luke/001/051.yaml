  source_fidelity: Teks Indonesia dengan tepat menerjemahkan Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ sebagai tindakan Allah yang memperlihatkan kuasa melalui metafora “lengan-Nya.” “Mencerai-beraikan orang-orang yang congkak” setia kepada διεσκόρπισεν ὑπερηφάνους. Frasa “dalam pikiran hati mereka” mempertahankan kepadatan dan ambiguitas relatif dari διανοίᾳ καρδίας αὐτῶν tanpa menafsirkan secara berlebihan.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada puitis. “Lengan-Nya,” “orang-orang yang congkak,” dan “mencerai-beraikan” sesuai dengan register Alkitab modern. Frasa “pikiran hati mereka” agak bercorak Alkitabiah, tetapi tetap dapat dipahami dan tepat untuk mempertahankan ungkapan sumber yang berlapis.
  terminology: Istilah “kuasa” secara baik mewakili κράτος dalam konteks ini; “lengan-Nya” mempertahankan citra antropomorfis sumber; dan “congkak” menyampaikan penilaian moral ὑπερήφανοι. Catatan kaki diberi jangkar yang benar dan menawarkan alternatif tanpa memaksakan satu penafsiran atas fungsi datif διανοίᾳ.
