id: LUK.1.51
reference: Luke 1:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: id
  text: Ia menunjukkan kuasa dengan lengan-Nya[a]; Ia mencerai-beraikan orang-orang yang congkak dalam pikiran hati mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia melakukan perbuatan-perbuatan perkasa dengan lengan-Nya.” Secara harfiah, bahasa Yunani berbunyi “melakukan kekuatan,” suatu ungkapan untuk memperlihatkan atau mengerahkan kuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia mencerai-beraikan orang-orang yang congkak karena niat hati mereka,” atau “melalui rancangan hati mereka.” Bentuk Yunani dapat menunjuk pada lingkup batin, keadaan, atau sarana kesombongan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: menunjukkan kuasa
  rationale: Ungkapan Yunani yang secara harfiah berarti “melakukan/membuat kekuatan” merupakan idiom untuk memperlihatkan atau mengerahkan kuasa. “Menunjukkan kuasa” alami dalam bahasa Indonesia dan tetap menyatakan tindakan Allah yang nyata.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: dengan lengan-Nya
  rationale: ἐν berfungsi secara instrumental dalam ungkapan yang menggemakan gambaran Perjanjian Lama tentang lengan Allah. Terjemahan ini mempertahankan metafora antropomorfisnya.
- source_word: διεσκόρπισεν
  choice: mencerai-beraikan
  rationale: Kata kerja ini berarti menyebarkan atau membuat suatu kelompok terpencar. “Mencerai-beraikan” tepat untuk tindakan kuat terhadap sekumpulan orang.
- source_word: ὑπερηφάνους
  choice: orang-orang yang congkak
  rationale: Kata sifat ini dipakai sebagai kata benda bagi orang yang sombong atau angkuh. Bentuk ini jelas dan wajar bagi pembaca Indonesia.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: dalam pikiran hati mereka
  rationale: Terjemahan ini mempertahankan ungkapan berlapis Yunani-Semitis tentang pikiran, niat, atau daya batin yang berpusat dalam hati, tanpa mereduksinya menjadi satu istilah psikologis.
theological_decisions:
- issue: Nilai kala aoristus dalam nyanyian Maria
  choice: Menggunakan bentuk lampau yang dalam bahasa Indonesia dinyatakan oleh konteks, tanpa penanda aspek tambahan
  alternative: Menambahkan “telah” pada kedua tindakan
  rationale: Aoristus menggambarkan tindakan Allah sebagai tindakan tegas dan utuh, mungkin juga dengan daya profetis. Bahasa Indonesia tidak wajib menandai kala; bentuk tanpa “telah” tetap dapat mencakup tindakan yang sudah dilakukan sekaligus karya khas Allah, sehingga ketegangan puitisnya dipertahankan.
- issue: Hubungan διανοίᾳ dengan orang-orang congkak dan tindakan mencerai-beraikan
  choice: “dalam pikiran hati mereka” sebagai lingkup batin kesombongan mereka
  alternative: “karena niat hati mereka” atau “melalui rancangan hati mereka”
  rationale: Bentuk datif dapat dipahami sebagai lingkup, keadaan, atau sarana. Teks utama mempertahankan susunan yang relatif terbuka, sedangkan catatan kaki menyajikan kemungkinan instrumental atau kausal tanpa memutuskan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Lengan-Nya” mempertahankan citra alkitabiah, sedangkan “orang-orang yang congkak” mudah dipahami tanpa kehilangan bobot moral. Tanda titik koma menjaga kesejajaran dua tindakan ilahi.
