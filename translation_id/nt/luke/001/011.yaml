id: LUK.1.11
reference: Luke 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: id
  text: Lalu seorang malaikat Tuhan menampakkan diri kepada Zakharia. Malaikat itu berdiri di sebelah kanan mazbah pembakaran dupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: menampakkan diri
  rationale: Bentuk pasif aoris ὁράω dalam konteks naratif ini berfungsi dengan makna ‘tampak/menampakkan diri’. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan kemunculan yang dapat dilihat.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai perkembangan narasi; ‘Lalu’ menyatakan urutan peristiwa tanpa memberi kesan pertentangan.
- source_word: αὐτῷ
  choice: kepada Zakharia
  rationale: Datif menunjukkan orang yang menerima penampakan. Nama ‘Zakharia’ dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah referennya.
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: Dalam konteks penglihatan di Bait Allah, ἄγγελος menunjuk pada makhluk surgawi. ‘Tuhan’ merupakan padanan baku bagi κύριος dalam ungkapan ini.
- source_word: ἑστὼς
  choice: berdiri
  rationale: Partisip perfektum ἵστημι menggambarkan posisi malaikat saat tampak; ‘berdiri’ merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: ἐκ δεξιῶν
  choice: di sebelah kanan
  rationale: Ungkapan ini menunjukkan letak pada sisi kanan tanpa menjelaskan orientasi lebih jauh daripada teks sumber.
- source_word: τοῦ θυσιαστηρίου τοῦ θυμιάματος
  choice: mazbah pembakaran dupa
  rationale: Genitif θυμιάματος mengidentifikasi mazbah yang digunakan untuk dupa. ‘Mazbah pembakaran dupa’ jelas, wajar, dan membedakannya dari mazbah kurban bakaran.
theological_decisions:
- issue: Pemadanan κύριος dalam ἄγγελος κυρίου
  choice: Tuhan
  alternative: Penguasa
  rationale: Dalam konteks narasi Bait Allah, κύριος merujuk kepada Allah. ‘Tuhan’ mempertahankan gelar ilahi yang lazim tanpa menambahkan kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Yunani dipecah menjadi dua agar hubungan penampakan dan posisi malaikat mudah dipahami. Istilah ‘mazbah’ dipertahankan sebagai kosakata religius yang mapan, sedangkan fungsi mazbah dijelaskan dengan ‘pembakaran dupa’.
