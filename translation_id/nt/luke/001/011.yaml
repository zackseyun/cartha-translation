  source_fidelity: Terjemahan dengan tepat menyampaikan ὤφθη δὲ αὐτῷ sebagai kemunculan seorang malaikat Tuhan kepada Zakharia, serta mempertahankan posisi malaikat di sebelah kanan mazbah dupa. Pemecahan satu kalimat Yunani menjadi dua kalimat Indonesia tidak mengubah hubungan peristiwa atau makna partisip ἑστὼς.
