id: LUK.1.66
reference: Luke 1:66
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: id
  text: Semua orang yang mendengar hal itu menyimpannya dalam hati mereka dan berkata, “Kalau begitu, akan menjadi apakah anak ini kelak?[a]” Sebab tangan Tuhan memang menyertai dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan menjadi apakah anak ini?” Dalam konteks ini pertanyaan tersebut menyangkut masa depan, identitas, atau peranan anak itu.
    reason: lexical_alternative
  - marker: b
    text: “Tangan Tuhan” adalah ungkapan alkitabiah yang dapat menunjuk pada kuasa, perkenanan, atau tuntunan Allah yang aktif.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: menyimpannya dalam hati mereka
  rationale: Mempertahankan gambaran harfiah ‘menaruh dalam hati’ dalam bentuk bahasa Indonesia yang alami, dengan makna mengingat dan memikirkan peristiwa itu dengan sungguh-sungguh.
- source_word: πάντες οἱ ἀκούσαντες
  choice: semua orang yang mendengar hal itu
  rationale: Frasa partisipial ini mencakup semua orang yang mendengar kabar tentang rangkaian peristiwa tersebut; ‘hal itu’ melengkapi objek yang tersirat secara alami.
- source_word: Τί ἄρα
  choice: Kalau begitu, ... apakah
  rationale: ἄρα menyatakan kesimpulan atau pertanyaan yang timbul dari peristiwa sebelumnya. ‘Kalau begitu’ menyampaikan nuansa inferensial itu secara wajar.
- source_word: τὸ παιδίον τοῦτο
  choice: anak ini
  rationale: παιδίον menunjuk kepada seorang anak; pilihan ini alami dan tidak menambahkan rincian usia yang tidak diperlukan.
- source_word: ἔσται
  choice: akan menjadi ... kelak
  rationale: Secara harfiah berarti ‘akan ada/akan menjadi’; dalam konteks ini pertanyaannya menyangkut masa depan, identitas, atau peranan anak itu. Susunan ini tetap membuka cakupan maknanya.
- source_word: καὶ γὰρ
  choice: Sebab ... memang
  rationale: Gabungan partikel ini memberi alasan sekaligus penegasan. ‘Sebab ... memang’ menyampaikan kedua nuansa itu tanpa terasa kaku.
- source_word: χεὶρ κυρίου
  choice: tangan Tuhan
  rationale: Metafora alkitabiah dipertahankan agar gema tekstual dan cakupan makna kuasa, perkenanan, serta tindakan ilahi tidak dipersempit.
- source_word: μετ’ αὐτοῦ
  choice: menyertai dia
  rationale: μετά dengan genitif berarti ‘bersama dengan’. Dalam idiom bahasa Indonesia, ‘menyertai dia’ menyatakan kebersamaan atau kehadiran aktif tanpa menentukan bentuknya lebih jauh.
theological_decisions:
- issue: Makna ungkapan ‘tangan Tuhan menyertai dia’
  choice: Mempertahankan metafora tangan Tuhan sebagai pernyataan tentang keterlibatan aktif Allah tanpa mempersempit artinya.
  alternative: Tuhan menolong dia; kuasa Allah ada padanya.
  rationale: Teks dapat mencakup kuasa, perkenanan, perlindungan, atau tuntunan Allah, tetapi tidak menentukan salah satunya secara khusus. Metafora asli menjaga keluasan dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan khidmat. Metafora utama dipertahankan, sedangkan susunan kalimat disesuaikan agar mudah dipahami pembaca umum.
