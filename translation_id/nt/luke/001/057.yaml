  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: id
  text: Ketika tiba waktunya bagi Elisabet untuk melahirkan[a], ia pun melahirkan seorang anak laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “genaplah waktunya bagi Elisabet untuk melahirkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ketika
  rationale: Partikel ini menandai kelanjutan narasi dengan ringan. Dalam bahasa Indonesia, hubungan dengan peristiwa berikutnya disampaikan secara alami melalui susunan kalimat tanpa menerjemahkannya sebagai kata temporal tersendiri seperti 'sekarang'.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: tiba waktunya
  rationale: Ungkapan harfiah 'waktunya dipenuhi/genap' menyatakan bahwa masa kehamilan telah selesai. 'Tiba waktunya' merupakan ungkapan Indonesia yang alami dan tepat dalam konteks persalinan; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: bagi Elisabet untuk melahirkan
  rationale: Infinitif berartikel ini menjelaskan hal yang waktunya telah tiba, yaitu Elisabet melahirkan. Nama diulangi agar rujukannya jelas dan kalimat tetap alami.
- source_word: ἐγέννησεν
  choice: ia pun melahirkan
  rationale: Verba aoristus menyatakan tindakan persalinan yang selesai. 'Pun' menandai hasil atau kelanjutan yang wajar tanpa menambahkan isi teologis.
- source_word: υἱόν
  choice: seorang anak laki-laki
  rationale: υἱός secara khusus menunjukkan anak laki-laki; pilihan ini jelas dan alami dalam bahasa Indonesia serta mempertahankan penandaan gender sumber.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi dan ejaan Alkitab bahasa Indonesia.
