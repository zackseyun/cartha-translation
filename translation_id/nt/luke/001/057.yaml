  source_fidelity: 'Teks Indonesia menyampaikan kedua tindakan utama secara tepat: masa kehamilan Elisabet mencapai waktunya untuk melahirkan, lalu ia melahirkan seorang anak laki-laki. "Ketika tiba waktunya" adalah penataan idiomatis Indonesia bagi ungkapan Yunani ἐπλήσθη ὁ χρόνος; kata "Ketika" tidak perlu dipahami sebagai padanan leksikal tersendiri untuk δέ. "Seorang anak laki-laki" dengan tepat mempertahankan arti υἱόν.'
