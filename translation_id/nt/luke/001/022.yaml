  source_fidelity: 'Teks Indonesia dengan setia menyampaikan urutan dan isi Yunani: Zakharia keluar, tidak mampu berbicara, orang-orang menyadari bahwa ia telah melihat suatu penglihatan di ναός, ia terus memberi isyarat, dan ia tetap bisu. "Tempat kudus" secara tepat membedakan ναός dari keseluruhan kompleks Bait Allah. "Tetap bisu" mengikuti penekanan langsung pada ketidakmampuan berbicara sambil tidak memaksakan makna "tuli" bagi κωφός.'
  naturalness: Bahasanya baku, modern, dan lancar untuk narasi. "Ketika Zakharia keluar", "mereka pun menyadari", dan "terus memberi isyarat" terdengar alami. Frasa "melihat suatu penglihatan" memang sedikit repetitif secara leksikal, tetapi tetap idiomatis dan secara baik mempertahankan ungkapan visual Yunani tanpa menafsirkan pengalaman itu secara berlebihan.
  terminology: '"Zakharia", "tempat kudus", "penglihatan", dan "bisu" konsisten dengan register Alkitab bahasa Indonesia modern. Catatan pada "bisu" secara tepat menjaga kemungkinan cakupan semantis κωφός tanpa memasukkan ketulian ke dalam teks utama.'
