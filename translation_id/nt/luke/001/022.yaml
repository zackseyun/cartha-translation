id: LUK.1.22
reference: Luke 1:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: id
  text: Namun, ketika Zakharia keluar, ia tidak dapat berbicara kepada mereka. Mereka pun menyadari bahwa ia telah melihat suatu penglihatan di tempat kudus[a]. Ia terus memberi isyarat kepada mereka dan tetap bisu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Bait Allah”; kata Yunani di sini lebih khusus menunjuk pada tempat kudus atau bangunan utama Bait Allah, bukan seluruh kompleksnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “bisu” dapat berarti tidak mampu berbicara dan, dalam konteks tertentu, juga dapat menyiratkan ketulian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ketika Zakharia keluar
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Bentuk temporal ini alami dalam bahasa Indonesia; nama Zakharia dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: ia tidak dapat berbicara
  rationale: Mempertahankan unsur ketidakmampuan yang dinyatakan oleh δύναμαι dengan infinitif, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: ἐπέγνωσαν
  choice: mereka pun menyadari
  rationale: Dalam konteks ini, verba tersebut menunjukkan bahwa orang banyak mencapai pemahaman berdasarkan keadaan Zakharia. Partikel “pun” menandai perkembangan narasi secara alami.
- source_word: ὀπτασίαν ἑώρακεν
  choice: telah melihat suatu penglihatan
  rationale: Mempertahankan verba ‘melihat’ dan istilah yang menunjuk pada pengalaman visual atau pewahyuan adikodrati tanpa menjelaskan hakikatnya lebih jauh.
- source_word: ἐν τῷ ναῷ
  choice: di tempat kudus
  rationale: ναός menunjuk lebih khusus pada bangunan atau ruang kudus Bait Allah, bukan seluruh kompleks Bait Allah; “tempat kudus” mempertahankan pembedaan itu dengan bahasa yang mudah dipahami.
- source_word: ἦν διανεύων
  choice: terus memberi isyarat
  rationale: Konstruksi perifrastik imperfek menyatakan tindakan yang sedang berlangsung atau berulang; “terus” menangkap aspek duratif tersebut.
- source_word: διέμενεν κωφός
  choice: tetap bisu
  rationale: “Tetap” mencerminkan keadaan yang berlanjut, sedangkan “bisu” menyampaikan ketidakmampuan berbicara yang ditekankan konteks tanpa secara pasti menambahkan ketulian.
theological_decisions:
- issue: Makna κωφός dalam hukuman yang dialami Zakharia
  choice: tetap bisu
  alternative: tetap tuli; tetap tuli dan bisu; tetap tidak dapat berbicara
  rationale: Konteks langsung secara eksplisit menyoroti ketidakmampuan Zakharia untuk berbicara. Namun, karena κωφός juga dapat menunjuk pada ketulian dalam konteks tertentu, catatan kaki mempertahankan kemungkinan itu tanpa memasukkannya secara pasti ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan peristiwa, aspek tindakan yang berlanjut, serta ambiguitas terbatas pada κωφός.
