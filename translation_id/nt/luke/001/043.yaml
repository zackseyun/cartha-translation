  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: id
  text: Dari mana aku mendapat kehormatan ini[a], sehingga ibu Tuhanku datang kepadaku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dari mana hal ini bagiku?” Ungkapan ini menyatakan keheranan karena menerima kehormatan seperti itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: Dari mana aku mendapat kehormatan ini
  rationale: Ungkapan Yunani secara harfiah berbunyi kira-kira, 'Dari mana hal ini bagiku?' Dalam konteks ini ungkapan tersebut menyatakan keheranan karena menerima suatu kehormatan. Bentuk Indonesia yang dipilih mempertahankan citra 'dari mana' sekaligus membuat maksud idiomatisnya jelas.
- source_word: ἵνα ἔλθῃ
  choice: sehingga ... datang
  rationale: ἵνα di sini memperkenalkan isi atau keadaan yang menimbulkan keheranan Elisabet, bukan terutama menyatakan tujuan. 'Sehingga' menghubungkan kehormatan itu dengan kedatangan ibu Tuhannya secara alami dalam bahasa Indonesia.
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: ibu Tuhanku
  rationale: Terjemahan langsung yang mempertahankan gelar κύριος sebagai 'Tuhan' dan hubungan posesif μου sebagai '-ku', tanpa menambahkan rumusan teologis di luar ayat.
- source_word: πρὸς ἐμέ
  choice: kepadaku
  rationale: πρός dengan akusatif menunjukkan gerak menuju Elisabet. 'Kepadaku' alami dan tidak mempersempit maknanya menjadi 'ke rumahku'.
theological_decisions:
- issue: Makna gelar κυρίου dalam 'ibu Tuhanku'
  choice: Tuhanku
  alternative: tuanku
  rationale: '''Tuhanku'' mempertahankan bobot penghormatan dan kristologis gelar κύριος dalam kisah kelahiran Lukas, tanpa menjabarkan lebih jauh identitas atau hakikat yang tidak dinyatakan secara eksplisit dalam ayat ini.'
- issue: Cara menerjemahkan ungkapan πόθεν μοι τοῦτο
  choice: Dari mana aku mendapat kehormatan ini
  alternative: Mengapa hal ini dianugerahkan kepadaku
  rationale: Pilihan ini mempertahankan unsur sumber dalam πόθεν ('dari mana') serta mengungkapkan secara wajar rasa takjub Elisabet atas kehormatan yang diterimanya. Kata 'kehormatan' merupakan penjelasan idiomatis, bukan penambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan pertanyaan mempertahankan nada takjub Elisabet. 'Ibu Tuhanku' dipilih daripada bentuk yang lebih kaku 'ibu dari Tuhanku'.
