  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: id
  text: Saya pun, setelah menelusuri segala sesuatu dengan saksama sejak awal[a], menganggap baik untuk menuliskannya kepadamu dalam urutan yang teratur[b], Yang Mulia Teofilus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah menyelidiki segala sesuatu dengan teliti sejak awal.”
    reason: lexical_alternative
  - marker: b
    text: Atau “secara berurutan”; ungkapan ini dapat menunjuk pada susunan yang teratur dan tidak harus berarti urutan waktu yang ketat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: menganggap baik
  rationale: Ungkapan ini menyatakan pertimbangan atau keputusan yang matang. Pilihan ini mempertahankan corak formal kata pengantar Lukas tanpa mengubahnya menjadi sekadar keputusan spontan.
- source_word: κἀμοὶ
  choice: saya pun
  rationale: Bentuk gabungan καί dan ἐμοί mengaitkan penulis dengan para penyusun kisah yang disebut sebelumnya; “saya pun” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: παρηκολουθηκότι
  choice: setelah mengikuti
  rationale: Kata ini dapat berarti mengikuti dengan dekat, menelusuri, atau menyelidiki. “Mengikuti” mempertahankan padanan langsung, sedangkan “dengan saksama” menyampaikan unsur ketelitian dalam konteks penelusuran historis.
- source_word: ἄνωθεν
  choice: sejak awal
  rationale: Dalam konteks kata pengantar historiografis ini, makna temporal “sejak awal” paling wajar daripada “dari atas.”
- source_word: πᾶσιν
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini merujuk secara menyeluruh kepada semua perkara atau peristiwa yang ditelusuri Lukas.
- source_word: ἀκριβῶς
  choice: dengan saksama
  rationale: Adverbia ini menyatakan ketelitian dan kecermatan; “dengan saksama” berpadu alami dengan “mengikuti” serta tidak hanya menekankan ketepatan hasil.
- source_word: καθεξῆς
  choice: secara berurutan
  rationale: Pilihan ini menyampaikan adanya urutan atau penataan, sementara catatan kaki menjaga kemungkinan bahwa yang dimaksud ialah susunan yang teratur dan bukan kronologi yang ketat.
- source_word: σοι γράψαι
  choice: untuk menuliskannya bagimu
  rationale: Akhiran “-nya” merujuk kepada segala perkara yang sedang dibahas, sedangkan “bagimu” menyatakan Teofilus sebagai penerima sekaligus pihak yang menjadi tujuan penyusunan tulisan.
- source_word: κράτιστε
  choice: yang mulia
  rationale: Ini merupakan sapaan kehormatan formal yang juga dipakai dalam Lukas–Kisah Para Rasul bagi orang berkedudukan tinggi. “Yang mulia” sesuai dengan register dedikasi resmi.
- source_word: Θεόφιλε
  choice: Teofilus
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang sudah lazim.
theological_decisions:
- issue: Makna καθεξῆς sehubungan dengan urutan sejarah
  choice: secara berurutan
  alternative: dengan susunan yang teratur; menurut urutan kronologis
  rationale: καθεξῆς dapat menunjuk kepada urutan maupun penataan yang teratur, tetapi ayat ini tidak harus dipahami sebagai klaim bahwa seluruh penyajian mengikuti kronologi yang ketat. Terjemahan dan catatan kaki mempertahankan keluasan makna tersebut.
translation_notes:
  register: Bahasa dibuat formal, bermartabat, dan tetap wajar sebagai bagian dari kata pengantar sastra. Bentuk “saya” dipilih untuk narasi orang pertama dalam bahasa Indonesia modern, dan sapaan “Teofilus yang mulia” mempertahankan nuansa penghormatan resmi.
