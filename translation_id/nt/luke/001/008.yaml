base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: id
  text: Pada suatu kali, ketika Zakharia sedang bertugas sebagai imam di hadapan Allah menurut giliran kelompoknya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ketika
  rationale: Gabungan formula naratif dan konstruksi temporal berikutnya dialihkan secara alami sebagai pembuka anak kalimat dalam bahasa Indonesia. Tidak perlu memakai ungkapan harfiah dan kaku seperti 'terjadilah', sebab kalimat Yunani berlanjut ke ayat berikutnya.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: Zakharia menjalankan tugasnya sebagai imam
  rationale: Konstruksi ἐν dengan infinitif artikular menyatakan waktu, sedangkan ἱερατεύω menunjuk pada pelaksanaan pelayanan keimaman. Nama Zakharia dipakai untuk memperjelas rujukan pronomina secara wajar dalam bahasa Indonesia.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: menurut giliran kelompoknya
  rationale: τάξις menunjuk pada tata urutan yang ditetapkan, dan ἐφημερία pada kelompok imam beserta giliran pelayanannya. Ungkapan ini jelas bagi pembaca modern tanpa memakai istilah tradisional yang kurang transparan.
- source_word: ἔναντι τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Mempertahankan ungkapan kultis yang menyatakan bahwa pelayanan itu dilakukan dalam kehadiran Allah.
theological_decisions:
- issue: Istilah kultis bagi pelayanan Zakharia di Bait Allah
  choice: menjalankan tugasnya sebagai imam di hadapan Allah menurut giliran kelompoknya
  alternative: melayani sebagai imam di hadapan Allah sesuai urutan rombongannya
  rationale: Pilihan ini mempertahankan latar sistem pembagian tugas imam tanpa memasukkan pengertian jabatan gerejawi yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dipertahankan sebagai anak kalimat yang berlanjut ke ayat 9, sesuai struktur Yunani; karena itu diakhiri dengan koma.
