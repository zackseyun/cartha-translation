id: LUK.1.76
reference: Luke 1:76
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: id
  text: Dan engkau juga, anak, akan disebut nabi Yang Mahatinggi, sebab engkau akan pergi mendahului Tuhan[a] untuk mempersiapkan jalan-jalan-Nya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pergi di hadapan Tuhan.” Ungkapan ini dapat berarti pergi mendahului seseorang atau melayani di hadapannya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menggemakan nubuat tentang mempersiapkan jalan bagi Tuhan (bandingkan Yes. 40:3; Mal. 3:1). Dalam kisah Lukas, hal ini digenapi melalui pelayanan Yohanes yang mendahului Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Dan engkau juga
  rationale: Ungkapan ini mengalihkan perhatian kepada anak itu dengan penekanan; “juga” mempertahankan nuansa tambahan tanpa membuat susunan bahasa Indonesia terasa kaku.
- source_word: παιδίον
  choice: anakku
  rationale: Sapaan ini ditujukan Zakharia kepada Yohanes yang masih bayi. “Anakku” wajar dalam konteks seorang ayah berbicara kepada anaknya, tanpa menambahkan keterangan usia ke dalam teks.
- source_word: προφήτης
  choice: nabi
  rationale: Padanan baku dan langsung untuk προφήτης.
- source_word: Ὑψίστου
  choice: Yang Mahatinggi
  rationale: Mempertahankan gelar ilahi dalam bentuk yang alami dan khidmat dalam bahasa Indonesia.
- source_word: κληθήσῃ
  choice: akan disebut
  rationale: Bentuk pasif mendatang ini menyatakan sebutan atau pengakuan terhadap peran anak tersebut.
- source_word: προπορεύσῃ
  choice: akan berjalan mendahului
  rationale: Mengungkapkan tindakan pergi lebih dahulu sambil mempertahankan gambaran gerak dalam kata Yunani.
- source_word: ἐνώπιον κυρίου
  choice: mendahului Tuhan
  rationale: Dalam konstruksi ini, ἐνώπιον bersama προπορεύσῃ menunjuk pada pelayanan sebagai pendahulu Tuhan. Kemungkinan arti harfiah-relasional “di hadapan Tuhan” dipertahankan dalam catatan kaki.
- source_word: ἑτοιμάσαι
  choice: untuk mempersiapkan
  rationale: Infinitif ini menyatakan tujuan tindakan berjalan mendahului.
- source_word: ὁδοὺς αὐτοῦ
  choice: jalan-jalan-Nya
  rationale: Bentuk jamak ὁδούς dipertahankan dan gema bahasa nubuat tidak diratakan menjadi bentuk tunggal.
theological_decisions:
- issue: Acuan gelar “Tuhan” dalam nubuat tentang sang pendahulu
  choice: Tuhan
  alternative: Allah dalam latar nubuat Yesaya dan Maleakhi; atau Yesus dalam penggenapan naratif Lukas
  rationale: Teks Yunani hanya memakai κύριος. Latar Perjanjian Lama berbicara tentang mempersiapkan jalan Tuhan, sedangkan kisah Lukas menampilkan Yohanes sebagai pendahulu Yesus. Terjemahan tidak mempersempit acuan itu secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Anakku” dipilih sebagai sapaan alami seorang ayah kepada bayinya; bentuk jamak “jalan-jalan-Nya” dipertahankan demi kesetiaan pada teks Yunani dan gema nubuatnya.
