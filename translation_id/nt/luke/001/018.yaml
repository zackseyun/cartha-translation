  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: id
  text: Lalu Zakharia berkata kepada malaikat itu, “Bagaimana aku akan mengetahui hal ini? Sebab aku sudah tua, dan istriku sudah lanjut usia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Kata kerja naratif umum untuk memperkenalkan ucapan langsung; “berkata” alami dan tepat dalam bahasa Indonesia.
- source_word: πρὸς τὸν ἄγγελον
  choice: kepada malaikat itu
  rationale: Dengan kata kerja ujaran, πρός menandai pihak yang disapa. Artikel Yunani diterjemahkan secara wajar dengan “itu” karena malaikat tersebut sudah hadir dalam konteks.
- source_word: Κατὰ τί
  choice: Bagaimana
  rationale: Ungkapan ini menanyakan dasar atau sarana untuk memperoleh kepastian. “Bagaimana” mempertahankan pertanyaan tersebut tanpa menggesernya menjadi sekadar pertanyaan tentang kemampuan.
- source_word: γνώσομαι
  choice: aku akan mengetahui
  rationale: Bentuk futurum dipertahankan dengan “akan mengetahui”; pilihan ini mengungkapkan bagaimana Zakharia kelak dapat mengenali atau memastikan kebenaran berita itu.
- source_word: τοῦτο
  choice: hal ini
  rationale: Merujuk langsung kepada pemberitahuan malaikat; “hal ini” terdengar alami dalam bahasa Indonesia.
- source_word: πρεσβύτης
  choice: sudah tua
  rationale: Menunjukkan usia lanjut, bukan jabatan penatua. Dalam predikasi bahasa Indonesia, “aku sudah tua” lebih alami daripada “aku adalah seorang lelaki tua.”
- source_word: γυνή
  choice: istri
  rationale: Dengan kata ganti kepunyaan dan dalam konteks pasangan suami-istri, maknanya jelas “istri,” bukan sekadar “perempuan.”
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: sudah lanjut usia
  rationale: Ungkapan Yunani secara harfiah menggambarkan seseorang yang telah maju dalam hari-harinya, tetapi secara idiomatis berarti berusia lanjut. “Sudah lanjut usia” menyampaikan maknanya dengan alami dan bermartabat.
theological_decisions:
- issue: Makna ἄγγελος
  choice: malaikat
  alternative: utusan
  rationale: Walaupun ἄγγελος dapat berarti “utusan,” konteks langsung mengidentifikasi sosok yang berbicara sebagai Gabriel; karena itu “malaikat” adalah makna kontekstual tanpa penambahan doktrinal.
- issue: Nada pertanyaan Zakharia
  choice: Bagaimana aku akan mengetahui hal ini?
  alternative: Dari mana aku dapat memastikan hal ini?
  rationale: Terjemahan mempertahankan pertanyaan tentang dasar atau sarana untuk mengetahui, tanpa secara eksplisit menambahkan gagasan “tanda” atau menetapkan apakah pertanyaan itu terutama berupa keraguan, permintaan kepastian, atau keduanya.
translation_notes:
  register: Bahasa Indonesia modern, baku, alami, dan bermartabat. Susunan “aku sudah tua” serta “istriku sudah lanjut usia” menghindari kekakuan terjemahan harfiah sambil mempertahankan alasan ganda yang dikemukakan Zakharia.
