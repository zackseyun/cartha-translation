id: LUK.1.70
reference: Luke 1:70
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: id
  text: seperti yang telah difirmankan-Nya melalui mulut nabi-nabi-Nya yang kudus sejak dahulu kala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejak zaman dahulu”; ungkapan ini dapat menunjuk pada masa lampau yang sangat jauh. Sebagian orang memahaminya secara lebih kuat sebagai “sejak kekekalan”, tetapi penyebutan para nabi di sini lebih mendukung arti “sejak dahulu kala”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: seperti
  rationale: Menandai kesesuaian dengan pernyataan sebelumnya secara alami dalam bahasa Indonesia; nuansa penggenapan tetap terpelihara oleh konteks.
- source_word: ἐλάλησεν
  choice: telah difirmankan-Nya
  rationale: Bentuk ini menyatakan tindakan Allah berbicara pada masa lampau dan memakai diksi yang wajar bagi firman ilahi; akhiran -Nya merujuk kepada Allah.
- source_word: διὰ στόματος
  choice: melalui mulut
  rationale: Mempertahankan gambaran konkret idiom sumber tentang para nabi sebagai perantara perkataan Allah, tanpa meratakannya menjadi sekadar 'melalui'.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: nabi-nabi-Nya yang kudus
  rationale: Menerjemahkan ἁγίων sebagai atribut bagi para nabi dan mempertahankan gagasan bahwa mereka dikhususkan bagi Allah.
- source_word: ἀπ’ αἰῶνος
  choice: sejak dahulu kala
  rationale: Ungkapan Indonesia yang alami untuk masa lampau yang sangat jauh dan sesuai dengan konteks kesaksian para nabi, tanpa memaksakan arti metafisis 'sejak kekekalan'.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Pronomina ini paling wajar merujuk kepada Allah; dalam bahasa Indonesia dilekatkan pada 'nabi-nabi'.
theological_decisions:
- issue: Cakupan makna ἀπ’ αἰῶνος
  choice: masa purbakala dalam sejarah keselamatan ('sejak dahulu kala')
  alternative: masa lampau kekal ('sejak kekekalan')
  rationale: Acuan langsung kepada para nabi mendukung pengertian masa lampau yang sangat jauh dalam sejarah, meskipun alternatif yang lebih kuat dicatat agar rentang semantis sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom 'melalui mulut' sengaja dipertahankan karena jelas serta mencerminkan gambaran mediasi kenabian dalam teks Yunani.
