source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: id
  text: Dan Ia akan memerintah sebagai Raja atas kaum keturunan Yakub untuk selama-lamanya[a], dan kerajaan-Nya tidak akan berakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sepanjang segala zaman” atau “sampai zaman-zaman.” Ungkapan Yunani εἰς τοὺς αἰῶνας menyatakan jangka waktu yang tidak berkesudahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: akan memerintah sebagai Raja
  rationale: Bentuk futur aktif βασιλεύω menyatakan pelaksanaan pemerintahan rajawi. Perluasan alami ini mempertahankan unsur 'sebagai raja' yang dapat kurang jelas jika hanya diterjemahkan 'memerintah'.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: atas keturunan Yakub
  rationale: ἐπί dengan akusatif menyatakan lingkup kekuasaan, sedangkan οἶκος dalam ungkapan korporat ini menunjuk pada kaum atau garis keturunan Yakub. 'Keturunan Yakub' alami dalam bahasa Indonesia dan tidak memperluasnya menjadi 'umat Allah'.
- source_word: εἰς τοὺς αἰῶνας
  choice: untuk selama-lamanya
  rationale: Ungkapan Yunani ini menyatakan jangka waktu yang tidak berkesudahan. 'Untuk selama-lamanya' jelas, wajar, dan mempertahankan daya ungkap idiom tersebut.
- source_word: βασιλείας
  choice: kerajaan
  rationale: βασιλεία dapat berarti pemerintahan, kekuasaan rajawi, atau kerajaan. Dalam konstruksi dengan 'tidak akan berakhir', 'kerajaan' paling alami sambil tetap menyisakan keluasan maknanya.
- source_word: οὐκ ἔσται τέλος
  choice: tidak akan berakhir
  rationale: Konstruksi eksistensial ini secara harfiah menyatakan bahwa tidak akan ada akhir. Dalam bahasa Indonesia, 'tidak akan berakhir' menyampaikan penyangkalan dan makna futur secara lebih alami.
theological_decisions:
- issue: Cakupan 'kaum/rumah Yakub'
  choice: Diterjemahkan 'keturunan Yakub' tanpa diperluas menjadi 'Israel' atau 'umat Allah'.
  alternative: kaum Yakub; bangsa Israel; umat Allah
  rationale: Ungkapan perjanjian yang bersifat korporat ini perlu dipertahankan tanpa menafsirkan cakupannya menurut kesimpulan teologis yang lebih luas.
- issue: Durasi pemerintahan
  choice: εἰς τοὺς αἰῶνας diterjemahkan 'untuk selama-lamanya', dan kerajaan-Nya dinyatakan 'tidak akan berakhir'.
  alternative: sepanjang segala zaman; sampai zaman-zaman
  rationale: Kedua klausa menegaskan pemerintahan dan kerajaan yang tidak berkesudahan. Terjemahan ini menyampaikan arti lugasnya dalam bahasa Indonesia modern tanpa mengurangi kekuatannya.
- issue: Makna βασιλεία
  choice: Diterjemahkan 'kerajaan'.
  alternative: pemerintahan; kekuasaan rajawi
  rationale: Kata Yunani ini memiliki rentang makna antara tindakan memerintah dan ranah kerajaan. 'Kerajaan' paling idiomatis di sini, tetapi kemungkinan nuansa 'pemerintahan' tidak dijadikan penafsiran utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina ilahi ('Ia', '-Nya') mengikuti kelaziman penerbitan Alkitab Indonesia. Susunan dua klausa dipertahankan agar kesejajaran dan penegasan teks sumber tetap terasa.
