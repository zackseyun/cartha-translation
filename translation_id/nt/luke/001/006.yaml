  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: id
  text: Keduanya adalah orang benar di hadapan Allah[a] dan hidup tanpa cela dengan menaati segala perintah dan ketetapan Tuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam pandangan Allah.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Keduanya adalah orang benar di hadapan Allah dan hidup tanpa cela menurut segala perintah dan ketetapan Tuhan.”'
    reason: syntactical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: hidup benar
  rationale: Ungkapan ini secara alami menyampaikan bahwa Zakharia dan Elisabet benar dalam penilaian Allah, dengan nuansa moral dan relasional yang lebih utuh daripada sekadar 'adil'.
- source_word: ἀμφότεροι
  choice: keduanya
  rationale: Mempertahankan penekanan bahwa gambaran ini berlaku bagi kedua orang tersebut.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: 'Mempertahankan arti evaluatif dan relasional: mereka dinilai benar oleh Allah, bukan hanya oleh manusia.'
- source_word: πορευόμενοι
  choice: menjalani hidup
  rationale: Metafora berjalan di sini menunjuk pada cara hidup; padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: dengan menaati semua perintah
  rationale: Mengungkapkan hubungan antara cara hidup mereka dan ketaatan menyeluruh kepada perintah-perintah Tuhan secara alami.
- source_word: δικαιώμασιν
  choice: ketetapan
  rationale: Menunjuk pada ketentuan atau peraturan yang ditetapkan, sekaligus mempertahankan pembedaan dari 'perintah'.
- source_word: τοῦ κυρίου
  choice: Tuhan
  rationale: Dalam konteks ini κύριος merujuk kepada Allah Israel; 'Tuhan' merupakan padanan baku dan wajar.
- source_word: ἄμεμπτοι
  choice: tanpa cela
  rationale: Mempertahankan bentuk adjektival dan kekuatan istilah Yunani sambil menggambarkan kehidupan yang tidak dapat dipersalahkan, tanpa menambahkan klaim kesempurnaan tanpa dosa.
- source_word: ἦσαν δὲ
  choice: Keduanya hidup
  rationale: δέ adalah penghubung naratif ringan yang tidak harus dinyatakan secara eksplisit dalam bahasa Indonesia; bentuk lampau Yunani tersampaikan oleh konteks naratif.
theological_decisions:
- issue: Apakah ἄμεμπτοι berarti sama sekali tanpa dosa
  choice: Diterjemahkan 'tanpa cela', yang menyatakan perilaku yang tidak dapat dipersalahkan dalam ketaatan kepada Tuhan.
  alternative: Memahaminya sebagai kesempurnaan moral mutlak atau menerjemahkannya secara lebih lemah sebagai sekadar 'baik'.
  rationale: Konteks langsung menghubungkan istilah itu dengan cara hidup menurut semua perintah dan ketetapan Tuhan. Terjemahan mempertahankan pernyataan kuat teks tanpa menjadikannya klaim eksplisit tentang keadaan sama sekali tanpa dosa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Hidup benar' serta 'menjalani hidup' menghindari ungkapan harfiah yang kaku, sedangkan 'tanpa cela' mempertahankan kekuatan penilaian teks. Semua penanda catatan kaki dicantumkan dalam teks utama.
