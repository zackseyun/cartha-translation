id: LUK.1.12
reference: Luke 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: id
  text: Ketika Zakharia melihatnya, ia menjadi gelisah, dan rasa takut melandanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: menjadi gelisah
  rationale: Bentuk pasif aoris dari ταράσσω menyatakan keguncangan atau keresahan batin. Pilihan ini alami dalam bahasa Indonesia dan tidak memperkuat maknanya menjadi kengerian, yang kemudian dinyatakan secara tersendiri oleh φόβος.
- source_word: Ζαχαρίας
  choice: Zakharia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἰδών
  choice: ketika ... melihatnya
  rationale: Partisip aoris ini paling wajar dipahami memiliki daya temporal dalam konteks. Akhiran -nya merujuk kepada malaikat yang disebut pada ayat sebelumnya.
- source_word: φόβος
  choice: rasa takut
  rationale: Padanan langsung dan tidak berlebihan bagi φόβος; pilihan yang lebih kuat seperti 'kengerian' akan mempersempit atau meningkatkan intensitas makna.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: melandanya
  rationale: Ungkapan Yunani secara harfiah menggambarkan rasa takut yang 'jatuh ke atas' seseorang. 'Melandanya' mempertahankan gambaran tentang sesuatu yang datang dengan kuat sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa temporal di awal mengalir alami; pengulangan pronomina dihindari tanpa menghilangkan hubungan antarklausa.
