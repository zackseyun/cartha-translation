id: LUK.1.65
reference: Luke 1:65
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: id
  text: Lalu semua orang yang tinggal di sekitar mereka diliputi rasa takut[b], dan di seluruh daerah perbukitan Yudea, semua hal ini[a] terus diperbincangkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua perkataan ini” atau “semua perkara ini.” Kata Yunani yang digunakan dapat merujuk pada perkataan maupun peristiwa yang sedang dibicarakan.
    reason: lexical_alternative
  - marker: b
    text: “Rasa takut” di sini dapat mencakup rasa gentar dan takjub karena menyaksikan tindakan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: semua ... diliputi rasa takut
  rationale: Ungkapan ini menyatakan timbulnya rasa takut pada semua orang. Bentuk Indonesia ini alami sekaligus mempertahankan daya peristiwa dari ἐγένετο dan arah ἐπί.
- source_word: φόβος
  choice: rasa takut
  rationale: Pilihan langsung ini mempertahankan rentang makna φόβος; dalam konteks tindakan Allah, maknanya dapat mencakup rasa gentar dan takjub tanpa menentukannya secara sempit.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: orang yang tinggal di sekitar mereka
  rationale: Mencerminkan arti περιοικέω, yaitu tinggal di sekitar atau dekat seseorang, tanpa mempersempitnya menjadi hanya 'tetangga'.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: di seluruh daerah perbukitan Yudea
  rationale: ἡ ὀρεινή menunjuk pada kawasan dataran tinggi atau perbukitan; susunan ini jelas dan alami dalam bahasa Indonesia.
- source_word: διελαλεῖτο
  choice: terus diperbincangkan
  rationale: Bentuk imperfek pasif menggambarkan pembicaraan yang berlangsung dan beredar luas, yang secara alami dinyatakan dengan 'terus diperbincangkan'.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: semua hal ini
  rationale: ῥήματα dapat merujuk pada perkataan maupun perkara atau peristiwa yang dibicarakan. 'Hal' menjaga keluasan rujukan itu dalam narasi.
theological_decisions:
- issue: Nuansa φόβος sebagai tanggapan terhadap tindakan Allah
  choice: rasa takut
  alternative: rasa takjub; rasa gentar penuh hormat
  rationale: Terjemahan langsung mempertahankan ketegangan antara ketakutan dan ketakjuban yang dapat terkandung dalam konteks ini, tanpa memasukkan penafsiran teologis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Lalu' menghubungkan ayat ini dengan peristiwa sebelumnya; 'terus diperbincangkan' menyampaikan aspek berlangsung dari bentuk imperfek.
