id: LUK.1.26
reference: Luke 1:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: id
  text: Pada bulan keenam[a], malaikat Gabriel diutus dari Allah ke sebuah kota di Galilea yang bernama Nazaret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, bulan keenam kehamilan Elisabet; lihat Lukas 1:24, 36.
    reason: cross_reference
  - marker: b
    text: 'Secara lebih harfiah: “ke sebuah kota Galilea yang bernama Nazaret.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Pada bulan keenam
  rationale: Frasa ἐν dengan datif menyatakan waktu. Partikel δέ merupakan penghubung ringan yang tidak perlu diterjemahkan secara tersendiri di sini agar bahasa Indonesia tetap alami.
- source_word: ἀπεστάλη
  choice: diutus
  rationale: Bentuk aoristus pasif ἀποστέλλω dipertahankan sebagai pasif. 'Diutus' menyampaikan tindakan mengirim dengan unsur penugasan yang sesuai konteks.
- source_word: ὁ ἄγγελος
  choice: malaikat
  rationale: Dalam konteks ini ἄγγελος merujuk pada makhluk surgawi, sehingga 'malaikat' lebih tepat daripada 'utusan'.
- source_word: Γαβριὴλ
  choice: Gabriel
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku dalam bahasa Indonesia.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: dari Allah
  rationale: ἀπό dengan genitif terutama menunjukkan sumber atau asal. 'Dari Allah' mempertahankan penekanan itu tanpa mengubahnya menjadi frasa pelaku 'oleh Allah'.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: ke sebuah kota di Galilea
  rationale: εἰς menyatakan tujuan, sedangkan genitif τῆς Γαλιλαίας secara alami menyatakan lokasi dalam bahasa Indonesia.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: yang bernama Nazaret
  rationale: Ungkapan relatif yang secara harfiah berarti 'yang namanya Nazaret' diterjemahkan secara ringkas dan wajar tanpa kehilangan makna.
theological_decisions:
- issue: Acuan 'bulan keenam'
  choice: Teks utama tetap berbunyi 'bulan keenam', dengan catatan bahwa konteks menunjuk pada bulan keenam kehamilan Elisabet.
  alternative: Bulan keenam dalam kalender.
  rationale: Konteks dekat dalam Lukas 1:24 dan 1:36 menunjukkan kehamilan Elisabet, tetapi ayat Yunani ini sendiri tidak mengulang acuannya. Karena itu, penjelasan ditempatkan dalam catatan kaki dan bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara bentuk pasif dan penekanan pada asal ilahi tetap dipertahankan.
