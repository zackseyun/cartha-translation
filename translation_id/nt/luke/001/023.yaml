id: LUK.1.23
reference: Luke 1:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: id
  text: Ketika masa tugas pelayanannya[a] selesai, Zakharia pulang ke rumahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud dengan “tugas pelayanan” ialah giliran tugas Zakharia sebagai imam di Bait Allah.
    reason: cultural_note
  - marker: b
    text: Kata Yunani yang diterjemahkan “rumah” dapat menunjuk bangunan rumah itu sendiri atau, secara lebih luas, tempat tinggal dan rumah tangganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: tidak diterjemahkan secara tersendiri
  rationale: Sebagai formula naratif khas Lukas, unsur ini dapat dilebur secara alami ke dalam konstruksi waktu bahasa Indonesia tanpa kehilangan isi peristiwa.
- source_word: ὡς
  choice: ketika
  rationale: Memperkenalkan anak kalimat waktu dan paling wajar dalam bahasa Indonesia modern.
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: masa ... selesai
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan bahwa seluruh hari yang ditetapkan bagi tugas itu telah mencapai akhirnya.
- source_word: λειτουργίας
  choice: tugas pelayanannya
  rationale: Menjaga gagasan pelayanan resmi yang ditugaskan; catatan kaki menjelaskan bahwa konteksnya adalah tugas imam di Bait Allah.
- source_word: ἀπῆλθεν
  choice: pulang
  rationale: Karena tujuannya adalah rumahnya sendiri, 'pulang' lebih alami daripada 'pergi' dan tetap menyampaikan gerak meninggalkan tempat tugas.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: ke rumahnya
  rationale: οἶκος dapat menunjuk rumah sebagai bangunan maupun tempat tinggal/lingkungan rumah tangga; 'rumahnya' alami, sedangkan keluasan maknanya dicatat dalam catatan kaki.
theological_decisions: []
