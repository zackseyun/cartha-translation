  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: id
  text: Sebab tidak ada firman dari Allah yang mustahil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab bagi Allah tidak ada yang mustahil.”
    reason: Terjemahan alternatif yang mencerminkan pemahaman tradisional atas παρά dan pemakaian ῥῆμα dalam arti luas sebagai hal atau perkara.
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Dalam konteks, kata ini memperkenalkan alasan yang mendasari pernyataan Gabriel sebelumnya; “Sebab” mempertahankan fungsi penjelas itu secara alami dalam bahasa Indonesia.
- source_word: οὐκ ἀδυνατήσει
  choice: tidak ada ... yang mustahil
  rationale: Bentuk mendatang ἀδυνατέω menyatakan bahwa sesuatu tidak akan mustahil atau tidak akan gagal terwujud. Susunan ini menyampaikan makna tersebut secara idiomatis dalam bahasa Indonesia.
- source_word: παρὰ τοῦ θεοῦ
  choice: dari Allah
  rationale: παρά dengan bentuk genitif dapat menunjukkan sumber. Bersama ῥῆμα, frasa ini paling wajar dipahami sebagai firman yang berasal dari Allah, tanpa meniadakan kemungkinan terjemahan tradisional “bagi Allah” yang dicatat dalam catatan kaki.
- source_word: πᾶν
  choice: tidak ada
  rationale: Walaupun πᾶν secara harfiah berarti “setiap” atau “segala”, gabungannya dengan verba negatif paling alami dinyatakan sebagai “tidak ada ... yang mustahil”, dengan tetap mempertahankan cakupan universalnya.
- source_word: ῥῆμα
  choice: firman
  rationale: ῥῆμα dapat berarti perkataan, pernyataan, atau perkara. “Firman” mempertahankan unsur perkataan ilahi dan sesuai dengan konteks perkataan yang disampaikan Gabriel, tanpa mempersempitnya secara eksplisit menjadi “janji”.
theological_decisions:
- issue: Makna frasa παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Ayat ini menyatakan bahwa tidak ada firman dari Allah yang mustahil.
  alternative: Sebab bagi Allah tidak ada yang mustahil.
  rationale: Kedua pemahaman dapat dipertanggungjawabkan secara tata bahasa dan terdapat dalam tradisi penerjemahan. Teks utama mempertahankan ῥῆμα sebagai “firman” serta membaca παρά dengan genitif sebagai penanda sumber, sesuai konteks perkataan Allah yang disampaikan kepada Maria. Terjemahan tradisional yang menekankan kemampuan Allah dipertahankan dalam catatan kaki agar ketegangan penafsirannya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Firman” dipakai untuk mempertahankan rujukan eksplisit kepada perkataan yang berasal dari Allah; catatan kaki menyajikan ungkapan tradisional yang alami dan dikenal luas.
