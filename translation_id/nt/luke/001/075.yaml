  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: id
  text: dalam kekudusan dan kebenaran di hadapan-Nya sepanjang hidup kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: dalam
  rationale: Preposisi ini menyatakan ranah atau cara hidup dan pelayanan; “dalam” mempertahankan susunan Yunani dan tetap alami dalam bahasa Indonesia.
- source_word: ὁσιότητι
  choice: kekudusan
  rationale: Ὁσιότης menunjuk pada kesalehan atau kekudusan dalam hubungan dengan Allah. “Kekudusan” mempertahankan bobot istilah itu serta membedakannya dari δικαιοσύνη.
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung sederhana yang menggabungkan dua nomina sejajar.
- source_word: δικαιοσύνῃ
  choice: kebenaran
  rationale: Dalam konteks etis ini, δικαιοσύνη berarti kelurusan hidup di hadapan Allah. “Kebenaran” merupakan padanan Alkitabiah Indonesia yang dikenal, sedangkan “keadilan” tetap mungkin secara leksikal.
- source_word: ἐνώπιον αὐτοῦ
  choice: di hadapan-Nya
  rationale: Ungkapan ini berarti berada dalam kehadiran dan penilaian Allah; “di hadapan-Nya” ringkas, alami, dan mempertahankan nuansa relasionalnya.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: sepanjang hidup kita
  rationale: Secara harfiah berarti “seluruh hari-hari kita” dan secara idiomatis menunjuk pada seluruh masa hidup. “Sepanjang hidup kita” lebih alami dalam bahasa Indonesia modern tanpa mengubah maksudnya.
theological_decisions:
- issue: Makna δικαιοσύνη dalam konteks etis non-Paulus
  choice: kebenaran
  alternative: keadilan
  rationale: Karena istilah ini dipasangkan dengan ὁσιότης dan menggambarkan kelurusan hidup di hadapan Allah, “kebenaran” lebih sesuai daripada “keadilan” dalam konteks langsung ini. Kemungkinan arti “keadilan” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ungkapan “sepanjang hidup kita” dipilih sebagai bentuk idiomatis dari frasa Yunani “seluruh hari-hari kita”; kapitalisasi pronomina pada “-Nya” mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
