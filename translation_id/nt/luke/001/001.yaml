  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: id
  text: Karena banyak orang telah mengambil inisiatif untuk menyusun suatu kisah tentang peristiwa-peristiwa yang telah digenapi di antara kita,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah terlaksana” atau “yang telah diteguhkan sepenuhnya di antara kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Karena
  rationale: Membuka prakata resmi Lukas dengan hubungan sebab atau latar belakang; bentuk ini alami dalam bahasa Indonesia dan mengarahkan pembaca kepada klausa utama yang menyusul.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Menyatakan jumlah secara langsung tanpa menambahkan gagasan 'orang lain' yang tidak tersurat dalam bahasa Yunani.
- source_word: ἐπεχείρησαν
  choice: telah mengambil inisiatif
  rationale: Menyampaikan tindakan memulai atau menjalankan suatu usaha tanpa menyiratkan bahwa usaha itu gagal, seperti yang mungkin tersirat oleh 'mencoba'.
- source_word: ἀνατάξασθαι
  choice: untuk menyusun
  rationale: Menggambarkan kegiatan menata dan menggubah bahan menjadi sebuah uraian tertulis dengan bahasa Indonesia yang wajar.
- source_word: διήγησιν
  choice: suatu kisah
  rationale: Menunjuk pada uraian naratif; 'kisah' mudah dipahami dan tetap sesuai dengan corak historiografis prakata ini.
- source_word: περὶ
  choice: tentang
  rationale: Padanan baku dan alami untuk memperkenalkan pokok uraian.
- source_word: τῶν πεπληροφορημένων
  choice: yang telah digenapi
  rationale: Perfect passive participle ini paling mungkin menunjuk pada hal-hal yang telah dibawa kepada penggenapan, tetapi kemungkinan makna 'terlaksana' atau 'diteguhkan sepenuhnya' tetap dicatat dalam catatan kaki.
- source_word: ἐν ἡμῖν
  choice: di antara kita
  rationale: Mempertahankan acuan komunal yang terbuka tanpa menentukan bahwa 'kita' hanya berarti kelompok tertentu.
- source_word: πραγμάτων
  choice: peristiwa-peristiwa
  rationale: Dalam konteks kisah yang akan disusun, kata ini secara alami menunjuk pada kejadian atau hal yang berlangsung; 'peristiwa-peristiwa' lebih konkret daripada 'hal-hal'.
theological_decisions:
- issue: Makna πεπληροφορημένων dalam prakata Lukas
  choice: telah digenapi
  alternative: telah terlaksana; telah diteguhkan sepenuhnya
  rationale: Dengan πραγμάτων dan kisah tentang karya penyelamatan yang menyusul, makna penggenapan paling sesuai dengan konteks. Namun, bentuk Yunani juga dapat dipahami sebagai pencapaian/pelaksanaan atau peneguhan penuh, sehingga ketegangan leksikal itu tidak dihapus dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan mempertahankan corak prakata resmi, tetapi tetap mudah dipahami. Ayat ini sengaja berakhir dengan koma karena kalimat Yunani berlanjut ke ayat berikutnya.
