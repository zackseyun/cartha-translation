  terminology: Istilah “digenapi” secara tepat mempertahankan nuansa penggenapan yang dipilih dalam jejak audit Inggris, tanpa memaksakan penafsiran doktrinal. Catatan kaki menyediakan alternatif leksikal “terlaksana” dan “diteguhkan sepenuhnya,” sehingga ambiguitas yang relevan tetap tersedia bagi pembaca.
