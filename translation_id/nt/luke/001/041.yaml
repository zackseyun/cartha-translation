id: LUK.1.41
reference: Luke 1:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: id
  text: Lalu, ketika Elisabet mendengar salam Maria[a], bayi di dalam rahimnya melonjak, dan Elisabet dipenuhi Roh Kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: Lalu, ketika
  rationale: Ungkapan naratif khas Lukas ini memperkenalkan peristiwa berikutnya. “Lalu, ketika” menyampaikan peralihan dan hubungan waktunya secara wajar dalam bahasa Indonesia modern tanpa memakai rumusan kaku seperti “dan terjadilah bahwa”.
- source_word: ἀσπασμός
  choice: salam
  rationale: Kata ini menunjuk pada ucapan salam Maria. “Salam” jelas, alami, dan sesuai dengan konteks; “sapaan” dicatat sebagai alternatif leksikal.
- source_word: Μαρίας
  choice: Maria
  rationale: Genitif Yunani dinyatakan melalui susunan frasa bahasa Indonesia “salam Maria,” yaitu salam yang diucapkan Maria.
- source_word: ἐσκίρτησεν
  choice: melonjak
  rationale: Kata kerja ini menggambarkan gerakan mendadak dan hidup. “Melonjak” mempertahankan daya gambarnya lebih baik daripada “bergerak” atau “menggeliat”.
- source_word: βρέφος
  choice: bayi
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Yohanes yang masih berada dalam kandungan Elisabet. “Bayi” merupakan padanan modern yang konkret dan alami.
- source_word: ἐν τῇ κοιλίᾳ αὐτῆς
  choice: di dalam rahimnya
  rationale: Dalam konteks kehamilan, κοιλία secara khusus merujuk pada rahim. Bentuk “-nya” secara alami merujuk kepada Elisabet.
- source_word: ἐπλήσθη
  choice: dipenuhi
  rationale: Bentuk pasif Yunani dipertahankan dan menyiratkan tindakan ilahi tanpa menambahkan pelaku yang tidak dinyatakan secara eksplisit.
- source_word: πνεύματος ἁγίου
  choice: Roh Kudus
  rationale: Dalam konteks Lukas, ungkapan ini merujuk kepada Roh ilahi yang memberi ilham kenabian. Kapitalisasi menyatakan referen tersebut secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Referen πνεύματος ἁγίου
  choice: Roh Kudus sebagai Roh ilahi
  alternative: suatu roh kudus
  rationale: Pemakaian ungkapan ini dalam Lukas-Kisah Para Rasul dan konteks ucapan Elisabet yang terilhami mendukung referen ilahi. Terjemahan tidak menambahkan penjelasan doktrinal di luar teks.
- issue: Sebutan βρέφος bagi Yohanes yang belum lahir
  choice: bayi
  alternative: anak; bayi kecil
  rationale: Istilah Yunani menunjuk pada anak yang sangat muda dan di sini secara konkret berada dalam rahim. “Bayi” mempertahankan rujukan teks tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Rumusan “Lalu, ketika” menyampaikan fungsi formula naratif Yunani tanpa kekakuan harfiah. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
