lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Dalam alur naratif bahasa Indonesia, “Lalu” secara alami menghubungkan perkataan Maria dengan konteks sebelumnya tanpa memperberat kalimat.
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk aoristus λέγω paling wajar diterjemahkan sebagai pengantar ujaran naratif “berkata”.
- source_word: Μαριάμ
  choice: Maria
  rationale: Nama ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: Μεγαλύνει
  choice: mengagungkan
  rationale: “Mengagungkan” mempertahankan gagasan menyatakan atau memuji sebagai agung dan sesuai dengan gaya puitis, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: ἡ ψυχή μου
  choice: Jiwaku
  rationale: Pilihan ini mempertahankan ungkapan antropologis-puitis Yunani dan tidak mereduksinya menjadi sekadar “aku”.
- source_word: τὸν κύριον
  choice: Tuhan
  rationale: Dalam konteks pujian yang ditujukan kepada Allah, κύριος berfungsi sebagai gelar ilahi; “Tuhan” adalah padanan baku dan paling sesuai.
theological_decisions:
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: Tuan
  rationale: Konteks himne dan gema bahasa pujian Kitab Suci menunjukkan gelar ilahi. “Tuan” mungkin secara leksikal, tetapi terlalu sempit dan kurang sesuai di sini.
- issue: Ungkapan antropologis ἡ ψυχή μου
  choice: Jiwaku
  alternative: Aku; seluruh batinku
  rationale: “Jiwaku” mempertahankan diksi teologis-puitis teks tanpa menetapkan secara berlebihan suatu teori antropologi tertentu atau meratakan ungkapan itu menjadi kata ganti.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Susunan puitis “Jiwaku mengagungkan Tuhan” dipertahankan; kapitalisasi “Tuhan” menandai gelar ilahi dalam konteks ini.
