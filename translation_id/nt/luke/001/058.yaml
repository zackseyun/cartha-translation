  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: id
  text: Para tetangga dan kerabat Elisabet mendengar bahwa Tuhan telah menunjukkan belas kasih-Nya yang besar kepadanya, lalu mereka turut bersukacita bersama Elisabet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: tetangga-tetangga
  rationale: Menunjuk kepada orang-orang yang tinggal di sekitar Elisabet; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: συγγενεῖς
  choice: sanak saudara
  rationale: Mengacu pada kaum kerabat; 'sanak saudara' merupakan ungkapan Indonesia yang wajar dan cukup luas.
- source_word: ἐμεγάλυνεν
  choice: telah menunjukkan ... yang besar
  rationale: Dalam konstruksi dengan 'belas kasihan', verba ini secara idiomatis menyatakan bahwa Tuhan memperlihatkan belas kasihan-Nya secara besar atau berlimpah. Terjemahan ini lebih alami daripada 'membesarkan belas kasihan'.
- source_word: κύριος
  choice: Tuhan
  rationale: Berfungsi sebagai sebutan ilahi yang definit dalam konteks ini; 'Tuhan' adalah padanan Indonesia yang baku.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: belas kasihan
  rationale: ἔλεος menyatakan belas kasihan atau kemurahan penuh iba. Pronomina kepunyaan tidak dinyatakan tersendiri karena dalam bahasa Indonesia 'Tuhan menunjukkan belas kasihan' sudah alami dan subjeknya jelas.
- source_word: μετ’ αὐτῆς
  choice: kepadanya
  rationale: Walaupun μετά secara dasar berarti 'dengan', dalam idiom ini relasinya paling alami dinyatakan sebagai arah penerimaan belas kasihan, yakni 'kepadanya'.
- source_word: συνέχαιρον αὐτῇ
  choice: mereka turut bersukacita bersamanya
  rationale: Menjaga gagasan bersukacita bersama seseorang; 'turut' menandai bahwa mereka mengambil bagian dalam sukacita Elisabet.
theological_decisions:
- issue: Idiom ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: Tuhan telah menunjukkan belas kasihan yang besar kepadanya
  alternative: Tuhan telah membesarkan belas kasihan-Nya bersama dia
  rationale: Pilihan utama menyampaikan makna idiom Yunani secara tepat dan wajar dalam bahasa Indonesia tanpa mengaburkan bahwa Tuhan adalah pelaku dan Elisabet penerima belas kasihan. Alternatif yang sangat harfiah terasa tidak alami dan dapat menyesatkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama 'Elisabet' digunakan untuk memperjelas rujukan αὐτῆς dalam ayat yang berdiri sendiri; pengulangan 'bersukacita bersamanya' dipertahankan agar unsur kebersamaan dalam συνέχαιρον tetap tampak.
