  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: id
  text: “Demikianlah Tuhan telah berbuat kepadaku pada hari-hari ketika Ia memperhatikan aku untuk menghapus aibku[a] di antara orang-orang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehinaanku” atau “maluku.” Kata Yunani ini terutama menunjuk pada cela atau hilangnya kehormatan di mata masyarakat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: tidak diterjemahkan secara tersendiri
  rationale: Di sini ὅτι mengikuti gagasan ‘berkata’ dari ayat sebelumnya dan memperkenalkan isi ucapan Elisabet. Tanda petik bahasa Indonesia sudah menjalankan fungsi tersebut; menerjemahkannya sebagai ‘sebab’ dapat memberi hubungan sebab-akibat yang terlalu tegas.
- source_word: Οὕτως
  choice: Demikianlah
  rationale: Menjaga penekanan pada cara Tuhan bertindak serta tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: μοι
  choice: bagiku
  rationale: Datif ini menyatakan bahwa tindakan Tuhan ditujukan kepada atau dilakukan demi Elisabet; ‘bagiku’ ringkas dan alami.
- source_word: πεποίηκεν
  choice: telah bertindak
  rationale: Bentuk perfektum menyatakan tindakan yang telah terjadi dengan akibat yang masih dirasakan. ‘Telah bertindak’ sesuai dengan konstruksi bersama Οὕτως dan μοι tanpa mempersempit maknanya.
- source_word: κύριος
  choice: Tuhan
  rationale: Dalam konteks ini κύριος merujuk kepada Allah. ‘Tuhan’ merupakan padanan gelar yang lazim dalam bahasa Indonesia.
- source_word: ἐν ἡμέραις αἷς
  choice: ketika
  rationale: Konstruksi temporal harfiah ‘pada hari-hari ketika’ terasa kaku dalam bahasa Indonesia. ‘Ketika’ menyampaikan hubungan waktunya secara alami tanpa mengubah maksud.
- source_word: ἐπεῖδεν
  choice: Ia memperhatikan aku
  rationale: Kata ini menyatakan tindakan memandang dengan perhatian atau kepedulian. ‘Memperhatikan’ mengungkapkan perhatian ilahi tanpa menambahkan gagasan seperti belas kasihan yang tidak dinyatakan langsung.
- source_word: ἀφελεῖν
  choice: untuk menghapus
  rationale: Infinitif ini dapat menyatakan tujuan atau hasil. ‘Untuk menghapus’ mempertahankan keterbukaan itu dan cocok dengan objek berupa aib sosial.
- source_word: ὄνειδός μου
  choice: aibku
  rationale: ὄνειδος menunjuk pada cela, kehinaan, atau keadaan yang mendatangkan pandangan merendahkan dari masyarakat. ‘Aibku’ alami dalam bahasa Indonesia dan mempertahankan dimensi sosialnya.
- source_word: ἐν ἀνθρώποις
  choice: di antara orang-orang
  rationale: Frasa ini menunjukkan lingkungan sosial tempat aib itu dialami. ‘Orang-orang’ bersifat umum dan tidak membatasi makna pada laki-laki.
theological_decisions:
- issue: Rujukan κύριος
  choice: Tuhan, yakni Allah
  alternative: Memahami gelar ini secara kristologis
  rationale: Konteks langsungnya adalah ucapan Elisabet tentang tindakan Allah yang mengangkat keadaan mandul dan aib sosialnya. Terjemahan tidak memasukkan rujukan kristologis yang lebih sempit ke dalam konteks ini.
- issue: Makna sosial ὄνειδος
  choice: aibku
  alternative: maluku; celaanku; kehinaanku
  rationale: ‘Aib’ mempertahankan unsur kehinaan di mata masyarakat, bukan hanya perasaan malu dalam batin. Catatan kaki mencantumkan padanan lain untuk menjelaskan rentang maknanya.
- issue: Hubungan ἐπεῖδεν dan ἀφελεῖν
  choice: mempertahankan bentuk ‘memperhatikan aku untuk menghapus’
  alternative: menafsirkan secara eksplisit sebagai ‘memperhatikan aku dan dengan demikian menghapus’
  rationale: Bentuk infinitif Yunani dapat dipahami dalam nuansa tujuan atau hasil. Terjemahan mempertahankan ketegangan tersebut dan tidak memaksakan salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Demikianlah’ mempertahankan nada kesaksian Elisabet, sedangkan susunan kalimat dihaluskan agar alami tanpa menghilangkan unsur perhatian ilahi dan aib sosial.
