  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: id
  text: Namun, ia sangat gelisah oleh perkataan itu[a] dan terus memikirkan seperti apakah salam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh ucapan itu” atau “oleh pesan itu.” Kata Yunani λόγος dapat berarti “perkataan,” “ucapan,” atau “pesan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan ringan dari salam malaikat kepada reaksi Maria; ‘namun’ wajar dalam narasi Indonesia tanpa memberi pertentangan yang terlalu kuat.
- source_word: ἐπὶ τῷ λόγῳ
  choice: karena perkataan itu
  rationale: λόγος menunjuk pada apa yang baru saja diucapkan malaikat. Frasa ini juga mempertahankan kemungkinan nuansa sebab dari ἐπί dengan datif.
- source_word: διεταράχθη
  choice: sangat gelisah
  rationale: Bentuk verba ini menyatakan keguncangan atau keresahan yang kuat; ‘sangat gelisah’ alami dalam bahasa Indonesia dan tidak menambahkan penilaian moral.
- source_word: διελογίζετο
  choice: terus memikirkan
  rationale: Bentuk imperfek menggambarkan pertimbangan batin yang sedang berlangsung; ‘terus’ menyatakan aspek berkelanjutan itu.
- source_word: ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος
  choice: “Salam macam apakah itu gerangan?”
  rationale: ‘Macam apakah’ menyampaikan pertanyaan tentang sifat salam tersebut, sedangkan ‘gerangan’ mempertahankan nuansa tentatif dari optatif dalam wacana tak langsung. Bentuk pertanyaan batin terasa alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat reaksi Maria
  choice: Maria digambarkan sangat gelisah karena perkataan atau salam malaikat dan terus memikirkan sifatnya.
  alternative: Maria takut karena penampakan malaikat atau menunjukkan ketidakpercayaan.
  rationale: Teks Yunani mengaitkan kegelisahannya dengan perkataan yang diucapkan dan menggambarkan perenungan batin, tanpa menyatakan ketidakpercayaan, dosa, atau kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang khidmat. Kata ‘gerangan’ dipakai secara terbatas untuk menyampaikan nuansa pertanyaan batin yang tentatif tanpa membuat kalimat sukar dipahami.
