  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: id
  text: Dan ia akan membawa banyak anak Israel berbalik kepada Tuhan, Allah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak orang Israel” atau “banyak dari bangsa Israel.” Secara harfiah, bahasa Yunani berbunyi “banyak dari antara putra-putra Israel”; “anak Israel” merupakan ungkapan perjanjian tradisional.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan kata penghubung di awal klausa dan kesinambungan alur dengan ayat sebelumnya.
- source_word: πολλοὺς
  choice: banyak dari antara
  rationale: Adjektiva ini dipakai secara substantival dengan frasa genitif berikutnya; bentuk ini alami dalam bahasa Indonesia dan menyatakan bahwa yang dimaksud adalah banyak orang dari kelompok Israel.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: anak-anak Israel
  rationale: Ini merupakan ungkapan perjanjian tradisional yang secara harfiah berbunyi 'anak-anak lelaki Israel'; 'anak-anak Israel' mempertahankan ungkapan alkitabiah sekaligus berfungsi wajar sebagai sebutan kolektif dalam bahasa Indonesia.
- source_word: ἐπιστρέψει
  choice: akan membuat ... berbalik
  rationale: Bentuk aktif transitif menampilkan Yohanes sebagai pelaku yang menyebabkan banyak orang berbalik; pilihan ini menghindari kata 'menobatkan' yang lebih interpretatif.
- source_word: ἐπὶ
  choice: kepada
  rationale: Bersama ἐπιστρέφω dan kasus akusatif, kata ini menunjukkan arah perubahan atau kembalinya seseorang kepada suatu pribadi.
- source_word: κύριον
  choice: Tuhan
  rationale: Dalam konteks ini κύριος menunjuk kepada Allah Israel, bukan sekadar seorang tuan manusia.
- source_word: τὸν θεὸν αὐτῶν
  choice: Allah mereka
  rationale: Frasa ini menjelaskan 'Tuhan' secara aposisional dan mempertahankan bahasa relasi perjanjian.
theological_decisions:
- issue: Penerjemahan ungkapan perjanjian τῶν υἱῶν Ἰσραὴλ
  choice: anak-anak Israel
  alternative: orang-orang Israel; bangsa Israel; secara harfiah, anak-anak lelaki Israel
  rationale: Ungkapan Yunani mempertahankan idiom biblis yang berakar pada sebutan keturunan Israel. Dalam bahasa Indonesia, 'anak-anak Israel' menjaga gaung tradisional tanpa mengharuskan pembaca memahami kelompok itu hanya sebagai laki-laki.
- issue: Rujukan κύριον τὸν θεὸν αὐτῶν
  choice: Tuhan, Allah mereka
  alternative: Tuan mereka, yaitu Allah
  rationale: Aposisi tersebut mengidentifikasi κύριος sebagai Allah Israel dan membawa bobot perjanjian; karena itu 'Tuhan' lebih tepat daripada 'tuan'.
- issue: Kekuatan kausatif ἐπιστρέψει
  choice: akan membuat ... berbalik
  alternative: akan membawa ... kembali; akan mengembalikan
  rationale: Pilihan ini mempertahankan Yohanes sebagai agen pelayanan tanpa merinci secara dogmatis bagaimana perubahan hati itu berlangsung.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Susunan 'membuat ... berbalik kepada' mempertahankan daya transitif teks Yunani, sedangkan 'anak-anak Israel' menjaga corak biblis; koma pada 'Tuhan, Allah mereka' memperjelas hubungan aposisional.
