id: LUK.1.48
reference: Luke 1:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: id
  text: sebab Ia telah memperhatikan kerendahan kedudukan[a] hamba-Nya[b]. Lihatlah, mulai sekarang semua generasi akan menyebut aku berbahagia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadaan rendah” atau “keadaan yang direndahkan.”
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya berbentuk feminin dan secara lebih harfiah berarti “budak perempuan-Nya”; dapat juga diterjemahkan “pelayan perempuan-Nya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: telah memperhatikan
  rationale: Ungkapan ini menyatakan bahwa Allah mengarahkan perhatian kepada Maria, dengan nuansa kepedulian atau perkenanan. Pilihan ini lebih jelas daripada sekadar 'memandang' dan mempertahankan relevansi tindakan itu dalam pujian Maria.
- source_word: ταπείνωσιν
  choice: kerendahan kedudukan
  rationale: Kata ini di sini terutama menunjuk pada keadaan Maria yang rendah dan tidak terpandang, bukan hanya sifat rendah hati dalam batin. Ungkapan ini mempertahankan dimensi sosial tanpa mengharuskan arti penghinaan.
- source_word: δούλης
  choice: hamba-Nya
  rationale: '''Hamba'' merupakan ungkapan Indonesia yang alami dan bermartabat untuk seseorang yang sepenuhnya berada di bawah serta menjadi milik tuannya. Bentuk Yunani berjenis feminin dan dapat secara lebih harfiah diterjemahkan ''budak perempuan-Nya''; nuansa itu dicatat dalam catatan kaki.'
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian pada pernyataan yang menyusul. 'Lihatlah' mempertahankan daya penunjuk dan penekanannya dalam ragam puisi yang luhur tetapi tetap mudah dipahami.
- source_word: ἀπὸ τοῦ νῦν
  choice: mulai sekarang
  rationale: Ungkapan ini secara alami menyampaikan titik awal pada masa kini dan keberlanjutannya ke masa mendatang.
- source_word: μακαριοῦσίν με
  choice: akan menyebut aku berbahagia
  rationale: Kata kerjanya berarti menyatakan atau mengakui seseorang sebagai orang yang berbahagia atau diberkati. Pilihan ini mempertahankan pengakuan terbuka oleh generasi-generasi berikutnya tanpa menambahkan klaim doktrinal lain.
- source_word: πᾶσαι αἱ γενεαί
  choice: semua generasi
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dan gagasan tentang generasi-generasi yang silih berganti; unsur masa depan sudah dinyatakan oleh 'mulai sekarang' dan bentuk verba mendatang.
theological_decisions:
- issue: Sebutan Maria bagi dirinya sendiri dalam kata δούλη
  choice: hamba-Nya
  alternative: budak perempuan-Nya
  rationale: '''Hamba-Nya'' alami dalam bahasa Indonesia dan tetap menyatakan ketundukan serta kepemilikan oleh Allah. Karena istilah Yunani lebih kuat daripada pelayan upahan dan secara gramatikal feminin, arti yang lebih harfiah dicantumkan dalam catatan kaki agar nuansa relasinya tidak dilunakkan atau dijadikan dasar bagi klaim teologis tambahan.'
- issue: Makna ταπείνωσις dalam nyanyian Maria
  choice: kerendahan kedudukan
  alternative: keadaan rendah; penghinaan
  rationale: Konteks menyoroti keadaan Maria yang rendah dan tidak terpandang di hadapan masyarakat, bukan semata-mata kebajikan batin berupa kerendahan hati. Terjemahan ini juga tidak menutup kemungkinan adanya nuansa direndahkan atau dihina.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang luhur namun jelas. 'Lihatlah' mempertahankan penekanan syair, sedangkan 'kerendahan kedudukan' menghindari kesan bahwa teks hanya berbicara tentang sifat rendah hati. Kapitalisasi 'Ia' dan '-Nya' digunakan sebagai bentuk penghormatan yang lazim ketika merujuk kepada Allah.
