  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: id
  text: sumpah yang telah Ia ikrarkan kepada Abraham, bapa kita,[a] untuk mengaruniakan kepada kita
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “leluhur kita.” Bahasa Yunani secara harfiah berbunyi “bapa kita,” yang mempertahankan bahasa perjanjian mengenai Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: sumpah
  rationale: Objek akusatif yang meneruskan susunan ayat sebelumnya; menunjuk pada sumpah tertentu yang sedang dibicarakan.
- source_word: ὃν ὤμοσεν
  choice: yang diucapkan-Nya
  rationale: Dalam bahasa Indonesia, ungkapan idiomatis 'mengucapkan sumpah' menyampaikan tindakan ὀμνύω secara alami tanpa pengulangan janggal seperti 'sumpah yang disumpahkan'.
- source_word: πρὸς Ἀβραὰμ
  choice: kepada Abraham
  rationale: Dengan verba bersumpah, πρός mengarahkan sumpah itu kepada orang yang dituju.
- source_word: τὸν πατέρα ἡμῶν
  choice: bapak leluhur kita
  rationale: Mempertahankan unsur πατήρ ('bapak') sekaligus menjelaskan hubungan antargenerasi dalam bahasa Indonesia modern; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: untuk mengaruniakan kepada kita
  rationale: Infinitif berartikel dapat menyatakan maksud atau hasil sumpah. 'Mengaruniakan' sesuai dengan ragam kidung yang luhur dan tetap membiarkan isi pemberian dilanjutkan pada ayat berikutnya.
theological_decisions:
- issue: Bahasa perjanjian mengenai Abraham
  choice: bapak leluhur kita
  alternative: bapak kita; leluhur kita
  rationale: Pilihan ini menjaga bahasa kekeluargaan yang menghubungkan umat dengan Abraham, tetapi tetap jelas bagi pembaca Indonesia bahwa Abraham adalah leluhur mereka; catatan kaki mempertahankan bentuk harfiah dan nuansa perjanjiannya.
- issue: Hubungan τοῦ δοῦναι dengan sumpah
  choice: untuk mengaruniakan kepada kita
  alternative: sehingga Ia mengaruniakan kepada kita
  rationale: Bentuk 'untuk' mempertahankan kemungkinan nuansa maksud tanpa menutup sepenuhnya hubungan hasil; kalimat sengaja tetap terbuka karena isinya berlanjut dalam ayat berikut.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan wajar untuk kidung Zakharia. Frasa ini sengaja tidak dijadikan kalimat lengkap karena secara sintaksis meneruskan ayat sebelumnya dan berlanjut ke ayat berikutnya.
