  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: id
  text: supaya engkau mengetahui kepastian tentang hal-hal yang telah diajarkan kepadamu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keterandalan”; nomina Yunani ini dapat berarti kepastian, keamanan, atau sifat dapat dipercaya.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah diberi pengajaran”; kata kerjanya dapat menunjuk pada pengajaran yang disampaikan secara lisan atau teratur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Memperkenalkan klausa tujuan secara alami dalam bahasa Indonesia modern dan mempertahankan daya teliknya.
- source_word: ἐπιγνῷς
  choice: engkau mengetahui
  rationale: Bentuk aoris subjungtif ἐπιγινώσκω dalam klausa tujuan; 'mengetahui' jelas dan tidak melebih-lebihkan kemungkinan nuansa pengenalan yang lebih penuh.
- source_word: περὶ ὧν ... λόγων
  choice: dari hal-hal yang
  rationale: Ungkapan ini menunjuk pada isi atau perkara yang diajarkan. 'Hal-hal' lebih alami daripada terjemahan harfiah 'perkataan-perkataan', sedangkan 'dari' menghubungkan kepastian dengan isi pengajaran secara idiomatis.
- source_word: κατηχήθης
  choice: telah diajarkan kepadamu
  rationale: Bentuk pasif κατηχέω menyatakan penerimaan pengajaran, kemungkinan secara lisan atau teratur; pilihan ini mudah dipahami tanpa memasukkan istilah gerejawi yang berkembang kemudian.
- source_word: τὴν ἀσφάλειαν
  choice: kepastian
  rationale: ἀσφάλεια dapat menyatakan kepastian, keamanan, atau keterandalan. 'Kepastian' mempertahankan cakupan antara keyakinan dan kukuhnya dasar pengajaran.
theological_decisions:
- issue: Sifat tujuan Lukas dalam menulis
  choice: Lukas menulis agar Teofilus mengetahui kepastian dari pengajaran yang telah diterimanya, tanpa membatasi kepastian itu hanya pada keyakinan batin atau hanya pada keterandalan historis objektif.
  alternative: Menerjemahkannya secara sempit sebagai 'keyakinan' subjektif atau 'keterandalan' objektif saja.
  rationale: Nomina ἀσφάλεια dapat mencakup kepastian maupun keterandalan; terjemahan utama mempertahankan keluasan epistemik dan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' sesuai dengan sapaan tunggal langsung kepada Teofilus; struktur kalimat dibuat alami sambil mempertahankan klausa tujuan dan ambiguitas ἀσφάλεια.
