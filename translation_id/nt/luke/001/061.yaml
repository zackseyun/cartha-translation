  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: id
  text: Lalu mereka berkata kepadanya, “Tidak seorang pun di antara sanak saudaramu yang bernama demikian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tidak seorang pun dalam keluargamu memakai nama ini.”
    reason: Alternatif ini mencerminkan cakupan συγγένεια sebagai keluarga atau kaum kerabat serta kemungkinan menerjemahkan ungkapan penamaan secara lebih eksplisit.
lexical_decisions:
- source_word: καὶ εἶπαν πρὸς αὐτὴν
  choice: Lalu mereka berkata kepadanya
  rationale: Dalam alur narasi, καί wajar diterjemahkan “lalu”; πρός dengan verba berbicara menandai orang yang diajak bicara, sehingga “kepadanya” alami dalam bahasa Indonesia.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: Tidak seorang pun di antara sanak saudaramu
  rationale: Ungkapan ini menyampaikan konstruksi partitif Yunani dengan jelas. “Sanak saudara” mempertahankan arti συγγένεια sebagai kaum kerabat tanpa membatasinya pada keluarga inti.
- source_word: ὃς καλεῖται τῷ ὀνόματι τούτῳ
  choice: yang bernama demikian
  rationale: Dalam konteks pemberian nama, bentuk pasif καλεῖται secara idiomatis berarti “bernama.” “Demikian” menunjuk pada nama yang baru saja disebut dan menghasilkan ungkapan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pilihan “sanak saudara” mempertahankan cakupan kekerabatan yang lebih luas daripada “keluarga,” sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
