id: LUK.1.42
reference: Luke 1:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: id
  text: Lalu ia berseru dengan suara nyaring, “Diberkatilah engkau di antara para perempuan, dan diberkatilah buah rahimmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: berseru
  rationale: Kata ini menyatakan bahwa Elisabet mengucapkan sesuatu dengan lantang. “Berseru” mempertahankan kekuatan ujarannya tanpa menyiratkan kesusahan.
- source_word: κραυγῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Frasa datif ini menerangkan cara berseru. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan intensitas serta keterdengarannya.
- source_word: Εὐλογημένη
  choice: Diberkatilah engkau
  rationale: Partisipel perfek pasif ini berfungsi predikatif dalam formula berkat. Bentuk ini mempertahankan nada seruan dan tidak menggeser maknanya ke medan leksikal “dikaruniai” atau “disukai”.
- source_word: ἐν γυναιξίν
  choice: di antara para perempuan
  rationale: Terjemahan ini menyatakan kedudukan Maria dalam hubungannya dengan perempuan-perempuan lain tanpa menambahkan kata “semua,” yang tidak dinyatakan secara eksplisit.
- source_word: εὐλογημένος
  choice: diberkatilah
  rationale: Pengulangan bentuk yang sama menjaga kesejajaran formula berkat bagi Maria dan bagi anak yang dikandungnya.
- source_word: ὁ καρπὸς
  choice: buah
  rationale: “Buah” mempertahankan metafora sumber dan tetap wajar dalam ungkapan Alkitabiah “buah rahim,” tanpa menggantinya dengan penafsiran “anak” atau “keturunan.”
- source_word: τῆς κοιλίας σου
  choice: rahimmu
  rationale: Dalam konteks kehamilan, κοιλία menunjuk pada rahim. Bentuk “buah rahimmu” ringkas, tepat, dan mempertahankan gambaran maternal.
theological_decisions:
- issue: Formula berkat yang ditujukan kepada Maria
  choice: Diberkatilah engkau di antara para perempuan
  alternative: Engkau diberkati di antara para perempuan
  rationale: Pilihan ini mempertahankan formula berkat dan nada seruan dalam teks tanpa mengurangi ataupun memperluas peran Maria melampaui yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Ia” mengikuti subjek perempuan yang jelas dari konteks, sedangkan “berseru dengan suara nyaring” menyampaikan gabungan ἀνεφώνησεν dan κραυγῇ μεγάλῃ secara alami. Tidak diperlukan catatan kaki karena alternatif “dengan seruan nyaring” tidak menambahkan ambiguitas penting dalam bahasa Indonesia.
