  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: id
  text: Sebab ia akan menjadi besar di hadapan Tuhan. Ia sama sekali tidak akan minum anggur ataupun minuman keras,[a] dan ia akan dipenuhi dengan Roh Kudus bahkan sejak ia masih dalam kandungan ibunya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Minuman keras” di sini berarti minuman memabukkan selain anggur. Negasi dalam bahasa Yunani sangat tegas; dapat juga dipahami sebagai, “ia tidak boleh minum anggur ataupun minuman keras sama sekali.”
    reason: Catatan budaya dan alternatif gramatikal yang mempertahankan ketegangan antara nubuat tegas dan kewajiban dalam panggilan khususnya.
  - marker: b
    text: Atau “bahkan dari kandungan ibunya” atau “bahkan ketika ia masih dalam kandungan ibunya.”
    reason: Alternatif leksikal untuk ungkapan waktu yang dapat menekankan titik awal atau keadaan ketika masih dalam kandungan.
lexical_decisions:
- source_word: μέγας
  choice: besar
  rationale: Padanan langsung dan wajar yang mempertahankan makna kebesaran atau kedudukan penting tanpa menjelaskan sifat kebesaran itu secara berlebihan.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: di hadapan Tuhan
  rationale: Ungkapan baku dalam bahasa Indonesia yang mempertahankan gagasan bahwa kebesarannya berlaku dalam pandangan dan penilaian Tuhan.
- source_word: οἶνον καὶ σίκερα
  choice: anggur ataupun minuman keras
  rationale: Anggur menerjemahkan οἶνος secara langsung, sedangkan minuman keras menyampaikan σίκερα sebagai minuman memabukkan selain anggur tanpa mempersempit jenisnya.
- source_word: οὐ μὴ πίῃ
  choice: sama sekali tidak akan minum
  rationale: Bentuk ini mempertahankan negasi masa depan yang sangat tegas dalam bahasa Yunani tanpa mengubahnya secara diam-diam menjadi perintah.
- source_word: πνεύματος ἁγίου
  choice: Roh Kudus
  rationale: Dalam pemakaian Lukas, frasa ini menunjuk kepada Roh ilahi; bentuk Indonesia tidak memerlukan kata sandang.
- source_word: πλησθήσεται
  choice: akan dipenuhi
  rationale: Mempertahankan bentuk pasif futurum dan menyiratkan tindakan Allah tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: bahkan sejak dalam kandungan ibunya
  rationale: Menyampaikan titik waktu yang luar biasa dini serta daya tekan ἔτι, sambil mempertahankan kemungkinan makna sejak atau ketika masih berada dalam kandungan.
theological_decisions:
- issue: Daya negasi emfatis οὐ μὴ πίῃ dalam pemberitahuan nubuat
  choice: 'Diterjemahkan sebagai pernyataan masa depan yang tegas: “sama sekali tidak akan minum”'
  alternative: 'Diterjemahkan sebagai kewajiban atau larangan: “tidak boleh minum sama sekali”'
  rationale: Konstruksinya secara gramatikal merupakan negasi futurum yang sangat tegas. Konteks panggilan khusus Yohanes dapat menyiratkan kewajiban, tetapi terjemahan utama tidak mengubah pernyataan nubuat menjadi larangan eksplisit.
- issue: Rujukan πνεύματος ἁγίου
  choice: 'Roh ilahi personal: “Roh Kudus”'
  alternative: roh kudus sebagai daya atau watak nonpersonal
  rationale: Pemakaian Lukas dan konteks tindakan memenuhi mendukung rujukan kepada Roh Allah, tanpa perlu menambahkan rumusan doktrinal lain ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama dipisahkan agar alurnya alami. “Sama sekali” mempertahankan penegasan Yunani; “ataupun” menyampaikan pasangan negatif secara lancar. Semua penanda catatan kaki muncul dalam teks utama.
