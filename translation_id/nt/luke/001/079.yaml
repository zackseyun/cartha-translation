  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: id
  text: untuk menyinari mereka yang duduk dalam kegelapan dan dalam bayang-bayang maut[a], serta menuntun kaki kita ke jalan damai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayangan maut”; sebagian orang memahami ungkapan ini secara lebih luas sebagai “kegelapan yang pekat”, tetapi teks Yunani secara eksplisit menyebut “maut”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: menyinari
  rationale: Mempertahankan gambaran cahaya yang mendatangi orang dalam kegelapan dan secara alami menyatakan tujuan dalam konteks kalimat.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: mereka yang duduk dalam kegelapan
  rationale: Mempertahankan arti konkret partisipel καθημένοις dan gema puitisnya, tanpa mengabstraksikannya menjadi 'hidup' atau 'tinggal'.
- source_word: σκότει
  choice: kegelapan
  rationale: Padanan baku yang tetap dapat memuat daya literal dan metaforis tanpa mempersempit tafsir.
- source_word: σκιᾷ θανάτου
  choice: bayang-bayang maut
  rationale: Mempertahankan unsur bayangan dan penyebutan eksplisit tentang kematian dalam bahasa Yunani; 'maut' memberi corak puitis yang tetap lazim dan dapat dipahami.
- source_word: τοῦ κατευθῦναι
  choice: menuntun
  rationale: Menyampaikan pengarahan menuju tujuan secara alami bersama metafora 'kaki kita', tanpa mengubahnya menjadi penjelasan abstrak.
- source_word: τοὺς πόδας ἡμῶν
  choice: kaki kita
  rationale: Mempertahankan metafora tubuh dalam teks sumber, alih-alih meratakannya menjadi sekadar 'kita'.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: ke jalan damai
  rationale: Mempertahankan metafora jalan dan sifat kualitatif εἰρήνης. Bentuk ini wajar dalam bahasa Indonesia dan tidak menambahkan gagasan kausal seperti 'jalan yang menghasilkan damai'.
theological_decisions:
- issue: Apakah gambaran kegelapan, bayang-bayang maut, kaki, dan jalan perlu dijelaskan secara teologis dalam teks utama
  choice: Mempertahankan seluruh rangkaian metafora tanpa menjelaskannya sebagai kebodohan rohani, bahaya kematian, atau perilaku etis tertentu.
  alternative: Menguraikannya sebagai 'mereka yang berada dalam kegelapan rohani dan kematian' atau 'menuntun kita menjalani hidup yang membawa damai'.
  rationale: Bahasa ayat ini puitis dan alusiif; mempertahankan ketegangan metaforis menghindari penguncian makna pada satu tafsir teologis.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Bayang-bayang maut' mempertahankan corak puitis serta gema bahasa Kitab Suci, sedangkan 'menyinari' dan 'menuntun' tetap alami bagi pembaca masa kini.
