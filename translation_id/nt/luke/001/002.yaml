revisions:
- from: sebagaimana hal-hal itu telah diteruskan kepada kami oleh mereka yang sejak semula menjadi saksi mata dan kemudian menjadi pelayan firman,[a]
  to: sebagaimana yang telah diteruskan kepada kami oleh mereka yang sejak semula adalah saksi mata dan telah menjadi pelayan firman,[a]
  rationale: Revisi membatasi makna 'telah menjadi' pada peran sebagai pelayan firman, sebagaimana ditunjukkan oleh γενόμενοι, sambil mempertahankan αὐτόπται sebagai 'saksi mata' yang telah ada sejak semula. Objek yang tersirat dalam παρέδοσαν tidak dieksplisitkan, sehingga terjemahan lebih dekat dengan bentuk ayat Yunani dan tetap wajar dalam bahasa Indonesia.
