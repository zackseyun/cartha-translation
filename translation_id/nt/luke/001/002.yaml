  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: id
  text: sebagaimana yang telah diteruskan kepada kami oleh mereka yang sejak semula adalah saksi mata dan telah menjadi pelayan firman,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berita” atau “pesan.” Kata Yunani λόγος dapat berarti “firman,” “berita,” “pesan,” atau “kisah”; di sini kemungkinan besar menunjuk pada berita tentang Yesus yang diberitakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menjaga fungsi penghubung yang menyatakan kesesuaian dengan ayat sebelumnya dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: παρέδοσαν
  choice: telah diteruskan
  rationale: Mengungkapkan penyampaian tradisi atau informasi yang diterima kepada orang lain; bentuk pasif memungkinkan susunan Indonesia yang alami tanpa mengubah peran pelaku.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Menerjemahkan objek tak langsung datif secara langsung.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: mereka yang sejak semula
  rationale: Mempertahankan identitas kelompok dan keterangan waktu yang menunjukkan keterlibatan mereka sejak awal.
- source_word: αὐτόπται
  choice: saksi mata
  rationale: Istilah Indonesia yang tepat dan lazim untuk orang yang melihat sendiri peristiwa-peristiwa tersebut.
- source_word: ὑπηρέται
  choice: pelayan
  rationale: Menyatakan orang-orang yang mengabdi kepada firman tanpa memasukkan pengertian jabatan gerejawi formal.
- source_word: γενόμενοι
  choice: kemudian menjadi
  rationale: Menampilkan unsur perubahan keadaan dalam participium γενόμενοι dan membedakan pengalaman mereka sebagai saksi mata sejak semula dari peranan mereka sebagai pelayan firman.
- source_word: τοῦ λόγου
  choice: firman
  rationale: Menjaga keluasan λόγος dan ungkapan yang telah dikenal dalam bahasa Indonesia, sementara catatan kaki menjelaskan bahwa dalam konteks ini kemungkinan besar yang dimaksud ialah berita tentang Yesus.
theological_decisions:
- issue: Acuan τοῦ λόγου
  choice: firman
  alternative: berita; pesan; kisah
  rationale: Konteks kemungkinan besar menunjuk pada berita yang diberitakan tentang Yesus, bukan λόγος sebagai gelar kristologis. Terjemahan utama mempertahankan keluasan istilah sumber, sedangkan catatan memberikan alternatif kontekstual.
- issue: Hubungan γενόμενοι dengan saksi mata dan pelayan
  choice: menjadi saksi mata dan kemudian menjadi pelayan firman
  alternative: menjadi saksi mata dan pelayan firman
  rationale: 'Susunan ini mempertahankan ketegangan gramatikal sekaligus menyampaikan perkembangan yang tersirat: mereka menyaksikan peristiwa sejak awal lalu menjalankan pelayanan terhadap firman. Kata ''kemudian'' bersifat penjelas, bukan penetapan urutan waktu yang sangat rinci.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Klausa bergantung ini sengaja diawali dengan “sebagaimana” agar tetap menyatu dengan kalimat yang dimulai pada ayat 1. “Hal-hal itu” memasok objek jamak yang tersirat dari ayat sebelumnya.
