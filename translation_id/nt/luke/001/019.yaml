id: LUK.1.19
reference: Luke 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: id
  text: Malaikat itu menjawabnya, “Akulah Gabriel, yang berdiri di hadapan Allah. Aku diutus untuk berbicara kepadamu dan menyampaikan kepadamu kabar baik ini[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal ini.” Secara harfiah, bahasa Yunani berbunyi “memberitakan kepadamu hal-hal ini sebagai kabar baik”; “hal-hal ini” menunjuk pada pesan yang baru saja disampaikan Gabriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: menjawabnya
  rationale: Partisip aoris ini secara idiomatis dialihkan menjadi verba finit dalam bahasa Indonesia; akhiran -nya menyatakan orang yang dijawab.
- source_word: ἄγγελος
  choice: malaikat
  rationale: Dalam konteks ini utusan tersebut adalah makhluk surgawi yang mengidentifikasi diri sebagai Gabriel, sehingga 'malaikat' lebih tepat daripada 'utusan'.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Akulah Gabriel
  rationale: Pronomina Yunani yang eksplisit memberi penekanan; bentuk 'Akulah' mempertahankan penekanan itu secara alami.
- source_word: ὁ παρεστηκὼς
  choice: yang berdiri
  rationale: Partisip perfek menyatakan kedudukan yang berlanjut; bentuk kini 'yang berdiri' menyampaikan status Gabriel tanpa menjadi kaku.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan ini mempertahankan gagasan kehadiran langsung dan suasana istana ilahi dalam bentuk Indonesia yang wajar dan bermartabat.
- source_word: ἀπεστάλην
  choice: Aku telah diutus
  rationale: Bentuk pasif dipertahankan dan menyatakan pengutusan yang sudah terjadi dengan relevansi pada kedatangan Gabriel saat itu.
- source_word: λαλῆσαι πρὸς σὲ
  choice: untuk berbicara kepadamu
  rationale: Infinitif tujuan diterjemahkan secara langsung dan alami, tanpa mempersempit isi pembicaraan.
- source_word: εὐαγγελίσασθαί σοι
  choice: menyampaikan kabar baik ini kepadamu
  rationale: Verba ini berarti mengumumkan atau membawa kabar baik; 'menyampaikan kabar baik' alami dalam bahasa Indonesia dan tidak menjadikannya istilah teknis secara berlebihan.
- source_word: ταῦτα
  choice: ini
  rationale: Demonstrativa netral jamak secara harfiah berarti 'hal-hal ini', tetapi di sini menunjuk pada isi kabar yang diumumkan; 'kabar baik ini' secara alami mempertahankan acuannya.
theological_decisions:
- issue: Penerjemahan εὐαγγελίζω dalam konteks pemberitahuan malaikat
  choice: menyampaikan kabar baik
  alternative: memberitakan Injil; memberitakan hal-hal ini sebagai kabar baik
  rationale: '''Kabar baik'' mempertahankan makna leksikal dan gaung teologisnya tanpa memaksakan pemakaian teknis ''Injil'' yang dapat terdengar lebih kemudian dalam alur kisah ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Akulah' mempertahankan penekanan Ἐγώ, sedangkan 'di hadapan Allah' memakai ungkapan Alkitabiah yang tetap mudah dipahami. Tidak diperlukan catatan kaki karena 'kabar baik ini' menyampaikan hubungan εὐαγγελίσασθαί dan ταῦτα dengan jelas tanpa meniadakan isi rujukannya.
