  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: id
  text: Malaikat itu menjawab dan berkata kepadanya, “Roh Kudus akan datang atasmu, dan kuasa Yang Mahatinggi akan menaungimu. Karena itu juga, anak yang kudus, yang akan lahir itu, akan disebut Anak Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Malaikat itu menjawab Maria
  rationale: Ungkapan partisipial Yunani ini secara idiomatis berarti bahwa malaikat menjawab dan berkata kepadanya. Nama Maria dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: Πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Merujuk kepada Roh ilahi; bentuk ini adalah sebutan baku dan alami dalam bahasa Indonesia.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: akan turun atasmu
  rationale: Menjaga gambaran gerak dan tindakan ilahi dalam ἐπέρχομαι ἐπί, sekaligus terdengar alami dalam ragam Alkitab bahasa Indonesia.
- source_word: δύναμις Ὑψίστου
  choice: kuasa Yang Mahatinggi
  rationale: Mempertahankan konstruksi genitif dan fungsi Ὑψίστου sebagai gelar bagi Allah.
- source_word: ἐπισκιάσει σοι
  choice: akan menaungi engkau
  rationale: Mempertahankan citra bayang-bayang atau naungan yang menyatakan kehadiran dan tindakan ilahi, tanpa memberi penjelasan biologis yang tidak terdapat dalam teks.
- source_word: διὸ καὶ
  choice: Karena itu
  rationale: Menyampaikan hubungan akibat secara alami. Daya aditif καί tercermin dalam keseluruhan hubungan antarklausa, tetapi tidak perlu dipaksakan menjadi 'juga' yang kaku dalam bahasa Indonesia.
- source_word: τὸ γεννώμενον ἅγιον
  choice: dia yang akan lahir itu akan disebut kudus
  rationale: Susunan Yunani dapat dipahami sebagai menyebut yang akan lahir itu kudus. Bentuk Indonesia ini mempertahankan predikasi 'kudus' dan menghindari keharusan menjadikannya gelar substantival.
- source_word: κληθήσεται
  choice: akan disebut
  rationale: Mencakup baik pemberian sebutan maupun pengakuan identitas, sesuai jangkauan καλέω.
- source_word: υἱὸς θεοῦ
  choice: Anak Allah
  rationale: Dalam konteks ini frasa tanpa artikel berfungsi sebagai sebutan atau gelar, bukan ungkapan tak tentu. Bahasa Indonesia tidak memerlukan artikel definit.
theological_decisions:
- issue: Sifat rujukan Πνεῦμα ἅγιον
  choice: Roh Kudus
  alternative: roh kudus
  rationale: Konteks menampilkan Roh sebagai pelaku ilahi. Kapitalisasi menandai rujukan khusus tanpa menambahkan uraian tentang hakikat-Nya.
- issue: Hubungan ἅγιον dengan τὸ γεννώμενον dan κληθήσεται
  choice: dia yang akan lahir itu akan disebut kudus, Anak Allah
  alternative: yang kudus yang akan lahir itu akan disebut Anak Allah
  rationale: Tata bahasa Yunani memungkinkan ἅγιον dipahami bersama hal-hal yang akan disebut tentang anak itu. Terjemahan utama menjaga kemungkinan predikatif tersebut dan tidak diam-diam mengubahnya menjadi gelar 'Yang Kudus'.
- issue: Daya definit υἱὸς θεοῦ
  choice: Anak Allah
  alternative: seorang anak Allah
  rationale: Ketiadaan artikel Yunani tidak menuntut makna tak tentu. Dalam konteks pewartaan ini ungkapan tersebut berfungsi sebagai identitas atau gelar.
- issue: Gambaran tindakan ilahi dalam ἐπισκιάσει
  choice: akan menaungi engkau
  alternative: akan meliputi engkau
  rationale: Pilihan ini mempertahankan metafora teks dan tidak memasukkan mekanisme biologis atau bahasa seksual yang tidak dinyatakan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina terikat “-mu” dipakai secara alami sesudah preposisi, sedangkan “engkau” dipertahankan pada klausa berikutnya agar ritmenya jelas. Tidak ada catatan kaki karena alternatif penting dapat dijelaskan dalam dokumentasi keputusan tanpa membebani ayat.
