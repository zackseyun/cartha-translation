revisions:
- from: Malaikat itu menjawab Maria, “Roh Kudus akan turun atasmu, dan kuasa Yang Mahatinggi akan menaungi engkau. Karena itu, dia yang akan lahir itu akan disebut kudus, Anak Allah.”
  to: Malaikat itu menjawab dan berkata kepadanya, “Roh Kudus akan datang atasmu, dan kuasa Yang Mahatinggi akan menaungimu. Karena itu juga, anak yang kudus, yang akan lahir itu, akan disebut Anak Allah.”
  rationale: Revisi mengembalikan pronomina sumber 'kepadanya', mempertahankan urutan dua tindakan ilahi, dan menerjemahkan τὸ γεννώμενον ἅγιον secara alami sebagai 'anak yang kudus, yang akan lahir itu'. Kata 'juga' mencerminkan καί dalam διὸ καί tanpa membuat kalimat kaku. Tidak diperlukan catatan kaki, karena terjemahan ini tidak memutuskan secara berlebihan persoalan apakah ἅγιον terutama bersifat atributif atau turut bergaung sebagai sebutan.
