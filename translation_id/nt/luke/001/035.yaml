  - severity: medium
    issue: Frasa 'dia yang akan lahir itu akan disebut kudus, Anak Allah' kurang jelas mengenai hubungan ἅγιον dengan τὸ γεννώμενον.
    rationale: ἅγιον dapat dipahami sebagai kualifikasi bagi yang akan lahir, bukan semata-mata nama atau predikat yang kelak disematkan. Revisi menempatkan 'kudus' bersama 'anak yang akan lahir' dan mempertahankan sebutan 'Anak Allah'.
