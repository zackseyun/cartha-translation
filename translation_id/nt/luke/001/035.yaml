  verdict: revise
  source_fidelity: Revisi diperlukan. Draf menggeser ἅγιον sehingga hanya tampak sebagai sebutan yang diberikan sesudah kelahiran; dalam susunan Yunani, ἅγιον dapat pula menerangkan yang sedang/akan lahir. Terjemahan revisi mempertahankan kemungkinan bahwa kekudusan itu melekat pada anak yang akan lahir, sambil tetap memungkinkan 'disebut kudus' sebagai bagian dari sebutan. Penambahan nama 'Maria' menggantikan αὐτῇ ('kepadanya') dengan informasi konteks yang tidak dinyatakan dalam ayat ini.
  naturalness: Bahasa revisi memakai ragam Indonesia baku dan khidmat. 'Datang atasmu' menangkap ἐπελεύσεται ἐπί secara alami tanpa menyempitkannya menjadi gerak turun secara harfiah. 'Menaungimu' mempertahankan metafora ἐπισκιάσει dan lebih padu daripada peralihan '-mu' dan 'engkau' dalam satu rangkaian.
  terminology: '''Roh Kudus,'' ''Yang Mahatinggi,'' dan ''Anak Allah'' adalah padanan baku yang tepat. ''Anak yang akan lahir itu'' secara idiomatis menyatakan τὸ γεννώμενον tanpa memaksakan nuansa biologis di luar teks.'
