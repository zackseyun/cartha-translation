  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Yunani dengan setia: σωτηρίαν sebagai “keselamatan,” ἐξ ἐχθρῶν ἡμῶν sebagai “dari musuh-musuh kita,” serta ἐκ χειρὸς sebagai “dari tangan,” yang mempertahankan idiom sumber tanpa meniadakan makna kuasa/kendali. “Semua orang yang membenci kita” dengan tepat menyampaikan πάντων τῶν μισούντων ἡμᾶς.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada khidmat. Pengulangan “dari” membuat koordinasi kedua frasa mudah diikuti. Bentuk “musuh-musuh” dapat diterima untuk menyatakan bentuk jamak sumber, dan “dari tangan” tetap wajar dalam register alkitabiah.
  terminology: “Keselamatan” mempertahankan cakupan teologis σωτηρία tanpa membatasi maknanya menjadi pembebasan politik atau keselamatan rohani saja. Catatan kaki menyediakan “pembebasan” dan menjelaskan padanan semantis “kuasa” untuk idiom “tangan” tanpa memaksakannya ke teks utama.
