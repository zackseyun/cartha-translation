id: LUK.1.71
reference: Luke 1:71
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: id
  text: keselamatan dari musuh-musuh kita dan dari tangan semua orang yang membenci kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pembebasan dari musuh-musuh kita dan dari kuasa semua orang yang membenci kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρίαν
  choice: keselamatan
  rationale: Mempertahankan bobot teologis istilah tersebut dalam Injil Lukas sekaligus tetap memungkinkan makna konkret berupa pembebasan dari kuasa yang memusuhi.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: dari musuh-musuh kita
  rationale: Kata depan ἐξ menyatakan pemisahan atau pembebasan dari; terjemahan ini alami dan tidak menambahkan gagasan 'kuasa' yang tidak dinyatakan secara eksplisit pada frasa ini.
- source_word: ἐκ χειρὸς
  choice: dari tangan
  rationale: Ungkapan ini secara idiomatis dapat berarti 'dari kuasa', tetapi bentuk harfiah 'dari tangan' tetap dapat dipahami dalam bahasa Indonesia serta mempertahankan citra dan gema bahasa keselamatan dalam Kitab Suci.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: semua orang yang membenci kita
  rationale: Partisipel dengan artikel berfungsi sebagai nomina; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arti tindakan atau sikap yang menjadi ciri mereka.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini menghubungkan kedua frasa secara langsung tanpa perlu penafsiran tambahan.
theological_decisions:
- issue: Sifat keselamatan yang dijanjikan dalam nubuat Zakharia
  choice: Menggunakan 'keselamatan' sambil mempertahankan rujukan konkret kepada musuh dan orang-orang yang membenci umat.
  alternative: Menerjemahkannya semata-mata sebagai pembebasan politis atau semata-mata sebagai keselamatan rohani dari dosa.
  rationale: Ayat ini berbicara langsung tentang pembebasan dari musuh, sedangkan konteks Lukas memberi istilah σωτηρία bobot penebusan yang lebih luas. Terjemahan tidak mempersempit ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Bentuk 'musuh-musuh' dipakai untuk menyatakan jamak secara eksplisit, sedangkan idiom 'dari tangan' dipertahankan dalam teks utama dan dijelaskan secara semantis dalam catatan kaki.
