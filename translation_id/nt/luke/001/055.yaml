id: LUK.1.55
reference: Luke 1:55
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: id
  text: sebagaimana telah Ia firmankan kepada nenek moyang kita[a], kepada Abraham dan keturunannya[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada bapa-bapa kita.” Secara harfiah, bahasa Yunani berbunyi “kepada bapa-bapa kita.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “benihnya.” Kata Yunani yang dipakai berbentuk tunggal kolektif dan dapat berarti “benih”, “keturunan”, atau “para keturunannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: sebagaimana
  rationale: Menandai kesesuaian dengan tindakan Allah yang disebut sebelumnya dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: ἐλάλησεν
  choice: telah Ia firmankan
  rationale: Konteksnya menunjuk kepada perkataan Allah; 'firmankan' mempertahankan tindakan berbicara tanpa mengubahnya secara eksplisit menjadi 'menjanjikan'.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: kepada bapa-bapa leluhur kita
  rationale: Mempertahankan bentuk maskulin πατέρες dan nuansa para leluhur dalam sejarah perjanjian, sekaligus memperjelas bahwa yang dimaksud bukan ayah kandung langsung.
- source_word: τῷ Ἀβραὰμ
  choice: kepada Abraham
  rationale: Datif dipahami sebagai kelanjutan dari sasaran firman; nama pribadi mengikuti bentuk Indonesia yang lazim.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: dan keturunannya
  rationale: '''Keturunan'' merupakan nomina kolektif alami dalam bahasa Indonesia dan dapat mewakili bentuk tunggal kolektif σπέρμα tanpa memaksakan apakah yang dimaksud satu orang atau banyak keturunan.'
- source_word: εἰς τὸν αἰῶνα
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang alami untuk keberlangsungan tanpa akhir dalam konteks ini.
theological_decisions:
- issue: Bahasa maskulin dalam πρὸς τοὺς πατέρας ἡμῶν
  choice: bapa-bapa leluhur kita
  alternative: nenek moyang kita
  rationale: Pilihan utama mempertahankan bentuk maskulin sumber dan gema para bapa leluhur Israel; alternatifnya lebih idiomatis tetapi menetralkan bentuk tersebut.
- issue: Makna kolektif tunggal σπέρματι αὐτοῦ
  choice: keturunannya
  alternative: benihnya
  rationale: '''Keturunannya'' alami dan tetap bersifat kolektif, sehingga tidak membatasi rujukannya hanya kepada satu pribadi atau secara eksplisit menjadikannya jamak. Arti harfiah ''benihnya'' dicatat agar gema perjanjian dan ambiguitas leksikal tetap terlihat.'
- issue: Hubungan εἰς τὸν αἰῶνα dengan frasa sebelumnya
  choice: dibiarkan mengikuti 'Abraham dan keturunannya' tanpa penjelasan tambahan
  alternative: menambahkan kata yang secara eksplisit mengaitkannya dengan belas kasihan atau janji
  rationale: Teks Yunani berbentuk lanjutan sintaksis dari ayat sebelumnya. Tidak ditambahkan unsur penafsir seperti 'janji' atau 'belas kasihan-Nya', sehingga pembaca tetap dapat mengikuti hubungan konteks aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. 'Bapa-bapa leluhur' dipilih untuk menggabungkan ketepatan gender sumber dengan kejelasan bagi pembaca masa kini. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
