  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: id
  text: Ia telah menolong Israel, hamba-Nya[a], dengan mengingat belas kasihan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Israel, anak-Nya.” Kata Yunani yang dipakai dapat berarti “hamba” atau “anak”; “hamba” dipilih di sini karena selaras dengan pola Perjanjian Lama yang menyebut Israel sebagai hamba Allah.
    reason: lexical_alternative
  - marker: b
    text: “Belas kasihan” di sini juga dapat mengandung pengertian belas kasihan dalam hubungan perjanjian atau kesetiaan yang penuh kasih.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: telah menolong
  rationale: Kata kerja ini menggambarkan tindakan memegang atau menopang seseorang untuk menolongnya. Dalam bahasa Indonesia, "telah menolong" menyampaikan tindakan pertolongan Allah secara alami dan ringkas.
- source_word: Ἰσραὴλ
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk baku; dalam konteks ini Israel dipahami secara kolektif sebagai umat Allah.
- source_word: παιδὸς
  choice: hamba
  rationale: παῖς dapat berarti "hamba" atau "anak". Sebutan "hamba" dipilih karena selaras dengan pola Perjanjian Lama yang menyebut Israel sebagai hamba Allah, sementara kemungkinan arti "anak" dicatat dalam catatan kaki.
- source_word: αὐτοῦ
  choice: -Nya
  rationale: Kata ganti posesif ini merujuk kepada Allah dan dilekatkan pada "hamba" sesuai tata bahasa Indonesia.
- source_word: μνησθῆναι
  choice: dengan mengingat
  rationale: Infinitif aoris ini menerangkan tindakan menolong, baik sebagai cara, keadaan yang menyertai, maupun tujuan. "Dengan mengingat" tetap dekat dengan bentuk Yunani tanpa menetapkan hubungan logisnya secara terlalu sempit.
- source_word: ἐλέους
  choice: belas kasihan
  rationale: ἔλεος menunjuk pada belas kasihan atau kemurahan, dengan kemungkinan nuansa kesetiaan dalam hubungan perjanjian. "Belas kasihan" merupakan padanan Indonesia yang langsung dan wajar.
theological_decisions:
- issue: Makna παῖς ketika mengacu kepada Israel
  choice: Israel, hamba-Nya
  alternative: Israel, anak-Nya
  rationale: Sebutan "hamba" mempertahankan gema bahasa Kitab Suci Yunani tentang Israel sebagai hamba Allah. Namun, karena παῖς juga sungguh dapat berarti "anak", alternatif itu tidak disingkirkan dan dicantumkan dalam catatan kaki.
- issue: Hubungan μνησθῆναι ἐλέους dengan tindakan menolong
  choice: dengan mengingat belas kasihan
  alternative: untuk mengingat belas kasihan; karena mengingat belas kasihan
  rationale: Ungkapan ini mempertahankan hubungan erat antara pertolongan Allah dan tindakan mengingat tanpa memaksakan apakah infinitif tersebut terutama menyatakan cara, tujuan, atau hasil.
- issue: Nuansa ἐλέους
  choice: belas kasihan
  alternative: kasih setia dalam perjanjian; kemurahan
  rationale: Teks menyatakan belas kasihan dan konteksnya dapat memberi nuansa kesetiaan perjanjian. Nuansa itu dijelaskan dalam catatan kaki, bukan dimasukkan secara eksplisit ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Kapitalisasi “Ia” dan akhiran “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah. Susunan kalimat dibuat ringkas agar tetap sesuai dengan bentuk syair pujian Maria dan berlanjut ke ayat berikutnya.
