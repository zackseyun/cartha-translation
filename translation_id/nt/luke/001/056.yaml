  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: id
  text: Maria tinggal bersama Elisabet kira-kira tiga bulan[a], kemudian pulang ke rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sekitar tiga bulan.” Kata Yunani ὡς dalam ungkapan waktu dapat menyatakan perkiraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: tinggal
  rationale: Dalam konteks menetap di suatu tempat selama jangka waktu tertentu, bentuk aoris dari μένω paling wajar diterjemahkan “tinggal” dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: lalu
  rationale: δέ merupakan penghubung ringan. “Lalu” menjaga kesinambungan narasi tanpa menyiratkan pertentangan yang kuat.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Mengikuti bentuk nama yang lazim dan mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: σὺν αὐτῇ
  choice: bersama Elisabet
  rationale: Secara harfiah berarti “bersama dia.” Nama Elisabet dipakai untuk memperjelas rujukan pronomina berdasarkan konteks dekat, tanpa mengubah makna.
- source_word: ὡς μῆνας τρεῖς
  choice: kira-kira tiga bulan
  rationale: ὡς di depan ungkapan waktu menunjukkan perkiraan; “kira-kira tiga bulan” menyampaikan nuansa itu secara alami.
- source_word: ὑπέστρεψεν
  choice: pulang
  rationale: Karena tujuannya adalah rumah Maria sendiri, “pulang” lebih alami daripada “kembali” dan tetap menyatakan gerak kembali ke tempat asal.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: ke rumahnya sendiri
  rationale: οἶκος di sini menunjuk tempat tinggal. “Rumahnya sendiri” memperjelas bahwa Maria kembali ke rumah miliknya, bukan rumah Elisabet.
