  terminology: '"Allah" tepat untuk θεόν. "Sambil memuji Allah" adalah padanan idiomatis yang baik untuk εὐλογῶν τὸν θεόν. Catatan kaki harus dipindahkan: catatan tentang lidah melekat pada kata "lidahnya", sedangkan catatan tentang ἐλάλει melekat pada "berbicara".'
