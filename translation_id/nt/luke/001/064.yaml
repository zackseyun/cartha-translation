base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: id
  text: Seketika itu juga mulutnya terbuka dan lidahnya[a], lalu ia berbicara[b] sambil memuji Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan lidahnya juga.” Sebagian terjemahan menerjemahkan “lidahnya terlepas,” tetapi kata “terlepas” tidak terdapat dalam teks Yunani.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia mulai berbicara” atau “ia terus berbicara.” Bentuk imperfek kata kerja Yunani dapat menekankan awal atau berlangsungnya tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: terbuka
  rationale: Bentuk pasif aoris ἀνοίγω menyatakan pemulihan yang terjadi seketika. “Terbuka” alami dalam bahasa Indonesia dan tidak menentukan pelaku secara eksplisit.
- source_word: δὲ
  choice: lalu
  rationale: δέ merupakan penghubung ringan yang melanjutkan alur cerita, bukan pertentangan yang kuat.
- source_word: στόμα
  choice: mulutnya
  rationale: Padanan anatomis langsung yang sesuai dengan konteks pulihnya kemampuan berbicara.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Mengungkapkan kejadian yang langsung dan mendadak dalam bahasa Indonesia yang wajar.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: demikian pula lidahnya
  rationale: Teks Yunani menyebut lidah secara eliptis tanpa kata kerja kedua. Rumusan ini mempertahankan elipsis tersebut tanpa menambahkan gagasan “terlepas” yang tidak dinyatakan.
- source_word: ἐλάλει
  choice: ia mulai berbicara
  rationale: Bentuk imperfek dapat menggambarkan dimulainya atau berlangsungnya tindakan. Setelah masa kebisuan, “mulai berbicara” paling jelas menyampaikan dorongan naratif konteks.
- source_word: εὐλογῶν
  choice: sambil memuji
  rationale: Ketika Allah menjadi objek, εὐλογέω secara idiomatis berarti mengucapkan pujian atau berkat kepada-Nya. “Memuji” lebih alami daripada “memberkati Allah” dalam bahasa Indonesia modern.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku bagi θεός dalam konteks Perjanjian Baru dan merupakan objek dari εὐλογῶν.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Elipsis Yunani pada penyebutan lidah dipertahankan sejauh mungkin tanpa menghasilkan ungkapan “lidah terbuka” yang janggal. Tanda baca membagi pemulihan kemampuan berbicara dari tindakan memuji Allah.
