  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: id
  text: dan rohku bersukacita dalam Allah, Juru Selamatku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sangat bergembira dalam Allah, Juru Selamatku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Konjungsi sederhana ini menghubungkan baris tersebut dengan ayat sebelumnya dan mempertahankan kesejajaran puitis Kidung Maria.
- source_word: ἠγαλλίασεν
  choice: bersukacita
  rationale: Kata kerja aoris aktif ini menyatakan sukacita yang meluap. 'Bersukacita' alami, bermartabat, dan tidak menambahkan penafsiran yang melampaui bahasa Yunani.
- source_word: τὸ πνεῦμά μου
  choice: rohku
  rationale: Pilihan ini mempertahankan istilah 'roh' dan kesejajaran puitisnya dengan 'jiwaku' pada ayat sebelumnya, tanpa menetapkan suatu pembedaan antropologis teknis.
- source_word: ἐπὶ τῷ θεῷ
  choice: dalam Allah
  rationale: Bersama ἀγαλλιάω, ἐπί dengan datif dapat menunjuk dasar atau sasaran sukacita. Ungkapan 'bersukacita dalam Allah' mempertahankan fokus relasional dan lazim dalam ragam bahasa Alkitab Indonesia.
- source_word: τῷ σωτῆρί μου
  choice: Juru Selamatku
  rationale: σωτήρ berarti penyelamat atau pembebas. 'Juru Selamatku' merupakan padanan langsung yang jelas serta mempertahankan bobot pernyataan bahwa Allah adalah penyelamat Maria.
theological_decisions:
- issue: Penyebutan Allah sebagai σωτήρ Maria
  choice: Allah, Juru Selamatku
  alternative: Allah, Pembebasku
  rationale: Bahasa Yunani secara langsung menyebut Allah sebagai σωτήρ Maria. Terjemahan mempertahankan klaim itu tanpa melunakkannya ataupun menarik kesimpulan doktrinal tambahan.
- issue: Hubungan 'rohku' dengan 'jiwaku' dalam kesejajaran ayat 46–47
  choice: Mempertahankan istilah yang berbeda
  alternative: Menyamakan keduanya dalam terjemahan sebagai satu istilah
  rationale: Kesejajaran puitis menunjukkan adanya tumpang tindih makna, tetapi teks Yunani memakai ψυχή dan πνεῦμα. Mempertahankan 'jiwa' dan 'roh' menjaga bentuk sastra serta tidak menyelesaikan ketegangan antropologis secara sepihak.
- issue: Nilai aspek aoris ἠγαλλίασεν
  choice: bersukacita
  alternative: telah bersukacita
  rationale: Aoris Yunani tidak dengan sendirinya menuntut penandaan waktu sempurna dengan 'telah'. Dalam puisi ini, bentuk Indonesia tanpa penanda aspek lebih alami dan tetap dapat menggambarkan sukacita yang dinyatakan sebagai suatu keseluruhan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang alami dan bermartabat. Bentuk 'rohku' dan 'Juru Selamatku' menjaga kepadatan serta irama puitis. Tanda koma sesudah 'Allah' menampilkan 'Juru Selamatku' sebagai aposisi tanpa mengubah hubungan sintaksis Yunani.
