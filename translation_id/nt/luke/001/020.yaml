  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: id
  text: Lihatlah, engkau akan diam[a] dan tidak dapat berbicara sampai hari ketika hal-hal ini terjadi, karena engkau tidak memercayai kata-kataku, yang akan digenapi pada waktu yang telah ditentukan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menjadi bisu.” Teks Yunani menggabungkan keadaan diam dengan ketidakmampuan berbicara.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada waktunya yang tepat.” Ungkapan Yunani menunjuk pada waktu yang sesuai atau telah ditetapkan bagi penggenapan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ketahuilah
  rationale: Mempertahankan fungsi penarik perhatian dan nada khidmat dari seruan malaikat, tetapi terdengar lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “lihatlah” dalam konteks ini.
- source_word: ἔσῃ σιωπῶν
  choice: engkau akan diam
  rationale: Menyatakan keadaan yang akan dialami Zakharia. Klausa berikutnya, “tidak dapat berbicara,” memperjelas bahwa diamnya bukan tindakan sukarela.
- source_word: μὴ δυνάμενος λαλῆσαι
  choice: tidak dapat berbicara
  rationale: Menerjemahkan ketidakmampuan secara langsung dan alami serta menegaskan bahwa kebisuan itu dipaksakan.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: sampai pada hari ketika semua ini terjadi
  rationale: Mempertahankan batas waktu dan hubungan temporal dalam teks Yunani tanpa ungkapan yang arkais.
- source_word: ἀνθ’ ὧν
  choice: karena
  rationale: Dalam konteks ini frasa tersebut menyatakan alasan bagi hukuman yang dijatuhkan kepada Zakharia.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: engkau tidak memercayai kata-kataku
  rationale: Mempertahankan objek berupa perkataan malaikat dan menyampaikan bahwa Zakharia tidak menerima perkataan itu sebagai benar.
- source_word: πληρωθήσονται
  choice: akan digenapi
  rationale: Mempertahankan bentuk pasif dan nuansa bahwa perkataan yang dijanjikan akan diwujudkan, tanpa menyebut pelaku secara eksplisit.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: pada waktu yang telah ditentukan
  rationale: καιρός menunjuk pada waktu yang tepat atau ditetapkan, bukan sekadar waktu kronologis.
theological_decisions:
- issue: Sifat kebisuan Zakharia
  choice: Keadaan diam yang disertai ketidakmampuan berbicara
  alternative: Perintah untuk diam secara sukarela
  rationale: Gabungan ἔσῃ σιωπῶν dan μὴ δυνάμενος λαλῆσαι menunjukkan keadaan yang dikenakan kepadanya, bukan sekadar perintah agar tidak berbicara.
- issue: Pelaku penggenapan perkataan
  choice: Bentuk pasif dipertahankan tanpa menyebut pelaku
  alternative: Menambahkan bahwa Allah akan menggenapinya
  rationale: Konteks dapat menyiratkan tindakan Allah, tetapi teks Yunani tidak menyebut pelaku secara eksplisit; terjemahan tidak menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” sesuai dengan tuturan langsung malaikat kepada satu orang. Struktur kalimat mempertahankan hubungan antara ketidakpercayaan Zakharia, kebisuannya, dan kepastian bahwa perkataan itu akan digenapi.
