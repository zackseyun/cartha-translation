  yaml_path: translation/nt/luke/001/062.yaml
  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: id
  text: Lalu mereka memberi isyarat kepada ayahnya, menanyakan nama apa yang ia kehendaki agar anak itu dinamai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka memberi isyarat kepada ayahnya tentang apa yang mungkin ia kehendaki agar anak itu disebut.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνένευον
  choice: memberi isyarat
  rationale: Kata kerja ini menunjuk pada komunikasi dengan tanda atau gerak tubuh; frasa ini alami dan jelas dalam bahasa Indonesia.
- source_word: δὲ
  choice: Lalu
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan alur cerita; “Lalu” sesuai dengan urutan naratif.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: kepada ayahnya
  rationale: Bentuk datif menunjukkan orang yang menjadi tujuan isyarat tersebut.
- source_word: τὸ τί ἂν θέλοι
  choice: untuk mengetahui nama apa yang hendak diberikannya
  rationale: Ungkapan ini menyampaikan isi pertanyaan tak langsung serta nuansa kehendak atau pilihan pada optatif dengan ἄν. “Untuk mengetahui” membuat hubungan maksud isyarat menjadi alami dalam bahasa Indonesia, meski tidak dinyatakan secara tersendiri dalam bahasa Yunani.
- source_word: καλεῖσθαι αὐτό
  choice: diberikannya kepada anak itu
  rationale: Dalam konteks penamaan, ungkapan Indonesia “nama ... yang hendak diberikannya kepada anak itu” mengungkapkan infinitif pasif ‘disebut/dinamai’ secara wajar dan mempertahankan rujukan αὐτό kepada sang anak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Memberi isyarat” mempertahankan komunikasi nonverbal, sedangkan konstruksi penamaan dibuat idiomatis tanpa mengubah pelaku kehendak, yaitu ayah anak itu.
