translation:
  language: id
  text: sesuai dengan kebiasaan pelayanan imam, ia mendapat giliran melalui undian untuk membakar dupa ketika ia masuk ke dalam Bait Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat kudus Tuhan.” Kata Yunani ναός sering menunjuk bangunan Bait itu sendiri, khususnya ruang sucinya, bukan seluruh kompleks dan pelataran Bait.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: sesuai dengan kebiasaan pelayanan imam
  rationale: Frasa ini menyatakan kesesuaian dengan tata kebiasaan yang berlaku dalam tugas atau jabatan keimaman. “Pelayanan imam” mempertahankan unsur kelembagaan ἱερατεία sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἔλαχε
  choice: ia terpilih melalui undian
  rationale: Bentuk λαγχάνω menunjukkan bahwa tugas itu diperoleh melalui pengundian. Terjemahan ini menyatakan sarana pemilihannya secara jelas dan wajar.
- source_word: τοῦ θυμιᾶσαι
  choice: untuk membakar dupa
  rationale: Infinitif ini menyatakan tugas yang diperoleh melalui undian. θυμιάω secara khusus merujuk pada pembakaran atau persembahan dupa.
- source_word: εἰσελθὼν
  choice: setelah masuk
  rationale: Partisip aoris ini menyatakan tindakan masuk yang berkaitan secara temporal dengan pembakaran dupa. “Setelah masuk” memberikan urutan kontekstual yang alami tanpa menambahkan rincian tempat yang tidak ada dalam bentuk katanya sendiri.
- source_word: εἰς τὸν ναὸν τοῦ κυρίου
  choice: ke dalam Bait Tuhan
  rationale: ναός menunjuk bangunan Bait, dan dalam konteks ini kemungkinan lebih khusus menunjuk ruang kudus tempat dupa dibakar. “Bait Tuhan” mudah dipahami, sedangkan makna yang lebih sempit dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna ναός dalam konteks ibadah di Bait Allah
  choice: Bait Tuhan
  alternative: tempat kudus Tuhan
  rationale: Dalam pemakaian Yunani, ναός sering menunjuk bangunan atau ruang suci Bait, berbeda dari seluruh kompleks pelatarannya. Konteks pembakaran dupa mendukung arti yang lebih khusus, tetapi teks utama memakai “Bait Tuhan” demi keterbacaan dan catatan kaki mempertahankan ketepatan alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Dupa” dipilih sebagai istilah umum yang jelas; “melalui undian” mempertahankan cara penetapan tugas secara eksplisit.
