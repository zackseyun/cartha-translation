  source_fidelity: 'Teks Indonesia menyampaikan unsur pokok Yunani dengan setia: waktu pada hari kedelapan, subjek jamak yang tidak diperinci, tujuan untuk menyunat anak itu, serta usaha/niat untuk memberikan nama Zakharia menurut nama ayahnya. Pembuka temporal Indonesia secara wajar merangkum formula naratif Καὶ ἐγένετο tanpa ungkapan harfiah yang kaku. “Hendak menamainya” merupakan cara yang dapat dipertanggungjawabkan untuk menyatakan imperfek ἐκάλουν dalam konteks koreksi pada ayat berikutnya, tanpa menyatakan bahwa penamaan itu telah final.'
