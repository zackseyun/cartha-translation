id: LUK.1.59
reference: Luke 1:59
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: id
  text: Pada hari kedelapan, mereka datang untuk menyunat anak itu. Mereka hendak menamainya Zakharia[a], menurut nama ayahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka menamainya Zakharia.” Bentuk imperfek Yunani dapat menggambarkan tindakan penamaan yang sedang berlangsung atau sedang diusahakan; hal ini sesuai dengan sanggahan pada ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka menamainya menurut nama ayahnya, Zakharia.” Ini merujuk pada kebiasaan memberi anak nama yang terdapat dalam keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Pada
  rationale: Formula naratif Semitis-Lukas ini mengantar keadaan waktu. Dalam bahasa Indonesia modern, maknanya tersampaikan secara alami melalui pembuka temporal tanpa ungkapan kaku seperti 'dan terjadilah'.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: hari kedelapan
  rationale: Ungkapan waktu ini secara idiomatis berarti 'pada hari kedelapan'.
- source_word: ἦλθον
  choice: mereka datang
  rationale: Subjek jamak tetap dibiarkan tidak disebutkan identitasnya, sesuai teks Yunani.
- source_word: περιτεμεῖν
  choice: untuk menyunat
  rationale: Infinitif menyatakan tujuan kedatangan mereka dan diterjemahkan secara langsung.
- source_word: τὸ παιδίον
  choice: anak itu
  rationale: Padanan alami bagi παιδίον dalam konteks ini; 'bayi itu' juga mungkin, tetapi lebih kontekstual daripada leksikal.
- source_word: ἐκάλουν
  choice: mereka hendak menamainya
  rationale: Imperfek dalam konteks pertentangan pada ayat berikutnya dapat menggambarkan tindakan penamaan yang sedang diusahakan atau diniatkan, bukan nama yang akhirnya ditetapkan. Pilihan ini lebih alami daripada 'mereka sedang memanggilnya' dalam bahasa Indonesia.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: menurut nama ayahnya
  rationale: Ungkapan ini menunjukkan bahwa nama sang ayah dijadikan dasar bagi nama anak; catatan kaki menjelaskan adat penamaan tersebut tanpa membebani teks utama.
- source_word: Ζαχαρίαν
  choice: Zakharia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan mencerminkan nama yang berasal dari bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur kalimat dibagi dua agar mudah dipahami. 'Hendak menamainya' mempertahankan ketegangan naratif dari bentuk imperfek tanpa menyatakan bahwa penamaan itu telah selesai.
