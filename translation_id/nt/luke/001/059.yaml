  terminology: “Menyunat,” “anak itu,” dan “Zakharia” sesuai pemakaian Alkitab bahasa Indonesia yang lazim. Tidak ada istilah teologis yang memerlukan penyesuaian. Penanda catatan kaki ditempatkan pada unsur yang relevan dan kedua catatan kaki mendukung, bukan mengubah, teks utama.
