id: LUK.1.17
reference: Luke 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: id
  text: Ia akan mendahului dia dengan roh dan kuasa Elia[a], untuk membuat hati para ayah berbalik kepada anak-anak[b] dan orang-orang yang tidak taat berbalik kepada pengertian orang-orang benar[c], serta untuk menyiapkan bagi Tuhan suatu umat yang siap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dengan roh dan kuasa Elia” menunjuk pada pelayanan dan pemberdayaan kenabian yang serupa dengan Elia, bukan dengan sendirinya menyatakan bahwa Elia kembali sebagai pribadi yang sama.
    reason: cross_reference
  - marker: b
    text: Atau “terhadap anak-anak.” Ungkapan ini menggemakan Maleakhi 4:6 dan dapat mengandung makna dipulihkannya hubungan dalam keluarga.
    reason: lexical_alternative
  - marker: c
    text: Atau “kepada cara berpikir orang-orang benar”; secara lebih harfiah, “dalam pengertian orang-orang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: akan berjalan mendahului dia
  rationale: Ungkapan ini menyatakan bahwa ia maju lebih dahulu dalam tugas pelayanannya. Kata ganti “dia” dipertahankan tanpa memperjelas rujukannya di dalam ayat.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: dengan roh dan kuasa Elia
  rationale: “Dengan” menyampaikan sarana atau pemberdayaan secara alami dalam bahasa Indonesia, sementara ungkapan “roh dan kuasa Elia” mempertahankan hubungan kenabian dengan Elia tanpa menyamakan pribadi keduanya.
- source_word: ἐπιστρέψαι
  choice: untuk membuat ... berbalik
  rationale: Infinitif ini menyatakan tujuan. Bentuk kausatif “membuat ... berbalik” cocok untuk kedua objek yang mengikuti dan mempertahankan gagasan perubahan arah atau sikap.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: hati para ayah berbalik kepada anak-anak
  rationale: Terjemahan ini dekat dengan susunan Yunani dan mempertahankan gema Maleakhi 4:6 serta kemungkinan makna pemulihan hubungan keluarga.
- source_word: ἀπειθεῖς
  choice: orang-orang yang tidak taat
  rationale: Pilihan ini mencakup sikap menolak untuk diyakinkan dan ketidaktaatan, tanpa mempersempitnya hanya menjadi ketidakpercayaan.
- source_word: ἐν φρονήσει δικαίων
  choice: kepada kearifan orang-orang benar
  rationale: Dalam rangkaian dengan “membuat ... berbalik,” frasa ini dipahami secara terarah. “Kearifan” menyampaikan pengertian praktis dan pertimbangan moral yang terkandung dalam φρόνησις.
- source_word: ἑτοιμάσαι κυρίῳ
  choice: untuk menyiapkan bagi Tuhan
  rationale: Infinitif kedua menyatakan tujuan yang sejajar. Dativus κυρίῳ secara alami diterjemahkan “bagi Tuhan,” tanpa mengganti gelar itu dengan nama atau identitas yang diperjelas.
- source_word: λαὸν κατεσκευασμένον
  choice: suatu umat yang siap sedia
  rationale: Partisip perfek pasif menunjukkan keadaan siap sebagai hasil persiapan. “Siap sedia” alami dalam bahasa Indonesia dan mempertahankan nuansa keadaan yang telah dihasilkan.
theological_decisions:
- issue: Identitas dan peran dalam ungkapan Elia
  choice: Ia melayani dengan roh dan kuasa Elia.
  alternative: Elia sendiri kembali secara harfiah.
  rationale: Teks Yunani menyatakan “dengan roh dan kuasa Elia,” yang menunjukkan kesinambungan dan pemberdayaan kenabian, bukan secara eksplisit kesamaan pribadi.
- issue: Rujukan kata ganti dan gelar Tuhan
  choice: Mempertahankan “dia” dan “Tuhan” sebagaimana bentuk ayat Yunani.
  alternative: Memperjelas kata ganti itu sebagai “Mesias” atau “Yesus” di dalam teks utama.
  rationale: Konteks membantu mengenali rujukannya, tetapi ayat ini sendiri memakai kata ganti αὐτοῦ dan gelar κύριος. Terjemahan tidak menambahkan penjelasan yang tidak dinyatakan langsung.
- issue: Hubungan sintaksis frasa ἐν φρονήσει δικαίων
  choice: Orang-orang yang tidak taat dibuat berbalik kepada kearifan orang-orang benar.
  alternative: Orang-orang yang tidak taat berbalik dalam kearifan orang-orang benar.
  rationale: Konstruksi ini dapat terdengar instrumental atau lokatif secara formal, tetapi dalam kaitannya dengan ἐπιστρέψαι paling wajar menyatakan arah menuju pola pengertian orang benar. Catatan kaki mempertahankan alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tujuan ganda dipertahankan dengan “untuk ... serta untuk ...”; pengulangan “berbalik” ditambahkan demi kejelasan sintaksis dalam bahasa Indonesia. Kata ganti “dia” tidak dikapitalisasi agar terjemahan tidak menyelesaikan rujukan teologis melalui tipografi.
