  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: id
  text: kepada seorang perawan yang telah dipertunangkan[a] dengan seorang laki-laki bernama Yusuf, yang berasal dari keluarga Daud; dan nama perawan itu Maria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah bertunangan”. Istilah Yunani menunjuk pada ikatan resmi sebelum mereka hidup bersama sepenuhnya sebagai suami istri.
    reason: lexical_alternative
  - marker: b
    text: Atau “Mariam”, transliterasi yang lebih dekat dengan bentuk nama dalam teks Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: perawan
  rationale: Dalam konteks ini, παρθένος secara jelas menunjuk kepada seorang perempuan yang belum pernah melakukan hubungan seksual. Pengulangan kata itu dalam ayat yang sama dipertahankan untuk mengikuti penekanan Lukas.
- source_word: ἐμνηστευμένην
  choice: telah dipertunangkan
  rationale: Partisip perfek ini menyatakan keadaan pertunangan resmi yang sudah berlaku. Bentuk pasif “telah dipertunangkan” mempertahankan bentuk dan bobot sosial-hukum ungkapan Yunani dengan bahasa Indonesia yang wajar.
- source_word: ἀνδρὶ
  choice: dengan seorang laki-laki
  rationale: ἀνήρ dapat berarti “laki-laki” atau “suami”, tetapi dalam konstruksi pertunangan ini “laki-laki” tidak menyatakan bahwa perkawinan mereka sudah dijalani sepenuhnya.
- source_word: ᾧ ὄνομα Ἰωσήφ
  choice: bernama Yusuf
  rationale: Ini merupakan ungkapan Indonesia yang alami dan tepat bagi formula penamaan Yunani tersebut.
- source_word: ἐξ οἴκου Δαυίδ
  choice: yang berasal dari keluarga Daud
  rationale: “Keluarga Daud” mempertahankan gagasan wangsa atau garis keturunan dalam οἶκος, sedangkan klausa relatif memperjelas bahwa keterangan itu merujuk kepada Yusuf.
- source_word: Μαριάμ
  choice: Maria
  rationale: “Maria” adalah bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia; “Mariam” lebih dekat dengan transliterasi bentuk Yunani.
theological_decisions:
- issue: Apakah παρθένος perlu diterjemahkan dengan mempertahankan arti keperawanan dalam kisah kelahiran Yesus
  choice: perawan
  alternative: perempuan muda
  rationale: Makna leksikal dan konteks langsung Lukas mendukung “perawan”. Pilihan ini mempertahankan arti serta bobot teologis teks tanpa menambahkan klaim di luar ayat.
- issue: Status hubungan Maria dan Yusuf pada tahap ini
  choice: telah dipertunangkan
  alternative: telah bertunangan
  rationale: Teks menyatakan ikatan resmi yang telah berlaku, tetapi tidak menyebut mereka telah menjalani kehidupan perkawinan sepenuhnya. Karena itu, terjemahan tidak memakai “bersuami” atau menyebut Yusuf sebagai suaminya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Telah dipertunangkan” dipilih untuk menyampaikan keadaan pertunangan resmi, sedangkan “keluarga Daud” mempertahankan nuansa wangsa tanpa memakai istilah yang terlalu teknis.
