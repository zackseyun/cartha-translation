    issue: Ungkapan “mengandung dalam rahimmu” berlebihan dalam bahasa Indonesia.
    rationale: Frasa Yunani ἐν γαστρί berfungsi secara idiomatis bersama συλλήμψῃ untuk menyatakan bahwa Maria akan mengandung. Dalam bahasa Indonesia, “mengandung” sudah menyampaikan makna tersebut secara wajar.
  - severity: medium
    issue: Rumusan utama “engkau akan menyebut namanya Yesus” kurang idiomatis.
    rationale: Walaupun mencerminkan bentuk harfiah Yunani, konstruksi ini kurang lancar dalam bahasa Indonesia modern. “Engkau akan menamainya Yesus” menyampaikan tindakan penamaan yang sama dengan jelas; bentuk lebih harfiah dapat dipertahankan di catatan kaki.
  revised_text: Dan lihatlah, engkau akan mengandung dan melahirkan seorang anak laki-laki, dan engkau akan menamainya Yesus.[a]
