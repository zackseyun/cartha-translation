  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: ἰδού sebagai penanda perhatian, konsepsi dan kelahiran di masa depan, seorang anak laki-laki, serta pemberian nama Yesus. Namun, ἐν γαστρί adalah idiom untuk mengandung dan tidak perlu diterjemahkan secara anatomi dalam bahasa Indonesia; “mengandung dalam rahimmu” terdengar berlebihan dan kurang idiomatis. Rumusan penamaan literal juga perlu disesuaikan agar tidak menghasilkan konstruksi Indonesia yang janggal.'
  naturalness: “Dan lihatlah” dan “engkau” sesuai untuk register khidmat modern. “Mengandung dalam rahimmu” kurang alami karena mengandung sudah menyatakan kehamilan dalam rahim. “Menyebut namanya Yesus” dapat dipahami, tetapi lebih janggal daripada rumusan penamaan Indonesia yang lazim.
  terminology: “Anak laki-laki” dengan tepat mempertahankan υἱόν, dan “Yesus” adalah bentuk nama yang baku dalam bahasa Indonesia. “Menamainya Yesus” merupakan padanan modern yang setia bagi καλέσεις τὸ ὄνομα αὐτοῦ tanpa memasukkan penafsiran tambahan.
  issues:
