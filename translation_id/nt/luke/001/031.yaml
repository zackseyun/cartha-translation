base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: id
  text: Dan lihatlah, engkau akan mengandung dan melahirkan seorang anak laki-laki, dan engkau akan menamainya Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau akan menyebut nama-Nya Yesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi partikel yang mengarahkan perhatian dan nada khidmat dalam pemberitahuan malaikat. Bentuk ini lebih dekat dengan teks sumber daripada "sesungguhnya", yang dapat menggeser penekanan menjadi penegasan kebenaran.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: engkau akan mengandung dalam rahimmu
  rationale: Menyampaikan makna pembuahan/kehamilan sekaligus mempertahankan unsur eksplisit ἐν γαστρί. Akhiran "-mu" menjadikan rujukan orang kedua yang tersirat dalam verba Yunani jelas dan wajar dalam bahasa Indonesia.
- source_word: τέξῃ υἱόν
  choice: melahirkan seorang anak laki-laki
  rationale: Dalam konteks kelahiran, "melahirkan" merupakan padanan alami bagi τέξῃ. "Seorang anak laki-laki" mempertahankan kekhususan jenis kelamin dari υἱόν tanpa menggunakan bentuk "putra" yang dapat terasa lebih tinggi atau khusus.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: engkau akan menyebut namanya
  rationale: Mempertahankan rumusan penamaan yang secara harfiah menyebut "namanya" serta gema gaya Kitab Suci, sambil tetap dapat dipahami dalam bahasa Indonesia. Bentuk yang lebih idiomatis dicantumkan dalam catatan kaki.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Menggunakan bentuk nama yang baku dalam bahasa Indonesia untuk tokoh Perjanjian Baru ini.
theological_decisions:
- issue: Rumusan penamaan καλέσεις τὸ ὄνομα αὐτοῦ
  choice: engkau akan menyebut namanya Yesus
  alternative: engkau akan menamainya Yesus
  rationale: Pilihan utama mempertahankan tekstur rumusan penamaan Yunani dan kemungkinan gema antarteks tanpa menambahkan tafsiran doktrinal. Alternatif yang lebih idiomatis disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti orang kedua tunggal "engkau" sesuai dengan sapaan langsung dalam konteks pemberitahuan malaikat. Huruf kecil pada "namanya" mengikuti bentuk gramatikal biasa dan tidak memasukkan penandaan penghormatan yang tidak dinyatakan oleh teks Yunani.
