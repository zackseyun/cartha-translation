  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: id
  text: Dan lihatlah, Elisabet, kerabatmu, juga telah mengandung seorang anak laki-laki pada masa tuanya, dan kini inilah bulan keenam baginya, yang disebut mandul itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang kuat dalam narasi dengan bentuk Indonesia yang alami dan bermartabat.
- source_word: συγγενίς
  choice: kerabat
  rationale: Istilah sumber menunjukkan kerabat perempuan tanpa menentukan hubungan kekeluargaan yang lebih khusus.
- source_word: συνείληφεν υἱὸν
  choice: telah mengandung seorang anak laki-laki
  rationale: Menyampaikan bahwa anak yang dikandung berjenis kelamin laki-laki, sesuai ungkapan Yunani.
- source_word: ἐν γήρει αὐτῆς
  choice: pada masa tuanya
  rationale: Padanan idiomatis yang mempertahankan keterangan mengenai usia lanjut Elisabet.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: dia yang disebut mandul
  rationale: Mempertahankan bentuk pasif dan nuansa reputasi atau sebutan, tanpa mengubahnya menjadi penilaian mutlak dari narator.
theological_decisions:
- issue: Makna 'yang disebut mandul'
  choice: dia yang disebut mandul
  alternative: dia yang mandul
  rationale: Bentuk ini mempertahankan καλουμένῃ dan ketegangan antara sebutan sebelumnya dengan kehamilan yang kini terjadi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Partikel 'itu' sesudah 'kerabatmu' membantu menampilkan Elisabet sebagai topik tanpa menambahkan hubungan kekerabatan tertentu.
