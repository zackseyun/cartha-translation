  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: id
  text: Pada hari-hari itu, Maria bangkit dan segera pergi ke daerah pegunungan, ke sebuah kota di wilayah Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah kota kecil di wilayah Yehuda”, “sebuah kota di Yudea”, atau mungkin “kota Yehuda”. Kata Yunani πόλις dapat berarti kota besar ataupun kota kecil, dan Ἰούδα dapat menunjuk wilayah Yehuda atau Yudea, atau mungkin nama sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: bangkit lalu
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului dan mengiringi verba utama. “Bangkit lalu” mempertahankan urutan narasi tanpa menafsirkannya secara berlebihan sebagai “berangkat”.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ berfungsi sebagai peralihan naratif ringan. Dalam bahasa Indonesia modern, kesinambungannya sudah wajar melalui pembukaan “Pada hari-hari itu”, sehingga penambahan “adapun” atau “kemudian” akan terasa lebih berat atau lebih tegas daripada bahasa sumber.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Pada hari-hari itu
  rationale: Ungkapan waktu ini diterjemahkan secara alami sambil mempertahankan daya tunjuk ταύταις.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: πορεύομαι di sini berarti pergi atau melakukan perjalanan; “pergi” merupakan padanan Indonesia yang alami dan cukup luas.
- source_word: εἰς τὴν ὀρεινὴν
  choice: ke daerah pegunungan
  rationale: ὀρεινή dipakai secara substantival untuk menyebut kawasan berbukit atau dataran tinggi. “Daerah pegunungan” alami dalam bahasa Indonesia dan tidak menentukan lokasi lebih jauh daripada teks.
- source_word: μετὰ σπουδῆς
  choice: bergegas
  rationale: Dalam konteks perjalanan, frasa ini terutama menyatakan kesegeraan atau ketergesaan. “Bergegas” ringkas dan alami, walaupun σπουδή juga dapat mengandung nuansa kesungguhan atau semangat.
- source_word: εἰς πόλιν Ἰούδα
  choice: ke sebuah kota di wilayah Yehuda
  rationale: πόλις dapat menunjuk kota besar maupun kota kecil, sedangkan Ἰούδα paling wajar dipahami sebagai penanda wilayah atau suku. Penambahan “wilayah” mencegah pembaca modern keliru menganggap Yehuda sebagai nama kota, sementara catatan kaki mempertahankan alternatif leksikalnya.
theological_decisions:
- issue: Identifikasi Ἰούδα
  choice: Yehuda sebagai wilayah atau kawasan suku
  alternative: Yudea sebagai nama wilayah; atau Yehuda sebagai nama sebuah kota
  rationale: Dalam konteks perjalanan menuju daerah pegunungan, bentuk Ἰούδα paling alami menunjuk kawasan Yehuda. Terjemahan utama mengikuti bentuk nama dalam bahasa sumber tanpa memastikan secara mutlak batas administratif “Yudea” atau menerima pembacaan sebagai nama kota.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “bangkit lalu bergegas pergi” mempertahankan gerak narasi Yunani, sedangkan “di wilayah Yehuda” memberi kejelasan geografis tanpa meniadakan alternatif yang dicatat dalam catatan kaki.
