  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: id
  text: karena belas kasih Allah kita yang mendalam, fajar dari tempat yang tinggi[a] akan melawat kita,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “matahari terbit dari tempat yang tinggi”; kata Yunani yang diterjemahkan “fajar” juga dapat menggemakan gelar mesianik “Tunas” dalam Perjanjian Lama Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: karena
  rationale: Dengan bentuk akusatif, διά menyatakan sebab atau dasar. “Karena” menyampaikan hubungan kausal secara alami dalam bahasa Indonesia.
- source_word: σπλάγχνα ἐλέους
  choice: belas kasih yang mendalam
  rationale: Ungkapan harfiahnya menunjuk pada bagian dalam tubuh sebagai pusat perasaan. Terjemahan ini mempertahankan gagasan kasih dan iba yang sangat dalam tanpa memakai ungkapan anatomis yang terasa janggal dalam bahasa Indonesia.
- source_word: θεοῦ ἡμῶν
  choice: Allah kita
  rationale: Menyampaikan konstruksi genitif posesif secara langsung dan wajar.
- source_word: ἐν οἷς
  choice: Oleh belas kasih itu
  rationale: Frasa relatif ini merujuk kembali pada belas kasih Allah dan dapat menyatakan lingkup atau sarana tindakan-Nya. Pengulangan nomina memperjelas rujukannya dalam bahasa Indonesia tanpa menentukan nuansanya secara berlebihan.
- source_word: ἐπισκέψεται
  choice: akan melawat
  rationale: Bentuk ini adalah indikatif mendatang. “Melawat” mempertahankan gambaran kunjungan ilahi yang membawa perhatian dan pertolongan, sementara konteks menentukan sifat penyelamatannya.
- source_word: ἀνατολὴ
  choice: fajar
  rationale: Kata ini dapat berarti terbit, fajar, atau matahari terbit, dan juga dapat menggemakan gelar mesianik “Tunas” dalam Septuaginta. Konteks ayat berikutnya menekankan terang yang menyinari kegelapan, sehingga “fajar” paling sesuai dalam teks utama.
- source_word: ἐξ ὕψους
  choice: dari tempat tinggi
  rationale: Terjemahan ini dekat dengan bentuk Yunani dan mempertahankan ungkapan tentang ranah surgawi tanpa mempersempitnya secara eksplisit menjadi “dari surga”.
theological_decisions:
- issue: Makna ἀνατολή dalam konteks mesianik
  choice: fajar
  alternative: matahari terbit; Tunas
  rationale: Gambaran terang dalam Lukas 1:79 mendukung arti fajar atau terbitnya matahari. Namun, pemakaian kata yang sama dalam Septuaginta dapat menggemakan sebutan mesianik “Tunas”; kemungkinan ini dipertahankan dalam catatan kaki agar resonansinya tidak hilang atau dipastikan secara berlebihan.
- issue: Nuansa kunjungan dalam ἐπισκέψεται
  choice: akan melawat
  alternative: akan datang menolong; akan memperhatikan
  rationale: “Melawat” mempertahankan metafora kunjungan ilahi serta bentuk mendatang dalam teks sumber, tanpa memasukkan seluruh implikasi penyelamatan langsung ke dalam kata kerja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Belas kasih yang mendalam” mengungkapkan idiom Yunani secara wajar; “melawat” dipertahankan karena bernuansa biblis namun masih mudah dipahami. Tanda koma di akhir mengikuti kenyataan bahwa ayat ini berlanjut secara sintaksis ke ayat 79.
