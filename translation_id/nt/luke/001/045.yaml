  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: id
  text: Dan berbahagialah dia yang percaya bahwa akan ada penggenapan atas apa yang telah difirmankan kepadanya dari Tuhan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab akan ada penggenapan atas apa yang telah difirmankan kepadanya dari Tuhan.” Kata penghubung Yunani ini kadang-kadang dapat dipahami secara kausal, meskipun sebagai pengantar isi (“bahwa”) lebih mungkin di sini.
    reason: alternative_reading
  - marker: b
    text: Atau, “penyelesaian” atau “pelaksanaan” untuk “penggenapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: berbahagialah
  rationale: Mempertahankan bobot religius μακάριος sebagai pernyataan bahwa seseorang berada dalam keadaan yang diberkati, dengan ungkapan Indonesia yang alami dan khidmat.
- source_word: ἡ πιστεύσασα
  choice: dia yang telah percaya
  rationale: Menerjemahkan partisipel aoris berartikel secara substantival dan mempertahankan tindakan percaya yang telah dilakukan.
- source_word: ὅτι
  choice: bahwa
  rationale: Paling wajar memperkenalkan isi kepercayaan Maria; kemungkinan makna kausal tetap dicatat dalam catatan kaki.
- source_word: τελείωσις
  choice: digenapi
  rationale: Bentuk verbal pasif menghasilkan bahasa Indonesia yang alami serta menyampaikan gagasan bahwa firman Tuhan dibawa sampai pada pelaksanaannya.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: apa yang disampaikan kepadanya
  rationale: Mewakili partisipel perfekt pasif dan merujuk pada isi perkataan yang sebelumnya diterima Maria.
- source_word: παρὰ κυρίου
  choice: dari Tuhan
  rationale: Menjaga nuansa sumber atau asal yang dinyatakan oleh παρά dengan genetif, tanpa memaksakan gagasan bahwa Tuhan berbicara langsung tanpa perantaraan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Padanan baku dan sesuai konteks untuk κύριος yang di sini menunjuk kepada Allah Israel.
theological_decisions:
- issue: Hubungan antara kebahagiaan Maria, imannya, dan firman yang dijanjikan
  choice: Maria dinyatakan berbahagia sebagai orang yang percaya bahwa perkataan dari Tuhan kepadanya akan digenapi.
  alternative: Maria berbahagia karena perkataan yang disampaikan kepadanya dari Tuhan akan digenapi.
  rationale: ὅτι paling alami dipahami sebagai pengantar isi dari πιστεύσασα, tetapi pembacaan kausal tetap mungkin dan dicatat tanpa menutup ambiguitas teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami dengan memindahkan klausa penggenapan ke akhir, sambil mempertahankan fokus pada iman Maria dan asal ilahi perkataan tersebut.
