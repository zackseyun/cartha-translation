revisions:
- from: Dan berbahagialah dia yang telah percaya bahwa apa yang disampaikan kepadanya dari Tuhan akan digenapi.[a][b]
  to: Dan berbahagialah dia yang percaya bahwa akan ada penggenapan atas apa yang telah difirmankan kepadanya dari Tuhan.[a][b]
  rationale: Revisi menampilkan ἔσται τελείωσις secara lebih dekat sebagai “akan ada penggenapan,” sambil mempertahankan pembacaan ὅτι sebagai klausa isi. “Telah difirmankan” menandai partisipel perfekt pasif dan sesuai dengan konteks perkataan ilahi; “dari Tuhan” mempertahankan nuansa sumber dari παρά κυρίου. Kedua catatan kaki diperbaiki agar secara struktural dan semantis selaras dengan teks revisi.
