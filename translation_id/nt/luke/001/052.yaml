  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: id
  text: Ia telah menurunkan para penguasa dari takhta dan meninggikan orang-orang yang rendah hati.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang yang berkuasa" untuk "para penguasa". Kata Yunani ini dapat menunjuk orang-orang yang memiliki kuasa secara lebih luas, tetapi frasa "dari takhta" mendukung arti para penguasa.
    reason: lexical_alternative
  - marker: b
    text: Atau "orang-orang yang rendah kedudukannya" untuk "orang-orang yang rendah hati". Kata Yunani ini dapat menunjuk kerendahan hati dan/atau kedudukan sosial yang rendah.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: telah menurunkan
  rationale: Bentuk aoris menyatakan tindakan Allah yang tegas dalam rangkaian Magnificat. Frasa 'telah menurunkan' wajar dalam bahasa Indonesia dan mempertahankan tindakan yang sudah terlaksana serta relevansinya, tanpa mempersempitnya menjadi penggulingan politis yang keras.
- source_word: δυνάστας
  choice: para penguasa
  rationale: Kata ini dapat menunjuk orang-orang berkuasa atau para penguasa. Keterangan 'dari takhta' menonjolkan makna pemerintahan, sehingga 'para penguasa' paling sesuai sambil tetap menyediakan alternatif dalam catatan kaki.
- source_word: ἀπὸ θρόνων
  choice: dari takhta
  rationale: Terjemahan ini mempertahankan gambaran konkret dalam bahasa Yunani tanpa menambahkan kata milik seperti 'mereka' yang tidak dinyatakan dalam teks sumber.
- source_word: ὕψωσεν
  choice: meninggikan
  rationale: Pilihan ini mempertahankan makna mengangkat ke kedudukan tinggi dan selaras dengan tema pembalikan keadaan, sekaligus mengandung gema sosial dan teologis.
- source_word: ταπεινούς
  choice: orang-orang yang rendah hati
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan salah satu makna utama kata Yunani. Karena kata tersebut juga dapat menunjuk orang yang berkedudukan rendah, kemungkinan itu dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Aspek dan waktu aoris dalam Magnificat
  choice: Menerjemahkan aoris dengan bentuk 'telah menurunkan ... dan meninggikan'
  alternative: Bentuk lampau naratif ('menurunkan ... dan meninggikan') atau ungkapan bernuansa tindakan umum Allah
  rationale: Bentuk 'telah' menyampaikan tindakan Allah yang tegas dan selesai dengan dampak yang tetap berlaku, tanpa menentukan apakah perkataan ini terutama bersifat profetis, merangkum karya Allah, atau merupakan bahasa pujian yang memandang tindakan-Nya sebagai sudah terlaksana.
- issue: Cakupan makna ταπεινούς
  choice: orang-orang yang rendah hati
  alternative: orang-orang yang rendah kedudukannya
  rationale: Teks dapat menunjuk kerendahan hati, rendahnya status sosial, atau keduanya. Terjemahan utama dan catatan kaki bersama-sama mempertahankan ketegangan makna itu tanpa membatasinya pada salah satu kategori.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur paralel ayat serta gambaran konkret tentang takhta dipertahankan. 'Ia' mengikuti gaya naratif yang ringkas; 'orang-orang yang rendah hati' mudah dipahami pembaca umum, sedangkan dimensi status sosial dijaga melalui catatan kaki.
