id: LUK.1.34
reference: Luke 1:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: id
  text: Namun Maria berkata kepada malaikat itu, “Bagaimana hal ini akan terjadi, karena aku belum pernah mengenal laki-laki[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mengenal laki-laki” adalah ungkapan halus yang berarti melakukan hubungan seksual dengan laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan responsif dan sedikit kontras antara pemberitahuan malaikat dan pertanyaan Maria tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: πρὸς τὸν ἄγγελον
  choice: kepada malaikat itu
  rationale: Dalam konteks kisah ini, ἄγγελος jelas menunjuk kepada makhluk surgawi yang telah berbicara kepada Maria; kata penunjuk 'itu' membuat rujukannya alami dalam bahasa Indonesia.
- source_word: Πῶς ἔσται τοῦτο
  choice: Bagaimana hal ini akan terjadi
  rationale: Menyampaikan pertanyaan tentang bagaimana kenyataan yang baru diumumkan itu akan terwujud; 'akan terjadi' lebih alami daripada terjemahan harfiah kaku 'akan menjadi'.
- source_word: ἐπεὶ
  choice: karena
  rationale: Memperkenalkan alasan yang mendasari pertanyaan Maria secara jelas dan alami.
- source_word: ἄνδρα
  choice: laki-laki
  rationale: ἀνήρ dapat berarti laki-laki atau suami. Dalam ungkapan ini acuannya adalah hubungan seksual dengan seorang laki-laki, sehingga 'laki-laki' mempertahankan keluasan bentuk Yunani tanpa mempersempitnya menjadi 'suami'.
- source_word: οὐ γινώσκω
  choice: aku belum pernah mengenal
  rationale: Mempertahankan ungkapan halus 'mengenal' yang dalam konteks ini berarti berhubungan seksual. 'Belum pernah' menyatakan pengalaman yang tidak pernah terjadi hingga saat berbicara secara alami dalam bahasa Indonesia, meskipun bentuk Yunani secara morfologis adalah kala kini.
theological_decisions:
- issue: Pernyataan Maria dan konsepsi Yesus
  choice: Mempertahankan ungkapan 'belum pernah mengenal laki-laki' dalam teks utama dan menjelaskan makna seksualnya dalam catatan kaki.
  alternative: karena aku belum pernah berhubungan dengan laki-laki; karena aku masih perawan
  rationale: Ungkapan Yunani menyiratkan bahwa Maria belum pernah melakukan hubungan seksual, tetapi tidak memakai kata langsung untuk 'perawan' dalam ayat ini. Terjemahan ini mempertahankan cara pengungkapan sumber dan tidak menambahkan rumusan teologis yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan 'aku' sesuai dengan ujaran pribadi Maria. Ungkapan sumber dipertahankan dalam teks utama, sedangkan makna idiomatisnya dijelaskan agar tidak disalahpahami oleh pembaca masa kini.
