base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: id
  text: Lalu malaikat itu masuk menemui Maria dan berkata, “Salam, engkau yang telah mendapat perkenanan[a]! Tuhan menyertai engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “engkau yang sangat diperkenan” atau “engkau yang telah dikaruniai perkenanan”; secara tradisional, “penuh rahmat.” Kata Yunani ini menunjukkan seseorang yang telah menerima kasih karunia atau perkenanan.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: masuk menemui Maria
  rationale: Partisip aoris εἰσελθών menyatakan tindakan masuk yang mendahului kata kerja utama, sedangkan πρός dengan akusatif menunjukkan arah kepada perempuan itu. Nama “Maria” dipakai sebagai rujukan alami dalam bahasa Indonesia agar tidak rancu, tanpa menambah tokoh baru.
- source_word: Χαῖρε
  choice: Salam
  rationale: Walaupun secara bentuk merupakan imperatif yang berarti “bersukacitalah,” dalam konteks ini kata tersebut berfungsi sebagai sapaan. “Salam” alami dalam bahasa Indonesia modern dan mempertahankan fungsi pragmatisnya.
- source_word: κεχαριτωμένη
  choice: engkau yang dianugerahi kasih karunia
  rationale: Partisip perfek pasif dari χαριτόω menggambarkan Maria sebagai penerima kasih karunia atau perkenanan. Bentuk ini mempertahankan unsur pasif dan nuansa hasil yang berlanjut tanpa menyatakan bahwa kasih karunia itu berasal secara intrinsik dari dirinya.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Gelar κύριος di sini merujuk kepada Allah; “Tuhan” merupakan padanan baku yang wajar dan khidmat dalam bahasa Indonesia.
- source_word: μετὰ σοῦ
  choice: menyertai engkau
  rationale: μετά dengan genitif berarti “bersama dengan.” Ungkapan idiomatis “Tuhan menyertai engkau” menyampaikan kehadiran ilahi secara alami, dengan kopula Yunani yang tersirat dinyatakan melalui verba Indonesia.
theological_decisions:
- issue: Terjemahan κεχαριτωμένη dalam teks Mariologis yang peka secara teologis
  choice: engkau yang dianugerahi kasih karunia
  alternative: 'engkau yang sangat diperkenan; engkau yang dikaruniai; secara tradisional: penuh rahmat'
  rationale: 'Pilihan utama mengikuti bentuk perfek pasif Yunani: Maria telah menjadi penerima tindakan pemberian kasih karunia atau perkenanan, dan hasilnya tetap berlaku. Terjemahan ini tidak mengurangi kuatnya perkenanan ilahi kepada Maria, tetapi juga tidak memasukkan rumusan doktrinal kemudian yang tidak dinyatakan secara eksplisit oleh bentuk Yunani tersebut.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Engkau” dipertahankan karena sesuai dengan sapaan langsung dalam register Alkitab yang bermartabat. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang diterangkan.
