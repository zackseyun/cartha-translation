  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: id
  text: untuk menunjukkan belas kasihan kepada nenek moyang kita[c][a] dan mengingat perjanjian-Nya yang kudus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan nenek moyang kita”; ungkapan Yunani ini berarti menunjukkan belas kasihan dalam hubungan dengan para leluhur Israel.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa perjanjian Alkitab, Allah “mengingat” biasanya menyiratkan bahwa Ia bertindak dengan setia berdasarkan janji yang telah diberikan, bukan sekadar mengenangnya dalam pikiran.
    reason: cultural_note
  - marker: c
    text: “Nenek moyang kita” mengacu kepada para leluhur Israel, khususnya para bapa leluhur; dapat juga diterjemahkan “bapa-bapa kita”.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: menunjukkan belas kasihan
  rationale: Ungkapan ini secara idiomatis berarti memperlihatkan atau melakukan belas kasihan; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa tujuan infinitif dalam konteks.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: kepada nenek moyang kita
  rationale: Walaupun μετά dengan genitif secara harfiah berarti 'dengan', dalam ungkapan ini relasinya paling alami dinyatakan sebagai 'kepada'. πατέρων menunjuk kepada para leluhur Israel; 'nenek moyang' jelas dan wajar dalam bahasa Indonesia.
- source_word: μνησθῆναι
  choice: mengingat
  rationale: Terjemahan langsung ini mempertahankan ungkapan perjanjian dalam Kitab Suci tanpa memperluasnya menjadi 'menggenapi' atau 'bertindak' di dalam teks utama.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: perjanjian-Nya yang kudus
  rationale: διαθήκη dalam konteks sejarah keselamatan berarti 'perjanjian', sedangkan ἁγίας menerangkan sifatnya sebagai kudus. Akhiran '-Nya' secara alami merujuk kepada Allah.
theological_decisions:
- issue: Makna tindakan Allah 'mengingat' perjanjian
  choice: mengingat perjanjian-Nya yang kudus
  alternative: bertindak dengan setia berdasarkan perjanjian-Nya yang kudus
  rationale: Dalam bahasa perjanjian Alkitab, 'mengingat' kerap mencakup tindakan setia terhadap janji terdahulu. Namun, teks Yunani tetap memakai kata 'mengingat', sehingga ketegangan maknanya dipertahankan dalam teks utama dan dijelaskan dalam catatan.
- issue: Rujukan πατέρων ἡμῶν
  choice: nenek moyang kita
  alternative: bapa-bapa kita
  rationale: Istilah Yunani berbentuk maskulin dan mengacu kepada para leluhur atau leluhur utama Israel. Dalam bahasa Indonesia modern, 'nenek moyang' menyampaikan rujukan historis itu secara alami tanpa mengubahnya menjadi kelompok orang tua langsung.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Struktur ayat dipertahankan sebagai bagian dari kalimat nubuat yang berlanjut dari konteks sebelumnya. Penempatan penanda catatan mengikuti frasa yang diterangkannya.
