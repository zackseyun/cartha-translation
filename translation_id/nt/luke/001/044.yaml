  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: id
  text: Sebab sesungguhnya, ketika suara salammu sampai ke telingaku, bayi dalam kandunganku melonjak kegirangan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bayi dalam kandunganku melonjak dalam kegirangan.”'
    reason: Alternatif ini mempertahankan secara lebih formal konstruksi ἐν ἀγαλλιάσει dan nuansa sukacita yang meluap.
lexical_decisions:
- source_word: ἰδοὺ
  choice: sesungguhnya
  rationale: Berfungsi sebagai penanda wacana yang menarik perhatian dan menegaskan pernyataan; “sesungguhnya” mempertahankan daya retorisnya dalam bahasa Indonesia yang bermartabat tanpa memakai seruan yang kurang alami seperti “lihatlah” dalam konteks ini.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan hubungan penjelasan dengan pernyataan pada ayat sebelumnya.
- source_word: ὡς ἐγένετο
  choice: ketika ... sampai
  rationale: Menandai saat terjadinya peristiwa; bersama frasa tentang suara dan telinga, “sampai” merupakan ungkapan Indonesia yang alami.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: suara salammu
  rationale: Menyampaikan bunyi salam yang terdengar secara ringkas dan alami; “salam” merupakan padanan modern bagi ἀσπασμός.
- source_word: εἰς τὰ ὦτά μου
  choice: ke telingaku
  rationale: Mempertahankan arah yang dinyatakan oleh εἰς sambil menggunakan idiom Indonesia yang wajar.
- source_word: ἐσκίρτησεν
  choice: melonjak
  rationale: Menggambarkan gerakan mendadak dan kuat dari bayi dengan kata yang hidup namun tetap alami.
- source_word: ἐν ἀγαλλιάσει
  choice: kegirangan
  rationale: Mengungkapkan sukacita yang meluap atau penuh kegembiraan, bukan sekadar rasa senang biasa.
- source_word: τὸ βρέφος
  choice: bayi
  rationale: βρέφος dapat menunjuk bayi yang belum lahir; “bayi” adalah padanan langsung dan alami dalam konteks kandungan.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: dalam kandunganku
  rationale: Konteks menentukan arti κοιλία sebagai kandungan atau rahim; ungkapan ini tepat dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan βρέφος bagi Yohanes yang belum lahir
  choice: bayi
  alternative: anak; janin
  rationale: “Bayi” mempertahankan cakupan leksikal βρέφος dan cara teks menyebut Yohanes dalam kandungan tanpa menambahkan klaim doktrinal di luar ungkapan teks.
- issue: Hubungan ἐν ἀγαλλιάσει dengan gerakan bayi
  choice: melonjak kegirangan
  alternative: bayi itu melonjak dalam kegirangan
  rationale: Terjemahan utama memahami frasa tersebut sebagai keterangan cara atau keadaan yang menyertai lonjakan. Catatan kaki mempertahankan bentuk yang lebih dekat dengan susunan Yunani dan nuansa ‘dalam kegirangan’.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami, sambil mempertahankan hubungan penjelasan, gambaran suara yang mencapai telinga, serta penyebutan konkret bayi dalam kandungan.
