id: LUK.1.7
reference: Luke 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: id
  text: Mereka tidak mempunyai anak karena Elisabet mandul, dan keduanya sudah lanjut usia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah lanjut dalam hari-hari mereka.”
    reason: Menjelaskan idiom Yunani yang diterjemahkan secara alami sebagai “sudah lanjut usia” tanpa membebani teks utama.
lexical_decisions:
- source_word: τέκνον
  choice: anak
  rationale: Bentuk tunggal τέκνον menunjuk pada seorang anak secara umum; “anak” alami dalam bahasa Indonesia dan tidak mengubahnya menjadi jamak.
- source_word: καθότι
  choice: karena
  rationale: Kata ini memperkenalkan alasan mereka tidak mempunyai anak; “karena” merupakan penghubung kausal yang paling jelas dan wajar.
- source_word: στεῖρα
  choice: mandul
  rationale: στεῖρα secara khusus menyatakan ketidakmampuan untuk mengandung, bukan sekadar keadaan tidak mempunyai anak. “Mandul” ringkas dan tepat, meskipun bernada langsung.
- source_word: ἀμφότεροι
  choice: keduanya
  rationale: Pilihan ini mempertahankan penekanan bahwa Zakharia dan Elisabet sama-sama termasuk dalam pernyataan tersebut.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: sudah lanjut usia
  rationale: Ungkapan Yunani ini menyatakan bahwa mereka telah berusia tua. “Sudah lanjut usia” alami, hormat, dan mempertahankan nuansa keadaan yang telah tercapai.
- source_word: οὐκ ἦν αὐτοῖς
  choice: mereka tidak mempunyai
  rationale: Secara harfiah konstruksi ini berarti “tidak ada bagi mereka,” tetapi dalam bahasa Indonesia kepemilikan paling alami dinyatakan dengan “mereka tidak mempunyai.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan klausa mengikuti hubungan sebab dalam teks Yunani. Penanda catatan kaki ditempatkan sesudah ungkapan usia yang diterangkannya.
