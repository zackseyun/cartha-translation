id: LUK.1.5
reference: Luke 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: id
  text: Pada zaman Herodes, raja Yudea, ada seorang imam bernama Zakharia dari rombongan Abia[a]. Istrinya berasal dari keturunan Harun[b], dan namanya Elisabet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rombongan Abia” adalah salah satu kelompok imam yang mendapat giliran melayani di Bait Allah.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “dari anak-anak perempuan Harun,” suatu ungkapan yang menunjukkan garis keturunan imam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Pada zaman ... ada
  rationale: Ungkapan pembuka naratif ini dialihkan secara alami ke dalam bahasa Indonesia sambil mempertahankan latar waktu dan pengenalan tokoh.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Herodes, raja Yudea
  rationale: Menyampaikan jabatan dan wilayah Herodes secara langsung; 'Yudea' sesuai dengan konteks geografis-historis Ἰουδαία.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: seorang imam bernama Zakharia
  rationale: τις berfungsi memperkenalkan tokoh yang belum tertentu dan cukup alami dinyatakan dengan 'seorang'; ὀνόματι diterjemahkan dengan formula penamaan Indonesia yang lazim.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: dari rombongan Abia
  rationale: ἐφημερία menunjuk kelompok atau giliran dinas imam. 'Rombongan' singkat dan wajar, sedangkan catatan kaki menjelaskan fungsi lembaganya.
- source_word: γυνὴ αὐτῷ
  choice: Istrinya
  rationale: Datif αὐτῷ menyatakan hubungan kepunyaan. 'Istrinya' merupakan padanan Indonesia yang alami dan tidak mengubah makna.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: berasal dari keturunan Harun
  rationale: Secara harfiah ungkapan ini berbunyi 'dari anak-anak perempuan Harun', tetapi dalam konteks silsilah maksudnya ialah garis keturunan Harun. Terjemahan utama dibuat jelas dan ungkapan harfiahnya dipertahankan dalam catatan.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: namanya Elisabet
  rationale: Formula penamaan diterjemahkan secara idiomatis dan ringkas dalam bahasa Indonesia.
- source_word: Ἡρῴδης / Ζαχαρίας / Ἀβιά / Ἀαρών / Ἐλισάβετ
  choice: Herodes / Zakharia / Abia / Harun / Elisabet
  rationale: Nama-nama memakai bentuk yang mapan dan mudah dikenali dalam tradisi bahasa Indonesia, tanpa menambahkan penafsiran.
theological_decisions:
- issue: Ungkapan garis keturunan Elisabet
  choice: berasal dari keturunan Harun
  alternative: berasal dari anak-anak perempuan Harun
  rationale: Bentuk utama menyampaikan makna idiom silsilah dengan jelas dalam bahasa Indonesia. Catatan kaki mempertahankan bentuk konkret Yunani sehingga hubungan dengan garis imam tidak tersembunyi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibagi menjadi dua agar alami, tanpa menghilangkan hubungan antarklausa. Penanda catatan ditempatkan tepat setelah unsur yang dijelaskan.
