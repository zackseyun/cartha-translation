  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: id
  text: Namun malaikat itu berkata kepadanya, “Jangan takut, Zakharia, sebab permohonanmu telah didengar[a]. Istrimu, Elisabet, akan melahirkan seorang anak laki-laki bagimu, dan engkau akan menamainya Yohanes[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “doamu telah didengar.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “engkau akan menyebut namanya Yohanes.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος
  choice: Namun malaikat itu berkata kepadanya
  rationale: δέ menandai peralihan ringan dalam wacana; “namun” menghubungkan perkataan malaikat dengan ketakutan Zakharia tanpa menambahkan pertentangan yang kuat. ἄγγελος dalam konteks ini menunjuk kepada makhluk surgawi, sehingga diterjemahkan “malaikat”.
- source_word: Μὴ φοβοῦ, Ζαχαρία
  choice: Jangan takut, Zakharia
  rationale: Ungkapan larangan ini paling wajar diterjemahkan “jangan takut” dalam bahasa Indonesia modern. “Zakharia” mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: διότι εἰσηκούσθη ἡ δέησίς σου
  choice: sebab permohonanmu telah didengar
  rationale: διότι menyatakan alasan. δέησις secara khusus berarti permohonan atau permintaan yang sungguh-sungguh, sering dalam doa. Bentuk pasif dipertahankan tanpa menyebut pelaku secara eksplisit, sebagaimana teks Yunani.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: Istrimu, Elisabet
  rationale: Dengan kata ganti milik σου dan konteks perkawinan, γυνή jelas berarti “istri”. Nama Elisabet dipertahankan dalam bentuk Indonesia yang lazim.
- source_word: γεννήσει υἱόν σοι
  choice: akan melahirkan seorang anak laki-laki bagimu
  rationale: Dengan subjek perempuan, γεννάω berarti melahirkan. “Bagimu” mempertahankan σοι sebagai datif yang menyatakan hubungan atau manfaat, sedangkan “anak laki-laki” menyampaikan υἱός dengan bahasa Indonesia yang alami.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: engkau akan menamainya Yohanes
  rationale: Ungkapan Yunani harfiahnya “engkau akan menyebut namanya Yohanes”. “Menamainya Yohanes” menyampaikan idiom tersebut secara alami, sementara bentuk “akan” mempertahankan kala mendatang καλέσεις tanpa memaksakan modalitas perintah yang tidak dinyatakan secara gramatikal.
theological_decisions:
- issue: Pelaku tersirat dalam bentuk pasif “telah didengar”
  choice: Pelaku tidak disebutkan secara eksplisit dalam teks terjemahan.
  alternative: “Allah telah mendengar permohonanmu.”
  rationale: Dalam konteks doa Yahudi, Allah secara alami dipahami sebagai pihak yang mendengar. Namun, teks Yunani memakai bentuk pasif dan tidak menyebut Allah secara langsung, sehingga terjemahan mempertahankan implikasi teologis itu tanpa memperjelasnya melebihi sumber.
- issue: Nuansa καλέσεις dalam pemberian nama
  choice: “engkau akan menamainya” sebagai pernyataan masa depan
  alternative: “engkau harus menamainya” sebagai perintah atau ketetapan
  rationale: Bentuk Yunani adalah indikatif mendatang. Dalam konteks pewartaan malaikat, ungkapan itu dapat memiliki daya ketetapan, tetapi terjemahan tidak mengubahnya secara eksplisit menjadi keharusan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan bentuk pasif ilahi atau nuansa pernyataan masa depan. Tanda koma pada “Istrimu, Elisabet,” memperjelas bahwa Elisabet adalah nama sang istri.
