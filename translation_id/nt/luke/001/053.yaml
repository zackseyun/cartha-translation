  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: id
  text: Ia mengenyangkan orang-orang yang lapar dengan hal-hal yang baik, dan menyuruh orang-orang kaya pergi dengan tangan kosong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: orang-orang yang lapar
  rationale: Partisipel kini aktif dipakai secara substantival. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arti konkret tanpa melebihkan intensitas menjadi 'kelaparan'.
- source_word: ἐνέπλησεν
  choice: mengenyangkan
  rationale: Dalam konteks orang lapar yang dipenuhi dengan hal-hal baik, 'mengenyangkan' menyampaikan tindakan memenuhi sampai puas secara alami. Bentuk aoris dipertahankan sebagai tindakan tegas dalam gaya nyanyian Maria, tanpa harus diberi penanda waktu tambahan.
- source_word: ἀγαθῶν
  choice: dengan hal-hal yang baik
  rationale: Genitif menyatakan isi dari tindakan memenuhi. Pilihan ini langsung dan tidak menambahkan gagasan 'pemberian' yang tidak dinyatakan oleh kata sifat tersebut.
- source_word: πλουτοῦντας
  choice: orang-orang kaya
  rationale: Partisipel kini aktif dipakai secara substantival. Pilihan ini mempertahankan kontras sosial yang konkret dengan orang-orang yang lapar.
- source_word: ἐξαπέστειλεν
  choice: menyuruh ... pergi
  rationale: Kata kerja majemuk ini berarti mengutus atau menyuruh pergi. Susunan ini alami dalam bahasa Indonesia dan cocok dengan keadaan pelengkap yang mengikutinya.
- source_word: κενούς
  choice: dengan tangan kosong
  rationale: Kata sifat predikatif ini menggambarkan keadaan orang-orang kaya ketika disuruh pergi. 'Dengan tangan kosong' merupakan idiom Indonesia yang alami untuk pergi tanpa memperoleh apa-apa, meskipun lebih bergambar daripada 'kosong'.
theological_decisions:
- issue: Pembalikan sosial-teologis dalam nyanyian Maria
  choice: Mempertahankan kontras konkret antara orang-orang yang lapar dan orang-orang kaya.
  alternative: Menafsirkan orang lapar sebagai mereka yang membutuhkan secara rohani dan orang kaya sebagai mereka yang puas diri atau sombong.
  rationale: Teks Yunani menyebut keadaan sosial yang konkret. Terjemahan tidak merohanikan atau mempersempit kedua kelompok tersebut, sehingga ketegangan teologis tentang pembalikan ilahi tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralelisme antarklausa dipertahankan; ungkapan 'dengan tangan kosong' dipilih karena lebih idiomatis daripada 'kosong' sebagai keterangan keadaan orang.
