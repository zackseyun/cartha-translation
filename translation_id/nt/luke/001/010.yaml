lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: seluruh kumpulan orang banyak itu
  rationale: Ungkapan ini mempertahankan penekanan πᾶν pada keseluruhan kelompok dan nuansa πλῆθος sebagai himpunan besar, dengan bentuk yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: τοῦ λαοῦ
  choice: orang banyak
  rationale: Dalam konstruksi Yunani, genitif ini menerangkan kumpulan tersebut. Terjemahan tidak menambahkan 'Israel', meskipun konteks Bait Allah mengarah kepada umat itu.
- source_word: προσευχόμενον
  choice: sedang berdoa
  rationale: Partisipel kini bersama ἦν menyatakan tindakan yang sedang berlangsung; 'sedang berdoa' menyampaikan aspek itu secara alami.
- source_word: ἔξω
  choice: di luar
  rationale: Menerjemahkan keterangan tempat secara langsung tanpa menambahkan objek tersirat seperti 'tempat kudus'.
- source_word: τῇ ὥρᾳ
  choice: pada waktu
  rationale: ὥρα di sini menunjuk waktu yang ditetapkan bagi tindakan ibadah. 'Pada waktu' lebih alami daripada 'pada jam' dalam bahasa Indonesia.
- source_word: τοῦ θυμιάματος
  choice: persembahan dupa
  rationale: θυμίαμα berarti dupa dan dalam konteks pelayanan Bait Allah menunjuk tindakan ritual mempersembahkannya; pilihan ini mempertahankan nuansa peribadatan.
theological_decisions:
- issue: Istilah peribadatan Bait Allah dalam θυμίαμα
  choice: persembahan dupa
  alternative: pembakaran dupa
  rationale: Pilihan utama menyatakan konteks ritual tanpa memasukkan klaim doktrinal tambahan. Alternatif tetap dicatat karena bentuk Yunani sendiri secara leksikal dapat menunjuk dupa, sementara tindakan membakarnya dipahami dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada khidmat. Susunan kalimat mempertahankan cakupan 'seluruh' serta tindakan doa yang sedang berlangsung, tanpa memperjelas lokasi 'di luar' melebihi teks Yunani.
