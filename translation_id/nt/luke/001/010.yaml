  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: id
  text: Dan seluruh kerumunan orang itu sedang berdoa di luar pada waktu pembakaran dupa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada waktu persembahan dupa.”
