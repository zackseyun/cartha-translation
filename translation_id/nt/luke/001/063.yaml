  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: id
  text: Ia meminta sebuah papan kecil untuk menulis, lalu menulis, “Yohaneslah namanya.”[a] Mereka semua pun heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan susunan yang lebih biasa, “Namanya Yohanes.” Teks Yunani secara lebih harfiah berbunyi, “Yohanes adalah namanya,” dengan penekanan pada nama Yohanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτήσας
  choice: Ia meminta ... lalu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului tindakan utama; susunan “meminta ..., lalu menulis” menyatakan urutan itu secara alami dalam bahasa Indonesia.
- source_word: πινακίδιον
  choice: sebuah papan tulis kecil
  rationale: Kata ini merujuk pada lempeng atau papan kecil yang digunakan untuk menulis. Pilihan ini jelas bagi pembaca modern dan mempertahankan unsur ukurannya.
- source_word: ἔγραψεν λέγων
  choice: menulis
  rationale: Dalam bahasa Yunani, “menulis dengan berkata” memperkenalkan isi tulisan. Dalam bahasa Indonesia, “menulis” diikuti kutipan langsung sudah menyampaikan fungsi tersebut tanpa ungkapan yang kaku.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: Yohaneslah namanya
  rationale: Partikel penegas “-lah” mempertahankan penempatan nama Yohanes di depan dan daya tegas pernyataan Zakharia, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: ἐθαύμασαν πάντες
  choice: Mereka semua pun heran
  rationale: “Heran” menyampaikan rasa takjub atau keheranan dalam konteks ini; “semua” mempertahankan cakupan πάντες, sedangkan “pun” menghubungkan reaksi mereka secara wajar dengan peristiwa sebelumnya.
theological_decisions:
- issue: Penegasan nama yang telah diberikan secara ilahi
  choice: “Yohaneslah namanya” dalam bentuk waktu kini
  alternative: “Namanya akan menjadi Yohanes”
  rationale: Teks Yunani memakai bentuk kini ἐστίν dan menegaskan bahwa Yohanes sudah merupakan namanya, bukan sekadar nama yang kelak akan diberikan. Terjemahan tidak mengubahnya menjadi bentuk masa depan.
translation_notes:
  register: Bahasa naratif modern, wajar, dan bermartabat. Susunan “Yohaneslah namanya” sengaja dipertahankan untuk menyampaikan penekanan teks sumber tanpa terdengar asing dalam bahasa Indonesia.
