  text: Tetapi ibunya menjawab, “Tidak, melainkan ia akan dinamai Yohanes.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: menjawab
  rationale: Partisip aoristus ini secara idiomatis memperkenalkan ucapan langsung; bentuk verba finit ‘menjawab’ wajar dalam bahasa Indonesia.
- source_word: μήτηρ αὐτοῦ
  choice: ibunya
  rationale: Bentuk posesif alami dalam bahasa Indonesia yang tetap mempertahankan acuan tertentu dalam teks Yunani.
- source_word: Οὐχί
  choice: Tidak!
  rationale: Negasi ini merupakan penolakan tegas terhadap usulan sebelumnya; tanda seru menyampaikan ketegasannya tanpa menambah unsur leksikal.
- source_word: ἀλλὰ
  choice: Namun
  rationale: Konjungsi ini menandai koreksi yang berlawanan dengan usulan dalam ayat sebelumnya; ‘namun’ menyampaikan daya adversatifnya secara wajar.
- source_word: κληθήσεται
  choice: harus dinamai
  rationale: Bentuk pasif futur dalam konteks penetapan nama menyatakan bahwa anak itu akan menyandang nama tersebut; ‘harus’ mempertahankan ketegasan pernyataan sang ibu, sedangkan ‘dinamai’ mempertahankan bentuk pasif dan konteks penamaan.
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
