  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Sementara itu” menghubungkan adegan dengan tindakan Zakharia sebelumnya; “begitu lama berada” lebih alami daripada terjemahan harfiah “menunda” dan tidak menyatakan bahwa keterlambatan itu disengaja.
