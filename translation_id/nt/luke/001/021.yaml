id: LUK.1.21
reference: Luke 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: id
  text: Sementara itu, orang-orang sedang menantikan Zakharia dan merasa heran karena ia begitu lama berada di Bait Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih tepat, “ruang suci Bait Allah,” yaitu bangunan suci utama, bukan seluruh pelataran kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς
  choice: orang-orang
  rationale: Menunjuk secara kolektif kepada orang-orang yang berkumpul di luar; bentuk ini alami dalam bahasa Indonesia dan tidak menyiratkan seluruh bangsa.
- source_word: προσδοκῶν
  choice: sedang menantikan
  rationale: Bersama ἦν membentuk konstruksi imperfek perifrastis yang menggambarkan tindakan yang terus berlangsung.
- source_word: Ζαχαρίαν
  choice: Zakharia
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: ἐθαύμαζον
  choice: merasa heran
  rationale: Menyampaikan reaksi berkelanjutan berupa keheranan tanpa memperkuatnya secara berlebihan menjadi keterkejutan besar.
- source_word: ἐν τῷ χρονίζειν
  choice: karena ia begitu lama berada
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan bahwa lamanya waktu Zakharia di dalam menjadi alasan keheranan mereka, sambil mempertahankan nuansa duratif.
- source_word: ναῷ
  choice: Bait Allah
  rationale: Istilah yang mudah dipahami untuk bangunan suci, dengan catatan kaki yang menjelaskan bahwa ναός secara lebih tepat menunjuk ruang suci utama, bukan seluruh kompleks.
- source_word: αὐτόν
  choice: ia
  rationale: Pronomina akusatif ini berfungsi sebagai subjek infinitif χρονίζειν dan secara alami diterjemahkan dengan pronomina nominatif Indonesia.
theological_decisions: []
