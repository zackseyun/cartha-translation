id: LUK.1.80
reference: Luke 1:80
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: id
  text: Anak itu terus bertumbuh dan makin kuat dalam roh[a]. Ia tinggal di daerah-daerah padang belantara[b] sampai pada hari ketika ia tampil di hadapan bangsa Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "oleh Roh" atau "dalam Roh". Bahasa Yunani dapat menunjuk secara umum pada kekuatan batin atau rohani, atau secara khusus pada kekuatan yang berkaitan dengan Roh Kudus.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, "di tempat-tempat sunyi" atau "di daerah-daerah tandus"; bahasa Yunani memakai bentuk jamak.
    reason: lexical_alternative
  - marker: c
    text: Atau "sampai pada hari ketika ia dinyatakan kepada bangsa Israel".
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: anak itu
  rationale: Menunjuk kepada Yohanes semasa muda tanpa menentukan tahap usia secara lebih sempit.
- source_word: ηὔξανε
  choice: terus bertumbuh
  rationale: Bentuk imperfek menyatakan proses pertumbuhan yang berlangsung.
- source_word: ἐκραταιοῦτο
  choice: makin kuat
  rationale: Mengungkapkan proses berkelanjutan secara alami tanpa memastikan apakah bentuk Yunaninya harus dipahami pasif atau intransitif.
- source_word: πνεύματι
  choice: dalam roh
  rationale: Mempertahankan ungkapan umum bahasa Yunani dan tidak langsung membatasinya sebagai rujukan khusus kepada Roh Kudus.
- source_word: ἐν ταῖς ἐρήμοις
  choice: di daerah-daerah padang belantara
  rationale: Mempertahankan bentuk jamak dan cakupan tempat-tempat sunyi atau tandus tanpa menyempitkannya menjadi gurun pasir.
- source_word: ἀναδείξεως
  choice: tampil
  rationale: Dalam konteks ini menyatakan kemunculan atau penampilan di muka umum dengan bahasa Indonesia yang wajar.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: di hadapan bangsa Israel
  rationale: Menyatakan Israel sebagai khalayak yang menyaksikan kemunculan Yohanes; kata 'bangsa' memperjelas bahwa Israel di sini adalah umat, bukan wilayah.
theological_decisions:
- issue: Makna πνεύματι dalam perkembangan Yohanes
  choice: dalam roh
  alternative: oleh Roh / dalam Roh
  rationale: Teks Yunani tidak secara eksplisit menyebut Roh Kudus. Terjemahan utama mempertahankan kemungkinan makna kekuatan batin atau rohani, sedangkan kemungkinan rujukan kepada Roh Kudus dicatat tanpa dipastikan.
- issue: Nuansa ἀνάδειξις πρὸς τὸν Ἰσραήλ
  choice: tampil di hadapan bangsa Israel
  alternative: dinyatakan kepada bangsa Israel
  rationale: Pilihan utama menekankan kemunculan Yohanes di muka umum, sementara alternatif mempertahankan nuansa bahwa ia diperkenalkan atau dinyatakan kepada Israel.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Padang belantara' dipilih sebagai istilah geografis luas, bukan khusus gurun pasir. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
