id: LUK.1.77
reference: Luke 1:77
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: id
  text: untuk memberikan kepada umat-Nya pengetahuan tentang keselamatan dalam pengampunan dosa-dosa mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui pengampunan dosa-dosa mereka” atau “dengan pengampunan dosa-dosa mereka”.
    reason: Alternatif leksikal untuk nuansa ἐν yang dapat dipahami sebagai ranah, cara, atau sarana.
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: untuk memberikan
  rationale: Infinitif berartikel ini menyatakan tujuan yang bergantung pada ayat sebelumnya. Ungkapan “untuk memberikan” mempertahankan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: γνῶσιν σωτηρίας
  choice: pengetahuan tentang keselamatan
  rationale: γνῶσις berarti pengetahuan atau pemahaman, sedangkan genitif σωτηρίας paling alami diungkapkan dengan “tentang keselamatan” dalam bahasa Indonesia tanpa mempersempit maknanya.
- source_word: τῷ λαῷ αὐτοῦ
  choice: kepada umat-Nya
  rationale: Bentuk datif menandai penerima. “Umat-Nya” sesuai dengan nuansa kolektif dan perjanjian dari λαός dalam konteks ini.
- source_word: ἐν ἀφέσει
  choice: dalam pengampunan
  rationale: Terjemahan “dalam” mempertahankan keluasan makna ἐν, yang dapat menunjuk pada ranah atau cara, tanpa memaksakan hubungan instrumental atau kausal.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: dosa-dosa mereka
  rationale: Bentuk jamak ἁμαρτιῶν dipertahankan sebagai “dosa-dosa”, dan αὐτῶν merujuk kepada umat tersebut.
theological_decisions:
- issue: Hubungan keselamatan dengan pengampunan
  choice: Keselamatan dikenal dalam kaitannya dengan dan dinyatakan secara nyata dalam pengampunan dosa.
  alternative: Frasa itu dapat dipahami secara lebih instrumental sebagai “melalui pengampunan dosa-dosa mereka” atau “dengan pengampunan dosa-dosa mereka”.
  rationale: Frasa ἐν ἀφέσει memungkinkan beberapa nuansa yang berdekatan. “Dalam pengampunan” mempertahankan ketegangan dan keluasan hubungan teologis tersebut tanpa menetapkannya hanya sebagai sarana atau sebab.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Umat” dipilih daripada “rakyat” karena lebih alami dalam konteks umat milik Allah; kapital pada “-Nya” mengikuti kebiasaan penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia.
