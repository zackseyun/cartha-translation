  text: dan Ia telah membangkitkan bagi kita tanduk keselamatan dalam keturunan Daud, hamba-Nya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang Penyelamat yang perkasa.” Secara harfiah, “tanduk keselamatan,” sebuah gambaran Alkitab tentang kekuatan yang mendatangkan pembebasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: telah membangkitkan
  rationale: Aoristus menyatakan tindakan Allah yang dipuji sebagai telah terlaksana; 'membangkitkan' mempertahankan idiom Alkitab tentang Allah menghadirkan seorang pembebas.
- source_word: κέρας σωτηρίας
  choice: tanduk keselamatan
  rationale: Ungkapan ini mempertahankan metafora biblis tentang kekuatan dan kuasa yang mendatangkan kemenangan serta keselamatan, termasuk gema antarteks Perjanjian Lama.
- source_word: ἡμῖν
  choice: bagi kita
  rationale: Datif keuntungan menunjukkan bahwa tindakan penyelamatan itu dilakukan demi kepentingan kita.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: di dalam keluarga Daud
  rationale: '''Keluarga'' secara alami menyampaikan arti οἶκος sebagai garis keturunan atau wangsa, sedangkan ''di dalam'' mempertahankan preposisi Yunani tanpa menyiratkan bangunan fisik.'
- source_word: παιδὸς αὐτοῦ
  choice: hamba-Nya
  rationale: Dalam pemakaian biblis mengenai Daud, παῖς menunjuk kepada hamba Allah, bukan anak kecil.
theological_decisions:
- issue: Apakah metafora 'tanduk keselamatan' dipertahankan atau ditafsirkan sebagai gelar 'Penyelamat yang perkasa'
  choice: Mempertahankan metafora 'tanduk keselamatan' dalam teks utama
  alternative: seorang Penyelamat yang perkasa
  rationale: Metafora konkret Yunani berakar pada gambaran kerajaan dan kemenangan dalam Perjanjian Lama. Mempertahankannya menjaga bobot teologis dan kaitan antarteks tanpa mempersempit maknanya; padanan interpretatif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora asing dipertahankan karena penting secara biblis, lalu dijelaskan dalam catatan kaki; 'keluarga Daud' dipilih agar makna dinasti jelas bagi pembaca umum.
