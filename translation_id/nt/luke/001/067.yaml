  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: id
  text: 'Lalu Zakharia, ayahnya, dipenuhi Roh Kudus dan bernubuat, katanya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Menandai kelanjutan narasi secara alami dalam bahasa Indonesia tanpa membuat hubungan yang lebih kuat daripada teks Yunani.
- source_word: Ζαχαρίας
  choice: Zakharia
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ayah anak itu
  rationale: Pronomina αὐτοῦ merujuk kepada Yohanes yang baru disebut. Bentuk ini alami dan menghindari kemungkinan salah paham bahwa Zakharia adalah ayah dari tokoh lain yang lebih dekat secara tata bahasa dalam terjemahan.
- source_word: ἐπλήσθη
  choice: dipenuhi
  rationale: Mempertahankan bentuk pasif dan menggambarkan suatu peristiwa ketika Zakharia dikuasai atau diliputi oleh Roh Kudus.
- source_word: πνεύματος ἁγίου
  choice: dengan Roh Kudus
  rationale: Genitif sesudah πίμπλημι secara wajar dinyatakan dengan 'dengan'; konteks inspirasi ilahi dalam Lukas menunjuk kepada Roh Allah.
- source_word: ἐπροφήτευσεν
  choice: bernubuat
  rationale: Padanan langsung dan lazim untuk προφητεύω yang mempertahankan sifat profetis dari ujaran berikutnya.
- source_word: λέγων
  choice: katanya
  rationale: Memperkenalkan isi nubuat dengan ungkapan Indonesia yang alami dan tetap mencerminkan fungsi partisipel Yunani.
theological_decisions:
- issue: Rujukan πνεύματος ἁγίου
  choice: Roh Kudus
  alternative: roh yang kudus
  rationale: Dalam konteks Lukas tentang ilham ilahi, ungkapan ini merujuk kepada Roh Allah. Kapitalisasi menunjukkan nama/sebutan referensial tanpa menambahkan rincian doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum, sementara bentuk pasif, kesinambungan narasi, dan daya profetis teks sumber dipertahankan.
