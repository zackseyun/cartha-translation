  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: id
  text: “Terpujilah Tuhan, Allah Israel, sebab Ia telah melawat[a] umat-Nya dan mendatangkan penebusan bagi mereka,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “datang menolong”; kata Yunani yang diterjemahkan “melawat” merupakan ungkapan alkitabiah untuk campur tangan Allah yang penuh perhatian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Terpujilah
  rationale: Dalam seruan berkat atau pujian kepada Allah, bentuk ini alami dan khidmat dalam bahasa Indonesia serta mempertahankan daya doksologis kata sifat predikatif Yunani.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar ilahi ini merujuk kepada Allah Israel dan mempertahankan gema Kitab Suci serta penggunaan Perjanjian Baru.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: Allah Israel
  rationale: Ungkapan baku ini mempertahankan hubungan aposisional dengan 'Tuhan' dan menunjuk kepada Allah umat perjanjian.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pujian; 'sebab' jelas, alami, dan sesuai dengan laras pujian yang khidmat.
- source_word: ἐπεσκέψατο
  choice: telah melawat
  rationale: '''Melawat'' mempertahankan idiom alkitabiah tentang kedatangan Allah yang penuh perhatian dan tindakan penyelamatan, tanpa mempersempitnya menjadi satu bentuk pertolongan tertentu.'
- source_word: ἐποίησεν λύτρωσιν
  choice: mendatangkan penebusan
  rationale: Secara harfiah ungkapan ini berarti 'membuat/mengerjakan penebusan'. 'Mendatangkan penebusan' alami dalam bahasa Indonesia dan mempertahankan tindakan beserta hasilnya tanpa menjadi kaku.
- source_word: λύτρωσιν
  choice: penebusan
  rationale: Kata ini menjaga bobot teologis dan nuansa pembebasan melalui pembayaran harga yang terkandung dalam istilah Yunani; 'pembebasan' mungkin, tetapi kurang mempertahankan kaitan leksikal tersebut.
- source_word: τῷ λαῷ αὐτοῦ
  choice: bagi umat-Nya
  rationale: Dativus ini paling wajar dipahami sebagai penerima manfaat. 'Bagi umat-Nya' jelas menyatakan bahwa umat Allah menerima manfaat dari tindakan penebusan tersebut.
theological_decisions:
- issue: Bahasa tentang lawatan ilahi
  choice: telah melawat
  alternative: telah datang menolong
  rationale: Teks menyatakan campur tangan Allah yang menyelamatkan dengan bahasa perjanjian. Terjemahan mempertahankan metafora alkitabiah 'melawat' dan tidak membatasinya pada parafrasa penjelas yang lebih sempit.
- issue: Makna λύτρωσις
  choice: penebusan
  alternative: pembebasan
  rationale: '''Penebusan'' mempertahankan keluasan makna keselamatan sekaligus kemungkinan nuansa harga tebusan; menerjemahkannya hanya sebagai ''pembebasan'' dapat melemahkan hubungan konseptual itu.'
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. 'Terpujilah' dan 'melawat' mempertahankan corak pujian serta gema alkitabiah, sementara susunan klausa tetap alami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
