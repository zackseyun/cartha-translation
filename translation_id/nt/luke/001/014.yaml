id: LUK.1.14
reference: Luke 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: id
  text: Engkau akan mengalami sukacita dan kegirangan, dan banyak orang akan bersukacita atas kelahirannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu ia lahir.” Frasa Yunani ini dapat menunjukkan peristiwa yang menjadi kesempatan untuk bersukacita atau alasan untuk bersukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται ... σοι
  choice: Engkau akan mengalami
  rationale: Ungkapan yang alami dalam bahasa Indonesia untuk menyatakan bahwa sukacita itu akan menjadi bagian atau pengalaman Zakharia, tanpa mengubah makna datif σοι.
- source_word: χαρά
  choice: sukacita
  rationale: Padanan baku dan bermartabat untuk kegembiraan yang mendalam.
- source_word: ἀγαλλίασις
  choice: kegirangan
  rationale: Mempertahankan pembedaan dari χαρά dan menyampaikan nuansa kegembiraan yang kuat serta meluap.
- source_word: πολλοὶ
  choice: banyak orang
  rationale: Bentuk adjektiva substantival ini paling jelas dan alami bila unsur 'orang' dinyatakan dalam bahasa Indonesia.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: atas kelahirannya
  rationale: ἐπί dengan datif dapat menunjuk dasar atau peristiwa yang menimbulkan sukacita; 'atas kelahirannya' alami dan tetap cukup terbuka terhadap kedua nuansa itu.
- source_word: χαρήσονται
  choice: akan bersukacita
  rationale: Menyampaikan bentuk futur dan mempertahankan kaitan leksikal dengan χαρά.
theological_decisions:
- issue: Hubungan ἐπὶ τῇ γενέσει αὐτοῦ dengan tindakan bersukacita
  choice: atas kelahirannya
  alternative: pada waktu ia lahir
  rationale: Bahasa Yunani dapat menunjuk kelahiran itu sebagai dasar sukacita atau sebagai peristiwa yang menyertainya; teks utama memakai ungkapan alami yang dapat menyiratkan dasar, sedangkan catatan kaki mempertahankan pembacaan temporal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kegirangan' dipakai untuk membedakan ἀγαλλίασις dari χαρά tanpa memakai ungkapan yang terlalu teknis atau bercorak denominasi.
