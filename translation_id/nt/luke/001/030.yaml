  source_fidelity: 'Teks secara setia menerjemahkan seluruh unsur Yunani: καὶ sebagai “Lalu,” ὁ ἄγγελος sebagai “malaikat itu,” αὐτῇ sebagai “kepadanya,” larangan Μὴ φοβοῦ sebagai “Jangan takut,” Μαριάμ sebagai “Maria,” serta εὗρες χάριν παρὰ τῷ θεῷ sebagai “engkau telah mendapat perkenanan di hadapan Allah.” “Telah mendapat” wajar untuk aoris dalam pengumuman ini dan menyampaikan keadaan yang kini berlaku. “Di hadapan Allah” menangkap daya idiomatis παρά + datif dalam konstruksi ‘mendapat perkenanan.’'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada naratif-khidmat tanpa menjadi arkais. “Jangan takut, Maria” sangat alami. Penggunaan “engkau” cocok untuk sapaan tunggal yang bermartabat dalam narasi Alkitab. Frasa “mendapat perkenanan di hadapan Allah” dapat dipahami dan lazim dalam register ini.
  terminology: “Malaikat,” “Maria,” dan “Allah” konsisten dengan penggunaan Alkitab Indonesia yang baku. “Perkenanan” secara tepat menyampaikan χάρις dalam idiom εὑρίσκω χάριν παρά + datif, tanpa membatasi maknanya pada rumusan teologis tertentu. Catatan kaki secara memadai mencatat alternatif leksikal “kasih karunia” dan menjelaskan alasan pilihan utama.
