id: LUK.1.30
reference: Luke 1:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: id
  text: Lalu malaikat itu berkata kepadanya, “Jangan takut, Maria, sebab engkau telah mendapat perkenanan[a] di hadapan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih karunia.” Kata Yunani χάρις dapat berarti “kasih karunia” atau “perkenanan”; dalam ungkapan “mendapat perkenanan di hadapan Allah,” arti “perkenanan” paling sesuai dengan idiom di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: berkata
  rationale: Bentuk aoris naratif dari λέγω secara alami diterjemahkan sebagai “berkata” untuk memperkenalkan ucapan langsung.
- source_word: ἄγγελος
  choice: malaikat
  rationale: Dalam kisah kelahiran di Lukas, yang dimaksud ialah makhluk surgawi, sehingga “malaikat” lebih tepat daripada istilah umum “utusan”.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Larangan ini diungkapkan secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: Μαριάμ
  choice: Maria
  rationale: Nama tersebut memakai bentuk yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: εὗρες
  choice: telah mendapat
  rationale: Aoris ini menyatakan bahwa Maria kini berada dalam keadaan sebagai orang yang telah memperoleh perkenanan; “telah mendapat” menyampaikan hasil yang masih berlaku tanpa memaksakan idiom Yunani secara harfiah.
- source_word: χάριν
  choice: perkenanan
  rationale: Dalam ungkapan εὑρίσκω χάριν παρά, kata ini menunjuk pada sikap baik atau perkenanan dari seseorang. “Perkenanan” mempertahankan nuansa relasional tanpa memasukkan rumusan teologis yang lebih kemudian.
- source_word: παρὰ τῷ θεῷ
  choice: di hadapan Allah
  rationale: Dengan παρά dan datif sesudah ungkapan “mendapat perkenanan,” frasa ini berarti mendapat perkenanan dalam pandangan atau hadirat Allah.
theological_decisions:
- issue: Penerjemahan χάριν dalam konteks Maria
  choice: perkenanan
  alternative: kasih karunia
  rationale: Ungkapan Yunani εὑρίσκω χάριν παρά + datif lazim berarti “mendapat perkenanan di hadapan.” Pilihan “perkenanan” menyampaikan makna idiomatis ayat ini sambil tetap mencatat bahwa χάρις juga dapat diterjemahkan “kasih karunia,” tanpa menjadikan ayat ini penentu bagi rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Lalu” mengalir alami dalam narasi; “engkau” mempertahankan sapaan tunggal yang khidmat. Istilah “perkenanan” cukup umum untuk dipahami dan cocok dengan konteks relasional.
