  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: id
  text: Penabur itu keluar untuk menaburkan benihnya. Ketika ia sedang menabur, sebagian benih jatuh di pinggir jalan, lalu terinjak-injak, dan burung-burung di langit[a] memakannya sampai habis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "burung-burung di udara." Secara harfiah, "burung-burung dari langit."
    reason: alternatif_leksikal
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: keluar
  rationale: Bentuk aoris ἐξέρχομαι secara alami menyatakan bahwa penabur itu pergi keluar; dalam bahasa Indonesia, 'keluar' ringkas dan wajar.
- source_word: ὁ σπείρων
  choice: penabur itu
  rationale: Partisipel berartikel ini berfungsi sebagai nomina. 'Penabur' merupakan padanan alami dalam konteks perumpamaan, sedangkan 'itu' menandai kekhususan yang dibawa artikel Yunani.
- source_word: τοῦ σπεῖραι
  choice: untuk menaburkan
  rationale: Infinitif genitif berartikel setelah verba gerak menyatakan tujuan. 'Untuk menaburkan' menyampaikan fungsi tersebut dengan jelas.
- source_word: τὸν σπόρον αὐτοῦ
  choice: benihnya
  rationale: σπόρος dalam konteks pertanian berarti benih atau biji untuk ditabur. 'Benihnya' alami dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: ketika ia sedang menabur
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan tindakan yang berlangsung bersamaan. Ungkapan ini mempertahankan aspek duratifnya dalam bahasa Indonesia.
- source_word: ὃ μὲν
  choice: sebagian benih
  rationale: Bentuk netral tunggal ini menunjuk secara distributif pada satu bagian dari benih. Nomina 'benih' diulangi agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: jatuh di pinggir jalan
  rationale: παρά dengan akusatif di sini menunjukkan lokasi di sisi jalan. 'Di pinggir jalan' merupakan ungkapan Indonesia yang alami dan konkret.
- source_word: κατεπατήθη
  choice: terinjak-injak
  rationale: Bentuk pasif καταπατέω berarti diinjak atau dipijak. 'Terinjak-injak' menyampaikan tindakan berulang atau menyeluruh tanpa perlu menambahkan pelaku.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: burung-burung di langit
  rationale: πετεινά menunjuk pada burung, sedangkan τοῦ οὐρανοῦ secara harfiah berkaitan dengan langit. 'Burung-burung di langit' mempertahankan citra sumber dan terdengar alami.
- source_word: κατέφαγεν αὐτό
  choice: memakannya sampai habis
  rationale: κατεσθίω menyatakan makan dengan tuntas atau melahap. 'Memakannya sampai habis' jelas bagi pembaca umum dan mempertahankan daya intensif verba tersebut.
