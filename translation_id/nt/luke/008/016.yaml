id: LUK.8.16
reference: Luke 8:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: id
  text: Tidak seorang pun, setelah menyalakan pelita, menutupinya dengan wadah atau menaruhnya di bawah tempat tidur. Sebaliknya, ia menaruhnya di atas dudukan pelita supaya orang-orang yang masuk dapat melihat cahayanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: pelita
  rationale: Merujuk pada lampu minyak kecil pada zaman itu; “pelita” alami dan tepat secara historis dalam bahasa Indonesia.
- source_word: σκεύει
  choice: wadah
  rationale: Istilah Yunani ini bersifat umum dan dapat berarti berbagai jenis bejana atau perkakas; “wadah” mempertahankan keluasan maknanya.
- source_word: κλίνης
  choice: tempat tidur
  rationale: Padanan modern yang jelas untuk perabot yang dimaksud, tanpa mempersempitnya menjadi jenis ranjang tertentu.
- source_word: λυχνίας
  choice: kaki pelita
  rationale: Menunjuk penyangga atau tempat pelita diletakkan agar cahayanya tersebar; istilah ini lazim dalam ragam Alkitab bahasa Indonesia dan berbeda jelas dari pelita itu sendiri.
- source_word: τὸ φῶς
  choice: cahayanya
  rationale: Akhiran posesif memperjelas secara alami bahwa yang terlihat adalah cahaya pelita, sesuai konteks tanpa menambah gagasan baru.
theological_decisions:
- issue: Fungsi perumpamaan tentang pelita
  choice: Ayat diterjemahkan sebagai gambaran umum tanpa menyisipkan identifikasi teologis atas pelita atau cahaya.
  alternative: Menjelaskan pelita atau cahaya secara eksplisit sebagai firman, kesaksian, atau wahyu.
  rationale: Teks ayat ini sendiri membiarkan penerapan gambaran ditentukan oleh konteks; terjemahan tidak boleh menyelesaikan implikasi teologis yang tidak dinyatakan langsung.
- issue: Partikel δέ
  choice: Hubungan kontras dinyatakan secara alami melalui “Sebaliknya” pada klausa kedua, tanpa membuka ayat dengan “Sekarang”.
  alternative: Mengawali ayat dengan “Namun” atau “Sekarang”.
  rationale: δέ menandai perkembangan atau kontras wacana, bukan kata waktu. Dalam bahasa Indonesia, kontras utama paling alami dinyatakan pada pertentangan antara menyembunyikan dan menaruh pelita di atas kaki pelita.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dipecah menjadi dua agar mudah dibaca, sambil mempertahankan urutan logis teks Yunani: menyalakan, tidak menyembunyikan, menempatkan dengan benar, lalu tujuan agar cahaya terlihat.'
