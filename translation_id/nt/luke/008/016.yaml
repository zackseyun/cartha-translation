  to: Tidak seorang pun, setelah menyalakan pelita, menutupinya dengan wadah atau menaruhnya di bawah tempat tidur. Sebaliknya, ia menaruhnya di atas dudukan pelita supaya orang-orang yang masuk dapat melihat cahayanya.
