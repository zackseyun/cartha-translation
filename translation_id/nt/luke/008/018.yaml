id: LUK.8.18
reference: Luke 8:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: id
  text: Karena itu, perhatikanlah bagaimana kamu mendengarkan. Sebab siapa yang mempunyai, kepadanya akan diberikan lebih banyak; dan siapa yang tidak mempunyai, bahkan apa yang ia kira ia miliki[a] akan diambil darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang tampaknya ia miliki.”
    reason: δοκέω dapat menunjuk pada apa yang dipikirkan seseorang atau pada apa yang tampak demikian.
lexical_decisions:
- source_word: βλέπετε
  choice: perhatikanlah
  rationale: Bentuk perintah ini menyerukan kewaspadaan dan perhatian yang sungguh-sungguh, bukan tindakan melihat secara harfiah.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari ajaran sebelumnya tentang mendengar dan menanggapi firman.
- source_word: πῶς ἀκούετε
  choice: bagaimana kamu mendengarkan
  rationale: πῶς menekankan cara atau sikap dalam mendengar, sedangkan ἀκούετε dalam konteks ini mencakup tindakan menyimak secara aktif.
- source_word: ὃς ἂν ... ἔχῃ
  choice: siapa yang mempunyai
  rationale: Konstruksi relatif tak tentu ini menyatakan prinsip umum dan tetap mempertahankan objek yang tidak disebutkan secara eksplisit dalam bahasa Yunani.
- source_word: δοθήσεται αὐτῷ
  choice: kepadanya akan diberikan lebih banyak
  rationale: Bahasa Yunani tidak menyebutkan objek, tetapi paralelisme kalimat menyiratkan penambahan; 'lebih banyak' membuat ungkapan tersebut wajar dan jelas dalam bahasa Indonesia.
- source_word: ὃ δοκεῖ ἔχειν
  choice: apa yang ia kira ia miliki
  rationale: δοκέω dapat berarti 'mengira' atau 'tampak'. Pilihan ini menonjolkan anggapan orang tersebut tanpa meniadakan kemungkinan arti alternatif.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: akan diambil darinya
  rationale: Bentuk pasif mendatang dari αἴρω di sini menyatakan pencabutan atau hilangnya sesuatu dari seseorang.
theological_decisions:
- issue: Makna pepatah tentang orang yang mempunyai dan yang tidak mempunyai
  choice: Dibiarkan sebagai prinsip paradoksal yang dalam konteks langsung berkaitan dengan cara menerima dan menanggapi perkataan Yesus.
  alternative: Menafsirkannya secara khusus sebagai ajaran tentang predestinasi, jasa, kemakmuran materi, atau penatalayanan.
  rationale: Ayat ini sendiri tidak menentukan salah satu sistem teologis tersebut. Terjemahan mempertahankan ketegangan dan keluasan ungkapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kamu' mempertahankan sapaan langsung kepada para pendengar tanpa menambahkan pembedaan jumlah yang tidak tersedia secara alami dalam bahasa Indonesia.
