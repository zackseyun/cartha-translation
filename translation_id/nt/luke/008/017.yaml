id: LUK.8.17
reference: Luke 8:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: id
  text: Sebab tidak ada sesuatu pun yang tersembunyi yang tidak akan dinyatakan, dan tidak ada sesuatu pun yang dirahasiakan yang tidak akan diketahui dan tersingkap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “masuk ke dalam keadaan terbuka”; dapat juga diterjemahkan “menjadi nyata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: tersembunyi
  rationale: Kata ini menunjuk pada sesuatu yang disembunyikan atau tidak tampak; “tersembunyi” merupakan padanan Indonesia yang alami dan berlawanan jelas dengan “dinyatakan”.
- source_word: φανερὸν γενήσεται
  choice: akan dinyatakan
  rationale: Ungkapan ini menggambarkan perubahan keadaan dari tersembunyi menjadi nyata atau terbuka. Bentuk pasif alami dalam bahasa Indonesia menyampaikan hasil tersebut tanpa menambahkan pelaku.
- source_word: ἀπόκρυφον
  choice: dirahasiakan
  rationale: Pilihan ini membedakannya sedikit dari κρυπτόν sambil mempertahankan kesejajaran erat antara kedua klausa.
- source_word: οὐ μὴ γνωσθῇ
  choice: tidak akan diketahui
  rationale: Dalam konstruksi relatif negatif yang lebih besar, padanan ini menyatakan bahwa tidak ada rahasia yang akan tetap tidak diketahui; kekuatan negasi Yunaninya tetap terbaca dari susunan kalimat.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: tersingkap
  rationale: Kata ini secara alami mengungkapkan bahwa sesuatu menjadi terbuka atau diketahui, serta menghindari terjemahan harfiah yang kaku.
- source_word: γάρ
  choice: Sebab
  rationale: Kata penghubung ini mempertahankan fungsi ayat sebagai alasan atau penjelasan bagi perkataan sebelumnya.
theological_decisions:
- issue: Cakupan pernyataan tentang penyingkapan
  choice: Dibiarkan sebagai prinsip umum bahwa yang tersembunyi atau dirahasiakan pada akhirnya akan dinyatakan.
  alternative: Membatasinya secara khusus pada penghakiman terakhir atau hanya pada tersingkapnya ajaran Yesus dalam konteks langsung.
  rationale: Ayat itu sendiri tidak menetapkan waktu atau lingkup penyingkapan secara khusus. Terjemahan tidak mempersempit ketegangan dan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Pengulangan “tidak ada sesuatu pun” mempertahankan kesejajaran dan daya tekan teks Yunani; satu catatan kaki menjelaskan idiom penutup tanpa membebani teks utama.
