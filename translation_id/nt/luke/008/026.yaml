source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: id
  text: Lalu mereka berlayar ke wilayah orang Gerasa[a], yang terletak di seberang Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah dan bagian paralel dalam Injil berbunyi “orang Gadara” atau “orang Gergesa.”
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: berlayar ke
  rationale: Kata kerja ini menyatakan perjalanan melalui air menuju suatu tempat, sering dengan gagasan tiba menggunakan kapal. Dalam bahasa Indonesia, 'berlayar ke' menyampaikan gerak menuju tujuan secara alami tanpa memaksakan nuansa arah 'turun' yang tidak idiomatis di sini.
- source_word: χώραν
  choice: wilayah
  rationale: '''Wilayah'' dengan tepat menunjuk suatu kawasan atau daerah dan tidak menimbulkan kesan negara modern.'
- source_word: Γερασηνῶν
  choice: orang Gerasa
  rationale: Bentuk Yunani ini adalah sebutan bagi penduduk Gerasa. 'Orang Gerasa' alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan nama tempat tersebut.
- source_word: ἥτις ἐστὶν
  choice: yang terletak
  rationale: Ungkapan ini memperkenalkan keterangan tentang wilayah tersebut. 'Yang terletak' menghasilkan bahasa Indonesia yang alami tanpa menambahkan makna teologis atau geografis.
- source_word: ἀντιπέρα
  choice: di seberang
  rationale: Kata ini berarti berhadapan atau berada di seberang. 'Di seberang' paling alami untuk letak geografis pada sisi lain dan mempertahankan relasi spasial yang dimaksud.
- source_word: Γαλιλαίας
  choice: Galilea
  rationale: Bentuk nama tempat yang baku dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Perbedaan tekstual dan geografis pada nama tempat dalam tradisi Injil Sinoptik
  choice: orang Gerasa
  alternative: orang Gadara atau orang Gergesa
  rationale: Teks SBLGNT berbunyi Γερασηνῶν, sehingga teks utama mengikuti bacaan 'orang Gerasa'. Bacaan lain dipertahankan dalam catatan kaki demi transparansi dan tidak diselaraskan secara diam-diam dengan naskah atau bagian paralel.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Lalu' menghubungkan ayat ini dengan narasi sebelumnya; 'berlayar ke' jelas dan idiomatis; catatan varian ditempatkan tepat sesudah nama yang dipersoalkan.
