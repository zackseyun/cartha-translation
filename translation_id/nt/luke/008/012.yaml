id: LUK.8.12
reference: Luke 8:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: id
  text: Adapun yang di pinggir jalan adalah orang-orang yang telah mendengar. Kemudian Iblis datang dan mengambil firman itu[a] dari hati mereka, supaya mereka tidak percaya dan diselamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Firman'' di sini berarti pesan Allah yang diberitakan dalam perumpamaan ini.'
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: di pinggir jalan
  rationale: Ungkapan ini mempertahankan gambaran letak di sisi jalan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἀκούσαντες
  choice: telah mendengar
  rationale: Partisip aoris menunjuk kepada orang-orang yang sudah mendengar pesan tersebut; bentuk 'telah mendengar' menyatakan tindakan yang mendahului kedatangan Iblis.
- source_word: εἶτα
  choice: kemudian
  rationale: Menandai urutan tindakan secara langsung dan wajar.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada pribadi jahat tertentu; 'Iblis' adalah padanan baku dan jelas dalam bahasa Indonesia.
- source_word: αἴρει
  choice: mengambil
  rationale: Kata ini berarti mengambil atau menyingkirkan. 'Mengambil' mempertahankan tindakan tersebut tanpa menambahkan gambaran kekerasan yang tidak dinyatakan oleh teks.
- source_word: τὸν λόγον
  choice: firman itu
  rationale: Dalam perumpamaan ini λόγος adalah firman Allah yang diberitakan (bdk. ayat 11). 'Firman' mempertahankan ungkapan Alkitab yang lazim, sedangkan 'itu' mengacu kembali kepada pesan yang telah disebutkan.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: dari hati mereka
  rationale: Bentuk jamak pronomina dipertahankan dengan 'mereka'; 'hati' meliputi pusat pikiran, kehendak, dan tanggapan manusia tanpa mempersempit maknanya menjadi akal saja.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: supaya mereka tidak percaya dan diselamatkan
  rationale: '''Supaya'' mempertahankan nuansa tujuan yang paling langsung dari ἵνα μή. Partisip πιστεύσαντες diterjemahkan secara alami sebagai tindakan yang dikoordinasikan dengan ''diselamatkan'', tanpa menguraikan hubungan teologisnya lebih jauh.'
- source_word: πιστεύσαντες
  choice: percaya
  rationale: '''Percaya'' merupakan padanan langsung dan lazim bagi πιστεύω dalam konteks tanggapan terhadap firman Allah.'
- source_word: σωθῶσιν
  choice: diselamatkan
  rationale: Bentuk pasif dipertahankan. Dalam konteks Lukas, kata ini menunjuk kepada keselamatan dalam arti penebusan, bukan sekadar pertolongan sementara.
theological_decisions:
- issue: Hubungan antara percaya dan diselamatkan
  choice: percaya dan diselamatkan
  alternative: menafsirkan hubungan itu secara eksplisit sebagai rumusan kausal, urutan keselamatan tertentu, atau jenis iman tertentu
  rationale: Teks Yunani menyatakan tujuan tindakan Iblis, yaitu mencegah orang percaya dan diselamatkan. Terjemahan mempertahankan pernyataan tersebut tanpa menyelesaikan perdebatan teologis yang lebih luas.
- issue: Nuansa ἵνα μή
  choice: supaya ... tidak
  alternative: sehingga ... tidak; agar jangan sampai
  rationale: '''Supaya ... tidak'' menyampaikan tujuan tindakan Iblis secara alami, sambil tidak menambahkan penjelasan tentang kehendak ilahi atau kepastian hasil tindakan itu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Adapun yang di pinggir jalan' mempertahankan bentuk penjelasan perumpamaan tanpa menambahkan kata 'benih' atau 'menggambarkan' yang tidak dinyatakan secara eksplisit dalam ayat ini. Kapitalisasi 'Iblis' mengikuti pemakaian bahasa Indonesia bagi nama sebutan pribadi tertentu.
