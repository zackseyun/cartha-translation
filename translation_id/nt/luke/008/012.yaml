  source_fidelity: 'Terjemahan dengan setia menyampaikan struktur dan makna Yunani: kelompok ‘di pinggir jalan’ diidentifikasi sebagai mereka yang telah mendengar; Iblis kemudian mengambil firman dari hati mereka dengan tujuan agar mereka tidak percaya dan diselamatkan. Bentuk tujuan ἵνα μή dipertahankan oleh ‘supaya ... tidak’, tanpa mengubahnya menjadi penjelasan kausal atau doktrinal.'
  naturalness: Bahasa Indonesia baku, modern, dan mengalir. ‘Adapun yang di pinggir jalan adalah orang-orang yang telah mendengar’ sesuai dengan gaya penjelasan perumpamaan. ‘Dari hati mereka’ adalah ungkapan Indonesia yang wajar dan tidak perlu dipaksakan menjadi bentuk jamak ‘dari hati-hati mereka’.
  terminology: ‘Iblis’, ‘firman’, ‘hati’, ‘percaya’, dan ‘diselamatkan’ merupakan padanan yang lazim, jelas, dan sesuai konteks. ‘Firman itu’ tepat sebagai rujukan kepada pesan Allah dalam penjelasan perumpamaan.
