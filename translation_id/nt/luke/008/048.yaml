  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Anak perempuan, imanmu telah menyelamatkanmu.[a] Pergilah dalam damai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah menyembuhkanmu” atau “telah membuatmu pulih.” Kata kerja Yunani ini dapat merujuk pada kesembuhan maupun penyelamatan.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Anak-Ku
  rationale: Sapaan harfiah ini berarti ‘anak perempuan’, tetapi dalam konteks sapaan penuh kasih, ‘Anak-Ku’ lebih alami dalam bahasa Indonesia dan tetap mempertahankan kelembutan serta nuansa relasionalnya.
- source_word: πίστις
  choice: iman
  rationale: ‘Iman’ mempertahankan istilah teologis yang luas; dalam konteks ini kata tersebut menunjuk pada kepercayaan perempuan itu kepada Yesus.
- source_word: σέσωκέν
  choice: telah menyelamatkan
  rationale: Bentuk perfektum dari σῴζω dapat mencakup penyelamatan sekaligus pemulihan atau kesembuhan. Pilihan ini mempertahankan keluasan makna, sedangkan arti kesembuhan dijelaskan dalam catatan kaki.
- source_word: πορεύου
  choice: Pergilah
  rationale: Imperatif ini diterjemahkan secara alami dan bermartabat sebagai perintah untuk pergi.
- source_word: εἰς εἰρήνην
  choice: dalam damai
  rationale: Ungkapan ini menyampaikan bahwa ia pergi dalam keadaan dan berkat damai, dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai peralihan ringan sekaligus kontras dengan ketakutan dan pengakuan perempuan itu dalam konteks sebelumnya.
theological_decisions:
- issue: Cakupan makna σῴζω dalam konteks penyembuhan
  choice: telah menyelamatkanmu
  alternative: telah menyembuhkanmu; telah membuatmu pulih
  rationale: Konteksnya jelas mencakup kesembuhan jasmani, tetapi σῴζω memiliki cakupan lebih luas daripada kesembuhan saja. Terjemahan utama mempertahankan kemungkinan makna penyelamatan yang lebih menyeluruh, sementara nuansa medis dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama ‘Yesus’ dinyatakan untuk memperjelas subjek pronominal dalam kutipan ayat tunggal. Sapaan ‘Anak-Ku’ menghindari kekakuan ‘Anak perempuan’ tanpa menghilangkan kelembutan sapaan asli.
