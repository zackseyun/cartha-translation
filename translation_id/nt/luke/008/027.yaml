  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: id
  text: Ketika Yesus turun ke darat,[a] seorang laki-laki dari kota itu yang kerasukan setan-setan[b] menemui-Nya. Sudah cukup lama laki-laki itu tidak mengenakan pakaian dan tidak tinggal di rumah, melainkan di antara makam-makam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Ia menginjakkan kaki di darat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang mempunyai setan-setan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: Ketika Yesus turun ke darat
  rationale: Konstruksi partisip datif ini bersifat temporal dan merujuk kepada Yesus. Ungkapan Indonesia ini secara alami menyampaikan bahwa Ia keluar dari perahu menuju daratan tanpa mempersempit γῆ menjadi pantai.
- source_word: ὑπήντησεν
  choice: menemui-Nya
  rationale: Kata kerja ini menyatakan perjumpaan langsung. 'Menemui-Nya' wajar dalam narasi Indonesia dan dapat menyiratkan gerakan laki-laki itu untuk berjumpa dengan Yesus.
- source_word: ἀνήρ τις
  choice: seorang laki-laki
  rationale: ἀνήρ secara khusus berarti laki-laki, sedangkan τις memberi makna tak tentu. Bahasa Indonesia sudah mengungkapkan keduanya secara alami melalui 'seorang laki-laki' tanpa perlu menambahkan 'tertentu'.
- source_word: ἐκ τῆς πόλεως
  choice: dari kota itu
  rationale: Frasa ini menunjukkan asal atau keterkaitan laki-laki tersebut dengan kota yang telah disebut dalam konteks. 'Kota itu' lebih alami daripada sekadar 'kota' dalam bahasa Indonesia.
- source_word: ἔχων δαιμόνια
  choice: yang kerasukan roh-roh jahat
  rationale: Secara harfiah frasa ini berarti 'mempunyai roh-roh jahat', tetapi ungkapan itu dapat keliru dipahami sebagai kepemilikan. 'Kerasukan roh-roh jahat' menyampaikan maksud konteks secara alami; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: χρόνῳ ἱκανῷ
  choice: Sudah cukup lama
  rationale: Datif ini menyatakan durasi yang cukup panjang. 'Sudah cukup lama' adalah padanan Indonesia yang alami dan tetap mencerminkan ἱκανῷ tanpa melebihkannya.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: tidak mengenakan pakaian
  rationale: Bentuk medial ἐνδύω berarti mengenakan pakaian. Ungkapan ini jelas, alami, dan mempertahankan gambaran tindakan dalam teks Yunani.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: tidak tinggal di rumah
  rationale: Imperfek ἔμενεν menggambarkan kebiasaan atau keadaan berkelanjutan. 'Tidak tinggal di rumah' mempertahankan keluasan makna μένω tanpa menegaskan status tempat tinggal permanen.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: melainkan di antara makam-makam
  rationale: μνήματα adalah tempat-tempat pemakaman atau makam. 'Di antara makam-makam' alami dalam bahasa Indonesia dan cocok dengan lingkungan pekuburan yang dimaksud.
theological_decisions:
- issue: Padanan δαιμόνια dalam konteks penindasan adikodrati
  choice: roh-roh jahat
  alternative: demon-demon
  rationale: δαιμόνια berbeda dari ungkapan Yunani 'roh-roh najis', tetapi 'roh-roh jahat' merupakan padanan Indonesia yang lazim dan mudah dipahami bagi makhluk adikodrati jahat. 'Demon-demon' kurang alami dalam ragam Alkitab Indonesia modern.
- issue: Cara menerjemahkan ἔχων δαιμόνια
  choice: yang kerasukan roh-roh jahat
  alternative: yang mempunyai roh-roh jahat
  rationale: Bentuk harfiah 'mempunyai' dapat menyiratkan bahwa laki-laki itu memiliki atau menguasai roh-roh tersebut, kebalikan dari keadaan dalam konteks. Terjemahan utama memakai idiom Indonesia yang jelas, sedangkan catatan kaki menjaga bentuk dan ketegangan leksikal teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama 'Yesus' dipakai untuk memperjelas acuan pronomina dalam konstruksi pembuka, sedangkan 'laki-laki itu' menghindari ambiguitas pada kalimat kedua. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
