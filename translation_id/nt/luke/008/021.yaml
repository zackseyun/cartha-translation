  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: id
  text: Ia menjawab dan berkata kepada mereka, “Ibu-Ku dan saudara-saudara-Ku[a] adalah mereka yang[b] mendengar firman Allah dan melakukannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara-saudara laki-laki-Ku.” Teks Yunani memakai bentuk maskulin jamak yang secara harfiah berarti “saudara-saudara laki-laki,” walaupun penerapan pernyataan ini tidak harus terbatas pada laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka inilah yang.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: Namun, Dia menjawab mereka
  rationale: Partikel δέ diterjemahkan dengan “Namun” untuk menandai kontras. Ungkapan naratif ἀποκριθεὶς εἶπεν diringkas menjadi “menjawab” karena “menjawab dan berkata” terasa kaku dalam bahasa Indonesia, sedangkan penerima πρὸς αὐτούς tetap dinyatakan sebagai “mereka”.
- source_word: Μήτηρ μου
  choice: Ibu-Ku
  rationale: Terjemahan langsung untuk nomina tunggal dengan pronomina posesif; bentuk “-Ku” sesuai dengan ujaran langsung Yesus.
- source_word: ἀδελφοί μου
  choice: saudara-saudara laki-laki-Ku
  rationale: Bentuk maskulin jamak Yunani diterjemahkan secara eksplisit sebagai saudara laki-laki, sekaligus menjaga kaitannya dengan kerabat biologis Yesus yang disebut dalam konteks.
- source_word: οὗτοί εἰσιν οἱ
  choice: adalah mereka yang
  rationale: Ungkapan ini menyampaikan identifikasi yang tegas tetapi tetap alami dalam bahasa Indonesia; daya tunjuk οὗτοι tidak diubah menjadi konstruksi yang kaku.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: “Firman Allah” adalah padanan Indonesia yang alami dan sarat resonansi teologis bagi λόγος dalam konteks pesan atau pengajaran yang berasal dari Allah.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: yang mendengar ... dan melakukannya
  rationale: Kedua partisipel kini menggambarkan ciri berkelanjutan kelompok tersebut. “Melakukannya” mempertahankan arti dasar ποιέω tanpa mempersempitnya secara interpretatif menjadi hanya “menaati”.
theological_decisions:
- issue: Cakupan keluarga yang didefinisikan kembali oleh Yesus
  choice: Yesus menyebut orang-orang yang mendengar firman Allah dan melakukannya sebagai ibu dan saudara-saudara laki-laki-Nya.
  alternative: Yesus menolak keluarga biologis-Nya secara mutlak, atau hanya menyebut kelompok murid laki-laki.
  rationale: Teks memperluas pengertian kekerabatan berdasarkan tanggapan terhadap firman Allah, tetapi tidak secara eksplisit menyangkal keluarga biologis Yesus. Bentuk maskulin sumber dipertahankan dalam teks utama, sementara kemungkinan penerapan yang lebih luas dicatat tanpa dipaksakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghapus penekanan identifikasi dalam teks Yunani. Kapitalisasi kata ganti yang merujuk kepada Yesus dipakai secara konsisten dalam ayat ini.
