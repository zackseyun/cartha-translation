id: LUK.8.41
reference: Luke 8:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: id
  text: Lalu datanglah seorang laki-laki bernama Yairus. Ia seorang pemimpin rumah ibadat. Ia tersungkur di kaki Yesus dan memohon kepada-Nya agar Yesus masuk ke rumahnya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Lalu datanglah
  rationale: Dalam alur narasi Indonesia, partikel ini secara alami memperkenalkan kemunculan mendadak tokoh baru; unsur perhatian dari ἰδού tersampaikan melalui susunan inversi tanpa ungkapan kaku seperti 'lihatlah'.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: seorang pemimpin rumah ibadat
  rationale: ἄρχων menyatakan pejabat atau pengurus utama, sedangkan συναγωγή di sini menunjuk rumah ibadat Yahudi; 'pemimpin' mempertahankan cakupan jabatan tanpa mempersempitnya secara tidak perlu.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: tersungkur di kaki Yesus
  rationale: Mengungkapkan tindakan merendahkan diri yang mendesak dengan idiom Indonesia yang wajar.
- source_word: παρεκάλει
  choice: memohon
  rationale: Bentuk imperfek menggambarkan permohonan yang sungguh-sungguh atau berkelanjutan; 'memohon' cocok dengan konteks tanpa menambahkan keterangan yang tidak eksplisit.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: supaya datang ke rumahnya
  rationale: Secara harfiah berarti masuk ke rumahnya, tetapi dalam bahasa Indonesia undangan agar Yesus menuju dan masuk ke rumah paling alami dinyatakan sebagai 'datang ke rumahnya'.
theological_decisions:
- issue: Makna tindakan tersungkur di kaki Yesus
  choice: Dibiarkan sebagai tindakan naratif tanpa menyebutnya secara eksplisit sebagai penyembahan
  alternative: bersujud menyembah Yesus
  rationale: Teks menyatakan postur merendahkan diri dan permohonan, tetapi tidak memakai kata kerja khusus untuk menyembah; terjemahan tidak boleh memaksakan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat panjang Yunani dibagi agar mudah dipahami, sementara koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
