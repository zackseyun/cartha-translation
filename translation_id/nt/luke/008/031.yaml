base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: id
  text: Mereka terus memohon kepada-Nya supaya Ia tidak memerintahkan mereka pergi ke dalam jurang raya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jurang yang dalam.” Kata Yunani ini dapat menunjuk pada kedalaman yang sangat besar; dalam konteks ini, kata itu kemungkinan merujuk pada tempat penahanan roh-roh jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: terus memohon
  rationale: Bentuk imperfek menunjukkan permohonan yang sedang berlangsung atau berulang; 'terus memohon' menyampaikan aspek itu sekaligus nada desakan dalam konteks roh-roh jahat yang berbicara kepada Yesus.
- source_word: ἐπιτάξῃ
  choice: memerintahkan
  rationale: Kata ini menyatakan perintah yang berwibawa. 'Memerintahkan' mempertahankan penekanan pada otoritas Yesus dan berterima dengan pelengkap 'pergi'.
- source_word: ἄβυσσον
  choice: jurang maut
  rationale: '''Jurang maut'' merupakan ungkapan Indonesia yang alami untuk kedalaman dahsyat atau dunia bawah dalam konteks supernatural. Pilihan ini mempertahankan gagasan tempat penahanan roh-roh jahat tanpa menambahkan gambaran ''tanpa dasar'' yang tidak dinyatakan secara eksplisit.'
- source_word: ἀπελθεῖν
  choice: pergi
  rationale: Infinitif gerak ini secara alami diterjemahkan 'pergi'; tujuan geraknya sudah dinyatakan oleh frasa 'ke jurang maut'.
- source_word: ἵνα μὴ
  choice: agar ... tidak
  rationale: Sesudah verba permohonan, konstruksi ini menyatakan isi permintaan. Bentuk 'agar Ia tidak' alami dalam bahasa Indonesia dan mempertahankan struktur klausa Yunani.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Dativus ini menunjuk pihak yang dikenai perintah; dalam bahasa Indonesia hubungan tersebut disampaikan secara idiomatis melalui 'memerintahkan mereka pergi'.
theological_decisions:
- issue: Makna ἄβυσσος dalam konteks roh-roh jahat
  choice: jurang maut sebagai tempat supernatural yang ditakuti roh-roh jahat
  alternative: jurang yang dalam dalam arti ruang yang lebih umum
  rationale: Konteks langsungnya adalah roh-roh jahat yang memohon agar Yesus tidak mengirim mereka ke sana. Terjemahan 'jurang maut' mempertahankan dimensi kosmis dan kemungkinan fungsi penahanan atau penghukuman, sedangkan catatan kaki menjaga keluasan makna leksikal tanpa mendefinisikannya melebihi pernyataan Lukas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. 'Terus memohon' dipilih untuk menampilkan aspek imperfek tanpa membuat kalimat terasa kaku.
