  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: id
  text: Lalu rohnya kembali[a], dan seketika itu juga ia bangun. Kemudian Yesus memerintahkan agar ia diberi sesuatu untuk dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “napasnya kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kembali
  rationale: Dalam konteks ini, verba tersebut menyatakan kembalinya roh atau hidup anak itu; “kembali” alami dan tetap dekat dengan gambaran konkret bahasa Yunani.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: rohnya
  rationale: πνεῦμα dapat berarti roh, napas, atau angin. Dalam konteks dibangkitkan dari kematian, “rohnya” mempertahankan keluasan makna dan bobot ungkapan Yunani tanpa membatasinya pada pernapasan.
- source_word: ἀνέστη
  choice: ia bangun
  rationale: Ungkapan ini secara alami menyatakan tindakan bangkit atau bangun setelah hidupnya dipulihkan; “ia bangun” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Pilihan ini menegaskan bahwa tindakan tersebut terjadi langsung tanpa jeda.
- source_word: διέταξεν
  choice: memerintahkan
  rationale: διατάσσω menyatakan pemberian perintah atau instruksi yang berwibawa. “Memerintahkan” paling langsung dalam konteks ini.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: agar ia diberi sesuatu untuk dimakan
  rationale: Terjemahan ini mempertahankan konstruksi pasif serta menyatakan secara eksplisit unsur φαγεῖν, “makan,” dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Makna πνεῦμα dalam konteks kebangkitan dari kematian
  choice: rohnya kembali
  alternative: napasnya kembali
  rationale: “Roh” paling baik mempertahankan rentang leksikal dan ketegangan teologis πνεῦμα dalam narasi ini. “Napas” mungkin secara leksikal, tetapi mempersempit maknanya pada fungsi jasmani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Subjek tersirat pada διέταξεν diperjelas sebagai “Yesus” agar rujukannya alami dan tidak rancu dalam bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkan.
