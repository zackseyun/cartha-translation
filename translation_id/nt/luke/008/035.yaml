id: LUK.8.35
reference: Luke 8:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: id
  text: Lalu orang-orang itu pergi untuk melihat apa yang telah terjadi. Mereka datang kepada Yesus dan mendapati orang yang telah ditinggalkan roh-roh jahat itu[a] sedang duduk di kaki Yesus, sudah berpakaian dan berpikiran sehat[b]. Mereka pun takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memakai kata kerja berbentuk jamak, yaitu “roh-roh jahat itu telah keluar.” Teks yang dicetak memakai kata kerja berbentuk tunggal dengan subjek jamak, tetapi maknanya tidak berubah.
    reason: textual_variant
  - marker: b
    text: Atau “sadar dan dapat menguasai diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν
  choice: Lalu orang-orang itu pergi untuk melihat
  rationale: Bentuk aoris menggambarkan gerak orang banyak keluar untuk memeriksa kejadian; penyebutan “orang-orang itu” membuat subjek jamak yang tersirat menjadi jelas dalam bahasa Indonesia.
- source_word: τὸ γεγονός
  choice: apa yang telah terjadi
  rationale: Partisip perfek yang dipakai secara substantival menunjuk kepada peristiwa yang sudah berlangsung; ungkapan ini alami dan mempertahankan urutan waktunya.
- source_word: εὗρον καθήμενον τὸν ἄνθρωπον
  choice: mendapati orang ... sedang duduk
  rationale: “Mendapati” sesuai dengan makna naratif εὗρον, sedangkan “sedang duduk” menggambarkan keadaan orang itu ketika ditemukan.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: orang yang telah ditinggalkan roh-roh jahat itu
  rationale: Susunan ini menyampaikan bahwa roh-roh jahat telah keluar dari orang tersebut sebelum ia ditemukan, dengan bahasa Indonesia yang alami.
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: Pilihan ini mempertahankan acuan kepada makhluk rohani jahat yang nyata dalam kisah pengusiran, tanpa menyamakannya dengan Iblis sebagai tokoh tunggal.
- source_word: ἱματισμένον
  choice: sudah berpakaian
  rationale: Menggambarkan keadaan orang itu yang kini mengenakan pakaian, sebagai kontras dengan ketelanjangannya sebelumnya.
- source_word: σωφρονοῦντα
  choice: berpikiran sehat
  rationale: Menyampaikan pulihnya kejernihan pikiran dan penguasaan diri tanpa memakai istilah klinis modern yang terlalu khusus.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: di dekat kaki Yesus
  rationale: Menyatakan posisi orang itu di sisi atau dekat kaki Yesus tanpa mempertegas secara berlebihan makna simbolis seperti ketundukan atau status murid.
- source_word: ἐφοβήθησαν
  choice: Mereka pun takut
  rationale: Kalimat pendek tersendiri mempertahankan reaksi orang banyak dan menghasilkan alur narasi Indonesia yang jelas.
theological_decisions:
- issue: Hakikat δαιμόνια dalam konteks pengusiran
  choice: roh-roh jahat
  alternative: setan-setan
  rationale: Teks menggambarkan keberadaan rohani personal yang sungguh keluar dari orang itu. “Roh-roh jahat” alami dalam bahasa Indonesia dan menghindari kemungkinan salah paham bahwa bentuk jamak itu merujuk kepada banyak Iblis.
- issue: Cakupan makna σωφρονοῦντα setelah pengusiran
  choice: berpikiran sehat
  alternative: sudah sadar dan dapat menguasai diri
  rationale: Pilihan utama mencakup kewarasan serta kejernihan pikiran, tetapi tidak menentukan diagnosis medis atau membatasi pemulihan itu pada kesadaran saja.
- issue: Makna posisi di kaki Yesus
  choice: di dekat kaki Yesus
  alternative: di kaki Yesus
  rationale: Terjemahan ini mempertahankan keterangan tempat yang eksplisit tanpa memasukkan kesimpulan teologis bahwa posisi tersebut pasti menandakan pemuridan, walaupun konteks dapat menyiratkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami tanpa menghilangkan hubungan antartindakan.
