  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: id
  text: dan Yohana, istri Khuza, pengelola rumah tangga Herodes, serta Susana dan banyak perempuan lain, yang melayani mereka[a] dengan harta milik mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “dia” dan bukan “mereka”.
    reason: textual_variant
  - marker: b
    text: Atau “dari harta milik mereka” atau “dari sumber daya mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: istri
  rationale: Dalam aposisi pada Yohana dan diikuti nama pribadi dalam bentuk genitif, kata ini paling wajar menunjukkan hubungan perkawinan dengan Khuza.
- source_word: ἐπιτρόπου
  choice: pengelola rumah tangga
  rationale: Istilah ini menunjuk pada orang yang diberi tanggung jawab atas urusan atau harta seseorang; ungkapan ini alami dalam konteks istana atau kediaman Herodes tanpa nuansa korporasi modern.
- source_word: ἕτεραι πολλαί
  choice: banyak perempuan lain
  rationale: Bentuk feminin jamak merujuk kembali kepada para perempuan dalam konteks, sehingga nomina 'perempuan' dinyatakan agar rujukannya jelas dalam bahasa Indonesia.
- source_word: διηκόνουν
  choice: melayani
  rationale: Kata ini menyatakan pelayanan atau bantuan secara luas; 'melayani' mempertahankan keluasan itu tanpa membatasinya hanya pada pemberian materi.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Teks SBLGNT yang diberikan memakai bentuk jamak, yang paling wajar merujuk kepada Yesus dan orang-orang yang menyertai-Nya.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: dengan harta milik mereka
  rationale: Frasa ini menyatakan bahwa pelayanan tersebut ditopang dari sumber daya atau kepunyaan para perempuan itu sendiri; 'dengan' menyampaikan sarana dukungan secara alami.
theological_decisions:
- issue: Rujukan αὐτοῖς
  choice: 'bentuk jamak: para perempuan melayani Yesus dan orang-orang yang bersama-Nya'
  alternative: 'bentuk tunggal: para perempuan melayani Dia, yaitu Yesus'
  rationale: Teks sumber yang diberikan memuat αὐτοῖς dalam bentuk jamak. Varian tunggal dicatat tanpa mengganti bacaan utama.
- issue: Cakupan pelayanan para perempuan
  choice: mempertahankan kata umum 'melayani', lalu menyebut sumber dayanya
  alternative: menafsirkan langsung sebagai 'menanggung kebutuhan' atau 'memberi nafkah'
  rationale: διηκόνουν memiliki cakupan lebih luas, sedangkan frasa berikutnya menjelaskan bahwa pelayanan itu dilakukan dengan sumber daya milik mereka; terjemahan tidak mempersempit tindakan tersebut melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama Ἰωάννα ditulis 'Yohana' dan Χουζᾶ 'Khuza'. Penanda catatan ditempatkan pada akhir kalimat agar tidak memutus deretan nama dan klausa relatif.
