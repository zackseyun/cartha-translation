revisions:
- from: Lalu Yesus bertanya, “Siapakah yang menyentuh Aku?” Ketika semua orang menyangkalnya, Petrus berkata, “Guru, orang banyak mengimpit dan mendesak-Mu.”[a]
  to: Lalu Yesus berkata, “Siapakah yang menyentuh Aku?” Sementara semua orang menyangkalnya, Petrus berkata, “Guru, orang banyak mengimpit-Mu dan mendesak-Mu.”[a]
  rationale: 'Revisi terbatas pada tiga hal: memakai “berkata” untuk εἶπεν, memakai “Sementara” untuk mempertahankan sifat berlangsung dari ἀρνουμένων, dan memperjelas bahwa kedua verba orang banyak berobjek Yesus. Tidak ada perubahan makna, penambahan doktrinal, atau keputusan tekstual baru.'
