    text: Atau “orang banyak mengerumuni-Mu dan menekan-Mu.”
    reason: Alternatif ini menonjolkan unsur pengepungan dalam συνέχω dan tekanan fisik terhadap Yesus dalam ἀποθλίβω.
  revision_rationale: 'Revisi terbatas pada tiga hal: memakai “berkata” untuk εἶπεν, memakai “Sementara” untuk mempertahankan sifat berlangsung dari ἀρνουμένων, dan memperjelas bahwa kedua verba orang banyak berobjek Yesus. Tidak ada perubahan makna, penambahan doktrinal, atau keputusan tekstual baru.'
