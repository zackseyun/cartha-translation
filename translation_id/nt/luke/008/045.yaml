review_pass:
  verdict: revise
  source_fidelity: 'Draf secara umum setia pada teks Yunani: Petrus, sapaan Ἐπιστάτα sebagai “Guru,” dan dua verba tekanan dari orang banyak tersampaikan dengan baik. Namun, ἀρνουμένων adalah partisipel kini dan lebih baik dinyatakan sebagai penyangkalan yang sedang berlangsung (“Sementara ... menyangkalnya”), bukan sekadar temporal netral “Ketika.” Selain itu, εἶπεν secara langsung berarti “berkata”; karena itu “berkata” dipertahankan meskipun ujarannya berbentuk pertanyaan.'
  naturalness: Bahasa draf pada umumnya alami dan berregister modern-baku. Pengulangan objek pada “mengimpit-Mu dan mendesak-Mu” membuat dua tindakan aktif terhadap Yesus lebih jelas dan lebih lancar daripada membiarkan objek hanya muncul pada verba kedua. “Sementara semua orang menyangkalnya” alami dalam narasi Indonesia.
  terminology: “Yesus,” “Petrus,” dan “Guru” sudah tepat. “Guru” adalah sapaan hormat yang wajar untuk Ἐπιστάτα dan tidak mengimpor gelar κύριος/Tuhan. Kapitalisasi Aku dan -Mu konsisten dengan konvensi Alkitab Indonesia. Catatan kaki direvisi agar alternatifnya tetap menandai pengepungan dan tekanan yang benar-benar diarahkan kepada Yesus.
  issues:
  - severity: low
    issue: Aspek duratif ἀρνουμένων belum tampak jelas.
    rationale: “Ketika semua orang menyangkalnya” dapat dipahami hanya sebagai penanda waktu. “Sementara semua orang menyangkalnya” lebih langsung mencerminkan partisipel kini, sebagaimana jejak audit Inggris “while everyone was denying it.”
  - severity: low
    issue: Verba pengantar εἶπεν diterjemahkan “bertanya.”
    rationale: Karena teks Yunani memakai “berkata,” bukan verba khusus “bertanya,” “berkata” lebih dekat pada bentuk sumber sambil tetap alami sebelum pertanyaan langsung.
  - severity: low
    issue: Alternatif catatan kaki kurang eksplisit menyatakan tekanan orang banyak terhadap Yesus.
    rationale: Frasa “berdesak-desakan di sekeliling-Mu” dapat menggambarkan orang banyak saling berdesakan, bukan tindakan menekan Yesus. Alternatif revisi mempertahankan kedua arah makna verba Yunani.
  revised_text: Lalu Yesus berkata, “Siapakah yang menyentuh Aku?” Sementara semua orang menyangkalnya, Petrus berkata, “Guru, orang banyak mengimpit-Mu dan mendesak-Mu.”[a]
  revised_footnotes:
