  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: id
  text: Lalu Yesus berkata, “Siapakah yang menyentuh Aku?” Sementara semua orang menyangkalnya, Petrus berkata, “Guru, orang banyak mengimpit-Mu dan mendesak-Mu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang banyak mengerumuni-Mu dan menekan-Mu.”
    reason: Alternatif ini menonjolkan unsur pengepungan dalam συνέχω dan tekanan fisik terhadap Yesus dalam ἀποθλίβω.
lexical_decisions:
- source_word: ἁψάμενός μου
  choice: yang menyentuh Aku
  rationale: Dalam konteks ini, bentuk tengah ἅπτω menunjuk pada sentuhan fisik. Susunan “Siapakah yang …” cukup alami sekaligus mencerminkan konstruksi Yunani τίς ὁ ἁψάμενός μου.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Ketika semua orang menyangkalnya
  rationale: Klausa ini mempertahankan tindakan penyangkalan yang berlangsung pada saat Petrus berbicara; akhiran “-nya” merujuk secara alami pada tindakan menyentuh yang baru ditanyakan.
- source_word: Ἐπιστάτα
  choice: Guru
  rationale: Sebagai sapaan hormat kepada Yesus, “Guru” alami dalam bahasa Indonesia dan menyatakan kewibawaan tanpa menaikkannya menjadi gelar “Tuhan,” sebab teks tidak memakai κύριος.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan baku bahasa Indonesia ini menyampaikan kumpulan besar orang secara alami; bahasa Indonesia tidak harus menandai bentuk jamak Yunani dengan pengulangan.
- source_word: συνέχουσίν σε
  choice: mengimpit
  rationale: Kata ini menggambarkan Yesus yang terkurung atau terdesak oleh orang-orang di sekeliling-Nya. “Mengimpit” mempertahankan gambaran tekanan dari berbagai sisi.
- source_word: ἀποθλίβουσιν
  choice: mendesak-Mu
  rationale: Pilihan ini menyatakan tekanan fisik orang banyak dan tetap membedakannya dari “mengimpit,” tanpa melebih-lebihkan daya tekan sebagai tindakan menghancurkan.
theological_decisions:
- issue: Sapaan Ἐπιστάτα kepada Yesus
  choice: Guru
  alternative: Tuan; Pemimpin
  rationale: “Guru” merupakan sapaan hormat yang alami dan dapat dipahami luas. Pilihan ini tidak menyamakan Ἐπιστάτα dengan κύριος serta tidak memasukkan gelar kristologis yang tidak dinyatakan oleh kata Yunani tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Dialog dibuat alami tanpa menghilangkan perbedaan antara ‘mengimpit’ dan ‘mendesak’.
