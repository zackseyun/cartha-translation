  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: id
  text: Mereka pun menertawakan Dia, karena mereka tahu bahwa anak itu sudah mati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: menertawakan
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam adegan itu. Dalam bahasa Indonesia, “menertawakan” secara alami menyampaikan tawa yang merendahkan atau mengejek tanpa perlu menambahkan keterangan lain.
- source_word: αὐτοῦ
  choice: Dia
  rationale: Pronomina genetif ini menjadi objek verba καταγελάω. Padanan idiomatis Indonesianya adalah “menertawakan Dia”; huruf kapital dipakai karena acuannya adalah Yesus.
- source_word: εἰδότες
  choice: karena mereka tahu
  rationale: Partisip ini secara kontekstual menyatakan alasan mereka menertawakan Yesus. Klausa “karena mereka tahu” jelas dan alami dalam bahasa Indonesia.
- source_word: ὅτι
  choice: bahwa
  rationale: ὅτι memperkenalkan isi pengetahuan mereka, yaitu bahwa anak itu sudah mati; hubungan sebab telah disampaikan melalui “karena” sebagai pengungkapan fungsi partisip εἰδότες.
- source_word: ἀπέθανεν
  choice: sudah mati
  rationale: Aoris menyatakan kematian sebagai peristiwa yang telah terjadi. “Sudah mati” merupakan ungkapan Indonesia yang alami dan menandai bahwa keadaan itu telah terjadi sebelum reaksi mereka.
theological_decisions:
- issue: Apakah subjek tersirat pada ἀπέθανεν perlu dinyatakan sebagai “dia” atau diperjelas dari konteks
  choice: anak itu sudah mati
  alternative: dia sudah mati
  rationale: Bahasa Yunani hanya memakai verba orang ketiga tunggal tanpa nomina dan tanpa penandaan gender pada bentuk verbanya. Karena “dia” dapat secara tata bahasa merujuk kembali kepada Yesus dalam kalimat Indonesia, “anak itu” menjernihkan acuan kontekstual kepada putri Yairus tanpa mengubah isi pernyataan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Partikel “pun” menjaga alur naratif καί tanpa menghasilkan pembukaan kalimat yang kaku. Tidak diperlukan catatan kaki.
