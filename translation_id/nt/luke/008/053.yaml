  terminology: Penggunaan “Dia” untuk Yesus konsisten dengan konvensi kapitalisasi yang dipakai draf. Tidak ada istilah teologis khusus atau nama yang memerlukan penyesuaian. Tidak diperlukan catatan kaki.
