  source_fidelity: Teks secara tepat menyampaikan καὶ κατεγέλων αὐτοῦ sebagai “Mereka pun menertawakan Dia.” Verba “menertawakan” memadai untuk daya ejekan καταγελάω, dan bentuknya dapat menampung aspek imperfek dalam konteks naratif. “Karena mereka tahu bahwa anak itu sudah mati” menyampaikan fungsi kausal εἰδότες dan isi ὅτι ἀπέθανεν dengan benar. Penjelasan “anak itu” merupakan penjernihan rujukan yang jelas dari konteks, bukan penambahan makna substantif.
