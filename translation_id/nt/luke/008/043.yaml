  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: id
  text: Ada seorang perempuan yang telah menderita pendarahan selama dua belas tahun[a] dan telah menghabiskan seluruh harta miliknya[b] untuk para tabib[c], dan ia tidak dapat disembuhkan oleh siapa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berada dalam aliran darah”; dapat juga diterjemahkan “mengalami keluarnya darah.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani βίος di sini berarti harta atau sumber daya untuk hidup, bukan “kehidupan” dalam arti biologis.
    reason: lexical_alternative
  - marker: c
    text: Frasa “telah menghabiskan seluruh harta miliknya untuk para tabib” dipertanyakan dalam sebagian naskah. Teks SBLGNT memuat frasa ini.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: Ada seorang perempuan yang telah menderita
  rationale: Konstruksi partisipial ini memberi latar belakang bagi narasi. Dalam bahasa Indonesia, bentuk klausa ini alami dan menghubungkan perempuan tersebut dengan keadaan yang berlangsung lama.
- source_word: ἐν ῥύσει αἵματος
  choice: menderita pendarahan
  rationale: Ungkapan ini menyampaikan keadaan keluarnya darah secara terus-menerus dengan bahasa Indonesia modern yang jelas tanpa menentukan diagnosis yang tidak dinyatakan teks.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: selama dua belas tahun
  rationale: Preposisi ἀπό dalam konteks ini menyatakan lamanya keadaan, sehingga 'selama' merupakan padanan idiomatis.
- source_word: ἰατροῖς
  choice: untuk tabib-tabib
  rationale: '''Tabib'' sesuai dengan latar dunia kuno dan tetap mudah dipahami; bentuk jamak mencerminkan bentuk Yunani.'
- source_word: προσαναλώσασα
  choice: telah menghabiskan
  rationale: Partisip aoris menunjukkan tindakan yang mendahului ketidakmampuannya memperoleh kesembuhan; bentuk ini juga mempertahankan gagasan bahwa sumber dayanya terkuras.
- source_word: ὅλον τὸν βίον
  choice: seluruh nafkahnya
  rationale: βίος di sini menunjuk pada sarana hidup atau sumber daya, bukan kehidupan biologis. 'Seluruh nafkahnya' ringkas dan jelas dalam bahasa Indonesia.
- source_word: οὐκ ἴσχυσεν
  choice: tidak ... dapat
  rationale: Ungkapan ini menyatakan ketidakmampuan, yang secara alami disampaikan dengan 'tidak dapat'.
- source_word: ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: tidak seorang pun dapat menyembuhkannya
  rationale: Susunan aktif ini idiomatis dalam bahasa Indonesia dan mempertahankan makna bahwa kesembuhan tidak diperoleh dari siapa pun.
theological_decisions:
- issue: Sifat penyakit perempuan itu
  choice: menderita pendarahan
  alternative: mengalami lelehan darah
  rationale: Terjemahan dipertahankan pada tingkat deskripsi fisik dan tidak menetapkan diagnosis medis atau implikasi ritual yang tidak dijelaskan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Tabib' dipilih untuk nuansa historis, sedangkan 'menderita pendarahan' menghindari ungkapan harfiah yang kaku. Ayat dibagi menjadi dua kalimat agar alurnya mudah dipahami.
