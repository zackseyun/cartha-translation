  to: Lalu Ia berkata kepada mereka, “Di manakah imanmu[a]?” Dalam ketakutan, mereka takjub dan berkata seorang kepada yang lain, “Siapakah gerangan Dia ini, sehingga Ia bahkan memberi perintah kepada angin dan air, dan keduanya menaati-Nya?”
  rationale: Revisi mempertahankan pertanyaan langsung tentang iman, urutan takut lalu takjub, serta “angin dan air” sebagaimana dalam teks Yunani. “Gerangan” menyampaikan nuansa inferensial ἄρα tanpa parafrasa longgar. Klausa terakhir dibatasi secara eksplisit pada angin dan air, sehingga tidak menambahkan cakupan “semuanya.”
