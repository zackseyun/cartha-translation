id: LUK.8.25
reference: Luke 8:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Di manakah imanmu[a]?” Dalam ketakutan, mereka takjub dan berkata seorang kepada yang lain, “Siapakah gerangan Dia ini, sehingga Ia bahkan memberi perintah kepada angin dan air, dan keduanya menaati-Nya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaanmu.” Pertanyaan Yesus juga dapat dipahami sebagai, “Di manakah kepercayaanmu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: Di manakah
  rationale: Mempertahankan bentuk pertanyaan langsung tentang keberadaan iman mereka, tanpa mengembangkannya secara tafsir menjadi alasan ketiadaan iman.
- source_word: πίστις
  choice: iman
  rationale: Padanan baku dan luas dalam konteks ini; nuansa kepercayaan kepada Yesus tetap relevan dan dicatat dalam catatan kaki.
- source_word: φοβηθέντες
  choice: Mereka pun takut
  rationale: Mengungkapkan partisip aoris secara alami dalam bahasa Indonesia sambil mempertahankan respons takut yang mendahului atau menyertai ketakjuban.
- source_word: ἐθαύμασαν
  choice: takjub
  rationale: Menyampaikan keheranan yang kuat akibat mukjizat dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Kalau begitu, siapakah Dia ini?
  rationale: '“Kalau begitu” mempertahankan daya inferensial ἄρα: para murid menarik kesimpulan berupa pertanyaan dari peristiwa yang baru mereka saksikan.'
- source_word: ἐπιτάσσει
  choice: diperintah-Nya
  rationale: Secara tepat menyatakan tindakan memberi perintah, bukan “menghardik,” yang berasal dari ayat sebelumnya.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: angin dan air
  rationale: Mengikuti penyebutan eksplisit dalam teks Yunani dan tidak mengganti “air” dengan “ombak” atau “laut” berdasarkan kisah sejajar.
- source_word: ὑπακούουσιν αὐτῷ
  choice: semuanya taat kepada-Nya
  rationale: “Taat” merupakan padanan idiomatis bagi kepatuhan ciptaan terhadap perintah Yesus; “semuanya” secara alami merujuk bersama-sama kepada angin dan air.
theological_decisions:
- issue: Makna πίστις dalam konteks bahaya di danau
  choice: iman
  alternative: kepercayaan
  rationale: “Iman” menjaga istilah teologis yang luas dan lazim, sedangkan nuansa kontekstual “kepercayaan” dipertahankan dalam catatan kaki tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan partisip Yunani diungkapkan dengan dua verba berurutan agar tidak kaku. Kapitalisasi pronomina bagi Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
