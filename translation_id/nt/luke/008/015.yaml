  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: id
  text: Namun, benih yang jatuh di tanah yang baik, itulah orang-orang yang, setelah mendengar firman itu dengan hati yang baik dan tulus, berpegang teguh pada firman itu dan menghasilkan buah dengan ketekunan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: benih yang jatuh di tanah yang baik
  rationale: Ungkapan Yunani ini eliptis dan dalam konteks perumpamaan merujuk pada benih yang jatuh atau ditaburkan di tanah yang baik. Menambahkan 'benih yang jatuh' memperjelas acuannya secara alami dalam bahasa Indonesia.
- source_word: καλῇ γῇ
  choice: tanah yang baik
  rationale: γῆ menunjuk pada tanah tempat benih tumbuh; 'tanah yang baik' alami dalam gambaran pertanian dan mempertahankan kontras dalam perumpamaan.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: menggambarkan orang-orang yang
  rationale: Konstruksi ini mengidentifikasi siapa yang dilambangkan oleh benih di tanah yang baik. 'Menggambarkan' menyatakan hubungan simbolis itu dengan jelas dan wajar.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: dengan hati yang tulus dan baik
  rationale: καλός dalam konteks moral dapat menyatakan ketulusan atau keluhuran, sedangkan ἀγαθός berarti baik. Pilihan ini mempertahankan dua sifat yang berdekatan maknanya tanpa menghasilkan pengulangan yang kaku.
- source_word: ἀκούσαντες τὸν λόγον
  choice: setelah mendengar firman itu
  rationale: Partisip aoris menunjukkan tindakan mendengar yang mendahului tindakan berpegang teguh dan berbuah. 'Firman itu' mempertahankan istilah yang sudah ditetapkan dalam penjelasan perumpamaan.
- source_word: κατέχουσιν
  choice: berpegang teguh padanya
  rationale: κατέχω di sini berarti mempertahankan dengan kuat, bukan sekadar memiliki. Pronomina '-nya' merujuk secara jelas kepada firman.
- source_word: καρποφοροῦσιν
  choice: menghasilkan buah
  rationale: Pilihan ini mempertahankan gambaran pertanian dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐν ὑπομονῇ
  choice: dengan ketekunan
  rationale: ὑπομονή menyatakan ketabahan dan ketekunan yang bertahan dalam kesulitan; 'dengan ketekunan' secara alami menjelaskan cara mereka menghasilkan buah.
theological_decisions:
- issue: Gambaran moral tentang hati yang menerima firman
  choice: dengan hati yang tulus dan baik
  alternative: dengan hati yang luhur dan baik
  rationale: Teks memuji keadaan batin para pendengar, tetapi tidak menjelaskan bagaimana hati demikian terbentuk. Terjemahan mempertahankan penilaian moral positif tanpa menambahkan kesimpulan tentang jasa manusia, urutan kelahiran baru, atau mekanisme doktrinal lainnya.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan: mendengar, berpegang teguh, lalu menghasilkan buah dengan ketekunan.'
