base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: id
  text: Ketika Yesus masih berbicara, datanglah seseorang dari pemimpin rumah ibadah itu dan berkata, “Anak perempuanmu sudah meninggal. Jangan lagi merepotkan Guru itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Ketika Yesus masih berbicara
  rationale: Konstruksi genitif absolut menyatakan tindakan yang berlangsung bersamaan. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah makna.
- source_word: ἔρχεταί τις
  choice: seseorang datang
  rationale: Bentuk kini historis diterjemahkan dengan bentuk naratif Indonesia yang wajar; τις tetap tidak tentu sebagai “seseorang”.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: dari rumah pemimpin rumah ibadah itu
  rationale: παρά dengan genitif menyatakan asal atau pihak pengutus. Dalam konteks, orang tersebut datang dari rumah Yairus, pemimpin rumah ibadah; ungkapan ini membuat sumber kedatangannya jelas dalam bahasa Indonesia.
- source_word: λέγων
  choice: dan berkata
  rationale: Partisip ini secara alami dirangkai sebagai verba koordinatif untuk memperkenalkan isi pesan.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Anak perempuanmu sudah meninggal
  rationale: Bentuk perfek menyatakan kematian yang telah terjadi dengan keadaan akibat yang masih berlaku; “sudah meninggal” menyampaikan kedua unsur itu secara alami dan santun.
- source_word: μηκέτι σκύλλε
  choice: Jangan lagi merepotkan
  rationale: Larangan present dengan μηκέτι meminta penghentian tindakan; “jangan lagi” dan “merepotkan” merupakan padanan modern yang jelas bagi σκύλλω.
- source_word: τὸν διδάσκαλον
  choice: Guru
  rationale: διδάσκαλος berarti guru atau pengajar. Huruf kapital menandai sapaan/sebutan bagi Yesus dalam konteks ini tanpa menaikkannya menjadi gelar lain.
theological_decisions:
- issue: Identitas dan sumber orang yang datang dalam frasa παρὰ τοῦ ἀρχισυναγώγου
  choice: dari rumah pemimpin rumah ibadah itu
  alternative: dari pemimpin rumah ibadah itu
  rationale: Secara harfiah, frasa Yunani dapat berarti orang itu datang “dari” sang pemimpin, yakni sebagai utusannya. Konteks narasi juga mendukung bahwa berita datang dari rumahnya. Pilihan ini mengikuti konteks, tetapi menambahkan “rumah” yang tidak dinyatakan secara eksplisit dalam frasa tersebut.
- issue: Padanan ἀρχισυνάγωγος
  choice: pemimpin rumah ibadah
  alternative: kepala sinagoge
  rationale: Ini jabatan kelembagaan, bukan gelar teologis. “Pemimpin rumah ibadah” mudah dipahami pembaca umum dan menghindari konotasi jabatan gerejawi.
- issue: Padanan διδάσκαλος
  choice: Guru
  alternative: Tuan
  rationale: Makna leksikal biasa kata Yunani ini ialah pengajar/guru. Pilihan ini tidak memasukkan nuansa kristologis yang tidak dinyatakan langsung dalam klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami untuk narasi lisan; “meninggal” dipilih daripada “mati” karena sesuai dengan nada hormat dalam penyampaian berita duka.
