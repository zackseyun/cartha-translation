review_pass:
  verdict: revise
  source_fidelity: Frasa παρὰ τοῦ ἀρχισυναγώγου berarti ‘dari pemimpin rumah ibadah itu’ atau ‘dari pihak pemimpin rumah ibadah itu.’ Draf menambahkan ‘rumah [pemimpin]’, yang tidak ada dalam teks Yunani dan mempersempit sumber berita secara tidak perlu. Selebihnya, ‘masih berbicara,’ ‘seseorang datang,’ ‘sudah meninggal,’ dan larangan dengan ‘jangan lagi’ menyampaikan unsur-unsur Yunani dengan baik.
  naturalness: Teks revisi tetap memakai bahasa Indonesia baku dan modern. Susunan ‘datanglah seseorang dari pemimpin rumah ibadah itu’ alami dalam gaya naratif dan tidak menyiratkan rumah, keluarga, atau tempat tinggal sang pemimpin.
  terminology: ‘Pemimpin rumah ibadah’ adalah padanan yang jelas untuk ἀρχισυνάγωγος. ‘Guru itu’ mencerminkan artikel definit τὸν tanpa mengubah διδάσκαλος menjadi gelar yang lebih tinggi atau istilah teologis interpretatif.
  issues:
  - severity: medium
    issue: Penambahan kata ‘rumah’ dalam ‘dari rumah pemimpin rumah ibadah itu’.
    rationale: Teks sumber hanya menyatakan bahwa seseorang datang dari sang pemimpin rumah ibadah (atau dari pihaknya); teks tidak menyebut rumahnya. Tambahan itu adalah harmonisasi kontekstual yang tidak diperlukan dan menghilangkan ambiguitas sumber.
  revised_text: Ketika Yesus masih berbicara, datanglah seseorang dari pemimpin rumah ibadah itu dan berkata, “Anak perempuanmu sudah meninggal. Jangan lagi merepotkan Guru itu.”
