  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: id
  text: Tetapi Yesus berkata, “Seseorang telah menyentuh Aku, sebab Aku tahu bahwa kuasa telah keluar dari-Ku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Ada orang yang menyentuh Aku
  rationale: Menyampaikan subjek tak tentu τις secara alami dalam bahasa Indonesia sambil mempertahankan arti langsung ἅπτομαι, yaitu ‘menyentuh’.
- source_word: ἔγνων
  choice: Aku tahu
  rationale: Aoristus γινώσκω di sini menyatakan bahwa Yesus mengetahui atau menyadari keluarnya kuasa; ‘tahu’ mengikuti makna dasar tanpa menambahkan cara pengetahuan itu diperoleh.
- source_word: δύναμιν
  choice: kuasa
  rationale: ‘Kuasa’ merupakan padanan alami untuk δύναμις dalam konteks daya ilahi yang menghasilkan kesembuhan.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: telah keluar dari diri-Ku
  rationale: Partisip perfek menekankan keluarnya kuasa sebagai peristiwa yang telah terjadi dengan akibat yang nyata; ‘dari diri-Ku’ memperjelas sumber personal tanpa mengubah makna.
theological_decisions:
- issue: Pengetahuan Yesus tentang keluarnya kuasa
  choice: Aku tahu
  alternative: Aku merasakan / Aku menyadari
  rationale: Teks memakai ἔγνων dan tidak menjelaskan mekanisme pengetahuan Yesus. ‘Aku tahu’ mempertahankan pernyataan itu tanpa menyempitkannya menjadi sensasi fisik atau penafsiran tertentu.
- issue: Kuasa yang keluar dari Yesus
  choice: kuasa telah keluar dari diri-Ku
  alternative: kuasa keluar dari-Ku
  rationale: Bentuk perfek dipertahankan melalui ‘telah keluar’, sementara ungkapan tersebut dibiarkan apa adanya tanpa menjelaskan secara dogmatis hakikat atau mekanisme kuasa itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan dalam teks pembaca.
