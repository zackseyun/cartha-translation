revisions:
- from: Sebab Yesus telah memerintahkan roh najis itu untuk keluar dari orang tersebut. Roh itu sudah berkali-kali mencengkeramnya. Ia pun dijaga dan dibelenggu dengan rantai dan pasung, tetapi ia memutuskan belenggu-belenggu itu, lalu dihalau oleh setan itu ke tempat-tempat sunyi.[a]
  to: Sebab Yesus telah memerintahkan roh najis itu untuk keluar dari orang itu. Roh itu sudah berkali-kali mencengkeramnya[a], dan orang itu dijaga serta dibelenggu dengan rantai dan pasung. Ketika ia memutuskan belenggu-belenggu itu, ia dihalau oleh setan itu ke tempat-tempat sunyi.[b]
  rationale: Revisi menghapus penghubung kontrasif dan sekuensial yang tidak dinyatakan secara eksplisit dalam Yunani, menjelaskan rujukan subjek pada bagian pengekangan, serta menempatkan alternatif leksikal pada jangkar yang sesuai. "Ketika" memberi bentuk Indonesia yang alami bagi partisip διαρρήσσων tanpa menambahkan pelaku atau mengubah tindakan pokok.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya mencerminkan unsur-unsur utama teks Yunani: perintah Yesus, roh najis, penguasaan berulang/berlangsung lama, penjagaan dan pengekangan, pemutusan belenggu, serta penghalauan ke tempat-tempat sunyi. Namun, "tetapi ... lalu" menambahkan kontras dan urutan yang lebih tegas daripada rangkaian καί dalam teks. Rujukan "Ia" setelah kalimat tentang roh juga berpotensi ambigu dalam bahasa Indonesia.'
  naturalness: Bahasa draft umumnya modern dan jelas. Pengulangan subjek "orang itu" pada bagian pengekangan menghilangkan ambiguitas antara orang itu dan roh najis. Pemisahan catatan kaki untuk dua alternatif leksikal membuat jangkar catatan lebih jelas.
  terminology: '"Roh najis" adalah padanan yang baik untuk πνεῦμα τὸ ἀκάθαρτον. "Setan" dapat dipakai untuk δαιμόνιον dalam register Alkitab Indonesia, dan "rantai dan pasung" dengan baik membedakan ἁλύσεις dan πέδαις. "Tempat-tempat sunyi" mempertahankan bentuk jamak dan tidak secara berlebihan menentukan jenis medannya.'
  issues:
  - severity: medium
    issue: Hubungan "tetapi ... lalu" bersifat lebih interpretatif daripada teks sumber.
    rationale: Teks memakai καί untuk menghubungkan penjagaan, pemutusan belenggu, dan penghalauan. Kontras memang mungkin tersirat, tetapi "tetapi" dan "lalu" membuatnya eksplisit dan menguatkan urutan secara tidak perlu.
  - severity: low
    issue: Rujukan "Ia" ambigu.
    rationale: Kalimat sebelumnya bersubjek "Roh itu", sehingga "Ia pun dijaga" dapat sesaat dibaca sebagai merujuk kepada roh, bukan kepada orang yang kerasukan.
  - severity: low
    issue: Satu penanda catatan kaki memuat alternatif bagi dua frasa yang berjauhan.
    rationale: Penanda terpisah sesudah "berkali-kali" dan "tempat-tempat sunyi" memberi jangkar yang tepat bagi masing-masing alternatif leksikal.
