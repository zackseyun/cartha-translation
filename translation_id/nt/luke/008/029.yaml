id: LUK.8.29
reference: Luke 8:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: id
  text: Sebab Yesus telah memerintahkan roh najis itu untuk keluar dari orang itu. Roh itu sudah berkali-kali mencengkeramnya[a], dan orang itu dijaga serta dibelenggu dengan rantai dan pasung. Ketika ia memutuskan belenggu-belenggu itu, ia dihalau oleh setan itu ke tempat-tempat sunyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani yang diterjemahkan “berkali-kali” juga dapat berarti “sejak lama.”
    reason: lexical_alternative
  - marker: b
    text: Atau “daerah-daerah tandus” atau “padang belantara.” Ungkapan Yunaninya berbentuk jamak, secara harfiah “tempat-tempat sepi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: telah memerintahkan
  rationale: Imperfek dalam klausa penjelas dengan γάρ memberi latar bagi ucapan sebelumnya; bentuk ini menyampaikan bahwa perintah Yesus mendahului tanggapan roh itu tanpa memaksakan aspek yang terlalu teknis.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: roh najis
  rationale: Ungkapan baku Perjanjian Baru yang mempertahankan kaitannya dengan kenajisan ritual dan moral.
- source_word: πολλοῖς χρόνοις
  choice: berkali-kali
  rationale: Bentuk jamak dan konteks tindakan berulang mendukung makna episodik, walaupun makna duratif tetap mungkin dan dicatat dalam catatan kaki.
- source_word: συνηρπάκει
  choice: sudah ... mencengkeramnya
  rationale: Menyampaikan tindakan menguasai dengan keras dan berulang; 'mencengkeram' alami serta cukup kuat dalam bahasa Indonesia.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος
  choice: dijaga dan dibelenggu dengan rantai dan pasung
  rationale: Mengungkapkan penjagaan serta pengekangan yang berulang secara alami, sambil membedakan ἁλύσεις dari πέδαι.
- source_word: διαρρήσσων τὰ δεσμά
  choice: memutuskan belenggu-belenggu itu
  rationale: Mempertahankan daya tindakan διαρρήσσω dan memakai istilah umum untuk alat pengekang agar tidak sekadar mengulang 'rantai'.
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: dihalau oleh setan itu
  rationale: Pasif imperfek menyatakan paksaan yang berulang; 'dihalau' menjaga nuansa gerak paksa, sedangkan 'setan' merupakan sebutan umum dalam bahasa Indonesia bagi δαιμόνιον.
- source_word: εἰς τὰς ἐρήμους
  choice: ke tempat-tempat sunyi
  rationale: Bentuk jamak dipertahankan, dan frasa ini menyampaikan kawasan yang sepi atau tidak dihuni tanpa menentukan bahwa wilayah itu berupa gurun pasir.
theological_decisions:
- issue: Istilah bagi pelaku roh jahat
  choice: roh najis dan setan
  alternative: roh jahat; demon
  rationale: Narasi menggambarkan pelaku rohani personal. Terjemahan langsung mempertahankan dunia naratif teks tanpa mereduksinya menjadi metafora atau diagnosis psikologis.
- issue: Hubungan antarperistiwa dalam rangkaian penjagaan, pemutusan belenggu, dan penghalauan
  choice: memakai 'tetapi ... lalu' untuk menyatakan alur yang tersirat
  alternative: mempertahankan rangkaian 'dan' secara mekanis
  rationale: 'Bahasa Indonesia memerlukan hubungan wacana yang lebih jelas: walaupun καί bersifat umum, konteks menunjukkan kontras antara pembelengguan dan pemutusannya, kemudian urutan menuju penghalauan. Ini tidak mengubah pelaku atau isi tindakan.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Orang tersebut' menghindari kesan bahwa ἄνθρωπος menekankan jenis kelamin, sementara 'rantai dan pasung' membedakan dua jenis alat pengekang. Penempatan penanda catatan kaki sesudah frasa terakhir membuat alternatif leksikal tetap tersedia tanpa mengganggu alur ayat.
