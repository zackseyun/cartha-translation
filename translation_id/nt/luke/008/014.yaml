id: LUK.8.14
reference: Luke 8:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: id
  text: Yang jatuh di antara duri-duri itu adalah orang-orang yang telah mendengar, tetapi ketika mereka berjalan, mereka tercekik oleh kekhawatiran[a], kekayaan, dan kenikmatan hidup, dan mereka tidak menghasilkan buah yang mencapai kematangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kecemasan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka tidak menghasilkan buah sampai tuntas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: yang jatuh di tengah semak duri
  rationale: Mempertahankan ungkapan netral tanpa menambahkan kata “benih” yang tidak dinyatakan secara eksplisit, sementara konteks perumpamaan tetap membuat acuannya jelas. “Di tengah semak duri” menyampaikan lokasi jatuhnya benih secara alami.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: itulah orang-orang yang telah mendengar
  rationale: Bentuk “telah mendengar” menyampaikan tindakan mendengar yang sudah terjadi dan tetap relevan dalam penjelasan perumpamaan.
- source_word: πορευόμενοι
  choice: sementara mereka menjalani perjalanan mereka
  rationale: Menyampaikan proses yang terus berlangsung tanpa menetapkan bahwa ungkapan itu secara khusus berarti seluruh perjalanan hidup, meskipun nuansa tersebut mungkin tersirat.
- source_word: ὑπὸ μεριμνῶν
  choice: oleh kekhawatiran
  rationale: “Kekhawatiran” merupakan padanan modern dan luas bagi μέριμναι, yang dapat berarti kekhawatiran, kecemasan, atau berbagai beban pikiran.
- source_word: πλούτου
  choice: kekayaan
  rationale: Padanan langsung dan alami untuk πλοῦτος, dengan tetap mempertahankan kekayaan sebagai salah satu pengaruh yang menghimpit firman.
- source_word: ἡδονῶν τοῦ βίου
  choice: kenikmatan hidup
  rationale: “Kenikmatan” menyampaikan ἡδοναί, sedangkan “hidup” di sini menunjuk pada kehidupan duniawi sehari-hari, bukan hidup kekal.
- source_word: συμπνίγονται
  choice: mereka tercekik
  rationale: Mempertahankan bentuk pasif dan gambaran pertanian yang kuat tentang tanaman yang tercekik oleh semak duri.
- source_word: οὐ τελεσφοροῦσιν
  choice: mereka tidak menghasilkan buah yang matang
  rationale: Mempertahankan metafora buah sekaligus menyampaikan bahwa buah itu tidak mencapai kematangan atau penyelesaian.
theological_decisions:
- issue: Hakikat kegagalan para pendengar yang digambarkan sebagai tanah bersemak duri
  choice: Terjemahan mempertahankan gambaran bahwa mereka tercekik dan tidak menghasilkan buah yang matang.
  alternative: Menentukan bahwa mereka tidak pernah sungguh-sungguh percaya, bahwa mereka orang percaya sejati yang menjadi tidak berbuah, atau bahwa mereka kemudian murtad.
  rationale: Ayat ini menggambarkan akibat kekhawatiran, kekayaan, dan kenikmatan hidup, tetapi tidak secara eksplisit menyelesaikan perdebatan teologis tentang kelahiran baru, kemurtadan, atau ketekunan. Ketegangan teks dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dibuat alami, tetapi metafora pertanian, bentuk pasif, proses yang sedang berlangsung, dan gagasan buah yang gagal mencapai kematangan tetap dipertahankan.
