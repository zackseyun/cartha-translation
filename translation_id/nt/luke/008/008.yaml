  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: id
  text: Dan benih yang lain jatuh ke tanah yang baik, dan setelah tumbuh, benih itu menghasilkan buah seratus kali lipat. Sambil mengatakan semuanya itu, ia berseru, “Siapa yang mempunyai telinga untuk mendengar, hendaklah ia mendengar!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: yang lain
  rationale: Bentuk netral tunggal ini menunjuk pada benih lain dalam rangkaian perumpamaan. Bahasa Indonesia dapat mempertahankan rujukan implisit itu secara alami.
- source_word: γῆν τὴν ἀγαθήν
  choice: tanah yang baik
  rationale: Dalam konteks pertanian, 'tanah' dengan jelas menyampaikan arti media tempat benih tumbuh.
- source_word: φυὲν
  choice: setelah tumbuh
  rationale: Partisip aoris ini menggambarkan pertumbuhan yang mendahului tindakan utama, yaitu menghasilkan buah.
- source_word: ἐποίησεν καρπὸν
  choice: menghasilkan buah
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan citra pertanian dalam teks Yunani.
- source_word: ἑκατονταπλασίονα
  choice: seratus kali lipat
  rationale: Menyampaikan besarnya hasil secara tepat tanpa mengurangi gambaran hasil yang luar biasa.
- source_word: ταῦτα λέγων
  choice: sambil mengatakan hal-hal itu
  rationale: Menunjukkan bahwa tindakan mengatakan dan berseru berlangsung beriringan, sesuai fungsi partisip kini.
- source_word: ἐφώνει
  choice: ia berseru
  rationale: Menyampaikan ucapan yang lantang dan penuh penekanan tanpa melebihkannya menjadi teriakan.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: Siapa mempunyai telinga untuk mendengar
  rationale: Menyampaikan konstruksi partisip substantival secara umum dan alami, tanpa membatasinya pada laki-laki.
- source_word: ἀκουέτω
  choice: hendaklah ia mendengar
  rationale: Mempertahankan daya imperatif orang ketiga tunggal dan nada ajakan yang sungguh-sungguh.
theological_decisions:
- issue: Bahasa representatif dalam seruan Yesus
  choice: Siapa mempunyai telinga untuk mendengar, hendaklah ia mendengar
  alternative: Orang yang mempunyai telinga untuk mendengar, hendaklah mendengar
  rationale: Konstruksi Yunani bersifat umum, bukan khusus laki-laki. 'Siapa' mempertahankan cakupan representatifnya, sedangkan 'ia' menjaga bentuk tunggal dari perintah tersebut.
translation_notes:
  register: Bahasa dibuat modern, lugas, dan bermartabat. Subjek 'benih itu' dinyatakan setelah partisip agar urutan pertumbuhan dan hasil mudah dipahami, sementara seruan penutup mempertahankan bentuk khidmat dan tegas.
