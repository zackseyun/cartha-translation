- from: Dan yang lain jatuh di tanah yang baik. Setelah tumbuh, benih itu menghasilkan buah seratus kali lipat. Sambil mengatakan hal-hal itu, ia berseru, “Siapa mempunyai telinga untuk mendengar, hendaklah ia mendengar!”
  to: Dan benih yang lain jatuh ke tanah yang baik, dan setelah tumbuh, benih itu menghasilkan buah seratus kali lipat. Sambil mengatakan semuanya itu, ia berseru, “Siapa yang mempunyai telinga untuk mendengar, hendaklah ia mendengar!”
  rationale: Revisi memperbaiki arah gerak yang dinyatakan oleh εἰς, memperjelas rujukan benih yang tersirat, dan menyesuaikan konstruksi relatif ke bahasa Indonesia modern yang baku. Makna temporal “setelah tumbuh,” hasil “seratus kali lipat,” serta seruan imperatif tetap dipertahankan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu dipertahankan dalam teks ini.
