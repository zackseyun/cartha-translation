id: LUK.8.44
reference: Luke 8:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: id
  text: Ia mendekati Yesus dari belakang, lalu menyentuh jumbai[a] jubah-Nya. Seketika itu juga, aliran darahnya berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tepi” atau “kelim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Ia mendekati Yesus dari belakang
  rationale: Partisip aoristus dan adverbia ini menyatakan gerakan mendekat dari arah belakang sebelum tindakan utama. Nama Yesus dibuat eksplisit agar kalimat alami dan acuannya jelas dalam bahasa Indonesia.
- source_word: ἥψατο
  choice: menyentuh
  rationale: Dalam konstruksi ini bentuk tengah ἅπτω lazim berarti menyentuh, tanpa harus menyiratkan bahwa ia menggenggam.
- source_word: τοῦ κρασπέδου
  choice: jumbai
  rationale: κράσπεδον dapat berarti tepi, kelim, atau jumbai pakaian. 'Jumbai' mempertahankan kemungkinan rujukan pada jumbai pakaian Yahudi, sedangkan alternatif leksikal dicatat dalam catatan kaki agar ambiguitasnya tidak hilang.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: jubah-Nya
  rationale: ἱμάτιον menunjuk pada pakaian luar. 'Jubah' merupakan padanan Indonesia yang alami dan cukup umum dalam konteks ini tanpa menentukan bentuk pakaian secara berlebihan.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Adverbia ini menandai akibat yang langsung terjadi; frasa tersebut jelas dan idiomatis dalam bahasa Indonesia.
- source_word: ἔστη
  choice: berhenti
  rationale: Dalam konteks aliran darah, bentuk aoristus dari ἵστημι berarti berhenti atau terhenti.
- source_word: ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: aliran darahnya
  rationale: Padanan ini dekat dengan struktur Yunani dan menyampaikan pendarahan yang terus berlangsung tanpa memperhalus atau menambah diagnosis.
theological_decisions:
- issue: Kemungkinan nuansa pakaian ritual/Yahudi dalam κράσπεδον
  choice: Menggunakan 'jumbai' dalam teks utama dengan alternatif dalam catatan kaki
  alternative: tepi atau kelim
  rationale: Istilah Yunani dapat menunjuk secara umum pada tepi pakaian atau secara lebih khusus pada jumbai. Konteks ayat tidak memastikan bahwa rujukan kepada jumbai yang diperintahkan Taurat dimaksudkan secara eksplisit, sehingga pilihan lain tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan dua kalimat menjaga alur naratif tetap ringan, sedangkan 'seketika itu juga' menonjolkan langsungnya pemulihan.
