id: LUK.8.2
reference: Luke 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: id
  text: 'dan beberapa perempuan yang telah disembuhkan dari roh-roh jahat dan penyakit: Maria yang disebut Magdalena, tujuh setan telah keluar darinya,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: beberapa perempuan
  rationale: τινες menunjukkan sejumlah orang yang tidak ditentukan dari kelompok perempuan; “beberapa perempuan” alami dan tepat dalam bahasa Indonesia modern.
- source_word: ἦσαν τεθεραπευμέναι
  choice: telah disembuhkan
  rationale: Konstruksi perifrastik dengan partisip perfek pasif menyatakan penyembuhan yang sudah terjadi dengan hasil yang tetap berlaku.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: dari roh-roh jahat
  rationale: Terjemahan ini mempertahankan arti πονηρός sebagai “jahat” dan tidak menggantinya dengan “najis,” yang menerjemahkan istilah Yunani lain.
- source_word: καὶ ἀσθενειῶν
  choice: dan penyakit
  rationale: ἀσθένεια dalam konteks ini menunjuk pada kelemahan atau gangguan jasmani; “penyakit” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: yang disebut Magdalena
  rationale: Frasa ini mengidentifikasi Maria melalui sebutan Magdalena tanpa menambahkan keterangan yang tidak terdapat dalam teks.
- source_word: ἀφ’ ἧς
  choice: yang darinya
  rationale: ἀπό menandai asal atau pemisahan; susunan ini mempertahankan hubungan langsung antara Maria dan keluarnya setan-setan itu.
- source_word: δαιμόνια ἑπτὰ
  choice: tujuh setan
  rationale: “Setan” merupakan padanan Indonesia yang umum untuk δαιμόνιον dan menjaga perbedaan leksikal dari frasa yang lebih luas “roh-roh jahat” sebelumnya.
- source_word: ἐξεληλύθει
  choice: telah keluar
  rationale: Bentuk pluperfek menunjukkan bahwa keluarnya setan-setan itu sudah terjadi sebelum titik waktu dalam narasi.
theological_decisions:
- issue: Bahasa tentang gangguan oleh kuasa jahat
  choice: Roh-roh jahat dan setan diterjemahkan sebagai pelaku rohani personal, terpisah dari penyakit.
  alternative: Memahami semuanya sebagai bahasa kiasan bagi gangguan psikologis atau jasmani.
  rationale: Teks Yunani membedakan πνεύματα πονηρά dan δαιμόνια dari ἀσθένειαι. Terjemahan mempertahankan pembedaan itu tanpa memberi penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “telah disembuhkan” serta “telah keluar” mempertahankan urutan waktu lampau, sedangkan “yang disebut Magdalena” terdengar alami tanpa mengurangi ketepatan formal.
