  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: id
  text: Semua orang sedang menangis dan meratapinya. Tetapi Yesus berkata, “Jangan menangis, sebab ia tidak mati, tetapi sedang tidur.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tertidur.” Yesus memakai kata “tidur” secara metaforis dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: sedang menangis
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung; frasa ini mempertahankan aspek duratif secara alami dalam bahasa Indonesia.
- source_word: πάντες
  choice: semua orang
  rationale: Mempertahankan cakupan universal para peratap dengan ungkapan Indonesia yang wajar.
- source_word: ἐκόπτοντο αὐτήν
  choice: meratapi dia
  rationale: Dalam konteks perkabungan, κόπτομαι menunjuk pada ratapan, yang mungkin disertai pemukulan dada; terjemahan ini menyampaikan maknanya tanpa memperinci gerak tubuh yang tidak dinyatakan secara eksplisit.
- source_word: Μὴ κλαίετε
  choice: Jangan menangis
  rationale: Larangan kini dengan μή dapat menyiratkan penghentian tindakan yang sedang berlangsung, tetapi ungkapan ini alami dan tidak terlalu menafsirkan.
- source_word: οὐ γὰρ
  choice: sebab ... tidak
  rationale: γάρ memberikan alasan bagi perintah Yesus; 'sebab' mempertahankan hubungan penjelasannya secara ringkas.
- source_word: ἀπέθανεν
  choice: tidak mati
  rationale: Aoristus diterjemahkan secara idiomatis; dalam bahasa Indonesia, 'tidak mati' mempertahankan pertentangannya dengan 'sedang tidur' tanpa menambahkan penafsiran.
- source_word: καθεύδει
  choice: sedang tidur
  rationale: Bentuk kini dipertahankan sebagai tindakan yang berlangsung dan menjaga metafora yang dipakai Yesus.
theological_decisions:
- issue: Pernyataan Yesus bahwa anak itu 'tidak mati, tetapi sedang tidur'
  choice: Mempertahankan perkataan Yesus secara langsung dan metafora tidur tanpa menyelesaikan ketegangan maknanya dalam teks utama.
  alternative: Menerjemahkannya sebagai 'tidak mati untuk selamanya' atau menyatakan bahwa ia hanya tampak mati.
  rationale: Narasi mempertahankan cara Yesus menggambarkan keadaan anak itu menjelang pemulihannya. Terjemahan tidak boleh menentukan apakah ungkapan tersebut semata-mata metaforis atau menerangkan keadaan fisiknya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Meratapi' dipilih untuk konteks perkabungan; subjek 'Yesus' dinyatakan agar rujukan pronomina alami dan jelas dalam ayat yang berdiri sendiri.
