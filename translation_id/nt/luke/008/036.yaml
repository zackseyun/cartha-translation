  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: id
  text: Orang-orang yang telah menyaksikan peristiwa itu lalu menceritakan kepada mereka bagaimana orang yang kerasukan setan itu telah diselamatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah disembuhkan” atau “telah dibebaskan.” Kata kerja Yunani yang digunakan dapat berarti menyelamatkan, menyembuhkan, atau membebaskan, bergantung pada konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: menceritakan
  rationale: Bentuk aoristus dari ἀπαγγέλλω berarti memberitahukan atau melaporkan. Dalam alur narasi lisan ini, “menceritakan” terdengar alami dan tetap menyampaikan tindakan para saksi yang memberitahukan apa yang terjadi.
- source_word: δὲ
  choice: lalu
  rationale: δέ berfungsi sebagai penghubung ringan yang melanjutkan narasi, bukan sebagai pertentangan tegas. “Lalu” mengalir secara alami dalam bahasa Indonesia.
- source_word: αὐτοῖς
  choice: kepada mereka
  rationale: Pronomina datif ini menunjukkan penerima laporan dan diterjemahkan secara langsung sebagai “kepada mereka”.
- source_word: οἱ ἰδόντες
  choice: orang-orang yang telah menyaksikan peristiwa itu
  rationale: Partisipel berartikel ini menunjuk kepada para saksi kejadian tersebut. “Menyaksikan” menyatakan bahwa mereka melihat sendiri, sedangkan “peristiwa itu” memperjelas rujukan tersirat tanpa menambah isi baru.
- source_word: πῶς
  choice: bagaimana
  rationale: πῶς memperkenalkan isi laporan mengenai apa yang terjadi atau cara terjadinya. “Bagaimana” mempertahankan bentuk dan keluwesan makna sumber.
- source_word: ἐσώθη
  choice: telah diselamatkan
  rationale: Bentuk pasif σῴζω dapat berarti diselamatkan, disembuhkan, atau dibebaskan. “Telah diselamatkan” mempertahankan keluasan leksikal dan gema teologisnya, sementara alternatif yang sesuai konteks dicatat dalam catatan kaki.
- source_word: ὁ δαιμονισθείς
  choice: orang yang kerasukan setan itu
  rationale: Partisipel pasif substantival maskulin tunggal ini menunjuk kepada orang yang berada di bawah kuasa setan. Ungkapan ini jelas, alami, dan mudah dipahami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Pemaknaan ἐσώθη (σῴζω) dalam konteks pengusiran setan dan pemulihan
  choice: telah diselamatkan
  alternative: telah disembuhkan; telah dibebaskan
  rationale: σῴζω mencakup penyelamatan, pembebasan, dan penyembuhan. Teks utama mempertahankan “diselamatkan” agar keluasan dan ketegangan maknanya tidak dipersempit menjadi hanya kesembuhan jasmani atau hanya keselamatan rohani; catatan kaki menyajikan kemungkinan kontekstual lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan ambiguitas penting pada σῴζω.
