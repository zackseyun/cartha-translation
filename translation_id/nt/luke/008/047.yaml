id: LUK.8.47
reference: Luke 8:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: id
  text: Ketika perempuan itu menyadari bahwa perbuatannya tidak luput dari perhatian[a], ia datang dengan gemetar lalu tersungkur di hadapan Yesus[b]. Di depan semua orang, ia menyatakan alasan ia menyentuh Yesus dan bagaimana ia seketika itu juga disembuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bahwa dirinya tidak dapat tetap tersembunyi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menjatuhkan diri di hadapan-Nya.” Bahasa Yunani tidak secara eksplisit menyebut kaki Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: ketika ... menyadari
  rationale: Partisip aoristus ini memperkenalkan keadaan yang mendahului tindakan utama. Dalam konteks ini, perempuan itu bukan sekadar melihat, melainkan menyadari bahwa tindakannya telah diketahui.
- source_word: οὐκ ἔλαθεν
  choice: perbuatannya tidak luput dari perhatian
  rationale: λανθάνω berarti luput dari perhatian atau tetap tersembunyi. Penambahan 'perbuatannya' memperjelas subjek tersirat secara alami tanpa mengubah makna.
- source_word: τρέμουσα
  choice: dengan gemetar
  rationale: Mempertahankan gambaran keadaan jasmani dan emosional perempuan itu tanpa mempersempitnya menjadi rasa takut saja.
- source_word: προσπεσοῦσα αὐτῷ
  choice: tersungkur di hadapan Yesus
  rationale: προσπίπτω menggambarkan tindakan menjatuhkan diri di hadapan seseorang. Nama 'Yesus' dipakai untuk kejelasan rujukan dalam bahasa Indonesia, sedangkan 'kaki' tidak ditambahkan karena tidak dinyatakan secara eksplisit.
- source_word: δι’ ἣν αἰτίαν
  choice: alasan
  rationale: Ungkapan ini berarti sebab atau alasan. Susunan 'alasan ia menyentuh' alami dan tetap dekat dengan isi Yunani.
- source_word: ἥψατο αὐτοῦ
  choice: ia menyentuh Yesus
  rationale: ἅπτομαι dengan genitif berarti menyentuh. Bentuk lampau dipahami dari konteks naratif bahasa Indonesia tanpa memerlukan penanda aspek tambahan.
- source_word: ἀπήγγειλεν
  choice: menyatakan
  rationale: Kata ini menyatakan tindakan memberitahukan atau melaporkan secara terbuka; 'menyatakan' sesuai dengan suasana publik tanpa berlebihan.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: di depan semua orang
  rationale: Padanan alami untuk 'di hadapan seluruh rakyat/orang banyak' dalam konteks kerumunan yang hadir.
- source_word: ὡς ἰάθη
  choice: bagaimana ia ... disembuhkan
  rationale: ὡς memperkenalkan isi laporannya mengenai bagaimana kesembuhan itu terjadi, sambil mempertahankan bentuk pasif.
- source_word: παραχρῆμα
  choice: seketika itu juga
  rationale: Mengungkapkan terjadinya kesembuhan tanpa jeda dan mempertahankan penekanan Lukas pada kesegeraan.
theological_decisions:
- issue: Sifat tindakan perempuan itu di hadapan Yesus
  choice: Diterjemahkan secara deskriptif sebagai 'tersungkur di hadapan Yesus' dan 'menyatakan'.
  alternative: Menafsirkannya secara eksplisit sebagai penyembahan, pengakuan dosa, atau pertobatan.
  rationale: Teks menggambarkan postur dan laporan publiknya, tetapi tidak secara eksplisit menyebut tindakan itu penyembahan, pengakuan dosa, atau pertobatan. Terjemahan mempertahankan kemungkinan makna penghormatan atau permohonan tanpa menetapkan tafsir teologis tambahan.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang wajar dan bermartabat. Nama 'Yesus' dipakai untuk menghindari rangkaian pronomina yang kurang jelas. Semua penanda catatan kaki dicantumkan dalam teks utama.
