id: LUK.8.1
reference: Luke 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: id
  text: Kemudian Yesus berkeliling kota demi kota dan desa demi desa[a], sambil memberitakan dan menyampaikan kabar baik tentang Kerajaan Allah[b], dan Kedua Belas menyertai Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dari kota ke kota dan dari desa ke desa.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: pemerintahan Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Tidak lama sesudah itu
  rationale: Ungkapan temporal khas Lukas ini memperkenalkan peristiwa berikutnya dalam urutan cerita. Terjemahan ini alami dalam bahasa Indonesia dan menyampaikan kedekatan waktu tanpa mempertahankan formula naratif Yunani secara kaku.
- source_word: αὐτὸς
  choice: Yesus
  rationale: Walaupun bentuk Yunaninya berupa kata ganti, nama Yesus dipakai agar rujukan subjek jelas bagi pembaca Indonesia ketika ayat dibaca tersendiri; tidak ada tuntutan konteks untuk memberi tekanan 'Dia sendiri'.
- source_word: διώδευεν
  choice: berkeliling
  rationale: Bentuk imperfek menunjukkan kegiatan yang berlangsung atau berulang, sedangkan verba tersebut menggambarkan perjalanan melalui berbagai tempat. 'Berkeliling' menyampaikan pola pelayanan itineran secara alami.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: dari kota ke kota dan dari desa ke desa
  rationale: κατά dengan nomina tunggal bersifat distributif dan menunjukkan perpindahan berulang dari satu tempat ke tempat lain.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Pilihan ini mempertahankan gagasan pengumuman di muka umum dan tidak membatasinya pada khotbah formal.
- source_word: εὐαγγελιζόμενος
  choice: menyampaikan kabar baik
  rationale: Terjemahan dibedakan dari κηρύσσων agar kedua partisip tidak dilebur menjadi satu tindakan, sekaligus mempertahankan unsur 'kabar baik' dalam verba Yunani.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: tentang Kerajaan Allah
  rationale: Genitif ini paling wajar dipahami sebagai isi pemberitaan dan kabar baik. 'Kerajaan Allah' merupakan padanan luas yang dapat mencakup pemerintahan maupun ranah kekuasaan Allah.
- source_word: οἱ δώδεκα
  choice: Kedua Belas murid
  rationale: Frasa ini merupakan sebutan kelompok yang sudah dikenal. Penambahan 'murid' memperjelas bentuk bilangan substantival bagi pembaca Indonesia tanpa menyebut mereka 'rasul', yang tidak tertulis dalam ayat ini.
- source_word: σὺν αὐτῷ
  choice: menyertai Dia
  rationale: Padanan ini menyatakan kebersamaan dalam perjalanan secara lebih tepat dan alami daripada sekadar lokasi 'bersama Dia'.
theological_decisions:
- issue: Penerjemahan βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  alternative: pemerintahan Allah
  rationale: '''Kerajaan Allah'' mempertahankan keluasan makna βασιλεία, yang dapat menunjuk pada kuasa pemerintahan maupun wilayah atau tatanan kerajaan, tanpa mempersempitnya pada salah satu nuansa.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lugas bagi pembaca umum. Kapitalisasi 'Kerajaan Allah', 'Kedua Belas', dan kata ganti 'Dia' mengikuti gaya penerbitan Alkitab Indonesia; 'murid' ditambahkan sebagai penjelas alami bagi sebutan kelompok tersebut.
