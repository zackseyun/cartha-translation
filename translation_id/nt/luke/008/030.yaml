id: LUK.8.30
reference: Luke 8:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: id
  text: Lalu Yesus bertanya kepadanya, “Siapa namamu?” Jawabnya, “Legion[a],” sebab banyak roh jahat telah masuk ke dalam dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legion” adalah kata pinjaman dari bahasa Latin yang menunjuk pada satuan besar dalam angkatan darat Romawi. Di sini nama itu menunjukkan bahwa banyak roh jahat berada dalam diri orang tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: bertanya
  rationale: Dalam narasi ini, verba tersebut memperkenalkan pertanyaan langsung; “bertanya” merupakan padanan alami dan tepat dalam bahasa Indonesia modern.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai kelanjutan alur narasi tanpa pertentangan yang kuat; “lalu” menyampaikan peralihan tersebut secara wajar.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Siapa namamu?
  rationale: Ungkapan Yunani ini menanyakan nama seseorang. “Siapa namamu?” adalah bentuk idiomatis dan alami dalam bahasa Indonesia.
- source_word: Λεγιών
  choice: Legion
  rationale: Istilah ini dipertahankan sebagai sebutan yang berasal dari nama satuan militer Romawi dan dijelaskan dalam catatan kaki.
- source_word: ὅτι
  choice: sebab
  rationale: Konjungsi ini menyatakan alasan mengapa jawaban yang diberikan adalah “Legion.”
- source_word: εἰσῆλθεν
  choice: telah masuk
  rationale: Bentuk aoristus menyatakan peristiwa masuknya roh-roh jahat yang mendahului penjelasan mengenai nama itu; “telah masuk” memperjelas hubungan waktunya tanpa berlebihan.
- source_word: δαιμόνια πολλὰ
  choice: banyak roh jahat
  rationale: Dalam bahasa Indonesia umum, “roh jahat” secara jelas dan alami merujuk pada makhluk rohani jahat yang dimaksud oleh δαιμόνια, sedangkan “banyak” mempertahankan penekanan pada jumlahnya.
- source_word: εἰς αὐτόν
  choice: ke dalam dirinya
  rationale: Frasa ini mempertahankan daya arah εἰς, yaitu gerakan masuk ke dalam orang tersebut.
theological_decisions:
- issue: Penyebutan δαιμόνια dalam konteks kerasukan
  choice: roh jahat
  alternative: setan-setan
  rationale: “Roh jahat” mempertahankan rujukan kepada makhluk rohani jahat yang personal dan lazim dipahami pembaca Indonesia, tanpa melunakkan klaim adikodrati teks. Pilihan ini juga menghindari kemungkinan “setan” dipahami secara khusus sebagai nama diri Iblis.
- issue: Hubungan waktu εἰσῆλθεν dengan jawaban “Legion”
  choice: telah masuk
  alternative: masuk
  rationale: “Telah masuk” menunjukkan secara alami bahwa masuknya banyak roh jahat mendahului pemberian jawaban tersebut; ini merupakan penjelasan hubungan waktu, bukan tambahan doktrinal.
translation_notes:
  register: Bahasa naratif dibuat ringkas, modern, dan bermartabat. “Jawabnya” dipakai agar alur dialog tetap lancar. Sebutan “Legion” dipertahankan dan diberi penjelasan budaya dalam catatan kaki.
