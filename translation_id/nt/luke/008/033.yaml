  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: id
  text: Lalu roh-roh jahat itu keluar dari orang itu dan masuk ke dalam babi-babi. Kawanan itu pun meluncur deras menuruni lereng curam[a] ke dalam danau lalu mati tenggelam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menuruni tebing" atau "melewati tubir"; kata Yunani menunjukkan turunan yang terjal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: keluar
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama; susunan klausa bahasa Indonesia secara alami menyampaikan urutan itu tanpa perlu memakai bentuk harfiah yang kaku.
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: Dalam bahasa Indonesia modern, 'roh-roh jahat' merupakan padanan alami bagi makhluk adikodrati jahat yang dimaksud δαιμόνια. Pilihan ini tidak menyamakannya dengan manusia yang dirasuki.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: dari orang tersebut
  rationale: Frasa ini merujuk kepada orang yang telah disebut dalam konteks sebelumnya. 'Orang tersebut' mempertahankan rujukan tunggal tanpa menjadikan jenis kelaminnya lebih menonjol daripada yang diperlukan dalam bahasa Indonesia.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: masuk ke dalam babi-babi
  rationale: Padanan ini mempertahankan gerak masuk ke hewan-hewan tersebut dan terdengar wajar dalam bahasa Indonesia.
- source_word: τοὺς χοίρους
  choice: babi-babi
  rationale: Bentuk ulang menyatakan jamak secara jelas dan memakai istilah modern yang umum.
- source_word: ὥρμησεν
  choice: menyerbu
  rationale: Verba ini menyampaikan gerakan yang mendadak dan kuat, tanpa menambahkan motif kawanan itu.
- source_word: ἡ ἀγέλη
  choice: kawanan babi itu
  rationale: Pengulangan 'babi' memperjelas rujukan kolektif dan menghasilkan ungkapan Indonesia yang alami.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: menuruni lereng yang curam
  rationale: Frasa ini menyatakan gerakan menurun pada tempat terjal, tetapi tidak memastikan bahwa bentuknya tebing tegak lurus.
- source_word: τὴν λίμνην
  choice: danau
  rationale: λίμνη secara khusus berarti danau; pilihan ini mempertahankan perbedaan leksikal dari kata Yunani yang lazim berarti laut.
- source_word: ἀπεπνίγη
  choice: tenggelam
  rationale: Dalam konteks kawanan yang masuk ke danau, verba pasif aoris ini menunjukkan bahwa kawanan itu mati karena terendam. 'Tenggelam' ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan δαιμόνια dalam kisah kerasukan
  choice: roh-roh jahat
  alternative: setan-setan
  rationale: Kedua padanan dapat menunjuk makhluk adikodrati jahat, tetapi 'roh-roh jahat' lebih alami bagi pembaca Indonesia modern dan tidak mencampuradukkan bentuk jamak δαιμόνια dengan nama atau gelar tunggal Iblis. Pilihan ini tetap mempertahankan pelaku sebagai makhluk jahat yang keluar dan masuk.
- issue: Tingkat kekhususan κρημνός
  choice: lereng yang curam
  alternative: tebing; jurang terjal
  rationale: Kata Yunani menunjukkan turunan yang terjal, tetapi tidak mengharuskan gambaran tebing yang tegak lurus. Terjemahan mempertahankan ketidakpastian topografinya.
- issue: Bentuk akhir ἀπεπνίγη
  choice: tenggelam
  alternative: mati tenggelam; ditenggelamkan
  rationale: Konteks menunjukkan kematian di air, tetapi bentuk Indonesia 'ditenggelamkan' dapat menyiratkan pelaku yang sengaja menenggelamkan. 'Tenggelam' menyampaikan hasilnya tanpa menambahkan kausalitas teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur dua kalimat menghindari rangkaian klausa yang terlalu panjang, sedangkan partikel 'pun' menandai perkembangan peristiwa secara alami. Penanda catatan kaki [a] ditempatkan langsung setelah frasa topografis yang dijelaskannya.
