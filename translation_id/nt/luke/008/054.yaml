base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: id
  text: Namun, Yesus memegang tangan anak itu dan berseru, “Nak[a], bangunlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Anak perempuan.” Kata Yunani παῖς dapat berarti “anak” atau, dalam konteks ini, “anak perempuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Namun, Yesus
  rationale: δέ menandai peralihan yang agak kontras dengan reaksi orang-orang sebelumnya. Nama “Yesus” dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia, tanpa menambahkan penekanan “Ia sendiri” yang tidak perlu.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: memegang tangan anak itu
  rationale: Ungkapan ini menyatakan tindakan nyata memegang tangannya. Bentuk Indonesia ini alami dan tidak memberi kesan keras seperti “mencengkeram” atau “meraih dengan paksa”.
- source_word: ἐφώνησεν λέγων
  choice: berseru
  rationale: φωνέω menunjukkan panggilan yang terdengar jelas. “Berseru” menyampaikan kuatnya suara, sedangkan λέγων tidak perlu diterjemahkan secara terpisah sebelum kutipan langsung karena akan terasa berlebihan dalam bahasa Indonesia.
- source_word: Ἡ παῖς
  choice: Nak
  rationale: παῖς dapat berarti “anak” dan dalam konteks ini merujuk kepada seorang anak perempuan. Sapaan “Nak” terdengar alami, lembut, dan tetap mempertahankan keluasan leksikal kata Yunani tanpa mengimpor bentuk diminutif dari kisah paralel.
- source_word: ἔγειρε
  choice: bangunlah
  rationale: Imperatif ini dapat berarti bangun atau berdiri. “Bangunlah” merupakan perintah langsung yang alami dalam bahasa Indonesia dan sesuai dengan konteks pemulihan hidup, tanpa memakai ungkapan arkais.
theological_decisions:
- issue: Sapaan Yesus kepada anak perempuan itu
  choice: Nak
  alternative: Anak perempuan
  rationale: Kata παῖς memiliki cakupan “anak” dan, menurut konteks, “anak perempuan.” “Nak” mempertahankan nuansa sapaan yang lembut serta sebagian ambiguitas leksikalnya; catatan kaki menjelaskan alternatif yang lebih spesifik tanpa menyelaraskannya dengan kisah paralel.
- issue: Perintah kepada anak yang telah meninggal
  choice: bangunlah
  alternative: berdirilah
  rationale: ἐγείρω dapat menggambarkan bangun, berdiri, atau dibangkitkan. Dalam ujaran langsung ini, “bangunlah” terdengar wajar dan tetap mempertahankan daya makna yang sesuai dengan tindakan Yesus menghidupkannya kembali, tanpa menjelaskan mekanisme teologis secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Nak” dipilih sebagai sapaan alami; “bangunlah” mempertahankan bentuk perintah langsung. Partisipel λέγων tidak diterjemahkan dengan “dengan berkata” karena kutipan langsung sudah menjalankan fungsi tersebut.
