  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: id
  text: Lalu ibu dan saudara-saudara laki-laki Yesus[b] datang kepada-Nya, tetapi mereka tidak dapat menemui-Nya[a] karena orang banyak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertemu dengan-Nya” atau “sampai kepada-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Yunani “saudara-saudara laki-laki”; ada yang memahaminya secara lebih luas sebagai “kerabat” atau “sanak saudara,” tetapi teks itu sendiri mengatakan “saudara-saudara laki-laki.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ
  choice: Lalu ... datang
  rationale: δέ melanjutkan alur kisah, sedangkan παραγίνομαι menyatakan kedatangan. Bentuk Indonesia disesuaikan secara wajar dengan subjek majemuk.
- source_word: πρὸς αὐτὸν
  choice: kepada-Nya
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: ἡ μήτηρ
  choice: ibu ... Yesus
  rationale: μήτηρ adalah istilah kekerabatan yang langsung. Nama Yesus dipakai untuk memperjelas pemilik dalam bahasa Indonesia karena ayat yang berdiri sendiri tidak menyebut nama pada frasa Yunani ini.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara laki-laki Yesus
  rationale: ἀδελφοί berbentuk jamak maskulin. Pilihan ini mempertahankan rujukan gender teks dan tidak memperluasnya menjadi saudara laki-laki dan perempuan atau kerabat.
- source_word: οὐκ ἠδύναντο
  choice: mereka tidak dapat
  rationale: Imperfek δύναμαι menyatakan ketidakmampuan; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: συντυχεῖν αὐτῷ
  choice: menemui-Nya
  rationale: συντυγχάνω dapat berarti bertemu atau berhasil sampai kepada seseorang. 'Menemui-Nya' alami dalam konteks mereka terhalang orang banyak, sementara alternatif dicatat untuk mempertahankan rentang makna.
- source_word: διὰ τὸν ὄχλον
  choice: karena orang banyak itu
  rationale: διά dengan akusatif menyatakan sebab. 'Orang banyak itu' merujuk kepada kerumunan yang sudah hadir dalam konteks.
theological_decisions:
- issue: Hubungan yang dimaksud oleh οἱ ἀδελφοὶ αὐτοῦ
  choice: saudara-saudara laki-laki Yesus
  alternative: kerabat atau sanak saudara Yesus
  rationale: Teks menyebut ἀδελφοί, yang secara lazim berarti saudara-saudara laki-laki, tetapi tidak menjelaskan lebih jauh apakah mereka saudara kandung, saudara tiri, atau kerabat dalam pengertian lain. Terjemahan tidak memutuskan perdebatan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina ilahi dipakai menurut kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan hubungan sebab-akibat atau mempersempit perdebatan tentang identitas saudara-saudara Yesus.
