  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: id
  text: Lalu murid-murid-Nya bertanya kepada-Nya apa arti perumpamaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “perumpamaan itu apa kiranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: bertanya
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang pada masa lampau; dalam bahasa Indonesia, bentuk sederhana “bertanya” paling alami dalam alur narasi.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel penghubung ringan ini meneruskan alur cerita tanpa menekankan pertentangan.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: murid-murid-Nya
  rationale: Padanan baku dan alami yang mempertahankan hubungan para μαθηταί dengan Yesus.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: apa arti perumpamaan itu
  rationale: Secara harfiah konstruksi ini menanyakan perumpamaan itu ‘apa kiranya’; dalam konteks, para murid meminta penjelasan maknanya. “Apa arti” menyampaikan maksud tersebut secara alami tanpa memasukkan tafsiran tambahan.
- source_word: παραβολή
  choice: perumpamaan
  rationale: Istilah baku dalam bahasa Indonesia untuk bentuk pengajaran ini dan tepat dalam konteks Injil.
- source_word: εἴη
  choice: arti
  rationale: Optatif dalam pertanyaan tidak langsung sesudah verba lampau dapat diterjemahkan secara idiomatis sebagai permintaan akan arti, sementara nuansa harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Bentuk sapaan “-Nya” mengikuti kebiasaan penulisan Alkitab bahasa Indonesia; “perumpamaan itu” lebih alami daripada “perumpamaan ini” karena merujuk kembali pada perumpamaan yang baru disampaikan.
