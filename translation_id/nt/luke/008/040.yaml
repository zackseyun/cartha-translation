id: LUK.8.40
reference: Luke 8:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: id
  text: Ketika Yesus kembali, orang banyak menyambut-Nya[a], sebab mereka semua sedang menantikan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerima-Nya”; kata Yunani yang dipakai dapat berarti menerima atau menyambut, dan dalam konteks ini bernuansa positif.
    reason: lexical_alternative
  - marker: b
    text: Atau “sedang mengharapkan kedatangan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Ketika ... kembali
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan waktu dan secara alami diterjemahkan “ketika”. Partikel δέ menandai kelanjutan narasi, tetapi tidak perlu diterjemahkan dengan kata penghubung tersendiri dalam bahasa Indonesia.
- source_word: ὑποστρέφειν
  choice: kembali
  rationale: ὑποστρέφω berarti kembali atau pulang. “Kembali” ringkas, wajar, dan sesuai dengan konteks kepulangan Yesus.
- source_word: ἀπεδέξατο
  choice: menyambut-Nya
  rationale: ἀποδέχομαι dapat berarti menerima atau menyambut; dalam konteks orang banyak yang telah menunggu Yesus, “menyambut” menyampaikan nuansa penerimaan yang positif tanpa menambahkan keterangan seperti “dengan gembira” yang tidak dinyatakan dalam teks.
- source_word: ὁ ὄχλος
  choice: orang banyak
  rationale: ὄχλος menunjuk kepada sekumpulan orang. “Orang banyak” merupakan ungkapan Indonesia yang alami dan lazim dalam narasi Alkitab.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: sebab mereka semua sedang menantikan-Nya
  rationale: γάρ memperkenalkan alasan bagi sambutan orang banyak. Bentuk perifrastis ἦσαν ... προσδοκῶντες menyatakan tindakan yang sedang berlangsung; “sedang menantikan” mempertahankan aspek itu. πάντες diterjemahkan secara eksplisit sebagai “semua”.
- source_word: Ἰησοῦν
  choice: Yesus
  rationale: Nama diri ditransliterasikan menurut bentuk baku bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “menantikan” dipilih karena alami sekaligus mempertahankan gagasan penantian yang berlangsung. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penulisan Alkitab bahasa Indonesia.
