  to: Ketika ia melihat Yesus, ia berteriak, jatuh tersungkur di hadapan-Nya, lalu berkata dengan suara keras, “Apa urusan-Mu denganku[a], Yesus, Anak Allah Yang Mahatinggi? Aku mohon kepada-Mu, jangan menyiksa aku!”
