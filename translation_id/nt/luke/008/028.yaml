  terminology: “Yesus, Anak Allah Yang Mahatinggi” adalah terjemahan yang tepat dan mapan untuk υἱὲ τοῦ θεοῦ τοῦ ὑψίστου. Kapitalisasi pronomina bagi Yesus konsisten dengan konvensi penerbitan Alkitab Indonesia. Catatan kaki mempertahankan bentuk idiomatis yang disengketakan/lebih literal tanpa memaksakan tafsiran.
