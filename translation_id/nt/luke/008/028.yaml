id: LUK.8.28
reference: Luke 8:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: id
  text: Ketika ia melihat Yesus, ia berteriak, jatuh tersungkur di hadapan-Nya, lalu berkata dengan suara keras, “Apa urusan-Mu denganku[a], Yesus, Anak Allah Yang Mahatinggi? Aku mohon kepada-Mu, jangan menyiksa aku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Apa yang ada di antara aku dan Engkau?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika melihat
  rationale: Partisip aoris ini menyatakan keadaan yang mendahului tindakan utama. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan waktunya.
- source_word: ἀνακράξας
  choice: ia berteriak
  rationale: Kata ini menggambarkan seruan keras yang tiba-tiba. Pilihan ini tidak meleburkannya dengan frasa φωνῇ μεγάλῃ yang muncul kemudian.
- source_word: προσέπεσεν αὐτῷ
  choice: jatuh tersungkur di hadapan-Nya
  rationale: προσπίπτω berarti jatuh di hadapan seseorang, biasanya dalam sikap tunduk atau terdesak. 'Di hadapan-Nya' tetap dekat dengan bentuk Yunani tanpa menambahkan keterangan 'di kaki-Nya'.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara keras
  rationale: Datif ini menyatakan cara atau sarana. Terjemahan tersebut mempertahankan gambaran konkret dan penekanan teks Yunani.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Apa urusan-Mu denganku
  rationale: Idiom yang dipengaruhi bahasa Semit ini menyatakan penolakan hubungan atau campur tangan. Bentuk yang dipilih alami dan konfrontatif dalam bahasa Indonesia; bentuk yang lebih harfiah dicantumkan dalam catatan kaki.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Anak Allah Yang Mahatinggi
  rationale: Susunan genitif ini dipahami sebagai gelar bagi Allah. Terjemahan mempertahankan pengakuan terhadap identitas Yesus tanpa menambahkan penjelasan doktrinal.
- source_word: δέομαί σου
  choice: Aku mohon kepada-Mu
  rationale: Bentuk ini menyampaikan permohonan yang sungguh-sungguh dan mendesak. Pilihan tersebut alami serta bermartabat dalam bahasa Indonesia modern.
- source_word: μή με βασανίσῃς
  choice: jangan siksa aku
  rationale: βασανίζω dapat berarti menyiksa atau menimpakan penderitaan berat. 'Siksa' sesuai dengan konteks pengusiran roh jahat tanpa membatasinya pada penyiksaan fisik.
theological_decisions:
- issue: Pengungkapan pengakuan roh itu mengenai identitas Yesus
  choice: Yesus, Anak Allah Yang Mahatinggi
  alternative: Yesus, Anak dari Allah Yang Mahatinggi
  rationale: Pilihan ini mempertahankan sepenuhnya sapaan kristologis dalam teks, tanpa melunakkannya ataupun mengembangkannya menjadi rumusan doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital mengikuti kelaziman luas dalam penerbitan Alkitab bahasa Indonesia. Tanda [a] ditempatkan pada idiom yang dijelaskan oleh catatan kaki.
