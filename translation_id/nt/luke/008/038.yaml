  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: id
  text: Laki-laki yang dari dalam dirinya roh-roh jahat itu telah keluar memohon kepada Yesus agar ia boleh berada bersama-Nya. Namun Yesus menyuruhnya pergi sambil berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: memohon
  rationale: Bentuk imperfek δέομαι menggambarkan permohonan yang sungguh-sungguh dan berlangsung; “memohon” alami dalam bahasa Indonesia tanpa melebihkan menjadi “mengemis”.
- source_word: αὐτοῦ
  choice: kepada Yesus
  rationale: Genitif sesudah δέομαι menunjuk kepada orang yang dimintai. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ὁ ἀνὴρ
  choice: orang
  rationale: ἀνήρ merujuk kepada laki-laki yang telah dibebaskan dalam konteks sebelumnya. “Orang” menghasilkan frasa relatif yang lebih alami di sini, sementara identitas tokoh tetap jelas dari konteks.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: yang telah ditinggalkan roh-roh jahat itu
  rationale: Bentuk pluperfek menyatakan tindakan yang telah selesai sebelum permohonan itu. Susunan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa roh-roh tersebut keluar darinya.
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: Dalam pemakaian Perjanjian Baru, δαιμόνια menunjuk kepada makhluk roh jahat. Pilihan ini mempertahankan klaim supernatural teks dan merupakan ungkapan Indonesia yang luas dipahami.
- source_word: εἶναι σὺν αὐτῷ
  choice: agar ia boleh menyertai-Nya
  rationale: Secara harfiah berarti “untuk bersama dengan-Nya.” Dalam konteks perjalanan Yesus, “menyertai-Nya” menyampaikan maksud permohonan secara alami tanpa menentukan apakah kebersamaan itu sementara atau tetap.
- source_word: ἀπέλυσεν ... αὐτὸν
  choice: Yesus menyuruhnya pergi
  rationale: ἀπολύω di sini berarti menolak permohonannya dan menyuruhnya kembali, sebagaimana diperjelas ayat berikutnya. Ungkapan ini lebih alami daripada “melepaskannya” dan tidak memberi kesan kasar seperti “mengusirnya”.
- source_word: λέγων
  choice: dengan berkata
  rationale: Partisipel kini memperkenalkan ucapan langsung yang berlanjut pada ayat berikutnya; “dengan berkata” mempertahankan hubungan sintaksis tersebut.
theological_decisions:
- issue: Makna δαιμόνια dalam konteks pengusiran roh
  choice: roh-roh jahat
  alternative: setan-setan
  rationale: Teks menggambarkan entitas roh yang keluar dari orang itu. “Roh-roh jahat” mempertahankan keberadaan personal dan supernatural yang diasumsikan narasi tanpa melunakkannya menjadi keadaan psikologis.
- issue: Makna εἶναι σὺν αὐτῷ
  choice: menyertai-Nya
  alternative: bersama-sama dengan-Nya
  rationale: “Menyertai-Nya” cocok dengan konteks perjalanan, tetapi tidak menambahkan status formal sebagai murid; ambiguitas mengenai bentuk kebersamaan yang diminta tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rujukan “Yesus” dan “ia” diperjelas agar dua tokoh laki-laki tidak tertukar. Akhiran “-Nya” mengikuti kebiasaan penulisan Alkitab Indonesia untuk rujukan kepada Yesus. Koma penutup dipertahankan karena ucapan langsung dimulai pada ayat berikutnya.
