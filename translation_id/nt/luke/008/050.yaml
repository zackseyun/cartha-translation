  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: id
  text: Tetapi Yesus, setelah mendengar itu, menjawabnya, “Jangan takut; percayalah saja[a], dan ia akan diselamatkan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berimanlah saja” atau “percayalah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ia akan disembuhkan” atau “ia akan dipulihkan.” Kata Yunani ini dapat berarti menyelamatkan, melepaskan dari bahaya, atau menyembuhkan; dalam konteks ini maknanya mencakup pemulihan dari kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ketika ... mendengar hal itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului jawaban Yesus. Frasa “hal itu” menyatakan objek yang tersirat dari konteks tanpa menambahkan isi baru.
- source_word: ἀπεκρίθη αὐτῷ
  choice: Ia menjawab kepadanya
  rationale: Menerjemahkan verba dan objek datif secara langsung serta tetap alami dalam bahasa Indonesia.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Larangan ini ringkas, wajar, dan mempertahankan bobot perintah Yesus.
- source_word: μόνον πίστευσον
  choice: percaya saja
  rationale: “Saja” secara alami menyampaikan pembatasan μόνον, sedangkan “percaya” menerjemahkan bentuk verbal πιστεύω tanpa membatasinya pada persetujuan intelektual semata.
- source_word: σωθήσεται
  choice: ia akan diselamatkan
  rationale: Bentuk pasif mendatang dari σῴζω dipertahankan dengan istilah luas “diselamatkan”, yang dapat mencakup penyelamatan, kesembuhan, dan pemulihan hidup dalam konteks ini.
theological_decisions:
- issue: Makna πιστεύω dalam perintah Yesus
  choice: percaya saja
  alternative: beriman saja; tetaplah percaya
  rationale: “Percaya” merupakan padanan verbal yang langsung dan alami. Catatan kaki mempertahankan nuansa iman atau kepercayaan yang bersandar, sehingga perintah itu tidak dipersempit menjadi sekadar menerima suatu fakta secara intelektual.
- issue: Makna σωθήσεται dalam konteks anak Yairus
  choice: ia akan diselamatkan
  alternative: ia akan disembuhkan; ia akan dipulihkan
  rationale: Padanan utama mempertahankan keluasan makna σῴζω dan kemungkinan gema teologisnya. Alternatif yang lebih khusus pada pemulihan fisik dicatat tanpa meniadakan ketegangan makna dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menandai tanggapan Yesus yang berlawanan dengan berita sebelumnya. Pronomina “ia” mempertahankan subjek perempuan yang tersirat dalam bentuk verba Yunani tanpa mengulang “anak perempuanmu” yang tidak dinyatakan dalam ayat ini.
