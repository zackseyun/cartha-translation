  to: Lalu orang memberitahukan kepada Yesus, “Ibu-Mu dan saudara-saudara laki-laki-Mu sedang berdiri di luar dan ingin melihat-Mu.”
  rationale: Revisi mengganti “bertemu dengan-Mu” dengan “melihat-Mu” agar padanan ἰδεῖν tetap setia pada arti dasarnya dan pada jejak audit bahasa Inggris. Urutan unsur dalam frasa “saudara-saudara laki-laki-Mu” diperbaiki demi kelancaran bahasa Indonesia, tanpa mengubah cakupan atau implikasi teologisnya. Catatan kaki diselaraskan dengan frasa terjemahan utama.
