base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: id
  text: Lalu orang memberitahukan kepada Yesus, “Ibu-Mu dan saudara-saudara laki-laki-Mu sedang berdiri di luar dan ingin melihat-Mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: orang memberitahukan kepada Yesus
  rationale: Bentuk pasif Yunani menyatakan bahwa suatu kabar disampaikan kepadanya. Bahasa Indonesia lebih alami memakai konstruksi aktif tak tentu dengan “orang”; nama Yesus memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini merupakan penghubung ringan yang melanjutkan alur cerita; “lalu” wajar dalam narasi Indonesia dan tidak memberi pertentangan yang tidak ada.
- source_word: μήτηρ
  choice: Ibu
  rationale: “Ibu” merupakan padanan baku, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: ἀδελφοί
  choice: saudara-saudara-Mu laki-laki
  rationale: Ungkapan ini mempertahankan bentuk jamak maskulin dan makna lazim kata Yunani, sekaligus menghindari anggapan bahwa yang dimaksud mencakup saudara perempuan.
- source_word: ἑστήκασιν
  choice: sedang berdiri
  rationale: Bentuk perfektum memiliki daya keadaan kini; “sedang berdiri” menyampaikan keadaan mereka pada saat laporan diberikan secara alami.
- source_word: ἔξω
  choice: di luar
  rationale: Padanan ruang yang langsung dan tidak menambahkan lokasi yang tidak dinyatakan dalam teks.
- source_word: ἰδεῖν
  choice: bertemu dengan
  rationale: Secara harfiah berarti “melihat”, tetapi dalam konteks orang yang datang mencari seseorang, “bertemu dengan” menyampaikan maksud idiomatisnya dengan alami dalam bahasa Indonesia.
- source_word: θέλοντες
  choice: ingin
  rationale: Menyatakan kehendak yang berlangsung bersamaan dengan keadaan berdiri di luar.
theological_decisions:
- issue: Hubungan saudara-saudara laki-laki itu dengan Yesus
  choice: Menerjemahkan ἀδελφοί sebagai “saudara-saudara-Mu laki-laki” tanpa memperluas atau mempersempit hubungan kekerabatannya.
  alternative: Kerabat-kerabat-Mu
  rationale: Kata Yunani biasanya berarti saudara laki-laki, tetapi dapat dipakai lebih luas dalam konteks tertentu. Terjemahan utama mempertahankan arti lazim, sementara catatan mengakui kemungkinan leksikal tanpa memutuskan perdebatan teologis mengenai keluarga Yesus.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Sapaan kepada Yesus memakai kapital hormat sesuai konvensi penerbitan Alkitab Indonesia. Struktur pasif Yunani dialihkan menjadi konstruksi aktif tak tentu agar tidak kaku.
