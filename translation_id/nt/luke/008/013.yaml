  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: id
  text: Yang di atas batu ialah orang-orang yang, ketika mendengar firman itu, menerimanya dengan sukacita. Namun, mereka tidak mempunyai akar. Mereka percaya untuk sementara waktu, tetapi pada masa ujian[a] mereka berpaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pencobaan”, “kesukaran”, atau “godaan”. Kata Yunani yang digunakan dapat berarti ujian, kesukaran, atau godaan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: jatuh di atas batu
  rationale: Frasa ini mempertahankan gambaran konkret tentang benih dalam perumpamaan. Kata 'jatuh' ditambahkan secara wajar dari konteks penaburan agar rujukannya jelas dalam bahasa Indonesia.
- source_word: ἀκούσωσιν
  choice: mendengar
  rationale: Bentuk dengan ὅταν menyatakan keadaan umum; 'ketika mendengar' alami dalam bahasa Indonesia dan tidak menambahkan gagasan perhatian yang berkelanjutan.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Padanan langsung dan bermartabat yang mempertahankan daya emosional frasa Yunani.
- source_word: δέχονται τὸν λόγον
  choice: menerima firman itu
  rationale: '''Menerima'' mencerminkan δέχομαι, sedangkan ''firman'' mempertahankan idiom Alkitab bagi λόγος. Kata tunjuk ''itu'' mengacu pada firman yang didengar.'
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: mereka tidak berakar
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan metafora akar, walaupun mengubah konstruksi nominal Yunani menjadi verba.
- source_word: πρὸς καιρὸν
  choice: untuk sementara waktu
  rationale: Menyatakan durasi terbatas secara jelas tanpa menafsirkan sifat iman tersebut.
- source_word: πιστεύουσιν
  choice: mereka percaya
  rationale: Padanan netral dan langsung yang tidak menentukan apakah iman itu sejati, semu, atau menyelamatkan.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: pada masa pencobaan
  rationale: Dalam bahasa Indonesia, 'pencobaan' dapat mencakup ujian, kesukaran, maupun godaan; catatan kaki menjaga keluasan makna πειρασμός.
- source_word: ἀφίστανται
  choice: mereka meninggalkan iman
  rationale: Dalam konteks orang yang sebelumnya percaya, frasa ini menyampaikan tindakan menjauh atau murtad secara jelas. 'Iman' merupakan pelengkap kontekstual, bukan penetapan mengenai hakikat iman sebelumnya.
theological_decisions:
- issue: Apakah πιστεύουσιν menyatakan iman yang sungguh-sungguh menyelamatkan atau kepercayaan yang dangkal
  choice: mereka percaya
  alternative: mereka tampaknya percaya; mereka percaya secara dangkal; mereka sungguh percaya lalu murtad
  rationale: Teks mengatakan bahwa mereka percaya untuk sementara waktu lalu meninggalkan iman, tetapi tidak menyelesaikan perdebatan teologis tentang ketekunan, kemurtadan, atau hakikat iman yang menyelamatkan.
- issue: Cakupan makna πειρασμός
  choice: pencobaan, dengan catatan kaki yang mencakup ujian dan godaan
  alternative: ujian; kesukaran; godaan
  rationale: Istilah Yunani dapat menunjuk pada ujian atau kesukaran dari luar maupun godaan. Terjemahan dan catatan kaki mempertahankan keluasan ini.
- issue: Daya teologis ἀφίστανται
  choice: meninggalkan iman
  alternative: berpaling; menjauh; murtad
  rationale: Pilihan ini mempertahankan keseriusan tindakan meninggalkan kepercayaan yang baru disebutkan, tanpa memakai istilah teknis 'murtad' atau memutuskan status keselamatan mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora batu dan akar serta ketegangan teologis dalam teks.
