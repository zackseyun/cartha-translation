  source_fidelity: Revisi diperlukan pada dua titik. Frasa ἐπὶ τῆς πέτρας secara eliptis menunjuk kepada benih/orang yang “di atas batu”; penambahan “jatuh” dapat dipahami dari konteks perumpamaan, tetapi tidak dinyatakan dalam ayat ini. Selain itu, ἀφίστανται tidak menyebut objek “iman”; “meninggalkan iman” memperjelas secara teologis melebihi bentuk eksplisit teks. “Berpaling” mempertahankan tindakan meninggalkan yang tersirat tanpa menambahkan objek.
  naturalness: Teks revisi memakai Bahasa Indonesia baku dan lancar. “Yang di atas batu” mempertahankan elipsis perumpamaan yang lazim dan jelas melalui predikat “ialah orang-orang.” “Tidak mempunyai akar” menyatakan metafora Yunani secara langsung dan alami. “Pada masa ujian” mencakup arti luas πειρασμός dengan lebih netral daripada “pencobaan” sebagai teks utama.
  terminology: “Firman” untuk λόγος dan “percaya” untuk πιστεύουσιν sesuai register Alkitab Indonesia serta tidak memutuskan sifat teologis iman itu. “Ujian” untuk πειρασμός sejalan dengan arti utama “testing”; catatan kaki mempertahankan kemungkinan “pencobaan,” “kesukaran,” dan “godaan.” “Berpaling” untuk ἀφίστανται menghindari istilah teknis dan tidak memaksakan pembacaan denominasi.
