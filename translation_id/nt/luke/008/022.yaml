base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: id
  text: Pada suatu hari, ia dan murid-muridnya naik ke sebuah perahu. Ia berkata kepada mereka, “Mari kita menyeberang ke seberang danau[a].” Lalu mereka pun bertolak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mari kita menyeberang ke sisi lain danau.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Yunani yang dipakai di sini dapat berarti “bertolak,” “mulai berlayar,” atau “bergerak menjauh dari daratan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν μιᾷ τῶν ἡμερῶν
  choice: Pada salah satu hari itu
  rationale: Ungkapan ini memperkenalkan sebuah peristiwa pada waktu yang tidak ditentukan dalam suatu rangkaian hari yang sudah diketahui. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna partitifnya tanpa memakai ungkapan arkais seperti “terjadilah”.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ia naik ke sebuah perahu bersama murid-muridnya
  rationale: “Naik ke sebuah perahu” merupakan ungkapan Indonesia yang wajar untuk tindakan memasuki perahu. “Bersama murid-muridnya” menyampaikan secara alami bahwa ia dan para murid sama-sama naik, tanpa memberi tekanan berlebihan pada αὐτός.
- source_word: εἶπεν πρὸς αὐτούς
  choice: Ia berkata kepada mereka
  rationale: Padanan langsung dan wajar bagi konstruksi λέγω dengan πρός.
- source_word: Διέλθωμεν
  choice: Mari kita menyeberang
  rationale: Subjungtif orang pertama jamak ini berfungsi sebagai ajakan. “Mari kita” mempertahankan sifat inklusif ajakan tersebut, sedangkan “menyeberang” menyampaikan arah geraknya.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: ke seberang danau
  rationale: “Seberang danau” adalah ungkapan Indonesia yang alami bagi sisi lain atau sisi jauh danau. “Danau” menerjemahkan λίμνη secara khusus dan tidak mengubahnya menjadi laut.
- source_word: ἀνήχθησαν
  choice: mereka pun bertolak
  rationale: Dalam konteks pelayaran, ἀνάγω berarti mulai berlayar atau membawa perahu menjauh dari daratan. “Bertolak” ringkas, lazim, dan tidak menyiratkan bahwa mereka berada di laut.
