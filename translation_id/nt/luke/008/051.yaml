  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: id
  text: Ketika Yesus masuk ke dalam rumah itu, Ia tidak mengizinkan siapa pun masuk bersama-Nya, kecuali Petrus, Yohanes, Yakobus, serta ayah dan ibu anak perempuan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Ketika tiba di rumah itu
  rationale: Partisip aoris menyatakan latar waktu bagi tindakan utama. Nama Yesus disebut pada klausa berikutnya agar subjek tetap jelas dalam bahasa Indonesia. οἰκίαν diterjemahkan 'rumah itu' karena menunjuk rumah yang menjadi tujuan dalam konteks.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: tidak mengizinkan ... masuk
  rationale: ἀφίημι dalam konstruksi ini berarti mengizinkan atau membiarkan, sedangkan infinitif εἰσελθεῖν menyatakan tindakan yang tidak diizinkan.
- source_word: τινα σὺν αὐτῷ
  choice: seorang pun masuk bersama-Nya
  rationale: Dalam lingkup negasi, τινα memiliki daya tak tentu yang wajar diterjemahkan 'seorang pun'. Frasa σὺν αὐτῷ dikaitkan dengan tindakan masuk.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Sesudah pernyataan negatif, frasa ini memperkenalkan orang-orang yang dikecualikan dari larangan.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Petrus, Yohanes, Yakobus
  rationale: Nama-nama memakai bentuk Indonesia yang sudah lazim. Daftar disajikan dengan tanda koma agar alami dalam bahasa Indonesia.
- source_word: τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα
  choice: serta ayah dan ibu anak perempuan itu
  rationale: παῖς secara leksikal dapat berarti anak, anak laki-laki, atau anak perempuan; konteks langsung mengidentifikasinya sebagai anak perempuan Yairus. 'Ayah dan ibu' mempertahankan penyebutan kedua orang tua secara tersendiri.
theological_decisions:
- issue: Kekhususan makna παῖς dalam konteks
  choice: anak perempuan itu
  alternative: anak itu
  rationale: Konteks narasi secara eksplisit menyatakan bahwa anak tersebut perempuan. Pilihan ini memperjelas rujukan tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama Yesus dinyatakan sebagai subjek untuk menghindari rujukan pronominal yang kabur. Bentuk hormat '-Nya' mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
