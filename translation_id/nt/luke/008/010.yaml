  source_fidelity: 'Draf pada umumnya setia: kontras antara para murid dan yang lain, istilah μυστήρια, serta ketegangan klausa ἵνα dipertahankan. Namun, “telah diberikan karunia” menambahkan nomina “karunia,” sedangkan Yunani hanya memakai bentuk pasif “telah diberikan/dianugerahkan.” Selain itu, “hal itu disampaikan” lebih menafsirkan elipsis ἐν παραβολαῖς sebagai tindakan penyampaian daripada mempertahankan bentuk pengajaran dalam perumpamaan.'
