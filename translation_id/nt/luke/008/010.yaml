    rationale: δέδοται adalah bentuk perfek pasif “telah diberikan/dianugerahkan”; teks Yunani tidak menyebut nomina “karunia.” Tambahan tersebut dapat memberi penekanan teologis yang tidak perlu.
  - severity: low
    issue: “Hal itu disampaikan dalam perumpamaan” terlalu mengisi elipsis.
    rationale: ἐν παραβολαῖς hanya menyatakan bahwa bagi yang lain pengajaran/pemberian itu hadir dalam perumpamaan. “Disampaikan” dapat dipahami benar, tetapi lebih interpretatif daripada yang diperlukan.
