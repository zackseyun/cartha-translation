  to: Lalu Ia berkata, “Kepadamu telah dianugerahkan untuk mengetahui rahasia-rahasia Kerajaan Allah,[a] tetapi kepada orang-orang lain hal itu diberikan dalam perumpamaan, supaya sekalipun melihat, mereka tidak melihat, dan sekalipun mendengar, mereka tidak mengerti.”[b]
