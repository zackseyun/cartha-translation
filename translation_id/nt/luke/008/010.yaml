id: LUK.8.10
reference: Luke 8:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: id
  text: Lalu Ia berkata, “Kepadamu telah dianugerahkan untuk mengetahui rahasia-rahasia Kerajaan Allah,[a] tetapi kepada orang-orang lain hal itu diberikan dalam perumpamaan, supaya sekalipun melihat, mereka tidak melihat, dan sekalipun mendengar, mereka tidak mengerti.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “misteri-misteri Kerajaan Allah.” Istilah Yunani ini menunjuk pada kebenaran tentang Kerajaan Allah yang tersembunyi dari sebagian orang dan disingkapkan kepada yang lain.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “supaya sekalipun melihat, mereka tidak melihat, dan sekalipun mendengar, mereka tidak mengerti” menggemakan Yesaya 6:9–10. Ungkapan ini dapat menyatakan maksud ilahi, akibat penghakiman, atau keduanya.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: telah diberikan karunia
  rationale: Bentuk perfek pasif mempertahankan suatu pemberian yang telah terjadi dan hasilnya tetap berlaku; bentuk pasif membiarkan Sang Pemberi tersirat seperti dalam bahasa Yunani.
- source_word: γνῶναι
  choice: untuk mengetahui
  rationale: Membedakannya dari συνιῶσιν, 'mengerti', pada akhir ayat dan menyampaikan secara langsung hak atau kemampuan yang diberikan.
- source_word: τὰ μυστήρια
  choice: rahasia-rahasia
  rationale: Dalam konteks ini menunjuk pada kebenaran ilahi yang tersembunyi lalu disingkapkan, bukan teka-teki yang pada hakikatnya tak dapat diketahui. Bentuk jamak dipertahankan.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ungkapan baku dan luas dalam bahasa Indonesia, yang dapat mencakup pemerintahan maupun ranah kekuasaan Allah.
- source_word: τοῖς δὲ λοιποῖς
  choice: tetapi kepada orang-orang lain
  rationale: Menerjemahkan 'mereka yang selebihnya' secara alami tanpa memasukkan ungkapan 'orang-orang di luar' dari Injil paralel.
- source_word: ἐν παραβολαῖς
  choice: hal itu disampaikan dalam perumpamaan
  rationale: Bahasa Yunani bersifat eliptis. Penambahan 'hal itu disampaikan' membuat kalimat Indonesia lengkap sambil mempertahankan perumpamaan sebagai bentuk atau sarana penyampaian.
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan daya tujuan/hasil dari ἵνα dan tidak mengubahnya menjadi hubungan sebab yang lebih lunak.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: sekalipun melihat, mereka tidak melihat
  rationale: Mempertahankan pengulangan kata 'melihat' sekaligus mengungkapkan nuansa konsesif partisip secara wajar dalam bahasa Indonesia.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: sekalipun mendengar, mereka tidak mengerti
  rationale: Membedakan mendengar secara indrawi dari memahami, dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Daya klausa ἵνα dalam gema Yesaya 6:9–10
  choice: supaya
  alternative: sehingga
  rationale: ‘Supaya’ menjaga ketegangan antara maksud ilahi dan akibat penghakiman yang terdapat dalam konstruksi Yunani, tanpa memutuskan bahwa ayat ini hanya menyatakan akibat.
- issue: Makna μυστήρια
  choice: rahasia-rahasia
  alternative: misteri-misteri
  rationale: ‘Rahasia-rahasia’ lebih mudah dipahami sebagai kebenaran Kerajaan Allah yang disembunyikan dari sebagian orang dan dinyatakan kepada yang lain; catatan kaki menjaga penjelasan teologis istilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kapitalisasi ‘Kerajaan Allah’ mengikuti pemakaian religius Indonesia yang lazim. Ellipsis Yunani dilengkapi secara minimal agar klausa alami dalam bahasa Indonesia.
