  terminology: “Rahasia-rahasia Kerajaan Allah” cocok untuk μυστήρια, dengan alternatif “misteri-misteri” yang dicatat. “Kerajaan Allah,” “perumpamaan,” dan “mengerti” konsisten serta tepat. “Dianugerahkan” di sini menyampaikan pemberian yang tersirat tanpa menjadikan “karunia” sebuah unsur leksikal tambahan.
