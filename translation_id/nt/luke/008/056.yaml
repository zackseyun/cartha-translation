  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: id
  text: Orang tuanya tercengang[a], tetapi Ia memerintahkan[b] mereka agar tidak memberi tahu siapa pun tentang apa yang telah terjadi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sangat heran”; kata Yunaninya dapat menggambarkan orang yang diliputi keheranan luar biasa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berpesan dengan tegas agar mereka tidak memberi tahu siapa pun.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “hal yang telah terjadi” atau “peristiwa itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: tercengang
  rationale: Bentuk aoris ἐξίστημι di sini menyatakan keterkejutan atau keheranan yang sangat kuat. “Tercengang” alami dalam bahasa Indonesia dan mempertahankan kuatnya reaksi mereka.
- source_word: γονεῖς
  choice: orang tuanya
  rationale: γονεῖς adalah istilah jamak biasa untuk ayah dan ibu; “orang tuanya” merupakan padanan langsung dan wajar.
- source_word: παρήγγειλεν
  choice: memerintahkan
  rationale: παραγγέλλω menyatakan pemberian arahan yang berdaya perintah. “Memerintahkan” mempertahankan ketegasan itu tanpa menambahkan keterangan tentang nada atau motifnya.
- source_word: μηδενὶ
  choice: siapa pun
  rationale: Dalam larangan, μηδενί secara alami diterjemahkan “tidak ... siapa pun” dalam bahasa Indonesia.
- source_word: εἰπεῖν
  choice: memberi tahu
  rationale: Dengan penerima pribadi μηδενί, εἰπεῖν di sini bermakna menyampaikan kabar kepada seseorang; “memberi tahu” lebih alami daripada “mengatakan”.
- source_word: τὸ γεγονός
  choice: apa yang telah terjadi
  rationale: Partisipel perfek yang dipakai secara substantival menunjuk pada hal atau peristiwa yang sudah terjadi. Padanan ini jelas dan mempertahankan aspek peristiwa yang telah berlangsung.
- source_word: δὲ
  choice: tetapi
  rationale: δέ menandai kontras ringan antara ketercengangan orang tua itu dan perintah yang kemudian diberikan.
theological_decisions:
- issue: Motif kerahasiaan mesianis dan cakupan perintah
  choice: Menerjemahkan pernyataan itu secara langsung sebagai perintah agar mereka tidak memberi tahu siapa pun tentang kejadian tersebut.
  alternative: Menafsirkannya secara eksplisit sebagai perintah merahasiakan identitas Mesias, atau sebagai larangan yang hanya sementara atau terbatas.
  rationale: Ayat ini tidak menyebutkan alasan, jangka waktu, ataupun batas sosial perintah tersebut. Terjemahan mempertahankan ketegangan itu tanpa memasukkan penjelasan teologis yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Ia” mempertahankan rujukan pronominal teks Yunani tanpa menambahkan nama Yesus dalam ayat ini; “tercengang” menjaga intensitas reaksi, sedangkan susunan larangan dibuat idiomatis dalam bahasa Indonesia.
