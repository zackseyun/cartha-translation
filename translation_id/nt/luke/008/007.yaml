  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: id
  text: Benih yang lain jatuh di tengah-tengah semak berduri, lalu semak berduri itu tumbuh bersama benih itu dan menghimpitnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: benih yang lain
  rationale: Adjektiva netral tunggal ini dipakai secara substantival dan, dalam konteks perumpamaan, menunjuk pada benih. Kata “benih” ditambahkan agar rujukannya jelas dalam bahasa Indonesia.
- source_word: ἔπεσεν
  choice: jatuh
  rationale: Mengungkapkan tindakan naratif sederhana dari πίπτω secara langsung dan alami.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: di tengah-tengah semak berduri
  rationale: Mempertahankan gambaran spasial “di tengah-tengah/di antara” dan menerjemahkan ἄκανθα sebagai tumbuhan berduri, bukan sekadar duri yang terlepas.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: semak berduri
  rationale: Dalam gambaran pertanian ini, ἄκανθα menunjuk pada tumbuhan berduri; “semak berduri” jelas dan wajar bagi pembaca Indonesia.
- source_word: συμφυεῖσαι
  choice: tumbuh bersamanya
  rationale: Partisip ini menyatakan bahwa semak berduri tumbuh bersama atau beriringan dengan benih tersebut.
- source_word: ἀπέπνιξαν
  choice: menghimpitnya sampai mati
  rationale: ἀποπνίγω berarti mencekik atau membuat mati lemas. Untuk tumbuhan, ungkapan ini menyampaikan bahwa pertumbuhannya terdesak hingga mati tanpa menghilangkan daya metaforisnya.
- source_word: αὐτό
  choice: -nya
  rationale: Pronomina ini mengacu pada benih yang telah disebutkan dan paling alami dinyatakan dengan enklitik “-nya” dalam bahasa Indonesia.
