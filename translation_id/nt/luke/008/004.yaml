  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: id
  text: Ketika orang banyak sedang berkumpul dan orang-orang dari berbagai kota datang kepada-Nya, Yesus berbicara melalui sebuah perumpamaan:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yesus berbicara dalam sebuah perumpamaan.” Ungkapan Yunani διὰ παραβολῆς dapat menunjukkan sarana atau cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος δὲ ὄχλου πολλοῦ
  choice: Ketika orang banyak mulai berkumpul
  rationale: Konstruksi genitif absolut menyatakan keadaan yang sedang berlangsung ketika tindakan utama terjadi. 'Mulai berkumpul' menyampaikan proses terbentuknya kerumunan secara wajar dalam bahasa Indonesia; δέ berfungsi sebagai kelanjutan narasi dan tidak perlu diterjemahkan tersendiri.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: orang-orang dari kota demi kota berdatangan
  rationale: κατὰ πόλιν bersifat distributif, sedangkan bentuk partisipelnya menggambarkan kedatangan yang berlangsung. 'Kota demi kota' mempertahankan nuansa bahwa orang datang dari berbagai kota.
- source_word: πρὸς αὐτόν
  choice: kepada Yesus
  rationale: Kata ganti merujuk kepada Yesus dalam konteks. Penyebutan nama membuat rujukan alami dan jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: εἶπεν
  choice: ia berbicara
  rationale: Kata kerja utama berarti 'berkata' atau 'berbicara'; pilihan ini menyatu secara alami dengan keterangan cara atau sarana yang mengikutinya.
- source_word: διὰ παραβολῆς
  choice: dengan memakai sebuah perumpamaan
  rationale: διά dengan genitif dapat menunjukkan sarana atau cara. Ungkapan ini mempertahankan gagasan bahwa perumpamaan menjadi sarana Yesus berbicara, sambil mengakui kemungkinan terjemahan sebagai cara berbicara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Berdatangan' menangkap tindakan berulang dari berbagai kota, sedangkan 'kota demi kota' mempertahankan daya distributif teks sumber. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
