  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: id
  text: Ketika para penjaga kawanan babi itu melihat apa yang telah terjadi, mereka melarikan diri lalu melaporkannya di kota dan di daerah pedesaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di ladang-ladang”; yang dimaksud adalah kawasan pedesaan di sekitar kota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Ketika ... melihat
  rationale: Partisip aoris ini secara alami menyatakan hubungan waktu dengan kata kerja utama.
- source_word: οἱ βόσκοντες
  choice: para penjaga kawanan babi itu
  rationale: Partisip substantival ini menunjuk kepada orang-orang yang menggembalakan kawanan babi dalam konteks; penyebutan 'babi' memperjelas acuannya tanpa memakai 'gembala', yang lazim diasosiasikan dengan domba.
- source_word: τὸ γεγονός
  choice: apa yang telah terjadi
  rationale: Partisip perfek substantival menunjuk pada peristiwa yang sudah berlangsung dan akibatnya menjadi perhatian mereka.
- source_word: ἔφυγον
  choice: mereka melarikan diri
  rationale: Menyampaikan arti langsung φεύγω, yaitu pergi dengan cepat karena takut atau bahaya, tanpa menambahkan gagasan bahwa mereka berhasil lolos.
- source_word: ἀπήγγειλαν
  choice: memberitakannya
  rationale: Kata ini berarti menyampaikan atau melaporkan kabar; enklitik '-nya' secara wajar mengacu pada apa yang telah terjadi.
- source_word: εἰς τὴν πόλιν
  choice: di kota
  rationale: Dalam hubungan dengan verba pemberitaan, frasa ini menyatakan tempat atau lingkungan tempat kabar itu disampaikan, bukan sekadar arah perjalanan.
- source_word: εἰς τοὺς ἀγρούς
  choice: di daerah pedesaan
  rationale: Bentuk jamak ἀγρούς secara harfiah dapat berarti ladang-ladang, tetapi dalam kontras dengan kota menunjuk pada kawasan pedesaan di sekitarnya.
