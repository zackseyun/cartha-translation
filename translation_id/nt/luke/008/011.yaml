  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: id
  text: 'Inilah perumpamaan itu: benih itu adalah firman Allah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Inilah arti perumpamaan itu.” Secara lebih harfiah, teks Yunani berbunyi, “Inilah perumpamaan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: adalah
  rationale: Kopula ini memperkenalkan penjelasan Yesus secara langsung. Pilihan ini mempertahankan bentuk Yunani tanpa menambahkan kata 'arti'.
- source_word: δὲ
  choice: tidak dinyatakan tersendiri
  rationale: δέ menandai peralihan ringan. Dalam bahasa Indonesia, peralihan ini cukup alami tanpa kata penghubung eksplisit; menerjemahkannya sebagai 'sekarang' dapat memberi kesan waktu yang tidak ada dalam sumber.
- source_word: αὕτη ἡ παραβολή
  choice: Inilah perumpamaan itu
  rationale: Ungkapan ini mempertahankan susunan dan ketegangan teks Yunani yang secara harfiah menyebut 'perumpamaan', meskipun konteks menunjukkan bahwa penjelasannya sedang diberikan.
- source_word: ὁ σπόρος
  choice: benih itu
  rationale: Nomina tunggal dipertahankan dan dapat dipahami secara kolektif dalam gambaran perumpamaan.
- source_word: ὁ λόγος
  choice: firman
  rationale: Dalam konteks komunikasi ilahi, 'firman' merupakan padanan Indonesia yang alami dan bermartabat serta mempertahankan gema alkitabiah; 'pesan' lebih interpretatif.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif diterjemahkan secara langsung sebagai 'firman Allah', tanpa mempersempitnya menjadi 'firman dari Allah'.
theological_decisions:
- issue: Apakah παραβολή perlu diperluas menjadi 'arti/penjelasan perumpamaan'
  choice: perumpamaan
  alternative: arti perumpamaan
  rationale: Walaupun konteksnya jelas merupakan penafsiran Yesus, teks Yunani sendiri berbunyi secara lebih harfiah 'inilah perumpamaan itu'. Terjemahan utama mempertahankan ungkapan tersebut, sedangkan makna kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, wajar, dan bermartabat. 'Inilah' dipakai untuk presentasi atau penunjukan, bukan sebagai penanda waktu. Istilah 'firman Allah' dipertahankan karena jelas bagi pembaca umum dan sesuai dengan register Alkitab Indonesia.
