  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: id
  text: sebab ia mempunyai satu-satunya anak perempuan[a], yang berumur kira-kira dua belas tahun, dan anak itu sedang sekarat. Ketika Yesus sedang dalam perjalanan, orang banyak menghimpit-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «putri satu-satunya.»
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan «menghimpit» menggambarkan orang banyak yang menekan dengan sangat rapat, seolah-olah hampir meremukkan atau menyesakkan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: anak perempuan tunggal
  rationale: Dalam hubungan dengan θυγάτηρ, kata ini menyatakan bahwa ia satu-satunya anak perempuan, bukan menonjolkan gagasan 'diperanakkan'.
- source_word: ὡς ἐτῶν δώδεκα
  choice: berumur kira-kira dua belas tahun
  rationale: ὡς di depan bilangan menyatakan perkiraan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan ketidakpastian tersebut.
- source_word: ἀπέθνῃσκεν
  choice: sedang sekarat
  rationale: Bentuk imperfek menggambarkan proses kematian yang sedang berlangsung, bukan kematian yang sudah terjadi.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Ketika Yesus pergi
  rationale: Infinitif berartikel dengan ἐν menyatakan tindakan yang berlangsung bersamaan. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Walaupun bentuk Yunaninya jamak, 'orang banyak' merupakan ungkapan kolektif Indonesia yang alami dan tidak menghilangkan gambaran banyak orang.
- source_word: συνέπνιγον
  choice: berdesak-desakan menghimpit-Nya
  rationale: Pilihan ini menyampaikan tekanan fisik yang sangat rapat, bahkan bernuansa hampir meremukkan atau menyesakkan, tanpa menyatakan bahwa akibat itu benar-benar terjadi.
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini menghubungkan ayat dengan permohonan Yairus pada ayat sebelumnya dan menjelaskan alasan mendesaknya permohonan itu.
- source_word: αὐτῷ
  choice: ia mempunyai
  rationale: Dativus posesif diterjemahkan dengan konstruksi kepemilikan yang wajar dalam bahasa Indonesia.
