  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: id
  text: Di situ ada sekawanan besar[a] babi yang sedang mencari makan di gunung itu[b]. Mereka[c] memohon kepadanya agar diizinkan masuk ke dalam babi-babi itu, dan ia mengizinkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekawanan babi dalam jumlah besar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di lereng bukit.”
    reason: lexical_alternative
  - marker: c
    text: Kata “Mereka” merujuk kepada roh-roh jahat atau roh-roh najis dalam konteks di sekitarnya; sebagian terjemahan menyebutkannya secara langsung.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: sekawanan besar babi
  rationale: Mengungkapkan satu kawanan yang terdiri atas banyak babi dengan susunan yang wajar dalam bahasa Indonesia; ἱκανῶν di sini menunjuk pada besarnya jumlah.
- source_word: βοσκομένη
  choice: sedang mencari makan
  rationale: Menggambarkan kegiatan kawanan itu secara alami tanpa membatasi maknanya pada merumput saja.
- source_word: ἐν τῷ ὄρει
  choice: di gunung itu
  rationale: Mengikuti makna dasar ὄρος dan mempertahankan bentuk definit sumber; 'di lereng bukit' tetap mungkin menurut konteks bentang alam.
- source_word: παρεκάλεσαν
  choice: memohon
  rationale: Menyampaikan permintaan yang sungguh-sungguh dan mendesak dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: diizinkan / mengizinkan
  rationale: Mempertahankan hubungan leksikal antara permohonan dan tanggapan, sambil memakai bentuk pasif pada bagian pertama agar kalimat Indonesia tidak terasa berat.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: masuk ke dalam babi-babi itu
  rationale: Menerjemahkan gagasan masuk ke dalam serta mempertahankan penunjukan eksplisit ἐκείνους kepada babi-babi tersebut.
- source_word: δὲ
  choice: tidak dinyatakan dengan kata penghubung tersendiri
  rationale: Partikel ini mengembangkan narasi, tetapi bahasa Indonesia tidak memerlukan penanda seperti 'adapun' atau 'lalu' di sini; alur sudah jelas dari konteks.
theological_decisions:
- issue: Rujukan subjek jamak dalam παρεκάλεσαν
  choice: Dipertahankan secara tersirat sebagai 'Mereka', dengan catatan bahwa konteks merujuk kepada roh-roh jahat.
  alternative: Menuliskan secara eksplisit 'Roh-roh jahat itu memohon kepadanya'.
  rationale: Teks Yunani ayat ini hanya memakai verba jamak tanpa menyebut nomina subjek. Mempertahankan pronomina menghormati ketakterangan bentuk sumber, sedangkan catatan membantu pembaca mengikuti konteks.
- issue: Identitas αὐτόν sebagai pihak yang dimintai izin
  choice: Diterjemahkan dengan pronomina biasa 'kepadanya' dan 'ia'.
  alternative: Memperjelasnya menjadi 'kepada Yesus' serta memakai 'Dia/-Nya'.
  rationale: Ayat ini sendiri menggunakan pronomina, dan identitas Yesus tersedia dari konteks. Huruf kecil tidak menambahkan penandaan teologis yang tidak terdapat dalam bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami tanpa menambahkan penanda waktu. Pronomina ilahi tidak dikapitalisasi karena teks sumber memakai pronomina biasa dan konteks sudah menunjukkan rujukannya.
