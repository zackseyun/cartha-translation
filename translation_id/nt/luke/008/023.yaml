  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: id
  text: Ketika mereka sedang berlayar, Yesus tertidur. Lalu badai angin turun ke danau itu, dan perahu mereka mulai penuh dengan air[a], dan mereka berada dalam bahaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka mulai terendam air.” Kata kerja Yunani berbentuk jamak dan dapat menunjuk kepada mereka yang ada di perahu; dalam konteks ini, perahu yang mulai penuh air tampaknya dimaksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Ketika mereka sedang berlayar
  rationale: Konstruksi genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung sebagai latar bagi peristiwa berikutnya.
- source_word: ἀφύπνωσεν
  choice: Yesus tertidur
  rationale: Bentuk aoris menyatakan mulainya keadaan tidur. Nama “Yesus” memperjelas subjek tersirat dari konteks tanpa mengubah makna.
- source_word: κατέβη λαῖλαψ ἀνέμου
  choice: badai angin turun menerpa
  rationale: “Badai angin” mempertahankan penekanan pada angin, sedangkan “turun menerpa” menjaga gambaran κατέβη sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: εἰς τὴν λίμνην
  choice: danau itu
  rationale: Dalam konteks peristiwa cuaca yang turun, objek ini secara alami dinyatakan sebagai tempat yang diterpa badai.
- source_word: συνεπληροῦντο
  choice: Mereka pun kebanjiran
  rationale: Bentuk imperfek pasif jamak menggambarkan keadaan yang sedang berkembang. Ungkapan ini mempertahankan subjek jamak dalam teks Yunani dan menyampaikan bahwa air mulai menggenangi mereka atau perahu mereka, tanpa diam-diam menetapkan anteseden yang tidak disebutkan.
- source_word: ἐκινδύνευον
  choice: berada dalam bahaya
  rationale: Bentuk imperfek menunjukkan bahaya yang sedang berlangsung; ungkapan ini jelas, alami, dan tetap serius.
