id: LUK.8.24
reference: Luke 8:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: id
  text: Lalu mereka mendekati Yesus dan membangunkan-Nya sambil berkata, “Guru, Guru, kita akan binasa!” Setelah terbangun, Ia menghardik angin dan gelora air[a] itu. Keduanya pun reda, dan keadaan menjadi tenang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ombak yang bergelora.”
    reason: Alternatif leksikal untuk κλύδωνι τοῦ ὕδατος, yang dapat menunjuk pada gelora air atau ombak yang menghempas.
lexical_decisions:
- source_word: προσελθόντες
  choice: mereka mendekati Yesus
  rationale: Partisip aoris ini menyatakan gerakan mendekat sebelum mereka membangunkan Yesus. Nama Yesus dipakai sebagai rujukan alami bagi kata ganti objek tanpa menambahkan informasi baru.
- source_word: διήγειραν
  choice: membangunkan-Nya
  rationale: Bentuk aktif transitif ini berarti membangunkan seseorang dari tidur; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: Ἐπιστάτα
  choice: Guru
  rationale: Sapaan khas Lukas ini mengakui kewibawaan Yesus. “Guru” merupakan sapaan yang alami dan terhormat dalam konteks murid, meskipun nuansa katanya lebih luas daripada kegiatan mengajar saja.
- source_word: ἀπολλύμεθα
  choice: kita akan binasa
  rationale: Bentuk kini menyatakan bahaya maut yang sedang dan segera mengancam. Ungkapan ini menyampaikan kegentingannya secara alami; “kita” mempertahankan bahwa orang yang disapa berada bersama mereka dalam perahu.
- source_word: διεγερθεὶς
  choice: setelah terbangun
  rationale: Partisip pasif aoris menyatakan tindakan yang mendahului hardikan Yesus. “Terbangun” tidak secara berlebihan menentukan apakah Ia bangun sendiri atau akibat dibangunkan para murid.
- source_word: ἐπετίμησεν
  choice: menghardik
  rationale: Kata ini menyatakan teguran atau perintah keras yang berwibawa. “Menghardik” mempertahankan kekuatan ungkapan Injil tanpa menambahkan penjelasan teologis.
- source_word: ἀνέμῳ
  choice: angin
  rationale: Ini adalah arti leksikal langsung dan tidak perlu diperluas menjadi “angin badai”.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: gelora air
  rationale: κλύδων menunjuk pada hempasan atau gelora, sedangkan genitif τοῦ ὕδατος menentukan bahwa gelora itu berasal dari air. Pilihan ini mempertahankan citra sumber tanpa mereduksinya hanya menjadi “ombak”.
- source_word: ἐπαύσαντο
  choice: keduanya pun reda
  rationale: Kata kerja jamak merujuk kembali pada angin dan gelora air. “Keduanya” mempertahankan rujukan jamaknya, sedangkan “reda” alami bagi angin dan air yang bergelora.
- source_word: ἐγένετο γαλήνη
  choice: keadaan menjadi tenang
  rationale: Ungkapan ini menyatakan hasil berupa ketenangan sesudah angin dan gelora reda; terjemahan tersebut alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan Ἐπιστάτα kepada Yesus
  choice: Guru
  alternative: Tuan; Pemimpin
  rationale: Kata ini mengungkapkan pengakuan akan kewibawaan Yesus dalam hubungan murid dengan guru. “Guru” paling alami sebagai sapaan langsung dalam bahasa Indonesia, tanpa memasukkan gelar gerejawi atau penafsiran doktrinal tambahan.
- issue: Kewibawaan Yesus atas angin dan air dalam ἐπετίμησεν
  choice: menghardik
  alternative: memerintahkan dengan keras; menegur
  rationale: Teks menggambarkan Yesus berbicara dengan kewibawaan langsung kepada kekuatan alam. “Menghardik” mempertahankan daya kata Yunani dan ketegangan naratifnya tanpa menjelaskan lebih jauh hakikat kewibawaan itu.
- issue: Inklusivitas kata ganti orang pertama jamak dalam ἀπολλύμεθα
  choice: kita akan binasa
  alternative: kami akan binasa
  rationale: Bahasa Yunani tidak membedakan bentuk inklusif dan eksklusif. Karena Yesus berada dalam perahu dan menjadi pihak yang disapa, “kita” paling dekat dengan situasi ujaran, walaupun bahasa Indonesia tidak dapat mempertahankan seluruh ambiguitas bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan bermartabat. Bentuk “-Nya” dan “Ia” mengikuti kebiasaan penulisan hormat untuk rujukan kepada Yesus. Pengulangan “Guru, Guru” dipertahankan untuk menyampaikan kepanikan dan desakan dalam teks Yunani.
