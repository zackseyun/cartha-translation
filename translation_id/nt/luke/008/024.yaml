  source_fidelity: 'Terjemahan dengan setia mencerminkan urutan tindakan dalam teks Yunani: mereka mendekat dan membangunkan Yesus, seruan yang diulang, hardikan terhadap angin dan gelora air, reda-nya kedua unsur itu, lalu ketenangan. “Setelah terbangun” secara wajar mempertahankan fungsi partisip aoris pasif διεγερθείς tanpa memaksakan agen kebangkitan-Nya. “Keduanya pun reda” dengan tepat menangkap verba jamak ἐπαύσαντο.'
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif. “Guru, Guru, kita akan binasa!” menyampaikan kepanikan serta desakan seruan itu dengan alami. “Gelora air itu” dan “keadaan menjadi tenang” juga idiomatis dalam konteks badai di danau.
  terminology: “Guru” merupakan padanan yang dapat dipertahankan untuk Ἐπιστάτα dalam konteks sapaan para murid, tanpa menambahkan tafsiran doktrinal. “Menghardik” tepat bagi ἐπετίμησεν dan mempertahankan kewibawaan tindakan Yesus. Kapitalisasi rujukan kepada Yesus konsisten dengan konvensi Indonesia yang dipakai draf.
