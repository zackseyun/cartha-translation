  terminology: “Gerasa” sesuai dengan bentuk Γερασηνῶν dalam edisi sumber sebagai penanda wilayah/penduduk terkait Gerasa. “Dicekam ketakutan yang besar” merupakan padanan yang kuat dan wajar bagi φόβῳ μεγάλῳ συνείχοντο serta tidak menafsirkan jenis ketakutan itu.
