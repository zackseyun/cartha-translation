id: LUK.8.37
reference: Luke 8:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: id
  text: Seluruh kerumunan orang dari daerah sekitar Gerasa meminta kepada-Nya agar Ia pergi dari mereka, karena mereka dicekam ketakutan yang besar.[a] Lalu Ia naik ke sebuah perahu dan kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: diliputi ketakutan yang besar.'
    reason: Alternatif leksikal bagi συνείχοντο yang mempertahankan gambaran bahwa ketakutan menguasai mereka.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: meminta
  rationale: Dalam konstruksi dengan infinitif, kata ini menyatakan permintaan agar seseorang melakukan sesuatu. “Meminta” alami dalam bahasa Indonesia dan tidak melebihkan intensitas menjadi “memohon dengan sangat”.
- source_word: ἅπαν τὸ πλῆθος
  choice: seluruh orang banyak
  rationale: Ungkapan ini menunjuk secara kolektif kepada semua orang yang berkumpul serta mempertahankan daya total ἅπαν.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: dari daerah sekitar Gerasa
  rationale: περίχωρος berarti kawasan atau daerah di sekeliling suatu tempat. “Gerasa” mempertahankan nama wilayah yang mendasari sebutan Γερασηνῶν dalam teks Yunani.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: agar Ia pergi meninggalkan mereka
  rationale: Konstruksi ini menyatakan isi permintaan mereka dan mempertahankan gagasan menjauh dari mereka.
- source_word: φόβῳ μεγάλῳ
  choice: ketakutan yang besar
  rationale: Terjemahan langsung ini mempertahankan kadar kuat dari μέγας tanpa menjelaskan jenis atau penyebab ketakutan tersebut.
- source_word: συνείχοντο
  choice: dicekam
  rationale: Bentuk pasif ini menggambarkan mereka seperti dikuasai atau dipegang erat oleh ketakutan. “Dicekam” menyampaikan daya metaforis tersebut secara alami.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: naik ke sebuah perahu
  rationale: Ungkapan ini secara alami menyatakan tindakan masuk atau menaiki perahu; artikel tak tentu “sebuah” sesuai dengan tidak adanya artikel dalam bahasa Yunani.
- source_word: ὑπέστρεψεν
  choice: kembali
  rationale: Kata ini berarti kembali atau pergi balik; “kembali” ringkas dan sesuai dengan gaya naratif.
theological_decisions:
- issue: Sifat ketakutan penduduk daerah Gerasa terhadap Yesus
  choice: Teks hanya menyatakan bahwa ketakutan besar mendorong mereka meminta Yesus pergi.
  alternative: Menafsirkan ketakutan itu secara khusus sebagai rasa takjub kepada kuasa ilahi, permusuhan akibat kerugian ekonomi, atau kecemasan karena gangguan sosial.
  rationale: Ayat ini tidak menjelaskan sifat maupun penyebab ketakutan mereka. Terjemahan karena itu mempertahankan ketegangan naratif dan tidak memasukkan penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Ia” dan “-Nya” dipakai bagi Yesus sesuai konvensi umum penulisan teks Alkitab bahasa Indonesia. Susunan kalimat dibuat cukup dekat dengan struktur Yunani tanpa mengorbankan kejelasan.
