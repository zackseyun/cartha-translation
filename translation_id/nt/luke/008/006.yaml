  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: id
  text: Benih yang lain jatuh di atas batu[a]. Setelah tumbuh, benih itu mengering karena tidak ada kelembapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di atas batu itu.” Bahasa Yunani memakai bentuk tunggal “batu”, sehingga mempertahankan gambaran benih yang jatuh pada permukaan batu, bukan ungkapan yang lebih luas “tanah berbatu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: benih yang lain
  rationale: Kata sifat netral tunggal ini dipakai secara substantival. Menyebut 'benih' secara eksplisit membuat acuannya jelas dan alami dalam bahasa Indonesia tanpa mengubah gambaran perumpamaan.
- source_word: κατέπεσεν
  choice: jatuh
  rationale: Bentuk aoris καταπίπτω menyatakan peristiwa jatuh secara lugas; 'jatuh' sudah alami dan tidak memerlukan penegasan tambahan.
- source_word: ἐπὶ τὴν πέτραν
  choice: di atas batu
  rationale: Mempertahankan πέτρα dalam bentuk tunggal sebagai 'batu', bukan memperluasnya menjadi 'tanah berbatu'. Frasa ini menggambarkan benih yang jatuh pada permukaan batu.
- source_word: φυὲν
  choice: setelah tumbuh
  rationale: Partisip aoris dari φύω mendahului verba utama dan di sini paling wajar dipahami secara temporal. 'Setelah tumbuh' mempertahankan urutan kejadian.
- source_word: ἐξηράνθη
  choice: menjadi kering
  rationale: Bentuk pasif ini dalam konteks tumbuhan menyatakan bahwa tunas itu mengering. 'Menjadi kering' alami dan dekat dengan bentuk sumber, sedangkan 'layu' dapat kurang menonjolkan kekurangan air.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: karena tidak mendapat
  rationale: διά dengan infinitif berartikel menyatakan sebab. Dalam bahasa Indonesia, 'tidak mendapat kelembapan' lebih alami untuk benih atau tunas daripada 'tidak memiliki kelembapan'.
- source_word: ἰκμάδα
  choice: kelembapan
  rationale: ἰκμάς menunjuk pada kelembapan yang diperlukan untuk pertumbuhan; 'kelembapan' jelas, umum, dan tidak sespesifik 'getah'.
