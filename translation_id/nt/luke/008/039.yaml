  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: id
  text: “Pulanglah ke rumahmu dan ceritakanlah segala sesuatu yang telah Allah lakukan bagimu.” Lalu orang itu pergi dan memberitakan di seluruh kota segala sesuatu yang telah Yesus lakukan baginya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Pulanglah
  rationale: Imperatif ini memerintahkan orang tersebut kembali ke tempat asalnya; bersama frasa berikutnya, “pulanglah” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: εἰς τὸν οἶκόν σου
  choice: ke rumahmu
  rationale: οἶκος di sini menunjuk pada rumah atau tempat tinggalnya; “ke rumahmu” mempertahankan gambaran ruang dalam teks.
- source_word: διηγοῦ
  choice: ceritakanlah
  rationale: Kata ini berarti menuturkan atau mengisahkan; “ceritakanlah” alami dalam perintah langsung dan menyiratkan penyampaian tentang apa yang terjadi.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: segala sesuatu yang telah Allah lakukan bagimu
  rationale: ὅσα berarti “segala sesuatu yang” atau “sebanyak apa yang”; pilihan ini tidak menambahkan kata sifat “besar” yang tidak dinyatakan secara eksplisit dalam bahasa Yunani.
- source_word: ἀπῆλθεν
  choice: orang itu pergi
  rationale: Subjek tersirat merujuk kepada orang yang baru disembuhkan. “Pergi” menyampaikan keberangkatannya secara alami; subjek dibuat eksplisit agar jelas dalam bahasa Indonesia.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: ke seluruh kota
  rationale: Frasa ini memiliki nuansa distributif, yakni pemberitaan yang menjangkau seluruh kota.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: κηρύσσω menunjuk pada pengumuman atau pemberitaan secara terbuka; “memberitakan” mempertahankan kekuatan publiknya tanpa harus menyiratkan khotbah formal.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: segala sesuatu yang telah Yesus lakukan baginya
  rationale: Pilihan ini mencerminkan klausa sebelumnya dan mempertahankan paralel naratif antara tindakan Allah dan tindakan Yesus.
theological_decisions:
- issue: Paralel antara “Allah” dalam perintah Yesus dan “Yesus” dalam pemberitaan orang itu
  choice: 'Mempertahankan kedua sebutan sebagaimana tertulis: Allah telah melakukan bagimu / Yesus telah melakukan baginya'
  alternative: Menyeragamkan kedua klausa menjadi “Allah” atau “Yesus”, atau menambahkan penjelasan eksplisit tentang hubungan keduanya
  rationale: Teks Lukas menempatkan “Allah” dan “Yesus” secara paralel tanpa menjelaskan hubungan itu secara editorial. Terjemahan mempertahankan daya dan ketegangan teologis tersebut tanpa menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Bentuk “-lah” mempertahankan nada imperatif langsung. “Segala sesuatu” dipilih demi ketepatan terhadap ὅσα, tanpa menambahkan “hal-hal besar” yang hanya tersirat dari konteks.
