  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: id
  text: Lalu tuannya berkata kepadanya, “Bagus sekali, hai hamba[a] yang baik! Karena engkau setia dalam perkara yang sangat kecil, hendaklah engkau berkuasa atas sepuluh kota.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: budak.'
    reason: alternatif_leksikal; kata Yunani doulos dapat berarti “hamba” atau “budak,” bergantung pada konteks.
lexical_decisions:
- source_word: Εὖγε
  choice: Bagus sekali
  rationale: Seruan pujian ini disampaikan dengan ungkapan Indonesia yang alami dan tetap mempertahankan nada persetujuan kuat.
- source_word: ἀγαθὲ δοῦλε
  choice: hai hamba yang baik
  rationale: Dalam konteks perumpamaan tentang tuan dan bawahannya, 'hamba' menyatakan kedudukan yang tunduk kepada tuan secara lebih tepat daripada 'pelayan', tanpa perlu memakai istilah yang terasa historis atau terlalu teknis.
- source_word: ἐν ἐλαχίστῳ
  choice: dalam perkara yang sangat kecil
  rationale: Mengungkapkan dengan jelas bahwa kesetiaan itu ditunjukkan dalam urusan yang nilainya amat kecil.
- source_word: πιστὸς ἐγένου
  choice: engkau setia
  rationale: Menyampaikan penilaian terhadap kesetiaan hamba secara langsung tanpa menambahkan gagasan bahwa ia baru menjadi setia.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: peganglah kekuasaan
  rationale: Konstruksi perintah ini menyatakan pemberian kedudukan untuk memiliki dan menjalankan wewenang; ungkapan ini alami dalam konteks pemerintahan atas kota.
- source_word: ἐπάνω δέκα πόλεων
  choice: atas sepuluh kota
  rationale: Mempertahankan gambaran pemerintahan atau yurisdiksi atas sepuluh kota.
theological_decisions:
- issue: Makna δοῦλος dalam hubungan tuan-bawahan pada perumpamaan
  choice: hamba
  alternative: budak; pelayan
  rationale: '''Hamba'' mempertahankan relasi kepemilikan dan ketundukan yang terkandung dalam konteks, sekaligus menjadi istilah Indonesia yang wajar dalam gaya perumpamaan Alkitab. Ayat ini tidak mengharuskan penekanan khusus melalui kata ''budak''.'
- issue: Subjek tersirat pada καὶ εἶπεν αὐτῷ
  choice: tuannya
  alternative: ia; dia
  rationale: Bahasa Yunani hanya menyatakan subjek melalui bentuk verba, tetapi konteks langsung mengidentifikasinya sebagai tokoh bangsawan yang menjadi tuan para hamba. Penyebutan 'tuannya' memperjelas rujukan dalam bahasa Indonesia tanpa mengubah peran tokoh.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Sapaan 'hai' mempertahankan bentuk vokatif, sedangkan 'engkau' sesuai dengan tuturan langsung dalam perumpamaan. Tidak diperlukan catatan kaki karena pilihan 'hamba' sudah mencakup relasi yang dimaksud dalam konteks dan tidak ada varian tekstual relevan yang perlu ditampilkan.
