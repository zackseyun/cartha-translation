  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: id
  text: Lalu ia berkata kepada orang-orang yang berdiri di dekatnya, “Ambillah mina itu darinya dan berikanlah kepada orang yang mempunyai sepuluh mina.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mina adalah satuan uang kuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: kepada orang-orang yang berdiri di dekatnya
  rationale: Partisipel perfekt aktif dengan artikel dipakai secara substantival dan menunjuk kepada orang-orang yang hadir di dekat tokoh itu. Ungkapan ini mempertahankan gambaran konkret adegan serta alami dalam bahasa Indonesia.
- source_word: Ἄρατε
  choice: Ambillah
  rationale: Imperatif aoris jamak dari αἴρω dalam konteks ini berarti mengambil atau menyingkirkan dari seseorang. “Ambillah” sesuai dengan rangkaian perintah dan berpasangan alami dengan “darinya”.
- source_word: ἀπ’ αὐτοῦ
  choice: darinya
  rationale: Preposisi ἀπό dengan genitif menyatakan pemisahan. “Darinya” merupakan padanan langsung dan ringkas.
- source_word: τὴν μνᾶν
  choice: mina itu
  rationale: μνᾶ adalah satuan uang kuno. Transliterasi “mina” mempertahankan latar sejarah, sedangkan demonstratif “itu” secara alami mewakili artikel Yunani yang menunjuk pada mina yang telah disebutkan.
- source_word: δότε
  choice: berikanlah
  rationale: Imperatif aoris jamak dari δίδωμι menyatakan pemindahan milik secara sederhana. “Berikanlah” adalah bentuk perintah yang jelas dan wajar.
- source_word: τῷ ... ἔχοντι
  choice: kepada orang yang mempunyai
  rationale: Partisipel berartikel dalam datif tunggal berfungsi substantival. “Orang yang mempunyai” alami dalam bahasa Indonesia dan tidak menambahkan identitas yang tidak dinyatakan oleh teks.
- source_word: τὰς δέκα μνᾶς
  choice: sepuluh mina
  rationale: Frasa tersebut menunjuk pada jumlah yang sudah dikenal dalam konteks. Bahasa Indonesia tidak memerlukan artikel tertentu sebelum bilangan; acuannya tetap jelas.
theological_decisions:
- issue: Penerjemahan μνᾶ sebagai satuan uang
  choice: mina
  alternative: pon
  rationale: “Mina” mempertahankan nama satuan uang kuno dari bahasa Yunani dan menghindari kesan bahwa nilainya sama dengan satuan berat atau mata uang modern bernama “pon”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif “Ambillah” dan “berikanlah” mempertahankan ketegasan perintah tanpa terdengar kaku. Penanda catatan kaki ditempatkan setelah kalimat yang memuat istilah “mina”.
