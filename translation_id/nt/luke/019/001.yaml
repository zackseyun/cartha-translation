  text: And he entered and was passing through Jericho[a].
translation:
  language: id
  text: Lalu Yesus masuk ke Yerikho dan sedang melintasi kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan setelah masuk, ia sedang melintasi Yerikho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan urutan peristiwa dalam narasi; “Lalu” alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab akibat.
- source_word: εἰσελθὼν
  choice: Yesus masuk
  rationale: Partisip aoris εἰσέρχομαι menunjukkan tindakan masuk yang mendahului atau mengiringi verba utama. Klausa berverba lengkap lebih alami dalam bahasa Indonesia; subjek “Yesus” diperjelas dari konteks.
- source_word: διήρχετο
  choice: sedang melintasi
  rationale: Bentuk imperfek διέρχομαι menggambarkan tindakan yang tengah berlangsung. “Sedang melintasi” mempertahankan aspek progresif tersebut.
- source_word: τὴν Ἰεριχώ
  choice: Yerikho ... kota itu
  rationale: Yerikho adalah nama tempat. Karena bahasa Indonesia kurang alami jika mengatakan “melintasi Yerikho” dalam konteks ini, “kota itu” dipakai sebagai objek yang merujuk kembali kepada Yerikho tanpa mengubah acuannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Nama “Yesus” dipakai untuk memperjelas subjek tersirat, sedangkan catatan kaki mempertahankan bentuk yang lebih dekat dengan susunan Yunani.
