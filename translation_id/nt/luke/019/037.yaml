id: LUK.19.37
reference: Luke 19:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: id
  text: Ketika Yesus sudah mendekati bagian menurun dari Bukit Zaitun, seluruh rombongan murid mulai bersukacita dan memuji Allah dengan suara nyaring karena segala perbuatan penuh kuasa[a] yang telah mereka lihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat-mukjizat” atau “perbuatan-perbuatan ajaib”; kata Yunani yang digunakan menekankan tindakan yang memperlihatkan kuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Ketika Yesus sudah mendekati
  rationale: Genetif absolut memberi latar waktu dan menggambarkan gerak mendekat. Nama Yesus dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: πρὸς τῇ καταβάσει
  choice: jalan menurun
  rationale: Frasa ini menunjuk lokasi pada atau dekat bagian lereng yang menurun; 'jalan menurun' alami dalam konteks perjalanan tanpa menetapkan topografi secara berlebihan.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: Bukit Zaitun
  rationale: Nama tempat yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: seluruh rombongan murid
  rationale: '''Rombongan'' menyampaikan kelompok besar yang terdiri atas para murid dan lebih alami daripada ''segenap orang banyak para murid''.'
- source_word: ἤρξαντο ... χαίροντες αἰνεῖν τὸν θεὸν
  choice: mulai bersukacita dan memuji Allah
  rationale: Menjaga aspek ingresif ἤρξαντο serta menyampaikan χαίροντες sebagai tindakan penyerta tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Ungkapan Indonesia yang konkret dan wajar untuk suara yang keras atau lantang.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: karena segala perbuatan penuh kuasa yang telah mereka lihat
  rationale: Menyampaikan alasan pujian dan mempertahankan cakupan δύναμις sebagai tindakan yang memperlihatkan kuasa, tanpa mempersempitnya hanya menjadi istilah teknis 'mukjizat'.
theological_decisions:
- issue: Makna δύναμις dalam konteks perbuatan luar biasa
  choice: perbuatan penuh kuasa
  alternative: mukjizat; perbuatan-perbuatan ajaib
  rationale: δύναμις dapat menunjuk kuasa, tindakan penuh kuasa, atau mukjizat. Pilihan ini mempertahankan penekanan leksikal pada kuasa yang terwujud dalam tindakan sekaligus tidak mempersempit ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nuansa temporal, kegembiraan, pujian lantang, dan keluasan makna δύναμις dipertahankan.
