  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: id
  text: kata-Nya, “Seandainya pada hari ini engkau pun mengetahui hal-hal yang mendatangkan damai[a]—tetapi sekarang semuanya itu tersembunyi dari matamu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “hal-hal yang menuju damai,” yaitu hal-hal yang berkaitan dengan atau mengarah kepada damai.'
    reason: lexical_alternative
  - marker: b
    text: Kalimat syarat dalam bahasa Yunani dibiarkan tanpa klausa akibat yang dinyatakan; tanda pisah mempertahankan bentuk ratapan yang terputus itu.
    reason: source_form
lexical_decisions:
- source_word: λέγων
  choice: kata-Nya
  rationale: Partisipel ini meneruskan tindakan dalam ayat sebelumnya. Dalam narasi bahasa Indonesia, “kata-Nya” lebih alami daripada “sambil berkata” dan tetap menghubungkan ucapan ini dengan tindakan sebelumnya.
- source_word: Εἰ ἔγνως
  choice: Seandainya ... engkau ... mengetahui
  rationale: Dalam ratapan ini, bentuk syarat menyatakan keadaan yang tidak terwujud. “Seandainya” menyampaikan nada penyesalan tanpa menambahkan kata penegas yang tidak dinyatakan secara eksplisit.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: pada hari ini
  rationale: Ini adalah ungkapan waktu yang baku dan alami dalam bahasa Indonesia serta tidak menambah penekanan seperti “pada hari ini juga”.
- source_word: καὶ σὺ
  choice: engkau pun
  rationale: “Pun” mempertahankan penekanan pada Yerusalem sebagai pihak yang secara khusus disapa dalam ratapan.
- source_word: τὰ πρὸς εἰρήνην
  choice: hal-hal yang mendatangkan damai
  rationale: Ungkapan ini menunjuk pada segala sesuatu yang berkaitan dengan atau mengarah kepada damai. Bentuk “hal-hal” mempertahankan nuansa jamak, sedangkan “mendatangkan damai” terdengar alami.
- source_word: νῦν δὲ
  choice: tetapi sekarang
  rationale: Pilihan ini menyatakan pertentangan tajam antara kesempatan untuk mengetahui dan keadaan tersembunyi yang berlaku sekarang.
- source_word: ἐκρύβη
  choice: semuanya itu tersembunyi
  rationale: “Semuanya itu” secara jelas merujuk kembali kepada “hal-hal yang mendatangkan damai.” Bahasa Indonesia tidak perlu memaksakan pembedaan jumlah pada verba pasif, sehingga ketegangan gramatikal Yunani tidak diselesaikan secara berlebihan.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: dari matamu
  rationale: Terjemahan ini alami sekaligus mempertahankan kiasan sumber tentang penglihatan sebagai pengenalan atau pemahaman.
theological_decisions:
- issue: Ratapan bersyarat yang tidak diselesaikan secara eksplisit
  choice: Memakai “Seandainya” dan tanda pisah sebelum “tetapi sekarang,” tanpa menambahkan akibat yang tidak tertulis.
  alternative: “Kalau saja ...!” atau melengkapi akibat tersirat dari syarat tersebut.
  rationale: Teks Yunani memulai klausa syarat tetapi tidak menyatakan klausa akibatnya. Tanda pisah mempertahankan ratapan yang terputus dan menghindari penambahan tafsiran.
- issue: Rujukan tersirat dari ἐκρύβη
  choice: “semuanya itu” merujuk kepada hal-hal yang mendatangkan damai.
  alternative: Ungkapan impersonal, “hal itu tersembunyi,” atau “itu telah disembunyikan.”
  rationale: Rujukan terdekat dan paling koheren ialah frasa netral jamak sebelumnya. Ungkapan Indonesia “semuanya itu” membuat hubungan tersebut jelas tanpa menentukan pelaku pasif yang tidak disebutkan.
- issue: Pelaku dari tindakan menyembunyikan
  choice: Mempertahankan bentuk pasif tanpa menyebut pelaku.
  alternative: Menambahkan bahwa Allah yang menyembunyikannya.
  rationale: Teks tidak menyatakan pelakunya. Menyebut Allah secara eksplisit akan menyelesaikan ambiguitas teologis yang sengaja dibiarkan oleh bentuk pasif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan tunggal “engkau” dipertahankan karena Yerusalem dipersonifikasikan sebagai pihak yang disapa. Susunan kalimat menjaga tekanan pada “engkau pun” dan mempertahankan bentuk ratapan yang belum selesai.
