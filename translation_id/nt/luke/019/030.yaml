  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: id
  text: kata-Nya, “Pergilah ke desa yang di seberang itu. Ketika kalian memasukinya, kalian akan menemukan seekor anak keledai yang terikat, yang belum pernah ditunggangi siapa pun. Lepaskan ikatannya dan bawalah anak keledai itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν κατέναντι κώμην
  choice: desa yang di seberang itu
  rationale: Mengungkapkan letak desa yang berhadapan dengan para murid secara alami dalam bahasa Indonesia tanpa menambahkan rincian arah.
- source_word: πῶλον
  choice: seekor anak keledai
  rationale: Dalam konteks kisah ini, πῶλος merujuk pada anak keledai; penyebutan jenis hewannya memperjelas makna yang didukung konteks dekat.
- source_word: δεδεμένον
  choice: yang terikat
  rationale: Mempertahankan bentuk pasif dan keadaan hewan sebagaimana teks Yunani.
- source_word: ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: yang belum pernah ditunggangi siapa pun
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan bahwa tidak seorang pun pernah duduk di atas hewan tersebut.
- source_word: λύσαντες αὐτὸν
  choice: Lepaskan ikatannya
  rationale: Bahasa Indonesia lazim merujuk pada ikatan yang dilepaskan, sedangkan objeknya tetap jelas sebagai anak keledai.
- source_word: ἀγάγετε
  choice: bawalah kemari
  rationale: Kata kerja berarti membawa atau menuntun; 'kemari' secara alami menunjukkan tujuan menuju Yesus sebagai penutur.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti jamak 'kalian' membuat jumlah penerima perintah yang tersirat dalam bentuk verba Yunani menjadi jelas. Ucapan langsung dipertahankan, dan tidak ada catatan kaki yang diperlukan.
