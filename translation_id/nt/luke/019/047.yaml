  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: id
  text: Ia terus mengajar setiap hari di Bait Allah. Namun, para imam kepala, ahli-ahli Taurat, dan orang-orang terkemuka di antara rakyat[a] berusaha membinasakan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang pertama dari rakyat”; maksudnya ialah orang-orang yang terpandang atau berpengaruh di kalangan rakyat. Dapat juga diterjemahkan “para pemimpin rakyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: Ia terus mengajar
  rationale: Konstruksi perifrastik imperfek menyatakan kegiatan yang berlangsung atau berulang pada masa lampau. Kata “terus” menyampaikan aspek duratif itu secara alami.
- source_word: τὸ καθ’ ἡμέραν
  choice: setiap hari
  rationale: Ungkapan distributif ini berarti bahwa kegiatan tersebut dilakukan dari hari ke hari; “setiap hari” adalah padanan Indonesia yang alami dan tepat.
- source_word: ἐν τῷ ἱερῷ
  choice: di Bait Allah
  rationale: ἱερόν menunjuk pada kawasan Bait Allah, bukan hanya ruang kudus bagian dalam. “Bait Allah” merupakan istilah baku dalam konteks ini, sementara preposisi “di” memungkinkan pengertian kawasan kompleksnya.
- source_word: οἱ ἀρχιερεῖς
  choice: para imam kepala
  rationale: Padanan baku bagi kelompok pemimpin keimaman, bukan pernyataan bahwa ada beberapa imam besar yang menjabat sekaligus.
- source_word: οἱ γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Yahudi abad pertama, γραμματεῖς menunjuk para ahli kitab dan hukum Taurat. Padanan ini lebih jelas bagi pembaca Indonesia daripada “juru tulis”.
- source_word: ἐζήτουν
  choice: berusaha
  rationale: Bentuk imperfek menggambarkan upaya yang sedang berlangsung. “Berusaha” menyampaikan usaha aktif tanpa menambahkan cara yang tidak disebutkan.
- source_word: ἀπολέσαι
  choice: membinasakan Dia
  rationale: ἀπόλλυμι dapat berarti membinasakan atau membunuh. “Membinasakan” tetap dekat dengan keluasan makna Yunani sambil menyampaikan niat permusuhan yang dapat mencakup pembunuhan.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: orang-orang terkemuka di antara rakyat
  rationale: Secara harfiah frasa ini berarti “orang-orang pertama dari rakyat” dan menunjuk anggota masyarakat yang utama, terpandang, atau berpengaruh. Padanan ini alami dan tidak mengubahnya menjadi jabatan resmi yang tidak dinyatakan teks.
theological_decisions:
- issue: Cakupan niat dalam ἀπολέσαι
  choice: membinasakan Dia
  alternative: membunuh Dia
  rationale: Konteksnya jelas menunjukkan niat untuk menyingkirkan Yesus secara mematikan, tetapi verba Yunani memiliki cakupan lebih luas daripada tindakan membunuh saja. Terjemahan mempertahankan ketegangan leksikal itu.
- issue: Jenis kelamin dalam οἱ πρῶτοι τοῦ λαοῦ
  choice: orang-orang terkemuka di antara rakyat
  alternative: kaum pria terkemuka di antara rakyat
  rationale: Bentuk Yunani adalah maskulin jamak, tetapi dalam konstruksi substantival ini fokus semantisnya ialah status dan pengaruh. Bahasa Indonesia tidak menandai gender secara gramatikal; menambahkan “pria” akan mempersempit makna secara eksplisit melebihi kepastian yang diberikan frasa tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Ia” mempertahankan kesinambungan narasi, sedangkan “Dia” mengikuti kebiasaan penulisan rujukan kepada Yesus. Istilah “Bait Allah,” “imam kepala,” dan “ahli Taurat” dipakai karena dikenal luas oleh pembaca Alkitab Indonesia.
