  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: id
  text: Lalu ia berkata kepada orang ini juga, “Engkau juga, berkuasalah atas lima kota.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Lalu ... ia berkata
  rationale: Bentuk aoris εἶπεν menyampaikan tindakan berkata dalam narasi, sedangkan δέ merupakan penghubung ringan dalam urutan cerita; “Lalu” menghasilkan alur yang wajar tanpa memberi kesan pertentangan yang kuat.
- source_word: καὶ τούτῳ
  choice: kepada yang ini juga
  rationale: τούτῳ mempertahankan unsur demonstratif “yang ini,” dan καί menyatakan “juga,” sehingga pola pembagian kepada hamba berikutnya tetap tampak.
- source_word: Καὶ σὺ
  choice: Engkau juga
  rationale: καί di sini paling alami menyatakan bahwa orang kedua pun menerima penugasan, sementara σὺ yang eksplisit memberi penekanan pada sapaan pribadi.
- source_word: ἐπάνω γίνου
  choice: berkuasalah atas
  rationale: Imperatif kini γίνου bersama ἐπάνω secara idiomatis menunjuk pada penempatan atau pelaksanaan kedudukan berwenang. “Berkuasalah atas” ringkas, alami, dan mempertahankan nuansa otoritas tanpa menentukan mekanisme pengangkatannya.
- source_word: πέντε πόλεων
  choice: lima kota
  rationale: πόλις lazimnya berarti “kota,” dan bentuk genitifnya bergantung pada ἐπάνω untuk menunjukkan wilayah kewenangan.
