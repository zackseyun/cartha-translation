  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Engkau” dipakai dalam dialog perumpamaan agar sapaan langsung tetap jelas dan sesuai dengan register Alkitab yang wajar; susunan kalimat mempertahankan pengulangan καί tanpa terdengar kaku.
