  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: id
  text: Sementara Yesus melintas, mereka terus menghamparkan jubah[a] mereka di jalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pakaian mereka” atau “pakaian luar mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Ketika Yesus berjalan
  rationale: Konstruksi genitif absolut dengan partisipel kini menyatakan tindakan yang berlangsung bersamaan. Nama “Yesus” dipakai sebagai rujukan alami dalam bahasa Indonesia karena pronomina Yunani merujuk kepadanya.
- source_word: δέ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan; alur kalimat Indonesia tetap alami tanpa kata penghubung eksplisit.
- source_word: ὑπεστρώννυον
  choice: terus menghamparkan
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung atau dilakukan berulang kali; “terus menghamparkan” mempertahankan nuansa tersebut.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: jubah mereka
  rationale: Ἱμάτια berarti pakaian dan sering menunjuk pada pakaian luar; “jubah” konkret, wajar dalam konteks ini, dan tidak terlalu teknis.
- source_word: ἐν τῇ ὁδῷ
  choice: di jalan
  rationale: Frasa ini menunjukkan lokasi tempat jubah dihamparkan; “di jalan” merupakan ungkapan Indonesia yang alami dan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nuansa progresif imperfek dipertahankan melalui kata “terus”; tidak diperlukan catatan kaki karena pilihan “jubah” cukup mewakili ἱμάτια dalam konteks.
