  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: id
  text: Ketika mereka semua melihat hal itu, mereka mulai bersungut-sungut sambil berkata, “Ia masuk untuk menumpang di rumah seorang laki-laki berdosa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Ketika melihat hal itu
  rationale: Partisip aoristus diterjemahkan sebagai keterangan waktu yang alami dalam bahasa Indonesia. 'Hal itu' merujuk secara kontekstual pada tindakan Yesus pergi bersama Zakheus.
- source_word: πάντες
  choice: mereka semua
  rationale: Mempertahankan cakupan menyeluruh dari reaksi orang-orang yang menyaksikannya.
- source_word: διεγόγγυζον
  choice: mulai bersungut-sungut
  rationale: Bentuk imperfek dapat menggambarkan reaksi yang mulai timbul dan berlangsung; 'bersungut-sungut' menyampaikan keluhan bernada mencela.
- source_word: λέγοντες
  choice: katanya
  rationale: Ungkapan idiomatis Indonesia untuk memperkenalkan isi sungut-sungut mereka secara langsung.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: di rumah seorang yang berdosa
  rationale: παρά dengan datif menunjukkan tinggal pada atau di tempat seseorang. 'Seorang yang berdosa' mempertahankan acuan tunggal maskulin dalam konteks tanpa menjadikannya kaku dalam bahasa Indonesia.
- source_word: εἰσῆλθεν
  choice: Ia masuk
  rationale: Aoristus menyatakan tindakan Yesus masuk; bentuk lampau tidak perlu ditandai secara morfologis dalam bahasa Indonesia karena konteks dan verba sudah cukup jelas.
- source_word: καταλῦσαι
  choice: untuk menumpang
  rationale: Dalam konteks ini verba berarti tinggal sebagai tamu. 'Menumpang' alami dan mencakup gagasan diterima di rumah seseorang tanpa harus menyiratkan bermalam.
theological_decisions:
- issue: Sebutan orang banyak terhadap Zakheus
  choice: seorang yang berdosa
  alternative: seorang pendosa
  rationale: Pilihan ini mencerminkan konstruksi Yunani berupa adjektiva ἁμαρτωλῷ bersama nomina ἀνδρί dan mempertahankan nada penilaian orang banyak tanpa menambahkan pengertian teologis lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa mempertahankan urutan pengamatan, sungut-sungut, lalu ucapan langsung. Tidak digunakan catatan kaki karena alternatif leksikal dapat diwakili secara memadai oleh 'menumpang di rumah'.
