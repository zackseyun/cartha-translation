  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: id
  text: Lalu datanglah yang kedua dan berkata, ‘Mina Tuan telah menghasilkan lima mina.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: yang kedua
  rationale: Secara alami menyatakan pelayan kedua dalam urutan kedatangan tanpa menambahkan kata benda yang tidak diulang dalam bahasa Yunani.
- source_word: μνᾶ
  choice: mina
  rationale: Mempertahankan nama satuan uang/berat kuno dan menghindari konversi spekulatif ke mata uang modern.
- source_word: κύριε
  choice: Tuan
  rationale: Bentuk sapaan kepada seorang penguasa atau majikan dalam konteks perumpamaan; kapitalisasi menandai sapaan langsung tanpa memaksakan identifikasi ilahi.
- source_word: ἐποίησεν
  choice: telah menghasilkan
  rationale: Dalam konteks modal dan keuntungan, verba ini secara idiomatis berarti menghasilkan tambahan, sambil mempertahankan mina sebagai subjek kalimat.
theological_decisions:
- issue: Makna κύριε dalam sapaan perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks langsung adalah bawahan yang menyapa tuannya. ‘Tuan’ mempertahankan tingkat naratif ini dan tidak menutup kemungkinan adanya makna perumpamaan yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan ‘Mina Tuan’ mempertahankan penekanan bahwa mina milik sang tuan, sedangkan ‘telah menghasilkan’ terdengar alami dalam konteks keuntungan.
