  source_fidelity: 'Makna pokok tersampaikan dengan baik: tindakan mendengarkan yang berlangsung, kelanjutan pengajaran Yesus, perumpamaan, kedekatan-Nya dengan Yerusalem, dan dugaan mereka tentang penampakan Kerajaan Allah yang segera. Namun, "sudah dekat" menambahkan nuansa "sudah/already" yang tidak dinyatakan oleh ἐγγύς. Selain itu, dua alasan yang dihubungkan dalam teks Yunani lebih jelas bila keduanya sama-sama ditandai sebagai alasan dalam bahasa Indonesia.'
