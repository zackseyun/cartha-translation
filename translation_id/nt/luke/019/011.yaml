  rationale: Revisi menghapus tambahan nuansa "sudah," memperjelas bahwa kedua frasa sesudahnya merupakan alasan Yesus menyampaikan perumpamaan, dan menggunakan ungkapan pembuka yang lebih alami sambil mempertahankan aspek tindakan yang berlangsung. Catatan kaki tetap sesuai dengan kemungkinan makna leksikal ἀναφαίνεσθαι.
