id: LUK.19.11
reference: Luke 19:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: id
  text: Sementara mereka mendengarkan semua itu, Yesus melanjutkan dengan menyampaikan sebuah perumpamaan, karena Ia dekat dengan Yerusalem dan karena mereka menyangka bahwa Kerajaan Allah akan segera menampakkan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan segera dinyatakan.” Kata kerjanya dapat berarti menjadi tampak atau menjadi nyata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Ketika mereka sedang mendengarkan hal-hal itu
  rationale: Genitif absolut dengan partisipel kini menunjukkan tindakan yang sedang berlangsung dan bersamaan; bentuk ini mempertahankan nuansa tersebut secara wajar dalam bahasa Indonesia.
- source_word: προσθεὶς εἶπεν
  choice: Yesus melanjutkan dengan menyampaikan
  rationale: Ungkapan ini menunjukkan bahwa Ia menambahkan atau meneruskan perkataan-Nya. Nama 'Yesus' dipakai untuk memperjelas subjek dalam bahasa Indonesia, sedangkan 'menyampaikan' sesuai dengan objek berupa perumpamaan.
- source_word: παραβολὴν
  choice: sebuah perumpamaan
  rationale: '''Perumpamaan'' adalah istilah baku dalam Injil dan mempertahankan jenis pengajaran yang dimaksud.'
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: sebab Ia sudah dekat dengan Yerusalem
  rationale: διά dengan infinitif berartikel menyatakan alasan; αὐτόν adalah subjek akusatif infinitif sehingga Yesuslah yang berada dekat dengan Yerusalem.
- source_word: δοκεῖν αὐτοὺς
  choice: mereka menyangka
  rationale: '''Menyangka'' menyampaikan penilaian atau harapan mereka tanpa menyatakan bahwa hal itu benar atau pasti.'
- source_word: παραχρῆμα
  choice: segera
  rationale: Kata keterangan ini menekankan bahwa sesuatu diperkirakan terjadi tanpa penundaan.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: akan segera menampakkan diri
  rationale: μέλλω menyatakan kejadian yang dipandang sudah dekat, sedangkan ἀναφαίνεσθαι berarti menjadi tampak atau nyata. Gabungan 'akan segera' bersama 'menampakkan diri' menyampaikan kedua unsur itu secara alami.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku dan akurat yang mempertahankan kesinambungan teologis dan naratif dalam Injil Lukas.
theological_decisions:
- issue: Bentuk penampakan Kerajaan Allah yang mereka harapkan
  choice: Menerjemahkan bahwa Kerajaan Allah 'akan segera menampakkan diri' tanpa menentukan bentuk penampakannya.
  alternative: Menafsirkan bahwa Kerajaan Allah segera didirikan secara politis atau segera dinyatakan sepenuhnya pada akhir zaman.
  rationale: Ayat ini melaporkan harapan akan perwujudan yang segera, tetapi tidak menjelaskan apakah bentuknya politis, apokaliptis, atau rohani. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan aspek tindakan yang sedang berlangsung, dua alasan pemberian perumpamaan, serta ambiguitas mengenai cara Kerajaan Allah menjadi nyata.
