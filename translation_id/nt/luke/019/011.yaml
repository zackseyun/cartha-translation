  terminology: '"Perumpamaan" dan "Kerajaan Allah" merupakan istilah baku serta konsisten. "Menampakkan diri" secara tepat mempertahankan keterbukaan makna ἀναφαίνεσθαι tanpa menentukan bentuk manifestasi Kerajaan Allah.'
