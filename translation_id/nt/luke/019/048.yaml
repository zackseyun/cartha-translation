- from: Namun, mereka tidak menemukan apa yang dapat mereka lakukan, sebab seluruh rakyat terpikat kepada-Nya dan terus mendengarkan.[a]
  to: Mereka tidak dapat menemukan apa yang dapat mereka lakukan, sebab seluruh rakyat terpaku pada-Nya sambil mendengarkan Dia.[a]
