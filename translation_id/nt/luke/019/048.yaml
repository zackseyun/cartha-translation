  naturalness: Kalimat revisi tetap modern dan lancar. “Seluruh rakyat” dapat dipertahankan untuk λαός dalam konteks kelompok masyarakat luas, sedangkan “terpaku pada-Nya sambil mendengarkan Dia” menyampaikan perhatian yang terpusat tanpa mengubah αὐτοῦ menjadi “perkataan-Nya.”
  terminology: Kapitalisasi “-Nya” dan “Dia” tepat sebagai rujukan kepada Yesus. Tidak ada istilah teologis yang memerlukan perubahan. Catatan kaki mempertahankan alternatif lebih harfiah dan menjelaskan idiom tanpa memaksakan penafsiran doktrinal.
  issues:
