translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Terpikat kepada-Nya' menyampaikan idiom perhatian intens sambil tetap mempertahankan bahwa objek gramatikalnya adalah Yesus sendiri. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
