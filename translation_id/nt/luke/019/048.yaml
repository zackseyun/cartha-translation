  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: id
  text: Mereka tidak dapat menemukan apa yang dapat mereka lakukan, sebab seluruh rakyat terpaku pada-Nya sambil mendengarkan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seluruh rakyat bergantung pada-Nya sambil mendengarkan.” Ungkapan Yunani ini menyatakan perhatian yang sangat kuat dan penuh minat kepada Yesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: tidak menemukan
  rationale: Bentuk imperfek dengan penyangkalan menggambarkan kegagalan yang terus berlangsung untuk menemukan suatu tindakan; konteks membuat makna praktisnya jelas.
- source_word: τὸ τί ποιήσωσιν
  choice: apa yang dapat mereka lakukan
  rationale: Mempertahankan nuansa deliberatif dari τί dengan subjungtif aoris, yakni tindakan apa yang mungkin dapat mereka ambil.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: sebab seluruh rakyat
  rationale: γάρ menyatakan alasan, sedangkan ἅπας menekankan keseluruhan λαός. 'Rakyat' sesuai dengan kelompok masyarakat luas dalam konteks ini.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: terpikat kepada-Nya
  rationale: Ungkapan Yunani secara harfiah menggambarkan orang banyak 'bergantung pada-Nya' dan secara idiomatis menyatakan perhatian yang sangat kuat kepada Yesus. Pilihan ini tidak menambahkan objek 'perkataan' yang tidak dinyatakan secara eksplisit.
- source_word: ἀκούων
  choice: dan terus mendengarkan
  rationale: Partisipel kini menerangkan tindakan yang berlangsung bersamaan dengan perhatian rakyat; 'terus' mencerminkan aspek duratif tanpa membuat kalimat kaku.
