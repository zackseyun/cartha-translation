  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: id
  text: dan mereka akan menghancurkan engkau sampai rata dengan tanah, juga anak-anakmu di dalammu. Mereka tidak akan membiarkan satu batu pun tetap berada di atas batu yang lain di dalammu, karena engkau tidak mengenali saat kunjunganmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saat pemeriksaanmu.” Istilah Yunani ini dapat berarti kunjungan atau pemeriksaan, terutama kunjungan ilahi yang dapat membawa belas kasihan ataupun penghakiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: akan meratakan ... dengan tanah
  rationale: Kata kerja ini menyatakan penghancuran hingga rata dengan tanah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya gambarnya.
- source_word: σε
  choice: engkau
  rationale: Objeknya adalah kata ganti orang kedua tunggal yang menyapa Yerusalem sebagai pribadi; terjemahan ini mempertahankan personifikasi tanpa menambahkan kata 'kota'.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: anak-anakmu yang ada di dalammu
  rationale: τέκνα secara harfiah berarti 'anak-anak'. Dalam konteks ini mereka adalah orang-orang di Yerusalem, tetapi ungkapan harfiah mempertahankan gambaran Yerusalem sebagai ibu.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: Mereka tidak akan membiarkan satu batu pun tetap berada di atas batu yang lain di dalammu
  rationale: Susunan ini mengungkapkan kehancuran menyeluruh, mempertahankan kedua bentuk tunggal 'batu' dan keterangan 'di dalammu', serta terdengar wajar dalam bahasa Indonesia.
- source_word: ἀνθ’ ὧν
  choice: karena
  rationale: Dalam konteks ini frasa tersebut memperkenalkan alasan bagi penghukuman; 'karena' menyampaikan hubungan sebab-akibat dengan jelas.
- source_word: ἔγνως
  choice: tidak mengenali
  rationale: γινώσκω dapat berarti mengetahui atau mengenali. Di sini maksudnya adalah kegagalan memahami dan menyambut tindakan Allah yang menentukan.
- source_word: καιρὸν
  choice: saat
  rationale: καιρός menunjuk pada waktu yang bermakna atau menentukan. 'Saat' ringkas, alami, dan sesuai dengan konteks kunjungan.
- source_word: τῆς ἐπισκοπῆς σου
  choice: kunjunganmu
  rationale: ἐπισκοπή dapat berarti kunjungan atau pemeriksaan, khususnya tindakan mendatangi untuk memperhatikan. 'Kunjunganmu' mempertahankan gema kunjungan ilahi dan bentuk posesif σου tanpa menjelaskan pelakunya secara berlebihan.
theological_decisions:
- issue: Makna ἐπισκοπή dalam konteks penghukuman
  choice: kunjunganmu, dengan nuansa kunjungan ilahi tetap tersirat
  alternative: pemeriksaanmu; saat Allah mengunjungimu
  rationale: Istilah Yunani ini dapat menunjuk pada kunjungan yang membawa belas kasihan maupun penghakiman. Terjemahan utama mempertahankan ketegangan itu dan tidak mempersempitnya menjadi pemeriksaan atau menambahkan Allah sebagai pelaku secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kata ganti 'engkau' mempertahankan sapaan tunggal dan personifikasi Yerusalem. Ungkapan 'anak-anakmu' sengaja tidak diratakan menjadi 'pendudukmu'. Penanda catatan kaki ditempatkan sesudah 'kunjunganmu', yaitu istilah yang dijelaskan.
