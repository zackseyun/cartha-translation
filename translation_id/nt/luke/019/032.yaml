  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: id
  text: Lalu orang-orang yang diutus itu pergi dan mendapati seperti yang telah Yesus katakan kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan mendapati,” dengan objek yang dipahami dari konteks, yaitu keledai muda yang telah Yesus sebutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: pergilah
  rationale: Partisip aoris dari ἀπέρχομαι menyatakan tindakan pergi; bentuk ini alami dalam rangkaian narasi Indonesia dan tetap membawa gagasan berangkat.
- source_word: δὲ
  choice: Lalu
  rationale: δέ menandai kelanjutan narasi. 'Lalu' menyampaikan perkembangan peristiwa secara alami tanpa memberi hubungan sebab-akibat yang terlalu kuat.
- source_word: οἱ ἀπεσταλμένοι
  choice: orang-orang yang diutus itu
  rationale: Partisip perfekt pasif artikular ini berfungsi sebagai nomina. Pilihan ini mempertahankan makna pasif dan menghindari penafsiran tambahan seperti 'utusan' atau 'murid-murid'.
- source_word: εὗρον
  choice: menemukan semuanya
  rationale: Secara harfiah verba ini berarti 'menemukan' tanpa objek yang dinyatakan. 'Semuanya' membuat kalimat Indonesia alami dan mengacu secara umum pada keadaan yang mereka jumpai, sambil tidak membatasi objek hanya pada keledai muda.
- source_word: καθὼς
  choice: tepat seperti
  rationale: καθώς menyatakan kesesuaian; 'tepat seperti' menonjolkan bahwa keadaan yang ditemukan sesuai dengan perkataan sebelumnya.
- source_word: εἶπεν αὐτοῖς
  choice: yang telah dikatakan Yesus kepada mereka
  rationale: λέγω berarti 'mengatakan'. Bentuk pasif Indonesia yang menyebut Yesus sebagai pelaku terdengar wajar di sini, sedangkan 'telah' menunjukkan bahwa perkataan itu mendahului penemuan tersebut. Nama Yesus dijelaskan dari konteks sebagai subjek tersirat.
