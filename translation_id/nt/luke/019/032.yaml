translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Orang-orang yang diutus itu' mempertahankan struktur pasif Yunani; 'tepat seperti' menjaga penekanan pada kesesuaian dengan perkataan Yesus.
