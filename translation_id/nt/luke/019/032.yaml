revisions:
- from: Lalu pergilah orang-orang yang diutus itu dan menemukan semuanya tepat seperti yang telah dikatakan Yesus kepada mereka.[a]
  to: Lalu orang-orang yang diutus itu pergi dan mendapati seperti yang telah Yesus katakan kepada mereka.[a]
  rationale: Revisi menghapus “semuanya,” yang tidak tersurat dalam teks Yunani dan berpotensi memperluas cakupan objek. Verba “mendapati” memungkinkan objek tetap tersirat, sebagaimana pada εὗρον, sambil menghasilkan kalimat Indonesia yang wajar. Susunan kalimat juga dinormalkan untuk penggunaan Indonesia modern.
