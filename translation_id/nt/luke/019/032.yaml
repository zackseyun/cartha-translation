review_pass:
  verdict: revise
  source_fidelity: Teks Yunani menyatakan bahwa mereka yang telah diutus pergi dan mendapati keadaan itu sesuai dengan apa yang Yesus katakan kepada mereka. Objek εὗρον tidak dinyatakan dan secara konteks dapat dipahami, tetapi pilihan “semuanya” menambahkan cakupan menyeluruh yang tidak ada dalam teks.
  naturalness: “Lalu pergilah orang-orang yang diutus itu” dapat dipahami, tetapi urutan “orang-orang yang diutus itu pergi” lebih alami dalam bahasa Indonesia modern. “Mendapati seperti yang telah Yesus katakan kepada mereka” juga alami tanpa perlu menambahkan objek.
  terminology: “Orang-orang yang diutus itu” dengan tepat mempertahankan bentuk pasif substantival. Penyebutan “Yesus” tepat berdasarkan konteks langsung. Tidak ada istilah teologis khusus yang memerlukan perubahan.
  issues:
  - severity: medium
    issue: Kata “semuanya” ditambahkan sebagai objek εὗρον.
    rationale: εὗρον tidak memiliki objek eksplisit. “Semuanya” memperluas makna menjadi seluruh keadaan/perincian, sedangkan teks hanya menyatakan bahwa mereka mendapati sesuatu/keadaan itu sesuai dengan perkataan Yesus. Objek sebaiknya tetap tersirat dalam bahasa Indonesia.
  - severity: low
    issue: Susunan “Lalu pergilah orang-orang yang diutus itu” kurang idiomatis dibanding susunan subjek–predikat biasa.
    rationale: Inversi ini tidak salah, tetapi “Lalu orang-orang yang diutus itu pergi” lebih wajar dalam prosa Indonesia modern dan tetap mempertahankan alur naratif δέ.
  revised_text: Lalu orang-orang yang diutus itu pergi dan mendapati seperti yang telah Yesus katakan kepada mereka.[a]
