  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: id
  text: Namun, warga negerinya membenci dia dan mengirim sebuah delegasi[a] untuk menyusulnya dengan pesan, “Kami tidak mau orang ini menjadi raja atas kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rombongan utusan resmi.” Istilah Yunani ini menunjuk pada suatu badan perwakilan yang dikirim untuk menjalankan misi resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: warga negerinya
  rationale: Menjaga makna kewargaan dan komunitas politik tanpa menyebut mereka sebagai ‘rakyat’ atau ‘bawahan’, yang dapat mengandaikan terlebih dahulu kedudukan raja yang justru mereka tolak.
- source_word: ἐμίσουν
  choice: membenci
  rationale: Bentuk imperfek menunjukkan sikap bermusuhan yang sedang berlangsung atau menjadi ciri mereka; ‘membenci’ merupakan ungkapan Indonesia yang alami dan tidak melebihkan kekuatannya.
- source_word: ἀπέστειλαν
  choice: mengirim
  rationale: Padanan naratif yang jelas dan alami bagi verba aoris ini.
- source_word: πρεσβείαν
  choice: sebuah delegasi
  rationale: Istilah ini menunjuk pada badan perwakilan yang diutus untuk misi resmi. ‘Delegasi’ mempertahankan latar politis dan lazim dalam bahasa Indonesia modern.
- source_word: ὀπίσω αὐτοῦ
  choice: untuk menyusulnya
  rationale: Dalam konteks ini, rombongan itu dikirim sesudah keberangkatannya. ‘Menyusulnya’ menyampaikan gerak mengikuti setelah dia pergi dengan alami.
- source_word: λέγοντες
  choice: dengan pesan
  rationale: Partisip ini memperkenalkan isi yang disampaikan oleh delegasi; ‘dengan pesan’ lebih alami daripada terjemahan harfiah ‘dengan berkata’ dalam susunan kalimat Indonesia ini.
- source_word: Οὐ θέλομεν
  choice: Kami tidak mau
  rationale: Menyampaikan kehendak dan penolakan secara langsung dalam bahasa Indonesia modern.
- source_word: τοῦτον
  choice: orang ini
  rationale: Mempertahankan nada demonstratif yang berjarak dan agak meremehkan tanpa menambahkan penghinaan yang lebih keras.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: memerintah sebagai raja atas kami
  rationale: Mempertahankan nuansa kerajaan yang khusus pada βασιλεύω, bukan meratakannya menjadi kekuasaan atau pemerintahan secara umum.
theological_decisions:
- issue: Nuansa politik dan kerajaan dalam perumpamaan
  choice: memerintah sebagai raja atas kami
  alternative: memerintah atas kami
  rationale: Bahasa sumber secara khusus berbicara tentang pemerintahan seorang raja. Terjemahan mempertahankan gambaran kerajaan serta penolakan terhadapnya tanpa menetapkan penafsiran alegoris tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Delegasi’ cukup dikenal oleh pembaca umum dan sesuai dengan latar politik; catatan kaki menyediakan ungkapan penjelas yang lebih transparan. Tanda petik melengkung dipakai untuk ucapan langsung.
