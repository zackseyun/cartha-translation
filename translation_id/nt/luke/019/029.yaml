base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: id
  text: Lalu, ketika ia mendekati Betfage dan Betania, ke arah bukit yang disebut Zaitun,[a] ia mengutus dua orang dari antara para murid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lazim, “Bukit Zaitun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Dan terjadilah
  rationale: Mempertahankan formula naratif khas Lukas sekaligus memakai ungkapan Indonesia yang wajar dan bermartabat.
- source_word: ὡς
  choice: ketika
  rationale: Dalam konteks ini ὡς memperkenalkan anak kalimat temporal. 'Ketika' alami dalam bahasa Indonesia dan tidak menentukan waktu secara lebih sempit daripada teks Yunani.
- source_word: ἤγγισεν
  choice: ia mendekati
  rationale: ἐγγίζω menyatakan gerak mendekat ke suatu tempat; 'mendekati' merupakan padanan modern yang langsung.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: Betfage dan Betania
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; arah geraknya sudah tersampaikan oleh verba 'mendekati'.
- source_word: πρὸς τὸ ὄρος
  choice: ke arah bukit
  rationale: πρός menyatakan orientasi arah atau lokasi relatif. 'Ke arah' mempertahankan nuansa itu, sedangkan 'bukit' merupakan sebutan Indonesia yang lazim bagi lokasi ini.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: yang disebut Zaitun
  rationale: Mempertahankan bentuk Yunani yang ringkas, secara harfiah menyebut bukit itu 'Zaitun' (Ἐλαιῶν adalah bentuk genitif jamak), sementara bentuk nama yang lebih lazim dijelaskan dalam catatan kaki.
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: '''Mengutus'' sesuai untuk tindakan mengirim orang dengan suatu tugas dan cocok dengan konteks murid-murid yang diberi perintah.'
- source_word: δύο τῶν μαθητῶν
  choice: dua orang dari antara murid-murid itu
  rationale: Menyatakan konstruksi partitif secara jelas dan mempertahankan artikel tertentu tanpa menambahkan kata 'miliknya' yang tidak tersurat dalam bahasa Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Formula pembuka Lukas tetap tampak, tetapi susunan kalimat dijaga agar dapat dipahami pembaca umum. Kata ganti 'ia' tidak dikapitalisasi karena kapitalisasi penghormatan tidak ditandai dalam teks Yunani.
