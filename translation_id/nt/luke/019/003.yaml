source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: id
  text: Ia terus berusaha untuk melihat siapa Yesus itu, tetapi tidak dapat melihat-Nya karena terhalang oleh orang banyak, sebab ia bertubuh pendek.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia kecil dalam hal perawakan.” Dalam konteks ini, ungkapan Yunani tersebut menunjuk pada tinggi badan, bukan usia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: terus berusaha
  rationale: Bentuk imperfek menggambarkan usaha yang sedang berlangsung; frasa ini lebih kuat daripada sekadar 'ingin'.
- source_word: ἰδεῖν
  choice: melihat
  rationale: Infinitif ini menyatakan tujuan usahanya dan secara wajar diterjemahkan 'melihat'.
- source_word: τὸν Ἰησοῦν τίς ἐστιν
  choice: melihat siapa Yesus itu
  rationale: Terjemahan ini mempertahankan susunan dan ambiguitas τίς ἐστιν, yang dapat menyangkut identitas maupun seperti apa orangnya, tanpa menambahkan tafsiran.
- source_word: οὐκ ἠδύνατο
  choice: tidak dapat melihat-Nya
  rationale: Objek 'melihat-Nya' dibuat eksplisit dalam bahasa Indonesia agar kalimat alami; objeknya jelas dari klausa sebelumnya.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: karena terhalang orang banyak
  rationale: ἀπό di sini menyatakan penyebab yang menghalangi. 'Terhalang orang banyak' menyampaikan hubungan situasionalnya dengan jelas dan alami.
- source_word: ὅτι
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan ia terhalang melihat.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: tubuhnya pendek
  rationale: Dalam konteks terhalang kerumunan, ἡλικία menunjuk pada perawakan atau tinggi badan, bukan usia. Ungkapan ini jelas bagi pembaca modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Ia' menjaga register naratif; 'orang banyak' merupakan padanan alami bagi kerumunan dalam gaya Alkitab. Pengulangan sebab dipertahankan dengan 'karena ... sebab' untuk mencerminkan dua hubungan kausal dalam teks Yunani.
