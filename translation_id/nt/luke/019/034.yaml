id: LUK.19.34
reference: Luke 19:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: id
  text: Lalu mereka berkata[a], “Tuhan memerlukannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuan itu memerlukannya,” jika κύριος dipahami sebagai tuan atau pemilik, bukan sebagai gelar bagi Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Lalu mereka
  rationale: δέ merupakan penghubung ringan dalam alur narasi. “Lalu” menyampaikan kelanjutan peristiwa secara alami tanpa menambahkan pertentangan; artikel οἱ dipakai secara substantival untuk menunjuk para murid yang telah disebutkan.
- source_word: εἶπαν
  choice: berkata
  rationale: Bentuk aoris dari λέγω berarti “berkata.” Walaupun ucapan ini merupakan jawaban dalam konteksnya, “menjawab” akan menambahkan nuansa yang tidak dinyatakan secara eksplisit oleh verba Yunani.
- source_word: ὅτι
  choice: diwakili oleh tanda petik
  rationale: ὅτι memperkenalkan ucapan langsung. Dalam bahasa Indonesia, fungsi ini disampaikan secara wajar dengan tanda petik tanpa menerjemahkannya sebagai kata tersendiri.
- source_word: Ὁ κύριος
  choice: Tuhan
  rationale: κύριος dapat berarti “Tuhan” atau “tuan/pemilik.” Konteks Injil Lukas kuat menunjuk kepada Yesus, sehingga bentuk utama memakai gelar “Tuhan,” sementara kemungkinan makna lainnya dipertahankan dalam catatan kaki.
- source_word: αὐτοῦ
  choice: -nya dalam “memerlukannya”
  rationale: Pronomina genitif ini paling wajar merujuk kepada keledai muda yang baru disebutkan. Akhiran “-nya” mempertahankan rujukan pronominal tanpa membuat teks lebih eksplisit daripada bahasa Yunani.
- source_word: χρείαν ἔχει
  choice: memerlukan
  rationale: Ungkapan harfiahnya adalah “mempunyai kebutuhan akan.” “Memerlukan” merupakan padanan Indonesia yang alami, jelas, dan setara maknanya.
theological_decisions:
- issue: Rujukan κύριος dalam jawaban para murid
  choice: “Tuhan,” yang dalam konteks dipahami menunjuk kepada Yesus
  alternative: “Tuan” atau “pemilik,” yakni pemilik keledai muda itu
  rationale: Kalimat ini mengulangi jawaban yang sebelumnya diperintahkan Yesus, dan Lukas kerap memakai κύριος sebagai gelar bagi Yesus. Namun, karena kata tersebut juga dapat berarti “tuan” atau “pemilik,” ambiguitas leksikal yang nyata dicatat tanpa diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Lalu” menjaga aliran cerita; “memerlukannya” lebih alami dalam bahasa Indonesia daripada bentuk harfiah “mempunyai kebutuhan akan itu.”
