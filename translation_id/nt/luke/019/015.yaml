id: LUK.19.15
reference: Luke 19:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: id
  text: Ketika ia kembali setelah menerima kekuasaan kerajaan[a], ia menyuruh supaya hamba-hamba[b] yang telah diberinya uang itu dipanggil menghadap kepadanya, agar ia mengetahui apa yang mereka hasilkan dari berdagang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setelah menerima kerajaan”; dalam konteks ini maksudnya menerima kedudukan dan kekuasaan untuk memerintah sebagai raja.
    reason: lexical_alternative
  - marker: b
    text: Atau “budak-budak”; kata Yunani doulos menunjuk orang yang berada di bawah kuasa seorang tuan.
    reason: lexical_alternative
  - marker: c
    text: Atau “usaha apa yang telah mereka lakukan.” Kata Yunani ini dapat menunjuk kegiatan berdagang serta hasil yang diperoleh darinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: Setelah ia kembali
  rationale: Ungkapan naratif ἐγένετο tidak perlu diterjemahkan secara kaku dalam bahasa Indonesia; konstruksi ἐν τῷ dengan infinitif menyatakan waktu, dan partisip berikutnya menunjukkan bahwa penerimaan kekuasaan telah terjadi sebelum ia memanggil para hamba.
- source_word: λαβόντα τὴν βασιλείαν
  choice: dengan menerima kekuasaan sebagai raja
  rationale: Dalam konteks perumpamaan ini, βασιλεία menunjuk pada kedudukan atau kekuasaan kerajaan yang diterima bangsawan itu, bukan terutama wilayah. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan tindakan menerima, bukan merebut.
- source_word: φωνηθῆναι αὐτῷ
  choice: dipanggil menghadap kepadanya
  rationale: Bentuk pasif φωνηθῆναι menyatakan bahwa mereka diperintahkan untuk dipanggil; 'menghadap' memperjelas arah αὐτῷ tanpa menambahkan gagasan bahwa mereka diseret atau diadili.
- source_word: δούλους
  choice: hamba-hamba
  rationale: Istilah δοῦλος menunjuk orang yang berada di bawah kuasa tuannya. 'Hamba' merupakan padanan Indonesia yang wajar dalam narasi bermartabat, sementara alternatif 'budak' dicatat untuk menampilkan status sosialnya secara lebih tegas.
- source_word: δεδώκει τὸ ἀργύριον
  choice: yang telah diberinya uang itu
  rationale: Bentuk pluperfek δεδώκει menunjukkan pemberian yang sudah dilakukan sebelumnya. ἀργύριον secara leksikal dapat berarti perak atau uang; konteks transaksi mendukung 'uang'.
- source_word: ἵνα γνοῖ
  choice: Ia ingin mengetahui
  rationale: Klausa ἵνα menyatakan tujuan. Pemisahan menjadi kalimat kedua menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan tujuan dengan perintah sebelumnya.
- source_word: τί διεπραγματεύσαντο
  choice: apa yang mereka hasilkan dari berdagang
  rationale: Verba ini mencakup kegiatan berusaha atau berdagang beserta hasilnya. Terjemahan ini mempertahankan pertanyaan 'apa' dan mengungkap unsur kegiatan niaga tanpa membatasi hasil itu hanya pada laba bersih.
theological_decisions:
- issue: Makna βασιλεία dalam latar politik perumpamaan
  choice: kekuasaan sebagai raja
  alternative: kerajaan
  rationale: Konteks menggambarkan seorang bangsawan yang pergi untuk memperoleh wewenang memerintah. Pilihan ini menghindari kesan bahwa ia sekadar menerima suatu wilayah, tetapi catatan kaki mempertahankan bentuk tradisional yang lebih harfiah.
- issue: Status sosial para δοῦλοι
  choice: hamba-hamba
  alternative: budak-budak
  rationale: Teks menekankan bahwa mereka berada di bawah otoritas bangsawan dan mengelola uangnya. 'Hamba' terbaca alami dalam bahasa Indonesia modern yang bermartabat, sedangkan catatan kaki menjaga kemungkinan padanan yang menonjolkan keterikatan hukum dan sosial.
- issue: Cakupan hasil dari διεπραγματεύσαντο
  choice: apa yang mereka hasilkan dari berdagang
  alternative: usaha apa yang telah mereka lakukan
  rationale: Tuan itu hendak mengetahui hasil penggunaan uang, tetapi verba Yunani juga menunjuk kegiatan bisnis. Rumusan utama memuat kedua unsur tanpa menentukan terlebih dahulu bahwa setiap hamba pasti memperoleh laba.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan panjang Yunani dibagi menjadi dua kalimat agar mudah dipahami. Istilah ekonomi dibuat jelas bagi pembaca umum, sedangkan nuansa kerajaan, status sosial, dan cakupan verba perdagangan dipertahankan melalui catatan kaki.
