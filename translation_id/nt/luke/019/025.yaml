  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: id
  text: Dan mereka berkata kepadanya, “Tuan[a], ia mempunyai sepuluh mina[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuhan.” Kata Yunani yang dipakai dapat menjadi sapaan hormat kepada seorang penguasa atau sebutan bagi Tuhan.'
    reason: lexical_alternative
  - marker: b
    text: Mina adalah satuan uang kuno, kira-kira setara dengan upah seratus hari kerja.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung naratif sederhana tanpa menambahkan nuansa waktu atau pertentangan.
- source_word: εἶπαν αὐτῷ
  choice: mereka berkata kepadanya
  rationale: Bentuk aoris diterjemahkan sebagai tindakan lampau sederhana; datif αὐτῷ berfungsi sebagai objek tak langsung yang merujuk kepada tokoh penguasa dalam perumpamaan.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam sapaan kepada seorang penguasa manusia di dalam perumpamaan, 'Tuan' menyampaikan penghormatan dan kewenangan secara alami tanpa memastikan bahwa sapaan itu merupakan pengakuan ilahi.
- source_word: ἔχει
  choice: ia mempunyai
  rationale: Menyatakan kepemilikan secara langsung tanpa menambahkan penekanan seperti 'sudah' yang tidak dinyatakan secara leksikal.
- source_word: δέκα μνᾶς
  choice: sepuluh mina
  rationale: '''Mina'' mempertahankan satuan uang kuno dalam latar historis dan menghindari padanan mata uang modern yang dapat menyesatkan.'
theological_decisions:
- issue: Arti κύριος sebagai sapaan dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Konteks langsungnya adalah sapaan kepada tokoh penguasa dalam perumpamaan, sehingga 'Tuan' merupakan sapaan Indonesia yang wajar. Catatan kaki mempertahankan kemungkinan padanan 'Tuhan' tanpa memaksakan pembacaan kristologis ataupun meniadakan gema kewenangan yang ada pada κύριος.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Tanda pisah pada akhir ucapan dipertahankan untuk mencerminkan bentuk teks Yunani yang menyajikan seruan itu secara terputus atau terbuka.
