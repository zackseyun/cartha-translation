  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: id
  text: Mengapa kamu tidak menyimpan uangku di bank[a]? Maka, ketika aku datang, aku tentu sudah menagihnya beserta bunganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "menyetorkan uangku kepada bankir"; secara harfiah, "memberikan uangku di atas meja."
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Mengapa
  rationale: Ungkapan tanya ini meminta alasan dan tetap menyampaikan nada teguran secara alami dalam bahasa Indonesia.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: menaruh ... di bank
  rationale: Secara harfiah ungkapan ini berarti memberikan uang 'di atas meja', tetapi dalam konteks keuangan τράπεζα menunjuk pada meja penukar uang atau lembaga penyimpanan uang. 'Menaruh ... di bank' jelas dan wajar bagi pembaca modern.
- source_word: μου τὸ ἀργύριον
  choice: uangku
  rationale: ἀργύριον secara harfiah dapat berarti perak, tetapi dalam konteks transaksi ini bermakna uang.
- source_word: κἀγὼ ἐλθὼν
  choice: Dengan demikian, ketika aku kembali
  rationale: Partisip aoris diterjemahkan sebagai anak kalimat waktu. 'Kembali' sesuai dengan alur perumpamaan tentang tuan yang pergi lalu datang lagi, sedangkan 'dengan demikian' menyatakan akibat yang tersirat.
- source_word: σὺν τόκῳ
  choice: beserta bunganya
  rationale: τόκος di sini adalah bunga atas uang yang disimpan; pilihan ini memakai istilah keuangan Indonesia yang lazim tanpa memasukkan penilaian moral tambahan.
- source_word: αὐτὸ ἔπραξα
  choice: aku dapat mengambilnya
  rationale: Dalam konteks komersial, πράσσω berarti memperoleh atau menagih kembali jumlah yang menjadi hak seseorang. 'Mengambilnya' alami dan mencakup uang pokok yang disebut bersama bunganya.
