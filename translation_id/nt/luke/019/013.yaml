  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: id
  text: Setelah memanggil sepuluh orang budaknya[a], ia memberi mereka sepuluh mina[b] dan berkata kepada mereka, “Berdaganglah sampai aku datang.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani δοῦλος dapat berarti “budak”, “hamba”, atau “pelayan”, bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Mina adalah satuan moneter pada zaman dahulu.
    reason: cultural_note
  - marker: c
    text: Atau, “Berusahalah sampai aku datang” atau “Jalankanlah bisnis sampai aku datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Lalu ia memanggil
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. Susunan dengan “lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: δούλους
  choice: budaknya
  rationale: Dalam kerangka perumpamaan ini, mereka berada dalam relasi kepemilikan dengan tuannya; “budak” mempertahankan realitas sosial tersebut, sementara catatan kaki mencatat kemungkinan padanan yang lebih lunak.
- source_word: ἑαυτοῦ
  choice: -nya
  rationale: Bentuk posesif pada “budaknya” secara idiomatis menyatakan bahwa kesepuluh orang itu adalah miliknya sendiri; menerjemahkannya secara terpisah sebagai “miliknya sendiri” terasa berlebihan dalam bahasa Indonesia.
- source_word: μνᾶς
  choice: mina
  rationale: Transliterasi mempertahankan kekhususan satuan uang kuno dan menghindari penyamaan yang menyesatkan dengan mata uang modern.
- source_word: Πραγματεύσασθε
  choice: Berdaganglah dengan uang ini
  rationale: Imperatif ini menyuruh mereka menjalankan kegiatan usaha atau perdagangan. Tambahan “dengan uang ini” membuat objek tersirat jelas secara alami dari konteks tanpa menentukan cara investasinya secara berlebihan.
- source_word: ἐν ᾧ ἔρχομαι
  choice: sampai aku kembali
  rationale: Ungkapan temporal ini secara idiomatis berarti sampai sang tuan datang kembali; “kembali” sesuai dengan konteks kepergiannya tanpa memaksakan arti harfiah yang janggal.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks perumpamaan tentang tuan dan budak
  choice: budak
  alternative: hamba; pelayan
  rationale: Konteks menampilkan orang-orang yang menjadi milik seorang tuan dan menerima sumber daya darinya. “Budak” paling jelas mempertahankan hubungan sosial dan kepemilikan itu, tanpa mengubahnya menjadi jabatan keagamaan atau sekadar pekerjaan rumah tangga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Budak” dipilih demi ketepatan konteks sosial; “mina” dipertahankan sebagai istilah historis dan dijelaskan dalam catatan kaki. Kalimat langsung dibuat alami tanpa menghilangkan urutan tindakan dalam teks Yunani.
