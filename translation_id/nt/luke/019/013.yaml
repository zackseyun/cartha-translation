revisions:
- from: Lalu ia memanggil sepuluh orang budaknya[a], memberi mereka sepuluh mina[b], dan berkata kepada mereka, “Berdaganglah dengan uang ini sampai aku kembali.”[c]
  to: Setelah memanggil sepuluh orang budaknya[a], ia memberi mereka sepuluh mina[b] dan berkata kepada mereka, “Berdaganglah sampai aku datang.”[c]
  rationale: Revisi menghilangkan penambahan “uang ini” dan memakai “datang” alih-alih “kembali” agar cakupan makna sumber dipertahankan. Susunan “Setelah memanggil ... ia memberi” menyampaikan hubungan partisip aoris dengan verba utama secara idiomatis. Tidak ada perubahan pada makna dasar, istilah sosial “budak”, atau istilah historis “mina”.
