  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: id
  text: Mereka membawa keledai muda itu kepada Yesus. Kemudian mereka menaruh jubah mereka di atas keledai itu dan menaikkan Yesus ke atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka membuat Yesus naik ke atasnya,” yaitu ke atas keledai muda itu.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἤγαγον
  choice: membawa
  rationale: Bentuk aoris dari ἄγω menyatakan bahwa mereka membawa atau menuntun hewan itu kepada Yesus; “membawa” paling alami dan tetap mencakup tindakan menuntunnya.
- source_word: αὐτὸν
  choice: keledai muda itu
  rationale: Pronomina maskulin ini mengacu kepada πῶλος dalam konteks sebelumnya. Pengulangan nomina dalam bahasa Indonesia memperjelas acuannya tanpa menambahkan makna baru.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kepada Yesus
  rationale: πρός dengan akusatif menunjukkan gerak menuju seseorang; “kepada Yesus” merupakan ungkapan Indonesia yang wajar.
- source_word: ἐπιρίψαντες
  choice: kemudian mereka menaruh
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. “Kemudian” menyampaikan urutan tersebut secara alami; “menaruh” sesuai dengan tindakan meletakkan jubah di atas punggung hewan tanpa menuntut gambaran lemparan keras.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: jubah mereka
  rationale: ἱμάτια merujuk pada pakaian luar; “jubah” ringkas, jelas, dan sesuai dengan latar kuno.
- source_word: ἐπὶ τὸν πῶλον
  choice: di atas keledai itu
  rationale: ἐπί dengan akusatif di sini menyatakan penempatan pada hewan tersebut. Pengulangan “keledai itu” menghindari ketidakjelasan pronomina.
- source_word: πῶλον
  choice: keledai muda
  rationale: πῶλος pada dasarnya berarti hewan muda; konteks dekat mengidentifikasinya sebagai keledai. “Keledai muda” akurat dan lebih mudah dipahami pembaca Indonesia daripada istilah umum “anak hewan”.
- source_word: ἐπεβίβασαν
  choice: menaikkan
  rationale: Verba ini bersifat kausatif, yakni membuat seseorang naik atau berada di atas tunggangan. “Menaikkan Yesus ke atasnya” mempertahankan makna itu dengan jelas.
- source_word: τὸν Ἰησοῦν
  choice: Yesus
  rationale: Bentuk baku nama Ἰησοῦς dalam bahasa Indonesia.
theological_decisions: []
