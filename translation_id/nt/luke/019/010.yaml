id: LUK.19.10
reference: Luke 19:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: id
  text: Sebab Anak Manusia datang untuk mencari dan menyelamatkan yang hilang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang hilang.” Ungkapan Yunani berbentuk tunggal dan dapat dipahami secara generik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: datang
  rationale: Aoristus indikatif ini menyatakan kedatangan sebagai fakta dalam rangkuman misi Yesus. Bahasa Indonesia tidak menandai kala secara morfologis, dan konteks membuat waktunya jelas.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan logis itu secara ringkas dan wajar.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar diri Yesus ini diterjemahkan dalam bentuk baku yang mempertahankan gema Daniel dan kedalaman teologisnya tanpa parafrasa.
- source_word: ζητῆσαι
  choice: untuk mencari
  rationale: Infinitif aoristus sesudah kata kerja kedatangan menyatakan tujuan. “Untuk mencari” mengungkapkan pengejaran yang disengaja.
- source_word: σῶσαι
  choice: menyelamatkan
  rationale: Dalam Lukas, kata ini memiliki cakupan keselamatan yang melampaui pertolongan fisik semata; pilihan ini juga sesuai dengan konteks keselamatan dalam ayat sebelumnya.
- source_word: τὸ ἀπολωλός
  choice: yang hilang
  rationale: Partisipel perfektum substantival netral tunggal ini menunjuk pada keadaan hilang dan dapat dipahami secara generik atau kolektif. “Yang hilang” alami dalam bahasa Indonesia serta tidak membatasi rujukannya hanya kepada satu laki-laki.
theological_decisions:
- issue: Cakupan dan nuansa τὸ ἀπολωλός
  choice: yang hilang
  alternative: apa yang hilang; orang yang hilang
  rationale: Bentuk netral tunggal berartikel dapat berfungsi secara generik atau kolektif. Dalam konteks, ungkapan ini langsung berkaitan dengan Zakheus, tetapi juga merangkum misi Yesus secara lebih luas. Terjemahan utama mempertahankan keluasan dan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan “datang untuk mencari dan menyelamatkan” alami sekaligus dekat dengan struktur tujuan dalam teks Yunani. Penanda catatan kaki ditempatkan setelah kalimat.
