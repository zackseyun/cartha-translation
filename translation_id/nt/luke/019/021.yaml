  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: id
  text: Sebab aku takut kepada Tuan, karena Tuan adalah orang yang keras[a]. Tuan mengambil apa yang tidak Tuan taruh[b] dan menuai apa yang tidak Tuan tabur.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tegas” atau “ketat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengambil apa yang tidak Tuan taruh.” Dalam konteks ini, ungkapan itu juga dapat dipahami sebagai “mengambil apa yang tidak Tuan letakkan” atau, secara lebih interpretatif, “memungut apa yang tidak Tuan setorkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: aku takut
  rationale: Bentuk imperfek menyatakan keadaan takut pada waktu lampau; dalam bahasa Indonesia, konteks naratif sudah cukup menyampaikan waktu itu tanpa penanda aspek tambahan yang terasa kaku.
- source_word: γάρ
  choice: sebab
  rationale: Menandai bahwa ucapan ini memberikan alasan bagi pernyataan sebelumnya, sekaligus menghindari pengulangan 'karena' dengan klausa berikutnya.
- source_word: αὐστηρὸς
  choice: keras
  rationale: Menyampaikan sifat tegas, menuntut, atau keras dengan nada negatif yang sesuai dengan tuduhan hamba, tanpa memperkerasnya menjadi 'kejam'.
- source_word: αἴρεις
  choice: mengambil
  rationale: Padanan luas dan langsung bagi αἴρω yang mempertahankan gambaran sumber tanpa menambahkan arti komersial tertentu.
- source_word: ὃ οὐκ ἔθηκας
  choice: apa yang tidak Tuan taruh
  rationale: Mempertahankan arti konkret τίθημι, 'menaruh/meletakkan', dan tidak mempersempitnya menjadi 'menyetorkan'.
- source_word: θερίζεις
  choice: menuai
  rationale: Mempertahankan metafora pertanian serta pasangan ungkapan yang alami dengan 'menabur'.
- source_word: ὃ οὐκ ἔσπειρας
  choice: apa yang tidak Tuan tabur
  rationale: Menerjemahkan σπείρω secara langsung dan mempertahankan paralelisme menuai–menabur.
- source_word: ἄνθρωπος
  choice: orang
  rationale: Dalam bahasa Indonesia, 'orang yang keras' merupakan ungkapan alami untuk seorang laki-laki tertentu dan tidak mengubah rujukan tokoh laki-laki dalam perumpamaan.
- source_word: σε / εἶ / αἴρεις / ἔθηκας / θερίζεις / ἔσπειρας
  choice: Tuan
  rationale: Kapitalisasi sapaan 'Tuan' menandai penghormatan seorang hamba kepada majikannya dan memperjelas subjek tersirat dalam verba Yunani, tanpa menjadikannya gelar ilahi.
theological_decisions:
- issue: Apakah gambaran hamba tentang tuannya perlu diperhalus untuk melindungi citra tokoh bangsawan dalam perumpamaan
  choice: Mempertahankan nada tuduhan hamba dengan 'orang yang keras'
  alternative: Memakai ungkapan yang lebih lunak seperti 'orang yang tegas' atau 'orang yang sangat disiplin'
  rationale: Ayat ini melaporkan penilaian dan pembelaan hamba sendiri. Terjemahan tidak menentukan apakah tuduhan itu benar secara objektif dan tidak meredakan ketegangan naratifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Sapaan 'Tuan' dipakai secara konsisten untuk relasi hamba–majikan. Struktur sebab–karena mempertahankan dua penghubung Yunani (γάρ dan ὅτι) tanpa terdengar terlalu berat.
