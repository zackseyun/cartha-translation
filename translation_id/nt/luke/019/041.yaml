  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: id
  text: Saat Ia mendekat dan melihat kota itu, Ia menangisinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: Ketika Ia sudah dekat
  rationale: ὡς dengan verba aoris ἤγγισεν menyatakan keadaan waktu saat Yesus mendekat. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan objek yang hanya tersirat dari konteks.
- source_word: ἰδὼν
  choice: dan melihat
  rationale: Partisip aoris ini dapat menyatakan tindakan yang bersamaan atau sedikit mendahului verba utama. Susunan 'dan melihat' mempertahankan hubungan langsung antara melihat kota dan menangisinya tanpa membuat urutan waktunya terlalu tegas.
- source_word: τὴν πόλιν
  choice: kota itu
  rationale: πόλις berarti 'kota'. Penunjuk 'itu' secara alami menandai kota yang sudah diketahui dari konteks, tanpa menambahkan nama Yerusalem yang tidak terdapat dalam ayat ini.
- source_word: ἔκλαυσεν
  choice: Ia menangis
  rationale: κλαίω berarti menangis atau meratap. 'Menangis' merupakan padanan Indonesia yang wajar dan bermartabat serta tidak menambahkan kadar intensitas yang tidak dinyatakan secara eksplisit.
- source_word: ἐπ’ αὐτήν
  choice: menangisinya
  rationale: Dengan κλαίω, ἐπί diikuti akusatif menyatakan objek yang ditangisi. Bentuk transitif 'menangisinya' alami dalam bahasa Indonesia dan menyampaikan bahwa kota itu menjadi sasaran ratapan Yesus.
theological_decisions:
- issue: Apakah gender gramatikal feminin pada πόλις dan αὐτήν perlu dipertahankan sebagai personifikasi kota
  choice: Gunakan pronomina netral '-nya' tanpa personifikasi eksplisit
  alternative: Menerjemahkan dengan ungkapan yang mempersonifikasikan Yerusalem sebagai perempuan
  rationale: Bahasa Indonesia tidak memiliki gender gramatikal pada pronomina '-nya'. Teks Yunani dapat dijelaskan sepenuhnya sebagai persesuaian gramatikal dengan πόλις yang feminin dan tidak mewajibkan personifikasi. Terjemahan ini mempertahankan ratapan atas kota tanpa memasukkan personifikasi yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina 'Ia' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk merujuk kepada Yesus. Kalimat mempertahankan keringkasan serta alur tindakan dalam teks Yunani.
