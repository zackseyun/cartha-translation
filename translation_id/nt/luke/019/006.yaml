  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Kapitalisasi pada “Dia” di catatan kaki dipakai karena rujukannya kepada Yesus; teks utama memakai nama untuk memperjelas anteseden.
