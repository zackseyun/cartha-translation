  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: id
  text: Ia pun bergegas turun dan menyambut Yesus dengan sukacita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia pun segera turun dan menerima-Nya dengan gembira.”
    reason: Alternatif leksikal untuk σπεύσας (“segera”), ὑπεδέξατο (“menerima”), dan χαίρων (“dengan gembira”).
lexical_decisions:
- source_word: σπεύσας
  choice: segera
  rationale: Partisip aoris dari σπεύδω menyatakan tindakan yang dilakukan dengan cepat dan penuh kesungguhan. “Segera” alami dalam bahasa Indonesia dan menonjolkan ketanggapannya.
- source_word: κατέβη
  choice: turun
  rationale: Verba aoris ini berarti turun. Bentuk “turun” mempertahankan arah gerak dengan ringkas dan wajar.
- source_word: ὑπεδέξατο
  choice: menyambut
  rationale: Bentuk medium dari ὑποδέχομαι berarti menerima atau menyambut, sering dengan nuansa keramahan sebagai tuan rumah. “Menyambut” menyampaikan nuansa itu secara alami.
- source_word: αὐτόν
  choice: Yesus
  rationale: Pronomina ini merujuk kepada Yesus. Penyebutan nama memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
- source_word: χαίρων
  choice: dengan sukacita
  rationale: Partisip kini dari χαίρω menyatakan keadaan emosional yang menyertai tindakan menyambut. “Dengan sukacita” mempertahankan bentuk gagasan dan nuansa kegembiraan yang kuat.
- source_word: καὶ ... καὶ
  choice: Lalu ... dan
  rationale: Rangkaian καί menghubungkan tindakan secara naratif. “Lalu” pada awal ayat menandai kelanjutan peristiwa secara alami, sedangkan “dan” menghubungkan tindakan berikutnya.
