id: LUK.19.28
reference: Luke 19:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: id
  text: Setelah mengatakan hal-hal itu, Yesus melanjutkan perjalanan di depan sambil naik ke Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Setelah
  rationale: Hubungan urutan naratif yang ditandai Καὶ bersama partisip aoris εἰπών dinyatakan secara alami melalui anak kalimat waktu; unsur penghubung tidak perlu diterjemahkan tersendiri sebagai 'dan'.
- source_word: εἰπὼν ταῦτα
  choice: setelah mengatakan hal-hal itu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama, sedangkan bentuk jamak ταῦτα tetap luas dan merujuk kepada perkataan sebelumnya tanpa mempersempitnya.
- source_word: ἐπορεύετο
  choice: berjalan
  rationale: Dalam konteks perjalanan, 'berjalan' menyatakan gerak maju secara wajar. Aspek imperfek didukung oleh konteks kelanjutan perjalanan dan konstruksi partisip yang menyertainya.
- source_word: ἔμπροσθεν
  choice: mendahului mereka
  rationale: Adverbia ini berarti berada atau bergerak di depan. Objek 'mereka' tersirat dari konteks rombongan pengikut dan diperlukan agar ungkapan Indonesia terdengar alami.
- source_word: ἀναβαίνων
  choice: naik
  rationale: Partisip kini menyatakan tindakan yang berlangsung bersamaan dengan perjalanan. 'Naik' mempertahankan bahasa pendakian menuju Yerusalem secara ringkas dan alami.
- source_word: εἰς Ἱεροσόλυμα
  choice: menuju Yerusalem
  rationale: εἰς menandai arah atau tujuan. 'Menuju' tidak menyiratkan bahwa Yesus sudah memasuki kota itu.
theological_decisions:
- issue: Mempertahankan bahasa pendakian menuju Yerusalem
  choice: naik menuju Yerusalem
  alternative: pergi ke Yerusalem
  rationale: Kata ἀναβαίνων secara nyata menyatakan gerak naik. Terjemahan ini mempertahankan dimensi geografis dan kemungkinan gema naratif-teologisnya tanpa menjelaskan lebih dari yang dikatakan teks.
- issue: Subjek tersirat pada verba orang ketiga tunggal
  choice: Yesus
  alternative: Ia
  rationale: Bahasa Yunani membiarkan subjek tersirat, tetapi konteks mengidentifikasinya sebagai Yesus. Penyebutan nama membuat ayat mandiri dan jelas dalam bahasa Indonesia tanpa mengubah rujukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan kalimat dibuat alami sambil mempertahankan urutan tindakan, gerak mendahului rombongan, dan bahasa 'naik' menuju Yerusalem.
