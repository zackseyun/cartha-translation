  naturalness: Kalimat draf pada dasarnya baku dan jelas. “Melanjutkan perjalanan di depan” memberi padanan yang alami untuk ἐπορεύετο ἔμπροσθεν tanpa memerlukan objek tambahan. “Sambil naik ke Yerusalem” secara alami menyatakan tindakan yang menyertai perjalanan.
