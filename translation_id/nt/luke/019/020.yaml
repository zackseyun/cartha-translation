  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: id
  text: Lalu hamba yang lain datang dan berkata, “Tuan, lihat, ini mina Tuan, yang saya simpan dalam sehelai kain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saputangan.” Kata Yunani σουδάριον menunjuk pada kain kecil, yang sering digunakan untuk menyeka wajah atau keringat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: orang yang lain
  rationale: Bentuk substantival ini menunjuk kepada orang lain yang tampil sesudah para hamba sebelumnya. Terjemahan ini mempertahankan kontras tanpa menambahkan kata ‘hamba’ yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: ἦλθεν λέγων
  choice: datang dan berkata
  rationale: Dalam bahasa Indonesia, konstruksi partisipial Yunani ini paling alami disampaikan sebagai dua tindakan berurutan tanpa mengubah maknanya.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam konteks perumpamaan, sapaan ini ditujukan kepada seorang bangsawan atau majikan. ‘Tuan’ mempertahankan fungsi sapaan κύριος tanpa secara dini menjadikannya pengakuan langsung bahwa orang itu adalah Tuhan.
- source_word: ἰδοὺ
  choice: lihat, ini
  rationale: Ungkapan ini sekaligus menarik perhatian dan memperlihatkan mina kepada lawan bicara; ‘lihat, ini’ menyampaikan kedua fungsi itu secara wajar.
- source_word: ἡ μνᾶ σου
  choice: mina Tuan
  rationale: ‘Mina’ mempertahankan nama satuan uang kuno tersebut dan menghindari padanan modern yang dapat menyesatkan. Pengulangan ‘Tuan’ merupakan bentuk kepemilikan yang alami dalam sapaan hormat bahasa Indonesia.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: yang saya simpan
  rationale: Frasa ini menggambarkan mina yang terus berada dalam keadaan tersimpan. ‘Saya simpan’ menyampaikan keadaan tersebut secara ringkas dan alami.
- source_word: ἐν σουδαρίῳ
  choice: dalam sehelai kain
  rationale: σουδάριον adalah kain kecil yang antara lain digunakan untuk menyeka wajah atau keringat. ‘Sehelai kain’ tidak memaksakan bentuk benda modern yang terlalu khusus; kemungkinan ‘saputangan’ dicatat dalam catatan kaki.
theological_decisions:
- issue: Terjemahan κύριος sebagai sapaan dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Referen langsung dalam alur perumpamaan adalah majikan atau bangsawan. ‘Tuan’ sesuai dengan fungsi sosial sapaan itu dalam konteks ini dan tidak menutup kemungkinan resonansi lebih luas dari perumpamaan, sedangkan ‘Tuhan’ akan menjadikan identifikasi ilahi terlalu eksplisit pada tingkat tuturan tokoh.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti ‘saya’ dan sapaan ‘Tuan’ menjaga kewajaran dialog antara hamba dan majikan. Istilah kuno ‘mina’ dipertahankan demi ketepatan historis.
