  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: id
  text: 'Aku berkata kepada kalian: setiap orang yang mempunyai akan diberi[a], tetapi dari orang yang tidak mempunyai, bahkan apa yang dipunyainya akan diambil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan diberi lebih banyak.” Kata “lebih banyak” tidak dinyatakan secara eksplisit dalam bahasa Yunani, tetapi gagasan pertambahan dapat dipahami dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Ungkapan langsung dan wajar dalam bahasa Indonesia, dengan bentuk tunggal kolektif "kepadamu" untuk ὑμῖν dalam tuturan kepada para pendengar.
- source_word: παντὶ τῷ ἔχοντι
  choice: setiap orang yang mempunyai
  rationale: Partisipel berartikel berfungsi substantival dan bersifat umum; terjemahan ini mempertahankan cakupan "setiap orang" tanpa menentukan apa yang dimiliki.
- source_word: δοθήσεται
  choice: akan diberi
  rationale: Bentuk pasif futur diterjemahkan secara formal tanpa menambahkan objek "lebih banyak" yang tidak dinyatakan eksplisit dalam bahasa Yunani.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: tetapi dari orang yang tidak mempunyai
  rationale: δέ bersifat kontras, sedangkan partisipel berartikel menunjuk secara umum kepada orang yang tidak mempunyai; ketidakjelasan mengenai objek tetap dipertahankan.
- source_word: καὶ ὃ ἔχει
  choice: bahkan apa yang dipunyainya
  rationale: καί berfungsi intensif dalam kontras ini dan wajar diterjemahkan "bahkan"; frasa relatif mempertahankan paradoks bahwa orang yang disebut tidak mempunyai masih mempunyai sesuatu.
- source_word: ἀρθήσεται
  choice: akan diambil
  rationale: Pasif futur αἴρω dalam konteks ini menyatakan pengambilan atau perampasan; "akan diambil" ringkas dan alami.
theological_decisions:
- issue: Cakupan prinsip mengenai pemberian dan kehilangan
  choice: Pepatah diterjemahkan secara lugas tanpa menjelaskan mekanisme teologisnya.
  alternative: Menafsirkannya secara eksplisit sebagai ajaran khusus tentang penatalayanan, keselamatan, jasa, Kerajaan Allah, atau predestinasi.
  rationale: Teks menyatakan prinsip dalam konteks perumpamaan, tetapi ayat ini sendiri tidak merumuskan penjelasan doktrinal; ketegangan dan keluasan penerapannya perlu tetap terbuka.
- issue: Paradoks antara "tidak mempunyai" dan "apa yang dipunyainya"
  choice: Mempertahankan kedua ungkapan secara literal dan berdampingan.
  alternative: Menghaluskan menjadi "orang yang hanya mempunyai sedikit" atau menjelaskan bahwa yang dimaksud adalah tidak menghasilkan keuntungan.
  rationale: Paradoks tersebut nyata dalam teks Yunani dan tidak boleh diselesaikan diam-diam di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina "Aku" mengikuti gaya tuturan Yesus yang lazim dalam Alkitab bahasa Indonesia. Pengulangan "mempunyai" dipertahankan untuk mencerminkan struktur dan ketegangan teks sumber.
