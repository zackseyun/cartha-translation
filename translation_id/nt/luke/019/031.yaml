id: LUK.19.31
reference: Luke 19:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: id
  text: 'Dan jika ada orang bertanya kepada kalian, “Mengapa kalian melepaskan ikatannya?” jawablah begini: “Tuhan[a] memerlukannya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tuannya memerlukannya.”'
    reason: κύριος dapat berarti “Tuhan” sebagai gelar bagi Yesus atau “tuan” dalam arti pemilik atau atasan.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: bertanya
  rationale: Kata ini lazim berarti mengajukan pertanyaan; “bertanya” alami dalam percakapan langsung.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang ringkas dan wajar untuk menanyakan alasan.
- source_word: λύετε
  choice: melepaskan ikatannya
  rationale: Dalam konteks seekor anak keledai yang tertambat, kata ini berarti melepaskan tali atau ikatannya. Bentuk ini lebih jelas dan alami daripada sekadar “melepaskannya”.
- source_word: οὕτως ἐρεῖτε
  choice: jawablah begini
  rationale: Bentuk mendatang Yunani berfungsi sebagai petunjuk. “Jawablah begini” menyampaikan daya perintahnya secara alami dalam bahasa Indonesia.
- source_word: κύριος
  choice: Tuhan
  rationale: Pilihan ini mempertahankan gelar bagi Yesus dan gema teologis yang mungkin dimaksudkan Lukas, sementara kemungkinan arti “tuan” dicatat dalam catatan kaki.
- source_word: αὐτοῦ
  choice: -nya dalam memerlukannya
  rationale: Pronomina ini paling wajar merujuk kepada anak keledai yang sedang dilepaskan; akhiran “-nya” menyatakan objek tersebut secara alami.
- source_word: χρείαν ἔχει
  choice: memerlukannya
  rationale: Ungkapan Yunani secara harfiah berarti “mempunyai kebutuhan akan”; “memerlukan” merupakan padanan Indonesia yang jelas, alami, dan tetap bermartabat.
theological_decisions:
- issue: Makna dan rujukan Ὁ κύριος
  choice: “Tuhan,” dengan rujukan kepada Yesus dan dengan mempertahankan bobot gelarnya
  alternative: “Tuan” atau “tuannya,” dalam arti pemilik atau atasan
  rationale: Dalam narasi Lukas, κύριος sering menjadi gelar bagi Yesus. Namun, dalam situasi ini kata tersebut juga dapat dipahami secara praktis sebagai “tuan”; karena itu kemungkinan tersebut tidak dihapus, melainkan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk menjernihkan bentuk orang kedua jamak dalam bahasa Yunani. Diksi dibuat alami dan mudah dipahami, tetapi tetap bermartabat.
