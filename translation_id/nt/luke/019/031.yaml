  naturalness: Bahasa Indonesia baku modern, jelas, dan lancar. “Mengapa kalian melepaskan ikatannya?” secara idiomatis menjelaskan tindakan λύετε dalam konteks hewan yang tertambat. “Jawablah begini” wajar sebagai instruksi, tanpa perlu mempertahankan bentuk masa depan Yunani secara harfiah.
