  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: id
  text: Lalu ia berlari ke depan dan memanjat pohon ara-sikamore[a] supaya dapat melihat Yesus, karena Yesus hendak lewat di situ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pohon ara-murbei”; Ficus sycomorus, yang juga dikenal sebagai sycamore-fig.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: berlari mendahului orang banyak
  rationale: Gabungan partisip dan frasa arah menyatakan bahwa Zakheus berlari ke depan. Objek 'orang banyak' tersirat dari konteks dan membuat ungkapan Indonesia alami tanpa mengubah tindakan pokok.
- source_word: ἀνέβη ἐπὶ
  choice: memanjat
  rationale: Dalam konteks naik ke pohon, 'memanjat' menyampaikan tindakan ἀναβαίνω dengan ringkas dan alami.
- source_word: συκομορέαν
  choice: pohon ara-murbei
  rationale: Istilah ini menunjuk Ficus sycomorus, pohon penghasil buah ara yang daunnya menyerupai murbei. 'Pohon ara-murbei' lebih tepat secara botani daripada 'pohon ara' saja, dengan nama alternatif dicatat dalam catatan kaki.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: supaya dapat melihat Yesus
  rationale: ἵνα dengan subjungtif menyatakan tujuan. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐκείνης
  choice: jalan itu
  rationale: Bentuk feminin genitif ini kemungkinan menunjuk secara eliptis pada jalan atau rute. 'Jalan itu' alami dan mempertahankan ketidakspesifikan lokasi.
- source_word: ἤμελλεν διέρχεσθαι
  choice: akan melewati
  rationale: μέλλω dengan infinitif menyatakan tindakan yang segera atau diperkirakan terjadi; 'akan melewati' cocok dengan alur narasi Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan tindakan dipertahankan secara naratif; nama Yesus memperjelas pronomina yang dapat terasa ambigu dalam bahasa Indonesia. Penanda catatan kaki ditempatkan langsung setelah istilah yang diterangkan.
