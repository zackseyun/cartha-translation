  source_fidelity: Frasa "mendahului orang banyak" menambahkan objek yang tidak terdapat dalam teks Yunani. προδραμὼν εἰς τὸ ἔμπροσθεν menyatakan bahwa Zakheus berlari ke depan/lebih dahulu, tanpa menyebut bahwa ia mendahului kerumunan. "Hendak lewat di situ" dengan baik menyampaikan μέλλω beserta rujukan eliptis ἐκείνης, tanpa menetapkan secara berlebihan bahwa yang dimaksud ialah sebuah jalan.
  naturalness: '"Berlari ke depan" dan "memanjat pohon" merupakan ungkapan modern yang alami. "Hendak lewat di situ" juga lebih idiomatis dan menangkap nuansa tindakan yang segera daripada "akan melewati jalan itu."'
  terminology: συκομορέα adalah Ficus sycomorus, yaitu pohon ara-sikamore/sycamore-fig, bukan sikamor dalam arti pohon Platanus. Istilah utama "pohon ara-sikamore" disertai alternatif botanis dalam catatan kaki.
