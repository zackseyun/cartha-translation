  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: id
  text: Ketika mereka sedang melepaskan tambatan anak keledai itu, para pemiliknya berkata kepada mereka, “Mengapa kalian melepaskan tambatan anak keledai itu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυόντων / λύετε
  choice: sedang melepaskan ikatan / melepaskan ikatan
  rationale: Kedua bentuk berasal dari λύω dan dalam konteks hewan yang tertambat berarti melepaskan ikatannya. Pengulangan ungkapan mempertahankan kaitan leksikal dalam teks Yunani; aspek progresif pada bagian pertama menyatakan tindakan yang sedang berlangsung.
- source_word: δὲ
  choice: Ketika
  rationale: δέ adalah penghubung naratif ringan. Dalam bahasa Indonesia, hubungan waktunya dapat disampaikan secara alami melalui konstruksi 'Ketika ...', tanpa menambahkan pertentangan yang tidak ada.
- source_word: αὐτῶν
  choice: mereka
  rationale: Kata ganti ini mengacu kepada dua murid dalam konteks sebelumnya. 'Mereka' mempertahankan rujukan pronominal tanpa memperjelasnya secara berlebihan.
- source_word: πῶλον
  choice: anak keledai
  rationale: πῶλος berarti hewan muda; konteks ayat sebelumnya menunjukkan bahwa hewan itu adalah keledai. 'Anak keledai' jelas dan alami bagi pembaca Indonesia.
- source_word: εἶπαν
  choice: berkata
  rationale: Padanan langsung bagi verba λέγω; bentuk pertanyaan sudah terlihat dari isi ucapan.
- source_word: οἱ κύριοι αὐτοῦ
  choice: para pemiliknya
  rationale: Bentuk jamak κύριοι di sini menunjuk kepada para pemilik manusia dari hewan tersebut, bukan gelar ilahi. 'Para pemiliknya' menyampaikan makna kontekstual dengan wajar.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Menyampaikan arah ujaran dari para pemilik kepada orang-orang yang sedang melepaskan ikatan hewan itu.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam pertanyaan ini τί menanyakan alasan atau tujuan tindakan, sehingga 'Mengapa' merupakan padanan idiomatis yang tepat.
theological_decisions:
- issue: Makna κύριοι dalam konteks kepemilikan manusia
  choice: para pemiliknya
  alternative: tuan-tuannya
  rationale: Walaupun κύριος dapat berarti 'Tuhan' atau 'tuan', konteks ini berbicara tentang orang-orang yang memiliki anak keledai. Pilihan 'para pemiliknya' menghindari resonansi teologis yang keliru sambil mempertahankan bentuk jamak Yunani.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti 'kalian' dipakai karena pihak yang disapa berjumlah lebih dari satu. Tidak diperlukan catatan kaki karena alternatif 'tuan-tuannya' tidak menambah ambiguitas penting dalam konteks ini.
