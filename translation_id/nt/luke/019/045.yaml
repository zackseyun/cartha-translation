  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: id
  text: Setelah masuk ke Bait Allah[a], Yesus mulai mengusir orang-orang yang sedang berjualan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kompleks Bait Allah” atau “pelataran Bait Allah.” Kata Yunani yang dipakai menunjuk pada seluruh kawasan Bait Allah, bukan secara khusus ruang suci bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: setelah masuk
  rationale: Partisip aoris ini mendahului verba utama dan secara wajar menyatakan tindakan yang terjadi terlebih dahulu; bentuk ini alami dalam bahasa Indonesia.
- source_word: ἱερὸν
  choice: pelataran Bait Allah
  rationale: Ἱερόν menunjuk pada kompleks atau kawasan Bait Allah, bukan secara khusus ruang sucinya. 'Pelataran Bait Allah' memperjelas lokasi tindakan tanpa menyempitkannya menjadi ruang suci bagian dalam.
- source_word: ἤρξατο
  choice: mulai
  rationale: Bentuk ini bersama infinitif menyatakan dimulainya suatu tindakan.
- source_word: ἐκβάλλειν
  choice: mengusir
  rationale: Kata ini menyatakan tindakan mengeluarkan secara tegas dan kuat; 'mengusir' alami serta tepat dalam konteks ini.
- source_word: πωλοῦντας
  choice: orang-orang yang sedang berjualan
  rationale: Partisip kini menunjuk kepada orang-orang yang tengah melakukan kegiatan menjual, tanpa menyebut barang yang dijual karena ayat ini tidak menyatakannya.
theological_decisions:
- issue: Cakupan ἱερόν dalam tindakan Yesus di Bait Allah
  choice: pelataran Bait Allah
  alternative: Bait Allah; kompleks Bait Allah; ruang suci
  rationale: Istilah Yunani ini biasanya mencakup kawasan Bait Allah, berbeda dari ναός yang dapat menunjuk lebih khusus kepada ruang suci. Terjemahan ini menjaga latar tempat secara tepat tanpa menempatkan peristiwa tersebut di ruang suci bagian dalam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nama 'Yesus' dinyatakan untuk memperjelas subjek yang tersirat dalam verba Yunani dan telah jelas dari konteks narasi. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke perkataan pada ayat berikutnya.
