  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: id
  text: Lalu orang yang pertama datang dan berkata, “Tuan[a], mina milik Tuan telah menghasilkan tambahan sepuluh mina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan.” Kata Yunani κύριε dapat menjadi sapaan hormat kepada seorang atasan maupun berarti “Tuhan.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: datang
  rationale: Kata kerja ini dalam alur narasi berarti datang atau tiba; “datang” wajar untuk orang yang menghadap atasannya.
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai kelanjutan dan urutan narasi, yang secara alami dinyatakan dengan “lalu” dalam bahasa Indonesia.
- source_word: ὁ πρῶτος
  choice: orang yang pertama
  rationale: Frasa ini menunjuk kepada orang pertama dalam urutan para hamba yang menghadap.
- source_word: λέγων
  choice: dan berkata
  rationale: Partisipel yang menyertai kata kerja utama dialihkan menjadi verba koordinatif agar narasinya alami dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuan
  rationale: Dalam konteks perumpamaan, sapaan ini ditujukan dengan hormat kepada seorang atasan atau majikan. “Tuan” paling alami dalam bahasa Indonesia, sedangkan kemungkinan “Tuhan” dicatat dalam catatan kaki untuk mempertahankan cakupan istilah Yunani.
- source_word: ἡ μνᾶ σου
  choice: mina milik Tuan
  rationale: “Mina” mempertahankan satuan uang kuno, sedangkan “milik Tuan” menegaskan bahwa modal itu kepunyaan sang tuan.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: telah menghasilkan tambahan sepuluh mina
  rationale: προσεργάζομαι menyatakan hasil atau keuntungan yang diperoleh sebagai tambahan. Ungkapan ini mempertahankan bahwa mina semula menghasilkan sepuluh mina tambahan.
theological_decisions:
- issue: Makna κύριος sebagai sapaan dalam perumpamaan
  choice: Tuan
  alternative: Tuhan
  rationale: Pembicara sedang menyapa seorang penguasa atau majikan dalam dunia cerita, sehingga “Tuan” sesuai konteks tanpa meniadakan bahwa κύριος juga dapat diterjemahkan “Tuhan” dalam konteks lain. Alternatif itu dicatat agar keluasan makna istilah sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “mina milik Tuan” menghindari bentuk posesif yang kaku, sedangkan pengulangan “mina” mempertahankan satuan historis teks.
