  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: id
  text: Sebab akan datang hari-hari ketika musuh-musuhmu akan mendirikan tanggul pengepungan terhadapmu[a], mengepungmu, dan menghimpitmu dari segala arah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membangun kubu pengepungan terhadapmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menghubungkan nubuat ini secara kausal dengan ratapan dan pernyataan sebelumnya, sesuai fungsi ὅτι dalam konteks.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: akan datang hari-hari atasmu
  rationale: Mempertahankan idiom nubuat dan gambaran bahwa masa malapetaka akan menimpa Yerusalem, tanpa mengubahnya menjadi sekadar keterangan waktu netral.
- source_word: οἱ ἐχθροί σου
  choice: musuh-musuhmu
  rationale: Padanan langsung dan wajar bagi frasa posesif Yunani.
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: akan membangun kubu pengepungan untuk menyerangmu
  rationale: Dalam konteks militer, gabungan verba dan nomina ini menunjuk pada pembangunan sarana pengepungan yang ditujukan melawan kota. Ungkapan ini jelas bagi pembaca modern dan tetap mempertahankan citra konkretnya.
- source_word: περικυκλώσουσίν σε
  choice: mengepungmu
  rationale: Konteksnya adalah serangan militer, sehingga 'mengepung' lebih tepat daripada 'mengelilingi' yang dapat bernilai netral.
- source_word: συνέξουσίν σε πάντοθεν
  choice: menghimpitmu dari segala arah
  rationale: Menyampaikan tekanan dan pembatasan akibat kepungan serta penekanan πάντοθεν pada pengepungan menyeluruh.
theological_decisions:
- issue: Rujukan kata ganti orang kedua tunggal dalam ratapan Yesus atas Yerusalem
  choice: Bentuk tunggal '-mu' dipertahankan sebagai sapaan kepada Yerusalem yang dipersonifikasikan.
  alternative: Menjelaskannya sebagai sapaan kolektif kepada seluruh penduduk Yerusalem.
  rationale: Kata ganti Yunani berbentuk tunggal dan konteks langsung mempersonifikasikan Yerusalem. Mempertahankan bentuk tunggal menjaga daya nubuat dan puisinya tanpa mempersempit atau memperluas rujukan secara tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Istilah 'kubu pengepungan' menjaga latar militer tanpa memakai ungkapan yang terlalu teknis; konstruksi 'hari-hari atasmu' sengaja agak tinggi untuk mempertahankan corak nubuat sumber.
