  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: id
  text: Lihatlah, ada seorang laki-laki bernama Zakheus; ia adalah kepala pemungut pajak dan kaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang mengarahkan perhatian pembaca dan memberi daya hidup pada narasi.
- source_word: ἀνὴρ
  choice: seorang laki-laki
  rationale: Nomina ini secara khusus merujuk kepada seorang individu laki-laki.
- source_word: ὀνόματι καλούμενος
  choice: bernama
  rationale: Ungkapan Yunani ini secara alami berarti 'bernama' atau 'disebut'; 'bernama' paling wajar dalam bahasa Indonesia modern.
- source_word: Ζακχαῖος
  choice: Zakheus
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: αὐτὸς ἦν
  choice: Ia adalah
  rationale: Menyampaikan predikasi dan penegasan ringan pada subjek tanpa menambahkan tekanan refleksif yang berlebihan.
- source_word: ἀρχιτελώνης
  choice: kepala pemungut pajak
  rationale: Kata majemuk ini menunjuk kepada pemungut pajak yang berkedudukan sebagai kepala atau pejabat senior.
- source_word: αὐτὸς πλούσιος
  choice: seorang kaya
  rationale: Menyatakan bahwa Zakheus kaya sambil mempertahankan predikat kedua secara alami dan menghindari pengulangan 'ia adalah' yang kaku.
