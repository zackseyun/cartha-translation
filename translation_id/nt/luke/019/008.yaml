id: LUK.19.8
reference: Luke 19:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: id
  text: Namun, Zakheus berdiri dan berkata kepada Tuhan, “Lihat, Tuhan, setengah dari hartaku kuberikan kepada orang-orang miskin, dan jika aku pernah memeras siapa pun untuk mendapatkan sesuatu,[a] aku mengembalikannya empat kali lipat.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menipu siapa pun untuk mendapatkan sesuatu.” Kata kerja Yunani ini dapat berarti memeras, mengeksploitasi, atau menipu, kadang-kadang melalui tuduhan palsu.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja berbentuk waktu kini dalam bahasa Yunani juga dapat dipahami sebagai “akan kuberikan” dan “akan kukembalikan,” yang menyatakan tekad untuk segera bertindak.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: berdiri
  rationale: Partisip aoris pasif dari ἵστημι dipakai secara intransitif; 'berdiri' mempertahankan tindakan naratif tanpa menentukan apakah ia baru bangkit atau sekadar mengambil sikap.
- source_word: κύριον / κύριε
  choice: Tuhan
  rationale: Mempertahankan gelar κύριος dalam konteks sapaan kepada Yesus, sekaligus membiarkan nuansa penghormatan dan pengakuan tetap terbuka.
- source_word: Ἰδοὺ
  choice: Lihat
  rationale: Kata seru ini menarik perhatian secara tegas; 'Lihat' alami dalam bahasa Indonesia modern dan tidak searkais 'Sesungguhnya' atau 'Lihatlah'.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: setengah dari hartaku
  rationale: ὑπάρχοντα mengacu pada milik atau harta benda; bentuk ini ringkas, alami, dan mempertahankan makna partitif.
- source_word: τοῖς πτωχοῖς
  choice: kepada orang-orang miskin
  rationale: Menerjemahkan pemakaian substantival πτωχός secara jelas dan wajar bagi pembaca Indonesia.
- source_word: δίδωμι
  choice: kuberikan
  rationale: Indikatif kini diterjemahkan sebagai bentuk kini yang tidak diberi penanda waktu eksplisit, sehingga dapat menyatakan kebiasaan sekarang ataupun tekad langsung sesuai konteks.
- source_word: εἴ τινός τι
  choice: jika aku pernah ... siapa pun untuk mendapatkan sesuatu
  rationale: Mencerminkan konstruksi tak tentu 'jika dari siapa pun sesuatu' dalam susunan Indonesia yang alami.
- source_word: ἐσυκοφάντησα
  choice: memeras
  rationale: Kata ini dapat menunjuk pada pemerasan, eksploitasi, atau penipuan, kadang melalui tuduhan palsu; 'memeras' cocok dengan konteks pemungut cukai, sementara alternatifnya dipertahankan dalam catatan kaki.
- source_word: ἀποδίδωμι
  choice: aku mengembalikannya
  rationale: Mengungkapkan tindakan memberi kembali atau mengganti kerugian dengan objek yang jelas dalam bahasa Indonesia.
- source_word: τετραπλοῦν
  choice: empat kali lipat
  rationale: Padanan Indonesia yang tepat dan lazim untuk pengembalian sebesar empat kali jumlah semula.
theological_decisions:
- issue: Daya waktu kini pada δίδωμι dan ἀποδίδωμι
  choice: 'Diterjemahkan tanpa penanda futur eksplisit: ''kuberikan ... aku mengembalikannya'''
  alternative: '''akan kuberikan ... akan kukembalikan'' sebagai ungkapan tekad langsung'
  rationale: Bentuk Yunani adalah indikatif kini dan dapat dipahami sebagai praktik yang sedang berlaku atau sebagai keputusan yang segera dilaksanakan. Terjemahan utama mempertahankan ketegangan ini dan catatan kaki menyebutkan pembacaan futur tanpa menentukan apakah Zakheus sedang membela kebiasaan lamanya atau menyatakan pertobatan baru.
- issue: Makna κύριος dalam sapaan kepada Yesus
  choice: Tuhan
  alternative: Tuan
  rationale: Sebutan 'Tuhan' mempertahankan bobot gelar yang dimiliki κύριος dalam narasi Lukas tanpa menyangkal bahwa bentuk vokatifnya juga dapat berfungsi sebagai sapaan hormat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Bentuk 'hartaku' dan 'kuberikan' menjaga kelancaran tuturan langsung. Kedua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
