  terminology: “Keselamatan” tepat untuk σωτηρία dalam konteks Lukas. “Anak Abraham” mempertahankan ungkapan identitas/perjanjian sumber dan tidak mereduksinya menjadi sekadar keturunan biologis atau keanggotaan rohani. Nama “Yesus” dan “Abraham” sudah sesuai pemakaian Indonesia.
