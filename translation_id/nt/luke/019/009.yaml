  source_fidelity: 'Teks secara akurat menerjemahkan unsur-unsur Yunani: Yesus berbicara kepadanya; penekanan awal pada “Hari ini” dipertahankan; σωτηρία diterjemahkan “keselamatan”; τῷ οἴκῳ τούτῳ diterjemahkan secara langsung “kepada rumah ini”; dan καὶ αὐτὸς ditangkap oleh “ia pun.” Ungkapan “anak Abraham” mempertahankan bentuk serta keterbukaan makna υἱὸς Ἀβραάμ tanpa memaksakan penafsiran tertentu.'
