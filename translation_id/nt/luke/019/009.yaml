id: LUK.19.9
reference: Luke 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Hari ini keselamatan telah datang kepada rumah ini,[a] karena ia pun adalah anak Abraham.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada seisi rumah ini.” Kata Yunani yang dipakai dapat merujuk pada rumah itu sendiri atau pada orang-orang yang termasuk di dalam rumah tangga tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν
  choice: Lalu Yesus berkata kepadanya
  rationale: δέ adalah penghubung ringan dalam alur narasi; “lalu” terdengar alami tanpa memberi kesan pertentangan yang kuat. Pronomina αὐτόν tetap diterjemahkan sebagai “kepadanya” tanpa menambahkan nama Zakheus.
- source_word: Σήμερον
  choice: Hari ini
  rationale: Padanan modern dan alami yang mempertahankan penekanan temporal karena ditempatkan pada awal pernyataan.
- source_word: σωτηρία
  choice: keselamatan
  rationale: Dalam Injil Lukas, istilah ini memiliki bobot teologis yang melampaui sekadar pembebasan dari bahaya; “keselamatan” mempertahankan cakupan tersebut.
- source_word: τῷ οἴκῳ τούτῳ
  choice: kepada rumah ini
  rationale: Bentuk datif bersama ἐγένετο menyatakan bahwa keselamatan datang kepada rumah ini. “Rumah” mempertahankan padanan langsung οἶκος, sedangkan kemungkinan makna “seisi rumah” dicatat dalam catatan kaki.
- source_word: ἐγένετο
  choice: telah datang
  rationale: Walaupun γίνομαι secara harfiah dapat berarti “terjadi” atau “menjadi”, dalam ungkapan ini “telah datang” menyampaikan hadirnya keselamatan secara alami dan setia.
- source_word: καθότι
  choice: karena
  rationale: Kata penghubung ini memberikan alasan bagi pernyataan Yesus; “karena” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: καὶ αὐτὸς
  choice: ia pun
  rationale: '“Pun” menangkap penekanan inklusif dari καί bersama αὐτός: orang ini juga termasuk.'
- source_word: υἱὸς Ἀβραάμ
  choice: anak Abraham
  rationale: Ungkapan idiomatis ini dipertahankan agar resonansi identitas dan perjanjiannya tidak dipersempit menjadi sekadar “keturunan” atau ditafsirkan secara berlebihan.
theological_decisions:
- issue: Makna “anak Abraham”
  choice: Ungkapan identitas/perjanjian dipertahankan tanpa menentukan apakah yang dimaksud adalah keturunan jasmani, keanggotaan dalam umat beriman Abraham, atau keduanya.
  alternative: Menerjemahkannya secara eksplisit sebagai “keturunan Abraham” atau “anggota sejati keluarga iman Abraham”.
  rationale: Ayat ini sendiri tidak mengharuskan satu tafsiran sempit. Mempertahankan idiom tersebut menjaga ketegangan teologis dan memungkinkan konteks Lukas memberi arah penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Susunan kalimat mempertahankan penekanan “Hari ini” serta ungkapan “anak Abraham” tanpa mempersempit maknanya.
