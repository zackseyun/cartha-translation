  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: id
  text: Lalu beberapa orang Farisi dari antara orang banyak itu berkata kepada-Nya, “Guru, tegurlah murid-murid-Mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: beberapa orang Farisi
  rationale: τινες dengan genitif partitif menunjuk pada sejumlah orang yang tidak ditentukan dari kelompok Farisi. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa hanya sebagian orang Farisi yang berbicara.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: yang berada di antara orang banyak itu
  rationale: ἀπό menyatakan asal atau posisi para pembicara sehubungan dengan kerumunan. Dalam konteks ini, frasa tersebut secara alami menunjukkan bahwa mereka berada di tengah kelompok orang banyak, bukan bahwa mereka baru saja meninggalkannya.
- source_word: εἶπαν πρὸς αὐτόν
  choice: berkata kepada-Nya
  rationale: Ini merupakan padanan naratif yang langsung dan lazim bagi formula ujaran λέγω dengan πρός dan akusatif.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Vokatif διδάσκαλος menyapa Yesus dalam peran pengajar. “Guru” adalah padanan Indonesia yang jelas, wajar, dan tidak menambahkan klaim kristologis yang lebih kuat daripada teks.
- source_word: ἐπιτίμησον
  choice: tegurlah
  rationale: Imperatif aoris ini memerintahkan kecaman atau teguran langsung. “Tegurlah” mempertahankan daya perintah tanpa secara interpretatif mempersempitnya menjadi “suruh diam”.
- source_word: τοῖς μαθηταῖς σου
  choice: murid-murid-Mu
  rationale: μαθητής menunjuk pada orang yang belajar dan mengikuti seorang guru. “Murid” mempertahankan hubungan guru-murid yang penting dalam Injil; bentuk jamak dinyatakan dengan pengulangan.
theological_decisions:
- issue: Sapaan Διδάσκαλε kepada Yesus
  choice: Guru
  alternative: Tuan
  rationale: Kata Yunani ini terutama menyatakan peran mengajar. “Guru” menjaga nada sapaan para orang Farisi tanpa memasukkan pengakuan tentang kewenangan atau identitas Yesus yang tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena ambiguitas ἀπὸ τοῦ ὄχλου dapat disampaikan secara alami dalam teks utama tanpa menawarkan varian yang substantif.
