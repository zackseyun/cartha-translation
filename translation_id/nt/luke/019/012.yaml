  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: id
  text: Maka ia berkata, “Seorang bangsawan pergi ke negeri yang jauh untuk menerima kekuasaan sebagai raja[a] bagi dirinya sendiri dan kembali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerajaan” atau “kedudukan sebagai raja”. Kata Yunani βασιλεία dapat merujuk pada kerajaan itu sendiri ataupun pada pemerintahan atau kekuasaan rajawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Maka
  rationale: Menandai kelanjutan sekaligus hubungan logis dengan konteks sebelumnya dalam gaya naratif yang wajar.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: Seorang bangsawan
  rationale: Ungkapan ini memperkenalkan tokoh yang tidak ditentukan dan menyebut status kelahirannya yang tinggi; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: ἐπορεύθη
  choice: pergi
  rationale: Menyampaikan gerak menuju tempat lain secara langsung dan alami.
- source_word: εἰς χώραν μακρὰν
  choice: ke negeri yang jauh
  rationale: Mempertahankan gagasan wilayah atau negeri yang letaknya jauh tanpa membuat cakupannya terlalu spesifik.
- source_word: λαβεῖν
  choice: untuk menerima
  rationale: Dalam konteks politik ini, tokoh tersebut menerima pengakuan atau kewenangan kerajaan, bukan merebutnya.
- source_word: ἑαυτῷ
  choice: bagi dirinya sendiri
  rationale: Mempertahankan datif refleksif yang menunjukkan bahwa kedudukan atau kekuasaan itu diterima untuk dirinya.
- source_word: βασιλείαν
  choice: kekuasaan sebagai raja
  rationale: Dalam konteks perjalanan seorang bangsawan untuk kemudian kembali, istilah ini kemungkinan menunjuk pada kedudukan atau kewenangan memerintah sebagai raja. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa ia menerima sebuah wilayah secara harfiah.
- source_word: ὑποστρέψαι
  choice: lalu kembali
  rationale: Infinitif ini dikoordinasikan dengan tujuan menerima kekuasaan dan menunjuk pada kepulangannya sesudah itu; 'lalu' membuat urutan yang tersirat dapat dipahami secara alami.
theological_decisions:
- issue: Makna βασιλείαν dalam perumpamaan berlatar politik
  choice: kekuasaan sebagai raja
  alternative: kerajaan; kedudukan sebagai raja
  rationale: Kata Yunani ini dapat menunjuk pada kerajaan sebagai wilayah maupun pemerintahan, kedudukan, atau kekuasaan rajawi. Konteksnya menggambarkan seorang bangsawan yang pergi untuk memperoleh pengesahan sebagai raja lalu kembali. Teks utama memakai ungkapan yang jelas bagi pembaca modern, sedangkan catatan kaki mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Bang­sawan' dipakai sebagai padanan status sosial εὐγενής, sedangkan frasa 'kekuasaan sebagai raja' menghindari ambiguitas tidak alami dalam ungkapan harfiah 'menerima kerajaan'.
