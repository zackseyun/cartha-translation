  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: id
  text: Mereka berkata, “Diberkatilah Raja[a] yang datang dalam nama Tuhan! Damai di surga[b] dan kemuliaan di tempat yang mahatinggi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan mengikuti rumusan yang lebih lazim, “Diberkatilah dia yang datang dalam nama Tuhan,” tetapi Lukas secara eksplisit menyebut “Raja”.
    reason: alternative_reading
  - marker: b
    text: 'Seruan ini menggemakan Lukas 2:14, tetapi lokasinya berbeda: di sana “damai di bumi”, sedangkan di sini “damai di surga”.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: Mereka berkata
  rationale: Partisipel kini ini memperkenalkan seruan orang banyak dan terkait dengan subjek pada ayat sebelumnya. Bentuk kalimat lengkap ini alami dalam bahasa Indonesia tanpa menambahkan gagasan ‘berseru’ yang tidak dinyatakan oleh katanya sendiri.
- source_word: Εὐλογημένος
  choice: Diberkatilah
  rationale: Mempertahankan bentuk ucapan berkat dan gema bahasa mazmur, alih-alih menggesernya menjadi sekadar pujian.
- source_word: ὁ ἐρχόμενος
  choice: yang datang
  rationale: Menyampaikan partisipel berartikel secara alami sebagai klausa yang menerangkan ‘Raja’ serta mempertahankan aspek kedatangan yang sedang dipandang dalam seruan itu.
- source_word: βασιλεὺς
  choice: Raja
  rationale: Kata ‘Raja’ terdapat secara eksplisit dalam teks utama SBLGNT dan mempertahankan penekanan kerajaan dalam seruan tersebut.
- source_word: ἐν ὀνόματι κυρίου
  choice: dalam nama Tuhan
  rationale: Ungkapan ini mempertahankan idiom Semitis dan cakupan maknanya, termasuk datang dengan otoritas serta mewakili Tuhan, tanpa menguraikannya secara berlebihan.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Damai di surga
  rationale: Mempertahankan klausa seruan tanpa verba dan, terutama, lokasi ‘di surga’ yang berbeda dari Lukas 2:14.
- source_word: δόξα ἐν ὑψίστοις
  choice: kemuliaan di tempat yang mahatinggi
  rationale: Ungkapan Indonesia yang wajar untuk bentuk jamak ὑψίστοις sebagai sebutan bagi kawasan surgawi tertinggi, sekaligus menjaga kesejajaran puitis dengan klausa sebelumnya.
theological_decisions:
- issue: Seruan kerajaan yang berkaitan dengan Mesias
  choice: Kata βασιλεὺς diterjemahkan secara eksplisit sebagai ‘Raja’.
  alternative: “Diberkatilah dia yang datang dalam nama Tuhan.”
  rationale: Teks utama SBLGNT memuat βασιλεὺς. Mempertahankannya menjaga penekanan kerajaan dalam Lukas tanpa menambahkan penafsiran teologis di luar teks; adanya varian dicatat dalam catatan kaki.
- issue: Hubungan dengan Lukas 2:14
  choice: ἐν οὐρανῷ diterjemahkan ‘di surga’.
  alternative: “damai di bumi”
  rationale: Teks sumber secara jelas menyebut surga. Terjemahan tidak diselaraskan dengan Lukas 2:14, sehingga perbedaan dan ketegangan intertekstualnya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan puitis yang sesuai untuk seruan liturgis. ‘Diberkatilah’ dipilih daripada ‘terpujilah’ untuk menjaga makna ucapan berkat; ‘Tuhan’ mengikuti pemakaian lazim untuk κύριος dalam konteks kutipan Kitab Suci.
