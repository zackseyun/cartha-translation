id: LUK.19.27
reference: Luke 19:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: id
  text: Namun, musuh-musuhku ini, yang tidak mau aku menjadi raja atas mereka[a], bawalah kemari dan sembelihlah mereka di hadapanku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku memerintah sebagai raja atas mereka.”'
    reason: Alternatif untuk βασιλεῦσαι ἐπ’ αὐτούς yang mempertahankan aspek verbal tindakan memerintah sebagai raja.
  - marker: b
    text: 'Atau: “bantailah mereka di depanku.”'
    reason: Alternatif yang mempertahankan kerasnya κατασφάξατε serta makna konkret ἔμπροσθέν μου.
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai peralihan tegas menuju unsur terakhir dan memuncak dalam perkataan sang bangsawan; alami dalam bahasa Indonesia tanpa menghilangkan daya adversatifnya.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: musuh-musuhku ini
  rationale: Mempertahankan kepemilikan dan penegasan demonstratif τούτους secara ringkas dan wajar.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτούς
  choice: yang tidak mau aku berkuasa sebagai raja atas mereka
  rationale: Klausa relatif alami dalam bahasa Indonesia; 'tidak mau' menyampaikan θέλω, sedangkan 'berkuasa sebagai raja atas' mempertahankan makna verbal βασιλεύω dan relasi ἐπί.
- source_word: ἀγάγετε ὧδε
  choice: bawalah kemari
  rationale: Menyampaikan perintah jamak dan arah ὧδε secara idiomatis; objeknya sudah dinyatakan sebagai 'musuh-musuhku ini'.
- source_word: κατασφάξατε
  choice: sembelihlah
  rationale: Mempertahankan daya grafis dan keras verba yang lebih kuat daripada sekadar 'membunuh', tanpa menambahkan nuansa hukum seperti 'eksekusi'.
- source_word: ἔμπροσθέν μου
  choice: di hadapanku
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk tindakan yang dilakukan di depan atau dalam kehadiran sang pembicara.
theological_decisions:
- issue: Rujukan pembicara di dalam perumpamaan
  choice: Perintah sang bangsawan diterjemahkan langsung dan kekerasannya tidak diperhalus, tanpa menambahkan bahwa ini adalah perintah langsung Yesus di luar dunia cerita.
  alternative: Menambahkan ungkapan yang secara eksplisit menjauhkan perkataan itu sebagai sekadar gambaran perumpamaan.
  rationale: Teks Yunani menyajikan perkataan langsung sang bangsawan dalam perumpamaan. Terjemahan perlu mempertahankan daya naratif dan ketegangan teologisnya tanpa memberi kesimpulan tafsir tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern, langsung, dan bermartabat. Bentuk posesif enklitik serta imperatif -lah menjaga kekompakan dan ketegasan ucapan. Kekerasan kata kerja sumber dipertahankan, bukan diperhalus.
