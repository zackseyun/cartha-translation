id: LUK.19.46
reference: Luke 19:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: id
  text: kata-Nya kepada mereka, “Ada tertulis, ‘Rumah-Ku akan menjadi rumah doa,’ tetapi kamu telah menjadikannya sarang para perampok.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sarang para perampok” menggemakan Yeremia 7:11. Kata Yunani yang diterjemahkan “perampok” juga dapat berarti “penyamun” atau “bandit.”
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: kata-Nya kepada mereka
  rationale: Menghubungkan partisipel kini dengan tindakan Yesus pada ayat sebelumnya secara alami dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: Γέγραπται
  choice: Ada tertulis
  rationale: Ungkapan baku untuk formula pasif perfek yang memperkenalkan kutipan Kitab Suci dan menegaskan kewibawaannya.
- source_word: Καὶ ἔσται
  choice: akan menjadi
  rationale: Menyampaikan nilai futurum ἔσται secara wajar. Καί pada awal kutipan tidak dinyatakan tersendiri karena dalam bahasa Indonesia modern akan terasa kaku ketika kutipan dimulai di tengah konteks nubuat.
- source_word: ὁ οἶκός μου
  choice: Rumah-Ku
  rationale: Mempertahankan arti harfiah οἶκος dan kaitan verbal dengan Yesaya 56:7, alih-alih memperjelasnya menjadi 'Bait-Ku'.
- source_word: οἶκος προσευχῆς
  choice: rumah doa
  rationale: Konstruksi yang ringkas, alami, dan tetap dekat dengan frasa genitif Yunani.
- source_word: ὑμεῖς δὲ
  choice: tetapi kamu
  rationale: Menjaga kontras adversatif serta penekanan pada subjek 'kamu'.
- source_word: ἐποιήσατε
  choice: telah menjadikannya
  rationale: Aspek hasil yang masih berlaku disampaikan secara alami dengan 'telah', sedangkan enklitik '-nya' merujuk kembali kepada rumah itu.
- source_word: σπήλαιον
  choice: sarang
  rationale: Dalam gema Yeremia 7:11, kata ini menunjuk tempat persembunyian atau markas para penjahat, bukan sekadar gua secara geografis.
- source_word: λῃστῶν
  choice: para perampok
  rationale: Mencakup arti perampok atau penyamun tanpa mempersempitnya menjadi kelompok pemberontak politik.
theological_decisions:
- issue: Penyebutan Bait Allah sebagai 'rumah' dalam kutipan
  choice: Rumah-Ku ... rumah doa
  alternative: Bait-Ku ... rumah doa
  rationale: Teks Yunani memakai οἶκος, 'rumah'. Pilihan ini mempertahankan gema Yesaya 56:7 dan gambaran milik serta kediaman Allah tanpa menambahkan penafsiran ke dalam kutipan.
- issue: Cakupan makna λῃστῶν
  choice: para perampok
  alternative: para penyamun / para bandit
  rationale: '''Perampok'' mempertahankan tuduhan kenabian dari Yeremia 7:11 tanpa menentukan apakah pelakunya merupakan bandit bersenjata atau pemberontak politik.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Rumah-Ku” mengikuti rujukannya kepada rumah Allah. Susunan kutipan dibuat mudah dipahami sambil mempertahankan citra 'rumah' dan 'sarang' dari sumber-sumber kenabian.
