  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan semua unsur utama Yunani: urutan waktu (ὡς), kedatangan ke lokasi (ἐπὶ τὸν τόπον), pandangan ke atas (ἀναβλέψας), sapaan kepada Zakheus, urgensi perintah turun (σπεύσας κατάβηθι), alasan temporal-kausal (σήμερον γάρ), serta keharusan dalam δεῖ dan tindakan tinggal (μεῖναι).'
