id: LUK.19.5
reference: Luke 19:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: id
  text: Ketika Yesus tiba di tempat itu, Ia memandang ke atas dan berkata kepadanya, “Zakheus, cepatlah turun, sebab hari ini Aku harus[a] tinggal di rumahmu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “harus” dapat menyatakan keharusan yang berkaitan dengan misi Yesus atau maksud Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat tinggalmu”; kata Yunani οἶκος dapat berarti rumah atau tempat tinggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: ketika
  rationale: Dalam rangkaian naratif, ὡς memperkenalkan anak kalimat waktu; “ketika” merupakan padanan bahasa Indonesia yang alami.
- source_word: ἐπὶ τὸν τόπον
  choice: tiba di tempat itu
  rationale: Ungkapan ini menunjuk lokasi tempat Zakheus berada. “Tiba di tempat itu” menyampaikan gerak menuju lokasi tersebut secara wajar.
- source_word: ἀναβλέψας
  choice: memandang ke atas
  rationale: Partisip ini menggambarkan Yesus mengarahkan pandangan ke atas kepada Zakheus yang berada di pohon.
- source_word: εἶπεν πρὸς αὐτόν
  choice: berkata kepadanya
  rationale: Padanan langsung dan alami untuk formula ujaran Yunani tersebut.
- source_word: Ζακχαῖε
  choice: Zakheus
  rationale: Mengikuti bentuk nama yang lazim dikenal dalam bahasa Indonesia.
- source_word: σπεύσας κατάβηθι
  choice: cepatlah turun
  rationale: Gabungan partisip dan imperatif menyatakan perintah yang mendesak; “cepatlah turun” mempertahankan urgensi itu secara ringkas dan alami.
- source_word: σήμερον γὰρ
  choice: sebab hari ini
  rationale: γάρ memberikan alasan bagi perintah sebelumnya, sedangkan σήμερον menekankan waktunya.
- source_word: δεῖ με μεῖναι
  choice: Aku harus tinggal
  rationale: “Harus” mempertahankan daya keharusan dalam δεῖ, sementara “tinggal” secara alami menyampaikan makna μεῖναι dalam konteks kunjungan ke rumah Zakheus.
- source_word: ἐν τῷ οἴκῳ σου
  choice: di rumahmu
  rationale: οἶκος di sini menunjuk rumah atau tempat tinggal Zakheus; “di rumahmu” jelas, alami, dan sesuai dengan adegan.
theological_decisions:
- issue: Daya keharusan dalam δεῖ
  choice: Aku harus tinggal
  alternative: Aku perlu tinggal; Aku mesti tinggal
  rationale: Dalam Lukas, δεῖ kerap berkaitan dengan keharusan dalam misi Yesus atau maksud Allah. “Harus” mempertahankan kekuatan maknanya tanpa menjelaskan secara berlebihan sumber keharusan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “cepatlah turun” terdengar alami sekaligus mempertahankan urgensi perintah. Kata ganti bagi Yesus ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
