id: LUK.19.40
reference: Luke 19:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: id
  text: 'Lalu Ia menjawab, “Aku berkata kepada kalian: Jika mereka ini diam[a], batu-batu akan berseru.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi diam,” “berhenti bersuara,” atau “tetap diam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Gabungan partisip ἀποκριθεὶς dan verba utama εἶπεν merupakan rumusan jawaban yang lazim. Bahasa Indonesia secara alami dapat merangkum keduanya sebagai “Ia menjawab” tanpa pengulangan kaku seperti “menjawab dan berkata”.
- source_word: Λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Mempertahankan bentuk langsung dan penegasan rumusan Yunani. “Kalian” dengan jelas menyatakan bahwa ὑμῖν berbentuk jamak.
- source_word: οὗτοι
  choice: mereka ini
  rationale: Mempertahankan demonstrativa tanpa menambahkan secara eksplisit identitas kelompok yang dimaksud dari konteks.
- source_word: σιωπήσουσιν
  choice: diam
  rationale: Dalam klausa bersyarat, “diam” merupakan ungkapan Indonesia yang wajar dan dapat mencakup berhenti bersuara ataupun tetap tidak bersuara; kemungkinan nuansanya dicatat dalam catatan kaki.
- source_word: οἱ λίθοι
  choice: batu-batu
  rationale: Menerjemahkan bentuk jamak secara konkret. Bahasa Indonesia tidak memerlukan penanda khusus untuk artikel Yunani dalam konteks ini.
- source_word: κράξουσιν
  choice: akan berseru
  rationale: “Berseru” menyampaikan tindakan mengeluarkan suara keras dan mempertahankan daya retoris gambaran tersebut.
theological_decisions:
- issue: Apakah seruan batu harus dijelaskan sebagai kiasan atau mukjizat
  choice: Mempertahankan gambaran harfiah “batu-batu akan berseru” tanpa penjelasan tambahan.
  alternative: Menafsirkannya dalam teks sebagai kesaksian simbolis atau pujian seluruh ciptaan.
  rationale: Teks Yunani tidak menjelaskan sifat gambaran itu. Terjemahan ini mempertahankan ketegangan antara hiperbola, gambaran profetis, dan kemungkinan mukjizat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak ὑμῖν dengan jelas. Huruf kapital pada “Ia” dan “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus tanpa menambah gelar atau tafsiran.
