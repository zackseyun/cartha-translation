  verdict: approve
  source_fidelity: Teks Indonesia dengan tepat menyampaikan respons Yesus (ἀποκριθεὶς εἶπεν), rumusan penegasan Λέγω ὑμῖν, kondisi mengenai “mereka ini” (οὗτοι), serta gambaran yang tidak ditafsirkan tentang batu-batu yang akan berseru. “Diam” adalah padanan yang sah untuk σιωπήσουσιν dalam klausa bersyarat ini; catatan kaki secara memadai mencatat kemungkinan nuansa permulaan atau keberlanjutan keadaan diam.
  naturalness: Kalimatnya lancar dalam bahasa Indonesia modern dan tetap memiliki register Alkitab yang lugas serta bermartabat. “Ia menjawab” adalah peringkasan Indonesia yang alami untuk partisip responsif disertai verba ujaran Yunani, tanpa kehilangan fungsi wacananya. “Batu-batu akan berseru” hidup dan idiomatis.
  terminology: “Aku berkata kepada kalian” mempertahankan orang pertama dan sasaran jamak, sedangkan “mereka ini” mempertahankan demonstrativa tanpa memasukkan identitas mereka dari konteks. “Berseru” secara tepat menyampaikan κράξουσιν sebagai seruan keras. Penggunaan kapital bagi rujukan kepada Yesus konsisten dengan kebiasaan penerbitan Alkitab Indonesia dan tidak memaksakan tafsiran doktrinal.
