id: LUK.19.22
reference: Luke 19:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: id
  text: Ia berkata kepadanya, “Dari mulutmu sendiri[a] aku akan menghakimi engkau, hai budak yang jahat[b]. Engkau tahu bahwa aku orang yang keras, yang mengambil apa yang tidak kutaruh[c] dan menuai apa yang tidak kutabur?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berdasarkan perkataanmu sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hamba yang jahat.” Kata Yunani δοῦλος menunjuk kepada orang yang berada dalam status perbudakan atau keterikatan di bawah seorang tuan.
    reason: alternative_reading
  - marker: c
    text: Atau “apa yang tidak kusimpan.” Dalam konteks ini, kata “menaruh” dapat mengandung arti menyimpan atau mendepositkan uang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: Dari mulutmu sendiri
  rationale: Mempertahankan idiom Yunani bahwa penghakiman didasarkan pada ucapan budak itu sendiri. Kata “sendiri” membuat daya refleksifnya wajar dan jelas dalam bahasa Indonesia.
- source_word: κρίνω
  choice: aku akan menghakimi
  rationale: Bentuknya adalah indikatif futurum. “Menghakimi” mempertahankan cakupan makna verba tanpa mempersempitnya menjadi “menghukum” atau “menyatakan bersalah”.
- source_word: πονηρὲ δοῦλε
  choice: hai budak yang jahat
  rationale: Sapaan “hai” menyampaikan bentuk vokatif secara alami. “Jahat” menyatakan celaan moral, sedangkan “budak” mempertahankan status terikat dan hubungan kepemilikan yang menonjol dalam latar perumpamaan ini.
- source_word: ᾔδεις
  choice: Engkau tahu
  rationale: Bentuk dari οἶδα menyatakan pengetahuan yang telah dimiliki; dalam konteks ini bahasa Indonesia alami cukup memakai “tahu”. Pernyataan langsung dipertahankan sebagai bagian dari jawaban retoris sang tuan.
- source_word: αὐστηρός
  choice: keras
  rationale: “Keras” menyampaikan watak yang tegas dan menuntut dengan nuansa negatif yang dikemukakan budak itu, tanpa memakai kata yang kuno atau terlalu teknis.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: mengambil apa yang tidak kutaruh
  rationale: “Mengambil” mempertahankan keluasan αἴρω, sedangkan “menaruh” mengikuti τίθημι tanpa memastikan bahwa yang dimaksud adalah penyimpanan uang secara teknis.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: menuai apa yang tidak kutabur
  rationale: Mempertahankan metafora pertanian dan kesejajaran gramatikal teks Yunani, yang berbunyi “apa yang”, bukan “di tempat aku tidak”.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam konteks perumpamaan tentang tuan dan orang yang terikat kepadanya
  choice: budak
  alternative: hamba
  rationale: Status sosial yang terikat dan berada di bawah kuasa tuan menonjol dalam adegan ini. “Budak” lebih langsung mempertahankan daya historis δοῦλος, sementara alternatif yang lebih lunak dicatat dalam catatan kaki.
- issue: Apakah gambaran sang tuan sebagai orang keras harus dinyatakan sebagai fakta atau sebagai pengulangan retoris atas perkataan budak
  choice: Mempertahankan bentuk langsung “Engkau tahu bahwa aku orang yang keras” tanpa tambahan penafsiran
  alternative: “Menurutmu, aku orang yang keras” atau “Jika engkau tahu bahwa aku orang yang keras”
  rationale: Teks Yunani menyajikannya secara langsung, tetapi konteks menunjukkan bahwa sang tuan sedang menghakimi budak berdasarkan perkataannya sendiri. Terjemahan tidak menambahkan penilaian teologis mengenai watak tokoh dalam perumpamaan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti “engkau” dipakai dalam sapaan langsung tunggal agar selaras dengan nada naratif kitab suci; kata ganti orang pertama tetap ditulis dengan huruf kecil karena penuturnya adalah tokoh tuan dalam perumpamaan, bukan identifikasi eksplisit dengan Allah.
