id: LUK.10.33
reference: Luke 10:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: id
  text: Namun, seorang Samaria yang sedang dalam perjalanan tiba di tempat orang itu berada. Ketika melihatnya, ia tergerak oleh belas kasihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia berbelas kasihan kepadanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: seorang Samaria
  rationale: Istilah baku dalam bahasa Indonesia untuk identitas etnoreligius ini, serta mempertahankan daya kontras sosial dalam perumpamaan.
- source_word: δέ
  choice: Namun
  rationale: Menandai kontras dengan imam dan orang Lewi pada ayat-ayat sebelumnya secara alami dan jelas.
- source_word: τις
  choice: seorang
  rationale: Menyatakan ketidakpastian identitas tanpa ungkapan kaku seperti 'seorang tertentu'.
- source_word: ὁδεύων
  choice: yang sedang dalam perjalanan
  rationale: Mempertahankan tindakan latar yang sedang berlangsung dan terdengar alami dalam bahasa Indonesia.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: tiba di tempat orang itu berada
  rationale: Mengungkapkan secara jelas gerakan menuju lokasi orang yang terluka; konteks menentukan bahwa pronomina itu merujuk kepadanya.
- source_word: ἰδών
  choice: Ketika melihatnya
  rationale: Menyampaikan hubungan temporal partisip aoris dengan tindakan utama secara wajar.
- source_word: ἐσπλαγχνίσθη
  choice: ia tergerak oleh belas kasihan
  rationale: Mempertahankan kuatnya respons batin yang penuh iba, bukan sekadar menyatakan bahwa ia melakukan tindakan belas kasih.
theological_decisions:
- issue: Mengungkapkan respons penuh belas kasihan dari orang Samaria tanpa memasukkan tafsiran moral atau doktrinal tambahan
  choice: ia tergerak oleh belas kasihan
  alternative: ia berbelas kasihan kepadanya
  rationale: Pilihan ini mempertahankan daya afektif verba Yunani tanpa menambahkan konsep tentang rahmat, anugerah, atau kasih kepada sesama yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pemenggalan menjadi dua kalimat memperjelas alur tanpa mengubah hubungan antarklausa dalam teks Yunani.
source_grounding:
  english_pob_role: consult_only
