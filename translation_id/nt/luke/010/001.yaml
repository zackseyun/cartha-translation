id: LUK.10.1
reference: Luke 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: id
  text: Sesudah semua itu, Tuhan menunjuk tujuh puluh dua orang lain juga[a], lalu mengutus mereka berdua-dua mendahului-Nya ke setiap kota dan tempat yang hendak didatangi-Nya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “tujuh puluh”, bukan “tujuh puluh dua”.
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Sesudah itu
  rationale: Mengungkapkan peralihan waktu secara alami dalam bahasa Indonesia tanpa kehilangan hubungan dengan peristiwa-peristiwa sebelumnya.
- source_word: ἀνέδειξεν
  choice: menunjuk
  rationale: Menyatakan penetapan orang-orang untuk suatu tugas, bukan sekadar memperlihatkan atau memperkenalkan mereka.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Padanan baku dan wajar untuk κύριος sebagai gelar yang merujuk kepada Yesus dalam konteks ini.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: tujuh puluh dua orang lainnya juga
  rationale: Mempertahankan arti tambahan pada ἑτέρους dan καί, serta mengikuti bacaan SBLGNT 'tujuh puluh dua'.
- source_word: ἀπέστειλεν
  choice: mengutus
  rationale: Padanan alami bagi tindakan mengirim orang dengan tugas tertentu tanpa menambahkan makna jabatan khusus.
- source_word: ἀνὰ δύο δύο
  choice: berdua-dua
  rationale: Mencerminkan bentuk distributif Yunani dan secara idiomatis berarti dalam kelompok yang masing-masing terdiri atas dua orang.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: mendahului-Nya
  rationale: Menyampaikan bahwa mereka dikirim lebih dahulu untuk mempersiapkan tempat-tempat sebelum kedatangan Yesus.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: ke setiap kota dan tempat
  rationale: Mempertahankan kedua nomina Yunani tanpa membatasi πόλις hanya pada pusat perkotaan besar.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: yang hendak dikunjungi-Nya sendiri
  rationale: Secara alami menyampaikan tindakan yang segera atau direncanakan, sekaligus mempertahankan penekanan αὐτός melalui 'sendiri'.
theological_decisions:
- issue: Varian tekstual mengenai jumlah orang yang ditunjuk
  choice: tujuh puluh dua
  alternative: tujuh puluh
  rationale: Teks SBLGNT yang diberikan memuat ἑβδομήκοντα δύο ('tujuh puluh dua'). Bacaan 'tujuh puluh' merupakan varian penting dan karena itu dicatat dalam catatan kaki, bukan diabaikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum; kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab berbahasa Indonesia.
