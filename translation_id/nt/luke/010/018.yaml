base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Aku melihat Satan jatuh seperti kilat dari surga.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sedang menyaksikan Satan jatuh seperti kilat dari surga.” Kata kerja Yunani berbentuk imperfek dapat diterjemahkan secara sederhana sebagai “Aku melihat”, tetapi juga memiliki nuansa tindakan yang sedang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Lalu ia berkata kepada mereka
  rationale: Aoristus εἶπεν diterjemahkan sebagai verba naratif lampau yang wajar; δέ adalah penghubung ringan yang dalam konteks ini mengalir alami sebagai “Lalu”; αὐτοῖς dipertahankan sebagai objek tak langsung “kepada mereka”.
- source_word: Ἐθεώρουν
  choice: Aku sedang melihat
  rationale: Bentuk imperfek θεωρέω memiliki aspek belum selesai atau berlangsung. “Sedang melihat” mempertahankan aspek tersebut tanpa menentukan apakah penglihatan itu berlangsung pada masa pelayanan para murid, merujuk pada masa lampau purba, atau bersifat profetis.
- source_word: τὸν Σατανᾶν
  choice: Iblis
  rationale: Σατανᾶς adalah sebutan personal bagi sang lawan. “Iblis” merupakan padanan baku dan mudah dipahami dalam bahasa Indonesia Alkitabiah modern.
- source_word: ὡς ἀστραπὴν
  choice: seperti kilat
  rationale: ὡς memperkenalkan perbandingan, dan “seperti kilat” mempertahankan simile secara alami.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: οὐρανός dapat berarti langit atau surga. Dalam konteks kejatuhan Iblis, “surga” mempertahankan dimensi kosmologis dan teologis tanpa menjelaskan lebih jauh.
- source_word: πεσόντα
  choice: jatuh
  rationale: Partisip aoristus ini menerangkan Iblis sebagai objek θεωρέω. Konstruksi Indonesia “melihat Iblis jatuh” menyampaikan peristiwa tersebut secara ringkas dan alami.
theological_decisions:
- issue: Waktu dan aspek pernyataan Yesus tentang jatuhnya Iblis
  choice: Aku sedang melihat Iblis jatuh seperti kilat dari surga
  alternative: Aku melihat Iblis jatuh seperti kilat dari surga
  rationale: Terjemahan mempertahankan aspek imperfektif Ἐθεώρουν, tetapi tidak menetapkan apakah ayat ini berbicara tentang kejatuhan purba, dampak pelayanan para murid saat itu, atau penglihatan profetis tentang kekalahan Iblis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “ia” tidak dikapitalisasi sesuai kaidah bahasa Indonesia umum; “Iblis” dan “surga” memakai istilah yang dikenal luas. Susunan kalimat sengaja tidak menambahkan penafsiran mengenai kapan atau dalam arti apa Iblis jatuh.
