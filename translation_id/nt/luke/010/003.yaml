  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: id
  text: Pergilah! Lihatlah, Aku mengutus kalian seperti anak-anak domba[a] di tengah-tengah serigala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani secara khusus menyebut “anak-anak domba,” bukan sekadar “domba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάγετε
  choice: Pergilah
  rationale: Imperatif orang kedua jamak ini merupakan perintah pengutusan. Bentuk “Pergilah” ringkas, alami, dan sesuai dengan konteks.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian kepada pernyataan berikutnya. “Lihatlah” mempertahankan daya penunjuknya tanpa memakai ungkapan yang lebih arkais.
- source_word: ἀποστέλλω ὑμᾶς
  choice: Aku mengutus kalian
  rationale: Bentuk kini orang pertama tunggal diikuti objek orang kedua jamak. “Mengutus” mempertahankan makna pengiriman untuk suatu tugas, sedangkan “kalian” menyatakan jumlah jamak yang eksplisit dalam bahasa Yunani.
- source_word: ὡς
  choice: seperti
  rationale: Kata ini memperkenalkan perbandingan; “seperti” secara alami menandai perumpamaan, bukan penyamaan harfiah.
- source_word: ἄρνας
  choice: anak-anak domba
  rationale: Bentuk jamak ἀρήν secara khusus berarti anak domba. Pilihan ini mempertahankan gambaran kerentanan dan tidak menyelaraskannya dengan ayat lain yang memakai istilah umum untuk domba.
- source_word: ἐν μέσῳ λύκων
  choice: di tengah-tengah serigala
  rationale: Terjemahan ini dekat dengan susunan Yunani dan mempertahankan gambaran para utusan yang berada dalam lingkungan yang mengancam.
theological_decisions:
- issue: Gambaran hewan dalam pengutusan para murid
  choice: Mempertahankan perbandingan “seperti anak-anak domba di tengah-tengah serigala”
  alternative: seperti domba di antara serigala
  rationale: Teks Yunani memakai ἄρνας, yaitu “anak-anak domba,” bukan istilah umum “domba.” Terjemahan mempertahankan penekanan pada kerentanan tanpa menambahkan penafsiran tentang identitas serigala.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” dipakai untuk menyatakan bahwa objek ὑμᾶς berbentuk jamak. Huruf kapital pada “Aku” mengikuti kelaziman penulisan tuturan ilahi dalam terjemahan Alkitab bahasa Indonesia.
