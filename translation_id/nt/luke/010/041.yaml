id: LUK.10.41
reference: Luke 10:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: id
  text: Namun Tuhan menjawabnya, “Marta, Marta, engkau khawatir dan gelisah tentang banyak hal.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Namun Tuhan menjawabnya
  rationale: Ungkapan partisip + verba ini merupakan idiom naratif yang wajar dipadankan dengan satu verba finit, “menjawab”. δὲ menyatakan peralihan bernuansa kontras, sehingga diterjemahkan “Namun”.
- source_word: ὁ κύριος
  choice: Tuhan
  rationale: Dalam narasi Lukas, κύριος berfungsi sebagai gelar bagi Yesus dan mengandung bobot penghormatan serta kristologis; “Tuhan” adalah padanan Indonesia yang lazim.
- source_word: Μάρθα Μάρθα
  choice: Marta, Marta
  rationale: Pengulangan sapaan dipertahankan karena menyatakan penekanan dan nada pribadi yang penuh perhatian.
- source_word: μεριμνᾷς
  choice: engkau khawatir
  rationale: Verba ini menunjuk pada rasa cemas atau kekhawatiran batin. “Khawatir” alami dalam bahasa Indonesia modern dan mempertahankan kekuatan emosionalnya.
- source_word: θορυβάζῃ
  choice: gelisah
  rationale: Verba ini menggambarkan keadaan terganggu atau bergejolak dalam batin. “Gelisah” membedakannya dari kekhawatiran yang dinyatakan oleh μεριμνᾷς.
- source_word: περὶ πολλά
  choice: tentang banyak hal
  rationale: Padanan langsung dan alami yang mempertahankan cakupan umum dari keprihatinan Marta.
theological_decisions:
- issue: Penerjemahan κύριος sebagai gelar bagi Yesus
  choice: Tuhan
  alternative: tuan
  rationale: “Tuhan” mempertahankan fungsi gelar naratif dan kemungkinan resonansi kristologis dalam Lukas, sedangkan “tuan” berisiko mempersempitnya menjadi sapaan sosial semata.
translation_notes:
  register: Bahasa Indonesia baku-modern, alami, dan bermartabat. Kata ganti “engkau” dipakai dalam sapaan langsung Yesus kepada Marta untuk menjaga keakraban yang khidmat tanpa terdengar terlalu sehari-hari.
