  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: id
  text: Kemudian tujuh puluh dua orang itu kembali dengan sukacita[a] dan berkata, “Tuhan, bahkan setan-setan pun tunduk kepada kami dalam nama-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “tujuh puluh orang” dan bukan “tujuh puluh dua orang.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: kembali
  rationale: Aoristus indikatif ὑποστρέφω menyatakan bahwa mereka kembali dari tugas pengutusan; “kembali” alami dan tepat dalam bahasa Indonesia.
- source_word: δὲ
  choice: Kemudian
  rationale: δέ menandai perkembangan narasi; “Kemudian” menjaga kesinambungan alur tanpa memberi pertentangan yang tidak ada.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: ketujuh puluh dua orang itu
  rationale: Mengikuti teks SBLGNT yang berbunyi “tujuh puluh dua”; “orang” ditambahkan secara wajar agar penyebutan kelompok terdengar alami dalam bahasa Indonesia.
- source_word: μετὰ χαρᾶς
  choice: dengan sukacita
  rationale: Mempertahankan bentuk nomina χαρά dan menyampaikan kegembiraan mereka dengan ungkapan Indonesia yang bermartabat dan lazim.
- source_word: λέγοντες
  choice: dan berkata
  rationale: Partisipel yang mengantar ujaran langsung paling alami diungkapkan sebagai verba berkoordinasi dalam bahasa Indonesia.
- source_word: Κύριε
  choice: Tuhan
  rationale: Vokatif κύριος yang ditujukan kepada Yesus diterjemahkan dengan sebutan baku “Tuhan”.
- source_word: καὶ
  choice: bahkan ... pun
  rationale: καί bersifat askensif dalam seruan ini; konstruksi “bahkan ... pun” menyampaikan keterkejutan bahwa roh-roh jahat juga tunduk.
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: Dalam bahasa Indonesia modern, “roh-roh jahat” secara jelas dan alami menunjuk makhluk-makhluk rohani jahat yang dimaksud δαιμόνια, tanpa memakai istilah yang berpotensi kurang jelas bagi pembaca umum.
- source_word: ὑποτάσσεται
  choice: tunduk
  rationale: Bentuk kini ini menyatakan ketundukan kepada kewenangan; “tunduk” ringkas, alami, dan mempertahankan makna relasional verba tersebut.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Dativus sesudah ὑποτάσσω secara langsung dan alami diterjemahkan “kepada kami”.
- source_word: ἐν τῷ ὀνόματί σου
  choice: dalam nama-Mu
  rationale: Mempertahankan ungkapan sumber yang menunjuk pada tindakan dalam hubungan dengan nama dan kewenangan Yesus, tanpa mempersempitnya hanya menjadi sarana atau sebab.
theological_decisions:
- issue: Varian tekstual mengenai jumlah murid
  choice: ketujuh puluh dua orang
  alternative: ketujuh puluh orang
  rationale: Teks utama mengikuti SBLGNT, yang memuat “tujuh puluh dua”; varian penting “tujuh puluh” dipertahankan dalam catatan kaki agar bukti tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia standar modern, alami, dan bermartabat. Struktur dibuat mudah dipahami pembaca umum sambil mempertahankan unsur penekanan, sebutan “Tuhan,” serta ambiguitas idiom “dalam nama-Mu.” Kapitalisasi pronomina “-Mu” mengikuti kebiasaan hormat dalam penerbitan Alkitab bahasa Indonesia.
