source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: id
  text: Orang yang mendengarkan kalian mendengarkan Aku, dan orang yang menolak[a] kalian menolak Aku; tetapi orang yang menolak Aku menolak Dia yang mengutus Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “mengabaikan” atau “mengesampingkan” untuk kata “menolak” (Yunani: ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Orang yang mendengarkan
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang melakukan tindakan itu. Ungkapan ini mempertahankan bentuk tunggal representatif serta terdengar wajar dalam bahasa Indonesia.
- source_word: ὑμῶν / ὑμᾶς
  choice: kalian
  rationale: Kedua pronomina Yunani berbentuk jamak dan merujuk langsung kepada para murid sebagai utusan Yesus. “Kalian” menyatakan kejamakan itu tanpa menambahkan kata “pesan” yang tidak terdapat dalam teks.
- source_word: ἐμοῦ / ἐμέ
  choice: Aku
  rationale: Pronomina orang pertama dipertahankan secara langsung untuk menjaga hubungan pribadi yang ditegaskan antara penerimaan atau penolakan terhadap para murid dan terhadap Yesus sendiri.
- source_word: ἀκούει
  choice: mendengarkan
  rationale: Dalam konteks menerima perkataan seorang utusan, “mendengarkan” lebih alami daripada “mendengar” dalam bahasa Indonesia dan tetap mempertahankan pengulangan kata kerja pada klausa pertama.
- source_word: ἀθετέω
  choice: menolak
  rationale: Kata ini dapat berarti menolak, mengabaikan, atau mengesampingkan. Dalam konteks hubungan dengan para utusan, “menolak” paling jelas menyampaikan penolakan terhadap pribadi dan wewenang mereka, sambil mempertahankan pengulangan retoris pada ketiga kemunculannya.
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai peralihan atau kontras ringan menuju pernyataan puncak mengenai Dia yang mengutus Yesus.
- source_word: τὸν ἀποστείλαντά με
  choice: Dia yang mengutus Aku
  rationale: Partisipel aoris dengan artikel diterjemahkan sebagai frasa nominal yang alami. Referennya dibiarkan tersirat sebagaimana dalam bahasa Yunani, tanpa menambahkan “Bapa”.
theological_decisions:
- issue: Hubungan Yesus dengan para utusan-Nya
  choice: 'Mempertahankan rantai pribadi secara langsung: mendengarkan atau menolak para murid berarti mendengarkan atau menolak Yesus.'
  alternative: Menguraikannya sebagai mendengarkan atau menolak hanya pesan maupun ajaran para murid.
  rationale: Teks Yunani memakai pronomina pribadi “kalian” dan “Aku”, bukan kata benda abstrak seperti “pesan” atau “ajaran”. Terjemahan ini menjaga gagasan perwakilan tanpa mempersempit maknanya.
- issue: Identitas “Dia yang mengutus Aku”
  choice: Membiarkan identitas pengutus tersirat.
  alternative: Menuliskan secara eksplisit “Bapa yang mengutus Aku”.
  rationale: Dalam konteks, yang dimaksud adalah Allah Bapa, tetapi kata “Bapa” tidak disebutkan dalam ayat ini. Rumusan tersirat mempertahankan ketegangan dan ketepatan teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk jamak Yunani secara eksplisit. Huruf kapital pada “Aku” dan “Dia” mengikuti kebiasaan bahasa Indonesia dalam rujukan ilahi tanpa menambahkan gelar yang tidak terdapat dalam teks.
