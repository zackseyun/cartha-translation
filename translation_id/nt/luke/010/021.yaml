id: LUK.10.21
reference: Luke 10:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: id
  text: Pada saat itu juga, Ia bersukacita dalam Roh Kudus dan berkata, “Aku memuji Engkau[a], ya Bapa, Tuhan langit dan bumi, karena Engkau menyembunyikan hal-hal ini dari orang-orang bijaksana dan berpengertian, dan menyatakannya kepada anak-anak kecil[b]. Ya, Bapa, sebab demikianlah yang berkenan di hadapan-Mu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku bersyukur kepada-Mu.” Verba Yunani ini dapat menyatakan ucapan syukur maupun pujian dalam doa.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bayi-bayi.” Ungkapan ini kemungkinan dipakai secara kiasan bagi orang yang rendah hati, bergantung, atau dianggap tidak penting, bukan hanya bagi anak yang masih sangat kecil.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sebab demikianlah kehendak-Mu yang penuh kemurahan,” atau “sebab hal ini menyenangkan hati-Mu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Pada waktu itu juga
  rationale: Mengungkapkan penekanan demonstratif dan hubungan waktu secara alami dalam bahasa Indonesia modern.
- source_word: ἠγαλλιάσατο
  choice: bersukacita
  rationale: Menyampaikan sukacita yang kuat tanpa memakai istilah yang terasa tidak lazim.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: dalam Roh Kudus
  rationale: Konstruksi Yunani paling wajar menunjuk kepada Roh Kudus; preposisi 'dalam' mempertahankan kemungkinan nuansa lingkup maupun perantaraan.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Aku memuji Engkau
  rationale: Dalam doa kepada Bapa, verba ini dapat menyatakan pujian sekaligus ucapan syukur; 'memuji' cocok dengan sapaan doksologis berikutnya.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: ya Bapa, Tuhan atas langit dan bumi
  rationale: '''Tuhan'' mempertahankan κύριος, sedangkan ''atas'' membuat cakupan kekuasaan yang dinyatakan oleh bentuk genetif jelas dan alami.'
- source_word: ἀπέκρυψας
  choice: Engkau menyembunyikan
  rationale: Padanan aktif langsung yang mempertahankan Allah sebagai pelaku tanpa memperlunak ketegangan teologis teks.
- source_word: σοφῶν καὶ συνετῶν
  choice: orang-orang bijaksana dan berpengertian
  rationale: Mempertahankan kedua sifat Yunani tanpa menyempitkannya menjadi tingkat pendidikan formal.
- source_word: ἀπεκάλυψας
  choice: menyatakannya
  rationale: Padanan Indonesia yang alami dan tetap mempertahankan kontras dengan 'menyembunyikan'.
- source_word: νηπίοις
  choice: anak-anak kecil
  rationale: Mempertahankan gambaran anak kecil yang dapat berfungsi secara metaforis; arti harfiah yang lebih sempit dicatat dalam catatan kaki.
- source_word: ναί
  choice: Ya
  rationale: Padanan afirmatif langsung dan alami dalam sapaan doa.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: sebab demikianlah yang berkenan di hadapan-Mu
  rationale: Menjaga ungkapan tentang perkenanan ilahi dan frasa spasial 'di hadapan-Mu' tanpa mengubahnya secara diam-diam menjadi rumusan kehendak yang lebih interpretatif.
theological_decisions:
- issue: Referen τῷ πνεύματι τῷ ἁγίῳ
  choice: Roh Kudus sebagai referen personal
  alternative: roh-Nya atau dalam roh
  rationale: Artikel pada nomina dan adjektiva kuat mendukung rujukan kepada Roh Kudus. Terjemahan ini mengikuti bentuk teks tanpa menjadikannya sekadar keadaan batin Yesus.
- issue: Tindakan ilahi menyembunyikan dan menyatakan
  choice: Mempertahankan Allah sebagai subjek aktif bagi kedua verba
  alternative: Bentuk pasif atau ungkapan yang mengurangi keaktifan Allah
  rationale: Kedua verba Yunani berbentuk aktif dengan Bapa sebagai pelaku; ketegangan teologisnya tidak dilunakkan.
- issue: Makna εὐδοκία dalam klausa penutup
  choice: yang berkenan di hadapan-Mu
  alternative: kehendak-Mu yang penuh kemurahan atau hal yang menyenangkan hati-Mu
  rationale: Pilihan utama mempertahankan ambiguitas antara perkenanan, kesenangan, dan kehendak ilahi; alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan langsung kepada Bapa memakai 'Engkau' dan '-Mu'; narasi memakai 'Ia'. Struktur paralel 'menyembunyikan ... tetapi menyatakan' dipertahankan agar kontras sumber tetap jelas.
