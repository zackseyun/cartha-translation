id: LUK.10.13
reference: Luke 10:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: id
  text: Celakalah engkau, Khorazim! Celakalah engkau, Betsaida! Sebab, seandainya perbuatan-perbuatan penuh kuasa[a] yang terjadi di tengah-tengahmu terjadi di Tirus dan Sidon, tentulah mereka sudah lama bertobat[b] sambil duduk dalam kain kabung dan abu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mukjizat-mukjizat”; secara harfiah, “perbuatan-perbuatan kuasa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka sudah lama mengubah pikiran mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Celakalah engkau
  rationale: Ungkapan ini mempertahankan nada kecaman profetis sekaligus ratapan dari οὐαί, sedangkan bentuk sapaan tunggal mencerminkan σοι dan personifikasi masing-masing kota.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Khorazim / Betsaida / Tirus / Sidon
  rationale: Nama-nama tempat mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, dengan Khorazim mempertahankan bunyi konsonan awal nama Yunani.
- source_word: δυνάμεις
  choice: perbuatan-perbuatan penuh kuasa
  rationale: Pilihan ini mempertahankan unsur perbuatan sekaligus kuasa dalam δυνάμεις; 'mukjizat' dicantumkan sebagai alternatif yang lebih ringkas tetapi lebih interpretatif.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: terjadi ... yang terjadi
  rationale: Pengulangan verba 'terjadi' mencerminkan bentuk-bentuk γίνομαι dan tidak menambahkan pelaku yang tidak dinyatakan dalam teks.
- source_word: ἐν ὑμῖν
  choice: di tengah-tengahmu
  rationale: Frasa ini secara alami menunjuk kepada kota beserta penduduknya sebagai lingkungan tempat perbuatan-perbuatan itu terjadi; bentuk tunggal '-mu' sesuai dengan sapaan kepada masing-masing kota.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: tentulah mereka sudah lama bertobat
  rationale: Susunan ini menyatakan akibat kontrafaktual dan mempertahankan makna temporal πάλαι dengan bahasa Indonesia yang wajar.
- source_word: καθήμενοι
  choice: sambil duduk
  rationale: Partisipel ini dipertahankan sebagai tindakan yang menyertai pertobatan, sehingga gambaran konkret perkabungan tidak diabstrakkan.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: dalam kain kabung dan abu
  rationale: Terjemahan ini mempertahankan citra perkabungan dan pertobatan yang dikenal dalam dunia Alkitab tanpa menambahkan tindakan yang tidak dinyatakan, seperti menaburkan abu.
theological_decisions:
- issue: Sifat δυνάμεις dalam pelayanan Yesus
  choice: perbuatan-perbuatan penuh kuasa
  alternative: mukjizat
  rationale: Istilah Yunani menunjuk pada tindakan luar biasa yang menyatakan kuasa, tetapi tidak hanya memakai kategori teknis 'mukjizat'. Terjemahan utama mempertahankan kedua unsur tersebut.
- issue: Makna μετανοέω
  choice: bertobat
  alternative: mengubah pikiran dan sikap
  rationale: '''Bertobat'' merupakan padanan Indonesia yang wajar dalam konteks panggilan moral dan rohani. Catatan alternatif menunjukkan unsur perubahan pikiran tanpa menyempitkan pertobatan menjadi proses intelektual semata.'
- issue: Gambaran pertobatan dan perkabungan
  choice: sambil duduk dalam kain kabung dan abu
  alternative: bertobat dengan kain kabung dan abu
  rationale: Bentuk utama mempertahankan partisipel καθήμενοι dan gambaran konkret teks, alih-alih meratakan gambaran itu menjadi keterangan umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'terjadi' sengaja dipertahankan untuk mencerminkan pengulangan γίνομαι. Bentuk sapaan tunggal kepada setiap kota dipertahankan melalui 'engkau' dan '-mu'. Semua penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskan.
