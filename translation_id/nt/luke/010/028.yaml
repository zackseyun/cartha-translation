  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: id
  text: Lalu Yesus berkata kepadanya, “Jawabanmu benar. Lakukanlah itu, maka kamu akan hidup.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Konteks yang lebih luas berbicara tentang hidup kekal (lihat Lukas 10:25), tetapi teks Yunani di sini hanya mengatakan, “kamu akan hidup.”
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Lalu Yesus berkata kepadanya
  rationale: δέ adalah penghubung naratif ringan; “lalu” mengalir alami dalam bahasa Indonesia tanpa menonjolkan pertentangan. Subjek yang tersirat diperjelas sebagai “Yesus” berdasarkan konteks agar rujukannya jelas bagi pembaca.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Jawabanmu benar
  rationale: Ungkapan ini menyampaikan penilaian bahwa ia telah menjawab dengan tepat. Bentuk nominal ini lebih alami dalam bahasa Indonesia modern daripada terjemahan kaku “kamu menjawab dengan benar”.
- source_word: τοῦτο ποίει
  choice: Lakukanlah itu
  rationale: τοῦτο menunjuk kembali kepada perintah yang baru dikutip. Imperatif kini ποίει dapat mengandung nuansa tindakan berkelanjutan, tetapi “lakukanlah” tetap ringkas, wajar, dan tidak menutup nuansa tersebut.
- source_word: καὶ ζήσῃ
  choice: maka kamu akan hidup
  rationale: καί sesudah imperatif menyatakan hasil dan secara alami diterjemahkan “maka”. ζήσῃ diterjemahkan langsung “kamu akan hidup” tanpa menambahkan kata “kekal” yang tidak muncul dalam klausa ini.
theological_decisions:
- issue: Cakupan makna “hidup” dalam konteks kehidupan kekal
  choice: kamu akan hidup
  alternative: kamu akan memperoleh hidup kekal
  rationale: Pertanyaan dalam Lukas 10:25 menyangkut hidup kekal, tetapi teks ayat ini hanya mengatakan ζήσῃ, “kamu akan hidup”. Terjemahan utama mempertahankan bentuk ringkas dan ketegangan teologis teks, sedangkan konteksnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. “Jawabanmu benar” mudah dipahami pembaca umum. Partikel kesantunan “-lah” mempertahankan nada perintah yang tegas tanpa terdengar kasar.
