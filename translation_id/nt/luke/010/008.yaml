  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: id
  text: Apabila kalian memasuki kota mana pun dan orang-orang di sana menyambut kalian[a], makanlah apa yang dihidangkan kepada kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menerima kalian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “hal-hal yang ditaruh di hadapan kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν εἰσέρχησθε
  choice: apabila kalian memasuki kota mana pun
  rationale: Gabungan pronomina relatif dengan ἄν menyatakan keadaan umum atau tidak tertentu. “Kota mana pun” alami dalam bahasa Indonesia, sedangkan “memasuki” mempertahankan gagasan gerak masuk dari εἰς dan εἰσέρχομαι.
- source_word: δέχωνται ὑμᾶς
  choice: orang-orang di sana menyambut kalian
  rationale: Dalam konteks penerimaan para utusan, δέχομαι secara alami berarti “menyambut” atau “menerima.” Subjek jamak yang tersirat diperjelas sebagai “orang-orang di sana” agar tidak janggal dalam bahasa Indonesia.
- source_word: ἐσθίετε
  choice: makanlah
  rationale: Bentuk imperatif kini menyampaikan perintah; akhiran -lah menghasilkan instruksi yang wajar dan bermartabat.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: apa yang dihidangkan kepada kalian
  rationale: Dalam konteks perjamuan, παρατίθημι menunjuk pada makanan yang ditaruh di hadapan atau disajikan kepada seseorang. “Dihidangkan” mempertahankan bentuk pasif dan terdengar alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk menunjukkan bahwa semua verba dan pronomina orang kedua dalam bahasa Yunani berbentuk jamak. Struktur kalimat mempertahankan hubungan umum antara memasuki kota, diterima penduduknya, dan perintah untuk memakan hidangan yang diberikan.
