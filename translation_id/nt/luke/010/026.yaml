  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Apa yang tertulis dalam Taurat? Bagaimana kamu membacanya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagaimana kamu menafsirkannya?” Kata Yunani secara harfiah berarti “membaca,” tetapi dalam konteks ini dapat juga menyiratkan pemahaman atau penafsiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lalu ia
  rationale: δέ merupakan penghubung ringan dalam alur narasi. “Lalu” terdengar alami dan tidak memberi kesan pertentangan yang terlalu kuat; artikel ὁ berfungsi sebagai pronomina bagi subjek yang sudah jelas.
- source_word: εἶπεν πρὸς αὐτόν
  choice: berkata kepadanya
  rationale: Menerjemahkan secara langsung tindakan berbicara dan πρός dengan akusatif sebagai penanda orang yang disapa.
- source_word: Ἐν τῷ νόμῳ
  choice: dalam Taurat
  rationale: Dalam konteks percakapan dengan seorang ahli Taurat, νόμος menunjuk pada hukum tertulis yang diberikan kepada Israel. “Taurat” merupakan istilah Indonesia yang lazim dan jelas untuk rujukan khusus ini.
- source_word: τί γέγραπται
  choice: Apa yang tertulis
  rationale: Bentuk perfekt pasif γέγραπται menekankan keadaan teks yang tetap tertulis; ungkapan Indonesia ini alami dan mempertahankan acuan pada Kitab Suci.
- source_word: πῶς ἀναγινώσκεις
  choice: Bagaimana kamu membacanya?
  rationale: ἀναγινώσκεις secara leksikal berarti “membaca,” sedangkan πῶς menanyakan cara. Susunan ini mempertahankan keterbukaan ungkapan Yunani, yang dalam konteks juga dapat menyiratkan pemahaman atau penafsiran.
theological_decisions:
- issue: Makna νόμος dalam pertanyaan Yesus
  choice: Taurat sebagai hukum tertulis yang diakui Israel
  alternative: Hukum; hukum dalam arti umum
  rationale: Konteks dialog dengan seorang ahli Taurat menunjukkan acuan khusus kepada Kitab Taurat, bukan hukum secara umum. Pilihan ini jelas bagi pembaca Indonesia tanpa mempersempit isi lebih jauh daripada konteks.
- issue: Nuansa interpretatif πῶς ἀναγινώσκεις
  choice: Mempertahankan bentuk “Bagaimana kamu membacanya?”
  alternative: Bagaimana kamu menafsirkannya?
  rationale: Pertanyaan itu dapat menyangkut pemahaman atau penafsiran, tetapi verba Yunaninya secara langsung berarti “membaca.” Teks utama mempertahankan ketegangan dan keterbukaan retoris tersebut, sementara catatan kaki menjelaskan nuansa yang mungkin.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kamu” sesuai untuk sapaan tunggal langsung dalam dialog; “ia” menjaga gaya naratif tertulis. Penanda catatan kaki ditempatkan tepat setelah pertanyaan yang dijelaskannya.
