  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan makna Yunani: δέδωκα diterjemahkan sebagai perfek "telah memberi"; ἐξουσία dibedakan dari δύναμις melalui "wewenang" dan "kekuatan"; dan penyangkalan οὐδὲν ... οὐ μή diterjemahkan secara tegas. "Menginjak ular dan kalajengking" mempertahankan citra harfiah tanpa memaksakan pembacaan simbolis.'
