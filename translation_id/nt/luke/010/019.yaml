id: LUK.10.19
reference: Luke 10:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: id
  text: Lihatlah, Aku telah memberi kalian wewenang untuk menginjak ular dan kalajengking[a], serta wewenang atas seluruh kekuatan musuh. Tidak ada apa pun yang akan mencelakakan kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran ular dan kalajengking juga dapat mengacu pada kekuatan rohani yang bermusuhan dalam konteks ini.
    reason: ambiguity
  - marker: b
    text: 'Bahasa Yunani memakai bentuk penyangkalan yang sangat tegas: ‘sama sekali tidak akan mencelakakan kalian.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan penegasan tanpa memakai ungkapan yang terlalu kuno.
- source_word: δέδωκα
  choice: telah memberi
  rationale: Bentuk perfek menyatakan tindakan yang sudah dilakukan dengan hasil yang tetap berlaku.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menunjukkan hak atau otoritas yang diberikan dan mempertahankan perbedaannya dari δύναμις, yang diterjemahkan sebagai 'kekuatan'.
- source_word: τοῦ πατεῖν
  choice: untuk menginjak
  rationale: Menyampaikan isi atau cakupan wewenang yang diberikan serta mempertahankan gambaran konkret verba Yunani.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: ular dan kalajengking
  rationale: Padanan alami dalam bahasa Indonesia untuk gambaran harfiah tersebut; unsur 'di atas' sudah tersirat secara wajar dalam verba 'menginjak'.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: atas seluruh kekuatan
  rationale: Mengungkapkan lingkup kuasa atau keunggulan terhadap segenap kekuatan musuh.
- source_word: δύναμιν
  choice: kekuatan
  rationale: Mempertahankan pembedaan leksikal dari ἐξουσία ('wewenang') sebelumnya.
- source_word: τοῦ ἐχθροῦ
  choice: musuh
  rationale: Mempertahankan sebutan tunggal dalam teks tanpa secara eksplisit mengidentifikasinya sebagai Iblis.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: Tidak ada apa pun yang akan mencelakakan kalian
  rationale: Menyampaikan penyangkalan yang tegas dalam bahasa Indonesia yang alami; nuansa penegasannya diterangkan dalam catatan kaki.
theological_decisions:
- issue: Rujukan 'musuh'
  choice: Tetap diterjemahkan 'musuh' tanpa identifikasi tambahan.
  alternative: Iblis atau Setan
  rationale: Konteks menunjuk pada perlawanan rohani, tetapi teks Yunani hanya menyebut 'musuh'; terjemahan tidak mempersempit rujukannya secara eksplisit.
- issue: Makna ular dan kalajengking
  choice: Gambaran harfiah dipertahankan dalam teks utama.
  alternative: Lambang kekuatan rohani yang bermusuhan, atau gambaran yang sekaligus harfiah dan simbolis
  rationale: Kata-katanya secara leksikal menunjuk pada ular dan kalajengking, sedangkan konteks dapat memberi gema rohani. Terjemahan membiarkan ketegangan penafsiran itu tetap terbuka.
- issue: Cakupan janji bahwa tidak ada yang akan mencelakakan para murid
  choice: Pernyataan tegas diterjemahkan tanpa menambahkan batasan penafsiran.
  alternative: Jaminan khusus terhadap bahaya dalam pelayanan atau terhadap kerugian rohani yang terakhir
  rationale: Ayat ini sendiri tidak menyatakan batasan tersebut; penerjemahan tidak boleh menyisipkan penyelesaian teologis yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan mudah dipahami. 'Kalian' dipakai untuk menandai bahwa semua kata ganti orang kedua dalam ayat ini berbentuk jamak. Pengulangan 'wewenang' membuat hubungan sintaksis antara ἐξουσίαν dan kedua cakupannya jelas dalam bahasa Indonesia, sambil menjaga kontras antara 'wewenang' dan 'kekuatan'.
