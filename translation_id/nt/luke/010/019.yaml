  terminology: '"Wewenang" merupakan padanan yang baik untuk ἐξουσία dan secara efektif dibedakan dari "kekuatan" untuk δύναμις. "Musuh" mempertahankan ketidakspesifikan τοῦ ἐχθροῦ; tidak ada identifikasi teologis tambahan yang dimasukkan. Istilah "mencelakakan" wajar untuk ἀδικήσῃ dalam konteks ini.'
