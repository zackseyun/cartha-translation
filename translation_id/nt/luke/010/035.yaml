  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk ‘kaukeluarkan’ dan ‘kubayar’ mempertahankan kelancaran tuturan langsung. Istilah historis ‘dinar’ dipertahankan dan diterangkan melalui catatan budaya.
