source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: id
  text: Keesokan harinya, ia mengeluarkan dua dinar[a], memberikannya kepada pengelola penginapan itu, dan berkata, “Rawatlah dia. Berapa pun biaya tambahan yang kaukeluarkan, akan kubayar kembali kepadamu ketika aku kembali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinar adalah uang logam perak Romawi yang lazim digunakan; satu dinar kira-kira setara dengan upah seorang pekerja untuk satu hari.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara idiomatis berarti hari berikutnya; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐκβαλών
  choice: mengeluarkan
  rationale: Dalam konteks ini, partisip tersebut menyatakan tindakan mengambil atau mengeluarkan uang dari miliknya, bukan makna harfiah yang lebih keras seperti ‘melemparkan keluar’.
- source_word: δύο δηνάρια
  choice: dua dinar
  rationale: Mempertahankan nama mata uang kuno sebagaimana dalam teks Yunani; nilainya dijelaskan dalam catatan kaki agar tidak diganti dengan taksiran yang interpretatif.
- source_word: πανδοχεῖ
  choice: pemilik penginapan
  rationale: Istilah ini menunjuk kepada orang yang mengelola atau menerima tamu di penginapan. ‘Pemilik penginapan’ mudah dipahami dalam bahasa Indonesia, meski kepemilikan secara hukum tidak menjadi fokus istilah sumber.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Rawatlah dia
  rationale: Menyampaikan perintah untuk memberi perhatian dan perawatan secara ringkas, alami, dan sesuai konteks orang yang terluka.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Berapa pun biaya tambahan yang kaukeluarkan
  rationale: Menjaga ketidakpastian jumlah sekaligus unsur pengeluaran tambahan yang terkandung dalam προσ-.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: ketika aku kembali
  rationale: Konstruksi infinitif berartikel dengan ἐν berfungsi temporal dan paling alami diterjemahkan sebagai anak kalimat waktu.
- source_word: ἀποδώσω σοι
  choice: akan kubayar kembali kepadamu
  rationale: Menyatakan janji mengganti pengeluaran dalam konteks keuangan tanpa memakai istilah teknis yang kaku.
