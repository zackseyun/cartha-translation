  terminology: '"Murid-murid", "berpaling", dan "Berbahagialah" sesuai dengan register Alkitab Indonesia modern yang baku. "Ia" dan "kalian" dapat dipertahankan; "kalian" dengan tepat mencerminkan orang kedua jamak βλέπετε tanpa mengubah makna.'
