  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: id
  text: Lalu Ia berpaling kepada murid-murid-Nya dan berkata secara tersendiri kepada mereka[a], “Berbahagialah mata yang melihat apa yang kalian lihat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara pribadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: berpaling
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului perkataan Yesus. “Berpaling” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan tindakan tersebut dengan verba utama.
- source_word: κατ’ ἰδίαν
  choice: secara pribadi
  rationale: Ungkapan idiomatis ini menunjukkan bahwa perkataan tersebut disampaikan terpisah dari orang lain. “Secara pribadi” ringkas dan alami, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: μαθητάς
  choice: murid-murid
  rationale: Padanan baku yang mempertahankan hubungan para pengikut dengan Yesus sebagai guru mereka.
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Bentuk ini lazim untuk ucapan bahagia dan menyatakan keadaan yang diperkenan atau dikaruniai Allah, bukan sekadar emosi gembira sesaat.
- source_word: ὀφθαλμοὶ
  choice: mata
  rationale: Mempertahankan metonimia dan gambaran konkret dalam teks Yunani tanpa menguraikannya menjadi “orang-orang yang melihat”.
- source_word: οἱ βλέποντες
  choice: yang melihat
  rationale: Menerjemahkan partisip berartikel sebagai klausa pewatas yang alami dalam bahasa Indonesia serta mempertahankan daya deskriptif bentuk kini.
- source_word: ἃ βλέπετε
  choice: apa yang kalian lihat
  rationale: Padanan langsung dan alami bagi pronomina relatif serta verba kini. “Kalian” memperjelas bahwa bentuk Yunani βλέπετε berjumlah jamak.
theological_decisions:
- issue: Daya ucapan bahagia
  choice: Pernyataan bahwa mata yang menyaksikan apa yang disaksikan para murid berada dalam keadaan berbahagia karena hak istimewa tersebut.
  alternative: Pernyataan tentang perasaan senang semata-mata.
  rationale: Μακάριοι dalam bentuk ucapan bahagia memiliki bobot yang melampaui emosi subjektif. “Berbahagialah” mempertahankan nuansa berkat atau perkenanan tanpa menambahkan penjelasan teologis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ia” mempertahankan subjek tersirat dari konteks, sedangkan “kalian” dipakai agar bentuk jamak Yunani terlihat jelas. Susunan kalimat mempertahankan tindakan berpaling sebelum perkataan langsung.
