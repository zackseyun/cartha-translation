  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: id
  text: Yesus menjawab, “Seorang sedang turun dari Yerusalem ke Yerikho, lalu ia jatuh ke tangan para perampok. Mereka melucutinya, memukulinya, lalu pergi dan meninggalkannya dalam keadaan setengah mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβών
  choice: menjawab
  rationale: Dalam konteks percakapan, partisip ini memperkenalkan tanggapan Yesus; ‘menjawab’ alami dan tepat dalam bahasa Indonesia.
- source_word: Ἄνθρωπός τις
  choice: Ada seseorang
  rationale: Menyampaikan tokoh yang tidak ditentukan tanpa memberi penekanan yang tidak ada dalam bahasa Yunani.
- source_word: κατέβαινεν
  choice: sedang turun
  rationale: Bentuk imperfek menggambarkan perjalanan yang sedang berlangsung; Yerikho juga memang lebih rendah daripada Yerusalem.
- source_word: λῃσταῖς περιέπεσεν
  choice: jatuh ke tangan para perampok
  rationale: Ungkapan Indonesia yang alami untuk berhadapan secara nahas dengan sekelompok perampok.
- source_word: ἐκδύσαντες αὐτόν
  choice: merampas pakaiannya
  rationale: Menunjukkan bahwa para perampok menelanjangi korban dengan mengambil pakaiannya, sesuai konteks perampokan.
- source_word: πληγὰς ἐπιθέντες
  choice: memukulinya
  rationale: Merangkum idiom Yunani ‘menimpakan pukulan/luka’ secara alami tanpa mengurangi kekerasan tindakan.
- source_word: ἡμιθανῆ
  choice: dalam keadaan setengah mati
  rationale: Padanan langsung dan lazim yang mempertahankan kondisi korban sebagaimana dinyatakan teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Rangkaian tindakan dibuat jelas dengan kalimat terpisah, tanpa menambahkan motif atau identitas korban maupun para perampok.
