id: LUK.10.5
reference: Luke 10:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: id
  text: Ke rumah mana pun yang kamu masuki, pertama-tama katakanlah, “Damai bagi rumah ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Semoga damai menyertai rumah ini” atau “Damai atas rumah ini.” Bahasa Yunani memakai formula berkat yang ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: Ke rumah mana pun
  rationale: Gabungan εἰς dengan klausa relatif tak tentu menyatakan arah menuju rumah mana saja. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya arah εἰς.
- source_word: εἰσέλθητε
  choice: yang kamu masuki
  rationale: Aoristus subjungtif dengan ἄν memberi makna umum yang berorientasi ke depan. Bentuk ini menyampaikan tindakan memasuki secara wajar tanpa memperluas makna.
- source_word: οἰκίαν / οἴκῳ
  choice: rumah
  rationale: Dalam konteks ini, kata tersebut terutama menunjuk pada tempat tinggal yang dimasuki. Pilihan yang sama pada ucapan damai mempertahankan pengulangan konkret dalam bahasa Yunani, sambil tetap memungkinkan rumah dipahami mencakup penghuninya.
- source_word: πρῶτον
  choice: pertama-tama
  rationale: 'Menandai urutan dan prioritas: ucapan ini harus menjadi tindakan pertama ketika masuk.'
- source_word: λέγετε
  choice: katakanlah
  rationale: Imperatif kini menetapkan ucapan yang harus disampaikan berulang kali dalam situasi tersebut. “Katakanlah” merupakan padanan yang alami dan jelas.
- source_word: Εἰρήνη
  choice: Damai
  rationale: Mempertahankan bentuk ringkas dari formula salam sekaligus berkat, tanpa menambahkan kata kerja yang tidak dinyatakan dalam teks Yunani.
- source_word: τῷ οἴκῳ τούτῳ
  choice: bagi rumah ini
  rationale: Datif menandai penerima damai. “Bagi” alami sebagai formula berkat dalam bahasa Indonesia dan tidak membatasi maknanya menjadi sekadar keterangan lokasi.
theological_decisions:
- issue: Sifat formula damai
  choice: “Damai bagi rumah ini.”
  alternative: “Semoga damai menyertai rumah ini” atau “Damai atas rumah ini.”
  rationale: Teks memerintahkan pengucapan damai sebagai salam sekaligus berkat. Bentuk ringkas mempertahankan corak performatif dan nuansa Semitis tanpa menambahkan “semoga” atau menguranginya menjadi sapaan biasa.
- issue: Cakupan kata “rumah”
  choice: Mempertahankan “rumah”
  alternative: “Keluarga ini” atau “seisi rumah ini”
  rationale: οἰκία dan οἶκος dapat berkaitan dengan tempat tinggal beserta penghuninya, tetapi konteks masuk ke sebuah rumah mendukung makna konkret. Terjemahan tidak secara diam-diam membatasi berkat hanya pada bangunan ataupun hanya pada keluarga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” dipakai sebagai bentuk jamak yang mengikuti sapaan kepada para murid dalam konteks, sedangkan “katakanlah” menjaga nada perintah. Formula damai sengaja dibuat ringkas agar ketegangan antara salam dan berkat tetap terbuka.
