  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: id
  text: Namun, kota mana pun yang kalian masuki, jika orang-orang di sana tidak menerima kalian, keluarlah ke jalan-jalan kota itu[a] dan katakanlah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alun-alun” atau “jalan-jalan lebar”. Kata Yunani πλατείας mengacu pada jalan atau ruang terbuka untuk umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Namun, kota mana pun
  rationale: Konstruksi relatif dengan ἄν bersifat tak tentu dan umum. 'Kota mana pun' menyampaikan setiap kemungkinan yang dapat terjadi, sedangkan δέ menandai kontras dengan perintah sebelumnya dan diterjemahkan 'Namun'.
- source_word: εἰσέλθητε
  choice: yang kalian masuki
  rationale: Aoristus subjungtif dalam klausa relatif bersyarat ini menyatakan tindakan memasuki kota dalam suatu kemungkinan; bentuk Indonesia ini alami dan tetap mempertahankan gerak masuk.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: jika orang-orang di sana tidak menerima kalian
  rationale: Subjek jamak tersirat dibuat jelas secara alami sebagai penduduk kota. 'Menerima' mempertahankan cakupan δέχομαι, yang dapat mencakup menyambut serta menerima para utusan, tanpa mempersempitnya hanya pada keramahan.
- source_word: ἐξελθόντες
  choice: keluarlah
  rationale: Partisip ini menyatakan tindakan yang mendahului perintah utama. Imperatif berurutan dalam bahasa Indonesia menyampaikan hubungan itu secara wajar tanpa terjemahan harfiah yang kaku.
- source_word: εἰς τὰς πλατείας αὐτῆς
  choice: ke jalan-jalan umumnya
  rationale: πλατεῖαι menunjuk pada ruas-ruas luas dan terbuka yang menjadi ruang publik. 'Jalan-jalan umum' cocok dengan bentuk jamak dan konteks penyampaian pernyataan di depan umum; kemungkinan nuansa 'alun-alun' atau 'jalan-jalan lebar' dicatat dalam catatan kaki.
- source_word: εἴπατε
  choice: katakanlah
  rationale: Imperatif aoristus λέγω secara langsung memperkenalkan perkataan pada ayat berikutnya; 'katakanlah' merupakan padanan yang alami dan lugas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pronomina jamak 'kalian' dipakai untuk membedakan ὑμᾶς dari bentuk tunggal. Susunan kalimat mempertahankan kontras, kondisi, urutan tindakan, dan pengantar kutipan yang berlanjut ke ayat berikutnya.
