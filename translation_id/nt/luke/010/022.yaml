  to: Segala sesuatu telah diserahkan kepada-Ku oleh Bapa-Ku,[a] dan tidak seorang pun mengenal siapa Anak itu selain Bapa; dan tidak seorang pun mengenal siapa Bapa itu selain Anak dan siapa pun yang kepadanya Anak berkehendak[b] menyatakan-Nya.
