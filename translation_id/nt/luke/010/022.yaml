id: LUK.10.22
reference: Luke 10:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: id
  text: Segala sesuatu telah diserahkan kepada-Ku oleh Bapa-Ku,[a] dan tidak seorang pun mengenal siapa Anak itu selain Bapa; dan tidak seorang pun mengenal siapa Bapa itu selain Anak dan siapa pun yang kepadanya Anak berkehendak[b] menyatakan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semuanya telah diserahkan kepada-Ku oleh Bapa-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “memilih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Segala sesuatu
  rationale: Bentuk jamak netral ini memiliki cakupan luas. “Segala sesuatu” mempertahankan bobot menyeluruh pernyataan tersebut dalam bahasa Indonesia yang wajar.
- source_word: παρεδόθη
  choice: telah diserahkan
  rationale: Aoristus pasif παραδίδωμι menyatakan tindakan penyerahan. “Telah diserahkan” mempertahankan bentuk pasif dan menyampaikan tindakan yang sudah terjadi tanpa menambahkan gagasan pengelolaan yang tidak tersurat.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: oleh Bapa-Ku
  rationale: ὑπό dengan genitif menandai pelaku dalam konstruksi pasif; karena itu “oleh” tepat. Huruf kapital menandai sapaan relasional ilahi dalam konteks ini.
- source_word: γινώσκει
  choice: mengenal
  rationale: Dalam hubungan antarpersona, “mengenal” lebih alami daripada “mengetahui” dan tetap tidak menambahkan unsur “sepenuhnya” yang tidak dinyatakan secara eksplisit.
- source_word: τίς ἐστιν ὁ υἱὸς
  choice: siapa Anak itu
  rationale: Ungkapan ini mempertahankan tekanan pada identitas pribadi Sang Anak secara alami dalam bahasa Indonesia tanpa memperluasnya menjadi “siapa sebenarnya”.
- source_word: ὁ υἱός
  choice: Anak
  rationale: Konteks kristologis menunjukkan pemakaian sebagai gelar relasional tertentu; kapitalisasi menandai rujukan tersebut.
- source_word: ὁ πατήρ
  choice: Bapa
  rationale: Sebutan ini berfungsi sebagai gelar relasional bagi Allah dalam konteks tersebut; “Bapa” adalah bentuk Indonesia yang lazim dan bermartabat.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: orang yang kepadanya Anak berkehendak menyatakan Dia
  rationale: Konstruksi ini menunjuk penerima yang tidak ditentukan dan bergantung pada kehendak Anak. Objek tersirat dari “menyatakan” adalah Bapa dari klausa sebelumnya; “Dia” membuat objek itu jelas tanpa menambah rujukan baru.
- source_word: βούληται
  choice: berkehendak
  rationale: “Berkehendak” mempertahankan unsur volisi dan keputusan dalam βούληται. Pilihan ini lebih tepat daripada sekadar “ingin,” yang dapat terdengar lebih lemah.
- source_word: ἀποκαλύψαι
  choice: menyatakan
  rationale: “Menyatakan” menyampaikan tindakan membuat pribadi Bapa dikenal. Alternatif “menyingkapkan” lebih harfiah secara citra, tetapi kurang alami bila objeknya adalah pribadi.
theological_decisions:
- issue: Pengetahuan timbal balik yang eksklusif antara Bapa dan Anak
  choice: Mempertahankan susunan langsung bahwa tidak seorang pun mengenal Anak selain Bapa, dan tidak seorang pun mengenal Bapa selain Anak.
  alternative: Menambahkan kata penafsir seperti “sepenuhnya” atau “dengan sungguh-sungguh”.
  rationale: Teks Yunani menegaskan keunikan pengetahuan timbal balik itu melalui struktur eksklusifnya sendiri. Terjemahan tidak perlu meningkatkan γινώσκει dengan keterangan yang tidak tersurat.
- issue: Cakupan kehendak Anak dalam menyatakan Bapa
  choice: Menerjemahkan βούληται dengan “berkehendak” dan mempertahankan Anak sebagai pelaku yang menentukan penyataan itu.
  alternative: Menggunakan “ingin” atau parafrasa yang melunakkan peran aktif Anak.
  rationale: Bahasa Yunani menampilkan Anak sebagai pihak yang berkehendak menyatakan Bapa. Terjemahan mempertahankan pernyataan kristologis tersebut tanpa menjadikannya rumusan sistematis yang melampaui teks.
- issue: Objek tersirat dari ἀποκαλύψαι
  choice: Mengungkapkan objek tersirat sebagai “Dia,” yakni Bapa.
  alternative: Membiarkan verba “menyatakan” tanpa objek atau mengulang “Bapa”.
  rationale: Bapa adalah anteseden yang jelas dari klausa sebelumnya. “Dia” menghasilkan bahasa Indonesia yang lengkap dan alami sambil mempertahankan hubungan sintaksis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Bentuk “kepada-Ku” dan “Bapa-Ku” mengikuti kaidah penulisan pronomina yang merujuk kepada pribadi ilahi. Susunan paralel dipertahankan untuk membawa bobot retoris dan teologis teks Yunani.
