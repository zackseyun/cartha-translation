id: LUK.10.29
reference: Luke 10:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: id
  text: Namun, karena ingin membenarkan dirinya, orang itu berkata kepada Yesus, “Lalu, siapakah sesamaku[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “siapa yang termasuk sesamaku?”
    reason: Alternatif ini memperjelas bahwa pertanyaannya dapat menyangkut batas atau cakupan orang yang dianggap sebagai sesama.
lexical_decisions:
- source_word: θέλων
  choice: karena ingin
  rationale: Partisip kini ini menyatakan motif orang itu. Bentuk “karena ingin” menyampaikan hubungan motivasional secara alami dalam bahasa Indonesia.
- source_word: δικαιῶσαι ἑαυτόν
  choice: membenarkan dirinya
  rationale: Ungkapan ini menunjukkan upaya untuk memperlihatkan bahwa dirinya berada di pihak yang benar, tanpa harus dibaca sebagai penggunaan teknis doktrin pembenaran.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: berkata kepada Yesus
  rationale: Padanan naratif yang langsung, wajar, dan mengikuti konvensi nama dalam bahasa Indonesia.
- source_word: Καὶ
  choice: Lalu
  rationale: Dalam pertanyaan lanjutan ini, “Lalu” mempertahankan kesinambungan wacana yang ditandai καί dan terdengar alami dalam dialog Indonesia.
- source_word: τίς ἐστίν μου πλησίον
  choice: siapakah sesamaku
  rationale: πλησίον dipakai sebagai nomina dan merujuk pada orang yang harus dikasihi dalam konteks kutipan Taurat. “Sesamaku” merupakan ungkapan ringkas dan lazim dalam bahasa Indonesia serta mempertahankan bentuk pertanyaan langsung.
theological_decisions:
- issue: Makna δικαιῶσαι ἑαυτόν
  choice: Upaya orang itu untuk menunjukkan bahwa dirinya benar
  alternative: Membenarkan diri dalam arti moral yang lebih luas atau membela diri di hadapan orang banyak
  rationale: Konteksnya adalah percakapan hukum-etis. Terjemahan “membenarkan dirinya” mempertahankan bentuk leksikal sekaligus tidak memaksakan arti teknis teologis.
- issue: Cakupan πλησίον
  choice: Pertanyaan langsung “siapakah sesamaku?”
  alternative: “Siapa yang termasuk sesamaku?”
  rationale: Teks Yunani membiarkan cakupan istilah itu menjadi pokok persoalan. Teks utama mempertahankan pertanyaan langsung, sedangkan nuansa tentang siapa yang dianggap termasuk di dalamnya dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Namun” menandai kontras δέ, sedangkan “orang itu” memperjelas subjek tersirat tanpa mengulang jabatan tokoh dari konteks sebelumnya.
