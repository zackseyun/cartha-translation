  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: id
  text: “Siapakah dari ketiga orang ini yang menurutmu telah menjadi sesama bagi orang yang jatuh ke tangan para perampok?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapakah dari ketiga orang ini yang menurutmu merupakan sesama bagi orang yang jatuh ke tangan para perampok?” Bahasa Yunani secara lebih harfiah berbunyi “telah menjadi sesama,” yang menyoroti tindakan menjadi sesama bagi orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Siapakah
  rationale: Menanyakan orang mana dari kelompok tertentu; bentuk ini alami dalam bahasa Indonesia dan tetap merujuk kepada pribadi.
- source_word: τούτων τῶν τριῶν
  choice: dari ketiga orang ini
  rationale: Menyampaikan genitif partitif secara alami. Kata 'orang' tersirat oleh rujukan kepada tiga tokoh dan diperlukan agar ungkapan Indonesia jelas.
- source_word: πλησίον
  choice: sesama
  rationale: Dalam konteks etika kasih kepada sesama, 'sesama' merupakan padanan Indonesia yang alami untuk orang yang bertindak sebagai pihak yang dekat terhadap orang lain.
- source_word: δοκεῖ σοι
  choice: yang menurutmu
  rationale: Mengungkapkan penilaian pendengar dengan alami sambil mempertahankan unsur 'bagimu/menurutmu' dalam bahasa Yunani.
- source_word: γεγονέναι
  choice: telah menjadi
  rationale: Mempertahankan perfect infinitive γίνομαι dan gerak dari keadaan menuju tindakan relasional, bukan sekadar menyatakan identitas statis.
- source_word: τοῦ ἐμπεσόντος
  choice: bagi orang yang jatuh
  rationale: Partisip berartikel menunjuk kepada korban tertentu. 'Orang' wajar berdasarkan konteks dan tidak menentukan identitas lebih jauh.
- source_word: εἰς τοὺς λῃστάς
  choice: ke tangan para perampok
  rationale: Merupakan idiom Indonesia yang jelas untuk jatuh ke dalam kuasa para perampok; 'perampok' cocok dengan λῃσταί dalam konteks penyerangan dan perampasan.
theological_decisions:
- issue: Fokus etis pertanyaan dalam perumpamaan orang Samaria
  choice: Memakai 'telah menjadi sesama' untuk mempertahankan tindakan menjadi sesama.
  alternative: Memakai ungkapan statis 'adalah sesama'.
  rationale: γεγονέναι menggeser pertanyaan dari menentukan siapa yang termasuk sesama kepada siapa yang bertindak sebagai sesama. Terjemahan ini mempertahankan ketegangan dan daya etis teks tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan dibuat alami; 'telah menjadi sesama' sengaja dipertahankan meskipun sedikit lebih tidak lazim demi menjaga penekanan bahasa Yunani.
