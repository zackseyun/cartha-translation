  source_fidelity: 'Terjemahan secara akurat mencerminkan struktur dan makna Yunani: τίς ... τῶν τριῶν diterjemahkan sebagai “Siapakah dari ketiga orang ini”; δοκεῖ σοι tersampaikan melalui “menurutmu”; dan perfektum infinitif γεγονέναι dipertahankan dengan “telah menjadi.” Ungkapan “jatuh ke tangan para perampok” adalah idiom Indonesia yang wajar bagi εἰς τοὺς λῃστάς dan tidak mengubah makna kontekstualnya.'
