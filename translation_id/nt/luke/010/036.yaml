  terminology: “Sesama” merupakan padanan yang tepat dan konsisten untuk πλησίον dalam konteks ini. “Telah menjadi sesama” dengan baik mempertahankan penekanan γίνομαι—bukan sekadar siapa yang secara statis adalah sesama, melainkan siapa yang telah bertindak menjadi sesama. “Para perampok” tepat untuk λῃσταί.
