  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: id
  text: Orang itu menjawab, “Orang yang telah menunjukkan belas kasihan kepadanya.” Lalu Yesus berkata kepadanya, “Pergilah, dan kamu juga lakukanlah demikian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Orang yang telah menunjukkan belas kasihan kepadanya
  rationale: Ungkapan Yunani secara harfiah berarti orang yang melakukan belas kasihan terhadap dia. Dalam bahasa Indonesia, ‘menunjukkan belas kasihan kepadanya’ terdengar alami dan mempertahankan tindakan konkret yang dimaksud.
- source_word: Πορεύου
  choice: Pergilah
  rationale: Imperatif kini bentuk tunggal ini diterjemahkan sebagai perintah langsung dan wajar dalam bahasa Indonesia.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: dan lakukanlah hal yang sama
  rationale: σὺ memberi penekanan pada lawan bicara, tetapi dalam bahasa Indonesia penekanan itu sudah cukup tersampaikan melalui perintah langsung dalam konteks; ‘hal yang sama’ menyampaikan ὁμοίως secara alami tanpa mengubah maksud.
theological_decisions:
- issue: Sifat belas kasihan sebagai tindakan
  choice: menunjukkan belas kasihan
  alternative: berbelas kasihan
  rationale: Pilihan ini mempertahankan unsur ποιήσας, yakni belas kasihan yang diwujudkan melalui tindakan, tanpa menambahkan penafsiran doktrinal.
- issue: Penekanan pada σὺ dalam perintah Yesus
  choice: dan lakukanlah hal yang sama
  alternative: dan kamu juga, lakukanlah demikian
  rationale: Terjemahan utama mengutamakan kelancaran bahasa Indonesia. Alternatif lebih formal dapat menonjolkan kata ganti, tetapi terasa kurang alami dan tidak diperlukan untuk mempertahankan tuntutan pribadi dalam perintah tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami sambil menjaga urutan dan daya perintah teks Yunani.
