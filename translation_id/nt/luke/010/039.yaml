  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: id
  text: Ia mempunyai seorang saudara perempuan bernama Maria, yang juga duduk di dekat kaki Yesus[a] dan terus mendengarkan perkataan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah memuat “Tuhan” sebagai ganti “Yesus”.
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε ἦν ἀδελφὴ
  choice: Perempuan ini mempunyai seorang saudara perempuan
  rationale: Ungkapan datif kepunyaan merujuk kembali kepada Marta dan secara alami dinyatakan dalam bahasa Indonesia dengan verba “mempunyai”; “perempuan ini” mempertahankan daya tunjuk τῇδε.
- source_word: καλουμένη Μαριάμ
  choice: bernama Maria
  rationale: “Bernama” merupakan padanan Indonesia yang alami dan tepat untuk partisipel καλουμένη ketika memperkenalkan nama seseorang.
- source_word: ἣ καὶ παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: yang juga duduk dekat kaki
  rationale: Terjemahan ini mempertahankan tindakan mengambil tempat di dekat kaki seseorang sekaligus menyampaikan postur seorang murid tanpa memperluas maknanya menjadi penafsiran eksplisit.
- source_word: τοῦ Ἰησοῦ
  choice: Yesus
  rationale: Teks SBLGNT yang diberikan berbunyi Ἰησοῦ, sehingga nama pribadi “Yesus” dipakai dalam teks utama. Varian “Tuhan” dicatat dalam catatan kaki.
- source_word: ἤκουεν
  choice: sedang mendengarkan
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung; “sedang mendengarkan” menyatakan aspek progresif itu secara wajar.
- source_word: τὸν λόγον αὐτοῦ
  choice: perkataan-Nya
  rationale: Dalam konteks ini λόγος menunjuk pada perkataan yang disampaikan Yesus. “Perkataan-Nya” tetap dekat dengan istilah Yunani tanpa mempersempitnya menjadi “ajaran” atau “pesan”.
theological_decisions:
- issue: Bacaan tekstual dalam frasa tentang kaki tempat Maria duduk
  choice: Yesus
  alternative: Tuhan
  rationale: Sumber Yunani SBLGNT yang disediakan memakai Ἰησοῦ (“Yesus”). Bacaan κύριος (“Tuhan”) merupakan varian bermakna dan karena itu dipertahankan dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Bentuk “-Nya” dipakai untuk rujukan kepada Yesus sesuai kebiasaan ortografi Alkitab Indonesia; struktur kalimat tetap cukup dekat dengan susunan Yunani tanpa terasa kaku.
