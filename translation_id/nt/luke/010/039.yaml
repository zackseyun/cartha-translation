    rationale: τῇδε memang demonstratif yang menunjuk kembali kepada Marta, tetapi dalam bahasa Indonesia naratif rujukan yang sudah jelas lebih wajar dinyatakan dengan “Ia mempunyai,” tanpa kehilangan makna.
  - severity: low
    issue: Frasa “duduk dekat kaki Yesus” kurang alami.
    rationale: πρὸς τοὺς πόδας menyatakan posisi di dekat/di kaki Yesus. Dalam Indonesia baku, “duduk di dekat kaki Yesus” lebih lancar dan tetap tidak menambahkan penafsiran.
  - severity: low
    issue: Aspek berkelanjutan ἤκουεν dapat dinyatakan lebih alami.
    rationale: “Terus mendengarkan” secara idiomatis menyatakan tindakan yang berlangsung dalam latar naratif.
  revised_text: Ia mempunyai seorang saudara perempuan bernama Maria, yang juga duduk di dekat kaki Yesus[a] dan terus mendengarkan perkataan-Nya.
