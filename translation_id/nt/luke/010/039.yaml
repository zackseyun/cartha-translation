  source_fidelity: Teks utama dengan tepat mengikuti bacaan SBLGNT, τοῦ Ἰησοῦ, sebagai “Yesus,” dan catatan kaki secara benar mencatat varian “Tuhan.” Terjemahan mempertahankan relasi Maria sebagai saudara perempuan Marta, posisi duduk di kaki Yesus, dan aspek imperfek ἤκουεν.
  naturalness: “Perempuan ini mempunyai” terlalu demonstratif dan agak kaku dalam narasi Indonesia modern ketika acuannya sudah jelas dari ayat sebelumnya. Selain itu, “duduk dekat kaki” kurang idiomatis tanpa kata depan “di.” “Terus mendengarkan” menyampaikan tindakan imperfek yang berkelanjutan secara lebih alami daripada “sedang mendengarkan” dalam rangkaian naratif ini.
  terminology: “Maria,” “Yesus,” dan “perkataan-Nya” sesuai serta berregister Alkitab Indonesia yang baku. Kapitalisasi “-Nya” dipertahankan. Varian tekstual tidak boleh dipindahkan ke teks utama karena edisi sumber yang ditetapkan membaca Ἰησοῦ.
