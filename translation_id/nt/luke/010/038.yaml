  text: ⸂Ἐν δὲ⸃ τῷ πορεύεσθαι ⸀αὐτοὺς αὐτὸς εἰσῆλθεν εἰς κώμην τινά· γυνὴ δέ τις ὀνόματι Μάρθα ὑπεδέξατο ⸀αὐτὸν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: id
  text: Ketika mereka sedang dalam perjalanan, ia sendiri memasuki sebuah desa. Seorang perempuan bernama Marta menyambutnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menerimanya sebagai tamu.” Kata kerja Yunani ini menyiratkan penerimaan yang ramah terhadap seseorang sebagai tamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Ketika mereka sedang dalam perjalanan
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan tindakan yang berlangsung bersamaan. Bentuk jamak αὐτούς dipertahankan dengan “mereka,” sedangkan δέ cukup tercermin dalam kelanjutan narasi tanpa penanda tambahan yang terasa berat.
- source_word: αὐτὸς
  choice: ia sendiri
  rationale: Kata ganti yang bersifat menegaskan ini membedakan Yesus dari kelompok “mereka.” Ungkapan “ia sendiri” mempertahankan penekanan itu tanpa mengganti kata ganti dengan nama yang tidak tertulis dalam ayat.
- source_word: εἰσῆλθεν
  choice: memasuki
  rationale: Bentuk aoris εἰσέρχομαι secara langsung berarti masuk atau memasuki; “memasuki” wajar dengan objek tempat dalam bahasa Indonesia.
- source_word: εἰς κώμην τινά
  choice: sebuah desa
  rationale: κώμη menunjuk pada desa, sedangkan τινά memberi ketakrifan ringan. “Sebuah desa” menyampaikan ketidakspesifikan itu secara alami; “suatu desa tertentu” akan terdengar berlebihan.
- source_word: γυνὴ δέ τις
  choice: Seorang perempuan
  rationale: δέ memperkenalkan pelaku baru dan dapat diwujudkan melalui awal kalimat baru. τις sudah cukup dinyatakan oleh “seorang,” sementara nama Marta segera mengidentifikasi perempuan tersebut.
- source_word: ὀνόματι Μάρθα
  choice: bernama Marta
  rationale: Idiom datif ini paling alami diterjemahkan “bernama Marta.”
- source_word: ὑπεδέξατο
  choice: menyambutnya
  rationale: Kata kerja ini menyatakan menerima atau menyambut seseorang sebagai tamu. “Menyambut” mempertahankan nuansa keramahan tanpa menambahkan “ke rumahnya,” yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: αὐτὸν
  choice: -nya
  rationale: Akhiran pronominal ini secara alami merujuk kembali kepada Yesus sebagai objek langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang sederhana dan bermartabat. Kata ganti ditulis dengan huruf kecil karena kapitalisasi penghormatan tidak ditandai oleh teks Yunani. Ayat dibagi menjadi dua kalimat agar pengenalan Marta terdengar alami, tanpa mengubah hubungan naratifnya.
