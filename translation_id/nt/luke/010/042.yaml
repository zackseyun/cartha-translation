  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: id
  text: Namun, hanya sedikit hal yang diperlukan—atau satu saja.[a] Sebab, Maria telah memilih bagian yang baik,[b] yang tidak akan diambil darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hanya satu hal yang perlu.” Dalam konteks jamuan, bahasa Yunani ini juga dapat dipahami lebih khusus sebagai “hanya sedikit hidangan yang diperlukan—atau satu saja.”
    reason: alternative_reading
  - marker: b
    text: Atau, “porsi yang baik.” Kata “bagian” mungkin sengaja menggemakan baik porsi makanan maupun bagian kiasan dalam apa yang sungguh bernilai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Namun, hanya sedikit yang diperlukan—atau satu saja
  rationale: Ungkapan ini mempertahankan kontras ringkas antara 'sedikit' dan 'satu' serta tidak menentukan apakah yang dimaksud ialah beberapa hidangan, satu hidangan, atau satu hal yang sungguh perlu.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: bagian yang baik
  rationale: Menerjemahkan ἀγαθή secara langsung sebagai 'baik', bukan bentuk komparatif 'lebih baik'. 'Bagian' mempertahankan kemungkinan makna ganda μερίς sebagai porsi dalam konteks jamuan dan bagian kiasan dalam sesuatu yang bernilai.
- source_word: ἐξελέξατο
  choice: telah memilih
  rationale: Menyatakan pilihan Maria yang disengaja sekaligus menyoroti hasilnya yang tetap berlaku, sesuai dengan klausa berikutnya.
- source_word: οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: tidak akan diambil darinya
  rationale: Padanan Indonesia yang alami bagi bentuk pasif mendatang dan mempertahankan janji bahwa bagian itu tidak akan dirampas atau disingkirkan dari Maria.
theological_decisions:
- issue: Makna 'sedikit ... atau satu' dalam kaitannya dengan pelayanan Marta dan pilihan Maria
  choice: Mempertahankan pernyataan tentang apa yang diperlukan tanpa menetapkan apakah Yesus merujuk pada sedikit hidangan, satu hidangan, atau satu hal yang hakiki.
  alternative: Menerjemahkannya secara tegas sebagai 'hanya satu hal yang perlu' atau secara khusus sebagai 'hanya sedikit hidangan, bahkan satu saja'.
  rationale: Teks Yunani memungkinkan acuan praktis pada persiapan jamuan sekaligus kontras rohani yang lebih luas. Terjemahan tidak menyelesaikan ketegangan yang memang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada wajar dan bermartabat. Susunan kalimat dibuat ringkas untuk mencerminkan kepadatan teks Yunani, sementara tanda pisah mempertahankan jeda dan kontras pada frasa yang secara tekstual serta sintaktis sulit.
