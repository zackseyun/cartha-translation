  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: id
  text: 'Aku berkata kepadamu: Pada hari itu[b], bagi Sodom akan lebih dapat ditanggung[a] daripada bagi kota itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lebih ringan.” Kata Yunani ἀνεκτότερον dapat diterjemahkan dengan kedua cara ini.
    reason: lexical_alternative
  - marker: b
    text: “Hari itu” merujuk pada hari penghakiman ilahi; beberapa bagian paralel menyatakannya secara eksplisit.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Menerjemahkan pernyataan langsung dalam bentuk kini secara wajar dan khidmat; bentuk tunggal “kepadamu” sesuai dengan konteks rujukan kepada satu kota.
- source_word: Σοδόμοις
  choice: atas Sodom
  rationale: Nama tempat dipakai secara metonimis bagi penduduknya, sebagaimana dalam bahasa Yunani. Frasa ini menyatu secara alami dengan elipsis mengenai apa yang akan dialami pada hari penghakiman.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: pada hari itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tidak menambahkan kata “penghakiman” yang tidak terdapat secara eksplisit dalam ayat ini.
- source_word: ἀνεκτότερον
  choice: lebih ringan
  rationale: Dalam konteks perbandingan nasib pada penghakiman, ungkapan ini alami dan mudah dipahami sebagai keadaan yang lebih dapat ditanggung; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἔσται
  choice: akan
  rationale: Menandai waktu mendatang secara alami dalam konstruksi Indonesia; predikat yang tersirat dijelaskan sebagai “hukuman” demi kejelasan makna komparatif.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: daripada hukuman atas kota itu
  rationale: Mempertahankan perbandingan dan demonstratif “itu”; pengulangan “hukuman atas” membuat elipsis Yunani jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna “hari itu”
  choice: Mempertahankan “pada hari itu” dalam teks utama.
  alternative: “pada hari penghakiman”
  rationale: Konteks menunjukkan hari penghakiman ilahi, tetapi ayat ini sendiri hanya mengatakan “hari itu”; catatan kaki memberi penjelasan tanpa memasukkannya ke dalam teks.
- issue: Objek yang dinilai lebih ringan
  choice: Menambahkan “hukuman atas” sebagai pelengkap tersirat.
  alternative: “keadaan Sodom akan lebih tertanggungkan”
  rationale: Bahasa Yunani memakai ungkapan komparatif impersonal dan membiarkan hal yang ‘lebih dapat ditanggung’ tersirat. Dalam bahasa Indonesia, “hukuman atas” menyampaikan implikasi kontekstual secara alami tanpa menentukan bentuk atau lamanya hukuman.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Aku” dipakai dalam ucapan langsung Yesus, sesuai register Alkitab Indonesia yang umum. Tanda catatan ditempatkan setelah unsur yang dijelaskannya.
