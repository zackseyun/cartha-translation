id: LUK.10.15
reference: Luke 10:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: id
  text: Dan engkau, Kapernaum, apakah engkau akan ditinggikan sampai ke surga? Engkau akan diturunkan sampai ke Hades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “alam orang mati.” Yunani: “Hades,” bukan Gehena (“neraka”).'
    reason: Menjelaskan makna ᾅδης dan menjaga pembedaan leksikalnya dari Gehena.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: μὴ ... ὑψωθήσῃ
  choice: apakah engkau akan ditinggikan
  rationale: Konstruksi ini dipahami sebagai pertanyaan retoris yang mengharapkan jawaban negatif. Bentuk pasif dan makna kiasan ὑψόω dipertahankan dengan 'ditinggikan'.
- source_word: ἕως οὐρανοῦ
  choice: sampai ke surga
  rationale: ἕως dengan genitif menyatakan batas atau jangkauan; ungkapan ini mempertahankan gambaran vertikal yang berlawanan dengan turunnya ke Hades.
- source_word: ἕως τοῦ ᾅδου
  choice: sampai ke Hades
  rationale: ᾅδης menunjuk pada Hades, yakni alam orang mati, dan tidak disamakan begitu saja dengan Gehena. Transliterasi menjaga pembedaan leksikal tersebut.
- source_word: καταβιβασθήσῃ
  choice: engkau akan diturunkan
  rationale: Bentuk pasif dipertahankan dan menyampaikan bahwa Kapernaum akan dibuat turun, dengan nuansa perendahan atau penghakiman.
theological_decisions:
- issue: Penerjemahan ᾅδης
  choice: Hades
  alternative: alam orang mati; neraka
  rationale: '''Hades'' mempertahankan istilah Yunani dan membedakannya dari Gehena, tanpa memasukkan pengertian teologis tentang ''neraka'' yang lebih khusus. Catatan kaki menjelaskan maknanya.'
- issue: Bentuk μὴ ... ὑψωθήσῃ
  choice: 'pertanyaan retoris: ''apakah engkau akan ditinggikan'''
  alternative: 'pernyataan: ''engkau tidak akan ditinggikan'''
  rationale: Pertanyaan retoris mempertahankan bentuk dan daya retoris teks Yunani sekaligus menyiratkan jawaban negatif tanpa mengubahnya menjadi pernyataan langsung.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Kata ganti 'engkau' dipakai karena kota Kapernaum disapa secara langsung dan personifikatif. Kesejajaran 'sampai ke surga' dan 'sampai ke Hades' dipertahankan.
