  to: Namun, Marta sibuk dengan banyak pekerjaan untuk melayani. Ia datang mendekat dan berkata, “Tuhan, tidakkah Engkau peduli bahwa saudariku telah meninggalkan aku seorang diri untuk melayani? Jadi, suruhlah dia membantu aku.”
  rationale: Revisi terutama memperjelas bahwa pekerjaan Marta adalah pelayanan praktis dalam konteks rumah tangga, tanpa memakai istilah yang cenderung bernuansa pelayanan institusional. Kata “datang mendekat” menerjemahkan ἐπιστᾶσα tanpa menambahkan objek eksplisit yang tidak disebut dalam ayat. Bentuk “telah meninggalkan” mencerminkan κατέλειπεν secara alami dalam keluhan Marta.
