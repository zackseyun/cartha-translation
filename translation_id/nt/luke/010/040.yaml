id: LUK.10.40
reference: Luke 10:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: id
  text: Namun, Marta sibuk dengan banyak pekerjaan untuk melayani. Ia datang mendekat dan berkata, “Tuhan, tidakkah Engkau peduli bahwa saudariku telah meninggalkan aku seorang diri untuk melayani? Jadi, suruhlah dia membantu aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: tersita perhatiannya
  rationale: Bentuk imperfek menyatakan keadaan yang sedang berlangsung, yakni perhatian Marta terus tertarik ke berbagai tugas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan perhatian Maria.
- source_word: περὶ πολλὴν διακονίαν
  choice: oleh banyaknya pekerjaan pelayanan
  rationale: Dalam konteks rumah tangga, διακονία menunjuk pada pekerjaan praktis melayani, bukan jabatan atau pelayanan formal. Pilihan ini mempertahankan keluasan ungkapan Yunani tanpa mempersempitnya menjadi sekadar persiapan makanan.
- source_word: ἐπιστᾶσα
  choice: Ia mendekati Yesus
  rationale: Partisip ini menggambarkan Marta datang mendekat sebelum berbicara. Objek 'Yesus' dibuat eksplisit secara wajar dalam bahasa Indonesia agar rujukannya jelas.
- source_word: Κύριε
  choice: Tuhan
  rationale: Ini merupakan sapaan hormat kepada Yesus dan sejalan dengan pemakaian κύριος dalam Lukas, sambil tetap memungkinkan bobot kristologis yang lebih luas.
- source_word: οὐ μέλει σοι
  choice: tidakkah Engkau peduli
  rationale: Ungkapan Yunani menanyakan apakah hal itu menjadi perhatian Yesus. 'Tidakkah Engkau peduli' alami, langsung, dan menangkap nada keluhan Marta.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: membiarkan aku melayani seorang diri
  rationale: Pilihan ini memuat baik gagasan ditinggalkan atau dibiarkan maupun penekanan μόνην, tanpa memakai kata yang terlalu keras seperti 'menelantarkan'.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Jadi, suruhlah dia
  rationale: Imperatifnya meminta Yesus memberi perintah kepada Maria, sehingga 'suruhlah' lebih tepat daripada sekadar 'katakanlah'. 'Jadi' mempertahankan daya simpulan οὖν.
- source_word: συναντιλάβηται
  choice: membantu aku
  rationale: Kata kerja ini berarti ikut mengambil bagian untuk menolong. 'Membantu aku' adalah padanan Indonesia yang jelas dan idiomatis; unsur kerja bersama tersirat dari konteks.
theological_decisions:
- issue: Sapaan κύριος kepada Yesus
  choice: Tuhan
  alternative: Tuan atau Guru
  rationale: '''Tuhan'' merupakan padanan standar yang mempertahankan sapaan hormat Marta sekaligus tidak menutup kemungkinan makna kristologis dalam narasi Lukas.'
- issue: Nada οὐ μέλει σοι
  choice: tidakkah Engkau peduli
  alternative: tidakkah hal ini menjadi perhatian-Mu
  rationale: Pilihan utama mempertahankan ketajaman pertanyaan Marta tanpa menambahkan penilaian teologis bahwa Yesus benar-benar tidak peduli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Tidak ada catatan kaki karena alternatif leksikal utama tidak diperlukan untuk memahami ambiguitas teks.
