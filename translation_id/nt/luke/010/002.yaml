  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Tuaian memang banyak, tetapi pekerja sedikit. Karena itu, berdoalah kepada Tuhan yang memiliki tuaian itu agar Ia mengutus[a] pekerja ke dalam tuaian-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengusir” atau “mendorong keluar”; kata Yunani yang digunakan dapat mengandung nuansa yang lebih kuat daripada sekadar “mengutus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ia berkata
  rationale: Bentuk imperfek berfungsi sebagai pengantar perkataan dalam narasi; bentuk lampau sederhana paling wajar dalam bahasa Indonesia tanpa kehilangan makna penting.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan; dalam bahasa Indonesia, kelanjutan narasi sudah jelas tanpa konjungsi tambahan.
- source_word: θερισμός
  choice: tuaian
  rationale: Mempertahankan gambaran pertanian sekaligus pemakaian metaforisnya.
- source_word: πολύς
  choice: banyak
  rationale: Padanan langsung dan alami untuk jumlah tuaian yang besar.
- source_word: ἐργάται
  choice: pekerja-pekerja
  rationale: Istilah modern dan mudah dipahami bagi orang-orang yang mengerjakan penuaian; bentuk ulang menegaskan jamak.
- source_word: ὀλίγοι
  choice: hanya sedikit
  rationale: Menyatakan pertentangan jumlah secara alami dan jelas; 'hanya' menonjolkan kekurangan pekerja tanpa menambah gagasan baru.
- source_word: δεήθητε
  choice: berdoalah
  rationale: Imperatif ini menyatakan permohonan sungguh-sungguh; konteks permohonan kepada Tuhan mendukung pilihan 'berdoalah'.
- source_word: οὖν
  choice: Karena itu
  rationale: Menunjukkan kesimpulan atau tindakan yang harus diambil berdasarkan keadaan yang baru disebutkan.
- source_word: κυρίου τοῦ θερισμοῦ
  choice: Tuhan pemilik tuaian
  rationale: Mempertahankan gelar 'Tuhan' serta gagasan bahwa tuaian berada di bawah kepemilikan dan wewenang-Nya, dengan susunan yang ringkas dalam bahasa Indonesia.
- source_word: ὅπως
  choice: agar
  rationale: Secara alami memperkenalkan isi sekaligus tujuan doa.
- source_word: ἐκβάλῃ
  choice: mengutus
  rationale: Dalam konteks ini menunjuk pada tindakan mengirim pekerja ke tempat penuaian. Nuansa verba Yunani yang dapat lebih kuat daripada sekadar 'mengutus' dipertahankan dalam catatan kaki.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: ke dalam tuaian-Nya
  rationale: Mengikuti gerak yang dinyatakan oleh εἰς dan mempertahankan metafora serta unsur kepunyaan tanpa menambahkan kata 'ladang' yang tidak eksplisit.
theological_decisions:
- issue: Rujukan dan daya ungkap gelar 'Tuhan pemilik tuaian'
  choice: Gelar metaforis dipertahankan tanpa menjelaskan secara eksplisit siapa rujukannya.
  alternative: Menjelaskannya sebagai Allah yang memiliki dan mengarahkan misi, atau sebagai penegasan tersirat tentang wewenang ilahi Yesus.
  rationale: Ayat ini menyatakan adanya Tuhan yang memiliki tuaian dan mengutus para pekerja, tetapi tidak menguraikan implikasi kristologisnya. Tidak menambahkan penjelasan menjaga ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Metafora tuaian dipertahankan, sedangkan struktur kalimat disesuaikan agar alami bagi pembaca umum.
