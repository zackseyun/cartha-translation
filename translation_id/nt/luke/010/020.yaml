base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: id
  text: Namun, janganlah bersukacita karena roh-roh itu tunduk kepada kalian,[a] tetapi bersukacitalah karena nama-nama kalian telah tertulis di surga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Konteks menunjukkan bahwa roh-roh ini adalah makhluk rohani yang memusuhi; teks Yunani sendiri hanya menyebutnya “roh-roh”.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Yunani, kata yang diterjemahkan “surga” berbentuk jamak; “di surga” adalah ungkapan yang lebih alami dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai koreksi yang tegas terhadap alasan para murid bersukacita, dengan bentuk yang alami dalam bahasa Indonesia modern.
- source_word: ἐν τούτῳ μὴ χαίρετε
  choice: janganlah bersukacita karena
  rationale: Dalam konteks ini, ungkapan Yunani menunjuk pada dasar atau alasan sukacita; 'karena' lebih alami daripada terjemahan harfiah 'dalam hal ini'.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: janganlah bersukacita ... tetapi bersukacitalah
  rationale: Pengulangan verba yang sama mempertahankan kontras retoris pada teks Yunani.
- source_word: τὰ πνεύματα
  choice: roh-roh itu
  rationale: Mempertahankan istilah umum 'roh-roh' serta artikelnya tanpa mempersempitnya menjadi 'roh-roh jahat' atau 'setan-setan'; konteks menunjukkan bahwa yang dimaksud ialah makhluk rohani yang memusuhi.
- source_word: ὑμῖν ὑποτάσσεται
  choice: tunduk kepadamu
  rationale: Ungkapan Indonesia yang jelas dan wajar untuk keadaan berada di bawah kewenangan mereka.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: namamu
  rationale: Kata ganti sumber berbentuk jamak dan ditujukan kepada kelompok; bahasa Indonesia lazim memakai '-mu' tanpa membedakan tunggal dan jamak. Maknanya ialah nama setiap orang di antara para murid.
- source_word: ἐγγέγραπται
  choice: telah tertulis
  rationale: Menyampaikan tindakan yang sudah terjadi beserta hasilnya yang tetap berlaku, sesuai aspek perfektum pasif Yunani.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: di surga
  rationale: Ini merupakan padanan idiomatis Indonesia untuk ungkapan Yunani berbentuk jamak 'di langit-langit'; dalam konteks ini ungkapan tersebut menunjuk pada ranah kediaman ilahi, bukan langit fisik.
theological_decisions:
- issue: Hakikat roh-roh
  choice: roh-roh itu
  alternative: roh-roh jahat; setan-setan
  rationale: Konteks mengisyaratkan makhluk rohani yang memusuhi, tetapi πνεύματα sendiri hanya berarti 'roh-roh'. Terjemahan utama mempertahankan keluasan leksikal tersebut.
- issue: Lokasi pencatatan nama
  choice: di surga
  alternative: di langit-langit
  rationale: Bentuk Yunani adalah jamak, tetapi ungkapan idiomatis Indonesia 'di surga' menyampaikan rujukan teologisnya secara alami tanpa menimbulkan kesan beberapa surga yang terpisah.
- issue: Daya aspek perfektum pasif
  choice: telah tertulis
  alternative: tertulis; telah dicatat
  rationale: Pilihan ini mempertahankan gagasan tindakan yang telah selesai dengan keadaan hasil yang masih berlaku, tanpa menentukan pelaku yang tidak disebutkan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel '-lah' mempertahankan daya imperatif sekaligus ritme kontras. Tanda koma ditempatkan setelah klausa pertama sebelum catatan kaki agar marker melekat pada frasa yang dijelaskan.
