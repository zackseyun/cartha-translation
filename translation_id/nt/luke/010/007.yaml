  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: id
  text: Tetaplah di rumah itu sambil makan dan minum apa yang mereka sediakan, karena seorang pekerja layak menerima upahnya.[a] Jangan berpindah dari satu rumah ke rumah lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang pekerja pantas memperoleh upahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: di rumah itu
  rationale: Frasa datif ini merujuk kembali kepada rumah yang menerima para utusan. Dalam bahasa Indonesia, “rumah itu” menyampaikan daya anaforisnya secara alami; perintah penutup menegaskan bahwa mereka harus tetap di tempat yang sama.
- source_word: μένετε
  choice: Tinggallah
  rationale: Imperatif kini menuntut tindakan yang berkelanjutan. “Tinggallah” merupakan perintah yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: makan dan minumlah apa yang mereka sediakan
  rationale: Partisipanya menyatakan kegiatan yang berlangsung selama mereka tinggal. Bentuk imperatif koordinatif lebih alami dalam bahasa Indonesia, sedangkan “apa yang mereka sediakan” menyampaikan idiom τὰ παρ’ αὐτῶν tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: karena seorang pekerja layak menerima upahnya
  rationale: ἄξιος menyatakan kelayakan, dan μισθός dalam konteks ini berarti imbalan atas pekerjaan. Penambahan “menerima” diperlukan agar ungkapan tersebut alami dalam bahasa Indonesia dan tidak mengubah hubungan maknanya.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Jangan berpindah-pindah dari satu rumah ke rumah lain
  rationale: Larangan ini mengacu pada perpindahan tempat menginap antarrumah. Reduplikasi “berpindah-pindah” secara alami mengungkapkan kebiasaan pergi dari satu tempat ke tempat lain.
theological_decisions:
- issue: Pronomina maskulin dalam τοῦ μισθοῦ αὐτοῦ
  choice: upahnya
  alternative: upah yang menjadi hak pekerja itu
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina posesif enklitik -nya. Bentuk “upahnya” tetap mempertahankan acuan tunggal kepada ὁ ἐργάτης tanpa memasukkan gender yang tidak dapat diungkapkan secara alami dalam konstruksi posesif ini.
- issue: Nuansa kelayakan versus hak menerima upah
  choice: layak menerima upahnya
  alternative: berhak atas upahnya
  rationale: ἄξιος secara langsung menyatakan kelayakan. “Layak menerima” mempertahankan nuansa itu, sementara “berhak” dapat memberi penekanan yuridis yang lebih kuat daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang jelas dan wajar. “Tinggallah” serta “Jangan berpindah-pindah” mudah dipahami pembaca umum tanpa kehilangan martabat teks. Penanda catatan kaki ditempatkan sesudah klausa tentang upah, yaitu bagian yang dijelaskan oleh catatan.
