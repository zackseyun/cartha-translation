  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: id
  text: Sembuhkanlah orang-orang sakit di kota itu, dan katakanlah kepada mereka, “Kerajaan Allah sudah mendekat kepada kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah datang menghampiri kalian.”
    reason: Alternatif ini menonjolkan unsur kedatangan atau gerak dalam ἤγγικεν, walaupun teks utama lebih ringkas dan alami.
lexical_decisions:
- source_word: θεραπεύετε
  choice: Sembuhkanlah
  rationale: Bentuk imperatif kini menyerukan tindakan pelayanan yang berkelanjutan. Dalam konteks orang sakit, “sembuhkanlah” merupakan padanan Indonesia yang paling langsung dan wajar.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: orang-orang sakit di kota itu
  rationale: Karena θεραπεύετε mengarahkan maknanya pada penyakit, ἀσθενεῖς diterjemahkan “orang-orang sakit,” bukan sekadar “orang-orang lemah.” Kata ganti αὐτῇ merujuk pada kota yang disebut dalam ayat sebelumnya, sehingga acuannya diperjelas secara alami.
- source_word: λέγετε αὐτοῖς
  choice: katakanlah kepada mereka
  rationale: Terjemahan ini mempertahankan bentuk perintah dan kesederhanaan ungkapan Yunani.
- source_word: Ἤγγικεν
  choice: sudah mendekat
  rationale: Bentuk perfek menyatakan bahwa tindakan mendekat telah terjadi dan hasilnya tetap relevan sekarang. “Sudah mendekat” alami dalam bahasa Indonesia serta tidak mereduksinya menjadi sekadar keadaan statis “sudah dekat.”
- source_word: ἐφ’ ὑμᾶς
  choice: kepada kalian
  rationale: Dalam konstruksi bersama ἐγγίζω, frasa ini menyatakan gerak atau kedatangan dalam hubungan dengan para pendengar. “Kalian” memperlihatkan bahwa pronomina Yunani berbentuk jamak.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini merupakan ungkapan Alkitab yang baku dan mudah dipahami, serta tetap mencakup baik pemerintahan Allah maupun ranah kerajaan-Nya tanpa mempersempit maknanya.
theological_decisions:
- issue: Makna pemberitaan tentang dekatnya Kerajaan Allah
  choice: Kerajaan Allah diberitakan sudah mendekat kepada para pendengar, dengan dampak yang berlaku sekarang.
  alternative: Kerajaan Allah sudah sepenuhnya hadir sekarang; atau Kerajaan Allah hanya akan hadir pada masa depan yang dekat.
  rationale: Bentuk perfek ἤγγικεν menyampaikan pendekatan yang telah terjadi dan relevansi masa kini, tetapi ayat ini sendiri tidak menuntaskan ketegangan antara kehadiran sekarang dan penggenapan pada masa depan. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kota itu” memperjelas rujukan pronomina feminin Yunani kepada kota pada konteks sebelumnya; “kalian” dipilih untuk menandai bentuk jamak ὑμᾶς.
