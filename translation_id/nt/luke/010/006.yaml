  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: id
  text: Dan jika di situ ada orang yang menerima damai[a], damai sejahtera kalian akan tinggal padanya; tetapi jika tidak, damai itu akan kembali kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak damai sejahtera”; sebuah ungkapan yang menunjuk kepada orang yang menerima atau terbuka terhadap damai yang disampaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: orang yang cinta damai
  rationale: Ungkapan bergaya Semitis ini secara harfiah berarti “anak damai sejahtera” dan menunjuk kepada orang yang bercirikan damai atau terbuka menerima salam dan berita damai. Terjemahan idiomatis dipilih dalam teks utama agar langsung dipahami pembaca Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἐπαναπαήσεται
  choice: akan tinggal pada
  rationale: Kata ini menggambarkan damai yang menetap atau berdiam pada penerimanya. “Akan tinggal pada” mempertahankan gambaran tersebut dengan bahasa Indonesia yang wajar.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: damai sejahtera kalian
  rationale: Frasa ini merujuk pada damai yang disampaikan para murid dalam salam mereka. Bentuk posesif langsung dipertahankan tanpa membatasinya hanya sebagai rumusan salam.
- source_word: μήγε
  choice: jika tidak
  rationale: Ungkapan bersyarat negatif ini paling alami diterjemahkan “jika tidak”; penegasannya sudah cukup tersampaikan oleh pertentangan dalam kalimat.
- source_word: ἀνακάμψει
  choice: akan kembali
  rationale: Kata kerja ini berarti berbalik atau kembali. Pilihan ini secara alami menggambarkan damai yang tidak menetap pada penerima lalu kembali kepada para murid.
- source_word: ἐφ’ ὑμᾶς
  choice: kepada kalian
  rationale: Walaupun preposisinya secara harfiah dapat berarti “atas”, bersama kata “kembali” bahasa Indonesia secara wajar memakai “kepada”.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Dan jika di situ ada
  rationale: Terjemahan ini mempertahankan kata penghubung, syarat, dan penekanan tempat dalam susunan Indonesia yang alami.
theological_decisions:
- issue: Cara menerjemahkan idiom maskulin υἱὸς εἰρήνης
  choice: orang yang cinta damai
  alternative: anak damai sejahtera
  rationale: Dalam bahasa Yunani, bentuk maskulin tunggal ini merupakan idiom Semitis, bukan penegasan bahwa penerimanya harus laki-laki atau bahwa ia secara harfiah merupakan “anak” dari damai. Terjemahan idiomatis menyampaikan maknanya kepada pembaca Indonesia tanpa menutup kemungkinan nuansa bahwa orang itu bercirikan atau terbuka terhadap damai; bentuk harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk menyatakan bahwa kata ganti Yunani berbentuk jamak. “Damai sejahtera” mempertahankan bobot salam dan berkat εἰρήνη yang lebih luas daripada sekadar keadaan tanpa konflik.
