  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: id
  text: 'Sebab Aku berkata kepada kalian: banyak nabi dan raja ingin melihat apa yang kalian lihat, tetapi tidak melihatnya, dan ingin mendengar apa yang kalian dengar, tetapi tidak mendengarnya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rindu melihat apa yang kalian lihat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sebab Aku berkata kepada kalian
  rationale: λέγω dengan datif ὑμῖν secara alami berarti “Aku berkata kepada kalian”; γάρ diterjemahkan “Sebab” untuk mempertahankan hubungan penjelasan dengan ucapan berkat sebelumnya.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: banyak nabi dan raja
  rationale: Terjemahan langsung yang mempertahankan kategori historis dan tidak memperluas βασιλεῖς menjadi “penguasa”.
- source_word: ἠθέλησαν
  choice: ingin
  rationale: θέλω menyatakan kehendak atau hasrat. “Ingin” alami dalam bahasa Indonesia modern dan tidak melebih-lebihkan intensitas emosionalnya.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: melihat apa yang kalian lihat
  rationale: Mempertahankan kesejajaran tindakan melihat dan bentuk relatif yang ringkas; ὑμεῖς tercermin dalam “kalian” tanpa tambahan penekanan.
- source_word: καὶ οὐκ εἶδαν
  choice: tetapi tidak melihatnya
  rationale: Konjungsi καί memiliki daya kontras dalam konteks ini dan wajar diterjemahkan “tetapi”; akhiran “-nya” menyatakan objek yang tersirat dengan alami.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: mendengar apa yang kalian dengar, tetapi tidak mendengarnya
  rationale: Mempertahankan kesejajaran dengan bagian tentang melihat serta fakta historis yang dinyatakan oleh aoris.
theological_decisions:
- issue: Identitas “nabi dan raja”
  choice: Mempertahankan kategori “nabi dan raja” tanpa penjelasan tambahan.
  alternative: “nabi dan para penguasa” atau “nabi dan raja zaman dahulu”
  rationale: Teks membandingkan para murid dengan tokoh-tokoh masa lampau yang menantikan penyataan Allah, tetapi tidak secara eksplisit menambahkan “zaman dahulu” atau memperluas “raja” menjadi “penguasa”.
- issue: Kadar hasrat dalam ἠθέλησαν
  choice: “ingin” dalam teks utama
  alternative: “rindu” atau “sangat ingin”
  rationale: “Ingin” menjaga keluasan makna θέλω; catatan kaki menyajikan kemungkinan nuansa hasrat yang lebih kuat tanpa menetapkannya sebagai satu-satunya pembacaan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai bahwa ὑμῖν dan ὑμεῖς berbentuk jamak. Pengulangan “melihat” dan “mendengar” dipertahankan demi kesejajaran retoris.
