  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: id
  text: 'Bahkan debu dari kota kalian yang melekat pada kaki kami pun kami seka dari kaki kami terhadap kalian.[a][b] Namun, ketahuilah ini: Kerajaan Allah telah mendekat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “debu yang melekat pada kami dari kota kalian, pada kaki”; susunan bahasa Yunani bersifat idiomatis dan menggambarkan debu dari kota itu melekat pada kaki para utusan.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani di sini secara khusus berarti “menyeka hingga lepas”; banyak terjemahan memakai “mengebaskan” dalam konteks serupa.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “telah datang mendekat.” Bentuk perfek bahasa Yunani menunjukkan bahwa Kerajaan Allah telah mendekat dengan arti yang tetap berlaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: debu
  rationale: Kata ini secara khusus menunjuk pada debu, bukan tanah atau kotoran secara umum, dan mempertahankan makna simbolis tindakan tersebut.
- source_word: κολληθέντα
  choice: melekat
  rationale: Partisip ini menggambarkan debu yang menempel erat; “melekat” alami dan tepat dalam bahasa Indonesia.
- source_word: εἰς τοὺς πόδας
  choice: pada kaki kami
  rationale: Ungkapan Yunani ini secara idiomatis menerangkan tempat debu itu melekat. Penyebutan “kami” dibuat eksplisit dari konteks orang pertama jamak.
- source_word: ἀπομασσόμεθα
  choice: kami seka
  rationale: Verba ini secara khusus berarti menyeka atau mengusap hingga lepas, bukan sekadar mengebaskan.
- source_word: ὑμῖν
  choice: sebagai tanda terhadap kalian
  rationale: Datif ini dalam konteks tindakan simbolis menyampaikan arah kesaksian atau penghakiman terhadap warga yang menolak, tetapi bahasa terjemahan tidak memperluasnya menjadi rumusan doktrinal.
- source_word: πλήν
  choice: Namun
  rationale: Kata penghubung ini menandai penegasan yang tetap berlaku meskipun tindakan simbolis sebelumnya dilakukan.
- source_word: γινώσκετε
  choice: ketahuilah
  rationale: Imperatif kini menuntut agar para pendengar mengakui kenyataan yang dinyatakan.
- source_word: ἤγγικεν
  choice: sudah mendekat
  rationale: Bentuk perfek menyatakan bahwa kedekatan itu telah terjadi dan tetap relevan; “sudah mendekat” menyampaikan hasil kini secara alami.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Ini adalah padanan baku, jelas, dan tetap dapat mencakup baik ranah maupun pemerintahan Allah tanpa mempersempit ambiguitas ungkapan sumber.
theological_decisions:
- issue: Daya tindakan menyeka debu
  choice: Tindakan simbolis yang diarahkan terhadap kota yang menolak
  alternative: Tindakan kebersihan atau kebiasaan perjalanan semata
  rationale: Datif ὑμῖν dan konteks pengutusan menunjukkan tindakan kesaksian atau penghakiman. Frasa “sebagai tanda terhadap kalian” mempertahankan daya itu tanpa menjelaskan lebih dari teks.
- issue: Makna kedekatan Kerajaan Allah
  choice: Kerajaan Allah telah mendekat dan kedekatan itu tetap berlaku
  alternative: Kerajaan hanya akan segera tiba, atau telah sepenuhnya mencapai penggenapan akhir
  rationale: Bentuk perfek ἤγγικεν menyatakan kedekatan yang sudah terjadi dengan akibat berkelanjutan, tanpa meniadakan ketegangan antara kehadiran dan penggenapan akhir.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk mempertahankan bentuk orang kedua jamak, sedangkan partikel “pun” menonjolkan bahkan debu sebagai bagian dari tindakan simbolis.
