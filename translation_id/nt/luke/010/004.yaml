  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: id
  text: Jangan membawa kantong uang, tas bekal,[a] atau sandal, dan jangan memberi salam kepada siapa pun dalam perjalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kantong perjalanan” atau “ransel.” Tas ini digunakan untuk membawa bekal dalam perjalanan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya kemungkinan bukan melarang sopan santun biasa, melainkan menekankan keadaan mendesak yang tidak memberi waktu untuk pertukaran salam yang panjang menurut kebiasaan masyarakat pada masa itu.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: membawa
  rationale: Dalam konteks petunjuk perjalanan, kata ini secara alami berarti membawa barang atau perbekalan.
- source_word: βαλλάντιον
  choice: kantong uang
  rationale: Menunjuk pada kantong tempat menyimpan uang; padanan ini jelas dan tidak menimbulkan asosiasi modern yang keliru.
- source_word: πήραν
  choice: tas bekal
  rationale: Menunjuk pada tas yang digunakan untuk membawa bekal dalam perjalanan; padanan ini menyampaikan fungsi benda tersebut dengan wajar.
- source_word: ὑποδήματα
  choice: sandal
  rationale: Menunjuk pada alas kaki, dan dalam latar Mediterania kuno kemungkinan besar berupa sandal.
- source_word: μηδένα
  choice: siapa pun
  rationale: Dalam konstruksi negatif bahasa Indonesia, 'jangan ... kepada siapa pun' merupakan padanan alami bagi larangan yang mencakup semua orang.
- source_word: κατὰ τὴν ὁδόν
  choice: di sepanjang jalan
  rationale: Mempertahankan gambaran konkret tentang perjalanan sambil terdengar alami dalam bahasa Indonesia.
- source_word: ἀσπάσησθε
  choice: memberi salam
  rationale: Mengungkapkan tindakan menyapa atau bertukar salam dengan jelas dan ringkas.
theological_decisions:
- issue: Daya larangan untuk memberi salam selama perjalanan
  choice: 'Dipertahankan sebagai larangan langsung: ''jangan memberi salam kepada siapa pun di sepanjang jalan.'''
  alternative: Jangan berhenti atau tertunda untuk bertukar salam dalam perjalanan.
  rationale: Teks Yunani menyatakan larangan secara langsung. Terjemahan utama tidak melunakkan atau memperluasnya, sedangkan kemungkinan nuansa budaya mengenai salam yang memakan waktu dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan larangan dipertahankan ringkas. Penanda catatan kaki ditempatkan pada istilah atau klausa yang benar-benar dijelaskan.
