  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: id
  text: Akan tetapi, pada penghakiman, keadaan Tirus dan Sidon akan lebih dapat ditanggung daripada keadaan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagi Tirus dan Sidon hal itu akan lebih ringan daripada bagi kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai pertentangan kuat dengan kecaman sebelumnya secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: bagi Tirus dan Sidon
  rationale: Bentuk datif menyatakan pihak yang mengalami keadaan dalam perbandingan; 'bagi' alami dalam bahasa Indonesia.
- source_word: ἀνεκτότερον
  choice: hukuman ... akan lebih ringan
  rationale: Ungkapan idiomatis ini menyampaikan bahwa keadaan Tirus dan Sidon dalam penghakiman akan lebih dapat ditanggung, tanpa menyiratkan bahwa mereka bebas dari hukuman.
- source_word: ἔσται
  choice: akan
  rationale: Menyampaikan bentuk waktu mendatang dari kopula Yunani secara wajar dalam susunan kalimat Indonesia.
- source_word: ἐν τῇ κρίσει
  choice: pada hari penghakiman
  rationale: Mengungkapkan latar peristiwa penghakiman secara jelas dan idiomatis; 'hari' tersirat oleh konteks eskatologis, meskipun tidak dinyatakan sebagai nomina tersendiri dalam bahasa Yunani.
- source_word: ἢ ὑμῖν
  choice: daripada bagi kalian
  rationale: Melengkapi perbandingan dan mempertahankan bentuk jamak orang kedua; 'kalian' memperjelas bahwa teguran ditujukan kepada kelompok.
theological_decisions:
- issue: Sifat κρίσις dalam konteks
  choice: penghakiman akhir yang akan datang
  alternative: penghakiman dalam arti umum
  rationale: Perbandingan nasib kota-kota yang tidak bertobat dengan Tirus dan Sidon sangat mendukung acuan eskatologis, tetapi terjemahan tidak menjelaskan lebih jauh siapa hakimnya atau rincian hukumannya.
- issue: Makna komparatif ἀνεκτότερον
  choice: tingkat hukuman yang lebih ringan
  alternative: keadaan yang lebih dapat ditanggung
  rationale: Susunan Indonesia yang dipilih menyampaikan perbandingan tingkat beratnya keadaan dalam penghakiman tanpa menghapus kenyataan bahwa kedua pihak tetap menghadapi penghakiman.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk jamak ὑμῖν. Susunan utama dibuat idiomatis, sedangkan catatan kaki mempertahankan bentuk predikatif yang lebih dekat dengan teks Yunani.
