source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: id
  text: Lihatlah, seorang ahli Taurat berdiri untuk menguji Yesus, katanya, “Guru, apa yang harus kulakukan untuk mewarisi hidup kekal?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Lalu lihatlah
  rationale: Mempertahankan fungsi penanda wacana sekaligus daya penarik perhatian dari ἰδού dalam bahasa Indonesia yang jelas dan wajar.
- source_word: νομικός τις
  choice: seorang ahli Taurat
  rationale: Dalam konteks Yahudi abad pertama, νομικός adalah orang yang ahli dalam hukum Musa, bukan pengacara sipil modern. 'Ahli Taurat' merupakan sebutan Indonesia yang alami dan tepat secara konteks.
- source_word: ἀνέστη
  choice: berdiri
  rationale: Menyampaikan tindakan bangkit berdiri secara langsung dan alami dalam adegan ini.
- source_word: ἐκπειράζων αὐτὸν
  choice: untuk menguji Yesus
  rationale: Mengungkapkan maksud tindakan tersebut dan mempertahankan nuansa pengujian tanpa mempersempitnya menjadi godaan untuk berbuat dosa. Nama 'Yesus' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: λέγων
  choice: Ia bertanya
  rationale: Partisip Yunani dialihkan menjadi klausa utama yang alami; karena ucapan berikut berbentuk pertanyaan, 'bertanya' lebih lancar daripada 'berkata'.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Padanan modern dan langsung bagi sapaan Διδάσκαλε.
- source_word: τί ποιήσας
  choice: apa yang harus kulakukan
  rationale: Menangkap fungsi partisip yang menyatakan tindakan atau prasyarat secara idiomatis, tanpa menghilangkan kerangka pertanyaan tokoh mengenai apa yang perlu ia lakukan.
- source_word: ζωὴν αἰώνιον
  choice: hidup kekal
  rationale: Padanan baku, alami, dan tepat bagi ungkapan Yunani ini.
- source_word: κληρονομήσω
  choice: mewarisi
  rationale: Mempertahankan metafora warisan yang terdapat dalam teks Yunani dan penting bagi ketegangan makna pertanyaan tersebut.
theological_decisions:
- issue: Makna νομικός dalam konteks Yahudi Bait Kedua
  choice: ahli Taurat, yakni seorang ahli hukum Musa
  alternative: ahli hukum; pengajar hukum Taurat
  rationale: Pilihan ini mencegah pembaca memahami tokoh itu sebagai pengacara sipil modern serta sesuai dengan lingkungan hukum-keagamaan Yahudi.
- issue: Daya ungkapan τί ποιήσας ... κληρονομήσω
  choice: apa yang harus kulakukan untuk mewarisi hidup kekal?
  alternative: apa yang harus kuperbuat supaya aku mewarisi hidup kekal?
  rationale: Rumusan ini mempertahankan kerangka pertanyaan tokoh tentang tindakan dan warisan tanpa menyelesaikan ketegangan teologis antara melakukan sesuatu dan menerima warisan.
- issue: Maksud ἐκπειράζων
  choice: menguji
  alternative: mencobai; menjebak
  rationale: '''Menguji'' mempertahankan keluasan istilah Yunani dan adanya niat menyelidik atau bermusuhan, tanpa menambahkan gagasan jebakan yang tidak dinyatakan secara eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; 'lihatlah' mempertahankan vividitas naratif, sedangkan 'ahli Taurat' menjelaskan identitas tokoh tanpa memerlukan catatan kaki.
