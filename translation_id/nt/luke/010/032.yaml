base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: id
  text: Demikian juga, seorang Lewi datang ke tempat itu. Setelah melihatnya, ia melewatinya dari sisi seberang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia lewat.” Kata kerja Yunaninya dapat diterjemahkan secara sederhana sebagai “ia lewat,” tetapi bentuk majemuknya menyiratkan bahwa ia melewati orang itu dari sisi yang berlawanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Demikian juga
  rationale: Menyatakan kesejajaran tindakan orang Lewi dengan tindakan imam dalam ayat sebelumnya secara alami dan ringkas.
- source_word: δὲ καὶ
  choice: juga
  rationale: δέ adalah penghubung ringan, sedangkan καί menambahkan orang Lewi sebagai contoh sejajar; dalam bahasa Indonesia, daya keduanya cukup disampaikan dengan 'juga' dan alur kalimat.
- source_word: Λευίτης
  choice: seorang Lewi
  rationale: Mempertahankan sebutan historis bagi anggota kelompok Lewi tanpa menggantinya dengan uraian fungsi yang lebih sempit.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: datang ke tempat itu
  rationale: Menyampaikan kedatangan ke lokasi yang telah disebut dalam konteks tanpa menentukan secara berlebihan apakah ia tiba tepat di titik itu atau melintas di dekatnya.
- source_word: καὶ ἰδὼν
  choice: Ketika melihat orang itu
  rationale: Mengungkapkan urutan tindakan partisipel secara wajar; objek 'orang itu' dipasok dari konteks, yakni korban yang tergeletak.
- source_word: ἀντιπαρῆλθεν
  choice: ia lewat di seberang jalan
  rationale: Kata kerja majemuk ini menyiratkan bahwa ia melewati korban dari sisi yang berlawanan, bukan sekadar berjalan lewat.
theological_decisions:
- issue: Identitas sosial-keagamaan Λευίτης
  choice: seorang Lewi
  alternative: seorang pelayan Bait Allah; seorang anggota suku Lewi
  rationale: Transliterasi mempertahankan kekhususan historis dan kesejajarannya dengan imam tanpa memasukkan penjelasan fungsi atau kesukuan ke dalam teks.
- issue: Kadar kesengajaan dalam ἀντιπαρῆλθεν
  choice: lewat di seberang jalan
  alternative: melewati orang itu; sengaja menghindarinya
  rationale: Terjemahan mempertahankan gambaran gerak pada sisi berlawanan yang tersirat oleh bentuk majemuk, tetapi tidak secara eksplisit menambahkan penilaian motif seperti 'sengaja'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Dua partisipel Yunani diungkapkan sebagai klausa berurutan agar alur tindakan mudah dipahami. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
