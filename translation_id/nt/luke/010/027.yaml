id: LUK.10.27
reference: Luke 10:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: id
  text: Ia menjawab, “Kasihilah Tuhan, Allahmu, dengan segenap hatimu[a], dengan segenap jiwamu, dengan segenap kekuatanmu, dan dengan segenap pikiranmu; dan kasihilah sesamamu seperti dirimu sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bahasa Yunani berbunyi “dari segenap hatimu” (ἐξ ὅλης τῆς καρδίας), sedangkan tiga frasa berikut memakai preposisi yang berarti “dengan/dalam” (ἐν).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ia menjawab
  rationale: Konstruksi partisipel dan verba finit ini secara idiomatis menyatakan jawaban; bahasa Indonesia alami dapat memadatkannya tanpa kehilangan makna.
- source_word: Ἀγαπήσεις
  choice: Kasihilah
  rationale: Bentuk futurum Yunani berfungsi sebagai rumusan perintah dalam kutipan Kitab Suci. Imperatif Indonesia menyampaikan daya perintah secara wajar dan jelas.
- source_word: κύριον τὸν θεόν σου
  choice: Tuhan, Allahmu
  rationale: Mempertahankan gelar ilahi κύριος dan sebutan θεός serta hubungan kepunyaan dalam sapaan perjanjian.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: dengan segenap hatimu
  rationale: Dalam konteks ungkapan Ibrani-Yunani ini, ἐξ menyatakan sumber atau keterlibatan total. 'Dengan segenap hatimu' merupakan padanan Indonesia yang alami; catatan kaki mempertahankan perbedaan preposisi dari frasa-frasa berikutnya.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: dengan segenap jiwamu
  rationale: ψυχή menunjuk pada jiwa atau kehidupan diri; 'jiwa' mempertahankan istilah yang berbeda tanpa memaksakan antropologi teknis.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: dengan segenap kekuatanmu
  rationale: ἰσχύς berarti kekuatan atau daya; 'kekuatan' jelas dan sesuai dengan konteks pengabdian total.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: dengan segenap pikiranmu
  rationale: διάνοια menunjuk pada pikiran atau daya pengertian; 'pikiran' adalah padanan langsung dan alami.
- source_word: τὸν πλησίον σου
  choice: sesamamu
  rationale: '''Sesama'' adalah padanan etis-relasional yang mapan bagi πλησίον dan lebih alami daripada ungkapan harfiah ''orang yang dekat denganmu''.'
- source_word: ὡς σεαυτόν
  choice: seperti dirimu sendiri
  rationale: Mempertahankan daya perbandingan ὡς dengan ungkapan Indonesia yang idiomatis.
theological_decisions:
- issue: Gelar ilahi κύριος dalam kutipan perintah mengenai Allah Israel
  choice: Tuhan
  alternative: Tuan
  rationale: '''Tuhan'' mempertahankan bobot gelar ilahi dan gema kutipan Kitab Suci; ''Tuan'' tidak tepat dalam konteks rujukan kepada Allah Israel.'
- issue: Rangkaian καρδία, ψυχή, ἰσχύς, dan διάνοια
  choice: Mempertahankan empat istilah sebagai hati, jiwa, kekuatan, dan pikiran
  alternative: Meringkasnya menjadi 'dengan seluruh keberadaanmu'
  rationale: Rangkaian istilah yang saling bertumpang tindih menegaskan pengabdian menyeluruh. Mempertahankan semuanya menjaga kepenuhan retoris tanpa menetapkan pembagian antropologis yang kaku.
- issue: Daya gramatikal Ἀγαπήσεις dalam kutipan hukum
  choice: Kasihilah
  alternative: Engkau akan mengasihi
  rationale: Walaupun bentuk Yunani secara morfologis adalah futurum, dalam kutipan perintah ini fungsinya normatif. Imperatif merupakan cara alami dalam bahasa Indonesia untuk mempertahankan daya perintah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk narasi yang ringkas; 'segenap' menjaga nada kutipan Kitab Suci sekaligus tetap mudah dipahami. Tanda titik koma membantu memperjelas peralihan dari perintah mengasihi Allah ke perintah mengasihi sesama.
