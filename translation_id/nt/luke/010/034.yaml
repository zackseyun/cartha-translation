  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: id
  text: Ia mendekati orang itu lalu membalut luka-lukanya sambil menuangkan minyak dan anggur pada luka-lukanya. Kemudian ia menempatkan orang itu di atas hewan tunggangannya sendiri, membawanya ke sebuah penginapan, dan merawatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: mendekati orang itu
  rationale: Partisip aoris ini menyatakan gerakan mendekat kepada orang yang terluka sebelum atau bersamaan dengan tindakan utama; objek tersirat dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: κατέδησεν
  choice: membalut
  rationale: Kata kerja ini berarti mengikat atau membalut luka; 'membalut' tepat dan lazim dalam konteks perawatan luka.
- source_word: τραύματα
  choice: luka-luka
  rationale: Padanan langsung bagi luka fisik; bentuk ulang menyampaikan bentuk jamak Yunani secara alami.
- source_word: ἐπιχέων
  choice: sambil menuangkan ... ke atasnya
  rationale: Partisip kini menunjukkan tindakan yang menyertai pembalutan dan mempertahankan gambaran konkret tentang cairan yang dituangkan pada luka.
- source_word: ἔλαιον
  choice: minyak
  rationale: Padanan leksikal yang dekat; meskipun kemungkinan besar minyak zaitun, teks Yunani sendiri menggunakan istilah umum untuk minyak.
- source_word: οἶνον
  choice: anggur
  rationale: Padanan langsung; fungsi pengobatannya tidak ditambahkan ke dalam teks.
- source_word: ἐπιβιβάσας
  choice: menaikkan orang itu ke atas
  rationale: Menyampaikan tindakan menempatkan orang yang terluka di atas hewan secara wajar dalam bahasa Indonesia.
- source_word: ἴδιον
  choice: sendiri
  rationale: Mempertahankan penekanan kepemilikan pribadi dalam ἴδιον.
- source_word: κτῆνος
  choice: hewan tunggangan
  rationale: Istilah Yunani menunjuk hewan peliharaan yang digunakan untuk membawa muatan atau ditunggangi; konteks menunjukkan bahwa hewan itu dipakai sebagai tunggangan.
- source_word: πανδοχεῖον
  choice: penginapan
  rationale: Padanan Indonesia yang ringkas dan lazim bagi tempat yang menerima para pelancong.
- source_word: ἐπεμελήθη
  choice: merawatnya
  rationale: Mengungkapkan perhatian dan perawatan pribadi secara alami dan tepat.
