  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: id
  text: Secara kebetulan, seorang imam sedang menuruni jalan itu. Ketika melihat orang itu, ia melewatinya dari seberang jalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia melewatinya”; tetapi verba Yunani menunjukkan bahwa ia lewat dengan berada di sisi seberang, yang menyiratkan tindakan menghindar secara sengaja.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: Secara kebetulan
  rationale: Ungkapan ini menyatakan bahwa peristiwa tersebut terjadi secara kebetulan. Pilihan ini alami dalam bahasa Indonesia dan tidak memperluasnya menjadi pernyataan filosofis tentang ada atau tidaknya pemeliharaan ilahi.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung ringan yang memajukan cerita. Dalam bahasa Indonesia, peralihan naratif sudah cukup jelas tanpa kata penghubung tambahan.
- source_word: ἱερεύς τις
  choice: seorang imam
  rationale: τις menandai seorang individu yang tidak disebutkan namanya. 'Seorang imam' merupakan ungkapan Indonesia yang alami; 'seorang imam tertentu' akan terasa kaku dan dapat menyiratkan bahwa identitasnya sudah diketahui.
- source_word: κατέβαινεν
  choice: sedang menuruni
  rationale: Bentuk imperfek menggambarkan gerak yang sedang berlangsung sebagai latar adegan. 'Sedang menuruni' mempertahankan aspek tersebut sekaligus menyampaikan arah turun.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: jalan itu
  rationale: Dalam konteks perjalanan, frasa ini secara idiomatis berarti berada atau bergerak di jalan tersebut. Dengan verba 'menuruni', preposisi Indonesia tambahan tidak diperlukan.
- source_word: ἰδὼν αὐτὸν
  choice: Ketika melihat orang itu
  rationale: Partisip aoris paling wajar dipahami secara temporal. 'Orang itu' memperjelas acuan kepada korban tanpa menambahkan keterangan yang tidak terdapat dalam ayat ini.
- source_word: ἀντιπαρῆλθεν
  choice: ia lewat di seberang jalan
  rationale: Verba ini menyatakan bahwa imam itu melewati korban dengan berada di sisi yang berlawanan, bukan sekadar lewat. Terjemahan ini mempertahankan kesan penghindaran yang disengaja.
