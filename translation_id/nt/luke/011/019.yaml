id: LUK.11.19
reference: Luke 11:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: id
  text: Namun, jika Aku mengusir setan-setan melalui Beelzebul, melalui siapa[a] anak-anak kalian mengusir mereka? Karena itu, mereka sendirilah[b] yang akan menjadi hakim kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui apa” atau “melalui kuasa apa”.
    reason: lexical_alternative
  - marker: b
    text: 'Kata ganti Yunani diberi penekanan: “mereka sendiri”.'
    reason: lexical_emphasis
lexical_decisions:
- source_word: εἰ δὲ
  choice: Namun, jika
  rationale: δέ melanjutkan sanggahan Yesus dengan pertentangan ringan; “Namun, jika” terdengar alami dan mempertahankan alur argumentasinya.
- source_word: ἐγὼ
  choice: Aku
  rationale: Kata ganti yang dinyatakan secara eksplisit dipertahankan untuk mendukung kontras dalam argumen Yesus.
- source_word: ἐν Βεελζεβοὺλ
  choice: dengan kuasa Beelzebul
  rationale: ἐν di sini menyatakan sarana atau kuasa yang dianggap bekerja. Ungkapan ini lebih alami dan tidak lebih mudah disalahpahami daripada “dengan Beelzebul” dalam bahasa Indonesia.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: mengusir setan-setan
  rationale: Dalam konteks eksorsisme, ἐκβάλλω berarti mengusir atau mengeluarkan; “mengusir setan-setan” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: anak-anak kalian
  rationale: Terjemahan ini mempertahankan hubungan harfiah “anak-anak kalian” tanpa menetapkan apakah yang dimaksud adalah pengikut, murid, atau sesama orang Yahudi. “Kalian” memperjelas bahwa ὑμῶν berbentuk jamak.
- source_word: ἐν τίνι
  choice: dengan siapa
  rationale: Kata tanya ini dapat menunjuk kepada pribadi, sarana, atau kuasa. Karena pertanyaannya sejajar dengan Beelzebul sebagai sosok pribadi, “dengan siapa” paling tepat bagi teks utama, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: ἐκβάλλουσιν
  choice: mengusir mereka
  rationale: Pengulangan verba ἐκβάλλω dipertahankan, sedangkan “mereka” secara alami merujuk kembali kepada setan-setan.
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan ini memperkenalkan kesimpulan yang ditarik dari pertanyaan retoris sebelumnya.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: mereka sendirilah yang akan menjadi hakim kalian
  rationale: “Mereka sendirilah” mempertahankan penekanan pada αὐτοί, dan “hakim kalian” menyampaikan fungsi mereka dalam menyingkap ketidakkonsistenan para penentang.
theological_decisions:
- issue: Identitas “anak-anak kalian”
  choice: Mempertahankan ungkapan harfiah “anak-anak kalian”.
  alternative: “pengikut kalian”, “murid-murid kalian”, atau “sesama orang Yahudi”
  rationale: Teks Yunani tidak secara eksplisit menetapkan identitas kelompok ini. Terjemahan utama tidak menyelesaikan ketegangan penafsiran tersebut.
- issue: Dasar atau pelaku pengusiran setan
  choice: “dengan kuasa Beelzebul”
  alternative: “dengan Beelzebul” atau “oleh Beelzebul”
  rationale: Konteksnya membicarakan tuduhan mengenai kuasa atau sarana yang dipakai Yesus, bukan menyatakan bahwa Beelzebul sendiri secara langsung melakukan pengusiran itu. Pilihan ini menyampaikan fungsi instrumental ἐν tanpa menerima kebenaran tuduhan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk “kalian” dipakai karena semua kata ganti orang kedua dalam ayat ini berbentuk jamak. “Mereka sendirilah” mempertahankan penekanan Yunani secara alami.
