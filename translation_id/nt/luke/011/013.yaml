id: LUK.11.13
reference: Luke 11:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: id
  text: Jadi, jika kamu yang jahat tahu memberikan pemberian yang baik kepada anak-anakmu, betapa lebih lagi Bapa yang dari surga akan memberikan Roh Kudus kepada mereka yang meminta kepada-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan berbunyi “Bapamu yang di surga” dengan mengikuti ungkapan paralel dalam Matius 7:11, tetapi teks Yunani Lukas secara harfiah menyebut “Bapa yang dari surga”.
    reason: alternative_reading
  - marker: b
    text: Dalam Matius 7:11 tertulis “hal-hal yang baik”, sedangkan Lukas di sini secara khusus menyebut “Roh Kudus”; masing-masing Injil mempertahankan ungkapannya sendiri.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: kamu yang jahat
  rationale: Konstruksi partisipial ini menggambarkan keadaan moral para pendengar. Bentuk ini dekat dengan bahasa Yunani sekaligus lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'berada sebagai orang jahat'.
- source_word: οἴδατε ... διδόναι
  choice: tahu memberikan
  rationale: Dengan infinitif pelengkap, ungkapan ini menyatakan pengetahuan atau kecakapan praktis untuk memberi. Dalam bahasa Indonesia, 'tahu memberikan' sudah alami tanpa harus menambahkan 'bagaimana caranya'.
- source_word: δόματα ἀγαθὰ
  choice: pemberian yang baik
  rationale: δόματα secara khusus berarti pemberian atau hadiah, bukan sekadar hal-hal secara umum. 'Pemberian yang baik' mempertahankan makna konkretnya dan cocok dengan tindakan memberi.
- source_word: τέκνοις
  choice: anak-anakmu
  rationale: Dalam konteks keluarga, τέκνα paling alami dan tepat diterjemahkan sebagai 'anak-anak'.
- source_word: πόσῳ μᾶλλον
  choice: terlebih lagi
  rationale: Ungkapan ini secara alami menyampaikan argumen dari hal yang lebih kecil menuju hal yang lebih besar; 'terlebih lagi' merupakan padanan Indonesia yang ringkas dan baku.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: Bapa yang dari surga
  rationale: Teks Yunani tidak memuat 'mu' dan memakai ἐξ, 'dari'. Pilihan ini mempertahankan susunan khas Lukas tanpa menyelaraskannya dengan Matius 7:11.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Dalam konteks Lukas, frasa ini menunjuk kepada Roh ilahi. Bahasa Indonesia tidak memerlukan kata sandang seperti bahasa Inggris.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: kepada mereka yang meminta kepada-Nya
  rationale: Partisipel kini diterjemahkan secara substantival sebagai 'mereka yang meminta'. Bentuk 'kepada-Nya' menyampaikan objek eksplisit αὐτόν dengan jelas dan wajar.
theological_decisions:
- issue: Referen πνεῦμα ἅγιον
  choice: Roh Kudus sebagai Roh ilahi
  alternative: roh yang kudus atau suatu roh kudus
  rationale: Walaupun frasa Yunani tidak memakai kata sandang, konteks Lukas menunjuk kepada Roh Allah sebagai pemberian Bapa. Kapitalisasi menandai referen ini tanpa menambahkan uraian teologis yang tidak dinyatakan ayat.
- issue: Hubungan dengan paralel dalam Matius
  choice: mempertahankan ungkapan khas Lukas, 'Bapa yang dari surga' dan 'Roh Kudus'
  alternative: menyelaraskan menjadi 'Bapamu yang di surga' dan/atau 'hal-hal yang baik'
  rationale: Terjemahan mengikuti teks Yunani Lukas dan tidak melebur perbedaan redaksionalnya dengan Matius 7:11.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan jamak Yunani ὑμεῖς disampaikan dengan 'kamu' yang dapat berfungsi kolektif dalam konteks ini. 'Bapa' dan 'Roh Kudus' dikapitalisasi sebagai sebutan bagi Allah. Kedua penanda catatan kaki ditempatkan sesudah ayat agar tidak memutus alur kalimat; catatan [a] menerangkan frasa tentang Bapa dan [b] menjelaskan perbedaan dengan paralel Matius.
