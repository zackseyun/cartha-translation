  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: id
  text: Hai, orang-orang bodoh! Bukankah yang membuat bagian luar juga membuat bagian dalam?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang lahiriah ... yang batiniah.” Ungkapan ini dapat menunjuk pada bagian luar dan bagian dalam wadah dalam konteks langsung dan, secara lebih luas, pada kehidupan lahiriah dan batiniah manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Hai orang-orang bodoh!
  rationale: Adjektiva vokatif jamak yang dipakai secara substantival sebagai teguran langsung. Ungkapan ini mempertahankan ketajaman teguran sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: οὐχ ... ἐποίησεν;
  choice: Bukankah ... membuat?
  rationale: Pertanyaan dengan partikel negatif mengharapkan jawaban ya. Bentuk “Bukankah ...?” menyampaikan daya retoris tersebut secara alami.
- source_word: ὁ ποιήσας
  choice: Dia yang membuat
  rationale: Partisip aoristus berartikel berfungsi substantival. Huruf kapital pada “Dia” mengisyaratkan rujukan kepada Allah tanpa menambahkan nama “Allah” yang tidak eksplisit dalam teks Yunani.
- source_word: τὸ ἔξωθεν
  choice: bagian luar
  rationale: Pilihan ini alami dan cukup luas untuk menunjuk bagian luar wadah dalam konteks langsung serta kehidupan lahiriah secara kiasan.
- source_word: τὸ ἔσωθεν
  choice: bagian dalam
  rationale: Pilihan yang sejajar dengan “bagian luar” dan mempertahankan kemungkinan rujukan kepada sisi dalam wadah maupun batin manusia.
- source_word: καὶ
  choice: juga
  rationale: Dalam pertanyaan retoris ini, “juga” menampilkan logika bahwa pembuat bagian luar adalah pembuat bagian dalam pula.
theological_decisions:
- issue: Rujukan ὁ ποιήσας (“Dia yang membuat”)
  choice: Rujukan tersirat kepada Allah sebagai Pencipta dipertahankan tanpa menyisipkan kata “Allah”.
  alternative: Memahaminya hanya sebagai pembuat wadah atau cawan.
  rationale: Perkataan ini dapat bekerja sekaligus pada tingkat gambaran wadah dan pada kebenaran yang lebih luas tentang Sang Pencipta. Terjemahan tidak membatasi rujukannya pada salah satu tingkat saja.
- issue: Cakupan “bagian luar” dan “bagian dalam”
  choice: Mempertahankan ungkapan konkret yang juga terbuka bagi penerapan pada kehidupan lahiriah dan batiniah.
  alternative: Menerjemahkan langsung sebagai “lahiriah” dan “batiniah”.
  rationale: Istilah Yunani terkait dengan gambaran cawan dan pinggan dalam konteks langsung, tetapi memiliki daya kiasan. Terjemahan utama menjaga kedua lapisan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Teguran dibuat tegas tanpa menjadi bahasa gaul. Struktur pertanyaan retoris serta ambiguitas antara gambaran wadah dan keadaan manusia dipertahankan.
