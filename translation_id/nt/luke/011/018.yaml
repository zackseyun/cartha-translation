id: LUK.11.18
reference: Luke 11:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: id
  text: Namun, jika Satan juga terpecah dan melawan dirinya sendiri, bagaimana kerajaannya akan bertahan? Sebab kamu berkata bahwa Aku mengusir setan-setan dengan kuasa Beelzebul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: Beelzebul; dalam beberapa tradisi digunakan bentuk Beelzebub.'
    reason: Mencatat bentuk alternatif nama yang dikenal luas sambil mempertahankan bacaan teks Yunani.
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satan
  rationale: Mempertahankan transliterasi nama atau gelar pribadi Yunani dan membedakannya dari bentuk jamak setan-setan.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: terpecah dan melawan dirinya sendiri
  rationale: Ungkapan ini menyatakan perpecahan internal yang menghasilkan pertentangan terhadap diri sendiri; perumusan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: πῶς σταθήσεται
  choice: bagaimana ... akan bertahan
  rationale: Bentuk mendatang ini dalam konteks tersebut berarti tetap tegak, kukuh, atau berlangsung; 'akan bertahan' menyampaikan metafora dan daya pertanyaan retoris secara alami.
- source_word: βασιλεία
  choice: kerajaan
  rationale: Padanan baku yang di sini menunjuk pada wilayah kekuasaan atau pemerintahan Satan.
- source_word: ὅτι
  choice: Sebab
  rationale: Mengantar alasan yang mendasari pertanyaan retoris, yaitu tuduhan para lawan Yesus.
- source_word: ἐν Βεελζεβοὺλ
  choice: dengan kuasa Beelzebul
  rationale: Dalam konteks ini ἐν menyatakan sarana atau kuasa yang dituduhkan; bentuk eksplisit ini lebih jelas dan wajar daripada 'di dalam Beelzebul' atau 'dengan Beelzebul'.
- source_word: ἐκβάλλειν
  choice: mengusir
  rationale: Padanan Indonesia yang alami dan tepat dalam konteks pengusiran setan.
- source_word: δαιμόνια
  choice: setan-setan
  rationale: Padanan konvensional untuk makhluk-makhluk roh jahat yang dimaksud, tanpa mengganti istilah itu dengan uraian penafsiran.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Mengikuti secara langsung bentuk nama dalam teks Yunani SBLGNT.
theological_decisions:
- issue: Sifat tuduhan para lawan Yesus
  choice: Mereka menuduh Yesus mengusir setan-setan dengan kuasa Beelzebul.
  alternative: Mereka menuduh Yesus bertindak dalam persekutuan dengan Beelzebul.
  rationale: Keterangan 'dengan kuasa' menyampaikan fungsi instrumental ἐν secara idiomatis tanpa menambahkan penjelasan teologis lebih jauh mengenai hubungan Yesus dengan Beelzebul.
- issue: Perpecahan dalam kerajaan Satan
  choice: Satan digambarkan terpecah dan melawan dirinya sendiri sebagai keadaan hipotetis.
  alternative: Satan telah terbagi menjadi kelompok-kelompok yang saling melawan.
  rationale: Terjemahan mempertahankan bentuk pengandaian dan pertanyaan retoris tanpa menetapkan bagaimana perpecahan itu secara teologis harus dipahami.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti 'Aku' ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia untuk ucapan Yesus. Penanda catatan kaki ditempatkan langsung sesudah nama Beelzebul karena catatan menjelaskan bentuk nama tersebut.
