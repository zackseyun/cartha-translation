base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: id
  text: Namun, Yesus berkata[a], “Yang berbahagia justru ialah orang-orang yang mendengarkan firman Allah dan memeliharanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh, berbahagialah …” atau “Ya, terlebih lagi, berbahagialah …” Partikel Yunani ini dapat mengafirmasi ucapan sebelumnya sambil mengalihkan penekanannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ εἶπεν
  choice: Namun, Yesus berkata
  rationale: δὲ menandai peralihan yang bernuansa kontras dengan seruan sebelumnya. Nama “Yesus” dipakai sebagai pengganti pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: Μενοῦν
  choice: Sebaliknya
  rationale: Partikel ini mengarahkan kembali dan meninggikan pokok berkat tanpa harus berarti penolakan keras. “Sebaliknya” alami dalam konteks ini, sedangkan nuansa afirmatifnya dicatat dalam catatan kaki.
- source_word: μακάριοι
  choice: berbahagialah
  rationale: Bentuk ini lazim dalam ucapan berkat Alkitab dan mempertahankan bobot teologis μακάριοι; maknanya lebih luas daripada perasaan senang semata.
- source_word: οἱ ἀκούοντες
  choice: orang-orang yang mendengarkan
  rationale: Partisipel kini substantival menggambarkan kelompok yang berciri terus mendengarkan. “Mendengarkan” lebih jelas daripada sekadar “mendengar” karena mengisyaratkan perhatian tanpa dengan sendirinya mencakup ketaatan.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Ungkapan ini tepat, alami, dan mempertahankan gema biblis λόγος sebagai perkataan atau pesan yang berasal dari Allah.
- source_word: φυλάσσοντες
  choice: menaatinya
  rationale: Dalam konteks menerima firman Allah, φυλάσσω menunjuk pada memegang dan menjalankannya. “Menaatinya” menyampaikan penerapan nyata secara lebih alami dalam bahasa Indonesia, walaupun “memeliharanya” juga mungkin.
theological_decisions:
- issue: Daya tanggapan Yesus terhadap ucapan berkat perempuan pada ayat sebelumnya
  choice: Yesus mengarahkan pusat perhatian kepada berkat sejati bagi mereka yang mendengarkan dan menaati firman Allah, tanpa secara eksplisit menyangkal bahwa ibu-Nya diberkati.
  alternative: Yesus menolak mentah-mentah ucapan perempuan itu, atau hanya menambahkan berkat lain tanpa koreksi.
  rationale: μενοῦν dapat sekaligus mengafirmasi dan mengalihkan penekanan. Terjemahan utama memakai “Sebaliknya,” sementara catatan kaki mempertahankan kemungkinan nuansa “Ya, bahkan lebih tepat” agar ketegangan teks tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Berbahagialah” mempertahankan corak ucapan berkat, sedangkan “mendengarkan … dan menaatinya” mudah dipahami pembaca umum serta membedakan penerimaan firman dari pelaksanaannya.
