    rationale: Dalam struktur kalimat Indonesia, “mereka” dapat dibaca merujuk kepada nenek moyang atau kepada nabi-nabi. Konteks Yunani menunjuk pada makam para nabi dari ayat sebelumnya; rujukan ini sebaiknya dibuat eksplisit dan tetap dijelaskan dalam catatan kaki sebagai objek yang tersirat.
