  rationale: Revisi mengganti “menjadi saksi” dengan “adalah saksi” agar sesuai dengan konstruksi predikat nominal Yunani. Rujukan objek tersirat diperjelas menjadi “makam para nabi itu” agar tidak ambigu dalam bahasa Indonesia, dan catatan kaki menerangkan bahwa objek tersebut berasal dari konteks ayat sebelumnya.
