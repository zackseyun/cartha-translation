  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: id
  text: Dengan demikian, kamu adalah saksi dan menyetujui perbuatan nenek moyangmu, sebab mereka membunuh para nabi itu, sedangkan kamu membangun makam para nabi itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “makam para nabi itu” dipahami dari ayat sebelumnya. Dalam bahasa Yunani, objek kata “membangun” tidak disebutkan.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: Dengan demikian
  rationale: Menandai kesimpulan yang ditarik dari tuduhan pada ayat sebelumnya dengan gaya Indonesia yang wajar dan bermartabat.
- source_word: μάρτυρές ἐστε
  choice: kamu menjadi saksi
  rationale: Mempertahankan konstruksi predikat nomina dan menyampaikan bahwa tindakan mereka sendiri menjadi kesaksian atas keterkaitan mereka dengan perbuatan nenek moyang.
- source_word: συνευδοκεῖτε
  choice: menyetujui
  rationale: Mengungkapkan persetujuan aktif terhadap tindakan pihak lain, sesuai daya moral kata Yunani ini.
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: perbuatan nenek moyangmu
  rationale: Perbuatan menyatakan tindakan konkret; nenek moyang lebih alami daripada bapak-bapak dalam bahasa Indonesia modern dan tetap menunjukkan generasi terdahulu.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan yang menjelaskan tuduhan tersebut.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: mereka membunuh nabi-nabi itu
  rationale: Rujukan pronomina diperjelas secara minimal dari konteks langsung agar tidak membingungkan dalam bahasa Indonesia; μέν berpasangan dengan δέ dalam kontras antarklausa.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: sedangkan kamu membangun makam mereka
  rationale: Sedangkan mempertahankan kontras μέν–δέ. Objek makam mereka dipulihkan dari ayat sebelumnya agar kalimat Indonesia lengkap dan sesuai konteks, meskipun objek itu tersirat dalam teks ayat ini.
theological_decisions:
- issue: Apakah objek tersirat dari οἰκοδομεῖτε perlu dicantumkan
  choice: Mencantumkan “makam mereka” dalam teks utama
  alternative: 'Membiarkan verba tanpa objek: “sedangkan kamu membangun”'
  rationale: Dalam bahasa Yunani, objek verba dipahami langsung dari makam para nabi pada ayat 47. Bahasa Indonesia memerlukan objek ini demi kejelasan dan kelancaran; catatan kaki memberitahukan bahwa objek tersebut berasal dari konteks.
- issue: Makna hubungan antara membunuh dan membangun makam
  choice: Mempertahankan pernyataan bahwa tindakan generasi kini menyaksikan dan menyetujui perbuatan nenek moyang
  alternative: Menafsirkan pembangunan makam hanya sebagai penghormatan yang tulus kepada para nabi
  rationale: συνευδοκεῖτε secara eksplisit menyatakan persetujuan. Terjemahan mempertahankan ketegangan retoris Yesus tanpa menjelaskan mekanisme kesalahan mereka melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan tunggal kolektif “kamu” mengikuti bentuk orang kedua jamak Yunani dalam ujaran kepada kelompok; bentuk “kalian” dihindari demi register Kitab Suci yang lebih tenang. Penanda catatan kaki ditempatkan sesudah kalimat yang memuat unsur tersirat.
