  source_fidelity: Draf dengan tepat mempertahankan hubungan inferensial ἄρα, persetujuan aktif dalam συνευδοκεῖτε, serta kontras antara leluhur yang membunuh dan pendengar yang membangun. Objek verba οἰκοδομεῖτε memang tidak dinyatakan dalam ayat ini, tetapi dipahami dari ayat sebelumnya sebagai makam para nabi; penyediaannya dalam bahasa Indonesia dapat diterima jika ditandai catatan kaki. Namun, “menjadi saksi” menambahkan nuansa proses/perubahan yang tidak terdapat dalam predikat nominal μάρτυρές ἐστε (“adalah saksi”).
  naturalness: Bahasanya umumnya modern, jelas, dan berregister layak. “Kamu adalah saksi” lebih langsung dan idiomatis daripada “kamu menjadi saksi” untuk konstruksi Yunani ini. Menyebut “makam para nabi itu” menghindari kemungkinan bahwa “makam mereka” dipahami sebagai makam nenek moyang, bukan makam para nabi.
  terminology: “Perbuatan,” “nenek moyang,” “membunuh,” dan “makam” adalah pilihan yang wajar. “Nenek moyang” secara idiomatis menyampaikan τῶν πατέρων ὑμῶν tanpa mengubah sasaran retorisnya. Rujukan “para nabi itu” merupakan penjelasan kontekstual yang sah, bukan penetapan doktrinal.
