id: LUK.11.33
reference: Luke 11:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: id
  text: Tidak seorang pun menyalakan pelita lalu menaruhnya di tempat tersembunyi[a] atau di bawah wadah takaran[b], melainkan di atas penyangga pelita, supaya orang-orang yang masuk dapat melihat cahaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di ruang bawah tanah” atau “di tempat rahasia.” Kata Yunani κρύπτη dapat menunjuk pada tempat tersembunyi, termasuk ruang penyimpanan di bawah tanah.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani μόδιος menunjuk pada suatu takaran bahan kering dan juga pada wadah yang dipakai untuk menakar; secara tradisional diterjemahkan “gantang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Tidak seorang pun
  rationale: Padanan Indonesia yang alami dan bermartabat untuk kata ganti negatif tak tentu, dengan tetap mempertahankan penyangkalan universal.
- source_word: λύχνον
  choice: pelita
  rationale: λύχνος menunjuk pada lampu minyak portabel; 'pelita' merupakan istilah Indonesia yang tepat bagi benda dalam gambaran ini, bukan lilin.
- source_word: ἅψας
  choice: menyalakan ... lalu
  rationale: Partisip aoris menunjukkan tindakan yang mendahului verba utama. Susunan 'menyalakan ... lalu menaruhnya' menyampaikan urutan itu secara alami.
- source_word: εἰς κρύπτην
  choice: di tempat tersembunyi
  rationale: κρύπτη dapat berarti tempat tersembunyi, termasuk ruang bawah tanah atau tempat penyimpanan. Pilihan umum ini mempertahankan penekanan pada tindakan menyembunyikan tanpa mempersempit bentuk tempatnya.
- source_word: τίθησιν
  choice: menaruhnya
  rationale: Padanan langsung dan alami untuk tindakan menempatkan pelita; akhiran '-nya' memperjelas bahwa pelita itulah objeknya.
- source_word: ὑπὸ τὸν μόδιον
  choice: di bawah wadah takaran
  rationale: μόδιος adalah satuan takaran bahan kering dan, secara metonimis, wadah penakarnya. 'Wadah takaran' menjaga unsur pengukuran sekaligus mudah dipahami pembaca modern.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: di atas kaki pelita
  rationale: λυχνία adalah penyangga atau tempat untuk meletakkan pelita. 'Kaki pelita' adalah ungkapan Indonesia yang mapan dan konkret.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan secara jelas dan alami.
- source_word: οἱ εἰσπορευόμενοι
  choice: orang-orang yang masuk
  rationale: Partisip substantival ini merujuk kepada mereka yang sedang atau biasa masuk; bentuk ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: τὸ φέγγος
  choice: cahayanya
  rationale: φέγγος berarti cahaya atau sinar. Bentuk posesif menghubungkan cahaya itu secara alami dengan pelita tanpa menambah penafsiran.
- source_word: βλέπωσιν
  choice: dapat melihat
  rationale: Subjungtif sesudah ἵνα menyatakan tujuan yang dimaksudkan; 'dapat melihat' menyampaikan hasil fungsional itu dengan alami.
theological_decisions:
- issue: Cakupan makna κρύπτη
  choice: tempat tersembunyi yang tidak ditentukan secara arsitektural
  alternative: ruang bawah tanah atau gudang
  rationale: Pokok perumpamaan ialah ketidakmasukakalan menyembunyikan cahaya, bukan jenis ruang tertentu. Terjemahan umum mempertahankan keluasan makna sumber.
- issue: Identitas μόδιος
  choice: wadah takaran
  alternative: gantang, bakul, atau wadah berukuran satu modios
  rationale: Pilihan ini mempertahankan fungsi benda sebagai alat takar tanpa menggantinya dengan ukuran daerah tertentu atau memastikan bahan dan bentuk wadah yang tidak dinyatakan teks.
- issue: Relasi τὸ φέγγος dengan pelita
  choice: cahayanya
  alternative: cahaya itu atau sinarnya
  rationale: Ungkapan ini secara alami mengacu pada cahaya pelita dan tidak mengubah fungsi metaforis perkataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya lugas dan bermartabat. Struktur peribahasa dipertahankan, sementara urutan partisip dan verba dibuat alami dengan 'menyalakan ... lalu menaruhnya'. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
