  source_fidelity: Teks Indonesia dengan tepat mencerminkan τινὲς δὲ ἐξ αὐτῶν sebagai “Namun, beberapa orang di antara mereka,” mempertahankan kontras dan makna partitif. “Dengan kuasa Beelzebul” menyampaikan fungsi instrumental/agensial ἐν Βεελζεβούλ secara wajar. Aposisi “Beelzebul, penguasa setan-setan” merepresentasikan τῷ ἄρχοντι τῶν δαιμονίων, dan “Ia mengusir setan-setan” setia kepada ἐκβάλλει τὰ δαιμόνια.
