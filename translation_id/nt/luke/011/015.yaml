  terminology: “Beelzebul” mengikuti bentuk SBLGNT dan catatan kaki secara tepat memberi bentuk tradisional “Beelzebub.” “Penguasa setan-setan” merupakan padanan yang jelas bagi ἄρχων τῶν δαιμονίων tanpa memasukkan penafsiran tambahan.
