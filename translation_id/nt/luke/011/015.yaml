id: LUK.11.15
reference: Luke 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: id
  text: Namun, beberapa orang di antara mereka berkata, “Ia mengusir setan-setan dengan kuasa Beelzebul[a], penguasa setan-setan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beelzebub adalah bentuk tradisional lain dari nama yang di sini ditulis Beelzebul sesuai dengan teks Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Namun, beberapa orang di antara mereka
  rationale: Ungkapan ini menunjuk pada kelompok yang tidak ditentukan dari antara orang-orang yang hadir. “Namun” menyampaikan kontras dengan tanggapan positif dalam konteks sebelumnya, sedangkan “di antara mereka” mempertahankan makna partitif.
- source_word: εἶπον
  choice: berkata
  rationale: Bentuk aoris menyajikan ucapan itu sebagai peristiwa sederhana; “berkata” merupakan padanan Indonesia yang langsung dan alami.
- source_word: Ἐν Βεελζεβοὺλ
  choice: dengan kuasa Beelzebul
  rationale: ἐν dengan nama pribadi di sini menyatakan sarana atau kuasa yang dituduhkan sebagai sumber tindakan Yesus. “Dengan kuasa” membuat hubungan itu jelas dalam bahasa Indonesia tanpa menyatakan bahwa tuduhan tersebut benar.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Transliterasi ini mengikuti bentuk nama dalam teks Yunani, Βεελζεβούλ. Bentuk tradisional “Beelzebub” dicatat dalam catatan kaki.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: penguasa setan-setan
  rationale: ἄρχων berarti penguasa atau pemegang wewenang. Frasa ini menyatakan bahwa Beelzebul dianggap berkuasa atas setan-setan, tanpa menambahkan rincian demonologis.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: Ia mengusir setan-setan
  rationale: ἐκβάλλω dalam konteks pengusiran roh berarti “mengusir,” padanan modern yang jelas; δαιμόνια diterjemahkan langsung sebagai “setan-setan.”
theological_decisions:
- issue: Bentuk nama Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Teks utama mengikuti bentuk Yunani sebagai dasar utama. Bentuk “Beelzebub” yang dikenal dalam tradisi dipertahankan sebagai informasi catatan kaki, bukan menggantikan bentuk sumber.
- issue: Hubungan ἐν dengan Beelzebul
  choice: dengan kuasa Beelzebul
  alternative: melalui Beelzebul
  rationale: “Dengan kuasa” secara alami menyampaikan tuduhan mengenai sarana atau kuasa yang dipakai Yesus, sembari tetap mempertahankan bahwa ini adalah ucapan para penuduh, bukan penegasan narator.
- issue: Makna ἄρχων dalam struktur kuasa setan
  choice: penguasa setan-setan
  alternative: pemimpin setan-setan
  rationale: “Penguasa” menyampaikan unsur wewenang dalam ἄρχων secara jelas dan tidak memasukkan sistem demonologi yang lebih terperinci daripada yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan bentuk nama dan istilah kunci tetap dekat dengan sumber Yunani.
