id: LUK.11.36
reference: Luke 11:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: id
  text: Jadi, jika seluruh tubuhmu terang dan tidak memiliki bagian yang gelap, tubuhmu akan sepenuhnya terang, seperti ketika pelita menerangimu dengan cahayanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti ketika pelita menerangimu dengan pancarannya.” Kata Yunani yang dipakai dapat berarti kilat, pancaran, atau cahaya terang; di sini kemungkinan besar yang dimaksud ialah pancaran pelita, bukan kilat harfiah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: tubuh
  rationale: Mempertahankan istilah konkret dan gambaran tubuh dalam konteks perkataan tentang mata, terang, dan pelita, tanpa menafsirkannya langsung sebagai keadaan batin.
- source_word: ὅλον
  choice: seluruh
  rationale: Menyampaikan cakupan total pada kedua kemunculannya secara alami dalam bahasa Indonesia.
- source_word: φωτεινόν
  choice: terang
  rationale: Padanan predikatif yang ringkas dan wajar serta mempertahankan pertentangan langsung dengan σκοτεινόν, 'gelap'.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: tidak ada bagian yang gelap
  rationale: Mengungkapkan frasa partisipial Yunani dengan susunan Indonesia yang alami sambil mempertahankan gambaran konkret tentang bagian yang gelap.
- source_word: ἔσται
  choice: akan menjadi
  rationale: Menyatakan bentuk futurum dengan alami; 'menjadi terang' lebih lancar dalam konteks akibat daripada pengulangan 'akan terang'.
- source_word: ὡς ὅταν
  choice: seperti ketika
  rationale: Mempertahankan unsur perbandingan sekaligus waktu dari gabungan Yunani tersebut.
- source_word: λύχνος
  choice: pelita
  rationale: Menunjuk lampu minyak portabel pada dunia kuno dan mempertahankan gambaran konkret, bukan terang abstrak atau kaki pelita.
- source_word: τῇ ἀστραπῇ
  choice: dengan cahayanya
  rationale: Dalam hubungan dengan pelita sebagai subjek, ungkapan ini paling wajar menunjuk pancaran atau kilau pelita, bukan kilat harfiah; catatan kaki mempertahankan alternatif leksikalnya.
- source_word: φωτίζῃ σε
  choice: menerangimu
  rationale: Menyampaikan tindakan memberi terang dan mempertahankan objek pribadi σε, 'engkau'.
theological_decisions:
- issue: Daya metaforis 'tubuh' dan 'terang' dalam perkataan Yesus
  choice: Mempertahankan gambaran tubuh, terang, gelap, dan pelita tanpa menjelaskannya sebagai pernyataan langsung tentang jiwa atau keadaan moral.
  alternative: Memparafrasakannya sebagai seluruh kehidupan batin atau keadaan rohani seseorang.
  rationale: Konteks sebelumnya memakai mata sebagai pelita tubuh. Terjemahan sebaiknya membiarkan pembaca mengikuti metafora dan ketegangan teologis teks tanpa memasukkan penafsiran doktrinal ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Pelita' dipilih karena sesuai dengan benda dunia kuno dan tetap dikenal luas. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
