  naturalness: Teks revisi menggunakan susunan baku dan alami dalam bahasa Indonesia modern. “Lalu berkata” menyampaikan hubungan partisipial dengan jelas tanpa memberi nuansa sebab-akibat yang tidak ada dalam teks Yunani.
  terminology: “Kerajaan,” “pikiran,” dan “rumah” sudah tepat. Catatan kaki direvisi karena “karena melawan” mengubah relasi ἐπί menjadi sebab dan menambahkan gagasan pertentangan yang tidak dinyatakan dalam klausa kedua.
