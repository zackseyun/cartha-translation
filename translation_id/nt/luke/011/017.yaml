  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: id
  text: Namun, Yesus mengetahui pikiran mereka, lalu berkata kepada mereka, “Setiap kerajaan yang terpecah-belah karena melawan dirinya sendiri akan hancur, dan rumah yang satu akan runtuh menimpa rumah yang lain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rumah tangga yang satu jatuh menimpa rumah tangga yang lain.” Kata Yunani οἶκος dapat berarti bangunan rumah ataupun rumah tangga/keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: karena mengetahui
  rationale: Partisip ini menyatakan bahwa Yesus mengetahui pikiran mereka ketika ia menanggapi; bentuk ini mempertahankan hubungan dengan verba utama secara alami dalam bahasa Indonesia.
- source_word: διανοήματα
  choice: pikiran
  rationale: Kata ini menunjuk pada pemikiran atau pertimbangan batin tanpa harus menentukan bahwa yang dimaksud khususnya niat jahat.
- source_word: Πᾶσα βασιλεία
  choice: Setiap kerajaan
  rationale: Mempertahankan daya distributif πᾶσα dan bentuk pepatah umum.
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: yang terpecah dan saling melawan
  rationale: Ungkapan ini menggambarkan perpecahan internal yang menjadi pertentangan; terjemahan ini menyampaikan kedua unsur itu secara jelas dan wajar.
- source_word: ἐρημοῦται
  choice: akan hancur
  rationale: Dalam pepatah ini verba tersebut menyatakan akibat berupa kebinasaan atau kehancuran. Bentuk masa depan idiomatis dalam bahasa Indonesia untuk konsekuensi umum, meskipun bentuk Yunani adalah kini pasif.
- source_word: οἶκος ἐπὶ οἶκον
  choice: rumah yang satu ... menimpa rumah yang lain
  rationale: Mempertahankan citra konkret rumah dan relasi ἐπί dengan bentuk Indonesia yang dapat dipahami, sambil tidak menutup kemungkinan bahwa οἶκος berarti rumah tangga.
- source_word: πίπτει
  choice: akan runtuh
  rationale: Menyampaikan metafora jatuh atau roboh dan selaras dengan bentuk pepatah konsekuensial dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan subjek αὐτός
  choice: Yesus
  alternative: ia
  rationale: Bahasa Indonesia sering memerlukan penyebutan kembali nama untuk kejelasan pada ayat yang berdiri sendiri; konteks mengidentifikasi subjek sebagai Yesus, tanpa menambahkan klaim teologis.
- issue: Makna οἶκος dalam klausa kedua
  choice: rumah
  alternative: rumah tangga atau keluarga
  rationale: Makna fisik mempertahankan citra dan ambiguitas ungkapan Yunani yang padat. Makna sosial tetap dicatat dalam catatan kaki.
- issue: Aspek ἐρημοῦται dan πίπτει dalam pepatah
  choice: akan hancur ... akan runtuh
  alternative: menjadi tandus ... runtuh
  rationale: Bentuk 'akan' secara alami menyatakan akibat yang selalu berlaku dalam pepatah Indonesia, tanpa dimaksudkan sebagai prediksi eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan pepatah dibuat alami bagi pembaca umum, sedangkan ambiguitas οἶκος dipertahankan melalui catatan kaki.
