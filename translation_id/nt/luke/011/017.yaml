  - severity: low
    issue: Catatan kaki menerjemahkan ἐπί sebagai “karena melawan.”
    rationale: Klausa Yunani mempertahankan gambaran jatuh “menimpa/terhadap”; catatan tersebut mengubahnya menjadi hubungan sebab dan menambahkan “melawan.”
  - severity: low
