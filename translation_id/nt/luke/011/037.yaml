- from: Ketika Yesus sedang berbicara, seorang Farisi meminta-Nya makan bersamanya; lalu Yesus masuk dan mengambil tempat dengan berbaring di meja makan.[a]
  to: Ketika Yesus sedang berbicara, seorang Farisi mengundang Yesus untuk makan bersamanya; lalu Yesus masuk dan berbaring untuk makan.[a]
  rationale: Revisi mengganti ungkapan undangan yang tidak idiomatis dengan "mengundang ... untuk makan" dan menghilangkan kesan bahwa Yesus berbaring di atas meja. Bentuk "berbaring untuk makan" mempertahankan makna ἀνέπεσεν, sementara catatan [a] menjelaskan kebiasaan makan tersebut. Pengulangan nama "Yesus" menjaga rujukan tetap jelas dalam bahasa Indonesia.
