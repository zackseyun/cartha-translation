  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: id
  text: Ketika Yesus sedang berbicara, seorang Farisi mengundang Yesus untuk makan bersamanya; lalu Yesus masuk dan berbaring untuk makan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pada masa itu, orang biasanya makan dalam jamuan resmi dengan berbaring menyamping di dekat meja.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Ketika Yesus sedang berbicara
  rationale: Konstruksi ἐν dengan infinitif berartikel menyatakan waktu yang bersamaan. Subjek tersirat diperjelas sebagai Yesus agar alami dalam bahasa Indonesia.
- source_word: ἐρωτᾷ
  choice: meminta
  rationale: Kata ini pada dasarnya berarti meminta; maksud undangan makan dinyatakan oleh klausa berikutnya. Bentuk kini historis dialihkan ke bentuk naratif Indonesia tanpa penandaan waktu khusus.
- source_word: Φαρισαῖος
  choice: seorang Farisi
  rationale: Padanan baku bagi sebutan kelompok tersebut; bentuk tunggal tanpa artikel secara alami diterjemahkan dengan 'seorang'.
- source_word: ὅπως ἀριστήσῃ
  choice: makan
  rationale: ἀριστάω dapat menunjuk makan pagi atau santapan pada bagian awal hari. 'Makan' mempertahankan ketidakpastian mengenai waktu santapan tanpa terdengar janggal.
- source_word: παρ’ αὐτῷ
  choice: bersamanya
  rationale: Menerjemahkan relasi 'dengan dia/di tempatnya' tanpa secara eksplisit menambahkan rumah yang tidak disebutkan dalam bahasa Yunani.
- source_word: εἰσελθὼν
  choice: masuk
  rationale: Partisip aoris menyatakan tindakan yang mendahului verba utama dan alami dirangkai sebagai tindakan berurutan.
- source_word: ἀνέπεσεν
  choice: mengambil tempat dengan berbaring di meja makan
  rationale: Verba ini merujuk pada postur berbaring untuk bersantap menurut kebiasaan masa itu, bukan sekadar duduk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Nama Yesus dipakai untuk memperjelas dua pronomina yang dalam bahasa Indonesia dapat membingungkan. Ungkapan tentang santapan dibuat umum karena teks Yunani tidak memastikan apakah itu makan pagi atau makan pada waktu lain.
