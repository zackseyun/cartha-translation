review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok terjaga: seorang Farisi mengajak Yesus makan bersamanya; Yesus masuk lalu mengambil postur bersantap dengan berbaring. Namun, frasa Indonesia "berbaring di meja makan" secara harfiah dapat berarti berbaring di atas meja, bukan bersandar/berbaring pada tempat makan sebagaimana ἀνέπεσεν.'
  naturalness: '"Meminta-Nya makan bersamanya" tidak idiomatis dalam bahasa Indonesia modern dan dapat terdengar seperti Farisi itu meminta Yesus melakukan tindakan makan, bukan mengundang-Nya. "Mengundang Yesus untuk makan bersamanya" menyampaikan fungsi ἐρωτᾷ dalam konteks ini secara alami.'
  terminology: '"Farisi" tepat. "Makan" dengan sengaja tidak menentukan waktu santapan dan sesuai dengan rentang makna ἀριστήσῃ. Catatan budaya dengan jangkar [a] tepat dan mendukung penerjemahan postur makan.'
  issues:
