    issue: '"meminta-Nya makan bersamanya" tidak alami dan berpotensi ambigu.'
    rationale: Dalam pemakaian Indonesia, "meminta seseorang makan" tidak lazim untuk menyatakan undangan. Konteks klausa tujuan ὅπως ἀριστήσῃ memperjelas bahwa Farisi itu mengundang Yesus makan.
  - severity: high
    issue: '"berbaring di meja makan" secara spasial keliru/ambigu.'
    rationale: Ungkapan ini lazim dipahami sebagai berbaring di atas permukaan meja. ἀνέπεσεν menunjuk postur bersandar atau berbaring untuk bersantap, bukan lokasi di atas meja.
  revised_text: Ketika Yesus sedang berbicara, seorang Farisi mengundang Yesus untuk makan bersamanya; lalu Yesus masuk dan berbaring untuk makan.[a]
