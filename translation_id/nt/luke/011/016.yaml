  verdict: revise
  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama teks Yunani: kelompok lain, tindakan menguji Yesus, permintaan akan tanda, asal surgawi tanda itu, dan Yesus sebagai pihak yang dimintai. Namun, "beberapa orang lain" menambahkan pembatasan "beberapa" yang tidak dinyatakan oleh ἕτεροι, dan "menguji Dia dengan meminta" agak mengaburkan hubungan maksud antara partisipel πειράζοντες dan permintaan mereka.'
  naturalness: Bahasa draft pada dasarnya baku dan jelas, tetapi "orang-orang lain" lebih alami sebagai padanan plural ἕτεροι. Susunan "untuk menguji Dia" juga lebih langsung dan idiomatis untuk menyatakan motif bermusuhan yang terkandung dalam πειράζοντες.
  terminology: '"tanda dari surga" adalah padanan yang baik untuk σημεῖον ἐξ οὐρανοῦ dan tetap tidak memutuskan apakah yang dimaksud ialah asal tanda atau sifatnya sebagai tanda surgawi. "Meminta kepada-Nya" secara idiomatis menyampaikan παρ’ αὐτοῦ. Catatan alternatif "suatu tanda surgawi" layak dipertahankan.'
