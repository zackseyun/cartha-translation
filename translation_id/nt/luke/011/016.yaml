    rationale: Frasa "menguji Dia dengan meminta" dapat dipahami sebagai cara menguji, tetapi "untuk menguji Dia, ... meminta" lebih jelas menyatakan fungsi/motif partisipel πειράζοντες dalam konteks ini.
