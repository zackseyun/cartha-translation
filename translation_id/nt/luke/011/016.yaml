  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: id
  text: Namun, orang-orang lain, untuk menguji Dia, meminta kepada-Nya suatu tanda dari surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suatu tanda surgawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: beberapa orang lain
  rationale: Menandai kelompok lain yang berbeda dari para penentang yang disebut sebelumnya; bentuk ini alami dalam bahasa Indonesia.
- source_word: δὲ
  choice: Namun
  rationale: Menyatakan peralihan dengan nuansa pertentangan ringan dalam konteks.
- source_word: πειράζοντες
  choice: menguji Dia
  rationale: Partisipel ini menunjukkan tindakan menguji Yesus dengan maksud yang tidak bersahabat; 'menguji' tidak mempersempit makna menjadi godaan moral.
- source_word: σημεῖον
  choice: suatu tanda
  rationale: Mempertahankan istilah umum Yunani tanpa menambahkan kata 'mukjizat', meskipun konteks menyiratkan tanda adikodrati.
- source_word: ἐξ οὐρανοῦ
  choice: dari surga
  rationale: Secara langsung menyatakan asal atau pengesahan surgawi dari tanda yang diminta.
- source_word: ἐζήτουν
  choice: meminta
  rationale: Dalam konstruksi ini, kata tersebut berarti mengupayakan atau meminta sesuatu dari seseorang; 'meminta' paling alami dalam bahasa Indonesia. Bentuk imperfek dipadukan dengan partisipel menjadi konstruksi verbal yang mengalir.
- source_word: παρ’ αὐτοῦ
  choice: kepada-Nya
  rationale: Dalam idiom Indonesia, pihak yang menjadi sumber permintaan lazim dinyatakan dengan 'meminta kepada-Nya'; makna sumber tetap terpelihara.
theological_decisions:
- issue: Sifat tanda yang diminta
  choice: suatu tanda dari surga
  alternative: suatu tanda surgawi
  rationale: Terjemahan ini mempertahankan kemungkinan bahwa frasa tersebut menunjuk pada asal atau pengesahan dari surga, tanpa menentukan bentuk tanda itu atau menambahkan klaim teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan tindakan menguji, permintaan kepada Yesus, dan asal surgawi dari tanda tersebut.
