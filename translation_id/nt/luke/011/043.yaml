  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: id
  text: Celakalah kamu, orang-orang Farisi, karena kamu menyukai tempat duduk terhormat[a] di sinagoge-sinagoge dan salam[b] di pasar-pasar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat-tempat duduk utama” atau “tempat-tempat kehormatan.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah salam di muka umum yang menyatakan penghormatan dan pengakuan sosial.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Celakalah
  rationale: Mempertahankan daya kecaman profetis dari kata seru Yunani, bukan sekadar ungkapan kesedihan.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: kalian, orang-orang Farisi
  rationale: Menyampaikan sapaan langsung kepada kelompok tersebut dengan bentuk jamak yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ὅτι
  choice: karena
  rationale: Secara jelas memperkenalkan alasan bagi ucapan celaka itu.
- source_word: ἀγαπᾶτε
  choice: kalian menyukai
  rationale: Dalam konteks ini kata tersebut menyatakan kegemaran atau hasrat kuat terhadap pengakuan sosial; 'menyukai' terdengar alami tanpa memberi kesan bahwa yang dimaksud ialah kasih dalam arti teologis.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: tempat duduk terhormat
  rationale: Mengungkapkan tempat duduk utama yang menandakan kedudukan dan kehormatan di rumah ibadat.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: di rumah-rumah ibadat
  rationale: Istilah ini alami bagi pembaca Indonesia dan menunjuk tempat pertemuan serta ibadah Yahudi; bentuk jamak sumber dipertahankan.
- source_word: τοὺς ἀσπασμοὺς
  choice: salam penghormatan
  rationale: Bukan hanya salam biasa, melainkan sapaan di muka umum yang mengakui kedudukan seseorang; unsur penghormatan dibuat jelas secara ringkas.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: di pasar-pasar
  rationale: Mempertahankan latar ruang publik yang menjadi pusat kegiatan pasar dan interaksi sosial pada masa itu.
theological_decisions:
- issue: Sifat kecaman Yesus
  choice: Ucapan celaka profetis terhadap kecintaan orang Farisi akan kehormatan publik.
  alternative: Sekadar kritik sosial terhadap tata krama yang buruk.
  rationale: οὐαί beserta alasan yang mengikutinya membentuk kecaman moral dan rohani. Terjemahan mempertahankan daya ini tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai untuk memperjelas sapaan jamak, sedangkan 'orang-orang Farisi' menjaga kelancaran sapaan langsung. Istilah konkret dipertahankan, dengan keterangan budaya yang diperlukan ditempatkan dalam catatan kaki.
