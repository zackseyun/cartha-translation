  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: id
  text: Aku berkata kepadamu, sekalipun ia tidak akan bangun dan memberikan sesuatu kepadanya karena orang itu sahabatnya, namun karena kegigihannya yang tidak tahu malu, ia akan bangun dan memberikan kepadanya segala yang diperlukannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “kegigihannya yang tidak tahu malu” juga dapat berarti “keberaniannya,” “kelancangannya,” atau, secara lebih harfiah, “sikapnya yang tidak tahu malu.” Kata ganti “-nya” dapat dipahami merujuk kepada orang yang meminta, dan mungkin juga kepada orang di dalam rumah yang hendak menghindari rasa malu.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepadamu
  rationale: Formula langsung dalam perkataan Yesus; bentuk ini alami, bermartabat, dan mempertahankan sapaan orang kedua jamak yang tidak dibedakan dalam bahasa Indonesia.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: sekalipun ia tidak mau bangun dan memberikan sesuatu kepadanya
  rationale: εἰ καί bersifat konsesif. Dalam konteks cerita, bentuk futuris paling alami dipahami sebagai keengganan, sehingga 'tidak mau' mengungkapkan alur retoris tanpa mengubah tindakan konkret 'bangun'.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: karena orang itu sahabatnya
  rationale: Mempertahankan hubungan personal φίλον αὐτοῦ dan menghindari kejanggalan rujukan pronomina ganda dalam bahasa Indonesia.
- source_word: διά γε
  choice: ia tetap ... karena
  rationale: 'Partikel γε menegaskan kontras: persahabatan mungkin tidak menggerakkannya, tetapi alasan berikutnya akan menggerakkannya.'
- source_word: ἀναίδειαν
  choice: kegigihannya yang tidak tahu malu
  rationale: ἀναίδεια secara leksikal menunjuk pada ketiadaan rasa malu atau sikap tidak mengindahkan kepantasan. 'Kegigihan' menjelaskan daya pragmatis dalam konteks, sedangkan 'tidak tahu malu' mempertahankan sisi tajam istilah Yunani.
- source_word: ἐγερθεὶς
  choice: akan bangun
  rationale: Dalam adegan rumah tangga ini, partisip dari ἐγείρω menunjuk pada tindakan bangun dari tempat tidur dan secara alami diterjemahkan dengan verba utama.
- source_word: ὅσων χρῄζει
  choice: apa pun yang dibutuhkannya
  rationale: 'Menyampaikan cakupan penuh dari bentuk relatif jamak: semua yang diperlukan oleh orang yang meminta.'
- source_word: objek tersirat sesudah δώσει pada klausa pertama
  choice: sesuatu
  rationale: Bahasa Indonesia memerlukan objek yang lebih eksplisit agar klausa 'memberikan' terdengar lengkap; konteks dan klausa terakhir menyediakan acuannya.
theological_decisions:
- issue: Makna ἀναίδεια dalam perumpamaan
  choice: kegigihan orang yang meminta yang tidak dibatasi rasa malu
  alternative: keberanian; kelancangan; sikap tidak tahu malu, atau kemungkinan sikap menghindari malu dari orang yang berada di dalam rumah
  rationale: Terjemahan mempertahankan konotasi negatif-leksikal 'tidak tahu malu' sekaligus menunjukkan fungsi kontekstualnya sebagai kegigihan. Rujukan pronomina Yunani secara tata bahasa dapat dikaitkan dengan salah satu tokoh, meskipun alur lazim menghubungkannya dengan si peminta; catatan kaki menjaga ambiguitas yang nyata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lisan yang bermartabat. 'Aku' dipakai untuk tuturan langsung Yesus; 'sahabat' mempertahankan hubungan personal. Susunan kalimat dibuat alami tanpa menghilangkan kontras konsesif atau ketajaman ἀναίδεια.
