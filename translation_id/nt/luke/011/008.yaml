  to: Aku berkata kepadamu, sekalipun ia tidak akan bangun dan memberikan sesuatu kepadanya karena orang itu sahabatnya, namun karena kegigihannya yang tidak tahu malu, ia akan bangun dan memberikan kepadanya segala yang diperlukannya.[a]
  rationale: Revisi menghapus tambahan nuansa kemauan pada klausa pertama, memperjelas kontras konsesif dengan “namun,” dan memakai “segala yang diperlukannya” untuk mencerminkan keluasan ungkapan Yunani. Istilah untuk ἀναίδεια dan catatan kaki dipertahankan karena keduanya menyampaikan nuansa leksikal serta ambiguitas rujukan yang relevan.
