id: LUK.11.29
reference: Luke 11:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: id
  text: Ketika orang banyak makin berkerumun, Ia mulai berkata, “Generasi ini adalah generasi yang jahat. Generasi ini mencari suatu tanda, tetapi tidak ada tanda yang akan diberikan kepadanya selain tanda Yunus.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “tanda Yunus” dapat menunjuk kepada Yunus sendiri sebagai tanda melalui misi kenabiannya. Berdasarkan bagian-bagian sejajar dalam Injil, ungkapan ini juga dapat membangkitkan kaitan tipologis dengan kematian dan kebangkitan Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: makin berkerumun
  rationale: Partisipel kini dalam konstruksi genitif absolut menunjukkan tindakan yang sedang berlangsung bersamaan dengan tindakan utama. Ungkapan ini juga menyampaikan nuansa orang banyak yang terus berhimpun.
- source_word: ἤρξατο λέγειν
  choice: mulai berkata
  rationale: Konstruksi inkoatif ini secara alami mempertahankan makna bahwa Ia mulai berbicara.
- source_word: γενεά
  choice: generasi
  rationale: Kata ini mempertahankan cakupan temporal sekaligus kolektif dari penilaian Yesus terhadap orang-orang sezaman-Nya.
- source_word: πονηρά
  choice: jahat
  rationale: Pilihan ini lugas, mudah dipahami, dan mempertahankan kerasnya penilaian moral dalam teks.
- source_word: σημεῖον
  choice: tanda
  rationale: Kata 'tanda' mempertahankan makna sesuatu yang mengesahkan atau menunjuk pada karya Allah tanpa menambahkan kata 'mukjizat' yang tidak tersurat.
- source_word: ζητεῖ
  choice: mencari
  rationale: Ini mengikuti arti dasar verba Yunani dan tidak secara eksplisit memperkerasnya menjadi 'menuntut', meskipun konteks menunjukkan sikap yang tercela.
- source_word: δοθήσεται
  choice: akan diberikan
  rationale: Bentuk pasif masa depan diterjemahkan secara langsung dan alami.
- source_word: εἰ μὴ
  choice: selain
  rationale: Dalam pernyataan negatif yang bersifat pengecualian, 'selain' merupakan padanan Indonesia yang tepat dan alami.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: tanda Yunus
  rationale: Bentuk ini mempertahankan hubungan genitif yang terbuka dalam bahasa Yunani sehingga identitas dan sifat tanda itu tidak ditentukan secara berlebihan oleh terjemahan.
theological_decisions:
- issue: Cakupan kecaman terhadap 'generasi ini'
  choice: Penilaian moral kolektif terhadap orang-orang sezaman dengan Yesus, tanpa memperlunak kecaman tersebut.
  alternative: Rujukan yang dibatasi hanya pada lawan-lawan tertentu yang hadir.
  rationale: Pengulangan 'generasi ini ... generasi yang jahat' menegaskan kecaman kolektif yang luas. Terjemahan tidak mempersempit acuannya melampaui teks Yunani.
- issue: Makna 'tanda Yunus'
  choice: Ungkapan genitif dipertahankan tanpa dijabarkan dalam teks utama.
  alternative: Secara eksplisit menafsirkannya sebagai pelayanan kenabian Yunus atau sebagai gambaran kematian dan kebangkitan Yesus.
  rationale: Konteks langsung Lukas menjelaskan Yunus sebagai tanda, sedangkan kesejajaran dalam Injil lain dapat membangkitkan hubungan tipologis dengan kematian dan kebangkitan Yesus. Teks utama mempertahankan keterbukaan ungkapan aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Generasi' dipilih karena lebih umum dalam pemakaian masa kini daripada 'angkatan', sedangkan pengulangan frasa dipertahankan untuk mencerminkan penekanan teks Yunani. Kata ganti 'Ia' mengikuti subjek yang tersirat dalam konteks dan merujuk kepada Yesus.
