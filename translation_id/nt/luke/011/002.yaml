id: LUK.11.2
reference: Luke 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: id
  text: 'Ia berkata kepada mereka, “Apabila kamu berdoa, katakanlah: ‘Bapa,[a] dikuduskanlah nama-Mu.[b] Datanglah Kerajaan-Mu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah tradisi menerjemahkan atau membaca “Bapa kami,” selaras dengan Matius 6:9, tetapi teks Yunani di sini hanya berbunyi “Bapa.”
    reason: alternative_reading
  - marker: b
    text: 'Atau: “Kiranya nama-Mu diperlakukan sebagai kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Apabila kalian berdoa
  rationale: Ὅταν dengan bentuk subjungtif menyatakan keadaan umum atau berulang. 'Apabila' alami dalam bahasa Indonesia dan tidak membatasi perkataan ini pada satu kesempatan.
- source_word: λέγετε
  choice: katakanlah
  rationale: Imperatif kini ini memberi petunjuk mengenai apa yang harus diucapkan dalam doa; bentuk sederhana ini paling alami dalam bahasa Indonesia.
- source_word: Πάτερ
  choice: Bapa
  rationale: Vokatif Yunani hanya berbunyi 'Bapa', tanpa 'kami'; terjemahan tidak diselaraskan dengan Matius 6:9.
- source_word: ἁγιασθήτω
  choice: dimuliakanlah
  rationale: Dalam kaitannya dengan nama Allah, ungkapan ini memohon agar nama-Nya diakui dan diperlakukan sebagai kudus. 'Dimuliakanlah' merupakan ungkapan doa yang alami dan bermartabat dalam bahasa Indonesia; catatan kaki mempertahankan alternatif yang lebih langsung secara leksikal.
- source_word: τὸ ὄνομά σου
  choice: nama-Mu
  rationale: Mempertahankan ungkapan sumber, yang mencakup identitas, kehormatan, dan reputasi Allah tanpa menjabarkannya di dalam teks.
- source_word: ἐλθέτω
  choice: Datanglah
  rationale: Imperatif aoristus dipertahankan sebagai permohonan langsung dalam bahasa doa Indonesia.
- source_word: ἡ βασιλεία σου
  choice: Kerajaan-Mu
  rationale: βασιλεία dapat menunjuk pada pemerintahan, kekuasaan sebagai raja, atau kerajaan. 'Kerajaan' mempertahankan istilah Injil yang mapan beserta keluasan maknanya.
theological_decisions:
- issue: Sapaan kepada Allah tanpa kata 'kami'
  choice: Bapa
  alternative: Bapa kami
  rationale: Teks SBLGNT yang diberikan hanya memuat Πάτερ. Menambahkan 'kami' akan menyelaraskannya dengan Matius 6:9 dan tidak mengikuti bentuk Lukas di sini.
- issue: Makna ἁγιασθήτω τὸ ὄνομά σου
  choice: dimuliakanlah nama-Mu
  alternative: dikuduskanlah nama-Mu
  rationale: Pilihan utama menyampaikan permohonan agar nama Allah dihormati sebagai kudus, tanpa menyiratkan bahwa nama-Nya sebelumnya tidak kudus. Alternatif yang lebih harfiah dicatat agar nuansa pasif dan bahasa kekudusan tetap terlihat.
- issue: Makna βασιλεία
  choice: Kerajaan-Mu
  alternative: pemerintahan-Mu
  rationale: Terjemahan 'Kerajaan' tidak mempersempit βασιλεία hanya menjadi wilayah atau hanya menjadi tindakan memerintah, sehingga ketegangan maknanya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' memperjelas bahwa kata ganti Yunani berbentuk jamak. Kapitalisasi pada kata ganti ilahi dan 'Kerajaan-Mu' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda catatan kaki ditempatkan tepat sesudah frasa yang diterangkannya.
