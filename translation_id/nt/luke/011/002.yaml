  naturalness: “Ia berkata kepada mereka” dan “Apabila kamu berdoa, katakanlah” adalah bahasa Indonesia baku, jelas, dan tetap sesuai untuk ujaran kepada kelompok. Bentuk doa “dikuduskanlah nama-Mu” mapan dan khidmat tanpa menjadi tidak alami.
  terminology: “Bapa” dengan tepat mempertahankan vokatif Πάτερ tanpa menambahkan “kami.” “Kerajaan-Mu” merupakan padanan Injil yang lazim dan cukup luas untuk βασιλεία. “Dikuduskanlah” mempertahankan medan makna kekudusan dari ἁγιασθήτω lebih baik daripada “dimuliakanlah.”
