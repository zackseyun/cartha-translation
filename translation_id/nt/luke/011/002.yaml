  rationale: Revisi menghapus nama yang tidak dinyatakan dalam ayat sumber dan mengganti “dimuliakanlah” dengan “dikuduskanlah” agar makna ἁγιασθήτω dipertahankan. Catatan pada “Bapa” menjelaskan bentuk pendek dalam Lukas tanpa mengharmoniskannya dengan Matius, dan catatan kedua menjelaskan daya makna ungkapan kekudusan tanpa mengembangkan makna itu dalam teks utama.
