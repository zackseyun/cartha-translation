  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: id
  text: Dan ampunilah dosa-dosa kami, sebab kami sendiri juga mengampuni setiap orang yang berutang kepada kami.[a] Dan janganlah membawa kami ke dalam pencobaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani memakai bahasa utang di sini, meskipun klausa pertama mengatakan “dosa-dosa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ujian” atau “masa pencobaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: ampunilah
  rationale: Dalam konteks doa kepada Allah, bentuk imperatif ini secara alami berarti memohon pengampunan; bentuk dengan -lah sesuai dengan permohonan yang khidmat dan langsung.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: dosa-dosa kami
  rationale: ἁμαρτίας secara eksplisit berarti dosa-dosa, bukan utang; bentuk ulang alami dalam bahasa Indonesia untuk nomina jamak yang tidak diberi angka.
- source_word: καὶ γὰρ αὐτοὶ
  choice: sebab kami sendiri juga
  rationale: Sebab menyatakan dasar bagi permohonan sebelumnya, sementara kami sendiri mempertahankan penekanan αὐτοὶ dan juga mencerminkan καί.
- source_word: ἀφίομεν
  choice: mengampuni
  rationale: Mengampuni mempertahankan hubungan verbal dengan ἄφες dan sesuai untuk relasi antarmanusia dalam konteks ini.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: setiap orang yang berutang kepada kami
  rationale: Ungkapan ini mempertahankan bahasa utang dalam teks Yunani sekaligus terdengar alami dalam bahasa Indonesia; perbedaannya dari dosa-dosa pada klausa pertama tetap terlihat.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: janganlah membawa kami ke dalam pencobaan
  rationale: Membawa ... ke dalam dekat dengan makna εἰσφέρω dan tidak menggantinya dengan ungkapan tradisional yang lebih tidak langsung. Pencobaan dipakai dalam teks utama, sedangkan cakupan makna ujian dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna permohonan mengenai πειρασμός dan tindakan Allah
  choice: janganlah membawa kami ke dalam pencobaan
  alternative: janganlah membawa kami ke dalam ujian
  rationale: Terjemahan mempertahankan bentuk tegas teks Yunani tanpa melunakkan atau menjelaskan hubungan Allah dengan pencobaan. Ambiguitas πειρασμός sebagai pencobaan atau ujian dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “ampunilah” dan “janganlah” cocok untuk doa tanpa terdengar kuno. Struktur antarklausa mempertahankan pengulangan dan ketegangan teks sumber.
