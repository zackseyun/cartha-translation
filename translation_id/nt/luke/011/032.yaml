id: LUK.11.32
reference: Luke 11:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: id
  text: Kaum lelaki Niniwe akan bangkit pada waktu penghakiman bersama angkatan ini dan akan menghukum angkatan ini, sebab mereka bertobat terhadap pemberitaan Yunus. Dan lihatlah, sesuatu yang lebih besar daripada Yunus ada di sini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Seorang yang lebih besar daripada Yunus ada di sini” atau “Yang melebihi Yunus ada di sini.” Bahasa Yunani memakai bentuk netral (“sesuatu yang lebih besar/lebih daripada”), yang mungkin menunjuk secara luas kepada kenyataan yang lebih besar yang hadir dalam diri dan pelayanan Yesus, bukan hanya kepada perbandingan antarpribadi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Orang-orang Niniwe
  rationale: Ungkapan ini menunjuk kepada para lelaki Niniwe. Dalam bahasa Indonesia, 'orang-orang Niniwe' merupakan sebutan gentilis yang paling wajar; bentuk Yunani tetap dicatat tanpa menghasilkan frasa kaku seperti 'laki-laki Niniwe'.
- source_word: ἀναστήσονται
  choice: akan bangkit
  rationale: Mempertahankan gambaran bangkit dalam suasana penghakiman akhir tanpa mempersempitnya secara eksplisit menjadi 'akan dibangkitkan'.
- source_word: ἐν τῇ κρίσει
  choice: pada waktu penghakiman
  rationale: Menyampaikan latar peristiwa pengadilan secara alami dalam bahasa Indonesia; κρίσις di sini adalah penghakiman, bukan semata-mata penghukuman.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: bersama angkatan ini
  rationale: Mempertahankan arti penyertaan dari μετά dan ungkapan khas Injil tentang 'angkatan ini'.
- source_word: κατακρινοῦσιν αὐτήν
  choice: akan menghukumnya
  rationale: κατακρίνω berarti menyatakan bersalah atau menghukum, lebih kuat daripada sekadar 'menghakimi'; akhiran '-nya' merujuk kepada angkatan ini.
- source_word: μετενόησαν
  choice: mereka bertobat
  rationale: Dalam konteks kenabian, kata ini menyatakan pertobatan moral dan rohani, bukan hanya perubahan pikiran.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: ketika mendengar pemberitaan Yunus
  rationale: Menyatakan tanggapan mereka terhadap pesan yang diberitakan Yunus secara alami, tanpa mengubah κήρυγμα menjadi pribadi Yunus sendiri.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Penanda wacana yang mengarahkan perhatian secara tegas dan tetap wajar dalam ragam Alkitab Indonesia modern.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: sesuatu yang lebih besar daripada Yunus ada di sini
  rationale: Bentuk netral πλεῖον dipertahankan sebagai 'sesuatu yang lebih besar', sehingga tidak diam-diam diubah menjadi perbandingan maskulin yang hanya menunjuk pribadi.
theological_decisions:
- issue: Acuan dan cakupan πλεῖον Ἰωνᾶ
  choice: sesuatu yang lebih besar daripada Yunus ada di sini
  alternative: seorang yang lebih besar daripada Yunus ada di sini; yang melebihi Yunus ada di sini
  rationale: Bentuk Yunani πλεῖον bersifat netral. Terjemahan utama mempertahankan kemungkinan bahwa ungkapan itu mencakup bukan hanya pribadi Yesus, tetapi juga kenyataan lebih besar yang hadir dalam diri dan pelayanan-Nya, tanpa menyangkal bahwa Yesus menjadi pusat acuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. 'Angkatan ini', 'bertobat', dan 'penghakiman' mempertahankan bobot teologis serta hubungan dengan ungkapan Injil yang lazim. Penanda catatan kaki ditempatkan langsung setelah klausa yang dijelaskannya.
