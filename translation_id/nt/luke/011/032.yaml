revisions:
- from: Orang-orang Niniwe akan bangkit pada waktu penghakiman bersama angkatan ini dan akan menghukumnya, sebab mereka bertobat ketika mendengar pemberitaan Yunus. Dan lihatlah, sesuatu yang lebih besar daripada Yunus ada di sini.[a]
  to: Kaum lelaki Niniwe akan bangkit pada waktu penghakiman bersama angkatan ini dan akan menghukum angkatan ini, sebab mereka bertobat terhadap pemberitaan Yunus. Dan lihatlah, sesuatu yang lebih besar daripada Yunus ada di sini.[a]
  rationale: Revisi mempertahankan penanda maskulin ἄνδρες, memperdekat hubungan εἰς dengan pemberitaan Yunus tanpa tambahan yang tidak diperlukan, dan memperjelas objek κατακρινοῦσιν. Bentuk netral πλεῖον serta ambiguitas cakupannya tetap dipelihara dalam teks dan catatan kaki.
  reviewer_model: gpt-5.6-terra
