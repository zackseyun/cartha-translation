  naturalness: “Kaum lelaki Niniwe” adalah bahasa Indonesia baku yang jelas dalam register Alkitabiah. “Pada waktu penghakiman,” “angkatan ini,” dan “lihatlah” tetap alami serta khidmat. Mengulang “angkatan ini” sesudah “menghukum” menghindari rujukan pronominal yang kurang tegas.
  terminology: “Penghakiman,” “bertobat,” dan “pemberitaan” tepat bagi κρίσις, μετενόησαν, dan κήρυγμα. “Sesuatu yang lebih besar daripada Yunus” mempertahankan bentuk netral πλεῖον dan tidak memutuskan secara doktrinal bahwa acuannya hanya pribadi.
  issues:
