    issue: Penanda maskulin ἄνδρες tidak tercermin dalam “Orang-orang Niniwe.”
    rationale: Teks Yunani menyebut “laki-laki/kaum lelaki Niniwe” secara eksplisit. Terjemahan netral dapat dipahami lebih luas daripada bentuk sumber.
  - severity: low
    issue: “Ketika mendengar pemberitaan Yunus” menambahkan unsur mendengar.
    rationale: Unsur itu selaras konteks, tetapi tidak dinyatakan oleh εἰς. “Bertobat terhadap pemberitaan Yunus” menyampaikan relasi tanggapan dengan lebih dekat.
  - severity: low
    issue: Catatan kaki menerangkan πλεῖον sebagai “sesuatu yang lebih besar/lebih banyak.”
    rationale: Dalam konteks perbandingan ini, “lebih besar” atau “lebih daripada” lebih tepat dan tidak menimbulkan kesan kuantitas ‘lebih banyak’.
