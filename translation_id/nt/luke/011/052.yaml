base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: id
  text: Celakalah kalian, para ahli Taurat,[a] sebab kalian telah menyingkirkan kunci pengetahuan; kalian sendiri tidak masuk, dan kalian menghalangi orang-orang yang sedang masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para ahli hukum”; yang dimaksud ialah para pakar hukum Taurat Yahudi, bukan pengacara dalam pengertian modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Celakalah
  rationale: Mempertahankan daya kecaman profetis dalam seruan Yunani, bukan sekadar ungkapan kesedihan.
- source_word: νομικοῖς
  choice: para ahli Taurat
  rationale: Dalam konteks ini menunjuk kepada para pakar hukum Musa, bukan pengacara sipil modern. Istilah ini lazim dan mudah dipahami dalam bahasa Indonesia Alkitabiah.
- source_word: ἤρατε
  choice: telah mengambil
  rationale: Menyampaikan tindakan menyingkirkan atau mengambil kunci sehingga akses orang lain terhalang, tanpa membuat metafora terlalu eksplisit.
- source_word: κλεῖδα τῆς γνώσεως
  choice: kunci pengetahuan
  rationale: Secara dekat mempertahankan konstruksi genitif dan metafora sumber; hubungan tepat antara kunci dan pengetahuan dibiarkan tersirat.
- source_word: αὐτοὶ
  choice: kalian sendiri
  rationale: Mempertahankan penekanan pada subjek dan kontras dengan orang-orang lain yang sedang masuk.
- source_word: οὐκ εἰσήλθατε
  choice: tidak masuk
  rationale: Mempertahankan metafora masuk tanpa menambahkan objek yang tidak dinyatakan dalam bahasa Yunani.
- source_word: τοὺς εἰσερχομένους
  choice: orang-orang yang sedang masuk
  rationale: Bentuk partisipel kini menyiratkan tindakan yang sedang berlangsung; terjemahan ini tidak menambahkan gagasan bahwa mereka hanya mencoba masuk.
- source_word: ἐκωλύσατε
  choice: menghalangi
  rationale: Menyatakan perintangan tanpa memastikan bahwa usaha mereka sepenuhnya gagal, sehingga tidak melebihkan makna verba Yunani.
theological_decisions:
- issue: Acuan metaforis dari “masuk” dan “kunci pengetahuan”
  choice: Metafora akses dan masuk dipertahankan tanpa menyebutkan objek masuk.
  alternative: Memahaminya sebagai masuk ke dalam Kerajaan Allah atau masuk ke dalam pengetahuan sejati tentang Allah.
  rationale: Teks Yunani tidak secara eksplisit menyebutkan apa yang dimasuki. Terjemahan tidak boleh menutup ketegangan ini dengan menambahkan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Kalian” dipakai untuk mempertahankan bentuk jamak orang kedua secara jelas; “para ahli Taurat” menghindari salah pengertian modern terhadap istilah ahli hukum.
