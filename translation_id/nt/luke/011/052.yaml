review_pass:
  verdict: revise
  source_fidelity: Istilah νομικοῖς diterjemahkan tepat secara kontekstual sebagai “para ahli Taurat,” dan catatan kaki dengan benar mencegah pembacaan sebagai pengacara modern. “Kalian sendiri tidak masuk” mempertahankan penekanan αὐτοί serta membiarkan objek metafora tetap tak tersurat. “Orang-orang yang sedang masuk” menangkap partisipel kini, dan “menghalangi” tidak melebihkan ἐκωλύσατε. Namun, “telah mengambil kunci pengetahuan” dalam bahasa Indonesia dapat berarti sekadar mengambil atau memegang kunci, bukan menyingkirkannya dari akses orang lain. Dalam konteks ini αἴρω menuntut nuansa penghilangan/penyingkiran.
  naturalness: Bahasanya modern, jelas, dan berwibawa. “Kalian” konsisten untuk jamak dan sesuai register. “Menyingkirkan kunci pengetahuan” lebih jelas dan alami dalam konteks tuduhan ini daripada “mengambil kunci pengetahuan.”
  terminology: “Celakalah,” “para ahli Taurat,” dan “kunci pengetahuan” merupakan padanan yang baik. Catatan kaki tepat menjelaskan bahwa “ahli Taurat” merujuk pada pakar hukum Taurat Yahudi, bukan profesi hukum modern.
  issues:
  - severity: medium
    issue: “Telah mengambil” tidak cukup menyatakan nuansa penghilangan pada ἤρατε.
    rationale: Pembaca Indonesia dapat memahami frasa itu sebagai tindakan mengambil kunci untuk diri sendiri tanpa makna menyingkirkannya. “Telah menyingkirkan” menjaga metafora dan dengan lebih baik menyampaikan tindakan merampas akses.
  revised_text: Celakalah kalian, para ahli Taurat,[a] sebab kalian telah menyingkirkan kunci pengetahuan; kalian sendiri tidak masuk, dan kalian menghalangi orang-orang yang sedang masuk.
