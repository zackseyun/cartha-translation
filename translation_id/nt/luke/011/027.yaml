  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: id
  text: Pada suatu ketika, sementara Yesus sedang mengatakan semuanya itu, seorang perempuan dari antara orang banyak mengangkat suaranya dan berkata kepada-Nya, “Berbahagialah rahim yang telah mengandung Engkau dan payudara yang telah menyusui Engkau!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: Ketika Yesus sedang mengatakan hal-hal itu
  rationale: Konstruksi ἐν τῷ dengan infinitif menyatakan tindakan yang berlangsung bersamaan. Rumusan ini menyampaikan transisi naratif Ἐγένετο δὲ secara alami tanpa ungkapan Indonesia yang kaku seperti 'terjadilah bahwa'.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: seorang perempuan ... berseru
  rationale: Ungkapan Yunani secara harfiah berarti 'mengangkat suaranya'. 'Berseru' merupakan padanan Indonesia modern yang alami dan menunjukkan bahwa ia berbicara cukup keras agar terdengar.
- source_word: ἐκ τοῦ ὄχλου
  choice: dari antara orang banyak
  rationale: Menunjukkan bahwa perempuan itu berasal dari kumpulan orang yang sedang hadir; bentuk ini lebih alami daripada 'keluar dari kerumunan' dalam konteks tersebut.
- source_word: Μακαρία
  choice: Betapa berbahagianya
  rationale: Mempertahankan nuansa pernyataan bahwa seseorang berada dalam keadaan yang sangat berbahagia atau diberkati, bukan sekadar mengalami perasaan senang. Bentuk seruan ini alami dalam bahasa Indonesia.
- source_word: ἡ κοιλία ἡ βαστάσασά σε
  choice: rahim yang mengandung engkau
  rationale: Dalam konteks keibuan, κοιλία secara khusus berarti rahim, sedangkan βαστάζω menunjuk pada membawa atau mengandung dalam kehamilan. Terjemahan ini mempertahankan gambaran konkret teks sumber.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: buah dada yang menyusui engkau
  rationale: Mempertahankan gambaran anatomis dan maternal dalam bahasa Yunani. 'Menyusui' menyampaikan makna ἐθήλασας secara wajar dalam bahasa Indonesia, tanpa kelugasan yang terasa janggal.
theological_decisions:
- issue: Makna Μακαρία dalam seruan yang menghormati ibu Yesus
  choice: Betapa berbahagianya rahim yang mengandung engkau, dan buah dada yang menyusui engkau!
  alternative: Diberkatilah rahim yang mengandung engkau ...
  rationale: Terjemahan ini mempertahankan kekuatan penghormatan dalam ucapan perempuan tersebut tanpa menambah atau mengurangi makna teologis mengenai ibu Yesus. Ungkapan konkret 'rahim' dan 'buah dada' juga dibiarkan sebagaimana dalam teks Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Seruan perempuan dibuat alami tanpa menghilangkan gambaran tubuh yang konkret dalam bahasa Yunani. Kata ganti untuk Yesus tidak dikapitalisasi karena kapitalisasi bukan bagian dari teks sumber dan tidak diperlukan untuk menyampaikan penghormatan.
