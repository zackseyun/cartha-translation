  naturalness: Versi revisi tetap alami dalam bahasa Indonesia modern. "Ia sedang mengusir setan bisu" mereproduksi bentuk teks secara langsung, sementara "orang bisu itu" jelas merujuk kepada orang yang disebut secara substantival dalam klausa berikutnya. "Ketika" memberi hubungan temporal yang alami bagi genitif absolut tanpa menambahkan rincian.
  terminology: '"Setan" merupakan padanan yang lazim dan dapat diterima untuk δαιμόνιον dalam konteks ini. "Bisu" paling sesuai dengan hasil langsung bahwa orang itu berbicara; catatan kaki dengan tepat mempertahankan kemungkinan leksikal "tuli." Tidak ada dasar dalam ayat ini untuk mengubah istilah tersebut menjadi penjelasan fenomenologis.'
