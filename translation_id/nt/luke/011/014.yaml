id: LUK.11.14
reference: Luke 11:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: id
  text: Dan Ia sedang mengusir setan bisu.[a] Ketika setan itu keluar, orang bisu itu berbicara, dan orang banyak takjub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “bisu” juga dapat berarti “tuli”; di sini arti “bisu” paling sesuai karena orang itu berbicara setelah setan tersebut keluar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: sedang mengusir
  rationale: Bentuk perifrastik imperfek menggambarkan tindakan yang sedang berlangsung pada waktu lampau. Subjek tersirat dijelaskan sebagai Yesus berdasarkan konteks sebelumnya agar kalimat Indonesia alami.
- source_word: δαιμόνιον
  choice: setan
  rationale: Dalam bahasa Indonesia Alkitabiah modern, 'setan' secara alami menyatakan makhluk roh jahat yang dimaksud oleh δαιμόνιον; 'roh jahat' mungkin, tetapi tidak perlu mengganti istilah eksplisit teks.
- source_word: κωφόν
  choice: yang membuat seseorang bisu
  rationale: Secara gramatikal κωφόν menerangkan setan, yakni setan yang menyebabkan kebisuan. Konteks, terutama bahwa orang itu kemudian berbicara, mendukung arti 'bisu', meskipun kata Yunani tersebut juga dapat berarti 'tuli'.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Setelah setan itu keluar
  rationale: Ungkapan ini menandai kelanjutan peristiwa, sedangkan genitif absolut menunjukkan bahwa keluarnya setan mendahului tindakan utama. 'Setelah' menyampaikan hubungan waktunya dengan alami.
- source_word: ἐλάλησεν
  choice: berbicara
  rationale: Padanan langsung dan wajar untuk λαλέω; teks tidak secara eksplisit mengatakan 'mulai berbicara'.
- source_word: ὁ κωφός
  choice: orang yang bisu itu
  rationale: Adjektiva substantival menunjuk kepada orang yang sebelumnya bisu. 'Orang' tidak menentukan jenis kelamin yang tidak dinyatakan secara eksplisit oleh bentuk Yunani ini.
- source_word: ἐθαύμασαν
  choice: takjub
  rationale: Menyampaikan rasa heran dan kagum yang terkandung dalam verba Yunani secara ringkas dan bermartabat.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk kelompok-kelompok orang yang hadir; bentuk kolektif Indonesia tidak perlu memaksakan penandaan jamak Yunani.
theological_decisions:
- issue: Hakikat gangguan dan bahasa pengusiran setan
  choice: Menyatakan bahwa Yesus mengusir setan dan bahwa setelah setan itu keluar, kemampuan orang tersebut untuk berbicara dipulihkan.
  alternative: Mengganti 'setan' dengan penjelasan fenomenologis atau menghindari kerangka supernatural.
  rationale: Teks Yunani secara eksplisit menyebut δαιμόνιον dan menghubungkan keluarnya setan itu dengan orang bisu yang kemudian berbicara. Klaim naratif ini dipertahankan tanpa dikurangi atau ditambahi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Frasa pembuka 'Pada waktu itu' dipakai untuk membawa konstruksi progresif lampau secara alami, dan nama 'Yesus' memperjelas subjek tersirat dari konteks. Penempatan catatan kaki sesudah 'bisu' menandai langsung alternatif leksikal κωφός.
