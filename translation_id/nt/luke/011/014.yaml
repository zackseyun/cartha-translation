  rationale: Revisi menghapus tambahan yang tidak dinyatakan dalam ayat dan menerjemahkan κωφόν sebagai adjektiva yang menerangkan setan, sebagaimana konstruksi Yunani. Hubungan waktu, istilah pengusiran setan, dan ambiguitas leksikal yang relevan tetap dipertahankan.
