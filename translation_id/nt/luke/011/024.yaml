id: LUK.11.24
reference: Luke 11:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: id
  text: “Apabila roh najis keluar dari seseorang, roh itu melintasi tempat-tempat tanpa air[a] sambil mencari perhentian. Namun, karena tidak menemukannya, roh itu berkata, ‘Aku akan kembali ke rumahku, dari mana aku keluar.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat-tempat kering.” Bahasa Yunani secara harfiah berarti tempat-tempat yang tidak berair.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Apabila
  rationale: Menandai keadaan umum yang bersyarat sekaligus temporal; “apabila” alami dalam bahasa Indonesia dan tidak membatasi perkataan ini pada satu kejadian saja.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: roh najis
  rationale: Mempertahankan ungkapan khas Injil bagi roh jahat serta nuansa kenajisan moral atau ritual yang terkandung dalam ἀκάθαρτος.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: dari seseorang
  rationale: ἄνθρωπος di sini menunjuk kepada seorang manusia dalam contoh yang bersifat umum. “Seseorang” menyampaikan fungsi representatif itu secara alami tanpa menentukan jenis kelamin yang tidak dinyatakan secara leksikal.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: melintasi tempat-tempat tanpa air
  rationale: “Melintasi” menyampaikan gerak melalui suatu wilayah, sedangkan “tanpa air” mempertahankan gambaran harfiah ἄνυδρος dan nuansa tempat yang tandus.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: untuk mencari tempat beristirahat
  rationale: Partisipel ini menyatakan maksud atau tindakan yang menyertai. Ungkapan Indonesia ini alami dan menyampaikan pencarian akan perhentian tanpa memberi tafsiran tambahan.
- source_word: καὶ μὴ εὑρίσκον
  choice: Ketika tidak menemukannya
  rationale: Objek yang tersirat adalah tempat beristirahat yang baru disebut. Pemisahan menjadi kalimat baru menghasilkan alur Indonesia yang jelas sambil mempertahankan hubungan temporal.
- source_word: λέγει
  choice: roh itu berkata
  rationale: Kala kini naratif dipertahankan dalam rangkaian waktu kini. Subjek diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Aku akan kembali ke rumahku
  rationale: Mempertahankan tekad dalam bentuk mendatang dan metafora konkret “rumah”, yang berlanjut pada ayat berikutnya.
- source_word: ὅθεν ἐξῆλθον
  choice: yang telah kutinggalkan
  rationale: Secara idiomatis menyatakan rumah asal keluarnya roh itu. Alternatif yang lebih harfiah, “tempat aku keluar”, terasa kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat “roh najis”
  choice: Diterjemahkan sebagai pelaku pribadi yang keluar, mencari, berbicara, dan kembali.
  alternative: Menjadikannya sekadar metafora kemerosotan moral atau suatu kekuatan impersonal.
  rationale: Tata bahasa dan konteks Injil menggambarkan roh itu sebagai pelaku pribadi. Terjemahan tidak mereduksinya menjadi metafora ataupun menambahkan uraian demonologis yang tidak terdapat dalam ayat.
- issue: Cakupan ἀνθρώπου
  choice: seseorang
  alternative: orang itu; laki-laki itu; manusia
  rationale: Walaupun bentuk nomina Yunani ini bergender gramatikal maskulin, ἄνθρωπος dapat berarti manusia atau orang tanpa penegasan jenis kelamin. Dalam pernyataan umum ini, “seseorang” mempertahankan cakupan semantis dan fungsi representatifnya.
- issue: Makna “rumahku”
  choice: Metafora “rumah” dipertahankan tanpa dijelaskan di dalam teks.
  alternative: Menggantikannya secara eksplisit dengan “orang yang dahulu kurasuki”.
  rationale: Ayat menyebut οἶκος secara konkret dan sengaja mengembangkan citra rumah. Menjelaskan referennya di dalam teks akan menutup ruang metaforis dan mendahului uraian ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami, tetapi urutan tindakan dan kala naratif tetap dipertahankan. Pengulangan “roh itu” menghindari ambiguitas pronomina. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
