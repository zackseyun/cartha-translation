  verdict: revise
  source_fidelity: Perlu revisi kecil. Frasa terakhir, “yang telah kutinggalkan,” menyatakan bahwa roh itu meninggalkan rumah tersebut, tetapi tidak secara eksplisit mempertahankan arah asal dalam ὅθεν ἐξῆλθον (“dari mana aku keluar”). Selain itu, ἀνάπαυσιν lebih langsung diterjemahkan “perhentian” daripada “tempat beristirahat,” yang menambahkan unsur lokasi.
  naturalness: Teksnya umumnya jelas dan menggunakan bahasa Indonesia modern yang wajar. Bentuk “dari mana aku keluar” pada ujaran langsung tetap alami dan lebih dekat dengan citra keluar–kembali dalam bahasa sumber.
  terminology: “Roh najis,” “rumahku,” dan “tempat-tempat tanpa air” tepat dan konsisten dengan istilah Injil. “Seseorang” dapat diterima untuk ἀνθρώπου dalam pernyataan generik ini. Catatan kaki terjangkar dengan tepat pada “tanpa air.”
  issues:
  - severity: medium
    issue: Relasi asal dalam ὅθεν ἐξῆλθον tidak dipertahankan secara eksplisit.
    rationale: “Yang telah kutinggalkan” dapat berarti sekadar rumah yang ditinggalkan dan tidak menerjemahkan secara jelas “dari mana aku keluar.” Terjemahan perlu mempertahankan gerak keluar dari rumah itu, yang disengajakan dalam metafora.
  - severity: low
    issue: “Tempat beristirahat” menambahkan unsur tempat pada ἀνάπαυσιν.
    rationale: Kata Yunani berarti “istirahat/perhentian.” Tambahan “tempat” dapat dipahami secara idiomatis, tetapi “perhentian” lebih padat dan lebih dekat dengan sumber.
  revised_text: “Apabila roh najis keluar dari seseorang, roh itu melintasi tempat-tempat tanpa air[a] sambil mencari perhentian. Namun, karena tidak menemukannya, roh itu berkata, ‘Aku akan kembali ke rumahku, dari mana aku keluar.’”
