  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: id
  text: Atau jika ia meminta sebutir telur, akankah ayahnya memberikan kalajengking kepadanya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Atau jika
  rationale: Memperkenalkan contoh sejajar berikutnya dalam rangkaian pertanyaan retoris. Bentuk ini alami dalam bahasa Indonesia tanpa menerjemahkan καί secara berlebihan.
- source_word: αἰτήσει
  choice: ia meminta
  rationale: Bentuk indikatif futuris berfungsi dalam keadaan yang menyerupai syarat; bentuk kini bahasa Indonesia menyampaikan permintaan hipotetis ini dengan wajar.
- source_word: ᾠόν
  choice: sebutir telur
  rationale: Kata penggolong 'sebutir' merupakan ungkapan Indonesia yang alami untuk sebuah telur.
- source_word: ἐπιδώσει
  choice: akankah ... memberikan
  rationale: Dalam konteks ini verba tersebut berarti memberikan sesuatu sebagai tanggapan atas permintaan; bentuk pertanyaan dengan 'akankah' mempertahankan daya retorisnya.
- source_word: αὐτῷ
  choice: kepadanya
  rationale: Menyatakan objek tak langsung secara jelas dan alami dalam bahasa Indonesia.
- source_word: σκορπίον
  choice: kalajengking
  rationale: Padanan baku yang mempertahankan kontras mencolok dan absurd dengan telur.
theological_decisions:
- issue: Daya retoris analogi ayah dan anak
  choice: Diterjemahkan sebagai pertanyaan retoris langsung tanpa penjelasan tafsir tambahan.
  alternative: Menambahkan kata 'sebagai gantinya' untuk memperjelas kontras.
  rationale: Bahasa Yunani membiarkan kontras absurd itu tersirat. Pembaca Indonesia dapat menangkap maksudnya tanpa perlu perluasan yang dapat mengurangi ketegangan retoris.
- issue: Subjek tersirat dari ἐπιδώσει
  choice: ayahnya
  alternative: ia
  rationale: Subjek Yunani tersirat dan ditentukan oleh konteks ayat sebelumnya, yaitu seorang ayah. Mengungkapkannya sebagai 'ayahnya' menghindari rujukan pronomina yang kabur dalam bahasa Indonesia tanpa menambahkan tokoh baru.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan mempertahankan bentuk pertanyaan retoris serta gambaran konkret dari teks sumber.
