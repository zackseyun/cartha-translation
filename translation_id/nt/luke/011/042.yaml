id: LUK.11.42
reference: Luke 11:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: id
  text: Namun celakalah kalian, orang-orang Farisi! Sebab kalian memberikan persepuluhan dari daun mint, inggu, dan segala jenis sayuran, dan kalian mengabaikan keadilan dan kasih Allah.[a] Yang ini seharusnya kalian lakukan tanpa melalaikan yang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani dapat berarti kasih kepada Allah atau kasih yang berasal dari Allah.
    reason: Menjaga ambiguitas genitif τοῦ θεοῦ yang tidak dapat dipastikan hanya dari bentuk gramatikalnya.
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: celakalah kalian
  rationale: Ungkapan peringatan dan penghukuman profetis yang kuat; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἀποδεκατοῦτε
  choice: memberikan persepuluhan
  rationale: Menyatakan tindakan menyerahkan sepersepuluh sebagai kewajiban keagamaan.
- source_word: ἡδύοσμον
  choice: daun mint
  rationale: Padanan modern yang mudah dikenali untuk tanaman aromatik mint; 'daun' memperjelas rujukan dalam konteks bahan tanaman.
- source_word: πήγανον
  choice: inggu
  rationale: Nama Indonesia untuk rue (Ruta graveolens), tanaman herba yang dimaksud.
- source_word: πᾶν λάχανον
  choice: segala jenis sayuran
  rationale: Dalam konteks ini λάχανον menunjuk tanaman kebun atau sayuran; 'segala jenis' menyampaikan cakupan πᾶν secara alami.
- source_word: παρέρχεσθε
  choice: mengabaikan
  rationale: Secara harfiah dapat berarti 'melewati'; dalam konteks kewajiban moral, maknanya adalah tidak mengindahkan atau mengabaikan.
- source_word: κρίσιν
  choice: keadilan
  rationale: Di sini menunjuk pelaksanaan apa yang adil, bukan tindakan penghukuman semata.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: kasih kepada Allah
  rationale: Genitif Yunani dapat menyatakan kasih yang tertuju kepada Allah maupun kasih yang berasal dari Allah; konteks teguran mengenai kewajiban manusia mendukung terjemahan objektif, sementara ambiguitas dicatat.
- source_word: παρεῖναι
  choice: melalaikan
  rationale: Menyampaikan arti membiarkan atau tidak melakukan suatu kewajiban.
theological_decisions:
- issue: Arah genitif dalam τὴν ἀγάπην τοῦ θεοῦ
  choice: kasih kepada Allah
  alternative: kasih Allah
  rationale: Konstruksi Yunani memang ambigu. Dalam rangkaian kewajiban yang harus dilakukan oleh orang Farisi, kasih yang manusia tunjukkan kepada Allah paling sesuai, tetapi alternatifnya tetap diakui dalam catatan kaki.
- issue: Hubungan antara keadilan, kasih, dan persepuluhan
  choice: Yang ini seharusnya kalian lakukan tanpa melalaikan yang itu
  alternative: Kalian harus melakukan keadilan dan kasih kepada Allah, sekaligus tidak mengabaikan persepuluhan
  rationale: 'Bentuk demonstratif dipertahankan agar urutan dan ketegangan teks tetap terjaga: Yesus menegaskan kewajiban yang lebih mendasar tanpa membatalkan praktik persepuluhan yang disebutkan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak diterjemahkan dengan 'kalian' agar peralihan dari kelompok Farisi kepada kata ganti orang kedua jamak tetap nyata. Istilah 'persepuluhan' dipertahankan karena umum dalam konteks Alkitab, sedangkan nama tumbuhan dibuat mudah dikenali.
