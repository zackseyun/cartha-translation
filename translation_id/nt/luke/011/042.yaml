  terminology: “Orang-orang Farisi,” “persepuluhan,” “inggu,” dan “keadilan” tepat. “Kasih Allah” secara alami mempertahankan keluasan genitif Yunani; catatan kaki menerangkan dua pembacaan yang mungkin tanpa memaksakan salah satunya.
