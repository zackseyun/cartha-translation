id: LUK.11.30
reference: Luke 11:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: id
  text: Sebab, sama seperti Yunus menjadi tanda bagi orang-orang Niniwe, demikian juga Anak Manusia akan menjadi tanda[a] bagi generasi ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata “tanda” tidak diulangi dalam klausa kedua teks Yunani, tetapi tersirat dari perbandingan dengan Yunus. Secara sangat harfiah: “demikian juga Anak Manusia akan menjadi bagi generasi ini.”'
    reason: Menjelaskan predikat tersirat yang perlu dicantumkan agar terjemahan bahasa Indonesia jelas dan alami.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Sebab, sama seperti
  rationale: “Sebab” menyampaikan fungsi penjelas γάρ, sedangkan “sama seperti” mempertahankan perbandingan yang diperkenalkan καθώς.
- source_word: ἐγένετο
  choice: menjadi
  rationale: Pilihan ini mempertahankan nuansa bahwa Yunus tampil atau berfungsi sebagai tanda, bukan sekadar berada sebagai tanda.
- source_word: Ἰωνᾶς
  choice: Yunus
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: τοῖς Νινευίταις
  choice: bagi orang-orang Niniwe
  rationale: Datif ini menyatakan pihak yang menerima atau mengalami fungsi tanda tersebut. “Bagi” terdengar alami dalam bahasa Indonesia.
- source_word: σημεῖον
  choice: tanda
  rationale: “Tanda” mempertahankan makna sesuatu yang memiliki arti penyataan dan merupakan padanan baku dalam konteks Lukas.
- source_word: οὕτως ... καὶ
  choice: demikian juga
  rationale: Ungkapan ini menyatakan kesejajaran dengan klausa sebelumnya sekaligus mempertahankan daya tambah καί.
- source_word: ἔσται
  choice: akan menjadi
  rationale: Dalam konstruksi bahasa Indonesia, “akan menjadi tanda” merupakan cara alami untuk menyatakan kopula masa depan “akan menjadi/akan berfungsi sebagai tanda”; predikat “tanda” dipahami dari klausa pertama.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Gelar tradisional ini mempertahankan bentuk ungkapan serta gema mesianik dan apokaliptiknya tanpa mempersempit tafsir.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: bagi generasi ini
  rationale: “Generasi” mempertahankan cakupan leksikal dan daya profetis γενεά, sementara “bagi” menyatakan hubungan dengan pihak yang menerima tanda.
theological_decisions:
- issue: Predikat yang tersirat dalam klausa kedua
  choice: 'Kata “tanda” dicantumkan kembali dalam terjemahan: “Anak Manusia akan menjadi tanda bagi generasi ini.”'
  alternative: 'Menerjemahkan secara sangat harfiah tanpa mengulang predikat: “Anak Manusia akan menjadi bagi generasi ini.”'
  rationale: Teks Yunani tidak mengulang σημεῖον dalam klausa kedua, tetapi kesejajaran antarklausa dengan jelas membuatnya tersirat. Pengulangan dalam bahasa Indonesia diperlukan agar kalimat wajar dan dapat dipahami, tanpa menambahkan klaim teologis baru.
- issue: Makna gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mempertahankan gelar “Anak Manusia” tanpa perluasan tafsiran.
  alternative: Sang Manusia
  rationale: Bentuk tradisional mempertahankan ketegangan antara ungkapan harfiah, gelar, dan gema antarteksnya, tanpa menetapkan satu tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur perbandingan dipertahankan dengan jelas; istilah “generasi” dan gelar “Anak Manusia” dipilih untuk menjaga hubungan leksikal serta ketegangan teologis teks sumber.
