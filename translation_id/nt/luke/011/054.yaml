  text: lying in wait for him[c][b][a], to catch something from his mouth.
translation:
  language: id
  text: sambil mengintai-Nya[a] untuk menangkap sesuatu dari ucapan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengadang-Nya” atau “menunggu untuk menjebak-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menangkap sesuatu dari mulut-Nya,” yaitu memanfaatkan sesuatu yang Ia katakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: sambil mengintai-Nya
  rationale: Partisipel ini menggambarkan tindakan mengintai dengan maksud bermusuhan untuk menjebak. Ungkapan ini mempertahankan citra penyergapan dan kaitannya dengan konteks kalimat sebelumnya.
- source_word: θηρεῦσαί
  choice: untuk menangkap
  rationale: Kata ini memakai citra berburu atau menangkap mangsa. Dalam konteks ini, yang hendak ditangkap adalah ucapan yang dapat dipakai untuk menjerat Yesus.
- source_word: τι
  choice: sesuatu
  rationale: Kata ganti tak tentu ini menunjuk pada suatu ucapan yang mereka harapkan dapat mereka manfaatkan.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: sesuatu yang keluar dari mulut-Nya
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang mulut sekaligus terdengar wajar dalam bahasa Indonesia; maksudnya ialah sesuatu yang Yesus ucapkan.
