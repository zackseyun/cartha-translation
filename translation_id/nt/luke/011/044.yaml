  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: id
  text: Celakalah kalian, sebab kalian seperti makam-makam yang tidak bertanda, dan orang-orang yang berjalan di atasnya tidak mengetahuinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Celakalah kalian
  rationale: Ungkapan peringatan dan kecaman yang langsung; pronomina jamak dipertahankan dengan bahasa Indonesia modern.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: makam-makam yang tidak bertanda
  rationale: ἄδηλα berarti tidak tampak atau tidak dikenali; dalam konteks ini, makam tanpa penanda menyampaikan bahwa keberadaannya tidak diketahui oleh orang yang melintas.
- source_word: οἱ ἄνθρωποι
  choice: orang-orang
  rationale: ἄνθρωποι bersifat umum dan mencakup manusia tanpa penekanan khusus pada jenis kelamin.
- source_word: περιπατοῦντες ἐπάνω
  choice: berjalan di atasnya
  rationale: Mempertahankan gambaran konkret orang yang melintas tepat di atas makam.
- source_word: οὐκ οἴδασιν
  choice: tanpa mengetahuinya
  rationale: Menyatakan ketidaktahuan mereka secara alami dalam bahasa Indonesia, dengan rujukan pada keberadaan atau sifat makam tersebut.
theological_decisions:
- issue: Makna kenajisan yang tersirat dari makam
  choice: Tidak menambahkan kata tentang kenajisan ke dalam teks utama
  alternative: Menjelaskan bahwa orang menjadi najis tanpa menyadarinya
  rationale: Teks Yunani hanya menyatakan bahwa mereka tidak tahu; implikasi kenajisan menurut konteks hukum Yahudi tetap dibiarkan tersirat agar ketegangan dan cakupan perumpamaan tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak 'kalian' dipakai untuk ὑμῖν; 'orang-orang' dipilih daripada 'laki-laki' karena ἄνθρωποι bersifat generik.
