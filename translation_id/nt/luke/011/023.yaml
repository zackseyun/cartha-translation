  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: id
  text: Orang yang tidak bersama-Ku menentang Aku, dan orang yang tidak mengumpulkan bersama-Ku mencerai-beraikan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: orang yang tidak
  rationale: Artikel dengan partisipel kini berfungsi substantival dan menunjuk secara umum kepada seseorang yang dicirikan oleh keadaan tersebut. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan generiknya.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: μετά dengan genitif menyatakan kebersamaan atau keberpihakan. 'Bersama-Ku' ringkas dan mempertahankan dimensi relasional dalam perkataan ini.
- source_word: κατ’ ἐμοῦ
  choice: menentang Aku
  rationale: κατά dengan genitif menyatakan pertentangan. 'Menentang Aku' menghasilkan antitesis yang jelas dan alami dengan 'bersama-Ku'.
- source_word: συνάγων
  choice: mengumpulkan
  rationale: Kata ini berarti menghimpun atau membawa menjadi satu. 'Mengumpulkan' mempertahankan metafora dan berlawanan langsung dengan 'mencerai-beraikan'.
- source_word: σκορπίζει
  choice: mencerai-beraikan
  rationale: Kata kerja ini berarti menyebarkan atau membuat tercerai. 'Mencerai-beraikan' secara jelas menyatakan tindakan yang menjadi kebalikan dari mengumpulkan.
- source_word: καὶ
  choice: dan
  rationale: Konjungsi ini menghubungkan dua klausa paralel secara langsung; 'dan' mempertahankan koordinasi dan ritmenya.
theological_decisions:
- issue: Daya perkataan Yesus tentang kenetralan terhadap-Nya
  choice: Orang yang tidak bersama Yesus dinyatakan menentang-Nya; rumusan biner yang tegas dipertahankan.
  alternative: Melunakkan kalimat menjadi sekadar tidak mendukung, atau membatasinya secara eksplisit hanya pada konteks pengusiran setan.
  rationale: Bentuk Yunani bersifat mutlak. Terjemahan tidak mempersempit maupun memperluasnya lewat penjelasan doktrinal, tetapi mempertahankan ketegangan teologis perkataan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Paralelisme kedua klausa dipertahankan. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia.
