id: LUK.11.10
reference: Luke 11:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: id
  text: Sebab setiap orang yang meminta menerima, orang yang mencari menemukan, dan bagi orang yang mengetuk akan dibukakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan memperjelas maksudnya dari konteks: “pintu akan dibukakan bagi orang yang mengetuk.” Bahasa Yunani tidak menyebutkan objeknya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: setiap orang
  rationale: Dipakai secara distributif bersama partisip substantival; pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan universal.
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan pernyataan ini dengan dorongan pada ayat sebelumnya.
- source_word: ὁ αἰτῶν
  choice: orang yang meminta
  rationale: Menyampaikan partisip kini substantival sebagai sebutan umum bagi orang yang meminta, tanpa membatasi jenis permintaannya.
- source_word: λαμβάνει
  choice: menerima
  rationale: Padanan langsung dan bermartabat yang sesuai dengan hubungan meminta dan menerima.
- source_word: ὁ ζητῶν
  choice: orang yang mencari
  rationale: Mempertahankan gambaran umum tentang tindakan mencari dalam susunan tiga serangkai ayat ini.
- source_word: εὑρίσκει
  choice: menemukan
  rationale: Padanan langsung dan alami bagi hasil dari tindakan mencari.
- source_word: τῷ κρούοντι
  choice: bagi orang yang mengetuk
  rationale: Kata depan 'bagi' menyampaikan bentuk datif sebagai pihak yang menerima tindakan pasif dan menghasilkan susunan Indonesia yang alami.
- source_word: ἀνοιγήσεται
  choice: akan dibukakan
  rationale: Mempertahankan bentuk pasif futur serta membiarkan objeknya tidak disebutkan, sebagaimana dalam bahasa Yunani.
theological_decisions:
- issue: Cakupan dan kekuatan janji universal
  choice: Pernyataan diterjemahkan sebagai prinsip umum yang universal tanpa tambahan syarat.
  alternative: Menafsirkannya sebagai dorongan hiperbolis atau menambahkan syarat seperti 'meminta dengan benar'.
  rationale: Teks Yunani menyatakan pepatah universal tanpa syarat eksplisit dalam konteks pengajaran tentang doa. Terjemahan mempertahankan ketegangan teologis itu dan tidak memasukkan pembatasan yang tidak dinyatakan.
- issue: Pelaku tersirat dalam bentuk pasif ἀνοιγήσεται
  choice: Mempertahankan bentuk pasif 'akan dibukakan' tanpa menyebut pelaku.
  alternative: Mengeksplisitkan Allah sebagai pelaku yang membuka.
  rationale: Bentuk pasif dapat menyiratkan tindakan Allah dalam konteksnya, tetapi teks tidak menyebut pelaku; mengeksplisitkannya akan mempersempit ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kesejajaran meminta–menerima, mencari–menemukan, dan mengetuk–dibukakan dipertahankan; objek pada klausa terakhir sengaja tidak dieksplisitkan dalam teks utama.
