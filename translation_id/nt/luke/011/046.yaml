id: LUK.11.46
reference: Luke 11:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: id
  text: Namun, Ia berkata, “Celakalah juga kalian, para ahli Taurat[a]! Kalian membebani orang dengan beban-beban yang sukar dipikul, sedangkan kalian sendiri tidak menyentuh beban-beban itu dengan satu jari pun.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang ahli dalam hukum.” Yang dimaksud ialah para ahli hukum Taurat Yahudi.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menekankan bahwa mereka sendiri tidak melakukan upaya sekecil apa pun untuk menangani beban yang mereka kenakan kepada orang lain.
    reason: idiom_explanation
lexical_decisions:
- source_word: νομικοῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Lukas, istilah ini menunjuk kepada orang-orang yang ahli dalam hukum Taurat Yahudi, bukan pengacara dalam pengertian modern. Ungkapan ini alami dan jelas bagi pembaca Indonesia.
- source_word: οὐαί
  choice: Celakalah
  rationale: Mempertahankan daya kecaman dan peringatan penghukuman yang bersifat kenabian, bukan sekadar ungkapan kesedihan.
- source_word: φορτίζετε
  choice: membebani
  rationale: Menyampaikan tindakan menaruh beban pada orang lain dan tetap mempertahankan metafora sumber secara alami dalam bahasa Indonesia.
- source_word: ἀνθρώπους
  choice: orang
  rationale: Istilah Yunani di sini bersifat umum dan tidak terbatas pada laki-laki.
- source_word: φορτία δυσβάστακτα
  choice: beban-beban yang sukar dipikul
  rationale: Mempertahankan citra konkret tentang beban serta arti δυσβάστακτα sebagai sesuatu yang sulit, bukan mutlak mustahil, untuk dipikul.
- source_word: αὐτοὶ
  choice: kalian sendiri
  rationale: Menyatakan penekanan dan kontras antara para ahli Taurat dengan orang yang mereka bebani.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: dengan satu jari pun
  rationale: Ungkapan Indonesia ini mempertahankan gambaran tindakan yang paling kecil sekalipun dan menegaskan bahwa mereka sama sekali tidak ikut menangani beban tersebut.
- source_word: προσψαύετε
  choice: tidak menyentuh
  rationale: Mempertahankan arti konkret verba sumber tanpa memasukkan tafsiran eksplisit seperti 'tidak membantu' ke dalam teks utama.
- source_word: Καὶ ὑμῖν
  choice: juga kalian
  rationale: 'Mempertahankan daya aditif καί: kecaman ini dikenakan pula kepada kelompok yang kini disapa.'
theological_decisions:
- issue: Identitas νομικοῖς
  choice: para ahli Taurat
  alternative: para ahli hukum; para pakar hukum Taurat
  rationale: Yang dimaksud ialah para spesialis hukum Taurat Yahudi. Pilihan ini menghindari kesan bahwa mereka pengacara sipil modern, tanpa menyamakan mereka begitu saja dengan kelompok lain seperti ahli kitab.
- issue: Daya ungkapan pada klausa terakhir
  choice: tidak menyentuh beban-beban itu dengan satu jari pun
  alternative: sama sekali tidak mau membantu memikul beban-beban itu
  rationale: Terjemahan utama mempertahankan metafora konkret dan ketegangan sumber. Implikasi bahwa mereka tidak melakukan upaya sekecil apa pun untuk membantu dijelaskan dalam catatan, bukan dimasukkan sebagai tafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “kalian” dipakai karena bentuk Yunani jamak dan teguran ditujukan langsung kepada suatu kelompok. Metafora beban dan jari dipertahankan karena tetap jelas dalam bahasa Indonesia.
