  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: id
  text: Namun, berikanlah sebagai sedekah apa yang ada di dalam[a], dan lihatlah, segala sesuatu bersih bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berikanlah sebagai sedekah apa yang kamu miliki.” Frasa Yunani ini dapat dipahami sebagai “apa yang ada di dalam” atau sebagai milik yang tersedia pada seseorang.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Namun
  rationale: Menandai kontras korektif dengan pembahasan sebelumnya tentang pembersihan bagian luar, dalam bahasa Indonesia modern dan bermartabat.
- source_word: τὰ ἐνόντα
  choice: apa yang ada di dalam
  rationale: Mempertahankan bentuk dan ambiguitas ungkapan Yunani serta kaitannya dengan kontras antara bagian luar dan bagian dalam pada ayat 39. Tafsiran tentang milik yang ada pada seseorang dicantumkan dalam catatan kaki.
- source_word: δότε
  choice: berikanlah
  rationale: Menyampaikan perintah langsung secara alami tanpa menambahkan nuansa aspek yang tidak pasti.
- source_word: ἐλεημοσύνην
  choice: sebagai sedekah
  rationale: Mengacu pada pemberian belas kasih kepada orang yang membutuhkan dan memungkinkan susunan 'berikanlah ... sebagai sedekah' yang dekat dengan konstruksi Yunani.
- source_word: ἰδοὺ
  choice: maka lihatlah
  rationale: Mempertahankan penanda perhatian dan penekanan pada hasil, dengan ungkapan yang dapat dipahami pembaca modern.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Menyampaikan cakupan menyeluruh dari bentuk jamak netral Yunani.
- source_word: καθαρὰ
  choice: bersih
  rationale: Mempertahankan hubungan leksikal dengan pokok kebersihan dan kemurnian dalam perdebatan tentang pembasuhan.
- source_word: ὑμῖν
  choice: bagimu
  rationale: 'Menerjemahkan datif acuan atau keuntungan secara idiomatis: bersih bagi atau sehubungan dengan mereka.'
theological_decisions:
- issue: Makna τὰ ἐνόντα dalam kaitannya dengan kemurnian dan sedekah
  choice: apa yang ada di dalam, dengan kemungkinan makna batiniah
  alternative: apa yang kamu miliki, yakni harta yang ada padamu
  rationale: Konteks langsung mengontraskan bagian luar dan bagian dalam cawan serta pinggan (Luk. 11:39), sehingga ungkapan utama mempertahankan gema batiniah itu. Karena secara leksikal frasa tersebut juga dapat dipahami sebagai milik yang tersedia, alternatif itu dipertahankan dalam catatan kaki agar ketegangan tafsir tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Kata “sedekah” dipakai dalam arti umum pemberian belas kasih, bukan sebagai istilah khas denominasi. Penanda [a] ditempatkan tepat setelah frasa yang ambigu.
