  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: id
  text: supaya generasi ini dimintai pertanggungjawaban atas darah semua nabi yang telah ditumpahkan sejak dunia dijadikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “supaya darah semua nabi ... dituntut dari generasi ini.” Kata kerja ini mengandung arti menuntut perhitungan atas penumpahan darah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: supaya
  rationale: Mempertahankan daya tujuan/hasil yang menghubungkan ayat ini dengan konteks sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐκζητηθῇ
  choice: dituntut pertanggungjawabannya
  rationale: Bentuk pasif ini dalam konteks penumpahan darah menyatakan tuntutan pengadilan atau perhitungan atas kesalahan, bukan sekadar tindakan mencari.
- source_word: τὸ αἷμα
  choice: darah
  rationale: Mempertahankan ungkapan konkret bahasa Yunani; dalam konteks ini darah juga mewakili kesalahan karena membunuh para nabi.
- source_word: πάντων τῶν προφητῶν
  choice: semua nabi
  rationale: Menyampaikan cakupan menyeluruh dari πάντων secara langsung dan wajar.
- source_word: τὸ ἐκκεχυμένον
  choice: yang telah ditumpahkan
  rationale: Partisipel perfek pasif menerangkan darah yang telah dicurahkan melalui kematian dengan kekerasan; bentuk 'telah ditumpahkan' mempertahankan aspek hasil yang berlanjut.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: sejak dunia dijadikan
  rationale: Ungkapan Indonesia yang alami untuk titik awal sejak penciptaan dunia, tanpa mengubah makna idiom Yunani.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: dari angkatan ini
  rationale: Menandai pihak yang darinya pertanggungjawaban dituntut. 'Angkatan' sesuai dengan konteks kelompok sezaman, sementara 'dari' mempertahankan ἀπό.
theological_decisions:
- issue: Sifat tuntutan atas darah para nabi
  choice: Menyatakan tuntutan pertanggungjawaban ilahi atas penumpahan darah kepada angkatan ini.
  alternative: Sekadar menyatakan kesinambungan sejarah penolakan terhadap para utusan Allah tanpa tekanan pengadilan.
  rationale: ἐκζητηθῇ dalam konteks darah mengandung daya perhitungan atau penuntutan. Terjemahan mempertahankan daya hukum itu tanpa menjelaskan lebih jauh bagaimana kesalahan lintas angkatan diperhitungkan.
- issue: Cakupan 'angkatan ini'
  choice: Membiarkan frasa itu menunjuk kepada angkatan yang disapa Yesus tanpa merinci teori kesalahan kolektif.
  alternative: Menjelaskannya sebagai tanggung jawab perwakilan atau kesalahan warisan.
  rationale: Teks menempatkan tuntutan pada 'angkatan ini', tetapi tidak menguraikan mekanisme teologisnya; ketegangan tersebut perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat mempertahankan metafora 'darah' serta tekanan yudisial teks Yunani, tetapi menggunakan ungkapan yang dapat dipahami pembaca umum.
