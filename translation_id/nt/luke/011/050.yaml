  naturalness: “Generasi ini dimintai pertanggungjawaban atas darah ...” adalah ungkapan modern baku yang jelas dan tetap bernada serius. “Generasi” lebih alami daripada “angkatan” bagi pembaca Indonesia masa kini dalam rujukan kepada kelompok sezaman.
  terminology: Istilah “darah,” “nabi,” dan “dunia dijadikan” dipertahankan. “Dimintai pertanggungjawaban” menyampaikan fungsi pasif yudisial ἐκζητηθῇ tanpa menambahkan penjelasan doktrinal mengenai mekanisme tanggung jawab generasi ini.
