  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: id
  text: Mata adalah pelita tubuhmu. Apabila matamu sehat[a], seluruh tubuhmu juga penuh cahaya. Namun, apabila matamu buruk[b], tubuhmu juga gelap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jernih”; secara lebih harfiah, “utuh,” “tidak terbagi,” atau secara tradisional “tunggal.” Kata Yunani ini dapat menggambarkan sesuatu yang utuh, tidak terbagi, atau berfungsi dengan baik; di sini kata itu menerangkan mata sebagai lawan dari mata yang “buruk.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jahat.” Kata Yunani ini dapat berarti “buruk” atau “jahat”; di sini gambaran tersebut dapat mencakup mata yang tidak berfungsi dengan baik sekaligus cara pandang yang rusak secara moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: pelita
  rationale: Kata ini menunjuk pada sumber cahaya konkret. “Pelita” mempertahankan metafora aslinya dan sesuai dengan ragam Alkitab yang tetap mudah dipahami.
- source_word: σῶμα
  choice: tubuh
  rationale: Makna dasarnya adalah tubuh jasmani, yang dalam ayat ini menjadi bagian dari gambaran tentang keadaan batin dan persepsi.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Organ tubuh ini dipertahankan secara harfiah karena menjadi pusat metafora ayat.
- source_word: ὅταν ... ᾖ / ἐπὰν ... ᾖ
  choice: apabila ... / apabila ...
  rationale: Konstruksi ini menyatakan keadaan umum yang bersifat temporal sekaligus kondisional. “Apabila” menyampaikan kedua nuansa itu secara alami dan menjaga kesejajaran kedua klausa.
- source_word: ἁπλοῦς
  choice: baik
  rationale: Dalam pertentangan dengan πονηρός dan dalam gambaran mata yang menerangi tubuh, “baik” dapat menggambarkan mata yang berfungsi sebagaimana mestinya tanpa membatasi makna pada kesehatan fisik saja. Catatan kaki mempertahankan kemungkinan makna “jernih”, “sehat”, atau “tulus/tidak terbagi”.
- source_word: ὅλον τὸ σῶμά σου φωτεινόν
  choice: seluruh tubuhmu juga penuh cahaya
  rationale: Ungkapan “penuh cahaya” menyampaikan φωτεινός secara idiomatis dan mempertahankan citra yang berlawanan dengan keadaan gelap.
- source_word: πονηρός
  choice: buruk
  rationale: “Buruk” mempertahankan keluasan makna antara keadaan mata yang tidak baik dan persepsi yang jahat atau rusak, tanpa memaksakan hanya salah satu nuansa.
- source_word: σκοτεινός
  choice: gelap
  rationale: Padanan langsung dan alami yang mempertahankan pertentangan dengan “penuh cahaya”.
theological_decisions:
- issue: Makna ἁπλοῦς ketika menerangkan mata
  choice: baik
  alternative: sehat; jernih; tulus atau tidak terbagi
  rationale: Konteks langsung menggambarkan mata sebagai pelita tubuh, sehingga “baik” dapat dipahami sebagai berfungsi dengan semestinya. Pada saat yang sama, pilihan ini tidak meniadakan dimensi moral dari gambaran tersebut; ragam maknanya dijelaskan dalam catatan kaki.
- issue: Makna moral atau fisik πονηρός
  choice: buruk
  alternative: jahat; tidak sehat
  rationale: Kata Yunani ini dapat menunjuk pada sesuatu yang buruk maupun jahat. “Buruk” memungkinkan metafora cacat penglihatan dan makna persepsi moral yang rusak tetap hadir bersama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur paralel “apabila ... apabila ...” mempertahankan bentuk umum dari kedua klausa Yunani. “Pelita” dipilih untuk menjaga metafora konkret, sedangkan “baik” dan “buruk” menjaga ketegangan antara keadaan fisik dan makna moral.
