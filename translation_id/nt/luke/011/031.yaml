id: LUK.11.31
reference: Luke 11:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: id
  text: Ratu dari Selatan akan bangkit pada waktu penghakiman bersama laki-laki dari generasi ini dan akan menghukum mereka[a], sebab ia datang dari ujung-ujung bumi untuk mendengarkan hikmat Salomo. Dan lihatlah[b], sesuatu yang lebih besar daripada Salomo ada di sini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sosok ini lazim diidentifikasi sebagai Ratu Syeba (lihat 1 Raja-Raja 10:1–13; 2 Tawarikh 9:1–12).
    reason: cross_reference
  - marker: b
    text: Atau, “seorang yang lebih besar daripada Salomo.” Dalam bahasa Yunani dipakai bentuk netral, secara harfiah “sesuatu yang lebih besar daripada Salomo,” yang mungkin menekankan lebih dari sekadar perbandingan langsung antara dua pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Ratu dari Selatan
  rationale: Mempertahankan ungkapan Yunani dan gema Perjanjian Lama tanpa memasukkan identifikasi Ratu Syeba langsung ke dalam teks utama.
- source_word: ἐγερθήσεται
  choice: akan bangkit
  rationale: Mencakup gambaran tampil atau berdiri dalam penghakiman sekaligus mempertahankan kemungkinan gema kebangkitan dalam konteks eskatologis.
- source_word: ἐν τῇ κρίσει
  choice: pada waktu penghakiman
  rationale: Menunjuk kepada penghakiman tertentu dan terdengar alami dalam bahasa Indonesia modern.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: bersama laki-laki
  rationale: ἀνδρῶν secara khusus berbentuk maskulin, sehingga pembedaan gender dalam sumber dipertahankan.
- source_word: τῆς γενεᾶς ταύτης
  choice: dari generasi ini
  rationale: γενεά dalam konteks ini paling wajar menunjuk kepada generasi sezaman dengan Yesus.
- source_word: κατακρινεῖ αὐτούς
  choice: akan menghukum mereka
  rationale: κατακρίνω menyatakan keputusan yang bersifat menghukum atau menyatakan bersalah, bukan sekadar menilai.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: dari ujung-ujung bumi
  rationale: Mempertahankan idiom bagi tempat yang sangat jauh dan cakupan hiperbolis ungkapan tersebut.
- source_word: ἀκοῦσαι
  choice: untuk mendengarkan
  rationale: Infinitif menyatakan tujuan; 'mendengarkan' secara alami menyiratkan perhatian kepada hikmat yang disampaikan.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: hikmat Salomo
  rationale: Ungkapan Indonesia yang alami dan tepat untuk isi yang hendak didengar.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan tekanan retoris secara wajar dalam bahasa Indonesia modern.
- source_word: πλεῖον Σολομῶνος
  choice: sesuatu yang lebih besar daripada Salomo
  rationale: Bentuk netral πλεῖον dipertahankan dan tidak diam-diam dipersonalisasi menjadi 'seorang yang lebih besar'.
- source_word: ὧδε
  choice: ada di sini
  rationale: Menyatakan kehadiran setempat secara ringkas dan alami.
theological_decisions:
- issue: Apakah identitas sang ratu perlu dinyatakan langsung sebagai Ratu Syeba
  choice: Memakai 'Ratu dari Selatan' dalam teks utama
  alternative: Ratu Syeba
  rationale: Walaupun kaitannya dengan Ratu Syeba sangat kuat, teks Yunani memakai ungkapan 'Ratu dari Selatan'; identifikasi dijelaskan melalui catatan kaki.
- issue: Apakah πλεῖον Σολομῶνος perlu dipersonalisasi
  choice: sesuatu yang lebih besar daripada Salomo
  alternative: seorang yang lebih besar daripada Salomo
  rationale: Bentuk Yunani bersifat netral dan dapat menyoroti realitas yang hadir dalam diri, karya, atau pemberitaan Yesus, bukan hanya perbandingan dua pribadi. Ketegangan ini dipertahankan.
- issue: Apakah ἐγερθήσεται harus diterjemahkan secara eksplisit sebagai dibangkitkan
  choice: akan bangkit
  alternative: akan dibangkitkan
  rationale: Konteks penghakiman memungkinkan gema kebangkitan, tetapi kata kerjanya juga dapat menggambarkan tampil atau berdiri sebagai saksi. Terjemahan tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Susunan kalimat mengikuti gerak retoris sumber tanpa menjadi kaku; 'lihatlah' mempertahankan penekanan klimaktis.
