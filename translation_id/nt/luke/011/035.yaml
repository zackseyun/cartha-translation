  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: id
  text: Karena itu, waspadalah, jangan-jangan terang yang ada di dalam dirimu adalah kegelapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pastikanlah bahwa terang yang ada di dalam dirimu bukan kegelapan.”
    reason: Alternatif ini menerjemahkan σκόπει sebagai 'pastikanlah' dan menyatakan secara lebih langsung konstruksi peringatan dengan kopula statif ἐστίν ('adalah').
lexical_decisions:
- source_word: σκόπει
  choice: waspadalah
  rationale: Imperatif kini orang kedua tunggal ini menyerukan kewaspadaan yang terus-menerus. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari pengajaran sebelumnya tentang mata dan terang serta menghubungkan ayat ini secara logis dengan konteksnya.
- source_word: μὴ
  choice: supaya ... jangan sampai
  rationale: Dalam konstruksi bersama imperatif, μή memperkenalkan keadaan yang harus diwaspadai atau dicegah. Ungkapan ini menyampaikan nuansa peringatan secara alami.
- source_word: τὸ φῶς
  choice: terang
  rationale: Mempertahankan metafora terang secara langsung tanpa mempersempitnya menjadi pengertian, hati nurani, atau keadaan rohani tertentu.
- source_word: τὸ ἐν σοὶ
  choice: yang ada di dalam dirimu
  rationale: Menyampaikan frasa berartikel dan preposisional tersebut secara jelas serta tetap membiarkan cakupan metaforanya terbuka.
- source_word: σκότος
  choice: kegelapan
  rationale: Mempertahankan pertentangan metaforis antara terang dan kegelapan dalam konteks langsung.
- source_word: ἐστίν
  choice: menjadi
  rationale: Dalam konstruksi peringatan bahasa Indonesia, 'jangan sampai menjadi kegelapan' mengungkapkan keadaan yang dikhawatirkan dengan alami. Ini tidak dimaksudkan untuk menetapkan perubahan temporal, melainkan menyampaikan daya peringatan dari μή ... ἐστίν.
theological_decisions:
- issue: Makna metaforis 'terang' dan 'kegelapan'
  choice: Metafora dipertahankan tanpa menentukan terang sebagai hati nurani, pemahaman, atau keadaan rohani tertentu.
  alternative: Menjelaskan terang sebagai 'pengertianmu', 'terang batinmu', atau 'hati nuranimu'.
  rationale: Perkataan Yesus sengaja memakai gambaran yang luas, terkait dengan persepsi dan keadaan batin dalam konteks sebelumnya. Penjelasan yang lebih khusus akan memasukkan tafsiran yang tidak dinyatakan oleh teks Yunani.
- issue: Apakah terang itu sudah merupakan kegelapan atau dapat menjadi kegelapan
  choice: Teks utama memakai konstruksi peringatan alami 'jangan sampai menjadi kegelapan', dengan catatan kaki yang mempertahankan alternatif statif.
  alternative: Pastikanlah bahwa terang yang ada di dalam dirimu bukan kegelapan.
  rationale: Bahasa Yunani memakai kopula 'adalah', tetapi μή sesudah imperatif memberi daya peringatan. Bahasa Indonesia yang alami dapat mengungkapkannya sebagai keadaan yang jangan sampai terjadi, sedangkan alternatif yang lebih formal dicatat agar ambiguitas dan struktur sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Waspadalah' mempertahankan nada peringatan; pasangan 'terang' dan 'kegelapan' dipertahankan sebagai metafora. Penanda catatan kaki [a] dicantumkan dalam teks utama.
