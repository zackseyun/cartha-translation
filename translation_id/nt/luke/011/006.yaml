translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Kata “sahabat” dipilih untuk φίλος, sedangkan “aku” sesuai dengan tuturan langsung dalam perumpamaan. Penutup memakai tanda petik tunggal karena ayat ini merupakan ujaran yang berada di dalam kutipan langsung yang lebih luas.
