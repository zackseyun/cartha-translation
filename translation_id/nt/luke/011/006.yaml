  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: id
  text: sebab seorang sahabatku datang kepadaku dari perjalanan[a], dan aku tidak punya apa-apa untuk dihidangkan kepadanya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari jalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: sebab
  rationale: Kata penghubung kausal ini memperkenalkan alasan permintaan dalam perumpamaan; “sebab” alami dan sesuai dengan gaya naratif yang bermartabat.
- source_word: φίλος μου
  choice: seorang sahabatku
  rationale: Ungkapan ini mempertahankan sifat tak tentu dari φίλος tanpa artikel sekaligus menyatakan hubungan pribadi melalui μου.
- source_word: παρεγένετο
  choice: baru saja tiba
  rationale: Verba aoris παραγίνομαι menyatakan kedatangan. Dalam konteks permintaan tengah malam, “baru saja tiba” menyampaikan kedatangan yang telah terjadi dan keadaan bahwa sahabat itu kini hadir, tanpa memakai bentuk kala yang tidak dimiliki bahasa Indonesia.
- source_word: ἐξ ὁδοῦ
  choice: setelah menempuh perjalanan
  rationale: Secara harfiah berarti “dari jalan,” tetapi dalam konteks ini mengacu pada datang sesudah bepergian. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa perjalanan itu sendiri adalah tempat asal.
- source_word: πρός με
  choice: di tempatku
  rationale: Frasa ini secara harfiah menunjukkan gerak “kepadaku.” Dalam bahasa Indonesia, “tiba di tempatku” menyampaikan arah kedatangan secara alami tanpa secara eksplisit menambahkan “rumah,” yang hanya tersirat oleh konteks.
- source_word: οὐκ ἔχω ὃ παραθήσω αὐτῷ
  choice: aku tidak punya apa-apa untuk dihidangkan kepadanya
  rationale: παρατίθημι dalam konteks jamuan berarti menaruh atau menyajikan makanan di hadapan seseorang. “Dihidangkan” menyampaikan makna keramahtamahan secara alami, sedangkan “apa-apa” tetap tidak menentukan benda atau makanan tertentu.
