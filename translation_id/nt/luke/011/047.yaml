  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: id
  text: Celakalah kalian[a], sebab kalian membangun makam[b] para nabi, tetapi nenek moyang kalian membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Celaka bagi kalian.”
    reason: Bentuk utama lebih alami dalam bahasa Indonesia, sedangkan catatan ini menunjukkan konstruksi datif Yunani.
  - marker: b
    text: Atau “bangunan peringatan kubur.” Kata Yunani ini dapat berarti makam atau monumen kubur.
    reason: Menjaga cakupan makna μνημεῖον yang mencakup makam maupun bangunan peringatan yang berhubungan dengan kubur.
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Celakalah kalian
  rationale: Ungkapan ini mempertahankan daya kecaman kenabian dan sapaan langsung kepada kelompok yang dituju. "Kalian" wajar dalam bahasa Indonesia modern dan memperjelas bentuk jamak.
- source_word: ὅτι
  choice: sebab
  rationale: Menandai alasan bagi seruan celaka secara ringkas dan alami.
- source_word: οἰκοδομεῖτε
  choice: kalian membangun
  rationale: Bentuk kini Yunani tidak harus diberi aspek progresif; bentuk kini sederhana menjaga tindakan/praktik tersebut tanpa penajaman berlebih.
- source_word: τὰ μνημεῖα
  choice: makam
  rationale: Dalam konteks ini μνημεῖον menunjuk pada makam atau bangunan peringatan kubur. "Makam" paling jelas dan alami, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: τῶν προφητῶν
  choice: para nabi
  rationale: Genitif menyatakan makam yang terkait dengan para nabi; konstruksi Indonesia ini alami tanpa perlu mengulang kata penghubung.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: tetapi nenek moyang kalianlah
  rationale: '"Nenek moyang" menyampaikan πατέρες dalam arti leluhur. "Tetapi" mempertahankan peralihan/kontras δέ, sedangkan partikel -lah menandai pergantian subjek yang tegas dalam klausa Yunani.'
- source_word: ἀπέκτειναν αὐτούς
  choice: yang membunuh mereka
  rationale: '"Membunuh" menyampaikan arti dasar verba tanpa menambahkan kategori hukum seperti "membunuh dengan keji"; "mereka" merujuk kembali kepada para nabi.'
theological_decisions:
- issue: Hubungan retoris antara pembangunan makam dan pembunuhan para nabi oleh leluhur
  choice: 'Mempertahankan dua tindakan yang dijajarkan dengan kontras: "kalian membangun ... tetapi nenek moyang kalianlah yang membunuh mereka."'
  alternative: 'Menggabungkannya sebagai klausa relatif: "makam para nabi yang dibunuh oleh nenek moyang kalian."'
  rationale: Susunan Yunani beralih dari subjek "kalian" kepada subjek eksplisit "nenek moyang kalian" dengan δέ. Terjemahan ini mempertahankan ketegangan retoris tanpa menerangkan secara dini kesimpulan mengenai kesaksian atau keterlibatan yang dikembangkan pada ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kecaman yang khidmat. Sapaan jamak diterjemahkan "kalian" agar jumlah gramatikal jelas; "Anda" dihindari karena dapat terdengar terlalu sopan bagi konteks teguran keras ini.
