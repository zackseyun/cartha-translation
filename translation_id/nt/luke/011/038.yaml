  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: id
  text: Namun, ketika melihat hal itu, orang Farisi itu heran karena Yesus tidak lebih dahulu membasuh diri sebelum makan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak lebih dahulu melakukan pembasuhan ritual sebelum makan.” Kata kerja Yunani yang dipakai di sini juga sering digunakan dengan arti “membaptis”, tetapi dalam konteks ini menunjuk pada pembasuhan ritual menurut kebiasaan kemurnian orang Farisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai perkembangan narasi dengan nuansa kontras ringan terhadap tindakan Yesus pada ayat sebelumnya.
- source_word: ὁ Φαρισαῖος
  choice: orang Farisi itu
  rationale: Menerjemahkan sebutan kelompok secara baku dan mempertahankan fungsi artikel tertentu secara alami dalam bahasa Indonesia.
- source_word: ἰδὼν
  choice: ketika melihat hal itu
  rationale: Partisip aoris ini menyatakan keadaan temporal yang mendahului reaksi utama; objek yang tersirat dipulihkan dari konteks.
- source_word: ἐθαύμασεν
  choice: heran
  rationale: Mengungkapkan keterkejutan orang Farisi tanpa menambahkan secara eksplisit nada ketidaksetujuan yang hanya tersirat dari konteks.
- source_word: οὐ πρῶτον
  choice: tidak lebih dahulu
  rationale: Mempertahankan gagasan bahwa pembasuhan diharapkan dilakukan sebelum makan.
- source_word: ἐβαπτίσθη
  choice: membasuh diri
  rationale: Dalam konteks kebiasaan kemurnian Farisi sebelum makan, verba ini menunjuk pada pembasuhan ritual, bukan baptisan Kristen; bentuk medial-pasif diungkapkan secara idiomatis.
- source_word: πρὸ τοῦ ἀρίστου
  choice: sebelum makan
  rationale: Menyampaikan hubungan waktunya secara alami tanpa mempersempit ἄριστον menjadi sarapan atau makan siang.
theological_decisions:
- issue: Makna ἐβαπτίσθη dalam konteks jamuan orang Farisi
  choice: pembasuhan ritual sebelum makan, diterjemahkan “membasuh diri”
  alternative: dibaptis; membenamkan diri
  rationale: Konteks langsung menyangkut praktik kemurnian sebelum makan, bukan baptisan Kristen. Catatan kaki mempertahankan hubungan leksikal verba itu dengan istilah yang lazim diterjemahkan “membaptis” tanpa memasukkan makna sakramental ke dalam adegan ini.
- issue: Subjek tersirat dalam klausa ὅτι οὐ πρῶτον ἐβαπτίσθη
  choice: dinyatakan sebagai “Yesus”
  alternative: mempertahankan pronomina tersirat sebagai “Ia”
  rationale: Bahasa Yunani mengandalkan subjek yang diketahui dari konteks, yaitu Yesus. Menyebut nama-Nya mencegah ambiguitas dalam bahasa Indonesia seolah-olah orang Farisi itulah yang tidak membasuh diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Ungkapan “membasuh diri” terasa lebih wajar daripada bentuk pasif harfiah serta tetap menunjukkan tindakan pembasuhan pribadi; catatan kaki menjelaskan sifat ritual dan keluasan leksikal verba Yunani.
