  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia pada urutan dan makna teks Yunani. Namun, εἰσελθόντα berbentuk jamak sedangkan κατοικεῖ berbentuk tunggal dalam teks SBLGNT. Draf meratakan pergeseran ini menjadi subjek jamak ('roh-roh itu tinggal'). Revisi mempertahankan pergeseran yang ada dalam teks tanpa menetapkan secara berlebihan siapa yang dimaksud oleh verba tunggal itu.
  naturalness: Bahasa Indonesia revisi tetap baku, jelas, dan bernada naratif wajar. Pengulangan 'roh itu' sesudah 'roh-roh itu' disengaja untuk mencerminkan perubahan jumlah dalam sumber dan tetap dapat dipahami dalam konteks.
  terminology: '''Roh'' tepat untuk πνεύματα dan tidak mengimpor istilah ''setan'' atau ''roh najis''. ''Lebih jahat'' merupakan padanan yang alami bagi πονηρότερα. Alternatif ''lebih fasik'' dihapus karena dalam bahasa Indonesia dapat mempersempit makna menjadi ketidaktaatan religius, sedangkan πονηρός di sini lebih luas, yaitu jahat/buruk.'
