    rationale: Teks Yunani yang diberikan mempunyai partisipel jamak εἰσελθόντα ('setelah roh-roh itu masuk') tetapi verba tunggal κατοικεῖ ('ia tinggal'). Walaupun konstruksi tersebut sulit dan dapat dipahami secara kolektif, terjemahan tidak sebaiknya menghapus pergeseran gramatikalnya tanpa penanda.
  - severity: low
