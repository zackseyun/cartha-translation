    rationale: Dalam pemakaian Indonesia modern, 'fasik' terutama mengacu pada ketidaktaatan terhadap Allah/ajaran agama. Makna πονηρότερα dalam konteks ini adalah 'lebih jahat' atau 'lebih buruk'; alternatif 'lebih buruk' lebih aman.
