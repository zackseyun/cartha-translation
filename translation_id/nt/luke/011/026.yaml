id: LUK.11.26
reference: Luke 11:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: id
  text: Kemudian roh itu pergi dan membawa serta tujuh roh lain yang lebih jahat daripada dirinya[a]. Sesudah roh-roh itu masuk, roh itu tinggal di sana[b]. Maka keadaan akhir orang itu menjadi lebih buruk daripada keadaannya semula[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lebih buruk daripada dirinya.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani menyebut “roh-roh”, bukan secara eksplisit “setan-setan” atau “roh-roh najis” dalam ayat ini, meskipun konteksnya jelas menunjukkan bahwa roh-roh itu jahat. Partisipel “masuk” berbentuk jamak, sedangkan kata kerja “tinggal” berbentuk tunggal.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “kesudahan orang itu menjadi lebih buruk daripada keadaannya semula.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kemudian
  rationale: Menandai urutan dalam kisah secara alami dalam bahasa Indonesia.
- source_word: πορεύεται
  choice: pergi
  rationale: Menyampaikan makna gerak yang langsung tanpa menambahkan gagasan kepergian permanen.
- source_word: παραλαμβάνει
  choice: membawa serta
  rationale: Menangkap nuansa mengambil pihak lain untuk menyertai dirinya.
- source_word: ἕτερα πνεύματα
  choice: roh lain
  rationale: Mempertahankan kata umum 'roh' tanpa menambahkan 'setan' atau 'roh najis', yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: πονηρότερα ἑαυτοῦ
  choice: lebih jahat daripada dirinya
  rationale: Mempertahankan perbandingan dengan roh yang kembali; 'jahat' merupakan padanan alami bagi πονηρός dalam konteks ini.
- source_word: ἑπτά
  choice: tujuh
  rationale: Angka kardinal diterjemahkan secara langsung.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Sesudah masuk, roh-roh itu tinggal di sana
  rationale: Partisipel jamak menunjukkan roh-roh sebagai pelaku tindakan masuk. Bentuk 'sesudah masuk' mempertahankan hubungan temporal, sedangkan subjek jamak membuat maksud kalimat jelas meski κατοικεῖ berbentuk tunggal dalam teks.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: keadaan akhir ... lebih buruk daripada keadaannya semula
  rationale: Mengungkapkan idiom tentang kondisi seseorang kemudian hari dalam bahasa Indonesia yang wajar dan mempertahankan kontras akhir–semula.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: orang itu
  rationale: Bahasa Indonesia memakai 'orang' secara alami untuk individu tertentu tanpa kehilangan kekhususan referen.
theological_decisions:
- issue: Apakah πνεύματα perlu diperjelas sebagai setan atau roh najis
  choice: roh
  alternative: setan; roh najis
  rationale: Ayat ini hanya menyebut 'roh-roh'. Konteks dan frasa 'lebih jahat' sudah menunjukkan sifat mereka, sehingga kata yang tidak terdapat dalam klausa tidak ditambahkan.
- issue: Ketidakselarasan bentuk jamak εἰσελθόντα dengan bentuk tunggal κατοικεῖ
  choice: roh-roh itu tinggal
  alternative: roh itu tinggal; mereka masuk dan tinggal
  rationale: Partisipel jamak merujuk pada roh-roh yang dibawa, dan makna konteksnya bersifat kolektif. Terjemahan jamak menyampaikan referen dengan jelas tanpa menghapus ketegangan gramatikal dari pertimbangan penerjemahan.
- issue: Makna τὰ ἔσχατα sebagai keadaan atau hasil akhir
  choice: keadaan akhir
  alternative: kesudahan; keadaan terakhir
  rationale: Frasa ini membandingkan kondisi orang tersebut sesudah kejadian dengan kondisinya semula, bukan sekadar titik waktu terakhir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Membawa serta' mempertahankan nuansa παραλαμβάνει, sementara pemecahan menjadi tiga kalimat menghindari rangkaian klausa yang kaku. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
