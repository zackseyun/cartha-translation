  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: id
  text: Lalu salah seorang ahli Taurat menanggapi Yesus, “Guru, dengan berkata demikian, Engkau juga menghina kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Lalu ... menanggapi
  rationale: Gabungan ini memperkenalkan tanggapan dalam alur narasi. “Lalu” menyatakan perkembangan ringan, sedangkan “menanggapi” mengungkapkan fungsi partisip tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: τις τῶν νομικῶν
  choice: salah seorang ahli Taurat
  rationale: Dalam konteks Lukas, νομικός adalah orang yang ahli dalam hukum Taurat Yahudi, bukan pengacara dalam pengertian profesi hukum modern. “Ahli Taurat” adalah sebutan Indonesia yang alami dan tepat secara kontekstual.
- source_word: λέγει αὐτῷ
  choice: menanggapi Yesus
  rationale: Pronomina “dia” diperjelas menjadi “Yesus” agar rujukannya alami dalam bahasa Indonesia. Kala kini historis Yunani disesuaikan dengan gaya narasi Indonesia.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan ini secara langsung dan wajar menerjemahkan διδάσκαλος dalam bahasa Indonesia modern.
- source_word: ταῦτα λέγων
  choice: dengan berkata demikian
  rationale: Ungkapan ini menunjukkan bahwa perkataan Yesus yang baru saja diucapkan menjadi dasar keluhan tersebut, sambil mempertahankan hubungan instrumental partisip Yunani.
- source_word: καὶ ἡμᾶς
  choice: juga ... kami
  rationale: '“Juga” mempertahankan daya aditif καί: para ahli Taurat merasa bahwa kecaman sebelumnya turut mengenai kelompok mereka.'
- source_word: ὑβρίζεις
  choice: menghina
  rationale: Kata ὑβρίζω di sini menyatakan perlakuan atau perkataan yang merendahkan dan menghina; “menghina” lebih tepat daripada “menyinggung,” yang terlalu lemah.
theological_decisions: []
