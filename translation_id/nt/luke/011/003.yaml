translation:
  language: id
  text: Berilah kami setiap hari roti kami sehari-hari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti untuk hari yang akan datang,” “roti yang kami perlukan,” atau, yang lebih kecil kemungkinannya di sini, “roti adikodrati.” Kata sifat Yunani ini sangat langka dan maknanya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: roti
  rationale: Kata ini secara harfiah berarti “roti” dan dalam konteks doa dapat mewakili kebutuhan pokok. “Roti” mempertahankan gambaran konkret dan ungkapan tradisional tanpa memperluasnya menjadi “makanan” dalam teks utama.
- source_word: ἡμῶν
  choice: yang kami perlukan
  rationale: Unsur kepunyaan “kami” dipadukan secara alami dengan terjemahan ἐπιούσιον, sehingga frasa Indonesianya menyatakan roti bagi kebutuhan kami tanpa menjadi kaku.
- source_word: ἐπιούσιον
  choice: yang kami perlukan
  rationale: Kata sifat yang sangat langka ini diperdebatkan maknanya. Pilihan ini menyampaikan kebutuhan akan pemeliharaan pokok secara wajar, sedangkan kemungkinan “untuk hari ini/hari yang akan datang” tetap dicatat dalam catatan kaki. Keterangan τὸ καθ’ ἡμέραν sudah menyatakan pengulangan setiap hari, sehingga terjemahan “roti sehari-hari setiap hari” dihindari.
- source_word: δίδου
  choice: Berikanlah
  rationale: Imperatif kini dapat menyiratkan pemberian yang terus-menerus atau berulang. Bentuk “Berikanlah” alami dan pantas untuk doa, sementara sifat berulangnya dinyatakan oleh “setiap hari”.
- source_word: ἡμῖν
  choice: kepada kami
  rationale: Menyatakan penerima dari perintah untuk memberi secara jelas dan alami dalam bahasa Indonesia.
- source_word: τὸ καθ’ ἡμέραν
  choice: setiap hari
  rationale: Ungkapan ini secara eksplisit menandai pemberian yang berulang hari demi hari dan menekankan ketergantungan yang terus-menerus.
theological_decisions:
- issue: Makna ἐπιούσιον dalam Doa Bapa Kami
  choice: yang kami perlukan
  alternative: untuk hari ini; untuk hari yang akan datang; yang diperlukan untuk hidup; adikodrati
  rationale: Makna kata sifat ini secara leksikal tidak pasti. Teks utama memakai ungkapan alami yang menunjuk pada kebutuhan pokok, tanpa menetapkan tafsiran sakramental atau metafisik. Berbagai kemungkinan yang sungguh-sungguh didukung dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang wajar dan bermartabat. Susunan “setiap hari” ditempatkan sebelum objek agar kalimat mengalir alami serta menghindari pengulangan janggal antara dua unsur Yunani yang sama-sama dapat diterjemahkan dengan gagasan “harian”.
