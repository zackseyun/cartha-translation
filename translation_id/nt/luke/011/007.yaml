  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: id
  text: Lalu orang di dalam itu menjawab, ‘Jangan menyusahkan aku.[a] Pintu sudah ditutup,[b] dan anak-anakku bersamaku di tempat tidur.[c] Aku tidak dapat bangun lalu memberimu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan mengganggu aku” atau “Jangan terus merepotkan aku.” Ungkapan Yunani ini secara harfiah berbicara tentang “memberikan kesusahan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Pintu sudah tertutup.” Verba perfek Yunani dapat menekankan tindakan yang telah selesai (“sudah ditutup”) atau keadaan yang dihasilkannya (“sudah tertutup”).
    reason: lexical_alternative
  - marker: c
    text: “Di tempat tidur” mengacu pada tempat tidur bersama dalam lingkungan rumah tangga, bukan pada keintiman suami istri.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν
  choice: Lalu orang yang di dalam itu
  rationale: Mengalirkan narasi secara alami sekaligus mempertahankan lokasi orang yang menjawab, yaitu di dalam rumah.
- source_word: ἀποκριθεὶς εἴπῃ
  choice: menjawab
  rationale: Ungkapan naratif harfiah 'menjawab dan berkata' diringkas secara wajar dalam bahasa Indonesia tanpa kehilangan maknanya.
- source_word: Μή μοι κόπους πάρεχε
  choice: Jangan menyusahkan aku
  rationale: Menyampaikan idiom Yunani yang berarti menimbulkan kesusahan atau gangguan dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: ἡ θύρα κέκλεισται
  choice: Pintu sudah ditutup
  rationale: 'Mempertahankan aspek perfektif: tindakan menutup telah terjadi dan keadaan tertutup masih berlangsung, tanpa menambahkan gagasan bahwa pintu dikunci.'
- source_word: τὰ παιδία μου
  choice: anak-anakku
  rationale: Padanan netral dan alami bagi παιδία tanpa terlalu menentukan usia anak-anak tersebut.
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: sudah bersamaku di tempat tidur
  rationale: Menggambarkan tempat tidur bersama dalam rumah tangga sambil menghindari konotasi keintiman seksual yang tidak dimaksudkan dalam konteks.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Aku tidak dapat bangun untuk memberikan sesuatu kepadamu
  rationale: Mengungkapkan ketidakmampuan atau keengganan praktis untuk bangun lalu memberikan barang yang diminta; 'sesuatu' melengkapi objek yang tersirat dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Sapaan tunggal informal 'aku' dan 'kamu' sesuai dengan percakapan antarpribadi dalam perumpamaan; bentuk '-mu' dipakai secara alami. Ambiguitas aspek pada κέκλεισται dipertahankan melalui catatan kaki.
