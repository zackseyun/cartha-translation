    rationale: εἰσίν hanya menyatakan bahwa anak-anak itu bersama dia di tempat tidur; ἤδη secara sintaktis menerangkan keadaan pintu yang telah tertutup. "Sudah" kedua tidak perlu dan berpotensi memperluas makna temporal.
