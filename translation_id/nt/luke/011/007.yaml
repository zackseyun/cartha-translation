  naturalness: '"Lalu orang di dalam itu menjawab" dan "Aku tidak dapat bangun lalu memberimu" merupakan bahasa Indonesia baku modern yang lebih lancar. Urutan "bangun lalu memberi" juga dengan baik mencerminkan partisipel ἀναστάς sebagai tindakan yang mendahului pemberian.'
  terminology: '"Pintu sudah ditutup" mempertahankan nuansa perfekt κέκλεισται tanpa menambahkan arti "dikunci." Catatan b diperbaiki: istilah yang tepat ialah "verba perfek," bukan "bentuk perfektif." "Anak-anakku" dan "tempat tidur" sesuai dengan arti dasar παιδία dan κοίτη dalam konteks rumah tangga.'
