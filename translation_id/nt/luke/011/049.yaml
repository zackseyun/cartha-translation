  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: id
  text: Karena itu, hikmat Allah juga berkata[a], “Aku akan mengutus kepada mereka para nabi dan rasul. Sebagian dari mereka akan mereka bunuh dan aniaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hikmat dari Allah.” Ungkapan ini dapat dipahami sebagai personifikasi hikmat ilahi, ketetapan Allah yang berhikmat, atau rujukan tersirat Yesus kepada diri-Nya sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Ungkapan sebab-akibat yang alami dalam bahasa Indonesia dan tetap mempertahankan kaitannya dengan kecaman sebelumnya.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan daya aditif καὶ dalam kaitannya dengan pernyataan yang diperkenalkan oleh ‘Karena itu’.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: hikmat Allah
  rationale: Padanan yang dekat dengan konstruksi sumber dan tidak menentukan apakah ungkapan ini merupakan personifikasi, ketetapan Allah yang berhikmat, atau rujukan tersirat kepada Yesus.
- source_word: εἶπεν
  choice: berkata
  rationale: Padanan lampau naratif yang sederhana dan tidak sarat penafsiran; dalam bahasa Indonesia waktu dipahami dari konteks.
- source_word: Ἀποστελῶ
  choice: Aku akan mengutus
  rationale: ‘Mengutus’ secara alami menyampaikan tindakan mengirim dengan suatu tugas dan cocok bagi nabi serta rasul.
- source_word: εἰς αὐτούς
  choice: kepada mereka
  rationale: Dengan verba pengutusan, frasa ini paling wajar menyatakan arah atau pihak tujuan.
- source_word: προφήτας
  choice: nabi-nabi
  rationale: Padanan baku dan jelas untuk bentuk jamak προφήτας.
- source_word: ἀποστόλους
  choice: rasul-rasul
  rationale: Mempertahankan kemungkinan makna teknis ἀπόστολος dalam Lukas-Kisah Para Rasul, bukan menggeneralisasikannya menjadi sekadar utusan.
- source_word: ἐξ αὐτῶν
  choice: Sebagian dari mereka
  rationale: 'Menyatakan arti partitif secara alami: yang dibunuh dan dianiaya berasal dari kelompok nabi dan rasul yang diutus.'
- source_word: ἀποκτενοῦσιν
  choice: akan mereka bunuh
  rationale: Padanan langsung dan lugas yang sekaligus mempertahankan pelaku ‘mereka’ dari konteks.
- source_word: διώξουσιν
  choice: aniaya
  rationale: Dalam pasangan dengan ‘bunuh’, kata ini secara jelas berarti melakukan penganiayaan, bukan sekadar mengejar.
theological_decisions:
- issue: Makna ‘hikmat Allah’
  choice: Diterjemahkan sebagai ‘hikmat Allah’ tanpa secara eksplisit menyamakannya dengan Yesus, Kitab Suci, atau sosok tersendiri.
  alternative: Personifikasi hikmat ilahi; ketetapan Allah yang berhikmat; atau rujukan tersirat Yesus kepada diri-Nya sendiri.
  rationale: Ungkapan Yunani memungkinkan beberapa pemahaman. Terjemahan utama mempertahankan ketegangan teologis itu tanpa menentukannya secara spekulatif.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. ‘Mengutus’, ‘nabi-nabi’, dan ‘rasul-rasul’ mempertahankan corak kitabiah yang masih mudah dipahami. Susunan ‘Sebagian dari mereka akan mereka bunuh dan aniaya’ menjaga dua rujukan ‘mereka’ dari teks sumber, meskipun rujukan pertama adalah para utusan dan yang kedua adalah pihak penerima.
