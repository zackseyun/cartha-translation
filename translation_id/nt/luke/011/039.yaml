id: LUK.11.39
reference: Luke 11:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: id
  text: Lalu Tuhan berkata kepadanya, “Sekarang kalian, orang Farisi, membersihkan bagian luar cawan dan piring, tetapi bagian dalam diri kalian penuh dengan keserakahan[a] dan kejahatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perampasan”, “penjarahan”, atau “pemerasan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar yang lazim bagi Yesus dalam Perjanjian Baru, bukan sekadar sapaan sopan.
- source_word: Νῦν
  choice: namun (dalam susunan klausa pembuka)
  rationale: Dalam konteks ini νῦν mengawali teguran tajam dengan nuansa keadaan yang sedang berlaku. Bahasa Indonesia alami tidak memerlukan terjemahan harfiah 'sekarang' di dalam kutipan; daya kontrasnya disampaikan oleh 'Namun' pada klausa pengantar.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: kalian orang Farisi
  rationale: Menampilkan penekanan pada kelompok yang disapa dan tetap alami dalam bahasa Indonesia modern.
- source_word: τὸ ἔξωθεν
  choice: bagian luar
  rationale: Menyatakan permukaan atau sisi luar secara konkret dan idiomatis.
- source_word: ποτηρίου
  choice: cawan
  rationale: Padanan baku dan bermartabat bagi wadah minum dalam konteks Alkitab.
- source_word: πίνακος
  choice: pinggan
  rationale: Menunjuk wadah makan atau piring saji tanpa mempersempitnya secara berlebihan.
- source_word: καθαρίζετε
  choice: membersihkan
  rationale: Bentuk kini menggambarkan tindakan yang dilakukan; pilihan ini alami dan mempertahankan gambaran konkret.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: batin kalian
  rationale: Mempertahankan kontras luar-dalam dan rujukannya kepada keadaan internal orang-orang Farisi tanpa mempersempitnya menjadi 'hati' atau 'pikiran'.
- source_word: γέμει
  choice: penuh dengan
  rationale: Padanan Indonesia yang idiomatis untuk keadaan dipenuhi sesuatu.
- source_word: ἁρπαγῆς
  choice: keserakahan
  rationale: Mengungkapkan kerakusan yang bersifat merampas dalam teguran moral ini; catatan kaki mempertahankan kemungkinan arti konkret seperti perampasan atau pemerasan.
- source_word: πονηρίας
  choice: kejahatan
  rationale: Istilah moral luas yang menyampaikan bobot teguran tanpa mempersempitnya menjadi kedengkian.
theological_decisions:
- issue: Rujukan metaforis τὸ ἔσωθεν ὑμῶν
  choice: batin kalian
  alternative: bagian dalam kalian; hati kalian
  rationale: Teks membandingkan pembersihan lahiriah dengan kerusakan internal. 'Batin' alami dalam bahasa Indonesia dan tidak menentukan fakultas tertentu seperti hati atau pikiran.
- issue: Makna moral ἁρπαγή
  choice: keserakahan dalam teks utama, dengan alternatif konkret dalam catatan kaki
  alternative: perampasan; penjarahan; pemerasan
  rationale: Konteks menyoroti keadaan moral internal, tetapi rentang leksikal kata Yunani juga dapat menunjuk tindakan mengambil secara paksa atau eksploitatif; ambiguitas itu dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena sapaan Yunani berbentuk jamak, sedangkan 'orang Farisi' terdengar lebih alami daripada konstruksi aposisional yang kaku. Penanda catatan [a] ditempatkan langsung sesudah kata yang diterangkan.
