  terminology: “Tuhan,” “orang Farisi,” “cawan,” “keserakahan,” dan “kejahatan” sesuai register Alkitab bahasa Indonesia serta keputusan leksikal yang tersedia. Catatan kaki pada “keserakahan” mempertahankan rentang makna ἁρπαγή.
