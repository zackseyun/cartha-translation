id: LUK.11.20
reference: Luke 11:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: id
  text: Namun, jika Aku mengusir setan-setan dengan jari Allah[a], maka Kerajaan Allah telah datang kepada kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan jari Allah.” Ungkapan ini merupakan idiom untuk kuasa langsung Allah dan menggemakan Keluaran 8:19.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah mencapai kalian” atau “telah tiba kepada kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: dengan jari Allah
  rationale: Mempertahankan metafora yang hidup dan kemungkinan gaung Keluaran 8:19. Kata depan ἐν menyatakan sarana atau perantaraan; “dengan” wajar dalam bahasa Indonesia tanpa menjelaskan metafora itu di dalam teks.
- source_word: ἐκβάλλω
  choice: mengusir
  rationale: Padanan alami dalam konteks pengusiran setan dan tetap menyampaikan tindakan mengeluarkan dengan kuasa.
- source_word: τὰ δαιμόνια
  choice: setan-setan
  rationale: Padanan langsung dan lazim bagi δαιμόνια dalam bahasa Indonesia. Ungkapan “roh-roh najis” tidak dipakai karena menerjemahkan istilah Yunani yang berbeda.
- source_word: ἄρα
  choice: maka
  rationale: Menandai kesimpulan logis yang ditarik dari anak kalimat bersyarat secara ringkas dan alami.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: telah datang kepadamu
  rationale: Menyampaikan tibanya Kerajaan Allah secara nyata dan menentukan. Bentuk ini alami dalam bahasa Indonesia, sambil membiarkan nuansa “mencapai” atau “menyusul” dicatat sebagai kemungkinan leksikal.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan yang akurat dan dikenal luas, yang dapat mencakup baik ranah kerajaan maupun pemerintahan Allah tanpa mempersempit maknanya.
theological_decisions:
- issue: Makna “jari Allah”
  choice: Metafora tentang kuasa atau tindakan langsung Allah dipertahankan sebagai gambaran dalam teks.
  alternative: Menafsirkannya secara eksplisit sebagai Roh Kudus berdasarkan perbandingan dengan Matius 12:28.
  rationale: Lukas memakai ungkapan “jari Allah”; terjemahan mempertahankan redaksinya dan gaung antarteksnya tanpa menggantinya dengan penafsiran teologis.
- issue: Daya ungkapan “Kerajaan Allah telah datang kepadamu”
  choice: Menyatakan bahwa Kerajaan Allah telah tiba dan sedang menerobos masuk melalui pelayanan Yesus.
  alternative: Memahaminya hanya sebagai peristiwa masa depan, atau semata-mata sebagai kedatangan yang menghukum.
  rationale: Aoristus ἔφθασεν dengan ἐπί menunjukkan tibanya sesuatu secara nyata kepada para pendengar. Terjemahan mempertahankan aspek kehadiran kini tanpa menetapkan suatu sistem eskatologi secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” mempertahankan pertentangan δέ, sedangkan “maka” menyatakan kesimpulan ἄρα. Metafora “jari Allah” dipertahankan, dan susunan “telah datang kepadamu” dipilih agar alami bagi pembaca umum.
