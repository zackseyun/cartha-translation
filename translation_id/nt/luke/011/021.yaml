  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: id
  text: Apabila orang yang kuat dan bersenjata lengkap menjaga pekarangannya sendiri[a], miliknya aman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “halaman rumahnya sendiri”, “kediamannya sendiri”, atau “kompleks rumahnya sendiri”; kata Yunani ini dapat menunjuk pada halaman maupun kediaman atau kompleks yang mencakupnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berada dalam damai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Apabila
  rationale: Mengungkapkan keadaan waktu yang bersifat umum atau bersyarat dengan wajar dalam bahasa Indonesia.
- source_word: ὁ ἰσχυρός
  choice: orang yang kuat
  rationale: Adjektiva substantival ini menunjuk kepada seorang laki-laki yang kuat; terjemahan ini alami dan tidak menambahkan identitas metaforisnya.
- source_word: καθωπλισμένος
  choice: bersenjata lengkap
  rationale: Partisipel perfekt menyatakan keadaan sebagai orang yang telah diperlengkapi sepenuhnya dengan senjata.
- source_word: φυλάσσῃ
  choice: menjaga
  rationale: Mempertahankan makna tindakan berjaga dan melindungi yang berlangsung dalam gambaran ini.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: pekarangannya sendiri
  rationale: αὐλή dapat berarti halaman atau kompleks kediaman; 'pekarangan' cukup luas untuk konteks penjagaan harta, sedangkan 'sendiri' mempertahankan penekanan ἑαυτοῦ.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: aman
  rationale: Ungkapan harfiahnya, 'berada dalam damai', secara idiomatis menyatakan keadaan tenteram dan tidak terganggu; 'aman' paling alami ketika subjeknya ialah harta milik.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: harta miliknya
  rationale: Mengacu pada barang, kekayaan, atau segala sesuatu yang menjadi miliknya; pilihan ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis perumpamaan dalam konteks
  choice: Mempertahankan gambaran 'orang yang kuat' tanpa secara eksplisit menyebutnya sebagai Iblis.
  alternative: Menafsirkan 'orang yang kuat' secara langsung sebagai Iblis dalam teks utama.
  rationale: Ayat ini sendiri menyajikan gambaran metaforis, sedangkan konteks sekitarnya menuntun pembaca kepada rujukannya. Terjemahan tidak seharusnya menggantikan gambaran itu dengan tafsir eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bermartabat. 'Pekarangan' dipilih untuk menjaga keluasan makna αὐλή tanpa memberi kesan istana yang tidak wajib, sedangkan 'aman' menyampaikan fungsi idiom ἐν εἰρήνῃ bagi harta benda.
