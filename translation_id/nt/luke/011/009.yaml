  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: id
  text: 'Dan Aku berkata kepadamu[a]: Mintalah, maka akan diberikan kepadamu; carilah, maka kamu akan menemukan; ketuklah, maka akan dibukakan bagimu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan menyatakan secara lebih eksplisit kemungkinan nuansa imperatif kini dalam bahasa Yunani: “Teruslah meminta ... teruslah mencari ... teruslah mengetuk.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: Aku berkata kepadamu
  rationale: Ungkapan ini mempertahankan kesinambungan dan penegasan dari καὶ ἐγώ serta terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: αἰτεῖτε
  choice: Mintalah
  rationale: Imperatif sederhana mempertahankan perintah tanpa menjadikan nuansa tindakan berkelanjutan sebagai satu-satunya tafsiran; kemungkinan itu dicatat dalam catatan kaki.
- source_word: δοθήσεται ὑμῖν
  choice: akan diberikan kepadamu
  rationale: Bentuk pasif futur diterjemahkan secara langsung sambil mempertahankan penerima yang dinyatakan oleh ὑμῖν.
- source_word: ζητεῖτε
  choice: carilah
  rationale: Kata 'mencari' mencakup tindakan harfiah maupun kiasan dan sesuai dengan perintah Yunani.
- source_word: εὑρήσετε
  choice: kamu akan menemukan
  rationale: Bentuk aktif futur diterjemahkan secara langsung dan menjaga kesejajaran janji.
- source_word: κρούετε
  choice: ketuklah
  rationale: Pilihan ini secara alami mengisyaratkan mengetuk pintu tanpa menambahkan objek yang tidak dinyatakan dalam teks.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: akan dibukakan bagimu
  rationale: Bentuk pasif dan objek yang tersirat dipertahankan. 'Bagimu' alami dalam konstruksi Indonesia ini dan tetap menyatakan pihak yang menerima manfaat.
theological_decisions:
- issue: Aspek imperatif kini αἰτεῖτε, ζητεῖτε, κρούετε
  choice: 'Diterjemahkan sebagai imperatif sederhana: ''mintalah'', ''carilah'', dan ''ketuklah''.'
  alternative: Teruslah meminta, teruslah mencari, dan teruslah mengetuk.
  rationale: Bentuk kini Yunani dapat menyiratkan tindakan yang berulang atau berkelanjutan, tetapi tidak selalu mewajibkan nuansa itu dinyatakan secara eksplisit. Teks utama mempertahankan ambiguitas aspek, sedangkan alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'Aku' mengikuti ujaran langsung Yesus; rangkaian imperatif berakhiran -lah menjaga ketegasan sekaligus kewajaran. Pergantian 'kepadamu' dan 'bagimu' dipilih demi kealamian tanpa mengubah rujukan jamak dari ὑμῖν; dalam bahasa Indonesia bentuk tersebut tidak membedakan tunggal dan jamak.
