  source_fidelity: Teks Indonesia mengikuti struktur dan makna Yunani dengan baik. Partisip aoris ἐλθόν ditangkap secara temporal melalui “Ketika roh itu tiba”; εὑρίσκει melalui “didapatinya”; dan kedua partisip pasif perfek, σεσαρωμένον serta κεκοσμημένον, tersampaikan sebagai keadaan hasil dalam “sudah disapu dan ditata.” Penyebutan “roh itu” dan “rumah itu” memperjelas rujukan yang tersirat berdasarkan konteks langsung tanpa mengubah makna.
  naturalness: Kalimatnya alami, ringkas, dan sesuai ragam Indonesia modern yang bermartabat. Bentuk “didapatinya” sedikit bernuansa formal, tetapi tetap idiomatis dan cocok untuk terjemahan Alkitab.
  terminology: '“Roh itu” dan “rumah itu” konsisten dengan konteks ayat sebelumnya. “Ditata” merupakan pilihan yang baik untuk κεκοσμημένον dalam konteks rumah: mencakup keadaan tertib tanpa membatasi makna menjadi dekorasi belaka. Catatan kaki menyediakan alternatif “dihiasi” secara memadai.'
