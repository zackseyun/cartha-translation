  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: id
  text: Ketika roh itu tiba, didapatinya rumah itu sudah disapu dan ditata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudah disapu dan dihiasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: ketika roh itu tiba
  rationale: Partisip aoris ini diberi fungsi temporal. Subjek tersirat diperjelas sebagai “roh itu” berdasarkan ayat sebelumnya agar bahasa Indonesia alami tanpa mengubah rujukannya.
- source_word: εὑρίσκει
  choice: didapatinya
  rationale: Bentuk kini historis menyajikan tindakan secara hidup. Bentuk ini ringkas dan mempertahankan roh tersebut sebagai pelaku.
- source_word: σεσαρωμένον
  choice: sudah disapu
  rationale: Partisip pasif perfek menyatakan tindakan yang telah dilakukan beserta keadaan hasilnya. “Sudah disapu” menyampaikan aspek resultatif tanpa menambahkan kata “bersih” yang tidak dinyatakan tersendiri dalam Yunani.
- source_word: κεκοσμημένον
  choice: ditata
  rationale: Dalam konteks rumah, κοσμέω dapat menunjuk pada penataan atau pengaturan. “Ditata” alami dalam bahasa Indonesia dan tidak membatasi makna pada hiasan semata.
theological_decisions:
- issue: Rujukan subjek dan objek yang tersirat
  choice: “roh itu” sebagai subjek dan “rumah itu” sebagai objek
  alternative: “ia” sebagai subjek dan “tempat itu” sebagai objek
  rationale: Bahasa Yunani mengandalkan konteks untuk keduanya. Penyebutan eksplisit dalam bahasa Indonesia menghindari ambiguitas pronominal yang tidak alami, sementara tetap mengikuti rujukan langsung kepada roh najis dan rumah dalam ayat sebelumnya.
- issue: Cakupan makna κεκοσμημένον
  choice: ditata
  alternative: dihiasi
  rationale: “Ditata” mempertahankan kemungkinan rumah yang teratur tanpa memaksakan gagasan dekorasi; alternatif literal “dihiasi” dicatat karena makna itu juga mungkin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami dengan memperjelas rujukan tersirat dari konteks. Penanda catatan kaki ditempatkan setelah keseluruhan frasa yang memiliki alternatif terjemahan.
