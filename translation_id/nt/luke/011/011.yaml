  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: id
  text: Siapakah di antara kalian yang, sebagai seorang ayah, jika anaknya meminta ikan, akan memberinya ular sebagai ganti ikan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Namun, siapa di antara kalian yang sebagai ayah
  rationale: Ungkapan ini berupa pertanyaan retoris tentang seorang ayah di antara para pendengar. Susunan ini mempertahankan unsur 'di antara kalian' dan peran sebagai ayah dalam bahasa Indonesia yang wajar.
- source_word: αἰτήσει
  choice: jika ... meminta
  rationale: Bentuk futur Yunani berfungsi dalam keadaan hipotetis pada pertanyaan retoris; konstruksi Indonesia dengan 'jika' menyampaikan hubungan itu secara alami.
- source_word: ὁ υἱὸς
  choice: anaknya
  rationale: Dalam konteks ayah-anak, bentuk artikular ini bersifat relasional. 'Anaknya' mengungkapkan relasi tersebut secara idiomatis tanpa mempersempit maknanya menjadi anak laki-laki, yang tidak perlu ditekankan di sini.
- source_word: ἰχθύν / ἰχθύος
  choice: ikan / ikan
  rationale: Benda konkret tunggal dipertahankan sesuai contoh dalam bahasa Yunani; bahasa Indonesia tidak memerlukan kata sandang tak tentu.
- source_word: ἀντὶ
  choice: sebagai ganti
  rationale: Pilihan ini menyampaikan makna substitusi dengan jelas dan alami.
- source_word: ὄφιν
  choice: ular
  rationale: '''Ular'' adalah padanan Indonesia modern dan netral bagi ὄφις dalam konteks ini, tanpa menambahkan nuansa simbolis yang tidak dituntut.'
- source_word: αὐτῷ ἐπιδώσει
  choice: akan memberikan ... kepadanya
  rationale: Menyampaikan tindakan memberi kepada anak itu dan mempertahankan bentuk futur dalam pertanyaan retoris.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk menandai bahwa ὑμῶν merujuk kepada para pendengar secara jamak; struktur pertanyaan retoris dan kontras ikan dengan ular dipertahankan.
