source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: id
  text: Namun, ketika seseorang yang lebih kuat daripadanya mendatanginya dan mengalahkannya[a], orang itu mengambil seluruh perlengkapan perangnya[b] yang diandalkannya, lalu membagi-bagikan jarahannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menaklukkannya" atau "menguasainya".
    reason: lexical_alternative
  - marker: b
    text: Ungkapan "seluruh perlengkapan perangnya" menerjemahkan istilah yang berarti seperangkat lengkap perlengkapan tempur.
    reason: lexical_alternative
  - marker: c
    text: Atau "barang rampasannya".
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Namun, ketika
  rationale: Menyampaikan hubungan waktu bersyarat sekaligus kontras δέ dengan keadaan pada ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: seseorang yang lebih kuat daripadanya
  rationale: Mempertahankan adjektiva komparatif yang dipakai secara substantival tanpa menambahkan kata 'orang laki-laki' yang tidak dinyatakan dalam klausa ini.
- source_word: ἐπελθὼν
  choice: datang menyerang
  rationale: Dalam konteks pertarungan, ἐπέρχομαι menyatakan datang menghadapi atau menyerang; pilihan ini terdengar alami dan memperjelas arah permusuhan tanpa menambahkan identitas pelaku.
- source_word: νικήσῃ αὐτόν
  choice: mengalahkannya
  rationale: νικάω berarti menang atas atau mengalahkan. Pilihan ini jelas dan wajar, serta tetap membuka kemungkinan nuansa 'menaklukkan' atau 'menguasai'.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: seluruh perlengkapan senjata
  rationale: πανοπλία menunjuk pada seperangkat lengkap perlengkapan tempur, bukan hanya satu senjata atau baju zirah.
- source_word: αἴρει
  choice: merampas
  rationale: Dalam konteks orang yang telah dikalahkan, αἴρω berarti mengambil atau membawa pergi; 'merampas' secara alami menghubungkan tindakan itu dengan penyitaan perlengkapan tempurnya.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: yang diandalkannya
  rationale: Bentuk perfect ἐπεποίθει dengan aspek keadaan lampau menyatakan kepercayaan atau ketergantungan yang telah menetap; 'diandalkan' cocok dengan objek berupa perlengkapan senjata.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: jarahannya
  rationale: σκῦλα adalah barang rampasan yang diperoleh dari pihak yang kalah; 'jarahan' merupakan padanan Indonesia yang ringkas dan sesuai dengan gambaran peperangan.
- source_word: διαδίδωσιν
  choice: membagi-bagikan
  rationale: διαδίδωμι menyatakan pembagian atau pendistribusian kepada beberapa pihak; bentuk ulang ini menyampaikan tindakan tersebut secara alami.
theological_decisions:
- issue: Apakah sosok yang lebih kuat perlu disebut secara eksplisit sebagai 'orang yang lebih kuat' atau diidentifikasi secara teologis.
  choice: seseorang yang lebih kuat daripadanya
  alternative: orang yang lebih kuat daripadanya; sosok tertentu yang diidentifikasi sebagai Yesus
  rationale: Teks Yunani memakai bentuk komparatif secara substantival tanpa nomina eksplisit dan tanpa menyebut identitas sosok itu dalam ayat ini. Terjemahan mempertahankan gambaran tersebut dan membiarkan konteks menentukan rujukannya.
- issue: Seberapa kuat νικάω perlu diterjemahkan dalam gambaran konflik ini.
  choice: mengalahkannya
  alternative: menguasainya; menaklukkannya
  rationale: '''Mengalahkan'' menyatakan kemenangan yang menghasilkan pelucutan dan perampasan, tetapi tidak mempersempit gambaran menjadi tafsiran teologis tertentu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kata 'daripadanya' dipakai agar perbandingan tidak rancu; istilah militer dipertahankan karena merupakan unsur utama gambaran dalam teks.
