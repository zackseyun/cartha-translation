id: LUK.11.5
reference: Luke 11:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Siapa di antara kalian yang mempunyai seorang sahabat dan akan pergi kepadanya pada tengah malam[a] serta berkata, ‘Sahabat, pinjamkanlah kepadaku tiga roti,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa di antara kalian yang akan mempunyai seorang sahabat dan akan pergi kepadanya pada tengah malam …” Bahasa Yunani memakai bentuk mendatang dalam pertanyaan retoris; dalam bahasa Indonesia, kata kerja pertama dapat dinyatakan lebih alami tanpa penanda kala.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Siapa di antara kalian
  rationale: Bentuk ini menyampaikan pertanyaan retoris yang ditujukan langsung kepada para pendengar dalam bahasa Indonesia modern dan alami.
- source_word: ἕξει
  choice: yang mempunyai
  rationale: Kala mendatang Yunani berada dalam susunan pertanyaan retoris; bahasa Indonesia lebih alami tidak memberi penanda kala pada kata kerja pertama ini. Kemungkinan mempertahankan nuansa mendatang dicatat dalam catatan kaki.
- source_word: φίλον / Φίλε
  choice: sahabat / Sahabat
  rationale: Mempertahankan pengulangan leksikal Yunani antara penyebutan hubungan dan sapaan langsung.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: akan pergi kepadanya
  rationale: Menyampaikan gerak menuju orang tersebut secara lugas sekaligus mempertahankan bentuk mendatang pada verba utama pertanyaan.
- source_word: μεσονυκτίου
  choice: pada tengah malam
  rationale: Genitif ini berfungsi sebagai keterangan waktu; padanan langsung dan wajar ialah 'pada tengah malam'.
- source_word: εἴπῃ αὐτῷ
  choice: serta berkata
  rationale: Meneruskan rangkaian tindakan dalam pertanyaan retoris tanpa menambahkan makna di luar λέγω.
- source_word: χρῆσόν μοι
  choice: pinjamkanlah kepadaku
  rationale: Imperatif ini meminta pemberian sementara atau pinjaman; bentuk ini jelas, santun, dan sesuai dengan konteks permintaan kepada sahabat.
- source_word: τρεῖς ἄρτους
  choice: tiga roti
  rationale: Dalam konteks ini ἄρτοι adalah roti-roti utuh; bahasa Indonesia lazim memakai 'tiga roti' tanpa kata penggolong tambahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti 'Ia' mengikuti rujukan maskulin tunggal dalam konteks tanpa memasukkan nama yang tidak terdapat dalam ayat ini.
