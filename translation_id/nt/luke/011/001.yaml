  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: id
  text: Pada suatu ketika, Yesus sedang berdoa di suatu tempat. Ketika ia berhenti, salah seorang muridnya berkata kepadanya, “Tuhan, ajarlah kami berdoa, sebagaimana Yohanes juga mengajar murid-muridnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Pada suatu ketika
  rationale: Formula naratif Lukas ini memperkenalkan suatu peristiwa. Ungkapan ini alami dalam bahasa Indonesia modern tanpa memakai bentuk harfiah yang kaku seperti “Dan terjadilah”.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: Yesus sedang berdoa
  rationale: Konstruksi infinitif artikular dengan partisipel menyatakan keadaan yang sedang berlangsung. Nama “Yesus” dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: ἐν τόπῳ τινὶ
  choice: di sebuah tempat
  rationale: Mempertahankan ketidakpastian tempat yang terdapat dalam frasa Yunani, dengan ungkapan Indonesia yang wajar.
- source_word: ὡς ἐπαύσατο
  choice: Setelah ia berhenti
  rationale: ἐπαύσατο secara langsung berarti berhenti atau selesai melakukan sesuatu. “Berhenti” mempertahankan pilihan leksikal sumber tanpa memperluasnya menjadi “selesai berdoa”.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: salah seorang muridnya
  rationale: Ini merupakan padanan Indonesia yang alami bagi konstruksi partitif “seorang dari antara murid-muridnya”.
- source_word: Κύριε
  choice: Tuhan
  rationale: “Tuhan” mempertahankan rentang makna dan bobot gelar κύριος ketika Yesus disapa secara langsung.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: ajarlah kami berdoa
  rationale: Padanan langsung dan alami bagi imperatif dengan pelengkap infinitif, tanpa menambahkan kata “cara” yang tidak dinyatakan secara eksplisit.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: sebagaimana Yohanes juga mengajar murid-muridnya
  rationale: “Sebagaimana” menyatakan perbandingan dari καθώς, sedangkan “juga” mewakili καί.
theological_decisions:
- issue: Penerjemahan κύριος sebagai sapaan kepada Yesus
  choice: Tuhan
  alternative: Guru
  rationale: “Tuhan” mempertahankan rentang semantis dan arti penting gelar κύριος dalam Injil Lukas tanpa membatasi sapaan itu hanya pada peran Yesus sebagai pengajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, tetapi tetap mudah dipahami. Struktur Yunani diolah menjadi alur naratif Indonesia yang alami. Huruf kecil pada pronomina “ia” dan akhiran “-nya” mengikuti ejaan modern tanpa mengurangi penghormatan.
