source:
  edition: SBLGNT
  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: id
  text: Setelah Yesus pergi dari sana, para ahli Taurat dan orang-orang Farisi mulai mendesak-Nya dengan keras dan memancing-Nya berbicara tentang banyak hal,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencecar-Nya dengan pertanyaan” atau “memaksa-Nya menjawab tanpa persiapan.” Kata Yunani yang dipakai jarang ditemukan dan menyiratkan upaya agresif untuk memancing jawaban dari-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Setelah Yesus pergi dari sana
  rationale: Konstruksi genitif absolut dengan partisip aoris menunjukkan keadaan yang mendahului verba utama. Nama “Yesus” dipakai alih-alih pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia, sementara unsur tempat dari Κἀκεῖθεν tetap dipertahankan.
- source_word: ἤρξαντο
  choice: mulai
  rationale: Menyampaikan aspek ingresif verba bersama kedua infinitif pelengkap secara langsung dan wajar.
- source_word: οἱ γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk kelompok pakar Kitab Suci dan hukum Taurat; “ahli Taurat” merupakan sebutan baku, jelas, dan lebih informatif bagi pembaca Indonesia daripada transliterasi “juru tulis”.
- source_word: οἱ Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Transliterasi baku untuk nama kelompok ini dalam bahasa Indonesia.
- source_word: δεινῶς ἐνέχειν
  choice: mendesak-Nya dengan keras
  rationale: Gabungan adverbia dan verba menggambarkan tekanan atau sikap bermusuhan yang kuat. Pilihan ini mempertahankan daya agresif ungkapan tanpa menambahkan tujuan yang belum dinyatakan dalam ayat.
- source_word: ἀποστοματίζειν αὐτὸν
  choice: memancing-Nya berbicara
  rationale: Verba yang langka ini tampaknya berarti secara agresif mendorong atau menarik keluar ucapan seseorang. “Memancing-Nya berbicara” mempertahankan nuansa adversatif dan tidak terlalu mempersempit cara mereka melakukannya.
- source_word: περὶ πλειόνων
  choice: tentang banyak hal
  rationale: Dalam konteks ini frasa tersebut paling alami dipahami sebagai banyak pokok atau perkara, bukan perbandingan eksplisit “lebih banyak”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk penghormatan pada pronomina yang merujuk kepada Yesus mengikuti konvensi umum penerbitan Alkitab Indonesia. Ambiguitas verba langka ἀποστοματίζειν dipertahankan melalui catatan kaki.
