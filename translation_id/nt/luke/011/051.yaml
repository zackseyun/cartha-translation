id: LUK.11.51
reference: Luke 11:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: id
  text: dari darah Habel sampai darah Zakharia[a], yang tewas di antara mazbah dan Bait Allah[b]. Ya, Aku berkata kepadamu, hal itu akan dituntut dari angkatan ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas Zakharia ini diperdebatkan. Beberapa kemungkinan ialah Zakharia anak Yoyada (2 Tawarikh 24:20–22) atau Zakharia anak Berekhya.
    reason: cross_reference
  - marker: b
    text: Atau “Rumah Tuhan”; bahasa Yunani secara harfiah, “rumah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου
  choice: mulai dari darah Habel sampai darah Zakharia
  rationale: Mempertahankan rentang retoris dari Habel hingga Zakharia serta ungkapan darah yang dalam konteks menunjuk kepada penumpahan darah dan kesalahannya.
- source_word: τοῦ ἀπολομένου
  choice: yang tewas
  rationale: Mengungkapkan kematian akibat kekerasan secara alami tanpa menyebut pelaku yang tidak dinyatakan oleh bentuk partisipelnya.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: di antara mazbah dan Rumah Tuhan
  rationale: Mazbah adalah istilah Alkitab Indonesia yang lazim untuk θυσιαστήριον. Dalam konteks kompleks Bait Allah, οἶκος berarti Rumah Allah; 'Rumah Tuhan' mempertahankan citra 'rumah' sekaligus memperjelas acuannya.
- source_word: ναί, λέγω ὑμῖν
  choice: Ya, Aku berkata kepadamu
  rationale: Mempertahankan penegasan khidmat ναί dan susunan ujaran langsung yang dekat dengan bahasa sumber serta wajar dalam ragam Alkitab Indonesia.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: pertanggungjawaban atas darah itu akan dituntut dari angkatan ini
  rationale: Dalam konteks darah para nabi pada ayat sebelumnya, ἐκζητέω menyatakan penuntutan pertanggungjawaban atas darah. Penambahan eksplisit 'pertanggungjawaban atas darah itu' membuat elipsis Yunani dapat dipahami dalam bahasa Indonesia tanpa menentukan siapa pelaksana tindakan pasif tersebut; 'angkatan' mempertahankan daya γενεά.
theological_decisions:
- issue: Identitas Zakharia
  choice: Nama Zakharia dibiarkan tanpa identifikasi dalam teks utama.
  alternative: Zakharia anak Yoyada; Zakharia anak Berekhya; atau sosok representatif martir kenabian.
  rationale: Teks Yunani ayat ini tidak memberikan nama ayah atau keterangan lain yang memastikan identitasnya. Catatan kaki menyampaikan perdebatan tanpa menyelesaikannya.
- issue: Lingkup pertanggungjawaban 'angkatan ini'
  choice: Frasa 'angkatan ini' dipertahankan tanpa perluasan atau pembatasan doktrinal.
  alternative: Menafsirkannya secara khusus sebagai seluruh bangsa, para pemimpin tertentu, atau kelompok lintas zaman.
  rationale: γενεᾶς ταύτης secara langsung menunjuk angkatan yang sedang dibicarakan Yesus; terjemahan tidak memasukkan sistem teologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Aku' mengikuti konvensi ujaran ilahi dalam penerbitan Alkitab Indonesia. 'Rumah Tuhan' dipilih agar οἶκος tidak kehilangan citra harfiah 'rumah', sedangkan konteksnya sebagai Bait Allah tetap jelas. Semua penanda catatan kaki hadir dalam teks utama.
