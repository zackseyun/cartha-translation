  naturalness: “Bait Allah” merupakan padanan modern-baku yang lebih jelas dan lazim daripada “Rumah Tuhan” untuk οἶκος dalam konteks bangunan bait. “Hal itu akan dituntut” mempertahankan elipsis sumber dan tetap dapat dipahami dalam register khidmat.
  terminology: “Mazbah,” “Bait Allah,” “angkatan ini,” Habel, dan Zakharia sesuai dengan penggunaan Alkitab Indonesia yang baku. Identitas Zakharia tetap tidak diputuskan. Catatan leksikal untuk “Bait Allah” memelihara fakta bahwa οἶκος secara harfiah berarti “rumah.”
