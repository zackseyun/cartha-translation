  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: id
  text: 'seperti yang tertulis dalam Hukum Tuhan: “Setiap anak laki-laki yang membuka rahim[a] akan disebut kudus bagi Tuhan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “membuka rahim” merujuk pada anak laki-laki yang lahir pertama dari rahim ibunya, yaitu anak laki-laki sulung; bandingkan Keluaran 13:2, 12.
    reason: lexical_alternative
  - marker: b
    text: Artinya, anak laki-laki sulung dipandang kudus atau dikhususkan bagi Tuhan.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: seperti yang tertulis
  rationale: Ungkapan ini secara alami memperkenalkan kutipan Kitab Suci sekaligus mempertahankan makna bahwa ketentuan itu tetap tertulis dan berlaku sebagai rujukan.
- source_word: ἐν νόμῳ κυρίου
  choice: dalam Hukum Tuhan
  rationale: νόμος menunjuk pada Taurat atau hukum yang diberikan Tuhan. “Hukum Tuhan” jelas dan dekat dengan bentuk Yunani tanpa memaksakan nama ilahi dari teks sumber Ibrani ke dalam teks Yunani.
- source_word: Πᾶν ἄρσεν
  choice: Setiap anak laki-laki
  rationale: ἄρσεν berarti yang berjenis kelamin laki-laki. Penambahan “anak” dibuat eksplisit karena konteks dan ungkapan tentang membuka rahim merujuk pada kelahiran; ini juga menghindari kesan bahwa yang dimaksud ialah laki-laki dewasa.
- source_word: διανοῖγον μήτραν
  choice: yang membuka rahim
  rationale: Terjemahan ini mempertahankan ungkapan konkret dalam kutipan hukum. Dalam konteksnya, ungkapan tersebut mengacu pada anak laki-laki sulung.
- source_word: ἅγιον τῷ κυρίῳ
  choice: kudus bagi Tuhan
  rationale: “Kudus” mempertahankan istilah kekudusan yang eksplisit, sedangkan “bagi Tuhan” menyatakan hubungan pengkhususan atau penyerahan kepada-Nya.
- source_word: κληθήσεται
  choice: akan disebut
  rationale: Bentuk pasif futur diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan dari hukum Israel
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος, sehingga “Tuhan” menerjemahkan sumber Yunani secara langsung. Bentuk “TUHAN” akan memasukkan bentuk konvensional bagi nama ilahi dari latar Ibrani, meskipun nama itu tidak muncul sebagai bentuk tersendiri dalam teks Yunani ayat ini.
- issue: Makna ἅγιον sebagai kekudusan atau pengkhususan
  choice: kudus bagi Tuhan
  alternative: dikhususkan bagi Tuhan
  rationale: Teks utama mempertahankan kata “kudus” karena itulah istilah eksplisit dalam bahasa Yunani. Makna pengkhususannya dijelaskan dalam catatan tanpa menggantikan bahasa kekudusan.
translation_notes:
  register: Bahasa yang dipakai modern dan bermartabat. Tanda titik dua memperkenalkan isi kutipan secara alami dalam bahasa Indonesia. Ungkapan hukum “membuka rahim” dipertahankan dalam teks utama agar citra sumber tidak hilang, lalu diterangkan dalam catatan kaki.
