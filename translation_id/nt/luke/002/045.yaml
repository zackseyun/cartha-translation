  register: Bahasa Indonesia baku modern dengan alur naratif yang ringkas. 'Mencari' dipilih daripada ungkapan yang lebih tinggi atau abstrak karena konteksnya adalah pencarian konkret. Penanda catatan kaki ditempatkan langsung sesudah unsur yang memiliki alternatif terjemahan.
