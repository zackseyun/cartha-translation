  text: καὶ μὴ ⸀εὑρόντες ὑπέστρεψαν εἰς Ἰερουσαλὴμ ⸀ἀναζητοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: id
  text: Dan ketika mereka tidak menemukan Dia[a], mereka kembali ke Yerusalem sambil mencari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak menemukan Dia, mereka kembali ke Yerusalem sambil mencari-Nya.”'
    reason: Alternatif ini mempertahankan kedua partisip Yunani sebagai bentuk partisipial/sirkumstansial tanpa menetapkan secara berlebihan hubungan temporalnya.
lexical_decisions:
- source_word: καὶ
  choice: Ketika
  rationale: Hubungan dengan konteks dan konstruksi partisipial negatif diungkapkan secara alami dalam bahasa Indonesia melalui anak kalimat waktu; hubungan naratif tetap terpelihara tanpa menambahkan urutan yang lebih tegas daripada teks sumber.
- source_word: μὴ εὑρόντες
  choice: tidak menemukan
  rationale: Partisip aoris negatif ini dipahami secara sirkumstansial dan, bersama 'Ketika', menghasilkan ungkapan Indonesia yang jelas serta alami.
- source_word: ὑπέστρεψαν
  choice: mereka kembali
  rationale: Menyampaikan arti kembali atau pergi kembali dalam ragam naratif yang wajar dan bermartabat.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Preposisi arah εἰς di depan nama kota secara idiomatis diterjemahkan 'ke'.
- source_word: ἀναζητοῦντες
  choice: sambil mencari
  rationale: Partisip ini menyatakan tindakan pencarian aktif yang menyertai kepulangan mereka; 'sambil mencari' mempertahankan hubungan partisipial tanpa membuatnya menjadi tindakan berurutan yang terpisah.
- source_word: αὐτόν
  choice: Dia / -Nya
  rationale: Pronomina maskulin tunggal merujuk kepada Yesus; bentuk ini alami dalam bahasa Indonesia dan kapitalisasi mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus.
theological_decisions: []
