revisions:
- from: Lalu malaikat itu berkata kepada mereka, “Jangan takut! Sebab, ketahuilah, aku memberitakan kepada kalian kabar baik tentang sukacita besar yang akan menjadi milik seluruh umat itu.[a]”
  to: Lalu malaikat itu berkata kepada mereka, “Jangan takut, sebab sesungguhnya aku memberitakan kepada kalian kabar baik tentang sukacita besar yang akan dialami oleh seluruh umat itu.[a]”
  rationale: Revisi mengganti ungkapan kepemilikan yang tidak tersurat dalam teks Yunani dengan ungkapan penerimaan/pengalaman sukacita yang alami dalam bahasa Indonesia. Penanda perhatian juga diperhalus, sementara ketentuan referen λαός dan ambiguitas cakupannya tetap dipertahankan melalui teks utama serta catatan kaki.
