  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: id
  text: Lalu malaikat itu berkata kepada mereka, “Jangan takut, sebab sesungguhnya aku memberitakan kepada kalian kabar baik tentang sukacita besar yang akan dialami oleh seluruh umat itu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang.” Secara lebih harfiah, frasa Yunani ini berbunyi “bagi seluruh umat itu”; dalam tulisan Lukas, kata “umat” sering menunjuk kepada suatu umat tertentu sesuai konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: malaikat itu
  rationale: Artikel Yunani menunjuk kembali kepada malaikat yang sudah diperkenalkan dalam konteks sebelumnya.
- source_word: Μὴ φοβεῖσθε
  choice: Jangan takut!
  rationale: Larangan ini diterjemahkan secara alami dan langsung dalam bahasa Indonesia modern.
- source_word: ἰδοὺ
  choice: ketahuilah
  rationale: Dalam konteks ini, ἰδού berfungsi sebagai penanda wacana yang menarik perhatian; 'ketahuilah' mempertahankan tekanannya dengan ragam yang wajar dan bermartabat.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan mengapa para gembala tidak perlu takut.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: aku memberitakan kepada kalian kabar baik
  rationale: Pilihan ini mempertahankan arti tindakan mengumumkan kabar baik serta datif jamak ὑμῖν, tanpa menjadikannya istilah teknis yang berlebihan.
- source_word: χαρὰν μεγάλην
  choice: sukacita besar
  rationale: Padanan ini alami dan mempertahankan kekuatan ungkapan Yunani.
- source_word: ἥτις ἔσται
  choice: yang akan menjadi milik
  rationale: Ungkapan ini membuat hubungan sukacita dengan penerimanya jelas dan alami dalam bahasa Indonesia, sambil mempertahankan bentuk mendatang.
- source_word: παντὶ τῷ λαῷ
  choice: seluruh umat itu
  rationale: λαός berartikel menunjuk kepada suatu umat yang tertentu dalam konteks narasi, kemungkinan besar Israel; 'seluruh umat itu' mempertahankan ketentuan tersebut dan menghindari universalisasi prematur.
theological_decisions:
- issue: Cakupan παντὶ τῷ λαῷ
  choice: seluruh umat itu
  alternative: semua orang
  rationale: Artikel pada λαός paling wajar menunjuk kepada umat tertentu dalam latar narasi, kemungkinan besar Israel. Terjemahan utama mempertahankan ketegangan teologis ayat ini tanpa menyangkal perluasan keselamatan kepada bangsa-bangsa dalam bagian lain karya Lukas.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'kalian' dipakai untuk menunjukkan bahwa ὑμῖν berbentuk jamak. 'Umat itu' dipilih alih-alih 'bangsa itu' karena λαός menekankan komunitas umat, bukan terutama kategori etnis atau politis.
