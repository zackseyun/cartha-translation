id: LUK.2.39
reference: Luke 2:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: id
  text: Setelah mereka menyelesaikan segala sesuatu sesuai dengan hukum Tuhan[a], mereka kembali ke Galilea, ke kota mereka sendiri[b], yaitu Nazaret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala sesuatu yang diwajibkan oleh hukum Tuhan.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunaninya berarti “kota”; Nazaret sendiri merupakan permukiman kecil.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: setelah
  rationale: Dalam konstruksi temporal dengan verba aoristus, ὡς menandai bahwa tindakan kembali terjadi sesudah semua kewajiban itu selesai. Dalam bahasa Indonesia, “setelah” menyatakan urutan ini secara alami tanpa mengisyaratkan bahwa kepulangan berlangsung seketika.
- source_word: ἐτέλεσαν
  choice: menyelesaikan
  rationale: τελέω di sini berarti menuntaskan tindakan-tindakan yang ditetapkan. “Menyelesaikan” alami dan tidak menimbulkan kesan khusus tentang penggenapan nubuat.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: segala sesuatu sesuai dengan hukum Tuhan
  rationale: Ungkapan ini mencakup seluruh hal yang berkaitan dengan atau ditetapkan oleh hukum Tuhan. Terjemahan ini dekat dengan susunan Yunani dan mempertahankan sedikit keluwesan maknanya; penjelasan “yang diwajibkan” dicantumkan sebagai alternatif dalam catatan kaki.
- source_word: νόμον κυρίου
  choice: hukum Tuhan
  rationale: Bentuk ini merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gaya alkitabiah bagi hukum yang berasal dari Tuhan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Dalam konteks hukum ilahi, κύριος merujuk kepada Allah. “Tuhan” adalah padanan baku dan tidak mengganti bentuk Yunani dengan representasi khusus Tetragramaton.
- source_word: ἐπέστρεψαν
  choice: kembali
  rationale: Dalam konteks perjalanan, ἐπιστρέφω berarti kembali ke tempat asal atau sebelumnya; “kembali” merupakan padanan Indonesia yang langsung dan alami.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: εἰς menyatakan tujuan, yang secara idiomatis diterjemahkan “ke” dalam bahasa Indonesia.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: ke kota mereka sendiri
  rationale: πόλις secara leksikal berarti kota atau permukiman; “kota” mempertahankan padanan formal yang lazim, sedangkan catatan kaki menjelaskan bahwa Nazaret merupakan permukiman kecil. ἑαυτῶν ditegaskan dengan “mereka sendiri”.
- source_word: Ναζαρέθ
  choice: Nazaret
  rationale: “Nazaret” adalah bentuk nama tempat yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan “Tuhan” dalam “hukum Tuhan”
  choice: “Tuhan” merujuk kepada Allah sebagai sumber hukum ilahi dalam Kitab Suci.
  alternative: Tidak ada alternatif utama yang menimbulkan konsekuensi teologis dalam konteks ini.
  rationale: Ungkapan tersebut merupakan gaya Yahudi-Kitab Suci yang lazim. Terjemahan langsung menonjolkan ketaatan keluarga itu tanpa menambahkan klaim doktrinal lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Setelah” dipilih demi urutan naratif yang alami. “Kota” dipertahankan dalam teks utama agar dekat dengan πόλις, dengan skala historis Nazaret dijelaskan dalam catatan kaki.
