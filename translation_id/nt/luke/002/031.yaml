id: LUK.2.31
reference: Luke 2:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃ ἡτοίμασας κατὰ πρόσωπον πάντων τῶν λαῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: id
  text: yang telah Engkau siapkan di hadapan semua bangsa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "di depan mata semua bangsa"; ungkapan Yunani menunjukkan sesuatu yang ditempatkan secara terbuka agar terlihat oleh semua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: yang
  rationale: Pronomina relatif netral tunggal ini merujuk pada 'keselamatan' dalam ayat sebelumnya; dalam bahasa Indonesia, 'yang' menghubungkan klausa secara alami tanpa menambahkan unsur yang tidak ada.
- source_word: ἡτοίμασας
  choice: telah Engkau siapkan
  rationale: Aoristus aktif indikatif orang kedua tunggal, ditujukan kepada Allah. 'Telah ... siapkan' menyatakan tindakan yang sudah terlaksana dan tetap alami dalam konteks pujian ini.
- source_word: κατὰ πρόσωπον
  choice: di hadapan
  rationale: Ungkapan ini secara idiomatis berarti berada di depan, dalam kehadiran, atau dalam pandangan pihak lain. 'Di hadapan' mempertahankan nuansa terbuka dan terlihat tanpa terjemahan harfiah yang kaku seperti 'di depan wajah'.
- source_word: πάντων
  choice: semua
  rationale: Menerjemahkan bentuk genitif jamak yang menerangkan λαῶν dan mempertahankan cakupan menyeluruh frasa tersebut.
- source_word: τῶν λαῶν
  choice: bangsa
  rationale: λαός dalam bentuk jamak menunjuk pada berbagai kelompok masyarakat atau bangsa. Setelah 'semua', bahasa Indonesia lazim memakai nomina tanpa pengulangan; 'semua bangsa' tetap menyampaikan kemajemukan itu dan menjaga keterkaitannya dengan ayat berikutnya.
theological_decisions:
- issue: Cakupan dan nuansa λαῶν dalam hubungannya dengan ayat berikutnya
  choice: semua bangsa
  alternative: semua suku bangsa; semua umat
  rationale: Bentuk jamak Yunani menunjukkan berbagai kelompok manusia yang di hadapan mereka keselamatan Allah disediakan. 'Semua bangsa' mempertahankan keluasan cakupan tanpa terlebih dahulu menyamakan frasa ini hanya dengan bangsa-bangsa bukan Yahudi, sebab ayat 32 kemudian menyebut bangsa-bangsa lain dan Israel secara khusus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapitalisasi 'Engkau' menandai sapaan langsung kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia, tanpa mengubah makna sumber. Tanda koma dipertahankan karena ayat ini melanjutkan kalimat dari ayat sebelumnya.
