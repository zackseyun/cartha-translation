  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: id
  text: Lalu Dia turun bersama mereka dan tiba di Nazaret. Dia tunduk kepada mereka.[a] Ibu-Nya menyimpan semua hal itu di dalam hatinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terus menaati mereka.” Bentuk Yunani menunjukkan ketundukan atau ketaatan yang berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Atau, “semua perkataan itu” atau “semua perkara itu.” Kata Yunani ῥήματα dapat merujuk pada perkataan, ucapan, atau hal-hal yang diberitakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: turun
  rationale: Mempertahankan arah perjalanan secara geografis dari Yerusalem tanpa memakai kata yang terlalu formal.
- source_word: μετ’ αὐτῶν
  choice: bersama mereka
  rationale: Menyampaikan makna penyertaan secara langsung dan alami.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: tiba di Nazaret
  rationale: Dalam konteks gerak perjalanan, ungkapan ini secara alami menyatakan bahwa mereka sampai di Nazaret.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: tetap tunduk kepada mereka
  rationale: Konstruksi imperfek perifrastis menunjukkan keadaan atau tindakan yang berlangsung terus. 'Tetap tunduk' alami dalam bahasa Indonesia dan mempertahankan makna kepatuhan Yesus kepada orang tua-Nya.
- source_word: διετήρει
  choice: menyimpan
  rationale: Menyampaikan tindakan menjaga atau mempertahankan dalam ingatan tanpa mempersempitnya menjadi penafsiran emosional tertentu.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: semua hal itu
  rationale: Dalam konteks ini ῥήματα dapat merujuk bukan hanya pada ucapan, tetapi juga pada perkara atau kejadian yang baru diceritakan. Ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: di dalam hatinya
  rationale: Mempertahankan idiom sumber tentang ingatan dan perenungan batin dalam bentuk yang lazim dipahami pembaca Indonesia.
theological_decisions:
- issue: Hubungan Yesus dengan orang tua-Nya di dunia
  choice: Dia tetap tunduk kepada mereka
  alternative: Dia terus menaati mereka
  rationale: Terjemahan mempertahankan pernyataan teks tentang ketundukan Yesus yang berlangsung kepada Maria dan Yusuf tanpa menambahkan penjelasan doktrinal atau mengurangi ketegangan kristologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Kapitalisasi pronomina untuk Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
