  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: id
  text: Ketika mereka melihat dia, mereka sangat heran. Ibunya berkata kepadanya, “Nak, mengapa kamu berbuat begini kepada kami? Lihatlah, ayahmu dan aku terus mencari kamu dengan susah hati[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hati pedih” atau “dalam kesusahan”; kata Yunani ini menggambarkan rasa sakit batin selama mereka mencari dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ketika melihat dia
  rationale: Partisip aoris dipahami secara temporal dan diterjemahkan secara alami untuk menunjukkan urutan peristiwa.
- source_word: ἐξεπλάγησαν
  choice: mereka sangat heran
  rationale: Kata kerja ini menyatakan rasa heran atau keterkejutan yang kuat; “sangat heran” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: Τέκνον
  choice: Nak
  rationale: Sapaan ini penuh kasih dari orang tua kepada anak. “Nak” alami dalam tuturan seorang ibu tanpa menambahkan kata milik yang tidak ada dalam teks Yunani.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: mengapa kamu berbuat begini kepada kami?
  rationale: Bentuk “mengapa” menyampaikan fungsi idiomatis pertanyaan tersebut, sedangkan “kepada kami” mempertahankan daya relasional ἡμῖν.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Penanda ini menarik perhatian secara tegas dan tetap alami serta bermartabat dalam bahasa Indonesia.
- source_word: ὁ πατήρ σου
  choice: ayahmu
  rationale: Teks Yunani hanya mengatakan “ayahmu”; tidak ditambahkan penjelasan seperti “ayahmu di dunia” yang akan menafsirkan alih-alih menerjemahkan.
- source_word: ὀδυνώμενοι
  choice: dengan cemas
  rationale: Partisip ini menggambarkan penderitaan batin atau kepedihan emosional selama pencarian. “Dengan cemas” alami dalam konteks mencari anak yang hilang, sementara catatan kaki mempertahankan nuansa yang lebih kuat.
- source_word: ἐζητοῦμέν σε
  choice: terus mencari kamu
  rationale: Imperfek menunjukkan pencarian yang berlangsung dalam waktu lampau. “Terus mencari” menyatakan keberlangsungan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan Yusuf sebagai “ayahmu” dalam kaitannya dengan keanakan ilahi Yesus
  choice: Mempertahankan ungkapan langsung “ayahmu” tanpa penjelasan tambahan.
  alternative: ayahmu di dunia
  rationale: Ucapan Maria dalam bahasa Yunani menyebut Yusuf “ayahmu.” Menambahkan “di dunia” akan menyelesaikan ketegangan teologis melalui tafsiran yang tidak dinyatakan dalam ayat ini; narasi ayat berikutnya sendiri meneruskan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “Nak” mencerminkan tuturan keluarga yang hangat. “Ibu” dipakai sebagai penyebutan diri seorang ibu kepada anaknya, yang lebih alami daripada “aku” dalam konteks ini; huruf kapital menandai sapaan kekerabatan sebagai pengganti nama diri.
