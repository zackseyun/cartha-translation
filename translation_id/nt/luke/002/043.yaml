source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: id
  text: Setelah hari-hari itu selesai, ketika mereka sedang kembali, Yesus, anak itu, tetap tinggal[a] di Yerusalem, tetapi orang tua-Nya[b] tidak mengetahuinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tinggal di belakang".
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: "orang tua-Nya". Bahasa kekeluargaan yang lazim dipakai Lukas di sini tidak meniadakan pengandungan oleh seorang perawan yang dinyatakan sebelumnya dalam Injil ini.'
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: Setelah hari-hari itu selesai
  rationale: Konstruksi genitif absolut menyatakan keadaan yang telah selesai sebelum tindakan utama. Ungkapan ini mempertahankan sebutan umum 'hari-hari itu' tanpa menambahkan rincian yang tidak dinyatakan langsung dalam ayat.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: ketika mereka dalam perjalanan pulang
  rationale: Infinitif artikular dengan ἐν menyatakan waktu yang bersamaan dan tindakan yang sedang berlangsung; ungkapan Indonesia ini lebih alami daripada terjemahan harfiah 'ketika mereka sedang kembali'.
- source_word: ὑπέμεινεν
  choice: tetap tinggal
  rationale: Dalam konteks ini ὑπομένω berarti tetap berada di suatu tempat ketika rombongan lain pergi; 'tetap tinggal' mempertahankan makna dasar, sedangkan 'tertinggal' dapat memberi kesan tidak disengaja.
- source_word: ὁ παῖς
  choice: yang masih anak-anak
  rationale: παῖς di sini menunjuk kepada Yesus pada usia dua belas tahun. Ungkapan ini menyampaikan bahwa Ia seorang anak dan menyatu secara alami dengan susunan kalimat Indonesia.
- source_word: ἐν Ἰερουσαλήμ
  choice: di Yerusalem
  rationale: Ini adalah pemakaian lokatif biasa dari ἐν dengan nama tempat.
- source_word: οὐκ ἔγνωσαν
  choice: tidak mengetahuinya
  rationale: Dalam konteks ini γινώσκω berarti mengetahui atau menyadari suatu fakta. Akhiran '-nya' memasok objek yang dipahami, yaitu bahwa Yesus tetap tinggal di Yerusalem.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: orang tua-Nya
  rationale: γονεῖς secara langsung berarti 'orang tua'. Pilihan ini mempertahankan bahasa kekeluargaan biasa yang dipakai Lukas tanpa menguraikannya menjadi 'ayah dan ibu'.
theological_decisions:
- issue: Sebutan γονεῖς bagi Maria dan Yusuf
  choice: orang tua-Nya
  alternative: ayah dan ibu-Nya
  rationale: Teks Yunani secara eksplisit memakai kata 'orang tua'. Terjemahan mempertahankan bahasa kekeluargaan Lukas dan tidak menyelaraskannya sedemikian rupa sehingga ketegangan dengan berita tentang pengandungan dari seorang perawan yang dinyatakan sebelumnya dalam Injil ini menjadi hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Susunan kalimat mempertahankan urutan peristiwa Yunani, sedangkan 'dalam perjalanan pulang' dan 'yang masih anak-anak' dipilih agar wajar bagi pembaca masa kini. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
