  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: id
  text: Semua orang yang mendengar Dia takjub akan pengertian-Nya dan jawaban-jawaban-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sangat heran.” Kata kerja Yunani yang dipakai dapat mengungkapkan ketakjuban yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: takjub
  rationale: Bentuk imperfek ini menggambarkan reaksi ketakjuban yang sedang berlangsung. 'Takjub' alami dalam bahasa Indonesia dan mempertahankan kekuatan maknanya tanpa memakai ungkapan harfiah yang dapat disalahpahami.
- source_word: δὲ
  choice: tidak diterjemahkan secara eksplisit
  rationale: δέ merupakan penghubung ringan. Dalam ayat ini, alur narasi bahasa Indonesia lebih alami tanpa kata penghubung tersendiri; hubungan dengan konteks tetap jelas.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: Semua orang yang mendengar Dia
  rationale: Ungkapan ini mempertahankan cakupan universal πάντες serta menyampaikan partisipel present secara ringkas dan wajar.
- source_word: ἐπὶ τῇ συνέσει
  choice: atas pengertian
  rationale: ἐπί dengan datif menunjukkan dasar atau hal yang menimbulkan ketakjuban. 'Atas' sesuai setelah 'takjub', sedangkan 'pengertian' jelas dan mudah dipahami.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: jawaban-jawaban-Nya
  rationale: ἀπόκρισις menunjuk pada jawaban atau tanggapan dalam percakapan. Bentuk ulang mempertahankan bentuk jamak Yunani, dan sufiks '-Nya' merujuk kepada Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kapitalisasi 'Dia' dan '-Nya' dipakai sebagai konvensi penghormatan bagi Yesus, tanpa menambahkan penafsiran pada isi ayat.
