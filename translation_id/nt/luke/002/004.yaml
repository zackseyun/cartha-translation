  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: id
  text: Yusuf juga naik dari Galilea, dari kota Nazaret, ke Yudea, ke kota Daud yang bernama Betlehem, karena ia berasal dari wangsa dan garis keturunan Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari rumah dan keluarga Daud.” Bahasa Yunani memakai dua istilah kekerabatan yang berkaitan; ‘wangsa’ menyatakan nuansa rumah atau dinasti Daud, sedangkan ‘garis keturunan’ menyatakan asal-usul keluarganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: berangkat ... naik
  rationale: Mengungkapkan perjalanan Yusuf sekaligus mempertahankan nuansa gerak naik menuju Yudea; susunan diperlancar agar wajar dalam bahasa Indonesia.
- source_word: δὲ καὶ
  choice: juga
  rationale: Menandai kesinambungan narasi dan keikutsertaan Yusuf dalam pergerakan yang disebutkan sebelumnya tanpa memberi tekanan berlebihan.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: dari Galilea, dari kota Nazaret
  rationale: Mempertahankan dua keterangan tempat asal yang berurutan dalam teks Yunani.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ke Yudea
  rationale: Yudea adalah nama baku untuk wilayah pada masa Romawi dan tidak mengaburkannya dengan wilayah suku Yehuda.
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: kota Daud yang bernama Betlehem
  rationale: Mempertahankan sebutan kota Daud dan klausa penjelas yang mengidentifikasinya sebagai Betlehem.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: karena ia berasal
  rationale: Infinitif berartikel dengan διά menyatakan alasan; bentuk klausa ini alami dalam bahasa Indonesia.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: dari keluarga dan garis keturunan Daud
  rationale: Mempertahankan kedua istilah kekerabatan dan menegaskan asal-usul Daud tanpa menyamakan keduanya sepenuhnya.
theological_decisions:
- issue: Istilah keturunan Daud
  choice: berasal dari keluarga dan garis keturunan Daud
  alternative: berasal dari kaum dan marga Daud
  rationale: Pilihan ini mempertahankan dua istilah Yunani, οἶκος dan πατριά, sekaligus menyampaikan hubungan leluhur Yusuf dengan Daud dalam bahasa Indonesia yang mudah dipahami. Rumusan ini tidak menarik kesimpulan teologis melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “berangkat ... naik” menjaga nuansa geografis Ἀνέβη tanpa menghasilkan susunan yang kaku; “garis keturunan” dipilih karena lebih luas dipahami daripada “marga” dalam konteks ini.
