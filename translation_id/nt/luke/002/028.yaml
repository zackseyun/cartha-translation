base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: id
  text: 'Lalu Simeon mengambil Anak itu ke dalam pelukannya, memuji Allah, dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: menyambut
  rationale: Kata ini berarti menerima atau menyambut. Bersama frasa 'ke dalam pelukannya', 'menyambut' secara alami menyatakan tindakan menerima Anak itu dengan kedua lengan tanpa menghilangkan nuansa penerimaan.
- source_word: αὐτό
  choice: Anak itu
  rationale: Pronomina netral ini merujuk kepada anak Yesus. Penyebutan ulang 'Anak itu' alami dalam bahasa Indonesia dan menghindari rujukan yang kabur.
- source_word: εἰς τὰς ἀγκάλας
  choice: ke dalam pelukannya
  rationale: Bentuk jamak ἀγκάλας menunjuk pada kedua lengan sebagai tempat memeluk atau menggendong. 'Ke dalam pelukannya' menyampaikan arah gerak dan kepemilikan yang tersirat oleh konteks.
- source_word: εὐλόγησεν τὸν θεόν
  choice: memuji Allah
  rationale: Ketika Allah menjadi objek, εὐλογέω menyatakan ucapan pujian atau berkat kepada-Nya. Dalam bahasa Indonesia modern, 'memuji Allah' lebih wajar dan tidak menimbulkan kesan bahwa manusia memberikan berkat kepada Allah.
- source_word: καὶ εἶπεν
  choice: katanya,
  rationale: Ungkapan ini mengantar kutipan langsung. 'Katanya' merupakan bentuk naratif Indonesia yang ringkas dan alami.
- source_word: αὐτός
  choice: Simeon
  rationale: Pronomina ini merujuk kepada Simeon dari konteks sebelumnya. Menyebut namanya membuat subjek jelas dalam ayat mandiri tanpa memberi penekanan berlebih.
theological_decisions:
- issue: Rujukan pronomina netral αὐτό
  choice: Merujuk secara personal kepada anak Yesus dan diterjemahkan 'Anak itu'.
  alternative: Menerjemahkannya secara harfiah menurut gender gramatikal dengan 'itu'.
  rationale: Gender gramatikal mengikuti kata Yunani bagi anak, sedangkan yang dirujuk adalah pribadi Yesus. 'Anak itu' menjaga kejelasan naratif tanpa menambahkan klaim teologis.
- issue: Makna εὐλόγησεν ketika Allah menjadi objek
  choice: memuji Allah
  alternative: memberkati Allah
  rationale: '''Memuji Allah'' menyampaikan fungsi ungkapan Yunani secara alami dalam bahasa Indonesia modern. Alternatif formal ''memberkati Allah'' dapat disalahpahami seolah-olah Simeon menganugerahkan berkat kepada Allah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami untuk pembacaan umum; nama Simeon dijelaskan dari konteks agar ayat tetap jelas ketika dibaca tersendiri.
