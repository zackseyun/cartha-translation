  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: id
  text: Ada pula seorang nabi perempuan, Hana, anak perempuan Fanuel, dari suku Asyer. Ia sudah sangat lanjut usia. Sejak masa keperawanannya berakhir[a], ia hidup bersama suaminya selama tujuh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “sejak keperawanannya.” Ungkapan ini menunjuk pada masa ketika ia tidak lagi hidup sebagai seorang gadis, yakni ketika ia menikah.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: nabi perempuan
  rationale: Nomina Yunani ini berbentuk feminin dan secara tegas menyebut Hana sebagai seorang perempuan yang berperan sebagai nabi. Ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: θυγάτηρ Φανουήλ
  choice: anak Fanuel
  rationale: Dalam konteks silsilah, 'anak Fanuel' menyampaikan hubungan ayah-anak secara alami; identitas Hana sebagai perempuan sudah jelas.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: dari suku Asyer
  rationale: ἐκ menyatakan asal atau keanggotaan; 'dari suku Asyer' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: sudah sangat lanjut usia
  rationale: Ungkapan harfiahnya, 'telah maju dalam banyak hari,' merupakan idiom tentang usia tua. Padanan ini menyampaikan maksud idiom secara jelas tanpa memasukkan angka usia yang tidak terdapat dalam ayat ini.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: ia hidup bersama suaminya
  rationale: Dalam konteks ini ἀνήρ merujuk pada suami dan frasa tersebut menggambarkan kehidupan pernikahan, bukan sekadar tinggal bersama seorang laki-laki.
- source_word: ἔτη ἑπτὰ
  choice: selama tujuh tahun
  rationale: Padanan langsung untuk keterangan lamanya waktu.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: setelah masa keperawanannya
  rationale: παρθενία berarti keperawanan atau masa sebagai gadis. 'Setelah' menyampaikan bahwa tujuh tahun itu dihitung sejak berakhirnya masa tersebut, sambil mempertahankan cara pengungkapan sumber.
theological_decisions:
- issue: Peran Hana sebagai προφῆτις
  choice: Hana disebut 'nabi perempuan'.
  alternative: Melemahkan istilah itu menjadi tokoh agama atau perempuan saleh.
  rationale: Teks memakai istilah baku untuk nabi dalam bentuk feminin; terjemahan tidak boleh mengurangi peran yang secara eksplisit diberikan Lukas kepadanya.
- issue: Gambaran usia Hana
  choice: Ungkapan idiomatis diterjemahkan 'sudah sangat lanjut usia'.
  alternative: Mempertahankan bentuk harfiah 'telah lanjut dalam banyak hari' atau memasukkan perhitungan usia dari ayat berikutnya.
  rationale: Padanan idiomatis lebih mudah dipahami dalam bahasa Indonesia, sedangkan angka usia tidak boleh diimpor dari ayat berikutnya.
- issue: Titik awal tujuh tahun kehidupan pernikahan
  choice: Teks utama memakai 'setelah masa keperawanannya' dan memberi catatan penjelas.
  alternative: Menyatakan langsung 'sejak ia menikah'.
  rationale: Pilihan ini menjaga bentuk dan sedikit ketidaklangsungan ungkapan Yunani, tanpa menutupi pengertian kontekstual bahwa masa keperawanan berakhir ketika ia menikah.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Hana, Fanuel, dan Asyer. Kalimat panjang Yunani dibagi agar mudah dibaca; hubungan dengan ayat berikutnya tetap dapat dilanjutkan.'
