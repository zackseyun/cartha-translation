  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: id
  text: Ia berkata kepada mereka, “Mengapa kalian mencari Aku? Tidakkah kalian tahu bahwa Aku harus berada di rumah Bapa-Ku?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku harus berada dalam urusan Bapa-Ku,” atau secara lebih harfiah, “Aku harus berada dalam hal-hal milik Bapa-Ku.” Ungkapan Yunani ini eliptis dan dapat menunjuk kepada rumah Bapa maupun urusan atau kepentingan Bapa.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Mengapa
  rationale: Ungkapan ini menanyakan alasan atau sebab. “Mengapa” alami dalam bahasa Indonesia dan mempertahankan daya pertanyaannya.
- source_word: ἐζητεῖτέ
  choice: kalian mencari
  rationale: ζητέω dalam konteks pencarian oleh orang tua Yesus paling alami diterjemahkan “mencari”; bentuk lampau Yunani sudah jelas dari alur narasi dan tidak perlu ditandai secara khusus dalam bahasa Indonesia.
- source_word: οὐκ ᾔδειτε
  choice: Tidakkah kalian tahu
  rationale: οἶδα menyatakan pengetahuan atau kesadaran. Bentuk ini mempertahankan pertanyaan retoris teks sumber.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: di rumah Bapa-Ku
  rationale: Secara harfiah ungkapan eliptis ini berarti “di dalam hal-hal milik Bapa-Ku.” Karena Yesus ditemukan di Bait Allah, “di rumah Bapa-Ku” merupakan pembacaan kontekstual yang kuat dan alami; kemungkinan makna lain dipertahankan dalam catatan kaki.
- source_word: δεῖ
  choice: Aku harus
  rationale: δεῖ menyatakan keharusan yang kuat, termasuk nuansa keharusan ilahi dalam Injil Lukas. “Harus” ringkas dan berbobot.
- source_word: εἶναί με
  choice: Aku ... berada
  rationale: Infinitif εἶναι dengan subjek akusatif με secara alami menjadi “Aku harus berada” dalam bahasa Indonesia.
- source_word: πατρός μου
  choice: Bapa-Ku
  rationale: Dalam latar Bait Allah, sebutan ini merujuk kepada Allah sebagai Bapa Yesus. “Bapa” mempertahankan klaim hubungan tersebut tanpa menambahkan penjelasan doktrinal.
theological_decisions:
- issue: Ungkapan eliptis ἐν τοῖς τοῦ πατρός μου
  choice: “di rumah Bapa-Ku” dalam teks utama
  alternative: “mengurus perkara-perkara Bapa-Ku” atau, secara lebih harfiah, “berada dalam hal-hal milik Bapa-Ku”
  rationale: Konteks langsung Bait Allah mendukung pengertian tempat, tetapi bahasa Yunani juga dapat menunjuk kepada urusan atau kepentingan Bapa. Catatan kaki mempertahankan ambiguitas yang sungguh ada.
- issue: Rujukan “Bapa-Ku”
  choice: Dipahami sebagai Allah, Bapa Yesus
  alternative: Tidak dipahami sebagai Yusuf
  rationale: Latar Bait Allah dan kontras tersirat dengan orang tua yang mencari-Nya menunjukkan bahwa Yesus sedang berbicara tentang Allah. Terjemahan mempertahankan pernyataan hubungan ini tanpa memperluasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk mempertahankan bentuk orang kedua jamak yang ditujukan kepada Maria dan Yusuf. Huruf kapital pada “Aku” dan “Bapa-Ku” mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk rujukan ilahi dan sekaligus membantu memperjelas para rujukannya.
