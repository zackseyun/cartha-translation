id: LUK.2.21
reference: Luke 2:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: id
  text: Ketika genap delapan hari untuk menyunat Dia[a], Dia diberi nama Yesus[b], yaitu nama yang telah disebutkan oleh malaikat sebelum Dia dikandung dalam rahim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah delapan hari itu genap, tibalah waktunya untuk menyunat Dia.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “nama-Nya disebut Yesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: ketika genap delapan hari
  rationale: Ungkapan ini mempertahankan nuansa selesainya jangka waktu dalam bahasa Yunani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: untuk menyunat Dia
  rationale: Infinitif berartikel dengan τοῦ menyatakan tujuan atau hal yang menjadi maksud waktu delapan hari itu; bentuk verbal dipertahankan secara jelas.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: Dia diberi nama Yesus
  rationale: Ini merupakan padanan Indonesia yang alami bagi ungkapan pasif Yunani tentang penamaan, tanpa menghasilkan susunan harfiah yang kaku.
- source_word: Ἰησοῦς
  choice: Yesus
  rationale: Menggunakan bentuk baku nama tersebut dalam tradisi dan bahasa Indonesia modern.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: nama yang telah disebutkan oleh malaikat
  rationale: Partisip pasif mengacu kembali kepada 'nama'; 'telah disebutkan' mempertahankan pengulangan akar καλέω dan menunjukkan bahwa penyebutan itu mendahului pemberian nama.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: sebelum Dia dikandung dalam rahim
  rationale: Dalam konteks ini συλλαμβάνω dan κοιλία merujuk secara wajar kepada pembuahan atau pengandungan dalam rahim, tanpa tambahan istilah teologis yang tidak dinyatakan teks.
theological_decisions:
- issue: Klausa tentang dikandungnya Yesus
  choice: sebelum Dia dikandung dalam rahim
  alternative: sebelum Ia mulai berada dalam kandungan
  rationale: Terjemahan menyatakan konsepsi manusiawi Yesus sebagaimana dikatakan teks, tanpa memperluasnya menjadi pernyataan tentang asal-usul ilahi atau memasukkan terminologi dogmatis yang tidak terdapat dalam ayat.
- issue: Hubungan antara penyebutan nama oleh malaikat dan pemberian nama pada hari kedelapan
  choice: nama yang telah disebutkan oleh malaikat
  alternative: nama yang telah diberikan oleh malaikat
  rationale: '''Disebutkan'' lebih dekat dengan pengulangan verba καλέω dan tidak menyiratkan bahwa malaikat sendiri melakukan upacara pemberian nama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami, sementara urutan peristiwa dan bentuk pasif sumber tetap dipertahankan.
