  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: id
  text: Ayah dan ibu-Nya takjub akan hal-hal yang dikatakan tentang Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “ayah-Nya.” Dalam narasi ini, sebutan tersebut mengacu kepada Yusuf dalam pengertian keluarga dan hukum yang biasa. Sebagian naskah berbunyi “Yusuf dan ibu-Nya”; bacaan ini mungkin dimaksudkan untuk menghindari kesalahpahaman mengingat kisah Lukas sebelumnya tentang Yesus yang dikandung oleh seorang perawan.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ayah-Nya
  rationale: Menerjemahkan teks Yunani secara langsung sebagai “ayah-Nya,” tanpa menggantinya dengan “Yusuf.” Dalam konteks narasi, sebutan ini berlaku dalam pengertian keluarga dan hukum yang biasa.
- source_word: μήτηρ
  choice: ibu-Nya
  rationale: Padanan baku dan alami untuk μήτηρ; bersama unsur sebelumnya membentuk pasangan “ayah dan ibu-Nya.”
- source_word: θαυμάζοντες
  choice: takjub
  rationale: Menyampaikan rasa heran dan kagum. Dengan ἦν, bentuk ini menunjukkan keadaan atau tindakan yang berlangsung pada waktu lampau; bahasa Indonesia tidak perlu menandai aspek tersebut secara kaku.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: mendengar hal-hal yang dikatakan
  rationale: “Hal-hal yang dikatakan” mempertahankan bentuk jamak dan makna pasif partisipel Yunani. “Mendengar” secara alami menyatakan bahwa ketakjuban mereka timbul atas perkataan tersebut.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: Padanan alami bagi περί dengan genitif. Huruf kapital pada pronomina mengikuti kelaziman gaya Alkitab bahasa Indonesia untuk merujuk kepada Yesus.
theological_decisions:
- issue: Sebutan “ayah-Nya” bagi Yusuf dalam konteks kelahiran Yesus dari seorang perawan
  choice: Mempertahankan kata-kata teks sebagai “ayah-Nya” dan menjelaskan nuansanya dalam catatan kaki.
  alternative: “Yusuf dan ibu-Nya” atau “ayah-Nya, yaitu Yusuf, dalam pengertian hukum/sosial”
  rationale: Teks Yunani yang dipakai berbunyi “ayah-Nya.” Dalam narasi Lukas, Yusuf dapat disebut ayah Yesus dalam pengertian keluarga atau hukum yang biasa tanpa meniadakan kisah sebelumnya tentang Yesus yang dikandung oleh seorang perawan. Terjemahan utama tidak sepatutnya menghapus ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk jamak “hal-hal” atau mengganti “ayah-Nya” dengan penafsiran yang lebih eksplisit.
