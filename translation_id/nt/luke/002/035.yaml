  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: id
  text: dan pedang[b] akan menembus[a] jiwamu sendiri juga—supaya pikiran dalam hati banyak orang tersingkap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan melewati.” Kata kerja Yunaninya secara lebih harfiah berarti “akan melewati,” sedangkan gambaran pedang secara alami menyiratkan tindakan menembus.
    reason: lexical_alternative
  - marker: b
    text: “Pedang” biasanya dipahami sebagai kiasan untuk penderitaan batin mendalam yang akan dialami Maria.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: jiwamu sendiri
  rationale: Kata ganti genetif yang diperkuat oleh αὐτῆς menegaskan bahwa perkataan ini ditujukan secara pribadi kepada Maria; 'jiwamu sendiri' mempertahankan penekanan itu secara wajar.
- source_word: ψυχή
  choice: jiwa
  rationale: Dalam nubuat ini, ψυχή menunjuk pada batin atau diri terdalam yang mengalami penderitaan hebat, bukan hanya kehidupan jasmani. 'Jiwa' mempertahankan bobot emosional dan rohaninya.
- source_word: διελεύσεται
  choice: akan menembus
  rationale: Secara harfiah verba ini berarti 'akan melewati', tetapi dengan pedang sebagai subjek, bahasa Indonesia yang alami memakai 'menembus'. Catatan kaki mempertahankan arti harfiahnya sebagai alternatif.
- source_word: ῥομφαία
  choice: pedang
  rationale: ῥομφαία dapat menunjuk pada pedang besar, tetapi 'pedang' sudah tepat dan alami dalam konteks metaforis ini tanpa memberi rincian berlebihan.
- source_word: ὅπως ἂν
  choice: supaya
  rationale: Ungkapan ini menyatakan tujuan atau hasil yang dimaksudkan; 'supaya' ringkas dan alami serta tidak memaksakan pembedaan yang tidak pasti antara tujuan dan hasil.
- source_word: ἀποκαλυφθῶσιν
  choice: tersingkap
  rationale: Bentuk pasif ini menyatakan bahwa sesuatu yang tersembunyi menjadi terbuka. 'Tersingkap' mempertahankan gambaran penyingkapan dengan bahasa Indonesia yang wajar.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: dari banyak hati
  rationale: 'ἐκ menandai sumber: pikiran itu berasal dari dalam banyak hati. Terjemahan ini mempertahankan unsur sumber yang eksplisit dalam bahasa Yunani.'
- source_word: διαλογισμοί
  choice: pikiran
  rationale: Kata ini dapat berarti pikiran, pertimbangan, atau penalaran batin, terkadang bernuansa negatif. 'Pikiran' cukup luas sehingga ambiguitas konteks tetap terpelihara.
theological_decisions:
- issue: Rujukan sapaan dan daya nubuat metafora pedang
  choice: Ayat diterjemahkan sebagai sapaan langsung kepada Maria yang menubuatkan penderitaan batin mendalam, tanpa menentukan secara spesifik bagaimana penderitaan itu akan terjadi.
  alternative: Menafsirkan pedang secara khusus sebagai dukacita Maria pada penyaliban Yesus, atau secara lebih luas sebagai rasa sakit akibat dampak memecah-belah dari pelayanan Yesus.
  rationale: Bahasa Yunani secara langsung menegaskan 'jiwamu sendiri juga', tetapi tidak menjelaskan secara eksplisit peristiwa tertentu yang dilambangkan oleh pedang. Terjemahan utama dan catatan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Menembus' dipilih dalam teks utama karena paling alami dengan subjek 'pedang', sedangkan arti verbal yang lebih harfiah dicatat. Tanda pisah membantu memperlihatkan bahwa klausa tujuan/hasil berkaitan dengan konteks nubuat tanpa menyelesaikan secara paksa hubungan logisnya.
