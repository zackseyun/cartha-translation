  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: id
  text: Pada saat itu juga[a], ia datang mendekat dan mengucap syukur[b] kepada Allah serta berbicara tentang dia[c] kepada semua orang yang menantikan penebusan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada saat yang sama.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memuji Allah.” Kata Yunani ini dapat menyatakan ucapan syukur atau pujian.
    reason: lexical_alternative
  - marker: c
    text: Kata “dia” paling wajar mengacu kepada anak Yesus dalam konteks ini, meskipun “Allah” adalah kata benda eksplisit terdekat dalam bahasa Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: pada saat itu juga
  rationale: Ungkapan datif ini menunjukkan waktu, sedangkan αὐτῇ memberi penekanan bahwa peristiwa itu terjadi tepat pada saat yang sama. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesan kesegeraan.
- source_word: ἐπιστᾶσα
  choice: ia datang mendekat
  rationale: Partisip aoris ἐφίστημι di sini menggambarkan Hana tiba dan mendekati tempat kejadian. Terjemahan ini menyatakan kedatangannya tanpa menentukan cara atau posisi secara berlebihan.
- source_word: ἀνθωμολογεῖτο
  choice: mengucap syukur
  rationale: Verba imperfek ini dapat berarti menyatakan syukur atau pujian sebagai tanggapan. 'Mengucap syukur kepada Allah' alami dalam bahasa Indonesia; aspek imperfek tidak diperluas menjadi 'mulai' karena nuansa ingresif tidak wajib secara gramatikal.
- source_word: τῷ θεῷ
  choice: kepada Allah
  rationale: Datif menyatakan pihak yang menerima ucapan syukur atau pujian. Artikel Yunani tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: berbicara tentang Dia
  rationale: Bentuk imperfek menyatakan kegiatan berbicara yang berlangsung. Pronomina dipertahankan agar acuannya tidak diselesaikan secara interpretatif di dalam teks utama.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: kepada semua orang yang menantikan
  rationale: προσδέχομαι dalam konteks Lukas menyatakan penantian yang penuh harap. 'Menantikan' ringkas, wajar, dan mempertahankan unsur pengharapan.
- source_word: λύτρωσιν
  choice: penebusan
  rationale: λύτρωσις menunjuk pada pembebasan atau pelepasan dan dapat mengandung bobot keselamatan. 'Penebusan' mempertahankan keluasan teologis istilah itu tanpa membatasinya hanya pada pembebasan politik.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan αὐτοῦ dalam frasa 'berbicara tentang Dia'
  choice: Pronomina 'Dia' dipertahankan; dalam konteks narasi, acuannya paling wajar adalah anak Yesus.
  alternative: Pronomina itu dapat dipahami mengacu kepada Allah, sebab Allah adalah anteseden eksplisit yang terdekat dalam bahasa Yunani.
  rationale: Narasi berpusat pada anak itu dan pemberitaan Hana kepada orang-orang yang menantikan penebusan paling wajar berkenaan dengan dia. Namun, mengganti pronomina dengan 'Yesus' akan menghapus ambiguitas asli, sehingga pronomina dipertahankan dan ketegangannya dijelaskan dalam catatan kaki.
- issue: Makna 'penebusan Yerusalem'
  choice: Frasa genitif diterjemahkan secara langsung sebagai 'penebusan Yerusalem'.
  alternative: Dapat dipahami sebagai 'pembebasan Yerusalem' atau tindakan penyelamatan Allah bagi umat-Nya yang dikaitkan dengan Yerusalem.
  rationale: Ungkapan ini dapat mencakup harapan akan tindakan penyelamatan Allah dengan gema komunal dan eskatologis. Terjemahan tidak mempersempitnya menjadi pembebasan politik ataupun pengertian rohani saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas pronomina atau keluasan makna 'penebusan Yerusalem'.
