id: LUK.2.46
reference: Luke 2:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: id
  text: Sesudah tiga hari, mereka mendapati Dia di kompleks Bait Allah[a], sedang duduk di tengah-tengah para pengajar, mendengarkan mereka dan mengajukan pertanyaan kepada mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang dipakai menunjuk pada seluruh kompleks atau pelataran Bait Allah, bukan khususnya ruang kudus bagian dalam.
    reason: cultural_note
  - marker: b
    text: 'Atau: menanyai mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: tidak diterjemahkan secara tersendiri
  rationale: Sebagai formula naratif khas Lukas, unsur ini secara alami terwakili oleh pembukaan kalimat peristiwa dalam bahasa Indonesia; terjemahan harfiah seperti 'terjadilah' terasa lebih kaku tanpa menambah makna.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: sesudah tiga hari
  rationale: Mempertahankan urutan dan hubungan waktu yang dinyatakan oleh μετά dengan akusatif, dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: εὗρον
  choice: mereka mendapati
  rationale: Menyampaikan tindakan menemukan setelah pencarian; 'mendapati' alami dalam konteks ketika mereka menjumpai Yesus dalam keadaan tertentu.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk pada seluruh kawasan atau pelataran Bait Allah, bukan secara khusus ruang kudus bagian dalam; 'kompleks' memperjelas cakupan itu tanpa memakai istilah teknis yang sukar.
- source_word: καθεζόμενον
  choice: sedang duduk
  rationale: Bentuk partisipel kini menggambarkan keadaan yang sedang berlangsung ketika Dia ditemukan.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: di tengah-tengah para pengajar
  rationale: Menerjemahkan διδάσκαλοι secara langsung tanpa menambahkan 'Taurat', yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: ἀκούοντα αὐτῶν
  choice: mendengarkan mereka
  rationale: Menggambarkan perhatian aktif dalam percakapan, bukan sekadar mendengar bunyi.
- source_word: ἐπερωτῶντα αὐτούς
  choice: mengajukan pertanyaan kepada mereka
  rationale: Mengungkapkan tindakan bertanya secara idiomatis tanpa memberi kesan bahwa Yesus sedang menginterogasi atau menantang mereka.
theological_decisions:
- issue: Sifat interaksi Yesus dengan para pengajar
  choice: mendengarkan mereka dan mengajukan pertanyaan kepada mereka
  alternative: mendengarkan mereka dan menanyai mereka
  rationale: Pilihan ini mempertahankan gambaran Yesus yang terlibat aktif dalam pembelajaran dan pembahasan, tanpa mengurangi hikmat-Nya ataupun menambahkan nada konfrontatif yang tidak dituntut oleh bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Huruf kapital pada 'Dia' mengikuti kebiasaan penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia. 'Kompleks Bait Allah' dipilih agar perbedaan leksikal ἱερόν dan ναός tersampaikan langsung, dengan catatan kaki sebagai penjelasan.
