  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: id
  text: Setiap tahun orang tua-Nya pergi ke Yerusalem untuk merayakan Paskah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: pergi
  rationale: Bentuk imperfek ini menyatakan kebiasaan berulang pada masa lampau. Dalam bahasa Indonesia, kata 'pergi' bersama frasa 'setiap tahun' menyampaikan makna habitual itu secara alami.
- source_word: γονεῖς
  choice: orang tua-Nya
  rationale: Nomina jamak ini secara langsung berarti 'orang tua'. Bentuk ini alami dan tetap mempertahankan penyebutan keluarga dalam narasi tanpa penjelasan teologis tambahan.
- source_word: κατ’ ἔτος
  choice: setiap tahun
  rationale: Ungkapan distributif ini berarti 'tahun demi tahun' atau 'setiap tahun'; pilihan 'setiap tahun' paling alami dalam bahasa Indonesia modern.
- source_word: Ἰερουσαλὴμ
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: τῇ ἑορτῇ
  choice: untuk merayakan
  rationale: Dalam konteks perjalanan, datif ini menunjukkan kesempatan atau tujuan kepergian. 'Untuk merayakan' mengungkapkan tujuan perayaan secara jelas dan alami.
- source_word: τοῦ πάσχα
  choice: Paskah
  rationale: πάσχα menunjuk pada perayaan Paskah Yahudi. Nama 'Paskah' merupakan padanan baku dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan anggota keluarga Yesus
  choice: orang tua-Nya
  alternative: ayah dan ibu-Nya
  rationale: Teks Yunani memakai istilah biasa yang berarti 'orang tua-Nya'. Terjemahan ini mempertahankan arti naratif apa adanya tanpa menyangkal ataupun menjelaskan lebih jauh konsepsi perawan yang ditegaskan di bagian lain Injil Lukas.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami; penanda kebiasaan 'setiap tahun' ditempatkan di awal untuk memperjelas tindakan berulang.
