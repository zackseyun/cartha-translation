  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: id
  text: Ia datang dalam Roh[a] ke Bait Allah. Ketika orang tua-Nya[b] membawa Anak itu, yaitu Yesus, masuk untuk melaksanakan apa yang lazim menurut hukum Taurat bagi-Nya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh Roh.” Ungkapan Yunani dapat dipahami sebagai keadaan atau lingkungan rohani (“dalam Roh”) maupun sebagai sarana atau tuntunan (“oleh Roh”). Konteks menunjuk kepada Roh Kudus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang tua.” Lukas memakai bahasa keluarga yang biasa bagi Maria dan Yusuf dalam pengasuhan mereka terhadap Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: dalam Roh
  rationale: Bentuk ini mempertahankan preposisi Yunani dan, berdasarkan konteks langsung Lukas 2:25–27, menunjuk kepada Roh Kudus. Catatan kaki mempertahankan kemungkinan nuansa sarana, yaitu “oleh Roh”.
- source_word: ἱερόν
  choice: Bait Allah
  rationale: ἱερόν menunjuk pada kompleks Bait Allah, bukan hanya ruang kudus bagian dalam. “Bait Allah” merupakan padanan Indonesia yang baku dan mudah dipahami.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: ketika ... membawa masuk
  rationale: Infinitif artikular dengan ἐν berfungsi temporal. Susunan ini menyampaikan makna tersebut secara alami dalam bahasa Indonesia.
- source_word: γονεῖς
  choice: orang tua-Nya
  rationale: Padanan ini menerjemahkan sebutan keluarga yang biasa bagi Maria dan Yusuf dalam peran mereka merawat Yesus. Akhiran “-Nya” memperjelas hubungan yang sudah nyata dari konteks tanpa menambahkan klaim tentang paternitas biologis.
- source_word: παιδίον Ἰησοῦν
  choice: anak Yesus
  rationale: παιδίον di sini mengacu pada seorang anak kecil atau bayi; “anak Yesus” alami dan mempertahankan penyebutan nama yang menerangkan anak itu.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: untuk melakukan bagi-Nya
  rationale: Infinitif genitif menyatakan tujuan; αὐτούς menunjuk kepada orang tua sebagai pelaku, sedangkan περὶ αὐτοῦ menyatakan bahwa tindakan itu dilakukan berkenaan dengan Yesus. Restrukturisasi ini diperlukan agar alami dalam bahasa Indonesia.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: apa yang menjadi kebiasaan menurut hukum Taurat
  rationale: εἰθισμένον menyatakan sesuatu yang lazim atau ditetapkan sebagai kebiasaan. Padanan ini mempertahankan kaitannya dengan hukum Musa tanpa mengubahnya menjadi istilah teknis yang tidak ada dalam teks.
theological_decisions:
- issue: Rujukan kata “Roh” dalam tindakan Simeon
  choice: Roh Kudus
  alternative: roh atau sikap batin Simeon sendiri
  rationale: Konteks langsung berulang kali menyebut Roh Kudus (Lukas 2:25–27), sehingga rujukan kepada Roh Kudus paling kuat. Terjemahan “dalam Roh” tetap mempertahankan bentuk dan nuansa ungkapan Yunani.
- issue: Sebutan “orang tua” bagi Maria dan Yusuf
  choice: Menerjemahkan γονεῖς secara langsung sebagai “orang tua-Nya”
  alternative: wali-Nya; Yusuf dan Maria
  rationale: Lukas memakai bahasa keluarga yang biasa untuk menggambarkan Maria dan Yusuf dalam hubungan sosial serta pengasuhan mereka terhadap Yesus. Terjemahan tidak boleh melemahkan atau mengganti sebutan teks demi menyelesaikan ketegangan teologis yang tidak diselesaikan oleh ayat ini sendiri.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Bait Allah” serta “hukum Taurat” dipakai sebagai istilah Alkitabiah yang umum. Kapitalisasi “Roh” menandai rujukan kontekstual kepada Roh Kudus. Koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
