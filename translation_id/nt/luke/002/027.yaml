  terminology: “Roh,” “Bait Allah,” dan “hukum Taurat” merupakan istilah yang tepat dan lazim dalam bahasa Indonesia modern berregister Alkitabiah. “Orang tua-Nya” menerjemahkan γονεῖς secara langsung tanpa membuat klaim tambahan. Catatan kaki a mempertahankan alternatif yang relevan; catatan b tepat dan jangkar keduanya sesuai.
