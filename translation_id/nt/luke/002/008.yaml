  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: id
  text: Di daerah yang sama ada para gembala yang bermalam di padang terbuka[a] sambil menjaga kawanan domba mereka pada malam hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tinggal di luar” atau “berkemah di tempat terbuka.” Kata kerja Yunani ini menekankan bahwa para gembala menghabiskan malam di luar, di padang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menjalankan giliran-giliran jaga malam atas kawanan mereka,” yang mengisyaratkan penjagaan malam secara bergiliran.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Di daerah yang sama, ada
  rationale: Καί melanjutkan narasi; dalam bahasa Indonesia, kesinambungan itu dapat tersirat secara alami ketika latar baru diperkenalkan tanpa harus memakai 'Dan'.
- source_word: ποιμένες
  choice: beberapa gembala
  rationale: ποιμένες secara khusus menunjuk kepada para penjaga domba. 'Beberapa' membuat bentuk jamaknya alami tanpa menyatakan jumlah tertentu.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: di daerah yang sama
  rationale: χώρα di sini berarti daerah atau wilayah sekitar yang baru disebut; 'daerah' alami dan tidak terlalu luas.
- source_word: ἀγραυλοῦντες
  choice: bermalam di padang terbuka
  rationale: Kata kerja ini menekankan bahwa para gembala menghabiskan malam di luar, di kawasan padang; 'bermalam' menangkap unsur malam yang tersirat.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: berjaga pada malam hari
  rationale: Konstruksi serumpun ini secara harfiah berbicara tentang menjalankan giliran-giliran jaga malam. Terjemahan utama dibuat alami, sedangkan kemungkinan berjaga secara bergiliran dicatat dalam catatan kaki.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: menjaga kawanan domba mereka
  rationale: ποίμνη adalah kawanan, dalam konteks ini kawanan domba. Pengulangan 'menjaga' menghasilkan ungkapan Indonesia yang jelas dan alami.
