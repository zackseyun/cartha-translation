  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: id
  text: Tetapi Maria terus menyimpan dengan saksama semua perkataan itu[a], sambil menimbang-nimbangnya[b] dalam hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua hal itu”; kata Yunani ini dapat merujuk pada perkataan, ucapan, atau perkara yang diberitakan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga mengandung arti “mempertemukan” atau “mempertimbangkan bersama” berbagai hal dalam batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Namun
  rationale: Menandai peralihan dengan kontras ringan antara tanggapan orang banyak pada ayat sebelumnya dan tanggapan batin Maria.
- source_word: Μαρία
  choice: Maria
  rationale: Mengikuti bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: πάντα συνετήρει
  choice: terus menyimpan semua
  rationale: Bentuk imperfek συνετήρει menggambarkan tindakan yang berlangsung, sedangkan kata kerjanya menyiratkan pemeliharaan yang saksama, bukan sekadar ingatan sesaat.
- source_word: τὰ ῥήματα ταῦτα
  choice: perkataan itu
  rationale: Dalam konteks ini ῥήματα terutama menunjuk pada pesan atau hal-hal yang telah dikatakan oleh para gembala; 'perkataan' mempertahankan kaitan langsung dengan tuturan.
- source_word: συμβάλλουσα
  choice: menimbang-nimbangnya
  rationale: Partisipel ini menggambarkan kegiatan mempertemukan, membandingkan, dan mempertimbangkan berbagai hal dalam batin. 'Menimbang-nimbang' terdengar alami dan mempertahankan proses perenungan tanpa menyiratkan bahwa Maria sudah memahami semuanya secara tuntas.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: dalam hatinya
  rationale: Mempertahankan ungkapan metaforis Yunani tentang pusat pemikiran, perenungan, dan perasaan batin.
theological_decisions:
- issue: Sifat tanggapan Maria
  choice: Maria dengan saksama menyimpan pesan itu dan terus mempertimbangkannya dalam batin.
  alternative: Maria sekadar mengingat peristiwa-peristiwa itu, atau sudah memahami sepenuhnya maknanya.
  rationale: Ayat ini menyatakan pemeliharaan dan perenungan yang berkelanjutan, tetapi tidak memastikan bahwa Maria pada saat itu telah mencapai pemahaman penuh.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. 'Terus menyimpan' menyatakan aspek berlangsung dari bentuk imperfek, sedangkan 'menimbang-nimbang' menyampaikan perenungan aktif tanpa terdengar terlalu teknis. Metafora 'dalam hatinya' dipertahankan.
