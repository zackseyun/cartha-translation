  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: id
  text: Lalu Simeon memberkati mereka dan berkata kepada Maria, ibu-Nya, “Lihatlah, anak ini ditetapkan bagi kejatuhan dan kebangkitan banyak orang di Israel, serta menjadi suatu tanda yang ditentang.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang dibantah.”'
    reason: ἀντιλεγόμενον dapat menunjuk pada tanda yang dilawan atau dibantah.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: memberkati
  rationale: Padanan langsung dan alami untuk tindakan Simeon terhadap mereka.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan yang mengarahkan perhatian, dengan ragam bahasa yang jelas dan bermartabat.
- source_word: οὗτος
  choice: anak ini
  rationale: Rujukannya adalah Yesus yang masih bayi; bentuk ini lebih alami dalam bahasa Indonesia daripada “orang ini” tanpa menambah nama yang tidak disebutkan.
- source_word: κεῖται εἰς
  choice: ditetapkan untuk
  rationale: Dalam konteks ini ungkapan tersebut menyatakan bahwa anak itu diperuntukkan atau ditentukan bagi hasil-hasil berikut, bukan sekadar sedang berbaring.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: membuat ... jatuh dan bangkit
  rationale: Menyampaikan pasangan kata yang sengaja dikontraskan dan mempertahankan kemungkinan makna bangkit, dipulihkan, atau kebangkitan tanpa mempersempitnya dalam catatan utama.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: suatu tanda yang ditentang
  rationale: Partisipel kini pasif menunjukkan tanda yang dilawan, dibantah, atau ditentang; “ditentang” paling luas dan alami.
theological_decisions:
- issue: Makna ‘jatuh dan bangkit’ bagi banyak orang
  choice: Mempertahankan ungkapan ‘jatuh dan bangkit’ tanpa menjelaskan apakah kelompok yang sama atau berbeda dimaksudkan.
  alternative: Menafsirkan sebagai keruntuhan sebagian orang dan pemulihan atau kebangkitan sebagian yang lain.
  rationale: Teks Yunani menyisakan ketegangan mengenai hubungan ‘banyak orang’ dengan kedua hasil tersebut, sehingga terjemahan tidak boleh menyelesaikannya secara diam-diam.
- issue: Daya penyebab dalam εἰς πτῶσιν καὶ ἀνάστασιν
  choice: “untuk membuat ... jatuh dan bangkit”
  alternative: “bagi jatuh dan bangkitnya banyak orang”
  rationale: Pilihan utama lebih wajar dalam bahasa Indonesia dan menyatakan bahwa anak ini menjadi penentu hasil tersebut, tanpa merinci mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. “Anak itu” menghindari ambiguitas pronomina pada frasa ‘ibunya’, sedangkan “anak ini” sesuai dengan situasi Simeon yang sedang menunjuk kepada Yesus.
