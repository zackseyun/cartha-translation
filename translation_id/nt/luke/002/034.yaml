  rationale: Revisi menghapus kausativitas yang ditambahkan oleh “membuat” dan memulihkan bentuk nominal yang sesuai dengan πτῶσιν καὶ ἀνάστασιν. Revisi juga mengganti “ibu anak itu” dengan “ibu-Nya” untuk mencerminkan μητέρα αὐτοῦ secara lebih langsung dan alami. Ambiguitas mengenai hubungan antara kejatuhan dan kebangkitan serta orang-orang yang terlibat tetap dipertahankan.
