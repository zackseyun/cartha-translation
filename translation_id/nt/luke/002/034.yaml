    issue: Tambahan daya kausatif pada “untuk membuat ... jatuh dan bangkit”
    rationale: Konstruksi εἰς diikuti nomina πτῶσιν dan ἀνάστασιν menyatakan tujuan/hasil atau peruntukan, bukan secara leksikal tindakan kausatif “membuat.” Terjemahan nominal menghindari penambahan makna dan tidak memutuskan mekanisme atau pelaku kejatuhan/kebangkitan.
  - severity: low
    issue: “Ibu anak itu” menggantikan posesif sumber
    rationale: τὴν μητέρα αὐτοῦ secara langsung berarti “ibu-Nya.” Walaupun “anak itu” menunjuk kepada Yesus, “ibu-Nya” lebih dekat dengan sumber dan lebih idiomatis.
