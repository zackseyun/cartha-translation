  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: id
  text: 'Dan inilah tandanya bagi kalian: kalian akan menemukan seorang bayi yang dibungkus dengan kain bedung dan terbaring di dalam palungan[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibedung.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di dalam tempat makan ternak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: Kata ini menunjuk pada tanda atau ciri pengenal. Dalam konteks ini, tanda tersebut memungkinkan para gembala mengenali bayi itu tanpa menegaskan bahwa tandanya sendiri merupakan mukjizat.
- source_word: εὑρήσετε
  choice: kalian akan menemukan
  rationale: Bentuk futur orang kedua jamak diterjemahkan secara langsung dan alami; 'kalian' memperjelas bahwa sapaan ditujukan kepada para gembala sebagai kelompok.
- source_word: βρέφος
  choice: seorang bayi
  rationale: Kata ini menunjuk pada anak yang masih sangat kecil. 'Bayi' merupakan padanan modern yang jelas dan tepat.
- source_word: ἐσπαργανωμένον
  choice: dibungkus dengan kain
  rationale: Partisip ini menggambarkan bayi yang dibalut atau dibungkus dengan kain. Ungkapan ini konkret dan mudah dipahami, sedangkan alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: κείμενον
  choice: terbaring
  rationale: Kata ini menggambarkan keadaan atau posisi bayi, bukan tindakan sebelumnya ketika ia dibaringkan.
- source_word: φάτνῃ
  choice: di dalam palungan
  rationale: Kata ini dapat menunjuk pada palungan, yaitu wadah tempat makan ternak. 'Palungan' mempertahankan istilah yang mapan, sementara makna konkretnya diberikan dalam catatan kaki.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: inilah tandanya bagi kalian
  rationale: Klausa Yunani bersifat eliptis. Bentuk ini melengkapinya secara idiomatis dalam bahasa Indonesia dan tetap mempertahankan fungsi tanda itu bagi para gembala.
theological_decisions:
- issue: Sifat tanda yang diberikan kepada para gembala
  choice: Ayat ini menyajikan keadaan bayi sebagai tanda pengenal, tanpa menyebutnya secara eksplisit sebagai mukjizat.
  alternative: Tanda itu juga dapat dipahami sebagai peneguhan ilahi dengan makna teologis yang lebih luas.
  rationale: Terjemahan mempertahankan kata 'tanda' dan tidak menambahkan penjelasan doktrinal. Dengan demikian, fungsi naratifnya jelas, sementara kemungkinan bobot teologis yang lebih luas tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Kalian' dipakai untuk menampilkan bentuk jamak ὑμῖν dan εὑρήσετε secara jelas. Istilah 'palungan' dipertahankan karena mapan, lalu dijelaskan secara konkret dalam catatan kaki.
