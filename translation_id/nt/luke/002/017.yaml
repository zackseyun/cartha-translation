  verdict: revise
  source_fidelity: Terjemahan menangkap urutan temporal partisip aoris ἰδόντες, tindakan γνωρίζω, dan isi ῥῆμα yang sebelumnya telah disampaikan kepada para gembala. Namun, objek implisit dari ἰδόντες dapat dinyatakan sebagai “-Nya” dalam bahasa Indonesia tanpa menambah makna, karena acuannya jelas dari konteks langsung (bayi itu).
  naturalness: “Setelah melihat” dapat dipahami, tetapi terdengar kurang lengkap dalam bahasa Indonesia modern karena verba “melihat” biasanya menuntut objek dalam konteks ini. “Setelah mereka melihat-Nya” lebih idiomatis dan jelas. “Disampaikan kepada mereka” juga lebih alami untuk pesan yang diucapkan, sambil tetap mempertahankan pasif dari λαληθέντος.
  terminology: “Pesan” merupakan padanan modern yang baik bagi ῥῆμα dalam konteks ini. Catatan kaki sebaiknya memberi alternatif leksikal yang langsung untuk ῥῆμα, yaitu “perkataan” atau “ucapan”, bukan parafrasa yang mengaburkan bahwa alternatif itu merujuk pada nomina sumber.
  issues:
