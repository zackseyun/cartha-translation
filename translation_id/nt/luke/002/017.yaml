base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: id
  text: Setelah mereka melihat-Nya, mereka memberitahukan pesan[a] yang telah disampaikan kepada mereka tentang anak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan” atau “ucapan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Setelah melihat
  rationale: Partisip aoris ini menunjukkan tindakan yang mendahului kata kerja utama. Teks Yunani tidak menyebutkan objeknya; terjemahan ini mempertahankan ketidaktersuratan itu, sementara konteks menjelaskan apa yang mereka lihat.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini hanya menghubungkan dan melanjutkan alur cerita. Dalam bahasa Indonesia, hubungan tersebut sudah alami tanpa konjungsi eksplisit setelah pembuka temporal.
- source_word: ἐγνώρισαν
  choice: mereka memberitahukan
  rationale: γνωρίζω di sini berarti membuat sesuatu diketahui. 'Memberitahukan' alami dalam bahasa Indonesia dan tidak memberi kesan proklamasi resmi yang tidak dinyatakan teks.
- source_word: περὶ τοῦ ῥήματος
  choice: pesan
  rationale: ῥῆμα dapat berarti perkataan, pernyataan, atau pesan. Dalam konteks ini, kata tersebut menunjuk pada isi yang disampaikan kepada para gembala mengenai anak itu.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: yang telah dikatakan kepada mereka
  rationale: Terjemahan ini mempertahankan bentuk pasif dan menunjukkan bahwa perkataan itu disampaikan sebelum para gembala memberitahukannya.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: tentang anak itu
  rationale: παιδίον menunjuk pada seorang anak kecil, dalam konteks ini bayi yang baru mereka lihat. 'Anak itu' jelas, wajar, dan tidak menambahkan nuansa yang tidak diperlukan.
theological_decisions:
- issue: Makna ῥῆμα dalam kaitannya dengan pemberitahuan malaikat
  choice: pesan
  alternative: perkataan atau hal yang dikatakan
  rationale: '''Pesan'' menyampaikan bahwa yang diberitahukan para gembala adalah isi perkataan yang sebelumnya mereka dengar. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah tanpa memasukkan pengertian teologis tambahan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti urutan tindakan dalam teks Yunani tanpa terasa kaku. Huruf kecil pada 'anak' dipakai karena frasa Yunani merupakan sebutan biasa dalam konteks ini, bukan gelar.
