  - severity: low
    issue: Catatan kaki alternatif untuk “pesan” kurang langsung.
    rationale: “Hal yang telah dikatakan” adalah parafrasa seluruh konstruksi, sedangkan alternatif leksikal bagi ῥῆμα lebih tepat dinyatakan sebagai “perkataan” atau “ucapan”.
