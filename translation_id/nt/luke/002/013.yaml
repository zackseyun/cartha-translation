  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: id
  text: 'Tiba-tiba, ada sejumlah besar bala tentara surgawi[a] bersama malaikat itu, yang memuji Allah dan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pasukan surga" atau "bala tentara surga."
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαίφνης
  choice: Tiba-tiba
  rationale: Secara alami menyampaikan kemendadakan dan kejutan dalam alur cerita.
- source_word: ἐγένετο
  choice: tampaklah
  rationale: Dalam konstruksi ini, verba tersebut memperkenalkan hadirnya rombongan surgawi dalam adegan. 'Tampaklah' wajar dalam konteks penampakan, tetapi tidak merinci cara mereka muncul.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: bersama malaikat itu
  rationale: Menyatakan penyertaan; artikel Yunani menunjuk kembali kepada malaikat yang sudah disebut.
- source_word: πλῆθος
  choice: sejumlah besar
  rationale: Menunjukkan jumlah yang sangat banyak dengan ungkapan Indonesia yang alami dan tidak arkais.
- source_word: στρατιᾶς οὐρανίου
  choice: bala tentara surgawi
  rationale: Mempertahankan citra militer στρατιά sekaligus acuan surgawinya, tanpa menggantinya secara interpretatif dengan 'para malaikat'.
- source_word: αἰνούντων τὸν θεόν
  choice: yang memuji Allah
  rationale: Menyampaikan tindakan partisipel kini secara alami dan menjadikan Allah sebagai objek pujian.
- source_word: καὶ λεγόντων
  choice: dan berkata
  rationale: Mempertahankan hubungan koordinatif dengan tindakan memuji dan mengantar langsung kepada kutipan pada ayat berikutnya.
theological_decisions:
- issue: Makna στρατιᾶς οὐρανίου
  choice: bala tentara surgawi
  alternative: pasukan surga
  rationale: Pilihan utama mempertahankan gambaran rombongan surgawi yang teratur dan bernuansa militer, meskipun dalam konteks ini mereka sedang memuji, bukan berperang. Alternatif dicatat agar citra sumber tetap transparan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan kejutan naratif, penyertaan malaikat yang telah disebut, citra militer-surgawi, serta hubungan dengan ucapan pada ayat berikutnya.
