  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: id
  text: Namun, mereka menyangka bahwa dia berada dalam rombongan perjalanan[a], lalu menempuh perjalanan sehari dan mulai mencari dia[b] di antara sanak saudara dan kenalan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kafilah”; kata Yunani συνοδία menunjuk pada rombongan orang yang bepergian bersama.
    reason: lexical_alternative
  - marker: b
    text: Bentuk kata kerja Yunani juga dapat diterjemahkan “terus mencari dia” atau “sedang mencari dia”, dengan menekankan berlangsungnya pencarian.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: karena menyangka
  rationale: Partisip aoris ini menyatakan dugaan yang mendasari tindakan mereka; 'menyangka' mempertahankan sifat dugaan itu tanpa menyiratkan kepastian.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai perkembangan ringan sekaligus kontras naratif dengan ayat sebelumnya.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: ada dalam rombongan perjalanan
  rationale: συνοδία menunjuk pada sekelompok orang yang bepergian bersama; ungkapan ini jelas dalam bahasa Indonesia modern dan tidak mempersempitnya menjadi jenis kafilah tertentu.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: mereka menempuh perjalanan sehari
  rationale: Ungkapan Yunani ini menyatakan perjalanan sejauh atau selama satu hari; terjemahan ini alami dan ringkas.
- source_word: ἀνεζήτουν
  choice: mulai mencari
  rationale: Bentuk imperfek dapat menonjolkan awal tindakan dalam alur cerita sekaligus mengisyaratkan bahwa pencarian itu berlangsung.
- source_word: συγγενεῦσιν
  choice: sanak saudara
  rationale: Istilah ini mencakup kerabat secara luas dan diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: γνωστοῖς
  choice: kenalan
  rationale: γνωστοί menunjuk pada orang-orang yang dikenal, tanpa harus berarti sahabat dekat.
