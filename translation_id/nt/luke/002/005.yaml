  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: id
  text: untuk mendaftarkan diri bersama Maria, yang telah bertunangan dengannya[a] dan sedang mengandung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah dipertunangkan dengannya.” Pertunangan dalam masyarakat Yahudi waktu itu merupakan ikatan hukum dan sosial yang lebih kuat daripada pertunangan pada umumnya sekarang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berada dalam keadaan mengandung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: untuk mendaftarkan diri
  rationale: Infinitif aoris medium ini menyatakan tujuan perjalanan dalam konteks sensus. 'Mendaftarkan diri' merupakan ungkapan administratif yang alami dalam bahasa Indonesia dan mencerminkan bentuk medium tanpa membuatnya terlalu pasif.
- source_word: σὺν
  choice: bersama
  rationale: Menyatakan penyertaan; 'bersama' alami dalam konstruksi ini.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: yang telah bertunangan dengannya
  rationale: Partisip perfek pasif menunjukkan ikatan pertunangan yang sudah ditetapkan dan masih berlaku. 'Telah bertunangan' mempertahankan aspek tersebut, sementara catatan kaki menjelaskan bahwa ikatannya lebih kuat daripada pertunangan modern.
- source_word: οὔσῃ ἐγκύῳ
  choice: dan sedang mengandung
  rationale: Frasa partisipial ini menggambarkan keadaan Maria pada waktu itu. 'Sedang mengandung' jelas, alami, dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Status perkawinan Maria dalam hubungannya dengan Yusuf
  choice: telah bertunangan dengannya
  alternative: telah dipertunangkan dengannya; adalah tunangannya; istrinya
  rationale: Kata Yunani μνηστεύομαι secara khusus menunjuk pada pertunangan formal, bukan menyebut Maria sebagai 'istri' dalam klausa ini. Terjemahan ini mempertahankan status yang dinyatakan teks tanpa menambahkan kesimpulan tentang tahap perkawinannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan hubungan partisipial teks Yunani sambil tetap alami. Semua penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskan.
