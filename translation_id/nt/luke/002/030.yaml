  text: ὅτι εἶδον οἱ ὀφθαλμοί μου τὸ σωτήριόν σου
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/030.yaml
  text: because my eyes have seen your salvation[a]
translation:
  language: id
  text: sebab mataku telah melihat keselamatan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Juruselamat-Mu.” Bahasa Yunani mengatakan “keselamatan-Mu”, tetapi dalam konteks ini keselamatan Allah hadir dalam diri Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Dalam konteks ini, ὅτι menyatakan alasan mengapa Simeon dapat pergi dalam damai. “Sebab” mempertahankan hubungan kausal itu dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: εἶδον
  choice: telah melihat
  rationale: Bentuk aoris menyatakan tindakan yang sudah terjadi; “telah melihat” juga menyampaikan relevansinya bagi ucapan Simeon saat itu.
- source_word: οἱ ὀφθαλμοί μου
  choice: mataku
  rationale: Ungkapan Yunani secara eksplisit menyebut “mata-mataku”; bentuk tunggal kolektif “mataku” merupakan idiom Indonesia yang alami dan tetap mempertahankan gambaran jasmani tersebut.
- source_word: τὸ σωτήριόν σου
  choice: keselamatan dari-Mu
  rationale: σωτήριον menunjuk pada keselamatan atau pembebasan, bukan secara langsung memakai kata personal “Juruselamat”. Preposisi “dari” memperjelas bahwa keselamatan itu berasal dari Allah, sebagaimana ditunjukkan oleh bentuk posesif Yunani σου, tanpa mengaburkan Yesus sebagai perwujudan keselamatan itu dalam konteks.
theological_decisions:
- issue: Apakah τὸ σωτήριόν σου diterjemahkan sebagai konsep “keselamatan” atau dipersonalisasi menjadi “Juruselamat” karena bayi Yesus sedang hadir
  choice: keselamatan dari-Mu
  alternative: Juruselamat dari-Mu
  rationale: Teks memakai σωτήριον, bukan kata benda personal σωτήρ. Terjemahan “keselamatan” mempertahankan bentuk dan ketegangan teologis teks, sementara konteks memungkinkan pembaca memahami bahwa keselamatan Allah hadir dalam diri Yesus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Mataku” dipilih daripada “mata saya” agar sesuai dengan register doa/pujian dan tetap mudah dipahami.
