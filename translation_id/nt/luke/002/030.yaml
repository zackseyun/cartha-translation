  source_fidelity: τὸ σωτήριόν σου secara langsung berarti “keselamatan-Mu,” dengan σου sebagai posesif. “Keselamatan dari-Mu” menyatakan asal, yang dapat tersirat secara kontekstual tetapi bukan bentuk yang paling setia terhadap konstruksi Yunani. Terjemahan “mataku telah melihat” dengan baik mempertahankan penekanan konkret οἱ ὀφθαλμοί μου, dan “sebab” tepat untuk ὅτι yang kausal.
  naturalness: “Sebab mataku telah melihat keselamatan-Mu” adalah bahasa Indonesia modern yang baku, alami dalam register doa/pujian, dan jelas. Bentuk “mataku” wajar sebagai bentuk kolektif idiomatis.
  terminology: “Keselamatan-Mu” mempertahankan istilah abstrak σωτήριον tanpa mengubahnya menjadi gelar personal “Juruselamat.” Jika alternatif interpretatif dicatat, bentuk posesifnya juga harus “Juruselamat-Mu,” bukan “Juruselamat dari-Mu.”
