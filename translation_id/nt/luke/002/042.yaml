  naturalness: Kalimat revisi tetap modern dan wajar dalam bahasa Indonesia. “Sesuai dengan kebiasaan hari raya itu” lebih dekat dengan κατὰ τὸ ἔθος τῆς ἑορτῆς daripada “seperti biasa pada hari raya itu,” tanpa menjadi kaku.
