lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: ia berumur dua belas tahun
  rationale: Ungkapan Yunani γίνομαι dengan genitif usia menyatakan bahwa seseorang telah mencapai atau berada pada usia tertentu. Dalam bahasa Indonesia modern, bentuk yang wajar ialah “berumur dua belas tahun.” Kata ganti “ia” merujuk kepada Yesus dalam konteks sebelumnya.
- source_word: ἀναβαινόντων αὐτῶν
  choice: mereka pergi ke Yerusalem
  rationale: ἀναβαίνω secara harfiah berarti “naik” dan lazim dipakai untuk perjalanan menuju Yerusalem. “Pergi ke Yerusalem” menyampaikan makna idiomatisnya secara alami; tujuan perjalanan tersirat jelas dari ayat sebelumnya. “Mereka” mempertahankan kata ganti αὐτῶν tanpa mempersempit rujukannya hanya kepada orang tua Yesus.
- source_word: κατὰ τὸ ἔθος
  choice: seperti biasa
  rationale: Frasa ini menyatakan tindakan yang sesuai dengan kebiasaan yang telah berlaku. “Seperti biasa” alami dalam bahasa Indonesia dan tidak mengubah maksud sumber.
- source_word: τῆς ἑορτῆς
  choice: pada hari raya itu
  rationale: ἑορτή menunjuk kepada perayaan keagamaan. “Hari raya itu” jelas, bermartabat, dan mempertahankan rujukan tertentu yang telah disebut pada ayat sebelumnya.
- source_word: καὶ ὅτε
  choice: Ketika
  rationale: καί melanjutkan alur narasi dan ὅτε membuka keterangan waktu. Dalam bahasa Indonesia, “Ketika” cukup untuk menyatakan hubungan itu tanpa konjungsi pembuka yang kaku.
