  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: id
  text: Ketika ia berumur dua belas tahun, mereka pergi sesuai dengan kebiasaan hari raya itu,[a]
  philosophy: optimal-equivalence
  footnotes:
