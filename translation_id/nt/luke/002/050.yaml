    issue: “Namun” untuk καί menambahkan nuansa adversatif.
    rationale: SBLGNT memakai καί, penghubung biasa “dan”; konteks tidak mengharuskan “namun.” Terjemahan adversatif dapat menguatkan kontras yang tidak dinyatakan secara leksikal.
  - severity: low
    issue: “yang disampaikan-Nya kepada mereka” kurang langsung dibandingkan verba ujaran Yunani.
    rationale: ἐλάλησεν berarti “berbicara/berkata.” Bentuk aktif “yang Ia katakan kepada mereka” lebih transparan mengenai tindakan Yesus dan tetap alami.
  revised_text: Dan mereka tidak memahami perkataan yang Ia katakan kepada mereka.[a]
