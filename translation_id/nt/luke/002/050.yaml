  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: id
  text: Dan mereka tidak memahami perkataan yang Ia katakan kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kata,” “ucapan,” atau “hal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Dalam konteks ini, penghubung καί mengaitkan tanggapan orang tua Yesus dengan perkataan-Nya sebelumnya. 'Namun' secara wajar menampilkan kontras yang tersirat tanpa mengubah isi pernyataan.
- source_word: αὐτοὶ
  choice: mereka
  rationale: Kata ganti ini merujuk kepada orang tua Yesus dalam konteks. Unsur penegasannya tidak perlu dinyatakan dengan bentuk tambahan karena akan terasa kaku dalam bahasa Indonesia.
- source_word: οὐ συνῆκαν
  choice: tidak memahami
  rationale: Bentuk ini secara langsung menyatakan bahwa mereka tidak mengerti makna perkataan Yesus, tanpa memperlunaknya menjadi 'tidak sepenuhnya memahami' atau menggesernya menjadi penolakan.
- source_word: τὸ ῥῆμα
  choice: perkataan
  rationale: ῥῆμα di sini menunjuk kepada ucapan tertentu yang baru saja disampaikan Yesus. 'Perkataan' alami dalam bahasa Indonesia dan tetap mempertahankan rentang makna yang dapat mencakup kata, ucapan, atau hal yang dikatakan.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: yang disampaikan-Nya kepada mereka
  rationale: '''Disampaikan-Nya kepada mereka'' menyatakan tindakan berbicara kepada mereka secara alami dan bermartabat. Bentuk relatif ''yang'' tetap terikat jelas pada ''perkataan''.'
theological_decisions:
- issue: Gambaran naratif tentang tanggapan orang tua Yesus
  choice: Teks menyatakan secara lugas bahwa mereka tidak memahami perkataan Yesus.
  alternative: Mereka tidak sepenuhnya memahami; atau mereka tidak menerima perkataan itu.
  rationale: Bahasa Yunani menyatakan tidak adanya pemahaman, bukan pemahaman parsial ataupun penolakan. Terjemahan ini mempertahankan ketegangan naratif tentang identitas dan misi Yesus tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Penggunaan bentuk hormat '-Nya' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia; kalimat tetap ringkas dan mudah dipahami.
