id: LUK.2.15
reference: Luke 2:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: id
  text: Setelah para malaikat meninggalkan mereka dan pergi ke surga, para gembala berkata seorang kepada yang lain, “Mari kita pergi sekarang ke Betlehem dan melihat peristiwa yang telah terjadi ini, yang telah diberitahukan Tuhan kepada kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Setelah
  rationale: Ungkapan naratif Lukas beserta klausa waktunya dialihkan secara alami ke dalam bahasa Indonesia; urutan peristiwanya tetap jelas tanpa memakai formula yang kaku seperti 'Dan terjadilah ketika'.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: meninggalkan mereka dan kembali ke surga
  rationale: '''Meninggalkan mereka'' menyampaikan gerak menjauh, sedangkan ''kembali ke surga'' wajar dalam konteks para malaikat dan mempertahankan surga sebagai ranah ilahi.'
- source_word: οἱ ἄγγελοι
  choice: para malaikat
  rationale: Padanan baku dan alami bagi bentuk jamak tertentu.
- source_word: οἱ ποιμένες
  choice: para gembala
  rationale: Padanan baku yang jelas bagi pembaca modern.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: berkata seorang kepada yang lain
  rationale: Menyampaikan tindakan saling berbicara sekaligus berfungsi alami sebagai pengantar kutipan langsung.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: Mari kita pergi sekarang ke Betlehem
  rationale: Bentuk ajakan diterjemahkan dengan 'Mari kita'; δὴ diberi nuansa kesegeraan melalui 'sekarang', dan ἕως secara idiomatis dinyatakan sebagai tujuan 'ke Betlehem'.
- source_word: καὶ ἴδωμεν
  choice: dan melihat
  rationale: Meneruskan ajakan yang sama dengan susunan Indonesia yang alami.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: peristiwa yang telah terjadi ini
  rationale: Dalam konteks ini ῥῆμα menunjuk pada perkara atau kejadian yang diberitakan, bukan hanya kata-kata; 'peristiwa' jelas dan tidak janggal, sementara partisip perfek dipertahankan melalui 'telah terjadi'.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: yang telah diberitahukan Tuhan kepada kita
  rationale: '''Diberitahukan'' menyampaikan makna membuat sesuatu diketahui tanpa menambahkan gagasan teknis tentang pewahyuan; κύριος diterjemahkan secara baku sebagai ''Tuhan''.'
theological_decisions:
- issue: Acuan ὁ κύριος
  choice: Tuhan
  alternative: Menentukan secara eksplisit 'Allah Bapa' atau 'Tuhan Mesias'
  rationale: Konteks paling langsung menunjuk kepada Allah sebagai sumber pemberitahuan melalui para malaikat, tetapi terjemahan 'Tuhan' mempertahankan sebutan teks dan tidak mempersempit acuannya melampaui yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia standar modern, bermartabat, dan mudah dipahami. Struktur pembuka diringkas secara alami tanpa mengubah urutan kejadian; tidak diperlukan catatan kaki karena pilihan 'peristiwa' dan 'ke Betlehem' memadai dalam konteks.
