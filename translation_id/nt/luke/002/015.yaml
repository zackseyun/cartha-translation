  to: Setelah para malaikat meninggalkan mereka dan pergi ke surga, para gembala berkata seorang kepada yang lain, “Mari kita pergi sekarang ke Betlehem dan melihat peristiwa yang telah terjadi ini, yang telah diberitahukan Tuhan kepada kita.”
