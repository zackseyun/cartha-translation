  naturalness: Bahasa Indonesia modernnya jelas dan mengalir. “Setelah” wajar untuk formula naratif ini, dan “Mari kita pergi sekarang ke Betlehem dan melihat” merupakan ajakan yang alami.
  terminology: “Para malaikat,” “para gembala,” “Betlehem,” dan “Tuhan” adalah padanan baku dan sesuai register. “Peristiwa yang telah terjadi ini” menyampaikan τὸ ῥῆμα ... τὸ γεγονός dengan baik dalam konteks.
