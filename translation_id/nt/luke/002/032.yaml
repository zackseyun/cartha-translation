  terminology: “Cahaya,” “penyataan,” “kemuliaan,” dan “umat-Mu, Israel” mempertahankan istilah dan nada Alkitabiah tanpa memasukkan penafsiran doktrinal. Catatan kaki mempertahankan alternatif leksikal “bangsa-bangsa.”
