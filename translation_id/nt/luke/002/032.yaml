  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: id
  text: cahaya untuk penyataan kepada bangsa-bangsa bukan Yahudi[a], dan untuk kemuliaan umat-Mu, Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa-bangsa.” Kata Yunani yang digunakan dapat berarti bangsa-bangsa secara umum, tetapi di sini kemungkinan besar menunjuk kepada bangsa-bangsa bukan Yahudi karena dikontraskan dengan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: cahaya
  rationale: Kata "cahaya" alami dan bermartabat dalam bahasa Indonesia serta mempertahankan gambaran puitis yang dikenakan kepada anak itu.
- source_word: εἰς ἀποκάλυψιν
  choice: untuk menyatakan Allah
  rationale: Dalam konstruksi ini, ἀποκάλυψις menunjuk pada penyingkapan atau penyataan. Objek yang disingkapkan tidak disebutkan secara eksplisit dalam bahasa Yunani; "Allah" dibuat eksplisit berdasarkan konteks penyelamatan ilahi, sehingga sifat penjelasan ini dicatat sebagai keputusan interpretatif.
- source_word: ἐθνῶν
  choice: bangsa-bangsa lain
  rationale: Secara leksikal berarti "bangsa-bangsa" dan, dalam kesejajarannya dengan Israel, secara kontekstual menunjuk kepada bangsa-bangsa bukan Yahudi. Ungkapan ini menyampaikan kontras tersebut tanpa istilah teknis.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Mempertahankan cakupan makna kehormatan dan semarak serta gema teologis istilah tersebut.
- source_word: λαοῦ σου Ἰσραήλ
  choice: umat-Mu, Israel
  rationale: Tanda koma memperjelas bahwa "Israel" merupakan aposisi yang mengidentifikasi umat kepunyaan Allah.
- source_word: καί
  choice: dan
  rationale: Menghubungkan dua unsur sejajar dalam ucapan Simeon.
theological_decisions:
- issue: Makna ἐθνῶν dalam hubungannya dengan Israel
  choice: bangsa-bangsa lain
  alternative: bangsa-bangsa
  rationale: Penyebutan "umat-Mu, Israel" membentuk kontras kontekstual dengan bangsa-bangsa bukan Yahudi. Catatan kaki mempertahankan padanan yang lebih umum.
- issue: Objek ἀποκάλυψις yang tidak dinyatakan
  choice: menyatakan Allah
  alternative: mendatangkan penyataan
  rationale: Bahasa Yunani secara harfiah hanya mengatakan "untuk penyataan bangsa-bangsa" dan tidak menyebut objek penyataan. Pilihan utama membuat makna kontekstual lebih alami dalam bahasa Indonesia, tetapi mengandung penjelasan interpretatif; alternatif lebih mempertahankan ambiguitas gramatikal.
- issue: Hubungan sintaksis δόξαν λαοῦ σου Ἰσραήλ
  choice: untuk menjadi kemuliaan bagi umat-Mu, Israel
  alternative: dan kemuliaan umat-Mu, Israel
  rationale: Tambahan "untuk menjadi" menghasilkan kesejajaran yang wajar dalam bahasa Indonesia dan memahami εἰς sebagai menaungi kedua unsur. Bentuk yang lebih formal tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pada pronomina "-Mu" mengikuti kebiasaan teks Alkitab bahasa Indonesia ketika merujuk kepada Allah. Ungkapan "bangsa-bangsa lain" dipilih agar mudah dipahami pembaca umum.
