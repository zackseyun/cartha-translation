id: LUK.2.9
reference: Luke 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: id
  text: Lalu seorang malaikat Tuhan berdiri di dekat mereka[a], dan kemuliaan Tuhan bersinar mengelilingi mereka. Mereka pun sangat ketakutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “datang mendekati mereka,” “berdiri di hadapan mereka,” atau “tiba-tiba hadir di dekat mereka.” Kata kerja Yunani ini dapat menyatakan kehadiran yang mendadak maupun tindakan berdiri di dekat seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka takut dengan ketakutan yang besar,” sebuah ungkapan Yunani yang menyatakan rasa takut yang amat hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: seorang malaikat Tuhan
  rationale: Dalam konteks kisah ini, ἄγγελος menunjuk kepada makhluk surgawi, sehingga diterjemahkan “malaikat,” bukan sekadar “utusan.” Karena frasa Yunani ini tidak memakai artikel, “seorang malaikat Tuhan” lebih wajar daripada “malaikat Tuhan itu.”
- source_word: ἐπέστη αὐτοῖς
  choice: berdiri di dekat mereka
  rationale: Kata kerja ἐφίστημι dapat menggambarkan seseorang yang tiba-tiba hadir lalu berdiri di dekat orang lain. Terjemahan ini mempertahankan gambaran konkretnya tanpa menentukan secara berlebihan apakah malaikat itu berada tepat di hadapan mereka.
- source_word: δόξα κυρίου
  choice: kemuliaan Tuhan
  rationale: Terjemahan langsung ini mempertahankan bobot teologis δόξα, yang dalam konteks ini tampak sebagai kemegahan ilahi yang bercahaya.
- source_word: περιέλαμψεν αὐτούς
  choice: bersinar mengelilingi mereka
  rationale: περιλάμπω berarti memancarkan cahaya di sekeliling atau menyelubungi dengan cahaya. Ungkapan ini dekat dengan bentuk Yunani sekaligus alami dalam bahasa Indonesia.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: mereka pun sangat ketakutan
  rationale: Bahasa Yunani memakai kata kerja dan kata benda yang seakar, secara harfiah “mereka takut dengan ketakutan yang besar,” untuk menegaskan dahsyatnya rasa takut. “Sangat ketakutan” menyampaikan intensitas itu secara alami.
theological_decisions:
- issue: Penerjemahan κύριος dalam frasa ἄγγελος κυρίου dan δόξα κυρίου
  choice: Tuhan
  alternative: Tuan
  rationale: Dalam konteks ini κύριος jelas merujuk kepada Allah. “Tuhan” merupakan padanan bahasa Indonesia yang tepat dan mempertahankan pemakaian religius istilah tersebut tanpa memasukkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti alur Yunani, sedangkan ungkapan ketakutan dialihkan secara idiomatis agar jelas bagi pembaca umum.
