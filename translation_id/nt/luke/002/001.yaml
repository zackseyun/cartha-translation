  naturalness: “Pada masa itu, keluarlah suatu ketetapan” dapat dipahami, tetapi inversi “keluarlah” terdengar kaku dalam bahasa Indonesia modern. “Kaisar Augustus mengeluarkan suatu ketetapan” lebih alami, tetap formal, dan menyampaikan bahwa ketetapan itu berasal darinya.
  terminology: “Kaisar Augustus,” “ketetapan,” dan “didaftarkan” tepat untuk Καίσαρος Αὐγούστου, δόγμα, dan ἀπογράφεσθαι. “Seluruh dunia” dipakai sebagai padanan alami untuk πᾶσαν τὴν οἰκουμένην; catatan kaki menjelaskan kemungkinan acuan kepada dunia/kekaisaran Romawi.
