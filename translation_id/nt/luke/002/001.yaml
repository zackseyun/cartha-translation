  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: id
  text: Pada masa itu, Kaisar Augustus mengeluarkan suatu ketetapan agar seluruh dunia didaftarkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh dunia Romawi” atau “seluruh kekaisaran.” Istilah Yunani ini sering merujuk pada dunia yang berpenghuni sebagaimana dipahami dalam konteks Kekaisaran Romawi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: Pada masa itu
  rationale: Ungkapan ini secara alami membuka peristiwa baru dalam narasi. Bahasa Indonesia tidak memerlukan terjemahan harfiah Ἐγένετο ('terjadilah') maupun padanan tersendiri untuk δὲ; 'Pada masa itu' menyampaikan latar waktu dan peralihan narasi secara wajar.
- source_word: ἐξῆλθεν δόγμα
  choice: keluarlah suatu ketetapan
  rationale: '''Keluarlah'' mempertahankan gambaran bahwa perintah resmi itu dikeluarkan atau diumumkan, sedangkan ''ketetapan'' merupakan istilah formal yang jelas bagi δόγμα dalam konteks pemerintahan.'
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: dari Kaisar Agustus
  rationale: παρά dengan genetif menandai sumber atau asal ketetapan tersebut; 'dari' mencerminkan hubungan itu secara langsung dan alami.
- source_word: ἀπογράφεσθαι
  choice: didaftarkan
  rationale: Kata kerja ini menunjuk pada pencatatan resmi, sering berkaitan dengan sensus atau perpajakan. 'Didaftarkan' menjaga keluasan maknanya tanpa menambahkan tujuan yang tidak dinyatakan dalam ayat ini.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: seluruh dunia yang berpenghuni
  rationale: οἰκουμένη secara harfiah menunjuk pada dunia yang dihuni dan dalam konteks kekaisaran dapat merujuk pada dunia Romawi. Terjemahan utama mempertahankan cakupan ungkapan Yunani, sementara catatan kaki menjelaskan kemungkinan cakupan kontekstualnya.
theological_decisions:
- issue: Cakupan οἰκουμένη
  choice: seluruh dunia yang berpenghuni
  alternative: seluruh dunia Romawi; seluruh kekaisaran
  rationale: Ini terutama merupakan persoalan historis-leksikal. Teks utama mempertahankan keluasan ungkapan Yunani dan tidak diam-diam membatasinya pada wilayah politik tertentu; catatan kaki menyediakan pembacaan yang sesuai dengan konteks Kekaisaran Romawi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'keluarlah suatu ketetapan' mempertahankan nuansa naratif serta resmi tanpa terdengar terlalu teknis. Penanda catatan kaki ditempatkan sesudah kalimat yang diterangkannya.
