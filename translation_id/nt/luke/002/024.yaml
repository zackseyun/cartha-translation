  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: id
  text: 'dan untuk mempersembahkan kurban sesuai dengan apa yang telah dikatakan dalam Taurat Tuhan: “Sepasang burung tekukur atau dua ekor anak burung merpati.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan apa yang dikatakan dalam Taurat Tuhan.”
    reason: Alternatif ini menggunakan bentuk kini dalam bahasa Indonesia untuk mengungkapkan bahwa perkataan itu tetap tercantum dalam Taurat, sedangkan teks utama mencerminkan partisipel perfektif Yunani.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: untuk mempersembahkan kurban
  rationale: Infinitif berartikel menyatakan tujuan dalam konteks ini. Secara harfiah δίδωμι berarti ‘memberikan’, tetapi bersama θυσίαν ungkapan alami dan tepat dalam bahasa Indonesia ialah ‘mempersembahkan kurban’.
- source_word: κατὰ τὸ εἰρημένον
  choice: sesuai dengan apa yang telah difirmankan
  rationale: Partisipel perfektif pasif mempertahankan gagasan tentang sesuatu yang telah diucapkan dan tetap berlaku. ‘Difirmankan’ wajar karena yang dimaksud ialah perkataan ilahi dalam Kitab Suci, tanpa mempersempitnya menjadi sekadar ‘ditetapkan’.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: dalam Taurat Tuhan
  rationale: νόμος di sini menunjuk pada hukum Musa sebagai Kitab Suci; ‘Taurat’ merupakan padanan Indonesia yang jelas dan lazim dalam konteks ini. κύριος diterjemahkan ‘Tuhan’.
- source_word: ζεῦγος τρυγόνων
  choice: sepasang burung tekukur
  rationale: ζεῦγος berarti sepasang, sedangkan τρυγών secara khusus menunjuk pada burung tekukur, bukan merpati secara umum.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: dua ekor anak burung merpati
  rationale: νοσσός menunjuk pada burung muda dan περιστερά pada merpati. Kata penggolong ‘ekor’ menghasilkan bahasa Indonesia yang alami tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan κύριος dalam rumusan yang merujuk pada hukum ilahi
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος, sehingga ‘Tuhan’ mempertahankan bentuk Perjanjian Baru tanpa secara eksplisit menggantinya dengan bentuk ‘TUHAN’ yang biasanya mewakili nama ilahi Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Kurban’ dipilih sesuai ejaan baku untuk persembahan ritual. Ayat ini melanjutkan struktur tujuan dari konteks sebelumnya, sehingga diawali dengan ‘dan untuk’.
