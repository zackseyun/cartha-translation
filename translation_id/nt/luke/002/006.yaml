  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: id
  text: Ketika mereka berada di sana, genaplah waktunya bagi Maria untuk melahirkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “genaplah hari-harinya untuk melahirkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Ketika
  rationale: Ungkapan ini terutama menggerakkan alur narasi. Dalam bahasa Indonesia, hubungan naratifnya dapat dinyatakan secara alami melalui klausa waktu tanpa terjemahan kaku seperti 'terjadilah bahwa'.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: mereka berada di sana
  rationale: Konstruksi infinitif artikular dengan ἐν menyatakan waktu yang bersamaan; digabung dengan 'Ketika' menjadi ungkapan Indonesia yang wajar dan tepat.
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: genaplah waktunya
  rationale: Ungkapan ini menyampaikan bahwa masa kehamilan telah mencapai kepenuhannya. 'Genaplah waktunya' mempertahankan nuansa penggenapan sekaligus lebih alami daripada terjemahan harfiah 'hari-harinya dipenuhi'.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: bagi Maria untuk melahirkan
  rationale: Infinitif ini merujuk pada tibanya saat bagi perempuan tersebut untuk melahirkan. Nama 'Maria' dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Kemungkinan nuansa waktu yang ditetapkan atau dipenuhi dalam ἐπλήσθησαν αἱ ἡμέραι
  choice: genaplah waktunya
  alternative: tibalah waktunya
  rationale: Pilihan ini mempertahankan bahasa kepenuhan atau penggenapan dalam Lukas, tetapi tidak menambahkan pernyataan eksplisit tentang penetapan ilahi yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum sambil mempertahankan nuansa penggenapan pada verba Yunani.
