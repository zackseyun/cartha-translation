  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: id
  text: Dan Yesus terus bertumbuh dalam hikmat dan perawakan[a], serta makin berkenan kepada Allah dan manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “usia” atau “kedewasaan”; kata Yunani ἡλικία dapat menunjuk pada usia maupun perawakan tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: terus bertambah
  rationale: Bentuk imperfek menyatakan perkembangan yang berlangsung dari waktu ke waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pertumbuhan nyata.
- source_word: σοφίᾳ
  choice: hikmat
  rationale: Padanan baku bagi σοφία, yang di sini mencakup pengertian dan kemampuan menilai dengan tepat.
- source_word: ἡλικίᾳ
  choice: perawakan
  rationale: Ἡλικία dapat berarti usia atau tinggi/perawakan tubuh. Dalam rangkaian ini, 'perawakan' menyampaikan pertumbuhan jasmani, sementara ambiguitas leksikalnya dipertahankan dalam catatan kaki.
- source_word: χάριτι
  choice: makin disukai
  rationale: Dalam hubungan dengan Allah dan manusia, χάρις menunjuk pada perkenanan atau penerimaan, bukan terutama 'anugerah' sebagai istilah teologis abstrak. Bentuk ini juga selaras secara alami dengan verba perkembangan.
- source_word: παρὰ θεῷ
  choice: oleh Allah
  rationale: Παρά dengan datif di sini menyatakan kedudukan dalam pandangan atau hubungan dengan seseorang. Dengan 'disukai', konstruksi pasif 'oleh Allah' merupakan ungkapan Indonesia yang alami.
- source_word: ἀνθρώποις
  choice: manusia
  rationale: Bentuk jamak ἄνθρωποι merujuk pada umat manusia atau orang-orang secara umum, bukan hanya laki-laki. 'Manusia' akurat dan tidak menimbulkan pembatasan gender yang tidak ada dalam konteks.
theological_decisions:
- issue: Perkembangan manusiawi Yesus dan ketegangan kristologisnya
  choice: Ayat diterjemahkan secara lugas sebagai perkembangan nyata Yesus dalam hikmat, pertumbuhan jasmani, dan perkenanan.
  alternative: Mengaburkan atau memperlemah perkembangan Yesus demi menghindari ketegangan teologis.
  rationale: Teks Yunani dengan jelas menyatakan bahwa Yesus terus berkembang. Terjemahan tidak boleh menghapus pernyataan tentang kemanusiaan-Nya yang sejati atau menyelesaikan ketegangan teologis melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Terus bertambah' mempertahankan aspek duratif, sedangkan 'makin disukai' mengungkapkan perkembangan dalam perkenanan secara idiomatis. Penanda catatan kaki ditempatkan langsung setelah 'perawakan'.
