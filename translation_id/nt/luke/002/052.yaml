  - severity: low
    issue: “Terus bertambah dalam ... perawakan” agak kaku.
    rationale: Dalam penggunaan modern, seseorang lebih lazim “bertumbuh dalam hikmat dan perawakan”; ini menyampaikan kemajuan berkelanjutan tanpa mengubah makna.
