  source_fidelity: Draf secara umum mencerminkan aspek imperfek προέκοπτεν dan makna relasional χάρις; however, “makin disukai oleh Allah dan manusia” sedikit menggeser konstruksi Yunani “bertumbuh/progres dalam ... χάρις” menjadi ungkapan pasif tentang tindakan menyukai. Revisi mempertahankan perkembangan yang berkelanjutan dan hubungan perkenanan itu secara lebih langsung.
  naturalness: “Terus bertambah dalam ... perawakan” kurang luwes dalam bahasa Indonesia modern. “Terus bertumbuh dalam hikmat dan perawakan” lebih idiomatis. “Makin berkenan kepada Allah dan manusia” juga merupakan padanan Indonesia yang wajar untuk χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
  terminology: “Hikmat,” “perawakan,” “Allah,” dan “manusia” tepat untuk register Alkitab bahasa Indonesia. Karena ἡλικία dapat berarti usia maupun perawakan/statur, catatan kaki perlu tetap mempertahankan alternatif tersebut tanpa mengunci makna yang disengketakan.
  issues:
