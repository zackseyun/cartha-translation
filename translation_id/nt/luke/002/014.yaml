  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: id
  text: “Kemuliaan bagi Allah di tempat yang mahatinggi, dan damai di bumi di antara manusia yang dikenan-Nya.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di antara manusia yang mendapat perkenanan.” Perkenanan Allah tersirat dari konteks.'
    reason: lexical_alternative
  - marker: b
    text: 'Sejumlah naskah berbunyi: “dan damai di bumi, perkenanan bagi manusia.”'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Kemuliaan
  rationale: Dalam seruan ini, δόξα menyatakan kemuliaan yang ditujukan kepada Allah. “Kemuliaan” mempertahankan bobot liturgis dan teologisnya tanpa mempersempit makna menjadi hanya “pujian” atau “hormat”.
- source_word: ἐν ὑψίστοις
  choice: di tempat yang mahatinggi
  rationale: Ungkapan ini menunjuk pada alam surgawi yang tertinggi. Bentuk ini mempertahankan arti lokatif dan kontrasnya dengan “di bumi” serta tetap wajar dalam bahasa Indonesia yang khidmat.
- source_word: θεῷ
  choice: bagi Allah
  rationale: Datif Yunani menyatakan sasaran atau pihak yang menerima pengakuan kemuliaan. “Bagi Allah” merupakan ungkapan Indonesia yang alami dalam seruan ini.
- source_word: ἐπὶ γῆς
  choice: di bumi
  rationale: Padanan spasial yang langsung dan alami, sekaligus mempertahankan kontras dengan tempat yang mahatinggi.
- source_word: εἰρήνη
  choice: damai
  rationale: “Damai” mempertahankan cakupan luas istilah alkitabiah ini dan sesuai dengan bentuk seruan singkat dalam ayat.
- source_word: ἐν ἀνθρώποις
  choice: di antara manusia
  rationale: ἄνθρωποι di sini bersifat generik dan mencakup umat manusia. “Manusia” menyampaikan cakupan itu secara alami tanpa menambahkan pembedaan gender yang tidak dituntut oleh konteks.
- source_word: εὐδοκίας
  choice: yang dikenan-Nya
  rationale: Genitif εὐδοκίας menerangkan manusia sebagai orang yang menjadi sasaran perkenanan ilahi. Bentuk ini alami dalam bahasa Indonesia, sedangkan hubungan gramatikal dan kemungkinan padanan yang lebih harfiah dijelaskan dalam catatan.
theological_decisions:
- issue: Makna genitif εὐδοκίας dalam seruan para malaikat
  choice: Damai dinyatakan berada di antara manusia yang dikenan Allah.
  alternative: “Damai di antara manusia yang mendapat perkenanan” atau, berdasarkan varian nominatif εὐδοκία, “damai di bumi dan perkenanan bagi manusia.”
  rationale: Teks SBLGNT memakai bentuk genitif εὐδοκίας, yang paling wajar mengaitkan damai dengan manusia yang menjadi sasaran perkenanan. Terjemahan tidak mengembangkan hal ini menjadi sistem doktrinal tertentu, tetapi menyampaikan hubungan sintaksis teks. Varian nominatif yang berpengaruh dalam tradisi penerjemahan dicatat sebagai varian tekstual.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dipahami. Susunan paralel antara alam surgawi dan bumi dipertahankan. “Manusia” dipakai dalam arti generik dan inklusif, sesuai fungsi ἄνθρωποι dalam konteks ini.
