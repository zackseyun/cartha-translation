id: LUK.2.22
reference: Luke 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: id
  text: Ketika hari-hari pentahiran mereka menurut hukum Musa[a] telah genap, mereka membawa Dia naik ke Yerusalem untuk mempersembahkan-Nya kepada Tuhan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “pentahirannya” dan bukan “pentahiran mereka.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: telah genap
  rationale: Bentuk pasif ini secara idiomatis menyatakan bahwa suatu jangka waktu telah mencapai kepenuhannya; “telah genap” alami dalam konteks waktu dan mempertahankan nuansa tersebut.
- source_word: καθαρισμοῦ
  choice: pentahiran
  rationale: Dalam konteks hukum Musa sesudah persalinan, kata ini menunjuk pada penyucian ritual. “Pentahiran” mempertahankan corak keagamaan-hukum dengan jelas.
- source_word: αὐτῶν
  choice: mereka
  rationale: Teks Yunani SBLGNT memakai pronomina jamak αὐτῶν, sehingga bentuk jamak dipertahankan dalam teks utama dan varian tunggal dicatat dalam catatan kaki.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: menurut hukum Musa
  rationale: Ungkapan ini menyatakan kesesuaian dengan ketentuan hukum Musa; terjemahan ini ringkas, transparan, dan mempertahankan corak hukumnya.
- source_word: ἀνήγαγον
  choice: membawa Dia naik
  rationale: Kata kerja ini mengandung arah naik; terjemahan tersebut mempertahankan gambaran perjalanan naik menuju Yerusalem.
- source_word: Ἱεροσόλυμα
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: παραστῆσαι
  choice: untuk mempersembahkan-Nya
  rationale: Dalam konteks ibadah dan hukum ini, kata tersebut berarti menghadapkan atau menyerahkan seseorang secara resmi kepada Allah; “mempersembahkan” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: κυρίῳ
  choice: kepada Tuhan
  rationale: κύριος dalam konteks ini menunjuk kepada Allah; “Tuhan” adalah padanan baku dan penuh hormat dalam bahasa Indonesia.
theological_decisions:
- issue: Jumlah pronomina dalam frasa “hari-hari pentahiran mereka”
  choice: Mempertahankan bentuk jamak “mereka” dalam teks utama
  alternative: “pentahirannya” atau “pentahiran perempuan itu”
  rationale: Teks sumber yang diberikan berbunyi αὐτῶν, bentuk jamak. Meskipun latar Imamat dan sejumlah varian naskah mendukung bentuk tunggal feminin, ketegangan itu tidak diselesaikan diam-diam; bentuk jamak tetap berada dalam teks utama dan bentuk tunggal disebut dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “hari-hari ... telah genap” mempertahankan bentuk jamak dan nuansa waktu teks Yunani. Huruf kapital pada “Dia” dan akhiran “-Nya” mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
