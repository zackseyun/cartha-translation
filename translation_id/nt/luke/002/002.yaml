  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: id
  text: Pendaftaran ini pertama kali terjadi ketika Kirenius memerintah Siria.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pendaftaran ini terjadi sebelum Kirenius memerintah Siria.” Sebagian orang memahami kata yang diterjemahkan “pertama kali” di sini dalam arti perbandingan waktu.
    reason: alternative_reading
  - marker: b
    text: Atau, “sensus” sebagai ganti “pendaftaran”. Istilah Yunani ini menunjuk pada pencatatan resmi, yang sering berkaitan dengan perpajakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: ini
  rationale: Kata tunjuk ini merujuk pada pendaftaran yang baru disebutkan dalam ayat sebelumnya.
- source_word: ἀπογραφὴ
  choice: pendaftaran
  rationale: Istilah ini menunjuk pada pencatatan resmi, yang sering berkaitan dengan pajak atau pendataan penduduk; 'pendaftaran' mempertahankan cakupan administratifnya tanpa mempersempit makna.
- source_word: πρώτη
  choice: pertama kali
  rationale: Makna ordinal merupakan pengertian yang paling langsung. Bentuk 'pertama kali' alami dalam bahasa Indonesia, sedangkan kemungkinan makna temporal komparatif 'sebelum' dipertahankan dalam catatan kaki.
- source_word: ἐγένετο
  choice: berlangsung
  rationale: Padanan idiomatis bagi terjadinya suatu peristiwa administratif.
- source_word: ἡγεμονεύοντος
  choice: ketika ... memerintah
  rationale: Mencerminkan keadaan sezaman dalam konstruksi genitif absolut tanpa menetapkan gelar jabatan yang lebih khusus daripada yang dinyatakan verba Yunani.
- source_word: τῆς Συρίας
  choice: Siria
  rationale: Nama geografis baku dalam bahasa Indonesia untuk provinsi tersebut.
- source_word: Κυρηνίου
  choice: Kirenius
  rationale: Bentuk nama yang lazim dipakai dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penafsiran πρώτη dalam klausa yang diperdebatkan secara historis dan sintaksis
  choice: 'Menerjemahkan πρώτη dengan makna ordinal dalam teks utama: ''Pendaftaran ini pertama kali berlangsung ketika Kirenius memerintah Siria.'''
  alternative: Pendaftaran ini berlangsung sebelum Kirenius memerintah Siria.
  rationale: Makna biasa πρώτη adalah 'pertama'. Karena pemaknaan komparatif-temporal 'sebelum' juga diajukan oleh sebagian penafsir, kemungkinan itu dicatat tanpa dijadikan teks utama; dengan demikian ambiguitas dan ketegangan historis tidak dihapus secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan makna ordinal πρώτη dalam teks utama dan tidak memaksakan gelar resmi tertentu bagi Kirenius.
