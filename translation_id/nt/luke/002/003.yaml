  source_fidelity: 'Teks Indonesia menyampaikan semua unsur Yunani: πάντες sebagai “Semua orang,” ἐπορεύοντο sebagai “pergi,” infinitif ἀπογράφεσθαι dalam konteks pendaftaran resmi, serta penekanan distributif ἕκαστος εἰς τὴν ἑαυτοῦ πόλιν sebagai “masing-masing ke kotanya sendiri.” Bentuk lampau sederhana “pergi” tidak secara eksplisit menandai imperfek, tetapi merupakan pengungkapan naratif yang wajar dalam bahasa Indonesia dan tidak mengubah makna.'
