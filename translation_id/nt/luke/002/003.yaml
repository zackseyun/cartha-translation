id: LUK.2.3
reference: Luke 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: id
  text: Semua orang pun pergi untuk mendaftarkan diri[a], masing-masing ke kotanya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk didaftarkan.” Kata ini menunjuk pada pendaftaran resmi dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: pergi
  rationale: Bentuk imperfek menggambarkan gerak yang berlangsung dalam alur cerita. Dalam bahasa Indonesia, aspek tersebut cukup terbaca dari konteks naratif; bentuk "pergi" lebih alami daripada ungkapan progresif yang kaku.
- source_word: πάντες
  choice: semua orang
  rationale: Menyampaikan arti menyeluruh sekaligus distributif secara wajar dalam bahasa Indonesia.
- source_word: ἀπογράφεσθαι
  choice: untuk mendaftarkan diri
  rationale: Dalam konteks sensus, verba ini menunjuk pada pencatatan resmi. Bentuk medial "mendaftarkan diri" alami dan mempertahankan keterlibatan tiap orang, sedangkan "untuk didaftarkan" juga mungkin.
- source_word: ἕκαστος
  choice: masing-masing
  rationale: Mempertahankan penekanan distributif bahwa setiap orang pergi secara individual.
- source_word: ἑαυτοῦ
  choice: -nya sendiri
  rationale: Ungkapan refleksif posesif ini secara alami menyatakan "miliknya sendiri" dalam bahasa Indonesia tanpa memaksakan jenis kelamin yang tidak perlu dinyatakan secara gramatikal.
- source_word: πόλιν
  choice: kota
  rationale: Padanan langsung dan lazim bagi πόλις; "kota asal" akan menambahkan gagasan yang tidak dinyatakan secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Ungkapan distributif maskulin tunggal ἕκαστος ... ἑαυτοῦ
  choice: masing-masing ke kotanya sendiri
  alternative: setiap orang ke kotanya sendiri; masing-masing ke kotanya masing-masing
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin secara gramatikal. Bahasa Indonesia tidak menandai gender pada akhiran posesif "-nya", sehingga terjemahan ini mempertahankan jumlah distributif tanpa menyimpulkan bahwa yang dimaksud hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel “pun” membantu menghubungkan ayat ini dengan ketetapan pada ayat sebelumnya tanpa membuat kalimat terasa kaku.
