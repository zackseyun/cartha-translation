  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: id
  text: Roh Kudus telah menyatakan kepadanya bahwa ia tidak akan mati sebelum melihat Mesias Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih tradisional, “Kristus Tuhan.”
    reason: Mencatat padanan tradisional untuk Χριστός tanpa menggantikan pemaknaannya sebagai gelar mesianik dalam teks utama.
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: telah dinyatakan
  rationale: Bentuk pasif ini menunjuk pada komunikasi atau penyataan ilahi. “Telah dinyatakan” alami dalam bahasa Indonesia dan, bersama frasa “oleh Roh Kudus,” mempertahankan sumber ilahinya tanpa mempersempit makna menjadi peringatan.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: oleh Roh Kudus
  rationale: Ὑπό dengan genitif menandai pelaku personal; “oleh Roh Kudus” mencerminkan fungsi gramatikal tersebut secara langsung.
- source_word: μὴ ἰδεῖν θάνατον
  choice: tidak akan mati
  rationale: Ungkapan harfiah “tidak melihat kematian” berarti tidak mengalami kematian. Dalam bahasa Indonesia, “melihat kematian” mudah disalahpahami sebagai menyaksikan kematian orang lain, sehingga makna idiomatisnya disampaikan dengan “tidak akan mati.”
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: sebelum melihat
  rationale: Konstruksi ini menyatakan bahwa kematian tidak akan terjadi lebih dahulu daripada perjumpaan yang dijanjikan. “Sebelum melihat” menyampaikan urutan itu dengan ringkas dan alami.
- source_word: τὸν χριστὸν κυρίου
  choice: Mesias dari Tuhan
  rationale: Χριστός berfungsi sebagai gelar mesianik, sehingga diterjemahkan “Mesias.” Frasa “dari Tuhan” mempertahankan hubungan genitif dengan κυρίου tanpa menentukan secara berlebihan apakah nuansanya terutama kepunyaan, pengutusan, atau penetapan.
- source_word: κυρίου
  choice: Tuhan
  rationale: Κύριος diterjemahkan sebagai “Tuhan”; preposisi “dari” membuat hubungan genitifnya wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan Χριστός sebagai gelar mesianik
  choice: Mesias
  alternative: Kristus
  rationale: Dalam τὸν χριστὸν κυρίου, Χριστός berfungsi sebagai gelar, bukan sebagai sebutan yang telah menyerupai nama diri. “Mesias” mempertahankan latar pengharapan mesianik, sedangkan bentuk tradisional dengan “Kristus” dicatat dalam catatan kaki.
- issue: Hubungan genitif dalam τὸν χριστὸν κυρίου
  choice: Mesias dari Tuhan
  alternative: Mesias milik Tuhan; Mesias yang diutus Tuhan
  rationale: “Dari Tuhan” mempertahankan keluasan hubungan genitif. “Milik Tuhan” terlalu menonjolkan kepemilikan, sedangkan “yang diutus Tuhan” secara khusus menetapkan nuansa pengutusan yang tidak dinyatakan secara eksplisit oleh bentuk Yunani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif “Kepadanya telah dinyatakan” mempertahankan fokus sumber pada penerima penyataan. Idiom Yunani “melihat kematian” diterjemahkan menurut maknanya agar tidak menimbulkan salah pengertian dalam bahasa Indonesia.
