  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: id
  text: Para gembala itu kembali[a] sambil memuliakan dan memuji Allah karena[b] semua yang telah mereka dengar dan lihat, sebagaimana yang telah dikatakan kepada mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pergi kembali.”
    reason: lexical_alternative
  - marker: b
    text: Atau “atas semua yang telah mereka dengar dan lihat.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sebagaimana yang dikatakan kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: kembali
  rationale: Bentuk aoris ini menyatakan bahwa para gembala kembali ke tempat atau kegiatan mereka sebelumnya. “Kembali” alami dan tidak menentukan tujuan yang tidak disebutkan.
- source_word: οἱ ποιμένες
  choice: para gembala itu
  rationale: Merujuk kepada para gembala yang sudah diperkenalkan dalam konteks sebelumnya; “itu” secara alami mewakili fungsi artikel Yunani dalam konteks ini.
- source_word: δοξάζοντες
  choice: sambil memuliakan
  rationale: Partisipel kini menerangkan tindakan yang menyertai kepulangan mereka. “Memuliakan” mempertahankan makna memberi kemuliaan kepada Allah.
- source_word: αἰνοῦντες
  choice: dan memuji
  rationale: Dipertahankan sebagai tindakan tersendiri yang berdekatan maknanya dengan “memuliakan”, tanpa meleburkan kedua verba tersebut.
- source_word: τὸν θεὸν
  choice: Allah
  rationale: Objek langsung bagi “memuliakan” dan “memuji”; “Allah” merupakan padanan baku dan wajar dalam bahasa Indonesia.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: atas segala sesuatu yang
  rationale: ἐπί dengan datif menyatakan dasar atau alasan pujian. “Atas” mempertahankan keluwesan antara dasar dan sebab, sementara catatan kaki memberikan alternatif yang lebih eksplisit.
- source_word: ἤκουσαν καὶ εἶδον
  choice: telah mereka dengar dan lihat
  rationale: Bentuk aoris menyebut pengalaman yang mendahului kepulangan dan pujian mereka. “Telah” menyampaikan urutan naratif secara alami tanpa menambah isi.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: tepat seperti yang telah disampaikan kepada mereka
  rationale: “Tepat seperti” mempertahankan kesesuaian yang dinyatakan καθώς. Bentuk pasif dipertahankan dan pelakunya tidak disebutkan, sebagaimana dalam bahasa Yunani.
theological_decisions:
- issue: Apakah pelaku yang menyampaikan berita perlu disebutkan secara eksplisit
  choice: 'Mempertahankan bentuk pasif: “yang telah disampaikan kepada mereka”'
  alternative: “seperti yang telah disampaikan malaikat kepada mereka”
  rationale: Konteks menunjuk kepada berita malaikat, tetapi klausa Yunani ini tidak menyebut pelakunya. Terjemahan tidak menambahkan pelaku yang dibiarkan tersirat oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “sambil memuliakan dan memuji” menunjukkan tindakan yang berlangsung bersama kepulangan mereka, sedangkan bentuk pasif pada klausa terakhir menjaga ketidaktersuratan pelaku dalam teks sumber.
