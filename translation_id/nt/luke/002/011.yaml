  naturalness: Bahasanya jelas, modern, dan tetap bermartabat. “Bagi kalian” secara eksplisit mempertahankan bentuk jamak, sedangkan “Juruselamat,” “Mesias,” dan “Tuhan” cocok dengan register Alkitab bahasa Indonesia modern.
  terminology: “Juruselamat” tepat untuk σωτήρ; “Mesias” tepat untuk χριστός yang berfungsi sebagai gelar; dan “Tuhan” tepat untuk κύριος dalam konteks ini. Nama Daud ditransliterasikan secara konsisten. Catatan kaki menjelaskan bentuk padat χριστὸς κύριος dan menyebut alternatif penafsiran tanpa menjadikannya makna teks utama.
