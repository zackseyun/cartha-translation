  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: id
  text: Sebab hari ini telah lahir bagi kalian seorang Juruselamat di kota Daud, yaitu Mesias, Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, ungkapan Yunaninya sangat ringkas: “Mesias Tuhan.” Secara tradisional dapat diterjemahkan “Kristus, Tuhan”; ada juga yang memahaminya sebagai “Mesias milik Tuhan.”'
    reason: Menjelaskan susunan dua gelar yang ringkas dan mempertahankan kemungkinan penafsiran tanpa membebani teks utama.
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan berita sukacita pada ayat sebelumnya dan mempertahankan daya penjelas ungkapan Yunani.
- source_word: ἐτέχθη
  choice: telah lahir
  rationale: Bentuk pasif aoris dari τίκτω secara idiomatis menyatakan kelahiran yang sudah terjadi; dalam bahasa Indonesia, 'telah lahir' wajar untuk sebuah pengumuman.
- source_word: ὑμῖν
  choice: bagi kalian
  rationale: Datif jamak menyatakan manfaat bagi para pendengar. 'Bagi kalian' mempertahankan baik nuansa manfaat maupun bentuk jamaknya.
- source_word: σήμερον
  choice: hari ini
  rationale: Padanan temporal langsung dan alami dalam bahasa Indonesia modern.
- source_word: σωτὴρ
  choice: Juruselamat
  rationale: Padanan baku yang mencakup gagasan penyelamatan serta bobot mesianik dalam konteks ini.
- source_word: ὅς ἐστιν
  choice: yaitu
  rationale: Dalam bahasa Indonesia, 'yaitu' secara alami memperkenalkan identitas dan gelar Juruselamat tanpa menghasilkan klausa relatif yang kaku.
- source_word: χριστὸς
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, bukan nama diri, dan menunjuk pada raja yang diurapi dalam pengharapan keturunan Daud.
- source_word: κύριος
  choice: Tuhan
  rationale: Mempertahankan gelar otoritatif dan bobot teologis κύριος; 'Tuan' terlalu lemah dalam konteks kristologis ini.
- source_word: ἐν πόλει Δαυίδ
  choice: di kota Daud
  rationale: Padanan langsung yang mempertahankan hubungan dengan Daud dan rujukan kontekstual kepada Betlehem.
theological_decisions:
- issue: Hubungan gelar χριστὸς κύριος
  choice: Mesias, Tuhan
  alternative: Kristus, Tuhan; Mesias milik Tuhan
  rationale: Kedua kata Yunani berbentuk nominatif dan paling wajar dibaca sebagai dua gelar yang menerangkan Juruselamat. Koma membantu pembaca Indonesia melihat keduanya sebagai gelar tanpa menyamarkan bahwa susunan Yunani sangat ringkas. Alternatif 'Mesias milik Tuhan' mungkin secara interpretatif, tetapi kurang langsung dari bentuk teks.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. 'Kalian' dipakai untuk menampilkan bentuk jamak ὑμῖν secara eksplisit; 'yaitu' menghindari ungkapan kaku 'yang adalah'.
