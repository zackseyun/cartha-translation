id: LUK.2.37
reference: Luke 2:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: id
  text: dan kemudian hidup sebagai janda sampai berumur delapan puluh empat tahun.[a] Ia tidak pernah meninggalkan kompleks Bait Allah[b] dan beribadah dengan berpuasa serta memanjatkan doa-doa permohonan[c] siang dan malam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan telah menjanda selama delapan puluh empat tahun.” Bahasa Yunani dapat dipahami sebagai menyatakan usia Hana atau lamanya ia menjanda.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani di sini menunjuk seluruh kompleks atau kawasan Bait Allah, bukan khususnya ruang kudus bagian dalam.
    reason: cultural_note
  - marker: c
    text: Secara lebih umum dapat diterjemahkan “doa-doa”; kata Yunaninya secara khusus dapat menyiratkan permohonan atau permintaan yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: janda
  rationale: Padanan baku bagi perempuan yang suaminya telah meninggal; dalam konteks ini melanjutkan keterangan tentang keadaan Hana setelah tujuh tahun menikah.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: sampai berumur delapan puluh empat tahun
  rationale: Ungkapan Yunani ini ringkas dan dapat menyatakan usia Hana atau lamanya ia menjanda. Teks utama memilih usia karena paling alami dalam bahasa Indonesia, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: tidak pernah meninggalkan kompleks Bait Allah
  rationale: Bentuk imperfek menunjukkan kebiasaan yang berlangsung. 'Tidak pernah meninggalkan' menyampaikan makna idiomatis, bukan keharusan bahwa ia secara harfiah berada di sana setiap saat.
- source_word: ἱεροῦ
  choice: kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kawasan atau kompleks Bait Allah, bukan ruang kudus bagian dalam; padanan ini menjaga ketepatan budaya dan leksikal.
- source_word: νηστείαις
  choice: dengan berpuasa
  rationale: Datif jamak menunjukkan cara yang menyertai ibadahnya dan menyiratkan praktik puasa yang dilakukan berulang kali; bahasa Indonesia lebih alami memakai bentuk verbal tunggal kolektif.
- source_word: δεήσεσιν
  choice: memanjatkan doa-doa permohonan
  rationale: δέησις menekankan permohonan atau permintaan yang sungguh-sungguh. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa serta bentuk jamaknya.
- source_word: λατρεύουσα
  choice: beribadah
  rationale: Partisip ini menggambarkan pelayanan religius Hana kepada Allah. 'Beribadah' jelas, wajar, dan tidak terlalu teknis.
- source_word: νύκτα καὶ ἡμέραν
  choice: siang dan malam
  rationale: Ungkapan idiomatis Indonesia yang alami untuk pengabdian terus-menerus; perubahan urutan tidak mengubah makna.
theological_decisions:
- issue: Apakah frasa tersebut menyatakan usia Hana atau lamanya ia menjanda
  choice: Teks utama menyatakan bahwa Hana berumur delapan puluh empat tahun.
  alternative: Frasa itu dapat berarti bahwa Hana telah menjanda selama delapan puluh empat tahun.
  rationale: Sintaksis Yunani memungkinkan kedua pemahaman. Karena ini merupakan ambiguitas eksegetis yang nyata, bacaan alternatif dicantumkan dalam catatan kaki dan tidak dihapus secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kalimat dibuka dengan huruf kecil karena ayat ini meneruskan struktur kalimat dari ayat sebelumnya. 'Kompleks Bait Allah' dipilih demi membedakan ἱερόν dari ruang kudus bagian dalam. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
