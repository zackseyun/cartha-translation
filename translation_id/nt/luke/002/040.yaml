  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: id
  text: Anak itu bertumbuh dan menjadi kuat, dipenuhi dengan hikmat[a], dan perkenanan Allah[b] ada pada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah kuno tidak memuat “dipenuhi dengan hikmat.”
    reason: textual_variant
  - marker: b
    text: Atau, “kasih karunia Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: Anak itu
  rationale: παιδίον menunjuk kepada seorang anak; dalam konteks sesudah masa bayi Yesus, “Anak itu” alami dan tepat. δέ berfungsi sebagai penghubung ringan dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia.
- source_word: ηὔξανεν
  choice: bertumbuh
  rationale: Bentuk imperfek menggambarkan pertumbuhan yang berlangsung. “Bertumbuh” menyampaikan perkembangan jasmani secara wajar dalam narasi Indonesia.
- source_word: ἐκραταιοῦτο
  choice: menjadi kuat
  rationale: Bentuk imperfek medio-pasif menyatakan proses penguatan yang berkelanjutan. “Menjadi kuat” mempertahankan nuansa perkembangan itu.
- source_word: πληρούμενον σοφίᾳ
  choice: dipenuhi dengan hikmat
  rationale: Partisipel kini menerangkan keadaan atau proses yang menyertai pertumbuhan Anak itu; σοφίᾳ menyatakan isi, yakni hikmat. Bentuk pasif “dipenuhi” mempertahankan bentuk ungkapan Yunani tanpa menentukan pelaku secara eksplisit.
- source_word: χάρις θεοῦ
  choice: perkenanan Allah
  rationale: χάρις di sini dapat berarti perkenanan, kemurahan, atau kasih karunia. Dalam gambaran naratif tentang keadaan Anak itu di hadapan Allah, “perkenanan Allah” jelas dan alami; alternatif tradisional “kasih karunia Allah” dicatat dalam catatan kaki.
- source_word: ἦν ἐπ’ αὐτό
  choice: ada pada-Nya
  rationale: Ungkapan ini menyatakan bahwa perkenanan Allah menyertai atau menaungi Dia. “Ada pada-Nya” cukup dekat dengan susunan sumber sekaligus tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna χάρις θεοῦ dalam konteks pertumbuhan Kristus
  choice: perkenanan Allah
  alternative: kasih karunia Allah
  rationale: “Perkenanan” menyampaikan sikap baik dan kehadiran Allah terhadap Anak itu tanpa menambahkan gagasan bahwa Ia sebelumnya kekurangan rahmat. Namun, karena χάρις juga lazim diterjemahkan “kasih karunia,” alternatif tersebut dipertahankan dalam catatan kaki agar keluasan makna sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hormat. Kapitalisasi “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Yesus, tanpa mengubah kandungan sintaksis ayat.
