id: LUK.2.25
reference: Luke 2:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: id
  text: Lihatlah, di Yerusalem ada seorang bernama Simeon. Orang ini benar dan saleh. Ia menantikan penghiburan bagi Israel[a], dan Roh Kudus ada padanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghiburan Israel.” Ungkapan ini menunjuk pada penghiburan dan pemulihan dari Allah yang diharapkan Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara gramatikal, mungkin juga diterjemahkan “suatu roh kudus ada padanya,” tetapi dalam konteks tulisan Lukas ungkapan ini paling wajar mengacu kepada Roh Kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang memperkenalkan Simeon secara hidup dan menandai pentingnya adegan ini.
- source_word: ἄνθρωπος
  choice: seorang
  rationale: Dalam ungkapan Indonesia “ada seorang bernama Simeon,” jenis kelamin sudah jelas dari nama dan konteks; bentuk ini lebih alami daripada mengulang “seorang laki-laki” tanpa kehilangan acuannya.
- source_word: ᾧ ὄνομα Συμεών
  choice: bernama Simeon
  rationale: Mengungkapkan konstruksi identifikasi Yunani secara ringkas dan alami dalam bahasa Indonesia.
- source_word: δίκαιος
  choice: benar
  rationale: Mempertahankan makna moral dan relasional-perjanjian dari sifat Simeon, bukan hanya arti yuridis yang mungkin tersirat dalam “adil.”
- source_word: εὐλαβής
  choice: saleh
  rationale: Secara alami menggambarkan orang yang hormat kepada Allah dan tekun menjalankan kesalehan.
- source_word: προσδεχόμενος
  choice: menantikan
  rationale: Menyampaikan sikap menunggu dengan penuh pengharapan yang berlangsung terus.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: penghiburan bagi Israel
  rationale: Menjaga gema pengharapan alkitabiah akan tindakan Allah yang menghibur dan memulihkan Israel. “Bagi” memperjelas bahwa Israellah penerima penghiburan tanpa menutup keluasan ungkapan sumber.
- source_word: πνεῦμα ἅγιον
  choice: Roh Kudus
  rationale: Walaupun tanpa artikel dalam bahasa Yunani, pemakaian Lukas dan konteks langsung paling wajar menunjuk kepada Roh Kudus.
- source_word: ἐπ’ αὐτόν
  choice: ada padanya
  rationale: Mempertahankan idiom kehadiran Roh pada Simeon tanpa memperinci cara kerja Roh lebih jauh daripada teks sumber.
theological_decisions:
- issue: Acuan πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: Roh Kudus ada padanya
  alternative: suatu roh kudus ada padanya
  rationale: Dalam pemakaian Lukas dan konteks ayat 26–27, ungkapan ini paling alami mengacu kepada Roh Kudus. Namun, kemungkinan gramatikal dari bentuk tanpa artikel dicatat agar ambiguitas sumber tidak disembunyikan.
- issue: Makna παράκλησις bagi Israel
  choice: penghiburan bagi Israel
  alternative: penghiburan Israel
  rationale: Ungkapan menunjuk pada penghiburan dan pemulihan ilahi yang diharapkan Israel. Terjemahan tidak membatasi pengharapan itu pada satu aspek politik, rohani, atau eskatologis saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Lihatlah” mempertahankan penekanan pengantar Lukas; kalimat Yunani yang panjang dibagi agar mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan pada frasa yang benar.
