id: LUK.2.7
reference: Luke 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: id
  text: Ia melahirkan anak laki-lakinya yang sulung, lalu membungkusnya dengan kain lampin[a] dan membaringkannya di tempat makan ternak[b], sebab tidak ada tempat bagi mereka di kamar tamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "membalutnya dengan kain bedung."
    reason: lexical_alternative
  - marker: b
    text: Atau "palungan"; kata Yunani ini menunjuk tempat atau wadah makanan bagi ternak.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional diterjemahkan "penginapan." Kata Yunani κατάλυμα dapat berarti kamar tamu atau tempat menginap. Dalam Lukas 10:34, Lukas memakai kata Yunani lain untuk penginapan komersial.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: melahirkan
  rationale: Padanan idiomatis dan langsung dalam bahasa Indonesia modern untuk tindakan melahirkan.
- source_word: τὸν υἱὸν αὐτῆς τὸν πρωτότοκον
  choice: anak laki-lakinya yang sulung
  rationale: Menyatakan bahwa anak itu laki-laki dan merupakan anak sulungnya, tanpa menambahkan kesimpulan teologis di luar narasi.
- source_word: ἐσπαργάνωσεν
  choice: membungkusnya dengan kain lampin
  rationale: Mengungkapkan tindakan membalut bayi dengan kain; 'kain lampin' tetap ringkas, jelas dalam konteks, dan sesuai dengan latar kuno.
- source_word: ἀνέκλινεν
  choice: membaringkannya
  rationale: Dalam konteks bayi, bentuk ini lebih alami daripada padanan harfiah yang berarti menyandarkan atau merebahkan.
- source_word: φάτνῃ
  choice: tempat makan ternak
  rationale: Menjelaskan secara transparan bahwa yang dimaksud ialah tempat hewan diberi makan, sedangkan istilah tradisional 'palungan' dicantumkan dalam catatan kaki.
- source_word: τόπος
  choice: tempat
  rationale: Mempertahankan arti luas τόπος sebagai tempat atau ruang yang tersedia.
- source_word: καταλύματι
  choice: kamar tamu
  rationale: Dalam pemakaian Lukas, κατάλυμα dapat menunjuk ruang bagi tamu; pilihan ini tidak memasukkan gambaran penginapan komersial yang tidak diwajibkan oleh teks Yunani.
theological_decisions:
- issue: Apakah κατάλυμα menunjuk penginapan komersial atau ruang bagi tamu
  choice: kamar tamu
  alternative: penginapan; tempat menginap
  rationale: Kata Yunani ini tidak mengharuskan arti penginapan komersial. Lukas memakai κατάλυμα untuk ruang tamu dalam Lukas 22:11, sedangkan dalam Lukas 10:34 ia memakai πανδοχεῖον untuk penginapan. Catatan kaki mempertahankan kemungkinan makna yang lebih luas.
- issue: Makna πρωτότοκον dalam narasi ini
  choice: yang sulung
  alternative: yang pertama lahir
  rationale: Terjemahan menyatakan urutan kelahiran sebagaimana dikatakan teks tanpa menyimpulkan dari kata itu apakah Maria kemudian mempunyai anak lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk enklitik -nya dipakai untuk alur narasi yang alami. 'Tempat makan ternak' dipilih demi kejelasan bagi pembaca umum, sedangkan istilah tradisional dipertahankan dalam catatan kaki. 'Kamar tamu' di sini berarti kamar yang disediakan bagi tamu, bukan ruang duduk.
