id: LUK.2.29
reference: Luke 2:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: id
  text: Sekarang Engkau membiarkan hamba-Mu[a] pergi[b], ya Penguasa, sesuai dengan firman-Mu, dalam damai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “hamba” juga dapat berarti “budak”; sapaan “Penguasa” menegaskan hubungan ketundukan dan kepemilikan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melepaskan” atau “membiarkan pergi.” Dalam konteks ini, Simeon menyatakan bahwa ia siap meninggalkan hidup ini dalam damai.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Sekarang
  rationale: Menandai saat terpenuhinya pengharapan Simeon secara langsung dan alami.
- source_word: ἀπολύεις
  choice: membiarkan ... pergi
  rationale: Mengungkapkan tindakan melepas atau mengizinkan pergi dengan bahasa Indonesia yang alami, tanpa menyatakan kematian secara eksplisit.
- source_word: τὸν δοῦλόν σου
  choice: hamba-Mu
  rationale: Dalam bahasa Indonesia, “hamba” mempertahankan kedudukan tunduk dan terikat kepada seorang penguasa, sekaligus sesuai dengan ragam doa yang bermartabat. Catatan kaki mempertahankan kemungkinan arti “budak” yang lebih tegas.
- source_word: δέσποτα
  choice: ya Penguasa
  rationale: Menyatakan otoritas dan kepemilikan yang terkandung dalam δεσπότης serta mempertahankan kaitannya dengan δοῦλος, tanpa menambahkan sebutan ilahi yang tidak dinyatakan dalam teks Yunani.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: sesuai dengan firman-Mu
  rationale: Menyatakan kesesuaian dengan perkataan atau janji Allah; “firman” alami dalam konteks ini dan mempertahankan bobot perkataan ilahi.
- source_word: ἐν εἰρήνῃ
  choice: dalam damai
  rationale: Mempertahankan bentuk ungkapan Yunani dan gema biblis tentang kepergian dalam keadaan damai.
theological_decisions:
- issue: Apakah perkataan Simeon harus diterjemahkan sebagai rujukan eksplisit kepada kematian
  choice: Mempertahankan gambaran tentang diizinkan pergi tanpa menyebut kematian secara eksplisit
  alternative: Sekarang Engkau membiarkan hamba-Mu meninggal dalam damai
  rationale: Konteks mengisyaratkan bahwa Simeon siap meninggalkan hidup ini, tetapi ἀπολύω sendiri berarti melepaskan, membebaskan, atau membiarkan pergi. Terjemahan utama mempertahankan ketegangan dan bahasa kiasannya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan luas dalam teks religius Indonesia. Susunan sapaan “ya Penguasa” dipertahankan agar relasi dengan “hamba-Mu” tetap jelas.
