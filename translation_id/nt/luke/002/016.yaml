  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: id
  text: Mereka pun datang dengan tergesa-gesa dan menemukan Maria dan Yusuf, serta bayi itu yang terbaring di dalam palungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat makan ternak.” Kata Yunani φάτνη dapat merujuk pada palungan atau tempat makan ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: datang
  rationale: Bentuk aoris dari ἔρχομαι menggambarkan kedatangan para gembala ke tempat yang telah diberitahukan kepada mereka; 'datang' mempertahankan sudut pandang narasi Yunani.
- source_word: σπεύσαντες
  choice: dengan tergesa-gesa
  rationale: Partisipel ini menerangkan cara mereka datang dan menyampaikan unsur kesegeraan serta kesungguhan tanpa mengubahnya menjadi tindakan utama yang terpisah.
- source_word: ἀνεῦραν
  choice: menemukan
  rationale: Kata ini menunjuk pada keberhasilan menemukan sesuatu setelah dicari; 'menemukan' wajar dalam narasi Indonesia dan membiarkan konteks menyiratkan pencarian tersebut.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Maria dan Yusuf
  rationale: Nama-nama pribadi digunakan dalam bentuk Indonesia yang lazim; τε dan καί diwujudkan melalui koordinasi alami.
- source_word: τὸ βρέφος
  choice: bayi itu
  rationale: βρέφος berarti anak yang masih sangat kecil dan, dalam konteks kelahiran ini, paling tepat serta alami diterjemahkan 'bayi itu'.
- source_word: κείμενον
  choice: yang terbaring
  rationale: Partisipel κεῖμαι menyatakan keadaan atau posisi bayi, bukan tindakan seseorang membaringkannya; 'terbaring' mempertahankan makna statif itu.
- source_word: ἐν τῇ φάτνῃ
  choice: di dalam palungan
  rationale: φάτνη menunjuk pada palungan atau tempat makan ternak. 'Palungan' merupakan padanan ringkas, tepat, dan bermartabat dalam konteks kelahiran Yesus.
- source_word: καὶ ... καὶ ... καὶ
  choice: pun ... dan ... serta
  rationale: Rangkaian koordinatif Yunani disampaikan dengan penghubung Indonesia yang alami. 'Pun' meneruskan alur narasi, sedangkan 'dan' serta 'serta' menjaga hubungan tambahan antartokoh tanpa menghasilkan susunan yang kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Ungkapan 'dengan tergesa-gesa' mempertahankan urgensi teks, sedangkan 'palungan' mempertahankan istilah tradisional yang tetap dapat dipahami; alternatif yang lebih eksplisit diberikan dalam catatan kaki.
