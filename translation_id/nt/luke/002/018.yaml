  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: id
  text: Dan semua orang yang mendengarnya merasa takjub atas apa yang disampaikan kepada mereka oleh para gembala itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “heran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan fungsi penghubung sederhana καί dalam alur narasi Lukas.
- source_word: πάντες οἱ ἀκούσαντες
  choice: semua orang yang mendengarnya
  rationale: Partisip aoris berartikel berfungsi substantival, yaitu semua orang yang mendengar. Akhiran -nya memasok objek yang dipahami dari konteks, yakni laporan para gembala, dan menghasilkan bahasa Indonesia yang alami.
- source_word: ἐθαύμασαν
  choice: merasa takjub
  rationale: Menyatakan reaksi heran atau kagum yang kuat tanpa menentukan apakah reaksi itu merupakan iman atau ketidakpercayaan.
- source_word: περὶ τῶν λαληθέντων
  choice: atas apa yang disampaikan
  rationale: περί dengan genitif menunjukkan hal yang menjadi pokok reaksi, sedangkan partisip pasif λαληθέντων menunjuk pada isi yang diucapkan atau disampaikan. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: ὑπὸ τῶν ποιμένων
  choice: oleh para gembala itu
  rationale: ὑπό dengan genitif menandai pelaku dalam konstruksi pasif. Kata 'itu' mengacu secara alami kepada para gembala yang telah disebut dalam konteks.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: πρός dengan akusatif menunjukkan arah perkataan kepada orang-orang yang mendengar; terjemahan ini mempertahankan rujukan pronominal tanpa mempersempit identitas mereka.
theological_decisions:
- issue: Sifat tanggapan yang dinyatakan oleh ἐθαύμασαν
  choice: Ayat ini melaporkan ketakjuban tanpa menyatakan bahwa para pendengar beriman atau tidak percaya.
  alternative: Menafsirkan ketakjuban itu sebagai iman yang menyelamatkan atau sekadar rasa ingin tahu.
  rationale: Kata kerja θαυμάζω hanya menyatakan reaksi keheranan atau ketakjuban. Teks tidak menjelaskan hasil rohaninya, sehingga keterbukaan naratif itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan pasif dipertahankan untuk mencerminkan sumber, tetapi dirumuskan secara alami bagi pembaca umum.
