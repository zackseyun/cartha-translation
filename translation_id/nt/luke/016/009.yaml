id: LUK.16.9
reference: Luke 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: id
  text: 'Dan Aku berkata kepadamu: Ikatlah persahabatan bagi dirimu dengan menggunakan kekayaan yang tidak benar[a], supaya ketika kekayaan itu habis[b], mereka menyambut kamu ke dalam tempat-tempat kediaman yang kekal[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari Mamon ketidakbenaran.” “Mamon” adalah sebutan tradisional untuk kekayaan atau uang.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga dipahami, “ketika kamu meninggal,” atau “ketika kekayaan itu lenyap.” Kata kerja Yunani tidak menyatakan subjeknya secara eksplisit.
    reason: alternative_reading
  - marker: c
    text: Atau “ke dalam kemah-kemah yang kekal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: Carilah sahabat bagi dirimu
  rationale: Ungkapan ini menyampaikan perintah untuk menjadikan orang lain sahabat bagi kepentingan diri sendiri dalam bahasa Indonesia yang alami, tanpa mengubah daya imperatif teks Yunani.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: dengan menggunakan kekayaan yang tidak benar
  rationale: Frasa instrumental ἐκ diterjemahkan secara kontekstual sebagai sarana. 'Kekayaan' menjelaskan μαμωνᾶς bagi pembaca modern, sedangkan 'yang tidak benar' mempertahankan keluasan ἀδικία dan tidak membatasinya hanya pada harta hasil penipuan.
- source_word: μαμωνᾶ
  choice: kekayaan
  rationale: '''Kekayaan'' lebih jelas dalam bahasa Indonesia modern daripada transliterasi tradisional ''Mamon'', tanpa memaksakan personifikasi.'
- source_word: τῆς ἀδικίας
  choice: yang tidak benar
  rationale: Pilihan ini mempertahankan nuansa ketidakbenaran atau ketidakadilan tanpa menyempitkannya menjadi semata-mata 'hasil kejahatan' atau 'hasil kecurangan'.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: supaya ketika kekayaan itu habis
  rationale: Subjek tersirat paling wajar merujuk kepada kekayaan yang baru disebut. 'Habis' mengungkapkan makna berhenti tersedia atau lenyap, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: δέξωνται ὑμᾶς
  choice: mereka menyambut kamu
  rationale: '''Menyambut'' mengungkapkan penerimaan dengan nuansa keramahtamahan yang sesuai dengan masuk ke suatu tempat kediaman. Identitas ''mereka'' tetap tidak dijelaskan sebagaimana dalam teks Yunani.'
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: ke dalam tempat-tempat kediaman yang kekal
  rationale: '''Tempat-tempat kediaman'' menyampaikan fungsi idiomatis σκηναί secara alami; gambaran harfiah ''kemah-kemah'' dipertahankan dalam catatan kaki. Bentuk jamak tetap dipertahankan.'
theological_decisions:
- issue: Makna 'kekayaan yang tidak benar'
  choice: Kekayaan duniawi yang terkait dengan tatanan yang tidak benar, tanpa menyatakan bahwa semuanya pasti diperoleh secara curang
  alternative: Kekayaan hasil kecurangan; atau Mamon yang dipersonifikasikan sebagai tuan saingan
  rationale: Teks tidak perlu dipersempit hanya kepada uang curian atau hasil penipuan, dan dalam ayat ini personifikasi Mamon tidak perlu dipaksakan. Terjemahan mempertahankan ketegangan ungkapan sumber.
- issue: Subjek ἐκλίπῃ
  choice: Kekayaan itu habis
  alternative: Kamu gagal atau meninggal; atau sumber daya duniawi pada umumnya habis
  rationale: μαμωνᾶς merupakan rujukan terdekat dan paling wajar, tetapi kata kerja Yunani tidak menyebutkan subjek secara eksplisit; karena itu, bacaan alternatif dicatat.
- issue: Identitas 'mereka' dalam δέξωνται
  choice: Dibiarkan tersirat
  alternative: Para sahabat yang diperoleh; orang miskin atau umat Allah; makhluk surgawi
  rationale: Teks Yunani tidak mengidentifikasi subjek jamak tersebut. Menentukannya di dalam teks utama akan menyelesaikan ambiguitas yang sengaja dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti ilahi 'Aku' memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia; 'kamu' mempertahankan sapaan jamak tanpa bentuk yang kaku. Semua penanda catatan kaki ditempatkan langsung pada frasa terkait.
