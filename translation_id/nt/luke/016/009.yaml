  naturalness: Teks revisi memakai bahasa Indonesia baku modern yang lancar. “Ikatlah persahabatan” adalah ungkapan yang alami untuk tindakan membangun/membuat sahabat; “ketika kamu meninggal” lebih jelas daripada “ketika kamu gagal” dalam catatan kaki.
  terminology: “Kekayaan yang tidak benar” secara wajar mempertahankan keluasan μαμωνᾶς τῆς ἀδικίας tanpa membatasi maknanya pada kekayaan hasil kecurangan. “Kediaman-kediaman yang kekal” mempertahankan bentuk jamak σκηνάς, dan catatan kaki memelihara citra harfiah “kemah-kemah.”
