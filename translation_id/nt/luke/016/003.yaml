reference: Luke 16:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: id
  text: Lalu pengelola itu berkata dalam hatinya, “Apa yang akan kulakukan? Tuanku sedang mengambil tugas pengelolaan itu dariku. Aku tidak kuat menggali, dan aku malu mengemis.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκονόμος
  choice: pengelola
  rationale: Dalam konteks perumpamaan ini, istilah tersebut menunjuk kepada orang yang dipercayakan mengurus harta atau urusan milik orang lain. 'Pengelola' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἐν ἑαυτῷ
  choice: dalam hatinya
  rationale: Ungkapan ini menandakan perkataan batin atau perenungan; 'berkata dalam hatinya' merupakan ungkapan Indonesia yang alami.
- source_word: Τί ποιήσω
  choice: Apa yang harus kulakukan?
  rationale: Subjungtif deliberatif menyatakan pertanyaan kepada diri sendiri mengenai tindakan yang akan diambil; 'harus' menyampaikan nuansa kebingungan praktis tanpa menetapkan kewajiban moral.
- source_word: κύριός μου
  choice: tuanku
  rationale: Di sini κύριος menunjuk kepada atasan manusia dalam perumpamaan, bukan gelar ilahi. 'Tuanku' mempertahankan hubungan kewenangan dan bentuk posesif.
- source_word: ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ
  choice: akan mencopot aku dari jabatan pengelola
  rationale: Ungkapan ini menyampaikan bahwa tanggung jawab atau jabatan pengelolaan sedang atau segera diambil darinya. Bentuk Indonesia ini alami serta mempertahankan hubungan kata serumpun dengan 'pengelola' secara semantis.
- source_word: σκάπτειν
  choice: mencangkul
  rationale: Verba ini berarti menggali; dalam konteks pekerjaan kasar untuk mencari nafkah, 'mencangkul' lebih alami dan konkret dalam bahasa Indonesia daripada 'menggali', tanpa mengubah inti gambaran.
- source_word: οὐκ ἰσχύω
  choice: aku tidak kuat
  rationale: Bersama pekerjaan mencangkul, ἰσχύω terutama menyoroti kekuatan fisik.
- source_word: ἐπαιτεῖν
  choice: mengemis
  rationale: Kata ini berarti meminta-minta atau meminta sedekah; 'mengemis' adalah padanan Indonesia yang langsung dan lazim.
- source_word: αἰσχύνομαι
  choice: aku malu
  rationale: Padanan ini menyampaikan rasa malu terhadap kemungkinan mengemis secara lugas dan alami.
theological_decisions:
- issue: Penerjemahan κύριος dalam konteks perumpamaan yang tidak menunjuk kepada Allah
  choice: tuanku
  alternative: Tuhan; majikanku; pemilikku
  rationale: Rujukannya adalah orang kaya yang menjadi atasan pengelola. 'Tuanku' mempertahankan kewenangan sosial tanpa memberi kesan bahwa tokoh itu secara langsung disebut dengan gelar ilahi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk persona pertama terikat ('kulakukan') serta 'aku' cocok untuk monolog langsung. Tidak diperlukan catatan kaki karena pilihan leksikal utama dapat disampaikan secara memadai dalam teks.
