- from: Lalu pengelola itu berkata dalam hatinya, “Apa yang harus kulakukan? Tuanku akan mencopot aku dari jabatan pengelola. Aku tidak kuat mencangkul, dan aku malu mengemis.”
  to: Lalu pengelola itu berkata dalam hatinya, “Apa yang akan kulakukan? Tuanku sedang mengambil tugas pengelolaan itu dariku. Aku tidak kuat menggali, dan aku malu mengemis.”
  rationale: Revisi memulihkan aspek kini dan objek «tugas pengelolaan» yang diambil dari sang pengelola, memilih padanan umum untuk kegiatan menggali, dan menyampaikan pertanyaan deliberatif tanpa menambahkan nuansa kewajiban. Tidak diperlukan catatan kaki, karena permainan kata yang cukup dekat antara pengelola dan pengelolaan dapat dipertahankan langsung dalam teks Indonesia.
