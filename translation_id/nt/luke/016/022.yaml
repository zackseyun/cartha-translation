id: LUK.16.22
reference: Luke 16:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: id
  text: Lalu orang miskin itu meninggal dan dibawa oleh para malaikat ke pangkuan Abraham[a]. Orang kaya itu juga meninggal dan dikuburkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke sisi Abraham.” Ungkapan Yunani secara harfiah adalah “ke pangkuan Abraham,” suatu gambaran tentang kedekatan, kehormatan, dan persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: Lalu ... meninggal
  rationale: Rumus naratif ἐγένετο dengan infinitif diungkapkan secara wajar dalam bahasa Indonesia sebagai peristiwa langsung; “lalu” menyampaikan peralihan naratif ringan dari δέ tanpa menambahkan penanda waktu yang tegas.
- source_word: τὸν πτωχὸν
  choice: orang miskin itu
  rationale: πτωχός menunjuk kepada orang yang miskin atau melarat. Pilihan ini langsung dan tidak memasukkan keterangan “pengemis” yang tidak dinyatakan dalam klausa ini.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: dibawa oleh para malaikat
  rationale: Bentuk pasif dan pelaku tindakannya dipertahankan. “Para malaikat” secara alami mencerminkan nomina Yunani yang memakai artikel.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: ke pangkuan Abraham
  rationale: κόλπος dapat merujuk pada dada atau pangkuan dan secara kiasan menggambarkan tempat yang dekat serta terhormat. “Pangkuan Abraham” mempertahankan citra sumber, sedangkan ungkapan yang lebih idiomatis dijelaskan dalam catatan kaki.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Orang kaya itu juga meninggal
  rationale: “Juga” menyampaikan καί dan mempertahankan kesejajaran antara kematian kedua tokoh; hubungan antarkalimat dibuat alami tanpa memperberat δέ.
- source_word: ἐτάφη
  choice: dikuburkan
  rationale: Bentuk pasif θάπτω diterjemahkan secara langsung dan ringkas.
theological_decisions:
- issue: Makna εἰς τὸν κόλπον Ἀβραάμ
  choice: ke pangkuan Abraham
  alternative: ke sisi Abraham
  rationale: Terjemahan utama mempertahankan metafora budaya dan teologis teks tanpa langsung menafsirkannya sebagai istilah umum bagi keadaan sesudah kematian. Alternatif idiomatis dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang ringkas dan bermartabat. Metafora asli dipertahankan dalam teks utama, sementara maknanya dibantu melalui catatan kaki.
