id: LUK.16.14
reference: Luke 16:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: id
  text: Orang-orang Farisi, yang cinta uang, mendengar semua itu dan mencemooh Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencibir Dia.” Kata kerja Yunaninya dapat menyatakan ejekan terbuka atau cemoohan yang penuh penghinaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: mendengar
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung dalam adegan. Dalam narasi bahasa Indonesia, bentuk lampau tidak perlu ditandai secara terpisah; konteks dan verba berikutnya menyampaikan keberlangsungan tindakan itu.
- source_word: δὲ
  choice: tidak dinyatakan secara eksplisit
  rationale: Partikel ini menandai peralihan naratif ringan. Dalam bahasa Indonesia, penambahan 'adapun' atau 'sementara itu' terasa lebih kuat daripada sumber, sehingga alurnya dibiarkan menyampaikan peralihan tersebut.
- source_word: ταῦτα πάντα
  choice: semua itu
  rationale: Ungkapan ini secara alami merujuk kepada seluruh ajaran Yesus yang baru saja disampaikan.
- source_word: οἱ Φαρισαῖοι
  choice: Orang-orang Farisi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok Yahudi tersebut.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: yang cinta uang
  rationale: Menyatakan ciri mereka secara langsung dan mempertahankan makna khusus φιλάργυρος, yaitu mencintai uang, tanpa memperluasnya menjadi label umum seperti 'serakah'.
- source_word: ἐξεμυκτήριζον
  choice: mencemooh
  rationale: Verba ini menyatakan ejekan yang mengandung penghinaan. 'Mencemooh' alami, bermartabat, dan cukup kuat dalam bahasa Indonesia; aspek berlangsungnya dipahami dari rangkaian adegan.
- source_word: αὐτόν
  choice: Dia
  rationale: Kata ganti objek ini merujuk kepada Yesus. Huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk kata ganti yang merujuk kepada-Nya.
theological_decisions:
- issue: Penggambaran dosa orang-orang Farisi dalam φιλάργυροι
  choice: yang cinta uang
  alternative: yang serakah
  rationale: Bahasa Yunani secara khusus menyatakan kecintaan kepada uang. Pilihan ini mempertahankan kaitan langsung dengan ajaran Yesus tentang kekayaan dalam konteks tanpa memasukkan penilaian yang lebih luas daripada bunyi teks.
- issue: Kekuatan penghinaan dalam ἐξεμυκτήριζον
  choice: mencemooh
  alternative: mencibir
  rationale: '''Mencemooh'' mempertahankan makna ejekan terbuka yang menghina, sedangkan ''mencibir'' lebih menonjolkan sikap atau gerak wajah. Alternatif dicatat karena verba Yunani dapat mencakup nuansa keduanya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan ringkas. Terjemahan mempertahankan ciri orang-orang Farisi sebagai pencinta uang serta nada penghinaan dalam tindakan mereka, tanpa memperkuat partikel peralihan δέ secara tidak perlu.
