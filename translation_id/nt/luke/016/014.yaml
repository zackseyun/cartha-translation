  source_fidelity: 'Terjemahan menyampaikan seluruh unsur utama teks Yunani dengan setia: subjeknya orang-orang Farisi, χαρακτηρισasi mereka sebagai φιλάργυροι diterjemahkan secara khusus sebagai “yang cinta uang,” ταῦτα πάντα sebagai “semua itu,” dan tindakan ἐξεμυκτήριζον sebagai “mencemooh Dia.” Bentuk imperfek pada ἤκουον dan ἐξεμυκτήριζον tidak wajib ditandai secara morfologis dalam narasi bahasa Indonesia dan tidak ada makna aspek yang hilang secara material.'
  naturalness: Susunannya ringkas, baku, dan alami dalam bahasa Indonesia modern. “Orang-orang Farisi” dan “mencemooh Dia” sesuai register naratif Alkitab yang bermartabat tanpa menjadi arkais.
  terminology: “Orang-orang Farisi” merupakan nama kelompok yang baku. “Yang cinta uang” mempertahankan makna spesifik “pencinta uang” tanpa menggantikannya dengan penilaian yang lebih luas seperti “serakah.” Catatan kaki “mencibir Dia” adalah alternatif leksikal yang sah dan penjelasannya akurat.
