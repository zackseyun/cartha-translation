base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: id
  text: Di alam maut[a], ia mengangkat matanya. Dalam keadaan tersiksa, ia melihat Abraham dari jauh dan Lazarus di pangkuan Abraham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di Hades,” yaitu alam orang mati; istilah ini berbeda dari “Gehenna,” yang menunjuk pada tempat penghukuman akhir.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di dalam pangkuan atau dada Abraham”; ungkapan ini secara tradisional diterjemahkan “di pangkuan Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: alam maut
  rationale: Ungkapan ini menyampaikan ranah orang mati dalam bahasa Indonesia yang wajar, tanpa menyamakannya dengan tempat penghukuman akhir yang disebut Gehenna. Istilah Yunani “Hades” dicantumkan dalam catatan kaki.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ia mengangkat matanya
  rationale: Mempertahankan gambaran konkret dalam teks Yunani dan tetap terdengar alami dalam narasi Indonesia.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: dalam keadaan tersiksa
  rationale: Menyatakan keadaan yang berlangsung tanpa menentukan hubungan waktu atau sebab yang tidak dinyatakan secara tegas oleh partisip Yunani.
- source_word: ὁρᾷ
  choice: ia melihat
  rationale: Bahasa Indonesia tidak menandai kala pada verba; bentuk ini secara alami menyampaikan present historis Yunani dalam alur narasi.
- source_word: ἀπὸ μακρόθεν
  choice: dari jauh
  rationale: Padanan Indonesia yang ringkas dan alami serta mempertahankan penekanan pada jarak.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: di pangkuannya
  rationale: “Pangkuan” mempertahankan citra kedekatan dan perlindungan dari κόλπος dengan bahasa yang dapat dipahami pembaca modern; pronomina “-nya” tetap merujuk kepada Abraham sebagaimana konteks Yunani.
theological_decisions:
- issue: Makna ᾅδης dalam pembahasan tentang keadaan sesudah kematian dan penghukuman akhir
  choice: alam maut
  alternative: Hades; neraka
  rationale: “Alam maut” mempertahankan pengertian ranah orang mati dan tidak mencampurkannya dengan Gehenna atau menetapkan rincian doktrinal yang melampaui ayat ini.
- issue: Citra κόλπος yang secara tradisional dikenal sebagai “pangkuan Abraham”
  choice: di pangkuannya
  alternative: di sisi Abraham; dalam pelukannya; di pangkuan Abraham
  rationale: Pilihan ini mempertahankan citra tubuh dan kedekatan dalam ungkapan Yunani, sementara catatan kaki menjelaskan bentuk tradisionalnya tanpa menjadikannya istilah teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang bertumpuk dipecah menjadi dua agar jelas, tetapi urutan adegan dan hubungan antargagasannya dipertahankan. Istilah “alam maut” dipilih daripada “neraka” demi ketepatan leksikal dan teologis.
