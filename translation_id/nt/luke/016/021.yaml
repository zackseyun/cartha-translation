base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: id
  text: dan ia sangat ingin dikenyangkan dengan apa yang jatuh dari meja orang kaya itu.[a] Namun, bahkan anjing-anjing datang dan menjilati borok-boroknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan sisa-sisa makanan yang jatuh dari meja orang kaya itu.” Secara harfiah, teks Yunani berbunyi “dengan apa yang sedang jatuh”; “sisa-sisa makanan” disimpulkan dari konteks jamuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: sangat ingin
  rationale: Partisipel kini ini menyatakan keinginan Lazarus yang kuat dan berkelanjutan; 'sangat ingin' alami dalam bahasa Indonesia tanpa melebih-lebihkan.
- source_word: χορτασθῆναι
  choice: dikenyangkan
  rationale: Infinitif pasif ini menunjuk pada menerima makanan sampai kenyang; bentuk pasif dan nuansa kecukupan makanan tetap dipertahankan.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: dengan apa yang jatuh
  rationale: Partisipel berartikel berfungsi substantival. 'Apa yang jatuh' dekat dengan ungkapan Yunani dan tidak memasukkan 'sisa makanan' ke dalam teks utama, meskipun konteks makan menyiratkannya.
- source_word: τῆς τραπέζης
  choice: dari meja
  rationale: Padanan lazim dan tepat dalam konteks jamuan makan.
- source_word: τοῦ πλουσίου
  choice: orang kaya itu
  rationale: Adjektiva substantival ini merujuk kembali kepada orang kaya dalam perumpamaan; 'itu' menandai rujukan yang sudah dikenal.
- source_word: ἀλλὰ καὶ
  choice: Bahkan
  rationale: Dalam konteks ini ungkapan tersebut menambahkan keadaan yang mencolok. 'Bahkan' menyampaikan penekanan secara alami; kontras tidak perlu dipaksakan dengan 'tetapi' setelah titik.
- source_word: οἱ κύνες
  choice: anjing-anjing
  rationale: Bentuk jamak diterjemahkan secara langsung tanpa memperhalus atau menambahkan jenis anjing.
- source_word: ἐρχόμενοι
  choice: datang
  rationale: Partisipel sirkumstansial/penyerta diterjemahkan secara idiomatis bersama verba utama.
- source_word: ἐπέλειχον
  choice: menjilati
  rationale: Imperfek menyiratkan tindakan berulang atau berlangsung; 'menjilati' secara alami membawa nuansa berulang dalam bahasa Indonesia.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: borok-boroknya
  rationale: ἕλκη menunjuk pada luka terbuka atau ulkus. 'Borok' akurat, konkret, dan mudah dipahami; bentuk ulang mempertahankan jamaknya.
