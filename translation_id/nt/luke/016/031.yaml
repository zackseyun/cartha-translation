source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: id
  text: Tetapi ia berkata kepadanya, “Jika mereka tidak mendengarkan[a] Musa dan para nabi, kalaupun seseorang bangkit dari antara orang mati[c], mereka tetap tidak akan diyakinkan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendengar” atau “mengindahkan.” Kata kerja Yunani ini dapat mencakup baik mendengar maupun memberi perhatian dan tanggapan.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan dibuat yakin” atau “akan terbujuk.” Kata Yunani ini berarti akan diyakinkan atau terbujuk, tidak harus “percaya” dalam arti teologis yang lebih sempit.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari orang-orang mati”; ungkapan ini juga dapat diterjemahkan “dari antara orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Tetapi ia berkata kepadanya
  rationale: δέ menandai pertentangan ringan dengan permintaan sebelumnya; bentuk ini tetap dekat dengan susunan Yunani dan wajar dalam bahasa Indonesia.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Musa dan para nabi
  rationale: Ungkapan ini mempertahankan cara Yahudi merujuk pada kesaksian Kitab Suci, tanpa menjabarkannya menjadi istilah yang lebih sempit atau lebih luas.
- source_word: οὐκ ἀκούουσιν
  choice: tidak mendengarkan
  rationale: ἀκούω dapat mencakup mendengar dan memberi perhatian yang semestinya. “Mendengarkan” mempertahankan kedua nuansa itu tanpa secara berlebihan mengartikannya sebagai ketaatan penuh.
- source_word: οὐδ’ ἐάν
  choice: juga tidak ... sekalipun
  rationale: Ungkapan ini meneruskan dan menguatkan penyangkalan dalam klausa pertama, dengan bentuk Indonesia yang alami.
- source_word: τις
  choice: seseorang
  rationale: Kata ganti tak tentu tunggal ini diterjemahkan secara langsung dan alami.
- source_word: ἐκ νεκρῶν
  choice: dari antara orang mati
  rationale: Terjemahan ini mempertahankan unsur ἐκ dan bentuk jamak νεκρῶν serta nuansa bangkit keluar dari kalangan orang mati.
- source_word: ἀναστῇ
  choice: bangkit
  rationale: Sesudah “sekalipun,” bentuk ini menyampaikan keadaan bersyarat secara alami dalam bahasa Indonesia dan tetap mempertahankan bahasa kebangkitan.
- source_word: πεισθήσονται
  choice: akan diyakinkan
  rationale: Bentuk pasif ini mempertahankan arti dibujuk atau dibuat yakin, tanpa mempersempitnya menjadi iman atau pertobatan dalam pengertian teologis tertentu.
theological_decisions:
- issue: Makna “Musa dan para nabi”
  choice: Dipertahankan sebagai ungkapan yang merujuk pada kesaksian Kitab Suci yang telah diberikan kepada Israel
  alternative: Menguraikannya sebagai “Kitab Taurat dan kitab para nabi” atau memahaminya hanya sebagai dua kelompok tokoh
  rationale: Dalam konteks, ungkapan tersebut menunjuk secara metonimis pada kesaksian Kitab Suci. Terjemahan mempertahankan ungkapan aslinya dan tidak menggantinya dengan parafrasa penafsiran.
- issue: Daya makna πεισθήσονται
  choice: diyakinkan dalam arti umum
  alternative: akan percaya atau akan bertobat
  rationale: Kata Yunani menyatakan menjadi yakin atau terbujuk; teks tidak secara eksplisit membatasi respons itu pada iman yang menyelamatkan atau pertobatan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Ia” dipakai sebagai pronomina naratif yang netral; susunan klausa dibuat alami tanpa menghilangkan pertentangan, penguatan negasi, bentuk pasif, atau ketegangan teologis teks.
