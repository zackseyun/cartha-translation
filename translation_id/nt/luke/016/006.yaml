  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: id
  text: Ia menjawab, “Seratus bat[a] minyak zaitun.” Lalu pengelola itu berkata kepadanya, “Ambillah surat utangmu[b], segera duduk dan tulislah lima puluh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bat adalah satuan takaran cair pada zaman kuno. Teks Yunani berbunyi, “seratus bat minyak zaitun.”
    reason: cultural_note
  - marker: b
    text: Atau “dokumen-dokumenmu” atau “catatan utangmu”; secara harfiah, “tulisan-tulisanmu”. Dalam konteks ini yang dimaksud adalah dokumen tertulis yang mencatat utangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: bat
  rationale: Istilah ini menunjuk pada satuan takaran cair tertentu pada zaman kuno. Bentuk transliterasi “bat” mempertahankan rincian konkret teks, sedangkan catatan kaki menjelaskan maknanya bagi pembaca modern.
- source_word: ἐλαίου
  choice: minyak zaitun
  rationale: Dalam konteks ini ἔλαιον merujuk pada minyak zaitun; pilihan ini lebih jelas daripada sekadar “minyak”.
- source_word: Δέξαι
  choice: Ambillah
  rationale: Imperatif ini secara alami memerintahkan orang itu mengambil dokumen utangnya untuk diubah.
- source_word: τὰ γράμματα
  choice: surat utangmu
  rationale: Secara harfiah berarti “tulisan-tulisan/dokumen-dokumenmu”, tetapi dalam konteks piutang menunjuk pada dokumen tertulis yang mencatat utang. “Surat utang” alami dan cukup spesifik dalam bahasa Indonesia.
- source_word: καθίσας
  choice: duduk
  rationale: 'Partisip ini menyertai perintah berikutnya dan wajar diterjemahkan sebagai rangkaian perintah: “segera duduk dan tulislah”.'
- source_word: ταχέως
  choice: segera
  rationale: Menunjukkan tindakan yang harus dilakukan dengan cepat; “segera” terdengar alami dalam rangkaian perintah ini.
- source_word: γράψον
  choice: tulislah
  rationale: Mempertahankan perintah langsung untuk menuliskan jumlah pengganti pada dokumen tersebut tanpa menambahkan penafsiran yang tidak dinyatakan.
- source_word: πεντήκοντα
  choice: lima puluh
  rationale: Padanan langsung bagi angka yang disebutkan dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Subjek “pengelola itu” dibuat eksplisit untuk memperjelas pergantian penutur yang ditandai oleh ὁ δέ dalam bahasa Yunani. Istilah kuno “bat” dipertahankan dan dijelaskan melalui catatan kaki.
