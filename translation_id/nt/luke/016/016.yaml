base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: id
  text: Taurat dan kitab-kitab para nabi berlaku sampai Yohanes. Sejak saat itu Kerajaan Allah diberitakan sebagai kabar baik, dan setiap orang menerobos masuk ke dalamnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap orang mendesak masuk ke dalamnya” atau “setiap orang berusaha keras untuk masuk ke dalamnya.” Kata kerja Yunani yang dipakai dapat menggambarkan gerak yang kuat atau memaksa.
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang memahami klausa terakhir secara lebih negatif berdasarkan perkataan serupa dalam Matius 11:12. Namun, dalam ayat ini subjek gramatikalnya adalah “setiap orang,” bukan “Kerajaan Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: Hukum Taurat dan Kitab Para Nabi
  rationale: Ungkapan ini menunjuk pada dua kategori utama Kitab Suci Yahudi. “Hukum Taurat” merupakan padanan Indonesia yang lazim untuk νόμος dalam pasangan ini, sedangkan “Kitab Para Nabi” memperjelas bahwa yang dimaksud adalah kumpulan kitab, bukan hanya tokoh-tokoh nabi.
- source_word: μέχρι Ἰωάννου
  choice: berlaku sampai zaman Yohanes
  rationale: μέχρι menandai batas waktu. Penambahan “zaman” membuat maksud temporalnya alami dalam bahasa Indonesia, sedangkan “berlaku” melengkapi klausa nominal Yunani tanpa menentukan secara berlebihan bahwa Taurat dan Para Nabi kemudian kehilangan nilai atau kewibawaan.
- source_word: ἀπὸ τότε
  choice: Sejak saat itu
  rationale: Padanan alami untuk peralihan temporal yang dimulai dengan pelayanan Yohanes dan berlanjut sesudahnya.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Kerajaan Allah
  rationale: Padanan baku yang tetap memuat kemungkinan makna wilayah kerajaan maupun pemerintahan atau kekuasaan Allah.
- source_word: εὐαγγελίζεται
  choice: diberitakan sebagai kabar baik
  rationale: Bentuk kini pasif menunjukkan pemberitaan yang berlangsung, dan pilihan ini mempertahankan unsur “kabar baik” dalam verba εὐαγγελίζω.
- source_word: πᾶς
  choice: setiap orang
  rationale: Bentuk tunggal distributif ini secara alami menyatakan setiap orang secara individual, tanpa membatasi kelompok yang dimaksud.
- source_word: εἰς αὐτὴν
  choice: untuk masuk ke dalamnya
  rationale: Frasa ini menunjukkan gerak menuju atau masuk ke dalam Kerajaan Allah; unsur tujuan dinyatakan secara alami dalam bahasa Indonesia.
- source_word: βιάζεται
  choice: berusaha keras
  rationale: Bentuk media/pasif ini sulit dan dapat menyiratkan gerakan yang kuat atau mendesak. “Berusaha keras” mempertahankan intensitasnya tanpa memberi kesan bahwa orang memperoleh Kerajaan Allah semata-mata melalui jasa sendiri.
theological_decisions:
- issue: Makna βιάζεται dalam hubungannya dengan Kerajaan Allah
  choice: Klausa ini menggambarkan setiap orang berusaha keras untuk masuk ke dalam Kerajaan Allah.
  alternative: Setiap orang mendesak masuk ke dalamnya; atau, dengan pemahaman negatif yang dipengaruhi perkataan serupa dalam Matius 11:12, Kerajaan Allah mengalami kekerasan.
  rationale: Dalam susunan Lukas, subjek verba adalah πᾶς, “setiap orang,” dan εἰς αὐτήν secara alami menunjukkan gerak masuk ke dalam Kerajaan. Catatan kaki mempertahankan nuansa gerakan kuat serta alternatif negatif tanpa mengubahnya menjadi pernyataan tentang keselamatan berdasarkan usaha manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kitab Para Nabi” memperjelas kategori Kitab Suci; “berlaku sampai zaman Yohanes” membuat klausa eliptis Yunani dapat dipahami sambil tetap menjaga ketegangan mengenai sifat batas waktu tersebut. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
