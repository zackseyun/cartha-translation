  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: id
  text: Selain semua itu,[a] di antara kami dan kalian telah diteguhkan sebuah jurang besar, supaya mereka yang ingin menyeberang dari sini ke tempat kalian tidak dapat melakukannya, dan mereka dari sana pun tidak dapat menyeberang kepada kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Di samping semua ini.” Frasa Yunani ini dapat menyatakan tambahan pertimbangan dalam alur pembicaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: Selain semua itu
  rationale: Dalam konteks ini frasa tersebut secara idiomatis menambahkan pertimbangan lain. Terjemahan ini alami dalam bahasa Indonesia dan tidak mengubah hubungan wacananya; kemungkinan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: di antara kami dan kalian
  rationale: Menunjukkan pemisahan spasial antara dua kelompok. 'Kalian' menyatakan dengan jelas bahwa ὑμῶν berbentuk jamak.
- source_word: χάσμα μέγα
  choice: jurang besar
  rationale: '''Jurang'' merupakan padanan Indonesia yang alami bagi χάσμα dan menggambarkan celah lebar yang memisahkan kedua sisi.'
- source_word: ἐστήρικται
  choice: telah ditetapkan
  rationale: Bentuk perfektum pasif menyatakan sesuatu yang sudah dibuat tetap dan terus berada dalam keadaan itu. 'Telah ditetapkan' mempertahankan nuansa keadaan yang kukuh tanpa menentukan pelaku yang tidak disebutkan.
- source_word: ὅπως
  choice: supaya
  rationale: Mempertahankan hubungan tujuan atau hasil yang dapat terkandung dalam penghubung Yunani ini.
- source_word: οἱ θέλοντες
  choice: mereka yang ingin
  rationale: Menerjemahkan partisip substantival sebagai kelompok umum dengan ungkapan Indonesia yang alami.
- source_word: διαβῆναι
  choice: menyeberang
  rationale: Mengungkapkan perpindahan dari satu sisi ke sisi lain secara jelas dan ringkas.
- source_word: ἔνθεν
  choice: dari sini
  rationale: Mempertahankan sudut pandang deiktis pihak yang sedang berbicara.
- source_word: μὴ δύνωνται
  choice: tidak dapat melakukannya
  rationale: Menyatakan ketidakmampuan, bukan sekadar larangan; 'melakukannya' merujuk kembali kepada tindakan menyeberang dan menghindari susunan Indonesia yang janggal.
- source_word: μηδὲ
  choice: dan ... pun tidak
  rationale: Menghubungkan ketidakmungkinan kedua dengan yang pertama serta mempertahankan paralelismenya secara alami dalam bahasa Indonesia.
- source_word: ἐκεῖθεν
  choice: dari sana
  rationale: Menjadi pasangan deiktis yang jelas bagi 'dari sini'.
- source_word: διαπερῶσιν
  choice: menyeberang
  rationale: Menggambarkan pelintasan penuh dari sisi sana ke sisi pembicara; pengulangan 'menyeberang' mempertahankan kesejajaran klausa.
theological_decisions:
- issue: Sifat pemisahan antara kedua ranah dalam perumpamaan
  choice: Menyatakan adanya jurang besar yang telah ditetapkan dan tidak dapat diseberangi.
  alternative: Menjabarkannya sebagai ciri topografis harfiah alam sesudah kematian, atau melemahkannya menjadi gambaran yang tidak menyiratkan pemisahan tetap.
  rationale: Ayat ini sendiri menekankan keadaan jurang yang sudah tetap dan ketidakmampuan untuk menyeberang. Terjemahan mempertahankan daya itu tanpa mengembangkan suatu sistem doktrin yang melampaui teks.
- issue: Pelaku yang menetapkan jurang
  choice: Mempertahankan bentuk pasif 'telah ditetapkan' tanpa menyebut pelaku.
  alternative: Menambahkan 'Allah telah menetapkan'.
  rationale: Teks Yunani menggunakan bentuk pasif dan tidak menyatakan pelakunya secara eksplisit; terjemahan tidak boleh mengisi ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kami' dan 'kalian' membedakan orang pertama jamak dari orang kedua jamak secara jelas. Susunan kalimat dibuat alami tanpa mengurangi penekanan pada jurang yang tetap dan mustahil diseberangi.
