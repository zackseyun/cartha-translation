id: LUK.16.10
reference: Luke 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: id
  text: Orang yang setia dalam perkara yang sangat kecil[a] juga setia dalam perkara yang besar, dan orang yang tidak adil[b] dalam perkara yang sangat kecil juga tidak adil dalam perkara yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam perkara yang paling kecil.” Ungkapan Yunani ini menunjuk pada sesuatu yang sangat kecil atau tidak berarti.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak jujur” atau “tidak benar.” Istilah Yunani ini mencakup ketidakadilan atau kejahatan secara lebih luas daripada ketidakjujuran dalam urusan keuangan, meskipun nuansa itu sesuai dengan konteks di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: setia
  rationale: Dalam konteks pengelolaan sesuatu yang dipercayakan, kata ini menunjuk pada kesetiaan dan dapat dipercayanya seseorang, bukan sekadar tindakan percaya. "Setia" mempertahankan kategori moral serta kesejajaran dengan ἄδικος.
- source_word: ἐν ἐλαχίστῳ
  choice: dalam perkara yang sangat kecil
  rationale: Ungkapan ini menyatakan lingkup atau keadaan dan secara harfiah menunjuk pada sesuatu yang amat kecil atau tidak berarti. Penambahan "perkara" membuat ungkapan itu wajar dalam bahasa Indonesia tanpa mempersempitnya hanya pada uang.
- source_word: ἐν πολλῷ
  choice: dalam perkara yang besar
  rationale: Bentuk netral tunggal ini menyatakan jumlah atau kadar yang besar sebagai lawan dari ἐλαχίστῳ. "Perkara yang besar" membentuk kontras Indonesia yang alami dengan "perkara yang sangat kecil".
- source_word: ἄδικος
  choice: tidak benar
  rationale: Istilah ini menggambarkan orang yang bertindak salah, tidak adil, atau tidak jujur. "Tidak benar" mempertahankan cakupan moralnya yang luas, sedangkan "tidak jujur" dapat terdengar terbatas pada kejujuran finansial.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: orang yang setia ... orang yang tidak benar
  rationale: Artikel dengan adjektiva berfungsi substantival dan merujuk secara umum kepada siapa pun yang memiliki sifat tersebut. "Orang yang ..." alami, jelas, dan tidak menambahkan penandaan gender.
- source_word: καί
  choice: juga / dan
  rationale: Pada masing-masing perbandingan, καί bernilai aditif dan diterjemahkan "juga"; καί yang menghubungkan dua pernyataan utama diterjemahkan "dan" agar paralelismenya tetap jelas dan alami.
theological_decisions:
- issue: Cakupan moral ἄδικος dalam konteks pengelolaan harta
  choice: tidak benar
  alternative: tidak jujur; tidak adil
  rationale: Perkataan ini menyatakan prinsip moral yang lebih luas daripada ketidakjujuran dalam urusan uang saja. "Tidak benar" menjaga keluasan makna tersebut, sementara catatan kaki mencantumkan nuansa lain yang sesuai dengan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan pepatah yang ringkas dan paralel. Kata “perkara” dipakai dalam arti umum, bukan khusus perkara hukum, untuk membuat kontras antara hal yang sangat kecil dan hal yang besar terdengar alami.
