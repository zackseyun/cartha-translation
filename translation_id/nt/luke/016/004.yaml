  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tuturan langsung memakai “aku” sesuai suara tokoh dalam perumpamaan. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diungkapkan dengan jelas dalam teks tanpa menimbulkan kehilangan makna penting.
