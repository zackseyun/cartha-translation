review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok tersampaikan dengan baik: sang pengelola telah menemukan rencana, akan diberhentikan dari jabatannya, dan bermaksud agar orang-orang itu menerimanya di rumah mereka. Namun, preposisi εἰς menyatakan arah masuk (''ke dalam''), sedangkan ''di rumah'' bersifat lokatif dan menghilangkan unsur gerak/masuk yang ada dalam teks Yunani.'
  naturalness: Bahasanya modern dan jelas. Frasa 'supaya, ketika' tidak memerlukan koma; tanpa koma lebih lancar. Dalam konstruksi tujuan ini, 'mereka menerima aku' juga lebih langsung daripada 'mereka mau menerima aku', yang dapat menambahkan penekanan pada kemauan yang tidak dinyatakan secara eksplisit.
  terminology: '''jabatan pengelola'' secara tepat menyampaikan ἐκ τῆς οἰκονομίας sebagai kedudukan atau tugas pengelolaan. ''Rumah mereka masing-masing'' secara alami mempertahankan bentuk jamak refleksif ἑαυτῶν.'
  issues:
  - severity: medium
    issue: Arah εἰς tidak tercermin.
    rationale: Teks Yunani memakai εἰς τοὺς οἴκους, secara harfiah 'ke dalam rumah-rumah'; 'di rumah' menyatakan lokasi, bukan penerimaan masuk ke dalam rumah.
  - severity: low
    issue: Kata 'mau' memberi nuansa tambahan.
    rationale: δέξωνταί berarti 'mereka menerima/menyambut'; dalam konteks tujuan, 'mereka menerima aku' sudah menyatakan hasil yang dimaksud tanpa secara khusus menekankan kesediaan.
  - severity: low
    issue: Koma setelah 'supaya' mengganggu kelancaran konstruksi tujuan-waktu.
    rationale: Dalam bahasa Indonesia modern, 'supaya ketika ...' paling alami ditulis tanpa koma di antara kedua penghubung tersebut.
  revised_text: Aku tahu apa yang akan kulakukan, supaya ketika aku diberhentikan dari jabatan pengelola, mereka menerima aku ke dalam rumah mereka masing-masing.
