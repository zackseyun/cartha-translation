  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: id
  text: Aku tahu apa yang akan kulakukan, supaya ketika aku diberhentikan dari jabatan pengelola, mereka menerima aku ke dalam rumah mereka masing-masing.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Aku tahu
  rationale: Bentuk aoris ini secara idiomatis menyatakan bahwa pengelola itu telah sampai pada suatu kesadaran atau keputusan. Dalam bahasa Indonesia, “Aku tahu” paling alami untuk memperkenalkan rencana yang baru ditemukannya.
- source_word: τί ποιήσω
  choice: apa yang akan kulakukan
  rationale: Subjungtif deliberatif menyatakan tindakan yang sedang dipertimbangkan, tetapi dalam konteks ini sudah mengarah pada rencana yang mantap. Bentuk ini alami dan mempertahankan nuansa masa depan.
- source_word: ἵνα ὅταν
  choice: supaya, ketika
  rationale: 'Gabungan ini menyatakan tujuan yang terkait dengan keadaan pada masa depan: ia bertindak dengan maksud memperoleh hasil tertentu ketika pemberhentiannya terjadi.'
- source_word: μετασταθῶ
  choice: aku diberhentikan
  rationale: Bentuk pasif μεθίστημι di sini berarti disingkirkan atau dilepaskan dari suatu kedudukan. “Diberhentikan” paling tepat dalam konteks kehilangan jabatan.
- source_word: ἐκ τῆς οἰκονομίας
  choice: dari jabatan pengelola
  rationale: οἰκονομία menunjuk pada tugas atau kedudukan mengelola rumah tangga. Ungkapan ini jelas bagi pembaca modern dan tidak memberi nuansa teologis yang tidak diperlukan.
- source_word: δέξωνταί με
  choice: mereka mau menerima aku
  rationale: δέχομαι dapat berarti menerima atau menyambut. “Mau menerima aku” menyampaikan tujuan berupa kesediaan mereka menampungnya tanpa melebihkan kehangatan tindakan itu.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: di rumah mereka masing-masing
  rationale: Dalam konteks keramahtamahan, οἶκος paling alami diterjemahkan “rumah”. Kata refleksif ἑαυτῶν menegaskan rumah milik mereka sendiri; “masing-masing” mengungkapkan hal itu secara alami dalam bahasa Indonesia.
