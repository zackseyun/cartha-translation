id: LUK.16.24
reference: Luke 16:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: id
  text: Lalu ia berseru, “Bapa Abraham, kasihanilah aku. Utuslah Lazarus supaya ia mencelupkan ujung jarinya ke dalam air dan menyejukkan lidahku, sebab aku sangat menderita dalam nyala api ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab aku tersiksa dalam nyala api ini.” Kata kerja Yunani yang dipakai dapat menunjuk pada penderitaan berat atau siksaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: berseru
  rationale: Partisip aoris ini memperkenalkan permohonan yang lantang dan mendesak; “berseru” alami dalam bahasa Indonesia dan tetap mempertahankan intensitasnya.
- source_word: ἐλέησόν με
  choice: kasihanilah aku
  rationale: Menyampaikan permohonan langsung akan belas kasihan dengan ungkapan Indonesia yang wajar dan khidmat.
- source_word: πέμψον Λάζαρον
  choice: suruhlah Lazarus
  rationale: Dalam konteks permintaan agar Lazarus melakukan tindakan tertentu, “suruhlah” menyampaikan fungsi kausatif πέμψον secara alami; “utuslah” mungkin, tetapi terdengar lebih resmi dan dapat membawa nuansa penugasan khusus.
- source_word: βάψῃ
  choice: mencelupkan
  rationale: βάπτω menunjuk tindakan mencelup yang singkat; pilihan ini mempertahankan gambaran konkret tanpa menyiratkan perendaman seluruhnya.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: ujung jarinya
  rationale: Padanan ringkas dan alami bagi bagian paling ujung dari jari.
- source_word: ὕδατος
  choice: ke dalam air
  rationale: Genitif sesudah βάψῃ secara idiomatis dinyatakan sebagai sasaran pencelupan dalam bahasa Indonesia.
- source_word: καταψύξῃ
  choice: menyejukkan
  rationale: Kata ini berarti mendinginkan atau menyegarkan dengan pendinginan; “menyejukkan” mempertahankan gambaran fisik dan terdengar alami untuk lidah yang kepanasan.
- source_word: τὴν γλῶσσάν μου
  choice: lidahku
  rationale: Rujukan anggota tubuh diterjemahkan secara langsung.
- source_word: ὀδυνῶμαι
  choice: aku sangat menderita
  rationale: Mengungkapkan penderitaan atau rasa sakit yang berat tanpa memasukkan gagasan tentang pelaku penyiksaan yang tidak dinyatakan oleh verba Yunani.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: dalam nyala api ini
  rationale: φλόξ secara khusus berarti nyala api; bentuk ini mempertahankan gambaran tunggal yang hidup dalam teks Yunani.
- source_word: Πάτερ Ἀβραάμ
  choice: Bapa Abraham
  rationale: Sapaan leluhur dipertahankan secara langsung dan selaras dengan register Alkitab Indonesia yang tetap mudah dipahami.
theological_decisions:
- issue: Penggambaran penderitaan orang kaya
  choice: sebab aku sangat menderita dalam nyala api ini
  alternative: sebab aku tersiksa dalam nyala api ini
  rationale: ὀδυνῶμαι menyatakan rasa sakit atau penderitaan berat. “Sangat menderita” mempertahankan intensitasnya tanpa menentukan bahwa penderitaan itu ditimbulkan oleh seorang penyiksa; alternatif “tersiksa” tetap mungkin secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur ujaran dibuat alami dengan memecah permohonan menjadi dua kalimat, tanpa mengubah hubungan makna dalam teks Yunani.
