  to: Lalu ia berseru, “Bapa Abraham, kasihanilah aku. Utuslah Lazarus supaya ia mencelupkan ujung jarinya ke dalam air dan menyejukkan lidahku, sebab aku sangat menderita dalam nyala api ini.”[a]
