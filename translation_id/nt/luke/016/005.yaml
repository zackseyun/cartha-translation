  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: id
  text: Setelah memanggil setiap orang yang berutang kepada tuannya[a], ia berkata kepada orang pertama, “Berapa utangmu kepada tuanku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani κύριος sering diterjemahkan “Tuhan”, tetapi di sini kata itu menunjuk kepada atasan manusia si pengelola, sehingga diterjemahkan “tuan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: memanggil
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului verba utama. Dalam bahasa Indonesia, urutan tersebut tersampaikan secara alami melalui “Lalu ia memanggil ... dan berkata” tanpa membuat kalimat kaku.
- source_word: ἕνα ἕκαστον
  choice: setiap orang
  rationale: Gabungan ini memiliki daya distributif yang kuat. “Setiap orang” akurat dan wajar; konteks sudah menunjukkan bahwa mereka dipanggil secara bergiliran.
- source_word: χρεοφειλετῶν
  choice: orang yang berutang
  rationale: Ungkapan ini secara langsung dan alami menunjuk kepada para debitur dalam konteks ekonomi, serta lebih mudah dipahami pembaca umum daripada istilah teknis “debitur”.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: kepada tuannya
  rationale: κύριος di sini menunjuk kepada atasan manusia si pengelola, sedangkan ἑαυτοῦ merujuk kembali kepada si pengelola. “Tuannya” menyampaikan hubungan tersebut secara ringkas.
- source_word: ἔλεγεν
  choice: berkata
  rationale: Imperfek dapat menggambarkan tindakan berulang ketika ia berbicara kepada setiap orang. Bahasa Indonesia tidak wajib menandai aspek ini pada verba; konteks distributif “setiap orang” mempertahankan nuansa adegan tanpa menambahkan “terus berkata” yang terlalu menafsirkan.
- source_word: τῷ πρώτῳ
  choice: kepada orang yang pertama
  rationale: Terjemahan ini menyatakan dengan jelas bahwa yang dimaksud adalah orang pertama dalam urutan para pengutang.
- source_word: Πόσον ὀφείλεις
  choice: Berapa utangmu
  rationale: Dalam konteks keuangan, pertanyaan ini secara idiomatis menanyakan jumlah utang. Bentuk ini langsung, alami, dan mempertahankan makna sumber.
- source_word: τῷ κυρίῳ μου
  choice: kepada tuanku
  rationale: 'κύριος kembali menunjuk kepada atasan manusia si pengelola, dan μου mempertahankan sudut pandangnya: “tuanku”.'
theological_decisions:
- issue: Terjemahan κύριος dalam konteks perumpamaan ekonomi rumah tangga
  choice: tuan
  alternative: Tuhan
  rationale: Referennya adalah atasan manusia si pengelola, bukan gelar ilahi atau kristologis. “Tuan” menjaga hubungan sosial dalam cerita dan menghindari kesan teologis yang menyesatkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang yang berutang” dipilih daripada “debitur” agar mudah dipahami secara luas. Bentuk “tuannya/tuanku” alami dalam konteks perumpamaan dan membedakan referen manusia dari gelar ilahi “Tuhan”.
