id: LUK.16.15
reference: Luke 16:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Kalianlah orang-orang yang membenarkan diri di hadapan manusia, tetapi Allah mengenal hati kalian. Sebab, apa yang dipandang tinggi di antara manusia adalah sesuatu yang menjijikkan di hadapan Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang sangat dihargai di antara manusia adalah kekejian di hadapan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: membenarkan diri
  rationale: Mempertahankan kaitan leksikal dengan δικαιόω sekaligus menyampaikan tindakan menampilkan diri sebagai benar di hadapan orang lain.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: di hadapan manusia
  rationale: Ungkapan ini mempertahankan gambaran penilaian di hadapan manusia; 'manusia' secara wajar bersifat generik dan inklusif dalam bahasa Indonesia.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: mengenal hati kalian
  rationale: Terjemahan langsung yang mempertahankan 'hati' sebagai pusat batin, pikiran, dan motivasi.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: apa yang dipandang tinggi di antara manusia
  rationale: Mempertahankan metafora ketinggian dari ὑψηλόν sambil membuat unsur penghargaan sosial dalam frasa Yunani dapat dipahami secara alami.
- source_word: βδέλυγμα
  choice: sesuatu yang menjijikkan
  rationale: Mengungkapkan penolakan ilahi yang kuat dengan bahasa Indonesia modern dan alami; alternatif formal 'kekejian' dicatat dalam catatan kaki.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Mempertahankan kesejajaran dengan 'di hadapan manusia' dan menonjolkan kontras antara penilaian manusia dan penilaian Allah.
- source_word: Ὑμεῖς ἐστε οἱ δικαιοῦντες
  choice: Kalianlah orang-orang yang membenarkan
  rationale: Akhiran -lah menyampaikan tekanan pada Ὑμεῖς, sedangkan bentuk jamak 'kalian' sesuai dengan orang-orang yang disapa.
theological_decisions:
- issue: Makna generik ἀνθρώπων dalam kedua frasa
  choice: manusia
  alternative: orang-orang
  rationale: '''Manusia'' menyatakan umat manusia secara inklusif dan tetap dekat dengan istilah Yunani, tanpa menimbulkan kesan bahwa yang dimaksud hanya laki-laki.'
- issue: Daya semantis τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: apa yang dipandang tinggi di antara manusia
  alternative: apa yang sangat dihargai di antara manusia
  rationale: Pilihan utama mempertahankan metafora 'tinggi' dan sekaligus membiarkan frasa itu mencakup status, kehormatan, serta penilaian sosial, tanpa membatasinya hanya pada nilai atau harga.
- issue: Daya semantis βδέλυγμα
  choice: sesuatu yang menjijikkan di hadapan Allah
  alternative: kekejian di hadapan Allah
  rationale: Pilihan utama kuat dan mudah dipahami pembaca modern; alternatifnya mempertahankan istilah religius yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk sapaan orang kedua jamak, dan 'Allah' mengikuti pemakaian Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada akhir kalimat yang memuat kedua alternatif terkait.
