  source_fidelity: Teks Indonesia dengan tepat mencerminkan cakupan universal Πᾶς ὁ, makna perceraian dari ἀπολύων, serta dua pernyataan paralel tentang perzinahan. “Perempuan lain” secara tepat mengungkapkan objek feminin ἑτέραν. “Perempuan yang telah diceraikan dari suaminya” menyampaikan partisip perfek pasif ἀπολελυμένην dan relasi ἀπὸ ἀνδρός secara wajar; penggunaan “suaminya” merupakan penjelasan kontekstual yang sah dalam bahasa Indonesia, bukan tambahan doktrinal.
