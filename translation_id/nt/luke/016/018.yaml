id: LUK.16.18
reference: Luke 16:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: id
  text: Setiap orang yang menceraikan istrinya dan menikahi perempuan lain berzina. Demikian juga, orang yang menikahi perempuan yang telah diceraikan dari suaminya[a] berzina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang telah diceraikan dari seorang suami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Setiap orang yang
  rationale: Konstruksi ini menyatakan kaidah umum dengan cakupan universal; ungkapan tersebut jelas dan wajar dalam bahasa Indonesia modern.
- source_word: ἀπολύων
  choice: menceraikan
  rationale: Dalam konteks perkawinan, verba ini secara idiomatis berarti menceraikan, bukan sekadar menyuruh pergi atau melepaskan.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: istrinya
  rationale: Dalam konteks perceraian dan perkawinan, γυνή berarti istri.
- source_word: γαμῶν ἑτέραν
  choice: menikahi perempuan lain
  rationale: Verba γαμέω diterjemahkan menikahi, sedangkan bentuk feminin ἑτέραν merujuk kepada perempuan lain; penyebutan perempuan membuat objek yang tersirat dalam bahasa Yunani menjadi jelas dan alami dalam bahasa Indonesia.
- source_word: μοιχεύει
  choice: berzina
  rationale: Berzina merupakan padanan langsung, ringkas, dan lazim bagi verba yang menyatakan perzinaan.
- source_word: ἀπολελυμένην
  choice: perempuan yang telah diceraikan
  rationale: Partisip perfek pasif menyatakan seorang perempuan yang berada dalam keadaan telah diceraikan; bentuk pasif dan aspek hasilnya dipertahankan.
- source_word: ἀπὸ ἀνδρὸς
  choice: dari suaminya
  rationale: Dalam konteks ini ἀνήρ berarti suami, dan ἀπό dipertahankan dengan dari. Pronomina -nya menghasilkan ungkapan Indonesia yang alami tanpa mengubah relasi perkawinan yang dimaksud.
theological_decisions:
- issue: Cakupan dan daya pernyataan Yesus tentang perceraian
  choice: Menerjemahkannya sebagai pernyataan moral umum tanpa menambahkan klausul pengecualian.
  alternative: Menambahkan pengecualian tersirat berdasarkan bagian lain atau membatasi pernyataan ini pada jenis perceraian tertentu.
  rationale: Teks Lukas sendiri menyampaikan pernyataan ringkas dan universal. Kualifikasi yang tidak terdapat dalam ayat ini tidak dimasukkan, sehingga ketegangan antarteks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Demikian juga” mengungkapkan fungsi καί sebagai penghubung dua pernyataan sejajar dan menghindari kalimat majemuk yang terasa berat, tanpa mengubah isinya.
