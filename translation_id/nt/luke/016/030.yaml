  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: id
  text: Tetapi ia berkata, “Tidak, Bapa Abraham, tetapi jika seseorang pergi kepada mereka dari antara orang mati[a], mereka akan bertobat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari orang mati.”
    reason: Alternatif yang lebih ringkas untuk ἀπὸ νεκρῶν.
lexical_decisions:
- source_word: Οὐχί
  choice: Tidak
  rationale: Menandai sanggahan tegas terhadap perkataan Abraham sebelumnya; bentuk ini alami dalam percakapan bahasa Indonesia.
- source_word: πάτερ Ἀβραάμ
  choice: Bapa Abraham
  rationale: Sapaan vokatif yang menunjukkan hubungan Abraham sebagai leluhur, bukan gelar kelembagaan.
- source_word: ἀλλ’ ἐάν
  choice: Namun, jika
  rationale: Mempertahankan koreksi dan pertentangan argumentatif sebelum syarat yang diajukan tokoh itu.
- source_word: τις
  choice: seseorang
  rationale: Mencerminkan kata ganti tak tentu tunggal secara alami.
- source_word: ἀπὸ νεκρῶν
  choice: dari antara orang mati
  rationale: Mengungkapkan dengan jelas gerak keluar dari kalangan orang-orang mati, sambil mempertahankan alternatif ungkapan yang lebih ringkas dalam catatan kaki.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: pergi kepada mereka
  rationale: Mempertahankan verba gerak 'pergi' dan arah menuju orang-orang yang dimaksud.
- source_word: μετανοήσουσιν
  choice: mereka akan bertobat
  rationale: Dalam konteks Lukas, verba ini menyatakan perubahan batin dan arah hidup sebagai tanggapan terhadap peringatan ilahi, bukan sekadar perubahan pendapat.
theological_decisions:
- issue: Makna bahasa pertobatan
  choice: mereka akan bertobat
  alternative: mereka akan mengubah pikiran mereka; mereka akan berbalik
  rationale: Konteksnya adalah tanggapan moral dan rohani terhadap kesaksian serta peringatan Allah. 'Bertobat' mempertahankan bobot makna itu tanpa membatasinya pada perubahan intelektual.
- issue: Arti ἀπὸ νεκρῶν
  choice: dari antara orang mati
  alternative: dari orang mati
  rationale: Ungkapan utama memperjelas bahwa seseorang datang keluar dari kalangan orang mati, tanpa menentukan lebih jauh mekanisme atau sifat kemunculannya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Tanda seru setelah sapaan menyalurkan kuatnya sanggahan Οὐχί tanpa menambahkan unsur doktrinal.
