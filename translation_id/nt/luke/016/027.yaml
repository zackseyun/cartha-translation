  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: id
  text: Lalu ia berkata, “Kalau begitu, aku mohon kepadamu, bapa, utuslah dia ke rumah ayahku,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Lalu ia berkata
  rationale: δέ merupakan penghubung ringan yang melanjutkan alur cerita; “lalu” wajar dalam bahasa Indonesia dan mempertahankan perkembangan narasi.
- source_word: Ἐρωτῶ
  choice: aku mohon
  rationale: ἐρωτάω berarti meminta atau memohon. Dalam konteks permintaan yang sungguh-sungguh ini, “aku mohon” menyampaikan daya ujar secara alami tanpa melebihkannya menjadi permohonan yang sangat mendesak.
- source_word: σε οὖν
  choice: kalau begitu, ... kepadamu
  rationale: οὖν mengaitkan permintaan ini dengan penolakan sebelumnya sebagai kelanjutan atau kesimpulan praktis. “Kalau begitu” menyatakan hubungan itu secara idiomatis; σε diterjemahkan “kepadamu” sebagai sasaran permintaan.
- source_word: πάτερ
  choice: Bapa
  rationale: Sapaan ini ditujukan kepada Abraham sebagai leluhur. “Bapa” merupakan sapaan hormat yang alami dalam konteks ini dan tidak dengan sendirinya menjadikan Abraham sebagai Allah.
- source_word: ἵνα πέμψῃς
  choice: suruhlah dia pergi
  rationale: Sesudah verba permintaan, ἵνα dengan bentuk subjungtif menyatakan isi permintaan. Karena tujuan geraknya disebutkan, “suruhlah dia pergi” terdengar alami dan mempertahankan gagasan bahwa Abraham diminta mengutus Lazarus.
- source_word: αὐτὸν
  choice: dia
  rationale: Kata ganti ini merujuk kepada Lazarus dalam konteks sebelumnya.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: ke rumah ayahku
  rationale: εἰς menyatakan tujuan, sedangkan οἶκος dapat berarti rumah atau rumah tangga. “Ke rumah ayahku” merupakan padanan langsung dan idiomatis.
theological_decisions:
- issue: Sapaan πάτερ kepada Abraham
  choice: Bapa
  alternative: bapa; Ayah
  rationale: Tokoh kaya itu menyapa Abraham sebagai leluhur, bukan menyapa Allah. “Bapa” mempertahankan sapaan kekerabatan yang hormat; kapitalisasi pada awal sapaan langsung mengikuti konvensi ejaan Indonesia dan tidak dimaksudkan sebagai gelar ilahi.
- issue: Daya permintaan Ἐρωτῶ
  choice: aku mohon
  alternative: aku meminta
  rationale: Konteks menunjukkan permohonan yang sungguh-sungguh, tetapi teks tidak perlu dipertegas menjadi ungkapan keputusasaan. “Aku mohon” menjaga daya permintaan tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina “ia” dipakai dalam narasi dan “aku” dalam dialog. Struktur Yunani yang secara harfiah berarti “agar engkau mengutus dia” diungkapkan secara idiomatis sebagai “suruhlah dia pergi,” sementara tujuan ke rumah ayah pembicara tetap jelas.
