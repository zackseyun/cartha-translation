  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: id
  text: Jadi, jika kamu tidak setia dalam hal kekayaan yang tidak benar[a], siapakah yang akan memercayakan kepadamu kekayaan yang sejati[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mamon yang tidak benar.” Dapat juga diterjemahkan: “kekayaan yang tidak adil” atau “kekayaan yang tidak jujur.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang sejati.” Kata “kekayaan” tersirat dari kontras dengan kekayaan pada bagian pertama ayat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: dalam mengelola kekayaan yang tidak benar
  rationale: ἐν menyatakan ranah tempat kesetiaan dibuktikan; penambahan 'mengelola' membuat hubungan penatalayanan tersampaikan secara wajar dalam bahasa Indonesia. μαμωνᾶς berarti kekayaan atau harta, sedangkan ἄδικος mempertahankan warna moral 'tidak benar/tidak adil' tanpa mempersempitnya menjadi hasil penipuan.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: kamu tidak setia
  rationale: Dengan adjektiva predikatif, ἐγένεσθε secara idiomatis menyatakan terbukti atau berada dalam keadaan tertentu. 'Tidak setia' alami dalam konteks penatalayanan dan tetap dekat dengan πιστός.
- source_word: τὸ ἀληθινὸν
  choice: kekayaan yang sejati
  rationale: Adjektiva netral ini digunakan secara substantival tanpa nomina eksplisit. Kontras langsung dengan μαμωνᾶς mendukung pelengkapan 'kekayaan', sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: πιστεύσει
  choice: akan memercayakan
  rationale: Dengan objek yang dipercayakan dan penerima dalam datif, πιστεύω di sini berarti menyerahkan sesuatu sebagai amanat, bukan 'percaya'.
theological_decisions:
- issue: Makna τὸ ἀληθινὸν dalam kontras dengan kekayaan yang tidak benar
  choice: kekayaan yang sejati
  alternative: apa yang sejati; hal yang sejati
  rationale: Bahasa Yunani membiarkan nominanya tersirat, tetapi kontras dengan μαμωνᾶς sangat kuat. Pelengkapan 'kekayaan' menghasilkan bahasa Indonesia yang jelas tanpa menetapkan secara khusus apakah yang dimaksud ialah pahala surgawi, tanggung jawab rohani, atau realitas eskatologis lainnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'kamu' dipakai sebagai bentuk jamak sesuai ὑμῖν dalam konteks ujaran kepada para murid. Bentuk 'siapakah' mempertahankan tekanan retoris teks sumber.
