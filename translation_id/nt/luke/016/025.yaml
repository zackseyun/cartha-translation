  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: id
  text: Namun Abraham berkata, “Anakku, ingatlah bahwa selama hidupmu engkau telah menerima hal-hal yang baik[a], sedangkan Lazarus menerima hal-hal yang buruk. Namun sekarang ia dihibur di sini, sedangkan engkau mengalami penderitaan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menerima sepenuhnya hal-hal yang baik bagimu.” Kata Yunani dapat menyiratkan penerimaan bagian yang telah ditentukan atau penerimaan secara penuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “sangat menderita” atau “disiksa.” Kata Yunani dapat menunjuk pada rasa sakit atau tekanan batin yang hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Anakku
  rationale: Sapaan ini menyatakan keakraban atau belas kasih sekaligus ketimpangan kedudukan, tanpa harus menunjukkan hubungan biologis. “Anakku” merupakan sapaan Indonesia yang alami dan bermartabat.
- source_word: μνήσθητι
  choice: ingatlah
  rationale: Bentuk imperatif ini memanggil lawan bicara untuk mengingat kembali; “ingatlah” adalah padanan langsung dan alami.
- source_word: ἀπέλαβες
  choice: telah menerima
  rationale: Kata kerja ini dapat berarti menerima sesuatu yang menjadi bagian seseorang atau menerimanya sepenuhnya. “Telah menerima” mempertahankan keluasan makna, sementara nuansa alternatif dicatat dalam catatan kaki.
- source_word: τὰ ἀγαθά σου
  choice: hal-hal yang baik
  rationale: Ungkapan ini menunjuk secara luas pada berbagai hal menyenangkan atau menguntungkan yang dinikmati orang kaya, tanpa memasukkan istilah teologis yang lebih khusus seperti “berkat”.
- source_word: ἐν τῇ ζωῇ σου
  choice: selama hidupmu
  rationale: Ungkapan ini secara alami menyatakan jangka waktu kehidupan duniawi.
- source_word: ὁμοίως
  choice: sedangkan Lazarus menerima
  rationale: Dalam bahasa Indonesia, pengulangan kata kerja secara eksplisit dan konjungsi “sedangkan” menyampaikan kesejajaran sekaligus pertentangan yang dalam bahasa Yunani ditandai oleh ὁμοίως.
- source_word: τὰ κακά
  choice: hal-hal yang buruk
  rationale: Frasa ini menunjuk pada pengalaman buruk atau penderitaan Lazarus, bukan kejahatan moral yang dilakukannya. Padanan ini menjaga keluasan ungkapan Yunani.
- source_word: παρακαλεῖται
  choice: dihibur
  rationale: Dalam konteks pembalikan keadaan setelah kematian, bentuk pasif ini menyatakan bahwa Lazarus menerima penghiburan.
- source_word: ὧδε
  choice: di sini
  rationale: Keterangan tempat ini menunjuk pada lokasi Abraham dan Lazarus dalam adegan tersebut.
- source_word: ὀδυνᾶσαι
  choice: menderita kesakitan
  rationale: Kata ini menyatakan rasa sakit atau penderitaan yang berat, baik jasmani maupun batin. Pilihan ini mempertahankan kenyataan penderitaan tanpa menentukan lebih jauh sumber atau pelakunya.
theological_decisions:
- issue: Bahasa mengenai penderitaan setelah kematian
  choice: engkau menderita kesakitan
  alternative: engkau disiksa; engkau sangat menderita
  rationale: Ayat ini menggambarkan penderitaan sadar setelah kematian, tetapi bentuk Yunani tidak dengan sendirinya menetapkan adanya pelaku penyiksaan. “Menderita kesakitan” mempertahankan bobot penderitaan sekaligus tidak mempersempit ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Sapaan “Anakku” menjaga kelembutan Τέκνον. Struktur pertentangan dibuat alami dengan “sedangkan” dan “namun sekarang,” tanpa menghilangkan pembalikan keadaan yang ditekankan teks.
