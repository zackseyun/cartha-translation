  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: id
  text: Lalu tuannya memuji pengelola yang tidak adil itu karena ia telah bertindak dengan cerdik. Sebab, anak-anak zaman ini lebih cerdik dalam berurusan dengan generasi mereka sendiri daripada anak-anak terang.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuhan memuji pengelola yang tidak adil itu.” Di sini “tuannya” lebih mungkin menunjuk kepada tuan dalam perumpamaan.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “anak-anak zaman ini lebih cerdik daripada anak-anak terang terhadap generasi mereka sendiri.” Frasa Yunani pada bagian akhir sulit dipastikan; terjemahan utama mengungkapkan kemungkinan makna bertindak cerdik dalam hubungan dengan kalangan atau generasi mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: tuannya
  rationale: Dalam konteks langsung perumpamaan, frasa ini paling wajar menunjuk kepada tuan si pengelola. Bentuk posesif memperjelas hubungan tersebut tanpa menutup kemungkinan terjemahan harfiah 'Tuhan' yang dicatat dalam catatan kaki.
- source_word: τὸν οἰκονόμον τῆς ἀδικίας
  choice: pengelola yang tidak benar itu
  rationale: '''Pengelola'' merupakan istilah Indonesia modern bagi orang yang mengurus harta atau rumah tangga. Ungkapan ''yang tidak benar'' mempertahankan penilaian moral ἀδικία tanpa mempersempitnya hanya menjadi ketidakjujuran.'
- source_word: φρονίμως / φρονιμώτεροι
  choice: dengan cerdik / lebih cerdik
  rationale: '''Cerdik'' menyatakan kecakapan praktis dan kelihaian dalam mencapai tujuan tanpa dengan sendirinya memberi persetujuan moral seperti yang mungkin tersirat oleh ''bijaksana''.'
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: anak-anak zaman ini
  rationale: Terjemahan ini mempertahankan metafora Semitis 'anak-anak' dan kontras formalnya dengan 'anak-anak terang', sekaligus memakai 'zaman' untuk αἰών.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: anak-anak terang
  rationale: Mempertahankan metafora sumber dan kesejajarannya dengan 'anak-anak zaman ini'; frasa ini menunjuk kepada mereka yang bercirikan atau terkait dengan terang.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: dalam berurusan dengan generasi mereka sendiri
  rationale: Frasa Yunani ini sulit dan secara harfiah berarti kira-kira 'terhadap/untuk generasi mereka sendiri'. Rumusan utama menyampaikan kemungkinan makna relasionalnya dalam bahasa Indonesia yang alami, sedangkan bentuk yang lebih harfiah dicatat.
theological_decisions:
- issue: Identitas ὁ κύριος pada klausa pertama
  choice: tuan dalam perumpamaan
  alternative: Tuhan, yakni Yesus atau Allah
  rationale: Konteks naratif terdekat menunjuk kepada tuan si pengelola. Pilihan ini tidak menjadikan pujian tersebut sebagai persetujuan moral langsung dari Yesus, tetapi ambiguitas leksikal κύριος tetap diakui dalam catatan kaki.
- issue: Penilaian moral atas tindakan pengelola
  choice: kecerdikannya dipuji, sedangkan ketidakbenarannya tidak dibenarkan
  alternative: tindakannya dipuji sebagai kebijaksanaan yang secara moral benar
  rationale: Teks secara bersamaan menyebutnya berkaitan dengan ἀδικία dan mengatakan bahwa ia bertindak φρονίμως. 'Cerdik' serta 'tidak benar' mempertahankan ketegangan itu tanpa menyelesaikannya secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Metafora 'anak-anak zaman ini' dan 'anak-anak terang' dipertahankan karena penting bagi kesejajaran sumber. Penanda catatan kaki ditempatkan pada bagian yang berkaitan dengan dua ambiguitas utama.
