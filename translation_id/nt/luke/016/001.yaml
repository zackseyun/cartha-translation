  to: Ia juga berkata kepada murid-murid-Nya, “Ada seorang kaya yang mempunyai seorang pengelola[a]. Pengelola itu diadukan kepada orang kaya itu karena menghambur-hamburkan harta milik orang kaya itu.”
  rationale: Revisi menjelaskan bahwa pengelola adalah pihak yang diadukan kepada pemilik, bukan pihak yang membuat laporan, dan bahwa harta yang dihambur-hamburkan adalah milik orang kaya itu. Catatan kaki b dipertahankan sebagai alternatif leksikal, tetapi dirumuskan ulang agar arah laporan jelas. Tidak ada perubahan terhadap ambiguitas apakah pengaduan itu benar.
