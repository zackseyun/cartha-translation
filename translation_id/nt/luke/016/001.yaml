    text: Atau “pengurus rumah tangga” atau “penatalayan”; istilah Yunani ini menunjuk kepada orang yang dipercayai mengawasi dan mengurus rumah tangga atau harta milik seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “dilaporkan kepada orang kaya itu” atau “dituduh di hadapannya.” Kata kerjanya dapat menunjuk kepada tuduhan atau laporan yang merugikan, bukan tuduhan yang sudah terbukti.
    reason: lexical_alternative
