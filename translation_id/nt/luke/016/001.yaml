review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok tersampaikan dengan baik: seorang kaya memiliki seorang pengelola yang menerima laporan/tuduhan bahwa ia menyia-nyiakan harta tuannya. Namun, “Pengelola itu dilaporkan kepadanya” dalam bahasa Indonesia dapat terbaca seolah-olah pengelola itu sendiri menyampaikan laporan kepada orang kaya tersebut. Selain itu, “harta miliknya” berpotensi secara lokal merujuk kepada pengelola, bukan kepada orang kaya, padahal αὐτοῦ merujuk kepada orang kaya itu.'
  naturalness: Pembukaan dan register sudah modern serta wajar. Mengganti konstruksi pasif yang rancu dengan “diadukan kepada orang kaya itu” membuat hubungan antarpelaku dan arah pengaduan jelas tanpa menguatkan tuduhan itu sebagai fakta.
  terminology: “Pengelola” merupakan padanan modern yang baik untuk οἰκονόμος; alternatif “pengurus rumah tangga” dan “penatalayan” dalam catatan kaki berguna. Istilah “diadukan” mempertahankan nuansa laporan atau tuduhan yang merugikan dan tidak menyiratkan bahwa tuduhan tersebut telah terbukti.
  issues:
  - severity: medium
    issue: Konstruksi “Pengelola itu dilaporkan kepadanya” ambigu dalam bahasa Indonesia.
    rationale: Bentuk ini dapat dipahami bahwa pengelola itu melapor kepada orang kaya tersebut, bukan bahwa ada orang lain mengadukan pengelola itu kepada pemilik. Yunani διεβλήθη αὐτῷ menyatakan bahwa pengelola itu menjadi sasaran laporan/tuduhan yang disampaikan kepada orang kaya itu.
  - severity: medium
    issue: Frasa “harta miliknya” memiliki rujukan pronomina yang berpotensi ambigu.
    rationale: Dalam urutan bahasa Indonesia, “miliknya” dapat dikaitkan dengan “pengelola itu.” Teks Yunani mengacu pada milik orang kaya tersebut; penyebutan eksplisit menghindari perubahan pelaku pemilik harta.
  revised_text: Ia juga berkata kepada murid-murid-Nya, “Ada seorang kaya yang mempunyai seorang pengelola[a]. Pengelola itu diadukan kepada orang kaya itu karena menghambur-hamburkan harta milik orang kaya itu.”
  revised_footnotes:
