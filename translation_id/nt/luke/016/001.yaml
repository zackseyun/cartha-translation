  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: id
  text: Ia juga berkata kepada murid-murid-Nya, “Ada seorang kaya yang mempunyai seorang pengelola[a]. Pengelola itu diadukan kepada orang kaya itu karena menghambur-hamburkan harta milik orang kaya itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengurus rumah tangga” atau “penatalayan”; istilah Yunani ini menunjuk kepada orang yang dipercayai mengawasi dan mengurus rumah tangga atau harta milik seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: berkata
  rationale: Bentuk imperfek berfungsi sebagai latar naratif. Dalam bahasa Indonesia, bentuk sederhana “berkata” lebih alami karena aspek berkelanjutan tidak perlu selalu dinyatakan secara eksplisit.
- source_word: δὲ καὶ
  choice: juga
  rationale: καί dinyatakan dengan “juga,” sedangkan δέ sebagai penanda peralihan tidak diterjemahkan secara tersendiri agar kalimat tetap alami.
- source_word: πρὸς τοὺς μαθητάς
  choice: kepada murid-murid-Nya
  rationale: Ungkapan ini berarti “kepada para murid.” Akhiran “-Nya” memperjelas rujukan kepada murid-murid Yesus dari konteks, sebagaimana lazim dalam bahasa Indonesia.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Ada seorang kaya
  rationale: Ini merupakan pembukaan naratif yang alami dalam bahasa Indonesia dan mempertahankan sifat tak tentu dari τις.
- source_word: οἰκονόμον
  choice: pengelola
  rationale: Istilah ini menunjuk kepada orang yang dipercayai mengurus rumah tangga, harta, atau tanah milik orang lain. “Pengelola” jelas dan modern tanpa mempersempitnya hanya pada satu jenis aset.
- source_word: οὗτος
  choice: Pengelola itu
  rationale: Pengulangan nomina memperjelas rujukan demonstratif dan mempertahankan penekanan pada orang tersebut.
- source_word: διεβλήθη αὐτῷ
  choice: dilaporkan kepadanya
  rationale: Bentuk pasif διαβάλλω dapat berarti dituduh, diadukan, atau dilaporkan secara merugikan. Pilihan ini mempertahankan bahwa laporan tersebut belum tentu terbukti.
- source_word: ὡς διασκορπίζων
  choice: karena menghambur-hamburkan
  rationale: Partisipium menyatakan isi atau dasar laporan. “Menghambur-hamburkan” secara idiomatis menyampaikan pemborosan atau penyia-nyiaan aset.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: harta miliknya
  rationale: Frasa ini menunjuk kepada harta atau kepunyaan orang kaya itu; bentuk ini alami dan cukup luas untuk konteks pengelolaan kekayaan.
