source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: id
  text: Lalu ia memanggil pengelola itu dan berkata kepadanya, “Apa ini yang kudengar tentang engkau? Serahkan pertanggungjawaban atas pengelolaanmu,[a] karena engkau tidak dapat lagi menjadi pengelola.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berikan laporan tentang pengelolaanmu” atau “Serahkan perhitungan pengelolaanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “karena engkau tidak dapat lagi mengelola.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: ia memanggil pengelola itu
  rationale: Partisip aoris menyatakan tindakan yang mendahului kata kerja utama. Objek pronominal diperjelas secara alami dari konteks sebagai pengelola tanpa mengubah acuannya.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Apa ini yang kudengar tentang engkau?
  rationale: Mempertahankan bentuk pertanyaan retoris Yunani dan nuansa laporan yang telah sampai kepada sang tuan.
- source_word: ἀπόδος τὸν λόγον
  choice: Serahkan pertanggungjawaban
  rationale: Dalam konteks administrasi, λόγος menunjuk pada laporan atau perhitungan yang harus diberikan. 'Pertanggungjawaban' menyampaikan tuntutan untuk membuat perhitungan akhir secara wajar dalam bahasa Indonesia.
- source_word: τῆς οἰκονομίας σου
  choice: atas pengelolaanmu
  rationale: οἰκονομία di sini adalah tanggung jawab mengurus rumah tangga atau harta milik orang lain; 'pengelolaan' alami dan cukup luas untuk mencakup tugas serta administrasinya.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: karena engkau tidak dapat lagi menjadi pengelola
  rationale: δύνῃ dengan infinitif menyatakan ketidakmampuan atau hilangnya kewenangan untuk melanjutkan fungsi tersebut, sedangkan ἔτι berarti 'lagi'. Ungkapan ini mempertahankan kaitan leksikal dengan jabatan pengelola.
theological_decisions:
- issue: Apakah οὐ δύνῃ menyatakan ketidakmampuan praktis atau pencabutan izin/jabatan
  choice: tidak dapat lagi menjadi pengelola
  alternative: tidak boleh lagi mengelola
  rationale: Teks Yunani secara harfiah menyatakan 'tidak dapat lagi', tetapi dalam konteks pemecatan dapat menyiratkan hilangnya kewenangan. Terjemahan utama mempertahankan bentuk kemampuan tanpa mempersempitnya menjadi larangan semata.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Engkau' dipakai untuk dialog tunggal sesuai register naratif Alkitab. Pengulangan 'pengelolaan/pengelola' sengaja dipertahankan untuk mencerminkan hubungan οἰκονομία–οἰκονομεῖν.
