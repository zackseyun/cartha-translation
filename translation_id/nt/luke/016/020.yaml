  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: id
  text: Seorang miskin bernama Lazarus telah diletakkan di pintu gerbang orang kaya itu[a], tubuhnya penuh dengan borok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dilemparkan di pintu gerbang orang kaya itu.” Kata kerja Yunani ini dapat berarti “dilemparkan” atau “diletakkan” dan mungkin menekankan ketidakberdayaan Lazarus serta pengabaian terhadapnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dipenuhi borok.” Partisipel Yunani ini menunjukkan bahwa Lazarus menderita borok atau luka-luka sejenis.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: seorang miskin
  rationale: Menunjukkan orang yang miskin atau melarat tanpa mempersempit maknanya menjadi pengemis.
- source_word: τις
  choice: seorang
  rationale: Memperkenalkan tokoh baru secara wajar dalam bahasa Indonesia; unsur ketakrifannya sudah terungkap melalui kata 'seorang'.
- source_word: ὀνόματι Λάζαρος
  choice: bernama Lazarus
  rationale: Padanan idiomatis dan langsung bagi konstruksi datif yang menyatakan nama.
- source_word: ἐβέβλητο
  choice: telah dibaringkan
  rationale: 'Mempertahankan bentuk pasif dan keadaan yang telah terjadi: Lazarus ditempatkan di sana oleh pihak lain. Alternatif yang lebih keras dicantumkan dalam catatan.'
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: di dekat pintu gerbang orang kaya itu
  rationale: Mengungkapkan posisi Lazarus pada akses masuk kediaman orang kaya; rujukan pronomina diperjelas secara alami dari konteks.
- source_word: εἱλκωμένος
  choice: tubuhnya penuh dengan luka bernanah
  rationale: Mengungkapkan keadaan menderita luka-luka atau borok secara jelas dalam bahasa Indonesia modern tanpa memakai istilah medis yang kaku.
