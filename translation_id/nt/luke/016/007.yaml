  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Sapaan 'kamu' mempertahankan bentuk tunggal langsung, sedangkan 'Kalau kamu' menyampaikan penekanan dan peralihan dalam Σὺ δὲ secara alami. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan.
