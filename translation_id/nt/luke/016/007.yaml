base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: id
  text: Kemudian ia berkata kepada orang lain, ‘Dan kamu, berapa utangmu?’ Orang itu menjawab, ‘Seratus kor[a] gandum.’ Ia berkata kepadanya, ‘Ambillah surat utangmu[b] dan tulislah delapan puluh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kor adalah satuan takaran kering kuno berukuran besar yang digunakan untuk biji-bijian.
    reason: cultural_note
  - marker: b
    text: Atau “dokumen tertulismu” atau “catatan utangmu”; secara harfiah, bahasa Yunani memakai bentuk jamak “tulisan-tulisanmu” (τὰ γράμματα), yang di sini merujuk pada dokumen atau catatan tertulis mengenai utang orang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Kemudian
  rationale: Menandai urutan peristiwa dan peralihan kepada orang berutang berikutnya secara alami dalam bahasa Indonesia.
- source_word: ἑτέρῳ
  choice: kepada orang lain
  rationale: Menunjukkan orang lain yang berbeda dari orang berutang sebelumnya, tanpa menambahkan keterangan yang tidak dinyatakan dalam teks.
- source_word: Σὺ δὲ
  choice: Kalau kamu
  rationale: Menampilkan penekanan pada kata ganti serta peralihan ringan kepada orang kedua dengan ungkapan Indonesia yang alami.
- source_word: πόσον ὀφείλεις
  choice: berapa utangmu
  rationale: Mengungkapkan kewajiban keuangan secara ringkas dan jelas.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Seratus kor gandum
  rationale: Mempertahankan nama satuan kuno yang khusus, sedangkan σῖτος dalam konteks ini secara tepat diterjemahkan sebagai gandum.
- source_word: λέγει αὐτῷ
  choice: Ia berkata kepadanya
  rationale: Bahasa Indonesia tidak menandai perbedaan kala lampau dan kini pada verba; bentuk ini alami dalam narasi dan tidak menambahkan informasi kala.
- source_word: Δέξαι
  choice: Ambillah
  rationale: Perintah ini meminta orang tersebut mengambil atau menerima dokumen utangnya; 'ambillah' jelas dan wajar dalam konteks.
- source_word: σου τὰ γράμματα
  choice: surat utangmu
  rationale: Walaupun secara harfiah berarti 'tulisan-tulisan/dokumen-dokumenmu', dalam konteks utang ungkapan ini merujuk pada dokumen tertulis yang mencatat utang. Bentuk fungsional tunggal lebih alami dalam bahasa Indonesia.
- source_word: γράψον ὀγδοήκοντα
  choice: tulislah delapan puluh
  rationale: Mempertahankan tindakan menulis angka pengganti sebagaimana dinyatakan dalam bahasa Yunani, tanpa mengubahnya menjadi parafrasa yang lebih tafsiriah.
