  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: id
  text: Sebab aku mempunyai lima saudara laki-laki, agar ia sungguh-sungguh memperingatkan mereka, supaya mereka juga tidak datang ke tempat siksaan ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi kesaksian dengan sungguh-sungguh kepada mereka” atau “memperingatkan mereka dengan tegas.” Kata Yunani yang digunakan dapat berarti memberikan kesaksian atau peringatan secara sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: Sebab aku mempunyai
  rationale: γάρ menjelaskan alasan bagi permohonan pada ayat sebelumnya, sedangkan ἔχω berarti mempunyai. “Sebab” mempertahankan hubungan penjelas itu secara alami dalam bahasa Indonesia.
- source_word: πέντε ἀδελφούς
  choice: lima saudara laki-laki
  rationale: ἀδελφούς berbentuk jamak maskulin dan dalam konteks ini menunjuk kepada saudara kandung laki-laki; terjemahan ini mempertahankan ketepatan gender.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: Biarlah dia memperingatkan mereka dengan sungguh-sungguh
  rationale: ὅπως menyatakan tujuan permohonan sebelumnya. διαμαρτύρομαι dapat berarti memberi kesaksian dengan sungguh-sungguh atau memperingatkan dengan tegas; konteks bahaya yang harus dihindari mendukung nuansa peringatan. Pemisahan menjadi kalimat baru dan penggunaan “Biarlah” menghasilkan bahasa Indonesia yang alami sekaligus tetap bergantung secara makna pada permohonan sebelumnya.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: supaya mereka juga tidak datang
  rationale: ἵνα μή menyatakan tujuan negatif, dan καὶ αὐτοὶ menekankan bahwa mereka juga dapat mengalami nasib yang sama.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: ke tempat siksaan ini
  rationale: εἰς menyatakan tujuan gerak, sedangkan βάσανος menunjuk pada penderitaan atau siksaan berat. Frasa ini mempertahankan gambaran teks tanpa menambahkan uraian doktrinal tentang alam sesudah kematian.
theological_decisions:
- issue: Penggambaran tempat dalam kehidupan sesudah kematian menurut ucapan orang kaya
  choice: tempat siksaan ini
  alternative: tempat penderitaan ini; tempat kesengsaraan ini
  rationale: βάσανος menggambarkan keadaan yang dialami sebagai siksaan berat. “Tempat siksaan ini” mempertahankan intensitas istilah Yunani tanpa mengembangkan gambaran tersebut menjadi sistem doktrinal yang tidak dinyatakan dalam ayat ini.
- issue: Nuansa διαμαρτύρηται
  choice: memperingatkan mereka dengan sungguh-sungguh
  alternative: memberi kesaksian dengan sungguh-sungguh kepada mereka
  rationale: Konteks tujuan—agar kelima saudara itu tidak datang ke tempat siksaan—mendukung fungsi peringatan, tetapi catatan kaki mempertahankan kemungkinan nuansa kesaksian yang sungguh-sungguh.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Saudara laki-laki” dipakai untuk ketepatan gender. “Siksaan” mempertahankan bobot βάσανος tanpa memasukkan istilah teologis tambahan.
