  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: id
  text: Namun Abraham berkata, “Mereka mempunyai Musa dan para nabi[a]; hendaklah mereka mendengarkan Musa dan para nabi itu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Musa dan para nabi” menunjuk kepada kesaksian Kitab Suci yang dikaitkan dengan Musa dan kitab-kitab para nabi.
    reason: cross_reference
  - marker: b
    text: Atau, secara lebih harfiah, “hendaklah mereka mendengar mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Namun ... berkata
  rationale: Bentuk kini historis λέγει dialihkan dengan bentuk lampau naratif yang wajar dalam bahasa Indonesia, sedangkan δέ menyatakan peralihan yang agak kontras dalam jawaban Abraham.
- source_word: Ἔχουσι
  choice: Mereka memiliki
  rationale: Menunjukkan bahwa saudara-saudara orang kaya itu sudah mempunyai akses kepada kesaksian tersebut.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Musa dan Kitab Para Nabi
  rationale: Ungkapan ini secara metonimis menunjuk kepada kesaksian Kitab Suci yang dikaitkan dengan Musa dan kumpulan kitab para nabi. Penambahan 'Kitab' memperjelas rujukan korpus tulisan dalam bahasa Indonesia tanpa memperluasnya menjadi 'Taurat Musa'.
- source_word: ἀκουσάτωσαν
  choice: hendaklah mereka mendengarkan
  rationale: Imperatif orang ketiga jamak diterjemahkan dengan 'hendaklah' untuk mempertahankan daya perintah, sementara 'mendengarkan' menyiratkan perhatian dan tanggapan, bukan sekadar mendengar bunyi.
- source_word: αὐτῶν
  choice: keduanya
  rationale: Pronomina genitif ini merujuk kembali kepada dua unsur kolektif, Musa dan Kitab Para Nabi; 'keduanya' menghasilkan ungkapan Indonesia yang alami sambil mempertahankan personifikasi sumber kesaksian tersebut.
theological_decisions:
- issue: Rujukan “Musa dan Kitab Para Nabi”
  choice: Ungkapan metonimis bagi kesaksian Kitab Suci yang telah tersedia bagi saudara-saudara orang kaya itu.
  alternative: Rujukan sempit hanya kepada Musa dan para nabi sebagai tokoh-tokoh sejarah.
  rationale: Pemakaian Yahudi dan Lukas mendukung rujukan kepada Kitab Suci. Teks utama tetap mempertahankan bentuk ungkapannya dan tidak menggantinya dengan penafsiran yang lebih panjang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menandai kontras jawaban; 'hendaklah' mempertahankan kekuatan imperatif. Kapitalisasi 'Kitab Para Nabi' menandai kumpulan tulisan suci, bukan sekadar para nabi secara umum.
