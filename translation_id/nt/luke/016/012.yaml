  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: id
  text: Dan jika kamu tidak setia dalam hal milik orang lain,[a][b] siapa yang akan memberikan kepadamu apa yang menjadi milikmu sendiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dalam milik orang lain.”'
    reason: lexical_alternative
  - marker: b
    text: Kontras ini mungkin merujuk pada kesetiaan dalam menggunakan kekayaan duniawi sekarang dan penerimaan kekayaan sejati atau kekal kelak; ayat ini sendiri tidak menyebutkan rujukannya secara tegas.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ
  choice: Dan jika
  rationale: Mempertahankan hubungan dengan perkataan sebelumnya dan memperkenalkan syarat secara wajar dalam bahasa Indonesia.
- source_word: ἐν τῷ ἀλλοτρίῳ
  choice: dalam mengurus milik orang lain
  rationale: ἀλλότριος yang dipakai secara substantival menunjuk pada sesuatu yang menjadi milik orang lain. Tambahan idiomatis 'mengurus' menyatakan ranah kesetiaan dalam konteks penatalayanan tanpa menentukan benda yang dimaksud.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: kamu tidak setia
  rationale: πιστός di sini menyatakan kesetiaan atau keterandalan dalam penatalayanan, bukan tindakan percaya; bentuk γίνομαι diterjemahkan secara idiomatis.
- source_word: τὸ ὑμέτερον
  choice: apa yang menjadi milikmu sendiri
  rationale: Bentuk netral substantival berarti 'apa yang menjadi milikmu' dan mempertahankan kontras dengan milik orang lain.
- source_word: τίς δώσει ὑμῖν
  choice: siapa yang akan memberikan kepadamu
  rationale: Mengikuti makna biasa δίδωμι, 'memberikan', alih-alih mempersempitnya menjadi 'memercayakan', sekaligus mempertahankan pertanyaan retoris.
theological_decisions:
- issue: Rujukan kontras antara milik orang lain dan milik sendiri
  choice: Membiarkan kedua rujukan itu tidak ditentukan dalam teks utama.
  alternative: Menafsirkannya secara khusus sebagai kekayaan duniawi sekarang dibandingkan dengan kekayaan sejati atau warisan pada masa mendatang.
  rationale: Ayat ini menyatakan kontras tersebut tanpa secara eksplisit mengidentifikasi kedua rujukannya. Terjemahan mempertahankan ambiguitas dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kamu' dipakai sebagai sapaan jamak yang alami dalam wacana Yesus kepada para murid; 'kepadamu' mempertahankan bentuk sapaan yang sama. Susunan kalimat menjaga kesejajaran antara milik orang lain dan milik sendiri.
