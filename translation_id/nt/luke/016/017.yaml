  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: id
  text: Namun, lebih mudah langit dan bumi berlalu daripada satu goresan huruf pun dari Taurat hilang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “satu tanda kecil”; yang dimaksud ialah goresan sangat kecil yang membedakan satu huruf dari huruf lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: lebih mudah
  rationale: Bentuk komparatif ini menyatakan bahwa sesuatu lebih mudah atau lebih mungkin terjadi; “lebih mudah” alami dan mempertahankan perbandingannya.
- source_word: δέ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan dengan konteks sebelumnya; “Namun” menyampaikan nuansa adversatif secara wajar.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: langit dan bumi
  rationale: Ungkapan ini merupakan merisme baku bagi seluruh tatanan ciptaan dan mempertahankan idiom alkitabiah.
- source_word: παρελθεῖν
  choice: berlalu
  rationale: Dalam konteks ini kata tersebut menunjuk pada lenyap atau berlalunya langit dan bumi, bukan sekadar bergerak melewati sesuatu.
- source_word: τοῦ νόμου
  choice: dalam Taurat
  rationale: Dalam konteks Yahudi di Lukas, νόμος paling wajar merujuk kepada Taurat sebagai hukum yang diwahyukan dalam Kitab Suci; “Taurat” lebih jelas dalam bahasa Indonesia daripada “Hukum” yang dapat terdengar umum.
- source_word: μίαν κεραίαν
  choice: satu goresan kecil pada satu huruf
  rationale: κεραία adalah tonjolan atau goresan sangat kecil yang menjadi bagian dari bentuk huruf. Frasa ini jelas bagi pembaca modern dan mempertahankan gambaran tulisan.
- source_word: πεσεῖν
  choice: gugur
  rationale: Kata ini secara harfiah berarti “jatuh”; “gugur” mempertahankan citra tersebut sambil dapat menyiratkan hilang atau tidak berlaku dalam konteks ini.
theological_decisions:
- issue: Referen νόμος
  choice: Taurat sebagai hukum yang diwahyukan dalam Kitab Suci
  alternative: hukum dalam arti umum
  rationale: Konteks Lukas dan perbandingan dengan langit dan bumi mendukung rujukan khusus kepada Taurat. Pilihan ini menandai referennya tanpa menambahkan kesimpulan mengenai cara keberlakuannya.
- issue: Makna κεραία
  choice: goresan kecil pada satu huruf
  alternative: titik; tanda kecil
  rationale: Ayat ini menekankan rincian tertulis yang amat kecil. Terjemahan deskriptif menjaga gambaran itu tanpa memakai istilah yang kabur atau kuno.
- issue: Nuansa πεσεῖν
  choice: gugur
  alternative: hilang; menjadi tidak berlaku
  rationale: “Gugur” menjaga metafora ‘jatuh’ serta ketegangan antara hilangnya bagian tulisan dan gagalnya keberlakuannya, tanpa menentukan satu tafsiran saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan komparatif dipertahankan, sementara “Taurat” dipakai untuk memperjelas referen νόμος bagi pembaca Indonesia. Penanda catatan kaki [a] dicantumkan dalam teks utama.
