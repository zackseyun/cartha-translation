translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan dua kalimat dipilih agar gambaran tentang pakaian dan gaya hidup terbaca jelas, sementara aspek kebiasaan tetap dipertahankan melalui “selalu” dan “setiap hari”.
