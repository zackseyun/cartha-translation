  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: id
  text: Ada seorang laki-laki kaya yang biasa mengenakan pakaian ungu dan linen halus. Setiap hari ia bersenang-senang dalam kemewahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap hari ia berpesta dengan mewah.” Kata Yunani yang diterjemahkan “bersenang-senang” dapat mencakup kegembiraan dalam pesta atau jamuan, sedangkan ungkapan “dalam kemewahan” menekankan kemegahan hidupnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: Ada seorang
  rationale: Ungkapan ini memperkenalkan seorang tokoh yang belum disebutkan secara idiomatis. Kata δέ berfungsi sebagai peralihan naratif dan tidak perlu diterjemahkan dengan kata temporal seperti “sekarang”.
- source_word: πλούσιος
  choice: kaya
  rationale: Kata sifat ini secara langsung menunjuk pada kekayaan materi; “kaya” merupakan padanan Indonesia yang paling wajar.
- source_word: ἐνεδιδύσκετο
  choice: selalu mengenakan
  rationale: Bentuk imperfek menyatakan kebiasaan pada masa lampau; “selalu mengenakan” menyampaikan tindakan yang dilakukan secara tetap.
- source_word: πορφύραν καὶ βύσσον
  choice: pakaian dari kain ungu dan linen halus
  rationale: πορφύρα secara metonimis menunjuk pada pakaian berwarna atau berbahan ungu, sedangkan βύσσος adalah linen bermutu tinggi. Ungkapan ini mempertahankan penanda kemewahan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: εὐφραινόμενος
  choice: bersenang-senang
  rationale: Partisip ini berarti menikmati diri, bergembira, atau berpesta. “Bersenang-senang” mempertahankan keluasan maknanya tanpa memastikan bahwa kegiatan itu hanya berupa jamuan makan.
- source_word: καθ’ ἡμέραν
  choice: setiap hari
  rationale: Ini adalah ungkapan lazim untuk sesuatu yang berlangsung setiap hari.
- source_word: λαμπρῶς
  choice: dalam kemewahan
  rationale: Dalam konteks ini, adverbia tersebut menggambarkan cara hidup yang megah dan mewah, bukan sekadar sesuatu yang bercahaya.
