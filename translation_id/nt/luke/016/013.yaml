id: LUK.16.13
reference: Luke 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: id
  text: Tidak seorang pun pelayan rumah tangga dapat mengabdi kepada dua tuan. Sebab, ia akan membenci yang satu dan mengasihi yang lain, atau berpegang erat kepada yang satu dan memandang hina yang lain. Kalian tidak dapat mengabdi kepada Allah dan Mamon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekayaan” atau “uang”. Teks Yunani memakai Mamon, istilah bagi kekayaan yang di sini digambarkan sebagai tuan saingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: pelayan rumah tangga
  rationale: Istilah ini menunjuk kepada seorang pelayan yang berada dalam lingkup rumah tangga. Pilihan ini mempertahankan latar domestik dan hubungan dengan tuan tanpa mengaburkannya menjadi sekadar pekerja umum.
- source_word: κυρίοις
  choice: tuan
  rationale: Dalam perumpamaan sosial ini, κύριος berarti orang yang berkuasa atas pelayan. 'Tuan' sesuai dengan konteks rumah tangga dan tetap membedakannya dari sebutan ilahi.
- source_word: δουλεύειν
  choice: mengabdi
  rationale: Kata kerja ini berarti melayani dalam kedudukan sebagai hamba atau pelayan. 'Mengabdi' secara alami menyampaikan ketundukan dan kesetiaan yang dituntut oleh seorang tuan, baik dalam gambaran rumah tangga maupun dalam kontras antara Allah dan Mamon.
- source_word: μισήσει
  choice: membenci
  rationale: Makna biasa kata ini adalah 'membenci'. Pilihan tersebut mempertahankan kontras retoris yang kuat dengan 'mengasihi' dan tidak melunakkannya menjadi sekadar kurang menyukai.
- source_word: ἀγαπήσει
  choice: mengasihi
  rationale: Ini mempertahankan makna langsung ἀγαπάω serta antitesisnya dengan 'membenci' dalam gaya yang bermartabat.
- source_word: ἀνθέξεται
  choice: berpegang erat kepada
  rationale: Bentuk ini menyatakan tindakan berpaut, berpegang teguh, atau melekat kepada salah satu pihak. 'Berpegang erat kepada' mempertahankan citra dan menyampaikan kesetiaan relasional dengan jelas.
- source_word: καταφρονήσει
  choice: memandang hina
  rationale: Kata ini berarti meremehkan atau memperlakukan dengan penghinaan. 'Memandang hina' kuat, jelas, dan berpasangan alami dengan tindakan berpegang erat kepada pihak lain.
- source_word: θεῷ
  choice: Allah
  rationale: Ini adalah objek datif yang jelas dari 'mengabdi'; 'Allah' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: μαμωνᾷ
  choice: Mamon
  rationale: Istilah pinjaman ini menunjuk kepada kekayaan dan di sini tampil seolah-olah sebagai tuan saingan. Mempertahankan 'Mamon' menjaga daya personifikasinya; catatan kaki menjelaskan maknanya bagi pembaca modern.
- source_word: δύνασθε
  choice: Kalian tidak dapat
  rationale: Bentuk Yunani ini adalah orang kedua jamak. 'Kalian' membuat sapaan jamaknya terang dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penyajian μαμωνᾷ sebagai lawan Allah
  choice: Mamon
  alternative: kekayaan atau uang
  rationale: Ayat ini menempatkan Allah dan Mamon sebagai dua tuan yang menuntut pengabdian. Transliterasi mempertahankan personifikasi dan ketegangan retoris itu tanpa menyatakan bahwa Mamon adalah ilah harfiah.
- issue: Kekuatan kontras μισήσει dan ἀγαπήσει
  choice: membenci ... mengasihi
  alternative: kurang mengasihi ... mengasihi
  rationale: Bahasa Yunani memakai antitesis yang tajam. Terjemahan langsung mempertahankan kekuatan peribahasa dan tidak secara diam-diam menafsirkannya hanya sebagai tingkat kesukaan.
- issue: Subjek tunggal generik dalam dua pasangan tindakan
  choice: ia akan membenci ... mengasihi, atau berpegang erat ... memandang hina
  alternative: pelayan itu akan membenci ...; mereka akan membenci ...
  rationale: Bentuk-bentuk Yunani adalah tunggal dan menggambarkan seorang pelayan secara representatif. 'Ia' mempertahankan jumlah gramatikal tanpa menambahkan jenis kelamin yang tidak perlu dalam bahasa Indonesia; penghilangan 'ia' pada pasangan kedua tetap alami dan memiliki subjek yang sama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Pelayan rumah tangga' menjaga latar domestik, sedangkan 'mengabdi' mempertahankan gagasan ketundukan kepada tuan. Sapaan 'kalian' dipakai untuk menandai bentuk orang kedua jamak Yunani secara eksplisit.
