  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: id
  text: Ia akan datang dan membinasakan para penggarap kebun anggur itu,[a] lalu memberikan kebun anggur itu kepada orang lain.” Ketika mendengar hal itu, mereka berkata, “Jangan sampai itu terjadi!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para petani” atau “para penyewa”. Istilah Yunaninya menunjuk kepada orang-orang yang mengusahakan tanah milik orang lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “Sama sekali tidak!” Ungkapan Yunani ini menyatakan penolakan yang sangat kuat; secara harfiah, “Kiranya itu tidak terjadi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Ia akan datang
  rationale: Menerjemahkan bentuk futur ἔρχομαι secara langsung tanpa menambahkan gagasan ‘kembali’ yang tidak dinyatakan.
- source_word: ἀπολέσει
  choice: membinasakan
  rationale: Menjaga kerasnya tindakan penghakiman sekaligus mempertahankan cakupan makna ἀπόλλυμι, yang dapat berarti menghancurkan atau membunuh.
- source_word: γεωργοὺς
  choice: para penggarap kebun anggur
  rationale: Dalam perumpamaan ini istilah tersebut menunjuk kepada orang-orang yang mengusahakan kebun anggur milik orang lain; pilihan ini alami dalam bahasa Indonesia dan mempertahankan latar pertanian.
- source_word: τούτους
  choice: itu
  rationale: Bahasa Indonesia lazim memakai demonstratif ‘itu’ setelah nomina untuk menunjuk para penggarap tertentu yang sedang dibicarakan.
- source_word: δώσει
  choice: memberikan
  rationale: Padanan langsung bagi δίδωμι; tidak mempersempit maknanya menjadi ‘memercayakan’ atau ‘menyerahkan pengelolaan’.
- source_word: τὸν ἀμπελῶνα
  choice: kebun anggur itu
  rationale: Padanan baku dan jelas yang mempertahankan citra perumpamaan serta rujukan definitnya.
- source_word: ἄλλοις
  choice: kepada orang lain
  rationale: Mempertahankan ketidakjelasan identitas penerima sebagaimana dalam teks Yunani.
- source_word: ἀκούσαντες δὲ
  choice: Ketika mendengar hal itu
  rationale: Menangkap fungsi temporal partisip aoris dan hubungan naratif δέ secara alami; ‘hal itu’ menyatakan objek dengar yang tersirat.
- source_word: Μὴ γένοιτο
  choice: Jangan sampai itu terjadi!
  rationale: Ungkapan Indonesia yang kuat dan alami untuk penolakan emosional berbentuk harapan negatif, serta dekat dengan arti harfiahnya.
theological_decisions:
- issue: Kekuatan tanggapan Μὴ γένοιτο
  choice: Jangan sampai itu terjadi!
  alternative: Sama sekali tidak!; Sekali-kali jangan!
  rationale: Pilihan ini mempertahankan bentuk harapan atau seruan agar penghakiman yang diumumkan tidak terjadi, bukan sekadar menyangkal suatu pernyataan.
- issue: Identitas ‘orang lain’
  choice: Dibiarkan tidak dijelaskan
  alternative: Menentukan mereka sebagai kelompok teologis tertentu
  rationale: Teks Yunani hanya memakai ἄλλοις dan tidak mengidentifikasi mereka dalam ayat ini, sehingga ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Ia’ dipakai untuk pemilik kebun dalam perumpamaan; ‘para penggarap kebun anggur’ menjelaskan peran sosial tanpa memasukkan tafsiran denominasi. Semua penanda catatan kaki dicantumkan dalam teks utama.
