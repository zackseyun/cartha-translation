  source_fidelity: 'Teks dengan tepat menerjemahkan urutan dan isi Yunani: ἐλεύσεται sebagai “akan datang,” ἀπολέσει sebagai “membinasakan,” γεωργούς sebagai “para penggarap kebun anggur,” serta δώσει ... ἄλλοις sebagai pemberian kebun kepada “orang lain.” Demonstratif τούτους dan ketaktertentuan ἄλλοις terpelihara. “Jangan sampai itu terjadi!” menyampaikan daya tolak/harapan negatif dari Μὴ γένοιτο tanpa menambahkan penafsiran.'
  naturalness: Bahasanya modern, baku, dan lancar. “Para penggarap kebun anggur itu” secara alami menjelaskan peran para γεωργοί dalam konteks perumpamaan. Susunan “Ketika mendengar hal itu, mereka berkata” juga jelas dan wajar.
  terminology: “Kebun anggur,” “penggarap,” dan “membinasakan” cocok untuk register naratif-perumpamaan dan mempertahankan bobot penghakiman tanpa menentukan secara berlebihan apakah tindakan itu harus dipahami hanya sebagai pembunuhan. Catatan a dan b akurat serta penandanya terpasang pada unsur yang relevan.
