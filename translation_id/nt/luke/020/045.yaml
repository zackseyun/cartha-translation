  text: Ἀκούοντος δὲ παντὸς τοῦ λαοῦ εἶπεν τοῖς ⸀μαθηταῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: id
  text: 'Ketika semua orang sedang mendengarkan[a], ia berkata kepada murid-murid:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sementara semua orang mendengarkan, ia berkata kepada murid-murid.” Bahasa Yunani memakai konstruksi genitif absolut untuk menunjukkan keadaan yang menyertai perkataannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: Ketika ... sedang mendengarkan
  rationale: Partisipel kini dalam konstruksi genitif absolut menunjukkan tindakan yang berlangsung bersamaan dan menjadi latar bagi tindakan berbicara.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini merupakan penghubung naratif ringan; dalam bahasa Indonesia, kesinambungannya sudah tersampaikan secara alami tanpa kata penghubung tambahan.
- source_word: παντὸς τοῦ λαοῦ
  choice: seluruh rakyat
  rationale: Frasa ini menunjuk kepada rakyat sebagai satu keseluruhan. 'Rakyat' mempertahankan nuansa komunal λαός dan membedakannya dari sekadar kerumunan.
- source_word: εἶπεν
  choice: ia berkata
  rationale: Bentuk aoris dari λέγω secara langsung dan wajar diterjemahkan sebagai 'ia berkata'.
- source_word: τοῖς μαθηταῖς
  choice: kepada murid-murid
  rationale: μαθηταί dalam konteks Injil paling tepat diterjemahkan 'murid-murid'. Kata milik 'nya' tidak ditambahkan karena tidak dinyatakan dalam teks Yunani.
theological_decisions:
- issue: Pembedaan pendengar dalam adegan ini
  choice: Ia berbicara kepada murid-murid sementara seluruh rakyat mendengarkan.
  alternative: Ia berbicara langsung kepada seluruh rakyat, atau berbicara secara pribadi kepada murid-murid terpisah dari rakyat.
  rationale: Genitif absolut menetapkan suasana publik ketika seluruh rakyat mendengarkan, sedangkan datif τοῖς μαθηταῖς menunjukkan bahwa murid-murid adalah pihak yang disapa secara langsung. Terjemahan mempertahankan kedua unsur tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sedang' mempertahankan aspek tindakan yang tengah berlangsung; 'seluruh rakyat' mempertahankan sifat kolektif λαός tanpa mengubahnya menjadi sekadar 'orang banyak'.
