  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: id
  text: Namun, mereka yang dianggap layak untuk mendapat bagian dalam zaman itu[b] dan dalam kebangkitan dari antara orang mati tidak menikah ataupun dinikahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak diberikan untuk dinikahkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “zaman yang akan datang.” Secara harfiah, “zaman itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: dianggap layak
  rationale: Bentuk pasif ini menyatakan bahwa mereka dinilai atau dipandang layak, bukan bahwa kelayakan itu semata-mata sifat bawaan atau hasil jasa mereka.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: zaman itu
  rationale: Pilihan ini mengikuti demonstratif Yunani secara dekat dan mempertahankan kontras eskatologis dengan zaman sekarang tanpa menjelaskannya secara berlebihan sebagai 'zaman yang akan datang'.
- source_word: τυχεῖν
  choice: memperoleh
  rationale: Dengan objek genitif, kata ini dapat berarti memperoleh atau mendapat bagian dalam; 'memperoleh' alami untuk kedua objek yang dikoordinasikan, yakni zaman itu dan kebangkitan.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: kebangkitan dari antara orang mati
  rationale: Ungkapan ini mempertahankan daya preposisi ἐκ dan menyampaikan bahwa kebangkitan itu berlangsung dari tengah-tengah orang mati.
- source_word: γαμοῦσιν
  choice: menikah
  rationale: Padanan modern yang jelas dan ringkas bagi tindakan memasuki perkawinan.
- source_word: γαμίζονται
  choice: dinikahkan
  rationale: Bentuk pasif ini dibedakan dari 'menikah' dan mencerminkan ungkapan sosial tentang seseorang yang diberikan atau dipersatukan dalam perkawinan.
theological_decisions:
- issue: Apakah καταξιωθέντες menyiratkan bahwa kehidupan kebangkitan diperoleh berdasarkan jasa
  choice: dianggap layak
  alternative: orang-orang yang layak
  rationale: Bentuk pasif dipertahankan sebagai penilaian terhadap mereka tanpa menentukan secara eksplisit siapa yang menilai ataupun mengajarkan bahwa mereka memperoleh kebangkitan melalui jasa mereka sendiri.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Namun' memberi kontras yang alami dengan ayat sebelumnya. Susunan kalimat mempertahankan koordinasi antara 'zaman itu' dan 'kebangkitan', serta perbedaan antara bentuk aktif dan pasif pada dua kata kerja terakhir.
