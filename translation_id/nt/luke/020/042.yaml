  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: id
  text: Sebab Daud sendiri berkata dalam Kitab Mazmur, “Tuhan[a] berkata kepada Tuanku, ‘Duduklah di sebelah kanan-Ku.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, mengikuti teks Ibrani Mazmur 110:1, “TUHAN berkata kepada Tuanku.”
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Sebab ... sendiri
  rationale: γάρ memperkenalkan alasan bagi pernyataan sebelumnya dan diterjemahkan sebagai “Sebab”; αὐτός bersifat menegaskan dan dinyatakan dengan “sendiri” yang menerangkan Daud.
- source_word: Δαυὶδ
  choice: Daud
  rationale: Mengikuti bentuk baku nama pribadi ini dalam bahasa Indonesia.
- source_word: λέγει
  choice: berkata
  rationale: Bentuk kini dalam formula kutipan secara alami diterjemahkan dengan “berkata” dalam bahasa Indonesia, seolah-olah teks Kitab Suci tetap berbicara.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: dalam Kitab Mazmur
  rationale: βίβλος berarti “kitab” dan ψαλμῶν merupakan bentuk jamak genitif; “Kitab Mazmur” adalah ungkapan baku, alami, dan setia pada sumber.
- source_word: Εἶπεν
  choice: berkata
  rationale: Aoristus ini menyatakan tindakan ujaran dalam kutipan; bahasa Indonesia tidak menandai kala secara morfologis, sehingga “berkata” sesuai tanpa tambahan penanda waktu.
- source_word: κύριος
  choice: Tuhan
  rationale: κύριος pertama merujuk kepada Allah dalam kutipan Mazmur. “Tuhan” mengikuti teks Yunani, sedangkan bentuk yang mencerminkan nama ilahi dalam teks Ibrani dicatat di catatan kaki.
- source_word: τῷ κυρίῳ μου
  choice: kepada Tuanku
  rationale: Dativus diterjemahkan dengan “kepada,” dan κύριος dengan pronomina posesif diterjemahkan “Tuanku.” Bentuk ini mempertahankan perbedaan antara pembicara ilahi dan sosok yang disebut Daud sebagai tuannya.
- source_word: Κάθου
  choice: Duduklah
  rationale: Imperatif κάθημαι diterjemahkan dengan bentuk perintah Indonesia yang alami dan bermartabat.
- source_word: ἐκ δεξιῶν μου
  choice: di sebelah kanan-Ku
  rationale: Ungkapan idiomatis ini menunjuk pada kedudukan di sisi kanan pembicara. “Di sebelah kanan-Ku” alami dalam bahasa Indonesia dan mempertahankan gambaran kedudukan terhormat.
theological_decisions:
- issue: κύριος pertama mengutip Mazmur 110:1, yang dalam bahasa Ibrani memakai nama ilahi YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks sumber Yunani memakai κύριος, sehingga teks utama menerjemahkannya sebagai “Tuhan.” Namun, karena teks Ibrani Mazmur 110:1 memakai nama ilahi, “TUHAN” diberikan sebagai alternatif dalam catatan kaki tanpa menggantikan kesaksian teks Yunani.
- issue: κύριος kedua dalam kutipan yang penting bagi identitas Mesias
  choice: Tuanku
  alternative: tuanku/penguasa saya
  rationale: “Tuanku” mempertahankan bobot sebutan κύριος dan ketegangan dalam argumen Yesus tanpa secara eksplisit menentukan identitas atau hakikat sosok tersebut melampaui apa yang dikatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Tuhan,” “Tuanku,” dan “-Ku” memperjelas rujukan dalam kutipan tanpa menambahkan penjelasan teologis ke dalam teks. Penanda catatan kaki ditempatkan setelah keseluruhan kutipan yang diterangkannya.
