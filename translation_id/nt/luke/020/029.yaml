translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Tujuh orang bersaudara” terbaca alami bagi pembaca umum, sementara konteks dan kelanjutan ayat memperjelas bahwa semuanya laki-laki. Tanda [a] ditempatkan langsung setelah kata yang dijelaskan.
