  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: id
  text: Jadi, ada tujuh orang saudara laki-laki. Saudara yang pertama menikah[a], lalu meninggal tanpa anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambil istri”; ini merupakan ungkapan yang berarti menikah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ οὖν ἀδελφοὶ ἦσαν
  choice: Jadi, ada tujuh orang bersaudara
  rationale: οὖν menandai kelanjutan atau konsekuensi dalam percakapan dan diterjemahkan secara alami dengan “Jadi”; ἑπτὰ dan ἀδελφοί menyatakan tujuh laki-laki yang bersaudara dalam konteks perkawinan levirat.
- source_word: ὁ πρῶτος
  choice: Yang pertama
  rationale: Menunjuk saudara pertama dalam urutan cerita, tanpa menyatakan secara pasti bahwa ia yang tertua.
- source_word: λαβὼν γυναῖκα
  choice: menikah
  rationale: Ungkapan Yunani yang secara harfiah berarti “mengambil seorang istri” merupakan idiom untuk menikah. Terjemahan ini alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀπέθανεν ἄτεκνος
  choice: lalu meninggal tanpa anak
  rationale: Menyampaikan urutan tindakan partisipial dan makna bahwa ia meninggal tanpa mempunyai anak, dengan bahasa Indonesia yang lugas dan wajar.
