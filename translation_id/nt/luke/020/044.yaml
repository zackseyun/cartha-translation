  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: id
  text: Jadi, Daud menyebut dia “Tuhan”; bagaimana dia bisa menjadi anak Daud[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunannya”. Bahasa Yunani berbunyi “anaknya”, tetapi kata “anak” dapat menunjuk kepada keturunan dalam garis dinasti. Teks utama mempertahankan kata yang dipakai secara eksplisit dalam argumen ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Daud
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: οὖν
  choice: Jadi
  rationale: Menandai kesimpulan yang ditarik dari kutipan dan argumen sebelumnya dengan ungkapan yang alami dalam bahasa Indonesia.
- source_word: αὐτὸν κύριον
  choice: dia “Tuhan”
  rationale: κύριος diterjemahkan sebagai gelar “Tuhan”, yang mempertahankan bobot penghormatan dan fungsi istilah itu dalam argumen mesianik ini. Tanda petik memperjelas bahwa Daud menyebut orang tersebut dengan gelar itu.
- source_word: καλεῖ
  choice: menyebut
  rationale: Secara langsung dan alami menyampaikan tindakan memberi sebutan atau gelar.
- source_word: καὶ πῶς
  choice: Lalu bagaimana mungkin
  rationale: καί menghubungkan pertanyaan dengan pernyataan sebelumnya, sedangkan πῶς membentuk pertanyaan retoris. Kata “mungkin” menyampaikan daya retoris tanpa mengubah pokok pertanyaannya.
- source_word: αὐτοῦ υἱός
  choice: anaknya
  rationale: Mempertahankan istilah eksplisit υἱός, “anak”, serta bentuk pronominal Yunani, tanpa menggantinya dalam teks utama dengan penafsiran dinastis “keturunan”.
- source_word: ἐστιν
  choice: adalah
  rationale: Mencerminkan bentuk kini dari εἰμί secara lugas dalam konstruksi nominal bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan κύριος dalam argumen mesianik atau kristologis
  choice: Tuhan
  alternative: tuan
  rationale: “Tuhan” mempertahankan gelar kehormatan dan bobot teologis dalam kutipan Mazmur 110 yang mendasari pertanyaan ini, tanpa memperluas makna melampaui teks.
- issue: Apakah υἱός perlu diperluas menjadi “keturunan”
  choice: anaknya
  alternative: keturunannya
  rationale: Teks Yunani secara eksplisit memakai “anak”, dan ketegangan dalam pertanyaan Yesus bergantung pada sebutan itu. Kemungkinan nuansa garis keturunan dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
- issue: Rujukan pronomina αὐτοῦ
  choice: -nya
  alternative: anak Daud
  rationale: Bentuk pronominal dipertahankan agar dekat dengan teks Yunani. Dalam konteks, rujukannya adalah Daud, tetapi teks utama tidak mengganti pronomina dengan nama secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan dua kalimat membuat hubungan logis dan pertanyaan retoris terdengar alami. Huruf kapital dan tanda petik pada “Tuhan” menandai penggunaannya sebagai gelar.
