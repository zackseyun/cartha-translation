  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: id
  text: Namun, ketika para penggarap kebun anggur[a] itu melihat dia, mereka berunding seorang dengan yang lain sambil berkata, “Inilah ahli warisnya. Mari kita bunuh dia supaya warisan itu menjadi milik kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para penyewa” atau “para petani.” Kata Yunani ini menunjuk pada para pekerja atau penggarap pertanian; dalam perumpamaan ini mereka secara khusus menggarap kebun anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: para penggarap kebun anggur
  rationale: Nomina ini secara leksikal menunjuk pada pekerja atau penggarap pertanian; konteks perumpamaan secara khusus menunjukkan kebun anggur. Pilihan ini mempertahankan kekhususan konteks tanpa memasukkan status hukum sebagai penyewa ke dalam kata itu sendiri.
- source_word: διελογίζοντο
  choice: mereka berunding
  rationale: Bentuk imperfek menggambarkan proses pertimbangan timbal balik. 'Berunding' menyampaikan pembicaraan yang penuh perhitungan tanpa menyiratkan pertengkaran.
- source_word: πρὸς ἀλλήλους
  choice: satu sama lain
  rationale: Ungkapan ini menandai interaksi timbal balik di antara para penggarap dan berpadu secara alami dengan 'berunding'.
- source_word: κληρονόμος
  choice: ahli waris
  rationale: Padanan Indonesia yang baku dan ringkas untuk orang yang berhak menerima warisan.
- source_word: ἀποκτείνωμεν
  choice: Mari kita bunuh
  rationale: Subjungtif aoris orang pertama jamak berfungsi sebagai ajakan. 'Mari kita bunuh' langsung dan tidak menambahkan penilaian leksikal yang lebih khusus seperti 'membunuh dengan keji'.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: supaya warisan itu menjadi milik kita
  rationale: Mempertahankan tujuan yang dinyatakan oleh ἵνα serta nuansa γένηται, yaitu warisan tersebut 'menjadi' milik mereka.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai perkembangan narasi dengan kontras ringan; 'Namun' menyampaikan peralihan tersebut secara wajar dan bermartabat.
- source_word: ἰδόντες
  choice: ketika ... melihat
  rationale: Partisip aoris diterjemahkan sebagai anak kalimat waktu agar hubungan tindakannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah bagi γεωργοὶ dalam konteks kebun anggur
  choice: para penggarap kebun anggur
  alternative: para penyewa; para petani
  rationale: Pilihan ini menerjemahkan makna pertanian dari nomina tersebut dan memperjelas kebun anggur berdasarkan konteks langsung. Status mereka sebagai penyewa tersirat dari perumpamaan secara keseluruhan, tetapi tidak dinyatakan secara khusus oleh nomina ini, sehingga tidak dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Penggarap kebun anggur' mudah dipahami serta mempertahankan latar pertanian; susunan kalimat dibuat alami tanpa menghilangkan hubungan waktu, perundingan timbal balik, ajakan membunuh, dan tujuan memperoleh warisan.
