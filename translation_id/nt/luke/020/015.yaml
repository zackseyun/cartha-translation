  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: id
  text: Setelah mengusir dia dari kebun anggur itu, mereka membunuhnya. Jadi, apa yang akan pemilik kebun anggur itu lakukan terhadap mereka?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: menyeret dia ke luar
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului pembunuhan. Dalam konteks perlakuan keras para penggarap, “menyeret ... ke luar” secara alami menyampaikan pengusiran paksa tanpa menuntut arti bahwa ia dilempar secara harfiah.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ke luar kebun anggur itu
  rationale: Frasa ini menunjukkan gerakan dari dalam menuju luar kebun anggur; “ke luar” merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: ἀπέκτειναν
  choice: membunuhnya
  rationale: Kata kerja ini secara langsung berarti membunuh. Pilihan ini tidak menambahkan nuansa prosedural seperti “menghukum mati” ataupun penilaian tambahan yang tidak dinyatakan secara leksikal.
- source_word: τί οὖν
  choice: Jadi, apa
  rationale: “Jadi” mempertahankan daya inferensial οὖν dan menghasilkan pertanyaan yang wajar dalam bahasa Indonesia modern.
- source_word: ποιήσει ... αὐτοῖς
  choice: akan dilakukan ... terhadap mereka
  rationale: ποιέω dipakai secara luas untuk tindakan yang akan diambil sebagai tanggapan, sedangkan datif αὐτοῖς dalam konteks ini paling alami dinyatakan dengan “terhadap mereka.” Bentuk pasif gramatikal bahasa Indonesia menjaga susunan pertanyaan tetap lancar.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: pemilik kebun anggur itu
  rationale: κύριος di sini menunjuk kepada pemilik kebun anggur dalam dunia perumpamaan, bukan berfungsi langsung sebagai gelar ilahi. “Pemilik” menyampaikan makna kontekstual dengan jelas dan tidak menyesatkan pembaca.
theological_decisions:
- issue: Penerjemahan κύριος ketika acuannya adalah tokoh manusia dalam perumpamaan
  choice: pemilik
  alternative: tuan
  rationale: Walaupun κύριος dapat diterjemahkan “Tuhan” atau “tuan,” konteks langsung menunjuk kepada orang yang memiliki kebun anggur. “Pemilik” memperjelas peran tokoh itu tanpa menghapus makna teologis perumpamaan atau menjadikan kata tersebut gelar ilahi secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Lalu” menghubungkan tindakan secara alami; “menyeret” mempertahankan kekuatan pengusiran, sedangkan “membunuhnya” tetap lugas. Tidak diperlukan catatan kaki karena “pemilik” merupakan padanan kontekstual yang jelas dan alternatif “tuan” tidak menimbulkan ambiguitas penting yang harus dipertahankan dalam teks.
