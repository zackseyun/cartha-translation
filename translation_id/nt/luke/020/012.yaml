  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: id
  text: Lalu ia melanjutkan dengan mengutus yang ketiga[a]. Namun, mereka juga melukai orang itu dan melemparkannya ke luar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Yunani berbunyi “ia menambahkan untuk mengutus yang ketiga,” suatu ungkapan yang berarti bahwa ia melanjutkan dengan mengutus yang ketiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Lalu ia mengutus
  rationale: Konstruksi προστίθημι dengan infinitif menyatakan tindakan lanjutan. Bahasa Indonesia alami cukup memakai “lalu ... mengutus”; urutan dan keberlanjutannya diperjelas oleh “orang ketiga”.
- source_word: τρίτον πέμψαι
  choice: mengutus orang ketiga
  rationale: Bahasa Yunani menyebut “yang ketiga” tanpa mengulangi nomina karena pelayan dipahami dari konteks. “Orang ketiga” mempertahankan elipsis itu secara alami tanpa menambahkan “hamba” ke teks utama.
- source_word: οἱ δὲ
  choice: Namun, mereka
  rationale: δέ menandai peralihan yang berlawanan antara tindakan pemilik dan tanggapan para penggarap; “namun” menyampaikan daya adversatifnya dengan jelas.
- source_word: καὶ τοῦτον
  choice: juga ... orang itu
  rationale: καί menunjukkan bahwa orang ketiga mengalami perlakuan serupa. Susunan ini alami dalam bahasa Indonesia dan tetap menonjolkan pengulangan tindakan tersebut.
- source_word: τραυματίσαντες
  choice: melukai
  rationale: τραυματίζω berarti menyebabkan luka; “melukai” merupakan padanan langsung dan lebih tepat daripada istilah umum seperti “mencederai” dalam ragam pembaca luas.
- source_word: ἐξέβαλον
  choice: melemparkannya ke luar
  rationale: ἐκβάλλω di sini menggambarkan pengusiran secara keras. “Melemparkannya ke luar” mempertahankan kekuatan citra tindakan itu dan sesuai dengan konteks kekerasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina “ia” dipakai untuk alur perumpamaan, sedangkan “orang ketiga” membiarkan identitas yang dipahami dari konteks tetap tersirat sebagaimana dalam teks Yunani.
