  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: id
  text: 'Dan yang ketiga memperistri perempuan itu. Demikian juga ketujuh-tujuhnya: mereka tidak meninggalkan anak dan meninggal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: yang ketiga
  rationale: Teks Yunani mempertahankan elipsis dan tidak mengulangi kata 'saudara'; konteks ayat sebelumnya membuat acuannya jelas.
- source_word: ἔλαβεν αὐτήν
  choice: memperistri perempuan itu
  rationale: Dalam konteks perkawinan levirat, ungkapan harfiah 'mengambil dia' berarti mengambil perempuan itu sebagai istri. Bahasa Indonesia 'memperistri' menyampaikan idiom tersebut secara alami dan tepat.
- source_word: ὡσαύτως δὲ καὶ οἱ ἑπτὰ
  choice: Demikian juga ketujuh-tujuhnya
  rationale: Ungkapan ini melanjutkan pola yang sama kepada seluruh tujuh saudara. 'Ketujuh-tujuhnya' jelas dan idiomatis dalam bahasa Indonesia.
- source_word: οὐ κατέλιπον τέκνα
  choice: mereka tidak meninggalkan anak
  rationale: Terjemahan ini mempertahankan gagasan bahwa tidak ada anak yang ditinggalkan ketika mereka meninggal, bukan sekadar bahwa mereka tidak mempunyai anak.
- source_word: ἀπέθανον
  choice: akhirnya meninggal
  rationale: Kata kerja berarti 'meninggal'. 'Akhirnya' menyatakan hasil berurutan bagi ketujuh orang tanpa mengubah isi pokok teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Idiom Yunani ἔλαβεν αὐτήν diterjemahkan menurut maknanya dalam konteks perkawinan, karena terjemahan harfiah 'mengambil perempuan itu' dapat terdengar janggal atau ambigu dalam bahasa Indonesia.
