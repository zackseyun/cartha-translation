  source_fidelity: Teks Indonesia secara akurat menerjemahkan ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου. “Sampai” menyampaikan batas futurum yang ditandai ἕως ἄν; “Aku menjadikan” menangkap daya resultatif θῶ dalam idiom kutipan Mazmur; dan citra “tumpuan kaki-Mu” mempertahankan ὑποπόδιον τῶν ποδῶν σου tanpa mengubahnya menjadi keterangan lokasi “di bawah kaki-Mu.”
