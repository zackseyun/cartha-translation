id: LUK.20.43
reference: Luke 20:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: id
  text: sampai Aku menjadikan musuh-musuh-Mu tumpuan kaki-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sampai Aku menempatkan musuh-musuh-Mu sebagai tumpuan bagi kaki-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: sampai
  rationale: Gabungan ini menyatakan batas waktu yang berorientasi ke masa depan; “sampai” merupakan padanan Indonesia yang alami dan tepat.
- source_word: θῶ
  choice: Aku menjadikan
  rationale: 'Bentuk dari τίθημι secara harfiah berarti “menaruh/menempatkan,” tetapi dalam konstruksi ini menyatakan hasil: musuh-musuh dijadikan tumpuan kaki. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan citranya.'
- source_word: τοὺς ἐχθρούς σου
  choice: musuh-musuh-Mu
  rationale: Padanan langsung bagi objek jamak dengan kata ganti milik orang kedua tunggal; bentuk kapital mengikuti acuan kepada Mesias dalam kutipan ini.
- source_word: ὑποπόδιον
  choice: tumpuan kaki
  rationale: Istilah ini menunjuk pada alas atau bangku kecil untuk menumpukan kaki. “Tumpuan kaki” jelas, alami, dan mempertahankan metafora penaklukan.
- source_word: τῶν ποδῶν σου
  choice: kaki-Mu
  rationale: Genitif harfiah “dari kaki-Mu” tidak alami dalam bahasa Indonesia. Karena unsur “kaki” sudah terdapat dalam istilah majemuk “tumpuan kaki,” bentuk posesif “kaki-Mu” menyampaikan hubungan yang dimaksud tanpa memperluasnya menjadi “di bawah kaki-Mu.”
theological_decisions:
- issue: Citra penaklukan dalam kutipan Mazmur 110:1
  choice: Mempertahankan metafora “menjadikan musuh-musuh-Mu tumpuan kaki-Mu”
  alternative: “menaruh musuh-musuh-Mu di bawah kaki-Mu”
  rationale: Metafora kerajaan dan mesianik dipertahankan tanpa menguraikannya sebagai kekalahan atau dominasi total. Alternatif tersebut lebih eksplisit daripada susunan Yunani dan mengubah citra tumpuan kaki menjadi keterangan lokasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora sumber serta hubungan antarkata yang penting.
