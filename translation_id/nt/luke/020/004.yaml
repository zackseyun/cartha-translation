  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: id
  text: Apakah baptisan Yohanes berasal dari surga atau dari manusia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berasal dari Allah”; secara harfiah bahasa Yunani berbunyi “dari surga”, suatu ungkapan penghormatan yang menunjuk pada asal atau wewenang ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: baptisan
  rationale: Nomina ini menunjuk pada ritus atau praktik baptisan yang terkait dengan Yohanes; “baptisan” adalah padanan baku dan tepat dalam bahasa Indonesia.
- source_word: Ἰωάννου
  choice: Yohanes
  rationale: Genitif ini menyatakan baptisan yang terkait dengan Yohanes; konstruksi Indonesia “baptisan Yohanes” alami dan ringkas.
- source_word: ἐξ οὐρανοῦ
  choice: berasal dari surga
  rationale: Mempertahankan ungkapan harfiah Yunani dan idiom penghormatan Yahudi, tanpa langsung menafsirkannya sebagai “berasal dari Allah”.
- source_word: ἐξ ἀνθρώπων
  choice: berasal dari manusia
  rationale: ἀνθρώπων bersifat generik dan menunjuk pada asal atau wewenang manusiawi, bukan khusus laki-laki; “manusia” menjaga kontras dengan asal surgawi.
- source_word: ἦν
  choice: berasal
  rationale: Walaupun secara harfiah merupakan kopula “adalah”, bersama frasa ἐξ kata ini secara alami menyatakan asal; “berasal” menghasilkan pertanyaan Indonesia yang jelas dan idiomatis.
- source_word: ἢ
  choice: atau
  rationale: Konjungsi disjungtif yang menandai dua pilihan dalam pertanyaan.
theological_decisions:
- issue: Makna “dari surga” dalam kaitannya dengan baptisan Yohanes
  choice: Mempertahankan “dari surga” dalam teks utama.
  alternative: berasal dari Allah
  rationale: Ungkapan tersebut menyiratkan asal atau wewenang ilahi, tetapi teks Yunani secara eksplisit menyebut “surga”. Mempertahankan idiom itu menghindari penafsiran berlebihan dan menjaga ketegangan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “Apakah ... atau ...?” menyampaikan pertanyaan alternatif dengan jelas; “manusia” dipilih sebagai sebutan generik yang tidak bergender.
