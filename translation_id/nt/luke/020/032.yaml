  text: Later[a], the woman also died.
translation:
  language: id
  text: Kemudian, perempuan itu juga meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: Kemudian
  rationale: Kata keterangan ini menunjukkan waktu yang menyusul dalam urutan cerita. “Kemudian” alami dalam bahasa Indonesia dan tidak memberi kesan penutup yang belum tentu dimaksudkan seperti “akhirnya”.
- source_word: καὶ
  choice: juga
  rationale: Dalam konteks ini, καί menandai bahwa perempuan itu pun mengalami kematian sebagaimana ketujuh saudara sebelumnya; “juga” menyampaikan fungsi aditif tersebut secara alami.
- source_word: ἡ γυνή
  choice: perempuan itu
  rationale: γυνή dapat berarti “perempuan” atau “istri”. Karena tokoh tersebut berturut-turut menjadi istri beberapa saudara, “perempuan itu” menjaga rujukannya tetap jelas tanpa mengaitkannya secara khusus dengan satu suami.
- source_word: ἀπέθανεν
  choice: meninggal
  rationale: Bentuk aoristus ini menyatakan kematian sebagai peristiwa lampau. “Meninggal” merupakan ungkapan Indonesia yang langsung, wajar, dan bermartabat.
