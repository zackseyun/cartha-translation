source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: id
  text: Jadi, pada waktu kebangkitan[a], perempuan itu menjadi istri siapa di antara mereka? Sebab ketujuh orang itu pernah menjadi suaminya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dalam kebangkitan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah mempunyai dia sebagai istri”; dapat juga diterjemahkan, “telah menikahinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: perempuan itu
  rationale: Dalam penyebutan pertama, γυνή menunjuk kepada perempuan yang telah dibicarakan dalam kisah tersebut; arti hubungan perkawinannya dinyatakan kemudian dengan kata “istri”.
- source_word: οὖν
  choice: jadi
  rationale: οὖν melanjutkan kesimpulan dalam pertanyaan orang-orang Saduki. “Jadi” menyampaikan alur argumentatif itu secara wajar dalam bahasa Indonesia.
- source_word: ἐν τῇ ἀναστάσει
  choice: pada waktu kebangkitan
  rationale: Ungkapan ini menempatkan pertanyaan dalam keadaan atau waktu kebangkitan. “Pada waktu kebangkitan” alami dalam bahasa Indonesia, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τίνος αὐτῶν
  choice: siapa di antara mereka
  rationale: Bentuk genitif interogatif τίνος menanyakan hubungan kepunyaan atau perkawinan. Bersama “istri”, frasa “istri siapa di antara mereka” mempertahankan hubungan tersebut dengan jelas.
- source_word: γίνεται
  choice: menjadi
  rationale: γίνομαι menyatakan menjadi atau memperoleh suatu keadaan. “Menjadi” mempertahankan nuansa verbalnya dan tidak meratakannya menjadi sekadar “adalah”.
- source_word: γυνή
  choice: istri
  rationale: Pada posisi predikatif dalam pertanyaan ini, γυνή jelas bermakna “istri”, bukan sekadar “perempuan”.
- source_word: οἱ γὰρ ἑπτὰ
  choice: sebab ketujuh orang itu
  rationale: Artikel dan angka tersebut merujuk kepada tujuh saudara yang telah disebutkan. “Ketujuh orang itu” alami dan tidak menambahkan kata “semua” yang tidak dinyatakan secara tersendiri dalam bahasa Yunani.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: telah memperistrinya
  rationale: Idiom ἔχω dengan objek dan γυναῖκα berarti mempunyai seseorang sebagai istri. “Telah memperistrinya” menyampaikan hubungan perkawinan itu secara ringkas dan alami; bentuk yang lebih harfiah disediakan dalam catatan kaki.
theological_decisions:
- issue: Makna bahasa kebangkitan dalam pertanyaan orang-orang Saduki
  choice: Menerjemahkan ἀνάστασις secara langsung sebagai “kebangkitan” tanpa penjelasan tambahan.
  alternative: “kebangkitan orang mati”
  rationale: Ayat ini sendiri hanya memakai ἀνάστασις. Tidak menambahkan “orang mati” mempertahankan rumusan pertanyaan dan ketegangan teologis dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan tetap dekat pada bentuk Yunani. “Jadi” mempertahankan gerak argumentasi, sedangkan “perempuan itu” dan “istri” membedakan dua fungsi γυνή dalam ayat ini.
