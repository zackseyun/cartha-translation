id: LUK.20.6
reference: Luke 20:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: id
  text: Tetapi jika kita berkata, ‘Dari manusia,’ seluruh rakyat akan merajam kita, sebab mereka yakin bahwa Yohanes adalah seorang nabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “bahwa Yohanes dahulu seorang nabi.” Infinitif Yunani tidak dengan sendirinya menentukan waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Tetapi jika kita berkata
  rationale: Konstruksi ἐὰν dengan subjungtif aoristus menyatakan kemungkinan bersyarat; ‘tetapi’ mempertahankan daya adversatif δέ dalam konteks.
- source_word: Ἐξ ἀνθρώπων
  choice: Dari manusia
  rationale: Ungkapan eliptis ini menunjuk kembali pada asal baptisan atau wewenang Yohanes. Terjemahan langsung mempertahankan kesejajaran dengan pertanyaan pada konteks sebelumnya.
- source_word: ὁ λαὸς ἅπας
  choice: seluruh rakyat
  rationale: λαός adalah kelompok rakyat secara kolektif, sedangkan ἅπας menegaskan keseluruhannya. ‘Seluruh rakyat’ alami dan membedakannya dari sekadar kerumunan.
- source_word: καταλιθάσει ἡμᾶς
  choice: akan merajam kita
  rationale: ‘Merajam’ adalah padanan Indonesia yang tepat untuk membunuh atau menyerang dengan lemparan batu; teks sumber tidak secara tersurat menambahkan ‘sampai mati’.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: sebab mereka yakin
  rationale: Bentuk Yunani tunggal mengacu secara kolektif kepada ‘seluruh rakyat’; bahasa Indonesia secara alami dapat merujuk kelompok itu dengan ‘mereka’. Partisip perfek menyatakan keyakinan yang telah terbentuk dan tetap dipegang.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: bahwa Yohanes adalah seorang nabi
  rationale: Konstruksi akusatif-infinitif dialihkan menjadi klausa ‘bahwa’. Infinitif εἶναι tidak menandai waktu secara mandiri; ‘adalah’ secara alami menyampaikan isi keyakinan mereka saat itu tanpa memaksakan pembacaan temporal.
theological_decisions:
- issue: Waktu dalam penilaian rakyat tentang Yohanes
  choice: bahwa Yohanes adalah seorang nabi
  alternative: bahwa Yohanes dahulu seorang nabi
  rationale: Infinitif εἶναι tidak dengan sendirinya menentukan waktu. Bahasa Indonesia tidak menuntut penyesuaian kala seperti bahasa Inggris; ‘adalah’ mempertahankan isi keyakinan rakyat dan ambiguitas temporal sumber tanpa menyiratkan bahwa status kenabian Yohanes telah berakhir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Merajam’ dipilih sebagai istilah umum Alkitabiah yang tetap dipahami pembaca modern; ‘seluruh rakyat’ mempertahankan nuansa kolektif λαός.
