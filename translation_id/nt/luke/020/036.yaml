id: LUK.20.36
reference: Luke 20:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: id
  text: Sebab mereka pun tidak dapat mati lagi, karena mereka setara dengan para malaikat dan mereka adalah anak-anak Allah, karena mereka adalah anak-anak kebangkitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Allah” dan “anak-anak kebangkitan”. Bentuk maskulin dalam bahasa Yunani menyatakan kedudukan dan identitas, bukan bahwa hanya laki-laki yang termasuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: tidak dapat mati lagi
  rationale: Ungkapan ini menyatakan ketidakmampuan untuk mati sejak saat itu dan seterusnya. Dalam bahasa Indonesia, “tidak dapat mati lagi” paling alami untuk menyatakan berakhirnya kefanaan, bukan sekadar bahwa kematian tidak terulang.
- source_word: ἰσάγγελοι
  choice: seperti para malaikat
  rationale: Kata ini berarti setara dengan atau seperti malaikat. Pilihan ini mempertahankan perbandingan tanpa menyatakan bahwa mereka menjadi malaikat.
- source_word: υἱοί ... θεοῦ
  choice: anak-anak Allah
  rationale: Dalam bentuk jamak, ungkapan idiomatis Indonesia “anak-anak Allah” mencakup orang-orang yang memiliki kedudukan dan identitas tersebut tanpa membatasi pada laki-laki.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: sebab mereka adalah anak-anak kebangkitan
  rationale: “Anak-anak kebangkitan” mempertahankan metafora sumber, sedangkan “sebab mereka adalah” mengungkapkan nuansa penjelas partisipel tanpa menambah tafsiran teologis yang lebih sempit.
- source_word: γάρ ... γάρ
  choice: Sebab ... karena
  rationale: 'Dua kata penghubung penjelas dipertahankan dengan variasi alami dalam bahasa Indonesia: yang pertama menghubungkan ayat ini dengan pernyataan sebelumnya, dan yang kedua menjelaskan alasan mereka tidak dapat mati lagi.'
theological_decisions:
- issue: Bahasa filial dalam konteks kebangkitan
  choice: anak-anak Allah; anak-anak kebangkitan
  alternative: putra-putra Allah; putra-putra kebangkitan
  rationale: Walaupun υἱοί berbentuk maskulin secara gramatikal, konteksnya berbicara tentang status umat yang dibangkitkan, bukan keanggotaan khusus laki-laki. “Anak-anak” merupakan padanan Indonesia yang alami dan tidak menghapus metafora hubungan serta identitas.
- issue: Sifat kesamaan dengan malaikat
  choice: seperti para malaikat
  alternative: setara dengan para malaikat
  rationale: Pilihan ini mempertahankan cakupan kesamaan yang tidak diperinci oleh ayat dan menghindari kesan bahwa manusia yang dibangkitkan identik dengan malaikat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pengulangan metaforis “anak-anak” dipertahankan, sementara struktur klausa dibuat lancar bagi pembaca umum.
