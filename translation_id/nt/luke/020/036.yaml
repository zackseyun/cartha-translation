  terminology: “Anak-anak Allah” dan “anak-anak kebangkitan” adalah padanan Indonesia yang idiomatis dan konsisten untuk υἱοί. Catatan kaki dengan tepat menjelaskan bahwa bentuk maskulin Yunani tidak membatasi cakupan pada laki-laki.
