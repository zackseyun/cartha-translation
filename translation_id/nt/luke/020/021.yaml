source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: id
  text: Mereka bertanya kepada-Nya, “Guru, kami tahu bahwa Engkau berkata dan mengajar dengan benar. Engkau tidak memihak[a], tetapi mengajarkan jalan Allah menurut kebenaran[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak menerima wajah,” sebuah ungkapan yang berarti tidak pilih kasih atau tidak dipengaruhi oleh penampilan maupun kedudukan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam kebenaran mengajarkan jalan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: bertanya
  rationale: Kata ini berarti bertanya atau mengajukan pertanyaan. Konteks menunjukkan maksud untuk menguji Yesus, tetapi verba itu sendiri tidak perlu dibuat sekeras 'menginterogasi'.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan langsung yang alami dan tepat bagi διδάσκαλος dalam bahasa Indonesia modern.
- source_word: οἴδαμεν
  choice: kami tahu
  rationale: Menyampaikan pengakuan kepastian para penutur secara langsung tanpa menambahkan penilaian narator terhadap sanjungan mereka.
- source_word: ὀρθῶς λέγεις καὶ διδάσκεις
  choice: Engkau berkata-kata dan mengajar dengan benar
  rationale: Mempertahankan kedua verba Yunani serta menerapkan ὀρθῶς pada perkataan dan pengajaran Yesus.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: Engkau tidak memihak
  rationale: Ungkapan harfiah 'menerima wajah' merupakan idiom tentang keberpihakan berdasarkan kedudukan atau penampilan; 'tidak memihak' menyampaikan maknanya dengan jelas dan alami.
- source_word: ἐπ’ ἀληθείας
  choice: sesuai dengan kebenaran
  rationale: Mengungkapkan bahwa pengajaran itu selaras dengan kebenaran, sambil mempertahankan kemungkinan nuansa cara atau dasar pengajaran.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: jalan Allah
  rationale: Mempertahankan metafora 'jalan' dan hubungan genitif dengan Allah, beserta resonansi tentang kehendak dan cara hidup yang berasal dari-Nya.
theological_decisions:
- issue: Idiom ketidakberpihakan
  choice: Engkau tidak memihak
  alternative: Engkau tidak terpengaruh oleh penampilan atau kedudukan orang
  rationale: Pilihan utama menerjemahkan makna etis idiom tanpa memasukkan pembatasan yang tidak dinyatakan secara eksplisit, sedangkan catatan menjelaskan gambaran harfiahnya.
- issue: Hubungan ἐπ’ ἀληθείας dengan tindakan mengajar
  choice: mengajarkan jalan Allah sesuai dengan kebenaran
  alternative: dengan sungguh-sungguh mengajarkan jalan Allah
  rationale: Frasa Yunani dapat dipahami sebagai pengajaran yang dilakukan dalam atau menurut kebenaran. Terjemahan utama mempertahankan kaitan itu tanpa menyamakannya semata-mata dengan ketulusan subjektif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai 'Engkau' dan enklitik '-Nya' sesuai register Kitab Suci. Struktur kalimat dijaga dekat dengan koordinasi Yunani, tetapi idiom diterjemahkan secara alami.
