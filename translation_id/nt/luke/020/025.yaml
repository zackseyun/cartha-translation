  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: id
  text: Namun, Yesus berkata kepada mereka, “Kalau begitu, berikanlah kepada Kaisar apa yang menjadi milik Kaisar, dan kepada Allah apa yang menjadi milik Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “serahkanlah kepada Kaisar … dan kepada Allah ….” Kata Yunaninya dapat berarti memberikan, membayar, atau mengembalikan apa yang menjadi hak atau yang wajib diberikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Namun, Yesus berkata kepada mereka
  rationale: δέ dapat bersifat adversatif ringan atau melanjutkan percakapan; “Namun” sesuai dengan alur perdebatan tanpa memperkeras pertentangan. Subjek tersirat dijelaskan sebagai “Yesus” agar wajar dan jelas dalam bahasa Indonesia.
- source_word: Τοίνυν
  choice: Kalau begitu
  rationale: Ungkapan ini menyampaikan kesimpulan inferensial atau kelanjutan retoris secara alami dalam bahasa Indonesia modern.
- source_word: ἀπόδοτε
  choice: berikanlah
  rationale: Kata ini dapat berarti memberikan, membayar, atau mengembalikan sesuatu yang menjadi hak atau kewajiban. “Berikanlah” alami dalam konteks ini, sementara nuansa kewajiban dipertahankan oleh frasa “apa yang menjadi milik”; alternatif leksikal dicatat dalam catatan kaki.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: kepada Kaisar apa yang menjadi milik Kaisar
  rationale: Terjemahan ini mempertahankan cakupan luas bentuk netral jamak Yunani dan tidak mempersempit perkataan itu hanya pada pajak.
- source_word: Καίσαρος / Καίσαρι
  choice: Kaisar
  rationale: Καῖσαρ merupakan nama atau gelar kekaisaran dan secara lazim ditransliterasikan sebagai “Kaisar” dalam bahasa Indonesia.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: kepada Allah apa yang menjadi milik Allah
  rationale: Susunan ini mempertahankan kesejajaran dan kontras dengan klausa tentang Kaisar.
- source_word: θεοῦ / θεῷ
  choice: Allah
  rationale: Dalam konteks ini θεός merujuk kepada Allah yang disembah Israel; “Allah” adalah padanan baku dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan politik dan teologis perkataan Yesus
  choice: Mempertahankan kewajiban sejajar kepada penguasa sipil dan kepada Allah tanpa menentukan batas tepat masing-masing.
  alternative: Menafsirkannya sebagai pemisahan mutlak agama dan negara, dukungan terhadap kekuasaan negara tanpa batas, atau pernyataan yang hanya menyangkut pembayaran pajak.
  rationale: Teks Yunani memerintahkan pemberian kepada masing-masing pihak apa yang menjadi miliknya, tetapi tidak menyusun teologi politik yang lengkap. Terjemahan mempertahankan keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalau begitu” dipilih sebagai simpulan retoris yang alami; “berikanlah” menjaga bentuk perintah tanpa terdengar kuno. Penanda catatan kaki ditempatkan setelah seluruh kutipan karena menjelaskan verba yang berlaku sejajar pada kedua klausa.
