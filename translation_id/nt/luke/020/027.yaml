id: LUK.20.27
reference: Luke 20:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: id
  text: Lalu beberapa orang dari kalangan Saduki, yang menyangkal adanya kebangkitan,[a] mendatangi Yesus dan bertanya kepada-Nya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang mengatakan bahwa tidak ada kebangkitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσελθόντες
  choice: mendatangi Yesus
  rationale: Partisip aoristus προσέρχομαι menyatakan gerakan mendekat yang mendahului tindakan utama. Objek tersirat dijelaskan sebagai Yesus agar kalimat alami dan acuannya jelas dalam bahasa Indonesia.
- source_word: δέ
  choice: Lalu
  rationale: δέ menandai kelanjutan alur cerita, bukan pertentangan yang kuat. “Lalu” sesuai dengan fungsi naratif tersebut.
- source_word: τινες τῶν Σαδδουκαίων
  choice: beberapa orang dari kalangan Saduki
  rationale: 'Ungkapan partitif Yunani dipertahankan secara wajar: yang datang hanyalah beberapa anggota kelompok Saduki.'
- source_word: οἱ ἀντιλέγοντες
  choice: yang menyangkal
  rationale: Dalam konteks ini, ἀντιλέγω menyatakan penolakan terhadap suatu klaim, bukan sekadar berbantah secara lisan.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: adanya kebangkitan
  rationale: Bersama verba “menyangkal”, bentuk ini secara alami menyatakan bahwa keberadaan kebangkitanlah yang mereka tolak. Rumusan ini tidak menentukan lebih jauh sifat atau cakupan kebangkitan tersebut.
- source_word: ἐπηρώτησαν αὐτόν
  choice: bertanya kepada-Nya
  rationale: ἐπερωτάω dapat berarti bertanya atau mengajukan pertanyaan. “Bertanya” alami dalam bahasa Indonesia, sedangkan bentuk hormat “-Nya” mempertahankan acuan kepada Yesus setelah nama-Nya disebut pada klausa sebelumnya.
theological_decisions:
- issue: Pernyataan keyakinan orang Saduki mengenai kebangkitan
  choice: yang menyangkal adanya kebangkitan
  alternative: yang mengatakan bahwa tidak ada kebangkitan
  rationale: Pilihan utama menyampaikan penolakan doktrinal yang terkandung dalam ἀντιλέγοντες dan klausa infinitifnya tanpa menambahkan uraian teologis yang tidak terdapat dalam teks. Alternatif yang lebih harfiah dalam bentuk ujaran dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Dari kalangan Saduki” mempertahankan nuansa partitif teks Yunani. Tanda koma terakhir dipertahankan karena ayat ini mengantar langsung kepada isi pertanyaan pada ayat berikutnya.
