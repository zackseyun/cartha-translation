source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: id
  text: Setelah mengawasi Yesus dengan saksama, mereka mengutus mata-mata yang berpura-pura sebagai orang benar. Tujuannya ialah menjebak Dia melalui perkataan-Nya,[a] supaya mereka dapat menyerahkan-Nya kepada kekuasaan dan wewenang gubernur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “menangkap-Nya dalam perkataan” atau “memegang perkataan-Nya.” Maksudnya ialah memperoleh dasar untuk menuduh-Nya dari sesuatu yang Dia katakan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menyerahkan-Nya kepada pemerintahan dan wewenang gubernur.” Kedua istilah yang dipasangkan itu tampaknya menekankan yurisdiksi resmi dan kuasa gubernur.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: setelah mengawasi Yesus dengan saksama
  rationale: Partisip aoris menunjukkan tindakan yang mendahului pengutusan dan mengandung nuansa pengamatan yang bermusuhan. Nama 'Yesus' dijelaskan dari konteks agar rujukannya alami dan jelas dalam bahasa Indonesia.
- source_word: ἐγκαθέτους
  choice: mata-mata
  rationale: Istilah ini menunjuk kepada orang yang ditempatkan secara tersembunyi untuk menjebak; 'mata-mata' ringkas, alami, dan mempertahankan maksud rahasia yang bermusuhan.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: yang berpura-pura sebagai orang benar
  rationale: Ungkapan ini menggambarkan penampilan diri yang menipu. 'Orang benar' mempertahankan bobot moral-keagamaan δίκαιος tanpa membatasinya pada arti sekadar jujur atau terhormat.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: Tujuannya ialah menjebak Dia melalui perkataan-Nya
  rationale: Terjemahan idiomatis ini menyampaikan maksud menangkap atau memperoleh dasar untuk menuduh Yesus berdasarkan ucapan-Nya, sementara catatan kaki mempertahankan bentuk ungkapan Yunani yang lebih harfiah.
- source_word: ὥστε
  choice: supaya
  rationale: Dalam konteks ini kata tersebut memperkenalkan hasil yang dimaksudkan dari jebakan itu; 'supaya' mengalir alami dan mempertahankan hubungan tujuan-hasil.
- source_word: παραδοῦναι
  choice: menyerahkan-Nya
  rationale: Padanan baku dan alami dalam konteks penyerahan kepada penguasa untuk tindakan hukum.
- source_word: τῇ ἀρχῇ
  choice: kekuasaan
  rationale: Di sini ἀρχή menunjuk pada kekuasaan pemerintahan, bukan permulaan. Padanan ini dibedakan dari ἐξουσία agar pasangan istilah Yunani tidak dilebur.
- source_word: τῇ ἐξουσίᾳ
  choice: wewenang
  rationale: '''Wewenang'' menyatakan hak resmi atau yurisdiksi untuk bertindak dan membentuk pasangan alami dengan ''kekuasaan''.'
- source_word: τοῦ ἡγεμόνος
  choice: gubernur
  rationale: Padanan yang jelas dan lazim untuk pejabat pemerintahan Romawi dalam konteks provinsi.
theological_decisions:
- issue: Penerjemahan δίκαιος dalam konteks kepura-puraan moral
  choice: orang benar
  alternative: orang yang tulus; orang yang adil
  rationale: '''Orang benar'' mempertahankan warna moral-keagamaan istilah itu dan tidak mereduksinya menjadi ketulusan pribadi atau keadilan dalam arti sipil saja.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dipecah menjadi dua agar jelas tanpa menghilangkan urutan tindakan dan tujuan dalam teks Yunani. Kapitalisasi pronomina bagi Yesus mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
