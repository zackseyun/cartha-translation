base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: id
  text: Setiap orang yang jatuh pada batu itu akan hancur berkeping-keping[a], tetapi siapa pun yang ditimpa batu itu, batu itu akan melumatkannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan remuk.”
    reason: lexical_alternative
  - marker: b
    text: Atau “akan digilingnya menjadi debu” atau “akan diceraiberaikannya seperti sekam”; kata kerja Yunani ini menyatakan sesuatu yang lebih kuat daripada sekadar benturan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Setiap orang yang jatuh
  rationale: Partisipel berartikel ini berfungsi sebagai nomina dan menyatakan cakupan umum. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan arti universal.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: pada batu itu
  rationale: ἐπί dengan akusatif sesudah πίπτω menyatakan gerakan menuju atau mengenai batu; 'pada batu itu' mempertahankan daya tunjuk ἐκεῖνον tanpa membuat frasa kaku.
- source_word: συνθλασθήσεται
  choice: akan hancur berkeping-keping
  rationale: Bentuk pasif futur ini menyatakan hasil berupa kehancuran atau pecah berkeping-keping. Pilihan ini mempertahankan kerasnya gambaran tanpa menentukan mekanismenya secara berlebihan.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: tetapi siapa pun yang ditimpa batu itu
  rationale: Klausa relatif dengan ἄν dan subjungtif aoris menyatakan keadaan tak tentu, yaitu siapa pun yang menjadi sasaran jatuhnya batu. Bentuk pasif Indonesia ini alami dan membuat acuan subjek implisit, yakni batu, tetap jelas.
- source_word: λικμήσει
  choice: akan dilumatkannya
  rationale: λικμάω dapat menggambarkan penghancuran atau penampian hingga tercerai-berai. 'Melumatkan' menyampaikan daya penghancuran yang lebih kuat daripada sekadar benturan, sementara nuansa menjadi debu atau tercerai seperti sekam dicatat dalam catatan kaki.
- source_word: αὐτόν
  choice: -nya
  rationale: Pronomina maskulin tunggal ini mengacu kepada orang dalam klausa relatif. Sufiks '-nya' mempertahankan rujukan tunggal secara alami dalam bahasa Indonesia tanpa menambahkan jenis kelamin yang tidak perlu dinyatakan secara gramatikal dalam bahasa sasaran.
theological_decisions:
- issue: Gambaran penghakiman melalui batu
  choice: Mempertahankan batu sebagai pelaku penghakiman yang menghancurkan dan tidak memperlunak metafora.
  alternative: Menafsirkannya secara lebih ringan sebagai sekadar tersandung atau terluka.
  rationale: Dalam konteksnya, batu dari kutipan sebelumnya menjadi gambaran penghakiman yang menentukan. Kedua verba Yunani menyatakan akibat yang keras; terjemahan mempertahankan daya teologis itu tanpa menambahkan tafsiran di luar ayat.
- issue: Rujukan maskulin generik
  choice: Menggunakan bentuk 'siapa pun' dan pronomina '-nya'.
  alternative: Menyebut 'laki-laki itu' atau mengulang 'orang itu'.
  rationale: Maskulin tunggal Yunani berfungsi secara generik. Bahasa Indonesia tidak menandai gender pada pronomina orang ketiga, sehingga bentuk alami '-nya' mempertahankan jumlah dan acuan tanpa menyempitkan cakupan universal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan klausa dibuat alami dalam bahasa Indonesia, sambil mempertahankan kesejajaran kedua gambaran dan meningkatnya kekuatan dari hancur menjadi dilumatkan.
