id: LUK.20.17
reference: Luke 20:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: id
  text: 'Namun, Ia memandang mereka lalu berkata, “Jadi, apakah yang tertulis ini: ‘Batu yang ditolak oleh para pembangun, batu ini telah menjadi kepala sudut[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala sudut”; dapat juga diterjemahkan “batu penjuru” atau “batu puncak.”
    reason: Ungkapan Yunani κεφαλὴ γωνίας memakai gambaran arsitektural yang diperdebatkan. Catatan ini menyediakan padanan alternatif tanpa menentukan satu pengertian arsitektural dalam teks utama.
lexical_decisions:
- source_word: ἐμβλέψας
  choice: menatap
  rationale: Kata ini menunjukkan pandangan yang sengaja diarahkan kepada mereka. “Menatap” menyampaikan unsur kesengajaan tanpa harus menambahkan intensitas berlebihan.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Kalau begitu, apa maksud perkataan yang tertulis ini
  rationale: Ungkapan ini mempertahankan daya retoris pertanyaan dan keadaan tetap dari γεγραμμένον. Penambahan “maksud perkataan” diperlukan agar pertanyaan tersebut wajar dan jelas dalam bahasa Indonesia modern.
- source_word: Λίθον
  choice: Batu
  rationale: Dalam kutipan ini batu tersebut segera diperjelas oleh klausa relatif, sehingga “batu” merupakan padanan Indonesia yang alami tanpa perlu menambahkan kata sandang.
- source_word: ἀπεδοκίμασαν
  choice: ditolak
  rationale: “Ditolak” secara ringkas menyampaikan penilaian bahwa batu itu dianggap tidak layak lalu disingkirkan.
- source_word: οἱ οἰκοδομοῦντες
  choice: tukang-tukang bangunan
  rationale: Partisip substantival ini menunjuk kepada orang-orang yang membangun; pilihan ini alami dalam bahasa Indonesia dan mempertahankan metafora bangunan.
- source_word: οὗτος
  choice: justru batu itu
  rationale: 'Konstruksi ini menampilkan kembali batu yang disebut sebelumnya dan mempertahankan penekanan demonstratif οὗτος. “Justru” menonjolkan pembalikan: batu yang mereka tolak itulah yang memperoleh kedudukan utama.'
- source_word: ἐγενήθη εἰς
  choice: telah menjadi
  rationale: “Telah menjadi” menyampaikan perubahan keadaan beserta hasilnya yang tetap relevan dalam kutipan Kitab Suci.
- source_word: κεφαλὴν γωνίας
  choice: batu utama pada sudut bangunan
  rationale: Padanan ini menyampaikan kedudukan utama (κεφαλή) dan hubungan dengan sudut bangunan (γωνία), tetapi tidak memastikan apakah yang dimaksud adalah batu fondasi di sudut atau batu puncak.
theological_decisions:
- issue: Gambaran arsitektural dalam kutipan Mazmur 118:22
  choice: batu utama pada sudut bangunan
  alternative: batu penjuru; batu puncak; secara harfiah, kepala sudut
  rationale: Ungkapan Yunani dapat dipahami sebagai batu penjuru ataupun batu puncak. Teks utama memakai ungkapan luas yang mempertahankan kedudukan utama dan unsur sudut, sedangkan catatan kaki menyajikan kemungkinan lain tanpa menetapkan satu tafsiran arsitektural atau teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Ia” dipakai sebagai pronomina naratif yang lazim dalam ragam Alkitab Indonesia. Bentuk “tukang-tukang bangunan” mudah dipahami pembaca umum, sedangkan “justru batu itu” mempertahankan penekanan dalam teks Yunani.
