  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: id
  text: 'Namun, Dia menjawab mereka, “Aku juga akan mengajukan satu pertanyaan kepada kalian. Jawablah Aku:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Namun, sebagai jawaban Dia berkata kepada mereka
  rationale: Ungkapan ini mempertahankan daya responsif partisip ἀποκριθείς, verba utama εἶπεν, dan peralihan atau kontras ringan yang ditandai δέ, dalam susunan bahasa Indonesia yang wajar.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ λόγον
  choice: Aku juga akan mengajukan satu pertanyaan kepada kalian
  rationale: κἀγώ menekankan bahwa Yesus pun akan bertanya kepada mereka. Dalam konstruksi ini λόγον secara idiomatis menunjuk pada hal yang ditanyakan, sehingga 'satu pertanyaan' lebih alami daripada terjemahan harfiah 'satu kata'.
- source_word: καὶ εἴπατέ μοι
  choice: Jawablah Aku
  rationale: Imperatif jamak εἴπατε dengan μοι secara harfiah berarti 'katakanlah kepada-Ku', tetapi setelah verba 'mengajukan pertanyaan', 'Jawablah Aku' menyampaikan fungsi pragmatisnya secara jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa ὑμᾶς dan εἴπατε berbentuk jamak. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
