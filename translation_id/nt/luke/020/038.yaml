id: LUK.20.38
reference: Luke 20:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: id
  text: Namun, Dia bukanlah Allah orang mati, melainkan Allah orang hidup, sebab bagi-Nya semua orang hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab di hadapan-Nya semua orang hidup.”
    reason: alternative_reading
lexical_decisions:
- source_word: θεὸς
  choice: Allah
  rationale: Dalam konteks monoteisme Yahudi, θεός tanpa artikel ini tetap definit dan secara wajar diterjemahkan sebagai “Allah”.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai kelanjutan dengan nuansa kontras ringan; “Namun” menghubungkan pernyataan ini dengan argumen sebelumnya tanpa menambahkan unsur waktu.
- source_word: νεκρῶν
  choice: orang mati
  rationale: Bentuk genitif jamak ini dipakai secara substantival; “Allah orang mati” ringkas dan alami dalam bahasa Indonesia.
- source_word: ζώντων
  choice: orang hidup
  rationale: Partisipel ini bersifat substantival dan membentuk kontras langsung dengan “orang mati”.
- source_word: πάντες
  choice: semua orang
  rationale: Ungkapan ini mempertahankan keluasan πάντες tanpa membatasinya secara eksplisit hanya kepada para leluhur yang sedang dibicarakan.
- source_word: αὐτῷ
  choice: bagi-Nya
  rationale: Dativus αὐτῷ bersifat padat secara semantis. “Bagi-Nya” mempertahankan hubungan dengan Allah tanpa memaksakan arti tujuan (“untuk-Nya”) atau lokasi (“di hadapan-Nya”).
- source_word: ζῶσιν
  choice: hidup
  rationale: Bentuk kini aktif ini paling langsung diterjemahkan “hidup”.
theological_decisions:
- issue: Makna αὐτῷ dalam πάντες γὰρ αὐτῷ ζῶσιν
  choice: sebab bagi-Nya semua orang hidup
  alternative: sebab di hadapan-Nya semua orang hidup
  rationale: “Bagi-Nya” mempertahankan kepadatan dan ketegangan teologis dativus Yunani serta mendukung argumen mengenai kebangkitan tanpa merinci secara berlebihan bagaimana semua orang itu hidup dalam relasi dengan Allah.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pola “bukanlah ... melainkan ...” menjaga kontras οὐκ ... ἀλλά. Pronomina ilahi ditulis dengan huruf kapital mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
