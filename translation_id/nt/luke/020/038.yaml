  source_fidelity: 'Teks Indonesia menyampaikan kontras utama οὐκ ... ἀλλὰ dengan tepat: Allah bukan Allah orang mati, melainkan Allah orang hidup. Klausa πάντες γὰρ αὐτῷ ζῶσιν diterjemahkan secara dekat sebagai “sebab bagi-Nya semua orang hidup,” tanpa mengunci dativus αὐτῷ pada penafsiran doktrinal yang lebih sempit. “Namun” merupakan padanan yang masih wajar untuk δέ dalam konteks argumentatif ini.'
