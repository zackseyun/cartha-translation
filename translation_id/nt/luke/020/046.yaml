id: LUK.20.46
reference: Luke 20:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: id
  text: “Waspadalah terhadap ahli-ahli Taurat yang suka berjalan-jalan dengan jubah panjang[a], suka menerima salam penghormatan di pasar-pasar, dan menyukai tempat duduk terhormat di rumah-rumah ibadat[b] serta tempat kehormatan dalam perjamuan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jubah panjang merupakan pakaian mencolok yang dapat menandakan kedudukan sosial.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “kursi-kursi utama”; yaitu tempat duduk yang dianggap paling terhormat di rumah ibadat.
    reason: lexical_alternative
  - marker: c
    text: Atau “tempat-tempat utama” dalam perjamuan, yakni posisi yang diberikan kepada tamu paling terhormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Waspadalah terhadap
  rationale: Ungkapan imperatif ini memperingatkan para pendengar agar berjaga-jaga terhadap kelompok yang disebut; bentuk Indonesia ini alami dan mempertahankan daya peringatannya.
- source_word: γραμματέων
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk para ahli hukum Kitab Suci Yahudi; padanan ini lebih mudah dipahami pembaca Indonesia daripada transliterasi atau 'juru tulis'.
- source_word: τῶν θελόντων περιπατεῖν
  choice: yang suka berjalan-jalan
  rationale: Partisipel θέλω menyatakan kegemaran atau keinginan yang mencirikan mereka, sedangkan περιπατέω di sini menggambarkan penampilan di muka umum.
- source_word: ἐν στολαῖς
  choice: dengan jubah panjang
  rationale: στολή menunjuk pakaian panjang atau megah yang dapat menandakan kedudukan; 'jubah panjang' jelas dan tidak berlebihan.
- source_word: φιλούντων ἀσπασμοὺς
  choice: suka menerima salam penghormatan
  rationale: Secara harfiah mereka 'menyukai salam-salam'; penambahan 'menerima' dan 'penghormatan' menyampaikan bahwa yang dikejar ialah pengakuan sosial di ruang publik, bukan sekadar sapaan biasa.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: di pasar-pasar
  rationale: ἀγορά adalah kawasan pasar sekaligus ruang publik; padanan ringkas ini alami dalam bahasa Indonesia dan konteksnya menunjukkan sifat publik.
- source_word: πρωτοκαθεδρίας
  choice: tempat duduk terhormat
  rationale: Istilah ini menunjuk kursi utama atau berkedudukan tinggi dalam rumah ibadat; padanan tersebut menonjolkan fungsi kehormatannya tanpa menentukan letak fisiknya.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: di rumah-rumah ibadat
  rationale: Padanan ini dikenal luas dan menjelaskan fungsi συναγωγή bagi pembaca umum; istilah 'sinagoge' tetap merupakan alternatif yang sah.
- source_word: πρωτοκλισίας
  choice: tempat kehormatan
  rationale: Istilah ini menunjuk posisi utama dalam tata tempat makan perjamuan; terjemahan fungsional ini menghindari gambaran modern yang keliru seperti kursi biasa atau meja utama.
- source_word: ἐν τοῖς δείπνοις
  choice: dalam perjamuan
  rationale: δεῖπνον di sini adalah jamuan makan sosial; 'perjamuan' mempertahankan suasana resmi dan konteks pencarian status.
theological_decisions:
- issue: Lingkup kecaman terhadap ahli-ahli Taurat
  choice: Kata sandang dan rangkaian partisipel diterjemahkan sebagai peringatan terhadap ahli-ahli Taurat yang dicirikan oleh perilaku mencari kehormatan tersebut.
  alternative: Memahami ayat ini sebagai kecaman mutlak terhadap setiap ahli Taurat tanpa pengecualian, atau hanya terhadap pakaian mereka.
  rationale: Bahasa Yunani menyebut 'ahli-ahli Taurat' lalu menggambarkan mereka melalui kegemaran akan penampilan dan kehormatan publik. Terjemahan mempertahankan kerasnya peringatan tanpa memperluas atau mempersempit kecaman melampaui perilaku yang disebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar Yunani dipertahankan secara alami. 'Ahli-ahli Taurat' dan 'rumah-rumah ibadat' dipilih demi keterpahaman umum, sedangkan nuansa status sosial dijelaskan secukupnya melalui pilihan kata dan catatan kaki.
