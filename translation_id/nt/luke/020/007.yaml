  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: id
  text: Maka mereka menjawab bahwa mereka tidak tahu dari mana asalnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari mana.” Kata Yunani ini menanyakan asal atau sumber.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Maka
  rationale: Dalam alur narasi ini, καὶ menghubungkan jawaban mereka dengan pertimbangan pada ayat sebelumnya. “Maka” menyampaikan kelanjutan yang bernuansa hasil secara alami dalam bahasa Indonesia.
- source_word: ἀπεκρίθησαν
  choice: mereka menjawab
  rationale: Bentuk aoris dari ἀποκρίνομαι secara lugas berarti “menjawab” atau “memberi jawaban”; “mereka menjawab” sesuai dengan gaya narasi Indonesia.
- source_word: μὴ εἰδέναι
  choice: bahwa mereka tidak tahu
  rationale: Infinitif dengan μή setelah kata kerja menjawab berfungsi sebagai tuturan tidak langsung. Bentuk klausa “bahwa mereka tidak tahu” lebih alami daripada meniru konstruksi infinitif Yunani.
- source_word: πόθεν
  choice: dari mana asalnya
  rationale: πόθεν menunjuk pada asal atau sumber. “Dari mana asalnya” mempertahankan makna itu dan secara kontekstual merujuk pada baptisan Yohanes tanpa menambahkan penjelasan ke dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada naratif. Kata “asalnya” mempertahankan rujukan implisit kepada baptisan Yohanes dari konteks sebelumnya.
