  text: For they no longer dared to ask him anything.
translation:
  language: id
  text: Sebab mereka tidak berani lagi menanyakan apa pun kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: tidak ... lagi
  rationale: Ungkapan ini secara alami menyatakan bahwa keberanian untuk bertanya telah berhenti sejak saat itu.
- source_word: γὰρ
  choice: Sebab
  rationale: Kata penghubung ini mempertahankan hubungan penjelasan dengan konteks sebelumnya.
- source_word: ἐτόλμων
  choice: berani
  rationale: Bentuk imperfek menyatakan keberanian atau kesediaan pada masa lampau; bersama οὐκέτι, terjemahan 'tidak berani lagi' menyampaikan penghentiannya secara wajar dalam bahasa Indonesia.
- source_word: ἐπερωτᾶν
  choice: menanyakan
  rationale: Dalam konteks pertanyaan yang diajukan kepada seseorang, 'menanyakan ... kepada' merupakan padanan Indonesia yang alami dan tetap mencakup nuansa bertanya atau mempertanyakan.
- source_word: αὐτὸν
  choice: kepada-Nya
  rationale: Pronomina ini merujuk kepada Yesus. Bentuk kapital mengikuti kebiasaan penulisan bahasa Indonesia untuk pronomina yang merujuk kepada Tuhan.
- source_word: οὐδέν
  choice: apa pun
  rationale: 'Dalam kalimat negatif, ''apa pun'' secara idiomatis menyampaikan cakupan menyeluruh: tidak ada satu hal pun yang berani mereka tanyakan.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan 'tidak berani lagi' dipilih karena lebih alami daripada 'tidak lagi berani', tanpa mengubah makna. Tidak diperlukan catatan kaki.
