id: LUK.20.1
reference: Luke 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: id
  text: Pada salah satu hari itu, ketika Yesus sedang mengajar orang banyak di kompleks Bait Allah[b] dan memberitakan kabar baik[a], imam-imam kepala dan para ahli Taurat, bersama para tua-tua, datang menghampiri-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memberitakan Injil.”'
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani yang dipakai di sini menunjuk pada seluruh kompleks Bait Allah, bukan hanya ruang suci bagian dalam.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Pada suatu hari
  rationale: Ungkapan pembuka naratif Lukas digabungkan secara alami dengan keterangan waktu berikutnya; terjemahan harfiah seperti 'Dan terjadilah' akan terasa kaku dalam bahasa Indonesia modern.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: Pada suatu hari
  rationale: Menunjukkan satu hari yang tidak ditentukan dalam rangkaian peristiwa yang sedang berlangsung.
- source_word: διδάσκοντος αὐτοῦ
  choice: ketika Yesus sedang mengajar
  rationale: Menyampaikan tindakan yang berlangsung bersamaan secara alami; nama 'Yesus' memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: τὸν λαὸν
  choice: orang banyak
  rationale: Dalam konteks pengajaran umum di Bait Allah, pilihan ini alami dan mencakup masyarakat yang hadir tanpa membatasi maknanya pada kelompok kepemimpinan.
- source_word: ἐν τῷ ἱερῷ
  choice: di kompleks Bait Allah
  rationale: ἱερόν menunjuk seluruh kawasan Bait Allah, bukan secara khusus ruang suci bagian dalam.
- source_word: εὐαγγελιζομένου
  choice: memberitakan kabar baik
  rationale: Mempertahankan makna verbal tentang penyampaian berita baik dengan bahasa umum, tanpa menjadikannya istilah gerejawi teknis.
- source_word: ἐπέστησαν
  choice: datanglah ... menghampiri-Nya
  rationale: Menggambarkan kedatangan langsung kepada Yesus tanpa menambahkan unsur permusuhan yang tidak dinyatakan secara eksplisit oleh verba tersebut.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Menunjuk kelompok pemimpin keimaman, bukan beberapa pemegang jabatan imam besar secara bersamaan.
- source_word: γραμματεῖς
  choice: para ahli Taurat
  rationale: Sebutan historis yang lazim dan mudah dipahami bagi para pakar serta penafsir hukum Taurat.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: bersama para tua-tua
  rationale: Mempertahankan penanda kebersamaan dan nama kelompok pemimpin masyarakat tersebut.
theological_decisions:
- issue: Pemaknaan εὐαγγελιζομένου dalam narasi pelayanan Yesus
  choice: memberitakan kabar baik
  alternative: memberitakan Injil
  rationale: Pilihan utama mempertahankan arti leksikal verba dalam konteks pelayanan publik Yesus serta menghindari penyempitan menjadi istilah gerejawi yang lebih teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan inversi 'datanglah', sedangkan penanda kaki ditempatkan langsung sesudah frasa yang diterangkannya.
