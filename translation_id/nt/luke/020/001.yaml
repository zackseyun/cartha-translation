    rationale: Frasa Yunani ἐν μιᾷ τῶν ἡμερῶν menunjuk satu hari dalam rangkaian hari yang sedang berlangsung. “Pada salah satu hari itu” menyampaikan nuansa tersebut tanpa menjadi kaku.
  - severity: medium
    issue: Konstruksi “datanglah ... menghampiri-Nya” canggung dan berlebihan.
    rationale: Kedua verba menyatakan gerak mendekat, tetapi pemisahannya oleh subjek membuat kalimat kurang alami. “... datang menghampiri-Nya” menyatakan ἐπέστησαν dengan lancar dan tanpa menambahkan nada konfrontatif.
