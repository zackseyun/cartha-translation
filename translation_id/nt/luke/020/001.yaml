  source_fidelity: Terjemahan pada dasarnya setia pada teks Yunani. Namun, ἐν μιᾷ τῶν ἡμερῶν lebih tepat dipertahankan sebagai “Pada salah satu hari itu,” yang mencerminkan bahwa hari tersebut merupakan bagian dari rangkaian hari yang sedang dibicarakan. τὸν λαόν dapat diterjemahkan secara alami sebagai “orang banyak” dalam konteks pengajaran umum.
  naturalness: Susunan “datanglah imam-imam kepala dan para ahli Taurat bersama para tua-tua menghampiri-Nya” tidak alami karena verba “datanglah” dan “menghampiri-Nya” bertumpuk dalam konstruksi inversi. Menempatkan subjek lebih dahulu dan memakai “datang menghampiri-Nya” menghasilkan kalimat baku yang lancar.
  terminology: “Bait Allah,” “imam-imam kepala,” “para ahli Taurat,” dan “para tua-tua” merupakan padanan yang tepat dan lazim. “Memberitakan kabar baik” mempertahankan makna εὐαγγελιζομένου tanpa memaksakan istilah teknis; alternatif “memberitakan Injil” layak dicatat dalam catatan kaki.
  issues:
