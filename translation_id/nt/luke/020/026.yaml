  register: Bahasa Indonesia modern, wajar, dan bermartabat. Terjemahan mempertahankan citra tindakan menangkap tetapi menjelaskan hubungan idiomatisnya dengan perkataan Yesus melalui frasa 'berdasarkan perkataan-Nya'.
