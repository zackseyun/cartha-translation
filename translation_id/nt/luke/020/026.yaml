  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: id
  text: Mereka tidak mampu menangkap-Nya melalui perkataan-Nya di hadapan orang banyak,[a] dan takjub akan jawaban-Nya, mereka pun terdiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjebak-Nya melalui apa yang dikatakan-Nya di hadapan orang banyak.”
    reason: alternatif leksikal untuk ungkapan idiomatis «menangkap-Nya melalui perkataan-Nya».
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: tidak berhasil
  rationale: Mengungkapkan ketidakmampuan mereka mencapai tujuan dalam konteks usaha menjebak Yesus, dengan bahasa Indonesia yang alami.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: menangkap Dia berdasarkan perkataan-Nya
  rationale: Mempertahankan gambaran 'menangkap' sekaligus menyampaikan maksud idiomatis bahwa mereka hendak memperoleh dasar untuk menjerat Yesus melalui ucapan-Nya. Objek 'Dia' tersirat dari konteks.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: di hadapan orang banyak
  rationale: Menyatakan tindakan terbuka di hadapan khalayak; 'orang banyak' alami dalam konteks narasi ini tanpa membatasi λαός secara teologis.
- source_word: θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ
  choice: karena kagum akan jawaban-Nya
  rationale: Partisip aoris menyatakan reaksi yang menyertai dan mendahului sikap diam mereka; konstruksi kausal terasa alami dalam bahasa Indonesia.
- source_word: ἐσίγησαν
  choice: mereka pun terdiam
  rationale: '''Terdiam'' menangkap peralihan menuju keadaan diam, sedangkan ''pun'' menandai hasil setelah mereka kagum.'
