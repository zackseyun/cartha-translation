  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: id
  text: “Tunjukkanlah kepada-Ku sekeping dinar.[a] Gambar dan tulisan siapakah yang terdapat padanya?” Mereka menjawab, “Kaisar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinar adalah uang logam Romawi yang umum digunakan pada masa itu; nama mata uang ini dipertahankan untuk menjaga latar sejarahnya.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Tunjukkanlah kepada-Ku
  rationale: Imperatif aoris ini menyampaikan perintah langsung. Bentuk ini alami dan bermartabat dalam bahasa Indonesia; huruf kapital pada pronomina mengikuti kebiasaan penulisan rujukan kepada Yesus.
- source_word: δηνάριον
  choice: sekeping dinar
  rationale: Nama mata uang dipertahankan demi ketepatan sejarah, sedangkan kata penggolong 'sekeping' membuat frasa ini alami dalam bahasa Indonesia.
- source_word: τίνος
  choice: siapakah
  rationale: Bentuk interogatif genitif menanyakan orang yang gambar dan tulisannya tertera pada uang itu. Susunan 'Gambar dan tulisan siapakah' menyampaikan hubungan tersebut secara idiomatis.
- source_word: εἰκόνα
  choice: gambar
  rationale: '''Gambar'' merupakan padanan yang jelas dan wajar untuk rupa yang dicetak pada mata uang, tanpa mempersempitnya secara tidak perlu menjadi ''potret''.'
- source_word: ἐπιγραφήν
  choice: tulisan
  rationale: Dalam konteks uang logam, kata ini menunjuk pada tulisan atau inskripsi. 'Tulisan' lebih mudah dipahami pembaca umum dan tetap tepat.
- source_word: ἔχει
  choice: yang terdapat padanya
  rationale: Ungkapan ini menerjemahkan secara alami gagasan bahwa uang tersebut memiliki atau memuat gambar dan tulisan, tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Mereka menjawab
  rationale: Gabungan partisip dan verba ujaran dialihkan menjadi satu verba finit yang alami, sambil mempertahankan alur narasi.
- source_word: Καίσαρος
  choice: Kaisar
  rationale: Jawaban Yunani hanya berupa bentuk genitif 'milik/berkaitan dengan Kaisar'. Karena pertanyaan Indonesia sudah memakai 'siapakah', jawaban ringkas 'Kaisar' alami dan menjaga keringkasan aslinya.
