  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: id
  text: 'Lalu Yesus mulai menyampaikan perumpamaan ini kepada orang banyak: “Seorang laki-laki menanam sebuah kebun anggur, lalu menyewakannya kepada para penggarap. Setelah itu, ia pergi[a] untuk waktu yang cukup lama.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pergi ke negeri lain.” Kata kerjanya dapat menyiratkan bahwa seseorang pergi meninggalkan daerah kediamannya, bahkan ke luar negeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Lalu Yesus mulai
  rationale: δέ menandai kelanjutan narasi, sedangkan ἤρξατο menyatakan dimulainya tindakan berbicara. Subjek tersirat dijelaskan sebagai Yesus berdasarkan konteks dekat agar kalimat Indonesia alami dan jelas.
- source_word: πρὸς τὸν λαὸν
  choice: kepada orang banyak
  rationale: Frasa ini menunjuk kepada khalayak yang sedang disapa. 'Orang banyak' terdengar alami dalam bahasa Indonesia dan tidak memberi nuansa politis yang dapat muncul dari kata 'rakyat'.
- source_word: λέγειν τὴν παραβολὴν ταύτην
  choice: menyampaikan perumpamaan ini
  rationale: λέγειν secara harfiah berarti mengatakan atau berbicara, tetapi dengan παραβολή sebagai objek, 'menyampaikan perumpamaan' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan jenis sastra perumpamaan.
- source_word: Ἄνθρωπος
  choice: Seorang laki-laki
  rationale: Bentuk tunggal maskulin ini memperkenalkan seorang tokoh laki-laki tertentu dalam cerita; terjemahan mempertahankan penandaan gender sumber.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: menanami sebuah kebun anggur
  rationale: φυτεύω berarti menanam. Dalam bahasa Indonesia, 'menanami sebuah kebun anggur' menyatakan secara alami bahwa kebun itu ditanami tanaman anggur.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: menyewakannya kepada para penggarap
  rationale: ἐκδίδωμι dalam konteks properti berarti menyewakan, sedangkan γεωργοί adalah orang-orang yang menggarap atau membudidayakan lahan. 'Para penggarap' mempertahankan fungsi pertanian mereka tanpa mengganti nomina itu dengan istilah hukum 'penyewa'.
- source_word: ἀπεδήμησεν
  choice: ia pergi
  rationale: Kata kerja ini menyatakan pergi meninggalkan daerah kediaman dan dapat menyiratkan perjalanan ke negeri lain. 'Pergi' mempertahankan arti dasar tanpa memastikan tujuan yang tidak disebutkan secara eksplisit.
- source_word: χρόνους ἱκανούς
  choice: untuk waktu yang cukup lama
  rationale: Bentuk jamak χρόνοι dengan ἱκανοί menunjuk pada jangka waktu yang berarti atau panjang. Ungkapan ini alami dan mempertahankan bobot durasinya.
theological_decisions:
- issue: Gender tokoh yang diperkenalkan dengan Ἄνθρωπος
  choice: Seorang laki-laki
  alternative: Seseorang
  rationale: Perumpamaan ini memperkenalkan satu tokoh laki-laki, bukan manusia secara umum. Pilihan ini mempertahankan informasi gender dalam sumber tanpa menambahkan identitas teologis tokoh tersebut.
- issue: Cakupan perjalanan dalam ἀπεδήμησεν
  choice: ia pergi
  alternative: ia pergi ke negeri lain
  rationale: Kata kerja Yunani dapat dipakai untuk perjalanan jauh atau ke luar negeri, tetapi tujuan di negeri lain tidak dinyatakan secara wajib. Teks utama mempertahankan keluasan makna, sedangkan kemungkinan yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, dengan istilah baku Injil 'perumpamaan' dan istilah konkret 'para penggarap'. Penanda catatan kaki ditempatkan sesudah 'pergi', yaitu pada unsur yang benar-benar dijelaskan oleh catatan tersebut.
