  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: id
  text: Dan Yesus berkata kepada mereka, “Anak-anak zaman ini[a] menikah dan dinikahkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Putra-putra zaman ini.” Ini adalah ungkapan maskulin yang mewakili orang-orang yang termasuk dalam zaman sekarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan narasi dan secara wajar memperkenalkan tanggapan Yesus tanpa memberi penekanan tambahan.
- source_word: εἶπεν αὐτοῖς
  choice: berkata kepada mereka
  rationale: Terjemahan langsung bagi verba λέγω dan pronomina datif; konteksnya memang berupa tanggapan, tetapi verba itu sendiri tidak mengharuskan arti ‘menjawab’.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Anak-anak zaman ini
  rationale: Mempertahankan ungkapan Semitis-Yunani ‘anak-anak ...’ yang menyatakan orang-orang yang menjadi bagian atau berciri khas suatu zaman. ‘Zaman ini’ menjaga kontras eskatologis dengan zaman yang akan datang.
- source_word: γαμοῦσιν
  choice: menikah
  rationale: Padanan Indonesia modern dan umum bagi tindakan memasuki perkawinan.
- source_word: γαμίσκονται
  choice: dinikahkan
  rationale: Bentuk pasif dipertahankan untuk membedakannya dari verba aktif sebelumnya dan untuk mencerminkan idiom perkawinan dalam teks sumber.
theological_decisions:
- issue: Ungkapan maskulin yang dipakai secara representatif
  choice: Anak-anak zaman ini
  alternative: Orang-orang zaman ini; Mereka yang hidup pada zaman ini
  rationale: υἱοί secara harfiah berarti ‘anak-anak lelaki/putra-putra’, tetapi dalam ungkapan ini menunjuk secara representatif kepada orang-orang yang termasuk dalam zaman sekarang. Terjemahan mempertahankan bentuk kiasannya, sedangkan catatan kaki menjelaskan cakupannya.
- issue: αἰών sebagai kategori eskatologis
  choice: zaman ini
  alternative: dunia ini
  rationale: ‘Zaman’ mempertahankan kontras antara tata kehidupan sekarang dan zaman yang akan datang dalam ayat-ayat berikutnya; ‘dunia’ dapat disalahpahami sebagai alam fisik.
- issue: Perbedaan antara bentuk aktif dan pasif dalam ungkapan perkawinan
  choice: menikah dan dinikahkan
  alternative: kawin dan dikawinkan; menikah
  rationale: Pasangan ini mempertahankan perbedaan gramatikal γαμοῦσιν dan γαμίσκονται tanpa menetapkan secara eksplisit bahwa masing-masing tindakan hanya berlaku bagi satu jenis kelamin.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Menikah’ dipilih daripada ‘kawin’ karena lebih lazim untuk manusia dalam ragam umum masa kini. Ungkapan ‘Anak-anak zaman ini’ dipertahankan untuk membawa idiom sumber, dengan catatan kaki guna mencegah kesan bahwa yang dimaksud hanya anak kecil atau hanya laki-laki.
