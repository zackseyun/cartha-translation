id: LUK.20.47
reference: Luke 20:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: id
  text: yang melahap rumah-rumah para janda dan berdoa panjang-panjang sebagai kedok.[a] Mereka ini akan menerima penghakiman yang lebih berat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan dalih” atau “demi penampilan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hukuman yang lebih berat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: melahap
  rationale: Kata kerja ini dipakai secara metaforis untuk tindakan mengeksploitasi dengan rakus. “Melahap” mempertahankan gambaran yang tajam tanpa menyiratkan tindakan makan secara harfiah.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: rumah-rumah para janda
  rationale: Terjemahan ini mempertahankan gambaran konkret dalam bahasa Yunani. “Rumah-rumah” kemungkinan mewakili rumah tangga atau harta milik para janda, tetapi makna metonimis itu tidak dijadikan eksplisit dalam teks utama.
- source_word: προφάσει
  choice: sebagai kedok
  rationale: Ungkapan ini menyatakan kepura-puraan atau dalih yang menutupi motif sebenarnya. “Sebagai kedok” alami dalam bahasa Indonesia dan mempertahankan tuduhan kemunafikan.
- source_word: μακρὰ προσεύχονται
  choice: berdoa panjang-panjang
  rationale: μακρά berfungsi adverbial dan menunjukkan doa yang panjang. Bentuk ulang “panjang-panjang” menyampaikan durasi sekaligus cocok dengan nada teguran dalam konteks.
- source_word: λήμψονται
  choice: akan menerima
  rationale: Bentuk futur ini menyatakan hasil yang kelak mereka terima; pilihan ini wajar dan bernada khidmat.
- source_word: περισσότερον κρίμα
  choice: penghakiman yang lebih berat
  rationale: “Penghakiman” mempertahankan keluasan makna κρίμα sebagai putusan atau tindakan menghakimi, sedangkan “lebih berat” mengungkapkan sifat komparatif περισσότερον tanpa mengaburkan bahwa hasilnya merugikan mereka.
theological_decisions:
- issue: Sifat κρίμα dalam konteks
  choice: penghakiman yang lebih berat
  alternative: hukuman yang lebih berat
  rationale: Konteks menunjukkan penghakiman ilahi yang bersifat menghukum, tetapi “penghakiman” mempertahankan keluasan leksikal κρίμα dan tidak menggantinya langsung dengan hasil hukumannya. Alternatif yang lebih interpretatif dicatat dalam catatan kaki.
- issue: Hubungan προφάσει dengan doa panjang
  choice: doa panjang dilakukan sebagai kedok
  alternative: doa panjang dilakukan demi penampilan atau dengan dalih tertentu
  rationale: Bahasa Yunani menuduh adanya kepura-puraan, tetapi tidak menjelaskan secara terperinci apakah doa itu terutama pertunjukan kesalehan atau dalih untuk menutupi eksploitasi. “Sebagai kedok” mempertahankan ketakterincian tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Awal dengan “yang” dipertahankan karena οἳ adalah kata ganti relatif yang melanjutkan gambaran tentang ahli-ahli Taurat dari ayat sebelumnya. Metafora “melahap rumah-rumah” sengaja dipertahankan agar daya kecam teks tidak dilunakkan.
