  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: id
  text: Ia lalu kembali mengutus seorang budak lain. Namun, mereka juga memukuli dan mempermalukan budak itu, lalu menyuruhnya pergi dengan tangan kosong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba.” Kata Yunani δοῦλος menunjuk pada seseorang yang terikat sebagai milik seorang tuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Kemudian ia mengutus
  rationale: Dalam konstruksi dengan infinitif, προστίθημι menyatakan bahwa tindakan dilanjutkan atau dilakukan lagi. Bahasa Indonesia alami cukup memakai alur naratif “kemudian ... mengutus,” tanpa terjemahan harfiah “menambahkan.”
- source_word: ἕτερον
  choice: yang lain
  rationale: Menunjukkan seorang budak tambahan yang berbeda dari budak sebelumnya.
- source_word: πέμψαι
  choice: mengutus
  rationale: “Mengutus” alami untuk tindakan pemilik yang mengirim wakilnya dengan suatu tugas.
- source_word: δοῦλον
  choice: budak
  rationale: Dalam perumpamaan ini, δοῦλος menunjuk pada orang yang berada dalam status kepemilikan dan diutus oleh tuannya; “budak” mempertahankan realitas sosial tersebut lebih jelas daripada “hamba.”
- source_word: κἀκεῖνον
  choice: budak itu juga
  rationale: Mengungkapkan penekanan bahwa orang kedua ini pun diperlakukan seperti yang pertama.
- source_word: δείραντες
  choice: mereka pukuli
  rationale: Menyampaikan pemukulan fisik berulang atau keras tanpa mempersempit caranya menjadi pencambukan.
- source_word: ἀτιμάσαντες
  choice: permalukan
  rationale: Mempertahankan unsur penghinaan dan hilangnya kehormatan yang terkandung dalam ἀτιμάζω.
- source_word: ἐξαπέστειλαν
  choice: menyuruhnya pergi
  rationale: Mengungkapkan bahwa mereka mengusir atau mengirim dia keluar, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: κενόν
  choice: dengan tangan kosong
  rationale: Ungkapan idiomatis Indonesia yang menyatakan bahwa ia tidak memperoleh hasil yang diharapkan.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam perumpamaan
  choice: budak
  alternative: hamba
  rationale: Relasi kepemilikan dalam latar perumpamaan cukup menonjol sehingga “budak” lebih tepat mempertahankan status sosial tokoh itu. Catatan kaki menyediakan pilihan tradisional “hamba” tanpa memasukkan penafsiran doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Mereka pukuli dan permalukan” mempertahankan kesejajaran kedua tindakan, sedangkan “dengan tangan kosong” menyampaikan implikasi κενόν secara idiomatis.
