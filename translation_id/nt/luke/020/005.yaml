source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: id
  text: Namun, mereka berunding di antara mereka sendiri dan berkata, “Jika kita berkata, ‘Dari surga,’ ia akan berkata, ‘Mengapa kalian tidak memercayainya?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa kalian tidak percaya kepadanya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελογίσαντο
  choice: berunding
  rationale: Kata ini menyatakan proses menimbang dan membahas bersama. Dalam konteks sekelompok orang yang menyusun jawaban, “berunding” alami dalam bahasa Indonesia dan tetap mempertahankan unsur pertimbangan.
- source_word: πρὸς ἑαυτοὺς
  choice: di antara mereka sendiri
  rationale: Ungkapan ini menunjukkan bahwa pembicaraan berlangsung di dalam kelompok mereka sendiri, bukan sekadar dalam pikiran masing-masing.
- source_word: λέγοντες
  choice: katanya
  rationale: Partisipel ini menyertai tindakan berunding dan memperkenalkan isi perkataan mereka. “Katanya” ringkas dan alami dalam narasi Indonesia.
- source_word: Ἐὰν εἴπωμεν
  choice: Jika kita berkata
  rationale: Bentuk bersyarat ini menyatakan kemungkinan jawaban yang sedang mereka pertimbangkan tanpa menambahkan tingkat kepastian yang tidak ada dalam teks.
- source_word: Ἐξ οὐρανοῦ
  choice: Dari surga
  rationale: Terjemahan ini mempertahankan idiom Yunani yang menunjuk pada asal atau wewenang ilahi tanpa menjelaskannya secara berlebihan menjadi “dari Allah.”
- source_word: ἐρεῖ
  choice: ia akan berkata
  rationale: Kata kerja Yunani secara harfiah berarti “akan berkata”; pertanyaan yang menyusul sudah menyampaikan daya interogatifnya.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan Indonesia yang langsung dan wajar untuk ungkapan tanya mengenai alasan.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: kalian tidak memercayai dia
  rationale: πιστεύω dengan objek datif dapat berarti memercayai atau menaruh kepercayaan kepada seseorang. “Memercayai dia” sesuai dengan konteks menerima kesaksian atau pemberitaan Yohanes dan tidak memperkuatnya menjadi rumusan “percaya kepada dia” dalam arti iman personal.
theological_decisions:
- issue: Makna asal baptisan Yohanes dalam jawaban tersirat “Dari surga”
  choice: Mempertahankan ungkapan “Dari surga”
  alternative: “Dari Allah”
  rationale: Ungkapan tersebut menyiratkan asal dan wewenang ilahi, tetapi teks Yunani menyebut “surga.” Mempertahankan idiom ini menghindari penjelasan teologis yang melampaui bentuk teks.
- issue: Nuansa πιστεύω terhadap Yohanes
  choice: “memercayai dia”
  alternative: “percaya kepadanya” atau “menaruh kepercayaan kepadanya”
  rationale: Konstruksi ini terutama menyangkut penerimaan terhadap perkataan atau kesaksian Yohanes. Terjemahan tidak dibuat menjadi “percaya kepada dia” jika ungkapan itu dapat dibaca sebagai rumusan iman yang lebih kuat daripada tuntutan sintaksis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Berunding” dipilih untuk menggambarkan pertimbangan bersama; “di antara mereka sendiri” mempertahankan batas internal kelompok. Huruf kecil “ia” dipakai karena teks tidak menuntut kapitalisasi penghormatan.
