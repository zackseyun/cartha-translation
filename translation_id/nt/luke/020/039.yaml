base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: id
  text: Lalu beberapa ahli Taurat menanggapi, “Guru, perkataan-Mu tepat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: menanggapi
  rationale: Partisip aoristus ini memperkenalkan tanggapan lisan. Bentuk verba finit “menanggapi” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa sebelumnya diajukan pertanyaan langsung.
- source_word: δέ
  choice: Lalu
  rationale: Partikel ini menandai peralihan ringan dalam alur percakapan; “Lalu” menghubungkan tanggapan para ahli Taurat dengan perkataan Yesus sebelumnya tanpa memberi tekanan pertentangan.
- source_word: τινες τῶν γραμματέων
  choice: beberapa ahli Taurat
  rationale: Ungkapan ini menunjukkan hanya sebagian dari kelompok tersebut. Dalam bahasa Indonesia, “beberapa ahli Taurat” menyampaikan makna partitif itu secara alami.
- source_word: γραμματέων
  choice: ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk para pakar dan penafsir hukum Taurat. “Ahli Taurat” merupakan padanan Indonesia yang baku dan mudah dipahami.
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Bentuk vokatif dari διδάσκαλος secara langsung berarti sapaan “Guru”.
- source_word: καλῶς
  choice: tepat
  rationale: Adverbia ini memuji kebenaran atau ketepatan ucapan Yesus. “Tepat” alami dalam konstruksi Indonesia dan mempertahankan unsur penilaian positif.
- source_word: εἶπας
  choice: perkataan-Mu
  rationale: Aoristus dari λέγω merujuk pada apa yang baru saja Yesus katakan. Konstruksi nominal “perkataan-Mu tepat” lebih alami daripada terjemahan verbal yang kaku dan tetap menyampaikan isi ungkapan Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Sapaan kepada Yesus memakai huruf kapital pada enklitik “-Mu” sesuai kebiasaan penulisan teks Alkitab Indonesia. Tidak diperlukan catatan kaki karena ragam makna καλῶς dapat diwakili secara memadai oleh “tepat” tanpa menghapus ketegangan teologis atau ambiguitas penting.
