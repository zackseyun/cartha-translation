  text: But perceiving their cunning[a], he said to them,
translation:
  language: id
  text: Namun, setelah menyadari kelicikan mereka[a], Yesus berkata kepada mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tipu muslihat” atau “kecerdikan licik.” Kata Yunani ini menunjuk pada siasat cerdik yang tidak jujur.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: karena mengetahui
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului perkataan Yesus dan menunjukkan bahwa ia mengenali atau memahami maksud licik mereka. Bentuk kausal menghasilkan bahasa Indonesia yang alami tanpa memperkuatnya menjadi 'membongkar' atau 'menembus' pikiran mereka.
- source_word: δὲ
  choice: Namun
  rationale: 'Partikel ini menandai peralihan dengan kontras ringan: para penanya berusaha menjebak Yesus, tetapi ia mengetahui kelicikan mereka.'
- source_word: αὐτῶν
  choice: mereka
  rationale: Genitif ini secara alami dinyatakan sebagai pemilik dalam frasa Indonesia 'kelicikan mereka'.
- source_word: πανουργίαν
  choice: kelicikan
  rationale: Kata ini menunjuk pada kecerdikan yang tidak jujur atau siasat yang tidak bermoral. 'Kelicikan' mempertahankan unsur kecerdikan sekaligus penilaian moral negatif.
- source_word: εἶπεν
  choice: Yesus berkata
  rationale: Kata kerja ini adalah bentuk naratif biasa untuk 'berkata'. Nama 'Yesus' digunakan agar subjek jelas dalam bahasa Indonesia, berdasarkan konteks langsung.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Dengan verba berbicara, πρός dan akusatif menunjukkan pihak yang disapa; 'kepada mereka' merupakan padanan Indonesia yang wajar.
