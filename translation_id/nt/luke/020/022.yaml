  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: id
  text: Apakah kita diperbolehkan membayar pajak kepada Kaisar[a], atau tidak?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “upeti”. Istilah Yunani ini menunjuk pada pajak yang dibayarkan kepada penguasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: diperbolehkan
  rationale: Menyatakan soal boleh atau tidaknya suatu tindakan tanpa menentukan apakah tolok ukurnya hukum Romawi atau hukum agama.
- source_word: ἡμᾶς
  choice: kita
  rationale: Menerjemahkan subjek konstruksi infinitif secara alami tanpa menambahkan keterangan etnis yang tidak tersurat.
- source_word: Καίσαρι
  choice: kepada Kaisar
  rationale: Mempertahankan gelar historis penguasa Romawi serta kekhususan politis pertanyaan itu.
- source_word: φόρον
  choice: pajak
  rationale: Dalam konteks ini berarti pungutan yang dibayarkan kepada kekuasaan yang memerintah; 'pajak' merupakan padanan Indonesia yang alami.
- source_word: δοῦναι
  choice: membayar
  rationale: Walaupun arti dasarnya 'memberikan', kolokasi alami dalam bahasa Indonesia untuk pajak ialah 'membayar pajak'.
- source_word: ἢ οὔ
  choice: atau tidak
  rationale: Bentuk idiomatis dan langsung untuk penutup pertanyaan alternatif tersebut.
theological_decisions:
- issue: Dasar dari apa yang 'diperbolehkan'
  choice: Tidak menyebutkan apakah yang dimaksud ialah hukum sipil Romawi atau hukum Allah/agama Yahudi.
  alternative: Apakah menurut hukum Romawi kita boleh... / Apakah menurut hukum Allah kita boleh...
  rationale: Teks Yunani membiarkan dasar hukumnya tersirat. Terjemahan mempertahankan ambiguitas dan ketegangan politis-keagamaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan wajar. 'Diperbolehkan' cukup formal untuk konteks perdebatan, sedangkan 'membayar pajak' lebih alami daripada terjemahan harfiah 'memberikan upeti/pajak'.
