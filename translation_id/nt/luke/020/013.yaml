base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: id
  text: Lalu pemilik kebun anggur itu berkata[a], “Apa yang harus kulakukan? Aku akan mengutus anak laki-laki-Ku yang terkasih. Mungkin mereka akan menghormatinya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tuan kebun anggur itu.”'
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “menghormatinya” juga dapat berarti “merasa malu di hadapannya” atau “menunjukkan rasa segan kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: pemilik kebun anggur
  rationale: Dalam konteks perumpamaan agraris ini, frasa tersebut menunjuk kepada orang yang memiliki kebun anggur. Pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan gelar teologis ke dalam tokoh cerita.
- source_word: Τί ποιήσω;
  choice: Apa yang harus kulakukan?
  rationale: Subjungtif aoris deliberatif menyatakan pertanyaan kepada diri sendiri mengenai tindakan yang akan diambil; bentuk ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: πέμψω
  choice: Aku akan mengutus
  rationale: Bentuk futurum menyatakan tindakan yang telah diputuskan. “Mengutus” sesuai untuk pengiriman seorang wakil dan mempertahankan nuansa yang mungkin penting dalam perumpamaan.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: anakku yang terkasih
  rationale: Mempertahankan makna khusus υἱός sebagai anak laki-laki dalam konteks ini serta bobot ἀγαπητός dan kemungkinan gaung kristologisnya, tanpa menambahkan tafsiran.
- source_word: ἴσως
  choice: mungkin
  rationale: Menyatakan harapan atau kemungkinan tanpa kepastian dan terdengar wajar dalam bahasa Indonesia.
- source_word: τοῦτον
  choice: -nya
  rationale: Demonstrativa itu merujuk secara tegas kepada sang anak; pronomina enklitik pada “menghormatinya” menyampaikan rujukan tersebut secara alami dalam bahasa Indonesia.
- source_word: ἐντραπήσονται
  choice: akan menghormati
  rationale: Dalam konteks ini verba tersebut berarti menunjukkan rasa hormat atau segan terhadap seseorang. “Menghormati” adalah padanan modern yang paling jelas, sementara arti harfiahnya yang berkaitan dengan rasa malu dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan κύριος dalam perumpamaan ketika tokohnya dapat melambangkan Allah
  choice: pemilik kebun anggur
  alternative: tuan kebun anggur
  rationale: Makna langsung pada tingkat cerita ialah pemilik kebun. Pilihan ini mempertahankan alur perumpamaan sambil membiarkan pembaca menangkap analogi teologisnya tanpa memaksakan gelar “Tuhan”.
- issue: Gaung kristologis frasa τὸν υἱόν μου τὸν ἀγαπητόν
  choice: anakku yang terkasih
  alternative: anakku, dia yang terkasih
  rationale: Susunan yang dipilih alami dalam bahasa Indonesia dan tetap mempertahankan kaitan potensial dengan bahasa tentang Anak yang terkasih dalam Injil Lukas, tanpa memperluas teks secara interpretatif.
- issue: Nuansa ἐντραπήσονται
  choice: mereka akan menghormatinya
  alternative: mereka akan merasa malu di hadapannya / segan kepadanya
  rationale: Konteks mendukung tindakan menunjukkan hormat atau segan. Catatan kaki mempertahankan rentang makna yang lebih luas agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Bentuk persona pertama terikat (“kulakukan”, “anakku”) menjaga kelancaran dialog. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
