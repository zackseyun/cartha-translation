  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: id
  text: Pada waktunya, ia mengutus seorang budak kepada para penggarap kebun anggur supaya mereka memberikan kepadanya sebagian dari hasil kebun itu. Namun, para penggarap memukuli budak itu, lalu menyuruhnya pergi dengan tangan kosong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καιρῷ
  choice: Pada waktunya
  rationale: Datif waktu dengan καιρός menunjuk pada waktu yang sesuai atau telah tiba. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi waktu panen secara eksplisit.
- source_word: ἀπέστειλεν
  choice: ia mengutus
  rationale: Dalam konteks seorang pemilik yang memberi tugas kepada hambanya, 'mengutus' menyampaikan unsur pengiriman dengan mandat secara wajar.
- source_word: γεωργούς
  choice: para penggarap kebun anggur
  rationale: γεωργοί adalah orang-orang yang mengusahakan tanah; konteks ἀμπελών memberi kekhususan kebun anggur. 'Penggarap' tidak memastikan status hukum mereka sebagai penyewa.
- source_word: δοῦλον
  choice: seorang hamba
  rationale: δοῦλος dapat menunjuk pada budak atau hamba. 'Hamba' merupakan padanan Indonesia yang alami dalam latar rumah tangga kuno, meski status ketergantungannya tetap tersirat.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: supaya mereka memberikan kepadanya
  rationale: ἵνα dengan bentuk indikatif futur menyatakan tujuan dalam pemakaian Koine; 'supaya' menyampaikannya dengan jelas.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: sebagian dari hasil kebun itu
  rationale: ἀπό dengan genitif memiliki nuansa partitif. 'Sebagian dari hasil' mempertahankan makna itu, sedangkan 'kebun itu' merujuk secara alami pada kebun anggur yang sudah disebut.
- source_word: ἐξαπέστειλαν
  choice: menyuruhnya pergi
  rationale: Kata majemuk ini berarti mengirim atau menyuruh pergi. Pilihan tersebut mempertahankan arah menjauh tanpa terdengar kaku.
- source_word: δείραντες
  choice: memukuli hamba itu, lalu
  rationale: Partisip aoris δέρω menyatakan tindakan memukul yang mendahului pengusiran. Susunan verba berurutan ini alami dan jelas dalam bahasa Indonesia.
- source_word: κενόν
  choice: dengan tangan kosong
  rationale: κενός secara harfiah berarti 'kosong'; dalam konteks orang yang tidak menerima hasil apa pun, idiom Indonesia 'dengan tangan kosong' menyampaikan maksudnya secara tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'penggarap kebun anggur' mempertahankan latar pertanian tanpa memasukkan status penyewa yang tidak dinyatakan langsung oleh γεωργοί. Tidak diperlukan catatan kaki karena nuansa utama dapat disampaikan secara alami dalam teks.
