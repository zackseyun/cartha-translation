base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: id
  text: Lalu Yesus berkata kepada mereka, “Aku pun tidak akan memberi tahu kalian dengan wewenang apa Aku melakukan hal-hal ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Lalu Yesus berkata kepada mereka
  rationale: Dalam alur narasi bahasa Indonesia, καί pada awal kalimat secara alami berfungsi sebagai penghubung urutan dan diterjemahkan “Lalu”; frasa selebihnya dipertahankan secara langsung.
- source_word: Οὐδὲ ἐγὼ
  choice: Aku pun tidak akan
  rationale: Οὐδέ mengaitkan penolakan Yesus dengan ketidakmauan para pemimpin menjawab pada ayat sebelumnya. Bentuk “Aku pun tidak akan” menyampaikan hubungan timbal balik itu secara alami tanpa menambahkan alasan bagi penolakan tersebut.
- source_word: λέγω ὑμῖν
  choice: memberi tahu kalian
  rationale: Walaupun λέγω secara dasar berarti “berkata”, dengan penerima dan isi jawaban yang tersirat, “memberi tahu” merupakan ungkapan Indonesia yang paling alami dan tepat.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: dengan wewenang apa
  rationale: Ungkapan ini menanyakan dasar atau kewenangan yang menyertai tindakan Yesus. “Dengan wewenang apa” idiomatis dalam bahasa Indonesia dan mempertahankan susunan pertanyaan Yunani.
- source_word: ἐξουσίᾳ
  choice: wewenang
  rationale: Di sini ἐξουσία menunjuk pada hak atau kewenangan yang sah untuk bertindak, bukan sekadar kekuatan atau kemampuan.
- source_word: ταῦτα
  choice: hal-hal ini
  rationale: Pilihan ini mempertahankan bentuk jamak yang menunjuk pada berbagai tindakan Yesus yang sedang dipersoalkan.
- source_word: ποιῶ
  choice: Aku melakukan
  rationale: Kala kini Yunani diterjemahkan dengan bentuk kini umum yang alami dalam bahasa Indonesia, tanpa memaksakan aspek progresif.
theological_decisions:
- issue: Penolakan Yesus untuk menjawab para pemimpin
  choice: Menyatakannya sebagai penolakan langsung untuk mengungkapkan dengan wewenang apa Ia bertindak.
  alternative: Menambahkan bahwa Yesus mengelak atau bahwa penolakan itu merupakan penghukuman eksplisit atas ketidakpercayaan mereka.
  rationale: Ayat ini hanya menyatakan bahwa Yesus tidak akan memberi tahu mereka. Terjemahan tidak menambahkan penilaian moral atau penjelasan teologis yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan bahwa ὑμῖν berbentuk jamak; sapaan ini jelas dan mudah dipahami. Tidak diperlukan catatan kaki karena alternatif “berdasarkan wewenang apa” tidak mengungkapkan ambiguitas penting yang harus dipertahankan.
