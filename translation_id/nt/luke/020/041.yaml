  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: id
  text: Lalu Ia berkata kepada mereka, “Bagaimana orang dapat mengatakan bahwa Mesias[a] adalah anak Daud[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini karena konteksnya secara khusus membahas pembebas dari garis Daud yang dinantikan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “seorang anak Daud” atau “Sang Anak Daud.” Secara harfiah, teks Yunani berbunyi “anak Daud.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Partikel ini menandai peralihan ringan dalam alur percakapan. “Lalu” lebih alami dalam bahasa Indonesia daripada kontras kuat seperti “tetapi,” karena tidak ada pertentangan tegas yang dinyatakan.
- source_word: πρὸς αὐτούς
  choice: kepada mereka
  rationale: Padanan langsung dan wajar untuk konstruksi yang memperkenalkan pihak yang diajak berbicara.
- source_word: Πῶς
  choice: Bagaimana
  rationale: Mempertahankan bentuk pertanyaan mengenai dasar atau logika pernyataan tersebut tanpa mengubahnya menjadi pertanyaan “mengapa.”
- source_word: λέγουσιν
  choice: orang dapat mengatakan
  rationale: Bentuk orang ketiga jamak tidak menyebut subjek tertentu. “Orang” mempertahankan ketidakjelasan subjek, sedangkan “dapat” membuat pertanyaan retoris ini alami dalam bahasa Indonesia tanpa menentukan kelompok tertentu.
- source_word: τὸν χριστόν
  choice: Mesias
  rationale: Χριστός dipakai sebagai gelar bagi sosok kerajaan yang dinantikan dan dibicarakan dalam hubungannya dengan Daud; “Mesias” menampilkan konteks Yahudi tersebut dengan jelas.
- source_word: εἶναι
  choice: adalah
  rationale: Infinitif sesudah λέγουσιν secara alami menjadi klausa dengan “bahwa ... adalah” dalam bahasa Indonesia.
- source_word: Δαυὶδ υἱόν
  choice: anak Daud
  rationale: Padanan ini mempertahankan gambaran hubungan anak dan ayah dalam teks serta tidak menentukan apakah frasa itu harus dipahami sebagai sebutan baku “Anak Daud” atau sekadar seorang keturunan Daud.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Konteks secara khusus membahas sosok pembebas-rajawi dari garis Daud yang dinantikan. “Mesias” menonjolkan fungsi gelarnya, sementara catatan kaki mempertahankan padanan tradisional “Kristus.”
- issue: Bahasa mengenai hubungan Mesias dengan Daud
  choice: anak Daud
  alternative: seorang anak Daud; Sang Anak Daud; keturunan Daud
  rationale: Pilihan ini mengikuti susunan Yunani secara dekat dan mempertahankan ketegangan yang akan dikembangkan dalam ayat-ayat berikutnya. Huruf kecil dan ketiadaan kata sandang tambahan menghindari penetapan bahwa frasa itu di sini sudah menjadi gelar teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang dapat mengatakan” menyampaikan subjek jamak yang tidak ditentukan dan membuat pertanyaan retoris terdengar alami. Kata “Ia” mempertahankan rujukan pronominal teks sumber tanpa menambahkan nama Yesus.
