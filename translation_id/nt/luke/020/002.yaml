  verdict: approve
  source_fidelity: 'Teks Indonesia secara setia menyampaikan semua unsur utama Yunani: penghubung naratif, ujaran kepada Yesus, imperatif «katakanlah kepada kami», dasar tindakan «dengan wewenang apa», objek jamak «hal-hal ini», serta pertanyaan alternatif mengenai pihak yang telah memberi wewenang tersebut. «Wewenang» tepat untuk ἐξουσία dalam konteks legitimasi tindakan. Pergeseran «yang memberikan» dari partisipel aoris δούς tidak mengubah makna pokok secara material dalam bahasa Indonesia.'
  naturalness: Bahasa Indonesia baku, jelas, dan alami. Bentuk sapaan «Engkau/-Nya/-Mu» konsisten dengan register Alkitab yang bermartabat. «Dengan wewenang apa» dan «siapakah yang memberikan wewenang itu kepada-Mu?» terdengar idiomatis.
  terminology: «Wewenang» dipakai konsisten untuk kedua kemunculan ἐξουσία dan secara baik membedakan otoritas atau mandat dari sekadar kemampuan. Kapitalisasi pronomina untuk Yesus sesuai konvensi penerbitan Alkitab Indonesia.
