  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: id
  text: Lalu mereka berkata kepada-Nya, “Katakanlah kepada kami, dengan wewenang apa Engkau melakukan hal-hal ini? Atau siapakah yang memberikan wewenang itu kepada-Mu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Menghubungkan pertanyaan ini dengan tindakan sebelumnya dalam alur narasi secara alami; dalam konteks ini καὶ dapat berfungsi sebagai penghubung naratif tanpa harus diterjemahkan secara kaku sebagai 'dan'.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: mereka berkata kepada-Nya
  rationale: Merangkum konstruksi partisipial yang berulang secara idiomatis, dengan tetap mempertahankan pelaku dan arah ujaran.
- source_word: Εἰπὸν ἡμῖν
  choice: Katakanlah kepada kami
  rationale: Menyampaikan imperatif aoris dengan bentuk Indonesia yang wajar dan tetap mencerminkan desakan langsung.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: dengan wewenang apa
  rationale: ἐν dengan datif menunjuk pada dasar atau lingkup tindakan yang sah; 'dengan wewenang apa' merupakan ungkapan Indonesia yang alami dalam pertanyaan tentang legitimasi.
- source_word: ταῦτα ποιεῖς
  choice: Engkau melakukan hal-hal ini
  rationale: Mempertahankan bentuk jamak ταῦτα dan kala kini ποιεῖς tanpa memaksakan nuansa aspek yang tidak alami dalam bahasa Indonesia.
- source_word: ἢ
  choice: Atau
  rationale: Mempertahankan pertanyaan kedua sebagai rumusan alternatif yang berkaitan erat dengan pertanyaan pertama.
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: siapakah yang memberikan ... kepada-Mu
  rationale: Menyampaikan arti partisipel berartikel ὁ δούς secara alami. Bentuk 'siapakah' tetap menonjolkan identitas pemberi wewenang.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: wewenang itu
  rationale: ἐξουσία di sini adalah hak atau mandat yang sah, bukan sekadar kemampuan. Demonstratif diterjemahkan 'itu' karena menunjuk kembali kepada wewenang yang baru saja dipersoalkan.
theological_decisions:
- issue: Makna ἐξουσία dalam konfrontasi di Bait Allah
  choice: wewenang
  alternative: kuasa; hak
  rationale: '''Wewenang'' paling tepat menyatakan legitimasi atau mandat untuk bertindak yang sedang dipersoalkan para pemimpin, tanpa menyempitkannya menjadi kekuatan atau kemampuan semata.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Yesus memakai kapitalisasi pronomina yang lazim dalam penerbitan Alkitab bahasa Indonesia. Kalimat langsung dipertahankan sebagai dua pertanyaan yang saling berkaitan.
