  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: id
  text: Namun, bahwa orang-orang mati dibangkitkan, Musa pun telah menyatakannya dalam bagian tentang semak duri[a]. Di sana ia menyebut Tuhan[b] sebagai Allah Abraham, Allah Ishak, dan Allah Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di semak duri”—ungkapan Yunani ini dapat menunjuk pada peristiwa di semak itu sendiri atau, secara idiomatis, pada bagian Kitab Suci tentang semak yang menyala (Kel. 3).
    reason: lexical_alternative
  - marker: b
    text: 'Yunani: “Tuhan”; sebutan ini mencerminkan kebiasaan Septuaginta menerjemahkan nama ilahi dalam Keluaran 3.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: dibangkitkan
  rationale: Bentuk kini pasif ini paling wajar diterjemahkan dengan bentuk pasif dalam konteks kebangkitan, sekaligus mempertahankan tersiratnya tindakan Allah tanpa menambahkannya secara eksplisit.
- source_word: οἱ νεκροὶ
  choice: orang mati
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kolektif adjektiva yang dipakai sebagai nomina.
- source_word: ἐμήνυσεν
  choice: telah menyatakannya
  rationale: Kata ini berarti memberitahukan atau membuat sesuatu diketahui. Pilihan ini mempertahankan fungsi kesaksian Musa tanpa menjadikannya suatu proklamasi resmi.
- source_word: ἐπὶ τῆς βάτου
  choice: dalam bagian tentang semak duri
  rationale: Dalam konteks ini, ungkapan tersebut dapat menunjuk secara idiomatis pada bagian Kitab Suci mengenai semak duri dalam Keluaran 3; alternatif lokatifnya dipertahankan dalam catatan kaki.
- source_word: ὡς λέγει
  choice: ketika ia menyebut
  rationale: Dengan konstruksi yang mengikutinya, frasa ini memperkenalkan sebutan Musa bagi Tuhan sebagai Allah Abraham, Ishak, dan Yakub.
- source_word: κύριον
  choice: Tuhan
  rationale: Menerjemahkan gelar ilahi κύριος secara langsung dan lazim dalam bahasa Indonesia.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Allah Abraham, Allah Ishak, dan Allah Yakub
  rationale: Pengulangan kata θεός dipertahankan untuk menjaga penekanan dan irama kutipan yang menjadi dasar argumen Yesus.
theological_decisions:
- issue: Bahasa kebangkitan dalam argumen Yesus terhadap orang Saduki
  choice: orang mati dibangkitkan
  alternative: orang mati bangkit
  rationale: Bentuk pasif lebih dekat dengan ἐγείρονται dan mempertahankan tindakan ilahi yang tersirat tanpa menjelaskan pelakunya melampaui teks.
- issue: Penerjemahan κύριος dalam kutipan yang merujuk kepada Allah Israel
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani memakai κύριος, sehingga teks utama menerjemahkannya sebagai “Tuhan”; kaitannya dengan tradisi penerjemahan nama ilahi dalam Keluaran dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan mudah dipahami. Susunan kalimat mempertahankan penekanan “bahkan Musa” serta pengulangan “Allah” dalam rumusan Abraham, Ishak, dan Yakub.
