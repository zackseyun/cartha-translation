  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: id
  text: 'kata mereka, “Guru, Musa menulis bagi kita: Jika saudara seseorang meninggal dalam keadaan beristri[a] dan ia tidak mempunyai anak, saudaranya harus mengambil istri itu dan menegakkan keturunan[b] bagi saudaranya yang telah meninggal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “meninggal dengan meninggalkan seorang istri”; teks Yunani secara harfiah berbunyi “meninggal dengan mempunyai istri.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menegakkan keturunan” menggemakan bahasa hukum dalam Ulangan 25:5 tentang menyediakan keturunan atas nama saudara yang meninggal; secara harfiah, “membangkitkan benih.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guru
  rationale: Sapaan langsung kepada Yesus; “Guru” merupakan padanan modern yang wajar dan tidak memasukkan gagasan lain yang tidak dinyatakan teks.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Musa menulis bagi kita
  rationale: Datif ἡμῖν menyatakan kepentingan atau acuan bagi umat Israel, bukan bahwa Musa mengirim tulisan langsung kepada mereka.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: Jika saudara seseorang meninggal
  rationale: Mempertahankan sifat tak tentu dan umum dari τινος serta bentuk tunggal ungkapan Yunani.
- source_word: ἔχων γυναῖκα
  choice: dalam keadaan beristri
  rationale: Mencerminkan arti harfiah partisip Yunani, yaitu meninggal ketika mempunyai istri, tanpa langsung menafsirkan ungkapan itu sebagai “meninggalkan seorang istri”.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: dan tidak mempunyai anak
  rationale: οὗτος menunjuk kepada saudara yang meninggal; ἄτεκνος berarti tidak mempunyai anak atau keturunan.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: saudaranya harus mengambil istri itu
  rationale: “Harus” menyampaikan ketentuan hukum dalam klausa ἵνα, sedangkan “mengambil istri itu” tetap dekat dengan ungkapan Yunani tanpa memperluasnya menjadi penjelasan adat.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: membangkitkan keturunan
  rationale: Mempertahankan gema ungkapan hukum dalam Ulangan 25:5 sambil memakai “keturunan” yang lebih jelas daripada “benih” bagi pembaca modern.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: bagi saudaranya yang telah meninggal
  rationale: Datif menyatakan bahwa keturunan itu diperhitungkan bagi saudara yang meninggal. Tambahan “yang telah meninggal” memperjelas rujukan pronomina yang sudah nyata dalam konteks tanpa mengubah maknanya.
theological_decisions:
- issue: Bahasa hukum perkawinan levirat
  choice: saudaranya harus mengambil istri itu dan membangkitkan keturunan bagi saudaranya yang telah meninggal
  alternative: saudaranya harus memperistri janda itu dan memperoleh anak atas nama saudaranya
  rationale: Pilihan utama mempertahankan corak dan idiom hukum Kitab Suci tanpa memasukkan penjelasan budaya atau doktrinal ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan nuansa kutipan hukum Musa, sementara penjelasan idiom budaya ditempatkan dalam catatan kaki.
