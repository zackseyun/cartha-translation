revisions:
- from: Para ahli Taurat dan imam-imam kepala berusaha menangkap Dia[a] saat itu juga, tetapi mereka takut kepada rakyat. Sebab, mereka tahu bahwa Ia telah menyampaikan perumpamaan itu untuk mengecam mereka[b].
  to: Para ahli Taurat dan imam-imam kepala berusaha menangkap Dia[a] pada saat itu juga, tetapi mereka takut kepada orang banyak. Sebab, mereka tahu bahwa perumpamaan itu Ia tujukan terhadap mereka[b].
  rationale: Revisi membatasi penafsiran eksplisit pada πρὸς αὐτούς sambil tetap menyatakan arah adversatif yang ditunjukkan konteks. “Orang banyak” menggantikan “rakyat” demi kelaziman naratif, dan catatan kaki a diperbaiki agar harfiah serta alami dalam bahasa Indonesia.
