review_pass:
  verdict: revise
  source_fidelity: Terjemahan utama secara umum mencerminkan tindakan yang diupayakan para ahli Taurat dan imam-imam kepala, penekanan waktu yang segera, ketakutan mereka, dan pengenalan mereka akan sasaran perumpamaan. Namun, “untuk mengecam mereka” mempersempit πρὸς αὐτούς menjadi maksud eksplisit untuk mengecam. Dalam konteks memang bernuansa adversatif, tetapi “ditujukan terhadap mereka” menyampaikan daya tersebut tanpa menambahkan tujuan yang lebih spesifik daripada teks.
  naturalness: Bahasa draft sudah baku dan mudah dipahami. “Orang banyak” lebih lazim dan netral daripada “rakyat” untuk τὸν λαόν dalam adegan naratif ini. Susunan “mereka tahu bahwa perumpamaan itu Ia tujukan terhadap mereka” juga lebih wajar daripada “Ia telah menyampaikan perumpamaan itu untuk mengecam mereka.”
  terminology: “Para ahli Taurat,” “imam-imam kepala,” dan “perumpamaan” adalah padanan yang tepat dan konsisten. “Menangkap Dia” dapat dipertahankan sebagai pengungkapan idiomatis, asalkan catatan kaki mencatat ungkapan harfiahnya dan tidak mengunci nuansa tindakan lebih daripada yang diperlukan.
  issues:
  - severity: medium
    issue: “untuk mengecam mereka” terlalu interpretatif untuk πρὸς αὐτούς.
    rationale: Frasa Yunani itu, dalam konteks, jelas bermakna adversatif, tetapi tidak secara leksikal menyatakan tujuan “untuk mengecam.” “Ditujukan terhadap mereka” mempertahankan daya konfrontatif sekaligus keluasan ungkapan.
  - severity: low
    issue: “rakyat” kurang cocok untuk τὸν λαόν dalam konteks ini.
    rationale: Walaupun dapat berarti populace, “orang banyak” merupakan padanan Indonesia yang lebih idiomatis dalam narasi Injil dan tidak membawa konotasi politik modern yang lebih kuat.
  - severity: low
    issue: Catatan kaki a memakai “menaruh tangan atas Dia,” yang tidak alami dalam bahasa Indonesia.
    rationale: “Meletakkan tangan pada Dia” lebih dekat pada bentuk harfiah dan lebih dapat dipahami; alternatif “menangkap” dan “menahan” cukup untuk menjelaskan idiom tersebut.
