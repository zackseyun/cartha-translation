  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: id
  text: Para ahli Taurat dan imam-imam kepala berusaha menangkap Dia[a] pada saat itu juga, tetapi mereka takut kepada orang banyak. Sebab, mereka tahu bahwa perumpamaan itu Ia tujukan terhadap mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meletakkan tangan pada Dia”; dapat juga diterjemahkan “menangkap Dia” atau “menahan Dia.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “kepada mereka” atau “mengenai mereka”; dalam konteks ini, frasa tersebut kemungkinan berarti bahwa perumpamaan itu ditujukan terhadap mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: berusaha
  rationale: Bentuk aoris merangkum niat dan upaya mereka tanpa menyatakan bahwa upaya itu berhasil.
- source_word: γραμματεῖς
  choice: para ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk pada kelompok yang ahli dalam hukum Taurat; padanan ini lebih jelas bagi pembaca Indonesia modern daripada bentuk harfiah yang kurang lazim.
- source_word: ἀρχιερεῖς
  choice: imam-imam kepala
  rationale: Bentuk jamak ini menunjuk pada kalangan pemimpin keimaman, bukan pada beberapa imam besar yang sedang menjabat sekaligus.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: menangkap Dia
  rationale: Ungkapan harfiah 'menaruh tangan atas Dia' merupakan idiom untuk tindakan menangkap atau menahan secara paksa. 'Menangkap Dia' menyampaikan maksud kontekstualnya secara alami, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: saat itu juga
  rationale: Padanan ini mempertahankan penekanan pada tindakan yang hendak dilakukan segera pada kesempatan yang sama.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: mereka takut kepada rakyat
  rationale: λαός di sini mengacu pada masyarakat luas, bukan semata-mata kerumunan yang kebetulan berkumpul.
- source_word: ἔγνωσαν
  choice: mereka tahu
  rationale: Padanan sederhana ini menyampaikan pengenalan mereka akan sasaran perumpamaan tanpa menambahkan penafsiran psikologis.
- source_word: πρὸς αὐτοὺς
  choice: untuk mengecam mereka
  rationale: Dalam konteks reaksi bermusuhan para pemimpin, frasa ini menyatakan bahwa perumpamaan tersebut diarahkan kepada mereka dengan daya menentang atau mengecam. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: Ini adalah padanan Indonesia yang mapan dan tepat untuk παραβολή dalam konteks Injil-injil Sinoptik.
theological_decisions:
- issue: Daya makna πρὸς αὐτοὺς dalam hubungan dengan perumpamaan Yesus
  choice: Perumpamaan itu disampaikan untuk mengecam para pemimpin agama.
  alternative: Perumpamaan itu disampaikan kepada mereka atau mengenai mereka.
  rationale: Reaksi langsung mereka menunjukkan bahwa mereka memahami diri sebagai pihak yang dikecam dalam perumpamaan sebelumnya. Terjemahan utama menyampaikan daya konfrontatif konteks, sedangkan catatan kaki mempertahankan keluasan makna preposisinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para ahli Taurat' serta 'imam-imam kepala' mempertahankan identitas kelompok historis dengan ungkapan yang mudah dipahami. Kata ganti 'Dia' dan 'Ia' digunakan secara wajar untuk Yesus tanpa menambah gelar yang tidak terdapat dalam teks Yunani.
