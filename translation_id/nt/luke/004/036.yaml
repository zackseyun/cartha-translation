    issue: Pengantar kutipan “katanya” tidak selaras dengan subjek jamak.
    rationale: Dalam bahasa Indonesia baku, “katanya” lazimnya merujuk pada satu pihak atau berfungsi sebagai pelapor takberpribadi; setelah “mereka,” bentuk ini janggal. Teks Yunani memakai partisip jamak λέγοντες, sehingga “sambil berkata” adalah perbaikan langsung tanpa mengubah makna.
