source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: id
  text: Semua orang diliputi rasa takjub, dan mereka berbicara satu sama lain sambil berkata, “Perkataan apakah ini[a], sehingga dengan wewenang dan kuasa ia memerintah roh-roh najis, dan roh-roh itu pun keluar?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pesan apakah ini?” Kata Yunani logos dapat berarti “perkataan”, “pesan”, atau “hal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: rasa takjub
  rationale: Ungkapan ini menyatakan keadaan sangat heran atau kagum dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: semua orang diliputi
  rationale: Pilihan ini mempertahankan gambaran bahwa ketakjuban mendatangi atau menguasai semua orang, tanpa menghasilkan susunan yang kaku.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: mereka berbicara satu sama lain
  rationale: Bentuk imperfek menggambarkan percakapan yang sedang berlangsung, sedangkan frasa timbal balik menunjukkan bahwa mereka saling berbicara.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Perkataan apakah ini
  rationale: λόγος dapat menunjuk pada perkataan, pesan, atau hal. 'Perkataan' sesuai dengan konteks perintah lisan Yesus sambil mempertahankan keluasan maknanya melalui catatan kaki.
- source_word: ὅτι
  choice: sehingga
  rationale: Dalam konteks ini ὅτι mengantar penjelasan tentang sifat perkataan yang membuat orang banyak takjub. 'Sehingga' menghubungkan pertanyaan itu secara alami dengan tindakan memerintah dan hasilnya.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: dengan wewenang dan kuasa
  rationale: Kata depan ἐν berfungsi secara modal atau instrumental. 'Wewenang' menyatakan hak untuk memerintah, sedangkan 'kuasa' menyatakan kemampuan efektif; urutan Yunani dipertahankan.
- source_word: ἐπιτάσσει
  choice: ia memerintah
  rationale: Kata ini berarti memberi perintah dengan tegas. Bentuk kini dalam bahasa Indonesia menjaga kejelasan dan daya hidup laporan orang banyak.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: roh-roh najis
  rationale: Terjemahan harfiah dan lazim ini mempertahankan latar kenajisan dalam Injil serta tidak mengurangi makhluk tersebut menjadi sekadar keadaan psikologis.
- source_word: ἐξέρχονται
  choice: roh-roh itu pun keluar
  rationale: '''Keluar'' merupakan padanan alami dalam konteks roh meninggalkan orang yang dirasuk. Pengulangan ''roh-roh itu'' menghindari ketidakjelasan rujukan kata ganti dalam bahasa Indonesia.'
theological_decisions:
- issue: Penyebutan makhluk jahat dalam konteks pengusiran roh
  choice: roh-roh najis
  alternative: roh-roh cemar
  rationale: Pilihan ini mempertahankan istilah konkret dalam narasi Yunani dan kerangka supernatural teks tanpa menambahkan penafsiran denominatif atau psikologis.
- issue: Hubungan antara wewenang dan kuasa Yesus
  choice: wewenang dan kuasa
  alternative: kuasa yang berwibawa
  rationale: Kedua nomina Yunani dipertahankan secara terpisah agar teks tetap menyatakan baik hak untuk memerintah maupun kemampuan efektif, tanpa meleburkan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah teologis yang sudah dikenal seperti 'roh-roh najis'. Kata ganti 'ia' tidak dikapitalisasi karena teks Yunani tidak menandai penghormatan melalui kapitalisasi.
