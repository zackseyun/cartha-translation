base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: id
  text: Mereka takjub akan pengajaran-Nya, sebab perkataan-Nya berwibawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “perkataan-Nya disampaikan dengan wibawa” atau “Ia berbicara dengan penuh wibawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: takjub
  rationale: Bentuk imperfek menggambarkan reaksi yang sedang berlangsung dalam adegan itu; “takjub” menyampaikan kuatnya rasa heran secara alami dalam bahasa Indonesia modern.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: akan pengajaran-Nya
  rationale: ἐπί dengan datif menunjukkan hal yang menjadi dasar atau sasaran ketakjuban mereka. “Pengajaran” dapat mencakup tindakan mengajar maupun isi ajaran.
- source_word: ὅτι
  choice: sebab
  rationale: ὅτι memperkenalkan alasan ketakjuban mereka; “sebab” mempertahankan hubungan kausal dalam ragam naratif yang wajar dan bermartabat.
- source_word: ἐν ἐξουσίᾳ
  choice: penuh kuasa
  rationale: Ungkapan ini menyatakan sifat atau cara perkataan Yesus disampaikan. “Penuh kuasa” alami dalam bahasa Indonesia dan mempertahankan tekanan pada kewibawaan yang melekat pada perkataan itu.
- source_word: ὁ λόγος αὐτοῦ
  choice: perkataan-Nya
  rationale: λόγος dalam konteks ini menunjuk pada perkataan atau tuturan Yesus. “Perkataan-Nya” mempertahankan bentuk ringkas sumber serta tidak membatasi makna hanya pada isi pesan.
theological_decisions:
- issue: Hakikat kuasa dalam perkataan Yesus
  choice: Menyatakan secara deskriptif bahwa perkataan-Nya “penuh kuasa” tanpa menjelaskan sumber teologis kuasa tersebut.
  alternative: Ia berbicara dengan penuh kuasa; pesan-Nya berwibawa.
  rationale: Ayat ini menegaskan kewibawaan perkataan Yesus, tetapi tidak menguraikan dasar kristologisnya. Terjemahan mempertahankan pernyataan teks tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk “-Nya” dipakai untuk rujukan yang jelas kepada Yesus dalam konteks ayat, sedangkan “penuh kuasa” dipilih agar konstruksi Yunani tidak terasa kaku dalam bahasa Indonesia.
