  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya setia: Πάντως sebagai “tentu,” futur ἐρεῖτε sebagai “akan,” παραβολή sebagai “peribahasa,” dan imperatif θεράπευσον/ποίησον terpelihara. Namun, “mengatakan peribahasa ini kepada-Ku” kurang idiomatis dalam bahasa Indonesia. Frasa ὅσα ἠκούσαμεν γενόμενα lebih jelas bila “apa yang kami dengar telah terjadi,” yang tetap mempertahankan sifat laporan dan tidak mengubah γενόμενα menjadi verba aktif. Nuansa preposisi εἰς pada “Kapernaum” sebaiknya didokumentasikan melalui catatan kaki.'
  naturalness: “Kamu tentu akan mengucapkan kepada-Ku peribahasa ini” lebih alami daripada “kamu akan mengatakan peribahasa ini kepada-Ku.” “Apa yang kami dengar telah terjadi di Kapernaum” juga menghasilkan hubungan yang lebih jelas dengan perintah berikutnya daripada “Segala sesuatu yang kami dengar telah terjadi.” Register tetap baku dan modern; “Tabib” dapat dipertahankan karena cocok dengan corak pepatah dan masih dapat dipahami.
  terminology: “Peribahasa” tepat untuk παραβολή dalam ayat ini, dan “kampung halaman” tepat untuk πατρίς dalam konteks Nazaret. “Tabib” dipertahankan sebagai istilah bernuansa pepatah, tanpa memasukkan makna teologis tambahan. Kapitalisasi pronomina yang merujuk kepada Yesus konsisten dengan konvensi penerbitan Alkitab Indonesia.
