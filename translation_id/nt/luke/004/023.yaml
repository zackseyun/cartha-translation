  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: id
  text: 'Lalu Yesus berkata kepada mereka, “Kamu tentu akan mengucapkan kepada-Ku peribahasa ini: ‘Tabib, sembuhkanlah dirimu sendiri!’ Apa yang kami dengar telah terjadi di Kapernaum[a], lakukanlah juga di sini, di kampung halaman-Mu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke/dalam Kapernaum.” Dalam konteks ini, bentuk tersebut berfungsi dengan makna tempat, sehingga diterjemahkan “di Kapernaum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Tentu
  rationale: Menyampaikan penegasan bahwa Yesus mengantisipasi perkataan mereka dengan yakin, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐρεῖτέ μοι
  choice: kamu akan mengatakan ... kepada-Ku
  rationale: Mempertahankan bentuk futur sebagai prediksi dan relasi langsung λέγω dengan datif.
- source_word: παραβολὴν
  choice: peribahasa
  rationale: Dalam konteks ini menunjuk pada ungkapan singkat yang bersifat pepatah, bukan perumpamaan berbentuk kisah.
- source_word: Ἰατρέ
  choice: Tabib
  rationale: Padanan yang ringkas dan bermartabat bagi sapaan kepada seorang penyembuh medis serta mempertahankan corak peribahasa.
- source_word: θεράπευσον σεαυτόν
  choice: sembuhkanlah dirimu sendiri
  rationale: Mempertahankan daya perintah aoristus dan arti langsung ungkapan tersebut.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Segala sesuatu yang kami dengar telah terjadi
  rationale: Mempertahankan sifat laporan berdasarkan apa yang didengar dan memakai 'terjadi' untuk γενόμενα tanpa mengubahnya menjadi tindakan aktif yang tidak dinyatakan secara eksplisit.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: di Kapernaum
  rationale: Dengan verba kejadian, εἰς berfungsi secara idiomatis dengan makna lokatif; 'di Kapernaum' merupakan ungkapan Indonesia yang wajar.
- source_word: ποίησον καὶ ὧδε
  choice: lakukanlah juga di sini
  rationale: Mempertahankan perintah yang luas dari ποίησον dan penekanan tambahan dari καί.
- source_word: ἐν τῇ πατρίδι σου
  choice: di kampung halaman-Mu
  rationale: Dalam konteks Nazaret, πατρίς menunjuk pada tempat asal, bukan negara atau bangsa.
theological_decisions:
- issue: Makna παραβολή dalam konteks ini
  choice: peribahasa
  alternative: perumpamaan; ungkapan
  rationale: Ucapan 'Tabib, sembuhkanlah dirimu sendiri' merupakan pepatah singkat, bukan perumpamaan naratif. Pilihan ini mempertahankan fungsi ungkapan dalam konteks tanpa memasukkan tafsiran doktrinal.
- issue: Nuansa γενόμενα dalam laporan tentang Kapernaum
  choice: telah terjadi
  alternative: telah dilakukan
  rationale: Bentuk γενόμενα secara langsung menyatakan hal-hal yang terjadi. Terjemahan ini menjaga ketegangan antara kejadian yang dilaporkan dan karya yang tersirat dari konteks, tanpa secara diam-diam menjadikannya bentuk aktif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai bentuk jamak yang dapat dipahami dari konteks; kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan bentuk prediktif dan imperatif teks Yunani.
