id: LUK.4.3
reference: Luke 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: id
  text: Lalu Iblis berkata kepada-Nya,[a] “Jika Engkau Anak Allah, suruhlah batu ini menjadi roti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena Engkau Anak Allah.” Syarat dalam bahasa Yunani dapat dipahami sebagai menerima premis itu demi mengajukan tantangan, tetapi teks utama mempertahankan bentuk bersyaratnya.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Lalu
  rationale: Partikel penghubung ringan δέ di sini melanjutkan urutan narasi; “Lalu” alami dalam bahasa Indonesia modern.
- source_word: διάβολος
  choice: Iblis
  rationale: Dalam konteks ini διάβολος berfungsi sebagai sebutan pribadi yang dikenal bagi lawan Allah; “Iblis” adalah padanan baku dan jelas dalam bahasa Indonesia.
- source_word: Εἰ
  choice: Jika
  rationale: “Jika” mempertahankan bentuk bersyarat dan daya tantangan dalam teks Yunani tanpa memutuskan apakah premis itu dianggap benar oleh si pembicara.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Anak Allah
  rationale: Dalam konteks kristologis ini, predikat tanpa artikel tersebut bersifat definit/kualitatif, bukan berarti “seorang anak Allah”; “Anak Allah” merupakan gelar yang wajar dalam bahasa Indonesia.
- source_word: εἰπὲ
  choice: suruhlah
  rationale: Imperatif λέγω diarahkan kepada batu dan mengandung tindak tutur agar sesuatu terjadi. “Suruhlah” lebih alami daripada “katakanlah kepada batu ini supaya,” tetapi tidak sekuat padanan interpretatif “perintahkanlah.”
- source_word: τῷ λίθῳ τούτῳ
  choice: batu ini
  rationale: λίθος lazim berarti “batu,” dan penunjuk τούτῳ dipertahankan sebagai “ini.”
- source_word: ἵνα γένηται
  choice: menjadi
  rationale: 'Sesudah “suruhlah,” konstruksi ἵνα dengan subjungtif dapat dialihkan secara alami sebagai pelengkap infinitival Indonesia: “menjadi.”'
- source_word: ἄρτος
  choice: roti
  rationale: ἄρτος berarti “roti”; “sepotong roti” akan menambahkan rincian yang tidak dinyatakan, sedangkan “makanan” terlalu luas.
theological_decisions:
- issue: Daya klausa bersyarat εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Jika Engkau Anak Allah
  alternative: Karena Engkau Anak Allah
  rationale: Teks utama mempertahankan bentuk bersyarat Yunani dan ketegangan dalam pencobaan itu, tanpa menyangkal status Yesus sebagai Anak Allah atau mengubah tantangan tersebut menjadi pernyataan sebab.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada kata ganti “-Nya” dan “Engkau” mengikuti kebiasaan umum teks Alkitab Indonesia ketika merujuk kepada Yesus; tanda koma sebelum penanda catatan kaki menjaga alur ujaran.
