id: LUK.4.16
reference: Luke 4:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: id
  text: Kemudian Yesus datang ke Nazara[a], tempat Ia dibesarkan. Seperti kebiasaan-Nya, pada hari Sabat Ia masuk ke sinagoge, lalu berdiri untuk membaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Nazaret". Teks Yunani di sini berbunyi "Nazara".
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: Mentransliterasikan secara langsung bentuk nama tempat dalam teks Yunani ayat ini, alih-alih menyelaraskannya dalam teks utama dengan bentuk Indonesia yang lebih dikenal, Nazaret.
- source_word: τεθραμμένος
  choice: dibesarkan
  rationale: Partisipel perfek pasif dari τρέφω dalam konteks ini menunjuk pada tempat Yesus diasuh dan menjalani masa pertumbuhan; 'dibesarkan' alami dalam bahasa Indonesia dan mempertahankan nuansa pasifnya.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: Seperti kebiasaan-Nya
  rationale: Ungkapan ini menyatakan tindakan yang biasa dilakukan; padanan ini ringkas, wajar, dan mempertahankan sifat kebiasaannya.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: pada hari Sabat
  rationale: Walaupun σαββάτων berbentuk jamak, keseluruhan frasa merupakan idiom Yunani yang dalam konteks ini merujuk pada hari Sabat.
- source_word: συναγωγήν
  choice: sinagoge
  rationale: Dalam latar kehidupan Yahudi ini, kata tersebut menunjuk pada tempat atau lembaga pertemuan ibadah Yahudi; 'sinagoge' adalah padanan Indonesia yang jelas dan baku.
- source_word: ἀνέστη ἀναγνῶναι
  choice: berdiri untuk membaca
  rationale: Verba aoris yang diikuti infinitif menyatakan bahwa Ia berdiri dengan tujuan membaca; susunan ini dekat dengan bahasa sumber dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk nama tempat Ναζαρά
  choice: Nazara
  alternative: Nazaret
  rationale: Teks utama mengikuti bentuk Yunani yang benar-benar terdapat dalam ayat ini dan tidak menyelaraskannya secara diam-diam dengan nama tradisional yang lebih dikenal. Bentuk 'Nazaret' diberikan sebagai alternatif di catatan kaki; keputusan ini tidak membawa pembedaan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Yesus diungkapkan untuk menjernihkan subjek yang tersirat dalam verba Yunani dan konteks dekat. Kalimat dibagi dua agar alami bagi pembaca Indonesia tanpa mengubah urutan peristiwa.
