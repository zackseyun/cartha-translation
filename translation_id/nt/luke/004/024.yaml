base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: id
  text: 'Lalu Dia berkata, “Sesungguhnya, Aku berkata kepada kalian: tidak ada nabi yang diterima di tempat asalnya.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kota asalnya”, “di daerah asalnya”, atau “di tanah airnya”. Kata Yunani πατρίς dapat menunjuk pada kota, daerah, atau tanah air seseorang; dalam konteks Nazaret, “kota asalnya” merupakan kemungkinan yang sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Lalu Dia berkata
  rationale: δέ merupakan penghubung ringan dalam alur narasi. “Lalu” menyampaikan kelanjutan tuturan secara alami tanpa memberi kesan pertentangan yang terlalu kuat.
- source_word: Ἀμὴν
  choice: Sesungguhnya
  rationale: Dalam perkataan Yesus, ἀμήν mengawali penegasan yang khidmat dan berwibawa. “Sesungguhnya” mempertahankan fungsi tersebut dalam ragam Indonesia yang wajar dan bermartabat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Terjemahan ini mempertahankan verba “berkata” dan sapaan orang kedua jamak ὑμῖν. “Kalian” membuat bentuk jamaknya jelas dalam bahasa Indonesia modern.
- source_word: οὐδεὶς προφήτης
  choice: tidak ada nabi
  rationale: Ini merupakan padanan langsung dan idiomatis bagi konstruksi subjek negatif Yunani tersebut.
- source_word: δεκτός
  choice: diterima
  rationale: Dalam konteks ini, δεκτός menunjuk pada penerimaan yang baik atau menguntungkan. “Diterima” mempertahankan cakupan maknanya tanpa mempersempitnya menjadi sekadar disambut.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: di tempat asalnya
  rationale: πατρίς dapat berarti kota asal, daerah asal, atau tanah air. “Tempat asal” mempertahankan keluasan leksikal itu, sementara konteks Nazaret mengarahkan pembaca pada lokasi asal Yesus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina “Dia” dan “Aku” mengikuti kebiasaan penghormatan dalam penerjemahan Alkitab Indonesia. “Kalian” dipakai untuk menampilkan bentuk jamak ὑμῖν secara jelas.
