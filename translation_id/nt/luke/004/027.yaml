id: LUK.4.27
reference: Luke 4:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: id
  text: Dan pada zaman Nabi Elisa, ada banyak orang yang sakit kusta[a] di Israel, dan tidak seorang pun dari mereka ditahirkan[b] selain Naaman, orang Siria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah yang diterjemahkan “kusta” dalam Alkitab dapat menunjuk pada berbagai penyakit kulit dan tidak selalu sama dengan penyakit Hansen yang kini disebut kusta.
    reason: Mencegah pembaca modern menyamakan cakupan istilah kuno ini secara mutlak dengan satu diagnosis medis modern.
  - marker: b
    text: “Ditahirkan” di sini mencakup kesembuhan dari penyakit serta pemulihan dari keadaan najis menurut latar Alkitab.
    reason: Menjelaskan jangkauan makna καθαρίζω tanpa menggantinya dengan istilah medis yang lebih sempit.
lexical_decisions:
- source_word: λεπροὶ
  choice: orang yang sakit kusta
  rationale: Ungkapan ini alami dan menghormati orang yang menderita penyakit tersebut, sekaligus mempertahankan istilah Alkitab yang lazim. Dalam pemakaian Alkitab, istilah Yunani ini dapat mencakup berbagai penyakit kulit, bukan hanya penyakit Hansen modern.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: di Israel
  rationale: Frasa ini secara alami menyatakan lokasi atau lingkungan keberadaan mereka tanpa mempersempit maknanya menjadi tanah atau bangsa saja.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: pada zaman Nabi Elisa
  rationale: Dengan bentuk genitif, ἐπί di sini menyatakan waktu. Susunan ini jelas, ringkas, dan wajar dalam bahasa Indonesia modern.
- source_word: ἐκαθαρίσθη
  choice: ditahirkan
  rationale: Pilihan ini mempertahankan bahasa pentahiran yang mencakup pemulihan jasmani sekaligus status kenajisan menurut latar Alkitab, tanpa mereduksinya menjadi sekadar 'disembuhkan'.
- source_word: εἰ μὴ
  choice: selain
  rationale: 'Dalam konteks ini, ungkapan tersebut menandai pengecualian: tidak seorang pun ditahirkan selain Naaman.'
- source_word: Ναιμὰν ὁ Σύρος
  choice: Naaman, orang Siria itu
  rationale: Frasa ini mempertahankan nama diri dan sebutan etnis yang bersifat mengidentifikasi. Kata 'itu' mencerminkan daya tunjuk artikel Yunani dan menegaskan bahwa penerima pentahiran tersebut adalah Naaman yang dikenal sebagai orang Siria.
theological_decisions:
- issue: Makna bahasa pentahiran dalam kaitannya dengan kusta
  choice: Menerjemahkan ἐκαθαρίσθη sebagai 'ditahirkan'.
  alternative: '''disembuhkan'' atau ''disucikan'''
  rationale: '''Ditahirkan'' mempertahankan ketegangan antara pemulihan jasmani dan kenajisan seremonial dalam idiom Alkitab, tanpa menambahkan klaim teologis di luar teks.'
- issue: Daya retoris sebutan etnis Naaman
  choice: Mempertahankan sebutan 'orang Siria itu' dalam teks utama.
  alternative: '''seorang Siria'''
  rationale: Artikel Yunani mendukung sebutan yang mengidentifikasi. Bentuk ini mempertahankan penekanan bahwa orang yang ditahirkan adalah seorang asing yang dikenal, bukan salah satu dari banyak penderita di Israel.
translation_notes:
  register: Bahasa modern, jelas, dan bermartabat. Bentuk 'orang yang sakit kusta' menghindari pelabelan orang berdasarkan penyakitnya. Istilah 'ditahirkan' dipertahankan karena penting bagi latar Alkitab, dengan catatan kaki untuk membantu pembaca umum.
