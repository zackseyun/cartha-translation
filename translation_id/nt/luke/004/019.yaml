  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: id
  text: untuk memberitakan tahun perkenanan Tuhan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk memberitakan tahun kemurahan Tuhan.”
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional, “tahun rahmat Tuhan.” Ungkapan ini menggemakan Yesaya 61:2 dan mungkin mengacu pada tema-tema Tahun Yobel.
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: untuk memberitakan
  rationale: Infinitif aoris ini melanjutkan rangkaian tujuan dari ayat sebelumnya. 'Memberitakan' mempertahankan nuansa pengumuman di muka umum tanpa membatasinya pada khotbah.
- source_word: ἐνιαυτὸν
  choice: tahun
  rationale: Kata ini lazimnya berarti 'tahun'. Bentuk konkret tersebut dipertahankan karena menggemakan Yesaya 61:2 dan tidak sepatutnya digeneralisasi menjadi 'masa'.
- source_word: κυρίου
  choice: Tuhan
  rationale: κύριος diterjemahkan dengan padanan baku 'Tuhan'. Susunan 'tahun perkenanan Tuhan' menyatakan bahwa tahun itu ditandai oleh perkenanan yang berasal dari Tuhan.
- source_word: δεκτόν
  choice: perkenanan
  rationale: Dalam konteks ini δεκτός menunjuk pada apa yang berkenan atau diterima dengan kemurahan. 'Perkenanan' menyampaikan gagasan kemurahan ilahi secara alami dalam frasa Indonesia ini.
theological_decisions:
- issue: Gema Yesaya 61:2 dan kemungkinan tema Yobel
  choice: Mempertahankan kata 'tahun' tanpa menambahkan 'Yobel' dalam teks utama.
  alternative: tahun Yobel Tuhan
  rationale: Bahasa Yunani menggemakan Yesaya 61:2 dan mungkin membangkitkan tema Yobel, tetapi tidak secara eksplisit memakai istilah 'Yobel'. Terjemahan tidak boleh memasukkan penafsiran itu ke dalam teks utama.
- issue: Makna δεκτόν dalam frasa tersebut
  choice: tahun perkenanan Tuhan
  alternative: tahun yang berkenan kepada Tuhan
  rationale: '''Perkenanan Tuhan'' menjaga kemungkinan bahwa tahun itu merupakan masa ketika Tuhan menunjukkan kemurahan-Nya, sedangkan ''yang berkenan kepada Tuhan'' dapat disalahpahami sebagai tahun yang memenuhi penerimaan atau persetujuan Tuhan.'
- issue: Penerjemahan κύριος
  choice: Tuhan
  alternative: TUHAN
  rationale: '''Tuhan'' mempertahankan padanan langsung κύριος dan tidak menentukan secara berlebihan konvensi nama ilahi dari teks Ibrani yang digemakan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Memberitakan' dipilih sebagai ungkapan publik yang wajar; 'tahun perkenanan Tuhan' mempertahankan bentuk ringkas dan alusi Yesaya tanpa menambahkan penafsiran Yobel ke dalam teks.
