  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: id
  text: Dan berita tentang Dia terus menyebar ke setiap tempat di daerah sekitarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “laporan tentang Dia terus keluar ke setiap tempat di daerah sekitarnya.”
    reason: Alternatif ini lebih harfiah mempertahankan arti dasar ἐξεπορεύετο ('keluar') dan kemungkinan menerjemahkan ἦχος sebagai 'laporan'.
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung naratif sederhana tanpa menambahkan hubungan sebab-akibat atau urutan waktu yang tidak dinyatakan.
- source_word: ἐξεπορεύετο
  choice: terus menyebar
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung pada masa lampau. Dalam konteks ἦχος sebagai subjek, 'terus menyebar' menyampaikan idiom tersebut secara alami dalam bahasa Indonesia, sementara arti lebih harfiah dicatat dalam catatan kaki.
- source_word: ἦχος
  choice: berita
  rationale: Secara dasar kata ini dapat berarti 'bunyi' atau 'suara', tetapi bersama περὶ αὐτοῦ dan verba 'keluar/menyebar', konteksnya menunjuk pada berita atau laporan mengenai Yesus.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: Padanan langsung dan alami untuk frasa yang menyatakan isi berita. Huruf kapital mengikuti kebiasaan umum bahasa Indonesia ketika pronomina merujuk kepada Yesus.
- source_word: εἰς πάντα τόπον
  choice: ke setiap tempat
  rationale: Mempertahankan arah yang dinyatakan oleh εἰς dan daya distributif πάντα τόπον, tanpa meratakannya menjadi sekadar 'ke mana-mana'.
- source_word: τῆς περιχώρου
  choice: di daerah sekitarnya
  rationale: περίχωρος menunjuk pada wilayah atau daerah sekitar. Ungkapan ini alami dalam bahasa Indonesia dan menunjukkan bahwa tempat-tempat itu berada dalam kawasan sekitar.
