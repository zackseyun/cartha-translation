id: LUK.4.7
reference: Luke 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: id
  text: Jadi, jika engkau menyembah di hadapanku, semuanya itu akan menjadi milikmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersujud di hadapanku.” Kata Yunani yang digunakan dapat berarti bersujud atau menyembah; di sini “menyembah” dipakai karena konteksnya menyangkut pemberian penghormatan religius kepada Iblis.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: engkau
  rationale: Pronomina orang kedua tunggal ini dinyatakan secara eksplisit dalam bahasa Yunani. 'Engkau' sesuai untuk sapaan tunggal dalam register Alkitab yang modern dan bermartabat tanpa perlu menambahkan penegas seperti 'engkau sendiri'.
- source_word: οὖν
  choice: jadi
  rationale: Partikel ini menyatakan kesimpulan atau konsekuensi dari tawaran pada ayat sebelumnya. 'Jadi' mempertahankan kaitan logis itu secara alami dalam bahasa Indonesia modern.
- source_word: ἐὰν
  choice: jika
  rationale: Kata ini memperkenalkan syarat dengan modus subjungtif; 'jika' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: προσκυνήσῃς
  choice: menyembah
  rationale: Verba προσκυνέω dapat berarti bersujud atau menyembah. Dalam konteks pencobaan ini, tindakan tersebut merupakan penghormatan religius kepada Iblis, sebagaimana ditegaskan oleh jawaban Yesus pada ayat berikutnya.
- source_word: ἐνώπιον ἐμοῦ
  choice: di hadapanku
  rationale: Frasa ini menyatakan posisi dan relasi di hadapan si pembicara. 'Di hadapanku' ringkas, alami, dan mempertahankan nuansa tindakan penghormatan yang dilakukan dalam kehadirannya.
- source_word: ἔσται σοῦ
  choice: akan menjadi milikmu
  rationale: Kopula masa depan bersama bentuk genitif posesif secara alami dinyatakan sebagai 'akan menjadi milikmu' dalam bahasa Indonesia.
- source_word: πᾶσα
  choice: semuanya itu
  rationale: Bentuk feminin tunggal ini secara eliptis merujuk kepada seluruh kekuasaan dan kemuliaan kerajaan-kerajaan yang disebut pada ayat sebelumnya. 'Semuanya itu' membuat rujukan tersebut alami tanpa memasukkan nomina baru ke dalam ayat.
theological_decisions:
- issue: Apakah προσκυνέω diterjemahkan sebagai gerakan netral ('bersujud') atau penghormatan religius ('menyembah')
  choice: menyembah
  alternative: bersujud di hadapanku
  rationale: Konteks menunjukkan bahwa Iblis menuntut penghormatan yang semestinya diberikan kepada Allah, dan jawaban Yesus pada ayat berikutnya memakai bahasa penyembahan kepada Tuhan. 'Menyembah' menyampaikan bobot teologis ini, sedangkan catatan kaki mempertahankan kemungkinan leksikal tindakan bersujud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' dipakai untuk menjaga kejelasan jumlah dan register naratif Alkitab. Susunan kalimat dibuat alami sambil mempertahankan hubungan syarat dan akibat dalam teks Yunani.
