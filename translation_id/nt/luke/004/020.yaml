id: LUK.4.20
reference: Luke 4:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: id
  text: Sesudah menggulung gulungan kitab itu dan mengembalikannya kepada petugas rumah ibadat[a], Yesus duduk[b]. Mata semua orang di rumah ibadat itu tertuju kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petugas ini membantu jalannya ibadah dan bertanggung jawab menangani gulungan-gulungan kitab.
    reason: cultural_note
  - marker: b
    text: Duduk merupakan sikap yang lazim bagi seorang pengajar di rumah ibadat.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: menggulung
  rationale: Kata ini menggambarkan tindakan menggulung kembali sebuah gulungan, bukan menutup buku berjilid.
- source_word: βιβλίον
  choice: gulungan kitab
  rationale: Dalam konteks pembacaan Kitab Yesaya di rumah ibadat abad pertama, benda itu berbentuk gulungan; pilihan ini tetap menyampaikan bahwa isinya adalah kitab suci.
- source_word: ἀποδοὺς
  choice: mengembalikannya
  rationale: Kata kerja ini menyatakan bahwa benda tersebut diberikan kembali kepada orang yang bertanggung jawab atasnya.
- source_word: ὑπηρέτῃ
  choice: petugas rumah ibadat
  rationale: Dalam konteks ini, istilah tersebut menunjuk kepada petugas yang membantu jalannya ibadah dan menangani gulungan kitab; 'petugas' lebih tepat daripada 'pelayan' yang dapat menimbulkan kesan berbeda.
- source_word: ἐκάθισεν
  choice: Yesus duduk
  rationale: Subjek eksplisit dipakai dalam bahasa Indonesia agar alur tetap jelas setelah penyebutan petugas; tindakan duduk diterjemahkan secara langsung.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: Mata semua orang
  rationale: Ungkapan ini mempertahankan gambaran hidup dari teks Yunani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: ἀτενίζοντες αὐτῷ
  choice: tertuju kepada-Nya
  rationale: Pilihan ini menyampaikan tatapan yang terus-menerus dan penuh perhatian tanpa menambahkan kesan bermusuhan.
- source_word: συναγωγῇ
  choice: rumah ibadat
  rationale: Istilah ini menunjuk pada sinagoge sebagai tempat pertemuan dan ibadah Yahudi; 'rumah ibadat' merupakan ungkapan Indonesia yang jelas dalam konteks ini.
theological_decisions:
- issue: Bentuk historis βιβλίον dalam ibadah sinagoge
  choice: Diterjemahkan 'gulungan kitab'.
  alternative: kitab; buku
  rationale: Pilihan ini mencerminkan bentuk fisik benda dalam latar abad pertama tanpa mengubah isi atau bobot teologisnya.
- issue: Subjek tersirat pada ἐκάθισεν
  choice: Nama 'Yesus' dinyatakan agar rujukan subjek jelas.
  alternative: ia duduk; dia duduk
  rationale: Bahasa Yunani menandai subjek melalui bentuk verba, sedangkan penyebutan nama dalam bahasa Indonesia mencegah 'ia' disalahpahami sebagai petugas yang baru saja disebut, tanpa menambah informasi baru.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur dua kalimat mempertahankan peralihan naratif dan penekanan pada tatapan seluruh hadirin. Huruf kapital pada '-Nya' mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk rujukan kepada Yesus.
