  source_fidelity: 'Teks Indonesia dengan setia merepresentasikan urutan tindakan dalam Yunani: menggulung kembali gulungan, mengembalikannya kepada petugas, lalu duduk. "Mata semua orang ... tertuju kepada-Nya" menyampaikan cakupan πάντων dan tatapan tekun ἀτενίζοντες dengan baik. Penyebutan eksplisit "Yesus" adalah klarifikasi rujukan yang sah dari konteks langsung dan tidak menambahkan tokoh atau peristiwa.'
  naturalness: Bahasanya modern, jelas, dan wajar. "Rumah ibadat" dan "petugas rumah ibadat" sesuai register Alkitab bahasa Indonesia yang mudah dipahami. Susunan dua kalimat mempertahankan ritme naratif dan penekanan kalimat kedua.
