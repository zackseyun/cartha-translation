  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: id
  text: Dan Yesus menjawabnya, “Ada tertulis:[b] ‘Manusia[a] tidak akan hidup dari roti saja.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Seseorang tidak akan hidup dari roti saja,” dengan makna generik yang sama bagi manusia pada umumnya.
    reason: lexical_alternative
  - marker: b
    text: Yesus mengutip Ulangan 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: menjawabnya
  rationale: Ungkapan ἀποκρίνομαι dengan πρός + akusatif secara alami berarti ‘menjawab dia’. Bentuk ‘menjawabnya’ ringkas dan wajar dalam bahasa Indonesia.
- source_word: Γέγραπται
  choice: Ada tertulis
  rationale: Bentuk pasif perfektum ini merupakan rumusan baku untuk mengutip Kitab Suci. ‘Ada tertulis’ alami dalam ragam Alkitab Indonesia dan menyiratkan bahwa tulisan itu tetap berlaku.
- source_word: ὅτι
  choice: ':'
  rationale: Di sini ὅτι memperkenalkan isi kutipan. Tanda titik dua lebih alami dalam bahasa Indonesia daripada menerjemahkannya dengan ‘bahwa’.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: dari roti saja
  rationale: Dengan verba ‘hidup’, ἐπί menyatakan dasar atau sarana penopang kehidupan. ‘Hidup dari roti saja’ merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: ζήσεται
  choice: tidak akan hidup
  rationale: Bentuk futurum diterjemahkan dengan ‘akan hidup’; unsur negasi οὐ menghasilkan ‘tidak akan hidup’.
- source_word: ὁ ἄνθρωπος
  choice: Manusia
  rationale: Nomina tunggal ini dipakai secara generik untuk manusia pada umumnya. ‘Manusia’ mempertahankan bentuk konkret dan cakupan universal tanpa membatasinya pada laki-laki.
theological_decisions:
- issue: Makna generik ὁ ἄνθρωπος dalam kutipan Kitab Suci
  choice: Manusia
  alternative: Seseorang
  rationale: Dalam kutipan Ulangan 8:3 ini, ὁ ἄνθρωπος menunjuk manusia secara representatif dan generik. ‘Manusia’ paling langsung mempertahankan cakupan kemanusiaan secara umum, sedangkan ‘seseorang’ dicatat sebagai kemungkinan ungkapan tunggal yang lebih eksplisit.
- issue: Cakupan kutipan Ulangan 8:3
  choice: Menerjemahkan hanya bagian yang terdapat dalam teks Yunani Lukas 4:4
  alternative: Melengkapi kutipan dengan kelanjutan Ulangan 8:3
  rationale: SBLGNT pada ayat ini hanya memuat ‘Manusia tidak akan hidup dari roti saja.’ Kelanjutan yang terdapat dalam sebagian tradisi tekstual atau dikenal dari Ulangan tidak ditambahkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Dan’ mempertahankan καί yang menghubungkan ayat ini dengan narasi sebelumnya; ‘menjawabnya’ dan ‘dari roti saja’ dipilih demi kewajaran tanpa mengurangi ketepatan sumber.
