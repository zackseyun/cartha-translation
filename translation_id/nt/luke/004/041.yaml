id: LUK.4.41
reference: Luke 4:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: id
  text: Setan-setan juga terus keluar dari banyak orang sambil berteriak, “Engkau adalah Anak Allah!” Namun, Ia menegur mereka dan tidak membiarkan mereka berbicara, karena mereka tahu bahwa Ia adalah Mesias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus.” Kata Yunani Χριστός berarti “Yang Diurapi” dan merupakan padanan bagi “Mesias.”
    reason: Memberikan padanan tradisional bagi gelar Χριστός sekaligus menjelaskan makna dasarnya.
lexical_decisions:
- source_word: δαιμόνια
  choice: Setan-setan
  rationale: Kata benda ini secara langsung menunjuk kepada roh-roh jahat atau demon. Pilihan “setan-setan” wajar dan mudah dipahami dalam bahasa Indonesia; ungkapan “roh-roh najis” tidak dipakai karena teks Yunani tidak menggunakan istilah tersebut.
- source_word: ἐξήρχετο
  choice: keluar
  rationale: Bentuk imperfek menggambarkan tindakan yang berlangsung atau berulang. Dalam konteks rangkaian penyembuhan, konstruksi “juga keluar dari banyak orang” menyampaikan kejadian berulang secara alami tanpa memaksakan aspek yang terlalu eksplisit.
- source_word: ἀπὸ πολλῶν
  choice: dari banyak orang
  rationale: Teks Yunani membiarkan nomina yang dirujuk tetap tersirat, tetapi konteks jelas menunjuk kepada orang-orang. Bahasa Indonesia memerlukan penyebutan “orang” agar kalimat tidak terasa janggal.
- source_word: κραυγάζοντα
  choice: sambil berteriak
  rationale: Partisip ini menunjukkan seruan dengan suara keras. “Berteriak” mempertahankan intensitasnya dan merupakan ungkapan naratif yang alami.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Ini merupakan gelar kristologis. Bentuk yang mapan ini mempertahankan bobot gelarnya tanpa parafrasa.
- source_word: ἐπιτιμῶν
  choice: menegur mereka
  rationale: Kata ini menyatakan teguran atau perintah yang berwibawa. “Menegur” mempertahankan kekuatan tindakan Yesus tanpa menambahkan keterangan yang tidak dinyatakan secara eksplisit.
- source_word: οὐκ εἴα
  choice: tidak membiarkan
  rationale: Bentuk imperfek menyiratkan penolakan yang berlangsung atau berulang. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan larangan Yesus.
- source_word: ᾔδεισαν
  choice: mereka tahu
  rationale: Walaupun bentuk Yunaninya secara morfologis pluperfek, οἶδα bersifat statif dan di sini paling alami diterjemahkan dengan bentuk lampau kontekstual “tahu”.
- source_word: τὸν χριστόν
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar, yaitu Yang Diurapi, bukan sekadar sebagai nama diri. “Mesias” mempertahankan fungsi gelar tersebut dalam konteks narasi Lukas.
theological_decisions:
- issue: Penerjemahan Χριστός dalam pengenalan oleh setan-setan
  choice: Mesias
  alternative: Kristus
  rationale: Dalam klausa ini Χριστός adalah gelar. “Mesias” menampilkan makna gelarnya, sedangkan “Kristus” dicantumkan sebagai padanan tradisional dalam catatan kaki.
- issue: Hubungan antara gelar “Anak Allah” dan “Mesias”
  choice: Kedua gelar dipertahankan secara terpisah sebagaimana dalam teks Yunani
  alternative: Menggabungkan keduanya menjadi satu penjelasan
  rationale: Ucapan setan-setan memakai “Anak Allah”, sedangkan narator menyatakan bahwa mereka mengetahui Dia sebagai Mesias. Mempertahankan keduanya menghindari penyamaan atau penjelasan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat alami bagi pembaca umum; rujukan manusia yang tersirat dalam ἀπὸ πολλῶν diperjelas sebagai “banyak orang”. Huruf kapital pada “Ia” mengikuti kelaziman register Alkitab bahasa Indonesia untuk merujuk kepada Yesus.
