  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: id
  text: Di sinagoge ada seorang laki-laki yang di dalam dirinya ada roh dari setan yang najis[a]. Ia berteriak dengan suara keras,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh najis dari seorang setan.” Teks Yunani memuat baik kata “roh” maupun “setan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγῇ
  choice: sinagoge
  rationale: Istilah ini secara tepat menunjuk pada tempat pertemuan dan ibadah orang Yahudi, serta sudah dikenal dalam bahasa Indonesia modern.
- source_word: ἄνθρωπος
  choice: seorang laki-laki
  rationale: Dalam narasi ini kata tersebut menunjuk pada satu individu laki-laki dewasa, bukan manusia secara umum.
- source_word: ἔχων
  choice: yang dalam dirinya terdapat
  rationale: Ungkapan ini mempertahankan arti dasar ‘mempunyai/ada padanya’ tanpa langsung menambahkan penafsiran yang lebih kuat seperti ‘dirasuki’.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: roh dari setan yang najis
  rationale: Terjemahan ini mempertahankan kedua unsur, yaitu ‘roh’ dan ‘setan’. Bentuk ἀκαθάρτου secara gramatikal selaras dengan δαιμονίου, sehingga ‘yang najis’ menerangkan ‘setan’.
- source_word: ἀνέκραξεν
  choice: berteriak
  rationale: Kata kerja ini menyatakan seruan yang kuat; ‘berteriak’ alami dalam bahasa Indonesia dan tidak melebih-lebihkan adegan.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara keras
  rationale: Ungkapan ini mempertahankan gambaran konkret dari frasa Yunani dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan istilah tentang kuasa roh jahat
  choice: roh dari setan yang najis
  alternative: roh najis; roh setan yang najis; dirasuki roh jahat
  rationale: Teks Yunani secara eksplisit memuat πνεῦμα (‘roh’) dan δαιμόνιον (‘setan’). Terjemahan yang dipilih mempertahankan keduanya tanpa menyederhanakannya menjadi ‘roh jahat’ atau menambahkan konsep ‘kerasukan’ yang tidak dinyatakan secara langsung oleh bentuk ἔχων.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Sinagoge’ dipilih demi ketepatan latar Yahudi. Susunan ‘yang dalam dirinya terdapat’ menghindari kesan bahwa laki-laki itu memiliki roh tersebut secara sukarela, sekaligus tidak mengubah ungkapan sumber menjadi istilah teknis ‘dirasuki’.
