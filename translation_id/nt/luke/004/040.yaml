id: LUK.4.40
reference: Luke 4:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: id
  text: Ketika matahari sedang terbenam[a], semua orang yang mempunyai orang-orang yang sakit karena berbagai penyakit membawa mereka kepada-Nya. Ia meletakkan tangan-Nya pada setiap orang itu dan menyembuhkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika matahari terbenam.” Bahasa Yunani menggunakan konstruksi genitivus absolutus dengan partisipel kini, yang menyatakan waktu ketika peristiwa-peristiwa ini terjadi dan menggambarkan matahari sedang terbenam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Ketika matahari sedang terbenam
  rationale: Konstruksi genitivus absolutus dengan partisipel kini menyatakan waktu dan tindakan yang sedang berlangsung. Bentuk ini mempertahankan aspek proses terbenamnya matahari; δέ tidak perlu diterjemahkan dengan penanda wacana tersendiri dalam bahasa Indonesia.
- source_word: ἅπαντες ὅσοι
  choice: semua orang yang
  rationale: Gabungan ini menegaskan cakupan menyeluruh. Ungkapan Indonesia ini alami dan tetap mempertahankan penekanan tersebut.
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: mempunyai orang sakit dengan berbagai penyakit
  rationale: ἔχω di sini menunjuk pada orang-orang sakit yang berada dalam keluarga, rumah tangga, atau tanggungan mereka. Terjemahan ini tidak mempersempit hubungan itu, sedangkan νόσοις ποικίλαις menyatakan keragaman penyakit.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: membawa mereka kepada-Nya
  rationale: Dalam konteks orang sakit dibawa untuk disembuhkan, 'membawa' merupakan padanan ἄγω yang paling wajar.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: mereka masing-masing
  rationale: Ungkapan distributif ganda menekankan perhatian kepada setiap orang secara pribadi. 'Mereka masing-masing' menyampaikan penekanan itu secara ringkas dan alami.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: meletakkan tangan-Nya pada
  rationale: Menerjemahkan tindakan jasmani konkret dalam idiom Indonesia yang wajar tanpa menambahkan makna ritual atau gerejawi yang tidak dinyatakan teks.
- source_word: ἐθεράπευεν
  choice: menyembuhkan
  rationale: Bentuk imperfek menggambarkan tindakan berulang atau berkelanjutan ketika Yesus menangani mereka satu per satu. Dalam bahasa Indonesia, makna iteratif itu telah ditopang oleh 'mereka masing-masing'.
theological_decisions:
- issue: Makna peletakan tangan
  choice: Ia meletakkan tangan-Nya pada mereka masing-masing
  alternative: Ia menumpangkan tangan atas mereka masing-masing
  rationale: Pilihan utama mempertahankan tindakan konkret dan perhatian pribadi Yesus tanpa mengundang konotasi sakramental atau jabatan gerejawi yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Tanda titik dipakai untuk memecah kalimat Yunani yang panjang agar lebih mudah dipahami tanpa mengubah hubungan peristiwanya.
