source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: id
  text: Yesus, yang penuh dengan Roh Kudus, kembali dari Sungai Yordan dan dipimpin oleh Roh[a] di padang belantara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani juga dapat diterjemahkan lebih harfiah, “di dalam Roh”; dalam konteks ini, kemungkinan besar maksudnya ialah bahwa Roh memimpin Yesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: penuh dengan Roh Kudus
  rationale: Ungkapan πλήρης dengan bentuk genitif menyatakan keadaan penuh dengan sesuatu. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat deskriptifnya tanpa menyiratkan peristiwa pemenuhan sesaat.
- source_word: ὑπέστρεψεν
  choice: kembali
  rationale: Bentuk aoristus dari ὑποστρέφω lazim berarti kembali; pilihan ini ringkas, alami, dan dekat dengan bahasa sumber.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: dari Sungai Yordan
  rationale: Bahasa Yunani hanya menyebut Yordan, tetapi dalam bahasa Indonesia modern penambahan penjelas geografis 'Sungai' membuat nama tempat ini langsung jelas dan tetap alami.
- source_word: ἤγετο
  choice: terus dipimpin
  rationale: Bentuk imperfek pasif menunjukkan tindakan yang sedang berlangsung pada masa lampau. 'Terus dipimpin' menyampaikan aspek berkelanjutan itu secara lebih alami daripada konstruksi pasif progresif yang kaku.
- source_word: ἐν τῷ πνεύματι
  choice: oleh Roh
  rationale: Dalam hubungan dengan verba pasif ἄγω, ἐν dapat dipahami secara instrumental atau agentif. 'Oleh Roh' secara jelas menyampaikan bahwa Roh adalah pelaku yang memimpin, sambil tetap mengacu pada Roh Kudus dalam konteks langsung.
- source_word: ἐν τῇ ἐρήμῳ
  choice: di padang belantara
  rationale: ἔρημος dapat menunjuk gurun, daerah liar, atau tempat sunyi. 'Padang belantara' tidak membatasi gambaran pada gurun pasir dan cocok untuk latar terpencil tempat pencobaan.
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: δέ menandai peralihan ringan. Dalam bahasa Indonesia, alur narasi pada ayat ini tetap alami tanpa kata penghubung pembuka seperti 'dan' atau 'kemudian'.
theological_decisions:
- issue: Acuan 'Roh' dalam ἐν τῷ πνεύματι
  choice: Roh Kudus sebagai pihak yang memimpin Yesus
  alternative: keadaan batin atau roh Yesus sendiri
  rationale: Frasa yang langsung mendahuluinya, 'penuh dengan Roh Kudus', serta penekanan Lukas pada karya aktif Roh Kudus menjadikan acuan kepada Roh Kudus pembacaan yang paling wajar. Terjemahan 'oleh Roh' menyampaikan hal ini tanpa menambahkan rumusan doktrinal di luar teks.
- issue: Hubungan frasa ἐν τῇ ἐρήμῳ dengan tindakan memimpin
  choice: Yesus dipimpin ketika berada di padang belantara
  alternative: Yesus dipimpin masuk ke padang belantara
  rationale: Urutan dan bentuk teks SBLGNT paling langsung menempatkan tindakan memimpin di dalam wilayah padang belantara. Terjemahan mempertahankan lokasi tindakan dan tidak mengubahnya menjadi arah tujuan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Terus dipimpin' dipakai untuk mempertahankan aspek imperfek secara idiomatis. 'Padang belantara' menjaga keluasan makna ἔρημος tanpa memberi kesan khusus berupa gurun pasir.
