  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: id
  text: Lalu ia mulai berkata kepada mereka, “Hari ini nas ini telah digenapi ketika kalian mendengarnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: Lalu ia mulai berkata
  rationale: Ungkapan ini menandai perkembangan narasi dan awal perkataan Yesus. “Lalu” mencerminkan fungsi δέ tanpa memberi kesan pertentangan yang kuat.
- source_word: πρὸς αὐτοὺς
  choice: kepada mereka
  rationale: πρός dengan akusatif sesudah verba berbicara menunjukkan orang-orang yang dituju.
- source_word: Σήμερον
  choice: Hari ini
  rationale: Padanan Indonesia modern yang alami dan mempertahankan penekanan temporal pada awal pernyataan.
- source_word: πεπλήρωται
  choice: telah digenapi
  rationale: Bentuk perfektif pasif menyatakan penggenapan yang sudah terjadi dengan hasil yang berlaku pada saat pernyataan itu disampaikan.
- source_word: ἡ γραφὴ αὕτη
  choice: nas ini
  rationale: Dalam konteks ini γραφή menunjuk pada bagian Kitab Suci dari Yesaya yang baru dibacakan. “Nas ini” merupakan ungkapan Indonesia yang ringkas dan wajar untuk petikan Kitab Suci tertentu.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: ketika kalian mendengarnya
  rationale: Secara harfiah berarti “di telinga kalian”; dalam konteks, idiom itu menyatakan bahwa penggenapan berlangsung dalam pendengaran para hadirin. Bentuk ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi sekadar kemampuan mendengar.
theological_decisions:
- issue: Sifat pernyataan penggenapan
  choice: Menyatakan bahwa nas itu telah digenapi ketika para pendengar mendengarnya, tanpa menambahkan pelaku atau cara penggenapannya.
  alternative: “Hari ini nubuat ini digenapi oleh-Ku di hadapan kalian.”
  rationale: Teks Yunani tidak secara eksplisit mengatakan “nubuat,” “oleh-Ku,” atau “di hadapan kalian.” Konteks mengarahkan pembaca kepada peran Yesus, tetapi terjemahan tidak seharusnya memasukkan penjelasan tersebut ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “kalian” dipakai karena ὑμῶν berbentuk jamak dan ditujukan kepada seluruh hadirin; huruf kecil pada “ia” mengikuti kaidah umum bahasa Indonesia tanpa menjadikan kapitalisasi sebagai penafsiran teologis.
