  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: id
  text: Ketika hari mulai terang, Yesus keluar dan pergi ke tempat yang terpencil[a]. Orang banyak mencari-cari Dia, lalu mereka datang kepada-Nya dan berusaha menahan-Nya[b] agar tidak pergi meninggalkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke tempat yang sunyi” atau “ke tempat yang tidak berpenghuni.” Kata Yunani ini menggambarkan lokasi yang terasing atau tidak dihuni, bukan selalu daerah gurun.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berusaha mencegah-Nya pergi.” Maksudnya, orang banyak berusaha agar Yesus tidak meninggalkan mereka; ungkapan ini tidak harus berarti mereka menahan-Nya secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Ketika hari mulai terang
  rationale: Ungkapan genitif absolut ini menandai peralihan waktu. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan datangnya siang atau fajar tanpa membatasi maknanya secara berlebihan pada satu saat tertentu.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: keluar dan pergi
  rationale: Partisip aoris diikuti verba utama menyatakan dua tindakan berurutan. Pengulangan ringan ini mempertahankan kedua unsur Yunani dan tetap wajar dalam bahasa Indonesia.
- source_word: εἰς ἔρημον τόπον
  choice: ke tempat yang sunyi
  rationale: ἔρημος di sini menunjuk pada tempat terpencil atau tidak dihuni, bukan selalu wilayah gurun. 'Tempat yang sunyi' alami dan tidak memberi gambaran geografis yang terlalu khusus.
- source_word: οἱ ὄχλοι
  choice: orang banyak
  rationale: Ungkapan baku dan mudah dipahami untuk kumpulan besar orang, dengan tetap mempertahankan sifat kolektif bentuk Yunani.
- source_word: ἐπεζήτουν αὐτόν
  choice: mencari-cari Dia
  rationale: Bentuk imperfek menyatakan tindakan yang sedang berlangsung. Reduplikasi 'mencari-cari' menyampaikan upaya pencarian yang terus dilakukan.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: mereka datang kepada-Nya
  rationale: Menyampaikan bahwa orang banyak mencapai lokasi Yesus dengan ungkapan Indonesia yang alami.
- source_word: κατεῖχον αὐτὸν
  choice: berusaha menahan-Nya
  rationale: κατέχω dapat berarti menahan atau mencegah seseorang pergi. 'Berusaha' mencerminkan tindakan imperfek dan konteks upaya mereka tanpa memastikan adanya penahanan fisik.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: agar tidak pergi meninggalkan mereka
  rationale: Infinitif artikular dengan μή menjelaskan maksud penahanan itu. Terjemahan ini mempertahankan gagasan pergi menjauh dari mereka secara jelas dan alami.
