  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: id
  text: 'Kepada-Nya diserahkan gulungan kitab[a] Nabi Yesaya. Setelah membuka gulungan itu, Ia menemukan bagian yang memuat tulisan berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kitab”. Kata Yunani βιβλίον dapat menunjuk pada dokumen tertulis secara umum, tetapi dalam konteks sinagoge ini kemungkinan besar yang dimaksud ialah kitab dalam bentuk gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: diserahkan
  rationale: Bentuk pasif ini berarti diberikan atau diserahkan kepada seseorang. Dalam suasana pembacaan di sinagoge, “diserahkan” terdengar alami tanpa memberi kesan penyerahan paksa.
- source_word: βιβλίον
  choice: gulungan kitab
  rationale: βιβλίον dapat menunjuk pada dokumen tertulis atau kitab. Dalam konteks sinagoge abad pertama dan bersama ἀναπτύξας, yang dimaksud kemungkinan besar ialah kitab dalam bentuk gulungan; “gulungan kitab” mempertahankan bentuk bendanya sekaligus sifatnya sebagai kitab suci.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: Nabi Yesaya
  rationale: Ungkapan ini mengidentifikasi kitab tersebut sebagai milik atau tulisan Nabi Yesaya. Susunan “Nabi Yesaya” merupakan bentuk Indonesia yang alami dan tetap mempertahankan gelarnya.
- source_word: ἀναπτύξας
  choice: setelah membuka gulungan itu
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului εὗρεν. “Membuka gulungan” idiomatis dalam bahasa Indonesia dan menyiratkan tindakan menguraikan gulungan tanpa ungkapan yang kaku.
- source_word: εὗρεν
  choice: Ia menemukan
  rationale: Padanan langsung dan alami yang tidak menyiratkan bahwa bagian itu sulit dicari.
- source_word: τὸν τόπον
  choice: bagian
  rationale: Secara harfiah berarti “tempat”, tetapi di sini menunjuk pada lokasi atau bagian dalam teks. “Bagian” lebih alami dan jelas bagi pembaca Indonesia.
- source_word: οὗ ἦν γεγραμμένον
  choice: yang memuat tulisan berikut
  rationale: Klausa ini memperkenalkan kutipan sesudahnya. Rumusan ini menyampaikan bahwa tulisan tersebut sudah terdapat pada bagian itu dan menghasilkan pengantar kutipan yang alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Huruf kapital pada kata ganti “-Nya” dan “Ia” mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia. Istilah historis “gulungan kitab” dipilih agar bentuk fisik naskah jelas tanpa mengaburkan bahwa isinya adalah kitab Nabi Yesaya.
