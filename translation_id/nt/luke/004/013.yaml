  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: id
  text: Setelah Iblis menyelesaikan semua pencobaan[a], ia meninggalkan Yesus hingga tiba saat yang tepat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua pengujian.” Istilah Yunani yang dipakai dapat berarti “pencobaan” atau “pengujian”; dalam konteks ini, peran Iblis membuat “pencobaan” menjadi terjemahan yang lebih wajar.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: setelah menyelesaikan
  rationale: Partisip aoris ini menerangkan tindakan Iblis yang selesai sebelum tindakan utama; bentuk ini menyampaikan urutan waktu secara alami dalam bahasa Indonesia.
- source_word: πάντα πειρασμόν
  choice: setiap pencobaan
  rationale: Bentuk tunggal dengan πᾶς dapat dipahami secara distributif sebagai seluruh rangkaian pencobaan. 'Pencobaan' paling sesuai dengan peran Iblis dalam konteks ini, sementara kemungkinan arti 'pengujian' dipertahankan dalam catatan kaki.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam narasi Lukas, istilah ini menunjuk kepada lawan adikodrati yang personal; 'Iblis' adalah padanan baku dan wajar dalam bahasa Indonesia.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: meninggalkan Dia
  rationale: Frasa ini berarti pergi atau menarik diri dari seseorang. 'Meninggalkan Dia' jelas dan alami, tanpa menyiratkan bahwa kepergian itu permanen.
- source_word: ἄχρι καιροῦ
  choice: sampai tiba waktu yang tepat
  rationale: καιρός menunjuk pada waktu yang sesuai atau strategis, bukan sekadar waktu kronologis. Ungkapan ini juga menunjukkan bahwa kepergian Iblis bersifat sementara.
theological_decisions:
- issue: Nuansa πειρασμός dalam pengalaman Yesus
  choice: pencobaan
  alternative: pengujian
  rationale: πُειρασμός dapat berarti pencobaan atau pengujian. Karena pelakunya adalah Iblis dan tindakannya berusaha menyimpangkan Yesus dari ketaatan, 'pencobaan' dipakai dalam teks utama; nuansa 'pengujian' tetap dicantumkan agar ambiguitas leksikal tidak dihilangkan.
- issue: Sifat sementara kepergian Iblis
  choice: sampai tiba waktu yang tepat
  alternative: sampai suatu waktu
  rationale: Terjemahan utama mempertahankan nuansa καιρός sebagai kesempatan atau saat yang sesuai tanpa menentukan peristiwa tertentu yang tidak disebutkan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan huruf kapital pada 'Dia' mengikuti kelaziman penerbitan Alkitab Indonesia ketika merujuk kepada Yesus.
