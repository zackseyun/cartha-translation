  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: id
  text: Dan ia mengajar di rumah-rumah ibadat mereka dan dipuji oleh semua orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihormati oleh semua orang” atau “dimuliakan oleh semua orang.” Kata Yunani yang dipakai dapat menyatakan pujian atau penghormatan dan juga berkaitan dengan gagasan kemuliaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan penghubung sederhana dengan kisah sebelumnya tanpa menambahkan nuansa waktu.
- source_word: αὐτὸς
  choice: ia
  rationale: Menunjuk kepada Yesus; bahasa Indonesia tidak perlu menambahkan 'sendiri' karena penekanan pronomina Yunani di sini ringan.
- source_word: ἐδίδασκεν
  choice: mengajar
  rationale: Dalam rangkaian narasi lampau, bentuk ini secara alami menyatakan kegiatan yang sedang berlangsung atau dilakukan berulang kali; penambahan 'sedang' tidak diperlukan.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: di rumah-rumah ibadat mereka
  rationale: Mengungkapkan lokasi dan bentuk jamak secara alami dalam bahasa Indonesia, serta mempertahankan pronomina 'mereka'.
- source_word: δοξαζόμενος
  choice: dipuji
  rationale: Dalam konteks sambutan masyarakat terhadap pengajaran Yesus, kata ini secara alami berarti menerima pujian atau penghormatan. 'Dipuji' jelas bagi pembaca modern, sedangkan catatan kaki mempertahankan kemungkinan nuansa 'dihormati' dan kaitannya dengan kemuliaan.
- source_word: ὑπὸ πάντων
  choice: oleh semua orang
  rationale: Menandai pelaku tindakan pasif dan menyampaikan sambutan umum tanpa harus dipahami sebagai pernyataan matematis tentang setiap individu.
theological_decisions:
- issue: Makna δοξαζόμενος ketika dikenakan kepada Yesus
  choice: dipuji oleh semua orang
  alternative: dimuliakan oleh semua orang; dihormati oleh semua orang
  rationale: Konteks menggambarkan sambutan baik masyarakat terhadap pelayanan mengajar Yesus. 'Dipuji' paling alami dalam bahasa Indonesia, sambil tidak menutup nuansa penghormatan atau hubungan leksikal kata Yunani itu dengan bahasa tentang kemuliaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Rumah ibadat' dipakai sebagai istilah yang mudah dipahami untuk sinagoge. Penanda catatan kaki ditempatkan sesudah seluruh klausa yang dijelaskannya.
