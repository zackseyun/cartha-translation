id: LUK.4.14
reference: Luke 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: id
  text: Lalu Yesus kembali ke Galilea dalam kuasa Roh, dan kabar tentang Dia tersebar di seluruh daerah sekitar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berita”, “kemasyhuran”, atau “desas-desus” untuk “kabar”. Istilah Yunani ini dapat berarti kabar yang tersebar luas tanpa menentukan apakah nadanya positif atau negatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: kembali
  rationale: Bentuk aoris ὑποστρέφω menyatakan gerak kembali; 'kembali' alami dalam narasi Indonesia tanpa perlu menambahkan kata kerja lain.
- source_word: ἐν τῇ δυνάμει
  choice: dalam kuasa
  rationale: Mempertahankan bentuk frasa Yunani dan dapat menyatakan lingkup atau cara Yesus kembali tanpa mempersempitnya menjadi hubungan alat semata.
- source_word: τοῦ πνεύματος
  choice: Roh
  rationale: Konteks dekat Lukas 4 menunjuk kepada Roh Kudus. 'Roh' mempertahankan ketiadaan kata 'Kudus' dalam ayat ini, sedangkan huruf kapital memperjelas rujukannya.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ke Galilea
  rationale: '''Ke Galilea'' merupakan ungkapan tujuan perjalanan yang wajar dalam bahasa Indonesia.'
- source_word: φήμη
  choice: kabar
  rationale: '''Kabar'' dapat menunjuk pada informasi yang tersebar luas tanpa harus bernada positif seperti ''ketenaran'' atau negatif seperti ''desas-desus''.'
- source_word: ἐξῆλθεν
  choice: tersebar
  rationale: Dalam hubungan dengan 'kabar', 'tersebar' mengungkapkan metafora gerak ἐξῆλθεν secara alami dan jelas dalam bahasa Indonesia.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: ke seluruh daerah di sekitarnya
  rationale: Frasa ini menyampaikan luasnya penyebaran di seluruh kawasan sekitar dengan susunan Indonesia yang alami.
- source_word: περὶ αὐτοῦ
  choice: tentang Dia
  rationale: '''Tentang Dia'' merupakan padanan langsung dan alami bagi περί dengan genitif; huruf kapital mengikuti kebiasaan hormat yang lazim bagi pronomina yang merujuk kepada Yesus.'
theological_decisions:
- issue: Rujukan πνεύματος
  choice: Roh dipahami sebagai Roh Kudus
  alternative: roh yang tidak ditentukan secara khusus
  rationale: Konteks langsung Lukas 4 berulang kali menyebut Roh Kudus dalam pencobaan dan awal pelayanan Yesus. Terjemahan 'Roh' menjaga bentuk eksplisit ayat tanpa menambahkan 'Kudus'.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Lalu' mengalir alami sebagai penghubung naratif. Susunan mempertahankan dua klausa Yunani tanpa kekakuan yang tidak perlu.
