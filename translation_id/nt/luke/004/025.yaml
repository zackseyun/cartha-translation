source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: id
  text: Namun, sesungguhnya Aku berkata kepadamu, pada zaman Elia ada banyak janda di Israel, ketika langit tertutup selama tiga tahun dan enam bulan dan kelaparan hebat melanda seluruh negeri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: sesungguhnya
  rationale: Ungkapan ini menegaskan kebenaran pernyataan Yesus; 'sesungguhnya' alami, khidmat, dan tidak menambahkan gagasan lain.
- source_word: ἐκλείσθη ὁ οὐρανὸς
  choice: langit tertutup
  rationale: Mempertahankan gambaran pasif teks Yunani tentang hujan yang tertahan tanpa menjelaskannya secara berlebihan.
- source_word: λιμὸς μέγας
  choice: kelaparan hebat
  rationale: Padanan langsung dan alami untuk bencana kelaparan yang besar atau parah.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: di seluruh negeri
  rationale: Dalam konteks Israel dan kisah Elia, γῆ dapat menunjuk wilayah atau negeri; pilihan ini mempertahankan cakupan kontekstual tanpa menyatakan seluruh bumi.
theological_decisions:
- issue: Hubungan sebab atau waktu pada ὡς ἐγένετο
  choice: sehingga terjadi
  alternative: ketika terjadi
  rationale: Dalam rangkaian penutupan langit dan kelaparan, ungkapan ini secara wajar menyampaikan akibat; pilihan tersebut tidak menentukan pelaku ilahi yang tidak disebut secara eksplisit.
- issue: Cakupan πᾶσαν τὴν γῆν
  choice: seluruh negeri
  alternative: seluruh bumi
  rationale: Konteks narasi Elia mendukung cakupan regional, tetapi teks tetap menyatakan luasnya bencana di seluruh wilayah yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dipecah agar mudah dipahami tanpa menghilangkan penegasan pembuka, latar zaman Elia, durasi, dan akibatnya.
