  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: Yesus beralih dari rumah ibadat ke rumah Simon; ibu mertua Simon sedang didera demam tinggi; dan orang-orang itu menyampaikan suatu permohonan mengenai dirinya. Namun, “mereka meminta kepada-Nya mengenai perempuan itu” merupakan kolokasi yang tidak wajar dalam bahasa Indonesia dan kurang jelas sebagai permohonan.'
  naturalness: “Mengajukan permohonan kepada-Nya mengenai perempuan itu” lebih baku dan alami, sambil tetap tidak menyatakan secara eksplisit bahwa mereka meminta penyembuhan. “Setelah meninggalkan rumah ibadat” adalah pengungkapan Indonesia yang idiomatis untuk rangkaian ἀναστὰς ἀπὸ τῆς συναγωγῆς, tanpa memberi kesan tidak lazim bahwa seseorang ‘bangkit dari’ bangunan.
  terminology: “Rumah ibadat,” “ibu mertua,” dan “demam tinggi” tepat dan sesuai register naratif modern. Pronomina ilahi berkepala huruf besar dipertahankan secara konsisten.
