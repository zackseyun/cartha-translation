source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: id
  text: Setelah meninggalkan rumah ibadat, Ia masuk ke rumah Simon. Ibu mertua Simon sedang terserang demam tinggi, dan mereka mengajukan permohonan kepada-Nya mengenai perempuan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka memohon kepada-Nya untuk menolong perempuan itu.” Secara harfiah, ungkapan Yunani berbunyi “mereka bertanya kepada-Nya tentang dia”; dalam konteks ini kemungkinan besar yang dimaksud adalah permohonan agar Ia bertindak baginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Lalu Ia bangkit dan meninggalkan rumah ibadat
  rationale: Partisip aoris Ἀναστάς menunjukkan tindakan yang mendahului verba utama, sedangkan ἀπό menandai gerak menjauh dari suatu tempat. Ungkapan ini alami dalam bahasa Indonesia dan menghindari kesan janggal bahwa Ia 'bangkit dari' sebuah bangunan.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: kemudian masuk ke rumah Simon
  rationale: εἰσέρχομαι dengan εἰς menyatakan gerak masuk ke suatu tempat. 'Masuk ke rumah Simon' ringkas, jelas, dan alami.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: Ibu mertua Simon
  rationale: πενθερά secara khusus berarti 'ibu mertua'. Hubungan keluarga itu diterjemahkan langsung tanpa menambahkan kesimpulan di luar teks.
- source_word: ἦν συνεχομένη
  choice: sedang terserang
  rationale: Konstruksi perifrastik pasif ini menggambarkan seseorang yang dicengkeram atau ditimpa penyakit. 'Sedang terserang' mempertahankan nuansa pasif dan terdengar wajar untuk penyakit dalam bahasa Indonesia.
- source_word: πυρετῷ μεγάλῳ
  choice: demam tinggi
  rationale: πυρετός berarti demam dan μέγας memperkuat tingkat penyakit. 'Demam tinggi' merupakan padanan medis yang umum dan alami.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: mereka meminta kepada-Nya mengenai perempuan itu
  rationale: ἐρωτάω dapat berarti bertanya atau meminta, dan περὶ αὐτῆς secara harfiah berarti mengenai atau tentang dia. Dalam konteks ini kemungkinan besar ada permohonan demi perempuan itu, tetapi rumusan utama tetap menahan diri agar tidak secara eksplisit menambahkan permintaan penyembuhan.
theological_decisions:
- issue: Implikasi status perkawinan Simon dari πενθερά
  choice: Menerjemahkan istilah kekerabatan secara langsung sebagai 'ibu mertua'
  alternative: Menjelaskan bahwa Simon sudah menikah
  rationale: Ayat ini memang menyebut ibu mertua Simon, tetapi terjemahan tidak perlu memperluas pernyataan itu menjadi kesimpulan historis atau doktrinal tambahan.
- issue: Nuansa permohonan dalam ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: mereka meminta kepada-Nya mengenai perempuan itu
  alternative: mereka memohon kepada-Nya untuk menolong perempuan itu
  rationale: Konteks mengisyaratkan permohonan agar Ia bertindak bagi perempuan itu, tetapi bahasa Yunani tidak secara eksplisit menyebut pertolongan atau penyembuhan. Pilihan utama mempertahankan ketegangan tersebut, sementara catatan kaki menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Rumah ibadat' dipilih sebagai istilah yang mudah dipahami untuk συναγωγή. Pronomina ilahi memakai huruf kapital sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada klausa yang benar-benar dijelaskannya.
