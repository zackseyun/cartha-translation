id: LUK.4.31
reference: Luke 4:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: id
  text: Kemudian Ia turun ke Kapernaum, sebuah kota di Galilea. Ia mengajar mereka pada hari-hari Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih idiomatis dapat diterjemahkan “pada hari Sabat” atau “setiap hari Sabat”. Teks Yunani memakai bentuk jamak, yang kemungkinan menunjukkan beberapa kesempatan hari Sabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: turun
  rationale: Mempertahankan arah gerak yang dinyatakan oleh κατέρχομαι; Kapernaum terletak lebih rendah daripada daerah asal perjalanan sebelumnya.
- source_word: Καφαρναοὺμ
  choice: Kapernaum
  rationale: Mengikuti bentuk nama tempat yang sudah baku dalam bahasa Indonesia.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: sebuah kota di Galilea
  rationale: Kata πόλιν tidak memakai artikel sehingga wajar diterjemahkan tidak tentu sebagai 'sebuah kota'; genitif di sini paling alami diungkapkan secara lokatif dengan 'di Galilea'.
- source_word: ἦν διδάσκων
  choice: Ia mengajar
  rationale: Konstruksi perifrastis ini menggambarkan kegiatan yang berlangsung atau berulang. Bahasa Indonesia tidak perlu selalu menandainya dengan 'sedang', terutama ketika bentuk jamak 'hari-hari Sabat' sudah mendukung nuansa berulang.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Mempertahankan pronomina Yunani tanpa menambahkan identitas kelompok yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: ἐν τοῖς σάββασιν
  choice: pada hari-hari Sabat
  rationale: Mempertahankan bentuk jamak σάββασιν dan kemungkinan makna bahwa pengajaran itu terjadi pada beberapa kesempatan hari Sabat.
theological_decisions:
- issue: Apakah bentuk jamak σάββασιν perlu dihaluskan menjadi bentuk tunggal yang lebih idiomatis
  choice: pada hari-hari Sabat
  alternative: pada hari Sabat; setiap hari Sabat
  rationale: Bentuk jamak dipertahankan agar pola pelayanan Yesus pada kesempatan-kesempatan Sabat tidak diam-diam dipersempit menjadi satu peristiwa. Ungkapan 'setiap hari Sabat' lebih lancar, tetapi sedikit mempertegas makna distributif yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, jelas, dan bermartabat. 'Kemudian' menghubungkan ayat ini dengan narasi sebelumnya; 'Ia' mempertahankan pronomina sumber dan kapitalisasi penghormatan yang lazim dalam penerjemahan Alkitab bahasa Indonesia.
