  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: id
  text: Lalu mereka bangkit, mengusir-Nya ke luar kota, dan membawa-Nya sampai ke tepi bukit tempat kota mereka dibangun, sehingga mereka dapat melemparkan-Nya ke bawah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan maksud melemparkan-Nya ke bawah.” Konstruksi Yunani ini dapat menyatakan hasil yang dituju atau maksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: mereka bangkit
  rationale: Partisip aoris ini menggambarkan gerakan orang banyak untuk mulai bertindak. 'Bangkit' mempertahankan daya naratif dan makna fisiknya.
- source_word: ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως
  choice: mengusir Dia ke luar kota
  rationale: ἐκβάλλω dalam konteks ini menyatakan pengusiran dengan paksa; 'mengusir' alami dalam bahasa Indonesia tanpa menambahkan rincian kekerasan yang tidak tersurat.
- source_word: πόλεως
  choice: kota
  rationale: '''Kota'' merupakan padanan umum πόλις dalam bahasa Indonesia dan tetap wajar untuk menyebut permukiman Nazaret tanpa mengharuskan pengertian kota besar modern.'
- source_word: ἤγαγον αὐτόν
  choice: membawa-Nya
  rationale: ἄγω dapat berarti memimpin atau membawa. Dalam konteks kerumunan yang bermusuhan, 'membawa' lebih alami dan netral daripada 'menyeret', yang akan menambah kadar kekerasan.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: sampai ke tepi bukit
  rationale: ὀφρύς secara harfiah dapat menunjuk alis, lalu secara topografis tepi atau bibir suatu ketinggian. 'Tepi bukit' jelas dan alami bagi pembaca modern.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: tempat kota mereka dibangun
  rationale: Klausa ini menunjukkan bahwa kota mereka berdiri pada bukit tersebut. Bentuk pasif lampau diterjemahkan secara alami tanpa membebani kalimat.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: dengan maksud melemparkan Dia ke bawah
  rationale: ὥστε dengan infinitif di sini, dalam rangkaian tindakan yang disengaja, paling wajar menyatakan maksud. κατακρημνίζω berarti melemparkan dari suatu ketinggian; 'ke bawah' mempertahankan makna tanpa menambahkan kata 'jurang' atau 'tebing' yang tidak eksplisit.
theological_decisions:
- issue: Tingkat kekerasan dan maksud orang banyak
  choice: Menggambarkan pengusiran paksa dan maksud melemparkan Yesus dari ketinggian tanpa menyebutnya secara eksplisit sebagai percobaan pembunuhan.
  alternative: Memakai ungkapan yang lebih eksplisit seperti 'hendak membunuh-Nya' atau lebih keras seperti 'menyeret-Nya'.
  rationale: Urutan tindakan dan verba terakhir jelas memperlihatkan niat mematikan, tetapi terjemahan sebaiknya membiarkan hal itu muncul dari teks dan tidak memasukkan penafsiran penjelas ke dalam ayat.
- issue: Nuansa ὥστε dengan infinitif
  choice: dengan maksud
  alternative: sehingga
  rationale: Konteks tindakan terarah mendukung nuansa tujuan, tetapi konstruksi Yunani dapat pula dipahami sebagai hasil yang dimaksudkan; catatan kaki mempertahankan kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kapitalisasi pronomina bagi Yesus mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan setelah klausa yang diterangkannya.
