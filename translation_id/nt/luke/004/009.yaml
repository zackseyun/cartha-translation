  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: id
  text: Lalu ia membawa Yesus ke Yerusalem dan menempatkan-Nya di puncak kompleks Bait Allah[a]. Ia berkata kepada-Nya, “Jika Engkau Anak Allah[b], jatuhkanlah diri-Mu dari sini,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di sayap kompleks Bait Allah.” Istilah Yunani ini menunjuk pada ujung yang menonjol atau tempat tinggi dalam kompleks Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga dipahami, “Karena Engkau Anak Allah.” Namun, “jika” mempertahankan bentuk tantangan si penggoda.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: Lalu ia membawa
  rationale: δέ menandai kelanjutan urutan cerita, sehingga 'lalu' alami dalam bahasa Indonesia. ἄγω dapat berarti membawa atau menuntun; 'membawa' menyatakan perpindahan tanpa menambahkan cara yang tidak disebutkan.
- source_word: εἰς Ἰερουσαλήμ
  choice: ke Yerusalem
  rationale: Padanan langsung dan baku untuk tujuan gerak serta nama tempat.
- source_word: ἔστησεν
  choice: menempatkan-Nya
  rationale: Bentuk kausatif ἵστημι berarti membuat seseorang berdiri atau menempatkannya; 'menempatkan' paling alami dan tidak terlalu harfiah.
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: di puncak kompleks Bait Allah
  rationale: Dalam konteks arsitektur, πτερύγιον menunjuk pada ujung yang menonjol atau tempat tinggi. ἱερόν adalah seluruh kompleks Bait Allah, bukan hanya ruang suci bagian dalam.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Jika Engkau Anak Allah
  rationale: '''Jika'' mempertahankan bentuk syarat dan nada tantangan si penggoda tanpa menyiratkan bahwa narator meragukan identitas Yesus.'
- source_word: βάλε σεαυτὸν ἐντεῦθεν κάτω
  choice: jatuhkanlah diri-Mu dari sini
  rationale: Dalam konteks gerak dari tempat tinggi, ungkapan ini secara alami berarti membuat diri sendiri jatuh atau melontarkan diri ke bawah. 'Jatuhkanlah diri-Mu' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Nada syarat dalam tantangan terhadap identitas Yesus
  choice: Jika Engkau Anak Allah
  alternative: Karena Engkau Anak Allah
  rationale: εἰ dengan indikatif kadang dapat bernuansa 'karena' atau 'kalau memang', tetapi 'jika' mempertahankan ketegangan retoris dalam adegan pencobaan dan tidak secara diam-diam menafsirkan maksud si penggoda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. 'Kompleks Bait Allah' dipakai dalam teks utama agar cakupan ἱερόν tidak disalahpahami sebagai ruang suci bagian dalam saja.
