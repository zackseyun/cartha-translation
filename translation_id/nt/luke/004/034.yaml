id: LUK.4.34
reference: Luke 4:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: id
  text: '“Ah! Apa urusan-Mu dengan kami,[a] Yesus orang Nazaret?[b] Apakah Engkau datang untuk membinasakan kami?[c] Aku tahu siapa Engkau: Yang Kudus dari Allah.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apa bagi kami dan bagi-Mu?” Ini adalah idiom Semitis yang menyatakan penolakan hubungan atau protes keras.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “Yesus dari Nazaret,” dengan penekanan pada asal-Nya.
    reason: lexical_alternative
  - marker: c
    text: Kata “kami” berbentuk jamak, tetapi teks tidak menjelaskan siapa saja yang dimaksud. Pembicara mungkin menggunakan bentuk jamak secara representatif bagi kuasa-kuasa jahat.
    reason: alternative_reading
  - marker: d
    text: Dapat juga diterjemahkan “Yang Kudus milik Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Ah!
  rationale: Seruan mendadak yang menyatakan keterkejutan, ketakutan, atau protes. “Ah!” mempertahankan bentuk seruan tanpa menambahkan tafsiran “Jangan ganggu kami!”
- source_word: τί ἡμῖν καὶ σοί
  choice: Apa urusan-Mu dengan kami
  rationale: Ungkapan harfiah “apa bagi kami dan bagi-Mu?” merupakan idiom Semitis yang menyatakan penolakan hubungan atau protes. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan nada konfrontatifnya.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Yesus orang Nazaret
  rationale: Bentuk sapaan ini dapat menunjuk pada asal Yesus atau menjadi sebutan “orang Nazaret.” Terjemahan ini wajar dan tidak memaksakan perbedaan yang tidak tegas dalam konteks.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: Apakah Engkau datang untuk membinasakan kami?
  rationale: Aoristus ἦλθες dalam pertanyaan langsung berfokus pada kedatangan Yesus yang kini mengancam, sedangkan ἀπολέσαι menyatakan penghancuran atau kebinasaan.
- source_word: οἶδά σε τίς εἶ
  choice: Aku tahu siapa Engkau
  rationale: Terjemahan langsung dan alami yang mempertahankan pengakuan si roh mengenai identitas Yesus tanpa penambahan.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Yang Kudus dari Allah
  rationale: Mempertahankan bentuk gelar dan relasi genitif dalam bahasa Yunani tanpa memperluas makna kristologisnya.
theological_decisions:
- issue: Acuan kata ganti jamak ἡμᾶς
  choice: Dipertahankan sebagai “kami” tanpa menjelaskan siapa saja yang tercakup.
  alternative: Roh itu berbicara mewakili dunia roh jahat, atau berbicara tentang dirinya bersama orang yang dirasukinya.
  rationale: Teks Yunani menggunakan bentuk jamak tetapi tidak menetapkan acuannya. Terjemahan mempertahankan ketidakjelasan dan ketegangan tersebut.
- issue: Gelar kristologis ὁ ἅγιος τοῦ θεοῦ
  choice: Yang Kudus dari Allah
  alternative: Milik Allah yang Kudus; Yang Kudus kepunyaan Allah
  rationale: Ayat ini memberikan gelar yang penting kepada Yesus, tetapi tidak menguraikan seluruh makna teologisnya. Rumusan yang dekat dengan sumber menghindari penambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan khidmat. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Seruan, idiom protes, bentuk jamak yang tidak jelas acuannya, dan bobot gelar kristologis dipertahankan tanpa diperjelas secara berlebihan.
