id: LUK.4.43
reference: Luke 4:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: id
  text: Namun Dia berkata kepada mereka, “Aku juga harus memberitakan kabar baik[a] tentang Kerajaan Allah kepada kota-kota lain, sebab untuk itulah[b] Aku diutus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mewartakan kabar baik.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk tujuan inilah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Namun Dia berkata kepada mereka
  rationale: δέ menandai peralihan yang bernuansa pertentangan dengan keinginan orang banyak dalam konteks sebelumnya. “Namun” menyampaikan nuansa itu secara wajar, sedangkan “berkata kepada mereka” mempertahankan bentuk ujaran langsung.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: juga ... kepada kota-kota lain
  rationale: καί bersifat aditif dan memperluas lingkup misi Yesus, sedangkan ἑτέραις πόλεσιν menunjuk pada kota-kota selain tempat tersebut. Susunan ini alami dalam bahasa Indonesia dan mempertahankan kontras geografisnya.
- source_word: εὐαγγελίσασθαί
  choice: memberitakan kabar baik
  rationale: Infinitif εὐαγγελίζω berarti menyampaikan atau mengumumkan kabar baik. Pilihan ini mempertahankan daya verbalnya tanpa menjadikannya istilah gerejawi yang terlalu teknis.
- source_word: δεῖ
  choice: Aku ... harus
  rationale: δεῖ menyatakan keharusan yang kuat dan dalam Lukas kerap mengandung bobot keharusan ilahi atau misi. “Harus” ringkas, alami, dan tidak melemahkan daya ungkapnya.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: tentang Kerajaan Allah
  rationale: Frasa ini merupakan ungkapan utama dalam Lukas. “Kerajaan Allah” adalah padanan baku dan transparan yang membiarkan cakupannya—pemerintahan maupun ranah kekuasaan Allah—tetap terbuka.
- source_word: ἐπὶ τοῦτο
  choice: untuk itulah
  rationale: Frasa ini menyatakan tujuan. “Untuk itulah” alami dalam bahasa Indonesia dan dengan jelas mengacu kembali pada tugas memberitakan kabar baik tentang Kerajaan Allah.
- source_word: ἀπεστάλην
  choice: Aku diutus
  rationale: Bentuk pasif aoristus ἀποστέλλω paling langsung diterjemahkan “Aku diutus”. Ini mempertahankan bahasa pengutusan tanpa menambahkan identitas pengutus yang tidak dinyatakan secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Daya pernyataan misi Yesus
  choice: Ayat ini menyatakan keharusan misi untuk memberitakan Kerajaan Allah di berbagai kota, sambil mempertahankan bentuk pasif “Aku diutus”.
  alternative: Keperluan itu dapat dijelaskan secara eksplisit sebagai keharusan ilahi, dan Allah dapat disebut langsung sebagai Pengutus.
  rationale: δεῖ sering menyiratkan keharusan ilahi dalam Lukas, dan ἀπεστάλην mengisyaratkan suatu pengutusan. Namun, teks ayat ini tidak menyebut pengutus secara eksplisit. Terjemahan mempertahankan bobot teologis sekaligus ketegangan tersebut tanpa memperluasnya menjadi parafrasa doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Dia” dan “Aku” mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab Indonesia tanpa menambahkan isi teologis. “Kota-kota” dipilih daripada “daerah-daerah” atau “kampung-kampung” agar sesuai dengan πόλεις. Semua penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskan.
