  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: id
  text: selama empat puluh hari, Ia dicobai[a] oleh Iblis. Ia tidak makan apa pun selama hari-hari itu, dan ketika hari-hari itu berakhir, Ia pun lapar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diuji.” Kata Yunani yang digunakan dapat berarti “mencobai” atau “menguji,” tetapi “dicobai” paling sesuai di sini karena pelakunya adalah Iblis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: selama empat puluh hari
  rationale: Bentuk akusatif menyatakan rentang waktu; “selama” mengungkapkannya secara alami dan jelas dalam bahasa Indonesia.
- source_word: πειραζόμενος
  choice: Ia dicobai
  rationale: Kata ini dapat berarti “dicobai” atau “diuji.” Karena pelakunya adalah Iblis, nuansa godaan yang bermaksud jahat paling sesuai, sedangkan kemungkinan “diuji” dipertahankan dalam catatan kaki.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: oleh Iblis
  rationale: διάβολος di sini merupakan sebutan pribadi yang dikenal bagi musuh rohani itu; “Iblis” adalah padanan baku dan jelas dalam bahasa Indonesia.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Ia tidak makan apa pun
  rationale: Padanan ini mempertahankan penyangkalan menyeluruh dalam bentuk yang alami bagi pembaca Indonesia modern.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: selama hari-hari itu
  rationale: “Selama” memperjelas bahwa frasa ini menunjuk pada seluruh rentang waktu tersebut.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: setelah semuanya berakhir
  rationale: Konstruksi genitif absolut diterjemahkan sebagai anak kalimat waktu. Kata ganti jamak merujuk pada hari-hari itu; “semuanya” menghindari pengulangan yang kaku.
- source_word: ἐπείνασεν
  choice: Ia merasa lapar
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan keadaan lapar yang dinyatakan pada akhir masa empat puluh hari itu tanpa gaya arkais.
theological_decisions:
- issue: Makna πειραζόμενος dalam pengalaman Yesus di padang gurun
  choice: dicobai
  alternative: diuji
  rationale: Pelaku yang disebut, yaitu Iblis, mendukung arti “dicobai,” tetapi kata Yunani tersebut juga dapat berarti “diuji.” Terjemahan tidak menambahkan penjelasan doktrinal mengenai sifat pencobaan Yesus, sehingga ketegangan teologis tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Ia” mengikuti kebiasaan penghormatan yang lazim dalam teks Alkitab bahasa Indonesia; kalimat awal sengaja tetap berupa lanjutan sintaksis dari ayat sebelumnya.
