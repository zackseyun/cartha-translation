  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: id
  text: Lalu Yesus berdiri di dekatnya[a] dan menegur demam itu. Demam itu meninggalkannya. Seketika itu juga, perempuan itu bangun dan mulai melayani mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri di atasnya.”
    reason: Ungkapan Yunani menyatakan posisi Yesus relatif terhadap perempuan itu; terjemahan utama memakai ungkapan Indonesia yang alami tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: berdiri di dekat perempuan itu
  rationale: Ungkapan ini menggambarkan Yesus mengambil posisi sangat dekat dan berada di atas perempuan yang sedang berbaring. Terjemahan harfiah “berdiri di atasnya” dalam bahasa Indonesia dapat keliru dipahami seolah-olah Yesus menginjak atau berdiri tepat di atas tubuhnya; pilihan ini menyampaikan adegan secara alami, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: ἐπετίμησεν
  choice: menegur
  rationale: Kata ini menyatakan teguran yang berwibawa dan mempertahankan cara Lukas menggambarkan tindakan Yesus tanpa menambahkan penjelasan tentang penyebab demam tersebut.
- source_word: τῷ πυρετῷ
  choice: demamnya
  rationale: Bahasa Indonesia secara alami menyebut penyakit yang diderita perempuan itu sebagai “demamnya”. Demam tetap menjadi sasaran langsung teguran Yesus dan kemudian disebut secara eksplisit sebagai pelaku tindakan meninggalkan perempuan itu.
- source_word: ἀφῆκεν αὐτήν
  choice: Demam itu pun meninggalkannya
  rationale: Subjek tersirat dalam bahasa Yunani adalah demam. Mengulang “demam itu” menghindari ketidakjelasan pronomina dalam bahasa Indonesia dan mempertahankan penggambaran demam sebagai sesuatu yang pergi darinya.
- source_word: παραχρῆμα
  choice: Saat itu juga
  rationale: Ungkapan ini menyampaikan pemulihan yang langsung dan seketika dengan bahasa Indonesia yang alami.
- source_word: ἀναστᾶσα
  choice: perempuan itu bangun
  rationale: Partisip aoris ini menyatakan tindakan bangun segera sesudah kesembuhan. Penyebutan “perempuan itu” menjaga kejelasan rujukan.
- source_word: διηκόνει
  choice: mulai melayani
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang mulai berlangsung. “Melayani” sesuai dengan pelayanan praktis kepada orang-orang yang hadir, tanpa memberi warna jabatan keagamaan.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Pronomina datif jamak merujuk kepada kelompok yang hadir; “melayani mereka” merupakan susunan yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah teguran Yesus kepada demam harus diterjemahkan sebagai personifikasi atau sebagai petunjuk adanya penyebab demonis
  choice: Mempertahankan bahwa Yesus “menegur demamnya” dan bahwa demam itu “meninggalkannya”, tanpa penjelasan tambahan
  alternative: Menafsirkan demam itu sebagai roh jahat atau melemahkan ungkapan menjadi sekadar penyembuhan penyakit
  rationale: Teks Yunani secara langsung menjadikan demam sebagai sasaran teguran dan sebagai subjek tersirat yang pergi. Terjemahan mempertahankan cara pengungkapan Lukas serta kewibawaan Yesus, tetapi tidak menetapkan apakah bahasa tersebut merupakan personifikasi atau menyiratkan sebab demonis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat lugas dan bermartabat. Pengulangan “demam itu” dan “perempuan itu” dipakai untuk menjaga kejelasan rujukan. Kata “pun” menandai hasil langsung dari teguran tanpa menambahkan hubungan sebab yang melampaui teks.
