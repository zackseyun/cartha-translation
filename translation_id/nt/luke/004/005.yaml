id: LUK.4.5
reference: Luke 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: id
  text: Setelah membawa Yesus naik, Iblis memperlihatkan kepada-Nya semua kerajaan di dunia yang dihuni[a] dalam sesaat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dunia.” Istilah Yunani ini sering berarti “dunia yang dihuni” dan dalam konteks tertentu dapat secara lebih khusus menunjuk pada dunia beradab atau dunia kekaisaran.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam sekejap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: setelah membawa Yesus naik
  rationale: Bentuk partisip aoris ini menunjukkan tindakan yang mendahului tindakan utama dan mengandung gagasan gerak ke atas. Ungkapan ini tidak menambahkan lokasi seperti gunung, yang tidak disebutkan dalam ayat Lukas ini. Nama “Yesus” memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: ἔδειξεν
  choice: memperlihatkan
  rationale: Padanan naratif yang wajar untuk tindakan membuat seseorang melihat sesuatu; konstruksi “memperlihatkan kepada-Nya” sesuai dengan objek tak langsung dan objek langsung dalam bahasa sumber.
- source_word: πάσας τὰς βασιλείας
  choice: semua kerajaan
  rationale: Dalam konteks ini βασιλεία menunjuk pada kerajaan atau wilayah kekuasaan, bukan konsep abstrak tentang pemerintahan. Bentuk jamak dengan πάσας diterjemahkan secara langsung.
- source_word: τῆς οἰκουμένης
  choice: di dunia yang dihuni
  rationale: οἰκουμένη secara harfiah menunjuk pada dunia yang dihuni dan dalam konteks tertentu dapat bernuansa dunia beradab atau kekaisaran. Pilihan ini mempertahankan kekhususan leksikal tanpa mempersempitnya menjadi Kekaisaran Romawi.
- source_word: ἐν στιγμῇ χρόνου
  choice: dalam sesaat
  rationale: Ungkapan ini menekankan rentang waktu yang amat singkat. “Dalam sesaat” alami dalam bahasa Indonesia dan tetap mempertahankan penekanan temporalnya.
theological_decisions:
- issue: Cara Iblis memperlihatkan kerajaan-kerajaan itu
  choice: Menggambarkan peristiwa tersebut tanpa menentukan mekanismenya
  alternative: Menafsirkannya sebagai penglihatan adikodrati atau sebagai pemandangan harfiah dari tempat tinggi
  rationale: Teks Yunani hanya menyatakan bahwa Iblis memperlihatkan semua kerajaan itu kepada Yesus dalam sesaat. Terjemahan tidak menentukan apakah hal itu terjadi melalui penglihatan, secara adikodrati, atau dari suatu lokasi geografis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan “setelah ...” mempertahankan urutan tindakan dalam bahasa Yunani. Penyebutan “Yesus” dan “Iblis” memperjelas acuan pronomina tanpa mengubah pelaku atau penerima tindakan; kapitalisasi “-Nya” mengikuti kebiasaan umum teks Alkitab bahasa Indonesia.
