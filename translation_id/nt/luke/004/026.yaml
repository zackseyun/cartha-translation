id: LUK.4.26
reference: Luke 4:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: id
  text: Dan Elia tidak diutus kepada seorang pun dari mereka, kecuali ke Sarepta[a], di wilayah Sidon, kepada seorang janda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: “Sarepta di wilayah Sidon”; tempat ini secara tradisional diidentifikasi dengan Sarfat dalam 1 Raja-Raja 17:9.'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Dalam rangkaian argumen ini, καί menghubungkan ayat dengan pernyataan sebelumnya dan secara wajar bernuansa kontras; “Namun” membuat hubungan wacananya jelas tanpa menambah isi.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: kepada seorang pun dari mereka
  rationale: Ungkapan ini mempertahankan penyangkalan menyeluruh yang ditekankan oleh οὐδεμίαν dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐπέμφθη
  choice: diutus
  rationale: Bentuk pasif dipertahankan tanpa menyebut pelaku, sebagaimana teks Yunani tidak menyatakannya secara eksplisit.
- source_word: Ἠλίας
  choice: Elia
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: εἰ μὴ
  choice: kecuali
  rationale: Konstruksi ini bersifat pengecualian, bukan persyaratan.
- source_word: Σάρεπτα
  choice: Sarepta
  rationale: Mengikuti bentuk nama tempat dalam teks Yunani secara langsung; catatan kaki menjelaskan padanannya dengan Sarfat dalam Perjanjian Lama.
- source_word: τῆς Σιδωνίας
  choice: wilayah Sidon
  rationale: Genitif ini mengaitkan Sarepta dengan kawasan Sidon; “wilayah Sidon” menyampaikan hubungan geografis itu secara alami tanpa menyamakan kota Sarepta dengan kota Sidon.
- source_word: πρὸς γυναῖκα χήραν
  choice: kepada seorang janda
  rationale: Terjemahan idiomatis dari ungkapan harfiah “kepada seorang perempuan, seorang janda,” tanpa kehilangan makna.
theological_decisions:
- issue: Pelaku yang mengutus Elia tidak disebutkan dalam bentuk pasif
  choice: 'Mempertahankan bentuk pasif: “Elia tidak diutus”'
  alternative: 'Mengeksplisitkan pelaku: “Allah tidak mengutus Elia”'
  rationale: Konteks menyiratkan bahwa Allah adalah pelakunya, tetapi teks Yunani tidak menyebut-Nya secara langsung; terjemahan mempertahankan keterbatasan tekstual tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara penyangkalan menyeluruh, pengecualian, identifikasi geografis, dan bentuk pasif tanpa pelaku tetap dipertahankan.
