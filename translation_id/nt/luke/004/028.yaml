  text: καὶ ἐπλήσθησαν πάντες θυμοῦ ἐν τῇ συναγωγῇ ἀκούοντες ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: id
  text: Ketika mendengar hal-hal itu, semua orang di dalam rumah ibadat dipenuhi kemarahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dipenuhi amarah." Kata Yunani θυμός dapat berarti kemarahan yang sangat kuat atau amarah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: dipenuhi
  rationale: Bentuk aorist pasif dari πίμπλημι dipertahankan secara alami dalam bahasa Indonesia dan menyatakan bahwa kemarahan menguasai mereka.
- source_word: πάντες
  choice: semua orang
  rationale: Bentuk jamak ini merujuk secara kolektif kepada orang-orang yang hadir; 'semua orang' jelas dan alami dalam bahasa Indonesia.
- source_word: θυμοῦ
  choice: kemarahan
  rationale: θυμός menunjuk pada kemarahan yang kuat. 'Kemarahan' merupakan padanan modern yang wajar, sementara 'amarah' juga mungkin dan bernuansa lebih hebat.
- source_word: ἐν τῇ συναγωγῇ
  choice: di dalam rumah ibadat
  rationale: Frasa ini menunjukkan tempat orang-orang itu berada. 'Rumah ibadat' mudah dipahami sebagai tempat ibadah Yahudi, dan 'di dalam' mempertahankan nuansa ruang dari ἐν.
- source_word: ἀκούοντες
  choice: ketika mendengar
  rationale: Partisipel kini menyatakan keadaan yang bersamaan dengan verba utama dan secara alami dapat diungkapkan sebagai anak kalimat waktu.
- source_word: ταῦτα
  choice: hal-hal itu
  rationale: Kata tunjuk jamak ini merujuk kembali kepada pernyataan-pernyataan Yesus sebelumnya tanpa mempersempitnya secara tidak perlu menjadi hanya 'perkataan'.
