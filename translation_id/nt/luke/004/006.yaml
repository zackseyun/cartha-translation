id: LUK.4.6
reference: Luke 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: id
  text: Lalu Iblis berkata kepada-Nya, “Aku akan memberikan kepada-Mu seluruh wewenang ini dan kemuliaan kerajaan-kerajaan itu[a], sebab hal itu telah diserahkan kepadaku, dan aku memberikannya kepada siapa saja yang kukehendaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemegahan kerajaan-kerajaan itu.” Kata Yunani yang digunakan di sini dapat berarti kemuliaan, kemegahan, atau kebesaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Iblis
  rationale: Dalam kisah pencobaan ini kata tersebut menjadi sebutan pribadi bagi lawan Yesus; “Iblis” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: Σοὶ δώσω
  choice: Aku akan memberikan kepada-Mu
  rationale: Susunan ini alami dalam bahasa Indonesia, sementara bentuk “kepada-Mu” tetap menyampaikan penekanan pada penerima.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Kata ini menunjuk pada hak atau kuasa untuk memerintah, bukan terutama kekuatan; “wewenang” paling tepat dalam konteks kerajaan-kerajaan.
- source_word: ταύτην ἅπασαν
  choice: seluruh ... ini
  rationale: Ungkapan ini mempertahankan demonstratif dan penegasan atas keseluruhan wewenang yang baru saja diperlihatkan.
- source_word: δόξαν αὐτῶν
  choice: kemuliaan kerajaan-kerajaan itu
  rationale: “Kemuliaan” mempertahankan keluasan makna δόξα, sedangkan penyebutan ulang “kerajaan-kerajaan” memperjelas acuan pronomina jamak αὐτῶν secara alami dalam bahasa Indonesia.
- source_word: παραδέδοται
  choice: telah diserahkan kepadaku
  rationale: Bentuk ini mempertahankan aspek tindakan lampau dengan hasil yang masih berlaku serta bentuk pasif, tanpa menyatakan bahwa klaim Iblis itu sah.
- source_word: ᾧ ἂν θέλω
  choice: kepada siapa saja yang kukehendaki
  rationale: Padanan ini menyampaikan acuan tak tentu dan klaim kebebasan Iblis untuk menentukan penerimanya.
- source_word: δίδωμι αὐτήν
  choice: aku memberikannya
  rationale: Bentuk kini sederhana menyampaikan tindakan umum atau kebiasaan yang diklaim Iblis.
theological_decisions:
- issue: Apakah terjemahan harus mengesahkan klaim Iblis bahwa ia menguasai wewenang atas kerajaan-kerajaan
  choice: Pernyataan diterjemahkan langsung sebagai ucapan Iblis tanpa tambahan yang mengesahkan ataupun meragukannya.
  alternative: Menambahkan kata seperti “menurut pengakuannya” atau “katanya telah diserahkan” untuk menjauhkan narator dari klaim tersebut.
  rationale: Teks Yunani menyajikannya sebagai ucapan langsung Iblis. Identitas penuturnya sudah jelas, sehingga terjemahan tidak perlu menyelesaikan ketegangan teologis dengan komentar tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Kukehendaki” dipilih daripada bentuk percakapan “kuinginkan” untuk menjaga register yang luhur tetapi tetap mudah dipahami.
