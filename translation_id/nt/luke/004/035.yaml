revisions:
- from: Lalu Yesus menghardik roh itu, kata-Nya, “Diam! Keluarlah dari orang ini!” Setelah membanting orang itu ke tengah-tengah mereka, setan itu keluar darinya tanpa mencederainya sedikit pun.
  to: Lalu Yesus menghardik roh jahat itu dan berkata, “Diamlah! Keluarlah dari orang itu!” Setelah melemparkan orang itu ke tengah-tengah, roh jahat itu keluar darinya tanpa mencederainya sedikit pun.
  rationale: 'Revisi ini mempertahankan urutan dan hubungan tindakan dalam bahasa Yunani: Yesus menghardik dan berbicara; roh jahat itu melemparkan orang tersebut ke tengah lalu keluar tanpa melukainya. Istilah “roh jahat” menggantikan “setan” untuk membedakan δαιμόνιον dari sebutan yang lazim dipakai bagi Iblis. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual penting yang perlu dipindahkan ke catatan.'
