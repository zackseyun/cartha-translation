  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: id
  text: Lalu Yesus menghardik roh jahat itu dan berkata, “Diamlah! Keluarlah dari orang itu!” Setelah melemparkan orang itu ke tengah-tengah, roh jahat itu keluar darinya tanpa mencederainya sedikit pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: menghardik roh itu
  rationale: Kata ἐπιτιμάω menyatakan teguran atau perintah keras dan berwibawa. Referen pronomina αὐτῷ adalah roh jahat dalam konteks; penyebutan 'roh itu' lebih jelas dan alami dalam bahasa Indonesia.
- source_word: Φιμώθητι
  choice: Diam!
  rationale: Secara harfiah verba ini berkaitan dengan memasang berangus, tetapi sebagai perintah terhadap ucapan berarti menyuruh diam dengan tegas.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: Keluarlah dari orang ini!
  rationale: Menyampaikan secara langsung perintah eksorsistik. 'Orang ini' memperjelas bahwa αὐτοῦ merujuk kepada manusia yang dirasuki, tanpa mengubah makna.
- source_word: ῥίψαν αὐτὸν
  choice: setelah membanting orang itu
  rationale: Partisip aoris dapat menyatakan tindakan yang mendahului verba utama. 'Membanting' menyampaikan tindakan melemparkan dengan keras tanpa menambahkan arah yang tidak dinyatakan.
- source_word: εἰς τὸ μέσον
  choice: ke tengah-tengah mereka
  rationale: Frasa ini berarti ke tengah atau ke tengah-tengah. 'Mereka' tersirat dari latar orang banyak dan diperlukan agar ungkapannya alami serta jelas dalam bahasa Indonesia.
- source_word: τὸ δαιμόνιον
  choice: setan itu
  rationale: δαιμόνιον menunjuk makhluk roh jahat. 'Setan' adalah padanan Indonesia yang umum dan mudah dipahami dalam konteks ini, tanpa mengabstraksikannya menjadi sekadar kekuatan atau penyakit.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: tanpa mencederainya sedikit pun
  rationale: Ungkapan ini mempertahankan penekanan μηδέν bahwa orang tersebut sama sekali tidak mengalami cedera meskipun dibanting.
theological_decisions:
- issue: Penggambaran δαιμόνιον dalam kisah pengusiran roh
  choice: Menerjemahkannya sebagai 'setan' dan mempertahankan gambaran narasi tentang makhluk roh jahat yang ditegur langsung serta keluar dari orang itu.
  alternative: Mengalihkannya secara abstrak sebagai kekuatan jahat, gangguan jiwa, atau penyakit.
  rationale: Teks Yunani memakai sapaan langsung, perintah keluar, dan tindakan keluar; terjemahan tidak boleh meniadakan penggambaran personal yang ada dalam narasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat langsung dibuat tajam sesuai dua imperatif Yunani. Tidak digunakan catatan kaki karena alternatif harfiah 'diberanguslah' kurang membantu pembaca dan tidak diperlukan untuk menjaga ambiguitas penting.
