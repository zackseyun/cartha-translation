review_pass:
  verdict: revise
  source_fidelity: Perlu revisi kecil demi ketepatan leksikal dan untuk menghindari penambahan yang tidak dinyatakan secara langsung. δαιμόνιον lebih tepat diterjemahkan secara konsisten sebagai “roh jahat,” bukan “setan,” karena “Setan” dalam pemakaian Indonesia lazimnya menunjuk tokoh tertentu. “Orang ini” juga menambahkan nuansa deiktis yang tidak ada dalam αὐτοῦ.
  naturalness: Teksnya pada dasarnya lugas dan alami. “Lalu Yesus menghardik ... dan berkata” lebih mengalir daripada “kata-Nya,” dan “melemparkan” adalah padanan yang lebih netral untuk ῥίπτω daripada “membanting.”
  terminology: Gunakan “roh jahat itu” untuk αὐτῷ dalam konteks dan τὸ δαιμόνιον dalam klausa berikutnya. Ini mempertahankan referen personal-jahat dalam narasi tanpa mencampurkan δαιμόνιον dengan nama khusus “Setan.”
  issues:
  - severity: medium
    issue: “setan itu” untuk τὸ δαιμόνιον
    rationale: Dalam bahasa Indonesia modern, “Setan” lazim dipahami sebagai nama atau sebutan bagi Iblis, sedangkan δαιμόνιον di sini adalah satu roh jahat. “Roh jahat itu” lebih tepat dan konsisten dengan referen sebelumnya.
  - severity: low
    issue: “orang ini” untuk αὐτοῦ
    rationale: Pronomina Yunani berarti “dia/darinya” dan tidak mengandung unsur deiktis “ini.” “Orang itu” tetap jelas dalam bahasa Indonesia tanpa menambahkan penekanan.
  - severity: low
    issue: “membanting” terlalu spesifik/intensif
    rationale: ῥίπτω menyatakan melemparkan, tanpa secara eksplisit menyatakan gerakan membanting atau membanting ke bawah. “Melemparkan” mempertahankan cakupan makna sumber.
  - severity: low
    issue: “mereka” ditambahkan pada εἰς τὸ μέσον
    rationale: Konteks memang melibatkan orang banyak, tetapi frasa ayat ini hanya menyatakan “ke tengah.” Menghilangkan “mereka” menjaga keterbukaan ungkapan sumber.
  revised_text: Lalu Yesus menghardik roh jahat itu dan berkata, “Diamlah! Keluarlah dari orang itu!” Setelah melemparkan orang itu ke tengah-tengah, roh jahat itu keluar darinya tanpa mencederainya sedikit pun.
