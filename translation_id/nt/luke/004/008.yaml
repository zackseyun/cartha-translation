base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: id
  text: Lalu Yesus menjawabnya, “Ada tertulis, ‘Engkau harus menyembah[a] Tuhan, Allahmu,[b] dan hanya kepada Dialah engkau harus beribadah.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “bersujud kepada Tuhan, Allahmu.”
    reason: lexical_alternative
  - marker: b
    text: Kutipan ini menggemakan Ulangan 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Lalu Yesus menjawabnya
  rationale: Ungkapan partisip ditambah verba utama dalam narasi Yunani dialihkan menjadi bentuk Indonesia yang wajar, sambil mempertahankan bahwa Yesus memberikan jawaban kepadanya.
- source_word: Γέγραπται
  choice: Ada tertulis
  rationale: Bentuk perfektum pasif ini merupakan rumus pengutipan Kitab Suci dan menyiratkan bahwa yang tertulis tetap berlaku.
- source_word: Κύριον τὸν θεόν σου
  choice: Tuhan, Allahmu
  rationale: Menerjemahkan κύριος sebagai “Tuhan” dan mempertahankan hubungan aposisional serta unsur kepunyaan dalam θεόν σου.
- source_word: προσκυνήσεις
  choice: harus menyembah
  rationale: Dalam konteks pengabdian eksklusif kepada Allah, “menyembah” menyampaikan makna religius verba ini dengan jelas; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: λατρεύσεις
  choice: harus beribadah
  rationale: λατρεύω menunjuk pada pelayanan atau ibadah yang diberikan kepada ilah; “beribadah” mempertahankan nuansa sakral lebih tepat daripada sekadar “melayani” dalam bahasa Indonesia masa kini.
- source_word: αὐτῷ μόνῳ
  choice: hanya kepada Dialah
  rationale: Susunan ini mempertahankan penekanan eksklusif bahwa ibadah ditujukan kepada Dia saja.
theological_decisions:
- issue: Penerjemahan κύριος dalam kutipan Kitab Suci yang merujuk kepada Allah
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Lukas memakai κύριον. “Tuhan” menerjemahkan teks Perjanjian Baru secara langsung tanpa menggantinya dengan bentuk khusus yang mewakili nama YHWH dari teks Ibrani yang melatarbelakangi kutipan.
- issue: Nuansa λατρεύω sebagai pelayanan kepada Allah
  choice: beribadah
  alternative: melayani
  rationale: Konteks penyembahan kepada Allah menonjolkan pelayanan religius. “Beribadah” menghindari kesan pelayanan umum, tanpa mempersempitnya menjadi suatu tata ibadah denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ada tertulis” mempertahankan corak formula kutipan Kitab Suci, sedangkan susunan “hanya kepada Dialah” menegaskan eksklusivitas μόνῳ secara alami.
