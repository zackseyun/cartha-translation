  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: id
  text: Semua orang berbicara baik tentang Dia[a] dan takjub pada kata-kata penuh anugerah[b] yang keluar dari mulut-Nya; mereka berkata, “Bukankah Dia ini anak Yusuf?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi kesaksian tentang Dia.” Ungkapan Yunani ini dapat berarti bahwa mereka berbicara baik tentang Dia atau memberi kesaksian mengenai Dia; dalam konteks ini, arti yang bernada positif paling sesuai dengan pernyataan bahwa mereka takjub.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kata-kata anugerah”; ungkapan ini dapat menunjuk pada kata-kata yang ditandai oleh anugerah, kemurahan, atau daya tarik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: berbicara baik tentang Dia
  rationale: Ungkapan ini dapat berarti memberi kesaksian tentang atau berbicara baik mengenai seseorang. Dalam konteks reaksi yang disandingkan dengan ketakjuban, makna pujian atau persetujuan paling sesuai.
- source_word: ἐθαύμαζον
  choice: takjub
  rationale: Kata ini menyatakan rasa heran yang kuat; bentuk imperfek menggambarkan reaksi yang sedang berlangsung, yang dalam bahasa Indonesia alami dapat dinyatakan dengan verba sederhana dalam rangkaian naratif.
- source_word: ἐπὶ τοῖς λόγοις
  choice: mendengar kata-kata
  rationale: ἐπί dengan datif menunjukkan dasar atau hal yang menimbulkan ketakjuban. 'Takjub mendengar' menyampaikan hubungan itu secara alami tanpa mengubah objek ketakjubannya.
- source_word: τῆς χάριτος
  choice: penuh anugerah
  rationale: 'Genitif ini kemungkinan bersifat kualitatif: kata-kata yang ditandai oleh χάρις, yakni anugerah, kemurahan, atau daya tarik. ''Penuh anugerah'' mempertahankan istilah teologis sekaligus masuk akal sebagai gambaran kualitas ucapan.'
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: yang keluar dari mulut-Nya
  rationale: Terjemahan ini mempertahankan gambaran konkret dan hubungan partisipialnya dengan 'kata-kata' dalam bahasa Indonesia yang wajar.
- source_word: Οὐχὶ
  choice: Bukankah
  rationale: Bentuk ini memperkenalkan pertanyaan yang mengharapkan jawaban ya dan secara alami mempertahankan daya retorisnya dalam bahasa Indonesia.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: Dia ini anak Yusuf
  rationale: Susunan ini ringkas dan alami serta mempertahankan οὗτος yang menunjuk kepada Yesus. Pernyataan tersebut disajikan sebagai persepsi orang banyak tanpa penjelasan tambahan.
theological_decisions:
- issue: Penyebutan Yesus sebagai anak Yusuf dalam kaitannya dengan konsepsi dari perawan
  choice: Menerjemahkan perkataan orang banyak secara langsung sebagai 'Dia ini anak Yusuf' tanpa kualifikasi.
  alternative: Menambahkan penjelasan atau jarak interpretatif agar tidak dianggap sebagai koreksi terhadap konsepsi dari perawan.
  rationale: Ayat ini melaporkan persepsi orang banyak, bukan memberikan koreksi doktrinal dari narator. Ketegangan naratif dan teologis harus dipertahankan, bukan diselesaikan di dalam terjemahan.
- issue: Makna τῆς χάριτος
  choice: penuh anugerah
  alternative: menawan; yang penuh kemurahan; kata-kata anugerah
  rationale: Frasa Yunani tetap memiliki rentang antara kualitas ucapan yang menarik atau penuh kemurahan dan muatan yang berkaitan dengan anugerah. Teks utama memakai ungkapan yang wajar dan berbobot, sedangkan catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Yesus ditulis dengan huruf kapital sesuai kelaziman luas dalam penerbitan Alkitab Indonesia. Struktur kalimat dibagi menjadi dua agar alurnya jelas; penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya.
