  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: id
  text: Sebab ada tertulis, “Ia akan memberi perintah kepada para malaikat-Nya tentang engkau, supaya mereka menjaga engkau.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: ada tertulis
  rationale: Ungkapan baku dan alami untuk memperkenalkan kutipan Kitab Suci, sekaligus mencerminkan keadaan yang tetap berlaku dari bentuk perfektum pasif.
- source_word: γὰρ
  choice: sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan kutipan ini dengan perkataan sebelumnya.
- source_word: ὅτι
  choice: tanda koma
  rationale: Dalam bahasa Indonesia, isi kutipan sesudah “ada tertulis” lebih alami diperkenalkan langsung dengan tanda baca daripada dengan kata “bahwa”.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: malaikat-malaikat-Nya
  rationale: Padanan alami bagi frasa datif dengan penanda kepunyaan; konteks menunjukkan para malaikat milik Allah.
- source_word: ἐντελεῖται
  choice: Dia akan memerintahkan
  rationale: Menyampaikan makna verba futur ἐντέλλομαι sebagai memberi perintah atau amanat, tanpa memperluas isi kutipan.
- source_word: περὶ σοῦ
  choice: mengenai engkau
  rationale: Mencerminkan arti περί dengan genitif, yaitu “mengenai/tentang”, sambil mempertahankan ragam bahasa kutipan Kitab Suci yang bermartabat.
- source_word: τοῦ διαφυλάξαι σε
  choice: untuk menjaga engkau
  rationale: Menampilkan infinitif artikular sebagai tujuan atau penjelasan dari perintah tersebut; “menjaga” mempertahankan nuansa perlindungan dari διαφυλάσσω.
theological_decisions:
- issue: Bentuk kutipan Mazmur dalam perkataan Iblis
  choice: Menerjemahkan hanya kata-kata yang tercatat dalam teks Lukas secara dekat dan tanpa melengkapi kutipan dari Mazmur 91:11.
  alternative: Menambahkan bagian lanjutan atau unsur lain dari bentuk lengkap Mazmur 91:11.
  rationale: Lukas mencatat bentuk kutipan tertentu. Tidak menambahkan kata-kata yang tidak terdapat dalam teks Yunani menjaga integritas teks dan tidak menyelaraskannya secara diam-diam dengan bentuk Mazmur yang lebih lengkap.
- issue: Rujukan subjek tersirat pada ἐντελεῖται
  choice: Dia, dengan huruf kapital sebagai rujukan kepada Allah dalam kutipan.
  alternative: Ia, tanpa kapitalisasi khusus.
  rationale: Subjek verba tersirat dan dalam konteks kutipan Mazmur merujuk kepada Allah. Kapitalisasi merupakan kebiasaan editorial Indonesia untuk pronomina ilahi, bukan penambahan identitas baru ke dalam kalimat.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. “Engkau” dipertahankan karena ini kutipan langsung yang ditujukan kepada satu orang dan sesuai dengan ragam Kitab Suci; struktur “mengenai engkau, untuk menjaga engkau” sengaja mempertahankan hubungan frasa Yunani tanpa mengubahnya menjadi janji perlindungan yang lebih luas.
