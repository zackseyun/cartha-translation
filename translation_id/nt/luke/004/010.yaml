  source_fidelity: 'Makna pokok dipertahankan: γὰρ diterjemahkan sebagai “Sebab,” γέγραπται dengan idiom kutipan Kitab Suci “ada tertulis,” dan kutipan tidak diperluas dengan bagian Mazmur yang tidak terdapat dalam Lukas. Namun, konstruksi “memerintahkan malaikat-malaikat-Nya mengenai engkau” kurang jelas dalam bahasa Indonesia karena penerima perintah yang ditandai datif Yunani tidak dinyatakan secara idiomatis.'
