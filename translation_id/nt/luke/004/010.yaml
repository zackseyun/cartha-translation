  terminology: “Malaikat,” “engkau,” dan “menjaga” sesuai dengan register kutipan Kitab Suci. “Para malaikat-Nya” merupakan bentuk jamak yang lebih wajar daripada pengulangan “malaikat-malaikat-Nya” dalam konteks ini. Kapitalisasi “Ia” dapat dipertahankan sebagai konvensi editorial bagi rujukan kepada Allah dalam kutipan.
