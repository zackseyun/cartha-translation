  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: id
  text: Namun, Yesus berjalan melalui tengah-tengah mereka lalu meneruskan perjalanan-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: Yesus
  rationale: Pronomina yang eksplisit dan agak menonjol ini merujuk kepada Yesus. Menyebut nama-Nya membuat subjek jelas dan alami dalam bahasa Indonesia tanpa menambahkan penekanan berlebihan seperti 'Ia sendiri'.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai pertentangan ringan antara niat jahat orang banyak pada ayat sebelumnya dan kepergian Yesus tanpa cedera.
- source_word: διελθὼν
  choice: berjalan melewati
  rationale: Partisip aoris ini menyatakan gerak menembus suatu ruang. Ungkapan ini alami dalam bahasa Indonesia dan tetap berkaitan erat dengan verba utama.
- source_word: διὰ μέσου αὐτῶν
  choice: tengah-tengah mereka
  rationale: Frasa ini menggambarkan gerakan melalui bagian tengah kelompok tersebut, bukan sekadar berada di antara mereka.
- source_word: ἐπορεύετο
  choice: meneruskan perjalanan-Nya
  rationale: Bentuk imperfek menggambarkan gerakan yang berlanjut. Pilihan ini menyampaikan bahwa Yesus pergi melanjutkan perjalanan, bukan hanya menjauh sesaat.
theological_decisions:
- issue: Apakah ayat ini harus menyiratkan bahwa pelarian Yesus terjadi secara mukjizat
  choice: 'Memakai uraian netral: ''berjalan melewati tengah-tengah mereka lalu meneruskan perjalanan-Nya'''
  alternative: Menambahkan keterangan bahwa Yesus secara ajaib atau adikodrati lolos dari mereka
  rationale: Teks Yunani hanya menggambarkan gerakan Yesus melalui kerumunan tanpa menjelaskan bagaimana hal itu terjadi. Terjemahan ini mempertahankan ketegangan tersebut dan tidak memasukkan mekanisme yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Tengah-tengah mereka' mempertahankan gambaran ruang dalam teks Yunani, sedangkan 'meneruskan perjalanan-Nya' menyampaikan aspek gerak yang berlanjut.
