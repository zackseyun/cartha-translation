    issue: “dengan tangan mereka” untuk Ἐπὶ χειρῶν
    rationale: Preposisi ἐπί di sini menyatakan posisi/topangan “di atas tangan mereka.” “Dengan tangan mereka” menggeser fokus menjadi sarana tindakan dan kurang setia pada citra tekstual.
  - severity: low
    issue: Penanda catatan kaki a melekat pada frasa tangan, padahal alternatif leksikalnya berkaitan dengan “mengangkat.”
    rationale: Memindahkan penanda ke “mengangkat engkau” membuat jangkar catatan kaki selaras dengan alternatif “menopang engkau.”
