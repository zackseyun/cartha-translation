base_translation:
  language: en
  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: id
  text: dan, “Mereka akan mengangkat engkau[a] di atas tangan mereka, supaya kakimu jangan terantuk pada batu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka akan menopang engkau.”
    reason: lexical_alternative
  - marker: b
    text: Atau “supaya kakimu jangan terbentur pada batu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung ini melanjutkan kutipan Kitab Suci dari ayat sebelumnya.
- source_word: ὅτι
  choice: tidak diterjemahkan secara tersendiri
  rationale: Di sini ὅτι memperkenalkan isi kutipan; fungsinya sudah terwakili secara alami oleh kelanjutan tanda kutip.
- source_word: Ἐπὶ χειρῶν
  choice: dengan tangan mereka
  rationale: Ungkapan ini mempertahankan gambaran bahwa para malaikat menopang atau membawa seseorang dengan tangan mereka, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: ἀροῦσίν σε
  choice: mereka akan mengangkat engkau
  rationale: Bentuk mendatang dari αἴρω di sini menyatakan tindakan mengangkat dan menopang; pilihan ini menjaga gambaran perlindungan tanpa memakai ungkapan yang kuno.
- source_word: μήποτε
  choice: supaya ... jangan
  rationale: Mengungkapkan nuansa pencegahan atau tujuan negatif secara wajar dalam bahasa Indonesia.
- source_word: προσκόψῃς
  choice: terantuk
  rationale: Dalam hubungan dengan kaki dan batu, kata ini menunjuk pada kaki yang membentur atau tersandung pada sesuatu; 'terantuk' ringkas dan konkret.
- source_word: πρὸς λίθον
  choice: pada batu
  rationale: Bersama προσκόπτω, frasa ini menyatakan kontak dengan batu; 'terantuk pada batu' merupakan ungkapan Indonesia yang alami.
- source_word: τὸν πόδα σου
  choice: kakimu
  rationale: Bentuk tunggal Yunani dipertahankan dalam bahasa Indonesia.
theological_decisions:
- issue: Cara menyampaikan kutipan Mazmur dengan tetap mempertahankan gambaran perlindungan ilahi
  choice: mereka akan mengangkat engkau dengan tangan mereka
  alternative: mereka akan menopang engkau di atas tangan mereka
  rationale: Pilihan utama menyampaikan tindakan para malaikat yang mengangkat dan menjaga orang itu dengan bahasa modern, tanpa menambah penafsiran doktrinal atau menghilangkan gambaran tangan sebagai sarana perlindungan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'engkau' dipakai karena konteksnya adalah kutipan langsung yang ditujukan kepada satu orang; susunan kalimat mempertahankan sifat puitis kutipan tanpa menjadi kaku.
