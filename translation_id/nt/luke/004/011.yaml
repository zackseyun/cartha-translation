  source_fidelity: Frasa Ἐπὶ χειρῶν berarti “di atas tangan mereka,” bukan “dengan tangan mereka.” Terjemahan draf dapat dibaca seolah-olah tangan mereka hanyalah alat untuk mengangkat, sedangkan teks Yunani menonjolkan gambaran orang itu ditopang di atas tangan mereka. Selebihnya, “mengangkat engkau,” “supaya ... jangan,” “terantuk,” dan bentuk tunggal “kakimu” menyampaikan makna sumber dengan baik.
  naturalness: Susunan revisi tetap alami dalam Bahasa Indonesia modern dan mempertahankan register puitis-khidmat dari kutipan Kitab Suci. “Engkau” sesuai untuk sapaan tunggal dalam kutipan langsung.
  terminology: Tidak ada istilah teologis yang perlu diubah. “Mengangkat” merupakan padanan yang layak untuk ἀροῦσίν dalam konteks ini, sementara “di atas tangan mereka” mempertahankan citra perlindungan secara tepat.
  issues:
