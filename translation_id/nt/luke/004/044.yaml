  text: καὶ ἦν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ τῆς ⸀Ἰουδαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: id
  text: Ia terus berkhotbah di sinagoge-sinagoge di Yudea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “Galilea”, bukan “Yudea”. Teks utama mengikuti bacaan “Yudea” dalam teks Yunani yang digunakan di sini.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: terus memberitakan
  rationale: Konstruksi imperfek perifrastis menyatakan tindakan yang berlangsung atau berulang pada masa lampau. Ungkapan ini menyampaikan aspek tersebut secara alami dalam bahasa Indonesia.
- source_word: κηρύσσων
  choice: memberitakan
  rationale: Kata κηρύσσω menunjuk pada penyampaian berita secara terbuka. 'Memberitakan' mempertahankan gagasan proklamasi publik tanpa membatasi tindakan itu pada bentuk khotbah tertentu.
- source_word: εἰς τὰς συναγωγάς
  choice: di rumah-rumah ibadat
  rationale: Dalam konteks ini, εἰς menunjukkan tempat atau lingkup kegiatan, sehingga 'di' lebih alami daripada terjemahan harfiah yang menyiratkan gerakan masuk.
- source_word: συναγωγάς
  choice: rumah-rumah ibadat
  rationale: Istilah ini lazim dan mudah dipahami pembaca Indonesia untuk tempat pertemuan dan ibadah Yahudi; bentuk jamak Yunani dipertahankan.
- source_word: Ἰουδαίας
  choice: Yudea
  rationale: Teks SBLGNT berbunyi Ἰουδαίας, sehingga nama geografis 'Yudea' dipertahankan meskipun konteks sekitar berkaitan dengan Galilea.
theological_decisions:
- issue: Rujukan geografis τῆς Ἰουδαίας dalam konteks pelayanan di Galilea
  choice: Yudea
  alternative: Galilea; atau Yudea dalam arti wilayah Yahudi yang lebih luas
  rationale: Terjemahan mengikuti bacaan sumber Yunani dan tidak menyelaraskannya secara diam-diam dengan konteks. Varian 'Galilea' dicatat dalam catatan kaki agar ketegangan tekstual tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Ia' dipakai sebagai pronomina naratif; 'rumah ibadat' dipilih sebagai istilah umum untuk sinagoge. Objek tersirat pada κηρύσσων dinyatakan sebagai 'kabar itu' agar kalimat Indonesia alami, dengan merujuk pada kabar baik tentang Kerajaan Allah dalam ayat sebelumnya.
