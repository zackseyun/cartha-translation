  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: id
  text: 'Lalu Yesus menjawabnya, “Telah dikatakan[a]: ‘Janganlah engkau menguji Tuhan Allahmu.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terjemahan tradisional sering berbunyi “Ada tertulis.” Namun, bahasa Yunani di sini secara harfiah berbunyi “Telah dikatakan.”
    reason: alternative_reading
  - marker: b
    text: Kutipan ini berasal dari Ulangan 6:16. Teks Ibraninya memakai nama ilahi YHWH, yang sering diterjemahkan “TUHAN.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: menjawab
  rationale: Gabungan partisip dan verba finit ini merupakan ungkapan Yunani bercorak Semitis yang secara alami berarti ‘menjawab’; tidak perlu diterjemahkan secara kaku sebagai ‘menjawab dan berkata’.
- source_word: αὐτῷ
  choice: -nya
  rationale: Pronomina datif ini merujuk kepada Iblis dalam konteks sebelumnya; bentuk enklitik ‘-nya’ menghasilkan bahasa Indonesia yang alami.
- source_word: ὅτι
  choice: —
  rationale: Sesudah ‘menjawabnya’, bahasa Indonesia tidak memerlukan padanan eksplisit ‘bahwa’ sebelum kutipan langsung.
- source_word: Εἴρηται
  choice: Telah dikatakan
  rationale: Bentuk perfektum pasif dari λέγω berarti ‘telah dikatakan’ dan berfungsi sebagai formula kutipan berwibawa. Pilihan ini mempertahankan verba ‘mengatakan’, bukan menggantinya dengan ‘menulis’.
- source_word: Οὐκ ἐκπειράσεις
  choice: Janganlah kamu mencobai
  rationale: ἐκπειράζω berarti menguji atau mencobai secara sengaja. ‘Mencobai’ merupakan ungkapan Indonesia yang wajar dalam konteks menantang Allah agar membuktikan diri, tanpa menyiratkan bahwa Allah dapat dibujuk untuk berbuat dosa.
- source_word: κύριον
  choice: Tuhan
  rationale: κύριος diterjemahkan ‘Tuhan’. Dalam frasa aposisional ‘Tuhan, Allahmu’, bahasa Indonesia tidak memakai kata sandang.
- source_word: τὸν θεόν σου
  choice: Allahmu
  rationale: Padanan langsung dan alami untuk frasa ‘Allahmu’, dengan sufiks posesif yang mempertahankan bentuk orang kedua tunggal.
theological_decisions:
- issue: Formula kutipan Kitab Suci (Εἴρηται)
  choice: Telah dikatakan
  alternative: Ada tertulis
  rationale: Teks Yunani memakai bentuk pasif perfektum λέγω (‘mengatakan’), bukan γράφω (‘menulis’). Karena itu, teks utama mempertahankan formula ‘Telah dikatakan’, sedangkan bentuk tradisional dicatat dalam catatan kaki.
- issue: κύριος dalam kutipan Ulangan 6:16
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Yunani Lukas berbunyi κύριον, sehingga teks utama menerjemahkannya ‘Tuhan’. Namun, sumber Ibrani kutipan tersebut memakai nama ilahi YHWH, yang lazim ditampilkan sebagai ‘TUHAN’; informasi ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. ‘Lalu’ menghubungkan jawaban Yesus dengan rangkaian dialog. Tanda kutip tunggal membedakan kutipan Kitab Suci di dalam ucapan langsung Yesus. Penanda catatan kaki ditempatkan setelah keseluruhan ayat agar semuanya muncul dalam teks utama tanpa mengganggu alur kutipan.
