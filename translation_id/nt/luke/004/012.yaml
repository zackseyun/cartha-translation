  naturalness: “Yesus menjawabnya” dan “Telah dikatakan” baku serta cocok untuk register khidmat. “Tuhan Allahmu” lebih lancar sebagai satu kesatuan nama/jabatan daripada “Tuhan, Allahmu”, dan “engkau” mempertahankan sasaran orang kedua tunggal dalam kutipan.
