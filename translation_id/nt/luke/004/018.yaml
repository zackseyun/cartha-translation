id: LUK.4.18
reference: Luke 4:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: id
  text: Roh Tuhan ada padaku, karena ia telah mengurapi aku untuk memberitakan kabar baik kepada orang-orang miskin. Ia telah mengutus aku untuk memberitakan pembebasan[a] kepada para tawanan dan pemulihan penglihatan kepada orang-orang buta, serta untuk membebaskan orang-orang yang tertindas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani ἄφεσις juga dapat berarti “pengampunan”; dalam konteks para tawanan dan orang-orang yang tertindas, nuansa pembebasan lebih menonjol.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang yang telah diremukkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: Roh Tuhan ada padaku
  rationale: Mencerminkan ungkapan Yunani tanpa menambahkan gagasan bahwa Roh sekadar ‘berdiam’ atau ‘hinggap’; kopula ‘ada’ diperlukan agar wajar dalam bahasa Indonesia.
- source_word: οὗ εἵνεκεν
  choice: karena
  rationale: Menyampaikan hubungan sebab secara alami dan langsung dalam bahasa Indonesia modern.
- source_word: ἔχρισέν με
  choice: ia telah mengurapi aku
  rationale: ‘Mengurapi’ mempertahankan citra pengangkatan dan gema mesianik χρίω; ‘telah’ menunjukkan tindakan yang dampaknya tetap berlaku.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: untuk memberitakan kabar baik kepada orang-orang miskin
  rationale: ‘Memberitakan kabar baik’ menyampaikan makna εὐαγγελίζω tanpa mempersempitnya menjadi istilah gerejawi; πτωχοῖς tetap diterjemahkan secara terbuka sebagai orang-orang miskin.
- source_word: ἀπέσταλκέν με
  choice: Ia telah mengutus aku
  rationale: Bentuk perfektum menunjukkan pengutusan yang telah terjadi dan tetap berlaku; ‘telah mengutus’ menangkap nuansa itu.
- source_word: κηρύξαι
  choice: untuk memberitakan
  rationale: Mengungkapkan tindakan menyampaikan pengumuman secara terbuka dengan bahasa yang umum dan bermartabat.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: pembebasan kepada para tawanan
  rationale: Dalam hubungan dengan para tawanan dan latar Yesaya, ἄφεσις terutama menyatakan pelepasan atau pembebasan, bukan hanya pengampunan.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: pemulihan penglihatan kepada orang-orang buta
  rationale: ἀνάβλεψις menunjuk pada menerima atau memperoleh kembali penglihatan; ‘pemulihan penglihatan’ mempertahankan kekhususan itu.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: untuk membebaskan orang-orang yang tertindas
  rationale: Terjemahan idiomatis ini menyampaikan gerak ‘mengutus/melepas dalam pembebasan’ secara alami. τεθραυσμένους secara harfiah menunjuk kepada mereka yang telah diremukkan, tetapi dalam konteks ini menggambarkan orang-orang yang tertindas.
theological_decisions:
- issue: Makna ἄφεσις dalam kutipan Yesaya ini
  choice: pembebasan
  alternative: pengampunan
  rationale: Konteks langsung menyebut tawanan, orang buta, dan orang yang diremukkan atau tertindas, sehingga gambaran pelepasan paling menonjol. Namun, karena ἄφεσις juga dapat berarti pengampunan, kemungkinan itu dicatat tanpa mengganti bahasa pembebasan dalam teks utama.
- issue: Cakupan τεθραυσμένους
  choice: orang-orang yang tertindas
  alternative: orang-orang yang telah diremukkan
  rationale: Bentuk partisip pasif perfek secara harfiah berarti mereka yang telah diremukkan atau dihancurkan. ‘Tertindas’ menyampaikan makna kontekstual yang alami, sedangkan arti harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Memberitakan kabar baik’ menghindari jargon yang tidak perlu, sedangkan ‘mengurapi’ dipertahankan karena penting bagi citra dan gema mesianik teks. Pronomina ilahi tidak diberi kapitalisasi khusus kecuali pada awal kalimat, agar tidak memasukkan konvensi denominasi tertentu.
