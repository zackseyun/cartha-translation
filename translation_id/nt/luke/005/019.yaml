  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Susunan kalimat dibuat mengalir, detail atap bergenting dipertahankan, dan ambiguitas antara cara serta jalur masuk dicatat dalam catatan kaki.
