  naturalness: Kalimat revisi tetap baku dan mengalir dalam bahasa Indonesia modern. "Melalui genting-genting atap" menyatakan bentuk jamak κεράμων dan lebih jelas daripada "melalui genting" tanpa menambahkan mekanisme yang tidak eksplisit.
  terminology: '"Atap", "genting-genting atap", dan "tikar" sesuai konteks. Catatan tentang κλινίδιον dipisahkan dari catatan arsitektural supaya setiap penanda catatan kaki melekat pada unsur yang dijelaskan.'
  issues:
