id: LUK.5.19
reference: Luke 5:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: id
  text: Tidak menemukan jalan untuk membawanya masuk karena orang banyak[a], mereka naik ke atap lalu menurunkannya bersama tikarnya[c] melalui genting-genting atap[b] ke tengah, di hadapan Yesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Tidak menemukan cara untuk membawanya masuk karena orang banyak.” Ungkapan Yunani dapat menekankan cara maupun jalur masuk.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, melalui genting-genting atap. Kata-kata Lukas mencerminkan bangunan yang beratap genting.
    reason: cultural_note
  - marker: c
    text: Istilah Yunaninya juga dapat berarti “tempat tidur kecil” atau “usungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: jalan untuk membawa orang itu masuk
  rationale: Ungkapan eliptis ini dapat menunjuk pada cara atau jalur masuk. Pilihan ini alami dalam bahasa Indonesia dan tetap menonjolkan masalah akses tanpa meniadakan nuansa cara.
- source_word: διὰ τὸν ὄχλον
  choice: akibat terhalang orang banyak
  rationale: διά dengan akusatif bersifat kausal. Ungkapan ini menjelaskan secara alami bahwa kerumunan menjadi penghalang, bukan jalur yang mereka lalui.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: mereka naik ke atap
  rationale: δῶμα menunjuk pada atap atau bagian datar di atas rumah. Terjemahan ini ringkas, modern, dan mempertahankan gerak naik.
- source_word: διὰ τῶν κεράμων
  choice: melalui genting
  rationale: κέραμος dalam bentuk jamak di sini menunjuk pada genting atap. 'Genting' merupakan istilah Indonesia yang alami untuk detail bangunan yang disebut Lukas.
- source_word: καθῆκαν
  choice: menurunkannya
  rationale: Kata kerja ini menyatakan tindakan menurunkan sesuatu dari tempat yang lebih tinggi.
- source_word: σὺν τῷ κλινιδίῳ
  choice: bersama tikarnya
  rationale: κλινίδιον ialah tempat tidur kecil, alas tidur, atau usungan. 'Tikar' alami dalam konteks ini dan tidak memberi kesan peralatan medis modern; akhiran posesif disimpulkan dari konteks.
- source_word: εἰς τὸ μέσον
  choice: ke tengah-tengah orang banyak
  rationale: Frasa ini menyatakan gerak menuju bagian tengah. 'Orang banyak' ditambahkan secara kontekstual untuk menghasilkan bahasa Indonesia yang jelas, tanpa mengubah lokasi yang dimaksud.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: tepat di hadapan Yesus
  rationale: Frasa ini menunjukkan posisi ruang di depan Yesus. 'Di hadapan' bernada wajar dan bermartabat, sedangkan 'tepat' memperjelas kedekatan posisi tanpa mengubah maksud.
