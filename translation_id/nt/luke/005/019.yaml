    issue: Objek tambahan pada "ke tengah-tengah orang banyak"
    rationale: εἰς τὸ μέσον berarti "ke tengah"; teks Yunani tidak menyebut "orang banyak" sebagai pelengkap lokasi ini. Penambahan tersebut membatasi ruang lingkup frasa tanpa dukungan eksplisit.
  - severity: low
    issue: Penambahan "tepat" sebelum "di hadapan Yesus"
    rationale: ἔμπροσθεν menyatakan posisi di depan/hadapan Yesus, tetapi tidak secara khusus menyatakan ketepatan atau kedekatan.
  - severity: low
    issue: Catatan kaki tentang tikar digabungkan dengan penanda pada "genting"
    rationale: Catatan leksikal κλινίδιον sebaiknya diberi penanda pada "tikarnya", bukan digabungkan pada penanda yang melekat pada κεράμων.
