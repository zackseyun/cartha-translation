id: LUK.5.1
reference: Luke 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: id
  text: Pada suatu ketika, ketika orang banyak berdesak-desakan mendekati Yesus dan mendengarkan firman Allah[a], Ia sedang berdiri di tepi Danau Genesaret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika orang banyak berdesak-desakan mendekati dia dan mendengar firman Allah.”
    reason: lexical_alternative
  - marker: b
    text: Danau Genesaret juga dikenal sebagai Danau Galilea.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Ketika
  rationale: Formula naratif ini memperkenalkan keadaan terjadinya peristiwa. Dalam bahasa Indonesia modern, konstruksi temporal langsung dengan “Ketika” lebih alami daripada terjemahan harfiah “Terjadilah bahwa”, sementara daya penghubung δέ tidak perlu dinyatakan tersendiri.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: Ketika ... berdesak-desakan mendekati ... dan mendengarkan
  rationale: Konstruksi ἐν τῷ dengan infinitif bersifat temporal. Kedua tindakan orang banyak tetap dinyatakan secara sejajar.
- source_word: τὸν ὄχλον
  choice: orang banyak
  rationale: Ungkapan ini alami dalam ragam Alkitab Indonesia modern dan tepat menyampaikan arti kolektif ὄχλος.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: berdesak-desakan mendekati Yesus
  rationale: ἐπίκειμαι menggambarkan desakan fisik orang banyak terhadap seseorang. Nama “Yesus” dipakai untuk menjernihkan rujukan pronomina dalam bahasa Indonesia tanpa menambah identitas baru dari konteks.
- source_word: ἀκούειν
  choice: mendengarkan
  rationale: Bentuk ini menyampaikan perhatian aktif orang banyak, bukan sekadar mendengar secara pasif.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  rationale: Padanan baku dan bermartabat yang mempertahankan bobot teologis serta keluasan makna λόγος sebagai perkataan atau pesan yang berasal dari Allah.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: ia sedang berdiri
  rationale: Konstruksi perifrastis menunjukkan keadaan yang sedang berlangsung; αὐτός tidak perlu diberi penekanan tambahan.
- source_word: παρὰ τὴν λίμνην
  choice: di tepi Danau
  rationale: παρά di sini menunjukkan posisi di sisi danau; “di tepi” merupakan ungkapan Indonesia yang alami.
- source_word: Γεννησαρέτ
  choice: Genesaret
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia dan tidak diganti dengan nama penjelas lain.
theological_decisions:
- issue: Pemaknaan τὸν λόγον τοῦ θεοῦ
  choice: firman Allah
  alternative: pesan Allah
  rationale: “Firman Allah” mempertahankan ungkapan formal dan gema antarteks tanpa membatasi λόγος hanya pada satu bentuk penyampaian.
- issue: Penyebutan Γεννησαρέτ
  choice: Danau Genesaret
  alternative: Danau Galilea
  rationale: Teks Yunani menyebut Genesaret. Identifikasi dengan Danau Galilea diberikan sebagai catatan, bukan disisipkan menggantikan nama dalam teks.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Susunan kalimat menghindari bentuk kaku “Terjadilah bahwa”. Rujukan pertama kepada Yesus diperjelas dengan nama, lalu pronomina “ia” digunakan agar alur kalimat tetap lancar.
