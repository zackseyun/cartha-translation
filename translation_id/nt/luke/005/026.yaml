  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: id
  text: Semua orang diliputi rasa takjub. Mereka terus memuliakan Allah dan dipenuhi rasa takut. Mereka berkata, “Hari ini kami telah menyaksikan hal-hal yang luar biasa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκστασις
  choice: rasa takjub
  rationale: Dalam konteks ini, kata tersebut menunjuk pada ketakjuban yang sangat kuat, bukan keadaan ekstase mistis. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἔλαβεν ἅπαντας
  choice: Semua orang diliputi
  rationale: Idiom harfiahnya berarti ketakjuban 'menguasai semua orang'. 'Diliputi' mempertahankan daya ungkap Yunani dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἐδόξαζον
  choice: terus memuliakan
  rationale: Bentuk imperfek menunjukkan tindakan yang sedang berlangsung. 'Terus memuliakan' menyampaikan aspek tersebut dan tetap dekat dengan makna δοξάζω.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku bagi θεός dalam konteks ini.
- source_word: ἐπλήσθησαν φόβου
  choice: dipenuhi rasa takut
  rationale: Terjemahan langsung ini mempertahankan bentuk pasif serta ketegangan makna φόβος, yang dapat mencakup rasa gentar di hadapan tindakan ilahi.
- source_word: λέγοντες
  choice: Kata mereka
  rationale: Mengantar kutipan secara alami dalam bahasa Indonesia tanpa mengubah hubungan tindakan dalam teks.
- source_word: Εἴδομεν
  choice: kita telah menyaksikan
  rationale: Bentuk aoris menyatakan peristiwa yang baru terjadi dan kini mereka tanggapi. 'Telah menyaksikan' menonjolkan pengalaman langsung mereka.
- source_word: παράδοξα
  choice: hal-hal yang luar biasa
  rationale: Kata ini menunjuk pada hal-hal yang melampaui dugaan biasa. Padanan ini alami dan tidak memberi kesan negatif seperti 'aneh'.
- source_word: σήμερον
  choice: Hari ini
  rationale: Padanan langsung yang mempertahankan kesegeraan kesaksian mereka.
theological_decisions:
- issue: Nuansa φόβος sebagai tanggapan terhadap tindakan ilahi
  choice: rasa takut
  alternative: rasa kagum; rasa gentar
  rationale: Terjemahan langsung 'rasa takut' mempertahankan ketegangan antara ketakutan dan penyembahan, tanpa mempersempitnya menjadi kekaguman saja.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat dipecah agar mudah dipahami tanpa menghilangkan kesinambungan tindakan. 'Allah' mengikuti pemakaian baku Alkitab bahasa Indonesia; 'kita' dipakai dalam kutipan sebagai bentuk inklusif yang alami karena para pembicara merujuk pada pengalaman bersama.
