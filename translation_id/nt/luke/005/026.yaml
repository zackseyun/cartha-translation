  source_fidelity: 'Terjemahan dengan tepat mencakup semua unsur utama: ketakjuban yang menguasai semua orang, pemuliaan kepada Allah, rasa takut, dan pengakuan bahwa mereka menyaksikan hal-hal luar biasa pada hari itu. Namun, «kita» dalam kutipan dapat secara pragmatis mengikutsertakan pembaca atau lawan bicara, sedangkan orang pertama jamak Yunani merujuk kepada para saksi yang berbicara. «Kami» lebih tepat.'
