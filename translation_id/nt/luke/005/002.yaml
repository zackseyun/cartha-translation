  source_fidelity: Teks Indonesia dengan tepat menyampaikan εἶδεν sebagai “melihat,” δύο πλοῖα sebagai “dua perahu,” lokasi statis ἑστῶτα παρὰ τὴν λίμνην sebagai “berada di tepi danau,” serta δράση imperfek ἔπλυνον sebagai “sedang mencuci.” Frasa “telah turun dari perahu-perahu itu” secara memadai menyatakan tindakan yang mendahului kegiatan mencuci dan mempertahankan acuan αὐτῶν kepada perahu-perahu tersebut.
