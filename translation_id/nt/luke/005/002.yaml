  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: id
  text: Ia melihat dua perahu berada di tepi danau, sedangkan para nelayan telah turun dari perahu-perahu itu dan sedang mencuci jala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: melihat
  rationale: Bentuk aoris ὁράω secara wajar diterjemahkan sebagai tindakan naratif sederhana, tanpa menambahkan nuansa khusus seperti 'memperhatikan'.
- source_word: δύο πλοῖα
  choice: dua perahu
  rationale: Dalam konteks penangkapan ikan di danau, 'perahu' merupakan padanan modern yang paling alami; 'kapal' memberi kesan sarana air yang lebih besar.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: berada di tepi danau
  rationale: Partisipel perfektum menggambarkan keadaan perahu yang tetap di suatu tempat. 'Berada' alami bagi benda mati dan tidak menambahkan gagasan bahwa perahu-perahu itu ditambatkan.
- source_word: οἱ δὲ ἁλιεῖς
  choice: sedangkan para nelayan
  rationale: δέ menandai peralihan dengan kontras ringan antara keadaan perahu dan kegiatan para nelayan; 'sedangkan' mempertahankan hubungan itu secara alami.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: telah turun dari perahu-perahu itu
  rationale: Partisipel aoris menunjukkan bahwa mereka turun lebih dahulu sebelum kegiatan mencuci jala. Rujukan pronomina dibuat eksplisit agar jelas dan alami dalam bahasa Indonesia.
- source_word: ἔπλυνον
  choice: sedang mencuci
  rationale: Bentuk imperfek menggambarkan tindakan yang sedang berlangsung dalam latar adegan.
- source_word: τὰ δίκτυα
  choice: jala
  rationale: δίκτυα berarti jala atau jaring penangkap ikan. 'Jala' ringkas dan wajar dalam konteks nelayan, tanpa menambahkan kata milik 'mereka' yang tidak dinyatakan dalam bahasa Yunani.
