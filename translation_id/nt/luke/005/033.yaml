  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: id
  text: Lalu mereka berkata kepada-Nya, “Murid-murid Yohanes sering berpuasa dan memanjatkan doa; demikian juga murid-murid para Farisi, tetapi murid-murid-Mu makan dan minum.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Lalu mereka berkata kepada-Nya
  rationale: δέ merupakan penghubung ringan dalam alur narasi; “lalu” alami dalam bahasa Indonesia tanpa memberi tekanan pertentangan yang berlebihan.
- source_word: μαθηταὶ Ἰωάννου
  choice: murid-murid Yohanes
  rationale: Genitif menyatakan hubungan dengan Yohanes dan secara alami diterjemahkan dengan susunan ini.
- source_word: νηστεύουσιν πυκνά
  choice: sering berpuasa
  rationale: πυκνά berfungsi sebagai keterangan frekuensi; “sering” menyampaikan kebiasaan yang berulang secara lugas.
- source_word: δεήσεις ποιοῦνται
  choice: memanjatkan doa
  rationale: Ungkapan ini mempertahankan unsur nominal δεήσεις dan menyampaikan tindakan devosional dengan bahasa Indonesia yang alami serta bermartabat.
- source_word: ὁμοίως καὶ
  choice: demikian juga
  rationale: Ungkapan ini mewakili kesamaan sekaligus unsur penambahan tanpa terasa janggal dalam bahasa Indonesia.
- source_word: οἱ τῶν Φαρισαίων
  choice: murid-murid orang Farisi
  rationale: Bahasa Yunani menghilangkan kata “murid-murid”, tetapi bahasa Indonesia memerlukannya agar rujukan jelas dan kalimat tidak terasa ganjil; kata itu dipahami dari klausa sebelumnya.
- source_word: οἱ δὲ σοὶ
  choice: tetapi murid-murid-Mu
  rationale: σοί bersifat eliptis dan berarti mereka yang menjadi murid Yesus; penyebutan eksplisit menghasilkan bahasa Indonesia yang jelas serta mempertahankan kontras.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: makan dan minum
  rationale: Bentuk kini menggambarkan kebiasaan umum yang dikontraskan dengan berpuasa; bentuk sederhana bahasa Indonesia tepat untuk fungsi ini.
theological_decisions:
- issue: Apakah kata “murid-murid” perlu ditambahkan dalam klausa kedua dan ketiga
  choice: Menyebut “murid-murid” secara eksplisit dalam kedua klausa
  alternative: Mempertahankan elipsis secara harfiah sebagai “mereka yang dari orang Farisi” dan “milik-Mu”
  rationale: Elipsis Yunani jelas merujuk kembali kepada μαθηταί. Dalam bahasa Indonesia, bentuk harfiah akan kabur atau tidak alami, sedangkan penyebutan kata yang tersirat tidak mengubah makna maupun menyelesaikan ketegangan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kepada-Nya” dan “murid-murid-Mu” mengikuti kebiasaan ortografis Alkitab Indonesia untuk rujukan kepada Yesus. Tidak diperlukan catatan kaki karena elipsis Yunani dapat diungkapkan secara jelas dalam teks tanpa menimbulkan alternatif makna yang substantif.
