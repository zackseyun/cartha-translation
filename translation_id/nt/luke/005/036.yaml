  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: id
  text: 'Ia juga menyampaikan perumpamaan kepada mereka: “Tidak seorang pun merobek kain penambal dari pakaian baru lalu memasangnya pada pakaian lama.[a] Kalau tidak, ia akan merobek pakaian yang baru itu, dan kain penambal dari pakaian baru itu tidak akan cocok dengan pakaian yang lama.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Tidak seorang pun, setelah merobek kain penambal dari pakaian baru, menaruhnya pada pakaian lama.” Bahasa Yunani memakai partisip aoris (“setelah merobek”) sebelum verba utama.'
    reason: lexical_alternative
  - marker: b
    text: “Tidak akan cocok” juga dapat diterjemahkan “tidak akan sesuai” atau “tidak akan serasi.” Verba Yunani di sini menyatakan tidak adanya kesesuaian antara kain penambal dan pakaian lama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Ia juga menyampaikan
  rationale: Bentuk imperfek ἔλεγεν dapat menggambarkan tindakan bertutur yang sedang berlangsung dalam narasi. 'Menyampaikan' alami dengan objek 'perumpamaan', sedangkan 'juga' mencerminkan καὶ bersama penghubung δέ.
- source_word: παραβολὴν
  choice: perumpamaan
  rationale: '''Perumpamaan'' merupakan istilah baku dan mudah dipahami untuk παραβολή serta mempertahankan kategori sastra yang digunakan Lukas.'
- source_word: ἐπίβλημα
  choice: kain penambal
  rationale: Dalam konteks pakaian, kata ini menunjuk pada sepotong bahan yang dipakai sebagai tambalan. 'Kain penambal' lebih jelas daripada sekadar 'tambalan', karena benda itu diambil dari pakaian baru.
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: dari pakaian baru
  rationale: ἱμάτιον di sini dapat menunjuk secara umum pada pakaian; 'pakaian' alami dan tidak mempersempitnya menjadi jenis pakaian tertentu.
- source_word: σχίσας ... ἐπιβάλλει
  choice: merobek ... lalu menambalkannya
  rationale: Partisip aoris σχίσας menyatakan tindakan yang mendahului verba utama. 'Lalu' mempertahankan urutan itu secara alami. Dalam konteks kain penambal, 'menambalkannya pada' mengungkapkan fungsi tindakan ἐπιβάλλει tanpa menentukan secara eksplisit bahwa kain itu dijahit.
- source_word: εἰ δὲ μήγε
  choice: Jika ia melakukannya
  rationale: Ungkapan ini memperkenalkan akibat apabila tindakan yang baru disebut benar-benar dilakukan. Bentuk eksplisit ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'jika tidak'.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: ia akan merobek pakaian yang baru itu
  rationale: Verba aktif futurum memiliki subjek manusia yang tersirat dari 'tidak seorang pun'. Terjemahan ini mempertahankan bahwa orang tersebut merusak pakaian baru dengan mengambil kain darinya.
- source_word: οὐ συμφωνήσει
  choice: tidak akan cocok
  rationale: συμφωνέω di sini menyatakan ketidaksesuaian atau ketidakserasian antara kain penambal dan pakaian lama. 'Tidak cocok' mempertahankan keluasan makna itu secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pronomina 'ia' dipakai sesuai register Alkitab Indonesia. Pengulangan 'pakaian baru/lama' dipertahankan demi kejelasan rujukan.
