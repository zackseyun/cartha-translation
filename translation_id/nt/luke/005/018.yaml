  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: id
  text: Lihatlah, beberapa orang laki-laki sedang membawa seorang laki-laki yang lumpuh di atas sebuah tempat tidur[a]. Mereka berusaha membawanya masuk dan menempatkannya di hadapannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipan” atau “tandu”; kata Yunani κλίνη dapat menunjuk pada tempat tidur, dipan, atau alas berbaring.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, di hadapan Yesus.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan fungsi partikel sebagai penarik perhatian dan kejelasan hidup dalam narasi, dengan ungkapan Indonesia yang tetap mudah dipahami.
- source_word: ἄνδρες
  choice: beberapa orang laki-laki
  rationale: ἀνήρ menunjuk kepada laki-laki dewasa; 'beberapa' membuat konstruksi tak tentu ini alami dalam bahasa Indonesia tanpa menentukan jumlah.
- source_word: φέροντες
  choice: sedang mengusung
  rationale: Bentuk partisipel kini menggambarkan tindakan yang sedang berlangsung; 'mengusung' secara alami menyatakan bahwa orang itu dibawa di atas pembaringan.
- source_word: ἐπὶ κλίνης
  choice: di atas sebuah pembaringan
  rationale: κλίνη dapat berarti tempat tidur, dipan, atau alas berbaring yang dapat digunakan untuk membawa seseorang. 'Pembaringan' mempertahankan keluasan makna itu tanpa secara khusus menetapkannya sebagai tandu.
- source_word: ἄνθρωπον ὃς ἦν παραλελυμένος
  choice: seorang laki-laki yang lumpuh
  rationale: Konteks merujuk kepada seorang individu laki-laki, sedangkan bentuk perfektif παραλελυμένος menyatakan keadaan lumpuh yang telah berlangsung.
- source_word: ἐζήτουν
  choice: Mereka berusaha
  rationale: Bentuk imperfek menyatakan upaya yang sedang atau terus dilakukan; 'berusaha' lebih alami daripada padanan harfiah 'mencari' dalam konteks ini.
- source_word: εἰσενεγκεῖν
  choice: membawanya masuk
  rationale: Menyampaikan arah ke dalam yang terkandung dalam εἰσφέρω tanpa mengulang cara membawanya yang sudah jelas dari konteks.
- source_word: θεῖναι
  choice: menempatkannya
  rationale: τίθημι di sini berarti menaruh atau menempatkan. Pilihan ini tidak menambahkan posisi tubuh yang tidak dinyatakan secara eksplisit.
- source_word: ἐνώπιον αὐτοῦ
  choice: di hadapannya
  rationale: Mempertahankan pronomina sumber dan arti relasional 'di hadapan', sementara catatan menjelaskan rujukannya yang paling mungkin.
theological_decisions:
- issue: Rujukan αὐτοῦ pada akhir ayat
  choice: di hadapannya
  alternative: di hadapan Yesus
  rationale: Konteks menunjukkan bahwa pronomina itu merujuk kepada Yesus, tetapi teks Yunani memakai pronomina, bukan nama. Terjemahan utama mempertahankan bentuk tersebut dan catatan menjelaskan rujukannya tanpa mengganti teks secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ayat dibagi menjadi dua kalimat agar hubungan pelaku dan tindakannya alami dalam bahasa Indonesia. Huruf kecil pada '-nya' mempertahankan bentuk pronominal sumber tanpa memasukkan konvensi kapitalisasi teologis.
