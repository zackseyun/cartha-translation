  to: Tidak seorang pun memasukkan anggur baru ke dalam kantong-kantong kulit tua.[a] Kalau tidak, anggur baru itu akan merobek kantong-kantong itu, lalu anggur itu akan tertumpah dan kantong-kantong itu akan rusak.
