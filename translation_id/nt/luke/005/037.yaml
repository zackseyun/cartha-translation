base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: id
  text: Tidak seorang pun memasukkan anggur baru ke dalam kantong-kantong kulit tua.[a] Kalau tidak, anggur baru itu akan merobek kantong-kantong itu, lalu anggur itu akan tertumpah dan kantong-kantong itu akan rusak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kulit-kulit tua.” Kata Yunani yang dipakai menunjuk pada wadah dari kulit, yang antara lain digunakan untuk menyimpan anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: memasukkan
  rationale: Kata kerja ini secara umum berarti menaruh atau menempatkan. Dalam konteks cairan dan wadah, “memasukkan” terdengar alami tanpa mempersempit maknanya menjadi tindakan menuang.
- source_word: οἶνον νέον
  choice: anggur baru
  rationale: Padanan langsung dan lazim yang mempertahankan gambaran anggur baru dalam konteks fermentasi.
- source_word: ἀσκοὺς παλαιούς
  choice: kantong kulit yang sudah tua
  rationale: ἀσκός adalah wadah dari kulit untuk menyimpan cairan. Ungkapan ini menjelaskan bentuk wadahnya bagi pembaca modern, sedangkan “sudah tua” menandakan kondisi wadah yang telah menua.
- source_word: εἰ δὲ μήγε
  choice: Jika dilakukan
  rationale: Idiom bersyarat ini menyatakan akibat apabila tindakan yang baru disebut tetap dilakukan. Pilihan ini membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: ῥήξει
  choice: akan merobek
  rationale: Bentuk transitif ini menyatakan bahwa anggur baru menyebabkan kantong kulit terbelah atau robek. “Merobek” sesuai dengan bahan wadah tersebut dan mempertahankan hubungan sebab-akibat.
- source_word: ἐκχυθήσεται
  choice: akan tertumpah
  rationale: Bentuk pasif ini menggambarkan anggur yang keluar dan terbuang akibat wadah robek. “Tertumpah” menyampaikan akibat yang tidak disengaja secara alami.
- source_word: ἀπολοῦνται
  choice: akan rusak
  rationale: Untuk benda berupa wadah, “rusak” menyatakan bahwa kantong-kantong itu binasa dalam arti kehilangan kegunaan, tanpa memberi kesan bahwa benda tersebut lenyap sama sekali.
- source_word: καὶ αὐτός
  choice: lalu anggurnya
  rationale: Kata ganti tersebut kembali kepada anggur baru. Penyebutan “anggurnya” menghindari ketidakjelasan dalam bahasa Indonesia, sementara alur kalimat tetap membawa penekanan pada anggur itu.
- source_word: οὐδεὶς
  choice: Tidak seorang pun
  rationale: Padanan baku yang jelas dan sesuai dengan nada peribahasa dalam perkataan ini.
