  terminology: “Anggur baru” mempertahankan istilah dan citra sumber tanpa penafsiran tambahan. “Kantong kulit” merupakan padanan jelas untuk ἀσκός; catatan kaki yang menjelaskan bahwa ini ialah wadah kulit sudah memadai. “Rusak” cocok untuk ἀπολοῦνται dalam konteks wadah.
