  text: But new wine must be put into fresh wineskins[a].
translation:
  language: id
  text: Tetapi anggur baru harus dimasukkan ke dalam kantong kulit yang masih baru[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan, “anggur baru harus dimasukkan ke dalam kantong kulit baru.” Bahasa Yunani memakai dua kata sifat yang berbeda: νέος (“baru,” terutama dari segi waktu) untuk anggur dan καινός (“baru,” terutama dari segi mutu atau kondisi) untuk kantong kulit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Tetapi
  rationale: Kata penghubung ini menyatakan pertentangan dengan tindakan yang tidak tepat pada ayat sebelumnya; “Tetapi” alami dan jelas dalam bahasa Indonesia.
- source_word: οἶνον νέον
  choice: anggur baru
  rationale: νέον menerangkan anggur dan terutama menyatakan kebaruan dari segi waktu; “anggur baru” merupakan padanan alami dalam konteks ini.
- source_word: εἰς
  choice: ke dalam
  rationale: Preposisi ini menunjukkan gerak menuju bagian dalam suatu wadah, sehingga “ke dalam” lebih tepat daripada bentuk statis “di dalam”.
- source_word: ἀσκοὺς
  choice: kantong kulit
  rationale: ἀσκός adalah wadah dari kulit yang digunakan untuk menyimpan cairan seperti anggur. “Kantong kulit” menjelaskan benda budaya tersebut tanpa menambahkan bahan yang tidak disebutkan secara khusus.
- source_word: καινοὺς
  choice: yang masih baru
  rationale: καινός menekankan keadaan yang baru atau belum usang. Ungkapan “yang masih baru” terdengar alami untuk kantong kulit dan sedikit menonjolkan kondisinya, walaupun bahasa Indonesia tidak dapat membedakan kedua kata Yunani untuk “baru” secara ringkas.
- source_word: βλητέον
  choice: harus dimasukkan
  rationale: Bentuk verbal ini menyatakan keharusan secara impersonal. “Harus dimasukkan” menyampaikan makna tersebut dengan jelas dan wajar.
theological_decisions:
- issue: Pembedaan antara νέος dan καινός dalam satu kalimat
  choice: Menerjemahkan νέος sebagai “baru” dan καινός sebagai “yang masih baru”
  alternative: Menerjemahkan keduanya hanya sebagai “baru”
  rationale: Teks Yunani memakai dua kata sifat berbeda. Bahasa Indonesia tidak memiliki dua padanan singkat yang sama alaminya dalam konteks ini; “yang masih baru” memberi sedikit penekanan pada kondisi kantong kulit, sedangkan catatan kaki mempertahankan pembedaan leksikal tanpa memaksakan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. Istilah “kantong kulit” dipilih agar benda budaya itu mudah dipahami; perbedaan halus antara kedua kata Yunani untuk “baru” dijelaskan dalam catatan kaki.
