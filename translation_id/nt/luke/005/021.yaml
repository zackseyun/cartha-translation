  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: id
  text: Lalu ahli-ahli Taurat dan orang-orang Farisi mulai berpikir-pikir dan berkata, “Siapakah dia ini yang mengucapkan hujatan? Siapakah yang dapat mengampuni dosa kecuali Allah saja?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: mulai berpikir-pikir
  rationale: ἤρξαντο dengan infinitif menyatakan permulaan tindakan. διαλογίζεσθαι dapat mencakup penalaran batin, pertimbangan, atau perbincangan; “berpikir-pikir” mempertahankan keluasan itu tanpa memastikan bahwa prosesnya hanya batiniah atau sepenuhnya berupa diskusi lisan.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Dalam konteks Injil, istilah ini menunjuk kepada para pakar dan penafsir hukum Taurat. “Ahli-ahli Taurat” merupakan padanan Indonesia yang baku dan lebih jelas daripada terjemahan harfiah “juru-juru tulis”.
- source_word: Φαρισαῖοι
  choice: orang-orang Farisi
  rationale: Nama kelompok ini ditransliterasikan menurut bentuk yang sudah mapan dalam bahasa Indonesia.
- source_word: λαλεῖ βλασφημίας
  choice: mengucapkan hujatan-hujatan
  rationale: Bentuk jamak βλασφημίας dipertahankan untuk menyampaikan bahwa para penentang menilai perkataan-perkataan itu sebagai ucapan hujat, bukan sekadar konsep abstrak penghujatan.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: mengampuni dosa-dosa
  rationale: ἀφίημι bersama ἁμαρτίας merupakan ungkapan lazim untuk pengampunan dosa. Bentuk jamak Yunani dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: selain Allah saja
  rationale: Ungkapan ini menyatakan pengecualian yang tegas. “Selain Allah saja” mempertahankan eksklusivitas μόνος dengan susunan Indonesia yang ringkas.
- source_word: Τίς ἐστιν οὗτος
  choice: Siapakah dia ini
  rationale: Pilihan ini mempertahankan kata tunjuk οὗτος serta nada pertanyaan yang tajam tanpa menambahkan kata “manusia” atau kesimpulan penafsiran lain.
theological_decisions:
- issue: Implikasi kewenangan Yesus untuk mengampuni dosa
  choice: 'Keberatan para ahli Taurat dan orang Farisi diterjemahkan secara langsung: hanya Allah yang dapat mengampuni dosa.'
  alternative: Melunakkan klaim eksklusif itu atau menambahkan kesimpulan kristologis secara eksplisit.
  rationale: Ayat ini sengaja menghadirkan ketegangan teologis dalam alur Lukas. Terjemahan mempertahankan klaim para penentang dan implikasinya, tetapi tidak menyisipkan kesimpulan yang belum dinyatakan langsung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk ulang dipakai untuk mempertahankan nuansa proses pada “berpikir-pikir” serta jamak pada “hujatan-hujatan” dan “dosa-dosa”. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang harus dijelaskan kepada pembaca pada ayat ini.
