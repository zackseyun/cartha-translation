id: LUK.5.17
reference: Luke 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: id
  text: Pada suatu hari, ketika Yesus sedang mengajar, beberapa orang Farisi dan pengajar Taurat duduk di sana. Mereka datang dari setiap desa di Galilea dan Yudea, juga dari Yerusalem. Kuasa Tuhan menyertai Yesus untuk menyembuhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “untuk menyembuhkan mereka.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Pada suatu hari
  rationale: Ungkapan naratif khas Lukas ini dialihkan secara alami dan ringkas dalam bahasa Indonesia tanpa mempertahankan bentuk harfiah yang kaku.
- source_word: αὐτὸς ἦν διδάσκων
  choice: ketika Yesus sedang mengajar
  rationale: Konstruksi perifrastik menunjukkan kegiatan yang sedang berlangsung. Nama Yesus dipakai untuk memperjelas rujukan pronomina dalam ayat yang berdiri sendiri.
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: beberapa orang Farisi dan pengajar Taurat
  rationale: “Orang Farisi” adalah sebutan baku, sedangkan “pengajar Taurat” menyampaikan arti nomodidaskaloi secara langsung. “Beberapa” membuat konstruksi tanpa artikel terdengar wajar, tanpa bermaksud menentukan jumlah secara tepat.
- source_word: καθήμενοι
  choice: duduk di sana
  rationale: Menggambarkan keberadaan mereka yang telah mengambil tempat dalam suasana pengajaran secara alami.
- source_word: ἐληλυθότες
  choice: Mereka datang
  rationale: Partisip perfek menunjukkan kedatangan sebelumnya dengan hasil bahwa mereka kini hadir; dalam narasi Indonesia, “datang” sudah menyampaikan hubungan itu secara wajar.
- source_word: ἐκ πάσης κώμης
  choice: dari setiap desa
  rationale: Mempertahankan daya distributif pasēs dan arti kōmē sebagai desa atau permukiman kecil.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: di Galilea dan Yudea, juga dari Yerusalem
  rationale: Preposisi dan “juga” memperjelas bahwa Galilea dan Yudea adalah wilayah, sedangkan Yerusalem adalah kota, tanpa mengubah cakupan sumber.
- source_word: δύναμις κυρίου
  choice: Kuasa Tuhan
  rationale: Mempertahankan bobot teologis dynamis dan menerjemahkan kyrios dengan sebutan baku “Tuhan”.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: menyertai Yesus untuk menyembuhkan
  rationale: Ungkapan ini menyampaikan bahwa kuasa Tuhan hadir bersama Yesus bagi tindakan penyembuhan. Nama Yesus memperjelas rujukan auton, sementara objek penyembuhan tidak ditambahkan ke teks utama.
theological_decisions:
- issue: Rujukan dan makna δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Kuasa Tuhan menyertai Yesus untuk menyembuhkan
  alternative: Kuasa Tuhan hadir untuk menyembuhkan mereka
  rationale: Teks SBLGNT yang diberikan memuat αὐτόν, bukan bentuk jamak αὐτούς. Karena itu teks utama tidak memasukkan objek “mereka”. Terjemahan tetap membiarkan kuasa ilahi tampil sebagai kuasa yang bekerja dalam pelayanan penyembuhan Yesus tanpa merumuskan klaim teologis lebih jauh daripada sintaksnya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kalimat panjang Yunani dipecah agar mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan pada klausa yang memiliki varian tekstual.
