review_pass:
  verdict: revise
  source_fidelity: Klausa terakhir perlu direvisi. Dalam teks SBLGNT yang diberikan, αὐτόν secara gramatikal adalah objek infinitif ἰᾶσθαι (“menyembuhkan dia”), bukan subjek tersirat yang melakukan penyembuhan. Terjemahan draf “Kuasa Tuhan menyertai Yesus untuk menyembuhkan” mengubah fungsi αὐτόν dan menambahkan gagasan bahwa kuasa itu “menyertai” Yesus. Selain itu, “beberapa” tidak dinyatakan oleh teks Yunani.
  naturalness: Bahasa draf pada umumnya alami. Revisi mempertahankan gaya baku modern sambil menghubungkan kedatangan para tokoh itu dengan keadaan mereka sedang duduk, sebagaimana dilakukan partisip perfektum Yunani.
  terminology: “Orang Farisi,” “pengajar Taurat,” dan “Kuasa Tuhan” sesuai register dan terminologi yang lazim. “Orang-orang Farisi” tanpa “beberapa” menyampaikan bentuk jamak tak tentu tanpa menambahkan pembatas jumlah.
  issues:
  - severity: high
    issue: Fungsi αὐτόν pada klausa terakhir diubah.
    rationale: Dalam bacaan SBLGNT, αὐτόν adalah akusatif setelah infinitif ἰᾶσθαι dan paling langsung diterjemahkan “menyembuhkan dia.” Draf menjadikannya Yesus sebagai pelaku (“Yesus ... menyembuhkan”), sehingga tidak mempertahankan sintaks bacaan yang ditetapkan. Karena klausa ini sulit dan pembaca dapat mempertanyakan rujukannya, terjemahan literal dipertahankan tanpa menyelesaikan ambiguitasnya secara doktrinal.
  - severity: medium
    issue: “Beberapa” menambahkan pembatas jumlah yang tidak ada dalam teks.
    rationale: Nomina jamak tanpa artikel dalam konteks ini tidak mengharuskan arti “beberapa.” Bentuk jamak tak tentu Indonesia sudah cukup.
  - severity: low
    issue: Hubungan perfektum ἐληλυθότες dengan para tokoh yang duduk kurang tampak.
    rationale: “Mereka datang” dapat dipahami sebagai peristiwa berikutnya. “Yang telah datang” mempertahankan bahwa mereka sudah tiba dan kini hadir di tempat itu.
  revised_text: Pada suatu hari, ketika Yesus sedang mengajar, orang-orang Farisi dan pengajar Taurat sedang duduk di sana; mereka telah datang dari setiap desa di Galilea dan Yudea, serta dari Yerusalem. Kuasa Tuhan ada di sana untuk menyembuhkan dia.[a]
  revised_footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi, “untuk menyembuhkan mereka.”
    reason: textual_variant
  revision_rationale: Revisi menghapus tambahan “beberapa,” menautkan “telah datang” kepada para orang Farisi dan pengajar Taurat, serta menerjemahkan αὐτόν sebagai objek “dia.” Klausa terakhir sengaja mempertahankan ketidaklaziman dan kemungkinan ambiguitas bacaan SBLGNT, alih-alih mengubahnya menjadi klaim bahwa Yesus adalah pelaku penyembuhan. Catatan varian tetap ditempatkan pada klausa terkait.
