  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: id
  text: Yesus menjawab mereka, “Bukan orang sehat yang memerlukan dokter, melainkan orang sakit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Yesus menjawab mereka
  rationale: Gabungan partisip ἀποκριθείς dengan εἶπεν merupakan rumusan naratif yang secara alami dapat diterjemahkan dengan satu verba responsif. Ungkapan ini mempertahankan Yesus sebagai subjek dan αὐτούς sebagai pihak yang dijawab tanpa menghasilkan susunan kaku ‘sambil menjawab, berkata kepada mereka’.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Bukan ... yang memerlukan
  rationale: Konstruksi perbandingan ‘bukan ... melainkan ...’ menyampaikan penyangkalan οὐ dan kebutuhan χρείαν ἔχουσιν secara alami dalam bahasa Indonesia serta mengantisipasi ἀλλά pada klausa berikutnya.
- source_word: οἱ ὑγιαίνοντες
  choice: orang sehat
  rationale: Partisip substantival ini menunjuk pada golongan orang yang berada dalam keadaan sehat. ‘Orang sehat’ ringkas, alami, dan jelas dalam bahasa Indonesia modern.
- source_word: ἰατροῦ
  choice: tabib
  rationale: Ἰατρός berarti dokter atau orang yang mengobati. ‘Tabib’ mempertahankan warna dunia kuno dan nada pepatah, namun tetap dikenal luas; ‘dokter’ merupakan alternatif yang lebih kontemporer.
- source_word: οἱ κακῶς ἔχοντες
  choice: orang sakit
  rationale: Ungkapan idiomatis κακῶς ἔχειν berarti berada dalam keadaan sakit. ‘Orang sakit’ menyampaikan maknanya secara langsung dan alami, bukan menerjemahkan idiom tersebut secara harfiah sebagai ‘orang yang keadaannya buruk’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bernada pepatah. Kontras οὐ ... ἀλλά diwujudkan secara idiomatis sebagai ‘bukan ... melainkan ...’. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa Indonesia.
