  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: id
  text: Setelah melakukan hal itu, mereka menjaring banyak sekali ikan, dan jala-jala mereka mulai koyak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka mengurung banyak sekali ikan di dalam jala, dan jala-jala mereka sedang koyak.” Verba Yunani untuk “menjaring” secara harfiah menggambarkan ikan yang dikepung atau terkurung, sedangkan bentuk imperfek untuk “koyak” menggambarkan proses yang sedang berlangsung, bukan keadaan yang sudah selesai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Setelah melakukannya
  rationale: Partisip aoristus menyatakan tindakan yang mendahului verba utama. Bentuk ini menyampaikan urutannya secara alami dalam bahasa Indonesia dan mempertahankan rujukan 'ini' dari konteks sebelumnya secara implisit dalam enklitik -nya.
- source_word: συνέκλεισαν
  choice: mereka menjaring
  rationale: Verba ini secara harfiah menggambarkan tindakan mengurung atau mengepung. Dalam konteks ikan dan jala, 'menjaring' merupakan ungkapan Indonesia yang alami dan tetap membayangkan ikan terkurung di dalam jala.
- source_word: πλῆθος ἰχθύων πολύ
  choice: sejumlah besar ikan
  rationale: Frasa ini menekankan banyaknya ikan. 'Sejumlah besar ikan' mempertahankan penekanan kuantitas tanpa terdengar kaku.
- source_word: διερρήσσετο
  choice: mulai koyak
  rationale: Imperfek menggambarkan proses yang sedang berlangsung, bukan hasil koyak yang sudah tuntas. 'Mulai koyak' mengungkapkan bahwa jala-jala sedang mengalami kerusakan akibat tekanan.
- source_word: τὰ δίκτυα αὐτῶν
  choice: jala-jala mereka
  rationale: Bentuk ulang mempertahankan jamak eksplisit dalam bahasa Yunani, sedangkan pronomina posesif diterjemahkan secara idiomatis.
