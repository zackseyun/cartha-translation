source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: id
  text: Lalu Ia mengulurkan tangan dan menyentuh orang itu sambil berkata, “Aku mau. Jadilah tahir!” Seketika itu juga kustanya[a] lenyap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dalam arti yang lebih luas, “penyakit kulit”. Dalam pemakaian Alkitab, istilah Yunani lepra dapat merujuk pada berbagai penyakit kulit yang serius, bukan hanya penyakit kusta (penyakit Hansen) dalam pengertian modern.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: mengulurkan tangan
  rationale: Mengungkapkan tindakan fisik yang mendahului tindakan menyentuh secara alami dalam bahasa Indonesia, tanpa menambahkan objek yang tidak ada dalam teks Yunani.
- source_word: ἥψατο αὐτοῦ
  choice: menyentuh orang itu
  rationale: Bentuk Yunani memakai objek genitif, tetapi bahasa Indonesia secara wajar memakai objek langsung. 'Orang itu' memperjelas rujukan tanpa mengulang kata ganti secara kaku.
- source_word: εἰπών
  choice: sambil berkata
  rationale: Mempertahankan hubungan partisipial dengan tindakan utama dan menghasilkan alur kalimat Indonesia yang alami.
- source_word: Θέλω
  choice: Aku mau
  rationale: Menyatakan kemauan dan kesediaan Yesus secara langsung. Pilihan ini singkat, wajar, dan tidak mengubahnya menjadi sekadar pernyataan tentang masa depan.
- source_word: καθαρίσθητι
  choice: Jadilah tahir
  rationale: Mempertahankan bentuk perintah pasif serta dimensi ketahiran yang mencakup lebih dari kesembuhan medis semata.
- source_word: εὐθέως
  choice: Seketika itu juga
  rationale: Ungkapan Indonesia yang jelas dan kuat untuk tindakan yang terjadi segera.
- source_word: ἡ λέπρα
  choice: penyakit kustanya
  rationale: Memakai istilah tradisional yang mudah dikenali, dengan catatan kaki untuk menjelaskan bahwa cakupan istilah kunonya lebih luas daripada penyakit Hansen modern.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: lenyap
  rationale: Secara idiomatis menyampaikan bahwa penyakit itu meninggalkan orang tersebut sepenuhnya, tanpa personifikasi yang terasa kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna καθαρίσθητι dalam penyembuhan orang yang berpenyakit kulit
  choice: Jadilah tahir
  alternative: Sembuhlah; jadilah bersih
  rationale: Kata Yunani menonjolkan pentahiran, yang dalam konteks ini mencakup kesembuhan jasmani sekaligus pemulihan dari keadaan najis secara ritual dan sosial. 'Jadilah tahir' menjaga dimensi-dimensi itu tanpa mereduksinya menjadi kesembuhan medis saja.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan langsung memakai 'Aku' sesuai tuturan orang pertama. Huruf kapital pada 'Ia' mengikuti kebiasaan penulisan rujukan kepada Yesus, sementara unsur yang tidak dinyatakan dalam teks Yunani tidak ditambahkan. Penanda catatan kaki ditempatkan sesudah 'penyakit kustanya', yakni pada istilah yang dijelaskan.
