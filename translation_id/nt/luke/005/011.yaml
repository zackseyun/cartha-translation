  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: id
  text: Setelah membawa perahu-perahu itu ke darat, mereka meninggalkan segala sesuatu dan mengikuti Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: setelah menarik
  rationale: Partisipel aoris ini menyatakan tindakan yang mendahului verba utama. Dalam konteks perahu yang dibawa ke darat, 'setelah menarik' alami dalam bahasa Indonesia dan tidak menambahkan cara yang terlalu spesifik.
- source_word: τὰ πλοῖα
  choice: perahu-perahu itu
  rationale: Dalam konteks penangkapan ikan di Danau Galilea, 'perahu' lebih tepat dan alami daripada 'kapal'; bentuk ulang menyampaikan jamak.
- source_word: ἐπὶ τὴν γῆν
  choice: ke darat
  rationale: Ungkapan ini secara harfiah menunjuk gerak menuju atau ke atas tanah. 'Ke darat' merupakan padanan Indonesia yang idiomatis tanpa mempersempitnya menjadi 'ke pantai'.
- source_word: ἀφέντες
  choice: meninggalkan
  rationale: Partisipel aoris dari ἀφίημι di sini berarti meninggalkan. Rangkaian verba Indonesia mempertahankan urutan tindakan dengan jelas.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Bentuk netral jamak ini bersifat menyeluruh. 'Segala sesuatu' mempertahankan cakupan total tanpa menentukan lebih jauh apa saja yang ditinggalkan.
- source_word: ἠκολούθησαν αὐτῷ
  choice: mengikuti Dia
  rationale: Padanan ini mempertahankan tindakan mengikuti secara nyata sekaligus implikasi pemuridan yang terdapat dalam konteks, tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Cakupan pelepasan dalam πάντα
  choice: meninggalkan segala sesuatu
  alternative: meninggalkan semuanya
  rationale: Terjemahan ini mempertahankan sifat menyeluruh dari pernyataan tersebut tanpa menyimpulkan apakah semua milik dilepaskan secara permanen atau merinci hal-hal yang tidak disebutkan teks.
translation_notes:
  register: 'Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat mempertahankan urutan tiga tindakan: membawa perahu ke darat, meninggalkan segala sesuatu, lalu mengikuti Yesus. Huruf kapital pada ''Dia'' mengikuti kebiasaan penghormatan yang lazim dalam penerbitan Alkitab Indonesia, tanpa menambah isi pada teks sumber.'
