  source_fidelity: Partisipel καταγαγόντες menyatakan tindakan membawa perahu-perahu itu ke darat sebelum tindakan utama. Kata "menarik" dapat cocok secara kontekstual, tetapi menambahkan cara—yakni menyeret atau menarik—yang tidak dinyatakan secara khusus oleh kata Yunani. "Membawa ... ke darat" mempertahankan makna tanpa spesifikasi tambahan. Frasa "meninggalkan segala sesuatu dan mengikuti Dia" dengan tepat menyampaikan ἀφέντες πάντα ἠκολούθησαν αὐτῷ.
  naturalness: Kalimat revisi tetap baku, jelas, dan alami dalam bahasa Indonesia modern. Pengulangan "mereka" setelah klausa awal membantu kelancaran pembacaan tanpa mengubah hubungan antarpartisipel dan verba utama.
  terminology: '"Perahu-perahu" sesuai dengan konteks penangkapan ikan dan bentuk jamak τὰ πλοῖα. "Segala sesuatu" menjaga cakupan πάντα, sedangkan "mengikuti Dia" mempertahankan bahasa pemuridan tanpa penafsiran tambahan. Kapitalisasi "Dia" dapat dipertahankan sebagai konvensi penerbitan Indonesia.'
