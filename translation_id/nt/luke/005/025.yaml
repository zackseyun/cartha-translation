  - severity: low
    issue: “Lalu pulang ke rumahnya” untuk ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
    rationale: “Pulang” lazim, tetapi dapat menyiratkan kepulangan yang tidak secara khusus ditekankan oleh verba Yunani. “Pergi ke rumahnya” mempertahankan arah gerak tanpa tambahan nuansa.
  - severity: low
    issue: Frasa “alas tempat ia tadi berbaring”
    rationale: Struktur ini dapat terdengar seolah-olah “tempat” adalah nomina utama. “Alas yang tadi dipakainya untuk berbaring” lebih jelas menunjuk pada benda yang diangkat, sambil tetap tidak menentukan jenis bendanya.
  revised_text: Saat itu juga ia berdiri di hadapan mereka, mengangkat alas yang tadi dipakainya untuk berbaring,[a] lalu pergi ke rumahnya sambil memuliakan Allah.
