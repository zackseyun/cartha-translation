  source_fidelity: 'Terjemahan pada dasarnya setia pada rangkaian tindakan dalam teks Yunani: tindakan itu seketika, terjadi di hadapan orang-orang yang hadir, ia mengangkat benda yang menjadi alasnya, pergi ke rumahnya, dan memuliakan Allah. Namun, “bangkit” dapat terdengar lebih luas daripada tindakan fisik ἀναστὰς dalam konteks ini; “berdiri” menyatakan tindakan yang dimaksud dengan lebih langsung. “Pulang” juga sedikit menambahkan gagasan kembali ke tempat asal, sedangkan ἀπῆλθεν terutama menyatakan bahwa ia pergi.'
  naturalness: Bahasa draft umumnya alami dan berregister naratif baku. “Berdiri” lebih lazim dan jelas daripada “bangkit” dalam adegan seseorang yang sebelumnya berbaring. “Alas yang tadi dipakainya untuk berbaring” lebih idiomatis daripada “alas tempat ia tadi berbaring.”
  terminology: “Memuliakan Allah” adalah padanan yang baik untuk δοξάζων τὸν θεόν dan mempertahankan bahasa penghormatan kepada Allah. “Alas” dengan tepat tidak menspesifikkan benda itu sebagai tikar atau tempat tidur dalam teks utama. Catatan kaki tetap menyediakan alternatif “tikar” dan menjelaskan bentuk harfiahnya.
