id: LUK.5.25
reference: Luke 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: id
  text: Saat itu juga ia berdiri di hadapan mereka, mengangkat alas yang tadi dipakainya untuk berbaring,[a] lalu pergi ke rumahnya sambil memuliakan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tikar yang tadi menjadi alasnya”; secara harfiah, “yang di atasnya ia berbaring.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: saat itu juga
  rationale: Menunjukkan bahwa tindakan itu terjadi tanpa tertunda dan secara alami mempertahankan penekanan Lukas pada kesembuhan yang seketika.
- source_word: ἀναστὰς
  choice: ia bangkit
  rationale: Partisip aoris ini menyatakan tindakan pertama dalam rangkaian peristiwa. 'Bangkit' alami dalam narasi dan mencakup tindakan bangun dari posisi berbaring.
- source_word: ἐνώπιον αὐτῶν
  choice: di hadapan mereka
  rationale: Mempertahankan arti bahwa peristiwa itu berlangsung secara terbuka di depan orang-orang yang hadir tanpa menambahkan unsur 'di depan mata' yang tidak dinyatakan secara eksplisit.
- source_word: ἄρας
  choice: mengangkat
  rationale: Dalam konteks ini αἴρω berarti mengangkat lalu membawa benda yang sebelumnya menjadi alas berbaringnya.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: alas tempat ia tadi berbaring
  rationale: Bahasa Indonesia memerlukan ungkapan yang wajar. 'Alas' cukup umum untuk tidak memastikan apakah benda itu tikar atau tempat tidur, sementara 'tadi berbaring' menyampaikan keadaan sebelumnya.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: lalu pulang ke rumahnya
  rationale: Dalam konteks gerak menuju rumah miliknya sendiri, 'pulang ke rumahnya' merupakan padanan Indonesia yang alami bagi ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ dan tetap menunjukkan kepergiannya dari tempat itu.
- source_word: δοξάζων τὸν θεόν
  choice: sambil memuliakan Allah
  rationale: Konstruksi partisip menyatakan tindakan yang menyertai kepulangannya. 'Memuliakan Allah' mempertahankan cakupan bahasa penghormatan dalam δοξάζω, tidak mempersempitnya hanya menjadi pujian verbal.
theological_decisions:
- issue: Apakah benda yang dibawa perlu disebut secara khusus sebagai tikar atau tempat tidur
  choice: Menggunakan ungkapan umum 'alas tempat ia tadi berbaring' dalam teks utama.
  alternative: tikar yang tadi dipakainya untuk berbaring; tempat tidur yang tadi ditidurinya
  rationale: Bahasa Yunani ayat ini hanya memakai ungkapan relatif, secara harfiah 'yang di atasnya ia berbaring', tanpa menyebut nomina tikar atau tempat tidur. Terjemahan utama mempertahankan ketidakspesifikan itu, sedangkan catatan kaki memberi padanan yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya naratif yang alami dan bermartabat. Urutan tindakan dipertahankan dengan 'lalu', dan 'sambil' menunjukkan bahwa ia memuliakan Allah ketika pulang.
