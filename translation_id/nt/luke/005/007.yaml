  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: id
  text: Lalu mereka memberi isyarat kepada rekan-rekan mereka di perahu yang lain supaya datang membantu mereka. Mereka pun datang dan mengisi kedua perahu itu sampai perahu-perahu itu mulai tenggelam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατένευσαν
  choice: memberi isyarat
  rationale: Kata kerja ini menunjuk pada penyampaian tanda atau gerakan, mungkin dari kejauhan di atas air. 'Memberi isyarat' alami dalam bahasa Indonesia dan tidak menentukan bentuk gerakannya.
- source_word: μετόχοις
  choice: rekan-rekan
  rationale: Dalam konteks usaha penangkapan ikan, istilah ini menunjuk pada orang-orang yang turut bekerja atau bermitra. 'Rekan-rekan' jelas dan alami tanpa terlalu menekankan struktur bisnis formal.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: di perahu yang lain
  rationale: Ungkapan ini membedakan perahu lain yang terlibat dalam peristiwa tersebut. Terjemahan ini idiomatis dan mempertahankan acuan sumber.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: supaya datang membantu
  rationale: Konstruksi ini menyatakan tujuan, sedangkan συλλαβέσθαι dalam konteks ini berarti ikut menolong dalam pekerjaan. Bentuk Indonesia ini ringkas dan alami.
- source_word: ἔπλησαν
  choice: mengisi
  rationale: Kata ini secara langsung berarti 'memenuhi/mengisi'. Objek yang memenuhi perahu, yakni ikan, sudah jelas dari konteks dan tidak perlu ditambahkan.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: kedua perahu itu
  rationale: ἀμφότερα menegaskan bahwa dua-duanya terisi. 'Kedua perahu itu' merupakan padanan Indonesia yang lugas.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: sampai perahu-perahu itu mulai tenggelam
  rationale: Infinitif kini menggambarkan proses sebagai akibat dari penuhnya perahu. 'Mulai tenggelam' menyampaikan bahwa proses berlangsung tanpa menyatakan keduanya sudah tenggelam sepenuhnya; nomina diulangi agar rujukan pronomina tidak kabur.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Pilihan 'rekan-rekan' mempertahankan hubungan kerja tanpa memasukkan rincian yang tidak dinyatakan. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menghasilkan perbedaan makna penting dalam bahasa Indonesia.
