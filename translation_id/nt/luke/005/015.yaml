id: LUK.5.15
reference: Luke 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: id
  text: Namun, kabar tentang Dia semakin tersebar luas[a], dan banyak orang berbondong-bondong berkumpul untuk mendengarkan Dia dan disembuhkan dari penyakit mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berita tentang Dia” atau “perkataan tentang Dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: tersebar luas
  rationale: Bentuk imperfek menggambarkan penyebaran yang terus berlangsung; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa kabar itu beredar luas.
- source_word: μᾶλλον
  choice: semakin
  rationale: Menyatakan peningkatan dibandingkan keadaan sebelumnya secara ringkas dan idiomatis.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: kabar tentang Dia
  rationale: Dalam konteks narasi ini, λόγος menunjuk pada kabar yang beredar mengenai Yesus, bukan istilah teologis teknis. Kapitalisasi pronomina mengikuti register Alkitab Indonesia yang lazim tanpa menambah makna sumber.
- source_word: συνήρχοντο
  choice: berbondong-bondong berkumpul
  rationale: Bentuk imperfek menunjukkan tindakan yang berlangsung atau berulang; frasa ini menyampaikan pergerakan kolektif orang banyak secara alami.
- source_word: ὄχλοι πολλοὶ
  choice: banyak orang
  rationale: Secara harfiah berarti banyak kerumunan; 'banyak orang' merupakan padanan Indonesia yang wajar dalam konstruksi ini, sementara nuansa kerumunan ditopang oleh 'berbondong-bondong berkumpul'.
- source_word: ἀκούειν
  choice: untuk mendengarkan Dia
  rationale: Infinitif menyatakan tujuan. Objek tersirat dalam bahasa Yunani dijelaskan sebagai Yesus agar kalimat Indonesia tidak terasa menggantung, tanpa mengubah maksud konteks.
- source_word: θεραπεύεσθαι
  choice: disembuhkan
  rationale: Mempertahankan bentuk pasif dan makna penyembuhan secara langsung.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: dari penyakit mereka
  rationale: ἀσθένεια dalam konteks ini menunjuk pada gangguan jasmani, dan 'dari penyakit mereka' mempertahankan konstruksi ἀπό serta dapat dipahami dengan jelas.
theological_decisions:
- issue: Cakupan bahasa penyembuhan
  choice: Menggunakan bahasa penyembuhan jasmani secara langsung.
  alternative: Menggunakan ungkapan yang lebih luas seperti 'dipulihkan seutuhnya', yang dapat menyiratkan pemulihan rohani.
  rationale: Konteks langsung berbicara tentang orang banyak yang datang untuk mendengar dan disembuhkan dari penyakit. Ayat ini tidak secara eksplisit menyatakan penyembuhan rohani.
- issue: Makna λόγος
  choice: Memahaminya sebagai kabar yang beredar tentang Yesus.
  alternative: Menerjemahkannya secara harfiah sebagai 'firman tentang Dia', yang dapat terdengar sebagai istilah teologis teknis.
  rationale: Konteks naratif mendukung arti laporan atau berita, tetapi alternatif leksikal tetap dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Pilihan ''Namun'' mempertahankan hubungan δέ dengan konteks sebelumnya. Susunan kalimat menjaga dua tujuan kedatangan orang banyak: mendengarkan dan menerima penyembuhan.'
