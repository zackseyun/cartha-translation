revisions:
- from: Lalu Yesus memerintahkannya agar tidak memberi tahu siapa pun, “Tetapi pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah kurban untuk pentahiranmu sebagaimana yang diperintahkan Musa,[a] sebagai kesaksian bagi mereka.”[b]
  to: 'Lalu Yesus memerintahkannya: “Jangan beri tahu siapa pun, tetapi pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah kurban untuk pentahiranmu sebagaimana yang diperintahkan Musa,[a] sebagai kesaksian bagi mereka.”[b]'
  rationale: Revisi hanya menyatukan seluruh isi perintah Yesus dalam kutipan langsung. Susunan ini mencerminkan satu rangkaian perintah dalam bahasa sumber dan menghilangkan peralihan yang janggal dari ujaran tidak langsung ke ujaran langsung. Istilah, makna, ambiguitas rujukan, serta jangkar dan isi catatan kaki dipertahankan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:43Z'
review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada teks Yunani. «memerintahkan», larangan untuk tidak memberi tahu siapa pun, perintah untuk pergi kepada imam, mempersembahkan kurban bagi pentahiran, serta «sebagai kesaksian bagi mereka» menyampaikan unsur-unsur utama teks. «Kurban» secara wajar melengkapi objek yang tersirat pada προσένεγκε dalam konteks Imamat 14, dan «bagi mereka» mempertahankan rujukan αὐτοῖς yang tidak diperjelas.
  naturalness: 'Ada ketidakselarasan sintaksis dan tanda petik dalam teks saat ini: larangan pertama disampaikan sebagai klausa tak langsung («memerintahkannya agar ...»), tetapi bagian sesudahnya tiba-tiba dimulai sebagai kutipan langsung dengan «Tetapi». Seluruh perintah perlu dijadikan kutipan langsung agar bentuk ujaran dan alurnya alami dalam bahasa Indonesia baku.'
  terminology: «Imam», «kurban», dan «pentahiran» sesuai dengan register ritual dan hukum Taurat. «Pentahiran» tepat untuk καθαρισμός dalam konteks ini dan tidak perlu diganti dengan istilah yang lebih umum. Catatan kaki mempertahankan ambiguitas «mereka» dan kemungkinan daya evidensial/menentang dari εἰς μαρτύριον αὐτοῖς.
  issues:
  - severity: medium
    issue: Bentuk ujaran tidak konsisten
    rationale: Teks mengawali instruksi sebagai ujaran tidak langsung («memerintahkannya agar tidak memberi tahu siapa pun») lalu membuka tanda petik hanya pada «Tetapi pergilah». Dalam teks Yunani, larangan dan perintah berikutnya merupakan satu rangkaian instruksi. Menempatkan seluruh rangkaian dalam kutipan langsung memperbaiki struktur tanpa mengubah makna.
  revised_text: 'Lalu Yesus memerintahkannya: “Jangan beri tahu siapa pun, tetapi pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah kurban untuk pentahiranmu sebagaimana yang diperintahkan Musa,[a] sebagai kesaksian bagi mereka.”[b]'
