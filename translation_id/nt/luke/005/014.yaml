id: LUK.5.14
reference: Luke 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: id
  text: 'Lalu Yesus memerintahkannya: “Jangan beri tahu siapa pun, tetapi pergilah, perlihatkanlah dirimu kepada imam dan persembahkanlah kurban untuk pentahiranmu sebagaimana yang diperintahkan Musa,[a] sebagai kesaksian bagi mereka.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lihat Imamat 14 mengenai persembahan yang diperintahkan Musa untuk pentahiran dari penyakit kulit.
    reason: cross_reference
  - marker: b
    text: Ungkapan ini juga dapat dipahami sebagai “sebagai bukti bagi mereka” atau, dengan nuansa menentang, “sebagai bukti terhadap mereka”. Teks tidak menjelaskan siapa yang dimaksud dengan “mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: παρήγγειλεν
  choice: memerintahkan
  rationale: Menyampaikan instruksi langsung yang berwibawa tanpa menambahkan penekanan yang tidak dinyatakan oleh verba Yunani.
- source_word: μηδενὶ εἰπεῖν
  choice: agar tidak memberi tahu siapa pun
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan larangan kepada orang itu.
- source_word: ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: pergilah, perlihatkanlah dirimu kepada imam
  rationale: Partisip ἀπελθών dirangkai secara alami dengan imperatif berikutnya, sementara δεῖξον σεαυτόν diterjemahkan cukup dekat dengan bentuk sumber.
- source_word: προσένεγκε
  choice: persembahkanlah kurban
  rationale: Dalam konteks ibadah dan hukum pentahiran, verba ini menunjuk pada tindakan membawa atau mempersembahkan persembahan; penambahan 'kurban' memperjelas objek yang tersirat dalam bahasa Indonesia.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: untuk pentahiranmu
  rationale: '''Pentahiran'' sesuai dengan konteks ritual Imamat 14 dan membedakannya dari sekadar kebersihan jasmani.'
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: sebagaimana yang diperintahkan Musa
  rationale: Mempertahankan rujukan langsung kepada ketentuan hukum melalui Musa.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: sebagai kesaksian bagi mereka
  rationale: Terjemahan dekat yang mempertahankan ketidakjelasan mengenai siapa yang dimaksud dengan 'mereka' dan apakah kesaksian itu bernuansa positif, evidensial, atau menentang.
theological_decisions:
- issue: Rujukan dan nuansa αὐτοῖς dalam εἰς μαρτύριον αὐτοῖς
  choice: bagi mereka
  alternative: bagi para imam; bagi orang banyak; sebagai bukti yang memberatkan mereka
  rationale: Teks Yunani tidak menyebut kelompok yang dirujuk dan tidak menentukan apakah kesaksian tersebut positif atau bersifat melawan; ambiguitas itu dipertahankan.
- issue: Sifat pentahiran dan persembahan menurut Musa
  choice: pentahiran ritual dengan kurban yang diperintahkan Musa
  alternative: sekadar bukti medis bahwa orang itu telah sembuh
  rationale: Konteks dan rujukan kepada ketentuan Musa mengarah pada prosedur pentahiran dalam Imamat 14, tanpa meniadakan fungsi pembuktian di hadapan imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'perlihatkanlah' dan 'persembahkanlah' menjaga nada perintah yang tegas, sedangkan 'pentahiran' dipakai sebagai istilah ritual yang masih dapat dipahami dari konteks dan catatan kaki.
