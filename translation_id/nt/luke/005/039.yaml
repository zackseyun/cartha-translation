id: LUK.5.39
reference: Luke 5:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: id
  text: Dan tidak seorang pun yang telah minum anggur tua menginginkan anggur baru, sebab ia berkata, “Yang tua itu baik.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Yang tua lebih baik.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: tidak seorang pun
  rationale: Ungkapan ini menyampaikan penyangkalan universal secara wajar dan netral dalam bahasa Indonesia modern.
- source_word: πιὼν
  choice: yang telah minum
  rationale: Partisip aoris menunjukkan tindakan yang mendahului keinginan pada klausa utama; bentuk ini mempertahankan hubungan waktunya secara alami.
- source_word: παλαιὸν
  choice: anggur tua
  rationale: Kata benda 'anggur' tersirat dari konteks langsung dan perlu dinyatakan agar objeknya jelas dalam bahasa Indonesia.
- source_word: θέλει
  choice: menginginkan
  rationale: Dalam konteks ini θέλω menyatakan keinginan atau preferensi, dan 'menginginkan' adalah padanan modern yang tepat.
- source_word: νέον
  choice: anggur baru
  rationale: Walaupun bahasa Yunani hanya memakai adjektiva secara eliptis, penyebutan 'anggur' menghasilkan kalimat Indonesia yang jelas dan alami.
- source_word: λέγει γάρ
  choice: sebab ia berkata
  rationale: γάρ memperkenalkan alasan bagi pernyataan sebelumnya, sedangkan λέγει memperkenalkan ujaran langsung.
- source_word: Ὁ παλαιὸς
  choice: Yang tua
  rationale: Ungkapan ini mempertahankan elipsis bahasa Yunani dalam ujaran singkat yang tetap jelas karena konteksnya adalah anggur.
- source_word: χρηστός
  choice: baik
  rationale: χρηστός pada teks utama berarti 'baik' atau 'menyenangkan', bukan bentuk komparatif 'lebih baik'; pilihan luas 'baik' paling sedikit menambah tafsiran.
theological_decisions:
- issue: Makna χρηστός dalam peribahasa tentang anggur tua dan baru
  choice: baik
  alternative: lebih baik
  rationale: Teks Yunani yang dicetak memakai χρηστός, yang secara wajar berarti 'baik' atau 'menyenangkan', bukan komparatif. Bacaan 'lebih baik' tidak dimasukkan ke teks utama, tetapi dicatat sebagai varian naskah agar perbedaan tekstual tidak disamarkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak seorang pun' bersifat umum dan netral; 'anggur' dinyatakan pada dua objek pertama demi kejelasan, sedangkan elipsis dipertahankan dalam ujaran penutup agar gaya peribahasanya tetap ringkas.
