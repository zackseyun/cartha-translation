  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: id
  text: Namun, Ia biasa mengundurkan diri ke tempat-tempat sunyi dan berdoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, «Ia sendiri terus mengundurkan diri di tempat-tempat sunyi dan berdoa.» Secara lebih harfiah, bahasa Yunani memakai konstruksi imperfek dengan partisipel, yang dapat menyatakan tindakan yang berlangsung atau menjadi kebiasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Ia
  rationale: Pronomina Yunani ini eksplisit dan agak menegaskan subjek. Dalam bahasa Indonesia, «Ia» dengan penghubung «Namun» menyampaikan subjek dan kontras secara alami tanpa penegasan berlebihan seperti «Ia sendiri».
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan dengan pemberitaan dan kerumunan yang disebut dalam konteks sebelumnya.
- source_word: ἦν ὑποχωρῶν
  choice: biasa mengundurkan diri
  rationale: Konstruksi imperfek perifrastik menyatakan tindakan yang berlangsung atau berulang pada masa lampau; dalam konteks ini, «biasa» secara alami menyampaikan kebiasaan tersebut.
- source_word: ἐν ταῖς ἐρήμοις
  choice: ke tempat-tempat sunyi
  rationale: Bentuk jamak merujuk pada daerah-daerah yang tidak dihuni atau sepi. «Tempat-tempat sunyi» menghindari kesan bahwa yang dimaksud harus berupa gurun, sedangkan «ke» alami setelah verba gerak «mengundurkan diri».
- source_word: καὶ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan dua tindakan yang menjadi kebiasaan.
- source_word: προσευχόμενος
  choice: berdoa
  rationale: Partisipel ini terkoordinasi dengan tindakan mengundurkan diri dan menggambarkan kegiatan doa yang menyertainya sebagai pola berulang.
theological_decisions:
- issue: Aspek tindakan Yesus
  choice: Ayat ini menggambarkan kebiasaan Yesus mengundurkan diri dan berdoa.
  alternative: Ayat ini menceritakan satu kejadian khusus ketika Yesus mengundurkan diri dan berdoa.
  rationale: Konstruksi imperfek ἦν dengan partisipel kini paling wajar menyatakan tindakan yang berlangsung atau menjadi kebiasaan. Terjemahan mempertahankan arti naratif ini tanpa menarik kesimpulan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. «Tempat-tempat sunyi» mempertahankan bentuk jamak serta arti kawasan tidak berpenghuni tanpa membatasi gambaran pada wilayah bergurun. Kapitalisasi «Ia» mengikuti kelaziman terjemahan Alkitab Indonesia untuk rujukan kepada Yesus.
