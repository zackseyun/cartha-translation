  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: id
  text: Namun, Yesus mengetahui pikiran mereka, lalu berkata kepada mereka, “Mengapa kalian bernalar dalam hati kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: mengetahui
  rationale: Partisip aoris ἐπιγινώσκω menyatakan bahwa Yesus menyadari sepenuhnya apa yang sedang mereka pertimbangkan, tanpa menjelaskan bagaimana Ia mengetahuinya.
- source_word: δὲ
  choice: Namun
  rationale: δέ menandai peralihan dengan kontras ringan ketika Yesus menanggapi keberatan batin mereka.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: pertimbangan-pertimbangan mereka
  rationale: διαλογισμοί menunjuk pada proses penalaran atau pertimbangan batin; pilihan ini juga mempertahankan kaitan leksikal dengan verba διαλογίζεσθε.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: lalu menanggapi mereka
  rationale: Ungkapan naratif harfiah 'menjawab dan berkata kepada mereka' terasa berlebihan dalam bahasa Indonesia modern; 'menanggapi mereka' menyampaikan fungsi ungkapan itu secara alami, termasuk tanggapan terhadap pikiran yang tidak diucapkan.
- source_word: Τί
  choice: Mengapa
  rationale: Dalam konstruksi ini τί menanyakan alasan mereka melakukan pertimbangan batin, sehingga 'Mengapa' paling alami dan tepat secara kontekstual.
- source_word: διαλογίζεσθε
  choice: kalian mempertimbangkan
  rationale: Bentuk kini menyatakan proses pertimbangan batin yang sedang berlangsung; 'mempertimbangkan' mempertahankan nuansa aktif penalaran.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dalam hati kalian
  rationale: Ungkapan ini mempertahankan metafora antropologis Alkitab tentang hati sebagai pusat pikiran dan kehendak.
theological_decisions:
- issue: Sifat pengetahuan Yesus tentang pertimbangan batin orang lain
  choice: Menyatakan secara langsung bahwa Yesus mengetahui pertimbangan mereka tanpa menerangkan cara Ia mengetahuinya.
  alternative: Menambahkan bahwa pengetahuan itu bersifat adikodrati, atau melemahkannya menjadi sekadar dugaan.
  rationale: Teks menegaskan pengetahuan Yesus atas pertimbangan batin mereka, tetapi tidak menjelaskan mekanismenya. Terjemahan tidak boleh memperluas ataupun mengurangi pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai agar sapaan jamak sumber terbaca jelas dan tetap mudah dipahami. Pengulangan 'pertimbangan-pertimbangan/mempertimbangkan' sengaja dipertahankan untuk mencerminkan hubungan διαλογισμούς–διαλογίζεσθε.
