  terminology: Nama Yakobus, Yohanes, Zebedeus, dan Simon konsisten. “Orang” tepat untuk ἀνθρώπους. “Menangkap orang hidup-hidup” mempertahankan metafora dan unsur leksikal ζωγρῶν, walaupun catatan kaki diperlukan untuk menjelaskan kekhasannya tanpa menyelaraskannya dengan Injil-injil paralel.
