id: LUK.5.10
reference: Luke 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: id
  text: Demikian juga Yakobus dan Yohanes, anak-anak Zebedeus, yang menjadi rekan usaha Simon. Yesus berkata kepada Simon, “Jangan takut; mulai sekarang engkau akan menangkap orang hidup-hidup.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menangkap manusia hidup-hidup.” Kata Yunani yang dipakai berarti menangkap atau membawa sebagai tawanan hidup-hidup, sehingga berbeda dari ungkapan “penjala manusia” yang lebih dikenal.
    reason: lexical_alternative
  - marker: b
    text: Bandingkan Matius 4:19 dan Markus 1:17. Di sana Yesus berkata, “Aku akan menjadikan kamu penjala manusia.” Lukas memakai ungkapan yang berbeda di sini.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Demikian juga
  rationale: Menyampaikan daya komparatif dan aditif ungkapan Yunani secara wajar dalam bahasa Indonesia, dengan menghubungkan Yakobus dan Yohanes pada reaksi yang sama.
- source_word: υἱοὺς Ζεβεδαίου
  choice: anak-anak Zebedeus
  rationale: Bentuk alami dalam bahasa Indonesia untuk menyatakan hubungan keluarga; konteks dan nama-nama yang disebut membuat arti 'anak laki-laki' sudah jelas tanpa harus memakai bentuk yang lebih berat.
- source_word: κοινωνοὶ
  choice: rekan
  rationale: Dalam konteks usaha penangkapan ikan, kata ini menunjuk pada orang-orang yang bekerja dan berbagi kepentingan bersama Simon; 'rekan' alami dan tidak membatasi hubungan itu secara berlebihan.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Ungkapan Indonesia yang idiomatis dan bermartabat untuk larangan sekaligus penguatan yang disampaikan Yesus.
- source_word: ἀπὸ τοῦ νῦν
  choice: Mulai sekarang
  rationale: Menandai peralihan tegas sejak saat itu dengan ungkapan Indonesia yang lazim.
- source_word: ἀνθρώπους
  choice: orang
  rationale: Mengacu kepada manusia secara umum, bukan hanya laki-laki; 'orang' paling alami dalam konstruksi ini.
- source_word: ζωγρῶν
  choice: akan menangkap orang hidup-hidup
  rationale: Mempertahankan gambaran menangkap serta unsur khas ζωγρέω, yakni menangkap atau membawa tertangkap dalam keadaan hidup, tanpa menyamakannya dengan rumusan paralel 'penjala manusia'.
theological_decisions:
- issue: Metafora ζωγρέω dalam panggilan Simon
  choice: engkau akan menangkap orang hidup-hidup
  alternative: engkau akan menangkap orang; engkau akan menjadi penjala manusia
  rationale: Lukas memakai ζωγρέω, bukan ungkapan 'penjala manusia' dalam Matius 4:19 dan Markus 1:17. Terjemahan ini menjaga kekhasan metafora Lukas dan nuansa mengambil dalam keadaan hidup, tanpa menjelaskan lebih jauh makna teologisnya.
- issue: Cakupan gender ἀνθρώπους
  choice: orang
  alternative: laki-laki; manusia
  rationale: Referennya adalah manusia secara umum. 'Orang' menyatakan cakupan tersebut secara akurat dan alami.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat mengikuti alur Yunani tanpa mempertahankan pengulangan konjungsi yang terasa kaku dalam bahasa Indonesia. Tanda catatan ditempatkan sesudah klausa yang diterangkannya.
