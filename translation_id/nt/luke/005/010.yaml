    rationale: κοινωνοί menunjuk pada mitra yang berbagi dalam suatu usaha; konteks penangkapan ikan dalam ayat-ayat sebelumnya mendukung “rekan usaha” atau “mitra.” “Rekan” dapat dipahami hanya sebagai kolega atau teman kerja.
  - severity: low
    issue: Tanda baca memisahkan secara terlalu kuat dua bagian ucapan Yesus.
