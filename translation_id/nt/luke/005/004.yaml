id: LUK.5.4
reference: Luke 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: id
  text: Setelah selesai berbicara, ia berkata kepada Simon, “Bertolaklah ke tempat yang dalam[a], lalu turunkanlah jala-jala kalian untuk menangkap ikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke kedalaman,” yakni ke bagian perairan yang dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Setelah selesai berbicara
  rationale: Ungkapan ini menandai urutan waktu dan berakhirnya tindakan berbicara; bentuk ini alami dalam bahasa Indonesia tanpa memberi tekanan berlebihan pada δέ.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: ia berkata kepada Simon
  rationale: Padanan langsung dan wajar bagi pengantar ujaran Yunani.
- source_word: Ἐπανάγαγε
  choice: Bertolaklah
  rationale: Dalam konteks perahu, kata kerja ini berarti bergerak kembali menjauhi pantai. 'Bertolaklah' ringkas dan tidak keliru mengesankan bahwa peristiwanya terjadi di laut.
- source_word: εἰς τὸ βάθος
  choice: ke tempat yang dalam
  rationale: βάθος secara harfiah menunjuk pada kedalaman, tetapi dalam konteks ini berarti bagian perairan yang dalam.
- source_word: χαλάσατε
  choice: turunkanlah
  rationale: Kata ini menggambarkan menurunkan jala dari perahu; padanan ini lebih tepat daripada 'tebarkanlah'.
- source_word: τὰ δίκτυα ὑμῶν
  choice: jala-jala kalian
  rationale: Bentuk jamak pada kata benda dan pronomina dipertahankan. 'Kalian' juga mencerminkan bahwa perintah kedua berbentuk jamak.
- source_word: εἰς ἄγραν
  choice: untuk menangkap ikan
  rationale: Mengungkapkan tujuan tindakan secara alami; dalam konteks penangkapan dengan jala, ἄγρα merujuk pada hasil tangkapan ikan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Pergeseran dari perintah tunggal kepada Simon (Ἐπανάγαγε) ke perintah jamak (χαλάσατε; ὑμῶν) dipertahankan sejauh dimungkinkan: Simon tetap menjadi lawan bicara, sedangkan ''kalian'' pada ''jala-jala kalian'' menunjukkan keterlibatan orang-orang lain dalam perintah kedua.'
