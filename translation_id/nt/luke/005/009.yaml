  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: id
  text: Sebab rasa takjub menguasai dia dan semua orang yang bersamanya karena hasil tangkapan ikan yang mereka peroleh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: rasa takjub
  rationale: Kata benda ini menunjuk pada ketakjuban yang kuat dan mendadak. “Rasa takjub” alami dalam bahasa Indonesia modern dan sesuai dengan reaksi terhadap penangkapan ikan yang luar biasa.
- source_word: γὰρ
  choice: Sebab
  rationale: Konjungsi ini menjelaskan alasan reaksi Simon pada ayat sebelumnya. “Sebab” mempertahankan hubungan penjelas itu secara ringkas.
- source_word: περιέσχεν
  choice: diliputi
  rationale: Secara harfiah verba ini menggambarkan sesuatu yang mengelilingi atau menguasai. Dalam ungkapan tentang emosi, “diliputi” menyampaikan bahwa ketakjuban menguasai mereka tanpa terasa kaku.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: semua orang yang bersamanya
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dan dengan jelas menunjuk kepada rekan-rekan Simon yang hadir.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: karena begitu banyak ikan
  rationale: ἐπί menyatakan sebab, sedangkan ἄγρα menunjuk pada hasil tangkapan. Dalam konteks ayat sebelumnya, ungkapan ini secara alami menyampaikan hasil tangkapan ikan yang sangat banyak dan menghindari frasa Indonesia yang kaku seperti “karena tangkapan ikan”.
- source_word: ὧν συνέλαβον
  choice: yang mereka tangkap
  rationale: Pronomina relatif mengacu kepada ikan, dan verba jamak menunjukkan bahwa kelompok itu ikut menangkapnya. “Yang mereka tangkap” jelas, alami, dan mempertahankan acuan serta jumlah pelakunya.
