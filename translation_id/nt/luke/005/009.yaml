- from: Sebab, ia dan semua orang yang bersamanya diliputi rasa takjub karena begitu banyak ikan yang mereka tangkap.
  to: Sebab rasa takjub menguasai dia dan semua orang yang bersamanya karena hasil tangkapan ikan yang mereka peroleh.
  rationale: Revisi menghapus tambahan “begitu banyak” agar terjemahan tidak melampaui isi ayat sumber. Susunan dengan “rasa takjub menguasai” mempertahankan θάμβος sebagai subjek yang mengambil alih dia dan para rekannya; “hasil tangkapan ikan yang mereka peroleh” menyampaikan tangkapan yang dilakukan bersama tanpa repetisi yang kaku.
