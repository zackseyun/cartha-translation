reference: Luke 5:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: id
  text: Lalu orang-orang Farisi dan ahli-ahli Taurat mereka terus menggerutu[a] kepada murid-murid Yesus, “Mengapa kalian makan dan minum bersama para pemungut pajak dan orang-orang berdosa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersungut-sungut.” Kata Yunani yang dipakai dapat menunjuk pada keluhan yang diucapkan dengan suara lirih, bukan hanya keberatan resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: menggerutu
  rationale: Bentuk imperfek menunjukkan keluhan yang sedang berlangsung atau berulang; ‘menggerutu’ mempertahankan nuansa keluhan bernada negatif yang diucapkan dengan suara lirih.
- source_word: γραμματεῖς
  choice: ahli-ahli Taurat
  rationale: Sebutan ini alami dan dikenal luas dalam bahasa Indonesia untuk kelompok ahli kitab dan hukum agama Yahudi, tanpa mereduksinya menjadi sekadar penyalin.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina genitif ini paling wajar menghubungkan para ahli Taurat tersebut dengan orang-orang Farisi, sekaligus mempertahankan susunan teks Yunani.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: kepada murid-murid Yesus
  rationale: πρός dengan akusatif menunjukkan arah keluhan atau perkataan. Nama ‘Yesus’ dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: Διὰ τί
  choice: Mengapa
  rationale: Padanan interogatif yang langsung dan idiomatis dalam bahasa Indonesia.
- source_word: τελωνῶν
  choice: para pemungut pajak
  rationale: Padanan yang lazim dan jelas dalam konteks Injil serta tetap membawa identitas sosial kelompok tersebut.
- source_word: ἁμαρτωλῶν
  choice: orang-orang berdosa
  rationale: Terjemahan langsung yang mempertahankan kategori moral dan sosial sebagaimana diucapkan oleh para penentang, tanpa menjelaskan atau melunakkan penilaian mereka.
- source_word: ἐσθίετε καὶ πίνετε
  choice: kalian makan dan minum
  rationale: Mempertahankan dua tindakan konkret dalam teks. ‘Kalian’ menjelaskan bahwa verba orang kedua jamak ditujukan kepada para murid.
- source_word: καὶ
  choice: Lalu
  rationale: Mengungkapkan hubungan naratif secara alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
theological_decisions:
- issue: Makna sosial-keagamaan dari makan bersama ‘para pemungut pajak dan orang-orang berdosa’
  choice: Mempertahankan tuduhan konkret tanpa uraian tambahan
  alternative: Memparafrasakan tindakan itu sebagai pelanggaran ritual atau dukungan moral terhadap mereka
  rationale: Ayat ini sendiri menyatakan keberatan melalui identitas orang-orang tersebut dan tindakan makan serta minum bersama mereka. Terjemahan mempertahankan ketegangan persekutuan meja tanpa memasukkan alasan teologis atau ritual yang tidak dinyatakan.
- issue: Hubungan ‘ahli-ahli Taurat mereka’ dengan orang-orang Farisi
  choice: Mempertahankan bentuk ‘ahli-ahli Taurat mereka’
  alternative: Menghilangkan pronomina atau menjadikannya dua kelompok yang sepenuhnya tidak berkaitan
  rationale: Susunan Yunani paling alami mengaitkan αὐτῶν dengan γραμματεῖς, tetapi terjemahan tidak menjelaskan lebih jauh sifat kelembagaan hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. ‘Menggerutu’ dipilih untuk nuansa γογγύζω; ‘kalian’ menandai orang kedua jamak dengan jelas. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang menjadi sasaran keluhan.
