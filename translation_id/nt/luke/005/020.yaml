id: LUK.5.20
reference: Luke 5:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: id
  text: Ketika melihat iman mereka[a], Yesus berkata, “Saudara, dosa-dosamu telah diampuni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepercayaan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Bentuk Yunani dapat menekankan keadaan sekarang sebagai hasil tindakan pengampunan yang telah terjadi; dapat juga diterjemahkan “dosa-dosamu diampuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika melihat
  rationale: Partisip aoris ini paling alami dinyatakan sebagai anak kalimat waktu dalam bahasa Indonesia, tanpa menentukan urutan waktu secara berlebihan.
- source_word: πίστιν
  choice: iman
  rationale: Dalam konteks ini kata tersebut menunjuk pada kepercayaan yang nyata dalam tindakan; “iman” merupakan padanan baku dan tetap wajar bagi pembaca modern.
- source_word: αὐτῶν
  choice: mereka
  rationale: Bentuk jamak dipertahankan agar terjemahan tidak mempersempit rujukannya hanya kepada orang lumpuh atau hanya kepada para pengusungnya.
- source_word: Ἄνθρωπε
  choice: Saudara
  rationale: Sapaan vokatif ini ditujukan kepada seorang laki-laki. Terjemahan harfiah “Hai manusia” terdengar janggal atau keras dalam bahasa Indonesia, sedangkan “Saudara” mempertahankan sapaan langsung yang hormat tanpa menambahkan keakraban seperti “Sahabat.”
- source_word: ἀφέωνταί
  choice: telah diampuni
  rationale: Bentuk perfektif pasif menyatakan keadaan kini sebagai hasil tindakan yang sudah terlaksana. “Telah diampuni” mengungkapkan aspek ini secara alami tanpa menentukan pelaku pasif yang tidak disebutkan.
- source_word: ἁμαρτίαι σου
  choice: dosa-dosamu
  rationale: Bentuk jamak dan kata ganti milik orang kedua tunggal dipertahankan secara langsung dan alami.
- source_word: σοι
  choice: tersirat dalam konstruksi “dosa-dosamu telah diampuni”
  rationale: Dativus penerima sudah jelas secara idiomatis melalui bentuk kepunyaan “-mu”; menambahkan “bagimu” akan terasa berlebihan dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan “iman mereka”
  choice: Rujukan jamak dipertahankan tanpa menetapkan secara khusus siapa saja yang termasuk di dalamnya.
  alternative: Menafsirkannya hanya sebagai iman para pengusung atau sebagai iman bersama orang lumpuh dan para pengusungnya.
  rationale: αὐτῶν berbentuk jamak, tetapi ayat ini tidak merinci cakupannya; ambiguitas naratif dan teologis itu perlu dipertahankan.
- issue: Daya pernyataan pengampunan
  choice: Pernyataan pasif bahwa dosa-dosanya berada dalam keadaan telah diampuni.
  alternative: Menafsirkannya secara khusus sebagai tindakan pengampunan yang baru terjadi saat itu atau sekadar pengumuman mengenai pengampunan yang telah diberikan sebelumnya.
  rationale: Perfek pasif Yunani menegaskan kenyataan dan keadaan hasil pengampunan, tetapi tidak dengan sendirinya menyelesaikan seluruh mekanisme waktunya atau menyebut pelakunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ketika melihat” lebih alami daripada mempertahankan partisip secara kaku. Sapaan “Saudara” dipilih untuk menghindari kekakuan “Hai manusia” tanpa menambahkan nuansa persahabatan yang tidak eksplisit. Nama “Yesus” digunakan sebagai subjek tersirat agar kalimat berdiri jelas sebagai satu ayat dalam bahasa Indonesia.
