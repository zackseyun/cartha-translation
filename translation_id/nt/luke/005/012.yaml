  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: id
  text: Pada suatu waktu, ketika Yesus berada di salah satu kota, tampaklah seorang laki-laki yang sekujur tubuhnya terkena kusta.[a] Ketika melihat Yesus, ia tersungkur dengan muka ke tanah dan memohon kepada-Nya, “Tuhan, jika Engkau mau, Engkau dapat mentahirkan aku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penuh dengan kusta,” yang menekankan parahnya keadaan orang itu. Istilah Yunani yang diterjemahkan “kusta” dapat mencakup berbagai penyakit kulit, tidak hanya penyakit Hansen yang kini disebut kusta.
    reason: lexical_alternative
  - marker: b
    text: Atau “membersihkan aku.” Kata ini dapat menunjuk pemulihan secara jasmani sekaligus pentahiran dalam arti ritual dan sosial, bukan hanya penyembuhan medis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: Pada suatu waktu, ketika Yesus berada
  rationale: Mengungkapkan formula naratif dan konstruksi waktu Yunani secara alami dalam bahasa Indonesia; nama Yesus dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: μιᾷ τῶν πόλεων
  choice: salah satu kota
  rationale: Kata πόλις dapat menunjuk kota atau permukiman; “kota” adalah padanan Indonesia yang wajar dan tidak harus menyiratkan kota metropolitan.
- source_word: ἰδοὺ
  choice: tampaklah
  rationale: Mempertahankan penanda wacana yang mengarahkan perhatian pembaca pada kemunculan mendadak laki-laki itu, dengan ungkapan naratif Indonesia yang bermartabat.
- source_word: πλήρης λέπρας
  choice: sekujur tubuhnya terkena kusta
  rationale: Menyampaikan penekanan pada parah dan luasnya keadaan orang itu secara alami; ungkapan harfiahnya, “penuh dengan kusta,” dijelaskan dalam catatan kaki.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ia tersungkur dengan muka ke tanah
  rationale: Mempertahankan postur fisik kerendahan hati dan permohonan yang mendesak.
- source_word: ἐδεήθη αὐτοῦ
  choice: memohon kepada-Nya
  rationale: Menyampaikan permintaan yang sungguh-sungguh tanpa memakai ungkapan yang terasa kasar atau berlebihan.
- source_word: Κύριε
  choice: Tuhan
  rationale: Padanan baku bagi sapaan κύριε kepada Yesus, yang tetap dapat memuat baik penghormatan dalam konteks langsung maupun gema kristologis.
- source_word: ἐὰν θέλῃς
  choice: jika Engkau mau
  rationale: Menyatakan kehendak atau kesediaan dengan bahasa Indonesia modern yang ringkas dan alami.
- source_word: δύνασαί με καθαρίσαι
  choice: Engkau dapat menahirkan aku
  rationale: “Dapat” menyatakan kemampuan, sedangkan “menahirkan” mempertahankan dimensi jasmani, ritual, dan sosial dari καθαρίζω, bukan sekadar kesembuhan medis.
theological_decisions:
- issue: Makna λέπρα dan καθαρίζω dalam kisah penyembuhan
  choice: Memakai “kusta” dan “menahirkan aku”
  alternative: Memakai “penyakit kulit” dan “menyembuhkan aku”
  rationale: Istilah Yunani λέπρα mencakup kondisi kulit yang tidak selalu sama dengan penyakit Hansen modern, tetapi “kusta” tetap merupakan istilah tradisional yang mudah dikenali. Kata καθαρίζω sengaja diterjemahkan “menahirkan” agar pemulihan jasmani sekaligus dimensi ritual dan sosialnya tidak hilang.
- issue: Sapaan κύριε kepada Yesus
  choice: Tuhan
  alternative: Tuan atau Guru
  rationale: “Tuhan” mempertahankan penghormatan dalam sapaan itu serta kemungkinan gaung kristologisnya, tanpa memaksa konteks ini untuk menentukan seluruh bobot gelar tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “tampaklah” dan “tersungkur” mempertahankan daya naratif teks tanpa menjadi terlalu arkais. Kapitalisasi pronomina yang merujuk kepada Yesus mengikuti kebiasaan luas dalam terjemahan Alkitab bahasa Indonesia.
