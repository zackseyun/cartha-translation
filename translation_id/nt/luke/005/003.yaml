id: LUK.5.3
reference: Luke 5:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: id
  text: Kemudian Ia naik ke salah satu perahu yang merupakan milik Simon, lalu meminta Simon membawa perahu itu sedikit menjauh dari darat.[a] Setelah duduk, Ia mengajar orang banyak dari perahu itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedikit menjauh dari tepi danau.” Kata Yunani secara harfiah berarti “dari darat”, yang mengontraskan perahu dengan daratan kering.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: naik ke
  rationale: Partisip aoris ini menyatakan tindakan masuk ke perahu sebelum permintaan kepada Simon. Dalam konteks kendaraan air, “naik ke” alami dalam bahasa Indonesia modern.
- source_word: πλοίων / πλοίου
  choice: perahu-perahu / perahu
  rationale: πλοῖον dalam konteks penangkapan ikan di danau menunjuk pada perahu, bukan kapal besar. Bentuk jamak dan tunggal dipertahankan sesuai konteks masing-masing.
- source_word: ὃ ἦν Σίμωνος
  choice: yang merupakan milik Simon
  rationale: Genitif Σίμωνος menyatakan kepemilikan. Ungkapan ini jelas dan alami tanpa menambahkan gagasan lain.
- source_word: ἠρώτησεν αὐτὸν
  choice: meminta Simon
  rationale: ἐρωτάω di sini berarti meminta seseorang melakukan sesuatu. Nama Simon diulangi agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: ἐπαναγαγεῖν
  choice: membawa perahu itu ... menjauh
  rationale: Dalam konteks pelayaran, verba ini berarti menggerakkan perahu keluar atau menjauh dari daratan. “Membawa perahu itu menjauh” alami dan tidak menentukan apakah Simon mendayung atau memakai cara lain.
- source_word: ἀπὸ τῆς γῆς
  choice: dari darat
  rationale: γῆ secara harfiah berarti tanah atau darat dan di sini dikontraskan dengan posisi di atas air. “Dari darat” mempertahankan citra sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: ὀλίγον
  choice: sedikit
  rationale: Bentuk ini menyatakan jarak yang kecil; “sedikit” ringkas dan alami.
- source_word: καθίσας
  choice: setelah duduk
  rationale: Partisip aoris menyajikan tindakan duduk sebelum kegiatan mengajar yang berlangsung. Bentuk ini mempertahankan urutan tindakan secara jelas.
- source_word: ἐδίδασκεν
  choice: mengajar
  rationale: Imperfek menggambarkan kegiatan mengajar yang sedang berlangsung. Dalam narasi bahasa Indonesia, verba sederhana “mengajar” secara alami dapat menyatakan kegiatan berkelanjutan tanpa perlu menambahkan “mulai” yang tidak tersurat.
- source_word: τοὺς ὄχλους
  choice: orang banyak
  rationale: Bentuk jamak ὄχλους merujuk pada kumpulan banyak orang. “Orang banyak” merupakan ungkapan Indonesia yang alami dan tidak terasa kuno seperti “khalayak ramai” atau “banyak orang berbondong-bondong.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan tindakan dalam teks Yunani, sementara pengulangan “Simon” dan “perahu itu” dipakai untuk kejelasan rujukan. Penanda catatan ditempatkan sesudah frasa yang diterangkannya.
