base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: id
  text: Ia meninggalkan semuanya, lalu bangkit dan mengikutinya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah meninggalkan semuanya, ia bangkit dan mengikutinya.”
    reason: Alternatif susunan untuk menyatakan secara lebih eksplisit bahwa tindakan meninggalkan mendahului tindakan utama, selaras dengan partisip aoris καταλιπών.
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini meneruskan alur panggilan Lewi secara alami dalam narasi Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: καταλιπὼν
  choice: meninggalkan
  rationale: Partisip aoris ini menyatakan tindakan yang mendahului tindakan utama; bentuk Indonesia ini alami dan tidak melebihkan maknanya menjadi 'menelantarkan'.
- source_word: πάντα
  choice: semuanya
  rationale: Bentuk netral jamak ini bersifat menyeluruh. 'Semuanya' mempertahankan keluasan ungkapan tanpa menentukan secara lebih rinci apa saja yang ditinggalkan Lewi.
- source_word: ἀναστὰς
  choice: bangkit
  rationale: Dalam konteks naratif, partisip aoris ini berarti bangun atau berdiri untuk bertindak. 'Bangkit' ringkas, wajar, dan bermartabat.
- source_word: ἠκολούθει
  choice: mengikuti
  rationale: Imperfek ἀκολουθέω menggambarkan tindakan mengikuti yang berlanjut. Dalam rangkaian verba bahasa Indonesia, 'mengikuti' menyampaikan tindakan itu dengan alami tanpa harus memaksakan nuansa inkoatif 'mulai'.
- source_word: αὐτῷ
  choice: Yesus
  rationale: Pronomina datif ini merujuk kepada Yesus dalam konteks langsung. Nama disebut agar rujukannya jelas dan alami bagi pembaca ayat tunggal, meskipun bahasa Yunani memakai pronomina.
theological_decisions:
- issue: Cakupan pelepasan Lewi dalam mengikut Yesus
  choice: Ayat menyatakan bahwa Lewi meninggalkan 'semuanya' dan mengikuti Yesus, tanpa merinci apakah hal itu berarti pelepasan permanen atas seluruh harta miliknya.
  alternative: Menafsirkannya hanya sebagai meninggalkan pekerjaan untuk sementara, atau sebagai pelepasan permanen atas semua kepemilikan.
  rationale: Terjemahan mempertahankan cakupan menyeluruh πάντα sekaligus tidak memasukkan kesimpulan mengenai harta atau pekerjaan yang tidak dinyatakan oleh ayat ini.
- issue: Aspek tindakan mengikuti
  choice: Menggunakan 'mengikuti' tanpa menambahkan 'mulai'.
  alternative: Menggunakan 'mulai mengikuti' untuk menonjolkan dimulainya kehidupan sebagai murid.
  rationale: Bentuk imperfek dapat menyiratkan tindakan yang berkelanjutan, tetapi konteks tidak menuntut nuansa inkoatif secara eksplisit. Pilihan ini menjaga ketegangan aspek dan tetap alami.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bernada naratif yang bermartabat. Struktur tiga tindakan dipertahankan. Nama 'Yesus' dipakai untuk memperjelas anteseden dalam penyajian ayat tunggal.
