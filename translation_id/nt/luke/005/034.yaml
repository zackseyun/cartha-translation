id: LUK.5.34
reference: Luke 5:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Kalian tidak mungkin menyuruh para tamu pernikahan[a] berpuasa selama mempelai laki-laki masih bersama mereka, bukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak ruang pengantin,” sebuah ungkapan bagi sahabat-sahabat mempelai laki-laki atau para tamu pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Kalian tidak mungkin ... bukan?
  rationale: Pertanyaan dengan μή mengharapkan jawaban negatif. Bentuk ini mempertahankan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: para tamu pernikahan
  rationale: Ungkapan harfiahnya, 'anak-anak ruang pengantin', merupakan idiom bagi orang-orang yang menyertai perayaan pernikahan, khususnya sahabat atau tamu mempelai laki-laki. Padanan idiomatis ini jelas bagi pembaca modern.
- source_word: νυμφίος
  choice: mempelai laki-laki
  rationale: Padanan baku yang mempertahankan gambaran pernikahan dan tidak menambahkan penafsiran teologis.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: masih bersama mereka
  rationale: Kata 'bersama' menerjemahkan kehadiran sang mempelai di tengah kelompok itu; 'masih' secara alami menyatakan keadaan yang berlangsung selama waktu yang disebutkan tanpa menjelaskan lebih jauh.
- source_word: ποιῆσαι νηστεῦσαι
  choice: menyuruh ... berpuasa
  rationale: Konstruksi ποιέω dengan infinitif bersifat kausatif. 'Menyuruh ... berpuasa' mempertahankan unsur membuat atau menyebabkan orang lain berpuasa dan lebih alami daripada bentuk yang sangat harfiah.
- source_word: νηστεῦσαι
  choice: berpuasa
  rationale: Istilah Indonesia yang baku dan ringkas untuk tindakan tidak makan dalam konteks keagamaan.
theological_decisions:
- issue: Identifikasi metaforis Yesus sebagai mempelai laki-laki
  choice: Mempertahankan gambaran 'mempelai laki-laki' tanpa menjelaskan identitas atau makna teologisnya dalam teks utama.
  alternative: Menambahkan penjelasan bahwa Yesus sedang menyamakan diri-Nya dengan mempelai laki-laki.
  rationale: Ayat ini menyajikan metafora tersebut secara tersirat. Terjemahan perlu mempertahankan gambaran dan ketegangan teologisnya tanpa memasukkan tafsiran eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'kalian' dipakai karena sapaan Yunani berbentuk jamak. Struktur pertanyaan berekor mempertahankan harapan akan jawaban negatif.
