id: LUK.5.27
reference: Luke 5:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: id
  text: Sesudah itu, Yesus keluar dan melihat seorang pemungut pajak bernama Lewi sedang duduk di tempat pemungutan pajak.[a] Ia berkata kepadanya, “Ikutlah Aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di pos pemungutan bea” atau “di kantor pajak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini mempertahankan peralihan urutan peristiwa yang dinyatakan oleh bentuk jamak Yunani, tetapi tetap alami dalam bahasa Indonesia.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Menerjemahkan gerakan konkret ἐξέρχομαι secara langsung. Subjek 'Yesus' dinyatakan agar rujukannya jelas dalam ayat yang berdiri sendiri.
- source_word: ἐθεάσατο
  choice: melihat
  rationale: Padanan yang alami dan akurat; verba Yunani dapat menyiratkan pengamatan yang disengaja, tetapi konteks tidak mengharuskan nuansa itu dibuat eksplisit.
- source_word: τελώνην
  choice: seorang pemungut pajak
  rationale: Istilah umum yang paling jelas bagi pembaca modern dan sesuai dengan peran sosial tokoh tersebut.
- source_word: ὀνόματι Λευὶν
  choice: bernama Lewi
  rationale: Padanan idiomatis dan ringkas bagi konstruksi datif Yunani.
- source_word: καθήμενον
  choice: sedang duduk
  rationale: Menjaga aspek keadaan yang sedang berlangsung ketika Lewi dilihat.
- source_word: ἐπὶ τὸ τελώνιον
  choice: di tempat pemungutan pajak
  rationale: τελώνιον menunjuk lokasi atau pos tempat pajak maupun bea dipungut. Ungkapan ini akurat tanpa menentukan secara berlebihan apakah tempat itu berupa kios, kantor, atau pos bea.
- source_word: Ἀκολούθει μοι
  choice: Ikutlah Aku
  rationale: Perintah langsung dan alami dalam bahasa Indonesia yang mempertahankan arti harfiah sekaligus daya panggilan untuk menjadi pengikut.
theological_decisions:
- issue: Daya perintah Yesus sebagai panggilan untuk menjadi murid
  choice: Ikutlah Aku
  alternative: Jadilah murid-Ku
  rationale: Terjemahan mempertahankan bentuk panggilan langsung dalam teks Yunani tanpa menambahkan penjelasan teologis. Dalam konteks, panggilan ini memang berkaitan dengan kemuridan, tetapi hal itu tidak perlu dimasukkan sebagai parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama 'Yesus' dipakai sebagai subjek eksplisit untuk memperjelas kata ganti Yunani ketika ayat dibaca tersendiri. Kapitalisasi 'Aku' mengikuti kelaziman penerbitan Alkitab bahasa Indonesia ketika merujuk kepada Yesus.
