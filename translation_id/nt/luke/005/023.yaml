id: LUK.5.23
reference: Luke 5:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: id
  text: 'Mana yang lebih mudah: mengatakan, “Dosa-dosamu sudah diampuni,”[a] atau mengatakan, “Bangunlah dan berjalanlah”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dosa-dosamu diampuni.”
    reason: Alternatif ini menyatakan keadaan pengampunan secara lebih ringkas, sementara teks utama lebih nyata mencerminkan daya perfektif bentuk Yunani.
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Mana yang lebih mudah
  rationale: Ungkapan komparatif ini secara idiomatis membandingkan dua perkataan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: εἰπεῖν
  choice: mengatakan
  rationale: Infinitif ini memperkenalkan isi dua ucapan alternatif dan paling wajar diterjemahkan sebagai 'mengatakan'.
- source_word: Ἀφέωνταί
  choice: sudah diampuni
  rationale: Bentuk perfektif pasif menyatakan keadaan kini sebagai hasil tindakan yang telah terjadi. 'Sudah diampuni' mempertahankan unsur hasil tersebut tanpa menentukan siapa pelakunya.
- source_word: σοι
  choice: -mu
  rationale: Dativus orang kedua ditangkap secara alami bersama frasa posesif 'dosa-dosamu'; penyebutan tambahan 'kepadamu' akan terasa janggal dan berlebihan dalam bahasa Indonesia.
- source_word: αἱ ἁμαρτίαι σου
  choice: dosa-dosamu
  rationale: Bentuk ulang menyatakan jamak, sedangkan enklitik '-mu' menyampaikan hubungan posesif dan sapaan pribadi.
- source_word: ἢ
  choice: atau
  rationale: Konjungsi disjungtif ini membedakan kedua ucapan yang dibandingkan.
- source_word: Ἔγειρε
  choice: Bangunlah
  rationale: Imperatif ini memerintahkan orang itu untuk bangkit. 'Bangunlah' jelas, alami, dan tetap bermartabat.
- source_word: καὶ περιπάτει
  choice: dan berjalanlah
  rationale: Kata kerja ini menunjuk pada tindakan berjalan secara harfiah; bentuk imperatif dengan '-lah' sepadan dengan perintah sebelumnya.
theological_decisions:
- issue: Menerjemahkan bentuk perfektif pasif dalam pernyataan pengampunan tanpa menambahkan pelaku atau muatan doktrinal
  choice: Dosa-dosamu sudah diampuni
  alternative: Dosa-dosamu diampuni
  rationale: '''Sudah diampuni'' menyampaikan keadaan yang dihasilkan oleh tindakan terdahulu, sedangkan bentuk pasif tetap tidak menyebut pelakunya. Catatan kaki mempertahankan kemungkinan ungkapan Indonesia yang lebih ringkas tanpa memaksakan perbedaan teologis.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mana yang lebih mudah' dipilih sebagai pertanyaan perbandingan yang alami; kedua perintah memakai '-lah' untuk kesejajaran dan nada yang pantas.
