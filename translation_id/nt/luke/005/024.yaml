id: LUK.5.24
reference: Luke 5:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: id
  text: 'Tetapi supaya kalian tahu bahwa Anak Manusia[a] memiliki wewenang di bumi untuk mengampuni dosa”—Ia berkata kepada orang yang lumpuh itu—“Aku berkata kepadamu: Bangunlah, angkatlah tikarmu[b], dan pulanglah ke rumahmu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sang Manusia”. Ungkapan Yunani ini secara harfiah berbunyi “anak manusia”. Bentuk “Anak Manusia” dipertahankan karena merupakan sebutan yang dipakai Yesus bagi diri-Nya dan memiliki gema penting dalam Alkitab, khususnya Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Atau “tilammu” atau “tempat tidurmu”. Kata Yunani κλινίδιον menunjuk tempat berbaring kecil, seperti tikar, tilam, atau dipan ringan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Namun, supaya kalian tahu
  rationale: 'δέ menandai peralihan yang bernuansa kontras ringan, sedangkan ἵνα dengan εἰδῆτε menyatakan tujuan: agar para pendengar mengetahui dengan pasti.'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  rationale: Mempertahankan bentuk gelar yang dikenal dalam Alkitab Indonesia serta gema intertekstualnya, terutama Daniel 7, tanpa menguraikannya secara tafsiran.
- source_word: ἐξουσίαν ἔχει
  choice: memiliki wewenang
  rationale: ἐξουσία menyatakan hak atau kewenangan yang sah, bukan sekadar kemampuan atau kuasa mentah.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Terjemahan lokatif yang langsung dan alami, tanpa mempersempit cakupan frasa melalui penjelasan tambahan.
- source_word: ἀφιέναι ἁμαρτίας
  choice: untuk mengampuni dosa
  rationale: Dalam konteks ini ἀφίημι berarti mengampuni atau menghapuskan kesalahan; ungkapan ini jelas dan lazim dalam bahasa Indonesia.
- source_word: τῷ παραλελυμένῳ
  choice: kepada orang yang lumpuh itu
  rationale: Partisip perfek dipakai secara substantival. Bentuk ini alami dan berpusat pada orang, tanpa menjadikan kondisi fisiknya sebagai label kata benda.
- source_word: Σοὶ λέγω
  choice: Aku berkata kepadamu
  rationale: Mempertahankan penekanan pada penerima perintah yang ditandai oleh Σοί di awal klausa.
- source_word: ἔγειρε
  choice: Bangunlah
  rationale: Imperatif ini memerintahkan tindakan segera; 'Bangunlah' alami, tegas, dan bermartabat.
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: angkatlah tikarmu
  rationale: αἴρω berarti mengangkat untuk dibawa, sedangkan κλινίδιον menunjuk tempat berbaring kecil seperti tilam, dipan ringan, atau tikar.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: pulanglah ke rumahmu
  rationale: Secara harfiah berarti pergi ke rumahmu; 'pulanglah ke rumahmu' menyampaikan arah tujuan secara alami dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Gelar ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak Manusia
  alternative: Sang Manusia / Anak dari manusia
  rationale: Bentuk tradisional ini mempertahankan gelar diri Yesus, gema Daniel 7, dan ambiguitasnya antara ungkapan kemanusiaan serta gelar kristologis.
- issue: Nuansa ἐξουσία dalam pengampunan dosa
  choice: wewenang
  alternative: kuasa
  rationale: Perdebatan dalam konteks menyangkut hak Yesus untuk mengampuni dosa. 'Wewenang' menonjolkan prerogatif yang sah, bukan hanya kemampuan melakukan mukjizat.
- issue: Cakupan ἐπὶ τῆς γῆς
  choice: di bumi
  alternative: dalam ranah duniawi
  rationale: Terjemahan langsung membiarkan hubungan frasa ini dengan Anak Manusia, wewenang, dan pengampunan dosa tetap sebagaimana dalam teks, tanpa penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa εἰδῆτε berbentuk jamak, sedangkan 'kepadamu' mempertahankan bentuk tunggal dalam perintah kepada orang lumpuh. Tanda pisah mempertahankan sisipan narator yang memotong ucapan Yesus dalam bahasa Yunani.
