  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: id
  text: Namun, akan datang hari-hari, dan ketika mempelai laki-laki itu diambil dari mereka, pada hari-hari itu mereka akan berpuasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Namun, waktunya akan tiba
  rationale: Ungkapan idiomatis Yunani yang secara harfiah berarti 'hari-hari akan datang' menunjuk pada masa mendatang. Dalam bahasa Indonesia modern, 'waktunya akan tiba' menyampaikan maksud tersebut secara alami, sedangkan 'Namun' menandai kontras ringan dengan keadaan sekarang.
- source_word: ὅταν
  choice: ketika
  rationale: Dengan bentuk subjungtif aoris, kata ini memperkenalkan peristiwa mendatang dan paling wajar diterjemahkan 'ketika'.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: diambil dari mereka
  rationale: Bentuk pasif ἀπαρθῇ menyatakan bahwa mempelai itu disingkirkan atau diambil, bukan sekadar pergi atas kemauannya sendiri. Pilihan ini mempertahankan nuansa yang tidak menyenangkan serta unsur pemisahan.
- source_word: ὁ νυμφίος
  choice: mempelai laki-laki
  rationale: Istilah ini tepat dan lazim untuk νυμφίος serta mempertahankan gambaran pernikahan yang dipakai Yesus.
- source_word: τότε
  choice: Pada waktu itulah
  rationale: Ungkapan ini menegaskan hubungan waktu dan akibat sesudah mempelai laki-laki diambil.
- source_word: νηστεύσουσιν
  choice: mereka akan berpuasa
  rationale: Kata νηστεύω mengacu pada puasa, khususnya dalam konteks keagamaan, bukan sekadar tidak makan.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: Pada waktu itulah
  rationale: Bahasa Indonesia mengungkapkan rujukan kepada masa yang telah disebut secara alami melalui frasa ini; unsur penegasan tetap dipertahankan tanpa pengulangan 'hari-hari' yang kaku.
theological_decisions:
- issue: Apakah bentuk pasif 'diambil' perlu diperhalus menjadi kepergian yang netral
  choice: 'Mempertahankan bentuk pasif dan nuansa kuat: ''mempelai laki-laki diambil dari mereka'''
  alternative: mempelai laki-laki pergi meninggalkan mereka
  rationale: Bentuk pasif Yunani menyiratkan bahwa sesuatu terjadi terhadap mempelai laki-laki. Terjemahan ini menjaga ketegangan dan kemungkinan bayangan tentang kematian Yesus tanpa menjelaskannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur Yunani disampaikan dengan dua kalimat agar jelas bagi pembaca umum, sementara kontras, urutan waktu, bentuk pasif, dan penekanan pada saat puasa tetap terpelihara.
