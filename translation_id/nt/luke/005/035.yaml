review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan kontras, bentuk pasif «diambil dari mereka», dan tindakan berpuasa. Namun, ἐλεύσονται ... ἡμέραι ('akan datang hari-hari') diringkas menjadi «waktunya akan tiba», dan pengulangan eksplisit ἐν ἐκείναις ταῖς ἡμέραις ('pada hari-hari itu') tidak dipertahankan. Penanda hubungan καὶ ... τότε juga lebih baik dinyatakan dalam satu rangkaian kalimat.
  naturalness: Bahasa draf alami, tetapi «Pada waktu itulah» hanya menyatakan τότε dan tidak lagi menerjemahkan frasa penutup yang secara harfiah merujuk pada «hari-hari itu». Revisi tetap modern dan wajar sambil mempertahankan pengulangan yang disengaja dalam bahasa Yunani.
  terminology: «Mempelai laki-laki» sesuai untuk ὁ νυμφίος dan mempertahankan metafora pernikahan. «Berpuasa» tepat untuk νηστεύσουσιν. Tidak diperlukan catatan kaki, karena «diambil dari mereka» sudah menyampaikan bentuk pasif dan nuansa pengambilan paksa tanpa mempersempit makna.
  issues:
  - severity: medium
    issue: Unsur «hari-hari» pada awal dan akhir ayat tidak dipertahankan secara eksplisit.
    rationale: Teks Yunani menyebut ἡμέραι pada klausa pembuka dan mengulanginya dalam ἐν ἐκείναις ταῖς ἡμέραις. «Waktunya akan tiba» dan «Pada waktu itulah» meratakan pengulangan serta menghapus citra temporal yang ditekankan sumber.
  - severity: low
    issue: Struktur temporal καὶ ... τότε diringkas menjadi dua kalimat yang kurang memperlihatkan kaitannya.
    rationale: Pemisahan kalimat tidak salah, tetapi satu kalimat dengan «dan ketika ... pada hari-hari itu» lebih jelas mempertahankan urutan dan penekanan sumber.
  revised_text: Namun, akan datang hari-hari, dan ketika mempelai laki-laki itu diambil dari mereka, pada hari-hari itu mereka akan berpuasa.
