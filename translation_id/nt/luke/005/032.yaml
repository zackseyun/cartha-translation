  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: id
  text: Aku datang bukan untuk memanggil orang benar, melainkan orang berdosa supaya mereka bertobat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada pertobatan.” Frasa Yunani εἰς μετάνοιαν menyatakan tujuan atau sasaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐλήλυθα
  choice: Aku datang bukan
  rationale: Bentuk perfektum ἐλήλυθα menyatakan kedatangan yang berkaitan dengan misi Yesus saat ini. Bahasa Indonesia tidak perlu menandai aspek perfektum secara khusus; susunan “Aku datang bukan untuk” menyampaikan tujuan misi secara alami.
- source_word: καλέσαι
  choice: memanggil
  rationale: Infinitif ini menyatakan tujuan kedatangan. “Memanggil” mempertahankan cakupan makna yang dapat mencakup undangan maupun panggilan berwibawa tanpa mempersempitnya.
- source_word: δικαίους
  choice: orang benar
  rationale: Adjektiva jamak yang dipakai secara substantival. “Orang benar” mempertahankan kategori moral dan religius dalam teks tanpa menambahkan bahwa mereka hanya merasa atau dianggap benar.
- source_word: ἁμαρτωλούς
  choice: orang berdosa
  rationale: Padanan Indonesia yang jelas dan lazim untuk orang-orang yang digolongkan sebagai pendosa, dengan tetap mempertahankan daya moral dan sosial istilah Yunani.
- source_word: εἰς μετάνοιαν
  choice: supaya mereka bertobat
  rationale: Frasa εἰς dengan μετάνοιαν menyatakan tujuan atau sasaran. Bentuk klausa ini merupakan ungkapan Indonesia yang alami dan jelas, meskipun nomina Yunani dialihkan menjadi verba.
theological_decisions:
- issue: Apakah perkataan Yesus menyangkal adanya orang yang sungguh-sungguh benar atau merujuk kepada orang yang menganggap diri benar/dianggap benar
  choice: Mempertahankan kategori “orang benar” dan “orang berdosa” tanpa penjelasan tambahan.
  alternative: “orang yang menganggap dirinya benar” atau “orang yang dianggap benar”
  rationale: Teks Yunani menyatakan kontras itu secara langsung tanpa penanda ironi yang eksplisit. Penjelasan tambahan akan menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh ayat ini.
- issue: Cara menyatakan μετάνοια dalam bahasa Indonesia
  choice: “supaya mereka bertobat”
  alternative: “kepada pertobatan”
  rationale: “Bertobat” dalam bahasa Indonesia mencakup perubahan pikiran, sikap, dan arah hidup dalam konteks religius. Pilihan ini tidak mereduksinya menjadi perubahan pendapat secara intelektual saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kontras ditegaskan secara alami dengan pola “bukan ... melainkan ...”. Kata ganti “Aku” mengikuti ujaran langsung Yesus dan pemakaian umum dalam terjemahan Alkitab Indonesia.
