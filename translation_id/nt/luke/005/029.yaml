source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: id
  text: Lalu Lewi mengadakan perjamuan besar untuk dia di rumahnya. Ada banyak pemungut pajak dan orang-orang lain yang sedang makan sambil berbaring bersama mereka[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersama dia.” Teks Yunani berbunyi “bersama mereka”; acuan kata ganti jamak itu dapat dipahami sebagai kelompok yang baru disebutkan atau sebagai mereka yang berada dalam perjamuan yang berpusat pada Yesus.
    reason: alternative_reading
  - marker: b
    text: Pada perjamuan resmi di dunia Mediterania kuno, orang biasanya makan sambil berbaring atau bersandar di dekat meja.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: perjamuan besar
  rationale: δοχή menunjuk pada jamuan atau pesta yang diselenggarakan bagi para tamu. “Perjamuan besar” alami dalam bahasa Indonesia, sesuai dengan suasana makan, dan mempertahankan penekanan μεγάλην.
- source_word: αὐτῷ
  choice: untuk dia
  rationale: Kata ganti ini merujuk kepada Yesus dalam konteks langsung. Kata ganti dipertahankan agar tidak menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: di rumahnya
  rationale: Terjemahan langsung dan alami yang mempertahankan bahwa rumah itu milik Lewi.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: banyak pemungut pajak
  rationale: Secara harfiah frasa ini menggambarkan kerumunan besar pemungut pajak. Dalam konteks para tamu perjamuan, “banyak pemungut pajak” menyampaikan jumlah besar secara lebih alami daripada “kerumunan besar pemungut pajak”.
- source_word: ἄλλων
  choice: orang-orang lain
  rationale: Kata Yunani ini tidak menjelaskan identitas kelompok tambahan tersebut. Terjemahan ini mempertahankan ketidakspesifikan itu.
- source_word: μετ’ αὐτῶν
  choice: bersama mereka
  rationale: Bentuk kata ganti Yunani adalah jamak. Terjemahan utama mempertahankan bentuk itu tanpa menetapkan secara berlebihan siapa saja yang tercakup dalam acuannya.
- source_word: κατακείμενοι
  choice: sedang makan sambil berbaring
  rationale: Partisip ini dalam konteks perjamuan menunjuk pada posisi berbaring atau bersandar saat makan. Ungkapan ini menyampaikan tindakan makan sekaligus kebiasaan bersantap pada masa itu.
theological_decisions:
- issue: Acuan kata ganti αὐτῷ kepada Yesus
  choice: Mempertahankan kata ganti “dia”
  alternative: Menyebut “Yesus” secara eksplisit
  rationale: Konteks mengidentifikasi orang yang dimaksud, tetapi teks Yunani memakai kata ganti. Terjemahan tidak mengganti kata ganti itu dengan nama atau memakai kapitalisasi khusus yang tidak ditandai oleh bahasa sumber.
- issue: Acuan kata ganti jamak μετ’ αὐτῶν
  choice: bersama mereka
  alternative: bersama dia
  rationale: Bacaan SBLGNT memakai kata ganti jamak. Karena hubungan acuannya dapat dipahami dengan lebih dari satu cara dalam bahasa sasaran, bentuk jamak dipertahankan dalam teks dan kemungkinan pemahaman lain dicatat.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan mudah dipahami. “Lalu” mengalirkan narasi secara alami; “perjamuan” menjaga suasana jamuan khusus tanpa terdengar terlalu kuno. Kata ganti untuk Yesus tidak dikapitalisasi karena bahasa Yunani tidak membedakan kapitalisasi penghormatan.
