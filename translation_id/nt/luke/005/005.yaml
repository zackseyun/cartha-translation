id: LUK.5.5
reference: Luke 5:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: id
  text: Lalu Simon menjawab, “Guru, sepanjang malam kami sudah bekerja keras dan tidak menangkap apa pun. Namun, berdasarkan perkataan-Mu[a], aku akan menurunkan jala-jala itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “karena perkataan-Mu” atau “atas perkataan-Mu.”
    reason: Konstruksi Yunani dapat menyoroti perkataan Yesus sebagai dasar atau alasan tindakan Simon.
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: menjawab
  rationale: Gabungan partisip dan verba ini merupakan ungkapan Yunani yang lazim untuk memperkenalkan perkataan langsung. Dalam bahasa Indonesia, satu verba finit ‘menjawab’ menyampaikan maknanya dengan alami.
- source_word: Ἐπιστάτα
  choice: Guru
  rationale: Sapaan khas Lukas ini mengakui kewibawaan Yesus, tetapi tidak sama dengan κύριος (‘Tuhan’). ‘Guru’ merupakan sapaan Indonesia yang alami dalam konteks murid kepada sosok yang berwenang tanpa menambahkan gelar kristologis yang tidak dinyatakan oleh kata sumber.
- source_word: δι’ ὅλης νυκτὸς
  choice: sepanjang malam
  rationale: Frasa ini menyatakan kegiatan yang berlangsung selama seluruh malam; ‘sepanjang malam’ alami dan tepat dalam bahasa Indonesia.
- source_word: κοπιάσαντες
  choice: sudah bekerja keras
  rationale: Verba ini menekankan jerih payah dan usaha berat. ‘Bekerja keras’ jelas bagi pembaca modern, sedangkan ‘sudah’ menandai tindakan sebelumnya tanpa mengubah hubungan antarklausa.
- source_word: οὐδὲν ἐλάβομεν
  choice: tidak menangkap apa pun
  rationale: Dalam konteks menangkap ikan, λαμβάνω secara alami berarti ‘menangkap’. Ungkapan ini tidak perlu menambahkan objek ‘ikan’ karena konteksnya sudah jelas.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: Namun, berdasarkan perkataan-Mu
  rationale: Konstruksi ἐπί dengan datif menyatakan dasar atau alasan tindakan Simon. ‘Berdasarkan perkataan-Mu’ mempertahankan unsur ῥῆμα dan hubungan logisnya, sementara catatan kaki mencatat kemungkinan nuansa sebab.
- source_word: χαλάσω
  choice: aku akan menurunkan
  rationale: Bentuk mendatang orang pertama tunggal dipertahankan; dalam konteks ini verba tersebut berarti menurunkan jala ke air.
- source_word: τὰ δίκτυα
  choice: jala-jala itu
  rationale: Bentuk jamak teks Yunani dipertahankan secara eksplisit. Penentu ‘itu’ sesuai dengan artikel Yunani dan mengacu pada jala yang sedang dibicarakan.
- source_word: δὲ
  choice: Namun
  rationale: Partikel ini menandai kontras ringan antara usaha semalam yang gagal dan kesediaan Simon bertindak menurut perkataan Yesus.
theological_decisions:
- issue: Gelar Ἐπιστάτα bagi Yesus
  choice: Guru
  alternative: Tuan; Tuhan
  rationale: Kata sumber mengungkapkan pengakuan atas kewibawaan Yesus, tetapi bukan κύριος. ‘Guru’ menjaga perkembangan naratif dan tidak memasukkan bobot teologis tambahan dari terjemahan ‘Tuhan’; ‘Tuan’ mungkin terdengar sebagai sapaan sosial belaka dalam bahasa Indonesia modern.
- issue: Dasar tindakan Simon dalam ἐπὶ τῷ ῥήματί σου
  choice: berdasarkan perkataan-Mu
  alternative: karena perkataan-Mu; atas perkataan-Mu
  rationale: Terjemahan utama mempertahankan bahwa perkataan Yesus menjadi dasar tindakan Simon tanpa menentukan secara berlebihan apakah konstruksi itu terutama menyatakan dasar, sebab, atau dorongan untuk taat.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kontras serta peralihan dari ‘kami’ kepada ‘aku’ dipertahankan, demikian pula bentuk jamak ‘jala-jala’. Huruf kapital pada pronomina yang mengacu kepada Yesus mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
