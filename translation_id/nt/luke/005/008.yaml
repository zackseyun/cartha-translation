  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: id
  text: Namun, ketika Simon Petrus melihat hal itu[a], ia tersungkur di hadapan Yesus, dekat lutut-Nya, dan berkata, “Pergilah dariku, sebab aku ini orang berdosa[b], Tuhan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Yunani tidak menyebutkan objek dari kata “melihat”; “hal itu” mengacu pada peristiwa yang baru saja terjadi, khususnya hasil tangkapan ikan yang luar biasa.
    reason: implicit_object
  - marker: b
    text: Bahasa Yunani secara harfiah menyebut “seorang laki-laki yang berdosa”; kata itu merujuk kepada Simon Petrus sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ketika ... melihat hal itu
  rationale: Partisip aoris diterjemahkan sebagai keterangan waktu. Objeknya tersirat dari konteks, yaitu hasil tangkapan ikan yang luar biasa; “hal itu” ditambahkan agar kalimat Indonesia wajar.
- source_word: δὲ
  choice: Namun
  rationale: Menandai perkembangan narasi dengan nuansa peralihan dan kontras ringan antara mukjizat itu dan tanggapan Simon Petrus.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Kedua nama terdapat dalam teks Yunani dan dipertahankan.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: ia tersungkur di depan lutut Yesus
  rationale: Menggambarkan gerakan jatuh mendekat atau di hadapan seseorang serta mempertahankan gambaran jasmani yang menyebut lutut Yesus. “Tersungkur” menyampaikan sikap merendahkan diri secara alami dalam bahasa Indonesia.
- source_word: λέγων
  choice: dan berkata
  rationale: Bentuk partisip tindakan penyerta dialihkan menjadi verba berkoordinasi agar narasi Indonesia mengalir alami.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Pergilah dariku
  rationale: Imperatif ini meminta adanya jarak atau perpisahan. Pilihan ini lugas dan modern tanpa memakai “keluarlah,” yang dapat memberi kesan keliru seolah-olah Yesus berada di dalam diri Petrus.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi permohonan Simon Petrus; “sebab” sesuai dengan tuturan yang khidmat tetapi tetap modern.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: laki-laki yang berdosa
  rationale: Mempertahankan nomina maskulin ἀνήρ yang merujuk kepada Simon Petrus sendiri dan adjektiva predikatif ἁμαρτωλός, tanpa mengubahnya menjadi istilah abstrak.
- source_word: κύριε
  choice: Tuhan
  rationale: Mempertahankan sapaan hormat κύριε beserta kemungkinan bobot teologisnya dalam konteks mukjizat dan pengakuan dosa.
theological_decisions:
- issue: Makna sapaan κύριε kepada Yesus
  choice: Tuhan
  alternative: Tuan; Guru
  rationale: Dalam konteks tanggapan takut dan pengakuan dosa sesudah mukjizat, “Tuhan” mempertahankan penghormatan dan kemungkinan kedalaman kristologis tanpa menjelaskan secara berlebihan sejauh mana pemahaman Petrus pada saat itu.
- issue: Pengakuan diri Simon Petrus sebagai ἀνὴρ ἁμαρτωλός
  choice: laki-laki yang berdosa
  alternative: orang berdosa; seorang berdosa
  rationale: Teks menyatakan keberdosaan Petrus sendiri dengan nomina yang secara khusus maskulin. Terjemahan utama mempertahankan unsur itu, sementara catatan menjelaskan bentuk yang lebih lazim dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Tersungkur” mempertahankan kuatnya reaksi Petrus, sedangkan “Pergilah dariku” menghindari ungkapan arkais. Susunan “laki-laki yang berdosa” agak lebih eksplisit daripada ungkapan Indonesia sehari-hari, tetapi dipilih untuk menjaga unsur maskulin dalam teks sumber dan dijelaskan melalui catatan kaki.
