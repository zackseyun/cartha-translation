  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: id
  text: Bahkan semua rambut di kepala kalian telah terhitung. Jangan takut; kalian lebih berharga daripada banyak burung pipit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Bahkan ... pun
  rationale: Dalam konteks ini, gabungan tersebut memperkuat jaminan dari ayat sebelumnya. Ungkapan Indonesia ini menyampaikan daya intensifnya secara alami; pertentangan tidak perlu dibuat kaku dengan 'tetapi'.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: rambut di kepalamu pun semuanya
  rationale: Menyampaikan gambaran konkret dan cakupan πᾶσαι secara wajar dalam bahasa Indonesia. Bentuk tunggal 'kepalamu' dapat merujuk kepada setiap orang dalam kelompok yang disapa.
- source_word: ἠρίθμηνται
  choice: telah terhitung
  rationale: 'Mempertahankan aspek perfektum dan bentuk pasif: penghitungan telah dilakukan dan hasilnya tetap berlaku. ''Terhitung'' juga alami untuk menyatakan bahwa tidak sehelai pun luput dari pengetahuan Allah.'
- source_word: μὴ φοβεῖσθε
  choice: Jangan takut
  rationale: Padanan langsung, ringkas, dan lazim bagi larangan dalam bentuk kini.
- source_word: πολλῶν στρουθίων
  choice: banyak burung pipit
  rationale: Menjaga kesinambungan dengan burung kecil yang disebut dalam konteks langsung; 'burung pipit' merupakan padanan Indonesia yang umum.
- source_word: διαφέρετε
  choice: kamu lebih berharga daripada
  rationale: Dalam argumen dari yang lebih kecil kepada yang lebih besar, verba ini menyatakan keunggulan nilai, bukan sekadar perbedaan. Padanan ini jelas tanpa memperluas klaim melampaui konteks.
theological_decisions:
- issue: Perbandingan nilai para murid dengan burung pipit
  choice: kamu lebih berharga daripada banyak burung pipit
  alternative: kamu jauh melebihi banyak burung pipit
  rationale: Terjemahan utama mengungkapkan nilai komparatif yang tersirat dalam konteks pemeliharaan Allah, sambil tidak mengubahnya menjadi pernyataan filosofis yang lebih luas.
- issue: Pelaku yang menghitung rambut tidak disebut secara gramatikal
  choice: Mempertahankan bentuk pasif tanpa menambahkan 'Allah'
  alternative: Allah telah menghitung semuanya
  rationale: Konteks jelas mengarah kepada Allah, tetapi teks Yunani memakai bentuk pasif dan tidak menyebut pelaku secara eksplisit; terjemahan mempertahankan ketaktersebutan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak Yunani diterjemahkan dengan 'kamu' sebagai bentuk baku yang dapat menunjuk kelompok; frasa 'di kepalamu' lebih alami daripada konstruksi harfiah 'dari kepalamu'.
