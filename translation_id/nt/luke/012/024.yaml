  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: id
  text: 'Perhatikanlah burung-burung gagak[a]: mereka tidak menabur ataupun menuai; mereka tidak memiliki ruang penyimpanan ataupun lumbung[b], dan Allah memberi mereka makan. Betapa jauh lebih berharga kalian daripada burung-burung itu![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Amatilah burung-burung gagak” atau “Pikirkanlah baik-baik tentang burung-burung gagak.”
    reason: lexical_alternative
  - marker: b
    text: “Ruang penyimpanan” menerjemahkan ταμεῖον, sedangkan “lumbung” menerjemahkan ἀποθήκη. Teks Yunani memakai dua istilah berbeda untuk tempat penyimpanan.
    reason: lexical_alternative
  - marker: c
    text: Atau “Betapa jauh lebih bernilai kalian daripada burung-burung itu!”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Perhatikanlah
  rationale: Kata perintah ini mengajak para pendengar mengamati dengan saksama dan merenungkan, bukan sekadar melihat sepintas. Bentuk -lah mempertahankan daya imperatif secara wajar.
- source_word: κόρακας
  choice: burung-burung gagak
  rationale: κόραξ secara khusus menunjuk pada gagak. Bentuk ulang menandai jamak dan mempertahankan gambaran konkret dalam teks.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: tidak menabur ataupun menuai
  rationale: Terjemahan langsung dari pasangan kata kerja pertanian ini mempertahankan kesejajaran dan cakupan penyangkalannya.
- source_word: ταμεῖον
  choice: ruang penyimpanan
  rationale: ταμεῖον menunjuk pada ruang atau tempat dalam untuk menyimpan barang. Pilihan ini membedakannya dari ἀποθήκη.
- source_word: ἀποθήκη
  choice: lumbung
  rationale: Dalam konteks hasil pertanian, ἀποθήκη wajar diterjemahkan sebagai lumbung. Istilah ini tetap berbeda dari ruang penyimpanan.
- source_word: τρέφει
  choice: memberi mereka makan
  rationale: Ungkapan Indonesia yang alami ini menyampaikan tindakan Allah yang terus menyediakan makanan bagi burung-burung tersebut.
- source_word: πόσῳ μᾶλλον
  choice: Betapa jauh lebih
  rationale: Ungkapan ini menyampaikan kuatnya perbandingan dari yang lebih kecil kepada yang lebih besar.
- source_word: διαφέρετε
  choice: lebih berharganya kalian
  rationale: Dalam konteks ini διαφέρω berarti melampaui dalam nilai atau kepentingan, bukan sekadar berbeda. Bentuk 'kalian' mempertahankan orang kedua jamak.
- source_word: τῶν πετεινῶν
  choice: daripada burung-burung itu
  rationale: πετεινόν merupakan sebutan umum untuk burung. Kata 'itu' mengacu secara alami pada kelompok burung yang sedang dibicarakan tanpa membatasi perbandingan hanya pada gagak.
theological_decisions:
- issue: Pemeliharaan Allah dalam perbandingan
  choice: dan Allah memberi mereka makan
  alternative: tetapi Allah memelihara mereka
  rationale: Teks menyatakan tindakan aktif Allah memberi makan burung sebagai dasar argumen tentang nilai manusia. Terjemahan ini mempertahankan pernyataan tersebut tanpa memperluasnya menjadi rumusan doktrinal yang tidak dinyatakan secara eksplisit.
- issue: Makna komparatif διαφέρετε
  choice: lebih berharganya kalian
  alternative: lebih bernilai kalian / kalian lebih unggul
  rationale: Konteks menunjukkan perbandingan nilai manusia dengan burung. Pilihan ini mempertahankan daya teologis perbandingan tanpa menentukan dasar atau ukuran nilai itu melampaui yang dikatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Perhatikanlah' mempertahankan nada ajaran yang langsung; 'kalian' membuat bentuk jamak ὑμεῖς eksplisit. Tanda seru mencerminkan kuatnya seruan retoris pada akhir ayat.
