- from: 'Mereka akan terpecah[a]: ayah melawan anak laki-lakinya dan anak laki-laki melawan ayahnya, ibu melawan anak perempuannya dan anak perempuan melawan ibunya, ibu mertua melawan menantu perempuannya[b] dan menantu perempuan melawan ibu mertuanya.'
  to: 'Mereka akan terpecah[a]: ayah melawan anak laki-laki dan anak laki-laki melawan ayah, ibu melawan anak perempuan dan anak perempuan melawan ibu, ibu mertua melawan menantu perempuannya[b] dan menantu perempuan melawan ibu mertua.'
