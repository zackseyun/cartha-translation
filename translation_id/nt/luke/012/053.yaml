id: LUK.12.53
reference: Luke 12:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: id
  text: 'Mereka akan terpecah[a]: ayah melawan anak laki-laki dan anak laki-laki melawan ayah, ibu melawan anak perempuan dan anak perempuan melawan ibu, ibu mertua melawan menantu perempuannya[b] dan menantu perempuan melawan ibu mertua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terbagi-bagi.” Kata kerja Yunani menekankan terjadinya perpecahan di dalam suatu kelompok atau rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini juga dapat berarti “pengantin perempuan” dalam konteks lain, tetapi pasangannya dengan “ibu mertua” di sini mendukung arti “menantu perempuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: mereka akan terpecah
  rationale: Bentuk pasif futur ini menyatakan keadaan perpecahan yang akan terjadi. “Akan terpecah” mempertahankan nuansa pasif/resultatif dan terdengar wajar dalam bahasa Indonesia.
- source_word: ἐπὶ
  choice: melawan
  rationale: Dalam rangkaian hubungan antaranggot keluarga ini, ἐπί menyatakan pertentangan. “Melawan” mempertahankan kekuatan gambaran tersebut tanpa memperhalus konflik yang dinyatakan.
- source_word: πατήρ / υἱός
  choice: ayah / anak laki-laki
  rationale: Pilihan ini mempertahankan hubungan keluarga dan jenis kelamin yang dinyatakan secara khusus oleh istilah Yunani.
- source_word: μήτηρ / θυγάτηρ
  choice: ibu / anak perempuan
  rationale: Pilihan ini mempertahankan pasangan hubungan keluarga timbal balik dalam teks Yunani.
- source_word: πενθερά
  choice: ibu mertua
  rationale: Padanan kekerabatan yang jelas dan lazim dalam bahasa Indonesia modern.
- source_word: νύμφη
  choice: menantu perempuan
  rationale: Walaupun kata ini dapat berarti “pengantin perempuan” dalam konteks lain, pasangannya dengan πενθερά di sini menunjukkan arti “menantu perempuan”.
- source_word: αὐτῆς
  choice: -nya
  rationale: Akhiran posesif pada “menantu perempuannya” menyatakan hubungan yang ditandai secara eksplisit oleh αὐτῆς. Posesif juga digunakan pada pasangan lain agar hubungan timbal baliknya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat perpecahan yang digambarkan
  choice: Mempertahankan gambaran tajam tentang pertentangan dalam keluarga sebagai akibat yang dinyatakan dalam konteks misi Yesus.
  alternative: Menjadikannya peribahasa umum tentang ketegangan keluarga atau melunakkan pertentangan tersebut.
  rationale: Ayat ini merinci perpecahan dalam keluarga secara timbal balik sebagai kelanjutan konteks sebelumnya. Terjemahan tidak menyiratkan bahwa permusuhan keluarga diperintahkan atau disetujui, tetapi juga tidak meredakan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan pasangan keluarga dipertahankan untuk mencerminkan struktur paralel dan timbal balik teks Yunani; bentuk posesif dipakai agar hubungan kekerabatan terdengar alami dan tidak rancu.
