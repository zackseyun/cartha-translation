id: LUK.12.9
reference: Luke 12:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: id
  text: Namun, orang yang menyangkal Aku di hadapan manusia akan disangkal di hadapan malaikat-malaikat Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan tidak diakui”; kata Yunani ini berkerabat dengan kata yang diterjemahkan “menyangkal” dan dapat membawa nuansa penolakan atau tidak mengakui seseorang sebagai miliknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός
  choice: Namun, orang yang menyangkal
  rationale: Partisipel aoris dengan artikel berfungsi sebagai nomina dan menyatakan prinsip umum. Bentuk kini dalam bahasa Indonesia terdengar wajar, sedangkan “namun” menandai kontras dengan ayat sebelumnya.
- source_word: με
  choice: Aku
  rationale: Pronomina objek ini merujuk langsung kepada Yesus dan dipertahankan secara eksplisit.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Padanan alami yang mempertahankan nuansa tindakan terbuka atau kesaksian di depan pihak lain.
- source_word: τῶν ἀνθρώπων
  choice: manusia
  rationale: Bentuk kolektif ini mencakup umat manusia tanpa menyiratkan hanya laki-laki dan mempertahankan kontras dengan malaikat-malaikat Allah.
- source_word: ἀπαρνηθήσεται
  choice: akan disangkal
  rationale: Bentuk pasif futur dipertahankan, sekaligus menjaga kesejajaran leksikal dan timbal balik yang khidmat dengan “menyangkal”.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: malaikat-malaikat Allah
  rationale: Terjemahan langsung dan alami dari frasa genitif Yunani yang mempertahankan latar hadirat surgawi.
theological_decisions:
- issue: Pelaku tersirat dalam “akan disangkal”
  choice: Mempertahankan bentuk pasif tanpa menambahkan pelaku.
  alternative: Menambahkan “oleh Anak Manusia” atau “oleh Allah”.
  rationale: Teks Yunani tidak menyebutkan pelakunya. Konteks dapat mengarahkan pembaca kepada Yesus atau kepada suatu pasif ilahi, tetapi terjemahan tidak seharusnya menentukan hal yang dibiarkan tersirat oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk pronomina yang merujuk kepada Yesus. Bentuk pasif dan pengulangan “menyangkal ... disangkal” dipertahankan untuk mencerminkan struktur serta ketegangan teks sumber.
