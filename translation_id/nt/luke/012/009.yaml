  source_fidelity: 'Teks Indonesia secara akurat mencerminkan struktur dan makna Yunani: δέ sebagai kontras (“Namun”), partisipel substantival sebagai pernyataan umum (“orang yang menyangkal”), objek eksplisit “Aku,” dua kali ἐνώπιον sebagai “di hadapan,” serta pasif futur ἀπαρνηθήσεται (“akan disangkal”). Pasif terakhir dipertahankan tanpa menambahkan pelaku, sesuai dengan ketidakjelasan yang disengaja dalam teks sumber.'
