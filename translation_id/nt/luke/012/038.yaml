id: LUK.12.38
reference: Luke 12:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: id
  text: Sekalipun ia datang pada giliran jaga kedua[a], atau bahkan pada giliran jaga ketiga, lalu mendapati mereka dalam keadaan demikian, berbahagialah hamba-hamba itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lengkap, “pada giliran jaga malam kedua, atau bahkan pada giliran jaga malam ketiga.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka itu.” Yang dimaksud ialah para hamba yang disebut dalam konteks langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Sekalipun ... atau bahkan
  rationale: Bentuk berulang ini menyatakan kemungkinan yang bersifat konsesif dan tidak tentu. Ungkapan ini mempertahankan penekanan pengulangan Yunani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: pada giliran jaga kedua ... pada giliran jaga ketiga
  rationale: φυλακή di sini menunjuk pada pembagian waktu jaga malam, bukan penjara atau pos penjagaan. Kata “malam” tersirat oleh konteks dan dijelaskan dalam catatan kaki.
- source_word: ἔλθῃ
  choice: ia datang
  rationale: Subjungtif aoris dalam konstruksi bersyarat ini menyatakan kemungkinan pada waktu mendatang; bentuk sederhana “ia datang” menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: εὕρῃ οὕτως
  choice: mendapati mereka dalam keadaan demikian
  rationale: οὕτως merujuk kembali pada keadaan para hamba dalam konteks sebelumnya. Objek “mereka” dipasok dari konteks agar kalimat Indonesia jelas dan alami.
- source_word: μακάριοι
  choice: berbahagialah
  rationale: Pilihan ini mempertahankan nuansa keadaan yang diperkenan dan patut disebut bahagia, bukan sekadar perasaan senang atau keberuntungan.
- source_word: ἐκεῖνοι
  choice: hamba-hamba itu
  rationale: Secara harfiah kata ini berarti “mereka itu,” tetapi acuannya jelas kepada para hamba dalam konteks langsung. Menyebutkan acuannya mencegah ketaksaan tanpa menambah gagasan baru.
theological_decisions:
- issue: Penyebutan acuan ἐκεῖνοι
  choice: hamba-hamba itu
  alternative: mereka itu
  rationale: Teks Yunani memakai kata ganti penunjuk, sedangkan konteks langsung menunjukkan bahwa yang dimaksud ialah para hamba sang tuan. Penyebutan “hamba-hamba” memperjelas acuan tanpa menentukan hal teologis yang tidak dinyatakan oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. “Giliran jaga” dipilih karena mudah dipahami pembaca umum, sedangkan susunan “Sekalipun ... atau bahkan ...” mempertahankan penekanan teks Yunani.
