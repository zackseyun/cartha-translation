id: LUK.12.51
reference: Luke 12:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: id
  text: Apakah kalian menyangka bahwa Aku datang untuk memberikan damai[a] di bumi[b]? Tidak, Aku berkata kepada kalian, melainkan perpecahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan damai”; dapat juga diterjemahkan secara idiomatis “membawa damai.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di negeri.” Kata Yunani yang dipakai dapat berarti “bumi” atau “negeri,” tetapi cakupan yang lebih luas lebih mungkin di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: Apakah kalian menyangka
  rationale: Bentuk orang kedua jamak ini membuka pertanyaan retoris yang menantang anggapan para pendengar. “Menyangka” alami dalam bahasa Indonesia dan mempertahankan nuansa asumsi yang dipersoalkan.
- source_word: εἰρήνην
  choice: damai
  rationale: “Damai” mempertahankan cakupan luas εἰρήνη, yang dalam konteks ini terutama menyangkut kerukunan sosial, tanpa membatasinya hanya pada ketenangan batin.
- source_word: παρεγενόμην
  choice: Aku datang
  rationale: Aoristus παραγίνομαι di sini menunjuk pada kedatangan atau tampilnya Yesus dengan suatu tujuan. “Aku datang” langsung dan alami.
- source_word: δοῦναι
  choice: untuk memberikan
  rationale: Infinitif ini menyatakan tujuan dan secara langsung berarti “memberikan.” Pilihan tersebut mempertahankan gambaran leksikal Yunani, meskipun “membawa” juga lazim secara idiomatis.
- source_word: ἐν τῇ γῇ
  choice: di bumi
  rationale: γῆ dapat berarti “bumi” atau “tanah/negeri.” Konteksnya mendukung cakupan luas, sehingga “di bumi” lebih tepat daripada pembatasan pada suatu negeri tertentu.
- source_word: οὐχί
  choice: Tidak
  rationale: Jawaban negatif yang tegas terhadap pertanyaan retoris; “Tidak” ringkas dan kuat.
- source_word: λέγω ὑμῖν
  choice: Aku berkata kepada kalian
  rationale: Ungkapan ini mempertahankan formula tutur langsung dan menunjukkan bahwa ὑμῖν berjumlah jamak melalui “kalian.”
- source_word: ἀλλ’ ἢ
  choice: melainkan
  rationale: '“Melainkan” secara alami menyatakan pertentangan tajam setelah penyangkalan: bukan damai, tetapi perpecahan.'
- source_word: διαμερισμόν
  choice: perpecahan
  rationale: Kata benda ini menunjuk pada pembagian atau perpecahan, khususnya perpecahan sosial dan keluarga dalam ayat-ayat berikutnya. “Perpecahan” mempertahankan cakupan tersebut.
theological_decisions:
- issue: Apakah pernyataan Yesus perlu diperhalus agar tidak tampak bertentangan dengan teks-teks tentang damai
  choice: Mempertahankan kontras tegas antara damai dan perpecahan.
  alternative: Menafsirkannya secara lebih lunak sebagai konflik yang hanya merupakan akibat sampingan yang tidak disengaja.
  rationale: Teks Yunani sengaja menyatakan kontras yang tajam. Konteks berikutnya menjelaskan dampak memecah-belah dari misi Yesus di antara manusia, terutama dalam keluarga, tanpa meniadakan tema damai di bagian Kitab Suci lainnya. Terjemahan tidak boleh menghapus ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menampilkan bentuk jamak yang nyata dalam bahasa Yunani. Susunan akhir yang eliptis dipertahankan agar kontras retoris teks sumber tetap tajam.
