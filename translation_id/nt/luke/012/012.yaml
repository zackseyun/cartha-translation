translation:
  language: id
  text: Sebab pada saat itu juga Roh Kudus akan mengajar kalian apa yang harus kalian katakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pada saat itu.” Ungkapan Yunani ini menekankan tepatnya waktu ketika pertolongan diperlukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan janji ini dengan jaminan dalam ayat sebelumnya.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Roh Kudus
  rationale: Padanan baku dalam bahasa Indonesia modern dan tetap menampilkan Roh Kudus sebagai pelaku yang mengajar.
- source_word: διδάξει
  choice: akan mengajar
  rationale: Mencerminkan bentuk futur aktif dan arti langsung verba διδάσκω.
- source_word: ὑμᾶς
  choice: kalian
  rationale: Menandai dengan jelas bahwa kata ganti orang kedua ini berbentuk jamak, dengan ragam yang alami bagi pembaca modern.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: pada saat itu juga
  rationale: Ungkapan ini secara alami menyampaikan penekanan pada momen tepat ketika pertolongan diperlukan; 'saat' lebih idiomatis daripada 'jam' untuk ὥρα dalam konteks ini.
- source_word: ἃ
  choice: apa yang
  rationale: Padanan idiomatis bagi pronomina relatif netral jamak yang memperkenalkan isi perkataan.
- source_word: δεῖ
  choice: harus
  rationale: Mempertahankan nuansa keharusan atau kebutuhan yang terkandung dalam δεῖ tanpa memperlemahnya.
- source_word: εἰπεῖν
  choice: kalian katakan
  rationale: Menyampaikan arti λέγω secara alami dalam konstruksi bahasa Indonesia dan mengungkap subjek tersirat sesuai konteks.
theological_decisions:
- issue: Rujukan dan peran Roh Kudus
  choice: Roh Kudus ditampilkan sebagai pelaku pribadi yang akan secara aktif mengajar para murid apa yang harus mereka katakan.
  alternative: Roh Kudus dipahami sebagai pengaruh atau ilham ilahi yang impersonal.
  rationale: Roh Kudus merupakan subjek gramatikal dari verba aktif 'akan mengajar'. Terjemahan mempertahankan penggambaran tekstual tersebut tanpa menambahkan rumusan doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, wajar, dan bermartabat. 'Kalian' dipilih untuk memperjelas bentuk jamak ὑμᾶς; 'pada saat itu juga' menangkap penekanan αὐτῇ tanpa terjemahan harfiah yang kaku.
