source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: id
  text: 'Namun, Aku akan menunjukkan kepada kalian siapa yang harus ditakuti: takutlah kepada Dia yang, setelah membunuh, berwenang untuk melemparkan ke dalam Gehena.[a] Ya, Aku berkata kepada kalian, takutlah kepada orang itulah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “neraka”. Istilah Yunaninya adalah Gehena, istilah penghakiman yang berakar pada gambaran Lembah Hinom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: Aku akan menunjukkan
  rationale: Bentuk futur ini menyatakan bahwa Yesus akan menunjukkan atau menjelaskan pihak yang patut ditakuti; “menunjukkan” mempertahankan makna dasarnya tanpa menambahkan nuansa “memperingatkan”.
- source_word: ὑμῖν
  choice: kepada kalian
  rationale: Pronomina Yunani berbentuk jamak. “Kalian” mengungkapkan jumlah itu dengan jelas dalam bahasa Indonesia modern.
- source_word: τίνα φοβηθῆτε
  choice: siapa yang harus ditakuti
  rationale: Ungkapan ini merupakan pertanyaan tidak langsung. Bentuk pasif “harus ditakuti” alami dalam bahasa Indonesia dan mempertahankan fokus pada pihak yang menjadi objek rasa takut.
- source_word: φοβήθητε
  choice: takutlah kepada
  rationale: Imperatif ini diulang untuk penegasan. “Takutlah kepada” mempertahankan daya peringatan yang kuat; “hormatilah” akan terlalu mempersempit maknanya menjadi penghormatan.
- source_word: τὸν
  choice: Dia yang
  rationale: Artikel ini dipakai secara substantival, menunjuk kepada satu pihak tertentu. “Dia yang” alami dalam bahasa Indonesia dan tidak menambahkan sebutan yang tidak terdapat dalam teks.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: setelah membunuh
  rationale: Konstruksi infinitif berartikel dengan μετά menyatakan urutan waktu. Terjemahan ini ringkas dan mempertahankan subjek tersirat yang sama dengan “Dia yang”.
- source_word: ἔχοντα ἐξουσίαν
  choice: berwenang
  rationale: ἐξουσία menunjuk pada wewenang atau hak, bukan sekadar kemampuan atau kekuatan; “berwenang” menangkap nuansa itu secara padat.
- source_word: ἐμβαλεῖν εἰς
  choice: melemparkan ke dalam
  rationale: Pilihan ini mempertahankan gambaran tindakan yang kuat dari verba Yunani dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: γέενναν
  choice: Gehena
  rationale: Transliterasi istilah Yunani mempertahankan latar citra Lembah Hinom dan tidak langsung menyamakannya dengan seluruh pengertian teologis yang kemudian melekat pada kata “neraka”.
- source_word: ναί
  choice: Ya
  rationale: Kata ini memberi penegasan langsung dan kuat, yang secara alami disampaikan dengan “Ya”.
- source_word: τοῦτον
  choice: Dia
  rationale: Pronomina penunjuk ini kembali secara tegas kepada pihak yang baru disebut. Pengulangan “Dia” dalam klausa penutup mempertahankan penekanan tanpa menghasilkan ungkapan Indonesia yang kaku.
theological_decisions:
- issue: Penerjemahan γέεννα dalam konteks penghakiman
  choice: Gehena
  alternative: neraka
  rationale: Teks utama mempertahankan istilah khusus Yunani beserta latar Yahudinya dan menghindari memasukkan seluruh asosiasi teologis yang dapat terkandung dalam istilah Indonesia “neraka”. Padanan yang lebih interpretatif itu tetap dicantumkan dalam catatan kaki.
- issue: Identitas pihak yang harus ditakuti
  choice: Dia yang ... berwenang
  alternative: Allah yang ... berwenang
  rationale: Konteks mengarahkan pembaca kepada Allah, tetapi ayat Yunani tidak menyebut nama atau gelar “Allah”. Terjemahan mempertahankan rujukan pronominal teks dan tidak menambahkan identifikasi eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Kalian” dipakai untuk menyatakan bentuk jamak ὑμῖν dengan jelas. Kapitalisasi “Aku” dan “Dia” mengikuti kelaziman tulisan keagamaan Indonesia bagi rujukan kepada Allah, tanpa menambahkan gelar ilahi ke dalam teks.
