  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: id
  text: Dan mengapa kamu tidak menilai sendiri apa yang benar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang adil” atau “hal yang benar.”
