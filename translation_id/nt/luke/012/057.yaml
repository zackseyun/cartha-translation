lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Mengapa
  rationale: Dalam konteks ini, rangkaian partikel tersebut memperkenalkan pertanyaan retoris lanjutan. “Mengapa” alami dalam bahasa Indonesia; hubungan dengan ucapan sebelumnya tetap tampak dari alur konteks tanpa perlu menerjemahkan setiap partikel secara kaku.
- source_word: ἀφ’ ἑαυτῶν
  choice: sendiri
  rationale: Ungkapan ini menunjuk pada penilaian yang berasal dari diri atau prakarsa mereka sendiri. “Sendiri” menyampaikan hal itu secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: οὐ κρίνετε
  choice: tidak menilai
  rationale: κρίνω di sini berarti membuat penilaian atau menentukan berdasarkan pertimbangan. “Menilai” mempertahankan daya evaluatifnya dan sesuai dengan konteks pertanyaan retoris.
- source_word: τὸ δίκαιον
  choice: apa yang benar
  rationale: Adjektiva netral tunggal ini dipakai sebagai nomina, yakni sesuatu yang benar, tepat, atau adil. “Apa yang benar” alami dan mempertahankan cakupan etis yang luas.
theological_decisions:
- issue: Nuansa τὸ δίκαιον
  choice: apa yang benar
  alternative: apa yang adil; hal yang benar
  rationale: Konteksnya menyangkut kemampuan menilai tindakan atau keputusan yang patut. “Benar” mempertahankan keluasan makna dan tidak mempersempitnya hanya pada keadilan dalam arti hukum.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan “menilai sendiri” alami bagi pembaca umum dan mempertahankan tekanan pada pertimbangan pribadi.
