base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: id
  text: Berbahagialah hamba itu yang akan didapati tuannya, ketika ia datang, sedang melakukan demikian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Berbahagialah
  rationale: Mempertahankan corak ucapan bahagia dan bobot religiusnya, bukan sekadar perasaan senang atau keberuntungan keadaan.
- source_word: δοῦλος
  choice: hamba
  rationale: Menyatakan orang yang berada di bawah wewenang tuan dalam latar rumah tangga; pilihan ini alami dalam bahasa Alkitab Indonesia dan tetap mencerminkan kewajiban pelayanannya.
- source_word: ἐκεῖνος
  choice: itu
  rationale: 'Mempertahankan kekhususan dan penekanan demonstratif: hamba yang dimaksud itu.'
- source_word: κύριος
  choice: tuan
  rationale: Dalam gambaran langsung perumpamaan, kata ini menunjuk kepada kepala rumah yang berwenang atas hamba. Kemungkinan gema gelar 'Tuhan' dipertahankan dalam catatan kaki.
- source_word: ἐλθὼν
  choice: ketika datang
  rationale: Partisip aoris ini secara alami menyatakan waktu dan urutan tindakan terhadap verba utama.
- source_word: εὑρήσει
  choice: mendapati
  rationale: Menyampaikan makna menemukan seseorang dalam suatu keadaan; nuansa masa depan dinyatakan secara alami melalui konstruksi bersyarat bahasa Indonesia.
- source_word: ποιοῦντα οὕτως
  choice: sedang berbuat demikian
  rationale: Menunjukkan bahwa hamba didapati tengah melakukan tindakan yang baru saja diperintahkan atau digambarkan, sambil tetap merujuk ke konteks sebelumnya.
theological_decisions:
- issue: Kemungkinan gema kristologis κύριος dalam perumpamaan tentang kedatangan kembali seorang tuan
  choice: tuan dalam teks utama
  alternative: Tuhan
  rationale: Makna permukaan dalam latar rumah tangga adalah tuan dari hamba tersebut. Namun, konteks yang lebih luas dapat mengarahkan penerapannya kepada kedatangan Tuhan; ketegangan ini dipertahankan melalui catatan kaki.
- issue: Hubungan μακάριος dengan syarat hamba didapati sedang bertindak demikian
  choice: Berbahagialah ... jika ... mendapati
  alternative: Berbahagialah ... yang ... akan didapati
  rationale: Konstruksi 'jika' menghasilkan bahasa Indonesia yang alami untuk keadaan yang membuat hamba itu disebut berbahagia, tanpa mengubah kepastian bentuk futur Yunani menjadi keraguan tentang kedatangan tuannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan dibuat alami tanpa menghilangkan penekanan pada 'hamba itu' atau ambiguitas antara 'tuan' dan 'Tuhan'.
