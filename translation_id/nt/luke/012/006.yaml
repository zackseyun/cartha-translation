  source_fidelity: 'Terjemahan pada umumnya setia pada teks Yunani: pertanyaan retoris οὐχί, jumlah lima burung dan dua mata uang, serta penegasan bahwa tidak satu pun terlupakan di hadapan Allah tersampaikan dengan baik. Namun, «dua as» tidak tepat mempertahankan nama mata uang yang disebut teks, yaitu ἀσσάρια (asarion/assaria), dan tidak selaras dengan catatan kaki yang sendiri menyebut «dua asarion».'
  naturalness: Kalimatnya baku dan mudah dipahami. «Tidak seekor pun di antaranya» sedikit lebih alami daripada «tidak seekor pun dari antaranya» dalam konstruksi ini.
  terminology: «Burung pipit», «dijual», «dilupakan», dan «di hadapan Allah» merupakan pilihan yang wajar dan dekat dengan sumber. Nama mata uang kuno sebaiknya ditransliterasikan secara konsisten sebagai «asarion», bukan disingkat menjadi «as», karena «as» dapat mengaburkan bentuk dan istilah mata uang Yunani yang dipakai teks.
  issues:
