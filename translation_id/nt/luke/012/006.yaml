  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: id
  text: Bukankah lima ekor burung pipit dijual seharga dua asarion[a]? Namun, tidak seekor pun di antaranya dilupakan di hadapan Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Asarion adalah uang logam tembaga Romawi yang bernilai kecil; Yunani: dua asarion.'
    reason: cultural_note
  - marker: b
    text: Atau, “tidak seekor pun di antaranya luput dari perhatian Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: burung pipit
  rationale: Dalam konteks ini, bentuk diminutif tersebut lazim dipahami sebagai burung pipit, yaitu burung kecil yang murah; pilihan ini alami dan spesifik dalam bahasa Indonesia.
- source_word: πωλοῦνται
  choice: dijual
  rationale: Bentuk kini pasif paling langsung dan alami diterjemahkan dengan bentuk pasif Indonesia 'dijual'.
- source_word: ἀσσαρίων δύο
  choice: seharga dua as
  rationale: '''As'' adalah nama Indonesia yang ringkas untuk asarion, uang logam tembaga Romawi bernilai kecil. Nama mata uang kuno dipertahankan agar tidak disamakan secara keliru dengan nominal modern.'
- source_word: ἐπιλελησμένον
  choice: dilupakan
  rationale: Partisip perfek menyatakan keadaan telah dilupakan; 'dilupakan' mempertahankan makna leksikal tanpa memperluasnya menjadi pernyataan yang lebih lengkap tentang pemeliharaan ilahi.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: di hadapan Allah
  rationale: Ungkapan ini secara dekat dan wajar menyampaikan bahwa burung-burung itu tidak terlupakan dalam pandangan atau kehadiran Allah.
- source_word: οὐχὶ ... ;
  choice: Bukankah ...?
  rationale: '''Bukankah'' secara alami menyampaikan pertanyaan retoris yang mengharapkan jawaban ya.'
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: Namun, tidak seekor pun dari antaranya
  rationale: '''Namun'' menyatakan kontras kontekstual antara rendahnya harga burung-burung itu dan perhatian Allah, sedangkan ''tidak seekor pun'' mempertahankan penekanan pada bahkan satu ekor.'
theological_decisions:
- issue: Bahasa tentang ingatan dan pemeliharaan Allah
  choice: tidak seekor pun dari antaranya dilupakan di hadapan Allah
  alternative: tidak seekor pun dari antaranya luput dari perhatian Allah
  rationale: '''Dilupakan'' paling dekat dengan makna verba Yunani dan mempertahankan gambaran teks. Alternatif ''luput dari perhatian'' memperjelas maksud, tetapi lebih interpretatif dan dapat mengurangi ketegangan metaforisnya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Burung pipit' mudah dipahami, sedangkan istilah mata uang kuno 'as' dijelaskan dalam catatan kaki. Susunan kalimat mempertahankan pertanyaan retoris dan kontras teks Yunani.
