id: LUK.12.34
reference: Luke 12:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: id
  text: Sebab di mana hartamu berada, di situ juga hatimu akan berada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: di mana
  rationale: Memperkenalkan klausa tempat secara langsung dan wajar dalam pernyataan bernada amsal; bentuk ini juga dapat dipahami secara umum tanpa perlu diperluas menjadi “di mana pun”.
- source_word: γάρ
  choice: sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan perkataan ini dengan ajaran sebelumnya.
- source_word: θησαυρός
  choice: harta
  rationale: Dalam bahasa Indonesia modern, “harta” merupakan padanan alami yang tetap mencakup kekayaan bernilai dan daya metaforis dari sesuatu yang sangat dihargai.
- source_word: καρδία
  choice: hati
  rationale: Mempertahankan istilah antropologis Alkitab untuk pusat keinginan, kasih, kehendak, dan orientasi batin seseorang tanpa mempersempitnya menjadi satu unsur psikologis.
- source_word: ἐκεῖ
  choice: di situ
  rationale: Menjaga susunan korelatif tempat “di mana ... di situ ...” dalam teks Yunani.
- source_word: καὶ
  choice: juga
  rationale: Mempertahankan penekanan aditif bahwa hati menyertai tempat harta berada.
- source_word: ἔσται
  choice: akan berada
  rationale: Menjaga bentuk waktu mendatang yang eksplisit dalam bahasa Yunani serta nuansa akibat atau kepastian yang bersifat amsal.
- source_word: ὑμῶν
  choice: -mu
  rationale: Kedua bentuknya adalah posesif orang kedua jamak. Bahasa Indonesia tidak membedakan jumlah pada enklitik “-mu”; dalam konteks pengajaran kepada para pendengar, bentuk ini alami dan langsung.
theological_decisions:
- issue: Makna antropologis “hati”
  choice: Mempertahankan “hati” sebagai pusat kasih, keinginan, kehendak, dan komitmen batin manusia.
  alternative: Menerjemahkannya secara lebih interpretatif sebagai “keinginan”, “pikiran”, atau “diri batin”.
  rationale: Perkataan ini menggambarkan orientasi batin seseorang yang mengikuti apa yang dianggap bernilai. “Hati” mempertahankan keluasan makna teologis dan kesinambungan metafora tanpa menentukan hanya satu aspek batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada luhur. Struktur “di mana ... di situ ...” mempertahankan kesejajaran retoris teks Yunani. “Hartamu” dan “hatimu” dipilih agar ayat terdengar alami dan mudah diingat; bentuk orang kedua jamak dalam sumber tidak dapat ditandai secara eksplisit melalui “-mu” tanpa menambah kata seperti “kalian”.
