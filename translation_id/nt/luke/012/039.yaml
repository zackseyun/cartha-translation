base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: id
  text: 'Namun, ketahuilah ini: Seandainya tuan rumah sudah tahu pada jam berapa pencuri akan datang, ia tentu tidak akan membiarkan rumahnya dibobol.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “digali sampai tembus,” yang mencerminkan praktik menembus dinding rumah.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Namun, ketahuilah ini
  rationale: Bentuk imperatif jamak γινώσκετε diterjemahkan secara langsung dengan “ketahuilah”; δέ menandai peralihan atau kontras dan dibawa oleh “Namun”.
- source_word: οἰκοδεσπότης
  choice: tuan rumah
  rationale: Ungkapan ini menunjuk kepada kepala atau penguasa rumah tangga. “Tuan rumah” alami dalam bahasa Indonesia dan tetap mempertahankan perannya dalam rumah tersebut.
- source_word: ποίᾳ ὥρᾳ
  choice: pada jam berapa
  rationale: Terjemahan ini mempertahankan kekhususan ὥρα dan cocok dengan tema kesiapsiagaan dalam konteks.
- source_word: ὁ κλέπτης ἔρχεται
  choice: pencuri akan datang
  rationale: Walaupun ἔρχεται berbentuk kini, dalam kalimat pengandaian dari sudut pandang tuan rumah, “akan datang” secara alami menyatakan kedatangan yang diperkirakan.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: ia tidak akan membiarkan
  rationale: Gabungan ini menyatakan akibat yang berlawanan dengan kenyataan; bentuk Indonesia tersebut menyampaikan sifat kontrafaktualnya dengan jelas.
- source_word: διορυχθῆναι
  choice: dibobol
  rationale: Secara harfiah verba ini berarti digali atau ditembus, khususnya melalui dinding rumah. “Dibobol” menyampaikan tindakan masuk secara paksa dengan alami, sedangkan gambaran harfiahnya dijelaskan dalam catatan kaki.
- source_word: τὸν οἶκον αὐτοῦ
  choice: rumahnya
  rationale: “Rumah” merupakan padanan langsung οἶκος dan sesuai dengan gambaran bangunan yang ditembus pencuri.
