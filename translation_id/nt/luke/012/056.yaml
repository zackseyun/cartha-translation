  naturalness: Kalimat revisi tetap baku, jelas, dan bernada teguran. “Bagaimana mungkin ... tidak tahu ...?” menyampaikan daya retoris πῶς secara lebih dekat daripada “mengapa,” tanpa menjadi tidak alami. “Keadaan bumi dan langit” adalah ungkapan Indonesia yang wajar untuk tampilan yang diamati dalam konteks cuaca.
  terminology: “Orang-orang munafik” tepat untuk ὑποκριταί dalam teguran moral. “Menilai” merupakan padanan yang dapat dipakai secara konsisten untuk δοκιμάζειν dalam kedua kemunculannya. “Masa ini” lebih tepat daripada “zaman ini” untuk καιρός, sambil mempertahankan kemungkinan bahwa masa tersebut bermakna atau menentukan.
