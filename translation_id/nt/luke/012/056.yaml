  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: id
  text: Hai, orang-orang munafik! Kalian tahu menilai keadaan bumi dan langit, tetapi bagaimana mungkin kalian tidak tahu menilai masa ini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “waktu ini” atau “saat yang menentukan ini”. Kata Yunani kairos dapat menunjuk pada masa atau kesempatan yang bermakna, bukan hanya waktu secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hai orang-orang munafik!
  rationale: Bentuk vokatif ini merupakan teguran langsung. 'Orang-orang munafik' menyampaikan kepura-puraan moral yang dimaksud, bukan arti harfiah sebagai pemain sandiwara.
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: keadaan bumi dan langit
  rationale: πρόσωπον secara harfiah berarti 'wajah', tetapi dalam ungkapan ini menunjuk pada keadaan atau tampilan yang terlihat. 'Keadaan' wajar dalam konteks mengenali tanda-tanda cuaca; γῆ dan οὐρανός masing-masing diterjemahkan 'bumi' dan 'langit'.
- source_word: οἴδατε δοκιμάζειν
  choice: kalian tahu menilai
  rationale: οἴδατε dengan infinitif menyatakan pengetahuan atau kemampuan, sedangkan δοκιμάζειν di sini berarti menguji dengan pengamatan lalu mengenali maknanya. 'Tahu menilai' mempertahankan unsur evaluasi tanpa memperjelasnya secara berlebihan sebagai penafsiran.
- source_word: τὸν καιρὸν τοῦτον
  choice: zaman ini
  rationale: καιρός menunjuk pada suatu masa atau saat yang bermakna, bukan sekadar waktu kronologis. 'Zaman ini' alami dalam bahasa Indonesia dan mempertahankan signifikansi kontekstual tanpa menentukan secara sempit apa yang membuatnya menentukan.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: mengapa kalian tidak tahu menilai
  rationale: πῶς membentuk pertanyaan retoris bernada teguran. Dalam bahasa Indonesia, 'mengapa' menyampaikan maksud idiomatisnya dengan jelas dan pengulangan 'tahu menilai' mencerminkan struktur Yunani.
theological_decisions:
- issue: Makna καιρός dalam teguran Yesus
  choice: zaman ini
  alternative: saat ini; masa ini; waktu yang menentukan ini
  rationale: Ungkapan ini menunjuk pada masa yang sedang berlangsung dan memiliki arti khusus dalam pelayanan Yesus. 'Zaman ini' menjaga dimensi temporal dan signifikansinya, tetapi tidak menambahkan penjelasan teologis yang tidak dinyatakan langsung oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk mempertahankan orang kedua jamak. Nada teguran dibuat tegas tetapi tetap wajar dan bermartabat. Penanda catatan kaki [a] ditempatkan sesudah frasa yang diterangkannya.
